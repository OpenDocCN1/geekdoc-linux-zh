    The previous example shows that 39,773 requests for memory were denied. This indicates
    a problem because this value should be 0. The example also shows that 78 MB of
    memory has been assigned to mbuf clusters, and that 98 MB of memory is being consumed
    by the network subsystem.


    If you increase the value of the socket subsystem attribute sbcompress_threshold
    to 600, the memory allocated to the network subsystem decreases to 18 MB, because
    compression at the kernel socket buffer interface results in a more efficient
    use of memory. Refer to Section 2.2.3.3 for more information on sbcompress_threshold


    ## 1.4.3 Socket Connections


    Each socket resides in a network connection. If the system allocates an excessive
    number of sockets, use the netstat -an command to determine the state of your
    network connections. The example shows the contents of the protocol control block
    table and the number of TCP connections currently in each state:


    ```

    # netstat -an | grep tcp | awk ''{print $6}'' | sort | uniq -c

    1 CLOSE_WAIT

    58 ESTABLISHED

    12 FIN_WAIT_1

    8 FIN_WAIT_2

    17 LISTEN

    1 SYN_RCVD

    15749 TIME_WAIT

    ```


    For servers, the majority of connections are usually in a TIME_WAIT state. If
    the number of entries in the FIN_WAIT_1 and FIN_WAIT_2 fields represent a large
    percentage of the total connections (add all of the fields), you may want to enable
    keepalive, as described in Section 2.3.2.5.


    If the number of entries in the SYN_RCVD field represents a large percentage of
    the total connections, the server may be overloaded or be experiencing TCP SYN
    attacks.


    Note in this example, there are almost 16,000 sockets being used, which requires
    16 MB of memory. Refer to Section 1.2 for more information on configuring memory
    and swap space.


    ## 1.4.4 Device Driver Errors


    For example:


    ```

    netstat -is

    tu0 Ethernet counters at Tue Aug 3 13:57:59 1999

    191 seconds since last zeroed

    1462024 bytes received

    4749029 bytes sent

    ```


