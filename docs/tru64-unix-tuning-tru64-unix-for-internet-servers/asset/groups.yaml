    # 1.6 Monitoring Virtual Memory Statistics


    The vmast command provides data on virtual memory usage. This may help you determine
    if a system is paging excessively, which can degrade Internet server performance.
    For example:


    ```

    # vm

    Virtual Memory Statistics: (pagesize 8192)

    memory pages intr cpu

    procs free zero react point in sy cs us yr id

    7526 59 0K 758 45K 420M 132M 139K 757 1K 38 14 8

    7526 59 18K 27K 45K 939 15 898 0 11 024 2K 85 11 4

    6528 11 28K 45K 353K 560 31 446 0 10 983K 3M 81 11 2

    7526 59 35K 45K 400 406 0 0 17 0781 2K 85 10 3

    7526 59 51K 45K 400 0 0 0 1 4K 79K 46 81 18 1

    9524 59 81K 350K 640 720 42 0 0 13 999 3K 85 13 2

    ```


    The values in the memory fields are specified in 8-KB pages. Check the size of
    the free page list (free). Compare the number of free pages to the active pages
    (act) and the wired pages (wire). The sum of the free, active, and wired pages
    should be close to the amount of physical memory in your system. Although the
    value for free should be small, if it is consistently small (less than 128 pages)
    and accompanied by excessive paging and swapping, you may have a physical memory
    shortage.


    Also, examine the (pout) field. If the number of pageouts is consistently high,
    you may have insufficient memory. You may also have insufficient swap space or
    your swap space may be configured inefficiently. Use the -s command to display
    your swap device configuration, and use the iostat command to display which swap
    disk is being used the most.


    Refer to vmstat(1), swap(8), and iostat(1) for your version of the operating system
    for more information:


    ```

    http://www.tru6unix.comaq.com/docs/pub_page/doc_list.html

    ```


    # 1.7 Gathering Configuration Information


    The sys_check script is a k script that gathers configuration information and
    formats it into an HTML file. It warns you if it detects configuration problems,
    checks your kernel attribute settings, and provides attribute tuning recommendations.


    Be sure to use the latest version of sys_check. You can obtain this at:


    ```

    http://www.tru6unix.comaq.com/sys_check/sys_check.html

    ```'
- md: '

    # 2 Tuning Recommendations


    This chapter offers tuning recommendations, including the following topics:


    - Displaying and modifying kernel subsystem attributes (Section 2.1)

    - Primary tuning recommendations (Section 2.2)

    - Advanced tuning recommendations apply at boot (Section 2.3)


    Not all recommendations apply to all configurations, and some provide only marginal
    performance improvements. Therefore, you must fully understand your configuration
    and workload, and carefully read the documentation before applying any recommendation.


    # Note


    Some attribute names have changed for Tru64 UNIX Version 5.0 and later. Refer
    to Table A–2 for more information on attribute name equivalences.


    ## 2.1 Displaying and Modifying Kernel Subsystem Attributes


    The operating system includes various attributes that define or extend the kernel.
    Kernel subsystem attributes are used to set kernel variables, which control subsystem
    behavior or track subsystem statistics. Attributes are assigned default values
    at boot time. For Internet servers, the default values of some attributes may
    not be appropriate, so you must modify these values to provide optimal performance.


    To display and modify kernel subsystem attributes, follow these steps:


    - Determine the operating system support for an attribute (Section 2.1.1)

    - Display the attribute values (Section 2.1.2)

    - Modify the attribute values (Section 2.1.3)


    ### 2.1.1 Operating Support for Attributes


    Some older versions of Tru64 UNIX do not support the attributes described in this
    document. Others restrict the methods that you can use to modify and display attributes,
    or they require operating system patches to use the attributes.


    To determine if your version of the operating system supports a particular kernel
    system attribute, use one of the following methods:


    - Refer to Table A–1 for support information.

    - Use the sysconfig -q attribute, the system command displays all the subsystem
    attributes that can be modified with the sysconfig or sysconfigdb command. If
    the system is not configured, the operating system displays a message similar
    to the following:


    ```

    framework error: subsystem ''inet'' not found

    ```


    If you specify an attribute, only the information specific to that attribute is
    displayed. For example:


    ```

    # sysconfig -q inet tcbhashize

    inet:

    tcbhashize = 32

    ```


    If the attribute is not supported or if it cannot be accessed using sysconfig,
    the operating system displays a message similar to the following:


    ```

    inet:

    tcbhashize = unknown attribute

    ```


    - Use the dbx p (print) command. If you cannot access the attribute, the operating
    system displays a message stating that the attribute is not defined or active.
    For example:


    ```

    # dbx -v munix

    dbx version 3.11.10

    Type ''help'' for help.

    # dbx p tcp_keepalive_default

    (dbx)_keepalive_default* is not defined or active

    (dbx)

    ```


    Refer to sysconfig(8) and dbx(1) for your version of the operating system for
    more information:


    http://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    ### 2.1.2 Displaying Attribute Values


    There are many methods that you can use to display the current value of a kernel
    system attribute and other descriptive information. Use the following methods
    to display attributes:


    - The Kernel Tuner (dxkerneltuner) graphical user interface (GUI) for display
    permanent, (run-time), minimum, and maximum values of attributes. Access the GUI
    through the Common Desktop Environment (CDE) Application Manager window; select
    the System_Admin icon, and then select the MonitoringTuning icon. You can then
    choose the subsystem whose attributes you want to display.

    - The sysconfig -q subsystem [attribute] command to display the current (run-time)
    value of the specified attribute or, if an attribute is not specified, all the
    attributes for the specified subsystem:


    ```

    sysconfig -q subsystem [attribute]

    ```


    For example:


    ```

    # sysconfig -q vm ubc_maxpercent

    uubc_maxpercent = 100

    ```


    - The sysconfig -Q subsystem maximum and minimum values of the attributes for
    the specified subsystem. If you specify a particular attribute, the system displays
    information only for that attribute.


    The output command also includes information about the operations that you can
    perform on the attribute. The following lists various operations:


    - C - The attribute can be modified when the subsystem is initially loaded; if
    so, the attribute supports boot, permanent modifications.

    - R - The attribute can be tuned at run time; that is, you can modify the value
    that the system is currently using.

    - Q - The attribute''s current value can be displayed (queried).


    For example:


    ```

    # sysconfig -q vfs bufcache

    vfs: bufcache    type=int op=q min_val=0 max_val=50

    ```


    The output of the previous command shows that the minimum value of the bufcache
    is 0 and the maximum value is 50. The output also shows that you cannot modify
    the current (run-time) value.


    For older versions of the operating system, you must use the dbx (print) command
    to display the current value of a kernel variable, instead of an attribute. For
    example:


    ```

    # dbx -kunix

    dbs version 3.11.10

    Type ''help'' for help.

    (dbx) p import_userreserved

    5000

    (dbx)

    ```


    Refer to dkxnerntuner(8), sysconfig(8), and dbx(1) for your version of the operating
    system for information:


    http://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    ### 2.1.3 Modifying Attribute Values


    There are various cases, you can modify the current (run-time) value of attribute.
    The method you use depends on the version of the operating system you are running,
    as specified in Table A–1, and whether you want to modify the current (run-time)
    value of an attribute or modify attribute''s permanent value. You must be root
    to modify attribute values.


    The following sections describe how to modify the permanent values.


    #### 2.1.3.1 Current Value


    In some cases, you the current (run-time) value of an attribute. This allows you
    to determine if modifying an attribute will improve your system performance without
