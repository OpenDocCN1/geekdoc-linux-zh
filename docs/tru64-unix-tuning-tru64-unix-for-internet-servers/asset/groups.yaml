    # 1.4.1 Input Output Errors and Collisions


    Network collisions are a normal part of network operations. A collision can occur
    when two or more Ethernet stations attempt to transmit simultaneously on the network.
    If a station is unable to access the network because one is already use, it will
    start trying to access the network for a short period of time, before attempting
    to access the network again. A collision occurs each time a station fails to access
    the network. Most network cards will attempt a maximum of 15 times, after which
    they will drop the packet and indicate an excessive collisions error.


    Use the output of the netstat -l command to check for input errors (Ierr), output
    errors (Oerr), and collisions (Coll). Compare the values in these fields with
    the total number of packets sent. High values may indicate a network problem.
    For example, cases may not be connected properly or the Ethernet may be saturated.
    A collision rate up to ten percent may not indicate a problem on a busy Ethernet.
    However, a collision rate of more than twenty percent could indicate a problem:


    | Name Mtu Network Address | Ierr Lerts | Opkts Oerr Coll |

    |---|---|---|---|---|---|---|---||

    | tul | 1500 Link | 00:00:a1:00:c1:00 | 0 | 0 | 43427 | 0 | 0 |

    | tul | 1500 | none | 0 | 0 | 41427 | 0 | 0 |

    | tul | 1500 Link | bb:00:03:01:64:64 | 96347 | 138 | 90253 | 118 | 80006 |

    | tul | 1500 | none | 96347 | 138 | 90253 | 118 | 80006 |

    | tul | 1500 o-net | plume | 96347 | 138 | 90253 | 118 | 80006 |


