    ## Related Documentation


    The following documentation supplements information in this document:


    ## Best Practices


    For information on improving large-memory system performance, refer to the Improving
    Large-Memory System Performance Best Practice at the following URL:

    http://www.tru64unix.compaq.com/docs/best_practices/VLM_BP/TITLE.HTM


    ## Manuals


    The Tru64 UNIX operating system manuals provide important information that supplements
    the information in this document:


    - **System Configuration and Tuning** contains detailed information on configuring
    and tuning high-performance and high availability systems.

    - **System Administration** describes how to configure, use, and maintain the
    Tru64 UNIX operating system.


    You can access these manuals on line for your version of the operating system
    at the following URL:

    http://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    ## Reference Pages


    The Tru64 UNIX reference pages contain descriptions of the attributes:


    - sys_attrs_generic(5)

    - sys_attrs_inet(5)

    - sys_attrs_net(5)

    - sys_attrs_proc(5)

    - sys_attrs_socket(5)

    - sys_attrs_vmt(5)


    You can access the reference pages on line for your version of the operating system
    at the following URL:

    http://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    ## Reader''s Comments


    We welcome any comments and suggestions you have on this and other Tru64 UNIX
    manuals.


    You can send your comments in the following ways:


    - Fax: 603-884-0120 Attn: UBPG Publications, ZKO3-3/Y32

    - Internet electronic mail: readers_comment@zk3.dec.com

    - A Reader''s Comment form is located on your system in the following location:

    /usr/doc/readers_comment.txt


    Please include the following information along with your comments:


    - The full title of the book and the order number. (The order number is printed
    on the title page of this book and on its back cover.)

    - The section numbers and page numbers of the information on which you are commenting.

    - The version of Tru64 UNIX that you are using.

    - If known, the type of processor that is running the Tru64 UNIX software.


    The Tru64 UNIX Publications group cannot respond to problems or technical support
    inquiries. Please address technical questions to your local system vendor or to
    the appropriate Hewlett-Packard Company technical support office. Information
    provided with the software media explains how to send problem reports to Hewlett-Packard
    Company.


    ## Conventions


    This document uses the following conventions:


    - : A vertical ellipsis indicates that a portion of an example that would normally
    be present is shown.

    - … In syntax definitions, a horizontal ellipsis indicates that the preceding
    item can be repeated one or more times.

    - file italic (slanted) type indicates variable values, placeholders, and function
    parameter names.

    - buf In function definitions and syntax definitions used in driver configuration,
    this typeface identifies names that you must use exactly as shown.

    - [] In formal parameter declarations in function definitions and in structure
    declarations, brackets indicate arrays. Brackets also specify ranges for device
    minor numbers and device special files in file fragments. However, for the syntax
    definitions that are used in driver configuration, these brackets indicate items
    that are optional.


    Vertical bars separating items that appear in the syntax definitions used in driver
    configuration indicate that you choose one item from those listed.


    ## Improving Internet Server Performance


    This chapter describes how to improve your Internet server performance. It offers
    various configuration guidelines and describes several monitoring tools, including
    the following topics:


    - Configuring hardware (Section 1.1)

    - Configuring memory and swap space (Section 1.2)

    - Logging IP addresses (Section 1.3)

    - Monitoring network statistics (Section 1.4)

    - Monitoring socket statistics (Section 1.5)

    - Monitoring virtual memory statistics (Section 1.6)

    - Gathering configuration information (Section 1.7)


    > Note

    Install the latest release of Tru64 UNIX and the latest patches that are recommended
    for your operating system version.


    ## 1.1 Configuring Hardware


    The following hardware configuration guidelines can help to improve Internet server
    performance:


    - Make sure you have the latest version of the firmware for your system, disks,
    adapters, and controllers.

    - Ensure that you have sufficient memory and swap space to handle the workload.

    - Use high-performance storage hardware, including disks, adapters, and controllers
    in your Internet server configuration.

    - Use Logical Storage Manager (LSM) or hardware storage configurations for high
    performance and high availability.

    - Use write-back caches in hardware RAID configurations to significantly improve
    Internet server performance.

    - Place the /tmp and /var/tmp directories in different file systems, and if possible,
    different disks. For optimal performance, place the directories on disks under
    control of a RAID controller with the write-back cache option enabled.


    ## 1.2 Configuring Memory and Swap Space


    You must provide sufficient memory and swap space to handle the server workload.
    Insufficient memory resources and swap space will cause performance problems.
    To configure memory and swap space, follow these steps:


    1. Determine how much physical memory your workload requires.

    2. Choose a swap space allocation, either immediate or deferred.

    3. Determine how much swap space you need.

    4. Configure the swap space in order to efficiently distribute the disk I/O.


    In addition to the memory needed for system and application operations, each connection
    to an Internet server requires memory resources for the following:


    - Kernel socket structure

    - Internet protocol control block (inpcb) structure

    - TCP control block structure

    - Any buffer space is needed as packets arrive and are consumed


    These memory resources total 1 KB for each connection endpoint (not including
    the socket buffer space), which means that you will need 10 MB of memory to accommodate
    10,000 connections.


    You must ensure that your server has enough memory to handle demanding peak loads.
    Configure more memory than the server requires on a busy day, so that you have
    sufficient memory to handle occasional spikes of activity.


    There are no limitations on the server''s ability to handle millions of TCP connections
    if memory resources are available to service the connections. However, if you
    do not have sufficient memory, the server will reject new requests unless existing
    connections are freed. Use the `netstat -m` command to monitor the memory that
    is currently being used by the network subsystem. Refer to Section 1.4 for more
    information on the `netstat` command.


    ## 1.3 Logging IP Addresses


    If your Internet server logs client host names, the application software forces
    the system to perform a reverse DNS lookup in order to obtain the client''s host
    name. Reverse DNS lookups are time-intensive and may cause performance problems
    on busy servers with many clients.


    You can modify the Internet software to log client Internet Protocol (IP) addresses,
    instead of client host, without losing any significant information. Logging IP
    addresses may significantly improve the efficiency of the Internet server.


    Consult the documentation provided by the Internet server vendor to determine
    how to disable the logging of client host names. For example, you can obtain information
    about modifying Apache HTTP Server software from the Apache HTTP Server documentation
    site at this URL:


    ```

    http://http.apache.com/docs/

    ```


    ## 1.4 Monitoring Network Statistics


    The netstat command displays network statistics, including information about network
    routes and active sockets for each protocol. The command also displays cumulative
    statistics for network interfaces, including the number of incoming and outgoing
    packets and packet collisions, information memory used for network operations,
    and statistics related to IP, ICMP, TCP, and UDP protocol layers.


    You can use the netstat command to check for the following:


    - Input and output errors and collisions (Section 1.4.1)

    - Network memory usage (Section 1.4.2)

    - Socket connections (Section 1.4.3)

    - Device driver errors (Section 1.4.4)

    - Dropped or lost packets (Section 1.4.5)

    - Retransmissions, out-of-order packets, and bad checksums (Section 1.4.6)

    - Routing statistics (Section 1.4.7)

    - Network protocol statistics (Section 1.4.8)


    The following sections describe how to use netstat to check for these conditions.
    Refer to netstat(1) for your version of the operating system for more information:


    ```

    http://www.tru64unix.compaq.com/docs/pub_page/doc_list.html

    ```

