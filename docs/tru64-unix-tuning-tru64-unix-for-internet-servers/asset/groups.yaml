    1 receive failures, reasons include: Frame destination

    0 unrecognized frame destination

    0 data overruns

    0 system buffer unavailable

    0 user buffer unavailable


    The previous example shows that the sent 11,017 blocks. Of those blocks, 1,013
    (347 + 666) blocks had collisions, which represents approximately 10 percent of
    the blocks sent. A collision rate of up to 10 percent may not indicate a problem
    on a busy Ethernet. However, a collision rate of more than 20 could indicate a
    problem.


    In addition, the following fields could be 0 or a low single-digit number:


    - send failures

    - receive failures

    - data overruns

    - system buffer unavailable

    - user buffer unavailable


