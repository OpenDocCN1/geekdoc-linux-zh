  md: '# About This Document


    This document describes how to tune the Tru64 UNIX operating system to improve
    the performance of Internet servers, including Web servers, ftp servers, mail
    servers and proxy servers, caching servers, gateway systems, and firewall systems.


    > Note

    The recommendations result from testing Tru64 UNIX systems running Internet server
    software such as AltaVista (www.altavista.com). Not all recommendations are appropriate
    for all types of systems.


    # Audience


    This document is intended for systems administrators who are responsible for managing
    a Tru64 UNIX operating system for Internet servers. Administrators should have
    an in-depth knowledge of their applications and users, in addition to operating
    system concepts, commands, and utilities. Such an understanding is crucial to
    successfully tuning a system for better performance.


    # New and Changed Features


    There are no technical updates or changes for this version of the document.


    # Organization


    This document is organized as follows:


    +   * Chapter 1

    Provides information on how to improve Internet server performance.

    * Chapter 2nProvides tuning recommendations and examples on how to tune your system.

    * Appendix A

    Lists each attribute and the version of Tru64 UNIX that supports them. Compares
    the attribute names for different versions of Tru64 UNIX and identifies which
    attributes can be tuned at run.

    * Appendix B

    Gives a revision history of the document.'
  merge: -1
  pgno: 6
