    # 2.3.2.6 Increasing the TCP Connection Timeout Rate


    The tcp_msl attribute determines the maximum lifetime of a TCP segment and the
    timeout value for the TIME_WAIT state. The TCP protocol includes a concept known
    as the Maximum Segment Lifetime (MSL). When a TCP connection enters the TIME_WAIT
    state, it must remain in this state for twice the value of the MSL, or until undetected
    data errors on future connections can occur.


    You can decrease the value of this attribute to make the TCP connection time out
    more quickly at the end of a connection. However, this will increase the chance
    of data corruption.


    The default value is 60 (30 seconds, which means that the TCP connection remains
    in TIME_WAIT state for 60 seconds or twice the value of the MSL). The default
    value of this attribute is set in units of 0.5 seconds. The recommended value
    is the default value; if you use a different value, there is the potential for
    data corruption.


    Although the TCP specifications specify an MSL of 120 seconds, most TCP implementations
    use a value that is less than 120. The Internet FAQ Consortium Web site offers
    more information. For RFC793, refer to the following URL:


    ```

    http://www.rfc.org/rfc793.html

    For RFC1122, refer to the following URL:

    http://www.rfc.org/rfc1172.html

    ```'
