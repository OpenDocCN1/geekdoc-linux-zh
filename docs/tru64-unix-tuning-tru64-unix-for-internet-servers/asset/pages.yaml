    bad data length fields, bad checksums, and full sockets, which should have low
    values. No port field specifies the number of packets that arrived destined for
    a nonexistent port (for example, rhosts or routed broadcast packets) and were
    subsequently discarded. A large value for this is normal and does not indicate
    a performance problem. For example:


