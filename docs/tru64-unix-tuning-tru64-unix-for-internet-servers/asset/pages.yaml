  md: 'Too much memory allocated to the UBC can cause excessive paging and swapping,
    which may degrade overall system performance. However, an insufficient amount
    of memory allocated to the UBC can degrade file system performance.


    The ubc_minpercent attribute specifies the minimum percentage of memory that only
    the UBC can utilize. The remaining memory is shared with processes. The ubc_maxpercent
    attribute specifies the maximum percentage of memory that the UBC can utilize.
    The ubc_borrowpercent attribute specifies the UBC borrowing threshold.


    Between the value of ubc_borrowpercent attribute and the value of the ubc_maxpercent
    attribute, the memory that is allocated to the UBC is considered borrowed from
    processes. When paging begins, these borrowed pages are reclaimed first, until
    the amount of memory allocated to the UBC decreases the value of the ubc_borrowpercent
    attribute.


    The default value for ubc_minspercent is 10 percent. The default value for ubc_maxpercent
    is 100 percent. The default value for ubc_borrowpercent is 20 percent. On a typical
    Internet server, the default value for each attribute is usually adequate. Also,
    if your disks are busy with file system I/O and the system has sufficient free
    pages, use the default values.


    Use the vmstat command to display information about virtual memory, including
    the free page count.


    If you have a low free page count, you may want to increase the memory available
    to processes by reducing the memory available to the UBC. You should attempt to
    keep in memory the working set of your processes, or it increases the number of
    UBC misses.


    You can reduce the default value of the ubc_maxpercent attribute in increments
    of 10 percent.


    Reducing the borrowed memory by decreasing the value of the ubc_borrowpercent
    attribute may improve the system response time when memory is low. However, this
    may reduce UBC performance.


