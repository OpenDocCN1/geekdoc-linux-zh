- img_proc: true
  md: '# ### 2.1.3 Modifying Attribute Values


    There are various cases, you can modify the current (run-time) value of attribute.
    The method you use depends on the version of the operating system you are running,
    as specified in Table A–1, and whether you want to modify the current (run-time)
    value of an attribute or modify attribute''s permanent value. You must be root
    to modify attribute values.


    The following sections describe how to modify the permanent values.


    # #### 2.1.3.1 Current Value


    In some cases, you the current (run-time) value of an attribute. This allows you
    to determine if modifying an attribute will improve your system performance without
    rebooting the system. Not all attributes can be tuned at time, and the temporary
    modifications are lost when you reboot the system. Refer to Table A–2 or use the
    sysconfig -Q command to determine whether an attribute can be tuned at run time.


    To modify an attribute''s current (run-time) value, use one of the following methods:


    +   * The Kernel Tuner (dxkerneluner) GUI supports this operation. Access the
    GUI through the Common Desktop Environment (CDE) Application manager window; select
    the System_Admin icon, and select the MonitoringTune icon. Choose the attribute
    you want to modify, and enter the new value in the Current Value field.


    +   * The sysconfig -r command, if the attribute supports this operation. Use
    the following syntax:


    ```

    sysconfig -r inet tcp_keepin=300

    ```


    For example:


    ```

    ```

    dbx -k /vmunix

    dbx version 3.11.10

    Type ''help'' for help.


    (dbx) assign import_userreserved=60000

    60000

    ```

    ```


    For older versions of the operating system, you must use the dbx assign command
    to modify the current value of a kernel variable, instead of an attribute. However,
    modifications with the dbx assign command are lost when you reboot the system.
    Use the following command syntax:


    ```

    dbx attribute=value

    ```


    For example:


    ```

    ```

    dbx -k /vmunix

    dbx version 3.11.10

    Type ''help'' for help.


    (dbx) assign import_userreserved=60000

    60000

    ```

    ```'
  merge: -1
  pgno: 25
- img_proc: true
  md: '(dbx)


    Refer to dxkerneltuner(8X), sysconfig(8), and dbx(1) for your version of the operating
    system for more information:

    ://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    #  2.1.3.2 Permanent Value


    To modify an attribute''s permanent (boot-time) value, the sysconfigtab file must
    contain the subsystem name, the attribute name and value of the attribute. Do
    not manually modify the sysconfigtab file. To make these modifications, use one
    of the following methods:


    +   - The Kernel Tuner (dxkerneltuner) Access the GUI through the Common Desktop
    Environment (CDE) Application Manager window, select the MonitoringTuning icon.
    Choose the whose attribute you want to modify, and enter the new value in the
    Boot Time Value field.


    +   - The sysconfigdb Use the following command syntax:

    sysconfigdb -a stanz file_subsystem


    The stanza_file is a specially formatted file that contains the name of the subsystem
    and a list of attributes and values. This file is merged into the sysconfigtab
    file. Refer to stanza(4) for your version of the operating system for more information:

    ://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    To use the new attribute value, you must invoke the sysconfig -r if the attribute
    can be tuned on run, or reboot the system.


    In addition, you can use the dbx patch to modify the value of a variable, as well
    as the on-disk /vunix image file.


    Refer to dxkerneltuner(8X), sysconfig(8), and sysconfigdb(8) for more information.
    Refer to the System Administration manual for your version of the operating system
    for information about modifying the system configuration file:


    ://www.tru64unix.compaq.com/docs/pub_page/doc_list.html


    #  2.2 Primary Tuning Recommendations


    There are many kernel subsystem attributes that affect Internet performance. Internet
    servers include Web servers, ftp servers, mail servers and relays, proxy servers,
    caching servers, gateway systems, and firewall systems. This section offers tuning
    recommendations for some of the attributes for the following subsystems:


    +   - Internet (Section 2.2.1)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '+   - Process (Section 2.2.2)

    - Socket (Section 2.2.3)

    - Virtual Memory (Section 2.2.4)


    # Note


    Some kernel subsystem attributes enable you to modify their value and apply the
    value to a running system. Other attributes require you to reboot the system to
    use a new value. Refer to Section 2.1.3.1 to determine if an attribute can be
    tuned at run time.


    The primary tuning recommendations provide the best performance improvement for
    most Internet server configurations. If performance is still deficient after applying
    these recommendations, you may be able to improve performance by modifying additional
    kernel subsystem attributes, as discussed in Section 2.3.


    You can also use the Compaq Continuousing Infrastructure (CPI), formerly known
    as DCPI to obtain detailed information about components that heavily utilize CPU
    cycles. CPI is offered as an Advanced Development Kit. Refer to the following
    location for more information:


    ```

    http://www.tru64unix.comq/dcpni

    ```


    # 2.2.1 Modifying Internet Attributes


    You may be able to improve Internet server performance by tuning the following
    Internet (inet) subsystem attributes:


    +   - tcbashsize (Section 2.2.1.1)

    - pmtu_enabled (Section 2.2.1.2)

    - import_userreserved (Section 2.2.1.3)


    # 2.2.1 Increasing the size of the TCP Hash Table


    The tcbashsize attribute specifies the number of buckets in the Transmission Control
    Protocol (TCP) hash table. The kernel must look up the connection for every TCP
    packet it receives; therefore, increasing the size of the table can speed up the
    search and improve performance.


    However, increasing the size of the hash table will cause a slight increase in
    wired memory. It can also cause a bottleneck at the TCP hash table in SMP systems.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'The default value is 512 buckets (32 on systems running a version of Tru64
    UNIX prior to Version 4.0E). The **recommended value is 16384**.


    # 2.2.1.2 Disabling PMTU Discovery


    Packets transmitted between servers are divided into equal-sized units to facilitate
    the transmission of the data over routers and small-packet networks, such as Ethernet
    networks.


    When the **pmtu_enabled** attribute is enabled, the operating system determines
    the largest common path maximum transmission unit (PMTU) between servers and uses
    it as the unit size. A routing table entry is also created for each client network
    that attempts to connect to the server.


    If you have a poorly performing Internet server that handles mainly remote traffic
    and the routing table increases more than 1000 entries, disabling the PMTU discovery
    can decrease the size of the routing table, which may improve server efficiency.
    However, if a server handles mainly local traffic and only remote traffic, disabling
    PMTU discovery can degrade bandwidth. Use the `netstat -r` command to display
    the contents of the routing table.


    The default value is 1 (PMTU enabled). The **recommended value is 0** (PMTU disabled).


    # 2.2.1.3 Increasing the Number of Outgoing Connection Ports


    When a TCP or UDP application creates an outgoing connection, the kernel dynamically
    allocates a nonreserved port number for each connection.


    The kernel selects the port number from a range of values between `ipport_userreserved_min`
    (if you are running Tru64 UNIX Version 4.0E or higher) or 1024 (if you are running
    Version 4.0D or earlier), or `ipport_userreserved`.


    Using the default attributes, the range of outgoing ports begins at port 1024
    and ends at 5000, and the number of simultaneous connections is limited to 3976
    (5000 minus 1024).


    If you have a proxy server, caching server, gateway system, or firewall system,
    with a load of more than 4000 simultaneous connections, you can modify the value
    of the `ipport_userreserved` attribute. The default value is 5000, which is the
    minimum value. The **recommended value is 65535**, which is the maximum value.
    Do not specify a value that is greater than 65535 or lower than 5000.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# ## 2.2.2 Modifying Process Attributes


    You may be able to improve Internet server performance by tuning the following
    process (proc) subsystem attributes:


    +   - maxusers (Section 2.2.2.1)

    - max_proc_per_user (Section 2.2.2.2)

    - max_threads_per_user (Section 2.2.2.3)

    - max_proc_data_size (Section 2.2.2.4)

    - max_per_proc_address_space (Section 2.2.2.5)


    These attributes limit on system resources. If your Internet server appears to
    be reaching the resource limits, you may want to increase the value of one or
    more of these attributes. However, increasing the value of these attributes will
    allow the system to consume more memory.


    # ### 2.2.2.1 Increasing the Size of System Tables and Data Structures


    System algorithms use the maxusers attribute to size various system data structures
    and system tables. Increasing the value of maxusers provides more system resources
    to processes. However, this will increase the amount of wired memory.


    If your system experiences a lack of resources (for example, Out of processes,
    No processes, or table is full messages) and you have sufficient memory, increase
    the value of the maxusers attribute.


    To determine an appropriate value for the maxusers attribute, you can double the
    default value until you improve performance. For example, if you have up to 1
    GB of memory, increase the value of the maxusers attribute to 512. If you have
    up to 2 GB, increase the value to 1024. If you have an Internet, Web, proxy, caching,
    firewall, or gateway server, increase the value of the maxusers attribute to 2048.


    The default values vary from 16 to 2048, depending on the amount of physical memory
    in the system. It is not recommended that you increase the value to more than
    2048.


    System administrators can change the maxusers attribute with the following command:


    ```

    # sysconfig -r maxusers=n

    ```


    The N is the desired value. For Tru64 UNIX version 5.0A or later, this command
    triggers the automatic expansion of the pid table. The resizing of other system
    tables is not performed until you specify a new value for the maxusers attribute
    in the /etc/sysconfig file and reboot the system.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# 2.2.2.2 Increasing the Number of Processes per User


    The **max_proc_per_user** attribute specifies the maximum number of processes
    that can be allocated at any time to each user, except superuser.


    If your system experiences a lack of processes, increase the value of this attribute.
    If you have a multiprocess Internet server (for example, a server running Planet,
    Apache, CERN, or Zeus), you may also want to increase the value of this attribute.


    The default value is 64. The **recommended value is 2000**. The value you choose
    not be more than the maximum number of processes that can be started by your system.
    For Internet servers, these processes include CGI processes. If you specify a
    value of 0 (zero) for this attribute, there is no limit on the number of processes
    per user.


    # 2.2.2.3 Increasing the Number of Threads per User


    The **threads_per_user** attribute specifies the maximum number of threads that
    can be allocated at any time to each user, except superuser.


    If your system experiences a lack of threads, increase the value of this attribute.
    If you have a multithreaded Internet server (for example, a server running Netscape
    FastTrack or Netscape Enterprise), you may also want to increase the value of
    this attribute.


    The default value is 256. The **recommended value is 4096**. The value must not
    be more than the maximum number of threads that can be started by your system.


    # 2.2.2.4 Increasing the User Process Data Size Limits


    The **max_proc_data_size** attribute specifies the maximum limit of data segment
    sizes. Large programs and large-memory processes may not run unless you increase
    the values of this attribute. Increase the limits if you receive an *Out of process
    memory* message.


    The default value is 1073741824 (1 GB). The **recommended value is** 10 GB of
    memory. If your system has more than 10 GB of memory, you can increase this value.


    # 2.2.2.5 Increasing the User Process Address Space Limits


    The **max_proc_address_space** attribute specifies the maximum limit of user process
    address space (number of bytes of virtual memory). Large programs and large-memory
    processes may not run unless you increase the value of this attribute. However,
    increasing the address space limits cause a small increase in memory consumption.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'The default value is 1073471824 (1 GB) for systems running Tru64 UNIX Version
    4.0G and earlier, and 4294967296 (4 GB) for systems running Tru64 UNIX Version
    5.0 or higher.


    The **recommended value** is 10734718240 (10 GB). If your system has more than
    10 GB of memory, you can further increase this value.


    # 2.2.3 Modifying Socket Attributes


    You may be able to improve Internet server performance by tuning the following
    socket attributes:


    +   * somaxconn (Section 2.2.3.1)

    * sominconn (Section 2.2.3.2)

    * sbcompress_threshold (Section 2.2.3.3)


    # 2.2.3.1 Increasing the Maximum Number of Pending TCP Connections


    The **somaxconn** attribute specifies the maximum number of pending TCP connections
    (the socket listen queue limit) for each server socket (for example, the HTTP
    server). Pending TCP connections can be caused by lost packets in the Internet
