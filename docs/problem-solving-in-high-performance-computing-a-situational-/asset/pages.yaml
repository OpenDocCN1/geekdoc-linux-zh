    # PROCESS ACCOUNTING


    Troubleshooting Linux problems may not be effective in real time, and you will
    want to analyze data at later time. Process accounting is one of the methods that
    can narrow down the investigation. For instance, if a server is suddenly rebooted
    using the system reboot command, you will not have the opportunity to examine
    the issue while it is happening, but a post-reboot check will be warranted.


    If the kernel is built with the process accounting option enabled, it is possible
    to start process accounting. With the mechanism in place, the kernel will write
    a record to the accounting log file as each process terminates. This record contains
    information about the terminated process including user and system CPU time, average
    memory usage, and group IDs, command name, and other data types.


    By default, the accounting writes to /var/account/pactct. The path may differ,
    and the files might be located under /var/log or even /var/adm. If it is not enabled,
    it can be turned on with /usr/sbin/acct. Accounting files are binary, so you will
    need to use a dumping utility (dump-acct) to convert them into a human-readable
    format.


    ```

    dump-acct /var/account/pactct > /tmp/human-readable-acct-log.log

    ```


