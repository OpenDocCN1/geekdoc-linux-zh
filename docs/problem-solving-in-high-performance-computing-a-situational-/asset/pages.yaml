    # WORKING WITH PERF


    The analysis of system issues may not be limited to the user space. Problems affecting
    your instance base may have a deeper root cause. In such scenarios, the use of
    tools such as strace, ltrace, and others will not be effective enough. At this
    stage, it is prudent to explore additional software, such as process debuggers
    and profiling tools.


    Profiling is a way of dynamic analysis that measures metrics of a program, like
    memory or time complexity, the usage of particular instructions, frequency and
    duration of function calls. The most common use of profiling information is to
    aid program optimization. Profiling is achieved by instrumenting either the program
    source code or its binary executable using a tool called a profiler (or'
