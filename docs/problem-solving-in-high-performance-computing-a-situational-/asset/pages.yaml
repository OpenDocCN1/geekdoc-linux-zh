- pgno: 109
  md: '# CHAPTER 5 Getting geeky – tracing and debugging applications


    code profiler. A number of different techniques are used by profilers, such as

    event-based, statistical, instrumented, and simulation methods.


    There are many commercial products available on the market. For example,

    you may be interested in Intel&trade; VTune Amplifier(Inlet(R) VTune) Amplifier
    XE 2013, n.d.), a performance analysis tool for 32- and 64-bit x86-based machines.
    Although basic features work on both Intel and AMD hardware, advanced hardware-based
    sampling requires an Intel-manufactured CPU. The VTune Amplifier assists in various
    kinds of code profiling including stack sampling, threading, and hardware event
    sampling. The profiler result consists of details such as time spent in each subroutine,
    which can be drilled down to the instruction level. The time taken by instructions
    is indication of any stalls in the pipeline during instruction execution. The
    tool can also be used to analyze performance.


    Then, you may also want to explore and use Valgrind(Valgrind, n.d.), a programming
    tool for debugging, memory leak detection, and profiling. Valgrind is in essence
    a virtual machine using just-in-time (JIT) compilation techniques, including dynamic
    instrumentation.


    Both these tools, as others, require their drivers to be installed and used on
    the target host to perform the collection and analysis. In this section, we will
    not focusing on commercial implementations of profiling. Instead, we will examine
    a built-in kernel functionality called perf, available in the mainline release
    since version 2.6.31 (Perfcounters added to the mainline, n.d.).


    # INTRODUCTION


    Perf(Linux profiling with perf, n.d.) is a performance analyzing tool in Linux.
    The user-space controlling utility called perf has git-like interface with subcommands.
    It is capable of statistical profiling of every system (both kernel and user code),
    single CPU, or several threads.


    The interface between the utility and the kernel consists of a single syscall
    (sys_perf_event()) and is done via a file descriptor and a mapped memory region.
    Perf also uses special registers on the CPU to count events. Additional calls
    are available for those who want to set performance monitoring in their code.
    However, this is beyond the scope of this section.


    Since most of the functionality is integrated into the kernel, perf does not require
    a system daemon and introduces a very low overhead, which makes it suitable for
    most tasks. Furthermore, perf works on a variety variety architecture platforms
    with hardware counters, including x86, PowerPC64, UltraSPARC III and IV, ARM v5,
    v6, v7, Cortex-A8 and A9, Alpha EV56, and SH.


    # WHY NOT PROFILE?


    Another performance tool, very closely related to perf, is Oprofile(Oprofile,
    n.d.). OProfile is a system-wide statistical profiling tool for Linux, originally
    written for'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Working with perf 101


    the Linux kernel 2.4. It consists of a kernel module, a user-space daemon, and
    several user-space tools. The basic usage model is very similar to perf. In fact,
    one may claim that perf is the successor to OProfile, with the notable distinction
    of having added to the mainline kernel.


    OProfile is capable of profiling an entire system or its parts, from interrupt
    drivers to user-space processes. It has a low overhead. The most portable mode
    of OProfile uses a system timer to generate sampling interrupts. A less portable
    mode allows hardware performance counters to be used for sampling events generation
    on server. In the Linux 2.6 family and above, there is wide support for processor
    architectures including x86 (32 and 64 bit), DEC, MIPS, ARM, spc64, ppc64, and
    AVR32.


    Because of the similarity between the two tools and the fact that perf is part
    of the mainline kernel, we will focus on perf over OProfile, which remains beyond
    the scope of this. However, several online references (Smashing performance with
    OProfile, n.d.) (Tuning Performance with OProfile, n.d.) (Linux super-duper admin
    tools: OProfile, n.d.) provide a good starting point to testing and using OProfile.


    # PREREQUISITES


    The use of performance analysis tools is far from trivial. In most cases, it requires
    a very good understanding of the system and expected behavior to yield meaningful
    results. Moreover, you should be proficient in the Linux core concepts and have
    some programming knowledge to be able to utilize the tools to the best effect.


    # BASIC USAGE


    The perf userspace package consists of several commands. Sometimes, these commands
    may be available as standalone wrapper scripts or binaries. The most basic syntax
    is


    ```

    perf <command> <optional arguments>

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Available commands include the following:


    +   - stat: measure event count for single program or for some time it

    - top: top-like dynamic view of hottest functions

    - record: measure and save sampling data for single program

    - report: analyze file generated by perf record; can generate flat, or graph profile;

    - annotate: annotate sources or assembly

    - sched: tracing/measuring of scheduler actions and latencies

    - list: list available events'
