  md: '# Examine kernel tunables


    # SYSCTL


    Before we delve deeper, an important question arises. Assuming that we did testing
    and changed certain parameters, how can we make sure that they are preserved between
    reboots?


    This can be achieved using the sysctl (sysctl(8), n.d.) tool, which can modify
    kernel parameters at runtime. The static configuration for sysctl is stored under
    etc/sysctl.conf, and it may contain some or all parameters that override system
    defaults. The snippet below shows a sample configuration from a file. Commands
    are optional, but highly useful, especially if less common options are used.


    response to broadcasts.


    ```

    ```

    # Disable response to broadcasts


    # Disable response to broadcasts


    # You don''t want yourself becoming a Smurf amplifier


    net.ipv4.icmp_echo_ignore_broadcasts = 1


    # enable route verification on all interfaces


    net.ipv4.conf.all.rp_filter = 1


    # enable ipv6 forwarding


    net.ipv6.conf.all.forwarding = 1


    # increase the number of possible notify(7) watches


    fs.inotify.max_user_watches = 65536

    ```

    ```


    Additionally, the tool can be used from the command line to perform specific values.
    There are several useful flags available.


    +   - -A – Print all values. When stored to a file, they can be used to compare
    system configurations, if the hardware and kernel are supposedly identical. It
    is an excellent way of driving standardization in the environment, as well as
    testing changes and trying to understand why two or more hosts with supposedly
    the same setup exhibit different results or behavior.

    - -w – Set a change to a sysctl setting.

    - -p – Load changes from a configuration file (usually sysctl.conf).


    The command line use is also very convenient, namely:


    ```

    ```

    /sbin/sysctl -a

    /sbin/sysctl -w sunrpc.min_resvport = 200

    ```

    ```'
