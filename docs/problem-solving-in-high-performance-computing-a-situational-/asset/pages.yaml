    The most used and common options include the following:


    +   - -A - Report everything. This option is equivalent to -bBdqrRSuvwWy -I SUM
    - XALL -n ALL -u ALL -P ALL

    - -b - Report I/O transfer statistics.

    - -d - Report activity for each block device. Effectively, the information shown
    here is metrics reported by iostat.

    - -i - Set interval for data collection.

    - -n - Report network statistics.

    - -P { cpu | ALL } - Report per-processor statistics for the specified processor
    or processors. Specifying the ALL keyword reports statistics for each individual
    processor, and globally for all processors. Processors are enumerated from 0.

    - -q - Report queue length and load averages.'
