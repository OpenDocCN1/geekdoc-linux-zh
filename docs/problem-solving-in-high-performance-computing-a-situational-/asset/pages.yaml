  md: '# Working with strace and ltrace 81


    +   - -f Trace child processes as are created by currently traced processes as
    a result of the fork(2) system call. On non-Linux platforms the new process is
    attached as soon as its pid is known (the return value of fork(2) in the parent
    process). This means that children may run uncontrolled for a while (especially
    when a vfork(2)), until the parent is scheduled to complete its (vfork(2)) call.
    On Linux the child is traced from its first instruction no delay. If the parent
    process waits(2) for a child that is currently being traced, it is suspended until
    an appropriate process either terminates or incurs a signal that would cause it
    to terminate (as determined from the child''s current signal)

    - -ff If the -o filename option is in effect, each process is written to filename
    where pid is the numeric process of each process. This is incompatible with -c,
    since no per-process counts exist

    -t Prefix each line of the trace with the time of day.

    -tt If given twice, the time printed will include the microseconds.

    -ttt If given thrice, the time printed will include the microseconds and the leading
    portion be printed as the number of seconds after the epoch.

    -T Show the time spent in system call. This records the time difference between
    the beginning and the end of each system call.

    - -expr A qualifying expression which modifies what to trace or how to trace.
    The format of the expression is [qualifier != !value[value]]..., where qualifier
    is one of trace, abbr, verb, raw, read, write and value is a qualifier-defined
    symbol or number. The default value is trace. Using an exclamation mark negates
    the set of values. For example, -open means literally -trace = open, which in
    turn means only the open system call. By contrast, -trace =open means to trace
    every system call except open. In addition, the special values all and none have
    the obvious meanings. Note that some helps use the exclamation point for history
    expansion inside quoted arguments. If so, you must escape the exclamation point
    with a backlash.

    - -trace set Trace only the specified set of system calls. The -c option is useful
    for determining which system calls might be useful to trace. For example, trace
    =open,close,read,write means only those four system calls.

    - -o Write the trace output to the file filename rather than to stderr. filename.pid
    -if is used. If the argument begins with ''|'' or ''!'' then the rest of the argument
    is treated as a command and all output is piped to it. This is convenient for
    piping the debugging output to a program without affecting the redirections of
    executed programs.

    - -pid Attach to the process with the process ID and begin tracing. The trace
    may be terminated at any time by a keyboard interrupt signal (CTRL-C). Strace
    will respond by detaching itself from the traced process(es) leaving (them) to
    continue running. Multiple -p options can be used to attach to up to 32 processes
    in addition to command (which is optional if at least one -p option is given).'
