- pgno: 285
  md: '# Piecing it all together 11


    We have reached the end of the road, in a sense. It is time to wrap up all our
    hard work and develop a strategy that will last through the passage of time and
    the change of the technology landscape. A well-designed, flexible policy will
    help you handle all kinds of planned and unplanned problems, and it will not be
    rendered obsolete by the time you implement it in your organization.


    # TOP-DOWN APPROACH


    Problems can be solved in many different ways. Many system experts are highly
    technical people, with great expertise in a narrow field. Moreover, many are keenly
    focused on the stuff they love and do, which inherently limits their vision. And
    it is the vision that you require to be a good problem solver.


    # KEEP IT SIMPLE: START SIMPLE


    A crucial part of the top-down approach is that you try to see the whole picture,
    from afar, with few details, looking for discernible patterns. You observe the
    whole system, you try to understand its mechanisms, and then, you do only when
    it is relevant. Not only will this method save time, it will also render more
    effective results.


    Therefore, when you encounter an environmental issue, do not attack with all the
    force, vigor, and technical skills you have. Attempt to use simple tricks and
    tools first. It takes experience and intuition to find the correction solution
    on the first go, and if you are not sure about the current problem, step back
    and do some basic, preliminary checks.


    # UNDERSTAND YOUR ENVIRONMENT FIRST


    One of the keys components to making the best educated guess to what you should
    do, whether it is a collection of system commands that check the health of the
    system or a more detailed investigation, is to know how your environment behaves.
    Without understanding this, your work will not be riddled with mistakes, you may
    even cause damage and accentuate the problem.


    To make things even worse, some people may misinterpret the very meaning of this
    statement. For them, understanding the environment might be all about mastering
    all the title tools, the flavors of operating systems, and programming'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 278 CHAPTER 11 Piecing it together


    languages. However, in reality, the real challenge is finding the relations between
    different parts of your ecosystem. If you understand the cause and effect between
    your data center technologies and their implementations, you will be able to significantly
    improve your investigative work.


    # IT IS LIKE ONION: LAYERED AND IT WILL MAKE YOU WEEP


    The step of mastering one''s environment is often more difficult than it appears.
    Certainly, you have a bunch of servers, centralized storage, a complex network
    infrastructure with a firewall, and maybe several customer applications. But the
    delicate relations are far more complex than that.


    Long-term support and backward compatibility, dependence on old technologies,
    lack of desire and budget to move on to new solutions, and the stark fear of breaking
    things force companies and organizations to maintain a dreadful legacy quo, piling
    on new solutions as hacks and patches rather than complete solutions. Even highly
    flexible environments that start as state-of-the-art industry stagnate over time,
    becoming bogged down in their own mission state. Often, new technologies are implemented
    to resolve a shortcoming in an older incarnation of a related technology, introducing
    unnecessary complexity that grows over.


    When you try to fix issues, your problem solving should also account for the legacy
    leftovers and make sure they are accounted for in the solution. Otherwise, you
    will merely be patching the same old leaky boat.


    # PROBLEMS THAT “RESOLVE THEMSELVES” COME BACK WITH INTEREST


    There is no such thing as problems that go away on their own. In the best case,
    an unknown component in your data center changes, causing the manifestation of
    the issue to vanish temporarily. But this is a wicked scenario. You do not control
    the environment, you are neither aware of what caused the problem to occur nor
    the reason it supposedly went away. This means the problem will recur, often with
    increased impact.


    After you have gained a solid situational awareness of your ecosystem, you must
    invest time in excellent monitoring and complete solutions that handle the problem
    across the entire spectrum, even if this means protracted engagement with third-party
    vendors and follow-up months after the original issue surfaced. Otherwise, there
    is a very good chance that your woes will return.


    # NO SHORTCUTS: PHYSICAL LAW OF CONSERVATION OF EFFORT


    Perhaps you will not find the above equation in any of Newton''s books, but it
    is real as Murphy''s Law. Sometimes, you may get lucky – you will nail the problem
    down on the first strike and your data center will quickly resume normal operation.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Methodologies used


