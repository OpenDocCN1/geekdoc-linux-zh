  md: '# 154 CHAPTER 6 Getting very geeky


    Configure KDUMP_FREE_DISK_SIZE

    This value defines the minimum free space that must remain on the target partition,

    where the memory core destination directory is located, after accounting for

    the memory core. If this value cannot be met, the memory core will not be savednto
    prevent system failure. The default value is 64 MB. Please note it has nothing
    to

    to the memory allocation in GRUB. This is an unrelated, purely disk space setting.


    ```

    KDUMP_FREE_DISK_SIZE=64MB

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Configure KDUMP_DUMPDEV

    This is a very important directive. We have mentioned it several times before.
    KDUMP-

    DDEV does not have to be used, but you should carefully consider whether

    might need it. Furthermore, remember that this is closely associated\with several
    other settings, so if you do use it, the functionality of KDUMP will change.


    First, let us say it might be prudent to use KDUMP_DUMPDEV. Using

    this directive can be useful if you are facing system corruption problems.

    in case, when a crash occurs, it might not be possible to mount the root filesystem

    to the destination directory (KDUMP_SAVEDIR), and consequently, the

    crash would dump. Using KDUMP_DUMPDEV allows you to write a de-

    vice or a partition in raw mode, without any consideration to underlying filesystem,

    circumventing any filesystem-related problems.


    This means there will be no KDUMP_IMMEDIATE_REBOOT. The direc-

    wil also be ignored, if you use the console to try fix system problems

    manually, checking the filesystem, because KDUMP_DUMPDEV directive and if it is
    not empty, it will

    copy the contents from the dump device to the dump directory (KDUMP_SAVEDIR).


    On the other hand, using KDUMP_DUMPDEV increases the risk of disk corrupt-

    in the recovery kernel environment. Furthermore, there will be no immediate re-

    boot, which slows the restoration to production. While such a solution is useful

    for small-scale operations, it is impractical for large environments. Moreover,
    take

    to account that the dump device will be irrecoverably overwritten when the

    dump is collected, destroying data present on it. Second, you cannot use an active

    swap partition as the dump device.


    ```

    KDUMP_DUMPDEV=""

    ```


    Copyright ©Intel Corporation. All rights reserved.


