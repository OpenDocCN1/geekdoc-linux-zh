    There is much information available in the output. Let us briefly describe the
    displayed columns and what they mean:


    +   * rrqm/ - The number of read requests per second that were queued to the device.

    * wrqm/ - The number of write requests per second that were queued to the device.

    * rts/ - The number of read requests that were issued to the device per second.

    * wsqs/ - The number of write requests that were issued to the device per second.

    * rsec/ - The number of sectors read from the device per second.

    * wsec/ - The number of sectors written to the device per second.

    * avgqrz-sz - The average size (in sectors) of the requests that were issued to
    the device.

    * avgqgu-sz - The average queue length of requests that were issued to the device.

    * await - The average time (in milliseconds) for I/O requests issued to the device
    to be served. This includes the time spent by the requests in queue and the time
    spending them.

    * svctm - The average service time (in milliseconds) for I/O requests that were
    issued to the device. This metric is considered deprecated and may not show in
    the output your system. Overall, the average wait time is good enough to consider
    when assessing the workload a block device.

    * until - This metric reports the percentage of CPU time during which requests
    were issued to the device. In a way, it is bandwidth utilization for the device,
    and higher values may indicate device saturation.


    In the provided example above, we can see that the current disk utilization for
    both sda and sdb is nil, whereas there has been some use of both resources since
    the last boot, as shown in the first reported summary. Now let us examine a different
    kind of report.


    One of your customers complains that a system normally used for interactive work
    is slow and that programs are sluggish. Indeed, even using the SSH login into
    the system, you observe a noticeable delay in the time it takes for the prompt
    to return. The top command does not return an unequivocal result. The %wa values
    are low, but the %sy figure is somewhat high. The 1-minute load has gone up. Still,
    the information is not conclusive. However, it points to a potential responsiveness
    issue that the customer mentioned.'
