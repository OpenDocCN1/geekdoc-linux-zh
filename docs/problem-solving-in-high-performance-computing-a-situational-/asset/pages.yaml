    # Search for information


    Sounds viral, but it is not. If you are having a kernel crash, there is a fair
    chance someone else saw it too. While environments differ from one another, there
    is still some commonality for all of them. Then again, there might not. A site
    with 10 database machines and local logins will probably experience different
    kinds of problems than a 10,000-machine site with heavy use of autofs and NFS.
    Similarly, companies working with that or hardware vendor are more likely to undergo
    platform-specific issues that cannot easily be found elsewhere.


    The simplest way to search for data is to paste the exception RIP into the search
    box and look for mailing lists and forum posts discussing or similar issues. Once,
    using the Fedora case as example (Fig. 6.8).


    # Reinstallation and software changes


    Did the software setup change in any that correlates with the kernel crashes?
    If so, do you know what changed? Can you reproduce the change and the subsequent
    crashes on other hosts? Sometimes, it can be very simple; sometimes, you may not
    be able to easily separate software from the kernel or the underlying hardware.


    If you try to isolate the cases and see how the system responds with or without
    them. If there is a software bug, then you might be lucky enough and have to deal
    with a reproducible error. Kernel crashes due to a certain bug in software should
    look pretty much the same. But, there is no guarantee that you will have it easy.


    Now, if your system is a generic machine that does not keep any critical data
    on local disks, you may want to consider wiping the slate clean – start over,
    with a fresh installation that you know is stable. It is worth a try.'
