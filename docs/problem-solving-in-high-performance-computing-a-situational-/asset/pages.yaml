    # KNOWN VERSUS UNKNOWN


    Faced with uncertainty, most people gravitate to their comfort zone, where they
    know how to carry themselves and handle problems. If you apply the right problemssolving
    methods, you will most likely be dealing with new and unknown problems. The reason
    is, if you do not let floats in a medium of guessing, speculation, and arbitrary
    thresholds, your work will be precise, analytical, and without repetitions. You
    will find an issue, fix it, hand off to the monitoring team, and move on.


    A problem that has been resolved once is no longer a problem. It becomes a maintenance
