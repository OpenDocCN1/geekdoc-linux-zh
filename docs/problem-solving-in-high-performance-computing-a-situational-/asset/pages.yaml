- pgno: 25
  md: '# CHAPTER 1 Do you have a problem?


    The answer is, not really. But, it also shows that the kernel problem is real,
    and it does cause CPU lockups, indicating that it translates into your problem
    customers are seeing, it is not the only issue at hand. In fact, it masks the
    underlying root cause.


    In this case, the real problem here is with the management of Transparent Huge
    Pages (THP) (Transparent huge pages in 2.6.38, n.d.), and for the particular kernel
    version used, with high memory utilization, a great amount of computing power
    would be wasted on managing the memory rather than actual computation. In fact,
    this would trigger the CPU lockups, which do not happen when the THP is used in
    a different manner.


    Compound problems with interaction can be difficult to analyze, interpret, and
    solve. They often come in strange ways, and sometimes a perfectly legitimate issue
    will just be a derivative of a bigger root cause, which is currently marked. It
    is important to acknowledge this and be aware that sometimes the problem you are
    solving is in the result of another. Sort of the Matrooshka (Russian nesting)
    dolls; you do not have one problem and one cause, you you have multiple chickens
    and a whole basket of eggs.


    # DO NOT MAKE ENVIRONMENT CHANGES UNTIL YOU UNDERSTAND THE NATURE OF THE PROBLEM


    If you work under the assumption that there might be layers of problem manifestation
    in your environment, and you are not completely aware how they are related to
    one another, it is important that you do not introduce additional noise factors
    into the engine and make an even bigger problem.


    Ideally, you will want and be able to analyze the situation one component at a
    time. You will until you have observed the behavior and ascertained the effect.
    This will not always be possible.


    Regardless, if you do not fully understand your setup or the problem, making binary
    changes will definitely complicate things. This goes against our natural instinct
    to interfere and change the world around us. Moreover, without statistical tools
    and methods, this will be trickier, unless you are really lucky and happen to
    be fixing only issues with a linear response.


    When trying to fix a problem, temporary tweaks and changes can be a good indicator
    if you are making progress in the right direction, but there is a very thin line
    between a sound solution based on a hypothesis and even more chaos.


    # IF YOU MAKE A CHANGE, MAKE SURE YOU KNOW WHAT THE EXPECTED OUTCOME IS


    Business is not academia. Everyone will tell you that. You do not have the time
    and skill to invest in rigorous mathematics just to be able to start your investigation.
    But the researchers have gotten one thing right, and that is the expected outcome
    of any proposed theory or experiment. It is not so much that you want to prove
    what you'
