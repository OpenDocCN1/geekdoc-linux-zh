  md: '# Working with gdb 131


    The first line is the code (or text), the actual binary instructions. The second
    line shows data, stores all initialized global variables. The third section is
    the heap, which is used for dynamic allocations, such as malloc. Sometimes, it
    also includes the .bss segment, which stores statically linked variables and uninitialized
    global variables. When the .bss segment is small, it can reside inside the data
    segment. After that, you get shared libraries, and the first one is the dynamic
    linker itself. Finally, you get the stack. The last two lines are the Linux gating
    (add link) mechanisms for system call, which replace the 0x80 system call that
    was used in the past. As you notice, there are still more memory addresses above
    the last line, reserved by the kernel. So here, at a glance, you can examine how
    your process resides in the memory. When a program is executed through gdb, you
    can view its memory allocations using the info proc mappings command.


