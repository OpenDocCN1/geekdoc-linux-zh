  md: '# CHAPTER 7 Problem solution


    # Statistical engineering


    Statistical engineering is another set of methods and tools that can help you
    try to find and understand quantifiable orders in a seemingly random system, which
    can then be controlled and changed. Like the design of experiments, it relies
    on statistical thinking and tools to achieve its goals. This branch of applied
    science could also be said to cover the design of experiment, but the latter can
    be with good results on its own, we have separated the two for clarity.


    In general, statistical engineering is well suited to IT environments, because
    compute setups do not allow for lengthy, detailed experiments that cover all angles
    and possibilities. Especially in the production environment, you will be forced
    to make quick, seemingly intuitive decisions on a small subset of parameters.
    Statistical engineering can help you narrow your investigation of problems and
    point out the most significant vectors affecting your system.


    In reality, in most companies, statistics narrow down to two phenomena: people
    look at the graph of their data points and then draw a trend line using Microsoft
    Excel. If the deflection angle points above the horizontal horizon, it is a positive
    trend, and if the angle is negative, then it is a negative trend.


    This method is very simple to implement and understand. Unfortunately, it masks
    the complex reality that exists in data centers, with hundreds and thousands of
    systems and components interacting among them. In turn, there is little real understanding
    of the cause and effect for most problems, leading to massive collection of every
    possible vector of data, in a hope that will exhibit linear, predictable behavior.


    A radically opposite approach is to use genetics to analyze problems and find
    the root cause. Normally, engineers and system administrators try to resolve problems
    by studying systems and guessing the cause. Then, they follow up by suggesting
    a change they believe might fix the problem. Sometimes, they may suggest several
    changes as there could be potential causes involved. Regardless the fundamental
    approach is that the problem suffers from a flaw in how the system is designed
    or used. This is the classic approach to problem solving, and it can be referred
    to as the X-Y approach.


    Statistical engineering recognizes the fact that multiple factors affect any one
    output. Instead of checking all permutations of a system, which might not be technically
    or practically feasible, the general idea is to search for statistically significant
    relations. One way of doing this is through the design of experiment, which in
    general, statistical engineering is a Y→X approach.


    This kind of problem solving is counterintuitive, because never speculate about
    the possible sources for the variation in outputs, until you have a clear cause-effect
    relationship. Finding the relationship begins with a so-called Red X paradigm
    (Shanin, 2012). In a nutshell, there is always relation whose contribution to
    the variation is stronger than others.


    When solving problems in a data center, understanding which factors contribute
    to the most to the output will significantly reduce your effort to tweak systems
    without any considerable improvement or running extremely long tests trying to
    affirm known relationships.'
