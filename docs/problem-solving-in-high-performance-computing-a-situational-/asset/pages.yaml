- pgno: 169
  md: 'settings remain identical to local disk functionality, including starting Kdump
    on boot, GRUB menu addition, and Kexec testing.

    The configuration file is located under /etc/sysconfig/kdump. As always, before
    affecting a change, back up the configuration file.


    # Configure KDUMP_RUNLEVEL


    To use the network functionality, we need to configure Kdump to boot in runlevel
    3. By default, runlevel 1 is used. Network functionality is achieved by changing
    the default.


    ```

    KDUMP_RUNLEVEL=3

    ```


    # Configure KDUMP_SAVEDIR


    The second step is to configure the network storage destination. We can no longer
    use the local file. We need to use either an NFS area, a CIFS share, an SSH server,
    or an FTP server. In this document, we will configure an NFS area because it seems
    the most sensible choice for sending crash dumps to. The configuration of the
    other two is very similar, and just as simple. The one thing you will have to
    pay attention to is the notation. You need to use the correct syntax


    ```

    KDUMP_SAVEDIR="nfs://<server>://<dir>"

    ```


    <server> refers to the NFS server, either by name or IP address. If you are using
    a name, you need to have some sort of name resolution mechanism in your environment,
    like hosts or DNS. <dir> is the exported NFS directory on the NFS server. The
    directory has to be writable by the root user. In our example, the directive takes
    the following form:


    ```

    KDUMP_SAVEDIR="nfs://server2:/dumps"

    ```


    These are the two changes to make Kdump send memory dumps to an NFS storage area
    in the case of a kernel crash. Now, we will test the functionality.


    # KDUMP USE


    We will now simulate a kernel crash to examine our configuration and make sure
    that everything works.'
