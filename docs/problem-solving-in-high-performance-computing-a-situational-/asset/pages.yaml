    The added bonus of improved cooperation is that you will be able to solve your
    issues more effectively. You can go beyond the boundaries of your team or your
    department. Out there, on the Internet, someone will have already seen and fought
    the same problem you are facing now.


    Most large companies will be more conservative in the adoption of new technologies,
    which means they will be using relatively older technologies and operating systems.
    On the other hand, you and small startups and the academy will be spearheading
    the bleeding edge of art and science, and they will have already encountered,
    wrestled with, resolved some of the issues you are facing currently. Good cooperation
    may also lead to new ideas, and it will certainly make your work more productive.


    # JOB SECURITY IS NO SECURITY AT ALL


    Too many people, when faced with a situation in someone else might be able to
    do exactly the same task they are doing at pretty much the same cost and quality,
    defensively bunker down and refuse to cooperate. Colloquially, this is known as
    job security, an unspoken and subconscious philosophy to refuse to share practices
    and data that could render you redundant.


    A significant chunk of any respectable IT organization is contained in isolated
    silos, by people who find the notion of exposing their domains of responsibility
    a direct threat to their position. It is one of the chief reasons why projects
    often take so long, and why you have to beg for information when trying to fix
    problems. System administrators or engineers will simply not share.


    If you are in a position where you can impart your data to, or choose not to,
    so that you remain the critical point of contact, consider the implications of
    your'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# CHAPTER 11 Piecing it all together


    actions, even beyond the immediate business needs. You will retain the skill,
    supposely, but you will also remain dependent on your existing knowledge. Soon
    enough, though, your knowledge will gradually become irrelevant, the organization
    embraces moves and moves to other, more cooperative people. Furthermore, because
    you have limited yourself to what you know, you will not learn any new skills.
    Eventually, you will become unnecessary.


    It is wrong to assume that knowledge is static and that its value does not depreciate
    over time. In the contrary, the only real security is to solve the eternal problems
    of the data that do not age or change with time – financial and operational constraints,
    the customer demands, the difficulty in sharing information with other people.
    If you can maintain an edge in one or all of these domains, you will have gained
    the job you seek. This means adopting a flexible mindset and seeking solutions
    that will benefit you, in addition to buying yourself to invest in learning new
    technologies for a future challenge. Staying put with your ancient skills is the
    best way to make yourself obsolete.


    # GIVE MAN A FISH – OR TEACH HIM TO FISH


    So how does one go about their job security? The simple answer is, do not withhold
    information, do not make yourself into a necessary cogwheel, because they are
    so easy to replace. The choice between feeding others snippets of information
    or teaching them the whole doctrine of how to do something, you should choose
    the latter.


    Problem solving can be methodic, but it cannot be a recipe. People are not robots,
    and most issues you encounter in data center environments require a dose of healthy
    and intuition. If you go about problem solving armed with only a bunch of tools
    without a higher meaning or purpose, you will fail. And so others, if you only
    give them the tools and the whole toolbox, which also includes the why and how
    of problem solving.


    Finally, when you are forced to teach others what you know, you will realize that
    the task is more difficult than you imagine. In fact, this should be the real
    test of your knowledge. You cannot claim you are the subject expert unless you
    can teach others.


    # ONLY YOU KNOW WHAT IS BEST FOR YOUR ENVIRONMENT


    So far, we have talked about both compromise and consideration and working with
    other people. Hand in hand with flexibility comes great responsibility. If you
    are the domain owner, then it is up to you to devise the plan to fix the problems
    and provide a sane operational environment for your customers. This means learning
    from others, sharing willingly, being a team player, but also not compromising
    when it comes to accountability.


    Closure is just as important as every other step in the whole problem-solving
    strategy. Strategies, it is very easy to move on to a new challenge once you have
    found the technical bit, but you must see it to the end. This is probably the'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'least interesting and most boring part of the whole affair. But it is your
    responsibility. Do not assume others will know or care about your constraints,
    or that they will share your motives for the problem and its solution. Sharing
    knowledge is great, but you are the owner of the issue, and you are the one who
    must see it all the way through. Only then will you be able to claim your problems
    have been resolved.


    # CONCLUSION


    We have reached the end of our journey. We started it by looking at the data center,
    through the eyes of an explorer facing a jungle, uncertain, wary, maybe even confused.
    Carefully, we blazed our path through problem solving, using a methodical, step-by-step
    approach in our investigations, trying to avoid the classic mistakes and traps
    along the way.


    Some of the problems we faced are purely technical, and indeed, there is a lot
    to be said and done on the technical side, as we have learned in Chapters 1–6.
    But, equally importantly, we handled the softer side of problem solving: the mathematical
    models and best practices, the monitoring and configuration management, and we
    pieced it all into a single, effective continuum, which allows us to tackle new
    challenges with confidence, and maybe, the reason why you joined the world of
    IT, and to have fun doing so.'
