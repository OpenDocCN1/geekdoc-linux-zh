  md: '# Configuration auditing


    Creating the minimal auditing setup is actually a very important step in problem
    solving. This means you have reduced the scope of your problems to quantifiable,
    measurable values. You can now set up your monitors accordingly.


    # CONTROL THE CHANGES IN YOUR ENVIRONMENT


    Ask yourself, your colleagues, and your boss what they think about the title of
    this subsection. What is the answer going to write it down. Now, let us consider
    what it is not. Being in control of the environment does not mean having the knowledge
    of all the little pieces and what they do at any time. It is also not fundamental
    ITIL (ITIL, n.d.) service management underpinnings. Last, controlling the changes
    in the environment is not about reflecting these changes in reports, spread-,
    or even monitors.


    Being in control is one very simple thing. This means you do not react to changes,
