  md: 'Linux system, and the results cannot be interpreted without context and some
    basic awareness of what the system is supposed to be when analyzed. On the other
    hand, it provides useful information that cannot be obtained using the more traditional
    system administration tools.


    # WORKING WITH GDB


    In this chapter, we first learned about analyzing applications by tracing their
    system calls and functions. After that, we dug much deeper and looked at the kernel
    events. Now, we will step up into the application space, trying to understand
    how we can troubleshoot problems by examining the behavior of binaries through
    a step-by-step debugging process.


    In a nutshell, it comes down to this: You wrote a piece of code, and you want
    to compile it or you have a binary and just run it. The only problem is, the execution
    fails with a segmentation fault. For all practical purposes, you call a critical
    piece of software is failing and they are clueless as to what might be the root
    cause.


    To this end, we will now discuss the use of debuggers. Namely, we will focus on
    the popular GNU Debugger, the standard debugger for UNIX-like systems. We will
    learn how to handle misbehaving binary code, how to examine its execution step
    by step, how to interpret errors and problems, and how we will even step into
    the assembly code and hunt for problems there.


    # INTRODUCTION


    Gdb allows you to see what is going on inside program while it executes – or what
    program was doing at the moment it crashed. Gdb can do four kinds of tasks that
    you can find and catch bugs in the act:


    +   * Start your program, specifying anything that might affect its behavior.

    * Make your program stop on specified conditions.

    * Examine what has happened when your program has stopped.

    * Change things in your program, so you can experiment with correcting the effects
    of one bug and go to learn about another.


    The program being debugged can be written in Ada, C, C++, Objective-C, Pascal,
    as well as many other languages. Those programs might be executing on the same
    machine as the debugger (native) or on another machine (remote). Gdb can run on
    most popular Unix-like and Microsoft Windows variants.


    # PREREQUISITES


    We would like to emphasize that this will not be easy. Working with gdb is not
    something anyone can do at their leisure. There are many requirements you must
    meet before you can have a successful session.'
