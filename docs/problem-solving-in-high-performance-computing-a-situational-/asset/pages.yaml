  md: '# 102 CHAPTER 5 Getting geeky – tracing debugging applications


    As we have mentioned above, any command may be executed as a combination of the
    perf binary and the command, or through wrapper tools, such as perf-stat, perf-sched,
    and others.


    # Events


    The perf tool is capable of measuring events coming from different sources, including
    pure kernel counters (context switches, minor faults, and the like), as well as
    hardware events. Perf can measure microarchitectural events reported by the performance
    monitoring unit (PMU) in the processor, including the number of cycles, cache
    misses, and others. The collectable events depend on the processor type and model.
    The available list of supported events can be obtained by running the perf list
    command:


    | List of pre-defined events (to be used in -e): |

    |---||

    | cpu-cycles OR cycles | [Hardware event] |

    | stalled-cycles-frontend OR idle-cycles-frontend | [Hardware event] |

    | stalled-cycles-backend OR idle-cycles-backend | [Hardware event] |

    | instructions | [Hardware event] |

    | cache-references | [Hardware event] |

    | cache-misses | [Hardware event] |

    | cpu-clock | [Software event] |

    | task-clock | [Software event] |

    | page-faults OR faults | [Software event] |

    | minor-faults | [Software event] |

    | major-faults | [Software event] |

    | ... | |


    Copyright ©Intel Corporation. All rights reserved.


    # Performance statistics


    For any of the supported events, perf can keep a running count during process
    execution. In a way, this work of mine is similar to the use of the -e flag with
    strace, which outputs the summary of executed system calls, errors, and total
    time spent for each entry. Similarly, the perf stat command will display an output
    of aggregated events at the end of the application run. For instance, the output
    of the ls command:'
