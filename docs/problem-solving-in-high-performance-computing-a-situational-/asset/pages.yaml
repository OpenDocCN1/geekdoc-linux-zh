    and techniques that can be helpful in problem solving in mission-critical, high-performance
    compute environments. We started with basic, top-level investigation and climbed
    the stack all way to the kernel. Now, we will zoom up and wrap our investigations
    in a meaningful way.


    Without a highly methodical and efficient post-mortem strategy, including proper
    collection and analysis of data while keeping the business objectives and environment
    criticality in mind, it is very difficult to develop a successful way of running
    the data center. We will now follow with a layer approach to isolating problems,
    implementing fixes, and most importantly, closing up with a tangible, measurable
    resolution.


    # WHAT TO DO COLLECTED DATA


    System troubleshooting entails data collection. Logs, reports, bug, errors, crash
    dumps – all of these will find a way onto your hard disk. The question is, what
    do you do with the lessons learned from your problem solving and the amassed evidence?


