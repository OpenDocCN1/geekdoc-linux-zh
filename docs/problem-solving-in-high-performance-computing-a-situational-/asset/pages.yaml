    vectors of data and environment events, but correlation does not imply causality.
    Unfortunately, people with analytical minds rush to see patterns and make these
    kinds of links in the data they use, and over time, a significant bias in the
    quality of reported metrics develops. Most notably, the link between the symptoms
    of a problem once reported and the actual root cause disappears. Too much data
    simply breeds apathy.


    With no data in place, there is no bias, and people at working solving problem
    will be challenged in thinking what might have caused the issue they are seeing.
    Arguably, this always happens at some point somewhere, and from there on, semiautom
    and automated monitoring solutions are developed and tweaked. However, it is possible
    to create robust and relatively simple solutions that bridge the two ends of the
    spectrum.


