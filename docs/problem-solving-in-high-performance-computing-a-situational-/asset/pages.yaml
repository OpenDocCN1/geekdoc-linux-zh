    Mem and swap lines are pretty straightforward. They tell you the current usage
    of the memory subsystem. However, some of the values may be little misleading.


    +   - Free – memory pages in the virtual memory.

    - Buffers – pages used for in-memory block device I/O buffers.

    - Cached – page cache, containing dirty pages that may be written to disk and
    the pages used in recent read requests. Although the cache size may be very large,
    it will shrink if a running program requests additional memory. Therefore, for
    all practical purposes, you may treat cache as free memory.


    An exercise that emphasizes this important distinction is to drop all caches (Hansen,
    2009). This action may take some time to complete, as the system will be busy
    committing changes to disk. For instance:


