  md: '# CHAPTER 9 Make your environment safer, more robust


    The worst situation is that you may not notice anything wrong at first, and issues
    may surface only longer after the original change, making recovery all the more
    difficult.


    # UNDERSTAND THE IMPACT


    Let us assume you need to deploy a syscl.conf file on your Linux machines. After
    long, delicate work, your engineering team has decided to change half a dozen
    settings, which reflect the customer usage and some improved performance for your
    hosts. Specifically, most of the workload in the environment requires significant
    network throughput, and you need to be able to execute multiple threads in parallel,
    with minimal latency.


    On your end, you have thoroughly investigated and defined the pass/fail criteria,
    and you are aware of all and any implications this change may involve. You are
    now going to deploy the syscl.conf file, and you have diligently followed all
    the best practices. Old versions are saved in your version control, and your configuration
    management team is ready to deploy the new package or recipe.


    At this point, your confidence will normally win over the hesitant and sometimes
    clueless bored members of the change approval board, and you will steam ahead
    with your change. But you should ask yourself: do you fully, understand how this
    change is going to affect the overall environment, on all levels? A small local
    fix on a Linux host does not look enough to warrant any extensive involvement
    with other experts, from other domains.


    However, if you discuss the change with your colleagues, you may discover that
    there could be gaps in your work. Or you may consider yourself. Will the increased
    network load affect the switching and routing equipment? Are there going to be
    any bottlenecks? If you are going to increase the parallelism of execution, do
    you have sufficient software licenses that may be required for the task? If your
    clients are going to use additional data, more frequently, are your systems equipped
    for the task? Have you tested all your customer flows to make sure the configuration
    does not adversely affect them?


    # NO PROBLEMS REPORTED MEANS NOTHING


    After you have deployed your new change, you will ready yourself for any potential
    issues. Blessed, there may be none, in which case you will briefly follow up with
    monitoring teams and then go to other, more interesting work. However, in reality,
    you may merely ignoring new problems.


    There will be positive bias that the change is going to make everyone''s lives
    better, when people expect it to succeed. This means that negative signs may be
    ignored or missed. Alternatively, your monitoring software may not be equipped
    with new symptoms that may arise from your change. It is possible that you have
    not anticipated them, or they may affect another domain.'
