- pgno: 268
  md: '# Fine-tuning the system performance 10


    So far, we have mostly focused on fixing problems in the environment through the
    use of various technical tools and by adhering to strict methodology in problem
    solving. The next logical step in mastering the domain of high-performance computing
    is to optimize the processes, make our work setup more robust, streamline the
    workloads that they run faster and more efficiently. We will now work through
    several practical examples that highlight situations in which there is no specific
    technical problem, but which could eventually become pressing issues. Making the
    necessary adjustments and tweaking the environment to match the demand will allow
    you the necessary operational flexibility and allow you to avoid having to work
    in a “firefighting” mode.


    # LOG SIZE AND LOG ROTATION


    Logs are valuable. But if we let them blow up unnecessarily, they can undo the
    very advantage they provide us in scanning and understanding the environment.
    In general, if log parsing and analyzing becomes a task that tolls a significant
    amount of system resources and interferes with the normal work flows, then it
    becomes effectively meaningless.


    # SYSTEM LOGS TEND TO GROW ALL TIME


    There is a somewhat (unhealthy degree of paranoia among system administrators
    and security experts. They like to retain data as long as possible, even when
    it is no longer necessary or useful. We mentioned things cluster and housekeeping
    in Chapter 7. Indeed, we want to avoid hoarding information for the sake of it,
    as well as retaining logs that serve no purpose beyond a certain date. For instance,
    server messages from boot cycle might be important, but those three or four reboots
    are definitely of no value except for detecting threats and for statistics collected
    by business intelligence (BI) systems. On the systems in your environment, there
    is no reason to store active data logs.


    Linux systems with a neat log rotation mechanism, which allows log files to be
    closed and archived once they reach a certain size. The mechanism is aptly named
    logrotate (logrotate(8, n.d.)). By default, the service is configured to run daily
    from within /etc/cron.daily). The process reads its configuration file, stored
    under /etc/logrotate.conf, and if any log that matches the size criteria is found,
    it is rotated into a compressed archive with incremental numbering. Normally,
    up to five archives'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# CHAPTER 10 Fine-tuning the system performance


    are kept, after which they are permanently deleted. A sample logrotate configuration

    may look like


    ```

    # see "man logrotate" for details


    # rotate log files weekly

    weekly


    # keep 5 weeks worth of backlogs

    rotate 5


    # create new (empty) log files after rotating old ones

    create


    # uncomment this if you want your log files compressed

    compress


    # uncomment these to switch compression to bzip2

    #compresscmd /usr/bin/bzip2

    #uncompresscmd /usr/bin/bunzip2


    # RPM packages drop log rotation information into this directory

    include /etc/logrotate.d


    # system-specific logs may also be configured here.

    ```'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Log size and log rotation 261


    Per-task configurations are stored under /etc/logratate.d directory. For instance,
    for process accounting, which can easily become a system hog, especially on busy
    hosts, with a very large number of tasks created every second:


    ```

    #cat acct

    /var/account/pacct {


    size+=200M


    missingok


    create 640 root root


    postrostate


    /etc/init.d/acct force-reload >/dev/null 2>&1


    endscript

    }

    ```


    Copyright ©Intel Corporation. All rights reserved.


    # BE KIND, REWIND


    If we borrow the reference from a popular Hollywood movie, rotating logs is a
    healthy practice, but it also gives peace of mind when it comes to retaining old
    stuff. We do to keep our partitions tidy and clean, but we also do not want to
    throw away everything. Sometimes, archived information can be useful, and older
    log files overlooked may serve a purpose.


    One practice that is definitely overlooked is a periodic analysis of how often
    system administrators and engineers in the environment access archived data and
    the of it troublesome. If you have the ability to run this kind of correlation,
    you will effectively come at the optimal window for system retention. For example,
    you may keep logs up to 3 months back but discover that in the resolution of last
    20 critical environment problems, your technical staff only used data from the
    last week. In that case, it is possible to configure a more aggressive cleaning
    policy that matches the expectations and use of the available information.


    # WHAT GOES INTO MESSAGES?


    Another aspect that can definitely be streamlined is the way system messages are
    written. There are two reasons for this: (1) the amount of information and (2)
    the'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# CHAPTER 10 Fine-tuning the system performance


    ability to separate useful pieces of data from unnecessary distractions. The real
    trick is to analyze your environment and decide on the minimal (or rather maximal)
    useful subset that provides you with the needed logs to maintain situational awareness
    and efficiency.


    # Make it fast(er)


    In Chapter 3, we talked about several types of systems logs, which aided us in
    the initial steps of our investigations and problem solving. The next step is
    to dictate what gets logged in the first place, and to allow for fast logging
    that does not slow the system when high volumes of information are written to
    disk.


    One of the ways to speed up logging is to use asynchronous writes for less critical
    data. For the Linux syslog facility, this is done by prepending a minus sign to
    the log name, for each defined directive in the /etc/syslog.conf file. For instance


    ```

    kern.* -/var/log/kernell;

    cron.* -/var/log/cron;

    *.info:mail:none -/var/log/messages;

    mail. -/var/log/mailillog;

    *.emerg *

    *.alert root

    ```


    > Copyright ©Intel Corporation. All rights reserved.


    # Useful information versus junk


    The subtitle of this section implies a certain amount of courage. Are you willing
    to call data in your environment junk? But sometimes, this kind of attitude is
    necessary to improve your work methods. Like everything in life, system data obeys
    Sturgeon''s law (Gunn, 1995), and it is critical to separate crud from important
    pieces of information. Not only will you lighten the computational load involved
    in collecting and processing this data, you will allow yourself to focus on real
    problems. But, the initial inclination to accept the fact is already an important
    step.


    # Make sure you log what you need


    This is of course, easier said than done. There are two approaches to mapping
    the environmental necessities. You can start by logging everything and then down,
    pausing between changes to see whether anyone is going to complain. You can also
    start with the smallest of subsets and expand as your needs grow, hoping that
    your planning and technologies are scalable enough to cope with future challenges.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Filesystem tuning 263


    The first method is preferred because it involves less risk and allows people
    to define the envelope for their work. The second requires forward thinking, strategic
    vision, and this also means you might have to cope with new vectors of data without
    having the right resources, and that will always happen when you most need the
    logs.


    The optimal way is probably somewhere in between. That said, it is critical to
    evaluate your ability to respond to issues at the end of scale (i.e., everything
    is logged all the time) to build robust systems that can cope with the torrents
    of data. For instance, if you build a hundred servers in your environment, you
    might build data logging facilities to match the size of your setup. However,
    3 years from now, you might experience a huge business boom, the environment could
    be running 10,000 servers, and your single database, stored on a slow disk, might
    be struggling.


    Cost its part. It would be overkill to use a hundred logging servers as a contingency
    for a situation where they might need a decade from now. But solutions need to
    be designed to account for this eventuality and for a seamless, gradual transition
    to accommodate higher volumes of data.


    Therefore, the most balanced approach is to establish a framework for a large,
    flexible environment with infinite growth, then build the minimal set that matches
    the existing requirements, and slowly build from there.


    # FILESYSTEM TUNING


    Optimization of filesystem used for work areas and system partitions, such as
    /tmp, /work/, and others, can sometimes improve the performance and execution
    tasks of your machines, or at the very least, reduce the load for specific, targeted
    applications and use cases. While hardware improvements are often more desired,
    in some cases it might not be possible to introduce platform changes, and you
    will have to restrict yourself to software tweaks and mount options.


    In general, most of the common filesystems used in Linux have a variety of advanced
    mount options, which can sometimes help reduce access times and improve short-burst
    write and read throughput. Sustained operations will eventually be capped by the
    I/O bus and properties of block devices.


    # EXT3/4 FILESYSTEM


    We cannot go into every option, nor should anyone assume that there is a golden
    standard that matches all workloads and usage profiling. However, familiarity
    with what the technology can do may aid you in certain situations. Filesystem
    format and mount options can also be used to benchmark operating systems, as you
    may achieve different performance with seemingly identical settings in the I/O
    stack.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 264 CHAPTER 10 Fine-tuning the system performance


    At this point, you may simply read the main pages and test various flags and values.
    However, filesystem optimization also presents a good opportunity to consider
    the typical or expected workload running in your environment. Indeed, by examining
    what the filesystem can do and correlating to your tasks, you might find the right
    optimization formula. Blindly tweaking options will probably not yield any meaningful
    results. But let us briefly brief you on some of the common settings:


    +   - T – this formatting option specifies how the system will be used. The list
    of available usage types can be found /etc/mk2fs. For instance, -T will change
    the default inline block size from 128 bytes to 4 KB, because it is tuned for
    a very high number of small file operations typical of a newspaper or mail server.

    - Extent – the extents scheme for storing the location of data blocks in an inodes
    is supposed to be more efficient than the indirect block scheme, especially when
    working with large files. Similarly, if you expect to have directory trees with
    a large quantity of objects, using the `dir_index` option can speed up lookups.


    Mounting options are a far more popular choice because they allow for a nondestructive
    way of filesystem optimization, as opposed to formatting. Moreover, every standard
    operating systems used in large high-performance compute environments will use
    default options provided by enterprise vendors. Indeed, in most cases, the defaults
    will be more than sufficient for a wide range of use cases.


    For Ext3/4 filesystems, there are several useful mount options to consider. Data
    and metadata commits are probably the most beneficial settings that system administrators
    and engineers can change to improve the performance of their filesystems. There
    are three major options available: data = journal, data = ordered and data = writeback.


    +   - data = journal – data is committed to the journal before being written into
    the main file system.

    - data = order – data is forced directly out to the main filesystem before metadata
    being committed to the journal.

    - data = writeback – this mount option allows journaling data commits into the
    filesystem after actual data has been written, which could lead to improvement
    in performance. The downside is that there might be some filesystem data corruption
    following a crash, so the best option is to use it with battery-backed storage.

    - commit = XXX – this option changes the default 5-second delay in journaling
    data commit to a user-specified value. Higher values will potentially improve
    performance, but also increase the risk of data loss in case of sudden power outages
    or system crashes.


    Many other options exist, and they are beyond the scope of this point. But, the
    specified subset is sufficient enough as a starting point. It is also important
    to consider different permutations, as well as workload types.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# XFS FILESYSTEM


    The XFS filesystem is less of a default choice in most Linux distributions; nevertheless,
    it is almost universally supported. XFS is designed to perform best in the execution
    of I/O operations, through the use of allocation groups (AG), a type of subdivision
    of the physical volumes in which XFS is used. This design capability gives XFS
    scalability and bandwidth, and makes it a great candidate for high-load systems,
    such as databases, version control servers, and the like, as well as possible
    optimization.


    Once again, there are two major types of options, including formatting and mounting.
    The former are destructive, but they may lead to increased performance. Moreover,
    because XFS is less used by default, and it is normally tailored for specific
    uses, there is a better opportunity to set up options than default, even on standard
    Linux images.


    +   - Lazy-count – this changes the method of logging various persistent counters
    in the superblock (mkfs.xfs(n.d.)). Under metadata-intensive workloads, the counters
    are updated and logged frequently enough that the filesystem. With lazy-count=1,
    the superblock is not modified or logged on every change of the persistent counters.
    Enough information is kept in other parts of the filesystem to be able to maintain
    the persistent counter values without needing to keep them in the superblock.
    This can give significant improvements in performance on some configurations.
    Essentially, the functionality is similar to the writeback option used for Ext3/4
    filesystems, except that it is set during the format stage.

    - Size = XXX – this value changes the default internal size to a higher value.

    - Agcount = XX – this value controls the number of allocation groups. It determines
    how many concurrent accesses are allowed to the filesystem. In general, a typical
    format command would include the following:


    ```

    - f -l internal,lazy-count=1,size=256m -d agcount=16

    ```


    Copyright ©Intel Corporation. All rights reserved.


    In general, mount options should correlate to the selected formatting options.
    The full list is too long and detailed for this book, but you may want to consider
    the following:


    +   - Logbufs = X – this option increases the number of log buffers used for journaling
    information into memory.

    - Logsize = X – this value changes the size of the log buffer.

    - Allocalloc=X – this option sets the buffered I/O end-of-file preallocation when
    doing delayed allocation writeout. Increasing the value may help under heavy disk
    loads, especially if the lazy-count option is enabled.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 266 CHAPTER 10 Fine-tuning the system performance


    At this point, much like with the Ext3/4 filesystems, you should check different
    permutations of the format and mount options, increment values by a factor of
    x2, and measure the impact on expected workloads.


    # THE SYSFS FILESYSTEM


    A close sibling of the /proc pseudo-filesystem is the sysfs filesystem, normally
    mounted on Linux under sys. This filesystem exports information about various
    kernel subsystems, hardware devices, and associated device drivers from the kernel''s
    device model into user space. Some of the variables are writable, like tunable,
    allowing administrators to manipulate the system behaves. Again, much like /proc,
    working with sys comes with a significant responsibility, and an intimate understanding
    of the kernel internals is required to avoid damage.


    # HIERARCHY


    The /sys tree includes several subsystems (Mochel, 2005), namely


    ```

    drwxr-xr-x 12 root root 0 Feb 8 14:22 ./

    drwxr-xr-x 27 root root 4096 Feb 19 12:09 ../

    drwxr-xr-x 2 root root 0 Feb 8 14:24 block/

    drwxr-xr-x 14 root root 0 Feb 8 14:22 bus/

    drwxr-xr-x 37 root root 0 Feb 8 14:22 class/

    drwxr-xr-x 4 root root 0 Feb 19 12:18 dev/

    drwxr-xr-x 16 root root 0 Feb 8 14:22 devices/

    drwxr-xr-x 5 root root 0 Feb 8 14:22 firmware/

    drwxr-xr-x 3 root root 0 Feb 8 14:22 fs/

    drwxr-xr-x 6 root root 0 Feb 8 14:22 kernel/

    drwxr-xr-x 84root root 0 Feb 8 14:22 module/

    drwxr-xr-x 2 root root 0 Feb 8 14:22 power/

    ```


    Copyright ©Intel Corporation. All rights reserved.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# The sysfs filesystem 267


    Full exploration of sysfs goes beyond the scope of this book. However, system
    administrators and engineers should familiarize themselves with the tree structure
    and the purpose of some of the directories, because they will eventually have
    to make tweaks and changes to tunables, as part of their investigation and problem
    solving.


    # BLOCK SUBSYSTEM


    This tree contains directories for each enumerated block device discovered on
    the system. Examples would be SCSI or SATA devices. For each device, it is possible
    to examine and change a large number of tunables, including the maximum number
    of I/O requests that can be handled simultaneously, the highest number of pages
    read by the readahead (Corbet, 2010) algorithm, and others. However, the most
    important is the ability to change I/O scheduler for the device, which can affect
    the I/O workloads are handled:


    ```

    cat /sysfs/block/<device>/queue/scheduler

    nnoop deadline [cfq]

    ```


    > Copyright ©Intel Corporation. All rights reserved.


    The choice of the I/O scheduler (Budilovsky, 2013) may affect the top-level responsiveness
    under heavy loads. This could be of high importance for Web servers, mail services,
    databases, and similar services. For batch computational hosts executing CPU-bound
    tasks, the difference will be minimal or negligible. Nevertheless, it is important
    to know all the available tunables, study them, and then apply changes when running
    profiling tasks or optimization in isolated setups.


    # FS SUBSYSTEM


    This is a relatively new addition in the kernel, and it is normally used as the
    top-level mount point for the control groups (cgroups) (Chapter 1. Introduction
    to Control Groups (Cgroups, n.d)) mechanism, which allows a virtual partitioning
    of the system resources such as CPU, swap, network, block I/O, and others. Imagine
    you have two users, and one of them executes twice as many tasks as the other.
    Without cgroups, over time, the user with more tasks will utilize more resources
    than the other. Cgroups allow the resource space to be divided into fair or weighted
    groups and allow the system administrator to fine-tune the partition of each relevant
    resource for each user and their tasks.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# KERNEL SUBSYSTEM


    This is the most interesting piece of the /sys tree. Through the files in this
    part of the pseudo-filesystem, it is possible to tweak memory behavior and other
    critical portions of the system. Among the more important subdirectories, we have


    +   - Mm – this directory contains various and highly powerful tunables related
    to memory management. We will see a very useful example later.

    - Security – this filesystem is meant to be used by security modules, such as
    AppArmor, SELinux, and others. It is possible to change and manipulate variables,
    and thus to affect the security modules work. In some situations, this could be
    useful, especially if you suspect these modules be affecting the performance or
    consistency of user applications.

    - Slab – this directory contains a snapshot of the internal state of the SLUB
    allocator (Corbet, 2007) for each cache. Certain files may be modified to change
    the behavior of the cache.


    # MODULE SUBSYSTEM


    Finally, this directory contains a listing of all the modules loaded into the
    kernel, each separated in its own subdirectory. The information displayed by the
    Ismod command reveals the contents of these subdirectories. However, it is also
    possible to change attributes for some of the loaded modules, modifying their
    behavior, with all associated regions.


    # PROC AND SYS TOGETHER


    When you combine the power of tunables under /sys and /proc, it is possible to
    derive solutions for very complex issues, which may not be immediately apparent
    from the initial symptoms. Indeed, let us present three examples that highlight
    the usefulness of these filesystems. As mentioned, both require a very deep understanding
    of Linux internals, but this kind of problem is common in high-performance compute
    environments.


    # MEMORY MANAGEMENT EXAMPLE


