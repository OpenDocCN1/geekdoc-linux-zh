    # DEFINE MATHEMATICAL TRENDS


    This is probably the trickiest part, because few engineers working in the IT field
    have an intimate knowledge of how to define data. But, it is cardinal in understanding
    the environment and how to respond to issues.


    We must assume that monitoring systems in most organizations will have been in
    place and changing them is a very arduous and prolonged task, sometimes impossible.
    We must also assume that off-the-shelf products are being used, sometimes with
    only minimal tweaks to their configurations. Most of the people working in the
    monitoring teams are not statisticians or mathematicians, and neither are their
    peers in the development and engineering teams. All combined, these factors leave
    the prospecting, problem-solving hungry administrator or solutions architects
    with the challenge of having to manage polluted, biased, possibly useless data,
    already highly processed into what the business calls trends. It sounds like a
    light battle, but there is some hope.


    Even if data points on a graph are already averaged of raw data sampled and passed
    through several collection tools and spreadsheets, it is still possible to derive
    interesting and useful facts about the system generating the data. The optimistic
    positive and negative trends are rather meaningless, and we should strike them
    from our lexicon.


    Now, we have data, which possibly represents a time report of the environment
    status at some point, for a specific subset of its resources, or it may be a historical
    view of what the monitoring system captured. Each one will help us trace a path
    back to the problem and understand whether we are focusing our energy on the wrong
    kind of effects.


    Before we can claim there is a deviation from our established norms, we need to
    figure out if our norms are what we expected to be in the first place. Let us
    consider the following example. You have a customer running computationally intense
    regressions in a pool of 1000 identical servers. The customer is interested in
    the runtimes for each task, and they want to know if changes in the server configuration
    or scheduling policy might affect the overall execution times.


    Setting up a monitor, for a temporary purpose of profiling the customer jobs,
    seems like a prudent thing. Over time, the execution of these tasks becomes a
    routine, and the monitor is in place, sometimes triggering alerts on defined anomalies,
    for both system engineers and the customers to a variety of actions. The thresholds
    have mostly been defined using Excel, with some use of PivotTables and average
    values. This is how things are done.


    However, there is a big problem with this kind of approach. Most people assume
    that their data has a normal distribution. This may be true for most things in
    nature, but it is not necessarily correct for data centers.'
