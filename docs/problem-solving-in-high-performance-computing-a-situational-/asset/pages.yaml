- pgno: 51
  md: '# Statistics to your aid 41


    # AVOID QUICK CONCLUSIONS


    The abundance of information in system logs, as well as the presence of various
    warnings and errors, can easily mislead. It is all too easy to decide there is
    a problem by looking at some of the messages, even if they are strictly related
    to the issue at hand. Moreover, instinctively, we seek patterns and anomalies
    around us, and the unfamiliar wealth of hardware and software events in the logs
    can send us down the wrong path.


    # STATISTICS TO YOUR AID


    After preliminary analysis using ps and top, and initial examination of information
    in the system logs, we may need to expand our investigation. There are several
    very-useful tools that can help us narrow down the scope of the problem. Let us
    examine them.


    # VMSTAT


    Vmstat (vmstat(8), n.d.) reports information about processes, memory, paging,
    block I/O activity, traps, CPU usage. If executed without any parameters, the
    command will print a single line with average values for the collected parameters
    since the last reboot. The tool can also run for a specified number of iterations,
    with a delay between each. For instance:


    ```

    vmstat 1 10

