    # CONCLUSIONS


    Initial problem solving revolves around the use of some common applications and
    utilities. The next step in the process takes us into the process space and into
    the kernel, and in order to use tools that expose the structure of tasks and the
    operating system itself, we need deeper knowledge of the underlying building blocks.


    The simple way of working with the Linux internals is through the proc pseudo-filesystem,
    which offers a wealth of information, and well as great freedom in changing to
    this domain. Difficult, complex environment issues will inevitably lead to that,
