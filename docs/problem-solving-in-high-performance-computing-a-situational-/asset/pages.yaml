    # Summary


    Strace is a mighty tool. It is simple to use, it offers rewards almost instantly.
    It

    is not for everyone, definitely the majority of home users, but with some patience,

    basic instinct combined with a curious soul and desire to learn, you can

    put strace to effective use.


    # LTRACE


    For practical purposes, ltrace usage is identical to strace. The tool flags and

    options are almost identical. If you are familiar with strace, you will have no

    problem using ltrace.

    ltrace simply runs commands until it exits. It intercepts and records the

    dynamic library calls that are executed by the process and the signals that are

    received by that process. It can also intercept and print the system calls executed
    by

    the program. Due to its more intrusive nature, ltrace may crash applications when

    used. A typical usage is shown below:


    ```

    32613 __libc_start_main(0x4070e0, 3, 0x7ffffffe6e58, 0x411da90 -- unfinished

    -->

    32613 strchr("ls", "/") = NULL

    32613 setlocale(6, "")

    "LC_CTYPE=en_US.UTF-8;LC_NUMERIC=...

    ```'
