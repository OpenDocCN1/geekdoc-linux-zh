  md: "# Statistics to your aid\n\n# IOSTAT\n\nA tool very similar to vmstat iostat\
    \ (iostat(1), n.d.), which is used to monitor system I/O device loading. Like\
    \ vmstat, it can be executed without switches, or you may use optional flags to\
    \ extend the output, as well as change the number of runs and the delay between\
    \ them. Despite its name, iostat also reports CPU statistics in a header above\
    \ the listed devices, in a manner very similar to the top command. CPU statistics\
    \ are averaged for all processors.\n\nThe most useful switches for iostat are\
    \ -n for NFS filesystems and -x, which allow extended information to be shown.\
    \ Other options include -c and -d for CPU and device utilization report, respectively,-h\
    \ for human-readable output when the -n flag is used, and -z can reduce the verbosity\
    \ of the printed data by omitting idle devices with activity during the current\
    \ sample.\n\n```\niostat -x 1 2\nLinux 3.0.51-default (bhost442)      02/05/2015\
