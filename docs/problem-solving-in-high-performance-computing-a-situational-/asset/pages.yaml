    the underlying material. Should prove that the operating system is not at fault,
    you can then focus on trying to understand which of the hardware components might
    cause the degradation in the application behavior.


    # Pairwise comparison


    Another method of trying to choose a preferable solution among two available options
    is the pairwise comparison. This kind of analysis can help you find the importance
    of a number of options, relative to one another. A typical scenario from the data
    center world would be choosing the best caching solution, based on the performance
    of your customer tools. Instinctively, you may want to run N × M permutations
    of tests, and then compare the results. The question is, how do you interpret
    the results and choose the preferable solution?


    Pairwise comparison can help in this situation. The basic idea is to examine any
    two parameters at the same time – let us call them A and B – and check the number
    of times A was preferable over B, the number of times B was preferable over A,
    and when they were tied.


    The total number of binary comparisons is N(N - 1)/2, and you merely need to sum
    the times A or B superior results. In the end, with the solution with the highest
    score can be considered the best.


