- pgno: 258
  md: '# Make your environment safer, more robust


    In the ITIL world, unexpected issues that crop up in the environment normally
    fall into two categories: problems and incidents. The former can be regarded as
    scenarios that require a deeper investigation and analysis, usually culminating
    in a large change, whereas the latter are often unexpected deviations from the
    normal state. Sometimes, incidents evolve into problems.


    Classification notwithstanding, both types of issues require proper handling and
    closure. A critical piece of problem solving is in providing a quantifiable, repeatable
    set of tools, metrics, and methods that can be used by the technical personnel
    in the environment to be able to mitigate and control the issues. So far, we have
    learned how to identify issues, how to fix them, and how to monitor them. But
    what about control?


    # VERSION CONTROL


    In small setups and startup companies, problem solving often starts and ends with
    the technical personnel and sometimes with hoc solutions. But as we scale and
    grow into massive, mission-critical scenarios that span data centers, thousands
    of hosts and millions of dollars worth of business logic, a different approach
    becomes necessary.


    On a larger scale, problem solving is a process of question rather than software.
    The issue and its resolution transform into an abstract definition, encapsulated
    by the IT Service Management (ITSM) way of work. Monitoring plays an important
    role, but so does change control. Indeed, the Change Management (CM) service of
    the ITSM framework dictates, in order to be successful, IT departments need to
    ensure that standardized methods and procedures are used for efficient and prompt
    handling of all changes to IT infrastructure to minimize the number and impact
    of any related incidents upon service. On the software side, this manifests itself
    in version control tools.


    # WHY YOU NEED VERSION CONTROL


    If you are a software developer, you will probably have naturally developed your
    own control methodology. You often save your changes, and you keep them in different
    files: code1.c, code2.c, code3.c, and so on. For system administrators and engineers,
    the need for rigorous housekeeping is often turned by workload, haste,


    249'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# CHAPTER 9 Make your environment safer, more robust


    and priorities, which revolve around more pressing matters. Indeed, the so-called
    firefighting mode, which becomes the de-facto modus operandi IT organizations
    rapidly scale from SOHO to big data centers, there is little to time for any strategic
    thinking and planning. The reactive, defensive way is the reality on the ground.


    But, the developer''s vary applies equally well to data centers as it deans to
    one''s coding style. Data centers are large ecosystems, and changes need to be
    captured so that people in change can see the temporal history of how their environment
    is chang- , spot "bad" changes, and contain them. This is done by using version
    control — also sometimes known as revision or source control.


    # SUBVERSION, GIT, AND FRIENDS


    There are many version control platforms available. The most popular ones include
    Subversion (Apache Subversion, n.d.) and Git (Git, n.d.). The basic principle
    is simp-: users check in and check out their software changes against central
    repositories so that branches and flows in code, configuration files, and other
    pieces of the environment can be fully tracked, and if necessary, reverted.


    Revision control also comes with additional advantages, the ability to test before
    rolling them out into the production, the ability to compare work, and the ability
    to track down people responsible for specific changes in software.


    # ROLL BACK WITH EASE


    Let us briefly describe a scenario. One of your engineers is responsible for optimiz-
    the company''s Apache Web servers. Diligent, he keeps all changes to the main
    configuration file httpd stored using version control. The engineer leaves on
    holiday, and a couple of days later, your customers complain that one of their
    servers is not performing well.


    At this point, in a classic setup with troubleshooting the issue would require-
    par the configuration with other servers that are not exhibiting the for- issues,
    trying to understand whether any of changes in the configur- file might have caused
    the interruption in service, and figuring out how to mitigate the problem as quickly
    as possible.


    With version control in place, the solution may be easier — and faster. System
    administrators might still need to do a lot of work until they can isolate the
    issue, but then, rolling back might be a simple matter of pulling an old configuration
    from the version control repository. If proper documentation is in place, it might
    even be to know who each change has been made.


    However despite obvious administrative advantages, version control still not help
    us maintain a tidy and uniform environment, because there could still be big discrepancies
    in the data center deployment, there might be dozens of software- configurations
    on the production servers, and no easy way to analyze and compare them all. Furthermore,
    there might be other, unknown changes introduced on the hosts, which could further
    complicate things.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# CONFIGURATION MANAGEMENT


    The second critical piece of the ITSM CM service is, you guessed right, configuration
    management. Configuration management software completes the missing piece of managing
    a uniform environment, without relying on the human factor to achieve the necessary
    balance.


    Configuration management software normally works in the client-server model. An
    agent is deployed on target platforms. It runs as a background service and occasionally
    polls a central repository, comparing the software under its control with the
    master template from the remote server. New policies are downloaded to the platform
    and executed. If there are any changes detected that do not match the templates,
    they are overrun, effectively making the platform behave the way policies dictate.


    For people coming from the Windows world, the closest analogy would be Group Policy
    Management, although configuration management tools are also widely available
    in Windows, including native Microsoft tools. In high-performance environments
    running Linux, there are numerous third-party tools available, sometimes with
    commercial support.


    # BE LAZY: AUTOMATE


    Configuration management has an added bonus of helping automate deployments. Imagine
    you have 1000 servers, all of which need to be provisioned in an identical manner.
    In small companies, you might just hire a number of system administrators who
    would install and set up these machines by hand, sometimes using their own scripting
    to simplify and speed up the process. But, the great risk in having people involved
    in any configuration is that every step along the way is an opportunity to make
    a mistake and deviate from the baseline.


    Time and money are of critical importance, in large deployment scenarios, companies
    cannot afford the luxury of using brute force to overcome the problem of numbers.
    Configuration management becomes an ideal situation because it offers all the
    required benefits of automation, with reduced risk for mistakes – although when
    they happen, they tend to be much bigger scope. A typical deployment would occur
    as follows:


    +   - Servers are manually placed inside the data center.

    - Installations are initiated over the network (PXE boot), and installation images
    are downloaded onto the hosts. In most cases, auto-install configurations will
    be used, there is no need for human input during the setup. For instance, the
    partition table is initialized using preset values, default users and groups are
    created, and so forth.

    - The next step is to deploy software, and this is done using configuration management.
    Depending on the software of choice, the agent pulls packages, recipes, or modules
    from the central server.

    - It parses the rules (policies) by which the packages should be deployed, and
    herein lies one of the great advantages of configuration management'
