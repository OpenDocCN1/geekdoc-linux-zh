    of running a full-factorial design of experiment or use statistical engineering
    to your. In this kind of scenario, you might want to consider the component search,
    a subset of the statistical engineering approach.


    The general idea is to swap parts between the supposedly good and bad systems.
    Normally, this method applies to mechanical systems, with thousands of components,
    but it can also be used in software and hardware world. In the illustrated above,
    the simple swapping of parts would be to install the newer version of the operating
