- pgno: 12
  md: '# Do you have a problem?


    Now that you understand the, mission-critical scope of problem solving in a complex
    environment such as a large-scale data center, it is time to begin investigating
    system issues in earnest. Normally, you will not just go around and search for
    things that might look suspicious. There ought to be a logical process that funnels
    possible items of interest – let us call them events – to the right personnel.
    This step is just as important as all later links in the problem-solving chains.


    # IDENTIFICATION OF A PROBLEM


    Let us begin with a simple question. What makes you think you have a problem?
    If you are one of the support personnel handling environment problems in your
    company, there are several possible ways you might be notified of an issue.

    You might get a digital alert, sent by a monitoring program of some sort, which
    has decided there is an exception to the norm, possibly because a certain metric
    exceeded a threshold value. Alternatively, someone else, your colleague, subordinate,
    or a peer from a remote call center, might forward a problem to you, asking for
    your assistance.

    A natural human response is to assume that there means a problem. Likewise, if
    problem-monitoring software has alerted you, in case of an escalation by a human
    operator, you can often assume that other people have done all the preparatory
    work, and now they need your expert hand.

    But what if this is not true? Worse yet, what if there is a problem that no one
    is reporting?


    # IF A TREE FALL IN A FOREST, AND NO ONE HEARS IT FALL


    Problem solving can be treated almost philosophically, in some cases. After all,
    if you think about it, the most sophisticated software only does what its designer
    had in mind, and throughout are entirely under our control. This means that digital
    reports and alerts are entirely human in essence, and therefore prone to mistakes,
    bias, and wrong assumptions.


    However, issues that get raised are relatively easy. You have the opportunity
    to acknowledge them, and fix them or dismiss them. But, you cannot take an action
    about a problem that you do not know is.


    In the data center, the answer to the philosophical question is not favorable
    to system administrators and engineers. If there is an obscure issue that no existing'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# CHAPTER 1 Do you have a problem?


    monitoring logic is capable of capturing, it will still come to bear, often with
    interest, and the real skill lies in your ability to find the problems despite
    missing evidence.\It is almost like the way physicists find the dark matter in
    the universe. They cannot really see it or measure it, but they can measure its
    effect indirectly.

    The same rules apply in the data center. You should exercise healthy skepticism
    towards problems, as well as challenge conventions. You should also look for the
    problems that your tools do not see, and carefully pay attention to all seemingly
    ghost phenomena that come go. To make your life easier, you should embrace a methodical
    approach.


    # STEP-BY-STEP IDENTIFICATION


    We can divide problems into three main categories:


    +   - real issues that correlate well to the monitoring tools and prior analysis
    by your colleagues

    - false positives raised by previous links in the system administration chain,
    both human and machine

    - real (and spurious) issues that only have an indirect effect on the environment,
    but could possibly have significant impact if left unattended.


    Your first tasks in the problem-solving process are to decide what kind of event
    you are dealing with, whether you would acknowledge an early report or work toward
    improving your monitoring facilities and internal knowledge of the support teams,
    and how to handle come-and-go issues that no one has really classified.


    # ALWAYS USE TOOLS FIRST


    The data center world is a rich and complex one, and it is all too easy to get
    lost in. Furthermore, your past knowledge, while a valuable resource, can also
    work against such a setup. You may assume too much and overreach, trying to fix
    problems with an excessive dose of intellectual and physical force. To demonstrate,
    let us take a look at the following example. The actual subject matter is not
    trivial, but it illustrates how people often make illogical, far-reaching conclusions.
    It is a classic case of our sensitivity thresholding for the mysterious and vague
    in the face of great complexity.


    A administrator contacts his peers, who is known to be an expert on crashes, regarding
    a kernel panic that has occurred on one of his systems. The administrator asks
    for advice on how to approach and handle the crash instance and how to determine
    what caused the system panic.


    The expert lends help, and in the processes, briefly touches on the methodology
    for the analysis of kernel crash logs and how the data can be interpreted and
    used to isolate issues.


    Several days later, the same system administrator contacts the expert again, with
    another case of a system panic. Only this time the enthusiastic engineer has invested
    some time reading up on kernel crashes and tried to perform the analysis himself.
    His conclusion to the problem is: “We have got one more kernel crash on another
    server, and this time it seems to be quite an old kernel bug.”'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Identification of a problem


    The expert then does his own analysis. What he finds is completely different from
    his colleague. Toward the kernel crash log, there is a very clear instance of
    a hardware exception, caused by a faulty memory bank, which led to the panic.


    ```

    HARDWARE ERROR

    CPU 6: Machine Check Exception: 5 Bank 3: be000000002000151

    RIP: !INEXACT! 10:ffffffff80110bb4b -- [apic_timer_interrupt:0x7f/08c8]

    TSC 2d63c5d00fb ADR 10990 MISC 16485

    This is not a software problem!

    Run through malloc -- ascii to decode and contact your hardware vendor

    Kernel panic - not syncing: Machine check

    ```


    Copyright ©Intel Corporation. All rights reserved.


    You may wonder what the lesson to this exercise is. The system administrator did
    a classic mistake of assuming the worst when he should have invested time in checking
    things first. He did this for two reasons: insufficient knowledge in a new domain,
    and the tendency of people doing routine work to disregard the familiar and go
    for extremes, often with little foundation to their claims. However, once the
    mind is set, it is all too easy to ignore real evidence and create false logical
    links. Moreover, the administrator may have just learned how to use a new tool,
    or he may be biased toward using tool whenever possible.


    Using simple tools may not reveal much, but it will not expose. The beauty in
    a gradual escalation of complexity in problem solving allows things to be properly
    identified and resolved. This saves time and prevents the technicians from investing
    in chasing down false positives and the basic need for causality.

    At certain times, it will be perfectly fine and even desirable – to go for heavy
    tools and deep-down analysis. Most of the time, most of the problems will have
    simple root causes. Think about it. If you have a monitor in place, this means
    you have a mathematical formula, and you can explain the problem. Now, if you
    are just trying to prevent its manifestation or minimize damage. Likewise, if
    you have several levels of technical support handling a problem, it means you
    have identified the severity level, and you know what needs to be done.


    Complex problems, the big ones, will often manifest themselves in weird ways and
    you will be tempted to ignore them. On the same note, you will overinflate simple
    things and make them into huge issues. This is why you need to be methodical and
    focus on simple steps, to make the right categorization of problems, and make
    your life easier down the road.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# CHAPTER 1 Do you have a problem?


    # TOO MUCH KNOWLEDGE LEADS TO MISTAKES


    Our earlier example is a good example of how wrong knowledge and wrong assumptions
    can make the system administrator blind to the obvious. Indeed, the more experienced
    you are, the less you will be at resolving simple, trivial, well-known issues.
    You will not want to be fixing them, and you may even display an unusual amount
    of disregard and resistance when asked to step in and help.


    Furthermore, when your mind is tuned to reach high and far, you will miss all
    the little things right under your nose. You will make the mistake of being “proud,”
    and you will search for problems that increase your excitement level. When no
    real results of that kind are to be found, you will, by the grace of human nature,
    invent them.


    It is important to be aware of this logical fallacy lurking in our brains. This
    is the Achilles'' heel of every engineer and problem solver. You will be fighting
    the unknown, and you will find it anywhere.


    For this reason, it is critical to make problem solving into a discipline rather
    than an erratic, ad-hoc effort. If two system administrators in the same position
    or role use completely different ways of resolving the same issue, it is a good
    indication of a lack of a formal problem-solving process, core knowledge, understanding
    of your environment, and how things come to order.


    Moreover, it is useful to narrow down the investigative focus. Most people, occasional
    genius, tend to operate better with a small amount of uncertainty rather than
    complete chaos. They also tend to ignore things they consider trivial, and they
    get bored easily with the routine.


    Therefore, problem solving should also include a significant effort in automating
    the well known and trivial, so that engineers need not invest time repeating the
    obvious and mundane. Escalations need to be precise and methodical and well documented,
    so that everyone can repeat them with the same expected outcome. Skills should
    be matched to problems. Do not expect inexperienced technicians to make the right
    decisions when analyzing kernel caches. Likewise, do not expect your expert to
    be enhanced about running simple commands and checks, because they will skip them,
    ignore possibly valuable clues, and jump to their conclusions, adding to the entropy
    of your data center.


    With the right combination of known and unknown, as well the smart utilization
    of available machine and human resources, it is possible to minimize the waste
    during investigations. In turn, you will have fewer false positives, and your
    real will be able to focus on those weird issues with indirect manifestation,
    because those are the true ones you want to solve.


    # PROBLEM DEFINITION


    We still have not resolved any of our three possible problems. They remain, but
    at least we are a little less unclear how to approach them. We will now focus
    some more energy on trying to classify problems so that our investigation is even
    more effective.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# PROBLEM THAT HAPPENS NOW OR THAT MAY BE


    Alerts from monitoring systems are usually an indication of a problem, or a possible
    problem happening in real time. Your primary goal is to change the setup in a
    manner that will make the alert go away. This is the classic definition of threshold-based
    problem solving.


    We can immediately stop the pitfalls in this approach. If a technician needs to
    make the problem go away, they will make it go away. If it cannot be solved, it
    can be ignored, the threshold values can be changed, or the problem interpreted
    in a different way. Sometimes, in business environments, sheer management pressure
    in the face of an immediacy to resolve a seemingly acute problem can lead to a
    simpler solution: reclassification of a problem. If you cannot resolve it, acknowledge
    it, relabel, and move on.


    Furthermore, events have a maximum response time. This is called service level
    agreement (SLA), and it determines how the support team should provide a resolution
    to the problem. Unfortunately, the word resolution is misused here. This does
    not mean that the problem should be fixed. This only means that an adequate response
    was provided, and the next step in the investigation is known.


    With pressure, peer pressure, management mission statement, and real-time alignment
    combined, problem resolution loses some of its academic focus and becomes a social
    issue of the particular environment. Now, this is absolutely fine, Real-life business
    is not an isolated problem. However, you need to be aware of and when handling
    real-time issues.


    Problems that we are far more difficult to classify and handle. First, there is
    the matter of how you might find them. If you are handling real-time issues, and
    you close your eyes upon resolution, there is little left to follow on. Second,
    if you know something is going to happen, then it is just the matter of a postponed
    but fix. Last, if you do not know that a future problem is going to occur in your
    environment, there is little this side of time you can do to resolve it.


    This leaves us with a tricky question of how to identify possible future problems.
    This is where proper investigation comes into play. If you follow the rules, then
    your step-by-step, methodical procedures will have an expected outcome. Whenever
    results deviate from the known, there is a chance something new and unanticipated
    may happen. This is another important reason why you should stick to working in
    a gradual, well-documented, methodical manner.


    Whenever a system administrator encounters a fork in their investigation, they
    have a choice to make. Ignore the unknown and close the loop, or treat the new
    development seriously and escalate it. Every organization will be of curious and
    slightly paranoid people who do not let rest. They will make sure the issues are
    taken to someone with enough knowledge, authority, and company-wide vision to
    make the right decision. Let us explore an example.


    The monitoring system in your company sends alerts concerning a small number of
    hosts that get disconnected from the network. The duration of the problem is'
