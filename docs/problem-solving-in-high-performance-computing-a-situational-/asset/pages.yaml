- pgno: 283
  md: '# 274 CHAPTER 10 Fine-tuning the system performance


    +   - Physical tweaks may also include turning hyperthreading on, and then matching
    the SQL thread concurrency to the number of CPU threads.


    However, at this stage, we are mostly interested in what we can achieve in the
    / proc /sys space. Indeed, we have observed that the server is not handling the
    network throughput well, and the connections are timing out, we could potentially
    reduce the load. Some of the options that we can include in the following:


    +   - Echo 1 > /proc/sys/net/ipv4/tcp_abc – increase congestion window (tcp(7)),
    n.d.


    +   - Echo 1 > /proc/sys/net/ipv4/tcp_adv_win_scale – the socket receive buffer
    is shared between the application and the kernel. Kernel parts of the TCP window,
    which is the size of the receive window advertised to the other end. The rest
    of the space is used as the application buffer, to isolate the network from scheduling
    and application latencies. The tcp_adv_winscale default value of 2 implies that
    the space used for the application buffer is one fourth of the total. Changing
    the value could improve performance under heavy workload, either for the kernel
    or for the application itself.


    +   - Echo 1 > /proc/sys/net/ipv4/tcp_tw_reuse – this tunable allows TIME_WAIT
    sockets for connections when it is safe from the viewpoint of the protocol


    +   - Echo 1 > /proc/sys/net/ipv4/tcp_tw_recycle – this variable enables fast
    recycling of TIME_WAIT sockets, although in some network environments. However,
    for large data centers, where network address translation (NAT) is not normally
    used, it could be useful, in our case.


    +   - Echo 1 > /proc/sys/net/ipv4/tcp_max_syn_backlog – this parameter specifies
    the maximum number of queued connection requests that have not received an acknowledgement
    from the connecting client. If this number is exceeded, the kernel will begin
    dropping requests. On modern Linux systems, with sufficient memory, the value
    can be increased.


    +   - Echo 1 > /proc/sys/core/netdev_max_backlog – this value sets the maximum
    number of packets allowed to queue when a particular interface receives packets
    that the kernel can process. Doubling the number and testing could help in our
    scenario.


