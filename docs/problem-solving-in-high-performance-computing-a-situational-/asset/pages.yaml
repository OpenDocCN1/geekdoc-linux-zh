    other times, it will be the source of your problem. The same applies to CPU utilization,
    and other parameters.


    At the beginning of your investigation, you should consult the top and ps output
    for anomalies and then narrow down your search. Moreover, it is possible that
    these commands will not give you the clues you require, and you will need to extend
    your work.


    # SYSTEM LOGS


    The next logical step in troubleshooting is to check and read system logs. There
    are available log types, formats, and filenames of which are system-wide and others
    are process-specific. The default location for log is /var/log, and you may need
    root permissions to check some of these. Others may be world-readable. Some applications
    may store their own files in custom locations outside the /var partition, or may
    require logging to be manually enabled. The system log will typically be /var/log/messages
    or /var/log/syslog.


    Working with system logs is a double-edged sword. On one hand, you might find
    indicators of problems bothering your system. On the other hand, you may find
    instances of possible errors or entries that appear error-like, but they might
    be misleading, and could detract you from the actual investigation.


    It is important not to look in the log for the sake of looking. Often, there will
    be errors showing up in the messages, and their timestamps sometimes almost too'
