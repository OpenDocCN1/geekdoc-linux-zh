  md: '# 78 CHAPTER 5 Getting geeky - tracing and debugging applications


    NAME


    access - check real user''s permissions for a file


    SYNOPSIS


    ```

    #include <unistd.h>

    \int access(const char *pathname, int mode);

    ```


    DESCRIPTION


    access() checks whether the calling process can access the filename. If pathname
    is a symbolic link, it is dereferenced.


    The mode specifies the accessibility check(s) to be performed, and is either the
    value F_OK, or a mask consisting of the bitwise OR of one or more R_OK, W_OK,
    and X_OK. F_OK tests for the existence of the file. R_OK, W_OK, and X_OK test
    whether the file exists and read, write, and execute permissions, respectively.


    The check is done using the calling process''s real UID and GID, rather than the
    effective ID is when actually invoking an operation (e.g., open(2)) on the file.
    This allows set-user-ID programs to easily determine the user''s authority.


    If the calling process is privileged (i.e., its real UID is zero), then X_OK check
    is successful for a regular file if execute permission is enabled for any of the
    file owner, group, or other.


    RETURN VALUE


    On success (all requested permissions granted), zero is returned. On error (at
    least one bit in mode asked for a permission is denied, or some error occurred),
    -1 is returned, and errno is set appropriately.


    Copyright ©Intel Corporation. All rights reserved.


    If a system call is being executed and meanwhile another is called from a different
    thread/process, then trace will try to preserve the order of those events and
    mark the ongoing call as unfinished. When the call returns it will be marked as
    resumed.


    ```

    [pid 28772] select(4, {3], NULL, NULL, NULL <unfinished> ...)

    [pid 28779] clock_gettime(CLOCK_REALTIME, 1130322148, 9399770000)) = 0

    [pid 28772] <... select resumed> = 1 (in [3])

    ```


    Copyright ©Intel Corporation. All rights reserved.'
