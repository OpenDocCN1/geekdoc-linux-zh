    Consider the following example. One of your users complains that they observe
    a degradation in responsiveness after a prolonged heavy I/O activity on one of
    their systems. You can confirm the symptoms on the affected single host, but you
    cannot immediately decide why it comes to be on that particular system and not
    the others, even though the engineers run the same kind of workload and I/O activity
    patterns.


    Analyzing this kind of problem is not easy, and a deep understanding of the system
    memory management facility is required, but if you know where to look, you could
    narrow down the investigation to a more manageable set of unknowns.


    We will discuss some of the concepts later, but let us briefly deviate into the
    space of memory management. The Linux virtual memory (VM) subsystem is accessible
    under /proc/sys/vm. The tunables under this subtree govern the behavior of the
    memory when thresholds are reached. For example, the “dirty” parameters define
    when the write cache should be flushed to disk. The policies include a ratio of
    total memory, size, and expiration time.


    An experienced system administrator may immediately see a possible source for
    the problem. Since some of the parameters are expressed as a percentage of total
    memory, systems with different values – or even physical memory size – will not
    be in the same way when subject to seemingly the same workloads. The policies
    apply to pages, caches, swap behavior, and more.


    If you compare the experiencing degradation under sustained I/O load to other
    systems that do not exhibit the same issue, you may discover different values
    under the vm tree, which could possibly explain the behavior.


    Again, on their, the values are not as useful as compared to other systems, because
    they provide insights into how seemingly identical platforms are configured. This
    is a valuable tool for troubleshooting complex problems without a simple root
    cause. Moreover, if you make changes to the vm subsystem, you might want to observe
    and measure the results through the mininfo file.


    +   * /proc/modules - A list of all kernel modules currently loaded into memory.
    The same information is provided by the lsmod command.

    * /proc/mounts - The list of all filesystems. The information can be correlated
    to the /etc/mtab file. On some systems, the latter may actually be a symbolic
    link to this pseudo-filesystem. The list is useful when troubleshooting issues
    to network locations, mount and unmount problems, stale mount filesystems, and
    more.'
