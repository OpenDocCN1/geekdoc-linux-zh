    Configure KUMP_DUMPLEVEL

    This directive defines the level of data provided in the memory dump. Values range
    from 0 to 32. Level 0 means the entire contents of the memory will be dumped,
    with no detail omitted. Level 32 means the smallest image. The default value is
    0.


    ```

    KUMP_DUMPLEVEL=0

    ```


    You should refer to the configuration file for exact details about what each level
    offers and plan accordingly, based on your available storage and analysis requirements.
    We welcome to try them all. We recommend using 0 as it provides the most information
    though it requires a large amount of hard disk space.


    Configure KUMP_DUMPFORMAT

    This setting defines the dump format. The default selection is ELF, which allows
    you to open the dump with gdb and process it. You can also use compressed, but
    you can analyze the dump only with the crash utility. We will talk about these
    two tools in detail in separate tutorials. The default and recommended choice
    is ELF, even though the dump file is larger.


    ```

    KUMP_DUMPLEVEL="ELF*

    ```


    This concludes the necessary changes in the configuration file for Kdump to work.'
