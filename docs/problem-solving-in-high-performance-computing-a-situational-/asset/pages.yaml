- pgno: 26
  md: '# References 15


    want to prove, but you need to be able to tell what it is you are looking for
    and then prove yourself either right or wrong. But testing without a known outcome
    is just as effective as random guessing.

    If you tweak a kernel tunable, it must be done with the knowledge and expectation
    of what this particular parameter is going to do and how it is going to affect
    your system performance, stability, and the tools running on it. Without these,
    your work will be arbitrary and based on chance, and sooner or later, you will
    get lucky, but in the long run, you will increase the entropy of your environment
    and make your problem solving much more difficult.


    # CONCLUSIONS


    This chapter is just a warm-up before we roll up our sleeves and start investigating.
    But it is also one of the more important pieces of this book. It does not teach
    so much what you need to do, but rather how to do it. It also helps you avoid
    some of the classic mistakes of problem solving.

    You need to be aware of the constraints in your business environment – and then
    to challenge them. You need to focus on the core issues rather the easily visible
    ones, although they will go in hand. But most of the time, the problems will not
    wait for you to fix them, and they will not be obvious.

    The facts will be you. You will tend to focus on the familiar and known, and the
    metrics will not be able to tell you the internal mechanisms for most of your
    systems, which means that you will not be able to predict failures. However, if
    you invest time in resolving future problems through indirect observation and
    careful, step-by-step study of issues, you should be able to gain an upper hand
    over your environment woes. The end in it, is about minimizing the damage and
    gaining as much as you can over your data center assets.


