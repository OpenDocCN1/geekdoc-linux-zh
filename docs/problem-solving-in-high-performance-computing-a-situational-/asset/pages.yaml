    # Crash (capture) kernel


    This kernel needs to be compiled with the same parameters as above, one exception.
    Kdump does not support compressed images as crash (capture) kernels. Therefore,
    you should not compress this image. This means that your production kernels will
    most likely be named vmlinuz, the kdump crash kernels need to be uncompressed,
    hence named vmlinux, or rather vmlinux-kdump.


    # Kdump packages and files


    This is the list of required packages that must be installed on the system for
    Kdump to work. Please note that your kernel must be compiled properly for these
    packages to work as expected. It is very likely that you will succeed in installing
    them anyhow, but there is no guarantee that they will work. The package names
    and their information are shown in Table 6.1.


    The best way to obtain these packages is from your software repositories. It guarantees
    you will be using the most compatible version of Kdump and Kexec. Likewise, please
    note that the production kernel must also have the kernel-kdump installed. This
    package contains the crash kernel that is started when the standard kernel crashes,
    providing an environment in which the standard kernel state during the crash can
    be captured. The version of this package has to be identical to the production
    kernel.


    +   2 lists the most important Kdump-related files¹


    | Package Name | Package Information |

    | --- | --- |

    | Kdump | Kdump package |

    | Kexec-tools | Kexec package |

    | Kernel-debuginfo* | Crash analysis package (optional) |


