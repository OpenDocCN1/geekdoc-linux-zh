    # COMBINE BOTH TOOLS FOR BEST RESULTS


    Now, we will learn how to use both strace and ltrace at the same time.


    # The problem we have


    All right, let us assume that the startup of customer applications is slow. You
    wait 5–10 seconds for application windows to launch. Sometimes, it works fast,
    but you are not sure why. Usually, the problems occur after you log out of your
    session or following a reboot. The most annoying thing is if you try to fire up
    those programs with sudo or as root, there are no startup delays, and all seems
    to run fine. So how do you debug a problem like this one? Remember, your customers
    are displeased.


    # Rules of engagement


    Let us recap what we have learned in the previous chapters. If you want to be
    an awesome debugger, then there are several de-rules you must follow whenever
    you are trying to resolve a difficult problem. If it is something trivial you
    can fix in 2 minutes, fine, but if this is a new issue that has stumped you and
    your colleagues for more than an hour, then you should pause, rethink, and be
    methodical about it.


    # Be methodical


    Having a formulaic approach may make you appear to be a noob or a very efficient
    person. You choose. You should have a strategy that is uniform, generic, and all-encompassing
    for every problem that may come up. This means that you will be able to handle
    the situation whether you are flying airplanes or hacking the kernel.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Working with strace and Trace 93


    # Always begin with simple tools


    In theory, you can try to fix any problem with gdb right away, but that is not
    a smart use of the tools at hand or your intellect and time. You should always
    begin with simple things. Check the system logs for weird errors. Check top to
    assess the basic system health. Make sure you are not out of memory. Examine the
    disk and CPU load.


    # Comparison to a healthy system


    We have mentioned this approach in Chapter 2, and indeed, this may not always
    be applicable, but if you have a machine with an identical hardware and software
    configuration that does not exhibit the same problems, or two workload scenarios
    that produce different results, then you should compare between them to find what
    might be causing the bad system or the component to misbehave. This might not
    always be easy, but component search is the most powerful tool in statistical
    engineering and it applies well for mechanical parts as well as software. Now,
    we are ready to dig in.


    # Symptoms


    Our healthy system fires up xclock, our sample graphical tool, in less than a
    second. The bad system does the same, it takes 10 times longer. So we know something
    is slowed down but not necessarily broken.


    # Strace


    At this stage, running strace seems like a good idea. Rather than tracing every
    system through endless logs, we will only do the summary run, specified with -c
    flag. We want to see if there is anything significant in the tool''s run.


    # Strace log, good system


    Let us see what a strace gives us. The output is shown in Fig. 5.1.


    # Strace log, bad system


    The same thing for the misbehaving case, as shown in Fig. 5.2.


    # Strace comparison


    Looking at the two logs side by side, we see that there is a significant difference
    in the behavior of the two cases. On the good system, the four system calls are
    read, mprotect, open, and stat. We get system calls in the range of tens to hundreds,
    with some errors probably stemming from seeking files in $PATH. Another important
    element is the execution time, which takes about 1–2 milliseconds for each of
    the four system calls.


    On the bad system, the top hitters are open, mmap, and stat. Moreover, we have
    system calls in the range of thousands, approximately 10–20 times more than previous.
    We also have a large number of open calls. The execution time is in the range
    of 8–12 milliseconds, which is approximately 10 times longer than before. So we
    know something is wrong, but we do not know what exactly.'
