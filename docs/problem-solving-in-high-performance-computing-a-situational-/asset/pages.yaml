  md: '# How to respond to trends 241


    All of this emphasizes the importance of making deliberate decisions based on
    mathematics when creating monitoring solutions. Otherwise, most of the tools in
    place and their corresponding alerts will revolve around poorly understood links
    and errors.


    # HOW TO RESPOND TO TRENDS


    Let us call this proactive failure trending. If you are monitoring set up in the
    environment, and you are looking at trend graphs for anomalies, then you are trying
    to predict the future based on past information. In large, mission-critical setups,
    this becomes ever more important. For example, mere increase of just 1% in power
    utilization may seem negligible, but the actual amount and cost could be huge.
    Being able to discern a small change and respond before it becomes a well-established
    phenomenon is crucial.


    The same applies to all changes in which the response cycle might be. Introducing
    new hardware could take a long time, if it requires adding racks to the data center,
    physical installation of new hosts, network infrastructure setup, and similar.
    On the software level, problems with the operating system could cause significant
    downtime to customers, or down projects.


    Ideally, we want a simple, robust way of identifying trends, so that we can plan
    and prepare accordingly. We need a mechanism that has a forecast window that is
    longer than the time it takes for the monitored parameter to be changed, if necessary.


    # WHEN IT COMES TOO LATE


    Monitoring is easy to set up. However, good monitoring is extremely tricky, and
    it often eludes most companies. There are many reasons for this, with the lack
    of proper mathematics and problem-solving culture as one of the primary issues.
    Some of it is in manner. Typical IT organizations have their monitoring tools
    set up in the following manner:


    +   - Different departments take care of data center facilities (power, cooling),
    backbone (network), and operations (hardware, software).

    - In the software stack, operating system and services are usually considered
    backend tools, and they are monitored separately from customer-facing systems,
    which include applications and sometimes business intelligence tools.

    - Monitoring rules are historical (based on past experience).

    - Monitoring is skewed toward closing events as quickly as possible.

    - Most monitors are there to alert IT about problems that are not well understood
    and have not been systematically eradicated from the environment.

    - Quantity of data exceeds the ability of existing facilities to process the data
    in a meaningful and timely manner.'
