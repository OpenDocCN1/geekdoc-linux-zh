    # Kernel page error


    The four digits are a decimal code of the Kernel Page Error. You can find this
    information under arch/arm/fault.c in the kernel source tree.


    ```

    /* Page fault error code bits */

    #define PF_PROT (1<<0) /* or no page found */

    #define PF_WRITE (1<<1)

    #define PF_USER (1<<2)

    #define PF_RSVD (1<<3)

    #define PF_INSTR (1<<4)

    ```


    Copyright ©Intel Corporation. All rights reserved.


    +   - If the first bit is clear (0), the exception was caused by an access to
    a page that is not present; if the bit is set (1), this means invalid access right.

    - If the second bit is clear (0), the exception was caused by read or execute
    access; if set (1), the exception was caused by a write access.

    - If the third bit is clear (0), the exception was caused while the processor
    was in Kernel mode; otherwise, it occurred in User mode.

    - The fourth bit tells us whether the fault was an Instruction Fetch. This is
    only valid for 64-bit architecture. Since our machine is 64-bit, the bit means
    here.


