    # CONCLUSIONS


    First-level troubleshooting of system and environment problems is establishing
    the link between reported symptoms and actual behavior of hardware and software
    resources. From that end, we learned how to perform preliminary checks and investigation
    using system tools and utilities such as ps, top, vmstat, iostat, and others,
    as well as how to read system logs and correlate errors to monitoring alerts.
    We also discussed the details of what programs give us, where and how the information
    may be useful in our case. We wrap the initial work with a highly versatile tool
    such as sar, which allows us to bring our knowledge and insight together.


