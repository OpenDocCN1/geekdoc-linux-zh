    # COLLECTING KERNEL CORES (KDUMP)


    The Linux kernel is a stable robust entity. It is stable and fault-tolerant and
    usually does not suffer irrecoverable errors that crash the system and require
    a reboot to restore to normal production. Nevertheless, these kinds of problems
    occur from time to time. They are known as kernel crashes and are of utmost importance
    to administrators in charge of these systems. Being able to detect the crashes,
    collect them and analyze them provides the system expert with a powerful tool
    for finding the root to crashes and possibly the solution to eliminate critical
    bugs.


    There are several reasons that may cause the kernel to crash, all of them involving
    fatal, irrecoverable internal errors. Furthermore, the errors will manifest themselves
    in two specific conditions, known as *oops* and *panic*.


    An *oops* (Oops tracing, n.d.) is a deviation from the correct behavior of the
    Linux kernel. When the kernel detects a problem, it prints an oops message and
    kills any offending process. The message is used by Linux kernel engineers to
    debug the condition that created the oops and fix the programming error that caused
    it. Once a system has experienced an oops, some internal resources may no longer
    be in service. If the system appears to work correctly, undesirable side effects
    may have resulted from the active task being killed. A oops often leads to a kernel
    panic when the system attempts to use resources that have been lost.


    A kernel panic is an irrecoverable failure of the system, which can only be solved
    by hard reboot. When the situation occurs, it is possible to dump an image of
    the crashed kernel dump for disk analysis. This has to be done from the context
    of a second kernel, which is invoked when an oops or a panic condition is encountered.


    Oops and panic conditions may be caused by software bugs and faulty hardware.
    In this section, we will learn how to configure the system for kernel crash dump
    collection and analyze the saved memory cores. This will allow us to understand
    the root cause for the system failure and work toward resolving it, on both the
    hardware and software levels.


    # KDUMP SERVICE OVERVIEW


    The ability to save memory cores has existed for a number of years. Until several
    years back, the prevalent technology used for collecting crash dumps was Linux
    Kernel Crash Dump (LKCD)(LKCD, n.d.). However, LKCD, being an older project, exhibited
    several major limitations in its functionality: LKCD was unable to save memory
    dumps to local RAID (md) devices (Linux Raid, n.d.), and its network capability
    was restricted to sending memory cores to dedicated LKCD netdump servers'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Collecting kernel cores (Kdump) 145


    only on the same subnet, provided the cores were under 4 GB in size. Memory cores
    exceeding the 32-bit size barrier were corrupt upon transfer and unavailable for
    analysis. The same-subnet requirement also proved impractical for large-scale
    operations with thousands of machines.


    Kdump (Kdump, n.d.) is a much more flexible tool, with extended network-aware
    capabilities. It aims to replace LKCD, while providing better scalability. Indeed,
    Kdump supports network dumping to a range of devices, including local disks, also
    NFS areas, CIFS shares, or FTP or SSH servers. This makes it far more attractive
    for deployment in large environments, without restricting operations to a single
    server subnet.


    In this section, we will learn how to set up and configure Kdump for memory core
    dumping to local and network shares. We begin with a short overview of Kdump functionality
    and terminology. Next, we review the kernel parameters required to use them. After
    that, we go through the configuration file and study each device separately by
    step. We also edit the GRUB menu as a part of the Kdump setup. Last, we demonstrate
    the Kdump functionality, including manually triggering crashes and dumping memory
    cores to local and network devices.


    # Restrictions


    On one hand, this section examines the Kdump utility in great detail. On the other
    hand, a number of Kdump-related topics are only briefly discussed. It is important
    that you know what to expect from this tutorial.


    # Kernel compilation


    We will not explain the kernel compilation here, although we explain the parameters
    required for proper Kdump functionality. The kernel compilation is a delicate,
    complex process that merits separate attention, and it is beyond the scope of
    this book.


    # Hardware-specific configurations


    Kdump can run on the Itanium (ia64) and Power PC (ppc64) architectures. However,
    due to relative scarcity of these platforms in both the home and business use,
    we will focus on the i386 and x86-64 platforms. The platform-specific configurations
    for Itanium and PPC machines can be found in the official Kdump documentation.


    # Terminology


    To make things easier to understand, here is a brief lexicon of important terms
    we will use in this document:


    +   * Standard (production) kernel – kernel we normally work with.

    * Crash (capture) kernel – kernel specially used for collecting dumps.


    We will sometimes use only partial names when referring to these two kernels.
    In general, if we do not specifically use the word crash or capture to describe
    the kernel, this means we are talking about the production kernel. Kdump has two
    main components: Kdump and Kexec.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Kexec


    Kexec is a fastboot mechanism that allows booting a Linux kernel from the context
    of an already-running kernel without going through BIOS. BIOS can be very time
    consuming, especially on big servers with numerous peripherals. This can save
    a lot of time for developers who end up booting a numerous times.


    # Kdump


    Kdump is a (relatively) new crash dumping mechanism and is very reliable. The
    crash dump is captured from the context of a freshly booted kernel and not the
    context of the crashed kernel. Kdump uses Kexec to boot into a second kernel whenever
    the system crashes. This second kernel, often called a crash or a capture, boots
    with very little memory and captures the dump image.


    The first kernel reserves a space of memory that the second kernel uses to boot.
    Kexec enables booting the kernel without going through BIOS; hence, the contents
    of the first kernel''s memory are preserved, which is essentially the kernel crash
    dump.


    # Kdump installation


    There are quite a few requirements that must be met in order for Kdump to work.
    The production kernel must be compiled with a certain set of parameters required
    for kernel crash dumping.


    The production kernel must have the kernel-kdump package installed. The kdump
    package contains the crash kernel that is started when the standard kernel crashes,
    providing an environment in which the standard kernel state during the crash can
    be captured. The version of the kernel-dump package has to be identical to the
    standard kernel.


    If the operating system comes with a kernel already compiled to run and use Kdump,
    you will have quite a bit of time. If you do not have a kernel built to support
    Kdump functionality, you will have to do a bit of work, including a lengthy compilation
    and configuration procedure of both the standard, production kernel, and the crash
    (capture) kernel.


    In this section, we do not go into the details of kernel Kdump. The compilation
    is a generic procedure that does not relate to Kdump and demands dedicated attention.
    Nevertheless, although we will not compile, we will have to go through the list
    of kernel parameters that have to be configured so that your system can support
    the Kexec/Kexec functionality and collect crash dumps. These parameters need to
    be configured before kernel compilation.


    We will now go through the list of kernel parameters that need to be defined to
    enable Kdump/Kexec to function properly. For the sake of simplicity, this document
    focuses on the x86 (and x86_64) architecture.


    # Standard (production) kernel


    The standard kernel is a vanilla kernel downloaded from kernel.org (The Linux
    Kernel Archives, n.d.) or one of your favorite distributions. Whichever you choose,
    you will have to configure the kernel with several parameters.'
