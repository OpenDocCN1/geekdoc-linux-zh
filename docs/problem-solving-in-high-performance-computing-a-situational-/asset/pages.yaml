    Regarding the CONFIG_DEBUG_INFO variable, if you recall the Kdump asked earlier,
    this was a prerequisite we asked for, to be able to successfully troubleshoot
    kernel crashes. This tells the compiler to create objects with debug symbols.
    Alternatively, export the variable in the shell, as CONFIG_DEBUG_INFO = 1.


    ```

