    booted. So, you will probably use the following configuration to test Kdump:


    ```

    /usr/local/sbin/kexec -l /boot/mlinux-uname -r --initrd=/boot/initrd-uname -r--
    --command-line="cat /proc/cmdline"

    ```


    ©Intel Corporation. All rights reserved.


    Then, execute Kexec (it will load the above parameters):


    ```

    /usr/local/sbin/kexec -e

    ```


    ©Intel Corporation. All rights reserved.


    Your crash kernel should start booting. As mentioned earlier, it will skip BIOS,
    you should see the boot sequence in your console immediately. If this step completes
    successfully without errors, you are on the right path. I would gladly share a
    screenshot here, but it would look just like any other boot, so it is useless.


    The next step would be to load the new kernel for use on panic. Reboot and then
    test:


    ```

    /usr/local/sbin/kexec -p

    ```


    ©Intel Corporation. All rights reserved.


