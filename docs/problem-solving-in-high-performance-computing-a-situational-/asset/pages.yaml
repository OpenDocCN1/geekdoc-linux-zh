- pgno: 62
  md: '# A deeper look into the system 4


    By now, you have seen the /proc string mentioned in the text several times, and
    if you have worked with Linux to some extent in the past, you are familiar with
    what it means. /proc is a special filesystem in UNIX-like operating systems (/proc,
    n.d.) that presents the information about processes in a human-readable hierarchical
    tree-like structure. Mounted under /proc, this filesystem acts as an interface
    to the internal structures in the kernel, and therefore it is highly useful and
    important element of any troubleshooting.


    There are many advantages to this method of abstraction. For instance, the ps
    commands read data directly under the /proc tree, without having to execute system
    calls to obtain information. However, despite labeled as a filesystem, /proc does
    not allow working with its files in the same manner that you would with regular
    block devices, which is why it sometimes is referred to as a pseudo-filesystem.
    Most of the values are read-only, some kernel variables can be changed.


    # WORKING WITH /PROC


    Direct access to the kernel internals gives skilled administrators, developers,
    and engineers a great degree of power and freedom. It allows them to make changes
    to the system on the fly, without having to reboot and disrupt the normal work.
    This makes it an ideal way of testing new configurations and settings. For instance,
    if you are working on optimizing system performance, you can instantly alter the
    way of the subsystems behave or reboot.


    On the other hand, direct access to the kernel also has its drawbacks and perils.
    You have the ability to drastically affect the way operating system behaves, for
    better or worse. As a crude example, you can reboot a host or even cause the kernel
    to crash, by echoing a "wrong" value into an object under the /proc filesystem.


    Proc has importance in troubleshooting system issues. During your investigation,
    if and when you decide there might be a problem related to how the system itself
    behaves, you can make changes under /proc to prove or disprove your theories.


    It is important to make this distinction to other tools we have seen so far, as
    well as for troubleshooting. Proc values do not directly indicate if there is
    a problem or not, so you will have to measure their effect through symptoms exhibited
    by the system and the applications. Moreover, working with /proc often means leaving
    the rest of the environment unchanged. You do not manipulate tasks; you change
    the reality in which tasks run and observe the change.


