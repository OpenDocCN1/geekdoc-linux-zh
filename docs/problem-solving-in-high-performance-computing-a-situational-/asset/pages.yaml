  md: '# CHAPTER 3 Basic investigation


    The simplest Linux command that achieves all these checks is the (uptime, n.d.)
    command. Executed regularly, often through SSH (M. Joseph, 2013), uptime will
    collect and report the system load, how long the system has been running, and
    the number of users currently logged on.


    ```

    ssh myhost1 uptime

    09:47am up 60 days 21:00, 12 users, load average: 0.06, 0.03, 0.05

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Let us briefly examine the output of the command. The up value is useful if you
    need to correlate the system runtime with the expected environment availability.
    For instance, if you rebooted your servers in the last week, and have reports
    an uptime of 41 days, you may assume that this particular host—and probably others—may
    not have been included in the operation. For instance, this can be important if
    installed security patches or a new kernel, which require a reboot to effect.


    The number of logged-on users is valuable if you can correlate it to an expected
    threshold. For instance, a VNC server that might not have more than 20 users utilizing
    resources could suddenly be overloaded with more than 50 active logins, and it
    could be suffering from a degraded performance.


    The system load (Wikipedia, n.d., the free encyclopedia) is a very interesting
    set of figures. Load is a measure of amount of computational work that system
    performs, with average values for the last one, 5, and 15 minutes in the output,
    right to left. On them, these names have no meaning whatsoever, except to show
    you a possible trend in the increase or decrease of workload in the last 15 minutes.


    Analyzing load figures requires the system administrator to be familiar with key
    concepts, namely the number of running processes on a host, as well as its hardware
    configuration.


    A completely idle system has a load number of 0.00. In each process or waiting
    for CPU processes translates into full utilization of a single CPU core. If there
    is a system with two CPU cores, and the relevant average load value is 6.74, this
    means there is free capacity available. On the other hand, a load value with just
    two cores probably indicates an overload. But it gets more complicated.


    High values do not translate into actual workload. Instead, they indicate the
    average number of processes that waited for CPU, as well as the processes in the
    uninterruptible sleep (D state) (Rusling, 1999). In other words, processes waiting
    for I/O activity, us disk or swap, will show no to actual CPU activity. The exact
    nature of the workload on the host will determine whether the load numbers should
    be a cause of concern.


    For the first-level support team, the uptime output is a good indicator whether
    the alert ought be investigated in greater depth. If the SSH command takes a long
    time to return or times out, or perhaps the number of users on a host is very
    high, and the load numbers do not match the expected work profile for the particular
    system, additional checks may be needed.'
