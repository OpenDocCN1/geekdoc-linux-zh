    yourself involved in something that impacts 0.001% of your base?


    Three months from now, another data center in your company may report the same
    issue, only this time it will have hundreds of servers, with significant business
    impact. The issue will have been traced to a fault in the switch equipment. At
    this point, it will be too late.


    Now this does not mean every issue is a disaster waiting to happen. System administrators
    need to exercise discretion when trying to decide how to proceed with these unknown,
    yet-to-happen problems.


    # OUTAGE SIZE AND SEVERITY VERSUS BUSINESS IMPERATIVE


    The easy way for any company to prioritize its workload is by assigning severities
    to issues, classifying outages, and comparing them to the actual customers paying
    the bill for the server equipment. Since the workload is always greater than the
    work-force, the business imperative becomes the holy grail of problem solving.
    Or the holy excuse, depending on how you look at it.


    If the technical team is unable to fix an immediate problem, and the resolution
    may take weeks or months of hard follow-up work with the vendor, some people will
    choose to ignore the problem, using the excuse that it does not have enough impact
    to concern the customers. Others will push exactly because of the high risk to
    the customers. Most of the time, unfortunately, people will prefer the status
    quo rather than poke, change, and interfere. After a long time, the result will
    be outdated technologies and methodologies, justified in the name of the business
    imperative.


    It is important to acknowledge all three factors when starting your investigation.
    It is important to quantify them when analyzing evidence and data. But, it is
    also important not to be blinded by mission statements.


    Server outages are an important and popular metric. Tuing 99.999% server uptime
    is a good way of showing how successful your operation is. However, this should
    not be the only way to determine whether you should introduce disruptive'
