  md: '# What to do with collected data 221


    Let us consider the following example. In a special pool of high-memory-machines
    (1 TB and above) inside your data center, the customers execute special computation
    jobs, which they consider critical to their project. The technical definition
    is "critical-path jobs," and you want them to run as fast as possible. You are
    assigned as a member of an expert''s team, whose job is to optimize the system
    so that you achieve the shortest turnaround time. To make things a little more
    complicated, the servers used for these tasks are not identical, and they feature
    different storage solutions, CPU models, and parameters.


    Your first step is to profile the critical-path jobs to get the basic understanding
    of how they behave. After the initial few runs, you may decide they are CPU-bound,
    or memory-bound, or there be some other factor limiting the performance. Most
    of your results will be based on the time of executed tasks. For the sake of this
    exercise, let us assume that the tasks are most CPU intensive.


    At this point, you may start tuning the systems to get the best results, since
    you already have a basic bunch what could be improved. Enter kernel and system
    tunnels.


    One of the options is to change the CPU scheduler (SUSE Linux Enterprise Server
