- pgno: 180
  md: '# Crash analysis (crash) 171


    And there are many other commands. The true study begins here. We will soon review
    the usage of these commands. We will also examine several simulated, study cases,
    as well as real crashes on production systems.


    # Possible errors


    When running the crash utility, you may encounter various errors. We will now
    elabrate on a number of typical problems that can occur when trying to open the
    crash cores.


    # No debugging data available


    After running crash, you may see this error:


    ```

    crash: /boot/vmlinux-2.6.18-164.10.1.el5: no debugging data available

    ```


    ©Intel Corporation. All rights reserved.


    This means you are probably missing the debuginfo packages. You should start your
    package manager and double-check. If you remember, I have repeatedly stated that
    having the debuginfo packages installed is a prerequisite for using Kdump crash
    correctly.


    Vmlinux and Vcore do not match (CRC does not match)

    You may also get this error


    ```

    crash: /usr/lib/debug/boot/vmlinux-2.6.31-default.debug:


    CRC value does not match

    ```


    ©Intel Corporation. All rights reserved.


    If you see the following messages: “vmlinux vmcore do not match!" or "CRC does
    not match," this means you have invoked crash for the wrong version of debuginfo,
    which does not match the vmlinux file. Remember, you must use exactly the same
    version!


    # No guarantee


    There could be additional problems. Your dump may be invalid or incomplete. The
    header may be corrupt. The dump file may be in an unknown format. And even if
    the vmcore has been processed, the information therein may be partial or missing.
    For example, crash may not be able to find the task of the process causing the
    crash:


    ```

    STATE: TASK_RUNNING


    WARNING: panic task not found

    ```


    ©Intel Corporation. All rights reserved.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'There is no guarantee it will all work. System crashes are quite violent and
    things might not go as smoothly as you may desire, especially if the crashes are
    caused by hardware problems. For more details about possible errors, please consult
