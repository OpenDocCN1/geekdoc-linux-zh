- pgno: 165
  md: '# CHAPTER 6 Getting very geeky


    GRUB menu changes

    Because of the way it works, Kdump requires a change to the kernel entry in the
    GRUB (GNU GRUB, n.d.) menu. As you already know, Kdump works by booting from the
    context of the crashed kernel. The crash kernel must have a section of memory
    available, even when the production kernel crashes. To end this, memory must be
    reserved.


    In the kernel configurations earlier, we declared the offset point for our reservation.
    Now, we need to declare how much RAM we want to give to our crash kernel. The
    exact figure will depend on several factors, including the size of your RAM and
    possibly other restrictions. If you read sources online, you will notice that
    few figures are mostly used: 64 and 128 MB. The first is the default configuration
    and should work. However, if it proves unreliable for whatever reason, you may
    want to try the second value. Test-testing the kernel a few times should give
    you a good indication whether your choice is sensible or not.


    Now, let us edit the GRUB configuration file. We will demonstrate using the GRUB
    Legacy version. Changes for the GRUB2 bootloader are similar, and the scope of
    this section. First, make sure you back up the file before any changes.


    ```

    cp /boot/grub/menu.lst /boot/grub/menu.lst-backup

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Open the file for editing. Locate the production kernel entry and append the following:


    ```

    crashkernel=XM@YM

    ```


    Copyright ©Intel Corporation. All rights reserved.


    YM is the offset point we declared during the kernel compilation or that has been
    configured for us by the vendor. In our case, this is 16M. XM is the size of memory
    allocated to the crash kernel. As we have mentioned earlier, the most typical
    configuration will be either 64 or 128 MB. Therefore, the appended entry should
    look like


    ```

    crashkernel=64M@16M

    ```


    Copyright ©Intel Corporation. All rights reserved.


    A complete stanza inside the menu.lst file:'
  merge: -1
  img_proc: true
