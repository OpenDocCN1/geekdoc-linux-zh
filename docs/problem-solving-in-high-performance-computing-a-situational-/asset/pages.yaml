    # Annotation


    The use of annotate commands allows you to drill down the instruction level for
    profiled applications. In this mode, all the functions with samples will be disassembled
    and each instruction will have its relative percentage of samples reported. Interpreting
    this information is beyond the scope of this book due to its sensitive nature
    and the high level of understanding required for the profiled process.


    # Perf top command


    The perf tool can also operate in a mode that is very similar to the Linux top
    command, sampling functions in real time. By default, the top command show a down
    list of sampled functions, based on the time spent, working in the processor-wide
    mode. A variety of keyboard shortcuts are available to filter the information
    in different ways. We can see this in Fig. 5.8.


