    architects suggest possible variables that could lead to negative results, and
    such thresholds that they believe could be indicative of a problem. With thousands
    and millions of permutations of hardware and software combinations in the environment,
    to run classic experiments in which a single parameter is changed in linear or
    exponential increments and then the measure is impossible. This is the main reason
    why monitoring solutions, which are supposed to be proactive, are designed in
    a reactive manner, simply because the classic approach does not provide the necessary
    visibility into critical parameters and their values.


    Instead, with the statistical engineering approach, basically for each selected
    parameter, and then the highest variation in measured output is observed. In this,
    the problem complexity is one of o(n) rather than o(1). This is a first step creating
    a robust monitoring formula.


