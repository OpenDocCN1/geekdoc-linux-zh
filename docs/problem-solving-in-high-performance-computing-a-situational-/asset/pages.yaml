  md: '# Crash analysis (crash) 181


    Level 0 is the most privileged, known as Kernel mode. Level 3 is the least privileged,

    known as User mode.


    Most modern operating systems, including Linux, ignore the intermediate two

    using only 0 and 3. The levels are also known as rings.


    Current privilege level (CPL)


    Code segment (CS) register is the one that points to a segment where program

    instructions are set. The two least significant bits of this register specify
    the Current

    Privilege Level (CPL) of the CPU: two bits, meaning numbers between 0 and 3.


    Descriptor privilege level (DPL) and requested privilege level (RPL)

    Descriptor privilege level (DPL) is the highest level of privilege that can access
    the

    resource is defined. This value is defined in the segment descriptor. Requested

    priveilege level (RPL) is defined in the segment selector, the last two bits.
    Matem-

    cally, CPL is not allowed to exceed MAX(RPL,DPL), and if it does, this will cause
    a

    gen protection fault. Now, why is this all important, you?


    Well, if you encounter a case where the system crashed while the

    CPL was 3, then this could indicate faulty hardware because the system should
    not

    crash of a problem in the User mode. Alternatively, there might be a problem

    b buggy system call. these are just some rough examples. Now, let us continue

    analyzing our crash log:


    ```

    CS: 0010

    ```


    As we know, the two least significant bits specify the CPL. This means four

    levels; levels 1 and 2 are ignored. This leaves us with 0 and 3, the Kernel

    mode and User mode, respectively. Translated into binary format, we have 00 and
    11.


    The format used to present the descriptor data can be confusing, but it is very

    simple. Right the figure is even, then we are in the kernel mode; if the last

    figure is odd, then we are in the user mode. Hence, see that CPL is 0, since the

    offffending task led to the crash was running in the kernel mode. This is important

    to know. It helps us understand the nature of our problem. Just for reference,
    here

    is an example where the crash occurred in User mode:


