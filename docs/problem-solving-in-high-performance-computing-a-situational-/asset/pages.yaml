    # Disassemble the object


    Assuming you have found the source, it is time to disassemble the object compiled
    from this source. First, if you are running a debug kernel, then all the objects
    have been compiled with the debug symbols. You are lucky. You just need to dump
    the object and burrow into the intermixed assembly-C code. If not, you will have
    to recompile the source with debug symbols and reverse-engineer it.

    This is not a simple or trivial task. First, if you use a compiler other than
    the one used to compile the original, your object will be different from the one
    in the crash report, rendering your efforts difficult if not impossible.


    # TRIAL EXAMPLE


    We call this example trivial because it has nothing to do with the kernel. It
    merely demonstrates how to compile objects and then disassemble them.

    Run make <object name>. for instance:


    ```

    make object.o

    ```'
