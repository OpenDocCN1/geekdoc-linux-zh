- pgno: 57
  md: '# Statistics to your aid 47


    System CPU usage is high. Iowait values are not negligible, but they are not atypical
    for network- or disk-related activity on a busy machine. However, if we look at
    some of the other metrics in the iostat report, we can see that we are facing
    severe sluggishness due to lack of access. The sda device experiences an average
    of 50 ms wait time for requests to be processed. Normally, disk operations should
    be in low single-digit values at most, so either we have a very slow hard disk
    that cannot cope with the workload, or the workload is extremely heavy. Moreover,
    the wait time for an action for which most users will experience degradation in
    responsiveness, the so-called Doherty threshold, is about 400 ms (Doherty, 1982),
    and it applies, explaining the user''s report. The sda device utilization is 100%,
    which means the desk has reached its maximum through-put, and it will not gracefully
    handle other requests. All of the combined align with the reported issue.


    Still, this does not help you isolate the problem, although you can correlate
    the I/O activity with the processes in the top command. We will now study another
    system utility that can aid us in our troubleshooting.


    # SYSTEM ACTIVITY REPORT (SAR)


    SAR (sar(1, n.d.), also commonly spelled sar, is a highly versatile system monitoring
    tool that can collect, analyze, and report a wide range of system loads, including
    CPU, memory paging, network and storage utilization, filesystem usage, and more.
    The tool comes with several utilities:


    +   - sar collects and displays system statistics. The command runs from the command
    line in a manner similar to vstat and iostat. The output can be redirected to
    a file, or it can be written to a binary file. The advantage of the latter method
    is that all metrics are recorded, and users and system administrators can then
    check and correlate all of them, whereas seamless redirection will only capture
    the current collection view.

    - sadc(8, n.d.) stands for system data collector, and it is the backend tool used
    by SAR.

    - sa1 is a utility that runs from cron. It stores system activities collected
    by sadc into a binary log.

    - sa2 is also a tool that runs in a scheduled manner, and it creates daily summaries
    of collected statistics. It is useful for generating trends in the environment
    and for monitoring the behavior of various servers over longer periods of time,
    after problems have been resolved, or in a preventive measure, to avoid possible
    bottlenecks, resources contention and starvation, and similar issues.

    - sadf is a tool that can be used to convert the binary data reports to human-readable
    files in CSV, XML, and other formats, which can then be parsed in various ways,
    to generate graphs, and more.


    In general, it is possible to gather all the required data just by using the sar
    command, but you will need to adjust the logging and numbering to create the necessary'
