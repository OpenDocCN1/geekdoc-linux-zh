  md: '# What to do with collected data 213


    Mind you, there is no need for an exclusive black and white approach. Intranet
    resources can continue to exist and even flourish and grow. Alongside, you can
    keep a public record of problem-solving tactics that can be used by everyone.
    The concepts of application tracing, kernel debugging, or component search are
    universal methodologies that can always be applied and tried, regardless of the
    intellectual property specific to this or that company.


    Some of the large IT businesses have a healthy practice of sharing their methods
    with the world. This also helps position them as leaders in the industry, without
    any compromise to the integrity of their business.


    # DATA CLUTTER


    Quite often, investigation and problem analysis can lead to an accumulation of
    large quantities of raw data. Usually once data is collected, it never goes away.
    It becomes a sort of shrine, revered, and feared, but rarely put to any practical
    use.


    You can treat data collection as a sort of obsessive-compulsive disorder on a
    company scale. Metrics are created and then logged for the sole purpose of being
    there. For instance, information security teams are well known for this practice,
    and they lead the field with data collection. Unfortunately, the backlog rarely
    leads to meaningful results in the process of solving.


    # Intelligent guessing


    One of the ways to cope with large amounts of data is not to create them in the
    first places. Sometimes, it may appear necessary to collect everything, but it
    is possible to narrow the information through past experience and some skill.
    Your history of problem solving will include several typical, representative scenarios
    that will revolve around one or two critical parameters, whereas your systems
    will mostly be to all others.


    Let us consider the following example. In a data center with a thousand servers,
    CPU metrics are reported to a central database every minute. When thresholds are
    exceeded, alerts are raised. At this point, system administrators are expected
    to take corrective actions to restore the CPU activity below the thresholds. This
    is how CPU data has been sampled for years, and the practice remains.


    However, observe little to no correlation in CPU usage to actual problems. You
    find the total memory usage to be far more accurate in foretelling the situations
    in which servers deviate from their expected behavior. Most of the time, no action
    will be taken. In the best case, the monitoring team may raise thresholds to a
    higher bar, this reducing the noise, and hoping that increased loads will eventually
    correlate to problems. They may ignore the CPU alerts altogether.


    However, the smart thing to do is improve the CPU metric because it yields useful
    results. Naturally, the concept of letting go sounds frightening, and most people
    will to implement, in just case some terrible corner case occurs, and they are
    held accountable for the resulting damage.'
