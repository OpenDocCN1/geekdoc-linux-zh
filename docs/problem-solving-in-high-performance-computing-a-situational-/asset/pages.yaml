- pgno: 47
  md: '# Profile the system status 37


    The message does not appear innocent, as it indicates a real problem with the
    filesystem, which could be a result of a serious hardware error. None of your
    monitors are alerting, and this means you should probably not invest any energy
    resolving this.


    Half an hour later though, you get a call from the first-level support, informing
    you that one of the databases, running on that particular server at the same time
    the tables stored on the SAN device, goes offline at about the time EXT3-fs error
    messages started up. All of sudden, the entries are meaningful, and you know what
    to do, but then you might have been able to prevent damage or downtime if you
    had responded early.


    This example goes against the basic principle of data-driven investigation, because
    there was no investigation when you encountered the data, and yet it is clearly
    related to a big system problem. The solution in this case is to improve the monitoring
    facility rather than change problem-solving methods. In fact, whenever you encounter
    a gap in the way you work, you should examine your situational awareness and make
    changes that you get meaningful data earlier, and if possible, identify problems
    on lower levels than those currently monitored and checked.


    If the default view does not provide any useful information, and you are certain
    there might be a problem with one of the running services, you might want to consider
    briefly increasing the verbosity of the output.


    In general, you probably do not want to change the logging policy on the server.
    But, you can alter the ways services report their information to the system log.
    Using NFS as an example, if you are troubleshooting an issue that seems to be
    related to network storage, you might increase the debug level of the NFS service
    or client for a while, collect additional information, and then restore the values
    to their original state:


    ```

    echo 32767 > /proc/sys/sunrpc/nfs_debug

    echo 32767 > /proc/sys/sunrpc/nfs_debug

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Working under /proc and making immediate changes to the system behavior is a very
    useful way of trying to isolate problems, as well as test scenarios that can improve
    performance and stability. We will discuss this in the next chapter.

    Another log is /var/log/kernel. This file contains messages printed by the kernel
    since reboot, and it is equivalent to the data provided by the dmesg command,
    with you also get timestamps, which are extremely useful in correlating problems.

    Kernel messages are even more cryptic and potentially misleading than the system
    log. Some of the printed information may not make sense, and you should avoid
    trying to decipher it unless you are handling a problem.'
