- pgno: 27
  md: '# the investigation begins

    2


    The first chapter gave us a mostly philosophical perspective on how one should
    approach problem solving in data centers. We begin our work with preconceptions
    and bias, and they often interfere with our judgment. Furthermore, it is all too
    easy to get hung on conventions, established patterns and habits, and available
    numbers – and we deliberately avoid using the word data because it may imply the
    usefulness of these numbers – which distract us from problem solving even more.


    Now, we will give our investigation a more precise spin. We will apply the concepts
