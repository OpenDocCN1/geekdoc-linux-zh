  md: '# 152 CHAPTER 6 Getting very geeky


    Configure KDUMP_RUNLEVEL

    This is another important directive. It defines the runlevel into which the crash
    kernel should boot. If you want Kdump to save crash dumps to a local device, you
    can set the runlevel to 1. If you want Kdump to save dumps to a network storage
    area, such as NFS, CIFS, or FTP, you need the network functionality, which means
    the runlevel should be set to 3. You can also use 2, 5, and s. If you opt for
    runlevel 5 (not recommended), make sure the crash kernel has enough memory to
    boot into the graphical environment. The default 64 MB is likely insufficient.


    ```

    KDUMP_RUNLEVEL="1"

    ```


    © Intel Corporation. All rights reserved.


    Configure KDUMP_IMMEDIATE_REBOOT

    This directive tells Kdump whether to reboot out of the crash kernel once the
    dump is complete. This directive is ignored if the KDUMP_DUMPDEV parameter (see
    below) is not empty. In other words, if a dump device is used, the crash kernel
    will not be rebooted until the transfer and possibly additional postprocessing
    of the dump image to the destination directory are complete. You will most likely
    want to retain the default value.


    ```

    KDUMP_IMMEDIATE_REBOOT="yes"

    ```


    © Intel Corporation. All rights reserved.


    Configure KDUMP_TRANSFER

    This setting tells Kdump what to do with the dumped memory core. For instance,
    you may want to postprocess it instantly.


    KDUMP_TRANSFER requires the use of a non nonempty KDUMP_DUMPDEV directive. Available
    choices are /proc/vmcore and /dev/oldmem. This is similar to the LKCD utility.
    Normally, either /proc/vmcore or /dev/oldmem will point to an unused swap partition.

    For now, we will use only the default setting, which is just to copy the saved
    core image to KDUMP_SAVEDIR. We will talk about the KDUMP_DUMPDEV and KDUMP_SAVEDIR
    directives shortly. However, we will study the more advanced transfer options
    only when we discuss crash analysis utilities.


    ```

    KDUMP_TRANSFER=""

    ```


    © Intel Corporation. All rights reserved.'
