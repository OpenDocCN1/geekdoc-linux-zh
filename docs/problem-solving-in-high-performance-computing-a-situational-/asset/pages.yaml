  md: '# CHAPTER 5 Getting geeky – tracing and debugging applications


    +   - strsize – Specify the maximum string size to print (the default is 32).
    Note

    that filenames are not considered strings and are always printed in full.


    # What you need to know before using strace


    Strace is a useful diagnostic, instructional, and debugging tool. System administra-

    tortians, and troubleshooters will find invaluable for solving problems

    programs with which the source is not readily available as they do not need to

    recompiled to trace them. Students, hackers, and the curious will find that

    a great deal can be learned about a system and its system calls by tracing even

    ordinary programs. And programmers will find since system calls and signals

    are events that happen at the user/kernel interface, a close examination of this

    boundary is very for debug isolation, sanity checking, and attempting to

    capture records.


    There are a few things we would like to emphasize before we start exploring

    power of this great tool:


    +   - Strace is not a magic bullet. It will provide some limited information

    about the running process. To get the full picture, you will need to use ltrace,
    as

    well as a debugger. You may also need to have your applications, or the kernel,

    compiled with debugging symbols, or you may use a profiling framework to

    examine the routine of an affected process.

    - Strace is only the beginning. It is a very good beginning. It will let you know
    whether to leave things or to power\he full debugging process. Better yet, it
    may provide a solution to

    your.

    - Strace should be used when you encounter reproducible issues with your

    programs without an obvious sign for problems. We will soon see a few

    examples that demonstrate this in crystal-clear detail.

    - Strace hooks processes and basically forces them to repeat every system call

    tice, once for the race and once for the actual execution. This introduces

    a time penalty into the run. Furthermore, this means that delicate problems

    dependent on exact timing of execution, such as various race bugs¹,

    may not manifest when traced.

    - Strace may crash your applications.

    - Strace 64-bit may not work well with 32-bit programs.


    Not all programs can be traced and they may crash, either because of bugs or the

    way they have been coded, including possibly trying to prevent tracing to keep

    the process execution as secret as possible. This is often the case with proprietary

    software.


