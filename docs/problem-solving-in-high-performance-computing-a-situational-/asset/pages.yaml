    often written by system administrators leave zombies behind. Although not harmful
    in effect, do identify a problem with one of the tasks that has been executed
    on the system. In theory, a large number of zombie processes could completely
    fill in the process table, but this is not a limitation on 64-bit systems. Nevertheless,
    if you are investigating a problem and encounter many zombies, you might want
    to inform your colleagues or your own software, make sure you are not creating
    a problem of yours.


    CPU(s) – this line offers a wealth of indicators on the system behavior. The usage
    of the active cores is divided based on the type of CPU activity. Computation
    in the system is marked under %us. The percentage of system calls is listed under
    %sy.


    A proportion of nice(1), n.d.) processes, that is, processes with modified scheduling
    priority, show under %ni. Users may decide that some of their tasks ought to run
    with adjust niceness, which could affect the performance and runtime of the program.


    I/O activity, both disk and network, is reflected in %wa figure. The CPU wait
    time is an indication of storage and network throughput, and as we explained before,
    it may directly affect the load and responsiveness of a host even though CPU computation
    be low.


    Hardware and software interrupts are marked with %hi and %si. The importance of
    these two values is beyond the scope of this book, and for most part, users will
    rarely ever have to handle problems related to these mechanisms. The last field,
    %st, refers to time stolen by the hypervisor from virtual machines, and as such,
    it is only relevant in virtualized environments.


    As a rule of thumb, very high %sy values indicate a problem in the kernel space.
    For instance, there may be significant thrashing, a drive may be misleading, or
    there may be a hardware problem with one of the components. Having a high percentage
    of nested processes can also be an indicator of a problem, because there could
    be contention for resources due to user-skewed priority. If you encounter %wa
    values over %10, it is often an indication of a performance-related problem, which


