    ```


    Copyright ©Intel Corporation. All rights reserved.


    Please pay attention to the syntax. You can also use the absolute directory paths

    in the quotation marks without a prefix, but this is discouraged. You should

    specific what kind of protocol is used, with file:// for local directories, nfs://
    for NFS

    storage, and so on. Furthermore, you should make sure the destination is writable
    and

    that it has sufficient space to accommodate the memory cores. The KDUMP_SAVEDIR
    directive can be used in conjunction with KDUMPUMPDEV, which we will

    discuss this later on.


    Configure KDUMP_KEEP_OLD_DUMP

    This setting defines how many dumps should be kept before rotating. If you are
    short

    on space or are collecting numerous dumps, you may want to retain only a small

    umber of dumps. Alternatively, if you require a traceback as long and thorough
    as

