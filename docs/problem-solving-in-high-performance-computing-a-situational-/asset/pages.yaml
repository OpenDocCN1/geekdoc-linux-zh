- pgno: 46
  md: '# CHAPTER 3 Basic investigation


    coincidentally correlate to environment issues. However, this does not necessarily
    mean the two are linked, and you should avoid any hasty assumption based on a
    cursory glance in the log.


    The flow of your investigation should be evidence driven. postulate a theory based
    on initial data, expand the checks to create additional dimensions of understanding,
    propose a solution, and then test whether your idea is correct. This means that
    you should look the logs after you have a solid idea of what to look for. Let
    us examine two log sections.


    ```

    Sep 22:28:21 test01 automount[3619]: attempting to mount /nfs/disks/checks

    Sep 22:28:21 test01 automount[3619]: attempting to mount /nfs/disks/sh

    Sep 22:28:21 test01 automount[3619]: lookup(program): lookup for sh failed

    Sep 22:28:21 test01 automount[3619]: failed to mount /nfs/disks/sh

    Sep 22:28:21 test01 automount[3619]: mounted /nfs/disks/checks

    ```


    Copyright ©Intel Corporation. All rights reserved.


    The excerpt from the messages shows an automount lookup for an NFS disk. Let us
    say this issue occurred about the same time one of your customers reported slow
    access to their shared worked area.


    At this point, in a moment of haste, despair, and confusion, you might find there
    is a problem with the automounter service, and that is some related. After all,
    your environment is configured with NFS and autos access. Remember, investigations
    be data driven. The customer area located on the same disk as that shows error?
    More importantly, what does the lookup error mean? Can it be related to what your
    customer has reported? For instance, slow access implies a performance issue,
    network latency, or an internal problem with one of the customers'' tools or utilities,
    whereas a lookup failure indicates there might not be an autos maps entry for
    the relevant path, which would result in no access at all, and the area would
    not be mounted. It might point to a completely different issue, but not the one
    you are initially to solve.


    The second example is more meaningful. Let us say that you encounter it while
    going through the log, without any clear indication of a problem on the server
    side. You see this message on a virtual machine, which is located on SAN storage.
    The listed device (power2) corresponds to an SAN volume.


