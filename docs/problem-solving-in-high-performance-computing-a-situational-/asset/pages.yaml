- pgno: 3
  md: '# # Preface


    I have spent most of my Linux career counting servers in their thousands and tens
    of thousands, almost like a musician staring at the notes and seeing hidden shapes
    among the harmonics. After a while, I began to discern patterns in how data centers
    work – behave. They are almost like living, breathing things; they have their
    ups and downs, their cycles, and their quirks. They are much more than the sum
    of their ingredients, and when you add the human element to the equation, they
    become unpredictable.


    Managing large deployments, the kind you encounter in big data centers, cloud
    setup, and high-performance environments, is a very delicate task. It takes a
    great deal of expertise, effort, and technical understanding to create a successful,
    efficient work flow. Future vision and business strategy are also required. Amid
    all of these, quite often, one key component is missing.


    There is no comprehensive strategy in problem solving.

    This book is my attempt to create one. Years in designing solutions and products
    that would make the data centers under my grasp better, more robust, and more
    efficient exposed me to the fundamental gap in problem solving. People do not
    fully understand what it means. Yes, it involves tools and hacking the system.
    Yes, you may script some, or you might spend many long hours scrolling down your
    screen. You might even plot graphs to show data trends. You must consult your
    colleagues about issues in their domain. You might participate in or lead task
    forces trying to undo crises and heavy outages. But in the end, there is no unifying
    methodology that brings together the pieces of the puzzle.


    An approach to problem solving with situational awareness is an idea that borrows
    from the fields of science, replacing human intuition with mathematics. We will
    be using systematic engineering and design of experiment to battle chaos. We will
    work slowly, systematically, step by step, and try to develop a *consistent* way
    of fixing identical problems. Our focus will be on busting myths around data,
    and we will shed some of the preconceptions that pervade the data center world.
    Then we will transform the art of troubleshooting into a product. It may sound
    brutal that art should be sold by the pound, but the necessity will become obvious
    as you progress throughout the book. And for the impatient among you, it means
    touching on the subjects of monitoring, change control and management, automation,
    and other best practices that are only now slowly making their way into the modern
    data center.'
  merge: -1
  img_proc: true
