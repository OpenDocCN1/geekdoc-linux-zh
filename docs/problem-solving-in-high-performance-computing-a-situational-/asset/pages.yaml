    in statistics, few people will know how to interpret the results. There are several
    useful industry methods that can help administrators manage their data more effectively.
    We will discuss them in a few moments.


    # Housekeeping


    Over time, data collection tends to grow, both in size and scope. Whenever a new
    problem with a seemingly large impact is found and resolved, metrics and alerting
    rules are added to avoid the future manifestation of the problem. Most of the
    time, new rules are added without an expiration date, running forever. After a
    while, months or years, the original problem and the technology where it became
    irrelevant, the technical team handling the issue has moved to new jobs, but the
    data remains shrouded in ambiguity and the fear of breaking practices, and the
    overall flow of things.


    You should consider reviewing the production environment on a periodic basis and
    pruning all unnecessary data collectors and monitoring directives that are no
    longer relevant in the current reality. You should also seek correlations to problems,
    and if none are found, aggressively remove the methods introduced to find these
    correlations in the first place. Once again, you should refer to statistical methods
    and tools to help you make the right decision.


    If we go back to our earlier CPU example, removing the CPU monitor as well as
    the logged data is correct, logical way of managing the environment. It will also
    reduce the overall quantity of data, allowing for a much better, more effective
    awareness of the production setups.


    # Meaningful retention


    You may assume that retention and housekeeping are one and the same. It is not
    quite true. Meaningful retention is what will help reduce clutter and the need
    for housekeeping, after you have decided a certain metric is worth logging and
    keeping. Moreover, you will retain only the data you really need store, instead
    of collecting vast amounts of information that you can barely store, let alone
    process with any kind of timely and intelligent response.


    When you start investigating a problem, does it make sense to begin collecting
    large amounts of data, especially if you are not really certain where the issue
    originates, or if you do not fully know what the issue might be. However, later
    on, after you have gained statistical confidence, you should narrow down the collection
    to only the relevant data.


    A good example of data retention is always related to information security. One
    of the common practices with security teams is to report local system logs on
    every single server in the data center to a remote, centralized database, wherein
    a smart business intelligence engine will parse the log entries and detect anomalies.


    However, this data collection is often done without a precise objective in mind,
    making everything and anything potentially suspicious. This leads to a lot of
    storage'
