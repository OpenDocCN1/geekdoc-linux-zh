    level to determine whether your test hypothesis is true or not.


    Indeed we are interested in the P-Value, which is the probability of obtaining
    a test statistic at least as extreme as that was obtained. Since no condition
    is perfect, there is always a certain significance level, and normally, under
    most circumstances, there is a 5% probability that a model F-ratio could occur
