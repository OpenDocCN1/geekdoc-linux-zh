- pgno: 214
  md: '# Crash analysis (crash) 205


    We started with the situation in which our kernel is experiencing instability
    and is crashing. To solve the problem, we set up a robust infrastructure that
    includes a mechanism for kernel crash collection and tools for the analysis of
    dumped memory cores. We now understand what the seemingly cryptic reports mean.


    The combination of all the lessons learned during our long journey allows us to
    reach a decision about what should be done next. How do we treat crashing machines?
    Are they in for a hardware inspection, reinstallation, or something else? Maybe
    there is a bug in the kernel internals? Whatever the reason, we have the tools
    to handle the problems quickly and efficiently. Finally, there are some last-minute
    tips, very generic, very generalized, about what to do next.


    # Single crash


    A single crash may seem like too little information to work with. Do not be discouraged.
    If you can, analyze the core yourself or send the code to your vendor support.
    There is a fair chance you will find something wrong, with software at hand, the
    kernel or the hardware underneath.


    # Hardware inspection


    Speaking of hardware, kernel crashes can be caused by faulty hardware. Such crashes
    usually seem sporadic and random. If you encounter a host that is experiencing
    many crashes, all of which have different tasks, you might want to consider scheduling
    downtime and running a hardware check on the host, including precum, CPU stress,
    disk checks, and more.


    The exact definition of what is considered “many” crashes, how critical the machine
    is, how much downtime you can afford, and what you intend to do with the situation
    is up to the individual and will vary from one admin to another.

    But is it important to distinguish problems caused by software versus those caused
    by hardware problems. Since we assume that no user-space application may crash
    the kernel, whenever we encounter a trace that points to a user-space task, then
    it is quite likely the crash was caused by either a bad system call or a hardware
    error. This is an important piece of information if you are using third-party
    software that implements its own calls. Moreover, if you think there is no software
    problem, then it could be a hardware fault.


    # KERNEL BUGS VS. HARDWARE ERRORS


    Trying to discern kernel bugs and hardware errors can be tricky, especially if
    the crash reports do not specifically indicate either type. We have seen examples
    with memory issues and the use of the string BUG, which make our life easier.


    ```

    349.339841 BUG: unable to handle kernel NULL pointer dereference (null)

    ```


    Copyright ©Intel Corporation. All rights reserved.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# HARDWARE ERROR


    | CPU 6: Machine Check Exception: | 5 Bank 3: b62000070002010a |

    | RIP !!INEXACT!: 33:<00002aac1de6224> |

    | TSC 33241ebfff96 ADDR 7641b7080 |

    | This is not a software problem! |


    Copyright ©Intel Corporation. All rights reserved.


    However, what do you do when the exception is a name of symbol and the offset
    in the function? Luckily, there is a relatively simple way to discern between
    the two types.


    Multiple crashes of a single host with different exception – this will most likely
    be a hardware-related problem caused by a buggy CPU or memory. The kernel will
    oops or panic in different places in the code, simply by triggering the underlying
    hardware issue.


    Multiple crashes of several hosts with the same exception – if you encounter a
    number of kernel crashes with the same exception and offset string, you can assume
    there is a bug in the kernel or one of the loaded modules. In general, the exception
    RIP string is a unique identifier for kernel problems, and you can use it to understand
    and isolate your environment problems.


    # SUMMARY


    We worked carefully and slowly through the crash analysis series. In this part,
    we have finally taken a deep, look at the kernel internals and now have the right
    tools and the knowledge to understand what is bothering our kernel. Using this
    new wealth of information, we can work on making our systems better, smarter,
    and more stable.


    # KERNEL DEBUGGER


    A full-blown kernel debugger (Wessel, 2010) is the last resort for trying to troubleshoot
    kernel-related issues. If you have encountered a rare problem that you suspect
    not be easily replicated after a crash, and you need to perform initial investigation
    right then, in the live kernel, then your option is to launch the kernel debugger.


    This operation is rather destructive as execution of the kernel will be halted
    while the debugger is running. From the perspective of any user running an active
    session or on the host, it will appear as if the host has temporarily frozen,
    and most applications with network related activities will not handle the interruption
    in a graceful manner. Worse, they may recover with unexpected corruptions that
    may not be noticed, or with weird behavior that could affect the runtime outcome.


    Debugging a live kernel means that any mistake you make will change the kernel
    structures, which could trigger a crash by itself. A very high level of knowledge
    is needed to perform a successful analysis, even more so than when using the crash
    utility'
