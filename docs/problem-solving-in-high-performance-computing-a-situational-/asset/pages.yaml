    # CONFIGURATION MANAGEMENT SOFTWARE


    There are many programs available, with their distinct advantages and capabilities.
    Your decision for the right tool will revolve around pricing, deployment size,
    operating systems and flavors, type of changes that you want to control, available
    skillset in your company, and others. To name a few, there are several popular
    tools that you might want to consider for your first, high-level exploration in
    this field:


    +   - Chef (Chef, n.d.) is designed to treat infrastructure as code. Business
    logic is translated into recipes, which are deployed on target systems, known
    as nodes. Clients then poll the server periodically and pull the latest updates,
    keeping the environment standardized. The software also offers integration with
    analytical tools, and it comes with its own management control.

    - CFEngine (CFEngine, n.d.) is a configuration management and automation framework,
    for networks up to 50,000 nodes. Here, the necessary logic is encapsulated inside
    packages, which are distributed and executed based on classes.

    - Puppet (Puppet, n.d.) offers a similar approach, using its descriptive language
    to define manifests, which are then used on target systems. Like the other tools,
    it offers integration with cloud solutions, Linux containers, and other technologies,
    with scale and cross-platform operation in mind.


    # THE CORRECT WAY OF INTRODUCING CHANGES INTO THE ENVIRONMENT


    Even if you have all the tools and methods in place, you still need to exercise
    caution when changing your production environment. Essentially, every single change
    is an opportunity to deviate from a well-established, clearly understood status'
