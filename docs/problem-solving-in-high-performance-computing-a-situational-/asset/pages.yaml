- pgno: 20
  md: '# PROBLEM REPRODUCTION


    Let us put the bureaucracy and old habits aside. Your mission is to conduct a
    precise and efficient investigation of your problem. You do that with the full
    understanding of your own pitfalls, of your environment complexity, the constraints,
    as well as the knowledge that most facts will be wired against you.


    # CAN YOU ISOLATE THE PROBLEM?


    You think there is a new issue in your environment. It looks to be a non-realtime
    problem, and it may come to bear in the future. By now, you are convinced that
    a methodical investigation is the only way to do that.


    You start simple, you classify the problem, you suppress your own technical hubris,
    and you focus on the facts. The next step is to see whether you can isolate and
    reproduce the problem.

    You also have a host that is exhibiting nonstandard, unhealthy behavior when communicating
    with a remote file system, specifically remote file system (NFS) (RFC, 1995).
    All right, let us complica some more. There is also automounted (Autofs, 2014)
    involved. The monitoring team has flagged the system and handed off the case to
    you, as the expert. What do you do?


    There are dozens of components that could be the root cause here, including the
    server hardware, the NFS client program, the autofs, and so far, this is the only
    client side. On the remote server, we could suspect the NFS service, or there
    might be an issue with permissions, firewall rules, and in between, the data center
    network.


    You need to isolate the problem. Let us start: Is the problem limited to just
    one host, the one that is shown in the monitoring systems? If so, can you be certain
    that there is no problem with the network or the remote file system. You have
    isolated the problem.

    On the host, you could try accessing the filesystem manually, using the automounter.
    If the problem persists, you can continue peeling additional layers, trying to
    understand where the root cause might reside. Conversely, if more than a single
    client is affected, you should focus on the remote server and the network equipment
    in between. Figure out if the problem manifests itself only with one specific
    file server or filesystem or all of them.


    It is useful to draw a diagram of the environment, as you know and understand
    it, and then test each component. Use simple tools and slowly dig deeper. Do not
    assume kernel bugs until you have finished with the easy checks.

    After you have isolated the problem, you should try to reproduce it. If you can,
    it means you have a deterministic, formulaic way of capturing the problem manifestation.
    You might not be able to resolve the underlying issue yourself, but by understand
    the circumstances and when it happens. This means that the actual fix from your
    vendor should be relatively simple.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# CHAPTER 1 Do you have a problem?


    But what do you do if the problem''s cause eludes you? What if it happens at random
    intervals, and you cannot find an equation to the manifestation?


    # SPORADIC PROBLEMS NEED SPECIAL TREATMENT


    Here, we should refer to Arthur C. Clarke''s Third Law, which says that any scientifically
    advanced technology is indistinguishable from magic (Clarke, 1973). In the data
    center world, sufficiently complex problem is indistinguishable from chaos.


    Sporadic problems are highly complex issues that you are unable to explain in
    simple terms. If you know the exact conditions and mechanisms involved, you would
    be able to predict when they would happen. Since you do not, they appear be random
    and elusive.


    As far as problem solving, nothing changes. But you will need to invest time in
    figuring this out. Most often, your work will revolve around the understanding
    of the affected component or process rather than resolution. Once you have full
    knowledge of what happens, the issue and the fix will become quite similar to
    our earlier cases. Can you isolate it? Can you reproduce it?


    # PLAN HOW TO CONTROL THE CHAOS


    This sounds like a paradox. But you want to minimize the number of elements in
    the equation that you do not control. If you think about it, most of the work
    in the data center is about damage control. All of the monitoring is done pretty
    much for one reason only, to try to stop a deteriorating situation as quickly
    as possible. Human operators are involved because it is impossible to translate
    all the merits into complete, closed algorithms. IT personnel are quite good at
    selecting things to monitor and defining thresholds. They are not very good at
    making meaningful decisions on the basis of the monitoring events.


    Shattering preconceptions is difficult, and let not forget the business imperative,
    but the vast majority of effort is invested in alerting on suspected exceptions
    and making sure they are back to normal levels. Unfortunately, the alerts rarely
    vary to prevent impending damage. Can you translate CPU activity into a kernel
    crash? Can you translate memory usage into an uncommon case of performance degradation?
    Does disk usage tell anything about when the disk might fail? What is the correlation
    between the number of running processes and system responsiveness? If not all
    of these are rigorously monitored, and they rarely tell anything you go to extremes.


    Let us use an analogy from our real life — radiation. The effects of electromagnetic
    radiation on human tissue are well known once you exceed the normal background
    levels by several unhealthy levels of magnitude. But, in the gray area, there
    is virtually little to no knowledge and correlation, partly because the environmental
    impact of a million other parameters outside our control also plays a possibly
    important role.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Cause and effect 11


    Luckily, the data center world is slightly simpler. But not by much. We measure
    parameters in a hope that we will be able to make linear correlations and smart
    conclusions. Sometimes, this works, but often as not, there is little we can learn.
    Although monitoring is to be proactive, it is in fact reactive. You define your
    rules by adding new logic based on past problems, which you were unable to detect
    at that time.


    So despite all this, how do you control the chaos? Not directly. And we go back
    to the weird problems that come to be at a later date. Problems that avoid mathematical
    formulas may still be reined if you define an environment of indirect measurements.
    Methodical problem solving is your your best option.


    By rigorously following smart practices, such as using simple tools for first
    checks, trying to isolate and reproduce problems, you will be able to eliminate
    all the components that do not play a part in the manifestation of weird issues.
    You will not be searching for what is there, you will be searching for what is
    not. Just like the dark matter.


    Controlling the chaos is all about minimizing the number of unknowns. You might
    never be able to solve them all, but you have significantly limited the possibility
    space for would-be random occurrences of problems. In turn, this will allow you
    to invest the right amount of energy in defining useful, meaningful rules and
    thresholds. It is a positive-feedback loop.


    # LETING GO IS THE HARDEST THING


    Sometimes, despite your efforts, the solution to the problem will elude you. You
    will be a combination of time, effort, skills, ability to introduce changes into
    the environment and test them, and other factors. In order not to get overwhelmed
    by your problem solving, you should also be able to halt, reset your investigation,
    start over, or simply let go.


    It might not be immediately to translate the return on investment (ROI) in your
    investigation to the future stability and quality of your environment. However,
    as a rule of thumb, if an active day of work (that is, not waiting for feedback
    from vendor or the like) goes without any progress, you might well call for help,
    involve others, try something else entirely, and then go back to the problem later
    on.


    # CAUSE AND EFFECT


    One of the major things that will detract you from success in your problem solving
    will be causality between the problem and its manifestation, or in more popular
    terms, the cause and the effect. Under pressure, due to boredom, limited information,
    and your own tendencies, you might make a wrong choice from the start, and your
    entire investigation will then unravel in an unexpected and less fruitful direction.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# CHAPTER 1 Do you have a problem?


    There are several useful practices you should embrace to make your work effective
    and focused. In the end, this will help you reduce the element of chaos, and you
    will not have to give up often on your investigations.


    # DO NOT GET HUNG UP ON SYMPTOMS


    System administrators love error messages. They be GUI prompts or cryptic lines
    in log files, they are always the reason for joy. A quick copy-paste into a search
    engine, and 5 minutes later, you will be chasing a new array of problems and possible
    causes you have never considered before.


    Like any anomaly, problems can be symptomatic and asymptomatic – monitored values
    versus unknown, current problems versus future events, and direct results versus
    indirect phenomena.


    If you observe a nonstandard behavior that coincides with a manifestation of a
    problem, does not necessarily mean that there is any link between them. Yet, many
    people will automatically make the connection, because that is what we naturally
    do, and it is the easy thing.


    Let us explore an example. A system is running relatively slowly, and the custom-flows
    have been affected as a result. The monitoring escalates the issue to the engineering
    group. They have some preliminary checks, and they have concluded that the slowness
    has been caused by errors in the configuration management software running its
    hourly update on the host.


    This is a classic (and real) case of how seemingly cryptic errors can mislead.
    When you do a step-by-step investigation, you can easily disregard these kinds
    of errors as bogus or unrelated background noise.


    Did configuration management software errors happen only during the slowness event,
    or are they part of a standard behavior of the tool? The answer in this case is,
    the software runs hourly and reads its table of policies to determine what installations
    or changes need to be executed on the local host. A misconfiguration in one of
    the triggers errors that are reflected in the system messages. This occurs every
    hour, and it does not have any effect on customer flows?


    Did the problem happen on just this specific client? The answer is no, it happens
    on multiple hosts and indicates an unrelated problem with the configuration rather
    than any core operating system.


    Isolate the problem, start with simple checks, and do not let random symptoms
    cloud your judgment. Indeed, working methodically helps avoid these easy pitfalls.


    # CHICKEN AND EGG: WHAT CAME FIRST?


    Consider the following scenario. Your customer reports a problem. Its flows are
    occasionally getting stuck during the execution on a particular set of hosts,
    and there is a very high system load. You are asked to help debug.


    What you observe is that the physical memory is completely used, there is a little
    of swapping, but nothing that should warrant very high load and high CPU utilization.
    Without going into too many technical details, which we will see in the coming'
