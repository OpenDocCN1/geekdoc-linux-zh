- pgno: 211
  md: '# CHAPTER 6 Getting very geeky


    The problematic line is even marked for us with a comment: # 29 <init_module +
    0x19>.


    | 27: | c6 00 01 | movb $0x1,(rax) |


    Copyright ©Intel Corporation. All rights reserved.


    What do we have here? We are trying to load (assembly movb) value 1 ($0x1) into
    the RAX register (%rax). Now, why does it cause such a fuss? Let go back to our
    log and see the memory address of the RAX register. RAX is 0000000000000000. In
    other words, zero. We are trying to write address 0. This causes a page fault,
    resulting in kernel panic. Problem solved!


    Of course, in real life, nothing is going to be easy, but it is a start. In real
    life, you will have many difficulties, missing source files, wrong versions of
    GCC, and all kinds of problems that will make crash analysis, very difficult.
    Remember that!


    For information, please take a look at the case study shown in the RedHat Crash
    White Paper. Again, it is easier when you know what you are looking for. For any
    example you encounter will be orders of magnitude simpler than your real crashes,
    but it is really demonstrating an all-inclusive, abstract case. Still, I hope
    my two examples are enough to get you started.


    # KERNEL CRASH BUG REPORTING


    The big question is, what do crashes tell us? Using the available information,
    we can try to understand what is happening on our tested systems. First and foremost,
    we can compare different crashes and understand if there is any common element.
    Then, we can try to look for correlations between separate events, environment
    changes, and system changes, trying to isolate possible culprits to our crashes.


    With submitting crash reports to vendors and developers, the ample use of Google
    and additional resources, like mailing lists and forums, we might be able to narrow
    down our search and easily the resolution of problems.


    When your kernel crashes, you may want to take the initiative and submit the report
    to the vendor so they may examine it and fix this bug. This is a very important
    thing. You will not only helping yourself but possibly everyone using Linux. What
    is, kernel crashes are valuable. If there is a bug-where, the developers will
    find and fix it.


    # Kernelsops.org


    Kernelsops.org (Linux kernel oops, n.d.) is a website dedicated to collecting
    and listing kernel crashes across the various kernel releases and crash reasons,
    allowing kernel developers to work on identifying most critical bugs and solve
    them, as providing system administrators, engineers, and enthusiasts with a rich
    database of crucial information. The site''s interface is shown in Fig. 6.7.'
