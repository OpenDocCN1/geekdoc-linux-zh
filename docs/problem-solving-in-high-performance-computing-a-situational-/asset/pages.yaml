    process was running at the time of the crash. CPU refers to CPU cores and not
    just physical CPUs. If you are running Linux with hyperthreading enabled, you
    will also be counting separate threads as CPUs. This is important to remember
    because recurring crashes on just one specific CPU might indicate a CPU problem.


