- pgno: 263
  md: '# 254 CHAPTER 9 Make your environment safer, more robust


    quo into unknown, forcing you to exercise your problem-solving expertise. Being
    able to maintain a stable and predictable work setup is probably the greatest
    testament to your problem-solving skills, in that you may never have to execute
    them.

    Or Rarely.


    # ONE CHANGE AT A TIME


    If you have to introduce new software or configurations into your data center,
    the best way to do is by making sure all other components remain unchanged for
    some time before and especially after – you have made the change. Too often businesses
    and organizations pile things together, save time and cost, because downtime and
    maintenance are counterproductive, which in turn complicates matters when things
    go wrong. The worst part is that some problems result from interaction between
    components, and it takes a long to troubleshoot and isolate them, normally related
    issues would be simple and straightforward or nonexistent.

    Worse, even if you have a plan, and you follow the ITIL framework to the boot,
    you can still not account for random and unannounced changes that may initiate
    in the environment. If you can ensure there is only one free dimension in your
    matrix, it will be easier to monitor the deployment, track changes, identify problems,
    and – most importantly–rollback when necessary.


    Now, this may be impractical for large data centers, but in that case, you need
    to treat complex systems as individual components. If you must perform a change
    that involves 10 different networks and routers, then the entire chain becomes
    one unity. The scope and complexity of potential problems will grow, but all elements
    must be considered, ensuring you can prepare for the worst.


    The ability to withstand a huge, sudden outage following a change is a great indicator
    how well prepared your environment. In some cases, it will also reflect your backup
    and restore capabilities, as well as disaster recovery (DR). If you run a mission-critical
    high-performance compute setup, then you must plan changes with total catastrophe
    in mind to cope with any kind of problem across the spectrum.


    Furthermore, this ability is also an indicator of your operational readiness.
    You may have version control and configuration management tools deployed with
    a great deal of automation and excellent monitoring, but it will often realistically
    cover cover subset of your environment: Linux but not Windows; storage appliances
    and networking have their own vendor-locked operating systems that may not permit
    the use of third-party tools; your utilities may rely on certain pieces of the
    center to always remain in use.


    If you have all these pieces, combine them into a single functional entity, and
    then work to recover and restore services as quickly as possible upon failure,
    you will have created a robust ecosystem that can withstand changes, both planned
    and unplanned. Tools such as Git and Puppet will help you drive standardization
    when you discover operational gaps, and good monitoring tools will alert on any
    lack of standards and compliance.


