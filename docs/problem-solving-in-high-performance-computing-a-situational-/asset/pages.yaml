  md: '# Examine kernel tunables 69


    Echoing a new value can help alleviate the problem – or confirm it – although
    a permanent solution might be required to address the issue. On its own, such
    a change is not sufficient and cannot be treated as a plug-n-play fix. First,
    dynamic changes to the kernel will not be reverted on reboot (unless saved using
    sysctl). Second, there are often delicate dependencies between several tunables,
    and adjusting just one might cause more harm, or complicate things.


    In this particular case, you may not exceed the maximum number of open files than
    the limit set during the kernel compilation. Furthermore, another tunable, /proc/sys/file-nr_max,
    will also be affected by the change. This other variable shows the number of allocated
    files, free handles, and the maximum number, and the last figure will change if
    you echo a new value into the file-max field. Moreover, one should also consider
    the number of available in-memory inodes, to prevent moving the bottleneck from
    one tunable to another.


    # NETWORK MANAGEMENT


    The networking part of /proc/sys subsystem is one of the more complex pieces and
    requires deeper understanding of networking protocols to use and work effectively.
    It will invariably directly affect the performance of the host related to any
    remote operation. Although you may gain significant benefits tuning the network
    stack, you can also severely affect the system speed and throughput of services
    running on the system.


    There are a very large number of parameters available, and most of them are beyond
    the scope of this book. However, some of them are quite important and should be
    consulted if you encounter network-related issues.


    +   * Rmem_default, rmem_max – These tunables define the default and maximum size
    of the socket buffer (bytes). They are located under /proc/sys/net/

    * Wmem_default, wmem_max – As above, except related to the send socket buffer.

    * Tcp_rmem, tcp_wmem – Under the ipv4 subdirectory, increasing the values of read
    and write TCP buffers can allow for larger window sizes, especially on systems
    with high-speed network and low latency.

    * Tcp_fin_timeout – This tunable defines the time sockets will remain in the wait
    state before closing. Lowering this value can free sockets, especially on servers
    with many inbound connections.

    * Tcp_tw_reuse – According, this parameter tells the kernel to reuse sockets in
    the TIME_WAIT state, if it runs out of sockets.


    The big problem with all of these is that fine-tuning the parameters almost takes
    the form of black magic and takes much work and experience, as well as the most
    use cases to configure properly. It is also somewhat difficult to affect changes
    on production systems, and replicating the exact work conditions on isolated boxes
    in a contained laboratory environment might not always be possible.'
