  md: '# Crash analysis (crash) 187


    Please note that make has no meaning without a Makefile, which specifies what
    needs to be done. But we have a Makefile. It was created after we ran ./configure.
    Otherwise, all this would not really work. Makefile is very important. We will
    see to a less trivial example soon


    If you do not remove the object, then you will probably not be able to make it.
    Make compares timestamps on source files and the object, unless you change the
    sources, the recompile of the object will fail.


    Now, here is another simple example, and note the difference in the size of the
    created object, once with the debug symbols and without:


    ```

    #gcc memhog.c -o memhog.no.symbols


    #ls -l memhog.no.symbols


    -rwxr-xr-x 1 iljubunc syseng 10417 2013-12-15 12:17 memhog.no.symbols


    #gcc memhog.c -o memhog.symbols


    #ls -l memhog.symbols


    -rwxr-xr-x 1 iljubunc syseng 12553 2013-12-15 12:18 memhog.symbols

    ```


    Copyright ©Intel Corporation. All rights reserved.


    If you do not have a Makefile, you can invoke gcc manually using all sorts of
    flags. You will need kernel headers that match the architecture and the kernel
    that was used to create the kernel where the crash occurred; otherwise, your freshly
    compiled objects will be completely different from the ones you may wish to analyze,
    including functions and offsets.


    # objdump


    A utility to use for disassembly is objdump (objdump -l – Linux man page, n.d.).
    You will probably want to use the utility with the -S flag, which displays source
    code indexed with assembly instructions. You may also want the -s flag, which
    will display contents of all sections, including empty ones. The -S -d, which
    displays the assembler mnemonics for the machine instructions from objfile; this
    option only disassembles sections that are expected to contain instructions. Alternatively,
    use -D for all sections. Thus, the most inclusive objdump would


    ```

    objdump -D -S <compiled object with debug symbols> > <output file>

    ```


    Copyright ©Intel Corporation. All rights reserved.'
