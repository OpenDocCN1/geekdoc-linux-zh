- pgno: 113
  md: '# CHAPTER 5 Getting geeky – tracing and debugging applications


    Perf can also be used for repeated measurements to estimate the variation of a
    process execution. This can be useful if you expect your software to behave in
    a very predictable manner, and when you need to understand the level of system
    noise or other environmental impacts that may alter the execution results. In
    turn, this kind of measurement is possible by using the -r switch, similar to
    the iostat and vmstat flags, as we have seen earlier.


    Similarly, the granularity of event measurement can be restricted to individual
    threads, processes and processors (cores), or it can be applied to the whole system.
    Perf also supports attaching to running processes, which can be useful if you
    suspect a program is misbehaving, and you wish to examine its execution in real
    time.


    # Sampling


    Sampling differs from event counting in that it records a sample when the relevant
    sampling counter overflows. Data are collected using the corand command, and the
    generated output is analyzed using the report and annotate commands. As we have
    mentioned earlier, this mode of work is very similar to that of OProfile.


    The default sampling event used with the perf record command is the cycles event.
    Depending on the processor architecture, the cycles event will map to a hardware-specific
    event, such as for instance, UNHALTED_CORE_CYCLES on Intel architecture, or CPU_CLK_UNHALTED
    on AMD processors. Cycle counting will not report when the processor is idle.
    Let us explore an example:


    What did we execute? A typical memory hog process, which is `memhog` took 10 GG
    of memory, and then released it. The sampling data is saved in a file named perf.data
    in the home directory of the perf record command.


    ```

    #perf record /tmp/memhog 1024M

    hogging 1024 MB: 20 40 60 80 100 120 140 160 180 200 220 240 260 280 300 320 340
    360

    380 400 420 440 460 480 500 520 540 560 580 600 620 640 660 680 700 720 740 760
    780

    800 820 840 860 880 900 920 940 960 980 1000 1020 1024

    { perf record: Woken up wrote 0.14 MB perf.data (-5000 samples) }

    ```


    Copyright ©Intel Corporation. All rights reserved.


    An interesting metric is that the perf tool collected 5000 samples. The default
    sampling rate is 1000 Hz, for about 5 seconds. This can be used to estimate the
    expected event rate for running processes in the respective environments, especially
    when comparing good (healthy) and bad systems.


    If you time the execution of the memhog 1 GB allocation, you should see a total
    time that is roughly similar to the number of collected samples divided by the
    collection frequency.'
