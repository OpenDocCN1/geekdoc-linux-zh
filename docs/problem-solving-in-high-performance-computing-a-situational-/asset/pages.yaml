  md: "# Crash analysis (crash) 191\n\n# Create problematic kernel module\n\nThis\
    \ exercise forces us to deviate from the crash analysis flow and take a brief\
    \ look at the C programming language from the kernel perspective. We want to crash\
    \ our kernel, so we need kernel code. While we are going to use C, it is a little\
    \ different from everyday stuff. The kernel has its own rules.\n\nWe will have\
    \ a sampling of kernel module programming. We will write our own module and Makefile,\
    \ compile the module, and insert it into the kernel. Since our module is going\
    \ to be written badly, it will crash the kernel. Then, we will analyze the crash\
    \ report. Using the information obtained in the report, we will try to figure\
    \ out what is wrong with our source codes.\n\n# Step 1: kernel module\n\nWe first\
    \ need to write some C code. Let us begin with a very simple and benign hello.c.\
    \ Without getting too technical, here is the most basic of modules, with the init\
    \ and cleanup functions. The module does nothing special except prints messages\
    \ to the kernel logging facility.\n\n```\n/*\n* hello.c - The simplest kernel\
    \ module.\n*/\n\n#include <linux/module.h>    /* Needed by all modules */\n#include\
    \ <linux/kernel.h>    /* Needed for KERN_INFO */\n\nint init_module(void)\n{\n\
    \    printk(KERN_INFO \"Hello world.\\n\");\n\n    /*\n    * A non 0 return means\
    \ init_module failed; module can't be loaded.\n    */\n    return 0;\n}\n\nvoid\
    \ cleanup_module(void)\n{\n    printk(KERN_INFO \"Goodbye world.\\n\");\n}\n```\n\
    \nCopyright ©Intel Corporation. All rights reserved."
