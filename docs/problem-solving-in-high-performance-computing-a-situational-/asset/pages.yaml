- pgno: 171
  md: 'Analyzing the cores will provide you with valuable information that should
    hope-fully help you find and resolve the root causes leading to system crashes.


    # SUMMARY


    Kdump is a powerful, flexible kernel crash dumping utility. The ability to execute
    a crash kernel in the context of the running production kernel is a very useful
    mechanism. Similarly, the ability to use the crash kernel in virtually all runs,
    including networking, and the ability to send cores to network storage using a
    variety of protocols, significantly extends our ability to control the environment.


    Specifically, in comparison to the older LKCD utility, it offers functionality
    on all levels, including a more robust mechanism and better scalability. Kdump
    can use local RAID (md) devices, if needed. Furthermore, it has improved network
    awareness and can work with a number of protocols, including NFS, CIFS, FTP, and
    SSH. The memory cores are no longer limited by the 32-bit barrier.


    # CRASH ANALYSIS (CRASH)


    Kernel crash analysis is the next step in our investigation. After we have collected
    the memory cores, we now need to process them. The standard utility for this task
    is crash (Anderson, 2008) based on the SVR4 UNIX crash crash command and enhanced
    by merging it with the gdb tool. We will now expand on its use, and see how it
    can aid us in our troubleshooting.


    # PREREQUISITES


    You must have Kdump setup properly and working.


    # Crash setup


    Crash can be found in the repositories of all major distributions, including enterprise
    flavors.


    # Memory cores


    Memory cores are called vmcore and you will find them in dated directories inside
    the crash directory. On older versions of Kdump, the directories would only contain
    the vmcore file. Newer versions also copy the kernel and System map file into
    the directory, making the core processing easier.


    # Invoke crash


    The crash utility can be invoked in several ways. First, there is some difference
    between older and newer versions of Kdump in terms of what they can do and how
    they process the memory cores. Second, the crash utility can be run manually or
    unattended.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Crash analysis (crash) 163


    Old (classic) invocation

    The old invocation is done in the following manner:


    ```

    crash <System map> <vmlinux> vmcore

    ```


    Copyright ©Intel Corporation. All rights reserved.


    <System map> is the absolute path to the System map file, which is normally located
    under /boot. This file must match the version of the kernel used at the crash.

    The System map file is a symbol table used by the kernel. A symbol table is a
    look-up between symbol names and their addresses in memory. A symbol name may
    be the name of a variable or the name of a function. The System.map is required
    when the address of a symbol is needed. It is especially useful for debugging
    kernel panics and kernel oops, which is what we need here.


    +   - <vmlinux> is the uncompressed version of the kernel that was running when
    the memory core was collected on the host.

    - vmcore and vmlinux files remain in the /boot directory and are not copied into
    the crash directory.


    The System-map and vmlinux files remain in the /boot directory. However, they
    can be manually copied to other machines, allowing portable use of crash against
    memory cores collected on other systems and/or kernels.


    New invocation

    The newer versions of Kdump can work with compressed kernel images. Furthermore,
    they copy the System map file and the kernel image into the crash directory, making
    the use of crash utility somewhat simpler. Finally, there are two ways to process
    the cores. Depending on your choice of distribution, the use syntax might be somewhat
    different:


    ```

    crash /usr/lib/debug/boot/<kernel>.debug vmcore

    crash /usr/lib/debug/lib/modules/<kernel>/vmlinux vmcore

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Portable use

    To process cores on other machines, you can either copy System map and the kernel
    or just the debug information file. Newer versions of Kdump and crash will work
    with compressed kernel images. The debug info must match the kernel version exactly,
    otherwise you will get a CRC match error, for instance'
  merge: -1
  img_proc: true
