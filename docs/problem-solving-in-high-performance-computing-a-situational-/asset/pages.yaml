    How do we translate this reality into a practical problem-solving strategy? It
    is all too to let just be as they are and do your fair share of firefighting.
    It is quick, it is familiar, it is highly visible, and it can be appreciated by
    the management.


    The answer is, you should let the numbers be your voice. If you work methodically
