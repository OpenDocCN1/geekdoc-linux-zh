    To keep an infinite number of old dumps, set the number to 0. To delete all existing
    before writing a new one, set the number to -2. Please note the somewhat

    strange values that are counterintuitive. Table 6.3 shows the special values;

    default value is to retain five memory cores.


    ```

    KDUMP_KEEP_OLD_DUMPS = 5

    ```


