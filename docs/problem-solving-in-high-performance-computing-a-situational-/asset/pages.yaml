- pgno: 52
  md: 'The first two columns in the output report the number of processes in the running
    uninterruptible sleep (blocked) states, respectively. This information is very
    useful in trying to understand if there is a bottleneck on the system. Ideally,
    there will be few blocked processes. A high number may indicate network or storage
    latency, but it should be correlated to other metrics and tools.


    Memory output includes the amount of virtual memory, idle memory, buffers, and
    cache. Using the -a switch will also display the amount of active and inactive
    memory. The two swaps show the amount of bytes being swapped in and out the disk,
    per second. These values are useful when troubleshooting memory usage problems
    as well as responsiveness of systems with interactive usage.


    I/O activity reports blocks sent and received to all block devices attached to
    the system. It shows the total amount and does not differentiate between different
    devices, if you want addional granularity, you will need to use the -d switch.


    System activity includes the number of interrupts (in) and context switches (cs)
    per second. These two values can be highly useful when troubleshooting performance
    and responsiveness, but they do require a decent understanding of the nature and
    behavior of running tasks.


    CPU columns report information that is very similar to the metrics we saw when
    running the top. By now, you would start piecing together different vectors of
    information. For example, a high number of blocked processes correlate to an increase
    in the %wa values. Likewise, a high number of interrupts often indicates a drop
    in user CPU and increase in %sy and %wa figures. This can be helpful when trying
    to debug system problems.


    ```

    vmstat 1 10

    procs --memory-- --swap--io--system--cpu-

    r b swpd free buff cache so bo in cs us id yi wa st

    9 25973660 14470566 97816 66545680 12 28 173 0 0 56 2 37 5 0

    10 25973660 144776532 97816 66546536 0 0 0 16 4507 4157 24 1 73 3 0

