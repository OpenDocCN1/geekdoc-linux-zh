    # Design of experiment


    Design of experiment, sometimes also called design of experiments (DoE), is a
    branch of applied statistics that deals with planning, conducting, analyzing,
    and interpreting tests to evaluate the factors that control the value of a parameter
    or group of parameters.


    It differs from the classical X→Y approach in that it allows efficient analysis
    of an experimental set when changing several factor levels simultaneously. In
    a standard experiment, the level of one factor is changed whereas others are constant,
    and the response is measured (Design of Experiments (DOE), n.d.). This approach,
    also known as one-factor-at-a-time (OFAT), can be very time consuming, as it may
    involve a huge number of changes, and does not offer valuable information when
    there is interaction between factors.


    Without going deep into statistics, which is beyond the scope of this book, the
    simplest, most comprehensive way of conducting DoE is the full factorial design,
    which studies the response of every combination of factors and their levels. Blocking
    and randomization may also be introduced to narrow down the scope of complex experiments.


    If you wish to conduct a full factorial experiment, you need to be familiar with
    the following:


    +   Factors (inputs): They can be classified as controllable or uncontrollable
    variables. In the high-performance compute environment, controllable variables
    are normally quantifiable elements, such as network bandwidth, number of processes,
    memory usage, and others. Factors that also depend on environmental settings,
    as latency, overall router utilization, the response of a remote file server,
    and similar factors, are not within the control of a system administrator trying
    to run the experiment and analyze the problem.


    +   Levels: Setings of each factor in the study. Normally, the simplest experiment
    includes two levels, low and high. For example, you may want to test the


