- pgno: 84
  md: '# Getting geeky – tracing and debugging applications


    # WORKING WITH STRACE AND LTRACE


    Sometimes, the process of investigating problems by reading logs and examining
    the overall behavior of the system will not yield fruitful results. The root cause
    of the issue affecting your customer base or your applications will remain a mystery.
    At this stage, you will need to dig deeper, and this means analyzing what affected
    processes.


    # STRACE


    strace(trace(1) – Linux man page, n.d.) is a utility that can trace system calls
    and signals. If you are wondering what system calls are, they are a translation
    mechanism that provides interface between a process and the operating system (kernel)
    (The GNU C Library, n.d.). These calls can be intercepted and read, allowing for
    a better understanding of what a process is trying to do at a runtime.


    By hooking these calls, we can get a better understanding of how a process behaves,
    especially if it is misbehaving. The operating system functionality that allows
    tracing is called ptrace(2) – Linux man page, n.d.). Trace calls on process reads
    the behavior, reporting back.


    In the simplest case, strace runs the specified command until it exits. It intercepts
    and records the system calls that are called by a process and the signals that
    are received by a process. The name of each system call, its arguments, and its
    return value are printed on a standard error or to a log file.


    Each line in the trace contains the system name, followed by its arguments in
    parentheses and its return value. Let us examine a test case, in which we will
    run and trace the dd command, namely dd <input file> <output file> <options>.
    When executed with strace, the command will look like:


    ```

    strace /bin/dd if=/dev/zero of=/tmp/file bs=1024K count=5

    ```'
