  md: 'Lcrash utility (part of the LKCD framework), which specifically requires the
    -w flag to write to files.


    # Crash running in unattended mode


    Now that know how to run crash commands and produce analysis files, which by not
    do that entirely unattended? This can be done by specifying command line input
    from a file.


    Commands can be sent to crash in two ways:


    ```

    crash -i inputfile

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Or using redirection


    ```

    crash < inputfile

    ```


    Copyright ©Intel Corporation. All rights reserved.


    In both cases, the crash infile is a text file with crash commands one per line.
    For the crash utility to exit, you will also need to include the exit command
    at the end. Something like


    ```

    bt

    log

    ps

    exit

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Thus, the complete, unattended analysis takes the form of


    ```

    crash <debuginfo> vmcore < infile > outputfile

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Or perhaps


    ```

    crash <System map> <mlinux> vmcore < infile > outputfile

    ```


    Copyright ©Intel Corporation. All rights reserved.'
