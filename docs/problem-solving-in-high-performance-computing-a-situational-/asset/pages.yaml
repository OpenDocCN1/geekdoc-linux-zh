    step is to glean useful information inside the memory dump and try to understand
    what caused the kernel oops or panic in the first place. To end, we will learn
    how to use several gdb-like crash commands. At a first glance, the collected output
    may seem like a new language, but we will soon learn how to interpret the alien
    syntax and understand the underlying issue affecting our system.


