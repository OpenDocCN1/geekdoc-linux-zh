    # KDUMP NETWORK DUMP FUNCTIONALITY


    Being able to send kernel crash dumps to network storage makes Kdump attractive
    for deployment in large environments. It also allows system administrators to
    evade local disk space limitations. Compared to LCDKD, Kdump is much network-aware;
    it is not restricted to dumping on the same subnet, and there is no need for a
    dedicated server. You can use NFS areas or CIFS shares as the archiving destination.
    Best of all, the changes only affect the client side. There is no server-side
    configuration.


