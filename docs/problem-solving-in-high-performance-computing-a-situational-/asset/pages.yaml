    # ## COLLECTING APPLICATION CORES


    If you have the privilege of debugging system issues in real time, you will most
    likely

    be able to run the suspected processes and perform all the necessary analyses.

    However, most of the time, problems will manifest themselves far away from the

    keyboard, and you will have to rely on automated, unattended mechanisms to collect

    all the forensics information to troubleshoot the application hangs and

    crashes. To that end, you will want to collect the memory cores of running

    processes for offline investigation.


    In this section, we will talk about additional features. Namely, we will learn

    the critical steps for collecting application cores and analyzing them. We will
    also

    how to attach the debugger to running processes, as well as other useful com-

    mands. Finally, we will explore another example, which illustrates a situation
    in

    gdb is not really useful the assembly dump till we all need, even if

    we have no source code available.


    When a running application encounters an exception, it will stop running. De-

    pending on the nature of the exception, the default action of signals is to cause

    a process to produce `core(5) – Linux page, n.d.)` file containing an image of
    the process’s memory at the time of termination.

    This image can be used in a debugger to inspect the state of the program at the
    time

    t it terminated. A list of the signals that can cause a process dump to be found

    in the signal(7) man page.


    +   - The process does not have permission to write the core file. By default
    the core

    file is called core, and is created in the current working directory. Writing
    the

    core file will fail if the directory in which it is to be created is nonwritable,
    or if

    a file with the same name exists and is not writable or it is not a regular file
    (i.e., it

    is a directory or a symbolic link).


    +   - A (writable, regular) file with the same name as would be used for the core

    dump already exists, but there is more than one hard link to that file.


    137'
