    of data, for any given problem or case, really matters? Sometimes, it is quite
    easy, and you can make rather trivial guesses and correlations based on typical
    events and data thresholds. In many cases, you can use well-established monitoring
    rules to try prevent service outages or disruptions to your customers, even without
    fully understanding all the mechanics taking place in the background. But most
    often, as we have seen in Chapter 7, monitoring will be more about trial and error,
    and less about precise mathematics. However, if we can somehow understand the
    cause and effect for occurrences and patterns in our environment, we can then
    control it, and monitoring becomes more of a way of alerting us of changes in
    a system that tells us is wrong.


    # TOO MUCH DATA IS WORSE THAN NO DATA


    We have seen that the inability to process data in a reasonable time and volume
    often leads system administrators and engineers to compensate with guesses, incomplete
    solutions, rule-of-thumb estimates, and other compromises that make monitoring
    tools into a part of the problem rather than a neutral observer.


    This happens as businesses grow and accumulate more information from their internal
    systems. With the natural, and legally required, tendency to hoard data, data
    center environments quickly become overwhelmed with so much useful stuff that
    no one can make any sense out of it. The end result is data becomes neglected,
    thresholds are raised, and are ignored. In the end, the monitoring becomes rather
    useless.'
