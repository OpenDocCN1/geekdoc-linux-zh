  md: '# Collecting kernel cores (Kdump) 161


    # Simulate kernel crash


    To manually crash the kernel, you will have to enable the System Request (SysRq)
    functionality (also known as magic keys), if it has not already been enabled on
    your system(s), and then trigger a kernel panic. Therefore, first, enable the
    SysRq:


    ```

    echo 1 > /proc/sys/kernel/sysrq

    ```


    Then, crash the kernel


    ```

    echo c > /proc/sys/sysrq-trigger

    ```


    Now watch the console. The kernel crash should boot up. After a while, you should
    see Kdump in action. Take a look at the console. After a while, a small counter
    should appear, showing the progress of the dump procedure. This means you have
    most likely properly configured Kdump and it is working as expected. Wait until
    the dump completes. The system should reboot into the production kernel when the
    dump is complete. Indeed, checking the destination directory, you should see the
    vmcore file. The process of a memory core dump is shown in Figs. 6.1 and 6.2.


    This concludes the long and thorough configuration and testing of Kdump. If you
    have successfully managed all the stages so far, then your system is ready to
    be placed into production and collect memory cores when kernel panic occurs.


