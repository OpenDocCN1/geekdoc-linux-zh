    # ONE VARIANT AT A TIME


    If you have to troubleshoot a system


    # PROBLEMS WITH LINEAR COMPLEXITY


    Linear problems are fun. You change your input by a certain fraction, and the
    response changes proportionally. Linear problems are relatively easy to spot and
    troubleshoot. Unfortunately, they will be a minority of cases you encounter in
    the environment.


    However, if you see issues where the response is linearly related to the inputs,
    you should invest time in carefully studying and documenting them, as well as
    trying to create a mathematical formula that maps the problem and the solutions.
    It will help you in the long run, and maybe allow you to establish a baseline
    that can serve, indirectly, to look for other, more complex problems.


    # NONLINEAR PROBLEMS


    Most of the time, you will struggle finding any correlation between a change in
    a system state and the expected outcome. For instance, how latency affect the
    performance of an application? What is the correlation between CPU utilization
    and runtime? What is the correlation between memory usage and system failures?
    How does disk space usage affect the server response times?'
