    then examine the four bits, from right to left. For clarifies, please consult
    this information in a transposed table (Table 6.6).


    In our case, decimal 2 is binary 10. Looking from right to left, 1 is zero, bit
    2 is lit, bit 3 and 4 are zero. Notice the binary count, starting from zero. In
    our words


