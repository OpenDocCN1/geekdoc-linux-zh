- pgno: 6
  md: '# # Introduction: data center and high-end computing


    # DATA CENTER AT A GLANCE


    If you are looking for a pitch, a one-liner for how to define data centers, then
    you as well call them the modern power plants. They are the equivalent of the
    old, sooty coal factories used to give the young, entrepreneurial industrialist
    of the mid 1800s the advantage needed over the local tradesmen in villages. The
    plants and their laborers were the unsung heroes of their age, doing their hard
    labor in the background, unseen, unheard, and yet the backbone of the revolution
    that swept the world in the nineteenth century.


    Fast-forward 150 years, and a similar revolution is happening. The world is transforming
    from an analog to a digital, with all the associated difficulties, buzz, and real
    technical challenges. In the middle of it, there is the data center, the powerhouse
    of the Internet, the heart of the search, the *big* in the big data.


    # MODERN DATA CENTER LAYOUT


    Realistically, if we were to go into specifics of the data center design and all
    the underlying pieces, we would need half a dozen to write it all down. Furthermore,
    since this is only an introduction, an appetizer, we will only briefly touch this
    network. In essence, it comes down to three major components: network, compute,
    and storage. There are miles and miles of wires, thousands of hard disks, angry
    CPUs running at full speed, serving the requests of billions every second. On
    their own, these three pillars do not make a data center. There is more.


    If you want an analogy, think of an aircraft carrier. The first thing that comes
    to mind is Tom Cruise taking off in the F-14, with Kenny Rogers’ *Danger Zone*
    playing in the background. It is almost too easy to ignore the fact that there
    are thousands of aviation crew members, technicians, electricians, and other specialists
    supporting the operation. It is almost too easy to forget the floor upon floor
    of infrastructure and workshops, in the very heart of it, IT center, carefully
    orchestrating the entire piece.


    Data centers are somewhat similar to the 100,000-ton mammals patrolling the oceans.
    With their components, they all need to communicate and work together. This is
    why when you talk about data centers, concepts such as cooling and power density
    are just as critical as the type of processor and disk one might use. Remote management,
    facility security, disaster recovery, backup – all of these are hardly on the
    list, but the higher you scale, the more important they become.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Introduction: data center and high-end computing


    # WELCOME TO THE BORG, RESISTANCE IS FUTILE


    In the last several years, we see a trend moving from any old setup that includes
    computing components into something approaching standards. Like any technology,
    the data center has reached a point at which it can no longer sustain itself its
    own, and the world cannot tolerate a hundred different versions of it. Similar
    to the convergence of other technologies, such as network protocols, browser standards,
    and to some extent, media standards, the data center as a whole is also becoming
    a standard. For instance, the Open Data Center Alliance (ODCA) (Open Data Center
    Alliance, n.d.) is a consortium established in 2010, driving adoption of interoperable
    solutions and standards – across the industry.


    In this reality, hanging on your custom workshop is like swimming against the
    current. Sooner or later, either you or the river will give up. Having a data
    center is no longer enough. And this is part of the reason for this book – solving
    problems and creating solutions in a large, unique high-performance setup that
    is the inevitable future of data center


    # POWERS THAT BE


    Before we dig into any tactical problem, we need to discuss strategy. Working
    with a single computer at home is nothing like doing the same kind of work in
    a data center. While the technology is pretty much identical, all the considerations
    you have used before – and your instincts – are completely wrong.


    High-performance computing starts and ends with scale, the ability to grow a steady
    rate in a sustainable manner without increasing your costs exponentially. This
    has always been a challenging task, and quite often, companies have to sacrifice
    growth until their business explodes beyond control. It is often the small, neglected
    things that force the slowdown – power, physical space, the considerations that
    are not immediate or visible.


    # ENTERPRISE VERSUS LINUX


    Another challenge that we are facing is the transition from the traditional world
    of the classic enterprise into the quick, rapid-paced, ever-changing cloud. Again,
    it is not about technology. It is about people who have been in the IT business
    for many years, and they are experiencing this sudden change right before their
    eyes.


    # THE CLASSIC OFFICE


    Enabling the office to use their software, communicate with colleagues and partners,
    send email, and chat has been critical piece of the Internet since its earlier
    days. But, the office is a stagnant, almost boring environment. The needs for
    change and growth are modest.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# LINUX COMPUTING ENVIRONMENT


    The next evolutionary step in the data center business was the creation of the
    Linux operating system. In one swoop, it delivered a whole range of possibilities
    that were not available beforehand. It offered affordable cost compared to expensive
    mainframe setups. It offered reduced licensing costs, and the largely open-source
    nature of the product allowed people from the wide community to participate and
    modify the software. Most importantly, it also scaled, from minimal setups to
    immense supercomputers, accommodating both ends of the spectrum with nonchalant
    ease.


    And while there was chaos in the world of Linux distributions, offering a variety
    of flavors and types that could never catch on, the kernel remained largely standard,
    and allowed businesses to rely on it for their growth. Alongside opportunity,
    there was a great shift in the perception in the industry, and the speed of change,
    testing the industry''s experts to their limit.


    # LINUX CLOUD


    Nowadays, we are seeing the third iteration in the evolution of the data center.
    It is shifting from being the enabler for products into a product itself. The
    pervasiveness of data, embedded in the connected called Internet of Things, as
    well as the fact that a large portion of modern (and online) economy is driven
    by data search, has transformed the data center into an integral piece of business
    logic.


    The cloud is used to describe this transformation, but it is more than having
    free compute resources available in the world and accessible through a Web portal.
    Infrastructure has become a service (IaaS), platforms have become a service (PaaS),
    and applications running on top of a very, complex cloud stack are virtually indistinguishable
    from the underlying blocks.

    In the heart of this new world, Linux is and with it, a new generation of challenges
    and problems of a different scale and problem that system administrators never
    had to deal with in the past. Some of the issues may be similar, but the factor
    has changed dramatically. If you could afford to run your local system investigation
    at your own place, you can no longer afford to do so with cloud systems. Concepts
    such as uptime, availability, and price dictate a regime of thinking and require
    different tools. To make worse, speed and technical capabilities of the hardware
    are pushed to the limit, as big data mercilessly drive the high-performance compute
    market. Your old skills as a troubleshooter are being put to a test.


    # 10,000 × 1 DOES NOT EQUAL 10,000


    The main reason why a situational-awareness approach to problem solving is so
    important is that linear growth brings exponential complexity. Tools that work
    on individual hosts are not built for mass deployments or do not have the capability
    for'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'cross-system use. Methodologies that are perfectly suited for slow-paced, local
    setups are utterly outclassed in the high-performance race of the modern world.


    # NONLINEAR SCALING OF ISSUES


    On one hand, larger environments become more complex because they simply have
    a much greater number of components in them. For instance, a typical hard disk.
    An average device may have a mean time between failure (MTBF) of 900 years. That
    sounds like a pretty bet, and you are more likely to decommission a disk after
    several years of use than it malfunction. But if you have a thousand disks, and
    they are all part of a larger ecosystem, the MTBF shrinks down to about 1 year,
    and suddenly, problems you never had to deal with explicitly become items on the
    daily agenda.


    On the other hand, large environments also require additional considerations when
    it comes to power, cooling, physical layout and design of data center aisles and
    rack, the network interconnectivity, and the number of edge devices. Suddenly,
    there are new dependencies that never existed on a smaller scale, and those are
    magnified or made significant when looking at the system as a whole. The considerations
    you may have for problem solving change.


    # THE LAW OF LARGE NUMBERS


    It is almost too easy to overlook how much effect small, seemingly imperceptible
    changes in great quantity can have on the larger system. If you were to optimize
    the kernel on a single Linux host, knowing you would get only about 2–3% benefit
    in overall performance, you would hardly bother with hours of reading and testing.
    But if you have 10,000 servers that all churn cycles that much faster, the business
    imperative suddenly changes. Likewise, when problems hit, they come to bear in
    scale.


    Cost is one of the chief considerations in the design of the data center. One
    of the easy ways to try to keep the operational burden under control is by driving
    standards and trying to minimize the overall deployment cross-section. IT departments
    will seek to use as few operating systems, server types, and software versions
    as possible because it maintains the inventory, monitor and implement changes,
    and troubleshoot when they arise.


    But then, on the same time, problems arise in highly consistent environments,
    they affect the entire installation. Like an epidemic, it becomes necessary to
    react very fast and contain problems before they can explode control, if one system
    is affected and goes down, they all could theoretically go down. In turn, this
    dictates how you fix issues. You no longer have the time and luxury to tweak and
    test as you fancy. A very strict, methodical approach is required.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Business imperative xxi


    Your resources are limited, the potential for impact is huge, the business objectives
    are not on your side, and you need to architect robust, modular, effective, scalable
    solutions.


    # BUSINESS IMPERATIVE


    Above all technical challenges, there is one bigger element – the business imperative,
    and it encompasses the entire data center. The mission defines how the data center
    will look, how much it will cost, and how it may grow, if the mission is successful.
    These ties in tightly into how you architect your ideas, how you identify problems,
    and how you resolve them.


    # OPEN 24/7


    Most data centers never stop their operation. It is a rare moment to hear complete
    silence inside data halls, and they will usually remain powered on until the building
    and all its equipment are decommissioned, many years later. You need to be in
    mind when you start fixing problems because you cannot afford downtime. Alternatively,
    your fixes and future solutions must be smart enough to allow the business to
    continue operating, even if you incur some invisible downtime in the background.


    # MISSION CRITICAL


    The modern world has become so dependent on the Internet, on its search engines,
    and on its data warehouses that they can no longer be separated from the everyday
    life. When servers crash, traffic lights and rail signals stop responding, hospital
    equipment or medical records are not available to the doctors at a crucial moment,
    and you may not be able to communicate with your colleagues or family. Problem
    solving bits and bytes in the operating systems, but affects everything.


    # DOWNTIME EQUES MONEY


    It comes as no surprise that data center downtimes translate directly into heavy
    financial losses for everyone involved. Can you imagine what would happen if the
    stock market halted for a few hours because of technical glitches in the software?
    Or if the Panama Canal had to halt its operation? The burden of the task has just
    become bigger and heavier.


    # AN AVACHE STARTS WITH A SINGLE FLAKE


    The worst part is, it does not take much to transform a seemingly innocent system
    alert into a major outage. Human error or neglect, misinterpreted information,
    insufficient data, bad correlation between elements of the larger system, a lack
    of situational awareness, and a dozen other trivial reasons can all escalate into'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'complex scenarios, with negative impact on your customers. Later on, after
    sleepless nights and long post-mortem meetings, things start to become clear and
    obvious in retrospect. But, it is always the combination of small, seemingly unrelated
    factors that lead to major problems.


    This is problem solving is not just about using this or that, typing fast on the
    keyboard, being the best Linux person in the team, writing scripts, or even proactively
    monitoring your systems. It is all of those, and much more. Hopefully, this book
    will shed some light on what it takes to run successful, well-controlled, well-oiled
    high-performance, mission-critical data center environments.


    # Reference


    Open Data Center Alliance, n.d. Available at: http://www.opendatacentalleriance.org/
    (accessed May 2015)'
