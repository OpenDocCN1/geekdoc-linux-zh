- pgno: 92
  md: '# Working with solace and Itrace 83


    # Strace from the standpoint of a system administrator


    Using prace requires some basic hacking instinct. It is not for everyone. Most
    home users will probably never need or want to use trace, but they just might.
    Likewise, most system administrators level I or II maintenance or helpdesk will
    probably not be tempted to practice at to use trace.


    However, if you have a curious nature or like to understand better what your system
    is, or perhaps your job requires that you dabble with the internals, then strace
    is a good place to start and spend some time. Now, and how to use trace – and
    most importantly – what kind of information to pay attention to, this takes a
    form of black art, but with some discipline and an inkling to code, you will be
    able to master trace and use it successfully.


    # Strace has friends


    Strace is not the only utility that can trace system calls. There is other utility
    called Itrace (ltrace - Linux man page, n.d.), which can trace system calls and
    library calls. Then, there is also the famous GNU debugger (gdb) (GDB: The GNU
    Debugger, n.d.), which is a fully featured code debugger. We will talk about these
    soon.


    Furthermore, it is important to remember that although strace is less powerful
    than its aforementioned friends, it is much easier and safer to use. Itrace is
    more prone to crashing trace processes. Gdb is much more complex, requires a deeper
    knowledge of code, and works best if you have the source code available, which
    may not always the case.


    # Basic usage


    We will begin with the basics and then we will show you two test cases that simulate
    real problems with program execution that cannot be solved by the programs or
    looking for visual clues for the errors, which are easily deciphered when strace
    is brought into play.


    Strace is invoked at the command line, which can be a binary or a script, or it
    can be attached to any running process. Output can be shown on the screen, but
    this is usually of limited value unless the runs are really short and simple,
    or redirected to a file, which is the preferred way of doing things.


    Special flags can be used. For example, you may measure system call timing, both
    the timing within individual calls and the timing between system calls. Child
    processes forged also be traced, and environment variables can also be shown.
    There is the string length for the output, and you have the ability to filter
    only specific system calls and create a useful summary for the entire run. Here
    is the most basic form:


    ```

    strace <command-line>

    ```'
  merge: -1
  img_proc: true
