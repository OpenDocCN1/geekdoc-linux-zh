  md: '# Table 6.2 Kdump Files


    | Path | Information |

    | --- | --- |

    | /etc/init.d/kdump | Kdump service |

    | /etc/sysconfig/kdump | Kdump configuration file |

    | /usr/share/doc/packages/kdump | Kdump documentation |


    The Kdump installation also includes the gdb Kdump wrapper script (gdump), which
    is used to simplify the use of gdb on Kdump images. The use of gdb, as well as
    other crash analysis utilities, requires the presence of the kernel-debuginfo
    package.


    # KDUMP CONFIGURATION


    In the last section, we went through the kernel configuration parameters that
    need to be set for Kexec to work properly. Now, assuming you have a functioning
    kernel that boots to the login screen and has been compiled with the relevant
    parameters by a vendor or yourself, we will see what extra steps we need to take
    to make Kdump actually work and collect crash dumps.


    We will configure Kdump twice: once for local dump and once for network dump,
    similarly to what we did with LKCD. This is a very important step because LKCD
    is limited to network dumping only within the specific subset of the crash machine.
    Kdump offers a much greater, more flexible network functionality, including FTP,
    SSH, NFS, and CIFS support.


    # Configuration file


    The configuration file for Kdump is /etc/sysconfig/kdump. We will start with the
    basic, local dump functionality. Later, we will also demonstrate a crash dump
    over network. You should save a backup before making any changes!


    ```

    KDUMP_KERNELELVER

    ```


    > Copyright ©Intel Corporation. All rights reserved.


    This setting refers to the CONFIG_LOCALVERSION kernel parameter that we reviewed
    earlier. We specified the suffix -kdump, which tells our system to use kernels
    with -kdump suffix as crash kernels. As the short description paragraph, if no
    value is used, the most recently installed Kdump kernel will be used. By default,
    crash kernels are identified by the -kdump suffix.


    In general, this setting is meaningful only if nonstandard suffixes are used for
    Kdump kernels. Most users will not need to touch this setting and can leave it
    at the default value, unless they have very specific needs that require certain
    kernel versions.'
