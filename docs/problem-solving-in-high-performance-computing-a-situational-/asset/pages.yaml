    +   - The file system in which the core dump file would be created is full, the
    file system has run out of inodes, the file system is mounted read-only, or the
    user has reached its quota for the file system.

    - The directory in which the core dump file is to created does not exist.

    - The RLIMIT_CORE (core size) or RLIMIT_SIZE (file size) resource limits for the
    process are set to zero; we will discuss how to overcome this limitation using
    shell commands shortly.

    - The binary executed by the process does have read permission enabled.

    - The process is executing a set-user-ID (set-group-ID) program that is owned
    by a user (group) other than the real user (group) ID of the process.


    Now, we will learn how to set up our Linux environment to enable the collection
    of memory cores of crashing applications.


    # HOW TO DUMP APPLICATION CORES


    You will have to make sure that you can create cores. This is governed by sysctcl,
    but you can also make changes on the fly. Depending on your shell, you will either
    use the limit or utilize built-ins (Shell Builtin Commands, n.d.). For instance,
    for BASH


    ```

    ulimit -c unlimited

    ```


    Copyright ©Intel Corporation. All rights reserved.


    And for TCSH


    ```

    limit coredumpsize unlimited

    ```


    Copyright ©Intel Corporation. All rights reserved.


    Dump pattern

    By default, the core will be dumped in the current directory in which the binary
    was executed. But, the core name might not be useful or meaningful. So you can
    change its format, which is governed by the core_pattern setting under /proc/core_pattern


    ```

    echo "/tmp/core-%p-%u" > /proc/sys/kernel/core_pattern

    ```


    Copyright ©Intel Corporation. All rights reserved.


    This will dump a core under /tmp, with the PID and UID suffixed. There are many
    other available options. You can also set this option permanently via sysctl.conf.'
