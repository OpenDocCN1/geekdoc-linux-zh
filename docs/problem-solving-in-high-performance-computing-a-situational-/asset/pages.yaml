  md: '# Crash analysis (crash) 185


    # # Cscope


    You could browse the sources using the standard tools like grep, but this can
    be rather tedious. A very neat utility for browsing C code is called cscope (Cscope,
    n.d.). The tool runs from the command line and uses a vi-like interface. By default,
    it will search for source files in the current directory, but you can configure
    it any way. Now, in the directory containing source files (by default, /usr/src/linux),
    run cscope:


    ```

    cscope -R

    ```


    Copyright ©Intel Corporation. All rights reserved.


    This will recursively search all subdirectories, index the sources, and display
    the main interface. There are other uses as well; try the man page or --help.
    When launched the first time, cscope will take a few moments building its indexes.
    On the main page, you can search for desired symbols, global definitions, functions,
    strings, and other information, as shown in Fig. 6.3.


    We will begin with “Find this C symbol.” The cursor keys to get down to this line,
    type the desired function name and Press Enter. The results will be displayed,
    as illustrated in Fig. 6.4.


    Depending on what happened, you may get many results or one. It is quite possible
    that there is no source code containing the function in the crash report. If there
    are too many results, you might want to search for the next function in the call
    trace by using the Find functions by this function option. Use Tab to jump between
    the input and output section. If you have official vendor support, this is a good
    moment to turn the command over and let them drive.


    If you stick with the investigation, looking for other functions listed in the
    call trace can help you narrow down the C file you require. But, there is no guarantee
    and this can


    ![](img/68d6731afe4338e918be0906dc327e1c_194_0.png)


    FIGURE 6.3 Cscope Interface


    Copyright ©Intel Corporation. All rights reserved.'
