  md: '# The correct way of introducing changes into the environment 253


    system parameters, you still observe significant, unexpected issues with your
    operating systems and applications, you will know that you may be doing the wrong
    thing.

    In complex setups, configuration management will be more about what not to do
    and check – what is not rather than the pieces that you do cover, and the greatest
