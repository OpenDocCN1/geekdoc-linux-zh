- pgno: 281
  md: '# 272 CHAPTER 10 Fine-tuning the system performance


    This is a good opportunity for an attempt to improve the system performance and
    the application runtimes using the CPU scheduling under /proc. If we consult the
    documentation (14.4 Completely Fair Scheduler, n.d.) on scheduling tunables under
    /proc/sys/kernel, we get


    +   - sched_compat_yield – this parameter enables the aggressive yield behavior
    of the old 0(1). For instance, Java applications that use synchronization extensively
    perform better with this value set to 1. It is advisable to change it only when
    you observe a drop in performance. The default value is 0.

    - sched_migration_cost – this tunable specifies the amount of time after the last
    execution that a task is considered to be “cache hot” in migration decisions.
    A “hot” task is likely to be migrated, so increasing this variable reduces latency.
    The default value is 500,000 (ns). If the CPU idle is higher than expected when
    there are runnable processes, if tasks bounce between CPUs or nodes too often,
    we would try reducing this by increasing it.

    - sched_latency – this parameter defines the targeted preemption latency for CPU
    tasks. Increasing this variable increases a CPU bound''s timeslice. A task''s
    timeslice is weighted fair share of the scheduling period. The task''s weight
    depends on the task''s level and the scheduling policy. Minimum task weight for
    a SCHED_OTHER task is 15, corresponding to nice 19. The maximum task weight is
    88761, corresponding to nice -20. Timeslices become smaller as the loads increase.


    This value also sets the maximum amount of time during which a sleeping task is
    considered to be running for entitlements. Increasing this variable increases
    the amount of time waking a task may consume before being preempted, increasing
    scheduler latency for CPU bound tasks. The default value is 20,000,000 (ns).


    +   - sched_wakeup_granularity_ns – likewise, we need to consider the wake-up
    preemption granularity. Increasing this variable reduces wake-up preemption, reducing
    disturbance of compute bound tasks. Lowering improves wake-up latency and throughput
    for critical tasks, particularly when a short duty cycle load component must compete
    with CPU bound components. The default value is 5,000,000 (ns).


    At this point, we should run some kind of a design of experiment, and execute
