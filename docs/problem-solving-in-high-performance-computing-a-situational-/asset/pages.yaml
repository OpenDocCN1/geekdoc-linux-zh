- pgno: 266
  md: '# References 257


    Common sense and experience will drive how and when you conclude work in your
    environment. A clear methodology of deployment also helps. There are some good,
    general practices that are always useful, like avoiding any configuration changes
    before or toward the end of the day, deploying in a slow, staggered manner, continuous
    communication with the customers, and effective monitoring of well-correlated,
    well-understood critical parameters of the environment. If you do not have the
    necessary situational awareness in the scope of the original problem or the reason
    for the change, what it may cause, and how you are able to measure it, then you
    will struggle completing the task.


    # RIPPLE EFFECT


    In big, complex setups as high-performance compute data centers, it is very easy
    to deviate from normal, peaceful behavior into chaos. Human errors, configuration
    problems, and false alarms can often trigger a headless race, with one bad action
    leading to another, compounding the situation. Decisions made in haste and without
    all the facts will muddy the understanding of the problem, and you may find yourself
    trying to get everyone to work together before any real problem can be fixed.


    Once again, it is important to stick to a strict discipline and adhere to policies
    that technically minded people may tend to treat the ITIL framework with design,
    but good, effective incident management and problem management can help reduce
    the unnecessary workload and focus the energy where it is required. However, even
    under stress and pressure, it is important not to neglect the proper techniques
    and tools of solving.


    # CONCLUSION


    We started our problem solving with technical tools, but we finish it with methodology
    and process. Previously, we learned how to handle data through concepts such as
    statistical engineering and design of experiment, we discussed monitoring and
