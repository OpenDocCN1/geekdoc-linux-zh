  md: '# Proc and sys together 273


    also a business decision to move away from a virtual machine to a dedicated physical
    host with significant computing resources.


    Unfortunately, your customer is phoning, complaining about the poor performance
    of the new server, and blaming it all on the modern operating system. The SQL
    server is not coping well with the workload, and connections are on time. The
    server also seems to be heavily overloaded, and it never completes the torrent
    of tasks sent its way.


    Resolving this issue can be extremely difficult, even without the human factor,
    as it covers numerous changes that go beyond the kernel itself and into the application
    space. But, it could be a valuable lesson in system optimization. If we apply
    all that we have learned so far, we want to minimize our investigation to as few
    changes as possible, and test them one a time. The first step is to understand
    the work flow.


    In our example, the customer application is firing roughly 1500 connections to
    the SQL server in a very short sequence (a matter of seconds), pulling small pieces
    of data, of which is then passed to a separate script, running on the server,
    processed, and then logged remotely to a file stored on the local disk hard.


    At this point, a comparison between the good and the bad system is mandatory,
    including both the operating system and the application stack. For the former,
    this means comparing values under /proc. For the latter, this means comparing
    SQL server configurations, and making sure they are identical — or at least proportional,
    as some of the settings are related to server resources, such as the memory size,
    number of CPU cores, and so forth.


    Even without access to the physical hardware and software, we can still ask important
    questions that could determine the lead in our investigation:


    +   * How long does it take the virtual machine to process the 1500 requests?

    * How long does it take to process a single request?

    * What is the number of concurrent requests in the process table?

    * What is the average system load while the tasks are running?

    * How does the SQL configuration affect the loads and times, if, certain parameters
    are decreased or increased (preferably by a factor of 2 each time), how does the
    overall execution change?


    Another point is the obvious error of connection timeouts, pointing to the fact
    that the SQL server is not configured to handle the expected throughput of connections.
    For the same setting, the problem does not itself on the virtual machine, which
    could be an indication that the database requests are processed *slowly* on the
    virtual machine, avoiding the bottleneck.


    With all these parameters taken into consideration, the next step is to profile
    the server workload. In our example, each connection triggers a script that runs
    for 4-5 seconds before existing. Overall, this gives us a good indication of what
    the server throughput is, and then how we can tweak it. Some of the options include
    following:


    +   * Increasing the number of connections above the maximum application load.

    * Changing or increasing the SQL server I/O cache sizes.'
