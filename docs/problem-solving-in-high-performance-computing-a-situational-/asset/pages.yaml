    # Problem reproduction


    The most important question here is when to use or not use gdb. The GNU Debugger
    is most useful when you have reproducible problems and your binaries have been
    compiled with symbols. You can also try gdb on third-party functions, but this
    will not guarantee you success.


    For instance, we know are using printf() in our code. So maybe we need to break?
    Well, gdb informs us that the function is not defined and we create a breakpoint
    pending future shared library load. Not a bad idea, but notice that we do not
    see any function names for libc.so.6, because we do not have symbols, and for
    that, we might not even have source code. Without either, it will not be easy
