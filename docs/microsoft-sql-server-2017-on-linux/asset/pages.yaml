  md: '# Microsoft SQL Server 2017 on Linux


    As with the data directory, you need to grant the proper permissions to the mssql
    group and user, as shown earlier.

    To change the port used by SQL Server, you can use the network.tcpport setting,
    The first case shows an error when a port is already in use, followed by a successful
    execution:


    ```

    # /opt/mssql/bin/mssql-conf set network.tcpport 1436

    Validation error on setting ''network.tcpport''

    Port ''1436'' is already in use. Please use another port

    ```


    ```

    # /opt/mssql/bin/mssql-conf set network.tcpport 1435

    SQL Server needs to be restarted in order to apply this setting. Please run

    systemctl restart mssql-server.service.

    ```


    After making such a configuration, you will have to specify the port every time
    you need to connect to the Linux instance, because there is no SQL Server Browser
    service to resolve it. The SQL Server Browser service on Windows would run on
    UDP port 1434, automatically listen for connections intended for instances running
    on nondefault ports, and provide the correct port to the client. For example,
    to connect from SQL Management Studio or the sqldmd utility to use port 1435 as
    defined previously, you could use the following format, in which our server hostname
    is sqllinux. Make sure the TCP/IP ports are properly configured, as indicated
    in Chapter 1.


    ```

    /opt/mssql-tools/bin/sqlcmd -U sa -S sqllinux,1435

    ```


    Finally, to disable SQL Server trace flags, you can use the traceflag option,
    as shown next:


    ```

    # /opt/mssql/bin/mssql-conf traceflag 3226 1222

    SQL Server needs to be restarted in order to apply this setting. Please run

    systemctl restart mssql-server.service.

    ```


    As shown, you can enable or disable more than one trace flag at a time if you
    specify a list separated by spaces.


    # NOTE


    Trace flag 3226 is used to suppress successful backup operation entries in the
    SQL Server error log and in the system event log. Some other popular trace flags,
    such as 2371, 1117, and 1118, which are always recommended, are no longer required
    in SQL Server 2016 or later because their behavior is now part of the product.
    These trace flags are explained later in this chapter.'
