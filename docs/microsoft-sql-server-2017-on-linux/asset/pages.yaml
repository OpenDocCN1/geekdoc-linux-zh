    Although for some SQL Server users, it may seem like SQLOS already provided the
    abstraction functionality to move SQL Server to another platform, that was not
    the case with Linux. Though SQLOS was about services and optimizing for new hardware
    abstraction, Drawbridge provided the abstraction that was needed. Marrying these
    two technologies was the appropriate solution. In fact, the Drawbridge library
    OS component provided the required functionality. The second component, the microprocess,
    was not required for the project. The SQLPAL architecture is depicted in Figure
    2-4, which also includes a host extension layer that was added to the bottom of
    SQLOS to help SQLPAL interact with the operating system. Host extension is the
    operating system-specific component that maps calls from inside SQLPAL to the
    real operating system calls.


