    EXECUTE AS USER = ''test_user''

    SELECT * FROM test

    WHERE field2 = 666

    REVERT

    ```


    On the first query, the malicious user knows that field2 is greater than 600 and
    less than 700, as the query returns one row in each case. Continuing such techniques,
    the user can try other values as field = 666 until the required data is returned,
    and by doing that discovering its value.


    # Summary


    This chapter served as an introduction to security on SQL Server on Linux. SQL
    Server on Linux supports the same enterprise-level security capabilities that
    are available on SQL Server on Windows today, and all these features are built
    into the product.


    The chapter defined SQL Server Security in terms of layers. The first layer, or
    level, of security is about protecting the data itself, typically by using methods
    such as encryption. The second layer is about controlling access to the data,
    which is basically defining who is allowed to access which parts of the data.
    The third layer is about monitoring access by tracking activities that are happening
    against it.


    The chapter also covered Transparent Data Encryption, Always Encrypted, Row-Level
    Security, and Dynamic Data Masking in more detail. Transparent Data Encryption
    is a security feature designed to protect the database data and transaction log
    files and backup files against unauthorized access to physical media. Always Encrypted
    is a client-side encryption technology designed to protect sensitive data. Row-Level
    security is a security feature that controls access to rows in a table based on
    the user executing a query. Finally, Dynamic Data Masking is another security
    feature introduced with SQL Server 2016 that is aimed at limiting sensitive data
    exposure by masking it to nonprivileged users.'
