    # The Unix File System


    Another new experience for first-time Unix users coming from the Windows world
    is the Unix file system. First of all, Unix uses no drive letters, as C\; D\;
    or E;. If you are familiar with Windows mount points, introduced with Windows
    2000, you may have an idea of how a Unix file system looks. A Unix file system
    is defined as one rooted tree hierarchy of directories. The root of the entire
    tree is denoted as root and any additional directory starts from there. New volumes
    can be mounted as a directory in this structure. Traditionally a Unix file system
    includes the following directories:


    +   - /bin Directory for binaries; may be a link to /usr/bin

    - /dev Directory for devices

    - /etc (etcetera) Directory for system configuration files and system databases

    - /home User home directories

    - /lib Directory for libraries

    - /mnt (mount) Empty directory used as a temporary mount point

    - /opt Directory for locally installed software

    - /proc Directory for processes

    - /sbin Directory for system binaries

    - /root Root user home directory

    - /sys Directory for system hardware and operating system information

    - /tmp Directory for temporary files'
