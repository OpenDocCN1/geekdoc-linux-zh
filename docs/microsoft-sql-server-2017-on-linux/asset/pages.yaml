  md: '# 42 Microsoft SQL Server 2017 on Linux


    Most SQL Server users will be surprised to learn that SQL Server was actually
    born on the Unix platform, first ported to OS/2 and later to the Windows operating
    system. In its early days, SQL Server was written by Sybase and released for OS/2
    and Windows NT in an agreement with Microsoft. After its relationship with Sybase,
    Microsoft secured the code base of the database engine and decided to make SQL
    Server a Windows-only technology, which remained the case for more than two decades.


    A second architectant feature for the Linux implementation was the development
    of SQL Operating System (SQLOS), which was written for the SQL Server 2005 release.
    SQLOS was created to exploit the newly available hardware and to provide the database
    engine with more specialized services than a standard operating system could afford.
    SQLOS is also the SQL Server application layer responsible for managing all operating
    system resources, such as preemptive scheduling, memory and buffer management,
    I/O functions, resource governance, exception handling, and extended events. SQLOS
    was never intended to be a platform-independent solution. Porting SQL Server to
    other operating systems was not in the plan during the SQL development.


    In an astonishing announcement in March 2016, Microsoft surprised the industry
    by declaring that SQL Server would be available on the Linux platform sometime
    in 2017. After that, it seems the industry expected a real port that compiled
    the SQL Server C++ code into a native Linux application. Microsoft later indicated
    that this version would be named SQL Server 2017 and would be available on Red
    Hat Enterprise Linux, Ubuntu, and SUSE Linux Enterprise, in addition to Docker.
    Docker itself runs on multiple platforms, which means that it would be possible
    to run the SQL Server Docker image on Linux, Mac, and Windows.


    But when the first parts of the beta version of the software, called a Community
    Technology Preview (CTP), were released in November 2016, we were in another surprise:
    instead of a port, SQL Server was able to run on Linux thanks to some virtualization
    techniques based on Drawbridge, the software result of a Microsoft project completed
    just a few years later.


    Microsoft soon released more information about how SQL Server on Linux works;
    its architecture includes several components such as the Drawbridge technology,
    a revamped SQLOS, and the SQL Platform Abstraction Layer (SQLPAL), the layer that
    enabled Microsoft to bring Windows applications to Linux. SQL Server 2017 was
    finally released in October 2017.


    This chapter covers some SQL Server history with different operating systems and
    explains some of the details about how SQL Server on Linux works. This includes
    describing the interaction between SQL Server and the operating system, decisions
    regarding its architecture, its software implementation, and other related topics.'
  merge: -1
