  md: '# Chapter 4: SQL Server Configuration


    After you set the system administrator password, start your SQL Server instance
    by running the following statement:


    ```

    $ sudo systemctl start mssql-server

    ```


    To run mssql-conf, you must have the proper permissions, either superuser or as
    a user with membership in the mssql group. If you try running mssql-conf without
    the right permissions, you''ll get an error:


    ```

    $ /opt/mssql/bin/mssql-conf

    ```


    This program must be run as superuser or as a user with membership in the mssql
    group.


    The available arguments of the mssql-conf utility are shown next:


    ```

    # /opt/mssql/bin/mssql-conf

    uusage: mssql-conf [-h] [-n]

    positional arguments:

    ```


    +   - `setup`: Initialize and setup SQL Server

    - `set`: Set the value of a setting

    - `unset`: Unset the value of a setting

    - `list`: List the supported settings

    - `traceflag`: Enable/disable one or more traceflags

    - `set-sa-password`: Set the system administrator (SA) password

    - `set-collation`: Set the collation of system databases

    - `validate`: Validate the configuration file

    - `set-edition`: Set the edition of the SQL Server instance


    optional arguments:


    ```

    -h, --help show this help message and exit

    -n, --noprompt does not prompt the user and use environment variables or defaults.

    ```


    As suggested in the preceding output, you can use the mssql-conf utility to perform
    several configuration options, such as initialize and up SQL Server, set the sa
    password (as shown earlier), set the collation of system databases, enable or
    disable one or more trace flags, set the edition of SQL, and assign the value
    of a setting. This means that the mssql-conf utility can be used to change a configuration
    setting in two different ways: using an mssql-conf option such as traceflag or
    set-sa-password, or changing a configuration setting such as memory.maxlimitmb.
    To list the supported configuration settings, use the following command:


    ```

    /opt/mssql/bin/mssql-conf list

    ```'
