  md: '# Chapter 5: SQL Server Query Tuning and Optimization 155


    # Creating and Updating Statistics


    Statistics are created in several ways: automatically by the query optimizer (if
    the default option to create statistics automatically, AUTO_CREATE_STATISTICS,
    is on), when an index is created and explicitly (for example, via the CREATE STATISTICS
    statement). Statistics can be created on one or more columns, and both the index
    and explicit creation support single- and multicumn statistics. However, the statistics
    that are automatically generated by the query optimizer are always single-column
    statistics. The components of statistics objects are the histogram, the density
    information, and the string statistics. Both histograms and string statistics
    are created only for the first column of a statistics object, and the latter is
    created only if the column is of a string data type.


    Density information is calculated for each set of columns, forming a prefix in
    the statistics object. Filtered statistics, on the other hand, are not created
    automatically by the query optimizer, but only when a filtered index is created
    or when a CREATE STATISTICS statement with a WHERE clause is issued. Both filtered
    indexes and statistics are a feature introduced in SQL Server 2008.


    With the default configuration (AUTO_STATISTICS is on), the query optimizer automatically
    updates statistics when they are out of date. As noted, the query optimizer does
    not automatically create multicolon or filtered statistics, but once they are
    created, using any of the methods described earlier, they can be automatically
    updated. Alternatively, rebuild operations and statements as UPDATE STATISTICS
    can also be used to update statistics. Because both the auto-create and auto-update
    defaults give you quality statistics most of the time, it is strongly recommended
    that you keep these defaults. Naturally, you also have the choice of using some
    other statements if you need more control over the quality of the statistics.


    By default, statistics may be created (if nonexistent) and automatically updated
    (if out of date) as necessary during query optimization. "out of date" refers
    to the data changed and therefore the statistics not being representative of the
    underlying data (more on the mechanism later). If an execution plan for a specific
    query exists in the plan cache and the statistics that were used to build the
    plan are now out of date, then the plan is discarded, the statistics are updated,
    and a new plan is created. In a similar way, updating statistics, either manually
    or automatically, invalidates any existing plan that used those statistics, and
    will cause a new optimization the next time the query is executed.


    When it comes to determining the quality of your statistics, a fact to consider
    is the size of the sample of the target table used to calculate said statistics.
    The query optimizer determines a statistically significant sample by default when
    it creates or updates statistics, and the minimum sample size is 8MB (1024 pages)
    or the size of the table if it''s smaller than 8MB. The sample size will increase
    for bigger tables, but it may still be only a small percentage of the table.'
