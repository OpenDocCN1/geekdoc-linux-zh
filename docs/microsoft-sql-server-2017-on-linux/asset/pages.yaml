    # Indexes


    Indexing is one of the most important techniques used in query tuning and optimization.
    By using the right indexes, SQL Server can speed up your queries and dramatically
    improve the performance of your applications. There are several kinds of indexes
    in SQL Server, so the focus of this section will be on clustered and nonclustered
    indexes.


    SQL Server can use indexes to perform seek and scan operations. Indexes can be
    used to speed up the execution of a query by quickly finding records without performing
    table scans, by delivering all the columns requested by the query without accessing
    the table (that is, covering the query), or by providing sorted order, which will
    benefit queries with GROUP, DISTINCT, or ORDER clauses.


    Part of the query optimizer''s job is to determine whether an index can be used
    to resolve a predicate in a query. This is basically a comparison between an index
    key and a constant or variable. In addition, the query optimizer determines whether
    the index covers the query—that is, the index contains all the columns required
    by the query (in which case it is referred to as a *covering index*). It needs
    to confirm that a nonclustered index usually contains only a subset of the columns
    of the table. SQL Server can also consider using more than one index and joining
    them to cover all the columns required by the query. This operation is called
    *index intersection*. It is not possible to cover all of the columns required
    by the query, SQL Server may need to access the base table, which could be a clustered
    index or heap, to obtain'
