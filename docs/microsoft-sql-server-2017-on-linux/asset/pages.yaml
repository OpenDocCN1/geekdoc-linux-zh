    # Statistics


    This section covers statistics, which is one of the most important things that
    can impact query performance. In versions prior to SQL Server 2016, a common configuration
    was to enable trace flag 2371 to improve the threshold use by SQL Server to update
    statistics automatically. Starting with this SQL Server version, this configuration
    was enabled by default, so the trace flag was no longer needed.


    By default, SQL Server automatically creates and updates query optimizer statistics.
    You can change this database-level default, but doing so is almost never recommended
    because it would require the developer or administrator to create all the required
    statistics manually. Although this is possible, it doesn''t make sense, because
    the query optimizer can efficiently create the required statistics for. Some statistics
    will be created automatically when you create indexes for the columns in the index
    key. Manually creating statistics could be required only in a very limited number
    of cases, one when multicolumn statistics are required. Multicolumn statistics
    are not created automatically by SQL Server.


    Updating statistics is a little different. SQL Server can automatically update
    statistics when a specific threshold is reached. Although there are two thresholds
    or algorithms used to accomplish this, which I will cover in a moment, a common
    problem is the size of the sample used to update the statistics object. High-performance
    databases may require a more proactive approach to updating statistics instead
    of letting SQL Server hit any of these two thresholds and using a very small sample.


    The main limitation with automatic statistics is the traditional 20 percent fixed
