    # Additional Commands


    The ps (process status) command is one of the most useful Unix commands and has
    a large variety of options. Use it to see the current processes running in the
    system. Let''s start with the most basic ps command, which will return only the
    processes running in the current session:


    ```

    $ ps

    PID TTY TIME CMD

    2315 pts/0 00:00:00 bash

    3820 pts/0 00:00:00 ps

    ```


    The columns returned are PID (process ID), the terminal associated with the process,
    the cumulative CPU time, and the executable name. This example shows only the
    current shell and the ps process itself. You will need to specify some parameters
    to see system-wide information. Here is a common one:


    ```

    $ ps -ef

