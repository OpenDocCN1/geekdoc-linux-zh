  md: '# Chapter 8: Security 269


    following statements, which create a temporary user, and use EXECUTE AS to run
    the

    query as the specified user:


    ```

    CREATE USER test_user WITHOUT LOGIN

    GRANT SELECT ON test TO test_user

    EXECUTE AS USER = ''test_user''

    SELECT * FROM test

    REVERT

    ```


    You will see the values shown in the Masked column:


    | Column | Original | Masked |

    | --- | --- | --- |

    | field1 | San Diego | xxxx |

    | field2 | 666 | 0 |

    | field3 | 14:03.8 | 00:00.0 |

    | field4 | 0x0000000000000000000000000007B | 0x30 |

    | field5 | admin@benminnevare.com | aXXX@XXXX.com |

    | field6 | 123 | 2 |

    | field7 | Los Angeles | LXXXXXXX |


    As mentioned, you can also use ALTER TABLE ALTER COLUMN for existing tables

    and columns. Try the following test:


    ```

    ALTER TABLE test

    ALTER COLUMN field7 ADD MASKED WITH (FUNCTION = ''partial(2, "XXXXXX", 0)'')

    ```


    In this case, the value for field7 will now show as LXXXXXXX.

    Finally, although Dynamic Data Masking can help in a large variety of security
    cases,

    keep in mind that some techniques may bypass the Dynamic Data Masking definitions.

    For example, a malicious user may try brute-force techniques to guess values,
    and

    that may be able to see the real data. As an example, see the following queries:


    ```

    EXECUTE AS USER = ''test_user''

    SELECT * FROM test

    WHERE field2 < 600

    REVERT


    EXECUTE AS USER = ''test_user''

    SELECT * FROM test

    WHERE field2 < 600

    REVERT

    ```'
