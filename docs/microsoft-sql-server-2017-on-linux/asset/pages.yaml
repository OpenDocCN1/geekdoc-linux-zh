    # # Clustered Indexes vs. Heaps


    One of the main decisions you have to make while creating a table is whether to
    use a clustered index or a heap. This is sometimes a topic for debate in the SQL
    Server community, and there is no right or wrong answer. Although the best solution
    may depend on your table definition and workload, it is usually recommended that
    you define each table with a clustered index, and this section will show you why.
    Let''s start with a summary of the advantages and disadvantages of organizing
    tables as clustered indexes or heaps.'
