    # Statistics Maintenance


    As mentioned, the query optimizer will, by default, automatically update statistics
    when they are out of date. Statistics can also be updated with the UPDATE STATISTICS
    statement, which you can schedule to run as a maintenance job. Another statement
    commonly used, sp_updatedatest, also runs UPDATE STATISTICS behind the scenes.


    There are two important benefits of updating statistics in a maintenance job.
    The first is that your queries will use updated statistics without having to wait
    for the automatic update of statistics to be completed, avoiding delays in the
    optimization of your queries (although asynchronous updates can also be used to
    partially help with this problem). The second benefit is that you can use a larger
    sample than the query optimizer will use, or you can even scan the entire table.
    This can give you better quality statistics for big tables, especially for those
    where data is not randomly distributed in their data pages. Manually updating
    statistics can also be a benefit after operations such as batch data loads, which
    update large amounts of data, are performed.


    On the other hand, note that the update of statistics will cause a recompiling
    of plans already in the plan cache that are using these statistics, so you may
    not want to update statistics too frequently.


    An additional consideration for manually updating statistics in a maintenance
    job is how they relate to rebuild maintenance jobs, which also update the statistics.
    Keep the following items in mind when combining maintenance jobs for both indexes
    and statistics, remembering that both index and nonindex column statistics and
    that index operations obviously may impact the first of these:


    +   - Rebuilding an index (for example, using the ALTER INDEX ... REBUILD statement)
    will also update statistics by scanning all the rows in the table, which is the
    equivalent of using UPDATE STATISTICS WITH FULLSCAN. Rebuilding indexes does not
    update any column statistics.'
