- img_proc: true
  md: '# Chapter 5: SQL Server Query Tuning and Optimization 127


    execution plans. Making a wise choice is important, because the time taken to
    return the results to the user can vary wildly, depending on which plan is selected.


    The job of the query optimizer is to create and assess as many candidate execution
    plans as possible, within certain criteria, to find a good enough plan, which
    may be, but it is not necessarily, the optimal plan. We define the search space
    for a given query as the set of all possible execution plans for that query; in
    which any possible plan in this search space returns the same results. Theoretically,
    to find the optimal execution plan for a query, a cost-based query optimizer should
    generate all possible execution plans that exist in that search space and correctly
    estimate the cost of each plan. However, some complex queries may thousands, or
    even millions, of possible execution plans, and also the SQL Server query optimizer
    typically considers a large number of candidate execution plans, it cannot perform
    an exhaustive search of all the possible plans for every query. If it did, the
    time to assess all of the plans would be unacceptably long and could have a major
    impact on the overall execution time.


    The query optimizer must strike a balance between optimization time and plan quality.
    For example, if the query optimizer finds a few milliseconds good enough plan
    that executes in two or three seconds, then it doesn''t make sense to try to find
    the perfect or most optimal plan if this is going to take one or more minutes
    of optimization time, plus the execution time. So SQL Server does not do an exhaustive
    search, but instead tries to working within a time constraint, there''s a chance
    that the plan selected may be the optimal plan, but it is also likely that it
    just be something close to the optimal.


    To explore the search space, the query optimizer uses transformation rules and
    heuristics. The generation of candidate execution plans is performed inside the
    query optimizer using transformation rules, the use of heuristics limits the number
    of choices considered in order to keep the optimization time reasonable. The set
    of alternative plans considered by the query optimizer is referred to as the plan
    space, and these plans are stored in memory during the optimization process in
    the Memo structure.


    # Assessing the Cost of Each Plan


    Searching or enumerating candidate plans is just one part of the optimization
    process. The query optimizer still needs to estimate the cost of these plans and
    select the least expensive one. To estimate the cost of a plan, it estimates cost
    formulas that consider the use of resources such as I/O, CPU, and memory. This
    cost estimation depends mostly on both the algorithm used by the physical operator
    and the estimated number of records that will need to be processed. This estimate
    of the number of records is known as the cardinality estimation.'
