  md: '# Microsoft SQL Server 2017 on Linux


    these recommendations in the most common scenarios, you may need to look at your
    specific Linux distribution documentation for more details on their configuration.


    # Kernel Settings


    Microsoft recommends several CPU- and disk-related Linux kernel settings for a
    high-performance configuration. Table 4-1 shows the recommended CPU settings.


    Red Hat Enterprise Linux provides predefined performance tuning profiles that
    can help configure these and other kernel settings automatically. Predefined performance
    tuning profiles have been designed to enhance performance for specific use cases,
    but you can create your own profiles. For this particular case, I''ll use a predefined
    profile named throughput-performance to configure the previously listed settings
    automatically.


    I can use the tuned-adm tool to activate any available tuning profile. For example,
    for my newly create Red Hat Enterprise Linux virtual machine, I can use the active
    option to set the current active profile:


    ```

    # tuned-adm active

    Current active profile: virtual-guest

    ```


    I can list the available profiles, which also specifies the active profile:


    ```

    # tuned-adm list

    ```


    My list shows the following:


    +   * balanced General nonspecialized tuned profile

    * desktop Optimize for the desktop use case

    * latency-performance Optimize for deterministic performance at the cost of increased
    power consumption


    | Setting | Value | More Information |

    | --- | --- | --- |

    | CPU frequency governor | Performance | See the cpower command. |

    | ENERGY_PERF_BIAS | Performance | See the x86_energy_perf_policy command. |

    | min_perf_pct | 100 | See your documentation on intel p-state. |

    | C-States | C1 only | See your Linux or system documentation on how to ensure
    C-States is set to C1 only |


    Table 4-1 Recommended Settings for CPU-Related Linux Kernel'
