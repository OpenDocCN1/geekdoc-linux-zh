    # # Process Affinity


    Microsoft recommends that you set the process affinity for all the NUMA nodes
    and CPUs when SQL Server is running in a Linux operating system. You can accomplish
    this using the ALTER SERVER CONFIGURATION statement with the SET PROCESS AFFINITY
    option. You can use either CPU or NUMANODE choices, the latter being the easiest
    choice. Using the CPU option enables you to specify the CPU or range of CPUs to
    assign threads to. Using the NUMANODE option enables you to assign threads to
    all CPUs that belong to the specified NUMA node or range of nodes.


    PROCESS AFFINITY enables hardware threads to be associated with CPUs and helps
    maintain an efficient Linux and SQL scheduling behavior. It is recommended that
    you set process affinity even if your system has a single NUM node.


    The following command, for example, sets the process affinity for all the NUMA
    nodes on a system with four nodes:


    ```

    ALTER SERVER CONFIGURATION

    PROCESS AFFINITY NUMANODE = 0, 3

    ```


    # # Max Degree of Parallelism


    One of the most important settings to configure on a new SQL Server installation,
    the max degree of parallelism option, defines the number of logical processors
    employed to run a single statement for parallel execution plans. Although a perfect
    configuration may depend on the specific workload, Microsoft has, since long ago,
    published a best practice recommendation that can work on most of the workloads
    or can be used as a starting point.


    First of all, the hardware on which SQL Server is running must be capable of running
    parallel queries—which means at least two logical processors are required, and
    this includes almost every server available today, including most typical configurations
    in virtual machines for production instances. Second,'
