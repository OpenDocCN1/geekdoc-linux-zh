    # Trace Flags 1117 and 1118


    Because SQL Server uses SGAM pages to look for mixed extents with at least one
    unused page, a possible workaround for SGAM contention could be to avoid mixed
    extents entirely and instead, exclusively use uniform extents. Trace flag 1118
    has been available since SQL Server 2000 to do this.


    By sharing most page allocations, and instead, using dedicated extents, you reduce
    the contention on SGAM pages. A downside with using trace flag 1118, however,
    is that every object will use a dedicated extent, which requires eight pages.
    If the object is small enough to fit in only one page, then it will have to use
    64KB, instead of 8KB. This wastes 56KB of space. The other downside is that this
    configuration takes effect at the instance level, impacting databases as well.
    SGAM pages will still be used, as IAM pages will still need to be single page
    allocations from mixed extents, but SGAM contention most likely can be eliminated
    or greatly minimized. Trace flag 1117 is related to how SQL Server increases the
    size of database files by enabling growth of all files in a group.


    Two additional related recommendations are to create the tempdb data files of
    equal size and not to rely on the autogrow file settings. Let''s review these
    recommendations. The recommendation to create the data files of equal size on
    the proportional file algorithm used by SQL Server, which considers the current
    size of the database files, at the file group level. This algorithm determines
    in which order files are utilized and written to and spreads the allocations through
    the pages in a round-robin fashion. There is, however, an unfortunate behavior
    when files are not the same size. Instead of spreading Global Allocation Map (GAM)
    allocations between all the files in a database, it would favor the largest file
    instead. Because of this, it is artificial to configure all the data files the
    same size originally. Trace flag 1117 enables you to avoid this problem by growing
    all the tempdb files together at the same time by the configured instance. However,
    as in the case of trace flag 1118, trace flag 1117 applies to the entire SQL instance,
    working at the file group level over user databases. You may need to review whether
    it could be another issue for file groups on your user databases.'
