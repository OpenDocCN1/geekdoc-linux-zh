    # USE HINT Query Option


    Available for the first time in SQL Server 2016 Service Pack 1, the new USE HINT
    query option remains a highly unknown feature. USE HINT can be used to get the
    behavior of some trace flags at the query level using the QUERYTRACE hint. As
    you know, the QUERYTRACE hint lets you enable a plan-affecting trace flags for
    a single-query compilation.


    A problem with some of this functionality in the past is that QUERYTRACE was partially
    documented and required sysadmin privileges. By partially documented, I mean that
    you could use a large number of trace flags with QUERYTRACE, but only a small
    portion was supported and documented. Using USE HINT, you can alter the query
    optimizer by using any of the supported query flags listed in Table 6-1 without
    requiring sysadmin permissions. Table 6-1 lists the new hints, the trace flag
    that provides a similar behavior, and, if available, the database option that
    can provide the same behavior at the database level.


    # NOTE


    A list of supported QUERYTRACE trace flags is available at https://support.microsoft.com/en-us/help/280143/enable-plan-affecting-sql-server-query-optimizer-behavior-that-can-be.


    The following hints are supported:


    +   - DISABLE_OPTIMIZED_NESTED_LOOP Disables a batch sort operation for optimized
    nested joins.


    +   - FORCE_LEGACY_CARDINALITY_ESTIMATION Enables the old cardinality estimator
    when a performance regression has been found.


    +   - ENABLE_QUERY_OPTIMIZER_HOTFIXES Enables query optimizer hotfixes released
    on service packs and cumulative updates.


    +   - DISABLE_PARAMETER_SNIFFING Disables parameter sniffing.'
