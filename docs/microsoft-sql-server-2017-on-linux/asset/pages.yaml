  md: '# Chapter 4: SQL Server Configuration


    A few more details about the algorithm to update statistics automatically, especially
    as it relates to tables with 500 rows or smaller, temporary tables, and filtered
    statistics, can be found in the white paper at https://msdn.microsoft.com/en-us/library/dd535534(SQL100).aspx.


    # Trace Flag 2371


    Trace flag 2371 was introduced with SQL Server 2008 R2 as a way to change and
    lower the threshold in which statistics are automatically updated, and with any
    other trace flag, it has to be manually enabled. The new algorithm will use whatever
    number of changes is smaller between the new formula, defined as SQRT(1000 * number
    of rows), and the old one using 20 percent of the size of the table. If you do
    the math using both formulas, you can see that the threshold changes with tables
    of 25,000 rows, in which both cases return the same value: 5000 cases. For example,
    with the default algorithm requiring 20 percent of cases, if a large table has
    a billion rows, it would require 200 million rows to trigger the update. Trace
    flag 2371 would require a smaller threshold, in this case, SQRT(1000*1000000000),
    or 1 million. SQL Server 2016 and later has the behavior of trace flag 2371 enabled
    by default when you use the new database capability level 130 or later.


    Finally, covering statistics in full detail is outside the scope of this book,
    I would recommend the Microsoft white paper Used by the Query Optimizer in Microsoft
    SQL Server 2008, which is still valid for the latest versions. You can find it
    at https://msdn.microsoft.com/en-us/library/dd535534(SQL100).aspx.


    # Summary


    This chapter covered configuring SQL Server on Linux from three different areas.
    First, there is no Configuration Manager on Linux, so configuring the SQL Server
    port or a trace flag at the server level now has to be done with the mss-config
    utility. In addition, mss-config can be used to configure a large variety of other
    settings.


    It also covered several CPU and disk-related Linux kernel settings for a highperformance
    configuration, in addition to some operating system-level configurations such
    as transparent huge pages, which can improve the performance of Linux when managing
    large amounts of memory.


    Finally, it covered some critical SQL Server configuration settings that apply
    either to Windows or Linux implementations. An interesting behavior by Linux when
    a server is running low in memory, the Out-Of-Memory Killer, was introduced as
    well.'
