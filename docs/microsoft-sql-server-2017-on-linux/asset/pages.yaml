  md: '# Microsoft SQL Server 2017 on Linux


    This chapter on configuring SQL Server in a Linux environment is divided into
    three main topics: using the mssql-conf utility to configure SQL Server, which
    is required in Linux environments; using Linux-specific kernel settings; and some
    traditional SQL Server configurations for both Windows and Linux installations.


    The first section covers the mssql-conf utility, which includes some of the functionality
    available with the SQL Server Configuration Manager tool for Windows, including
    configuring network ports or configuring SQL Server to use specific trace flags.
    In addition, mssql-conf can be used to configure initialization and setup of SQL
    Server, set up the system administrator password, set the configuration of the
    system databases, and update a configuration setting. The second part of the chapter
    covers Linux kernel settings, which can be used to improve the performance of
    SQL Server, as well as some operating system configurations such as transparent
    huge pages. The third section of the chapter covers the most popular SQL Server
    configuration settings, and most of the section applies to both Windows and Linux
    implementations.


    # NOTE


    For additional information on configuring SQL Server for high performance, see
    my book High Performance SQL Server (Apress, 2016).


    # The mssql-conf Utility


    Chapter 1 briefly covers the mssql-conf utility, where it was used to install
    and configure SQL Server. Let''s start with a scenario in which you create a virtual
    machine with SQL Server already installed. In this scenario, you are required
    to perform only two operations: set a system administrator (sa) password and start
    SQL Server.


    Here is the execution and output of the first of these steps on a newly created
    virtual machine with Red Hat Enterprise Linux:


    ```

    $ sudo /opt/mssql/bin/mssql-conf set-sa-password

    [sudo] password for bnevarez:

    ```


    ```

    Enter the SQL Server system administrator password:

    Confirm the SQL Server system administrator password:

    Configuring SQL Server...

    ```


    The system administrator password has been changed.

    Please run ''sudo systemctl mssql-server'' to start SQL Server.


    ![](img/0a5d3f27ca07081d5ee426b77bb624b8_113_0.png)'
