  md: '# Chapter 7: High Availability and Disaster Recovery


    At this moment, the availability group is completely configured. Now it is time
    to go back to the primary replica and add a database to the availability group.
    You can use an existing database or create a database now. The database needs
    to be in the full recovery mode and have an initial backup. Run the following
    statements to do just that:


    ```

    CREATE DATABASE AdventureWorks

    ALTER DATABASE AdventureWorks SET RECOVERY FULL

    BACKUP DATABASE AdventureWorks

    TO DISK = N''/var/opt/mssql/data/AdventureWorks.bak''

    ```


    Again, on the primary replica, sqlonux1, we can use the ADD DATABASE option of
    the ALTER AVAILABILITY GROUP to add one or more user databases to the availability
    group. Run the following statement:


    ```

    ALTER AVAILABILITY GROUP ag1 ADD DATABASE AdventureWorks

    ```


    Because the availability group was configured with SEEDING_MODE as AUTOMATIC,
    at this time the databases should be created on the secondary replicas. This would
    obviously depend on the size of the database. Validate that the database has been
    created using Object Explorer on SQL Server Management Studio or by running the
    following statements:


    ```

    SELECT * FROM sys.databases

    GO

    SELECT @@SERVERNAME, DB_NAME(database_id), synchronization_state_desc, synchronization_health_desc

    FROM sys.dm_hadr_database_replica_states

    ```


    The synchronization_state_desc should be SYNCHRONIZED (perhaps you could briefly
    see it as NOT SYNCHRONIZING and then SYNCHRONIZING if you run the ALTER AVAILABILITY
    GROUP statement). The synchronization_health_desc should be HEALTHY (may also
    show briefly as NOT_HEALTHY).


    We completed the configuration of the availability group in SQL Server. Now we
    need to configure Pacemaker on Linux. It is interesting to note that when each
    supported Linux distribution has Pacemaker available, they are not exactly the
    same and there might be differences between distributions, as each one can be
    customized and have some different implementations and versions. Before going
    into the Pacemaker configuration, I''ll also review briefly how to configure availability
    groups using the SQL Server Management Studio user interface.


    # SQL Server Management Studio Configuration


    To start configuring availability groups in SQL Server Management Studio, expand
    the Always On High Availability folder. The Somening about enabling the high-availability
    option appears, although it was already enabled. You can just ignore it.'
