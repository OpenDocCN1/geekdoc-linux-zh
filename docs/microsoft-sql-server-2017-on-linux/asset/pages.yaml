- img_proc: true
  md: 'This chapter provides an introduction to high-availability and disaster-recovery
    solutions for SQL Server on Linux and focuses on Always On groups. As high availability
    and disaster recovery are broad topics, this chapter does not intend to be a comprehensive
    reference, but it will teach you everything you need to know to get started this
    feature with SQL Server on Linux. For additional information, refer to the SQL
    Server documentation.


    Availability groups, failover cluster instances (FCIs), and log shipping are the
    most important features provided by SQL Server 2017 on Linux. Such features are
    used in high-availability and disaster-recovery configurations. With availability
    groups, they can also be used for migrations and upgrades or even scale out readable
    copies of one or more databases. A SQL Server feature that is sometimes considered
    for availability scenarios, replication, is not currently available in SQL Server
    for Linux but is planned to be included in a future release. Another related feature,
    database mirroring, has been deprecated as of SQL Server 2012 and will not be
    included in the Linux release.


    “Always On” is a term that encompasses both Always On availability groups and
    Always On FCIs. A great benefit of availability groups is that they can provide
    highavailability and disaster recovery solutions over geographic areas. For example,
    a local secondary replica can provide high-availability capabilities and a remote
    secondary replica on a different data center to provide disaster recovery. In
    this scenario, the local replica traffic can be replicated synchronously, thereby
    providing zero data loss availability, which is possible when network latency
    is low. And the remote replica can run asynchronously, providing minimal data
    loss disaster recovery where low network latency is guaranteed.


    # SQL Server High-Availability and Disaster-Recovery Features


    Although SQL Server provides features to help with high availability and disaster
    recovery, a robust and tested backup and restore strategy will be the basis of
    any availability solution. Although high availability and disaster recovery have
    common objectives, high availability usually refers to redundancy on the same
    data center, while disaster recovery is related to the choice to recover a system
    when a data center is longer available. So high availability could be helpful,
    for when a single server is not available; disaster recovery is required when
    a data center suffers a catastrophic event, such as a flood or earthquake, to
    make applications and databases available in some other data center or location.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Chapter 7: High Availability and Disaster Recovery


    SQL Server features such as log shipping and replication have been available for
    as long as the product itself. Failover clustering was introduced with SQL Server
    6.5. Database mirroring was introduced with SQL Server 2005 and was subsequently
    deprecated with SQL Server 2012, which introduced availability groups. Although
    availability groups is an Enterprise Edition feature, basic availability groups
    can be used in the Standard Edition as well, which helps with the replacement
    of database mirroring. SQL Server installations using database mirroring can be
    replaced with basic availability groups on SQL Server Standard Edition or regular
    availability groups on the Enterprise Edition. Replication is not yet available
    on the Linux release.


    Log shipping is the process of automating the continuous backup of transaction
    log files on a primary database server and restoring them to a secondary server.
    Log shipping using SQL Server Agents that periodically take transaction log backups
    of the primary database, copy them to one or more secondary servers, and restore
    them to the secondary databases. For availability groups and database mirroring,
    the SQL server engine reads from the transaction log and copies them from the
    primary server to the mirror or secondary replica. Availability groups can work
    in two ways: synchronous-commit mode and asynchronous-commit mode. In synchronous-commit
    mode, the primary replica waits for the secondary replica to confirm that transaction
    log records have been written to disk, which is also called hardening the log.
    In asynchronous-commit mode, the database engine does not wait for any secondary
    replica to write records to disk. Therefore, synchronous-commit guarantees that
    no data loss is possible on a synchronous replica database depending upon several
    factors, such as network latency and transactional throughput.


    Another main consideration between these availability features is the scope. Failover
    clustering is the only one of these features that works at the instance level,
    while availability groups, log shipping, and database mirroring all work at the
    database level. Contrast with replication, which can be configured even at a granular
    level, tables or subsets of tables can be replicated; these objects are known
    as publications. In some scenarios, except failover clustering, instance-level
    objects such as logs or SQL Agent jobs would need to be manually synchronized
    in a full failover scenario.


    Although FCIS failover at the instance level, they require some of shared storage,
    which also means that only a single copy of the data provides a single point of
    failure, as opposed to availability groups and the other features, in which two
    or more copies of a database can be involved.


    A basic availability group supports only two replicas—a primary and a secondary—and
    the availability group can have only one database. However, although you can have
    only one database in a basic availability group, you can have several basic availability
    groups on the same SQL Server instance. Enterprise Edition availability groups
    can have'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'multiple databases in a single availability group and up to nine replicas for
    availability group (one primary and eight secondaries). Additional benefits such
    as readable secondaries (providing scale-out reads) or offloading backups on secondary
    replicas are available only in the Enterprise Edition.


    # Always On Availability Groups


    As mentioned, Always On availability groups are also available on SQL Server on
    Linux. The main difference between availability groups in Windows and Linux is
    that in Linux, availability groups depend on Pacemaker instead of Windows Server
    Failover Cluster (WSFC). WSFC is built into the Windows operating system, and
    SQL Server and availability groups are cluster-aware. In Windows, all the elements—SQL
    Server, the operating system, and WSFC—are held tightly together they are all
    from one vendor: Microsoft. Linux, on the other hand, does not provide a vendor-agnostic
    clustering solution but instead relies on other solutions such as Pacemaker. Pacemaker
    is an open-source solution and external to Linux, and each of the three supported
    Linux distributions provides its own version of Pacemaker.


    The SQL Server High-Availability package, also known as the SQL Server resource
    agent for Pacemaker, is an optional package in SQL Server that must be installed
    for a high-availability solution in Linux. You can think of the SQL Server High-Availability
    package as the integration between Pacemaker and SQL high-availability solutions—in
    this case, availability groups and failover cluster instances (FCIAS). A SQL Server
    instance in Linux is not cluster-aware.


    > NOTE

    As introduced in Chapter 1, the SQL Server Agent is optional but recommended for
    installation and is a requirement for a log-shipping configuration. Interestingly,
    although in Windows they are installed together, the database engine and the SQL
    Server Agent run as different Windows services. On Linux, although they are installed
    with different packages, the SQL Server Agent runs as part of the database engine
    process.'
