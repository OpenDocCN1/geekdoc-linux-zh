    Figure 1-9 Inbound security rules


    We need to configure a new inbound rule on the network security group. We want
    to add a new rule to allow SQL Server connections using TCP port 1433. Click Add
    and change the configuration as shown in Figure 1-10. Type a name such as MSSQL
    and select MS SQL on the Service drop-down list. Protocol and Port Range will
    be automatically configured to TCP and 1433, respectively.


    Leave the other fields set to their default values and click OK. For completeness,
    these are the definitions shown on the Azure portal:


    +   * **Priority** Rules are processed in priority order; the lower, the higher
    the priority. We recommend leaving gaps between rules—100, 200, 300, and so on—so
    its easier to add new rules without having to edit existing rules.


    +   * **Source** The source filter can be Any, an IP address range, or a default
    tag. It specifies the incoming traffic from a specific source IP address range
    that will be allowed or denied by this rule.


    +   * **Service** The service specifies the destination protocol and port range
    for this rule. You can choose a predefined service, such as RDP or SSH, or provide
    a custom port range. In our case, there is a predefined service, MS SQL, which
    already specifies the TCP protocol and port 143.


    +   * **Protocol** You can provide a single port, such as 80, or a port range,
    such as 1024-65535. This specifies on which ports incoming traffic will be allowed
    or denied by this rule. Enter an asterisk (*) to allow traffic from clients connecting
    on any port.


    Click OK to finish the configuration. Refresh the content shown in Figure 1-10
    will now show both SSH and MS SQL services, using the TCP ports 22 and 1433, respectively.
    Only for Red Hat Linux, you also have to open up port 1433 on the firewall. On
    Linux, run the following commands


    ```

    $ sudo firewall-cmd --zone=public --add-port=1433/tcp --permanent

    $ sudo firewall-cmd --reload

    ```'
