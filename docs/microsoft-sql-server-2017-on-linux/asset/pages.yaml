  md: '# Chapter 2: How SQL Server on Linux Works 43


    # # The Sybase Years


    Microsoft SQL Server was born indirectly as part of an agreement between IBM and
    Microsoft to develop OS/2, the operating system that was planned to be the successor
    of MS-DOS. Before the release of this operating system, IBM added a database product
    to its version of OS/2, so Microsoft needed a database product as well. Microsoft
    turned to a new company, Sybase, to license its database product. The original
    agreement between Sybase and Microsoft was to port its database engine, DataServer,
    originally developed for Unix platforms, to the OS/2 operating system.


    Later in the process, to appeal to the large dBASE community, a marketing and
    distribution deal was also signed with Ashton-Tate/Microsoft SQL Server, which
    was eventually released in May 1989. It''s interesting to note that Sybase, the
    company that wrote the original software, was not included in the product name.


    The SQL Server database engine was ported to OS/2 from the Unix source code, and
    Ashton-Tate/Microsoft SQL Server version 1.0 debuted in OS/2 in May 1989. The
    agreement with Ashton-Tate did not last long, and the product was renamed SQL
    Server; its first version under this name, version 1.1, shipped in the summer
    of 1990.


    OS/2 was created as a replacement for MS-DOS, but the market was in for a huge
    surprise. Instead of moving from MS-DOS to OS/2, users were moving to Windows
    3.0. Windows 3.0 had an unexpected success in the computer industry. It was essential
    for SQL Server to support Windows as a client as well. Microsoft provided tools
    for developers to create Windows applications that could connect to SQL Server.
    (Note that Windows was not an immediate success either, as the first two versions
    of the software were mostly ignored).


    At that time, Microsoft was also working on an operating system kernel, originally
    intended to be used on OS/2, but later became a new operating system called Windows
    NT, which was released in 1993. For Microsoft, the obvious next step was to port
    SQL Server to Windows NT.


    Suddenly the SQL Server team in Microsoft was faced with the dilemma of simultaneously
    developing versions for both OS/2 and Windows NT; some of the issues faced with
    this development would be revisited many years later for the Linux release. The
    team faced with a new set of problems: they needed to add an abstraction layer
    to hide the differences in the operating systems, they''d need major reengineering
    for both versions of SQL Server, or they''d take a lowest common denominator approach
    and not fully use the services or features of either system.


    The decision was to keep SQL Server as a Windows NT–only technology, even when
    at the time it was a new operating system with no installed user base. So this
    time, SQL Server version 4.2 for OS/2 was ported to Windows NT. Because there'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'was no need to be concerned about portability to other operating systems or
    creating an abstraction layer, the team could focus on doing the best possible
    job for only one operating system, Windows NT. It was decided that the goals of
    portability were in conflict with the goal of creating the best software for Windows
    NT. The final product, SQL Server for Windows NT, would then be more of a port
    from the OS/2 code, because it required rewriting the kernel of SQL Server, the
    part of the software that interacts with the operating system.


    The initial release, Windows NT 3.1, was shipped on July 27, 1993, and was written
    in C, C++, and assembly language. (There was no version 1.0 or 2.0.) The first
    beta version of SQL Server for Windows NT was released in October 1992. SQL Server
    4.2a, released in 1993, was the first version to run on Windows. This was the
    last full port of SQL Server, because got the rights for the 4.21a code base and,
    as mentioned earlier, later changes of the product would focus only on Windows
    NT without consideration of any future possibility of porting back to Unix or
    any other operating system.


    In those early days, Microsoft was competing with Sybase, which was releasing
    System 10 for Windows NT. Sybase System 10 was designed in a more portable manner
    and as a consequence could not perform as well as SQL Server, which was designed,
    written, and optimized for Windows NT. In April 1994, Microsoft and Sybase announced
    the end of their development agreement, and each decided to develop their own
    SQL products. The last version of SQL Server for OS/2, SQL Server 4.2B, was released
    in 1993.


    Although no additional development happened during the following releases, at
    least for the purposes of this story, Microsoft would rearchitect the entire database
    engine and include a brand-new query processor for its SQL Server 7.0 release,
    which shipped in 1998.


    Although the first version of SQL Server was version 1.X, there was no version
    2.0 or 3.0. Later, Microsoft would also skip version 5.0, moving from version
    4.2 to release 6.0. Finally, instead of using version 8.0 for the SQL Server 2000,
    Microsoft would use a new company-wide naming standard for many of its products,
    which continues to this day, with SQL Server 2017, although their internal version
    numbers, which can be returned by the @VERSION function, still shows the original
    version number. For example, SQL Server 2000 was version 8, and the full build
    name for RTM (release to manufacturing) is 8.00.194. The current version, SQL
    Server 2017, is version 14.0, and the current software RTM-CU2 shows 14.0.3008.27.


    # NOTE


    For more about the history of SQL Server, at least until SQL Server 2000, the
    first chapter of the Inside Microsoft SQL Server books by Kalen Delaney and Ron
    Soukup, which can also be found online at the bottom of https://www.sqlinternals.com/resources.


    ![](img/0a5d3f27ca07081d5ee426b77bb624b8_63_0.png)'
