  md: '# Chapter 6: New Query Processing Features 18


    # Automatic Tuning


    Automatic SQL is a new feature, which according to the SQL Server 2017 documentation,
    is intended to "provide insight into potential query performance problems, recommend
    solutions, and automatically fix identified problems." Although this may sound
    extremely broad and optimistic, it has created a lot of hype in the SQL Server
    community, at the moment its only released feature is to help with plan regressions
    of queries, which were originally performing optimally. No announcements have
    yet indicated whether it will cover any additional features in a future release,
    or what those additional features could be. Although automatic tuning''s current
    benefits are extremely limited, we hope they could be extended in the near future
    to cover additional query performance problems.


    Automatic tuning also has a second feature,automatic index management, which is
    available only on Azure SQL Database. This feature is intended to automatically
    create recommended indexes or remove indexes that are no longer used by any query.
    I do not cover SQL Database in this book, but you can get more details about this
    feature by looking at the online documentation at https://docs.microsoft.com/en-us/sql/relational-databases/automatic-tuning/automatic-tuning.


    Automatic plan regression consists of automatically switching to the last known
    good plan of a query in a regression is detected. The database engine will automatically
    force a recommendation only when the estimated CPU gain is better than 10 seconds,
    or when both the forced plan is better than the current one and the number of
    errors in the new plan is higher than the number of errors in the recommended
    plan. These thresholds cannot be changed.


    In addition, the automatic plan regression process does not ending for last known
    good plan, because the database engine continues to monitor the changes and can
    roll back if the new plan is not performing better than the replaced plan. Note
    that you could also implement this process manually, identifying the query and
    plan on the query store and running the sp_query_store_force_plan procedure. This
    process requires that you manually monitor the information on the query store
    to find the plan regression, locate the last known good plan, apply the required
    script to force the plan, and continue to monitor the performance of the changes.
    All of this functionality is available by using the query store, so it can be
    implemented starting with SQL Server 2016. A disadvantage of this manual process,
    as hinted, is that you also have to monitor the changes continuously to see if
    they continue to bring performance benefits or otherwise decide to undo the execution
    plan.


    Finally, note that forcing a plan should be used only as a temporary fix while
    you look into a permanent solution. For a plan is like a collection of hints,
    which is discussed in Chapter 4, basically disables the work of the query optimizer.
    Finding a permanent solution may require applying standard query tuning techniques.'
  merge: -1
