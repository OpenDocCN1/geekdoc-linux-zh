  md: '# Microsoft SQL Server 2017 on Linux


    Basically, kill is used to signal processes. By default, kill sends the SIGTERM
    signal, which tells the process to exit gracefully. If the process is coded properly,
    it will call its exit routines, shut down gracefully, and clean up its internal
    resources. Using kill -9 will send the SIGKILL signal, which will kill the process
    without calling its exit routines.


