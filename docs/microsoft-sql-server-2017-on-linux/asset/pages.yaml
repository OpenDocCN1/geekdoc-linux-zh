  md: '# Chapter 5: SQL Server Query Tuning and Optimization


    In the paper "When to Break Down Complex Queries," which you can find at https://blogs.msdn.microsoft.com/sqlcat/2013/09/09/when-to-break-down-complex-queries,
    the author describes several problematic query patterns for which the SQL Server
    query optimizer is not able to create good plans. The paper was published in October
    2011 and indicates that it applies to versions from SQL Server 2005 to SQL Server
    codename "Denali,"I was still able to see the same behavior in the most recent
    versions of SQL Server.


    # Hints


    SQL is a declarative language; it defines only what data to retrieve from the
    database. It doesn''t describe the manner in which the data should be fetched.
    That, as we know, is the job of the query optimizer, which analyzes a number of
    candidate execution plans for a given query, estimates the cost of each of these
    plans, and selects an efficient plan by choosing the cheapest of the choices considered.


    But there may be cases when the execution plan selected is not performing as you
    expected, and as part of your query troubleshooting process, you may try to find
    a better plan. Before doing this, keep in mind that just because your query does
    not perform as expected, this does not mean a better plan is always possible.
    Your plan may be an efficient one, but the query may be an expensive one to perform,
    or your system may be experiencing performance bottlenecks that are impacting
    the query execution.


    However, the query optimizer does an excellent job most of the time, it occasionally
    fails to produce an efficient plan. That being said, even in cases when you''re
    not getting an efficient plan, you should try to distinguish between those times
    when the problems arise because you are not providing the query optimizer with
    all the information it needs to do a good job and those times when the problems
    are a result of a query optimizer limitation. Part of the focus of this chapter
    has been to help you provide the query optimizer with the information it needs
    to produce an efficient execution plan, such as the right indexes and good quality
    statistics, and also how to troubleshoot the cases when you are not getting a
    good plan.


    Having said, there might be cases when the query optimizer just gets it wrong,
    and because of that we may be forced to resort to hints. Hints are essentially
    optimizer directives that enable us to take explicit control over the execution
    plan for a given query, with the goal of improving its performance. In reaching
    for a hint, however, we are going against the declarative property of the SQL
    language and, instead, giving direct instructions to the query optimizer is risky
    business; hints need to be used with caution and only as as a last resort when
    no other option is available to produce a viable plan.'
