    # Building a Command


    It is very common in Unix environments to use commands built from one or more
    commands using piping or redirection. This is typically the result of one command
    producing some output to be processed by another command. Output is usually redirected
    from one command to another using the pipe symbol (|). Output can also be redirected
    to other devices or files using the > and >> symbols.


    Let''s start looking at some examples. The following command saves the output
    of ps into a file named ps_output:


    ```

    $ ps > ps_output

    ```


    Using > always creates a new file, overwriting an existing file if needed. You
    can use >> to add the output to an existing file. Running the following command
    will add the new output to the existing file:


    ```

    $ ps >> ps_output

    ```


    Using 2> redirects the standard error output to a file. For example, you may have
    standard error output mixed with normal output, which may be difficult to read.
    A common case is using find and getting the permission denied error on multiple
    directories:


    ```

    $ find / -name sqlcmd

    ...

    find: ''/root'': Permission denied

    opt/mssql-tools/bin/sqlcmd

    ```'
