    # NOTE


    For more details about fencing and Stonith, see clusterlabs.org/pacemaker/doc/crm_fencing.html.


    In the same way, set the start-failure-is-fatal property to false. This property
    is always used to treat failures as fatal. We want to disable it to let the cluster
