  md: '# Chapter 5: SQL Server Query Tuning and Optimization 123


    query tuning and optimization, you can, first, avoid these performance problems
    by optimizing your databases and, second, quickly troubleshoot and fix the problems
    if they actually occur.


    One of the best ways to learn how to improve the performance of your databases
    is not only to work with the technology, but to understand the underlying technology
    works, how to get the most benefit from it, and even what its limitations are.
    The most important SQL Server component impacting the performance of your queries
    is the SQL Server query processor, which includes the query optimizer and the
    execution engine.


    With a perfect query optimizer, you could submit any query and you would get a
    perfect execution plan every time. And with a perfect execution engine, each of
    your queries would run in a matter of milliseconds. But the reality is that query
    optimization is a very complex problem, and no query optimizer can find the best
    plan all the time, or at least in a reasonable amount of time. For complex queries,
    a query optimizer would need to analyze many possible execution plans. And even
    if a query optimizer could analyze all the possible solutions, its next challenge
    would be to decide which plan to choose. In other words, which of the possible
    solutions is the most efficient? Choosing the best plan would require estimating
    the cost of each solution, which again is a very complicated task.


    Don''t get me wrong: the SQL Server query optimizer does an amazing job and gives
    you a good execution plan almost all the time. But you must understand what information
    you need to provide to the query optimizer so it can do a good job, which may
    include providing the right indexes and adequate statistics, as well as defining
    the required constraints and providing a good database design. SQL Server provides
    you with tools to help you in some of these areas, including the Database Engine
    Tuning Advisor (DTA) and the auto-create and auto-update statistics features.
    But you can still do more to improve the performance of your databases, especially
    when you are building high-performance applications. Finally, you need to understand
    the cases for which the query optimizer may not give you a good execution plan
    and what to do in those cases.


    To help you understand this technology, I will start with an overview of how the
    SQL Server query processor works. I will explain the purpose of both the query
    optimizer and the execution engine and how they interact with the plan cache to
    reuse plans as much as possible. I will also show you how to work with execution
    plans, which are the primary tool we will use to interact with the query processor.


    # Query Processor Architecture


    At the core of the SQL Server database engine are two major components: the storage
    engine and the relational engine, also called the query processor. The storage
    engine is responsible for reading data from the disk and memory in a manner that
    optimizes concurrency while maintaining data integrity. The query processor, as
    the name suggests,'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Microsoft SQL Server 2017 on Linux


    accepts all queries to SQL Server, devises a plan for their optimal execution,
    and executes the plan and delivers the required results.


    Queries are submitted to SQL Server using the SQL language (or Transact-SQL [T-SQL]),
    the Microsoft SQL extension to SQL). Because SQL is a high-level declarative language,
    it only defines what data to get from the database, the steps required to retrieve
    data or any of the algorithms for processing the result. Thus, for each query
    it receives, the first job of the query optimizer is to devise a plan, as quickly
    as possible, that describes the best possible way (or, at the very least, an efficient
    way) to execute said query. Its second job is to execute the query according to
    that plan. Each of these tasks is delegated to a separate component in the query
    processor; the query optimizer devises the plan and passes it along to the query
    engine, which will actually execute the plan and get the results from the database.


    The SQL Server optimizer is a cost-based optimizer. It analyzes a number of candidate
    execution plans for a given query, estimates the cost of each of these plans,
    and selects the plan with the lowest cost of choices deemed. Indeed, given the
    query optimizer cannot consider every possible plan for every query, it actually
    has to find a balance between the optimization time and the quality of the selected
    plan.


    Therefore, it is the SQL Server component that has the biggest impact on the performance
    of your databases. After all, selecting the right or wrong execution plan could
    mean the difference between a query execution time of milliseconds and one of
    minutes, or hours. Naturally, a better understanding of how the query optimizer
    helps both database administrators and developers to write better queries and
    provide the query optimizer with the information it needs to produce efficient
    execution plans. This chapter will demonstrate how you can use your newfound knowledge
    of the query optimizer''s inner workings; in addition, it will give you the knowledge
    and tools to troubleshoot cases when the query optimizer is not giving you a good
    plan.


    To arrive at what it believes to be the best plan for executing a query, the query
    processor performs the following steps, which are also shown in Figure 5-1.


    +   1. Parsing and binding The query is parsed and bound. Assuming the query is
    valid, the output of this phase is a logical tree, with each node in the tree
    representing a logical operation that the query must perform, such as reading
    a particular table or performing an inner join.


    +   2. Query optimization The logical tree in the step 1 is used to run the query
    optimization process, which roughly consists of the following two steps:


    +   a. Generation of possible execution plans Using the logical tree, the query
    optimizer devises a number of possible ways to execute the query (that is, a number
    of possible execution plans). An execution plan is, in essence, a set of physical
    operations (such as an index seek or a nested loops join) that can be performed
    to produce the required result, as described by the logical tree.'
