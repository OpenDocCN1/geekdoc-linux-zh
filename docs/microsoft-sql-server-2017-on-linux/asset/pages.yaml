  md: '# Adaptive Query Processing


    Adaptive query processing provides a new generation of query processing improvements
    for SQL Server that enables the query optimizer to make runtime adjustments to
    statistics and execution plans and discover additional information that can lead
    to better query performance. For the SQL Server 2017 initial release, adaptive
    query processing includes the following algorithms:


    +   - Batch mode adaptive joins

    - Batch mode memory grant feedback

    - Interleaved execution for multistatement table value functions


    Microsoft has also mentioned that more features will be added in the future, including
    adaptive memory grant feedback for row mode, which was announced recently.

    As mentioned in Chapter 5, the estimated cost of a plan is based on the query
    cardinality estimation, as well as on the algorithms or operators used by the
    plan. For this to estimate the cost of an execution plan correctly the query optimizer
    needs to estimate the number of records returned by a given query. During query
    optimization, SQL Server explores many candidate plans, estimates their relative
    costs, and selects the most efficient one. As such, incorrect cardinality and
    cost estimation may cause the query optimizer to choose inefficient plans, which
    can have a negative impact on the performance of your database.


    In addition, cost estimation is inexact and has some limitations, especially when
    it comes to the estimation of the intermediate results in a plan. Errors in intermediate
    results in effect get magnified as more tables are joined and more estimation
    errors are included within the calculations. On top of all, some operations are
    not covered by the mathematical model of the cardinality estimation component,
    which means the query optimizer has to resort to guess or heuristics to deal with
    these situations. For example, some SQL Server features such as table variables
    and multistatement-valued user-defined functions have no support for statistics,
    and the query optimizer will use a fixed estimate of 100 rows, 1 row on versions
    previous to SQL Server 2014.


    Traditionally, if a bad cardinality estimation contributed to a suboptimal execution
    plan, no additional changes were allowed after that and the plan was used to execute
    the query anyway. So if the estimates were incorrect, the created plan was still
    used despite it being a suboptimal plan. Adaptive query processing offers some
    improvements to this traditional query optimization model. Let us cover next the
    first three adaptive query processing algorithms available with SQL Server 2017.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Batch Mode Adaptive Joins


    As hinted in Chapter 5, choosing an incorrect join type due to cardinality estimation
    errors could seriously impact the performance of queries. Batch mode adaptive
    joins help with this problem by allowing a plan to select the physical join algorithm
    dynamically at execution time based on the real number of rows flowing through
    the join.


    The current release of batch mode adaptive joins works only for hash joins or
    nested loops joins and assumes the join will initially be a hash join. The adaptive
    join reads the build input and, if a calculated threshold is met, will continue
    as a hash join; otherwise, it will use the same input to execute as a nested loops
    join. The nested loops join will use the rows already read by the hash join input,
    which also means that even if a nested loops join is finally selected, the memory
    requested is that of a hash join.


    Batch mode adaptive joins, as the name may suggest, are currently limited to querying
    tables with columnstore indexes, although as indicated later, a known workaround
    could be a dummy columnstore index to encourage the use of the adaptive joins
    on row store stores. In any of these cases, the execution plan using adaptive
    joins will be cached and used for additional executions in which the join algorithm
    selection will happen at runtime depending on the original calculated threshold.


    There are a few limitations with adaptive joins in the current release. First,
    batch mode adaptive joins work only for SELECT statements that are not used on
    data modification operations. In addition, as suggested earlier, an adaptive join
    always requires memory for the build phase, which would not be required for a
    nested loops join. Finally, this build phase is a blocking (or stop-and-go) operation,
    which will not allow any processing in the plan until it is completed.


    There are few benefit from either a hash join or a nested loops join to be considered
    in a plan:


    +   - The query may benefit from either a hash join or a nested loops join. This
    means that if the third kind of physical join, merge join, is a better choice,
    the adaptive join will not be used.

    - The query may use a columnstore index, or, at least, a columnstore index must
    be defined on any of the tables referenced by the query.

    - The generated alternative solutions of the hash join and the nested loops join
    should have the same first input, called build input or output reference, respectively.


    Let''s try the batch mode adaptive joins by creating a columnstore index on the
    AdventureWorks database. For this and the following exercises, make sure your
    database is in compatibility level 140 by running the following statement:


    ```

    ALTER DATABASE AdventureWorks2014 SET COMPATIBILITY_LEVEL = 140

    ```'
