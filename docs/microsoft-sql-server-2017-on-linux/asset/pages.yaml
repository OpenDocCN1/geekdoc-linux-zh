    But now, years later, when the team faced the dilemma again, a PAL was created
    to abstract the calls and libraries from the underlying operating system. SQLPAL
    was created to separate all operating system- or platform-specific code in one
    layer keeping the rest of the SQL Server code base operating-system agnostic.


