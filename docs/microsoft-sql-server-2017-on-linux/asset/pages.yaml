  md: '# Chapter 7: High Availability and Disaster Recovery


    # NOTE


    SQL Server 2017 CU3 provided a security update related to a processor design vulnerability
    that impacted nearly every computer and phone. These vulnerabilities are referred
    to as speculative execution side-channel attacks, aka the Meltdown and Spectre
    side-channel vulnerabilities.


    Availability groups can be used to configure both high-availability and disaster-recovery
    solutions. For example, availability groups can be configured to have a primary
    and secondary replica on the same data center, plus another secondary replica
    on a different data center, as shown in Figure 7-1. Availability groups can also
    be used in other scenarios, such as migration, upgrades, and creation of readable
    copies for running queries or taking backups.


    A cluster type in SQL Server 2017 can be WSFC, External, or None. An availability
    group type of None can be used on both Windows and Linux and does not require
    an underlying cluster, removing the cluster configuration complexity. This configuration,
    however, is not a high-availability solution but can be used for migrations or
    upgrades or to add another read-only replica. The None cluster type option can
    technically enable high-availability and disaster-recovery capabilities for Linux
    where no automatic failover is required, but this configuration is not recommended.


    For automatic failover, availability groups require the following configurations
    and states:


    +   - The cluster type must be configured to External; cluster type None is not
    supported.


    +   - The primary and secondary replicas are configured as synchronous commit.


    +   - The secondary replica must be in a synchronized state (as opposed to synchronizing).


    +   - The secondary replica sequence_number must match the one from the original
    primary replica.


    ![](img/0a5d3f27ca07081d5ee426b77bb624b8_226_0.png)


    Figure 7-1 Availability groups with replicas on two data centers'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 208 Microsoft SQL Server 2017 on Linux


    Pacemaker uses constraints, which could be something similar to dependencies on
    a Windows failover cluster. Pacemaker provides three kinds of constraints:


    +   - **Colocation** Indicates whether or not two resources should be running
    on the same node

    - **Location** Enforces where a resource can or cannot run

    - **Ordering** Indicates the order in which the cluster resources should start


    Pacemaker saves the configuration of the cluster in the corosync.cfg file. A Pacemaker
    also uses the concept of *fencing*, which is the isolation of a failed node so
    that it does not cause disruption to a computer cluster; it is implemented by
    the Stonith (which stands for "Shoot the other node in the head"). At the time
    of this writing, Hyper-V does not include a solution for Stonith, which also impacts
    Microsoft Azure virtual machines. Microsoft is working on a solution to this.


    # Availability Groups on Windows vs. Linux


    The following are some of the differences between availability groups on Windows
    and Linux:


    +   - Linux does not provide a clustering component. Instead, each of the three
    Linux-supported distributions uses Pacemaker, which is an open-source clustering
    solution.

    - The Pacemaker configuration of the availability group is created after the availability
    group is configured. In the Windows world you are required to create a cluster
    first using WSFC and then configure availability groups.

    - The Microsoft Distributed Transaction Coordinator (MSDTC) is not available on
    Linux. If your application requires MSDTC, you cannot use SQL Server on a Linux
    platform. The MSDTC service is a component of Windows that is responsible for
    coordinating transactions that span multiple resource managers, such as file systems,
    message queues, and databases.

    - Automatic or manual failover is performed using Pacemaker. No support is available
    for T-SQL or SQL Server tools. However, a workaround can be used in cases where
    a failover using cluster may not work; it can be used to force a manual failover
    using the T-SQL ALTER AVAILABILITY GROUP FAILOVER statement.

    - The SQL Server High-Availability package provides the integration between Pacemaker
    on Linux and SQL Server.'
