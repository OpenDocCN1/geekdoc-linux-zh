    # Interleaved Execution for Multistatement Table-Value Functions


    The previous algorithms for adaptive query processing work in a different way.
    One uses a row threshold to decide the join type at runtime, and the second improves
    the memory grant size based on execution feedback. Interleaved execution for multistatement
    table-value functions works in a different way. I mentioned earlier that traditional
    query optimization creates a plan, and even if it is based on bad estimates, the
    created plan is executed away. For interleaved execution, the query processor
    engine will in fact pause query optimization, execute the multistatement'
