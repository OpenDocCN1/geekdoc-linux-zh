  md: '# Chapter 5: SQL Server Query Tuning and Optimization 153


    Here are some good reasons to leave a table as a heap:


    +   * If the table is very small, a heap is best—although a clustered index could
    work fine for a small table, too.


    +   * If the row identifier (RID) is smaller than a clustered index key, use a
    heap. Individual rows in a heap are identified by a RID, which is a row locator
    that includes information such as the database file, page, and slot numbers to
    allow a specific record to be easily located. An RID uses 8 bytes and, in many
    cases, could be smaller than a clustered index key. Because every row in every
    nonclustered index contains the RID or the clustered index key to point to the
    corresponding record on the base table, a smaller size could greatly benefit the
    amount of resources used.


