  md: '# Running SQL Server on Docker


    Docker is a software technology that provides containers as an additional layer
    of abstraction and automation to the virtualization technologies we are very familiar
    with. Docker can run on the Linux, Windows, or Mac OS operating systems.


    A fundamental difference between using SQL Server on Docker and the previous Linux
    installations is that Docker will run a preexisting SQL Server 2017 image. The
    currently available image is an installation of SQL Server 2017 on Ubuntu 16.04.
    Keep in mind that this Ubuntu SQL Server 2017 image can run on any operating system
    that supports Docker containers.


    To run SQL Server 2017 on Docker, you will first need a Docker installation. Because
    there might be different ways to configure Docker, in this exercise I will show
    Docker on an Ubuntu virtual machine.


    For example, to run Docker on my previous Ubuntu virtual machine image, I use
    the following:


    ```

    $ docker

    ```


    And I get the following response:


    The program ''docker'' is not installed. You can install it by typing:

    sudo apt install docker.io


    I followed the recommendation and ran the following:


    ```

    sudo apt install docker.io

    ```


    > SQL Server 2017 requires 3.25GB of memory on Docker, so make sure the host is
    configured with at least 4GB of memory. This was a common problem I found on some
    default Docker installations.


    Next, we need to download the SQL Server 2017 image by running the following:


    ```

    sudo docker pull microsoft/mssql-server-linux:2017-latest

    ```


    Here is some output in my installation:


    ```

    Using default tag: latest

    latest: Pulling from microsoft/mssql-server-linux:2017-latest

    aed5891ba52: Pull complete

    773ae8583d14: Pull complete

    d1d48771f72: Pull complete

    ```'
