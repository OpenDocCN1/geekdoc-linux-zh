  md: '# Chapter 4: SQL Server Configuration 99


    You can disable the trace flags using the off parameter, as shown next:


    ```

    # /opt/mssql/bin/mssql-conf traceflag 1222 off

    ```


    Similarly, you can unset a value to go back to the default configuration. For
    example, the change to TCP port 1435 can be reverted back to the default 1433
    by running the following mssql-conf command:


    ```

    /opt/mssql/bin/mssql-conf unset network.tcpport

    ```


    As usual, with every configuration change, you will need to restart the SQL Server
    instance for changes to take effect.


    Finally, to enable availability groups on your SQL Server instance, you can run
    the following command. Availability groups, high availability, and disaster recovery
    will be covered in more detail in Chapter 7.


    ```

    /opt/mssql/bin/mssql-conf set hadr.hadrenabled 1

    ```


    SQL Server needs to be restarted in order to apply this setting. Please run ''systemctl
    restart mssql-server.service''.


    You can see the current configured settings by viewing the contents of the /var/opt/mssql/mssql.conf
    file, as shown next, which includes only the nondefault values. As such, a setting
    not included in this file is using the default value:


    ```

    more /var/opt/mssql/mssql.conf

    ```


    Here''s an example with a few changes performed earlier


