    time changed from 0.9ms to 22.6ms,” which means that my plan was using 0.9ms and
    the regressed plan using a table scan switched to 22.6ms. Once again, this is
    not a big difference because AdventureWorks is a very small database.

    **valid_since** The first time the tuning recommendation was generated.

    **last_refresh** The last time the same because it is the first recommendation.
    In our case, they are both the first recommendation.

    **state** State of the tuning recommendation as a JSON document. Currently only
    two fields are available: currentValue, which is the current state of the recommendation,
    and reason, which is the reason the tuning recommendation is in such a state.
