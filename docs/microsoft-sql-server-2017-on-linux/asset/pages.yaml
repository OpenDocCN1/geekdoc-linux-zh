  md: '# Microsoft SQL Server 2017 on Linux


    Let''s try an example to see how the technology works by looking at automatic
    plan correction. (Automatic index management will not be covered here because
    it is implemented on Azure SQL Database.)


    Sometimes trying to create a real performance problem with AdventureWorks can
    be a challenge, because it is a very small database. Although one option could
    be to create tables with millions of rows, instead I can show the concept using
    the same scripts I showed in Chapter 5 demonstrating parameter sniffing. So let''s
    start by restoring a fresh copy of the AdventureWorks database.


    In this case, let''s assume that the desired plan is the one using an index and
    if we suddenly have a scale, we can consider it a regression. If we have not already
    done so, enable the query store on AdventureWorks by running the following statements:


    ```

    ALTER DATABASE AdventureWorks2014 SET QUERY_STORE = ON

    GO

    ALTER DATABASE AdventureWorks2014 SET QUERY_STORE (OPERATION_MODE = READ_WRITE,

    MAX_STORAGE_SIZE_MB = 1024)

    ```


    If you already have the query store enabled, you can just run the following statement
    to purge its data and start clean:


    ```

    ALTER DATABASE AdventureWorks2014 SET QUERY_STORE CLEAR ALL

    ```


    Create the following procedure:


    ```

    CREATE PROCEDURE test (@pid int)

    AS

    SELECT * FROM Sales.SalesOrderDetail

    WHERE ProductID = @pid

    ```


    Again, for this example, assume the following is the desired or optimal plan,
    using an index/key lookup combination:


    ```

    EXEC test @pid = 898

    ```


    Execute it a few more times so it can be captured by the query store:


    ```

    EXEC test @pid = 898

    GO 30

    ```


    Performance and plan information about these procedure executions are now recorded
    in the query store. Now suppose that, for some reason, the plan is evicted from
    memory and a new suboptimal plan is created instead. To simulate the plan being
    removed from memory, you can clear the plan cache for the AdventureWorks database
    by running the following statement:


    ```

    ALTER DATABASE SCOPED CONFIGURATION CLEAR, PROCEDURE_CACHE

    ```'
