  md: '# Chapter 1: SQL Server on Linux: Getting Started 39


    # Uninstalling SQL Server


    Removing SQL Server is essentially the same procedure for all the Linux distributions,
    and it involves using the appropriate package manager utility that we have used
    previously in the chapter. First, stop the SQL Server instance as indicated earlier.


    To remove SQL Server on Red Hat Enterprise Linux, run the following:


    ```

    sudo yum remove mssql-server

    ```


    To remove SQL Server on Ubuntu, run the following:


    ```

    sudo apt-get remove mssql-server

    ```


    To remove SQL Server on SUSE Linux Enterprise Server, run the following:


    ```

    sudo zypper remove mssql-server

    ```


    In any of the listed Linux distributions, if you need to remove all the databases
    after uninstalling SQL Server, run the following:


    ```

    sudo rm -rf /var/opt/mssql/

    ```


    # Summary


    This chapter covered installing SQL Server on Linux and provided you with enough
    information to get started using the product as quickly as possible. It covered
    how to install and configure SQL Server in a preexisting Linux installation, which
    could be either a virtual machine on Microsoft Azure or Amazon Web Services or
    your own Linux installation. You learned to install SQL Server on Red Hat Enterprise
    Linux, SUSE Linux Enterprise Server, and Ubuntu and how to configure an image
    of SQL Server on a Docker container.


    If you followed the instructions in this chapter, you will have a SQL Server up
    and running and will be ready to cover most advanced topics, such as configuring
    SQL Server on Linux for high availability and disaster recovery or covering the
    new query processing and security features. Chapter 2 covers architecture decisions,
    how SQL Server works on Linux, how SQL Server interacts with the operating system,
    and other related topics.'
