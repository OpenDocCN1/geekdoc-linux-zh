    # Statistics


    The SQL server query optimizer is a cost-based optimizer; therefore, the quality
    of the execution plans it generates is directly related to the accuracy of its
    cost estimations. In the same way, the estimated cost of a plan is based on the
    algorithms or operators used as well as their cardinality estimations. For this
    reason, to estimate the cost of an execution plan correctly, the query optimizer
    needs to estimate, as precisely as possible, the number of records returned by
    a given query. During query optimization, SQL explores many candidate plans, their
    relative costs, and selects the most efficient one. As such, incorrect cardinality
    and cost estimation may cause the query optimizer to choose inefficient plans,
    which can have a negative impact on the performance of your database.


    SQL Server creates and maintains statistics to enable the query optimizer to calculate
    cardinality estimation. A cardinality estimate is the estimated number of rows
    that will be returned by a query or by a specific query operation such as a join
    or a filter. Selectivity is a concept similar to cardinality estimation, which
    can be described as the fraction of rows in a set that satisfy a predicate, and
    it is always a value between 0 and 1, inclusive. A highly selective predicate
    returns a small number of rows.'
