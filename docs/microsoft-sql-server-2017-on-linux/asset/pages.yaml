    +   * You frequently need to return data in a sorted order or query ranges of
    data. In this case, you would need to create the clustered index key on the column''s
    desired order. You may need the entire table in a sorted order or only a range
    of the data. These operations are ordered scans and partial ordered scans, respectively.


    +   * You frequently need to return data grouped. In this case, you would need
    to create the clustered index key on the columns by the GROUP clause. To perform
    aggregate operations, SQL Server requires sorted data, and if it is not already
    sorted, a likely expensive sort operation may need to be added to the query plan.


