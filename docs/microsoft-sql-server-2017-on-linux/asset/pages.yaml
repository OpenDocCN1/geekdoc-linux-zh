  md: '# Chapter 4: SQL Server Configuration 109


    the chapter. In this section, I will start describing a Linux behavior that you
    should be aware of while configuring the memory available on your Linux installation.


    # Linux Out-of-Memory Killer


    If you''re a SQL Server administrator familiar with the Windows world, the OOM
    you need to be aware of a Linux kernel behavior: when a server is running low
    in memory, the kernel starts killing processes to free up memory and stay operational.
    This behavior, controlled by a mechanism called the Out-of-Memory Killer (OOM
    Killer), is in principle an optimization designed for the kernel to use the memory
    allocated by applications in a better way. Because many applications allocate
    their memory front and usually do not utilize all the memory allocated, the Linux
    kernel was designed to make memory use more efficient by having the ability to
    overcommit, allocating more memory than it actually has available.


    Under this design, an obvious problem will occur when applications really do all
    the memory allocated. For a SQL Server implementation, SQL Server will be the
    application using most of the memory and is therefore likely to be the killed
    process.


    If the SQL Server process is killed and you know there is the possibility of a
    memory problem, start by looking at the Linux system logs at /var/log/messages.
    The OOM Killer algorithm, documented at /linux-mm.org/OOM_Killer, is designed
    to consider several factors to estimate what is an OOM score, which includes such
    things as trying to kill the minimum amount of processes (hopefully only one),
    recover a large amount of memory, and lose the minimum amount of work done.


    > An example of troubleshooting a case in which the SQL Server process was killed
    by the OOM Killer, see the article at https://blogs.msdn.microsoft.com/psql/2017/10/17/how-to-safeguard-sql-server-on-linux-from-killer/


    The best way to avoid the SQL Server process being killed by the Linux kernel
    is to configure the memory server properly, assigning the appropriate amount of
    memory for SQL Server, the operating system, and possibly any other process running
    on the same server. You can allocate the required amount of memory to SQL Server
    by using the mssql-config tool, as explained earlier in this chapter. In addition,
    properly configuring a swap file, as indicated earlier, can help. You can view
    the available memory for SQL Server in the error log at startup, as shown next:


    12/20/2017 5:12:16 AM Server Detected 6374 MB of RAM. This is an informational
    message; no user action is required.'
  merge: -1
