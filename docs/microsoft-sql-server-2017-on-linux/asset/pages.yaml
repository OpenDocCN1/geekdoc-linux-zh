    +   - VIRT Virtual memory size


    +   - RES Resident memory size


    +   - SHR Shared memory size


    +   - S Process status, which could be R (running), S (sleeping), T (stopped)
    by job control signal), t (stopped by the debugger during trace), Z (zombie),
    or D (uninterruptible sleep)


    +   - %CPU CPU usage


    +   - %MEM Memory usage


    +   - TIME CPU time


    +   - COMMAND Command or program name


    > NOTE

