    # Drawbridge


    Drawbridge was a Microsoft Research project that created a prototype of a new
    form of virtualization for application sandboxing based on a library OS version
    of Windows. Drawbridge was created to reduce the virtualization resource overhead
    drastically hosting multiple virtual machines in the same hardware, something
    similar to what Docker would later. Drawbridge was a 2011 project, while Docker
    was released as open source in March 2013. Drawbridge, according to Microsoft,
    was one of many research projects that provided valuable insights into container
    technology.


    In simple terms, Drawbridge took the Windows kernel to run it in user mode as
    process to create a high-density container that could run Windows applications.
    So it was basically taking the entire operating system, Windows, in user mode.
    The original intention was to use Drawbridge to host small applications in Windows
    Azure. At the same time, Microsoft starting running Drawbridge in other operating
    systems so they could use this technology as a container to run a Windows application
    on another platform. One of those platforms tested was Linux.


    # NOTE


    You can find more details about Drawbridge on the Microsoft Research page at www.microsoft.com/en-us/research/project/drawbridge.


    # Looking for a Shortcut


    It is interesting to learn how the decision was made to use Drawbridge. Drawbridge
    was used to run small Windows applications on an operating system called Midori.
    Midori is an operating system Slava Ok help to write, and during a specific project
    implementation, there was the requirement for Midori to run some Windows applications.
    Though Midori did not directly have such capability, Drawbridge was suggested
    as a possible solution. Within a few months, developers had the required Windows
    applications running in Midori using Drawbridge.


    Later, when confronted with the problem of running SQL Server on Linux, someone
    suggested using Drawbridge to run a Windows application as SQL Server on another
    platform, in this case, Linux. SQL Server is not a simple Windows application,
    so the idea originally was not taken seriously. However, Drawbridge was tested
    on a few operating systems, and it was learned that a member of the Drawbridge
    team, Andrew Baumann, already had a working prototype of Drawbridge on Linux partially
    and running.'
