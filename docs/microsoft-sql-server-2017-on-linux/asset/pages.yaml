    quality statistics. To do that, you need to specify a sample size or use the FULLSCAN
    to scan the entire table. A sample size can be specified as a number of rows or
    a percentage, and because the query optimizer has to scan all the rows on a data
    page, these values are approximate. Using FULLSCAN or a larger sample can be of
    benefit, especially with data that is not randomly distributed throughout the
    table. Scanning the entire table will naturally give you the most accurate statistics
    possible. Consider that if statistics are built after scanning 50 percent of a
    table, then SQL Server will assume that the 50 percent of data that it has not
    seen is exactly the same as the 50 percent it has seen. In fact, that statistics
    are always created alongside a new index, and given that this operation scans
