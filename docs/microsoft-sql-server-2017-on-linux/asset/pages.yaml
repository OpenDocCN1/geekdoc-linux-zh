    # Batch Mode Adaptive Memory Grant Feedback


    Although every query submitted to SQL Server requires some memory, sorting, and
    hashing operations require significantly larger amounts of memory, which, in some
    cases, can contribute to performance problems. The buffer cache, which keeps data
    in memory, is different from a memory grant, which is a part of the server'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Chapter 6: New Query Processing Features 183


    memory used to store temporary row data while a query is performing sort and hashing
    operations and is required only for the duration of the query. The memory grant
    is required to store the rows to be sorted or to build the hash tables used by
    hash join and aggregate operators. In rare cases, a memory grant may also be required
    for parallel query plans with multiple range scans.


    The memory required by a query is estimated by the query optimizer when the execution
    plan is assembled, and it is based on the estimated number of rows and the average
    row size in addition to the type of operation required, such as a sort, a hash
    join, or a hash aggregate. Although this process usually estimates the required
    memory, in some cases, some problem may occur:


    +   - A plan underestimating the required memory could lead to additional data
    processing or to the query operator to use the disk (spilling).


    +   - A system running multiple queries requiring sorting or hashing operations
    may not have enough memory available, requiring one or more queries to wait.


    In the first case, usually due to bad cardinality estimations, the query optimizer
    may have underestimated the amount of memory required for the query and, as a
    result, the sort data or the build input of the hash operations may not fit into
    such memory. In the second case, SQL Server estimated the minimum memory needed
    to run the query, called required memory, but since there is not enough memory
    in the system the query will have to wait until this memory is available. This
    problem is increased when, again due to a bad cardinality estimation, the amount
    of required memory is overestimated, leading to wasted memory and reduced concurrency.


    As mentioned, bad cardinality estimations may happen for several reasons, and
    there is no single solution that can work for all the possible statements. For
    example, some features such as table variables or multatement table-value functions
    have a fixed and very small cardinality estimate. In other cases, you may be able
    to fix the problem, improving the quality of the statistics, for example, by increasing
    the sample size.


    Batch mode adaptive memory grant feedback was designed to help with these situations
    by recalculating the memory required by a query and updating it in the cached
    query plan. The memory grant may get information from spill events or from the
    amount of memory really used. Although this improved memory estimate may not help
    the first execution of the query, it can be used to improve the performance of
    following executions. The batch mode adaptive memory grant process is in fact
    learning and getting feedback from real time information.


    Finally, the batch mode memory grant feedback may not be useful and will be automatically
    disabled if the query has a very unstable and high variation on memory requirements,
