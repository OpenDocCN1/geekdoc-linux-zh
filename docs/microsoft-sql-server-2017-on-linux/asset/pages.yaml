    # Summary


    This chapter covered the basics of high availability and disaster recovery for
    SQL Server on Linux. Although several features were discussed, the majority of
    the chapter focused on Always On groups.


    Availability groups on Windows and Linux can be used in high-availability and
    disaster-recovery configurations and for migrations and upgrades, or even to scale
    out readable copies of one or more databases.


    The difference between availability groups in Windows and Linux is that in Windows,
    the Windows Server Failover Cluster, is built into the operating system and SQL
    Server availability groups are cluster-aware. In Linux, availability groups depend
    on Pacemaker instead of WSFC. Because Linux does not provide a clustering solution
    out of the box, all three SQL Server-supported Linux distributions utilize their
    own version of Pacemaker. The SQL Server High Availability package, also known
    as the SQL Server resource agent for Pacemaker, is an optional package and must
    be installed for a high-availability solution in Linux.'
