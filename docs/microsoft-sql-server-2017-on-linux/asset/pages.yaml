  md: '# 236 Microsoft SQL Server 2017 on Linux


    However, at this moment, Red Hat Enterprise Linux does not provide fencing agents
    for any cloud environments, including Azure. So I will disable it for this exercise.


    # NOTE


    You should keep Stonith enabled on supported environments or for evaluation purposes.
    Microsoft is working on a solution for the environments not yet supported.


    For now, we can disable Stonith by running the following command, where the property
    command is used to manage the Pacemaker properties. The following command sets
    the stonith-enabled property to false on the cluster:


