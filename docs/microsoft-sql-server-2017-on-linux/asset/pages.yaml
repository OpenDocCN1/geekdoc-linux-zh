    why these considerations may be important and how they may affect the performance
    of your database:


    +   * If a clustered index is not defined using the UNIQUE clause, SQL Server
    will add a 4-byte uniquifier to each record, increasing the size of the clustered
    index key. As a comparison, an RID used by nonclustered indexes on heaps is only
    8 bytes long.'
