    # Configuring Pacemaker on Ubuntu


    Configuring Pacemaker on Ubuntu is very similar to the Red Hat Enterprise Linux
    configuration, so in this section I will cover all the required commands. You
    may want to refer to the preceding sections on Red Hat Linux for more details.
    Explanations will be summarized when they are similar to the instructions for
    Red Hat Enterprise Linux. Command output will not be included to save pages.


    Let''s start by creating the three or virtual machines with Ubuntu and SQL Server
    installed. If you are using Microsoft Azure, search "Ubuntu SQL Server 2017" to
    find the image name "Free SQL Server License: SQL Server 2017 Developer on Ubuntu
    Server 16.04 LTS." Follow Chapter 1 for more detailed instructions about how to
    create the virtual machine and configure it as indicated. The virtual machines
    sqlonux1, sqlonux2, and sqlonux3 will be a primary and secondary replicas.


    Open all the required firewall ports. As earlier, in addition to the TCP ports
    1433 and 5022 we need to open the Pacemaker firewall ports. In this case, we need
    to open the TCP ports 2224, 3121, and 21064 and the UDP port 5405. You can use
    the following command for the ports you need. ufw is a firewall configuration
    tool that is included with Ubuntu.


    ```

    sudo ufw allow 1433/tcp

    sudo ufw allow 5022/tcp

    sudo ufw allow 2224/tcp

    sudo ufw allow 3121/tcp

    sudo ufw allow 21064/tcp

    sudo ufw allow 5405/udp

    sudo ufw reload

    ```'
