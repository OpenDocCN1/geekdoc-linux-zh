    # Bash Shell


    As mentioned in Chapter 1, a shell is a user interface used to access operating
    system services, and in the case of Unix, most of you will use a shell as a command-line
    interface. It is called a shell because it is a layer around the operating system
    kernel. Most popular Unix shells used throughout the years include the Bourne,
    C, and Korn shells. Most Linux distributions use the Bourne-Again shell, or Bash,
    as is the case with Red Hat Enterprise Linux, Ubuntu, and SUSE Linux Server.'
  merge: -1
