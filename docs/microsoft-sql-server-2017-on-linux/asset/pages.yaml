    # query_hash and plan_hash


    Although the sys.dm_exec_query_stats DMV was a great resource, providing performance
    statistics for cached query plans when it was introduced in SQL Server 205, one
    of its limitations was that it was not easy to aggregate the information for the
    same query when was not parameterized. The query_hash and plan_hash columns, introduced
    with SQL Server 2008, provide a solution to this problem. To understand the problem,
    let''s look at an example of the behavior of sys.dm_exec_query_stats when a query
    is auto-parameterized:


    ```

    DBCC FREEPROCACHE

    DBCC DROPCLEANBUFFERS

    GO

    SELECT * FROM Person.Address

    WHERE AddressID = 12

    GO

    SELECT * FROM Person.Address

    WHERE AddressID = 37

    GO

    SELECT * FROM sys.dm_exec_query_stats

    ```


    Because in case AddressID is part of a unique index, the predicate AddressID =
    12 would always return a maximum of one record, but it is safe for the query optimizer
    to auto-parameter the query and use the same plan. Here is the output:


    | cql_handle | execution_count | query_hash | query_plan_hash |

    |---|---|---|-|

    | 0xD02000002D83010497EDC8369B50166B2F2000087B2D2 | 2 | 0xE4AAAA4470632D | 0x1C9E60B2F68F268BBC
    |

    8D1900000000000000000000000000000000 | | |'
