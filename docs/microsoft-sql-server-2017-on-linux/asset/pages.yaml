    be more than one generated execution plan for a particular query), the text of
    the batch will remain on the SQLMGR cache until the last of the generated plans
    is evicted from the cache. The plan_handle value is a hash value that refers to
    the execution plan the query is part of and can be used in the sys.dm_exec_query_plan
    DMF to retrieve such an execution plan. It is guaranteed to be unique for every
    batch in the system and will remain the same if one or more statements in the
    batch are recompiled. Here is an example:


    ```

