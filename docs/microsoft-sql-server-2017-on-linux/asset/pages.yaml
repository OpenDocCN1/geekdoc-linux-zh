  md: '# Chapter 7: High Availability and Disaster Recovery 24


    The second step requires that you remove the location constraint:


    ```

    $ sudo pcs resource clear ag-cluster-master

    $ sudo pcs constraint --full

    ```


    Finally, if you have a problem and cannot use the tools for any reason, such as
    when the cluster is not responding properly, you can still temporarily do a manual
    failover using T-SQL statements from within SQL Server. To perform this manual
    failover, you need to unmanage the availability group by Pacemaker, perform the
    manual failover using a T-SQL statement, and configure managing the availability
    group with Pacemaker.


    First, the unmanage option sets the listed resources to unmanaged mode. The cluster
    is not allowed to start or stop a resource when it is unmanaged mode:


    ```

    sudo pcs resource unmanage ag_cluster

    ```


    Next, run the following statements on the secondary replica SQL Server instance,
    sqlonlinux2. This statement sets a key-value pair in the session context; in this
    case, the session context variable external_cluster to ''yes''.


    ```

    EXEC sp_set_session_context @key = N''external_cluster'', @value = N''yes''

    ```


    Run the following statement to initiate a manual failover of the availability
    group to the secondary replica to which you are connected. You could run this,
    for example, connected to the sqlonlinux2 instance to make this instance the new
    replica:


    ```

    ALTER AVAILABILITY GROUP ag1 FAILOVER

    ```


    A manual failover is performed without data loss and requires a synchronouscommit
    secondary replica that is currently synchronized with the primary replica. In
    this case, sqlonlinux2 will take over the primary role and recover its copy of
    each database, bringing them online as the new primary databases. The former replica,
    sqlonlinux1, concurrently transitions to the secondary role. A manual failover
    to sqlonlinux2 is shown in Figure 7-13.


    Finally, let''s get back to enabling Pacemaker. The following commands set the
    listed resources back to managed:


    ```

    sudo pcs resource manage ag_cluster

    ```


    Finally, the cleanup option makes the cluster forget the operation history of
    the resource and re-detect its current state:


    ```

    sudo pcs resource cleanup ag_cluster

    ```'
