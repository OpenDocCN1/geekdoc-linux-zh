  md: '# Summary


    Even if you are an expert SQL Server user and have worked with the technology
    for years, you may think that this database engine has always been a Windows-exclusive
    technology. SQL Server in fact started as a multiplatform technology, and its
    roots actually go back to an operating system called OS/2 and even back to Unix.
    To understand how SQL Server came to the Linux platform and Docker containers,
    this chapter covered some historic perspectives that mirrored some of the same
    challenges that were faced today.


    SQLOS was created as a platform layer designed to exploit new hardware capabilities
    and provide database engine-specialized services, but it was never designed to
    provide platform independence or portability to other operating systems. SQLOS
    was used again, however, for the Linux release.


    When working on the SQL Server on Linux project, the team considered a code port,
    but since this would be an enormous project that would take years to complete,
    other solutions were considered, including using the Microsoft Research project
    Drawbridge. Drawbridge and SQLOS were used on the final release of SQL Server
    on Linux implementation.'
