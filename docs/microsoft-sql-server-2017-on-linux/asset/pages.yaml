    # Using Variables


    Another way to change SQL Server configuration settings is to use variables. Following
    are the current variables available as defined in the SQL Server documentation:


    +   - ACCEPT_EULA Accept the SQL Server license agreement when set to any value
    (for example, y).


    +   - MSSQL_SA_PASSWORD Configure the SA user password.


    +   - MSSQL_PID Set the SQL Server edition or product key. Possible values include
    Evaluation, Developer, Express, Web, Standard, and Enterprise. You also specify
    a product key, which must be in the form of #### #### ####-###### ###### ######,
    where # is a number or letter.


    +   - MSSQL_LCID Set the language ID to use for SQL Server. For example, 1036
    is French.


    +   - MSSQL_COLLATION Set the default collation for SQL Server. This overrides
    the default mapping of language id (LCID) to collation.


    +   - MSSQL_MEMORY_LIMIT_MB Set the maximum amount of memory (in MB) that SQL
    Server can use. By default it is 80 percent of the total physical memory.


    +   - MSSQL_TCP_PORT Configure the TCP port that SQL Server listens on (default
    1433).


    +   - MSSQL_IP_ADDRESS Set the IP address. Currently, the IP address must be IPv4
    style (0.0.0.0).


    +   - MSSQL_BACKUP_DIR Set the default backup directory location.


    +   - MSSQL_DATA_DIR Change the directory where the new SQL Server database files
    (.mdf) are created.


    +   - MSSQL_LOG_DIR Change the directory where the new SQL Server database log
    (.ldf) files are created.'
