    affinity mask configuration option, which is now deprecated, or the ALTER SERVER
    CONFIGURATION SET PROCESS affinity statement, called earlier, must allow the use
    of multiple processors, which both do by default. Finally, the query processor
    must decide whether using parallelism in fact improve the performance of a query,
    based on its estimated cost.


    When a SQL Server installation is using the default max degree of parallelism
    value, which is 0, the database engine can decide at runtime the number of logical
    processors in a plan, up to a maximum of 64. Obviously, this does not mean that
    every parallel query would use the maximum number of processors all the time.
    For, even if your system has 64 logical processors and you are using the default
    configuration, it is still very possible that a query use 8 processors and run
    with eight threads. This is a decision the query processor makes at execution
    time.


    Microsoft published an article recommending a value for the max degree of parallelism
    option to be the same as the number of logical processors in the server, up to
    a maximum of eight. You can read the article at https://support.microsoft.com/en-us/kb/2806535.
    Because it is very common to have eight processors or more nowadays, a value of
    eight is a common configuration.


    Keep in mind that the listed recommendation is just a guideline, and the article
    specifies that the guideline is applicable for typical SQL Server activity. In
    addition, depending on your workload or application patterns, other values for
    this setting may be considered and thoroughly tested as well. As example, if SQL
    Server installation has 16 logical processors and a workload with a small number
    of queries running at the same time, a max degree of parallelism of 16 could be
    your best choice. On the other hand, for a workload with a large number of queries,
    a value of 4 could be considered as well.


    # Cost Threshold for Parallelism


    As mentioned in the previous section, parallelism is considered only for expensive
    queries, which are defined by another configuration option, the cost threshold
    for parallelism. The cost threshold for parallelism configuration option defines
    the threshold at which SQL Server considers parallel plans during the query optimization
    process.


    The cost threshold for parallelism, whose default value is 5, means that parallelism
    would be considered by the query optimizer only if an initially created serial
    plan has the cost of five or more cost units. Although it is very likely that
    a parallel plan will be selected, when it does, this does not mean it will be
    the case. For example, it is totally possible that the query optimizer initially
    estimates a cost of 6 for a serial plan, decides to inspect a parallel choice,
    and after finding a parallel plan of 6.3, decides to'
