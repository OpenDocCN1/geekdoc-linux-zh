    # Software Management


    Chapter 1 gave you a quick introduction to package managers to provide basic information
    on how to install SQL Server. A package managing system is a collection of utilities
    used to install, upgrade, and remove packages or distributions of software or
    to query information about available packages. There are several package management
    systems, and the chapter briefly covered some package management utilities such
    as yum, apt, and zypper, which we used with Red Hat Enterprise Linux, Ubuntu,
    and SUSE Enterprise Server, respectively. This section covers yum in more detail.
    You can easily find similar choices in the documentation for the apt or zypper
    utilities.


    The RPM Package Manager (RPM) is a packaging system used by several Linux distributions,
    including Red Hat Enterprise Linux. The yum package manager is written in Python
    and is designed to work with packages using the RPM format. Yum requires superuser
    privileges to install, update, or remove packages.


    In Chapter 1, we used yum to install the SQL Server package mssql-server by running
    the following command:


    ```

    yum install -y mssql-server

    ```


    Let''s continue with additional topics, starting with updating packages. During
    the SQL Server deployment process, it was common to upgrade to new CTP or RC packages.
    You could check which installed packages has updates available by running the
    command


    ```

    yum check-update

    ```


    # NOTE


    CTPs (Community Technology Previews) and RCs (Release Candidates) are versions
    of SQL Server used during the beta program before the final software was released.
    The final release, which is the only version that can be used in a production
    environment, is the RTM (release to manufacturing) version.'
