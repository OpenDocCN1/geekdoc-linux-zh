    # Parsing and Binding


    Parsing and binding are the first operations performed when a query is submitted
    to a SQL Server instance. Parsing makes sure that the T-SQL query has a valid
    syntax, and it translates the SQL query into an initial tree representation: specifically,
    a tree of logical operators representing the high-level steps to execute the query
    in question. Initially, these logical operators will be closely related to the
    original syntax'
