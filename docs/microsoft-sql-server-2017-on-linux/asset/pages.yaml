  md: '# Microsoft SQL Server 2017 on Linux


    You can request an actual or an estimated execution plan for a given query, and
    either of these two types can be displayed as a graphic, text, or XML plan. Any
    of these formats shows the same execution plan—the only differences are in how
    they are displayed and the levels of detailed information they contain.


    When an estimated plan is requested, the query is not executed; and the plan displayed
    is simply the plan that SQL Server would probably use if the query were executed
    (bearing in mind that a recompile might generate a different plan at a later time).


    However, when an actual plan is requested, the query needs to be executed, and
    the plan is then displayed along the query results. Nevertheless, using an estimated
    plan has several benefits, including displaying a plan for a long-running query
    for inspection without actually running the query, or displaying a plan for update
    operations without changing the database.


