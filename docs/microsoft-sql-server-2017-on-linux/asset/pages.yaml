    Cardinality) | N/A |

    | DISABLE_OPTIMIZER_ROWGOAL | 4138 | N/A |

    | ENABLE_HIST_AMENDMENT_FOR_ASC_KEYS | 4139 | N/A |

    | ASSUME_JOIN_PREDICATE_DEPENDS_ON_FILTERS | 9476 (New Cardinality) | N/A |

    | FORCE_DEFAULT_CARDINALITY_ESTIMATION | 2312 | N/A |


    Table 6-1 Hint Names


    +   * ASSUME_MIN_SELECTIVITY_FOR_FILTER_ESTIMATES Creates execution plans using
    minimum selectivity when estimating AND predicates for filters to account for
    correlation.


    +   * ASSUME_JOIN_PREDICATE_DEPENDS_ON_FILTERS Creates execution plans using the
    simple containment assumption instead of the default base containment assumption
    for joins on the old cardinality estimator.


    +   * ENABLE_HIST_AMENDMENT_FOR_ASC_KEYS Enables generated quick statistics for
    any leading index column for which a cardinality estimation is needed.


    +   * DISABLE_OPTIMIZER_ROWGOAL Creates execution plans that do not use row adjustments
    with queries that contain TOP, IN, EXISTS, OR OPTION (FAST N) keywords.


    +   * FORCE_DEFAULT_CARDINALITY_ESTIMATION Enables the new cardinality estimator
    where the database is configured to use the old cardinality estimator.


    Let''s take a look at a couple of examples. First of all, run the following query
    not as a system administrator:


    ```

    SELECT * FROM Sales.SalesOrderDetail Where ProductID = 898

    OPTION (QUERYTRACEON 9481)

