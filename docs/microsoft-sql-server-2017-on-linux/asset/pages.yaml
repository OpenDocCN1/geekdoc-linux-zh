    # Services Management


    As introduced in Chapter 1, systemd is an init, or initialization system, used
    in Linux distributions to manage system processes that will run as daemons until
    the system is shut down. systemd has several utilities, such as systemctl, which
    you can use to start, restart, stop a service or to show runtime information.


    Chapter 1 also covered the basics of systemctl, including how to start, stop,
    and restart a service using the following syntax:


    ```

    systemctl start name-service

    systemctl stop name-service

    systemctl restart name-service

    ```


    More specifically, the chapter covered the following commands:


    +   - Stop SQL Server sudo systemctl stop mssql-server

    - Start SQL Server sudo systemctl start mssql-server

    - Restart SQL Server sudo systemctl restart mssql-server'
