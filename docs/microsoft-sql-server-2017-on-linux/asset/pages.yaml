  md: '# When to use Hints


    Hints are a powerful means by which we can cause our decisions to override those
    of the query optimizer. However, you should do so with extreme caution, because
    hints restrict the choices available to the query optimizer. They also make your
    code less flexible and will require additional maintenance. A hint should be employed
    only once you''re certain you have no alternative options. At a minimum, before
    you reach for a hint, you should explore these potential issues:


    +   - System problems Make your performance problem is not linked to other related
    issues, such as blocking or bottlenecks in server resources such as I/O, memory,
    and CPU.


    +   - Cardinality estimation errors The query optimizer often misses the correct
    plan because of cardinality estimation errors. Cardinality estimation errors can
    sometimes be fixed by solutions such as updating statistics, using a bigger sample
    for your statistics (or scanning the entire); using computed columns, multicolumn
    statistics, or filtered statistics; and so on. There may be cases where the cardinality
    estimation errors are caused by the use of features in which statistics are not
    supported at all, such as table variables and multistatement user-defined functions.
    In these particular instances, you may consider using standard or temporary tables
    if you are not getting an efficient plan.


    +   - Additional troubleshooting You may need to perform additional troubleshooting
    before considering the use of hints. One of the obvious choices for improving
    the performance of your queries is providing the query optimizer with the right
    indexes. You might also consider some other, less obvious, troubleshooting procedures;
    as breaking your query down into steps or smaller pieces and storing any intermediate
    results in temporary tables, as shown earlier in this chapter. You can use this
    method as a troubleshooting procedure—example, to find which part of the original
    query is expensive so you can focus on it. Alternatively, you can keep it as the
    final version of your query if these changes allow you better performance.


    Query optimizers have improved radically after more than 30 years of research,
    but they still face some technical challenges. The SQL Server query optimizer
    will give you an efficient execution plan for most of your queries, but it will
    be increasingly challenged as the complexity of the query grows with more tables
    joined, plus the use of aggregations and other SQL features. If, after investigating
    the troubleshooting options and recommendations described previously, you still
    determine that the query optimizer'
