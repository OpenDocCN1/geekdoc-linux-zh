  md: 'The rest of this chapter provides an overview of Transparent Data Encryption,
    Always Encrypted, Row-Level Security, and Dynamic Data Masking features. For more
    information about these and other security features, refer to the SQL Server documentation.


    # Transparent Data Encryption


    Transparent Data Encryption, also known as encryption at rest, protects the database
    data and transaction log files against unauthorized access to the physical media.
    When a database is configured for TDE, even accessing copies of the database files
    or database backups will not provide access to its data. TDE works by performing
    real-time I/O encryption at the page level, which means that pages are encrypted
    before they are written to disk and decrypted when the pages are read from memory.
    Note that this data is not encrypted in memory, and it is not encrypted across
    other communication channels.


    Although this means that unauthorized parties will not be able to restore your
    database when enabling TDE, it also means that you will need the certificate and
    private key associated with the certificate for the TDE configuration to do so,
    you should immediately back them up. You will need them if you ever want to attach
    or restore the database on a different SQL Server instance. An example of how
    to do that is shown later in the section "Attach or Restore a TDE Database to
    Another SQL Server Instance."


    The tempdb database will also be encrypted if there is at least one encrypted
    database in the SQL Server instance. This would help to encrypt performance of
    databases that are not encrypted. If a database is being used in database mirroring,
    log shipping, or availability group configurations, all the related databases—mirror,
    secondary, or replica—will be encrypted as well.


    Let''s work on an example to show how TDE works. First we need to create a master
    key and a certificate, similar to what we did did in Chapter 7, where we used
    a certificate to authenticate communication between the mirroring endpoints for
    availability group configuration.


    ```

    USE master;

    GO

    CREATE MASTER KEY ENCRYPTION BY PASSWORD = ''Pa$$ssword1!'';

    GO

    CREATE CERTIFICATE MyCertificate WITH SUBJECT = ''My Certificate'';

    GO

    ```'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Chapter 8: Security 25


    The database master key is a symmetric key used to protect the private keys of
    certificates and asymmetric keys that are present in the database. The CREATE
    CERTIFICATE statement adds a certificate to a database in SQL Server. The CREATE
    DATABASE ENCRYPTION KEY statement can now be used to create a database encryption
    key and protect it by the certificate. Running the following statement:


    ```

    USE AdventureWorks2012

    GO

    CREATE DATABASE ENCRYPTION KEY

    WITH ALGORITHM = AES_128

    ENCRYPTION BY SERVER CERTIFICATE MyCertificate;

    GO

    ```


    Notice the following warning about backing up the certificate and private key
    associated with the certificate:


    > Warning: The certificate used for encrypting the database encryption key has
    not been backed up. You should immediately back up the certificate and the private
    key associated with the certificate. If the certificate becomes unavailable or
    if you must restore or attach the database on another server, you must have backups
    of both the certificate and the private key you or will not be able to open the
    database.


    So let us follow that recommendation and back up the certificate and the private
    key associated with the certificate:


    ```

    USE master

    GO

    BACKUP CERTIFICATE MyCertificate

    TO FILE = ''MyCertificate''

    WITH PRIVATE KEY

    (

    FILE = ''SQLPrivateKeyFile'',

    ENCRYPTION BY PASSWORD = ''Pa$$ssword!''

    GO

    ```


    The BACKUP CERTIFICATE statement is used to export both the certificate and the
    private key associated with the certificate to files. In our case, the certificate
    will be saved in /var/opt/mssql/data/MyCertificate and the private key associated
    with the certificate will be exported to /var/opt/mssql/data/SQLPrivateKeyFile.
    If you are using the Windows platform, both will be saved in the C:\Program Files\Microsoft
    SQL Server\MSSQL14.MSSQLSERVER\MSSQL\DATA folder.'
  merge: -1
