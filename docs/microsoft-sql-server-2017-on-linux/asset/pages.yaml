    # Finding Expensive Queries


    Let''s now apply some of the concepts explained in this section and use the sys.dm_exec_query_stats
    DMV to find the most expensive queries in your system. A typical query to find
    the most expensive queries on the plan cache based on CPU is shown next. Notice
    that the query is grouping on the query_hash value to aggregate similar queries,
    regardless of whether or not they are parameterized.


    ```

    SELECT TOP 20 query_stats.query_hash,

    SUM(query_stats.total_worker_time) / SUM(query_stats.execution_count) AS avg_cpu_time,

    MIN(query_stats.statement_text) AS statement_text

    FROM

    (SELECT qs.*,

    SUBSTRING(st.text, (qs.statement_start_offset/2) + 1,

    ((CASE WHEN st.end_offset

    WHEN -1 THEN DATALENGTH(st.text)

    ELSE st.end_offset END

    - qs.statement_start_offset/2) + 1) AS statement_text

    FROM sys.dm_exec_query_stats qs

    CROSS APPLY sys.dm_exec_sql_text(qs.sql_handle) AS st)

    AS query_stats

    GROUP BY query_stats.query_hash

    ORDER BY avg_cpu_time DESC

    ```


    You may also notice that each returned row represents a query in a batch (for
    example, a batch with five queries would have five records on the sys.dm_exec_query_stats
    DMV, as explained earlier). We could trim the previous query into something like
    the following query to focus at the batch and plan level index. Notice that there
    is no need to use the statement_start_offset and statement_end_offset columns
    to separate the particular queries and that this we are grouping on the query_plan_hash
    value (as opposed to the query_hash value).


    ```

    SELECT TOP 20 query_plan_hash,

    SUM(total_worker_time) / SUM(execution_count) AS avg_cpu_time,

    MIN(plan_handle) AS plan_handle, MIN(text) AS query_text

    FROM sys.dm_exec_query_stats qs

    CROSS APPLY sys.dm_exec_sql_text(qs.plan_handle) AS st

    GROUP BY query_plan_hash

    ORDER BY avg_cpu_time DESC

    ```'
