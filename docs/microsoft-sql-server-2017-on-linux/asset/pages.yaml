- img_proc: true
  md: '# Microsoft SQL Server 2017 on Linux


    Unix and Linux sometimes have a GUI similar to that of Windows. However, there
    has never been a standard, and those interfaces could differ greatly from one
    Unix or Linux distribution to another. Learning such GUIs could be useful, using
    command-line commands and scripts is essential for working with Linux.


    Let’s discuss some basics about working with a Linux shell. The SHELL variable
    will return the full pathname to the current shell:


    ```

    $ echo SHELL

    /bin/bash

    ```


    Similar to Windows, you can use wildcards in Linux. It is possible to the asterisk
    (*) to represent zero or more characters and the question mark symbol (?) to represent
    a single character. You can also use brackets ([ ]) to include any number between
    “0” and “9” or any letter between “a” and “e”, respectively. As an example—example
    [0-9] and [a-e], assuming that you create the following four files, the ls command
    will list anything with “b” or “c” plus “123”:


    ```

    $ touch a123; touch b123; touch c123; touch d123

    ls [bc]123

    ```


    # NOTE


    As you noticed from the first line, you can submit multiple commands in the same
    line if they are separated by a semicolon.


    Although Unix commands are provided as executable files on the file system, some
    be provided by the shell as well. In some cases, the same command could be provided
    by both. For example, the pwd command could be provided by the shell or by the
    operating system as an executable file. Usually the shell version supersedes the
    latter. Consider the following:


    ```

    $ pwd --version

    bash: pwd: invalid option

    pwd: usage: pwd [-LP]

    ```


    This shows the shell version, which complains that only the choices -L and -P
    are allowed.'
