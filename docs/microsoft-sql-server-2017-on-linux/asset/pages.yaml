    # Creating Indexes


    Let''s start this with a summary of some basic terminology used in indexes:


    +   * Heap A is a data structure where rows are stored without a specified order.
    In other words, it is a table without a clustered index.


    +   * Clustered index In SQL Server, you can have the entire table logically sorted
    by a specific key in which the bottom, leaf level, of the index contains the actual
    rows of the table. Because of this, only clustered index per table is possible.
    The data pages in the leaf level are linked in a doubly linked list (that is,
    each page has a pointer to the previous and next pages). Both clustered and nonclustered
    indexes are organized by B-trees.


    +   * Nonclustered index A nonclustered index contains the index key values and
    a pointer to the base table. Nonclustered indexes can be created on both heaps
    and clustered indexes. Each table can have up to 999 nonclustered indexes, but
    usually, you should keep this number to a minimum. A nonclustered index can optionally
    contain nonempty columns when using the INCLUDE clause, which are particularly
    useful when covering a query.


    +   * Unique index As the name suggests, a unique index does not allow two rows
    of data to have identical key values. A table can have one or more unique indexes,
    although it is not very common. By default, unique indexes are created as nonclustered
    indexes unless you specify otherwise.


    +   * Primary key A primary key uniquely identifies each record in the table and
    creates a unique index, which, by default, will also be a clustered index. In
    addition to the uniqueness property required for the unique index, its key columns
    are required to be defined as NOT NULL. By definition, only one primary key can
    be defined on a table.'
