  md: '# Chapter 3: Linux for the SQL Server Professional


    # Permissions


    Use root or superuser permissions only when performing system administration activities
    and as minimally as possible. As expected, making mistakes as the root user can
    create catastrophic failures, especially on a production system. The sudo command
    enables a permitted user to execute a command as either the superuser or another
    user, according to the defined security policy. Multiple examples using sudo to
    execute a command as superuser were provided in Chapter 1, where I covered the
    installation and configuration of SQL Server. Here''s one example used in that
    chapter:


    ```

    $ /opt/mssql/bin/mssql-conf setup

    [sudo] password for binevarez:

    ```


    You could also switch to superuser using the sudo command, as shown next:


    ```

    $ sudo su

    [sudo] password for binevarez:

    #

    ```


    The root prompt is #. When you''re finished executing the administrative tasks,
    execute exit or press CTRL-D.


    Now let''s cover file permissions. We''ll start with the default permissions for
    creating a file. Run the following statements:


    ```

    $ touch file3

    $ ls -l

    total 0

    -rw-r--r-- -- 1 binevarez binevarez 0 Aug 24 06:26 file3

    ```


    The default permissions in Linux are defined by a permissions mask called umask,
    which can also be changed to anything you need. Permissions are r (read), w (write),
    and x (execute), and they correspond to the owner, group, and other (meaning anyone
    else is not the owner or is not in the group).


    The first character is the file type and usually is a dash (-) for a regular file
    or d for a directory. As introduced earlier with the find command, there are also
    special file types that use b for block file, c for character, p for named pipe,
    l for a symbolic link, and s for a socket.'
