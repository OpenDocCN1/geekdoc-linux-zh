    # sys.dm_exec_query_stats


    If you worked with any version of SQL Server prior to SQL Server 2005, you may
    remember how difficult it was to determine the most expensive queries in your
    instance. Performing that kind of analysis would usually require running a server
    trace in your instance for a period of time and then analyzing the collected data,
    in the size of gigabytes, using third-party tools or your own created methods;
    this was a timeconsuming process. Not to mention the fact that running such a
    trace could also affect the performance of a system, which most likely is having
    a performance problem already.


    As mentioned, DMVs were introduced with SQL Server 2005 and are a great help to
    diagnose problems, tune performance, and monitor the health of a server instance.
    In particular, sys.dm_exec_query_stats provides a rich amount of information not
    previously available in SQL Server regarding aggregated statistics for cached
    query plans. This information helps you regard each statement available in the
    plan cache, and SQL Server 2008 added enhancements such as the query hash and
    plan hash values, which will be explained soon.


    Let''s take a quick look at understanding how sys.dm_exec_query_stats works and
    the information it provides. Create the following stored procedure with three
    simple queries:


    ```

    CREATE PROCEDURE test

    AS

    SELECT * FROM Sales.SalesOrderDetail WHERE SalesOrderID = 60677

    SELECT * FROM Person.Address WHERE AddressID = 21

    SELECT * FROM HumanResources.Employee WHERE BusinessEntityID = 229

    ```'
