  md: '# Chapter 2: How SQL Server on Linux


    SQL Server will also detect and work with the then-new NUMA systems. SQL Server
    2000 Service Pack 4 included limited support for NUMA systems. Full NUMA support
    was added when SQL was released with SQL Server 2005. Software NUMA is automatically
    configured with SQL Server 2014 Service Pack 4 and SQL Server 2016 (some support
    was also possible before but required manually editing the Windows registry).
    Starting with these versions of the database engine, whenever SQL Server detects
    more than physical cores per NUMA node or socket at startup, software NUMA nodes
    will be created automatically by default.


    SQLOS was never intended to be a platform-independent solution, but rather a way
    to provide purpose-operating system services to the database engine for performance
    and scalability with the SQL Server 2017 release.


    # NOTE


    For more details about SQLOS, read the "A New Platform Layer in SQL Server 2005
    to Exploit New Hardware Capabilities and Their Trends" by Slava Oka, at https://blogs.msdn.microsoft.com/slavao/2005/07/20/platform-layer-for-sql-server/.
    In addition, the paper "Operating System Support for Database Management," Michael
    Stonebreaker examines whether several operating systems are appropriate for support
    of database management functions such as scheduling, process management, interprocess
    communication, buffer pool management, consistency control, and file system services.
    You can use your favorite search engine to find this research paper online.


    # The Industry Changes


    In March 2016 at the Data Driven event in New York, Microsoft surprised the entire
    technology community by announcing that SQL Server would be released on the Linux
    platform. In November of that, at the Microsoft Connect event in the same city,
    it announced that the first bits of the technology, the first CTP of the then-named
    SQL Server vNext, was available for download. At the same event, the Linux Foundation,
    a nonprofit organization advancing open-source software management for mass collaboration,
    announced that Microsoft had joined the organization as a platinum member.


    The SQL Server on Linux announcement mentioned that this release would include
    almost all the features of SQL Server for Windows. Among the features not included
    for this release were transactional replication, merge replication, Stretch DB,
    Polybase, distributed query with third-party connections, extended stored procedures,
    file tables, CLR assemblies with the EXTERNAL_ACCESS or UNSAFE permission set,
