  md: '# Chapter S: SQL Server Query Tuning and Optimization


    Dynamic management views (DMVs) and dynamic management functions (DMFs) were introduced
    with SQL 2005 as great tools to diagnose problems, tune performance, and monitor
    the health of a server instance. Many DMVs are available, and in this section
    I will focus on sys.dm_exec_requests, sys.dm_exec_sessions, and sys.dm_exec_query_stats,
    which you can use to determine the server resources, such as CPU and I/O, by queries
    running on the system. They can also be used to find the most expensive queries
    in your SQL Server instance.


    In addition, SQL Server 2016, the query store is an amazing performance feature
    that can help you collect historical query and plan information along with their
    runtime statistics, which you can use to identify query-performance-related problems
    and even force an execution plan.


    I will close this section with the SET STATISTICS TIME and SET STATISTICS statements,
    which can provide additional performance information about your queries.


    # sys.dm_exec_requests and sys.dm_exec_sessions


    The sys.dm_exec_requests DMV can be used to display the requests currently executing
    on SQL Server, whereas sys.dm_exec_sessions shows the authenticated sessions on
    the instance. Although these DMVs include many columns, in this section, we will
    focus on the ones related to resource usage and query performance. You can look
    at the definitions of the other columns in the SQL Server documentation. Both
    DMVs share several columns, which are defined next:


    +   - **cpu_time** CPU time in milliseconds used by this request or by the requests
    in this session


    +   - **elapsed_time** Elapsed time in milliseconds since the request arrived
    or the session was established


    +   - **reads** Number of reads performed by this request or by the requests in
    this session


    +   - **writes** Number of writes performed by this request or by the requests
    in this session


    +   - **logical_reads** Number of logical reads performed by this request or by
    the requests in this session


    +   - **row_count** Number of rows returned to the client by this request


    Basically, sys.dm_exec_requests will show the resources used by a specific request
    currently executing, whereas sys.dm_exec_sessions will show the accumulated resources
    of all the requests completed by a session. To understand how these two DMVs collect
    resources usage information, we can run the following exercise, using a query
    that takes at least a few seconds. Open a new query in Management Studio and get
    its session ID (for example, using SELECT %SPID), but make sure you don''t run
    anything,'
