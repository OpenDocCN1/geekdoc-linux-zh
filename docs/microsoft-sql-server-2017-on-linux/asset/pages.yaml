    # Query Execution and Plan Caching


    Once the query is optimized, the resulting plan is used by the query engine to
    retrieve the desired data. The generated execution plan may be stored in memory
    in the plan cache so it can be reused if the query is executed again. SQL Server
    has a pool of memory that is used to store both data pages and execution plans.
    Most of this memory is used to store database pages, and it is called the buffer
    pool. A portion of this memory contains the execution plans for queries that were
    optimized by the query optimizer and is referred to as the plan cache (and previously
    known as the procedure cache). The percentage of memory allocated to the plan
    cache or the buffer pool varies dynamically, depending on the state of the system.


    Before optimizing a query, SQL Server first checks the plan cache to see if an
    execution plan exists for it. Query optimization is a relatively expensive operation,
    so if a valid plan is available in the plan cache, the optimization process can
    be skipped and the associated cost of this step, in terms of optimization time,
    CPU resources, and so, can be avoided. If a plan for the batch is not found, the
    batch is compiled to generate an execution plan for all queries in the stored
    procedure, the trigger, or the dynamic SQL batch. Query optimization begins by
    loading all the interesting statistics. Then the query optimizer validates whether
    the statistics are outdated. For any outdated statistics, using the statistics
    default options, it will update the statistics and proceed with the optimization.


    After a plan is in the plan cache or a new one is created, the plan is validated
    for schema and data statistics changes. Schema changes are verified for plan correctness.
    Statistics are also verified: the query optimizer checks for new applicable or
    outdated statistics. If the plan is not valid for any of these reasons, it is
    discarded and the batch or individual query is recompiled. Such compilations are
    known as recombinations. This process is summarized in Figure 5-2.


    Plans may also be removed from the plan cache when SQL Server is under memory
    pressure or when certain statements are executed. Changing some configuration
    options (for example, max degree of parallelism) will clear the entire plan cache.
    Alternatively, some statements, such as altering a database with certain ALTER
    DATABASE options, will clear all the plans associated with that database.


