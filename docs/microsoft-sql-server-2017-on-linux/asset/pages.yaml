  md: "# Microsoft SQL Server 2017 on Linux\n\nWe are finally ready to create the\
    \ database mirroring endpoints on all the servers. Database mirroring endpoints\
    \ are still used in the availability groups terminology, although database mirroring\
    \ is a separate feature that is also already deprecated. Database mirroring requires\
    \ a TCP port, so, once again, we need to open TCP ports on each virtual machine,\
    \ which can be the default 5022 or any other port of your choice.\n\nOpen the\
    \ port for the Microsoft Azure Portal for each virtual machine, as indicated earlier\
    \ when we opened TCP port 1433, and in the Inbound Port Rules section on the right,\
    \ select Add Inbound. This time, there is no predefined service, so just select\
    \ Custom and specify with Port ranges—in this case, 5022—and a Default Name—in\
    \ this case_5022. You may also need to change the Priority, for example, to 1020.\
    \ Priority configures the order in which rules are being processed.\n\nRun the\
    \ firewall-cmd command, but this is for TCP port 5022. This is required for Red\
    \ Hat Enterprise Linux and is not needed for Ubuntu and SUSE Linux Server.\n\n\
    ```\n$ sudo firewall-cmd --zone=public --add-port=5022/tcp --permanent\n$ sudo\
    \ firewall-cmd --reload\n```\n\nWe are ready to run the CREATE ENDPOINT statement.\
    \ The ROLE option of the statement defines the database mirroring role or roles\
    \ that the endpoint supports and can be WITNESS, PARTNER, or ALL. As mentioned\
    \ earlier, SQL Express now can be used to host a configuration-replica, which\
    \ supports only the WITNESS role.\n\nAlso, using a certificate is the only authentication\
    \ method available on SQL 2017 on Linux. Windows authentication will be supported\
    \ in a future release. The example statement also specifies that connections to\
    \ this endpoint must use encryption using the AES algorithm, which is the default\
    \ in SQL Server 2016 and later. No listener IP address will be defined for this\
    \ exercise.\n\nFinally, for each replica instance, create the new endpoint, start\
    \ it, and grant connect permissions to it for the SQL Server login created earlier:\n\
    \n```\nCREATE ENDPOINT [ag_endpoint]\nAS TCP (LISTENER_IP = (0.0.0.0), LISTENER_PORT\
    \ = 5022)\nFOR DATA_MIRRORING (\n  ROLE = ALL,\n  AUTHENTICATION = CERTIFICATE\
    \ ag_certificate,\n  ENCRYPTION = REQUIRED ALGORITHM AES\n);\nALTER ENDPOINT [ag_endpoint]\
    \ STATE = STARTED;\nGRANT CONNECT ON ENDPOINT::[ag_endpoint] TO [ag_login];\n\
    ```"
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 7: High Availability and Disaster Recovery 215


    Next we will create the availability group on the primary replica, sqlonlinux1.
    The CREATE AVAILABILITY GROUP statement has a large variety of options. The following
    statement specifies several items. DB_FAILOVER with a value of ON specifies that
    any status other than ONLINE for a database in the availability group triggers
    an automatic failover. If the choice were OFF it means that only the health of
    the instance is used to trigger automatic failover.


    CLUSTER_TYPE, which is new to SQL Server 2017, defines the cluster type, and the
    values can be WSFC, EXTERNAL, and NONE. WSFC is used to configure availability
    groups on Windows using WSFC. EXTERNAL is used on Linux when using an external
    cluster manager such as Pacemaker. NONE is used when no cluster manager is used.
    This last choice can be useful for availability group configurations to be used
    as read-only replicas for migrations or upgrades. On a SQL Server instance on
    Linux, you will only see the EXTERNAL and NONE choices.


    AVAILABILITY_MODE defines whether the primary replica should wait for the secondary
    replica to acknowledge the writing of log records before the primary replica can
    commit a transaction on a database, defined by the values ASYNCHRONOUS_COMMIT
    and SYNCHRONOUS_COMMIT. A third choice, new to SQL Server 2007 CU1, CONFIGURATION_ONLY,
    defines a configuration-only replica or replica that is used for availability
    group configuration metadata. CONFIGURATION_ONLY can be used on any edition of
    SQL Server and does not apply for CLUSTER_TYPE as WSFC. It is mainly used as a
    witness in Linux environments where a file share is not supported.


    FAILOVER_MODE defines the failover mode, which could be AUTOMATIC, MANUAL, or
    EXTERNAL. It is always EXTERNAL for Linux installations.


    SEEDING_MODE defines how the secondary replica is initially seeded and can have
    the options AUTOMATIC or MANUAL. ENDPOINT_URL uses the path for the database mirroring
    endpoint on the instance of SQL Server that hosts the availability replica. As
    you can see in the following example, ENDPOINT_URL requires a system name, a fully
    qualified domain name, or an IP address that unambiguously identifies the destination
    computer system and the port number that is associated with the mirroring endpoint
    of the partner server instance.


    The following statement creates an availability group with three synchronous replicas.
    Replace the server, fully qualified domain name, and with your own information.
    For simplicity, only the server name is used—in your case, add the fully qualified
    domain name as well.


    ```

    USE master

    GO

    CREATE AVAILABILITY GROUP agl1

    WITH (DB_FAILOVER = ON, CLUSTER_TYPE = EXTERNAL)

    FOR REPLICA ON

    ```'
  merge: -1
  pgno: 234
- img_proc: true
  md: "# Microsoft SQL Server 2017 on Linux\n\n```\nN'sqlonlinux1'\nWITH (\n  ENDPOINT_URL\
    \ = Ntcp://sqlonlinux1:5022,\n  AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n  FAILOVER_MODE\
    \ = EXTERNAL,\n  SEEDING_MODE = AUTOMATIC\n)\nN'sqlonlinux2'\nWITH (\n  ENDPOINT_URL\
    \ = Ntcp://sqlonlinux2:5022,\n  AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n  FAILOVER_MODE\
    \ = EXTERNAL,\n  SEEDING_MODE = AUTOMATIC\n)\nN'sqlonlinux3'\nWITH (\n  ENDPOINT_URL\
    \ = Ntcp://sqlonlinux3:5022,\n  AVAILABILITY_MODE = SYNCHRONOUS_COMMIT,\n  FAILOVER_MODE\
    \ = EXTERNAL,\n  SEEDING_MODE = AUTOMATIC\n);\n```\n\nInteresting to note is that\
    \ if you run this twice, you get a Windows-related message, which I also saw on\
    \ some other errors:\n\nMsg 41171, Level 16, State 2, Line 31\\Failed to create\
    \ availability group 'ag1', because a Windows Serverover Cluster (WSFC) group\
    \ with the specified name already exists. The operation has been rolled back successfully.\
    \ To retry creating an availability group, either removing or renaming the WSFC\
    \ group, or retry the operation by specifying a different availability group name.\n\
    \nNext, grant the CREATE ANY DATABASE permission to the availability group—now,\
    \ only for the primary replica sqlonlinux1:\n\n```\nALTER AVAILABILITY GROUP ag1\
    \ GRANT CREATE ANY DATABASE;\n```\n\nRun the statements on the other two replicas,\
    \ sqlonlinux2 and sqlonlinux3. The JOIN option of ALTER AVAILABILITY GROUP is\
    \ used by a local server to host a secondary replica in the specified availability\
    \ group. Same as with sqlonlinux1, the CREATE ANY DATABASE permission is granted\
    \ to the availability group.\n\n```\nALTER AVAILABILITY GROUP ag1 JOIN WITH (CLUSTER_TYPE\
    \ = EXTERNAL);\nGO\n```\n\n```\nALTER AVAILABILITY GROUP ag1 GRANT CREATE ANY\
    \ DATABASE;\n```"
  merge: -1
