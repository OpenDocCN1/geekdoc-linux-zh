    # Row-Level Security


    The purpose of row-level security is to control access to rows in a table based
    on the user executing a query. The benefit of this feature is that the access
    restriction logic is defined in SQL Server rather than at the application level.


    Row-Level Security relies on the CREATE SECURITY POLICY statement and predicates
    as inline table-value functions. The CREATE SECURITY POLICY statement creates
    a security policy for Row-Level Security and requires an inline valued function
    that is used as a predicate and is enforced upon queries against the target table.
    The SCHEMABINDING option is required in this inline table-value function.

    Let''s copy some data from AdventureWorks to show how this feature works. Create
    a new database:


    ```

    SELECT * INTO dbo.SalesOrderHeader

    FROM AdventureWorks2014.Sales.SalesOrderHeader

    ```


    In this case, we want to grant permissions on the SalesPersonID column to the
    specified salesperson. By running the following query, you can see the available
    SalesPersonID values:


    ```

    SELECT SalesPersonID, COUNT(*)

    FROM dbo.SalesOrderHeader

    GROUP BY SalesPersonID

    ```


    For simplicity, let us focus only on SalesPersonIDs 274 and 275. Let''s create
    a user: two salespersons and a sales manager:


    ```

    CREATE USER SalesManager WITHOUT LOGIN

    CREATE USER SalesPerson274 WITHOUT LOGIN

    CREATE USER SalesPerson275 WITHOUT LOGIN

    ```


    Grant permissions on the SalesOrderHeader table to each user:


    ```

    GRANT SELECT ON SalesOrderHeader TO SalesManager

    GRANT SELECT ON SalesOrderHeader TO SalesPerson274

    GRANT SELECT ON SalesOrderHeader TO SalesPerson275

    ```'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Chapter 8: Security


    At this time, users can access the entire table, as requested by the GRANT SELECT
    statement. Let us fix that by creating our filter predicate function:


    ```

    CREATE FUNCTION fn_securitypredicate(@SalesPersonID AS sysname)

    RETURNS TABLE

    WITH SCHEMABINDING

    AS

    RETURN SELECT 1 AS fn_securitypredicate_result

    WHERE @SalesPersonID = RIGHT(USER_NAME(), 3) OR USER_NAME() = ''Manager'';

    ```


    Create the security policy using the previously defined inline table-value function:


    ```

    CREATE SECURITY POLICY SalesFilter

    ADD FILTER PREDICATE dbo.fn_securitypredicate(SalesPersonID)

    ON dbo.SalesOrder

    WITH (STATE = ON)

    ```


    Since we have specified STATE ON, the security policy is now enabled. To test
    the change in permissions, try the following statements:


    ```

    EXECUTE AS USER = ''SalesPerson274''

    SELECT * FROM SalesOrderHeader

    REVERT

    ```


    ```

    EXECUTE AS USER = ''SalesPerson275''

    SELECT * FROM SalesOrderHeader

    REVERT

    ```


    ```

    EXECUTE AS USER = ''SalesManager''

    SELECT * FROM SalesOrderHeader

    REVERT

    ```


    So you can see how only the rows for the specific salesperson are listed, even
    when the user is submitting a SELECT for the entire table. SalesPerson274 can
    only see rows with SalesPersonID 274. SalesManager has no restrictions and can
    see all the data. To clean up, you only need to drop the SalesFilter security
    policy and the fn_securitypredicate function:


    ```

    DROP SECURITY POLICY SalesFilter

    DROP FUNCTION fn_securitypredicate

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Dynamic Data Masking


    Dynamic Data Masking is another security feature feature introduced with SQL Server
    2016; it is aimed at limiting sensitive data exposure by masking it to nonprivileged
    users. Dynamic Data Masking is implemented by using a masking rule that is defined
    on a column in a table by using either the CREATE TABLE or the ALTER TABLE statement.
    Four types of masks are currently available:


    +   - Default mask Works with most data types. For example, it replaces a string
    data type with ''xxxx'', a numeric data type with a zero value, and a date and
    time type with ''01.01.1900 00:00:00.0000000'', and a binary data type with the
    ASCII value 0.

    - E-mail mask Replaces email address values with the form ''aXXX@XXXX.com''.

    - Random mask Replaces a numeric data type with a random value based on a specified
    range.

    - Custom string mask Replaces a string data type with a string that exposes the
    first and last letters and adds a custom padding string in the middle.


    Let''s create a table to test some of these choices:


    ```

    CREATE TABLE test (

    field1 varchar(40) MASKED WITH (FUNCTION = ''default''),

    field2 int MASKED WITH (FUNCTION = ''default''),

    field3 datetime MASKED WITH (FUNCTION = ''default''),

    field4 binary(20) MASKED WITH (FUNCTION = ''default''),

    field5 varchar(40) MASKED WITH (FUNCTION = ''email''),

    field6 int MASKED WITH (FUNCTION = ''random(1, 12)''),

    field7 varchar(20) MASKED WITH (FUNCTION = ''partial(1, "XXXXXXX", 0))'');

    ```


    Insert a single row:


    ```

    INSERT INTO test VALUES (''San Diego'', 666, GETDATE(), CAST(123 AS

    binary(20)), ''admin@benjaminnevarez.com'', 123, ''Los Angeles'')

    ```


    Run the following statement to see the current data:


    ```

    SELECT * FROM test

    ```


    If you are running the query with a login with high-level privileges, you will
    still see the real data. Try it with a user without high-level privileges by running
    the'
