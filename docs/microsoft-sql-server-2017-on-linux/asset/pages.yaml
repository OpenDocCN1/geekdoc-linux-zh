    Run the command to create a virtual IP resource for the cluster. You will need
    to specify a static IP address:


    ```

    $ sudo pcs resource create virtualip ocf:heartbeat:IPaddr2

    ip=13.91.249.38

    ```


    Notice that we are again creating a cluster resource, same as we did earlier to
    create an availability group resource. This time, though, it is a virtual IP resource.


    We can use constraints to enforce whether or not two resources should be running
    on the same node, where a resource can or cannot run or the order in which the
    resources in a cluster should start. In this case, let''s add a colocation constraint
    to ensure that the availability group primary replica and the virtual IP resources
    run on the same host. This requires a colocation constraint with a score of INFINITY.
    Run the following statement:


    ```

    $ sudo pcs constraint collocation add virtualip ag_cluster-master INFINITY --rsc-role=Master

    ```


    The next constraint will make sure the availability group cluster resource is
    started first and then the virtual IP resource. This is required to avoid a case
    when the IP address is available but pointing to a node where the availability
    group resource is not yet available:


    ```

    $ sudo pcs constraint order promote ag_cluster-master then start virtualip

    ```'
