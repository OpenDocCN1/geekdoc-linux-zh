  md: 'Chapter 2 covers some SQL Server history with different operating systems and
    explains some of the details about how SQL Server on Linux works. This includes
    describing the interaction between SQL Server and the operating system, decisions
    regarding its architecture, and information about its software implementation,
    among other related topics. It also covers details about the SQL Operating System
    (SQLOS), the Drawbridge technology, and the SQL Platform Architecture Layer (SQLPAL).


    I include an entire chapter dedicated to Linux for the SQL Server professional.
    Chapter 3 covers all the basic commands you need to start, including managing
    files and directories and their permissions, along with a few more advanced topics,
    including system monitoring.


    Chapter 4 covers SQL Server setup and configuration in a Linux environment, and
    it is divided into three parts: using the mql-conf utility to configure SQL Server,
    which is required in Linux environments; using Linux-specific kernel settings
    and operating system configurations; using some traditional SQL Server configurations
    for both Windows and Linux installations.


    After spending time learning how to set up and configure SQL Server, you''ll move
    to Chapter 5, which discusses how to use SQL Server to perform database operations.
    This chapter, in particular, covers query tuning and optimization topics, which
    are applicable to both Windows and Linux installations—and, in fact, to all the
    currently supported versions of the product.


    Chapter 6 continues with query processing and the new features available in SQL
    Server 2017, such as adaptive query processing and automatic-recovery tuning.


    Chapter 7 is about high-availability and disaster-recovery solutions for SQL Server
    on Linux and focuses on Always On availability groups. Availability groups on
    both Windows and Linux can be used in high-availability and disaster-recovery
    configurations and for migrations and upgrades, or even to scale out readable
    copies of one or more databases. The chapter also covers Pacemaker, a clustering
    solution available on Linux distributions.


    Finally, I close the book with Chapter 8, which is about security. This chapter
    reviews security from a general point of view and includes details about some
    of the new security features in SQL Server, including Transparent Data Encryption,
    Always Encrypted, Row-Level Security, and Dynamic Data Masking.'
