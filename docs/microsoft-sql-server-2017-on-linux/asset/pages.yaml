  md: '# Chapter 5: SQL Server Query Tuning and Optimization 173


    is not finding a good execution plan for your query, you may need to consider
    hints to direct the query optimizer toward what you believe is the optimal execution
    path.


    Always remember that, by applying a hint, you effectively disable some of the
    available transformation rules to which the query optimizer usually has access
    and thus restrict the available search space. Only transformation rules that help
    to achieve the requested plan will be executed. For example, if you use hints
    to force a particular join order, the query optimizer will disable rules that
    reorder joins. Always try to use the least restrictive hint, because this will
    retain as much flexibility as possible in your query and make maintenance somewhat
    easier. In addition, hints cannot be used to generate an invalid plan or a plan
    that the query optimizer normally would not consider during query optimization.


    Furthermore, a hint that initially does a great job might actively hinder performance
    at a later point in time when some changes change—for example, as a result of
    schema updates, service packs, new versions of SQL Server, or even data changes.
    The hints may prevent the query optimizer from modifying the query plan accordingly;
    and thus result in degraded performance. It is your responsibility to monitor
    and maintain your hinted queries to make sure they continue to perform well after
    such system changes or to remove hints if they are no longer needed.


    Also, remember that if you decide to use a hint to change a single section or
    physical operator of a plan, then after you apply the hint, the query optimizer
    will perform a completely new optimization. The query optimizer will obey your
    hint during the optimization process, but it still has the flexibility to change
    everything else in the plan, so the end result of your tweaking may be unintended
    changes to other sections of the plan. Finally, note the fact that your query
    is not performing as you hoped does not always mean that the query optimizer is
    giving you a good enough execution plan. If the operation you are performing is
    simply expensive and resource intensive, then it''s possible that no amount of
    tuning or hinting will help you achieve the performance you would like.


    # Types of Hints


    SQL Server provides a wide range of hints, which can be classified as follows:


    +   - Query hints Tell the optimizer to apply the hint throughout the entire query.
    They are specified using the OPTION clause, which is included at the end of the
    query.


    +   - Join hints Apply to a specific join in a query and can be specified using
    ANSI-style join hints.


    +   - Table hints Apply to a single table and are usually included using the WITH
    keyword in the FROM clause.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Another useful classification is dividing hints into physical operator and
    goal-oriented hints:


    +   - Physical operator hints Request the use of a specific physical operator,
    join order, or aggregation placement. Most of the available hints are physical
    hints.


    +   - Goal-oriented hints Do not specify how to build the plan, but instead specify
    a goal to achieve, leaving the query optimizer to find the best physical operators
    to achieve that goal. Goal-oriented hints are usually safer and require less knowledge
    about the internal workings of the query optimizer. Examples of goal-oriented
    hints include the OPTIMIZER FOR FAST N hints.


    # NOTE


    Locking hints do not affect plan selection, so they are not covered here.


    # Summary


    This chapter provided a quick introduction to query tuning and optimization. This
    material should be helpful for every database professional, and it also provides
    the background you may need to understand the following chapters of the book,
    which focus on new features in SQL Server 2017, especially those related to query
    processing topics.


    In the next chapter, I will cover adaptive query processing, automatic tuning,
    and some other query processing-related topics, all new with SQL Server 2017.'
