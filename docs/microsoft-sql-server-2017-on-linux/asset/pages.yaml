    stick with the lowest serial choice as selected. For more expensive queries, most
    likely a parallel plan will be produced.


    It is worth clarifying that when a parallel plan is selected for execution, the
    execution plan itself does not define the degree of parallelism. This will be
    defined at runtime by the query processor.


    Although the default value of 5 could be a good choice for many workloads, you
