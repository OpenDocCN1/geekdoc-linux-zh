    is user, g is group, and o is other. Use the symbol + to grant the permission
    and - to revoke it.


    ```

    $ chmod o+w file3

    $ ls -l

    total 0

    -rw-rw-rw-. 1 bnevarez bnevarez 0 Aug 24 06:26 file3

    $ chmod g-w file3

    $ ls -l

    total 0

    -rw-r--rw-. 1 bnevarez bnevarez 0 Aug 24 06:26 file3

    ```


    In this example, o+w grants the permission to other and g-w revokes the permission
    to the group.

    You can also change multiple permissions at a time:


    ```

    $ chmod u-x,g+w-w file3

    ```


    This example removes execute permission from the user, assigns write permissions
    to the group, and removes write permissions from other.

    An alternative method to work with permissions is to use the octal permission
    representation, as shown in the following example:


    ```

    $ chmod 567 file3

    $ ls -l

    total 0

    -r-xr-rwx. 1 bnevarez bnevarez 0 Aug 24 06:26 file3

    ```


    You can define any combination of permissions with just three digits, but using
    this method may be more complicated for the beginner. Basically, this octal representation
    uses 4 for read, 2 for write, and 1 for execute, and you can add these values
    to assign more than one permission at a time. For example, to give read permission
    you''d use value 4, to give write you''d use 2, to give both read and write you''d
    add both values to get 6, to give read and execute you''d add both values to get
    5, and give all three permissions you''d add all three values to get 7. It is
    also possible to remove all the permissions. You can see a chart with all the
    possible permissions in Figure 3-2.


    ```

    $ chmod 000 file1

    $ ls -l

    ---------- 1 bnevarez bnevarez Sep 4 22:07 file1

    ```


    The same permissions apply to directories in which read means that the user can
    list the contents of the directory, write means that the user can create or delete
    files or other execute means that the user can navigate through the directory.'
