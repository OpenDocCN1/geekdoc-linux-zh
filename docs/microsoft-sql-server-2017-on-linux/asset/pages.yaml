    In this case, we have only one plan, reused for the second execution, as shown
    in execution_count value. Therefore, we can also see that plan reuse is another
    benefit of parameterized queries. However, we can see a different behavior with
    the following query:


    ```

    DBCC FREEPROCACHE

    DBCC DROPCLEANBUFFERS

    GO

    SELECT * FROM Person.Address

    WHERE StateProvinceID = 79

    GO

    SELECT * FROM Person.Address

    WHERE StateProvinceID = 59

    GO

    SELECT * FROM sys.dm_exec_query_stats

    ```


    Because a filter with an equality comparison on StateProvinceID could return zero,
    one or more values, it is not considered safe for SQL Server to auto-parameterize
    the query; in fact, both executions return different plans. Here is the output:


    | sql_handle | query_hash | query_plan_hash |

    |---|---|---|

    | 0x00000000E315A2E496BCFC73B7D0492A1B2E2A7B8FF1A230000000000000000 | 0x18915DAE8B303AE2
    | 0xAE5E8B90DA490F3C9 |

    | 0x00000000E6BF0F42379648C75CCB482D1433B3D0C50C72F72F100000000000000000 | 0x18915DAE8B303AE2
    | |


    As you can see, the sql_handle, the plan_handle (not shown), and the query_plan_hash
    have different values. However, the query_hash is the same because it is the same
    query, except with a different parameter. Supposing that the most expensive query
    in the system and there were multiple executions with different parameters, it
    would be very difficult to find out that all those execution plans actually did
    belong to the same query. This is why query_hash can help. You can use query_hash
    to aggregate performance statistics of similar queries that are not explicitly
    or implicitly parameterized. Both query_hash and plan_hash are available on the
    sys.dm_exec_query_stats and sys.dm_exec_requests views.


