  md: '# Microsoft SQL Server 2017 on Linux


    His chapter provides an introduction to security in SQL Server, and its content
    applies to both Windows and Linux environments. It covers how SQL Server security
    works in layers such as protecting the data itself, controlling access to the
    data, and monitoring access. This chapter also covers some of the newest SQL Server
    security features introduced in the latest versions of the product, including
    Transparent Data Encryption (TDE), Always Encrypted, Row-Level Security, and Dynamic
    Data Masking (DDM), in more detail.


    All the security features available with Windows are available on Linux, with
    the exception of Active Directory, which will be included in a future update.


    +   - Transparent Data Encryption This feature is designed to protect the database
    data and transaction log files against unauthorized access to physical media.
    It performs real-time I/O encryption at the page level, although the data is not
    encrypted after it is in memory or across other communication channels.


    +   - Always Encrypted This client-side encryption technology is designed to protect
    sensitive data, data remains encrypted in the database engine all the time.


    +   - Row-Level Security This feature controls access to rows in a table based
    on the identity of the user executing a query. The benefit of this feature is
    that the access restriction logic is defined in SQL Server rather than at the
    application level.


    +   - Dynamic Data Masking This security feature is aimed at limiting sensitive
    data exposure by masking it to non-privileged users.


    # Introduction to Security on SQL Server


    SQL Server on Linux supports the same enterprise-level security capabilities available
    with SQL Server on Windows, and all these features are built into the product.
    Microsoft defines SQL Server Security in terms of layers, as shown in Figure 8-1.


    The first security layer is about protecting and encrypting the data itself, using,
    for example, encryption at rest to protect data in case files or disks are stolen.
    SQL Server provides features for encryption at rest, such as TDE, backup encryption,
    and cell-level encryption. Another type of encryption, encryption in transit,
    secures the communication for SQL Server and is based on the Transport Layer Security
    (TLS) protocol. A final type of encryption, client-side encryption, also called
    Always Encrypted, keeps data encrypted in the database engine all the time and
    is visible only on the client side. Both TDE and Always Encrypted are covered
    in detail in this chapter.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Chapter 8: Security 25


    ![](img/0a5d3f27ca07081d5ee426b77bb624b8_270_0.png)


    Figure 8-1 Layers of SQL Server security


    The second layer of security in SQL Server is about controlling access to the
    data through authentication and authorization processes. SQL Server has a very
    granular permissions system that enables you to control very specific access to
    almost every SQL Server object. SQL Server in Windows supports both SQL Server
    and Active Directory authentication. Active Directory authentication is currently
    not available on SQL Server on Linux, but it is planned to be implemented in the
    future. In addition, some features as Row-Level Security and Dynamic Data Masking
    provide additional methods to control access to the data. Row-Level Security and
    Dynamic Data Masking are also covered in detail in this chapter.


    The last and outer layer is monitoring data access by logging user operations
    within an instance or database. SQL Server provides an audit feature that enables
    you to specify which users, actions, and objects should be tracked and will require
    the database engine to log all activity based a defined policy. This process is
    commonly used to keep an audit trail to meet certain compliance standards.


    Finally, starting on May 25, 2018, the General Data Protection Regulation (GDPR)
    will be introduced as a new European law whose purpose is to protect personal
    data for individuals living within the European Union. Among others, the GDPR
    individuals have the right to access their personal data, correct errors in their
    personal data, and erase their personal data. On the other hand, are required
    to protect personal data using appropriate security, notify authorities of personal
    breaches, and provide clear notice of data collection. For more details about
    the GDPR you can read the paper "Data Governance for GDPR Compliance: Principles,
    Processes, and Practices" at https://info.microsoft.com/DataGovernanceforGDPRCompliancePrinciplesProcessesAndPractices-Registration.html.'
