  md: '# Chapter 1: SQL Server on Linux: Getting Started


    But before we continue, here''s a quick introduction to package managers, which
    may be a new concept for most SQL Server developers and administrators. The process
    of installing, upgrading, configuring, and removing software is quite different
    on Windows platforms. Software in Linux distributions uses packages, and there
    are several package management systems, which are collections of utilities used
    to install, upgrade, configure, and remove packages or distributions of software.
    In this chapter, we will cover some package management utilities such as yum,
    apt, and zipper, which we will use with Red Hat, Ubuntu, and SUSE, respectively.


    The yum (which stands for Yellowdog Updater Modified) package manager was written
    in Python. We will use it to install the SQL Server package mssql-server by running
    the following:


    ```

    yum install -y mssql-server

    ```


    If you want to update the package, which is useful when there is a new CTP, RC,
    or cumulative update, you can use this:


    ```

    yum update mssql-server

    ```


    If you want to remove the package, use this:


    ```

    yum remove mssql-server

    ```


    # NOTE


    CTPs (Community Technology Previews) or RCs (Release Candidates) are versions
    of SQL Server used during their beta program before a final release. A final release
    is called RTM (release to manufacturing).


    Finally, one of the major changes in SQL Server 2017 compared to previous versions
    is the new servicing model. Although service packs will still be used for SQL
    Server 2016 and previous supported versions, no more service packs will be released
    for SQL Server 2017 and later. The new servicing model will be based only on cumulative
    updates (and GDRs [General Distribution Releases]) when required.


    +   Cumulative updates will be released more often at first and less frequently
    in the new servicing model. A cumulative update will be available every month
    for the first 12 months and every quarter for the remaining four years of the
    five-year mainstream life cycle.


    As of this writing, three repositories are defined for SQL Server on Linux:


    +   Cumulative updates is the base SQL Server release and any bug fixes or improvements
    since that release: This is the choice we selected earlier using https://packages.microsoft.com/config/rhel/7/mssql-server-2017.repo.'
  merge: -1
  pgno: 34
