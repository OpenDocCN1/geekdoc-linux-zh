  md: '# Chapter 3: Linux for the SQL Server Professional


    Use option -e to select all the processes -f to add columns. These additional
    columns are UID, PPID, C, and STIME, which are the user ID, parent process ID,
    CPU usage, and time when the process started, respectively. In addition, -f includes
    the command arguments, if any. Use options -A and -a to select all the processes
    in the system. Keep in mind that ps provides a snapshot of the system at the time
    the command is executed. For real-time information, you could also use the top
    and htop commands, which I cover in the "System Monitoring" section later in this
    chapter.


    Other options are also useful as well. Let''s try a few.


    Use -u to display processes by a specific user:


    ```

    # ps -f -u mssql

    UID     PID PPID C STIME TTY          CMD

    mssql   857    1 Sep2 ?    00:00:00 /opt/mssql/bin/sqlserver

    mssql   939    857 0 Sep2 ?    00:18:18 /opt/mssql/bin/sqlserver

    ```


    Use -C to select the processes for a specific file:


    ```

    # ps -f -C mssql

    UID     PID PPID C STIME TTY          CMD

    mssql   857    1 Sep2 ?    00:00:00 /opt/mssql/bin/sqlserver

    mssql   939    857 0 Sep2 ?    00:18:19 /opt/mssql/bin/sqlserver

    ```


    It is also popular to use the BSD syntax to show every process in the system,
    shown next. Notice that no dash (-) is required in this case:


    ```

    $ ps aux

    ```


    The ps command offers incredible flexibility. For example, you can specify which
    columns to list using the -o option:


    ```

    $ ps -e -o pid, uname, pcpu, pmem, comm

    ```


    This example will list process ID, user ID, CPU usage, memory usage, and command
    name. For the entire list of possible columns, see the man documentation.


    You can sort by one or more columns, in ascending or descending order, + means
    increasing, is the default, and - means decreasing. With the -o option, you can
    see the entire list of available columns in the documentation using this command:


    ```

    $ ps aux --sort=pcpu

    ```


    You can limit the previous output to a specific number of processes by sending
    it to the head command, which outputs the first part of it. In the following example,
    we use the head -n to specify only ten lines:


    ```

    $ ps aux --sort=pcpu | head -n 10

    ```'
