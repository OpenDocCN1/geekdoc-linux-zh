    # Query Parameter Limitations


    Query optimization is an inherently complex problem, not only for SQL Server,
    but also for any other relational database system. Despite the fact that query
    optimization research dates back to the early 1970s, challenges in some fundamental
    areas are still being addressed today. The first major impediment to a query optimizer
    finding an optimal plan is the fact that, for many queries, it is just not possible
    to explore the entire search space. An effect known as combinatorial explosion
    makes this exhaustive enumeration impossible, because the number of possible plans
    grows very rapidly, depending on the number of tables joined in the query. To
    make a search manageable'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Chapter 5: SQL Server Query Tuning and Optimization 169


    process, heuristics are used to limit the search space (that is, the number of
    possible plans to be considered), as mentioned earlier in this chapter. However,
    if a query optimizer is not able to explore the entire search space, there is
    no way to prove that you can get an absolutely optimal plan, or even that the
    best plan is among the candidates being considered, whether it is selected or
    not. As a result, it is clearly extremely important that the set of plans a query
    optimizer considers contains plans with low costs.


    This leads to another major technical challenge for the query optimizer: accurate
    cost and cardinality estimation. Because a cost-based optimizer selects the execution
    plan with the lowest estimated cost, the quality of the plan selection is only
    as good as the accuracy of the optimizer''s cost and cardinality estimations.
    Even supposing that time is not a concern and the query optimizer can analyze
    the entire search space without a problem, cardinality and cost estimation errors
    can still make a query optimizer select a nonoptimal plan. Cost estimation models
    are inherently inexact because they do not consider all the hardware conditions,
    and they must necessarily make certain assumptions about the environment. For
    example, the costing model assumes that every query starts with a cold cache (that
    is, data read from disk and not from memory), and this assumption could lead to
    cost estimation errors in some cases.


    In addition, cost estimation relies on cardinality estimation, which is also inexact
    and has some known limitations, especially when it comes to the estimation of
    the intermediate results in a plan. Errors in intermediate results get effect
    magnified as more tables are joined and more estimation errors are included within
    the calculations. On top of all that, some operations are not covered by the mathematical
    model of the cardinality estimation component, which means the query optimizer
    has to resort to guess logic or heuristics to deal with these situations.


    ![](img/0a5d3f27ca07081d5ee426b77bb624b8_188_0.png)


    # NOTE


    As covered earlier in this chapter, SQL Server 2014 has introduced a new cardinality
    estimator to help improve the accuracy and supportability of the cardinality estimation
    process.


    # Query Optimization Research


    Query optimization research dates back to the early 1970s. One of the earliest
    works describing a cost-based query optimizer was “Access Path Selection in a
    Relational Database Management System", published in 1979 by Pat Selinger, et
    al., to describe the query optimizer for an experimental database management system
    developed in 1975 at what is now the IBM Almaden Research Center. This database
    management system, called "System R", advanced the field of query optimization
    by introducing the use of cost-based query optimization, the use of statistics,
    as an efficient method of determining join orders and the addition of CPU cost
    to the optimizer’s cost estimation formulas.'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'Yet despite an enormous influence in the field of query optimization research,
    it suffered a major drawback: its framework could not be easily extended to include
    additional transformations. This led to the development of more extensible optimization
    architectures, which facilitated the gradual addition of new functionality to
    query optimizers. The trailblazers in this field were the Exodus Optimizer Generator,
    defined by Goetz Graefe and David DeWitt, and later, the Volcano Generator, defined
    by Goetz Graefe and William McKenna. Graefe then went to define the Cascades Framework,
    resolving errors that were present in his previous endeavors.


    What is most relevant for this research is that SQL Server implemented a new cost-based
    query optimizer, based on the Cascades Framework, in 1999, when its database engine
    was rearchitected for the release of SQL Server 7.0. The extensible architecture
    of the Cascades Framework has made it much easier for new functionality, such
    as new transformation rules or physical operators, to be implemented in the query
    optimizer.


    # Break Down Complex Queries


    In some cases, the SQL Server query optimizer may not be able to produce a good
    plan for a query with a large number of joins. The same is true for complex queries
    with both joins and aggregations. However, because it is rarely necessary to request
    all the data in a single query, a good solution for such cases could be broken
    down a large and complex query into two or more simpler queries while storing
    the intermediate results in temporary tables. Breaking down complex queries this
    way offers several advantages:


    +   * **Better plans** Query performance is improved because the query optimizer
    is able to create efficient plans for simpler queries.


    +   * **Better statistics** Because one of the problems of complex plans is the
    degradation of intermediate statistics, breaking down these queries and storing
    the aggregated or intermediate results in temporary tables enables SQL Server
    to create new statistics, greatly improving the cardinality estimation of the
    remaining queries. It is worth noting that temporary tables should be used and
    not table variables, as the latter do not have statistics.


    +   * **No hints required** Because using hints is a common practice to fix problems
    with complex plans, breaking down the query enables the query optimizer to create
    an efficient plan without requiring hints. This has the additional benefit, that
    the query optimizer can automatically react to future data or schema changes.
    On the other hand, a query using hints would require future maintenance, because
    the hint used may no longer be helpful or even impact its performance in a negative
    way after such changes. Hints, which should be used only as a last resort when
    no other solution is available, are covered later in this chapter.'
  merge: -1
