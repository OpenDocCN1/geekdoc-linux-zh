  md: '# Microsoft SQL Server 2017 on Linux


    Microsoft SQL Server has been a Windows-only software product for more than decades,
    it originally started as a database engine for the then-new OS/2 operating system.
    The year was 1989 and the product was actually called Ashton-Tate/Microsoft SQL
    Server, originally written by Sybase with the C language. By the summer of 1990,
    after a marketing and distribution agreement with Ashton-Tate, it was renamed
    Microsoft SQL Server.


    After the failure of OS/2 to gain market acceptance and the huge success of Windows,
    Microsoft SQL Server was eventually moved to the then-new Windows NT platform.
    SQL Server 4.21a, released in 1993, was the first version to run on Windows. The
    last version of SQL Server for OS/2, SQL Server 4.2B, was released that same year.


    From then on, Microsoft focused on its software product as a Windows-only strategy.
    But that was about to change over 20 years later when Microsoft announced in March
    2016 that this version would be named SQL Server 2017 and would be available on
    Red Hat Enterprise Linux, Ubuntu, and SUSE Linux Enterprise, in addition to Docker
    containers. The product was released in October 2017.


    I started my career in information technology with Unix applications and databases
    in the early 1990s and, at the time, mostly unaware of the SQL Server developments.
    I worked with all the popular implementations of Unix, including Linux, for about
    a decade. These Unix platforms included System V Release 4, IBM AIX, and Hewlett-Packard
    HP-UX. I was one of the early users, which I later deployed in production, but
    mostly to run web servers. I remember that Linux was not an immediate success,
    and nobody knew about Linux in these early days. I eventually decided to specialize
    in SQL Server and leave the Unix/Linux world behind.


    When I heard that SQL Server would be available on Linux, I was really excited
    about the possibilities. It was like going back to the old times. It was ironic
    and interesting that SQL Server would bring me back to Linux.


    Although Chapter 2 continues the discussion of SQL Server history with different
    operating systems, this chapter will show you how to install SQL Server on Linux
    so you can start playing with the technology as quickly as possible. Chapter 2
    describes decisions about SQL Server on Linux architecture, software implementations,
    and how SQL Server interacts with the operating system, among other related topics.
    The remaining chapters focus on all the details and more advanced topics.


    # Creating a Virtual Machine


    This chapter will show you how to install SQL Server on a virtual machine image
    with Linux preinstalled. You can obtain the Linux virtual in several ways—for
    example, by using a cloud provider such as Microsoft Azure or Amazon Web Services
