  md: '# Microsoft SQL Server 2017 on Linux


    The sysctl command enables you to configure kernel parameters at runtime. It basically
    reads and modifies the attributes of the system kernel. Linux exposes sysctl as
    a virtual file system at /proc/sys.


    To see the value of a kernel attribute or variable, you can use sysctl followed
    by the variable name, as shown next. These are the defaults on a newly created
    virtual machine for the disk settings described earlier, typing a command per:


    ```

    $ sysctl kernel.sched_min_granularity_ns

    kernel.sched_min_granularity_ns = 100000000

    $ sysctl kernel.sched_wakeup_granularity_ns = 150000000

    kernel.sched_wakeup_granularity_ns =

    $ sysctl vm.dirty_ratio

    vm.dirty_ratio = 30

    $ sysctl vm.dirty_background_ratio

    vm.dirty_background_ratio = 10

    $ sysctl vm.swappiness

    vm.swappiness = 30

    ```


    As you can see, two values do not follow the Microsoft recommended values. To
    change a sysctl setting, you can use the -w option, as shown next:


    ```

    $ sysctl -w vm.dirty_ratio=40

    vm.dirty_ratio = 40

    $ sysctl -w vm.swappiness=10

    vm.swappiness = 10

    ```


    > Note that you cannot include a space, which may be allowed with other commands,
    or you will get the following error messages:


    ```

    # sysctl -w vm.dirty_ratio = 40

    sysctl: "vm.dirty_ratio" must be of the form name=value

    sysctl: malformed setting ""

    sysctl: "40" must be of the form name=value

    ```


    You can display all values of kernel settings currently available in the system
    using -a or --all, which will return a very large number of entries. An example
    is shown in Figure 4-1.


    ```

    $ sysctl --all

    ```


    # NOTE


    For more details about sysctl1, see the man documentation.'
