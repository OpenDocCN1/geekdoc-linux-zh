  md: '# Last Accessed Date/Time


    A final operating system recommendation is to disable the last accessed date/time
    timestamp at the file system level. This timestamp, also known as atime, incurs
    a performance penalty, because it records when each file was last accessed, basically
    writing activity for every read operation. You can disable the updating of information
    to improve performance. Keep in mind, however, the atime attribute may be required
    by some applications, so consider disabling it for file systems used by SQL Server.


    To disable the last accessed date/time timestamp at the file system level, you
    can edit the /etc/fstab file—although directly editing a Linux configuration file
    may seem like a very advanced task for a SQL Server professional. Edit the file
    to add noatime to the associated mount options of the required file system. The
    fstab file contains a line per each file system and includes information such
    as the device name, the mount directory, the file type, and the associated mount
    options.


    In the example, the only defined mount option is:


    ```

    UUID=99cf66df-2fef-4aad-b226-382883643a1c / xfs

    default 0 0

    UUID=7c473048-a4e7-4908-bad3-a9be22e9d37d /boot xfs

    defaults 0 0

    ```


    After editing the file, the mount options now show defaults, noatime:


    ```

    UUID=99cf66df-2fef-4aad-b226-382883643a1c / xfs

    defaults,noatime 0 0

    UUID=7c473048-a4e7-4908-bad3-a9be22e9d37d /boot xfs

    defaults,noatime 0 0

    ```


    Finally, you can use the remount option of the mount command to reload the file
    system information. This option will attempt to remount an already-mounted file
    system:


    ```

    # mount -o remount /

    ```


