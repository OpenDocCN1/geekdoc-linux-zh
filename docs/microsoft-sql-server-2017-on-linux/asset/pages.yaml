- img_proc: true
  md: '# Chapter 7: High Availability and Disaster Recovery 229


    The fencing agents in a Pacemaker cluster are designed to shut down a node that
    has become unstable or unresponsive to that it cannot damage the cluster or any
    cluster resources. Resource agents packages that integrate applications and understand
    a specific application and its dependencies. Corosync is a heartbeat that provides
    intercluster communications between cluster nodes and may also provide a quorum
    if needed.


    As of this writing, Red Hat Enterprise Linux does not provide support for fencing
    agents on any cloud environment, including Microsoft Azure. Microsoft has indicated
    that it is working on a solution to this. So, optionally, you can disable the
    fencing agents because they are not supported, or keep them enabled for evaluation
    purposes.


    > NOTE Access to the Red Hat Enterprise Linux High Availability Add-On requires
    a subscription to the Red Hat Developer Program, which provides no-cost subscriptions,
    and you can download the software for use only. For more details, see https://developers.redhat.com/products/rhel/download.


    Let''s start the configuration. Most of the work on this section will be on the
    Linux side. Register the Red Hat High Availability Add-On on each server using
    the subscription-manager command. This command enables you to register systems
    to a subscription management service and attaches and manages subscriptions for
    products. For this exercise, we will use the register, list, and attach modules.
    The register module is used to register this system to the customer portal or
    another subscription management service.


    ```

    $ subscription-manager register

    Registering to: subscription.rhsm.redhat.com:443/subscription

    Username: admin@benjamininnevarez.com

    Password:

    The system has been registered with ID: e716610b-3f8e-4803-99cc-0353efe97ea5

    ```


    The list module, shown next, lists subscription and product information for this
    system:

    sudo subscription-manager list --available


    This is a partial output:

    SKU: RH2262474

    Contract:

    Pool ID: 8a85f9825e88065701e892b8ec74358

    Provides Management: Yes

    Available: 94'
  merge: -1
  pgno: 248
