  md: '# Microsoft SQL Server 2017 on Linux


    the query and will include such logical operations as “get data from the Customer
    table,”get data from the Contact table,”perform an inner join,” and so on. Different
    tree representations of the query will be used throughout the optimization process,
    and this logical tree will receive different names until it is finally used to
    initialize a memory structure called the Memo. This memory structure will be used
    during the entire optimization process.


    Binding is mostly concerned with name resolution. During the binding operation,
    SQL Server makes sure that all the object names exist, and it associates every
    table and column name on the parse tree with its corresponding object in the system
    catalog. The output of this second process is called an algorithm tree, which
    is then sent to the query optimizer.


    # Query Optimization


    The next step is the optimization process, which is basically the generation of
    candidate execution plans and the selection of the best of these plans according
    to their cost. As already mentioned, the SQL Server query optimizer uses a cost-estimation
    model to estimate the cost of each of the candidate plans.


    Query optimization could also be seen as the process of mapping the logical query
    operations expressed in the original tree representation to physical operations,
    which can be carried out by the execution engine. So it’s the functionality of
    the execution engine that is being implemented in the execution plans being created
    by the query optimizer; and that is, from these algorithms that the query optimizer
    must choose when formulating its execution plans. It does this by translating
    the original logical operations into the physical operations that the execution
    engine is capable of performing. Execution plans show both the logical and physical
    operations for each operator. Some logical operations map to the same physical
    operation, whereas other logical operations map to several possible physical operations.
    For example, a logical join can be mapped to a nested loop join, merge join, or
    hash join operator. However, this is not a one-to-one operator matching and instead
    follows a more complicated process.


    Thus, the end of the query optimization process is an execution plan: a tree consisting
    of a number of physical operators that contain the algorithms to be performed
    by the execution engine to obtain the desired results from the database.


    # Generating Candidate Execution Plans


    Even for relatively simple queries, there may be a large number of different ways
    to access the data to produce the same end result. As such, the query optimizer
    has to select the best possible plan from what may be a large number of candidate'
