  md: '# About the Author


    Benjamin Nevarez is a database professional based in Los Angeles, California,
    who specializes in SQL Server query tuning and optimization. He is the author
    of three books, High Performance SQL Server (Apress, 2016), Microsoft SQL Server
    2014 Query Tuning & Optimization (McGraw-Hill Education, 2014), and Inside the
    SQL Server Query Optimizer (Simple Talk Publishing, 2010) and has coauthored other
    books, including SQL Server 2012 Internals (Microsoft Press, 2013). Benjamin has
    also been a speaker at many SQL Server conferences and events around the world,
    including the PASS Summit, SQL Server Connections, and SQLBits. He writes a blog
    at www.benjaminnevarez.com and can be reached at Twitter at @BenjaminNevarez.


    # About the Technical Editor


    Mark Broadbent is a Microsoft Certified Master in SQL Server and Microsoft Data
    Platform MVP with more than 30 years of IT experience and more than 20’ experience
    working with Microsoft SQL Server. He is an expert in concurrency control, migration
    and upgrade, and high availability (and disaster recovery) and a lover of Linux,
    Golang, Serverless, and Docker. In between herding cats and rustling dogs, he
    can be found blogging at http://tenbulls.co.uk and tweeting at @retracement.'
