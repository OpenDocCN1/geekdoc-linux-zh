    Some useful ls options are -a (or --all) and -A (or --almost-all), which are used
    to hide hidden files on the list. The only difference is that the latter does
    not include the named and . entries, which represent the current and parent directories,
    respectively. A Unix file starting with a dot (.) is considered a hidden file.


    # Files


    Almost everything in Unix is a file, and, unlike Windows, Linux does not use a
    file extension in the filename. (The file command is used to determine what kind
    of file it is, although this will be rarely needed.) You can perform basic file
    manipulation using the cp (copy), mv (move), and rm (remove) commands.


    Use cp to copy files and directories. The following makes a copy of file1 and
    names file2:


    ```

    $ cp file1 file2

    ```


    You can also use -r (or -R or --recursive) to copy directories recursively. For
    example, the following statements create a couple of files inside the dir1 directory
    and copy the dir1 directory and its contents to the backup directory:


    ```

    $ mkdir dir1

    $ touch dir1/file1

    $ touch dir1/file2

    $ mkdir backup

    $ cp -r dir backup

    ```


    Use the mv command to move files and directories. Or use it to rename files and
    directories. The next command creates a new dir2 directory and move file1 from
    directory1 to dir2:


    ```

    $ mkdir dir2

    $ mv dir1/file1 dir2

    ```


    The following command renames file2 to file3:


    ```

    $ mv file2 file3

    ```'
