    # Operating an Availability Group Resource


    This section introduces the Pacemaker cluster operation and how to fail over an
    availability group manually using the pcs cluster tool. You can also bypass the
    external cluster manager in extreme cases when there is a problem with the cluster
    or the cluster management tools are not working as expected. In this case, a failover
    using T-SQL statements is a possible workaround.


    Failing over an availability group resource requires two steps, which are the
    same for Red Hat Enterprise Linux and Ubuntu. The next command fails over an availability
    group resource named ag_cluster to a cluster node named sqllinux2:


    ```

    $ sudo pcs resource move ag-cluster-master sqllinux2 --master

    ```


    The move option moves the defined resource—in this case, the availability group
    resource ag_cluster—to the specified destination node—in this case, sqllinux2.'
