    available for starting new applications without swapping.


    Finally, you should be aware of the Unix cron facility, which is used to execute
    scheduled commands, and the crontab command which is used to maintain cron files
    for individual users. You can think of cron as something similar to Windows Task
    Scheduler. Although the availability of the SQL Server Agent on the Linux platform
    makes it less likely you''ll use the Linux cron, you still may require it for
