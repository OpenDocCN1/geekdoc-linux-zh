    ```


    For the SQL Server on availability group configuration, we need a certificate
    to authenticate communication between the mirroring endpoints. For the SQL Server
    2017 release, using certificates is the only authentication method supported,
    but Windows authentication will be enabled in a future release. This step basically
    requires that a master key and a certificate be created. The database master key
    is a symmetric key used to protect the private keys of certificates and asymmetric
    keys that are present in the database. The CREATE CERTIFICATE statement adds a
    certificate to a database in SQL Server. Finally,BACKUP CERTIFICATE is used to
    export both the certificate and the private key to. In our case, the certificate
    will be saved in /var/opt/mssql/data/ag_certificate.cer. In addition, the private
    key of the certificate will be exported to /var/opt/mssql/data/ag_certificate.pvk.


    Create and back up the certificate by running the following statements on the
    primary replica sqlonlinux1:


    ```

    CREATE KEY ENCRYPTION BY PASSWORD = ''Pa$$sword!''

    CREATE CERTIFICATE ag_certificate WITH SUBJECT = ''ag'';

    BACKUP CERTIFICATE ag_certificate

    ```


    ```

    TO FILE = ''/var/opt/mssql/data/ag_certificate.cer''

    WITH PRIVATE KEY =

    FILE = ''/var/opt/mssql/data/ag_certificate.pvk'',

    ENCRYPTION BY PASSWORD = ''Pa$$sword!''

    ```


    ;

    Now you can verify that the files were created at /var/opt/mssql/data/:


    ```

    ls -l /var/opt/mssql/data/ag*

    -rw-r--r-- 1 mql mql 667 Jan 08:14 /var/opt/mssql/data/ag_certificate.cer

    -rw-r--r-- 1 mql mql 1212 Jan 08:14 /var/opt/mssql/data/ag_certificate.pvk

    ```


    Now let''s copy these files to the same location on the other servers and grant
    the same permissions they have on the principal replica. There are a few different
    ways to accomplish this. In Chapter 1, we used the PuTTY Secure copy or pscp utility
    to copy files between Windows and Linux. Because in this case, we will use scp,
    the secure copy command, which is a remote file copy program used to copy files
    hosts on a network.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Chapter 7: High Availability and Disaster Recovery 213


    The scp command can use the following basic format to copy files:


    ```

    scp username@servername:/directory/subdirectory

    ```


    Run the following command, replacing the host destination name, such as sqllinux2,
    or IP address and the user and directory destination. This command is executed
    at the primary replica and the files will be copied to my home directory on both
    of the secondary replicas:


    ```

    sudo scp /var/opt/mss/data/ag bnevarez@23.99.95.94:/home/bnevarez

    ```


    Files are copied as the user bnevarez, I still need to copy them to the correct
    directory and give the right permissions. Running the following commands to that:


    +   # cp home/bnevarez/ag* /var/opt/mssql/data

    # cd /var/opt/mssql/data

    # chown mssql ag*

    # chgrp mssql ag*


    Run ls -1 to validate permissions and ownership:


    +   # ls -1

    total 54216

    -rw-r---- 1 mssql mssql 667 Jan 14 04:50 ag_certificate.cer

    -rw-r----- 1 mssql mssql 1212 Jan 14 04:50 ag_certificate.pvk


    Repeat the same operations to copy the files to the additional secondary replica.
    So we copied the files to the secondary replicas. Now the SQL instance needs to
    be aware of the certificates. Running the following statements on the other two
    servers, sqllinux2 and sqllinux2 This creates a master key and a certificate on
    the secondary servers from the backup created on the primary replica. Once again,
    using a strong password. Also, in this particular case, the password used on DECRY
    BY PASSWORD has to be the same password used previously on the ENCRYPTION BY PASSWORD
    option when backing up the private key to a file.


    ```

    CREATE MASTER KEY ENCRYPTION BY PASSWORD = ''Pa$$word!''

    CREATE CERTIFICATE ag_certificate

    AUTHORIZATION ag_user

    FROM FILE = ''/var/opt/mssql/data/ag_certificate.cer''

    WITH PRIVATE KEY (

    FILE = ''/var/opt/mssql/data/ag_certificate.pvk

    DECRYPTION BY PASSWORD = ''Pa$$word!''

    );

    ```'
  merge: -1
