    # CXPACKET and CXCONSUMER Waits


    SQL Server can use parallelism to help expensive queries execute faster by using
    several logical processors simultaneously. However, even if a query gets better
    performance by using parallel plans, may still use more resources than a similar
    serial plan. Parallel plans may show CXPACKET waits, also called parallel processing
    waits. Having these waits does not necessarily mean that there is a problem, and
    unfortunately we have some advice online shows, which sometimes gives parallelism
    a bad reputation. As a consequence, a reaction to this wait type can be to disable
    parallelism. The reality is that we may need to do additional research to see
    if, in fact, parallelism is the problem. Traditionally, troubleshoot CXPACKET
    waits, we should start by looking at the waits on the additional child threads
    waits.


    Starting with SQL Server 2017 Cumulative Update 3 (and SQL Server 2016 Service
    Pack 2), Microsoft is planning to split parallelpacket waits into two different
    waits: CXPACKET and CXCONSUMER, which will allow easier troubleshooting.


    The concept of the change is basically the separation between producer waits and
    consumer waits. In parallel operations, producers push data to consumers, and
    these are the waits that require attention. Consumers may simply have to wait
    for data from the producers, so a delay on the producers will impact them all.
    Starting with this SQL Server change, producer waits will be reported as CXPACKET
    waits and consumer waits as CXCONSUMER waits. CXPACKET waits will be the actionable
    waits, and you will not have to worry about the CXCONSUMER waits. As with any
    other waits, they will be visible on the usual places such as the sys.dm_os_wait_stats
    or the sys.dm_exec_session_wait_stats DMVs.


    NOTE


    SQL Server 2017 Cumulative Update 3 was not yet available at the time of writing,
    although announcement, CXPACKET and CXCONSUMER waits are already implemented on
    Azure Database.'
