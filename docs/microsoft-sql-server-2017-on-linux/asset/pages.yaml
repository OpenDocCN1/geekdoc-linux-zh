  md: '# Introduction


    I started my IT career working with Unix applications and databases back in the
    early ''90s, and my first job ever was as a data processing manager for a small
    IT shop. Back then, I was running Unix System V Release 4 on an NCR system. With
    such big and expensive mincomputer systems, I was always wondering if I could
    have a Unix system on less expensive hardware, such as a PC, to learn and test
    without disrupting our test systems.


    Then I read an article in a personal computing magazine about something called
    Linux. Nobody knew what Linux was back in those days. Very few people—mostly at
    universities—had Linux on four or five floppy disks, installed it on a PC, and
    started playing with it. It was a distribution called Slackware. It was amazing
    that I could finally experiment and test everything I wanted on my own Unix system.


    I continued to work with Linux and all the popular Unix commercial implementations,
    including IBM AIX, HP-UX, Sun Solaris, and others, throughout the ''90s. For several
    years, people still didn''t know what Linux was It was not an immediate success.
    But by the end of the ''90s I decided to specialize in SQL Server, and by that
    I left the Unix world behind.


    So it looked like I was not going to touch a Unix system ever. But one day in
    March 2016, Microsoft surprised the technology community by announcing that SQL
    Server would be available on Linux. When I first heard the news, I thought it
    would be good to write a book about it Because I was just finishing a book about
    SQL Server 2016, I decided to see how the technology evolved and to take a break
    from writing. One day, as I was running training for a marathon, I started thinking
    about the project again and decided it would be a great idea to write a book about
    SQL Server on Linux. After finishing my run, I went to my laptop and sent an e-mail
    to my contact at McGraw-Hill Education, who eventually connected me with Lisa
    McClain. Within a few days, I was now working on this new book project.


    Let me tell you how I got SQL running on Linux as quickly as possible, so you
    can start using the technology, even though I haven''t covered all the details
    yet. The chapter covers how to install SQL Server on Red Hat Enterprise Linux,
    SUSE Linux Enterprise, and Ubuntu and how to configure an image of SQL Server
    on a Docker container. More details of the setup and configuration are included
    in Chapter 4.'
  merge: -1
