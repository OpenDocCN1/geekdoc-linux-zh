    # Configuring Pacemaker on Red Hat Enterprise Linux


    Now let''s configure Pacemaker on Red Hat Enterprise Linux. Pacemaker is an opensource,
    high-availability cluster solution that includes several components, such as Pacemaker
    clustering, fencing resources, resource agents, and Corosync.


    > NOTE

    You can learn more about Pacemaker at www.opensourcerers.org/pacemaker-the-open-source-high-availability-cluster/.'
  merge: -1
