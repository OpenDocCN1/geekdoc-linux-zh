  md: '# tempdb Configuration


    Correctly configuring tempdb has a performance consideration for all the versions
    of SQL Server for long as I can remember. SQL Server 2016 brought improvements
    such as the ability to create multiple data files automatically during the product
    setup by the number of available processors on the system, or the default tempdb
    configuration, which integrates the behavior of trace flags 1117 and 1118. Because
    SQL Server on Linux does not currently have the ability to create multiple tempdb
    data files during setup automatically, manually configuring this remains an important
    requirement.


    tempdb has been largely related to a classic performance problem: tempdb contention.
    The creation of a large number of user objects in a short period of time can contribute
    to latch contention of allocation pages. The main kind of tempdb contention is
    called DML (Data Modification Language) contention, as it relates to queries that
    modify data, mostly due to INSERT, UPDATE, and DELETE operations on temporary
    tables. A second type of contention, DDL (Data Definition Language) contention,
    although not common, is also possible in some heavy scenarios. DDL contention
    is related to queries that create or alter objects that impact the system catalogs,
    opposed to user data.


    Every time a new object has to be created in tempdb, which is usually a temporary
    table with at least one row inserted, two new pages must be allocated from a mix
    and extended to the new object. One page is an Allocation Map (IAM) page and the
    second is a data page. SQL Server also has to access and update the very first
    Page Free Space (PFS) page and the very first Shared Global Allocation Map (SGAM)
    page in the data file. Only one thread can change an allocation page at a time,
    requesting a latch on it. When there is high activity and a large number of temporary
    tables are being created and destroyed in tempdb, contention between the PFS and
    SGAM pages is possible. Remember that this is not an I/O problem, because allocation
    pages in this case are already in memory. Obviously, this contention impacts the
    performance of the processes creating tables because they have to wait, and SQL
    Server may appear for short periods of time. Keep in mind that other databases
    have the same allocation pages, they are not likely to have a latch contention
    in allocation pages because not as many objects are created at the same time as
    they are created in tempdb.


    The easiest way to check whether you have a latch contention on tempdb allocation
    pages is to look for PAGELATCH_XX waits on the database activity. (Note that these
    are not the same as PAGEIOLATCH_XX waits.)


    Although there is no perfect solution to the latch contention, because the database
    engine should be able to escalate and work fine as the number of operations'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Chapter 4: SQL Server Configuration 111


    increase, there are a few good recommendations to help you solve or minimize the
    problem. An obvious solution may be to minimize the number of temporary tables
    created in tempdb, but this may not be easy to implement because it would require
    code and application changes. Keep in mind that internal objects, such as the
    ones created by sort and hash operations, are not created explicitly by users
    and do not require the allocation methods discussed in this section. These internal
    objects, however, create a different kind of performance problem.


    The workaround for tempdb contention problems has historically been one or both
    of the following choices, especially prior to SQL Server 2016:


    +   * Using multiple data files.

    * Enable trace flags 1117 and 1118.


    # Multiple tempdb Data Files


    With multiple files for tempdb, allocation bitmaps will be spread across the files,
    minimizing contention, because SQL Server will balance incoming requests across
    them. Using multiple files can help with PFS and SGAM pages, and using trace flag
    1118, as discussed in the next section, can greatly minimize the use of SGAM pages
    as well.


    One question has been debated for using multiple data files is what the optimal
    number of files for tempdb should be. Because applications use tempdb in many
    ways and can have different workloads, it is difficult to recommend a specific
    number for every scenario. Fortunately, there is a good recommendation that can
    work in most cases: create one data file per logical processor available to the
    SQL Server instance, up to a maximum of eight files. This recommendation is now
    a default configuration option for tempdb when you install SQL Server 2016 or
    later on Windows, but it has to be manually configured for SQL Server on Linux.
    SQL Server creates a scheduler for each logical processor available to SQL Server,
    so the number of logical processors is also the maximum of concurrent threads.
    Having multiple files means multiple PFS and SGAM pages, which means more allocations
    can occur at a time, reducing contention as threads are not waiting for one set
    of allocation pages.


    This is a general guideline, however, and there may be cases in which high tempdb
    usage may still encounter contention problems. In such cases, it may be wise to
    create additional data files in multiples of four, up to the number of logical
    processors available in the system. Data files on tempdb also be created with
    the same size and have the same autogrow setting.


    You can easily add more files to tempdb using SQL Server Management Studio (SSMS)
    or Transact-SQL, as shown in Figure 4-2.'
