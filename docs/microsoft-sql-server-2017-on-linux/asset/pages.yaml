    # Installing on Ubuntu


    You''ve seen the entire process of installing and configuring SQL Server 2017
    using Red Hat Enterprise Linux. Let''s now install SQL Server on Ubuntu. After
    this I''ll focus only on what is different compared with the previous Red Hat
    installation. Let''s start by creating a virtual machine running Ubuntu.


    Open the Microsoft Azure machine image portal. In the Search field, enter Ubuntu.
    This will show you a few results. Select Ubuntu 16.04 LTS. Every Linux installation
    must have at least 3.2GB of memory for a SQL Server 2017 installation, or at the
    moment your virtual machine image on the gallery has at least that memory, so
    this should not be a problem. You need to be careful with this, if you are creating
    the virtual machine using other methods or if you''re installing the operating
    software yourself.


    Follow the steps described in the "Creating a Virtual Machine" section earlier
    in the chapter. Once you have a virtual machine running and you are able to connect
    to it, run the statements to get the public repository GPG keys (more on this
    in a moment):


    ```

    curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add key

    ```


    Next, run the following statements to register the SQL Server Ubuntu repository:


    ```

    curl https://packages.microsoft.com/config/ubuntu/16.04/mssql-server-2017.list
    | sudo tee /etc/apt/sources.list.d/mssql-server.list

    ```


    As Red Hat Enterprise Linux, this was the cumulative update repository. The GDR
    repository is at https://packages.microsoft.com/config/ubuntu/16.04/mssql-server-2017-grdr.list,
    and the preview repository is at https://packages.microsoft.com/config/ubuntu/16.04/mssql-server.list.


    Finally, run the following commands to install SQL Server:


    ```

    sudo apt-get update

    sudo apt-get install -y mssql-server

    ```'
