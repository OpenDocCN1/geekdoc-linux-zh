    # Always Encrypted


    Always Encrypted is a client-side encryption technology designed to protect sensitive
    data. The data remains encrypted in the database engine all the time, even during
    query processing operations. In addition, Always Encrypted is the only SQL Server
    security feature that can provide a separation between the entities that provide
    the data and access it and those that only need to manage the data but not access
    it. This means that in an Always Encrypted configuration, only the required applications
    and users can access and see the data. Always Encrypted was introduced as an Enterprise
    Edition-only feature with SQL Server 2016, after Service Pack 1 it is now available
    on any SQL Server.


    A typical scenario for using Always Encrypted would be when the data is hosted
    by a cloud provider such as Microsoft Azure and the client application is on premises.
    In this case, cloud administrators would not have access to see the data they
    administer. A second scenario would be in the cases, either on premises or in
    the cloud, where database administrators are not required to access the data.
    The database stores only encrypted values, so database administrators or any privileged
    user won''t be able to see the data.


    Always Encrypted data could be a challenge to the query processor. Query performance
    may be impacted when some operations are performed on encrypted columns, since
    the query optimizer may not have information about the real data distribution
    and values of these columns. The way the columns are encrypted query processing
    and performance implications when the columns are used for index lookups, equality
    joins, and grouping operations. Because of these implications, Always Encrypted
    uses a method that encrypts data in a less predictable manner and randomized encryption.
    Randomized encryption can be used when you do not need to use these columns for
    query-processing operations—for example, with credit card information. Deterministic
    encryption always generates the same encrypted value for any given plain-text
    value and is better suited for use in the query processing operations mentioned
    earlier such as index lookups, equality joins, and grouping operations.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Microsoft SQL Server 2017 on Linux


    To help with these query processing limitations, a future enhancement of Always
    Encrypted has been recently announced which will include rich computations on
    encrypted columns, including pattern matching, range comparisons, and sorting.
    The feature is Always Encrypted with secure enclaves where an enclave is a protected
    region of memory that acts as a trusted execution environment. In addition, this
    feature will provide in-place encryption, helping with schema that change cryptographic
    operations on sensitive data. For more details about Always Encrypted with secure
    enclaves you can read the following article https://blogs.msdn.microsoft.com/sqlquery/2017/10/05/enabling-confidential-computing-with-always-encrypted-enclaves-early-access-preview/


    Some of the tasks required to implement the Always Encrypted feature are not supported
    by T-SQL, as by definition, the database engine cannot be involved in data encryption
    and decryption operations. These tasks need to be done at the client side. You
    can use PowerShell or SQL Server Management Studio. I''ll show you how to use
    the Always Encrypted Wizard on SQL Server Management Studio next; this can also
    optionally generate a PowerShell script to implement the wizard selections. In
    the summary, the database engine is not involved with provisioning master keys,
    column encryption keys, and encrypted column encryption keys with their corresponding
    column keys.


    Finally, the client application needs to be aware of which columns are using Always
    Encrypted and should be coded accordingly.


