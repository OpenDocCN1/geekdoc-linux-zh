  md: '# Chapter 4: SQL Server Configuration


    To set the SQL Server memory limit, for example, you can use the memory .memorylimitmb
    setting, as shown next:


    ```

    /opt/msql/bin/mssql-conf set memory.memorylimitmb 51200

    SQL Server needs to be restarted in order to apply this setting. Please

    run ''systemctl restart mssql-server.service''.

    ```


    As with any of the mssql-conf changes, you will need to restart SQL Server to
    apply the changes:


    ```

    systemctl restart mssql-server.service

    ```


    By default, SQL Server, only when running on Linux, can use up to 80 percent of
    the physical memory available on the server. But in some cases, as in a server
    with

    a large amount of memory, this default may not be appropriate, leaving some memory

    unused. Let''s say; for example, that you have 512GB of memory on a dedicated

    database server. With the default 80 percent allocated to SQL Server, it would
    leave

    more than 100GB for the operating system. A large part of that memory could be

    allocated to SQL Server as well.


    In a similar way, to set the default SQL Server data directory, you can use the

    filelocation.defaultdatadir setting as shown next, assuming the directory exists:


    ```

    /opt/msql/bin/mssql-conf set filelocation.defaultdatadir /data/sql

    SQL Server needs to be restarted in order to apply this setting. Please run

    ''systemctl restart mssql-server.service''.

    ```


    In this specific case, you would also need to grant the proper permissions to
    the

    mssql group and user to the data directory:


    ```

    chown mssql /data/sql

    chgrp mssql /data/sql

    ```


    You can also change the default directory for the transaction log files using
    the

    filelocation.defaultbackupdir setting. To set the default directory for backup

    files in a similar way, you can use the following:


    ```

    /opt/msql/bin/mssql-conf set filelocation.defaultbackupdir /data/backups

    SQL Server needs to be restarted in order to apply this setting. Please run

    ''systemctl restart mssql-server.service''.

    ```'
