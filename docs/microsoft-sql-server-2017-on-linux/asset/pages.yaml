  md: '# Chapter 1: SQL Server on Linux: Getting Started


    # Installing SQL Server


    Now we will download and install SQL Server. First we need to connect to the created
    Linux virtual machine—but to do that, we need a terminal emulator that can support
    an SSH session. A popular and free terminal emulator is PuTTY, which you can download
    from putty.org.


    To connect, we need the public IP address provided earlier on the virtual machine
    details (Figure 1-5) and the user name and password provided during the configuration
    (Figure 1-2). Figure 1-8 shows example of opening an SSH session using PuTTY.
    SSH is a cryptographic network protocol and a suite of utilities that implement
    the protocol. It is used to connect computer systems and designed as a replacement
    for other unsecured protocols such as telnet, login, and rsh. (I remember using
    telnet before SSH was available.) SSH uses the standard TCP port 22, which is
    selected by default in Figure 1-8.


    Once you are connected to the server, you will see the Linux prompt ($), or more
    exactly, the Bash prompt. It may also contain the username and hostname:

    `bnevarez@sqllinux~$`


