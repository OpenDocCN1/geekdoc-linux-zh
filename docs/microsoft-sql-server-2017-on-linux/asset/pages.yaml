  md: '# Chapter 2: How SQL Server on Linux Works 45


    # SQLOS


    As mentioned, SQLOS was another very important development for the future Linux
    implementation. SQLOS was a new operating system layer whose purpose to provide
    the database engine with performance and scalability improvements by exploiting
    the new available hardware capabilities and providing the database engine with
    more specialized services than the general ones operating system can offer.


    SQLOS was first available on the SQL Server 2005 release. Although in part SQLOS
    was created to remove or abstract away the operating system dependencies, it was
    originally intended to provide platform independence or portability, to by helping
    in the database engine to other operating systems. Its first purpose was to exploit
    the new available hardware capabilities, including Symmetric Multithreading (SMT)
    and multi-CPU configuration with multiple cores per socket, computers with very
    large amounts of memory, non-uniform memory access (NUMA) systems, and support
    for high memory and CPU adds and removals. Database engines could benefit from
    these new hardware and hardware trends.


    SQLOS also became the SQL application layer responsible for managing all operating
    system resources, and it was responsible for managing nonpreemptive scheduling,
    memory and buffer management, I/O functions, resource governance, exception handling,
    deadlock detection, and detection events. SQLOS performs these by making calls
    to the operating system on behalf of other database engine layers or, as in cases
    of scheduling, providing services optimized for the specific needs of SQL Server.
    The SQLOS architecture is shown in Figure 2-1.


    The main architecture decision behind SQL replaced some of the available operating
    system services. Operating system services are general-purpose services and are
    sometimes inappropriate for database engine needs, because they do not scale well.
    Instead of using generic scheduling facilities for any process, scheduling can
    be optimized and tailored to the specific needs of a database engine, in this
    case, SQL Server. The main difference between the two is that a Windows is a preemptive
    scheduler, while SQL Server, the decision was to use a cooperative scheduler (also
    nonpre scheduler). This implementation improves scalability, because having threads
    yield voluntarily is more efficient than involving the Windows kernel to prevent
    a single thread from monopolizing a processor.


    The most important objects on SQLOS are memory and CPU nodes, schedulers, and
    tasks. Sulers are easily well and known to the SQL Server user through the use
    of dynamic management views (DMVs) as sys.dm_os_schedulers In SQL Server, each
    request is an operating system thread, and when a client connects, it is assigned
    to a specific scheduler. Tasks are handled at the SQLOS level, which also handles
    tasks and workers, among other functions. For example, the SQL Server task execution
    process is shown in Figure 2-2. SQL Server schedulers were introduced with SQL
    Server 7, but that version still relied on the Windows scheduling facilities.'
