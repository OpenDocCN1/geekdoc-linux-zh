    \ the idea of \"separation of concerns.\" A particular mechanism, as scheduling,\
    \ shouldn't actually care what the scheduling policy is. It should delegate responsibility\
    \ to the policy itself, which should be swappable / configurable. By providing\
    \ a common interface for policies, it makes easier for people define their own\
    \ own without actually being concerned with how its implemented; they can trust\
    \ the mechanism to do the right thing based on their policy.\n\n> What does the\
    \ principle “optimize for the common case” mean?\n\nIt's pretty self-explanatory;\
    \ the design should be optimized for the way it's most likely to be used. For\
    \ example, the “interrupts as threads” design is beneficial to overall system\
    \ performance despite the fact that there is a cost incurred for interrupts, there\
    \ are savings on every mutex/lock/operation. Because the latter occurs more frequently\
    \ than the former (common case), it's an overall gain.\n\n> What happens during\
    \ a user-kernel mode crossing, and what are some of the reasons why user-kernel\
    \ mode crossings?\n\nThis “crossing” is known as a system call. These special\
    \ cases are the only means through which users can interact with the system in\
    \ a privileged way. Here's what happens, to some granularity of detail:\n\n- A\
    \ permission flag is set in the kernel that indicates ‘kernel mode’ privileges.\n\
    - The program jumps to the kernel interrupt handler. based on the system call\
    \ parameters) will jump to the system call requested.\n- The system calls executing\
    \ in the kernel. This involves things checking parameters (safety) copying data\
    \ from userspace,\n- The requested action is taken (such as telling a driver to\
    \ read bytes and put them in a particular memory location).\n\nPrimarily, these\
    \ crossings involve interaction with privileged resources and hardware. For example,\
    \ applications reading from a file (read()), requesting more (map()), creating\
    \ network resources (socket()), are all examples of actions that require entering\
    \ kernel mode. Crossings can also occur if users violate rules. If a user tries\
    \ to access a privileged memory address (recall that part of the process address\
    \ space is reserved for the OS), the CPU will trigger a trap (!) and the kernel\
    \ will take control to investigate.\n\nSimilarly, the boundary can be crossed\
    \ in the “opposite direction” by a signal occurs if the program has the appropriate\
    \ signal mask enabled, the kernel will transfer control to its signal handler.\n\
    \n> What is a kernel trap? Why does it happen? What are the steps that take place\
    \ during a kernel trap?\n\nThough the trap and interrupt are sometimes used interchangeably,\
    \ for the sake of differentiating them from the “latter as an interrupt?”, we\
    \ will say that a kernel trap is a kernel interrupt that occurs in “exceptional”\
    \ conditions. Exceptional cases are those where errors are encountered. This could\
    \ be like a disk read failure or a user process attempting to access protected\
    \ memory.\n\nDuring a kernel trap, control is given to the kernel's interrupt\
    \ handler with certain parameters (the type of arguments, etc.), and the handler\
    \ will inspect the cause of the trap. If it's caused by the user, it will take\
    \ action accordingly; this could mean terminating the process, returning an error\
    \ code to the trap-causing function.\n\n1 You just activated my trap card \n2\
    \ For example, pressing Ctrl+C in your program will trigger SIGINT.\n\n# MIDTERM\n\
    # April 15, 2019\n\nContrast the design decisions and performance tradeoffs among\
    \ monolithic, modular and microkernel-based OS designs.\n\nEach of these designs\
    \ has trade-offs, from efficiency to maintainability.\n\n# Monolithic OS: These\
    \ include FreeBSD, OpenBSD, Solaris, and MS-DOS.\n\nThis design contains every\
    \ service/abstraction at the kernel level. It is first and historical OS design:\
    \ every service an application could be part of the OS. This includes memory managers,\
    \ drivers, file management, processes/threads, scheduling, file systems for random\
    \ and sequential access, etc.\n\n**Benefits:** Everything is included in the OS.\
    \ all the services and everything is packaged at the same time. This creates the\
    \ possibility for **compile time optimizations.**\n\n**Disadvantages:** Too much\
    \ stuff, too much that's hard to maintain, debugging and upgrading. The size poses\
    \ large memory requirements that can negatively affect performance.\n\n# Modular\
    \ OS: This include most modern operating systems, including WinNT, macOS, and\
    \ Linux.\n\nThis design carries basic services and APIs at OS level; everything\
    \ can be added as a module. This design delivers significant improvements over\
    \ monolithic's OS due to its simplicity and \"plug-and-play\" approach. With this\
    \ design, you can customize which file system or scheduler the OS uses. The **OS\
    \ specifies interfaces** that any module must implement to be part of the OS,\
    \ making it possible to install modules that are applied for different workloads,\
    \ instead of having the OS contain all modules.\n\n**Benefits:** OS are easier\
    \ to maintain (patching, new modules, etc.) and upgrade. Smaller size and less\
    \ resource-intensive code means more memory is available to applications; this\
    \ can lead to performance.\n\n**Disadvantages:** Because of the lacks of abstraction\
    \ and defining the OS-module layer, there is a performance impact due to the bigger\
    \ call stack and more general-purpose code required. We also lose out on inlining\
    \ and compile-time operations on the system as a whole (because there is no \"\
    whole\" anymore). These aren't very significant on modern-day hardware, however,\
    \ the modular architecture means that code can come from many different places;\
    \ this tracking the down of an error more complex, and development spans many\
    \ groups and codebases.\n\n# Microkernel OS: This used more historically, or in\
    \ embedded systems. It includes kernels MINIX 3, Mach, and QNX.\n\nThese operating\
    \ systems include only the most primitives at the OS level; this is just the necessities\
    \ for executing applications (address spaces, threads). Everything else, including\
    \ file systems, device drivers, etc., are outside of the kernel level. This model\
    \ requires a lot of process interaction, which the kernel must support (well)\
    \ as one of its cores.\n\n**Benefits:** These kernels are small: less overhead\
    \ and better performance for kernel code. Testing is another benefit; it's easier\
    \ to verify that behaves as intended. Thus, microkernels are valuable in cases\
    \ where this is a critical aspect of the system more than performance (typically\
    \ embedded devices and controls).\n\n**Disadvantages:** Portability is questionable;\
    \ the kernel is tailored for particular hardware and can be highly-specialized\
    \ for the expected case(s). Thus, it's harder to find common components for software,\
    \ leading to complexity. Finally, as discussed previously, the lack of kernel\
    \ support for common features leads to a lot of IPC and frequent user-kernel crossings,\
    \ which are costly.\n\n# Questions: Part 2\n\n3\n"
  mdcn: "\n\n# CS6200 中期考试复习\n\nGeorge Kudrayavtsev\n\n2018年秋季\n\n> 给入场者的一句警告\n我只是一个曾经的学生。我认为这份指南中的大部分内容都是相当正确的，但请不要将这些复习答案视为金科玉律。而且，如果你问我任何关于这些内容的问题，我可能无法回答你，因为我已经忘记了其中\
    \ 80% 的内容。\n入入自负！\n（尽管我非常欢迎各种指正）\n\n# 问题：第一部分\n\n操作系统是应用程序与系统硬件资源之间的关键中介。它为不同的硬件接口提供了通用的抽象，例如，针对硬盘和固态驱动器都提供“文件”对象。它通过虚拟内存通过进程提供安全性，并限制对硬件资源的访问。它通过任务调度算法在多个潜在不相叠的用户及其进程之间强制公平。\n\
    \n你能区分操作系统的抽象（abstractions）、机制（mechanisms）和策略（policies）吗？\n\n| 用户态 | 抽象 |\n| ---\
    \ | --- |\n| ↓ | 机制 策略 |\n\n“机制与策略分离”原则意味着什么？\n\n本质上，这只是系统在更低层次的进一步抽象：针对内核开发者而不是用户。\n\
    这与“关注点分离”的想法相联系。特定的机制（如调度）不应该真正关心的调度策略是什么。它应该将责任委托给策略本身，而策略应该是可轮换/可配置的。通过为策略提供通用接口，它让人们更容易定义自己的策略，而无需实际上担心其实现方式；他们可以信任机制根据他们的策略做正确的事。\n\
    \n> “针对常见情况优化（optimize for the common case）”原则意味着什么？\n\n这显而易见；设计应该针对最可能被使用的方式进行优化。例如，“中断即线程”的设计对系统整体性能有益，尽管中断会产生成本，但在每次互斥/锁/操作中都节省了开销。因为后者的发生频率比前者更高（常见情况），所以这是整体的获益。\n\
    \n> 在用户态和内核态之间切换时会发生什么？用户态与内核态之间切换的某些原因是什么？\n\n这种“切换”被称为系统调用（system call）。这些特殊情况是用户以特权方式与系统交互的唯一手段。以下是发生的过程，按细节粒度划分：\n\
    \n- 内核中设置了一个权限标志位，指示“内核模式”特权。\n- 程序跳转到内核中断处理程序。（根据系统调用参数）将跳转到所请求的系统调用。\n- 在内核中执行系统调用。这涉及检查参数（安全性）、从用户空间拷贝数据等操作。\n\
    - 执行请求的操作（例如告诉驱动程序读取字节并将它们放在特定的内存位置）。\n\n主要，这些切换涉及与特权资源和硬件的交互。例如，应用程序从文件读取内容（`read()`）、请求更多空间（`map()`）、创建网络资源（`socket()`）都是需要进入内核态的动作示例。如果用户违反规则，也会发生切换。如果用户尝试访问特权内存地址（回想进程地址空间的一部分是为操作系统预留的），CPU\
    \ 将触发陷阱（trap !），内核将接管控制权进行调查。\n\n同样，边界也可以在“相反方向”被跨越，例如发生信号（signal），如果程序启用了相应的信号掩码，内核将控制权转移给其信号处理程序。\n\
    \n> 什么是内核陷阱（kernel trap）？它为什么发生？内核陷阱发生期间会有哪些步骤？\n\n虽然陷阱（trap）和中断（interrupt）有时互换使用，但为了将它们与“后者作为中断”区分开来，我们认为内核陷阱是指在“异常”条件下发生的内核中断。异常情况是指遇到错误的情况。这可能类似于磁盘读取失败或用户进程尝试访问受保护的内存。\n\
    \n在内核陷阱期间，控制权被交给内核的中断处理程序，并带有某些参数（参数的类型等），处理程序将检查陷阱产生。如果是由用户引起的，它将采取采取；这可能意味着终止进程，或向导致陷阱的函数返回错误代码。\n\
    \n1 你刚刚触发了我的“陷阱牌（trap card）” \n2 例如，在你的程序中按 Ctrl+C 将触发 SIGINT。\n\n# 中期考试\n# 2019年4月15日\n\
    \n对比单体内核（monolithic）、模块化（modular）和基于微内核（microkernel）的操作系统设计的设计决策和性能权衡。每这些设计各有一个权衡，从效率到可维护性不等。\n\
    \n# 单体操作系统：这些包括 FreeBSD、OpenBSD、Solaris 和 MS-DOS。\n\n这种设计在内核级包含每一个服务/抽象。它是最早且历史性的操作系统设计：应用程序可以作为操作系统部分的每一个服务。这包括内存管理器、驱动程序、文件管理、进程/线程、调度、针对随机和顺序访问的文件系统等。\n\
    \n**优点：** 一切都包含在操作系统中。所有的和服务一切内容被打包在一起。这产生了**编译时优化（compile time optimizations）**的可能性。\n\
    \n**缺点：** 东西太多，太多难以维护的内容，调试也困难。\n\n# 模块化操作系统：这些包括大多数现代操作系统，包括 Windows、macOS 和\
    \ Linux。\n\n这种设计在 OS 级携带基本服务和 API；其他所有都可以作为模块添加。这种设计由于其简单性和“即插即用”的方法，相对于单体内核有了显著改进。通过这种设计，你可以自定义操作系统使用的文件系统或调度器。**OS\
    \ 指定了接口**，任何模块必须实现，而不是让操作系统包含所有模块。\n\n**优点：** 操作系统更容易维护（补丁、新模块等）和升级。更小的体积和更少资源密集型代码意味着内存可用；这可以提高性能。\n\
    \n**缺点：** 由于缺乏抽象和对 OS 模块层的定义，由于更大的调用栈和更多的通用代码需求，存在性能影响。我们还失去了对整个系统的内联和编译时操作（因为已经没有“整体”了）。\n\
    \n# 微内核操作系统：这种在历史上更多，或在嵌入式系统中。它包括内核 MINIX 3、Mach 和 QNX。\n\n这些操作系统在 OS 级仅包含最基本的原语；这只是执行应用程序的必需品（地址空间、线程）。其他所有内容包括文件系统、设备驱动程序等，都在内核级之外。这种模型需要大量的进程交互，内核必须作为其核心之一对此提供良好的支持。\n\
    \n**优点：** 这些内核很小：开销更少，内核性能更好。测试是另一个优点；更容易验证其运行符合预期。因此，在某些方面比性能更关键的情况下（通常是嵌入式设备和控制系统），微内核非常有价值。\n\
    \n**缺点：** 可移植性存疑；内核是针对特定硬件定制的并且针对预期的用例高度专门化。因此，软件更难找到通用组件，导致了复杂性。最后，正如之前讨论的，对常见功能的缺乏会导致大量的\
    \ IPC（进程间通信）和频繁的用户态-内核态切换，这些都是昂贵的。\n\n# 问题：第二部分\n\n3\n\n"
