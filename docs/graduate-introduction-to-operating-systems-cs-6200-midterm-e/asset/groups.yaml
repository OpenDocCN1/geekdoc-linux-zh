- md: '

    ## Process vs. thread, describe the distinctions. What happens on a process vs.
    thread switch.


    Both processes and threads are units of execution. A process represents the current
    state of a program''s execution; every new launch of the program results in a
    new process. Their distinction is mainly the details are stored in the kernel.
    A process is the "parent" of its threads; Info is stored in the process control
    block (or PCB) and contains details like the virtual address mapping, the signal
    handler(s), any open file descriptors, etc. On the other hand, things like register
    state, respective stack pointer, thread-local storage that cannot be accessed
    across threads, individual signal handlers.


    When switching context, the entirety of the current PCB is swapped out for another
    process''s PCB. This means that the new process now has access to the CPU and
    the old process is no longer executing. A context switch empties the cache (cold
    cache), so the new process has to "start from scratch" in terms of the memory
    it needs, which is a performance penalty.


    When there is a thread switch, only the thread items are swapped out. Data accessed
    could remain in the cache. The address space mapping also stays the same, since
    we are still within the same PCB. There is still quite a lot of stuff to swap
    out, though,


    ## Describe the states in a lifetime of a process.


    Processes are in four "primary" states: running or idle. Various actions move
    the process between these states and to the other states.


    As you see in Figure 1, many stages that a process goes through. When a process
    is initially created, it is in the new state. It''s placed on the ready queue.
