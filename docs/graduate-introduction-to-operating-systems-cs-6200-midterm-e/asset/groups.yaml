    (ii) 情况，尽管随着同时处理多个请求性能略有提高，但随着线程的增加，性能呈崖式下跌（比预期的更长）。这被称为**磁盘抖动**，它在很早就会发生。缓存被不断失效，随着线程的增加，性能迅速下降，尽管最初有所改善。


