    # 期中考试 1 2019年4月15日


    关于 Flash？


    基于事件的模型有许多优点：内存需求较低、没有上下文切换、用于数据合并的“通信”成本较低（例如请求日志或统计跟踪）。它的局限性在处理磁盘密集型请求时会显现出来；单个阻塞操作会停止整个服务器。在过去，还存在支持
    I/O 的问题；并不是每个操作系统都支持它，即使支持，它们也可能做得不够正确或不够方便。讲座中提到的一个局限性是，在多 CPU 环境下，基于事件的方法存在某些开销；路由和分发方面存在复杂性。


    这些局限性是为 Flash Web 服务器引入 AMPED 模型的全部初衷：它结合了基于事件的请求效率与 `mmap` 文件 I/O 处理的非阻塞优势。就像
    MT 将 MP 甩在身后一样，我想 AMTED 同样会将 AMPED 甩在身后。论文本身指出，AMPED 被认为是一种具有移植性的架构。这对于 AMTED
    来说不再是一个问题，它可能更于此。


    > 演示中讨论了 Flash 论文中的几组实验结果。你是否理解每个实验的目的（要回答什么问题？）？你是否理解为什么实验是以特定的方式构建的（为什么选择这些变量进行变化、负载参数、指标……）


    对比图有点难以跟进，我们使用的术语/缩写在这里定义。基础模型是 AMPED 模型（还有使用线程的 AMTED，但未进行对比），它与其各种变体进行对比，这些变体在用其他架构替换主模型的同时，保持了他们概述的相同性能优化。MP
    和 MT 变体指的是他们专门为性能比较开发的多进程和多线程模型。MP 应该被认为类似于 Apache，而 SPED（AMPED 的辅助模型，即纯单进程模型）在设计上类似于
    Zeus。


    在说完这些话之后，让我们进入每项性能比较的总结。在所有场景中都有一个共同的现象：Apache 的规格相对于其他模型较低，他们试图将此温和地归因于它没有采用他们所使用的同种“激进优化”。某些
    Flash（通常是 AMPED）几乎总是优于 Zeus，但在概述出的一个特殊情况下外。此外，由于该架构昂贵的进程间通信，MT 的性能优于 MP，但 MT 并不总是如此。


    合成负载：客户端请求多个文件，每个请求的文件大小不一。


    曲线是相同的，性能随之增加而提高。SPED 和 AMPED 难鼓相敌（记住这些都是 Flash 的变体），SPED 略占优势，是因为 AMPED 必须进行一些额外的检查，这些检查在后续负载中提供了更好的性能。


    这有力地测试了缓存负载上的性能，因为在第一次请求后，（相同的）响应就在内存中。


    基于跟踪的负载：这些负载基于两个不同系统的跟踪：CS 跟踪和 Owlet 跟踪，最新的数据集要小得多且对缓存友好。


    AMPED 在所有方面都具有最佳吞吐量；其后的是针对 Owlet 的 SPED（缓存友好），以及针对 CS 跟踪的 MT（磁盘密集）。


    真实世界负载：来自真实世界的日志被处理并截断到特定大小，以测试不同的数据集和工作集大小。


    # 期中考试 1

    # 2019年4月15日


    在超出缓存之前，SPED 优于 AMPED，AMPED 优于 Zeus。然后，在一个短范围内（约 100-110MB），Zeus 优于 AMPED，AMPED
    优于 SPED。这归因于 Zeus 优先处理小型文档请求。之后，AMPED 优于 Zeus。结论是 AMPED 是他们的目标中的**通用架构**。


    **Flash 优化比较：** 针对相同的重复请求测试了不同的优化。

    他们比较的优化是**内存映射文件**（本质上在内存中缓存文件内容）、**响应头缓存**（使用预先制作的头进行响应）以及**路径翻译缓存**（通过存储在内存中避免查找和解析）。后者对其实际影响最大。*在没有任何优化的情况下*，Flash
