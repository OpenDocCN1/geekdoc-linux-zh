    Until the cache is exceeded, SPED beats AMPED beats Zeus. Then, there''s a short
    range (approx. 100-110MB) in which Zeus beats AMPED beats SPED. This is attributed
    to Zeus prioritizing requests for small documents. After that, AMPED beats Zeus.
    The conclusion is that AMPED is the **general-purpose architecture** which was
    their goal.


    **Flash optimization comparison:** Different optimizations were tested against
    identical repeated requests.

    The optimizations that they compared were **memory-mapped files** (essentially
    caching file contents in memory), **response header caching** (responding with
    a pre-made header for identical requests), and **caching pathname translation**
    (avoiding the lookup and parsing by storing in memory). The latter of these was
    actually the most impactful on its. *Without any optimizations*, Flash''s performance
    halves relative to all of them enabled.


    **WAN comparison:** Longer-lived connections stress-test in simultaneous requests.


    In this, AMPED, SPED, and MT are very similar. MT starts ahead until about 200
    clients, after which SPED pulls ahead. AMPED would likely out-perform SPED once
    caches were insufficient.


    > If you run your server for the class project for two different traces: (i) many
    requests across a very large pool of very large files, what do you think happen
    as you add more threads to your server? Can you sketch a hypothetical graph?


    Requests for the same file will benefit greatly from caching, requests for a variety
    of large files will trash the disk very early on. This is results in a trend similar
    to [Figure 3]()


    For (i), even if the file is larger than the available cache, requests will still
    hit a hot cache very often. Then, throughput is nearly linear as the number of
    threads increases. Even, though, context switches for every request will be cheaper
    than the benefit of serving a cached file. For the (ii) case, despite a slight
    increase in performance as multiple requests are handled simultaneously, performance
    drops like a rock as threads increase increasing on (longer than they would).
    This is called **disk trashing**, and it occurs very early on. Caches are constantly
    invalidated and performance suffers quickly as more threads are added, despite
    improving a bit at first.


