    Signaling. With 1: threads, there is no management of signal masks. The kernel
    will deliver signals to its user thread if the mask is enabled, period.


    > Can you explain why some of the mechanisms described in the Solaris OS (for
    configuring the degree concurrency, for signaling, the use of LWPs...) are not
    used or necessary in the current threads model in Linux?


    This is touched on by the simplicity of the “Linux Threading Model” breakdown
    of the previous question, but we can go into detail here. Degree concurrency is
    used by the mx model to control the amount of multiplexing ULTs to LWPs (and thus
    KTs). More degrees means less deduction of a KT to a particular unit. With 1:1
    each ULT gets a KT; there is no worry about concurrency. Signaling is simpler
    because the KT signal mask always reflects the ULT; there is no multiplicity to
    have a global handler and thread masks. The light-weight processes are because
    all the data for a thread is stored within the thread itself; shared data across
    is stored in their PCB.


    > What''s an interrupt? What happens during interrupt or signal handling? How
    does the OS know to respond to an interrupt or signal? Can each process configure
    their own handler? Can each thread have their own signal handler?


    Interrupts are hardware-triggered events that indicate to the kernel that something
    needs to be handled. Similarly, signals are software-triggered events that indicate
    that something needs to be handled (or is handled for, certain signals like SIGXILL),
    the kernel has an interrupt table which jumps to a particular subroutine depending
    on the interrupt type. For signals, the process has a signal handler which enables
    certain signals using a thread-specific signal mask. The kernel calls the handler
    if the mask allows (i.e. has the bit set) the signal.


    > What''s the potential issue if an interrupt or signal handler leads to a mutex?
    What''s the workaround described in the Solaris papers?


    If code is executing and acquires a lock, then an asynchronous event that triggers
    a handler (interrupting the ongoing execution) and handler tries to acquire the
    same lock, then a deadlock will occur one time after the lock is released. For
    interrupts, this is also viable, mitigated by spiking a signal. Instead, to clear
    the signal mask so that the expensive signal is ignored (or marked as pending)
    during the critical section and reset it.


    > Contrast the pros-and-cons of a multithreaded (MT) and multiprocessing (MP)
    implementation of a webserver, as described in the Flash paper.


    Honestly, an MP server doesn''t have any pros over an MT server on modern-day
    systems. It is used because it was portable: kernel-level multi-threading support
    wasn''t as ubiquitous as it is. However, MT wins in performance because synchronization
    across threads is much cheaper than the high cost of IPC in an MP architecture.


