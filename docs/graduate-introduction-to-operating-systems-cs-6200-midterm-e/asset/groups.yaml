    # MIDTERM 1 April 15, 2019


    throughput or response time, what could you do in a pipelined model? What are
    the limiting factors in improving performance with this pattern?


    The pipelined multithreading pattern divides a task into disjoint stages and assigns
    workers to each of these stages. Each worker has a queue of pending inputs, which
    are the outputs of the previous stage.


    Suppose a 2-stage pipeline has a first stage (10ms) but a slow second stage (100ms).
    This means that the bottleneck is the second stage. If two tasks are submitted
    simultaneously the first stage ($T_1$) takes 110ms, but the second stage ($T_2$)
    takes 210ms to complete:


    | Time (ms) | Stage 1 | Stage 2 |

    | --- | --- | --- |

    | $t_0$ | $T_1$ | Stage 1 pending: $[T_2,\dots]$ |

    | $t_{10}$ | | $T_1$ |

    | $t_{20}$ | $T_1$ | Stage 2 pending: $[T_2,\dots]$ |

    | $t_{110}$ | | $T_2$ |

    | $t_{210}$ | | $T_2$ |


    Generalize this, the time $T(t)$ it takes for $n$ tasks to complete an $x$-stage
    pipeline in the naive model of a single thread per stage can be calculated as:


    $T = T_1 + ((n - 1)t_{max})$


    Where $T_1$ is the time it takes to complete the first task (i.e. the duration
    of the entire pipeline) and $t_{max}$ is the time it takes to complete the *longest*
    stage.


    **Improving throughput.** Notice how the queue builds up for the longest possible
    stage, and this build-up accumulates a task-delay for the rest of the pipeline
    and severely hinders throughput. To alleviate this delay, longer tasks can have
    additional workers! In this way, each stage stage takes more threads should be
    available to keep the queue from building up. For a 3-stage pipeline with stages
    taking 10, 30 and 20ms respectively, the second stage could have 3 workers and
    the third stage has 2 workers. This brings the time *every* task to 60ms instead
    of the first task. In this case (i.e. tiered stages such that each stage can keep
    up with the output of the previous stage), the formula holds on whatever the fastest
    stage:


    $T = T_1 + ((n - 1)t_{min})$


    **Improving response time.** What''s interesting about this model is that improving
    throughput also improves response time! By allowing each stage to process more
    requests simultaneously, it takes to process an individual request. Again, the
    longest stage causes the build-up, so improving an task''s response time can be
    achieved by optimizing the slowest stage.


    What''s a simple way to prevent deadlocks? Why?


    The most-accepted solution for preventing deadlocks is to **maintain a lock order**.
    This means that all locks are taken in the same order, regardless of the unit
    of execution they require. It ensures that no threads are ever conflicting in
    access to separate locks, since they will need to wait on the previous lock first.


    This works because it prevents a cycle in the "wait graph." Cycles cause deadlocks,
    and the absence of a cycle means a deadlock cannot occur, because there is always
    a resolution order.


