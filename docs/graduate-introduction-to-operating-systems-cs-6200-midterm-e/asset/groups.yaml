    ## 进程与线程，描述它们的区别。在进程切换和线程切换时会发生什么？


    进程和线程都是执行 单元。进程代表程序执行的当前状态；程序的每次启动都会产生一个新进程。它们的主要区别在于细节存储在内核中。进程是其线程的“父级”；信息存储在进程控制块（PCB）中，包含如虚拟地址映射、信号处理器（handler）、任何打开的文件描述符等细节。另一方面，诸如寄存器状态、各自的栈指针、无法跨线程访问的线程本地存储、各个独立的信号处理器等是线程的。


    在进行上下文切换时，整个当前的 PCB 会换出并替换为另一个进程的 PCB。这意味着新进程现在可以访问 CPU，而旧进程不再执行。上下文切换会清空缓存（冷启动/缓存），因此新进程在它所需的内存方面必须“从头开始”，这造成了一种性能开销。


    当发生线程切换时，只有线程相关的项会被换出。访问的数据可能仍留在缓存中。地址空间映射也保持不变，因为我们仍然在 PCB 中。尽管如此，仍然有很多东西需要换出。


    ## 描述进程生命周期中的状态。


    进程处于四种“主要”状态：运行（running）或空闲（idle）。各种操作使进程在这些状态与其他状态之间移动。


    如图 1 所示，进程会经历的许多阶段。当进程最初被创建时，它处于新建状态（new）。它被放在就绪队列中。从那里，它在内核调度器上进入运行状态（running）。如果它执行“阻塞”操作（例如磁盘读取），这会导致进程等待
    I/O，它会被移动到等待队列（waiting），直到该操作完成（通常通过中断）。然后，它就就绪了（ready）。即使它没有阻塞任何 I/O，当被调度器中断时，它仍然回到就绪队列，因此它不会无限期占用处理时间。当它完成后，终止状态（terminated）最终会被内核清理。


    ![](img/1250e62c383dbb8b9d771b210db4a869_3_0.png)


    图 1：Solaris 进程生命周期。


    ## 描述线程的生命周期。


    线程的生命周期与进程非常相似；在 Linux 中，它并不真正跟踪“进程”的内容，一切都被视为“任务”（task）或线程。


    然而，如图 2 所示，有许多情况。如果线程在同步变量上阻塞，它会进入 SLEEP 状态，这类似于进程的 WAITING 状态。还有线程暂停（thread parking）的概念，这是对上下文切换的一种优化。线程暂停的“park”类似于某些内核中的“set”操作；它可以立即恢复线程，而不是进行上下文切换、检查队列等。当绑定线程阻塞时（因为其
    LWP 无法再做任何事情），或者当非绑定线程阻塞且没有更多可运行（RUNNABLE）线程时（无物可切换），就会暂停。


    ![](img/1250e62c383dbb8b9d771b210db4a869_3_1.png)


    图 2：Solaris 线程库生命周期。


    ## 中期考试 2019年4月15日


    需要提到的一个重要点是 ZOMBIE（僵尸）状态和线程收割（reaping）的概念。处于 ZOMBIE 状态的线程被认为已死亡，但其资源尚未被回收。当线程完成任务后，它进入
    ZOMBIE 状态，但发生的情况有两种变体：


    - 分离线程（detached thread）退出，它在“死囚”列表上，表示它最终会被收割线程（reaper thread）清理。

    - 当未分离的线程（undetached thread）退出时，在另一个 join() 调用它之前什么都不会发生，这会导致它被收割。


