    对于吞吐量或响应时间，在流水线模型中你可以做什么？使用这种模式提高性能的限制因素是什么？


    流水线多线程模式将任务划分为互不相交的阶段，并为每个阶段分配工作线程。每个工作线程都拥有一个等待输入的输入队列，这些输入是上一个阶段的输出。


    假设一个 2 阶段的流水线有一个第一阶段（10ms）但缓慢的第二阶段（100ms）。这意味着瓶颈在第二阶段。如果同时提交两个任务，第一阶段（$T_1$）需要
    110ms，但第二阶段（$T_2$）需要 210ms才能完成：


    | 时间 (ms) | 阶段 1 | 阶段 2 |

    | --- | --- | --- |

    | $t_0$ | $T_1$ | 阶段 1 等待：$[T_2,\dots]$ |

    | $t_{10}$ | | $T_1$ |

    | $t_{20}$ | $T_1$ | 阶段 2 等待：$[T_2,\dots]$ |

    | $t_{110}$ | | $T_2$ |

    | $t_{210}$ | | $T_2$ |


    泛化此，在每个阶段单线程的简单模型中，$n$ 个任务完成 $x$ 阶段流水线所需的时间 $T(t)$ 可以计算为：


    $T = T_1 + ((n - 1)t_{max})$


    其中 $T_1$ 是完成第一个任务所需的时间（即整个流水线的持续时间），$t_{max}$ 是完成*最长*阶段所需的时间。


    **提高吞吐量。** 注意最长阶段的队列是如何堆积的，这种堆积会为流水线的其他部分积累任务延迟，并严重阻碍吞吐量。为了缓解这种延迟，可以为长的任务配备额外的工作线程！通过这种方式，每个阶段应该可用更多的线程来防止队列堆积。对于一个阶段耗时分别为
    10、30 和 20ms 的 3 阶段流水线，第二阶段可以有 3 个工作线程，第三阶段有 2 个工作线程。这使得*每个*任务的时间都变为 60ms，而不是仅是第一个任务。在这种情况下（即分层阶段，使得每个阶段都能跟上上一个阶段的输出），该公式适用于最快的阶段：


    $T = T_1 + ((n - 1)t_{min})$


    **提高响应时间。** 这个模型有趣的之处在于，提高吞吐量也能提高响应时间！通过允许每个阶段同时处理更多请求，处理单个请求的时间会更短。同样，最长阶段会导致堆积，因此可以通过优化最慢的阶段来提高任务的响应时间。


    防止死死的简单方法是什么？为什么？


    防止死锁最接受的解决方案是**维护锁顺序**。这意味着无论所需的执行单元如何，所有的锁都按照相同的顺序获取。这确保了不同线程在访问不同的锁时永远不会发生冲突，因为它们需要先等待之前的锁。


    这之所以有效，是因为防止了“等待图”中的循环。循环会导致死锁，而没有循环意味着死锁不会发生，因为总有一个解析顺序。


    # 中期考试 2019年4月15日


    > 你能解释内核线程与用户级线程之间的关系吗？考虑通用的 $m \times n$ 场景（如 Solaris 论文中所述）以及当前的 Linux 模型。在这些情况下，调度、同步和信号期间会发生什么？


    呼，这个问题很深。通常情况下，用户级线程 (ULTs) 与内核线程 (KTs) 的区别在于对于特权边界另一侧“朋友”的了解程度不同。


    当前的 Linux 模型得益于内存的低成本和内核硬件的高速，为每个用户线程维护一个内核。这被称为一对一模型（one-to-one model）。


    # Solaris 模型。先讨论这个模型是有意义的，因为它是 Linux 模型的通用版本。我们可以看到这种方法的缺点以及它们是如何克服的。


    调度。Sun on Solaris 通过引入轻量级进程（LWP）引入了通用的 $m \times n$ 场景。（注：提供的原文后半部分存在大量重复的 OCR
    错误，已根据要求进行清理。）

