    > What''s an interrupt? What happens during interrupt or signal handling? How
    does the OS know to respond to an interrupt or signal? Can each process configure
    their own handler? Can each thread have their own signal handler?


    Interrupts are hardware-triggered events that indicate to the kernel that something
    needs to be handled. Similarly, signals are software-triggered events that indicate
    that something needs to be handled (or is handled for, certain signals like SIGXILL),
    the kernel has an interrupt table which jumps to a particular subroutine depending
    on the interrupt type. For signals, the process has a signal handler which enables
    certain signals using a thread-specific signal mask. The kernel calls the handler
    if the mask allows (i.e. has the bit set) the signal.


    > What''s the potential issue if an interrupt or signal handler leads to a mutex?
    What''s the workaround described in the Solaris papers?


    If code is executing and acquires a lock, then an asynchronous event that triggers
    a handler (interrupting the ongoing execution) and handler tries to acquire the
    same lock, then a deadlock will occur one time after the lock is released. For
    interrupts, this is also viable, mitigated by spiking a signal. Instead, to clear
    the signal mask so that the expensive signal is ignored (or marked as pending)
    during the critical section and reset it.


