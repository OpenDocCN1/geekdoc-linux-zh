    What are the pros-cons of message-based vs. shared-memory IPC.


    These are similar in how they function. In message-based IPCs, there is a buffer
    in kernel memory that is accessible by both processes, whereas in shared-memory
    IPCs, the "shared buffer" is within the address space of both processes.


    In the former case, the processes use kernel-provided APIs to communicate across
    the buffer (some form of read() and write()). This has the benefit of having a
    unified, standardized communication model, but suffers from the necessity of user-kernel
    crossings.


    In the case, processes gain the performance benefit of eliminating the OS management,
    but have to suffer the downside of defining their means through which to use the
    shared buffer to communicate. This boundary is a height performance gain, but
    setting up this shared buffer has a higher initial cost. This, shared memory IPC
    is only better if the initial cost can be amortized over the lifetime that it
    is used.


