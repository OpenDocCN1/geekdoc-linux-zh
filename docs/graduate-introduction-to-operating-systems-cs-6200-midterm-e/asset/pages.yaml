  md: '# MIDTERM


    # April 15, 2019


    Contrast the design decisions and performance tradeoffs among monolithic, modular
    and microkernel-based OS designs.


    Each of these designs has trade-offs, from efficiency to maintainability.


    # Monolithic OS: These include FreeBSD, OpenBSD, Solaris, and MS-DOS.


    This design contains every service/abstraction at the kernel level. It is first
    and historical OS design: every service an application could be part of the OS.
    This includes memory managers, drivers, file management, processes/threads, scheduling,
    file systems for random and sequential access, etc.


    **Benefits:** Everything is included in the OS. all the services and everything
    is packaged at the same time. This creates the possibility for **compile time
    optimizations.**


    **Disadvantages:** Too much stuff, too much that''s hard to maintain, debugging
    and upgrading. The size poses large memory requirements that can negatively affect
    performance.


    # Modular OS: This include most modern operating systems, including WinNT, macOS,
    and Linux.


    This design carries basic services and APIs at OS level; everything can be added
    as a module. This design delivers significant improvements over monolithic''s
    OS due to its simplicity and "plug-and-play" approach. With this design, you can
    customize which file system or scheduler the OS uses. The **OS specifies interfaces**
    that any module must implement to be part of the OS, making it possible to install
    modules that are applied for different workloads, instead of having the OS contain
    all possible modules.


    **Benefits:** OS are easier to maintain (patching, new modules, etc.) and upgrade.
    Smaller size and less resource-intensive code means more memory is available to
    applications; this can lead to better performance.


    **Disadvantages:** Because of the lacks of abstraction and defining the OS-module
    layer, there is a performance impact due to the bigger call stack and more general-purpose
    code required. We also lose out on inlining and compile-time operations on the
    system as a whole (because there is no "whole" anymore). These aren''t very significant
    on modern-day hardware, however, the modular architecture means that code can
    come from many different places; this tracking the down of an error more complex,
    and development spans many groups and codebases.


    # Microkernel OS: This used more historically, or in embedded systems. It includes
    kernels MINIX 3, Mach, and QNX.


    These operating systems include only the most primitives at the OS level; this
    is just the necessities for executing applications (address spaces, threads).
    Everything else, including file systems, device drivers, etc., are outside of
    the kernel level. This model requires a lot of process interaction, which the
    kernel must support (well) as one of its cores.


    **Benefits:** These kernels are small: less overhead and better performance for
    kernel code. Testing is another benefit; it''s easier to verify that behaves as
    intended. Thus, microkernels are valuable in cases where this is a critical aspect
    of the system more than performance (typically embedded devices and controls).


    **Disadvantages:** Portability is questionable; the kernel is tailored for particular
    hardware and can be highly-specialized for the expected case(s). Thus, it''s harder
    to find common components for software, leading to complexity. Finally, as discussed
    previously, the lack of kernel support for common features leads to a lot of IPC
    and frequent user-kernel crossings, which are costly.


