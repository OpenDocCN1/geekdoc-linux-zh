    > Can you explain the relationship among kernel vs. user-level threads? Think
    about a general $m \times n$ scenario (as described in the Solaris papers), and
    in the current Linux model. What happens during scheduling, synchronization and
    signaling in these cases?


    Whew, this question is deep. In general, user-level threads (ULTs) differ from
    kernel-level threads (KTs) in the amount of knowledge available about their friends
    on the opposite side of the privilege boundary.


    The current Linux model, thanks to the low cost of memory and high speed of kernel
    hardware, maintains a kernel for every user thread. This is known as the one-to-one
    model.


    # Solaris Threading Model. It makes sense to discuss this model first because
    it''s a generalized version of the Linux model. We can see the disadvantages of
    such an approach and how they''re overcome.


    Scheduling. The Sun on Solaris introduces the generalized $m \times n$ scenario
    by introducing lightweight processes (or LWPs). LWPs have a 1:1 relationship with
    kernel threads, and act like "virtual CPUs" from the ULT perspective. The ULT
    is assigned to the LWP, and the LWP is scheduled on the CPU by the KT. Thus there
    are two levels of threading: the scheduling occurring in the ULT library onto
    the LWP and the scheduling occurring by the kernel of KTs on various CPUs.


    Synchronization. Synchronization is done by the LWP. This comes with a big disadvantage,
    that the kernel has no knowledge of the sync actions by the ULTs. Consider the
    following case: a ULT is assigned to an LWP and blocks. Thus, the process thinks
    it is hanging, despite the fact that there are threads waiting for the opportunity
    to run. This can be further regardless of how many LWPs a user process has; if
    all ULTs are waiting, the kernel can''t control scheduling. Another paper discussing
    a lightweight user-level threading library introduces a new signal to the kernel
    for this, SIGNALING, which would be triggered when the kernel detects that all
    of its executing threads are blocking. This would allow the LWP to perform scheduling.


    Signaling. Recall that signal handlers are associated with a process and signal
    masks are associated with threads. There is a difficulty with managing signals
    because different threads have different masks, yet we don''t want to miss out
    on signals. If a thread is executing with a signal disabled, we need to ensure
    that our thread can process to that signal, The threading paper proposes solving
    this by having a global signal handler that "pre-processes" all signals. The mask
    is set to be either or less restrictive than the intersection of the signal masks
    across all threads.


    Linux Threading Model. This model implicitly avoids many of the workarounds in
    Solaris'' model by simplifying the user-kernel interaction. It uses a one-to-one
    model, so the kernel is always aware of the user threads, as well as their requirements
    and actions.


    Scheduling. The kernel sees all threads and their priorities are free to allow
    the scheduler to optimize things. There is no longer any need for user-level scheduling.


    Synchronization. Primitives are provided by the kernel, and can be woken immediately
    once a mutex is freed, rather than needing to traverse through a user-level threading
    library that relies on global synchronization primitives. Furthermore, blocking
    operations (like waiting on a lock) are trivial to recognize, and deadlocks can
    be avoided because the kernel sees all primitives.


