    Describe the boss-worker multithreading pattern. If you need to improve a performance
    metric like throughput or response time, what could you do in a boss-worker model?
    What are the limiting factors in improving this pattern?


    The boss-worker multi-ithreading pattern involves using a task queue, managed
    by the boss and referenced by the workers. The boss adds tasks to the queue and
    signals to workers that there is work available. Workers removes the tasks from
    the queue and process them.


    The task queue is that, every task is the same. For example, a task may be responding
    to an incoming request on a web server. Each worker will take approximately the
    same amount of time as all of the others to complete a task (obviously, specific
    tasks may take longer, but in the average...). Furthermore, every worker operates
    independently. This means you can only scale "horizontally," by adding more worker
    threads.


    Improving throughput. The definition of throughput is the amount of tasks that
    can be completed in a given amount of time. Each worker thread processes a discrete
    task, the throughput of a bossworker pattern is limited by the number of workers;
    improving throughput means increasing the number of simultaneous workers. Of course,
    even a heavily parallelizable process is still limited, since thread context switching
    has a non-negligible cost.


    Improving response time. Doing something like optimizing the boss thread''s processing
    of requests will mean that a worker will start on sooner, it will get faster.
    Unfortunately, the time spends on the task is much lower than the overall time
    the task takes. Thus, optimizing the worker itself (i.e. the way a task is processed),
    response time can''t be really lowered.


    As such, the limiting factor in boss-worker performance is the worker. This is
    contrasted with the pipeline model (discussed below), where individual portions
    of the task can be optimized, and different stages have additional resources.
    An important calculation is the time it takes to finish $n$ orders:


    ```

    $T = t_{avg} \frac{n}{w}$

    ```


    where $t_{avg}$ is the average time it takes to finish a task and $w$ is the number
    of worker threads (that is, the total number of tasks sends the boss).


