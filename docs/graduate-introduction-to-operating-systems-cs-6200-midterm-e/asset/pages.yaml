  md: '# Process vs. thread, describe the distinctions. What happens on a process
    vs. thread switch.


    Both processes and threads are units of execution. A process represents the current
    state of a program''s execution; every new launch of the program results in a
    new process. Their distinction is mainly the details are stored in the kernel.
    A process is the "parent" of its threads; Info is stored in the process control
    block (or PCB) and contains details like the virtual address mapping, the signal
    handler(s), any open file descriptors, etc. On the other hand, things like register
    state, respective stack pointer, thread-local storage that cannot be accessed
    across threads, individual signal handlers.


    When switching context, the entirety of the current PCB is swapped out for another
    process'' PCB. This means that the new process now has access to the CPU and the
    old process is no longer executing. A context switch empties the cache (cold cache),
    so the new process has to "start from scratch" in terms of the memory it needs,
    which is a performance penalty.


    When there is a thread switch, only the thread items are swapped out. Data accessed
    could remain in the cache. The address space mapping also stays the same, since
    we are still within the same PCB. There is still quite a lot of stuff to swap
    out, though,


    # Describe the states in a lifetime of a process.


    Processes are in four "primary" states: running or idle. Various actions move
    the process between these states and to the other states.


    As you see in Figure 1, many stages that a process goes through. When a process
    is initially created, it is in the new state. It''s placed on the ready queue.
    From there, it moves into the running state on the kernel''s scheduler. If it
    performs a "blocking" operation like a disk read that would cause the process
    to wait for I/O, it''s moved to the waiting queue until that operation completes
    (typically via an interrupt). Then, it''s ready. Even if it doesn''t block any
    I/O, it will still end up on the ready queue when interrupted by the scheduler,
    so it doesn''t hog processing time indefinitely. When it''s done, the terminated
    state will eventually be cleaned up by the kernel.


    ![](img/1250e62c383dbb8b9d771b210db4a869_3_0.png)


    Figure 1: The Solaris process life.


    # Describe the lifetime of a thread.


    The lifetime of a thread is quite akin to that of a process; in Linux doesn''t
    really track the content of a "process", everything is treated as a "task" or
    thread.


    There are many cases, though, as seen in Figure 2. If a thread blocks on a synchronization
    variable, it enters the SLEEP state, which is akin to the process WAITING state.
    There is also the concept of thread parking, which is an optimization for context
    switches. A thread parking "park" is like "set" on some kernel; it can immediately
    restore the thread instead of context switches, checking queues, etc. Parking
    when a bound thread blocks (since its LWP can no longer do anything), or when
    an unbound thread blocks and there are no more RUNNABLE threads (there''s nothing
    to switch).


    ![](img/1250e62c383dbb8b9d771b210db4a869_3_1.png)


    Figure 2: The Solaris thread library life cycle.'
