    # 8.5. ENABLING/DISABLING INTERRUPTS


    +   - Edge-triggered interrupts respond to a change signal, which can be either
    or down.


    In principle one could miss a level-triggered interrupt if it is cleared before
    the change in condition is noticed.


    On SMP interrupts may be serviced by any available CPU (although affinities can
    be mandated), only one CPU will handle an interrupt of a kind at the same time.


    It is sometimes advantageous to set IRQ-affinity to force it to deal with some
    of the CPUs, rather than being overloaded.


    This is done by writing to /proc/irq/IRQn/affinity, which is a bit-mask representing
    the affinity. By having high or low bits set, one can turn off all CPUs in the
    mask, and won''t work if the IRQ handler doesnt the capability to handle an affinity
    selection.


    The irbalance daemon dynamically adjusts the IRQ affinity to system conditions.
    It takes into account performance (latency and cache locality) and power consumption
    (keeping CPUs no more than necessary when load is high).


    There was also an in-kernel option which was deprecated and finally removed in
    kernel 2.6.9 for the user-space edition. Details about the daemon method can be
    found at http://www.irqbalance.com.


    # 8.4 MSI


    In PCI-PCIe express interrupts are line-based and are considered legacy technology.
    The main signal interrupts are widely separated from the main lines, preventing
    the problem of signal sharing.


    PCIe maintains compatibility with older software by emulating this behavior in-band
    methods, but are limited to only four lines and require sharing of interrupts
    among many devices.


    The PCI 2.2 standard introduced a new mechanism as MSI (Message-Signaled Interrupts),
    which was further enhanced in the PCI 3.0 standard to become MSI-X, which is backward
    compatible with MSI.


    Under MSI devices send messages by writing to a memory address. The message value
    is used to deliver the interrupt over the bus (FSB). The mechanism is not acknowledged,
    and we do not get an edge-triggered interrupt.


    MSI each device can use up to 32 addresses and interrupts, although the operating
    system is able to handle all of them same for each device, but they are dispatched
    by modifying low bits of the device state.


    Under MSI-X devices use 32-bit and up to 2048 individual messages for each device.
    Each MSI-X uses a different address and value (unlike MSI).


    There are important advantages of using message-signaled interrupts. First, the
    device no longer has to compete for a limited number of IRQ lines; there is no
    need to share. Interrupt latency, potentially reducing and sharing of share also
    makes behaviour more predictable than


    # 8.5 Enabling/Disabling Interrupts


    It is sometimes necessary for a driver to enable and disable interrupt for an
    IRQ line. For this you can use:


    ```

    #include <asm/ir>

    #include <linux/interrupt.h>

    ```


    ```

    void disable_irq(int irq);

    void disable_irq(int irq);

    void enable_irq(int irq);

    ```


    These actions are effective on the CPU when they are called; other processors
    continue to process the interrupt.


    Because the kernel disables an interrupt before calling it, when it does, makes
    no sense to use these functions within the handler of a particular IRQ.


    Calling disable_irq() may prevent executing the interrupt handler completes before
    the disable, while disable_irq_nosync() will return. This is false, race conditions
    may affect the result. The first form is from within IRQ context; the second is
    dangerous. The first form can lead to disable if it is used while a resource is
    still being held by the handler that may need be enabled.


    It is important to notice that the enable/disable functions has a depth; if disable,enable_irq()
    will be called twice before interrupts are handled


    It is also possible to disable/enable all interrupts, in order to protect critical
    sections of code. This is best done with appropriate functions


    ```

    unsigned long flags;

    sspin_lock_t lock;

    spin_lock_irqsave(&lock, flags);

    /* critical section */

    spin_unlock_irqrestore(&lock, flags);

    ```


    You should be careful with the use of these functions as you can paralyze the
    system.'
