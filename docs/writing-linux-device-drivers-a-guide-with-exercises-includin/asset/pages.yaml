    \ 2.6, jiffy was a counter that is incremented with every interrupt. However,\
    \ with the incorporation of tickless kernels we do not need to keep interrupts\
    \ when the system is idle. (For full details, see http://www.linux.org/projects/tickless).\n\
    \nThe default frequency is 100 Hz on x86, which is configurable at compile time,\
    \ a range from 100 to 1000. Thus we obtain resolution of 10 and 1 milliseconds\
    \ for the jiffies.\n\nIf 100 jiffies wrap (and overflow) after 50 days of uptime,\
    \ if someone has slept, what will then be unpredictable? If you are writing device\
    \ drivers it is unlikely you will care about that.\n\nTo avoid any potential problems,\
    \ the jiffy value is set boot to INITIAL_JIFFIES = 300, which causes the counter\
    \ to wrap after five minutes. As a side effect you might notice that the value\
    \ of jiffies differs from the number of interrupts read from /proc/interrupts\
    \ by the same value (Tickless kernels break this equality).\n\nUseful to compare\
    \ different jiffy values:\n\n```\ntime_after(a,b)\ntime_before(a,b)\ntime_eq(a,b)\n\
    time_eq(a,b)\n```\n\nWhere the first one is true if a is after time b and the\
    \ second is the inverse. Our other macros also check for equality.\n\nNote that\
    \ for 64-bit jiffies this is the same as for jiffy: on 32-bit systems jiffies\
