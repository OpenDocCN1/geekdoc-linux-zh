  md: "# CHAPTER 12. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\n# 12.2 ATOMIC\
    \ OPERATIONS\n\n## Concurrency and Synchronization Methods\nKernel execution is\
    \ asynchronous and unpredictable; interrupts occur at any time; system calls can\
    \ be entered from many different processes, and kernel threads of execution will\
    \ also occupy the CPUs.\n\nMany kernels can be modified in one process while being\
    \ used in another. In some cases the code might be distinct, while in others the\
    \ same kernel is executed one or more simultaneously. Either way data corruption\
    \ is a danger as are potential race conditions causing deadlock.\n\nSynchronization\
    \ can be done of two types:\n\n+   * True concurrency occurs on SMP, when two\
    \ threads of different processes simultaneously access a resource.\n* Pseudo-concurrency\
    \ occurs even on single processor, when one thread is interrupted or another accesses\
    \ an open resource.\n\nA variety of mechanisms can be used to ensure integrity\
    \ of shared resources; let's consider the various methods in order of increasing\
    \ overhead.\n\nThe simplest method is to use atomic functions, which work on specially\
    \ typed variables which deffer the use of atomic bit operations. Atomic functions:\n\
    \n+   * Execute in one single instruction; i.e., they cannot be interrupted in\
    \ mid-stream, and if two operations requested sequentially complete one before\
    \ the second starts.\n* Can be used in or out of process context.\n* Can never\
    \ go to sleep.\n* Do not suspend interrupts while executing.\n\nIf more than one\
    \ operation needs to be performed, one can use spinlocks, which get their name\
    \ because if one attempts to take out a spinlock which is already held, the kernel\
    \ will spin; i.e., do wait until the lock is released. The spinlocks:\n\n+   *\
    \ Can be used in or out of process context, but if used, the forms which temporarily\
    \ block interrupts are used when the same spinlock is referenced in process context.\n\
    * Can not block to go to sleep; another process cannot be scheduled.\n* Can suspend\
    \ interrupts while held.\n* Have supplemental read and write forms for the case\
    \ in which one wants to permit simultaneous readers, and writes are relatively\
    \ rare.\n\nIf one wants the ability to sleep if the resource is not available\
    \ (to call the scheduler and have yielded the CPU to another process) one can\
    \ use mutexes (lock and unlock) or semaphores (for which the basic operations\
    \ are up() and down()). Whenever possible use mutex rather than semaphores in\
    \ kernel.\n\nOne should use:\n\n+   * Can use mutex_lock() and unlock() only in\
    \ process context; mutex_lock() should not be used from interrupt context, while\
    \ the up() functions can be used at any time.\n* The mutex_lock() and unlock()\
    \ functions can sleep. The sleep may or not be interrupted by signals, depending\
    \ on the form.\n* Interrupts are not suspended by these functions.\n\nAs an alternative,\
    \ completion functions can be used of semaphores in the case where contention\
    \ is expected to be high.\n\nThe kernel also uses the seqlock() mechanism, used\
    \ when one has to read a value which is rapidly changed, and for which speed is\
    \ essential.\n\nAnother method for synchronization is RCU (for Read-Copy-Update),\
    \ which can lead to great performance boosts.\n\nExactly which method we depends\
    \ on:\n\n+   * Whether contention is expected to be high or low.\n* Whether one\
    \ is in or out of process context.\n* How many operations are to be performed\
    \ while the lock is held.\n* Whether sleeping is permissible.\n\n+   * How often\
    \ the lock needs to be taken.\n\nFor frequent operations, one would generally\
    \ pick the one with the lowest overhead which fits the other requirements.\n\n\
    # 12.2 Atomic Operations\n\nAtomic functions (which of many are are) execute as\
    \ one single instruction and work on a variable of type atomic_t, which is a structure\
    \ defined as\n\n```\ntypedef struct {\n    volatile int counter;\n} atomic_t;\n\
    ```\n\n![](img/4e539a55ab31f2c9df39e648783d8023_81_0.png)"
