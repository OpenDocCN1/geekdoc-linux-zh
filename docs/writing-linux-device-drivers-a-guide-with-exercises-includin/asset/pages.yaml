    # 15.1 Unified Device Model


    A unified device model (or integrated device model) was introduced in the 2.6
    kernel series. Under this scheme all devices are handled in one framework, with
    similar data structures and functional methods. Additionally, this framework is
    represented as a device tree rooted on the system buses.


    For the most part, device drivers need not interact directly with this underlying
    model, but register devices under the type of bus they are connected to, such
    as pci. Information about the devices'
