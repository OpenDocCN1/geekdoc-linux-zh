  md: "# CHAPTER 28. USB DRIVERS\n\n# 28.7. REGISTERING USB DRIVERS\n\nBulk transfers\
    \ information using the full bandwidth. (they are\nchecked) and are used by devices\
    \ scanners.\n\nInterrupt transfers can also take up the full bandwidth, but they\
    \ are in response to periodic\npolling. If the transfer is interrupted, the host\
    \ controller will repeat the request after a set interval.\n\nIschronous transfers\
    \ take up the full bandwidth as well, but they are not guaranteed to be reliable.\n\
    Multimedia devices, audio, video, use these.\n\n# 28.6 USB under Linux\n\nThere\
    \ are three layers in the USB stack under Linux:\n\n+   * Host Driver (OHCI, UHCI,\
    \ EHCI)\n* USB Core.\n* Device Drivers.\n\n![](img/4e539a55ab31f2c9df39e648783d8023_169_0.png)\n\
    \nFigure 28.3: USB: Controller, Core and Device\n\nThe USB core has APIs for both\
    \ controller drivers and devices. It can be designed as a library of common routines\
    \ that both the controller and the peripherals can use.\n\nDevice drivers need\
    \ not concern the parts of API that interact with the host-\ncontroller. The device\
    \ interacts with the Linux kernel by going through the USB core.\n\n# 28.7 Registering\
    \ USB Devices\n\nUSB devices are registered and unregistered with the following\
    \ functions:\n\n```\n#include <linux/usb.h>\n\nstruct usb_device *dev;\nvoid usb_deregister(struct\
    \ usb_device *dev);\n```\n\nusb_register() returns 0 for success, a negative value\
    \ for failure.\nBefore the device is registered all-important usb_device structure\
    \ must be fully initialized.\nIt can be found in /usr/src/linux/include/linux/usb.h\
    \ and looks like this :\n\n```\nstruct usb_device {\n    const char *name;\n \
    \   int (*probe)(struct usb_interface *intf, struct usb_device *id);\n    void\
    \ (*disconnect)(struct usb_interface *intf);\n    int (*reset)(struct usb_interface\
    \ *intf, int code, void *buf);\n    int (*suspend)(struct usb_interface *intf,\
    \ int power_message, int *message);\n    const struct usb_device_id *table;\n\
    \    unsigned int device_id_table;\n    struct usb_driver *driver;\n    unsigned\
    \ int dynamic_id;\n    unsigned int support_endpoints;\n    unsigned int max_descriptor_id;\n\
    \n};\n\n```\n\nname is the name of the device module. It must be unique among\
    \ all USB drivers, and will show up\nin /sys/bus/usb when the driver is loaded.\n\
    \nprobe() points to the function used to check for the device, and is called when\
    \ new devices\nare attached to the USB bus. If the driver can claim the device\
    \ (based on the information in the\nusb_device_structure passed to it), it should\
    \ initialize the device and return zero.\nIf the driver does not claim it, it\
    \ should return a negative error value.\n\ndisconnect() points to the function\
    \ called when devices are removed from the USB bus, while\nsuspend() and resume()\
    \ point to functions used for power management.\n\nioctl() will get called when\
    \ a user-space program issues an ioctl() command on the file-\n associated with\
    \ a device attached to this driver. In practice, the USB core uses it\nt things\
    \ like hint and control.\nOnly the main fields to be set; others are more optional.\
    \ One might have here:\n\n```\nstatic struct usb_driver my_usb_driver = {\n  \
    \  name = \"my_usb_device\",\n    id_table = &my_usb_id_table,\n    probe = my_probe,\n\
    \    disconnect = my_usb_disconnect,\n};\nn\n```\n\nid_table points to an identifying\
    \ structure of type usb_device_id, defined in /usr/src/\ninclude/linux/usb_devicable.h.\n\
    \n```\nstruct usb_device_id {\n    /* which fields to match against */\n    u16\n\
