    # 21.5 Reading and Writing to I/O Registers


    # 21.6 I/O Calls to the Hardware


    Parsing functions do use I/O to call devices. They have the same form as the usual
    read/write functions, but with the p_ appended to their names: in_p(port), out_p(port),
    etc., and are defined in `/include/linux/arch/include/asm/io.h` through some complicated
    macro logic.


    These functions insert a small delay after the I/O instruction if another such
    functions follow. They should not be necessary for very old ISA hardware.


    The following macros are defined in `io.h`, and give the ability to read and write
    8-bit, 16-bit, and 32-bit ports, or multiple once.


    While there is no prediction of the length of the delay, a heuristic test can
    be applied with the following configuration:


    # Reading:


    ```

    unsigned char ins(unsigned long port_address);

    unsigned short ins(unsigned long port_address);

    unsigned int ins(unsigned long port_address, void *addr, unsigned long count);

    void ins(unsigned long port_address, void *addr, unsigned long count);

    void ins(unsigned long port_address, void *addr, unsigned long count);

    ```


    # Writing:


    ```

    void out(unsigned char v, unsigned long port_address);

    void out(unsigned short v, unsigned long port_address);

    void out(unsigned int v, unsigned long port_address, void *addr, unsigned long
    count);

    void out(unsigned long port_address, void *addr, unsigned long count);

    void out(unsigned long port_address, void *addr, unsigned long count);

    ```


    Note that the following functions use only 32-bit; there is no 64-bit data available
    on 64-bit platforms.


    The functions that take the count do not write to a range of addresses; they write
    only to the port address, but loop efficiently over the operation.


    All these functions do I/O in little-endian order, and do not any byte- swapping.'
