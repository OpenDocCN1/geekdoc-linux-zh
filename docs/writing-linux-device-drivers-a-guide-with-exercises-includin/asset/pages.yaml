    \ request *rq)\n    int size, res;\n    char *ptr;\n    unsigned nr_sectors, sector;\n\
    \    printk(KERN_INFO(\"entering request %\\n\"));\n\n    rq = blk_fetch_request(rq);\n\
    \    while (rq) {\n        if (!blk_is_request(rq)) {\n            printk(KERN_WARNING(\"\
    This was not a formal request, skipping %\\n\"));\n            goto done;\n  \
    \      }\n\n        nr_sectors = blk_rq_sectors(rq);\n        sector = rq->rq_start;\n\
    \        ptr = my_buffer + sector * size;\n        size = nr_sectors * size;\n\
    \n        if (ptr + size) {\n            printk(KERN_INFO(\"writing at sector\
    \ %ld, %ld sectors %\\n\"));\n            memcpy(ptr, rq->buffer, size);\n   \
    \     } else {\n            printk(KERN_INFO(\"reading at sector %ld, %ld sectors\
    \ %\\n\"));\n            memcpy(rq->buffer, ptr, size);\n        }\n\n       \
    \ if (!blk_mem_end_request(rq, cur, res))\n            rq = blk_fetch_request(rq);\n\
    \    }\ndone:\n    printk(KERN_INFO(\"leaving request %\\n\"));\n```\n\nKeep track\
    \ of the times the node is opened. By permitting multiple opens, or exclusive\
    \ use,\n\nWrite a program to read (and/write) to the node, using standard Unix\
    \ I/o functions (open(), read(), write(), close()). After loading the module you\
    \ use this program to access the node.\n\nNOTE: Make sure you have enough memory\
    \ to handle the disk cache; The solution should have 128 MB.\n\n# Lab 2: Making\
    \ Read/Write Block Driver\n\nExtend the previous exercise in order to put an ext3\
    \ file system (or any other type) on your device.\n\nYou can place a filesystem\
    \ on the device\n\n```\nmkfs.ext3 /dev/mydev\nmknod /dev/mydev\n```\n\nWhere you\
    \ give appropriate the device name and node count.\n\nFor an additional enhancement,\
    \ partitioning the device with fdisk. For this you may need an additional ioctl(1)\
    \ and you'll have to include: linux/hdreg.h. This ioctl returns a pointer to the\
    \ following structure:\n\n```\nstruct bd_geometry {\n    unsigned char heads;\n\
