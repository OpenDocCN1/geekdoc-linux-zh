  md: "# CHAPTER 11. TIMING AND TIMERS\n\n# 11.8. USING HIGH RESOLUTION TIMERS\n\n\
    Timeout functions generally have a weak precision requirement, while (in at least)\n\
    timer functions may have more stringent needs.\n\n```\nint hrtimer_try_to_cancel(struct\
    \ hrtimer *timer);\nint hrtimer_restart(struct hrtimer *timer);\nktime_t hrtimer_get_remaining(const\
    \ struct hrtimer *timer);\nint hrtimer_active(const struct hrtimer *timer);\n\
    int hrtimer_get_res(const clock_t *clock, struct timespec *tp);\n```\n\nThe original\
    \ implementation works well for timeout functions, particularly because it does\n\
    a rapid job of timer removal, since only an index is look up and jiffies-level\
    \ accuracy is enough.\n\nThe htimers (High Resolution Timer) API, introduced in\
    \ the 2.6.16 kernel, is designed for dy-\namical timers exactly to execute:\n\n\
    Rather than having a cluster of lists, there is only one list (per CPU) sorted\
    \ by time expiration,\nu a red-black tree. Insertion and removal may be slower\
    \ than in the\noriginal method, there will be no need for a cascade operation\
    \ and there are fewer elements in the\nlist.\n\nThe only field in the data structure:\n\
    \nExpiration periods for the htimers are expressed in nanoseconds rather than\
    \ jiffies, although\nmay still operate at lower resolution.\n\n```\nstruct hrtimer\
    \ {\n\tstruct rb_node node;\n\tktime_t expires;\n\tenum hrtimer_restart (*function)(struct\
    \ hrtimer *);\n\tstruct hrtimer_base *base;\n};\n```\n\n# 11.8 High Resolution\
    \ Timers\n\nThe htimers require introduction of a new (opaque) ktime_t which measures\
    \ time\nn nanosecond if the architecture can support it. The internal representation\
    \ of\nktime_t is quite different on 64-bit and 32-bit platforms and should not\
    \ be mocked.\n\nFunctions with this time value are contained in /usr/src/linux/include/linux/ktime.h\
    \ and do not require much emulation:\n\nthat needs to be used:\n\n```\n#include\
    \ <ktime.h>\n\nktime_t ktime_set(const ktime_t *kt, unsigned long nanoseconds)\n\
    ktime_t ktime_add(const ktime_t *kt, const ktime_t *kt)\nktime_t ktime_sub(const\
    \ ktime_t *kt, const ktime_t *kt)\nktime_t ktime_add_ns(const ktime_t *kt, unsigned\
    \ long ns)\nktime_t ktime_get(void *real) (void *real)\n\nktime_t ktime_to_timespec(const\
    \ ktime_t *kt, struct timespec *ts)\nktime_t ktime_to_timeout(const ktime_t *kt,\
    \ struct timeout *tv)\nktime_t ktime_to_timer(const ktime_t *kt)\nu64_t ktime_to_nsec(const\
    \ ktime_t *kt);\n```\n\nThe earliest implementation of the API had a void argument\
    \ to the function and a data field in\ntstruct. With the current API, one will\
    \ want to embed the timer structure in a data\nstruct to pass data into the function.\n\
    \nThis can be done using the container_of() as follows:\n\n```\nstruct my_data\
    \ {\n\tstruct hrtimer timer;\n\t...\n};\n\n// callback\n\tstruct my_data *data\
    \ = container_of(timer, struct my_data, timer);\n```\n\nThe first argument is\
    \ a pointer to the timer structure, the second type of the structure is\ncontained\
    \ in, and the name is the name of the timer structure in the data.\n\nThe return\
