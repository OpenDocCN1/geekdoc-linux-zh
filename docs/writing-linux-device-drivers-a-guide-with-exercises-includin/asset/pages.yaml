    # 24.1 Network Layers and Data Encapsulation


    Networking applications communicate with servers and clients which are also networking
    applications. These applications (or daemons) may either be on remote hosts or
    on the local machine.


    For the most part applications are constructed to be independent of the actual
    hardware, type of network involved, routing, and specific protocols involved.
    This is not a general rule, however sometimes the application may work at a lower
    level or require certain features.


