    \ jiffies, struct timeval *val)\nunsigned_long_to_jiffies(struct timeval *val)\n\
    void_to_jiffies(unsigned long jiffies, struct timeval *val)\nunsigned jiffies_to_secs(unsigned\
    \ int jiffies)\nunsigned_secs_to_jiffies(unsigned int secs)\nunsigned ms_to_jiffies(unsigned\
    \ int ms)\nunsigned jiffies_to_ms(unsigned int ms)\n```\n\nwhere the time and\
