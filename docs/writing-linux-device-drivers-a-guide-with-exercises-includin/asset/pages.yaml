  md: '# 28.1 What is USB?


    USB stands for Universal Serial Bus. It permits easy connection of multiple peripherals
    to one port, and automatic hotplugging of devices attached (and detached) while
    the computer is running. Virtually any type of peripheral (with USB capability)
    can be connected to a USB port; it, scanners, mice, network cards, keyboards,
    printers, mass storage devices, etc.


    Version 1.0 of the specification was released in January 1996 by an alliance of
    Compaq, Intel, Microsoft and nearly. Version 1.1 was released in September 1998,
    and version 2.0 was released in 1999.


    One thing to be careful about using the USB 2.0 standard, is that when the full
    speed is reached, it is described as high speed.


    Up to 127 devices can be connected simultaneously. The USB cable carries four
    wires: power and two grounds. In the original standard, the total bandwidth was
    limited to 12 Mbit/s, but overhead to something like 8 Mbit/s and realistic performance
    was as low as 2 Mbit/s. USB 2.0 brought a theoretical speed of 480 Mbit/s


    Devices may be either low or high speed, or operate in other mode according to
    their function. A USB 1.1 controller or hub will be limited to lower capabilities.


    Power can be delivered through the USB bus or a peripheral''s own power supply.
    A total of 500 mA can be provided by each controller. When a device is plugged
    in it may greedily grab up to 100 mA and then need more requests if limits are
    not exceeded.


    The kernel contains all of USB-related documentation in the /usr/src/linux/Documentation/usb
    directory.


    ![](img/4e539a55ab31f2c9df39e648783d8023_167_0.png)


    +   Support for the new USB 3.0 standard (also known as XHCI) has been included
    in kernel version 2.6.31, making the Linux operating system to incorporate it.


    # 28.2 USB Topology


    USB ports are incorporated in all motherboards. In most cases there are at least
    2 ports. The ports can be connected either directly to devices or to hubs, which
    may be connected to more hubs or devices. There is a virtual hub supported by
    the host controller. The total number of devices per hub is 127.


    Technically, the structure of USB is not that of a bus; it is a tree with upstream
    and downstream nodes. Each device can have only one upstream (with a type A connector),


    | USB Controller | Device |

    |---|---|n| (Virtual Hub) | Hub | Device |

    | | | Hub | Device |


    Figure 28.1: USB topology


    but a hub node can have many one downstream connection (with a type B connector).


    For USB 1.x, there are two types of controllers:

    - OHCI (Open Host Controller Interface) from Compaq.

    - UHCI (Universal Host Controller Interface) from Intel.


    UHCI is simple and thus requires a somewhat more complex device driver. Peripherals
    should quite well with either controller.


    For USB 2.0, the standard is EHCI (Enhanced Host Controller Interface).

    Upon looked upon by the bus, a peripheral identifies as belonging to one of several
    classes. When a particular device is loaded it will claim the device and handle
    all communication with.


    # 28.3 Descriptors


    | Device Descriptor | Configuration 0 | Configuration 1 | Configuration 2 |

    |---|---|---|---|

    | | Interface 0 | Interface 1 | Interface 2 |

    | | | | Endpoints |


    Figure 28.2: USB descriptors


    Each USB device has a unique device descriptor, assigned to it when the peripheral
    is connected to the bus. In addition it gets a device descriptor assigned (an
    integer from 1 to 127). The descriptor has all pertinent information applying
    to the device and all of its possible configurations.


    A device has one or more configuration descriptors. This has specific information
    about how the device may be used.'
