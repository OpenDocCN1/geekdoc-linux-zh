  md: "# CHAPTER 22. PCI\n\n# 22. PCI DRIVERS\n\n257\n\n```\nlrwr-wx i root root 0\
    \ May 27 07:15 subsystem->_\n-dr-xr-xr root root 4096 May 27 07:15 subsystem_vendor\n\
    -dr-xr-xr root root 4096 May 27 07:15 uevent\n-dr-xr-xr root root 4096 May 27\
