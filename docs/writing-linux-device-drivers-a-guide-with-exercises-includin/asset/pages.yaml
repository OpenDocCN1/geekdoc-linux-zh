  md: '# 21.1 Buses and Ports


    Computers require data paths for the flow of information between the processor,
    memory, and various I/O devices and peripherals. These data paths are known as
    the bus, of which there are several types.


    +   * A data bus is a group of lines that parallel data transfer; on the Pentium
    data buses are 64-bit wide.

    * An address bus transmits addresses; on the Pentium address busses are 32-bit
    wide.

    * A control bus transmits control information, such as whether the bus can allow
    data to go between a CPU and RAM, or between an I/O device, and whether a read
    or write is to be performed.


    A bus connecting to an I/O device is an I/O bus; x86 CPUs use 16 or 32 addresses
    to identify I/O devices, and 8 or 16 bits for data transfer. The I/O bus is connected
    to each I/O device through a connection of I/O ports, interfaces, and control
    devices.


    The bus can be of various types such as ISA, EISA, PCI, and MCA. We restrict our
    attention to ISA and PCI.


    Controlling peripheral devices generally involves reading and writing to registers.
    When we talk about I/O ports, we are referring to the corresponding registers,
    or devices.


    Each device is accessed by the CPU. All access is through some kind of peripheral
    bus, but some CPUs, like x86, have distinct read and write lines and special instructions
    to access these memory locations. On other architectures, memory-portable code
    uses the same basic functions of the architecture, although the implementation
    of these functions may differ.


    On the x86 architecture I/O address space is 64 KB in length; ports can be addressed
    as individual 8-bit ports, or by two 16-bit ports. Four consecutive 8-bit ports
    or eight consecutive 8-bit ports can be treated as a 16-bit port, a 32-bit port,
    or some other combination. The 16-bit and 32-bit ports are addressed on 16-bit
    and 32-bit boundaries.


    # 21.2 Memory Barriers


    Operations on I/O ports differ in several ways from normal memory access. In particular,
    there may be called side-effects. These are generally due to compiler and hardware
    optimizations.


    These optimizations can cause redundant memory reads and writes. In memory access
    there is no problem; a write sets a value and a read always returns the last value
    written.


    However, for I/O ports problems can arise because the CPU cannot wait when a process
    depends on the order of access. In other words, reading or writing to an I/O device
    may require it to wait before proceeding.


    Therefore we must make sure no caching is performed and no ordering occurs. Other
    problems which are difficult to diagnose, and are rare or intermittent, may persist.


    # 21.3 REGISTERING I/O PORTS


    The solution is to use appropriate memory barriers when necessary. The necessary
    functions are defined in and indirectly included from /usr/src/linux/arch/x86/include/system.h
    and


    ```

    void barrier(void)

    ```


    ```

    void rmb(void)

    void wmb(void)

    void mb(void)

    ```


    ```

    void smp_rmb(void)

    void smp_wmb(void)

    void smp_mb(void)

    ```


    The barrier macro ensures the compiler to store all values currently modified
    in a CPU register, to read them again later after they are needed. This function
    has no effect on the hardware interface.


    The other macros insert memory barriers in the code; how they are implemented
    depends on the platform. rmb forces any reads before the barrier to complete before
    any after; wmb does the same thing for writes; mb does it for both reads and writes.


    The versions with smp prefix insert memory barriers only on multi-processor systems;
    on single CPU they expand to call a barrier().


    A simple example of a barrier would be:


    ```

    io32(int value, direction, __DIF_SIZE);

    io32(int value, size, __DIF_SIZE);

    io32(int value, direction, __DIF_0);

    ```


    Most architectures define macros, which combine setting a value with a memory
    barrier. In the simplest they look like


    Memory barriers may cause a performance hit and should be used with care. Only
    use the specific form needed. For instance on x86 the write memory barrier does
    nothing as writes are not reordered. However, reads may be reordered, so you should
    use rmb() if needed.


    Before we access I/O ports, the kernel has to register their; there is nothing
