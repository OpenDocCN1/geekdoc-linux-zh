    Applications keep their eye on a number of file descriptors to see or not it is\
    \ possible to do I/O on one of them at any time. The application will either sit\
    \ and wait for one of the description to operate, or poll one while other threads\
    \ do.\n\nSuch multiplexed and asynchronous I/O is at the basis of the threaded\
    \ Posix system calls select() and poll(), as well as Linux-only poll system calls\
    \ which allow Linux to handle large numbers of descriptors efficiently.\n\nIn\
