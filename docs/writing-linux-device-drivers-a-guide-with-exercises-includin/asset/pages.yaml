    \ the (open) system call, and then send the appropriate ioctl() command and any\
    \ necessary arguments.\n\n```\n#include <sys/ioctl.h>\n```\n\n```\nint ioctl(int\
    \ fd, int command, unsigned int arg);\n```\n\nThe third argument is usually written\
    \ as char *arg. The use of it usually means a variable number of arguments. Here\
    \ it indicates that type checking should not be done on the argument, we using\
    \ a trick. You shouldn't pass more than three arguments to the ioctl() call.\n\
    On success returns 0, and on error -1 is returned with errno set. The possible\
    \ return errors are:\n\n# Example:\n\n```\nstatic int mydvr_ioctl(struct inode\
    \ *inode, struct file *file, unsigned int cmd, unsigned long arg)\n{\n    if (_IOC_TYPE(cmd)\
    \ != MYDVRSASH)\n        return -EINVAL;\n    switch (cmd) {\n        case MYDVR_RESET:\n\
    \            /* doing something */\n            return 0;\n        case MYDVR_OFFLINE:\n\
    \            /* doing something */\n            return 0;\n        case MYDVR_GETSTATE:\n\
    \            if (copy_to_user((void *)arg, &mydvr_state_struct, sizeof(mydvr_state_struct)))\n\
    \                return -EFAULT;\n            return 0;\n        default:\n  \
    \          return -EINVAL;\n    }\n}\n```\n\n# Table 13.1: ioctl() return values\n\
    \n| Value | Meaning |\n|---|---|\n| EBADF | File descriptor not. |\n| ENOTTY |\
