    # # Preface


    ![](img/4e539a55ab31f2c9df39e648783d8023_9_0.png)


    # # Objectives


    Writing Linux Device Drivers is designed to show experienced programmers how to
    develop device drivers for Linux systems, and give them a basic understanding
    and familiarity with the Linux kernel.



    Upon mastering this material, you will be familiar with the different kinds of
    device drivers used under Linux, and know the appropriate APIs through which devices
    (both hard and soft) interface with the kernel.


    We will focus primarily on Device Drivers and only occasionally on the Linux kernel.
    These are impossible to separate, since device drivers are an integral part of
    the kernel. However, device drivers use only a limited set of kernel functions
    and need not learn everything about the kernel to do a device driver. While device
    drivers do not control kernel features such as scheduling or memory management,
    the more you know about how Linux handles things the better a device you can.


    In many other operating systems, which are closed source, there is a clearer separation
    between a device driver and the kernel proper. Because Linux is open source, the
    device driver developer has full access to all of the kernel. This is both powerful
    and dangerous.


    While we will discuss kernel internals and algorithms we dominate only the functions
    which are normally used in device drivers. More details on things such as scheduling,
    memory management, etc., belong more properly in a higher level treatment (or
    lower level depending on how you define things.)'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# PREFACE


    ix


    Developing drivers is a big object both depth (from deep inside the kernel used
    to user-space) and breadth (the many types of devices). In order to keep things
    manageable we are going to limit our reach both vertically and horizontally.


    +   • Experience with any Linux distribution is helpful but not strictly required.


    This means we won''t look too deep into the inner plumbing as it relates to drivers
    and for particular types of devices we will stop before we get to detailed aspects
    of classes and hardware. It also means we are going to ignore whole classes of
    devices, such as SCSI and rendering, as treatment of such devices would rapidly
    become huge and complex.


    If you have some experience experience configuring and compiling kernels, and
    writing kernel modules or drivers, you will get much out of this material.


    Our order of presentation is not axiomatic; it will have some forward references
    and directions. We want to get you into coding as quickly as possible. Through
    this simple way, you can actually write code, and then later cover the subject
    more thoroughly. Furthermore, the order of subjects is flexible, so feel free
    to move according to your interests.


    If you have a good experience of operating systems fundamentals and familiarity
    with the insides of any other operating system, you will gain much more from this
    material.


    While our material will not be advanced, we strive to be thorough and complete.
    It is worth repeating that we are not for an expert audience, but instead for
    a competent and motivated one.


    # My History and Why I''m Doing This


    # Who You Are


    By training I am physicist, I have a PhD in theoretical molecular astrophysics
    and I research on dense matter, nucleosynthesis physics, neutrino diffusion, shockwaves,
    relativity, for classes of papers and book chapters in the main physics and astrophysics
    journals. I was a lecturer at many universities around the world.


    You are interested in learning how to write drivers for the Linux operating system.
    Maybe you are doing this for fun, or because you have this task as part of your
    job. The purpose here is to ease path and perhaps shorten the amount of time it
    takes to reach a level of competence in Linux.


    I''ve been in one or another for more than 30 years. I''ve taught advanced as
    well courses on a wide variety of subjects in physics and astrophysics at both
    undergraduate and graduate level and I have supervised a good number of students.
    I''ve been teaching to master the present subject matter for many years.


    How much you get out of this and how bug-free, and optimized your drivers will
    depend on how much a programmer you were before you started with this material.
    There is nothing in it here time to teach you the essentials of programming or
    the Linux operating system design in detail.


    So you may wonder why I got the chance to prepare a book of this? The answer is
    I stumbled into it. I worked as a hardware engineer for many years when Linux
    was non-very.


    There are two reasons for this:


    Except for some lack software acquisition in my early student days, all my computer-related
    working during my career was as a physicist. The main projects I covered were
    large numerical simulations of exploding stars, with the numerical and data analysis
    that was required.


    +   • First, there is no shortage of books and classes on programming methods.
    The Linux kernel is the choices, for they every one and we will mention some of
    them at appropriate times.


    +   • Second, my knowledge is not as deep as those who have contributed to the
    development of Linux, and my programming is not strong. I intend my personal contributions
    to the kernel code have been very minor. I''ll explain why I''ve produced this
    material these facts.


    In 1994 I learned to use the Linux environment. During the next 5 years working
    as a consultant with a major petroleum company, the geology and geochemistry and
    seismic analysis used for oil exploration and recovery. (Equations explain what
    they describe coding geology, or seismic waves as they travel through layers of
    the earth.


    You should:


