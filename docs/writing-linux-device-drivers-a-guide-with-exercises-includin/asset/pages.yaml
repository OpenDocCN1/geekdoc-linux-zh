    # 24.4. LOADING/UNLOADING


    The outermost and foremost corresponds to the datalink layer, which describes
    the hardware, device driver, and the hardware type of network: such as Ethernet
    or Token Ring. For instance, the MAC address will appear here:


    The next layer describes the network protocol, such as IPv4, and the innermost
    layer describes the transport protocol, such as TCP or UDP.


    For reasons of optimization, the network and transport layer are not completely
    separated as might be possible. In the network layers may contain implementations
    of the transport layer, rather than passing through a common code base. For instance,
    both local and remote users have their own (configuration) code.


    # 24.4 Loading/Unloading


    Network drivers are loaded and unloaded with:


    ```

    #include <net/device.h>

    ```


    ```

    int register_netdev (struct net_dev *);

    void unregister_netdev (struct net_dev *);

    ```


    Usually one driver registers in the initialization callback function and unregisters
    in the exit call.


    ```

    ifconfig [ifoptions] [address]

    ```


    can be used to stop, or configure interfaces.


    register_netdev() function invokes an initialization routine to probe for the
    network card, and fills the net_dev structure, which contains the interface name
    (which can be dynamically assigned). unregister_netdev() removes the interface
    from the list. Any memory associated with it is freed.


    # 24.2 Datalink Layer


    Applications have no knowledge of the hardware through which the computer will
    be connected to the network, except for specialized functions for monitoring and
    diagnostic purposes.


    For instance computers may be connected via Ethernet, Bluetooth or Token Ring,
    each of its own network interface card (NIC), or via a PPP connection with media.
    Even with a given hardware type there are many choices: Linux supports many kinds
    of Ethernet NICs.


    There are two components that need to deal with the datalink: the Ethernet (ethernet)
    driver and the datalink layer that handles the NIC. These are not completely independent
    since the NIC will only work with a given datalink driver; the two drivers are
    always associated with a given datalink.


    Generally speaking, applications are independent of both layers as well as the
    network and transport layers.


    The net_dev structure contains all information about the device, and we will discuss
    it in detail. To obtain proper reference is allocated and freed dynamically with:


    ```

    struct net_dev *alloc_netdev(struct net_dev_priv, char *name);

    void free_netdev(struct net_dev *dev);

    ```


    where:


    +   * sizeof_priv is the size of the private data in the net_dev data structure.

    * name is the name of the device, if a format such as "netdevX" is chosen the
    name will be filled out dynamically as devices are brought up (myn0, mynet1, ...).

    * setup points points to an initialization function that will fill in the remaining
    fields in the data structure; the network driver function ether_setup() can be
    used, or it can be called from a supplied function.


    For convenience one can call the simpler function:


    # 24.3 Network Device Drivers


    We are going to concentrate on the datalink layer, i.e., the device driver. We
    are going to consider the implementation of network and transport layers except
    for how they interact with device drivers.


    As other classes of device, network drivers are fundamentally different than block
    and device drivers because they are identified by a name, such as eth0 or wlan0.


    At the kernel level every driver operates with packet transmission and reception,
    read and write operations. The network driver asks to push incoming packets; other
    drivers are asked to send buffers towards the kernel.


    To make a network device driver, templates are implemented in the kernel sources.
    For ISA hardware, the relevant file is /usr/src/linux/drivers/net/isa-skeleton.c,
    and for PCI it is /usr/src/linux/drivers/net/pci-skeleton.c.


    ```

    struct net_dev *alloc_netdev(int sizeof_priv);

    ```


    which supplies "ethX" for the name and points to ether_setup() for initialization.

    One should never access the device directly as so would inhibit performance, flexibility
    and reference counting. One uses the inline function net_devdev() as in:'
