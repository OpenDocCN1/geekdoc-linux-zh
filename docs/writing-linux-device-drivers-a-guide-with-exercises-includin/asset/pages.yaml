  md: '# CHAPTER 27. NETWORK DRIVERS IV: SELECTED TOPICS


    # 27.6 TSP AND TOE


    If the kernel does not recognize the command, it is passed to the do_ioctl() method
    defined in the driver.


    One must also invoke the interrupt handler so that when a packet is received (with
    incoming interrupts-obviously avoided) it should turn off reception handlers,
    and have the packet off to the function net_rx_schedule(struct net_device *) which
    will induce the poll() method to be called.


    ```

    int (~do_ioctl)(struct net_device *dev, struct ifreq *ifreq, int *cmd);

    ```


    The poll() method works like


    For this purpose 16 commands are seen as to the device (SIOCDEVPRIVATE or SIOCDEVPPRIVATE).


    ```

    int (*poll())(struct net_device *dev, int *budget);

    ```


    The if frame actually points to a kernel-safe copy of the data-structure. The
    driver can freely free this structure without respect to copy_to_user().


    where budget is the maximum number of packets that the function can process. As
    packets are processed, they are passed to net_rx_skb(), or not to net_rxif() in
    normal reception functions


    If it is able to process all available packets it returns interrupts on, calls
    the function net_rx_complete() to turn off polling, and returns a value of 0.
    A return value of 1 indicates more packets need to be processed.


    # 27.4 NAPI and Interrupt Mitigation


    # 27.6 TSP AND TOE


    The straightforward way to write a network driver is to have the arrival of each
    packet acknowledged by an interrupt. The handler does the necessary work (including
    queuing up for deferred processing, through a task) and then is ready for more.


    The purpose of TCP Segmentation Off is to allow a buffer larger than the MTU (maximum
    transfer unit), which is only 1500 bytes, to be passed to the network device.


    For high-bandwidth devices such an approach can cause problem; even if the bandwidth
    is limited the CPU time spent to keep up with the system overhead.


    The breaking (segmentation) of the buffer allows into mini-segments that the device
    can pass through routers, switches, which is normally done by the CPU before the
    data is passed to the device.


    An alternative method, to interrupt, or by polling the device. The interface is
    called NAPI (New API) for each of a better name.


    However, with TOE, a 6 KB buffer is broken into 44 mtu-segments on the device.
    Each fragment, packet, or has has to be passed to the TCP/IP and TOE protocol
    handlers, using a template.


    A development of NAPI might be able to store some number of packets (either on
    board or an in-memory DMA ring). It must also be capable of disabling interrupts
    for packet reception and keeping incoming interrupts suspended until timeout (and
    possibly other event).


    The result is a potential reduction in load on the CPU compared to an interrupt-driven
    approach. Generally TOE will be important for high-bandwidth, which is 1 GB or
    greater traffic.


    Given these capabilities, NAPI-based drivers turn off interrupts, and periodically
    down and consume resources with might; normal interrupts are turned back on in
    the old-style.


    The purpose of TOE (TCP/IP Offload Engine) is to move TCP/IP processing to an
    integrated board on the network card. With TOE, the device is free up to the CPU
    handle other tasks.


    One should require NAPI-based drivers only for few high bandwidth devices, and
    in general do not interrupt except CPU load.


    In Linux, however have been rejected inclusion of TOE because they are heavily
    based TOE. connection-oriented protocol, there is a lot of complexity involved.


    Assuming one has the necessary hardware capabilities for the device (the device
    to turn off incoming packets and to store sufficient amount of data packets),
    the first step in writing a network driver that includes interrupt mitigation
    is to add two new to the net_device structure


    Since the TCP/IP stack is implemented on the card, a block with a box closed sockets,
    it will need to keep up and have behaviour match expectations.


    Resource limitations (from the number of simultaneous connections that can be
    handled) are more than they are in Linux for this can be used to facilitate denial
    of attacks.


    The poll() method will handle the data that has accumulated when incoming interrupts
    are turned off. For 10 interfaces it should be set to 16; faster interfaces use
    64. The weight field should not be set to a greater than the number of packets
    that the interface can scan.


    For a detailed explanation of TOE why not be accepted in the main Linux kernel,
    see http://linux-net.osdl.index.php#TOE


    # 27.5 NAPI'
