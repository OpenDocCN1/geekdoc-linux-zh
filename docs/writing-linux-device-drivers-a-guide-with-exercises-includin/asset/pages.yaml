    # 6.2. USER-SPACE VS. KERNEL-SPACE


    # KERNEL


    | Processes | Memory | Filesystems |

    | --- | --- | --- |

    | Create/Destroy Schedule | Virtual Space Allocate/Free | Structured on Un-structured
    HW |

    | IPC Input/Output | Process Interaction | Multiple Types Process Interaction
    |


    # Networking


    +   - Networking operations are not process specific; must be handled by the operating
    system.

    - Incoming packets are asynchronous; must be collected, identified, dispatched.

    - The kernel also has to address routing and address resolution for network data.


    | Networking |

    | --- |

    | Receive Packets - Identity and Dispatch |

    | Send Packets - Routing and Address Resolution |


    # 6.2 User-Space vs. Kernel-Space


    # Execution modes


    user mode


    Applications and demons execute with limited privileges. (Ring 3 on x86). This
    is true even if the application has root privileges.


    kernel mode


    Kernel has privileged access to hardware and memory. (Ring 0 on x86). Drivers
    (and modules) have kernel privileges.


    +   - Inter-process communication (IPC) and signals and pipes.

    - Scheduling.


    Figure 6.1: Main kernel tasks


    | User Mode | Kernel Mode |

    | --- | --- |

    | Return |


    Figure 6.2: User and kernel space


    # Memory Management


    +   - Build a virtual address space for all processes.

    - Allocating and freeing up memory.

    - Process interaction with memory.


    # Filesystem


    +   - Build structured filesystems on top of unstructured data.

    - Use multiple filesystem types.

    - Process interaction with filesystems.


    Execution is transformed from user mode (space) to kernel mode (space) through
    system calls (which are implemented using synchronous interrupts, or exceptions)
    and hardware interrupts (as asynchronous interrupts).


    The mode is a state of each CPU in a multi-processor system rather than the kernel
    itself, as each processor may be in a different execution mode.


    # Device Management


    +   - Systems operations map to physical devices.

    - device drivers control operations for virtually every peripheral and hardware
    component.


    +   - When running virtualization kernels the hypervisor (Xen for example) runs
    in Ring 0, while the guest (client) kernels may run in Ring 0 or Ring 1 depending
    on the type of virtualization.

    - If it is Ring 1 a certain amount of tricky and/or emulation is required to accomplish
    this.'
