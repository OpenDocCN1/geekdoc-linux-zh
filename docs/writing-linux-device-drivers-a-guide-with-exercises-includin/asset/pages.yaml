    # crash


    The crash utility is provided by your Linux distribution and full documentation
    can be found at http://people.redhat.com/android/...


    With crash one can examine all critical data structures in the kernel, do source
    code disassembly, files through linked lists, examine and memory, etc. crash can
    also examine kernel core dumps files created by kdump, diskdump and xendump packages.


    # 10.2 Kernel Debuggers


    The first thing to understand about using debuggers on the Linux kernel is Linus
    Torvalds has taken him for explanation of why, see at, http://www.net.com/2009/0914/a-it-debugger.php3


    The short explanation for this is reliance on debuggers can encourage fixing problems
    with bad-radius threads, and leads to rotten kernel code


    Linus will to tolerate (and even encourage) optional debug aids that help check
    specific known errors (e.g. an I am sleeping while hiding a spinlock?), or require
    only an entry point to the kernel, and permit their work to be done through modules.


    # gdb


    The gdb debugger can be used to debug a running kernel. The execution line would
    be:


    ```

    $ gdb /boot/vmlinux /proc/

    ```


    where the first argument is the running unnamed kernel. One can use ddb or another
    graphical interfaces to gdb. The sections of the kernel debugged must have been
    compiled with the -g option, to get much useful information. This is not for the
    faint-hearted. It is pretty difficult.'
