    # 23.6 DMA Pools


    Suppose you need small DMA transfers. For coherent transfers, dma_alloc_coherent
    has a minimum size of one page. Thus, a good choice would be set up a DMA Pool,
    which is essentially a slab cache used for DMA transfers.


    +   * The direction of a transfer must match the value given during mapping.


    +   * After a mapping, it belongs to the device, not the CPU; the driver should
    not use the buffer until it has been unmapped.


    +   * Thus for a write the data should be placed in the buffer before the mapping;
    for a read it should not be touched until unmapping (which could be done after
    the device signals, through an interrupt, or through the transfer.)


    The basic functions are:


    A third kind of mapping is a so-called Scatter-gather DMA Mapping. This permits
    several buffers, which may be non-contiguous, to be transferred to or from the
    device at once.


    It is possible to set up a DMA pool, which works much like a memory allocation.
    We''ll consider that:


    ```

    #include <linux/dmapool.h>

    struct dma_pool *dma_pool_create(const char *name, struct device *dev, size_t
    size, size_t alignment, size_t allocation);

    void dma_pool_free(struct dma_pool *pool);

    void *dma_pool_alloc(struct dma_pool *pool, gfp_t flags, size_t size, dma_addr_t
    *addr);

    void dma_pool_free(struct dma_pool *pool, void *ptr, dma_addr_t addr);

    ```


    ![](img/4e539a55ab31f2c9df39e648783d8023_146_0.png)


    No actual allocation is done by dma_pool_create(); it sets up a pool named by
    name, to be associated with the device structure; capable of assemblying various
    sizes.


    The alignment argument (if any) is the hardware alignment of pool allocations.
    The final allocation, if not PAGE_SIZE, will buffers in the pool will not cross
    page boundaries.


    The memory allocation tag is passed to dma_pool_alloc(). The flags argument includes
    GFP_ATOMIC, etc. The return value is the virtual address of the DMA buffer, which
    is used by the driver as a handle.


    To avoid memory leaks, buffers should be returned to the pool with dma_pool_free(),
    and when all the pool can be wiped out with dma_pool_destroy().


    +   * Rather than using a generic interface, the 2.4 kernel used a PCI-specific
    interface. The main functions are in one-to-one with the generic ones and:


    # 23.7 Scatter/Gather Mappings


    ```

    #include <linux/pci.h>

    int pci_alloc_supported(struct pci_dev *dev, size_t size)

    int pci_set_dma_mask(struct pci_dev *dev, size_t size)

    void *pci_alloc_consistent(struct pci_dev *dev, size_t size, dma_addr_t *handle)

    void pci_free_consistent(struct pci_dev *dev, void *ptr, dma_addr_t addr)

    dma_addr_t pci_map_single(struct pci_dev *dev, void *ptr, size_t size, int direction)

    void pci_unmap_single(struct pci_dev *dev, dma_addr_t addr, size_t size, int direction)

    ```


    It is easy to DMA if you have only one (or small) contiguous buffer to work with.
    Then you can give it a starting address and a length and let the transfer in.


    However, one often has several buffers required at the same time, and they might
    not be physically contiguous. This might occur due to:


    +   * A Read() or write() system call.

    * A 1 I/O request.


    +   * Transfer of pages in a mapped kernel I/O buffer (such as one might have
    when using get_user_pages())


    Of course one can chain a series of individual requests, each of which represents
    a contiguous region. But many devices are capable of assembling them at the hardware
    level; so


    While this older API has been removed, it is now to use a wrapper around the general
    interface, which should be used in any new code.'
