    # 16.1 What is Firmware?


    Firmware consists of instructions and data embedded in a hardware device that
    are necessary for its proper functioning. This binary information can be stored
    in ROM, in rewritable EEPROM, or on flash memory. However, vendors often find
    it is cheaper and more reliable to have the firmware loaded by the operating system.


    While there is a gray area between deploying operating system loaded firmware
    and the use of binary blobs, it is mostly clear for a given device which is the
    more appropriate description. Use of firmware does not cause tainting of the Linux
    kernel. However, there are Linux distributions which have problems distributing
    drivers with binary firmware, or which do not distribute the binary itself.


    We''ll leave aside the question of where to obtain the firmware for a given device
    that requires'
