    Try and load and unload the module. If you look at /proc/devices you should see
    your driver registered, and if you look at /proc/modules (or type lsmod) you should
    see that your module is loaded.


    Creating a Device Node: Before you actually use the module, you''ll have to create
    the device node which applications interact. You do this with the mknod command:


    ```

    mkod /dev/mycdrv 700 0

    ```


    Note that the name of the device node (/dev/mycdrv) is irrelevant; the kernel
    identifies which driver should handle the system calls only by the number (700
    in this case). The minor (0 in this case) is generally used within the driver.


    Using the Module: You should be able to test the module with simple commands like:


    ```

    echo Sample > /dev/mycdrv

    cat sample /dev/mycdrv

    diff if=/dev/zero of=/dev/mycdrv count=1

    diff if=/dev/zero of=/dev/mycdrv count=-1

    ```


    We''ve only skimmed the surface; later we will consider the details of each of
    these steps.


