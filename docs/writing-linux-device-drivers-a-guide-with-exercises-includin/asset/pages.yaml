  md: '# CHAPTER 23. DIRECT MEMORY ACCESS (DMA)


    # 23.3. DMA MEMORY CONSTRAINTS


    # 23.1 What is DMA?


    Direct Memory Access (DMA) permits peripheral devices to transfer data to or from
    system memory bypassing CPU control. Proper use of DMA can lead to dramatic performance
    enhancement. Most non-typical peripherals are likely to have DMA capabilities.


    The specifics of transfers are very hardware-dependent, both in the sense of the
    CPU involved (e.g., x86 or Alpha), and the type of data (e.g., PCI, ISA, etc.),
    and to some degrees of their independence.


    Since the 2.6 kernel there has been present to unify, hardware-independent interface.
    This was achieved in the 2.6 kernel space, permitting to deal with more abstract
    methods than getting deep into the hardware particulars...


    On the x86 platform, DMA operates quite differently for ISA and PCI devices.


    +   - ISA: The hardware is less complex, but the devices are more complicated
    and have to work hard to manage DMA transfers.

    - PCI: The hardware is more complex, but the device drivers are less complicated
    and have easier managing DMA transfers.


    When you''re on the PCI bus which is most modern and widespread.


    # 23.2 DMA and Interrupts


    The efficiency of DMA is very dependent on proper interrupt handling. Interrupts
    may occur when the device acquires data, and are always issued when data transfer
    is complete.


    Transfer requires a DMA-suitable buffer, which must be contiguous and within an
    address range of the device. And we will follow this order: such that a buffer
    exists before the transfer and is not released until it is complete.


    Transfers can be triggered synchronously, or directly, such as when an application
    requests or pulls data through a read O(), which is the case:


    +   - The hardware is told to begin sending

    - The calling process put to sleep.

    - The hardware puts data in the DMA buffer.

    - The hardware issues an interrupt when it is finished.

    - The interrupt handler deals with the interrupt, acquires the data, and awakens
    the process, which can now read the data.


    When an application pushes (or writes) to the hardware one has a synchronous transfer
    and the steps are simple.


    Transfers can be triggered asynchronously when the hardware acquires and pushes
    data to the system when there are no masters at rest. In this case:


    +   - The driver must keep a buffer to the hardware until a read() call is issued
    by an application.

    - The hardware announces the arrival of data by raising an interrupt.

    - The interrupt handler handles the hardware to send the data.

    - The peripheral device puts data in the DMA buffer.

    - The hardware issues an interrupt when it is finished.

    - The interrupt handler deals with the data, and awakens waiting processes.


    Note that while pushes and pulls have many similar steps, asynchronous transfer
    involves two interrupts per transfer, not one.


    # DMA Memory Constraints


    DMA buffers occupy contiguous memory. You can''t use valloc(), kmalloc() and the
    get_free_page() functions. You can use the allocated functions with __alloc.


    If you specify DMA, the primary memory might not be contiguous, so on x86 it will
    fail under MAX_ADDRESS_16_BIT.


    For PCI bus which might be unstable and fastest, but then PCI devices which have
    addressing limitations (sometimes they were poorly crafted from an ISA device).
    Then it is necessary to check what addresses are suitable.


    Because the hardware is connected to a peripheral bus which uses addresses (while
    both kernel and user code use addresses) concerning functions are needed. They
    are used when communicating with the Memory Management Unit (MMU) or other hardware
    connected to the CPU''s address line:


    ```

    #include <io.h>


    unsigned long virt_to_bus(volatile void address);

    void *bus_to_virt(unsigned long address);

    unsigned long virt_to_phys(volatile void address);

    void *phys_to_virt(unsigned long address);

    ```


    You can look at the header file where these macros are defined.


    On the x86 platform bus and physical addresses are the same so they do the same
    thing.'
