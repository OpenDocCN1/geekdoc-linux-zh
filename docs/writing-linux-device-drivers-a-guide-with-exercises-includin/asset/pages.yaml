  md: '# CHAPTER 2. DEVICE DRIVERS


    # 2.1. TYPES OF DEVICES


    manages one or piece of hardware while the kernel handles process scheduling,
    filesystem access,

    interrupts, etc.


    Drivers may be integrated directly into the kernel, or can be designed as loadable
    modules. Not all

    modules are device drivers. A driver can be designed as either a modular or a
    built-in part of the

    kernel, with little or no change of the source.


    In the usual device taxonomy there are three main types:


    # Character Devices


    +   - Can be written to and read from a device at a time.

    - Well represented as streams.

    - Usually permit only sequential access.

    - Can be considered as files.

    - Implement open, close, read, and write functions.

    - Serial/parallel ports, console (monitor and keyboard), etc.

    - Examples: /dev/tty0, /dev/tty30, /dev/ttyS0, /dev/ttyS1


    # Block Devices


    +   - Can be written to and read from only in block-size multiplexer; access is
    usually cached.

    - Permit random access.

    - Filesystems can be mounted on these devices.

    - In Linux devices can behave like character devices, transferring any number
    of bytes at

    a time.

    - Hard drives, cdroms, etc.

    - Examples: /dev/sda1, /dev/vtd0


    # Network Devices


    +   - Transfer packets of data. Device sees the packets, not the streams.

    - Most often accessed via the BSD socket interface.

    - Instead of read, write, the kernel calls packet reception and transmission functions.

    - Network interfaces are not mapped to the filesystem; they are identified by
    name.

    - Examples: eth0, pp0


    ![](img/4e539a55ab31f2c9df39e648783d8023_18_0.png)


    Figure 2.1: From application to device


    # Device Types and User-Hardware Connection


    What differentiates the types of drivers is the methods they use to connect the
    kernel with user-

    space. Most of the time the connection passes through the VFS (Virtual File System),
    and then

    methods are invoked depending on whether the access is to a character device,
    block device

    devode, or a socket.


    Drivers may or not work on character devices; the essential thing is they are
    most

    directly connected to the kernel and the user to the hardware.


    Block devices are connected to the hardware, and to the user through the filesystem,
    caching, and

    t Virtual File System (VFS).


    Network drivers are connected to the hardware and to the user through various
    kinds of protocol

    stacks.


    # Other Types of Devices


    There are other types of devices which do not fit precisely in the character/block/network
    division

    (although they can be used for any of these three generic kinds of peripherals).


    SCSI (Small Computers Interconnect) devices share an unifying protocol regardless

    function. The hard work goes into the driver for the controller hardware which
    may run many

