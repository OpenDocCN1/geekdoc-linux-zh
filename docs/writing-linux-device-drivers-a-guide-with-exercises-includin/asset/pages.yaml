    look at /proc/interrupt to ascertain what is necessary.


    Take care when you call free_irq() as it is very easy to freeze your system if
    you are not careful.


    The driver can be very simple; for instance no open() and release() methods are
    specified, so the default.


    A read() on the device should return a binary report on the number of interrupts
    handled for each IRQ


    To do this will also have to write a short application to retrieve and print out
    the data.(Don''t forget to create the device node before you run the application.)


    | Return Value | Meaning |

    |---|---|

    | IRQ_NONE | The handler did not recognize the event; i.e., it was due to some
    device sharing the interrupt, or it was spurious.

    | IRQ_HANDLED | The handler recognised the event and what was wanted. |

    | IRQ_RETVAL(x) | Evaluates as IRQ_HANDLED if the argument is non-zero; IRQ_NONE
    otherwise. |'
