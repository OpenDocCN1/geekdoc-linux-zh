    \ is not atomic; so do we need to use\n\n```\nget_jiffies_64(void)\n```\n\nTo\
    \ read the value. One not need to set a value of counter.\n\nA number of macros\
    \ are provided to convert jiffies back and forth and which to use:\n\n```\n#include\
