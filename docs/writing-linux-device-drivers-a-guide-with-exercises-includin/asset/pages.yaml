    # 17.4 kmalloc()


    187


    Table 17.1: GFP memory allocation flags


    | Value | Meaning |

    | --- | --- |

    | GFP_KERNEL | Block and cause to sleep if the memory is not immediately available,
    allowing recursion to occur. This is the normal way of kmalloc(). |

    | GFP_ATOMIC | Returns immediately if no pages are available. For instance, this
    might be done when kmalloc() is called from an interrupt, where sleep would prevent
    other of interrupt. |

    | GFP_DMA | For buffers to be used with ISA DMA devices; it''s preferred that
    the memory is contiguous and falls under MAX_DMA. Ensures the memory is under
    16 MB on x86 for ISA devices; for PCI this is uncommon. The exact meaning of this
    flag is platform dependent |

    | GFP_USER | Used to allocate memory for a user. May sleep, and is a low priority
    request. |

    | GFP_HIGHER | Like GFP_USER, but allocates from high memory |

    | GFP_NOFS | Not for use in filesystem calls, disabling I/O initiation. |

    | GFP_RX | For internal use. |


    # 17.3 Page Tables


    Memory is broken into pages of fixed size (4 KB on x86). Portable code should
    not depend on a particular page size. To obtain the actual kernel page size use
    the PAGE_SIZE macro or user-space programs can call the getpagesize().


    For 4K pages the 12 bits of the virtual address contain the offset; the remaining
    bits contain the virtual page frame number (PPN).


    Pages of virtual memory may be in any physical memory. The kernel converts the
    virtual address to physical address using page tables. Each entry in the page
    table contains a valid flag, the PFN, and control information.


    If the requested virtual page is not valid, the kernel gets a page fault and then
    tries to get the page into proper physical memory. Demand Paging will fetch and
    bring the page. Page may have been swapped out to this disk.


    If a page has been modified and there are free physical pages, a page is marked
    as dirty and will be written to disk if the pages contain file-data, or to the
    swap area. Pages are deleted with a LRU (Least Recently Used) algorithm.


    Linux uses a four-level page table, though the 32-bit architecture uses only two
    levels of page tables. (Before version 2.6.0, Linux used a three-level page table).
    This permits using various functional methods for allocation, traversing the supervising
    levels although full-junction ranges.


    Drivers only use the values GFP_KERNEL, GFP_ATOMIC, and GFP_DMA.


    The in_interrupt() function can be used to check if you are in an interrupt or
    process context.


    If we use 64 GB of space on x86, Linux uses the PAE (Physical Address Extension)
    facility which gives an extra 4 bits of address space. In this it uses a three-level
    search, rather than one in one dimension


    ```

    char *kmalloc = kmalloc(size_t, int flags) ? GFP_ATOMIC : GFP_KERNEL);

    ```


    A similar mechanism, in_atomic(), also checks if you are in a preemptive context.


    The common functions for allocating and freeing memory in the Linux kernel are:


    +   * Note: GFP_ATOMIC allocations are allowed to draw memory resources more than
    those with GFP_KERNEL to lessen chances of failure; they should not be used when
    they are not necessary.


    ```

    #include <linux/slab.h>

    ```


    ```

    void kmalloc(unsigned int size, gfp_t gfp_mask);

    void kfree(void *ptr);

    ```


    Used to clear cleared memory,


    Possible values for the gfp_mask argument are detailed in /usr/src/include/linux/linux.h


    ```

    void kfree(size_t size, gfp_t flags);

    ```


    which calls kmalloc(size, flags) and then clears the allocated region.


