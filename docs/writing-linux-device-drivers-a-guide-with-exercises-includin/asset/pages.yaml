    # Lab 2: Working with the jff2 filesystem and the MTD interface.


    In order to place a jff2 filesystem on a MTD device it is easiest to first make
    a filesystem image on another filesystem, then copy it over. To do this you will
    need the mkfsj2 utility, which you can download in source or binary form from
    http://sources.redhat.com/jff2.


    You''ll need to


    ```

    modprobe mblock

    ```


    if you haven''t built it into the kernel.


    You''ll also have to make the proper device node:


    ```

    mkfs -m 666 /dev/mtdblock0 31 0

    ```


    Populate a directory (say /dir/tree) with some files and subdirectories; the total
    size should be less or equal to the size of MTD ram disk. Then put a filesystem
    on it and copy it over to the MTD block device using:


    ```

    mkfs.jff2 -d /dir/tree -o /dev/mtdblock0

    ```


    (You may want to separate these steps so you can keep the initial filesystem image;
    i.e., do something like


    ```

    mkfs.jff2 -d / -o jff2.image

    d dd if=jff2.image of=/dev/mtdblock0

    ```


    Now you can mount the filesystem and play with it to your heart''s content:


    ```

    mkdir /mnt_jff2

    mount -t jff2 /dev/mtdblock0 /mnt_jff2

    ```


    Note that you can change the contents of the filesystem as you would like, but
    the updates will be lost when you unload the MTD modules or reboot. However, you
    can copy the contents to an image file and save that for later.


    Note that if you have turned on some verbosity you will see messages like this


