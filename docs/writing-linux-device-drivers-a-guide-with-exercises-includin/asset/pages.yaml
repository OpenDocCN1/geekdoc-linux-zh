  md: '# 29.3 Driver and User Modules


    The MTD subsystem in Linux uses a layered approach, where the lower device layer
    is ignorant of filesystems and storage formats, and only have simple entry points
    for methods like write, and erase. The upper layer is ignorant of the hardware
    but handles all interaction with user-space.


    There are two kinds of modules comprise the MTD subsystem; driver may or not be
    actual kernel modules; which can be built.


    User modules provide a high level interface to user-space, where Driver modules
    provide the raw access to the devices.


    Currently implemented modules include:


    +   * Raw character: direct byte by byte access, needed to construct a filesystem
    or raw storage.

    * Raw block: used to put normal filesystems on flash. Flash blocks are cached
    in RAM.

    * FTL, NFTL (Flash Translation Layer Filesystem)

    * Microsoft Flash System: Read-only for now.

    * Journaling Flash System (JFFS2): Full read/write, compressed journaling filesystem.


    # 29.4 Filesystems


    Filesystems for flash devices have some important challenges:


    +   * Block sizes can be large (64 KB to 256 KB). Under Linux implementations,
    a block device cannot have a block size larger than a page frame (memory 4 KB
    on x86 and many other platforms).

    * NOR has a limit to the number of erase cycles per block; typically about 100,000.
    It is important to use all parts of the device equally.

    * There may be blocks which must be locked to out.

    * Flash memory is expensive, so compressed filesystems are attractive.

    * Journaling is enhancement; it shortens the power-down.

    * Execution in place is often needed in embedded systems, which is orthogonal
    to compression.


    A number of different filesystems have been used for flash devices, and lets consider
    each in them.

    itrd (Initial RAM Disk) was originally developed for use on floppy based systems,
    and to load a basic operating system which could load essential drivers, such
    as the case used in SCSI systems.


    # 29.5 LABS


    # 1. Emulating in MTD


    If you don''t have any MTD device on your, you can emulate them in memory using
    some built-in kernel features.


    First you''ll need to make sure you have all the right facilities built into the
    kernel. To use the kernel device, run mount -t with the appropriate option, such
    as using the jfs2 filesystem.


    The important ones are here: under MTD on Memory Technology Device Support, pick
    a level of debugging. U should also, turn on Direct device access... also turn
    on Test driver using RAM and MTD emulation using flash. Under Filesystems, turn
    on JFF2 and pick a verbosity level.


    If you have dont modules you may get away without a reboot, as long as you run
    deploy. At any rate, recompile, reboot, ..., into the kernel that knows about
    MTD and JFFS2.


    First we''ll test the character emulation interface. To do this you have to make
    sure you create the


    ```

    mkfs -666 /dev/mtd0 0 96

    ```


    When used with flash memory, itrd begins by copying a compressed kernel from flash
    to RAM and executes it, which decomposes the itrd image and mounts it using the
    ram driver.


    The disadvantages are fixed size, which is wasteful, and loss of changes upon
    reboot. Better approaches are now available.


    cram is a compressed read only filesystem, where the compression is done at the
    unit of pages. The filesystem is made with in /var/fs/cramfs/, and can be checked
    with the frantic utility, sources of which can be


    ramfs is a dynamic-simulated disk that is read/write in a flash for frequently
    modified or temporary data. jffs is developed by Applied Applications in Sweden
    (<http://developer.com/software/jffs>), with no compression. jff2 provides compression
    and is developed by a team led by David Woodward (http://source.redhat.com/jff2).


    The jff2一下子 consists of a list (log entry) containing file information. When the
    filesystem is mounted the entry is scanned to find out how to put together.


    Nodes are written sequentially from the first block on, and when the end is reached,
    the block is erased. This approach avoids wear over the device; thus, it provides
    wear-leveling.


    Note that more one filesystem can be used on the same device. For instance read-only
    media can be on cramfs, frequently changing data can be on ramfs, and anything
    requiring read/write access and perseverance across reboot can be on jff2.'
