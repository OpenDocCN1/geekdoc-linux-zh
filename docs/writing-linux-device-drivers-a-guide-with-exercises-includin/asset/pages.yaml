  md: "# CHAPTER 22. PCI\n\n22.6. PCI EXPRESS 261\n\nMulti-byte entries in the configuration\
    \ registers are little-endian, according to the PCI standard, which is the convention\
    \ on x86 platforms. The data type and functions handle any swapping that needs\
    \ to be done, unless on a system like the SPARC, which is big-endian, you don't\
    \ have to worry about bit order. But should be aware of it. Byte ordering is taken\
    \ care of by word and dand functions (Note some architectures, such as alpha and\
    \ IA64 are little-endian and can be configured either).\n\nConfiguration variables\
    \ are accessed using the symbols defined in /usr/src/linux/include/pci_reg.h,\n\
    \n```\npci_read_config_dev(dev, PCI_REVISION_ID, kredev),\n```\n\nIt is also possible\
    \ to use the setci utility to get and set values in the configuration.\n\n```\n\
    2.6.31: 772    mmio_start = pci_resource_start(dev, 1);\n2.6.31: 773    mmio_end\
    \ = pci_resource_end(dev, 1);\n2.6.31: 775    mmio_flags = pci_resource_flags(dev,\
    \ 1);\n2.6.31: 776    mmio_len = pci_resource_len(dev, 1);\n    ...\n```\n\n#\
    \ 22.6 PCI EXPRESS\n\nPCI was introduced in 1991 and later enhanced as PCI-X,\
    \ it has shown its age. In particular, bandwidth is limited up to 133 MB/s. Furthermore\
    \ bandwidth is shared among all the devices on the bus, and competition for it\
    \ must be negotiated.\n\nIn 1997 an AGP (Accelerated Graphics Port) was introduced\
    \ with its own bandwidth. But AGP has no momentum.\n\nPCI Express (now known as\
    \ PCIe) was introduced in 2004 and is gaining traction. Its main advantage is\
    \ that it is a point-to-point connection; bandwidth is direct via a serial bus.\
    \ However, providing daisies is easier, and less power is consumed than PCI.\n\
    \nEach device connects through a number of lanes each of which is bi-directional\
    \ and a 250 MB/s data rate for each direction up to 500 MB/s total data transfer\
    \ rate.\n\nThe number of lanes depends on the slot, card; there are 1, 2, 4, and\
    \ 16 slots available; the x16 slot has a bandwidth of 8000 MB/s and is used by\
    \ graphics cards. x32 and x64 cards are also used in the slot.\n\nAny PCI card\
    \ will work and correctly in any slot that is as large as it; e.g., if you put\
    \ an x1 card in an x16 slot, it will use fewer lanes.\n\nDevice drivers for PCI\
    \ will work well for PCIe as the standard was designed to cause little disruption\
    \ as possible.\n\n# 22.5 Accessing I/O and Memory Spaces\n\nAs mentioned, we will\
    \ have access to not only configuration registers, but also I/O ports and memory\
    \ regions associated with PCI devices. While it is going to list for these registers,\
    \ it is easier to use the generic resource management functions provided by the\
    \ kernel.\n\nThe relevant functions are\n\n```\nunsigned long pci_resource_start(struct\
    \ pci_dev *dev, int bar);\nunsigned long pci_resource_end(struct pci_dev *dev,\
    \ int bar);\nunsigned long pci_resource_len(struct pci_dev *dev, int bar);\nunsigned\
    \ long pci_resource_flags(struct pci_dev *dev, int bar);\n```\n\nin which stands\
    \ for Base Address Register.\n\nThe first functions return the starting and ending\
    \ address of one of the 0 to 6 I/O regions that can be found on the device; the\
    \ bar ranges from 0 to 5 and selects which one is requested.\n\nThe last function\
    \ returns the flags associated with the device, which are defined in /usr/src/linux/usr/src/linux/drivers/net/pci.c\n\
    \nHere's an example of using /usr/src/linux/usr/src/linux/drivers/net/pci.c:\n\
    \n```\n2.6.31: 738    _devinit net_device *rti8139_init_board(struct pci_dev *dev)\n\
    2.6.31: 740    {\n2.6.31: 762    pci_enable_device(dev);\n2.6.31: 763    if (rc)\n\
    2.6.31: 764        goto err_out;\n2.6.31: 766    \n2.6.31: 768    pio_start =\
    \ pci_resource_start(dev, 0);\n2.6.31: 769    pio_end = pci_resource_end(dev,\
    \ 0);\n2.6.31: 770    pio_flags = pci_resource_flags(dev, 0);\n2.6.31: 771   \
    \ pio_len = pci_resource_len(dev, 0);\n\n```\n\n# 22.7 Labs\n\n# Lab 1 PCI Utilities\n\
    \nThe pciutils (http://mj.ucw.edu/pciutils.html) contains the following:\n\n+\
    \   - lspci display information about PCI buses and connected devices, with many\
    \ options.\n- setci configure and configure properties of PCI devices.\n- update-pci\
    \ obtains the most recent version of the PCI ID database and installs it on your\n\
    system."
