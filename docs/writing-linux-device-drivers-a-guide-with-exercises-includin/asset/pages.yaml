    A timer can reinstall to set up a periodic timer. This can be done in either of
    two ways:


    Linux has implemented a very clever method in which it manages 512 doubly-linked
    lists, so that the next and prev fields in the timer_list struct point only within
    one of the lists at any time. Which list depends on the value of the expires field.


    ```

    init_timer(&timer);

