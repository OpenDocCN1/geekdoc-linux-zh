  md: '# CHAPTER 2. DEVICE DRIVERS


    # 2.3. AVOIDING BINARY BLOBS


    ![](img/4e539a55ab31f2c9df39e648783d8023_19_0.png)


    Figure 2.2: USB Controller, Core and Device


    User-drivers, like the video drivers incorporated into X.Org (http://www.x.org),
    work completely in user-space, and can privilege to directly address hardware.
    They use the ioperm() and iopl() functions to access them, which we will discuss
    when we discuss reading and writing to i/o ports.


    # 2.2 Mechanism vs. Policy


    Device drivers should maintain a clear distinction between mechanism and policy.


    By mechanism, we mean providing flexibly the abilities that the device itself
    can amply perform. By policy, we mean controlling how those capabilities are used.


    In other words it is not up to the driver to enforce certain decisions (unless
    there is a hardware limitation) such as:


    +   * How many processes use the device at once.


    A driver may come with a user-space control program, or daemon, which has the
    capability of controlling policy. As such, it should provide settings of parameters
    and managing behaviour, through /dev or /sys.


    A driver which fails to distinguish between mechanism and policy is a recipe for
    trouble. However users may have different choices about what was made. One should
    never underestimate the likelihood of a user behaving in an unexpected fashion.


    # 2.3 Avoiding Binary Blobs


    There is a method of deploying a Linux driver which has been promoted by certain
    vendors, with which we strongly disagree.


    The essence of this method is to separate the driver into two parts:


    +   * A binary blob for which the source is not used. This blob may contain all
    or part of the driver from another source (usually from you-know-who).


    +   * An open-source glue layer, which calls into the binary blob as well as the
    kernel API.


    ![](img/4e539a55ab31f2c9df39e648783d8023_19_1.png)


    Figure 2.3: Using binary blobs in drivers


    Various examples of this method may be used by Nvidia graphics drivers, ndiswrapper
    wireless and NIC drivers, and various filesystem drivers.


    With this method the driver can call into the binary blob whatever code has been
    ported from another operating system, or whatever code is wanted to keep private;
    the first reason is most likely Linux lacking the driver is definitely not.


    When a driver is the kernel binary blob that means it is impossible to debug properly
    because there is no source available for all the kernel.


    We disapprove this method for many reasons, but two are sufficient:


    +   * Loading binary code into the kernel is a recipe for disaster.

    "* Manufacturers use Linux as Linux and don''t support the development of generic
    open-source drivers."


    Thus, we won''t teach this method and we discourage the use of such drivers, much
    less their development.


    +   * Use of firmware is not the same as the methods described above. This firmware
    is data that could have been put in the kernel'
