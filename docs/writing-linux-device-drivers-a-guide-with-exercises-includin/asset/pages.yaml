    # 11.6 Timer Implementation


    # High Resolution Timers


    The kernel approach to timer implementation, which is both quite clever and efficient,
    received a great embrace with the addition of a new approach, introduced since
    the 2.6.16 kernel


    The implementation of dynamic timers has to care to two distinct tasks:


    We begin with the observation that there are two kind of dynamic timers:


    +   - Functions have to be inserted and removed from the list of timers, or have
    the expiration times modified.

    - Functions have to be executed at the proper time.


    +   - Timer functions, found primarily in networking code and device drivers,
    used to signal when an event-does not happen within a specified window of time,
    and each task should be dropped or a recovery action initiated.

    - Timer functions, expected to actually run within a specified latency and sequence,


    The simplest implementation would be maintain one linked list of kernel timers,
    and add the requested timer function either at the tail, or in some kind of sorted
    fashion, and then when the kernel decides to run any scheduled timer, scan the
    list and run those whose value has expired.


    Timeout functions tends to be more numerous than timers, and thus in the present
    timer implementation, removal of a timer before it runs is more frequent than
    actually running the function.'
