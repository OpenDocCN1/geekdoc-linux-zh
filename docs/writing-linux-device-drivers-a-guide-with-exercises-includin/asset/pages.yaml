    \nWe will discuss asynchronous I/O, the functional interface for it, and\nmethods\
    \ of implementation under Linux.\n\n+   - 33.1 What is Asynchronous I/O? . . .\
    \ 345\n- 33.2 The Posix Asynchronous I/O API . . . 346\n- 33.3 Linux Implementation\
    \ . . . 347\n- 33.4 Labs . . . . 348\n\n# ## 33.1 What is Asynchronous I/O?\n\n\
    Normal all I/O operations are performed synchronously; an application will block\
    \ until the read\nor write is completed, successfully or unsuccessfully.\n\nNote\
    \ that this doesn't mean all writes will be flushed to disk immediately, only\
    \ when inter-\na with the virtual file system has been completed.\n\nBut if I/O\
    \ requests are queued up, and program execution continued in parallel with\ncompletion\
    \ of the I/O request? This is particularly useful on SMP systems and using\nDMA,\
    \ which does not involve the CPU. When this is done, it is called asynchronous\
    \ I/O, or AIO."
