    # 12.4  Spinlocks


    A spinlock is a mechanism for protecting critical sections of code. It will spin
    waiting for a resource to be available, and not to sleep.


    One can protect the same section from executing on one CPU, but more than one
    processor can simultaneous access to the same resource, which may be touched by
    different code paths, in addition, which may be in interrupt context or process
    context.


    Spinlocks is important only multi-processor systems before kernel locking. This
    was on SMP two CPUs can run to access a critical section of code simultaneously,
    spinlocks were defined as necessary. However, with primitive, hyper-threaded,
    or multi-core system, spinlocks are always necessary.


    Note that the ATOMIC_(), atomic_read(), and atomic_set() macros are automatically
    atomic since they just use a value.


    On 64-bit platforms there are 64-bit atomic type and functions, such as atomic_64_and_set().
