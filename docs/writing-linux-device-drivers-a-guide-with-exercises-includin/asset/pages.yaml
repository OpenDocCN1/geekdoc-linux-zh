  md: '# CHAPTER 18. TRANSFERRING BETWEEN USER AND KERNEL SPACE


    # 18.2 PUT(GET).USER() AND COPY_TO(FROM).USER()


    # 18.1 Transferring Between Spaces


    User-space applications operate in a different (virtual) memory space than the
    kernel.


    When an address is passed to the kernel, it is the virtual address in user-space.
    An example would be the pointer to buffer in the (read) and (write) driver entries.


    Any attempt from the kernel to directly access virtual pointers is a good recipe
    for disaster. As a matter of principle, these may not be meaningful in kernel-space.


    One might get away with deferring a pointer from user-space - for while. If a
    page fault occurs, the kernel will then copy the data from the story of that one
    should never directly deference a user-space pointer in kernel-space.


    The functions which accomplish the two distinct things:


    +   * Verify the user-space address, and handle any page faults that may occur
    if the page is not resident in memory.

    * Perform a copy between the user and kernel addresses.


    Using raw I/o or memory mapping can avoid copying.


    # 18.2 put(get).user() and copy_to(from).user()


    ```

    unsigned long len;

    unsigned long [__copy_to_user (

    unsigned long to,

    unsigned long from,

    unsigned long len);

    ```


    ```

    long __strpy_user(const char *dst, const char *src, long count);

    long strlem_user(const char *str, long n);

    unsigned long __clear_user(void *user, unsigned long len);

    ```


    +   * These functions are the only place in the kernel page faults are handled
    - they are in user-space, by demand paging or segmentation faults according to
    whether or not they are legal.

    * This occurs only on pages for the user-space pointer; the kernel swaps out pages
    for its own use and allocates them with urgency and thus never has demanded failing
    for kernel memory.


    All the functions can be used only in the context of a process, which must refer
    to the current process''s task_struct data structure in order to do the address
    translation. Calling them from an interrupt routine is never good recipe for disaster.


    One should never ensure the following with a spinlock, as they may go to sleep,
    in which case your driver (or the system) could get hurt, the spinlock might never
    be released.


    ```

    #include <linux/uaccess.h>

    access_ok(int type, unsigned long addr, unsigned long size);

    ```


    ```

    int get_user(value, void *ptr);

    int __get_user(value, ptr);

    int put_user(void *expr, long ptr);

    int __put_user(expr, ptr);

    ```


    ```

    unsigned long [__copy_from_user (

    unsigned long from,

    unsigned long to,

    unsigned long len);

    ```


    # access_ok()


    type is VERIFY_READ or VERIFY_WRITE depending on what you want to do in user-space.
    For both use VERIFY_WRITE


    addr is the address to be checked.


    size is a byte count.


    It is called by most of the following functions; rarely needs to be called directly.


    Returns 1 (true) if process access is allowed; 0 on failure.


    # get_user()


    Transfers data from user space to kernel space.


    Assigns to value retrieved from the pointer ptr.


    It is implemented as a macro, depends on the type of ptr.


    Calls access_ok() internally.


    Retrieves a single value.


    Returns 0 for success, -EFAULT otherwise.'
