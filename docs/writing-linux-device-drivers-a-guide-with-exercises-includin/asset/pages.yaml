  md: 'At some it is necessary for the task to go sleep until whatever condition or
    resource it is waiting for. When the resources become available, or the condition
    becomes (perhaps signaled by the arrival of an interrupt) it becomes necessary
    to wake up the sleeping task.


    There can be wait queues in the system and they are organized in a list. In this
    manner a task can be put asleep and woken up.


    Another way to wait is to think of task organization and queues. There is a linked
    list of all tasks that HAVE TASKING in the state of their task_struct, called
    the Runqueue. A task is scheduled out but would come back into the field as soon
    as a timescale is available and becomes ready again.


    Sleeping with state TASK_INTERRUPIBLE, UNINTERRUPTIBLE, or TASK_KILL goes into
    one of many wait queues, of which corresponds to waking up by a particular event
    or case, at which point the sleeping task can go back to running.


    Sleeping and waking up come into two forms: interruptible and uninterruptible.
    An uninterruptible task is not woken up by a signal and as should be ready, especially
    in device drivers. It is quite difficult to get out of a task lock in this situation
    unless a reboot is made or the task is terminated by an ancestor process.


    The TASK_KILLABLE is woken up only by a signal (while TASK_INTERRUPTIBLE with
    any signal). It was introduced in 2.6.4.


    When a wait queue is woken, all tasks on the queue are roused (unless an exclusive
    sleep is used, as we shall).


    It is very easy to crash with improper use of wait queues. In kernel threads,
    execution of interrupt service should never go to sleep.


    The data structure used for queues is of type wait_queue_head_, just called a
    wait queue. It is explicitly declared and initialized with the statements


    ```

    #include <linux/sched.h>


    wait_queue_head_t wq;

    init_waitqueue_head(&wq);

    ```


    If the wait queue is not allocated it can run at time and initialized by it


    ```

    DECLARE_WAIT_QUEUE_HEAD(wq);

    ```


    Don''t forget to initialize a wait queue.


    # 19.2 Going to Sleep and Waking Up


    Now that we have set up a wait queue, we need to use functions for putting a task
    to sleep and waking it up.


    ```

    #include <linux/sched.h>

    ```


    19.2. GOING TO SLEEP AND WAKING UP


    ```

    wait_event(wait_queue_head_t wq, int condition);

    wait_event_interruptible(wait_queue_head_t wq, int condition);

    wait_event_killable(wait_queue_head_t wq, int condition);

    ```


    ```

    wake_up(wait_queue_head_t wq);

    wake_up_interruptible(wait_queue_head_t wq);

    ```


    The wait_event() calls are macros. They do not take wq, as their argument.


    The proper wake call should be paired with the originating sleep. (However, wait_event_killable()
    should be paired with wake_up(), which''s impossible).


    In general you will use the interruptible wait function which it returns 0 if
    the task was woken up by a call and -ERESTARTS if it return a signal. The other
    forms are rarely used except by critical sections of the kernel, as while waiting
    for a page to read back from memory.


    When you use the interruptible function, you will always have to check whether
    your task was woken up by a signal, or there was an explicit wake up. The signal_pending(current)
    macro can be used for this purpose:


    The condition has two purposes:


    +   - It avoid the race condition in which a task is designated to sleep but the
    wake up before the change comes in time; the condition is checked before putting
    the task to sleep.

    - It checks the condition upon waking up and if it is not true the task remains
    asleep. This help could avoid another case of race conditions where a task is
    set to sleep before it has a chance to wake up.


    You will have to call the wake_up functions when your tasks are ready; they do
    not set up a sleeping until the condition evaluation as true (non-zero).

    Some times you want to not sleep long. For this purpose one can use:


    ```

    wait_event(wait_queue_head_t wq, int condition);

    wait_event_interruptible(wait_queue_head_t wq, int condition);

    ```


    If they return error, the remaining function in the timeout period. The interruptible
    returns 0 for a signal or a timeout.


    The waking functions will wake all sleepers on the specified wait queue. There
    is no order in which they will be woken up; they will be scheduled by priority
    algorithms rather than FIFO or LIFO. The tasks can be woken up by any CPU. A little
    more can be obtained with:


    ```

    wake_up_interruptible_sync(wait_queue_head_t wq);

    ```


    which checks whether the task being woken has a higher priority than the currently
    running one, and if so, invokes the scheduler if possible. However, this is rarely
    done.

