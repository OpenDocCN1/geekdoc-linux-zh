    # 17.9 LABS


    # 193


    A dynamic and interactive view of the caches on the system can be obtained by
    using the slab utility, where the elements can be seen in many ways. One can see
    the same information by using the command -m.


    # 17.9 Labs


    # Lab 1: Memory Caches


    Now that you have created your memory cache, you can make any number of objects
    associated with it, and free them with:


    ```

    void kmalloc_alloc(struct kmalloc_cache *cache, gfp_t size, gfp_t flags);

    void kmalloc_free(struct kmalloc_cache *cache, void *obj);

    ```


    Extend your character driver to allocate the kernel''s internal buffer using your
    own memory cache. Make sure you free any slabs you create.


    pointing to the cache you created as the first argument. The gfp_mask argument
    is the same as for __get_page(). (If the memory does not already exist in the
    cache, it will be created using the flag). The second argument to __free() simply
    tells you what to get from kmalloc_alloc().


    For extra credit create more than one object (perhaps every time you do a read
    or write) and make you release them all before destroying the cache.


    You can use the function cache_shrink() to release unused objects. When you no
    longer need your memory cache you must free it with cache_destroy() (which shrinks
    the cache first); otherwise memory will not be freed. This will fail if any object
    allocated to the cache has not been released.


    # Lab 2: Testing Maximum Memory Allocation


    See how much memory you can obtain dynamically, using both kmalloc() and __get_free_page().


    It is also possible to set up a memory cache that never drops below a certain
    size using a memory pool, for which the API can be found in /usr/src/linux/linux/mempool.h.
    Such memory is taken outside of the normal memory management system and should
    be used only for critical purposes.


    Start with requesting 1 page of memory, and keep dropping until your requests
    for each task fails.


    Make sure you free any memory you receive.


    You''ll probably have to use GFP_ATOMIC rather than GFP_KERNEL (?)


    ![](img/4e539a55ab31f2c9df39e648783d8023_108_0.png)


    If you have enough memory due to memory fragmentation trying to allocate a poor-man''s
    de-fragmenter, and then running again. The de-fragmenter can be an application
    that has all available memory, uses, and then releases it when done, clearing
    the caches. You can also use the command sync; echo 3 > /proc/sys/drop_caches.


    Try the same with vmalloc(). Rather than doubling allocations, start at 4 MB and
    in 4 MB increments until failure results. Note this may hang while loading. (?)


    +   * The 2.6.22 kernel introduced SLUB as a drop-in replacement for the older
    SLAB implementation. Which to use is a complete time; in the 2.6.23 kernel SLAB
    was made.

    * The new allocator has less of the complexity that evolved in the old one, a
    smaller memory footprint, some performance enhancements, and easier debugging
    capabilities.

    * Eventually SLAB will disappear, but due to the importance of having a stable
    allocator, this will only happen after SLUB has withstood the test of large scale
    deployment.'
