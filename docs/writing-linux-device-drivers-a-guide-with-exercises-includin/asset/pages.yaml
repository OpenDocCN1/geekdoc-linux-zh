  md: '# CHAPTER 34. I/O SCHEDULING


    When there are no more requests, work continues with normal pending I/O requests.


    The basic goal is to reduce the thread-response time. This scheme is similar in
    implementation the deadline scheduler, and can be considered a variation on it.


    # Tunables


    antic_expire:


    Maximum time (in milliseconds) to wait anticipating a good read (close to the
    most recently expired request) before giving up. (Default = HZ/150 = 6)


    read_expire:


    How (in milliseconds) until a read request expires, as well as the interval between
    serving expired requests. (Default = HZ/8 = 125)


    read_batch_expire:


    How (in milliseconds) a batch of reads gets before pending writes are served.
    Should be a multiple of expire. The higher the value, the more reading is favored
    over writing. (Default = HZ/40)


    write_expire and write_batch_expire:


    Serve the same functions for write. (Defaults = HZ/4 = 250, HZ/8 = 125)


    cost_time:


    Give some statistics.

    Some documentation can be found at: /usr/src/linux/Documentation/block/as-iosched.txt.


    # 34. Labs


    # Lab 1: Comparing I/O schedulers


    Write a script (or program you prefer) that cycles through available I/O schedulers
    on a hard disk and does a number of parallel reads and writes of a configurable
    size. You''ll want to test reads and writes as separate steps.


    Test you to make sure you''re actually reading from disk and not from cached pages
    of memory: you can out the cache by


    ```

    # echo 3 > /proc/sys/vm/drop_caches

    ```


    Before doing reads, you can copy a single file (which is in cached memory after
    the first read) multiple times simultaneously. To make sure you wait for writes
    to use a wait command under the shell.


    To test you you wait for all writes to complete before getting your timing information
    you can use a sync cache.


    # Chapter 35


    # Block Drivers


    We''ll talk about what they are and how they are registered and unregistered.
    We''ll consider block buffering, important gendisk data structure. We''ll discuss
    the block driver function and see how reading and writing block is quite different
    than other devices.


    +   35.1 What are Block Drivers? . . . . . . 357

    35.2 Buffering . . . . . . . . . . . . 358

    35.3 Registering a Block Driver . . . . . 358

    35.4 gendisk structure . . . . . . . . . 360

    35.5 Request Handoff . . . . . . . . . . 362

    35.6 Late . . . . . . . . . . . . . 365


    # 35.1 What are Block Drivers?


    Drivers for block devices are similar in ways to those for character devices,
    but differences are many and deep.


    In normal usage, block devices contain formatted and mountable filesystems, which
    allow random (non-sequential) access. The device driver does not depend on the
    type of filesystem on the device.'
