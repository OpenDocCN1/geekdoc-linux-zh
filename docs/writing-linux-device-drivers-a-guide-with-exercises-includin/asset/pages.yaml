  md: "# CHAPTER 35. BLOCK DRIVERS\n\n# 35.3. REGISTERING A BLOCK DRIVER\n\nWhile\
    \ a particular system can request any number of bytes, the low-level read/write\
    \ requests\\must be in units of the block size. Each is cached (unless explicitly\
    \ requested)\nmeans which the device may be delayed, and reads may be satisfied\
    \ from cache.\n\nThe drivers do not have their own read/write functions. They\
    \ deploy a request function, a\ncallback function invoked by the higher levels\
    \ of the kernel in a fluid that depends on the device\n\nBlock devices may have\
    \ partitions. In this the partition number corresponds\nto device's minor number,\
    \ while the device shares the same major number. The naming\nfor the nodes is:\n\
    \n```\n#include <linux/fs.h>\n\nint register_blkdev(unsigned int major, const\
    \ char *name);\nint unregister_blkdev(unsigned int major, const char *name);\n\
    ```\n\nregister_blkdev() returns 0 on success or -EINVAL on failure. Dynamic assignment\
    \ is\nment. The value of major must be less than or equal to MAX_BLKDEV=256.\n\
    \nunregister_blkdev() returns 0 on success and -EINVAL on failure. It checks that\
    \ major\nand name matches correctly, but doesn't check if you are the owner of\
    \ the device when\nunregistering.\n\nMajor Name — Partition\ne.g., /dev/hda has\
    \ a Major Number of 8, and hda1 (the second), and Partition 4. Details of\npartitions\
    \ are contained in the generic data structure.\n\nBlock devices may also expose\
    \ removable media such as CD-ROMs and disks.\n\n![](img/4e539a55ab31f2c9df39e648783d8023_191_0.png)\n\
    \n# 35.2 Buffering\n\nFiles reside on block devices which are organized in fixed\
    \ size blocks, although I/O requests,\nwith system calls, may be for any number\
    \ of bytes. Thus block devices must be controlled by a\nbuffer/caching scheme,\
    \ which is shared among all devices.\n\nThe data is cached through the page cache,\
    \ and a page may contain more than one\nblock buffer.\n\nThe device itself is\
    \ accessed if it\n\n+   - A block is not necessarily loaded on a request.\n- A\
    \ block needs to be written (eventually) if the cache no longer matches what is\
    \ on\ndevice itself. If the block must be marked as dirty. If it is opened with\
    \ the\nO_SYNC flag, no locking is allowed.\n\nAt intervals the flush process scans\
    \ all modified blocks that haven't been\nused for a certain amount of time, to\
    \ be flushed back to device. Other events may trigger\nflushing, the object being\
    \ used to keep the number of dirty blocks in the cache at a minimum,\nan to make\
    \ sure the most important blocks, describing inodes and superblocks, are kept\
    \ constant.\n\nThe sync command writes all buffered buffers in cache. The filesystem\
    \ system call can\nwrite back all buffered buffers for a single block.\n\n# 35.3\
    \ Registering a Block Driver\n\nRegistering a block device is generally done during\
    \ the initialization routine, and in many ways is\nsimilar to doing it for a character\
    \ device. Unregistering is generally done during cleanup\nroute, just as for a\
    \ character device. The functions for this are\n\n+   - There exist more modern\
    \ block device registration and unregistration functions,\nblk_register_region()\
    \ and blk_unregister_region().\n\n+   - The use of these is somewhat complicated\
    \ and can be read in an article by John\nCorbett in the Kernel driver series:\
    \ http://www.kernel.org/Articles/25711.\n\nThe block_device_operations manage\
    \ the file_operations structure for\ncharacters. It gets also associated with\
    \ the device in the generic data\nstructure, as we will show shortly.\n\nThe block_device_operations\
    \ structure is defined in /usr/src/linux/include/fs.h as:\n\n```\nstruct block_device_operations\
    \ {\n\tint (*open)(struct inode *, struct file *, struct device *dev);\n\tint\
    \ (*release)(struct inode *, struct file *, struct device *dev);\n\tint (*ioctl)(struct\
    \ inode *, struct file *, unsigned int cmd, unsigned long arg);\n\tvoid (*locked_unlock)(struct\
    \ block_device *bdev);\n\tint (*request_fn)(struct block_device *bdev, struct\
    \ request_queue *q);\n\tint (*direct_access)(struct block_device *bdev, sector_t\
    \ sector, void **kaddr);\n\tunsigned long bd_count;\n\tint (*invalidate_block)(struct\
    \ block_device *bdev);\n\tint (*init)(struct block_device *bdev, struct block_geometry\
    \ *geometry);\n\tstruct module *owner;\n};\n```\n\nFor simple drivers, one need\
    \ to define (open) and (release) entry points, as generic ones\ndo do the basic\
    \ work. However, real hardware will probably need to perform certain steps at\
    \ times\nand still need specific methods to be written."
