  md: '# Network Layers


    CHAPTER 24. NETWORK DRIVERS I: BASICS


    24.1. NETWORK LAYERS AND DATA ENCAPSULATION


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_0.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_1.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_2.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_3.png)


    Figure 24.1: Network layers


    This networking can also be seen as containing a number of stacked layers. This
    stack may be categorized in a number of ways, but a simple description for Linux
    (in which traffic both layers) would be:


    +   * Application Layer: This can be familiar protocols such as ftp, http and
    smtp, that communicate across the Internet, or as X clients and servers that communicate
    either across the Internet or the local machine, as well as any custom network
    protocol.


    +   * Transport Layer: This is the method of data encapsulation, error checking
    protocols, etc. The two most common examples are streaming (usually ''TCP'' (Transmission
    Control Protocol)) connected and connectionless UDP (User Datagram Protocol) connections.
    Other examples include SLIP and PPP.


    +   * Network Layer: This describes how data is to be sent across the network,
    containing routing information. The most common protocols are IPv4 (Internet Protocol
    Version 4) and IPv6 for local machine communication. Other examples include ARP
    and ICMP.


    +   * Data Link Layer: This is the hardware part. It includes both type of device
    (Ethernet, Token Ring, etc.) and the actual device driver for the network card.


    Networking applications send and receive information by connecting to sockets,
    which are endpoints for communication. Data is sent to or received from sockets
    as a stream, whether or not the transport layer uses connectionless unsequenced
    data (such as UDP) or connection-oriented sequenced data (such as TCP). Various
    combinations of these layers are possible,


    The basic unit that moves through the network is the packet, which contains the
    data but also headers and footers containing control information. The kernel,
    is described by a socket.


    These headers and footers contain such as the source and destination of the packet,
    various options about priority, sequencing, and routing, information of the device
    driver associated with the socket, etc.


    When an application writes into a socket, the transport layer creates a series
    of one or more packets and adds control information. It then hands them off to
    the network layer which adds more control, and decides where the packets are going;
    Packets out of the network are handed off to datalink layer and device driver.


    When packets are received by the datalink layer, it checks if they are intended
    for the local machine, and if so it processes and hands them off to the network
    layer, which passes them to the transport layer, sequences sequences them and
    finally strips out the data and sends it back to the application.


    # Data Packet Encapsulation


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_4.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_5.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_6.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_7.png)


    ![](img/4e539a55ab31f2c9df39e648783d8023_149_8.png)


    Figure 24.2: Data Packet Encapsulation


    As packets move up and down through the networking layers, the kernel avoids repeated
    copying by passing pointers to the encapsulated data buffer, or payload, in the
    packet, while modifying headers and footers as necessary.'
