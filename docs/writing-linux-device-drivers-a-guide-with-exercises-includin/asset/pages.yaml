  md: "CHAPTER 9. MODULES II: EXPORTING, LICENSING AND DYNAMIC LOADING\n\n9.2. MODULE\
    \ LICENSING\n\n# 9.1 Exporting Symbols\n\nIn order for kernel-level code to make\
    \ a symbol (i.e., a variable or function) available for use by modules, it should\
    \ properly export it. If a module has symbols which are to be used by modules\
    \ that are loaded after it, it is also necessary to export the symbol.\n\nThis\
    \ can be achieved with the use of the EXPORT_SYMBOL() macro:\n\nBesides the content,\
    \ this macro has important consequences: Any other license causes the kernel to\
    \ be tainted, and warning messages appear when the module is loaded. For the worst\
    \ part may cause system problems, crashes etc. arise when using a tainted kernel\
    \ are likely to be introduced by developers (the pseudo-file /proc/sys/kernel/tainted\
    \ shows your kernel's status).\n\nThe following licenses are understood by the\
    \ kernel:\n\n```\nint my_variable;\nint my_export_fun( void * );\nEXPORT_SYMBOL(my_variable);\n\
    EXPORT_SYMBOL(my_export_fun);\n```\n\nTable 1.1: Licenses\n\nNote that the symbols\
    \ will be exported if they are declared as static.\n\nIt is also possible to export\
    \ by the macro\n\n| License | Meaning | Tainted? |\n| --- | --- | --- |\n| GPL\
    \ | GNU Public License, V2 or later | No |\n| GPL v2 | GNU Public License | No\
    \ |\n| GPL and additional rights | GNU Public License, V2 and more | No |\n| Dual\
    \ BSD/GPL | GNU Public License, v2 BSD license | No |\n| Dual MPL/GPL | GNU Public\
    \ License, or Mozilla license | No |\n| Dual MIT/GPL | GNU Public License, V2\
    \ or MIT license | No |\n| Proprietary | Non free (as in freedom, not free) |\
    \ Yes |\n\n```\nEXPORT_SYMBOL(func);\n```\n\nExactly how this symbol should be\
    \ used and interpreted has been discussed. Certainly it means quite literally\
    \ the symbol can be exported to modules are licensed under the GPL, e.g., it can\
    \ be used in binary-only modules. However, some it should be done only for modules\
    \ that are used by the kernel's basic functions.\n\nThere are some other methods\
    \ of exporting symbols:\n\n```\nEXPORT_PER_GPL(symbol);\nEXPORT_PER_GPL_SYMBOL(func);\n\
    EXPORT_SYMBOL_GPL_FUTURE(symbol);\nEXPORT_SYMBOL_EXPORT(symbol);\n```\n\nYou can\
    \ see the licenses of loaded modules with a script like\n\n```\n#!/bin/bash\n\
    for name in $(cat /proc/modules | awk '{print $1}');\n  do echo -n \"$name: \\\
    t\"\n  modinfo \"$name | grep license\ndone\n```\n\nKernel fear that the 2.6 series\
    \ exports global symbols in modules unless they are declared as static; this is\
    \ one reason why we use the static keyword used in kernel code, for the purpose\
    \ of avoiding pollution.\n\n+   - A phrase seems heard in the Linux developer\
    \ community is:\n  All binary modules are illegal.\n- A debate on this was on\
    \ the kernel mailing list in 2006. (See http://www.kernel.org/Articles/215075-a).\
    \ The main view coming out of that stated binary modules could not be tainted,\
    \ because the GPL controls distribution and not use of them.\n- We don't want\
    \ to get into a legal discussion here, but it is clear whether or not certain\
    \ practices were accepted in the past, the future trend is that it is only going\
    \ to become more difficult to get away with binary modules.\n- Even if enforcement\
    \ is not pursued vigorously, it is clear that increasing technical impediments\
    \ and inefficiencies are making proprietary more difficult and more expensive\
    \ if not downright impossible.\n\n# 9.2 Module Licensing\n\nModules can be licensed\
    \ with the MODULE_LICENSE() macro, as in:\n\n```\nMODULE_DESCRIPTION(\"Does Everything\"\
    );\nMODULE_AUTHOR(\"Fandals with Handle\");\nMODULE_LICENSE(\"GPL v2\");\n```\n\
    \n105\n\n104"
