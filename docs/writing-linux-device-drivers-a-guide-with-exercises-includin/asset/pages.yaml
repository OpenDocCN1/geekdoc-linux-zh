    \ of the callback functions (init_module() and cleanup_module()) will still work,\
    \ using them without module_init() and module_exit() macros is deprecated.\n-\
    \ Many in the kernel still use the init_module(), cleanup_module() functions,\
    \ especially for a driver that is always loaded as a module. While this is harmless,\
