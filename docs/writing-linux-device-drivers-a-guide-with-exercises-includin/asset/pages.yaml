  md: '# 6.3 Algorithms and Task Structures


    Scheduling is among the most important work the kernel does. The main code for
    this is in /usr/linux/include/sched.h and /usr/linux/sched.c.


    Tasks switch back and forth between kernel mode and user mode (when they have
    lower priority the kernel doesn''t control these modes, but it does have to handle
    the switching between different tasks).


    Under Linux, a task by itself cannot preempt a running task and take over; it
    must wait for its time-slice to expire. However, the scheduler can preempt one
    task to allow another.


    Tasks run until one of the following:


    +   - We need for some system event to complete (like reading a file).


    +   - The amount of time in its time-slice expires.


    +   - The scheduler is invoked and finds more tasks to run.


    Additionally, the 2.6 kernel has compile-time options for a preemptible kernel;
    when configured the kernel can behave like a multiprocessor system, with lower
    latency, and preempt code even when it is a uniprocessor. This means that kernel
    preemption must be fully relied on.


    A taskstruct is the critical data under Linux and contains all information about
    a task known to the kernel, what it is and what it needs. It is called the process
    descriptor. It is defined in /usr/linux/include/sched.h.


    The data structure of task (on the kernel) contains the task ID, m.e. pid and
    current ID (tid). Each multi-threaded task shares the same pid but has a unique
    id (tid). This data structure contains information about signal handling, memory
    used by the process.


    While threads (or more threads) that run in either user or kernel space are identified
    by pointers to a task_struct, not by a pid. For kernels earlier than 2.6.24 one
    can obtain a pointer from a pid with


    ```

    struct task_struct *task=find_task_by_pid(int pid);

    ```


    (In a note that this macro will lock the master thread, which is the process identifier
