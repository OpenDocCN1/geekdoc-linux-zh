    Transition callback functions are called every time the frequency changes, values
    for the event being changed are passed in values CPUREQ_PRECHANGE and CPUREQ_SUSPENDCHANGE.
    They can also be called if the CPU changes its frequency when suspended or resumed.


    When it comes to frequency scaling there is a separation between mechanism and
    policy.


    The mechanism is encapsulated in the CPU frequency scaling device. This has been
    written for each kind of hardware and is responsible for dealing with the details.


    The policy is determined by the CPU frequency scaling governor. This can be:


    +   - Performance: The speed is set to the highest possible.


    +   - Powersave: The frequency is set to the lowest possible.


    ```

