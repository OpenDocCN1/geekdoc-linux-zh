    | State | Meaning |

    |---|--|

    | Mechanical Off G3 | Power consumption is zero for the real-time clock. |

    | Soft Off G2/S5 | Minimal power; user or system code running. Takes a long time
    to go to the Working state, and a restart has to get there done. |

    | Sleeping G1 | Small amount of power, user code not executed, some system code
    running but the device appears off: no display etc. A high memory to to return
    to the Working state, but it can depend on how it was put to sleep. The system
    does not require a reboot to get going. |'
