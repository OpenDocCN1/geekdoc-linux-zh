  md: '# CHAPTER 29. MEMORY TECHNOLOGY DEVICES


    # 29.2 NAND VS. NOR


    MTD devices are neither character or block; in particular they distinguish between
    write and erase operations, which block devices do not.


    +   - Densities are much higher than NOR devices, and the speed is an order of
    magnitude faster.

    - Bad blocks can be a problem; NAND devices may ship with them, but at any rate,
    blocks will fail with time, and these drivers will have to do block management.


    Normal filesystems are generally not appropriate for using flash devices for a
    number of reasons, which we''ll detail later, some special filesystems have been
    designed.


    The Execute in Place, or XIP, method in which the CPU pages memory from the flash
    application directly to its virtual address space, with copying of pages to RAM
    first, can be useful in embedded devices.


    Traditionally these devices have been associated with data storage.


    Since 1999 NAND has grown from about one tenth of the total flash market to most
    of it, Regardless of which method the underlying flash device uses, Linux can
    use the same methods to access it.


    Some references:


    Here is a table from http://www.linux-mtd.infofread.org/doc/nand.html documenting
    the differences between NAND and NOR devices:


    # Table 29.1: MTD links


    The main web site for Linux MTD development.


    # Table 29.2: NOR and NAND device features


    ```

    http://www-mtd.infofread.org/

    http://www.linuxdevices.com/

    articles/AT748621247.html

    ```


    A white paper by Cliff Braike and Jeff Sutherland about using in embedded Linux
    systems.


    # 29.2 NAND vs. NOR


    | Interface | NOR | NAND |

    |---|---|---|

    | Bus | | I/O |

    | Cell Sink | | Small |

    | Cell Cost | | High |

    | Read Time | Fast | Slow |

    | Program Time (single byte) | Fast | Slow |

    | Program Time (multi byte) | Slow | Fast |

    | Erase Time | Slow | Fast |

    | Power consumption | High | |

    | Can execute code | Yes | No, but newer chips can execute a small outer of the
    first page |

    | Bit trending | nearly unrestricted | 1-3 times, also known as "partial page
    program restriction" |

    | Bad blocks at ship time | No | Allowed |


    There are two basic kinds of flash memory: NOR and NAND.


    NOR flash devices are the older variety with these features:


    +   - A linear addressed device, with individual data and address lines; just
    like DRAM.

    - Addressed by directly mapped in the CPU''s address space and access like ROM.

    - Programming and erase cycles are respectable; these are slower than flash.

    - Function like RAM, access is random.

    - The number of cycles is limited, about 100,000 or so.

    - Recent development of MLC (multi-level cell), in which two bits of of memory
    are stored per cell, has boosted density and reduced manufacturing costs per unit
    of memory, although it may come at the cost of reduced performance.

    - Traditionally these devices have been associated with code storage.


    NAND flash devices are non-linear; and have these features:


    +   - Addressing is non-linear; data and commands are multiplexed over 8 I/O lines.
    Thus, device drivers are more complex.

    - Access is sequential.'
