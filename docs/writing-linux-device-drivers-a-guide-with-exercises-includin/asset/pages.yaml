  md: "# CHAPTER 23. DIRECT MEMORY ACCESS (DMA)\n\n# 23.4 DMA Directly to User\n\n\
    High-bandwidth hardware (e.g., a video camera) can obtain lots of speed-up by\
    \ going straight to the user; i.e., using DMA to get the data to kernel-space\
    \ and transferring them to user space. If one wants to do this by hand it is tricky;\
    \ the steps are:\n\n+   * Lock the user pages.\n* Set up a DMA transfer for each\
    \ page.\n* When the DMA is done, unlock the pages.\n\nIf these steps seem complex,\
    \ it is because they are essentially what the get_user_pages() API does for you;\
    \ you will have to do the DMA transfers properly.\n\n# 23.5 DMA under PCI\n\n\
    The API used for DMA is platform-independent, and generates a generic structure\
    \ of device type, which may or not be pci_struct. This structure is extended so\
    \ that you don't have to include it /usr/src/linux/include/linux/pci.h.\n\nIf\
    \ one has a device with alignment limitations, the first thing is to check whether\
    \ DMA transfers the addresses addressed as:\n\n```\n#include <linux/dma-mapping.h>\n\
    \nint dma_alloc(struct device *dev, u64_t size);\n```\n\nFor example, if you have\
    \ a device that can only handle 24-bit addresses, one code:\n\n```\nstruct pci_dev\
    \ *pdev;\nif (is_supported(pdev, 0xffffff)) {\n\tpdev->dma_mask = 0xffffff;\n\
    } else {\n\tprintk(KERN_WARNING \"DMA not supported for the device\\\");\n\tgoto\
    \ device_unmap;\nn}\n```\n\nIf the device supports 32-bit operations, one needs\
    \ to call dma_alloc() or set the mapping, which involves two steps: allocating\
    \ a buffer, and giving an address for it that can be used by the device. The details\
    \ of how depend on the architecture, but the functions for allocating and freeing\
    \ are the same across platforms:\n\n```\nvoid *dma_alloc_coherent(struct device\
    \ *dev, size_t size, void **vaddr, gfp_t flag);\nvoid dma_free_coherent(struct\
    \ device *dev, size_t size, void *vaddr, dma_addr_t dma_handle);\n```\n\n# 23.5.\
    \ DMA under PCI\n\nThe allocation returns a virtual address for the buffer, handle\
    \ size, the third argument addresses the address on the bus (which is meant for\
    \ consistency). The flag argument controls how the memory is allocated, and is\
    \ usually GFP_KERNEL or GFP_ATOMIC if sleeping is not allowed such as in interrupt\
    \ context. If required, DMA DMA can also be freed with dma_free_coherent() which\
    \ requires addresses as an argument.\n\nMemory aligned with dma_alloc_coherent()\
    \ are used for called Coherent DMA Maps, which can be accessed as synchronous\
    \ or coherent. These have the following properties:\n\n+   * The buffer can be\
    \ accessed by both the CPU and the device.\n* A write or read by the PCI can be\
    \ immediately read by either, without worrying cache problems, or flushing, barriers\
    \ (the CPU may still need to use the various memory barriers, for I/O operations\
    \ to maintain consistent memory as it does for normal memory).\n* The minimum\
    \ allocation is a page. In fact x86 always has a number of pages that is a power\
    \ of 2, so it may be expensive.\n\nSince this method is relatively expensive,\
    \ it is generally used for DMA buffers that persist through the life of the device.\
    \ A good example of this would be for DMA ring descriptors.\n\nFor single operations,\
    \ one set-up Streaming DMA mappings, can also be considered asynchronous. They\
    \ are controlled with\n\n```\ndma_addr_t dma_map_single(struct device *dev, void\
    \ *ptr, size_t size, dma_direction_t direction);\nvoid dma_unmap_single(...);\n\
    ```\n\nA pointer to a previously allocated memory region is passed through the\
    \ ptr argument; this must be allocated in DMA-safe fashion, i., consistent and\
    \ in the right direction. The direction argument can have the following values:\n\
    \n| Table 23.1: DMA transfer direction values |\n| Value | Meaning |\n|---|---|\n\
    | PCI_DMA_TODEVICE | Data going to the device, e.g., a write. |\n| PCI_DMA_FROMDEVICE\
    \ | Data coming from the device, e.g., a read. |\n| PCI_DMA_BIDIRECTIONAL | Data\
    \ going other way. |\n| PCI_DMA_NONE | Used for buffering; any attempt to use\
    \ the memory causes a crash. |"
