  md: '# 34.4 I/O Scheduler


    The I/O scheduler aggressively reorders requests for the simultaneous goals of
    improving overall performance and preventing large latencies for individual requests;
    i.e., limiting starvation.


    With each every request the kernel associate a deadline. Read requests get higher
    priority than write requests.


    Five I/O queues are maintained:


    +   - Two sorted lists are maintained, one for reading and one for writing, and
    arranged by starting block.


    +   - Two FIFO lists are maintained, one for reading and one for writing. These
    lists are sorted by submission time.


    +   - A fifth queue handles the requests that are to be sheoved to the driver
    itself. This is called the dispatch queue.


    Exactly how the requests are pecked off the first four and placed on the fifth
    (dispatch queue) is where the art of the algorithm is.


    # Tunables


    read_expire:


    How long (in milliseconds) a read is guaranteed to occur within. (Default = HZ/2
    = 500 )


    write_expire:


    How long (in milliseconds) a write request is guaranteed to occur within. (Default
    = 5 * HZ = 5000 )


    writers_starved:


    How many requests should we give preference to over writes. (Default = 2 )


    fibo_batch:


    How many requests should be moved from the sorted scheduler list to the dispatch
    queue, when the deadline has expired. (Default = 16)


    front_merges:


    Some detailed documentation can be found at: /usr/src/linux/Documentation/block/deadline-iosched.txt.


    # Completely Fair Queue Scheduler


    The cfq (Completely Fair Queue) method has the goal of equal spreading of I/O
    bandwidth among all subprocess requests.


    Theoretically each process has its own queue, which work together with a dispatch
    queue which receives the actual requests on the way to the device. In practice
    the queue of queues is fixed (64) and a hash process based on the PID is used
    to select a queue when one is requested.


    Dequeuing is round robin all queues, each one of which works in FIFO order. Then
    the work is done. To avoid seeking operations, an entire queue is selected, and
    then sorted into the dispatch queue before actual I/O requests are issued to the
    device.


    # Tunables


    quantum


    Maximum queue length in one of service. (Default = 4);


    queued


    Minimum request allocation per queue. (Default = 8)


    fifo_expire_sync


    FIFO timeout for sync requests. (Default = HZ/2)


    fifo_expire_async


    FIFO timeout for async requests. (Default = 5 * HZ)


    fifo_batch_expire


    Rate at which the FIFO''s expire. (Default = HZ/8)


    back_seek_max


    Maximum backwards seeks, in KB. (Default = 16K)


    back_seek_penalty


    Penalty for a backwards seek. (Default = 2)


    # 34.6 Anticipatory I/O Scheduler


    The anticipatory I/O scheduler works off the observation that disk reads are often
    followed by other disk reads of nearby sectors.


    When a request is made, a timer starts and I/O requests are not forwarded to the
    driver until it expires; i.e., the request queue is plunged merged. In the meantime,
    if another request arrives it is sent immediately.


    The algorithm is adaptive that is constantly adjusts its close in accordance with
    the actual I/O request load.'
