    int cdev_add(struct cdev *cdev, dev_t dev, unsigned count)

    cdev_del(struct cdev *cdev);

    ```


    udev handles the generation of device nodes but it does not handle the discovery
    of devices. This requires a Hardware Abstraction Layer (HAL), which is provided
    by freedktop (https://www.freedesktop.org/wiki/Solutions/).


    HAL uses the D-BUS (device bus) interface, provided by HAL. It maintains a dynamic
    database of all connected hardware devices and is coupled to the hosting facility.
    The main daemon will dump out the information that HAL currently has in /usr/share/hal
    and /etc/hal.


    These structures are allocated dynamically, and then initialized with code like:


    ```

    struct cdev *mydev = cdev_alloc(0);

    cdev_init(mydev, &fops);

    ```


    This cdev allocates memory for the structure, it initializes the owner and dev
    fields and points to the current mode.


    The driver will be called when one


    ```

    cdev_add(mydev, dev, count);

    ```


    The clean way to use udev is to have a pure system; the device entry is empty
    until the kernel boot, and is populated with device nodes as they are needed.
    When this way is used, no device nodes are created or removed, which may cause
    artifacts of preliminary device nodes as the udev program is running.


    This function should not be called until the driver is ready to handle anything
    that comes its.

    The inverse function is


    As devices are added and removed from the system with hotplug, udev creates events.
    The information to create and remove device nodes, major and minor numbers, permissions,
    etc., are gathered from information sources (monitored at /sys) and set as configuration
    files.


    ```

    cdev_del(struct cdev *cdev);

    ```


    and after the device is removed from the system and the cdev structure should
    never be accessed after this point.


    The main configuration file is /etc/udev/rules.d. It contains information as to
    where to place devices and ownership. By default rules for device naming are located
    in /etc/udev/rules.d. By reading the main page for udev you can get a lot of information
    about how to set up udev.


    # 4.6 udev and HAL


    The methods of managing device nodes have become clunky until Linux evolved. The
    number of device nodes in /dev and their subdirectories reached in the 15


    Creation and removal of a device node dynamically, from within the driver udev,
    is possible by using the following functions:


    ```

    #include <class.h>

    ```


    ```

    struct class {struct module *owner; const char *name};

    struct device {struct class *class; struct device *parent, dev_t devt};

    dev_create(struct class *cls, dev_t devt)

    dev_destroy(struct class *cls, dev_t devt);

    ```


    Many today developers and system administrators were limited to what was actually
    wanted, especially when device nodes had to be created and destroyed, but this
    was a manual and potentially error-prone approach.


    Generally, it is well to make the class is created at the top level of hierarchy.
    A class fragment seems to be used of one of these functions:


    ```

    static class *class_class;

    ```


    ```

    / create node in the init function //

    class_class = class_create(THIS_MODULE, "my_class");

    dev_create(class_class, NULL, "Xdev", "mydev");

    ```


    ```

    / remove node in the exit function //

    dev_destroy(class_class, "Xdev");

    class_destroy(class_class);

    ```


    Note that device nodes are not normal files and don''t take up space on the filesystem,
    having drivers directly access to device nodes, especially upon for first use.
    Furthermore, exhaustion of availability of major and minor numbers required a
    more modern and dynamic approach to the creation and management of device nodes.


    Ideally, one would like to register devices by name, however, major and minor
    numbers cannot be got rid of altogether, as udev still require them.


    The udev method creates device that will never be needed. The in udev stands for
    user, and it indicates that most of the work of creating, removing, and modifying
    device nodes is in user-space.


    One has to be careful what is necessary to make the device available before the
    device node is created, to avoid race conditions.'
