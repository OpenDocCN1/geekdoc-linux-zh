    Extend the solution to construct a driver that shares every possible interrupt
    with already installed handlers.


    +   - Kernels before 2.6.19 contained a third argument, a data structure of type
    which holds a snapshot of the process''s context before the interrupt. It is used
    for debugging, and for restoring the register state after the interrupt is handled.
    /usr/src/linux/x86/include/asm/ptrace.h

    - The pt_regs argument was removed in 2.6.19, as it was rarely used in drivers,
    and eliminating it saved stack space code, and boosted performance somewhat.

    - If access to this structure should be needed, the inline function struct_ptrq_regs
    *get_irq(int irq) can be used.


    request_irq() can be called either device initialization or when the device is
    first used (open). After the introduction of it it is better to do it in open()
    when the device was first used, now we do not need to lead-load devices. This
    function should be called before the device is installed to enable generation
    of interrupts.


    free_irq() can be called either during cleanup or release (close). This function
    should be called only after the device is instructed not to interrupt the CPU
    anymore.


    Before calling free_irq() one should call synchronize_irq() which ensures that
    all handlers for this particular IRQ are finished before the free request is made.
    One should be careful that this function does not block.


    The interrupt handler returns a value of type irqreturnt. The three possible return
    values are:


