    # 4.5 Serving Major/Minor Numbers


    Adding a driver to the system (i.e., registering it) means assigning a major number
    to it, usually during the driver''s initialization phase. For a character device
    one


    ```

    #include <linux/fs.h>

    register_dev(dev_t first, unsigned int count, const char *name);

    ```


    where first is the device number registered, of a range of contiguous devices;
    usually the major number of first would be 0, but that is not required.


    the name is the name of the device, as will appear when examining /proc/devices.
    It is not the same as the node name in dev (the kernel decides which driver to
    invoke based on the major/minor combination, the name).


    A return value of 0 indicates success, negative values indicate failure and the
    requested region of device numbers will not be available. kmalloc will be used
    to create the appropriate device node(s).


    It is important when the registration to remove the device with device numbers,
    once they are no longer needed. This is most done in the device cleanup function:


    ```

    #include <linux/fs.h>

    unregister_dev(dev_t first, unsigned int count);

    ```


    Note that will not remove the node itself.


    If you fail to unregister a device, you''ll get a segmentation fault the next
    time you call /proc/devices. It is pretty hard (although not impossible) to recover
    from this kind of kernel without a system reboot.


    # Dynamic Allocation of Major Numbers


    Choosing a unique major number may be difficult: dynamic allocation of the device
    numbers is the preferred method for all new drivers and can be used to avoid collisions.
    This is accomplished with the:


    ```

    #include <linux/fs.h>

    alloc_chdev(dev_t *first, unsigned int firstminor, unsigned int count, const char
    *name);

    ```


    where first is passed by address as will be filled by the function. The new argument,
    firstminor is obviously the first requested major number (usually 0). The de-registration
    of the device numbers is done with the same method with this


    The disadvantage of dynamic allocation is the prop node cannot be made until the
    driver is loaded. Furthermore, usually needs to remove the node upon unloading
    the drivers'
