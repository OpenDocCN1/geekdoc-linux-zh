    # kgdb


    kgdb is another interactive kernel debugger. It requires two computers to be connected
    through a null-null serial cable. On the remote host use the user gdb (a GDB wrapper
    to connect to it) and then break into the kernel on the target system, setting
    breakpoints, examining data, etc. Is possible to stop the trace kernel machine
    during the boot process


    kgdb was incorporated in the mainline kernel with kernel version 2.6.26. The oft-requested
    ability to debug through a network connection exists in the development version,
    but is as yet not working fully and is not included in the mainline version.


