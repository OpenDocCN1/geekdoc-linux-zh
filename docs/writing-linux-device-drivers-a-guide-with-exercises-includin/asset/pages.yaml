    \ structure that should be familiar from the select() function in user-space.\n\
    The time returned by this function is measured in seconds since the Epoch midnight\
    \ on January 1,\n1970.\n\n# 11.3 Inserting Delays\n\nJiffies can be used to introduce\
    \ busy waiting; i.e.,\n\n```\n#include <linux/delay.h>\njiffone = jiffies + delay;\n\
    while (time_before(jiffies, jiffone)) {\n    /* do not nothing / */\n}\n```\n\n\
    This is an easy thing to do because jiffies is volatile; it is reread every time\
    \ it is accessed.\nThis loops the CPU during the delay (except interrupts may\
    \ be serviced).\n\nFor short delays, one can use the following functions:\n\n\
    ```\n#include <linux/delay.h>\nvoid nday(unsigned long nanoseconds)\nvoid udelay(unsigned\
    \ long microseconds)\nvoid mleep(unsigned long milliseconds);\n```\n\nOne should\
    \ not expect true nanosecond resolution for nday(); depending on the hardware\
    \ it will\nbe close to microseconds.\n\nAnother method of checking without busy\
    \ waiting is to use the functions:\n\nvoid mleep(int milliseconds) returns after\
    \ the sleep has finished (because of a signal) it returns\nthe number of milliseconds\
    \ left in the requested sleep period.\n\n# 11.4 WHAT ARE DYNAMIC TIMERS?\n\n#\
    \ 11.4 What are Dynamic Timers?\n\nDynamic timers (also known as kernel timers)\
    \ are used to delay a function execution until a\nspecific interval has elapsed.\
    \ The function will run on the CPU on which it is submitted.\n\nBecause a CPU\
    \ cannot be immediately invoked when it is time to execute the function, we\n\
    garanteed only that the function will not run before the timer expires; practically\
    \ this\nshould occur at some clock tick afterwards, unless some high latency task\
    \ has\nsuspending interrupt.\n\nWhile an explicit scheduling function does not\
    \ exist, it is trivial to make a timer function\nrestart itself.\n\nThe function\
    \ will not be in a process context; it will run as softirq in an atomic context.\n\
    no one can do anything which is not at interrupt time; i.e., no transfer of data\
    \ back and\nwith memory allocation with GFP_KERNEL; no use of semaphores, as these\
    \ these\nmethods can go to sleep.\n\n# 11.5 Timer Functions\n\nThe important data\
    \ structures and functions used by kernel timers are\n\n```\n#include <linux/timer.h>\n\
    struct timer_list {\n    struct list_head head;\n    unsigned long expires;\n\
    \    void (*function)(unsigned long expires);\n    unsigned long data;\n    struct\
    \ timer_queue_t *bqueue;\n}\n```\n\n```\nvoid init_timer(struct timer_list *timer)\n\
    void add_timer(struct timer_list *timer)\nvoid mod_timer(struct timer_list *timer,\
    \ unsigned long expires)\nint del_timer(struct timer_list *timer)\nint del_timer_sync(struct\
    \ timer_list *timer);\n```\n\nlist points to the doubly-linked list of kernel\
    \ timers.\n\nexpires in jiffies. it is an absolute value, not a relative one.\n\
    \nThe function to be run is passed as function() and data can be passed to it\
    \ through the pointer\nargument.\n\n```\ninit_timer() zeros the previous and next\
    \ linked points in the linked list.\nadd_timer() inserts the timer into the global\
    \ list.\nmod_timer() can be used to reset the time at which a timer expires.\n\
    del_timer() removes a timer before it expires. It returns 1 if it's already 0\
    \ or if it's too\nlate because the timer function has already starting. It is\
    \ not necessary to call del_timer();\n```"
