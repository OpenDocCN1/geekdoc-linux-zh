    ```


    | Group | Ticks | Time (for HZ=1000) |

    |---|---||

    | tv1 | < 256 | < 256 sec |

    | tv2 | < 512 | < 16.4 sec |

    | tv3 | < 1024 | < 17.5 min |

    | tv4 | < 2048 | 18.6 min |

    | tv5 | < ∞ | ∞ |


    which is done as a more compact form. Note that it is very important to reinitialize
    the timer when reinstalling, mod_timer() does this under the hood.


    Example:


    ```

    static struct timer_list my_timer;

    init_timer(&my_timer);

    my_timer.function = my_function;

    my_timer.expires = jiffies+ticks;

    my_timer.data = &my_data;

    ```


    The timer group has a vector for each tick, and so up those in the first list
    will expire in the next timer group, those in the second group will expire on
    the next after that, and so on. Likewise, the tv-5 groups each have a vector of
    64 doubly-linked lists, ordered in them.


