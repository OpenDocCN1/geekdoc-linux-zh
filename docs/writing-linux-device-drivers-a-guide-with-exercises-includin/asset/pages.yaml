  md: "# CHAPTER 33. ASYNCHRONOUS I/O\n\n# 33. LINUX IMPLEMENTATION\n\nIn order for\
    \ this to work properly, there has to be notification when the I/O request is\
    \ complete and must maintain synchronization points, or completion handlers.\n\
    \n```\nint io_read(struct aioc *cb);\nint io_list(int mode, struct aioc *cblist,\
    \ int n, struct event *sig);\nint io_error(const struct aioc *cb);\ntime_t io_return(const\
    \ struct aioc *cb);\nint io_fyread(int fd, struct aioc *cb);\nint io_suspended(const\
    \ struct aioc *cb, struct cblist, int n);\nint io_canceled(int fd, struct aioc\
    \ *cb);\n```\n\nIn addition, policies may be set to whether queued requests are\
    \ serialized, especially when they refer to the same file descriptor.\n\nYou can\
    \ request asynchronous I/O using the ASYNC flag when opening a file, or the -async\
    \ option to the mount command, but this won't give true asynchronous I/O.\n\n\
    # 33.2 The Posix Asynchronous I/O API\n\nThe POSIX standard defines a data structure,\
    \ the aioc, which serves as AIO control block, and a set of basic functions that\
    \ can be performed on it. These are defined and prototyped in /include/aio.h and\
    \ are provided with:\n\nThe data structure includes\n\n```\nstruct aioc\n{\n \
    \   int aio_fd;        /* File descriptor. */\n    int aio_lio;      /* Operation\
    \ to be performed. */\n    void *aio_buf;     /* Location of buffer. */\n    size_t\
    \ aio_bytes; /* Length of transfer */\n    struct sigevent aio_sig; /* Signal\
    \ and value. */\n    off_t aio_offset; /* File offset */\n};\n```\n\nwhere we\
    \ have outlined is a valid file descriptor for the data (but it must use the name\
    \ of the lseek() call).\n\naio_lio is used by the io_listio() function and stores\
    \ about the type of operation to be performed.\n\naio_reqrio is used to control\
    \ scheduling priorities.\n\naio_buf points to the buffer where the data is to\
    \ be read from or written.\n\naio_event contains if any signal is sent to the\
    \ kernel when the operation occurs.\n\naio_offset gives the offset in the file\
    \ where the I/O should be performed; this is necessary because I/O operations\
    \ are performed in parallel relative to the view of the current process.\n\nThe\
    \ basic functions are actually not part of glibc, but are part of another library,\
    \ librt. These functions are:\n\n```\n#include <aio.h>\n\nvoid aio_init(struct\
    \ aioc *aio);\nint aio_read(struct aioc *cb);\n\n```\n\nA typical code fragment\
    \ might\n\n```\nstruct aioc *cb = malloc(size_of(struct aioc));\nchar *buf = malloc(bytes);\n\
    \nfd = open(\"\", ...);\ncb->aio_fd = fd;\ncb->aio_bytes = bytes;\ncb->aio_offset\
    \ = offset;\ncb->aio_buf = buf;\n\nrc = aio_read(cb);\n\nwhile (aio_error(cb)\
    \ == EINPROGRESS) {\n```\n\nwhere we use the aio_error() function call to wait\
    \ for completion of requests on the control block.\n\n# 33.3 Implementation for\
    \ Linux\n\nThe original AIO implementation for Linux was done by glibc completely\
    \ in user-space. A thread was launched for each file descriptor for there were\
    \ pending AIO.\n\nThis approach is costly, however, if there are large numbers,\
    \ thousands of requests; request support within the kernel can lead to better\
    \ performance. glibc does some important parts of the implementation, and others\
    \ more efficiently in the kernel.\n\nThe 2.6 kernel has full support for AIO:\
    \ in all fact I/O is done through the asynchronous method, with normal I/O being\
    \ the result if flags are not set.\n\nA detailed description of this implementation\
    \ can be found at: http://source.kernel.org/linux/aio\n\nBlock and select device\
    \ drivers already fully take advantage of the asynchronous implementation. Drivers\
    \ (which often require asynchronous) need to be modified specifically to take\
    \ advantage of the new facility. This means new functions in the file_operations\
    \ table:\n\n```\nsize_t (*aio_read)(struct ioc *ioc, struct iovec *io, unsigned\
    \ long long)\nloff_t *pos);\n```"
