    # 13.1 What are ioctls?


    ioctl(input output control) are special functions which are unique to a device
    or class of device. ioctl() is both a call from user-space, as well as a driver
    entry point (i.e., like write()), etc.).


    Various commands can be implemented which either send to or receive information
    from a device. One can control device driver behaviour; i.e., shutdown, reset
    and modify. One can send out-of-band messages while reads and writes are pending.'
