  md: "# CHAPTER 21. HARDWARE I/O\n\n# 21.4. RESOURCE MANAGEMENT\n\n```\n#include\
    \ <linux/ioport.h>\n```\n\n```\nstruct request_region {unsigned long start, unsigned\
    \ long length, const char *name};\nvoid release_region(unsigned long start, unsigned\
    \ long length);\n```\n\nIn this function the argument is the base of the I/O region,\
    \ the argument extent is the number of ports, and the argument name is the name\
    \ that will appear in /proc/ioports having claimed the region.\n\nThese functions\
    \ are usually called when initializing or unbinding a device. request_region()\
    \ will reserve (register) the region, while release_region() will free (unregister)\
    \ it. If any part of the I/O ports has already been reserved, it will fail.\n\n\
    Note: there is no enforcement here; if you try to access a given I/O port without\
    \ checking it, it will stop you.\n\nelement can be used to describe various attributes,\
    \ and the parent, sibling and child fields in the structure tree which contains\
    \ all resources of the same kind.\n\nAll resources for I/O ports are in the tree\
    \ containing the ioport_resource head node. Management of the I/O ports can be\
    \ done through the:\n\n```\n#include <linux/ioport.h>\n```\n\n```\nint request_resource(struct\
    \ resource *root, struct resource *new);\nint release_resource(struct resource\
    \ *root, struct resource *new);\n```\n\ninstead through the _region functions\
    \ described previously, which are just wrappers for the _resource() functions.\n\
    \nExample:\n\n```\n#include <linux/ioport.h>\n```\n\n```\nstatic struct resource\
    \ my_resource = { \"my_dev\", };\n```\n\n```\nstatic int my_dev_detect(unsigned\
    \ long port_addr,\nunsigned long extent)\n{\n```\n\n```\nif (request_region(port_addr,\
    \ extent, \"my_dev\")\n    return -EBUSY; /* the port is busy */\n\n```\n\n```\n\
    unsigned long end = port_addr + extent;\nmy_resource.start = port_addr;\nmy_resource.end\
    \ = end;\n```\n\n```\nif (!request_resource(&ioport_resource, &my_resource))\n\
    \    return -EBUSY; /* the port is busy */\n\n```\n\n```\nif (my_probe(port_addr,\
    \ extent) != 0)\n    release_resource(&my_resource);\nreturn -ENODEV; /* can't\
    \ find the device */\n\n```\n\n```\nreturn 0;\n```\n\n# 21.4 Resource Management\n\
    \nYou may have noticed that the request_region() returns a pointer to a structure\
    \ of\n\n```\nstruct resource {\nconst char *name;\nunsigned long start, end;\n\
    unsigned long flags;\nstruct resource *parent, *sibling, *child;\n};\n```\n\n\
    represents a layer of abstraction: a resource is a portion of some entity that\
    \ can be exclusively\nassigned to a device. In this case the resource is the range\
    \ of I/O ports.\n\nIn this structure, the name element describes the resource's\
