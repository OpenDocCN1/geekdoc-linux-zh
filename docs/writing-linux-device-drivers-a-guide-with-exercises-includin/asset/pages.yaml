  md: '# CHAPTER 17. MEMORY MANAGEMENT AND ALLOCATION


    # 17.2 MEMORY ZONES


    # 17.1 Virtual and Physical Memory


    # 17.2 Memory Zones


    Linux uses a virtual memory system (VM), as all modern operating systems: the
    virtual memory is larger than the physical memory.


    Linux uses a zone allocator algorithm, which is implemented in /usr/src/linux/mm/page.alloc.c.
    In this scheme, which has an object-oriented flavor, each zone has its own methods
    for basic memory operations, such as allocating and freeing pages of memory.


    Each process has its own protected address space. Addresses are virtual and must
    be translated from physical addresses by the kernel when a process needs to access
    memory.


    The kernel also uses virtual addresses; however the translation can be as simple
    as an offset depending on the architecture and type of memory being used.


    In the following diagram (32-bit platforms) the first 3 GB of virtual addresses
    are used for user-space memory and the upper GB is offset for kernel-space memory
    (Other architectures have the same setup, but different values for PAGE_OFFSET,
    for 64-bit platforms the value is in the registers.)


    ![](img/4e539a55ab31f2c9df39e648783d8023_104_0.png)


    | Kernel Addresses | PAGE_OFFSET |

    | --- | --- |

    | 4 GB | (C0000000) |

    | 3 GB | HIGH 896 MB |

    | User Addresses | NORMAL 16 MB |

    | 0 GB | DMA (legacy ISA) 0 MB |


    Figure 17.1: User and kernel address regions


    Figure 17.2: DMA, normal and high memory


    The kernel fairly shares of memory to be allocated to every running process, and
    coordinates when memory is shared among processes. In addition, mapping can be
    used to link a file directly to a process''s virtual address space. Furthermore,
    certain areas of memory can be protected against virtual and/ code execution.


    There are three memory zones:


    +   - DMA-capable zone must be used for DMA transfers. Exactly what this depends
    on the platform, for example, on x86 ISA it means the memory must lie below 16
    MB.

    - High memory requires special handling and has meaning only certain platforms.
    It allows access to to 64 GB of physical memory. On the 32-bit x86, it means memory
    at and above 896 MB.

    - Normal memory is everything else.


    For a comprehensive review of What Programmer Should Know About Memory, see Ulrich
    Drepper''s long article at http://people.reduct.cz/drepper/cpumemory.pdf. This
    covers many issues in depth such as proper use of cache, alignment, NUMA, visualization,
    etc.


    When memory allocates the kernel examines which flags were marked with the request,
    and by basic constructs a list of memory zones that can be used. When the flag
    GFP_DMA is requested, only pages in the DMA zone are allocated. If GFP_HIGH is
    requested, all three zones can be used to get a free page. If neither are flags,
    both the normal and DMA zones are'
