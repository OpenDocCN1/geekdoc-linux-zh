    Same as the get_user() functions, the exception is reversed; Writes exprt data
    to user space at ptr.


    # _copy_from_user()


    Transfers len bytes from user space to kernel space.


    Calls access_ok() internally.


    Also _copy_from_user(to, from, len).


    Returns the number of bytes not transferred. In case error, the driver should
    return -FAULT


    # _copy_to_user()


    Transfers len bytes from kernel space to user space.


    Calls access_ok() internally.


    Also _copy_to_user(to, from, len).


    Returns the number of bytes not transferred. In case error, the driver should
    return -FAULT


    # strnpy_from_user(), strlen_from_user(), clear_user()


    The string functions just as their names suggest, except the copy of the string
    is in user-space.


    The clear_user() function clears the contents of the memory located to.


    # 18.3 Direct transfer - Kernel I/O and Memory Mapping


    There are two complementary methods Linux uses over the heretofore to describe
    transferred functions.


    In the kernel, the generic gives direct access to user-space memory pointers.
    The memory is locked down when the transfer goes on, making no swaps possible
    and the pointers remain valid. When the transfer is over, this is the basis of
    the raw I/O implementation. Note that if a file is opened with the non-standard
    O_DIRECT flag, it will be used for that.


    # 18.4 KERNEL I/O


    In the memory mapping method, user-space is given direct access to kernel buffers,
    which may be memory regions directly on the device. The mmap() call is a standard
    POSIX system call.


    Both methods avoid buffering or caching for the data being transferred. They require
    to set up and shut down copying methods previously discussed. What is the best
    depends on a number of factors, such as the size of transfers, the likelihood
    the data will be reused, etc.


    # 18.4 Kernel I/O


    Sometimes is desirable to bypass the buffer and cache entries, and have I/O operations
    perform directly through the device. This eliminates the use of small-scale one
    copy operation. Large data


    application facility can allow to lock down user-space buffers and then use them
    in the kernel, without using the copy_to_user(), copy_from_user() and functions.


    From user-space, one can force the kernel to use this kind of I/O, by opening
    a file with the O_DIRECT flag. This is an extension, so we will also define the
    macro_GRU_SOURCE, i.e., we need something like


    ```

    #define GRU_SOURCE

    fd = open(filename, O_DIRECT | O_RDWR | O_CREAT | O_TRUNC, 0666);

    ```


    Whenever this file descriptor is used, kernel I/O will be used.


