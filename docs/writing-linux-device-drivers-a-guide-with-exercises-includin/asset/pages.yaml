  md: '# CHAPTER 4. CHARACTER DEVICES


    # 4.2. MAJOR AND MINOR NUMBERS


    # 4.1 Device Nodes


    Character and block devices have filesystem entries associated with them. These
    nodes can be used by user-level programs to communicate with the device, whose
    driver can manage more than one device node.


    Examples of device nodes:


    ```

    lrwxrwxrwx root root 3 May 25 01:56 - > hda

    brw-rw---- root root 2 May 25 01:56 fdb0

    brw-rw---- root root 4 May 21 01:56 640000

    brw-rw---- root root 12 May 16 01:55 6400720

    cr-rw-rw- root root 0 May 19 09:59 parton0

    cr-rw-rw- root root 9 May 25 01:56 parton1

    cr-rw-rw- root root 12 May 25 01:56 parton2

    ```


    Device nodes are made with


    ```

    mkdev [-m mode] /dev/<name> <major> <minor>

    e.g., mkdev -m 666 /dev/sdc 254 1

    ```


    or from the kernel system.


    # Table 4.1: Device node macros


    | Macro | Meaning |

    | --- | --- |

    | MAJOR(dev_t dev); | Extract the major number. |

    | MINOR(dev_t dev); | Extract the minor number. |

    | MKDEV(int major, int minor); | Return a dev_t built from major and minor numbers
    |


    One can also use inline functions:


    ```

    unsigned minor(struct inode *inode); /*= MINOR(inode->dev_t);

    unsigned int major(struct inode *inode); /*= MAJOR(inode->dev_t);

    ```


    when one needs to work with inode structures.


    # 4.2 Major and Minor Numbers


    The major and minor numbers identify the device associated with the same device.
    Generally speaking, all device nodes of the same type (block or character) with
    the same major number use the same driver.


    The minor number is used only by the driver to differentiate between the devices
    it may control. It may indicate different instances of the same kind of device
    (such as the first and second copy, hard disk or partition) or different operations
    of a device (such as read-only device).


    The major and minor numbers are stored in a variable of dev_t, which has 32 bits,
    with 12 bits for the major number, and 20 bits for the minor number.


    The internal bit layout is complicated for historical reasons, and it is not guaranteed
    that it will change in future kernel versions. Thus one should always use the
    following macros to construct (or deconstruct) major and minor numbers from a
    dev_t structure.


    ![](img/4e539a55ab31f2c9df39e648783d8023_30_0.png)


    +   - In the 2.4 kernel, device numbers were packed in the dev_t type, which was
    limited to 16 bits, even between major and minor numbers, so that each was limited
    to the range 0 - 255.

    - In the 2.6 kernel else registered a major number, no other driver could be registered
    with the major number, and all minor numbers belonged to the driver.

    - In the 2.6 kernel, however, one exists a range of minor numbers which can be
    all available, and independently concurrently loaded drivers can have the same
    major number, as long as they have distinct minor number ranges.


    A list of the major and minor number pre-allocated devices can be found in /usr/src/linux/Documentation/devices.txt.
    The major numbers 42, 120-140 and 254 are used for experimental devices, etc.
    Example names assigned for major numbers can be found in /usr/src/include/linux/major.h.
    device number reservations are possibly probable, by other methods using dynamical
    allocation.


    Note that device numbers have methods in user-space as, in some POSIX system calls
    such as inode and other have arguments with the dev_t type, or utilize structures
    that do.'
