    # 18.7. USER-SPACE FUNCTIONS FOR MMAP()


    This can be done on device nodes for direct access to hardware devices; in this
    case the driver must register and implement a proper mmap() entry.


    This method is not useful for stream-connected devices. The mapped area must be
    a multiple of PAGE_SIZE, and start on a page boundary.


    Two basic kinds of memory mapping:


    +   - In a shared memory any operation on the memory region is completely equivalent
    to changing the file it represents. Changes are committed to disk (with the usual
    delays) and any process accessing the file or mapping it will see the changes.


    +   - In a private memory any changes are not committed to disk and not seen by
    any other process. This is more efficient and by design used for a read only situation,
    or when the final saving of data is to be done by writing to another file.


    flags specify the type of the mapped object. It has bits:


    | Value | Meaning |

    |---|---|

    | MAP_FIXED | It can''t be used, fail. |

    | MAP_SHARED | Share the mapping with all other processes. |

    | MAP_PRIVATE | Create a private copy-on-write mapping. |


    Memory mapping can be more efficient than direct access, particularly when files
    are shared by multiple processes, each of whom can access to certain pages, minimizing
    memory usage and accessing times.


    # 18.7 User-Space Functions for mmap()


    From the user side, memory mapping is done with:


    ```

    #include <unistd.h>

    #include <sys/mman.h>


    void *mmap(void *start, size_t length, int prot, int flags, int fd, off_t offset);

    int munmap(void *start, size_t length);

    ```


    Either MAP_SHARED or MAP_PRIVATE must be specified. Remember, a private mapping
    does not

    change the file on disk. Whatever changes are made will be lost when the process
    terminates.

    child


    Other non-POSIX flags can be specified (see mmap()), the MAP_ANONYMOUS flag

    permits a mapping in memory, without a file association.


    Here''s a simple example of using anonymous mapping to share memory between parent
    andnchild:


    This requests mapping into memory of bytes, starting at offset, from the file

    by fd. The offset must be an integer number of pages.


    The address returned is a pointer to map; if it is 0 (the usual case), mmap()
    will

    choose the address and put it in the return value:


    prot defines the protection. It has bits:


    | Value | Meaning |

    |---|---|

    | PROT_EXEC | Pages may be executed. |

    | PROT_READ | Pages may be read. |

    | PROT_WRITE | Pages may be written. |

    | PROT_NONE | Pages may not be accessed. |


