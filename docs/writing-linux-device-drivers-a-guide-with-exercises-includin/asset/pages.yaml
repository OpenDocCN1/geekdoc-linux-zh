  md: "# 8.6 What You Cannot Do at Interrupt Time\n\nInterrupts do not run in process\
    \ context. You cannot refer to access the fields of the task_struct as are all\
    \ ill-defined. Usually you access whatever was running when the interrupt service\
    \ routine executed, which has no connection to the current process.\n\nAnything\
    \ can cause a kernel panic, at least the processor that blocks. In particular\
    \ you cannot use any of the functions, directly or indirectly. Illegal usage would\
    \ be harmful if you try to allocate memory since the GFP flag is not current.\
    \ If you must use GFP_ATOMIC, which returns on this.\n\nYou cannot call schedule()\
    \ for any reason, or any call that calls the scheduler, as all the sleep functions\
    \ block.\n\nYou cannot do sleep() on a semaphore as it can block while waiting\
    \ for a resource. However, you can do up() or any kind of wake_up().\n\nYou cannot\
    \ request a lock with a mutex request_lock().\n\nYou cannot transfer data to or\
    \ from a process's address space; i.e. get_user(), put_user(), copy_from_user()\
    \ functions have the potential to go to sleep. Additionally, because there is\
    \ no real user context, you cannot transfer data to or from user using these functions.\n\
