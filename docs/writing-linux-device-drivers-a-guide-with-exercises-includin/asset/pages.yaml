    \ a5a5a5a5. for caching until uninitialized. |\\| SLAB_RED_ZONE | Surround allocated\
    \ memory with red zones that scream when touched or freed |\\| SLAB_PANIC | Cause\
    \ system panic upon allocation failure. |\\| SLAB_DEBUG_FREE | Perform expensive\
    \ checks on freeing objects |\\| SLAB_CACHE_DMA | Make sure allocation in the\
    \ DMA zone. |\n\nSuppose you need to allocate memory for an object that is less\
