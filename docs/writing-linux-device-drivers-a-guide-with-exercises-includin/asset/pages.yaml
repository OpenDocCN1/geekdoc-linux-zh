  md: "# CHAPTER 35. BLOCK DRIVERS\n\n# 35.5. REQUEST HANDLING\n\n```\nvoid del_gendisk(struct\
    \ gendisk *disk);\nvoid set_disk_rq(struct gendisk *disk);\n```\n\n```\nstatic\
    \ void my_request(struct request_queue *q) {\n    struct request *rq;\n    int\
    \ size;\n    char *pr;\n    printk(KERN_INFO \"entering request queue\\n\");\n\
    \n    while ((rq = elv_next_request(q))) {\n        if (!blk_fs_request(rq)) {\n\
    \            printk(KERN_INFO \"\n            printk(\"this is not a normal request,\
    \ skipping!\\n\");\n            end_request(rq, 0);\n            continue;\n \
    \       }\n\n        pr = my_dev + rq->sector * q->hardblast_size;\n        size\
    \ = rq->current_nr * q->hardblast_size;\n\n        if (pr + size > my_dev + disk_size)\
    \ {\n            printk(KERN_INFO \"tried to go past end of device\\n\");\n  \
    \          end_request(rq, 0);\n            continue;\n        }\n\n        if\
    \ (rq->data_dir == RE_READ) {\n            printk(KERN_INFO \"a read\\n\");\n\
    \            memcpy(pr, rq->buffer, size);\n        } else {\n            printk(KERN_INFO\
    \ \"a write\\n\");\n            memcpy(rq->buffer, pr, size);\n        }\n\n \
    \       end_request(rq, 0);\n    }\n    printk(KERN_INFO \"leaving request\\n\"\
    );\n}\n```\n\nThe first step is to create the gendisk data structure. This is\
    \ done with alloc_disk(), whose argument is the number of minors and thus partitions,\
    \ the disk can accommodate.\n\nOne fills in the various fields, such as the major\
    \ number, the first number (generally 0), and the capacity (which can be done\
    \ with the set_capacity(struct gendisk, int sectors) macro), and point to the\
    \ proper device.\n\nOnce initialized partitions are done to the device, the function\
    \ add_disk(struct gendisk *disk) should be called when the structure is ready\
    \ to be registered with the kernel.\n\nUpon removal of the device, one can call\
    \ del_gendisk(), although the actual removal won't happen until you successfully\
    \ call put_disk().\n\nTo put partitions on the disk in a read-only status, you\
    \ can use set_disk_rq().\n\n# 35.5 Request Handling\n\nUpper levels handle the\
    \ I/O requests associated with the device, and then group them in an efficient\
    \ manner and place them on the request queue for the device, which causes them\
    \ to get to the driver's request queue.\n\nThe kernel maintains a request queue\
    \ for each major number (by default). The data structure of such a queue is defined\
    \ in /usr/include/linux/blkdev.h. The other major data structure is of type request\
    \ and details each request being made by the driver. The request queue must be\
    \ initialized and cleaned up with the following:\n\n```\n#include <blkdev.h>\n\
    \nstruct request_queue *blk_init_queue(const char *name, (*request)(struct request_queue\
    \ *q, spinlock_t *lock));\nvoid blk_cleanup(struct request_queue *q, (*request)(struct\
    \ request_queue *q\n```\n\nand the sector size should be set in this structure\
    \ with\n\n```\nvoid blk_queue_size(struct request_queue *q, unsigned short size);\n\
    ```\n\nA spinlock is passed to the upper layers of the kernel. This will be taken\
    \ when the request is called, with code like:\n\n```\nstatic spinlock_t lock;\n\
    \nspinlock_init(&lock);\n\n...\n\\my_request_queue = blk_init_queue(\"my_request\"\
    , my_request, &lock);\n\n...\n```\n```\n\nThe simplest way to see how request\
    \ handling is is to look at a trivial request function:\n\nPosting of the request\
    \ from the queue is when elv_next_request() returns NULL when there are no more\
    \ requests. The blk_fs_request() checks which request is being delivered. This\
    \ evaluation is for normal filesystem requests, as opposed to diagnostic and other\
    \ kinds of requests.\n\nThe actual copying is done with simple memcpy(). Note,\
    \ the use of rq_data_dir(), checks the first flag of the request structure is\
    \ set for writes, and cleared for reads.\n\nExiting the request function ends\
    \ when the end_request() function is called with a second argument of 0 for failure,\
    \ or 1 for success. (The other argument is a pointer to the request structure)."
