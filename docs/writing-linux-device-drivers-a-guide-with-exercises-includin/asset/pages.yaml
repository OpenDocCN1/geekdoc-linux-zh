  md: '# CHAPTER 8. INTERRUPTS AND EXCEPTIONS


    # 8.1 What are Interrupts and Exceptions?


    An interrupt (interrupts) is the sequence followed by a processor. It is always
    connected with an electrical signal stemming from inside or outside the processor.


    When an interrupt occurs the kernel must suspend the thread it is currently executing,
    dealing with it by invoking one or more service routines (ISR) or handlers to
    handle the specific interrupt, and then returning to the suspended thread, or
    another interrupt.


    Under Linux, interrupts may or may not be delayed according to various mechanisms
    and priorities, but they will be handled eventually. Interrupts are not queued,
    so when one interrupt is serviced, if another interrupt of the same type is being
    serviced, it will be served in turn.


    There are two distinct kinds of interrupts:


    +   * Synchronous interrupts, often called exceptions, are generated by the CPU.

    * Asynchronous interrupts, often called interrupts, are generated by other hardware
    devices, and are generally fetched from the APIC (Advanced Programmable Interrupt
    Controller).


    Exceptions may be caused by run errors during execution such as illegal instructions,
    or by special conditions such as page fault. They force the CPU into kernel mode
    to service a request from user-land. They may occur in one of many contexts. Each
    causes a signal to be sent to one or more processes.


    Interrupts are generally triggered by random events such as a key stroke, mouse
    click, a packet arrival, or more regular events such as a timer interrupt. They
    are not associated with a particular process.


    Interrupts are very similar to signals; many interrupts are hardware devices,
    and signals are software interrupts. The general lessons of efficient and signal
    handling apply well to interrupts.


    Interrupt handling is one of the most difficult tasks undertaken by the kernel.
    It requires careful design to avoid race conditions and non-reentrant code.


    Under Linux interrupts may be shared, and when an interrupt is shared, all handlers
    for that interrupt must agree to it. Each of them will receive the interrupt in
    turn; if, however, there is no communication between the handlers of one another.


    # 8.2 Exceptions


    Exceptions fall into two categories:


    Processor-detected exceptions occur when the CPU sets a status during instruction
    execution. These can be of three types, depending on the value of the ep register
    in the kernel mode stack:


    +   * Faults: the register contains the address of the instruction that caused
    the fault; when the exception service routine completes, execution will be resumed
    from that instruction if


    # 8.2 EXCEPTIONS


    handler is able to fix the anomalous condition that produced the exception, such
    as a page fault.


    +   * Traps: the register contains the address of the instruction to be executed
    after the one that caused the trap. Traps are mainly used for debugging and tracing
    methods and there is no need to repeat the instruction that caused the trap.


    +   * Aborts: the register may not contain a meaningful value. There may be a
    hardware failure or an invalid value in system tables. The abort will terminate
    the process.


    Programmed exceptions are generated by the process through int 80 instructions
    (on x86), as when invoking a system call. They may also be triggered by the instruction
    which checks for overflow, or by the branch instruction, which checks on addresses,
    when the condition is met. Programmed exceptions are just like traps and are sometimes
    software interrupts.


    On 32-bit x86 CPUs there are up to 32 exceptions, numbered from 0 to 31. The exact
    depends on the processor. The signal listed in the table below is usually sent
    to the process which triggered the exception.


    # Table 8.1: 32-bit x86 exceptions


    | Exception/ Service Routine | Type | Signal | Meaning |

    |---|---|---|---||

    | 0 Divide Error div_error() | fault | SIGFPE | Attempted division by zero |

    | 1 Debug debug() | trap | SIGTRAP | Used for debugging and tracing |

    | 2 NMI | fault | None | Reserved for non-maskable interrupts |

    | 3 Breakpoint int3() | trap | SIGTRAP | Breakpoint (caused by int3 instruction)
    |

    | 4 Overflow overflow() | fault | SIGSEGV | An instruction has been executed that
    overflows |

    | 5 Bounds check bounds() | fault | SIGSEGV | Out of bounds memory |

    | 6 Invalid opcode invalid_op() | fault | SIGILL | Bad opcode (part of the CPU
    instruction that caused the exception) |

    | 7 Device not available device_not_available() | fault | SIGBUS | A floating
    point in MM instruction was executed with the flags of set |

    | 8 Double fault double_fault() | abort | SIGSEGV | An exception detected while
    trying to handle a priority for some which can''t be handled in turn |

    | 9 Co-processor segment overflow coprocessor_overrun() | abort | SIGFPE | Problem
    with a math error, like a cop37 fault |'
