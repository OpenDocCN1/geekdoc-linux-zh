    the scheduler decides which task should occupy the CPU, and if it is a different
    one switches the context. It tries to keep tasks on the same CPU (to minimize
    cache). When a new task is chosen to run, the state of the current task is saved
    in its task_struct and the new task is switched in and the current one runs.


    The scheduler before 2.6 kernel used the O(1) scheduler; the time to make a schedule
    was independent of the number of running tasks. It was designed to work well with
    SMPs with many processors. For each CPU, tasks were kept in a priority-ordered
    fashion, so without having to search for all the right task to run, the kernel
    could make a quick bit-map consultation.


    The 2.6.23 replaced the O(1) scheduler with an entirely new algorithm, which uses
    the CFS (Completely Fair Scheduler).


    The fairness is the amount of time the task has been running, by the number of
    running tasks (with varying priorities). This time is compared with the actual
    time the task has received to determine the next task.


    CFS also uses hierarchical modules, each of which can be called in task.


    # 6 Process Context


    When the kernel executes it has full privileges, and is obviously in kernel mode.
    There are different contexts it can be in:


    In process context the kernel is executing on behalf of a process. Most likely,
    a system call has been invoked and entered the kernel, or one of a finite number
    of entry points. Examples include:


    +   - An exception (or handler) has caused a read() or write() request, on a special
    device file, such as a port, or on a normal file on hardware to which the kernel
    has access.


    +   - For a request has been made from user-space. Only the kernel can handle
    such a request.


    +   - A user has made a system call priority() to examine, or its priority, or
    getpid() to find out its process.


    When not in process context, the kernel is working on behalf of any particular
    process. Examples include:


    +   - The kernel is servicing an interrupt. To do so one arrives on an IRQ line,
    usually in being ready. A example clone contains three or four interrupts. It
    is up to the kernel to decide what process may receive the data and it may have
    to wake up the process above.'
