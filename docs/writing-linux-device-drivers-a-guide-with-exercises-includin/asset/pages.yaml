  md: '# CHAPTER I. PRELIMINARIES


    # 1.5. HARDWARE


    Beginning with the 2.6.11 kernel, a new scheme was adopted which a fourth digit
    is used for small patches that concern security and safety matters. Non-controversial
    patches are accepted, and are numbered in 2.6.111.1, 2.6.112.2, 2.6.113.c etc.


    Sometimes when people teach drivers use simple devices hanging off an external
    port. Rather than do this we will use the hardware on the machine as network cards
    and input devices, piggyback our drivers on top of the already installed ones
    using the kernel''s ability to share interfaces.


    The idea has a good measure of stability to the development process and quiet
    complaints about not having a stable kernel for production. Running concerned
    what sort of patches are accepted for this stable kernel can be found at /usr/src/Documentation/stable_kernel.rules.


    Questions come up one of the following:


    +   - How many I/O ports does my device, and what addresses do they use?

    - What IRQ?

    - Do I read bytes or words, how many per interrupt, etc?

    - What standards does the device conform to?


    # 1.4 Platforms


    We will try to be as platform-independent as possible. However, we will use the
    x86 architecture explicitly from time to time and will concentrate on Linux on
    IA64, Alpha, SPARC, PPC, ARM, etc., when we want.


    There are three reasons to consider the x86 architecture explicitly:


    +   - There are parts of the kernel which must be platform-dependent, and to understand
    what is going on some specificity will be.

    - You are probably working on an x86 machine right now.

    - Most people for Linux are concentrating on this platform.


    These questions can be answered only from the hardware''s specifications, and
    by examining the hardware itself. When you are writing a driver you must have
    such knowledge and you to write a device. (You can try it out by writing a device
    which keeps its specifications secret, and a lot of drivers have been removed
    since Linux has become much more mature and time is better spent communicating
    to us if you want your drivers supported, and then by joining this kind of work
    party)


    We''ll try to make any platform-dependence explicit. All solutions have been tested
    on 32-bit and 64-bit architectures.


    Get as much information as you can from the hardware, but be prepared for some
    of it to be out of date, especially when it is not new. It is unusual for the
    hardware and the driver not to be type or for a device to fully follow all specifications.
    Sometimes this is because device manufacturers are not making sure the device
    works adequately under the market-dominant operating system and then not asking
    questions at that.


    ![](img/4e539a55ab31f2c9df39e648783d8023_15_0.png)


    # 1.6 Linux Driver Project


    +   - The 2.6.24 kernel obtained a merge of the 32-bit i386 and 64-bit x86 architectures.
    The new name is simply x86.

    - This involved a major reorganization and rewrite of code completion could have
    taken a while.

    - Many files were reorganized; for instance instead of arch/i386/mm/init.c we
    have arch/x86/mm/init_32.c and arch/x86/mm/init_64.c.


    The Linux Driver Project is a group of kernel developers and some project managers
    who provide open source device drivers for free. The project will work closely
    with manufacturers and when we need sign NDA (Non-Disclosure Agreement) as long
    as the final work is under GPLv2 license.


    The project is led by Greg KroahHartman whose view of code is at http://www.kernel.org/tiki/bin/view
    Newcomers are always welcome. Our main web page is at http://linuxdriverproject.org/tiki/bin/view/


    A goal of the project is to bring many external drivers to the main kernel tree.
    A list of potential candidates is updated monthly as a list of devices for which
    no Linux drivers exist, which can be found at http://linuxdriverproject.org/tiki/bin/view/Main/OutTreeDrivers.
    Also maintained'
