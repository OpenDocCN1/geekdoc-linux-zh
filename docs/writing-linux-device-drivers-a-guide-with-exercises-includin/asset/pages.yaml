  md: "# CHAPTER 4. CHARACTER DEVICES\n\n# 4.5. REGISTERING THE DEVICE\n\nThus some\
    \ scripting is required around the module loading and unloading steps.\n\nWhile\
    \ it would be possible to have a module from an exec() call to name and jump out\
    \ to user space, this is never done; kernel developers feel uneasy that making\
    \ nodes belongs in user-land, not the kernel.\n\nEven better, you can use the\
    \ device facility to create a node from within your module. We will show you how\
    \ to do this.\n\n# Accessing the Device Nodes\n\n# 4.4 Accessing the Device Nodes\n\
    \n| Library Routines |\n| --- |\n| open(const char *pathname, int flags, mode_t\
    \ mode) |\n| read(int fd, void *buf, size_t count, off_t offset) |\n| write(int\
    \ fd, void *buf, size_t count, off_t offset) |\n\nUnder unlike operating systems,\
    \ like Linux, applications access peripheral devices using the same functions\
    \ as they do for files. This is an essential part of the philosophy; listening\
    \ to a sound would involve reading from the device associated with the sound card\
    \ (generally /dev/audio).\n\n| System Calls |\n| --- |\n| open(const char *pathname,\
    \ int flags, mode_t mode) |\n| read(int fd, void *buf, size_t count, off_t offset)\
    \ |\n| write(int fd, void *buf, size_t count, off_t offset) |\n\nThere is a limited\
    \ number of entry points into device drivers, and in most cases there is one for\
    \ each of the system calls that accesses the device and the entry point in the\
    \ driver which the call is made.\n\n| Entry Points |\n| --- |\n| open(struct inode\
    \ *inode, struct file *file) |\n| release(struct inode *inode, struct file *file)\
    \ |\n| read(struct file *file, char *buf, size_t count, off_t offset) |\n| write(struct\
    \ file *file, char *buf, size_t count, off_t offset) |\n\nFor a device driver,\
    \ such as character or block, the entry points are the same irrespective of the\
    \ actual device. The kernel mapping is relatively direct; in the case of block\
    \ drivers there is more indirection; layers of the kernel may interfere between\
    \ the system call and the entry point, a read would involve the virtual filesystem,\
    \ the actual device, and cache mapping to get blocks of data from or off a device\
    \ is made by the driver as requested.\n\n![](img/4e539a55ab31f2c9df39e648783d8023_32_0.png)\n\
    \nThe following are the operations that can be performed on character device nodes\
    \ by programs in user-space:\n\n```\nint open(const char *pathname, int flags);\n\
    close(int fd);\nread(int fd, void *buf, size_t count);\nwrite(int fd, void *buf,\
    \ size_t count);\nseek(int fd, off_t offset, int whence);\nvoid *ioctl(int fd,\
    \ unsigned cmd, ...);\nlong select(int nfds, ... , ...);\nint poll(struct pollfd\
    \ *fds, int nfds, int timeout_ms);\n```\n\n# 4.5 Registering the Device\n\nThese\
    \ entry point all have man associated with them.\n\nThe device driver has entry\
    \ points corresponding to these functions; names and arguments may differ. In\
    \ the above list, for example, the system call() will lead to the entry point\
    \ release().\n\nSo far we have done a reserve of device numbers for the exclusive\
    \ use of our driver. More characters are associated with a cdev structure, as\
    \ shown in /usr/src/linux/include/cdev.h:\n\nRemember that you can export these\
    \ system calls locally, by using the standard I/O library functions, open(), close(),\
    \ read(), and fwrite().\n\n```\nstruct cdev {\n\tstruct object obj;\n\tstruct\
    \ module *owner;\n\tstruct file_operations *ops;\n\tstruct list_head list;\n\t\
    dev dev;\n\\unsigned int count;\n};\n```\n\nNormally you won't work directly with\
    \ the internals of this structure, but reach through various utility functions.\
    \ In particular we will show how the owner and pointers are used.\n\nA number\
    \ of related functions are needed to work with character devices:"
