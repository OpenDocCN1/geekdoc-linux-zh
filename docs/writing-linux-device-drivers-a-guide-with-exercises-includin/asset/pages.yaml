  md: "# 27.1 Multicasting\n\nA multicast packet is sent to more than one (but not\
    \ all) network destinations. For purpose a unique address is assigned to a group\
    \ of hosts; any packet sent to that address will be received by all members of\
    \ the group.\n\nFor this the least significant bit in the first byte of the destination\
    \ address is set; at the same time the first byte of the device address is cleared.\n\
    \nMulticast packets do not belong to any other address, and thus a device need\
    \ not to transmit them. It is up to the kernel or runtime to determine the right\
    \ hardware address\n\nHowever, reception of multicast packets can be more complex\
    \ and require less work from a network device, depending on its implementation.\n\
    \nSome devices have no multicast capability. They receive packets that are either\
    \ sent to their hardware address or broadcast to all. They receive multicast traffic\
    \ only by receiving all packets; this can overwhelm the system. A device will\
    \ not have the MULTICAST flag set in its net_device structure.\n\nA second class\
    \ of devices detects multicast packets from others; they receive only the ones\
    \ whether or are not intended for them and should be thrown. In this has a lower\
    \ overhead than the first class.\n\nA third class of devices performs multicast\
    \ detection in their hardware. This kind of device accepts a list of multicast\
    \ addresses to be interested in and ignores others. This is the most efficient\
    \ class of devices as it avoids accepting packets and dropping them. Whenever\
    \ the list of valid multicast addresses is modified, the kernel updates the list\
    \ of the device.\n\nThe method called whenever the list of multicast addresses\
    \ of the device is associated with\n\n```\nvoid (*dev_multicast_list(struct net_device\
    \ *dev));\n```\n\n(where the dev is the device's net_device structure). The function\
    \ is invoked whenever dev->flags changes. If the driver cannot it should return\
    \ NULL.\n\nThe data structure keeping the linked list of multicast addresses the\
    \ device deals with:\n\n```\nstruct dev_mc_list {\n\tstruct *next;          /*\
    \ no address in list / */\n\tunsigned char *ub;\n\tint addr[IF_ADDR_LEN]; /* hardware\
    \ address */\n\tint length;             /* address length */\n\tint *users;  \
    \          /* # of users / */\n\tint int;\n\tint *groups;           /* # of groups\
    \ / */\n};\n\nstruct dev_mc_list *dev->mc_list;\n```\n\nThere are also number\
    \ flags (in dev->flags) which affect behaviour:\n\n# 27.2. CHANGES IN LINK STATE\n\
    \n| Flag | Meaning |\n|---|---|\n| IFF_MULTICAST | If not set, the device won't\
    \ handle multicast packets. However, the set_multicast_list()1 method will still\
    \ be called whenever the flags change. |\n| IFF_ALLMULT | Tells the driver to\
    \ retrieve all multicast. |\n| IFF_PROMISC | Put it in promiscuous mode. All packets\
    \ received regardless of whether it is in dev_rx_list. |\n\n> Corbet, Rubini and\
    \ Kort-Hartman gave an example of an implementation of the set_multicast_list()1\
    \ method.\n\n# 27.2 Changes In Link State\n\nNetwork connections can go up and\
    \ down due to external events, such as plugging a cable in out. Almost all network\
    \ devices have a capacity of sensing a plug; when present the hardware is available.\n\
    \nLinux provides functions to notify the other networks when the state goes up\
    \ or down to link it with:\n\n```\nvoid (*net_change_up(struct net_device *dev));\n\
    void (*net_change_off(struct net_device *dev));\nint net_carrier(struct net_device\
    \ *dev));\n```\n\nThe on and off functions should be called whenever the driver\
    \ detects a change of state. They may be called by a major configuration change,\
    \ or reset.\n\nThe final function checks the net_device structure to sense the\
    \ state.\n\n# 27.3 ioctl\n\nWhen an ioctl() command is sent to a socket descriptor,\
    \ the kernel is first compared to in /usr/src/linux/include/sock.h\n\nIf a command\
    \ is a socket configuration, as STOCSIFFADDR it is directly upon by high levels\
    \ of the networking code.\n\nThe command may be one of the protocol-specific functions\
    \ defined in the header file. In other case, the third argument to ioctl() is\
    \ a pointer to a type struct ifreq, defined in /usr/src/linux/include/ifreq.h."
