  md: '# CHAPTER 3. MODULES I: BASICS


    # 3.4 PASSING PARAMETERS


    +   * All Linux distributions prescribe methods for the automatic loading of particular
    modules on startup. However, the use of udev in Linux distributions usually obviates
    this.

    * Red Hat-based systems use the /etc/rc.modules file to run (if it exists) out
    of /etc/rc.sysinit. In this file any module can be loaded through the full use
    of the module command.

    * On Debian-based systems modules listed in /etc/modules will be loaded. (Only
    the names of the modules are given in this file, not commands.) In GENTO systems,
    the name role is played by the files in /etc/modules.autoload.d.

    * On SUSE-based systems the file that needs to be modified is /etc/sysconfig/kernel.


    ```

    depmod -a

    ```


    In order for depmod and modprobe to find modules they must be in prescribed places,
    under /lib/modules. The file /etc/modprobe.conf is consulted every time a module
    is loaded or when depmod is run.


    When modules are built in external directories and installed with the modules_install
    target, they are placed in the extra directory.


    # modprobe


    modprobe can load (or unload with the -r option) a stack of modules that depend
    on each other, and can be used instead of insmod.


    It can also try to list a of modules, and quit when one is first and successfully
    loaded depending on/etc/modprobe.conf.


    Whenever there are new modules added, or there is a change in location depmod
    should be run.


    The modules package uses the .ko extension with insmod, but modprobe and rmod
    require no extension.


    Parameters can be passed to modprobe in the same way they are passed to insmod;
    i.e., you can do something like


    ```

    modprobe my_net_driver irq-10

    ```


    # ismod


    ismod gives lists all loaded modules. The information given includes name, size,
    count, and a list of referring modules. The content is the same as in /proc/modules..


    # insmod


    insmod loads a module into the running kernel, resolving all symbols. The -f option
    will try to force loading with a version mismatch between kernel and module.

    mod can be used to load parameters into modules. For example,


    ```

    insmod my_net_driver.ko irq-10

    ```


    No .ko extension is specified.


    # rmmod


    rmmod unloads modules from the running kernel. A list of modules may be given
    as in:


    ```

    rmmod my_net_driver.char_driver

    ```


    # depmod


    depmod creates a Makefile-like dependency file ( /lib/modules/KERNEL-VERSION-NUMBER
    ) based on the symbols in the modules explicitly mentioned on the comment line,
    or in the default path.

    dmod allows the use of modprobe. It is always running during boot. Under circumstances
    it should be


    # 3.4 Passing Parameters


    Parameters to be passed to modules must be explicitly marked as such and type
    checking is done. For example,


    ```

    int irq = 12;

    module_param(irq, int, 0);

    ```


    There are a number of macros which can be used:


    ```

    #include <linux/modprobe.h>

    ```


    ```

    module_param(name, type, perm)

    module_param_array(name, type, value, perm)array(name, type, num, perm)

    module_param_string(name, string, len, perm)

    ```


    In the basic, module_param() macro, name is the variable name, type can be byte,
    short, unsigned, int, unsigned int, long, long, bool.


    The perm parameter is a permissions mask which is used for an accompanying entry
    in the sysfs. If you are not interested in access, a value of 0 will typically
    use the'
