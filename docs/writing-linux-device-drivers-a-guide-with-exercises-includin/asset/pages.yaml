    # 20.2 DEFERRABLE FUNCTIONS AND SOFTIRS 227


    In the top half, the driver does what must be done as quickly as possible. This
    may just mean acknowledging the interrupt getting some data off a device and into
    a buffer.


    In the bottom half, the driver does whatever has been deferred. An interrupt handler
    is not required to have a bottom half.


    +   * Work queues run in process context, and deep sleeping is permitted. Each
    work has its own queue on each CPU, sleeping if no other tasks are. A bottom half
    implemented in this fashion runs on a different CPU than the one it scheduled.


    Depending on the kind of bottom half, they are launched in slightly different
    ways, but the system checks whether anything needs to be done after an exception
    is handled and then runs queued bottom halves. This includes:


    +   * After a system call is completed.


    +   * After any other exception is handled.


    +   * When the scheduler selects the kernel softirq to run.


    # Top Half


    Technically speaking the top half is the interrupt. A typical top half:


    +   * Checks to make sure the interrupt was generated by the right hardware; this
    is necessary for interrupt sharing.


    +   * Clears an interrupt bit on the interface board.


    +   * Does what needs to be done immediately (read from device-specific or write
    to/from the device). The data is written to a device-specific buffer, which has
    been previously allocated.


    +   * Schedules handling the new information (in the bottom half).


    Another way of implementing a bottom half is maintaining a kernel thread. One
    starts off the kernel thread upon initialization or then it sleeps until it has
    work to do. Scheduling a bottom half means waking up the thread to deal with the
    work, after which it goes back to sleep. Calling a thread when a driver is unloaded
    has nothing to do


    It is not required to have a bottom half, if there is processing to do, it may
    be more efficient to do it in the top half, rather than the overhead of scheduling
    and launching a bottom half, and having to be careful about synchronization issues.


    # Example (tasks):


    ```

    static struct my_data { ... } my_data;

    ```


    ```

    static void t_func(unsigned long *arg) { ... }

    ```


    ```

    DECLARE_TASK(task, name, func, (unsigned long) my_data);

    ```


    ```

    static void interrupt(int irq, void *dev_id) {

    ```


    ```

    top_half_func();

    ```


    ```

    task_schedule(&task);

    ```


    ```

    return IRQ_HANDLED;

    ```


    # Bottom Half


    A bottom half is used to process data while top half is available for dealing
    with interrupts. Interrupts are deferred if necessary, but this should be avoided
    as it goes against the purpose of having a bottom half.


    The various kinds of bottom halves behave:


    +   * Tasks can be run in parallel on different CPUs, although the same task can
    only run one at a time. They are never run in process context. Tasks will run
    only on the CPU that scheduled them. This leads to cache coherence, and serialization,
    as the task can never be run before the bottom half, which leads to avoidance
    of race conditions.


    # 20.2 Deferrable Functions and Softirqs


    Deferable functions perform non-critical tasks at later (deferred) time, usually
    as soon as possible. When the functions are run


    There are two types of softirqs (of which tasks are kernel one) which run in interrupt
    context and are not allowed to sleep, and workqueues, which run under a pseudo-process
    context and are allowed to sleep.


    There are a different kinds of softir defined. In order of decreasing priority
    they are:


    | Name | Priority | Purpose |

    |---|---||

    | HI_SOFTIRQ | | High-priority tasks. |

    | TIMER_SOFTIRQ | 1 | Scheduled timers. |

    | NET_SOFTIRQ | 2 | Network packet transmission. |

    | NET_SOFTIRQ | 3 | Network packet reception. |

    | BLOCK_SOFTIRQ | 4 | Block device related work. |'
