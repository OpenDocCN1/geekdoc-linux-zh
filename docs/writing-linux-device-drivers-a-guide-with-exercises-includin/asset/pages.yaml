    \ Meaning |\n| id_table | Points to a table of device ID's of interest. Usually\
    \ this will be expected with the macro MODULE_DEVICE_TABLE(pci,...), and should\
    \ be set to NULL if you call the pci() function to show all PCI devices in the\
    \ system known. |\n| probe | Points to a probing function that looks for your\
    \ device. |\n| remove | Points to a function that can be called when the device\
    \ is removed, either by de-registration or by yanking out of a hot-pluggable slot.\
    \ |\n| suspend | Used by power management when a device goes to sleep. |\n| resume\
    \ | Used by power management when a device wakes up. |\n\nThe driver may need\
    \ to de/write to three addresses: memory, port, and configuration, and we will\
    \ discuss each.\n\n# 22.2 PCI Drivers\n\nOne registers and uses a PCI device with:\n\
    \n```\n#include <linux/pci.h>\n\nint pci_register_driver(struct pci_dev *dev);\n\
    void pci_unregister_driver(struct pci_dev *dev);\n```\n\nThe registration/deregulation\
    \ functions are normally called in your initialization and cleanup functions.\n\
    \nThe function pci_register_driver() returns the number of PCI devices bound by\
    \ the driver, even if it returns 0, the device will not be registered. If PCI\
    \ is not configured, this function returns 0.\n\nThe registration uses a data\
    \ structure of type pci:\n\n```\nstruct pci_driver {\n\tuint32_t id;\n\tconst\
    \ struct pci_device_id *id_table;\n\tchar *name;\n\tconst struct pci_driver_ops\
    \ *driver; /* must be non-NULL for probe to be\n\tscalled */\n\tint (*probe)(struct\
    \ pci_dev *dev, void *id); /* New device inserted if\n\tint (*remove)(struct pci_dev\
    \ *dev); /* Device removed (NULL if not\n\ta hot-pluggable slot) */\n\tint (*suspend)(struct\
    \ pci_dev *dev, struct message_state *state); /* suspended */\n\tint (*resume)(struct\
    \ pci_dev *dev); /* Device woken up if */\n\tvoid (*shutdown)(struct pci_dev *dev);\n\
    \tvoid (*error_handlers)(char *err_handler);\n\tstruct device *driver;\n\tsize_t\
    \ pci_device_idscount;\n};\n```\n\nImportant elements of the data structure are:\n\
    \nWe won't give a description of the functions presented in the jump table. Functions\
    \ that are unnecessary for a particular device can be set to NULL.\n\nThe ID table\
    \ is an array of structures of pci_device_id which must end with a NULL entry:\n\
    \n```\n2.63:11 struct pci_device_id {\n\tuu16_t vendor;            /* Vendor and\
    \ device ID */\n\tuu16_t device;            /* Subsystem ID and PCI_ID * */\n\t\
    uu16_t class, subclass;  /* (class, subclass) if_triplet * */\n\tuu32_t driver_data;\
    \      /* Private to the driver * */\n};\n```\n\nThis table is filled out with\
    \ the pci_driver() macro, as in:\n\n```\nstatic struct pci_device_id, tgb_pci_table[]\
    \ = {\n\tPCI_DEVICE(PCI_VENDOR_BRADCOM, PCI_DEVICE_TIGON3_5700),\n\tPCI_DEVICE(PCI_VENDOR_BRADCOM,\
    \ PCI_DEVICE_TIGON5_5701),\n\tPCI_DEVICE(PCI_VENDOR_ALTIMA, PCI_DEVICE_ALTIMA_AC9100),\n\
    \tPCI_DEVICE(PCI_VENDOR_APPLE, PCI_DEVICE_APPLE_TIGON3),\n\t{0 }\n};\n```\n\n\
    It is important to enable your device after before you do anything with it, by\
    \ calling the pci_enable(dev). This switches on the I/O and memory regions, allocates\
    \ resources that might be needed, and wakes the device if it is in suspended state.\
    \ This function would be called by the probe callback."
