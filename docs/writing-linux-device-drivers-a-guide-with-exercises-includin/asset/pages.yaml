    Tasklets may run in parallel on multiple CPUs; however, the tasklet cannot be
    at the same time on more than one CPU.

    A tasklet is always run on the CPU that scheduled it; doing things this optimizes
    cache usage. (This can cause delays that may not be worth the cache savings; work
    queues can be used instead.) As a result, many kinds of race conditions are naturally
    avoided; the thread that queued the tasklet completes before the tasklet actually
    runs.

    The tasklet code is defined in /usr/src/linux/include/interrupt.h. The important
    data structure is:


    ```

    struct tasklet_struct {

    struct tasklet_struct *next;

    unsigned long state;

    atomic_t count;

    void (*func)(unsigned long data);

    unsigned long data;

    };

    ```


    The various kinds of deferred functions differ mostly in whether they operate
    in process context and their behaviour on multi-processor systems.


    | Type | Process context | SMP Behaviour | SMP Serialization |

    | softirq | No | Can run on different CPUs simultaneously | Run on the CPU that
    scheduled them and must be fully re-entrant. |

    | tasklet | No | Can be run simultaneously on different CPUs, but if they use
    the same tasklet, | Run on the CPU that scheduled them and thus are serialized.
    |

    | workqueue | Yes | Can be run on any CPU. | Can be deleted and serialized. |


    The face entry is a pointer to the function that will be run, which can have data
    passed to it through data. The data is used to determine whether or not the tasklet
