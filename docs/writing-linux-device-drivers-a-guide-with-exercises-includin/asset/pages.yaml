    \ Or may be working with a single device, and have large or small amounts of data.\n\
    \nKernel fills relay channel buffers with no special contention on the data form.\
    \ Users get access to the data with system calls or mmap(), executed on data files\
    \ (for each channel) that are treated like normal pipes.\n\nFor each relay channel,\
    \ there is one buffer per CPU. In each buffer, there has one or more sub-buffers.\n\
    \nWhen a sub-buffer is full to fill a chunk of data, or the next buffer (if available)\
    \ is used, messages are merged between sub-buffers (a message should not be larger\
    \ than a sub-buffer). If space can be be allocated, the sub-buffer is full.\n\n\
    The buffer can be set in either overwrite or non-overwrite mode (the default);\
    \ in the kernel mode, kernel clients will block until readers empty the buffer.\n\
