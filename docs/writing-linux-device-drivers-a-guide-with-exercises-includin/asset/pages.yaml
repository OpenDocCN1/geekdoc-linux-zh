    # 8.3 Interrupts


    There are two asynchronous interrupts:


    +   - Maskable interrupts are sent to the NMI microprocessor pin. They can be
    disabled by using appropriate flags in the flags register.


    +   - Nonmaskable interrupts are sent to the NMI. They cannot be disabled and
    they occur when there is a critical hardware failure.


    Any device which has an IRQ (Interrupt Request) line, which is connected to an
    APIC (Advanced Programmable Interrupt Circuit).


    On the x86 architecture has a Local APIC integrated into each CPU. Additionally
    one has one I/O API used by the peripheral buses.


    You will also notice two types of interrupts:


    +   - Level-triggered interrupts are sent to an electrical signal (voltage) while
    having a certain value.'
