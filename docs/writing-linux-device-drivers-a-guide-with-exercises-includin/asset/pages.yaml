    2.63:129 };

    ```


    +   - Userspace: The frequency can be set manually or dynamically by a user-space
    program.


    +   - Onemand: The frequency is dynamically adjusted based on policy of the CPU
    load. The governor is capable of fast frequency switching.


    +   - Conservative: Similar to demand, the frequency is gradually increased or
    decreased rather than doing at once. This mode is more suitable for laptops.


    Changes in frequency are broadcast through the use of notifier chains, and any
    kernel component can register back functions that are invoked when they occur.


    The third argument for the callback function is a pointer to a data structure
    of type:


    Policy notifier chains are called when a policy is set. First they are called
    with event CPUREQ_ADJUST, which can limit the frequency if we need it, for instance
    to avoid thermal problems while idle.


    The frequency scaling in Linux is a unified framework for all architectures, and
    is quite modular concerning implementing new policies.


    The second event is when the value CPUREQ_COMPATIBLE is set. Changes should only
    be made before applying the policy.


    The third event is when CPUREQ_NOTIFIER is set. All notifiers are informed of
    the new policy and if two drivers fail to agree before this stage, asynchronous
    hardware is shut.


