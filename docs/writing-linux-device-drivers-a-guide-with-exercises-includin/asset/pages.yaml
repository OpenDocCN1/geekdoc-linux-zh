  md: '# 5.2 Kernel Browsers


    One has to browse the kernel source to understand the workings of the kernel,
    compare kernel versions etc. The best tools for doing so are simple tools like
    grep and find.


    One modern tool is the Linux Source Browser (lx) which can be accessed at http://lx.org/.
    This website contains source code repositories for every linux kernel produced,
    as well as source code and instructions for a installation of lx.


    The master repository version is 0.9.4 of the kernel, which is very robust but
    relatively simple and more difficult to understand. A simpler sample of the version
    0.3.1 can be found at http://users.kernel.org/qjun/linux/source


    Local use by running a web server (typically apache) can save several hundred
    MB of disk space per kernel instead.


    A purely indexed browser is provided by cstree, which is the standard on many
    Linux systems. To browse the kernel source one may run make in the kernel source
    directory, created by `make html`, or run cstree in the kernel source tree. From
    there the use is interactive and intuitive.


    Another approach is by using GNU Global, which can be found at http://www.kernel.org/software/.
    Many distributions also offer a package, which is very easy to install and use:
    ga index; the cross-indexing is done and then you navigate the results using your
    favorite browser, simply by pointing to /usr/src/linux-index.html One disadvantage
    of it is over 2 GB of disk space per kernel.


    All these methods work, and there are others such as using make tags and searching
    the web that can be used by users and experts. If it''s worth it, however, to
    find a preference for lx (or older versions) by the easy comparison of different
    kernel versions.


    # 5.3 Kernel Configuration


    Kernels provided by distributions differ unduly from those sources directly obtained
    from the "official" kernel repository at http://www.kernel.org. Sometimes some
    changes have been made to the kernel source, including the addition of new features
    and devices that have not it in the "official" kernel tree, as well as bug fixes
    and enhancements.


    The default configuration for distributions has only a few kinds of hardware turned
    on (such as one network card) as well as various subsystems turned off, the actual
    default choices reflecting the actual linux hardware Turnholds (which has one
    or two points), such as sound card, keyboard and mouse.


    When you configure the kernel you produce a configuration file, .config, in the
    main kernel source directory. If located the .config file can be read inside the
    kernel directory. If CONFIG_CONFIG is set, information can be read-out directly
    from /proc/config.


    # 5.4 ROLLING YOUR OWN KERN


    Running the scripts/extract-kconfig on a kernel image (compressed or uncompressed)
    built with KCONFIG support will return a dump of the configuration file. (Beware,
    this utility needs to be run in the kernel source directory, or requires some
    modifications to).


    If you don''t have the kernel source, you can find . .config in the directory
    /boot/config/$(uname -r) as an additional config for your kernel.


    In these configurations, for almost all hardware are compiled as kernels. This
    is the correct way to do because nobody can know in advance which hardware the
    end user needs, so all possibilities must be prepared.


    # 5.4 Rolling Your Own


    For experiment of purpose you may want to try using another kernel, in particular
    you may want to compile and install a vanilla kernel from http://www.kernel.org.
    In order to do this you need:


    +   * A configuration file (e.g., config-2.6.31.x_x86.tar.bz)


    The first of these files can be obtained from http://www.kernel.org/cod/ and the
    second can be obtained from


    The following script (KERNEL.sh), included in your sources, will take care of
    all these steps of unpacking, configuring, and installing. To do everything you
    just need


    > $ KERNEL.sh 2.6.31.x.tar.bz config-2.6.31.x_x86


    If the kernel has already been unpacked and configured, just go to the kernel
    source directory and running the script with no arguments it will take care of
    compilation and installation.


    ```

    #!/bin/bash

    ```


    ```

    # Script to compile and install the Linux kernel and modules.

    # written by James Christopher (2002-2009)

    make config

    make modules install

    ```


    ```

