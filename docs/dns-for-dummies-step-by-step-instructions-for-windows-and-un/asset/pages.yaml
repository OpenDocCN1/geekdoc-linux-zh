- pgno: 296
  md: '# # Appendix A


    # # Using the DNSCMD Utility


    In This Chapter


    +   - Installing DNSCMD

    - Using DNSCMD for various tasks


    In several chapters in this book, we describe the configuration of a Microsoft
    Windows Server running the DNS Server service. Also, we spend considerable time
    on the topic of the DNS Microsoft Management Console (MMC) snap-in. In addition
    to the graphical method of administering a DNS server, as shown everywhere in
    this book, Microsoft has made available a command-line tool named DNSCMD that
    can also be used to configure the Microsoft DNS service.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_296_0.png)


    You don''t need to install the DNSCMD utility on the DNS server. You can use DNSCMD
    from a remote system, such as a Windows 2000 or Windows XP workstation or another
    Windows 2000, Windows .NET Server, or Windows NT 4.0 system. This tool is particularly
    handy if you''re in charge of numerous servers because you can use it just about
    anywhere and effectively accomplish DNS management tasks.


    The DNSCMD utility is useful to skilled administrators because they can use it
    to troubleshoot and configure Windows-based servers. Where DNSCMD truly shines,
    though, is in the area of scripts. If you''re skilled at using a scripting language,
    as Perl, you can write scripts to automate many of the administration functions
    of a DNS server. You can use a scripting language to build a Web-based front end
    using DNSCMD at the back end to make administration easier or allow users to administer
    their own zones. With a utility like DNSCMD, the possibilities are virtually endless.


    # # Installing the DNSCMD Utility


    You have decided that DNSCMD is a tool worth using, you first need to install
    it. DNSCMD is on the Windows 2000 or Windows .NET Server CD in the \tools\support.cab
    folder. The support.cab file is shown in Figure A-1. On a Windows 2000, Windows
    XP, or Windows .NET system, you can simply double-click the CAB file, and it opens
    automatically.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# 278 DNS For Dummies


    Figure A-1:

    The support.cab compressed file contains a number of tools.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_297_0.png)


    After you have opened the support.cab file, locate the dnscmd.exe file, as shown
    in Figure A-2. Double-click the dnscmd.exe file, and you''re prompted for a location
    in which to save the file. The best location for the DNSCMD is in a folder that
    is your default path, such as C:\WINNT, although you can place it anywhere you
    want. Select the directory from the list and click OK. The file is copied to that
    folder.


    Figure A-2:

    The DNSCMD executable file is in the support.cab cabinet.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_297_1.png)


    Now that the DNSCMD utility is installed, you can begin to use it. Although it''s
    a simple utility to use, it has a wide array of available options.'
  merge: -1
  img_proc: true
