    Getting into the details: Adding a subdomain

    We describe subdomains in detail in Chapter 10, but because the topic is closely
    related to the topic of DNS configurations, we introduce the subject here. Subdomains
    exist within the bounds of existing domains. For example, in the domain name www.example_sample.tld,
    example is a subdomain of the sample.tld domain. To create a subdomain, select
    the parent zone in the left pane and choose New Domain from the DNS menu. Enter
    the subdomain in the New Domain dialog box and click OK. The subdomain appears
    under the parent domain, and records can be added in the preceding section.


    Configuring the DNS server properties

    The Windows NT 4.0 DNS server service has fewer available configuration options
    than the subsequent replacement operating system, Windows 2000. To access the
    Windows NT 4.0 DNS settings, select the DNS server in the left pane of the DNS
    Manager and choose Properties from the DNS menu.


    When you select the DNS server in the left pane of the DNS Manager when you open
    the utility, the server statistics may not appear in the right pane. Double-click
    the server name to connect to the server, and the server status appear, indicating
    that you''re connected to the DNS server.


    Making use of interfaces

    When you first opens the Properties dialog box for the DNS server, the Interfaces
    tab is displayed, as shown in Figure 7-36. Use this tab to configure to which
    IP addresses (configured on the server network cards) the server'
