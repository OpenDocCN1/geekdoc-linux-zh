    Unless you have been living in a cave, you have probably heard about the Internet.
    In homes and offices across the world, the Internet is fast becoming ubiquitous
    as telephones and televisions. It has experienced rapid growth in large part because
    of a number of popular Internet-based applications, including the World Wide Web,
    e-mail, and instant messaging. One reason that a typical "nontechy" user can enjoy
    the Internet is that many of the details of connecting a computer to the Internet
    are hidden from general users. Almost anyone can browse the Web and receive e-mail
    without understanding anything about how the Internet works.


    This ease of use is an important factor in our discussion of DNS in this book.
    Simply put, DNS allows people to use meaningful names, such as www.yahoo.com,
    to find Internet-based resources. In this way, DNS has allowed users from a wide
    range of educational backgrounds to make use of the Internet. It wasn''t always
