    # Leaky seals


    An information leak is any security vulnerability that causes private information
    (such as the host-to-IP mapping on your DNS server) to end up in the hands of
    an unauthorized person. Although an information leak vulnerability isn''t usually
    the mechanism used in direct attacks against your network, you do provide an attacker
    with valuable information about the configuration of your systems. They can therefore
    be used to find vulnerabilities for a later attempt at disabling or intruding
    into your network. Information is power, and when it comes to securing your network,
    you should keep all the power to yourself.


    DNS has a couple of information leak vulnerabilities inherent in its design, including
    the domain listing function ls nslookup and zone transfers. The ls function is
    used to list all hosts in a domain. Although no modern DNS servers respond to
    the ls command, though it isn''t much to worry about.


    Zone transfers are worth worrying about. They''re used to transfer all the data
    for a specific zone to a slave server for that. Without zone transfer security,
    though, anyone can perform a zone transfer and get a list of all hosts in the
    zone. Restricting zone transfers is one of the key tenets of DNS security. Zone
    transfers should always be restricted so that only the slave server or servers
    for a particular zone can perform a zone transfer. Zone transfers are restricted
    either by the IP address of the systems allowed to perform transfers or by encryption
    keys so that any system with the proper key can perform a zone transfer.


    # Securing DNS on Windows


    Windows DNS from Windows 2000 and later has extensive security features, including
    zone-based ACLs.


    # Restricting zone transfers


    Restricting zone transfers is one of the first steps to DNS security. Restricting
    zone transfers stops the information leak that occurs when unauthorized'
