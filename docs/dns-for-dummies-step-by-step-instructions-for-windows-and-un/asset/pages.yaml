    **Figure 1-1: The OSI model.**


    This list describes the layers of the OSI model and the kind of functions expected
    at the particular part (layer) of the communications process:


    +   - **Layer 7, Application:** On this layer, the applications for a protocol
    suite reside. Here is where you use applications such as FTP to transfer files
    and HTTP to browse the Internet if you''re running TCP/IP. Layer 7 is the "away"
    from the network hardware. The Application layer protocols are responsible for
    getting the data from users and injecting it into the network protocol stack,
    and for receiving data from the network protocol stack and forwarding it to the
    user.


    +   - **Layer 6, Presentation:** This layer ensures that the data transferred
    from the application layer is in the correct format for the process operating
    at the Application layer. Presentation layer protocols are uncommon, especially
    when using TCP/IP, but at one time, multiple character-encoding schemes were used,
    such as ASCII (the current standard) and EBCDIC (on older IBM systems). A presentation
    layer protocol was implemented to ensure that the network data was readable regardless
    of the encoding scheme of the system.


    +   - **Layer 5, Session:** The processes operating on this layer are responsible
    for establishing and ending network communication sessions between hosts. The
    Remote Call (RPC) protocol is an example of a session layer protocol. RPC is used
    in one form or another by a variety of operating systems, .NET to RedHat Linux.
    RPC is used to establish the connection with the remote system, and then other
    protocols are used to do something with that connection.


    +   - **Layer 4, Transport:** This layer is one of the most important in TCP/IP
    because practically all applications that make use of the TCP/IP stack use a Transport
    layer protocol. Transport layer protocols are responsible'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Part I: How DNS Makes the Internet Go ''Round''


    for managing a process known as flow control. Flow control involves the management
    of the rate at which packets flow so that the receiving system can receive the
    stream of data without errors. In other words, flow control keeps a sending computer
    from sending data faster than the receiving computer can handle.


    Transport layer protocols are also responsible for error correction (incorrect
    or missing packets are resent) and segmentation, where data too large to fit in
    the network layer is split into smaller chunks. The transport layer protocol on
    the receiving end reassembles the data. TCP/IP has a few Transport layer protocols,
    including TCP, UDP, and ICMP. ICMP is used for network management (the ping utility
    uses ICMP), TCP is a reliable protocol that does error correction, and UDP is
    a faster but unreliable protocol that does not do error correction. although UDP
    doesn''t do error correction, higher-layer protocols can use UDP and their own
    error correction.


    +   Layer 3, Network: The real action happens here. This layer is responsible
    for the actual network addressing and establishing the connection to the remote
    system. For example, your (and everyone''s) IP address is defined at this layer.
    Routing also typically happens at the network layer because most routing equipment
    is configured to understand network protocols. In the TCP/IP stack, IP is the
    Network layer protocol. IP is used to provide the logical address that one system
    or application can use to refer to another system. Layer 3 is typically the last
    layer abstracted from the network hardware — in other words, it runs on any hardware.


    +   Layer 2, Data Link: This layer is normally divided into two sublayers: Logical
    Link Control (LLC) and Media Access Control (MAC). Overall, the Data Link layer
    is responsible for the raw data communication over the physical link (Layer 1).
    One protocol at the Data Link layer is Ethernet. The Logical Link Control layer
    is responsible for communication with remote systems, and the Media Access Control
    layer is responsible for traffic on the link and the physical addressing of the
    network interface. At the MAC layer, the MAC address is defined. Every network
    adapter has a unique MAC address assigned to it (in theory, anyway). Media Access
    protocols determine when the physical link is clear that the system can use to
    send data. Most protocols also perform collision avoidance or collision detection,
    which occurs when two systems send data on a physical link at the same time.


    +   Layer 1, Physical: The physical media and electrical interfaces on the network
    devices reside on this layer. The physical layer specifications control how the
    data signals are sent from one system to another, including the wiring and the
    format of the electrical (or optical) signals.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Chapter 1: The Basics of DNS


    # Wrap it up: Encapsulation


    Encapsulation is a term you may hear in any situation in which multiple network
    protocols are in use. It''s an important concept in networking that refers to
    the process in which low-level protocols are used to transport data provided by
    higher-level protocols. The information from the encapsulating protocol. Remember
    that the packets or frames sent by any particular protocol are made of two distinct
    sections: the header and the data.


    Encapsulation is perhaps best understood if you take a top-down look at the process.
    Suppose that the protocol stack used is TCP/IP. Suppose that you want to move
    some data from one host on the network to another and that you want to use FTP
    to do so. Your data, which is sent using FTP, needs to make the journey by being
    carried by the Data Link layer protocol, such as Ethernet. FTP data cannot be
    placed directly in an Ethernet frame, because Ethernet doesn''t have the capability
    to transport data in an error-free manner and in the proper-size segments. Neither
    does Ethernet know the address of the receiving node. These jobs belong to the
    Transport and Network layers, respectively.


    When the FTP data is sent, the TCP protocol is used as a transport protocol. FTP
    data is sent as either a block or stream of data; for the purposes of this example,
    however, assume that a block format is being used. The FTP data is sent in fixed-length
    blocks, each with some information in a header. The header on each block is used
    to contain status and processing information, which is read by the the FTP protocol
    on the receiving system. The FTP block, including the header, is then segmented
    (divided into chunks small enough to be sent by TCP/IP), if necessary, and encapsulated
    in the TCP protocol.


    The encapsulation process just means that another set of headers (TCP, in this
    case) are appended and the original data headers become the data of the TCP packet
    — One set of data is surrounded by the other (see Figure 1–2).


    | Figure 1-2: The encapsulation process and its relation to the OSI model. | Ethernet
    headers | IP headers | TCP headers | FTP headers | FTP Data |

    | --- | --- | --- | --- | --- | --- |

    | | Layer 2 | Layer 3 | Layer 4 | Layer 7 |'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Part I: How DNS Makes the Go ''Round''


    These TCP headers are read by the receiving system''s TCP protocol. The next step
    is the encapsulation of the TCP data by the IP protocol. The IP protocol has other
    responsibilities, such as addressing, and it appends its own headers to the TCP
    packet. The TCP packet, including TCP headers, becomes the data in the IP packet.
    The same process occurs when the IP data is sent over the Data Link protocol,
    whatever it may be. If it''s Ethernet, the IP packet becomes the data in an Ethernet
    frame and Ethernet headers are appended to the frame.


    The decapsulation process is the opposite of the encapsulation process. The Ethernet
    protocol on the receiving system gets the Ethernet frame created in the encapsulation
    process. The protocol then reads the Ethernet headers and sends the data portion
    of the frame untouched to the IP protocol. Remember that IP headers, so the IP
    protocol can now read these headers. The IP protocol then forwards the data section
    of the IP packet to the TCP protocol, which reads the untouched TCP headers and
    forwards the data to FTP. FTP then reads the FTP headers, and the block of FTP
    data becomes part of a file on the receiving system.


    The encapsulation/decapsulation process makes things easier on the developers
    of network protocols because each protocol layer can be developed separately.
    The process becomes a problem, however, for performing content scanning and stable
    firewall inspection. These processes rely on being able to see the application
    data in a network packet, every time a packet of data passes through this type
    of system, it must be decapsulated and reencapsulated and sent on to the receiving
    system. This process is highly CPU intensive and can slow network traffic significantly.


    Although encapsulation and decapsulation may seem like a heavy-duty task that
    would eat system resources, that''s not really the case. The amount of power used
    on a normal server or workstation, encapsulating, and decapsulating typical streams
    of data isn''t significant. The CPU power issue becomes an issue, however, on
    network hardware, such as firewalls and multilayer routers. Data Link layer protocols
    are often embedded in hardware, and higher-level protocols are implemented in
    software, so at least one step of encapsulation would be required. One way to
    prevent undue processor utilization from the encapsulation process that has been
    used by many network hardware vendors is to implement the entire protocol stack
    used by the encapsulation and decapsulation process in a hardware device called
    an Application Specific Integrated Circuit (ASIC). Processing the packets in hardware
    is much faster than processing them in software, so the CPU requirements are removed.
    Because the ASIC devices can also usually be reprogrammed, the processing code
    can be updated if required.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 1: The Basics of DNS


    # DNS: What It Is and What It Does


    In essence, DNS is simply a database that links meaningful names (known as host
    names), such as www.microsoft.com, to a specific IP address, such as 192.168.124.1.
    Simply linking addresses to names is just the beginning, though, because DNS has
    many more features in addition to host name address mapping. We examine the advanced
    functions of DNS in later chapters, but for now you should focus on the host name
    to IP mapping features. The key features you need to be aware of are shown in
    this list:


    +   - Mappings of addresses to names and vice versa (known as records) stored
    in a database.

    - The DNS database is distributed.

    - A DNS database also stores additional records.


    Although DNS is a database, most importantly it''s a distributed database. Each
    DNS server contains only a small portion of the host name to IP addresses (relative
    to the number of records for the entire Internet). Each DNS server is configured
    with a special record that tells the DNS server where (the IP address of another
    DNS server) it will perform a lookup for it doesn''t have in its portion of the
    DNS database. Because of this arrangement, each DNS server maintains only a small
    portion of the total DNS host to IP address mappings. The collection of host-name-to-IP
    address mappings contained with the DNS database is also known as a namespace.
    The DNS namespace is discussed in Chapter 2, and the ways DNS lookup function
    is explained in Chapter 3. Essentially, when looking for a name in DNS, the client
    first checks a top-level DNS server. That server tells the client which DNS server
    hosts the next part of the DNS name, and the client queries that server. This
    lookup-and-handoff process continues until the client finds the DNS server that
    hosts the record in question, and that server provides the IP address.


    In addition to the basic IP-address-to-host mapping records stored by the DNS
    database, records are also maintained by DNS for other purposes. DNS contains
    a number of record types that facilitate other applications, as we discuss in
    Chapter 4. The mail exchanger (MX) record, for example, provides mail servers
    with the information required to forward e-mail messages to the recipient''s e-mail
    server. Another type of record, the service (SVC) record, is used by Microsoft
    Active Directory to locate network services.


    # Seeing the DNS Difference


    By itself, DNS doesn''t appear to do much, and on top of that DNS can seem a bit
    intimidating because it has number of different features and record types. One
    key to understanding the importance of DNS is understanding how'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Part I: How DNS Makes the Internet Go ''Round


    processes and applications depend on the services DNS provides. By understanding
    how DNS provides the underlying services used by various applications, you can
    get a clearer picture of why DNS exists and how it works.


    DNS services are used by many common applications, including


    +   - Wide Wide Web (WWW)

    - E-mail

    - Other applications, such as instant messaging


    The Wide Web depends on DNS for user-friendly navigation. You could get to a Web
    site by entering the IP address of a site in your Web browser, but remembering
    lots of arbitrary numbers isn''t easy for most folks. It''s much easier to remember
    a DNS name for a Web site that reflects its content, as www.yahoo.com or www.microsoft.com.
    It''s fair to say that without DNS, the Web wouldn''t have become the phenomenon
    that it is.


    E-mail is one of the most popular applications that utilizes DNS. Although the
    Web simply uses DNS for linking names to IP addresses for Web sites, e-mail servers
    also require some specialized records before and after what is required for basic
    host name to IP addresses. For example, when an e-mail message is sent from your
    e-mail client (such as Microsoft Outlook oring Messenger), it can be sent either
    directly to the target domain (Microsoft.com if the note was sent to user@microsoft.com)
    or to another e-mail server that is providing a relay service. If your application
    specifies an outgoing (SMTP) mail server that is not the final destination server
    for the message, you''re making use of the relay process.


    As you know, an e-mail is made up of two parts: a recipient and a host. In the
    address postmaster@domain.tld, postmaster is the recipient, the user who will
    receive the message. This is irrelevant to the SMTP process, though the mail transfer
    agent (MTA) is responsible for making sure that the message gets into the mailbox
    of


    The host, domain.tld, is of much more interest. In this case, domain.tld refers
    to not a host in the traditional sense of an A record rather to a mail server
    (MX). This server is responsible for accepting all mail for domain.tld, denoted
    by a special record — an MX record in DNS.


    Beyond the Web and e-mail are many applications that either rely on or use DNS
    services. These applications can include databases, multi-tier applications built
    by using middleware or an application server, peer-to-peer sharing programs, instant
    messaging, and multiplayer games.


    In quite a practical sense, any application that uses the Internet to connect
    two or more hosts to share information, or otherwise communicate, is relying on
    DNS services in one form or another.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Setting Up Your Systems to Use DNS


    Many different DNS clients as well as a number of DNS servers exist. This book
    focuses on the clients and servers for Microsoft Windows 2000, Windows XP, and
    Linux and also discusses the Microsoft DNS server on Windows 2000 and the Berkeley
    Internet Name Domain (BIND) on Linux. BIND is the most popular Unix-based DNS
    server, and in fact many vendor-provided DNS servers are based on BIND code. BIND
    is also available for Windows, but is rarely used.


    Microsoft Windows contains two types of DNS client: an integrated client and a
    command-line client. They''re used for different purposes:


    +   - Integrated client: The integrated DNS client in Windows is used for all
    applications that don''t have custom-written clients. Considering that the integrated
    DNS client is built into Windows for any application to use and writing a DNS
    client from scratch is lots of work, most programs use this integrated client,
    such as Microsoft Internet Explorer and Microsoft Outlook.


    +   - Command-line client: The command-line client in Windows is nslookup. Normally
    used to troubleshoot DNS problems, it can look up any type of record from any
    DNS server. If you''re having DNS-related problems, you can check your records
    to ensure that they''re correct or to locate the specific problem.


    # Serving DNS with Windows


    Windows server operating systems (Windows .NET Server, Windows 2000, and Windows
    NT) all support DNS servers in addition to the various client tools. The Microsoft
    DNS server is integrated into all versions of Windows NT, Windows 2000, and Windows
    2000. .NET Server. This book focuses specifically on the Windows 2000 implementation,
    although much of the information carries both forward and backward in different
    versions. The Windows 2000 and Windows .NET DNS servers are essentially identical,
    although the Windows NT 4.0 DNS Server is similar but without the integrated Active
    Directory support.


    The Microsoft DNS server has all the functionality of any standard DNS server.
    It can host the standard records and provide services to any client. A few major
    differences exist between the Microsoft DNS Server and the most popular Unix DNS
    server, BIND:


    +   - GUI interface: Microsoft DNS allows you to configure your zones and records
    through a graphical interface by default rather than have to know the format of
    specific configuration and zone files.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 18 Part I: How DNS Makes the Internet Go ''Round


    +   - Records stored in the Registry: Although BIND records are stored in flat
    (nonrelational) text files by default, Microsoft DNS records and configuration
    information is stored in either the system Registry or Active Directory. You can
    configure Microsoft DNS to store records in files, and you can configure BIND
    to use a database for record storage.


    +   - Extended record types: Microsoft DNS on Windows 2000 and later also supports
    SRV (Service) records in a way to enable Active Directory and the global catalog.
    These SRV records are used by clients to locate servers on the network.


    Most versions of Unix also include an integrated client and at least one (and
    sometimes more) command-line client.


    The integrated Unix client is implemented in a slightly different fashion from
    the integrated Windows client, but that only really matters from a programming
    perspective. To users, they''re effectively the same. The integrated client provides
    DNS services to web browsers, e-mail applications, and all other applications
    that don''t have a custom-programmed DNS client.


    Unix also contains the nslookup command-line DNS client, and it''s almost functionally
    identical to the Windows version. With the implementation of BIND 9 on newer Unix
    systems, nslookup is being deprecated in favor of a new DNS client named dig.
    It''s a more powerful client in that provides far more information about the lookup
    process than simply the final result. With nslookup, you can search for a DNS
    record, but with dig you can determine why a lookup is failing.


    # Getting your name on Unix


    The BIND DNS server service (operating on a Unix operating system) is the most
    common DNS server now in use on the Internet. This book focuses primarily on the
    latest version of BIND, version 9. BIND also provides all the standard DNS features,
    but it has advantages and disadvantages when compared to the Microsoft DNS Server.
    BIND running on Unix is understood to be more robust and scalable than Microsoft
    DNS because of the efficiency of Unix applications and the inherent instability
    in Unix over Microsoft Windows. Since the release of Microsoft Windows 2000, though,
    Windows has become a much more stable platform than older Windows versions for
    critical applications such as DNS, although it does not yet have the same for
    stability as Unix.


    In addition, Unix is often, from a performance standpoint, a favorable platform
    for infrastructure applications as DNS. Unix was designed with efficiency in mind
    mostly with no regard for usability because it''s a primary operating system.
    Windows, on the other hand, was designed with usability rather than efficiency
    in mind. For this reason, a Unix system typically runs an equivalent faster than
    Windows does on similar hardware. Proprietary Unix systems are, with a few exceptions,
    often far more scalable'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Chapter 1: The Basics of DNS


    The main disadvantage to BIND on Unix is its difficulty of configuration. BIND
    uses a series of text files, including a configuration file (typically named /etc/named.conf),
    and zone files to store its configuration. When BIND is started, these files are
    read and the BIND configuration is stored in memory. If these files have syntax
    errors, either the DNS server doesn''t start (if the configuration file has errors)
    or the zone doesn''t load (if the zone file has errors). In addition, sometimes
    the DNS server starts or the zone loads and you have unexpected results.


    # Organizing and Subdividing DNS


    Although most DNS on the Internet is fairly simple, having only NS records identifying
    the name servers, a few A records (or only one in many cases), and an MX record,
    not all domains are that simple. If you''re implementing DNS at your site for
    naming your corporate systems, for example, you may have a huge number of A records
    and possibly a number of other records. In this case, you should organize your
    DNS namespace into subdivisions.


    A subdomain is a child of another domain you control. For example, if you have
    the domain name domain.tld, you can have as many subdomains under domain.tld as
    you want, such as eng.domain.tld, acct.domain.tld, and corp.ca.domain.tld. Only
    two requirements must be:


    +   - The domain tree must not be more than 128 levels deep, including the namespace
    root. This situation is unlikely because it defeats the purpose of DNS, which
    is usability.

    - Every subdomain on each level must be unique. Obviously, you have eng.domain.tld,
    eng.ny.domain.tld, and eng.domain.tld all coexisting, but you cannot have more
    than one eng.domain.tld.


    Through the implementation of subdomains, you can organize your DNS namespace
    into a structured tree rather than a flat space. This organization eases administration
    and makes the domain tree more intuitive to users. You may choose to organize
    your namespace in a variety of ways, such as by geographical location or by business
    group.


    # Making DNS Work Harder, Safer, and Better


    In addition to all the basic DNS features, DNS implements a number of advanced
    features meant to boost the functionality of DNS and increase its security.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Part I: How DNS Makes the Internet Go ''Round''


    DNS security is implemented through a number of methods, including


    +   - Securing the server


    +   - Implementing transactional signatures (TSIGs) for secure zone transfers
    and updates


    +   - Limiting the amount of information a DNS server delivers to an untrusted
    party


    When it comes to advanced functionality, DNS has an array of features to both
    increase efficiency and ease administration. This list outlines the key features
    you should be aware of:


    +   - Dynamic DNS: A method of allowing a DNS client to update a record in a DNS
    zone. By using dynamic DNS on a network of workstations, for example, the workstations
    automatically register in DNS rather than an administrator having to create a
    record for each one. Dynamic DNS introduces a number of security issues, which
    we address in Chapter 11.


    +   - DNS round: A method of using DNS as a "poor person''s load balancer." A
    traditional network load balancer uses a wide variety of network metrics to measure
    the performance of host and route incoming requests to the least load. With DNS
    round, DNS clients are routed sequentially to each server on the list, starting
    with the first server after the last one. Because this method doesn''t take into
    account any load on the systems, a system could even go down and still be routed
    to it. Round round can be useful in many situations where the cost of a full load-balancing
    solution cannot be justified.


    The NOTIFY feature in DNS allows slave DNS servers to be automatically notified
    when a zone is updated on the master DNS server. Without NOTIFY, slave servers
    wait until the cache timeout of the zone expires before updating it from the master
    server. With NOTIFY, however, whenever a zone is updated on the master server,
    a NOTIFY message is sent to each slave server listed on the notify list. These
    servers then perform a zone transfer waiting for the cache timeout to expire.


    +   - DNS zone change notification: The method by which a slave DNS server transfers
    data from the master DNS server. This zone data can be changed on the master server,
    and it''s automatically updated in the caches of each slave instead of having
    the zone data numerous times, as is the case when you have more than one master
    DNS server. The problem with zone transfers, however, is that they can use lots
    of bandwidth across network links, especially with large zones or slow links.


    +   - Incremental zone transfer: Allows the updated part of the zone data to be
    transferred to the slave server rather than the entire zone. This feature can
    have a large effect on network bandwidth, especially with large zones. Incremental
    zone transfer uses a special protocol to function and is limited to most zones
    on Windows DNS servers and dynamically updated zones on BIND servers.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Chapter 2


    # DNS Namespaces


    In This Chapter


    +   - Understanding domain names

    - Planning your DNS configuration

    - Understanding top-level domain names


    The first three chapters in this book will explore the concepts relating to how
    DNS is designed and how it generally functions, and how DNS is maintained on the
    large (Internet) scale. This information is important because it forms the core
    knowledge you need in order to successfully implement and maintain DNS services
    in your home or business. After thoroughly examining these fundamentals, we show
    how you can begin traversing the hands-on process of making the needed server
    and software configuration changes to get DNS services up and running.


    As you may or not know, DNS is (in its most basic form) simply a database that
    matches domain names to IP addresses. For example, a Web site such as www.dummies.com
    is mapped to a particular IP address — 168.215.86.100, in this case, if you don''t
    care about a connection to any networks outside your Local Area Network (LAN),
    as is the Internet, you can set up a DNS server to serve any names you want. You
    don''t even have to use top-level domains such as .com or .net with a private
    DNS implementation. If most network users, you want to make use of wacky old Internet
    or remote hosts on your Wide Area Network (WAN), you need to understand that DNS
    is a bit more complex.


    The structure of domain names using top-level domains such as .com and .net is
    required only if hosts will be making use of the Internet. Because this is the
    case, you must understand the manner in which domain names are structured if you
    will be working with Internet-connected DNS servers or hosts that must reach resources
    on the Internet.


    The structure used to organize domain names is a namespace. The namespace for
    Internet hosts is arranged in what is known as an inverted hierarchical tree.
    In more simplified terms, this arrangement, displayed graphically,'
  merge: -1
  img_proc: true
