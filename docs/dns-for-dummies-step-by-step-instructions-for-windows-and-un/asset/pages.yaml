- pgno: 213
  md: '# 194 Part V: Security and Advanced DNS Tricks


    When you''re required to provide both internal and external clients with DNS resolution,
    as in the case in which a company hosts its own DNS for a Web site or e-mail,
    you should have two sets of DNS servers. One set for external clients should be
    located in the DMZ as just explained and should host only the zones and records
    that are absolutely necessary. Internal DNS servers are located in the internal
    network and serve internal clients. This separation of internal and external DNS
    servers limits the possibility of information leaks and DNS poisoning, as described
    in the following section.


    # Poisoned DNS


    The goal of many attacks against DNS servers is spoofing. Normally, a DNS request
    is served by an authoritative DNS server for a domain. Spoofing occurs when an
    attacker intercepts a DNS request and sends a manufactured (spoofed) response
    to the client. The client can be a DNS client or a DNS server performing recursion.
    By spoofing the DNS response, the client then has an incorrect DNS entry, which
    is cached. This process is known as cache poisoning the cached poisoned response
    is used until the time-to-live (TTL) value expires.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_213_0.png)


    The term poisoning is used because the false record (poison) is injected into
    the system at one point and spreads throughout the system, affecting other points.
    This situation happens especially when a DNS server''s cache is poisoned because
    it may serve many clients whose caches are also poisoned.


    Although intercepting individual DNS requests poisons both DNS servers doing recursion
    and individual clients, sometimes an attacker wants to cause the poisoning effect
    on a larger scale. In this case, he can use one of a few methods to poison the
    authoritative DNS server for a domain. In this case, every time a request is made
    for the domain, the poisoned record is returned to the client.


    Typically, cache poisoning is done on the client side. The attacker is located
    at a point where he can intercept the DNS traffic from a specific client and spoof
    to claim that any DNS enters he. DNS poisoning, on the other hand, is on the server
    end. DNS server poisoning can be done by either intercepting all requests at the
    server and spoofing the DNS responses or poisoning the server itself by changing
    the records.


    Although cache poisoning is normally done by intercepting DNS requests and injecting
    false zone transfers, it can also be done by dynamic DNS updates are enabled on
    the server. Dynamic DNS entries are typically added by any system and then subsequently
    modified or deleted by only that system. This situation causes two problems in
    any system'
