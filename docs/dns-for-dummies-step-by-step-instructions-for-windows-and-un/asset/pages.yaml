  md: '# Chapter 5: Configuring a DNS Client


    in this case), you can then use the command ping deadhost and omit the DNS suffix.
    The DNS suffix specified in the DNS client configuration is automatically appended
    to any host name you type. For example, if you configure your computer with the
    DNS suffix domain.tld, typing ping deadhost causes the system to attempt ping
    deadhost.domain.tld.


    The next piece of configuration information you need to supply to your client
    is a list of search domains. Search domains function in a manner similar to the
    DNS suffix. The DNS suffix is typically used first when you attempt to resolve
    an unqualified host name. You can also provide a list of search domains used as
    alternatives to the DNS suffix if the suffix does not resolve the host name. Suppose
    that you have a system with suffix of domain.tld and search domains of foo.com
    and bar.net. Then you type ping deadhost. The computer first attempts to ping
    deadhost.domain.tld. If this name cannot be resolved, it then attempts to ping
    deadhost.foo.com. If that name resolves, the process fails and returns an error.


    You should now have all the information you need in order to configure the DNS
    clients, including the DNS server IP addresses, the DNS suffix, and the search
    domains. The following sections show you how to configure Windows and Linux clients.


    # Getting Your Client a Windows Seat


    You can configure Windows DNS clients in a number of ways. If your computer is
    using the Dynamic Host Configuration Protocol (DHCP) to automatically obtain its
    IP address, most likely retrieves its DNS client configuration from the same DHCP
    server. If this is the case, you''re in luck and the client doesn''t require any
    additional configuration. If the DHCP server isn''t assigning a DNS server (or
    you want to override the DHCP setting), read on.


    DNS clients are configured either during the installation of Windows or after
    it has been installed. The configuration during installation is similar to that
    of an installed system, and we describe here only the configuration for an installed
    system. The process differs slightly depending on which version of Windows you''re
    using.


