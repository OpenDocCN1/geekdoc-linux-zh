    # Securing DNS (BIND) on Unix


    Although you can secure BIND on a Unix system in many ways, you should take a
    few important steps on every system, as described in this section.


    # Transaction signatures and control security


    Transaction signatures (TSIG) is a method of securing DNS data using encryption
    with a shared secret key. A shared secret key is simply an encryption'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 204 Part V: Security and Advanced DNS Tricks


    key configured on both ends of the connection so that both parties must know the
    same key. TSIG is used to secure zone transfers, dynamic updates, and control
    functions, such as restarting the name server.


    # Using codes: Encryption


    Encryption is the process of converting plain text into ciphertext. Ciphertext
    isn''t readable by any party who doesn''t have the correct key to decrypt it.
    Although you can use a variety of encryption algorithms, their common feature
    is that they take two pieces of input, the data and a key, and produce ciphertext.
    Without both the key and the ciphertext, getting the plain text data is nearly
    impossible. The term "nearly impossible" is used because many encryption algorithms
    are susceptible to attack. Although the process is quite difficult, you can get
    the text data from the ciphertext without the proper key. Encryption algorithms
    are often a compromise in that they may be susceptible to a certain attack, but
    that attack is so difficult that the time it would take to carry out would be
    so large that the attack would be of no value.


    Two basic types of keys are in encryption algorithms: those that use secret keys
    (symmetric) and those that use public/private-key pairs. Shared secret keys must
    be shared among each party who wants to encrypt or decrypt data. With public/private-key
    pairs, the public key is used to encrypt data, and the private key is used to
    decrypt data. We discuss the advantage of this arrangement in the following section,
    "Securing zone transfers."


    The biggest problem in cryptography (the study of encryption) other than the design
    of a secure encryption algorithm is key exchange. In a shared key algorithm, the
    person encrypting data must be able to send the key to the recipient of the data.
    Although the data is encrypted and can be sent over a clear channel, the key must
    keep secure or else the data gets compromised. You may send the key in somewhat
    secure ways (by way of a secure courier, for example), but these methods are often
    slow and unwieldy.


    The public-/private-key pair solution addresses the problem of key exchange. The
    recipient of a message generates a pair of keys, one public and one private. The
    recipient keeps the private key and sends out the public key to anyone who wants
    to send some encrypted data. The sender encrypts the data by using the public
    key, and the recipient decrypts the data using the private key. Although the mathematics
    behind the public-key algorithm works complex, the private key is the only way
    to decrypt the data; the public key is useful only for encryption. Most modern
    encryption algorithms are hybrid systems in that they use slower public-key encryption
    to exchange a shared secret key and then use that key in a faster symmetric algorithm
    for the data-encryption process.'
  merge: -1
  img_proc: true
- pgno: 224
  md: "# Chapter 11: An Antidote for a Poisoned Cache: DNS Security\n\nAnother type\
    \ of cryptographic algorithm is known as a one-way hash function. This type of\
    \ function is used by TSIG for DNS security. A one-way hash function uses input\
    \ (typically a key) to create some output, known as a hash. This output is much\
    \ smaller than the original input, but is still enough to have a high probability\
    \ of being unique. This hash can be generated by two parties using a shared secret\
    \ key and some known data, and then the two parties can compare hashes and determine\
    \ whether the data has been altered in transit.\n\nFor more advanced information\
    \ on encryption, get a copy of the book Applied Cryptography: Protocols, Algorithms,\
    \ and Source Code in C, by Bruce Schneier (Wiley Publishing, Inc.). This book\
    \ explains the basics of cryptography and proceeds to more advanced topics.\n\n\
    TSIG is fairly easy to configure in BIND. You must first generate a secret key\
    \ and then configure the key in the configuration file. To generate a key on BIND\
    \ 9 system, issue the following command and replace <hostname> with the name of\
    \ one of the systems using the key. although this value is arbitrary, it assigns\
    \ a name to the key. You should use a name that describes the zone or host name\n\
    \n```\ndnssec-keygen -a HMAC-MD5 -b 128 -n HOST <hostname>\n```\n\nThis example\
    \ generates two files in the current directory: <hostname>+157n.key and <hostname>+157n.private.\
    \ Note that the value is a hash of the key itself and is used for identification.\
    \ Open the .private file and you see a value such as Key: 62+ZgLvjjofGXwM80jZW==.\
    \ You need to insert this value in the BIND configuration file and The key statement\
    \ should immediately follow the options statement:\n\n```\noptions (\n  directory\
    \ \"/var/named\"\n);\nkey eng.domain.tld. [\n  algorithm hmac-md5;\n  secret \"\
    62+ZgLvjjofGXwM80jZW==\";\n);\nkey rndc-key [\n  algorithm hmac-md5;\n  secret\
    \ \"LNHAKyWTT493Em7+0JPkdQ==\";\n  inet 127.0.0.1\n  allow (127.0.0.1) keys (\"\
    rndc-key\");\n);\n```\n\nAfter keys are defined, you can use them for zone-transfer\
    \ and dynamic-update security, as discussed later in this chapter. Keys can also\
    \ be used for control security. BIND 9 uses a utility rndc to control the DNS\
    \ server."
  merge: -1
  img_proc: true
- pgno: 225
  md: "# Part V: Security and Advanced DNS Tricks\n\nThe rndc utility can be used\
    \ to restart the server, reload zone files after an update, flush the DNS cache,\
    \ and more. It doesn't work without a key defined in the configuration file, though.\n\
    \nThe advantage of rndc is that it allows the remote control of a BIND server.\
    \ With no security in use, however, anyone can start and stop any DNS server he\
    \ wants. For this reason, rndc isn't enabled by default. To allow these steps:\n\
    \n+   1. **Create a key using the dnssec-keygen command, as shown a little earlier\
    \ in this section; name the key rndc-key.**\n\nThe complete command is\n\n```\n\
    dnssec-keygen -a HMAC-MD5 -b 128 -n HOST rndc-key\n```\n\n+   2. **Add the key\
    \ to the BIND configuration file, as shown in the preceding code listing.**\n\n\
    +   3. **Add a controls statement to the BIND configuration file, as shown in\
    \ the preceding code listing.**\n\nThe values are shown in this list:\n\n+   *\
    \ The inet address defines the IP address on which you want the server to listen\
    \ for control commands. Change it to an address on your system or leave it at\
    \ 127.0.0.1 to listen only locally. Listen on all addresses, use the value *\n\
    * The allow address defines the IP addresses that are allowed to send commands\
    \ to the DNS server. The value 127.0.0.1 allows only local commands. You can also\
    \ specify external systems as long as you separate the addresses with semicolons.\
    \ Using a value of any allows all systems to send control commands as long as\
    \ they have the correct key.\n* The keys value specifies the keys used to allow\
    \ control commands to be sent to the system. The values here (separated by semicolons)\
    \ refer to the names of keys defined in the key statements in the configuration\
    \ file.\n\n+   4. **Restart the DNS server.**\n\n+   5. **Configure the client.**\n\
    \nOn the system that will send the commands to BIND using rndc, you must create\
    \ a configuration file. This file is typically /etc/rndc.conf and must look like\
    \ this:\n\n```\nkey \"rndc-key\" [\n  algorithm hmac-md5;\n  secret \"LNHAKyWtt493Em7+OJPKd0\"\
    ;\n```"
  merge: -1
  img_proc: true
