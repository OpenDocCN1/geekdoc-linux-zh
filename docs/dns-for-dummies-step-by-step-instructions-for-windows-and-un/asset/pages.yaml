- pgno: 322
  md: '# Appendix B: Using Webmin for BIND Administration


    4. Browse through the options in the module configuration.


    You can leave most options at the default settings unless you know that your configuration
    is specifically different from the defaults that are displayed. In the Module
    Configuration Controls section (labeled BIND paths options), you can see configuration
    options for starting BIND, including the startup user, group and default configuration
    file.


    The next section, Display options, controls how BIND information is shown in Webmin.
    If you tweak these options, you can customize the look and feel of your Webmin/BIND
    session. Of the displayed options, the most important Display domains and Order
    to display records in. If you have only a few zones, the Icon and As default fields
    respectively, are sufficient. If you add more zones, the default becomes cluttered
    and you will probably have a difficult time finding the zone you''re looking for.
    You may want to change the settings to List and By name, respectively, to make
    a large number of zones easier to view.


    In the Zone files section, you configure the new zone files and existing zones
    are modified. In most cases, the default settings are fine, unless you want to
    customize the your zone files are structured.


    The last section in Figure B8, System configuration, is the most important section
    for initially configuring the module. The first two settings are the location
    of the named.conf file and the BIND binary file. Because these files are fairly
    important, you have to ensure that the path information is correct for your system.
    Note that the error message shown in the figure was caused by an incorrectly named
    executable location.


    In the System configuration section, you must specify where to find the who command
    and specify the command used to reload zones. BIND is normally in the path by
    default, but you must change the command to reload zones, ndc by default, rndc
    for BIND 9. Note also that you must have already configured RNDC with a key in
    the rndc.conf and named.conf files (refer to Chapter 8). You can leave the PID
    option as you have to ensure that the command to start the BIND option is correct
    for your system. You may need to change it to point to the BIND executable if
    you''re not using a startup script or if BIND is starting with a number of other
    applications.


    When all your settings are in place, click the Save button at the bottom of the
    page. Your changes are saved and the module page opens, as shown in Figure-9.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 304 DNS For Dummies


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_323_0.png)


    Figure 8-8: Setting system-specific information, such as locations.


    The first things you can do with the Webmin module is start the BIND server if
    it''s not running. At the bottom of the module page is a button labeled either
    Apply Changes or Start Name Server, as shown in Figure 8-9. If the button is labeled
    Start Name Server, click to start BIND. If BIND starts successfully, the page
    refreshes and the button changes to Apply Changes. If BIND is unsuccessful in
    starting, a specific error is shown, indicating (if you''re lucky) the source
    of the problem.


    # Exploring the BIND module


    The BIND module configuration module page has two sections:


    +   - Global server options: In this section, you set the configuration options
    that affect the entire BIND server. These include all options that would normally
    be manually configured in named.conf file under any directive other than zone,
    such as the options, key, or controls directives.

    - Existing DNS zones: In this section, as its name suggests, you configure existing
    zones and add new zones to the server. You configure all options that would normally
    be in zone directives in the named.conf file.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Appendix B: Using Webmin for BIND Administration


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_324_0.png)


    Figure B-9: You manage the name server from the BIND module Webmin page.


    Webmin doesn''t replace the named.conf file. Instead, Webmin is just a graphical
    front end to process that edits the named.conf file transparently in the background.
    If you make a change in the named.conf file with Webmin and then check the file
    again, you can see the changes Webmin made.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 306 DNS For Dummies


    # Global server options


    Whenever you make changes to any of the configuration options on any of the configuration
    pages, click the Save button at the bottom of the page to ensure that the changes
    are committed. Don''t use the Back button in your web browser because the information
    that''s displayed may be cached locally and not reflect the true status of the
    monitored server.


    After you finish making configuration changes to your DNS server, you must click
    the Apply Button at the bottom of the BIND module page. This action restarts the
    DNS server and causes the changes to take effect.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_325_0.png)


    In the Global Server Options section, a Number of icons refer to a specific type
    of configuration for the server. The first option is Other DNS Servers, as shown
    in Figure B-10. On this page, you configure the other DNS servers to which, or
    from which, you will be making zone transfers. You don''t need to configure every
    other server to this server will be exchanging zones — only those that require
    configuration other than the default. You first specify the IP address of the
    server, and then you can configure settings for


    Although it may sound like a quote from a 1990s Reeves movie, the Ignore bogus
    server? option instructs BIND to ignore all zone transfers from this server. You
    can use this option when you have a malicious or improperly configured or otherwise
    "bogus" DNS server attempting to complete a zone transfer with yours. The next
    option allows you to select whether zone transfers should be done in batches or
    one zone at a time. The Maximum transfers option controls how many zones can be
    transferred in a batch. Finally, the DNS keys option allows you to select a defined
    key to be used for zone transfers with this server.


    The next set of options is Logging and Errors. The Logging and Errors page, as
    shown in Figure B-11, shows the existing logging channels, or logging parameters,
    and allows you to define new logging channels. In most cases, the defaults are
    acceptable; if you have large logs or want to keep your logs separate from your
    other system logs, however, you can configure a logging channel. You can add a
    new channel by clicking Add a new channel and filling the necessary information.
    Click the Save button to save the new logging channel.


    The Access Control Lists configuration option, as shown in Figure B-12, is fairly
    straightforward. As we describe in Chapter 11, an access control list (ACL) is
    an alias for a list of names or addresses that can be referenced anywhere else
    in the BIND configuration by the ACL name. For example, you can place internal
    networks in an ACL named internal and use internal as the value for a control
    statement or other access control rather than specify all the addresses or networks
    each time.'
  merge: -1
  img_proc: true
