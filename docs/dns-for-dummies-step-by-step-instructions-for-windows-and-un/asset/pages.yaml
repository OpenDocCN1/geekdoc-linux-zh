    The /EnumRecords command also has a number of filters you can apply. The type
    DNSMCD /EnumRecords with no zone name to see a list of the available data options.
    Using these options, you can filter based record type and view additional information
    about a record.


    # ZoneInfo


    The DNSMCD /ZoneInfo <zone name> command shows configuration information about
    a zone, as shown in Figure A-8. The zone configuration information is a reflection
    of the zone Properties dialog box that displays when you right-click a zone in
    the DNS snap-in and choose Properties.


    ```

    C:\WINNT\System32\cmd.exe

    >nslookup /zoneinfo sample.tld

    Zone query result:

    ptr = 00075420

    name = sample.tld

    zone type = 1

    dns = 0

    Be interpreted = 0

    data time = sample.tld.dns

    Using WMI = 0

    aging = 0

    refresh interval = 168

    no refresh = 0

    scavenging available = 352259

    NULL IP Array = 0

    Zone Secondaries = 0

    NULL IP Array = 0

    secure sq = 0

    Command completed successfully.

    C:\>

    ```


    Figure A-8: Viewing zone information.


    The /Info command, the /ZoneInfo command is useful for looking at the configuration
    of a particular zone at a glance. The output can be parsed by scripts, as we mention
    at the beginning of this appendix. Included in the output is the zone name and
    type, data filename, scavenging information, and identity of any master or slave
    servers for the zone. You can also'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Appendix A: Using the DNSCMD Utility


    see whether dynamic updates are enabled and whether it''s Active Directory integrated.
    Masters appear if the zone is a slave, and slave servers appear if the zone is
    a master and has slave servers configured.


    # Changing the server configuration


    Viewing the DNS configuration information is all well and good, but you need a
    tool that can make changes too. Fortunately, DNSCMD comes through with this functionality
    in abundance. It has a variety of commands for configuring the server, including
    those to configure the server in addition to the zones and records maintained
    by the server. The DNSCMD command can essentially replace the DNS snap-in, but
    it can prove to be more difficult to use because it lacks the intuitive interface
    of the DNS snap-in. Not to worry: After master DNSCMD, you find that it is more
    efficient and definitely advantageous if you need to add DNS management abilities
    to a scripted application. This section examines the DNSCMD options that relate
    to the operation of the DNS server.


    # /Restart


    ```

    DNSCMD /Restart

    ```


    This command simply stops and restarts the DNS server in a manner similar to the
    way you use the Services control panel to restart the DNS Server service.


    # /Statistics


    ```

    DNSCMD /Statistics

    ```


    In addition to the ability of this command to gather information, as we explain
    a little earlier in this chapter, it has a configuration option. By typing DNSCMD
    /Statistics /Clear, you can wipe out the existing statistical information and
    start from scratch. This command can be useful if you want to view statistics
    for a specific period or if you want to evaluate the effect of a configuration
    change on the server''s operation. You can reset the statistics and then sample
    them at specific intervals, which is especially useful for scripted statistics-gathering
    for analysis.


    # /ClearCache


    ```

    DNSCMD /ClearCache

    ```


    This command simply clears the DNS server''s cache. You may need to clear the
    DNS server cache if you know that your server is caching a stale or incorrect
    record and don''t want to wait until the TTL of that record expires. Using the
    ClearCache command doesn''t require you to restart the DNS service, the traditional
    method of clearing the cache.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 286 DNS For Dummies


    Clearing the DNS server''s cache using /ClearCache isn''t the same as clear-ing
    the DNS client''s cache using the ipconfig /flushdns command, as described in
    Chapter 6, in the section looking about resolvers and what they do for DNS. If
    a stale DNS record is in the server cache, you first need to run the DNSCMD /ClearCache
    command to clear the server cache then run the ipconfig /flushdns command on the
    workstation. The stale entry is removed from both systems and a new DNS request
    retrieves the correct-record.


    # /WriteBackFiles DNSCMD /WriteBackFiles


    This command writes any data that has changed and is stored in memory only when
    the appropriate zone files. /WriteBackFiles <zone name> command to write data
    for only a specific zone. When you make configuration changes or zone transfers,
    the data isn''t instantly written to the zone file. Using this command forces
    the data to be written to the files.


    # /StartScavenging DNSCMD /StartScavenging


    This command forces the scavenging process to begin on a DNS server on which scavenging
    is enabled. This command clears from the any records marked as stale by the aging
    process. Scavenging is typically a sched-ued event, but by using this command
    you can force the scavenging process to start at any time. This command is particularly
    useful if you''re experi-encing trouble with resolution and you suspect that the
    aged record is contribut-ing the issue.


    # /ResetListenAddresses DNSCMD /ResetListenAddresses


    Use this command to set the addresses on which the DNS server listens for DNS
    requests as shown by the DNSCMD /Info command. You can use the /ResetListenAddresses
    command in two ways:


    +   - Used with no input, it sets the server''s listen addresses to all configured
    IP addresses on the system.


    +   - Used in the following form, the listen addresses are set to those specified:

    DNSCMD /ResetListenAddresses <IP Address>'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Appendix A: Using the DNSCMD Utility 287


    You can specify many listen addresses as you want, separated by spaces, but they
    must be addresses configured on the system in the network configuration. They''re
    shown in the ServerAddresses section when using the DNSCMD /Info command.


    # /ResetForwarders


    DNSCMD /ResetForwarders


    This command configures the DNS servers used as forwarders for the current DNS
    server. Forwarders are used when the current DNS server cannot provide a response
    from its local database. If recursion is enabled, the forwarders are contacted
    and if they fail, the recursion process begins. Recursion is disabled, and if
    the forwarders cannot provide a response, the resolution process fails.


    If you use the DNSCMD /ResetForwarders command with additional parameters, the
    server is configured with forwarders. If the server has existing forwarders (as
    shown by DNSCMD /Info), they are removed. To add forwarders, use this command:


    ```

    DNSCMD /ResetForwarders <IP Address>

    ```


    The IP specified address can be either a single address or a group of addresses
    separated by spaces. You can use two options with the /ResetForwarders command:


    +   - /Slave: Indicates that the server is a slave.

    - /Timeout <value>: Sets the server''s timeout to something other than its default
    value of five seconds.


    # /Config


    ```

    DNSCMD /Config <zone name> <property> <value>

    ```


    One of the most powerful DNSCMD commands, the DNSCMD /Info command shows a number
    of configuration flags and values. You can set most of them by using the /Config
    command. The optional zone name is used for configuring zones, as discussed in
    the following section. You display a complete list of properties by typing the
    command DNSCMD /Config?, as shown in Figure A-9.


    As mentioned, the configuration changes made using the /Config command are reflected
    by the /Info command. You can view the results of the changes you have made by
    typing DNSCMD /Info. The value you specify for /Config can either be decimal or
    hexadecimal if you prefix it with 0x.'
  merge: -1
  img_proc: true
