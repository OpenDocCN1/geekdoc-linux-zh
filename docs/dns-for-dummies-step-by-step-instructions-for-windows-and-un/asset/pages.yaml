  md: '# Chapter 7: Installing a Microsoft DNS Server 133


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_152_0.png)


    Figure 7-37: Setting DNS forwarders for the server.


    You can enable forwarders by selecting the Use Forwarder check box. You can add
    forwarders to the list by specifying the IP address and clicking the Add button.
    When you need to, remove forwarders from the list by selecting the forwarder and
    clicking the Remove button. You can change the order of the forwarders by selecting
    a forwarder and clicking the Move Up and Move Down buttons. The closest or fastest
    server should be at the top of the list.


    The other option on the Forwarders tab is Operate as Slave Server. By default,
    this check box isn''t selected. If the forwarder doesn''t provide an appropriate
    response to the query, the local DNS server reverts to recursion. When the check
    box is selected and the forwarder fails, recursion isn''t attempted and no response
    is provided to the client.


    Getting started


    The Boot Method tab displays the boot method of the DNS server. The DNS server
    typically boots using the zone information in the system Registry. Although it''s
    rare, you can configure the server to boot from a BIND-style configuration file;
    if the server is configured in this manner, it''s displayed on the Boot Method
    tab.


    # Configuring zone properties


    To configure the properties for a specific zone, select the zone in the left pane
    and choose Properties from the DNS menu. The zone Properties dialog box opens
    to the General tab, as shown in Figure 7-38.'
