- pgno: 8
  md: '# About the Authors


    Blair Rampling is the Unix administrator at a mid-size resource company and is
    responsible for the administration of a number of Sun Solaris-based servers. His
    experience involves a wide array of systems, including Unix, Linux, and Microsoft
    Windows in both corporate and ISP environments.


    David Dalan (CCDA, CCNA, MCSE, and B.S, Washington State University) has been
    employed as the technical trainer and training manager for a leading international
    technical support services call-center firm. He has also held the positions of
    field engineer, network analyst, and technical support manager for the software
    division of one of the world''s largest publishers. He now enjoys working as a
    systems specialist for city government in his hometown. David''s career has been
    focused on the development of technical training, providing networking design
    and analysis services for a range of clients, from small private schools to enterprise
    businesses. He also operates his own consulting firm, concentrating on network
    design and implementation projects in addition to authoring several books, including
    co-authoring CCDA For Dummies, with Ron Glister (Wiley Publishing, Inc.).'
