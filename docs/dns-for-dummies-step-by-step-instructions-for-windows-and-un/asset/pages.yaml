- pgno: 106
  md: '# Chapter 6: Using the DNS Clients on Your System


    Try it yourself. Use NSLOOKUP to find the IP address for a Web site, and then
    type that IP address on the Address bar of Internet Explorer and press Enter.
    The Web site should load as though you had typed the DNS name of the site.


    This technique is the most basic way to use NSLOOKUP in batch mode. You can do
    much more with NSLOOKUP in batch mode, but doing more complex in interactive mode
    of NSLOOKUP is much easier.


    In batch mode, nslookup uses the same commands as in interactive mode (explained
    in the next section). You can see a list of the nslookup commands by first starting
    nslookup in interactive mode: Type nslookup at the prompt. From the nslookup prompt
    (>), press ? and press Enter.


    To use these commands, simply specify them with the command line in the format
    nslookup -options <domain><server>. The <server> option specifies the DNS server
    that will be queried. If omitted, the DNS servers configured on the system are
    used in their specified order. To see the MX records for a domain, for example,
    you use the command nslookup -type=mx dummies. It queries the default DNS server
    for the MX records for dummies.


    Not all the interactive mode nslookup commands can be used in batch mode. The
    set command, for example, is invalid because it is used to set the parameters
    with which nslookup runs in interactive mode.


    # Using NSLOOKUP in interactive mode


    To start NSLOOKUP in interactive mode, type NSLOOKUP at the command prompt. NSLOOKUP
    starts, as shown in Figure 6-6.


    ```

    C:\Windows\System32\cmd.exe - nslookup

    c>nslookup

    Default Server: dns1.domain.tld

    Address: 192.168.100.59

    ```


    Figure 6-6

    NSLOOKUP is now running in interactive mode.'
  merge: -1
  img_proc: true
