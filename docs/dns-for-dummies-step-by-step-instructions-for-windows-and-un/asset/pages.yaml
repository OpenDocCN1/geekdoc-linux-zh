- pgno: 299
  md: '# 280 DNS for Dummies


    Although the tools NSLOOKUP and DIG are useful, the DNSCMD command is far more
    powerful because it interfaces directly into the DNS server application instead
    of having to use the normal DNS request channels, like NSLOOKUP or DIG. In this
    section, we explore some command options you use when you use the DNSCMD command
    from within the command-prompt environment (a DOS window).


    # /Info


    The DNSCMD /Info command shows server information, as shown in Figure A-4. Much
    of the information is for the most meaningless to anyone who isn''t a Microsoft
    engineer or a true DNS guru, some of it is indeed useful to just about anyone
    who needs to work with the DNS server in query. Much of the information shown
    by using the /Info command is set in the DNS Properties dialog box when you right-click
    in the DNS snap-in and choose Properties.


    Starting from the Info section at the top of the results, you can see the server
    name followed by the server version, although the server version number doesn''t
    represent a standard version, as in Windows 2000. The OS container field represents
    the container in the Active Directory in which the DNS server resides if it''s
    part of an Active Directory implementation.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_299_0.png)


    > Figure A-4 The DNSCMD /Info command shows information about the server.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Appendix A: Using the DNSCMD Utility 281


    The next section, Configuration, shows information about the configuration of
    the DNS server, including logging and debugging levels in addition to retry and
    timeout information for recursion.


    In the section that displays configuration flag information, the output is some
    of the most interesting information revealed. It shows the settings managed by
    the DNS snap-in. You can view information such as whether recursion is allowed
    and whether DNS round robin is enabled. If you look through the list of flags
    in the Configuration Flags section and then look through the DNS server configuration
    with the snap-in, you see the correlation between the two tools.


    In the Aging configuration section, you see how aging and scavenging are configured
    on the server. The ServerAddresses item shows the IP addresses configured on the
    server, and the ListenAddresses option shows which IP addresses are configured
    to listen for DNS requests. If ListenAddress is set to NULL IP, as shown in Figure
    A-4, all addresses shown in the Server Addresses are used. The Forwarders section
    shows any servers configured on the Forwarders tab of the DNS server configuration
    and the forward timeout. Forwards and the forward timeout are used when a DNS
    query cannot be resolved locally.


    # /Statistics


    Part of the DNSCMD /Statistics output is shown in Figure A-5.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_300_0.png)


    ```

    C:\WINNT\System32\cmd.exe

