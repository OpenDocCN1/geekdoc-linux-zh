  md: "# 208 Part V: Security and Advanced DNS Tricks\n\nIf you want to allow zone\
    \ transfers to your known slave servers globally, replace none with the IP addresses\
    \ of those servers separated by semicolons:\n\n```\noptions {\n  allow-transfer\
    \ ( 192.168.1.2; 10.0.0.4 );\n}\n```\n\nNow that you have configured zone transfer\
    \ policies globally (although it isn't required), you can configure zone transfers\
    \ on a zone-by-zone base. In the BIND configuration file, under the zone statement\
    \ for the zone you intend to configure, you must add an allow-transfer substatement:\n\
    \n```\nzone \"sample.tld\" {\n  type master;\n  file \"sample.tld\"\n  allow-transfer\
    \ ( none );\n}\n```\n\nThis example disables all zone transfers for the zone.\
    \ You can add the addresses of the servers which are allowed zone transfers to\
    \ the allow-transfer substatement separated by semicolons:\n\n```\nzone \"sample.tld\"\
    \ {\n  type master;\n  file \"sample.tld\"\n  allow-transfer ( 192.168.1.2; 192.168.1.3\
    \ );\n}\n```\n\nYou can also allow zone transfers based on the TSIG key, as explained\
    \ in the preceding section. As long as the key is defined in a key section in\
    \ the configuration file, you can allow zone transfers to any server with the\
    \ appropriate key by specifying the key name this:\n\n```\nallow-transfer key\
    \ eng.domain.tld;\n```\n\nSome slave server setup is also required when using\
    \ TSIG for zone transfers. You must add the appropriate key statement to the configuration\
    \ file to define and specify the key and add a server statement:\n\n```\nserver\
    \ 192.168.100.2 {\n  keys ( eng.domain.tld );\n}\n```\n\nThe server statement\
    \ tells the slave server that whenever it contacts the specified server, it must\
    \ use the specified TSIG key.\n\n# Restricting interfaces\n\nAs with DNS on Windows,\
    \ you can also restrict the network interfaces on which BIND responds to queries.\
    \ You may want to do that on a multi-homed"
  merge: -1
