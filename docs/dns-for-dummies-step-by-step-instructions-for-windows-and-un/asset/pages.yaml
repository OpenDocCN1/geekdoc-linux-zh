- pgno: 49
  md: '# Whose Name Is It, Anyway?

    (Top-Level Domains )


    In the Internet namespace is a series of top-level domains (TLDs), such as .com,
    .net, .org, .mil, .us, and .ca. An important concept concerning DNS on the Internet
    is the highest level of the Internet hierarchy functions and who is responsible
    for it.


    The Internet DNS namespace is global, although in essence it''s controlled by
    a single organization: the Internet Corporation for Assigned Names and Numbers
    (ICANN). The nonprofit ICANN organization is responsible for controlling both
    the IP address space and the DNS namespace on the Internet. ICANN has a suborganization,
    the Domain Name Supporting Organization (DNSO), which is the specific group responsible
    for the Internet namespace. Within DNS are a number of constituency groups, each
    representing a group with a stake in the namespace, such as ISPs, businesses,
    and name registrars.


    ICANN is responsible for the maintenance of the list of root name servers, the
    first and most important part of the DNS namespace. Root name servers are responsible
    for the root of the namespace (the area above the top-level domains). The root
    name servers are distributed across the world (theoretically) and are responsible
    for the first step in name resolution. The root name servers are maintained individually
    by specific organizations. A DNS query sent to a caching DNS server first queries
    a root server to determine which server hosts the TLD of the name in the request.


    Thirteen root name servers exist, as shown in the following list. This list changes
    from time to time, although not often:


    +   - a.root-servers.net: Network Solutions Inc., Herndon, Virginia

    - b.root-servers.net: USC-I5, Marina del Rey, California

    - c.root-servers.net: PSNet, Herndon, Virginia

    - d.root-servers.net: University of Maryland, College Park, MD

    - e.root-servers.net: NASA, Mountain View, California

    - f.root-servers.net: Internet Software Consortium, Palo Alto, California

    - g.root-servers.net: Defense Information Systems Agency, Vienna, Virginia

    - h.root-servers.net: Army Research Library, Aberdeen, Maryland

    - i.root-servers.net: NORDunet, Stockholm, Sweden

    - j.root-servers.net: Network Solutions, Inc., Herndon, Virginia'
