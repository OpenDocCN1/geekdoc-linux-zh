- pgno: 228
  md: "# Chapter 11: An Antidote for a Poisoned Cache: DNS Security\n\nsystem, which\
    \ is one with more than one network connection. You may not want to provide DNS\
    \ service to an external network, or you may want to provide different DNS services\
    \ to different subnets.\n\nWith BIND on Unix, you can bind the DNS server to one\
    \ IP address and start another instance of BIND running on another IP address.\
    \ Each instance of the DNS server can use a different database. This strategy\
    \ allows you to have more than one virtual DNS server running on a single server,\
    \ which is useful if you have a small network and want to have different DNS databases\
    \ for internal and external clients. Running multiple instances of BIND on one\
    \ system is as simple as starting the first instance of BIND with the command\
    \ named -c <configFile> and the second instance with the command named -c <configFile2>.\
    \ You have to ensure that each instance of BIND is configured to listen on a unique\
    \ IP address; otherwise, they don't start.\n\nTo configure your DNS server to\
    \ listen on only specific interfaces, you need to add a listen-on statement to\
    \ the configuration file. This statement resides in the options section of the\
    \ configuration file because it's a global option for the DNS server. The listen-on\
    \ statement requires an IP or list of addresses:\n\n```\noptions {\n  listen-on\
    \ ( 192.168.100.2; 10.0.0.2 );\n}\n```\n\nIn restricting the interfaces on which\
    \ BIND provides service, you can restrict the IP addresses that are allowed to\
    \ query the server or specific zones. This process is as simple as adding an allow-query\
    \ statement in the options statement, as just shown. This example restricts hosts\
    \ that can query all zones to those within the 192.168.100.0 subnet: \n\n```\n\
    options {\n  allow-query ( 192.168.100/24 );\n}\n```\n\nThe IP addresses in the\
    \ allow-query statement can be specified in network address/mask format, as shown,\
    \ or as individual addresses. Multiple addresses or networks are separated by\
    \ semicolons. Zone-specific transfer statements override the global settings.\
    \ A value of any can be assigned to the allow-query statement in a zone to allow\
    \ anyone to query the zone if a global restriction is in place. The allow-query\
    \ statement is added to the zone statement in the BIND configuration file like\
    \ this:\n\n```\nzone \"sample.tld\" {\n  type: master;\n  file \"sample.tld\"\
    ;\n  allow-query ( 192.168.100/24; 10.0.0.5 );\n}\n```\n\n![](img/ef3dfe2cb04fcef67ad22a0599c29f36_228_0.png)"
  merge: -1
