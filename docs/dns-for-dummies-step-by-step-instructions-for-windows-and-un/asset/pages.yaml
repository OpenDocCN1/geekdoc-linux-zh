    \    # End of named.conf\nzone \"sample.tld\" {\n        type master;\n      \
    \  file \"sample.tld\";\n}\nroot@root# #\n```\n\nFigure 8-14:\nFor a new\nlook,\
    \ make\na few changes.\n\n# RNDC Isn't a Rap Group\n\nThe rndc utility has many\
    \ useful commands. The most common (especially considering the scenario presented\
    \ in the preceding section) is the reload option. Running the command rndc reload,\
    \ as shown in Figure 8-15, causes BIND to reload its configuration file and all\
    \ zone files. Ideally, the rndc reload command should show no output, as shown\
    \ in the figure. If any errors occur, however, they appear in the output.\n\n\
    Figure 8-15:\nThis\ncommand\ncauses\nBIND to\nreload all\nconfig-\nration\nand\
    \ zone\nfiles and\nproduces\nno output.\n\n```\nroot@root# rndc reload\nroot@root#\
    \ #\n```\n\nAnother way of using rndc was introduced in more recent versions of\
    \ BIND 9.x. You can now make changes to a zone file and reload only that zone."
  merge: -1
