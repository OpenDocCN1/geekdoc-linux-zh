    # Reverse zone WINS integration


    WINS integration for reverse zone lookups is somewhat of a misnomer. Rather than
    use the WINS servers for reverse lookups, which isn''t possible because WINS doesn''t
    maintain IP address information, the DNS server sends a "node adapter status request"
    to the IP address being queried. The system provides its host name to the DNS
    server. The DNS server appends the domain name to the host and returns the response
    to the client.


    To configure WINS lookups on a reverse zone, select the zone in the left pane
    of the DNS snap-in and choose Properties from the Action menu. The WINS-R tab
    from the Properties dialog box, as shown in Figure 12-10.


    You must first enable reverse WINS integration by using the WINS-R lookup check
    box. As with a forward zone, you must select the Do not replicate this record
    check box if you''re using slave servers for this zone DNS servers other than
    Microsoft Windows 2000 or later.


    You must also specify a domain name in the Domain to append to returned name box.
    This domain is appended to the host name returned by the WINS-R lookup, and the
    complete name (host plus domain) is returned to the requesting client.'
