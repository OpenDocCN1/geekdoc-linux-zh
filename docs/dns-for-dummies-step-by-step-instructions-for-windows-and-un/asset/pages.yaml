  md: '# Chapter 12: What Else Can DNS Do? 23


    # Forward zone WINS integration


    To enable WINS integration, you must add a WINS record to the DNS zone to be integrated.
    After the record is added, queries that fail in this zone fall back to WINS. The
    record is added from the DNS snap-in by choosing Start>Programs>Administrative
    Tools. Locate and select the zone to which the WINS record will be added. Choose
    Properties from the Action menu and click the WINS tab, as shown in Figure 12-7.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_252_0.png)


    Figure 12-7: Adding a WINS record to the zone for WINS integration.


    To enable WINS integration, follow these steps:


    +   1. Enable the WINS forward lookup check box.

    2. Enter the IP address of each of your WINS servers in the IP Address box.

    3. Click the Add button.


    You can control the order of the WINS servers by selecting a server in the list
    and using the up- and down-arrow buttons. The closest WINS server (preferably
    on the local network) should be at the top of the list. Servers can be removed
    by selecting them from the list and clicking Remove.


    The WINS resource record (RR) type is specific to Microsoft Windows DNS. If you''re
    using any other DNS applications as slave servers for this zone, make sure that
    you check the Do not replicate this record box. If you don''t, zone transfers
    will fail because the WINS record is invalid over the other servers.


    From this, you can also set the TTL for the WINS record. The TTL informs clients
    and servers that retrieve this record how long to keep it in their cache.'
