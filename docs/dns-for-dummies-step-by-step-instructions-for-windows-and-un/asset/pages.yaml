    # Using Multiple MX Records


    You can have more than one MX exchanger for a domain. You would want to have multiple
    MX changers for two reasons: to balance a high load of incoming mail across multiple
    mail servers and to provide a backup mail server in case one of the mail servers
    goes "belly up." Each scenario using MX records is implemented slightly differently.


    The details of how to configure multiple mail servers to receive mail for the
    same domain, for either load balancing or backup, is complex and not described
    in this book. Consult the documentation for your mail server if you want to implement
    one of these configurations.


    For load balancing, you can create multiple MX records with the same priority
    values. Figure 4-4 shows an example in Windows DNS of a configuration with three
    mail servers with equal priorities. The mail traffic will be split between these
    three servers.


    In BIND, the procedure is the same. You add multiple MX records to your zone file
    like this:


    ```

    IN MX 10 mail1

    IN MX 10 mail2

    IN MX 10 mail3

    ```'
