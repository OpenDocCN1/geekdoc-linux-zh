- pgno: 263
  md: '# 244 Part V: Security and Advanced DNS Tricks


    zone isn’t loaded, although the rest of the server continues to run properly.
    Luckily, BIND has excellent logging that makes troubleshooting this kind of issue
    quite easy.


    As with Windows, the first place to look when troubleshooting BIND is in the log
    files. The log files in BIND are configurable, though, they may not always be
    in the expected location. Check your BIND configuration file for a logging directive.
    If this directive is present, it specifies the location of log files for the server.
    If the directive is not present, log entries are written to the syslog daemon,
    as is the default.


    Most Unix and Linux systems run a daemon (that’s a background process, a creature
    from the underworld) named syslog. The only job of syslog is to accept log entries
    from other applications and write them to a log file. Some implementations of
    syslog are quite flexible and allow you to separate log entries into different
    files depending on your source. In cases, all log entries are written to a common
    file.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_263_0.png)


    To view the log, you must first know its location. In Linux, the log created by
    syslog is at /var/log/messages; in Solaris, it is at /var/adm/messages. This location
    varies depending on the type of Unix system you’re running, so consult the documentation
    for your system. When you have located the log, you can use a few useful utilities
    to view it, such as more, tail, and grep; these standard Unix utilities are on
    virtually every system in some form or another:


    +   - more: Lets you view a file one page at a time starting from the beginning.
    This utility is useful if you want to browse through the entire file.

    - tail: Lets you view the lines at the end of the file. By default, tail usually
    shows the last ten lines of a file, although you can instruct tail to show as
    many lines as you want.

    - grep: Searches for patterns in a file. You can use grep to search for the term
    named in your log file, and see only DNS-server related entries.


    From a shell system, change to the directory where your log files are located,
    typically /var/log/ by default. Type the command more messages, replacing messages
    with the name of your log file if it’s different. To more, press Enter to move
    one line through the file and press the Spacebar to move down an entire page.
    Figure 13-8 shows an example of the more command used to view the log file on
    a Linux running BIND.


    In the log file, you’re looking for entries logged by BIND. These entries begin
    with named, which is the name of the daemon that logged them. In this figure,
    you can see a number of log entries from named, although they’re purely informational.'
  merge: -1
  img_proc: true
