- pgno: 84
  md: '# # Chapter 5


    # # Configuring a DNS Client


    **In This Chapter**


    +   * Determining your DNS client settings

    * Configuring a Windows DNS client

    * Configuring a Unix DNS client


    A computer that uses the services of another device on the network is known as
    a client. Almost all network-connected computers (including such items as desktops
    or laptops, network printers, routers, and switches) are clients. Strangely enough,
    even servers are clients. A computer is rarely so specialized that it''s a server
    and nothing else. For example, the administrator responsible for a server may
    log on to that server and download a software patch or update. The server then
    becomes a client making use of other network resources — in this case, another
    server that houses the necessary files. This chapter looks at computers that are
    domain name clients.


    Computers that must have a mean of resolving DNS names need to have their client
    components configured. The DNS client is responsible for retrieving from a DNS
    server the associated IP address for any DNS name you enter (in a Web browser,
    for example). Because the DNS server is used to perform this name translation,
    you must specify the IP address (or addresses) of the DNS server (or servers).


    This chapter describes the methods for configuring DNS clients in both the Windows
    and Linux environments. Although the purpose of each client is the same and they
    do essentially perform the same tasks, the configuration steps are as different
    as night and day.


    # # Making the Server Connection


    You need to have a few things handy before you delve into the DNS configuration
    of your computer. First and foremost, you need to have the IP addresses for the
    DNS servers available to you. Your Internet Service Provider (ISP) or system administrator
    provides them, or you have them yourself if you have your own DNS servers. With
    most operating systems, you can have as many'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'DNS servers configured on the client system as you want. Windows 2000, Windows
    XP, Linux, and many other operating systems can accept any number of DNS IP addresses.
    Some earlier systems, such as Windows 95, can accept only two or three simultaneous
    DNS server entries.


    If possible, you should always use more than one DNS server for your client configuration
    (or configurations). As the old saying goes, two is better than one. Having two
    or more servers in your client configuration reduces the possibility of an outage
    because the only specified server is unavailable. If you have only one DNS server
    on your network, you can specify, for example, a DNS server from your ISP to be
    second in your list so it''s used only if your server is unavailable. In most
    cases, each server specified in the client configuration is connected in order
    (the first server in the list is contacted first). Each successive server is tried
    if the one cannot be contacted.


    If only one DNS server is available and you want to use more than one server defined
    in case (one goes down), you can add publicly available DNS servers to your configuration.
    Sometimes, finding these servers is a matter of looking through search engines
    for a public DNS server. For example, the Open Root Confederation provides several
    public-access DNS servers. You can find the list of servers at support.open-rsc.org//


    You should have a list of DNS server IP addresses. It''s the first piece of required
    information. The next bits of information aren''t normally mandatory, but configuring
    them makes life easier for users. The DNS suffix is a good configuration setting
    to use because it allows you to specify hosts in your local domain without fully
    qualifying them, but search domains are needed only in some cases. If more than
    one domain is under your control, you may have a number of search domains to specify.


    When a computer is in a DNS domain, it normally has a DNS suffix. This suffix
    is the DNS name of the system, not including the host name. domain.tld example
    is the DNS suffix. In many cases, the computer doesn''t know what its DNS suffix
    is because it is entered by the user and isn''t required for DNS function. The
    only situations in which this statement isn''t true is in a Windows 2000 or Windows
    XP domain using Active Directory with DNS. The DNS suffix is automatically assigned.


    Suppose that you''re doing something basic with DNS, such as pinging another computer.
    You can use the ping command; pinghost.domain.tld, for example. If the computer
    from which you''re running the command is a member of the domain.tld domain, this
    command may be more than needed. You would expect, because both hosts are on the
    same domain, that you wouldn''t need to type the entire host and domain name (also
    known as the Fully Qualified Domain Name, or FQDN) for the computer. By specifying
    a DNS suffix in your client configuration (domain.tld,


