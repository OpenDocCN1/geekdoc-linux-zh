    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_46_0.png)


    The DNS namespace-planning method is used when a large number of hosts are in
    one location. Subdomains are created based on the business purpose of the system
    function, in this case. The business purpose divides subdomains into the area
    of the business they serve, including such subdomains as accounting.domain.tld
    or acct.domain.tld and engineering.domain.tld or eng.domain.tld. Dividing subdomains
    based on their business purpose is most useful in a traditional corporate environment
    where unit boundaries are clearly defined.


    Segregation based on system function is a little more complex in that''s harder
    to determine which subdomains you require. Dividing up systems based on system
    function is most useful in environments such as application development, where
    systems have a specific function. In this case, different subdomains are used
    for development systems (dev.domain.tld), staging or testing systems (test.domain.tld),
    and production systems (prod.domain.tld or just domain.tld).


    In addition to these divisions being used individually, they can be combined.
    For example, you use geographical locations as the highest-level subdomain (where
    they fit logically), such as sea.domain.tld and van.domain.tld, and have below
    them that subdomains based on system function. This arrangement results in subdomains
    as dev.sea.domain.tld and prod.van.domain.tld, as shown in Figure 2-3.'
