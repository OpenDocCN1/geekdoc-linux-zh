  md: '# # DNS For Dummies


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_2_0.png)


    # Top-Level Domains


    This list describes some of the more common top-level domains (TLDs), what they
    do, and whether they are unrestricted or restricted. Anyone can register a domain
    in an unrestricted TLD, but not in a restricted TLD.


    +   - com Commercial, for-profit entities (unrestricted)

    - .net Network providers, such as ISPs and telecoms (unrestricted)

    - .org Nonprofit organizations and entities (unrestricted)

    - .edu Educational institutions (restricted)

    - .gov U.S. government organizations (restricted)

    - .mil U.S. military (restricted)

    - .xx Country domains, where xx is the ISO-standard two-letter designation for
    the country. Some are restricted and some are not. The following four entries
    examples:

    - .ca Canada

    - .uk United Kingdom of Great Britain

    - .au Australia

    - .jp Japan


    # DNS Record Types


    +   * Start of Authority (SOA): The SOA record defines the zone as authoritative
    for the domain. The record contains TTL values and the master name server for
    the zone as well as a serial number.

    * Name Server (NS): An NS record is added for each name server, master or slave,
    that is authoritative for the domain.

    * Mailchanger (MX): MX records are used to direct e-mail to the correct mail server
    for the domain.

    * Host (A): An A record maps a name to an IP address.

    * IPv6 Host (AAAA): An A record maps to an IPv6 address rather than an IPv4 address.

    * Canonical Name (CNAME): A CNAME record is used to alias one name to another
    DNS name rather than to an IP address.

    * Pointer (PTR): PTR records are used to map IP addresses to DNS names rather
    than the other way around, as in A record.

    * Text (TXT): A TXT record is used to contain any information and is used for
    informational reason than technical purposes.

    * Service Locator (SRV): The SRV record is designed to allow DNS clients to find
    specific services rather than specific hosts on the network. This type of record
    is a key component of Microsoft Active


