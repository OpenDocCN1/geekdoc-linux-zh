    # Making Use of Unix


    Configuring DNS zones and records in Windows is a point-and-click process. Configuring
    zones and records in BIND, however, requires the manual customization of the BIND
    configuration file and the zone files themselves. Three parties have created tools
    specifically to add a graphical interface to the process, although most changes
    are still made by hand, editing the files (Appendix B describes one of these graphical
    interfaces — Webmin.)


    # Forward-looking Unix


    Creating a forward lookup zone on BIND involves two steps: editing the BIND configuration
    file and creating the zone file. The BIND configuration file is typically located
    at /etc/named.conf. Open this file in your text editor of choice. You should find
    the file there, and it should look something like this:'
