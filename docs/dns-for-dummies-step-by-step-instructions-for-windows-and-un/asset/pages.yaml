    The next step in planning your Active Directory DNS namespace is to plan your
    Active Directory infrastructure. The structure of the namespace is designed around
    the structure of AD, and each AD domain is also a DNS domain. A simple AD implementation
    with one AD domain, therefore, will have a single DNS domain. Domains (AD and
    DNS) should be separated along geographical or logical boundaries. Also, internal
    and external systems should be separated into separate DNS domains, and internal
    and external DNS hosting should be separated on different servers. The separation
    of the internal and external resources is primarily a security issue, and is also
    a matter of organizing resources into logical — groups. Although DNS arrangements
    are a component of good network security, DNS isn''t effective as the sole method
