  md: '# 22 Part I: How DNS Makes the Internet Go ''Round''


    is a pyramid. At the top of the "tree" (the point of the pyramid) is the root
    of the namespace. The root, which is absolutely the highest level in the name-space,
    is used as the starting point for locating subdomains, and ultimately hosts, within
    the namespace. For example, in myhost.myserver.com, is the namespace and "" (a
    null character) is the root.


    Take a step back and make sure that you have some of the necessary background
    before we begin a detailed description of namespaces. At this point, you need
    to examine domain names before you delve into how they''re arranged. After we
    have described domain names, you can revisit the idea of DNS namespace.


    A domain in DNS isn''t the same as a domain in Microsoft Windows NT. Although
    a domain in DNS refers to a group of systems in a segment of the DNS namespace,
    a Windows domain is a group of systems that share authenication information provided
    by domain controllers. Even more confusing, in Windows 2000 and later, both DNS
    domains and Windows domains are used, making it even more difficult to keep them
    straight.


    # Playing the Domain Name Game


    A domain name links a user-friendly name (such as www.microsoft.com) to a computer''s
    network address information (IP address 207.46.197.113, in this case). Because
    somewhat logical names have more meaning than semantic numbers (except for extra-nerdy
    folks), this system adds a great deal of "use of" for general users. A fully qualified
    domain name (FQDN) consists of a number of parts and refers to a domain name specified
    in absolute terms rather than relative to another domain.


    The following example shows a fully qualified domain name. In this case, the host
    is a Web server (denoted with the www label) and the domain is microsoft.com.


    www.microsoft.com


    A domain name''s parts are separated by (not surprisingly) a separator, which
    is a period.


    You can see how this domain name, if you look at it from right to left, fits into
    the tree discussed in the preceding section. The highest level in the tree is
    the top-level domain, .com. As you move to the left, the name becomes more specific:
    .microsoft specifies the child domain within .com. Finally, the www indicates
    the specific host within that domain.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 2: DNS Namespaces 23


    If you''re being picky, the domain www.microsoft.com isn''t true fully qualified
    domain name. Using the strictest definition (which isn''t needed with all DNS
    server configurations), a fully qualified domain name must have a trailing separator
    (a period), as in this example:


    www.microsoft.com.


    This trailing period is used to separate the top-level domain, .com, from the
    root of the namespace, which is identified by a null (blank) character. This nomenclature
    is obviously not used on a regular basis, though.


    # Back Off — You''re in My DNS Namespace!


    As noted earlier in this chapter, the DNS namespace used on the Internet is a
    hierarchical inverted tree. Although this term may seem complex, the namespace
    is quite simple. At the top of the tree, as shown in Figure 2-1, the root of the
    namespace. Notice that the root is represented by a null character. Although this
    null character isn''t usually used (such as when you enter a URL into a Web browser),
    its presence is assumed by any application following the DNS specification.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_42_0.png)


    Figure 2-1: The Internet DNS namespace.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 24 Part I: How DNS Makes the Internet Go ''Round''


    The next level below the root always contains the relevant top-level domains (TLDs),
    including the common TLDs (COM, NET, and GOV, for example) in addition to country
    TLDs (UK, for example). The term top-level domains refers to the domains directly
    below the root of the namespace. Although the Internet namespace allows only certain
    TLDs, if you''re running a private namespace that will never be publicly connected
    to the Internet, you can use any TLDs you want. Top-level domains aren''t controlled
    by users but rather by domain registrars. We describe registrars in more detail
    later in this chapter, in the sidebar "Becoming master of your own domain" and
    the section "Whose Name Is It, Anyway? (Top-Level Domains)".


    Below the top level is the beginning of the actual domain. An example of a domain
    on this level is microsoft.com. The domains at this level can be subdivided (the
    branches of the inverted tree to develop), and multiple domains can be defined;
    for example, domains such as windows.microsoft.com, 95.windows.microsoft.com,
    and windows.operatingsystems.software.microsoft.com. These domains are typically
    referred to, not surprisingly, as subdomains. A tree can have a maximum of 128
    levels. In these examples (counting the root level), 5 levels are in the first
    two examples, and 6 levels are in .operating.software.microsoft.com. You''re unlikely,
    however, to have 127 levels of domains under any parent. The user-friendly nature
    of domain names begins to fade as more levels are added, because IP addresses
    (192.168.1.25, for example) are almost as memorable as long DNS names, such as
    (and this is one pure fiction) xlibs.hvacinf.pomeroy.wa.us.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_43_0.png)


    When designing your namespace (later) or working with several of the other aspects
    of DNS configuration, keep in mind the KISS principle: Keep It Simple. Stupid.
    If you reduce the complexity of your naming conventions (keeping things simple),
    users spend less time thinking about the DNS name and more time getting to whatever
    resources they need. After all, the user isn''t the one who needs to focus on
    DNS — that''s your job!


    Every entry in a single level of branch of the DNS namespace must be unique. For
    example, all top-level domains must be unique, and all domains .com must be unique.
    This restriction is effective on only a single level of the hierarchy and only
    within the current branch. You can have microsoft.com and microsoft.net, for example,
    and you can also have microsoft.com and microsoft.windows.com. You cannot, have
    microsoft.com and add another domain named under .com.


    Within domains and subdomains exist nodes, or hosts. Hosts are the lowest level
    in the hierarchy and define systems such as the Web or FTP server. A host is typically
    defined in DNS using an A (host) record, which assigns an IP address to the host''s
    name. For example, an A record for www.microsoft.com would contain the host name
    www and the IP address of the server. Although a domain normally contains hosts,
    no rule exists against a domain'
