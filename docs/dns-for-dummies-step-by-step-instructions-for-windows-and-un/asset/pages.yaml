  md: '# Chapter 2: DNS Namespaces


    # Who maintains the IP address allocation?


    Because the TLDs are maintained by ICANN, you may be wondering who maintains the
    allocation of IP addresses. You may know, each IP address on the Internet must
    be unique. Some authority must ensure that no IP address is assigned. This authority
    is the Internet Assigned Numbers Authority (IANA), a nonprofit organization responsible
    for assigning IP address space and maintaining the information for protocols used
    on the Internet.


    backbone. The Internet backbone, composed of the main links that carry Internet
    traffic from major ISP to major ISP, contains several routers known as core routers.
    Not all Internet traffic passes through these core routers, they''re responsible
    for maintaining the routing infrastructure of the Internet and ensuring that all
    traffic gets to its destination, using the routing protocol Border Gateway Protocol,
    or BGP. All routers communicate with other Internet routers.


    IANA, the top-level authority for assigning addresses, delegates that authority
    to other organizations for specific regions, including Réseaux Europens (RIPE)
    in Europe and the American Registry for Internet Numbers (ARIN) in North America.


    The reason that IP addresses are assigned to ISPs in blocks? Rather than have
    a route to reach each IP address on the Internet, the core have only a few routes
    (relative to the total number of IP addresses). aggregation, the routers will
    have a route to the entire block of IP addresses that reside at one ISP. If the
    core receives a request for an address in one of these blocks, the requester is
    forwarded to the ISP''s router rather than directly to the address. The ISP''s
    router can then route the data to its final destination. This hierarchical layout
    is similar to the one used by DNS servers on the Internet.


    Even though these organizations are responsible for assigning IPs, you cannot
    simply ask for an address and have it assigned. The organizations assign IP addresses
    in blocks to Internet Service Providers (ISPs). If you need an IP address, you
    must have it assigned by an ISP. The reason that IP addresses are assigned in
    blocks to ISPs is to ease the administration of the Internet


    +   - k.root-servers.net: Réseaux IP Europeens, London, UK

    - l.root-servers.net: ICANN, Marina del Rey, California

    - m.root-servers.net: WIDE Tokyo, Japan


    As you can see, the root servers are geographically dispersed as they could be.
    There''s no specific reason that the majority of root servers are in the United
    States, but a number of factors may be responsible, such as the development of
    the Internet in the United States and the control of U.-based ICANN in the DNS
    namespace.


    Below the root of the namespace are the top-level domains. The TLDs are controlled
    by a variety of different registrars who are responsible for the registration
    of DNS names under their respective TLD. Two broad types of TLDs exist: generic,
    or gTLD, and country code, or ccTLD. In addition, gTLDs contain a subgroup: restricted
    gTLDs'
