  md: '# # Appendix B: Using Webmin for BIND Administration 311


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_330_0.png)


    **Figure B-16:** Configuring advanced global options for the server.


    Using the next feature, Control Interface Options, you can determine who can control
    the server.


    Controls are one area in which Webmin cannot support BIND 9. The BIND 9 controls
    are based on RNDC controls, and the BIND 8 controls are based on NDC and IP addresses.
    You should use the Control Interface Options page to configure controls in BIND
    9 until the module is updated to support BIND 9.


    The DNS Keys page allows you to add, modify, and remove keys from the server.
    As shown in Figure B-17, you can add a key by specifying the key name, hash algorithm,
    and key value. These keys are used for zone transfer and dynamic update authentication
    and for controls in BIND 9.


    Zone Defaults, as shown in Figure B-18, is the last configuration page in Webmin.
    You use it to set the default settings for zone files created with Webmin. Every
    zone file you create using the new zone features described in the following section
    are assigned these values by default. The settings include default values for
    items such as the SOA record, one of the most interesting features is the Template
    records section. By using this section, you can set a series of template records
    that are added to each zone as it''s created. For example, some uses are the creation
    of a www or mail record in each domain. When you leave the value field set to
    Form, you''re prompted to specify the values for the records when the zone is
    created.'
