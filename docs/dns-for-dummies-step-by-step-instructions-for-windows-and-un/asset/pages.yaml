- pgno: 336
  md: '# Appendix C


    # Other DNS Server Applications


    In This Chapter


    +   - DNS server applications for Windows

    - DNS server applications for Unix


    In DNS For Dummies, we provide thorough coverage of the main DNS server applications
    for both Microsoft Windows and Unix. The vast majority of Windows servers run
    the Microsoft DNS Server service, and, similarly, the vast majority of Unix DNS
    servers run some version of BIND (although this book covers BIND 9, the latest
    version). Aside being associated with the various operating system products, these
    DNS applications are available for free, after you have the appropriate operating
    system.


    We would be remiss, however, if we didn''t inform you that a number of other DNS
    servers are available for both Windows and Unix. This appendix gives a brief overview
    of some of the more common servers.


    # Windows-Based DNS Servers


    Although most Windows-based DNS servers use the DNS Server service, included for
    free with all versions of the Windows server operating systems, several DNS server
    applications are available. They usually offer an advantage of speed, additional
    functionality, or security, but the advantage, again, is usually in one area,
    and functionality is sacrificed in others. For example, some third-party DNS servers
    for Windows may be more secure, although often they''re less configurable or lack
    the ability to perform at the level available with the Windows DNS server. In
    some cases, though, using a third-party DNS server may be useful in your environment.
    Regardless, not a large number of Windows-based DNS server applications are available,
    for a few reasons — primarily that Windows isn''t commonly used as a DNS server
    platform and the DNS Server service typically provides enough functionality and
    performance for applications in which Windows is used as a DNS server platform.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# 318 DNS For Dummies


    # Get ''em in a BIND


    Although we cover BIND Version 9 on Unix in this book, BIND is also available
    for Windows — and is free. You can download BIND from the Internet Software Consortium
    (ISC) Web site (www.isc.org) in a compiled binary format for Windows. The Windows
    version provides functionality identical to that of the Unix version.


    As we tell you a little earlier in this appendix, BIND on Windows functions identically
    to the Unix version. BIND uses the same named.conf file and zone files for configuration
    and even uses the RNDC command to control the server (refer to Chapter 8). Also
    included with the Windows version of BIND are the same utilities that are in the
    Unix version, such as DIG and NSLOOKUP, in addition to the RNOC and DNSSEC utilities
    for managing security keys. All this combines to make the Windows version of BIND
    a great option for a user who needs to integrate a Windows DNS server into an
    existing Unix environment. Although some people may snicker at the notion of a
    Windows DNS server being used where Unix-based systems are available, Windows
    DNS Server can serve as a low-cost DNS server on an intranet environment if the
    Windows server is present and available for use.


    # Incognito DNS Commander


    Incognito Software (www.incognito.com) makes the feature-rich DNS Commander, which
    provides both a DNS server back end so that the DNS service is not required, and
    a rich, graphical front-end interface that makes administration, especially of
    large sites, Incognito also says that DNS Commander is secure and provides high
    performance. DNS Commander is a good choice if you host a large number of zones
    on a Windows DNS server.


    # Simple DNS Plus: Keep it simple and then some


    Simple DNS Plus (www.jhsoft.com) is a fairly basic DNS server application for
    Windows. It doesn''t have a feature-rich GUI, but it''s meant for smaller DNS
    implementations that host only a few zones or are used for caching DNS. Simple
    DNS Plus is a good choice for a small-office or home implementation of DNS on
    a Windows system, especially if you want to host your own Web site. Simple DNS
    Plus even supports Active Directory. In addition, Simple DNS'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Appendix C: Other DNS Server Applications 319


    Plus can run on Windows 9x and Windows NT, Window 2000, and Windows XP workstation
    systems on which the Microsoft DNS server service isn''t supported.


    # Unix DNS Server Applications


    The choices for a DNS server application under a Unix operating system are much
    more varied than under Windows. Unix-based DNS servers are much more common than
    Windows-based servers because most DNS servers are run by ISPs that commonly use
    Unix as a platform for most applications. Unix-based DNS servers vary from stripped-down,
    high-speed applications to feature-rich applications mean large DNS implementations.


    # TinyDNS (djdbns)


    TinyDNS (www.tinydns.org, cr.yp.to/djdbns.html), also referred to as djdbns, is
    a basic DNS server written by D. J. Bernstein. The Unix mail-transfer agent qmail.
    The qmail mail application is well-known for its incredible speed and high security,
    and djdbns was written under the same premise. Because of the way these programs
    were written, you are unlikely to find a security flaw in them. djdbns was essentially
    written in response to the large number of security flaws in earlier versions
    of the BIND DNS server.


    TinyDNS is fairly simple to install if you are familiar with how to compile software
    in Unix. Download the source code from the TinyDNS Web site and use the make command
    to compile the software in accordance with the installation directions. TinyDNS
    is configured with the included configuration utilities. TinyDNS doesn''t have
    a large number of features by default, but you can use patches to add to TinyDNS
    most of the features available for other DNS servers. Although this strategy may
    result in a relatively large amount of work, the result is a lean, fast, and secure
    DNS server, as opposed to the monolithic design of BIND, in which everything is
    included.


    # Incognito DNS Commander


    Incognito DNS Commander (www.incognito.com), also listed earlier in this appendix,
    in the section "Windows-Based DNS Servers," is also available for Linux and Sun
    Solaris. Incognito DNS Commander has a number of advantages over the other DNS
    server applications available for Unix — primarily, its graphical'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# 320 DNS For Dummies


    interface. The main type of environment in which this functionality is useful
    is at a large ISP where the maintenance of BIND or the TinyDNS configuration is
    arduous because of the large number of zones or records. Many companies build
    their own Web-based interfaces to the BIND configuration files using such scripting
    tools as Perl. DNS Commander, however, provides this functionality out of the
    box, although it comes at a price. In addition, Incognito claims to be faster
    and more secure than BIND.'
  merge: -1
  img_proc: true
