  md: '# Part V: Security and Advanced DNS Tricks


    is the refresh interval, which defines the maximum period a host has to refresh
    its DNS record timestamp. If it fails to do so before this interval expires, the
    record is marked as eligible for scavenging. After you click OK to close the Zone
    Aging/Scavenging Properties dialog box and click OK to close the Zone Properties
    box, the changes are saved.


    To understand how the aging interval works, an example is in order. After a specific
    record is added or its timestamp is refreshed, the timestamp cannot be refreshed
    again for the amount of time defined by the no-refresh interval. If the no-refresh
    interval expires, the record can be refreshed. If the record isn''t refreshed
    in the amount of time defined by the no-refresh interval after the no-refresh
    interval expires, the record can be scavenged. If both intervals are set to 7
    days as the default, the record can be refreshed 7 days after the last refresh.
    If it has not been refreshed after 14 days, it can be scavenged.


