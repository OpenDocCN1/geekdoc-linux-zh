    # Zoned out


    Zone files are the second (and seriously important) configuration files required
    for the operation of BIND. A zone file is required for each master zone defined
    in the BIND configuration file. Slave zone files are created automatically through
    the zone-transfer process (refer to Chapter 3).


    Zone files are fairly basic to work with, but can be tricky. The easiest way to
    find out about them is to look at a sample file and break it down from:


    ```

    $TTTL 86400

    @ IN SOA dns1.sample.tld. hostmaster.sample.tld. (

    2001062501 : Serial Number

    21600 : Refresh time

    3600 : Retry time

    604800 : Expire time

    86400 : Minimum TTL

    )

    nIN NS dns1.sample.tld.

    IN NS dns2.sample.tld.

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Chapter 8: Unix Domain Servers


    | IN | MX | 10 | mail.sample.tld. |

    | | | A | 10.0.1.5 |

    | WWW | | A | 10.0.1.5 |


    Check out this helpful list:


    +   - **Zone TTL**: $86400, is used to set the time-to-live (TTL) value for the
    zone. This value controls the amount of time (in seconds) for which the zone is
    cached in other DNS servers and clients.

    - **SOA record**: Following the TTL value (known as a directive) is the SOA, or
    start of authority. It''s in place because the DNS server is authoritative for
    the domain. The SOA record defines certain characteristics of the zone:

    - **Authoritative DNS server**: The first entry in the SOA record (dns.sample.tld)
    is the primary DNS server that is authoritative for the domain.

    - **Administrator e-mail address**: Next comes the e-mail of the person responsible
    for the DNS server (hostmaster.sample.tld), usually known as the hostmaster.


    Note that whenever a fully qualified DNS name appears in the example, it''s followed
    by a trailing period. You must remember the trailing period because it''s missing;
    BIND assumes that the name is relative to the current zone. For example, in a
    named zone zone.tld, dns1.sample.tld is fully qualified, but dns1.sample.tld would
    be assumed to be dns1.sample.tld.zone.tld. You must remember this information
    when working with zone files. By missing one dot, your DNS server can go from
    effective to defective instantaneously.


    +   -Serial number**: The next item in the SOA record is the serial number. This
    arbitrary number must be incremented to a higher number each time the zone is
    changed. BIND uses the serial number to determine whether to reload the zone in
    memory.


    The rest of the numbers in the SOA record are time, refresh, retry, expire, and
    minimum TTL values:


    +   - **Refresh value**: The refresh value controls how often slave servers request
    updates from the master servers.

    - **Retry value**: The retry value controls the interval at which a slave server
    tries to update from master if the initial request fails.

    - **Expire time**: The expire time causes the slave server to cease its role as
    an authoritative name server if the master servers cannot be reached.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_172_0.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 154 Part III: Working with DNS Servers


    +   - **Minimum TTL value**: The minimum TTL value indicates the absolute minimum
    amount of time that the zone information should be cached on any caching servers
    retrieving the zone information. This value ensures that remote DNS servers don''t
    unnecessarily bog down your server with requests for new information.


    Following the SOA record are the DNS records for the zone. (We discuss record
    types in more detail in Chapter 9). For now, keep in mind that three types of
    records are in the sample zone file:


    +   - **NS records**: Specify the authoritative name servers for the domain

    - **MX records**: Are responsible for forwarding mail for the domain

    - **A records**: Points to actual servers.


    You should now have a BIND configuration file and zone files in place. If everything
    is configured correctly, the BIND daemon (called named) should start when you
    restart your system. You can also start named manually by running the command
    `/usr/local/sbin/named` or its equivalent on your system if named is in a different
    directory.


    # Make It Go! No, Wait — Make It Stop!


    Every time a change is made to a zone file or to the BIND configuration file,
    BIND must be restarted because BIND stores its configuration and zone information
    in memory for faster access. The configuration information is therefore retrieved
    from the configuration file only during the BIND startup process. The simplest
    way to restart BIND is to kill (Unix term for ending a process) the named process
    and manually start the daemon again. The problem with this process is that it
    causes BIND to be unavailable during the period after you have stopped the process
    before it has been restarted. That may not seem much of a problem, but it''s bad
    practice and may have a noticeable effect on a high-traffic DNS server.


    A second and better method is to restart the named process using the `kill -HUP`
    command. This method sends to the named process a HUP signal that tells named
    to reload its configuration. Think of it as a minimalistic version of restarting
    the service. Although this method is a vast improvement over stopping the daemon,
    hold on your hat because it gets better!


    You achieve the pinnacle of restarting by making use of the rnd utility. Included
    in BIND, it''s used to control the named daemon and can be used to reload the
    BIND configuration data and zone files without stopping the named process. This
    way, requests are still fulfilled while the configuration files are being reloaded.'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Chapter 8: Unix Domain Servers\n\nThe rndc utility requires some configuration\
    \ changes in order to be truly useful. In particular, because rndc can be used\
    \ to restart remote DNS servers, it requires some security prefiguration. In BIND\
    \ earlier than 9.2.0, the configuration of BIND to use rndc was fairly complex.\
    \ The first step was to generate a key, add controls and key statements to your\
    \ named.conf file, and then write a rndc.conf file.\n\nThankfully, the configuration\
    \ of rndc for with BIND is now far simpler for a basic BIND configuration. To\
    \ configure rndc, type rndc-congen /etc/rndc.conf, which automatically generates\
    \ the rndc.conf file, as shown in Figure 8-13.\n\nFigure 8-13: Automatically creating\
    \ the rndc.conf configuration for the named.conf file.\n\n```\nFile Edit Settings\
    \ Help\n[rndc] * rndc-congen /etc/rndc.conf\n[rndc] * /etc/rndc.conf\nStart of\
    \ rndc:\n  algorithm-hmac-sha1\n  secret \"LNNWq/Hq9443E7+0P3dQ=\"\"\n  options\
    \ {\n    default-server 127.0.0.1;\n    default-port 953;\n  }\nEnd of rndc.conf\n\
    # Use the following in named.conf, adjusting the list as needed:\nkey \"rndc-key\"\
    \ {\n  algorithm-hmac-sha1\n  secret \"LNNWq/Hq9443E7+0P3dQ=\"\"\n}\\controls\
    \ {\n  inet 127.0.0.1 port 953 {\n    allow 127.0.0.1 : keys \"rndc-key\";\n \
    \ }\n}\nEnd of named.conf\n```\n\nIn creating the rndc.conf file, you must make\
    \ a change to the named.conf file. In the automatically generated rndc.conf file\
    \ (refer to Figure 8-13), you must copy and paste into your named.conf file everything\
    \ after the line #End of rndc.conf. This data should be added to the named.conf\
    \ file after the options section before any zone data occurs. You must also remove\
    \ the hash mark (#) from each line except for the ones providing commentary about\
    \ the directives that are used. The new named.conf file should look similar to\
    \ the one shown in Figure 8-14.\n\nNow that the changes have been made to the\
    \ named.conf file, BIND must be restarted. You should use the killall -HUP named\
    \ (or the pkill -HUP named on Solaris) command. If all goes well, this is the\
    \ last time the command will have to run because of Running the killall command\
    \ with the -HUP signal causes named to reload the configuration data, including\
    \ the key and control statements, which allow rndc to function."
  merge: -1
  img_proc: true
- pgno: 175
  md: "# 156 Part III: Working with DNS Servers\n\n```\nroot@root# cat /etc/named.conf\n\
