    Similar to the Wicked example shown earlier in this chapter, this zone file is
    enough to make the zone functional, but not enough to make it useful. First, though,
    have a look at the sample zone file. The first line defines the SOA record. @
    reflects the current origin of the zone (the name by default), IN specifies an
    internet record, and SOA defines the record type. The next, dns1.domain.tld.,
    defines the primary DNS server for the zone. The hostmaster.newdomain.tld field
    defines the contact for the zone. This part is an e-mail address, where @ is replaced
    by a period because @ has special meaning in a zone file. The attributes for the
    SOA record must be in order, and they include the arbitrary serial number (which
    must be incremented each time the zone is changed) and the TTL values for the
    zone.


    The $ORIGIN directive sets the information that is appended to a name in a zone
    file that isn''t fully qualified. As you know now, a fully qualified name in a
    zone file isn''t suffixed with a period, the value of the $ORIGIN directive is
    appended. In addition, @ symbol refers to the value of $ORIGIN. By default, the
    value of $ORIGIN is the same as the zone name. By changing the value of $ORIGIN
    part through a zone file, you can change the domain name thats


