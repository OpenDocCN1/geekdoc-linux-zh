- pgno: 72
  md: '# Chapter 4


    # Facilitating Other Applications with DNS


    +   In This Chapter

    - E-mail overview

    - Configuring MX records

    - Working with multiple MX records

    - Configuring mail servers as mail exchangers


    Although DNS is known mostly for enabling the World Wide Web because of where
    it''s most obviously used, it also plays a critical role in other network communications
    processes. DNS is used to facilitate many other applications also, from databases
    to multi-tier applications to instant messaging. although these applications are
    all vastly different, they all use DNS in one way or another. One popular function
    that depends on DNS is e-mail. It is reported to be the most widely used Internet
    application, and it could not function as it does now without the services of
    DNS.


    # Getting into E-Mail


    Every time you send an e-mail to user@domain.tld, DNS is used. Because DNS was
    built with e-mail in mind (among other things), it has e-mail functionality built
    right. E-mail uses a special type of DNS record known as a mail exchanger (MX)
    record to facilitate the exchange of e-mail. First, however, we describe the Simple
    Mail Transport Protocol (SMTP).


    SMTP is the protocol used to move mail around the Internet, so it''s the Internet
    equivalent of your friendly neighborhood postal worker. You may have also heard
    of a protocol named POP3 and its role in the use of e-mail. Unlike SMTP, POP3
    is used only for the retrieval of mail from a mail server'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 54 Part I: How DNS Makes the Internet Go ''Round''


    and a minor part of the e-mail process. SMTP, on the other hand, handles all mail
    duties for e-mail on the Internet until the message reaches its destination server.


    When you use a mail client like Outlook or Eudora, you define both an outgoing
    and incoming mail server. The outgoing server is known as an SMTP relay because
    it''s responsible for relaying messages from the client to the recipient server.
    This setting in Outlook also uses DNS, but not in the same way that DNS is used
    for mail routing, as you can see in Figure 4-1. It shows an example of the mail
    server setting.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_73_0.png)


    Figure 4-1: The server configuration in a mail client.


    You can see how DNS is used to deliver mail to the SMTP relay server. The host
    name of the relay server is specified, and the mail client uses DNS to retrieve
    the A record for that host. The SMTP message is delivered to the SMTP relay server
    at the IP address in the A record.


    In Unix, mail user agents (MUAs), such as mut and pine, don''t use an outgoing
    SMTP server like other mail clients, such as Netscape Mail. Rather, they injection
    to place the outgoing mail queue of a local mail transport agent (MTA), such as
    sendmail or qmail. Although the process for getting the mail into the queue is
    different, the way the mail is handled after it''s in the queue is the


    After the message has been delivered to the SMTP server, the mail-routing process
    begins, which is where the DNS mail-enabling features come into play. First, there''s
    some background. For each domain server-email to users, such as user@domain.tld,
    is a server known as a mail exchanger. It''s'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Chapter 4: Facilitating Other Applications with DNS


    responsible for receiving all e-mail destined for that domain. A mail exchanger
    can be responsible for any number of domains as long as it is capable of handling
    the load. You can also have more than one mail exchanger for a domain, which we
    explain later in this chapter, in the section “Using Multiple MX Records.”


    The key in the SMTP process is the SMTP relay server''s message to the correct
    mail exchanger. When a relay server receives a message from a client, the message
    is placed in an outgoing queue. When the message is processed, the SMTP relay
    server disregards the user portion (user@domain.tld) and simply looks at the domain
    port. The domain portion is used to determine the mail exchanger for that domain.
    The SMTP relay server does a DNS lookup on the domain, but doesn''t look up the
    A record. Rather, the server does a lookup for the mail exchanger (MX) record
    for that domain. We mention MX records in Chapter 9.)


    # Understanding MX Records


    An MX, or mail exchanger, is a simple form of DNS record. Each domain — microsoft.com,
    — has at least one MX record if it will be used to receive e-mail. The MX record
    contains as of a name (typically the domain name or @), a metric value (BIND)
    or priority value (Microsoft Windows), though when there''s one MX record, the
    priority is an arbitrary value, and a value (the IP address of the mail exchanger).
    To create an MX record in Windows DNS, first open the DNS snap-in by clicking
    the Start button and choosing Administrative Tools.


    We describe this process in detail in Chapter 9. Rather than give a walkthrough
    on how to configure your server, however, we mention the process to give you an
    idea of how mail is facilitated by DNS. See Chapter 9 for the details on adding
    records and zones to your DNS server.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_74_0.png)


    Locate the zone in which to create the record, right-click, and choose New Mail
    Exchanger. The New Resource dialog box is displayed, as shown in Figure 4-2.


    The MX record requires a few values. The first is the name value for the domain.
    To use the current domain, leave this box blank. For example, this MX record is
    created in the domain sample.tld. The MX record is associated with sample.tld
    if you leave the box blank, and mail to user@sample.tld goes to the host you specify.
    You can also specify other hosts or domains for the MX record if you want to deliver
    mail for user@host.sample.tld, for example. In most cases, you simply create the
    MX record for the default domain.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Part I: How DNS Makes the Internet Go ''Round


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_75_0.png)


    Figure 4-2:

    Creating a MX record in Windows.


    You must now specify in the Mail server box the mail exchanger host, which can
    be either an IP address or a DNS host name of the mail server configured to receive
    mail for this domain. (In the following section, “Configuring Mail Servers as
    Mail Exchangers,” we tell you how to configure mail servers as mail exchangers.)
    The other important value is the priority. This value is set to 10 by default.
    If you have only one MX record, you can leave it as the default. Alternate the
    use of multiple MX records in the following section. The last two values in the
    dialog box are check labeled Delete this record when it becomes state, which should
    be checked only if you''re scavenging (which is unlikely), and the TTL value.
    The TTL value is taken from the parent zone by default. Click OK to create the
    record. Figure 4-3 shows the new MX record in the zone.


    In BIND, creating an MX record is simple. All you need to do is add a record to
    the zone file in which the MX record will reside. The MX record has the same values
    as the Windows version: name, a priority, and a name address for the mail exchanger.
    An MX record in BIND looks like this:


    ```

    sample.tld. IN MX 10 mail.sample.tld.

    ```


    Assuming that this MX record is in the sample.tld zone file, you can do the same
    thing with less verbosity:


    ```

    @ IN MX 10 mail

    ```


    The @ sign indicates the current origin, typically the name of the zone (sample.tld.)
    unless it has been changed using an $ORIGIN statement; mail without the trailing
    period indicates that the parent domain name should be appended. Both methods
