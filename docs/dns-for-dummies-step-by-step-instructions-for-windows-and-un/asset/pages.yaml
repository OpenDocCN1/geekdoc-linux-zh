- pgno: 167
  md: '# Getting BIND running


    After BIND is installed, you still need to make changes to ensure that the daemon
    automatically starts when the system does. You can start BIND manu-, but you will
    probably want it to start automatically if your network hosts will be using the
    BIND daemon for DNS services regularly. You can have BIND start automatically
    in one of two ways: Place it in a startup script or use inetd.


    If you''re familiar with Unix and Linux in particular, you may be familiar with
    inetd. It''s a daemon that listens on the network for connections to the system.
    When inetd hears a connection on the network, it checks its configuration file
    (typically named inetd.conf) to see whether the port (TCP/IP port number) on which
    the connection is communicating is on the list. If, inetd launches the appropriate
    process with the port number in the con- figure file and connects the network
    connection and the application.


    For some applications, inetd is a decent solution, but many heavily loaded servers
    don''t use it because repeatedly spawning processes consumes considerable system
    resources. If numerous connections are a partic- lar, a better solution is to
    run the application at startup. In this case, rather than have inetd accept connections
    for the application, the applic- itself listens on the network for connections
    on that.


    In this book, we cover only the second method because inetd isn''t config-ured
    on Linux systems. Some systems, for example, use xinetd, which is configured in
    a significantly different manner from inetd.


    Starting BIND is quite simple. The BIND program, called named, is installed in
    /usr/sbin by default. To start BIND, you can simply type /usr/sbin/named. BIND
    doesn''t start if you haven''t created the appropriate configuration files yet;
    when it''s properly configured, however, this is how you initiate the BIND daemon.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_167_0.png)


    BIND doesn''t start unless a configuration file is created and configured for
    use. Without the configuration file, the BIND process immediately terminates.


    To automatically start BIND, you just have to put the /usr/sbin/named command
    in a startup script. Startup scripts are run when the system first starts up.
    In Linux, startup scripts are typically located in the directory /etc/rc.d/ Look
    in that directory on your system for a file named rc.local that file is the startup
    script that runs when your system boots, and you should place in any file any
    applications you want to run so that all the appropriate system services are running
    before your applica-tions start. Place the /usr/sbin/named command at the end
    of the rc.local file, as shown in Figure 8-12.'
  merge: -1
  img_proc: true
