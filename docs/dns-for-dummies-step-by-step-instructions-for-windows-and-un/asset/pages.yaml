    # Save the planet — stop cache pollution


    The Secure cache against pollution option is a server-side option used to attempt
    cache pollution caused by incorrect DNS responses. The Secure cache against pollution
    option causes the server to discard rather than any DNS responses that are not
    in the domain in the DNS request. For example, if the DNS request is for www.domain.tld
    and a referral is returned to www.rogue.tld, that referral isn''t cached. When
    the option is disabled, any referrals are cached.


    Referrals are used to pollute the DNS server''s cache by attaching unrelated DNS
    records to the referral.


