- pgno: 156
  md: '# Chapter 8


    # Unix Domain Name Servers


    # In This Chapter


    +   - Installing BIND using packages

    - Installing BIND from source code

    - Configuring BIND

    - Starting and stopping BIND 9


    Like the Microsoft Windows server products, many Unix systems include a DNS server
    you can use to deploy DNS. The DNS server included with most versions of Unix
    is most often a version of a common DNS application, although some builds come
    with proprietary DNS servers. The most common, of the “common” DNS servers available
    for Unix, is Berkeley Internet Name Daming, or simply BIND. In fact, it’s uncommon
    to find a Unix server running something than BIND.


    BIND was originally written at the University of California at Berkeley (surprised?),
    as one of the key applications to complement the Berkeley Software Distribution
    (BSD) version of Unix. BSD Unix, an extremely widely distributed version of Unix,
    is often used as a “reference product” for other development efforts.


    The term daemon is used in Unix to describe a program that runs in the background
    and waits for connections. Essentially, it’s the Unix equivalent of a service
    in Windows NT or Windows 2000.


    BIND, like a great deal of other software, including Unix itself, has a storied
    history. It was originally written for the ARPANET project (refer to Chapter 1)
    at Berkeley. Berkeley continued to maintain BIND for some time until version 4.9,
    and its maintenance was taken over by Digital Equipment Corporation (DEC). Version
    4.9.2 was the work of Paul Vix, of Pixie Enterprises, and all versions since then
    have been under his control (he''s now with the Internet Software Consortium,
    or ISC).


    All references to BIND in this chapter are to BIND Version 9, and more specifically
    9.2.0. Older versions may or may not share features in common with the version
    we discuss here.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_156_0.png)


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_156_1.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: "# 138 Part III: Working with DNS Servers\n\nAlas, this isn't a history book,\
