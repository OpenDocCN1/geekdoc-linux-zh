- pgno: 98
  md: '# # Chapter 6


    # # Using the DNS Clients on Your System


    +   * In This Chapter

    * Windows DNS clients

    * Resolvers explained

    * Unix and Linux DNS clients

    * DNS tools


    For most users, the greatest thing about DNS is that it''s almost transparent.
    That is, even though most users perform many daily activities that use DNS, such
    as browsing the Internet and connecting to network servers, they don''t have to
    concern themselves with what''s going behind the scenes. Anything you can make
    transparent to users is a big advantage to both them and any network technicians
    who are supporting them. Although a user may be able to remain blissfully unaware
    of the processes of a DNS client, the typical network administrator is probably
    able to tinker with the details and the available troubleshooting tools.


    Although DNS is almost always used as a transparent part of the Internet infrastructure,
    you can interact with it explicitly by command-line and graphical DNS client tools.
    In many cases, making use of a command-line client for troubleshooting is most
    practical. In this chapter, we describe the DNS clients on both Windows and Unix
    operating systems and the configuration details of each one. We also examine a
    powerful (and, fortunately, easy-to-use) command-line tool, NSLOOKUP. Although
    the activities of the DNS client are unnoticed by users, the folks in charge of
    maintaining network hosts need to interact with the DNS servers.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Part II: Working with DNS Clients


    # Discovering the Two Types of DNS Clients


    Clients versus resolvers: An important differentiation to make when discussing
    the client side of DNS is between clients and resolvers. Clients include any application
    with which the end user interacts. This includes both integrated clients in applications
    such as Microsoft Explorer and command-line clients, such as NSLOOKUP. Resolvers,
    however, work in the background and never interact with users directly. Resolvers
    provide the back-end infrastructure that DNS clients use to perform DNS tasks.
    Two types of DNS clients exist, and each type has an important use:


    +   - Integrated clients: Used all the time by everyone who accesses the Internet,
    integrated clients allow Internet users to transparently access Web sites and
    e-mail servers (identified by IP addresses) by knowing only DNS names. This transparency
    means that the end user does not need to know DNS exists.


    You may or not realize, but every computer contains a number of integrated transparent
    DNS clients. On Windows systems, you can find DNS clients integrated in applications
    such as Internet Explorer and Microsoft Outlook. In Unix and Linux, you also find
    DNS clients in Web browsers and mail applications, among others. Most integrated
    clients are subcomponents of applications that make wide use of network services.
    This client integration is designed to, in addition to other tasks, speed the
    DNS resolution process.


    +   - Command-line clients: Command-line DNS clients serve an important purpose,
    and most computer users don''t even know that these clients exist on almost every
    system. The most common use for a commandline DNS client is troubleshooting. You
    can determine exactly how e-mail is routed, for example, by using a command-line
    DNS client. Command-line DNS clients make it possible to access any DNS database
    record from any computer. Microsoft Windows includes a command-line DNS client
    named NSLOOKUP, and Unix usually includes the NSLOOKUP and DIG command-line DNS
    clients. In addition, other command-line DNS clients you can purchase or download
    provide additional functionality that you may find useful if you perform lots
    of DNS troubleshooting.


    # Looking at Resolvers and What They Do for DNS


    Windows and Unix/Linux are similar in that they both use a resolver for DNS. A
    resolver, typically a DLL in Windows and a kernel module in Unix/Linux, is the
    most basic set of routines used by DNS clients.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Chapter 6: Using the DNS Clients on Your System


    The resolver is responsible for performing the DNS resolution process (we describe
    the DNS request-and-response process in detail in Chapter 3):


    +   - Receive the request for a name resolution from an application (typically
    through a procedure call).

    - Format the request in the correct manner for the server process.

    - Send the request to the name server, which is responsible for doing the majority
    of the work and returning the response. The name server returns the response to
    the resolver.

    - Format the response from the name server in a way that is appropriate for the
    application, and return the formatted response to the application.


    Many resolvers have more features than the basic resolver features. The Windows
    resolver, for example, caches DNS results so that a new request doesn''t need
    to be sent for the same information. Caching when DNS results are stored in memory
    temporarily so that if the same DNS name is requested more than once, the request
    is served from memory rather than another name server. Many resolvers have the
    caching feature, although it can cause a problem. If an IP address is cached by
    the resolver and address changes before the cached information expires, you cannot
    reach the server. In this case, you need to wait until the cached information
    expires or clear the cache.


    In older versions of Windows, you can clear the DNS cache by restarting the DNS
    client service. If you''re using Windows 2000 or later, such as Windows XP or
    Windows .NET Server, you can use the ipconfig \flushdns command (from a command
    prompt) to empty the DNS resolver cache.


    # Working with the Windows resolver


    Windows 2000 and later (including Windows XP and Windows .NET Server) use the
    Windows 2000-style resolver by default. The Windows 2000 resolver runs the DNS
    Client service. This resolver is responsible for a number of tasks:


    +   - The caching of DNS responses regardless of a successful or unsuccessful
    event. The caching of both successful and unsuccessful queries allows DNS requests
    from applications to be answered regardless of whether an IP address is returned.
    The resolver also maintains this cache, removing names and addresses if they change
    or become invalid.

    - Tracking network adapter DNS names (including plug-and-play adapters).


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 82 Part II: Working with DNS Clients


    +   - Updating the cache whenever changes are made to the HOSTS file.

    - Managing unresponsive DNS servers. When DNS servers are unresponsive, the resolver
    automatically stops querying them for a time, instead using only the functioning
    servers.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_101_0.png)


    The HOSTS file contains a list of DNS names and IP addresses stored locally on
    the computer. These names and addresses override those on a DNS server and can
    also be used when no entry exists for a specific name on a DNS


    One of the more complex tasks the Windows 2000 resolver performs is to prioritize
    IP addresses in a query response. Whenever a DNS server contains more than one
    IP address for a DNS name (known as round robin DNS and described in Chapter 12),
    the normal behavior is for the DNS server to send all addresses in a list with
    the address of its choice first in the list. By default, most systems use the
    first address in the list. The Windows 2000 resolver, however, attempts to request
    all IP addresses associated with the name in a priority sequence. The server then
    returns any address that is local to the system (on a connected subnet) first
    and then defaults to the first address in the list if none is local. This behavior
    causes round robin behavior to fail, but is in place so that Microsoft-based systems
    always access local systems before they access remote systems. You can disable
    this behavior in the Registry.


    One more thing the resolver does is time-out in case of a network failure. If
    no responses are received from any DNS servers, the resolver assumes that a network
    failure has occurred and stops all communications for a length of time — 30 seconds,
    by default. This behavior is in place so that the resolver doesn''t flood a failed
    network with requests. You can disable this behavior.


    # Changing the behavior of the Windows resolver


    You can change the Windows resolver behavior in a number of ways. Here''s the
    most drastic method of disabling the DNS Client service:


    +   1. In Windows 2000, Windows XP, or Windows .NET Server, open the Services
    snap-in by choosing Programs>Administrative Tools from the Start menu.


    +   2. Select the DNS Client service, as shown in Figure 6-1.


    Starting and stopping a service is simple. As you can see in the figure, the DNS
    Client service is started, which is the default. You can click Stop the Service,
    and the service stops.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Chapter 6: Using the DNS Clients on Your System


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_102_0.png)


    Figure 6-1: Use the Services snap-in to start and stop services.


    The DNS client service is stopped, the system reverts to the Windows NT-style
    resolver. This basic resolver doesn''t do any caching or resolver manipulation.
    It accepts requests from applications, forwards them to DNS servers, and returns
    the results to the application.


    When you stop the service, as you may already know, it restarts the next time
    you start Windows. You must set the Startup Type to Manual or Disabled in order
    for service not to start automatically. There is a difference between the Manual
    and Disabled options, when the startup type is set to Manual, the service starts
