  md: '# Chapter 3: The DNS Request Process


    are in your phone directory? You''re obviously unlikely to remember them all (although
    a few people do), so imagine trying to memorize all the 12-digit IP addresses
    of the Web sites you visit often and the people with whom you exchange e-mail.


    Looking at an IP address as a collection of four octets of binary data (32 bits
    total), you got a theoretical number of unique addresses, or address spaces, of
    2³² addresses. Many of these addresses aren''t used on the Internet because they''re
    reserved for special purposes; even so, the number of available addresses is staggering.
    Surprisingly enough, the end is in sight. What will happen when the internet eventually
    runs out of address addresses? The answer is IPv6, a replacement for the current
    IP specification, IPv4. With the eventual adoption of IPv6 (IP version 6), the
    address space will grow to 128 bits, providing an absurdly large number of host
    addresses (2¹²⁸).


    # A Cure for Growing Pains: IPv6


    The current version of the IP protocol, used by billions of Internet users daily,
    is Version 4. This version of IP has been in place for quite some time, has proven
    to be the addressing protocol of choice because it''s more widely used than any
    other. IP doesn''t change often, and the configuration of the address space and
    the number of IP addresses available has remained unchanged for the entire life
    of IP. As we explain in the preceding section, "Dealing with Decimals," the term
    address space refers to the number of IP addresses available in the IP system.
    With IPv4, the addresses are composed of 32 binary bits divided into groups of
    8 octets (00000000 00000000 00000000 00000000). Normally, an IP address is converted
    from binary to decimal (000.000.000.000) for representational purposes. Thirty-two
    binary bits gives IPv4 an address space of 2³² (4.2 billion addresses). Granted,
    some of them are reserved for special purposes, although billions of addresses
    are still available for you.


    You would think that with billions of addresses, the world would have plenty to
    go around, right? It''s not true. IP addresses are allocated in blocks rather
    than individually in order to ease routing administration on the Internet. This
    block arrangement essentially takes addresses out of circulation and and, in combination
    with the explosion of the Internet, limits the way address addresses can be assigned.
    Even if addresses are available globally in the address space, if they''re not
    in the correct block, they cannot be assigned to you.'
