    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 282 DNS For Dummies


    The /Statistics command shows a huge number of statistics regarding the DNS server.
    Some of the more interesting indicate


    +   - When the server was started

    - The number of queries received and responses sent

    - The total number of queries and the number for each record type

    - The number of queries handed off to the recursion process (not answered locally)

    - The number of notify messages sent and zone transfer requests made as a master
    server

    - The number of notify messages received and zone transfers performed as a secondary
    server

    - The number of referrals from WINS

    - The number of dynamic updates

    - Security statistics, such as invalid TSIG keys

    - Directory Server activity

    - Memory usage statistics

    - Error counts


    As you can see, the output of the /Statistics command is engrossing (or just plain
    growth). Although this information can seem a bit overwhelming at first, you can
    use it to gain useful insight into what your server is doing. You can also use
    statistical information to see how record types are affecting your server''s memory
    performance because the memory usage statistics are granular. The output of this
    command is especially useful on a high-traffic server on which you need to squeeze
    out every drop of performance.


    Use the more command to view the output of the /Statistics command page by page
    or else it scrolls off the screen and even out of the scroll buffer of your command
    prompt window. You pipe the output of the command by using the pipe character
    (|) like this:


    ```

    dnscmd /statistics | more

    ```


    You can also send the output of the command to a file using the redirection character
    (>), such as in this line:


    ```

    dnscmd /statistics > dnsstats.txt

    ```


    You can also filter the output of the /Statistics command. Type dnscmd /statistics
    ? to see the list of filters you can use.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_301_0.png)'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Appendix A: Using the DNSCMD Utility 283


    # /EnumZones


    Use the DNSCMD /EnumZones command to view a list of all zones in the server, any
    zone configured on the server appears on the list. The term file indicates that
    the zone is being stored in a zone file. Zones stored in Active Directory are
    indicated by DS in this field. A Rev reverse lookup zone, and a blank field indicates
    a forward zone.


    ```

    C:\WINNT\System32\cmd.exe

    C>dnscmd /enumzones

    Enumerated zone list:

    Zone Count = 8.

    @ file Up=0

    @.in-addr.arpa 1 file Rev Auto Up=0

    168.192.in-addr.arpa 1 file Rev Auto Up=0

    100.192.in-addr.arpa 1 file Rev Up=0

    127.in-addr.arpa 1 file Rev Auto Up=0

    255.in-addr.arpa 1 file Rev Up=0

    ntld 1 file Up=0

    sample.tld 1 file Up=0

    Command completed successfully.

    C:\>

    ```


    Figure-6

    Listing all zones on a DNS server.


    You can filter the /EnumZones command in one of two ways. The first filter is
    based on the zone type and uses the options /Primary, /Secondary, Cache, and /Auto-Created.
    The second filter is based on whether the zone is a forward or reverse zone and
    makes use of the /Forward and /Reverse options. You can use these filters together,
    but only one option from each of the groups. For example, you can use /Primary
    and /Forward together, but you cannot add /Secondary because one option from the
    first (zone type) is already in use. Note that you''re using either filter, system-created
    zones, such as 127.in-addr.arpa and 255.in-addr.arpa, are not shown on the list.


    # /EnumRecords


    Now that you know how to view a list of all zones on the server, you can use the
    /EnumRecords command to view records in a particular zone. Use the following command,
    as shown in Figure A-7:


    ```

    DNSCMD /EnumRecords <zone name> <node name>

    ```


    Specifying a node name of @ shows all records in the zone, and specifying a specific
    node name shows all records with that name.'
  merge: -1
  img_proc: true
- pgno: 303
