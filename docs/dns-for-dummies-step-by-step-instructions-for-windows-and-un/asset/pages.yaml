- pgno: 205
  md: '# 186 Part IV: The Details: Setting Up Your DNS Zones


    +   You have only a few entries in a subdomain. In this surprisingly simple method,
    the subdomain records are created directly in the parent domain zone file. Although
    this method makes creating the entries easier, it has some shortcomings.


    +   You have large subdomains. This method, known as delegating the subdomain,
    is fairly simple. It requires only that you create a new zone and add a few records
    in the zone of the parent domain. This method allows the administrator (you) of
    the name server on which the subdomain resides to make changes to the zone rather
    than require changes to be made on the parent domain''s server. The subdomain
    may reside on the same server as the parent, but this method gives you the option
    to separate it. It keeps the zone files less cluttered because you have two files—one
    for each domain (parent and subdomain) rather than only one file for both. If
    you end up having thousands of hosts, you will be thankful that you have small,
    organized zones to sort through in case you ever need to troubleshoot.


    # Taking the easy way out


    To begin configuring a subdomain using the simple method, first look at a standard
    zone file for the parent domain:


    | IN SOA dns1.domain.tld. |

    | hostmaster.newdomain.tld. | : Serial |

    | | 1 |

    | 360000 : Refresh |

    | 30000 : Retry |

    | 360000 : Expire |

    | 360000 ) : Minimum |


    | IN NS dns1.domain.tld. |

    | acct IN A 192.168.1.5 |


    This example shows the zone file for a theoretical zone named newdomain.tld. Imagine
    you want to create a host named wsl for a remote site in your Seattle office,
    but you don''t want it in the parent domain—you want it in a geographically based
    subdomain named sea. The host record looks like:


    | wsl.sea IN A 192.168.100.109 |


    Remember that when no trailing period appears after a name in a zone file, the
    zone name is appended. The result is that the sample host record points wsl.sea.newdomain.tld
    to 192.168.100.109, which is the required result. To add more subdomains to records,
    continue this process. You can test your subdomain by using NSLOOKUP, as shown
    in Figure 10-8, or by using DIG (we describe both methods in Chapter 6).'
  merge: -1
  img_proc: true
