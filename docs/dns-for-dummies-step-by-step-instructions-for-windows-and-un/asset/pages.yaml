    # Sending Notice


    DNS zone change notification, or NOTIFY, is a DNS feature that''s useful when
    you have a master NS server and any number of slave servers. Normally, a slave
    server performs a zone transfer each time the refresh time of the zone expires.
    This transfer can cause a problem if the zone is modified on the master DNS server.
    The zone file on the slave servers is out of synchronization until the refresh
    time expires.


    NOTIFY is a solution to this problem. When a zone on a DNS server with notification
    enabled is modified, the DNS server sends a NOTIFY message to all DNS servers
    listed with name server (NS) records in the zone. This message causes the servers
    to perform a zone transfer for the modified zone immediately, and the changes
    are updated on all slave servers.


    NOTIFY is enabled by default on Microsoft Windows DNS BIND. You can change a number
    of NOTIFY settings, though.


    # NOTIFY on Windows 2000 and Windows .NET


    NOTIFY configuration is done on a zone-by-zone basis by choosing Start\Programs\Administrative
    Tools. Locate the DNS snap-in and select a zone to configure in the left pane
    and choose Properties from the Action menu. Select the Zone Tabs and click the
    Notify button to open the Notify dialog box, as shown in Figure 12-5.


    The default settings are shown in the Notify dialog box. By default, all servers
    with a name server (NS) record in the zone are notified. By deselecting the Automatically
    check box, no servers are notified when changes are made to the zone. The other
    available option is to configure manually the servers that will receive NOTIFY
    messages. By selecting the option labeled The Following servers, entering an IP
    address, and clicking the Add button, you can manually specify a list of servers
    to be notified. This technique is useful if servers are configured as zone slave
    servers and don''t have NS records in the zone, although that is a rare case.'
  merge: -1
  img_proc: true
