  md: '# 122 Part III: Working with DNS Servers


    The last option on the Advanced tab is Enable automatic scavenging of stale records.
    Scavenging is the process of removing old records (leftover from a host''s no
    longer present) from zones. Scavenging typically applies to only dynamically added
    records, not manually added records, although you can configure manually added
    records for scavenging. Scavenging is disabled at the server level and enabled
    at the zone level by default. (We tell you about scavenging in more detail in
    Chapter 12.)


