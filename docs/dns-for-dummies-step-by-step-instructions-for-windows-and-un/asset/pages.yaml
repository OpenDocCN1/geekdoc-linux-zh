    The advantage of using NSLOOKUP in interactive mode is that you can change its
    behavior by changing parameters. These settings are modal: They stay set as long
    as NSLOOKUP is running or until they''re changed again. One of the most basic
    configuration changes you can make in NSLOOKUP is to the server that is queried.
    You can change your DNS server to something different by typing SERVER <servername>
