- pgno: 308
  md: '# ZoneAdd


    DNSCMD /ZoneAdd <zone name> /Primary /File <filename>

    DNSCMD /ZoneAdd <zone name> /Secondary <IP Address> /File

    <filename>

    DNSCMD /ZoneAdd <zone name> /DsPrimaryDSPrimary


    The DNSCMD /ZoneAdd command adds zone to the DNS server and can be used in one
    of three ways to add a primary zone, a secondary zone, or an Active Directory-integrated
    zone. The DNS server must be integrated with Active Directory in order to add
    an integrated zone. The three commands look like this:


    Adding a primary zone requires only a filename in which the zone data is stored.
    Adding a secondary zone requires at least one IP address of the zone master server,
    although you can specify more than one address separated by spaces. The filename
    is optional, and you can leave out the /File parameter. Adding an Active Directory-integrated
    zone requires no parameters. After you have added the zone by using this command,
    you can begin adding records to the zone.


    # ZoneDelete


    DNSCMD /ZoneDelete <zone name>


    As you have guessed, the /ZoneDelete option removes a zone from the DNS server;
    if it''s an Active Directory-integrated zone, however, it remains in the directory
    server. To remove an integrated zone from both the DNS and the directory server,
    add the /DsDel option to the command. By default, you''re prompted for confirmation
    to delete the zone. If you don''t want to be prompted (if you were running the
    command from a script, add the /f option.


    # ZonePause and ZoneResume


    DNSCMD /ZonePause <zone name>

    DNSCMD /ZoneResume


    These commands pause and unpause (or resume) a zone. A paused zone doesn''t respond
    to queries until it is unpaused. This functionality is useful for temporarily
    disabling a domain without disabling the entire server.


    # ZoneReload


    DNSCMD /ZoneReload <zone name>'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 290 DNS For Dummies


    This command reloads a zone into memory whenever its zone file or its information
    in the directory server (in the case of an integrated zone) has been changed.
    If you''re manually editing zone files or the directory, you must run this command
    to have the changes effective in the DNS server. The old data continues to be
    supplied to clients until the reload occurs.


    # /ZoneWriteBack


    ```

    DNSCMD /ZoneWriteBack <zone name>

    ```


    This command, which is identical to the /WriteBackFiles <zone name> command, commits
    to the zone file any changes made to the zone in memory.


    # /ZoneRefresh


    ```

    DNSCMD /ZoneRefresh <zone name>

    ```


    To force a zone transfer of a secondary zone from the master server, issue this
    command. The specified zone must be a secondary zone. When the command is run,
    a full zone transfer is performed, which is particularly useful when you know
    that the master zone has been changed and the data in the secondary DNS server
    is stable. If the stale data pointing to an invalid DNS server makes the refresh
    important. Using the DNS NOTIFY command on your DNS server makes obsolete the
    requirement to refresh secondary zones.


    # /ZoneUpdateFromDs


    ```

    DNSCMD /ZoneUpdateFromDs <zone name>

    ```


    This command is similar to the /ZoneRefresh command except that the zone information
    is reloaded from the directory server. This procedure is applicable only to Active
    Directory–integrated zones. The command is used whenever the zone data has been
    changed directly on the directory server.


    # /ZoneResetType


    ```

    DNSCMD /ZoneResetType <zone name> <type>

    ```


    This command changes a zone to a specified zone type. The zone type options are
    shown in this list:


    +   - /Primary /file <filename>

    - /Secondary <IP Address> /File <filename>

    - /DsPrimary


    Just like with the /ZoneAdd command, the /Primary option requires a file-name
    for the zone file; the /Secondary option requires at least one master server IP
    address, but can accept more than one and doesn''t require the /File parameter;
    and the /DsPrimary option requires no parameters.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Appendix A: Using the DNSCMD Utility


    The /ZoneResetType command also has two other options:


    +   - /OverWrite_Mem option overwrites the DNS data with the data stored in the
    directory server.

    - /OverWrite_Ds option overwrites the data stored in the Directory Server with
    the data in the DNS server.


    # /ZoneResetSecondaries


    DNSCMD /ZoneResetSecondaries <zone name> <security> <IP Address> <notify options>
    <notify IP>


    Using this command changes the secondary DNS servers for a master zone. The command
    in this form sets the secondary DNS server configuration for the specified zone.


    The options for security are shown in this list:


    +   - /NoXfr: No zone transfers are allowed.

    - /NonSecure: Zone transfers to any host are allowed.

    - /SecureNs: Zone transfers are allowed to any host with an NS record in the zone
    file.

    - /SecureList: Zone transfers are allowed to any host in the list specified by
    <IP Address>, which must be separated by spaces.


    The default security setting for a zone is /NonSecure. The notify options are
    shown in this list:


    +   - /NoNotify: No notify messages are sent.

    - /Notify: Notify messages are sent to all secondary DNS servers.

    - /NotifyList: Notify messages are sent only to the hosts specified in <notify
    IP>, a list that must be separated by spaces.


    The default notify setting is /Notify. As you may notice, this configuration options
    are the same one available on the Zone Transfers tab in a zone''s Properties dialog
    box in the DNS snap-in.


    # /ZoneResetMasters


    DNSCMD /ZoneResetMasters <zone name> <IP address>


    Similar to /ZoneResetSecondaries only for secondary zones, this command changes
    the master servers for the zone. The <IP address> option must contain at least
    one IP address for a master server, and multiple IP addresses must be separated
    by spaces.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 292 DNS For Dummies


    /ZoneResetScavengeServers

    DNSCMD /ZoneResetScavengeServers <zone name> <IP address>


    This command configures which servers are allowed to scavenge the zone. If no
    IP address is specified, all servers that host the zone — master or slave — can
    scavenge. If an IP address or list of addresses is specified, any of the specified
    servers can scavenge the zone.


    /AgeAllRecords

    DNSCMD /AgeAll1Records <zone name> <node>


    Use this command to timestamp the records in a zone and enable aging. If you omit
    the <node> option, the entire zone is timestamped and aging is enabled. With the
    <node> option enabled, only the specified node is affected. Adding the /Tree option
    to the command causes the entire tree below the specified zone or node (all subdomains)
    to be affected also. You can append the /f option if you don''t want to be prompted
    for confirmation, such as when the command is integrated into a script.


    # Configuring records


    The DNSCMD provides a number of options for working with various record types.
    You can add and remove records by using this utility.


    /RecordAdd

    DNSCMD /RecordAdd <zone name> <node> /Aging <TTL> <record type> <value>


    This command adds a record to a specified zone. The record name is specified by
    <node>, the record type must also be specified. For each record type, the required
    value data is different, as shown in Figure A-10. When you''re adding a record,
    reference the command''s help system by typing DNSCMD /RecordAdd /? to ensure
    that you provide the correct values.


    The /RecordAdd command has two optional parameters:


    +   - The /Aging option enables aging on the record, which is disabled by default.


    +   - The <TTL> option for the record is set to the TTL in the SOA record for
    the zone by default; by specifying a value for <TTL>, however, you can override
    the SOA value.'
  merge: -1
  img_proc: true
