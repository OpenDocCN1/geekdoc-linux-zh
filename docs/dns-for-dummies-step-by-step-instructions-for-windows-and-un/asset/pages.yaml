    universities. Universities (notably, the University of California at Berkeley)
    wanted to make use of this tool to perform research and teach. Even though most
    users were computer specialists, the number of hosts added to the budding Internet
    would be too numerous to manage. With the invention of a number of network protocols
    that worked behind'
