  md: '# Chapter 8: Unix Domain Name Servers


    The command rndc reload <zonefile>, where <zonefile> is the zone you want to reload,
    causes only that individual zone to be reloaded, and it saves the system resources
    needed to reload the BIND configuration file and all associated zone files.


    You cannot use the single zone reload feature of rndc to add zones. When you add
    a zone or make any other changes to the BIND configuration file, you must use
    the rndc reload command.


    You can use a few other useful rndc commands. You can see a list of all rndc commands
    by running the rndc utility with no commands. Typing rndc flush causes the name
    server to be cleared of current entries. This feature is useful if a cached DNS
    record is known or suspected to be invalid. The rndc status command shows the
    status of the name server, as shown in Figure 8-16.


    Figure 8-16: The name server status, including transfers and queries in progress.


    ```

    root# rndc status

    number of zones: 3

    debug level: 0

    sfers running: 0

    sfers deferred: 0

    query logging is OFF

    name-server is up and running

    [root@root]#

    ```


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_176_0.png)'
