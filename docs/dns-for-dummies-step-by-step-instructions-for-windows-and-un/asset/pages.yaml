    # Using DNS and WINS


    When you''re using Windows-based DNS services, you can integrate WINS with DNS
    so that if DNS lookups fail, WINS is used. This feature is useful only for A records
    and is truly useful only if WINS is widely deployed over your network and (for
    one reason or another) you aren''t using dynamic DNS. In this scenario, you would
    probably benefit from having WINS as a backup in the event that DNS resolution
    fails.


    > WINS integration can be enabled for forward or reverse lookup zones.


    If normal DNS resolution fails, WINS integration for forward zones works by separating
    the host name from the domain suffix and querying the configured WINS servers
    for host. If the WINS server can resolve the host, the address is returned to
    the DNS server and then to the client. Reverse WINS resolution works by sending
    a "node adapter status request" directly to the IP address and appending a fixed
    DNS name to the returned host name.'
  merge: -1
  img_proc: true
