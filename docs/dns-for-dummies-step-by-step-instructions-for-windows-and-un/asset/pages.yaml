  md: '# 40 Part I: How DNS Makes the Internet Go ''Round


    Three classes of IP address allocation blocks exist:


    +   - Class C contains 254 usable addresses.

    - Class B contains 65,534 addresses.

    - Class A contains roughly 16 million usable addresses.


    Although only about 32 class A blocks are available to be allocated, it''s still
    a large portion of the IPv4 address space.


    In addition to assigning IP blocks, the assigned addresses have traditionally
    been used up quickly. The traditional method of creating a Web site was to assign
    an IP address to each site, if more than one site was on a server. Although this
    system may seem wasteful, in the early days of the Internet, other arrangements
    weren''t always practical because the software available for Web hosting at the
    host wasn''t sophisticated. In any event, old habits persisted. Most modern Web
    servers have the capacity to use one IP for the Web server and each site referenced
    by a host header. Essentially, the Web browser passes to the DNS name specified
    by a client in a field of the HTTP protocol called the host header. The host header
    is then used by the Web server to direct the request to the Correct Web site.
    This arrangement removes the one-IP-per-site requirement.


    Now that you know why a shortage of IP addresses exists, you can move on read
    about what is being done to mitigate the shortage. IPv6 is one of the solutions,
    but it is a long-term solution that cannot be implemented rapidly. First, you
    should understand what is being done in the short term to carry the Internet until
    IPv6 can be implemented. Note that many of these solutions are coming at the ISP
    level because it''s becoming more difficult for ISPs to request more addresses
    to be allocated and they''re forced to limit their use of addresses. One leading
    short-term solution is to make use of the Network Address Translation (NAT) protocol.
    In the traditional configuration, a company wanting to connect its entire network
    to the Internet through an ISP would tell the ISP, and the ISP would assign an
    IP address for each system needing an address. NAT allows the ISP to assign only
    a single address to be used by a single gateway device. All internal systems then
    use private addresses that don''t need to be assigned by a central registrar because
    they cannot be used on the Internet.


    As you just mentioned, a more permanent solution is planned, although it hasn''t
    yet seen widespread implementation. For several years, a standard known as IP
    version 6 (IPv6) has existed. It implements a number of features'
