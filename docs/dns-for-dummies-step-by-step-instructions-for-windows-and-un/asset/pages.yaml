- pgno: 229
  md: "# 210 Part V: Security and Advanced DNS Tricks\n\n# Dynamic DNS security\n\n\
    Dynamic DNS is disabled by default by BIND. You need to add an allow-update substatement\
    \ in a zone statement to allow dynamic updates. This process makes dynamic updates\
    \ fairly secure unless you allow any system as follows:\n\n```\nDON'T DO THIS:\
    \ allow-update ( any; );\n```\n\nYou can allow updates based on one of two parameters:\
    \ IP addresses or TSIG keys. TSIG keys are the most secure method because you\
    \ can spoof an IP address, but you need to have the TSIG key to forge a false\
    \ update when you're using TSIG security. A zone allowing updates from IP addresses\
    \ looks like this:\n\n```\nzone \"sample.tld\" in {\n  type;\n  file \"sample.tld\"\
    ;n  allow-update ( 192.168.100/24 );\n}\n```\n\nThis example allows updates from\
    \ anywhere in the 192.168.100.0 subnet. Allowing updates using TSIG keys is equally\
    \ simple as long as the key has been defined in the BIND configuration file, as\
    \ discussed earlier in this chapter, in the section \"TSIG and Control Security.\"\
    \ The zone statement looks like this:\n\n```\nzone \"sample.tld\" in {\n  type;\n\
    \  file \"sample.tld\";n  allow-update ( key eng.domain.tld );\n}\n```\n\nAny\
    \ system with that can now send updates to the server. BIND 9 can also use the\
    \ update-policy substatement in a zone statement to control who can perform dynamic\
    \ updates. This fairly complex statement uses TSIG keys, as shown in this example:\n\
    \n```\nupdate-policy { grant hostl.eng.domain.tld. self hostl.eng.domain.tld.\
    \ };\n```\n\nThis update-policy allows the system with eng.domain.tld to update\
    \ its own records, specified by self. You can use the update-policy statement\
    \ to grant or deny any dynamic update policies, but a discussion of them is beyond\
    \ the scope of this book. More documentation is available on the Internet and\
    \ in more advanced DNS books. Here's another useful example:\n\n```\nupdate-policy\
    \ { grant *.eng.domain.tld. self *.eng.domain.tld. };\n```\n\nThis statement allows\
    \ any system with a key suff by eng.domain.tld to update its own DNS records."
  merge: -1
  img_proc: true
- pgno: 230
  md: "# Chapter 11: An Antidote for a Poisoned Cache: DNS Security\n\n# Controlling\
    \ access\n\nAn access control list (ACL) in BIND is referring to something different\
    \ from the ACL feature we mention earlier in this chapter, in the \"Securing DNS\
    \ on Windows\". An ACL refers to a list of IP addresses or networks (or both)\
    \ that are assigned a name. ACLs are defined in the BIND configuration file and\
    \ are used when you are using the same IP address several times in statements\
    \ such as allow-query and allow-transfer. If you've read this entire chapter,\
    \ you have seen an ACL in action; the any ACL is automatically understood to mean\
    \ all IP addresses. In addition to any, BIND has the predefined, localhost, and\
    \ localnets ACLs. Although none is obvious, localhost refers to all IP addresses\
    \ assigned to the DNS server, and localnets refers to the networks of all IP addresses\
    \ assigned to the system. An ACL is defined in the configuration file this:\n\n\
    ```\nacl \"internal\" ( 192.168.100/24 );\n```\n\nThis ACL can now be used in\
    \ any statement that requires an IP address value, such as the allow-transfer\
    \ substatement:\n\n```\nzone \"sample.tld\" in (\n    type master;\n    file \"\
    sample.tld\"\n    allow-transfer ( internal );\n);\n```\n\n# Running BIND in a\
    \ jail\n\nUnix allows you to do some special things in the area of security. In\
    \ an attack on your system, an attacker typically compromises some process on\
    \ your system and then uses that compromised process to move throughout the file\
    \ system on the server and add, remove, or take files as he wants. Unix allows\
    \ you to confine a process to a directory using the chroot() function. When a\
    \ process is jailed in this manner and is compromised by an attacker, the attacker\
    \ cannot move anywhere beyond the jail directory in the server's file system.\n\
    \nJailing the BIND server is a complex process. You must create a user for BIND,\
    \ create a directory to jail the daemon, copy all required files into that directory,\
    \ and then configure BIND to start using that user and directory. This process\
    \ works only for BIND 9. While reading through the procedure, consider that although\
    \ the root of the system is /, you're changing the root for the BIND process to\
    \ /var/named. The BIND process thinks that /var/named is the root of the file\
    \ system."
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 212 Part V: Security and Advanced DNS Tricks


    To run BIND in a jail:


    # 1. Create a user for BIND.


    The username for BIND is typically named. When you create the named user, it shouldn''t
    be assigned a functioning shell and should be assigned a home directory of the
    directory in which you jail BIND. On Linux, use this command:


    ```

    useradd -d /var/named -s /bin/false named

    ```


    # 2. Create the jail directory for BIND if it doesn''t exist.


    Typically, you use /var/named:


    ```

    mkdir /var/named

    ```


    # 3. Create the required directories in the jail — typically etc, dev, var/run,
    and var/named.


    If you use any other directories for logs or zone files or anything else, they
    must also be created here:


    ```

    mkdir /var/named/etc

    mkdir /var/named/dev

    mkdir /var/named/var

    mkdir /var/named/var/named

    mkdir /var/named/var/run

    ```


    # 4. Change the owners of these directories to the named user:


    ```

    chown named etc dev var/run var/named

    ```


    # 5. Copy the BIND configuration file to /var/named/etc directory and copy your
    zone files into the correct directory.


    If you keep your zone files in a directory other than /var/named, change the second
    cp command to suit your system:


    ```

    cp /var/named.conf /var/named/etc/named.conf

    cp /var/named/* /var/named/var/named/

    ```


    # 6. Ensure that the named user owns the configuration file:


    ```

    chown named /var/named/etc/named.conf

    ```


    # 7. Make the special device files null and random in /var/named/dev:


    ```

    mknod /var/named/dev/null c 1 3

    mknod /var/named/dev/random c 1 8

    ```


    # 8. Change the owner of those device files to named:


    ```

    chown named /var/named/dev/null /var/named/dev/random

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: "# Chapter 11: Antidote for a Poisoned Cache: DNS Security\n\n9. Configure syslog\
    \ to allow logging from the jailed BIND process.\n\nYou must have a fairly recent\
    \ version of syslog. By default, a jailed process cannot write to the syslog log.\
    \ This issue is relevant only if you're not using log files in a logging statement\
    \ in your BIND configuration file. To do this, you must change syslog so that\
    \ it starts using the switch - <jaildir>. In many versions of Unix, the syslog\
    \ daemon is started by a file named /etc/init.d/syslog. In newer versions of Linux,\
    \ including Linux RedHat 7.2 and Mandatory 8.0, a file named /etc/sysconfig/syslog\
    \ is used to pass options to the syslog daemon. In this file, a variable SYSLOG_OPTIONS\
    \ is set to -m 0 by default. Change this line to read\n\n```\nSYSLOG_OPTIONS=\"\
    -m 0 -a /var/named/dev/log\"\n```\n\nThis line is just an example, so it may vary\
    \ depending on your operating system.\n\nIf you have a version of syslog that\
    \ doesn't support the -a option, you must make BIND log to files in the jail directory\
    \ using a logging statement in the BIND configuration file (/var/named/etc/named.conf,\
    \ in this case). When you're specifying the path to access these files, remember\
    \ that / the configuration file refers to /var/named because of the chroot() function.\
    \ To log to /var/named/var/log/namedlog, you specify\n\n```\nlogging {\n\tchannel\
    \ file {\n\tfile \"/var/log/namedlog\";n\t}\n};\n```\n\n10. Change the file that\
    \ starts BIND to use the new configuration.\n\nIn Linux, BIND is often started\
    \ in /etc/rc.local with the command /usr/sbin/named. Change /usr/sbin/named to\
    \ /usr/sbin/named -u named -t /var/named\n\nThis command instructs named to start\
    \ using the user name and chroot automatically to the /var/named directory. The\
    \ daemon is now running in a jail.\n\nIf you follow these steps, named should\
    \ be running and providing service. If it's compromised, it doesn't allow the\
    \ attacker to access other files on your system.\n\n![](img/ef3dfe2cb04fcef67ad22a0599c29f36_232_0.png)"
  merge: -1
  img_proc: true
