    # Dealing with Decimals


    This section introduces a common sticking point for new administrators of IP devices
    and a limitation of IP addressing. An IP address is made up of four octets of
    binary, usually converted to decimal. An example is the IP address 192.168.100.5.
    It refers to the binary address 11000000 10101000 01100100 00000101. These binary
    addresses are required because routers are heart, simple computers, and all computers
    work with binary data. The conversion to decimal is simple matter of notation.


    The octet refers to a collection of eight binary digits. Although they''re in
    decimal, each part of a decimal-notated address, such as 192.168.100.5, is referred
    to as an octet.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_57_1.png)


