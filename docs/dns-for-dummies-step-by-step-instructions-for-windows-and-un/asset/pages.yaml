    help aid security to specific zones and allow for the delegation of zone maintenance
    to users other than the administrator. This feature is useful if you want to allow
    a branch office or group administrator to add their systems to their zone.


    Remember that ACLs can be set only on Active Directory-integrated zones, and the
    feature is available by default when AD-integrated zones are in use.


    To configure the ACL for a zone, follow these steps:


