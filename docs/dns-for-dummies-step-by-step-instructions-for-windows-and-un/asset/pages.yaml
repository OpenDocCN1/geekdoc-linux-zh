    # Serious subdomains


    The simple method for creating subdomains we describe has shortcomings, as we
    tell you at the beginning of this section. If you want to delegate the administration
    of the sea.newdomain.tld domain to another administrator with his own servers
    or to separate the sea.newdomain.tld domain into a separate zone file on your
    DNS servers? This process isn''t complex. Let''s revisit the sample newdomain.tld
    zone file:


    ```

    @ IN SOA dns1.domain.tld.

    hostmaster.newdomain.tld. ( 360000 Serial Refresh 30000 Retry 360000 Expire 360000
    Minimum )

    IN NS dns1.domain.tld.

    acct IN A 192.168.1.5

    ```


    To add a subdomain named sea, you must tell each DNS servers and clients to find
    where the sea.newdomain.tld zone located. You do that by creating name server
    (NS) records in the parent domain. The name server records looks like this:


    ```

    sea IN NS dns1.domain.tld

    sea IN NS dns2.domain.tld

    ```


    You create an record for each DNS server that will host the subdomain. In this
    case, it''s hosted on the same server as the parent domain. This change is the
    only one required in the parent domain. You now must add the subdomain''s zone
    to the DNS servers that will host it. You do that by using the standard method
    in the BIND configuration file, adding a zone directive:'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# Part IV: The Details: Setting Up Your DNS Zones\n\n```\nzone \"sea.newdomain.tld\"\
    \ in (\ntype master;\nfile \"sea.newdomain.tld\";\n);\n```\n\nNote that if the\
    \ zone server is a DNS server for the zone, the zone directive is different (refer\
    \ to Chapter 9). Now the new zone file must be created. Nothing in a subdomain\
    \ zone is different from a parent domain zone file. The zone file should look\
    \ something like this:\n\n```\n@ IN SOA dns1.domain.tld.\nhostmaster.sea.newdomain.tld.\
    \ (\n    : Serial 360000\n    : Refresh 30000\n    : Expire 360000\n    : Minimum\
    \ 360000\n)\n\nIN NS dns1.domain.tld.\nIN NS dns2.domain.tld.\nwsl IN A 192.168.100.109\n\
    ```\n\nThis example creates the wsl host as a member of the subdomain, accomplishing\
    \ the same thing as the simple BIND configuration option. You can verify that\
    \ the subdomain is working successfully using NSLOOKUP, or using the DIG utility.\n\
    \nWith BIND, you can create multiple levels of subdomains by using either method.\
    \ With the first method we describe, the subdomain host records simply have names\
    \ such as wsl.acct.sea as with many levels of subdomains you want.\n\nUsing the\
    \ delegation method is somewhat more complex. You must \"nest\" the NS record\
    \ for each subdomain in its immediate parent zone file. The zone file for newdomain.tld\
    \ would have an NS record for sea, and the zone file for sea.newdomain.tld would\
    \ have an NS record for acct in order to get the subdomain acct.sea.newdomain.tld,\
    \ for example.\n\nYou can also combine these two methods. For example, have an\
    \ NS record in the newdomain.tld zone file for acct.sea that points to the server\
    \ containing the acct.sea.newdomain.tld. All records in the acct.sea.newdomain.tld\
    \ zone then move to the acct.sea.newdomain.tld zone file, thus implementing the\
    \ delegation method. Records for the subdomain sea.newdomain.tld can move to the\
    \ newdomain.tld zone file in the form name.sea because the sea.newdomain.tld subdomain\
    \ using the simple non-delegation method isn't delegated."
  merge: -1
  img_proc: true
