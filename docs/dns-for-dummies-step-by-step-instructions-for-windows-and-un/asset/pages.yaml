- pgno: 210
  md: '# Chapter 11


    # # An Antidote for a Poisoned Cache: DNS Security


    In This Chapter


    +   - DNS security issues

    - Securing DNS servers on Windows

    - Securing BIND servers on Unix


    You would be extremely unwise to think of DNS as a service that doesn''t require
    much in the way of security. Although the method for securing DNS isn''t always
    obvious, it''s important nonetheless. For instance, the act of compromising DNS
    security is often the first step in larger attacks, such as domain hijacking,
    in which a domain name is stolen or the theft of e-mail. DNS security is also
    important in a corporate environment because an attacker could use an insecure
    DNS server to redirect traffic to an untrusted system. A secure DNS infrastructure
    is the first step in preventing this type of attack.


    # ## Potential DNS Security Issues


    DNS has several major security issues. Some are important for all servers, and
    others are specific to certain functions, such as dynamic DNS. Both Microsoft
    Windows DNS and BIND provide a number of security features that can be used to
    customize DNS security for your environment.


    # ## Server security


    One of the most important steps, if not the most important step, for DNS security
    is the security of the server itself. This issue isn''t specific to DNS, but it''s
    important nonetheless. The server must be secure to prevent malicious users from
    usurping the server and then compromising the DNS service.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Part V: Security and Advanced DNS Tricks


    The DNS server (hardware and operating system) should be carefully configured
    to minimize the potential risk from ill-intentioned network users (such as hackers).
    Ideally, DNS is the only application running on the system, especially if the
    DNS server is publicly accessible. A system running only DNS is more easily secured
    because the number of items that you have to secure against misuse is reduced.
    The other reason to isolate services on their own systems is attrition. If one
    system is compromised and it''s running only DNS, that''s a much better situation
    than the compromise of a system running DNS, a Web server, and an e-mail server.


    After one application on a server is compromised, the entire server is almost
    always lost. Hackers often install remote access and control applications if they
    can. Because this installation may or not leave any evidence, you should back
    up data (not applications), format, and then rebuild the entire server from scratch
    if you determine that it was compromised.


    Server security has three general components you need to be aware of:


    +   * Physical security

    * Operating system security

    * DNS server application security


    The first step to server security is hardware security. The servers should be
    in a secure location so that they cannot be accessed directly by unauthorized
    users. A good example of physical security includes placing the server in a secured
    room where only a few people have access. The next step involves securing the
    operating system itself. Although this step varies depending on your operating
    system, many security resources exist for all operating systems. Generally speaking,
    you should ensure that these three areas have addressed:


    +   * Strong passwords: Strong passwords should be at least six characters long,
    contain absolutely no dictionary words (names, places, or verbs, for example),
    include numeric characters, and not make use of repeating characters.


    +   * Restricting remote access authority: To disable remote access (telnet, shell,
    terminal services, and remote desktop, for example) if they''re not needed. If
    remote access services are enabled, grant permissions to use these services only
    to users who need them.


    +   * Disabled user accounts: Some operating systems have anonymous or guest user
    accounts enabled by default. In most cases, these accounts serve no purpose and
    should be disabled or deleted.


    +   * Install patches and security updates: New security risks are regularly identified.
    If you keep abreast of these updates, you can give yourself an edge against anyone
    who would take control of (or disable) your server.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_211_0.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Chapter 11: An Antidote for a Poisoned Cache: DNS Security


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_212_0.png)


    Although you shouldn''t use dictionary words, you can model your password after
    one. For example, the relatively weak password dolphin could become the much better
    39d0lphin6. Notice that the middle of the new password uses character substitution
    (o becomes the middle 0 and l becomes the new 1) to keep the password somewhat
    recognizable.


    The final step for server security is configuring the security of the DNS server
    application. This process doesn''t refer to a secure configuration of the DNS
    server rather to running the DNS server in a secure manner. By default, most DNS
    server applications run with full administrative privileges on the system account
    in Windows and running as root in Unix. You can change the credentials of the
    DNS server so that it runs at a lower privilege level. The importance of running
    the DNS server at a lower privilege level is that if it''s compromised, it cannot
    be used to compromise the entire system. Near the end of this chapter, in the
    section "Running BIND in a jail," we discuss how to run BIND at a lower privilege.


    # External and internal DNS


    Some environments need to have a DNS server for only internal users where no records
    are served to external clients. Other environments — such as ISPs (Internet Service
    Providers) — sometimes need an external DNS server to serve records to outside
    customers. In the greatest majority of cases, though the needs exist for both
    internal (LAN) and external clients. Each of these scenarios has different security
    requirements.


    External DNS doesn''t require much in the way of specialized configuration. The
    external DNS server should be located outside the firewall or in a firewall-controlled
    DMZ. The reason is that access to the server can be restricted and, if it''s compromised
    in any way, it doesn''t threaten the internal network resources. Regardless, you
    still don''t want to have to continually rebuild your DNS server, so it should
    be thoroughly secured.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_212_1.png)


    A demilitarized zone, or DMZ, is a network that is separate from an internal LAN
    but also outside the firewall and not on the public network. The DMZ is used to
    isolate servers that can be accessed by external users in case one of these servers
    is attacked and compromised. The attacker can use the compromised server to attack
    any other systems in the DMZ, but can''t attack any systems on the internal network
    because the DMZ is isolated.


    An internal DNS server is configured differently. You should still configure it
    in a secure manner, but because it''s located within the private network, the
    server is protected by the (presumed) firewall that conceals the rest of the network.
    If recursion is enabled on the internal DNS server, the firewall should be configured
    to allow outgoing connections on the DNS port (53) so that the DNS server can
    retrieve records from other DNS servers.'
