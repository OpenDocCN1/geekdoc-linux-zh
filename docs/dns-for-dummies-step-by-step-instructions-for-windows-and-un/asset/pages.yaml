- pgno: 163
  md: '# Part III: Working with DNS Servers


    # Getting to the Source


    Although you can install BIND by using packages, in some cases you may not want
    or be able to use precompiled packages for installation — for example, if recent
    (or any) packages weren''t available for your system or if you want to make changes
    to BIND that can be made only at the time of compilation. Some people like to
    compile all software from source code to ensure that it''s optimized for their
    systems.


    Installing software programs like BIND from source code is fairly easy if the
    correct compiler and build tools are installed; if not, refer to your system documentation
    for more information. BIND is a well-developed application, and compilation goes
    smoothly on most systems.


    The first step is to download the source code for BIND. The BIND source code is
    available from the ISC FTP site, at `ftp.isc.org`. These steps outline what you
    need to do to get hold of the source code:


    +   1. Using an FTP program of your choice, connect to `ftp.isc.org`.

    2. Log on as anonymous and use your e-mail address for a password.

    3. Browse into the `/isc/bind9` directory.

    4. Locate the latest version of the BIND and open the related directory.

    5. Locate and transfer the appropriate source file.


    The directory uses the BIND version as part of its name. For example, to find
    version 9.2.2 release candidate 1, open the folder named `9.2.2rc1`.


    For example, the source file for 9.2.2 RC1 is labeled `bind-9.2.2rc1.tar.gz`.


    +   6. Find the latest version of BIND.


    We don''t recommend, however, that you use the release candidate or beta versions
    (rc1, rc2, a1, a2, b1, b2, for example) because they may be unstable. Use only
    standard releases (9.2.0 or 9.2.1, for example).


    After you''re in the directory for the latest BIND version, you should see two
