- pgno: 151
  md: '# 132 Part III: Working with DNS Servers


    DNS service will respond. If no addresses are specified, the server responds on
    all IP addresses configured on the server. This setting is often used when a server
    is multi-homed (connected to more than one network) and you want only users on
    specific networks, such as the internal network, to be able to use the DNS server.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_151_0.png)


    Figure 7-36: Configuring on IP addresses the server responds.


    # Finding the host that time forgot: Forwarders


    On the Forwarders tab in the Server Properties dialog box, as shown in Figure
    7-37, you configure DNS servers as forwarders for the local server. A forwarder
    is beneficial in a number of cases. For example, when a forwarder is configured
    on a DNS server and a client requests a DNS record that isn''t hosted on the server,
    the DNS server doesn''t use recursion to retrieve the record but rather requests
    the record from the forwarder (another DNS server). The forwarder performs the
    work of retrieving the record and returns it to the local DNS server, which returns
    it to the client. We talk about recursion in Chapter 3, in the section about getting
    down to business.


    You realize the benefit of a forwarder when the local DNS server has a slow connection
    to the Internet. Rather than the multiple DNS queries required for recursion traveling
    over the slow connection, only one query is made to the forwarder, which ideally
    has a fast Internet connection.'
  merge: -1
  img_proc: true
