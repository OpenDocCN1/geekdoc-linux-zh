- pgno: 276
  md: '# Chapter 15


    # Ten Things Even Experienced People Do to Make DNS Break


    In This Chapter


    +   - Syntax

    - Forgetting the trailing period

    - Incorrectly using @ records

    - Using IP addresses where names are required

    - Using names where IP addresses are required

    - Forgetting to reload the server

    - Failing to increment the serial number

    - Not adding a PTR record for each A record

    - Using TTL values that are too short or too long

    - Unannounced slave servers or MX servers


    It''s time for an author confession. One of us has been working as a senior-level
    system administrator, including working with DNS on both Unix and Windows, for
    a while. He has made changes to configuration and zone files on production DNS
    servers that provide services to hundreds of clients and caused the servers to
    stop responding. That''s not the worst dumb mistake he has ever made, but those
    are stories for another day.


    The key here is that everyone, including experienced systems administrators, make
    mistakes that cause DNS to break. If you''re working with a DNS server, you''ll
    probably make some mistakes too. The reason that breaking DNS is so common is
    that it is extremely picky when it comes to configuration files, especially BIND
    on Unix. By reading over the list in this chapter, you may be able to avoid making
    these simple but easily overlooked mistakes.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 258 Part VI: The Part of Tens


    # Syntax, Syntax, Syntax


    All versions of BIND on Unix are picky about the syntax of their configuration
    files. *Syntax* defines how entries in the DNS configuration files must be formatted.
    In the case of DNS, syntax requires the precise use of specialized punctuation.
    The most important thing to watch in DNS, and the most common cause of problems,
    is syntax of configuration and zone files. Make sure that all semicolons are in
    place and that the SOA record is formatted correctly. Sometimes, even spelling
    mistakes or typos cause problems. If the syntax in the configuration file is incorrect,
    DNS doesn''t start. If the syntax in a zone file is incorrect, zone isn''t loaded.
    These errors are almost always recorded in the server''s log files and usually
    even indicate the line number with the error in the file.


    # Forget the Trailing Period


    Several record types — including NS, MX, and CNAME records — accept DNS names
    as names in zone files in one of two ways:


    +   **Relative names** are considered relative to the zone in which they''re contained
    (hence, the name). With a relative name such as www.domain inside a zone named
    dnsfordummies.tld, the domain is appended to create the fully qualified domain
    name (FQDN) www.domain.tld. This action is important for records such as CNAME
    because you want to create a CNAME record pointing to www.domain.tld within the
    domain.tld zone file, you can simply specify as the record value.

    * **Absolute names** are treated differently. If you want to create a CNAME record
    for www.domain.tld within a different zone, you obviously cannot use www as the
    record value because it appends the domain name of the zone in which the record
    is contained. For this record, the value is www.domain.tld. Note the trailing
    period. It is vitally important because it indicates that the name is absolute.


    The problem with forgetting the trailing period is that DNS thinks that the name
    is relative rather than absolute. Consider a CNAME within a zone named dnsfordummies.tld.
    If the CNAME record value is www.domain.tld with no trailing period, the record
    returned to the client is www.domain.tld.dnsfordummies.tld because that period,
    the domain is appended to the value.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Chapter 15: Ten Things Even Experienced People Do to Make DNS Break


    # # Fail to Keep Your @ in Order


    The record name @ is used to reflect a record with the same name as the zone origin.
    By default, the origin value is set to the name of the zone. (For an explanation
    of how origin directives work in zones, refer to the section in Chapter 9 about
    forward-looking Unix). For example, in a domain name domain.tld, A record @ would
    be for domain.tld by default. An at-sign (@ is often used to assign IP addresses
    to the domain name with no host, which allows Web users to use domain.tld rather
    than www.domain.tld. A few rules regarding @ records aren''t documented, though.
    The main rule is that an @ may not be CNAME. It must be an A record, or else the
    zone doesn''t work. A, CNAME shouldn''t be assigned a value of @. Rather create
    two records for @ and one for the other name. (For more information about these
    record types and the rules for their use, check out the section in Chapter 9 about
    record types.)


    # # Mix Names and IP


    This kind of mistake is quite common. Mixing names and IP may look like a silly
    mistake, but in a busy office or Internet Service Provider (ISP), a person can
    easily get distracted and make mistakes. DNS uses three major record groups:


    +   - Records that take IP address values, such as A records

    - Records that take name values, such as CNAME

    - Records that take other information, such as TXT records that can contain anything


    Other types of records, such as MX and NS records, can take both name and IP address
    values, but those aren''t an issue because they can use either one. In addition,
    SOA records take a variety of information.


    Attempting to use a name value for a record such as A or attempting to use an
    IP address for a record such as CNAME causes lookups for the zone to load improperly
    or not at all. Ensure that you always use the correct type of value for a record.
    If a DNS server is behaving as though it doesn''t have a record that you''re sure
    is supposed to be (either a name or an IP), checking the A or CNAME record format
    is a good place to start.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Part VI: The Part of Tens


    # Don''t Apply


    DNS servers store configuration and zone data in memory. Because of this behavior,
    changes to DNS files are not reflected until the files are reloaded into memory.
    Some DNS servers require a restart after any changes are made to zone or configuration
    files, and others can be reloaded without restarting the DNS application by using
    a specific utility. Regardless of the procedure (which you should be familiar
    with), by ensuring that the changes you have made are loaded and active, you can
    save yourself from lots of headaches. Making a configuration change that appears
    to have no effect can leave you wanting to pull your hair out in frustration.


    # Don''t Increment


    Each zone file (refer to Chapter 9) begins with a start of authority (SOA) record.
    The SOA record contains a serial number for the zone file. Although this number
    is arbitrary, each time a zone file is modified the serial number must be changed
    to a value higher than before. It doesn''t matter whether you increment it by
    one or one million — it just needs to be a larger value. Obviously, you wouldn''t
    want to increment it by one million time you change the zone file because you
    would run into a size limitation on the field — but you could. Incrementing the
    serial number tells the DNS server application that the zone has changed and causes
    the slave to transfer the new zone data.


    # Forget That Pointing Is Okay


    Failing to add corresponding PTR records isn''t so much a mistake as it is bad
    practice. You can add an A record in a zone without adding the corresponding record
    in the reverse lookup zone file, however, with other applications that use reverse
    lookup. A number of applications don''t function properly when a system doesn''t
    have a reverse lookup address defined. For this reason, every time you add an
    A record, you should add a corresponding PTR record in the reverse lookup file
    for the IP address. If you change the address for an A record, the reverse lookup
    should also be changed. If you have a problem that results from a missing PTR
    record, identifying it can be quite difficult because the zone appears to work
    for the majority of other DNS-dependent services.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Chapter 15: Ten Things Even Experienced People Do to Make Break DNS


    # Timeout: Long and Short


    The SOA record for a zone contains four time values:


    +   * Refresh: Controls how often a slave DNS server checks the master server
    for updates.

    * Retry: Controls how often the slave checks for updates from the master if a
    check for an update is unsuccessful.

    * Expire: Controls how long the secondary server keeps the zone while the master
    DNS server isn''t responding; this setting eliminates excessive records.

    * Negative caching TTL (minimum TTL in older versions of BIND): Controls how long
    a slave server may cache a negative response from the zone.


    In addition, newer versions of BIND use a value in zone files named $TTL. The
    $TTL value defines how long records from this zone are cached by other servers.


    All these values are important in determining DNS behavior. If they''re low values,
    the master server gets flooded with requests from the slave servers for updates,
    and all the servers face higher traffic from clients that aren''t keeping records
    in the cache for long. As a result, they request updates more often. If the values
    are too high, however, the client-cached records and secondary DNS server-cached
    zones become stale. That is, if changes are made to the zone, they aren''t reflected
    in the client, and the changes are unavailable, probably causing a service outage.
    Find a balance for these values based on factors in your environment, such as
    the frequency of zone changes and the amount of traffic to your DNS servers. Because
    different zones can have different values, zones that are updated often may have
    shorter values, and more static zones may have longer values.


    # Use Unannounced Servers and MX Records


    The first version of this problem, unannounced slave servers, is less common and
    less of an annoyance than the second, unannounced MX records. Unannounced slave
    servers occur when a DNS administrator configures his server'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 262 Part VI: The Part of Tens


    to be a slave for some zone where the DNS administrator for the primary server
    is unaware that the slave is being added. In this case, the primary server typically
    isn''t set up for the unannounced slave, and zone transfers are requested but
    not carried out. You shouldn''t set up your DNS server as a slave unless you''re
    sure that the primary server is also properly configured.


    The second version of the problem is with unannounced MX records. When you''re
    configuring an MX record, the mail server to which the MX record points must also
    be configured to accept mail for the domain. An unannounced MX record occurs when
    a DNS administrator configures an MX record to point to a mail server without
    informing the administrator of that mail server. The mail server is then sent
    all messages addressed to that domain, but isn''t configured to handle it, so
    in most cases it''s dumped into the postmaster account or discarded. Before configuring
    an MX record, ensure that the mail server is configured to accept mail for the
    domain.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Chapter 16


    # The Top Ten Tips for Maintaining a Manageable DNS Server


    +   In This Chapter

    * Subdomains

    * Consistency tricks

    * Comments

    * include statements

    * Backups

    * Log files


    Although DNS is a relatively simple application, this simplicity encourages bad
    habits among administrators that may lead to problems in the future. This issue
    is especially prevalent on BIND DNS server running on Unix, and the server can
    easily become disorganized with massive zones and randomly placed records. Similar
    issues arise on Windows servers with a lower frequency, but some of the tips in
    this chapter would indeed apply to Windows-based DNS servers. After a server becomes
    disorganized in this way, it becomes virtually impossible to maintain properly.
    You can follow a number of tips to make maintaining your DNS server easier.


    # Slice It Up with Subdomains


    As the number of network hosts increases, making use of DNS subdomains becomes
    an attractive, if not essential, tool for managing DNS information. The unfortunate
    truth is that many DNS domains are barely organized clusters of hosts. Some of
    these domains may contain tens of thousands of hosts. By planning the first step
    (refer to Chapter 2), you can prevent potential organizational issues. You should
    decide how to divide the namespace and therefore which subdomains you will have.
    In all except the largest cases, a single layer of subdomains is enough. These
    subdomains can be based on geographical location, business function, or some other
    grouping.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 264 Part VI: The Part of Tens


    # Save Yourself the Legwork


    DNS administrators commonly build each zone file from scratch and by hand. This
    practice is a good thing if only a few zones are on a DNS server. When many zones
    are on a server, though, you might save yourself from some needlessless suffering
    if you use a standard zone file template rather than build each one by hand.


    This zone file template is similar to your regular zone files. The start of authority
    (SOA) record is mostly filled out, and all the other appropriate records are in
    place, but they have no values. When you''re creating a new zone, you simply open
    the zone file template, add the correct values, and save the result to a new file
    that becomes the zone file.


    # Keep Things Consistent


    You must maintain a consistent look and feel across all your zone files. The tip
    in the preceding section, about using a standard zone file template, contributes
    significantly to consistency in zone files. This consistency greatly eases the
    administrative burden of BIND DNS. One common headache with BIND occurs as the
    result of an administrator''s inadvertently editing the wrong zone file or making
    a change to a zone file using incorrect data or syntax.


    Keeping consistency in your zone files requires in


    +   - How the file is organized: You can quickly find the correct records to change
    without needing to do a search on the file.

    - How the data is presented: Keeping the data in a consistent format helps reduce
    syntax- and entry-related problems.


    # Section Zone Files


    Sectioning zone files can help with administration. Zone files can essentially
    any layout you want, as long as they start with the start of authority (SOA) record.
    Other than that, the records can be in any order so that you can group records
    in logical, rather than sections. In large zone files, you can simply navigate
    to the correct section and find the record you''re looking for or add a new record
    rather than to search the entire zone file (although most text editors have search
    operations).'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Chapter 16: The Top Ten Tips for Maintaining a Manageable DNS Server


    # Comment Your Code


    Just like programming or scripting languages, zone files can contain comments.
    Comments are used to explain the purpose of certain records, note when changes
    were made, and keep sections of zone files separate. Comments in zone files are
    prefixed by semicolons, like this:


    ```

    @ IN SOA dns1.domain.tld. postmaster.dns1.domain.tld. (

    100111106 : Serial

    360000 : Refresh

    30000 : Retry

    360000 : Expire

    360000 ) Minimum

    IN NS dns1.domain.tld.

    ;PTR Record for local system

    1 IN PTR localhost.domain.tld.

    ;PTR Record for Name Servers

    59 IN PTR dns1.domain.tld.

    60 IN PTR dns2.domain.tld.

    ```


    # Batteries Not Included

    (include Statements)


    Include statements (which we describe in Chapter 9 and which have nothing to do
    with batteries) are used to separate a single zone or configuration file into
    multiple files for ease of administration. Using include statements is an extreme
    example of sectioning zone files (refer to the section "Zone Files," earlier in
    this chapter). You use an include file whenever you have a long configuration
    file, such as when you have a large number of zones or zones with a large number
    of records.


    An include statement is simple to use. In a BIND 9 configuration file, simply
    add this statement:


    ```

    include "filename";

    ```


    The file that''s specified must contain configuration directives, just like a
    standard configuration file. Those directives, although stored in a separate file,
    are treated as part of the original configuration file.


    Using include statements in zone files is a little different. The include state-ment
    in a zone file looks like this:


    ```

    $INCLUDE filename

    ```'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 266 Part VI: The Part of Tens


    When you use the $INCLUDE statement in a zone file, everything in the specified
    file is treated as part of the original zone file.


    # Back Up in Case You Blow Up


    Many administrators are guilty of failing to adequately cover their bases when
    making configuration changes. Make the following line your mantra: "Make a backup
    copy before making configuration changes." If you know that your current configuration
    works, you should make a copy of that file (named.conf.1102002, for example) before
    you edit the original to make changes. That way, if the changes tank your DNS
    server, you have a quick way to switch back to the original configuration. This
    strategy is equally valid for any configuration file, the BIND configuration,
    zones, and the RNDC configuration.


    # Make a Log and Check It Twice


    An important task that many administrators fail to regularly is to check the DNS
    server log files, for both Microsoft Windows DNS and BIND on Unix. Checking the
    server logs regularly is important on both systems because that''s where you find
    evidence of configuration problems on the server. Little issues now may balloon
    into big issues in the future. The configuration problems may also have gone unnoticed
    simply because nobody has accessed a certain zone yet.


    To check the DNS server logs in Microsoft Windows, you must use the Log Viewer.
    Click the Start button and choose Programs+Administrative Tools+Event Viewer.
    In the left pane of the Event Viewer, select the DNS Server object, as shown in
    Figure 16-1.


    The events relevant to the DNS server are shown in the right pane of the Event
    Viewer. Each event has a severity indication of either information, warning, or
    error. An error designation indicates a complete failure, a warning designation
    indicates an event that could contribute to a loss of service, and an information
    designation denotes an event that isn''t detrimental to system performance. To
    view an event, double-click it in the right pane. The Properties dialog box appears,
    as shown in Figure 16-2.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Chapter 16: The Top Tips for Maintaining a Manageable DNS Server


    Figure 16-1: Using the Event Viewer to view the DNS server log.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_286_0.png)


    Figure 16-2: The details for a selected event.


    The Event Properties dialog box shows the specific information for the event and,
    in the case of an error or warning, often provides suggestions for how to repair
    the problem. After the problem has been rectified, the event doesn''t appear again
    in the Event Viewer.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 268 Part VI: The Tens


    For BIND on Unix, the logs are stored in a text file. Depending on how your BIND
    configuration is set up, the logs may be stored in a variety of places. By default,
    BIND uses the Unix syslog facility to store DNS log entries in the system log.
    This file, typically /var/log/messages in Linux and /var/adm/messages in Solaris,
    varies with other versions of Unix.


    You can send the logs for BIND to other files by using a logging directive, which
    directs BIND to another location in which to put the log files. If a logging directive
    is in the BIND configuration file on your system, you must look in the specified
    files for log information.


    The /var/log/messages file from a Linux system BIND 9 is shown in Figure 16-3.
    The command cat /var/log/messages was used to view the file, although you can
    also use the more or tail command.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_287_0.png)


    As you can see in the figure, a problem occurred when BIND starts. When BIND starts
    successfully, minimal information is saved to the log. Although configuring BIND
    is fairly difficult, its logging fixing any mistakes takes easily. In the third-last
    line of the message file, BIND specifies the error (missing semicolon) in the
    configuration file and specifies the problem on line 20 of the file. You can navigate
    to it, and add the missing semicolon.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Chapter 17


    # The Top Ten DNS Server Design Considerations


    +   In This Chapter

    - Security

    - Redundancy

    - Location

    - Minimization

    - RAM

    - CPU

    - Network bandwidth

    - Maintainability

    - Hardware quality


    Not everyone has the experience necessary to design solutions for infrastructure-level
    applications, such as DNS (or for Web and mail, but that is another book topic).
    If you follow a basic set of guidelines, though, you can have a stable and scalable
    DNS server without hassle. Stability and scalability are the two qualities that
    all architects strive for. Of course, DNS servers can be implemented in other
    ways; every system administrator seemingly has their own tricks for configuring
    a system. Keep in mind that every clever trick you use in configuring a system
    is one more headache you have when you''re troubleshooting the system later on.
    Strive for simplicity, and your sanity will thank you.


    # Keeping the Server Secure


    Security is paramount when you''re configuring a DNS server. (Refer to Chapter
    11 for an extensive description of DNS security.) You may think that security
    is truly important only in an Internet Service Provider (ISP) setting,'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 270 Part VI: The Part of Tens


    to avoid Web page hijacking or e-mail spoofing, but it''s equally important in
    a corporate setting. DNS security is quite important in an ISP. If an intruder
    gains access to your DNS server, he can point A records to other servers containing
    defaced pages, which is as good as gaining access to the original Web server itself
    defacing the page. The intruder''s access can also be used to change the MX record
    for a domain, which has even worse consequences. By pointing the MX record to
    a mail server, the intruder controls and takes ownership of the domain by submitting
    changes to the domain registry. Note that this inefficiency is not so much a fault
    in the DNS infrastructure as it is the fault of the domain administrators who
    use MAIL-TO as an authentication method for their domains.


    DNS security is equally important in a corporate setting, although it has a more
    obtuse subtitle. The problem in a corporate environment is the same as in an ISP:
    An intruder can change DNS records to point to a server he controls. In this case,
    he can steal important data by making users think that it is going to a real server
    when it is really going to the rogue server. Remember that most attacks on corporate
    networks come from inside the corporation, so DNS security is important even if
    you have a firewall or no Internet connection.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_289_0.png)


    DNS does not run in a vacuum. Not only does your DNS service need to be secured,
    but the operating system you use and the physical server also need to be thoroughly
    examined and tested. Even if you have secured the DNS services provided, all is
    for naught if a network intruder can gain administrative- or root-level control
    of the server that is hosting DNS.


    Perhaps most obvious, you should physically secure the server in a location where
    only authorized users can gain access. You should also restrict, using operating
    system policies, nonresident personnel from being able to log on to the server.
    Regularly check with your operating system vendor for software updates and security
    alerts. The security of the server that is hosting DNS is your top priority —
    if you let it, you''ll probably regret it.


    # In Case of Emergency


    Planning out your DNS infrastructure, you always need to have at least two DNS
    servers for the purpose of redundancy. If one server goes down, the other can
    still serve clients. DNS servers in many cases are not redundant, but that situation
    is absolutely not recommended. If you''re using a single DNS server and it fails,
    you will probably get the unenviable task of answering nasty phone calls.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Chapter 17: The Top Ten DNS Server Design Considerations 271


    You can provide DNS redundancy in two ways:


    +   - Master/slave: In the traditional master/slave DNS relationship, (one or
    more) DNS servers load data from the master server on startup and at intervals
    specified in the start of authority SOA record for each zone. This method of redundancy
    has one huge advantage: When a zone file is changed, the changes are automatically
    propagated to the slave servers. This process normally happens as soon as the
    changes are made if the NOTIFY DNS feature is supported, and it happens after
    the time in the SOA record if NOTIFY is not supported.

    - Master/slave DNS server relationship has a disadvantage also: If the master
    goes down, the slave is restarted, and the zone data cannot be transferred. Also,
    if the master goes down and isn''t restored by the time the DNS record becomes
    stale (because it cannot update from the master server), the zone is no longer
    accessible.

    - Multiple master: If you''re more concerned with having DNS available at all
    times rather than the convenience provided by a master/slave configuration, you
    can use a multiple master configuration. The concept is simple: All DNS servers
    are master servers for each zone. The most difficult part of having multiple master
    DNS servers comes when a change is made to a zone file or the DNS configuration.
    The change must be made to every master DNS server and isn''t automatically propagated.


    # Don''t Put all the Eggs in One Basket


    The location of the DNS servers is important for a number of reasons. (This section
    overlaps slightly with the preceding sections.) Most environments use two DNS
    servers — a master and slave or if they''re caching only — although no limit exists
    on the number of servers you can have.


    You must consider separate but related issues for the DNS server location:


    +   - Placement in relation to a firewall: In most cases, internal DNS servers
    are placed on the internal network, and externally accessible servers are placed
    in the demilitarized zone (DMZ) of the firewall, which is secure but also accessible
    from the public network. If you have only one set of DNS servers for both internal
    and external DNS (although that arrangement isn''t recommended), you should place
    them in the DMZ and have internal users access them from the internal network
    rather than place a hole in your firewall for external DNS requests.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 272 Part VI: The Part of Tens


    +   Placement on your network segments geographically or in some other logical
    fashion: You have a number of reasons to place your DNS servers on separate network
    segments and separate locations —primarily, redundancy. If one network segment
    goes down, even an entire location is lost because a disaster of some sort, you
    can still provide DNS service. In addition, performance increases for internal
    DNS servers may result if you configure systems to use the local DNS server first
    and use the remote DNS server if the local server is down. Having at least one
    internal DNS server at each geographical location is common practice.


    # Less Is More


    When it comes to system architecture, two schools of thought are prominent: minimization
    and consolidation. Once antiquated thinking (putting many applications on one
    server) is coming into style again as the footprint of the data center (the amount
    of space taken up by all servers) is becoming an issue. Placing numerous applications
    on one expensive, high-capacity server is often cheaper and saves on the monthly
    cost of having numerous cheaper servers.


    For applications like DNS, minimization is the way to go. Minimization refers
    to having a smaller server with only one application — in this case, DNS is an
    ideal candidate for minimization because it makes the maintenance of the system
    easier and can provide more security. DNS also allows the system to be scalable
    because no other applications are competing for resources.


    When you''re planning for minimization, no applications other than DNS should
    be running on the server. Most operating systems come with a variety of network
    services that run by default, and all they should be disabled. This arrangement
    also makes the system much more secure because DNS is the only way to attack.
    If unnecessary applications are running on the system, they provide more targets
    for an attacker.


    # Thanks for the Memory


    Random Access Memory, or RAM, is probably the most important consideration in
    selecting hardware for your DNS server. When the DNS service starts, the entire
    DNS database of zone files is loaded into memory for speed purposes. Serving a
    record from memory is much faster than serving it from'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Chapter 17: The Top Ten DNS Server Design Considerations


    disk. Cached DNS records are also stored in memory. For this reason, the amount
    of RAM on the server must be at least equal to the size of the DNS database plus
    the amount of RAM required by the operating system. This is typically not an issue
    even the cheapest systems come with at least 128MB of RAM, and many come with
    256MB. Most servers have 512MB or more. Having a DNS server with a database of
    zone files more than a few megabytes is quite uncommon. Even in large ISPs, a
    large DNS database would be split over multiple servers, with a portion of the
    DNS zones or even on specialized DNS hardware to minimize the load on the DNS
    servers. still, whenever you''re choosing hardware, consider the size of your
    DNS database and the amount of traffic your server will have means more cached
    records if caching is enabled.) Choosing twice as much memory as you think need
    is always prudent, especially because memory prices are lower than ever.


    # Processing Power!


    The central processing unit (CPU) you choose for your DNS servers also makes a
    difference in the performance of your DNS infrastructure. Small DNS servers with
    no requirements other than serving zones and caching don''t require much CPU power.
    DNS servers are often run on older systems, such as Intel 486-based systems and
    Sun IPX systems. The CPU requirements increase in two cases, though:


    +   When the load on the system increases to high levels: A DNS server with one
    request per second runs fine on a low-end system; when the number of requests
    increases, however, the CPU load goes up. Also, zone transfers are fairly CPU
    intensive, and a server pair (master and slave) with many zones requires more
    CPU power than a pair with only a few zones.


    +   When features beyond the basics are used: If you implement security features
    such as DNSSEC, which uses encryption, the CPU requirements increase exponentially
    because encryption requires lots of processing power. Other, advanced DNS features
    require more CPU power than does a standard DNS server.


    # Room to Move: Bandwidth


    The network bandwidth consideration is a simple one. If you have a busy DNS server,
    it requires more bandwidth than a less busy server. This bandwidth requirement
    is carried all the way to the network backbone. For example, if'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 274 Part VI: The Part of Tens


    you have a busy DNS server with a 100 Mbps connection to the switch but only a
    1.54 Mbps T-1 Internet connection, the T-1 becomes a bottleneck and user requests
    are slow.


    You can often solve the network bandwidth consideration in a corporate environment
    by simply adding a slave DNS server at remote sites. For example, if a master
    DNS server at the head office has a slow network connection to a branch office,
    you should place a slave server at the branch office. Rather than have all DNS
    requests travel to the head office, only zone transfers take over the slow connection.
    Even more of an advantage can be gained if the branch office server is also a
    caching DNS server with an Internet connection because those requests are served
    locally rather than from the head office.


    # Maintenance Free?


    Many DNS servers have been poorly maintained, which have changed many times, are
    fairly old, or are just generally well administered. Factors such as these contribute
    to DNS servers that are quite literally a mess. Maintainability is an important
    factor in designing a DNS server because the server administrators must be able
    to easily troubleshoot and make changes to the system. A system that is messy
    can contribute not only to difficulty for the administrator but also to mistakes
    that can cause problems or even total outages.


    You must make a number of considerations for designing an easily maintained DNS
    server. The simplest DNS server with only a handful of zones doesn''t require
    a large amount of planning; even in this case, though, you may find it hard to
    judge where you will be in a year or several years when the server may be in.
    If no planning was done in the beginning and a large number of zones are added,
    the server becomes difficult to maintain over time. You can keep the DNS server
    organized in many ways, such as separating configuration and zone files into sections
    and even using include statements to divide the DNS configuration into multiple
    files. This strategy is useful if you have a large number of zones.


    # There Is No Free Lunch


    In various environments, we have seen DNS server hardware from good-quality, name-brand
    Unix servers to ''beige box'' PCs with their covers missing and their hard drives
    hanging by their cables. Needless to say, your'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Chapter 17: The Top Ten DNS Server Design Considerations 275


    choice of hardware makes a huge difference in the reliability of your DNS services.
    DNS is often seen as an unimportant service and is relegated to some castoff,
    secondhand computer or a cheap system. Now, more than ever, high-quality, name-brand
    hardware is reaching low price points — as low as $1,000. You may be able to purchase
    a cheap PC for a little less than that, but the tradeoff in reliability usually
    isn''t worth the price difference.'
  merge: -1
  img_proc: true
- pgno: 295
  md: <!-- no content -->
