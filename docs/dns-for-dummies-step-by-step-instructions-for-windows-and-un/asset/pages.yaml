    # Dynamic DNS security


    Dynamic DNS is another feature that is enabled by default for Active Directory-integrated
    zones, although it isn''t enabled by default for nonintegrated zones. Dynamic
    DNS updates a security vulnerability because an attacker could pollute the DNS
    zone information.


    Active Directory-integrated zones and nonintegrated zones have different security
    requirements. With nonintegrated zones, no security measure is available except
    for some basic rules. Dynamic DNS shouldn''t be enabled for nonintegrated zones
    unless absolutely necessary.


    Active Directory-integrated zones use security measures to avoid rogue updates.
    Only authenticated users may submit DNS updates using a security method known
    as GSS-TSIG for transaction security.


    To change DNS settings:


    +   1. Open the DNS Management snap-in by clicking the Start button and choosing
    Programs-Administrative Tools from the menu.


    +   2. Locate the zone to configure in the left pane, right-click, and choose
    Properties.


