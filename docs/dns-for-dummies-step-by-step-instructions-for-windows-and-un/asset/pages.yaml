- pgno: 332
  md: '# Appendix B: Using Webmin for BIND Administration 313


    In the Default zone settings section, you can set the options that are normally
    set in the zone directive in the named.conf file, including servers allowed to
    perform zone transfers and hosts allowed to query the zone. You can set strict
    name checking in zones and responses and enable the DNS NOTIFY feature.


    # Existing DNS zones


    The Existing DNS Zones section of the BIND module has two uses: modifying and
    removing zones and adding new zones. Working with an existing zone is simple:
    You locate the zone and click it to open the Edit Master Zone page, as shown in
    Figure B-19. At the top are the record types that can exist in the zone with the
    number of record that exists in the zone in parentheses.


    By clicking any of the record types, you can add or modify a record of the selected
    type, as shown in Figure B-20. Add a record by entering the relevant information
    and clicking the Create button. You can also have the reverse lookup record added
    automatically by selecting that option. This step saves you from the work of adding
    the record manually, which is typical in BIND. To edit an existing record, click
    its name on the list. You can then make changes on the Edit Address page and click
    Save or click the Delete button to remove the record.


    The Edit Zone Parameters page allows you to modify information in the zone''s
    SOA record if you want to be different from the information configured on the
    Zone Defaults global configuration page. The Edit Zone Options page is the same
    for the only zone options, such as allowed hosts for zone transfers, dynamic updates,
    and queries.


    On the Edit Records page, you manually edit records in the zone. however, the
    syntax isn''t checked and the zone serial number isn''t incrementated. The Record
    Generators page, as shown in Figure B-21, is more interesting, though.


    On this page, you can create a series of records using a set pattern. In some
    environments, a series of host names is used — as host1, host2, and host3 or ws1,
    ws2, and ws3, for example — and these host names are often associated with IP
    addresses. Note that the brand-new Record Generators feature may not function
    properly yet.


    The last option on the Edit Master Zone page is the Delete button, at the bottom
    of the page. Clicking this button removes the zone. You''re prompted before the
    zone is deleted, though.'
  merge: -1
  img_proc: true
