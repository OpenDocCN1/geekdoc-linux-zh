- pgno: 180
  md: '# Chapter 9


    # The Basics: Zones and Records


    In This Chapter


    +   - Zones defined

    - Records defined

    - Configuring zones and records in Microsoft Windows DNS

    - Configuring zones and records in BIND


    The most basic configuration elements in a DNS server are zones and records. In
    earlier chapters of this book, we tell you how DNS works and how to install and
    configure a DNS server. We would be remiss if we didn''t take a serious look at
    the concepts of zones and records because they make DNS work.


    First on the agenda are some definitions. A zone is essentially the name used
    for a domain in DNS. Each domain name is a zone and has a zone file. The zone
    file contains all the records for the zone. A record is the DNS information linking
    a name to an address. Records should be familiar to you if you have worked with
    databases.


    # Understanding DNS Zones


    As we mentioned, zones are essentially domains within a DNS server that contain
    records for that domain. The slight difference in definition between a zone and
    a domain, however, is that a domain can contain subdomains in a hierarchy, although
    each subdomain is defined as a separate zone. No hierarchy exists per zones, although
    they can be linked to one another. Zone information is stored in zone files, which
    are simply text files containing the zone data. Each domain and subdomain in your
    DNS server is a zone. These individual zones are essentially containers for the
    associated records


    DNS has essentially two types of zones: forward lookup and reverse lookup. We
    describe them both in this section.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Forward lookup zones


    Forward lookup zones are the zones a normal user comes across most often on the
    Internet. These zones are, from a purely superficial level, the more useful of
    the two zone types. Most users on the Internet continually interact with forward
    lookup zones as they use the network, but probably never interact directly with
    a reverse lookup zone.


    The reason that forward lookup zones are used more commonly is that users can
    resolve a host name to an IP address. After a user enters a DNS name in her DNS
    client (browser or e-mail client, for example), the DNS client uses the forward
    lookup zone to determine the IP address associated with that DNS name. In many
    other cases, forward lookup zones are used.


    Like all DNS zones, the forward lookup zone begins with an SOA record, followed
    by name server records that specify all the name servers (master and slave) for
    the zone. The remaining records in the zone usually include an MX record that
    specifies which host receives e-mail for the domain and of A records that reference
    host names to IP addresses. Of course, forward lookup zones can, and often do,
    contain other types of records.


    # Reverse lookup zones


    A reverse lookup zone is a special type of zone used by DNS clients to determine
    a host name when the IP address is known. Although DNS can theoretically provide
    client services without a reverse lookup zone, the DNS standard requires that
    every A record has a corresponding record in a reverse lookup zone. The DNS itself
    doesn''t rely on having a reverse lookup configured for each host, but many applications,
    such as SSH and some secure Web applications, do rely on reverse lookups.


    # DNS Records


    Records are the lowest-level component in a DNS server. Whenever your DNS client
    performs a DNS lookup, it''s making a query that retrieves a record of some sort.
    (We describe the many different types of records in the following section.) Each
    zone file contains several individual records. The zone must contain at least
    a start of authority (SOA) record. Along with identifying the server as authoritative
    for a given domain, the SOA record contains additional information, such as time-to-live
    (TTL) values.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Chapter 9: The Basics: Zones and Records


    Although a zone can exist with only a SOA record, it wouldn''t prove to be useful.
    If that were the case, no information other than the TTL values and other SOA
    information could be queried for that. Not surprisingly, in order for a zone to
    be useful, it must contain other records. Most zones contain name server (NS),
    mail exchanger (MX), and host (A) records, although a wide variety of record types
    are available. The following section lists all the down-and-dirty information
    about the possible DNZ record types.


    # Record Types


    Many record types are available for use on DNS servers. Some, as host records
    (A), are more common than others; some record types are hardly used in practice.
    The most common records include the ones in this list:


    +   - Start of Authority (SOA): The SOA record must exist for every zone. It defines
    the attributes for the zone, such as the TTL for caching, the zone administrator''s
    e-mail address, and the master name server for the zone. The SOA record also contains
    a serial number that must be incremented each time the zone data is changed, which
    tells the DNS that the zone data must be reloaded. The serial number is arbitrary,
    it always changes to a higher number each time the zone file is edited.


    +   - Name Server (NS): Most zones contain NS records, which define authoritative
    name servers for the zone. Each name server, master or slave, should have a name
    server record in the zone file.


    +   - Mail Exchanger (MX): Mail exchanger records have one use in a zone: they
    instruct other systems which accept e-mail for a given domain. All e-mail for
    a domain @domain.t always goes to the same server or group of servers. A basic
    configuration consists of a single MX record with a value to the mail server for
    the domain. You can also have a number of MX records pointing to different servers,
    for two reasons. When the records have equal preference values, they can be used
    to balance the load between two or more mail servers (the mail server with the
    preferred record gets all mail to the domain by default). Only if the highest
    preference server goes down the next most preferred server receive the mail. This
    process continues for as many MX records as in the zone. This configuration is
    used for failover so if the default mail server goes down, the secondary (or tertiary,
    or so on) mail server receives mail for the domain and holds it until the main
    mail server can retrieve it.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 164 Part IV: The Details: Setting Up Your DNS Zones


    +   Host (A): A host, or A record, is the most common type of DNS record. It’s
    simply used to map a host name to an IP address. A records are used for just about
    everything on the Internet except for mail routing. Whenever you connect to a
    Web site, use a database, or ping another system, you''re most likely using the
    A record for the target host. A record simply takes the IP address value of the
    host it''s referencing.


    +   Canonical Name (CNAME): A canonical name, or CNAME, is a fancy way of describing
    an alias for a host. In many cases, you may want to have more than one DNS name
    for a host, including a Web site with more than one name. You can accomplish this
    task in two ways. The first is to use more than one A record with different names
    but the IP addresses. This strategy poses a problem, however: if you change the
    IP address of each record pointing to the same host. You can easily miss one when
    you have more than one, especially if the person making the change didn''t create
    the records and isn''t aware that more than one A exists for the host. This problem
    is solved by using the other method of assigning more than one name to an address:
    CNAME records. To establish multiple hosts for a system using CNAME records, you
    first set A record for the host and then add CNAME records. The CNAME records
    have information that points to the CNAME back to the A record you defined. When
    the host''s IP address subsequently changes, the single A record is changed and
    all the CNAME records automatically point to the new.


    +   Pointer (PTR): A pointer record is essentially the opposite of an A record.
    Whereas an A record is used to provide an IP address when the client knows the
    DNS host name, a PTR record is used to provide a host name when the IP address
    is known. PTR records are used in reverse lookup


    +   Text (TXT): A TXT record can contain any information. Unlike the other record
    types that require a specific type of value (name or IP address), a TXT record
    can have any value. The problem with TXT records, though, is that clients have
    almost no way to retrieve them unless the clients specifically request them using
    a command-line DNS client. Hardly any applications make use of TXT records.


    +   Host Information (HINFO): A HINFO record is similar to a TXT record in that
    it can have a freeform value. The HINFO record was originally used for a specific
    purpose — unlike the TXT record, which has no specific purpose. The HINFO record
    was intended to hold the hardware type, operating system type, and version of
    a host. You find that the HINFO record is seldom implemented, though: Administrators
    don''t want to divulge any information about the hosts on their networks because
    it could be used by an attacker.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Chapter 9: The Basics: Zones and Records


    # 165


    +   - Service Locator (SRV): The SRV record is designed to allow DNS clients to
    find specific services on the network, such as printers or file servers, rather
    than specific hosts. Although this record type isn''t widely implemented, it does
    form a cornerstone of the Microsoft Windows Active Directory infrastructure. The
    SRV records allow a user to contact a service by knowing the service type rather
    than the specific host where the service resides (using an A record).

    - IPv6 Host (AAAA): The IPv6 version 6 host record type is similar to the Record
    in it maps a host name to an IP address value. The difference, though, is that
    an AAAA record is used to map a 128-bit IPv6 address to a host name rather than
    the traditional 32-bit IPv4 value in an record. IPv6 has not seen the expected
    widespread implementation; a series of fixes have been made to IPv4 to extend
    the useful lifespan of its address.


    More DNS record types exist than just those in this list. In addition to the listed
    types, other record types are either nonstandard or standard and are rarely used.
    In the real world, most system administrators use only SOA, A, MX, and PTR records
    with the occasional CNAME thrown in for good measure. Records other than those
    are rare.


    # What is IPv6?


    Internet Protocol version 6 is a replacement for the current king of networking
    protocols, IPv4. Although IPv4 has served the Internet well and has enough flexibility
    to accommodate the millions of network customers making use of it, some critical
    flaws may become more serious as the number of networks accessing the Internet
    increases. Most notable problem is address exhaustion. IP addresses are broken
    into two groups: public and private. Public IP addresses must be unique among
    all hosts on the Internet. Frankly, they are all for the most part taken. New
    users and providers are limited to obtaining addresses from other address holders.
    This exhaustion may force providers to make do fewer and fewer IP addressable
    devices, and various


    issues — from an inability to provide connectivity to congestion — may result.
    The answer is an addressing scheme with more address space and environments.

    The IPv6 addressing protocol has been slow to penetrate networks, and the final
    specifications for the protocol aren''t set in stone. Many newer operating systems
    (Linux, Windows XP, and OS X, for example) have support, or can be configured
    to support, IPv6. With this feature enabled, many sites allow IPv6-based connections.
    For all the details about the progress of the IPv6 protocol, check out the IPv6
    Web site: www.ipv6.org. To make use of IPv6 on the Internet, you need to have
    support from the IPv6 backbone, or 6bone. For more information, see www.6bone.net.'
  merge: -1
  img_proc: true
