- pgno: 169
  md: "# 150 Part III: Working with DNS Servers\n\nThe BIND configuration file, usually\
    \ named named.conf, is normally located in /etc/. If the file has a different\
    \ name or is in a different location, you can point BIND to the file using a command-line\
    \ option when BIND is started. The BIND configuration file is quite complex, and\
    \ the syntax must be exact or else BIND doesn't run.\n\nThe configuration file\
    \ must have at least a few critical statements in place. The named.conf file always\
    \ starts with an options section followed by zone definitions and an optional\
    \ configuration area at the end of the file. Here's a sample named.conf file:\n\
    \n```\n/*\n * Comments can be placed like this\n */\noptions {\n    directory\
    \ \"var/named\";\n}\nzone \"sample.tld\" in {\n    type master;\n    file \"sample.tld\"\
    ;\n}\nzone \"sample_slave.tld\" in {\n    type slave;\n    file \"sample_slave.tld\"\
    ;\n    masters ( 192.168.1.1 );\n}\n```\n\nThis sample configuration file sets\
    \ the zone directory to /var/named using the directory option and defines two\
    \ zones. The directory option must be specified to tell BIND where to look for\
    \ zone files. In most cases, zone files are stored in /var/named purely as a standard\
    \ convention. You can place them in any directory you want.\n\n![](img/ef3dfe2cb04fcef67ad22a0599c29f36_169_0.png)\n\
    \nYou most likely need to create the directory /var/named (or whatever directory\
    \ you choose for zone files). Type mkdir /var/named from a shell prompt to create\
    \ the directory.\n\nThe entries in the configuration file tell BIND which zones\
    \ it's hosting. Zones can be either master or slave zones (refer to Chapter 3\
    \ for a refresher on zone types). Master zones require zone files, and slave zones\
    \ are created automatically, but you must specify the DNS servers that are masters\
    \ for the zone.\n\nBefore wandering too far off-track into zone files, find out\
    \ more about the BIND configuration file. It can contain a wide variety of options.\
    \ To see the complete list of options, type man named.conf from within a terminal\
    \ session."
  merge: -1
  img_proc: true
- pgno: 170
  md: "# Chapter 8: Unix Domain Name Servers\n\n# # How to make cache\n\nIn one special\
    \ case, you must create a special kind of zone. If you want to run a caching name\
    \ server, you must create a root hints zone file. (We tell you more about this\
    \ topic in a second.) A caching name server is the main type of DNS server used\
    \ to clients. A caching name server performs recursive lookups. Whenever a client\
    \ asks the DNS server for a record and that server doesn't have that particular\
    \ record, it queries the correct server and returns the record to the client.\
    \ A caching DNS server, such as BIND, also keeps that record for a set period\
    \ in order to serve the record without having to query the other server.\n\nThe\
    \ root hints zone entry must be added to the BIND configuration file:\n\n```\n\
    zone \".\" in {\n    type hint;\n    file \"db.cache\";\n};\n```\n\nThe root hints\
    \ file is normally named db.cache, but you can call it anything you choose. The\
    \ root hints file contains a list of the root DNS servers. It must be kept-to-date,\
    \ but it's a fairly easy process. You can create the root hints file automatically\
    \ using DIG:\n\n+   1. **Change the directory to your file directory (typically,\
    \ /var/named).**\n2. **Type the command dig @root-servers.net ns > db.cache.**\n\
    3. **Type cat db.cache to ensure that the file was created correctly.**\n\nA typical\
    \ root hints file would look like this:\n\n```\n <<>> DIG 9.2.0 << @root-servers.net\
    \ . ns\n:: global options: printcmd\n:: Got answer:\n  >>HEADER<- opcode: QUERY,\
    \ status: NOERROR, id: 7422\n  :: flags: qr aa rd; QUERY: 1, ANSWER: 13, AUTHORITY:\
    \ 0, ADDITIONAL: 13\n```\n\n```\n:: QUESTION SECTION:\n      IN NS\n  518400 IN\
    \ NS B.ROOT-SERVERS.NET.\n  518400 IN NS J.ROOT-SERVERS.NET.\n  518400 IN NS K.ROOT-SERVERS.NET.\n\
    \  518400 IN NS L.ROOT-SERVERS.NET.\n  518400 IN NS M.ROOT-SERVERS.NET.\n  518400\
    \ IN NS I.ROOT-SERVERS.NET.\n  518400 IN NS E.ROOT-SERVERS.NET.\n```"
  merge: -1
  img_proc: true
