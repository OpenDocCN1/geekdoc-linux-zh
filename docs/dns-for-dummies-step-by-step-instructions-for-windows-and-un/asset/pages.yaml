- pgno: 116
  md: '# Chapter 6: Using the DNS Clients on Your System


    # WHOIS


    Every domain registered on the Internet is registered to a person or organization.
    You have to have a way to see exactly who has registered a name: Use WHOIS. The
    WHOIS utility is a DNS-related client, although it isn''t used to retrieve DNS
    records in the traditional sense. NSLOOKUP and DIG are used to query a DNS server
    and retrieve records from its database. WHOIS, on the other hand, is used to query
    a WHOIS server for information about a specific domain name.


    WHOIS is used to determine who has registered a domain name, such as domain.com.
    The issue with WHOIS is that you need to query the correct server to get the information
    you need. For example, you can query the VerSign/Network Solutions WHOIS servers
    for .com, .net, and .org domains, but you must use a different server for other
    domains, such as .ca or .uk.


    # WHOIS in Windows


    Windows doesn''t include a WHOIS client by default. Some Windows WHOIS clients
    are available, but they are not common. Rather than use an actual WHOIS client,
    many people use Web-based WHOIS services. The most common is on the VerSign/Network
    Solutions Web site, at www.netsol.com/cgi-bin/whois/whois, as shown in Figure
    20.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_116_0.png)


    Figure 6-20: The Network Solutions/VerSign online WHOIS tool.'
  merge: -1
  img_proc: true
