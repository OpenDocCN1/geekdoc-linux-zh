  md: '# Chapter 10


    # Using Subdomains


    # In This Chapter


    +   - Configuring Microsoft Windows DNS subdomains

    - Configuring BIND subdomains


    If you read Chapter 9, you may recall that zones contain the records that are
    served to clients. At some point, however, your zone files become so full of records
    that they become unwieldy. It may not happen in a smaller office environment,
    but when you have a larger organization with multiple IP address ranges, you may
    need to consider splitting your zones into subdomains.


    In Chapter 2, we explain that a domain is the highest-level name that belongs
    to you — for example, domain.tld. Subdomains encompass anything below that, such
    as sea.domain.tld. Although this example may look like a host, it can also be
    a subdomain and contain hosts such as ws1.sea.domain.tld. You can name your subdomains
    anything you want. Common subdomains are named after business units or geographical
    locations. Your subdomains should have a name that is logical and somehow describes
    the records contained within.


    # Configuring Subdomains

    in Windows DNS


