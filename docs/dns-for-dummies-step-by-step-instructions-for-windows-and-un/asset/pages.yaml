    Everybody WINS (they used to, anyways)

    On the WINS tab, you can enable forward WINS lookup for a zone. When the WINS
    lookup option is enabled, DNS requests that cannot be fulfilled by the local server
    or through recursion are fulfilled by WINS instead. When WINS lookups are enabled,
    special WINS records are created in the zone. You never use this feature, in fact,
    in special cases when you want to integrate WINS and DNS (for example, on a Windows
    NT 4.0 or Windows 2000 Server hybrid network). WINS is rarely used in homogeneous
    Windows 2000, Windows XP, or .NET Server operating system environments.


    From here to there: Zone transfers

    On the Zone Transfers, as shown in Figure 7-28, you control zone transfer security.
    In this case, the issue is of information because this control is to prevent unauthorized
    users or rogue servers from getting a list of all hosts and their IP addresses.
    Getting this information can be useful if the miscreant plans to try to invade
    your network. (We describe this security feature and at length in Chapter 11.)
    By default, zone transfers are enabled to all servers, which, as you may guess,
    isn''t necessarily the best idea. You can also choose to allow zone transfers
    to only the DNS servers with name server records in the zone or to a manually
    specified list of servers. Limiting zone transfers is an important network security
    step.'
  merge: -1
  img_proc: true
