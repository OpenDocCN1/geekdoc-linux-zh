- pgno: 329
  md: '# 310 DNS For Dummies


    From the next page, Addresses and Topology, you can set the port and addresses
    on which the server listens for queries, as shown in Figure B-15. By default,
    the server listens on all IP addresses assigned to the server and the default
    DNS port. You can also configure the source IP address and port for all DNS queries
    that originate from the configured server. This ability is particularly useful
    if you need to configure a firewall to allow queries for recursion and you want
    to open only a single IP address and port. Use the Nameserver choice topology
    box to list a number of name servers and the order in which they''re queried.
    Closer servers are placed at the top of the list, and more remote servers are
    placed lower on the list.


    Figure B-16 shows the Miscellaneous Options page. On this page, you get access
    to the configuration options that defy normal categorization (the “rebellious”
    options). The first four options are orderly, advanced options used to limit the
    amount of memory and disk space used by the BIND application. The next group of
    options are advanced timing options. The last four options are used to disable
    recursion, disable the fetching of glue records, allow multiple CNAME records
    for one name, and set the authority flag on responses. Unless you''re completely
    sure of the consequences, you should leave these options undisturbed.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_329_0.png)


    Figure B-15: Determining how the server should respond and send queries on the
    IP address and port levels.'
