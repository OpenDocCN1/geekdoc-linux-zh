  md: '# Part III: Working with DNS Servers


    The more often you schedule a test to run, the greater the unnecessary load that
    is placed on the server. You don''t need to run any scheduled tests more than
    every hour or every few hours, unless you''re troubleshooting a specific problem.
    In that case, you should schedule the tests to run every few minutes at first.
    If you can''t isolate the problem, let the tests run longer and often to get a
    better view of what''s happening.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_143_0.png)


    # Gaining control: Configuring zone properties


    You can make a number of configuration changes to a zone. Most of the time, you
    can leave the majority of them set to their default values, although you may need
    to play "mad scientist" and get creative every once in a while. From the DNS MMC
    snap-in, select a zone in the left pane and choose Properties from the Action
    menu. The Zone properties dialog opens, as shown in Figure 7-25.


    | sample.tdns Properties | | | | General | Start of Authority (SDA) | Name Services
    | WINS | Zone Transfers ||---|---|---|---|---|---|---| Status: | | Running | |
    | Type: | Primary | | Change... | Zone filename: sample.tdns | | | | Allow dynamic
    updates? | No | | | | To set aging/scavenging properties, click Aging. | | Aging...
    |


    > Figure 7-25: Configuring zone-specific settings.


    # Generally speaking


    From the General tab, you can change the zone from primary to secondary and vice
    versa by clicking the Change button and changing the zone filename. You can also
    choose whether to allow dynamic DNS updates, which by default aren''t allowed
    in new zones. Note: If you''re running Active Directory, zones created during
    the Active Directory setup process have dynamic updates enabled.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Chapter 7: Installing a Microsoft DNS Server


    Also on the General tab is the Aging button. Click it to configure the aging properties
    for the zone, which are used for the scavenging of old records. (See Chapter 12
    for more details on scavenging.) Don''t change the aging settings until you thoroughly
    understand your function.


    No problems with authority


    In BIND under Unix, the Start of Authority, or SOA, record is contained in the
    beginning of every zone file. In Windows, the SOA record for the zone is configured
    using the Start of Authority (SOA) tab in the zone Properties dialog box, as shown
    in Figure 7-26. The SOA record and its settings are discussed in Chapter 9.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_144_0.png)


    Figure 7-26: Configuring the SOA record for the zone.


    Notice that you can set all the SOA values in addition to the zone TTL (time-to-live)
    from the SOA tab in the zone Properties dialog box.


    Name server


    On the Name Servers tab in the zone Properties dialog box, as shown in Figure
    7-27, you add name server (NS) records to the zone. The NS records tell other
    DNS servers and clients who name servers are authoritative for a given domain.
    The authoritative name servers are the primary and secondary name servers for
    the zone. You can add, edit, and remove name server records by clicking the appropriate
    buttons. Name server records have only one setting and IP address.'
  merge: -1
  img_proc: true
