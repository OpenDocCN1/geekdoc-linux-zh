  md: '# Chapter 13: "It Doesn''t Work!" (Troubleshooting) 27


    command shown in Figure 13-11. The first seven log entries, from starting BIND
    9.2.0 to the command channel listening message, are informational. They''re explaining
    the process that BIND is experiencing as it starts. The ninth and eleventh messages
    are also informational;; they''re informing you that the specified zones have
    been loaded. The last message, running, informs you that the BIND startup process
    is complete.


    Three messages aren''t informational. The eighth and tenth messages (no TTL) are
    warnings that no explicit TTL was specified for the zone and that the TTL specified
    in the SOA record is being used instead. Although this isn''t a problem that causes
    the zones to fail, it''s not proper practice, so a warning message is logged.
    You should fix problems resulting in warning messages, although it isn''t absolutely
    necessary. Leaving them as is, ever can lead to bigger problems down the road.


    The remaining message is an error message: file not found. This message is explaining
    that in trying to load the zone sample.told described in the BIND configuration
    file, the specified zone sample.told could not be found in the zone files directory.
    Its an error message because it causes the zone not to be loaded. You must fix
    this error before the function will work. Note, however, that the failure of one
    zone causes the entire server to fail.


    As you see, working through log files where BIND is in use can also be a tedious
    process. To reduce the sheer number of items you must examine, you can forward
    the DNS logging information to a separate file (away from the common system) by
    altering the logging directive. In addition, you can invest in a third-party log
    analyzer to parse and sort the log entries by any number of criteria. These kinds
    of tools are often available from the Unix or Linux vendor you''re using.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_266_0.png)


    When an error occurs in a zone file or the BIND configuration file, the logged
    message often indicates the line number on which the error occurred. You can then
    edit the zone or configuration file and repair the error.


