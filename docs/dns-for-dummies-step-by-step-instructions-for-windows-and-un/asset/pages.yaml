    # # Configuring Mail Servers As Mail Exchangers


    When an MX record is used, all mail to a domain is “dumped” on the server with
    the MX record for that domain. Every SMTP server in existence forwards mail with
    the format user@domain.tld to the MX record value for domain.tld. The key is to
    configure the mail server so that it knows it''s supposed to receive mail for
    domain.


    # # Microsoft Exchange 2000


    Microsoft Exchange 2000 is integrated into Microsoft Active Directory (AD). Rather
    than store Exchange accounts in Exchange, as in Version 5.5 and earlier, Exchange
    integrates into Active Directory and assigns mailboxes to existing Active Directory
    accounts.


    In Microsoft Exchange 2000, SMTP mail is sent and received using an SMTP connector.
    By default, Exchange is automatically configured to accept'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 60 Part I: How DNS Makes the Internet Go Round


    mail for the default domain in which it''s installed. Exchange allows the intrad
    administrator to configure multiple e-mail addresses for any user who has an account
    in Active Directory with a mailbox on the Exchange server. For example, an Exchange
    server on the foo.com domain may accept inbound-mail for usr@foo.com, user@foo.com,
    and user@super.com, for example. Another handy feature is the ability to import
    users from a Windows domain and to create mailboxes (in a single import) for every
    account. Mailboxes can also be created for both nondomain and domain users, which
    is handy if the server is serving ISP-like services, such as Web (HTTP) or POP
    access.


    # qmail


    qmail, a common Unix/Linux-based message-transfer agent (MTA), can be configured
    to accept mail for any domains you want. For a domain, that domain must be listed
    in the file /var/qmail/control/rcphosts. This file contains a list of the domains
    for which qmail will accept mail in the format domain.tld. The content of a sample
    hosts file looks like this:


    ```

    sample.tld

    newdomain.tld

    domain.tld

    acct.domain.tld

    ```


    qmail also uses two files that control how mail is delivered after it''s received
    by the SMTP server: /var/qmail/control/locals and /var/qmail/control/virtualdomains.
    These files have nothing to do with DNS — only with the qmail delivery process.
    Although rcphosts controls for which domains mail is accepted by the SMTP server,
    the locals and virtualdomains files control how qmail delivers the messages after
    they''re in the system.


    # Multi-Tier Applications and DNS


    Multi-tier applications — a hot topic these days — are being implemented in many
    did-to large-size networks. A multi-tier application refers to any application
    that runs on distributed systems. For example, applications that use an application
    server and a Web server in the front end comprise a two-tiered system; often,
    however, multi-tier refers to systems that make use of three or more components.
    A common example of a three-tier system is a database server in the back end (housing
    the data), an application server or middleware server in the middle (processing
    user requests), and a Web server on the front end (providing an interface for
    the end user).'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Chapter 4: Facilitating Other Applications with DNS


    Middleware is one of buzzwards that everyone seems to be using but nobody seems
    to be clearly explain. In most cases, middleware simply refers to an application
    responsible for ensuring that the data from the database is accessible to the
    user through a Web-based interface. In many cases, the middleware application
    is built using a Java (a programming language) engine with a series of extensions
    to make developing the application easier. When a middleware application, such
    as BEA Logic, is used, often no processing is done by the Web server itself —
    the middleware does it all. The Web server is in place only to provide a gateway
    from the user''s Web browser to middleware.


    When a multi-tier application is used, the separate tiers always need to communicate
    with each other over a network connection — a connection typically based on TCP/IP.
    A connection can be made by an IP address, for the sake of administrative ease,
    the connection between the tiers is usually done by using DNS names. Just like
    when you browse the Internet for fun or work, using the DNS is much easier than
    remembering the IP address; for example, the name application.domain.tld is easier
    to remember than the IP address 192.168.100.43.


    In addition, the use of DNS can allow for the tiers of the application to be switched
    from one system to another by changing the DNS record, not the IP address configured
    directly in the application. The benefit is relatively clear: You move the application
    without having to modify its operating parameters, which in some cases can involve
    recording part of the application. In this case, using DNS may save lots of time
    and money. If the application is configured to use the Web server webl.domain.tld
    for example, and you want to simply configure the New server in parallel with
    the Old Web server, but with a different IP address. After the new server is in
    place and tested, you can change the IP address for webl.domain.tld to the address
    of the new Web server. And, after the TTL expires on the record, the new Web server
    is used.


    You can use the same technique for the application tier if it doesn''t use dynamic
    data, but it doesn''t work well for the database tier because the new database
    server becomes stable while you''re changing the DNS record. The process for changing
    a server that did have dynamic data (data changed with application activity) is
    different. You have to make the change in a way which ensures that the data remains
    "factory fresh."


    Wait — there''s more! DNS can be used to easily load balancing within a more complex
    multi-tier application. DNS can be configured in such a way that you can make
    use of a cluster of more than one server in each tier. In a multi-tier application
    in which the data on the Web and application servers is static (as is the case
    with many multi-tier systems), a DNS robin can be used at each level. Users can
    be load-balanced to different Web servers using DNS robin on the front end, and
    the Web servers can'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# 62 Part I: How DNS Makes the Internet Go Round


    be load-balanced to a group of application servers by using the same technique.
    The application servers can even be load-balanced to a cluster of database servers.
    This arrangement works as long as the database cluster was already configured
    to share data across members of the cluster. When you get this deep into a major
    multi-tier application, though the DNS configuration takes a great deal of planning
    and design to ensure that everything works properly. You don''t want your enterprise
    resource planning (ERP) application failing because of an oversight in the DNS
    configuration.


    # Microsoft Active Directory (AD) and DNS


    Microsoft Active Directory (AD) uses DNS as a critical part of its operation.
    DNS is used in place of the Windows Internet Naming System (WINS) that was so
    widely used in "pre-Active Directory" days. DNS was used in older versions of
    Windows as the main protocol for name resolution in the versions of Windows in
    which NetBIOS names depended upon for communication between systems. With a more
    rigorous adoption of the TCP/IP protocol stack by Windows, DNS was the obvious
    choice for maintaining the host information used by Active Directory.


    Active Directory uses a number of advanced DNS features to function, including
    dynamic updates (see Chapter 12). From the network, their DNS information is dynamically
    updated. This process is completely automated, saving the system administrator
    from having to manually add any systems. In addition to keeping a record of systems
    on the network, Active Directory uses DNS to maintain the network by a list of
    servers, such as printers, Active Directory servers, and global catalogs. Active
    Directory does this by using a service (SRV) record, which is a special type of
    DNS record. (We briefly discuss these records in Chapter 9.) SRV records give
    a client system everything it needs to locate an appropriate service or services,
    determine where on the network they are located, and choose the best one.


    SRV records are also automatically added to the DNS database by the Active Directory
    server as services come online — saving the administrator from having to manually
    maintain a service list or even configure services on the workstations. Theoretically,
    a user who needs to print can simply indicate to the system that she wants to
    print, and then an appropriate printer or list of printers is provided. This feature
    is generally quite useful because large networks may have hundreds or thousands
    of hosts and each one may have numerous available services. Active Directory centralizes
    the process of accessing and locating the available services.'
  merge: -1
  img_proc: true
