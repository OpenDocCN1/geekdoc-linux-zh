  md: '# 128 Part III: Working with DNS Servers


    # Working with Windows NT 4.0


    In Windows NT 4.0 Server, the DNS Server service is configured using the DNS Manager
    utility. To find it, click the Start button, choose Programs Administrative Tools
    and click the DNS Manager icon. Before you can configure the DNS server, however,
    you must first add the server to the DNS Manager because it isn''t done automatically.
    Choose New Server from the DNS menu in the DNS Manager utility, enter the name
    or IP address of the local computer, and click OK. The server appears on the list,
    as shown in Figure 7-30.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_147_0.png)


    # Working with NT 6.0 zones


    After the DNS server is first created, it has no zones configured. The first step
    in making the DNS server truly useful is to add a zone or two. Select the DNS
    server in the left pane and choose New Zone from the DNS menu. The first step
    in the New Zone dialog box is shown in Figure 7-31. You must decide whether the
    new zone is a primary or secondary zone and, if it is, specify the zone name and
    the primary DNS server. If this DNS server is the only one on your network, it
    likely hosts a primary zone for your local network or Windows domain. If a DNS
    server is in operation and you''re unsure of its role, you''re safest in making
    the server a secondary DNS server. Or, you can consult someone to find out whether
    the other server is a primary one, although it may be more fun to guess. (Just
    kidding!)'
