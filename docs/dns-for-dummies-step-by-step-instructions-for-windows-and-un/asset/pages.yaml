    # Feel the Burn: Handling Heavy Loads


    Imagine that you have one basic Web server with static content and no database-connections,
    but it''s getting pummeled with Web requests and the result-server load is high.
    When it comes to upgrade the server (hopefully before it gives up the ghost),
    you have a number of options. The most obvious option is to upgrade the existing
    server to something more powerful. You can choose another method, though, that
    allows you to add another Web server in addition to the existing server, which
    is often a cheaper and less invasive capacity. (because your server is mostly
    untouched) way to provide additional capacity. The process of having more than
    one server providing the same service simultaneously is known as load balancing.


    Don''t confuse load balancing with failover, although the two terms are used interchangeably.
    Load balancing refers to the division of network traffic between two or more servers
    providing the same service, and failover refers to the ability to redirect traffic
    to another server in the event that a server fails.


    Load balancing can be implemented in a number of ways. Many devices are made specifically
    for the purpose of load balancing and can monitor a huge number of statistics,
    such as query times and even actual server load as reported by utilities on the
    system. These statistics are then used to determine the "weighting" for the load
    on each server. Basically, if one system is twice as


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_242_1.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 224 Part V: Security and Advanced DNS Tricks


    fast as the other system (in a two-server load balancing environment), an appropriate
    portion (two-thirds) of the load is sent to that server with the other portion
    going to the slower server.


    DNS provides its own load balancing method: DNS round robin. DNS round robin is
    quite simple and has no way of measuring the load on any of the servers. You simply
    provide a list of servers for the same record, and DNS responds to each request
    with the next server in the list and loops back to the beginning. If you have
    two servers, for example, the first DNS query results in the first server on the
    list, the second DNS query results in the second server on the list, the third
    query results in the first server again, and so on. This example is a bit of an
    oversimplification. DNS round robin changes the order in which the servers process
    (or receive) requests. If you have three servers with the addresses 1, 2, 3, and
    the third query 2, 3, 1; the first query 3, 1, 2; and so on. Some users are shuffled
    to Web server 1, to 2, and to 3. This system breaks the incoming traffic (all
    bound for a single Web site in the example) across multiple servers.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_243_0.png)


    Although most operating systems use only the first returned server, this behavior
    causes round robin to work properly on some systems, such as Microsoft Windows,
    which choose the DNS entry from the list based on subnet priority. If you''re
    using DNS round robin and one of the systems is on the same subnet as your Microsoft
    Windows workstations, those workstations always use that server, and the round
    robin is ineffective.


    # The round robin is on the window


    Configuring a record for round robin DNS processing in Microsoft Windows 2000
    and later is simpler. (The process for adding a host record is discussed in Chapter
    7) To configure round robin, simply add another host record using the same name
    and the new IP address instead.


    Open the DNS snap-in by choosing Start>Programs; Administrative Tools. Locate
    and select in the left pane the zone in which the record is created. The existing
    records are shown in the right pane. If it doesn''t already exist, create the
    first host record by choosing New Host from the Action menu. Specify the name
    and IP address and click Add Host to create the record. Next, use the New Host
    command and specify the same name but different IP address; then click Add Host.
    Two records now have the same name, as shown in Figure 12-4. You can create a
    number of records for round robin, if you want.'
  merge: -1
  img_proc: true
