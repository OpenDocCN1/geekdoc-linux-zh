    You can follow the resolution process in the preceding section manually, by using
    the NSLOOKUP command. For the sake of example, follow along with the process described
    in this section. We show you in detail how each step in the DNS resolution process
    works.


    First, use NSLOOKUP to locate the servers that are authoritative for the .com
    domain using one of the root servers. The root servers are contained in the root
    hint file on every recursive DNS server and are also listed in Chapter 2. They''re
    fairly easy to remember because they''re named a-m.rootservers.net Figure 3-3
    shows the process in NSLOOKUP. Use the server command to change the server to
