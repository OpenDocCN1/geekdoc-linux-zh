- pgno: 234
  md: '# Chapter 12


    # What Else Can DNS Do?


    # In This Chapter


    +   - Dynamic DNS and scavenging

    - DNS round robin load balancing

    - DNS zone change notification service

    - Incremental zone transfers


    In the first 11 chapters of the book, only the more basic features in DNS are
    described. Although we have briefly mentioned some more advanced concepts, this
    chapter examines more advanced features in detail. For a service that is designed
    (basically) to link IP addresses with host names and service types, the number
    of advanced tricks available for tweaking DNS operation is surprising.


    For the purposes of this chapter, basic features include the process of serving
    records from manually configured zone files using a manually configured configuration
    file. All DNS servers share this core set of features as required by the standards
    organization that maintains the DNS specifications.


    Advanced features refer to those features that perform functions above that of
    the basic DNS service. A number of advanced DNS features are discussed in this
    chapter, although they''re not supported on all DNS servers. Microsoft Windows
    2000 and later DNS servers and BIND 9 on Unix support almost all the listed features.
    Any variation is noted.


    # A Dynamic Scavenger


    Traditionally, records were added to DNS zones manually. Each host would receive
    an entry in the zone file and in the event that the host IP addresses changed,
    the zone file would need to be changed manually. For a site with hundreds or thousands
    of hosts within the DNS domain, maintaining records in the face of these types
    of changes becomes an incredibly involved task.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 216 Part V: Security and Advanced DNS Tricks


    To a large extent, much of the more complex DNS maintenance is still done manually,
    although an advanced DNS feature, dynamic DNS, can be used to reduce the amount
    of manual configuration that''s required. This feature is especially useful for
    registering workstations in DNS where the required DNS client configuration is
    relatively simple. In fact, Windows 2000 and newer workstations are configured
    to use dynamic DNS automatically.


    Before you leap in both feet, you need to know something: To use dynamic DNS,
    support for this feature must exist on both the client and the server. This statement
    may sound somewhat remedial, but a mixture of devices is commonly found on a network.
    The Microsoft Windows 2000 and later DNS server and BIND 8 and 9 support dynamic
    DNS to some extent. Microsoft Windows 2000 and newer clients support dynamic DNS
    registration, and Unix clients for dynamic DNS registration are available.


    # Understanding Dynamic DNS


    Dynamic DNS is a fairly simple process as implemented in Microsoft Windows. When
    a host registers or updates its DNS information, the process occurs in an orderly
    manner:


    +   1. The client uses its configured DNS servers to determine the authoritative
    (master) DNS server for the domain being updated by requesting the SOA record
    for the domain. The client''s DNS servers are sometimes authoritative for the
    domain, but that''s not the case, which makes this step important.


    The client sends an UPDATE message to the DNS server provided in Step 1. The UPDATE
    message contains the requested changes or registration to the DNS record.


    +   2. The authoritative DNS server inspects the UPDATE message and determines
    whether the update should be allowed. For a number of reasons, an update request
    may be denied, as we mention a little later in this section. If the update request
    is accepted, the DNS server makes the change to the zone.


    +   3. If the update fails, the client then uses an NS (name server) query to
    find other DNS servers for the domain because the SOA record in Step 1 contains
    only one DNS server. If other servers are returned by the NS query, the client
    attempts dynamic DNS update on servers in order. If they all fail, the update
    is not performed.


    If you''re interested in reading technical protocol definitions, the DNS UPDATE
    message is described in IETF RFC 2136.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Chapter 12: What Else Can DNS Do?


    A number of criteria allow dynamic DNS record updates to occur. Typically, new
    records can be added by any system or host, but only the system that registered
    the record in the first place can make changes. In Microsoft DNS, two types of
    updates can be used: secure dynamic and unsecured dynamic updates. A secure update
    uses Access Control Lists (ACLs), which list the users, groups, or computers that
    have the required access to update a record. Secure dynamic update is available
    only for Active Directory-integrated zones and is required by default with these
    zones.


    Zones that aren''t Active Directory-integrated use unsecured dynamic updates,
    and Active Directory integrated zones can be changed to allow unsecured updates
    too. If unsecured dynamic updates are in use, any host can update DNS records.
    By default, workstations first attempt an unsecured dynamic update; if the update
    is rejected, a secure dynamic update is attempted.


    # Enabling dynamic DNS on a Windows server


    Dynamic DNS in Windows 2000 and 2004 (it isn''t available in earlier versions)
    is enabled in a zone-by-zone basis. To enable dynamic DNS for a zone, first open
    the DNS snap-in by clicking the Start button and choosing Programs Administrative
    Tools. In the left pane of the DNS snap-in, locate and select the zone for which
    you want to enable dynamic DNS and then select the Zone Properties from the Action
    menu. The Zone Properties dialog box opens, as shown in Figure 12-1.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_236_0.png)


    Figure 12-1: Enabling dynamic DNS.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "# 218 Part V: Security and Advanced DNS Tricks\n\nThe option labeled Allow\
    \ dynamic updates? on the General tab of the Zone Properties dialog box is used\
    \ to enable or disable dynamic DNS. This option is set to No by default, and changing\
    \ the setting to Yes enables unsecured dynamic updates to hosts using the DNS\
    \ server for domain services. If the zone is an Active Directory integrated zone,\
    \ the default allows only secure dynamic updates. Again, the secure updates are\
    \ available only with an integrated Active Directory implementation.\n\n# Dynamic\
    \ DNS and BIND\n\nOn a BIND 9 server, dynamic DNS is also configured on a zone-by-zone\
    \ basis. Two methods allow dynamic updates in BIND, and both are configured in\
    \ the configuration file for individual zones. The two options are allow-update\
    \ and update-policy.\n\nMaking sense of TSIG keys\nBIND has a feature named transaction\
    \ security, TSIG keys are used for update security in the next two sections. TSIG\
    \ keys must be configured on both the client and the server. On the server, TSIG\
    \ keys are defined by using secret keys in the configuration file. A key is defined\
    \ this way:\n\n```\nkey workstation1.sample.tld {\nalalgorithm hmac-md5;\nsecret\
    \ ?/dkYjJlO8GdJK/wgXMBO=?;\n}\n```\n\nAlthough the key name is arbitrary, using\
    \ the client's fully qualified name (FQDN) is a useful convention. Secret keys\
    \ can be generated by using the mmencode command because they must be base 64\
    \ encoded. The command echo <secret> | mmencode at a shell prompt, where <secret>\
    \ is the plain-text you want to use for the key will generate the key on the client\
    \ and the server using the preceding command, and you don't need to copy the encoded\
    \ key between the two systems.\n\nallow-update\nThe simplest way to allow updates\
    \ in BIND is with the allow-update option. This option allows only the specified\
    \ hosts to update DNS entries. In the configuration file, a zone entry set to\
    \ allow dynamic updates looks like this:\n\n```\nzone \"sample.tld\" {\n  type\
    \ master;\n  file \"sample.tld\";n  allow-update (192.168.100.0/24);\n```"
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Chapter 12: What Else Can DNS Do? 219\n\nThe allow-update option that is\
    \ shown allows all systems on the 192.168.100.0/24 network to send dynamic updates\
    \ to this DNS server for the zone sample.tld. You can also specify more than one\
    \ IP address or range as long as they are separated with a semicolon and a semicolon\
    \ appears after the last address.\n\nIn addition to allowing updates based on\
    \ source addresses, you can allow updates based on TSIG keys. This method is far\
    \ more secure because source IP addresses can be spoofed.\n\nSpoofing an IP address\
    \ involves sending a network packet with a false address. You can write software\
    \ that overrides the default network behavior of a system (which is to use the\
    \ system's IP address as the source) and use any IP address as the source.\n\n\
    To use TSIG keys for update security, use the option allow-update {key workstation1.sample.tld::};\
    \ You can also specify multiple keys by using a semicolon to separate each one.\n\
    \n# update-policy\n\nThe update-policy zone option, new in BIND 9, provides more\
    \ configuration options for dynamic updates. To use the update-policy option,\
    \ you must have TSIG keys configured because source IP addresses cannot be used.\
    \ The update-policy option can be used to grant or deny access using keys, although\
    \ access is denied by default. The update-policy option is configured as:\n\n\
    ```\nzone \"sample.tld\" in\n  type master:\n    file \"sample.tld\"\n    update-policy\
    \ (\n      grant workstation1.sample.tld self\n      workstation1.sample.tld;\n\
    \      grant admin.sample.tld name sample.tld;\n      grant *.sample.tld self\
    \ *.sample.tld. A;\n);\n```\n\nIndividual rules are specified with the update-policy\
    \ option. For example, a general form of the update-policy directive looks like\
    \ this:\n\n```\nupdate-policy [grant or deny] <key> <nametype> <name> <types>\n\
    ```\n\nThe <key> refers to the TSIG key defined earlier in the configuration file\
    \ used for the rule. The <nametype> field specifies the type of update that can\
    \ be made. The <name> can be either name, which matches the name field; the <subdomain>\
    \ option allows to be used to update any subdomains of the domain field; or self,\
    \ which allows the rule to be used for a system to update only its own record.\n\
    \n![](img/ef3dfe2cb04fcef67ad22a0599c29f36_238_0.png)"
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 220 Part V: Security and Advanced DNS Tricks


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_239_0.png)


    Although the name field isn''t used when the self name type is specified, something
    must still be in the name field, as shown in the example.


    The <name> field is used to control what entries can be updated by a client with
    a matching <key>. Finally, the optional <type> field can be used to restrict the
    record type that can be updated.


    In the preceding code example, three rules are being applied with the update-policy
    option. The first rule allows the system with the key workstation1.sample.tld
    to update any of its records. The second rule grants the key admin.sample.tld,
    the access to update any records in the sample.tld zone. The last rule grants
    all systems with keys ending with sample.tld, permission to update their own A
    records. (The advantage of using the FQDN for key names becomes clear in this.)


    # Keeping things fresh


    The DNS scavenging feature on Microsoft Windows DNS servers is typically used
    with dynamic DNS. Scavenging can also be used with manually configured DNS records
    but it''s rarely useful.


    The scavenging feature is responsible for removing old, or "stale," DNS records.
    This feature is important when you have a large environment and numerous DNS clients.
    As these clients register in DNS and some clients eventually change host names,
    change domains, or are removed from the networks, dynamically created records
    are left in the DNS server. Over time, this situation causes the zone files to
    grow. These large zone files cause problems because they consume lots of disk
    space and cause the DNS server to operate more slowly.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_239_1.png)


    Dynamic DNS records are removed automatically when computers are removed from
    the network properly. Only when the system is removed improperly the DNS records
    get left in the server and become stale.


    Luckily, scavenging removes these stale records. Scavenging isn''t enabled on
    Microsoft Windows DNS by default because using scavenging effectively requires
    some understanding of how the DNS server is being used by clients. A one-size-fits-all
    approach isn''t a good idea when the topic is scavenging. Scavenging relies on
    another process, aging, which is configured on a zone-zone basis. Aging is responsible
    for determining which records have passed a user-determined threshold (usually
    a period in which some kind of update must occur) and thus need to be removed.
    The problem with scavenging occurs when aging is configured incorrectly and records
    that are still valid are removed. This is the primary reason that scavenging is
    disabled by default.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Chapter 12: What Else Can DNS Do?


    Dynamic DNS records have a value known as a timestamp. The timestamp is initially
    created when the record is registered in the DNS server. The client occasionally
    refreshes the timestamp. If the client doesn''t refresh the timestamp, it indicates
    that the client may have gone offline, and the record becomes stale and a target
    for scavenging. Manually configured DNS records don''t have this timestamp.


    Configuring scavenging is a twofold process, first configuring zone aging and
    then configuring scavenging in the DNS service configuration. Both configurations
    are done using the DNS snap-in on Windows 2000 and later operating systems. Scavenging
    isn''t supported on systems running Windows NT 4.0 or other earlier versions.
    To begin, open the DNS snap-in, choose Start→Programs→Administrative Tools, and
    click the DNS icon.


    # Zone aging settings


    Now that you have the snap-in, double-click the server name entry in the left
    pane and double-click the Forward Lookup Zones container to expand its subdivisions.
    You should see a list of zones in the left pane. Select the zone for which you
    will enable aging, and choose Properties from the Action menu. From the General
    tab of the Zone Properties menu, click the Aging button. This step opens the Zone
    Aging/Scavenging Properties dialog box, as shown in Figure 12-2.


