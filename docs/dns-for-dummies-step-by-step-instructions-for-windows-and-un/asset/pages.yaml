- pgno: 96
  md: '# Chapter 5: Configuring a DNS Client


    The term Unix-like operating system refers to an operating system that functionally
    resembles Unix but isn''t based on the original BSD or AT&T UNIX source code.
    Linux is commonly referred to as Unix-like because it was written completely from
    scratch and no original Unix code.


    The problem with all these different Unix operating systems is that one of the
    most visible differences between them lies in their configuration procedures,
    although most Unix systems have their DNS client settings in the same place, some
    vary.


    Even Linux itself has more than one way to configure the DNS client settings.
    A number of tools are available, such as `netconf` and `linuxconf`, that provide
    graphical interfaces to network settings. These tools are sometimes unreliable,
    for many reasons. One common problem with the methods of configuring network settings
    in Linux is that the same configuration is set in more than one location, causing
    one to take precedence. If you make a change to the setting that doesn''t take
    precedence, nothing happens.


    The safest way to configure the DNS client settings in Linux is by using the old-fashioned
    method of editing the configuration file directly. All DNS client settings are
    stored in a file named `resolv.conf` that is commonly stored in the `/etc/` directory
    of the Linux installation. This is almost always the case in Linux. You can edit
    this file using any text editor you prefer — for example, vi or pico.


    The text editor vi is installed on almost all versions of Unix, although it''s
    somewhat difficult to use. After you have initially figured out how to use it,
    it''s much easier. A more simple text editor pico, isn''t installed on most systems.
    You might want to use pico if it''s installed.


    The `resolv.conf` file in your text editor. Figure 5-10 shows a sample `resolv.conf`
    file. This file contains a variety of configuration information, only a few important
    settings are shown in the sample file. Here are the three settings (discussed
    at the beginning of this chapter, in the section) “Making the Server Connection”:


    +   * The DNS servers

    * The domain for the computer

    * The DNS suffix search order


    The first line in the `resolv.conf` file typically contains the domain or search
    keyword. The domain keyword is used to specify the domain suffix for the computer,
    as in the sample `resolv.conf` file. This domain is appended to unqualified domain
    names automatically. The search keyword is used to specify domains appended to
    unqualified names except that rather than one domain, you can specify as many
    as with a maximum of 256'
  merge: -1
  img_proc: true
