    sections, however, can further your understanding of how DNS works behind the
    scenes.


    In addition, several chapters are dedicated to the theory behind how DNS works.
    You get a better understanding of why DNS does certain things if you understand
    how the DNS process works. If you choose to skip Chapters 3 and 4 because of their
    technical nature, however, you won''t miss the "meat" of working with DNS.


    # Foolish Assumptions


    In this book, we have assumed that you''re a somewhat technically literate user
    who is already familiar with the Internet to some extent. Although this book attempts
    to simplify DNS, it''s still a technical subject at heart. Without a firm grasp
    of the basics of the Internet, you don''t have much hope of under-standing DNS.
    You should be familiar with terms such as WWW, e-mail, and IP address.


    We have also assumed that you''re somewhat comfortable with the operating system
    you use—either Microsoft Windows or Unix/Linux. You should at least be able to
    navigate in Windows and use the basic configuration tools or be somewhat comfortable
    in a Unix shell and be able to view and edit files.


