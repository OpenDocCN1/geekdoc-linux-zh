    Figure 7-28: Specify which servers are allowed to perform zone transfers on the
    zone.


    On the Zone Transfers tab is the Notify dialog box, as shown in Figure 7-29. You
    use this dialog box to specify which DNS servers are notified when zone information
    changes. It''s sort of the DNS equivalent of a contact list. When you move from
    one residence to another, you typically use a "notify list" to notify certain
    people and institutions of your address change. This list ensures that all the
    included people are on the same page. The purpose of the Notify function is to
    instruct secondary servers to perform a zone transfer whenever the zone is changed
    on the primary server. By default, all servers listed as name servers for the
    zone (with NS records) are notified. You can also choose to send notify commands
    to manually specified servers.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_146_1.png)


    Figure 7-29: Specify which servers are notified of zone changes.'
