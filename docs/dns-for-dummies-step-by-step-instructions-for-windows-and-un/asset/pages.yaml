- pgno: 270
  md: '# Chapter 14


    # Ten DNS Services and Resources


    In This Chapter


    +   - Services that depend on DNS

    - Web sites with DNS information


    According to statistics, nearly 550 million people worldwide use the Internet.
    Of these 550 million people, only a few even know that DNS exists, although it
    provides a vital infrastructure for the entire Internet. Without DNS or some other
    naming service, the Internet would be all but worthless because a huge number
    of IP addresses are available. Without names, you could remember only a few Web
    sites and e-mail addresses.


    # Services That Need DNS


    The services listed in this section are important either directly or indirectly
    to the majority of Internet users. Without DNS, none of these services would be
    useful in a practical sense.


    # The World Wide Web


    The Web is the most obvious place that DNS is used, and it''s transparent to the
    user. When you open your Web browser and type an address, such as www.yahoo.com,
    you don''t have to concern yourself with the IP address of the Web server hosting
    the Yahoo! Web.


    The advantage of using DNS on the Web is that servers can be moved around, and
    only the DNS record must be changed. The client, using the DNS name, always contacts
    the server that you, as the administrator, want it to contact. You can build a
    new Web server, ensure it''s functional, and switch traffic to the new server
    without the user''s knowledge.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 252 Part VI: The Part of Tens


    The second advantage of DNS and Web servers is that DNS allows one name to point
    to more than one server, through a process known as DNS round robin (refer to
    Chapter 12). More than one host record (A) is created for the same host with different
    IP addresses, and the DNS server automatically provides each address in a round-robin
    fashion to fulfill client requests. This system provides a low-cost method of
    spreading a load across multiple servers, although it''s not appropriate for all
    environments.


    # E-mail


    E-mail has been reported to be the most widely used application on the entire
    Internet. E-mail provides a method for users over the world to talk to each other
    for the cost of the Internet connection or time spent at an Internet café.


    DNS provides an integral part of e-mail in more than one capacity. First of all,
    when you''re using an e-mail client, it usually uses DNS to send messages to the
    e-mail server and retrieve messages waiting on the server. Even when Web-based
    e-mail is being used, DNS is used to connect to the Web-based mail application.


    The second and more important way that DNS is used in the transfer of e-mail from
    server to server, or mail relating. The mail server, or Mail Transfer Agent (MTA),
    looks in the queued e-mail at the domain name of the recipient''s e-mail address
    and locates the Mail Exchanger (MX) record for that domain in DNS. The MX record
    instructs the MTA to send to the e-message. The MTA then uses the SMTP protocol
    (typically) to relay the message to the recipient''s e-mail server. Refer to Chapter
    4 for more information about how DNS facilitates e-mail and other applications.


    # Games


    Many games support play against other users across the Internet. These games normally
    have proprietary network code and a central game server. Clients use DNS to contact
    the game server transparently, and the server enables the players to play together.


    # Instant messaging


    Although e-mail may be the most common application on the Internet, instant messaging
    (IM) is probably experiencing the fastest growth. If the person you want to talk
    to is online, your message appears on their desktop as soon as'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Chapter 14: Ten DNS Services and Resources


    you send it. Services such as MSN Messenger, AOL Instant Messenger (AIM), and
    Yahoo! Instant Messenger are being adopted as both personal and professional tools
    for instant communication.


    Instant messaging uses DNS in a fairly simple manner. DNS is used by the IM client
    to locate the IM server''s IP address. After the client and server connect, the
    connection is persistent (never disconnects), so DNS isn''t required again. Instant
    messages are not forwarded from server to server as they are with e-mail, so DNS
    has no other use.


    The DNS addresses of the servers are usually hard-coded into the IM application.
    The advantage of using DNS in this case is that the IM server can be moved around
    and only the DNS record needs to be changed. No changes are necessary on the client
    side.


    # Microsoft Active Directory


    Traditionally in Microsoft Windows NT 4 and earlier versions, the Windows Internet
    Naming Service (W) and NetBIOS broadcasts were used for contacting other computers
    on the network, and the limited list of services was kept in the domain controller
    database and WINS. Only primary and backup domain controllers (PDCs and BDCs)
    were kept on the list.


    In Windows 2000 and later, Microsoft has moved from the domain controller to Active
    Directory. Active Directory is a set of services based on the Lightweight Directory
    Access Protocol (LDAP) and on DNS as well as on a number of proprietary services.
    All client computers running Windows 2000 or later register their names and addresses
    in DNS. Active Directory also uses DNS to maintain a complete list of services
    available on the network in SRV records. This system replaces the incomplete and
    often unstable server and computer listings in WINS.


    # Multiple-tier applications


    A multiple-tier application refers usually to an application that runs on the
    World Web and uses several layers of services. These tiers usually include the
    front-end Web server to which the end user connects, a back-end database server,
    and at least one, or middleware, server in between. This application server is
    responsible for parsing and formatting data from the database to the Web server,
    which serves it to the client. The client can also submit to the Web server some
    data that is then parsed by the application server, formatted, and stored in the
    database.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 254 Part VI: The Part of Tens


    Multiple-tier applications normally use DNS in their communication between tiers.
    The use of DNS rather than IP addresses allows specific servers in the system
    to be replaced seamlessly if the need arises. This way, a new server can be put
    in place, the DNS record can be changed, and after the DNS caches time-out, the
    new server is used and the old server can be removed. This process is facilitated
    even further by using short cache-timeouts on the records and zones for the multiple-tier
    application. This arrangement reduces the amount of time it takes for the DNS
    caches to update.


    # System administration


    In most companies, the system administrator is easily overlooked. She typically
    is called only when something bad happens and is doing other work the rest of
    the time. DNS makes the life of a system administrator (sysadmin) much easier.
    A sysadmin has much more interaction with a system than a user does. The sysadmin
    connects to a system using telnet or SSH if it''s a Unix system or a remote control
    application if it''s running Windows or with an FTP client for moving files.


    With a good DNS implementation, a system administrator needs to remember only
    the host name and domain of the system rather than have reference to a list of
    IP addresses every time he needs to do work on a system. This situation makes
    the sysadmin more efficient and makes his job a little easier.


    # Finding More Information


    The dynamic entity DNS changes occasionally. It has a wide range of uses and could
    undergo a redesign or have new features added to its specification. Changes can
    be made to the original RFC (check out the IETF Web site link in the following
    section), or custom changes can be made to DNS applications that deviate from
    the standard. Either way, you probably can benefit from knowing about them. This
    section lists three Web sites that provide additional information about the use,
    development, and administration of DNS.


    # BIND on RedHat Linux


    www.redhat.com/support/resources/tips/dns/bind.html


    Because you may want to use of BIND services for Linux — chances are good (if
    the usage statistics are correct) that you will be using some derivative of RedHat
    — this Web site should prove to be quite a handy tool. The site covers a variety
    of configuration issues and how-tos.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# DNS and Active Directory


    www.microsoft.com/windows2000/techinfo/reskit/deploymentscenarios/scenarios/dns_02_sir.asp


    If you intend to make use of Windows 2000 Server or .NET server, you will probably
    encounter the contended cousin of DNS: Active Directory. The DNS/Active Directory
    Web site can be quite useful if you find that you''re a quandary while trying
    to make your DNS server and Active Directory “play” together.


    # The Web site


    www.ietf.org/


    The Internet Engineering Task Force (IETF) is the clearinghouse for the standards
    used on the Internet. Among other things, this Web site allows you to access the
    Request For Comment (RFC) documents that define the accepted and proposed standards
    for a variety of Internet-related topics. Many RFCs also document communications
    between agencies and related topics. The main Web site has an RFC Pages link you
    can click to search by RFC number or to browse an index of RFCs. First, take a
    look at RFCs 1034 and 1035 because they focus on the DNS basics. You can also
    find interesting information in RFCs 1101, 1183, 1348, 1383, and 1535.'
  merge: -1
  img_proc: true
