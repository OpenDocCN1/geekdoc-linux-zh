    This book is organized into five parts. The parts separate the content of the
    book into activities such as working with clients or servers or configuring DNS
    zones. Each part is made up of a series of chapters, each divided into sections.
    You can start reading at any part or chapter in the book if you''re interested
    in performing a certain task. The five parts are described next.


