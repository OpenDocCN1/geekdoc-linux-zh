- pgno: 105
  md: '# 86 Part II: Working with DNS Clients


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_105_0.png)


    Figure 6-4: Using the Windows command prompt to access NSLOOKUP.


    NSLOOKUP has two modes: batch and interactive. Batch we cover it first, in the
    following section. Typically, the NSLOOKUP batch mode is used to find A records.
    A records are the primary DNS records for a domain name. They''re used to associate
    server IP addresses with DNS names. They''re not used for special purposes, such
    as e-mail. When you access a Web site, such as www.google.com, you''re accessing
    the IP address listed in the A record for DNS name. We describe record types in
    detail in Chapter 9.


    # Using NSLOOKUP in batch mode


    To use NSLOOKUP in batch mode, simply type NSLOOKUP domainname at the command
    prompt, where domainname is the name you want to look up (see Figure 6-5 for an
    example). NSLOOKUP is used to retrieve the A record for the domain name www.google.com.
    The record is retrieved from the DNS server configured in the computer''s network
    settings and returned.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_105_1.png)


    Figure 6-5: NSLOOKUP is being used to retrieve the record for a domain name.'
