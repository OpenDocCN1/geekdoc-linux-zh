    case) and open the zone file in your text editor. The zone file is newdomain.tld.dns
    in this example. The file doesn''t exist yet. You may need to copy an existing
    zone file and edit it rather than start from scratch. The following example shows
    what your zone file should contain:


    ```

    @ IN SOA dns1.domain.tld. hostmaster.newdomain.tld. (

