  md: '# Chapter 6: Using the DNS Clients on Your System


    NSLOOKUP. DIG is different from NSLOOKUP in that it has only a non-interactive
    mode, but with NSLOOKUP, you can use it to retrieve any information from the database
    of a DNS server.


    The most basic use of DIG is to retrieve an A record. From the command prompt,
    simply type DIG <domainname where domainname is the DNS name for which you want
    information. Figure 6-17 shows DIG used to retrieve an A record. One of the main
    differences between DIG and NSLOOKUP is the amount of information displayed with
    the query results. NSLOOKUP shows only the information requested, but DIG shows
    all information returned from the DNS server.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_114_0.png)


    ```

    File Edit Settings Help

    [root@localhost]# dig 192.168.100.59 www.google.com

    >> DIG 9.2.0 > 192.168.100.59 www.google.com

    >> global options: printcd

    >> NOTER: QUERY; status: NOERROR; id: 4dc29


    >> QUESTION SECTION:

    IN      A

    www.google.com.


    >> ANSWER SECTION:

    IN      A      216.238.194.238  ns2.google.com.

    IN      NS     34540  ns2.google.com.

    IN      NS     34540  ns1.google.com.


    >> Query time: 30 msec

    >> SERVER time: 1 00:01:23 2002

    >> Rset size: 102 bytes

    [root@localhost]# _

    ```


    If you look at the results from DIG, you can see the transcript of the DNS request
    is passed to the DNS server. In the Question section, the request for the A record
    is passed to the DNS server, which was the A for www.google.com. The Answer section
    contains the explicit answer to the query. This answer is the actual A record.
    The next section, Authority, has a list of the DNS server names that are authoritative
    for the DNS name in fact. Finally, the Additional section shows the IP addresses
    of the authoritative DNS servers. A few more pieces of information are also in
    the DIG results, including the amount of time the query took, the DNS server that
    responded, the response message size, and the message header, including status
    message flags.


    DIG is also capable of requesting information from a DNS server that isn''t the
    default server for the computer. To request information from a different server,
    type DIG @dnserver <domainname>, where dnserver is the server you want to use
    and domainname is the DNS name for which you want to retrieve the information.
    Figure 6-18 shows DIG being used to query a DNS server that isn''t in the resolv.conf
    file for the system.'
  merge: -1
  img_proc: true
