- pgno: 3
  md: '# # DNS For Dummies


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_3_0.png)


    # ## NSLOOKUP Interactive Mode Commands


    # ## Zone Types


    +   - `<name>`: By typing the fully qualified domain name to query, the A record
    is retrieved by default for that name. If you type a name that is not fully qualified
    (for example, host other than `domain.tld`), the default domain set in your client
    configuration is appended by each search domain if unset. If your computer is
    part of the superdomain, an NSLOOKUP query for simply returns results.

    - Server: The server command is used to configure which server is queried when
    a query is specified. By default, your computer''s configured DNS server is used.

    - Set type: The set type command is used to set the query type. Default records
    are retrieved. The set type can be used to select any record type (A, MX, PTR,
    CNAME and so forth or ANY), which retrieves any for the domain.


    +   - Master (primary): A master zone is edited when changes are made to the domain.
    The master zone contains the master copy of the zone data. Typically, only data
    in a single master zone is edited, saving you from having to edit the zone data
    on each DNS server and keep it synchronized. Multiple master servers are used
    sometimes, such as on the DNS servers of a web hosting company.

    - Slave (secondary): The slave zone is synchronized from the master zone. Secondary
    zones are never edited, ensuring that the data on slave servers is always consistent,
    within reason, with the data on the master server.


    # ## DNS Client Settings


    +   - DNS server 1

    - DNS server 2

    - DNS server 3 (optional)

    - Domain

    - Search domains (optional)


    # ## Troubleshooting Steps


    Follow these steps to find the source of your DNS server problems. Although these
    steps can''t cure all possible ills, they help you find a resolution in most cases:


    +   1. Check your log files. Many problems show up in the logs, making them simple
    to locate and repair

    2. Check your data using a command-line client, such as NSLOOKUP or DIG. If you''re
    having problems with a zone or specific record, use one of these tools to attempt
    to locate the problem.

    3. Check your data by hand. The last resort is to go through your zones and configuration
    by hand, looking for the problem with the specific zone or record.


    # ## How DNS Facilitates E-mail


    These quick refreshers show how DNS and SMTP work together to get your e-mail
    from Point A to Point B:


    +   1. The client sends an SMTP message to an SMTP server.

    2. The SMTP relay server locates the MX record for the domain in the e-mail address
    (user@domain.tld).

    3. The SMTP relay server sends the message to the host hosted by the MX record.


    # # For Dummies: Bestselling Book Series for Beginners'
