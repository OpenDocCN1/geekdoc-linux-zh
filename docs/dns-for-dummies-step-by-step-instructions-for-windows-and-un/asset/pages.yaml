- pgno: 56
  md: '# Chapter 3: The DNS Request Process


    # Layer 3: 1 see 1p


    As we state in the preceding section, the IP protocol runs on Layer 3 of the OSI
    model. Without getting too much technical detail, Layer 3 (the network layer)
    is essentially the point at which hardware protocols, such as MAC for Ethernet,
    are abstracted from the software protocols, such as the TCP/IP stack or the IPX/SPX
    stack commonly used by Novell Netware. You can think of the network layer as the
    boundary between network hardware and software.


    The importance of IP is that it''s the lowest-level protocol that every node on
    the Internet shares. For this reason, IP is where addressing must happen. Each
    node on the Internet has a unique IP address, which is simply a unique identifier
    that allows one node to reach another. Think of a postal mail analogy: If you
    want to send a letter to someone, you only need the person''s address. Similarly,
    if you want to send an IP packet of data to someone on the Internet, you need
    only the IP address.


    A great deal of jargon is associated with networking — in particular, the terms
    hosts, routers, and nodes. A host is a system that doesn''t route packets — it
    simply sends and receives them. A router is a system that routes packets toward
    their destination. A node refers to either a router or a host.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_56_0.png)


    # Getting from A to B


    Let''s take a quick look at how IP manages to move traffic around a network. When
    you send a snail-mail letter to someone, the letter isn''t delivered directly
    from your house to the other person''s house. The letter is routed through a series
    of post offices until it reaches its destination. The behavior of IP is exactly
    the same. You can think of the Internet as a mesh, or web. Some nodes are connected
    to other nodes, but not every node is connected to every other node. Theoretically,
    however, a path from one node to any other node exists through a combination of
    routers, the hardware used to route traffic over the Internet. Each trip a packet
    of data takes from one router to the next is called a hop, and there''s a maximum
    of 30 hops from one node to another. This limitation in the IP protocol protects
    packets from getting caught in routing loops, where the destination is never reached
    and the packet is simply passed back and forth forever.'
  merge: -1
  img_proc: true
