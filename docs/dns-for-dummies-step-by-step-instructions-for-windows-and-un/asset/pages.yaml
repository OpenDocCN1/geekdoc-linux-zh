    When you use keys, the BIND configuration file (typically named .conf) and the
    rndc configuration file (rndc.conf) should be set to a permission level at which
    they are read only by their owner because they contain keys that can allow a malicious
    user to perform unauthorized updates or zone transfers or control the DNS server.
    Use the command chmod 600 <file> to set the permissions on these files. As a result,
    only the owner of the file and root can read and write to the file.


    # Securing zone transfers


    BIND also allows zone transfers to all clients by default. You should restrict
    zone transfers to all zones to your slave DNS servers (if any). Just add an allow-transfer
    statement to each zone or to the entire server. Most likely will want to disable
    all zone transfers by default in the BIND configuration file and allow zone transfers
    as needed in the zone files. You may also want to allow zone transfers to your
    known slave servers globally and allow or disapp zone transfers to other systems
    on an as-needed basis in the zone files.


    To disable zone transfers globally, add the following lines to the options section
    of your BIND configuration file — typically, /etc/named.conf:


    ```

    options {

    allow-transfer ( );

    }

    ```'
