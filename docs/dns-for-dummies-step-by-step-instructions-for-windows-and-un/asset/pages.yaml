    # Moving in Increments


    Normally, whenever zone transfers take place, the slave server transfers the entire
    contents of a zone each time. The incremental zone transfer (IXFR) protocol allows
    a slave to transfer only the part of the zone that has changed rather than the
    entire zone. On very large zones, this protocol can save a significant amount
    of time and bandwidth.


    IXFR can be used only on zones that have a change history. Under Windows, most
    zone transfers can be done using IXFR. In BIND, only dynamically updated zones
    and zones that have been transferred using IXFR can be transferred to a slave
    server using IXFR. Manually configured zones and slave zones using the traditional
    zone transfer process cannot be transferred using IXFR. This isn''t a major disadvantage
    for IXFR because dynamically updated zones are normally the largest zones because
    they have large numbers of workstations (typically). Manually configured zones
    are often much smaller.


    IXFR is used automatically by both Windows and BIND 9 servers requesting a zone
    transfer from the master server. If the zone cannot be transferred using IXFR,
    the master server sends the entire zone using a traditional full zone transfer
    (AXFR).


    # Split DNS


    Split DNS is something you can do only on BIND because it isn''t supported under
    Microsoft Windows. Split DNS is a way of designing a DNS architecture where internal
    systems have different access to DNS records from external users. Two sets of
    DNS servers are required for this design, one on the external and internal networks.
    The internal DNS servers accept queries from internal clients and contain records
    for internal servers. All other requests are forwarded to the external DNS servers.
    The external servers may be queried by all clients, internal and external. The
    external DNS servers should be accessible from both the outside and inside of
    the private network. As you can see, this arrangement goes long way toward securing
    the local network because external clients cannot ever query the server that is
    hosting information about internal hosts. You can still determine internal DNS
    information through other methods, but this is still a worthwhile practice to
    limit the'
  merge: -1
  img_proc: true
