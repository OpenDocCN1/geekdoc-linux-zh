    \ configuration is used because the same zones are stored on both the internal\
    \ and external DNS servers. The internal servers contain all records for the zones,\
    \ and the external servers contain only records that external clients can access.\n\
    \nThe configuration of split DNS is fairly complex, especially when e-mail must\
