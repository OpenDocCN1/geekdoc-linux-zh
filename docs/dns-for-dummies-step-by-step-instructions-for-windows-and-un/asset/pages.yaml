- pgno: 77
  md: '# 58 Part I: How DNS Makes the Internet Go ''Round


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_77_0.png)


    Figure 4-4:

    Multiple MX records with equal priorities are used for load balancing.


    The procedure for establishing a backup mail server is similar except that you
    set the priority of the MX records to different values.


    The DNS record with the lowest numerical priority value has the highest priority
    to a client. Likewise, a record with a higher numerical priority value has a lower
    priority to a client. Simply put, lower values equal higher-priority records.
    A record with a priority of 10 is always used before a record with a priority
    of 20.


    Figure 4-5 shows a Windows DNS implementation of the required MX records for a
    backup mail server. Note that the main mail exchanger has a priority of 10 and
    the backup has a priority of 20. The main mail exchanger is always used before
    the backup.


    In BIND, the MX records are created in the zone file as follows:


    ```

    @      IN MX 10 mail

    @      IN MX 20 backupmail

    ```


    The lower-priority-value record is used before the higher-priority-record.'
