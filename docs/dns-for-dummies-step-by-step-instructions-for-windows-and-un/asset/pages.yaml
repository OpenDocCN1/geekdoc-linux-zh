- pgno: 122
  md: '# Chapter 7


    # Installing a Microsoft DNS Server


    +   In This Chapter

    - Installing a DNS server on Windows 2000 Server and Windows .NET Server

    - Working with DNS and Active Directory

    -Installing a DNS server on Windows NT 4.0

    - Configuring the DNS service


    His chapter takes you on a tour through the process of installing and configuring
    a DNS server on Microsoft Windows server operating systems. The DNS server component
    is packaged with virtually all server operating systems produced by Microsoft.
    Because these operating systems are widely used, you may, if you are given the
    task of configuring DNS, need to work with a Microsoft DNS server at some point.
    One plus to this situation is that the process for configuring a DNS server is
    easier on a Windows platform than it is on Unix operating. (We describe the Unix
    servers in Chapter 8.) Keep in mind that many DNS servers are run on Unix because
    of their reputation for stability and scalability. Regardless, many DNS servers
    are running on Windows operating systems because of its ease of use. Also, DNS
    servers providing services to Microsoft clients in a LAN environment are often
    better served with a Microsoft DNS server.


