- pgno: 125
  md: '# 106 Part III: Working with DNS Servers


    important concepts. A number of advanced Active Directory and Windows 2000 Server
    cover this subject, in addition to related technical white-papers at the Microsoft
    server home page:


    www.microsoft.com/windows2000/server/


    Also, Active Directory integrates automatically with DNS, and no manual configuration
    is required. Active Directory cannot be used, in fact, unless a DNS server is
    installed. It''s worthwhile, therefore, to follow along with our overview of how
    DNS plays a role in Active Directory.


    In the past (Windows NT 4.0 and earlier versions), computers on the local network
    could talk to each other using computer names following the NetBIOS (Network Basic
    Input Output System) protocol. Other computers could be contacted by using the
    \computer syntax. NetBIOS could not be used reliably to support a network with
    multiple segments, for larger networks another solution was needed. If the network
    spanned multiple work segments, a number of Windows Internet Naming Service (WINS)
    servers had to be implemented to share queries to the WINS server to find the
    IP address of a host, allowing communications across multiple network segments
    (as a router). However, WINS has a notoriously bad reputation among system administrators,
    having earned the reputation of being only sporadicly reliable and poorly suited
    to handling large numbers of client systems (poor scalability).


    With the introduction of Windows 2000 Server, the traditional domain controller
    model from Windows NT 4.0 and earlier was eliminated in favor of Active Directory.
    The Active directory service maintains a database of all users, computers, and
    groups on the network. Domain controllers in the Windows NT model were replaced
    with Active Directory servers in the Windows 2000 model, and reliance on the NetBIOS
    protocol was all eliminated, although it''s still supported.


    Because NetBIOS has been phased out for the most part, WINS is no longer useful
    as a naming service for computers on the local network. Instead, the Windows DNS
    service is used in its place. The Windows DNS service in Windows 2000, and in
    all the subsequent operating systems, uses a dynamic DNS server. A Workstation,
    therefore, can automatically register its name and IP address in the DNS database
    just as Windows NT 4.0-based systems registered their NetBIOS names in WINS. Windows
    2000 and newer systems are automatically configured to dynamically register in
    DNS, so as soon as the system is connected to the network, it can be accessed
    using its name.'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# Chapter 7: Installing a Microsoft DNS Server\n\nIn addition to maintaining\
    \ the database of computer names, the DNS service maintains a list of available\
    \ services, such as domain controllers and global resource catalogs. These services\
    \ are maintained in DNS using locator (SRV) records. (We discuss these and other\
    \ record types in Chapter 9.) Keep in mind that these records are used by clients\
    \ looking for a particular service. The client looks in the DNS database for a\
    \ service and is pointed to the appropriate server by the SRV record.\n\nThe Microsoft\
    \ dynamic DNS service provides the complete naming infrastructure for an Active\
    \ Directory-based network. You should note, however, that other dynamic DNS servers,\
    \ such as BIND 9 running on Unix, have been used successfully in Active Directory.\
    \ The Microsoft TechNet article \"Configuring Berkeley Internet Name (BIND) to\
    \ Support Active Directory\" outlines this. You can find the article at\n\n```\n\
    www.microsoft.com/technet/treeview/default.asp?url=\ntechnet/prodtechnol/iis/deploy/depovg/CfgBIND.asp\n\
    ```\n\n(See Chapter 8 for more information about DNS on Unix.)\n\n# Installing\
    \ a DNS Server on Windows NT 4.0\n\nDNS on Windows NT 4.0 is used only for pure\
    \ DNS services and must be manually updated. It doesn't integrate into the domain\
