  md: '# Chapter 8: Unix Domain Name Servers


    After the configure script is complete, a config.h file is created. If you''re
    familiar with C programming, you know that it is a header file containing all
    the configuration information for BIND. You can now compile BIND. The process
    is much simpler than it sounds.


    2. To compile the software, ensure you''re in the directory where the source code
    is located (if you just run the configure script, you''re already there) and type
    make, as shown in Figure 8-11.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_166_0.png)


    Figure 8-11

    The make utility is responsible for compiling the software.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_166_1.png)


    The make utility is responsible for compiling the software, but doesn''t perform
    another script, Makefile, which runs the compiler.


    After you have run the make utility, the software is compiled but not installed.
    Installing the newly compiled binary packages is as simple as the compilation
    process.


    3. At the shell prompt, type make. This command installs the binary packages in
    the correct places.


    Although installing from packages requires two packages, one for the base BIND
    applications and one for utilities, installing from source code requires only
    the one of them. You can now move on to configuring BIND.


    # Changes to BIND


    A couple of steps are involved in configuring BIND, and the first steps relate
    to getting BIND running, and the remaining steps relate to the familiar configuration
    of dns zones.'
