    # # Finding the Integrated DNS Clients in Windows


    Windows contains a number of integrated DNS clients in addition to a command-line
    DNS client, NSLOOKUP, which is covered in the next section. Integrated clients
    are in applications such as Internet Explorer and Outlook and serve to resolve
    DNS names to IP addresses for the application.


    The integrated DNS client you''re likely to use most is built into Internet Explorer.
    Internet Explorer has an integrated DNS client that uses the Windows resolver.
    The DNS Client service is used, as described in the preceding section, unless
    it''s not running, and then the basic resolver is used.


    6-3 shows an example of the Internet Explorer DNS client. We typed the Web address
    www.google.com on the Address bar, and Internet Explorer automatically resolved
    the name to an IP address and retrieved the Web page. If the page has links to
    off-site content, Internet Explorer may resolve a number of DNS names.


    Outlook is another example of an application with an integrated DNS client. Although
    Outlook doesn''t process any e-mail itself, it must still send and retrieve e-mail
    from the mail servers. When you''re configuring your e-mail accounts, you can
    simply enter the DNS names of the outgoing and incoming mail servers, and Outlook
    resolves those names to addresses when you send or receive e-mail.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Chapter 6: Using the DNS Clients on Your System


    # 85


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_104_0.png)


    Figure 6-3: Internet Explorer has an integrated DNS client.


    If the DNS Client service is started (as it is by default), the responses to Outlook''s
    request for the IP address are served from the resolver cache rather than DNS
    servers as long as the cached entry is valid. For example, if the cached entry
    is valid for one hour and you check your e-mail once per minute, only one request
    to the DNS server is made each hour; the other 59 requests are served from the
    cache. Without caching, the DNS server would have to answer 60 requests for the
    same information every hour.


    # Using the Command-Line Client (NSLOOKUP) in Windows


    NSLOOKUP is used in Windows from the command line. The simplest way to begin using
    NSLOOKUP is to open a command-line window. From Windows 2000 and later, click
    the Start button and choose Accessories>Command Prompt. The command prompt window
    is shown in Figure 6-4.


    Before you begin using NSLOOKUP, you should have DNS servers configured, as discussed
    in Chapter 4.'
