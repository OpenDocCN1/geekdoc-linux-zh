- pgno: 20
  md: '# Introduction


    Welcome to DNS For Dummies! This is the book you have always wanted if you have
    ever needed to understand DNS or you need to set up and configure a DNS server
    and you haven''t had the opportunity to learn the ropes yet.


    Admittedly, DNS can be a daunting hill to climb. Traditional DNS assumes that
    you''re an expert on the Internet and its protocols, such as TCP/IP, and it uses
    lots of big words and technical jargon. In DNS For Dummies, we avoid that kind
    of intimidating language in favor of information that anyone can decipher.


    # About This Book


    This book isn''t meant to be a thorough technical overview of DNS, although it
    does job admably. If you just need to get your toes on the topic of DNS, you may
    be especially interested in Chapters 1–4 because they build a basis for exploring
    the more technical theory described in the following chapters. If you want, you
    can skip those chapters and jump right into our description of how to install
    and configure a DNS server.


    When you need to perform a task with DNS as either a client or a server, you can
    pick up the book, turn to the section you need, and start from there. You don''t
    need lots of knowledge to be able to jump into any section because the walk-through
    examples for each procedure are detailed.


    # How to Use This Book


    This book is designed to be used as a practical guide to implementing and maintaining
    DNS on Windows-family servers and Unix-based servers. Additionally, if you''re
    exploring the possibilities of building your own DNS server, this book contains
    information that demystifies the inner workings of DNS. As a working reference,
    this book contains the needed information that will help configure your DNS server
    initially and continue supporting it long afterward. This text is a job aid, a
    handy and insightful resource you can use for answering DNS configuration- and
    maintenance-related questions in a hurry, in addition to its wealth of information,
    DNS For Dummies contains tips for getting additional information about particular
    topics related to DNS.'
  merge: -1
  img_proc: true
