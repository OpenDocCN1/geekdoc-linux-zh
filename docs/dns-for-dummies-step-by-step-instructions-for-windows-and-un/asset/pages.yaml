- pgno: 321
  md: '# 302 DNS for Dummies


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_321_0.png)


    ### B-6: The Webmin configuration is incorrect, and Webmin cannot find the BIND
    files.


    > > The BIND DNS server /sbin/named could not be found on your system. Maybe it
    is not installed, or your BIND module configuration is incorrect.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_321_1.png)


    ### B-7: Configuring Webmin to work with your system.'
