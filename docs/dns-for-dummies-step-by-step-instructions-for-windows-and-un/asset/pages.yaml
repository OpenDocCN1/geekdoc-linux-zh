- pgno: 28
  md: '# Chapter 1: The Basics of DNS


    Earlier in this chapter, we mention that the Internet uses the TCP/IP protocol
    suite to operate. Like the Internet, DNS depends on TCP/IP to operate. For that
    reason, we briefly examine the TCP/IP protocol suite in the following section.


    # 1 Introduce Thee to TCP/IP


    Transmission Control Protocol/Internet Protocol (TCP/IP) is the primary protocol
    suite on which the Internet now runs. Most often, networks can be described as
    being layered entities, and the Internet isn''t any different. Each layer has
    its own protocols and processes designed to deal with particular segments of the
    network communications protocol. The lowest layers encompass the physical network
    connection on which the network is running. These layers are handled by the network
    hardware—such as routers and switches, the network cards in computers, and the
    physical network cabling—so the Internet on those layers is agnostic (it doesn''t
    matter what type of media or protocols are running on those layers as long as
    each node can talk to every other node with which runs on a variety of physical
    networks, such as phone lines, T-carrier lines (such as T1 and T3), optical carrier
    lines (such as OC-3 and OC-12), in addition to other technologies, such as X.25
    and ISDN. As long as a node can talk to a neighbor through some method, that can
    become part of the Internet.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_28_0.png)


    The International Standards Organization (ISO) has built for network communications
    a specification known as the Open Systems Interconnect, or OSI. This layered model
    specifies which specific protocols (residing within the various layers) must be
    capable of handling. For example, protocols of the Sessions layer (Layer 5) are
    concerned with maintaining a communication session between two hosts.


    At the highest layers of the network lie the applications. Application protocols,
    including HTTP and FTP, are what allow you to do anything on the Internet. They''re
    the protocols that run the World Wide Web, e-mail, and everything else. A variety
    (an almost endless variety) of these application protocols exist, and although
    they''re technically part of the TCP/IP protocol suite, don''t be concerned about
    them here.


    Linking the applications at the highest layer of the network to the physical layers
    at the lowest layer are the TCP/IP protocols. Although TCP/IP is usually referred
    to in singular form, it''s a combination of number protocols, including TCP or
    UDP, which is always present. IP, a network layer protocol, interfaces with the
    lower layers of the network to enable data transmission across the physical network.
    At the layers below IP, only raw data is passed. The IP protocol also implements
    the addressing for each node—hence, the IP address. An IPv4 address consists of
    a 32-bit'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Part I: How DNS Makes the Internet Go ''Round''


    binary number (although typically noted in decimal, IPv6 also uses a 128-bit address)
    that expresses a host and a network. Each node on an IP network must have a unique
    IP address. These addresses are how the nodes contact each other.


    TCP sits above IP in the protocol stack and is known as a transport layer protocol.
    Although IP implements higher-level data-transmission features, such as flow control
    and error correction, to ensure that a connection is reliable. In other words,
    every packet that is sent reaches its destination.


    In addition to TCP, another transport layer protocol is in the TCP/IP suite: the
    Unreliable Datagram Protocol (UDP). UDP, unlike TCP, doesn''t concern itself with
    reliability. Packets may be sent, but you have no guarantee that the packets will
    be received or they will be correct when they''re received. UDP is a faster transport
    protocol than TCP, but it moves the onus for data reliability to the application
    layer protocols. This arrangement is sometimes favorable for performance reasons.


    # The OSI model


    As we mention in the preceding section (refer to the Technical Stuff paragraph),
    a standard model for networking protocols is the Open Systems Interconnect (OSI)
    model. The OSI model, made power-full by the International Standards Organization
    (ISO), was designed primarily to support a developer''s ability to change the
    elements within any of the individual layers, without having to modify components
    in the other six layers, as long as standards are followed. This functionality
    exists because components any of the seven layers are concerned with only two
    issues: how to send data to adjacent layers and what to expect from adjacent layers.
    For example, Layer 5 cares about only communicating with Layer 4 and Layer 6.
    As far as Layer 5 is concerned, all other than 4 and 6 are as well as not exist.


    How does the OSI model relate to the TCP/IP suite of protocols? The OSI model
    is a system of seven layers designed to compartmentalize the different functions
    of intersystem communication, such as when two computers on a network are transferring
    data (see Figure 1-1).


    TCP/IP is a protocol, not just a single protocol. It includes a number of protocols,
    each residing on one of the seven layers, such as TCP, IP, UDP, DNS, HTTP, and
    even FTP. The seven layers of OSI model are often referred to by their layer:
    Layer 1 or Layer 2, for example. They also have "friendly" names, such as Application
    and Transport, that sort of describe the function of the protocols defined at
    that particular layer. These layers aren''t concrete items; more precisely, they''re
    a way of conceptualizing the process of communications between two systems.'
  merge: -1
  img_proc: true
