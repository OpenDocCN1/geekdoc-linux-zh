- pgno: 27
  md: '# Part I: How DNS Makes the Internet Go Round


    the scenes to remove much of the manual interaction on the Internet, ease of use
    was greatly improved. These protocols included, among others, the Domain Name
    System, or DNS. DNS eliminated the need to manually remember IP addresses and
    replaced them with human-readable names instead. DNS allows a name to be linked
    to an address and rather than have to remember a number of addresses, you need
    to know just the name of the system you want to contact. Although DNS plays quite
    a significant role in millions of users'' daily Internet, this ease of use is
    side effect of the original intention of DNS. DNS was invented to solve the logistical
    problems that arose because too many hosts were on the Internet to be able to
    keep track of using a manual list of addresses.


    # A Short History of the Internet


    The Internet, as we know it today, didn’t start out with the intention of being
    a global communications medium for public use. Originally, what is now the Internet
    was simply a few educational and military computers that were connected. This
    network began with four nodes in 1969 and was known as ARPANet, named for the
    Department of Defense Advanced Research Projects Agency (ARPA), which was in charge
    of developing the network that would provide a distributed communications system
    that could (among other things) survive a nuclear catastrophe.


    ARPANet originally used a protocol named Network Control Protocol (NCP) to connect
    participating hosts. Eventually, NCP no longer provided enough functionality to
    keep the budding network operating effectively. A new protocol, named TCP, was
    designed for ARPANet that would eventually be expanded into the TCP/IP protocol
    used on the Internet.


    ARPANet grew more, and more applications were developed for it. Not surprisingly,
    the first “killer app” on ARPANet was e-mail. Interestingly, the @ character as
    mean to separate the e-mail recipient and the server name was introduced in 1972,
    and the first emoticons were suggested on April 12, 1979. DNS was first introduced
    in 1984. The ability to dynamically map host names to IP addresses was particularly
    useful because approximately thousand hosts were on the ARPANet at that time.


    As time passed, ARPANet continued to grow in an almost exponential rate. Although
    1,000 hosts were on the Internet in 1984, when number grew to approximately 10,000
    in 1987, and to more than 100,000 in 1989. In 1990, ARPANet officially became
    the Internet. It took only another two years for another tenfold increase in the
    number of Internet hosts, to 1 million in 1992. More than 100 million hosts are
    now on the Internet. Note that this number refers to only registered A records
    in DNS and not to actual systems with only IP addresses.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_27_0.png)'
