- pgno: 314
  md: '# # Appendix B


    # # Using Webmin for BIND Administration


    +   In This Chapter

    - Installing Webmin

    - Using Webmin


    The Webmin open source application provides a Web front end for the administration
    of many common Unix services. In addition to providing with the ability to manage
    service through a Web browser, Webmin has a flexible feature set because it was
    built as a modular application. A modular application makes use of subapplications,
    or modules, to add functionality. If you need to make a change to a given module,
    you can typically modify that module without altering the overall operation of
    the master, modular, application. Although a wide variety of Webmin modules are
    available, if you need a module that isn''t available, you can develop it yourself
    or have custom developed.


    Webmin runs on all Unix systems, from widespread Linux and Mac OS X to the mammoth
    commercial Unix systems, such as Sun Solaris and IBM AIX. You can also run Webmin
    on Microsoft Windows under Cygwin, a Unix abstraction layer that allows the operation
    of Unix code on Windows-based systems. The only requirement beyond the basic operating
    system (Windows or Unix) is that you have the Perl 5 support files installed on
    your system. You can find a specific list of supported operating systems at www.webmin.com/support.html.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 296 DNS For Dummies


    # Get In with Webmin


    Depending on the operating system you''re using, you can use one of two installation
    methods:


    +   - RPM/Sun Solaris packages: For use with supported Linux and Unix systems

    - Source code: For all other supported operating systems


    # Using packages


    Installing Webmin from packages is the best option for most users because it''s
    a fairly simple process. If you have ever installed any software from packages,
    you should get no surprises here. If you''re working with a Sun Solaris system,
    you need to use the PKGADD command to install the appropriate package. If you''re
    a Linux aficionado, you use the RPM command to install the proper package. Of
    course, before you use either command to install anything, you need to get the
    package. You can download these packages from the Webmin Web site, at www.webmin.com.
    After you get to the Webmin home page, click the Downloading and Installing link,
    locate your package, and start the download. The Downloading and Installing page
    is shown in Figure-1.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_315_0.png)


    **Figure B-1:** Downloading Webmin.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Appendix B: Using Webmin for BIND Administration


    As you can see in the figure, four options are available on the Webmin download
    site. The first option is intended for anyone needing the Webmin source code.
    If you are compiling Webmin from source code, download this file. The remaining
    files listed are of various types, including the RPM binary files, source code
    in RPM format, and Solaris packages. The sample system we use is Mandrake Linux
    (which supports RPM), so we downloaded the RPM binary files. After you have the
    RPM binary files, you can install Webmin by opening a console changing to the
    directory where you downloaded the RPM package and then executing the command
    rpm -Uvh webmin-1.030-1.noarch.rpm, Replace the RPM filename with the name of
    the RPM package you have downloaded.


    You can use the rpm -i in place of rpm -Uvh; they both install packages. The -i
    command is most commonly used for installing packages, but if an earlier version
    of a package is already installed and rpm -i is used, the earlier version is not
    removed and you''re left with two separate installations. Using the rpm -Uvh command,
    however, installs a package exactly if no existing version of the package exists,
    or if you upgraded and the old version of the package is removed instead of being
    left in place, like rpm -i.


    Figure B-2 shows the results of the rpm -Uvh command. As you can see, Webmin has
    been installed and started and is now running on the local system on port 10000.
    You should be able to connect to Webmin from a Web browser at this point. We describe
    the use of Webmin later in this appendix.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_316_0.png)


    ```

    File Edit Settings Help

    root@local# rpm -Uvh webmin-1.030-1.noarch.rpm

    Preparing...

    Operating system is Mandrake Linux [100%]

    1:webmin

    Webmin install complete. You can now login to http://localhost:10000/

    as root with your root password.

    root@local#

    ```


    Figure B-2: RPM has been used to install the Webmin package.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Starting at the source


    If you''re using an operating system that doesn''t support Solaris RPM packages
    or you need to have an installation specifically optimized for your system, you
    need to install Webmin from the source code. Installing from source code is more
    difficult than an installing from packages (refer to the preceding section, "Using
    packages") because it requires more steps and a little more knowledge; in some
    cases, however, it''s necessary. Because more steps are involved and you must
    compile the installer, you should avoid this process unless necessary.


    To install Webmin, follow these steps:


    +   1. Download the Webmin source code.


    Go to the Webmin site, at www.webmin.com, and click the Downloading installing
    link. From that page, as shown in Figure B-1, download the webmin***.tar.gz source
    file, where *** is the current version.


    +   2. Unpack the source code in the directory of your choice.


    First, move the file to the directory to unpack. Which directory you use doesn''t
    matter much because a new subdirectory is created and the source is unpacked into
    it.


    +   3. Unzip the source code by typing the command gunzip webmin-1.030.tar.gz.


    This command produces a file named something similar to webmin-1.030.tar.


    +   4. Unpack the file by typing the command tar xvf webmin-1.030.tar.


    The result is a new subdirectory named webmin-1.030 (or whatever version of Webmin
    you''re using) that now contains the source code for the Webmin application.


    You now configure, compile, and install the Webmin source code as a functioning
    application. Change to the new Webmin source subdirectory and read the README
    file. It contains installation information and other important information. Installing
    Webmin from the source code is fairly simple: Just run the file setup.sh. You''re
    prompted for some information:


    +   - The location of the Webmin configuration files


    +   - The location of system log files


    +   - The path to the Perl binaries


    +   - Your Web server port number'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Appendix B: Using Webmin for BIND Administration


    +   ✔ A name and password for the Webmin service


    +   ✔ Whether you want the Webmin service to start when the system boots


    Although you can accept the defaults for most of these options, you must set a
    password for the login name and select whether Webmin should start on bootup.
    After the setup script finishes, Webmin should be installed and running.


    # # How Do I Use This Thing?


    As its name implies, Webmin (short for Web administration) is a Web-browser-based
    tool that you can access from anywhere by loading the appropriate server name
    or IP address and port number into a Web browser session. To use this tool, you
    connect to your Webmin server from a Web browser, as shown in Figure B-3. You
    simply use `http://localhost:10000` from the local system or `http://ipaddress:10000`
    from a remote system.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_318_0.png)


    **Figure B-3:** Connect to Webmin through any Web browser.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 300 DNS For Dummies


    After you have connected to Webmin, enter the username and password you specified
    during the setup process or use the root password if you installed from the RPM
    file. The Webmin console opens, as shown in Figure B-4. You can also enable the
    Remember login permanently check box and have Webmin remember your username and
    password. If you will be accessing the Webmin tool from various locations or you''re
    using the root account for authentications, it isn''t a good idea to have Webmin
    remember your login information.


    # Making Webmin play with BIND


    After you have connected to the Webmin service, you need to complete some basic
    configuration before it becomes truly useful.


    +   1. Click the Servers button at the top of the Webmin console.


    The Servers page opens, as shown in Figure B-5. The Servers page shows installed
    Webmin modules for working with various types of applications.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_319_0.png)


    Figure B-4: The Webmin console.


    root logged into Webmin 1.030 on mdk (Mandrake Linux 8.2)'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Appendix B: Using Webmin for BIND Administration


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_320_0.png)


    Figure B-5: The Webmin Servers page shows the installed Webmin modules.


    All the modules are installed by default, you can install many other Webmin modules
    later. A Webmin module is simply a Perl script built in a way that the Webmin
    service can use the module to perform some kind of task. A discussion of how to
    add and build modules for Webmin is beyond the scope of this book, but if your
    interest is piqued, you can check out the helpful documentation on the Webmin
    site, at .webmin.com.


    2. Click the BIND DNS Server module.


    You probably see an error message, as shown in Figure B-6, unless BIND files are
    all in the location expected by Webmin.


    The Webmin module is for BIND 8 because BIND 9 module is available yet. The module
    does support BIND 9, but not all BIND 9 options are available.


    3. Regardless of whether you receive the error, click Next on the Module Config
    tab to enter the BIND module configuration, as shown in Figure B-7.'
  merge: -1
