- pgno: 108
  md: '# Chapter 6: Using the DNS Clients on Your System


    The only record you have retrieved in this section has an A record. What if you
    want to retrieve another type of record, such as an MX (mail exchanger) to find
    the name and IP address of the server providing e-mail services for a given domain?
    Use the SET TYPE command to specify which record to retrieve. Type SET TYPE=<record
    type> and press Enter at the NSLOOKUP prompt. The record type can be any of the
    standard DNS records, such as A or MX, or it can be ANY, which retrieves any record.
    After you select the record type to retrieve, you can enter a domain name at the
    NSLOOKUP prompt and the specified record type is retrieved, as shown in Figure
    6-9.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_108_0.png)


    Figure 6-9. Use the SET TYPE command to set the record type to retrieve to the
    MX.


    The SERVER and SET commands are the most commonly used in NSLOOKUP; however, you
    can use many more. To see a list of all NSLOOKUP commands, type ? and press Enter
    at the NSLOOKUP prompt. Figure 6-10 shows the NSLOOKUP help information. Most
    of these commands are rarely used.


    One command in NSLOOKUP looks promising: the LS <domain>, you can retrieve a list
    of all records in the domain. This feature must be useful because you don''t know
    the exact host you''re looking for. Alas, it''s too good to be true. Almost every
    DNS server in is not configured to list all records in the domain. The problem
    with the LS command is that it can lead to security problems.


    If a malicious user wants to attack your domain, he first needs to know hosts
    to attack. Without knowing which systems are on your network, he cannot attack
    any of them. The LS command in NSLOOKUP provides with an excellent way to see
    which computers are on the network. For reason, most servers don''t allow a listing
    of records.'
  merge: -1
  img_proc: true
