    support, which makes possible the creation of an IPv6 network. A few of these
    networks are in place. One of the oldest IPv6 networks in existence is 6bone (www.6bone.net),
    which is similar to the original Internet testbed Backbone. The 6bone network
    was originally set up as a testing facility for people writing IPv6 software,
    although anyone can connect to 6bone. Its connections can be made either through
    rare IPv6 links or the encapsulation of IPv6 in IPv4 packets. The encapsulated
    packets are decapsulated on the 6bone end and appear as IPv6 traffic.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_61_0.png)


    The 6bone network isn''t the only IPv6 network under development. The U.S. Department
    of Energy has undertaken the development of its network: The Energy Sciences Network
    (Esnet) is a large IPv6 network designed to interconnect scientific and government
    organizations. (Note the similarities to the origins of the IPv4 Internet, when
    ARPANet—refer to the section in Chapter 1 that gives a brief history of the Internet—was
    used to connect educational and government facilities.)


    No matter how the implementation of IPv6 occurs, it will take a long time. The
    scale of the project is incredibly large and growing every day as the Internet
    is adopted by more and more users. In addition, the IPv6 transition isn''t a directed
    project; rather, it relies on the involved parties, such as the major carriers
    and ISPs, to make the required changes on their systems, which they do on their
    own schedules. It may be several years until you see IPv6 running in concert with
    IPv4 and many more years until IPv6 makes IPv4 obsolete.


    # Getting Down to Business


    DNS resembles a global telephone directory, except that rather you call the phone
    number and dial it, as you do with “landline” phone or cell phone, you simply
    type in “phone” (your Web browser) the name of the party you''re trying to contact
    and the party is contacted automatically. DNS is useful because it''s much easier
    to remember a name like dummies, with an address 192.168.100.5.


    Although DNS seems like a big phone book of names and IP addresses, it''s much
    more complex than that. It''s laid out in a hierarchical map, for two reasons:
    It removes the requirement to have either one large directory that everyone uses
    or to have every directory contain every DNS name and IP address in existence.
    Instead, a large number of DNS servers exist; they''re'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Chapter 3: The DNS Request Process 43


    distributed and then queried only for the addresses they contain. If a DNS server
    houses the zone for a certain domain, it''s known as authoritative for that domain.


    The best way to understand how a DNS request is processed is to follow step-by-step.
    In this example, assume that the DNS name is www.microsoft.com and that the recursive
    DNS server''s cache is empty:


    +   1. You type a DNS name, such as www.microsoft.com, in your web browser or
    any other DNS-enabled software.


    +   2. The DNS client, which is usually part of the operating system, is called.
    The DNS client is contained in a dynamic loaded library (DLL) in Windows. In Unix,
    however, the process works a little differently: the application passes the DNS
    name to the DNS client and waits for a response, including the corresponding IP
    address or an error.


    +   3. The DNS client then takes over. It makes the DNS request to the DNS server
    that is configured in your network settings. The DNS servers are set in the network
    properties in Windows or in the resolv.conf file in Unix. The DNS client doesn''t
    do any resolution itself; it only passes the request from the application to the
    DNS server. The DNS client''s job is to accept the request from the application
    in a format the application understands, convert the request to a proper DNS request
    that the server understands, and then convert the response and return it to the
    application.


    +   4. The DNS server configured in the client''s network settings receives the
    request. This DNS server must be a recursive DNS server, which means it can process
    requests for domains for which it isn''t authoritative. Some DNS servers have
    recursion disabled and cannot process requests unless they''re for the requested
    domain.


    +   5. The recursive DNS server begins the resolution process. It first looks
    at the DNS name in the request in reverse order. In this case, the DNS name is
    www.microsoft.com. — with the trailing period. The first thing the DNS server
    notices is the trailing period, indicating the root of the namespace. Because
    the recursive DNS server already has addresses for the root hint file, it doesn''t
    need to look up that address (it can''t be no DNS server is above the root in
    the hierarchy).


    +   6. The recursive DNS server picks a root server from its root hint file and
    requests addresses for the server hosting the next component of the DNS name —
    in case, .com. The root server returns a list of servers that are authoritative
    for .com, and the recursive DNS server caches those servers as authoritative for
    .com so that it doesn''t need to make the request again until the TTL expires.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 44 Part I: How DNS Makes the Internet Go ''Round


    +   7. The recursive server then chooses an authoritative server for .com from
    the list returned by the root server and sends a request for the name server authoritative
    for the .microsoft.com domain.


    +   8. The .com authoritative server returns a list of authoritative servers,
    and the recursive DNS server caches that list in association with .microsoft.com.


    +   9. Now that the recursive server has resolved the entire domain name, all
    that''s left to resolve the IP address of host. It chooses an authoritative server
    from the list for .microsoft.com and sends a request for the host (A) record associated
    with www.microsoft.com. The authoritative server for .microsoft.com returns all
    the A records for www (if there''s more than one) to the recursive DNS server.
    Round robin DNS then occurs (see Chapter 12). The authoritative server returns
    records in the order of the lowest metric first, or if the metrics are equal,
    it rotates the order in which it returns the records with each request. The recursive
    server caches the list of A records associated with .microsoft.com.


    +   10. The recursive DNS server returns the list of A records to the DNS client.
    The client decides which IP address to use. According to the DNS standards, the
    client is supposed to use the first address in the list (if there''s more than
    one). By default, however, Windows 2000 and newer DNS clients place priority on
    IP addresses on the local subnet, although this behavior can be disabled.


    +   11. When the DNS client has decided which address to return to the application,
    it formats the IP address data in the correct format and returns it to the application
    through the appropriate communication channel.


    +   12. The application can now use the IP address to a socket to the remote host
    and begin the network communication.


    Although this process seems arduous, it''s fast (relative to a human timeframe
    in computer time, it''s slow). A huge advantage also exists in this massively
    distributed architecture: Although the root servers must be incredibly powerful
    and the top-level domains must be fairly powerful — especially for the busier
    TLDs, such as .com — the lower-level name servers don''t need to be powerful.
    At a company doing Web hosting, for example, the root servers may be authoritative
    for 1,000 domains or 10 slow machines hosting 100 domains each, and it makes no
    difference to users or any other DNS server.'
  merge: -1
  img_proc: true
