    \ thing you need to do is install BIND. If that's the case, you can install BIND\
    \ in two ways: from binary packages and from source code. Although both methods\
    \ have advantages, using the binary packages is generally much easier.\n\n![](img/ef3dfe2cb04fcef67ad22a0599c29f36_157_0.png)\n\
    \nBinary packages are collections of executable files that are ready to run, although\
    \ you need to ensure that the package is the correct one for your version of Unix.\
    \ Source code is the code for the software; to make use of it, you would need\
    \ to compile the source into a binary package. Most often, source code is used\
    \ by people who have difficulty finding packages of their build of Unix or who\
    \ want to make compile-time customizations to the software — it's something only\
    \ experts should do.\n\n# # Installing BIND the Easy Way\n\nPackages are simple\
    \ to install on most Unix systems. BIND packages are available for most distributions\
    \ of Linux, Sun Solaris, HP-UX, and other common Unix OS distributions. In the\
