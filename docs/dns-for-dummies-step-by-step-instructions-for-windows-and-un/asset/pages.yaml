- pgno: 137
  md: '# 118 Part III: Working with DNS Servers


    DNS server in the left pane of the DNS MMC snap-in and choose Properties from
    the Action menu. This step opens the DNS server Properties dialog box, as shown
    in Figure 7-19. By default, the Interface tab is.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_137_0.png)


    Figure 7-19: Configuring the network interfaces on which the server responds.


    # Getting connected with interfaces


    You have two options on the Interfaces tab: clients on all IP addresses (the default
    behavior) or just to clients connecting to a specific IP address. This option
    is useful if you have a multi-homed server (connected to more than one network)
    and you want clients connecting on only one network to have DNS services from
    this server. To enable this, select the Only following IP addresses option and
    specify the IP addresses on which the server should respond by typing the address
    and clicking Add. You can remove addresses from the list by selecting the address
    to remove and clicking the Remove button.


    # Moving forward


    Figure 7-20 shows the Forwarders tab in the Properties dialog box. Forwarders
    are a somewhat complex subject. Whenever a client makes a request for a DNS entry
    that is not hosted by the local DNS server, the recursion process is normally
    used by the local server to locate the DNS entry on the remote DNS server. Recursion
    (refer to Chapter 3) works like this: The local DNS server first contacts a root
    DNS server followed by a top-level server (.com or .net for example) and, finally,
    the correct authoritative server for the domain name.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Chapter 7: Installing a Microsoft DNS Server 119


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_138_0.png)


    Figure 7-20: Use this dialog box if you want to use another DNS server rather
    than recursion.


    In some cases, you may not want your local DNS server to perform recursion, or
    you may want it to perform recursion only as a last resort. That may be the case
    if you have a slow Internet connection or to restrict DNS queries across a firewall.
    In this case, you can configure a forwarder in the DNS server properties box.


    To enable a forwarder, follow these steps:


    +   * **Select the Enable forwarders check box.**

    * **Type the IP address of the remote DNS server in the IP address box.**

    * **Click the Add button.**


    You can add a number of DNS servers to the list and change their order by clicking
    the up- and down-arrow buttons. You should have the closest (on your LAN or LAN
    segment) or fastest DNS servers at the top of the list.


    After you have enabled one or more forwarders, any requests not hosted by the
    local DNS server are sent to the DNS servers on the list of forwarders. This process
    is performed in sequence: Requests are sent to the first server on the list, and
    if a response isn’t received, the next server is tried. If the forwarders dont
    provide a response, the local DNS server uses recursion to provide a response.
    Two advantages occur when the local DNS server doesn’t use recursion (in the case
    of a forwarder providing a meaningful response to the request):'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Part III: Working with DNS Servers


    +   - Only one connection is made from the local DNS server to the forwarder.

    - The forwarder performs the multiple DNS requests involved in the recursion process.


    This process, reduces the time it takes to resolve names, is quite noticeable
    when a slow Internet connection is in use. You can disable recursion when using
    a forwarder by selecting the Don''t use recursion check box.


    The basics

    The Advanced tab in the DNS server Properties dialog box is shown in Figure 7-21.
    From this tab, you set advanced parameters on the DNS server. You can set a number
    of server options, as shown in the list. The Disable recursion option, when enabled,
    causes the DNS server not to return any DNS entries not hosted by the server.
    This option is useful if you want to configure a server for only authoritative
    DNS hosting and for regular client queries. This configuration is common at ISPs
    that have one of servers for fulfilling client requests and one of servers for
    hosting DNS zones.


    | Interfaces | Forwarders | Advanced | Root Hints | Logging | Monitoring |

    |---|---|---|---|---|---|

    | Server version: | | | | | |

    [ ] | | | | | |

    Server options: | | | | | |

    | [ ] Disable recursion | | | | |

    | [ ] BIND records | | | | | |

    | [ ] Fail on bad zone area | | | | | |

    | [ ] Enable round robin | | | | | |

    | [ ] Secure cache against pollution | | | | | |


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_139_0.png)


    Another advanced option is BIND secondary DNS servers. DNS records are exchanged
    from primary to secondary DNS servers through a zone transfer. When you enable
    the BIND seconds option, zone transfers take place through the traditional method,
    and all DNS server applications are supported. If you''re using only Windows DNS
    servers and BIND versions later than 4.9.4, you can deselect this option, and
    zone transfers then take place through zone transfers. Fast zone transfers use
    compression for increased speed. If you choose to deselect this option, you must
    ensure that you don''t need to transfer zones to servers that don''t support zone
    transfers.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "# Chapter 7: Installing a Microsoft DNS Server\n\nFail on load if bad zone\
    \ data, a fairly simple option, is turned off by default. \nIf it's enabled and\
    \ a zone file contains invalid data, however, the DNS service doesn't start. The\
    \ default option allows the DNS service to load even if invalid data is in a zone\
    \ file. In most cases, the default is preferable. If you aren't a practised master\
    \ or mistress of troubleshooting DNS services, enabling this option could lead\
    \ to a frustrating episode if a bad zone transfer occurs.\n\nThe enable round\
    \ robin option enables DNS round robin load balancing. \n(We describe this topic\
    \ in detail in Chapter 12.) The Enable netmask ordering option enables the feature\
    \ in the Windows DNS server that returns replies based on local subnet priority\
    \ on a computer connected to more than one subnet. The translation: In a system\
    \ with multiple IP addresses mapped to a single host name on the DNS server, the\
    \ preferred response is the IP that resides on the subnet as the requester if\
    \ match occurs. If no common subnet between the client and the target computer\
    \ exists, the first DNS name-IP mapping in the list is used instead. Both these\
    \ features are enabled by default.\n\nThe final option in the Server options is\
    \ Secure cache against pollution, which is disabled by default. This option provides\
    \ extra security to the DNS server's cache. If the option is selected and a record\
    \ is provided by a DNS server for a domain that was not requested, that isn't\
    \ cached. For example, if a request is made for `www.sample.tld` and the reply\
    \ contains both `www.sample.tld` and `www.poison.tld`, the record isn't cached\
    \ because it was not requested. We tell you more about DNS security, including\
    \ details about cache poisoning, in Chapter 11.)\n\nThree more configuration settings\
    \ are on the Advanced tab. The Name checking settings control which and record\
    \ names are allowed on the server. The three settings are\n\n+   - Strict RFC:\
    \ Only those names strictly defined by the DNS RFC (Request for Comment)\n- Non\
    \ RFC: Allows more names, including nonstandard characters\n- Multibyte: Allows\
    \ the use of the Unicode encoding standard in DNS names\n\nUnicode character encoding\
    \ is used in DNS names to allow foreign character sets (non-English) to use DNS.\n\
    \nThe load zone on startup option tells the DNS server where to look for zone\
    \ data. By default, both the system Registry and Active Directory are checked\
    \ for zone data. The other options are From Registry (it checks only the system\
    \ Registry) and From file (it loads zone data from a BIND4 named boot file. This\
    \ is useful if you're transferring zones and configuration information from a\
    \ Unix system running BIND 4."
  merge: -1
  img_proc: true
