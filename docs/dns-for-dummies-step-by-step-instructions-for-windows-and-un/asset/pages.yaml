    - Troubleshooting tips for BIND on Unix


    Simple DNS configuration changes that aren''t implemented correctly can lead to
    dire consequences. Because you will probably need to hunt down a problem and fix
    it sooner or later on your DNS server, this chapter spends some time on the topic
    of troubleshooting. There''s no sense in beating around the bush, so dive right
    in!


    One common problem with DNS servers is that after a change is made and the server
    is restarted (if necessary), the whole server or portions of the DNS service,
    such as individual zones, no longer work. When that happens, the problem is normally
    caused by syntax errors in the DNS configuration. This type of issue is a configuration
    problem, resulting from human error — the single largest contributor to DNS server
    dysfunction. Of course, problems can occur with DNS that result from something
    other than configuration issues, but that''s the exception and not rule. BIND
    9, for example, can be operated with static information and requires only the
    configuration file in order to run. The Windows DNS service is susceptible to
    a few more problems but is also quite stable.


    With Windows DNS and BIND, the procedures for isolating configuration problems
    are similar. In both cases, you should first investigate the DNS server''s logs
    to try to zero in the source of the issue and determine when it began. In many
    cases, the logs indicate the precise cause of a problem and the exact line in
    the file where the problem exists. If the log file not give you the information
    you need, start some investigation of your own. By using the command-line DNS
    tools and inspecting zones and configuration files, you can eliminate most common
    problems, even if they aren''t obvious in the log files or if login isn''t operational.
    Although errors resulting from configuration issues and bad syntax are bad'
