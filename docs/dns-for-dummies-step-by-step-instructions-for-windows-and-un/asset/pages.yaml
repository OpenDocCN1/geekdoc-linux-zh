    The Files and Directories page is shown in Figure B-13. This page allows you to
    painstakingly specify files for statistics and database output files, the PID
    file, and an alternative zone transfer utility. Defaults are specified, so you
    have no need to specify a new location for storing the kind of affected information,
    have no fear: You don''t have to touch a thing!


    Figure B-14 shows the Forwarding and Transfers page. As you may guess, this page
    is used to configure forwarders for the DNS server in addition to managing the
    global zone transfer options. To add a forwarder (if it''s the name or list of
    servers in the Servers to forward queries to) You can tell BIND how to behave
    in that resolution help is needed. If you select the Yes option, the local server
    performs a recursive lookup to resolve the address if the forwarder fails. If
    you select No, the server doesn''t perform a recursive lookup and sends back to
    the client an error indicating that the name resolution attempt failed.


    The zone transfer options are similar to those on the Other DNS servers except
    for the Maximum zone transfer time, which determines the longest amount of time
    a zone transfer can take. Using the zone format option, you can select whether
    zones are transferred in batches or individually, and using the Maximum concurrent
    zone transfers value, you can control how many zones can be transferred in a single
    batch.'
