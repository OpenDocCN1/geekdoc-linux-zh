    # # Troubleshooting BIND


    If you''re using BIND, making mistakes that require troubleshooting is easier
    than it is in Microsoft Windows DNS. The reason is primarily that the manual editing
    of configuration files leaves you open for typographical errors. BIND doesn''t
    always fail completely; if a zone is bad, that'
