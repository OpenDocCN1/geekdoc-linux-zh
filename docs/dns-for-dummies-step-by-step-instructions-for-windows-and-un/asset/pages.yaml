    The procedure may differ if you''re using a different Web browser.


    +   7. To go to the preceding page and click the appropriate architecture link
    for the bind-utils package and download it using the same procedure.


    After the download is complete, both packages are ready for use on your system.


    +   8. In preparation for executing the packages, open a terminal window and navigate
    to the directory in which the packages were saved.


    As you can see in Figure 8-5, the packages are in the current directory.


    ![](img/ef3dfe2cb04fcef67ad22a0599c29f36_161_0.png)


    Figure 8-5: The down-loaded BIND packages are in the working directory.


    When the rubber hits the road (so to speak): The installation process begins!
    When using Mandrake Linux (in addition to Red Hat and some other distributions),
    you use the RedHat Package Manager (RPM) to install the RPM packages.


    Typically, RPM is used to install packages by typing RPM -i <packagename>, where
    <packagename> is the filename of the package to install; for example, filename.rpm.
    although this is recommended, it falls short in some cases. The -i switch instructs
    RPM to install the package, but if an earlier version of the package is already
    installed, the procedure doesn''t work. A full discussion on the use of RPM is
    beyond the scope of this book, but you''re far better using the command RPM -Uvh
    <packagename> than -i because you don''t encounter issues if an earlier version
    of the BIND server is installed. The -Uvh switches instruct RPM to upgrade any
    existing packages, and the -v and -h switches instruct RPM to display verbose
    information and a progress indicator, respectively.'
