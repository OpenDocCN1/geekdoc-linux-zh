  \ Pi 并如书前面章节所讨论的那样，使用 `SSH` 或 `VNC` 连接到它。进入终端后，输入以下命令安装 python 和 telegram bot：\n\
  \n```bash\nsudo apt-get install python-pip\nsudo pip install teleport\n```\n\n下一步是连接你的\
  \ LED 设备——我们已在之前的项目中涵盖了如何操作。接下，使用链接 `t.me/<your bot name>` 启动你的机器人。\n\n### 项目脚本编写\n\
  \n在此项目中，我们将创建两个文件：`Button.py` 和 `Telegram.py`，并进行如下进行编辑：\n\n对于 `Button.py`，输入所示的代码![](img/image_rsrc2W6.jpg)!(image_rsrc2W7.jpg)\n\
  \n对于 `telegram.py` 文件，输入如下代码![](img/image_rsrc2W8.jpg)!(image_rsrc2W9.jpg)\n\n请务必如\
  \ `telegra.py` 文件第 29 行所示替换机器人 Token。完成后，发送命令 `on` 或 `off`；这应该会开启或关闭功能。\n\n## 项目\
  \ 8：LAMP 和 WordPress（初级水平）\n\n在此项目中，我们将学习如何在树莓派上搭建 LAMP 栈。`LAMP` 即 `Linux Apache\
  \ MySQL and PHP` 栈，是一个你可以用来托管运行 `PHP` & `MySQL` 的网站甚至是静态 HTML 网站的服务器。我们还将设置一个可以从树莓派所在同一网络中任何设备访问的\
  \ `WordPress` 站点。\n\n### 要求\n\n对于此项目，你只需要：\n\n* 一台树莓派\n* 更新版本的 Raspbian OS。\n\n\n\
  \n\n\n### 项目设置\n为了设置该项目，我们将逐步进行，一次安装并配置每项服务。\n\n### 安装和配置 Apache\nApache 是一个简单且流行的\
  \ Web 服务器，你可以将其安装在运行 Raspbian 系统的系统的树莓派上，允许你向本地网络托管并提供网页面的服务。需要注意的是，基础版 Apache 仅支持通过\
  \ HTTP 协议提供静态 HTML 文件。然而，通过额外的模块和配置，你可以提供多个动态网页服务，例如使用 `PHP` 创建的页面。\n\n要在 Raspbian\
  \ 系统上安装 apache，请从主菜单启动终端（Terminal），并输入以下命令——确保以 `sudo` 权限运行命令：\n\n```bash\napt-get\
  \ update && apt-get install apache2 –y\n```\n\n一旦安装了 apache，你就可以测试它是否正常工作。在用于托管\
  \ Web 应用程序的文件夹内部，apache 会创建一个默认的 `index.html` 文件，你可以用它测试与树莓派在同一网络中的任何设备上的连接。\n\n\
  要测试 apache 是否工作，请打开浏览器并输入 URL `http://localhost`。这应该启动一个类似所示的 apache 欢迎页——这表明 Apache\
  \ 正在运行。\n\n![](img/image_rsrc2WA.jpg)\n\n你也可以使用树莓派的 IP 地址查看页面。例如，`http://192.168.0.12`。你可以编辑默认的\
  \ `index.html` 文件。你会在 `/var/www/html/index.html` 此文件。\n\n### 安装和配置 PHP\n`PHP` 是一种流行且强大的处理器语言。我们可以将其归类为处理浏览器请求的后端语言。与静态的\
  \ HTML 不同，`PHP` 可以根据请求类型和执行的操作显示不同类型的内容。由于我们将运行基于 `PHP` 的 WordPress，我们需要安装它让 apache\
  \ 和 `PHP` 工作。\n\n要安装 `PHP` 包，使用以下命令：\n\n```bash\nsudo apt-get install php –y\n```\n\
  \n要测试 `PHP` 是否工作，在 `/var/www/html/` 内部创建一个文件名为 `index.php`。确保将 `index.html` 重命名为\
  \ `index.html.bak`；HTML 文件的优先级高于 `PHP`。\n\n在 `index.php` 文件中，输入以下代码行：\n\n```php\n\
  <?php echo “Hello, world!”; ?>\n```\n\n保存文件并通过 `http://localhost` 打开服务器，或使用树莓派的\
  \ IP 地址。你可能需要使用命令重启 apache 服务：\n\n```bash\nsudo service apache2 restart\n```\n\n\
  执行此命令将在你的浏览器中显示文本 hello world。\n\n### 安装和配置 MariaDB\nMariaDB 是一个你可以用它处理 SQL 数据的数据库引擎。它主要用于\
  \ Web 服务器，但也能与基于 `PHP` 的应用程序良好地工作。\n\n你可以使用命令安装 MariaDB 和 `PHP-MySQL` 包：\n\n```bash\n\
  sudo apt-get install mariadb-server php-mysql –y && sudo service apache2 restart\n\
  ```\n\n### 安装 WordPress\nWordPress 是一个用 `PHP` 编写流行的开源 CMS（内容管理系统）。你可以用它来构建博客等各种网站。要安装\
  \ WordPress，请打开浏览器并从此处下载最新的 WordPress `.tar.gz` 或 `zip` 包：`https://wordpress.org/download/`\n\
  \n![](img/image_rsrc2WB.jpg)\n\n下载完成后，将压缩文件移动到 `/var/www/html/`。确保删除该目录下的所有现有文件。\n\
  \n```bash\ncd /var/www/html && sudo rm –rf * && sudo wget http://wordpress.org/latest.tar.gz\n\
  ```\n\n接下来，在文件夹内解压存档，并将 WordPress 文件夹内的所有文件移动到 `/var/www/html/`\n\n![](img/image_rsrc2WC.jpg)\n\
  \n将 `/var/www/html/` 内部所有文件的所有者改为 Apache 用户\n\n![](img/image_rsrc2WD.jpg)\n\n###\
  \ 设置 WordPress 数据库\n为了运行你的 WordPress 站点，你需要一个数据库来存储数据。之前安装 MariaDB 允许我们快速完成此。\n\n\
  首先，运行命令打开 MySQL 安全安装会话。\n\n```bash\nsudo mysql_secure_installation\n```\n\n![](img/image_rsrc2WE.jpg)![]()image_rsrc2WF.jpg)![]()image_rsrc2WG.jpg)\n\
  \n一旦完成 MySQL 配置，使用命令打开 MySQL 终端会话：\n\n```bash\nsudo mysql –u root –p\n```\n\n并输入你在上述部分设置的密码。接下来，为你的\
  \ WordPress 站点创建一个数据库：\n\n```sql\ncreate database wpdb;\n```\n\n确保用分号结束你的 SQL 语句。关于如何操作\
  \ SQL 的更多指导，请参考以下资源：`https://www.amazon.com/dp/B07Y53QYXK`\n\n接下来，你需要授予 root 账户数据库权限。记住在\
  \ `IDENTIFIED BY` 语句之后指定一个唯一的密码。\n\n```sql\nGRANT ALL PRIVILEGES ON wpdb.* TO 'root'@'localhost'\
  \ IDENTIFIED BY '<YourPassword>';\n```\n\nMySQL 部分的最后一步是命令刷新数据库权限：\n\n```sql\nFLUSH\
  \ PRIVILEGES;\n```\n\n现在重启你的树莓派并开始 WordPress 安装。\n\n打开浏览器并导航到 `http://localhost`。这应该启动你的\
  \ WordPress 安装实例。选择你的语言并点击 Continue。\n\n在下一个屏幕上，点击 let’s go 并输入配置详情：\n- 数据库名称：`wpdb`\n\
  - 用户名：`root`\n- 密码：`<YOUR PASSWORD>`\n- 数据库主机：`localhost`\n- 表前缀：`wp_`\n\n连接后，点击\
  \ Run Install 开始 WordPress 安装过程。接下来，填写诸如站点标题、管理员用户名、密码等详细信息。\n\n安装完成后，可以根据意愿自定义\
  \ WordPress。你可以更改主题、创建文章、添加插件等等。WordPress 仪表盘也非常直观且易于导航。\n\n# 项目 9：Nagios 网络监控（入门级）\n\
  在这个项目中，我们将设置 Nagios，它允许你监控网络上的设备。如果你想监控家庭设备或服务器，Nagios 将非常有帮助。虽然这是一个很容易安装和配置的工具，但它需要一台\
  \ Linux 设备运行，专门用一台 PC 运行 Nagios 并不高效。因此，我们可以运行在 Pi 上。\n\n在我们开始设置之前，Nagios 是一个具有许多配置设置的奇工具。发现许多监控选项并激活它们非常容易，这会让使用\
  \ Nagios 的过程适得其反。因此，仅激活并使用你需要的唯一关键设置。\n\n### 要求\n此项目需要以下资源：\n\n*   树莓派\n\n*   Nagios\
  \ Core\n\n*   有线或无线网络。\n\n\n\n\n\n### 项目设置\n\n在开始安装 Nagios 之前，让我们先通过以下命令确保系统是最新版本：\n\
  \n```bash\nsudo apt update\nsudo apt full-upgrade\n```\n\n现在我们可以安装运行 Nagios 所需的软件包，然后编译\
  \ Nagios。\n\n```bash\nsudo apt install -y autoconf build-essential wget unzip apache2\
  \ apache2-utils php libgd-dev snmp libnet-snmp-perl gettext libssl-dev wget bc gawk\
  \ dc libmcrypt-dev\n```\n\n如果你已经运行了 apache Web 服务器（如上一个项目所示），请从上面的命令中移除 `apache`\
  \ 包。\n\n接下来，在你的桌面上创建一个名为 `temp` 的文件夹。我们将在这里编译 Nagios 源码。\n\n```bash\nmkdir ~/Desktop/temp\
  \ && cd ~/Desktop/temp\n```\n\n在文件夹内，访问 Nagios 核心 GitHub 页面并下载源码，或者使用 `wget`：\n\n\
  ```bash\nwget -O nagios.tar.gz https://github.com/NagiosEnterprises/nagioscore/archive/nagios-4.4.6.tar.gz\n\
  ```\n\n接下来，使用命令解压压缩包：\n\n```bash\ntar xvf nagios.tar.gz\n```\n\n这将创建一个 `Nagioscore`\
  \ 文件夹。进入该文件夹并使用命令配置软件以编译：\n\n```bash\ncd nagioscore-nagios-4.4.6/ && ./configure\
  \ --with-httpd-conf=/etc/apache2/sites-enabled\n```\n\n接下来，使用 `make all` 命令编译源码。由于我们正在编译\
  \ Nagios 源码，此过程可能需要一些时间，特别是在树莓派上运行时运行时。\n\n```bash\nmake all\n```\n\n现在，我们需要创建 Nagios\
  \ 运行所需的用户和组。我们还需要通过下文所示的命令将 `www-data` 用户加入 nagios 组：\n\n```bash\nsudo make install-groups-users\n\
  sudo usermod -a -G nagios www-data\n```\n\n最后是安装编译后的二进制文件。我们还需要安装 Nagios 守护进程，以便该服务能够随操作系统一起启动。\n\
  \n```bash\nsudo make install && sudo make install-daemoninit && sudo make install-config\
  \ && sudo make install-commandmode\n```\n\n- `make install-init`: 将 init 脚本安装到 `/etc/init.d`。\n\
  - `make install-commandmode`: 安装并配置存放外部命令文件的目录权限。\n- `make install-config`: 将示例配置文件安装到\
  \ `/usr/local/nagios/etc`。\n\n接下来，我们需要将 Apache 配置文件安装到 make 文件指定的目录中。确保也启用了 apache\
  \ 模块。\n\n```bash\nsudo make install-webconfs\nsudo a2enmod rewrite\nsudo a2enmod\
  \ cgi\n```\n\n最后，使用命令创建一个拥有访问 Nagios 界面权限的用户：\n\n```bash\nsudo htpasswd -c /usr/local/nagios/etc/htpasswd.users\
  \ nagiosadmin\n```\n\n在树莓派上初始化 Nagios，首先重启 apache，并使用系统命令启动 Nagios：\n\n```bash\n\
  sudo systemctl restart apache2\nsudo systemctl enable nagios\nsudo systemctl start\
  \ nagios\n```\n\n最后，你可以通过 Web 界面查看 Nagios。`https://localhost/nagios`![](img/image_rsrc2WH.jpg)\n\
  \n你可以通过以下资源学习更多关于如何使用 Nagios 的知识：`https://www.nagios.org/documentation/`\n\n# 项目\
  \ 10：树莓派 TOR 路由器（中级）\n\n欢迎来到本书的第 10 个项目。在这个项目中，我们将使用树莓派构建一个 TOR 路由器。这将允许我们安全且匿名地连接所有无线流量。\n\
  \n### 要求\n\n对于此项目你只需要以下物品：\n\n- 一台树莓派\n- 一个无线网卡（Dongle）\n- Bash 脚本基础知识\n\n\n\n\n\
  \n注意：此项目基于 Adafruit Onion Pi 项目。请参考以下资源以了解更多：[`learn.adafruit.com/onion-pi`](https://learn.adafruit.com/onion-pi)\n\
  \n### 构建项目\n\n第一步是在你的 SD 卡上设置 Raspbian OS——我们之前已经查看过如何操作。一旦启动设备，在终端中输入命令 `raspi-config`。\n\
  \n在配置界面中，首先选择“Expand Filesystem”（扩展文件系统）。此选项允许操作系统最大化利用 SD 卡空间。默认情况下，它只分配了 OS 镜像的大小。\n\
  \n出于安全考虑，请确保你使用了强密码而不是默认密码——因为这是一个 TOR 路由器，更强的密码更为理想。接下来，在“Boot Options”（启动选项）下，将模式改为\
  \ `Console` 或 `Console Autologin`。重启 Pi 使更改生效。\n\n现在，让我们使用以下命令确保系统是最新的：\n```bash\n\
  sudo apt-get update && sudo apt-get upgrade –y\n```\n\n接下来，我们需要设置 Wi-Fi 访问点。确保你没有将\
  \ Wi-Fi 适配器连接到树莓派上。如果是，请断开连接并重启 Pi。\n\n接下来，我们需要下载 OnionPi bash 脚本：\n```bash\nwget\
  \ [`raw.githubusercontent.com/seanmragan/OnionPi/master/pifi.sh`](https://raw.githubusercontent.com/seanmragan/OnionPi/master/pifi.sh)\n\
  ```\n\n接下来，使用命令 `chmod 755 pifi.sh` 使文件可执行，并使用 `sudo ./pifi.sh` 运行脚本。现在重启你的树莓派并连接你的无线适配器。你应该有一个额外的访问点可用。\n\
  \n目前，该访问点只是一个普通的 Wi-Fi 路由器。我们需要设置 TOR 以便安全连接。从以下资源下载 tor 脚本：\n```bash\nwget [`github.com/seanmragan/OnionPi/blob/master/tor.sh`](https://github.com/seanmragan/OnionPi/blob/master/tor.sh)\n\
  ```\n\n接下来，更改权限并执行脚本 `chmod 755 tor.sh && sudo ./tor.sh`。按照脚本提示并重启 Pi。一旦 Wi-Fi 启动，你就可以连接它，并且所有流量将通过\
  \ tor 路由。你可以从这里检查是否正常：[`check.torproject.org/`](https://check.torproject.org/)\n\
