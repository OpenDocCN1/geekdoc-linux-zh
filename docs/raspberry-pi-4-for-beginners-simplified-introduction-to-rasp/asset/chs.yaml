  \ 服务的设置（入门级）\n    - 结论\n\n# 第 1 部分：入门\n\n在全书中，我将使用各种约定，例如使用不同的代码样式和添加图标来增强书籍内容。此外，请确保阅读书中提供的任何警告或注意事项，以免伤害自己或设备。\n\
  \n### 环境要求\n\n对于第一部分的大部分，你只需要一台树莓派设备。我建议购买 `树莓派 4` 或 `树莓派 400`。由于这些是树莓派系列中的最新型号，它们为开发简单和复杂的项目提供了广泛的功能。为了简单起见，可以考虑购买套件。虽然这不是你完成所有项目所需的全部，但它将帮助你入门并进入状态。\n\
  \n### 了解树莓派\n\n树莓派设备是一个微小的、单板但卓越的全功能，旨在弥合成本与功能之间的差距。无论你是想要一台普通的电脑、编写复杂的程序，还是尝试工程和物理设备，树莓派都能满足需求。\n\
  \n树莓派设备是单板电脑。这意味着它像任何台式机一样完整，只是打印在单块板上。树莓派的大小与其性能并不成正比。例如，树莓派的现代版本可以和某些台式电脑并肩。自\
  \ 2012 年首次发布以来，从工程师到公司高管的广泛人群都获得了树莓派并学会了使用。树莓派驱动了从自动船只到太空设备的伟大项目。树莓派（显然）是一个强大的工具。\n\
  \n从最初与 Broad 通合作的树莓派 B 型开始，树莓派基金会发布了多种型号。每个型号都为特定的用例添加了新功能和改进的规格。例如树莓派 Zero 是全尺寸树莓派的微型版本，带有网络和\
  \ USB 端口等惊人功能，这一切为了更小的尺寸、低功耗和兼容性。\n\n兼容性是所有树莓派型号的关键特性。为特定型号开发的软件也可以在其他型号上运行。你可以在第一代树莓派型号上安装最新版本的\
  \ Raspbian OS。你将牺牲一些性能，但它会成功运行。随着我们的进展和学习树莓派，我将坚持使用最新型号 `树莓派 4 Model B` 和 `树莓派 400`。然而，你在书中学到的知识是准确的，并适用于其他树莓派型号。书中讨论的项目也与任何树莓派型号兼容，你可以在拥有的任何树莓派设备上享受乐趣并学习。\n\
  \n### 树莓派原理引导之旅\n\n即使树莓派设备功能强大且有名，如果不了解它的各种组件，我们也无法很好地使用它。在本节中，我们将讨论有关树莓派硬件的所有内容。与典型的台式机或笔记本不同，树莓派暴露了所有内部组件供你玩和探索。这种“暴露”是树莓派如此著名的原因之一。虽然你可以购买外壳来保护设备，但在处理物理元件和电路时，最好让它暴露在外。\n\
  \n![](img/image_rsrc2SY.jpg)\n\n以下是 `树莓派 4 model B` 的一些组件——从俯视角度显示。为了避免（此处原文逻辑中断）：\n\
  \n### 硬件配置\n\n树莓派的一个关键功能是其灵活性。注意：随着树莓派的发展，每个树莓派型号具有这些功能来驱动。\n\n![](img/image_rsrc2SZ.jpg)\n\
  \n一个树莓派 4 主板功能\n\n这些功能的目的如下：\n\n\n\n\n\n- 40 针通用输入/输出 (`GPIO`) 引脚将项目与电子设备连接起来。你可以直接在树莓派上访问它们。\n\
  \n注意：在树莓派运行（或操作）期间，可以对某些引脚进行开启或关闭。\n\n- **PoE 引脚**：以太网供电 (`PoE`) 允许设备在接入网络后，在特定时间自动开启/关闭。树莓派\
  \ 4 具有 4 针引脚，支持在先代型号树莓派 3B+ 上发布的 `PoE HAT`。\n\n- **千兆以太网**：树莓派 4 内置的千兆以太网带宽超过 350MBps。虽然性能可能没有普通桌面电脑强大，但与通过\
  \ `USB 2.0` 实现 300Mbps 千兆以太网的 Pi 3B+ 相比是一个巨大的改进。以太网的改进为树莓派 4 丰富的功能锦上添花。\n\n- **USB**：树莓派\
  \ 4 拥有 4 个 `USB` 端口。包括 2 个 `USB 2.0` 端口和 2 个由蓝色接口指示的 `USB 3.0` 端口。由于树莓派 4 内置了无线和蓝牙功能，需要更多端口的可能性很小，因为所需的外设是键盘、鼠标，以及如果你选择添加的话的摄像头。\n\
  \n- **4 极立体声音频/视频接口**：树莓派 4 具有一个 4 极立体声音频和复合视频端口，用于连接耳机或外部扬声器。\n\n- **2 通道 MIPI\
  \ CSI 摄像头接口**：移动行业处理器接口 (`MIPI`) 摄像头接口允许你直接将官方树莓派摄像头模块连接到主板上。\n\n- **双微 HDMI 端口**：树莓派\
  \ 4 还具有 2 个 `micro HDMI` 端口，允许将树莓派连接到现代显示器。这些端口支持 `4kp60` 或 `4K` 分辨率的音频输出。这两个 `Micro\
  \ HDMI` 端口取代了前代产品的全尺寸 `HDMI` 端口。\n\n- **USB-C 电源接口 5V/3A**：树莓派 4 具有为树莓派供电的标准 `USB`\
  \ 电源。树莓派基金会建议使用树莓派官方电源，以避免可能损坏设备的电压和功率问题。与大多数单板计算机一样，树莓派支持 `5v` 或 `3 Amperes` 电源输入。树莓派\
  \ 4 使用的电源已从之前型号中的 `Micro USB` 接口改为 `USB-C`。\n\n- **2 通道 MIDI DSI 显示端口**：MIDI 显示接口允许你将显示器直接连接到树莓派。\n\
  \n- **Micro SD 卡槽**：与旧款树莓派一样，树莓派 4 有一个 `SD Card` 卡槽，作为板的硬盘。\n\n- **2.4/5GHz 无线和蓝牙\
  \ 5.0**：树莓派 4 具有双频 `2.4` 和 `5.0 GHz` IEEE `802.1/*` 无线连接，以及蓝牙 `5.0` 和 `LE`。无线连接的更新使得\
  \ Pi 4 在连接性方面优于旧型号。\n\n以上是你应该了解的树莓派 4 核心功能。\n\n# 树莓派 400\n\n树莓派 400 是树莓派 4 的改进版。它的特色组件与树莓派\
  \ 4 非常相似。但不同之处在于，所有组件都整齐地封装在键盘布局内部。树莓派 400 功能强大，设计用于保护内部组件，并保持桌面整洁、线缆清晰。\n\n![](img/image_rsrc2T1.jpg)\n\
  \nPi 400 在封闭的键盘外壳内包含了系统级芯片和 `n` 内存等组件，这与普通的树莓派 4 不同。在树莓派 4 的背面，它具有所有所需的端口和 `GPIO`\
  \ 引脚，我们将在后续章节中讨论这些。`GPIO` 引脚旁边是 `microSD` 卡槽。它存储了树莓派 400 用于存储操作系统、应用程序和其他数据的 `microSD\
  \ card`。\n\n`microSD card` 预装在树莓派 400 中；你可以轻轻推按卡片直到它咔哒一声并弹出，然后取出。当你把卡片插回去时，请确保闪光的金属触点向下；卡片应随着轻微的咔哒声滑入。\n\
  \n接两个端口是 `micro-HDMI` 端口，用于连接显示器、电视或任何其他显示设备。与树莓派 4 一样，树莓派 400 支持多两个显示器。旁边是 `USB\
  \ Type-C` 电源接口，用于连接树莓派 400 电源或兼容的 `USB` 电源。\n\n两个蓝色端口是 `USB 3.0` 端口，提供与设备的高连接，包括固态硬盘\
  \ (`SSDs`)、优盘、打印机等。这些右侧的白色端口是低速的 `USB 2.0` 端口，你可以在此连接附带的树莓派鼠标。\n\n最后一个端口是 `Gigabit\
  \ Ethernet` 网口，它允许你使用网线将树莓派 400 连接到网络，作为使用内置 `Wi-Fi` 无线网络的一种替代方案。\n\n![](img/image_rsrc2T2.jpg)\n\
  \n简而言之，树莓派 400 集成了以下组件和功能：\n\n![](img/image_rsrc2T3.jpg)\n![](img/image_rsrc2T4.jpg)\n\
  \n# 第 2 ：设置你的树莓派 4\n\n本节将涵盖树莓派所需的一切内容，以及连接它们的基础知识，以使设备运行。\n\n![](img/image_rsrc2T5.jpg)\n\
  \n从设计上来说，树莓派设备为所有人提供了简单舒适的设置过程。然而，像任何计算机一样，运行这台单板计算机需要你连接各种外设。为了避免设置设备时的任何麻烦和兼容性问题，可以考虑使用树莓派官方套件，它包含了你使用树莓派所需的一切：[`www.canakit.com/raspberry-pi-400-desktop-computer.html`](https://www.canakit.com/raspberry-pi-400-desktop-computer.html)。对于树莓派\
  \ 4，可以考虑从树莓派入门套件开始。然而，硬件和电路爱好者应该考虑终极或极客套件：[`www.canakit.com/raspberry-pi-400-desktop-computer.html`](https://www.canakit.com/raspberry-pi-400-desktop-computer.html),\
  \ [`www.canakit.com/raspberry-pi-4-ultimate-kit`](https://www.canakit.com/raspberry-pi-4-ultimate-kit),\
  \ 或 [`www.canakit.com/raspberry-pi-extreme-aluminum-case-kit`](https://www.canakit.com/raspberry-pi-extreme-aluminum-case-kit)。\n\
  \n一旦你购买了上述任何套件，你只需要一个支持 `HDMI` 连接的显示器或电视。`HDMI` 非常常见，因为许多设备（如游戏机、顶盒、蓝光播放机等）都使用它。\n\
  \n然而，你可能只有一个裸板的树莓派，在这种情况下，你需要以下外设：\n\n- **USB 电源**：你需要一个额定为 `3 amperes (3A)` 的 `5V\
  \ USB Type-C` 电源。使用树莓派官方电源最好，因为它可以处理树莓派的功耗需求。\n\n![](img/image_rsrc2T6.jpg) ![](img/image_rsrc2T7.jpg)\n\
  \n- **Micro SD 卡**：你下一个需要的是 `microSD`；它将存储操作系统，并在与树莓派协作时作为文件的存储设备。如果你只想要基础设置，可以从\
  \ `8GB` 开始。然而，更大的容量更好，可以为存储更多文件留出空间。\n\n![](img/image_rsrc2T8.jpg)\n\n- **USB 键盘和鼠标**：为了控制你的树莓派，你需要一个键盘和鼠标。考虑从树莓派基金会购买官方产品。带有炫丽\
  \ RGB 彩色的游戏键盘等键盘可能会消耗过多功率，树莓派可能无法承受。\n\n![](img/image_rsrc2T9.jpg)\n\n\n\n\n- Micro‑HDMI\
  \ 线缆：此线缆将树莓派的声音和图像传输到您的电视或显示器。线缆的一端是用于树莓派的 micro‑HDMI 插头，另一端是用于您的显示器的全尺寸 HDMI 插头。您也可以使用\
  \ micro‑HDMI 到 HDMI 转接头和一根标准的全尺寸 HDMI 线缆。如果您的显示器没有 HDMI 插孔，您可以购买 micro‑HDMI 到 DVI‑D、DisplayPort\
  \ 或 VGA 转接头。要连接到使用复合视频或配有 SCART 插孔的旧电视，请使用 3.5 mm 尖‑环‑环‑环‑套（TRRS）音频/视频线缆。\n\n![](img/image_rsrc2TA.jpg)\n\
  \n您也可能需要购买一个树莓派外壳。虽然设备在没有外壳的情况下使用是安全的，只要您不将其放置在能导电的金属表面上，您仍应考虑购买外壳以提供额外保护。您可以从第三方供应商处获得官方树莓派外壳或定制外壳。\n\
  \n对于网络，您需要使用一根网线，一端插入树莓派的以太网端口，另一端连接到网络交换机或路由器。我们将在后续章节讨论如何配置无线网络。\n\n### 安装和设置\
  \ Raspberry Pi 4 硬件\n\n为了迎合初学者，让我们讨论如何安装和配置硬件——无需焊接，只需基本设置。先小心取出树莓派设备及其组件的包装盒。虽然树莓派是耐用且坚固的设备，但它并非永恒。\n\
  \n**注意**: 始终以边缘握住树莓派设备，而不是其平面侧，因为那里有内部组件。\n\n此外，请在处理树莓派的凸起金属针脚时格外小心，以避免短路导致设备损坏。损坏的针脚碎片可能会使后续硬件（如摄像头、传感器等）的设置变得复杂。\n\
  \n### 组装树莓派外壳\n\n如果您有外壳来保护树莓派，这将是组装设备的第一步。如果您使用的是定制的树莓派外壳，请参考该外壳的具体说明；否则，先打开官方外壳的中间部分，该外壳配有红色和白色盖子。\n\
  \n- 选取树莓派外壳的红色底座，并将其旋转，使低部分朝向您或向右，而凸起部分朝向左侧。\n\n![](img/image_rsrc2TB.jpg)\n\n-\
  \ 确保微 SD 卡未连接到设备。确认后，以稍微倾斜的角度握住并抬起树莓派，利用其 USB 和以太网端口。将 USB Type‑C、HDMI 和 3.5 mm\
  \ 音频插孔的连接器滑入相应的切口，然后轻轻将其滑至更低位置，直至它舒适地坐在底座上。确保在将其放置在外壳底座时不要用力或强行压迫端口位置；如前所述，这可能会损坏设备。\n\
  \n![](img/image_rsrc2TC.jpg)\n\n- 使用白色盖子，将两个夹子放在外壳左侧的匹配孔位上，这些孔位位于底座左侧。这些孔位应位于 microSD\
  \ 插槽上方。放置好后，向下压下 USB 端口上方的右侧部分，直至外壳完全闭合。\n\n\n\n\n\n![](img/image_rsrc2TD.jpg)\n\
  ### 连接 microSD 存储卡\n正如我们所提到的，树莓派使用 microSD 卡来存储操作系统、应用程序和用户数据。虽然你可以添加额外的存储空间，但在最基础的层面上，你需要一张\
  \ microSD 卡。\n\n要在树莓派上安装 microSD 卡，请将带有外壳的设备翻过来，找到 microSD 卡槽。将标签朝向树莓派的方向，缓慢地插入卡片，不要用力推。如下所示，MicroSD\
  \ 卡只能朝一个方向插入：\n![](img/image_rsrc2TE.jpg)\n卡片插入槽后，施加一点压力使卡片对齐；这应该让卡片停止到位且不发出“咔哒”声。\n\
  ![](img/image_rsrc2TF.jpg)\n你只需抓住卡片末端并轻轻拉出即可移除 MicroSD 卡。对于较旧的树莓派型号，只需简单按压（推）即可解除锁定并释放卡片。对于\
  \ Pi 4 和 3，不需要这种操作。\n\n### 连接键盘和鼠标\n要连接键盘和鼠标等输入设备，你只需要将 USB 连接器端连接到四个 USB 端口中的任何一个。树莓派支持\
  \ USB 2.0 和 USB 3.0。\n\n对于官方树莓派键盘，你可以将鼠标连接到键盘上，然后只连接键盘。如果不是，请将 USB 连接到树莓派上的两个 USB\
  \ 端口之一。\n![](img/image_rsrc2TG.jpg)\n不要强行将任何设备的 USB 连接器插入端口。它们应该轻松且自动地连接。如果你在插入设备时遇到困难，请检查\
  \ USB 连接器！\n\n### 连接显示设备\n要将显示设备连接到树莓派，只需取根 micro-HDMI 线，将电缆较小的一连接到树莓派上 USB Type-C\
  \ 连接端口旁的端口。\n\n接下来，将电缆的另一端连接到你的显示器。如果显示器有多个连接端口，你需要手动为树莓派选择使用哪个输入通道。如果你不确定如何操作，只需切换端口直到找到树莓派信号。\n\
  ![](img/image_rsrc2TH.jpg)\n\n### 连接网络设备\n虽然这是一个可选的选择，但你可以通过有线连接将树莓派连接到网络。\n\n使用以太网适配器或以太网线，将塑料锁朝下，连接到树莓派的以太网端口。你应该听到“咔哒”声，表示电缆已到位并连接。接下来，将以太网适配器的另一端连接到网络设备——交换机、集线器或路由器，直到听到“咔哒”声。\n\
  ![](img/image_rsrc2TJ.jpg)\n\n### 连接电源\n连接电源是设置树莓派硬件的最后一步。树莓派没有电源开关。因此，一旦你插上电源，它就会自动启动。只有当树莓派加载了必要的软件和操作系统后，你才应该连接电源。\n\
  \n对于官方树莓派 microSD 卡，它应该已经安装了操作系统，你可以直接为设备电源。如果你使用的是自定义 SD 卡，在我们在下一节设置好所需软件之前，请勿插入电源。\n\
  \n将电源线的 USB Type-C 端连接到树莓派。接下来，将电源插进插座并开启。这将启动树莓派，你就可以开始使用它了。\n![](img/image_rsrc2TK.jpg)\n\
  \n### 设置 树莓派 400\n让我们来讨论一下如何设置树莓派 400。处理过程并不很不同，因为这两个设备非常相似。然而，树莓派 400 自带了安装好的 microSD\
  \ 卡和内置键盘。\n![](img/image_rsrc2TM.jpg)\n\n### 连接鼠标\n对于树莓派 400，你只需要添加一个鼠标。只需取出鼠标的\
  \ USB 端并连接到树莓派 400。你可以在设备背部找到 USB 端口（包括 USB 3.0 和 USB 2.0）！\n[](image_rsrc2TN.jpg)\n\
  USB 连接器应该在不需要太大压力的情况下滑动到位。\n\n### 连接显示器\n取根 micro-HDMI 线，将较小的一端连接到树莓派 400 上靠近 microSD\
  \ 槽的 micro-HDMI 端口，另一端连接到你的显示器。\n\n如果你的显示器有多个 HDMI 端口，请寻找连接器旁边的端口号；你需要手动将电视切换到此输入以看到树莓派的显示。如果你看不到端口号，不要担心：你可以切换每个输入直到找到树莓派的输入。\n\
  \n# 第 3 节 使用树莓派 4\n树莓派设备非常灵活，可以运行各种软件，包括多种基础操作系统。尽管其中一些需要针对树莓派架构进行一些调整，但它们运行非常流畅。\n\
  \n支持的树莓派操作系统中最流行且有效的是由树莓派基金会开发的官方操作系统 Raspbian OS。Raspbian 是一个基于 Debian Linux 的、为树莓派设计的简单且经过优化的操作系统。\n\
  \n如果你是 Linux 用户，在导航和使用 Raspbian OS 时将不会遇到困难。Windows 和 Mac 用户会发现该环境很熟悉，因为它提供了与流行操作系统和桌面环境相同的图形功能。\n\
  \n本节将讨论如何开始使用 Raspbian OS，更多是关于如何轻松导航它以实现生产力最大化。\n\n在我们深入使用树莓派之前，我们需要安装 NOOBS 或\
  \ New Out of the Box Software（开箱用软件），这是树莓派基金会开发的帮助新用户设置操作系统的软件。\n\n### 在 Mac 和 Windows\
  \ 上设置 NOOBS\n如果你是从官方商店购买的 microSD 卡，它应该预装了 NOOBS，你可以跳过此节。然而，对于自定义 SD 卡，在使用之前我们需要对其进行设置。\n\
  \n在 Mac 和 Windows 上设置 NOOBS 涉及类似的过程，无论使用哪种操作系统。最好的方法是使用新的、未使用的 SD 卡，如果你决定使用旧 SD\
  \ 卡，请备份你的数据。\n\n在 Mac 和 Windows 上设置 NOOBS 的第一步是下载并安装格式化工具。无论使用哪种操作系统，对于本教程，我们将使用\
  \ SD Formatter，因为它很容易使用。从资源页面下载：`https://www.sdcard.org/downloads/formatter/`![](img/image_rsrc2TP.jpg)\n\
  \n选择对应的操作系统并安装程序。一旦下载完成，启动安装程序。正确插入 SD 卡并确保电脑检测到它。如果这种情况没有发生，请检查 SD 卡槽或使用第三方格式化工具。\n\
  \n启动格式化工具并确保在“Select Card”框中选择了正确的 microSD 卡。接下来，选择 Overwrite（覆盖）来处理数据，这通常是不必要的。(image_rsrc2TR.jpg)\n\
  \n你也可以使用 Windows 的 `diskpart` 或 Mac 的磁盘工具。如果你选择使用任何其他格式化工具，请确保使用 FAT32 系统格式化 SD\
  \ 卡。格式化完成后，使用 Windows 资源管理器或 Mac 的 Finder 打开它。\n\n现在我们需要下载 NOOBS 软件副本。可以在树莓派上安装的操作系统包括\
  \ Raspbian OS、LibLEC、OSMC 等。打开浏览器并导航到以下链接下载 NOOBS：`https://www.raspberrypi.org/downloads/noobs/`(image_rsrc2TS.jpg)\n\
  \n一旦下载完成，打开下载文件夹并解压 ZIP 文件。如果你使用包管理器，点击 `CTRL + A` 选择所有可用数据。在选择所有数据后，将文件拖入 SD 卡的根目录。此外，确保在存档中复制文件。接下来，从电脑上弹出\
  \ SD 卡，并使用上一节学的方法连接到树莓派。如果你想在 Linux 系统上安装 NOOBS，请跳过此节。\n\n### 在 Linux 上安装 NOOBS\n\
  在本节中，我们将讨论如何在 Linux 系统上设置 NOOBS。这里介绍的方法很简单。你可以使用任何你觉得方便的方法，如 Balena Etcher。使用 Linux\
  \ 系统预安装的磁盘工具，我们将分区 SD 卡并提取 NOOBS。你可能需要 root 权限来执行此任务。第一步是启动终端并输入命令 `sudo fdisk -l`\
  \ 列出所有连接的磁盘和分区。确保以 root 身份运行命令。输出类似于 `/dev/sda` 或 `/dev/sdb`，表示磁盘 1 和 2。如果你连接了两个驱动器，可能会得到\
  \ `/dev/sd(n)`，其中 `n` 是设备的字母数字。\n\n接下来，在列出的设备中找到你的 SD 卡，复制其标识代码并继续。下一步是使用 FAT32\
  \ 系统重新分区 SD 卡。输入命令 `sudo fdisk /dev/sda`，将 `/dev/sda` 替换为你 SD 卡的代码。\n\n一旦运行上述命令，你应该能看到帮助命令\
  \ `m`。在 `fdisk` 工具中查看所有可用命令。我们将使用命令 `d` 删除当前 SD 卡上的所有分区，使用命令 `n` 创建新分区。接下来，输入 `d`\
  \ 并回车，输入分区号。如果 SD 卡中有其他分区，输入 `p` 打印它们。选择每个分区并输入 `d` 后跟相应的分区号。重复此过程直到删除 SD 卡上的所有分区。\n\
  \n删除所有分区后，下一步是创建一个新的。仍在 fdisk 中，输入命令 `n` 并回车。接下来，输入命令 `p` 确认分区类型为主（Primary）并继续。现在输入分区号\
  \ `1` 并回车。接下来，输入起始和结束扇区或直接回车确认默认值。\n\n你可以确认 SD 卡仅包含一个分区；输入命令 `p` 列出所有分区。接下来，我们需要将文件系统从\
  \ Linux 改为 FAT32。输入命令 `l` 列出所有可用代码。找到对应 FAT32 的代码并将其提供给磁盘工具。在此情况下，分别选择 `t` 和 `b`\
  \ 命令。操作完成后，将显示分区已成功更改为 FAT32 的消息。\n\n接下来，我们需要将更改应用磁盘。在应用之前确保更改如上所示。输入命令 `w` 写入并应用更改。完成分区后，输入命令\
  \ `sudo mkfs.vfat /dev/sda` 进行格式化，其中 `/dev/sda` 代表你的 SD 卡代码。现在我们已经以正确的格式分区并格式化 SD\
  \ 卡。接下来，我们需要从树莓派官方仓库下载并提取 NOOBS 软件。\n\n打开浏览器并导航到以下页面。确保选择 NOOBS Large 版本而不是 lite\
  \ 版本。选择点对点或 HTTP 进行下载：`https://www.raspberrypi.org/downloads/noobs/`。对于本书，我们将使用\
  \ `wget` 工具从 Linux 终端下载文件。导航到你想下载文件的文件夹，本例中为输入 `cd ~/Downloads`。一旦进入下载文件夹，输入命令 `wget\
  \ https://downloads.raspberrypi.org/images/NOOBS-2020-09-15/v3_5_0.zip`。执行命令并等待下载完成。\n\
  \n完成后，通过执行命令 `sudo fdisk -l` 找到 SD 卡的挂载位置。在 Linux 系统上，树莓派 40 解解压文件。使用包管理器，，，，，。。\n\
  \n\n\n     节 树莓派 4 的操作\n树莓派设备非常灵活，可以运行各种软件，包括多种精选的基础操作系统。尽管其中一些需要针对树莓派架构进行一些调整，但它们运行非常流畅。\n\
  \n支持的树莓派操作系统中最流行且有效的是由树莓派基金会开发的官方操作系统 Raspbian OS。Raspbian 是一个为树莓派设计的基于 Debian Linux\
  \ 的简单且经过优化的操作系统。\n\n如果你是 Linux 用户，在导航和使用 Raspbian OS 时将不会遇到困难。Windows 和 Mac 用户会发现该环境很熟悉，因为它提供了与流行操作系统和桌面环境相同的图形功能。\n\
  \n本节将讨论如何开始使用 Raspbian OS，更多是关于如何轻松导航它以实现生产力最大化。\n\n在我们深入使用树莓派之前，我们需要安装 NOOBS 或\
  \ New Out of the Box Software（开箱用软件），这是树莓派基金会开发的帮助新用户设置操作系统的软件。\n\n### 在 Mac 和 Windows\
  \ 上设置 NOOBS\n如果你是从官方商店购买的 microSD 卡，它应该预装了 NOOBS，你可以跳过此节。然而，对于自定义 SD 卡，在我们在下一节设置好所需软件之前，请勿插入电源。\n\
  \n在 Mac 和 Windows 上设置 NOOBS 涉及类似的过程，无论使用哪种操作系统。最好的方法是使用新的、未使用的 SD 卡，如果你决定使用旧 SD\
  \ 卡，请备份你的数据。\n\n\n\n\n* `vcgencmd get_config <config>` : 我们使用此命令显示文件中的特定配置值。\n*\
  \ `vcgencmd get_config int` : 我们使用此命令列出所有 true（即非零）的整数配置选项。\n* `vcgencmd get_config\
  \ str` : 我们使用此命令列出所有 true（即非空）的字符串配置选项。\n\n你可以通过使用 `vcgencmd` 命令查看大多数配置设置。当你使用此命令时，其他命令不可用。\n\
  \n### 配置设置\n在这里，我们将讨论一些必要的配置修改，您可以根据需求对其进行调整，使树莓派更加功能化。配置设置分为内存、摄像头、视频/显示、网络、启动、超频和音频等多个类别。然而，本书仅讨论其中一些，以示如何编辑配置。欢迎阅读树莓派配置文档以了解更多。[`www.raspberrypi.org/documentation/configuration/`](https://www.raspberrypi.org/documentation/configuration/)\n\
  \n### 内存配置修改\n这些是对树莓派最有用的内存配置修改。对于较新的树莓派型号，请通过删除 `#` 号来取消禁用的条目。\n\n* `disable_l2cache`:\
  \ 此设置可禁用或启用树莓派中 ARM 对 GPU 缓存的访问。我们通过将值设置为 `1` 来启用它；它需要相应的 L2 禁用内核。默认值在不同型号中可能不同，例如那些拥有独立\
  \ L2 缓存的型号。\n* `gpu_mem`: 指的是树莓派 GPU 可用的内存，包括 VPU、HVS 和其他 Legacy 代码。我们使用此修改来设置 ARM\
  \ 与 GPU 之间的内存分配。默认情况下，GPU 内存以兆字节为单位。为避免性能问题，始终分配尽可能低的值，以让 Linux 系统拥有更多的内存分配。\n*\
  \ `gpu_mem_256`: 这是 256MB 树莓派的 GPU 内存（以兆字节为单位）。512MB 树莓派通常忽略它，配置会覆盖 `gpu_mem`。该条目最大值为\
  \ 192；默认情况下没有设定值。\n* `gpu_mem_512`: 此配置设置 512MB 树莓派的 GPU 内存（以兆字节为单位）。如果树莓派的内存大小不是\
  \ 512MB，则该配置会失效并被忽略。它会覆盖 `gpu_mem` 条目，最大值为 448MB；默认值未设定。\n* `gpu_mem_1024`: 我们用此设置为内存\
  \ 1024MB 或以上的树莓派设备设置 GPU 内存（以兆字节为单位）。如果树莓派的内存小于 1024MB，则该配置是多余且被忽略。`gpu_mem_1024`\
  \ 的最大值为 944MB，默认值未设定。\n\n### 摄像头模块配置修改\n下面是一些树莓派摄像头模块的配置设置。树莓派摄像头模块如下：\n![](img/image_rsrc2TZ.jpg)\n\
  \n* `start_x`: 我们使用此设置来启用树莓派中连接的相机模块。\n* `gpu_mem`: 我们使用此配置来设置相机模块的最小 GPU 内存。\n\
  * `disable_camera_led`: 此配置设置会在录制视频或拍照时防止相机 LED 点亮。\n\n### 视频/显示配置修改\n下面是最常见的视频和显示选项的配置修改，适用于树莓派。再次，请为最新型号的树莓派取消禁用的条目以启用它们。注意：由于树莓派\
  \ 4、4B 和 400 支持 4K，某些选项在不同型号中可能不可用。\n\n* `sdtv_mode`: 该配置定义复合视频输出的电视标准。我们通过使用整数值\
  \ `0`、`1`、`2`、`3`、`16` 和 `18` 来设置每种模式，分别代表：标准 NTSC、日本版 NTSC、标准 PAL、巴西 PAL、逐行扫描 NTSC、逐行扫描\
  \ PAL。\n* `sdtv_disable_colorbust`: 此配置可开启或关闭复合视频输出中的色彩暴露。当您将值设置为 `1` 时，它会禁用色彩暴露，从而使图像在黑白模式下更清晰。\n\
  * `sdtv_aspect`: 该配置定义复合视频输出的宽高比。默认整数值 `1` 表示 4:3 的比例。整数值 `2` 表示 14:9 的比例，整数值 `3`\
  \ 表示 16:9 的比例。\n* `enable_tvout`: 该配置开启复合输出。仅树莓派 4 支持此功能，默认情况下会禁用复合输出。\n\n树莓派拥有大量视频和显示选项，这里无法全部讨论。如需更多选项，请查阅下方资源页面上的树莓派文档：[`raspberrypi.org/documentation/config-txt/video.md`](https://raspberrypi.org/documentation/config-txt/video.md)\n\
  \n### 网络配置修改\n![](img/image_rsrc2U0.jpg)\n网络配置不太受欢迎，树莓派文档中可能没有。下面是最常见的网络配置修改。\n\n\
  * `smsc95xx.macaddr`: 我们使用此设置让 `smsc95xx` 驱动在每次启动时使用随机 MAC 地址，而不是默认的 MAC 地址。\n\n\
  ### 启动配置修改\n下面是树莓派的启动配置修改。通常，对于较新的树莓派型号，请通过删除 `#` 号来取消禁用所需条目。\n\n* `disable_commandline_tags`:\
  \ 我们使用此配置阻止 `start.elf` 在启动内核之前填充 ATAGS。ATAGS 是 0x100 之前的内存。\n* `Kernel`: 我们使用此设置在加载内核时设置一个替代名称。默认名称是\
  \ `kernel.img`、`kernel7.img`、`kernel7l.img`，类型为字符串。\n* `Cmdline`: 用于设置可以用于替代 `cmdline`\
  \ 文本文件的命令行参数。\n* `disable_splash`: 用于在启动时开启或禁用启动画面。\n\n\n\nFor some models, specific\
  \ entries may be deprecated and obsolete. To find out more about boot options in\
  \ the `config.txt` file, use the link provided below: [`www.raspberrypi.org/documentation/configuration/config-txt/boot.md`](https://www.raspberrypi.org/documentation/configuration/config-txt/boot.md)\n\
  \n## 第 6 节：连接树莓派\n\nIf you are using a cabled Ethernet connection, the Raspberry\
  \ Pi will automatically connect to the internet. If you want to connect using a\
  \ wireless connection, click on the network icon found at the top panel to view\
  \ all the available networks.![](img/image_rsrc2U1.jpg)\n\nOnce you locate your\
  \ network of choice, select it and provide the password—assuming you are connecting\
  \ to a secured network—, click OK to join that specific network.![](img/image_rsrc2U2.jpg)\n\
  \nOnce connected, you should see a Wi‑Fi logo on the menu bar; that means you are\
  \ now connected. To check the IP address of the Raspberry Pi, open the terminal\
  \ and enter the command:\n```\nifconfig | grep more\n```\n\n## 第 7 节：设置静态 IP\n\n\
  If you are on a cluttered network that has many devices connected to it, it can\
  \ be challenging to keep track of the Raspberry Pi IP address on each boot, especially\
  \ if you have connected to a network that is using DHCP. A static IP allows us to\
  \ set one unique IP address that the Raspberry Pi will use, which helps us find\
  \ the Pi.\n\nIf you are unfamiliar with DHCP and IP addresses, here is an overview\
  \ of how they work.\n\n### DHCP 和 IP 地址工作概述\n\nOnce you connect a device to a network,\
  \ the router/modem automatically assigns it a unique number made up of four blocks\
  \ of numbers called the Internet Protocol. The Internet Protocol number is usually\
  \ something similar to `192.168.0._`. The first three blocks represent the network,\
  \ and the third block represents the host—this depends on the network subnet mask.\
  \ The last digit represents the device number.\n\nWhen assigning IP addresses, the\
  \ router takes the first three blocks representing the network and appends a digit\
  \ to represent the connected host. The router itself is number 1, and you can find\
  \ it at `192.168.0.1`. For example, `192.168.0.2` may represent your desktop, `192.168.0.3`\
  \ may represent your laptop, `192.168.0.4` may represent your smartphone, etc.\n\
  \n**NOTE:** 您可以通过打开终端并输入 `ifconfig` 来查找树莓派的 IP 地址。然而，由于连接设备的数量及其连接方式的不同，该地址可能会变化，因为路由器负责分配这个唯一号码。\n\
  \nTo do this, the router uses the Dynamic Host Configuration Protocol (DHCP), which\
  \ means that it dynamically assigns IP addresses to the connected hosts. For example,\
  \ if you disconnect the Raspberry Pi and connect other devices before reconnecting\
  \ the Raspberry Pi, the Pi may get a different IP address once re-connected.\n\n\
  The implication of this is that you cannot memorize one IP address as the Raspberry\
  \ Pi’s until you configure it to use one unique IP, which is where static IP addresses\
  \ come handy. Using DHCP Reservation, we can tell the router to remember this IP\
  \ address for the Raspberry Pi only.\n\nYou can configure DHCP Reservation using\
  \ the Router administration panel or edit the Raspberry Pi configurations. Since\
  \ the routers’ administrations may vary, we shall focus on working with the Raspberry\
  \ Pi network configurations.\n\nThe first step is to check whether the DHCP service\
  \ is running by executing the command:\n```\nsudo service dhcp status\n```\n\nNext,\
  \ if DHCP is not running, execute the following commands:\n```\nsudo systemctl start\
  \ dhcpd.service && sudo systemctl enable dhcpd\n```\n\nUpon successful execution,\
  \ recheck whether DHCP is running and follow the next command. Locate the DHCP configuration\
  \ file by executing the command:\n```\nfind dhcpcd.conf\n```\n\nOnce you locate\
  \ the DHCP config file, edit it using your text editor of choice. If you would like\
  \ to keep things simple, use `nano`. Execute the following command:\n```\nsudo nano\
  \ /etc/dhcpcd.conf\n```\n\nIf you have connected your Raspberry Pi via a cabled\
  \ Ethernet, the interface is `eth0` and `wlan0` for Wifi connections. Enter the\
  \ following lines in the Raspberry Pi DHCP configuration file:\n```\ninterface eth0/wlan0\n\
  static ip_address=192.168.0.4/24\nstatic routers=192.168.0.1\nstatic domain_name_servers=1.1.1.1\n\
  ```\nThe interface entry should contain the interface you have connected the Raspberry\
  \ Pi to; for Ethernet, `eth0`, and `wlan0` for Wireless.\n\n**NOTE:** 请仅使用 `eth0`\
  \ 或 `wlan0` 中的一个，不能两者都使用。\n\nFor static IP, set the desired IP address for the Raspberry\
  \ Pi. The IP should not be an IP assigned to other devices on the same network.\
  \ Additionally, the IP should be within the subnet range. For example, `192.168.0.2`\
  \ – `192.168.0.254`.\n\nStatic routers should contain the IP address of the router.\
  \ By default, this is `192.168.0.1`. You can also specify the DNS servers you would\
  \ like to use. If you do not know, set it to the router’s IP address; otherwise,\
  \ specify it. Once done, press `CTRL + X` and click enter twice to save the configuration\
  \ file. Now reboot the Pi to apply the changes.\n\nUpon reboot, test the TCP/IP\
  \ stack. Open the terminal and enter the command:\n```\nping ::1 or ping raspberrypi.local\n\
  ```\n![](img/image_rsrc2U3.jpg)\n\n## 第 8 节：远程访问树莓派\n\nOne of the best ways of working\
  \ with the Raspberry Pi is by accessing it remotely. Using `SSH` or `VNC`, you can\
  \ connect to the Raspberry Pi remotely and work with it as if you were carrying\
  \ it with you as if it were a laptop. In this section, we shall cover two methods\
  \ of controlling the Raspberry Pi remotely.\n\n### 如何通过 VNC 远程连接树莓派\n\nVirtual Network\
  \ Computing, `VNC` for short, is a remote access technique that gives you remote\
  \ control of one computer from another. The technology helps to communicate with\
  \ servers and cloud computers from the basic Windows or Mac. Since the Raspberry\
  \ Pi does not have a built-in monitor, it is best to control it using a terminal\
  \ or desktop environment from another computer. Here is how:\n\nSetting up VNC may\
  \ require terminal commands based on the distribution you are setting it in. For\
  \ Raspberry Pi, the desktop makes it very easy. To navigate to the Raspberry Pi\
  \ VNC configuration, click on Menu -> Preferences -> Raspberry Pi Configuration\
  \ -> Interfaces and enable VNC. Once activated, a new icon marked VNC shall appear\
  \ on the top-right menu bar. Click the icon to open VNC server settings. You will\
  \ see a section labeled “Ready for Connections” and “Get Started.” You can view\
  \ the instructions by clicking on the arrow next to “Get Started.”\n\nNote the IP\
  \ address the Raspberry Pi is using, you can also use `ifconfig` to see the Raspberry\
  \ Pi’s IP address. Save the VNC server signature and password that contains a list\
  \ of randomly generated words. Download and install VNC viewer software that will\
  \ enable you to control the Raspberry Pi. Visit the web page below to download Real\
  \ VNC: [`realvnc.com/download/viewer`](https://realvnc.com/download/viewer)\n\n\
  Install the software on your device. It is compatible with any Operating System.\
  \ Once installed, launch the VNC viewer and provide the IP address of the Raspberry\
  \ Pi noted above. Select VNC server and click connect. Provide the username and\
  \ password for the Raspberry Pi. If you are using default credentials, username\
  \ `pi`, password `raspberry`. Ensure the username and password are valid to ensure\
  \ you are connecting to the right device. Once connected, the VNC viewer will display\
  \ the desktop environment as if you were using the Raspberry Pi.\n\n### 如何通过 SSH\
  \ 远程连接树莓派\n\nAnother way to connect to the Raspberry Pi remotely is via `SSH`. To\
  \ connect the Raspberry Pi via `SSH`, open the terminal or Command prompt on Mac/Linux\
  \ or Windows. On the Raspberry Pi, use `ifconfig` to note down the IP address. On\
  \ your computer’s terminal, enter the command:\n```\nssh pi@192.168.0.8\n```\nwhere\
  \ `pi` is your Raspberry Pi’s username and `192.168.0.8` is your Raspberry Pi’s\
  \ IP address. Once connected, enter the password for the `pi`. If you don’t have\
  \ SSH configured on a different port, the default port `22` should work.\n\n## 第\
  \ 9 节：在树莓派上编程\n\nOne of the most common ways of using the Raspberry Pi is to program\
  \ projects. This section shall introduce you to how to set up a programming interface\
  \ on the Raspberry Pi. We will discuss how to set up a programming environment for\
  \ `Python` and `C/C++`. However, this book does not teach any concepts of the specified\
  \ programming languages. Thus, you should use external resources to learn a programming\
  \ language.\n\n**NOTE:** 在本书的项目部分工作时，您需要了解 `python` 编程。\n\n### Python 3 on the Raspberry\
  \ Pi\n\nRaspbian OS comes pre-installed with the latest, stable version of `Python`,\
  \ making the Pi a programming platform you can use to script or work with data science.\
  \ Beginners also get a lot from the Raspberry Pi programming setups since `python`\
  \ is an excellent programming language. You can launch the `python IDLE` shell by\
  \ selecting Menu -> Programming -> Python IDLE. The `Python` on the Pi is the default\
  \ package that does not contain additional libraries and packages. If, for some\
  \ reason, you do not have the `python` shell, you can download the Python installation\
  \ package from the Python resource page below and select your desired version: [`python.org/downloads`](https://python.org/downloads)\n\
  \nTo test whether you have installed `python` correctly, open the terminal and enter\
  \ the command:\n```\npython --version\n```\nto get the version of python installed.\n\
  \n### C/C++ 环境设置\n\n`C` and `C++` are some of the most powerful and popular programming\
  \ languages used to create a wide range of applications. Developers use these languages\
  \ to develop a wide selection of tools and utilities such as games, browsers, embedded\
  \ systems, programming languages, and Operating Systems. This section covers how\
  \ to start using `C` and `C++` on the Raspbian OS. To check whether your Raspbian\
  \ version has the `C++` compiler installed, open the terminal and enter the command:\n\
  ```\nwhatis gcc\n```\nIf you do not have the compiler pre-installed, you can install\
  \ it by executing the command:\n```\nsudo apt-get update && sudo apt-get install\
  \ gcc\n```\nYou can edit the code in any text editor such as `nano` or use the `Geany`\
  \ IDE pre-packaged in Raspbian. Navigate to Menu -> Programming -> Geany and edit\
  \ the code.\n\n## 第 10 节：介绍 GPIO 头部\n\nAt the top edge of any modern Raspberry Pi\
  \ or the back of a Raspberry Pi 400 are two long rows of metallic pins called the\
  \ `GPIO` or General Purpose Input/output header. In the Raspberry Pi, the `GPIO`\
  \ headers allow you to connect additional hardware such as sensors, cameras, LED,\
  \ switches, etc. You control the hardware connected to the `GPIO` header using a\
  \ program you create. You can use the `GPIO` pins for both input and output. We\
  \ will learn how to connect and interact with the `GPIO` header using `python` in\
  \ upcoming sections.![](img/image_rsrc2U4.jpg)\n\nThe `GPIO` header has 40 (male)\
  \ metallic pins. Some pins are accessible for use in physical computing; some provide\
  \ power to some hardware; others provide a communication interface with additional\
  \ hardware such as sensors that collect and send data to the Raspberry Pi.![](img/image_rsrc2U5.jpg)\n\
  \n**NOTE:** 树莓派 400 具有类似的引脚布局，但在 Pi 400 中，引脚布局是反向的。\n\n### 跳线电缆\n\nJumper cables,\
  \ also called jumper wires or jumper leads, are handy when you want to connect physical\
  \ components to your Raspberry Pi or breadboard. There are three main versions of\
  \ jumper wires.\n\n\n\n\n\n# 跳线线\n\n1. `公对母 (Male to Female)`：用于将面包板连接到 `GPIO` 插针排。\n\
  2. `母对母 (Female to Female)`：用于连接单个组件，特别是在不使用面包板的情况下。\n3. `公对公 (Male to Male)`：我们用它来实现面包板上一个点到另一个点的连接。\n\
  \n根据你的项目需求，你可能需要所有类型的跳线线。然而，如果你不使用面包板，`M2F` 和 `M2M` 就足够了![](img/image_rsrc2U9.jpg)\n\
  \n### 电阻\n\n电阻是另一种常见的电子元件，通常用于控制或调节电流的流量。电阻有多种数值，使用欧姆（`Ω`）测量。简单来说，电阻的欧姆数越高，电阻越大。\n\
  \n在树莓派中，当设备耗电过大，可能损坏自身或树莓派时，电阻变得非常有用。尽管这可能因你的项目和设备需求而异，但你通常会使用额定为 `330 Ω` 的电阻![](img/image_rsrc2UA.jpg)\n\
  \n### 发光二极管\n\n![](img/image_rsrc2UB.jpg)发光二极管（`LED`）是一种你可以直接从编程控制器进行调节的输出设备。`LED`\
  \ 开启时会发光。你随处都能发现 `LED` 设备：从房屋到汽车、飞机等。它们负责在炉具开启时、烟雾检测器、玩具和其他指示器中提醒你。\n\n`LEDs` 有许多形状、颜色和大小。虽然\
  \ `LED` 组件种类繁，但某些完全不适用于树莓派。如果你打算在树莓派上使用 `LEDs`，最好避免使用任何额定为 `5V` 或 `12V` 的 `LED`\
  \ 电源。\n\n### 压电蜂鸣器\n\n压电蜂鸣器或简称蜂鸣器是树莓派常用的输出元件之一。它与 `LED` 组件非常相似，不同之处在于产生声音而不是光。\n\
  \n蜂鸣器主要包含封装在塑料外壳内的金属片，当电流通过它们时，它们会相互振动。电蜂鸣器主要有两种类型：主动式鸣器和被动式蜂鸣器。为了方便使用，请坚持使用主动式蜂鸣器![](img/image_rsrc2UC.jpg)\n\
  \n你还会遇到其他常见的电子元件，如电机、按钮开关、红外传感器、运动传感器、温度、湿度传感器等。需要注意的是，某些组件在连接到树莓派之前可能需要特殊的扩展板。因此，建议在开展项目之前确保手头有所有组件。\n\
  \n### 编程 GPIO\n\n在介绍了树莓派 `GPIO` 插针后，你就可以使用支持的语言对设备进行交互和编程了。虽然我们无法涵盖编程 `GPIO` 的所有细节，但我们可以介绍各种概念来说说明你可以如何这一点。\n\
  \n### 使用 C/C++ 编程 GPIO：标准内核接口\n\n要使用 `C/C++` 与树莓派 `GPIO` 交互，你可以使用标准内核接口。还有第三方库，如\
  \ [`pigpio](http://abyz.me.uk/rpi/pigpio/)，你可以用它与树莓派交互。\n\n然而，自 Linux 内核 `4.8` 以来，`sysfs`\
  \ 接口已弃用且非常难以使用。\n\n### 编译\n\n我们可以手动构建此项目。但是，你需要版本为 `2.61` 的 `autoconf` 以及带有 GNU\
  \ 扩展的标准 C 库。这是一个简单直接的 Autotools 编译[`linkfy.to/l850I`](https://linkfy.to/l850I)\n\
  \n从下方提供的 Linux 内核 git 仓库获取文件[[`git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git`](https://git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git)\n\
  \n接下来，我们需要编译并安装项目，这还包括命令行工具。输入命令：![](img/image_rsrc2UD.jpg)\n\n在执行上述命令之前，确保你处于包含\
  \ `git clone` 文件的文件夹中。一旦构建了工具，你就可以获得六个主要的命令行工具。这些工具是：\n\n* `Gpiodetect`：用于显示系统中可用的\
  \ `gpiochips` 列表及其详细信息，如名称、标签、`GPIO` 线的数量等。\n* `Gpioget`：用于读取所传 `GPIO` 线的值。\n* `Gpiofind`：在指定的行名中查找\
  \ `gpiochip` 名称和行偏移量。\n* `Gpiomon`：为 `GPIO` 线上的事件提供等待调用。提供要监控的事件以及在终止前处理的事件数量。\n\
  * `Gpioinfo`：用于显示给定 `gpiochips` 所有线的列表、名称、激活状态和其他附加标志。\n* `Gpiofind`：定位指定行名的 `gpiochip`\
  \ 名称和行偏移量。\n* `Gpioset`：为给定的 `GPIO` 线分配值。\n\n你可以通过提供的资源了解更多关于该库的信息[`linkfy.to/7nYBd`](https://linkfy.to/7nYBd)\n\
  \n### 使用 Python 编程 GPIO\n\n使用 `Python` 编程 `GPIO` 使用的是 `gpio zero` 包。使用 `gpio zero`\
  \ 包通过 `python` 控制设备非常简单且轻量化。该包还提供了供初学者理解的文档。在此学习更多：[`gpiozero.readthedocs.io/en/stable/`](https://gpiozero.readthedocs.io/en/stable/)\n\
