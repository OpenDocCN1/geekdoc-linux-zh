  \ the translation:\n\n[content]\n### 快速回顾：LED 与电阻\n\n如前所述，LED 设备有不同的尺寸、形状、颜色和电压要求。有些\
  \ LED 设备能在一个装置中混合颜色。对于本项目，任何 `5mm` 的 LED 设备都可以工作。LED 设备包含一个二极管，当电流通过时会发光。\n\n电气二极管具有极性——意味着它们只能在一个方向上允许电流流动，通常是从正极到负极。正极点是\
  \ `anode`，负极点是 `cathode`。你可以通过观察其引脚来辨识二极管的某个点，如下所示。较长的引脚代表正极（`anode` (+）），而较短的引脚代表负极（`cathode`\
  \ (–)）。\n\n![](img/image_rsrc2UG.jpg)\n\nLED 设备无法自动调节电流。因此，如果向设备传入过多电流，可能会损坏设备，甚至损坏树莓派。因此，最好始终将\
  \ LED 与一系列电阻串联连接。你应该连接的电阻类型取决于 LED 能够承受的最大值。大多数 LED 最大可承受 `20 mA`。但是请检查设备的最大值。我不会花太多时间解释电阻及其工作原理。请参考以下资源以获取更多信息：[`linkfy.to/37zcR`](https://linkfy.to/37zcR)\
  \ [`linkfy.to/XPaue`](https://linkfy.to/XPaue)\n\n对于本项目，值在 `200 Ω` 到 `400 Ω` 之间的电阻即可工作。通常它是棕色和绿色的电阻。\n\
  \n### 构建项目\n\n让我们开始构建电路并点亮 LED 设备。**NOTE**：书中的项目使用无焊接面包板，以避免无线连接的麻烦并减少错误。我们建议你也这样做。\n\
  \n让我们学习如何使用以下简单步骤将 LED 设备连接到树莓派：\n\n*   先将蓝色面包板条连接到树莓派的 `GND` 引脚组。请参考上文的 `GPIO`\
  \ 手册。\n*   下一步是将 LED 连接到面包板上。\n*   现在将电阻插入面包板，使其一端连接到 LED 设备的较长正极引脚（`anode`），另一端则通过跳线电缆连接到\
  \ `GPIO pin 22`。\n*   最后，将 LED 的负极引脚（`cathode`）连接到 `GND` 电源条上。\n\n只要电阻连接到正极或负极引脚，即可。\n\
  \n![](img/image_rsrc2UH.jpg)\n\n### 编写项目脚本\n\n现在，我们将编写一个 Python 脚本来控制 LED 的亮灭。到现在，你应该已经尝试过\
  \ `PIXEL` 桌面环境，并且可以轻松操作它。打开文件管理器，创建名为 `Pi.Projects` 的文件夹，用于存放本书中所有项目。\n\n现在让我们讨论控制\
  \ LED 设备的逻辑。LED 会保持开启指定的秒数，然后保持关闭指定的秒数。该过程会一直循环此模式，直到我们设定停止条件。\n\n现在，我们如何点亮 LED\
  \ 呢？我们知道需要将用于连接 LED 的 `GPIO` 引脚设置为 `HIGH`。我们可以采取相反操作来关闭 LED。因此，将 `PIN 22` 设为 High\
  \ 和 Low。\n\n![](img/image_rsrc2UJ.jpg)\n\n如你记得，我们将使用 `gpiozero` 库在 Python 中控制设备。下面是\
  \ Python 脚本：\n\n```\n![](img/image_rsrc2UK.jpg)\n```\n\n将脚本保存为 `led.py` 并打开终端。转到保存脚本的目录，并使用命令\
  \ `python3 led.py` 运行它。\n\n炸裂！你应该会看到 LED 点亮 4 秒，然后熄灭 4 秒，这标志着你的第一个项目完成。\n\n# 项目\
  \ 2：LCD 字符显示（中级）\n\n欢迎来到本书的第二个项目。本项目致力于展示如何连接并编程字符 LCD 设备以显示消息。我们先从静态文本开始，然后再处理更长文本的滚动显示。让我们开始吧。\n\
  \n### 要求\n\n本项目需要以下材料：\n\n*   一台树莓派。\n*   跳线电缆\n*   一个 `10 kΩ` 的电位计\n\n![](img/image_rsrc2UM.jpg)\n\
  \n*   无焊接面包板\n*   标准 16x2 LCD 来自 [Adafruit](https://www.adafruit.com/)。\n*   烙铁和\
  \ `5 cm` 焊锡线\n\n![](img/image_rsrc2UN.jpg)\n\n*   CircuitPython 或 `Adafruit_CharLCD`\
  \ 库\n\n### 理解 LCD 显示\n\n在开始构建和编码本项目之前，让我们稍作停顿，了解我们将做什么以及它是如何工作的。让我们先从 LCD 开始。液晶显示器或\
  \ `LCD` 是市面上最简单且最常见的显示类型。它们出现在许多电子设备中，如计算器、自动售货机、打印机、复古移动电话等。它们非常适合显示小段文字和图画。\n\n\
  LCD 的分类取决于单个屏幕上能容纳的字符行数和列数。例如，`16x2` LCD 可以容纳 2 行和 16 个字符。LCD 字符显示器还可以有不同的背景颜色，包括\
  \ RGB 显示。本项目中，你可以使用任何与树莓派兼容的 LCD。不过，我们建议你从 Adafruit 购买，因为他们开发了我们将使用的库。\n\n### 焊接\
  \ LCD 头针\n\n在大多数情况下，如果你购买 LCD，需要将引脚焊接到显示器上，如上图所示。只需对准它，将长端朝下放置并焊接即可。\n\n### LCD\
  \ 模块引脚\n\nLCD 的模块引脚从左到右排列，共 16 个引脚。\n\n| 引脚 |\n| :--- |\n| 1 | VSS |\n| 2 | VDD\
  \ |\n| 3 | v0 |\n| 4 | RS |\n| 5 | |\n| 6 | 7-14 |\n| 15 | LEDA |\n| 16 | LEDK |\n\
  \n`VSS` 引脚连接到 `GND`，而 `VDD` 引脚是电源引脚，应根据你的 LCD 连接到 `5` 或 `3.3 V`。大多数 LCD 设备额定为 `5V`。`v0`\
  \ 作为调节引脚，用于在连接到电位计时调节字符与 LCD 背光的对比度。引脚 `E`、`R/W` 和 `RS` 是控制引脚。引脚 `7` 到 `14` 是用于发送信息的数据引脚，而\
  \ `15` 和 `16` 是 LCD 背光的正负引脚。\n\n本项目只需要 6 个引脚即可连接到树莓派。如前所述，树莓派的 `GPIO` 连接器工作于 `3.3\
  \ V`，而你可能会发现 LCD 额定为 `5V`。这不应该引起任何警报。因为我们只向屏幕发送数据，而不从屏幕读取数据，所以这不应是问题。这意味着你应该将 `R/W`\
  \ 引脚接地，因为这只能让你读取而不能写入数据。\n\n![](img/image_rsrc2UP.jpg) 如果你使用的是额定为 `5V` 的 LCD 字符显示器，请不要连接\
  \ `R/W` 引脚，因为它会在 5V 电压下发送数据，这会损坏你的树莓派。\n\n\n\n\n\n在继续之前，请通过调整 LCD 对比度确保电位器工作正常。![](img/image_rsrc2UR.jpg)\n\
  \n### 项目脚本编写\n\n下一步是编写一个 `python` 脚本来控制 LCD 设备。在开始之前，请确保你已安装 `python`。我们还需要一个库来连接并与显示器交互。打开终端并输入以下命令来安装\
  \ `python` 和依赖库。![](img/image_rsrc2US.jpg)\n\n接下来，从以下链接下载 CircuitPython 库。[`github.com/adafruit/circuitpython/archive/6.1.0-beta.1.zip`](https://github.com/adafruit/circuitpython/archive/6.1.0-beta.1.zip)\
  \ 下载完成后，解压文件并进入 `circuitpython-6.1.0-beta.1` 文件夹。\n\n接着，执行命令：\n```bash\npython3\
  \ setup.py install\n```\n\n你也可以使用 `pip` 在你的系统上安装特定的 `CharLCD` 库。\n```bash\nsudo\
  \ pip3 install adafruit-circuitpython-charlcd\n```\n此命令将为你安装与 LCD 交互所需的库。接下来，导航到我们之前创建的项目文件夹，并创建一个名为\
  \ `lcd.py` 的文件，我们将用它来编写显示器的代码。![](img/image_rsrc2UT.jpg)![](img/image_rsrc2UU.jpg)![](img/image_rsrc2UV.jpg)![](img/image_rsrc2UW.jpg)\n\
  \n如果你想更好地理解代码及其工作原理，可以参考以下资源：\n[`github.com/adafruit/Adafruit_CircuitPython_CharLCD`](https://github.com/adafruit/Adafruit_CircuitPython_CharLCD)\
  \ [`circuitpython.org/`](https://circuitpython.org/) [`github.com/micropython/micropython`](https://github.com/micropython/micropython)\n\
  \n使用 LCD，你可以扩展项目以显示天气数据、告警消息等数据。\n\n# 项目 3：简单气象站（初级水平）\n\n欢迎来到另一个树莓派显示项目，在这个项目中我们将学习如何使用\
  \ OLED 显示器来显示信息。然而，在这个项目中，我们不会显示简单的文本。相反，我们将构建一个简单的气象站，并使用 API 请求显示你所在区域的天气信息。我们将在后续项目中构建一个完整的气象预报。请期待！\n\
  \n## 项目需求\n\n对于此项目，你需要以下组件：\n\n*   树莓派，如往常\n*   免焊接面包板\n*   `Adafruit_SSD1306` 库\n\
  *   跳线\n*   单色 0.96 英 128x64 OLED 图形显示器 [`www.amazon.com/DIYmall-Serial-128x64-Display-Arduino/dp/B00O2KDQBE`](https://www.amazon.com/DIYmall-Serial-128x64-Display-Arduino/dp/B00O2KDQBE)\n\
  \n### 理解 OLED 显示器\n\n此项目涉及有机光二极管，一种允许你选择开启或关闭哪些像素的显示器。从功能上来说，这允许你在显示器的任何位置显示任何文本或图标。与为每个字符预留\
  \ 5 x 8 空间的 LCD 不同，OLED 要灵活得多。此外，OLED 显示器不需要背光，使得这些显示类型成为理想选择，特别是在黑暗环境中。\n\n对于此项目，我们将使用具有\
  \ 128 x 64 像素的单色 0.96 英显示器。![](img/image_rsrc2UX.jpg) 根据你使用的 OLED 显示器型号，你通常会有 4\
  \ 个主引脚：`VCC`、`GND`、`SCL` 和 `SDA`。请注意给出的接线说明。\n\n对于使用集成电路（通信）协议的 OLED 显示器，你需要树莓派上的\
  \ `SDA` 和 `SCL` 引脚。它们按顺序对应 `GPIO 2` 和 `GPIO 3`。![](img/image_rsrc2UY.jpg)\n\n###\
  \ API 快速指南：OpenWeather\n\n这里是对 API 的快速介绍。API，或应用程序接口，是程序员开发的函数，用于将其服务开放给任何想要使用它的人。例如，`VirusTotal`\
  \ API 允许你扫描文件病毒，而无需开发个人的病毒引擎。\n\n在这个项目中，我们将使用 `OpenWeather` API，它允许我们请求指定语言的天气信息。如往常一样，我们将使用\
  \ `Python` 来发送这些请求。API 非常有用，因为允许你获取有关特定项目的准确且最新的数据。\n\n*   启动浏览器并导航到 [`openweathermap.org/api`](https://openweathermap.org/api)\n\
  *   接下来，创建一个账户以获取 API 权限。接着，在 `Subscribe` 按钮中选择当前天气数据。![](img/image_rsrc2UZ.jpg)\n\
  \n接下来，在你的账户仪表板中，选择 `API Keys` 标签页访问你的 API 密钥。(image_rsrc2V0.jpg)复制默认 API 密钥并执行简单的\
  \ API 请求。你可以使用任何 API 客户端如 `curl` 或 `Postman` 来完成。\n\n打开浏览器并执行以下请求：\n`api.openweathermap.org/data/2.5/weather?q={city\
  \ name}&appid={API key}`\n其中 `city name` 是你想获取信息的城市，`API key` 是你的 API 密钥。\n\n\n\n\
