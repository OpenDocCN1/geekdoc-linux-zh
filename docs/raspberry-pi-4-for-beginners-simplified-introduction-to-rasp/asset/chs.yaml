  \n## 项目 13：树莓派 Home Assistant（高级）\n\n在这个项目中，我们将使用开源的 Home Assistant 工具设置一个家居自动化系统。从以下资源了解更多：[`www.home-assistant.io/`](https://www.home-assistant.io/)\n\
  \n### 要求\n\n对于此项目，你只需要：\n\n*   树莓派\n\n*   SD 卡\n\n\n\n\n\n### 项目设置\n\n设置此项目需要一台运行最新版本\
  \ Raspbian OS 和 Home Assistant 的树莓派 4。在我们开始安装 HASS 软件之前，我们需要获取镜像。打开您的浏览器并导航到：[https://github.com/home-assistant/operating-system/releases/tag/4.18]\n\
  \nHome Assistant 建议您在 Raspberry Pi 3 或 4 上使用该软件。一旦下载了 HASS 镜像，我们就可以将其烧录到 SD 卡中。对于此项目，我们将使用来自\
  \ `Balena` 的 `Etcher`——请参考之前的章节。\n\n打开浏览器并导航到 etcher 官方网站下载该工具。[https://balena.io/etcher]。下载完成后，启动工具并将\
  \ SD 卡插入您的电脑。选择“Flash from File”（从文件烧录）并选择我们之前下载的 `Hass` 镜像。在目标（目标）部分选择 SD 卡并点击\
  \ flash（烧录）。\n\n我们建议将树莓派连接到线网络，因为我们没有涵盖如何使用 Home Assistant 在启动时初始化无线连接。\n\n现在我们可以启动\
  \ Home Assistant 软件了。执行此操作，请打开以下网页地址：`http://[IPADDRESS]:8123` 您需要从您的接入点获取 IP 地址；在此会话中无法访问终端会话。\n\
  \n启动后，软件将下载最新的可用版本并准备好一切。当软件首次启动后，刷新浏览器以查看更改。这将提示您创建一个账户。\n\n在下一个屏幕中，输入您的家庭名称。您可能还需要设置您的位置，或选择“detect”（检测）来自动选择位置。\n\
  \n在下一个屏幕中，您将看到软件检测到的所有设备列表。\n\n恭喜喜，您已成功在树莓派上设置好了 Home Assistant 软件。请考虑以下资源以学习如何使用该工具。[https://www.home-assistant.io/getting-started/]\n\
  \n# 项目 14：网络速度测试（中级）\n\n项目 14 涵盖了如何监控和保存您的网络速度。我们将导出数据并将其导入到 `Grafana` 等工具中。\n\n\
  ### 要求\n对于此项目，我们将使用：\n* 树莓派\n* Speedtest-CLI\n* Python3\n\n### 项目设置\n让我们开始设置项目并监控我们的网络速度。按照惯例，在任何安装之前，让我们使用以下命令更新系统：\n\
  ```bash\nsudo apt-get update && sudo apt-get upgrade –y\n```\n\n接下来，让我们安装将用于监控网络活动的\
  \ `Speedtest-CLI` python 库。\n```bash\nsudo apt-get install speedtest-cli\n```\n\n\
  如果您在官方树莓派仓库中没有该包，请如下方命令所示使用 `pip`：\n```bash\nsudo apt-get install python3-pip\n\
  sudo pip3 install speedtest-cli\n```\n\n您可以使用以下命令测试该工具：\n```bash\n$ speedtest-cli\
  \ --simplePing: 77.134 ms Download: 141.91 Mbit/s Upload: 14.85 Mbit/s\n```\n\n\
  现在我们已经安装了 `Speedtest` 包，可以开始创建一个 python 脚本来持续记录我们的网络数据。从创建一个 python 文件开始并使用您喜欢的文本编辑器进行编辑。输入下方所示的代码。\n\
  \n使用收集的数据，可以使用像 `Influx DB` 的工具导出数据并导入到 `Grafana` 等工具进行可视化。\n\n# 项目 15：树莓派上的 UFW\
  \ 防火墙（中级）\n\n网络安全是一项关键功能，而防火墙是最好的网络安全工具之一。在这个项目中，我们将设置一个简单的防火墙工具（Uncomplicated Firewall，`UFW`）。在\
  \ Linux 中设置防火墙，特别是使用 `iptables` 和 `Netfilter`，可能会变得异常复杂。为了采用更简单的方法，我们切换到 `UFW`。\n\
  \n### 要求\n此项目您只需要：\n* 树莓派\n\n### 项目设置\n从更新树莓派包开始：\n```bash\nsudo apt-get update\
  \ && sudo apt-get upgrade\n```\n\n接下来，安装 `ufw` 防火墙：\n```bash\nsudo apt-get install\
  \ ufw –y\n```\n\n一旦安装了 `UFW`，您需要使用命令启用它：\n```bash\nsudo ufw enable\n```\n\n现在您可以开始添加防火墙规则了。关于文档和如何使用该工具，请参考以下资源。\n\
  [https://wiki.ubuntu.com/UncomplicatedFirewall]\n[https://www.digitalocean.com/community/tutorials/ufw-essentials-common-firewall-rules-and-commands]\n\
  \n# 项目 16：树莓派 TeamViewer（初级）\n\n在这个简单的项目中，我们将在树莓派上设置 `TeamViewer`。`TeamViewer` 是一个用于远程桌面共享的闭源软件。它对于远程诊断等情况非常有用。在这个项目中，我们将树莓派作为仅能接收连接的\
  \ `TeamViewer` 服务器。您只能使用树莓派连接到服务器，而不能从服务器连接出去。\n\n### 要求\n* 树莓派。\n\n### 设置\n更新系统。\n\
  ```bash\nsudo apt-get update\nsudo apt-get upgrade\n```\n\n下载包：\n```bash\nwget [https://download.teamviewer.com/download/linux/teamviewer-host_armhf.deb]\n\
  ```\n\n安装包：\n```bash\nsudo dpkg –i teamviewer-host_armhf.deb\n```\n\n修复安装：\n```bash\n\
  sudo apt --fix-broken install\n```\n\n设置 TeamViewer 服务器密码：\n```bash\nsudo teamviewer\
  \ passwd <password>\n```\n\n查看 TeamViewer 信息：\n```bash\nteamviewer info\n```\n\n\
  完成后，您可以连接到您的树莓派 TeamViewer 服务器。\n\n# 项目 17：PI Hole 广告拦截器（中级）\n\n在这个快速的项目中，我们将使用\
  \ `Pi-Hole` 工具创建一个广告拦截器。`Pi-Hole` 是一个使用 `DNS` 拦截广告和不良内容的简单合一工具。\n\n`Pi-Hole` 的一些显著特性是：\n\
  * **免费**：`Pi-Hole` 是免费开源的，源代码托管在 `GitHub` 上。\n* **现代**：它可以拦截在 `IPv4` 和 `IPv6` 上提供的所有不良内容。\n\
  * **响应迅速**：通过缓存 `DNS` 查询，`Pi-Hole` 可以加速您的日常浏览活动。\n* **可扩展**：`Pi-Hole` 工具具有高度可扩展性，单个设备即可处理成千上万次查询。\n\
  * **轻量级**：该工具简单且快速。运行它不需要强大的硬件。使用像树莓派这样简单又强大的设备，`Pi-Hole` 可以无缝工作。\n* **健壮**：它同时提供\
  \ `Web` 和 `CUI` 界面，这对于可视化和控制非常有用。\n* **直观**：`Pi-Hole` Web 界面带有亮眼且组织良好的仪表板，非常直观。\n\
  * **多功能**：`Pi-Hole` 可以兼作 `DNS` 广告拦截工具和确保设备保护的 `HDCP` 服务器。\n\n\n\n\n\n# 快速快速安装\n\n\
  要快速简单地安装，请使用以下命令：\n```bash\ncurl -sSL https://install.pi-hole.net | bash\n```\n\
  在此处了解更多信息：[`github.com/pi-hole/pi-hole`](https://github.com/pi-hole/pi-hole)\n\n\
  # 项目 18：VPN 服务器 PiVPN (入门)\n\n你需要在你的树莓派上一个简单的 VPN 吗？接下来的项目将向你展示如何使用 `PiVPN` 实现此。这是一个快速且简单的项目，使用所示的单条命令：\n\
  \n### 安装命令\n```bash\ncurl -L https://install.pivpn.io | bash\n```\n从这里了解更多信息：[`www.pivpn.io/`](https://www.pivpn.io/)\n\
  \n# 项目 19：DietPi (中级)\n\n在整本书中，我们安装、使用并甚至更新了默认的 Raspbian 操作系统。然而，像任何其他计算机一样，我们可以在树莓派上安装另一个操作系统。在教程中，我们将讨论如何安装\
  \ `DietPi` 操作系统。\n\n`DietPi` 是一个为树莓派设计的简单、强大且轻量级的操作系统。当你想要为你的 PI 提供更好更快的操作系统时，它是非常有效的。尽管基于\
  \ `Debian`，但它比 Raspbian 更轻。\n\n`DietPi` 是轻量级的，安装后大小约为 400 MB。相比之下，它比 `Raspbian Lite`\
  \ 小三倍。它还预装了 `DietPi` 软件，允许你为设备安装必要的软件，例如 `Node-RED`、`Kodi` 等。\n\n### 要求\n为此此操作，你需要：\n\
  * 树莓派\n* SD 卡（至少 8GB）\n* USB 键盘\n* HDMI 线\n* 显示器\n* DietPi 镜像\n* Etcher 软件\n\n###\
  \ 设置你的项目\n首先从以下资源下载 `DietPi` 镜像。[`dietpi.com/`](https://dietpi.com/)![](img/image_rsrc2X6.jpg)\n\
  \n接下来，从 [`balena.io/etcher`](https://balena.io/etcher) 下载 `Balena Etcher`，并像我们在之前的章节中做的那样刻录镜像。\n\
  \n接下来，连接所有外设并启动你的树莓派。使用用户名 `root` 和密码 `dietpi` 登录。确保你已连接网络，因为 `DietPi` 将在启动时更新所有包。从资源\
  \ [`dietpi.com/docs/`](https://dietpi.com/docs/) 了解更多关于 `DietPi` 的信息。\n\n# 项目 20：TensorFlow\
  \ (中级)\n\n对于机器学习、人工智能或神经网络极客们，我们没有忽略你们。在这个项目中，我们将设置 `TensorFlow`，这是一个由 `Google`\
  \ 开发的机器学习库。\n\n`TensorFlow` 是机器学习中强大且至关重要的工具，但在 Windows 上设置它并不容易。你可能需要一个服务器或 Linux\
  \ 安装来实现，这就是为什么树莓派在运行此程序时是这样的救星。\n\n### 要求\n对于此项目，你需要以下工具：\n* 树莓派\n* 可用的互联网\n\n###\
  \ 在树莓派上安装 TensorFlow\n在树莓派上安装 `TensorFlow` 之前，请更新树莓派。\n```bash\nsudo apt-get update\n\
  sudo apt-get upgrade\n```\n接下来，我们需要安装 `libatlas` 包以允许对 `NumPy` 支持。\n```bash\nsudo\
  \ apt install libatlas-base-dev\n```\n完成后，使用 `pip` 安装 `TensorFlow`：\n```bash\npip3\
  \ install tensorflow\n```\n![](img/image_rsrc2X7.jpg)\n\n# 项目 21：树莓派上的安卓 (中级)\n\n\
  在这个项目中，我们将使用 `EmteriaOS` 将标准的树莓派转变为安卓设备。虽然 `EmteriaOS` 拥有闭源的专有软件，但它包含一个你可以使用的免费版本。`EmteriaOS`\
  \ 是基于 `RTAndroid` 并为树莓派构建的定制安卓系统。\n\n### 要求\n在这个项目中，你将需要以下工具和资源：\n* 树莓派\n* 基础外设\n\
  * EmteriaOS 镜像\n\n### 设置项目\n在将操作系统刻录到 SD 卡之前，你需要从 [`emteria.com`](https://emteria.com)\
  \ 下载安装程序。你可能在下载所需文件前需要注册。\n\n登录并导航到下载页面。选择适用于你系统的安装程序，启动安装程序并使用你的 `EmteriaOS` 详情登录。\n\
  \n在下一个窗口中，选择你希望作为安卓设备的树莓派设备。接下来，选择 SD 卡刻录镜像。这将开始 `EmteriaOS` 的下载和刻录过程。\n\n请等待过程完成，安全地弹出\
  \ SD 卡并插入你的树莓派。启动树莓派以运行安装程序。此过程可能需要一段时间。\n\n最后，按照安装程序的提示完成你系统的设置。一旦进入操作系统，你就可以通过侧载安装应用。\n\
  \n# 项目 22：Windows 10 IoT Core (中级)\n\n`IoT` 是看到显著改进和增长的技术之一。大公司已经开发了工具来帮助这项惊人的新颖技术。微软是开发\
  \ Microsoft IoT core 的公司之一。\n\n`Windows IoT Core` 是 Windows 10 的一个小型定制版本，开发者可以使用它来构建\
  \ IoT 设备。它是构建从小型项目到大型企业级 IoT 项目的一种非常方便的方法。`IoT core` 可以运行在 `ARM` 和 `x86/x64` 上。你可以从官方\
  \ IoT core 文档了解更多信息。[`www.microsoft.com/en-us/windows/iot-core/`](https://www.microsoft.com/en-us/windows/iot-core/)\n\
  \n### 要求\n* 树莓派\n* SD 卡\n* 基础外设\n\n### 设置 IoT Core\n在刻录到 SD 卡之前，你需要从 [`www.microsoft.com/en-us/windows/iot-core/`](https://www.microsoft.com/en-us/windows/iot-core/)\
  \ 下载安装程序。你可能在下载所需文件前需要注册。\n\n登录并导航到下载页面。选择适用于你系统的安装程序，启动安装程序并使用你的详情登录。\n\n在下一个窗口中，选择你希望作为安卓设备的树莓派设备。接下来，选择\
  \ SD 卡刻录镜像。这将开始下载和刻录过程。\n\n等待过程完成，安全地弹出 SD 卡并插入你的树莓派。启动树莓派以运行安装程序。此过程可能需要一段时间。\n\
  \n[`www.microsoft.com/en-us/windows/iot-core/`](https://www.microsoft.com/en-us/windows/iot-core/)\n\
  \n最后，按照安装程序的提示完成你系统的设置。一旦进入操作系统，你就可以侧载安装应用。[`www.microsoft.com/en-us/windows/iot-core/`](https://www.microsoft.com/en-us/windows/iot-core/)\n\
  \n# 项目 23：Minecraft 服务器 (中级)\n\n`Minecraft` 可能是最流行且最上瘾的游戏之一。在这个项目中，我们将设置一个你可以使用的\
  \ `Minecraft` 服务器。通常你需要一个强大的设备来托管服务器，但通过树莓派，你可以在几分钟内创建它并与朋友分享，享受有趣的时光。\n\n### 要求\n\
  * 树莓派\n* 网络连接\n\n### 设置项目\n在我们开始之前，确保更新树莓派：\n```bash\nsudo apt-get update && sudo\
  \ apt-get -y upgrade\n```\n接下来，确保你已安装并运行 `Java`，命令为：`java --version`\n\n现在，创建一个你将托管\
  \ `Minecraft` 服务器的文件夹：\n```bash\nmkdir minecraft & cd minecraft\n```\n下载 BuildTools。![](https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar)\n\
  \n现在，编译你下载的 `BuildTools` 包：\n```bash\njava -jar BuildTools.jar\n```\n完成后，使用命令启动服务器：\n\
  ```bash\njava -Xms#G -Xmx#G -XX:+UseG1GC -jar spigot.jar nogui\n```\n现在你可以使用树莓派的\
  \ IP 地址连接 `Minecraft` 服务器。从以下资源了解更多关于服务器的信息。[`www.spigotmc.org/`](https://www.spigotmc.org/)\n\
  \n# 项目 24：树莓派蜜罐 (高级)\n\n你是否是否有攻击者经常尝试攻击你的网络？在这个项目中，我们将使用 `HoneyPi` 设置一个让让他们疯狂的 `蜜罐`。`蜜罐`\
  \ 是一种预留在指定网络中的系统，用于吸引潜在的攻击者并记录他们的信息。我们将使用 `HoneyPi`，因为它强大且易用。\n\n\n\n\n* VNC 和 SSH\
  \ 连接。\n\n### 要求\n本项目所需的全部如下：\n* 一台树莓派\n* 一个 Psad 包\n* Python\n\n### 设置项目\n要安装此项目，首先更新系统并使用以下命令安装\
  \ Psad 包：\n```bash\napt-get install psad\n```\n接下来，下载一个将协助安装过程的 shell 脚本。\n```bash\n\
  wget https://github.com/mattymcfatty/HoneyPi/archive/master.zip\n```\n解压文件并进入目录。\n\
  ```bash\nunzip master.zip && cd HoneyPi-Master\n```\n最后，设置执行权限并使用以下命令以 sudo 运行脚本：\n\
  ```bash\nchmod 755 *.sh\nsudo ./honeyPiInstaller.sh\n```\n注意：这将影响您的树莓派的 `iptables`；请小心。\n\
  \n## 项目 25：在树莓派上安装 CentOS（初学者）\n\n在本项目中，我们将了解如何在树莓派上安装 CentOS。CentOS 是一种免费且开源的 Linux\
  \ 发行版，用于服务器和网页托管。它是 Red Hat Linux 的免费仓库。\n\n### 要求\n本项目所需的全部如下：\n* 一台树莓派\n* SD 卡\n\
  * 网络连接\n\n### 设置项目\n第一步是下载 CentOS 的 ISO 镜像。\n`https://mirrors.xtom.com/centos-altarch/7.9.2009/isos/armhfp/`\n\
  如果您有桌面环境偏好，请从镜像中选择并下载其 ISO。但是，如果您对终端会话完全熟悉，请下载极简版。\n接下来，下载 Balena Etcher——我们在之前的项目中已经介绍过——并将镜像写入\
  \ SD 卡。将卡片插入您的 Pi 并启动它。根据您选择的桌面环境，您将看到欢迎窗口。\n按照安装步骤完成过程，进入您的操作系统。\n注意：默认用户名和密码分别是\
  \ `root` 和 `centos`。\n\n## PROJECT 26: Setting up Web Min (Beginner Level)\n\n我们终于到达了最后的项目。在本项目中，我们将设置\
  \ Web Min，这是一个针对 Apache、SQL、Postfix、DHCP 等的简单有效的系统管理工具。\n我们不会深入探讨如何设置这些服务。您可以从官方\
  \ Web Min 维基中了解更多。\n`https://doxfer.webmin.com/Webmin/Main_Page`\n\n### 设置项目\n首先更新您的树莓派系统。\n\
  ```bash\nsudo apt-get update && sudo apt-get upgrade\n```\n接下来，使用以下命令安装运行 Web Min\
  \ 所需的包。\n接下来，从以下链接下载安装包。\n`https://www.webmin.com/download.html`\n```bash\nwget\
  \ https://prdownloads.sourceforge.net/webadmin/webmin_1.962_all.deb\n```\n继续进行安装过程。\n\
  ```bash\nsudo dpkg –i webadmin_1.962_all.deb\n```\n安装完成后，使用 `http://localhost:10000`\
  \ 访问 Webmin。\n输入用户名和密码为 `pi` 和 `raspberry`， respectivamente。\n\n### 结论\n本书涵盖了从基本的树莓派安装、硬件配置到更多内容的广泛主题。我们还通过创意项目学习如何使用树莓派创建解决实际问题的惊艳工具。\n\
  尽管书籍内容丰富，但并未涵盖全部内容。关于我们如何使用树莓派，还有很多未被覆盖的内容。我的建议是，请利用您可用的资源，发挥树莓派的力量。\n基于此，以下是您可以尝试的其他创新项目列表：\n\
  * 一个多彩 LED 设备\n* 与 SenseHAT 结合的高级天气站。\n* Bugler 警报\n* 遥控机器人\n* 智能植物监测系统\n* 国际空间站位置追踪器\n\
  \n现在您已经知道如何使用树莓派 4，还可以发现更多内容。\n祝您实验愉快，继续学习！\n\n*** \n"
