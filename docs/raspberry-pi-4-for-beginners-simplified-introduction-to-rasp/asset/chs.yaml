  这是一个示例输出。![](img/image_rsrc2V9.jpg)\n该项目到此结束。\n\n## 项目：带电位器的 4 灯开关（中级水平）\n列表中的下一个项目是\
  \ LED 调光器。该项目涉及 LED 设备，并使用电位器控制 LED 的亮度。我知道我们在第一个项目中已经介绍过 LED 设备了，但这个项目将向你展示如何读取模拟输入信号和输出调制信号。记住，我们将在后续项目将会需要在本节中学习的技能。让我们玩得开心吧。\n\
  \n### 要求\n对于此项目，你需要以下基础物品：\n\n*   树莓派板\n*   免面包板\n*   330 Ω 电阻\n*   5 mm LED\n*\
  \   跳线\n*   一个 10 kΩ 电位器\n*   `MCP3008` 芯片\n\n### 理解电位器\n我们可以将电位器定义为手动调节的电阻。电位器有一个旋转触点，像旋盘一样，有助于手动调节电子元件的电压。电位器广泛应用于各种设备，如音量控制器、风扇速度控制器、亮度调节旋钮等。\n\
  \n下面是一个 10 kΩ 电位器的示例：![](img/image_rsrc2VA.jpg)\n电位器由三个部分组成。两个外部引脚连接到电阻元件，而第三个引脚连接到导电但可调节的擦片。![](img/image_rsrc2VB.jpg)\n\
  对于这个项目，我们将使用电路中的电阻调整 LED 设备的亮度。\n\n### 在树莓派上处理模拟信号\n由于你现在可能已经做了研究，我们使用的电位器只使用模拟信号。然而，树莓派的\
  \ GPIO 只能读取数字信号。这意味着树莓派可以读取 `LOW`（0 值）或 `HIGH`（3.3 特）电压，中间的任何无法读取。\n\n由于我们将使用电位器调节\
  \ 0 到 3.3 之间的电压，我们需要一种方法读取 `HIGH` 和 `LOW` 之间的值，从而允许 LED 灯光的亮度产生变化。为此，我们将使用一个模数转换芯片，然后用脉冲宽度调制器生成模拟信号。\n\
  \n确保掌握芯片的方向，因为这非常关键。![](img/image_rsrc2VC.jpg) ![](img/image_rsrc2VD.jpg)\n我很想解释这些设备的工作原理，但这超出了本书的范围。不过，我提供了一些非常好的资源；我强烈建议在构建之前阅读它们！\n\
  [`www.arrow.com/en/research-and-events/articles/engineering-resource-basics-of-analog-to-digital-converters`](https://www.arrow.com/en/research-and-events/articles/engineering-resource-basics-of-analog-to-digital-converters)[`www.electronics-tutorials.ws/combination/analogue-to-digital-converter.html`](https://www.electronics-tutorials.ws/combination/analogue-to-digital-converter.html)[`learn.adafruit.com/raspberry-pi-analog-to-digital-converters/mcp3008`](https://learn.adafruit.com/raspberry-pi-analog-to-digital-converters/mcp3008)![](img/image_rsrc2VE.jpg)\n\
  `MCP3008` 芯片的对齐非常**重要**，你**必须**将半圆凹口朝上放置，如所示！\n\n### 构建项目\n此项目的电路构建简单，不应该花费很长时间。只需按照下面的指令操作即可。\n\
  \n*   首先连接面包板导轨（蓝色）`GND`\n*   接下来，将 `3.3 V` 连接到面包板的红色导轨\n*   在面包板导轨中心添加 `MCP3008`\
  \ 芯片并按如下方式连接。\n\n| MCP3008 | Raspberry Pi GPIO |\n| :--- | :--- |\n| 1 | 电位器中心引脚\
  \ |\n| 9 | GND |\n| 10 | `GPIO 8` |\n| 11 | `GPIO 10` |\n| 12 | `GPIO 9` |\n| 13\
  \ | `GPIO 11` |\n| 14 | GND |\n| 15 | 3.3 V |\n| 16 | 3.3 V |\n\n*   使用长引脚将 LED\
  \ 连接到面包板和树莓派的 `GPIO 17`（使用 `330 Ω`），而短端连接到 `GND` 导轨。\n*   最后步骤中，选择电位器的一个外部引脚并连接到\
  \ `GND`。选择另一个外部引脚并连接到 `3.3 V`。\n*   对于电位器的中间引脚，将其连接到 `MCP3008` 芯片的第 1 引脚。\n\n![](img/image_rsrc2VF.jpg)\n\
  \n### 项目脚本编写\n又是编写代码的时间。在使用脚本之前，让我们启用 SPI 通信协议，因为 `MCP3008` 芯片使用该协议与树莓派通信。[`linkfy.to/LiH3f`](https://linkfy.to/LiH3f)打开\
  \ Preferences -> Raspberry Pi configuration – Interface 并启用 SPI。![](img/image_rsrc2VG.jpg)\n\
  \n#### 脚本逻辑\n这里是关于脚本“如何做”以及“做什么”的简单逻辑：\n\n*   首先，我们需要使用 `MCP3008` 转换芯片从电位器读取模拟信号。\n\
  *   接下来，我们需要使用脉冲宽度调制器控制 LED 的亮度\n*   最后，将脉冲宽度调制器的占空比调整为从电位器读取的值。\n\n对于此脚本，除了 `gpiozer`\
  \ 之外我们不需要任何外部库。在项目文件夹中创建一个 python 文件并命名为 `adjust.py`，输入下方所示的代码：![](img/image_rsrc2VH.jpg)\n\
  \n## 项目 5：烟雾与气体检测器（专家级）\n再次欢迎来到第 5 个项目。在这个项目中，我们将使用气体检测器、烟雾传感器和用于声音报警的蜂鸣器构建一个检测报警器。当传感器检测到环境中存在气体或烟雾时，蜂鸣器将激活。\n\
  \n### 要求\n对于此项目，我们需要以下组件。\n\n*   树莓派\n*   免面包板\n*   MQ-2 气体烟雾检测器\n*   压电蜂鸣器\n* \
  \  5 mm LED\n*   `MCP 3008` 芯片\n*   打火机\n*   按钮\n*   跳线\n*   330 Ω 电阻\n\n\n\n\n\n\
  ![](img/image_rsrc2VJ.jpg) ![](img/image_rsrc2VK.jpg)\n### 理解 MQ-2 气体和烟雾检测器\n\n\
  让我们讨论一下 `MQ-2` 烟雾气体传感器是如何工作的。别担心，我会尽量简短。`MQ-2` 传感器对烟雾和各种易燃气体敏感。虽然某些 `MQ-2` 传感器只能检测特定类型的气体，但在大多数此类传感器中，氢气、酒精、丁烷、丙烷和甲烷等常见气体是默认检测对象。\n\
  \n该传感器通过读取周围区域的气体浓度并使用 `MCP 3008` 卡（在上一个项目中讨论过）发送模拟信号来工作。如果周围区域上述气体的浓度较高，系统将检测到高电压输出。\n\
  \n你也可以使用另一种方法来检测高气体浓度。这种方法在具有这些气体默认浓度的区域效果最好。情况下，你可以设置一个特定的阈值，如果传感器检测到的水平高于设定阈值，则输出\
  \ `HIGH` 电压信号；反之则输出 `LOW` 电压信号。\n\n我们可以使用 `MQ-2` 上的电位器来调整阈值。`MQ-2` 传感器还有一个 `LED`\
  \ 指示器，当气体浓度高于阈值时，可以用它警告用户。\n\n![](img/image_rsrc2VM.jpg) 作为额外奖励，`MQ-2` 使用模拟信号读取数据，这提供了一种测量气量的定量方法，帮助你定义一个更好的阈值，超过该值后即可报警。然而，正如我们在上一节中讨论的，`Pi`\
  \ 只读取数字信号，因此我们必须使用 `MCP2008` 卡进行信号转换。\n\n### 构建项目\n\n构建此项目应该相当简单，因为已经介绍了如何连接 `LED`\
  \ 和 `MCP2008`。以下是构建电路的快速步骤：\n\n*   首先将 `GND` 连接到面包板上的蓝色导轨，将 `3.3v` 连接到面包板上的红色导轨。\n\
  *   下一步是将 `MCP3008` 芯片放置在面包板的中心，确保引脚与中心分隔线的任意两侧平行，如下所示。\n\n![](img/image_rsrc2VN.jpg)\n\
  \n*   接下来按照如下方式接线到芯片：\n\n| MCP3008 | 连接至 |\n| :--- | :--- |\n| 1 | `MQ-2 AO` |\n\
  | 9 | `GND` |\n| 10 | `GPIO 8` |\n| 11 | `GPIO 10` |\n| 12 | `GPIO 9` |\n| 13 |\
  \ `GPIO 11` |\n| 14 | `GND` |\n| 15 | `3.3 V` |\n| 16 | `3.3V` |\n\n记得将 `MCP3008`\
  \ 芯片的半圆方向朝上对！\n\n*   现在，将 `MQ-2` 烟雾气体检测器添加到面包板上并如下所示连接：\n\n| MQ-2 | 连接至 |\n| :---\
  \ | :--- |\n| VCC | `5 V` |\n| GND | `GND` |\n| AO | `MCP3008 Pin 1` |\n| DO | 无\
  \ |\n\n*_ 接下来是 `LED`。按照之前项目中所讨论的将其连接到面包板上。（阳极通过 `330 Ω` 电阻连接到 `GPIO 17`，阴极连接到面包板上的\
  \ `GND` 导轨）\n*   现在是按钮：将其插入面包板中间，两个引脚分别位于中心分隔线的两侧。\n*   将右下引脚连接到 `GND`，左下引脚连接到 `GPIO\
  \ 2`，确保两个引脚连接在分隔线的同一侧，如下所示。\n\n![](img/image_rsrc2VP.jpg)\n\n*   接下来，将蜂鸣器连接到面包板，黑线连接到\
  \ `GND` 导轨，红线连接到 `GPIO 27`\n\n砰，我们已经完成了项目的构建，可以进入代码部分了。\n\n### 项目脚本编写\n\n在项目文件夹（是的，就是那个）中创建一个\
  \ python 文件并命名为 `gas_smoke_dect.py`。在文件中放置以下代码：\n\n```\n![](img/image_rsrc2VR.jpg\n\
