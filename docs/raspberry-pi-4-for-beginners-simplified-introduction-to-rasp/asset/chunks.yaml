    # Setting up the project


    Setting up this project will require a Raspberry Pi 4 running the latest version
    of Raspbian OS and Home Assistant. Before we begin installing the HASS software,
    we need to grab the image. Open your browser and navigate to: [https://github.com/home-assistant/operating-system/releases/tag/4.18]


    Home Assistant recommends you use the software on Raspberry Pi 3 or 4. Once you
    download the HASS image, we can proceed to flash it to the SD card. For this project,
    we shall use `Etcher` from `Balena`—refer to previous sections.


    Open the browser and navigate to the official etcher website and download the
    tool.[https://balena.io/etcher] Once downloaded, launch the tool and insert the
    SD card into your PC. Select “Flash from File” and select the `Hass` image we
    downloaded earlier. In the target section, select the SD card and click on flash.


    We recommend connecting the Raspberry Pi to a Wired connection as we do not cover
    how to initialize wireless connection on boot using Home Assistant.


    Now we can boot up the Home Assistant Software. To do this, open the following
    web address: `http://[IPADDRESS]:8123` You will need to get the IP address from
    your access point; you cannot access a terminal session at this session.


    Upon boot, the software will download the latest available version and prepare
    everything. Once the software boots for the first time, refresh your browser to
    see the changes. This will prompt you to create an account.


    In the next screen, enter the name of your home. You might also need to set your
    location or select “detect” to select location automatically.


    On the next screen, you will see a list of all the devices that the software has
    detected.


    Congratulations, you have successfully finished setting up Home Assistant software
    on the Pi. Consider the following resources to learn how to work with the tool.[https://www.home-assistant.io/getting-started/]


    # PROJECT 14: Internet Speed Test (Intermediates)


    Project 14 covers how to monitor and save your internet speed. We will then export
    the data and import it to tools like `Grafana`.


    ## Requirements

    For this project, we will use:

    * Raspberry Pi

    * Speedtest-CLI

    * Python3


    ## Setting up the Project

    Let us begin setting up the project and monitoring our internet speed. As usual
    before any installation, let us update our system using the command:

    ```bash

    sudo apt-get update && sudo apt-get upgrade –y

    ```


    Next, let’s install the `Speedtest-CLI` python library that we shall use to monitor
    network activity.

    ```bash

    sudo apt-get install speedtest-cli

    ```


    If you do not have the package in the official Raspberry Pi repo, use `pip` as
    shown in the commands below:

    ```bash

    sudo apt-get install python3-pip

    sudo pip3 install speedtest-cli

    ```


    You can test the tool using the command:

    ```bash

    $ speedtest-cli --simplePing: 77.134 ms Download: 141.91 Mbit/s Upload: 14.85
    Mbit/s

    ```


    Now that we have the `Speedtest` package installed, we can begin creating a python
    script that will continuously log our network data. Start by creating a python
    and edit using your favorite text editor. Enter the code shown below.


    Using the data collected, you can use a tool like `Influx DB` to export the data
    and import it to tools like `Grafana` for visualization.


    # PROJECT 15: UFW Firewall on Raspberry Pi (Intermediates)


    Network security is a crucial feature, and a firewall is one of the best network
    security tools. In this project, we shall set up a simple Firewall tool (Uncomplicated
    Firewall, `UFW`). Setting up a Firewall in Linux, especially using `iptables`
    and `Netfilter`, can be unnecessarily complicated. For a simpler method, we switch
    to `UFW`.


    ## Requirements

    All you need for this project is:

    * A Raspberry Pi


    ## Setting up the Project

    Start by updating the Raspberry Pi packages:

    ```bash

    sudo apt-get update && sudo apt-get upgrade

    ```


    Next, install the `ufw` firewall:

    ```bash

    sudo apt-get install ufw –y

    ```


    Once you have `UFW` installed, you need to enable it using the command:

    ```bash

    sudo ufw enable

    ```


    Now you can start adding firewall rules. For documentation and how to use the
    tool, consider the following resources.

    [https://wiki.ubuntu.com/UncomplicatedFirewall]

    [https://www.digitalocean.com/community/tutorials/ufw-essentials-common-firewall-rules-and-commands]


    # PROJECT 16: Raspberry Pi TeamViewer (Beginner Level)


    In this simple project, we shall set up `TeamViewer` on the Raspberry pi. `TeamViewer`
    is a closed-source software used for remote desktop sharing. It is very useful
    for remote diagnostics and such. In this project, we use the Raspberry pi as a
    `TeamViewer` server that can only receive connections. You can only use the pi
    to connect to and not from the server.


    ## Requirement

    * Raspberry Pi.


    ## Setting

    Update the system.

    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    ```


    Download the package:

    ```bash

    wget [https://download.teamviewer.com/download/linux/teamviewer-host_armhf.deb]

    ```


    Install the package:

    ```bash

    sudo dpkg –i teamviewer-host_armhf.deb

    ```


    Repair installation:

    ```bash

    sudo apt --fix-broken install

    ```


    Set a TeamViewer server password:

    ```bash

    sudo teamviewer passwd <password>

    ```


    View the TeamViewer Information:

    ```bash

    teamviewer info

    ```


    Once completed, you can connect to your Raspberry Pi TeamViewer server.


    # PROJECT 17: PI Hole AdBlocker (Intermediates)


    In this quick project, we shall create an Ad-Block using the `Pi-Hole` tool. `Pi-Hole`
    is a simple all-in-one tool that uses `DNS` to block ads and unwanted content
    without any software.


    Some salient features of the `Pi-Hole` are:

    * **Free**: `Pi-Hole` is free and open-source, with the source code hosted on
    `GitHub`.

    * **Modern**: It blocks unwanted content served on both `IPv4` and `IPv6`.

    * **Responsive**: By caching `DNS` queries, `Pi-Hole` speeds up your browsing
    activity daily.

    * **Scalable**: `Pi-Hole` tool is highly scalable and capable of handling thousands
    if not millions of queries on a single device.

    * **Lightweight**: The tool is simple and fast. It does not require powerful hardware
    to run. Using a simple and powerful device like the raspberry pi, `Pi-Hole` can
    work seamlessly with no errors.

    * **Robust**: It offers both `Web` and `CUI` interface, which is useful for visualization
    and control.

    * **Intuitive**: The `Pi-Hole` web interface is useful with a flashy and well-organized
    dashboard.

    * **Multipurpose**: `Pi-Hole` can work as a `DNS` Ad-Block tool and an `HDCP`
    server that ensures device protection.

