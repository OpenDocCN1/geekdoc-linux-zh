    # 快速回顾：LED 与电阻


    如前所述，LED 设备有不同的尺寸、形状、颜色和电压要求。有些 LED 设备能在一个装置中混合颜色。对于本项目，任何 `5mm` 的 LED 设备都可以工作。LED
    设备包含一个二极管，当电流通过时会发光。


    电气二极管具有极性——意味着它们只能在一个方向上允许电流流动，通常是从正极到负极。正极点是 `anode`，负极点是 `cathode`。你可以通过观察其引脚来辨识二极管的某个点，如下所示。较长的引脚代表正极（`anode`
    (+）），而较短的引脚代表负极（`cathode` (–)）。


    ![](img/image_rsrc2UG.jpg)


    LED 设备无法自动调节电流。因此，如果向设备传入过多电流，可能会损坏设备，甚至损坏树莓派。因此，最好始终将 LED 与一系列电阻串联连接。你应该连接的电阻类型取决于
    LED 能够承受的最大值。大多数 LED 最大可承受 `20 mA`。但是请检查设备的最大值。我不会花太多时间解释电阻及其工作原理。请参考以下资源以获取更多信息：[`linkfy.to/37zcR`](https://linkfy.to/37zcR)
    [`linkfy.to/XPaue`](https://linkfy.to/XPaue)


    对于本项目，值在 `200 Ω` 到 `400 Ω` 之间的电阻即可工作。通常它是棕色和绿色的电阻。


    ## 构建项目


    让我们开始构建电路并点亮 LED 设备。**NOTE**：书中的项目使用无焊接面包板，以避免无线连接的麻烦并减少错误。我们建议你也这样做。


    让我们学习如何使用以下简单步骤将 LED 设备连接到树莓派：


    *   先将蓝色面包板条连接到树莓派的 `GND` 引脚组。请参考上文的 `GPIO` 手册。

    *   下一步是将 LED 连接到面包板上。

    *   现在将电阻插入面包板，使其一端连接到 LED 设备的较长正极引脚（`anode`），另一端则通过跳线电缆连接到 `GPIO pin 22`。

    *   最后，将 LED 的负极引脚（`cathode`）连接到 `GND` 电源条上。


    只要电阻连接到正极或负极引脚，即可。


    ![](img/image_rsrc2UH.jpg)


    ## 编写项目脚本


    现在，我们将编写一个 Python 脚本来控制 LED 的亮灭。到现在，你应该已经尝试过 `PIXEL` 桌面环境，并且可以轻松操作它。打开文件管理器，创建名为
    `Pi.Projects` 的文件夹，用于存放本书中所有项目。


    现在让我们讨论控制 LED 设备的逻辑。LED 会保持开启指定的秒数，然后保持关闭指定的秒数。该过程会一直循环此模式，直到我们设定停止条件。


    现在，我们如何点亮 LED 呢？我们知道需要将用于连接 LED 的 `GPIO` 引脚设置为 `HIGH`。我们可以采取相反操作来关闭 LED。因此，将 `PIN
    22` 设为 High 和 Low。


    ![](img/image_rsrc2UJ.jpg)


    如你记得，我们将使用 `gpiozero` 库在 Python 中控制设备。下面是 Python 脚本：


    ```

    ![](img/image_rsrc2UK.jpg)

    ```


    将脚本保存为 `led.py` 并打开终端。转到保存脚本的目录，并使用命令 `python3 led.py` 运行它。


    炸裂！你应该会看到 LED 点亮 4 秒，然后熄灭 4 秒，这标志着你的第一个项目完成。


    # 项目 2：LCD 字符显示（中级）


    欢迎来到本书的第二个项目。本项目致力于展示如何连接并编程字符 LCD 设备以显示消息。我们先从静态文本开始，然后再处理更长文本的滚动显示。让我们开始吧。


    ### 要求


    本项目需要以下材料：


    *   一台树莓派。

    *   跳线电缆

    *   一个 `10 kΩ` 的电位计


    ![](img/image_rsrc2UM.jpg)


    *   无焊接面包板

    *   标准 16x2 LCD 来自 [Adafruit](https://www.adafruit.com/)。

    *   烙铁和 `5 cm` 焊锡线


    ![](img/image_rsrc2UN.jpg)


    *   CircuitPython 或 `Adafruit_CharLCD` 库


    ### 理解 LCD 显示


    在开始构建和编码本项目之前，让我们稍作停顿，了解我们将做什么以及它是如何工作的。让我们先从 LCD 开始。液晶显示器或 `LCD` 是市面上最简单且最常见的显示类型。它们出现在许多电子设备中，如计算器、自动售货机、打印机、复古移动电话等。它们非常适合显示小段文字和图画。


    LCD 的分类取决于单个屏幕上能容纳的字符行数和列数。例如，`16x2` LCD 可以容纳 2 行和 16 个字符。LCD 字符显示器还可以有不同的背景颜色，包括
    RGB 显示。本项目中，你可以使用任何与树莓派兼容的 LCD。不过，我们建议你从 Adafruit 购买，因为他们开发了我们将使用的库。


    ### 焊接 LCD 头针


    在大多数情况下，如果你购买 LCD，需要将引脚焊接到显示器上，如上图所示。只需对准它，将长端朝下放置并焊接即可。


    ### LCD 模块引脚


    LCD 的模块引脚从左到右排列，共 16 个引脚。


    | 引脚 |

    | :--- |

    | 1 | VSS |

    | 2 | VDD |

    | 3 | v0 |

    | 4 | RS |

    | 5 | |

    | 6 | 7-14 |

    | 15 | LEDA |

    | 16 | LEDK |


    `VSS` 引脚连接到 `GND`，而 `VDD` 引脚是电源引脚，应根据你的 LCD 连接到 `5` 或 `3.3 V`。大多数 LCD 设备额定为 `5V`。`v0`
    作为调节引脚，用于在连接到电位计时调节字符与 LCD 背光的对比度。引脚 `E`、`R/W` 和 `RS` 是控制引脚。引脚 `7` 到 `14` 是用于发送信息的数据引脚，而
    `15` 和 `16` 是 LCD 背光的正负引脚。


    本项目只需要 6 个引脚即可连接到树莓派。如前所述，树莓派的 `GPIO` 连接器工作于 `3.3 V`，而你可能会发现 LCD 额定为 `5V`。这不应该引起任何警报。因为我们只向屏幕发送数据，而不从屏幕读取数据，所以这不应是问题。这意味着你应该将
    `R/W` 引脚接地，因为这只能让你读取而不能写入数据。


    ![](img/image_rsrc2UP.jpg) 如果你使用的是额定为 `5V` 的 LCD 字符显示器，请不要连接 `R/W` 引脚，因为它会在 5V
    电压下发送数据，这会损坏你的树莓派。


