    # Setting up the Project


    Before we start installing Nagios, let us first ensure that our system is up to
    date with the commands:


    ```bash

    sudo apt update

    sudo apt full-upgrade

    ```


    Now we can install the packages required to run Nagios and then compile Nagios.


    ```bash

    sudo apt install -y autoconf build-essential wget unzip apache2 apache2-utils
    php libgd-dev snmp libnet-snmp-perl gettext libssl-dev wget bc gawk dc libmcrypt-dev

    ```


    If you have an apache webserver running (as seen in the previous project), remove
    the `apache` package from the command above.


    Next, in your Desktop, create a folder and call it `temp`. This is where we are
    going to compile the Nagios source code.


    ```bash

    mkdir ~/Desktop/temp && cd ~/Desktop/temp

    ```


    Inside the folder, navigate to Nagios core GitHub page and download the source
    code or use `wget`:


    ```bash

    wget -O nagios.tar.gz https://github.com/NagiosEnterprises/nagioscore/archive/nagios-4.4.6.tar.gz

    ```


    Next, extract the archive using the command:


    ```bash

    tar xvf nagios.tar.gz

    ```


    That will create a `Nagioscore` folder. Navigate into the folder and configure
    the software for compilation using the command:


    ```bash

    cd nagioscore-nagios-4.4.6/ && ./configure --with-httpd-conf=/etc/apache2/sites-enabled

    ```


    Next, compile the source code using the command `make all`. Since we are compiling
    the Nagios source code, this process may take a while, especially while running
    on the Raspberry pi.


    ```bash

    make all

    ```


    Now, we need to create users and groups required for Nagios to run. We will also
    need to add `www-data` user to the Nagios group using the commands shown below:


    ```bash

    sudo make install-groups-users

    sudo usermod -a -G nagios www-data

    ```


    Finally, the compiled binaries. We also need to install the Nagios daemon that
    will allow the service to start with the OS.


    ```bash

    sudo make install && sudo make install-daemoninit && sudo make install-config
    && sudo make install-commandmode

    ```


    - `make install-init`: This installs the init script in `/etc/init.d`.

    - `make install-commandmode`: This installs and configures permissions on the
    directory for holding the external command file.

    - `make install-config`: This installs sample config files in `/usr/local/nagios/etc`.


    Next, we need to install the Apache configuration files to the directory specified
    in make files. Ensure that apache modules are also enabled.


    ```bash

    sudo make install-webconfs

    sudo a2enmod rewrite

    sudo a2enmod cgi

    ```


    Finally, create a user who will have permission to access the Nagios interface
    using the command:


    ```bash

    sudo htpasswd -c /usr/local/nagios/etc/htpasswd.users nagiosadmin

    ```


    To initialize Nagios on the Raspberry Pi, start by restarting apache and using
    the system to startup Nagios using the commands:


    ```bash

    sudo systemctl restart apache2

    sudo systemctl enable nagios

    sudo systemctl start nagios

    ```


    Finally, you can view Nagios using the web interface. `https://localhost/nagios`![](image_rsrc2WH.jpg)


    You can learn more on how to work with Nagios from the following resource: `https://www.nagios.org/documentation/`


    # PROJECT 10: Raspberry Pi TOR Router (Intermediates)


    Welcome to the 10th project of this book. In this project, we shall build a TOR
    router using the Raspberry Pi. This will allows us to connect all wireless traffic
    securely and anonymously.


    ## Requirements


    For this project, you will only require the following:


    - A Raspberry Pi

    - A Wireless dongle.

    - Bash scripting basics

    '
