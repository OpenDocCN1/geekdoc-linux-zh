    # 项目设置


    设置此项目需要一台运行最新版本 Raspbian OS 和 Home Assistant 的树莓派 4。在我们开始安装 HASS 软件之前，我们需要获取镜像。打开您的浏览器并导航到：[https://github.com/home-assistant/operating-system/releases/tag/4.18]


    Home Assistant 建议您在 Raspberry Pi 3 或 4 上使用该软件。一旦下载了 HASS 镜像，我们就可以将其烧录到 SD 卡中。对于此项目，我们将使用来自
    `Balena` 的 `Etcher`——请参考之前的章节。


    打开浏览器并导航到 etcher 官方网站下载该工具。[https://balena.io/etcher]。下载完成后，启动工具并将 SD 卡插入您的电脑。选择“Flash
    from File”（从文件烧录）并选择我们之前下载的 `Hass` 镜像。在目标（目标）部分选择 SD 卡并点击 flash（烧录）。


    我们建议将树莓派连接到线网络，因为我们没有涵盖如何使用 Home Assistant 在启动时初始化无线连接。


    现在我们可以启动 Home Assistant 软件了。执行此操作，请打开以下网页地址：`http://[IPADDRESS]:8123` 您需要从您的接入点获取
    IP 地址；在此会话中无法访问终端会话。


    启动后，软件将下载最新的可用版本并准备好一切。当软件首次启动后，刷新浏览器以查看更改。这将提示您创建一个账户。


    在下一个屏幕中，输入您的家庭名称。您可能还需要设置您的位置，或选择“detect”（检测）来自动选择位置。


    在下一个屏幕中，您将看到软件检测到的所有设备列表。


    恭喜喜，您已成功在树莓派上设置好了 Home Assistant 软件。请考虑以下资源以学习如何使用该工具。[https://www.home-assistant.io/getting-started/]


    # 项目 14：网络速度测试（中级）


    项目 14 涵盖了如何监控和保存您的网络速度。我们将导出数据并将其导入到 `Grafana` 等工具中。


    ## 要求

    对于此项目，我们将使用：

    * 树莓派

    * Speedtest-CLI

    * Python3


    ## 项目设置

    让我们开始设置项目并监控我们的网络速度。按照惯例，在任何安装之前，让我们使用以下命令更新系统：

    ```bash

    sudo apt-get update && sudo apt-get upgrade –y

    ```


    接下来，让我们安装将用于监控网络活动的 `Speedtest-CLI` python 库。

    ```bash

    sudo apt-get install speedtest-cli

    ```


    如果您在官方树莓派仓库中没有该包，请如下方命令所示使用 `pip`：

    ```bash

    sudo apt-get install python3-pip

    sudo pip3 install speedtest-cli

    ```


    您可以使用以下命令测试该工具：

    ```bash

    $ speedtest-cli --simplePing: 77.134 ms Download: 141.91 Mbit/s Upload: 14.85
    Mbit/s

    ```


    现在我们已经安装了 `Speedtest` 包，可以开始创建一个 python 脚本来持续记录我们的网络数据。从创建一个 python 文件开始并使用您喜欢的文本编辑器进行编辑。输入下方所示的代码。


    使用收集的数据，可以使用像 `Influx DB` 的工具导出数据并导入到 `Grafana` 等工具进行可视化。


    # 项目 15：树莓派上的 UFW 防火墙（中级）


    网络安全是一项关键功能，而防火墙是最好的网络安全工具之一。在这个项目中，我们将设置一个简单的防火墙工具（Uncomplicated Firewall，`UFW`）。在
    Linux 中设置防火墙，特别是使用 `iptables` 和 `Netfilter`，可能会变得异常复杂。为了采用更简单的方法，我们切换到 `UFW`。


    ## 要求

    此项目您只需要：

    * 树莓派


    ## 项目设置

    从更新树莓派包开始：

    ```bash

    sudo apt-get update && sudo apt-get upgrade

    ```


    接下来，安装 `ufw` 防火墙：

    ```bash

    sudo apt-get install ufw –y

    ```


    一旦安装了 `UFW`，您需要使用命令启用它：

    ```bash

    sudo ufw enable

    ```


    现在您可以开始添加防火墙规则了。关于文档和如何使用该工具，请参考以下资源。

    [https://wiki.ubuntu.com/UncomplicatedFirewall]

    [https://www.digitalocean.com/community/tutorials/ufw-essentials-common-firewall-rules-and-commands]


    # 项目 16：树莓派 TeamViewer（初级）


    在这个简单的项目中，我们将在树莓派上设置 `TeamViewer`。`TeamViewer` 是一个用于远程桌面共享的闭源软件。它对于远程诊断等情况非常有用。在这个项目中，我们将树莓派作为仅能接收连接的
    `TeamViewer` 服务器。您只能使用树莓派连接到服务器，而不能从服务器连接出去。


    ## 要求

    * 树莓派。


    ## 设置

    更新系统。

    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    ```


    下载包：

    ```bash

    wget [https://download.teamviewer.com/download/linux/teamviewer-host_armhf.deb]

    ```


    安装包：

    ```bash

    sudo dpkg –i teamviewer-host_armhf.deb

    ```


    修复安装：

    ```bash

    sudo apt --fix-broken install

    ```


    设置 TeamViewer 服务器密码：

    ```bash

    sudo teamviewer passwd <password>

    ```


    查看 TeamViewer 信息：

    ```bash

    teamviewer info

    ```


    完成后，您可以连接到您的树莓派 TeamViewer 服务器。


    # 项目 17：PI Hole 广告拦截器（中级）


    在这个快速的项目中，我们将使用 `Pi-Hole` 工具创建一个广告拦截器。`Pi-Hole` 是一个使用 `DNS` 拦截广告和不良内容的简单合一工具。


    `Pi-Hole` 的一些显著特性是：

    * **免费**：`Pi-Hole` 是免费开源的，源代码托管在 `GitHub` 上。

    * **现代**：它可以拦截在 `IPv4` 和 `IPv6` 上提供的所有不良内容。

    * **响应迅速**：通过缓存 `DNS` 查询，`Pi-Hole` 可以加速您的日常浏览活动。

    * **可扩展**：`Pi-Hole` 工具具有高度可扩展性，单个设备即可处理成千上万次查询。

    * **轻量级**：该工具简单且快速。运行它不需要强大的硬件。使用像树莓派这样简单又强大的设备，`Pi-Hole` 可以无缝工作。

    * **健壮**：它同时提供 `Web` 和 `CUI` 界面，这对于可视化和控制非常有用。

    * **直观**：`Pi-Hole` Web 界面带有亮眼且组织良好的仪表板，非常直观。

    * **多功能**：`Pi-Hole` 可以兼作 `DNS` 广告拦截工具和确保设备保护的 `HDCP` 服务器。


    '
- fmt: '

    # Simple and Quick Installation


    For quick and simple installation, use the command:

    ```bash

    curl -sSL https://install.pi-hole.net | bash

    ```

    Learn more here: [https://github.com/pi-hole/pi-hole](https://github.com/pi-hole/pi-hole)


    # PROJECT 18: VPN SERVER PiVPN (Beginners)


    Do you need a simple VPN on your Raspberry Pi? The following project shows you
    how to do this using `PiVPN`. This is a quick and simple project using a single
    command as shown:


    ### Installation command

    ```bash

    curl -L https://install.pivpn.io | bash

    ```

    Learn more from; [https://www.pivpn.io/](https://www.pivpn.io/)


    # PROJECT 19: DietPi (Intermediate)


    Throughout the book, we have installed, used, and even updated the default Raspbian
    OS. However, like any other computer, we can install another OS on the Raspberry
    Pi. In this tutorial, we shall discuss how to install `DietPi` OS.


    `DietPi` is a simple, powerful, and lightweight OS for Raspberry Pi. It is very
    effective when you want a better and faster OS for your PI. Although based on
    `Debian`, it is lighter than Raspbian.


    `DietPi` is lightweight with an approximate size of 400 MB after installation.
    For comparison, that’s three times smaller than `Raspbian Lite`. It also comes
    prepackaged with `DietPi` software, which allows you to install essential software
    for your device, such as `Node-RED`, `Kodi`, etc.


    ### Requirements

    For this, you require:

    * Raspberry Pi

    * SD Card (At least 8GB)

    * USB Keyboard

    * HDMI Cable

    * Monitor

    * DietPi Image

    * Etcher


    ### Setting Up your Project

    Start by downloading the `DietPi` image from the following resource. [https://dietpi.com/](https://dietpi.com/)![](image_rsrc2X6.jpg)


    Next, download `Balena Etcher` from [https://balena.io/etcher](https://balena.io/etcher)
    and flash the image as we have done in previous sections.


    Next, connect all your peripherals and boot up your Raspberry pi. Login with username
    `root` and password `dietpi`. Ensure you are connected to a network as `DietPi`
    will update all the packages upon boot. Learn more about `DietPi` from the resource
    [https://dietpi.com/docs/](https://dietpi.com/docs/)


    # PROJECT 20: TensorFlow (Intermediates)


    For machine learning, artificial intelligence, or neural network geeks, we have
    not disregarded you. In this project, we shall set up `TensorFlow`, an ML library
    developed by `Google`.


    `TensorFlow` is a powerful and essential tool for machine learning but setting
    it up on Windows is not very easy. You may require a server or a Linux installation
    for this, which is why the Pi is such a lifesaver when it comes to running this.


    ### Requirements

    For this project, you will need the following tools:

    * Raspberry Pi

    * Working Internet


    ### Installing TensorFlow on Raspberry Pi

    Before installing `TensorFlow` on Raspberry Pi, update the Raspberry Pi.

    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    ```

    Next, we need to install the `libatlas` package to allow support for `NumPy`.

    ```bash

    sudo apt install libatlas-base-dev

    ```

    Once completed, install `TensorFlow` using `pip` as:

    ```bash

    pip3 install tensorflow

    ```

    ![](image_rsrc2X7.jpg)


    # PROJECT 21: Android On Raspberry Pi (Intermediates)


    In this project, we will turn a standard Raspberry Pi into an android device using
    `EmteriaOS`. Although `EmteriaOS` has a closed-source, proprietary software, it
    includes a free version that you can use. `EmteriaOS` is a customized android
    based on `RTAndroid` and built for Raspberry Pi.


    ### Requirements

    In this project, you are going to need the following tools and resources:

    * Raspberry Pi

    * Basic Peripherals

    * EmteriaOS image


    ### Setting up the project

    Before flashing the OS to the SD card, you need to download the installer from
    [https://emteria.com](https://emteria.com). You may have to register before downloading
    the required files.


    Log in and navigate to download. Select the installer for your system, launch
    the installer, and log in using your `EmteriaOS` details.


    In the next window, select the Raspberry device you wish to use as an android
    device. Next, select the SD card to flash the image. That will begin the `EmteriaOS`
    download and flash process.


    Please wait for the process to complete and safely eject your SD card and insert
    it into your Raspberry Pi. Boot up the pi to launch the installer. This process
    may take a while.


    Finally, follow the installer prompts and finish setting up your system. Once
    inside the OS, you can install apps by sideloading.


    # PROJECT 22: Windows 10 IoT Core (Intermediates)


    `IoT` is one of the technologies that has seen significant improvement and growth.
    Large companies have developed tools to help with this amazing and new technology.
    Microsoft is one of those companies that has developed the Microsoft IoT core.


    `Windows IoT Core` is a small and customized version of Windows 10 that developers
    can use to build IoT devices. It is a very handy way to build small projects to
    large and enterprise IoT projects. `IoT core` can run on `ARM` and `x86/x64`.
    You can learn more from the official IoT core documentation.[https://developer.microsoft.com/en-us/windows/iot](https://developer.microsoft.com/en-us/windows/iot)


    ### Requirements

    * Raspberry Pi

    * SD card

    * Basic Peripherals


    ### Setting up IoT Core

    Before installing `Windows IoT Core` to the Raspberry Pi, you need to download
    the setup dashboard from the following link. [http://go.microsoft.com/fwlink/?LinkID=708576](http://go.microsoft.com/fwlink/?LinkID=708576)


    Once downloaded, launch the executable. The installation process may take a few
    minutes.![](image_rsrc2X.jpg)


    Having set up the dashboard, we can set up a new device. Click on “Setup new device”.![](image_rsrc2Y.jpg)


    Next, connect the SD card to the device. Under device type, select `Raspberry
    Pi`. Next, choose the SD card and set a hostname for your device. Finish that
    section by providing an admin password.![](image_rsrc2Z.jpg)


    Wait until the flash process completes and eject your SD card. Insert it to your
    pi and boot up. It will take a few minutes to boot up and set up Windows.Follow
    the installer guide and finish the installation.


    Once the Pi is up and running, connect it to the same network as your pc and Open
    device. In the browser, enter the credentials you set earlier.


    # PROJECT 23: Minecraft Server (Intermediates)


    `Minecraft` is probably one of the most popular and addictive games of our time.
    In this project, we will set up a `Minecraft` server that you can use to create
    unique environments. Normally, you would need a powerful device to host a server,
    but with a Pi, you can create it in a matter of minutes and share it with friends
    for a fascinating time.


    ### Requirements

    * Raspberry Pi

    * Network connectivity


    ### Setting Up the Project

    Before we begin, ensure to update the pi:

    ```bash

    sudo apt-get update && sudo apt-get -y upgrade

    ```

    Next, ensure you have `Java` installed and running using the command:`java --version`


    Now, create a folder that you shall use to host the `Minecraft` server.

    ```bash

    mkdir minecraft & cd minecraft

    ```

    Download BuildTools.wget[![](image_rsrc2X.jpg)](https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar)


    Now, compile the `BuildTools` package you downloaded.

    ```bash

    java -jar BuildTools.jar

    ```

    Once completed, launch the server using the command:

    ```bash

    java -Xms#G -Xmx#G -XX:+UseG1GC -jar spigot.jar nogui

    ```

    Now you can connect the `Minecraft` server using the Raspberry Pi’s IP address.
    Learn more about the server from the resource below.[https://www.spigotmc.org/](https://www.spigotmc.org/)


    # PROJECT 24: Raspberry Pi Honeypot (Advanced)


    Do you have attackers trying to attack your network now and then? In this project,
    we will `HoneyPi` to set up a `Honeypot` that will drive them crazy. A `honeypot`
    is a system reserved in a specified network to attract potential attackers and
    log their information. We shall use `HoneyPi` for this because of its power and
    ease of use.

