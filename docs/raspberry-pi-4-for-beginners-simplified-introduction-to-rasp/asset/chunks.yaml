    - The 40 Pin General Purpose Input/output (`GPIO`) header connects projects with
    electric devices. You can access them directly on the Raspberry Pi.


    NOTE: It’s possible to turn some of the Pins on or off while your Pi is still
    running—or in operation.


    - **PoE Header**: Power Over Ethernet (`PoE`) allows the device, once networked,
    to be automatically turned on/off at specific times. Raspberry Pi 4 features the
    4-PIN header that supports the `PoE HAT` released on the previous model of Raspberry
    Pi 3B+.


    - **Gigabit Ethernet**: The Gigabit Ethernet hard-built into the Raspberry Pi
    4 features a bandwidth speed of over 350MBps. Although this may not be as powerful
    as the regular desktop, it is a significant improvement over the Pi 3B+ that featured
    the gigabit Ethernet over `USB 2.0` at 300Mbps. The Ethernet improvements add
    to the Raspberry Pi 4 feature-rich arsenal.


    - **USB**: The Raspberry Pi 4 has 4 `USB` ports. 2 `USB 2.o` ports, and 2 `USB
    3.o` ports indicated by blue connectors. Since the Raspberry Pi 4 features built-in
    Wireless and Bluetooth, the possibility of requiring more ports is minimal since
    the required peripherals are a keyboard, mouse, and should you choose to add one,
    a webcam.


    - **4-pole stereo audio/video jack**: The Raspberry Pi 4 has a 4-pole stereo audio
    and composite video port used to connect headphones or external speakers.


    - **2-Lane MIPI CSI Camera Port**: The Mobile Industry Processor Interface (`MIPI`)
    Camera Serial Interface gives you the ability to attach an official Raspberry
    Pi Camera Module to the motherboard directly.


    - **2-Micro HDMI Ports**: The Raspberry Pi 4 also has 2 `micro HDMI` ports that
    allow you to connect the Raspberry Pi to Modern Monitors. The ports support both
    audio and video with `4kp60` or `4K` resolution support. These two `Micro HDMI`
    ports have replaced the full-sized `HDMI` port in the previous generations.


    - **USB-C Power Port 5V/3A**: The Raspberry Pi 4 has a standard `USB` Power supply
    that powers the Raspberry Pi. The Raspberry Pi Foundation recommends using the
    Raspberry Pi’s official power supply to avoid voltage and power issues that may
    damage the device. Like most single board computers, the Raspberry Pi supports
    `5v` or `3 Amperes` power input. The Power supply used by the Raspberry Pi 4 has
    changed to `USB-C` from a `Micro USB` jack available in previous models.


    - **2-Lane MIDI DSI display ports**: The MIDI Display Interface port allows you
    to connect a display directly to the Raspberry Pi.


    - **Micro SD Slot**: Like older Pis, the Raspberry Pi 4 has an `SD Card` slot
    that acts as the hard drive for the board.


    - **2.4/5GHzWireless and Bluetooth 5.0**: The Raspberry Pi 4 has dual-band `2.4`
    and `5.0 GHz` IEEE `802.1/*` wireless connectivity and a Bluetooth `5.0` and `LE`.
    The wireless connectivity update makes the Pi 4 better than older models—in terms
    of connectivity.


    The above are the essential Raspberry Pi 4 features you should know.


    # Raspberry Pi 400


    The Raspberry Pi 400 is an improvement of the Raspberry Pi 4. It features components
    that are very similar to those on the Raspberry Pi 4. The difference however is
    that everything is nicely packed inside a keyboard layout. The Raspberry Pi 400
    is powerful and developed to protect the internal components and keep the desk
    tidier and the cables clear.


    ![](image_rsrc2T1.jpg)


    The Pi 400 has components such as the system-on-chip and `n` memory inside a closed
    keyboard casing, which differs from the regular Raspberry Pi 4. At the back of
    the Raspberry Pi 4, it features all required ports and the `GPIO` header, which
    we will discuss in upcoming chapters. Next to the `GPIO` header is the `microSD`
    card slot. This stores the `microSD card` that the Raspberry Pi 400 uses to store
    the operating system, applications, and other data.


    The `microSD card` comes pre-installed in Raspberry Pi 400; you can remove it
    by pushing gently on the card until it clicks and springs out, then pull it out.
    When you put the card back in, make sure the shiny metal contacts are facing downwards;
    the card should slide in with a gentle click.


    The next two ports are the `micro-HDMI` ports used for connection to a monitor,
    TV, or any other display. Like the Raspberry Pi 4, the Raspberry Pi 400 supports
    up to two displays. Next to these is the `USB Type-C` power port used to connect
    the Raspberry Pi 400 Power Supply or compatible `USB` power supply.


    The two blue ports are `USB 3.0` ports, providing a high-speed connection to devices,
    including solid-state drives (`SSDs`), memory sticks, printers, and more. The
    white port to the right of these is a lower-speed `USB 2.0` port, to which you
    can connect the bundled Raspberry Pi Mouse.


    The final port is a `Gigabit Ethernet` network port that allows you to connect
    the Raspberry Pi 400 to your network using a network cable as an alternative to
    using the built-in `Wi-Fi` wireless networking.


    ![](image_rsrc2T2.jpg)


    In a nutshell, the Raspberry Pi 400 packs the following components and features:


    ![](image_rsrc2T3.jpg)

    ![](image_rsrc2T4.jpg)


    # Section 2: Setting Up Your Raspberry Pi 4


    This section shall cover everything you need for the Raspberry Pi and the basics
    of connecting them to get the device up and running.


    ![](image_rsrc2T5.jpg)


    By design, Raspberry devices innately offer an easy and comfortable setup process
    for anyone. However, like any computer, running this single-board computer requires
    you to attach various peripherals. To avoid any hustles and avoid compatibility
    issues when setting up the device, consider the Raspberry Pi official kit packed
    with everything you will need the Raspberry Pi:[https://www.canakit.com/raspberry-pi-400-desktop-computer.html](https://www.canakit.com/raspberry-pi-400-desktop-computer.html).
    For the Raspberry Pi 4, consider the Raspberry Pi Starter kit to get started.
    However, hardware and circuit enthusiasts should consider the ultimate or extreme
    kits:[https://www.canakit.com/raspberry-pi-400-desktop-computer.html](https://www.canakit.com/raspberry-pi-400-desktop-computer.html),
    [https://www.canakit.com/raspberry-pi-4-ultimate-kit](https://www.canakit.com/raspberry-pi-4-ultimate-kit),
    or [https://www.canakit.com/raspberry-pi-4-extreme-aluminum-case-kit](https://www.canakit.com/raspberry-pi-4-extreme-aluminum-case-kit).


    Once you purchase either of the above kits, all you need is a computer monitor
    or a TV that supports `HDMI` connections. `HDMI` is common because many devices,
    including gaming consoles, set-top boxes, Blu-ray players, etc., use it.


    However, you may have a bare Raspberry Pi, in which case you will require the
    following peripherals:


    - **USB Power Supply**: You will require a `5 Volts USB Type-C` connector power
    supply rated `3 amperes (3A)`. It is best to use the official Raspberry Pi power
    supply since it can handle the Raspberry Pi’s power consumption demands.


    ![](image_rsrc2T6.jpg) ![](image_rsrc2T7.jpg)


    - **MicroSD Card**: The next thing you require is a `microSD`; this will store
    both the Operating system and act as the storage device for your files when working
    with the Raspberry Pi. If all you want is a basic setup, you can start with an
    `8GB`. However, a higher capacity is best to allow room to store more files.


    ![](image_rsrc2T8.jpg)


    - **USB Keyboard and Mouse**: To control your Raspberry Pi, you will require a
    keyboard and mouse. Consider buying an official one from the Raspberry Pi Foundation.
    Keyboards such as gaming keyboards with flashy RGB colors may draw too much power,
    which the Raspberry Pi may not handle.


    ![](image_rsrc2T9.jpg)

