    \    - 入门\n    - 环境要求\n    - 了解树莓派\n    - 树莓派原理引导之旅\n        - 硬件配置\n        -\
    \ 树莓派 4 的硬件特性\n        - 树莓派 400\n- 第 2 部分\n    - 设置你的树莓派 4\n    - 安装和设置树莓派 4\
    \ 硬件\n    - 设置树莓派 400\n- 第 3 部分\n    - 使用树莓派 4\n    - 在 Mac & Windows 上设置 NOOBS\
    \ 软件\n    - 在 Linux 上安装 NOOBS\n- 第 4 部分\n    - 安装 Raspbian OS\n    - 如何使用 Balena\
    \ Etcher 安装自定义镜像\n- 第 5 部分\n    - 设置配置文件\n        - 配置设置\n        - 内存配置编辑\n \
    \       - 摄像头模块配置编辑\n        - 视频/显示配置编辑\n        - 网络配置编辑\n        - 启动配置编辑\n\
    - 第 6 部分\n    - 连接树莓派\n    - 设置静态 IP\n- 第 7 部分\n    - 远程访问树莓派\n        - 如何通过\
    \ VNC 远程连接树莓派\n        - 如何通过 SSH 远程连接树莓派\n- 第 8 部分\n    - 在树莓派上编程\n        -\
    \ 树莓派上的 Python 3\n        - C/C++ 环境搭建\n- 第 9 部分\n    - 介绍 GPIO 引脚\n        -\
    \ 电子元件\n        - 使用 C/C++ 编程 GPIO：标准内核接口\n        - 使用 Python 编程 GPIO\n- 第 10\
    \ 部分\n    - [26 个创新的树莓派 4 项目]\n    - 项目 1：LED 闪烁（入门级）\n    - 项目 2：LCD 字符显示（中级）\n\
    \    - 项目 3：简单气象站（入门级）\n    - 项目 4：带电位器的 4 灯开关（中级）\n    - 项目 5：烟雾与气体检测器（专家级）\n\
    \    - 项目 6：家庭监控摄像头（入门）\n    - 项目 7：Telegram 机器人（入门级）\n    - 项目 8：LAMP 和 WordPress（入门级）\n\
    \    - 项目 9：Nagios 网络监控（入门级）\n    - 项目 10：树莓派路由器（中级）\n    - 项目 11：Twitter 机器人（中级）\n\
    \    - 项目 12：Python 加密工具（入门级）\n    - 项目 13：树莓派 Home Assistant（专家级）\n    - 项目 14：网络速度测试（中级）\n\
    \    - 项目 15：树莓派上的 UFW 防火墙（中级）\n    - 项目 16：树莓派 TeamViewer（入门级）\n    - 项目 17：Pi\
    \ Hole 广告拦截（中级）\n    - 项目 18：VPN 服务器（入门）\n    - 项目 19：DietPi（入门）\n    - 项目 20：TensorFlow（中级）\n\
    \    - 项目 21：树莓派上的 Android（中级）\n    - 项目 22：树莓派 Windows 10 IoT（中级）\n    - 项目 23：Minecraft\
    \ 服务器（中级）\n    - 项目 24：树莓派蜜罐（专家级）\n    - 项目 25：在树莓派上安装 CentOS（入门）\n    - 项目 26：Web\
    \ 服务的设置（入门级）\n    - 结论\n\n## 第 1 部分：入门\n\n在全书中，我将使用各种约定，例如使用不同的代码样式和添加图标来增强书籍内容。此外，请确保阅读书中提供的任何警告或注意事项，以免伤害自己或设备。\n\
    \n### 环境要求\n\n对于第一部分的大部分，你只需要一台树莓派设备。我建议购买 `树莓派 4` 或 `树莓派 400`。由于这些是树莓派系列中的最新型号，它们为开发简单和复杂的项目提供了广泛的功能。为了简单起见，可以考虑购买套件。虽然这不是你完成所有项目所需的全部，但它将帮助你入门并进入状态。\n\
    \n### 了解树莓派\n\n树莓派设备是一个微小的、单板但卓越的全功能，旨在弥合成本与功能之间的差距。无论你是想要一台普通的电脑、编写复杂的程序，还是尝试工程和物理设备，树莓派都能满足需求。\n\
    \n树莓派设备是单板电脑。这意味着它像任何台式机一样完整，只是打印在单块板上。树莓派的大小与其性能并不成正比。例如，树莓派的现代版本可以和某些台式电脑并肩。自\
    \ 2012 年首次发布以来，从工程师到公司高管的广泛人群都获得了树莓派并学会了使用。树莓派驱动了从自动船只到太空设备的伟大项目。树莓派（显然）是一个强大的工具。\n\
    \n从最初与 Broad 通合作的树莓派 B 型开始，树莓派基金会发布了多种型号。每个型号都为特定的用例添加了新功能和改进的规格。例如树莓派 Zero 是全尺寸树莓派的微型版本，带有网络和\
    \ USB 端口等惊人功能，这一切为了更小的尺寸、低功耗和兼容性。\n\n兼容性是所有树莓派型号的关键特性。为特定型号开发的软件也可以在其他型号上运行。你可以在第一代树莓派型号上安装最新版本的\
    \ Raspbian OS。你将牺牲一些性能，但它会成功运行。随着我们的进展和学习树莓派，我将坚持使用最新型号 `树莓派 4 Model B` 和 `树莓派\
    \ 400`。然而，你在书中学到的知识是准确的，并适用于其他树莓派型号。书中讨论的项目也与任何树莓派型号兼容，你可以在拥有的任何树莓派设备上享受乐趣并学习。\n\
    \n### 树莓派原理引导之旅\n\n即使树莓派设备功能强大且有名，如果不了解它的各种组件，我们也无法很好地使用它。在本节中，我们将讨论有关树莓派硬件的所有内容。与典型的台式机或笔记本不同，树莓派暴露了所有内部组件供你玩和探索。这种“暴露”是树莓派如此著名的原因之一。虽然你可以购买外壳来保护设备，但在处理物理元件和电路时，最好让它暴露在外。\n\
    \n![](img/image_rsrc2SY.jpg)\n\n以下是 `树莓派 4 model B` 的一些组件——从俯视角度显示。为了避免（此处原文逻辑中断）：\n\
    \n### 硬件配置\n\n树莓派的一个关键功能是其灵活性。注意：随着树莓派的发展，每个树莓派型号具有这些功能来驱动。\n\n![](img/image_rsrc2SZ.jpg)\n\
    \n一个树莓派 4 主板功能\n\n这些功能的目的如下：\n\n"
