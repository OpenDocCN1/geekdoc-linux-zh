    # 项目 6：家庭监控摄像头（初级）


    又是另一个项目了。在这个项目中，我们将构建一个家庭监控系统，允许你将周围区域的实时流传输到 Web 界面。使用你的浏览器，你可以从连接到 `pi` 相同网络的任何设备访问视频流。这个项目将非常有趣！


    ## 要求


    对于这个项目，你需要少量组件。它们包括：


    *   一个 `Raspberry Pi`

    *   一个 `Raspberry Pi` 摄像头模块。


    ## 构建项目


    这个项目不需要很多接线。你只需要连接 `Raspberry Pi` 摄像头模块并启用它。如果你熟悉如何操作，请随时跳到下一节。


