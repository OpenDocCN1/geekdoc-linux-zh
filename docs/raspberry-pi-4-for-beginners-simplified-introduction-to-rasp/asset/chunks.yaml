    # Quick Recap: LEDs & Resistors


    As stated in a previous section, LED devices come in various sizes, shapes, colors,
    and voltage requirements. Some LED devices are capable of mixing colors in a single
    device. For this project, any `5mm` LED device will work. LED devices have a diode
    that emits light when an electric current runs through them.


    Electrical diodes have polarity—means they are capable of allowing electric current
    to flow in one direction only, often from positive to negative. The positive point
    is an `anode`, and the negative point is a `cathode`. You can identify a point
    of the diode by looking at its leg, as shown below. The longer lead represents
    the positive lead, `anode` (+), while the shorter lead shows the negative lead,
    `cathode` (–).


    ![](image_rsrc2UG.jpg)


    LED devices cannot regulate current automatically. Hence, if you pass more current
    to the device, it will damage the device or possibly the Raspberry Pi. Therefore,
    you’re better off always connecting an LED to a series of resistors. The type
    of resistor you should connect your LED to will depend on the maximum value your
    LED can handle. Most LEDs can handle up to a maximum of `20 mA`. However, check
    your device’s max value. I will not spend a lot of time on Resistors and how they
    work. Refer to the following resources to learn more: [https://linkfy.to/37zcR](https://linkfy.to/37zcR)
    [https://linkfy.to/XPaue](https://linkfy.to/XPaue)


    For this project, a resistor with a value between `200 Ω` and `400 Ω` will work
    fine. Mostly, it will be a brown and green resistor.


    ## Building the Project


    Let us begin building our circuit and light an LED device. **NOTE**: The projects
    in the book use a solderless breadboard to remove the hustle of connecting wireless
    and minimize errors. We recommend doing the same.


    Let us learn how to connect the LED device to the Raspberry Pi using the following
    simple steps:


    *   Start by connecting a blue breadboard bar to a Raspberry Pi’s `GND` pinouts.
    Refer to the `GPIO` manual above.

    *   The next step is to connect the LED to the breadboard.

    *   Now connect the resistor into the breadboard such that one point of the resistor
    connects to the longer positive lead of the LED device (`anode`). The other point
    of the resistor should connect to `GPIO pin 22` using a jumper cable.

    *   Finally, connect the LED negative lead (`cathode`) to the `GND` power bar.


    You can connect the resistor to either the positive lead or the negative lead
    as long it is connected.


    ![](image_rsrc2UH.jpg)


    ## Scripting the Project


    Now, we shall create a Python script to control how the LED lights up. By now,
    you should have experimented with the `PIXEL` desktop environment and can easily
    navigate it. Open the File Manager and create a folder called `Pi.Projects` where
    we shall store all the projects we work on in the book.


    Now let us discuss the logic we are using to control our LED device. The LED turns
    on for a specified number of seconds and then turns off for a specified number
    of seconds. The process loops this pattern until we set a condition to stop.


    Now, how do we light the LED? We know that we need to set to `HIGH` the `GPIO`
    pin we have used to connect our LED. We can then apply the reverse to turn off
    the LED. Hence, set `PIN 22` High and Low.


    ![](image_rsrc2UJ.jpg)


    As you recall, we shall use the `gpiozero` library to control the device in Python.
    The python script is as follows:


    ```

    ![](image_rsrc2UK.jpg)

    ```


    Save the script as `led.py` and enter the terminal. Navigate to the directory
    where you saved the script and run it using the command `python3 led.py`.


    Boom! You should see the LED turn on for 4 seconds and turn off for 4 seconds,
    and that concludes your first project.


    # PROJECT 2: LCD Character Display (Intermediate Level)


    Welcome to the second project in the book. This project focuses on showing you
    how to connect and program a character LCD device to display messages. We will
    start by working with static text and then scrolling text for longer texts. Let
    us get started.


    ### Requirements


    For this project, you will require the following:


    *   A Raspberry Pi.

    *   Jumper Cables

    *   A `10 kΩ` Potentiometer


    ![](image_rsrc2UM.jpg)


    *   Solderless breadboard

    *   Standard LCD `16x2` from [Adafruit](https://www.adafruit.com/).

    *   Soldering iron and `5 cm` solder wire


    ![](image_rsrc2UN.jpg)


    *   CircuitPython or `Adafruit_CharLCD` library


    ### Understanding LCD Displays


    Before we begin building and coding our project, let’s take a moment to talk through
    what we shall be doing and how it works. Let us begin with LCDs. Liquid Crystal
    Displays or `LCD` are the simplest and most common types of displays around. You
    will find them in many electronic devices such as calculators, vending machines,
    printers, vintage mobile phones, etc. They are very suitable for displaying small
    texts and drawings.


    LCDs classification depends on the respective number of rows and columns of characters
    that can fit on a single screen. For example, a `16x2` LCD can fit 2 rows and
    16 characters. LCD character displays can also differ in background colors, including
    RGB displays. For this project, you can use any LCD compatible with the Raspberry
    Pi.


    However, we recommend purchasing one from Adafruit as they develop the library
    we shall use.


    ### Soldering the LCD Headers


    In most cases, if you purchase an LCD, you will require to solder the header pins
    to the display, as shown above. All you need to do is align it, place it into
    place with the long end facing down, then solder it.


    ### LCD Module Pinouts


    The LCD’s module pins displays from left to right and have 16 pin.


    | PIN |

    | :--- |

    | 1 | VSS |

    | 2 | VDD |

    | 3 | v0 |

    | 4 | RS |

    | 5 | |

    | 6 | 7-14 |

    | 15 | LEDA |

    | 16 | LEDK |


    The `VSS` pin attaches to `GND`, while the `VDD` pin is a power pin that should
    connect to `5` or `3.3 V` according to your LCD. Most LCD devices are rated `5V`.
    The `v0` functions as an adjust pin to regulate contrast between characters and
    the LCD backlight when connected to the potentiometer. Pin `E`, `R/W`, and `RS`
    are control pins. Pin `7` to `14` are data pins used for sending information,
    and `15` and `16` are positive and negative pins for the LCD backlight.


    For this project, you only need 6 pins to connect to the Raspberry. In previous
    sections, we mentioned that the `GPIO` connectors for the Raspberry work with
    `3.3 V`, while you may find the LCD rated `5V`. That should not cause any alarms.
    Since we are only sending data from the pi to the screen, not reading data from
    screen to pi, this should not be an issue. That means you should connect the `R/W`
    pin to the ground, as this will only allow you to read rather than write data.


    ![](image_rsrc2UP.jpg) If you are using an LCD character display rated at `5v`,
    DO NOT connect the `R/W` pin because it sends data at5V, which will damage your
    Raspberry Pi.


    ### Building the Project


    Now that we have understood what and how LCD works, we can move on and focus on
    building the actual project. Ensure you have your LCD ready to use and all the
    pins soldered correctly.


    *   Start by connecting the breadboard power pins to `5V` and `Ground` pins.

    *   Next, connect the `5v` from the breadboard to the LCD `VDD` pin and `LEDA`
    pin.

    *   Now connect the LCD `VSS` pin, `R/W` pin, and `LEDK` pin to breadboard `GND`
    pins.

    *   Finally, connect the potentiometer using one of the potentiometer’s outer
    lead to the breadboard’s `GND` pins, and the other outer lead to `5V`, and finally
    connect the middle lead to `V0`.


    Connect the `GPIO` pins as shown in the table below.


    | LCD | Raspberry PI GPIO |

    | :--- | :--- |

    | 4 (RS) | `GPIO 26` |

    | 6 (E) | `GPIO 19` |

    | 11 (DB4) | `GPIO 27` |

    | 12 (DB5) | `GPIO 22` |

    | 13 (DB6) | `GPIO 24` |

    | 14 (DB7) | `GPIO 25` |

