    * `vcgencmd get_config <config>` : We use this command to display a specific configuration
    value in the file.

    * `vcgencmd get_config int` : We use this command to list all the true—– meaning
    non-zero—integer configuration options.

    * `vcgencmd get_config str` : We use this command to list all true—meaning non-null—string
    configuration options.


    You can view most of the configuration settings by using the `vcgencmd` command.
    Other commands are unavailable when you use this command.


    ## Configuration Settings

    Here, we shall discuss some of the necessary configurations edits you can tweak
    to make the Raspberry Pi more functional depending on your needs. The configuration
    settings fall into various categories such as Memory, Camera, Video/Display, Networking,
    Boot, Overclocking, and Audio. However, in this book, we shall only discuss some
    of them to illustrate how to edit the configuration. Feel free to read the Raspberry
    Pi configuration documentation to learn more. [https://www.raspberrypi.org/documentation/configuration/](https://www.raspberrypi.org/documentation/configuration/)


    ## Memory Configuration Edits

    These are the most useful memory configuration edits for the Raspberry Pi. For
    newer models of the Raspberry Pi, uncomment the disabled entries by removing the
    `#` sign.


    * `disable_l2cache`: This disables or enables ARM access to the GPU cache in the
    Raspberry Pi. We enable it by setting the value to `1`; it requires a corresponding
    L2 disabled kernel. The default value may differ on various models, such as those
    with standalone L2 cache.

    * `gpu_mem`: Refers to the memory available from the GPU of the Raspberry Pi,
    including VPU, HVS, and other Legacy Codecs. We use this edit to set the memory
    split between the ARM and GPU of the Raspberry Pi. By default, the GPU memory
    is in megabytes. To avoid performance issues, always allocate the lowest possible
    value to allow the Linux system as much memory allocation as possible.

    * `gpu_mem_256`: This is the GPU memory in Megabytes for the 256MB for the Raspberry
    Pi. The 512 MB Raspberry Pi usually ignores it, and the configuration overrides
    the `gpu_mem`. The max value for this entry is 192; by default, it does not have
    a set value.

    * `gpu_mem_512`: This configuration sets the GPU memory in megabytes for the 512
    MB Raspberry Pi. The configuration becomes redundant and ignored if the memory
    size of the Raspberry Pi is not 512 MB. Likewise, it overrides the `gpu_mem` entry
    with a maximum value of 448 MB; the default value is unset.

    * `gpu_mem_1024`: We use this to set the GPU memory in Megabytes for the Raspberry
    Pi devices with 1024 MB of memory or more. If the memory of the Raspberry Pi is
    less than 1024 MB, the configuration is redundant and ignored. The `gpu_mem_1024`
    has a maximum value of 944 MB with no default value set.


    ## Camera Module Configuration Edits

    Below are some of the Raspberry Pi camera module configuration settings. The camera
    module for the Raspberry Pi appears below:

    ![](image_rsrc2TZ.jpg)


    * `start_x`: We use this to enable the attached camera module in the raspberry
    pi.

    * `gpu_mem`: We use this configuration to set the minimum GPU memory for the Camera
    module.

    * `disable_camera_led`: This configuration setting disables the camera LED from
    turning on when recording video or taking a picture.


    ## Video/Display Configuration Edits

    Here are the most common video configuration edits relating to video and display
    options for the Raspberry Pi. Once again, for the latest model of the Raspberry
    Pi, uncomment the entries to enable them. NOTE: Because the Raspberry Pi 4, 4B,
    and 400 have 4K support, some options may be unavailable in various models.


    * `sdtv_mode`: This configuration defines the TV standard for composite video
    output. We set each mode by using integral values: `0`, `1`, `2`, `3`, `16`, and
    `18`, each representing: Normal NTSC, Japanese Version NTSC, Normal PAL, Brazillian
    PAL, Progressive scan NTSC, Progressive scan PAL, respectively.

    * `sdtv_disable_colorbust`: This configuration enables or disables color bust
    on the composite video output. Once you set the value to `1`, it disables color
    outburst; hence, the picture appears sharper in monochrome.

    * `sdtv_aspect`: This configuration defines the aspect ratio for the composite
    video output. The default integral value `1` represents the ratio 4:3. The integral
    value `2` represents the aspect ratio of 14:9, and the integral value `3` represents
    the aspect ratio of 16:9.

    * `enable_tvout`: This configuration enables composite output. Only the Raspberry
    Pi 4 supports this, which by default, disables composite output.


    The Raspberry has very many Video and Display options that we cannot discuss here
    in their entirety. For more options, check the Raspberry Pi documentation that
    you can find on the resource page below: [https://raspberrypi.org/documentation/configuration/config-txt/video.md](https://raspberrypi.org/documentation/config-txt/video.md)


    ## Network Configuration Edits

    ![](image_rsrc2U0.jpg)

    The Network configuration is not very popular, and the Raspberry Pi documentation
    may not have it. The following is the most common network configuration edit.


    * `smsc95xx.macaddr`: We use this to configure the `smsc95xx` driver to use a
    random mac address on each boot instead of the default mac address.


    ## Boot Configuration Edits

    Here are the boot configuration edits for the Raspberry Pi. As usual, for newer
    models of the Raspberry Pi, uncomment the required entries by removing the `#`
    sign.


    * `disable_commandline_tags`: We use this configuration to stop the `start.elf`
    from filling in ATAGS before kernel launch. The ATAGS is the memory before `0x100`.

    * `Kernel`: We use this to set an alternative name while loading the kernel. The
    default name is `kernel.img`, `kernel7.img`, `kernel7l.img`, and is of type string.

    * `Cmdline`: Used to set the command line parameters that can be used instead
    of `cmdline` text file.

    * `disable_splash`: Used to enable or disable a splash screen on boot.

