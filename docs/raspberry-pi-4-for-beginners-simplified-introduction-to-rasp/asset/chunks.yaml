    - Micro-HDMI cable: This carries sound and images from the Raspberry Pi to your
    TV or monitor. One end of the cable has a micro-HDMI connector for Raspberry Pi,
    while the other is a full-size HDMI connector for your display. You can also use
    a micro-HDMI to HDMI adapter and a standard, full-size HDMI cable. If you have
    a monitor that doesn’t have an HDMI socket, you can buy micro-HDMI to DVI-D, DisplayPort,
    or VGA adapters. To connect to an older TV that uses composite video or has a
    SCART socket, use a 3.5 mm tip‑ ring-ring-sleeve (TRRS) audio/video cable.


    ![](image_rsrc2TA.jpg)


    You may also need to purchase a Raspberry pi case. Although the device is safe
    to use without a case, as long as you do not place it on a metallic surface capable
    of conducting electricity, you should consider purchasing a cover case to offer
    additional protection. You can get the official Raspberry pi case or a customized
    one from third-party vendors.


    For networking, you will need to use a network cable connected to the Ethernet
    port on the Raspberry pi while the other end connects to the network switch or
    router. We will discuss how to configure Wireless networks in upcoming chapters.


    # Installing and Setting up Raspberry Pi 4 Hardware


    To cater to beginners, let’s discuss how to go about installing and configuring
    the hardware—no soldering things, just basic setup. Begin by carefully removing
    the Raspberry Pi device and its components from its box. Although the Raspberry
    Pi is a durable and robust device, it’s not immortal.


    **NOTE**: Always hold the Raspberry Pi device by its edges, not its flat sides
    where the internal components are.


    Also, ensure to take extra care when handling the Raspberry Pi raised metal pins
    to avoid a short circuit that may damage the device. Damaged pin pieces can complicate
    the process of setting up additional hardware such as cameras, sensors, etc.


    ## Assembling the Raspberry Pi case


    If you have a case to protect the Raspberry Pi, this should be the first phase
    of assembling your devices. If you are using a custom-made Raspberry pi case,
    refer to the specific manual for your case; otherwise, begin by opening up the
    official case in the middle, which includes a red and white lid.


    - Pick the red base of the Raspberry pi case and turn it such that the lower part
    faces you or to the right while the raised part faces towards the left.


    ![](image_rsrc2TB.jpg)


    - Now ensure you don’t have the microSD card connected to the device. After ensuring
    that, hold and raise the Raspberry pi by its USB and Ethernet port at a slight
    angle. Now slide the connectors—USB Type-C, HDMI, and 3.5 mm audio jack—into their
    respective cutouts, then gently slide it into a lower position until it sits comfortably
    on the base. Ensure you do not force the port positions or apply force while placing
    it on the base of the case; as mentioned, this might damage the device.


    ![](image_rsrc2TC.jpg)


    - Use the white cover and place the two clips on the left side of the case into
    the matching set of holes on the left side of the base. These should be above
    the microSD slot. Once in place, push down the right side above the USB ports
    until the case closes fully.

