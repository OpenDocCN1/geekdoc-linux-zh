    For some models, specific entries may be deprecated and obsolete. To find out
    more about boot options in the `config.txt` file, use the link provided below:
    [`www.raspberrypi.org/documentation/configuration/config-txt/boot.md`](https://www.raspberrypi.org/documentation/configuration/config-txt/boot.md)


    ## 第 6 节：连接树莓派


    If you are using a cabled Ethernet connection, the Raspberry Pi will automatically
    connect to the internet. If you want to connect using a wireless connection, click
    on the network icon found at the top panel to view all the available networks.![](img/image_rsrc2U1.jpg)


    Once you locate your network of choice, select it and provide the password—assuming
    you are connecting to a secured network—, click OK to join that specific network.![](img/image_rsrc2U2.jpg)


    Once connected, you should see a Wi‑Fi logo on the menu bar; that means you are
    now connected. To check the IP address of the Raspberry Pi, open the terminal
    and enter the command:

    ```

    ifconfig | grep more

    ```


    ## 第 7 节：设置静态 IP


    If you are on a cluttered network that has many devices connected to it, it can
    be challenging to keep track of the Raspberry Pi IP address on each boot, especially
    if you have connected to a network that is using DHCP. A static IP allows us to
    set one unique IP address that the Raspberry Pi will use, which helps us find
    the Pi.


    If you are unfamiliar with DHCP and IP addresses, here is an overview of how they
    work.


    ### DHCP 和 IP 地址工作概述


    Once you connect a device to a network, the router/modem automatically assigns
    it a unique number made up of four blocks of numbers called the Internet Protocol.
    The Internet Protocol number is usually something similar to `192.168.0._`. The
    first three blocks represent the network, and the third block represents the host—this
    depends on the network subnet mask. The last digit represents the device number.


    When assigning IP addresses, the router takes the first three blocks representing
    the network and appends a digit to represent the connected host. The router itself
    is number 1, and you can find it at `192.168.0.1`. For example, `192.168.0.2`
    may represent your desktop, `192.168.0.3` may represent your laptop, `192.168.0.4`
    may represent your smartphone, etc.


    **NOTE:** 您可以通过打开终端并输入 `ifconfig` 来查找树莓派的 IP 地址。然而，由于连接设备的数量及其连接方式的不同，该地址可能会变化，因为路由器负责分配这个唯一号码。


    To do this, the router uses the Dynamic Host Configuration Protocol (DHCP), which
    means that it dynamically assigns IP addresses to the connected hosts. For example,
    if you disconnect the Raspberry Pi and connect other devices before reconnecting
    the Raspberry Pi, the Pi may get a different IP address once re-connected.


    The implication of this is that you cannot memorize one IP address as the Raspberry
    Pi’s until you configure it to use one unique IP, which is where static IP addresses
    come handy. Using DHCP Reservation, we can tell the router to remember this IP
    address for the Raspberry Pi only.


    You can configure DHCP Reservation using the Router administration panel or edit
    the Raspberry Pi configurations. Since the routers’ administrations may vary,
    we shall focus on working with the Raspberry Pi network configurations.


    The first step is to check whether the DHCP service is running by executing the
    command:

    ```

    sudo service dhcp status

    ```


    Next, if DHCP is not running, execute the following commands:

    ```

    sudo systemctl start dhcpd.service && sudo systemctl enable dhcpd

    ```


    Upon successful execution, recheck whether DHCP is running and follow the next
    command. Locate the DHCP configuration file by executing the command:

    ```

    find dhcpcd.conf

    ```


    Once you locate the DHCP config file, edit it using your text editor of choice.
    If you would like to keep things simple, use `nano`. Execute the following command:

    ```

    sudo nano /etc/dhcpcd.conf

    ```


    If you have connected your Raspberry Pi via a cabled Ethernet, the interface is
    `eth0` and `wlan0` for Wifi connections. Enter the following lines in the Raspberry
    Pi DHCP configuration file:

    ```

    interface eth0/wlan0

    static ip_address=192.168.0.4/24

    static routers=192.168.0.1

    static domain_name_servers=1.1.1.1

    ```

    The interface entry should contain the interface you have connected the Raspberry
    Pi to; for Ethernet, `eth0`, and `wlan0` for Wireless.


    **NOTE:** 请仅使用 `eth0` 或 `wlan0` 中的一个，不能两者都使用。


    For static IP, set the desired IP address for the Raspberry Pi. The IP should
    not be an IP assigned to other devices on the same network. Additionally, the
    IP should be within the subnet range. For example, `192.168.0.2` – `192.168.0.254`.


    Static routers should contain the IP address of the router. By default, this is
    `192.168.0.1`. You can also specify the DNS servers you would like to use. If
    you do not know, set it to the router’s IP address; otherwise, specify it. Once
    done, press `CTRL + X` and click enter twice to save the configuration file. Now
    reboot the Pi to apply the changes.


    Upon reboot, test the TCP/IP stack. Open the terminal and enter the command:

    ```

    ping ::1 or ping raspberrypi.local

    ```

    ![](img/image_rsrc2U3.jpg)


    ## 第 8 节：远程访问树莓派


    One of the best ways of working with the Raspberry Pi is by accessing it remotely.
    Using `SSH` or `VNC`, you can connect to the Raspberry Pi remotely and work with
    it as if you were carrying it with you as if it were a laptop. In this section,
    we shall cover two methods of controlling the Raspberry Pi remotely.


    ### 如何通过 VNC 远程连接树莓派


    Virtual Network Computing, `VNC` for short, is a remote access technique that
    gives you remote control of one computer from another. The technology helps to
    communicate with servers and cloud computers from the basic Windows or Mac. Since
    the Raspberry Pi does not have a built-in monitor, it is best to control it using
    a terminal or desktop environment from another computer. Here is how:


    Setting up VNC may require terminal commands based on the distribution you are
    setting it in. For Raspberry Pi, the desktop makes it very easy. To navigate to
    the Raspberry Pi VNC configuration, click on Menu -> Preferences -> Raspberry
    Pi Configuration -> Interfaces and enable VNC. Once activated, a new icon marked
    VNC shall appear on the top-right menu bar. Click the icon to open VNC server
    settings. You will see a section labeled “Ready for Connections” and “Get Started.”
    You can view the instructions by clicking on the arrow next to “Get Started.”


    Note the IP address the Raspberry Pi is using, you can also use `ifconfig` to
    see the Raspberry Pi’s IP address. Save the VNC server signature and password
    that contains a list of randomly generated words. Download and install VNC viewer
    software that will enable you to control the Raspberry Pi. Visit the web page
    below to download Real VNC: [`realvnc.com/download/viewer`](https://realvnc.com/download/viewer)


    Install the software on your device. It is compatible with any Operating System.
    Once installed, launch the VNC viewer and provide the IP address of the Raspberry
    Pi noted above. Select VNC server and click connect. Provide the username and
    password for the Raspberry Pi. If you are using default credentials, username
    `pi`, password `raspberry`. Ensure the username and password are valid to ensure
    you are connecting to the right device. Once connected, the VNC viewer will display
    the desktop environment as if you were using the Raspberry Pi.


    ### 如何通过 SSH 远程连接树莓派


    Another way to connect to the Raspberry Pi remotely is via `SSH`. To connect the
    Raspberry Pi via `SSH`, open the terminal or Command prompt on Mac/Linux or Windows.
    On the Raspberry Pi, use `ifconfig` to note down the IP address. On your computer’s
    terminal, enter the command:

    ```

    ssh pi@192.168.0.8

    ```

    where `pi` is your Raspberry Pi’s username and `192.168.0.8` is your Raspberry
    Pi’s IP address. Once connected, enter the password for the `pi`. If you don’t
    have SSH configured on a different port, the default port `22` should work.


    ## 第 9 节：在树莓派上编程


    One of the most common ways of using the Raspberry Pi is to program projects.
    This section shall introduce you to how to set up a programming interface on the
    Raspberry Pi. We will discuss how to set up a programming environment for `Python`
    and `C/C++`. However, this book does not teach any concepts of the specified programming
    languages. Thus, you should use external resources to learn a programming language.


    **NOTE:** 在本书的项目部分工作时，您需要了解 `python` 编程。


    ### Python 3 on the Raspberry Pi


    Raspbian OS comes pre-installed with the latest, stable version of `Python`, making
    the Pi a programming platform you can use to script or work with data science.
    Beginners also get a lot from the Raspberry Pi programming setups since `python`
    is an excellent programming language. You can launch the `python IDLE` shell by
    selecting Menu -> Programming -> Python IDLE. The `Python` on the Pi is the default
    package that does not contain additional libraries and packages. If, for some
    reason, you do not have the `python` shell, you can download the Python installation
    package from the Python resource page below and select your desired version: [`python.org/downloads`](https://python.org/downloads)


    To test whether you have installed `python` correctly, open the terminal and enter
    the command:

    ```

    python --version

    ```

    to get the version of python installed.


    ### C/C++ 环境设置


    `C` and `C++` are some of the most powerful and popular programming languages
    used to create a wide range of applications. Developers use these languages to
    develop a wide selection of tools and utilities such as games, browsers, embedded
    systems, programming languages, and Operating Systems. This section covers how
    to start using `C` and `C++` on the Raspbian OS. To check whether your Raspbian
    version has the `C++` compiler installed, open the terminal and enter the command:

    ```

    whatis gcc

    ```

    If you do not have the compiler pre-installed, you can install it by executing
    the command:

    ```

    sudo apt-get update && sudo apt-get install gcc

    ```

    You can edit the code in any text editor such as `nano` or use the `Geany` IDE
    pre-packaged in Raspbian. Navigate to Menu -> Programming -> Geany and edit the
    code.


    ## 第 10 节：介绍 GPIO 头部


    At the top edge of any modern Raspberry Pi or the back of a Raspberry Pi 400 are
    two long rows of metallic pins called the `GPIO` or General Purpose Input/output
    header. In the Raspberry Pi, the `GPIO` headers allow you to connect additional
    hardware such as sensors, cameras, LED, switches, etc. You control the hardware
    connected to the `GPIO` header using a program you create. You can use the `GPIO`
    pins for both input and output. We will learn how to connect and interact with
    the `GPIO` header using `python` in upcoming sections.![](img/image_rsrc2U4.jpg)


    The `GPIO` header has 40 (male) metallic pins. Some pins are accessible for use
    in physical computing; some provide power to some hardware; others provide a communication
    interface with additional hardware such as sensors that collect and send data
    to the Raspberry Pi.![](img/image_rsrc2U5.jpg)


    **NOTE:** 树莓派 400 具有类似的引脚布局，但在 Pi 400 中，引脚布局是反向的。


    ### 跳线电缆


    Jumper cables, also called jumper wires or jumper leads, are handy when you want
    to connect physical components to your Raspberry Pi or breadboard. There are three
    main versions of jumper wires.


    '
- fmt: '

    # Jumper W


    1. `Male to Female`: This connects the breadboard to the `GPIO` header pins.

    2. `Female to Female`: This connects individual components, especially when not
    using a breadboard.

    3. `Male to Male`: We use this to make connections from one point of a breadboard
    to another.


    Depending on your project, you are most likely to require all types of jumper
    wires. However, if you are not using a breadboard, `M2F` and `M2M` will do fine.![](image_rsrc2U9.jpg)


    # Resistors


    Resistors are another common type of electrical component, often used to control
    or regulate the flow of electrical current. Resistors are available in various
    values measured using ohms (`Ω`). In a nutshell, the higher the number of ohms
    in a resistor, the higher the resistance.


    In a Raspberry Pi, resistors are mainly useful when devices are drawing too much
    power, damaging themselves or the Raspberry Pi in the process. Although this may
    vary depending on your project and device requirements, you will typically use
    a resistor rated `330 Ω`.![](image_rsrc2UA.jpg)


    # Light Emitting Diode


    ![](image_rsrc2UB.jpg)A light-emitting diode (`LED`) is an output device you can
    regulate straight from a programmed controller. An `LED` lights up when it’s on.
    You will find `LED` devices all around you: in houses to cars, planes, etc. They
    are responsible for alerting you when the cooker is on, smoke detectors, toys,
    and other indicators.


    `LEDs` exist in many shapes, colors, and sizes. Although there is a wide range
    of `LED` components, some are entirely unsuitable for the Raspberry Pi. If you
    intend to use `LEDs` with the Raspberry Pi, it is best to avoid using any `LED`-rated
    `5V` or `12V` supplies.


    # Piezoelectric buzzer


    A piezoelectric buzzer, or simply a buzzer, is a common type of output component
    used with the Raspberry pi. It is very similar to an `LED` component in that it
    produces sound instead of light.


    The buzzer mainly contains metallic plates enclosed in a plastic casing and vibrates
    against each other when an electric current passes through them. There are two
    main types of electric buzzers: active and passive buzzers. For ease of use, stick
    to active buzzers.![](image_rsrc2UC.jpg)


    You will also encounter other common electronic components such as motors, push-button
    switches, infrared sensors, motion sensors, temperature, humidity sensors, and
    such. It is good to note that some components may need special boards before connecting
    them to the Pi. It is therefore advisable to ensure you have all components at
    hand before undertaking a project.


    # Programming GPIO


    Having introduced the Raspberry Pi `GPIO` header, you can start interacting and
    programming your device using the supported languages. Although we cannot cover
    the ins and outs of programming the `GPIO`, we can introduce various concepts
    to illustrate how you can do this.


    ## Programming GPIO in C/C++: Standard Kernel Interface


    To interact with the Raspberry Pi `GPIO` using `C/C++`, you can use the standard
    kernel interface. There are also third-party libraries such as [`pigpio](http://abyz.me.uk/rpi/pigpio/)`,
    which you can use to interact with the pi.


    However, since Linux kernel `4.8`, the `sysfs` interface has become deprecated
    and can be very hard to use.


    ### Building


    We can build this project manually. However, you require `autoconf` version `2.61`
    and the standard C libraries with GNU extensions. This is a simple and straightforward
    Autotools compile.[https://linkfy.to/l850I](https://linkfy.to/l850I)


    Grab the files from the Linux kernel git repo provided below.[[https://git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git](https://git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git)


    Next, we need to build and install the project, which also includes command-line
    utilities. Enter the commands:![](image_rsrc2UD.jpg)


    Ensure you are in the folder containing the files from the `git clone` before
    executing the above commands. Once you build the tool, you get access to six main
    command-line tools. These are:


    * `Gpiodetect`: Used to display a list of `gpiochips` available in the system
    and their detailed information such as names, labels, number of `GPIO` lines,
    etc.

    * `Gpioget`: Used to read values of the passed `GPIO` lines.

    * `Gpiofind`: Finds the `gpiochip` name and line offset in the specified line
    name.

    * `Gpiomon`: Provides the wait calls for events on the `GPIO` line. Provides the
    events to watch and the number of events to process before terminating.

    * `Gpioinfo`: Used to display a list of all the lines of given `gpiochips`, names,
    active state, and other additional flags.

    * `Gpiofind`: Locates the `gpiochip` name and line offset of the specified line
    name.

    * `Gpioset`: Allocates values for given `GPIO` lines.


    You can learn more about the library using the provided resource.[https://linkfy.to/7nYBd](https://linkfy.to/7nYBd)


    ## Programming GPIO Using Python


    Programming the `GPIO` using `Python` uses the `gpio zero` package. Using the
    `gpio zero` package to control the devices with `python` is very easy and lightweight.
    The package also provides documentation for beginners to understand. Learn more
    here:[https://gpiozero.readthedocs.io/en/stable/](https://gpiozero.readthedocs.io/en/stable/)


    Here is a sample code you can use to control various devices connected to the
    Raspberry Pi. To control an `LED` connected to the `GPIO` header, you can use
    the code:![](image_rsrc2UE.jpg)


    # Section 1026 Innovative Raspberry Pi 4 Projects


    Welcome to the Projects section of the book. This section shall introduce you
    to the fun of building tools and projects using the Raspberry Pi 4 and `Python`
    programming language.


    NOTE: Before we begin, note that you need some `Python` programming knowledge
    because this section will heavily utilize it.


    Let’s get rolling with the first project: PROJECT 1: Blinking LED (Beginner Level)![](image_rsrc2UF.jpg)


    This is the first project we shall build using Raspberry Pi and `Python`. You
    will learn how to connect an `LED` to the Raspberry Pi and code a `Python` program
    that controls how it blinks. Understanding how to connect and control a `LED`
    device using Raspberry Pi `GPIO` pins is essential as it will allow you to control
    other output devices such as motors, buzzers, ISS—okay, that is not true, but
    it’s a start.


    ## Requirements


    For this project, you will need:


    * A Raspberry Pi

    * Solderless breadboard

    * 5mm Light Emitting Diode

    * 330 Ω Resistor

    * Jumper Cables

    '
