    - 40 针通用输入/输出 (`GPIO`) 引脚将项目与电子设备连接起来。你可以直接在树莓派上访问它们。


    注意：在树莓派运行（或操作）期间，可以对某些引脚进行开启或关闭。


    - **PoE 引脚**：以太网供电 (`PoE`) 允许设备在接入网络后，在特定时间自动开启/关闭。树莓派 4 具有 4 针引脚，支持在先代型号树莓派 3B+
    上发布的 `PoE HAT`。


    - **千兆以太网**：树莓派 4 内置的千兆以太网带宽超过 350MBps。虽然性能可能没有普通桌面电脑强大，但与通过 `USB 2.0` 实现 300Mbps
    千兆以太网的 Pi 3B+ 相比是一个巨大的改进。以太网的改进为树莓派 4 丰富的功能锦上添花。


    - **USB**：树莓派 4 拥有 4 个 `USB` 端口。包括 2 个 `USB 2.0` 端口和 2 个由蓝色接口指示的 `USB 3.0` 端口。由于树莓派
    4 内置了无线和蓝牙功能，需要更多端口的可能性很小，因为所需的外设是键盘、鼠标，以及如果你选择添加的话的摄像头。


    - **4 极立体声音频/视频接口**：树莓派 4 具有一个 4 极立体声音频和复合视频端口，用于连接耳机或外部扬声器。


    - **2 通道 MIPI CSI 摄像头接口**：移动行业处理器接口 (`MIPI`) 摄像头接口允许你直接将官方树莓派摄像头模块连接到主板上。


    - **双微 HDMI 端口**：树莓派 4 还具有 2 个 `micro HDMI` 端口，允许将树莓派连接到现代显示器。这些端口支持 `4kp60` 或
    `4K` 分辨率的音频输出。这两个 `Micro HDMI` 端口取代了前代产品的全尺寸 `HDMI` 端口。


    - **USB-C 电源接口 5V/3A**：树莓派 4 具有为树莓派供电的标准 `USB` 电源。树莓派基金会建议使用树莓派官方电源，以避免可能损坏设备的电压和功率问题。与大多数单板计算机一样，树莓派支持
    `5v` 或 `3 Amperes` 电源输入。树莓派 4 使用的电源已从之前型号中的 `Micro USB` 接口改为 `USB-C`。


    - **2 通道 MIDI DSI 显示端口**：MIDI 显示接口允许你将显示器直接连接到树莓派。


    - **Micro SD 卡槽**：与旧款树莓派一样，树莓派 4 有一个 `SD Card` 卡槽，作为板的硬盘。


    - **2.4/5GHz 无线和蓝牙 5.0**：树莓派 4 具有双频 `2.4` 和 `5.0 GHz` IEEE `802.1/*` 无线连接，以及蓝牙
    `5.0` 和 `LE`。无线连接的更新使得 Pi 4 在连接性方面优于旧型号。


    以上是你应该了解的树莓派 4 核心功能。


    # 树莓派 400


    树莓派 400 是树莓派 4 的改进版。它的特色组件与树莓派 4 非常相似。但不同之处在于，所有组件都整齐地封装在键盘布局内部。树莓派 400 功能强大，设计用于保护内部组件，并保持桌面整洁、线缆清晰。


    ![](img/image_rsrc2T1.jpg)


    Pi 400 在封闭的键盘外壳内包含了系统级芯片和 `n` 内存等组件，这与普通的树莓派 4 不同。在树莓派 4 的背面，它具有所有所需的端口和 `GPIO`
    引脚，我们将在后续章节中讨论这些。`GPIO` 引脚旁边是 `microSD` 卡槽。它存储了树莓派 400 用于存储操作系统、应用程序和其他数据的 `microSD
    card`。


    `microSD card` 预装在树莓派 400 中；你可以轻轻推按卡片直到它咔哒一声并弹出，然后取出。当你把卡片插回去时，请确保闪光的金属触点向下；卡片应随着轻微的咔哒声滑入。


    接两个端口是 `micro-HDMI` 端口，用于连接显示器、电视或任何其他显示设备。与树莓派 4 一样，树莓派 400 支持多两个显示器。旁边是 `USB
    Type-C` 电源接口，用于连接树莓派 400 电源或兼容的 `USB` 电源。


    两个蓝色端口是 `USB 3.0` 端口，提供与设备的高连接，包括固态硬盘 (`SSDs`)、优盘、打印机等。这些右侧的白色端口是低速的 `USB 2.0`
    端口，你可以在此连接附带的树莓派鼠标。


    最后一个端口是 `Gigabit Ethernet` 网口，它允许你使用网线将树莓派 400 连接到网络，作为使用内置 `Wi-Fi` 无线网络的一种替代方案。


    ![](img/image_rsrc2T2.jpg)


    简而言之，树莓派 400 集成了以下组件和功能：


    ![](img/image_rsrc2T3.jpg)

    ![](img/image_rsrc2T4.jpg)


    # 第 2 ：设置你的树莓派 4


    本节将涵盖树莓派所需的一切内容，以及连接它们的基础知识，以使设备运行。


    ![](img/image_rsrc2T5.jpg)


    从设计上来说，树莓派设备为所有人提供了简单舒适的设置过程。然而，像任何计算机一样，运行这台单板计算机需要你连接各种外设。为了避免设置设备时的任何麻烦和兼容性问题，可以考虑使用树莓派官方套件，它包含了你使用树莓派所需的一切：[`www.canakit.com/raspberry-pi-400-desktop-computer.html`](https://www.canakit.com/raspberry-pi-400-desktop-computer.html)。对于树莓派
    4，可以考虑从树莓派入门套件开始。然而，硬件和电路爱好者应该考虑终极或极客套件：[`www.canakit.com/raspberry-pi-400-desktop-computer.html`](https://www.canakit.com/raspberry-pi-400-desktop-computer.html),
    [`www.canakit.com/raspberry-pi-4-ultimate-kit`](https://www.canakit.com/raspberry-pi-4-ultimate-kit),
    或 [`www.canakit.com/raspberry-pi-extreme-aluminum-case-kit`](https://www.canakit.com/raspberry-pi-extreme-aluminum-case-kit)。


    一旦你购买了上述任何套件，你只需要一个支持 `HDMI` 连接的显示器或电视。`HDMI` 非常常见，因为许多设备（如游戏机、顶盒、蓝光播放机等）都使用它。


    然而，你可能只有一个裸板的树莓派，在这种情况下，你需要以下外设：


    - **USB 电源**：你需要一个额定为 `3 amperes (3A)` 的 `5V USB Type-C` 电源。使用树莓派官方电源最好，因为它可以处理树莓派的功耗需求。


    ![](img/image_rsrc2T6.jpg) ![](img/image_rsrc2T7.jpg)


    - **Micro SD 卡**：你下一个需要的是 `microSD`；它将存储操作系统，并在与树莓派协作时作为文件的存储设备。如果你只想要基础设置，可以从
    `8GB` 开始。然而，更大的容量更好，可以为存储更多文件留出空间。


    ![](img/image_rsrc2T8.jpg)


    - **USB 键盘和鼠标**：为了控制你的树莓派，你需要一个键盘和鼠标。考虑从树莓派基金会购买官方产品。带有炫丽 RGB 彩色的游戏键盘等键盘可能会消耗过多功率，树莓派可能无法承受。


    ![](img/image_rsrc2T9.jpg)


