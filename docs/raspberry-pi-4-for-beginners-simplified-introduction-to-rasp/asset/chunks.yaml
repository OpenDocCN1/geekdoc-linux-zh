    NOTE: This project is based on the Adafruit Onion Pi project. Consider the following
    resource to learn more: [https://learn.adafruit.com/onion-pi](https://learn.adafruit.com/onion-pi)


    ## Building the Project


    The first step is to set up Raspbian OS on your SD card—we looked at how to do
    this earlier. Once you boot up the device, enter the command `raspi-config` from
    the terminal.


    In the configuration, start by selecting “Expand Filesystem.” This option allows
    the Operating System to maximize the SD card usage. By default, it only allocates
    the size of the OS image.


    For security purposes, ensure you have a strong password instead of the default
    one—since it’s a TOR router, a stronger password is ideal. Next, under “Boot Options,”
    modify the mode to `Console` or `Console Autologin`. Reboot the Pi for changes
    to take effect.


    Now, let us ensure we have the system up to date using the commands:

    ```bash

    sudo apt-get update && sudo apt-get upgrade –y

    ```


    Next, we need to set up the Wi-Fi access point. Ensure you don’t have the Wi-Fi
    dongle connected to the Raspberry Pi. If so, disconnect it and reboot the Pi.


    Next, we need to download the OnionPi bash script:

    ```bash

    wget [https://raw.githubusercontent.com/seanmragan/OnionPi/master/pifi.sh](https://raw.githubusercontent.com/seanmragan/OnionPi/master/pifi.sh)

    ```


    Next, make the file executable using the command `chmod 755 pifi.sh` and run the
    script as `sudo ./pifi.sh`. Now, reboot your Raspberry Pi and connect your Wireless
    dongle. You should have an extra access point available.


    At the moment, the access point is just a normal Wi-Fi router. We need to set
    up TOR so we can connect to it securely. Download the tor script from the following
    resource.

    ```bash

    wget [https://github.com/seanmragan/OnionPi/blob/master/tor.sh](https://github.com/seanmragan/OnionPi/blob/master/tor.sh)

    ```


    Next, change permissions and execute the script `chmod 755 tor.sh && sudo ./tor.sh`.
    Follow the script prompts and reboot the Pi. Once the Wi-Fi is up, you can connect
    to it, and you will have all the traffic routed through tor. You can check if
    it’s working from: [https://check.torproject.org/](https://check.torproject.org/)


