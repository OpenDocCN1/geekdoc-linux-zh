  trans: "\n\n![](img/image_rsrc2TD.jpg)\n# 连接 microSD 存储卡\n正如我们所提到的，树莓派使用 microSD\
    \ 卡来存储操作系统、应用程序和用户数据。虽然你可以添加额外的存储空间，但在最基础的层面上，你需要一张 microSD 卡。\n\n要在树莓派上安装 microSD\
    \ 卡，请将带有外壳的设备翻过来，找到 microSD 卡槽。将标签朝向树莓派的方向，缓慢地插入卡片，不要用力推。如下所示，MicroSD 卡只能朝一个方向插入：\n\
    ![](img/image_rsrc2TE.jpg)\n卡片插入槽后，施加一点压力使卡片对齐；这应该让卡片停止到位且不发出“咔哒”声。\n![](img/image_rsrc2TF.jpg)\n\
    你只需抓住卡片末端并轻轻拉出即可移除 MicroSD 卡。对于较旧的树莓派型号，只需简单按压（推）即可解除锁定并释放卡片。对于 Pi 4 和 3，不需要这种操作。\n\
    \n# 连接键盘和鼠标\n要连接键盘和鼠标等输入设备，你只需要将 USB 连接器端连接到四个 USB 端口中的任何一个。树莓派支持 USB 2.0 和 USB\
    \ 3.0。\n\n对于官方树莓派键盘，你可以将鼠标连接到键盘上，然后只连接键盘。如果不是，请将 USB 连接到树莓派上的两个 USB 端口之一。\n![](img/image_rsrc2TG.jpg)\n\
    不要强行将任何设备的 USB 连接器插入端口。它们应该轻松且自动地连接。如果你在插入设备时遇到困难，请检查 USB 连接器！\n\n# 连接显示设备\n要将显示设备连接到树莓派，只需取根\
    \ micro-HDMI 线，将电缆较小的一连接到树莓派上 USB Type-C 连接端口旁的端口。\n\n接下来，将电缆的另一端连接到你的显示器。如果显示器有多个连接端口，你需要手动为树莓派选择使用哪个输入通道。如果你不确定如何操作，只需切换端口直到找到树莓派信号。\n\
    ![](img/image_rsrc2TH.jpg)\n\n# 连接网络设备\n虽然这是一个可选的选择，但你可以通过有线连接将树莓派连接到网络。\n\n使用以太网适配器或以太网线，将塑料锁朝下，连接到树莓派的以太网端口。你应该听到“咔哒”声，表示电缆已到位并连接。接下来，将以太网适配器的另一端连接到网络设备——交换机、集线器或路由器，直到听到“咔哒”声。\n\
    ![](img/image_rsrc2TJ.jpg)\n\n# 连接电源\n连接电源是设置树莓派硬件的最后一步。树莓派没有电源开关。因此，一旦你插上电源，它就会自动启动。只有当树莓派加载了必要的软件和操作系统后，你才应该连接电源。\n\
    \n对于官方树莓派 microSD 卡，它应该已经安装了操作系统，你可以直接为设备电源。如果你使用的是自定义 SD 卡，在我们在下一节设置好所需软件之前，请勿插入电源。\n\
    \n将电源线的 USB Type-C 端连接到树莓派。接下来，将电源插进插座并开启。这将启动树莓派，你就可以开始使用它了。\n![](img/image_rsrc2TK.jpg)\n\
    \n# 设置 树莓派 400\n让我们来讨论一下如何设置树莓派 400。处理过程并不很不同，因为这两个设备非常相似。然而，树莓派 400 自带了安装好的 microSD\
    \ 卡和内置键盘。\n![](img/image_rsrc2TM.jpg)\n\n## 连接鼠标\n对于树莓派 400，你只需要添加一个鼠标。只需取出鼠标的\
    \ USB 端并连接到树莓派 400。你可以在设备背部找到 USB 端口（包括 USB 3.0 和 USB 2.0）！\n[](image_rsrc2TN.jpg)\n\
    USB 连接器应该在不需要太大压力的情况下滑动到位。\n\n## 连接显示器\n取根 micro-HDMI 线，将较小的一端连接到树莓派 400 上靠近 microSD\
    \ 槽的 micro-HDMI 端口，另一端连接到你的显示器。\n\n如果你的显示器有多个 HDMI 端口，请寻找连接器旁边的端口号；你需要手动将电视切换到此输入以看到树莓派的显示。如果你看不到端口号，不要担心：你可以切换每个输入直到找到树莓派的输入。\n\
    \n# 第 3 节 使用树莓派 4\n树莓派设备非常灵活，可以运行各种软件，包括多种基础操作系统。尽管其中一些需要针对树莓派架构进行一些调整，但它们运行非常流畅。\n\
    \n支持的树莓派操作系统中最流行且有效的是由树莓派基金会开发的官方操作系统 Raspbian OS。Raspbian 是一个基于 Debian Linux\
    \ 的、为树莓派设计的简单且经过优化的操作系统。\n\n如果你是 Linux 用户，在导航和使用 Raspbian OS 时将不会遇到困难。Windows\
    \ 和 Mac 用户会发现该环境很熟悉，因为它提供了与流行操作系统和桌面环境相同的图形功能。\n\n本节将讨论如何开始使用 Raspbian OS，更多是关于如何轻松导航它以实现生产力最大化。\n\
    \n在我们深入使用树莓派之前，我们需要安装 NOOBS 或 New Out of the Box Software（开箱用软件），这是树莓派基金会开发的帮助新用户设置操作系统的软件。\n\
    \n## 在 Mac 和 Windows 上设置 NOOBS\n如果你是从官方商店购买的 microSD 卡，它应该预装了 NOOBS，你可以跳过此节。然而，对于自定义\
    \ SD 卡，在使用之前我们需要对其进行设置。\n\n在 Mac 和 Windows 上设置 NOOBS 涉及类似的过程，无论使用哪种操作系统。最好的方法是使用新的、未使用的\
    \ SD 卡，如果你决定使用旧 SD 卡，请备份你的数据。\n\n在 Mac 和 Windows 上设置 NOOBS 的第一步是下载并安装格式化工具。无论使用哪种操作系统，对于本教程，我们将使用\
    \ SD Formatter，因为它很容易使用。从资源页面下载：`https://www.sdcard.org/downloads/formatter/`![](img/image_rsrc2TP.jpg)\n\
    \n选择对应的操作系统并安装程序。一旦下载完成，启动安装程序。正确插入 SD 卡并确保电脑检测到它。如果这种情况没有发生，请检查 SD 卡槽或使用第三方格式化工具。\n\
    \n启动格式化工具并确保在“Select Card”框中选择了正确的 microSD 卡。接下来，选择 Overwrite（覆盖）来处理数据，这通常是不必要的。(image_rsrc2TR.jpg)\n\
    \n你也可以使用 Windows 的 `diskpart` 或 Mac 的磁盘工具。如果你选择使用任何其他格式化工具，请确保使用 FAT32 系统格式化 SD\
    \ 卡。格式化完成后，使用 Windows 资源管理器或 Mac 的 Finder 打开它。\n\n现在我们需要下载 NOOBS 软件副本。可以在树莓派上安装的操作系统包括\
    \ Raspbian OS、LibLEC、OSMC 等。打开浏览器并导航到以下链接下载 NOOBS：`https://www.raspberrypi.org/downloads/noobs/`(image_rsrc2TS.jpg)\n\
    \n一旦下载完成，打开下载文件夹并解压 ZIP 文件。如果你使用包管理器，点击 `CTRL + A` 选择所有可用数据。在选择所有数据后，将文件拖入 SD\
    \ 卡的根目录。此外，确保在存档中复制文件。接下来，从电脑上弹出 SD 卡，并使用上一节学的方法连接到树莓派。如果你想在 Linux 系统上安装 NOOBS，请跳过此节。\n\
    \n## 在 Linux 上安装 NOOBS\n在本节中，我们将讨论如何在 Linux 系统上设置 NOOBS。这里介绍的方法很简单。你可以使用任何你觉得方便的方法，如\
    \ Balena Etcher。使用 Linux 系统预安装的磁盘工具，我们将分区 SD 卡并提取 NOOBS。你可能需要 root 权限来执行此任务。第一步是启动终端并输入命令\
    \ `sudo fdisk -l` 列出所有连接的磁盘和分区。确保以 root 身份运行命令。输出类似于 `/dev/sda` 或 `/dev/sdb`，表示磁盘\
    \ 1 和 2。如果你连接了两个驱动器，可能会得到 `/dev/sd(n)`，其中 `n` 是设备的字母数字。\n\n接下来，在列出的设备中找到你的 SD\
    \ 卡，复制其标识代码并继续。下一步是使用 FAT32 系统重新分区 SD 卡。输入命令 `sudo fdisk /dev/sda`，将 `/dev/sda`\
    \ 替换为你 SD 卡的代码。\n\n一旦运行上述命令，你应该能看到帮助命令 `m`。在 `fdisk` 工具中查看所有可用命令。我们将使用命令 `d` 删除当前\
    \ SD 卡上的所有分区，使用命令 `n` 创建新分区。接下来，输入 `d` 并回车，输入分区号。如果 SD 卡中有其他分区，输入 `p` 打印它们。选择每个分区并输入\
    \ `d` 后跟相应的分区号。重复此过程直到删除 SD 卡上的所有分区。\n\n删除所有分区后，下一步是创建一个新的。仍在 fdisk 中，输入命令 `n`\
    \ 并回车。接下来，输入命令 `p` 确认分区类型为主（Primary）并继续。现在输入分区号 `1` 并回车。接下来，输入起始和结束扇区或直接回车确认默认值。\n\
    \n你可以确认 SD 卡仅包含一个分区；输入命令 `p` 列出所有分区。接下来，我们需要将文件系统从 Linux 改为 FAT32。输入命令 `l` 列出所有可用代码。找到对应\
    \ FAT32 的代码并将其提供给磁盘工具。在此情况下，分别选择 `t` 和 `b` 命令。操作完成后，将显示分区已成功更改为 FAT32 的消息。\n\n\
    接下来，我们需要将更改应用磁盘。在应用之前确保更改如上所示。输入命令 `w` 写入并应用更改。完成分区后，输入命令 `sudo mkfs.vfat /dev/sda`\
    \ 进行格式化，其中 `/dev/sda` 代表你的 SD 卡代码。现在我们已经以正确的格式分区并格式化 SD 卡。接下来，我们需要从树莓派官方仓库下载并提取\
    \ NOOBS 软件。\n\n打开浏览器并导航到以下页面。确保选择 NOOBS Large 版本而不是 lite 版本。选择点对点或 HTTP 进行下载：`https://www.raspberrypi.org/downloads/noobs/`。对于本书，我们将使用\
    \ `wget` 工具从 Linux 终端下载文件。导航到你想下载文件的文件夹，本例中为输入 `cd ~/Downloads`。一旦进入下载文件夹，输入命令\
    \ `wget https://downloads.raspberrypi.org/images/NOOBS-2020-09-15/v3_5_0.zip`。执行命令并等待下载完成。\n\
    \n完成后，通过执行命令 `sudo fdisk -l` 找到 SD 卡的挂载位置。在 Linux 系统上，树莓派 40 解解压文件。使用包管理器，，，，，。。\n\
    \n\n\n     节 树莓派 4 的操作\n树莓派设备非常灵活，可以运行各种软件，包括多种精选的基础操作系统。尽管其中一些需要针对树莓派架构进行一些调整，但它们运行非常流畅。\n\
    \n支持的树莓派操作系统中最流行且有效的是由树莓派基金会开发的官方操作系统 Raspbian OS。Raspbian 是一个为树莓派设计的基于 Debian\
    \ Linux 的简单且经过优化的操作系统。\n\n如果你是 Linux 用户，在导航和使用 Raspbian OS 时将不会遇到困难。Windows 和\
    \ Mac 用户会发现该环境很熟悉，因为它提供了与流行操作系统和桌面环境相同的图形功能。\n\n本节将讨论如何开始使用 Raspbian OS，更多是关于如何轻松导航它以实现生产力最大化。\n\
    \n在我们深入使用树莓派之前，我们需要安装 NOOBS 或 New Out of the Box Software（开箱用软件），这是树莓派基金会开发的帮助新用户设置操作系统的软件。\n\
    \n## 在 Mac 和 Windows 上设置 NOOBS\n如果你是从官方商店购买的 microSD 卡，它应该预装了 NOOBS，你可以跳过此节。然而，对于自定义\
    \ SD 卡，在我们在下一节设置好所需软件之前，请勿插入电源。\n\n在 Mac 和 Windows 上设置 NOOBS 涉及类似的过程，无论使用哪种操作系统。最好的方法是使用新的、未使用的\
    \ SD 卡，如果你决定使用旧 SD 卡，请备份你的数据。\n\n"
