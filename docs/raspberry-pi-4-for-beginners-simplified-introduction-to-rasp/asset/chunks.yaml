    rails represent the Ground Rails or GND, while the blue rails are what we use
    to connect to power.Split rows, also called circuit rails or circuit areas, are
    in the middle of the top and bottom power rails. Use this area to connect your
    components.Jumper CablesJumper cables, also called jumper wires or jumper leads,
    are handy when you want to connect physical components to your Raspberry Pi or
