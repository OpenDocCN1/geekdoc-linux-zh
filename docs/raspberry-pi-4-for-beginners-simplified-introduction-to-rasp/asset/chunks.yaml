    使用 LCD，你可以扩展项目以显示天气数据、告警消息等数据。


    # 项目 3：简单气象站（初级水平）


    欢迎来到另一个树莓派显示项目，在这个项目中我们将学习如何使用 OLED 显示器来显示信息。然而，在这个项目中，我们不会显示简单的文本。相反，我们将构建一个简单的气象站，并使用
    API 请求显示你所在区域的天气信息。我们将在后续项目中构建一个完整的气象预报。请期待！


    ## 项目需求


    对于此项目，你需要以下组件：


    *   树莓派，如往常

    *   免焊接面包板

    *   `Adafruit_SSD1306` 库

    *   跳线

    *   单色 0.96 英 128x64 OLED 图形显示器 [`www.amazon.com/DIYmall-Serial-128x64-Display-Arduino/dp/B00O2KDQBE`](https://www.amazon.com/DIYmall-Serial-128x64-Display-Arduino/dp/B00O2KDQBE)


    ## 理解 OLED 显示器


    此项目涉及有机光二极管，一种允许你选择开启或关闭哪些像素的显示器。从功能上来说，这允许你在显示器的任何位置显示任何文本或图标。与为每个字符预留 5 x 8
    空间的 LCD 不同，OLED 要灵活得多。此外，OLED 显示器不需要背光，使得这些显示类型成为理想选择，特别是在黑暗环境中。


    对于此项目，我们将使用具有 128 x 64 像素的单色 0.96 英显示器。![](img/image_rsrc2UX.jpg) 根据你使用的 OLED
    显示器型号，你通常会有 4 个主引脚：`VCC`、`GND`、`SCL` 和 `SDA`。请注意给出的接线说明。


    对于使用集成电路（通信）协议的 OLED 显示器，你需要树莓派上的 `SDA` 和 `SCL` 引脚。它们按顺序对应 `GPIO 2` 和 `GPIO 3`。![](img/image_rsrc2UY.jpg)


    ## API 快速指南：OpenWeather


    这里是对 API 的快速介绍。API，或应用程序接口，是程序员开发的函数，用于将其服务开放给任何想要使用它的人。例如，`VirusTotal` API 允许你扫描文件病毒，而无需开发个人的病毒引擎。


    在这个项目中，我们将使用 `OpenWeather` API，它允许我们请求指定语言的天气信息。如往常一样，我们将使用 `Python` 来发送这些请求。API
    非常有用，因为允许你获取有关特定项目的准确且最新的数据。


    *   启动浏览器并导航到 [`openweathermap.org/api`](https://openweathermap.org/api)

    *   接下来，创建一个账户以获取 API 权限。接着，在 `Subscribe` 按钮中选择当前天气数据。![](img/image_rsrc2UZ.jpg)


    接下来，在你的账户仪表板中，选择 `API Keys` 标签页访问你的 API 密钥。(image_rsrc2V0.jpg)复制默认 API 密钥并执行简单的
    API 请求。你可以使用任何 API 客户端如 `curl` 或 `Postman` 来完成。


    打开浏览器并执行以下请求：

    `api.openweathermap.org/data/2.5/weather?q={city name}&appid={API key}`

    其中 `city name` 是你想获取信息的城市，`API key` 是你的 API 密钥。


