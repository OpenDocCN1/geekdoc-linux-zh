- fmt: '

    ![](image_rsrc2TD.jpg)

    # Connecting the microSD storage

    As we have mentioned, Raspberry Pi uses a microSD card to store the OS, applications,
    and user’s data. Although you can add extra storage, at the most basic level,
    you need a microSD.


    To install a microSD card on a Raspberry pi, turn over the device in its case
    and locate the microSD card slot. With the label facing away from the Raspberry
    Pi, slowly slide the card in without forcing it. As shown below, the MicroSD card
    can only face one direction:

    ![](image_rsrc2TE.jpg)

    Once the card is in the slot, apply a little pressure to align the card into place;
    this should make the card stop without a click.

    ![](image_rsrc2TF.jpg)

    You can remove the MicroSD card by simply grasping it at the end and gently pulling
    it out. For older Raspberry pi models, apply simple pressure (push) to engage
    the lock and release the card. For Pi 4 and 3, this is not necessary.


    # Connecting the Keyboard and Mouse

    To connect input devices such as a keyboard and mouse, all you have to do is connect
    the USB connector end to any of the four USB ports available. Raspberry Pi supports
    USB 2.0 and USB 3.0.


    For the official Raspberry Pi keyboard, you can connect the mouse to the keyboard
    and only connect the keyboard. If not, connect the USB to either of the USB ports
    on the Raspberry Pi.

    ![](image_rsrc2TG.jpg)

    Do not force the USB connectors for either device into their ports. They should
    connect easily and automatically. If you experience difficulties while plugging
    the devices in, check the USB connectors!


    # Connecting the display device

    To connect the display device to the Raspberry Pi, simply take the micro-HDMI
    cable and connect the smaller end of the cable to the port next to the USB Type-C
    connection port on the Raspberry pi.


    Next, connect the other end of the cable to your display. If the display has more
    than one connection port, you will have to select which input number to use manually
    for the Raspberry pi. If you are not sure how to do this, simply change the port
    until you locate Raspberry Pi.

    ![](image_rsrc2TH.jpg)


    # Connecting the Network device

    Although this an optional decision, you can connect the Raspberry Pi to a network
    using a wired connection.


    Using an Ethernet adapter or Ethernet cable, connect it to the Raspberry Pi Ethernet
    port with the plastic lock facing downwards. You should hear a click sound indicating
    the cable is in place and connected. Next, take the other end of the Ethernet
    adapter and connect to the network devices – switch, hub, or router until you
    hear a click.

    ![](image_rsrc2TJ.jpg)


    # Connecting the Power Supply

    Connecting the power supply is the final step of setting up the Raspberry Pi hardware.
    The Raspberry Pi does not have a power on/off switch. Thus, it automatically starts
    once you plug in the power. You should only connect the power when the Raspberry
    pi has the necessary software and OS loaded.


    For an official Raspberry Pi microSD card, it should already have the OS installed,
    and you can go ahead and power on the device. If you are using a custom SD card,
    do not plug in the power until we set up the required software in the next section.


    Connect the USB Type-C end of the Power supply cable to the Raspberry pi. Next,
    plug in the power supply into the power socket, and turn it on. That will boot
    up the Raspberry Pi, and you can start using it.

    ![](image_rsrc2TK.jpg)


    # Setting up Raspberry Pi 400

    Let us discuss how to set up the Raspberry Pi 400. The process is not that different
    as the two devices are similar. However, the Raspberry Pi 400 comes with a microSD
    card installed and a built-in keyboard.

    ![](image_rsrc2TM.jpg)


    ## Connecting the Mouse

    For Raspberry Pi 400, you only need to add a mouse. Simply take the USB end of
    your mouse and connect it to Raspberry PI 400. You can find the USB ports on the
    rear of the device (Both USB 3.0 and USB 2.0)!

    [](image_rsrc2TN.jpg)

    The USB connector should slide home without too much pressure.


    ## Connecting the Display

    Take the micro-HDMI cable and connect the smaller end to the micro-HDMI port closest
    to the MicroSD slot on your Raspberry Pi 400 and the other end to your display.


    If your display has more than one HDMI port, look for a port number next to the
    connector itself; you’ll need to switch the TV to this input to see Raspberry
    Pi’s display. If you can’t see a port number, don’t worry: you can change through
    each input until you find the Raspberry Pi input.


    # Section 3 Working with the Raspberry Pi 4

    Raspberry Pi devices are very flexible and can run a wide range of software, including
    a wide selection of the base Operating Systems. Although some of them need some
    tweaking to fit the Raspberry Pi architecture, they run smoothly.


    The most popular and effective of the supported Raspberry Pi Operating systems
    is the official OS developed by the Raspberry Pi Foundation, Raspbian OS . Raspbian
    is a simple, well-tuned operating system based on Debian Linux for the Raspberry
    Pi.


    If you are a Linux user, you will have no trouble navigating and using the Raspbian
    OS. Windows and Mac users will find the environment familiar because it offers
    the same graphical capabilities as popular operating systems and desktop environments.


    This section discusses how to get started with the Raspbian OS, more so how to
    navigate it easily for maximum productivity.


    Before we dive into using the Raspberry Pi, we need to install NOOBS or New Out
    of the Box Software, a software developed by the Raspberry Pi foundation to help
    new users set up an Operating system for the Raspberry Pi.


    ## Setting Up NOOBS Software on Mac & Windows

    If you purchased a microSD card from the official Raspberry Pi store, you should
    have NOOBS pre-installed on the card, and you can skip this section. However,
    for a custom SD card, you will need to set it up before using it. Follow the instructions
    provided to set up NOOBS on Windows and Mac.


    Your best bet is to use a new and unused SD, or should you decide to use old SD
    card, back up your data.


    Setting up NOOBS on Mac OS and Windows involves a similar process, regardless
    of which OS you running. The first step is to download and install a MicroSD formatting
    tool. You have various options, but for this tutorial, we shall use SD Formatter
    as it is easy to use. Download the utility from the resource page: `https://www.sdcard.org/downloads/formatter/`![](image_rsrc2TP.jpg)


    Select the installer for your operating system and save it on your pc. Once the
    download completes, launch the installer and follow the installation. Correctly
    insert your SD card into the slot and ensure your computer detects the card. If
    this does not happen, check the SD card slot or use third-party connector.


    Launch the SD formatter utility and ensure you have the correct microSD card selected
    in the “Select Card” box. Next, select Overwrite to overwrite the data. You can
    also enter a name that allows you to identify the SD card; however, this is unnecessary
    for installation![](image_rsrc2TR.jpg)


    You can also use other formatting utilities such as `diskpart` in Windows or Disk
    Utility for Mac. If you opt to use any other formatting utility, make sure you
    format your SD card using the FAT32 system. Once the SD card formatting process
    completes, mount the card and open it using File Explorer for Windows or Finder
    for Mac.


    Now we need to download a copy of the NOOBS software that contains a wide selection
    of operating systems you can install on the Raspberry Pi. Such operating systems
    include Raspbian OS, LibreLEC, OSMC, Windows 10 IoT Core, Screen OS, etc. Open
    your browser and navigate to the following link and download a version of NOOBS:
    `https://www.raspberrypi.org/downloads/noobs/`![](image_rsrc2TS.jpg)


    Once the download completes, open your computer’s download folder and unzip the
    NOOBS ZIP file. If you are using the default Zip manager, click `CTRL + A` to
    select all the data available in the archive. After you have selected all the
    data, drag and drop all files from the Archive to the root of the SD card. DO
    NOT copy these files into a folder within the SD card. Additionally, ensure you
    copy the files inside the archive.


    Next, eject the SD Card from the Computer and connect it to the Raspberry Pi using
    the process you learned from the previous section. If you want to install NOOBS
    on a Linux system, read the next section; otherwise, skip to the installation.


    ## NOOBS Installation on Linux

    For this subsection, we shall discuss how to set up NOOBS on a Linux system. The
    method discussed here is simple. You can use any method you find comfortable,
    like Balena Etcher. Using the terminal and disk utilities that come pre-installed
    in Linux systems, we shall partition the SD card and extract the NOOBS software.
    This method will work with any Linux distribution provided it has the required
    tools. You may also need root permissions to perform this task.


    The first step is to launch the terminal and enter the command `sudo fdisk -l`
    to list all the connected disks and partitions in the operating system. Ensure
    you run the command as root or using an account with elevated privileges. The
    output will be something close to `/dev/sda` or `/dev/sdb`, indicating disk 1
    and 2. If you have more than two drives connected, you may get `/dev/sd(n)`, where
    `n` is the alphabetical number of the devices.


    Next, locate your SD card in the listed devices above, copy its identity code,
    and proceed to the next step. The next step is to repartition and format the SD
    card using the FAT32 system. Enter the command `sudo fdisk /dev/sda`, replacing
    `/dev/sda` with the code representing your SD card.


    Once you run the above command, you should see command `m` for help. Press enter
    to view all the commands available in the `fdisk` utility. We will only use the
    command `d` to delete all the partitions currently on the SD card and command
    `n` to create a new partition. Next, enter command `d` and press enter. Enter
    `1` for the partition number. If there are other partitions in the SD card, enter
    command `p` to print them. Select each partition and enter command `d` followed
    by their corresponding partition number. Repeat this procedure until you delete
    all the partitions on your SD card.


    Once you have deleted all the partitions, the next step is to create a new one
    to install NOOBS. While still in fdisk, enter the command `n` and press Enter.
    Next, enter command `p` to confirm the partition type as Primary and proceed.
    Now enter the partition number as `1` and click enter. Next, enter the First and
    Last sector or press Enter to confirm the defaults.


    You can confirm that the SD Card contains only one partition; enter command `p`
    to list all the available partitions. Next, we need to change the file system
    from Linux to FAT32. Enter the command `l` to list all the codes available. Locate
    the code corresponding to FAT32 and provide it to the disk utility and click enter.
    In this case, select the `t` and `b` commands, respectively. Once the operation
    completes, a message indicating that the partition has successfully changed to
    FAT32 will display.


    Next, we need to apply the changes to the disk. Ensure that the changes are as
    specified above before applying. Enter the command `w` to write and apply the
    changes to the disk. Once you have finished creating the partition, format it
    by entering the command `sudo mkfs.vfat /dev/sda`, where `/dev/sda` represents
    the code for your SD card. Now we have partitioned and formatted the SD card in
    the correct format. Next, we need to download and extract the NOOBS software from
    the official Raspberry Pi repository.


    Open your browser and navigate to the following page. Ensure to select NOOBS large
    and NOT the lite version. Select either peer-to-peer or HTTP for download: `https://www.raspberrypi.org/downloads/noobs/`.
    For this book, we shall use the `wget` tool to download the file from the Linux
    terminal. Navigate to the folder you want to download the file to, this case by
    entering `cd ~/Downloads`. Once in the download folder, enter the command `wget
    https://downloads.raspberrypi.org/images/NOOBS-2020-09-15/v3_5_0.zip`. Execute
    the command and wait for the download to complete.


    Upon completion, find the location where the SD card is mounted by executing the
    command `sudo fdisk -l` and find the code. Now enter the command `sudo mount |
    grep sdb`. Upon successful mount, navigate to the SD card by entering the command
    `cd /media/<device name>`. In the SD Card directory, extract the files by executing
    the command `unzip ~/Downloads/v3_5_0.zip`. This command will automatically extract
    all the necessary files into the SD card. You can complete the formatting process
    using other utilities such as `gParted`. Once you have NOOBS successfully installed
    on the SD card, we can proceed to the installation.


    # Section 4 Installing Raspbian OS

    After preparing the SD card and installing NOOBS on any operating system—Windows,
    Mac, or Linux—you can begin the process of installing Raspbian OS on the Raspberry
    Pi. Installing Raspbian OS will help you start using the Raspberry Pi as a regular
    computer. As discussed in previous sections, make sure you have all the requirements,
    connect all peripherals, and then power on the Raspberry Pi. Once the Pi has booted
    up, you shall get a welcome screen similar to that below:(image_rsrc2TT.jpg)


    The image above is from a version of NOOBS; it may differ slightly if you are
    running the latest version. On the welcome screen, you will have a selection of
    operating systems you can install on the Raspberry Pi. For some operating systems,
    you may require an active internet connection. However, since our interest is
    the Raspbian OS, we can mark it, select the keyboard layout, and set up language
    options at the bottom. Once you have completed, select the ‘Install’ option to
    begin the installation process. NOOBS will now automatically extract the Raspbian
    file to the SD card, allowing you to boot directly into Raspbian OS during the
    next boot. During the installation process, the process is out of your control,
    and all you have to do is wait for it to complete. You can use this time to grab
    a cup of Joe or read various Raspberry Pi tips and tricks. Once the 20-30 minute-long
    installation process completes, the Pi will reboot and boot back into the Raspbian
    OS.


    The Raspberry Pi will boot directly into the PIXEL Desktop Environment, a desktop
    environment that should be familiar to anybody who has used a Windows or Macintosh
    computer. At this point, the Raspberry Pi is up and ready to use. NOTE: As a recommendation,
    you should change the default password, which is “raspberry,” and set a new strong
    password. You can configure various options of the Raspberry Pi, such as Language
    and Locale. The Raspberry Pi uses UK English as its default. Should you wish to
    use different language preferences, perhaps because you are in a different geo-location,
    you can change this by navigating to Applications -> Preferences -> Raspberry
    Pi Configuration -> Localizations. If you feel more comfortable using the Command
    Line (CLI) than the PIXEL desktop, you can change the default boot options from
    Configurations. For now, let us leave it as PIXEL.


    ## How to Install Custom Images with Balena Etcher

    As you work with the Pi, you may want to experiment with operating systems not
    included in NOOBS. Using custom images to set up the Raspberry Pi may seem complex,
    but this section shall show you an easy way to set up custom images. To do this,
    we will install Raspbian using the image instead of using NOOBS.


    The first step is to download a tool that helps you flash custom images to SD
    cards. Open your browser and navigate to the resource page: `https://www.balena.io/etcher/`.
    Select the version for your operating system and download it.(image_rsrc2TU.jpg)


    Install the application you just downloaded. If you are using a Mac OS-based device,
    drag the file into Applications and launch once done. Ensure you insert the SD
    card you need to flash the image correctly into the machine.


    The next step is to download the OS image you shall use. Since we want to set
    up Raspbian OS, fire up your browser, go to the resource page below, and then
    select the Raspbian Buster with desktop and recommended software: `https://www.raspberrypi.org/downloads/raspbian/`(image_rsrc2TV.jpg)


    The Raspberry Pi supports various flavors of operating systems you can install:(image_rsrc2TW.jpg)
    Once you download the Zip file, unzip it to get the image and save it on your
    Desktop. Once Etcher launches, it will show you an option that involves three
    stages: image selection, device selection, and flashing.(image_rsrc2TX.jpg)


    In the select image section, select the Raspbian image we just extracted. Select
    your SD card in the device section and mark it as the correct device to flash.
    Once done, select ‘flash’ to begin the flash process. The flash process may take
    up to 5 min based on your SD card’s write speed. Wait for the process to complete,
    eject the SD card, insert it into the Raspberry Pi, and then boot up the device.

