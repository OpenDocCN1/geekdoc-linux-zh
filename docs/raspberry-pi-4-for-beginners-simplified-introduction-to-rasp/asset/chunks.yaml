    that, we need to enable the I2C interface used by the OLED display for communication.You
    can use the raspi-config command-line tool or use GUI. Simply click on Preferences
    -> Raspberry Pi configuration – Interfaces – Enable I2C.![](image_rsrc2V4.jpg)![](image_rsrc2V5.jpg)Navigate
    to the main project folder and create a file called min-weather.py. Next, launch
    your text editor and enter the code below:![](image_rsrc2V6.jpg)![](image_rsrc2V7.jpg)![](image_rsrc2V8.jpg)Here
    is a sample output.![](image_rsrc2V9.jpg)And that concludes this project.PROJECT:
    4 LED Switch with Potentiometer (Intermediates Level)The next project on the list
    is an LED dimmer.This project works with an LED device and controls the LED brightness
    using a potentiometer. I know we have already covered an LED device in the first
    project, but this project shows you how to work with reading analog input signals
    and output modulations signals.Remember that we will require the skills we learn
    in this section for upcoming projects. Let’s have some fun.RequirementsFor this
    project, you will require the following basic items:


    *   Raspberry Pi board


    *   Solderless breadboard


    *   330 Ω Resistor


    *   5 mm LED


    *   Jumper cables


    *   A 10 kΩ potentiometer


    *   MCP 3008 Chip


    Understanding PotentiometersWe can define a potentiometer as a manually adjustable
    resistor. A potentiometer has a rotation contact that acts as a dial that helps
    with the manual adjustment of voltage for the electrical components. Potentiometers
    are readily available in various devices such as volume controllers, speed controllers
    for fans, brightness adjusting dials, etc.Below is an example of a 10 kΩ potentiometer:![](image_rsrc2VA.jpg)A
    potentiometer has three main parts. The first two outer pins connect to a resistive
    element, while the third pin connects to a conductive but adjustable wiper.![](image_rsrc2VB.jpg)For
    this project, we will use the resistance in the circuit to adjust the brightness
    of the LED device.Working with Analog Signals on Raspberry PiSince you’ve probably
    done some research by now, the potentiometer we are working with only uses analog
    signals. However, the Raspberry Pi GPIO can only read digital signals. That means
    the Raspberry Pi can read either a LOW (0 value) or HIGH (3.3 Volts) voltage and
    nothing in the middle.Since we will be adjusting the voltage between 0 and 3.3
    using the potentiometer, we need a way to read the values in between HIGH and
    LOW, thus allowing us to have variations in the brightness of the LED light. For
    this, shall use an analog-to-digital chip and then generate analog signals with
    a pulse-width modulator.Ensure to master the orientation of the chip as it is
    very critical.![](image_rsrc2VC.jpg) ![](image_rsrc2VD.jpg)As much as I would
    like to explain how these work, it is beyond this book’s scope. However, I have
    provided great resources; I highly recommend reading them before your build![https://www.arrow.com/en/research-and-events/articles/engineering-resource-basics-of-analog-to-digital-converters](https://www.arrow.com/en/research-and-events/articles/engineering-resource-basics-of-analog-to-digital-converters)[https://www.electronics-tutorials.ws/combination/analogue-to-digital-converter.html](https://www.electronics-tutorials.ws/combination/analogue-to-digital-converter.html)[https://learn.adafruit.com/raspberry-pi-analog-to-digital-converters/mcp3008](https://learn.adafruit.com/raspberry-pi-analog-to-digital-converters/mcp3008)![](image_rsrc2VE.jpg)
    The alignment of the MCP3008 chip is very VITAL, and you MUST Lay it out with
    the half-circle indentation facing the top, as shown above!Building the ProjectThe
    circuit build for this project is simple and should not take a long time. Simply
    follow the instructions below to perform this.


    *   Start by connecting the GND of the breadboard rail (blue)


    *   Next, connect the 3.3 V to the breadboard’s red rail.


    *   Add the MCP3008 chip in the center of the breadboard rails and connect it
    as follows.


    | MCP3008 | Raspberry Pi GPIO |


    | 1 | Potentiometer center lead |


    | 9 | GND |


    | 10 | GPIO 8 |


    | 11 | GPIO 10 |


    | 12 | GPIO 9 |


    | 13 | GPIO 11 |


    | 14 | GND |


    | 15 | 3.3 V |


    | 16 | 3.3 V |


    *   Connect the LED to the breadboard using the extended lead to Raspberry Pi
    GPIO 17 using a 330 Ω while the smaller end to the GND rail.


    *   For the last steps, select one of the outer tips of the potentiometer and
    connect it to GND. Select the other outer led and connect to 3.3 V.


    *   For the remaining middle tip of the potentiometer, connect it to the MCP3008
    chip pin 1.


    ![](image_rsrc2VF.jpg)Scripting the ProjectTime for coding again.Before we get
    to the script, let us enable the SPI communication protocol since the MCP3008
    chip uses this protocol to communicate with the Raspberry pi.[https://linkfy.to/LiH3f](https://linkfy.to/LiH3f)Open
    Preferences –> Raspberry Pi configuration –> Interface and enable SPI.![](image_rsrc2VG.jpg)Script
    LogicHere is a simple logic of how and what the script should do:


    *   First, we need to read the analog signal from the potentiometer using the
    MCP3008 converter chip.


    *   Next, we need to control the brightness of your LED using Pulse-Width Modulator


    *   Finally, adjust the duty cycle of Pulse Width Modulator conditioning to the
    value read from the potentiometer.


    For this script, we do not need external libraries apart from gpiozer o . In the
    projects folder, create a python file and call it adjust.py and enter the code
    shown below:![](image_rsrc2VH.jpg)PROJECT 5: Smoke & Gas Detector (Expert Level)Once
