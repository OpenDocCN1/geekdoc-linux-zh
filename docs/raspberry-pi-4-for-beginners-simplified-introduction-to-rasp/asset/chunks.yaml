    ### 要求

    对于此项目，我们需要以下组件。


    *   树莓派

    *   免面包板

    *   MQ-2 气体烟雾检测器

    *   压电蜂鸣器

    *   5 mm LED

    *   `MCP 3008` 芯片

    *   打火机

    *   按钮

    *   跳线

    *   330 Ω 电阻


