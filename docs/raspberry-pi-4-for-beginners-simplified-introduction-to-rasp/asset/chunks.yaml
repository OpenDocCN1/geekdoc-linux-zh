    the Raspberry Pi 4, released in June 2019.The Raspberry Pi 4 CPUAlthough significant
    changes have happened with each new release of the Raspberry Pi, all models feature
    a Broadcom System on Chip (Soc) with an ARM-compatible CPU. The Pi has a clock
    speed range of 700 MHz to 1.5 GHz on the Raspberry Pi 4. The Raspberry Pi 4 has
    a ARM Cortex-A72 quad-core processor, a successor to the Raspberry Pi 3 B+ processor
    quad-core Broadcom BCM2837BO that featured a clock speed of 1.4GHz.Modern Raspberry
    Pi processors support overclocking at boot by running the command sudo raspi-config
    during the boot process on Raspbian Linux-based distributions. Most of these processors
    are overclock-able up to 800MHz and 1000 MHz, and 1500 MHz on extreme edges.Raspberry
    Pi MemoryThe Raspberry Pi Foundation has done a great job of improving the device’s
    memory. Older models of the device featured 128MB allocated for the GPU, with
    another 128MB allocated to the CPU. The GPU in Raspberry Pi is the Broadcom Video-core
    VI. The Raspberry Pi 4 comes in flavors of 1GB, 2GB, and 4GB.Raspberry Pi NetworkingOlder
    Raspberry Pi models have no ethernet connectivity. The only way to connect them
    to the internet is using external USB ethernet or a USB wireless adapter.Newer
    models such as Raspberry pi B and B+ support gigabit ethernet and use it as the
    primary interface for connectivity. The latest Raspberry models, like the Raspberry
    Pi 4, also have an 802.11ac wireless interface and a BLE 5.0 Bluetooth. The Pi
    4 also has Gigabit ethernet.Raspberry Pi StorageThe default storage for the Raspberry
    Pi is a micro SD card. This SD card is what you will use to install the Operating
    system and as the default storage disk. However, the Pi supports external storage
    devices via USB ports.Those are the main features of the general Raspberry Pi.
    We may have left out some features specific to the Raspberry Pi 4—instead of the
    entire Raspberry family—let’s cover that now.Hardware Specifics for the Raspberry
    Pi 4As we have seen, the Raspberry Pi is a British-built, low-cost single-board
    computer that gives everyone the ability to learn computing, hacking, and programming
    with a lot of ease.The Raspberry Pi 4 is a small device whose size is similar
    to that of a credit card, but unlike a regular credit card, the Pi is a full-fledged
    computer that can run full operating systems.Because of its flexibility, the Pi
    4 gives you the ability to customize it by choosing an operating system of choice
    and the applications running on the device.Setting up the Raspberry Pi is simple
    but can be discouraging to complete beginners. This book will walk you through
    setting up the Raspberry Pi, from unboxing to using it to building automatic robots.Below
    is an image of the Raspberry Pi 4 with the exclusive features pointed out below.![](image_rsrc2T0.jpg)A
    Raspberry Pi 4 motherboard featureHere are the purposes of each of these features:'
