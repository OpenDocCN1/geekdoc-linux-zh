    # Understanding MQ-2 Gas and Smoke Detectors


    Let us discuss how the `MQ-2` smoke and gas sensor works. No worries, I’ll keep
    it short. The `MQ-2` sensor is sensitive to smoke and various flammable gases.
    Although some `MQ-2` sensors can only detect various gas classes, common gases
    such as hydrogen, alcohol, butane, propane, and methane are the default in most
    of these sensors.


    The sensor works by reading the concentration of gases in the surrounding area
    and sending an analog signal using an `MCP 3008` chip—discussed in the previous
    project. If the surrounding area has high concertation of the gases mentioned
    above, the system detects a high voltage output.


    You can also use another method to detect high gas concentrations. This method
    works best in an area that has a default concentration of these gases. In that
    case, you can set a specific threshold and then output a `HIGH` voltage signal
    if the level detected by the sensor is higher than the set threshold and a `LOW`
    voltage signal if the reverse is true.


    We can use a potentiometer from the `MQ-2` to adjust the threshold. The `MQ-2`
    sensor also has an `LED` indicator that you can use to warn the user if gas levels
    are higher than the threshold.


    ![](image_rsrc2VM.jpg) As a bonus, the `MQ-2` reads data using analog signals,
    which offers a quantitative method to measure the gas levels, helping you to define
    a better threshold value above which the alarm should activate. However, as we
    discussed in the previous section, the `Pi` only reads digital signals, and thus,
    we have to use the `MCP2008` chip for signal conversion.


    ## Building the Project


    Building this project should be fairly simple as we have covered how to connect
    `LED` and the `MCP2008`. Here are quick steps to build the circuit:


    *   Start by connecting the `GND` to the blue rail on the breadboard and the `3.3v`
    to the red rail on the breadboard.

    *   The next step is to lay the `MCP3008` chip in the center of the breadboard,
    ensuring the legs are parallel with either side of the center divider, as shown
    below.


    ![](image_rsrc2VN.jpg)


    *   Next wire the chip as follows:


    | MCP3008 | Connect With |

    | :--- | :--- |

    | 1 | `MQ-2 AO` |

    | 9 | `GND` |

    | 10 | `GPIO 8` |

    | 11 | `GPIO 10` |

    | 12 | `GPIO 9` |

    | 13 | `GPIO 11` |

    | 14 | `GND` |

    | 15 | `3.3 V` |

    | 16 | `3.3V` |


    Remember to align the `MCP3008` chip with the half-circle orientation facing up!


    *   Now, add the `MQ-2` smoke and gas detector to the breadboard and connect it
    as shown below:


    | MQ-2 | Connect With |

    | :--- | :--- |

    | VCC | `5 V` |

    | GND | `GND` |

    | AO | `MCP3008 Pin 1` |

    | DO | None |


    *_Following that is the `LED`. Connect it on the breadboard as discussed in previous
    projects. (anode to `GPIO 17` via `330 Ω` resistor, cathode to `GND` rail on the
    breadboard)

    *   Now for the pushbutton: Plug it in the middle of the breadboard with two leads
    on either side of the center divide.

    *   Place the bottom right lead to `GND`, and the bottom left to `GPIO 2`, ensuring
    both leads are connected on the same side of the divide as shown below.


    ![](image_rsrc2VP.jpg)


    *   Next, connect the buzzer to the breadboard with the black wire connecting
    to the `GND` rail while the red wire connects to `GPIO 27`


    Boom, we have the project all built up, and we can move on to the code side of
    things.


    ## Scripting the Project


    In the projects folder (yes, that one), create a python file and name it `gas_smoke_dect.py`.
    In the file, place the following code:


    ```

    ![](image_rsrc2VR.jpg

    ```

    Save the file and run. To activate the sensor, press the button.


    # PROJECT 6: Home Surveillance Camera (Beginner)


    Time for another project. In this project, we shall build a home surveillance
    system that allows you to stream a live feed of the surrounding area to a web
    interface. Using your browser, you can access the feed from any device connected
    to the same network as your `pi`. This project will be a blast!


    ## Requirements


    For this project, you require few components. They include:


    *   A `Raspberry Pi`

    *   A `Raspberry Pi` camera module.


    ## Building the Project


    This project does not require much wiring. All you need to do is connect the `Raspberry
    Pi` camera module and enable it. If you are familiar with how to do this, feel
    free to skip to the next section.


    ### Enabling the Camera


    Before we can use the camera, we need to enable the camera software on the `Pi`.
    Navigate to the `Preferences` –> `Raspberry Pi configuration` –> `Interfaces`
    as shown below.


    ![](image_rsrc2VS.jpg)


    For this project, we will work with the basic `Raspberry Pi` camera. However,
    if you wish to use a High-quality camera, consider the following resources.

    [https://linkfy.to/gcBM6](https://linkfy.to/gcBM6)

    [https://linkfy.to/IDkBe](https://linkfy.to/IDkBe)


    ### Connecting the Raspberry Pi Camera Module


    Before connecting the camera module to the Camera Serial Interface port, shut
    down the `pi` and unplug it from a power source. Refer to `Raspberry Pi Hardware`
    for `CSI Port`. Here is an image of the Camera Module


    ![](image_rsrc2VT.jpg) ![](image_rsrc2VU.jpg)


    With the blue section on the `Raspberry Pi` camera module strip facing up, connect
    the camera to the port.

    [https://linkfy.to/tHvwY](https://linkfy.to/tHvwY)


    ### Recording Video on Raspberry Pi


    In Python programming, we would generally have to use a library like `OpenCV`
    to record video and capture images. However, in `raspberry pi`, we use the `picamera`
    library.


    Before moving further, we need to save the video footage to a file. The code below
    should do this quickly.


    ```

    ![](image_rsrc2VV.jpg

    ```

    After scripting the code above, we can start recording video footage and saving
    it to a file titled `footage`. You are free to save the file in any filename you
    find suitable. However, ensure you have the `.h264` extension as the system relies
    on it to record video. Learn more from the resource provided below:

    [https://linkfy.to/EJFYX](https://linkfy.to/EJFYX)


    ### Scripting the Full project


    For those of us who love code, this is the fun part. We shall create a script
    hosted on the `Raspberry pi` server—WebServer projects are in later sections!


    #### Script Logic


    Let us discuss the basic logic the script follows.


    *   First, create a `WebServer` to host the interface.

    *   Gather the web application and render it.

    *   Code the `WebServer` to include the stream from the camera.

    *   Expose the `WebServer` for external access – Devices in the same network as
    the `Raspberry Pi`.

    *   Set a password to access the web interface.


    #### Coding the Project


    In the projects folder we created earlier, initialize a new python file, and name
    it `home_surv.py`. In the file, enter the code as follows. – Learn more about
    the code implementation from the resource:

    [https://linkfy.to/3A0sB](https://linkfy.to/3A0sB)

    ![](image_rsrc2VW.jpg) ![](image_rsrc2VX.jpg) ![](image_rsrc2VY.jpg) ![](image_rsrc2VZ.jpg)
    ![](image_rsrc2W0.jpg) ![](image_rsrc2W1.jpg)


    # PROJECT 7: Telegram Bot (Beginner Level)


    Let’s build a simple telegram bot that allows you to chat from your `pi`. This
    project is simple and should not take a lot of time.


    ## Requirements


    For this project, you are going to need the following:


    *   A `Raspberry Pi`

    *   `5 mm LED`

    *   `Jumper Cables`

    *   `Solderless breadboard`

    *   An Active telegram account

