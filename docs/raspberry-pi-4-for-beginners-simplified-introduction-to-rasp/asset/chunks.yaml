    \ that we shall use to write the code for our display.![](image_rsrc2UT.jpg)![](image_rsrc2UU.jpg)![](image_rsrc2UV.jpg)![](image_rsrc2UW.jpg)\n\
    \nIf you want to understand the code better and how it works, consider the following\
    \ resources:\n[https://github.com/adafruit/Adafruit_CircuitPython_CharLCD](https://github.com/adafruit/Adafruit_CircuitPython_CharLCD)\
    \ [https://circuitpython.org/](https://circuitpython.org/) [https://github.com/micropython/micropython](https://github.com/micropython/micropython)\n\
    \nUsing the LCD, you can expand the project to display data like weather data,\
    \ warning messages, etc.\n\n# PROJECT 3: Simple Weather Station (Beginner Level)\n\
    \nWelcome to another Raspberry Pi Display project, where we shall learn how to\
    \ use OLED displays to display information. However, for this project, we will\
    \ not display simple text. Instead, we shall build a simple weather station and\
    \ use API requests to display weather information for your specific area. We will\
    \ build a full-fledged weather forecast in upcoming projects. Stay tuned for that!\n\
    \n## Requirements\n\nFor this project, you will need the following components:\n\
    \n*   Raspberry Pi, as usual\n*   Solderless breadboard\n*   `Adafruit_SSD1306`\
    \ Library\n*   Jumper Cables\n*   Monochrome 0.96” 128x64 OLED Graphic Display\
    \ [https://www.amazon.com/DIYmall-Serial-128x64-Display-Arduino/dp/B00O2KDQBE](https://www.amazon.com/DIYmall-Serial-128x64-Display-Arduino/dp/B00O2KDQBE)\n\
    \n## Understanding OLED Displays\n\nThis project deals with Organic Light Emitting\
    \ Diode, a type of display that allows you to select which pixels to turn on or\
    \ off. This functionally allows you to display any text or icon at any point on\
    \ your display. Unlike LCD that reserve space of 5 x 8 for each character, OLED\
    \ are much more flexible. In addition, OLED displays do not need backlighting,\
    \ making these display types ideal to use, especially in dark settings.\n\nFor\
    \ this project, we shall use a mono-color 0.96” display that has 128 x 64 pixels.![](image_rsrc2UX.jpg)\
    \ Depending on the model of the OLED Display you are using, you will typically\
    \ have 4 main pins: `VCC`, `GND`, `SCL`, and `SDA`. Ensure to pay attention to\
    \ the wiring instructions given.\n\nFor OLED displays that use Inter-integrated\
    \ Circuit communication protocols, you will need the `SDA` and `SCL` pins on the\
    \ Raspberry Pi. These correspond to `GPIO 2` and `GPIO 3` in that order.![](image_rsrc2UY.jpg)\n\
    \n## APIs Quick Guide: OpenWeather\n\nHere is a quick introduction to APIs. APIs,\
    \ or Application Programming Interfaces, are functions developed by programmers\
    \ to expose their services to anyone who wants to use it. For example, the `VirusTotal`\
    \ API allows you to scan files for viruses without developing a personal virus\
    \ engine.\n\nIn this project, we shall use the `OpenWeather` API that will allow\
    \ us to request weather information for a given language. As usual, we shall use\
    \ `Python` to make these requests. APIs are very useful because they allow you\
    \ to get accurate and up-to-date data about a specific item.\n\n*   Launch your\
    \ browser and navigate to [https://openweathermap.org/api](https://openweathermap.org/api)\n\
    *   Next, create an account to get access to the API. Next, in the `Subscribe`\
    \ button, select current weather data.![](image_rsrc2UZ.jpg)\n\nNext, in your\
    \ account dashboard, select the `API Keys` tab to access your API key.![](image_rsrc2V0.jpg)\
    \ Now copy the default API key and perform a simple API request. You are free\
    \ to use any API client such as `curl` or `Postman` to do so.\n\nOpen the browser\
    \ and make the following request:\n`api.openweathermap.org/data/2.5/weather?q={city\
    \ name}&appid={API key}`\nwhere `city name` is the city you want info about, and\
    \ `API key` is your API key.\n\nHere is an example:\n```json\n//api.openweathermap.org/data/2.5/weather?q=Colorado,CO&appid=4d900c2121e762865e9fc5b5095343ad\n\
    ```\nThis request will return weather information of the requested city in JSON\
    \ format as shown below:\n\n```json\n{\n  \"coord\": {\n    \"lon\" : - 74.88\
    \ ,\n    \"lat\" : 8.06\n  },\n  \"weather\": [\n    {\n      \"id\" : 804 ,\n\
    \      \"main\": \"Clouds\",\n      \"description\": \"overcast clouds\",\n  \
    \    \"icon\" : \"04d\"\n    }\n  ],\n  \"base\": \"stations\",\n  \"main\": {\n\
    \    \"temp\" : 296.95 ,\n    \"feels_like\": 301.93 ,\n    \"temp_min\": 296.95\
    \ ,\n    \"temp_max\": 296.95 ,\n    \"pressure\": 1011 ,\n    \"humidity\": 96\
    \ ,\n    \"sea_level\": 1011 ,\n    \"grnd_level\": 1007\n  },\n  \"visibility\"\
    : 10000 ,\n  \"wind\": {\n    \"speed\" : 0.48 ,\n    \"deg\" : 94\n  },\n  \"\
    clouds\": {\n    \"all\" : 99\n  },\n  \"dt\" : 1606392940,\n  \"sys\": {\n  \
    \  \"country\": \"CO\",\n    \"sunrise\" : 1606388166,\n    \"sunset\" : 1606430298\n\
    \  },\n  \"timezone\": -18000 ,\n  \"id\" : 3673976,\n  \"name\": \"Colorado\"\
    ,\n  \"cod\" : 200\n}\n```\n\nThe data resulting from an API request—such as the\
    \ data shown above—is JSON format. JSON, or JavaScript Object Notation, is a standard\
    \ for data exchange between server and client or server to server. The following\
    \ are standards used by JSON data:\n\n*   Data is presented in dictionary format,\
    \ i.e., Name and value pair.\n*   A colon separates the name and value.\n*   A\
    \ comma separates a set of name and value pairs.\n*   Curly braces hold JSON objects\
    \ while Square brackets hold JSON arrays.\n\n## Making API Requests with Python\n\
    \nBy now, we have a URL that can make an API request and return weather data.\
    \ Now, let us see how we can make these requests using Python.![](image_rsrc2V1.jpg)From\
    \ the above code, we use the Apache request Library to make `HTTP GET` requests\
    \ to the OpenWeather. You can learn more from the resource provided below.[https://requests.readthedocs.io/en/master/](https://requests.readthedocs.io/en/master/)\n\
    \n## Building the Project\n\nWiring the OLED display for this project is quick\
    \ and easy. Simply follow the table provided below.\n\n| OLED Pin |\n| :--- |\n\
    | Vcc |\n| Gnd |\n| SCL |\n| SDA |\n"
