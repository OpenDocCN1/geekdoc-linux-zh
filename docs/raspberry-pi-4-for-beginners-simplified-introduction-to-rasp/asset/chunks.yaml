- fmt: "\n* VNC and SSH connections.\n\n### Requirements\nAll you need for this project\
    \ is:\n* A Raspberry pi\n* A Psad package\n* Python\n\n### Setting up the Project\n\
    To install this, first, update the system and install the Psad package using the\
    \ commands:\n```bash\napt-get install psad\n```\nNext, download a shell script\
    \ that will assist in the installation process. \n```bash\nwget https://github.com/mattymcfatty/HoneyPi/archive/master.zip\n\
    ```\nUnzip the file and navigate to the directory.\n```bash\nunzip master.zip\
    \ && cd HoneyPi-Master\n```\nFinally, set execute permissions and run the script\
    \ as sudo using the commands:\n```bash\nchmod 755 *.sh\nsudo ./honeyPiInstaller.sh\n\
    ```\nNOTE: This will affect your Raspberry Pi’s `iptables`; be CAREFUL .\n\n##\
    \ PROJECT 25: Installing CentOS on Raspberry Pi (Beginner)\nIn this project, we\
    \ will look at how to install CentOS on a Raspberry Pi. CentOS is a free and open-source\
    \ Linux distribution used in servers and web hosting. It is a free repo of Red\
    \ Hat Linux.\n\n### Requirements\nAll you need for this project is:\n* A Raspberry\
    \ Pi\n* SD Card\n* Network Connection\n\n### Setting up the Project\nThe first\
    \ step is to download an ISO image of CentOS. You can download it from the official\
    \ CentOS project website.\n`https://mirrors.xtom.com/centos-altarch/7.9.2009/isos/armhfp/`\n\
    If you have a Desktop Environment preference, choose from the mirror and download\
    \ its ISO. However, if you are fully comfortable with a terminal session, download\
    \ the minimal version.\nNext, download Balena Etcher—we have covered this in previous\
    \ projects—, and flash the image to the SD card. Insert the card into your Pi\
    \ and boot it up. Depending on the Desktop Environment you choose, you will get\
    \ a welcome window.\nFollow the installation steps and complete the process to\
    \ boot into your OS.\nNOTE : The default username and password are `root` and\
    \ `centos`, respectively.\n\n## PROJECT 26: Setting up Web Min (Beginner Level)\n\
    We have finally arrived at the final project. In this project, we shall set up\
    \ Web Min, a simple and effective system administration tool for Apache, SQL,\
    \ Postfix, DHCP, etc.\nWe will not dive into how to set up these services. You\
    \ can learn more from the official web min wiki.\n`https://doxfer.webmin.com/Webmin/Main_Page`\n\
    \n### Setting up Project\nStart by updating your Raspberry Pi installation.\n\
    ```bash\nsudo apt-get update && sudo apt-get upgrade\n```\nNext, install the packages\
    \ required to run Web Min using the command.\nNext, download the installer package\
    \ from the following link.\n`https://www.webmin.com/download.html`\n```bash\n\
    wget https://prdownloads.sourceforge.net/webadmin/webmin_1.962_all.deb\n```\n\
    Proceed with the installation process.\n```bash\nsudo dpkg –i webadmin_1.962_all.deb\n\
    ```\nOnce the installation completes, access Webmin using the url `http://localhost:10000`\n\
    Enter username and password as `pi` and `raspberry`, respectively.\n\n### Conclusion\n\
    This book covered a wide range of topics, from basic Raspberry Pi installation,\
    \ configuration hardware, and much more. We have also used creative projects to\
    \ learn how to use the Raspberry Pi to create amazing tools that solve real-world\
    \ problems.\nAlthough the book is extensive, it does not cover everything. There\
    \ is a lot we didn’t cover about how we can use Raspberry Pi. My advice to you\
    \ is to use the resource available to you to utilize the power of the Raspberry\
    \ Pi.\nWith that in mind, here is a list of other innovative projects you can\
    \ try:\n* A Multi-colored LED device\n* Master Weather Station with SenseHAT.\n\
    * Bugler Alarm\n* Remote Controlled Robot\n* Smart Plant Monitoring System\n*\
    \ ISS Location Tracker\n\nThere is much more to discover now that you know how\
    \ to use your Raspberry Pi 4.\nHappy experimenting, and keep learning!\n\n***\n"
