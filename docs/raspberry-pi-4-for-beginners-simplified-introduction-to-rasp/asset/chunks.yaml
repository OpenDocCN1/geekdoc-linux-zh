    \n## Section 1: Getting Started\n\nThroughout the book, I will use various conventions,\
    \ such as using a different style for source code and adding icons to enhance\
    \ the book’s message. Also, ensure to read any warnings or cautions provided in\
    \ the book to prevent harming yourself or damaging the devices.\n\n### Requirements\n\
    \nFor most of the first part, you will only need a Raspberry Pi device. I recommend\
    \ buying the `Raspberry Pi 4` or `Raspberry Pi 400`. Since these are the latest\
    \ models in the Raspberry Pi line, they provide a wide range of features for developing\
    \ simple and complex projects. For the sake of simplicity, consider purchasing\
    \ a kit set. Although this is not all you require to get through all the projects,\
    \ it will get you started and in tune.\n\n### Getting to Know the Raspberry Pi\n\
    \nThe Raspberry Pi device is a small, single-board, but remarkable fully-fledged\
    \ computer developed to bridge the gap between cost and functionality. Whether\
    \ you want a normal pc, write complex programs, or even dabble in engineering,\
    \ and physical devices, the Raspberry Pi has you covered.\n\nA Raspberry Pi device\
    \ is a single board computer. That means it’s a full computer like any desktop,\
    \ only printed on a single board. The size of the `raspberry pi` is not directly\
    \ proportional to its size. For example, modern versions of the Raspberry Pi can\
    \ keep up with some desktop computers with the same accuracy and speed. Since\
    \ its initial release back in 2012, wide selection of people, from engineers to\
    \ company executives, have received the `raspberry pi` and adapted to using it.\
    \ The Raspberry Pi has powered great projects like autonomous boats to devices\
    \ in space. The `raspberry` is (clearly) a powerful tool.\n\nSince the initial\
    \ devices, the Raspberry Pi model B, in association with Broadcom, the Raspberry\
    \ Pi Foundation has released various models of the Raspberry Pi. Each model adds\
    \ new features and improved specifications designed for particular use cases.\
    \ Models such as the Raspberry Pi Zero, a tiny version of the full-size Raspberry\
    \ Pi, comes with amazing features such as networking and USB ports, all in favor\
    \ of a smaller size, low power consumption, and compatibility.\n\nCompatibility\
    \ is a key feature in all Raspberry Pi models. Software developed to run on a\
    \ specific model will run in other models as well. You can install the latest\
    \ version of the Raspbian OS in the first Raspberry Pi model. You will have to\
    \ sacrifice some performance of, but it will successfully run. As we progress\
    \ and learn about the Raspberry Pi, I will stick to the latest model, the `Raspberry\
    \ Pi 4 Model B` and `Raspberry Pi 400`. However, what you will learn in the book\
    \ is accurate and adaptable to other `raspberry pi` models. The projects discussed\
    \ in the book are also compatible with any `raspberry pi` model, and you can have\
    \ fun and learn on any Pi device you have.\n\n### Guided Journey of The Raspberry\
    \ Pi Internals\n\nEven with the power and fame of the Raspberry Pi devices, we\
    \ cannot work with the device well without knowing its various components. In\
    \ this section, we shall discuss everything about the `raspberry pi`’s hardware.\
    \ Unlike a typical desktop or laptop, the Raspberry Pi exposes all interior components\
    \ for you to play with and explore. This “exposure” is one of the reasons why\
    \ the Raspberry Pi is so famous. Although you can purchase a case to protect the\
    \ device, it’s best to leave it exposed when you’re working with physical components\
    \ and circuits.\n\n![](image_rsrc2SY.jpg)\n\nThe following are some of the `raspberry\
    \ pi 4 model B` components—shown from an aerial perspective. To avoid confusion\
    \ when using this book, always keep it in this layout. Based on how basic it looks,\
    \ understanding the Raspberry Pi may seem confusing at first. However, it is easy\
    \ to understand, starting with peripheral components to the internal hardware\
    \ that powers it.\n\n![](image_rsrc2SZ.jpg)\n\n### Hardware Configuration\n\n\
    One of the Raspberry Pi’s key features is its flexibility. You can buy a Raspberry\
    \ Pi kit equipped with complete hardware components and the Operating system to\
    \ run it.\n\nNOTE: Like the Raspberry Pi, the hardware components that drive the\
    \ Pi have advanced exponentially over the years, with each Pi model having features\
    \ that differ from that of its predecessors. We shall focus only on the latest\
    \ model, the Raspberry Pi 4, released in June 2019.\n\n#### The Raspberry Pi 4\
    \ CPU\n\nAlthough significant changes have happened with each new release of the\
    \ Raspberry Pi, all models feature a Broadcom System on Chip (`Soc`) with an ARM-compatible\
    \ CPU. The Pi has a clock speed range of 700 MHz to 1.5 GHz on the Raspberry Pi\
    \ 4. The Raspberry Pi 4 has a ARM `Cortex-A72` quad-core processor, a successor\
    \ to the Raspberry Pi 3 B+ processor quad-core Broadcom `BCM2837` that featured\
    \ a clock speed of 1.4GHz. Modern Raspberry Pi processors support overclocking\
    \ at boot by running the command `sudo raspi-config` during the boot process on\
    \ Raspbian Linux-based distributions. Most of these processors are overclock-able\
    \ up to 800MHz and 1000 MHz, and 1500 MHz on extreme edges.\n\n#### Raspberry\
    \ Pi Memory\n\nThe Raspberry Pi Foundation has done a great job of improving the\
    \ device’s memory. Older models of the device featured 128MB allocated for the\
    \ GPU, with another 128MB allocated to the CPU. The GPU in Raspberry Pi is the\
    \ Broadcom Videocore VI. The Raspberry Pi 4 comes in flavors of 1GB, 2GB, and\
    \ 4GB.\n\n#### Raspberry Pi Networking\n\nOlder Raspberry Pi models have no ethernet\
    \ connectivity. The only way to connect them to the internet is using external\
    \ ethernet or a USB wireless adapter. Newer models such as Raspberry pi B and\
    \ B+ support gigabit ethernet and use it as the primary interface for connectivity.\
    \ The latest Raspberry models, like the Raspberry Pi 4, also have an 802.11ac\
    \ wireless interface and a BLE 5.0 Bluetooth. The Pi 4 also has Gigabit ethernet.\n\
    \n#### Raspberry Pi Storage\n\nThe default storage for the Raspberry Pi is a micro\
    \ SD card. This SD card is what you will use to install the Operating system and\
    \ as the default storage disk. However, the Pi supports external storage devices\
    \ via USB ports. Those are the main features of the general Raspberry Pi. We may\
    \ have left out some features specific to the Raspberry Pi 4—instead of the entire\
    \ Raspberry family—let’s cover that now.\n\n### Hardware Specifics for the Raspberry\
    \ Pi 4\n\nAs we have seen, the Raspberry Pi is a British-built, low-cost single-board\
    \ computer that gives everyone the ability to learn computing, hacking, and programming\
    \ with a lot of ease. The Raspberry Pi 4 is a small device whose size is similar\
    \ to that of a credit card, but unlike a regular credit card, the Pi is a full-fledged\
    \ computer that can run full operating systems. Because of its flexibility, the\
    \ Pi 4 gives you the ability to customize it by choosing an operating system of\
    \ choice and the applications running on the device. Setting up the Raspberry\
    \ Pi is simple but can be discouraging to complete beginners. This book will walk\
    \ you through setting up the Raspberry Pi, from unboxing to using it to building\
    \ automatic robots.\n\n![](image_rsrc2T0.jpg)\n\nA Raspberry Pi 4 motherboard\
    \ feature\n\nHere are the purposes of each of these features:\n"
