    to the GPIO header using a program you create. You can use the GPIO pins for both
    input and output.We will learn how to connect and interact with the GPIO header
    using python in upcoming sections.![](image_rsrc2U4.jpg)The GPIO header has 40
    (male) metallic pins. Some pins are accessible for use in physical computing;
    some provide power to some hardware; others provide a communication interface
    with additional hardware such as sensors that collect and send data to the Raspberry
    Pi.![](image_rsrc2U5.jpg)NOTE: The Raspberry Pi 400 contains similar GPIO header
    pinouts, but in the Pi 400, the header pinouts have a reverse order alignment
    compared to other Raspberry Pi models. Although the GPIO header has labeling on
    the Raspberry Pi, it can be easy to forget. Ensure to double-check before connecting
    any device.There are several categories of pin types, each of which has a particular
    function:![](image_rsrc2U6.jpg)Electronic ComponentsThe Raspberry pi’s GPIO header
    is half of the items you require to start hardware programming on the Raspberry
    Pi. The other half features electrical components, which are devices you control
    from using the GPIO header. There is a wide range of electrical components, but
    most of them use common parts.Solderless breadboardA solderless breadboard, or
    simply a breadboard, is an electronic component you can use to make physical computing
    easier. The breadboard allows you to connect various components into the metal
