    # Setting up the Project

    To set up the project, we will go step by step, installing and configuring each
    service at a time.


    ## Installing and Configuring Apache

    Apache is a simple and popular web server you can install on a Raspberry Pi running
    Raspbian OS, allowing you to host and serve web pages to your local network. It’s
    good to note that basic Apache only supports static HTML files over HTTP protocol.
    However, with additional modules and configuration, you can serve multiple dynamic
    web pages such as those created using `PHP`.


    To install apache on Raspbian OS, Launch the Terminal from the main menu and enter
    the following command—ensure to run the command as `sudo`:


    ```bash

    apt-get update && apt-get install apache2 –y

    ```


    Once you have installed apache, you can test whether it’s working. Inside the
    folder that you will use to host your web applications, apache creates a default
    `index.html` file that you can use to test for connection on any device in the
    same network as the Raspberry pi.


    To test if apache is working, open your browser and enter the URL as `http://localhost`.
    That should launch an apache welcome page similar to the one shown below— this
    indicates that Apache is working.


    ![](image_rsrc2WA.jpg)


    You can also view the page using the Raspberry Pi’s IP address. For example, `http://192.168.0.12`.
    You can edit the default `index.html` file. You will find this file located in
    `/var/www/html/index.html`.


    ## Installing and Configuring PHP

    `PHP` is a popular and powerful preprocessor language. We can aptly classify it
    as a backend language that handles browser requests. Unlike HTML, which is static,
    `PHP` can display different content types based on the type of request and action
    performed. Since we shall run WordPress, which is in `PHP`, we need to install
    it, allowing apache and `PHP` to work together.


    To install the `PHP` package, use the following command:


    ```bash

    sudo apt-get install php –y

    ```


    To test if `PHP` is working, create a file and name it `index.php` inside the
    `/var/www/html/`. Ensure to rename `index.html` to `index.html.bak` ; HTML files
    have higher precedence than `PHP`.


    Inside the `index.php` file, enter the following lines of code:


    ```php

    <?php echo “Hello, world!”; ?>

    ```


    Save the file and open the server from `http://localhost` or use the Raspberry
    Pi’s IP address. You may need to restart the apache service using the command:


    ```bash

    sudo service apache2 restart

    ```


    Executing this command will display the text hello world in your browser.


    ## Installing and Configuring MariaDB

    MariaDB is a database engine you can use to work with SQL data. Its main use is
    in webservers, but it also works well with `PHP`-based applications.


    You can install MariaDB and `PHP-MySQL` package using the command:


    ```bash

    sudo apt-get install mariadb-server php-mysql –y && sudo service apache2 restart

    ```


    ## Installing WordPress

    WordPress is a popular open-source CMS written in `PHP`. You can use it to build
    a wide range of websites such as blogs. To install WordPress, open your browser
    and download the latest `.tar.gz` or `zip` package of WordPress from: `https://wordpress.org/download/`


    ![](image_rsrc2WB.jpg)


    Once downloaded, move the archive file to `/var/www/html/`. Ensure to delete all
    existing files inside the directory.


    ```bash

    cd /var/www/html && sudo rm –rf * && sudo wget http://wordpress.org/latest.tar.gz

    ```


    Next, extract the archive inside the folder and move all the files inside the
    WordPress folder into `/var/www/html/`


    ![](image_rsrc2WC.jpg)


    Change the ownership of all files inside the `/var/www/html/` to the Apache user


    ![](image_rsrc2WD.jpg)


    ## Setting up WordPress Database

    To run your WordPress site, you need to have a database on which to store data.
    Installing MariaDB earlier allows us to do this quickly.


    First, run the command to open a MySQL secure installation terminal session.


    ```bash

    sudo mysql_secure_installation

    ```


    ![](image_rsrc2WE.jpg)![]()image_rsrc2WF.jpg)![]()image_rsrc2WG.jpg)


    Once you have completed the MySQL configuration, open a MySQL terminal session
    using the command:


    ```bash

    sudo mysql –u root –p

    ```


    and enter the password you set in the above section. Next, create a database for
    your WordPress site:


    ```sql

    create database wpdb;

    ```


    Ensure to close your SQL syntax with the semicolon. For more guidance on how to
    work with SQL, consider the following resource: `https://www.amazon.com/dp/B07Y53QYXK`


    Next, you need to grant the database privileges to the root account. Remember
    to specify a unique password after the `IDENTIFIED BY` statement.


    ```sql

    GRANT ALL PRIVILEGES ON wpdb.* TO ''root''@''localhost'' IDENTIFIED BY ''<YourPassword>'';

    ```


    The final step for the MySQL part is to flush the database privileges using the
    command:


    ```sql

    FLUSH PRIVILEGES;

    ```


    Now reboot your Raspberry Pi and begin the WordPress installation.


    Open your browser and navigate to `http://localhost`. That should launch your
    WordPress installation instance. Choose your language and click Continue.


    In the next screen, click on let’s go and enter the configuration details as:

    - Database Name: `wpdb`

    - User Name: `root`

    - Password: `<YOUR PASSWORD>`

    - Database Host: `localhost`

    - Table Prefix: `wp_`


    Once connected, click on Run Install to begin the WordPress installation process.
    Next, fill out the details such as Site Title, admin username, password, etc.


    With the installation completed, feel free to customize WordPress as you wish.
    You can change themes, create posts, add plugins, and much more. The WordPress
    dashboard is also intuitive and easy to navigate.


    # PROJECT 9: Nagios Network Monitor (Beginner Level)

    In this project, we shall set up Nagios, which allows you to monitor devices on
    a network. If you want to monitor home devices or servers, Nagios will be very
    helpful. Although it is an easy tool to install and configure, it requires a Linux
    box to run, and having a full PC dedicated to Nagios is not effective. Hence,
    we can run to the Pi.


    Before we begin setting things up, Nagios is an incredible tool with a lot of
    configuration settings. It is very easy to find many monitoring options and activate
    all of them, which makes the processes of using Nagios counter-productive. Therefore,
    activate and use the only critical settings you require.


    ## Requirements

    This project requires the following resources:


    *   Raspberry Pi


    *   Nagios Core


    *   Wired or Wireless network.

