  \n\n一个明显的缺陷是 Linux 没有一个单一工具可以提供特定进程的所有相关性能统计数据。`ps` 在原始 UNIX 中是为了填补这一空白而设计的，在 Linux\
  \ 上它表现得很不错，但并没有涵盖其他商业 UNIX 实现提供的所有统计数据。某些统计数据对于追踪性能问题是无价的——例如，`inblk`（读入 I/O 块）和\
  \ `oublk`（写 I/O 块），它们指示了进程使用的磁盘 I/O 量；`vcsw`（自愿上下文切换）和 `invcsw`（非自愿上下文切换），通常表示进程被移出\
  \ CPU；`msgrcv`（在管道和套接字上接收的消息）和 `msgsnd`（在管道和套接字上发送的消息），显示了应用程序使用的网络和管道 I/O 量。一个理想的工具应该包含所有这些统计数据，并将目前介绍的许多性能工具的功能（包括\
  \ `oprofile`、`top`、`ps`、`strace`、`ltrace` 和 `/proc` 文件系统）整合到一个应用程序中。用户应该能够让这个程序指向一个进程，并提取所有重要的性能统计数据。每个统计数据都将实时更新，使用户能够在应用程序运行时对其进行调试。它会将同一个调查区域的统计数据分组在同一个位置。\n\
  \n例如，如果我正在调查内存使用情况，它将准确地显示内存如何在堆、栈、库、共享内存以及 `mmap` 中被使用。如果某个内存区域远高于我的预期，我可以向下钻取，这个性能工具将准确地告诉我是哪些函数分配了这些内存。如果我正在调查\
  \ CPU 使用情况，我将从整体统计数据开始，例如花费在系统时间和用户时间上的对比，以及特定进程发了多少次系统调用，然后我能够深入到系统时间或用户时间，准确看到是哪些函数消耗了所有时间以及它们被调用的频率。一个使用适当的现有工具来收集和合并这些信息的智能\
  \ Shell 脚本将对实现某些功能大有裨益，但要完全实现这一愿景，必须对某些工具的行为进行根本性的改变。\n\n## 13.2.2 缺陷 2：没有可靠且完整的调用树\n\
  \n下一个性能工具的缺陷是，目前没有办法提供程序执行的完整调用树。Linux 有若干个不完整的实现。`oprofile` 提供调用树生成，但它是基于采样的，因此它无法捕获每一次调用。`gprof`\
  \ 支持调用树，但除非特定进程调用的每个库都编译了性能分析支持，否则它无法对整个应用程序进行剖析。最有前景的工具 `valgrind` 有一个名为 `calltree`\
  \ 的外壳，在第 5.2.5 kcachegrind 第 5 章 “性能工具：进程特定内存”章节中描述，其目标是提供一个完全准确的调用树。然而，它仍然处于开发中，并且不支持所有的二进制文件。\n\
  \n即使这个调用树工具会显著降低应用程序运行时的性能，它也是很有用的。常用的方法是运行 `oprofile` 来确定应用程序中的哪些函数是“热点”，然后运行调用树程序来确定应用程序为什么要调用它们。`oprofile`\
  \ 步骤将提供应用程序在全速运行时瓶颈的准确视图，而调用树即使运行得缓慢，也会显示应用程序是如何以及为什么要调用那些函数。唯一的问题是如果程序的行为对时间敏感，并且在运行缓慢时发生变化（例如某些依赖网络或磁盘\
  \ I/O 的东西）。然而，存在许多问题对时间不敏感，准确的调用树机制将有助于解决这些问题。\n\n## 13.2.3 缺陷 3：I/O 归属\n\nLinux\
  \ 目前最后一个最大的缺陷是 I/O 归属问题。目前，Linux 没有提供一种好的方法来追踪哪些应用程序使用了大量的磁盘甚至网络 I/O。\n\n一个理想的工具应该实时显示特定进程使用的磁盘和网络\
  \ I/O 的输入和输出字节数。工具将以原始带宽的形式显示统计数据，以及该子系统能够提供的原始 I/O 百分比。此外，用户还可以划分统计数据，以便查看每个单独的网络和磁盘设备的相同统计数据。\n\
  \n## 13.3 Linux 上的性能优化\n\n尽管存在上述缺陷，Linux 仍然是发现和修复性能问题的理想场所。它是由开发者为开发者编写的，因此它对性能调查人员非常友好。Linux\
  \ 的几个特性使其成为追踪性能问题的绝佳平台。\n\n### 13.3.1 可用源码\n\n首先，开发者可以访问整个系统的大部分（如果不是全部）源码。在追踪似乎存在于你的代码之外的问题时，这是无价的。在没有源码的商业\
  \ UNIX 或其他操作系统上，你可能必须等待供应商调查问题，而且如果问题是他们的，你无法保证他们会修复它。然而，在 Linux 上，你可以自己调查问题，并准确找出性能问题发生的确的原因。如果问题在你的应用程序之外，你可以自己调查问题，并准确找出性能问题发生的确的原因。\n\
  \n### 13.3.2 易联系开发者\n\nLinux 的第二个优势是相对容易找到并联系特定应用程序或库的开发者。与大多数专有操作系统相比（后者很难确定哪位工程师负责某段代码），Linux\
  \ 要开放得多。通常，特定软件的开发者的名称或联系信息会包含在软件包中。联系开发者允许你询问关于某些代码的行为、运行缓慢的代码意图何什么，以及执行给定的优化是否安全。开发者们通常非常乐意提供这些帮助。\n\
  \n### 13.3.3 Linux 仍然很年轻\n\nLinux 作为一个优化性能的绝佳平台的最后一个原因是它仍然很年轻。新功能仍在开发中，Linux 有许多机会发现并修复直接的性能\
  \ Bug。由于大多数开发者专注于添加功能，性能问题可能会被搁置未解决。雄心勃勃的性能调查者可以在不断发展的 Linux 中发现并修复许多小的性能问题。这些小修复不仅不仅限于个人，更造福了整个\
  \ Linux 社区。\n\n## 13.4 章总结\n\n在本章中，我们调查了 Linux 性能工具集存在缺陷的几个领域，并提出了一些理想的解决方案。我们还讨论了为什么\
  \ Linux 是一个尝试性能调查和优化的良好平台。\n\n改进 Linux 性能取决于你读者。Linux 性能和 Linux 性能工具的改进机会随处可见。如果你发现了一个困扰你的性能问题，请修复它或向开发者报告并与他们合作修复。无论何种方式，都不会其他人受到该问题的影响，整个\
  \ Linux 社区都将受益。\n\n\n\n\n\n# 附录 A. 性能工具的位置\n\n书中描述的性能工具源自互联网上的许多不同地方。幸运的是，大多数主流发行版已经将它们整合在一起并包含在当前版本的发行版中。表\
