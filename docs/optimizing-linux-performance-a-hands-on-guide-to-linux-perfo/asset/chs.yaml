  \ 显示了 `sandbox` 的 `strace` 摘要，其中 `prelink` 链接了所有的二进制文件。\n\n### Listing 12.21.\n\n\
  ```\n execve(\"/usr/sbin/prelink\", [\"/usr/sbin/prelink\", \"-C\", \"new_cache2\"\
  ,\n\n\"-q\", \"sandbox2/\"], [/* 20 vars */]) = 0\n\n% time     seconds  usecs/call\
  \     calls    errors syscall\n\n------ ----------- ----------- --------- ---------\
  \ ----------------\n\n 54.29    0.088766          15      5795           lstat64\n\
