  \ nautilus 源码 `rpm` 包，这会将 nautilus 的源码放置在 `/usr/src/redhat/SOURCES/` 中。通过使用 Red\
  \ Hat 的源码包，我们获得了 Red Hat 用于创建包中二进制文件所使用的完全源码和补丁。调查用于创建我们正在研究的二进制文件的源码是非常重要的，因为另一个版本可能具有不同的性能特性。提取源码后，我们可以开始弄清楚\
  \ `bonobo_window_add_popup` 调用是在何处进行的。我们可以使用列表 11.9 所示的命令搜索 nautilus 目录中的所有源文件。\n\
  \n#### 列表 11.9。\n\n```\n [nautilus ]$ find -type f | xargs grep bonobo_window_add_popup\n\
  \n./src/file-manager/fm-directory-view.c: bonobo_window_add_popup\\\n\n(get_bonobo_window\
  \ (view), menu, popup_path); \n```\n\n幸运的是，`bonobo_window_add_popup` 似乎只从一个函数 `create_popup_menu`\
  \ 被调用，如列表 11.10 所示。\n\n#### 列表 11.10。\n\n```\n static GtkMenu *create_popup_menu\
  \ (FMDirectoryView *view,\n\n                              const char *popup_path)\n\
  \n{\n\n   GtkMenu *menu;\n   menu = GTK_MENU (gtk_menu_new ());\n\n   gtk_menu_set_screen\
  \ (menu, gtk_widget_get_screen (GTK_WIDGET (view)));\n\n   gtk_widget_show (GTK_WIDGET\
  \ (menu));\n\n   bonobo_window_add_popup (get_bonobo_window (view), menu, popup_path);\n\
  \n   g_signal_connect_object (menu, \"hide\",\n\n                            G_CALLBACK\
  \ (popup_menu_hidden),\n\n                            G_OBJECT (view),\n\n     \
  \                       G_CONNECT_SWAPPED);\n\n       return menu;\n\n} \n```\n\n\
  反，该函数被另外两个函数调用：`fm_directory_view_pop_up_background_context_menu` 和 `fm_directory_view_pop_up_selection_context_menu`。通过在每个函数中添加\
  \ `printf`，我们可以确定当我们右键点击窗口时是哪一个函数被调用。然后我们重新编译 nautilus，启动它，然后右键点击窗口背景。nautilus 打印出\
  \ `fm_directory_view_pop_up_background_context_menu`，因此我们知道这就是在窗口背景打开弹出菜单时被调用的函数。该函数的源码如列表\
  \ 11.11 所示。\n\n#### 列表 11.11。\n\n```\n void fm_directory_view_pop_up_background_context_menu\
  \ (FMDirectoryView\n\n*view, GdkEventButton *event)\n\n{\n\ng_assert (FM_IS_DIRECTORY_VIEW\
  \ (view));\n/* Make the context menu items not flash as they\n\n        * update\
  \ to proper disabled,\n\n * etc. states by forcing menus to update now.\n\n */\n\
  \nupdate_menus_if_pending (view);\n\neel_pop_up_context_menu\n\n(create_popup_menu\
  \ (view, FM_DIRECTORY_VIEW_POPUP_PATH_BACKGROUND),\n\n                         \
  \  EEL_DEFAULT_POPUP_MENU_DISPLACEMENT,\n\n                    EEL_DEFAULT_POPUP_MENU_DISPLACEMENT,\
  \ event);\n\n} \n```\n\n现在我们已经精确缩小了弹出菜单创建和显示的范围，我们可以开始弄清楚究竟是哪些部分消耗了所有时间，以及哪些部分最终调用了\
  \ `oprofile` 报告的热点函数 `g_type_check_instance_is_a`。\n\n### 11.8. 使用 gdb 生成调用堆栈\n\n\
  用于获取我们的应用程序调用了哪些函数的两种不同工具，为我们提供了关于哪些函数是热点函数的不同信息。我们推测，`ltrace` 报告的高层函数正在调用 `oprofile`\
  \ 报告的低层函数。如果能有一个性能工具能够准确告诉我们是哪些函数在调用 `g_type_check_instance_is_a` 以验证这一理论就太好了。\n\
  \n虽然没有 Linux 性能工具能精确告诉我们是哪些函数正在调用特定函数，但 `gprof` 应该能够呈现这种回调信息，但这需要使用 `-pg` 标志重新编译应用程序及其所依赖的所有库才能生效。对于依赖于\
  \ 72 个共享库的 nautilus 来说，这可能是一个艰巨且不可行的任务，因此我们必须寻找其他解决方案。新版本的 `oprofile` 也可以提供这类信息，但由于\
  \ `oprofile` 仅进行定期采样，它仍然无法涵盖任何给定函数的每次调用。\n\n幸运的是，我们可以创造性地使用 `gdb` 来提取这些信息。使用 `gdb`\
  \ 跟踪应用程序会大大降低运行速度；然而，我们并不在意跟踪是否花费长时间。我们感兴趣的是特定函数被调用的次数，而不是被调用的时间，因此运行很长时间是可以接受的。幸运的是，弹出菜单的创建是在毫秒级的；即使花费\
  \ 15 分钟也是接受的。\n\n为了找到哪些函数正在调用 `g_type_check_instance_is_a`，我们使用 `gdb`。我们在 `g_type_check_instance_is_a`\
  \ 中设置了一个断点，并使用 `command` 功能在每次命中断点时自动执行 `bt`。为了将跟踪限制为仅在创建菜单时，我们在 `fm_directory_view_pop_up_background_context_menu`\
  \ 函数的开头和结尾设置了另一个断点。当我们到达第一个断点时，开启日志；当我们到达第二个断点时，退出。这允许我们将输出保存到文件中。\n\n#### 列表 11.12。\n\
  \n```\n # 防止 gdb 在输出满屏后停止\nset height 0\n\n# 开启输出日志到文件（默认：gdb.txt）\nset logging\
  \ on\n\n# 关闭到屏幕输出\nset logging redirect on\n\n# 在弹出菜单即将创建时停止\nbreak fm-directory-view.c:5730\n\
  \n# 启动应用程序\nrun\n\n# 当我们在上一个断点停止时，设置 g_type_check_instance_is_a\n# 中的断点\nbreak g_type_check_instance_is_a\n\
  \n# 当我们到达断点时，打印调用堆栈并退出\ncommand\nbt\ncont\n\nend\n\n# 在弹出菜单创建后停止并退出 gdb\nbreak fm-directory-view.c:5769\n\
  \ncommand\n\nquit\n\nend\n\n# 继续运行\ncont \n```\n\n当运行这些 `gdb` 命令并打开弹出菜单时，`gdb` 会运行几分钟，并创建一个包含\
  \ 33MB 的文件，其中包含了调用 `g_type_check_instance_is_a` 函数的所有调用堆栈信息。其中一个示例如列表 11.13 所示。\n\
  \n\n\n\n\n#####  11.13.\n\n```\nBreakpoint 2, g_type_check_instance_is_a (type_instance=0x9d2b720,\n\
