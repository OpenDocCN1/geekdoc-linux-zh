  \ `/proc/meminfo` 部分的翻译)\n\n`/proc/meminfo` 提供关于 Linux 内存子系统当前状态的丰富信息。\n\n### 3.8.2.2\
  \ 示例用法\n\nListing 3.17 显示了 `/proc/meminfo` 的示例输出。它显示了一些与其他工具看到的相似的内存统计数据。然而，某些统计数据显示了新信息。其中，`Dirty`\
  \ 显示系统当前有 24KB 数据等待写入磁盘。另一个，`Commited_AS` 显示我们需要更多内存（需要 1068MB，而总内存为 1024MB）以避免潜在的内存耗尽情况。\n\
  \n\n\n\n\n```\n [ezolt@scrffy /tmp]$ cat /proc/meminfo\n\nMemTotal:      1034320\
  \ kB\n\nMemFree:         10788 kB\nBuffers:         29692 kB\nCached:         359496\
  \ kB\nSwapCached:     113912 kB\nActive:         704928 kB\nInactive:       222764\
  \ kB\nHighTotal:           0 kB\nHighFree:            0 kB\nLowTotal:      1034320\
  \ kB\nLowFree:         10788 kB\nSwapTotal:     2040244 kB\nSwapFree:      1756832\
  \ kB\nDirty:              24 kB\nWriteback:           0 kB\nMapped:         604248\
  \ kB\nSlab:            51352 kB\nCommitted_AS:  1093856 kB\nPageTables:       9560\
  \ kB\nVmallocTotal:  3088376 kB\nVmallocUsed:     26600 kB\nVmallocChunk:  3058872\
  \ kB\nHugePages_Total:     0\nHugePages_Free:      0\nHugepagesize:     2048 kB\
  \ \n```\n\n`/proc/meminfo` 是收集系统级 Linux 内存统计信息最完整的地方。由于你可以将其视为文本文件，任何自定义脚本或程序都可以轻松提取这些统计数据。\n\
  \n## 3.3 章总结\n\n本章侧重于系统级内存性能指标。这些指标主要展示了操作系统是如何使用内存的，而不是特定的应用程序。\n\n本章演示了如何使用 `sar`\
  \ 和 `vmstat` 等性能工具从运行中的系统里提取这些系统级内存性能信息。这些工具的输出指示了系统整体是如何使用可用内存的。下一章将描述用于调查单个进程\
  \ CPU 使用率的工具。\n\n## 第 4 章 性能工具：特定进程的 CPU\n\n在使用系统级性能工具确定了是哪个进程拖慢了系统后，你必须应用特定进程的性能工具来确定该进程的行为。Linux\
  \ 提供了丰富的工具集，用于跟踪进程和应用程序性能的重要统计数据。\n\n阅读完本章后，你应该能够：\n\n* 确定应用程序的运行时间是消耗在内核态还是用户态。\n\
  * 确定应用程序调用了哪些库和系统调用，以及它们花费了多久。\n* 对应用程序进行性能分析（Profile），以确定哪些源码行和函数耗时最长。\n\n### 4.1\
  \ 进程性能统计数据\n\n分析应用程序性能的工具多种多样，并且从 UNIX 早期起就以各种形式存在。理解应用程序如何与操作系统、CPU 和内存系统交互，对于理解其性能至关重要。大多数应用程序并不是自自包含的，它们会多次调用\
  \ Linux 内核和不同的库。这些对 Linux 内核的调用（或系统调用）可能像“我的 PID 是什么？”那样简单，也像“从磁盘读取 12 块数据”那样复杂。不同的系统调用会有不同的性能影响。相应的，库调用可能像内存分配一样简单，也像图形窗口创建一样复杂。这些库调用也具有不同的性能特征。\n\
  \n### 4.1.1 内核时间与用户时间\n\n应用程序消耗时间的最基础划分是内核时间和用户时间之间。内核时间是花费在 Linux 内核中的时间，而用户时间是花费在应用程序或库代码中的时间。Linux\
  \ 提供了如 `time` 和 `ps` 等工具，可以（恰当地）指示应用程序是将时间花在了应用程序代码还是内核代码上。它还拥有如 `oprofile` 和 `strace`\
  \ 等命令，允许你追踪代表进程执行了哪些内核调用，以及这些调用每个完成都花费了多久。\n\n### 4.1.2 库时间与应用程序时间\n\n任何具有微小复杂性的应用程序都依赖系统库来执行复杂操作。这些库可能会导致性能问题，因此查看应用程序在特定库中花费了多少时间是重要的。虽然直接修改库源码来修复问题可能并不总是可行，但更改应用程序代码以调用不同或更少的库函数可能是可能的。`ltrace`\
  \ 命令和 `oprofile` 套件提供了一种分析应用程序使用库时其性能的方法。Linux 加载器 `ld` 内置的工具帮助你判断使用许多库是否会减慢应用程序的启动时间。\n\
  \n### 4.1.3 分解应用程序时间\n\n当确定应用程序是瓶颈时，Linux 提供了工具允许你对应用程序进行性能分析，以确定时间消耗在应用程序内部。`gprof`\
  \ 和 `oprofile` 等工具可以生成应用程序的分析报告，精确确定是哪行源码导致了大量的时间消耗。\n\n## 4.2 工具\n\nLinux 拥有多种工具帮助你确定应用程序的哪些部分是\
  \ CPU 的主要使用者。本节描述了这些工具。\n\n### 4.2.1 time\n\n`time` 命令在测试命令性能时执行一个基础功能，但它通常是首要考虑的地方。`time`\
  \ 命令像一个秒表一样，记录命令执行所需的时间。它测量三种类型的时间：首先，它测量实际时间或流逝时间（elapsed time），即从程序开始到执行结束之间的时间。接下来，它测量用户时间（user\
  \ time），即花费在应用程序或库代码中的时间。最后，它测量系统时间（system time），即在内核态中花费的时间。\n\n### 4.2.1.1 性能相关选项\n\
  \n`time` 命令按如下方式调用：\n\n```\ntime [-v] application\n```\n\n##### 表 4.1 time 命令选项\n\
  \n| 选项 | 解释 |\n| :--- | :--- |\n| `-v` | 该选项提供了程序时间和统计数据的详细显示。某些统计数据为零，但 Linux 内核\
  \ 2.6 比 2.4 具有更多统计数据。 |\n| `application` | 被计时的应用程序，并在完成后将其使用信息输出到标准输出。 |\n\n#####\
  \ 表 4.2 CPU 特定输出\n\n| 列名 | 解释 |\n| :--- | :--- |\n| User time (seconds) | 应用程序消耗的\
  \ CPU 秒数。 |\n| System time (seconds) | 在 Linux 内核中花费的秒数。 |\n| Elapsed (wall-clock)\
  \ time (h:mm:ss or m:ss) | 程序启动到完成之间流逝的时间（墙钟时间）。 |\n| Percent of CPU this job got\
  \ | 该任务在运行时占用的 CPU 百分比。 |\n| Major (requiring I/O) page faults | 主页异常次数，即需要从磁盘读取内存页的异常。\
  \ |\n| Minor (reclaiming a frame) page faults | 轻级页异常次数，即无需访问磁盘即可填充的异常次数。 |\n| Swaps\
  \ | 进程被交换到磁盘的次数。 |\n| Voluntary context switches | 进程让 CPU 的次数（例如进入睡眠）。 |\n| Involuntary\
  \ context switches: | CPU 被从进程手中夺走的次数。 |\n| Page size (bytes) | 系统的页大小。 |\n| Exit\
  \ status | 应用程序的退出状态。 |\n\n该命令是开始调查的好方法。它显示了应用程序执行了多长时间，以及其中有多少时间花费在 Linux 内核而非应用程序中。\n\
  \n### 4.2.1.2 示例用法\n\n\n\n\nLinux 中包含的 `time` 命令是跨平台 GNU 工具的一部分。默认的命令输出会打印关于所运行命令的大量统计信息，即使\
  \ Linux 不支持这些统计。如果无法获取统计数据，`time` 只会打印 0。以下命令是 `time` 命令的一个简单调用。你可以在列表 4.1 中看到，运行时间（约\
  \ 3 秒）远大于用户时间（0.9 秒）和系统时间（0.13 秒）之和，这是因为应用程序大部分时间都花在等待输入上，而使用处理器的时间很少。\n\n### 列表\
  \ 4.1。\n\n```\n [ezolt@wintermute manuscript]$ /usr/bin/time gcalctool\n\n0.91user\
  \ 0.13system 0:03.37elapsed 30%CPU (0avgtext+0avgdata 0maxresident)k\n\n0inputs+0outputs\
  \ (2085major+369minor)pagefaults 0swaps \n```\n\n列表 4.2 是 `time` 显示详细输出的示例。如你所见，此输出显示比典型的\
  \ `time` 输出多得多。遗憾的是，大多数统计数据都是 0，因为 Linux 不支持这些统计。在大多数情况下，详细模式提供的信息与标准模式提供的输出相同，但统计标签具有更具描述性。在这种情况下，我们可以看到该进程在运行时占用了\
  \ CPU 的 15%，并花费了 1.15 秒运行用户代码，以及花费了 0.12 秒运行内核代码。它积累了 2,087 次主页缺错误（即不需要访问磁盘的内存错误）；它积累了\
  \ 371 次需要访问磁盘的页缺错误。主页错误过多表明当应用程序尝试使用内存时，操作系统不断访问磁盘，这很可能意味着内核正在进行大量的交换。\n\n### 列表\
  \ 4.2。\n\n```\n [ezolt@wintermute manuscript]$ /usr/bin/time --verbose gcalctool\n\
  \n        Command being timed: \"gcalctool\"\n\n        User time (seconds): 1.15\n\
  \n        System time (seconds): 0.12\n\n        Percent of CPU this job got: 15%\n\
  \n        Elapsed (wall clock) time (h:mm:ss or m:ss): 0:08.02\n\n        Average\
  \ shared text size (kbytes): 0\n\n        Average unshared data size (kbytes): 0\n\
  \n        Average stack size (kbytes): 0\n\n        Average total size (kbytes):\
  \ 0\n\n        Maximum resident set size (kbytes): 0\n\n        Average resident\
  \ set size (kbytes): 0\n\n        Major (requiring I/O) page faults: 2087\n\n  \
  \      Minor (reclaiming a frame) page faults: 371\n\n        Voluntary context\
  \ switches: 0\n\n        Involuntary context switches: 0\n\n        Swaps: 0\n\n\
  \        File system inputs: 0\n\n        File system outputs: 0\n\n        Socket\
  \ messages sent: 0\n\n        Socket messages received: 0\n\n        Signals delivered:\
  \ 0\n\n        Page size (bytes): 4096\n\n        Exit status: 0 \n```\n\n注意，bash\
  \ shell 有一个内置的 `time` 命令，所以如果你正在运行 bash 并在执行 `time` 时没有指定可执行文件的路径，你将获得以下输出：\n\n\
  ```\n [ezolt@wintermute manuscript]$ time gcalctool\n\nreal  0m3.409s\n\nuser  0m0.960s\n\
  \nsys   0m0.090s \n```\n\nbash 内置的 `time` 命令可能有用，但它提供了进程执行信息的子集。\n\n### 4.2.2. strace\n\
  \n`strace` 是一个跟踪程序在执行过程中发出的系统调用的工具。系统调用是应用程序向或代表 Linux 内核发起的函数调用。`strace` 可以显示所做的精确系统调用，并对于确定应用程序如何使用\
  \ Linux 内核极其有用。在分析大型程序或你不完全理解的程序时，跟踪系统调用的频率和长度特别有价值。通过查看 `strace` 输出，你可以了解应用程序是如何使用内核的以及它依赖于什么类型的函数。\n\
  \n当你完全理解一个应用程序时，`strace` 同样很有用，但如果该应用程序向系统库（如 `libc` 或 `GTK` 等）进行调用。在这种情况下，尽管你知道应用程序在何处发出每个系统调用，但库可能会代表你的应用程序发出更多系统调用。`strace`\
  \ 可以快速向你显示这些库正在进行的调用。\n\n尽管 `strace` 主要意图是通过显示应用程序发出的每个系统调用的参数和结果来跟踪进程与内核的交互，但 `strace`\
  \ 也可以提供不那么令人望畏的摘要信息。在应用程序运行后，`strace` 可以提供一个表格，显示每个系统调用的频率以及在该类型调用上花费的总时间。该表可以是理解你的程序如何与\
  \ Linux 内核交互至关重要的第一条信息。\n\n### 4.2.2.1 CPU 性能相关的选项\n\n以下 `strace` 调用对性能测试最有用：\n\n\
  ```\n strace [-c] [-p pid] [-o file] [--help] [ command [ ]]\n```\n\n如果 `strace`\
  \ 在不带任何选项运行时，它会显示所有调系统调用。这对于弄清楚应用程序为什么在内核中花费了大量时间非常有用。表 4-3 描述了一些在跟踪性能时有用的 strace\
  \ 选项。\n\n### 表 4-3. strace 命令行选项\n\n选项 | 解释\n-c | 使 `strace` 打印统计摘要而不是单个调用的列表。\n\
  -p pid | 附加到指定的 PID 并开始跟踪。\n-o file | `strace` 的输出将保存到 `file` 中。\n--help | 列出 strace\
  \ 选项的完整摘要\n\n尽管上述选项与性能调查最相关，`strace` 还可以过滤它跟踪的系统调用类型。选择系统调用的选项在 `--help` 选项和 `strace`\
  \ 手页中有详细说明。对于一般的性能调优，通常不需要使用它们；如果需要，它们确实存在。\n\n### 表 4-4. CPU 特定输出\n\n列 | 解释\n%\
  \ time | 在总调用时间中，该调用占的百分比。\nseconds | 在此系统调用上花费的总秒数。\nusecs/call | 每次系统调用花费的微秒数。\n\
  calls | 此类型的调用总数。\nerrors | 此系统调用返回错误的次数。\n\n表 4-4 解释了 `summary` 选项输出中的统计数据。输出的每行描述了特定系统调用的一组统计数据。\n\
  \n### 4.2.2.2 使用示例\n\n列表 4.3 是使用 `strace` 收集应用程序正在进行的系统调用统计信息的示例。如你所见，`strace` 为代表应用程序的系统调用提供了良好的分析，在这种情况下，应用程序是\
  \ `oowriter`。在这个示例中，我们查看 `oowriter` 如何使用 read 系统调用。我们可以看到 read 占了 20% 的时间，总消耗了 0.44\
  \ 秒。它被调用了 2427 次，平均每次花费 184 微秒。在这些调用中，有 26 次返回了错误。\n\n\n\n\n```bash\n [ezolt@wintermute\
  \ tmp]$ strace -c oowriter\n\nexecve(\"/usr/bin/oowriter\", [\"oowriter\"], [/*\
  \ 35 vars */]) = 0\n\nStarting OpenOffice.org ...\n\n% time     seconds  usecs/call\
  \     calls    errors syscall\n------ ----------- ----------- --------- ---------\
  \ ----------------\n 20.57    0.445636         184      2427        26 read\n 18.25\
  \    0.395386         229      1727           write\n 11.69    0.253217        \
  \ 338       750       514 access\n 10.81    0.234119       16723        14     \
  \   6 waitpid\n  9.53    0.206461        1043       198           select\n  4.73\
  \    0.102520         201       511        55 stat64\n  4.58    0.099290       \
  \  154       646           gettimeofday\n  4.41    0.095495          58      1656\
  \        15 lstat64\n  2.51    0.054279         277       196           munmap\n\
  \  2.32    0.050333         123       408           close\n  2.07    0.044863  \
  \        66       681       297 open\n  1.98    0.042879         997        43 \
  \          writev\n  1.18    0.025614          12      2107           lseek\n  0.95\
  \    0.020563        1210        17           unlink\n  0.67    0.014550       \
  \  231        63           getdents64\n  0.58    0.012656          44       286\
  \           mmap2\n  0.53    0.011399          68       167         2 ioctl\n  0.50\
  \    0.010776         203        53           readv\n  0.44    0.009500        2375\
  \        4        3 mkdir\n  0.33    0.007233         603        12           clone\n\
  \  0.29    0.006255          28       224           old_mmap\n  0.24    0.005240\
  \        2620           2           vfork\n  0.24    0.005173          50      \
  \ 104           rt_sigprocmask\n  0.11    0.002311           8       295       \
  \    fstat64 \n```\n\n`strace` 在跟踪进程方面表现良好，但在应用程序上运行时，它会引入一些开销。因此，`strace` 报告的调用次数可能比它报告的每个调用耗时更可靠。请将\
  \ `strace` 提供的时间作为调查的起点，而不是将其作为对每个调用花费时间的高精度测量值。\n\n### 4.2.3. ltrace\n\n`ltrace`\
  \ 的概念与 `strace` 类似，但它跟踪的是应用程序对库的调用，而不是对内核的调用。尽管它主要用于提供库调用参数和返回值的精确跟踪，但你 也可以使用 `ltrace`\
  \ 来总结每个调用所花费的时间。这让你能够弄明应用程序正在进行哪些库调用，以及每个调用耗费了多长时间。\n\n使用 `ltrace` 时要加小心，因为它可能会产生误导性的结果。如果一个库函数调用了另一个函数，那么花费的时间可能会被计算两次。例如，如果库函数\
  \ `foo()` 调用了函数 `bar()`，那么为函数 `foo()` 报告的时间将是运行函数 `foo()` 中代码所花费的所有时间，加上在函数 `bar()`\
  \ 中花费的所有时间。\n\n考虑到这一限制，它仍然是了解应用程序行为的有用工具。\n\n### 4.2.3.1 CPU 性能相关选项\n\n`ltrace`\
  \ 提供了与 `strace` 类似的功能，并以类似的方式被调用：\n\n```bash\nltrace [-c] [-p pid] [-o filename]\
  \ [-S] [--help] command\n```\n\n在前面的调用中，`command` 是你让 `ltrace` 跟踪的 `command`。如果不给\
  \ `ltrace` 任何选项，它会将所有库调用输出到标准错误。[表 4-5] 描述了与性能调查最相关的 `ltrace` 选项。\n\n##### 表 4-5.\
  \ ltrace 命令行选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-c` | 此选项导致 `ltrace` 在命令完成后打印所有调用的摘要。\
  \ |\n| `-S` | `ltrace` 在跟踪库调用之外还跟踪系统调用，这与 `strace` 提供的功能相同。 |\n| `-p pid` | 跟踪给定\
  \ PID 的进程。 |\n| `-o file` | `strace` 的输出保存在 `file` 中。 |\n| `--help` | 显示关于 `ltrace`\
  \ 的帮助信息。 |\n\n再次，摘要模式提供了应用程序运行期间库调用的性能统计。[表 4-6] 描述了这些统计数据的含义。\n\n##### 表 4-6. CPU\
  \ 特定的 ltrace 输出\n\n| 列名 | 说明 |\n| :--- | :--- |\n| `% time` | 在所有库调用的总时间中，此调用占的百分比。\
  \ |\n| `seconds` | 在库调用上花费的总秒数。 |\n| `usecs/call` | 此类库调用每次花费的微秒数。 |\n| `calls`\
  \ | 此类调用的总次数。 |\n| `function` | 库调用的名称。 |\n\n与 `strace`一样，`ltrace` 有许多可以修改其跟踪函数的选项。这些选项通过\
  \ `ltrace --help` 命令以及 `ltrace` 手页进行了详细说明。\n\n### 4.2.3.2 示例用法\n\n[列表 4.4] 是 `ltrace`\
  \ 运行 `ltrace` 命令的一个简单示例。\n\n```bash\nltrace -c\n```\n\n\n\n\n\n在 Listing 4.4 中，库函数\
  \ `XSetWMProtocols`、`hypot` 和 `XQueryPointer` 分别占了库执行总时间的 18.65%、17.19% 和 12.06%。耗时第二的函数\
  \ `hypot` 被调用了 702 次，而最耗时的函数 `XSetWMProtocols` 仅被调用了一次。除非我们的应用程序可以完全移除对 `XSetWMProtocols`\
  \ 的调用，否则我们可能不得不接受它所消耗的时间。最好的做法是将注意力转到 `hypot` 上。该函数的每次调用都是相对轻量级；因此，如果我们能减少它的调用次数，可能能够加快运行速度。如果\
  \ `xeyes` 应用程序存在性能问题，`hypot` 可能会是第一个被调查的函数。起初，我们应该确定 `hypot` 的作用，但目前还不清楚在何处会有文档记录。可能，我们可以找出\
  \ `hypot` 属于哪个库，并阅读该库的文档。在这种情况下，我们不需要先找到库，因为 `hypot` 函数有一个帮助页（man page）。运行 `man\
  \ hypot` 告诉我们 `hypot` 函数将计算两点之间的距离（斜边），它是数学库 `libm` 的一部分。然而，库中的函数可能没有帮助页，因此我们需要能够在没有帮助页的情况下确定某个函数属于哪个库。遗憾的是，`ltrace`\
  \ 并直观地看出某个函数来自哪个库。为了弄清楚这一点，我们必须使用 Linux 工具 `ldd` 和 `objdump`。首先，使用 `ldd` 显示动态链接应用程序使用了哪些库。然后，使用\
  \ `objdump` 在这些每个库中搜索指定的函数。在 Listing 4.5 中，我们使用 `ldd` 来查看 `xeyes` 应用程序使用了哪些库。\n\n\
  #### 列表 4.5.\n\n```\n [ezolt@localhost manuscript]$ ldd /usr/X11R6/bin/xeyes\n\n\
  \        linux-gate.so.1 => (0x00ed3000)\n\n        libXmu.so.6 => /usr/X11R6/lib/libXmu.so.6\
  \ (0x00cd4000)\n\n        libXt.so.6 => /usr/X11R6/lib/libXt.so.6 (0x00a17000)\n\
  \n        libSM.so.6 => /usr/X11R6/lib/libSM.so.6 (0x00368000)\n\n        libICE.so.6\
  \ => /usr/X11R6/lib/libICE.so.6 (0x0034f000)\n\n        libXext.so.6 => /usr/X11R6/lib/libXext.so.6\
  \ (0x0032c000)\n\n        libX11.so.6 => /usr/X11R6/lib/libX11.so.6 (0x00262000)\n\
  \n        libm.so.6 => /lib/tls/libm.so.6 (0x00237000)\n\n        libc.so.6 => /lib/tls/libc.so.6\
  \ (0x0011a000)\n\n        libdl.so.2 => /lib/libdl.so.2 (0x0025c000)\n\n       \
  \ /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x00101000) \n```\n\n既然 `ldd` 命令已经显示了\
  \ `xeyes` 使用的库，我们可以使用 `objdump` 命令来确定函数位于哪个库中。在 Listing 4.6 中，我们在 `xeyes` 链接的每个库中查找\
  \ `hypot` 符号。`objdump` 的 `-T` 选项列出了库依赖或提供的所有符号（大部分是函数）。通过使用 `fgrep` 查看包含 `.text`\
  \ 的输出行，我们可以看到哪些库导了 `hypot` 函数。在这种情况下，我们可以看到 `libm` 库是唯一包含 `hypot` 函数的库。\n\n####\
  \ 列表 4.6.\n\n```\n [/tmp]$ objdump -T /usr/X11R6/lib/libXmu.so.6  | fgrep \".text\"\
  \  | grep \"hypot\"\n\n[/tmp]$ objdump -T /usr/X11R6/lib/libXt.so.6   | fgrep \"\
  .text\"  | grep \"hypot\"\n\n[/tmp]$ objdump -T /usr/X11R6/lib/libSM.so.6   | fgrep\
  \ \".text\"  | grep \"hypot\"\n\n[/tmp]$ objdump -T /usr/X11R6/lib/libICE.so.6 \
  \ | fgrep \".text\"  | grep \"hypot\"\n\n[/tmp]$ objdump -T /usr/X11R6/lib/libXext.so.6\
  \  | fgrep \".text\"  | grep \"hypot\"\n\n[/tmp]$ objdump -T /usr/X11R6/lib/libX11.so.6\
  \  | fgrep \".text\"  | grep \"hypot\"\n```\n\n\n\n\n\n当执行一个动态链接的应用程序时，Linux 加载器\
  \ `ld.so` 会首先运行。`ld.so` 加载应用程序所有的库，并将应用程序使用的符号与库提供的函数连接起来。由于不同的库最初是在内存中不同且可能重叠的地方链接的，链接器需要对所有符号进行排序，并确保每个符号位于内存中的不同位置。当符号从一个虚拟地址移动到另一个虚拟地址时，这被称为“重定位”（relocation）。加载器执行此操作需要时间，如果完全不需要执行此操作会更好。`prelink`\
  \ 旨在通过重新排列整个系统的系统库使它们不重叠来实现这一目标。具有大量重定位的应用程序可能没有经过预链接（prelinked）。\n\nLinux 加载器通常在没有用户干预的情况下运行，只需执行动态程序，它就会自动运行。尽管加载器的执行对用户来说是不可见的，但它仍然需要运行时间，并可能会减慢应用程序的启动速度。当你请求加载器统计信息时，加载器会显示它正在工作量，并允许你判断它是否是瓶颈。\n\
  \n### 4.2.5.1 与 CPU 性能相关的选项\n\n`ld` 命令会在每个使用共享库的 Linux 应用程序中隐式运行。通过设置适当的环境变量，我们可以要求转储执行信息。以下调用方式会影响\
  \ `ld` 的执行：\n\n```\nenv LD_DEBUG=statistics,help LD_DEBUG_OUTPUT=filename <command>\
  \ \n```\n\n加载器的调试功能完全通过环境变量控制。表 4-8 描述了这些变量。\n\n### 表 4-8. `ld` 环境变量\n\n| 选项 | 解释\
  \ |\n| :--- | :--- |\n| `LD_DEBUG=statistics` | 开启 `ld` 的统计信息显示。 |\n| `LD_DEBUG=help`\
  \ | 显示关于可用调试统计信息的信息。 |\n\n表 4-9 描述了 `ld.so` 可以提供的某些统计数据。时间以时钟周期（clock cycles）为单位。要将其转换为实际时间，你必须除以处理器的时钟频率。（这些信息可以通过\
  \ `cat /proc/cpuinfo` 获取）。\n\n\n\n### 4-9. 针对 CPU 的 `ld.so` 输出\n\n| 列 | 解释 |\n|\
  \ :--- | :--- |\n| `total startup time in dynamic loader` | 在应用程序开始执行之前，在加载器中花费的总时间（时钟周期）。\
  \ |\n| `time needed for relocation` | 重定位符号时花费的总时间（时钟周期）。 |\n| `number of relocations`\
  \ | 在应用程序执行开始之前完成的新重定位计算次数。 |\n| `number of relocations from cache` | 在应用程序开始执行之前预计算并使用的重定位次数。\
  \ |\n| `number of relative relocations` | 相对重定位的数量。 |\n| `time needed to load objects`\
  \ | 加载应用程序使用的所有库所需的时间。 |\n| `final number of relocations` | 应用程序运行期间进行的重定位总数（包括通过\
  \ `dlopen` 进行的定位）。 |\n| `final number of relocations from cache` | 预计算的重定位总数。 |\n\
  \n`ld` 提供的信息对于确定在应用程序开始执行之前设置动态库上花费了多少时间非常有帮助。\n\n### 4.2.5.2 示例用法\n\n在 列表 4.8 中，我们在定义了\
  \ `ld` 调试环境变量的情况下运行了一个应用程序。输出统计信息保存到 `lddebug` 文件中。注意加载器显示了两组统计信息。第一组显示启动期间发生的所有重定位，最后一组显示程序关闭后的所有统计信息。如果应用程序使用了如\
  \ `dlopen` 等函数（该函数允许共享库在应用程序启动后映射到应用程序中），这些值可能会不同。在这种情况下，我们看到加载器中花费的时间有 83% 用于内存分配。如果应用程序经过了预链接，这个比例将接近零。\n\
  \n### 列表 4.8.\n\n```\n [ezolt@wintermute ezolt]$ env LD_DEBUG=statistics LD_DEBUG_OUTPUT=lddebug\
  \ gcalctool\n\n[ezolt@wintermute ezolt]$ cat lddebug.2647\n\n     2647:\n\n    \
  \ 2647:     runtime linker statistics:\n\n     2647:       total startup time in\
  \ dynamic loader: 40820767 clock cycles\n     2647:                 time needed\
  \ for relocation: 33896920 clock cycles (83.0%)\n     2647:                    \
  \  number of relocations: 2821\n     2647:           number of relocations from\
  \ cache: 2284\n     2647:             number of relative relocations: 27717\n  \
  \   2647:                time needed to load objects: 6421031 clock cycles (15.7%)\n\
  \     2647:\n\n     2647:     runtime linker statistics:\n\n     2647:         \
  \       final number of relocations: 6693\n     2647:     final number of relocations\
  \ from cache: 2284 \n```\n\n如果确定 `ld` 是导致启动速度缓慢的原因，则可以通过减少应用程序依赖的库的数量或在系统上运行 `prelink`\
  \ 来缩短启动时间。\n\n### 4.2.6. gprof\n\n在 Linux 上对应用程序进行性能分析的一种强大方法是使用 `gprof` 性能分析命令。`gprof`\
  \ 可以显示应用程序的调用图，并对应用程序消耗时间的地方进行采样。`gprof` 的工作原理是首先对应用程序进行插桩处理，然后运行应用程序生成采样文件。`gprof`\
  \ 非常强大，但需要源代码并且会增加插桩开销。尽管它可以准确确定函数被调用的次数并估计在函数中花费的时间，但 `gprof` 的插桩可能会改变应用程序的时间特性并减慢其执行。\n\
  \n### 4.2.6.1 与 CPU 性能相关的选项\n\n要使用 `gprof` 对应用程序进行性能分析，你必须拥有应用程序源码。然后，你必须使用类似下面的\
  \ `gcc` 命令编译该应用程序：\n\n```\ngcc -gp -g3 -o app app.c \n```\n\n首先，你必须使用 `gcc` 的 `-gp`\
  \ 选项开启性能分析来编译应用程序。必须注意不要剥离（strip）可执行文件，在编译时使用 `-g3` 选项开启符号会更有帮助。符号信息对于使用 `gprof`\
  \ 的源码注释功能是必要的。当你运行经过插桩的应用程序时，会生成一个输出文件。你可以使用 `gprof` 命令显示结果。`gprof` 命令的调用方式如下：\n\
  \n```\ngprof [-p flat-profile -q graph --brief -A annotated-source ] app\n```\n\n\
  表 4-10 中描述的选项指定了 gprof 显示的信息。\n\n### 表 4-10. gprof 命令行选项\n\n| 选项 | 解释 |\n| :---\
  \ | :--- |\n| `--brief` | 此选项缩短了 `gprof` 的输出。默认情况下，`gprof` 会打印所有的性能信息以及一个描述每个指标含义的图例。此选项会抑制图例。\
  \ |\n| `-p` 或 `--flat-profile` | 此选项打印应用程序中每个函数花费的总时间以及调用次数。 |\n| `-q` 或 `--graph`\
  \ | 此选项打印被分析应用程序的调用图。它显示了程序中的函数是如何相互调用的，在每个函数中花费了多少时间，以及在子函数中花费了多少时间。 |\n| `-A`\
  \ 或 `--annotated-source` | 这在原始源代码旁边显示性能分析信息。 |\n\n并非特定的性能分析都有所有的输出统计数据。可用的输出统计数据取决于应用程序是如何为性能分析编译的。\n\
  \n### 4.2.6.2 示例用法\n\n\n\n\n\n当使用 `gprof` 对应用程序进行性能分析时，第一步是带有分析信息编译应用程序。编译器（`gcc`）会将分析信息插入程序中，并在程序运行时，这些信息会被保存到名为\
  \ `gmon.out` 的文件中。这个压力测试应用程序非常简单：它清除一大区域的内存，然后调用两个函数 `a()` 和 `b()`，这两个函数都会访问这块内存。函数\
  \ `a()` 访问内存的频率是函数 `b()` 的 10 倍。\n\n首先，我们编译该应用程序：\n\n```\n [ezolt@wintermute test_app]$\
  \ gcc -pg -g3 -o burn_gprof burn.c \n```\n\n运行程序后，我们可以分析输出结果。这将在下面的列表 4.9 所示。\n\n\
  ### 列表 4.9。\n\n```\n [ezolt@wintermute test_app]$ gprof  --brief -p ./burn_gprof\n\
  \nFlat profile:\n\n每个样本计数为 0.01 秒。\n\n  %   cumulative   self              self\
  \     total\n\n time   seconds   seconds    calls   s/call   s/call  name\n\n 91.01\
  \      5.06     5.06        1     5.06     5.06  a\n\n  8.99      5.56     0.50\
  \        1     0.50     0.50  b \n```\n\n在列表 4.9 中，你可以看到 `gprof` 告诉了我们已经知道关于该应用程序的信息。它有两个函数\
  \ `a()` 和 `b()`。每个函数被调用一次，其中 `a()` 完成所需的时间是 `b()` 的 10 倍（91% 对 8.99%）。函数 `a()` 花费了\
  \ 5.06 秒，而函数 `b()` 费了 0.5 秒。\n\n列表 4.10 显示了测试应用程序的调用图。输出中列出的 `<spontaneous>` 注释意味着，尽管\
  \ `gprof` 没有在 `main()` 中记录任何样本，但它推导出 `main()` 一定运行了，因为函数 `a()` 和 `b()` 都有样本，而 `main`\
  \ 是代码中调用它们的唯一函数。`gprof` 最可能没有在 `main()` 中记录任何样本，因为它是一个非常短的函数。\n\n### 列表 4.10。\n\n\
  ```\n [ezolt@wintermute test_app]$ gprof  --brief -q ./burn_gprof\n\n          \
  \        Call graph\n\ngranularity: 每个样本命中覆盖 4 字节，占 5.56 秒的 0.18%\n\nindex % time\
  \    self  children    called     name\n\n                                     \
  \            <spontaneous>\n\n[1]    100.0    0.00    5.56                 main\
  \ [1]\n\n                5.06    0.00       1/1           a [2]\n\n            \
  \    0.50    0.00       1/1           b [3]\n\n-----------------------------------------------\n\
  \n                5.06    0.00       1/1           main [1]\n\n[2]     91.0    5.06\
  \    0.00       1         a [2]\n\n-----------------------------------------------\n\
  \n                0.50    0.00       1/1           main [1]\n\n[3]     9.0     0.50\
  \    0.00       1         b [3]\n\n-----------------------------------------------\n\
  \n按函数名索引\n\n   [2] a                       [3] b \n```\n\n最后，`gprof` 可以对源代码进行注释，显示每个函数被调用的频率。注意列表\
  \ 4.11 没有显示函数中花费的时间；相反，它显示了函数被调用的次数。正如之前的 `gprof` 示例所示，`a()` 实际花费的时间确实是 `b()` 的\
  \ 10 倍，因此在优化时要务必小心。不要假设调用次数多的函数实际上消耗了大量的 CPU 时间，也不假设调用次数较少的函数一定占据了较少的 CPU 时间。\n\n\
  ### 列表 4.11。\n\n```\n [ezolt@wintermute test_app]$ gprof -A burn_gprof\n\n*** File\
  \ /usr/src/perf/process_specific/test_app/burn.c:\n\n                #include <string.h>\n\
  \n                #define ITER 10000\n\n                #define SIZE 10000000\n\n\
  \                #define STRIDE 10000\n\n                char test[SIZE];\n\n  \
  \              void a(void)\n           1 -> {\n\n                  int i=0,j=0;\n\
  \                  for (j=0;j<10*ITER ; j++)\n                    for (i=0;i<SIZE;i=i+STRIDE)\n\
  \                      {\n                        test[i]++;\n                 \
  \     }\n                }\n\n                void b(void)\n           1 -> {\n\
  \                  int i=0,j=0;\n                  for (j=0;j<ITER; j++)\n     \
  \               for (i=0;i<SIZE;i=i+STRIDE)\n                      {\n         \
  \               test[i]++;\n                      }\n                }\n\n     \
  \           main()\n```\n\n\n\n\n在使用 `opannotate` 和 `opreport` 时，最好指定应用程序的完整路径名。如果不这样做，你可能会收到一条晦涩的错误信息（如果\
  \ `oprofile` 找不到应用程序的样本）。默认情况下，在显示结果时，`opreport` 只显示可执行文件的名称，这在具有多个可执行文件或同名库的系统中可能会产生歧义。请始终指定\
  \ `-f` 选项，以便 `opreport` 显示应用程序的完整路径。\n\n`oprofile` 还提供了一个命令 `opgprof`，它可以将 `oprofile`\
  \ 收集的样本导出为 `gprof` 可以识别的格式。它的调用方式如下：\n\n```\n opgprof application \n```\n\n该命令获取\
  \ `application` 的样本并生成一个与 `gprof` 兼容的分析文件。然后你可以使用 `gprof` 命令查看此文件。\n\n### 4.2.7.2\
  \ 示例用法\n\n由于我们已经在 第 2 章 的“系统级性能工具”章节中介绍过 `oprofile`，这里的示例将向你展示如何使用 `oprofile` 将性能问题追踪到特定的源码行。本节假设你已经使用\
  \ `opcontrol` 命令启动了性能分析。下一步是运行出现性能问题的程序。在这种情况下，我们使用 `burn` 程序，这与我们在 `gprof` 示例中使用的是同一个程序。我们按如下方式启动测试程序：\n\
  \n```\n [ezolt@wintermute tmp]$ ./burn \n```\n\n程序运行完成后，我们必须将 `oprofile` 的缓冲区转储到磁盘，否则\
  \ `opreport` 将无法获取样本。我们使用以下命令来实现：\n\n```\n [ezolt@wintermute tmp]$ sudo opcontrol\
  \ -d \n```\n\n接下来，在 列表 4.12 中，我们要求 `opreport` 告诉我们与测试应用程序 `/tmp/burn` 相关的样本。这让我们对应用程序消耗了多少周期有了整体的了解。在这种情况下，我们看到我们的应用程序采集了\
  \ 9,939 个样本。随着我们深入研究 `oprofile` 工具，我们将看到这些样本在 `burn` 应用程序中的分布情况。\n\n#### 列表 4.12.\n\
  \n```\n [ezolt@wintermute tmp]$ opreport -f /tmp/burn\n\nCPU: PIII, speed 467.731\
  \ MHz (estimated)\n\nCounted CPU_CLK_UNHALTED events (clocks processor is not halted)\
  \ with a\n\nunit mask of 0x00 (No unit mask) count 233865\n\n     9939 100.0000\
  \ /tmp/burn \n```\n\n接下来，在 列表 4.13 中，我们想查看 `burn` 应用程序中哪些函数拥有所有的样本。由于我们正在使用 `CPU_CLK_UNHALTED`\
  \ 事件，这大致对应于在每个函数上花费的相对时间。通过查看输出，我们可以看到 91% 的时间花在了函数 `a()` 中，9% 的时间花在了函数 `b()` 中。\n\
  \n#### 列表 4.13.\n\n```\n [ezolt@wintermute tmp]$ opreport -l /tmp/burn\n\nCPU: PIII,\
  \ speed 467.731 MHz (estimated)\n\nCounted CPU_CLK_UNHALTED events (clocks processor\
  \ is not halted) with a\n\nunit mask of 0x00 (No unit mask) count 233865\n\nvma\
  \      samples %           symbol name\n\n08048348 9033    90.9118     a\n\n0804839e\
  \ 903      9.0882     b \n```\n\n在 列表 4.14 中，我们要求 `opreport` 显示哪些虚拟地址被分配了样本。在这种情况下，地址\
  \ `0x0804838a` 处的指令似乎拥有 75% 的样本。然而，目前还不清楚这条指令在做什么，或者为什么。\n\n#### 列表 4.14.\n\n```\n\
  \ [ezolt@wintermute tmp]$ opreport -d /tmp/burn\n\nCPU: PIII, speed 467.731 MHz\
  \ (estimated)\n\nCounted CPU_CLK_UNHALTED events (clocks processor is not halted)\
  \ with a\n\nunit mask of 0x00 (No unit mask) count 233865\n\nvma      samples  %\
  \           symbol name\n\n08048348 9033     90.9118     a\n\n 08048363 4      \
  \  0.0443\n\n 08048375 431      4.7714\n\n 0804837c 271      3.0001\n\n 0804837e\
  \ 1        0.0111\n\n 08048380 422      4.6718\n\n 0804838a 6786    75.1245\n\n\
  \ 08048393 1114    12.33\n\n```\n\n\n\n\n`oprofile` 可能由于一些其无法控制的因素导致样本归类出现错误。首先，处理器并不总是在导致事件发生的精确代码行上触发中断。这可能导致样本被归类到距离事件原因附近的指令，而不是导致事件的精确指令。其次，在编译源代码时，编译器通常会重排指令以提高可执行文件的运行效率。在编译器完成优化后，代码的执行顺序可能与编写顺序不一致。不同的源文件行可能被重新排列和合并并执行。因此，某条指令可能是多行源代码的结果，甚至可能是由编译器生成的、在原始源中并不存在的中间代码段。结果是，当编译器优化代码并生成机器指令时，原始源代码行与生成的机器指令之间可能不再存在一一对应的映射关系。这可能使得\
  \ `oprofile`（以及调试器）难以或无法准确判断每条机器指令对应于源代码的哪一行。然而，`oprofile` 会尽可能贴接近事实，因此你通常可以查看高样本数行上方和下方几行，并判断出哪些代码是真正耗费资源的。如有必要，你可以使用\
  \ `opannotate` 显示接收所有样本的精确汇编指令和虚拟地址。你可能可以通过手动分析汇编指令的作用，然后将其映射回你的原始源代码。`oprofile`\
  \ 的样本归类并非完美，但它通常足够接近。尽管有这些局限性，`oprofile` 提供的性能分析也显示了需要调查的大致源代码行，这通常足够确定应用程序在哪里变慢了。\n\
  \n## 4.2.8. 语言：静态（C 和 C++）与动态（Java 和 Mono）\n\n大多数 Linux 性能工具都支持对 C 和 C++ 等静态语言的分析，本章介绍的所有工具都适用于用这些语言编写的应用。`ltrace`、`strace`\
  \ 和 `time` 工具适用于用 Java、Mono、Python 或 Perl 等动态语言编写的应用。然而，`gprof` 和 `oprofile` 性能分析工具无法用于此类应用程序。幸运的是，大多数动态语言都提供了非\
  \ Linux 特有的性能分析框架，你可以利用它们生成类似类型的分析报告。\n\n对于 Java 应用程序，如果在运行 `java` 命令时带有 `-Xrunhprof`\
  \ 命令行选项，则 `-Xrunhprof` 会对应用程序进行性能分析。更多细节请参阅 [http://antprof.sourceforge.net/hprof.html]。对于\
  \ Mono 应用程序，如果向 `mono` 可执行文件传递 `--profile` 标记，它会对应用程序进行性能分析。更多细节请参阅 [http://www.go-mono.com/performance.html]。Perl\
  \ 和 Python 具有类似的性能分析功能，其中 Perl 的 `Devel::Prof` 分别在 [http://www.perl.com/pub/a/2004/06/25/profiling.html]\
  \ 和 Python 的 `profiler` 在 [http://docs.python.org/lib/profile.html] 中进行了描述。\n\n\
  ## 4.3. 本章总结\n\n本章涵盖了如何跟踪单个进程的 CPU 性能瓶颈的方法。你学习了如何通过将所花费的时间归类到 Linux 内核、系统库，甚至是应用程序本身，来确定应用程序是如何消耗时间的。你还学习了如何确定对内核和系统库进行了哪些调用，以及每个调用完成需要多长时间。最后，你学习了如何对应用程序进行性能分析，并确定消耗大量时间的特定源行。在掌握这些工具后，你可以从一个占用\
  \ CPU 的应用程序开始，并使用这些工具找到消耗所有时间的精确函数。\n\n后续章节将研究如何找到非 CPU 密集型的瓶颈。特别是，你将学习用于寻找 I/O\
  \ 瓶颈的工具，例如饱和的磁盘或过载的网络。\n\n## 第 5 章 性能工具：进程特定内存\n\n本章涵盖了能够让你诊断应用程序与由 Linux 内核和 CPU\
  \ 管理的内存子系统交互的工具。由于内存子系统不同层之间的性能存在几个数量级的差异，优化应用程序以高效使用内存子系统可以对应用程序性能产生巨大影响。\n\n读完本章后，你应该能够：\n\
  \n* 确定应用程序使用了多少内存（`ps`, `/proc`）。\n* 确定应用程序的哪些函数正在分配内存（`memprof`）。\n* 使用软件模拟（`kcachegrind`,\
  \ `cachegrind`）和硬件计数计数（`oprofile`）分析应用程序的内存使用。\n* 确定哪些进程正在创建和使用共享内存（`ipcs`）。\n\n\
  ### 5.1. Linux 内存子系统\n\n在诊断内存性能问题时，可能需要观察应用程序在内存子系统各个层级的表现。在顶层，操作系统决定如何使用交换分区（swap）和物理内存。它决定应用程序地址空间中的哪些部分位于物理内存中，这被称为驻留集（resident\
  \ set）。应用程序使用但不在驻留集中的内存将被交换到磁盘。应用程序决定它向操作系统请求多少内存，这被称为虚拟集（virtual set）。应用程序可以通过调用\
  \ `malloc` 显式分配这些内存，也可以通过使用大量栈空间或使用大量库来隐式分配。应用程序还可以分配可以供自身和其他应用程序使用的共享内存。`ps` 性能工具常用于跟踪虚拟大小和驻留大小。`memprof`\
  \ 性能工具用于跟踪应用程序中哪些代码正在分配内存。`ipcs` 工具用于跟踪共享内存。\n\n当应用程序使用物理内存时，它开始与 CPU 缓存交互。现代 CPU\
  \ 拥有多级缓存。最快的缓存离 CPU 最近（也称为 L1 或一级缓存），且尺寸最小。例如，假设 CPU 只有两级缓存：L1 和 L2。当 CPU 请求一段内存时，处理器会检查该内存是否已在\
  \ L1 缓存中。如果是，CPU 就会使用它。如果它不在 L1 缓存中，处理器就会产生 L1 缓存缺失。然后它检查 L2 缓存；如果数据在 L2 缓存中，则被使用。如果数据不在\
  \ L2 缓存中，就会发生 L2 缓存缺失，处理器必须访问物理内存来检索信息。最终，最好的情况是处理器永远不需要访问物理内存（因为在 L1 甚至 L2 缓存中找到了数据）。智能的缓存使用——例如重新排列应用程序的数据结构和减小代码尺寸——可能减少缓存缺失次数并提高性能。`cachegrind`\
  \ 和 `oprofile` 是查找应用程序如何使用缓存以及哪些函数和数据结构导致缓存缺失的优秀工具。\n\n### 5.2. 内存性能工具\n\n本节检查各种内存性能工具，这些工具让你能够调查特定应用程序如何使用内存子系统，包括进程使用的内存数量和类型、内存分配的位置，以及进程使用\
  \ CPU 缓存的效率。\n\n#### 5.2.1. ps\n\n\n\n\n\n`ps` 是一个跟踪进程动态内存使用的优秀命令。除了已经提到的 CPU 统计信息外，`ps`\
  \ 还提供了关于应用程序使用的内存数量的详细信息，以及这些内存使用如何影响系统。\n\n### 5.2.1.1 内存性能相关选项\n\n`ps` 有许多不同的选项，可以检索关于运行应用程序状态的许多不同统计数据。正如你在上一章中看到的，`ps`\
  \ 可以检索进程消耗的 CPU 时间信息，但它也可以检索进程使用的内存数量和类型的信息。您可以使用以下命令行调用它：\n\n```\nps [-o vsz,rss,tsiz,dsiz,majflt,minflt,pmem,command]\
  \ <PID> \n```\n\n表 5-1 描述了 `ps` 可以为给定的 PID 显示的不同类型的内存统计。\n\n#### 表 5-1. `ps` 命令行选项\n\
  \n| 选项 | 解释 |\n| :--- | :--- |\n| `-o <statistic>` | 允许你精确指定想要跟踪的进程统计数据。不同的统计数据以逗号分隔的列表指定，且没有空格。\
  \ |\n| `vsz` | 统计数据：虚拟集合大小（virtual set size）是应用程序使用的虚拟内存量。由于 Linux 只在应用程序尝试使用内存时分配物理内存，此值可能远大于应用程序使用的物理内存量。\
  \ |\n| `rss` | 统计数据：驻存大小（resident set size）是应用程序当前使用的物理内存量。 |\n| `tsiz` | 统计数据：文本大小（Text\
  \ size）是程序代码的虚拟大小。再次，这不是物理大小，而是虚拟大小；然而，它是程序大小的一个良好指标。 |\n| `dsiz` | 统计数据：数据大小（Data\
  \ size）是程序数据使用的虚拟大小。这是应用程序数据结构和堆栈大小的良好指标。 |\n| `majflt` | 统计数据：主缺页（Major faults）是\
  \ Linux 代表进程从磁盘读取页面的缺页次数。如果进程访问了留在磁盘上的数据或指令，且 Linux 无缝地为应用程序加载了它，就会发生这种情况。 |\n|\
  \ `minflt` | 统计数据：次缺页（Minor faults）是 Linux 在不借助磁盘读取的情况下就可以完成的缺页次数。如果应用程序碰了由 Linux\
  \ 内核分配的内存，可能会发生这种情况。在这种情况下，没有必要访问磁盘，因为内核只需要选取一段空内存并将其分配给应用程序。 |\n| `pmep` | 统计数据：进程消耗的系统内存的百分比。\
  \ |\n| `command` | 统计数据：这是命令名。 |\n\n如前一章所述，`ps` 在选择用于显示统计信息的 PID 组方面非常灵活。`ps --help`\
  \ 提供了关于如何指定不同 PID 组的信息。\n\n### 5.2.1.2 示例用法\n\n列表 5.1 显示了运行在系统上的 burn 测试应用程序。我们要求\
  \ `ps` 告诉我们有关进程内存统计的信息。\n\n#### 列表 5.1.\n\n```\n[ezolt@wintermute tmp]$ ps -o vsz,rss,tsiz,dsiz,majflt,minflt,cmd\
  \ 10882\n\n  VSZ  RSS TSIZ DSIZ MAJFLT MINFLT CMD\n11124 10004   1 11122    66 \
  \  2465 ./burn \n```\n\n如 列表 5.1 所示，burn 应用程序的文本非常小（1KB），但数据大小很大（11,122KB）。在总虚拟大小（11,124KB）中，进程的驻存大小略小（10,004KB），这代表了进程实际使用的物理内存总量。此外，burn\
  \ 生成的大多数缺页是次缺页，因此大多数内存缺页是由于内存分配，而不是从磁盘上的程序镜像中加载大量文本或数据。\n\n### 5.2.2 /proc/<PID>\n\
  \nLinux 内核提供了一个虚拟文件系统，允许你提取有关系统上运行的进程的信息。`/proc` 文件系统提供信息通常只由 `ps` 等性能工具使用，用于从内核中提取性能数据。虽然通常没有必要深入研究\
  \ `/proc` 中的文件，但它确实提供了一些无法通过其他性能工具获取的信息。除了许多其他统计数据外，`/proc` 还提供了有关进程内存使用和库映射的信息。\n\
  \n### 5.2.2.1 内存性能相关选项\n\n`/proc` 的接口非常直接。`/proc` 提供了许多虚拟文件，你可以通过 `cat` 它们来提取信息。系统中的每个运行\
  \ PID 在 `/proc` 中都有子目录。该子目录下有一系列包含关于该 PID 信息的文件。其中一个文件 `status` 提供了有关给定进程 PID 状态的信息。你可以使用以下命令获取此信息：\n\
  \n```\ncat /proc/<PID>/status \n```\n\n表 5-2 描述了 status 文件中显示的内存统计数据。\n\n#### 表\
  \ 5-2. `/proc/<PID>/status` 字段描述\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `VmSize` | 进程的大小，即应用程序使用的虚拟内存。由于\
  \ Linux 只在应用程序尝试使用内存时分配物理内存，此值可能远大于应用程序实际使用的物理内存。这是 `ps` 的参数。 |\n| `VmLck` | 进程锁定的内存量。锁定内存无法交换到磁盘。\
  \ |\n| `VmRSS` | 驻存大小，即应用程序当前使用的物理内存量。这是 `ps` 的参数。 |\n| `VmData` | 数据使用的虚拟大小。与 `ps\
  \ dsiz` 统计数据不同，它不包含栈信息。 |\n| `VmStk` | 进程栈的大小。 |\n| `VmExe` | 可执行内存的虚拟大小。它不包括进程使用的库。\
  \ |\n| `VmLib` | 进程使用的库的大小。 |\n\n`<PID>` 目录中存在的另一个文件是 `maps` 文件。它提供了关于进程地址空间如何使用的信息。你可以使用以下命令获取它：\n\
  \n```\ncat /proc/<PID>/maps\n```\n\n表 5-3 描述了 `maps` 文件中的字段。\n\n#### 表 5-3. `/proc/<PID>/maps`\
  \ 字段描述\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `Address` | 库映射到进程的地址范围。 |\n| `Permissions`\
  \ | 内存区域的权限，其中 r = 读，w = 写，x = 执行，s = 共享，p = 私有（写时复制）。 |\n| `Offset` | 内存映射在库/应用程序中的偏移量。\
  \ |\n| `Device` | 该特定文件所在的设备（主、次设备号）。 |\n| `Inode` | 映射文件的节点号。 |\n| `Pathname` |\
  \ 映射到进程的文件路径名。 |\n\n`/proc` 提供的信息可以帮助你理解应用程序是如何分配内存以及它在使用哪些库。\n\n### 5.2.2.2 示例用法\n\
  \n列表 5.2 显示了运行在系统上的 burn 测试应用程序。首先，我们使用 `ps` 找到 burn 的 PID (4540)。然后我们使用 `/proc`\
  \ status 文件提取进程的内存统计数据。\n\n\n\n\n\n```\n [ezolt@wintermute tmp]$ ps aux | grep burn\n\
  \nezolt     4540  0.4  2.6 11124 10004 pts/0   T    08:26   0:00 ./burn\n\nezolt\
  \     4563  0.0  0.1  1624  464 pts/0    S    08:29   0:00 grep burn\n\n[ezolt@wintermute\
  \ tmp]$ cat /proc/4540/status\n\nName:   burn\n\nState:  T (stopped)\n\nTgid:  \
  \ 4540\n\nPid:    4540\n\nPPid:   1514\n\nTracerPid:      0\n\nUid:    501     501\
  \     501     501\n\nGid:    501     501     501     501\n\nFDSize: 256\n\nGroups:\
  \ 501 9 502\n\nVmSize:    11124 kB\n\nVmLck:         0 kB\n\nVmRSS:     10004 kB\n\
  \nVmData:     9776 kB\n\nVmStk:         8 kB\n\nVmExe:         4 kB\n\nVmLib:  \
  \    1312 kB\n\nSigPnd: 0000000000000000\n\nShdPnd: 0000000000000000\n\nSigBlk:\
  \ 0000000000000000\n\nSigIgn: 0000000000000000\n\nSigCgt: 0000000000000000\n\nCapInh:\
  \ 0000000000000000\n\nCapPrm: 0000000000000000\n\nCapEff: 0000000000000000 \n```\n\
  \n正如 Listing 5.2 所示，我们再次看到 burn 应用具有非常小的文本大小（4KB）和栈大小（8KB），但具有非常大的数据大小（9,776KB）和合理的库大小（1,312KB）。较小的文本大小意味着该进程没有多少可执行代码，而适中的库大小意味着它正在使用一个库来支持其执行。较小的栈大小意味着该进程没有调用深度嵌套函数，也没有调用使用大量或许多临时变量函数。`VmLck`\
  \ 大小为 0KB 意味着进程没有将任何页面锁定到内存中，使其无法被交换。`VmRSS` 大小为 10,004KB 意味着应用程序当前正在使用 10,004KB\
  \ 的物理内存，尽管它已经分配或映射了 `VmSize` 的 11,124KB。如果应用程序开始使用它已分配但当前未使用的内存，`VmRSS` 大小会增加，但\
  \ `VmSize` 保持不变。\n\n正如之前提到的，应用的 `VmLib` 大小非零，因此它正在使用一个库。在 Listing 5.3 中，我们查看进程的映射，以查看它正在使用的精确库。\n\
  \n##### Listing 5.3.\n\n```\n [ezolt@wintermute test_app]$ cat /proc/4540/maps\n\
  \n08048000-08049000 r-xp 00000000 21:03 393730      /tmp/burn\n\n08049000-0804a000\
  \ rw-p 00000000 21:03 393730      /tmp/burn\n\n0804a000-089d3000 rwxp 00000000 00:00\
  \ 0\n\n40000000-40015000 r-xp 00000000 21:03 1147263     /lib/ld-2.3.2.so\n\n40015000-40016000\
  \ rw-p 00015000 21:03 1147263     /lib/ld-2.3.2.so\n\n4002e000-4002f000 rw-p 00000000\
  \ 00:00 0\n\n4002f000-40162000 r-xp 00000000 21:03 2031811     /lib/tls/libc-2.3.2.so\n\
  \n40162000-40166000 rw-p 00132000 21:03 2031811     /lib/tls/libc-2.3.2.so\n\n40166000-40168000\
  \ rw-p 00000000 00:00 0\n\nbfffe000-c000000 rwxp fffff000 00:00 0\n```\n\n如 Listing\
  \ 5.3 所示，burn 应用正在使用两个库：`ld` 和 `libc`。`libc` 的文本段（由权限 `r-xp` 表示）范围从 `0x4002f000`\
  \ 到 `0x40162000`，大小为 `0x133000`（257,472 字节）。`libc` 的数据段（由权限 `rw-p` 表示）范围从 `40162000`\
  \ 到 `40166000`，大小为 `0x4000`（16,384 字节）。`libc` 的文本大小大于 `ld` 的文本大小 `0x15000`（86,016\
  \ 字节）。`libc` 的数据大小也大于 `ld` 的大小 `0x1000`（4,096 字节）。`libc` 是 burn 链接的大库。`/proc` 证明是从内核中提取性能统计数据的一种有用方法。由于统计数据是基于文本的，你可以使用标准的\
  \ Linux 工具来访问它们。\n\n### 5.2.3 memprof\n\n`memprof` 是一个图形化的内存使用工具。它显示了程序在运行时是如何分配内存的。`memprof`\
  \ 显示了应用程序消耗的内存量以及哪些函数负责内存消耗。此外，`memprof` 还可以显示哪些代码路径负责内存使用。例如，如果函数 `foo()` 没有分配内存，但调用了分配大量内存的函数\
  \ `bar()`，`memprof` 会向你显示 `foo()` 本身使用了多少以及 `foo()` 用的所有函数。`memprof` 在应用程序运行时动态地更新这些信息。\n\
  \n##### 5.2.3.1 内存性能相关选项 `memprof` 是一个图形应用程序，但有几个可以修改其执行的命令行选项。通过以下命令调用：\n\n```\n\
  memprof [--follow-fork] [--follow-exec] application\n```\n\n`memprof` 会分析给定的“应用程序”并创建其内存使用的图形化显示。虽然\
  \ `memprof` 可以在任何应用程序上运行，但如果应用程序及其依赖的库是用带有调试符号编译的，它可以提供更多信息。表 5-4 描述了在监控调用了 `fork`\
  \ 或 `exec` 的应用程序时操作 `memprof` 行为的选项。这通常发生在应用程序启动新进程或执行新命令时。\n\n##### 表 5-4. memprof\
  \ 命令行选项\n\n| 选项 | 解释 |\n| :--- | --- |\n| `--follow-fork` | 此选项将导致 `memprof` 为新\
  \ fork 的进程启动新窗口。 |\n| `--follow-exec` | 此选项将导致 `memprof` 在应用程序调用 `exec` 后继续对其进行分析。\
  \ |\n\n一旦调用，`memprof` 会创建一个带有系列菜单和选项的窗口，允许你选择你想要分析的应用程序。\n\n##### 5.2.3.2 使用示例\n\
  \n假设我有一个 Listing 5.4 中的示例，并且我想分析它。在我们调用的 `memory_eater` 应用中，`foo()` 函数没有分配内存，但它调用了分配内存的函数\
  \ `bar()`。\n\n在带有 `-g3` 标志（以便包含符号）编译此应用程序后，我们使用 `memprof` 对该应用程序进行分析：\n\n```\n [ezolt@localhost\
  \ example]$ memprof ./memory_eater memintercept (3965):\n_MEMPROF_SOCKET = /tmp/memprof.Bm1AKu\
  \ memintercept (3965): New process,\noperation = NEW, old_pid = 0\n```\n\n`memprof`\
  \ 创建了如图 1](#ch05lev1sec2.html_ch05fig01）所示的窗口。如所示，它显示了 `memory_eater` 应用程序的内存使用信息，以及一系列允许你操作分析的按钮和菜单。\n\
  \n##### 图 1.\n\n如果你点击 Profile 按钮，`memprof` 会显示应用程序的内存分析图。图 2 中的第一个信息框显示了每个函数消耗的内存（由“self”表示），以及该函数及其子函数消耗的内存总和（由“total”表示）。正如预期的，`foo()`\
  \ 函数没有分配内存，因此其 self 值为 0，而其 total 值为 100,000，因为它调用了分配内存的函数。\n\n##### 图 2.\n\n当你点击顶部框中的不同函数时，子函数和调用者信息框会发生。这样就可以查看应用程序的哪些函数正在使用内存。\n\
  \n#### 5.2.4. valgrind (cachegrind)\n\n`valgrind` 是一个强大的工具，允许你调试棘手的内存管理错误。虽然 `valgrind`\
  \ 主要是一个开发人员工具，但它还有一个可以显示处理器缓存使用的“插件”。`valgrind` 模拟当前处理器并在该虚拟处理器中运行应用程序，同时跟踪内存使用。它还可以模拟处理器缓存，并定位程序在指令和数据缓存中的命中和缺失位置。\n\
  \n\n\n\n尽管非常有用，但它的缓存统计是不精确的（因为 `valgrind` 只是处理器的仿真，而非真实的硬件）。`valgrind` 不会考虑通常由 Linux\
  \ 内核系统调用引起的缓存缺失，或由于上下文切换引起的缓存缺失。此外，`valgrind` 运行应用程序的速度远于原生执行程序。然而，`valgrind` 为应用程序的缓存使用提供了一个极好的初始估计。`valgrind`\
  \ 可以在任何可执行文件上运行；但如果程序在编译时带有符号（在编译 `gcc` 时传递了 `-g3` 参数），它将能够精确到负责缓存使用的特定代码行。\n\n\
  ### 5.2.4.1 内存性能相关选项\n\n使用 `valgrind` 分析特定应用程序的缓存使用情况有两个阶段：收集（collection）和注释（annotation）。收集阶段从以下命令行开始：\n\
  \n```\nvalgrind --skin=cachegrind application \n```\n\n`valgrind` 是一个灵活的工具，具有几个不同的“皮肤”（skins），允许它执行不同类型的分析。在收集阶段，`valgrind`\
  \ 使用 `cachegrind` 皮肤来收集有关缓存使用的信息。上述命令行中的 `application` 代表要分析性能的应用程序。收集阶段会将摘要信息打印到屏幕上，并将更详细的统计数据保存在名为\
  \ `cachegrind.out.pid` 的文件中，其中 `pid` 是运行分析应用程序的 PID。当收集阶段完成后，使用 `cg_annotate` 命令将缓存使用情况映射回应用程序源代码。`cg_annotate`\
  \ 的调用方式如下：\n\n```\ncg_annotate --pid [--auto=yes|no] \n```\n\n`cg_annotate` 获取由\
  \ `valgrind` 生成的信息并用它对被分析的应用程序进行注释。`--pid` 选项是必须的，其中 `pid` 是你感兴趣的分析对应的 PID。默认情况下，`cg_annotate`\
  \ 仅显示函数级别的缓存使用情况。如果你设置 `--auto=yes`，缓存使用情况将显示源代码行级别。\n\n### 5.2.4.2 使用示例\n\n此示例展示了\
  \ `valgrind` (v2.0) 在一个简单应用程序上的运行。该应用程序清理了一块内存，然后调用两个函数 `a()` 和 `b()`，每个函数都会访问这块内存。函数\
  \ `a()` 访问内存的频率是函数 `b()` 的十倍。\n\n首先，如 Listing 5.5 所示，我们使用 `cachegrind` 皮肤在应用程序上运行\
  \ `valgrind`。\n\n##### 列表 5.5.\n\n```\n[ezolt@wintermute test_app]$  valgrind --skin=cachegrind\
