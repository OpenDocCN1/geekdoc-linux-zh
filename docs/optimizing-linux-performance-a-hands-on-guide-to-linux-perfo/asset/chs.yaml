  \ ?          0:06.23  0.0  0.1 S portmap \n```\n```\n\n`top` v3.x 为 `top` 提供了一个稍微整洁的界面。它简化了其某些方面，并提供了一个良好的“摘要”信息屏幕，显示系统中的许多资源消耗者。\n\
  \n#### 2.2.4. procinfo（从 `/proc` 文件系统显示信息）\n\n与 `vmstat` 类似，`procinfo` 提供了系统性能特征的视图。尽管它提供的一些信息与\
  \ `vmstat` 相似，但它还提供了每个设备 CPU 接收到的中断数量信息。它的输出格式比 `vmstat` 稍微易读一些，但占据更多的屏幕空间。\n\n\
  ### 2.2.4.1 CPU 性能相关选项\n\n使用以下命令调用 `procinfo`：\n\n```\n procinfo [-f] [-d] [-D]\
  \ [-n sec] [-f file] \n```\n\n表 2-12 描述了改变输出以及 `procinfo` 采样频率的不同选项。\n\n##### 表\
  \ 2-12 `procinfo` 命令行选项\n\n| 选项 | 解释 |\n| :--- | :--- |\n| -f | 以全屏模式运行 `procinfo`\
  \ |\n| -d | 显示样本之间的变化而不是总量 |\n| -D | 显示总量而不是速率 |\n| -n sec | 每次采样之间的暂停秒数 |\n| -file\
  \ | 将 `procinfo` 的输出发送到文件\n\n表 2-13 显示了 `procinfo` 收集的 CPU 统计数据。\n\n##### 表 2-13\
  \ `procinfo` CPU 统计数据\n\n| 选项 | 解释 |\n| :--- | :--- |\n| user | CPU 用于用户的时间（天、小时、分钟）\
  \ |\n| nice | CPU 用于普通优先级的时间（天、小时、分钟） |\n| system | CPU 用于系统的时间（天、小时、分钟） |\n| idle\
  \ | CPU 用于空闲的时间（天、小时、分钟） |\n| irq | CPU 接收到的中断数量\n\n与 `vmstat` 类似，`procinfo` 提供了系统性能特征的视图。尽管它提供的一些信息与\
  \ `vmstat` 相似，但它还提供了每个设备 CPU 接收到的中断数量信息。它的输出格式比 `vmstat` 稍微易读一些，但占据更多的屏幕空间。\n\n\n\
  \n\n\n### 2.2.5.2 示例用法\n\n当你启动 `gnome-system-monitor` 时，它会创建一个类似于图 2-1 的窗口。该窗口显示了特定进程使用的\
  \ CPU 和内存数量的信息。它还显示了每个进程之间的父子关系。\n\n#### 图 2-1.\n\n![](img/02fig01.jpg)\n\n图 2-2\
  \ 显示了系统负载和内存使用的图形化视图。这正是 `gnome-system-monitor` 不同于 `top` 的地方。你可以轻松看到系统的当前状态以及它与之前状态的对比。\n\
  \n#### 图 2-2.\n\n![](img/02fig02.jpg)\n\n`gnome-system-monitor` 提供的数据图形化视图可以更容易更快地确定系统状态以及其行为随时间的变化。它也让导航系统进程信息变得更加容易。\n\
  \n### 2.2.6. mpstat (多处理器统计)\n\n`mpstat` 是一个相当简单的命令，它根据时间向你展示处理器的运行情况。`mpstat` 最大的好处是它在统计数据旁边显示时间，因此你可以查找\
  \ CPU 使用率与时间之间的相关性。\n\n如果你有多个 CPU 或启用了超线程的 CPU，`mpstat` 还可以根据处理器拆分 CPU 使用率，因此你可以查看特定处理器是否比其他工作更多。你可以选择想要监控的单个处理器，也可以要求\
  \ `mpstat` 监控所有处理器。\n\n### 2.2.6.1 与 CPU 性能相关的选项\n\n可以使用以下命令行调用 `mpstat`：\n\n```\n\
  \ mpstat [ -P { cpu | ALL } ] [ delay [ count ] ]\n```\n\n再次，`delay` 指定了采样的频率，`count`\
  \ 决定了运行的次数。表 2-14 描述了 `mpstat` 的命令行选项。\n\n##### 表 2-14. `mpstat` 命令行选项\n\n| 选项 |\
  \ 解释 |\n| :--- | :--- |\n| `-P { cpu | ALL }` | 此选项告诉 `mpstat` 监控哪些 CPU。`cpu` 是\
  \ 0 到总 CPU 数减 1 之间的数字。 |\n| `delay` | 这指定了 `mpstat` 在采样之间等待多久。 |\n\n`mpstat` 提供与其他\
  \ CPU 性能工具类似的信息，但它允许将信息归因于特定系统的每个处理器。表 2-15 描述了它支持的选项。\n\n##### 表 2-15. `mpstat`\
  \ CPU 统计数据\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `user` | 这是 CPU 在上一次采样中花费的用户时间的百分比。\
  \ |\n| `nice` | 这是 CPU 在上一次采样中运行低优先级（或 nice）进程花费的时间百分比。 |\n| `system` | 这是 CPU 在上一次采样中花费的系统时间的百分比。\
  \ |\n| `iowait` | 这是 CPU 在上一次采样中等待 I/O 的时间百分比。 |\n| `irq` | 这是 CPU 在上一次采样中处理中断的时间百分比。\
  \ |\n| `softirq` | 这是 CPU 在上一次采样中处理内核处理中断后需要完成的工作的时间百分比。 |\n| `idle` | 这是 CPU 在上一次采样中空闲的时间百分比。\
  \ |\n\n`mpstat` 是一个提供每个处理器性能细分的良好工具。由于 `mpstat` 提供了每个 CPU 的细分数据，你可以识别出是否某个处理器正在变得过载。\n\
  \n### 2.2.6.2 示例用法\n\n首先，我们要求 `mpstat` 显示编号为 0 的处理器的 CPU 统计数据。这如列表 2.13 所示。\n\n\
