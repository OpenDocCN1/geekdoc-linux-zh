  \       0.00\n```\n\n\n\n\n\n`sar` 命令可记录性能信息、重放之前的记录信息，并显示当前系统的实时信息。`sar` 命令的输出可以进行格式化，以便将其通过（pipe）到关系型数据库或其他\
  \ Linux 命令进行处理。\n\n### 2.2.7.1 CPU 性能相关选项\n\n可以使用以下命令行调用 `sar`：\n\n```\nsar [options]\
  \ [ delay [ count ] ]\n```\n\n尽管 `sar` 报告了 Linux 许多不同领域的统计，但统计数据有两种不同的形式。一组统计数据是采样时的瞬时值；另一组则是自上一次采样以来的速率。表\
  \ 2-16 描述了 `sar` 的命令行选项。\n\n#### 表 2-16. `sar` 命令行选项\n\n| 选项 | 解释 |\n| :--- | :---\
  \ |\n| `-c` | 报告每秒创建了多少进程的信息。 |\n| `-I {irq | SUM | ALL | XALL}` | 报告系统中发生中断的速率。\
  \ |\n| `-P {cpu | ALL}` | 此选项指定应从哪个 CPU 收集统计数据。如果没有指定，则报告系统总计。 |\n| `-q` | 报告机器的运行队列和平均负载的信息。\
  \ |\n| `-u` | 报告系统 CPU 利用率的信息。（这是默认输出。） |\n| `-w` | 报告系统中发生的上下文切换次数。 |\n| `-o filename`\
  \ | 指定存储性能统计数据的二进制输出文件名为。 |\n| `-f filename` | 指定性能统计数据的文件名。 |\n| `delay` | 采样间隔的等待时间。\
  \ |\n| `count` | 记录的采样总数。 |\n\n`sar` 提供了了一组类似的（名称不同）的系统级 CPU 性能统计数据，我们在之前的工具中已经见过。该列表见表\
  \ 2-17。\n\n#### 表 2-17. `sar` CPU 统计数据\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `user`\
  \ | CPU 在上一次采样期间花费用户态时间的百分比。 |\n| `nice` | CPU 在上一次采样期间运行低优先级（或 nice）进程的时间百分比。 |\n\
  | `system` | CPU 在上一次采样期间花费内核态时间的百分比。 |\n| `iowait` | CPU 在上一次采样期间等待 I/O 的时间百分比。\
  \ |\n| `idle` | CPU 在上一次采样期间空闲的时间百分比。 |\n| `runq-sz` | 采样时运行队列的大小。 |\n| `plist-sz`\
  \ | 采样时存在的进程数（运行、睡眠或等待 I/O 的进程）。 |\n| `ldavg-1` | 过去一分钟的平均负载。 |\n| `ldavg-5` | 过去\
  \ 5 分钟的平均负载。 |\n| `ldavg-15` | 过去 15 分钟的平均负载。 |\n| `proc/s` | 每秒创建的新进程数。（这与 `vmstat`\
  \ 中的 `forks` 统计数据相同。） |\n| `cswch` | 每秒上下文切换的次数。 |\n| `intr/s` | 每秒触发的中断数。 |\n\n\
  `sar` 的显著优势之一是允许你将许多不同类型的时间标记系统数据保存到日志文件中，以便日后检索和审查。在尝试弄明为什么特定机器在特定时间发生故障时，这可能非常有用。\n\
  \n### 2.2.7.2 示例用法\n\n列表 2.15 中显示的第一个命令每秒对 CPU 进行三次采样，并将结果存储在二进制文件 `/tmp/apache_test`\
  \ 中。该命令没有任何视觉化输出，在完成后完成后会直接返回。\n\n#### 列表 2.15。\n\n```\n[ezolt@wintermute sysstat-5.0.2]$\
  \ sar -o /tmp/apache_test 1 3\n```\n\n将信息存储在 `/tmp/apache_test` 文件后，我们可以以多种格式显示它。默认格式是人类可读的。这在列表\
  \ 2.16 中所示。它显示了与其他系统监控命令类似的信息，我们可以看到处理器在特定时间是如何花费时间的。\n\n#### 列表 2.16。\n\n```\n\
  [ezolt@wintermute sysstat-5.0.2]$ sar -f /tmp/apache_test\n\nLinux 2.4.22-1.2149.nptl\
  \ (wintermute.phil.org)  03/20/04\n\n17:18:34          CPU     %user     %nice \
  \  %system   %iowait      %idle\n\n17:18:35          all     90.00      0.00   \
  \  10.00      0.00       0.00\n\n17:18:36          all     95.00      0.00     \
  \ 5.00      0.00       0.00\n\n17:18:37          all     92.00      0.00      0.00\
  \      0.00       0.00\n\n17:18:34          all     92.33      0.00.0.0000000.00\n\
  ```\n\n\n\n\n默认显示的目的是显示有关 CPU 的信息，但也可以显示其他信息。例如，`sar` 可以显示每秒上下文切换次数，以及换入或换出的内存页数。在列表\
  \ 2.20 中，`sar` 采样了两次，两次之间间隔一秒。在这种情况下，我们要求 `sar` 显示每秒发生的上下文切换总数和进程创建数。我们还请求 `sar`\
  \ 提供有关平均负载的信息。从这个示例中看到，这台机器有 163 个进程在内存中但未运行。在过去的一分钟内，平均有 1.12 个进程准备就绪。\n\n### 列表\
  \ 2.20.\n\n```\n [ezolt@scrffy manuscript]$ sar -w -c -q 1 2\n\nLinux 2.6.8-1.521smp\
  \ (scrffy)   10/20/2004\n\n08:23:29 PM    proc/s\n\n08:23:30 PM      0.00\n\n08:23:29\
  \ PM   cswch/s\n\n08:23:30 PM    594.00\n\n08:23:29 PM   runq-sz  plist-sz   ldavg-1\
  \    ldavg-5  ldavg-15\n\n08:23:30 PM         0       163      1.12       1.17 \
  \     1.17\n\n08:23:30 PM    proc/s\n\n08:23:31 PM      0.00\n\n08:23:30 PM   cswch/s\n\
  \n08:23:31 PM    812.87\n\n08:23:30 PM   runq-sz  plist-sz   ldavg-1    ldavg-5\
  \  ldavg-15\n\n08:23:31 PM         0       163      1.12       1.17      1.17\n\n\
  Average:       proc/s\n\nAverage:         0.00\n\nAverage:      cswch/s\n\nAverage:\
  \       703.98\n\nAverage:      runq-sz  plist-sz   ldavg-1    ldavg-5  ldavg-15\n\
  \nAverage:            0       163      1.12       1.17      1.17 \n```\n\n如你所示，`sar`\
  \ 是一个强大的工具，可以记录许多不同的性能统计数据。它提供了一个 Linux 友好的接口，让你能够轻松地提取和分析性能数据。\n\n## 2.2.8. oprofile\n\
  \n`oprofile` 是一个性能套件，它利用几乎所有现代处理器中可用的性能计数器硬件，来跟踪整个系统以及单个进程中 CPU 时间消耗在哪里。除了测量 CPU\
  \ 周期的消耗位置外，`oprofile` 还可以测量关于 CPU 性能的极低级信息。取决于底层处理器支持的事件，它可以测量诸如缓存缺失、分支预测错误、内存引用以及浮点运算等内容。\n\
  \n`oprofile` 并不会记录发生的每一个事件；相反，它与处理器的性能硬件配合，每隔 `count` 次事件进行一次采样，其中 `count` 是用户在启动\
  \ `oprofile` 时指定的数值。`count` 的值越小，结果越准确，但 `oprofile` 的开销越大。通过将 `count` 保持在一个合理的值，`oprofile`\
  \ 可以以非常低的开销运行，但仍然能提供极其准确的系统性能报告。\n\n采样非常强大，但在使用时要注意某些不显而易见的问题。首先，采样可能会显示你将 90% 的时间花在了某个例程上，但它并没有说明原因。归因于特定例程的高周期数可能有两个原因：首先，该例程可能是瓶颈，执行耗了很长的时间；然而，也可能是该函数的执行时间是合理的，但被调用了很多次。你通常可以通过查看该热点行周围的样本，或者通过对代码进行插桩以统计调用次数来判断是哪种情况。\n\
  \n采样的第二个问题是，你永远无法确定一个函数是从哪里调用的。即使你发现该函数被调用了多次并追踪了所有调用它的函数，也不一定清楚是哪个函数执行了大部分调用。\n\
  \n### 2.2.8.1 CPU 性能相关选项\n\n`oprofile` 实际上是一系列协同工作的组件，用于收集 CPU 性能统计数据。`oprofile`\
  \ 主要包含三个部分：\n\n*   `oprofile` 内核模块操作处理器并开启或关闭采样。\n*   `oprofile` 守护进程收集样本并将其保存到磁盘。\n\
  *   `oprofile` 报告工具获取收集到的样本，并向用户展示它们与系统中运行的应用程序之间的关系。\n\n`oprofile` 套件通过 `opcontrol`\
  \ 命令隐藏了对驱动程序和守护进程的操作。`opcontrol` 命令用于选择处理器将采样的哪些事件并启动采样。\n\n在控制守护进程时，你可以使用以下命令行调用\
  \ `opcontrol`：\n\n```\nopcontrol [--start] [--stop] [--dump] \n```\n\n该选项控制的是性能分析守护进程，允许你启动和停止采样，并将样本从守护进程的内存转储到磁盘。在采样时，`oprofile`\
  \ 守护进程会在内部缓冲区中存储大量样本。然而，只能分析那些写入（或转储）到磁盘的样本。写入磁盘是一项昂贵的操作，因此 `oprofile` 只定期执行。。因此，在运行测试并使用\
  \ `oprofile` 进行分析后，结果可能不会立即可用，你必须等待守护进程将缓冲区刷新到磁盘。当你想要立即开始分析时，这可能非常恼人，因此 `opcontrol`\
  \ 命令允许强制将样本从 `oprofile` 守护进程的内部缓冲区转储到磁盘。这让你能够在测试完成后立即开始性能调查。。\n\n表 2-18 描述了 `opcontrol`\
  \ 命令行选项，允许你控制守护进程的操作。\n\n### 表 2-18. `opcontrol` 守护进程控制\n\n| 选项 | 解释 |\n| :--- |\
  \ :--- |\n| `-s/--start` | 启动分析，除非使用当前处理器的默认事件 |\n| `-d/--dump` | 将当前内核样本缓冲区中的采样信息转储到磁盘。\
  \ |\n| `--stop` | 这将停止分析。 |\n\n默认情况下，`oprofile` 会根据你运行它的处理器和内核选择一个频率合理的给定事件。然而，它比默认情况有得多的事件可以被监控。当你列出并选择事件时，使用以下命令行调用\
  \ `opcontrol`：\n\n```\nopcontrol [--list-events] [-event=:name:count:unitmask:kernel:user:]\
  \ \n```\n\n事件指定符允许你选择要采样的事件；采样的频率；以及采样是在内核空间、用户空间还是两者中进行。表 2-19 描述了 `opcontrol`\
  \ 的命令行选项，允许你选择不同的事件进行采样。\n\n### 表 2-19. `opcontrol` 事件处理\n\n| 选项 | 解释 |\n| :---\
  \ | :--- |\n| `-l/--list-events` | 列出处理器可以采样的不同事件。 |\n| `-event=:name:count: unitmask:kernel:user:`\
  \ | 用于指定采样哪些事件。事件名称必须是处理器支持的事件之一。可以从 `--list-events` 选项获取有效事件。`count` 参数指定处理器每发生\
  \ `count` 次该事件进行一次采样。`unitmask` 修改采样的事件内容。例如，如果你正在采样“从内存读取”，单元掩码允许你只选择那些未命中缓存的读取。`kernel`\
  \ 参数指定当处理器在内核空间运行时 `oprofile` 是否应该进行采样。`user` 参数指定当处理器在用户空间运行时 `oprofile` 是否应该进行采样。\
  \ |\n| `--vmlinux = kernel` | 指定 `oprofile` 使用哪个未压缩的内核镜像来将样本归因于各种内核函数。 |\n\n在收集样本并保存到磁盘后，`oprofile`\
  \ 提供了另一个工具 `opreport`，允许你查看收集到的样本。使用以下命令行调用 `opreport`：\n\n```\nopreport [-r] [-t]\
  \ \n```\n\n\n\n\n通常，`opreport` 会显示系统采集的所有样本，以及负责产生这些样本的执行文件（包括内核）。样本数量最多的执行文件首先显示，随后是所有带有样本的执行文件。在典型的系统中，大多数样本集中在列表顶部的少数几个执行文件中，而有大量的执行文件只贡献了极少的样本。为了解决这个问题，`opreport`\
  \ 允许你设置一个阈值，仅显示占总样本比例达到该百分比或更高的执行文件。或者，`opreport` 可以反转所显示执行文件的排序顺序，使得贡献率高的最后显示。这样一来，最重要的数据会在最后打印，而不会滚出屏幕。\n\
  \nTable 2-20 描述了 `opreport` 的这些命令行选项，允许你对采样输出进行格式化。\n\n##### 表 2-20. `opreport`\
  \ 报告格式\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `--reverse-sort / -r` | 反转排序顺序。通常，引起最多事件的首先显示。\
  \ |\n| `--threshold / -t [percentage]` | 使 `opreport` 仅显示贡献了 `percentage` 或更多数量样本的映像。当有很多样本数量极少的映像且你只对最显著的部分感兴趣时，这非常有用。\
  \ |\n\n再次，`oprofile` 是一个复杂的工具，这些选项仅展示了 `oprofile` 功能的基础。你将在后面的章节中学习更多关于 `oprofile`\
  \ 能力的内容。\n\n### 2.2.8.2 使用示例\n\n`oprofile` 是一个非常强大的工具，但也可能安装。附录 B “安装 oprofile”\
  \ 包含了如何在几个主要的 Linux 发行版中安装和运行 `oprofile` 的说明。\n\n我们通过设置分析环境来开始使用 `oprofile`。第一个命令如\
  \ 列表 2.21 所示，它使用 `opcontrol` 命令告诉 `oprofile` 件未压缩内核镜像的位置。`oprofile` 需要知道该文件的位置，以便将样本归类到内核内部精确的函数。\n\
  \n##### 列表 2.21.\n\n```\n[root@wintermute root]# opcontrol --vmlinux=/boot/vmlinux-2.4.22-1.2174.nptlsmp\
  \ \n```\n\n在设置好当前内核路径后，我们就可以开始分析了。列表 2.22 中的命令告诉 `oprofile` 使用默认事件开始采样。该事件取决于处理器，但此处理器的默认事件是\
  \ `CPU_CLK_UNHALTED`。该事件对所有处理器未停止的 CPU 周期进行采样。233869 处理器每隔 233,869 个事件采样一次其正在执行的指令。\n\
  \n##### 列表 2.22.\n\n```\n[root@wintermute root]# opcontrol -s Using default event:\
  \ CPU_CLK_UNHALTED:233869:0:1 Using log file /var/lib/oprofile/oprofiled.log Daemon\
  \ started. Profiler running.\n```\n\n现在我们已经开始采样，想要开始分析采样结果。在 列表 2.23 中，我们开始使用报告工具来弄系统中发生了什么。`opreport`\
  \ 报告了目前为止分析的内容。\n\n##### 列表 2.23.\n\n```\n[root@wintermute root]# opreport No sample\
  \ found: try running opcontrol --dump containing sample files\n```\n\n呃，尽管分析已经进行了一会儿，但当\
  \ `opreport` 指定找不到任何样本时，我们停止了。这是因为 `opreport` 命令在磁盘上查找样本，而 `oprofile` 守护进程将样本存储在内存中，仅将其转到磁盘。当我们向\
  \ `opreport` 请求样本列表时，它在磁盘上没有找到任何。为了缓解这个问题，我们可以向 `opcontrol` 发出 `dump` 选项来强制守护进程立即刷新样本，如\
  \ 列表 2.24 所示。该命令允许我们查看已采集的样本。\n\n##### 列表 2.24.\n\n```\n[root@wintermute root]#\
  \ opcontrol --dump\n```\n\n我们将样本 `dump` 到磁盘后，再次尝试并向 `oprofile` 请求报告，如 列表 2.25 所示。这次我们得到了结果。报告包含了关于采集的处理器信息以及所监控的事件类型。报告随后按降序列出了发生的事件数量以及发生的执行文件。我们可以看到\
  \ Linux 内核占了总周期的 50%，`emacs` 占了 14%，而 `libc` 占了 12%。可以深入研究执行文件并确定哪个函数占用了时间，但这将在第\
  \ 4 章](#ch04.html_ch04) “性能工具：进程特定 CPU](#ch04.html_ch04)”中介绍。\n\n##### 列表 2.25.\n\
  \n```\n[root@wintermute root]# opreport CPU: PIII, speed 467.739 MHz (estimated)\
  \ Counted CPU_CLK_UNHALTED events (clocks processor is not halted) with a unit mask\
  \ of 0x00 (No unit mask) count 233869\n     3190 50.4507 vmlinux-2.4.22-1.2174.nptlsmp\n\
  \      905 14.3128 emacs\n      749 11.8456 libc-2.3.so\n      261 4.1278 ld-2.3.so\n\
  \      244 3.8589 mpg321\n      233 3.6850 insmod\n      171 2.7044 libperl.so\n\
  \      128 2.0244 bash\n      113 1.7871 ext3.o\n....\n```\n\n当我们启动 `oprofile` 时，只是使用了\
  \ `opcontrol` 为我们选择的默认事件。每个处理器都有组非常丰富的可以监控的事件。在列表 2.26](#ch02lev1sec2.html_ch02ex26)\
  \ 中，我们要求 `opcontrol` 列出此特定 CPU 可用的所有事件。这个列表很长，但在这种情况下我们可以看到除了 `CPU_CLK_UNHALTED`\
  \ 之外，我们还可以监控 `DATA_MEM_REFS` 和 `DCU_LINES_IN`。这些是由内存子系统引起的内存事件，我们将在后面的章节中对它们进行。\n\
  \n##### 列表 2.26.\n\n```\n[root@wintermute root]# opcontrol -l\noprofile: available\
  \ events for CPU type \"PIII\"\nSee Intel Architecture Developer's Manual Volume\
  \ 3, Appendix A and\nIntel Architecture Optimization Reference Manual (730795-001)\n\
  CPU_CLK_UNHALTED: (counter: 0, 1)\n        clocks processor is not halted (min count:\
  \ 6000)\nDATA_MEM_REFS: (counter: 0, 1)\n        all memory references, cachable\
  \ and non (min count: 500)\nDCU_LINES_IN: (counter: 0, 1)\n        total lines allocated\
  \ in the DCU (min count: 500)\n....\n```\n\n指定我们要监控哪些事件的命令可能很繁琐，幸运的是，我们还可以使用 `oprofile`\
  \ 的图形化 `oprof_start` 命令来图形化地启动和停止采样。这允许我们通过图形界面选择我们想要的事件，而无需研究如何在命令行上指定我们想要监控的事件的具体方法。\n\
  \n在图 2-3](#ch02lev1sec2.html_ch02fig03) 所示的 `op_control` 示例中，我们告诉 `oprofile` 我们想同时监控\
  \ `DATA_MEM_REFS` 和 `L2_LD` 事件。`DATA_MEM_REFS` 事件可以告诉哪些应用程序大量使用内存子系统，哪些使用二级缓存。在这个特定的处理器中，处理器硬件只有两个可以用于采样的计数器，因此只能同时使用两个事件。\n\
  \n##### 图 2-3.\n\n\n\n\n\n现在我们已经使用图形界面通过 `operofile` 收集了样本，现在可以分析它收集的数据了。在列表 2.27\
  \ 中，我们要求 `opreport` 显示它收集的样本分析，其方式类似于我们在监控周期时的方法。在这种情况下，我们可以看到 `libmad` 库占了整个系统\
  \ 31%%的数据内存引用，似乎是内存子系统最大量的用户。\n\n##### 列表 2.27。\n\n```\n [root@wintermute root]#\
  \ opreport\n\nCPU: PIII, speed 467.739 MHz (estimated)\n\nCounted DATA_MEM_REFS\
  \ events (all memory references, cachable and non)\n\nwith a unit mask of 0x00 (No\
  \ unit mask) count 30000\n\nCounted L2_LD events (number of L2 data loads) with\
  \ a unit mask of 0x0f\n(All cache states) count 233869\n\n    87462 31.7907    \
  \    17  3.8636 libmad.so.0.1.0\n    24259  8.8177        10  2.2727 mpg321\n  \
  \  23735  8.6272        40  9.0909 libz.so.1.2.0.7\n    17513  6.3656        56\
  \ 12.7273 libgklayout.so\n    17128  6.2257        90 20.4545 vmlinux-2.4.22-1.2174.nptlsmp\n\
  \    13471  4.8964         4  0.9091 libpng12.so.0.1.2.2\n    12868  4.6773    \
  \    20  4.5455 libc-2.3.2.so\n.... \n```\n\n`opreport` 提供的输出显示了包含我们所采样事件的所有系统库和可执行文件。注意，并非所有事件都被记录了；因为我们正在进行采样，所以只有部分事件被实际记录。这通常不是问题，因为如果某个特定的库或可执行文件存在性能问题，它很可能会导致高成本事件频繁发生。如果采样是随机的，这些高成本事件最终会被采样代码捕获。\n\
  \n## 2.3. 章节总结\n\n本章重点关注 CPU 使用率的系统级性能指标。这些指标主要展示了操作系统和机器的行为情况，而不是某个特定的应用程序。\n\n\
  本章演示了如何使用如 `sar` 和 `vmstat` 等性能工具从运行的系统中提取这些系统级性能信息。这些工具是诊断系统问题时的第一道防线。它们帮助确定系统是如何运行的，以及哪些子系统或应用程序可能特别压力。下一章将关注系统级性能工具，这些工具允许你分析整个系统的内存使用情况。\n\
  \n## 第 3 章 性能工具：系统内存\n\n本章概述了系统级 Linux 内存性能工具。本章讨论了这些工具可以测量的内存统计数据，以及如何使用各个工具来收集这些统计数据。在阅读本章后，你应该：\n\
  \n*   理解系统级性能的基本指标，包括内存使用\n*   理解哪些工具可以检索系统级内存性能指标\n\n### 3.1. 内存性能统计\n\n每个系统级 Linux\
  \ 性能工具提供了不同的方式来提取类似的统计数据。虽然没有工具能显示所有统计数据，但某些工具显示的是相同的统计数据。本章的开头回顾了这些统计数据的细节，随后在描述工具时会引用这些描述。\n\
  \n### 3.1.1. 内存子系统与性能\n\n在现代处理器中，将信息保存到内存子系统以及从内存系统中检索信息通常比 CPU 执行代码和操作这些信息花费的时间长。CPU\
  \ 通常花费大量时间处于空闲状态，等待从内存中检索指令和数据以便执行它们或基于它们进行操作。处理器具有各个级别的缓存来补偿内存性能的缓慢。`oprofile`\
  \ 等工具可以显示各种处理器缓存缺失可能发生的地方。\n\n### 3.1.2. 内存子系统（虚拟内存）\n\n任何给 Linux 系统都有一定量的 RAM 或物理内存。在对这些物理内存进行寻址时，Linux\
  \ 将其分为内存块或“页”。在分配或移动内存时，Linux 操作的是页大小的单元而不是单个字节。在报告某些内存统计数据时，Linux 内核报告每秒页数，该值可以根据其运行的架构而变化。列表\
  \ 3.1 创建了一个小型应用程序，显示当前架构每页的字节数。\n\n##### 列表 3.1。\n\n```\n #include <unistd.h>\n\n\
  int main(int argc, char *argv[])\n\n{\n  printf(\"System page size: %d\\n\",getpagesize());\n\
  } \n```\n\n在 IA32 架构上，页大小为 4KB。在极少数情况下，这些页大小的内存块会导致过大的跟踪开销，因此内核以大得多的块操作内存，被称为大页（HugePages）。这些页的量级是\
  \ 2048KB 而不是 4KB，并极大地减少了管理大量数据的开销。某些应用程序（如 Oracle）使用大页来加载数据。如果大页没有填满，将会浪费内存。半个页浪费\
  \ 2KB，而半个大页可以浪费 1024KB。\n\n内核可以将零散的物理页组合，为应用程序呈现一个连续的虚拟内存空间。\n\n#### 3.1.2.1. 交换分区（内存不足）\n\
  \n所有系统都有以内存芯片形式存在的固定物理内存。当所需的内存超过可用物理内存时，Linux 内核允许应用程序运行。Linux 内核使用硬盘作为临时内存。这段硬盘空间被称为交换分区。\n\
  \n虽然交换分区是允许进程运行的一种极方法，但它非常缓慢。应用程序使用交换而非物理内存的速度可能慢 1000 倍。如果系统性能糟糕，确定使用了多少交换分区通常是有帮助的。\n\
  \n#### 3.1.2.2. 缓冲区与缓存（内存过剩）\n\n相反，如果你的系统物理内存远大于应用程序的需求，Linux 将最近使用的文件缓存在物理内存中，这样后续对文件的访问就不需要访问硬盘。这可以大大加快频繁访问硬盘的应用程序，显然对于频繁启动的应用程序特别有用。应用程序第一次启动时需要从磁盘读取；但如果它留在缓存中，则需要从快速多的物理内存读取。这种磁盘缓存于上一章提到的处理器缓存。除了\
  \ `oprofile`、`valgrind` 和 `kcachegrind` 之外，大多数报告“缓存”统计数据的工具实际上指的是磁盘缓存。\n\n\n\n\n\
  看到系统由于缓存和缓冲区的使用导致可用内存非常少，可能会令人沮丧，但这并不一定是坏事。默认情况下，Linux 会尝试尽可能地使用你的内存。这是好事。如果 Linux\
  \ 检测到任何空闲内存，它会将应用程序和数据缓存在空闲内存中，以加快未来的访问。由于从内存访问数据的通常比从磁盘快几个数量级，这可以极大提高整体性能。当系统需要缓存内存用于更重要的事情时，缓存内存会被擦除并交给系统。随后访问之前被缓存的对象将必须去磁盘读取数据。\n\
  \n### 活跃内存与不活跃内存\n\n活跃内存（Active memory）当前正被进程使用。不活跃内存（Inactive memory）是指已分配但有一段时间未使用的内存。这两种内存在本质上没有区别。当需要时，Linux\
  \ 内核会获取进程最近未使用的内存页，并将其从活跃列表移动到不活跃列表。在选择哪些内存将交换到磁盘时，内核会从不活跃内存列表中进行选择。\n\n### 高内存与低内存\n\
  \n对于具有 1GB 或更多物理内存的 32 位处理器（例如 IA32），Linux 必须将物理内存管理为高内存（high memory）和低内存（low memory）。Linux\
  \ 内核无法直接访问高内存，必须在使用之前将其映射到低内存范围。这对于 64 位处理器（如 AMD64/EM6T、Alpha 或 Itanium）来说不是问题，因为它们可以直接访问当前系统中可用的额外内存。\n\
  \n### 内核对内存的使用 (Slabs)\n\n除了应用程序分配的内存外，Linux 内核还为了记账工作消耗一定数量的内存。这些记账工作包括：跟踪来自网络和磁盘\
  \ I/O 设备的数据到达数据，以及跟踪哪些进程正在运行，哪些正处于睡眠状态。为了管理这些记账工作，内核拥有一系列缓存，其中包含一个或多个内存块（slabs）。每个\
  \ slab 由一组一个或多个对象组成。内核消耗的 slab 内存取决于 Linux 内核的哪些部分正在使用，并可能随着机器负载类型的变化而改变。\n\n###\
  \ Linux 性能工具：CPU 和内存\n\n我们这里开始讨论性能工具，这些工具能够让你提取前述描述的内存性能信息。\n\n#### vmstat (虚拟内存统计)\n\
  \n正如你之前看到的，`vmstat` 可以提供关于系统许多不同性能方面的信息——尽管正如接下来所示，它的主要目的是提供有关虚拟内存系统性能的信息。除了上一章描述的\
  \ CPU 性能统计外，它还可以告诉你：\n\n* 正在使用多少交换分区空间（swap）\n* 物理内存是如何使用的\n* 有多少空闲内存\n\n如你所见，`vmstat`（通过它显示的统计数据）在单行文本中提供了关于系统健康和性能的丰富信息。\n\
  \n#### 全局内存相关选项\n\n除了 `vmstat` 可以提供的 CPU 统计外，在调查内存统计时，你可以使用以下命令行选项调用 `vmstat`：\n\
  \n```\nvmstat [-a] [-s] [-m]\n```\n\n与之前一样，可以用两种模式运行 `vmstat`：采样模式（sample mode）和平均模式（average\
  \ mode）。新增的命令行选项允许你获取关于 Linux 内核如何使用内存的性能统计。表 3-1 | 打印 `vm` 表。这是自系统启动以来各种系统统计数据的汇总。它不能在采样模式下运行。它包含了内存和\
  \ CPU 统计数据。 |\n| `-m` (`procps` 3.2 或更高版本) | 打印内核的 slab 信息。这与通过输入 `cat /proc/slabinfo`\
  \ 获取的信息相同。。它详细描述了内核内存是如何分配的，并有助于确定内核的哪个区域消耗了最多的内存。 |\n\n表 3-2 提供了 `vmstat` 可以提供的内存统计列表。与\
  \ CPU 统计一样，在普通模式下运行时，`vmstat` 提供的第一行是所有速率统计数据（`so` 和 `si`）的平均值，以及所有数值统计（`swpd`、`free`、`buff`、`cache`、`active`\
  \ 和 `inactive`）的瞬时值。\n\n##### 表 3-2：内存特定的 `vmstat` 输出统计 |\n\n| 列 | 说明 |\n| :---\
  \ | :--- |\n| `swpd` | 当前交换到磁盘的内存总量。 |\n| `free` | 操作系统或应用程序未使用的物理内存量。 |\n| `buff`\
  \ | 系统缓冲区的尺寸（单位为 KB），或用于存储等待保存到磁盘的数据的内存。这部分内存允许应用程序在向 Linux 内核发出写调用后立即继续执行（而无需等待数据提交到磁盘）。\
  \ |\n| `cache` | 系统缓存的尺寸（单位为 KB），或用于存储从磁盘读取的数据的内存。如果应用程序再次需要这些数据，它将从内存而非磁盘获取。 |\n\
  | `active` | 活跃使用的内存量。活跃/不活跃统计数据与缓冲区/缓存是正交的；缓冲区和缓存内存可以是活跃的，也可以是不活跃的。 |\n| `inactive`\
  \ | 一段时间未使用且符合交换到磁盘条件的的内存量（单位为 KB）。 |\n| `si` | 上次采样期间从磁盘交换入内存的内存速率（单位为 KB/s）。 |\n\
  | `so` | 上次采样期间交换出到磁盘的内存速率（单位为 KB/s）。 |\n| `pages paged in` | 从磁盘读取到系统缓冲区的内存量（单位为页）。（在\
  \ IA32 系统上，一页为 4KB。） |\n| `pages paged out` | 从系统缓存写入磁盘的内存量（单位为页）。（在 IA32 系统上，一页为\
  \ 4KB。） |\n| `pages swapped in` | 从交换分区读取到系统内存的内存量（单位为页）。 |\n| `pages swapped in/out`\
  \ | 从系统内存写入交换分区的内存量（单位为页）。 |\n| `used swap` | 内核当前使用的交换分区量。 |\n| `free swap` | 当前可用的交换分区量。\
  \ |\n| `total swap` | 系统拥有的交换分区总量；这也就是 used swap 和 free swap 之和。 |\n\n`vmstat` 为特定机器的虚拟内存系统状态提供了良好的概述。尽管它没有提供\
  \ Linux 内存性能统计的完整详细列表，但它提供了一个紧凑的输出，可以指示系统内存是如何使用的。\n\n#### 示例用法\n\n在示例 3.2 中，正如你在上一章看到的，如果调用\
  \ `vmstat` 时不带任何命令行选项，它将显示自系统启动以来性能统计的平均值（`si` 和 `so`），并显示其余统计的瞬时值（`swpd`、`free`、`buff`\
  \ 和 `cache`）。在这种情况下，我们可以看到系统有大约 500MB 的内存交换到了磁盘。系统内存中有 14MB 是空闲的。4MB 用于包含尚未刷新到磁盘数据的缓冲区。627MB\
  \ 用于包含过去从磁盘读取过数据的缓存。\n\n##### 示例 3.2。\n\n\n\n\n\n```\n bash-2.05b$ vmstat\n\nprocs\
  \ -----------memory---------- ---swap-- -----io---- --system-- ----cpu----\n\n r\
  \  b   swpd   free   buff  cache   si   so     bi   bo   in    cs us sy id wa\n\n\
  \ 0  0 511012  14840   4412 642072   33   31    204  247 1110  1548  8  5 73 14\
  \ \n```\n\n在 列表 3.3 中，我们要求 `vmstat` 显示关于活动页和非活动页数量。非活动页的数量表示了有多少内存可以交换到磁盘，以及当前有多少内存正在被使用。在这种情况下，我们可以看到有\
  \ 1310MB 的内存处于活动状态，只有 78MB 被认为是非活动状态。这台机器拥有大量的内存，并且其中很大一部分正在被活跃使用。\n\n### 列表 3.3.\n\
  \n```\n bash-2.05b$ vmstat -a\n\nprocs -----------memory---------- ---swap-- -----io----\
  \ --system-- ----cpu----\n\n r  b   swpd   free  inact active   si   so    bi  \
  \  bo   in    cs us sy id wa\n\n 2  1 514004   5640 79816 1341208   33   31   204\
  \   247 1111  1548  8  5 73 14 \n```\n\n接下来，在 列表 3.4 中，我们查看另一个系统，该系统正在活跃地将数据在内存中进出交换。`si`\
  \ 列表示在每个采样期间内，交换数据以 480KB、832KB、764KB、344KB 和 512KB 的速率读入。`so` 列表示在每个采样期间内，内存数据以\
  \ 9KB、0KB、916KB、0KB、1068KB、444KB、792KB 的速率写入交换分区。这些结果可能表明系统没有足够的内存来处理所有运行中的进程。当进程的内存正在被保存，以便为之前交换到磁盘的应用程序腾出空间时，可能会发生同时高交换换入和交换出的速率。如果两个运行的程序所需的内存都超过了系统所提供的内存，这种情况将是灾难性的。例如，如果两个进程正在使用大量内存，并且都尝试同时运行，每个进程都可以导致对方的内存被写入交换分区。当其中一个程序需要一块内存时，它会踢出一个另一个应用程序正在需要的内存。当另一个应用程序开始运行时，它会踢出一个原始程序正在使用的内存块，并等待其内存从交换分区中加载。这可能导致两个应用程序都停滞，因为它们必须等待从交换分区取回内存后才能继续执行。一旦其中一个取得了一点点进展，它就会交换出另一个进程正在使用的内存，并导致另一个程序变慢。这被称为**抖动（thrashing）**。当这种情况发生时，系统大部分时间都花在与交换分区之间读写内存，系统性能急剧下降。\n\
  \n在特定情况下，交换最终停止了，因此很可能被交换到磁盘的内存并没有被原始进程立即需要。这意味着交换的使用是有效的，未使用的内存内容被写入磁盘，然后内存被分配给了需要它的进程。\n\
  \n### 列表 3.4.\n\n```\n [ezolt@localhost book]$ vmstat 1 100\n\nprocs -----------memory----------\
  \ ---swap-- -----io---- --system-- ----cpu----\n\n r  b   swpd   free   buff  cache\
  \   si   so    bi    bo   in    cs us sy id wa\n\n 2  1 131560   2320   8640  53036\
  \    1    9   107    69 1137   426 10  7 74  9\n\n 0  1 131560   2244   8640  53076\
  \  480    0   716     0 1048   207  6  1  0 93\n\n 1  2 132476   3424   8592  53272\
  \  832  916  1356   916 1259   692 11  4  0 85\n\n 1  0 132476   2400   8600  53280\
  \  764    0  1040    40 1288   762 14  5  0 81\n\n 0  1 133544   2656   8624  53392\
  \  344 1068  1096  1068 1217   436  8  3  5 84\n\n 0  1 133988   2300   8620  54288\
  \  512  444  1796   444 1090   230  5  1  92\n\n 0  0 134780   3148   8612  53688\
  \    0  792     0   792  1040   166  5  1  92\n\n 0  0 134780   3148   8612  53688\
  \    0  0     0   1050   158  4  1  95\n\n 0  0 134780   3148   8620  53680    0\
  \  0     0   1116   177  7  1  11\n\n 0  0 134780   3148   8620  536800000000111111\
  \   4777    1112\n```\n\n正如 列表 3.5 所示，正如你在上一章中看到的，`vmstat` 可以显示大量的不同统计数据。现在当我们观察它时，可以看到一些在其他输出中出现过的相同统计数据，例如活动、非活动、缓冲区、缓存和已用交换。然而，它还有几个新的统计数据，例如总内存，这表明该系统总共有\
  \ 1516MB 的内存，以及总交换，这表明该系统有 2048MB 的交换分区。在尝试计算交换和内存的使用百分比时，了解系统总量是有帮助的。另一个有趣的统计数据是页入（paged\
  \ in），它表示从磁盘读取的页的总数。此统计数据包含了启动应用程序时读取的页，以及应用程序本身可能使用的页。\n\n### 列表 3.5.\n\n```\n\
  \ bash-2.05b$ vmstat -s\n\n      1552528  total memory\n      1546692  used memory\n\
  \      1410448  active memory\n        111044  inactive memory\n         5836  free\
  \ memory\n         2676  buffer memory\n      2097096  total swap\n       526280\
  \  used swap\n      157084  free swap\n       395211  paged in\n      248232  paged\
  \ out\n     357355  interrupts\n     109410  context switches\n     376355  boot\
  \ time\n      67635  IO-wait\n     352222  IRQ\n      48724  softirq\n```\n\n正如\
  \ 列表 3.5 所示，正如你在上一章中看到的，`vmstat` 可以显示大量的不同统计数据。现在当我们观察它时，可以看到一些在其他输出中出现过的相同统计数据，例如活动、非活动、缓冲区、缓存和已用交换。然而，它还有几个新的统计数据，例如总内存，这表明该系统总共有\
  \ 1516MB 的内存，以及总交换，这表明该系统有 2048MB 的交换分区。在尝试计算交换和内存的使用百分比时，了解系统总量是有帮助的。另一个有趣的统计数据是页入，它表示从磁盘读取的页的总数。此统计数据包含了启动应用程序时读取的页，以及应用程序本身可能使用的页。\n\
  \n最后，在 列表 3.6 中，我们看到 `vmstat` 可以提供关于内核分配内存的信息。如前所述，Linux 内核有一系列“槽（slabs）”来存放动态数据结构。`vmstat`\
  \ 显示每个槽（`Cache`）、显示使用了多少（`Num`）、显示分配了多少（`Total`）、显示元素的大小（`Size`），以及槽使用的总页数（`Pages`）。这在跟踪内核如何使用内存时是有帮助的。\n\
  \n### 列表 3.6.\n\n```\n bash-2.05b$ vmstat -m\n\nCache                          Num\
  \   Total   Size   Pages\nudf_inode_cache                  0       0    416    \
  \   9\nfib6_nodes                       7     113     32     113\nip6_dst_cache\
  \                    9      17    224      17\nndisc_cache                     \
  \ 1      24    160      24\nraw6_sock                        0       0    672  \
  \     6\nudp6_sock                        0       0    640       6\ntcp6_sock  \
  \                    404     441   1120       7\nip_fib_hash                   \
  \  39     202     16     202\next3_inode_cache              1714    3632    512\
  \       8\n... \n```\n\n`vmstat` 提供了一种提取大量关于 Linux 内存子系统信息的方法。结合默认输出屏幕提供的其他信息，它可以提供关于系统状况和资源使用的良好视图。\n\
  \n#### 3.2.2 top (2.x 和 3.x)\n\n正如在前章中讨论的，`top` 提供了系统范围和进程特定的性能统计。默认情况下，`top` 按降序列出\
  \ CPU 消耗最高的进程，但也可以调整为按总内存使用量排序，以便跟踪哪些进程使用了最多的内存。\n\n##### 3.2.2.1 与内存性能相关的选项\n\n\
  `top` 没有可以操纵其内存统计显示的特殊命令行选项。它通过以下命令行进行调用：\n\n```\n top\n```\n\n\n\n\n然而，一旦运行，`top`\
  \ 允许你选择是否显示系统级内存信息，以及是否根据内存使用情况对进程进行排序。按内存消耗排序对于确定哪个进程消耗了最多的内存被证明特别有用。表 3-3 描述了不同的内存相关输出开关。\n\
  \n### 表 3-3. `top` 运行时开关\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `m` | 此选项切换是否在屏幕上显示系统内存使用信息。\
  \ |\n| `M` | 按使用的内存量对任务进行排序。由于进程分配的内存可能多于使用的内存，因此这是按驻留集大小（resident set size）排序的。驻留集大小是进程实际使用的量，而不是它们简单请求量。\
  \ |\n\n表 3-4 描述了 `top` 可以为整个系统和单个进程提供的内存性能统计。`top` 有两个版本，2.x 和 3.x，它们的输出统计信息的名称略有不同。表\
  \ 3-4 描述了两个版本的名称。\n\n### 表 3-4. `top` 内存性能统计\n\n| 选项 | 解释 |\n| :--- | :--- |\n|\
  \ `%MEM` | 这是该进程使用的系统物理内存的百分比。 |\n| `SIZE (v 2.x)`<br>`VIRT (v 3.x)` | 这是进程虚拟内存使用的总大小。这包括应用程序已分配但未使用的所有内存。\
  \ |\n| `SWAP` | 这是进程正在使用的交换内存（单位为 KB）。 |\n| `RSS (v 2.x)`<br>`RES (v 3.x)` | 这是应用程序实际使用的物理内存量。\
  \ |\n| `TRS (v 2.x)`<br>`CODE (v 3.x)` | 这是进程的可执行代码正在使用的物理内存总量（单位为 KB）。 |\n| `DSIZE\
  \ (v 2.x)`<br>`DATA (v 3.x)` | 这是专门用于进程数据和栈的内存总量（单位为 KB）。 |\n| `SHARE (v 2.x)`<br>`SHR\
  \ (v 3.x)` | 这是可以与其他处理器共享的内存总量（单位为 KB）。 |\n| `D (v 2.x)`<br>`nDRT (v 3.x)` | 脏页且需要刷新到磁盘的页数。\
  \ |\n| `Mem:`<br>`total, used, free` | 在物理内存中，这表示总量、已用量和空闲量。 |\n| `swap: total,\
  \ used, free` | 在交换内存中，这表示总量、已用量和空闲量。 |\n| `active (v 2.x)` | 当前活跃的物理内存量。 |\n| `inactive\
  \ (v 2.x)` | 不活跃且有一段时间未使用的物理内存量。 |\n| `buffers` | 用于缓冲要写入磁盘的值的物理内存总量（单位为 KB）。 |\n\
  \n`top` 提供了关于不同运行进程的大量内存信息。正如后面的章节中讨论的，你可以使用这些信息来确定应用程序是如何分配和使用内存的。\n\n### 3.2.2.2\
  \ 使用示例\n\n列表 3.7 与上一节所示的 `top` 运行示例类似。然而，在这个示例中，注意在缓冲区中，我们总共有 1,024MB 的物理内存，其中约\
  \ ~84MB 是空闲的。\n\n##### 列表 3.7。\n\n```\n [ezolt@wintermute doc]$ top\n\ntop - 15:47:03\
