  \ `vmstat` 或 `top` 更适合调查系统范围内的内存使用。\n\n### 3.2.4. gnome-system-monitor (II)\n\n\
  `gnome-system-monitor` 在许多方面都是 `top` 的图形化对应版本。它允许你监控单个进程，并根据其显示的图表观察系统负载。它还提供了 CPU\
  \ 和内存使用情况的简易图表。\n\n##### 3.2.4.1 与内存性能相关的选项\n\n`gnome-system-monitor` 可以从 Gnome\
  \ 菜单中调用。（在 Red Hat 9 及更高版本中，它位于 System Tools > System Monitor。）然而，它也可以使用以下命令调用：\n\
  \n```\ngnome-system-monitor \n```\n\n`gnome-system-monitor` 没有任何影响内存性能测量的相关命令行选项。\n\
  \n### 3.2.4.2 示例用法\n\n当启动 `gnome-system-monitor` 并选择 System Monitor（系统监视）选项卡时，你会看到一个与图\
  \ 3-1 类似的窗口。此窗口允许你一眼查看图表，看到使用了多少物理内存和交换分区，以及其使用情况随时间发生了变化的。在这种情况下，我们看到 1007MB 总内存中有\
  \ 969MB 正在被使用。内存使用量在一段时间内保持平稳。\n\n##### 图 3-1.\n\n![](img/03fig01.jpg)\n\n`gnome-system-monitor`\
  \ 提供的数据图形视图可以使操作更简单、更快速；然而，大多数细节（例如内存是如何使用的）都是缺失的。\n\n### 3.2.5. free\n\n`free`\
  \ 提供了系统如何使用内存的概览，包括空闲内存量。尽管 `free` 命令可能显示特定系统没有多少空闲内存，但这并不一定是坏事。Linux 内核并没有让内存闲置不用，而是将其用作磁盘读取的缓存和磁盘写入的缓冲区。这可以极大提高系统性能。由于这些缓存和缓冲区可以随时丢弃，且在应用程序需要可以使用这些内存，`free`\
  \ 显示的是空闲内存加上或减去这些缓冲区量。\n\n##### 3.2.5.1 与内存性能相关的选项\n\n可以使用以下命令行调用 `free`：\n\n```\n\
  free [-l] [-t] [-s delay ] [-c count ] \n```\n\n表 3-6 描述了修改 `free` 显示统计类型的参数。与 `vmstat`\
  \ 一样，`free` 可以定期显示更新的内存统计数据。\n\n##### 表 3-6. free 命令行选项\n\n| 选项 | 解释 |\n| :--- |\
  \ :--- |\n| `-s delay` | 此选项导致 `free` 每隔 `delay` 秒打印新的内存统计数据。 |\n| `-c count` |\
  \ 此选项导致 `free` 打印 `count` 次新统计数据。 |\n| `-l` | 此选项显示你使用了多少高内存和多少低内存。 |\n\n`free`\
  \ 实际上显示了任何内存统计工具中最完整的内存统计数据之一。它显示的统计数据见表 3-7。\n\n##### 表 3-7. free 内存统计\n\n| 统计项\
  \ | 解释 |\n| :--- | :--- |\n| `Total` | 这是物理内存和交换分区的总量。 |\n| `Used` | 这是使用的物理内存和交换分区量。\
  \ |\n| `Free` | 这是未使用的物理内存和交换分区的量。 |\n| `Shared` | 这是一个过时的值，应该忽略。 |\n| `Buffers`\
  \ | 这是用作磁盘写入缓冲区的物理内存。 |\n| `Cached` | 这是用作磁盘读取缓存的物理内存。 |\n| `-/+ buffers/cache`\
  \ | 在 `Used` 列中，这显示了如果缓冲区/缓存不计为已用内存，将使用的内存量。在 `Free` 列中，这显示了如果缓冲区/缓存被计为空闲内存，将空闲的内存。\
  \ |\n| `Low` | 低内存或内核可以直接访问的内存的总量。 |\n| `High` | 高内存或内核可以直接访问的内存的总量。 |\n\n### 3.2.5.2\
  \ 示例用法\n\n`free` 实际上显示了任何内存统计工具中最完整的内存统计数据之一。它显示的统计数据见表 3-7。\n\n`Total`, `Used`,\
  \ `Free`, `Shared`, `Buffers`, `Cached`, `Low`, `High`, `Totals`。\n\n`free` 提供了系统如何使用内存的概览，包括空闲内存量。\n\
  \n尽管你可以自己对列进行总计，但列表 3.11 显示的 `-t` 标志会你在加上交换分区和实际内存时的总计。在这种情况下，系统有 376MB 物理内存。我们目前有\
  \ 122,772 字节内存；然而，我们有 234,720 字节空闲。\n\n##### 列表 3.10.\n```\n [ezolt@wintermute procinfo-3.0]$\
  \ free\n\n             total       used       free     shared    buffers      cached\n\
  Mem:        385148     247088     138060          0       9052      115024\n-/+\
  \ buffers/cache:     123012     262136\n\nSwap:       394080      81756     312324\n\
  ```\n\n`free` 提供了系统如何使用内存的概览，包括空闲内存量。\n\n尽管 `free` 命令可能显示特定系统没有多少空闲内存，但这并不一定是坏事。Linux\
  \ 内核并没有让内存闲置不用，而是将其用作磁盘读取的缓存和磁盘写入的缓冲区。这可以极大提高系统性能。由于这些缓存和缓冲区可以随时丢弃，且在应用程序需要可以使用这些内存，`free`\
  \ 显示的是空闲内存加上或减去这些缓冲区量。\n\n##### 列表 3.11.\n```\n [ezolt@localhost procinfo-3.0]$\
  \ free -t\n\n             total       used       free     shared    buffers    \
  \  cached\nMem:        385148     247088     138060          0       9052      115024\n\
  -/+ buffers/cache:     123012     262136\n\nSwap:       394080      81756     312324\n\
  \nTotal:      779228     328844     450384 \n```\n\n最后，`free` 告诉你系统使用的高内存和低内存量。这对于具有\
  \ 1GB 或更多物理内存的 32 位机器（如 IA32）特别有用。（只有 32 位机器才会有高内存。）列表 3.12 显示一个系统空闲内存非常少，总共 6MB。它显示一个系统有\
  \ 876MB 低内存和 640MB 高内存。该系统的缓存内存远多于缓冲区内存，表明它可能正在激进地将数据写入磁盘，而不是将其留在缓冲区中长时间。\n\n\n\n\
  \n\n```\nfas% free -l\n\n             total       used       free     shared   \
  \ buffers      cached\n\nMem:       1552528    1546472       6056          0   \
  \    7544      701408\n\nLow:        897192     892800       4392\n\nHigh:     \
  \  655336     653672       1664\n\n-/+ buffers/cache:     837520     715008\n\n\
  Swap:      2097096     566316    1530780 \n```\n\n`free` 可以让你直观地了解系统内存的使用情况。可能需要一点时间来适应输出格式，但它包含了所有重要的内存统计数据。\n\
  \n### 3.2.6. slabtop\n\n`slabtop` 类似于 `top`，但它不是显示系统中进程的 CPU 和内存使用信息，而是实时显示内核如何分配各种缓存（caches）以及这些缓存的满程度。在内部，内核有一系列由一个或多个\
  \ slabs 组成的缓存。每个 slab 由一组一个或多个对象组成。这些对象可以是活跃（已使用）或非活跃（未使用）。`slabtop` 向你显示不同 slabs\
  \ 的状态。它显示了它们的满程度以及占用了多少内存。\n\n#### 3.2.6.1 与内存性能相关的选项\n\n使用以下命令行调用 `slabtop`：\n\n\
  ```\nslabtop --delay n \x96sort={a | b | c | l | v | n | o | p | s | u} \n```\n\n\
  `slabtop` 的命令行选项在[表 3-8 中描述。\n\n##### 表 3-8. `slabtop` 命令行选项\n\n| 选项 | 解释 |\n| :---\
  \ | :--- |\n| `--delay` | 指定 `slabtop` 在两次更新之间的等待时间。 |\n| `--sort {order}` | 指定输出的顺序。`order`\
  \ 可以是以下之一： |\n| `a` | 按每个 slab 中活跃对象的数量进行排序。 |\n| `b` | 按特定缓存中每个 slab 的对象总数（活跃和非活跃）进行排序。\
  \ |\n| `c` | 按每个缓存使用的总内存量进行排序。 |\n| `l` | 按每个缓存使用的 slabs 数量进行排序。 |\n| `v` | 按每个缓存使用的活跃\
  \ slabs 数量进行排序。 |\n| `n` | 按缓存名称进行排序。 |\n| `o` | 按特定缓存中的对象数量进行排序。 |\n| `P` | 按每个\
  \ slab 使用的页数（pages）进行排序。 |\n| `s` | 按缓存中对象的大小进行排序。 |\n\n`slabtop` 让我们得以窥探 Linux\
  \ 内核的数据结构。这些 slab 类型都与 Linux 内核紧密结合，对这些 slab 的描述超出了本书的范围。如果某个特定的 slab 使用了大量的内核内存，阅读\
  \ Linux 内核源码和访问网络是了解这些 slab 用途的绝佳方法。\n\n### 3.2.6.2 示例用法\n\n如列表 3.13 所示，默认情况下，`slabtop`\
  \ 会填充整个控制台并每三秒持续更新统计数据。在这个示例中，你可以看到大小为 64 的 slab 拥有最多的对象，但其中只有一半是活跃的。\n\n##### 列表\
  \ 3.13.\n\n```\n [ezolt@wintermute proc]$ slabtop\n\n Active / Total Objects (%\
  \ used)    : 185642 / 242415 (76.6%)\n\n Active / Total Slabs (% used)      : 12586\
  \ / 12597 (99.9%)\n\n Active / Total Caches (% used)     : 88 / 134 (65.7%)\n\n\
  \ Active / Total Size (% used)       : 42826.23K / 50334.67K (85.1%)\n\n Minimum\
  \ / Average / Maximum Object : 0.01K / 0.21K / 128.00K\n\n  OBJS ACTIVE  USE OBJ\
  \ SIZE  SLABS OBJ/SLAB CACHE SIZE NAME\n\n 66124  34395  52%    0.06K   1084   \
  \    61      4336K size-64\n\n 38700  35699  92%    0.05K    516       75      2064K\
  \ buffer_head\n\n 30992  30046  96%    0.15K   1192       26      4768K dentry_cache\n\
  \n 21910  21867  99%    0.27K   1565       14      6260K radix_tree_node\n\n 20648\
  \  20626  99%    0.50K   2581        8     10324K ext3_inode_cache\n\n 11781   7430\
  \  63%    0.03K     99      119       433K\n```\n\n\n\n\n\n这是一种既交换到磁盘又存在于内存中的内存。如果需要该内存，它可以立即被重用，因为数据已经存在于交换区中。\n\
  \n`frmpg/s`\n\n系统释放内存页的速率。负数表示系统正在分配内存页。\n\n`bufpg/s`\n\n系统将新内存页作为缓冲区的速率。负数表示缓冲区数量正在收缩，系统使用的缓冲区在变少。\n\
  \n尽管 `sar` 缺失了高内存和低内存的统计数据，但它提供了几乎每一种其他的内存统计数据。它还能记录网络 CPU 和磁盘 I/O 统计数据，这使其变得非常强大。\n\
  \n### 3.2.7.2 示例用法\n\nListing 3.14 显示了 `sar` 提供关于内存子系统当前状态的信息。从结果可以看出，系统使用的内存量在总内存的\
  \ 98.87% 到 99.25% 之间波动。在观察过程中，空闲内存从 11MB 降到 7MB。交换内存的使用百分比维持在约 11% 左右。系统有约 266MB\
