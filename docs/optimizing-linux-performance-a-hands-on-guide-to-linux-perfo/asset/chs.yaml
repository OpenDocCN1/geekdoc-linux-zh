  \n(container=0x80c5a2b, event=0x9ceb628,\n\n    icon_view=0x9d2b720) at fm-icon-view.c:2141\n\
  \n#3  0x00da32be in g_cclosure_marshal_VOID__POINTER (closure=0x9d37620,\n\nreturn_value=0x0,\
