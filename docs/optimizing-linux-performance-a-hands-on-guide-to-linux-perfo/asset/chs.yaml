  \ `prelink` 是否导致了问题，但我们怀疑是它。确定 `prelink` 是否导致了磁盘 I/O 最简单的方法是“杀死” `prelink` 进程并观察磁盘占用率是否消失。这在生产机器上可能不可，但由于我们是在个人桌面上操作，可以得随意一些。列表\
