  \n# 关于作者\n\nPHIL EZOLT 在九多年前，当他正在卡内基基梅梅隆大学攻读电气与计算机工程本科士学位时，发现了 Linux。在六年的时间里，他为\
  \ Compaq 的 Alpha 性能小组移植并设计了 Linux 性能工具，并在 SPEC CPU 子委员会中代表 Compaq。在此期间，他利用自己移植和开发的性能工具，提升了\
  \ Linux 在行业标准 SPEC Web 和 CPU 基准测试中的性能。Phil 目前是惠尔惠（Hewlett-Packard）一个团队的一员，负责开发 Sepia，一种使用\
  \ Linux XC 集群、OpenGL 和现成显卡来实现实时高端可视化的可视化技术。他目前正在哈佛大学攻读计算机科学硕士学位，并且是德国桌游游戏的忠粉丝。\n\
  \n# 第 1 章 性能猎寻技巧\n\n在没有预见和规划的情况下解决性能问题是痛苦的。你会浪费时间，并因为问题原因反复从指缝中溜走而感到沮丧。通过遵循一套正确的程序，你可以将一次令人沮丧的性能猎寻转变为一个有趣的侦探故事。每一条信息都会引导你更接近真魁祸首。人并不总是值得信赖，证据将是你唯一的朋友。在你调查问题时，它会经历不常的转折，你在猎寻初期发现的信息可能正是最终帮你解决问题的关键。最棒的部分是，当你最终抓住“坏蛋”并修复问题时，你会感到肾上腺素飙升的快感和成就感。\n\
  \n如果你从未调查过性能问题，第一步可能会让你无从下手。然而，通过遵循一些显而易见和不显而易见的技巧，你可以节省时间，并顺利找到性能问题的原因。本章的目标是为你提供一系列技巧和指南，帮助你猎寻性能问题。这些技巧向你展示了在调查系统或应用程序问题时如何避免一些常见的陷阱。这些技巧大部分是从浪费时间和沮丧的死胡同中获得的痛苦教训。这些技巧将帮助你快速高效地解决性能问题。\n\
  \n阅读完本章后，你应该能够：\n\n*   避免重复他人的工作。\n*   避免重复自己的工作。\n*   避免因收集误导性信息而导致的错误线索。\n*  \
  \ 就你的调查创建一个有用的参考文档。\n\n尽管没有任何性能调查是完美的（你几乎总是会说，“要是我当初早能想到那个就好了”），但这些技巧可以帮助你避免性能调查中的常见错误。\n\
  \n## 1.1 通用技巧\n\n### 1.1.1 记录大量的笔记（保存一切）\n\n在调查性能问题时，你可能做的最重要的事情就是记录你看到的每一个输出、执行的每一条命令以及你研究的每一条信息。一组组织良好的笔记让你只需通过查看笔记来测试关于性能问题原因的理论，而无需重新运行测试。这节省了大量时间。写下来以创建一个永久记录。\n\
  \n在开始性能调查时，我通常会为调查创建一个目录，在 GNU emacs 中打开一个新的“Notes”文件，并开始记录有关系统的信息。然后将性能结果存储在该目录中，并将相关的有趣信息存储在\
  \ Notes 文件中。我建议你将以下内容添加到你的性能调查文件和目录：\n\n*   记录硬件/软件配置—— 这涉及记录硬件配置信息（内存容量、CPU 类型、网络和磁盘子系统）以及软件环境（操作系统和软件版本以及相关的配置文件）。这些信息以后似乎很容易复现，但在追溯问题时，你可能会大幅更改系统的配置。细致且严谨的笔记可以用于确定特定测试期间的系统配置。\n\
  \n    示例：为每次测试保存 `cat /proc/pci`、`dmesg` 和 `uname -a` 的输出。\n\n*   保存并组织性能结果—— 在运行测试很长时间之后回顾性能结果是有价值的。记录带有系统配置的测试结果。这让你能够比较不同配置如何影响性能结果。如果需要，重新运行测试是可能的，但通常测试一种配置是一个耗时的过程。保持笔记组织良好并避免重复工作会更有效。\n\
  \n*   写下命令行调用—— 当你运行性能工具时，你经常会创建复杂的命令行，测量你感兴趣的系统特定区域。如果你想重新运行测试，或在不同的应用程序上运行相同的测试，重现这些命令行可能会令人烦恼，而且很难第一次就做对。最好记录你输入的准确内容。你就可以为未来的测试重现完全相同的命令行，在回顾过去结果时，也能清楚地看到你测量了什么。Linux\
  \ 命令 `script`（在第 8 章，“实用工具：性能工具辅助器”中进行了详细描述）或从终端“剪切粘贴”都是实现此操作的好方法。\n\n*   记录研究信息和\
  \ URL—— 在调查性能问题时，记录你在互联网、电子邮件或通过个人互动发现的相关信息是重要的。如果你发现一个看起来相关的网站，将文本剪切粘贴到你的笔记中。（网站可能会消失。）不过，也要保存\
  \ URL，因为你可能以后需要查看该页面，或者该页面指向后来变得重要的信息。\n\n当你收集并记录所有这些信息时，你可能会怀疑这是否值得精力。有些信息现在看起来没用或具有误导性，但将来可能很有用。（一次良好的性能调查就像一部好的侦探剧：尽管线索起初很困惑，但一切最终变得明朗。）在调查问题时请记住以下几点：\n\
  \n> 结果的含义可能是模糊的—— 性能工具并不总是告诉你什么。有时，你需要更多信息来理解特定结果的含义。在以后，你可能会以新的视角重新审视看似无用的测试结果。旧信息实际上可能会反驳或证明关于问题性质的特定理论。\n\
  \n> 所有信息都是有用信息（这就是你保存它们的原因）—— 保存运行过的测试或系统配置信息立即可能并不明显。当你试图向开发人员或经理解释为什么系统性能低下时，这会证明极有用。通过记录和组织你在调查期间看到的一切，你拥有了支持特定理论的证据，并有一个大量的测试结果库来证明或反驳其他理论。\n\
  \n\n\n\n\n> 定期回顾你的笔记可以提供新的见解——当你拥有关于性能性能问题的大量信息时，请定期对其进行回顾。以全新的视角审视可以让你关注结果，而不是测试本身。当许多测试结果被聚合并同时审查时，问题的原因可能会显现出来。回顾你所收集的数据，可以让你在不实际运行任何测试的情况下测试某些理论。\n\
  \n尽管在调查问题时，重新做某些工作是不可避免的，但你花在重复旧工作上的时间越少，效率就越高。如果你记录了详尽的笔记，并拥有一种方法在发现信息时进行记录，你就可以依靠已经完成的工作，避免重新运行测试和重新研究。为了节省时间并避免沮败，请保持可靠且一致的笔记。\n\
  \n例如，如果你调查了一个性能问题，并最终确定原因是某件硬件（内存慢、CPU 慢等），你可能想通过升级该慢硬件并重新运行测试来验证这一理论。获取新硬件通常需要一段时间，在能够重新运行测试之前，可能会过去很长时间。当你终于能够进行操作时，你希望能够在新旧硬件上运行相同的测试。如果你保存了旧的测试调用和测试结果，你将立即知道如何为新硬件配置测试，并并将新结果与存储的旧结果进行比较。\n\
  \n### 1.1.2. 自动化冗余任务\n\n当你开始调整系统以提高性能时，在输入复杂的命令时很容易出错。无意中使用错误的参数或配置可能会产生误导性的性能信息。自动化性能工具的调用和应用程序测试是一个好主意：\n\
  \n> 性能工具调用——某些 Linux 性能工具需要相当复杂的命令行。为自己省省心，将它们存储在 shell 脚本中，或者将完整的命令放在一个参考文件中，以便你复制和粘贴。这可以节省你的沮败感，并让你确定你调用工具时使用的命令行是正确的。\n\
  \n> 应用程序测试——大多数应用程序通过命令行或配置文件具有复杂的配置。你经常需要多次运行你正在测试的应用程序。如果你对调用进行脚本化，就能避免沮败。虽然输入一个\
  \ 30 个字符的命令起初看起来很容易，但在执行过 10 次之后，你就会感激自动化的了。\n\n如果你尽可能地实现自动化，就会减少错误。通过脚本自动化可以节省时间，并帮助避免由不当的工具和测试调用导致的误导信息。\n\
  \n例如，如果你正尝试在特定的工作负载或时间范围内监控系统，你可能在测试结束时不在现场。拥有一个脚本是有帮助的，该脚本可以在测试完成后自动收集、命名并保存所有生成的性能数据，并自动将其放在“Results”目录中。一旦配备了这种基础设施，你就可以使用不同的优化和调优重新运行测试，而无需担心数据是否会被保存。相反，你可以将全部精力放在寻找问题原因上，而不是管理测试结果。\n\
  \n### 1.1.3. 如果可能，选择低开销工具\n\n通常情况下，观察系统的行为会改变其行为。（对于你们物理爱好者来说，这被称为海森堡不确定原理。）\n\n\
  具体来说，当使用性能工具时，它们会改变系统运行的方式。当你调查问题时，你想看到应用程序的性能，并且处理性能工具引入的误差。这是必要的代价，但你必须知道它的存在并尝试将其最小化。某些性能工具提供了系统的高精度视图，但使用了高开销的方法获取信息。开销极高的工具对系统行为的影响比低开销工具大得多。如果你只需要系统的粗略视图，那么使用开销较低的工具更好，尽管它们没有那么准确。\n\
  \n例如，`ps` 工具可以给你关于应用程序正在使用的内存数量和类型的相当不错但粗略的概述。更准确但侵入性强的工具，如 `memprof` 或 `valgrind`\
  \ 也提供这些信息，但它们可能会通过比原始应用程序消耗更多的内存或 CPU 来改变系统行为。\n\n### 1.1.4. 使用多个工具理解问题\n\n虽然如果只需要一个工具就能找出性能问题的原因，那将是非常方便的，但这种情况极少见。相反，你使用的每个工具都提供了一个关于问题原因的线索，你必须协作使用多个工具才能真正理解发生了什么。例如，一个性能工具可能会告诉你系统有高量的磁盘\
  \ I/O，而另一个工具可能显示系统正在使用大量的交换分区（swap）。如果你仅根据第一个工具的结果得出解决方案，你可能只是买了一个更快的硬盘驱动器（并发现性能问题仅略有改善）。然而，通过结合使用工具，你确定了大量的磁盘\
  \ I/O 是由于使用了大量的交换引起的。在这种情况下，你可能通过购买更多内存来减少交换（从而导致高磁盘 I/O 消失）。\n\n结合使用多个性能工具通常能给你提供比任何单一工具都更清晰的性能问题图景。\n\
  \n## 盲人摸象的寓言\n\n三个盲人靠近一头大大象，试图弄清楚它长什么样。第一个人拉着尾巴说：“大象像根绳子。”第二个人摸着大象的腿说：“大象像一棵树。”第三个人摸着大象的侧面说：“大象像一面坚固的墙。”\n\
  \n显然，他们中没有给出正确的答案。然而，如果他们分享并结合自己的印象，他们可能会发现关于大象的真相。不要像摸象的盲人那样。使用多个性能工具来验证问题的原因。\n\
  \n### 1.1.5. 信任你的工具\n\n在性能搜寻过程中，最激动也最沮丧的时刻之一就是工具显示出“不可能”的结果。某些“不可能”发生的事情确实发生了。第一直觉是相信工具坏了。不要被欺骗。工具是公正的。尽管它们可能是错误的，但更有可能是应用程序正在做它不该做的事情。使用工具来调查问题。\n\
  \n例如，Gnome 计算器仅为了启动和退出就使用了 2000 多次系统调用。如果没有性能工具来证明这一事实，仅仅启动和停止一个应用程序似乎需要如此多的系统调用是不可能的。然而，性能工具可以显示这是在哪里发生以及为什么发生的。\n\
  \n### 1.1.6. 使用他人的经验（谨慎地）\n\n在调查任何性能问题时，你可能会发现任务困难重重。不要单打独斗。询问开发者他们是否见过类似的问题。尝试找到已经解决你正在经历的问题的人。在\
  \ Web 上搜索类似的问题并并找到解决方案。向用户列表和开发者发送电子邮件。\n\n\n\n\n这条建议伴随着一个警告：即使是那些认为自己了解其应用的开发者，也并不总是正确的。如果开发者与性能工具的数据不一致，那么可能是开发者错了。向开发者展示你的数据以及你得出特定结论的依据。他们通常会帮助你重新解释数据或修复问题。无论何种，你的调查工作都会更进一步。如果你的数据显示发生了不该发生的事情，不要害怕与开发者持不同意见。\n\
  \n例如，你通常可以通过在 Google 上搜索相似问题并遵循找到的指令来解决性能问题。在调查 Linux 问题时，很多时候你会发现其他人以前遇到过相同的问题（即使是多年前），并在公共邮件列表上报告了解决方案。使用\
  \ Google 是很容易的，它可以为你节省好几天的工作时间。\n\n## 1.2 性能调查的概述\n\n本节概述了在你开始性能调查时的一系列基本步骤。由于最终目标是解决问题，最好的主意是在接触任何性能工具之前先对问题进行研究。遵循特定的方案是解决问题的一种高效方法，可以避免浪费宝贵的时间。\n\
  \n### 1.2.1 确定指标、基准和目标\n\n性能调查的第一步是确定当前的性能，并弄清楚需要改进多少。如果你的系统性能远低于预期，你可能会认为值得花时间调查。然而，如果系统性能接近其峰值，那么它可能不值得调查。确定峰值性能值有助于你设定合理的性能预期，并为你提供一个性能目标，让你知道何时停止优化。你总是可以对系统进行更多微调，但如果没有性能目标，你可能会浪费大量时间去榨取那额外的百分之几的性能，尽管你可能并不需要它。\n\
  \n### 1.2.1.1 建立指标\n\n要确定何时完成，你必须创建或使用一个已经建立的系统性能指标。指标是一个指示系统运行情况的客观测量。例如，如果你正在优化\
  \ Web 服务器，你可以选择“每秒处理的 Web 请求数”。如果你没有客观的方法来衡量性能，那么在调整系统时，几乎无法确定你是否取得了任何进展。\n\n###\
  \ 1.2.1.2 建立基准\n\n在你确定了将如何衡量特定系统或应用的性能后，确定当前的性能水平是关重要的。在进行任何调优或优化之前，运行应用程序并记录其性能；这被称为基准值，是性能调查的起点。\n\
  \n### 1.2.1.3 建立目标\n\n在你选定性能指标和基准后，选择一个目标也同样重要。这个目标将引导你走向性能的终点。你可以无限地微调系统，随着时间的增加，你总能让它变得好一点点。如果你选择了目标，你就会知道何时完成。要设定一个合理的目标，以下是一些良好的起点：\n\
  \n*   寻找具有相似配置的人并询问他们的性能测量值—— 这是一个理想的情况。如果你能找到一个运行得更好的相似系统，你不仅可以为你的系统选择一个目标，还可能与那个人合作，确定为什么你的配置较慢以及你们的配置有何不同。在调查问题时，使用另一个系统作为参考可能极其有用。\n\
  *   查找行业标准基准测试的结果—— 许多网站会比较计算系统各个方面的基准测试结果。某些基准测试结果只有通过巨大的努力才能实现，因此它们可能不代表实际的使用情况。然而，许多基准测试网站提供了获得特定结果时使用的配置。这些配置可以为你帮助调优系统提供线索。\n\
  *   使用不同操作系统或应用程序运行你的硬件—— 在你的系统上运行功能类似的不同应用程序可能是可能的。例如，如果你有两个不同的 Web 服务器，其中一个运行缓慢，尝试换另一个看看它的性能是否更好。或者，尝试在不同的操作系统上运行同一个应用程序。如果系统在上述任一情况下运行得更好，你就知道你的原始应用程序有改进空间。\n\
  \n如果你使用现有的性能信息来指导你的目标，你就有更大的机会选择一个既具有挑战性又并非不可能的目标。\n\n## 获取“低垂的果实”（Low-Hanging Fruit）\n\
  \n性能搜索的另一种方法是为搜索选择一段时间，而不是设定目标，而是在这段时间内尽可能地优化。如果一个应用程序从未针对给定的工作负载进行过优化，它通常会有几个相对容易修复的问题。这些容易修复的问题被称为“低垂的果实”。\n\
  \n为什么是“低垂的果实”？性能调查的一个类比是想象你饿了，站在一棵苹果树下。你可能会去抓离地面最近、最容易够到的苹果。这些低垂的苹果满足你饥饿的效果与树上更高处难以够到的苹果一样好；然而，采摘它们的工作要少得多。同样，如果你在有限的时间内优化应用程序，你可能只需尝试修复最简单明显的问题（低垂的果实），而不是进行一些更困难、更根本的改变。\n\
  \n### 1.2.2 追踪大致问题\n\n使用性能工具初步判断问题的原因。通过对问题进行初步的粗略评估，你可以获得关于问题的高层级概念。粗略评估的目标是收集足够的信息以传递给该程序的其他用户和开发者，以便他们提供建议和技巧。写一份良好的说明，解释你认为问题可能是什么，以及哪些测试让你得出了结论，是至关重要的。\n\
  \n### 1.2.3 查看问题是否已经解决\n\n你的下一个目标应该是确定其他人是否已经解决了该问题。性能调查可能是一个漫长且耗时的过程。如果你可以直接复他人的工作，你会在开始之前就完成。因为你的目标仅仅是提高系统性能，解决性能问题的最佳方法是依靠他人的做法。\n\
  \n尽管你对关于性能问题的具体建议持保留态度，但这些建议可以启发启发，让你看到其他人可能是如何调查类似问题的，他们尝试如何解决问题，以及是否成功了。\n\n以下是几个寻找性能建议的\
  \ get 途径：\n\n*   在网络上搜索类似的错误信息/问题—— 这通常是我调查的第一线。网络搜索通常会揭示有关应用程序或你所看到的特定错误状况的大量信息。它们还可以引导你找到其他用户优化系统的信息，并可能关于哪些方法有效、哪些无效提供提示。成功的搜索可以产生直接适用于你的性能问题的页面。使用\
  \ Google 或 Google Groups 进行搜索是寻找具有相似性能问题的人特别有用的方法。\n\n\n\n\n\n-   **在应用程序邮件列表中寻求帮助**——\
  \ 大多数流行或公开开发的软件都有一个使用该软件的人员邮件列表。这是寻找性能问题答案的理想场所。读者和贡献者通常在运行软件和使其性能良好方面非常有经验。搜索邮件列表的归档，因为可能有人曾问过类似的问题。原始消息的后续回复可能会描述解决方案。如果没有提供，请向最初描述该问题的人发送电子邮件，询问他或她是否已经想出了解决方法。如果这种方法不奏效，或者没有其他人遇到过类似的问题，请向该邮件列表发送一封描述你问题的电子邮件；如果你足够幸运，可能已经有人解决了了你的问题。\n\
  \n-   **向开发者发送电子邮件**—— 大多数 Linux 软件的文档某处都包含了开发者的电子邮件地址。如果互联网搜索和邮件列表都失败了，你可以尝试直接向开发者发送电子邮件。开发者通常非常忙，所以他们可能没有时间回答。然而，他们比任何人都了解该应用程序。如果你能为开发者提供一份关于性能问题的连贯分析，并愿意与开发者合作，他或她可能能够帮助你。虽然他们对性能问题原因的判断可能不正确，但开发者可能会为你指明一个富有成果的方向。\n\
  \n-   **与内部开发者交流**—— 最后，如果这是一个在内部开发的程序，你可以打电话或给内部开发者发送电子邮件。这与联系外部开发者几乎完全相同，但内部人员可能能够为你的问题投入更多时间，或者引导你查看内部知识库。\n\
  \n通过依靠他人的工作，你可能在自己开始调查之前就能解决问题。至少，你很可能找到一些值得调查的可靠途径，因此最好的方法始终是看看别人发现了什么。\n\n###\
  \ 1.2.4. 案件开始（开始调查）\n\n既然你已经耗尽了让他人解决问题的可能性，那么性能调查必须开始了。后面的章节将详细介绍相关的工具和方法，但这里有几个让工作进行得更好的小技巧：\n\
  \n-   **隔离问题**—— 如果可能，请消除你正在调查的系统上运行的任何无关程序或应用程序。一个运行着许多不同应用程序的高负载系统会偏偏性能工具收集的信息，并最终导致你走入错误的道路。\n\
  \n-   **利用系统差异寻找原因**—— 如果你能找到一个运行良好的类似系统，它将成为你调试问题的有力助手。使用性能工具的问题之一是，你并不一定有一种好的方法来判断性能工具的结果是否指示了某个问题。如果你有一个良好的系统和一个糟糕的系统，你可以在两个系统上运行相同的性能工具并比较结果。如果结果存在差异，你可能通过找出系统之间的差异来确定问题的原因。\n\
  \n-   **一次改变一处**—— 这非常重要。为了真正确定问题所在，你每次应该只进行一种更改。这可能很耗时间，并导致你运行许多不同的测试，但这确实是确定你是否已经解决问题的唯一方法。\n\
  \n-   **优化后务必重新测量**—— 如果你正在调整系统，在更改某些内容后重新测量一切是非常关重要的。当你开始修改系统配置时，你之前生成的所有性能信息可能不再有效了。通常，当你解决一个性能问题时，其他问题会接踵而至。新问题可能与旧问题非常不同，所以你真的必须重新运行性能工具，以确保你正在调查正确的问题。\n\
  \n遵循这些提示可以帮助你避免误导线索，并帮助确定性能问题的原因。\n\n### 1.2.5. 记录、记录、记录\n\n如前提到的，记录你所做的事情非常重要，以便你日后可以回来进行审查。如果你找出了性能问题，你的脑中会有一大堆笔记和\
  \ URL。它们可能是一团混乱无章的杂乱，但目前你理解它们的含义以及组织方式。在解决问题后，花些时间重写你发现的内容以及你为什么认为它是正确的。包含你测量的性能结果和你所做的实验。尽管这看起来看起来工作量很大，但它可能非常有价值。几个月后，很容易忘记你做过的所有测试，如果你不写下结果，你最终可能会重做一遍。如果你在测试记忆新鲜时编写报告，你就不需要再次做这些工作，而是可以依靠你写的内容。\n\
  \n### 1.3. 章节总结\n\n寻找性能问题应该是一个令人满意且兴奋的过程。如果你有一套良好的方法来研究和分析，那么在搜寻问题时，这种方法将获得数倍的回。首先，确定其他人是否遇到过类似的问题；如果有，尝试他们的解决方案。对他们告诉你的内容保持怀疑态度，但要寻找其他具有类似问题经验的人士。为你的性能搜寻建立一个合理的指标和目标；指标使你能够知道何时完成任务。自动化性能测试。在生成测试结果时，务必保存测试结果和配置信息，以便你稍后查看结果。保持你的结果整洁，并记录你发现的与问题相关的任何研究和其他信息。最后，定期查看你的笔记，以发现你第一次可能错过的信息。如果你遵循这些准则，你将有一个清晰的目标和清晰的程序来调查问题。\n\
  \n本章为性能调查提供了基础背景，后续章节将涵盖 Linux 特有的性能工具。你将学习如何使用这些工具，它们可以提供什么类型的信息，以及如何结合使用它们发现特定系统上的性能问题。\n\
  \n\n\n\n在 Linux 中，进程可以是可运行的（runnable），也可以是阻塞的（blocked）等待某个事件完成。阻塞进程可能在等待来自 I/O 设备的数据，或者等待系统调用的结果。如果一个进程是可运行的，意味着它正在与其他同样可运行的进程竞争\
  \ CPU 时间。可运行的进程并不一定正在使用 CPU，但当 Linux 调度器决定下一个运行哪个进程时，它会从可运行进程列表中进行选择。当这些进程处于运行状态但等待使用处理器时，它们形成了一个被称为“运行队列”（run\
  \ queue）的队列。运行队列越长，等待的进程就越多。\n\n性能工具通常会显示可运行进程的数量以及等待 I/O 的阻塞进程数量。另一个常见的系统统计数据是“平均负载”（load\
  \ average）。系统的负载是正在运行和可运行的进程数量总和。例如，如果有两个进程正在运行，有三个进程可以运行，那么系统的负载就是五。平均负载是给定时间内的负载量。通常，平均负载是按\
  \ 1 分钟、5 分钟和 15 分钟计算的。这让你能够看到负载随时间变化的情况。\n\n## 2.1.2 上下文切换（Context Switches）\n\n\
  大多数处理器一次只能运行一个进程或线程。虽然某些处理器（如超线程处理器）实际上可以同时运行多个进程，但 Linux 将它们视为多个单线程处理器。为了营造出某个单处理器同时运行多个任务的幻象，Linux\
  \ 内核不断在不同进程之间进行切换。不同进程之间的切换被称为“上下文切换”，因为当切换发生时，CPU 会保存旧进程的所有上下文信息，并检索新进程的所有上下文信息。上下文包含了\
  \ Linux 为每个进程跟踪的大量信息，包括但不限于：该进程正在执行哪条指令、分配了哪些内存，以及该进程打开了哪些文件。切换这些上下文可能涉及大量信息的移动，上下文切换的开销可能相当大。如果可能，尽量减少上下文切换次数是一个好主意。\n\
  \n为了避免上下文切换，了解它们是如何发生的非常重要。首先，上下文切换可能源于内核调度。为了确保每个进程都能获得公平的 CPU 时间，内核会定期中断正在运行的进程，并且如果合适，内核调度器会决定启动另一个进程而不是让当前进程继续执行。你的系统可能会在每次发生周期性中断或定时器中断时发生上下文切换。每秒的定时器中断次数因架构和内核版本而异。检查中断触发频率的一种简单方法是使用\
  \ `/proc/interrupts` 文件来确定在已知时间内发生的中断次数。这在列表 2.1 中有所演示。\n\n#### 列表 2.1。\n\n```\n\
  root@localhost asm-i386]# cat /proc/interrupts | grep timer\n\n; sleep 10 ; cat\
  \ /proc/interrupts | grep timer\n\n  0:   24060043          XT-PIC  timer\n\n  0:\
  \   24070093          XT-PIC  timer \n```\n\n在列表 2.1 中，我们请求内核显示定时器触发了多少次，等待 10 秒，然后再次请求。这意味着在该机器上，定时器的触发速率为\
  \ `(24,070,093 – 24,060,043) 中断 / (10 秒)`，或约每秒 1,000 次中断。如果你发现上下文切换次数远多于定时器中断，那么上下文切换最可能是由\
  \ I/O 请求或其他长时间的系统调用（如 `sleep`）引起的。当应用程序请求无法立即完成的操作时，内核会启动该操作，保存请求的进程，并在有其他就绪进程时尝试切换到另一个进程。这使得处理器尽可能保持忙碌。\n\
  \n### 2.1.3 中断（Interrupts）\n\n此外，处理器会定期接收来自硬件设备的中断。这些中断通常由具有内核处理事件的设备触发。例如，如果磁盘控制器刚刚完成从驱动器检索一个数据块并准备好让内核使用，磁盘控制器可能会触发一个中断。对于内核接收到的每个中断，如果已经注册了该中断的句程序，就会运行该程序；否则，中断将被忽略。这些中断处理程序在系统中以非常高的优先级运行，通常执行非常快。有时，中断处理程序需要完成工作但不需要高优先级，因此它会启动一个“下半部”（bottom\
  \ half），也称为软中断处理程序（soft-interrupt handler）。如果中断数量很多，内核可能会花费大量时间处理这些中断。可以通过检查 `/proc/interrupts`\
  \ 文件来查看哪些 CPU 正在触发哪些中断。\n\n### 2.1.4 CPU 利用率\n\nCPU 利用率是一个直观的概念。在任何给定时刻，CPU 都在执行以下七件事之一：第一，它可以是空闲（idle），这意味着处理器实际上没有在做任何工作，正在等待要做的事。其次，CPU\
  \ 可以正在运行用户代码，这被指定为“用户”（user）时间。第三，CPU 可以代表应用程序代码执行 Linux 内核中的代码。这是“系统”（system）时间。第四，CPU\
  \ 可以执行经过 `nice` 处理或设置为以低于正常进程优先级运行的用户代码。第五，CPU 可以处于 `iowait` 状态，这意味着系统正在等待 I/O。第六，CPU\
  \ 可以处于 `irq` 状态，意味着它正处于高优先级内核代码中处理中断。最后，CPU 可以处于 `softirq` 模式，意味着它正在执行同样由中断触发的内核代码，但其运行优先级较低（下半部）。\n\
  \n大多数性能工具将这些值指定为总 CPU 时间的百分比。这些时间范围从 0% 到 100% 不等，但所有三项总和为 100%。“系统”百分比高的系统将其大部分时间花在了内核中。如\
  \ `oprofile` 等工具可以帮助确定这些时间花在了哪里。“用户”时间高的系统将其大部分时间花在了运行应用程序上。下一章将展示如何使用性能工具追踪这些情况下的问题。如果系统在应该工作时大部分时间都处于\
  \ `iowait` 状态，它很可能在等待来自某个设备的 I/O。可能是磁盘、网卡或其他设备导致了变慢。\n\n## 2.2 Linux 性能工具：CPU\n\n\
  从这里开始，我们将讨论使你能够提取前述描述的信息的性能工具。\n\n### 2.2.1 vmstat（虚拟内存统计）\n\n`vmstat` 是 virtual\
  \ memory statistics（虚拟内存统计）的缩写，这意味着它将为你提供有关系统虚拟内存性能的信息。幸运的是，它的功能远于此。`vmstat` 是一个获取系统整体性能概况的极命令。它可以告诉你：\n\
  \n*   有多少进程正在运行\n*   CPU 如何使用\n*   CPU 接收到多少中断\n*   调度器执行了多少上下文切换\n\n\n\n\n`vmstat`\
  \ 可以以两种模式运行：采样模式和平均模式。如果没有指定参数，`vmstat` 将以平均模式运行，此时显示自系统启动以来所有统计数据的平均值。然而，如果指定了延迟，第一个样本将是自系统启动以来的平均值，之后\
  \ `vmstat` 将每隔指定的延迟秒对系统进行采样并打印统计信息。表 2-1 所示，如果运行 `vmstat` 时没有任何参数，它将显示自系统启动以来记录的统计数据的平均值。此示例显示系统自启动以来几乎处于空闲状态，如\
  \ `us`、`sys`、`wa` 和 `id` CPU 使用列所示。CPU 自启动以来有 5% 的时间用于用户应用代码，1% 用于系统代码，其余 94% 为空闲。\n\
  \n##### 列表 2.2.\n\n```\n [ezolt@scrffy tmp]$ vmstat\n\nprocs -----------memory----------\
  \ ---swap-- -----io---- --system--\n\n----cpu----\n\nr  b   swpd   free   buff \
  \ cache   si   so    bi    bo   in    cs us sy id\n\nwa\n1  0 181024  26284  35292\
  \ 503048    0    0     3     2    6      1  5  1 94  0 \n```\n\n虽然 `vmstat` 自系统启动以来的统计数据对于确定机器负载程度很有用，但\
  \ `vmstat` 在采样模式下运行最有用，如列表 2.3 所示。在采样模式下，`vmstat` 在经过了 `delay` 参数指定的秒数后打印系统统计数据。它会进行多次此类采样计数。列表\
  \ 2.3 中的第一行统计数据包含自启动以来的系统平均值（如之前所示），但之后继续周期性采样。此示例显示系统上活动非常少。我们可以通过查看 `b` 列中的 0\
  \ 看到运行期间没有进程被阻塞。我们还可以通过查看 `r` 列发现，当 `vmstat` 采样数据时运行的进程少于 1 个。\n\n##### 列表 2.3.\n\
  \n```\n [ezolt@scrffy tmp]$ vmstat 2 5\n\nprocs  -----------memory---------- ---swap--\
  \ -----io---- --system-- ----cpu----\n\nr  b    swpd   free   buff  cache   si \
  \  so    bi    bo   in    cs us sy id wa\n\n1  0  181024  26276  35316 502960  \
  \  0    0     3     2    6     1  1  1 94  0\n1\n```\n\n\n\n下一章将讨论内存统计，但我们现在来看 CPU\
  \ 统计。第一组统计数据，或称为“CPU 节拍”（CPU ticks），显示了 CPU 自系统启动以来消耗的时间，其中一个“节”是一个时间单位。尽管精简的 `vmstat`\
  \ 输出只显示了四种 CPU 状态——`us`、`sy`、`id` 和 `wa`——但这显示了所有 CPU 节拍的分布情况。此外，我们还可以看到中断和上下文切换的总数。一个新增的是\
  \ `forks`，它基本上是自系统启动以来创建的新进程数量。\n\n##### Listing 2.5.\n\n```\n [ezolt@scrffy ~/edid]$\
  \ vmstat -s\n\n      1034320  total memory\n\n       998712  used memory\n     \
  \  698076  active memory\n       176260  inactive memory\n        35608  free memory\n\
  \        26592  buffer memory\n\n       324312  swap cache\n      2040244  total\
  \ swap\n\n       201060  used swap\n      1839184  free swap\n\n      5279633 non-nice\
  \ user cpu ticks\n     28207739 nice user cpu ticks\n      2355391 system cpu ticks\n\
  \    628297350 idle cpu ticks\n       862755 IO-wait cpu ticks\n           34 IRQ\
  \ cpu ticks\n      1707439 softirq cpu ticks\n     21194571 pages paged in\n   \
  \  12677400 pages paged out\n        93406 pages swapped in\n       181587 pages\
  \ swapped out\n 1931462143 interrupts\n    785963213 CPU context switches\n   1096643656\
  \ boot time\n       578451 forks \n```\n\n`vmstat` 提供了关于 Linux 系统性能的广泛信息。它是调查和排查系统问题时使用的核心工具之一。\n\
  \n### 2.2.2. top (v. 2.0.x)\n\n`top` 是 Linux 系统监控工具中的“瑞士军刀”。它很好地在一个屏幕上显示了大量的系统级性能信息。你显示的内容也可以通过交互进行更改；因此，如果系统在运行时出现某个特定问题，你可以修改\
  \ `top` 向你显示的内容。\n\n默认情况下，`top` 会按从高到低的顺序列出 CPU 消耗率最高的进程列表。这让你能够快速定位是哪个程序在占用 CPU。`top`\
  \ 会根据你指定的延迟定期更新列表。（初始时间为 3 秒。）\n\n\n\n### 2.2.2.1 与 CPU 性能相关的选项\n\n`top` 通过以下命令行调用：\n\
  \n```\n top [d delay] [C] [H] [i] [n iter] [b] \n```\n\n`top` 实际上在两种模式下接受选项：命令行选项和运行时选项。命令行选项决定了\
  \ `top` 如何显示其信息。表 2-3 显示了影响 `top` 显示的性能统计类型和频率的命令行选项。\n\n##### 表 2-3. `top` 命令行选项\n\
  \n| 选项 | 解释 |\n| :--- | :--- |\n| `d delay` | 统计更新之间的延迟。 |\n| `n iterations` | 退出前的迭代次数。`top`\
  \ 会更新 `iterations` 次统计数据。 |\n| `i` | 不显示未使用任何 CPU 的进程。 |\n| `H` | 显示应用程序的所有单个线程，而不是仅显示每个应用程序的总计。\
  \ |\n| `C` | 在超线程或 SMP 系统中，显示累加的 CPU 统计数据，而不是每个 CPU 的统计数据。 |\n\n当你运行 `top` 时，你可能想要微调正在观察的内容以调查特定问题。`top`\
  \ 的输出是高度可自定义。表 2-4 描述了在 `top` 运行期间更改显示统计数据的选项。\n\n##### 表 2-4.\n\n| 选项 | 解释 |\n\
  | :--- | :--- |\n| `f` 或 `F` | 显示一个配置屏幕，允许你选择哪些进程统计显示在屏幕上。 |\n| `o` 或 `O` | 显示一个配置屏幕，允许你更改显示统计数据的顺序。\
  \ |\n\n表 2-5 中描述的选项开启或关闭各种系统级信息的显示。关闭不需要的统计数据对于在屏幕上容纳更多进程是有帮助的。\n\n##### 表 2-5.\
  \ `top` 运行时输出切换\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `l` | 切换负载平均和运行时间信息是否会更新并显示。\
  \ |\n| `t` | 切换显示每个 CPU 如何分配时间。它还会切换有关当前正在运行多少个进程的信息。显示应用程序的所有单个线程，而不是仅显示每个应用程序的总计。\
  \ |\n| `m` | 切换屏幕上是否显示有关系统内存使用的信息。默认情况下显示。 |\n\n表 2-6 描述了 `top` 支持的不同模式。\n\n#####\
  \ 表 2-6. `top` 输出排序\n\n| 选项 | 解释 |\n| :--- | :--- |\n| `P` | 按 CPU 使用率排序任务。最高的在前。\
  \ |\n| `T` | 按年龄排序任务。最新的在前。 |\n| `N` | 按使用率排序任务。最高的在前。 |\n| `A` | 按年龄排序任务。最新的在前。\
  \ |\n\n表 2-7 涵盖了这些统计数据。\n\n##### 表 2-7. `top` 统计数据\n\n| 选项 | 解释 |\n| :--- | :---\
  \ |\n| `us` | 在用户花费的时间。 |\n| `sy` | 在内核花费的时间。 |\n| `ni` | 在 \"nice\" 进程花费的时间。 |\n\
  | `id` | 空闲时间。 |\n| `wa` | 等待 I/O 时间。 |\n| `hi` | 在 `irq` 中花费的时间。 |\n| `si` | 在\
  \ `softirq` 中花费的时间。 |\n| `load average` | 过去 1、5、15 分钟的负载平均值。 |\n| `%CPU` | 特定进程消耗的\
  \ CPU 百比。 |\n| `PRI` | 进程的优先级值，值越高优先级越高。 |\n| `RT` | 表示任务具有实时优先级，优先级高于标准。 |\n| `NI`\
  \ | 进程的 nice 值。nice 值越高，系统执行进程的时间越少。 |\n| `WCHAN` | 如果进程正在等待 I/O，此处显示它正在等待哪个函数。\
  \ |\n| `STAT` | 进程的当前状态，其中进程处于睡眠（S）、运行（R）、僵尸状态（已杀死但未死亡，即 Z）、不可中断睡眠（D）或正在被跟踪（T）。\
  \ |\n| `TIME` | 自启动以来该进程已使用的总 CPU 时间（用户和系统）。 |\n| `COMMAND` | 该进程正在执行的命令。 |\n| `LC`\
  \ | 该进程上次执行的 CPU 编号。 |\n| `FLAGS` | 切换负载平均和运行时间信息是否会更新并显示。 |\n\n`top` 提供了关于不同运行进程的大量信息，是找出哪个程序是资源大者的极方法。\n\
  \n### 2.2.2.2 使用示例\n\n列表 2.6 是 `top` 的运行示例。一旦它启动，它就会定期更新屏幕直到你退出。这演示了 `top` 可以生成的一些系统级统计数据。首先，我们看到过去\
