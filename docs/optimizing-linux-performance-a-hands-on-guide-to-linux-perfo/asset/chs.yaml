  \ 是一个强大的工具，但其安装和使用可能会复杂。本附录描述了在 Fedora Core 2 (FC2)、Red Hat Enterprise Linux (EL3)\
  \ 和 SUSE 9.1 (S9.1) 上安装 `oprofile` 的一些问题。\n\n### B.1 Fedora Core 2 (FC2)\n\n对于 FC2，Red\
  \ Hat 提供的 `oprofile` 软件包应该从 `oprofile` 网站下载。单处理器内核不提供必要的 `oprofile` 驱动程序。Red Hat\
  \ 将必要的 `oprofile` 内核模块包含在 `smp` 版本中。如果你想运行 `oprofile`，即使是在单处理器机器上，也必须使用 `smp` 内核。\n\
  \n### B.2 Enterprise Linux 3 (EL3)\n\n对于 EL3，同样，Red Hat 提供的 `oprofile` 软件包应该从 `oprofile`\
  \ 网站下载。单处理器内核不提供必要的 `oprofile` 驱动程序。Red Hat 将必要的 `oprofile` 内核模块包含在 `smp` 或 `hugemem`\
  \ 版本中。如果你想运行 `oprofile`，即使是在单处理器机器上，也必须使用 `smp` 或 `hugemem` 内核。\n\n关于在 EL3 中使用 `oprofile`\
  \ 的更多细节请参阅 [`www.redhat.com/docs/manuals/enterprise/RHEL-3-Manual/sysadmin-guide/ch-oprofile.html`](http://www.redhat.com/docs/manuals/enterprise/RHEL-3-Manual/sysadmin-guide/ch-oprofile.html)。\n\
  \n### B.3 SUSE 9.1\n\n对于 SUSE 9.1，SUSE 提供的 `oprofile` 软件包应该从 `oprofile` 网站下载。所有版本的\
  \ SUSE 内核（`default`、`smp` 和 `bigsmp`）都支持 `oprofile`，因此任何提供的内核都可以工作。\n\n\n\n\n\n\
