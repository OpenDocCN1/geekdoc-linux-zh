  虽然目前还不完全清楚过滤器在具体做什么，或者这些库调用是用于什么，但仍有几个好奇的点。首先，`peek` 听起来像是一个从图像中检索像素的函数，以便过滤器进行处理。我们很快就可以验证这个直觉。其次，过滤器花费的大部分时间似乎并没有花在对图像数据运行数学算法上。该过滤器并没有花费所有的\
  \ CPU 时间来根据像素值运行计算，而是将大部分时间花在检索待处理的像素上。如果真的是如此，也许可以修复。\n\n### 10.8. 跳转到 Web\n\n\
  现在我们已经发现了哪些 GIMP 函数耗用了大部分时间，我们必须准确弄清楚这些函数到底是什么，并可能优化它们的使用。\n\n首先，我们在 Web 上搜索 `pixel_rgn_get_pixel`\
  \ 并尝试确定它的作用。在几次尝试失败后，列表 10.11 中揭示的链接和信息证实了我们对 `pixel_rgn_get_pixel` 作用的怀疑。\n\n#####\
  \ 列表 10.11。\n\n```\n \"存在对 pixel_rgn_get_ pixel, row, col, and rect 的调用，它们从图像中获取数据并将其存入你预先分配的缓冲区中。\n\
  \n并且有相应的 set 调用。在 gimp.h 中查找 \"Pixel Regions\"（像素区域）。\"\n\n(来自 http://gimp-plug-ins.sourceforge.net/doc/Writing/html/sect-\n\
  \nimage.html ) \n```\n\n此外，列表 10.12 中的信息表明，避免使用 `pixel_rgn_get_` 调用是一个好主意。\n\n#####\
  \ 列表 10.12。\n\n```\n \"注意这些调用相对较慢，它们很容易成为你插件中最慢的部分。如果有任何其他方法，请不要使用 pixel_rgn_[get|set]_pixel\
  \ 逐个获取（或设置）像素。\" (来自\n\nhttp://www.home.unix-ag.org/simon/gimp/guadec2002/gimp-\n\
  \nplugin/html/imagedata.html) \n```\n\n\n\n\nGIMP 可以为滤镜程序提供一种直接访问图像瓦块（tiles）的方法。滤镜可以像访问数据数组一样访问图像数据，而无需调用\
  \ GIMP 库。然而，这里有一个陷阱。当你直接访问像素数据时，它仅适用于当前瓦块。GIMP 随后会遍历图像中的所有瓦块，允许你最终访问图像中的所有像素，但你无法同时访问所有像素。你只能查看单个瓦块的像素，这与\
  \ `lic` 访问数据的方式是不兼容的。当 `lic` 滤镜在特定位置生成新像素时，它根据其周围像素的值来计算新值。因此，当在瓦块边缘生成新像素时，`lic`\
  \ 滤镜需要周围所有像素的像素数据。遗憾的是，这些像素可能位于图像中的上一个瓦块或下一个瓦块。由于这些像素信息不可，图像滤镜无法使用这种优化的访问方法。\n\n\
  ### 10.11. 解决问题\n\n由于我们已经确定读取像素值花费了大量时间，因此还有另一种可能解决问题的方案。我们必须开始观察滤镜是如何运行的。它在生成新图像时，会反复请求同一个像素。因为新像素值基于其周围的像素，在图像上运行滤镜的过程中，每个像素都可以被它的九个邻居中的访问。这意味着图像中的每个像素都会被它的每个邻居读取，结果是它至少被读取了九次。\n\
  \n由于调用 GIMP 库的开销很大，我们只希望对每个像素执行一次，而不是九次。可以通过在滤镜启动时将整个图像读取到本地数组中，然后在滤镜运行期间访问该本地数组来优化对图像的访问，而不是每次访问数据时都调用\
  \ GIMP 库例程。这种方法应该显著减少查找像素数据的开销。每次数据访问不再需要几次函数调用，我们只需要访问本地数组即可。在滤镜初始化时，使用 `malloc`\
  \ 分配数组并填充像素数据。这在列表 10.14 中所示。\n\n#### 列表 10.14.\n\n```\n int g_image_width, g_image_height;\n\
  \nGimpRGB *g_cached_image;\n\nvoid cache_image(GimpPixelRgn *src_rgn,int width,int\
  \ height)\n\n{\n\n  static guchar data[4];\n\n  int x,y;\n\n  GimpRGB *current_pixel;\n\
  \n  g_image_width = width;\n\n  g_image_height = height;\n\n  g_cached_image = malloc(sizeof(GimpRGB)*width*height);\n\
  \n  current_pixel = g_cached_image;\n\n  /* Malloc */\n\n  for (y = 0; y < height;\
  \ y++)\n\n    {\n      for (x = 0; x < width; x++)\n        {\n\n          gimp_pixel_rgn_get_pixel\
  \ (src_rgn, data, x, y);\n\n          gimp_rgba_set_uchar (current_pixel, data[0],\
  \ data[1], data[2],\n\ndata[3]);\n\n          current_pixel++;\n\n        }\n\n\
  \    } \n```\n\n此外，`peek` 例程被重写，仅用于访问此本地数组而不是调用 GIMP 库函数。这在列表 10.15 中所示。\n\n####\
  \ 列表 10.15.\n\n```\n static void peek (GimpPixelRgn *src_rgn,\n\n      gint    \
  \      x,\n\n      gint          y,\n\n      GimpRGB      *color)\n\n{\n\n  *color\
  \ = g_cached_image[y*g_image_width + x];\n\n} \n```\n\n那么，它有效吗？当我们使用新方法运行滤镜时，运行时缩短到了\
  \ 56 秒！这完全符合我们 2 分钟 30 秒的目标，性能有了显著提升。\n\n尽管性能提升令人印象深刻，但它并非免费的。我们在性能上做出了了一个经典的权衡。可以通过在滤镜启动时将整个图像读取到本地数组中，然后在滤镜运行期间访问该本地数组来优化对图像的访问，而不是每次访问数据时都调用\
  \ GIMP 库例程。这种方法应该显著减少查找像素数据的开销。每次数据访问不再需要几次函数调用，我们只需要访问本地数组即可。在滤镜初始化时，使用 `malloc`\
  \ 分配数组并填充像素数据。\n\n### 10.12. 正确性？\n\n当我们使用新方法运行滤镜时，运行时缩短到了 56 秒！这完全符合我们 2 分钟 30\
  \ 秒的目标，性能有了显著提升。\n\n尽管性能提升令人印象深刻，但它并非免费的。我们在性能上做出了了一个经典的权衡。（注：为了简洁已删除冗余内容）。可以通过在滤镜启动时将整个图像读取到本地数组中，然后在滤镜运行期间访问该本地数组来优化对图像的访问，而不是每次访问数据时都调用\
  \ GIMP 库例程。这种方法应该显著减少查找像素数据的开销。我们只需要访问本地数组即可。在滤镜初始化时，使用 `malloc` 分配数组并填充像素数据。这在列表\
  \ 10.14 中所示。\n\n### 10.13. 下一步\n\n由于我们已经确定读取像素值花费了大量时间，因此还有另一种可能解决问题的方案。我们必须开始观察滤镜是如何运行的。它在生成新图像时，会反复请求同一个像素。因为新像素值基于其周围的像素，在图像上运行滤镜的过程中，每个像素都可以被它的九个邻居中的访问。这意味着图像中的每个像素都会被它的每个邻居读取，结果是它至少被读取了九次。\n\
  \n由于调用 GIMP 库的开销很大，我们只希望对每个像素执行一次，而不是九次。可以通过在滤镜启动时将整个图像读取到本地数组中来优化对图像的访问。\n\n###\
  \ 10.14. 章总结\n\n由于我们已经确定读取像素值花费了大量时间，因此还有另一种可能解决问题的方案。我们必须开始观察滤镜是如何运行的。它在生成新图像时，会反复请求同一个像素。因为新像素值基于其周围的像素，在图像上运行滤镜的过程中，每个像素都可以被它的九个邻居中的访问。这意味着图像中的每个像素都会被它的每个邻居读取，结果是它至少被读取了九次。\n\
  \n## 第 11 章 性能猎寻 2：一个延迟敏感的应用 (nautilus)\n\n本章包含一个如何使用 Linux 性能工具查找并修复延迟敏感应用程序中性能问题的示例。\n\
  \n\n\n\n\n* 使用本章作为一个模板，来寻找延迟敏感型应用程序中高延迟的原因。\n\n## 11.1 延迟敏感型应用程序\n\n在本章中，我们将研究一个对延迟敏感的应用程序。延迟可以被认为应用程序响应不同的外部或内部事件所需的时间。具有延迟性能问题的应用程序通常不会长时间占用\
  \ CPU；相反，它只使用少量的 CPU 时间来响应不同的事件。然而，对特定事件的响应速度不够快。在修复延迟性能问题时，我们需要减少对各种事件响应的延迟，并弄清楚应用程序的哪些部分降低了响应速度。正如你所看到的，追踪延迟问题的策略与追踪\
  \ CPU 密集型问题的策略略有不同。\n\n### 11.2 识别问题\n\n与前一章节中的性能问题一样，我们必须定义要研究的内容并尝试克服它。在这种情况下，我们将优化在\
  \ GNOME 桌面上使用 `nautilus` 文件管理器时打开弹出菜单的时间。在 `nautilus` 中，通过在 `nautilus` 文件管理窗口的任何位置点击鼠标右键可以打开弹出菜单。在这种特定情况下，我们将调查在右键点击已打开窗口**背景**时出现的弹出菜单的性能，而不是右键点击特定文件或文件夹时出现的菜单。\n\
  \n我们为什么要优化这个？虽然打开弹出菜单的时间可能不到一秒，但它仍然足够慢，以至于用户可以感知到点击右键到菜单显示之间的延迟。这种迟缓的弹出窗口会给 GNOME\
  \ 用户一种计算机运行缓慢的印象。人们会注意到这种细微的延迟，这可能会让与 `nautilus` 的交互变得恼人，或者给人一种桌面缓慢的印象。\n\n这个特定的性能问题与前一章节中的\
  \ GIMP 问题不同。首先，桌面的核心组件（在本例中为 GNOME）通常比典型的桌面应用程序更复杂且相互耦合。这些组件通常依赖于各种子系统和共享库来完成工作。而\
  \ GIMP 是一个相对自包含的应用程序，使其在需要时更容易进行性能分析和重新编译，但 GNOME 桌面是由许多不同的相互关联的组件组成的。这些组件可能需要多个进程和共享库，每个进程都代表桌面执行不同的任务。`nautilus`\
  \ 特别链接到 72 个不同的共享库。要准确追踪是哪部分代码在消耗时间、消耗了多少时间以及为什么要消耗时间，是一项艰巨的任务。\n\n这种性能调查与 GIMP\
  \ 调查的另一个显著区别是，我们试图减少的时间是毫秒级的，而不是秒或分钟。当时间如此短时，很难确保你捕获的性能分析数据实际上是你尝试测量的事件的结果，而不是仅仅是启动和停止性能分析工具时产生的噪声。然而，这段短时间范围也使得追踪应用程序在这一有趣时间段内执行的所有操作变得切实可行。\n\
  \n## 11.3 寻找基准/设定目标\n\n与之前的寻找一样，第一步是确定问题的当前状态。为了让我们的工作更轻松一些，并避免上一节中提到的某些性能分析问题，我们将稍微“作弊”一下，让弹出菜单问题看起来更像我们之前测量的长时间运行的\
  \ CPU 密集型任务。单个弹出菜单出现的时间在毫秒范围内，这使得我们很难用我们的性能分析工具对其进行准确测量。如之前所述，很难在合适的时间启动和停止这些工具，并保证我们只测量我们感兴趣的内容（即打开实际菜单所花费的\
  \ CPU 时间）。这就是我们“作弊”的地方。我们不是只打开一次菜单，而是连续快速打开 100 次菜单。这样，打开菜单所花费的总时间将增加 100 倍。这使我们能够使用性能分析工具捕捉有关菜单如何执行的信息。\n\
  \n因为点击右键 100 次会很无聊，而且人类（除非经过良好训练）无法以可靠的重复方式打开 100 次弹出菜单，我们必须将其自动化。为了可靠地打开 100 次弹出菜单，我们依赖\
  \ `xautomation` 包。`xautomation` 包可以在 `http://hoopajoo.net/projects/xautomation.html`\
  \ 获取。它可以向 X 服务器发送任意 X Window 事件，模拟用户。下载 `xautomation` tar 包、解压并编译后，我们可以使用它来自动化右键点击。\n\
  \n与 GIMP 不同，我们不能简单地测量 `nautilus` 用于评估创建 100 个弹出菜单所需的 CPU 时间。这主要是因为 `nautilus` 并没有在菜单打开之前立即启动，也没有在打开后立即结束。我们将使用挂钟时间（wall-clock\
  \ time）来查看完成此任务需要多少时间。这要求在在我们测试时系统中没有其他其他程序运行。\n\n列表 11.1 显示了 `xautomation` 命令的\
  \ shell 脚本，用于在 `nautilus` 文件浏览器中打开 100 个弹出菜单。当我们运行测试时，必须确保我们已经调整了 `nautilus` 窗口，使得任何点击实际上都不会在文件夹上打开弹出菜单，而是让所有弹出都发生在背景上。这是非常重要的，因为不同弹出菜单的代码路径可能截然不同。\n\
  \n##### 列表 11.1.\n\n```\n#!/bin/bash\n\nfor i in 'seq 1 100';\n\ndo\n      echo\
  \ $i\n      ./xte 'mousemove 100 100' 'mouseclick 3' 'mouseclick 3'\n      ./xte\
  \ 'mousemove 200 100' 'mouseclick 3' 'mouseclick 3'\ndone \n```\n\n列表 11.1 中的命令将光标移动到\
  \ X 屏幕上的 (100,100) 位置，并点击右鼠标键（33 按钮）。这会弹出一个菜单。然后它们再次点击右鼠标键，这将关闭菜单。然后它们移动到 X 位置 (100,100)，并重复该过程。\n\
  \n接下来，我们使用 `time` 来查看这 100 次迭代的脚本完成需要多久。这是我们的基准时间。当我们进行优化时，将对照这个时间进行检查，看它们是否有改进。在我笔记本上原生\
  \ Fedora 2 版本 `nautilus` 的基准时间为 26.5 秒。\n\n最后，我们必须为优化设定一个目标。实现这一点的一种简单方法是找到一个已经具有快速弹出菜单的应用程序，并查看它弹出\
  \ 100 次菜单需要多长时间。`xterm` 是一个完美的例子，它有非常敏捷的菜单。虽然这些菜单不像 `nautilus` 中的那么复杂，但它们至少应该被视为菜单速度的上限。\n\
  \n`xterm` 弹出菜单的工作方式略有不同，因此我们需要稍微修改脚本以创建 100 个弹出窗口。当 `xterm` 创建弹出窗口时，它要求按下左控制键，因此我们必须稍微修改自动化脚本。该脚本位于列表\
  \ 11.2。\n\n##### 列表 11.2.\n\n```\n#!/bin/bash\n\nfor i in 'seq 1 100';\n\ndo\n \
  \  echo $i\n  ./xte 'keydown Control_L' 'mousemove 100 100' 'mouseclick 3' 'mouseclick\
  \ 3'\n  ./xte 'keydown Control_L' 'mousemove 200 100' 'mouseclick 3' 'mouseclick\
  \ 3'\ndone \n```\n\n\n\n\n在运行 `xterm` 并对弹出菜单的创建进行计时时，`xterm` 耗约 9.2 秒完成脚本。`nautilus`\
  \ 有巨大的改进空间（接近 17 秒）。期望 `nautilus` 复杂的弹出菜单创建速度与 `xterm` 一样可能是不合理的，因此让我们采取保守态度，设定一个\
  \ 10% 的目标，即 3 秒。希望我们能够取得比这好得多的结果，或者至少找出为什么无法进一步加速。\n\n## 11.4. 为性能寻优配置应用程序\n\n调查的下一步是为性能寻优配置应用程序。在对\
  \ GIMP 进行操作时，我们是立即重新编译了应用程序，但对于 `nautilus`，我们将采取不同的方法。由于它依赖于许多不同的共享库，可能很难确定具体哪些部分需要重新编译。我们不进行重新编译，而是将下载并安装每个应用程序和库的调试信息。对于\
  \ Fedora 和 Enterprise Linux，Red Hat 提供了一组 `debuginfo rpms`，它们包含了编译器在编译应用程序时生成的符号信息和源码。每个二进制包或库都有一个对应的\
  \ `debuginfo rpm`，其中包含了调试信息。这允许 Red Hat 在分发二进制文件时不带有占用空间的调试信息。然而，它允许开发者或调查性能问题的人下载并使用相应的\
  \ `debuginfo` 包。在这种情况下，Red Hat 版本的 `oprofile` 也会识别 `debuginfo` 包，并在分析应用程序（如 `nautilus`）和库（如\
  \ `gtk`）时提取符号。在这种情况下，我们将下载 `gtk`、`nautilus`、glib 和内核的 `debuginfo`。如果 `oprofile`\
  \ 发现某个库贡献了大量的周期周期，但不允许你分析这些库（`opreport` 输出 \"no symbols\"），这表明该库没有安装调试信息。我们可以下载并安装该库相应的\
  \ `debuginfo` 包，然后 `oprofile` 就可以访问调试信息，并将并将事件映射回原始函数和源行。\n\n## 11.5. 安装并配置性能工具\n\
  \n寻优的下一步是安装调查问题所需的性能工具。正如我们在对 GIMP 进行性能寻优中所做的那样，我们将安装 `oprofile` 和 `ltrace`。在这种情况下，我们还将下载并安装\
  \ `gdb`（如果尚未安装）。`gdb` 允许我们查看运行中应用程序的一些动态方面。\n\n## 11.6. 运行应用程序和性能工具\n\n接下来，我们运行应用程序并使用性能工具进行测量。由于我们已经怀疑许多不同进程和库的复杂相互作用可能是问题的原因，我们将从\
  \ `oprofile` 开始，看看它怎么说。\n\n由于我们只希望 `oprofile` 测量我们在打开弹出菜单期间发生的事件，我们将使用列表 11.3 所示的命令行，在我们运行打开并关闭\
  \ 100 个弹出菜单的脚本（命名为 `script.sh`）之前之后立即启动和停止分析。\n\n### 列表 11.3.\n\n```\nopcontrol\
  \ -start ; ./script.sh ; opcontrol -stop \n```\n\n在收集到分析信息后运行 `opreport`，我们就能得到列表\
  \ 11.4 所示的信息。\n\n### 列表 11.4.\n\n```\nCPU: CPU with timer interrupt, speed 0 MHz\
