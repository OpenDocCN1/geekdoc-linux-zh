  \n... \n```\n\n由于输出行很长，在本书显示时对它们进行了换行处理；但在文本文件中，每个回溯轨迹都占一行。每行都以 `g_type_check_instance_is_a`\
  \ 函数结束。由于每个回溯轨迹只跨一行，我们可以使用常用的 Linux 工具（如 `wc`）来提取有关回溯的信息，我们可以使用 `wc` 来统计特定文件的行数。\n\
  \n首先，让我们看看 `g_type_check_instance_is_a` 函数被调用了多少次。这等于回溯轨迹的数量，因此也是 `backtrace.txt`\
  \ 文件中的行数。列表 11.17 显示了在我们修剪后的回溯上上调用 `wc` 命令。\n\n##### 11.17.\n\n```bash\nezolt@localhost:~$\
  \ grep g_type_check_instance_is_a backtrace.txt | wc -l\n6848\n```\n\n由于输出行很长，在本书显示时对它们进行了换行处理；但在文本文件中，每个回溯轨迹都占一行。每行都以\
  \ `g_type_check_instance_is_a` 函数结束。由于每个回溯轨迹只跨一行，我们可以使用常用的 Linux 工具（如 `wc`）来提取有关回溯的信息，我们可以使用\
  \ `wc` 来统计特定文件的行数。\n\n##### 11.18.\n\n```bash\nezolt@localhost:~$ grep fm_directory_view_pop_up_background_context_menu\
  \ backtrace.txt | wc -l\n6670\n```\n\n### 11.9. 寻找时间差异\n\n现在我们已经缩小了哪些函数工作的范围，我们想要弄清楚哪些部分消耗了所有时间，哪些部分是轻量级的。在不使用任何性能工具的情况下，做到这一点的好方法是直接禁用代码片段并观察变化。尽管这会导致\
  \ Nautilus 运行异常，但它至少能指示哪些函数消耗了时间。\n\n我们首先必须建立一个基准，因为我们测试的二进制文件使用的编译标志与 Red Hat 提供的不同。我们像以前一样对脚本进行计时。在这种情况下，在我们编译的版本上运行\
  \ 100 次迭代需要 30.5 秒。接下来，我们注释掉 `eel_pop_up_context_menu` 调用。这向我们展示 Nautilus 检测鼠标点击并决定需要创建上下文菜单花费了多少时间。即使我们完全优化掉这些函数中的所有命令，我们的运行速度也不会比这更快。在这种情况下，运行所有\
  \ 100 次迭代需要 7.6 秒。接下来，我们注释掉 `bonobo_window_add_popup`，以查看调用 `ltrace` 指出最耗时的函数实际上花费了我们多少时间。如果我们注释掉\
  \ `bonobo_window_add_popup`，100 次迭代需要 21.9 秒完成。这说明如果我们优化掉 `bonobo_window_add_popup`，总运行时间可以缩短\
  \ 8 秒，这几乎是 25% 的提升。\n\n### 11.10. 尝试可能的解决方案\n\n所以，正如我们看到的，`bonobo_window_add_popup`\
  \ 是一个昂贵的函数，每当我们想要创建弹出菜单时都调用它。如果我们反复使用相同的参数调用它，可能缓存它初始调用返回的值，并在之后每次都使用该值，而不是反复调用那个昂贵的函数。列表\
  \ 11.19 展示了一个重写此操作的函数示例。\n\n\n\n\n\n```c\n void fm_directory_view_pop_up_background_context_menu\
  \ (FMDirectoryView *view,\n                                        GdkEventButton\
  \ *event)\n{\n   /* Primitive Cache */\n   static FMDirectoryView *old_view = NULL;\n\
  \   static GtkMenu *old_menu = NULL;\n   g_assert (FM_IS_DIRECTORY_VIEW (view));\n\
  \   /* Make the context menu items not flash as they update to proper disabled,\n\
  \    * etc. states by forcing menus to update now.\n    */\n   if ((old_view !=\
  \ view)  ||  view->details->menu_states_untrustworthy)\n          {\n          \
  \    update_menus_if_pending (view);\n              old_view = view;\n         \
  \     old_menu = create_popup_menu(view, FM_DIRECTORY_VIEW_POPUP_PATH_BACKGROUND);\n\
  \          }\n  eel_pop_up_context_menu (old_menu,\n         EEL_DEFAULT_POPUP_MENU_DISPLACEMENT,\n\
  \         EEL_DEFAULT_POPUP_MENU_DISPLACEMENT,\n         event);\n} \n```\n\n在这种情况下，我们记住了上一次生成的菜单。如果我们在同一个视图中再次遇到它，并且我们认为该视图的菜单没有发生变化，我们就会直接使用上次使用的同一个菜单，而不是创建一个新的。这并不是一种复杂的技巧，如果用户没有在同一个目录中反复打开弹出菜单，这种方法就会失效。例如，如果用户在目录\
  \ 1 中打开一个弹出菜单，然后在目录 2 中打开另一个，如果用户随后又在目录 1 中打开弹出菜单，`nautilus` 仍然会新菜单。可以创建一个简单的缓存，在创建菜单时将其存储起来。当打开菜单时，首要检查是查看这些视图是否已经在缓存中有了菜单。如果有，就可以显示缓存的菜单；否则，就可以创建新的菜单。这种缓存对于某些特殊目录特别有用，例如桌面、计算机或主目录，用户在这些地方可能会多次打开弹出菜单。在应用了所提的解决方案并进行\
  \ 100 次迭代计时测试后，时间已下降到 24.0 秒。这意味着性能提升了约 20%，并接近于我们完全不创建菜单时理论上能获得的提升（21.9 秒）。在各种目录中创建弹出菜单的操作均符合预期。该补丁似乎没有破坏任何功能。\n\
  \n但需要注意的是，现在这只是一个测试解决方案。它必须提交给 `nautilus` 开发者，以确认它没有破坏任何功能并适合纳入其中。然而，在搜寻的过程中，我们确定了哪些函数是缓慢的，追踪了它们的调用位置，并创建了一个能从客观上改进性能的可能解决方案。同样重要的是，这种改进是客观的；也就是说，我们有硬数据来证明新方法更快，而不仅仅是主观的（即：仅仅说感觉上更流畅了）。大多数开发者都喜欢收到这样的性能\
  \ Bug 报告。\n\n### 11.11 章总结\n\n在本章中，我们确定了应用程序中特定组件为何会有高延迟（`nautilus` 中的弹出菜单）。我们弄清楚了如何自动化创建弹出菜单（`xautomation`），并扩展了\
  \ `nautilus` 创建弹出菜单时花费的时间（100 次迭代）。我们使用 `oprofile` 来确定 `nautilus` 将所有时间都花在了哪个函数上。然后，我们使用\
  \ `ltrace` 和 `gdb` 来确定哪些共享库调用负责了所有的调用。在确定了哪些库调用成本高昂后，我们尝试减少或限制它们被调用的次数。在这种情况下，我们在分配新菜单时存储了它的指针，并在之后使用它以避免不重新分配。我们创建了一个建议的补丁，然后针对它运行了性能测试，以查看性能是否提高。性能提升了，功能似乎不受影响。下一步是将补丁提交给\
  \ `nautilus` 开发者寻求意见。本章侧重于优化单个应用程序的延迟，而下一章将介绍一个集中于解决系统级性能问题的性能搜寻。这种类型的搜寻通常涉及调查系统的许多不同领域，包括硬件（磁盘、网络和内存）和软件（应用程序、共享库和\
  \ Linux 内核）。\n\n## 第 12 章 性能搜寻 3：全系统级变慢 (prelink)\n\n本章包含一个如何使用 Linux 性能工具发现并修复影响整个系统而非特定应用程序的性能问题的示例。\n\
  \n在阅读本章后，你应该能够：\n\n* 追踪是哪一个单独进程导致系统变慢。\n* 使用 `strace` 调查非 CPU 密集型进程的性能行为。\n* 使用\
  \ `strace` 调查应用程序如何与 Linux 内核交互。\n* 提交描述性能问题的 Bug 报告，以便作者或维护者有足够的信息来修复问题。\n\n###\
  \ 12.1 调查全系统级变慢\n\n在本章中，我们将调查一个全系统级的变慢。起，我们会注意到系统运行缓慢，并将使用 Linux 性能工具来精确定位原因。这类问题发生得很频繁。作为用户或系统管理员，你有时会注意到\
  \ Linux 机器变得迟钝，或者完成一项任务需要很长时间。弄清楚机器变慢的原因是有价值的。\n\n### 12.2 识别问题\n\n再次，我们的第一步是识别出要调查的具体问题。在这种情况下，我们将调查一种在使用\
  \ Fedora Core 2 `desktop` 时出现的周期性变慢。通常情况下，桌面性能是正常的，但偶尔磁盘会开始剧烈运转，导致菜单和应用程序需要永远才能打开。一段时间后，磁盘剧烈运转会消失，随后桌面恢复正常。在本章中，我们将弄清楚究竟是什么导致了这个问题以及为什么。\n\
  \n这类问题与前两个章节的问题不同，因为我们最初完全不知道系统的哪个部分导致了问题。当我们调查 GIMP 和 `nautilus` 的性能时，我们知道哪个应用程序负责该问题。在这种情况下，我们只是有一个运行异常的系统，性能问题理论上可能出现在系统的任何部分。这种情况很常见。面对这种情况时，重要的是使用性能工具来实际追踪问题的原因，而不是仅仅猜测原因并尝试解决方案。\n\
  \n### 12.3 寻找基准/设定目标\n\n再次，第一步是确定问题的当前状态。\n\n然而，在这种情况下，这并不容易。我们不知道问题何时开始，以及会持续多久，因此在进行更多调查之前，我们无法真正设定基准。至于目标，理想情况下我们希望问题完全消失，但问题可能是由核心操作系统功能引起的，因此完全消除它可能是可能的。\n\
  \n首先，我们需要对为什么发生这个问题进行一些额外的调查，以确定一个合理的基准。初始步骤是在变慢发生时运行 `top`。这为我们提供一个可能导致问题的进程列表，它甚至可能指向内核本身。\n\
  \n在这种情况下，如列表 12.1 所示，我们运行 `top` 并要求它只显示非空闲进程（在 `top` 运行时按下 `<I>`）。\n\n##### 列表 12.1.\n\
  \n\n\n\n\n```\n top - 12:03:40 up 12 min,  7 users,  load average: 1.35, 0.98, 0.53\n\
  \nTasks:  86 total,   2 running,  84 sleeping,   0 stopped,     0 zombie\n\nCpu(s):\
  \  2.3% us,  5.0% sy,  1.7% ni,  0.0% id, 91.0% wa,  0.0% hi,  0.0% si\n\nMem: \
  \   320468k total,   317024k used,     3444k free,    24640k buffers\n\nSwap:  \
  \ 655192k total,        0k used,   655192k free,   183620k cached\n\n  PID USER\
  \      PR  NI  VIRT  RES  SHR S %CPU %MEM    TIME+  COMMAND\n\n 5458 root      34\
  \  19  4920 1944 2828 R  1.7  0.6   0:01.13 prelink\n\n 5389 ezolt     17   0  3088\
  \  904 1620 R  0.7  0.3   0:00.70 top \n```\n\n列表 12.1 中的 `top` 输出有几个值得关注的属性。首先，我们注意到没有哪个进程在霸占\
  \ CPU；两个非空闲任务使用总 CPU 时间的比例都不到 2%。其次，系统有 91% 的时间在等待 I/O 发生。第三，系统没有使用任何交换分区空间（swap\
  \ space），因此磁盘的剧烈运转并不是由交换分区引起的。最后，当问题发生时，一个名为 `prelink` 的未知进程正在运行。目前还不清楚这个 `prelink`\
  \ 命令是什么，所以我们会记住这个应用程序名称并在稍后对其进行调查。\n\n我们的下一步是运行 `vmstat` 来查看系统正在做什么。列表 12.2 显示了\
  \ `vmstat` 的结果，并证实了我们在 `top` 中看到的现象。也就是说，系统有约 90% 的时间在等待 I/O。它还告诉我们磁盘子系统每秒读取大约 1,000\
  \ 块数据。这是一个巨大的磁盘 I/O 负载。\n\n### 列表 12.2.\n\n```\n [ezolt@localhost ezolt]$ vmstat\
