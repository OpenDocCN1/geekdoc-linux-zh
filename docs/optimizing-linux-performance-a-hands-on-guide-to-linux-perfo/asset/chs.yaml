  \n| 选项 | 解释 |\n| :--- | :--- |\n| `1 (数字 1)` | 切换 CPU 使用率是细分到单个进程的使用率还是显示为总量。 |\n\
  | `l` | 切换负载平均值（load average）和运行时间（uptime）信息是否更新并显示。 |\n\n`top v3.x` 除了类似于 `top\
  \ v2.x` 的特定进程信息外，提供了系统级信息。这些统计数据在表 2-11 中。\n\n### 表 2-11. `top` 性能统计数据\n\n| 选项 |\
  \ 解释 |\n| :--- | :--- |\n| `us` | 在用户应用程序中花费的 CPU 时间。 |\n| `sy` | 在内核中花费的 CPU 时间。\
  \ |\n| `ni` | 在“nice” 值的进程中花费的 CPU 时间。 |\n| `id` | 空闲时花费的 CPU 时间。 |\n| `wa` | 等待\
  \ I/O 时花费的 CPU 时间。 |\n| `hi` | 在 `irq` 处理程序中花费的 CPU 时间。 |\n| `si` | 在 `softirq`\
  \ 处理程序中花费的 CPU 时间。 |\n| `load average` | 1 分钟、5 分钟和 15 分钟的负载平均值。 |\n| `%CPU` | 特定进程消耗的\
  \ CPU 百比。 |\n| `PRI` | 进程的优先级值，值越高表示优先级越高。`RT` 表示任务具有实时优先级，该优先级高于标准范围。 |\n| `NI`\
  \ | 进程的 nice 值。nice 值越高，系统执行该进程的就越少。高 nice 值进程倾向于有非常低的优先级。 |\n| `WCHAN` | 如果进程正在等待\
  \ I/O，此处显示它正在哪个内核函数中等待。 |\n| `TIME` | 该进程自开始执行以来使用的总 CPU 时间（用户和系统时间）。 |\n| `COMMAND`\
  \ | 该进程正在执行的命令。 |\n| `S` | 进程的当前状态，进程处于睡眠（`S`）、运行（`R`）、僵尸状态（已杀死但尚未死亡）（`Z`）、不可中断睡眠（`D`）或正在被追踪（`T`）。\
  \ |\n\n`top` 提供了大量关于不同运行进程的信息，是确定哪个进程是资源消耗大户的极佳方法。v.3 版本的 `top` 简化了 `top` 并添加了一些类似数据的备选视图。\n\
