  \                  9973        11 total \n```\n\n如从 Listing 12.20 跟踪系统添加一个 bug 报告。（大多数其他发行版也有类似的错误跟踪系统）。我们的\
  \ bug 报告描述了我们遇到的问题以及发现的可能解决方案。\n\n进入 bugzilla 后，我们首先搜索 `prelink` 的 bug 报告，看看是否有人也报告过这个问题。在这种情况下，没有人报告过，因此我们在\
  \ Listing 12.22 中输入 bug 报告，并等待作者或维护者的响应并可能修复该 bug。\n\n\n\n\n\n```\n 来自 Bugzilla\
