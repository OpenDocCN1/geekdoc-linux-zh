  \ wr)\n\n==12242== D1  miss rate:        14.3% (     24.9%   +       12.4% )\n\n\
  ==12242== L2d miss rate:        14.3% (     24.9%   +       12.4% )\n\n==12242==\n\
  \n==12242== L2 refs:         4,225,540  (1,100,506 rd +  3,125,034 wr)\n\n==12242==\
  \ L2 misses:       4,225,539  (1,100,505 rd +  3,125,034 wr)\n\n==12242== L2 miss\
