  \ 月\n\n## 献辞\n\n本书献给我的妻子 Sarah（世界上最好的），她为了让这本书的诞生放弃了如此多的周末。感谢！感谢！感谢！\n\n## 前言\n\n\
  - 为什么性能很重要？\n- Linux：优势与劣势\n- 本书如何帮助你？\n- 为什么要学习如何使用性能工具？\n- 我可以针对性能进行调优吗\n- 谁应该读这本书？\n\
  - 本书是如何组织的？\n\n### 为什么性能很重要？\n\n如果你曾经坐着等电脑完成某事（一边敲桌子，一边咒骂，一边想着：“为什么花这么长时间？”），你就知道拥有一个快速且调优良好的计算机系统有多重要。尽管并不是所有的性能问题都能轻松解决，但理解为什么运行缓慢可能意味着可以在软件中修复问题、升级缓慢的硬件，或者干脆把整台电脑扔出窗外。幸运的是，大多数操作系统（特别是\
  \ Linux）都提供了查明机器运行缓慢原因的工具。通过使用几个基本工具，你可以确定系统在何处变慢并修复运行效率低的部分。\n\n虽然系统缓慢对终端用户来说特别烦恼，但应用程序开发者有更重要的理由对应用程序进行性能调优：高效的应用程序运行在更多的系统上。如果你编写了需要快速电脑运行的缓慢应用程序，你就排除了那些拥有较慢电脑的客户。毕竟，并不是每个人都有最新的硬件。调优良好的应用程序可以被更多客户使用，从而产生更大的潜在用户群。此外，如果潜在客户必须在两个功能类似的不同应用程序之间做出选择，他们通常会选择运行更快或更高效的那一个。最后，一个生命周期长的应用程序可能会经过几轮优化以应对不同的客户需求，因此知道如何追踪性能问题至关重要。\n\
  \n如果你是系统管理员，你对系统用户有责任，要确保其运行在适当的性能水平。如果系统运行缓慢，用户就会抱怨。如果你能快速确定问题并修复它，他们就会停止抱怨。作为额外，如果你能通过调优应用程序或操作系统来解决他们的问题（从而使他们无需购买新硬件），你就让公司的财务人员感到高兴。知道如何有效地使用性能工具可能意味着在解决性能问题上花费几天时间还是几小时的区别。\n\
  \n### Linux：优势与劣势\n\n如果你使用 Linux、维护 Linux 并在其上开发，你就处于一种奇特但良好的境地。你拥有以前所未有的权限访问源代码、开发者和邮件列表，这些列表通常在决策做出多年后仍记录设计决策。Linux\
  \ 是发现和修复性能问题的极佳环境。这与专有环境形成了对比，在专有环境中，很难直接接触软件开发人员，可能很难找到关于大多数设计决策的书面讨论，而且几乎无法访问源代码。除了这个高效的环境外，Linux\
  \ 还拥有强大的性能工具，让你能够发现并修复性能问题。这些工具可以与相应的专有工具相媲。\n\n尽管有这些印象深刻的优点，Linux 生态系统仍然面临需要克服的挑战。Linux\
  \ 性能工具散布各地。具有不同目标的群体开发这些工具，结果是工具并不一定位于集中位置。有些工具包含标准的 Linux 发行版（如 Red Hat、SUSE 和\
  \ Debian）中，而另一些散落在整个网上。如果你试图解决性能问题，首先需要知道需要的工具，然后确定在哪里找到它们。由于没有单一性能工具可以解决所有类型的性能问题，你还必须学会如何联合使用。这可能像是一门艺术，但随着经验的积累会变得容易。虽然大多数通用策略都有记录，但\
  \ Linux 并没有任何指南告诉你如何汇总性能工具来实际解决问题。\n\n### 本书如何帮助你？\n\n你将从书中学到很多，包括以下内容：\n\n- 各种性能工具测量什么\n\
  - 如何使用每个工具\n- 如何结合工具解决性能问题\n- 如何从性能低下的系统开始并定位问题\n- 这些方法如何解决现实世界的问题（案例研究）\n\n通过书中的方法，你可以编写一份组织良好且诊断清晰的问题描述，并将其交给原始开发者。如果你足够幸运，他们会为你解决问题。\n\
  \n### 为什么要学习如何使用性能工具？\n\n为什么应该花精力去调优系统或应用程序？\n\n- 调优良好的系统可以用更少的资源完成更多工作。\n- 调优良好的应用程序可以在旧硬件上运行。\n\
  - 调优良好的桌面系统可以为用户节省时间。\n- 调优良好的服务器可以为更多用户提供更高质量的服务。\n\n\n\n\n\n如果你知道如何有效地诊断性能问题，就可以采取针对性的方法来解决问题，而不是仅仅盲目摸索并寄希望于运气。如果你是一名应用程序开发者，这意味着你可以快速确定是哪部分代码导致了问题。如果你是一名系统管理员，这意味着你可以确定系统的哪个部分需要调优或升级，而不会在徒目尝试不同解决方案上浪费时间。如果你是一个终端用户，你可以找出哪些应用程序运行缓慢，并向开发者报告该问题（或在必要时更新你的硬件）。\n\
  \nLinux 已经到了一个十字路口。一个高效生产系统的大部分功能已经完成。下一个进化步骤是让 Linux 及其应用程序进行调优，以竞争并超越其他操作系统的性能。其中一些性能优化已经开始。例如，`SAMBA`、`Apache`\
  \ 和 `TUX` Web 服务器项目通过大量的时间投入，对系统和代码进行了调优和优化。其他的性能优化——例如极大提高了线程性能的 `Native POSIX\
  \ Thread Library`（`NPTL`）以及提高应用程序启动时间的对象预链接（object prelinking），才开始集成到 Linux 中。Linux\
  \ 亟需改进。\n\n## 我可以进行性能调优吗？\n\n性能优化的最棒之处在于，你不需要了解整个应用程序或系统的细节就能有效地修复性能问题。性能优化需要一套与典型应用程序开发者互补的技能。\n\
  \n你需要保持敏锐和坚持。寻找并消除性能问题需要的是侦探的特质而非程序员的特质。发现并修复这些问题是令人兴奋的。当你开始时，性能可能非常糟糕。然而，一旦你追踪到原因并将其从根源上拔除，如果你运气好，系统运行速度就会快一倍。大搞定！（Voilà!）\n\
  \n为了达到“大搞定”的状态，你必须理解 Linux 性能工具这个强大但有时令人困惑的世界。这需要一些努力，但最终是值得的。这些工具可以向你展示你从未预料到的应用程序和系统方面。\n\
  \n## 谁应该读这本书？\n\n本书帮助 Linux 软件开发者、系统管理员和终端用户使用 Linux 性能工具寻找特定系统中的性能问题。初级性能调查员学习性能调查和分析的基础知识。中高级性能调查员（特别是那些在其他专有操作系统上具有性能经验的人）将学习他们可能已经熟悉的其他系统的\
  \ Linux 等效命令。\n\n软件开发者学习如何准确定导致性能问题的精确代码行。正在对系统进行性能调优的系统管理员学习显示系统为何变慢的工具，然后可以使用这些信息来调优系统。最后，尽管这不是本书的重点，但终端用户将学习必要的技能，以确定哪些应用程序消耗了所有的系统资源。\n\
  \n## 本书是如何组织的？\n\n本书教授不同经验水平的读者寻找并修复性能问题。为了实现这一点，章节的安排允许你选择阅读书的不同部分，而不需要从头到尾读完整本书。\n\
  \n`第 1 章`](#ch01.html_ch01）专门介绍寻找性能问题的基本方法。它包含一系列并非特定于 Linux 的技巧和建议，这些技巧对于追踪性能问题被证明非常有用。这些指南是寻找性能问题的通用建议，可以应用于追踪任何类型计算机系统的性能问题。\n\
  \n``第 2 章`](#ch02.html_ch02）到`第 8 章`](#ch08.html_ch08）（本书的主体）涵盖了用于在 Linux 系统上测量不同性能统计数据的各种可用工具。这些章节解释了各种工具测量的内容、如何调用它们，并提供了每个工具的使用示例。每个章节都演示了测量不同\
  \ Linux 子系统方面（如系统 CPU、用户 CPU、内存、网络 I/O 和磁盘 I/O）的工具。如果一个工具测量多个子系统的方面，它将出现在多个章节中。每个章节描述了多个工具，但在给章节中仅介绍适用于特定系统的适当工具选项。描述遵循以下格式：\n\
  \n1. 介绍——这一部分解释了该工具旨在测量的内容以及它是如何工作的。\n2. 性能工具选项——这一部分不仅仅是重述工具的文档。相反，它解释了哪些选项与当前主题相关，以及这些选项的含义。例如，某些性能工具的手页识别了工具测量的事件，但没有解释这些事件的含义。本部分解释了事件的含义以及它们与当前子系统的相关性。\n\
  3. 示例——这一部分提供了一个或多个使用工具测量性能统计数据的示例。该部分展示了工具的调用及其生成的任何输出。\n\n`第 9 章`](#ch09.html_ch09）是\
  \ Linux 特有的，包含了在面对运行缓慢的 Linux 系统时使用的系列步骤。它解释了如何协作使用之前提到的 Linux 性能工具来准确定性能问题的原因。如果你想从一个异常的\
  \ Linux 系统开始，并且在不一定理解工具细节的情况下仅诊断问题，那么这一章是最有用的。`第 10 章`](#ch10.html_ch10）到`第 12 章`](#ch12.html_ch12）介绍了案例研究，其中之前描述的方法和工具被结合使用来解决现实问题。案例研究突出了用于发现和修复不同类型性能问题的\
  \ Linux 性能工具：CPU 密集型应用程序、延迟敏感应用程序和 I/O 密集型应用程序。\n\n`第 13 章`](#ch13.html_ch13）概述了性能工具以及\
  \ Linux 改进的机会。\n\n本书两个附录。`附录 A`](#app01.html_app01）包含了讨论的性能工具表，并包含了每个工具最新版本的 URL。`附录\
  \ A`](#app01.html_app01）还标识了哪些 Linux 发行版支持每个工具。最后，`附录 B`](#app02.html_app02）包含了说明如何安装\
  \ `oprofile` 的信息，在某些这是一个非常强大但难以安装的工具。\n\n## 致谢\n\n首先，我要感谢 Prentice Hall 的优秀同仁，包括\
