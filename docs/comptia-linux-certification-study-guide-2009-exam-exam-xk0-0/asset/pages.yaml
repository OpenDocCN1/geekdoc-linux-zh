    # Package Removal


    The packages are removed from the system using the remove option.


    ```

    apt-get remove package_name(s)

    ```


    The package will be removed, along with all the packages that depend on it. The
    configuration files will not be removed, but adding the option --purge will remove
    all files associated with the package. Using the purge option is worthwhile if
    you know you will not be using this package in the future, as it will clean up
    the disk and not leave a lot of unwanted files in the filesystem.


    # Advanced Installation and Removal


    You can install and remove packages on the same command line. For instance, to
    remove a package [or packages] when you are installing a package by suffixing
    them with a “-”, the syntax of the command would look like


    ```

    apt-get install newpackage oldpackage-

    ```


    Hence to install python package and remove the nano package, use


    ```

    apt-get install python nano-

    ```'
