    # ### Editor


    The `EDITOR` variable defines the users preferred text editor. The number and
    range of text editors are vast, and each user has their own favorite (and dislikes!)
    A number of common ones are `ed`, `vi`, `vim`, and `emacs`. As mentioned above,
    the setting of the environment variable is achieved by setting on the command
    line or inserting into the _.bashrc_ script.


    The command `echo $EDITOR` will return a blank line if the variable is not set.
    To set the default editor to be `vim`, use `EDITOR=vim` or `EDITOR=/usr/bin/vim`.


    Ideally, it is better to use the complete pathname (especially in the _.bashrc_
    script) to ensure that the variable is defined correctly. If the `PATH` variable
    is changed or does not have the /usr/bin directory defined, the editor will not
    be found and an error will ensue. How to use the vi text editor is defined in
    Chapter 6.


    # ### Term


    The `TERM` variable is to set up the type of terminal in use, which can be particularly
    important when using screen-oriented programs such as a text editor. This variable
    is set automatically during system installation but may need to be modified if
    a user is remotely accessing the system. When Linux is installed with KDE, the
    `TERM` variable will be set to the value `xterm`.'
