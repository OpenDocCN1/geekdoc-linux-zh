    # EXERCISE 3.2: Mounting and Unmounting a Filesystem


    For this exercise, you will use the Linux `mount` command and the Linux `umount`
    command on the disk partition /dev/sdb1. You will attach the disk partition to
    the mount point /mnt/morestorage (the mount point directory needs to be created
