  md: 'repositories, and then setting up a local repository to save downloading these
    for a number of machines on your network. When you have downloaded the packages,
    you need to generate the correct information for a repository. This is achieved
    using the `createrepo` utility, which extracts all the data from the rpm files
    to generate the necessary metadata for yum. The command to create the metadata
