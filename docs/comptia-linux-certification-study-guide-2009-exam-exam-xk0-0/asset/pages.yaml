    \ file using the following command:\n+       \n+       ```\n+       tar xvfz postgresql-8.1.3.tar.gz\n\
    +       ```\n+   \n+   2.  Change directories into the topmost directory you have\
    \ just created.\n+       \n+       ```\n+       cd postgresql-8.1.3\n+       ```\n\
    +   \n+   3.  Configure the `makefiles` for `make`.\n+       \n+       ```\n+\
    \       ./configure\n+       ```\n+   \n+   4.  Compile the sources by typing\
    \ `make`.\n+   \n+   5.  Install the software using the following command:\n+\
    \       \n+       ```\n+       make install\n+       ```\n\nYou have now successfully\
    \ extracted, configured, and compiled the `postgresql` software package.\n\n#\
    \ **RESOLVING APPLICATION DEPENDENCIES**\n\nAs you may have read in the sidebar\
    \ earlier in the “Install, Remove, and Update Programs” section of this chapter,\
    \ you can download dependent application packages manually as you try to install\
    \ an application from an .rpm package, or you can use `yum`. Yum’s full name is\
    \ “Yellow dog Updater, Modified.” Yellow Dog is a reference to Yellow Dog Linux,\
    \ a Linux distribution that focused on putting Linux on Apple hardware. Yum is\
    \ used on RPM-based systems, such as Red Hat, Fedora, CentOS, and Yellow Dog,\
    \ itself. In addition, the application repositories in openSUSE are exclusively\
    \ Yum-based."
