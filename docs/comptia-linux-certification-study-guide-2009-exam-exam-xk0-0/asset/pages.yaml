    \ an unauthorized person from accessing files on your Linux system during the\
    \ boot process, a boot password needs to be assigned. In this exercise, we will\
    \ assign a boot password to the system during interactive mode. To password protect\
    \ other menu items, the “lock” keyword must be entered. You can also use the “password”\
    \ command to provide a unique password for each menu item. Complete the following:\n\
    \n+   1. Sign into the system using administrator [root] privileges.\n+   2. From\
    \ the root command prompt, type the `grub` command to enter an encrypted password:\
    \ `# grub-md5-crypt`.\n+   3. Press the **Enter** (Return) key.\n+   4. The system\
