- pgno: 13
  md: '# # Introducing Linux+


    # ## Exam objectives in this chapter


    +   - Benefits of Certification

    +   - Walk through the Book

    +   - Differences in the New Version of the Exam


    # ## INTRODUCTION


    As I was designing the outline for this book, I thought carefully about the types
    of individuals who would be tackling the exam. Who would pursue Linux+ certification?
    There are those who *want* to get ahead and those who *have* to get ahead.


    # ## BENEFITS OF CERTIFICATION


    If you are reading this book, perhaps you have looked around at your current situation
    and have chosen to make an improvement. Perhaps you are seeing Linux+ certification
    as a key credential to put on your resume to apply for a more challenging position
    in your organization or a different position in a more challenging area. Maybe
    you or your industry is seeing a change in the technology direction your company
    is taking or your industry is taking and you want to take advantage of any opportunities
    that may arise.'
  merge: -1
  img_proc: true
- pgno: 14
  md: "For those who *have* to get ahead, we know who you are. You are probably faced\
    \ with a sort of ultimatum: write this exam or else. You may be in a position\
    \ where holding the latest version of the Linux+ certification is a mandatory\
    \ qualification. You wrote the 2004 exam, or an earlier version, and now you have\
    \ to write the 2009 edition to satisfy this requirement. You may have an offer\
    \ of a position being dangled in front of you, and the 2009 version of the exam\
    \ is only standing between you and this delicious new role.\n\n> Note\n> \n> At\
    \ the time of writing, CompTIA has stated that the Linux+ exam consists of 98\
