  md: 'can exist as a file or as an entire partition for storage. Within the Linux
    environment, virtual memory is accomplished by dividing the system''s physical
    RAM into units known as pages, and transferring less frequently used physical
    units of RAM (pages) to the hard disk drive. This process is known as swapping.
    When the system swaps out pages of memory to the hard disk drive, the system''s
    RAM is freed up to perform additional functions.


    While swapping offers advantages to the Linux system by extending its access to
    more memory, pages stored and retrieved on the hard disk drive are slower than
    accessing pages that only resided in physical memory (RAM). For the Linux system
    to use swap space, a special file or swap partition must be created first. Earlier
    in Chapter 2, the Linux swap partition was created. The creation of a swap file
    entails the creation of a special file. Once create, the special file must be
    designated to function as a swap file so that the Linux kernel will know to use
    it as swap space. Finally, the designate swap file must be activated.


    The swap file, a special file, can be created with Linux dd command. Below is
    an example of the creation of empty Linux swap file.


    ```

    dd if=/dev/zero of=/newswapfile bs=1024 count=1048576

    ```


    The command creates a swap file named "newswapfile." The input file "/dev/zero"
    is a special Linux file that provides null characters. The newly created swap
    file is 1 GB in size.


    To designate a partition or special file to be used as swap space, the Linux mkswap
    command is used. This command sets up a Linux swap area on a partition or special
    file. For a partition, you will need to prepare it using the mkswap command as
    root, as follows:


    ```

    mkswap /dev/hdb1

    ```


    For a special file, just as you would use the Linux mkswap command to create a
    swap partition, but this time you would use the name of the swap file as follows:


    ```

    mkswap /newswapfile

    ```


    The Linux swapon command is used to designate the specific devices or files on
    which paging and swapping is to take place. For the partition, you would need
    to prepare it using the swapon command as root:


    ```

    swapon /dev/hdb1

    ```


    For a special file, just as you would use the Linux swapon command to designate
    a swap partition, but this time you would use the name of the swap file as follows:


    ```

    swapon /newswapfile

    ```'
