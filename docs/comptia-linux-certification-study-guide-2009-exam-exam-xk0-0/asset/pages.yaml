  md: '**Table 11.1** syslog Event Levels


    | Level | Approximate Meaning |

    | :--- | :--- |

    | Emerg | Panic situations |

    | Alert | Urgent situations |

    | Crit | Critical conditions |

    | Err | Other error conditions |

    | Warning | Warning messages |

    | Notice | Things that might merit investigation |

    | Info | Informational messages |

    | Debug | For debugging only |


    The syslog configuration is defined in the `/etc/syslog.conf` file. This file
    is used to determine which system processes record their events to what files,
    and what level of logging to use.


    System events are categorized into eight levels and can be produced by one of
    21 predefined facilities, or system programs. The eight levels, in order of most
    to least critical, are listed in Table 11.1.⁶


    The logging facilities are the various services that might be running on the system,
    such as mail or File Transfer Protocol (FTP), as well as system events, such as
    logins, authentications, and *cron* tasks. The catch-all category for miscellaneous
    events is `user`.


    # ## Common Log Files


    The most common log files, the ones covered on the Linux+ exam, are described
    below. Note that these are defaults that are normally used, but the `/etc/syslog.conf`
    file can be used to arrange logging to your particular taste.


    # ### /var/log/messages


    The `/var/log/messages` file is the standard location for most system events.
    It is the place to look to see if your USB flash drive was really recognized by
    the system and by which drive ID. All info, notice, and warning messages are sent
    here by default, along with some authorization and cron events.'
