    # ## INTRODUCTION


    Linux is regarded as a very secure operating system. However, even the most secure
    systems can have an occasional flaw or be misconfigured. Even once you get everything
    set up and buttoned down, keep in mind that, as security expert Bruce Schneier
    says, “Security is a process, not a product.”¹ Additionally, the security experts
    at the SANS institute recommend what they call “defense in depth,”² meaning security
    is best applied in layers. In this chapter, we’ll look at the tasks necessary
    to make sure that your Linux systems live up to their secure reputation.


    # ## MANAGING AND MONITORING USER AND GROUP ACCOUNTS


    You may be wondering “Why even have separate user accounts?” On a home computer,
    it can be convenient to use different accounts so each user can keep things just
    the way they want without conflicting with other users. In a corporate environment,
    it’s critical to be able to control who gets access to what information to maintain
    security and may even be a legal requirement to protect privacy. It is also handy
    to know who is doing what on a computer to assist in troubleshooting problems,
    and unfortunately, it is occasionally necessary for tracking inappropriate activity.
    Finally, not only is it important to limit user accounts to protect information
    but it also protects the system itself from both malice and simple errors. Ideally,
    even the administrator should use full administrative access only when necessary
    to minimize those little “oops” moments.


    When you have a handful of users connecting to a computer, the job of managing
    individual sets of permissions is not that onerous. Once the community of users
    grows beyond a handful, this job can quickly grow out of hand. Imagine the task
    of managing individual users’ permissions on a file server that has hundreds of
    users connecting to it. Your life would take on all new meaning, and it would
    not be in a positive direction. Assembling users into groups make this manageable
    because you can manage permissions for the group. When there is a new user or
    a user needs access to an application or directory, you can simply add the user’s
    account to the appropriate group and'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'the account will inherit the group''s permissions. This section of the chapter
    starts with managing users and then progresses into managing groups.


    # Tools


    The following tools are used to create and manage user accounts on a Linux system.


    # Useradd


    There are a number of steps involved in adding users to a UNIX system. By default,
    these may include


    +   1. Define the new user by adding a line to the /etc/passwd file for the user
    and create a new User Identification number (UID). The system uses UIDs to refer
    to the user internally.

    +   2. Create a password for the user by adding a line to the /etc/shadow file.

    +   3. Define a new group for the user by adding a line to the /etc/group file
    Group Identification number (GID), which is used to refer to the group in the
    same way the UID is used to refer to the user.

    +   4. Create a new home directory for the user, set the file permissions on it
    and copy the default startup files to it.

    +   5. Set up the users e-mail account.


    > Note

    > The passwd, shadow, and group files are discussed in the next section.


    Although it is entirely possible to do each of these steps by hand, the useradd
    tool automates them. Not only does this make your life easier, it also reduces
    the chances of messing up the arcane file formats involved. The syntax is as follows:


    ```

    useradd [options] username

    ```


    Good options to know are as follows:


    +   - - c or --comment: this comment can be used to enter any text string, but
    it is typically used for the user''s full name or a short description.

    +   - - b or --base-dir: base-directory is the directory that the user''s home
    directory will be placed in, if you''d like it somewhere other than /home. By
    default, the username is used for the home directory.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   • `-m` or `--create-home` will create a home directory for the user, and
    copy the basic user settings files from /etc/skel, which is covered in the next
    section.


    A number of other parameters can be set in the /etc/login.defs and /etc/default/useradd
    files, including the following:


    +   • The range of UID and GID numbers


    +   • Where the users e-mail file is stored


    +   • Account and password time limits


    # userdel


    Use userdel to delete a user. The format is straightforward:


    ```

    userdel [options] username

    ```


    The only two options are given below.


    +   • `-r` or `--remove` will delete files in the user''s home directory and any
    files it contains as well as their e-mail spool.


    +   • `-f` or `--force` is the “nuke it from space” option – it will delete the
    user account even if they are currently logged in, delete the home directory even
    if other users may be sharing it, and potentially delete a group that matches
    the username even if it is used by others on the system. The man pages advise
    caution when using this option.


    Note that neither of these will remove files outside of a user''s home directory,
    so it may be necessary to use the find command to hunt down files that may be
    left orphaned.


    ```

    find /user username

    ```


    The above find command will look up the username in the /etc/passwd file, but
    if you''ve already removed the user, you''ll either have to already know the UID
    and use it instead of the username (the -user option will accept either, or you
    can use the -uid option) or use the -nouser option to hunt down orphaned files.


    # Usermod


    The usermod command changes (modifies) a user account. The syntax is as follows:


    ```

    usermod [options] username

    ```'
