    Notice that the files were copied, including the permissions, but the owner and
    group of the first file was changed to the default owner and group of the user
    invoking the `rsync` command, and the timestamps were all changed to the time
    that the time and date that the command was run. This wouldn''t matter if you
    are just backing up your own files; but if you are copying a home directory for
    a number of users and then restored the files back to all be owned by root, you
    would have a mess. To avoid that, you can use the `-a` option (for archive), which
    will preserve additional file information, and run the command with root privileges
    to preserve the ownership:


    ```

    sudo rsync -a * ../rsync_test

    ```


    Using the `-a` option now gives:


    ```

    -rw-r-r-- 1 root root 188 2009-07-01 11:13 rights_test

    -rw-r--- 1 chappell chappell 4662 2009-07-01 11:13 rights_test2

    -rwxr-r-- 1 chappell chappell 20 2009-06-18 22:54 test.sh

    ```


    Additional options that may be helpful are as follows:


    +   - `-r` or `--recursive` to copy the contents of subdirectories

    +   - `-v` or `--verbose` to get extra information during the copy

    +   - `-n` or `--dry-run` to not actually do anything, just show what would be
    done—very helpful if you are moving large amounts of data, or including options
    to delete files

    +   - `-z` or `--compress` to use compression while transferring files, which
    can save bandwidth


    # File Transfer Protocol


    Another common way to transfer files is using FTP. Although not normally used
    for backups, FTP has been around for a very long time and is well supported. Not
