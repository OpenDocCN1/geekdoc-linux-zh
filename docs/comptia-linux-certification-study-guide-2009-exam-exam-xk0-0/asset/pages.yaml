- pgno: 228
  md: "# Configuring the Source\n\nWe will discuss downloading the package archive\
    \ later on in the section, but suppose for now that you have the source in a suitable\
    \ directory on your hard drive. The first place to look is to see if there are\
    \ any README or INSTALL files in the directory – and if they are found, read them.\
    \ These usually contain very useful information on the software and often will\
    \ give details on how to install them with any specific options or dependencies\
    \ that you may need.\n\nAfter reading the documentation, you need to change directories\
    \ to the directory where the package is stored. You can then configure the package,\
    \ which is usually achieved using the `configure` script by typing `./configure`.\n\
    \n> **Note**\n> \n> It is very likely that the directory containing the new package\
    \ will not be in your current path, and hence you need to be specific by using\
    \ `./configure` and not just `configure`.\n\nThe `configure` script is a shell\
    \ script which will configure the *makefile*, which is used by the compilation\
    \ tool *make* (described below). This *makefile* will have information on your\
    \ system to enable *make* to compile the source correctly. Originally, the *makefile*\
    \ had to be edited by hand which, from experience, could take a long time. The\
    \ machine output from this command will be a new *makefile*, and if the command\
    \ worked correctly, this will be constructed and placed in the correct directory.\
    \ There could be a lot of messages scrolled to the standard output (often the\
    \ screen) during this process. If it finds an error, it will be reported and configure\
    \ will exit. If there are no errors, configure will end gracefully.\n\n# make\n\
    \nThe utility `make` is used to automatically determine which components of a\
    \ software package need to be compiled, and then to guide this compile process.\
    \ The utility can be used with any type of software package that can be compiled\
    \ with a shell script. The `make` utility will use the *makefile*, which details\
    \ the relationships among the files in the package and how to update these files.\
    \ This will be undertaken from the data in the database and the last modification\
    \ times of the files. The executables are typically made up from *object* files,\
    \ which themselves are compiled from *source* files.\n\nOnce you have the *makefile*\
    \ after running `compile`, then you can run `make`. This shell script is typically\
    \ run initially with no option. This will parse the *makefile* and update any\
    \ files as necessary. If `make` completes, this"
  merge: -1
  img_proc: true
- pgno: 229
  md: "will build a binary of the software package. This does not install the binary;\
    \ that step is achieved in the last step using the command\nmake install\n\nIf\
    \ this exits with no errors displayed, then the software has been installed correctly.\
    \ This will have to be run with superuser privileges. The `configure` script will\
    \ determine where the program will be installed, typically in /usr/local/bin.\
    \ To clean up your system from the temporary files left by make, you can run the\
    \ command `make clean`. Unlike one of the package managers described in previous\
    \ sections, it is often as easy to remove programs installed by this process.\
    \ If the makefile is still there, you might try to use the command `make uninstall`,\
    \ but this often does not work. At this point, you will have to uninstall the\
    \ programs manually.\n\n# autoconf\n\nThe `autoconf` utility is a package of M4\
    \ macros that are used to build a set of shell scripts to automatically configure\
    \ software source packages. The utility will create a configuration script from\
    \ a template file listing the operating system features that the package uses.\
    \ The generation of the configuration files is primarily to make the user’s experience\
    \ easier, to ensure the configure process is easier to use and less prone to errors.\n\
    \n# Archive Files\n\nThe tar file format has been in existence since the early\
    \ days on UNIX and was originally designed for tape archives (tar). The utility\
    \ to use this file format is also called tar. It is now a common method for archiving\
    \ or collecting a large number of files into one larger file, while preserving\
    \ all the file information, such as directory structures, dates, and user and\
    \ group permissions. Files that are packed into this format have a naming structure\
    \ of filename.tar. These large files can be compressed using a compression utility\
    \ such as gzip, bzip, or compress. Depending on the compression utility used,\
    \ the tar file will be renamed.\n\n+   * filename.tar will become filename.targz\
    \ if gzip is used.\n\n+   * filename.tar will become filename.tar.bz or filename.tar.bz\
    \ 2 if bzip/bzip2 is used.\n\nBefore we look at the compression utilities, we\
    \ will look at the tar utility. This is often used within Linux and the syntax\
    \ and operation should be known to any Linux administrator. To create a tar file,\
    \ the following general syntax can be used:\n``` \ntar -cvf filename.tar files|directories\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The options used are c to create a tar file; v for verbose output; and f to
    put the output in the specified file. The tar archive will be created from one
    or more files and/or directories specified at the end. There could be multiple
    files and directories specified on the same command line. For instance, suppose
    you wanted to compress everything in your work directory in your home folder,
    say /home/synpress/work. The command to create an archive work.tar in the current
    directory would be as follows:


    ```

    tar -cvf work.tar /home/synpress/work

    ```


    Once the tar file has been created, you can list its contents by using tar -tvf
    work.tar. The tar file can be decompressed or the files extracted using tar -xvf
    work.tar. This extraction process does not remove the tar file, but places the
    files in the current working directory.


    The tar utility can also be used to compress the tar file that has been created.
    In the above example, to compress the tar file of the work directory you would
    use


    ```

    tar -czvf work.tar

    ```


    The files are compressed using gzip and will be given the .tgz extension. The
    compressed file can be decompressed by using


    ```

    tar -xzvf work.tar

    ```


    # ## Compression Utilities


    There are a lot of compression utilities available, and it is often a personal
    choice which one to use. Some utilities work best on certain types of file, but
    we will concentrate on a couple of them. We have just mentioned gzip which can
    be used with tar. It is also a stand-alone program that can be invoked to compress
    files at any time. The format of the command is as follows:


    ```

    gzip filename.ext

    ```


    This will compress the file filename.ext and save it as filename.ext.gz. The original
    file will be deleted during the process. This can be decompressed by using the
    following command:


    ```

    gunzip filename.ext.gz

    ```


    Again, the command will delete filename.ext.gz and leave filename.ext only. The
    gzip utility can compress files to different levels from 1 through 9, with 1 being
    quick but least efficient, to 9 being slow but very efficient. The default is
    a level 6, which could be increased due to the speed of modern computers, but
    often the newest computers have the most disk space! For both gzip and gunzip
    the option -r can be used which will recursively compress or decompress all the
    files in the current directory and the subdirectories.'
  merge: -1
  img_proc: true
- pgno: 231
  md: "The `bzip2`/`bunzip2` utilities are another pair of compression and decompression\
    \ tools, which often give slightly better compression ratios. The command line\
    \ options are very similar to that of `gzip`/`gunzip`. The compressed files will\
    \ usually have an extension of `bz2`/`tbz2` (compressed tar file) or a compressed\
    \ tar file.\n\n# **EXERCISE 7.1: Installing Software from Source Code**\n\nYou\
    \ need to install `postgresql` on your system instead of MySQL by using the source.\
    \ You have the `gzip` source file on your disk. The following will unpack, configure,\
