    \ for and about the Internet. For those who wish to know about DNS than that is\
    \ covered here can look at any of the many books on the subject.\n\nThe Domain\
    \ namespace can be regarded as structured in a tree form. Each domain within the\
    \ tree is a node, with each node having a set of resource records associated with\
    \ it. These records will define the ownership, name, and IP address, as well as\
    \ potentially a lot of other details. In addition, each of these domains can have\
    \ subdomains, often referred to as children, associated with them. The root of\
    \ this tree is named \".\" (dot), which is the corollary of the root drive/ in\
    \ the Linux filesystem.\n\nEach subdomain prepends its name to the root name,\
    \ each being separated with another \".\" or dot. The root domain is therefore\
    \ \".\", with com. and org. being examples of subdomains. There are also international\
    \ subdomains such as .uk for companies in the United Kingdom. Each of these will\
    \ have further subdomains, such as syngress.com. These could have other child"
