    # SUMMARY


    The bottom line is that we want you to pass your exam using this book. As stated
    earlier in this chapter, we have been through it ourselves and did so without
    the benefit of having a book like this to help us study. With this in mind, we
    put a book together that we would have wanted to use when we went through our
    own exam experiences. This book covers all the topics listed in the exam objectives
    and points you to additional sources of information. We hope that this book also
    makes you “dangerous” with Linux. If you are new to Linux when you start studying,
    this book will not make you an expert, but it will arm you with enough knowledge
    and understanding to make you useful in your job. You will also be able to impress
    your friends who are anchored to another operating system (that is, if they are
    easily impressed).


    We, the authors, wish you every success with the exam and with your career. We
    hope that you are able to make the changes you seek and that this book helps you
    achieve your certification. In addition, as individuals who frequently or daily
    use and enjoy, and are occasionally frustrated by, Linux, we hope that you continue
    to find a use for Linux and other open-source software whenever and wherever you
    can.'
