- pgno: 368
  md: '# EXERCISE 11.3: Backing Up Your Home Directory with tar


    In this exercise, we will use the *tar* command to create an archive of your home
    directory and extract the files to another location.


    +   1. Enter `cd ~` to navigate to your home directory.

    +   2. Create the tarfile. Enter the following command: `tar -cvf myhome.tar*`.

    +   3. Enter `ls -l` and verify that myhome.tar is there. You can verify the contents
    of the tarfile by entering `tar -t myhome.tar*`.

    +   4. Navigate to the /tmp directory by entering `cd /tmp`.

    +   5. It is time to extract the files from your newly created tarfile in /tmp.
    Enter `tar -xvf myhome.tar`. You do not need to specify a target directory because
    you are in your target directory.

    +   6. Enter `ls -l` and verify that the contents of myhome.tar have been extracted
    properly.


    In this exercise, we used the `v` option (verbose) for all operations. This option
    is not required; we used it to illustrate what happens behind the scenes as the
    *tar* command executes. You can increase the level of detail by adding more `v`''s.
    Try running through the exercise again, using three `v`''s instead of one; for
    example, `tar -cvvvf myhome.tar*`.


    The *tar* command is very mature and robust, and as you can see above in the sample
    syntax for creating a tarfile, there are numerous options for just about every
    type of file operation. I recommend consulting *tar*''''s *man* page and practicing
    creating, compressing, verifying, and restoring from tarfiles. *tar* is one of
    those commands that you will use frequently.


    # dump


    Where *tar* and *cpio* are terrific for working with individual files, the *dump*
    command''''s sweet spot is archiving entire filesystems. *dump* works by examining
    files on a target filesystem and determining the files that need to be backed
    up. These files are then copied to the backup medium of choice, usually hard disk
    or tape. If the *dump* is larger than the backup medium, the *dump* is split and
    copied to multiple volumes. On most media, the size is determined by writing until
    an end-of-media indication is returned.


    The following is the basic syntax for *dump*:


    ```

    ```

    dump -0 -A [archive file] -f [destination file or device]

    [mountpoint of a filesystem]_or a list of files and

    directories to be backed up]

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'In the above-mentioned example, the `-0` option tells `dump` to perform a full
    backup. The `-A` option is used to designate the archive file, which is read by
    the `restore` command (described below) when restoring the backed up files. `-f`
    is used to identify the target file or device that will host the “dumped” files.
    The number of options for `dump` is astounding, and I recommend that you consult
    the `man` page if you need to perform specific types of backups.


    # restore


    The `restore` command performs the inverse function of `dump`. It restores files
    that have been backed up using `dump`. The `restore` command can be used to restore
    a full backup of a file system and apply any subsequent incremental backups, `restore`
    can also be used to restore individual files or directories from a full or partial
    backup file archive. Like its counterpart, `restore` can operate across a network
    to restore filesystems or files and directories on remote systems.


    The following is the basic syntax for `restore` that will restore all files from
    the identified archive (mounted at /dev/nst0) in the current directory:


    ```

    restore rf /dev/nst0

    ```


    In this example, the `r` option retrieves all files from the archive and the `f`
    option is used to designate the archive (\dev/nst0). `restore` also has an interactive
    mode, accessed using the `-I` option, that lets you navigate inside the archive
    to select individual files and directories to restore. The syntax for that looks
    like this:


    ```

    restore If /dev/nst0

    ```


    Like `dump`, the number of options for `restore` is numerous. Its `man` page is
    worth consulting for performing specific file restore operations.


    # dd


    The `dd` command is a prime example of a big thing that comes in a small package.
    This seemingly simple tool is incredibly useful for making and copying disk images,
    backing up and moving disks, and duplicating filesystems. It makes an exact clone
    of a hard disk, including all blank space. To use it, the source disk must be
    unmounted and the output destination must be at least as large as the source.


    To illustrate, the following syntax will create an image file in my home directory
    entitled, cddbackup.iso from the CD in my CD-ROM drive:


    ```

    dd if=/dev/cdrom of=/home/brian/cddbackup.iso

    ```


    The option, `if`, designates the input file (the CD that is mounted in my CD-ROM
    drive) and `of` designates the output file, cddbackup.iso in my home'
  merge: -1
  img_proc: true
- pgno: 370
  md: "directory. As you can imagine, the `dd` command provides a very quick way to\
    \ create an image file that can be used to duplicate a CD or DVD. Creating CDs\
    \ and DVDs will be described in the next section.\n\n> **Note**\n> The `dd` command\
    \ has earned the notorious nickname, “data destroyer,” because system administrators\
    \ have accidentally destroyed entire filesystems by inverting the parameters of\
    \ the input file and the output file. If you are using the `dd` command, look\
    \ over the syntax before you hit the **Enter** key to start the operation. Once\
    \ started, the operation cannot be reversed.\n\n# Writing to Removable Media (CD-RW,\
    \ DVD-RW)\n\nCreating CDs and DVDs is a relatively commonplace activity that people\
    \ do for a variety of reasons: backing up files on a computer, creating a photo\
    \ CD, and transferring music and videos, among others. There are many nifty GUI-based\
    \ tools to burn CDs and DVDs in Linux. Sadly, the exam does not ask you about\
    \ any of them. You will be quizzed on how to accomplish this from the command\
    \ line. At a high level, there are two steps in the process of burning a CD or\
    \ DVD.\n\n+   1. Create an image file for the CD or DVD, which involves creating\
    \ filesystem on the medium and adding data to an image file.\n+   2. Apply the\
    \ image to the CD or DVD.\n\nRegardless of whether it is a hard disk, USB flash\
    \ drive, CD or DVD, nothing can be stored on any medium until a filesystem has\
    \ been created on it. Unlike a hard disk or flash drive, however, the tricky thing\
    \ about using a CD-R or DVD-R is that it is writable only once, which means that\
    \ if you create the empty filesystem as a step by itself, it will remain empty\
    \ forever and you will have a coaster for your favorite beverage. Burning a CD\
    \ or DVD involves creating a filesystem while transferring the files to the medium.\
    \ The command that accomplishes the first part of the process – creating an image\
    \ file (an _.iso_ file) that includes both the filesystem and the actually files\
    \ that will be transferred to the medium – is `mkisofs`. You can use the following\
    \ syntax for creating a typical CD or DVD image:\n\n```\n```\nmkisofs -r -o [filename\
    \ of CD or DVD image.iso] \n[directory where files to be copied are located]\n\
    ```\n```\n\nThe option `-r` sets the permissions of all files on the CD or DVD\
    \ to be public readable and enables RockRidge-extensions. If you do not use the\
    \ `-r`"
