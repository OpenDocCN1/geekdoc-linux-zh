    # EXERCISE 11.2: Using awk


    In this exercise, we''ll look at a very basic example of using *awk* to print
    user names and UIDs from the */etc/passwd* file. From a command prompt, type the
    following:


    +   1.  Enter the following command at the command prompt:


    ```

    awk -F:''\{''\print "groupname: "$1",group ID:"$3"\}'' /etc/group

    ```


    Stepping through the example, the `-F:` defines a colon as the field delimiter
    – it''s what separates the different pieces of information in the */etc/group*
    file. The actual script is enclosed in single quotes so the command shell won''t
    try and interpret the squiggly braces. The *print* command generates the output
    that shows up on the screen. The *$1* is the first field in the file – in this
    case the group name – and the *$3* is the third field, the GID. The last part
    is, of course, the group file that we are searching through.


    +   2.  To see the last three lines of */etc/passwd*, enter `tail -n3 /etc/passwd`.


