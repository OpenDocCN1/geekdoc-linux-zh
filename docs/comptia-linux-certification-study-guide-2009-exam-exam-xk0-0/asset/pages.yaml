- pgno: 356
  md: '# /var/log/syslog


    The /var/log/syslog file is used to collect information about authorization events,
    time changes, and system statistics events if you installed the *sysstat* package.


    # /var/log/maillog


    If you run a local mail service, events related to it get sent to /var/log/maillog.
    If your system is a central e-mail server for a busy site, the mail logging may
    be further broken down to mail.info, mail.warn, and mail.err to help isolate specific
    levels of messages.


    # /var/log/secure


    The /var/log/secure file is used by Redhat-based distributions to record authorization
    messages for `sshd`, `sudo`, and other authorization events.


    # /var/log/lastlog


    The /var/log/lastlog is used to store information about user login times. Unlike
    the other log files, /var/log/lastlog is a binary file, and can''t be viewed (well,
    not properly, anyway) with `vi` like the other log files. Instead, the `lastlog`
    command uses this file to show the last time a user has logged in to the system.
    Note that the `last` command is similar in that it shows all the logins from the
    last time the /var/log/wtmp file has been reset.


    # Rotating Logs


    As a typical Linux system runs, events occur – users connect, programs start and
    stop, devices are connected and removed, and mail is sent and received, among
    many other events. All these events get logged. Over time, the log files keep
    growing, and if left unchecked would eventually fill whatever hard drive they
    are written to, causing system problems – and more events to be logged. To prevent
    this, it is important to implement some sort of log management scheme. Most current
    Linux distributions include an automatic default log rotation system, scheduled
    with `cron`.


    The standard program for rotating log files is `logrotate`. By default, it is
    run daily by the `cron` schedule, and can be set to rotate, compress, remove and/or
    mail log files based on specified times (that is, daily or monthly), or be set
    to only kick in if a log reaches a specified size. The /etc/logrotate.conf file
    contains the options used by `logrotate`. More information about the `logrotate`
    command can be found at `man logrotate`.'
  merge: -1
  img_proc: true
