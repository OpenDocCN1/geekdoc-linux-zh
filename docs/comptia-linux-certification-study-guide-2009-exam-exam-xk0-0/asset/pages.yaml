- pgno: 170
  md: "# 158  CHAPTER 6: Using BASH\n\nFor example, you’ve been using the `ls` command\
    \ to list the contents of a directory. By default – if not instructed otherwise\
    \ – the `ls` command will show the contents of only the current directory, limited\
    \ to just file and directory names, with color-coded file types, formatted in\
    \ rows, sorted alphabetically. Each of those options can be changed by passing\
    \ the appropriate option flag. The general format of a BASH command is\n\n```\n\
    ``` \ncommand -option(s) parameter(s)\n```\n```\n\nFor the `ls` command that looks\
    \ like this:\n\n```\n``` \nls -l /etc\n```\n```\n\nUsing the `l` option (as in\
    \ *“long”*) shows not just the file names, but lots of other interesting information,\
    \ such as the size, owner, creation or last modified date, and access information.\
    \ Options can be stacked, so showing the same information sorted by date looks\
    \ like this:\n\n```\n``` \nls -l -S /etc\n```\n```\n\nor you can run the options\
    \ together after a single `-` like this:\n\n```\n``` \nls -lS /etc\n```\n```\n\
    \n# **Exam Warning**\n\nPay careful attention to capitalization. Unlike the various\
    \ Microsoft products, all flavors of UNIX (Linux, BSD, and even OSX) distinguish\
    \ between upper and lower case, in commands, options, and file names. In the preceding\
    \ example, `ls -s` shows file sizes, where `ls -S` sorts by size. Likewise, `FILE1`,\
    \ `File1`, and `file1` are three different files; and `l s` is a valid command,\
    \ but “LS” is not.\n\nYou can even list multiple directories by using the recursive\
    \ option (`-R`) and/or listing multiple directories as parameters:\n\n```\n```\
    \ \nls -R /etc /home\n```\n```\n\nMost commands have so many options that there\
