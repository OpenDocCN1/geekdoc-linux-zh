    This can then be included into its own file in the /etc/yum.repo.d directory.


    # Adding a Repository in Debian


    The method of adding a repository that uses the APT packaging tool is different.
    The file /etc/apt/sources.list contains a list of available software repositories,
    and it can be updated manually or (if installed) by a graphical manager tool.
    If you want to add a new repository manually, the format to follow is: package
    type, Web address (URL), distribution, and section. For example, one of the lines
    in sources.list could be


    ```

    deb http://security.debian.org/ lenny/updates main contrib

    ```


    # EXERCISE 7.3: Adding a New Software Repository


    You want to add a repository you know exists at ftp://ftp.nerim.net/debian- marillat/.
    This is achieved by


    +   1. Opening the file /etc/apt/sources.list using your favorite editor, such
    as vi.


    +   2. Adding in the line:


    ```

    deb ftp://ftp.nerim.net/debian-marillat/ etc main

    ```


    +   3. Save and exit from the editor.


    +   4. You have now added the new repository to your system.


    # SUMMARY OF EXAM OBJECTIVES


    Within this chapter, you learned how to download and install applications using
    a variety of methods, both from binary packages and using source code. Initially,
    we looked at the software package formats that you will most likely encounter
    on the Linux systems you are administering – RPM and DEB packages. The RPM format
    of software packages was developed by Red Hat'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# CHAPTER 7: Installing Applications


    and is found on Red Hat, SUSE, Fedora, CentOS, and many other distributions. The
    DEB packages are found on distributions based on the Debian code and include Debian
    (of course), Knoppix, Ubuntu, and a variety of other distributions. The popularity
    of these formats along with the support that is available for some of the major
    distributions will push most companies to use these.


    With both the software package formats, you were guided through the main aspects
    of software management, namely adding, deleting, and updating the various packages.
    While both command sets are very similar to each other, there are a number of
    differences which you should understand and remember for the test. The update
    commands for both should be memorized and any additional options that can be added
    to these commands understood.


    The downloading, compiling, and building software from source was described and
    some background on when and why this may be necessary. In particular, you may
    want to make modifications to the actual source code to make it more compatible
    to your particular Linux build. The usual method is to use compile, make, and
    make install. This sequence will generate a makefile using compile, and then make
    will run this makefile to compile the source. Finally, the software can be installed
    using make install. The instructions for undertaking this and any command line
    switches that may be necessary are usually found in the INSTALL text file located
    in the directory where the software is.


    Linux, unlike Microsoft Windows, does not add all the libraries and other dependent
    packages into one large file to install on your system. Instead, the software
    has a number of dependencies where the installation of one package will depend
    on another package to be installed. The resolving of dependencies used to be time
    consuming and frustrating as one dependency leads to another and another. This
    has been solved using a number of tools such as yum and apt that will work out
    what are all the dependencies and install these as well. This will reduce your
    workload considerably, and usually means you just have to remember the syntax
    of the high level tool, and let it work out what to do.


    All of these packages are located in software repositories, which can be considered
    to be buckets containing one or more software packages. Once these are defined
    on your system, when you want to download a new software package, the system will
    look into these repositories to download the package and install it. In addition,
    updates to the system will be located in the software repositories and the system
    will use these to compare with the version of software you have loaded and suggest
    that any are upgraded if a newer version is released.'
  merge: -1
  img_proc: true
