- pgno: 128
  md: 'Linux networking utilizing Transmission Control Protocol/Internet Protocol
    (TCP/IP) and how to manage this within Linux.


    User management is one of the fundamental tasks that needs to be understood for
    day-to-day management of a Linux system, and to be able to achieve this in an
    effective manner is necessary for all Linux administrators. This is equally important
    whether the system is used by yourself, your whole family, or a large corporation.
    Users should have the correct rights and environment setup to ensure that their
    experience in using the system is favorable and that the support overhead is kept
    to a minimum.


    As part of the system setup, the user will need and want to access the various
    devices installed on the system. The correct setup of these devices needs to be
    accomplished prior to deployment to ensure that the system is functioning correctly.
    This will typically need to be undertaken at the super-user level, a level of
    privilege that is typically not bestowed onto a normal user. In addition, the
    user interaction at this level can often cause system instabilities, which may
    be hard to diagnose.


    The networking of the computer system, whether via wired or wireless connection,
    is usually a given necessity in today’s world. There will be very few systems
    deployed without this capability, and often, the user will require both options,
    particularly in any form of portable device. The computer will also typically
    use TCP/IP as the transport mechanism for the network connections, and the different
    options available to set up this will be discussed. The basics in connecting to
    name servers and Dynamic Host Configuration Protocol (DHCP) servers are also discussed,
    and the majority of parameters are explained.


    # USER PROFILES


    Any installation of Linux will include the creation of a number of different user
    accounts: the superuser, a normal day-to-day user, and a system user. Each of
    these accounts is important in their own right, and a user needs to understand
    the differences.


    All users need to have an account on the system, which should be unique to them
    to ensure that there is a basic level of security built in. A normal user can
    add, delete, and modify their files and those that have the appropriate attributes
    set. These users cannot make system wide changes nor can they manage other users
    on the system. Standard users can also make changes that are specific to them,
    such as desktop wallpaper and addition of printers.


    Users who are specified as being a superuser [also referred to as a system administrator]
    have global privileges, can create and delete users, and can'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'change the permissions of files located within the filesystems. There may be
    many system administrators on a given system, particularly those located in a
    large corporation. The number of users who are elevated to this level should be
    kept to a minimum to ensure the security and integrity of the underlying system.
    There is a special superuser known as `root`, with a user ID and group ID of 0.
    This user has full and unrestricted rights to manipulate any file, to traverse
    to any directory, and to execute any program. For obvious reasons of security,
    this user’s credentials should be shared by very few people.


    The third type of account is that of a system user, which is really not a user
    at all. This account is an administrative account that is used by the system itself
    for the running of various administrative tasks. For example, `xfs` owns the X11
    font server and all its associated files, and these can be executed only by itself
    and the root account. System users differ from other users on the system in that
    they do not have a home directory or password nor can they be accessed via the
    normal system login prompt.


    # System and User Profile and Environment Variables


    The following will describe the user profiles that are created for each individual
    user and the common variables that are modified to suit your personal preference.
    Each user on the system is able to customize their profile to suit their specific
    needs and preferences. These preferences are held in environment variables located
    in resource files throughout the system.


    The three different shells in bash are the login shell, the normal shell, and
    the interactive shell. The login shell reads the .profile file located in the
    user home directory or /etc directory (~/profile), and interactive shells read
    `~/ .bashrc`. The environment variables are named objects that contain information
    that can be used by one or more applications.


    As bash is the default shell under Linux, a summary of the bash startup files
    is shown below:


    +   1. `/etc/profile` This is the system-wide startup file and will be executed
    when a user logs on. The file will be protected, and only the superuser [root]
    will be able to make changes to the file. As this file may be overwritten with
    a system upgrade, it is not recommended that changes are made to this directly.


    +   2. `/etc/bash.bashrc` This is often linked to /etc/bashrc, and is called *per
    interactive shell startup*. The file will be protected, and only the superuser
    [root] will be able to make changes to the file. As this file may be overwritten
    with a system upgrade, it is not recommended that changes are made to this directly.'
