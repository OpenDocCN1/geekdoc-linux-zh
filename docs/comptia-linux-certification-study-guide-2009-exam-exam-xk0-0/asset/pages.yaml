- pgno: 326
  md: 'rm -r /tmp/test and rm -r /tmp/test. The difference of a single errant space,
    in this case, will tell the system to try and delete every file on your machine.
    To protect your system as well as to use the idea of "least privilege" discussed
    in the previous section, it''s advisable to use your system with normal user privileges
    whenever possible. When extra authority is called for, you can use the power of
    Privilege Escalation.


    # sudo


    The standard way of getting extra administrative power from a terminal window
    is to use sudo (think "do as super user"). It gets put in front of whatever command
    you want to run, and after you press the enter key, it will ask for your regular
    user password and run the command as administrator. The syntax is


    ```

    sudo [OPTIONS] command

    ```


    Some of the more interesting options include


    +   - -u will let you run a command as a user other than the system administrator.
    This is handy for troubleshooting problems that involve user privileges.


    +   - -e lets you enter a file to be edited instead of a command.


    As a convenience, once you authenticate with sudo, it will remember the password
    for a few minutes, so additional uses of sudo don''t ask for a password.


    # su


    Even with the several minute password grace period it can become tiresome to keep
    typing sudo, so if you need to do a bunch of stuff, it is often easier to start
    an entire new command shell with administrative privileges with the su command.
    Unlike the sudo command, su uses the administrator password. The syntax is


    ```

    su [OPTIONS] [username]

    ```


    As with sudo, su can be used to open a shell as any other user, too.


    > **Note**

    > Note that su opens a whole new shell, as a different user. Because of this there
    is a completely separate history file, so you can''t use the "up" arrow to get
    to the command that you just got denied from running because you weren''t root.
    Typing exit or <ctrl>d will put you back to your normal user shell.'
  merge: -1
