    # Configuring a Wireless Interface


    The use of wireless network cards has grown rapidly over the last few years due
    to the increase in speed of the wireless infrastructures. The configuration of
    a wireless interface is very similar to that of a wired interface. To display
    the status of all the wireless interfaces on a system, iwconfig is used with no
    parameters or the iwlist command, which is found in /usr/sbin. The wireless statistics
    are obtained from the /proc/net/wireless file.


    To set up a wireless NIC, the main parameters to be used are given below:


    +   ESSID is used to set the network name to enable the user to roam across a
    number of access points.


    +   mode will need to be set depending on the network topology. The common parameters
    are managed for a network of many access points, ad hoc for a point-to-point connection,
    and master if the device will act as access point.


    +   key/enc is used to set the current encryption key, and is entered in hex notation
    in the form XXXX-XXXX-XXXX-XXXX or as an ASCII string with the s : prefix.


    # Network Configuration Files


    There are a number of network configuration files in the systems that are modified
    automatically or manually. The files can have comments embedded in them using
    the # symbol as per normal, and it is advisable to add meaningful comments if
    these files are modified manually.


    # Hosts File, /etc/hosts


    The hosts file maps actual IP addresses to hostnames. For large networks, this
    is usually undertaken by using DNS, as the maintenance involved in keeping hosts
    files current is usually large. The hosts file will contain both IPv4 and IPv6
    addresses. Often, it is useful to add a small number of frequently used hosts
    into the hosts file to reduce the load on the network and name servers.


    # Services, /etc/services


    The services file maps port numbers to services. A port is specific to an application
    and is the communication endpoint used by the transport layer protocols in the
    IP suite. Applications will use these port numbers to ensure that the sending
    and receiving systems understand which application the'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'packet is destined for. For example, suppose a host wishes to display a Web
    page located on another system. The standard port for the World Wide Web Hypertext
    Transport Protocol [HTTP] is 80, so the source will send a packet to destination
    with port 80 in the IP header block. The destination will then know to route the
    packet to the Web server application to execute. On a typical system, it is not
    necessary to modify the services file after it has been initially configured during
    installation.


    # Name Switch Service, /etc/nsswitch.conf


    The Name Switch Service is used to tell the system which service to use, with
    potentially a number of entries per service to allow for multiple “databases”
    and their lookup order to be specified. Typically, there will be entries for passwd,
    hosts, networks, and services – among others. The typical entries are as follows:


    +   - `nis` – use NIS or YP

    +   - `dns` – use the domain name service

    +   - `files` – use the local files


    Typical entries would look like


    ```

    ```

    hosts:      files dns

    netmasks:   files

    netgroup:   files nis

    ```

    ```


    # Resolver File, /etc/resolv.conf


    The resolv.conf file will normally be constructed automatically and will never
    need to be changed manually. It will contain the list of one or more name-servers,
    typically obtained from the DHCP service. The list of servers will be defined
    such as


    ```

    ```

    name server 68.87.85.98

    name server 68.87.69.146

    ```

    ```


    # TCP/IP Ports


    There are a number of common networking ports that are used frequently. The entire
    list is very long and is organized into a number of sections. Ports 0 through
    1023 are defined as well-known ports, such as FTP. Registered ports, that is those
    with an Internet Assigned Numbers Authority [IANA] registration, are from 1024
    through 49151. The remainder of the ports from 49152'
