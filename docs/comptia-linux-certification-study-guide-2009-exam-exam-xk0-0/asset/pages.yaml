  md: '> Note

    > When you are prompted for your password when you try to connect to a Samba server,
    you need to enter your password that has been defined on that server. Depending
    on how the system was set up, this may be different to your normal Windows password.


    On a **Linux** or **UNIX** machine, there is a special client to access a **Samba**
    server called `smbclient`. The syntax for connecting to a **Samba** server is


    ```

    smbclient //servername/sharename

    ```


    This client, once properly connected, will display a new prompt to the user (typically
    `smb: \>)` and will have very similar functionality to an **FTP** session, where
    `get`, `put`, `ls` etc. can be used to navigate.


    # winbind


    The integration of **Linux** and a Microsoft **Windows** can be time consuming,
    as there is no real underlying unified login. The `winbind` component of **Samba**
    tries to solve this problem by allowing the **Windows** domain user to appear
    and operate as a **Linux** user. The mappings between the **Linux** and Microsoft
    **Windows** user IDs are stored by `winbind`.


    # WEB SERVICES


    The setting up of **Web services** on a **Linux** server should not be confused
    with just **http** access. The **Web services** will also include an **FTP** server,
    proxy server, and add-ons such as **Java** servers. Depending on the size and
    complexity of the network you are setting up, you will need one or more of these
    services, perhaps splitting the functionality across a number of servers. A brief
    description of each is needed to understand their interaction.


    +   - A **Web** server will serve pages to the requester using the **HTTP**

    +   - An **FTP** server will transfer data between a remote client and the server
    using the **FTP**.

    +   - A proxy server will act as an intermediate server between a client and other
    networks, typically the **Internet**, to reduce the load on the connection.


    The following sections will show how these are configured on a **Linux** system
    and how they can be accessed by the client.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Remote Access from the Command Line


    While modern GUIs can be used to connect to remote systems, it is often easier
    and quicker to use a command-line utility. The common utilities that can be used
    are `telnet`, `curl`, and `wget`. `telnet` is a network protocol operating on
    port 23 and is a client-server protocol. The origin of `telnet` dates back to
    1969 and was one of the first Internet standards. The security around `telnet`
    is not very great, as it does not encrypt any of the data over the connection
    and sends authentication data over the wire in clear text. The basic command is
    `telnet hostname|IP address`, which will connect to a `telnet` server at the specified
    hostname or IP address.


    The other two utilities, `curl` and `wget`, are similar in that they retrieve
    files using HTTP, HTTPS, and FTP. Curl has more protocols available than `wget`.
    For using `wget` to download a URL, you can use the following code:


    ```

    wget http://www.shell.com

    ```


    The output from this is shown below:


    ```

    $ wget www.shell.com

    --2009-06-22 16:51:43--  http://www.shell.com/

    Resolving www.shell.com... 134.146.83.23

    Connecting to www.shell.com|134.146.83.23|:80... connected.

    HTTP request sent, awaiting response... 200 OK

    Length: 26594 (26K) [text/html]

    Saving to: `index.html.1''


    100%[===================================>] 26,594  86.4K/s in 0.3s


    2009-06-22 16:51:44 (86.4 KB/s) - `index.html.1''

    saved [26594/26594]

    ```


    The utility can be used to download files using FTP with the following format:


    ```

    wget ftp://www.syngress.com/*.jpg

    ```


    For sites that have FTP usernames and passwords, these can be specified in the
    command line, such as `--ftp-user = user`. As the command is not interactive,
    it can be built into scripts to automate the process.


    The other utility, `curl`, can transfer data using a wide range of protocols,
    including `telnet`. It was designed to work without user interaction to facilitate
    its use in scripts. It can be used to include the user authentication, the proxy
    support, and the resumption of data transfers. It is used in a similar method
    to `wget` above. The list of options is far too long to list here, and these can
    be seen using `man curl`. For instance, suppose you want to download the Webpage
    from www.shell.com.'
  merge: -1
  img_proc: true
