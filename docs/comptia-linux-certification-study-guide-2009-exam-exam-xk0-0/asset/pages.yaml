  md: 'budget.xls) that function as extensions. There are four different types of
    files within the Linux environment. The four types of files are regular, links,
    first-in first-out, and sockets.


    +   - **Directories** (also known as *folders*) are sectors of allocated space
    within a filesystem used to group files. This association is performed and maintained
    within a File Allocation Table (FAT). To identify directories, directories are
    assigned a directory name, which is identified by a sequence of alphanumeric and/or
    Unicode character sets. In addition to having names, directories have structures
    that can be flat or hierarchical. In case of hierarchical structures, directories
    can contain subdirectories.


    +   - **Metadata** is forms of data used by the operating system to further characterize
    files and folders. Typically, some form of indexing file is created and used.
    The indexing information can contain the file size, the file date and time stamp,
    sector location, and information pertaining to access permission and device type.
    The type and amount of metadata created and maintained vary among file systems.
    In addition, metadata can also include backup copies of files and folders for
    redundancy purposes. This can even include backup copies of metadata files.


    +   - **Residual data** is a form of data remaining within the filesystem after
    the file, filename, folder, and folder name relationship has been severed. This
    typically occurs after deleting a file or folder. Residual data can vary in size.
    It can be as small as a sector (this is known as *slack space*). *Slack space*
    is any residual data remaining on a disk not currently associated with any particular
    file. It is the space remaining after the last byte of a file and the first byte
    of the next sector.


    For the various different types of filesystems, the storage containers (also known
    as *storage media types*) can reside on many different storage devices. The storage
    devices can house static and dynamic generated data. As a result, different filesystem
    structures exist for the different types of containers. Not all operating systems
    provide support for the various storage containers. The Linux operating system
    supports a vast number of storage media types, as shown in Figure 3.1.


    Listed below are descriptions of each of the storage media types:


    +   - The *hard disk storage media* type, the most common, is used for the storing
