- pgno: 226
  md: 'package manager. Before long, I found myself in a very frustrating place, an
    unfriendly place called "Dependency Hell." I would download an .rpm package and
    issue the rpm -Uvh command, only to discover that I needed one or two or five
    more .rpm packages because the application I wanted to install needed these other
    files to be installed in order to run. I would chase down these other packages,
    only to discover that often I would need additional .rpm packages because the
    dependencies had dependencies. A seemingly simple installation that would eventually
    take minutes to complete actually took an hour or more because I had to hunt down,
    download, and install all of the dependencies. For this reason, I switched to
    a system that used APT as a package manager. APT does its own dependency checking
    and if there are dependencies, it will consult a list of application repositories
    that are scattered around the Internet and automatically download and install
    them along with my desired application. It was like I died and went to Heaven.


    # **Obtaining Information About Packages**


    You may often want to install a package but are not sure what the name of the
    package is. One method of finding these packages is to use `apt-cache`. To search
    for packages you will need to use


    ```

    ```bash

    apt-cache search name

    ```

    ```


    For instance, suppose you want to search for *abiword*, you would execute the
    command `apt-cache search abiword`, with the output shown below:


    ```

