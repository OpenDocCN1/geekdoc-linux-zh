- pgno: 328
  md: '# EXERCISE 10.4: Assuming Administrator Rights


    In this exercise, we’ll escalate your user privileges to administrator level using
    `su`. In a terminal window running under a normal user account, type the following:


    +   1. `cat /etc/shadow` – as a normal user, this is a restricted file.

    +   2. `su`.

    +   3. enter the administrator (root) password.

    +   4. `cat /etc/shadow` – now with your administrative privileges you should
    be able to see the file. Tread carefully, it is important to know when you are
    ready to return to your normal user level.


    # SECURITY APPLICATIONS AND UTILITIES


    In addition to the start management utilities for keeping a Linux system secure,
    there are a number of additional software packages that can be used to keep a
    close eye on your system and network. Each of the following tools are open source
    and available online (except Nessus, see below) through a standard package manager.
    They are all very complex and feature rich, and each is the topic of multiple
    books. For the exam, it is important to know what each tool is used for, although
    additional reading about each will be greatly beneficial to any professional system
    or network administrator.


    > **Exam Warning**

    > These tools are very useful for protecting your systems, but like any power
    tool, they can be misused easily. Be sure you have full authorization – preferably
    in writing – before using them outside of your own test environment. The tools
    that send out test packets are capable of sending information that can cripple
    or reboot some systems, which is a great way to test whether a system is vulnerable
    but could lead to a lot of problems. Please use these tools with care.


    # **nmap**


    Nmap is an open-source network scanning tool. It is invaluable for seeing what
    is attached to your network and can test any attached system for services or open
    network ports and works great for finding unauthorized network devices and services
    and testing firewalls. It can use known differences in replies to different packet
    types to guess what operating system is running'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'on each device and can scan both User Datagram Protocol (UDP) and Trans-

    mmission Control Protocol (TCP) network ports. It can be installed using

    your distributions package management system, or downloaded directly from

    http://nmap.org.


    The advanced features and options available with nmap are well beyond

    the scope of the exam, but the basics are as follows:


    ```

    nmap [Scan Type] [OPTIONS] target

    ```


    A typical use of nmap is


    ```

    nmap -sP 192.168.1.0/24

    ```


    This will quickly use the ping ICMP utility to check for active hosts on

    the entire 192.168.1.1 – 192.168.1.254 subnet.


    Use man nmap or check the extensive documentation on the nmap Web

    site for additional details.


    # EXERCISE 10.5: Using nmap


    In this exercise, we’ll do a quick network scan using nmap. If your sys-

    tem doesn’t have nmap installed already, you should be able to easily add

    it using the standard package manager. If not, you can download it from

    http://nmap.org. In a terminal window, type the following:


    +   1. nmap 127.0.0.1 is an easy place to start; it will scan the machine

    +   you are on.


    +   2. netstat -l will also show ports on your local machine that are in a

    +   “listening” state, for comparison.


    +   3. netstat -r will show the subnet you are attached to; use that

    +   address for the network in the next step. If you are using a typical

    +   home wireless route, there is a good chance your network will be

    +   192.168.1.0. I’ll use that as an example.


    +   4. nmap 192.168.1.0/24 to scan the local network or enter a spe-

    +   cific host address without the “/24” subnet mask bits to scan a single

    +   machine.


    # Wireshark


    Wireshark is a graphical network traffic analyzer built on the text-based

    tc dump utility. Both are open sourced and available through standard

    package managers.


    Wireshark can be used to monitor all network traffic coming in and out of

    an interface on your computer. Note, however, that to optimize performance,'
