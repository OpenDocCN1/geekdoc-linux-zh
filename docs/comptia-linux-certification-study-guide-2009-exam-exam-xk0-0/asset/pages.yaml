- pgno: 173
  md: 'Of the group, `find` is the most flexible. It requires a place to start, and
    what to look for:


    ```

    find /home -name file1

    ```


    It works by doing exactly what you would do – going to the /home directory and
    looking for a file named “file1,” then continuing to look in each subdirectory.
    Computers are much faster at this than their users, but if you have a large file
    system (or start a “/”) it can still take quite a while. Providing the -maxdepth
    option will limit how many levels of directories it will search through – for
    example, `find /home -maxdepth 2 -name "*."` would search for hidden files in
    all users home directories, but not in subdirectories. Note that the quotes aren’t
    necessary when searching for a specific name, but are required for certain combinations
    of wildcards. There are no penalties for using quotes; when in doubt, leave them
    in.


    There are a mind-boggling variety of things that can be searched for file sizes,
    dates, owners, permissions, and more. As with the `ls` command, many of the available
    options are more useful for use in scripts (for backing up files or automatically
    cleaning up temporary directories, for example). One particularly good use for
    `find` is searching for files owned by a particular user whose account you’d like
    to delete. This prevents files from being orphaned, or unexpectedly becoming owned
    by a new user who happens to get the same account ID.


    ```

    find /home -user user_name

    ```


    Although `find` works its way through the given directory structure, `locate`
    is a bit more intelligent and creates a database of file names that it searches
    through. This makes `locate` much faster and more efficient, but it can only find
    information that makes it into the database; so changes since the last automatically
    scheduled database update won’t be found, and it can only search on file names.
    The `slocate` flavor of `locate` works the same way, but adds additional security
    to prevent users from searching through files they don’t have access to. Linux
    systems that use `slocate` generally point the `locate` command to it, so you
    may actually be using `slocate` without realizing it.


    > Note

    > The default openSUSE installation doesn’t include `locate`, but it can be added
    using the standard package manager. With the installation DVD inserted, type the
    following:

    > `sudo zypper install findutils-locate`'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The *whereis* command is intended for searching for commands and files related
    to them – source, binary, configurations, and help files. It doesn''t look in
    user directories at all.


    The *which* command looks through your *path* (see the section entitled "System
    and User Profile and Environment Variables" in Chapter 5, "Configuring the Base
    System" for more information about the *PATH* variable) and will tell you specifically
    what program you will run if you type a given command. If, for example, you have
    a couple different compilers installed on your system, it will tell you exactly
    which one you''ll get if you type *gcc*.


    # File Types


    If you''ll recall the `ls -al` command, you may still be wondering about all those
    different file types that it showed. It is jokingly said that in UNIX "everything
    is a file", now we''ll pull back the covers and see what that really means.


    We''ve already worked with two types of files – regular files (`touch file`) and
    directories (`mkdir testdir`). In addition to these, there are also


    +   - hardlinks

    +   - softlinks

    +   - device files

    +   - named pipes


    A proper understanding of linked files requires a little technical background
    information. In the standard UNIX filesystems, directories contain the names of
    the files that reside in them, and pointers to an inode for each file. The inode
    stores the metadata for each file – the owner, size, access rights, time of last
    modification, and where the data that the file contains is physically located
    on the actual storage device. The extra layer of abstraction provided by the inode
    means that it is possible to have two different names that point to exactly the
    same file information. This is called a "hardlink," and created using the `ln`
    command:


    ```

    ln file_name hard_link_name

    ```


    The hardlink name is just as valid as a name as the original filename, and all
    hard links must be deleted before the space occupied by the file is freed. You
    can use the `ls -l` command to show link information; the second column (between
    the "-rwxrwxrwx" and the owner name) has a number that indicates how many hard
    links point to that same file. The nature of hard links does not permit hard links
    to directories or to files residing on separate drive volumes.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# B A S H Commands 163\n\n> **Note**\n> \n> Although not included in the scope\
    \ of the Linux+ exam, the $stat$ command shows the contents of the inode for a\
    \ given file, and $ls -l$ shows the inode number.\n\nIn contrast to the hard link\
    \ is the symbolic link, or soft link. The soft link is an actual file, with its\
    \ own inode number (rather than a shared one, like a hard link). The file contains\
    \ the path to the object the file links to. As a higher level of association,\
    \ soft links are allowed to point to directories and to files on other file systems;\
    \ but because they are independent files, it is possible to delete the target\
    \ of the soft link and leave the link file “broken,” pointing to a nonexistent\
    \ file. The $ls -l$ command shows symbolic links, with an “$l$” at the very first\
    \ position in the row and with an arrow ($\\rightarrow$) pointing to the target\
    \ file. Symbolic links are created with the same $ln$ command, but with the “$-s$”\
    \ option:\n\n```\nln -s file_name soft_link_name\n```\n\nFor more information\
    \ about links, check out the Linux Information Project page at www.linl.org/hard_link.html.\n\
    \n# Device Files\n\nAnything capable of moving information in or out of your Linux\
    \ system has a device file in the /dev subdirectory. These files are the user\
    \ accessible side of the device files, covered in “Device Management” section\
    \ in Chapter 5. This way of thinking of devices makes it easy for user programs\
    \ to send or receive information; they only need to write (or read) from the appropriate\
    \ file. For an example of just how easy it is, try this:\n\n```\nls -al /etc >\
    \ /dev/audio\n```\n\nMake sure your speakers are turned down; it isn’t exactly\
    \ Beethoven.\n\nThere are a number of types of files, but the most common (and\
    \ the ones covered on the exam) are the following:\n\n+   - $l$ symbolic link\n\
    +   - $d$ directory\n+   - $-$ normal files\n\nThese are all file types we’ve\
    \ already seen, plus these “special” file types:\n\n+   - $c$ character special\
    \ file\n+   - $b$ block special file\n+   - $p$ named pipe"
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_176_0.png)


    The first character in the above list corresponds to the first character on each
    line of output from the `1s -1` command, as in Figure 6.5. Notice that while symbolic
    links have their own file type, hard links show up as regular files, and are only
    distinguished by the number in the column between the access rights and the owner
    being greater than 1.


    The block special device files are used to move data in and out of hard-ware connected
    to the system in large chunks, and use buffers to improve efficiency. Examples
    of block files include the systems SCSI, IDE and other hard drives, USB, CD, DVD,
    and tape drives (the mount command will show which drive corresponds to what device
    file). Character devices files are used to move data a single character at a time
    and are unbuffered, examples include modems, terminals, and other serial devices.
    Note that not every file in the /dev directory corresponds to a currently connected
    device; most are simply placeholders waiting for a new device to point to.


    Named pipes first-in-first-out (FIFO) are buffers that are used for communications
    between programs running within the computer. One program opens the pipe to write,
    and the other to read, and data gets transferred between them.


    Special files are created using the `mknod` command:


    +   *   `mknod new_file_name c [major_device_number] [minor_device_number]` -
    makes character files

    +   *   `mknod new_file_name b [major_device_number] [minor_device_number]` -
    makes block files

    +   *   `mknod new_pipe_name p` - makes pipe (FIFO) files'
