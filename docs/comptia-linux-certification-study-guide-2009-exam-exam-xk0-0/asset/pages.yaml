    # **apropos**


    What if you aren''t sure what command you want? You can use *apropos* to search
    through the descriptions of each man page to help find what you want. For example,
    if you are searching for a file on your computer and can''t remember what command
    to use, try `apropos search` to see all the man-ual page entries that have *search*
    in their description. You can also send *apropos* wildcards, use regular expressions,
    and limit it to specific sections; go to *man apropos* for details. Note that
    *apropos <keyword>* and *man -k <keyword>* do the same thing.


    # **whatis**


    If you have a command but aren''t sure what it does, you can use the *whatis*
    command to print out just the one-line description from the commands man page.
    Try `whatis ls`.


    Behind the scenes, *apropos* and *whatis* don''t actually check every man page
    entry; they scan through a database that gets created by the *mandb* program,
    which is run regularly in the background by a *cron* job to keep things current.


    # **makewhatis**


    The database created by *mandb* may be handled by *makewhatis* on some distributions.'
