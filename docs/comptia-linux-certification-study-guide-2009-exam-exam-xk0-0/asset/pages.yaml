    \ older Microsoft Windows .ini files, comprising a number of sections with a section\
    \ name in brackets ([ ]) delimiting the sections. The sections will contain information\
    \ about the shares, printers, and services on the server. The correct terminology\
    \ for the sections within Samba is stanza. There is one special stanza called\
    \ global, which specifies parameters that apply to all other stanzas in the smb.conf\
    \ file. A very minimal smb.conf file can be defined that just defines a couple\
    \ of global parameters and some shares:\n\n```\n[global]\n   workgroup = mycorp\n\
    \   netbios_name = computer_name\n\n[share1]\n   path = /etc\n   comment = share\
    \ the /etc folder to the world\n\n[share2]\n   path = /documents\n   comment =\
    \ share the global documents folder to the world\n```\n\nIf you are setting up\
