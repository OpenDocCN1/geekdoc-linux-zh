- pgno: 332
  md: '# Snort


    Snort is a Network Intrusion Detection System (NIDS) and is similar to Wireshark,
    it monitors traffic on a network interface. The big difference is that Wireshark
    is meant for you to watch traffic yourself; Snort watches the traffic for you.
    Snort lets you set a list of traffic you might find interesting or you can download
    lists of known signatures of traffic you probably want to know about (like viruses
    and other nasty stuff). If an interesting packet wanders by, Snort can send out
    an alert so you can then investigate further.


    Snort can be considered a complementary program to Nessus. Where Nessus sends
    packets out checking for possible vulnerabilities, Snort quietly listens for someone
    trying to abuse them.


    For further information, refer to Snort Intrusion Detection and Prevention Toolkit,
    ISBN: 978-1-59749-099-3, Syngress or to check, go to www.snort.org.


    # Tripwire


    Tripwire is a Host-based Network Intrusion System and is the only non-network
    utility in this list. When first installed, it takes a digital “thumbprint” of
    key files (more details are given in the next section) and occasionally checks
    to make sure they haven’t been tampered with. Tripwire is available as an open-source
    project or can be purchased as a product from www.tripwire.com.


    # CHECKSUM AND FILE VERIFICATION UTILITIES


    One particularly complex security problem involves being able to trust that files
    you rely on don’t have any errors and haven’t been tampered with. Checking for
    errors isn’t terribly difficult and happens to every TCP packet as it passes through
    every router; the router “adds up” the bits, and if they match the total that
    the sending device claims it did, everything is assumed to be OK. If not, the
    packet is thrown out and a new one is requested. At the networking level, the
    calculations are fast and easy, and although it’s possible that a random error
    could occur that makes the bits still calculate to the same amount, it’s not very
    likely.


    When it comes to security, though, it requires protection against possible malicious
    intent, not just random errors, so the calculations involved are much more complex.
    A number of methods are currently used to certify that files haven’t been tampered
    with; three are discussed below.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# md5sum


    The `md5sum` uses the MD5 (message digest algorithm number 5) to calculate a checksum
    for a downloaded file, which is then compared with a checksum supplied by the
    files creator. The syntax is


    ```

    md5sum [OPTION] [file]

    ```


    It is typically used without any options and spits out the 128 bit hexadecimal
    checksum. You can then compare your locally computed number with a provided, known
    good checksum to ensure you have a good copy. Alternately, you can use the `-c`
    or `--check` option to feed it a list of checksums and filenames, and it will
    confirm if everything is OK.


    Unfortunately, recently, it has been demonstrated that the *md5* algorithm has
    problems,\( ^{6} \) so it doesn’t have the same guarantee it once had.


    For more information about the *md5* algorithm (including the code) see rfc1321.


    # EXERCISE 10.6: Comparing File Checksums


    In this exercise, we’ll use `md5sum` to compare checksums of a file. In a terminal
    window, type the following:


    +   1. `md5sum /etc/hosts` to generate an md5 hash of your hosts file.

    +   2. `cp /etc/hosts` to put a copy of the hosts file in your current directory.

    +   3. `md5sum hosts` to generate a hash of the copied version of the file – they
    should match.

    +   4. `md5sum hosts > hosts.md5` to create a file that has both the hash and
    the file name.

    +   5. `md5sum -c hosts.md5` will look for the file name in the file in the current
    directory and compare the hash in the file with one it recomputes on the file
    it finds, and will return “ok” if they match. Frequently, programs will include
    both the hash value for a manual comparison and a file to do an automatic check.
    Note that the file can have many lines of hashes and files; it’s an easy way to
    compare a lot of them in one go.


    # sha1sum


    The `sha1sum` command is the same as `md5sum`, but uses a different algorithm
    and a longer checksum value (160 bits instead of 128). Other than that it is used
    in the same way


    ```

    sha1sum [OPTION] [file]

    ```'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'The shasum command implements SHA-1, one of a family of Secure Hash algorithms,
    as defined by the NIST FIPS-180-2 standard. Linux also supports variations of
    the SHA-2 algorithm (sha224sum, sha256sum, sha384sum, and sha512sum).


    So far, the SHA family of algorithms is still secure, but there are indications
    that it may be breakable.7


    # **gpg**


    Another option for protecting files is gpg – the Gnu Privacy Guard. It uses an
    open implementation of pretty good privacy (PGP) to encrypt and/or sign files
    using public/private key pairs. Although it is normally used for signing and encrypting
    e-mail to make sure it hasn''t been read or changed, it can also be used to sign
    files. It works like this:


    +   - The sender of a file creates a public/private key pair, maintaining the
    private key secret and sharing the public key with anyone who will need to decrypt
    or verify information from him. The key generation process only has to be done
    once. Sharing the key can be done in-person or using a key-escrow service.

    +   - The recipient of the file obtains the senders public key and imports it
    into his system.

    +   - When the recipient gets a file, he uses the sender''s stored public key
    to decrypt or just authenticate the file.


    There are a bewildering number of options for the gpg command, but to do a simple
    file verification use


    ```

    gpg -verify filename

    ```


    For further information, review the man pages for gpg.


    # IMPLEMENTING REMOTE ACCESS


    You''ve dealt with the risks of having everything networked; now, we''ll review
    how to securely leverage the benefits.


    Originally, UNIX systems were created in an environment where people trusted each
    other. This has obviously changed. The original utilities used to communicate
    between systems, like telnet, generally sent information without bothering to
    encrypt it in any way, even passwords.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# ## SSH


    While `telnet` is still available on modern Linux systems, the preferred method
    for accessing a command shell on a remote system is with SSH, the Secure Shell.
    It is nearly as easy to use for basic shell access, is very secure, and offers
    several very cool extra features. There are two parts to `ssh`: the `ssh` client
    you use to connect to a remote system and the `sshd` "daemon" that runs on the
    remote side.


    The syntax for `ssh` are as follows:


    ```

    ```

    ssh [OPTIONS] [username@]hostname [command]

    ```

    ```


    The list of options is truly bewildering, but for basic connectivity, all that
    is required to connect to server1 is to type


    ```

    ```

    ssh server1

    ```

    ```


    This abbreviated format assumes you want to use the same username on the remote
    system as you are using on the local one. The passwords don''t have to match.
    To login to the remote system with a different username, you can either use the
    `-l username` option or type the username in front of the hostname, with an `@`
    between them, like this


    ```

    ```

    ssh bob@server1

    ```

    ```


    The first time `ssh` is used to connect to a remote host, the new hosts signature
    is shown, and `ssh` asks if you''d like to add the signature to your list of known
    hosts.


    # ### Secure tunnels


    One of the more interesting capabilities of `ssh` is to catch traffic going to
    a local TCP port, pass it through its own encrypted connection, and hand it off
    to a TCP port on the remote side. With this feature, it is possible to protect
    normally unencrypted network traffic. This is called forwarding or tunneling.


    To create a tunnel, you need to know the TCP port of the service on the remote
    server that you want to tunnel to and pick a random unused TCP port on your local
    service. The syntax looks like this


    ```

    ```

    ssh -Llocal_tcp_port:localhost:remote_tcp_port remote_host_name

    ```

    ```


    An example of this is shown in the book *Next Generation SSH2 Implementation:
    Securing Data in Motion*, ISBN: 978-1-59749-283-6, Snyress,\[note]\[note] to forward
    SMTP traffic between your local e-mail client and your Simple Mail Transfer Protocol
    (SMTP) mail server http://my_mail_server.com using a randomly chosen local TCP
    port of 4444, and for the standard SMTP TCP port of 25, you would do this'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'ssh -L4444:localhost:25 my_mail_server.com


    The final step is to tell your e-mail program that SMTP is now available on port
    4444 at localhost [configuration varies depending on your choice of e-mail program].
    As long as your ssh session is logged in, you have encrypted e-mail between you
    and your server.


    # ### SFTP


    Another handy feature is the ability to transfer files through ssh connections.
    Like telnet, the old standby of file transfer, file transport protocol [FTP],
    doesn''t use any encryption, so using ssh represents a big improvement to security.
    Rather than using the actual ssh command, sending files can be done using sftp,
    which can be used interactively. Once you log in to the remote system, you can
    then use sftp commands to send and receive files. The syntax to get connected
    in this way is the same as regular ssh


    ```

    ```

    sftp [username@]hostname

    ```

    ```


    Once connected, you can use a number of commands that are similar to both standard
    BASH commands and traditional FTP commands, including


    +   - `cd path` – to change the remote directory.

    +   - `df -h` – to show information about the remote file system, including the
    remaining space [in “human readable” format].

    +   - `lcd path` – to change the local directory.

    +   - `ls` – to view the contents of the remote directory.

    +   - `lls` – to view the path of the local directory.

    +   - `lpwd` – to see the local working directory.

    +   - `put` – to copy a file from the local to the remote machine.

    +   - `get` – to copy a file from the remote machine to the local.

    +   - `bye` or `quit` – to exit sftp.


    Note that sftp can also be used to download files noninteractively in “batch mode”
    by giving it the file information all at once, like this


    ```

    ```

    sftp [username@]hostname[:filename]

    ```

    ```


    Unless an option automatic authentication method has been set up, the batch mode
    will still require a password to be entered manually.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# **EXERCISE 10.7: Using `sftp`**


    In this exercise, we''ll test out copying files using `sftp`. You''ll need either
    another system running `ssh` or you can run it on your local machine. It may be
    necessary to modify any firewall you are running and start the `ssh` service on
    your local machine. On SuSE, you can click your way through YAST or type in `sudo
    /etc/init.d/sshd start` to start the service. Then, type the following in a terminal
    window:


    +   1. `mkdir sftp_test` to make a test directory.

    +   2. `ls -al /etc > test_file` to create a test file.

    +   3. `sftp localhost` – to connect to your own machine, as the user you are
    currently logged in as. Enter “yes” to add the RSA “fingerprint” and log in using
    your password.

    +   4. `?` will show a list of commands. They should be familiar – the commands
    are similar to what you use in a regular terminal session. Note that because you
    are logged into your own machine, both the “local” and “remote” are the same file
    system. Use `lpwd` to see your “local” directory – which will be the directory
    you were in when you started `sftp` – and `pwd` to see the remote directory, which
    will be your home directory for the user you logged into `sftp` with.

    +   5. `lcd sftp_test` to change directories to your “local” test directory.

    +   6. `put test_file` to copy your test file up to the “remote” end.

    +   7. `ls` to show that your file was copied.

    +   8. `exit` to leave `sftp`.

    +   9. `ls` to check whether your `test_file` was copied to your home directory.


    # **X11 forwarding**


    A third nifty feature of `ssh` that is sure to please all of you that are getting
    tired of using the command line is `X11 forwarding`. If you’ll recall from the
    section on X11 in Chapter 8, “Installing, Configuring as a Workstation,” the Linux
    graphic interface is actually made of two parts, counter-intuitively called the
    client, which runs on the back end, and the server, which draws all the graphics
    you see. `X11 forwarding` is essentially the same as the TCP port forwarding discussed
    earlier, but it is much easier to use. It allows you to connect your local `X11`
    server to the remote `X11` client, such that'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'a program running on the far end draws a graphic interface on your local screen,
    using just an ssh session. To test it, log into a remote host with ssh or ssh
    -X if X11 forwarding is not enabled – the default behavior on many distributions
    – and execute a program that has a graphic interface; xeyes is a good program
    to use for testing. You may want to add an & at the end of the command to run
    it in the background, so it doesn’t tie up your session.


    # Keygen


    The ssh-keygen command is used to create a public/private key pair, just like
    gpg uses (as discussed previously). Once the public key is placed on the remote
    host, ssh uses the keys to authenticate your login, and passwords are no longer
    required. The steps are as follows:


    +   1. use ssh-keygen to create a key pair.

    +   2. Copy the public key from your local user home directory .ssh/id_rsa.pub
    to the remote user home directory .ssh/authorized_keys.

    +   3. ssh checks for matching keys when logging in, and if they are found, it
    doesn’t ask for a password.


    Once the keys are in place, ssh can be configured to require public/private keys
    to log in remotely, which makes for a very secure system, as long as your keys
    remain safe and don’t get lost.


    # VNC


    Virtual Network Computing (VNC) is a graphical remote desktop application that
    can be used as an alternative to ssh. It is also open source, although there are
    for-pay options as well. Like ssh, there is a client (viewer) and server component.
    One of the handy features of VNC is that it works on lots of different systems,
    including Windows, Apple OSX, and Linux as both a client or a server. The client
    can also be used as a Java Web browser plug-in, and there are clients available
    for several smart phones, so you can remotely access your computer on your cell
    phone.


    UNIX-based versions of VNC work with X11 and support the option of either sharing
    an existing X11 desktop or running independently, so multiple users can each have
    their own remote session. The default VNC connections run on TCP ports 5900–5903
    for sessions numbered 0–3, although this can be changed in the VNC configuration.
    Standard VNC has rather weak security, so it is generally recommended to use a
    VPN or tunnel it through ssh if you are using it over the open Internet.'
