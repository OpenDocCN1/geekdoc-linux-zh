- pgno: 117
  md: '# EXERCISE 4.2: Changing to the Single User Mode (runlevel 1)


    For this exercise, you will change from your current runlevel to single user mode
    (runlevel 1). This runlevel allows you to perform system administration tasks
    without network access/graphic interface functionality. (*Always make sure all
    users are logged off before performing this function.*)


    Perform the following:


    +   1. Login as system administrator [root] by using the switch user command `su`.

    +   2. From the root command prompt, enter `init 1` at the root prompt.

    +   3. Press the **Enter** (Return) key.

    +   4. The system will commence the process of executing stop scripts for your
    current runlevel and then commence executing start scripts for single user mode
    (runlevel 1).

    +   5. Login as the root user.

    +   6. Enter the root user password.

    +   7. Now you can perform various system administrative tasks without impacting
    local or network users.


    # TROUBLESHOOTING BOOT ISSUES


    In life, it would be nice if all things performed as they should. However, within
    the IT profession Murphy’s Law still exists. For the Linux+ exam, the Linux professional
    must be able to troubleshoot and resolve problems that may occur during the Linux
    boot process. This section provides an overview of different options available
    to the Linux professional to resolve Linux booting issues.


    The first option is the `dmesg` command, which is used to send Linux kernel messages
    to a standard output (for example, computer monitor). After the completion of
    GRUB, the bootloader, the Linux kernel is loaded and executed. During this phase,
    the kernel can send messages to the computer monitor representing hardware devices
    detected or if it is able to configure the devices. `dmesg` accomplishes this
    by being able to print or control the kernel ring buffer. For the Linux professional,
    `dmesg` can assist in troubleshooting or obtaining information about system hardware.
    The `dmesg` syntax is as follows:


    ```

    dmesg [ -c ] [ -n level ] [ -s bufsize ]

    ```'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   - The `-c` option clears the kernel ring buffer.


    +   - The `-s` option, which includes buffer size, determines the buffer size
    to query from the kernel ring buffer. The default buffer size is 16,392 by default.


    +   - The `-n` option, which includes the logging level, determines the type of
    messages sent to the computer monitor. When `"-n 1"` is used, only panic messages
    appear on the computer monitor. All other messages are prevented. The `dmesg`
    command will not print or clear the kernel ring buffer when the `-n` option is
    used.


    When entering the `dmesg` without any parameters, the computer monitor will not
    be able to display the entire list of kernel messages sent to the standard output.
    If the messages scroll passed the screen too quickly, you can enter the `dmesg
    | more` command to review the messages one page at a time.


    The second option, *kernel options*, allows you to enter information to be executed
    by the Linux kernel during the booting of your system. The information passed
    to the kernel allows you to control the behavior of your system when it boots
    up. The kernel parameters can be added by editing `/boot/grub/menu.lst` or by
    entering information at the boot prompt. The `/boot/grub/menu.lst` provides the
    default kernel parameters, as shown earlier in Figure 4.4. For the `/boot/grub/menu.lst`
    file, kernel parameters can be added or modified. In addition, fail-safe kernel
    parameters can be predefined that will enable Linux to boot even under problematic
    circumstances.


    To dynamically modify the kernel during the boot process with GRUB, you can enter
    various kernel parameters. The most common kernel parameter is the modification
    of the `runlevel` parameter. Figure 4.9 presents the entering of `runlevel 1`
    into the *Boot Options* field, during system startup to boot the system into the
    single user mode.


    The third option, *rescue system*, starts a specialized Linux kernel without a
    graphical user interface. It can be loaded from various sources and locations.
    The easiest approach is to use the original Linux distribution to boot the system.
    The Linux kernel loaded can be obtained from a CD, DVD, or any bootable device.
    Once the Linux kernel is loaded into RAM, you can modify configuration files,
    check the file system for defects, verify and/or modify the bootloader configuration,
    resize the partition, and a few other critical system modifications that may be
    necessary. Many of the Linux distributions are also available in Live CD form
    (Knoppix, openSUSE LiveCD, Fedora LiveCD) as well. This form allows you to perform
    a system rescue by booting the system and then mounting the disk partitions to
    fix or repair configuration or boot issues.'
  merge: -1
  img_proc: true
