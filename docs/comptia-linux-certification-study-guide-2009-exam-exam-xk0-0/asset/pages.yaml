    # # X Window System Directories


    The current implementation of X, as stated before, is now controlled by the X
    .org foundation. This distribution is commonly called Xorg, and is a sizable piece
    of software – typically over 100 MB, and possibly is double this size.


    > **Note**

    > The X Window system can contain additional clients, an array of icons, as well
    as many games. As the majority will be located in a subdirectory of the /usr directory,
    this may be a problem if you are installing this in an older machine. The disk
    space on modern machines is not usually an issue, but care should be taken if
    you size the partitions yourself.


    The /usr directory and its subdirectories contain the majority of Xorg''s software,
    with the most significant directories being:


    +   - /usr/bin – This contains the X server and the clients that are installed.

    +   - /usr/lib – This is where the software libraries are held in support of the
    X server.

    +   - /usr/include – This has all the included files needed if a new X client
    needs to be developed.

    +   - /usr/lib/X11 – A symbolic link will be found to this directory in /usr/lib.
    It contains the font file, documentation, system, and client resources.

    +   - /usr/lib/modules – This will hold all the drivers for various graphics cards
    used by the X server.

    +   - /usr/X11/man – This is, as you would expect, the man pages for X11.


    When Linux is installed in a computer and the graphical desktop option installed,
    the main components required to run a local X session are loaded. These basic
    components are the X server, basic fonts, a terminal client, and a window manager
    (described in more detail in earlier sections). The main configuration file for
    the X Windows system is the xorg.conf file. The xorg.conf file is typically located
    in /etc/X11/xorg.conf, although this does vary across some Linux distros. In early
    versions of X, this file had to be edited and manipulated manually, especially
    for unusual input devices and when multiple monitors were in use. This was far
    from ideal, and modern systems with a number of new extensions integrated in the
    X server.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "The xorg.conf file will contain a number of different sections, which will\
    \ provide information on the input devices, monitor layout, file locations, and\
    \ so forth. The main sections are as follows:\n\n+   Files   The location of the\
    \ fonts and colors of the X server.\n\n+   Module   Informs the X server on the\
    \ dynamic modules to load.\n\n+   InputDevice   It defines all the input devices,\
    \ such as the mouse and keyboard that are used in the system.\n\n+   ServerLayout\
    \   It defines the display and defines the screen layouts.\n\n+   Monitor   The\
    \ attributes of the monitor(s) that are attached to the system.\n\n+   Screen\
    \   The attributes of the screen configuration.\n\n+   Device   It defines all\
    \ the graphics cards attached to the system.\n\nThe ServerLayout sections are\
    \ at the highest level, and bind together the input and output devices to be used\
    \ in a session. The output devices will comprise of a number of sections (for\
    \ example, the graphics board and a monitor). All the input and output devices\
    \ are bound together in the Screen section, and these are used in the ServerLayout\
    \ section. While most of the settings for the input and output sections are configured\
    \ automatically, some users may wish to override these (for example, to force\
    \ the monitor to a lower resolution).\n\n> **Exam Warning**\n> \n> The name and\
    \ location of the main configuration files are important to know for the exam.\
    \ In particular, make sure you know the configuration files you need to change\
    \ to configure individual user’s desktop.\n\n# ## Terminal Emulators\n\nWithin\
    \ Linux, there are a number of built-in terminal emulators, often bundled with\
    \ the XDM. The two common ones are gnome-terminal and konsole in GNOME and KDE,\
    \ respectively. These are feature-rich and have a very user-friendly interface,\
    \ although both have a relatively high memory footprint. For everyday tasks, where\
    \ memory is not an issue, these terminal emulators are very good and easy to use,\
    \ and are probably the preferred"
  merge: -1
  img_proc: true
