  md: 'interface for a user. However, for systems that have a smaller amount of random
    access memory (RAM), there is another emulator called xterm, which has a very
    small memory footprint (usually under 1 MB), although the window is smaller and
    the default font is hard to read. The standard xterm emulations are for DEC VTxxx
    and Tektronix 4014 terminals.


    The VTxxx and Tektronix terminals can each have their own window so that a user
    can edit text in one and look at graphics in another. Only one of these windows
    will be considered active at any one time, and this one will accept keyboard input
    and terminal output. The number of options allowed for xterm is very large, which
    will allow the system to correctly emulate the terminal and application running
    in it.


    # ## SUMMARY OF EXAM OBJECTIVES


    In this chapter, you have learned about how to configure a Linux system when it
    is used as a workstation. The two most common aspects of the user experience –
    namely, printing and the GUI (X Windows interface) – were explained, and how these
    can be configured for individual users.


    In spite of the move toward the paperless office, printing letters and other documents
    is still a firm requirement for most users. With the move to digital photography,
    the home user is now often using their printer more than in previous years. The
    setup and use of a printer in Linux is slightly more difficult than in the “plug
    and play” world of Microsoft Windows, but the use of the CUPS interface is now
    making this a much easier task.


    The CUPS interface was shown, and how to add local printers using the interface.
    The management of printers and their queues was demonstrated using the CUPS interface,
    and also how this could be achieved using the command line interface.


    The users’ main interface to the computer is through the GUI, and the number of
    different interfaces that can be used is very large. The standard, underlying
    interface is X Windows, currently at version 11, which is commonly known as X11.
    This can be used and enhanced with many different display managers, the two most
    common ones being GNOME and KDE.


    The main configuration files for X Windows were described, and how to modify these
    for individual users. Specific configuration details were then outlined for the
    GNOME and KDE desktops. The use of multiple or virtual desktops were explained,
    and how these may be different from a user’s experience of a single desktop. The
    configuration of these multiple desktops was explained.'
  merge: -1
  img_proc: true
