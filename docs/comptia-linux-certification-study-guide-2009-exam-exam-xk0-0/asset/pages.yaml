  md: '# # Boating Linux


    **Exam objectives in this chapter**


    +   - GRUB

    +   - Runlevels

    +   - Troubleshooting Boot Issues


    # ## UNIQUE TERMS AND DEFINITIONS


    - **GRAnd Unified Bootloader (GRUB)** An application used on most modern versions
    of the Linux operating system. It is a dynamically configurable program used to
    perform a sequence of events on a computer to load the main operating system.
    It receives control from the system BIOS, performs a sequence of events, and then
    transfers control to the operating systems kernel.


    - **Runlevel** A specialized script that starts a different set of services, permitting
    multiple configurations in the same system.


    - **Kernel** The core operational code of an operating system. In Linux, it integrates
    the CPU architecture and supports the loading of modules and instructions to implement
    all operating system services (for example, process management, concurrency, and
    memory management).'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# INTRODUCTION


    The Linux+ certified professional needs to have a good understanding of the overall
    Linux boot process. This knowledge is required to successfully install the Linux
    operating system, modify boot configurations, execute different runlevels, and
    troubleshoot boot issues. The Linux boot process, more complex than most operating
    systems, is based on four stages. The four stages are powering-up your system,
    loading and executing GRAnd Unified Boot-loader (GRUB), loading and executing
    the Linux kernel, and loading the root. Figure 4.1 presents the four stages. For
    the Linux+ exam, this diagram can assist you in understanding how the Linux boot
    process works.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_104_0.png)


    **FIGURE 4.1** *Linux boot process model.*'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'The first stage, *"powering-up your system,"* commences with the applying of
    electrical power to your targeted system. This normally entails pushing in the
    **power on/off** button. This process starts the initiation of the system BIOS.
    The system BIOS performs three different subtasks. The first subtask, *power-up
    self test* (known as POST), identifies, tests, and initializes critical system
    components such as the hard and floppy disk drives, random access memory (RAM),
    keyboard, video display card, and other hardware. The system BIOS, in addition,
    loads the system date and time.


    # Exam Warning


    For the Linux+ exam, the Linux booting process is based on the intel x86 CPU architecture.
    Linux also supports the booting of other CPU hardware architectures (for example,
    AMD, Alpha, ARM, IA-64, m68k, MIPS, PA-RISC, PowerPC, S/390, SPARC), but the booting
    processes are different.


    The second subtask, *boot device selection*, determines what device will be used
    to boot the operating system. For this subtask, system BIOS is able to select
    from various devices for booting (for example, floppy disk drive, hard disk drive,
    CD/DVD drive) the Linux operating system. The system BIOS selects the first drive
    and loads the disk geometry characteristics (for example, cylinders, heads, and
    sectors).


    In the third subtask, *boot sector loading*, the system BIOS reads the first sector
    of the boot device. This sector is 512 bytes in size. For a hard disk drive, this
    special sector is known as the *master boot record* [MBR]. This sector contains
    the Linux bootloading program. The Linux operating system functions with various
    boot loaders (for example, LILO, GRUB, NTLOADER), openSUSE uses the GRUB program.
    The system BIOS loads GRUB into memory and executes the program. The system control
    is now transferred to the boot loader.


    The second stage, "GRUB bootloader," performs two subtasks. For the first subtask,
    GRUB loads the Linux kernel (vmlinuz-version.gz). For the second subtask, GRUB
    creates and loads a virtual file system in system memory [RAM]. This virtual file
    system is called the *initial ramdisk* [initrd]. The initrd image contains various
    programs that are used to perform several tasks. This includes the *"init"* program
    and the necessary hardware drivers the Linux kernel will need to access storage
    drives. The ini program contained in the initrd file is a bash script that loads
    the needed kernel modules.


    The third stage uses the Linux kernel to execute the ini program. The Linux kernel
    is an architecture designed to function dynamically. It supports'
  merge: -1
  img_proc: true
- pgno: 106
  md: '**Table 4.1 Dual Roles of init Command**


    | Existing Linux init Role | New Installation init Role |

    | :--- | :--- |

    | 1. Loading the source containing the Linux distribution installation medium
    for installation | 1. System drivers loading for Linux kernel |

    | 2. Hardware scanning and selecting of hardware drivers | 2. Creating special
    system files for the kernel |

    | 3. Loading the installation system or rescue system | 3. Managing redundant
    array of inexpensive disks (RAID) and Logical Volume Manager (LVM) setups |

    | 4. Linux installation package and system configuration tool | 4. Managing network
    configuration |


    the loading of modules and instructions to implement all operating system services
    [for example, process management, concurrency, and memory management]. The Linux
    kernel integrates the CPU architecture through a series of device drivers and
    kernel extensions. The init program will perform one of two different options,
    as shown in Table 4.1. The first option is the execution of a preinstalled (existing)
    copy of the Linux operating system. The second option is for a new installation
    of the Linux operating system.


    More details about the `init` command will be provided later in the “Installing
    GRUB and Booting Linux” section. Regardless of which approach init takes, the
    init program mounts a mass storage device to obtain access to the root filesystem.
    Before granting access, the init program performs error checking. After the error
    checking process, the init program removes the virtual disk file system (initrd)
    from the memory.


    The fourth stage, “loading the root filesystem,” is the final stage. During this
    stage, the Linux kernel will use the init program to load and grant access to
    the actual root filesystem. This entails making sure the Linux kernel has access
    to the necessary hardware device drivers and the execution of any specific instructions
    for starting the Linux operating system (known as *run-levels*). More details
    about runlevels will be provided later in the “Runlevels” section. To perform
    this task, while making sure the Linux kernel has access, the original init program
    will execute a new init program that resides on a mounted hard drive. This new
    “`init`” program will load the Linux Login screen, as shown in Figure 4.2.


    The four stages provide an overview of the Linux booting process for the Linux+
    certified professional. The remaining focus of the chapter is on GRUB, runlevels,
    and troubleshooting boot issues.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_107_0.png)


    # ## GRUB


    Mentioned during the second stage, GRUB used for starting modern Linux operating
    systems, is the first program on any storage device that the computer executes.
    Before the bootloader, the system BIOS performed all operations on the system.
    The purpose of the bootloader program is to perform a sequence of events on your
    computer to load the main operating system. In essence, the bootloader receives
    control from the system BIOS process, performs a sequence of events, and then
    transfers control to the operating system kernel.


    Most modern bootloaders are dynamically configurable and can be executed during
    the booting of the system and after the system has been booted. The bootloader
    can load predefined configuration files during startup or can support boot-time
    changes (for example, selecting different kernels, virtual file systems) through
    a boot command line prompt. In addition, the boot-loader application can make
    modifications to boot-time configuration files and test the files before using
    them after control has been transferred to the operating system kernel.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "GRUB supports both forms of use. This section presents GRUB in both forms.\
    \ The first form is the use of GRUB to boot a Linux operating system. The second\
    \ form is the use of GRUB to test and make modifications after system control\
    \ has been transferred to the operating system kernel.\n\n# ## Installing GRUB\
    \ and Booting Linux\n\nBefore the execution of GRUB, the system BIOS loads into\
    \ memory the MBR and executes its contents. The total size of the MBR is 512 bytes.\
    \ Most MBRs contain the bootloader program and disk partitioning information.\
    \ Within the Linux environment, the preinstallation form of the GRUB program is\
    \ divided into two stages. The MBR loads GRUB stage 1. The GRUB stage 1 program\
    \ utilizes the first 446 bytes. The remaining 64 bytes are allocated to the partition\
    \ table for the partitioning of the hard disk drives (for example, primary partitioning).\
    \ The purpose of GRUB stage 1 is to find and load GRUB stage 2, which may reside\
    \ physically elsewhere on the hard disk. To access the GRUB stage 2 program, GRUB\
    \ stage 1 must be flexible enough to access many different file system types (for\
    \ example, ext2, ext3, ReiserFS, and FAT). This also includes the ISO 9660 file\
    \ system used for CDs or DVDs. This is accomplished because GRUB stage 1 has loaded\
    \ a large number of mass storage device drivers. Once loaded, GRUB stage 2 can\
    \ perform the following three different functions:\n\n+   - It can load a predefined\
    \ Linux kernel (for example, vmlinuz-version.gz).\n\n+   - It can allow you to\
    \ select which operating system to boot, if the computer was configured to boot\
    \ multiple operating systems (for example, Windows, Linux).\n\n+   - It can prompt\
    \ you to enter different boot parameters.\n\nOnce GRUB stage 2 has loaded the\
    \ Linux kernel (for example, vmlinuz-version.gz), it must also load a virtual\
    \ file system and execute the Linux kernel.\n\n> **Note**\n> \n> Some Linux distributions\
    \ will use GRUB stage 1 to either load GRUB stage 2 directly or load a GRUB stage\
    \ 1.5 application. If a GRUB stage 1.5 application is implemented into the boot\
    \ process architecture, it is typically located in the first 30 KB of the hard\
    \ disk immediately following the MBR. Once GRUB stage 1.5 is loaded, it will load\
    \ GRUB stage 2."
  merge: -1
  img_proc: true
- pgno: 109
  md: "# GRUB Configuration Files and Commands\n\nGRUB is a dynamically configurable\
    \ bootloadeer application. This allows you to make postinstallaton changes to\
    \ your system for ensuring a successful boot-up process if device changes or Linux\
    \ kernel modifications are required. To make changes to your system, the GRUB\
    \ application allows you to make the alterations to three important configuration\
    \ files.\n\nThe first file, /etc/grub.conf, contains information about the disk\
    \ partition used to find and load GRUB stage2, as shown in Figure 4.3. This file\
    \ instructs GRUB stage 1 where to look for the GRUB stage 2 image (/boot/grub/stage2)\
    \ for loading.\n\nIn Figure 4.3, GRUB stage 1 will automatically install the GRUB\
    \ stage 2 image located on the second partition of the first hard drive to the\
    \ same partition and same drive. In addition, the configuration file instructs\
    \ GRUB stage 1 to ignore any faulty logical block addressing issues by forcing\
    \ the GRUB stage 2 installation process to continue. The GRUB configuration file\
    \ location can vary across different Linux systems.\n\nThe second file, /boot/grub/menu.lst,\
    \ functions as the GRUB Boot Menu. It contains content about the partitions and\
    \ operating systems that can be booted, loading of different kernels, establishing\
    \ of a different default kernel, and various other boot option modifications,\
    \ as shown in Figure 4.4. The “Troubleshooting Boot Issues” section, presented\
    \ later in this chapter, provides GRUB prompt procedures for entering commands\
    \ that can be issued to dynamically modify the Linux kernel loading and runlevel\
    \ processes.\n\nThe /boot/grub/menu.lst file options used for modifying and/or\
    \ selecting a different kernel and various other bootloading functions are presented\
    \ in Table 4.2.\n\nThe final configuration file, /boot/grub/device.map, is a unique\
    \ file that maps the Linux device names to the GRUB/BIOS device naming conventions.\
    \ Figure 4.5 presents the device.map file naming conventions for Integrated Drive\
    \ Electronics (IDE) devices.\n\n```\n```bash\n[linux-01vc:/etc # cat grub.conf]\n\
    \    setup --stage2=/boot/grub/stage2 --force-lba  (hd0,1)  (hd0,1)\n    quit\n\
    [linux-01vc:/etc # _]\n```\n```\n\n![](img/95b3ebd6248b36778ccf73988aaab2f2_109_0.png)"
  merge: -1
  img_proc: true
