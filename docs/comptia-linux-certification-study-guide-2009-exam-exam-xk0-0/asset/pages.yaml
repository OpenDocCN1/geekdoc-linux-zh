- pgno: 327
  md: '# /etc/sudoers


    You wouldn''t want to give just anyone the awesome power of `super` user. Only
    users who are listed in the /etc/sudoers file can use privilege escalation. It
    also provides a number of options.


    Although the /etc/sudoers file is just another text file, it is recommended that
    you use `visudo` as root to make any changes. This opens the sudoers file in `vi`
    and protects it from simultaneous edits, similar to `vi`pw. It also does a sanity
    check on the file before saving to ensure syntax is correct.


    The options are typically described in commented sections within the file (see
    Figure 10.6) and include limits to what files each user can run, as well as the
    very bad option of allowing users to assume administrator privileges without a
    password.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_327_0.png)


    # FIGURE 10.6


    A typical example of /etc/sudoers.'
