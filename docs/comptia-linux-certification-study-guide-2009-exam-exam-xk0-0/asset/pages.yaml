  md: "The variable can also be set using the `tset` command, which is often used\
    \ in the login script for a user to allow them to choose the type of terminal\
    \ they are logging in from.\n\n# PAGER\n\nThe `PAGER` variable controls the output\
    \ to the screen, such as the `man` command. This allows the display of the output\
    \ in a controlled manner. The typical values for `PAGER` are `more` and `less`.\
    \ While these are similar, `less` has additional features (such as scroll backwards\
    \ with the b key) and hence is the preferable value to use as a default.\n\n#\
    \ HOME\n\nThe `HOME` variable is set whenever you login to the system and will\
    \ be set to /home/username (where username is your login name). This should not\
    \ be changed, as a lot of programs use this to create or find files in your personal\
    \ home directory. In addition, the shortcut `~` references the `HOME` variable,\
    \ and will return an erroneous result if this is modified.\n\n# PRINTER\n\nThe\
    \ `PRINTER` variable defines the default printer. If no printer is defined, this\
    \ value will be set to `NULL`. This variable is mainly used for command-line programs\
    \ to print. The setting of the variable does not preclude the need to install\
    \ the printer on the system. The use of the `PRINTER` variable allows the system\
    \ administrator to set up specific printers for users based on their location.\n\
    \n# EXERCISE 5.1: Configuring the User Environment\n\nIn this exercise, you will\
