- pgno: 241
  md: "# Installing, Configuring as a Workstation\n\n**Exam objectives in this chapter**\n\
    \n+   ■ Printing\n+   \n+   ■ X11\n\n# UNIQUE TERMS AND DEFINITIONS\n\n+   ■ **Common\
    \ UNIX printing system (CUPS)** The standards-based, open source printing system\
    \ developed by Apple Inc. for Mac OS X and other UNIX-like operating systems.\n\
    \n+   ■ **X Window System (or simply, X)** An open source suite of software (including\
    \ a network protocol) implements the X display protocol, provides windowing and\
    \ manages keyboard and mouse functions to provide a graphical user interface (GUI)\
    \ for networked computers.\n\n# INTRODUCTION\n\nUsers of any system, be that Linux,\
    \ Microsoft Windows, Apple Mac, or any other system, will want to undertake a\
    \ number of basic tasks: interaction with applications on a monitor (for example,\
    \ word processing, task scheduling) and printing. Without these basics, the normal\
    \ user would be at a loss and the support technicians’ help calls would consume\
    \ all of their time. A standard setup for the user interface and the local (and\
    \ possibly remote) printers"
  merge: -1
  img_proc: true
- pgno: 242
  md: 'will make the users'' experience much more fulfilling as well as reduce the
    support overhead.


    Even with the push for the paperless office, printing is still a major requirement
    for users, either on their home network or in the corporate environment. The installation
    of Linux will typically recognize and install any local printers attached to the
    system. Networked or remote printers will require to be installed after installation.
    Depending on the initial installation options, this may require additional drivers
    to be downloaded. The section on printers will describe how common UNIX printing
    system (CUPS) is configured and its use.


    Most of the latest Linux distributions offer one or more graphical user interfaces
    (GUIs) to interact with the user. These are commonly run on top of the X Windows
    system, with the most common Windows managers being KDE and GNOME. We will look
    at the history of X up to its current incarnation, commonly called. X11 X11. X11
    is a true client-server application, and how this is implemented is described,
    along with descriptions of the main configuration files that are needed.


    # PRINTING


    Although printing is essentially a task that can be accomplished by most of the
    people, most of the time, the management of the devices and the setup can be confusing.
    The majority of printers that can be purchased today will have a Microsoft Windows
    driver available within the OS or have a driver disk in the box. The support for
    Linux drivers varies from manufacturer to manufacturer, and also the open source
    community provides drivers for a large number of printers. However, not all printers
    have a compatible driver, and users should check the availability of drivers before
    the purchase of a new printer.


    Printing within Linux has evolved from the early days when text files could be
    sent to a slow parallel or serial printer connected to a server or local workstation.
    There are many different methods to format the output of a job to make it ready
    for printing, and a number of printer services. CUPS is one such print service
    program that is commonly deployed in a modern Linux distribution.


    # CUPS Overview


    CUPS is developed and maintained by Apple Inc. to provide a standard printing
    solution, and can be deployed across a wide range of platforms. The portability
    of CUPS allows users to print in various environments with the'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'same basic display and/or commands. The CUPS application converts the page
    descriptions from an application into a format that the printer will understand,
    and then manages the process for sending this to the actual printer. Manufacturers
    of printers will develop different methods to print, even within their own line
    of printers. The CUPS application will perform this conversion, hopefully hidden
    from the end user.


    CUPS will create and manage a queue for each printer, either locally or one accessible
    across the network. These queues will look the same, and the actual technicalities
    of where and how to send the data to the printer is handled by CUPS. Every time
    a user prints something, CUPS creates a job and puts it into the queue. This will
    include a job number to allow the user to pause or cancel a job, if required.
    Each of these jobs is assessed by CUPS, which then assigns the best program to
    convert the pages into a printable format before actually printing them. Jobs
    in the queue are normally processed in a first-in/first-out manner, although users
    can move jobs up and down the queue on occasions. Completed jobs are removed from
    the queue by CUPS.


    With newer Linux distributions, CUPS will usually be preinstalled at installation
    time as part of the base system. The most recently updated version of CUPS can
    be downloaded from the CUPS open-source Web site http://cups.org, and is available
    for Linux and Microsoft Windows. In addition, the Web site provides a number of
    printer drivers for a range of common printers. The installation of CUPS will
    be covered in Chapter 9, “Installing, Configuring as a Server,” and the user commands
    will be discussed in this chapter.


    # Enable and Disable Queues


    When CUPS has been installed and one or more printers are set up, each printer
    will have its own queue which it will manage to ensure that jobs are printed in
    a sequential order. These queues can be enabled or disabled, even if there are
    items in the queue. This is often necessary when a printer has a problem that
    needs to be fixed and the system administrator wants to disable the queue until
    the issue is corrected. The following command will disable a queue called CANONMX.


    ```

    ```# cupdisable CANONMX```

    ```


    The printer queue can be enabled using the following command:


    ```

    ```# cupseenable CANONMX```

    ```


    When a system administrator stops a printer, they can also issue a comment to
    tell users why the printer is disabled. This is very useful in larger corporations
    or when the printer is in remote locations.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '232 CHAPTER 8: Installing, Configuring as a Workstation


    ```

    # cupsdisable -r "Printer maintenance being performed" CANONMX

    ```


    # Web Management Port (port 631)


    The interface to CUPS is through a Web interface that allows you to view print
    jobs and what printers are installed, and also allows for the manage- ment of
    these processes. This allows for easier management than using the command-line
    interface. Once CUPS has been set up, it can be accessed through port 631, either
    locally or remotely. Remote access will, of course, have to be set up, and appropriate
    rules are allowed in firewalls or the iptables, if used. On the local machine,
    the interface can be accessed using the URL http://localhost:631 typed into your
    favorite browser. The interface is shown in Figure 8.1. In addition, there is
    a CUPS application program available which does not use a browser, but the look
    and feel is identical.


    There are some pages on the GUI that will require a username and pass- word to
    perform some actions on them, such as to add a printer. On most Linux distributions,
    only root can add, modify, or delete a printer or class of printers.


    # Exam Warning


    You must remember the Port names and names that are used commonly used for the
    exam. The Web interface port is one of the required ports to remember.


    # FIGURE 8.1


    CUPS Interface in a browser.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: "# Managing Printers, Jobs, and Queues\n\nThe CUPS management interface can\
    \ be used to add and delete printers, and this is accessed under the **Administration**\
    \ tab of the GUI. This may require root privileges to run. Local printers can\
    \ be added directly if you know the make and model, or the system can find new\
    \ printers that have been attached to it.\n\nPrinter jobs can be managed through\
    \ two options: directly from the first page in the **Administration** tab, or\
    \ by clicking on **Manage Printers** under the **Administration** tab and managing\
    \ the jobs from there. The management of printers section is very powerful and\
    \ allows the user to\n\n+   print a test page.\n+   \n+   stop/start a printer.\n\
    +   \n+   enable and disable a print queue.\n+   \n+   move jobs from one print\
    \ queue to another.\n+   \n+   cancel all jobs.\n+   \n+   set printer options.\n\
    +   \n+   allow specified users.\n+   \n+   set as default printer.\n\nLater on\
    \ in this chapter (in the “Printing Commands” section), we will look at the command-line\
    \ versions of some of these commands. The CUPS interface is very easy to understand,\
    \ and for the majority of users it is easier to use than the command line. As\
    \ the system administrator can prevent unauthorized users changing certain functions,\
    \ it provides an easy, safe GUI to deploy to users.\n\n# Learn by Example: Adding\
    \ Banners to All-Print Job\n\nOne printer in your work area is used to print confidential\
    \ documents, and you want to make sure that a banner page is printed between each\
    \ job to remind users of this fact. You access the CUP interface on the remote\
    \ server using http://10.10.100.134:631. Click on the **Administration** tab and\
    \ browse to the printer you want to change. Click on **Set Printer Options**,\
    \ entering the superuser name and password when prompted. On the next page, select\
    \ **Confidential** as the starting or ending banner, and then click on **Set Printer\
    \ Options**. You will now get banners between print jobs."
  merge: -1
  img_proc: true
- pgno: 246
  md: '# CUPS Printer Classes


    CUPS allows the user to group printers together, and this collection of printers
    is called a *class*. This is particularly of interest in a company which has a
    number of printers and they can be grouped together in areas, such as finance,
    admin, and so forth. This allows printers to be taken offline for maintenance,
    and the user will not notice any disruption or need to remember the names of different
    printers in their area. The adding and management of printer classes is undertaken
    in the **Administration** tab of the CUPS GUI.


    # EXERCISE 8.1: Testing a Printer Through CUPS


    In this exercise, we will test a printer to ensure that you can print to it.


    +   Initially, go to the printer, and confirm it is switched on and has paper
    in it.


    +   On your system, open up the CUPS GUI in a browser using the URL http://localhost:631,
    and click on the **Administration** tab.


    +   Click on **Manage Printers** and scroll down (if necessary) to the printer
    you are trying to test.


    +   Check the printer state to see if it is idle and accepting jobs. If it is,
    click on **Print Test Page** and see if the printer prints it correctly.


    +   If it does, your printer is set up correctly.


    +   If no page is printed, then check if you are sending the page to the correct
    printer.


    # Printing Commands


    Once a printer has been installed and properly configured, a user is able to print
    to it from any printer-capable graphical client. Text-based interface can also
    print through a simple command-line interface. These basic commands are described
    below.


    # lpr


    The `lpr` command submits print jobs to the specified printer, or the default
    printer if none is specified. The main options that a user will need are shown
    in Table 8.1.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '**Table 8.1** **lpr Printing Options**


    |  |  |

    |---|---|

    | -P *destination* | The name of the printer to send the job to. |

    | -# *number* | Print a specific number of copies (default is 1 copy). |

    | -T *title* | Prints a title on the banner page of the output. |

    | -h | Suppresses printing of the banner page. |

    | -w *cols* | Prints file with pages of a specific width. |

    | -m | Send mail when the job has printed. |

    | *Filename* | The name of the file which you want to print. |


    This command is used with BSD UNIX systems, such as PCBSD, NetBSD or FreeBSD.


    # ### *lp*


    The `lp` command is very similar to the `lpr` command above, but works on System
    V systems. There are a number of differences in the syntax, such as the `-o` parameter
    with `lp` has a number of different options such as *nonbanner*, *cpi=pitch*,
    and *width=chars*. Depending on which system you are working on, you should understand
    the syntax of each command.


    > **Note**

    > With CUPS installed on your system, both of these command line interfaces are
    supplied. This means that a user on the system can use either `lpr` or `lp` to
    print. The advantages of this are that users will not get confused moving from
    one system to another, and scripts that have been written with either of these
    commands will work correctly.


    # ### *lpq*


    When a user wants to see the status of one or more print queues, the `lpq` is
    used. This command can be run once or displayed continuously at a specified interval
    until the queue is empty. The command on its own will display the queue of the
    default printer. The main options for the command are as follows:


    +   * `-a` to show the queue status of all printers

    +   * `-P` to show the status of a specific printer

    +   * `+interval` will display the queue every *interval* seconds until empty'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Table 8.2 lpsstat Options

    - a Displays the queues for all printers.

    - d Displays the default destination.

    - h server Specifies the CUPS server to communicate to.

    - o option Displays the queue on printer.

    - p printer Shows status of printer.

    - r Status of CUPS server.


    # lpsstat


    The `lpsstat` command can show the status of printers and queues like the `lpr`
    command; however, there are far more options, including the options to query the
    status of specific CUPS servers in the network. The options are shown in Table
    8.2. This is useful for system administrators who can administer print servers
    and queues from a central location.


    # cancel


    Users or administrators can cancel jobs still in the queue of a specific printer.
    An individual job can be canceled, or all jobs can be removed (if the user has
    the appropriate rights). The default printer queue will be checked if no specific
    printer is defined.


    # X11


    X11 is the common name for the X Windows system, which is the GUI found on most
    Linux distributions today. The origins of the X Windows system date back to 1984,
    when the protocol was developed by MIT, and the current protocol version [X11]
    appeared in 1987. The current implementation of the standard is overseen by the
    X.org foundation, which came into being in 2004. Apart from Linux distributions,
    it can also be found in Cygwin/X running on Microsoft Windows, Sun Microsystems''
    Solaris, and with the latest version of Mac OS X.


    # Starting and Stopping X11


    There are a number of ways to start and stop the X Windows system. The display
    manager will normally be loaded automatically on boot. This is accomplished by
    setting up the /etc/inittab file to load the X Windows system, when multiuser
    mode is used (run level 5). The actual display manager that'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'will be used is defined in the /etc/sysinit/displaymanager configuration file,
    as shown below for the KDE environment:


    ```

    DISPLAYMANAGER="kdm4"

    ```


    When the Linux system is booted into a multiuser mode without a graphical login
    using the display manager, such as runlevel 3 in the/etc/initab file, you will
    have to start an X session from the command line. The X server and X session must
    be started, and this can be accomplished using startx, often without any parameters.


    The startx command will use configuration settings found in the .xinitrc file,
    which by default will be in/etc/X11/xinit directory; however, the user can customize
    the X session and launch default clients using a .xinitrc file located in their
    home directory. If you intend to use the display manager that was installed with
    your system, you do not need to use a customized .xinitrc file.


    The startx command script can be used to pass parameters such as for color depth,
    whether the display adapter is a multiheaded device, or the resolution [expressed
    in dots per inch (DPI)] of the monitor.


    The startx command itself can be passed with parameters that it passes to the
    X server before an X session is launched. One such parameter is the -depth option,
    which will alter the number of colors used. This can be used during development
    or testing of X clients to ascertain how each will look on different hardware
    solutions. This may be useful if you are planning a large roll out of Linux across
    a variety of differing hardware. This will start an X session a depth of 16.7
    million colors.


    ```

    $ startx -- -depth 24

    ```


    The startx command can also be used to launch multiple X sessions in a number
    of virtual consoles. The complexity of multiple X sessions means that it is not
    an everyday occurrence, and you may wish to be very familiar with X sessions before
    you try this. Each X session then can be closed separately or the system restarted
    in run level 3 as above.


    # Difference between X11 Clients and Server


    The X Window System was developed using a client-server model, which means that
    the two components can be distributed on separate systems. On a typical Linux
    configuration, both these components are located on the same machine; however,
    they communicate through the standard processes. In a client-server application,
    the client software process will initiate a communication session, while the server
    waits for a request from one of its clients. Most people use client-server programs
    on a regular basis without realizing it. For instance, a Web browser is a client
    program that requests data from a Web server.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'In X11, the X server communicates with various client programs. This server
    accepts requests for graphical output (that is, the normal display window on a
    screen) and also accepts user input (from, typically, the keyboard and mouse)
    and sends these back to the client. The server can send out to a display on another
    system, or may control the video output on the local system. Thus, the user''s
    terminal is the server and the applications are the client, which is often the
    cause of confusion for new users as they typically think of a server, from their
    perspective, as an end-user. Their normal perception is that the client runs on
    the user''s computer and the server is remote. In X Window terminology, the server
    provides display and I/O services to the applications. The applications that use
    these services are clients (such as a browser).


    The server and client communication protocols run with a network transparency;
    that is, it is invisible to the applications that are using it. In a workstation
    configuration, these will typically be on the same physical machine. When Linux
    is designated as a server, the clients are often distributed across the network.
    This communication protocol can be tunneled over an encrypted tunnel. X can be
    bandwidth-intensive, so a fast network is desired, particularly if there a lot
    of remote clients.


    # Window Managers


    The X Window manager is the windowing system that runs on X, and the user can
    choose one of many window managers. These Windows managers will have certain requests
    between the client and server redirected through them, such as when a new window
    needs to be displayed. The core X Windows System does not include icons, so these
    are specifically maps by the window manager. The types of window manager are larger,
    and include tiling window managers (such as i3, dwm, and so forth); compositing
    window managers (GNOME and KDE are good common examples); and stacking window
    managers, such as IceWM. There are also virtual window managers, which use virtual
    screens whose overall resolution can be greater than the monitor they are displayed
    on. No one window manager is better than another, as each has its own purpose,
    and which one you will use comes down to personal taste. For the majority of more
    popular distributions (Fedora, OpenSUSE, Ubuntu, and so forth) that are used by
    the general user, either GNOME or KDE will be installed, often with the selection
    available at installation time.


    In general terms, the window manager controls the appearance of the GUI to the
    user. It positions the windows, controls the fonts and colors, and handles the
    input and output (mouse clicks, and so forth). The window manager is just another
    client from the point of view of the X window server. The initial window that
    is displayed is defined as the root window, with top-level windows being children
    of this root window.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# X Session Manager


    The state of the desktop or session at a given time is managed by the X Session
    Manager. This allows, for instance, a user to log out and then log out of a session,
    and to have the same windows displayed. The session manager stores the state of
    all the windows on exit to restore them. While the default session manager *xsmt*
    can be used, specific session managers are often bundled with the display manager,
    such as *ksmserver* in KDE.


    # Display Manager


    The X display manager runs as a program that allows the X server to start a session
    on a system, either local to the server or remotely. The display manager often
    prompts the user for a username and password with an initial login screen, although
    it may be bypassed depending on the setup of the system (usually through KDM’s
    auto login feature). When it is run on a local system, it will start the X server
    before presenting the login screen. In a remote session, the display manager will
    act like a Telnet server, requesting a username and password and starting the
    remote session. The default display manager in X is the X Windows Display Manager(XDM).
    The most popular alternative display managers are explained below. Alternative
    display managers are often used as the default XDM is often more complex to configure
    for the standard user.


    **KDE Display Manager**


    The display manager bundled with KDE is the KDE display manager (KDM). The underlying
    toolkit that KDM is based on is, like KDE, the open source software toolkit Qt.
    It is very configurable from the KDE control center, allowing screen color, menu
    options, styles, and so forth to be configurable. KDM was originally based on
    XDM.


    The main configuration file for KDM is often found in */usr/share/kde4/config/
    kdm*, and is called *kdmrc*. KDM must be run before a user is logged in, so it
    is, therefore, not associated with any user, and hence user-specific configuration
    files are not possible. Users can, however, change the appearance of their desktop
    once they are logged in.


    The graphical login manager within KDM is *the greeting*, which can show a company
    logo, current system time, or perhaps nothing. Some or all users may be allowed
    to shut down the system from this initial screen.


    **GNOME Display Manager**


    GNOME was conceived slightly later than KDE, and again uses open source software.
    The GNOME display manager (GDM) uses *metacity* as a default. Unlike KM, this
    was written entirely from scratch and does not contain any'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'original XDM code. Upon startup, the GDM daemon reads its local config-uration
    file, gdm.conf. When there is more than one local display, each of these forks
    an Xserver and slave process. The initial process will start the display, and
    calls gdmlogin to prompt the user for a username and pass-word. Remote displays
    are managed using the X Display Manager Protocol (XDMP), typically running on
    port 177.


    The configuration file can be found in the file /etc/gdm/gdm.conf, and the syntax
    within the file follows the standard GNOME file syntax. The file contains a large
    number of options for the daemon configuration, security, and remote and local
    GUI. When the system is installed, most of these are set up automatically. The
    look and feel of GDM can be configured by a large number of themes, which are
    available in the main package or downloadable from various sites.


    # Differences between KDM and GDM


    The proponents of GNOME, KDE, or any other similar display managers can be found
    everywhere. At first glance, the differences between GDM and KDM are purely cosmetic
    (colors, whether there is a toolbar at the bottom of the screen or main menu,
    and so forth). Ignoring the base colors (which can easily be changed on either
    system), we will discuss the differences between the two managers. It is often
    said that, overall, a system with KDE installed is more Microsoft Windows-like
    than the one with GNOME.


    GDM has, by default, two toolbars at the top and bottom, and also splits it menu
    into three submenus: Applications, Places, and System. KDM will have only one
    toolbar at the bottom, and its menu will be slit into Favorites, Applications,
    and Computer. In terms of user input, the default for KDM is one click, and two
    in GDM. Also, the system configuration menus are usually more complicated in KDM
    as opposed to GDM.


    You can install both window managers onto a system and switch between them (or
    have them display on different monitors at the same time if you have enough memory
    and computing power). This is undertakes in many ways, with some common distributions
    like Fedora using the `switchdesk` command.


    # Multiple Desktops


    Within the X Windows systems, there is the ability to have more than one desktop.
    Each desktop is known as a virtual desktop within the system, and each can operate
    independently of one another. This concept allows the user to create two or more
    separate environments, where simultaneous tasks can be undertaken. This may involve
    a word processor in one desktop, your'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'e-mail client open in another, and perhaps some scripts running in a terminal
    session in another. The use of virtual desktops allows an uncluttered view of
    the application your need to concentrate on and change to another desktop at the
    click of a button.


    # KDE Virtual Desktop


    There are four virtual desktops installed with KDE as a default, with the option
    to install a total of 36. These are shown on the bottom toolbar, numbers 1 to
    4, as shown in Figure 8.2.


    Moving between desktops is achieved just by clicking on the appropriate number.
    The standard desktop is initially installed on all desktops. To make it easier
    for navigation, these can be renamed using the multiple-desktop control module
    shown in Figure 8.3, with the new toolbar displayed in Figure 8.4.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_253_0.png)


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_253_1.png)'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_254_0.png)


    KDE toolbar showing named virtual desktops.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_254_1.png)


    Default GNOME workspace.


    The toolbar will then appear as shown in Figure 8.4.


    # GNOME Workspaces


    Within the GNOME system, these are called workspaces, and there is a workspace
    switcher application which controls this. You can set different preferences for
    this, including the number of workspaces you want (up to 36). The user can move
    to a different workspace using the applet, or you can move to one by pressing
    Ctrl and scrolling the mouse to highlight the desired workspace. A part of a typical
    GNOME screen showing four numbered workspaces is shown in Figure 8.5. Rather than
    having names such as Desk 1, Desk 2, and so on, you can rename the workspaces
    to more meaningful names – perhaps mail, scripts, Internet, and so forth. Individual
    applications within one desktop can be moved to another desktop or can be made
    visible in all workspaces.


