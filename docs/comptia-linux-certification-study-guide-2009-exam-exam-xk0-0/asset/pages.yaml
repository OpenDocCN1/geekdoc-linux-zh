    +   B. TCP ports 1023 and above are open on the server

    +   C. TCP ports 1022 and below are closed on the server

    +   D. TCP ports 1023 and above are closed on the server


    Correct answer and explanation: **D.** Answer **D** is correct because TCP ports
    1023 and above need to be open to ensure that all the connections required for
    active mode can be established. Incorrect answers and explanations: **A**, **B**,
    and **C.** Answers **A** and **C** are incorrect because active mode FTP uses
    TCP ports 1023 and above are required, not below. Answer **B** is incorrect because
    the connection could be established if the ports were open.'
