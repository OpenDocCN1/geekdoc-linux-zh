  md: '# # MOUNTING AND U(N)MOUNTING FILESYSTEMS


    The mounting and unmounting of a Linux filesystem is another critical skillset
    required for the Linux Professional. Unlike the Microsoft Windows operating system,
    which mounts its filessystems automatically, the Linux operating system allows
    you to manually mount a filesystem or have a filesystem automatically mounted
    when your system initially starts up. So, what is mounting? Mounting is form of
    attaching or joining a separate storage device to your existing root directory
    hierarchy. It makes accessible physically separate disks and/or partitions on
    a local or remote machine available to you. The attached location on the client
    machine is called a *mount point*.


    # ## The mount and umount Commands


    To manually mount a filesystem to your existing root directory structure, the
    connection is established to a local mount point, and the Linux professional needs
    to become very familiar with the Linux *mount* command. The Linux *mount* command
    can be used with and without any arguments. The Linux *mount* command issued with
    no arguments (as a stand-alone command) will list all of the currently mounted
    filesystems on your system, as shown in Figure 3.2.


    The Linux *mount* command, when issued with arguments, typically require only
    two arguments. The first argument represents the storage device that you wish
    to attach to your root directory structure. A unique feature about Linux operating
    systems is its treatment of devices (for example, storage devices, terminals).
    The Linux system treats devices as directories (folders). The */dev* directory
    is used within the Linux environment to mount devices. The second argument represents
    the directory location where you want to attach it underneath. Again, this is
    known as the mount point. The


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_78_0.png)'
