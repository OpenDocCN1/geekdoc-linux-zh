  md: "For Linux distributions that use dpkg, APT natively resolves application dependencies.\
    \ Although APT is a terrific tool from the command line, you are not forced to\
    \ open a terminal window or change runlevels to drop to a command line when working\
    \ in a GUI environment. Aptitude and Synaptic are often installed by default dpkg-based\
    \ systems where X and a window manager are installed. If not, they can be easily\
    \ installed from the command line using APT.\n\n# EXERCISE 7.2: Resolving Dependencies\
    \ Using Yum\n\nYou know that a new version of abword has been released, along\
    \ with a number of new libraries. You do not want to install each of these individually,\
    \ so you decide to use yum to resolve these dependencies.\n\n+   1. To check the\
    \ version of abword and what dependencies are required, you need to type\n+  \
    \ \n+       ```text\n+       yum update abword\n+       ```\n\n+   2. The current\
    \ version of abword will be shown and what dependencies need to be updated and/or\
    \ installed.\n\n+   3. The system will then ask if you want these upgraded and\
    \ installed. Type Y.\n\n+   4. The system will upgrade and install all the software,\
    \ and respond with complete.\n\n+   5. You have now successfully resolved all\
    \ the dependencies for abword and installed everything correctly.\n\n# ADDING\
    \ AND REMOVING REPOSITORIES\n\nThere are thousands of software packages for Linux,\
    \ no matter what distribution you are running. These packages are stored in software\
    \ repositories, and the main repositories for the particular distribution you\
    \ installed are usually set up at that time. If you are not connected to the Internet\
    \ during the initial load of Linux, these may not be set up, or marked as inactive.\n\
    \n# Yum Repositories\n\nSoftware repositories can be defined on remote servers\
    \ as well as locally. The repositories are defined in the/etc/yum.conf file and\
    \ in/etc/yum.repos.d directory. You can make a local repository by downloading\
    \ the software from other"
