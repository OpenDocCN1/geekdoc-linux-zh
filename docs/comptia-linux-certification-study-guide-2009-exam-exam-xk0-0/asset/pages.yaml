    command history by hitting the `\u2191` arrow on the keyboard until you see the
    command you entered in step (1)], and append a pipe character the `grep` command
    so that it reads like this:


    ```

    awk -F:''\{''\print "groupname: "$1",

    group ID:" $3"\}'' /etc/group | grep [username in list]

    ```


