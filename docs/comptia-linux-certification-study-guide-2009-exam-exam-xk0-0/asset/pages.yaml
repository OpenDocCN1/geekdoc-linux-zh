  md: 'in the network. The routers along the network decide where (if anywhere) to
    send the packet; that is, to forward it to one of its interfaces. If the router
    does not find a matching route for the packet, it will be sent to its default
    route (and so on) until the packet reaches its destination. The router has a routing
    table in basically the same format as we saw earlier for the Linux machine, although
    it will be set up in a different manner (unless this is a Linux machine with two
    or more network cards acting as a router!) Routers come in all shapes and sizes,
    from the very small to large and extremely expensive devices located in major
    network switching centers.


    In a local network, the routers are often managed by using the `telnet` command.
    Recently, the use of telnet has waned, as there are a number of security issues
    with the protocol (namely, no encryption involved, so passwords and other data
    is sent in the clear text), and the use of SSH is much more prevalent. Telnet
    is useful as the port it connects on can be specified, so the command can be used
    to log on to many different hosts. This may be particularly useful if you need
    to add a route to a local router that you administer to ensure the connectivity
    is correct. It can also be used to display part of a Web page, for example, or
    at least the initial Hypertext Markup Language [HTML] from that page. This will
    also mean that a Linux system installed on a very small system with few applications,
    and perhaps no GUI, can still be used to test the routing.


    # Learn by Example: Testing Network Connectivity


    Having trouble with the connectivity between my system and a server on the system,
    I systematically diagnosed the problem. First I checked whether the NIC was correctly
    installed and had the routing table setup, and that the system was connected to
    a network using the appropriate network cable. This was achieved by using the
    `ping` command to test the *loopback interface*. Once satisfied this was all working,
    I used the `ping` command again, but using the remote servers IP address. Upon
    correctly responding, I used the remote servers name instead of IP address. Once
    all these tasks are complete and working, it can be assumed that the TCP/IP network
    card and routing is working correctly.


    Earlier in this section, you learned that when a system does not seem to recognize
    a name but works perfectly with IP addresses, then there is an issue with the
    name resolution. First, if possible, discover if it is a global issue with all
    your machines on the network by utilizing the `ping <servername>` command on another
    machine. If this works, then the problem is with your machine setup. If you do
    not have any other machines to test this on, try a few different names – and make
    sure you type the name in correctly! Check'
  merge: -1
  img_proc: true
