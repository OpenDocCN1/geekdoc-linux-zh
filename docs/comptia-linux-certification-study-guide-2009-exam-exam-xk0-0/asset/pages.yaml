    \ to provide a mechanism to temporarily store information in a log (a journal).\
    \ The changes are stored in a log prior to the changes being implemented within\
    \ the file system. This approach reduces the amount of time required by a system\
    \ recovering from a crash if the data was not updated to the file system. Although\
    \ journaling is good for overall file systems, many applications provide their\
    \ own form of internal logging (journaling) and do not need this functionality\
    \ built within the file system. A major disadvantage of journaling is the impact\
    \ on system resources (for example, RAM and Disk I/O functions).\n\nThere are\
    \ three very common types of file systems\n\n+   ext2 – The second extended filesystem\
    \ (ext2), one of the oldest and most popular Linux file systems, is the industry\
    \ standard. It is a very reliable file system. The lack of journaling support\
    \ is ext2 greatest weakness.\n\n+   ext3 – The third extended filesystem (ext3)\
    \ expanded the ext2 file system. ext3 provides journaling support. It is the default\
