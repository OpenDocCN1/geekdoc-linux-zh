- pgno: 92
  md: 'implementation of disk quotas can provide valuable filesystem management support.
    It will allow you to specify limits on disk storage that may be allocated to a
    user or a group of users. This is accomplished by forcing the users to stay under
    a prescribed disk consumption limit. This takes away the user''s ability to consume
    unlimited disk space. Disk quotas, implemented across a filesystem, can be configured
    for individual users and groups.


    To use disk quotas for your system, a multistage process must occur. The first
    stage requires modifications to the /etc/fstab file. To implement disk quotas,
    you must add the following qualifiers "usrquota" or "grpquota" to each desired
    partition in the /etc/fstab file. After modifying the file, the easiest way to
    activate the disk quota system is to reboot your system. The second stage, the
    Linux `quota check` command, examines the quota-selected filesystems and builds
    a table of the current disk usage for each filesystem with disk quota enabled.
    This information is stored in aquota.group and aquota.user files. The final stage
    is the assigning of disk quotas using the Linux `edquota` command. The Linux `edquota`
    command, a quota editor, is used to display and change the various quota settings
    for one or more users or groups.


    After the disk quota system is implemented, a summarize disk quota review for
    a filesystem is available. The Linux `repquota` command is used to create and
    summarize the disk quota report. The report includes a summary of the disk quotas
    for the specified filesystems and summaries for the current number of files and
    amount of disk space per user. Finally, in case of a system crash and other filesystem
    failures, the Linux `quota check` command is used to scan a filesystem for disk
    quota use and to create, check, and (if necessary) repair disk quota systems.


    # Check and Repair Filesystems


    Linux operating systems, like all other operating systems, have filesystems that
    will experience some type of disk problem. To maintain the healthiness of your
    filesystem, you should check, and (if necessary) repair your filesystem. To perform
    this function within the Linux environment, the Linux `fsck` command is used.
    This command checks for and repairs Linux filesystem problems. If any problems
    are identified, the command will display the problem.


    Before using the Linux `fsck` command on a filesystem, you must `umount` the filesystem
    before checking for problems. To use the Linux `fsck` command, you must also provide
    the name of the filesystem (for example, /dev/sdb1) that will be examined. Presented
    below is an example using the Linux `fsck` command.


    ```

    fsck /dev/sdb1

    ```'
