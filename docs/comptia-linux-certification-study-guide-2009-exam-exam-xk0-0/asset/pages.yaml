  md: '# ps


    The $ps$ command all by itself will show you what programs are being run by your
    user in the terminal window it is executed in, which is usually just $bash$ and
    the $ps$ command itself – not terribly interesting. To really see what is going
    on, you need $ps$ -A, which will show all the processes currently recognized by
    the machine. The output from the $ps$ command is formatted into four columns,
    as shown in Figure 6.8. The first column is the process identification number
    or PID, which the system uses to uniquely identify each process. The next column
    is where the process is running – it’s “control terminal,” which determines where
    the program’s input and output should go.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_181_0.png)


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_181_1.png)'
