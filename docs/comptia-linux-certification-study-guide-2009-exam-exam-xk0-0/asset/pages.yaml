  md: '192


    # CHAPTER 6: Using BASH


    # chkconfig


    A handy tool for managing which runlevels a service runs in is **chkconfig**.
    It can be used to view or change the runlevels that a service will run in. Type
    **chkconfig** to view the status of all services at the current runlevel.


    Some of the options for **chkconfig** include the following:


    +   ■ -A or --allservices displays all services; same as **chkconfig**, with no
    options.


    +   ■ -t or --terse [name of service] will show if the named service is set to
    run at the current run level. Note that it doesn’t actually show if the service
    is running, only if the init scripts indicate that it *should* be running.


    +   ■ -l or --list [name of service] will show the init script settings for the
    named service for all run levels.


    +   ■ -a or --add [name of service] will set the scripts to run the named service
    at the given run level.


    +   ■ -s or --set [name of service runlevel(s)] will set the script to run at
    the listed run levels. For example:


    ```

    chkconfig -s sshd 35sets the secure shell service to run at runlevels 3 and 5.
    -d or --del [name of service] will set the named service to *not* run at the current
    run level. Note that this won’t actually *stop* the service if it is running,
    only change the init scripts to not start it the next time they run. Please refer
    to man **chkconfig** for additional information.

    ```


    # EXERCISE 6.3: Enabling NTP with chkconfig


    In this exercise, we will turn on the Network Time Protocol service, which keeps
    the system clock synchronized with a master clock over the Internet. To do this
    we need to do the following:


    +   1. Well, in openSUSE we *could* just click on **YaST | Network Services |
    NTP Configuration**, select **now and on boot** and add a nearby time server from
    the list, but what fun would that be? If you are going to be an expert, you’d
    better not be dependent on a specific distributions **GUI** tools.


    +   2. First you need to find a local NTP server. Technically, it doesn’t have
    to be local to work, but minimizing how much network you chew up makes you a good
    netizen. It is preferable to have a local clock master. Otherwise try and find
    something in your neighborhood at www.pool.ntp.org.'
  merge: -1
