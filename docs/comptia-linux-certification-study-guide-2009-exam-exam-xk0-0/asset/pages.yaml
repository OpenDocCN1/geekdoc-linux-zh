  md: '+   A. sar -A DEV 600 6

    +   B. sar -n DEV 600 6

    +   C. sar -n DEV 6 600

    +   D. sar -A DEV 6 600


    Correct answer and explanation: **B.** Answer **B** is correct because the switch
    and parameters needed to collect the desired statistics -n DEV 600 6. The *-n*
    switch tells *sar* to capture network statistics; the next parameter, 600, specifies
    the interval in seconds; and the last interval, 6, specifies that six sets of
