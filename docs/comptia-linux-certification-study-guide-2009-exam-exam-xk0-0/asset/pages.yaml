- pgno: 77
  md: '# Network


    In today’s intra- and internetworking environments, the Linux filesystem can also
    span across a network. This allows the Linux filesystem to functions as a client-server
    model that provides file-sharing services to Linux systems remotely across a network.
    The server component provides shared directories that can be accessed through
    network connectivity. The client component, after obtaining access, connects the
    shared directories to a mount point on the local filesystem. Within the Linux
    environment, the two primary network-based filesystems are the NFS and the SMB
    filesystems.


    The NFS, as presented in Chapter 2, is a framework designed to allow a user on
    a client workstation to access remotely files over a network on a network-based
    server. The NFS is an open standard defined in RFC 1094, RFC 1813, and RFC 3010.
    In this model, a NFS server shares one or more directories that can be accessed
    remotely by a network client. The NFS was originally designed to work with the
    User Datagram Protocol (UDP). Later NFS versions use registered ports TCP 2049
    and UDP 2049. Additional details about NFS are presented in the “Filesystem Management”
    section.


    The Server Message Block File System (SMBFS) is a framework designed to allow
    workstations access to directory/file shares on a network-based server. This model,
    implemented as client-server architecture, is comprised of two components. The
    first component, SMB protocol, provides mechanisms for performing interprocess
    communications. SMB allows various different types of access (for example, read,
    write, and delete) to different files on the network-based server and access to
    other server-side resources (for example, printing). The second component, SMB
    service, is an application that resides on both the client-side and server-side.
    The SMB service interoperate s with the system’s security authentication mechanisms
    and local filesystem. This allows the SMB environment to interoperate with various
    other SMB servers (for example, Microsoft Windows, IBM AIX, and Apple MAC OS).
    The Microsoft version of the SMBFS is known as the Common Internet File System
    (CIFS). There are some subtle differences between the two filesystems; however,
    interoperability is achieved. For the Linux environment, the Samba application,
    a free client/server implementation, provides support for both SMBFS and CIFS.
    Details about the Samba application is presented in Chapter 9. The SMB protocol
    was originally designed to work with NetBIOS/NetBEUI combination. This approach
    introduced a large amount of network traffic due to the nature of NetBIOS broadcast.
    A subsequent Transmission Control Protocol/Internet Protocol version, without
    NetBIOS overhead, was later released to listen on server port TCP 445.'
  merge: -1
  img_proc: true
