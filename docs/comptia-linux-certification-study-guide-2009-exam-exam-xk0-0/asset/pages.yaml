  md: "# Windows Interoperability\n\nThere are numerous Microsoft Windows workstations\
    \ and servers in use today, and interoperability with Linux is normally an essential\
    \ task any system administrator needs to undertake. There a number of utilities\
    \ to allow file sharing between systems, with the most common utility being *Samba*.\
    \ Samba provides file and print services to all Server Message Block/Common Internet\
    \ File System (SMB/CIFS) clients, which includes most versions of Microsoft Windows\
    \ operating systems as well as Linux/UNIX servers and clients.\n\n> **Note** \
    \ \n> SMB is an application layer network protocol, and is used as a shared-access\
    \ protocol between different machines on a network. Microsoft modified the original\
    \ specific for SMB and produced the CIFS, which was implemented in their products\
    \ until Microsoft Vista was launched (which uses SMB 2.0).\n\n# Remote Desktop\n\
    \nWith any mixed environment, you may need to mange both Linux and Microsoft *Windows*\
    \ clients and servers. Natively within Microsoft Windows, there is a remote desktop\
    \ application that uses the Remote Desktop Protocol (RDP). Within Linux, the open-source\
    \ product `rdeskstop` can be used to present the target desktop. This is based\
    \ on the X-Windows system. To connect to a remote host http://hostname.myccorp.com\
