  md: "'pool' used to generate the numbers; but it's possible for the pool to run\
    \ dry - so to speak. If this happens, /dev/random blocks further requests until\
    \ more noise can be collected. Applications that can get by with pseudo-random\
    \ numbers can use /dev/urandom, which could theoretically be vulnerable to attack;\
    \ but is still pretty good, and won't run out.\n\nThe /dev/zero file works like\
    \ /dev/null if you send data to it, but you can use it for an input stream to\
    \ create files full of zeros.\n\n> **Note**\n> \n> Another interesting special\
    \ device file is /dev/full, which acts like a full device. This is handy for testing\
    \ programs to see how they fail when the drive to which they are trying to write\
    \ is full.\n\n# ## Using System Documentation\n\nEasily the most important thing\
    \ you can learn is how to learn more. Linux offers many ways to find additional\
    \ information for all of its commands. The quickest and most basic assistance\
    \ comes from using the help option of any given command - usually both - ? and\
    \ -help work, as in ls - ? or ls - help.\n\n# ### man #\n\nIf you need a little\
    \ more detail, check the man pages (short for manual). Man pages are brief descriptions\
    \ of a command and all its available options, and are accessed by typing man [command],\
    \ which then goes into a full-screen viewer. Try man man to get the full tour.\
    \ Briefly, <Space, bar> or <Page_Down> goes through the manual entry one page\
    \ at a time, <Page_Up> goes up a page, / lets you enter text to search for within\
    \ that entry, and q (for quit) exits back to the command prompt. If that sounds\
    \ familiar, it's because man uses less as a pager, so it's the same interface\
    \ you'd get if you typed ps -A | less.\n\nThe actual information shown by man\
    \ lives in a couple of different directories. These vary by distribution, but\
    \ the main information is in /usr/share/man or /usr/share/doc. The manpath command\
    \ will show them to you exactly where man looks for information on your system.\
    \ When you install a new program using a package manager, it will usually take\
    \ care of adding the appropriate manual pages - usually to /usr/local/man.\n\n\
    If you look in one of the manual directories you'll see the pages are split up\
    \ into numbered groups, called sections. The most useful information for system\
    \ administrators is in sections 1 and 8. The section numbers are shown in Table\
    \ 6.2."
