- pgno: 311
  md: '(list of open files) will show all files that are in use, who has them open
    and lots of other helpful information.


    # ## Files


    We''ve touched on a number of files the Linux uses to maintain user information;
    now, we''ll take a closer look at a couple of them.


    # * /etc/skel


    Each user account has a home directory. In addition to their documents and other
    files, it is used to keep their individual account settings and preferences. To
    help keep things standardized and give new users a good starting point for their
    settings there, a set of template files is copied to the new users home directory
    by useradd. These templates are kept in the /etc/skel (short for “skeleton”) directory.


    A typical list of files in /etc/skel looks like Figure 10.2.


    The template files can be used to give users helpful defaults for their BASH shell,
    standardized options for a company preferred text editor, and other standardized
    settings. It can even be used to give company standard browser favorites or a
    company directory file.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_311_0.png)


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_311_1.png)'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# ## /etc/passwd


    Actual user account information is kept in the /etc/passwd file. The passwd file
    is just a text file and can be viewed or edited like any other text file (see
    Figure 10.3); however, it can only be edited by a user with elevated privileges,
    such as "root."


    Each user has its own line within the /etc/passwd file. Each line is separated
    into fields by colons. The fields, in order, are as follows:


    +   *   username

    +   *   password – more on this in the /etc/passwd section

    +   *   UID

    +   *   GID


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_312_0.png)


    # **FIGURE 10.3**


    Sample contents of a /etc/passwd file.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   comment(s) – usually the user''s real name, plus optional office location,
    phone number, or other information separated by commas

    +   user''s home directory

    +   user''s default shell – “/bin/false” here means that user doesn''t get shell
    access, which is good security policy for many system accounts


    The useradd tool is the preferred method for adding or changing user information,
    although simply opening the file with your favorite text editor will work, too.


    > Note

    > If you are on a busy system, use the vipw command to pop the /etc/passwd file
    open in vi and lock it until you are done, so multiple administrators can''t make
    changes at the same time, which could lead to problems.


    # /etc/shadow


    The /etc/passwd file contains lots of information that''s pretty useful and is
    used by many common utilities to cross-reference username and UID/GID information
    and other things, so it is pretty handy to allow it to be read by a lot of programs.
    However, having easy access to every user''s password, even if encrypted, is a
    bad thing. To solve that problem, nearly all current UNIX systems use a mechanism
    called a shadow password file, /etc/shadow. This file can only be read by system
    administrators and contains the actual passwords and other sensitive account information.
    It can also be read by processes and utilities that are setuid 0. The format is
    similar to /etc/passwd, one line per user (see Figure 10.4).


    The colon delimited fields are as follows:


    +   username – matches the username from /etc/password.

    +   encrypted password – an * or leading ! indicates the account is locked or
    temporarily disabled.

    +   a series of encoded dates that track when the password was last changed, when
    it expires, and other security timing information.


    While the /etc/shadow file can be edited by hand, it usually isn''t for purely
    practical reasons. The password is encrypted by the crypt function, and the dates
    are tracked by the number of days since 1970; neither is user-friendly. Instead
    use the passwd command to change the password and usermod to change password dates.
    If you recall the password field from the /etc/passwd'
  merge: -1
  img_proc: true
- pgno: 314
  md: "# FIGURE 10.4  \nThe /etc/shadow file.\n\n![](img/95b3ebd6248b36778ccf73988aaab2f2_314_0.png)\n\
