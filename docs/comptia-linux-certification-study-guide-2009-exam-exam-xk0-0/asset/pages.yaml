  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_199_0.png)


    find executable files. As a result, you''ll have to provide an explicit path to
    your script, although you can use the ./ shortcut – like this: `./myscript`


    A bash script file expects to have a first line of `#!/bin/bash`. Normally, a
    line starting with a “#” is ignored and used for comments, but this special instance
    tells the command interpreter that this is the start of a shell script, and this
    script would like to be run with the bash shell located in the /bin directory.
    This will ensure that your script will be run in the correct shell, even if the
    user that is using it is in a different shell.


    The command interpreter itself is the command line you''ve been using, but it''s
    also a programming language. Once you''ve mastered using it interactively, there
    is a whole additional world of creating scripts that can start doing your work
    for you.


    # Using Shell Features


    The bash shell provides a history feature that remembers what commands you''ve
    previously entered. The list of commands is stored in a hidden file in your home
    directory: `.bash_history` [note that hidden files start with a “.” and can be
    listed by using `ls -a`. Because the history is stored in a file, it doesn''t
    go away when you log out or reboot, although it does change when you log in as
    root since you aren''t the same user anymore. You can view the entire list by
    typing `history`. Recall that output of one command can be'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'piped to another; a convenient use for this is that it lets you search for
    a past command using `grep`. To find all previous `ps` commands, you''ve used
    for example, you could enter `history | grep ps`. Well, not `all` — by default,
    it backs only 500 commands.


    The `bash` history feature lets you hit the **Up-arrow** key to cycle through
    your most recent commands, but that''s just scratching the surface of what it
    can do. When you type `history`, you''ll notice each command line is preceded
    by a number; typing `!<command_number>` you can replay the command that corresponds
    to that number. Typing `!!` will repeat the last command, if you don''t like the
    **Up-arrow** for some reason. If you made a mistake or want to retype a command
    and only change a small bit, you can do a quick substitution of text in the last
    command like this: `^old_text^new_text`. For a complete description, check out
    `man history`.


    Another handy command-line feature is tab completion. `bash` will try and guess
    what you are attempting to type if you push the `<Tab>` key. If you already have
    enough characters to uniquely identify the next word, `bash` will just fill it
    in for you. This works for programs, files, and directories. If you haven''t typed
    enough of a word, a second push of the `<Tab>` key will display a list of possible
    matches for you. It will even warn you if the list is very long. Apart from saving
    a lot of typing if you have to deal with long file names or directories, it''s
    great for avoiding typos, too.


    # SCHEDULING TASKS


    Running scripts to automate complex tasks is great, but it really turns into magic
    when you can make the scripts run themselves. No one wants to log in at 3:00 A.M.
    to start a backup job, especially if it has to run every evening. In the sections
    below, you will learn how to put routine tasks on an automated schedule using
    `cron` and how to schedule ad hoc tasks at the most convenient time using `at`.


    # cron (`cron allow`, `cron deny`)


    For the routine tasks that need to be performed on a regular basis or at predefined
    intervals, Linux provides a scheduling service called `cron` that lets you put
    these tasks on a schedule of your own design. Daily backups to disk or tape is
    a prime example of a routine task that does not require your active supervision.
    The `cron` program starts up when the system boots and runs in the background,
    checking every minute to see if there is anything scheduled to run.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'For security purposes, there are filters available to limit who can edit the
    *cron* configuration (\textit{crontab}) files. Users in the /etc/cron.allow file
    are the \textit{only} users able to edit their files. If that file is empty, the
    system looks for users in the /etc/cron.deny file, which lists users barred from
    editing *cron* files. The root user isn''t affected by either.


    # ## crontab Command Syntax


    The schedule consists of a series of files called \textit{crontabs} (cron table)
    that tells *cron* what to run and when to run it. Crontab files for users are
    stored in /var/spool/cron, with the crontab name matching the username. The administrators
    files are kept in /etc/crontab, and there is an /etc/cron.d directory that programs
    can use to store their own schedule files.


    The crontab schedule files are edited using \textit{crontab} -e. They use a special
    format to specify the when to run. Each line has either six or seven fields, and
    specifies one command. The first five fields on each line tell which minute, hour,
    day, month, and weekday to run a command. The next spot on a line is an option
    for administrators and tells whose user rights to run the command under, and last
    is the command itself. Valid options for the schedule fields are a *, which matches
    anything, a number, which matches that exact value, two numbers with a dash between
    them for a range of values, or a list of values separated by commas to match each
    single value. The command can be anything that works. Altogether, it looks like
    this:


    ```

    crontab -e

    30 17 * * 1-5 do\_something.sh

    ```


    That means 30 min after the hour of 5:00 PM. every day of the month, every month
    of the year (that is, Monday through Friday).


    *crontab* uses the text editor that your profile is set to use; chances are you''ll
    be using your old friend \textit{vi}. Remember to press \textless Ctrl \textgreater
    d, \textless Esc \textgreater to get back to ex mode, then :wq to save and exit.
    See vi section if you need a refresher.


    You can also use \textit{crontab} -l to display the contents of your crontab file,
    and \textit{crontab} -r to delete it.


    # ## atq


    If you just want to have something run a bit later rather than schedule it to
    keep reoccuring, you can use the \textit{at} command. It accepts commands from
    either a file (use -f) or standard input, ending with a \textless Ctrl \textgreater
    d. A single ctrl-d is sufficient if there is nothing else on the line. It takes
    two ctrl-ds if there is more text on the line. For example, at \textless ls -l
    \textgreater text.txt'
  merge: -1
  img_proc: true
