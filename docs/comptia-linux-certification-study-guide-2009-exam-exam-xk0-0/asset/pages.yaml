  md: '# # Glossary


    The following terms show up throughout the book and, with their accompanying definitions,
    they should be a useful resource when studying for the exam.


    **Advanced Configuration and Power Interface (ACPI)** A specification that establishes
    common interfaces between an operating system (OS)-configured motherboard and
    device-based power management.


