- pgno: 82
  md: '# Linux filesystem decisions.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_82_0.png)


    a directory structure would need to be created for the allocation and organization
    of files and folders. For the Linux professional, it is the balancing of the Linux
    filesystem triad that presents the greatest challenge. Each leg of the triad presents
    a series of tradeoffs. These tradeoffs, as presented in Figure 3.5, are categorized
    as follows:


    +   * **Initial boot access** During the Linux installation process, it is critical
    that system BIOS and GRUB functions be able to access a Linux partition. The system
    BIOS will access the Linux primary partition to execute the boot loader, GRUB.
    GRUB, which is comprised of two stages, must be able to access the /boot partition
    to retrieve the mini Linux kernel and other critical configuration files. As a
    result, for some installations, placing the initial boot applications and configuration
    files on a separate Linux partition makes the installation process easier – especially
    since, during the initial boot process, the mini Linux kernel and *initrd* will
    have limited access to disk device drivers.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   * **Disk space growth** The design and implementation of a Linux system
    requires disk space growth projections. As a result, the Linux professional must
    be able to predict the amount of disk space needed for current and future use.
    A wrong calculation could end up in data not being saved or a corrupted partition.
    The projections should include installed applications and associated application
    data and user files. If a fixed partition-based implementation is used, the Linux
    professional must establish space limitations or quotas. Creating a separate partition
    for application data and user files is very common. You can install everything
    of the root partition. However, if an application on the same partition gets corrupted,
    the impact could damage the entire partition. With a multiple partition implemented,
    if the corruption occurs within one partition, other partitions will not be corrupted.
    In addition, failed disk space growth projects for system and user data can also
    present significant disadvantages for fixed-sized partition Linux systems. The
    introduction of logical volume management (LVM) reduces disk growth limitations
    by allowing data in volumes to expand across separate physical disks.


    +   * **Security and permissions** Information stored on the same partition opens
    the door for various security risks. For example, if the partition is corrupted,
    all the data could be lost. In addition, directories not properly secured could
    give hackers read/write/execute access to a directory to load data or fill up
    a partition with data (for example, illegal videos/music files, or stolen data).
    Creating separate partitions to separate system resources from user files allows
    you to place more stringent access controls around system resources.


    +   * **Backup/restore** Creating several partitions for backing up and restoring
    system resources, applications, application data, and user files provides greater
    schedule flexibility, reduces backup performance impacts, and can improve restoration
    times. Separate partitions allow the Linux professional to be more precise in
    backing and restoring data, thereby minimizing system downtimes.


    +   * **System repair/rescue** Similar in nature to the first bullet listed above,
    initial boot access, creating a separate partition for critical partitions (including
    the /boot partition) would make it easier to repair and/or rescue a corrupted
    partition.


    +   * **Logging/monitoring** System logging and monitoring is not only a tedious
    job, but also a never-ending job. As a result, log files must be accessed, reviewed,
    and in most cases saved for security purposes.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The creation of a separation partition for log files will make it easy to backup,
    restore, secure, and provide remote access to external systems, if necessary.


    ■ **Volatile/temporary data** Computers and associated applications are constantly
    creating volatile and temporary data. In most systems, this data now resides on
    the partition storage device (not just in memory). This created temporary data
    is a result of the ability of the system and applications to read/write/and execute
    information located within the temporary directories and swap space. The Linux
    system automatically creates a swap partition. However, there are other directories
    (for example, /tmp) that traditionally reside underneath the root directory. These
    other directories can also outgrow the disk space capacity of the partition.


    ■ **System maintenance** The creation of separate partitions for system administration
    and maintenance purposes can also make the job easier – for example, the recovery
    of corrupted partitions and the backup and restoration of data.


    For the Linux professional, the decision to create a partition or not to create
    a partition is a tough job. Clearly, a single-partition system is not a sound
    system design. However, partitioning of every directory is not feasible, either.
    Therefore, the Linux professional must find the mean between the two extremes.
    Table 3.1 provides more insight into the tradeoffs the Linux professional must
    make.


    # **Table 3.1** Tradeoffs for Specific Linux Directories


    | Linux Directory | Tradeoff |

    | :--- | :--- |

    | /swap | The Linux swap partition is used as swap space. It functions as virtual
    memory. The /swap directory is a predefined partition that has its own predefined
    filesystem. This directory provides additional memory to your system to run large
    programs. |

    | /boot | The /boot directory contains files and configuration information needed
    during the Linux boot process. This includes the mini Linux kernel. The implementation
    of /boot under a different partition would make system rescues and repairs easier.
    |

    | /home | The /home directory is normally implemented to host users’ account directories
    and user-specific files. The /home directory should be assigned a separate partition.
    The reason why this directory should be created on a separate partition is due
    to multiuser file space growth. In addition, performing backup and restore functions
    is a lot easier if dynamically changing user files reside on a separate partition.
    |

    | **(Continued)** | |'
  merge: -1
  img_proc: true
