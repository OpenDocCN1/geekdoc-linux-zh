  md: '# 172 **CHAPTER 6: Using BASH**


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_184_0.png)


    consumed by each process. Additional features can be found by typing **h** for
    help, or consulting the man page (`man top`). One handy feature is a built-in
    `kill` option; to terminate a process, just press **k** and type in the process
    ID. Press **q** or **Ctrl + c** to exit top.


    # *pstree*


    Another helpful way to view processes is with the `pstree` command, which shows
    the relationship between main *parent* processes and the *child* processes they
    have created in a hierarchical tree view. By default, it only shows process names,
    but `pstree -p` will show process IDs also. Note that the `init` process is the
    parent of all the other processes – the kernel automatically starts the `init`
    process as the machine boots, and it in turn runs the startup scripts that fire
    up everything else. The `init` process always has a PID of 1. Each child process
    knows its parent process ID (PPID), which is what `pstree` uses to trace the relationship
    between processes. PPID numbers can be viewed with the `ps -Al` command.'
