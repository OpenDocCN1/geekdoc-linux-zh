    \ using\n\n```\napache2 -l (shows those modules compiled in code)  \napache2 -t\
    \ -D DUMP_MODULES (show all loaded modules)\n```\n\nModules can be enabled and\
    \ disabled using the a2enmod and a2dismod commands.\n\n# Apache Containers\n\n\
    Within the Apache configuration files are a number of containers, which are individual\
    \ units that contain directives that alter the configuration of the Apache server.\
    \ The two main containers are the filesystem container and the Webspace container.\
    \ The filesystem container contains all the directives regarding the directories\
    \ and files; for example, location and access rights. The Webspace container contains\
    \ all the information about the Web site you are developing; for example, the\
    \ URL name.\n\nAs an example, to enable directory indexes for the /var/web/dir\
    \ directory, the following should be included:\n\n```\n‹Directory /var/web/dir›\n\
    Options +Indexes\n‹/Directory›\n```\n\n**Table 9.5** *httpd Arguments*\n\n|  |\
    \  |\n| :--- | :--- |\n| -d ServerRoot | Sets the value for ServerRoot if different\
    \ from the default |\n| -k start \\| stop \\| restart | Starts or stops the daemon\
    \ |\n| -v | Displays the current version |\n| -X | Runs in debug mode |"
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The virtual hosts container can be used when you have multiple hosts being
    served from the same machine. This will allow different configuration options
    being applied to each virtual host. The virtual hosts can be IP-based (one IP
    per Web site) or name-based (multiple names on a single IP address).


    # Exam Warning


    You should know that the Apache Web files are located in the directory specified
    by the DocumentRoot directive specified in the httpd.conf file.


    # .htaccess Files


    The .htaccess file allows the Apache server to have a decentralized management
    of its Web tree. This file has directives in the plain text configuration file.
    These directives will apply to the directory where the .htaccess file resides
    and is read upon every access; so any changes will have an immediate effect. If
    the .htaccess file has options in it, the Apache configuration file must be configured
    with the AllowOverride Options set.


    # EXERCISE 9.2: Stopping and Starting the Apache HTTP Server


    In this exercise, you will learn how to stop and start the Apache HTTP server
    daemon. This is often needed if you change configuration details or add some functionality.
    A number of these changes are often only read when the Apache server starts.


    +   1. You wish to stop the Apache server daemon gracefully [allowing processes
    to finish if they have time], so you need to execute the command `apachectl -k
    graceful-stop`.


    +   2. When all the processes have stopped, you can restart the server using the
    command `apachectl -k restart`.


    # PHP


    PHP is a general purpose scripting language used in Web development. It is mainly
    used when you need to have a dynamic Web page created and, once created, appears
    just like any other HTML page. It is often installed as part of a LAMP environment
    (Linux, Apache, MySQL, and PHP), with a good example of this being XAMPP, which
    can be downloaded at www.apachefriends.org/en/xampp.html. When PHP starts, it
    reads its configuration file php.ini, which is usually in /usr/local/lib/php.
    When'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'it is run as an Apache module, the configuration directives will reside in
    memory until a new Apache process has started.


    # CGI Scripts


    Apache can be configured to treat any file in a particular directory as a CGI
    script. This is typically referred to as the *cgi-bin* directory by Web developers.
    The specific directory where the default CGI scripts are held can be set up in
    the httpd.conf file using ScriptAlias. The syntax of this is as follows:


    ```

    ScriptAlias URL path name

    ```


    If you have set up your CGI scripts in a directory /usr/local/apache2/CGI-bin/,
    then to make the Apache server treat all these files in this directory as a CGI
    scripts, the full command will be:


    ```

    ScriptAlias /cgi-bin/ /usr/local/apache2/cgi-bin/

    ```


    It is possible to run CGI scripts from any directory as well as that defined using
    ScriptAlias. For this to happen, there are two distinct steps that have to be
    undertaken: First, the cgi-script handler must activate AddHandler directive;
    and second, the ExecCGI directive must be specified in the Options directive.
    The httpd.conf file will need to be modified by adding the line


    ```

    AddHandler cgi-script .cgi

    ```


    Under the directory container, the *options* line will be added:


    ```

    Options +ExecCGI

    ```


    As an example, suppose you want to allow CGI programs to be located and executed
    from a file ending in *.cgi*, the following should be added:


    ```

    ```apache

    <Directory /home/*/public.html>

    Options +ExecCGI

    AddHandler cgi-script .cgi

    </Directory>

    ```

    ```


    # Configuring Apache Server Logs


    The Apache error log is set by one of the directives, ErrorLog, and is the log
    file where the Apache httpd daemon will send all the errors and diagnostic information
    to, which is normally called *error_log*. Because of this, it should be the first
    place you look when you are diagnosing an Apache server problem. It will also
    include any error messages and debug information from CGI scripts. The *LogLevel*
    directive in the configuration file will define the amount of error logs, or how
    verbose they are. There are eight levels of logs: *emergency, alert, critical,
    error, warning, notice, info, debug*.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'When you first start your Apache server, you may wish to have more verbose
    logging (that is, debug) until you are confident that everything is working correctly.


    # Exam Warning


    > Do not allow anyone to write to the Apache log directory, as this will almost
    certainly give them access to the uid that the server is started, which is often
    root. In addition, the raw logs can have control characters inserted into it by
    malicious users, so care must be taken when viewing the raw files.


    # Tomcat Configuration


    Tomcat (or its full name, Apache Tomcat) is another product developed under the
    Apache license, with the main Web page being http://tomcat.apache.org. It is a
    servlet and JavaServer Pages (JSP) container for the Apache Web server. JavaServer
    and servlet specifications are defined fully in http://java.sun.com/products/jsp/download.html
    and http://java.sun.com/products/servlet/download.html, respectively. JSP allows
    developers to create dynamically generated Web pages using HTML and XML and deliver
    these to a Web client. Servlets are the Java equivalent to PHP, CGI, and ASP.NET
    and can be automatically generated by a JSP compiler. These two technologies are
    therefore linked together. The Java Development Kit (JDK) must be installed and
    should be working on the system before you install Tomcat.


    The layout of the Web application can be considered to be the hierarchy of directories
    and files. This can be packed into a form known as a Web Archive, or WAR file.
    The topmost directory in this structure is known as the document root and all
    files can be referenced from here. There is a standard root to a WAR file, with
    the following files in or referenced from the document root:


    +   * *.html and *.jsp (HTML and JSP) pages are stored in the document root or
    (for larger applications) into a subdirectory hierarchy.


    +   * /WEB-INF/web.xml is the Web Application Deployment Descriptor for your application
    and is an XML file describing the components that make up the application.


    +   * /WEB-INF/classes/ is a directory containing Java class files for your application.


    +   * /WEB-INF/lib is the directory containing the JAR files and third-party libraries.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# # File Transfer Protocol


    The FTP server is used to upload and download files to a server from an FTP client.
    The protocol itself dates back to the early days of UNIX and is a true client-server
    architecture. The client interface has evolved from the original command-line
    mode to sophisticated GUIs in most operating systems today.


    The standard Web browser, such as Firefox or Internet Explorer, can be used as
    a front end (substitute http:// with ftp:///). The protocol can be used with or
    without usernames and passwords, although security is still an issue due to the
    transmitting of these credentials in plain text. An FTP server that allows anyone
    to connect to it is called an anonymous server.


    The server can be set up in one of two modes: active or passive. In active mode,
    the server listens on port 21 for incoming connections, and this is used as the
    control stream. The server binds port 20 as the data connection to the client.
    In passive mode, the data port is on an arbitrary high port. The different modes
    often lead to confusion, so the two modes will be explained in detail below.


    # ## Active FTP


    In active mode, the FTP client will connect from a random unprivileged port P
    > greater than 1023 to the FTP server’s command port 21. The client will start
    to listen on port P+1 and sends this information to the FTP server using the command
    PORT P+1. The FTP server will then connect to the P+1 port from the FTP server
    from its data port, port 20. On the client side, therefore there will be two open
    ports, P and P+1, and on the server side ports 20 and 21 will be opened and connected
    back to P and P+1 on the client.


    # ## Passive FTP


    In active FTP, the server initiates the connection to the client, which often
    causes issues if there are firewalls in the way. Passive FTP was therefore developed,
    and the client initiates passive mode using the command PASV. In this method,
    the client initiates both connections, which alleviates any firewall issues. In
    this case, the FTP client opens two unprivileged ports P and P+1, with P again
    a port above 1023. The first port will connect as before on port 21 for the FTP
    commands, and then issue the PASV command instead of the PORT command. The FTP
    server then opens a random unprivileged port above 1023, say S, and then sends
    the PORT S command back to the client. The client will initiate the connection
    to this port on the FTP server.


    The setup of an FTP server is relatively easy for the basic installation. As security
    is an issue with the FTP protocol, you may wish to install a secure file transfer
    server such as SSH. Most modern Linux distributions will have'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'the SSH server as an option. The main decision to make is whether to install
    an authenticated or anonymous server. Unless you have a very trivial setup and
    no Internet access, it is recommended that an authenticated server is used. Once
    installed, a user can connect to your server using the IP address, or DNS name
    using the command line or GUI. If the unsecured version has been installed, the
    user may be able to traverse across the server and upload and download files to/from
    many locations.


    An FTP server can be set up to restrict the local usernames that can be used.
    For instance, you should typically stop remote users using the *root, bin, etc*
    username. This is achieved by putting the list of users in the */etc/ftpusers*
    file. This simple list of names must also appear in the */etc/passwd* file. The
    */etc/tftpchroot* file is in a similar format to the */etc/ftpusers* file and
    contains the list of users whose session root directory needs to be changed. This
    is usually to the directory listed in the */etc/tftpd.conf* configuration file.
    This is to ensure that the remote user is put in a safe directory and they cannot
    traverse into an area where there are sensitive files.


    # EXERCISE 9.3: Transferring Files in ASCII or Binary


    In this exercise, you will transfer an executable file from a server to a host
    with a command line *ftp* utility.


    +   1. First, connect to the FTP server using *ftp servername*, where *servername*
    is the name or IP address of the server you wish to connect to.

    +   2. When you are prompted for a username and password, enter the valid credentials.

    +   3. When the */ftp>* (or similar) prompt is displayed, type *binary*. This
    will change the transfer mode to binary from ASCII (or text transfer).

    +   4. Type *get filename* to retrieve the file you wish.

    +   5. The file is now transferred to your computer in the correct format. If
    you had used the ASCII mode, the file would have been corrupted and unusable.
    ■


    # Squid


    Squid is a proxy server and Web caching service. There are a number of uses for
    it, and they are as follows:


    +   - Caching Web lookups for the network

    +   - Additional security for Web access

    +   - Speeding up a Web server through caching of repeated requests.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'The main protocols that are used with Squid are HTTP and FTP, although there
    is some support for others such as SSL. When Squid is installed on the local network,
    it can be configured to cache HTTP and FTP traffic that is destined for the Internet,
    which can reduce the amount of traffic on the Internet gateway. Web clients are
    configured to access to the Internet through this cache, and if a firewall is
    installed, this is usually configured to block direct Internet access from those
    clients. As Squid is intended to increase the user’s experience, it is essential
    that it is installed on a system which is powerful enough to cater for all the
    requests it is expected to receive. Fast hard disks to retrieve the files from
    cache are therefore recommended.


    # Squid Configuration Files


    Squid itself should be configured to run at boot time and will be a normal Linux
    daemon. The main configuration file for Squid is /etc/squid/squid.conf and the
    software is installed in /usr/local/squid. The main options that are likely to
    be configured will be described. Web servers normally listen on port 80, but Squid
    can be configured to listen on any port. This is often useful if you are trying
    to hide some servers from general browsing. The default port for Squid is 3128,
    although a lot of people chance this to port 80 to make it easier to remember.
    To change the port in the squid.conf file, you will need to add a line such as:


    ```

    http_port 3128 80 8080

    ```


    This will allow Squid to listen on ports 3128, 80, and 8080. Depending on the
    installation of this server, you may need to add multiple ports to ease the configuration
    changes needed on the client machines. For example, some proxy servers will be
    configured to run on port 80, and adding the port 80 to the Squid proxy configuration
    will greatly ease the transition.


    In addition, you need to give the system a valid DNS entry for the system, which
    will ease the configuration now and in the future. Having a generic name such
    as *proxyserver.mycorp.com* will allow you to change the system at a future date,
    even its IP address and still give clients the ability to connect to it without
    having to re-configure all of their Web browsers.


    The security on the server can be added in layers. The first layer can be to use
    simple access control lists (ACLs), which can restrict the networks that are allowed
    to connect to the server and with protocol. If your local network is a subnetted
    class A network, 10.10.100.0/24, and you wish to allow this entire network to
    access the Squid server using HTTP and deny all other networks, the following
    lines should appear in the squid.conf file:


    ```

    acl mynetwork src 10.10.100.0/255.255.255.0

    http_access allow mynetwork

    http_access deny all

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The Squid proxy can also be used to filter individual sites so that users cannot
    access them. Suppose you do not want your users to access CNN.com or bbc.co.uk.
    The following lines will deny these sites:


    ```

    ```

    acl newssites dstdomain .bbc.co.uk .cnn.com

    http_access deny newssites

    ```

    ```


    You can be more specific about when you allow or deny access to a site; for instance,
    you may allow the users to access the domains in the “newssites” group specified
    above during the lunch hour. For this, add a new acl, and the configuration file
    should look like that given below:


    ```

    ```

    acl newssites dstdomain .bbc.co.uk .cnn.com

    acl lunchtime MTWHFAS 12:00 13:00

    http_access allow newssites lunchtime

    http_access deny newssites

    ```

    ```


    Note that the specification of the days of the week is Monday, Tuesday, Wednesday,
    Thursday, Friday, Saturday, and Sunday. When Squid matches a line in the configuration
    file for http access, it will execute this and stop reading the file. The order
    of the lines is therefore important. Obviously, the more rules you require, the
    more complex the file will become. Often, used rules should therefore come at
    the beginning of the file whenever possible, to speed up execution. You can also
    block certain IP addresses or groups of addresses or allow full access for certain
    IP addresses, such as servers.


    # ## Exam Warning


    Squid can be used as a proxy server and as a caching server. When it is a caching
    server, it displays data to the client that has already in its cache; for example,
    a Web page. When it is used as a proxy, it is acting as a go-between for requests
    from a client to the target server. The target server will therefore not be able
    to communicate directly with the client.


    # # APPLICATION SERVICES


    The final section in this chapter will look at the application services that can
    be installed and run on a server. The main application services that are required
    by most companies are examined – namely printing, mail, and a database. These
    application services should not be confused with the client’s view of these, who
    can have a local printer and an electronic mail (e-mail'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'client, for instance. The application services described here will serve up
    the application to many people within an organization and allow for central management.


    For large companies, the number of printers can be very large on a single floor
    of a building, let alone the whole company. The management of these from one or
    more central locations will often be a requirement to reduce this service overhead.
    The setting up of the CUPS print server and the basic administration of this server
    is defined. The CUPS server provides the capability to pool printers together
    such that a user can execute the print command and the least busy printer will
    be used. This will allow printer administrators to take printers offline for maintenance
    without impacting the user.


    As a company grows, the use of a central mail server becomes sensible to better
    control the flow of data into and out of the company, to allow the use of a central
    antivirus and spam checker, and to allow the management of a user''s mail at this
    central location. The two main servers for Linux (sendmail and postfix) are discussed
    and the basic configuration of each is described.


    Finally, the MySQL database application is described. While many will think that
    a database is usually a client-side application, MySQL can often be used on the
    server as part of another application (for instance, the postfix mail server can
    use MySQL as its database). The MySQL database server is the most popular open-source
    database around and is usually found on most Linux distributions.


    # ## Printing


    In Chapter 8, there was a section on printing that related more to the client
    and how a user can manage their printing. This section also detailed the print
    commands such as 1pr, 1p that can be used from a command line. If you have not
    read that section yet, you should do so before reading this section, as it will
    teach you about the tools needed to test the print server when you have set it
    up. The print server that is common within Linux is CUPS, or the Common UNIX Printing
    System, and the latest version can be downloaded from http://cups.org [along with
    all the documentation you will need]. The CUPS server can manage multiple printers,
    both local to it and remotely across the network. The server itself converts the
    page descriptions from the application you are trying to print from data-specific
    to the printer you are trying to print on. Each printer will have differences
    in the format of data it requires, depending upon different manufacturers or even
    different models within one manufacturer''s range. CUPS will keep track of the'
  merge: -1
  img_proc: true
- pgno: 290
  md: "printers it is managing and display messages when a printer needs attention,\
    \ \nperhaps due to no paper or an ink cartridge that needs replacing.\n\nThe initial\
    \ task to set up CUPS is to add one or more printers to it, which is done under\
    \ the *Administration* tab of the CUPS interface. This interface is accessed via\
    \ a Web browser using port 631. To access CUPS that is running on your local machine,\
    \ you need to type http://localhost:631, and you can substitute the *localhost*\
    \ part with a machine name or IP address if you are accessing a remote CUPS instance.\
    \ There will be a number of pages within the interface that will require the root\
    \ username and password to be entered, adding a printer being one of them.\n\n\
    # Network Printers\n\nNetwork printers can be added to and managed by CUPS. The\
    \ addition of network printers is very similar to that of a local printer, but\
    \ the remote IP address (or name) must be known or found using Simple Network\
    \ Management Protocol (SNMP) built into CUPS. There are three network protocols\
    \ supported by CUPS:\n\n+   * AppSocket Protocol, usually associated with HP JetDirect\
    \ network interfaces.\n+   * Internet Printing Protocol (IPP), normally over port\
    \ 631\n+   * Line Printer Daemon (LPD) Protocol, which should only be used if\
    \ the above protocols are not supported. The port associated with LPD is normally\
    \ 515.\n\n# Managing Operation Policies\n\nThere are rules built into CUPS to\
    \ allow the administrator to define a number of policies, such as the user must\
    \ supply a password. This allows the administrator to customize the interface\
    \ to match the policies within the company. These rules are stored in the *cupsd.conf*.\
    \ These rules are easily changed via the CUPS interface using the *Edit Configuration\
    \ File* on the **Administration** tab.\n\n# Printer Classes\n\nWithin CUPS, an\
    \ administrator can group printers together to form a class. This allows the user\
    \ to send a document to this group of printers, and CUPS will decide which printer\
    \ is idle and then print the document on this printer.\n\n# EXERCISE 9.4: Allow\
    \ Users to Cancel Any Job\n\nYou want to allow all your users the ability to cancel\
    \ any job on a printer, not just the one they own."
  merge: -1
  img_proc: true
- pgno: 291
  md: "+   1. Start the CUPS interface by typing the URL `http://localhost:631` into\
    \ a browser.  \n+   2. Click on the **Administration** tab.  \n+   3. Under the\
    \ *Basic Server Settings*, make sure that the option *Allow users to cancel any\
    \ job (not just their own)* is checked.  \n+   4. Click on **change settings**.\
    \  \n+   5. When prompted, type the **super username** and **password**.  \n+\
    \   6. The CUPS server will restart, and then any user can cancel a job.\n\n#\
    \ Mail\n\nThe e-mail server will be an important part of any network, and very\
    \ useful in a small or home office environment. A distinction should be made between\
    \ the e-mail server and client – a well-configured e-mail server will be able\
    \ to have a number of different clients seamlessly connecting to it. This will\
    \ be very useful in organization where there are mixed systems (Linux, Microsoft\
    \ Windows, Apple Macs, and so forth). This section will only touch on the clients\
    \ where it is necessary to see the application working, and will not concern itself\
    \ with their configuration.\n\nThis chapter describes the setting up of the `sendmail`\
    \ mail transport system; however, there are many others available for Linux, such\
    \ as postfix, which are very popular. Learning the basics with one will, however,\
    \ give you a very good advice on how to set up different servers. The first step\
    \ in setting up a mail server for a domain does not involve the server at all.\
    \ Initially, the DNS for your domain needs to be configured to ensure that there\
    \ is a valid MX record pointing at your mail server (or where it will be).\n\n\
    The main transport mechanism for e-mail around the Internet and between e-mail\
    \ servers is the Simple Mail Transfer Protocol (SMTP), which operates on port\
    \ 25. The basic protocol has been around a number of years, although a number\
    \ of extensions have been added for authentication and error reporting, among\
    \ others. The mail is transferred from one e-mail server to another using a Mail\
    \ Transfer Agent (MTA); sendmail, postfix, and others are classed as MTAs.\n\n\
    The Post Office Protocol (POP) and Internet Message Access Protocol (IMAP) protocols\
    \ can be used by the local e-mail clients to retrieve their e-mail from a remote\
    \ server. Currently, these are the two most prevalent protocols for e-mail retrieval.\
    \ These can be used to connect to your local server, as well as Web-based mail\
    \ servers such as Gmail. POP3 is the latest approved standard release of POP,\
    \ and has addressed some of the security"
  merge: -1
  img_proc: true
- pgno: 292
  md: "issues that were inherent in the original releases. POP4 has been developed,\
    \ but is not an approved standard at the time of writing. However, it is still\
    \ not totally secure, and care should be taken when using it across an unsecured\
    \ network.\n\nThe IMAP protocol has gained in popularity over the years, and is\
    \ now offered by Web providers such as Gmail (as well as POP3) and for local servers\
    \ such as Microsoft Exchange. IMAP will be much faster to download mail on a local\
    \ network compared with POP3.\n\n# How Mail Works\n\nAny mail server in your organization\
    \ will ideally need to handle both incoming and outgoing mails. The mail arrives\
    \ at your mail server for the domain(s) it looks after, defined in part by the\
    \ DNS MX record. Users within this domain will have usernames associated with\
    \ their mail account. While you may find it useful to give people their first\
    \ name like Fred and Mary, this will not work when the company grows larger. It\
    \ is therefore useful to define a scheme before setting up the server, perhaps\
    \ first.lastname (or whatever works for your organization). The full e-mail address\
    \ will then be username@your domain. E-mail will then be stored on the server\
    \ until the user successfully retrieves them using an e-mail client.\n\nOutgoing\
    \ mail will be handled slightly differently. If a user sends an e-mail destined\
    \ for a local user, the mail server will simply put the e-mail in the appropriate\
    \ user’s mailbox, where they can retrieve it as above. If it is for someone outside\
    \ the domain, the mail server will look up the MX record of the target domain\
    \ and then try to send or relay the mail message to that server.\n\n# Sendmail\n\
    \nSendmail has been around for a number of years and has grown in complexity to\
    \ keep up with the demands of users in requiring more sophisticated mail. The\
    \ following sections will outline how to set up a sendmail server.\n\n# Starting\
    \ and Stopping Sendmail\n\nSendmail is usually started upon boot, but can also\
    \ be started and stopped afterwards. This is especially important when configuration\
    \ changes are made, as sendmail will only read the configuration file once when\
    \ it starts. The commands below are used to start, stop, and restart sendmail.\n\
    \n```\n```\n   service sendmail start\n   service sendmail stop\n   service sendmail\
    \ restart\n```\n```"
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Application Services 281


    # Sendmail Configuration


    The basics of sendmail configuration will be given here, but it should be noted
    that `sendmail` is very complex with whole books devoted to the correct set up.
    Mistakes in the sendmail configuration file can cause sendmail to stop processing
    mail, so performing a backup is advisable. The main sendmail configuration file
    is `sendmail.cf`, which is now normally located in `/etc/mail/sendmail.cf` (and
    in `/etc/sendmail.cf` in some older versions of Linux). This file can be edited
    directly, but the syntax can be confusing and, as stated above, mistakes may stop
    the server from working.


    A common method of producing the sendmail.cf file is through use of the m4 macro
    processor, which works on the configuration parameters in the file `/etc/mail/sendmail.mc`.
    While a lot easier than editing the sendmail.cf file directly, it is by no means
    simple. Methodical working through the file and observing the logs when you start
    sendmail are recommended. As the complete list of commands is large, we will concentrate
    on a few often-used ones.


    # Smart Hosts


    While the relative cost of an always-on Internet connection, such as cable or
    leased line, has reduced in the past few years, this is favored by a lot of companies.
    However, this is not the case in many parts of the world. In addition, what happens
    if you are trying to send e-mail to a company who has their e-mail server turned
    off? In these cases, you can configure `sendmail` to pass mail onto another sender
    rather than delivering it directly. In the sendmail.mc file, the following need
    to be added:


    ```

    ```

