- pgno: 330
  md: 'most modern network equipment limits the traffic that your individual work-station
    has to see. Most managed switches have an option to allow all traffic to be copied
    to a given port for monitoring and troubleshooting; enable this option on your
    switch to see the full power of *Wireshark*.


    The main *Wireshark* window is split into three panes. The top section shows one
    line for each packet; the middle section shows a textual description of each portion
    of a specific selected packet, and the bottom section shows the raw hex information
    for the same packet.


    Watching all the traffic can be fascinating, but overwhelming. *Wireshark* provides
    a complex way of filtering our traffic so don''t want to see based on specific
    hosts or protocols.


    Although *Wireshark* is clearly a fantastic network troubleshooting tool, it is
    also very useful for fixing network applications, such as client-server database
    problems, remote access authentication issues, and printing errors. Frequently,
    the client software hides error details from the user, and a lower level view
    is needed to isolate the real issue.


    As with the other tools, use *Wireshark* with care, as it is possible to view
    other user''s passwords or private information; keep in mind that many applications,
    including e-mail, don''t use encryption.


    More information about *Wireshark* can be found at www.wireshark.org.


    > **Note**

    > Although the command-line-based `tcpdump` isn''t as user friendly as *Wireshark*,
    it has a distinct advantage if you need to check traffic on a remote system using
    ssh. It offers identical filtering and capturing features and can be just the
    thing to quickly confirm whether your network packets are in fact reaching a remote
    system.


    # Nessus


    *Nessus* is a tool for testing networked systems for security vulnerabilities,
    which are defined as "any programming error or misconfiguration that could allow
    an intruder to gain unauthorized access." ${ }^{5}$ Previous versions were released
    under the GNU Public License (GPL) open source licence; any changes since release
    3 Nessus have been kept the proprietary property of Tenable Network Security,
    although they continue to make the *Nessus* tool available for no charge.


    *Nessus* can be installed and used by mere mortals, but it has the capability
    to scale by splitting up the part that does the scanning from the part that analyses
    the results, so you can install dedicated machines at remote sites and then centrally
    review the results.'
