- pgno: 137
  md: '# /proc


    The /proc filesystem is a virtual filesystem, which facilitates communication
    between the Linux kernel and the user processes. The /proc filesystem contains
    a number of directories that can organize the data below it and virtual files.
    Virtual files can be read from or written to the /proc filesystem as a method
    of communicating with specific entities in the kernel. The virtual files can share
    data from the user to the kernel or vice versa. It may present information in
    both directions, but it is not required to do so.


    There are a number of interesting files in the /proc filesystem – such as cp/
    info, which identifies the type and speed of the processor installed in the system;
    and modules, which identifies the currently loaded modules in the kernel. A typical
    listing of the directory is shown in Figure 5.1.


    The listing shows a series of numbered files at the left-hand part of the screen.
    These are directories for a process that is running on the computer. The directory
    labeled 1 is for the first process initiated, which will always be the init process.


