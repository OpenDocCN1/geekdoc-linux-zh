    # SUMMARY OF EXAM OBJECTIVES


    In this chapter, you reviewed the management of Linux filesystems. A filesystem
    provides the operating system with a framework (a structure) for the storage,
    organization, modification, removal, and retrieval of digital information. Filesystems
    are responsible for organizing and maintaining files, folders, metadata, and residual
    data as containers for storing digital information. Regardless of the selected
    filesystem type, data containers can be as large as TB in size or as small as
    a sector. In addition, you learned the different filesystem types that are available
    for local and network access (for example, SMB and NFS).


    Next, you learned about the mounting and unmounting of filesystems. This entailed
    learning that the Linux final system, unlike other operating systems, allows you
    to manually mount a filesystem or have it automatically mounted. For the manual
    mounting of filesystems, you learned about the Linux mount command and the Linux
    umount command to unmount a filesystem. Regarding the process for having filesystems
    automatically mounted, you reviewed the /etc/fstab file and how filesystems are
    included during Linux system initial boot-up.


    After mounting and unmounting filesystems, the chapter provides details about
    partitions. This included the design strategies, advantages and disadvantages
    for creating partitions, the typical partitions implemented, the use of the Linux
    fdisk command, and the use of the Linux fdisk command. The Linux fdisk command
    is used to create a partition. After creating a partition, a filesystem (for example,
    ext2, ext3, and ReiserFS) must be assigned to the filesystem. The Linux mkfs command
    assigns filesystem to the partition. After creating a filesystem, we discussed
