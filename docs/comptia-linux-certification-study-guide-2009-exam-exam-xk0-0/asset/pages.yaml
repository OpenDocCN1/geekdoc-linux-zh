  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_185_0.png)


    To look at not only CPU but also physical and network drive usage, you can use
    the iostat command, as shown in Figure 6.10.


    The various CPU-related statistics shown at the top of the report are as follows:


    +   - %user is the percentage of processor time spent on user applications.

    +   - %nice is the percentage of processor time spent on user applications that
    have been allowed to run at a lowered priority.

    +   - %system is the portion of processor time used by the system itself.

    +   - %iowait is the percentage of time the processor has been idle when the IO
    system has been busy. This is a good indication that you have a bottleneck somewhere
    in your hard drives.

    +   - %steal is related to virtualized systems.

    +   - %idle is the amount of process time spent doing nothing.


    The next section of the report shows statistics for drives attached to the system
    and includes the following:


    +   - tps (transfers per second) A transfer is considered as a request for data.

    +   - Blk_read/s, Blk_wrt/n/s Refer to blocks read and written per second, where
    a block is a sector of the hard disk, usually 512 bytes.

    +   - Blk_read, Blk_wrt/n Refer to total blocks read and written.'
