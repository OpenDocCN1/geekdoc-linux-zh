    +   - A Note about Hardware

    +   - Installing from Local Media

    +   - Installing across the Network

    +   - Laying Out the Filesystem

    +   - Disk Types


    # UNIQUE TERMS AND DEFINITIONS


    +   - **Logical volume manager (LVM)** LVM is a collection of programs that allow
    larger physical disks to be reassembled into “logical” disks that can be shrunk
    or expanded as data needs change.

    +   - **Network file system (NFS)** NFS is a protocol developed by Sun Microsystems
    that allows a computer to mount a volume that resides on a remote computer and
    access files from across the network as if they were stored locally.

    +   - **Redundant array of independent disks (RAID)** RAID is a form of technology
    available to Linux systems that uses your disk subsystem to provide enhanced read/write
    performance, protection against data lost due to disk failures, or both.'
