- pgno: 182
  md: 'Next is the amount of time the processor has spent on the process. The last
    is the “human readable” name of the process.


    The syntax for the ps command is as follows:


    ```

    ps [options]

    ```


    Some useful options include the following:


    +   - `-u or -user` The **username** or **user ID** will show processes associated
    with the given user.

    +   - `-C` The **command_name** will show processes that have the given command
    name.

    +   - `p, -p, or -pid` The **process_id** will show processes with the listed
    process ID. If *ps* is only given a number as an argument, it assumes the number
    is a process ID.

    +   - `-t, -tty` The **ttylist** will show processes on a given tty interface
    port. A plain “-” will show processes not associated with a port, and a -t without
    a tty number will assume you want the processes associated with the current port
    you are using.

    +   - `-M or Z` [note no dash with the *Z*.] It shows extra security data associated
    with SELinux, discussed in Chapter 10, “Securing Linux.”

    +   - `-f` will show processes somewhat graphically associated with the parent
    process that started them.


    # **kill**


    Occasionally a process will get stuck, or “hang,” and it’s necessary to force-fully
    end it. A command for this is **kill**. The **kill** command uses the process
    id, not the name – to end a process, it’s necessary to use the *ps* command to
    find the process number, then use *kill* to terminate it. One shortcut you can
    use is the *killall* command, which will terminate a process by name instead of
    PID. However, notice that multiple instances of the same program will have unique
    process IDs, but will have the same name, so it may be difficult to determine
    which one you want to end.


    The **kill** command works by sending a *signal* to the process, which by default
    tells the process to terminate by sending the **TERM** signal. It can also be
    used to send different signals, the most common of which are subtle varieties
    of **TERM** which offer varying emphasis. The syntax for signals is *kill -s [signal]
    PID* – for *example*, *kill -s KILL 2727* or *kill -s HUP 3143*.


    Signals typically used with the **kill** command, as described in “The Linux Administration
    Handbook,”² are as follows:'
  merge: -1
  img_proc: true
- pgno: 183
  md: "* `KILL` (signal number 9) cannot be blocked by the process. It essentially\
    \ tells the kernel to clobber the program.\n\n* `INT` (signal number 2) is the\
    \ interrupt signal, the same as typing `Ctrl + c`. It allows a user to get the\
    \ attention of a program, stop what it is doing and wait for more user input,\
    \ or quit gracefully.\n\n* `TERM` (signal number 15) is a nice request for a program\
    \ to finish up and quit normally.\n\n* `HUP` (signal number 1) came from the days\
    \ of serial terminals and is used to mean “hangup.” Today, it is most often used\
    \ to request that a program take a moment to re-read its configuration files,\
    \ without actually unloading and restarting the entire program. You may occasionally\
    \ see a command issued with a nohup option, which tells the program to keep running\
    \ even if the terminal that started it is closed, so if you open a terminal window\
    \ to start a service it won’t quit when you close the window.\n\n* `QUIT`(signal\
    \ number 3) is the same as TERM, but it can cause a program to copy the memory\
    \ it was using to a diagnostic file, which can be useful for troubleshooting.\n\
    \n> **Note**\n> \n> There is an alternate syntax that leaves off the “s,” like\
    \ this:\n> \n> ```\n> kill-HUP 5253\n> ```\n> or\n> ```\n> kill-INT 76\n> ```\n\
    \nSignals can also be used to communicate between processes or by the kernel to\
    \ report an event or problem back to a process.\n\n# top\n\nA more versatile utility\
    \ is top, which will dynamically show running processes in real time, sorted by\
    \ the amount of CPU time they are using (as seen in Figure 6.9).\n\nThe upper\
    \ section of the top display shows a summary of the system, including uptime,\
    \ current users (each bash session counts as a user), and various load and memory\
    \ usage statistics. The lower part of the display shows the process ID, owner,\
    \ amounts of various memory, and CPU resources being"
  merge: -1
