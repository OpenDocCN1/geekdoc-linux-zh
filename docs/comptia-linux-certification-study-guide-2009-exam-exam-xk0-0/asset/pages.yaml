  md: '# Loopback Devices


    The Linux operating system offers support for an additional unique type of filesystem.
    This type of filesystem is known as the loopback filesystem. Most Linux distributions
    have the loopback device compiled into the kernel. The kernel supports the transformation
    of a special file containing an image of another filesystem into a device that
    can be used like any other Linux partition or device. Linux loopback devices are
    commonly used for CD/DVD ISO images. The disk image created of the CD/DVD disc
    contains the UDF or ISO 9660 filesystem format. Prior to accessing the loopback
    device, the ISO image must be downloaded and mounted. The Linux mount command
    is used to attach the virtual filesystem image.


    # EXERCISE 3.6: Mounting an ISO Filesystem


    For this exercise, you will mount a ISO image file that contains a mini Linux
    filesystem.


    +   - For this exercise, we will use the following:

    +     - **Server/Domain Name:** http://download.opensuse.org

    +     - **Directory/Folder Location:** distribution/11.1/repo/oss/

    +   - Complete the following:

    +     1. Open a Web browser from a workstation and navigate to http://software.opensuse.org/.

    +     2. Follow the instructions to download the openSUSE 11.1 network installation
    Boot CD. The downloaded network installation file is an .iso image that contains
    a bootable Linux distribution. Save the file as MiniCD.iso.

    +     3. From the root command prompt, to create a mount point directory, enter
    the following command: `mkdir -p /mnt/diskl`.

    +     4. Press the **Enter** (Return) key.

    +     5. Enter the next command to mount the MiniCD.iso file. `mount -o loop MiniCD1.iso
    /mnt/diskl`

    +     6. Press the **Enter** (Return) key.

    +     7. Enter the command to change to the new filesystem contained inside the
    MiniCD.iso file: `cd /mnt/diskl`.

    +     8. Press the **Enter** (Return) key.

    +     9. Type the following command to list the contents of the filesystem: `ls
    -l`.

    +     10. Press the **Enter** (Return) key.'
