  md: "There are a bewildering number of available commands within *info*, but the\
    \ basics are as follows:\n\n+   1. The **arrow keys** move up and down by a single\
    \ line within a node (*page*).   \n+   2. The **Spacebar** and **Page Down** keys\
    \ move down the node a screen at a time, and will jump to the next node when you\
    \ reach the bottom.   \n+   3. The **Backspace** and **Page Up** keys will move\
    \ up the node a screen at a time, and will jump to the previous node if you are\
    \ at the top.   \n+   4. If there are a series of nodes, *n* will move to the\
    \ next node and *p* will move to the previous one.   \n+   5. The **Tab** key\
    \ will jump between hyperlinks within a node, and the **Enter** key will follow\
    \ the link.   \n+   6. When finished, use the *q* key to quit *info*.\n\n> **Exam\
    \ Warning**\n> \n> Remember that when you are taking the Linux+ exam, you'll have\
    \ to *know* about the Linux documentation systems – but unfortunately, you won't\
    \ have access to them.\n\n# ### Using Virtual Consoles\n\nLinux, having its roots\
    \ in giant multUSER UNIX systems, is designed to handle many users at the same\
    \ time. That isn't generally how PCs are used now, but it's still handy to have\
    \ the option. Each Linux system runs seven simultaneous virtual consoles – just\
    \ like there were eight screens connected to the computer all at the same time.\
    \ From the standard *Xwindows* graphical environment press and hold `<Ctrl>+<Alt>`\
    \ and then `<F1>` through `<F7>` to access the virtual consoles screens 1 – 7.\
    \ Note that screen one has the boot log information – if you want to monitor what\
    \ the system is doing as it boots and it only shows you a pretty boot screen,\
    \ you can press `<Ctrl>+<Alt>+<F1>` to see what is really happening. The boot\
    \ log information is also available in the */var/log/* directory – see Chapter\
    \ 11, “Troubleshooting and Maintaining Linux” to read about analyzing system logs.\
    \ The *Xwindows* system runs in screen seven, so pressing `<Ctrl>+<Alt>+<F7>`\
    \ brings you back to the *GUI environment*, if one is running.\n\nThe single handiest\
    \ use for virtual consoles is to kill a hung application that has somehow messed\
    \ up your GUI. Simply pop over to a free virtual console, log in, run *top* or\
