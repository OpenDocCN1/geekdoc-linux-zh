  md: "+   You can perform searches forward with the `/` key, followed by the text\
    \ you’d like to search for. Use `?` to search backwards instead.\n\n+   The period\
    \ (.) will repeat the last edit command.\n\nTo transition to Edit mode, use the\
    \ `i` key to insert text in front of the current cursor position, or `o` to insert\
    \ text onto a new line below the line the cursor is on. Once in *Edit* mode, you\
    \ can type text as you normally would. Press the Esc key to get back to Ex mode.\n\
    \nWhen you are finished moving and editing, you can press the colon key (`:`)\
    \ to go to *command* mode. From *command* mode you can:\n\n+   perform a search\
    \ and replace by typing:\n\n```\n:%s/some_old_text/some_new_text/g\n```\n\n`s`\
    \ is the search function (in the forward direction), the `%` tells it to search\
    \ all lines, and the trailing `g` makes the change globally (instead of just the\
    \ first instance found).\n\n+   Save and exit the file by using `wq`. The `w`\
    \ writes the file; the `q` quits. To quit without saving, use `q!`.\n\n+   Get\
    \ help from within `vi` by typing `help` at the `:` prompt. You can add a command\
    \ you would like specific help with after the `help` to go straight to that section.\n\
    \nYou can also go through a built-in `vi` tutorial by typing `vimtutor` at a command\
    \ prompt. Lots of additional useful information about more advanced features is\
    \ available on the vim home page at www.vim.org.\n\n# ## Managing Processes\n\n\
    Every program, utility, or bit of code waiting in the background on your Linux\
    \ machine is called a *process* and is automatically handled by the kernel. Users\
    \ can monitor and manage their own processes; system administrators have access\
    \ to nearly all processes. Process management tools allow you to see what your\
    \ machine is doing, adjust the priority of each process, and even terminate them.\n\
    \n> **Note**\n> \n> You can’t kill the init process. On top of that, sometimes\
    \ processes get stuck and nothing you do will kill them. Finally, zombie processes\
    \ are notoriously hard to get rid of. All that being said, the only process that\
    \ `root` can’t `kill` is pid `1`, the init process.\n\nThe two main utilities\
    \ for viewing processes are `ps` and `top`."
