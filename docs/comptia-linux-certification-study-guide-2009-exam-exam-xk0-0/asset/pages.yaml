- pgno: 145
  md: 'through 65535 can be used dynamically by applications. A brief description
    of these follows.


    +   - **Port 20 and 21** These are for FTP data and FTP control, respectively.
    Both of these are required to be open on a firewall to allow FTP to work correctly.


    +   - **Port 22** This is for the remote login protocol Secure Shell (SSH) and
    is the preferred method of connecting to a system due to its additional security.


    +   - **Port 23**: Telnet. This is used for accessing system remotely. It is not
    very secure and should only be used for local hosts.


    +   - **Port 25** This is the Simple Mail Transfer Protocol (SMTP), which is the
    *de facto* standard for electronic mail across IP networks and is used from server
    to server.


    +   - **Port 53** This is the DNS protocol, which translates names into actual
    IP addresses.


    +   - **Port 80** This is used for accessing Web servers as described above.


    +   - **Port 110** This is used by the Post Office Protocol (POP) service. The
    current version is POP3 and is used by local e-mail clients to retrieve mail from
    servers.


    +   - **Port 123** This is the NTP, which allows clients to synchronize their
    time with remote time servers to ensure that all systems have a consistent time.


    +   - **Port 143** Modern e-mail clients use the Internet Message Access Protocol
    (IMAP) to retrieve mail from servers. This is becoming more prevalent than POP3.


    +   - **Port 443** This is the Hypertext Transfer Protocol Secure that combines
    the HTTP protocol with a cryptographic protocol, which can be used for payment
    transactions and other secure transmission of data from Web pages.


    +   - **Port 631** This is the Internet Printing Protocol (IPP). Clients can use
    this to print to printers located remotely on the network.


    +   - **Port 3306** This is the standard port for MySQL, the standard database
    used by Linux.


    These ports are defined in the `/etc/services` file on Linux systems.'
