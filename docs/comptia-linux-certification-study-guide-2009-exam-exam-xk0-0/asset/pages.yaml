    +   1. From the `root` command prompt, enter the following: `mount /dev/sdb1 /mnt/morestorage.`

    +   2. Press the **Enter** [Return] key.

    +   3. To display the mounted devices enter the following: `mount`.

    +   4. Press the **Enter** [Return] key.

    +   5. To unmount the device, enter the following `umount /mnt/morestorage`.

    +   6. Press the **Enter** [Return] key.


    # PARTITIONS


    To implement an effective and efficient Linux storage device infrastructure, the
    Linux professional must understand the Linux filesystem triad, as shown in Figure
    3.4. Partitioning, as implemented in Chapter 2, is the allocation of electronic
    storage space within a storage device into separate data areas for a specific
    filesystem type. Whether implemented through a partition editor tool or through
    the Linux `fdisk` command, partitions can be created, deleted, or modified. The
    folder and file creation and placement process cannot occur until after the partitioning
    and formatting of the storage device.'
