  md: "> **Note**\n> \n> `iostat` isn’t part of the default openSUSE installation.\
    \ To install it, type the following at the command line:\n> \n> ```\n>     sudo\
    \ zypper install systat\n> ```\n\n# nice\n\nLinux process controls not only let\
    \ you start and stop a process, but also allow you to make it run faster or slower.\
    \ On old multisuer UNIX systems, a user could set a parameter that told the kernel\
    \ how and what priority to assign a process; a lower priority means the program\
    \ would go slower, but the CPU would be available to run other users programs\
    \ faster. The priority is a number between −20 and +19, and is called a *niceness\
    \ value* (since sharing resources is nice, right?). The lower the niceness value,\
    \ the less nice your process is, and the faster it runs as it selfishly hogs the\
    \ system. The `ps -Al` will show niceness in the `NI` column.\n\nThe niceness\
    \ of a process is inherited from the parent process. The owner of a process can\
    \ make it “more nice” (making it run slower and freeing up resources), but isn’t\
    \ allowed to make it less nice; only a system administrator can do that. There\
    \ are two ways to adjust the niceness of a file: `nice` and `renice`. To start\
    \ a program with an adjusted *nice* value, type the following:\n\n```\nnice -n\
    \ 10 find / -name my_file.doc\n```\n\nThis will start a reduced priority file\
    \ search of the entire hard drive [which will give you plenty of time to do a\
    \ `ps -Al | grep find` in another terminal window to confirm if it really has\
    \ a niceness of 10]. Once the process is running, it can be reset to a specific\
    \ value with root access and `renice` like this:\n\n```\nsudo renice 15 [PID]\n\
    ```\n\nUse the PID from the `ps -Al` command you just did. Notice that the `nice`\
    \ command adjusts the niceness value by the given amount, whereas the `renice`\
    \ command sets it to the exact number given. You can also adjust *all* the processes\
    \ that belong to a single user instead of just a single process ID, like this:\n\
    \n```\nsudo renice -20 -u username\n```\n\nThat wouldn’t be very nice at all!\
    \ When you are finished playing with niceness, you might want to issue a **Ctrl\
    \ + c** to end the `find` command."
  merge: -1
