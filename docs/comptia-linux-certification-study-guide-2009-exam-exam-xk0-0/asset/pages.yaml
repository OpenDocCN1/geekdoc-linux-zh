    # UNIQUE TERMS AND DEFINITIONS


    +   - **Bourne again shell (BASH)** The sh-compatible command line interpreter
    that executes commands read from the standard input or from a file. It is the
    default shell on most Linux distributions.


    +   - **Command line interpreter** or **Command line interface (CLI)** A full-screen
    or windowed text-mode session where the user executes programs by typing in commands
    with or without parameters. The CLI displays output text from the operating system
    or program and provides a command prompt for user input.


    +   - **Graphical user interface (GUI)** A design for the part of a program that
    interacts with the use and uses icons to represent features of programs. GUIs
    typically work with “mouse-able” interfaces with pull-down menus, dialog boxes,
    check boxes radio buttons, drop-down list boxes, scroll bars, scroll boxes, and
    the like.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   * **Process ID (PID)** A unique number assigned when a new process (program)
    is started, and used to reference that process.

    +   * **Parent process ID (PPID)** The PID of the process that spawned (started)
    a new process.


    # INTRODUCTION


    Some people claim Linux is inferior due to its extensive use of the command line
    interface (CLI). While newer versions of Linux have made it increasingly easier
    to avoid using it, the power and versatility of the command line is one of the
    key strengths in the entire system, if you are willing to invest the time to really
    learn it. It reminds me of “The Force” – surrounding all things and binding them.
    The command line is your light saber, “an elegant weapon from a more civilized
    age,”\( ^{1} \) but formidable in the hands of a Linux Jedi. Step forward and
    begin your training!


    Hyperbole? Maybe, but the command line has a number of strengths. It is easily
    scripted for repetitive tasks, which can then be scheduled and implemented across
    multiple machines – a key advantage for administrators of multiple systems. It
    is consistent across different distributions and versions, different desktops,
    and window managers. It is straightforward to manage through remote access (ssh),
    and ubiquitous – the exam assumes you will be managing a desktop or server, but
    Linux is showing up in countless embedded appliances, and their full power is
    seldom available from the graphic interface basic users are allowed to see. A
    commanding knowledge of the CLI is the key to passing the Linux+ exam and will
    distinguish you as a valuable asset in any company. Be warned, though: like any
    powerful tool, it can also wreak untold havoc if you don’t know what you are doing.


    So, what is BASH, exactly? It’s a command interpreter, a way for a user to submit
    instructions to the computer. One of the original UNIX shells was the “Bourne”
    shell, invoked with an “s h” (short for sh(1)). An updated version was developed
    and (a bit whimsically) called the “Bourne again shell” [BASH].


    > **Note**

    > Although BASH has evolved into the current standard in most Linux, BSD, and
    OSX (since v10.3), there are several other shells to choose from. Other popular
    ones are zsh; ksh (“korn” shell); and “csh” (see shell), which uses syntax and
    scripting common to the “C” programming language, so it’s popular with C/C++ programmers.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'If you''d like to try some of the others, use your favorite package manager
    to install one, and invoke it from BASH by typing zsh, ksh, or csh. Bash is cleverly
    named, “bash.” The shell setting can be made permanent per user by editing the
    users'' /etc/passwd file. On a typical Linux installation, “sh” is a link to /usr/bin/bash.


    # BASH COMMANDS


    How do you get to a command line? If you haven''t installed a graphical user interface
    (GUI), the system will boot you directly into a command shell. Otherwise, you''ll
    have to find your systems terminal program. In the version of openSUSE used in
    this book, it''s called Terminal and located at the bottom of the list of programs
    that pops up when you click on the green lizard start button on the bottom left
    corner of the screen, as shown in Figure 6.1.


    The terminal program is used so often that you may find it convenient to drag
    the Terminal icon to the taskbar for more direct access.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_165_0.png)


