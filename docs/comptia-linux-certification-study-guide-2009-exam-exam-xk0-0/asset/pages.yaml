    +   * **Password** The password grants access to the system. Passwords can be
    alphanumeric and are case sensitive. They should not contain any accented characters
    or umlauts. If you enter a password that is easy to guess (for example, dictionary
    word, user’s last name), the system will provide you with a warning. This occurs
    because the system automatically checks for weak passwords.


