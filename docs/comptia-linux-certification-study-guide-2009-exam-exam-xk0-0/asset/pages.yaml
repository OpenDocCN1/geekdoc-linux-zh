  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_167_0.png)


    # **FIGURE 6.2**


    *The KDE “konsole” windows; power at your fingertips.*


    by entering `1s` (*to list things*). Enter `1s` with a path to see the contents
    of other directories (try `1s /`, `1s /etc`), and use `cd` (*change directory*)
    to change your current working directory (`cd`, `cd /etc` – try using `pwd` and
    `1s` in each directory as you move about).


    If you find yourself frequently jumping back and forth between directories, you
    may find it handy to use `pushd` and `popd` as an easy way to save a directory
    (or several). These utilities work like a stack of index cards. Think of `pushd`
    as writing a directory on an index card and placing it on a stack, and `popd`
    as picking up the card on the top of the stack and changing to that directory.
    Try `pushd /var/log` and notice that the current directory is now `/var/log`.


    When you first open a terminal window, it will give you a command prompt, which
    is typically your machine name and username, or maybe your current directory ending
    with a `$` for a normal user or a `#` if you are running as “root” (the administrator
    account) – see Figure 6.2.


    # ## Using File Commands


    The Linux file structure, like most computer systems, is a series of files, folders,
    and subfolders. Unlike Microsoft-based systems, there is no concept of “drive
    letter” – no `C:`. The very “top” of the files is the *root* directory – think'
