    # lmhosts File


    The lmhosts file is built into Samba and is the NetBIOS name to IP address mapping,
    in a similar format to the /etc/hosts file. The file is located in the /etc/samba
    or /usr/local/samba/lib directories.


    # Managing a Samba Server


    The Samba server has a number of daemons (notably nmbd and smbd) that need to
    be started. Once Samba is installed correctly, these will be started automatically
    upon boot and will read the smb.conf file described above. Once started, the server
    can be managed from the command line or through a GUI. The command-line interface
    is very easy to use, and the main command is smbstatus. The command can be issued
    with no options to display the full status of the servers and connected clients.
    In a large network, this will likely produce a large amount of output, so some
    of the options described below in Table 9.3 smbstatus options would likely be
    used.


    # Connecting to a Samba Server


    As stated earlier, both Microsoft Windows and Linux clients can connect to a Samba
    server. Assume that there is a Samba server located on the server synergss, and
    this has shared the home directories of users as well as the documents share.
    If your username is rosie, you can map a drive on Windows to your home using the
    command line:


    ```

    Net use h: \\synegress\rosie

    ```


    You could also browse for the share within the network neighborhood option within
    Windows. If you have set up security on this share, you may be prompted to input
    your password to gain access.


    Table 9.3 smbstatus Options


    | Option | Description |

    | :--- | :--- |

    | -b | Displays the list of users who are currently connected to the Samba server
    |

    | -s | Displays the list of connected shares |

    | -L | Displays the files that are currently locked |

    | -u username | Displays information on the user *username* |

    | -p | Displays a list of the smbd processes |'
