    \ and even some network printers. Your Linux system can be configured to collect\
    \ all these logs into a single central location to make it easier to sort through\
    \ and manage them. It is also advisable to have other Linux systems pass their\
    \ syslog information to a separate machine. If someone should break into your\
    \ system, they may be able to cover their tracks by altering the local system\
    \ logs, but they may not be able to break into a separate machine to change the\
    \ logs there. This can also be useful (in case of hardware failures) to trace\
