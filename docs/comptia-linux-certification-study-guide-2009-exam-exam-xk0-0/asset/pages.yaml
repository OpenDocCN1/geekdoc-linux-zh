  md: '# **DHCP Setup and Configuration**


    For the majority of devices, the use of DHCP will be the preferred option. For
    small networks, these addresses are often obtained from the broadband router or
    similar device. For larger corporations, the use of DHCP is preferred to reduce
    the support and maintenance overhead of using static addresses.


    The host running DHCP obtains an IP address by contacting a central server, which
    maintains the addresses for one or more subnets. Once the client has contacted
    the server, it will be assigned an IP address, subnet mask, and potentially other
    information such as the default route and IP address of the default name server.
    The information that is requested is listed in the configuration file /etc/dhclient.conf
    and is read upon startup, and will attempt to configure all the interfaces that
    are present on the system. The default is to require only the IP address configuration,
    although the domain name servers (DNSes) can also be required if the appropriate
    line is defined in the dhclient file.


    A command-line DHCP client can also be used to configure the network interface,
    called `dhcpd`, which is located in the `/etc` directory. The DNS information
    obtained from the server will be written to the `resolvconf` or, if unavailable,
    directly to `/etc/resolv.conf`. In larger networks, the DHCP server may also supply
    configuration data for NFS and Network Time Protocol (NTP), and these will be
    stored in `/etc/y.p` conf and `/etc/ntpd.conf`. These services will also be stopped
    and started by `dhcpd` to ensure they are notified of the change.


    For support reason, a number of other options are useful with the `dhcpd` command:


    +   - `--release` releases the current lease from the host and deconfigures the
    interface.

    +   - `--renew` will attempt to renew the lease. These two commands are often
    down sequentially to check the connection to the DHCP server.

    +   - `--nogateway` will restrict any duplication of the default route.

    +   - `--nonntp` will stop the ntp being updated, `/etc/ntp.conf`

    +   - `--nodns` is used to stop the DNS information being updated in `/etc/resolvconf`


    A DHCP alternative client is `dhclient`, which runs on startup and reads the `/etc/dhclient.conf`
    file to read its configuration instructions. This file will contain a list of
    all the network interfaces that are configured in the current system. These will,
    if necessary, be configured with the dhclient. If the interface is configured
    using this client, it stores the DHCP lease in the'
  merge: -1
