  md: '# Learn By Example: The Hard Way!


    An online customer contacted me concerning the performance of a Linux server that
    always crashes intermittently each month. As always, I started the engagement
    after the signing of the contract to commence my analysis. I reviewed the customer’s
    intrusion- detection logs, antivirus logs, firewall logs, application logs, logs
    located in the /var directory, and I even interviewed the Linux administrator.


    After careful review, I found the problem. I informed the customer that I had
    good news and bad news. For the good news, the problem can be resolved quickly.
    It appears that a certain user within the IT department (the Linux administrator),
    on new movie release days (mostly on Fridays), downloads a pirated copy of the
    movie through the Internet. The individual saves the movie file on the server
    and burns a DVD copy to take home. The server performance degradation occurred
    because the server’s disk partitions and swap space was at capacity. Periodically,
    to make space the Linux administrator would delete system and user files to increase
    disk space.


    The solution to the problem was to readdress disk space allocation, separate user
    files and swap space from the root (/) directory, create disk quotas for all users,
    and conduct routine system-wide filesystem management for all users (especially
    root users). In addition, conduct periodic independent security assessment reviews
    of the entire Linux server environment.


    Oh! What about the bad news? I informed the customer that the Linux administrator
    has been ignoring requests from the Recording Industry Association of America
    (RIAA) for the last 2 years, and the RIAA has already filed a motion with the
    court to conduct an electronic discovery. The RIAA is group representing the recording
    industry distributors in the United States and is very concerned about intellectual
    property (IP) piracy.


    # Checking Disk Usage


    A task that all system administrators perform is constant-file management. This
    form of management commences with the ability to review disk space used at the
    partition level, the directory level, and down to the file level. The Linux du
    command provides a summary of disk space used by file in the current directory
    and disk space allocated for files contained in any subdirectories. For example,
    when the Linux du command is executed from within a user’s home directory, the
    command will display how much disk space that directory is occupying and any subdirectories
    underneath the user’s home directory.


    The Linux df command provides summary of the amount of disk space available on
    a filesystem. The Linux df command can present disk space availability in many
    different ways by using different arguments. The df -i argument presents display
    information about inodes rather that file blocks. The df -h, see Figure 3.8, presents
    disk space summary in a easy-to-understand output format using kilobytes, megabytes,
    and/or gigabytes.'
