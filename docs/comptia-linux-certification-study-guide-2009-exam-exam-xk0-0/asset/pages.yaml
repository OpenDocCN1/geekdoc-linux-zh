    # ## Testing Files


    Finally we come to ways to test files with the `file`, `test`, and `ls -F` commands.


    Although files frequently have an extension to help indicate what they contain
    (`.mp3` for music or `.jpg` for pictures), they may not be so obvious. Luckily,
    Linux provides the `file` command to help sort through things [see Figure 6.6].
    Of course you would never forget what type of file you made, but it can be very
    useful if you need to sort through user directories, or want to confirm a file
    is the type you expect before running it through a script.


    The `file` command has a syntax, which is simply `file [filename]`, and it accepts
    all the standard wildcards.


    The `test` command can evaluate expressions, as in `test 1 -gt 2`. It isn''t intended
    for use on the command line, so the answer is returned as an `exit value` that
