  md: 'each process. Whichever package type you need to install, each program will
    usually have one or more associated libraries or support packages that have to
    be installed with it to make it work. These additional packages are called *dependencies*
    as the main program is dependent on these to work. If you already have these dependencies
    installed, then you do not have to reinstall them. This differs to installing
    a program under Microsoft Windows which will have everything bundled into one
    file, and often multiple versions of a particular library may be loaded on the
    same system, just in a different location.


    In principal, there are two types of packages: *binary packages* and *source packages*.
    The source packages will need to be compiled and built for your system while the
    binary packages have already been compiled for a specific installation. Obviously,
    the binary packages cannot easily be modified to suit any specific need you may
    have, but, in general, these are much easier to install, especially for a novice
    user. The utilities that distribute and manage the binaries for a particular distribution
    are called *package managers*. The various packages can be identified by their
    suffix as shown in Table 7.1 below.


    The packages can be found individually on various Web sites or on installation
    disk, but also in *software repositories*. These are locations where the software
    packages can be found, downloaded, and installed on your computer. These repositories
    can vary from having a small number of packages [even one] on them, or with a
    whole operating system on them. For instance, the packages for Debian GNU/Linux
    can be found here: www.debian.org/distrib/packages.


    Within this chapter, we will concentrate on the two main packages, rpm and deb
    and also how to compile and build the software from the source files. These will
    give you the grounding you need to tackle some of the other less well used formats
    should you need to.


    | Table 7.1 | Linux Package Formats |

    |---|---|

    | .rpm | RPM package manager is used by Red Hat, openSUSE, Mandriva Linux, Mandrake,
    and many more. |

    | _urpm | Extended form of rpm is used by later versions of Mandriva. |

    | .deb | Debian package is used by Debian and Ubuntu, Knoppix. |

    | tgz or tar.gz | tar and gzip package is used by Slackware. |

    | Other | Lots of others, mainly for the smaller distros. |'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# **Red Hat Package Manager**


    RPM has a long history, and was first used back in 1995 with Red Hat Linux 2.0.
    RPM stands for Red Hat package manager, which is a recursive acronym. Within version
    3.0 of Red Hat Linux, RPM was completely redesigned and rewritten in C, and has
    been a feature of this and a number of other distributions ever since. The early
    versions of the software were limited to the command line only, but now there
    are graphical user interfaces (GUIs) available for most of the distributions that
    use it. The basic rpm file is a precompiled binary package bundled with a script
    file that minimizes the knowledge the end-user needs.


    The Red Hat package manager is an overall system called RPM and this can be used
    to build, install, remove, modify, and verify the software archives or .rpm files.
    The rpm packages contain a complete archive of the files, along with a host of
    other information on the package, such as name, version, and checksums. In addition,
    there can be scripts included to install, upgrade, or remove the software, along
    with preinstallation and postinstallation scripts where necessary. The checksum
    is particularly useful as it can validate the binary and ensure that the software
    is free from viruses and trojans.


    The RPM system uses a database to hold and track all of this information, including
    the version of all the software that is installed. This basic information is held
    in the /var/lib/rpm directory and a sample listing of this directory is shown
    below:


    ```

    $ ls -l

    total 46184

    -rw-r--r-- 1 root root 2994176 2009-06-23 12:29 Basenames

    -rw-r--r-- 1 root root 12288 2009-06-23 12:29 Conflictname

    -rw-r--r-- 1 root root 0 2009-06-23 12:13 _db.0000

    -rw-r--r-- 1 root root 24576 2009-06-23 12:31 _db.001

    -rw-r--r-- 1 root root 180224 2009-06-23 12:31 _db.002

    -rw-r--r-- 1 root root 1318912 2009-06-23 12:31 _db.003

    -rw-r--r-- 1 root root 352256 2009-06-23 12:31 _db.004

    -rw-r--r-- 1 root root 1507328 2009-06-23 12:29 Dirnames

    -rw-r--r-- 1 root root 5302224 2009-06-23 12:29 Filedigests

    -rw-r--r-- 1 root root 32768 2009-06-23 12:29 Group

    -rw-r--r-- 1 root root 24576 2009-06-23 12:29 Installtid

    -rw-r--r-- 1 root root 45056 2009-06-23 12:29 Name

    -rw-r--r-- 1 root root 35545088 2009-06-23 12:29 Packages

    -rw-r--r-- 1 root root 331776 2009-06-23 12:29 Providename

    -rw-r--r-- 1 root root 118784 2009-06-23 12:29 Provideversion

    -rw-r--r-- 1 root root 12288 2008-11-19 14:17 Pubkeys

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_215_0.png)


    ```

    -rw-r--r-- 1 root root 503808 2009-06-23 12:29 Requirename

    -rw-r--r-- 1 root root 270336 2009-06-23 12:29 Requireversion

    -rw-r--r-- 1 root root 163840 2009-06-23 12:29 Sha1header

    -rw-r--r-- 1 root root 86016 2009-06-23 12:29 Sgmd5

    -rw-r--r-- 1 root root 12288 2009-06-23 12:29 Triggername

    ```


    The `/var/lib/rpm/packages` file is the primary database of all the installed
    software in the system and will grow depending on the number of packages you install.
    A file of $40 \mathrm{MB}$ or larger is not an unusual size for a fully loaded
    system. This directory is used by RPM to manage all the software and versions.


    The `rpm` package names are in a standard format and contain


    +   Package software name

    +   Version of the software

    +   The release number of the package

    +   Architecture the package was built for (for example, `i386`, `i686`, and so
    forth). The actual format will be as follows:

    +   `<package_name>-<version>-<release>.<arch>.rpm`


    As an example, the `rpm` for a `Telnet` package file, with a version of `0.17`
    and a release of `23` built for the `i386` platform would look like


    ```

    telnetd-0.17-23.i386.rpm

    ```


    # Command Line Tools


    Although the new `GUI` front-ends to `RPM` are easy, the mechanics behind the
    actual commands are masked and does not demonstrate the power of the `rpm` command.
    Both the `GUI` and the command line interface (`CLI`) are similar in one respect
    - they need to be executed by the `superuser` account. The basic operations that
    we will examine in the following sections are as follows:


    +   Installation of new software

    +   Removing (or erasing) packages

    +   Upgrading an existing package

    +   Verifying the installation of a package

    +   Information querying regarding an installed package'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 204 CHAPTER 7: Installing Applications


    While the actual number of command line options is far greater than this list,
    they all can be grouped into one of the above-mentioned sections. The basic format
    of the rpm command is


    ```

    `rpm option package_name`

    ```


    Taking the list above, the options for these basic operations are as follows:


    +   - i will install the package.

    +   - e will remove (erase) the package.

    +   - U will remove the installed package first and then install the new version.

    +   - V will verify the installation of the package.

    +   - q will query the package.


    Each of these can be combined with a number of other options to make the rpm command
    very powerful. The following sections will explore these options in more detail.


    # Package Installation


    Packages are installed as stated above using the -i option. A simple install of
    the earlier-specified Telnet package would, therefore, be


    ```

    `rpm -i telnetd-0.17-23.i386.rpm`

    ```


    There are a number of useful options that are often combined with the install
    option, as well as with the other options, namely -v, --quiet, and -h. The v option
    is for verbose and will give some useful feedback during the process. The --quiet
    option is the exact opposite - displays as little information as possible. The
    -h option will print a series of hash marks on the screen as the work proceeds,
    with the sole purpose of keeping you aware that something is still happening.


    When installing a package, you may not wish to have the documentation installed,
    and this is achieved using the --excludedocs option. Files can be forced to replace
    existing files using --replacefiles and -force can also be used to ensure the
    entire install is forced onto the system.


    # Package Updating


    Packages already installed on system can be upgraded to a later release using
    the -U option. This option will remove the old version, keeping any modified files
    such as the configuration files. It will then install the new version.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'To upgrade the earlier-specified Telnet package to version 18, release 5 the
    command to use is as follows:


    ```

    rpm -U telnetd-0.18-5.i386.rpm

    ```


    To see this upgrade in verbose mode and printing hash marks when the archive is
    unpacked, the command would look like


    ```

    rpm -Uvh telnetd-0.18-5-i386.rpm

    ```


    # Package Querying


    The query command, -q, will query the rpm database and give you data on the package.
    For instance, to find out about version of Firefox installed on the system, the
    following is used (showing the output):


    ```

    $ rpm -q firefox

    firefox-3-0-11-1.fc10.i386

    $

    ```


    Information on all the packages installed can easily be displayed using rpm -qa,
    but the output will be very long and should be piped through -more or redirected
    to a file.


    # Package Removing


    Packages already installed on a system can be removed, which you may want to do
    to conserve space or if there is a problem with the package. Packages can be considered
    to be removed or erased with the -e option. For instance, removing the earlier-specified
    Telnet package can be achieved thus:


    ```

    rpm -e telnetd-0.17-23.i386.rpm

    ```


    If you don''t want rpm to check dependencies before uninstalling the package,
    the following option can be added --nodeps. Another useful option is --test, which
    will go through the motions of the uninstall process, but will not actually delete
    anything.


    # Yellow Dog Updater Modified


    There is an automatic installation, removal, and update utility for rpm packages
    called *yellow dog updater modified* (yum). This was developed using the Python
    language, initially for the Fedora Linux distribution, and it is now part of the
    Fedora distribution. The latest version can be used with a GUI interface as well
    as the CLI. We will concentrate on the command line to completely understand the
    process.


    Fedora Linux provides a number of software repositories, and is preconfigured
    to work with three repositories:'
  merge: -1
  img_proc: true
