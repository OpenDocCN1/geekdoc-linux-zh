    \ time, so I’ve added the router’s name and address to the end of my /etc/hosts\
    \ file, and now Linux will resolve it by name.\n\nOne way to do this is to use\
    \ vi to edit the file. A G takes me straight to the end of the file, and an o\
    \ adds a line to the bottom; type the address and name, and a quick <Esc>:wq and\
    \ I’m done. Even quicker, though, is to use echo “10.10.10.1 router” >> /etc/hosts,\
    \ which automatically appends the information I need at the end of the file. Just\
    \ have to make sure I use two greater-than signs — just one will overwrite the\
