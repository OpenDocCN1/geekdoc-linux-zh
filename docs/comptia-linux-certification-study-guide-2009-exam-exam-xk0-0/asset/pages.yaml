  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_81_0.png)


    **FIGURE 3.4** *Linux filesystem triad.*


    The decision to implement one or more partitions per storage device is based on
    certain advantages and disadvantages. The following are the reasons to create
    multiple partitions on your storage device:


    +   ■ Improves access time for data and applications colocated on the same partition.


    +   ■ Supports the separation of user files and operating system files.


    +   ■ Provides dedicated operating system swap or system paging file space.


    +   ■ Protects operating system files from the rapid growth of system data files
    (for example, `logging`, system cache) that may consume all available disk space
    quickly.


    +   ■ Provides support for multibooting environments.


    +   ■ Provides a layer of isolation to prevent or protect one partition’s system
    resources from another partition’s system resources.


    +   ■ Allows the implementation of various filesystems and different disk geometry
    strategies to improve read and/or write performance.


    The Linux operating system, like most modern operating systems, supports the creation
    and use of multiple partitions. After creating a partition, a filesystem (for
    example, ext2, ext3, and ReiserFS) must be assigned to the filesystem. As presented
    in Chapter 2, this was implemented through a partition editor tool or through
    the Linux `mkfs` command. After the filesystem,'
