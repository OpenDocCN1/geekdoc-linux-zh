    # Special Devices


    You may have noticed some particularly unusual files when peeking into the `/dev`
    subdirectory:


    +   - /dev/null

    +   - /dev/random

    +   - /dev/zero

    +   - /dev/urandom


    The /dev/null file is often called the *bit bucket*, and is like having your own
    personal black hole. Any output you don’t need to see? Ever? Just redirect it
    to the bit bucket. This is most often used to hide unnecessary output from a program
    embedded in a script.


    The /dev/random file does just what it says: it’s the interface to the systems
    random number generator and will produce random numbers used to create very secure
    cryptographic keys. Creating true random numbers is difficult for a computer,
    though. Current Linux systems use noise from various device drivers and other
    nonrepeating information to maintain an “entropy'
