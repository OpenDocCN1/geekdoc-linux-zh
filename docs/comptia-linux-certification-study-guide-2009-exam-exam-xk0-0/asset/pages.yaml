- pgno: 16
  md: '# # CHAPTER 1: Introducing Linux+

    ## 4


    The book begins in Chapter 2, Installing Linux, with a walk through the installation
    process. Hardware compatibility is critical for a successful installation, although
    it is not the hassle that it once was because most hardware is supported in Linux
    now. The various local and across the wire installation methods are also discussed
    in detail. Laying out the filesystem is a crucial aspect of the installation process,
    and the various hardware and volume options are described. Once you actually have
    a filesystem, it needs to be maintained. Because of the breadth of the topic,
    managing the filesystem merits a chapter unto itself. In this chapter, the types
    of available filesystems, both local and network, are described as are the tools
    to use, manage, and repair them once they have been installed.


    The hope is that, once the installation process has been completed successfully,
    your Linux system actually boots up. It is always nice when that happens. Chapter
    4, Booting Linux, covers GRUB (the GRand Unified Boot-loader), the de facto standard
    Linux bootloader. GRUB can be configured to boot Linux using a number of different
    kernels or even other operating systems. Knowing GRUB configuration files and
    commands is important for the exam. Chapter 4 also describes the concept of runlevels
    and the init command, as well as how to troubleshoot boot problems.


    With a system that has booted, you can now start to tune and configure your base
    system, which is described in Chapter 4. This involves creating user profiles
    and establishing system and environment variables. It also involves configuring
    additional devices and hardware and establishing network connectivity. It is difficult
    to imagine any computer these days that is not connected to a network.


    Chapter 6, Using BASH, is a key chapter in this book because it covers how to
    use the BASH command-line interpreter (CLI) or BASH shell. A myriad of activities
    using bash commands are described, including directory navigation, file management,
    file editing with vi, process management, I/O redirection, using special devices,
    and accessing online help through system documentation. The Linux kernel, the
    core of the operating system, is also described as are basics of scripting, shell
    features, automating routine tasks, and managing services.


    > **Note**

    > As you are preparing your system, we recommend that you use BASH wherever possible
    and avoid using graphical user interface (GUI)-based tools. Working from the command
    line will give you a better understanding of how to perform system configuration
    and maintenance and what is happening "under the covers." Furthermore, the exam
    will only ask you about the use of bash commands, not GUI-based tools. You may
    even find that you prefer to work from the command line.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'If you follow the chapters in sequence, then you will install an operating
    system that is well laid out and configured, connected to a network and has no
    real purpose yet. Chapter 7, *Installing Applications*, is all about how to go
    about installing applications (hence, the clever chapter title) through a variety
    of available methods to transform your Linux system into a productive tool. In
    this chapter, you will learn how to install applications from soft- ware packages,
    using `rpm` for `.rpm` packages in Red Hat-based distributions and `dpkg` for
    `.deb` packages on Debian-based distributions, and from source code.


    Chapters 8 and 9 provide an overview of what is involved to configuring Linux
    as a workstation and as a server, respectively. Although there is much overlap
    in configuring your system as a workstation or as a server, we had to divide the
    objectives into two chapters to avoid repetition. For example, configuring printing
    is the same on a workstation and on a server, but it is only described in Chapter
    8. Chapter 8 also covers configuring the X Windows System and a display environment
    using the KDE and GDM window managers and working with multiple desktops. Chapter
    9 covers network ser- vices, such as Dynamic Host Configuration Protocol (DHCP),
    domain name system (DNS), Network Time Protocol (NTP), and Samba; Web services,
    such as Apache (HTTP), Tomcat, File Transfer Protocol (FTP), and Squid; and application
    services, such as mail and MySQL.


    Chapter 10 is another key chapter. There is a definite security focus to the exam,
    and this chapter, *Securing Linux*, brings all the listed security objec- tives
    into a single chapter. It begins with managing and monitoring user and group accounts,
    notably the `bash` commands for creating and modifying users and groups, and managing
    file permissions, including special permis- sions. Next, we move onto the basics
    of SELinux. The key to SELinux is to know its different operational modes and
    policies. Privilege escalation using `su` and `sudo`, and the required `/etc/sudoers`,
    is explained. Third, the selection of security applications and utilities is described,
    including `nmap`, `Wireshark`, `NESSUS`, `Snort`, and `Tripwire`. File integrity
    is essential to ensure against tam- pering, which necessitates the use of the
    following `chksum`, file verification, and encryption utilities: `md5sum`, `sha1sum`,
    and `gpg`. For those who cannot always be everywhere at once, remote access is
    available. CompTIA requires you to know both Secure Shell (SSH) and virtual network
    computing (VNC). Finally, a selection of *authentication* methods are explained,
    including Plu- gable Authentication Modules (PAM), Lightweight Directory Access
    Protocol (LDAP), network information system (NIS), Remote Authentication Dial-in
    User Service (RADIUS), and two-factor authentication.


    The final chapter, Chapter 11, is all about the care and feeding of a Linux system.
    This is arguably the most important thing you will do as a system'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'administrator and the thing that will keep you the busiest. Your available
    monitoring tools (**sar**, **top**, **iostat**, and **vmstat**, among others)
    will help you keep your finger on the pulse of your systems in the hopes of proactively
    correcting an system ills and avoiding any unexpected downtime. The vast number
    of available logs and the tools that are available for you to analyze them are
    essential for troubleshooting when things start to go wrong. Finally, backing
    up and restoring data is the key to your continued employment. For the exam, you
    are required to know how to back up or restore files using **tar**, **dump**,
    and **restore**, as well as synchronize files using **rsync**, create disk images
    using **dd**, and burn CDs and DVDs using **mkisofs** and **cdrecord**.


    # DIFFERENCES IN THE NEW VERSION OF THE EXAM


    As I said earlier in the chapter, all the authors have taken the latest version
    of the exam that was developed using the 2009 exam objectives. For those of you
    who took the 2004 version of the exam or who started preparing for the 2004 version
    and stopped when you found out that a new version was going to be released, there
    are important differences between the 2004 and 2009 version. According to CompTIA,
    the following list described the new objectives that will be covered in the 2009
    version of the Linux+ exam:


    # Application and Services


    +   3.4 Given a scenario, explain the purpose of the following Web-related services:
    Tomcat, Apache, and Squid


    +   3.5 Troubleshoot Web-related services using the following utilities: Commands:
    **curl**, **wget**, **ftp**, and **telnet**


    +   3.6 Given a scenario, troubleshoot common FTP problems active versus passive;
    ASCII versus binary


    +   3.7 Given a scenario, perform the following MySQL administrative tasks: Locate
    configuration file; starting and stopping; test the connection


    +   3.12 Given a scenario, troubleshoot NTP-related issues **/etc/ntp.conf**;
    **ntpdq**; **date**; **ntpq -p**


    # Networking


    +   4.4 Explain the different DNS record types and the process of DNS resolution
    Local resolution, TTL/caching, root name servers A, MX, PTR, CNAME, NS, TXT'
  merge: -1
