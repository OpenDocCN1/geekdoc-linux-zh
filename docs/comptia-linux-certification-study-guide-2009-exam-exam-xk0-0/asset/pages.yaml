  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_315_0.png)


    # FIGURE 10.5


    An example of a /etc/group file.


    The fields in the /etc/group file are also separated by colons and are as follows:


    +   - groupname

    +   - password

    +   - GID

    +   - members – separated by commas


    Again, there is nothing wrong with editing the file by hand, but the `groupmod`
