  md: '2. Your organization needs a Linux filesystem that supports journaling. Which
    filesystem supports journaling?


    +   - A. ext for VFAT

    +   - B. ext2

    +   - C. ext3

    +   - D. ext5


    Correct answer and explanation: C. Answer C is correct; ext3 does support journaling.


    Incorrect answers and explanations: A, B, and D. Answers A and D are incorrect
    because ext for VFAT and ext5 are not filesystems (they do not exist.) Answer
    B is incorrect because ext2 does not support journaling.


    3. Your organization has decided to implement RAID 5. What is the minimum number
    of hard disk drives required to support RAID 5?


    +   - A. Zero disk drives are required. RAID 5 does not exist.

    +   - B. Two disk drives are required.

    +   - C. Three disk drives are required.

    +   - D. One disk drive and a Tape Backup system are required.


    Correct answer and explanation: C. Answer C is correct because RAID 5 uses three
    disk drives to perform data striping and distributed parity striping.


    Incorrect answers and explanations: A, B, and D. Answer A is incorrect; RAID 5
    can be implemented within a Linux environment. Answer B is incorrect because RAID
    5 requires a third disk to implement distributed parity striping. Data Striping
    (RAID 0) and Mirroring (RAID 1) require only two disks to function. Answer D is
    incorrect; this is not a valid RAID implementation.


    4. Which protocol does not support the installation of Linux across a network?


    +   - A. HTTP

    +   - B. NFS

    +   - C. FTP

    +   - D. USB


    Correct answer and explanation: D. Answer D is correct; USB is not a protocol.
    It is an Industry Bus Architecture specification used to establish data transfer
    between a device attached to your workstation.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Incorrect answers and explanations: **A**, **B**, and **C**. Answers **A**,
    **B**, and **C** are incorrect; all three are protocols used to install Linux
    across a network.


    5. When installing a Linux distribution source across a network, which network
    protocol should you use for anonymous login support?


    +   **A.** SMTOP

    +   **B.** FTP

    +   **C.** Telnet

    +   **D.** LDAP


    Correct answer and explanation: **B**. Answer **B** is correct; the File Transfer
    Protocol supports anonymous logins.


    Incorrect answers and explanations: **A**, **C**, and **D**. Answers **A**, **C**,
    and **D** are incorrect; all three are protocols used for different purposes.
    SMTOP is the Simple Mail Transfer Protocol used to exchange e-mail. Telnet is
    a remote terminal emulation protocol used to access remote terminals on other
