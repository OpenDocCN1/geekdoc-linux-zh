    # EXERCISE 6.2: Scheduling a Task for Later


    In this exercise, we will demonstrate using the at and wget commands to download
    a file after-hours, so it doesn''t interfere with daytime Internet usage. To do
    this, use the following commands:


    +   1. Find the file you''d like to get. In Firefox, this is done by right-clicking
    and selecting **copy location** instead of clicking on the file to download it.


    +   2. At the command line type at 01:00 to schedule your download for 1:00 A.M.
    the next morning. When you press Enter, at comes back with a > prompt to ask what
    you''d like it to do at 01:00.


    +   3. At the prompt, type wget <space> and <Ctrl><Shift>v to paste the file location
    you copied from Firefox.


    +   4. Type <Ctrl>d to end. (You may need to enter <Ctrl>d twice.) If something
    goes wrong, you can type <Ctrl>c to cancel.


    +   5. Type atq to confirm you have a job queued up.


    Now your selected file will download as the user you were logged in as, into the
    directory you were in when you invoked at(at 01:00), when hopefully no one will
    complain that you are hogging all the bandwidth.


    # MANAGING SERVICES


    As a system administrator, one of your primary jobs is to manage services running
    on your systems. This involves installing and starting new services, reconfiguring
    and restarting services to make changes, and stopping services that may be having
    trouble. This section will describe how to perform these tasks through start-up
    scripts and from the command line.


    # /etc/init.d


    Services, or daemons, are just programs that the system starts itself. They run
    in the background and provide services for users, such as the Apache Web server
    or Postfix e-mail server. As described in the "Runlevels" section of Chapter 4,
    "Booting Linux," services are started when their assigned runlevel'
