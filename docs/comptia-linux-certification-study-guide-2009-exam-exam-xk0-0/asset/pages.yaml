    # Samba


    Samba will implement the basic CIFS services, namely


    +   - File and print services

    +   - Authentication and authorization

    +   - Name resolution

    +   - Browsing or service announcement


    Most end users will be interested in the file and print services; that is, the
    capability to share files between computers and to share printers. As with any
    system, a user may wish to share some of all their files and only allow certain
    users access (authentication and authorization). All of these are handled by the
    `smbd` daemon that is included within Samba.


    The other daemon included with Samba is `nmbd`, which is basically name resolution
    on a point-to-point or broadcast basis. This daemon essentially is using the NetBIOS
    protocol to undertake the tasks. In broadcast mode, a client will send out a request
    to all machines on the network; for example, asking who is running a particular
    service. This may cause a lot of network traffic; but as it is confined to the
    local LAN, it is not usually an issue.


    The other name resolution element of the `nmbd` daemon revolves around the NetBIOS
    Name Service (NBNS), or Microsoft''s implementation of this, called Windows Internet
    Name Service (WINS). Within NBNS, there is a master NBNS server, which holds the
    IP address and NetBIOS name of each client or server on the network. The NBNS
    server will act like a normal nameserver; and when a client sends a request to
    it about a particular client name, the NBNS server will return an IP address if
    it is in its database.


    The browsing or service announcement part of Samba is also handled by the `nmbd`
    daemon. This should not be confused with Web browsing, but'
