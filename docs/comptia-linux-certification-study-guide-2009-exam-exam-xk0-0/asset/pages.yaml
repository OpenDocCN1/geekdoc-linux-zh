  md: '+   ■ **Confirm password** The same password as entered above is reentered
    for confirmation.


    The screen also provides you with the option to assign the same password to the
    system administrator “root” account. For better security protection, it is best
    not to use the same password for both accounts. The user account can receive system
    errors, install package updates, and other critical messages normally made available
    for the system administrator by selecting the **Receive System Mail** option.
    The local mailbox, /var/spool/mail/username, where username is the login name
    of the selected user, is the directory in which mail messages are stored. The
    next option offers you the ability to set the **Automatic Login** feature to allow
    the system to automatically log you into the system whenever the system restarts
    (or reboots). For security reasons, this option should not be selected. It is
    necessary for Linux users to enter their usernames and passwords just in case
    they decide to store sensitive information on the system.


    Finally, you will be given the option to change your authentication and password
    encryption methods, as shown in Figure 2.11. The various authentication methods
    are as follows:


