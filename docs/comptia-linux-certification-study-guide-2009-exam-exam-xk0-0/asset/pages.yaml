    The general syntax for cdrecord is:


    ```

    cdrecord [general options] dev=[device address]

    [track options] [filename of CD or DVD image.iso, or individual file names]

    ```


    In our example, the device address is `0,0,0`; therefore, this is the basic syntax
    for burning the image file to the medium:


    ```

    cdrecord dev=0,0,0 [filename of CD or DVD image.iso]

    ```


    You could include additional options, such as `-eject` to eject the medium after
    the burn process, or a host of others depending on how much control you want to
    exert over the process. The `cdrecord` command is part of the `cdtools` suite
    of tools and has a rather descriptive `man` page that you can consult for further
    information.


    # SUMMARY OF EXAM OBJECTIVES


    It is fitting that all of the topics covered in this chapter fall at the end of
    the book. Until this point, you have spent your time preparing your Linux system
    for deployment in the wild. You have configured your hardware, installed Linux,
    made it useful with a few applications, and protected your system''s users by
    implementing security measures. This chapter was written to help you with the
    care and feeding of Linux on your computer. It makes little sense to go through
    all of the work it took to get your system to this point only to have it become
    sick and lifeless after a period of use because it was not maintained. Being able
    to actively monitor the computer, diagnose what is happening (and maybe even being
    able to prevent a breakdown), and taking care of the system''s and your users''
    valued files are critical activities for maintaining the health of your system.


    There are so many monitoring and measuring utilities available on Linux that there
    is no excuse not to monitor your system. Although the exam only focuses on the
    capabilities and the uses of `sar`, `iostat`, `vmstat`, `uptime`, and `top`, in
    reality, these programs only scratch the surface of what is available. The `sar`
    and `top` programs will produce detailed reports on how different components of
    your system are performing at specified intervals and in real time, respectively.
    You will want to pay special attention to the programs that calculate and display
    the load average: `top`, `w`, and `uptime`, among others.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Although monitoring will help you check up on how things are going with your
    system, you will need to know where to go to find information when the inevitable
    happens and things go badly. Just as there are numerous monitoring programs, there
    are even more logs. It seems that just about anything that happens in Linux is
    logged, and these logs, many of which reside under the /var/log directory structure,
    should be the first things you turn to when starting to troubleshoot. Knowing
    the various logs under /var/log is important for both the exam and back at your
    job, especially .messages, /syslog, /maillog, .secure, and /lastlog. With the
    amount of data that is captured in each log, you definitely do not want to have
    to go line-by-line through a log file to find the information you need. For this,
    you need good searching and sifting tools; grep, sed, awk, and tail are your closest
    allies.


    Mechanical things break and people make mistakes. Restoring data that has been
    lost due to a hard disk crash or user error is inevitable. In my view, there are
    two types of network administrator: (1) those who have had to restore lost data
    from a backup and (2) those who are looking for work because their backups failed
    and were never tested. The good thing is that Linux offers the network administrator
    a myriad of methods and tools for backing up and restoring files to a variety
    of media. This chapter covers the basics for protecting files by ensuring that
    duplicate copies exist through FTP and rsync, and for creating backup sets with
    tar and dump. For restoring files, there is tar and restore. The dd command gives
    you the ability to create disk images and apply them to other media.


