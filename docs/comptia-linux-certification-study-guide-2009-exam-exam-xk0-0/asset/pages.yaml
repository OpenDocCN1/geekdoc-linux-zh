- pgno: 349
  md: '# # Troubleshooting and Maintaining Linux


    Exam objectives in this chapter


    +   - Monitoring Tools

    +   - Analyzing Logs

    +   - Backing Up and Restoring


    # ## UNIQUE TERMS AND DEFINITIONS


    +   - **Compact Disc (CD)** – A 4.72-in. disc developed by Sony and Philips that
    can store, on the same disc, still and/or moving images in monochrome and/or color;
    stereo; or two separate sound tracks inte-grated with and/or separate from the
    images; and digital program and information files.¹


    +   - **Digital Versatile Disc**, formerly Digital Video Disc (DVD) – An optical
    storage medium with improved capacity and bandwidth compared with a CD. DVD, like
    CD, was initially marketed for entertainment and later for computer users. A DVD
    can store 4.7 GB (the equivalent of a full-length film with up to 133 min of high
    quality video) in MPEG-2 format and audio. Additionally, the DVD-ROM drive can
    read DVD movies, and modern computers with the appropriate hardware or software
    can decode them in real-time.²'
  merge: -1
  img_proc: true
- pgno: 350
  md: '+   - **File Transfer Protocol (FTP)** – A client-server protocol, which allows
    a user on one computer to transfer files to and from another computer over a Transmission
    Control Protocol/Internet Protocol (TCP/IP) network. Also, it is the client program
    used by the user to execute the transfer of files. It is defined in STD 9, RFC
    959. 3 There are two modes for FTP: active and passive.


    # # INTRODUCTION


    Ongoing system maintenance is an important part of a system administrator’s job.
    Unfortunately, compared with the fire drills of critical outages or the interesting
    new challenges of configuring the latest tools, regular maintenance is pretty
    dull, and is often the first thing that gets skipped when things start to get
    busy. Stephen Covey would categorize it as “important, but not urgent.” It is
    the sort of thing that, if done well, makes the fire drills much less dramatic,
    and frees up time that can be spent on other fun projects. 4


    In this chapter, we’ll cover common Linux tools for managing a running system,
    including monitoring performance and logs, and backing up data.


    Keep in mind that a little preparation goes a long way. If your system seems to
    be running slowly or having some other issues, it’s very helpful to have some
    historical data to compare with – so it is advisable to run a few of them now
    and then under normal load, and maybe save some screenshots so you have a good
    idea what “normal” looks like. Then you can look for something different if a
    problem comes up.


    # # MONITORING TOOLS


    Linux provides a number of handy tools for reviewing system status and other statistics.
    Not all of them may be included in a default installation, or be configured to
    collect data, but they are all supported and can be made to work with a little
    effort.


    # ## Commands


    It does not take a fancy, expensive system-monitoring package to pull and compile
    statistics on how your system is performing. Just about everything you need to
    measure CPU, memory and disk utilization, I/O performance, and network and disk
    throughput, among others, are at your fingertips in'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'utilities that, for the most part, are installed in almost every base Linux
    system. The usage of the most popular utilities is described in the paragraphs
    that follow.


    # sar


    The `sar` command (think "system activity report") is a part of the `sysstat`
    package, if it isn''t already on your system. It can be used to gather both current
    and historic system statistics for the system processor. By default, with no options
    `sar` displays information collected by a `cron` job that is periodically gathered
    and stored in files at `/var/log/sysstat/sa*`, with the last two numbers of the
    `sa*` files corresponding to the calendar day the information was collected. Some
    other useful options include `sar -A` to show *all* statistics, and `sar -n DEV`
    to show network statistics. You can control the collection of current information
    by appending two numbers at the end of the command; the first will set the collection
    interval in seconds, the second tells how many times it should gather the information.
    For example, `sar -n DEV 5 4` will show network statistics for 5-s time periods
    a total of four times, then provide a nice average for each interface, as shown
    in Figure 11.1.


    The `sar` command has a very thorough `man` page for further information.


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_351_0.png)


    # FIGURE 11.1


    An example of using `sar` to view network statistics.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# iostat


    The `iostat` command shows both CPU and disk utilization statistics, and can also
    show remote Network File System (NFS) drive systems. It was covered in Chapter
    6, “Using BASH,” in the “Managing Processes” section.


    # vmstat


    The `vmstat` command uses information in `/proc/meminfo`, `/proc/stat` and `/proc/`stat
    to show virtual memory and other system usage statistics, including disk and processor
    usage. It is helpful in tracking down potential system bottlenecks. Like the `sar`
    command, `vmstat` can be followed with two numbers indicating how long to wait
    and how many times to run. Memory statistics using units of blocks equate to 1024
    bytes of memory per block in current Linux kernels. Using `vmstat` without options
    gives a brief overview of memory and CPU statistics. The `-d` option shows more
    detailed statistics related to the disk drives in the system. Unlike `top`, `vmstat`
    doesn’t include itself in the statistics that it shows. The man page for `vmstat`
    is a good resource for further information.


    # uptime


    The `uptime` command gives a quick one-line display showing the current system
    time, how long the system has been up, the current number of users, and the load
    average over the last 1, 5, and 15 min. The load average is a count of processes
    either currently being handled by the processor or waiting to be run.


    # top


    The `top` command shows a current running tally of system usage and an ongoing
    list of processes. By default, the processes are sorted by the percentage of CPU
    usage. It was also covered in detail in the “Managing Processes” section of Chapter
    6, “Using BASH.”


    # Load Average


    You may have noticed that many of the commands that show system utilization display
    three numbers that represent the system *load average*. You can see it in the
    upper section of the `top` command, on the end of the `uptime` command, and it
    also shows up in the `w` command. Because load average is displayed in so many
    places, you can probably deduce that it’s some pretty useful information and should
    command your attention.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '**Exam Warning**


    You may have noticed in the exam objectives that the focus is on commands; however,
    there are several key statistics that are objectives as well. Load average is
    one of those statistics. You should be familiar with the commands to know which
    ones will display load average and other utilization statistics.


    As mentioned in the *uptime* section, the load average is a three-part statistic
    that indicates, on average, how many processes are either currently running or
    actively waiting to be run by the processor. In his excellent discussion of UNIX
    load averages, Dr. Neil Gunther summarizes them as “the sum of the number of processes
    waiting in the run-queue plus the number currently executing,”⁵ There are slight
    variations in what gets included in the statistic, but it is essentially a count
    of how many programs are waiting to be run at a given moment, with a damping factor
    to average out brief swings to give a more accurate time-weighted average. The
    1-min average has a smaller damping factor and is allowed to swing more quickly,
    whereas the 15-min average has a higher damping factor and gives a better long-term
    overview of the system load.


    Many modern systems have multiple cores and even multiple processors with multiple
    cores each, which are not factored into calculating the load average. This means
    that, on a single quad-core processor computer able to handle four simultaneous
    processes, a load average of two would indicate that (on average, during the time
    period it question) two of the cores were idle; that is, the system could be considered
    50% utilized.


    In the real world, some processes will affect a system more than others, and a
    computer running one set of applications may run fine with a load average up to
    three or more, whereas another may seem overloaded barely over one. Again, it
    is helpful to keep an eye on the load average during normal operations to get
    a feel for what “normal” really is, so that if there is a performance issue, you
    will recognize a significant change.


    If a system starts bogging down and shows high load average numbers, it may be
    time to find a way to split some of the machine’s responsibilities or upgrade
    to a faster or multiple processor system, provided the application being run will
    benefit from it.


    # EXERCISE 11.1: **Tracking Down a Runaway Process**


    Occasionally a program will monopolize an entire system and have to be killed.
    In this exercise, we’ll see how some of the system monitoring tools'
  merge: -1
  img_proc: true
