  md: 'section in Chapter 10: “Securing Linux”) will probably mean it will be the
    more commonly used file transfer method in the future.


    **Using FTP** requires both a client and a server that the client connects to.
    By default, FTP uses TCP port 21 to establish an initial connection with the server.
    If the client is using *active mode*, the actual files will be sent from the server
    to a new separate TCP port on the client. This can cause problems with some firewalls
    and address translation devices, so it is sometimes necessary to use *FTP in passive
    mode*, where the client again initiates the secondary data connection.


    It is important to know the additional ports that need to be opened to enable
    active mode FTP. The process for establishing a connection will help to illustrate
    this. In active mode FTP, the client connects from a random unprivileged port
    (1023 and above) to TCP port 21. This is called the FTP server’s *command port*.
    The FTP client then starts listening on the port it just used to connect + 1.
    For example, if port 1026 was used to make the initial connection, the FTP client
    will listen on port 1027. Once the acknowledgement (ACK) has been received by
    the client, using our example the client sends the FTP command `PORT 1027` to
    the FTP server. The server will then connect back to the client’s port 1027 from
    port 20, its local data port. To support active mode FTP, the following TCP ports
    need to be opened:


    +   1. FTP server’s port 21 from anywhere (Client initiates connection).


    +   2. FTP client’s port 21 and ports 1023 and above (Server responds to client’s
    control port).


    +   3. FTP server’s port 20 and ports 1023 and above (Server initiates data connection
    to client’s data port).


    +   4. FTP client’s port 20 from ports 1023 and above (Client sends ACKs to server’s
    data port).


    Another pair of modes that causes problems are *binary* and *ascii*. When in binary
    mode, a file is transferred exactly as it is, bit-for-bit. This is necessary if
    you are transferring a nontext file. In ascii mode, the system assumes the file
    you are transferring is written using standard ascii-encoded text characters and
    formatting codes (tabs, returns, line feeds, and so forth). Since these codes
    vary from system to system, ascii mode tries to convert the codes to what your
    local system understands, but if the information isn’t really ascii, the file
    may get scrambled. If in doubt, use binary.


    When connecting to an FTP server, you can use an account with a username and password;
    or, if the server is configured to allow it, you can log in as *anonymous*, which
    usually asks you use an e-mail address as a password.'
  merge: -1
  img_proc: true
