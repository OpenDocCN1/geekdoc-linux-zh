- pgno: 39
  md: '+   *   **Local** This option inserts the user account information into the
    /etc/passwd file. This is the typical default configuration for most Linux systems.

    +   *   **Lightweight Directory Access Protocol (LDAP)** OpenLDAP provides a directory
    service for the storing of user accounts within a hierarchical database. This
    approach allows the database to replicate the user account information with other
    OpenLDAP systems

    +   *   **Network information system (NIS)** (originally known as *Yellow Pages*
    or YP) is a distributed account management system based on a client-server directory
    service protocol model. NIS communicates account information between Linux systems.

    +   *   **Windows domain** Windows Domain authenticates user account information
    with Microsoft Active Directory.

    +   *   **Kerberos** Kerberos is a symmetric cryptographic protocol for network-based
    authentication.


    The password encryption methods available to you are as follows:


    +   *   **Blowfish** This is a cryptographic symmetric block cipher used to encrypt
    the password. The password length for the *Blowfish* encryption method ranges
    from 5 to 72 alphanumeric characters.

    +   *   **MD5** This is a cryptographic hash function used to create a hash value
    for the password. The password length for the *MD5 algorithm* method ranges from
    5 to 127 alphanumeric characters.

    +   *   **Data encryption standard (DES)** DES is a cryptographic symmetric block
    cipher standard for encrypting your password. The password length for the *DES
    encryption* method ranges from five to eight alphanumeric characters.


