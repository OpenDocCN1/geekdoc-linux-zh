  img_proc: true
- pgno: 222
  md: '+   - **Testing libraries** have had a lot of testing and are destined to be
    in the next release.


    +   - **Unstable** have had little testing and may well contain bugs that could
    make the system unstable.


    The low level or base tool of the Debian package manager is the command **dpkg**.
    This command and the main options will be discussed below. In addition to this
    tool, there are also a number of higher-level tools such as APT, which can be
    used to fetch packages from many locations. Also, there is a tool called **aptitude**
    that has a much easier and friendly-user interface.


    # Installing Software Packages using dpkg


    The basic install of packages for using the Debian package manager is very similar
    to using RPM in the previous section. To install a package the following is used:


    ```

    dpkg -i package_name

    ```


    As with rpm above, you will need to have superuser privileges to run the command.
    Without this, the following error message will be displayed:


    ```

    dpkg: requested operation requires superuser privilege

    ```


    # Removing Software Packages using dpkg


    Packages can be removed easily using the -r option:


    ```

    dpkg -r package_name

    ```


    This option will leave the configuration files on the computer so that it will
    be easier to reinstall it later. If you want to erase the configuration files
    as well, you can add the --purge option.


    # Advanced Packaging Tool


    Another package management tool for Debian is APT or Advanced Packaging Tool,
    which was designed to facilitate the administration of the packages. The default
    location for the APT configuration files is /etc/apt. APT has a list of locations
    where packages can be obtained from and this is in /etc/apt/sources.list, part
    of which is shown below:


    ```

    #

    # deb cdrom:[Debian GNU/Linux 5.0.1 _Lenny_ - Official i386 DVD Binary-1 20090413-00:33]/
    lenny contrib main


    deb cdrom:[Debian GNU/Linux 5.0.1 _Lenny_ - Official i386 DVD Binary-1 20090413-00:33]/
    lenny contrib main

    ```'
