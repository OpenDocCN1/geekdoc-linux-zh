  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_203_0.png)


    # FIGURE 6.16


    An example of stopping, starting, and restarting a service using init scripts.


    is initiated. The scripts that initially start each service can also be used to
    manage them manually, and can be found in the etc/init.d directory. The scripts
    accept a parameter of either start, stop, or restart. Some start scripts support
    an additional command, status, which displays the status of the service (running
    or not running). As an example, to restart the secure shell service (sshd) after
    making a change to its configuration file, you''d type etc/init.d/sshd restart,
    as seen in Figure 6.16.


    # inetd and xinetd


    To conserve resources, some smaller and less frequently used network-based services
    get bundled together in a super server service, which waits in the background
    until one of the services is needed and then loads it. This method prevents the
    service from just sitting there taking up memory until it is actually needed.
    There are two super server daemons in Linux- inetd and the newer, "extended" xinetd,
    which adds some features and enhanced security. Changing the services managed
    by inetd or xinetd is conveniently done through GUI tools on current Linux distributions
    (YaST|Network Services in SUSE), it can also be done manually by editing the appropriate
    configuration file (/etc/inetd.conf or /etc/xinetd.conf) and restarting the service
    (kill -s SIGHUP).'
