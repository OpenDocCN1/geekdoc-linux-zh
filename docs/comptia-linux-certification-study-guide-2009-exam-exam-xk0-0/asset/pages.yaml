- pgno: 325
  md: 'are commonly called *0-day* exploits, because the good guys may get zero days
    prior notice to fix a problem before there is already someone using it to wreak
    havoc.


    SELinux reduces the risk of these problems by implementing a system that limits
    what programs can do. Ideally, no user or program should have access to anything
    more than it needs to do its job – this is a standard security paradigm called
    *least privilege*.


    In his book *“SELinux,”* Bill McCarty points out that normal Linux uses a system
    called *discretionary access controls* (DAC) meaning the security level depends
    on the user. If user Bob runs a program with his login, that program typically
    has access to everything that Bob has access to. If someone manages to compromise
    Bob’s program, now THEY have access to it, too.


    Bill further notes that SELinux uses the more secure *mandatory access controls*
    (MAC). This is a mechanism that enforces least privilege access by program. Now,
    if Bob’s program is compromised, it only affects that program. That’s still not
    good, but it’s a lot better than having the entire system crack open. It’s the
    difference between a burglar breaking into a single safe deposit box instead of
    an entire bank.


    # Running Modes, Enabled, Disabled, Permissive


    Current versions of the Linux kernel have the necessary components to support
    SELinux, it just needs to be enabled, which varies by distribution. Once enabled,
    SELinux defines categories of Subjects, Objects, Actions, and sets up rules that
    define how these categories are allowed to interact.[4](footnote:4)


    To make it easier to set things up, SELinux provides three *running modes*:


    +   ■ *enabled* – SELinux is up and running, any forbidden actions are blocked.

    +   ■ *disabled* – SELinux is there, but not turned on.

    +   ■ *permissive* – SELinux is up and running, with the rules in place, but when
    something forbidden is attempted, SELinux allows it. A log of rule violations
    is kept, which can be used to adjust the rules to make sure valid activities aren’t
    obstructed.


    When first setting up SELinux, the permissive mode helps identify conflicts with
    the security settings. Once everything is running smoothly, it can be set to *enabled*.


    # IMPLEMENTING PRIVILEGE ESCALATION


    As a system administrator, you need to be careful what you do, even a small typo
    can cause devastation. Consider the difference between'
