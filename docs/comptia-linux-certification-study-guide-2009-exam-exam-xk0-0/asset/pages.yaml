    # Basic Scripting


    A *script* is a plain text file containing a collection of command-line programs
    and options that can be all run as a group. Each line of the script is read one
    at a time and *interpreted*, which can make scripts slow compared with the other
    options for creating programs – but since they are made from the same commands
    you use daily on the command line, they are quick and easy to create. A comprehensive
    guide to scripting would fill an entire book; for the sake of the Linux + test,
    there are only a couple key points to know.


    Any file that you want to run in Linux – scripts included – need to have the *execute*
    permission bit set. This is covered in more depth in Chapter 10, “Securing Linux,”
    under the “*chmod*” section. Briefly, `chmod u+x` filename will set the execute
    permission bit for the owner on a given file, and allow it to be executed.


    The exception to this is if you use the `sh` command to kick off a new shell,
    which makes the `sh` program the executable and the script just a parameter, as
    shown in Figure 6.15.


    Notice in Figure 6.15 that we start with a regular file – there are no “*x*”s
    in the permissions shown with an `ls -al` command. As a result, attempting to
    execute the script directly by typing `./a_script` fails, but typing `sh ./a_script`
    works fine. Once `chmod u+x` is used on the script, `ls` will shade it green for
    you, so you can quickly tell that file is executable.


    You can also use the `bash` command in place of `sh`.


    > Note

    > If you set your script to executable and try and run it, be aware that (unlike
    DOS and Windows) Linux does *not* include the current directory in the path searched
    to'
