    on Debian-based Linux distributions (dpkg) to install, manage, and remove software
    packages.


    **American Standard Code for Information Interchange (ASCII)** A character-encoding
    scheme based on the ordering of the English alphabet. ASCII codes are the numerical
    representation of a test character in computers, communications equipment, and
    other devices that work with text.


    **Apache** An open-source HTTP (Web) server produced by the Apache Software Foundation
    that has become the most widely used Web server on the Internet. It aims to be
    aligned with current HTTP standards and to run on all modern operating systems.


    **Berkeley Internet Naming Daemon (BIND)** An open-source server that implements
    the DNS protocols for the Internet. BIND is by far the most widely used DNS software
    on the Internet.


    **Bourne Again Shell (BASH)** The sh-compatible command line interpreter that
    executes commands read from the standard input or from a file. It is the default
    shell on most Linux distributions.


    **Command line interpreter or command line interface (CLI)** A full-screen or
    windowed text-mode session where the user executes programs by typing in commands
    with or without parameters. The CLI displays output text from the operating system
    or program and provides a command prompt for user input.'
