  md: "hardware that is new or uncommon. When this occurs, there are a number of ways\
    \ to initialize the hardware manually:\n\n+   - Modprobe is the high-level handler\
    \ for all modules, and it can be used to unload or load a new device's kernel\
    \ module.\n\n+   - The /etc/modprobe.conf.local file can be edited to prompt the\
    \ system to recognize and support the new hardware upon reboot.\n\nThe base system\
    \ will use the /proc/modprobe.conf file to load the modules, which should not\
    \ be modified. This file will append the pathname `/etc/modprobe.conf.local` to\
    \ itself via an include statement. Once an entry has been added to the /etc/modprobe.conf.local\
    \ file and a reboot undertaken, the system will perform a module dependency check.\n\
    \nAs root, you can also manually load [and unload] a device's kernel module using\
    \ modprobe. This command will look in the /usr/lib/[kernel version] for all the\
    \ modules and files except for the optional /etc/modprobe.conf configuration file\
    \ and /etc/modprobe.d directory. If the module does not exist, modprobe will generate\
    \ an error. As modprobe does not do anything to the module itself, all dependencies\
    \ and the resolving of symbols is handled by the kernel itself. Kernel messages\
    \ generated by a module failure will have to be displayed using the `dmesg` command.\n\
    \n> **Note**\n> \n> The version of the kernel can be displayed using the command\
    \ `uname -r`.\n\nEach module may need one of more additional modules loaded to\
    \ enable it to function correctly, and modprobe will check for these dependencies\
    \ in the modules.dep file, which is itself generated by the command `depmod`.\
    \ The modules.dep file is located in the /lib/modules/uname directory.\n\n# EXERCISE\
    \ 5.2: Removing a Module from the Linux Kernel\n\nIn this exercise, you will be\
    \ removing a module, an Institute of Electrical and Electronics Engineers (IEEE)\
    \ 1394 card, from the Linux kernel:\n\n+   1. Remove the hardware from the Linux\
    \ system and boot the system.\n\n+   2. Once logged in, you need to remove the\
    \ module from the kernel. This is done using the modprobe command, `modprobe -r\
    \ ieee1394`\n\n+   3. Check for any kernel messages related to the removal using\
    \ `dmesg`\n\n+   4. Reboot the system again, and the hardware and module should\
