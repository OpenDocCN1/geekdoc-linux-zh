- pgno: 27
  md: "# ## Linux Installation Process\n\nThe Linux operating system can be installed\
    \ from various different local [for example, CD, digital video disk (DVD), and\
    \ iso images] and network [for example, File Transfer Protocol (FTP), Hyperext\
    \ Transfer Protocol (HTTP), NFS, and Server Message Block (SMB) Server] sources.\
    \ The *local media installation* method entails performing a stand-alone installation\
    \ and does not rely on network connectivity to access to the installation source\
    \ data. The *network source installation* method entails having an installation\
    \ server available in your network or via an external server (for example, Internet)\
    \ as the source where the installation data resides. Apart from a few unique settings,\
    \ the installation process for each installation source is essentially the same.\
    \ The “Installing across the Network” section presents the unique challenges associated\
    \ with the installation of a Linux distribution from network sources. This section\
    \ presents the installation of the Linux distribution from local media. Linux\
    \ local media installation can be performed by using CD, DVD, or .iso sources.\
    \ Of the choices provided, the author prefers .iso image installations.\n\nAs\
    \ there are several Linux distributions available from various vendors and some\
    \ are more popular than others, the first choice you face is the selection of\
    \ a Linux distribution. The leading Linux distributions all follow the same installation\
    \ stages. Gentoo is a notable exception. For this book, the authors have decided\
    \ to use the openSUSE 11.1 Linux distribution. OpenSUSE 11.1 is the most current\
    \ version available.\n\n> Note\n> The Linux+ certification exam is a vendor neutral\
    \ exam. For a listing of the various Linux distributions, check out the following\
    \ Web sites:\n> \n> *   http://distrowatch.com/\n> *   http://en.wikipedia.org/wiki/List_of_Linux_distributions\n\
    \n# **EXERCISE 2.2: Installing from Local Media**\n\nIn this exercise, we will\
    \ commence the initial installation of the open-SUSE 11.1.1 installation using\
    \ DVD Media. For this exercise, we will use the following:\n\n+   1.  Open a **Web\
    \ browser** from a workstation and navigate to http://software.opensuse.org/.\n\
    +   2.  Follow the instructions to download the openSUSE 11.1 DVD image."
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   3. Create a bootable DVD from the .iso image using your burning software
    application.

    +   4. Boot the target machine with the newly created bootable network DVD.

    +   5. Select **Installation**. This will start the openSUSE Installer.


    To launch the installation process from an .iso image, load the image as a CD/DVD
    into the virtualization software (for example, VMWARE workstation). Power up or
    reboot the virtual machine with the .iso image loaded to commence the initial
    boot process. The .iso image appeared as a DVD to the virtual machine. When the
    system completes the on-board self test, the openSUSE Installer program screen
    appears, as shown in Figure 2.2. The initial screen provides you with various
    menu options for installing openSUSE and additional configuration options required
    before the installation process. We will select the **Installation** option.


    Below are descriptions of the choices:


