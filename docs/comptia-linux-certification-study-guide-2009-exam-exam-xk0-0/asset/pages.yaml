  md: '■ Begin with a lower case letter or underscore.


    ■ Can only contain lower case letters, underscores, or dashes.


    ■ May end with a dollar sign.


    ■ Can’t be longer than 16 characters in total.


    The syntax looks like this


    ```

    groupadd [options] groupname

    ```


    By default, the `groupadd` command uses the next unused GID number; the `-g` or
    `--gid` option lets you pick a specific number – because every company has a group
    that’s earned the right to use GID 666.


    # **Groupdel**


    The `groupdel` command is used to delete groups by removing the appropriate lines
    from the `/etc/group` and (if used) `/etc/gshadow` files. It won’t let you remove
    a user’s primary group; you’ll have to give the `usermod --gid newgroupname username`
    command to form a new group. Similar to `userdel`, `groupdel` won’t change the
    actual GID information on existing files, either. Although that doesn’t cause
    immediate problems, if the GID gets reused, you may get unexpected file access
    and other security issues, so it’s best to use the `find / -group groupname or
    GID` or `find / -nogroup` to track down potential problem files. The syntax for
    `groupdel` is simply


    ```

    groupdel groupname

    ```


    > **Note**

    > Note that `groupdel` only works with actual group names, not group ID numbers.


    # **Groupmod**


    The `groupmod` command is used to change a group’s GID or groupname. The syntax
    is as follows:


    ```

    groupmod [options] groupname

    ```


    The common options are given below.


    +   ■ `-g` or `--gid` GID to change the GID


    +   ■ `-n` or `--new-name` newgroupname to change the group name'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Remember that the most common group edit, actually changing the users in the
    group, is done with the usermod command, as explained previously.


    # **who and whoami**


    Once you have a bunch of users on your system, you''ll want to keep track of them.
    The who command lists the usernames of people logged into your system. Available
    options can show where remote users are logged in from and the number of users.
    The syntax is simply


    ```

    `who [options] [FILE | arg1 arg2]`

    ```


    Who works by looking in the /var/run/utmp file, which keeps track of who is logged
    into the system. The FILE option allows it to check other similar files.


    > **Note**

    > The users command gives similar, although briefer, information.


    The whoami command simply prints your username.


    # **W**


    The w command picks up where who leaves off, giving not just the user information,
    but also showing the following:


    +   What device they logged into.


    +   Where they logged in from (console if local or IP address if remote).


    +   When they logged in.


    +   How long their session has been idle.


    +   How much processor time they''ve used.


    +   What program they are running.


    It includes a header that gives information similar to top, which shows the current
    time, system up time, number of users, and average load statistics [see Figure
    10.1].


    The syntax for w is as follows:


    ```

    `w [options] user`

    ```


    The options just modify which fields are viewed. Adding a specific username will
    limit the output to information about that single user.'
  merge: -1
  img_proc: true
- pgno: 310
