  md: '+   **11.** You have been told that your mail MTA is being used as a relay
    by spammers. You want to stop this happening. What is the best course of action?


    +   **A.** Relocate the mailserver behind your corporate firewall and only allow
    TCP port 25 to and from this server.


    +   **B.** Ensure that the only hosts that the mailserver will allow to relay
    are on your local network by configuring the /etc/mail/access file.


    +   **C.** Ensure that only your domain can be relayed by configuring the relay-domains
    file.


    +   **D.** Configure the mailserver to stop all relaying of mail and make sure
    all the users connect to it via an approved client.


    Correct answer and explanation: **B**. Answer **B** is correct as this will specify
    which of your networks can connect to this mailserver and have their mail relayed.
    If you configure the networks correctly, the spam mail will not be relayed.


    Incorrect answers and explanations: **A**, **C**, and **D**. Answer **A** is incorrect
    as relocating the mailserver behind a firewall will not help. The server will
    have to have port 25 open on it, and this is used by spammers to force the mailserver
    to relay messages. This option would be useful if the correct configuration files
    as specified in Answer **A** were done. Answer **C** is incorrect as this will
