- pgno: 271
  md: '# Network Services 259


    # EXERCISE 9.1: Making a Name Server Authoritative


    In this exercise, you will learn how to make a secondary name server authoritative
    for a domain for a server running Bind 9 as you are about to decommission the
    existing primary name server.


    +   1. In the `named.conf` file on the secondary server, check to see whether
    it is designated as the secondary for the zone you are interested in.


    +   2. Change `type secondary` to `type master`.


    +   3. Change the `allow update` option to `none`.


    +   4. Power down the master server and then reboot the server you have just changed
    to master.


    +   5. This new server should now be authoritative for this domain.  ▪


    # Network Time Protocol


    NTP is the defined protocol for synchronizing clocks of computer systems over
    a network, including the Internet. There are many time servers located across
    the world, and the source can be an atomic clock or via a satellite receiver.
    The accuracy that is obtained is very good and is typically no more than a few
    milliseconds. Like DNS servers, there is a hierarchy with primary or Stratum 1
    timeservers and secondary or Stratum 2 servers. Those servers at a lower level
    always synchronize themselves to a server at a higher level. There are a number
    of public timeservers available, and those operated by the National Institute
    of Science and Technology (NIST) and US Naval Observatory (USNO) within the United
    States are particularly reliable.


    Within the Linux system, there is an NTP client which is implemented as a continuously
    running daemon process. This process runs in the kernel space due to the sensitivity
    of timing.


    The main configuration file for NTP is /etc/ntp.conf, and the servers you will
    synchronize to, as well as what networks are allowed to synchronize to your server,
    are described. You need to define a number of servers to synchronize to ensure
    there is redundancy in case of network or server failures. To specify a pair of
    servers to synchronize to, the ntp.conf will need to be modified as such:


    ```

    server lerc-dns.lerc.nasa.gov # Stratem 1 server

    server ntp.time.edu           # Stratem 2 server

    ```


    You must then restrict the access that you allow these time servers; for instance,
    you do not want them to query your NTP server.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '```

    ```

    restrict lerc-dns.lerc.nasa.gov mask 255.255.255.255

    nomo dify no trap noquery

    restrict ntp.time.edu mask 255.255.255.255 nomodify n

    trap noquery

    ```

    ```


    Using the same command, you can allow hosts on your local network to query your
    time servers.


    ```

    ```

    restrict 10.10.10.0 mask 255.255.255.0 nomodify

    nomask

    restrict 127.0.0.1

    ```

    ```


    The use of the restrict command can seem to be confusing; but it should be thought
    of as everyone being allowed to query your server, and you are just reducing this
    overall access. Also note that in the code above, the local host (127.0.0.1) is
    allowed full access. You need to ensure that ntpd is started on boot with the
    chkconfig command, and also start the service manually for this first time with
    the service command.


    ```

    ```

    chkconfig ntpd on

    service ntpd start

    ```

    ```


    To find and use an NTP server easily, there is a pool of servers that you can
    use. These NTP pools contain hundreds of public NTP servers that their operators
    allow to be used for time synchronization. You will need to define the pool you
    want to use with the DNS name region.pool.ntp.org, where you substitute region
    for the country or state where you live. More information can be found at www.pool.ntp.org.
    The utility program ntpq can be used to monitor the NTP daemon to determine the
    performance. The command uses standard NTP mode in six control message formats.
    This command is useful to see what time servers are currently being polled using
    ntpq -p.


    In older versions of ntp, the local date and time can be set using ntpdate. This
    functionality is now in ntpd, but the older version is still in use. The command
    can be run manually, or usually it is run automatically at boot time.


    # date Command


    The date command can be used to display or set the date on a system that does
    not have an NTP server installed. The options for the command are shown in Table
    9.2, date options.


    **Table 9.2 date options**


    | | |

    | :--- | :--- |

    | -a | Adjust the date when the time has drifted. |

    | -u | Display or set the time in GMT |

    | -s datetime | Set the time and date |'
