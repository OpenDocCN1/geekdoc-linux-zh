- pgno: 166
  md: '> **Note**

    > You can also type `Alt + F2` to pop up the “run an application” window, and
    type in `konsole` in KDE or `gnome-terminal` if you use the gnome desktop.


    It is frequently convenient to run several command shell windows simultaneously;
    you can read a “man” page describing the use of a command while trying the command,
    or monitor a log file while performing system management. Konsole (KDE''s terminal
    program) supports multiple tabs with a separate instance of a command line in
    each, which can be convenient.


    > **Note**

    > To make it easier to keep track of multiple windows, `konsole` (and `gnome-terminal`)
    lets you rename each terminal instance – per tab or discrete window. Try it! In
    `konsole` type `Ctrl + Shift + N` (or click **file** | **New Tab**) to open a
    new tab (the tabs themselves appear on the bottom of the `konsole` window), and
    `Ctrl + Alt + s` (or click **edit** | **rename**) to rename it. Note that the
    icon for `konsole` on the taskbar at the bottom of the screen is also renamed,
    making it easier to go straight to the terminal window you want when you have
    several minimized or covered.


    While digging through the various terminal program options, feel free to play
    with the settings for background, transparency, font, foreground/background color,
    and others. It isn''t on the test (but hey, you''re going to be staring at this
    for countless hours), therefore, you might as well make it something that''s easy
    to read and pleasing to look at.


    > **Exam Warning**

    > Note that if you don''t use a "monospaced" font (where every character is the
    same width on the screen) columns won''t align correctly, and some commands use
    a variety of colors, making the output invisible if your background matches one
    of them. A pretty blue background, for example, will render all directories invisible
    in the default output of the `ls` command and can induce momentary heart failure.


    # ### Navigating Directories


    OK, you''ve got a terminal window, now what? A good starting place is basic directory
    navigation. Type `pwd` (*print working directory*) to see what directory you are
    in. `konsole` will start you in your home directory: `/home/your_user_name/`.
    You can see the contents of your current directory'
