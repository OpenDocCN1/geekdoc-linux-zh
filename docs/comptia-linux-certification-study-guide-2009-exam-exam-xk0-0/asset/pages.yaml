  md: '# Network File System


    Mentioned earlier in this chapter, see “Filesystem Types,” NFS is a client/server
    model designed to make specified directories on a server available to a select
    subset of clients or all clients in a network. Prior to accessing directories
    for use, the server-side and client-side must be configured properly. The server-side
    must configure directories for sharing. These directories are also known as *exports*.
    The client-side must be configured for mounting the exports.


    Commencing with the server-side assumption that the kernel-based NFS service is
    available – if not, the service can be set to run automatically by including the
    NFS service in the server’s default runlevel – the shares made available are listed
    in the `/etc/exports` file, as shown in Figure 3.9. This file contains a listing
    of directories (exports) and the client machines that may mount the exports. Each
    line represents a shared directory and any associated options (for example, permissions).


    The parameters for each line are as follows:


    `exported_directory <client1> (<options>> <clientN> (<options>)`


    +   The first parameter, `exported_directory`, represents the directory being
    exported on the server.


    +   The second parameter, `<client1>`, presents the host or network to which the
    export is being shared for access. The `client1` parameter can be a single host
    based on IP address, hostname, or domain name; a wildcard (`*`) for a group of
    machines; or an IP network range.


    +   The third parameter, `<options>`, represents the options imposed on the connection.
    The options include `read-only` (ro), `read-write`


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_94_0.png)'
