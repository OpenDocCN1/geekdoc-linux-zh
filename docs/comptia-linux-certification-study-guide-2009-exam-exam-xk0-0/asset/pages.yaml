    be further divided. For most PC-based systems, a maximum of four primary (physical)
    partitions can be implemented on a hard drive. Extended partitions can be further
    subdivided into smaller logical partitions (groups). For any bootable operating
    system, you must have at least one primary partition. This initial partition will
    be used by the operating system to store your operating system files. The remaining
    three partitions can all be the primary partitions, the extended partitions, or
    a combination of both.


    To create or edit partitions within the Linux environment during the installation
    process, openSUSE Installer provides you with the Expert Partitioner graphical
