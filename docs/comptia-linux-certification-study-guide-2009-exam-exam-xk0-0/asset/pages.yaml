- pgno: 339
  md: 'Authentication is the process the computer uses to determine you are sup-

    posed to be given access when you type in your username and password.

    It comes in two basic flavors


    +   ■ Local authentication is limited to a single computer. It knows who you are,
    but no other computers do. It is easy to set up and administer on a few computers,
    but scales poorly.


    +   ■ Centralized authentication allows user information and other settings to
    be gathered into a single repository and then accessed from trusted computers.
    Centralized systems can be much more complicated to configure, but make it much
    easier to administer large networks of computers.


    # ## PAM


    The Pluggable Authentication Modules (PAM) work to coordinate authen-tication
    requests from Linux programs. The modular design means that implementing some
    new authentication technology (like a fingerprint scanner) or policy (like mandatory
    password complexity) is as easy as plugging in the appropriate modules and telling
    the system to use them by updating the appropriate configuration file. Each authentication
    program has its own PAM configuration file. Configuration files are stored in
    the/etc/pam.d directory.


    The Linux-PAM System Administrators'' Guide⁹ outlines four types of management
    tasks that PAM can take care of


    +   ■ **Authentication management** It covers verifying users who they claim to
    be.


    +   ■ **Account management** It allows updates to user account information, confirms
    account is still valid, and tracks password expiration dates.


    +   ■ **Session management** It handles tasks related to the start and close of
    a user session, such as mounting a home directory or updating an audit log.


    +   ■ **Password management** It is used to update password or other authen-tication
    mechanism.


    Each PAM configuration file lists types of management tasks, which mod-ule(s)
    to check while performing the task, and a control that tells whether passing the
    module test is, among other checks, mandatory, or optional (see Figure 10.8).'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 328 **CHAPTER 10: Securing Linux**


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_340_0.png)


    The actual PAM modules are stored in */lib/security/*. Lots of additional modules
    and documentation can be found at www.kernel.org/pub/linux/ libs/pam/.


    # **EXERCISE 10.8: Adjusting Minimum Password Length with PAM**


    In this exercise, we''ll enforce a minimum password length of 10 characters using
    a PAM policy in SuSE. With administrator privileges in a terminal window, type
    the following:


    +   1. cd /etc/pam.d to change to the directory where the PAM configuration files
    are.

    +   2. cat common-password to check out the default password policy.

    +   3. passwd to change the root password – choose something short; five characters
    is the default minimum.

    +   4. pam-config - a --pwcheck-minlen=10.

    +   5. cat common-password to see how the configuration file has changed. It''s
    possible to just edit the file directly, but the pam-config utility will overwrite
    any edits.

    +   6. passwd to change the root password again. Note that now you''ll have to
    pick a longer password.


    Linux distributions have subtle differences in how they handle PAM configurations;
    it may be necessary to do additional research on other systems. In addition, note
    that this change can be made in the YAST GUI system management tool.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# LDAP


    LDAP is the Lightweight Directory Access Protocol. A proper understanding of LDAP
    requires a few definitions and a little history. *A directory* is defined by the
    OpenLDAP project as “a specialized database specifically designed for searching
    and browsing, in addition to supporting basic lookup and update functions.”$^{10}$
    They point out that a normal database is usually optimized for high volume, high
    speed, and often complex transactions, where a directory spends will get a lot
    of searches and relatively few—and pretty basic—updates and changes. Think about
    how often a user directory would be queried for a username and password or e-mail
    address compared with how frequently a user is added or a password is changed
    versus how often an inventory database needs to add or subtract items.


    Historically, the OSI defined x.500 directories and a Directory Access Protocol
    [DAP] to query them. Over time, the simpler LDAP access protocol developed to
    take advantage of a basic subset of features from the original DAP and eventually
    included the actual directory. Now, the term LDAP is generally used in reference
    to the entire directory and not just the access protocol.


    Current LDAP systems on Linux typically use the stand-alone LDAP daemon, `slapd`.
    This provides the back-end server functionality to store user information. Individual
    workstations then access the `slapd` directory information as needed: usually
    via a PAM plug-in for authentication or maybe through an e-mail client to look
    up e-mail addresses.


    What does this directory information look like? Again referring to the OpenLDAP
    administrators’ guide gives a good description:


    > “The LDAP information model is based on entries. An entry is a collection of
    attributes that has a globally unique Distinguished Name (DN). The DN is used
    to refer to the entry unambiguously. Each of the entry’s attributes has a *type*
    and one or more *values*. The types are typically mnemonic strings, like “cn”
    for common name, or “mail” for e-mail address. The syntax of values depends on
    the attribute type. For example, a cn attribute might contain the value Rabs Lessner.
    A mail attribute might contain the value “rabs@example.com.” A jpegPhoto attribute
    would contain a photograph in the JPEG (binary) format.”$^{11}$


    This information is organized in a hierarchy, usually with the country or organization
    information at the top, working its way down through departments or states finally
    down to the individual user or other individual piece of information, such as
    a workstation or server.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# NIS


    Network Information System \[NIS\] is another option for storing centralized user
    and other configuration files. It was originally called the "yellow pages," so
    many NIS commands and files start with “yp.”


    NIS is comprised of one or more servers that contain a database of configuration
    files that are to be shared across the network and clients that are configured
    to access them. By sharing /etc/passwd, /etc/group, and /etc/shadow files, a user''s
    login account information will work on any client in the system.¹²


    # RADIUS


    Remote Authentication Dial In User Service \[RADIUS\], as the name indicates,
    was originally developed for dial-in access via modems. The RADIUS client software
    runs on the device to which the user is attempting to authenticate. The client
    forwards the user information to a RADIUS server, which grants or denies the request
    for access. The actual password is never sent over the link.¹³


    # Two-Factor Authentication


    Two-factor authentication refers to a requirement to provide two things when you
    log in. These are usually “something you know” – a memorized password – and “something
    you have” – an access token of some sort. Two-factor authentication makes it much
    harder to break into someone else''s account because just guessing their password
    is no longer good enough.


    # SUMMARY OF EXAM OBJECTIVES


    While “security” is frequently associated with “restrictions,” it’s helpful to
    consider it in terms of “allowances.” To summarize, remember that the `adduser`
    command creates accounts to allow access to the system, `chmod` modifies what
    users can do with files, and `groupadd` allows users to share information amongst
    themselves. The `su` and `sudo` commands extend user privileges to allow administrative
    tasks, and `ssh` and `vnc` allow users access to other systems. User account information
    can be shared between systems with `ldap` or `nis`, and authentication requirements
    can be customized using on a Linux system with `pam`.


    There are number of applications for observing the Linux system environment, including


    +   - Nessus and nmap for scanning networks.

    +   - Wireshark for capturing packets on a network interface.'
  merge: -1
  img_proc: true
