    # info


    Another way to get information about programs is with `info`. Whereas `man` is
    a universal holdover from UNIX, `info` is a creation of the `GNU` project, and
    is intended as an improved way to manage documentation for all the `GNU` utilities.


    The `info` program provides information in threaded chunks called `nodes`. Each
    node contains a description of a particular program at a specific level of detail,
    so a complex program may have a number of nodes. Typing `info` all by itself takes
    you to the top level node; typing `info program` takes you to the information
    node for that program. If there isn''t an `info` page available for the program,
    `info` will search for a `man` page, and if that fails, it will take you to the
    top level index node.


    Because of this extra level of features, there is an extra level of commands.
    There is a helpful tutorial available by typing `info info` at the command line.
    An `info` screen looks like Figure 6.14. Notice how the first line shows you which
    node you are currently viewing, and which nodes (may be) next, previous, and up
    from your current node. The bolded line at the bottom also shows which node you
    are viewing and where you are within it (Top, a percentage through it, or Bot
    if you are at the bottom).


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_195_0.png)


