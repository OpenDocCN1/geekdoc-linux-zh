    # RUNLEVELS


    Today’s modern Linux operating system can be used in various different ways for
    the user and administrator. This approach allows the Linux operating system to
    provide different services to be executed with limited and/or complete control
    of the system for the root administrator. This is needed to install, repair, and
    provide different levels of system maintenance without impacting the Linux user
    or preventing the execution of functions because users are still logged on and
    using the system. This section introduces the functionality of the init program
    and the seven different Linux runlevels.


    # The `init` Command


    The `init` command, as indicated in this chapter, provides two services. The first
    service is the version of `init` accessible by the Linux kernel after the virtual
    file system is created. It was discussed earlier in the “Introduction” section
    of this chapter for executing a new installation of a Linux distribution or executing
    an existing installation of a Linux distribution.


    Regardless of which `init` program is used, both versions of the program are used
    by your Linux system. The second `init`, the one retrieved from the root (\/)
    filesystem is responsible for executing start and stop Linux runlevels.


    # Linux Seven Runlevels


    *Runlevels* are specialized scripts that define how a computer system starts or
    stops by executing various services or processes and the level of root administration
    and user access. The runlevel is changed by having a privileged user run `telinit`
    or `init`, which sends appropriate signals to init. For your'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Linux system, seven different runlevels exist. The runlevels are numbered from
    0 through 6. Table 4.3 provides a description of each of the runlevels.


    Your system can be configured to launch any of the above runlevels. Some choices,
    runlevels 0, 4, and 6 are obvious choices you do not want to configure as initial
    startup runlevels. However, the other runlevels are viable options depending on
    your objectives. Most systems set their default runlevels to either 3 or 5.


    To execute runlevels, two types of scripts are located in the /etc/init.d directory
    and both types are called through *symbolic links*. The first set of scripts,
    executed by the `init` command, is started during the system’s boot process or
    whenever you initiate the shutdown process. These scripts are contained in the
    /etc/inittab file, as shown in Figure 4.8. The default runlevel setting is located
    in the file /etc/inittab. The default runlevel entry looks like the following
    in the file:


    ```

    id:5:initdefault:

    ```


    For the file presented in Figure 4.8, the runlevel is configured to start up in
    multiuser mode and provide network connectivity and X Windows support for Windows
    Managers. In addition to the default runlevel listed in the file,


    **Table 4.3 Runlevels**


    | Runlevel | Description | Special Comments |

    | :--- | :--- | :--- |

    | 0 | This runlevel shuts down or halts your system. | This option terminates
    all programs and services. Be careful. |

    | 1 | Single user mode | The parameters s or S can be used as substitutes for
