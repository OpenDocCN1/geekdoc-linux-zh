  md: "browsing the network to see what file and printer shares are available on other\
    \ computers.\n\nThere will be one Local Master Browser (LMB) on a network, and\
    \ this is decided automatically by the nodes in the network. This LMB will hold\
    \ the list of available services and provide these upon request (typically when\
    \ a Windows client clicks on the Network Neighborhood button). In addition, in\
    \ LMBs, these lists can be populated across domains via Domain Master Browsers\
    \ (DMBs). Because of the time it takes to synchronize these DMBs, changes may\
    \ take an hour or more to propagate across the domains.\n\n# Configuration Files\n\
    \nThe main configuration file for Samba is smb.conf, which usually resides in\
