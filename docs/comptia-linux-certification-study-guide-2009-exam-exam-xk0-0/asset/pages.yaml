    \ don’t know the default gateway ahead of time. I can build that right into the\
    \ command, though, using an alias and some command-line redirection:\n\n```\n\
    alias pdg='ping -c 3 `ip route show 0.0.0.0/0 | cut -d \" \" -f 3`'\n```\n\nThe\
    \ ip route show gives information about the default route; but I only want the\
    \ actual IP address, so I use cut to grab just the third piece of information\
    \ in the list (the address). All that is inside the tick marks (` `), so it gets\
    \ worked out and then fed to ping. I could just type that whole thing out every\
    \ time, but that’s even worse than"
