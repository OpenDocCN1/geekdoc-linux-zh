    # **EXERCISE 5.3: Troubleshooting IP Address Conflicts**


    On occasion, there are address conflicts within a system. To resolve this, you
    can do the following.


    +   1.  On the system (or systems) that appear to have the IP address conflict,
    use the `/sbin/ifconfig` command to check the network cards and to look at the
    hardware and IP addresses.


    +   2.  On the DHCP server, check the ARP addresses associated with the IP address
    and see which system it matches.


    +   3.  Release and renew the IP address locally using the `dhcpcd` command

    +       ```

    +       dhcpcd --release

    +       dhcpcd --renew

    +       ```


    +   4.  Check the IP address. It should now be a unique address. If there are
    still conflicts, a static address may have been assigned to another system. In
    this case, turn off your system and use traceroute from the DHCPD server to locate
    the rogue system.


