    # Redundant Array of Independent Disk


    RAID is a form of technology available to Linux systems that uses your disk subsystem
    to provide enhanced read/write performance, protection against data lost due to
    disk failures, or both. It can be implemented using hardware specific RAID controllers
    (known as *Hardware RAID*) or RAID functionality embedded within the operating
    system (known as *Software RAID*). Regardless of whether you use hardware- or
    software-based RAID, your disk subsystem must include two or more hard disks that
    will be grouped together into an array to form a virtual hard disk. The advantages
    and disadvantages are presented below:


    +   ■ Hardware-based RAID performs faster than the software-based RAID implementation.
    This is because Software RAID requires more CPU time and has additional memory
    requirements than Hardware RAID.

    +   ■ Software-based RAID is operating system dependent and hardware-based RAID
    is vendor independent.

    +   ■ Hardware-based RAID is more expensive than software-based RAID. Hardware-based
    RAID requires you to purchase additional hardware components (for example, RAID
    controllers).'
