- pgno: 316
  md: 'The `gpasswd` command manages the passwords, which can be securely stored in
    the /etc/gshadow file.


    # EXERCISE 10.1: Creating and Managing Users


    In this exercise, we''ll use some of the user management tools. Try the following
    logged in as administrator at a command prompt:


    +   1. `adduser -m tom` to create a user named tom with the next available user
    ID and create a home directory of /home/tom.

    +   2. `ls /home` to confirm his new home directory is there.

    +   3. `tail /etc/passwd` to confirm his new entry in the user file.

    +   4. `tail /etc/shadow` to check the secure password file. Note the "!" in the
    second field, indicating a password hasn''t been set yet.

    +   5. `su passwd tom` will let you set a password on tom''s account.

    +   6. `tail /etc/shadow` should now show an encrypted password on tom''s account,
    and he''ll be able to log in.


    This certainly works for making a user account, but many distributions offer handy
    all-in-one utilities. In SuSE, you can use YAST2 to manage users and groups.


    # FILE PERMISSIONS AND OWNERSHIP


    As you recall from the `ls -l` command in Chapter 6, “Using BASH,” UNIX file systems
    have a mechanism for tracking who can do what with each file. This consists of
    a set of nine bits and is called the file''s *mode*. The first bit represents
    the ability for the files owner (*User*) to *Read* the file, the second bit the
    User ability to *Write* the file, and the third is the ability for the *User*
    to *eXecute* the file (if it is a script or other executable file). The next three
    bits define the same rights for members of the files *Group*, and the third set
    of three defines what everyone else can do with the file – *Read, Write,* or *eXecute*.
    As they appear in the `ls -l`, a file with all the bits set looks like: -rwxrwxrwx
    (the leading dash is where the file type bit shows up, “-” for regular files).
    Any bit not set is shown as a dash, so -rwxr-x-- allows the user who owns the
    file to Read, Write, and eXecute, all members of the group associated with the
    file to Read and eXecute, and limits everyone [else] to no access at all.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Tools


    There are a number of commands used to manage permission bits and other file attributes.
    As a system administrator, you’ll be using them regularly, not to mention they
    are covered extensively on the exam, so pay particular attention.


    # chmod


    The chmod command is used to change the permission bits themselves. The syntax
    is as follows:


    ```

    chmod [Options] MODE FILE

    ```


    There are two particular handy options


    +   -R or --recursive will make changes in the entire subdirectory tree.


    +   --reference=file1 file2 will set the permission bits on file2 to match file1.


    There are also two very different ways to represent the mode: using numbers and
    using letters.


    Using numbers is very quick, but a little tougher to get used to. It uses a three
    digit base-8 (octal) number, with each digit representing the eight binary options,
    the first digit for the owner, second for the group, and third for everyone else
    (other). All possible combinations are shown in Table 10.1 (below) from "The Linux
    Administration Handbook."3


    Hence, to set file3 so that only owner and group can read and write to it, you
    would enter


    ```

    chmod 660 file3

    ```


    **Table 10.1** File permission modes in Octal, Binary, and text'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Once you get used to using numbers, the option to use letters seems clunky,
    but it does have one advantage: when using numbers, ALL the bits get set at once,
    where with letters you can adjust individual parameters one at a time. The specific
    format has a lot of combinations of options, but is basically


    ```

    chmod who what changes fileName

    ```


    The who can be


    +   - u for user

    +   - g for group

    +   - o for everyone (think "other")

    +   - a for all of the above


    The what changes bit has two parts


    +   - + to add a permission

    +   - - to remove a permission

    +   - = to set all the permission bits as shown, which is analogous to the way
    the octal format works


    The other part specifies which bit to set


    +   - r for read

    +   - w for write

    +   - x for execute


    To put all that together, you list the letter(s) for the who, then the +, -, or
    =, then the combination of r, w, and/or x that you want, and finally, the file
    name you want to change. Multiple changes can be made by separating them with
    commas. To change the file used in the previous example to remove the ability
    of group members to write to it, you would use this


    ```

    chmod g-w file3

    ```


    To allow the user and group to execute the same file, you would use this


    ```

    chmod ug+x file3

    ```


    # **Learn by Example: Managing File Permissions**


    Suppose you have a file called shared.doc that you’d like everyone in your group
    to be able to read, but only you get to write to it, and everyone else can’t do
    anything with it. In other words, you want user rights set to read and write,
    group rights to read,'
  merge: -1
  img_proc: true
- pgno: 319
  md: "and other rights left blank. Use `ls -l shared.doc` to check the current file\
    \ mode. Now, consider for a moment that in each role (owner, group, other), you\
    \ add a four to read, a two to write, and a one to execute. For the owner, you\
    \ want both read (4) and write (2) for a total of six in the first position. The\
    \ group bit in the next position only gets to read, so it gets a four. The mode\
    \ position for “other” doesn’t get any rights and stays at zero. Putting it all\
    \ together, you get a mode of 640, and **the numeric command** to set that mode\
    \ on the file is `chmod 640 shared.doc`.\n\nNow, suppose the requirements change,\
    \ and you’d like everyone in the files group to be able to edit the file and everyone\
    \ else to read it, with the other permissions staying the same. That would add\
    \ two to the group position and four to the position for “other,” making the file\
    \ mode 664. You can still use the numeric form of the command, `chmod 664 shared.doc`,\
    \ but the alphabetic form of `chmod g+w,o+r shared.doc` also works. With time\
    \ and practice, this will become second nature, and you’ll start to recognize\
    \ file modes on sight.\n\n# Exam Warning\n\nThe execute bit has to be set before\
    \ a binary executable file can be run, but because a script has to be opened for\
    \ the interpreter to see the commands inside, it needs both the read and execute\
    \ bits set.\n\n# chown\n\nThe `chown` command is used to change a files owner\
    \ and group. The syntax is as follows:\n\n```\n```text\nchown [OPTION] [username][:[groupname]]\
    \ filename\n```\n```\n\nThe most useful options are the same as for chmod\n\n\
    +   - `-R` or `-recursive` will make changes in the entire subdirectory tree.\n\
    +   - `--reference = file1 file2` will set the owner and group on file2 to match\
    \ file1.\n+   \n+   If you are only changing the owner, the colon is optional.\
    \ Otherwise\n\n+   - `username:groupname filename` will change the files owner\
    \ to username and the group to groupname.\n+   - `username:filename` will change\
    \ the files owner to username and change the group to the users primary group\
    \ (note the colon after the **username**)."
  merge: -1
  img_proc: true
- pgno: 320
  md: '▬ `:groupname filename` will change the files group to groupname. This is the
    same as using `chgrp` (discussed next, in the chgrp section).


    You can use the numeric UID or GID in place of a user name or group name.


    # chgrp


    The `chgrp` command works the same as `chown :group`, as mentioned earlier, although
    it may be easier to remember. The syntax is also similar but without the colons


    ```

    chgp [OPTION] groupname filename

    ```


    It also includes the same useful options of


    +   ▬ -R or --recursive will make changes in the entire subdirectory tree.


    +   ▬ --reference = file1 file2 will set the group on file2 to match file1.


    # chroot


    The `chroot` command is a bit different than the preceding commands. It doesn’t
    change any of a file’s attributes; instead it changes how much of the file structure
    a program is allowed to see. It does this by redefining the top of the directory
    tree [root] to wherever you specify. It is most often used to box in a program
    that is exposed to the public Internet, so that if it should be compromised, the
    attacker only has access to a minimum portion of the computer. It is often referred
    to as a “jail” or a “sandbox.” The syntax is


    ```

    chroot newroot [command]

    ```


    This is normally used as a function within a script, but if the command is left
    off, `chroot` will give you a bash shell with the root you specified.


    # lsattr


    The `lsattr` command is used to display a set of attributes that may be set on
    files and directories stored on common Linux drive formats (ext2 and ext3 in particular).
    These attributes define a number of advanced options and features that the computer
    uses when accessing information. The attributes include the following:


    +   ▬ i means a file immutable; only the root user or privileged kernel processes
    can make changes to it. This essentially locks a file that you don’t want to be
    changed.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   a makes a file `append-only`, so it can only be added to. This is handy
    for log files, making it harder for an intruder to hide their tracks.


    +   d marks a file to be skipped by backups (*d for dump*, a basic backup program).


    +   c marks a file for compression at the kernel level.


    +   s marks a file so that it gets overwritten with zeros when deleted to enhance
    security.


    +   A tells the system not to use `atime` to update the access time on a file.
    This is occasionally used to reduce unnecessary writes to logs on a flash-memory-based
    file system, which have a limited number of write-cycles. Although the “limited”
    number is huge, updating a set of files every second burns through them unnecessarily
    quickly.


    +   S tells the system to immediately write any changes to the file, instead of
    caching them. This makes the file less likely to be impacted by a system failure
    or power outage that may occur between the time a file is changed and when the
    system gets around to writing that change. It reduces performance a bit, but may
    be worth the trade off for a particularly important file.


    +   D does the same as S, but for directories.


    +   u marks the file to allow it to be undeleted.


    +   H indicates that a file uses special block sizing to allow it to be larger
    than 2TB (think HUGE).


    The syntax for `lsattr` is


    `lsattr [OPTIONS] [filename]`


    Useful options include


    +   -d will list directories but not their contents.


    +   -R will recursively list subdirectories.


    # chattr


    The `chattr` command is used to change the attribute bits that were covered in
    the `lsattr` section. The syntax is


    `chattr [OPTIONS] [mode] filename`'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'The mode is a `+`, `-`, or `=` to add, remove, or set exactly a list that consists
    of valid option letters described in the `lsattr` section earlier. An example
    is `chattr +dcs /home/bob/temp_stuff`


    This would mark bob’s `temp_stuff` file to not be backed up, be compressed, and
    when it gets deleted, the space it used to occupy would be overwritten with zeros.


    # Exam Warning


    > Not all of the available options may be incorporated into a particular Linux
    kernel and may have unexpected results even if they are. Additional research should
    be done before testing any of these on a production system.


    # EXERCISE 10.2: Using Attributes


    In this exercise, we’ll test out the append-only attribute. In a command-line
    session with administrator privileges, type the following:


    +   1. `touch test_file` to create a test file.

    +   2. `lsattr test_file` to confirm no attributes are set.

    +   3. `vi test_file`, `i` to insert some text, `<esc> wq` to save the file.

    +   4. `chattr +a test_file` to set the append-only attribute.

    +   5. `lsattr test_file` to see the attribute bit set.

    +   6. `vi test_file` again, `i` to add some more text, `<esc> wq` to save the
    file. Note that this time, it won’t let you. Use `q!` to quit without saving.

    +   7. `rm test_file` to try and delete it.

    +   8. `ls >> test_file` to append a directory listing to the file.

    +   9. `cat test_file` to show that you have successfully appended to the file,
    even though you can’t edit or delete it.

    +   10. `chattr -a test_file` to remove the append-only attribute bit.

    +   11. `rm test_file` – can you delete it now?


    # *umask*


    The `umask` command is used to set the default file permissions that a file gets
    when it is first created. Unlike the `chmod` command, `umask` uses a list of octal
    values to indicate what rights to *remove*. A typical umask is 0022 (the first
    bit'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'is for special permissions, discussed next). The two mean new files will have
    the write privilege removed for members of the files group and other.


    You can view your umask by simply typing the umask command or change it by using


    ```

    umask newmask

    ```


    You can also use umask with the same letter syntax as chmod by using the -S parameter
    (for Symbolic). It will also accept letters to set the mask. Using letters tells
    the system which bits to set, as opposed to which bits NOT to set for the number
    representation, which may be less confusing to use.


    To make a change permanent, you can add the command on your shell startup script,
    so it gets run every time you start a shell.


    # EXERCISE 10.3: Using umask


    In this exercise, you''ll see a quick use of umask.


    +   1. mkdir test to create a test subdirectory.

    +   2. umask to show the current mask -- probably 0022.

    +   3. touch test_file1 to create a file.

    +   4. ls -1 test_file1 to see the file mode.

    +   5. umask 0000 to change the mask.

    +   6. touch test_file2 to create a new file, using the changed mask.

    +   7. ls -1 to compare the mode of your two files.


    # Special Permissions


    In addition to the normal permission bits, there are additional special permissions
    that are represented by a fourth octal number, put in front of the normal three.
    Linux figures out what you want automatically -- if you use four numbers, it understands
    the first one is for special permissions and if there are only three numbers,
    it sticks with the regular read, write, and execute permissions.


    Similar to the normal permissions, an octal value of 4 is the setuid, 2 is the
    setgid, and 1 sets the sticky bit. They are set using the same chmod command as
    the normal bits, either using a four-digit octal value or the same method using
    letters, but with the following additional letters:


    +   * s sets the user or group ID

    +   * s restricted deletion flag

    +   * t sticky bit'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'The special permissions have different meanings depending on whether they are
    set on a file or a subdirectory, as described below in the **setuid** section.


    # **setuid** and **setgid**


    When the *setuid* or *setgid* bit is used on a directory, it will cause files
    created within the directory to have the UID or GID of the directory, instead
    of the user who created the file. This is convenient for shared directories, so
    everyone who is a member of the directory group can easily share files.


    When the *setuid* or *setgid* bits are set on an executable file, the program
    runs with the privileges associated with the program owner or group membership
    of the program and not the user who is running it. This allows users to run programs
    that can get to things the user wouldn''t be able to directly.


    As an example, consider the `passwd` command, which allows users to change their
    passwords. This command needs to read and write to the /etc/shadow file where
    users'' passwords are stored, a file that users don''t have access to. Using the
    setuid bit, users are able to run that specific command with the necessary administrator
    rights to get the job done. Try `ls -al /usr/bin/passwd` to see the setuid bit.


    # **sticky bit**


    The third special permissions bit is called the *sticky bit*. When this is set
    on a directory, files within that directory can only be renamed or deleted by
    their owner, the directories owner, or the system administrator. Without the sticky
    bit, any user with write and execute privileges in the directory could delete
    files. This is another handy feature to have in shared directories, which limits
    what users can do with shared files owned by other users.


    # SELINUX BASICS


    As mentioned in the beginning of the chapter, Linux is considered a secure operating
    system. There is always room for improvement, though, and the goal of Security
    Enhanced (SE) Linux is to greatly reduce the possibility of security problems
    on Linux-based systems.


    One of the problems with most current computer systems – including Linux – is
    that they are dependent on the software provider to recognize and then repair
    potential security problems, then the system administrator has to find and apply
    any fixes. Computers can be configured to automatically find and apply updates,
    but that can introduce additional problems. The real risk is that someone figures
    out how to exploit a vulnerability in your system before you get a chance to patch
    it or even before the software provider realizes there is a problem and can fix
    it. These security problems'
