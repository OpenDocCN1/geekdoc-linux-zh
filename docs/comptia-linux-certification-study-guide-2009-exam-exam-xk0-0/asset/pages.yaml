  md: '# Managing Filesystems


    +   **Exam objectives in this chapter**

    +   *   Filesystem Types

    +   *   Mounting and U(n)mounting Filesystems

    +   *   Partitions

    +   *   Directories

    +   *   Filesystem Management


    # UNIQUE TERMS AND DEFINITIONS


    +   ❑ *Filesystem* A *filesystem* provides the operating system with a framework
    (a structure) for the storage, organization, modification, removal, and retrieval
    of digital information. It is responsible for organizing and maintaining files,
    folders, metadata, and residual data as containers for storing digital information.

    +   ❑ *Swap* The allocation of physical disk space to function as virtual memory
    when the amount of physical memory (random access memory [RAM]) is full. If the
    system needs more memory resources and the physical memory is full, inactive pages
    in memory are moved to the swap space. When the system swaps out pages of memory
    to the hard disk drive, the system’s RAM is freed up to perform additional functions.'
  merge: -1
  img_proc: true
