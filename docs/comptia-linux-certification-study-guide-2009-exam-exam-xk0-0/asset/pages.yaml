    # ### apachectl


    On a Linux system, the Apache server is run as the httpd daemon, which is often
    started on boot. There is a control script called apachectl that should be used
    to invoke the httpd daemon. This script will ensure that the correct environment
    variables are set before httpd is called. The script will pass any command-line
    arguments to httpd if necessary, or the script can be edited (if you want!) to
    ensure that specific arguments are always passed to httpd. The control script
    syntax is `apachectl [http-argument]` and the main arguments are shown in Table
    9.4, apachectl arguments.


    Once you have started the Apache server, connecting to the server with a Web browser
    will display the default start page, as shown in Figure 9.1.


    **Table 9.4 apachectl Arguments**


    * `start` Starts the httpd daemon, displaying an error if it is already running

    * `stop` Stops the httpd daemon

    * `restart` Restarts the httpd daemon (or starts it if it is not running)

    * `status` Displays a status report


