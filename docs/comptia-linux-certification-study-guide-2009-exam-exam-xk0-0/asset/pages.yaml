- pgno: 22
  md: '# INTRODUCTION


    The Linux+ certified professional needs to have a good understanding of the overall
    Linux system before installation. This knowledge is required to successfully install
    the Linux operating system. In this chapter, you will learn the information needed
    to configure the Linux system during the initial installation. The Linux+ exam
    covers the general fundamentals for the installation of the Linux operating system.


    Initial operating system installation requires the Linux+ professional understand
    several important concepts such as computer hardware, system environment settings,
    partitions, filesystems, and network settings. The Linux operating system''s successful
    installation is predicated upon good planning performed in advance. The planning
    can be performed formally or informally. However, because of the complexity and
    flexibility of the Linux operating system process and various different types
    of computer hardware available, you should plan your installation. This means
    that you need to determine the role of the Linux system in your environment, gather
    computer hardware information, and obtain network configuration information so
    that you can answer questions asked during the installation process.


    # A NOTE ABOUT HARDWARE


    The success of any operating system is dependent on its current and future relationship
    with hardware vendors. In some cases, operating system vendors also manufacture
    the system hardware for their own operating system (for example, Apple Macintosh).
    This approach was very common in the past (for example, Digital Equipment VAX,
    IBM PS/2, Sun Microsystems Sun/SPARC Family, AT&T 3B2). For those types of operating
    system vendors, supporting various hardware devices presented several compatibility
    challenges.


    Many of today''s major operating system vendors do not manufacture their own system
    hardware (for example, Microsoft, Novell, and Red Hat). Instead, they have decided
    to rely on hardware standards used throughout the computer industry. Linux distribution
    is no exception. Today''s Linux operating systems have achieved popularity and
    powerlessness because its users are benefiting from a wide variety hardware standards
    used throughout the computer industry. This flexibility is based on the Linux
    hardware compatibility architecture and the use of the open-source community.
    The Linux hardware compatibility architecture is divided into four categories,
    as shown in Figure 2.1.


    The four categories are listed below:


    +   - Central processing unit (CPU) architectures supported by the Linux operating
    system, probably one of the most impressive, continue to'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# A Note about Hardware **11**


    ![](img/95b3ebd6248b36778ccf73988aaab2f2_23_0.png)


    FIGURE 2.1 Linux compatibility architecture for hardware.


    expand. Some of the CPUs currently supported are AMD, Alpha, ARM, IA-64, m68k,
    MIPS, PA-RISC, PowerPC (for example, Apple, IBM), S/390, SPARC, 32-bit PC-x86-based
    (for example, AMD, Intel), and 64-bit PC-x86-64 (for example, AMD, Intel).


    +   * Hardware abstraction layer (HAL) is designed to function as a tier between
    the physical hardware and the software functioning on the system. As an abstraction
    layer, its purpose is to hide hardware complexity and differences from the operating
    system kernel. This approach allows you to select a CPU-specific Linux kernel
    for functioning on different hardware systems. Today’s modern operating systems
    (for example, Windows, BSD, Linux, MAC OS X, CP/M, Solaris) are designed to interoperate
    with the HAL.


    +   * Linux monolithic kernel is an architecture designed to function dynamically.
    It supports the loading of modules and instructions to implement all operating
    system services (for example, process management, concurrency, and memory management).
    The Linux kernel integrates the CPU architecture via a series of device drivers
    and kernel extensions.


    +   * Hardware components are presented as device drivers (for example, printers,
    monitors, video cards, storage devices, and modems) within the Linux environment.
    For each Linux version (for example, openSUSE and Red Hat), a unique Linux Hardware
    Compatibility List is created. The Linux Hardware Compatibility List contains
    supported hardware devices for that specific Linux version.


    The overall four-category approach of the Linux operating system extends its functionality.
    This approach to modularize the Linux Hardware Architecture allows it to function
    with an extremely wide range of computer hardware components. In fact, this approach
    has enabled Linux to work with'
  merge: -1
  img_proc: true
- pgno: 24
  md: "every conceivable piece of hardware. In addition, the decision to support the\
    \ open-source community has also played a critical role in extending the Linux\
    \ hardware environment. The open-source environment continues to add new hardware\
    \ components daily through the development and support of various Linux hardware\
    \ components. The hardware open-source program is a part of the open source culture.\
    \ For the four categories, several Web sites provide a list of compatible systems\
    \ and devices. The Linux community uses several Web sites, including the following,\
    \ to determine the compatibility of various hardware and full systems supported\
    \ by various Linux distributions:\n\n+   www.tldp.org/howto/hardware-howto\n+\
    \   http://en.opensuse.org/hardware\n+   www.linux-drivers.org\n+   http://hardware4linux.info\n\
    +   www.linux.org/hardware\n\n> **Learn By Example: Measure Twice, You Can Only\
    \ Cut Once**\n> \n> During my early years as a consultant, I was requested to\
    \ provide an emergency support to a large corporate customer. I was contacted\
    \ on Saturday and requested to show up first thing Monday morning. The large customer\
    \ migrated all of their main servers supporting a critical application from one\
    \ operating system to a different operating system. I was informed that the migration\
    \ went well and that all the applications on the servers worked fantastically.\
    \ This included the major applications. The only problem was that the customer\
    \ and their user-supported community could not print. No printing! This included\
    \ not being able to print invoices or payroll checks from the main application.\
    \ As a result, they needed emergency services to determine why this was the case\
    \ and what would be their next steps. Upon arrival, I reviewed the customer environment\
    \ and sized up the magnitude of the printing problem.\n> \n> Based upon my ace\
    \ superhero skills, I was able to ascertain that no print drivers existed for\
    \ the 20 special printers within the new operating system that the customer migrated\
    \ toward. Their mission critical application could not print because there were\
    \ no print drivers. In addition, the customer could not go back to the previous\
    \ operating system servers. Those servers were reformatted and rebuilt to support\
    \ the new operating system. Migrations are typically one way… forward! The customer\
    \ terminated their contract with the previous consulting firm and hired my team\
    \ to resolve the current situation and assist them with the migration of the remaining\
    \ servers.\n> \n> Do you ask, how did I know so quickly? I checked the new operating\
    \ system vendor’s Hardware Compatibility List (HCL) and also with the printer\
    \ vendor’s technical support team. The HCL is very important! Remember software\
    \ migration is not the only issue, you may also be required to migrate peripheral\
    \ devices (for example, printers"
  merge: -1
  img_proc: true
- pgno: 25
  md: '> and modems). I was able to get the customer to print from the existing printers.
    How? I noticed on the HCL a printer mode that the existing 20 printers could emulate.
    This approach was used until the printer vendor was able to develop new printer
    drivers for the customer''s new operating system. I miss the good old days!


    The knowledge of the four-category approach for the most modern operating systems
    is a requirement for any computer professional. The Linux professional is no exception.
    Ironically, with the development of kernel-based architectures, many of today''s
    operating systems hide a lot of their computer hardware functionality within the
    operating system. The Linux operating system does not. As a result, you should
    have a good understanding of how the Linux computer hardware works. For the Linux+
    exam, you will need a fundamental understanding of the following components:


    +   Power supplies are the devices required to provide the various computer hardware
    components [for example, motherboards and internal disk drives] within your system
    with direct current (DC). The power supply regulates the alternating current (AC)
    received from a wall''s outlet by transferring it into DC required by computer
    chips; it is housed inside the system unit.


    +   Motherboards are perforated circuit boards housed inside the system unit that
    contains the CPU, the memory (RAM) chips, and the slots available for the expansion
    cards. It is the largest printed circuit board; all the other expansion boards
    [for example, video cards and sound cards] interface with it to receive power
    and to provide bidirectional communications.


    +   CPUs, the brains of the computer, are responsible for data processing and
    are the most important chip in the computer. CPUs control the functions performed
    by the various hardware components, processes all software instructions issued,
    and determines the speed of the system. The CPU is housed inside the system unit.


    +   Memory, implemented as computer chips, helps process data or instructions
    by storing the instructions or data that the CPU processes.


    +   Expansion boards are devices that expand the capabilities of a computer by
    enabling a range of different devices [for example, monitors, speakers, and modems]
    to communicate with the motherboard.


    +   Video adapters are expansion cards that translate binary into the images viewed
    on the computer monitor.'
  merge: -1
  img_proc: true
- pgno: 26
  md: "+   ■ Storage devices are internal and external devices (for example, hard\
    \ disk drives, floppy disk drives, and CD drives) used for storing data and information.\n\
    \n> Note  \n> \n> The Linux+ certification exam will not test you on computer\
