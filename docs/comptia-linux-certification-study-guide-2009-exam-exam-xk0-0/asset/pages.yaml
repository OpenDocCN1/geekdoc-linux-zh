    \n```\n```\nrdeskstop hostname.myccorp.com\nredeskstop 10.10.100.23\n```\n```\n\
    \n> **Note**  \n> The target server or client must have the remote desktop connection\
    \ enabled for this to work. In addition, you may need to supply user name and\
    \ password credentials applicable to the target host. The protocol runs on port\
    \ 3389, which will need to be open on any intermediate firewalls.\n\n# Virtual\
    \ Network Computing\n\nVNC was developed by AT&T to administer machines. This\
    \ is a client-server application, and there are now a number of different versions\
    \ that are both open source and commercial. The VNC server itself is often built\
    \ into the"
