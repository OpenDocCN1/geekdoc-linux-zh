- pgno: 172
  md: '# **CHAPTER 6: Using BASH**


    for any number of any character and "?" for just one of any character. For example,
    if we have a directory that contains the following:


    ```

    file1

    file11

    file111

    file2

    file22

    file222

    ```


    `ls` (and `ls *`) will show all six files; `ls file1*` will show file1, file11,
    and file111 (all files starting with "file1" and followed by zero or more other
    characters); `ls file?` will show file1 and file2 (all files starting with "file"
    followed by exactly one character). Note that multiples are valid: `ls file??`
    shows file11 and file22. The wildcards can also be used in the middle of the parameters;
    to show file111, type:


    ```

    ls f*111

    ```


    They can also be combined; for example,


    ```

    ls f*1?

    ```


    Of course, wildcards can be used with any command that takes parameters; so, whereas
    `ls f*11` lists all files in a directory that start with "f" and end with "11,"
    `cp f*11` copies the same list of files, and `rm f*11` deletes them.


    > **Note**

    > For more advanced file selection, you can use *Regular Expressions*. These define
    a complex method of specifying patterns to be matched and are supported in many
    utilities, not just in Linux. For more information, go to www.regular-expressions.info.


    Once you start digging around in the file system, you''ll probably find the `ls`
    command a bit awkward if you are looking for something and aren''t sure which
    directory to search in. Fortunately, there are other commands to help, including
    the following:


    +   - `find`

    +   - `locate`

    +   - `slocate`

    +   - `which`

    +   - `whereis`'
