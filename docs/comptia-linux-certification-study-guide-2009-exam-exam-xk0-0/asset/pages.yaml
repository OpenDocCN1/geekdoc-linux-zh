- pgno: 29
  md: '+   - **Repair installed system** This option repairs a previously installed
    system. It boots the graphical repair system. This option also appears again after
    the System Probing phase covered later in the chapter.


    +   - **Installation** This option loads the mini Linux kernel from the Linux
    distribution and starts the installation process.


    +   - **Rescue System** This option starts a specialized small Linux kernel without
    a graphical user interface. It loads the Linux kernel into RAM and can modify
    configuration files, check the filesystem for defects, verify and/or modify the
    boot loader configuration, resize the partition, and a few other critical system
    modifications that may be necessary.


    +   - **Check installation media** To verify you have an authentic copy of Linux
    before installing, this option checks .iso image’s integrity. It uses the MD5
    cryptographic hash algorithm. To verify the integrity of other media, a number
    of free MD5 and SHA cryptographic hash algorithms are available and downloadable
    from the Internet.


    +   - **Firmware test** This option tests the system’s Basic Input/Output System
    (BIOS) and Advanced Configuration and Power Interface (ACPI) compatibilities.


    +   - **Memory test** This option conducts systematic tests of your system RAM
    using memtest86. The memtest86 program is a stand-alone application for testing
    the physical memory on x86-based systems.


    The remaining options located in the bar at the bottom of your screen are used
    as follows:


    +   - **F1 – Help** The Function 1 Key [F1] provides helpful information about
    the various options.


    +   - **F2 – Language** The key allows you to select a different language for
    the installation of Linux (The default language is English).


    +   - **F3 – Video mode** The key allows you to select a desired graphical [screen
    resolution] or text mode for installation.


    +   - **F4 – Source** This selection determines the Linux installation source
    [for example, FTP, HTTP, NFS, CD, DVD, SLP], as shown in Figure 2.3. The “Installing
    across the Network” section presents this option in greater detail. The default
    installation source selected is DVD.


    +   - **F5 – Kernel** The key allows you to disable potential hardware components
    [for example, ACPI systems and DMA modes].


    +   - **F6 – Driver** This key installs optional drivers or updates existing drivers.'
  merge: -1
