  md: '# /etc/modules.conf Configuration File


    The behaviors of modprobe can be altered by the optional /etc/modules.conf file.
    This file consists of a set of lines, which looks similar to a shell script. The
    file will exist only if you are installing kernel modules, which are not compiled
    directly into the kernel and not handled by modprobe elsewhere.


    # Linux Hardware Compatibility List


    The devices that are supported by Linux are vast, and due to the open-source community
    this list is growing on a daily basis. However, every version of Linux (Debian,
    RedHat, and so forth) and every release of Linux will have a different set of
    supported hardware. Obviously, the newer the kernel, the more likely it will support
    the hardware device you are trying to install. Some devices will be detected and
    installed automatically, while others may need to be added manually.


    There are numerous Web sites that detail the compatibility of systems and individual
    pieces of hardware, such as www.linux-drivers.org. If you are building your own
    Linux system or installing Linux on an existing system, it is worth examining
    these sites to ascertain what problems (if any) you are likely to encounter during
    the build. Alternatively, using the `lived` option of a particular build can give
    you a very quick assessment of your hardware. The following sections will delve
    into the hardware support in more depth and how to load modules directly into
    the system.


    # NETWORKING


    It is very rare that a modern computer system is not connected to some form of
    network – even if that is just a modem to access the Internet. This will therefore
    require the setup of a network card and TCP/IP on your system. The importance
    of the network card and physical connection must be understood, especially in
    the corporate environment. It is not worth purchasing switches and networking
    to run at 1 GB/s and then install 10 MB/s NICs. Where possible, it is preferable
    to use the same NIC when setting up a network to reduce the support overheads
    and allow for a smaller inventory of spares.


    # Configuring the Interface


    When initially undertaking the network configuration, the basic rules that apply
    for any other device apply. If you are installing an NIC, ensure that it is on
    the supported device list for the Linux kernel you are installing. Most NICs'
