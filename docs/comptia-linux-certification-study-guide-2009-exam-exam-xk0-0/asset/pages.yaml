  md: 'domains as well, such as Elsevier is a division of Syngress, and as such could
    be defined as elsevier.syngress.com. Actual machines in each domain can be defined
    by their machine name and the domain they are in, which will give the Fully Qualified
    Domain Name [FQDN]. This specifies the exact position in the DNS tree structure.
    In DNS, this will be specified with the trailing dot, such as webserver.syngress.com.
    will define a machine whose name is webserver in the syngress.com domain. This
    will be a unique definition, although there may be other machines with a name
    of webserver, there can only be one webserver.syngress.com. in existence.


    The Domain name system is a distributed database, which uses a client-server model.
    The nodes of this database are nameservers, and each domain and subdomain has
    one or more authoritative DNSes that publish all the information about the domain.
    All this information is included in DNS zone files on the DNS server or nameserver.
    There can be forward and reverse zones defined. A reverse zone is used to associate
    an IP address with a hostname. A forward zone is used to associate a name with
    an IP address. The DNS resolver is the client part of the client-server architecture
    and is the process that performs the resolution of the query, for example, the
    translation of the FQDN to its actual IP address.


    # **DNS Resource Records**


    As stated in the section above, the resource records [RR] are the most basic part
    of the Domain name system. These records have a number of basic elements to them:
    type, time to live [TTL], class, and possibly some data specific to the type of
    record. These records are described in Chapter 5 in the section “DNS Record Type
    and DNS Resolution.”


    # **Caching Nameserver**


    If you install and configure a caching nameserver, this will build a local cache
    of resolved domain names and will use this list to serve other hosts on your network.
    In practice, a large number of DNS requests are the same, and this will increase
    the speed of resolution and decrease the amount of traffic you send upward to
    another nameserver. The named server program available on Linux systems, which
    is part of the BIND package, will be able to provide these services. Prior to
    version 8, BIND uses a configuration file based on /etc/named.boot, while later
    versions use /etc/named.conf. We will look at the earlier version because of its
    simplicity and the fact it is used more often. The /etc/named.boot file is usually
    a small file with pointers to master files containing zone information and other
    information. One of the first lines in the file will be a statement specifying
    where the main files are located:


    ```

    directory /var/named

    ```'
  merge: -1
  img_proc: true
