- pgno: 51
  md: '![](img/95b3ebd6248b36778ccf73988aaab2f2_51_0.png)


    # FIGURE 2.23


    *Suggested partitioning.*


    This section provides information you can use if you decide not to accept the
    recommended partitions. OpenSUSE presents you with the choice to select the default
    **partition-based** option or the **LVM-based** option. The *partition-based*
    option is the default selection. It will be presented first. The *LVM-based* option
    will be presented afterwards.


    Before we commence selecting any option, some initial knowledge about disks and
    partitioning is required. A physical hard disk, the kind you can purchase from
    a store, has several limitations; some are imposed by the disk manufacturer (for
    example, disk geometry) and others are imposed by your system manufacturer (for
    example, BIOS). Your hard disk drive is confined to operate within these constraints.


    Partition types are the first major constraints for hard disk drives. There are
    two major categories for partitions. Primary partitions are the first type. This
    type of partition divides the hard disk drive into physical groups. For most PC-based
    systems, a maximum of four primary (physical) partitions can be implemented on
    a hard drive. Extended partitions are the second type. Extended partitions can
    be further subdivided into smaller logical partitions (groups). By allowing you
    to further subdivide your extended partition into smaller logical partitions,
    you can create more partitions on your system.'
  merge: -1
  img_proc: true
- pgno: 52
