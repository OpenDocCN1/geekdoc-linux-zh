  md: 'you would type the command su -c ‘yum update tclient’. If the software is not
    installed, the system informs the user as shown below:


    ```

    $ su -c ''yum update tclient''

    Password:

    Loaded plugins: refresh-packagekit

    Setting up Update Process

    Package(s) tclient available, but not installed.

    No Packages Marked for Update

    ```


    If the software being updated is currently in use by the system, the application
    or service will need to be restarted before the update is made current.


    The kernel can also be updated using yum and these kernels will only come into
    force upon a restart of the system. When the kernel is updated, yum will retain
    the old version so that the old kernel can be booted into in case of an error
    with the new kernel. Only the current and previous versions are kept.


    Package groups can also be updated, for example, the MySQL Database package group
    is updated using the command su -c yum groupupdate ‘MySQL Database’.


    # ## Removing Software


    The removal of software is achieved using the remove option. Again, both packages
    and package groups can be removed. When this is invoked, yum will check the software
    package and the dependencies and will remove both.


    ```

    su -c ''yum remove firefox''

    su -c ''yum groupremove ''MySQL Database''

    ```


    When yum removes the software package, it leaves any user data in place, but the
    configuration files may be removed.


    # ## deb


    The Debian-derived distributions of Linux are based on the GNU project, which
    is a project that started in 1984 to produce an open-source Unix-like operating
    system. While it is often referred to as Linux, the correct name is Debian GNU/Linux
    as it combines both. The current version of Debian includes more than 25,000 packages.
    The Debian packages can be considered to be similar to the rpm packages in that
    they are precompiled for easy installation on the target system.


    There are three main package libraries available from the Debian package Web site
    [http://packages.debian.org]:


    +   - **Stable libraries** are well tested and will change only for security or
    major bug fixes.'
