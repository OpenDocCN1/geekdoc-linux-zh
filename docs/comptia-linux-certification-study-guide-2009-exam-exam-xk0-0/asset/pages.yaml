- pgno: 130
  md: 'Normal users will have two similar files, which are also called as


    +   *   `/home/user/.bash_profile` This is a personal startup file and is executed
    when a user logs into a system.


    +   *   `/home/usr/.bashrc` This is the personal interactive shell startup file.


    Both the above files can be edited by the user using an editor such as vi. The
    format for creating and modifying an environment variable within bash is always
