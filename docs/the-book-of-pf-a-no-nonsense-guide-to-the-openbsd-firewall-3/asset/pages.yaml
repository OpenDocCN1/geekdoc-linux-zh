- img_proc: true
  md: '+   OpenBSD''s website, http://www.openbsd.org/ is the main reference for OpenBSD
    information. If you''re using OpenBSD, you''ll be visiting this site now and then.


    +   You''ll find a collection of presentations and papers by OpenBSD developers
    at http://www.openbsd.org/papers/. This site is a good source of information about
    ongoing developments in OpenBSD.


    +   OpenBSD''s Frequently Asked Questions (http://www.openbsd.org/faq/index.html)
    is more of a user guide than a traditional question-and-answer document. This
    is where you''ll find a generous helping of background information and step-by-step
    instructions on how to set up and run your OpenBSD system.


    +   Henning Razer''s presentation "Faster Packets—Performance in the Network Stack
    and PF" (http://quignon.bsws.org/papers/2009/eurobsd-faster_packets/) is the current
    main PF developer''s overview of the work done in OpenBSD releases to improve
    network performance, with PF as a main component.


    +   PF: The OpenBSD Packet Filter (http://www.openbsd.org/faq/pf/index.html),
    also known as the PF User Guide or the PF FAQ, is the official document maintained
    by the OpenBSD team. This guide is updated for each release, and it''s an extremely
    valuable resource for PF practitioners.


    +   Bob Beck''s PF: it''s not for firewalls anymore" (http://www.ualberta.ca/-beck/nycbug06/pf/)
    is a NYCBUG 2006 presentation that covers PF''s redundancy and reliability features,
    illustrated by real-world examples from the University of Alberta network.


    +   Daniel Hartley''s PF papers (http://www.benzedrine.cx/pf/html) is the collection
    of PF-related material with links to resources around the Web.


    +   Daniel Hartley''s "Design and Performance of the OpenBSD Static Packet Filter
    (pf)" (http://www.benzedrine.cx/pf-paper.html) is the paper presented at Usenix
    2002. It details the design and implementation of PF.


    +   Daniel Hartley''s three-part undead. PF series includes: "Firewall Rules Optimization"
    (http://undead.org/cgi?article&sid=2006092701645), "Testing Your Firewall" (http://undead.org/cgi?article&sid=2006092808238),
    and "PF: Firewall Management" (http://undead.org/cgi?article&sid=2006092908043).
    The three articles cover their respective subjects in great detail just be reread.


    +   RFC 1631, The IP Network Address Translator (NAT), May 1994 (http://www.ietf.org/rfc/rfc1631.txt,
    written by K. Evegand and P. Francis) is the first part of the NAT specification,
    which has lasted longer than the authors apparently intended. While still an important
    resource for understanding NAT, it has been largely superseded by the updated
    RFC 3022 (http://www.ietf.org/rfc/rfc3022.txt, written by P. Srisuresh and K.
    Evegand), January 2001.'
