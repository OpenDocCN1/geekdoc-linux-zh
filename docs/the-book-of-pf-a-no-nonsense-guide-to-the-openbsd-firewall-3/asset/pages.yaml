- img_proc: true
  md: '# 10


    # GETTING YOUR SETUP JUST RIGHT


    ![](img/838f49667801fd8460438797800410dd_208_0.png)


    By now, you’ve spent significant time designing your network and implementing
    that design in your PF configuration. Getting your setup just right—that is, removing
    any remaining setup bugs and inefficiencies—can be quite challenging at times.


    This chapter describes options and methods that will help you get the setup you
    need. First, we’ll take a look at global options and settings that can have a
    profound influence on how your configuration behaves.


    # Things You Can Tweak and What You Probably Should Leave Alone


    Network configurations are inherently tweakable. While browsing the pf.conf man
    page or other reference documentation, it’s easy to be overwhelmed by the number
    of options and settings you could conceivably adjust in order to get that perfectly
    optimized setup.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Keep in mind that PF in general, the defaults are sane for most set-ups. Some
    settings and variables lend themselves to tuning; others should come with a big
    warning that they should be adjusted only in highly unusual circumstances, if
    at all.


    Here, we''ll look at some of the global settings that you should know about, although
    you won''t need to change them in most circumstances.

    These options are written as set option setting and after any macro definitions
    in your pf.conf file before translation or filtering rules.


    > If you read the pf.conf man page, you''ll discover that a few other options
    are available. However, most of those aren''t relevant in a network-testing and
    performancetesting context.


    # Block Policy


    The block-policy option determines which feedback, if any, PF will give to hosts
    to create connections that are subsequently blocked. The option has two possible
    values:


    +   - drop blocked packets with no feedback.

    - return returns with status codes, as Connection refused or similar.


    The correct strategy for block policies has been the subject of discussion over
    the years. The default setting for block-policy is drop, which means the packet
    is silently dropped without any feedback. Silently dropping packets, however,
    makes it likely that the sender will resend the unacknowledged packets rather
    than drop the connection. Thus, the sender may keep up the effort until the relevant
    timeout expires. If you don''t want this behavior to be the default in your setup,
    return:


    ```

    set block-policy return

    ```


    This means that the sender''s networking stack will receive an unambiguous signal
    indicating that the connection was refused.

    Whichever block-policy option you use will specify the global default for your
    policy. If necessary, however, you can still vary the blocking type for specific
    rules. For example, you could change the brute-force rule set from Chapter 6 to
    set block-policy to return but also use drop quick from <bruteforce> to make the
    brute forces waste time if they stick around once they''ve been added to the <bruteforce>
    table. You could also specify drop for traffic from nonroutable addresses coming
    in'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'on your Internet-facing interface or other clearly undesirable traffic, such
    as attempts to enlist your gear in amplifying a distributed denial-of-service
    (DDoS) attack.^1


    # Skip Interfaces


    The skip option lets you exclude specific interfaces from all PF processing. The
    net effect is like a pass-all rule for the interface, but it actually disables
    all PF processing on the interface. For example, you can use this option to disable
    filtering on the loopback interface group, where filtering in most configurations
    adds little in terms of security or convenience:


    ```

    set skip on lo

    ```


    In fact, filtering on the loopback interface is almost never useful, and it can
    lead to odd results with a aumber of common programs and services. The default
    is that skip is unset, which means that all configured interfaces take part in
    PF processing. In addition to making your rule set slightly simpler, setting skip
    on interfaces where you don''t want to perform filtering results in a slight performance
    gain.


    # State Policy


    The state-policy option specifies how PF matches packets to the table. It has
    two possible values:


    +   * With the floating state policy, traffic can match state on all interfaces,
    not just the one where the state was created.

    * With an in-bound policy, traffic will match only on the interface where the
    state is created; traffic on other interfaces will not match the state.


    Like the block-policy option, this option specifies the global state-matching
    policy, but you can override the state-matching policy on a per-rule basis if
    needed. For example, in a rule set with the default filtering policy, you could
    have a rule like this:


    ```

    pass out egress proto tcp to any port $allowed modulate (if-bound)

    ```


    With this rule, any return traffic trying to pass back in would need to pass on
    the same interface where the state was created in order to match the state-table
    entry.


    > ^1 If you''ve yet to be hit by this particular kind of nastiness, you will be.
    Here''s a writeup about a DDOS situation where the hamfistedness was equally distributed
    between both sides—the attacker and the attacked: http://bsdf.blogspot.com/2012/ddos-bots-arm-people-manned-by-some.html.
    Your attackers will be smarter and better equipped than these.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'The situations in which an if-bound policy is useful are rare enough that you
    should leave this setting at the default.


    # State Defaults


    Introduced in OpenBSD 4.5, the state-defaults option enables you to set specific
    state options as the default for all rules in the rule set—unless those state
    options are specifically overridden by other options in individual rules.


    Here''s a common example:


    ```

    set state-defaults pflow

    ```


    This option sets up all pass rules in the configuration to generate NetFlow data
    to be exported via a pflow device.


    In some contexts, it makes sense to apply state-tracking options, such as connection
    links, as a global default for the entire rule set. Here''s an example:


    ```

    set state-defaults max 1500, max-src-conn 100, source-track rule

    ```


    This option sets the default maximum number of state entries per rule to 1,500,
    with a maximum of 100 simultaneous connections from any one host and separate
    limits for each rule in the loaded rule set.


    Any option''s valid inside parentheses for keep state in an individual rule can
    also be included in a set-defaults statement. Setting state defaults in this way
    is useful if there are state options that aren''t already system defaults that
    you want to apply to all rules in your configuration.


    # Timeouts


    The timeout option sets the timeouts and related options for various interactions
    with the state-table entries. The majority of the available parameters are protocol-specific
    values stored in seconds and prefixed tcp, udp, icmp, and other. However, adaptive.start
    and adaptive define the number of state-table entries.


    The following timeout options affect state-table memory use and, to some extent,
    lookup speed:


    +   - The adaptive.start and adaptive.end set the limits for scaling down timeout
    once the number of state entries reaches the adaptive.start value. When the number
    of states reaches adaptive.end, the defaults are set to 0, essentially expiring
    all states immediately. The defaults are 6,000 and 12,000 (calculated as 60 percent
    and 120 percent of the state limit, respectively). These settings are intimately
    related to the memorypool limit parameters you set via the limit option.


    +   - The interval defines the number of seconds between purges of expired states
    and fragments. The default is 10 seconds.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '+   - The frag value denotes the number of seconds a fragment will be kept
    in an unassembled state before it''s discarded. The default is 30 seconds.

    - When set, src.track denotes the number of seconds source-tracking data will
    be kept after the last state has expired. The default is 0 seconds.


    You can inspect the current settings for all timeout parameters with pfctl -s
    timeouts. For example, the following display shows a system running with default
    values:


    ```

    $ sudo pfctl -s timeouts

    tcp.first             120s

    tcp.opening           30s

    tcp.established        86400s

    tcp.closing           900s

    tcp.finwait           45s

    tcp.closed            90s

    tcp.tsdiff            60s

    udp.first             30s

    udp.single           30s

    udp.multiple         60s

    icmp.first            20s

    icmp.error            10s

    other.first           60s

    other.single          30s

    other.multiple        60s

    frag                  30s

    interval              10s

    adaptive.start       6000 states

    adaptive.end          12000 states

    src.track             0s

    ```


    These options can be used to tweak your setup for performance. However, changing
    the protocol-specific settings from the default values creates a significant risk
    that valid idle connections might be dropped prematurely or blocked outright.


    # Limits


    The limit option sets the size of the memory pools PF uses for state tables and
    address tables. These are hard limits, so you may need to increase or tune the
    values for various reasons. If your network is a busy one with larger numbers
    than the default values allow for, or if your setup requires address tables or
    a large number of tables, this section will be very relevant to you.


    Keep in mind that the total amount of memory available through memory is taken
    from the kernel memory space, and the total available is a function of total available
    kernel memory. Kernel memory is to extent dynamic, but the amount of memory allocated
    to the kernel can never equal or exceed all physical memory in the system. (If
    that happened, there would be no space for user-mode programs to run.)'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'The amount of available pool memory depends on which hardware platform you
    use as well as on a number of hard-to-predict variables specific to the local
    system. In the i386 architecture, the maximum kernel memory is in the 768MB to
    IGB range, depending on a number of factors, including the number and kind of
    hardware devices in the system. The amount actually available for allocation to
    memory pools comes out of this total, again depending on a number of system-specific
    variables.


    To inspect the current settings, use pfctl -sm. Typical output looks like:


    ```

    $ sudo pfctl -sm

    states       hard limit 10000

    src-nodes    hard limit 10000

    frags        hard limit 5000

    tables       hard limit 1000

    table-entries hard limit 200000

    ```


    To change these values, edit pf.conf to include one or more lines with new values.
    For example, you could use the following lines to raise the hard limit for the
    number of states to 25,000 and for the number of table entries to 300,000:


    ```

    set limit states 25000

    set limit table-entries 30000

    ```


    You can also set several limit parameters at the same time in a line by enclosing
    them in brackets:


    ```

    set limit { 25000, src-nodes 25000, table-entries 30000 }

    ```


    In the end, other than possibly increasing these three parameters for larger installations,
    you almost shouldn''t change the limits at all. If you do, however, it''s important
    to watch your system logs for any indication that your changed limits have undesirable
    side effects or don''t fit in available memory. Setting the debug level to a higher
    value is potentially quite useful for watching the effects of tuning limit parameters.


    # Debug


    The debug option determines what, if any, error PF will generate at the kernel.debug
    log level. The default value is err, which means that only serious errors will
    be logged. OpenBSD 4.7, the log levels correspond to the ordinary syslog levels,
    which range from emerg (panics are logged), alert (correctable but very serious
    errors are logged), crit (critical conditions are logged), err (errors are logged),
    warning (warnings are logged), notice (unusual conditions are logged), info (informational
    messages are logged), and debug (full debugging information, likely useful for
    developers, is logged).'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'In pre-OpenBSD 4 versions, PF used its own log-level system, with a default
    of urgent (equivalent to err in the new system). The other possible settings were
    none (no messages), mis (reporting parser more than urgent), and loud (producing
    status messages for operations). The pfctl parser itself accepts the older-style
    debug levels for compatibility.


    One of my gateways ran at the debug level for a while, this is what a typical
    chunk of the /var/log/messages file looked like:


    ```

    $ tail -f /var/log/messages

    4 10 41:41:05 skabet/bsd: pf: _map_addr: selected address 194.54.107.19

    4 10 41:41:05 skabet/bsd: pf: loose state match: TCP 194.54.107.19

    194.54.107.19:25 158.36.191.135:62548 [li=3178647045 high=3178664221 win=33304

    modulator-wo scale=1:9 R [li=3111401744 high=3114683089 win=1736 modulator=

    scale=0:9 10 R seq=3178647045 (3178647045) ack=3111401744 len=0 acks=0

    pkts=0:12

    4 10 41:42:04 skabet/bsd: pf: loose state match: TCP 194.54.107.19

    194.54.107.19:25 158.36.191.135:62548 [li=3178647045 high=3178664221 win=33304

    modulator-wo scale=1:1li=3111401744 high=3114683089 win=1736 modulator=

    scale=0:10 10 R seq=3178647045 (3178647045) ack=3111401744 len=0 acks=0

    pkts=0:12

    ```


    At the debug level, PF repeatedly reports the IP address for the interface it''s
    currently handling. In the selected address, PF warns twice for the same packet
    when the sequence number is at the very edge of the expected range. This level
    of detail seems a bit overwhelming at first glance, but in some circumstances,
    this kind of output is the best way to diagnose a problem and later check to see
    if your solution helped.


    > This can be set from the command line with pfctl -x, followed by the debug level
    you want. The command pfctl -x debug gives you maximum debugging information;
    pfctl -x turns off debug messages entirely.


    Keep in mind that debug settings can produce large amounts of log data, and in
    extreme cases, could impact performance to the point of self-denial-of-service.


    # Rule Set Optimization


    The ruleset-option enables or setting the mode for the ruleset optimizer. The
    default setting for ruleset-optimization in OpenBSD 4.1 and equivalents are none,
    which means that ruleset optimization is not performed at load. From OpenBSD 4.2
    onward, the default is basic, which means that when the ruleset performs the following
    actions:


    +   - Removes duplicate rules

    - Removes rules that are subsets of other rules'
  merge: -1
  pgno: 214
- img_proc: true
  md: '+   - Merges rules into tables if appropriate (typical rule-to-table optimization)
    are rules that pass, redirect, or block based on identical criteria, except source
    and/or target addresses

    - Changes the order of rules to improve performance


    For example, say you have the marco tcp_services = { ssh, www, https } combined
    with the rule pass tcp from any to port $tcp_services. Elsewhere in your rule
    set, you have a different rule that says proto tcp from any to port ssh. The second
    rule is clearly a subset of the first, and they can be merged into one. Another
    combination is having a rule like pass proto tcp from any int_if:network port
    $tcp_services with otherwise identical ip rules, where the target addresses are
    all the int_if:network range.


    With ruleset-optimization set to profile, the optimizer analyzes the loaded rule
    set relative to network traffic to determine the order of quick rules.

    You can also set the value of the optimization option from the command line with
    pfctl:


    ```

    $ sudo pfctl -o basic

    ```


    This example enables the rule set optimization in basic mode.

    Because the optimization may remove or reorder rules, the meaning of some statistics—mainly
    the number of evaluations per rule—may change in ways that are hard to predict.
    In most cases, however, the effect is negligible.


    # Optimization


    The optimization option specifies profiles for state-timeout handling. The possible
    values are normal, high-latency, satellite, aggressive, and conservative. The
    recommendation is to keep the default normal unless you have very specific needs.

    The values high-latency and satellite are synonyms; with these values, states
    expire more slowly in order to compensate for potential latency.

    The aggressive setting expires states early in order to save memory. This could,
    in principle, increase the risk of dropping idle-but-valid connections if your
    system is already close to its load and traffic limits, but anecdotal evidence
    indicates that the aggressive optimization setting rarely, if ever, interferes
    with valid traffic.

    The conservative setting goes to great lengths to preserve states and idle connections,
    at the cost of some additional memory use.


    # Fragment Reassembly


    The fragment reassembly options tied to scrub were significantly reworked in OpenBSD
    4.6, which introduced the new reassemble option to turn reassembly of fragmented
    packets on or off. If reassemble is set to off, fragmented packets are simply
    dropped unless they match a rule with the'
  merge: -1
