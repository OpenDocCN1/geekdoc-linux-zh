  md: '# If You Came from Elsewhere


    If you''re reading this because you''re considering moving your setup to PF from
    some other system, this section is for you.


    If you want to use PF, you need to install and run a BSD system, such as OpenBSD,
    FreeBSD, NetBSD, or DragonBSD. These are all operating systems, but my personal
    favorite is OpenBSD, mainly because that''s the operating system where all PF
    development happens. I also find the no-nonsense approach of the developers and
    the system refreshing.


    Occasionally, minor changes and bug fixes track back to the main PF code base
    from the PF implementations on other systems, but the newest, most up-to-date
    PF code is always to be found on OpenBSD. Some of the features described in this
    book are available only in the most recent versions of OpenBSD. The other BSDs
    have tended to port the latest PF version from their code bases in time for their
    next release, but synchronized updates are far from guaranteed, and the lag is
    sometimes.


    If you''re planning to run PF on FreeBSD, NetBSD, DragonBSD, or another system,
    you should check your system''s release notes and other documentation about which
    version of PF is included.


    # Pointers for Linux Users


    The differences and similarities between Linux and BSD are potentially a large
    topic if you probe deeply, but if you have a reasonable command of the basics,
    it shouldn''t take too long for you to feel at home with the BSD way of doing
    things. In the rest of this book, I will assume you can find your way around the
    basics of BSD network configuration. So, if you''re more familiar with Linux or
    other systems than you are with BSD, it''s worth noting a few points about BSD
    configuration:


    +   Linux and BSD use different conventions for naming network interfaces. The
    Linux convention is to label all the network interfaces on a machine in the sequence
    eth0, eth1, and so on (although with some versions and driver combinations, you
    also see wlan0, wlan1, and so on for wireless interfaces).


    +   On the BSDs, interfaces are assigned names that equal the driver name plus
    a sequence number. For example, older 3Com cards using the ep appear as ep0, ep1,
    and so on; Intel Gigabit cards are likely to end up as em0, em1, and so on. Some
    SMC cards are named as sns0, snn1, and so on. This system is logical and makes
    it easier to find the documentation for the specifics of that interface. If your
    kernel reports (at boot time or in ifconfig output) that you have an interface
    called em0, you need only type man em at a command-line prompt to find out what
    it supports—whether there are any eccentricities to be aware of, whether any firmware
    download is needed, and so on.'
