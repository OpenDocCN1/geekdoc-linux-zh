  md: '# Setting Up an Adaptive Firewall


    To thwart brute-force attacks, you can write your pass rules so they maintain
    certain limits on connecting hosts can do. For good measure, you can banish violators
    to a table of addresses to which you deny or all access. You can even choose to
    drop all existing connections from machines that overreach your limits. To enable
    this feature, first set up the table by adding the following line to your configuration
    before any filtering:


    ```

    table <bruteforce> persist

    ```


    Then, early in your rule set, block brute forcers, as shown here:


    ```

    block quick from <bruteforce>

    ```


    Finally, add your pass rule:


    ```

    pass proto tcp to $localnet port $tcp_services \

    keep state (max-src-conn 100, max-src-conn-rate 15/5, \

    overload <bruteforce> flush global

    ```


    This is very similar to what you''ve seen in earlier examples. The interesting
    part in this context is the contents of the parentheses, called-state-tracking
    options:


    +   * max-src-conn is the number of simultaneous connections allowed from one
    host. In this example, it''s set to 100. You may want a slightly higher or lower
    value, depending on your network''s traffic patterns.

    * max-src-conn-rate is the rate of new connections allowed from any single host.
    Here, it''s set to 15 connections per 5 seconds, denoted as 15/5. Choose a rate
    that suits your setup.

    * overload <bruteforce> means the address of any host that exceeds the preceding
    limits is added to the table bruteforce. Our rule blocks all traffic from addresses
    in the bruteforce table. Once a host exceeds any of these limits and is put in
    the overload table, the rule no longer matches traffic from that host. Make sure
    overload are handled, if only by a default block rule or similar.

    * flush global says when a host reaches the limit, all states for its connections
    are terminated (flushed). The global option means that for good measure, flush
    applies to all states created by traffic from that host, no matter which rule
    created a state.


    As you imagine, the effect of this tiny addition to the rule set is dramatic.
    After a few tries, brute forcers end up in the bruteforce table. That means that
    all their existing connections are terminated (flushed) and any new attempts will
    be blocked, most likely with Fatal: timeout before authentication messages at
    their end. You have created an adaptive firewall that adjusts automatically to
    conditions in your network and underirable activity.'
