    # ### Managing Lists with spamdb


    There may be times you need to view or check the contents of blacklists, whitelists,
    and greylists. These records are located in the `/var/lib/spamdb`, and an administrator''s
    main interface to managing these lists is spamdb.


    Early versions of spamdb simply offered options to add whitelist entries to the
    database or update existing ones (`spamdb -d nn.mm.nn.mm`). You could delete whitelists
    for shortcomings in either the lists used or the effects of the greylisting algorithms.
    Recent versions of spamdb offer more interesting features to support greylisting.


    # ### Updating Lists


    If you run spamdb without any parameters, it lists the contents of your spamdb
    database, and lets you add or delete spamdb addresses and trast entries. You can
    also add whitelist entries on the fly.


    If you want to add a host to your whitelist without adding it to your permanent
    nospam file and reloading your rule set, or could you do it from the command line,
    like this:


    ```

    $ spamdb -a 213.187.179.198

    ```'
