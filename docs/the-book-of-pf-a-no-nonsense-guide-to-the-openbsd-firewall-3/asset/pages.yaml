  md: '# The HFSC Algorithm


    Underlying any queue system you define using the queue system in OpenBSD 5.5 and
    later is the Hierarchical Fair Service Curve (HFSC) algorithm. HFSC was designed
    to allocate resources fairly among queues in a hierarchy. One of its interesting
    features is that it imposes no limits until some part of the traffic reaches a
    volume that''s close to its preset limits. The algorithm starts shaping before
    the traffic reaches a point where it deprives some other queue of its guaranteed
    share.


