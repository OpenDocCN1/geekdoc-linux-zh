- img_proc: true
  md: "preferential treatment because of the higher-priority value assigned to it.\
    \ This scheme also helps the speed of SCP file transfers because the ACK packets\
    \ for the SCP transfers will be assigned to the higher-priority subsequence.\n\
    \nFinally, we have the icmp queue, which is reserved for the remaining 2 percent\
    \ of the bandwidth from the top level. This guarantees a minimum amount of bandwidth\
    \ for ICMP traffic that we want to pass but doesn't match the criteria for being\
    \ assigned to the other queues.\n\n# Rule Set\n\nTo make it happen, we use these\
    \ pass rules, which indicate which traffic is assigned to the queues and their\
    \ criteria:\n\n```\nset skip on { lo, $int_if }\npass log quick on $ext_if proto\
    \ tcp to port ssh queue (ssh_bulk, ssh_interactive)\npass in on $ext_if proto\
    \ tcp to port ftp queue ftp\npass in on $ext_if proto tcp to port www queue http\n\
    pass out on $ext_if proto udp queue udp\npass out on $ext_if proto icmp queue\
    \ icmp\npass out on $ext_if proto tcp from $local to port $client_out\n```\n\n\
    The rules for ssh, ftp, www, udp, and icmp assign traffic to their respective\
    \ queues. The last catchall rule passes all traffic from the local-network, dumping\
    \ it into the default main queue.\n\n# A Basic HFSC Traffic Shaper\n\nThe simple\
    \ schedulers we have loaded so far can make for efficient setups, but network\
    \ admins with traffic-shaping ambitions tend to look for a little more flexibility\
    \ than can be found in the pure-priority-based queues or the simple class-based\
    \ variety. The HFSC queuing algorithm (hfsc in pf.conf/terminology) offers flexible\
    \ bandwidth allocation, guaranteed lower and upper bounds for bandwidth available\
    \ each queue, and variable allocation over time, and it only shapes when there's\
    \ an actual need. However, the added flexibility comes at a price: The setup is\
    \ a tad more complex than other ALTQ types, and tuning your setup for an optimal\
    \ result can be an interesting process.\n\n# Queue Definition\n\nFirst, working\
    \ from the same configuration we altered slightly earlier, insert this queue definition\
    \ early in the pf.conf file:\n\n```\naltq on $ext_if $ext_bw hfsc queue { main,\
    \ spamd }\nqueue main bandwidth 99% priority 7 qimit 100 hfsc (realtime 20%, linkshare\
    \ 99%) \\\n  - q_pri, q_def, q_web, q_ns hfsc\n  - q_pri bandwidth 3% priority\
    \ 7 hfsc (realtime 0, linkshare 3% red)\n  - q_def bandwidth 47% priority 1 hfsc\
    \ (default realtime 30% linkshare 47% red)\n  - q_web bandwidth 47% priority 1\
    \ hfsc (realtime 30% linkshare 47% red)\n```\n\n140 Chapter 7"
