    # Final Preparations: Defining Your Local Network


    In Chapter 2, we set up a configuration for a single, standalone machine. We''re
    about to extend that configuration to a gateway network, and it''s useful to define
    a few macros to help readability and to conceptually separate local networks where
    you have a measure of control from everything else. So do you define your "local"
    network in PF terms?


    Earlier in this chapter, you saw the interface:network notation. This is a nice
    piece of shorthand, but you can make your rule even more readable and easier to
    maintain by taking the macro a bit further. For example, you could define a $localnet
    as the network directly attached to your internal interface (rei:network in our
    examples). Or you could change the definition of $localnet to an IP address/netmask
    notation to denote a network, such as 192.168.100.0/24 for a subnet of IPv4 addresses
    or 2001:db8:beef::64 for an IPv6 range.


    If your network environment requires it, you could define $localnet as a list
    of networks. For example, a sensible $localnet definition combined with pass rules
    that use the macro, such as the following, could end up saving you a few headaches:


    ```

    pass proto { tcp, udp } from $localnet to port $sports

    ```


    We''ll stick to the convention of using macros such as $localnet for reliability
    from here on.


