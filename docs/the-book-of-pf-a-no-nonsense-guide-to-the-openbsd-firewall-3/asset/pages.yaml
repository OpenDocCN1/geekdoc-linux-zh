  md: 'PF proved to be well-developed software. In 2002, Hartmeier presented a USENIX
    paper with performance tests showing that the OpenBSD 3.1 PF performed equally
    well or better under stress than IPFilter on OpenBSD 3.1 or it on Linux. In addition,
    tests on the original PF from OpenBSD 3.0 showed mainly that the code had efficiency
    from version 3.0 to version 3.1.


    The OpenBSD PF code, with a fresh packet-filtering engine written by experienced
    security-oriented developers, naturally generated interest in the BSDs as well.
    The FreeBSD project gradually adopted PF, first as a package and then, from version
    5.3, in the base system as one of three packet-filtering systems. PF has also
    been included in NetBSD and DragonFlyBSD.


    This book focuses on the PF version available in OpenBSD 5.5. I''ll note significant
    differences between that version and the ones integrated into other systems as
    appropriate.


    If you''re ready to dive into PF configuration, you can jump to Chapter 2 to get
    started. If you want to spend a little more time getting your bearings in unfamiliar
    BSD territory, continue reading this chapter.


    # NEWER PF RELEASES PERFORM BETTER


    Like the rest of the computing world, OpenBSD and PF have been affected by rapid
    changes in hardware and network conditions. I haven''t seen comparable to the
    ones in Daniel Hartmeier''s USENIX paper performed recently, but PF users have
    found that the filtering overhead is modest.


    As an example (mainly to illustrate that even unexciting hardware configurations
    can be useful), the machine between one small office work in my career and the
    world is a Pentium III 450MHz with 384MB of RAM. When I remembered to check, I''ve
    never seen the machine at less than 96 percent idle according to the output from
    the top(1) command.


    It''s also worth noting that the current PF developers, mainly Henning Brauer
    and Ryan McBride, with contributions from several others, rework large portions
    of OpenBSD''s PF code with improved performance as stated main goal during recent
    releases, making each release from 4.4 through 5.6 perform noticeably better than
    its predecessors.


