  md: "# Class-Based Bandwidth Allocation for Small Networks\n\nMaximizing network\
    \ performance generally feels nice. However, you may find that your network has\
    \ other needs. For example, it might be important for some traffic—such as mail\
    \ and other vital services—to have a baseline amount of bandwidth available at\
    \ all times, while other services—peer-to-peer file sharing with mind—shouldn’t\
    \ be allowed to consume more than a certain amount. To address these kinds of\
    \ requirements or concerns, ALTO performs the class-based queue (cbq) discipline\
    \ with a slightly larger set of options.\n\nTo illustrate how to use cbq, we’ll\
    \ build the rule sets from previous chapters within a small local network. We\
    \ want to let the users on the local network connect to a predefined set of services\
    \ outside their own network and let users from outside the local network access\
    \ a Web server and FTP server somewhere on the local network.\n\n# Queue Definition\n\
    \nAll queues are set up on the external, Internet-facing interface. This approach\
    \ makes sense because bandwidth is more likely to be limited on the external link\
    \ than on the local network. In principle, however, allocating queues and running\
    \ traffic shaping can be done on any network interface. The example setup shown\
    \ includes a cbq queue for a total bandwidth of 2Mb with six subqueues.\n\n```\n\
    altq on $_if cbq bandwidth 2Mb queue { main, ftp, udp, web, ssh, icmp\n  queue\
    \ main bandwidth 18% cbq(default borrow red)\n  queue ftp bandwidth 10% cbq(borrow\
    \ red)\n  queue udp bandwidth 30% cbq(borrow red)\n  queue web bandwidth 20% cbq(borrow\
    \ red)\n  queue ssh bandwidth 20% cbq(borrow red) { ssh_interactive, ssh_bulk\n\
    \  queue ssh_interactive priority 7 bandwidth 20%\n  queue ssh_bulk priority 5\
    \ bandwidth 80%\n  queue icmp bandwidth 2% cbq\n```\n\nThe subqueue has 18 percent\
    \ of the bandwidth and is designated as the default queue. This means any traffic\
    \ that matches a rule but is not explicitly assigned to some other queue ends\
    \ up here. The borrow and red keywords mean that the queue may borrow from its\
    \ parent queue, while the system attempts to avoid congestion by applying the\
    \ RED algorithm.\n\nThe other queues follow more or less the same pattern up to\
    \ the subqueue ssh, which itself has two subqueues with separate priorities. We\
    \ see a variation in the ACK priority example. Bulk SSH transfers, typically SCP\
    \ files, are transmitted with a TOS indicating throughput, while interactive SSH\
    \ traffic has the TOS flag set to low delay and skips ahead of the bulk transfers.\
    \ The interactive traffic is likely to be less bandwidth consuming and gets a\
    \ smaller share of the bandwidth, but it receives"
