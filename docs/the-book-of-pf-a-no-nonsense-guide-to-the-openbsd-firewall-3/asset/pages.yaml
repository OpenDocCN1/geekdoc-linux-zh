  md: '# NOTE


    These adaptive rules are effective only for protection against the traditional,
    rapid-fire type of brute-force attempts. The low-intensity, distributed password-guessing
    attempts that were first identified in 2008 and have been recurring ever (known
    among other names as The Hail Mary Cloud²) do not produce traffic that will might


    It''s likely that you will want larger number of connections for some services,
    but you also might allow a to be a bit more tighter-fisted when it comes to SSH.
    In that case, you could supplement the general-purpose pass rule with something
    like the following one in your rule set:


    ```

    pass quick proto ( tcp, udp ) to port ssh \

    keep keep state (max-src-conn 15, max-src-conn-rate 5/3, \

    overload *bruteforces flush global)

    ```


    You should be able to find the set of parameters that''s right for your situation
    by reading the relevant pages and the PF User Guide (see Appendix A).


    # NOTE


    Remember these sample rules are intended as illustrations and your network''s
    needs may be better served by different rules. Setting the number of simultaneous
    connections or the rate of connections too low block legitimate traffic. There''s
    a potential risk of self-inflicted denial of service when the configuration includes
    hosts behind a common NATing gateway and the users on the NATed hosts have legitimate
    business on the other side of a gateway with strict overload rules.


    The state-tracking options and the overload mechanism don''t need to apply exclusively
    to the SSH service, and blocking all traffic from offenders isn''t always desired.
    You could for, use a rule like this:


    ```

    pass proto ( tcp, udp ) to port $mail_server \

    keep state (max 1500, max-src-conn 100)

    ```


    Here, max specifies the maximum number of states that can be created for each
    rule with no overload to protect a mail or Web service from receiving more connections
    than it can handle (keep in mind that the number of rules depends on what $mail_server
    macro expands to). The max limit is reached, new connections will not match this
    rule until the old ones terminate. Alternatively, you could remove the max restriction,
    add an overload part to the rule, and assign offenders to a queue with a minimal
    bandwidth allocation (see the discussion of traffic shaping in Chapter 7 for details
    on setting queues).


    For an overview of the Hail Mary Cloud sequence of brute-force attempts, the article
    "The Hail Mary Cloud and the Lessons Learned" at http://bsd.blogspot.com/2013/10/the-hail-cloud-and-lessons-learned.html.
    More resources are referenced there and in Appendix A.


    98 Chapter 6'
