    # ## Handling Nonroutable IPv4 Addresses from Elsewhere


    Even with a properly configured gateway to handle filtering and potentially NAT
    for your own network, you may find yourself in the unenviable position of needing
    to compensate for other people''s misconfigurations.


    # ## Establishing Global Rules


    One depressingly common class of misconfigurations is the kind that lets traffic
    with nonroutable addresses out to the Internet. Traffic from nonroutable IPv4
    addresses plays a part in several denial-of-service (DoS) attack techniques, so
    it''s worth considering blocking traffic from nonroutable addresses entering your
    network. One possible solution is outlined here. For good measure, it also blocks
    any initiate connect to nonroutable addresses through the gateway''s external
    interface.


    ```

    martians = "{ 127.0.0.0/8, 192.168.0.0/16, 172.16.0.0/16, \

    10.0.0.0/8, 169.254.0.0/16, 192.0.2.0/24, \

    240.0.0.0/4 }"

    ```


    ```

    block in $ext_if from $martians to

    block out quick on $ext_if from $martians

    ```


    Here, the martians denotes the RFC 1918 addresses and a few others mandated by
    various RFCs not to be in circulation in the open Internet. Traffic to and from
    such addresses is quietly dropped by the gateway''s external interface.


    The martians macro could easily be implemented as a table, with all of the table
    advantages as an added bonus for your rule set. In fact, if you view the loaded
    rule set that contains this combination of macro and rules, you''ll see macro
    expansion and rule-set optimization most likely replaced your list with one per
    rule. However, if you roll your own table, you''ll get to pick a nicer name for
    it.


    The specific details of how to implement this kind of protection will vary according
    to your network configuration and may be part of a wider set of network security
    measures. Your network design might also dictate that you include or exclude address
    ranges other than these.


    # ## Restructuring Your Rule Set with Anchors


    We''ve mentioned anchors a few times, in the context of applications as FTP-proxy
    or relay that use anchors to interact with a running PF configuration. Anchors
    are named sub-rule sets where it is possible to insert or remove rules as needed
    without reloading the whole rule set.'
