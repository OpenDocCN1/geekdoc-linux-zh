  md: 'The ALTQ option is needed to enable ALTQ in the kernel, but on SMP systems,
    you also need the ALTQ_NOPCC option. Depending on which types of queues you''ll
    be using, you''ll need to enable at least one of these: ALTQ_CBQ, ALTQ_PRIQ, or
    ALTQ_HFSC. Finally, you can enable the congestion-avoidance techniques random
    early detection (RED) and RED In/Out with the ALTQ_RED and ALTQ_RIO options, respectively.
    (See the FreeBSD Handbook for information on how to compile and install a custom
    kernel with these options.)


    # ALTQ on NetBSD


    ALTQ was integrated into the NetBSD 4.0 PF implementation and is supported in
    NetBSD 4.0 and later releases. NetBSD''s default GENERIC kernel configuration
    doesn''t include the ALTQ-related options, but the GENERIC configuration file
    comes with all relevant comments commented out for inclusion. The main kernel
    options are:


    | options | ALTQ |

    | --- | --- |

    | options | # Manipulate network interfaces'' output queues |

    | options | ALTQ_CBQ # Class-Based queuing |

    | options | ALTQ_HFSC # Hierarchical Fair Service Curve |

    | options | ALTQ_PRIQ # Priority queuing |

    | options | ALTQ_RED # Random Early Detection |


    The ALTQ option is needed to enable ALTQ in the kernel. Depending on the types
    of queues you''ll be using, you must enable at least one of these: ALTQ_CBQ, ALTQ_PRIQ,
    or ALTQ_HFSC.


    Using ALTQ requires to compile PF into the kernel because the PF loadable module
    doesn''t support ALTQ functionality. (See the NetBSD PF documentation at http://www.netBSD.org/Documentation/network/pf.html
    for the most-up-to-date information.)


    # Priority-Based Queues


    The basic concept behind priority-based queues (priq) is fairly straightforward.
    Within the total bandwidth allocated to the maine queue, only priority matters.
    You assign queues a priority value in the range 0 through 15, where a higher value
    means the queue''s requests for traffic are serviced sooner.


    # Using ALTQ Priority Queues to Improve Performance


    Daniel Meier discovered a simple yet effective way to improve the throughput for
    his home network using ALTQ priority queues. Like many people, he had his home
    network on an asymmetric connection, with total usable bandwidth low enough that
    he wanted better bandwidth utilization. In addition, when the line was running
    at or near capacity, odd started appearing. One symptom in particular seemed to
    suggest room improvement: Incoming traffic (downloads, incoming mail, and such)'
  merge: -1
