    # Collecting NetFlow Data with pflow


    For systems that don''t support NetFlow data export via pflow, NetFlow support
    is available via the pflow package. As we already saw in the previous section,
    PF state table maps very well to the NetFlow data model, and pflow is intended
    to record state changes from the local system''s pfsync device. Once enabled,
    pflow acts as a NetFlow sensor that converts pfsync data to NetFlow format for
    transmission to a NetFlow collector on the network.


    The pflow tool was written and is maintained by Damien Miller and is available
    from http://www.minddot.org/projects/peflow/ as well as through the packages on
    on FreeBSD and FreeBSD as pflow. The lack of pfsync support means pflow isn''t
    available on that platform as form of this writing.


    # SNMP Tools and PF-Related SNMP MIBs


    Simple Network Management Protocol (SNMP) was designed to let administrators collect
    and monitor key data about how their systems run and change configurations on
    multiple nodes from a centralized system. The SNMP protocol comes with a well-defined
    interface and a method for extending the management information base (MIB), which
    provides the managed devices and objects.'
