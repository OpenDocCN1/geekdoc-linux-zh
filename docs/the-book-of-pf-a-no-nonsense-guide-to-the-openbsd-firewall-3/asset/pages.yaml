    However, if you''re already

    running an email service on your network, you can go on using your old

    SMTP pass rules.


    Given a set of reliable and well-maintained blacklists, spamd in pure black-\listing
    mode does a good job of reducing spam. However, with pure blacklist-

    ing, catching traffic only from hosts that have already tried to deliver spam

    elwhere, and put your trust in external data sources to determine

    which hosts deserves to be tarpitted. For a setup that provides a more imme-

    diate response to network-level behavior and offers some real gains in spam

    prevention, consider greylisting, which is a crucial part of how the modern

    spamd works.'
