- img_proc: true
  md: 'If you read through the previous section on setting up PF on OpenBSD, you saw
    that on OpenBSD, PF is enabled by default. That''s not the case for FreeBSD, where
    PF is one of three possible packet-filtering options. Here, you need to make explicit
    statements to PF, and compared to OpenBSD, it seems you need a little more magic
    in your /etc/rc.conf. A look at your /etc/defaults/rc.conf file shows the FreeBSD
    default values for PF-related settings are as follows:


    ```

    pf_enable="NO"

    pf_rules="/etc/pf.conf"

    pf_program="/sbin/pfctl"

    pf_flags=""

    plog_enable="NO"

    plog_logfile="/var/log/pflog"

    plog_program="/sbin/pflogd"

    plog_flags=""

    pfsync_enable="NO"

    pfsync_syncdev=""

    pfsync_config="" # Set to YES to enable packet filter (PF)

    # rules definition file for PF

    # where pfctl lives

    # additional flags for pfctl

    # set to YES to enable packet filter logging

    # where pflogd store the logfile

    # where pflogd lives

    # additional flags for pflogd

    # expose pf state to other hosts for syncing

    # interface for pfsync to work through

    # additional options to config(8) for pfsync

    ```


    Fortunately, you can safely ignore most of these—at least for now. The only options
    that you need to modify are your /etc/rc.conf configuration:


    ```

    pf_enable="YES"

    plog_enable="YES" # Enable PF (load module if required)

    # start pflog(8)

    ```


    There are some differences between FreeBSD releases with respect to PF. Refer
    to the FreeBSD Handbook available from http://www.freebsd.org/specifically the
    PF section of the "Firewalls" chapter—to see which information applies in your
    case. The PF code in FreeBSD 9 and 10 is equivalent to the code in OpenBSD 4.5
    with some bugs. The instructions in this book assume that you are running FreeBSD
    9.0 or newer.


    On FreeBSD, PF is compiled as a kernel-loadable module by default. If your FreeBSD
    setup runs with a GENERIC kernel, you should be able to start PF with the following:


    ```

    $ sudo kldload pf

    $ sudo pfctl -e

    ```


    Assuming you have put the lines just mentioned in your /etc/rc.conf and created
    an /etc/pf.conf file, you could also use the PF rc script to run PF. The following:


    ```

    $ sudo /etc/rc.d/pf start

    ```


    And this disables the packet filter:


    ```

    $ sudo /etc/rc.d/pf stop

    ```'
