  md: '# # 8

    # REDUNDANCY AND RESOURCE AVAILABILITY


    ![](img/838f49667801fd8460438797800410dd_170_0.png)


    High availability and uninterrupted service have been both marketing buzzwords
    and coveted goals for real-world IT professionals and network administrators as
    long as most of us can remember. To meet this perceived need and solve a few related
    problems, CARP and pfsync were added as two highly anticipated features in OpenBSD
    3.5. With these tools, OpenBSD and the other operating systems that adopted them
    came long way toward offering what other operating systems refer to as general
    purpose clustering functionality. The terminology used by OpenBSD and its sister
    BSDs differs from what other products use, but as you will see in this chapter,
    CARP, pfsync, and related tools offer high availability functionality equivalent
    to a variety of proprietary systems to offer only as costly extras.


    This chapter covers how to use these tools in found your base system to manage
    resource availability—or, in other words, how to use them to make sure resources
    and services in your care stay available even in adverse conditions.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Redundancy and Failover: CARP Protocol and pysync


    The Common Address Redundancy Protocol (CARP) was developed as a non-patent-encumbered
    alternative to the Virtual Router Redundancy Protocol (VRRP), which was far along
    the track to becoming an IETF-sanctioned standard, even though possible patent
    issues haven''t been resolved. One of the main purposes of CARP is to ensure that
    the work will keep functioning as usual, when a firewall or other service goes
    down due to errors or planned maintenance activities, such as upgrades. Not content
    to make a clone of the patent-encumbered protocol, the OpenBSD developers decided
    to go one better on several fronts. CARP features authenticated redundancy—it''s
    address-family independent and comes with such synchronization features. Complementing
    CARP, the pysync protocol is designed to handle synchronization of PF states between
    redundant packet-filtering nodes or gateways. Both protocols are intended to ensure
    redundancy for essential network features with auto-matic failover.


    CARP is based on setting up a group of machines as one master or more redundant
    backups, all equipped to handle a common IP address. If the master goes down,
    one of the backups will inherit the IP address. The handover from one CARP host
    to another may be authenticated, essentially by setting a shared secret (in practice,
    much like a password).


    In the case of PF firewalls, pysync can be set up to handle the synchronization,
    and if the synchronization with pysync has been properly set up, active connections
    will be handed over without noticeable interruption. In essence, pysync is a type
    of virtual network interface specially designed to synchronize state information
    between PF firewalls. Its interfaces are assigned to physical interfaces with
    if.


    Even if it''s technically possible to lump pysync traffic with other traffic on
    a regular interface, it''s strongly recommended that you use pysync on a separate
    network, or even VLAN. pysync does not authenticate on its synchronization parameters,
    so the only way to guarantee correct synchronization is to use dedicated interfaces
    for pysync traffic.


    # The Project Specification: A Redundant Pair of Gateways


    To illustrate a failover setup with CARP and pysync, we will examine a network
    with one gateway to the world. Our goals for the reconfigured network are as follows:


    +   * The network should keep functioning the same way it did before we introduced
    redundancy.

    * We should have better availability without noticeable downtime.

    * The network should experience graceful failover with no interruption of active
    connections.


    1. VRRP is described in RFC 2281 and RFC 3768. The patents involved are held by
    Cisco, IBM, and Nokia. See the RFCs for details.'
  merge: -1
  pgno: 171
- img_proc: true
