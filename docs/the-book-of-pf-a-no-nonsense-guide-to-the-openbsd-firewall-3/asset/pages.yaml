- img_proc: true
  md: 'Finally, enter the bridge setup in /etc/hostname.bridge0:


    add ep0 add ep1 blocknonip ep0 blocknonip ep1 up


    Your bridge should now be up, and you can go on to create the PF rules.


    # Basic Bridge Setup on FreeBSD


    For FreeBSD, the procedure is a little more involved than on OpenBSD. In order
    to be able to use bridging, your running kernel must include the if_bridge module.
    The default kernel configurations build this module, under ordinary circumstances,
    you can go directly to creating the interface. To compile the bridge device into
    the kernel, add the following line in the kernel configuration file:


    ```

    device if_bridge

    ```


    You can load the device at boot time by putting the following line in the /etc/loader.conf
    file.


    ```

    if_bridge_load="YES"

    ```


    Create the bridge by entering this:


    ```

    $ sudo ifconfig bridge0 create

    ```


    Creating the bridge0 interface also creates a set of bridge-related sysctl values:


    ```

    $ sudo sysctl net.link.bridge

    net.link.bridge.ipfw: 0

    net.link.bridge.pfil_member: 1

    net.link.bridge.pfil_bridge: 1

    net.link.bridge.ipfw_arp: 0

    net.link.bridge.pfil_onlyip: 1

    ```


    It''s worth checking that these sysctl values are available. If they are, it''s
    confirmation that the bridge has been enabled. If they''re not, go back and see
    what went wrong and why.


    > NOTE These values apply to filtering on the bridge interface itself. You don''t
    need to touch them because IP-level filtering on the member interfaces (the ends
    of the pipe) is enabled by default.


    Before the next ifconfig command, check that the prospective member interfaces
    (in our case, ep0 and ep1) are up but haven''t assigned IP addresses. Then configure
    the bridge by entering this:


    ```

    $ sudo ifconfig bridge0 add ep0 add ep1 up

    ```'
