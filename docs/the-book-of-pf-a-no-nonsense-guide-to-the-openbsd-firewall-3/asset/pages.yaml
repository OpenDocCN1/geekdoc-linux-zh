  md: '# Shaping by Setting Traffic Priorities


    If you''re mainly interested in pushing certain kinds of traffic ahead of others,
    you may be able to achieve what you want by simply setting priorities: assigning
    a higher priority to some items so that they receive attention before others.


    # The pri Priority Scheme


    Starting with OpenBSD 5.0, a priority scheme for classifying network traffic on
    a per-rule basis is available. The range of priorities is from 0 to 7, where 0
    is lowest priority. Items assigned priority 7 will skip ahead of everything else,
    and the default value 3 is automatically assigned for most kinds of traffic. The
    priority scheme, which you''ll most often refer to as pri after the PF syntax
    keyword, is always enabled, and you can tweak your traffic by setting priorities
    via your match or pass rules.


    For example, to speed up your outgoing SSH traffic to the max, you could put a
    rule like this in your configuration:


    ```

    pass proto tcp to port ssh set prio 7

    ```


    > Your SSH traffic would be served before anything else.

    You could examine the result of your rule set and decide what traffic is more
    or less important, what you would like to reach as destination, and what parts
    of your traffic you feel less.

    To push your traffic ahead of everything and bump the priority for network time
    and name services, you could amend your configuration with rules like this:


    ```

    pass proto tcp to port { www https } set prio 7

    pass proto udp tcp to port { domain ntp } set prio 6

    ```


    > If you have a rule set that already includes rules that match criteria other
    than just the port, you could achieve the same effect by using your traffic shaping
    as matching rules instead:


    ```

    match proto tcp to port { www https } set prio 7

    match proto udp tcp to port { domain ntp } set prio 6

    ```


    ```

    voip_ports={ 2027 4569 5036 5060 10000:20000 }

    match proto udp to port $voip_ports set prio 7

    ```


    But do your VoIP application''s documentation for information on what specific
    ports it uses. In any case, using rules like these can have a positive effect
    on your configuration in other ways, too: you can use match rules like the ones
    in the examples here to separate filtering'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'decisions—such passing, blocking, redirecting—from traffic-shaping decisions,
    and with that separation in place, you''re likely to end up with a more readable
    and maintainable configuration.


    It''s worth noting that parts of the OpenBSD network stack set default priorities
    for certain types of traffic that the developers decided were essential to a functional
    network. If you don''t set any priorities, anything with proto carp and a few
    other management protocols and packet types will go by priority 6, and all types
    of traffic that do not receive a specific classification with a set priority rule
    will have a default priority of 3.


    # The Two-Priority Speedup Trick


    In the examples just shown, we set different priorities for different types of
    traffic and managed to get specific types of traffic, such as VoIP and SSH, to
    move faster than others. But thanks to the design of TCP, which carries the bulk
    of your traffic, even a simple priority-shaping scheme has to offer with only
    minor tweaks to the rule set.


    As readers of RFCs and a few practitioners have discovered, the connection-oriented
    design of TCP means that for each packet sent, the sender will expect to receive
    an acknowledgment (ACK) packet back within a preset time or matching a defined
    "window" of sequence numbers. If the sender doesn''t receive the acknowledgment
    within the expected limit, it assumes the packet was lost in transit and arranges
    to resend the data.


    One other factor to consider is that by default, packets are handled in the order
    they arrive. This is known as first, first out (FIFO), and it means the essentially
    dateless ACK packets will be waiting their turn between the larger data packets.
    On a busy or congested link, which is waiting for ACKs and forming retransmissions
    can measurably into effective bandwidth and slow down all transfers. In fact,
    concurrent transfers in both directions can slow each other significantly more
    than the value of their expected data sizes.


    Fortunately, a simple and quite popular solution to this problem is at hand: you
    use priorities to make sure smaller packets skip ahead. If you assign two priorities
    in a match or pass rule, like this:


    ```

    match out egress set pri (5, 6)

    ```


    The first priority will be assigned to the regular traffic, while ACK packets
    and others with a low type of service (ToS) will be assigned the second priority
    and will be served over the regular packets.


    When a packet arrives, PF detects the ACK packets and puts them on the higher-priority
    queue. PF also inspects the ToS field on arriving packets. Packets that have the
    ToS set to low delay to indicate that the sender wants


    +   1. Daniel Hartmeier, one of the original PF developers, wrote a nice article
    about this problem, which is available at http://www.benzrine.cx/ackpri.html.
    Daniel''s explanations of the older ALTQ priority queues synes include data that
    clearly illustrates the effect of different priorities to help ACKs along.


    Chapter 7'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'speedier delivery also get the high-priority treatment. When more than one
    priority is indicated, in the preceding rule, PF assigns the order accordingly.
    Packets with other ToS values are processed out they arrive, but with ACKs arriving
    faster, the sender spends less time waiting for ACKs and resending lost data.
    The result is that available bandwidth is used more efficiently. (The match rule
    quoted here is the first one in order to get a feel for the new perio feature—on
    a test system, of course—soon after it was committed during the OpenBSD5.0 development
    cycle. If you put that match rule on top of an existing rule, you will probably
    see that the link can take more traffic and simultaneous connections before noticeable
    symptoms of congestion turn up.)


    See whether you can come up with a way to measure throughout and after you introduce
    the two-priorities trick to your traffic shaping, and note the difference before
    you proceed to the more complex traffic-shaping options.


    # Introducing Queues for Bandwidth Allocation


    We''ve seen that traffic shaping using only priorities can be quite effective,
    but there will be times when a priorities-only scheme falls short of your goals.
    One such scenario occurs when you''re faced with requirements that would be most
    effectively solved by assigning a higher priority, and perhaps a larger share
    of traffic, such as email and other high-value services, and correspondingly less
    bandwidth to others. Another scenario would be when you want to apportion your
    bandwidth in different-sized queues to specific services and perhaps hard upper
    limits for some types of traffic, while at the same time to ensure that all traffic
    that you care about gets at least its fair share of available bandwidth. In cases
    like these, use the pure-priority scheme behind, at least as the primary tool,
    and start doing traffic shaping using queues.


    Unlike the priority levels, which are always available and can be used without
    further preparations, in name queues represent parts of your available bandwidth
    and can be used only after you''ve defined them in terms of available capacity.
    Queues are a kind of buffer for network packets. Queues are defined with a specific
    amount of bandwidth, or as a specific portion of available bandwidth, and you
    can allocate portions of each queue''s share to subclasses, or within queues,
    which share the parent queue''s resources. The packets are held in a queue until
    they are either dropped or sent according to the queue''s criteria and subject
    to the queue''s available bandwidth. Queues attached to specific interfaces, and
    bandwidth is managed on a per-interface basis, with available bandwidth on a given
    interface subdivided into the queues you define.


    The basic syntax for defining a queue follows this:


    ```

    queue name on interface bandwidth number [ K,M,M]

    queue name1 parent name bandwidth number[K,M,M] default

    queue name2 parent name bandwidth number[K,M,M]

    queue name3 parent name bandwidth number[K,M,M]

    ```'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'The letters following the bandwidth number denote the unit of measurement:
    $\kappa$ denotes kilobits; $M$ denotes megabits; and $\G$ denotes gigabits. When
    you write only the bandwidth number, it''s interpreted as the number of bits per
    second. It''s possible to tack on other options to this basic syntax, we''ll see
    in later examples.


    NOTE Subsequence definitions name their parent queue, and one queue needs to be
    the default queue that receives any traffic not specifically assigned to other
    queues.


    Once queue definitions are in place, you integrate traffic shaping into your rule
    set by rewriting your pass or match rules to assign traffic to a specific queue.


    # WHAT''S YOUR USABLE BANDWIDTH?


    Once we start working with defined parts of total bandwidth rather than priorities
    that share the whole, determining the exact value of total usable bandwidth becomes
    interesting. It can be difficult to determine actual usable bandwidth on a specific
    interface. If you don''t specify a total bandwidth, the total bandwidth will be
    used to calculate the allocations, but some types of interfaces cannot report
    the actual value. One common example of this discrepancy is where your gateway''s
    external interface is a 100 megabit (Mb) Ethernet interface, attached to a DSL
    line that has only 8Mb download and 1Mb upload.\* The Ethernet interface will
    then confidently report 100Mb bandwidth, not the actual value of the Internet-facing
    connection.


    For this reason, it usually makes sense to set the total bandwidth to a fixed
    value. Unfortunately, the value to use may not be exactly what your bandwidth
    supplier tells you is available because there will always be overhead over various
    technologies and implementations. In example, TCP/IP over Ethernet, overhead can
    be as low as single-digit percentages, but TCP/IP over ATM has been known to have
    overhead of almost 20 percent. Your bandwidth supplier doesn''t provide the overhead
    information, you''ll need to make an educated guess at the starting value. In
    any case, remember that the total bandwidth available is never greater than the
    bandwidth of the weakest link in your network path.


    Queues are supported only for outbound connections relative to the system doing
    the queuing. When planning your bandwidth management, consider the actual usable
    bandwidth to be equal to the weakest (lowest bandwidth) link in the connection''s
    path, even if your queues are set up on a different interface.


    > * This really dates the book, I know. In a few years, these numbers will seem
    quaint.


    122 Chapter 7'
