  md: '![](img/838f49667801fd8460438797800410dd_230_0.png)


    # A NOTE ON HARDWARE SUPPORT


    ![](img/838f49667801fd8460438797800410dd_230_1.png)


    > “How’s the hardware support?” I tend to hear that a lot, and my answer is usually,
    “In my experience, OpenBSD and other free systems tend to just work.


    But for some reason, there’s a general perception that going with free software
    means that getting hardware components to work will be a serious struggle. In
    the past, there was some factual basis for this. I remember struggling to boot
    FreeBSD 2.0.5 on the hardware I had available. I was able to boot off the installation
    CD, but the install never completed because my CD drive was not fully supported.


    But that was back in June 1995, when PC CD drives usually came with an almost-but-not-quite
    IDE interface attached to a sound card, and cheap PCs didn''t come with networking
    hardware of any kind built. Configuring a machine for network use usually meant
    moving jumpers around on the network interface card or the motherboard or running
    some weird setup software—if you had the good luck to be on a system that had
    or could be fitted with an Ethernet interface.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Times have changed. Today, you can reasonably expect all important components
    in your system to work with OpenBSD. Sure, some caution and a bit of planning
    may be required for building the optimal setup, but that''s not necessarily a
    bad thing.


    # Getting the Right Hardware


    Getting the right hardware for your system is essentially a matter of checking
    that your system meets the needs of your project and network:


    +   - Check the online hardware compatibility lists.

    - Check the man pages, use apropos keyword commands (where keyword is the type
    of device you''re looking for).

    - Search the archives of relevant mailing lists if you want more background information.

    - Use your favorite web search engine to find useful information about how a specific
    device works with your operating system.


    In most cases, the hardware will work as expected. However, sometimes otherwise
    functional hardware may come with odd restrictions.

    Quite a number of devices are designed to depend on firmware that must be loaded
    before the operating system can make use of the device. The motivation for this
    design choice is always to lower the cost of the device. When some manufacturers
    refuse to grant redistribution rights for the firmware, the decision becomes a
    problem because it means operating systems like OpenBSD cannot package the firmware
    with their releases.


    Problems of this type have surfaced in connection with several types of hardware.
    In many cases, the manufacturers have been persuaded to change their minds and
    allow distribution. However, this doesn''t happen in all cases. One example is
    the Intel-based wireless hardware that''s built into many popular laptop models.
    The hardware is supported in many operating systems, including OpenBSD via the
    wifi and iw drivers. Even with drivers in place, the hardware simply won''t work
    unless the user has manually fetched and installed the required firmware files.
    Once the install has completed and some of Internet connectivity is available,
    OpenBSD users can run the command fw_update to fetch and install upgrade firmware
    for components the system recognizes as needing firmware.


    Where supported hardware is restricted, the OpenBSD man pages usually note that
    fact and may even include the email addresses of people who might be able to change
    the manufacturer''s policy.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'It would take only minor change in the manufacturer''s licensing policy to
    make life easier for free software users everywhere and to boost sales. It''s
    possible that most situations like these will be resolved by the time you read
    this. Be sure to check the latest information online—and be prepared to vote with
    your wallet if a particular company refuses to accept it.


    If you shop online, keep the man pages available in another tab or window. If
    you go to a physical store, make sure to tell the clerks you''re trying to sell
    using a BSD. If you''re not sure about the parts they''re trying to sell you,
    ask to borrow a machine to browse the man pages and other documentation online.
    You might even ask for permission to boot a machine with the hardware you''re
    interested in from a CD or USB stick and study the dmesg output. Telling staff
    up about your project could make it easier to get a refund if the part doesn''t
    work. And if the part does work, leaving the vendor is good advocacy. Your request
    could do very well the first time the seller has heard of your favourite operating
    system.


    # Issues Facing Hardware Support Developers


    Systems such as OpenBSD and the other BSDs didn''t spring fully formed from the
    forehead of a deity (although some will argue that is not different). Rather,
    they''re the result of years of effort by a number of smart and dedicated developers.


    Through reverse engineering, developers can write drivers to support hardware
    even without proper documentation, but the process is a complicated one that consists
    of educated guessing, coding, and testing until results begin to emerge. Reverse
    engineering takes a long time and—for reasons known only to lawmakers and lobbyists—it
    has legal consequences in several jurisdictions around the world.


    The good news is that you can help the developers get the hardware and other material
    they need.


    +   1. This is a frequent talk topic, too. For example, Theo de Raadt''s OpenBSD
    2006 presentation "Why hardware documentation matters so much and why it is so
    hard to get," available at http://www.openbsd.org/papers/opencon06-docs/index.html.'
  merge: -1
