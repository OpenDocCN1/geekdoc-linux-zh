    one or more members.


    Note that filtering on interface groups makes it possible to write hardware-independent
    rule sets. As long as your $hostname files or $ifconfig_ lines pass the interfaces
    in the correct groups, rule sets that consistently filter on interface groups
    will be fully portable between machines that may or not have identical hardware
    configurations.


    On systems where the interface group feature isn''t available, you may be able
    to achieve some of the same effects via creative use of macros,


    ```

    untrusted = "$ath0 athi w1 epo"

