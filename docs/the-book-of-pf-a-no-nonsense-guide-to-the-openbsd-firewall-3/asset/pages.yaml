    Chapter 6 covered several ways to use spend to cut down on spam. If running spam
    isn''t an option in your environment, you can use a queue and rule set based on
    the knowledge that machines that send spam are likely to be a particular operating
    system. (Let''s call that operating system (Windows).


    PF has a fairly reliable operating system fingerprinting mechanism, which detects
    the operating system at the other end of a network connection based on characteristics
    of the initial SYN packets at connection setup. The following may be a simple
    subset for spam if you''ve determined that legitimate mail is highly unlikely
    to be delivered from systems that run that operating system.


