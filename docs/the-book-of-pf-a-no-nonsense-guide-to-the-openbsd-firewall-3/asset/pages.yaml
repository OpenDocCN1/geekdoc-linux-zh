    # cbq


    Class-based queues are defined as constant-sized bandwidth allocations, as a percentage
    of the total available or in units of kilobits, megabits, and bits per second.
    A cbq queue can be subdivided into queues that are assigned priorities in the
    range 0 to 7, and again, a higher priority means preferential treatment.


    # hfsc


    The hfsc discipline uses the HFSC algorithm to ensure a "fair" allocation of bandwidth
    among the queues in a hierarchy. HFSC comes with the possibility of setting queuing
    regimes with guaranteed minimum allocations and hard upper limits. Allocations
    can even vary over time, and you can even have fine-grained priority with a 0
    to 7 range.


    Because both the algorithm and the corresponding setup with ALTQ are fairly complicated,
    with a number of tunable parameters, most ALTQ practitioners tend to stick with
    the simpler queue types. Yet the ones who claim to understand HFSC swear by it.


    # Setting Up ALTQ


    Enabling ALTQ may require some extra steps, depending on your choice of operating
    system.


    # ALTQ on OpenBSD


    On OpenBSD 5.5, all supported queue disciplines are compiled into the GENERIC
    and GENERIC.MP kernels. Check that your OpenBSD version supports ALTQ. If so,
    the only configuration you need to do involves editing `pf.conf`.


    # ALTQ on FreeBSD


    On FreeBSD, make sure that your kernel has ALTQ and the ALTQ discipline options
    compiled in. The default FreeBSD GENERIC kernel doesn''t have ALTQ options enabled,
    as you may have noticed when running the `/etc/rc.d/pf` script to enable PF. The
    relevant options are:


    | options | ALTQ |

    |--- |--- |

    | options | ALTQ_CBQ # Class Bases Queues (CBQ) |

    | options | ALTQ_RED # Random Early Detection (RED) |

    | options | ALTQ_RIO # RED In/Out |

    | options | ALTQ_HFSC # Hierarchical Packet Scheduler (HFSC) |

    | options | ALTQ_PRIQ # Priority Queuing (PRIQ) |

    | options | ALTQ_NOPCC # Required for SMB build |'
