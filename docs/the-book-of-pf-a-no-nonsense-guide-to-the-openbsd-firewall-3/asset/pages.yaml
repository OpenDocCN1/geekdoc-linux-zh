    # # A Web Server and Mail Server on the Inside—NAT Version


    Let''s backtrack a little and begin again with the baseline scenario where the
    sample clients from Chapter 3 get three new neighbors: a mail server, a Web server,
    and a file server. This time around, extremely visible IPv4 addresses are neither
    available or too expensive, and running several other services on a machine that
    primarily a firewall isn'' desirable. This means we are back to the situation
    where we do NAT at the gateway. Fortunately, the redirection mechanisms in PF
    make it relatively easy to keep servers on the inside of a gateway that performs
    NAT.


    The network specifications are same as the example setup we just worked through:
    We need to run a Web server that sets up data in cleartext (http) and encrypted
    (https) form, and we want a mail server that sends and receives email while leaving
    clients inside and outside the network use a number of well-known submission and
    retrieval protocols. In short, we want pretty much the same features as in the
    setup from the previous section, but with only one routable address.


    Of the three servers, only the web server and mail server need to be visible to
    the outside world, so we add macros for their IP addresses and services to the
    Chapter 3 rule set:


    ```

    webserver = "192.168.2.7"

    webports = "http, https"

    mailserver = "192.168.2.5"

    email = "smtp, pop3, imap, imaps, pop3s"

    ```


    With only one routable address and the servers hidden in NATed address space,
    we need to set up rules at the gateway that refract the traffic we want our servers
    to handle. We could define a set of match rules to set up direction and then address
    the block or pass question in a set of rules later, like this:


    ```

    match in $ext_if proto tcp to $ext_if port webports rdr-to=$webserver

    match in $ext_if proto tcp to $ext_if port email rdr-to=$emailserver

    ```


    ```

    pass proto tcp to $emailserver port $email

    pass proto tcp from $emailserver to port smtp

    ```'
