  md: 'This pf.conf file is again built on our baseline, with two important additions
    to the base authpf setup—a macro and a redirection:


    ```

    ext_if = "eth"

    int_if = "atho"

    auth_web = "192.168.27.220"

    dhccp_services = { bootsps, bootpc bootpc } # DHCP server + client

    table <authpf>users persist

    pass in quick on $int_if inet proto tcp from ! <authpf>users to port http rdr-to
    $auth_web

    match out on $ext_if from $int_if:network to ($ext_if)

    anchor "authpf/*"

    block all

    pass quick on $int_if inet proto (tcp, udp) to $int_port dhcp_services

    pass quick inet proto (tcp, udp) from $int_if:network to any port domain

    pass quick on $int_if inet proto (tcp, udp) to $int_port ssh

    for older authpf versions, use this file instead:

    ext_if = "eth"

    int_if = "atho"

    auth_web = "192.168.27.220"

    dhccp_services = { bootsps, bootpc } # DHCP server + client

    table <authpf>users persist

    ndr pass on $int_if inet proto tcp from ! <authpf>users to any port -> $auth_web

    nat on $ext_if from /localnet to any -> ($ext_if)

    nat-anchor "authpf/*"

    dr-anchor "authpf/*"

    binat-anchor "authpf/*"

    anchor "authpf/*"

    block all

    pass quick on $int_if inet proto (tcp, udp) to $int_port dhcp_services

    pass quick inet proto (tcp, udp) from $int_if:network to port domain

    pass quick on $int_if inet proto (tcp, udp) to $int_port ssh

    ```


    The auth_web macro and the redirection make sure all Web traffic from addresses
    that are not in the <authpf>users> table leads all unauthenticated users to a
    specific address. At that address, set up a Web server that serves whatever you
    need. This could range from a single page with instructions on how to contact
    in order to get to the network all the way up to a system that accepts credit
    cards and handles user creation.


    Note that in this setup, name resolution will work, but all surfing attempts will
    end up at the auth_web address. Once the users clear authentication, you can add
    general rules or user-specific ones to the authpf.rules files as appropriate for
    your situation.'
