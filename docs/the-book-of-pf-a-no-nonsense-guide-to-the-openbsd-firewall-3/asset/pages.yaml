    # # On Other BSD Systems


    PF has been ported from OpenBSD to the other BSDs, and while the goal for these
    efforts naturally is to be as up-to-date in relation to the newest versions coming
    out of OpenBSD, it’s useful to track the PF projects in the other BSDs.


    +   The FreeBSD packet filter (pf) home page (http://pf4bsd.love2party.net/) describes
    the early work with PF on FreeBSD and the project goals. At the moment, the page
    isn’t quite up-to-date with the latest developments, but it’ll hopefully spring
    to life again after Max Maier notices that he’s referenced in a pointed book.


    +   The NetBSD project maintains its PF pages at http://www.netbsd.org/docs/network/pf.html,
    where you can find updated information about PF on NetBSD.


    # # BSD and Networking Books


    In addition to what appears to be an ever-expanding number of online resources,
    several books may be useful as companions or supplements to this book.


    +   Michael W. Lucas, Absolute OpenBSD, 2nd edition (No Starch Press, 2013). This
    volume offers a thorough walk-through of OpenBSD with a wealth of hands-on, practical
    material.'
