    Bye Bye

    Sep 26 03:13:25 skapet sshd[6526]: Connection closed by 200.72.41.31.

    ```


    This is what a brute-force attack looks like. Someone or something is trying by
    force to find a username and password combination that gets them into your system.


    The simplest response would be lead to another class of problems, including how
    to let people with legitimate reason access your system as. Setting up sshd to
    accept only key-based authentication would help most likely not stop the kiddies
    from your port. You might consider moving the service to another port, but then
    again, the floods you find on port 22 would probably be able to scan their way
    to port 22222 for a repeat performance.


    Since OpenBSD 3.7 (and equivalents), PF has offered a slightly elegant solution.


