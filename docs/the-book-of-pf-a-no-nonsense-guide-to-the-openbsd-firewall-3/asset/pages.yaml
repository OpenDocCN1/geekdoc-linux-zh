  md: '# Basic Bridge Setup on OpenBSD


    The OpenBSD GENERIC kernel contains all the necessary code to configure bridges
    and filter them. Unless you''ve compiled a custom kernel without the bridge code,
    the setup is quite straightforward.


    > On OpenBSD 4.7 and newer, the brconfig command no longer exists. Bridge configuration
    and related functionality was merged into ifconfig for the OpenBSD 4.7 release.
    If you''re running on an OpenBSD release where ifconfig is available, you''re
    running an out-of-date, unsupported configuration. Please upgrade to a more recent
    version as soon as feasible.


    To set up a bridge with two interfaces on the command line, you first create the
    bridge device. The first device of a kind is conventionally given the sequence
    0, so we create the bridge device with the following command:


    ```

    $ ifconfig bridge0 create

    ```


    Before the next ifconfig command, use ifconfig to check that the prospective member
    (in our case, ep0 and ep1) are up, but not assigned IP addresses. Next, configure
    the bridge by entering the following:


    ```

    $ ifconfig bridge0 add ep0 ep1 blocknonip ep0 blocknonip ep1

    ```


    The OpenBSD ifconfig command contains a fair bit of code itself. In this example,
    we use the blocknonip option for each interface to block all non-IP traffic.


    > The OpenBSD ifconfig command offers its own set of filtering options in addition
    to other configuration options. The bridge(4) and ifconfig(8) man pages provide
    further information. Because it operates on the Ethernet level, it''s possible
    to use ifconfig to specify filtering rules that let the bridge filter on MAC addresses.
    Using these filtering capabilities, it''s also possible to let the bridge tag
    packets for further processing in your PF rule set via the tagged keyword. For
    tagging purposes, a bridge with one member interface will do.


    To make the configuration permanent, create or edit /etc/hostname.ep0 and enter
    the following line:


    ```

    up

    ```


    ```

    For the other interface, /etc/hostname.ep1 should contain the same line:

    ```


    ```

    up

    ```'
  merge: -1
