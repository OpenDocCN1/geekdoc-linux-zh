  md: 'The pfstat program collects the data you specify in the configuration file
    and presents that data as JPG or PNG graphics files. The data source can be either
    PF on the local system via the /dev/pf device or data collected from a remote
    computing using the companion pfstat daemon.

    to set up pfstat, you simply decide which parts of your PF you want to graph and
    how, then write the configuration file and start cron jobs to collect the data
    and generate your graphs. The program comes with a well-annotated sample configuration
    file and a useful man page. The sample configuration is a useful starting point
    for writing your own configuration file. For example, the pfstat.fragment is very
    close to one you will find in the sample configuration:


    ```

    collect 8 = global states inserts diff

    collect 9 = global states removals diff

    collect 10 = global states searches diff

    ```


    ![](img/838f49667801fd8460438797800410dd_197_0.png)


    The configuration starts off with three color statements, where each of the data
    series is assigned a unique identifier. Here we capture the number of insertions,
    removals, and searches in the state table. Next is the image definition, which
    specifies the data that is be graphed. The graph line specifies the period to
    display (from 1 days to now means that only data collected during the last 24
    hours is to be displayed). width and height specify the graph size measured in
    number of pixels in each direction. The graph statements specify how the data
    series are displayed as well as the graph legends. Collecting state insertions,
    removals, and searches once a minute and then graphing the data collected over
    one day produces a graph roughly like the one in Figure 9-1.


    +   2. The color values listed in the configuration example give you a graph with
    red, blue, and green lines. For the print version of this book, we changed the
    colors to grayscale values:

    0 192 became 105 105 105, 0 255 became 192 192 192, and 255 0 0 became


