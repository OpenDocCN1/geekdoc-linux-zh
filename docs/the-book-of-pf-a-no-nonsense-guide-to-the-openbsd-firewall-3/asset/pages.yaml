  md: '# # 5

    BIGGER OR TRICKIER NETWORKS


    ![](img/838f49667801fd8460438797800410dd_88_0.png)


    In this chapter, we''ll build on the material in previous chapters to meet the
    real-life challenges of both large and small networks with relatively demanding
    applications or users. The sample configurations in this chapter are based on
    the assumption that your packet-filtering setups will need to accommodate services
    you run on your local network. We''ll mainly look at this challenge from a Unix
    perspective, focusing on SSH, email, and Web services (with some pointers on how
    to take care of other services).


    This chapter is about the things to do when you need to combine packet filtering
    with services that must be accessible outside your local network. How much this
    complicates your rules sets will depend on your network design and, to a certain
    extent, on the number of routable addresses you have available. We''ll begin with
    configurations for official, routable IPv4 addresses as well as the generally
    routable IPv6 addresses ranges. Then, we''ll move on to situations with as few
    as one routable IPv4 address and PF-based work-arounds that make the services
    usable even under these restrictions.'
  merge: -1
  pgno: 88
- img_proc: true
  md: "# A Web Server and Mail Server on the Inside:\nRoutable IPv4 Addresses\n\n\
    How complicated is your network? How complicated does it need to be?\nWe'll start\
    \ with the baseline scenario of the sample clients from Chapter 3. We set up the\
    \ clients with a basic PF firewall and give them access to a range of services\
    \ hosted elsewhere but no services running on the local network. These clients\
    \ get three neighbors: a mail server, a Web server, and a file server. In this\
    \ scenario, we use official, routable IPv4 addresses because it makes life a little\
    \ easier. Another advantage of this approach is that with routable addresses,\
    \ we can let two of the new machines run DNS for our example.com domain: as the\
    \ master and the other as an alternative slave.^1 And as you'll see, adding IPv6\
    \ addresses and running a dual-stack network not necessarily make your rule set\
    \ noticeably more complicated.\n\n+   * Web server:\n  webserver = \"{ 192.0.2.227,\
    \ 2001:db8::baad:f0ad:f17 }\"\n* Web services:\n  webports = \"{ http, https }\"\
    \n* Mail server:\n  emailserver = \"{ 192.0.2.225, 2001:db8::baad:f0ad:f117 }\"\
    \n\n> 1. In fact, the example.com network lives in the 192.0.2/24 block, which\
    \ is reserved in RFC 3330 for example and documentation use. We use this address\
    \ range mainly to differentiate from the NAT examples elsewhere in this book,\
    \ which use addresses in the \"private\" RFC 1918 address space."
  merge: -1
