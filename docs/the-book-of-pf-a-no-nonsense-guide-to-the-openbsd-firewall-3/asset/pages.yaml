- img_proc: true
  md: "# Sharing the Load: Redirecting to a Pool of Addresses\n\nOnce you've set up\
    \ services to be accessible to the world at large, one likely scenario is that\
    \ time, one or more of your services will grow more sophisticated and resource-hungry\
    \ simply attract more traffic than you feel comfortable serving from a single\
    \ server.\n\nThere are a number of ways to make several machines share the load\
    \ of running a service, including ways to fine-tune the service itself. The network-level\
    \ load balancing, PF offers the basic functionality you need redirection to tables\
    \ or address pools. In fact, you can implement a form of load balancing without\
    \ ever touching your pass rules, at least if your environment is not dual-stack.\n\
    \nTake the Web server in our example. We already have the macro that represents\
    \ a service, our Web Server. For reasons that will become obvious in a moment,\
    \ we need to reduce that macro to represent only the IPv4 address (webserver =\
    \ \"192.0.2.227\"), which, in turn, is associated with the hostname that your\
    \ users have bookmarked, possibly www.example.com. When the time comes to share\
    \ the load, set up the required number of at least equivalent servers, and then\
    \ alter your rule slightly to introduce the redirection. First, define a table\
    \ that holds the addresses for your Web server persist IPv4 addresses:\n\ntable\
    \ <webpool> { 192.0.2.214, 192.0.2.215, 192.0.2.216, 192.0.2.217 }\n\nThen, perform\
    \ the redirection:\n\n```\nmatch in $ext_if proto tcp to $webserver port $webports\
    \ \\\n    rdr-to <webpool> round-robin\n```\n\nUnlike the redirections in earlier\
    \ examples, such as the FTP proxy in Chapter 3, this rule sets up members of the\
    \ webpool as potential redirection targets for incoming connections intended for\
    \ the webports port on the webserver address. Each incoming connection that matches\
    \ this rule is redirected to one of the addresses in the table, spreading the\
    \ load across several hosts. You may choose to retire the original Web server\
    \ once the switch to this redirection is complete, or you may let it be absorbed\
    \ in the new Web server pool.\n\nOn PF versions earlier than OpenBSD 4.7, the\
    \ equivalent rule is as:\n\n```\nrdr on $ext_if proto tcp to $webserver port $webports\
    \ -> <webpool> round-robin\n```\n\nIn both cases, the round-robin option means\
    \ that PF shares the load between the machines in the pool by cycling through\
    \ the table of redirection addresses sequentially.\n\nSome applications expect\
    \ accesses from every individual source to always go to the same host in the backend\
    \ (for example, there are servers that depend on client- or session-specific parameters\
    \ that will be lost if new connections hit a different host in the backend). If\
    \ your configuration needs to cater to such services, you can add the sticky-address\
    \ option"
  merge: -1
  pgno: 95
- img_proc: true
  md: "to make sure that connections from a client are always redirected to the same\
    \ machine behind the redirection as the initial connection. The downside to this\
    \ option is that PF needs to maintain source-tracking data for each client, and\
    \ the default value for maximum source nodes tracked set at 10,000, which is a\
    \ limiting factor. (See Chapter 10 for advice on adjusting and similar limit values.)\n\
    \nWhen even load distribution isn't an absolute requirement, selecting the redirection\
    \ address at random may be:\n\n```\nmatch in $ext_proto tcp to $webserver $webports\
    \ \\ rdr-to <webpool> random\n```\n\nOn pre-OpenBSD 4.7 PF versions, the random\
    \ option isn't supported for redirection tables or lists of addresses.\n\nEven\
    \ organizations with large pools of official, routable IPv4 addresses have opted\
    \ to introduce NAT between their load-balanced server pools and the Internet at\
    \ large. This technique works equally well in various NAT-based sets, but moving\
    \ to NAT offers some potential disadvantages and challenges.\n\nIn order to accommodate\
    \ an IPv4 and IPv6 dual-stack environment in this way, you'll need to set up tables\
    \ for address pools and separate match pass rules with redirection for IPv4 and\
    \ IPv6. A single table for both IPv4 and IPv6 rules would sound like an elegant\
    \ idea at first, but the simple redirection rules outlined here aren't intelligent\
    \ enough to correct redirection decisions based on the address family of individual\
    \ entries.\n\n# Getting Load Balancing Right relayd\n\nAfter you've been running\
    \ for a while with load balancing via round-robin redirection, you may notice\
    \ that the redirection doesn't automatically adapt to external conditions. For\
    \ example, unless special steps are taken, a host in the list of redirection goes\
    \ down, will still be redirected to the IP addresses in the list of possibilities.\n\
    \nClearly, a monitoring solution is needed. Fortunately, the OpenBSD base system\
    \ provides one. The relay daemon thượng interacts with your PF configuration,\
    \ providing the ability to weed out nonfunctioning hosts from your pool. Introducing\
    \ relayd into your setup, however, may require some minor changes to your rule\
    \ set.\n\nThe relay daemon works in two main classes of services that it refers\
    \ to redirects and relays. It expects to be able to add or subtract hosts' IP\
    \ addresses to or from the PF it controls. The daemon interacts\n\n+   Originally\
    \ introduced in OpenBSD 4.1 under the name hoststated, the daemon has seen active\
    \ development (by Reyk Floeter and Pierre-Yves Ritschard) over several years,\
    \ including a few important changes to the configuration syntax, and it remains\
    \ relayed in time for the OpenBSD 4.3 release.\n\n Bigger or Tricker Networks\
    \ 73"
  merge: -1
  pgno: 96
- img_proc: true
  md: 'with your rule set through a special-purpose anchor relayed (and in pre-OpenBSD
    4.7 versions, also a redirection anchor, rdr-anchor, with the same name).


    To see how we can make our sample configuration a little better by using relayed,
    we''ll look back at the load-balancing rule set. Starting from the top of your
    pf.conf file, add the anchor for relayed to insert rules as needed:


    anchor /relayed/*


    On pre-OpenBSD 4.7 versions, you also need the redirection anchor:


    rdr-anchor "relayed/*"

    anchor "relayed/*"


    In the load-balancing rule set, we had the following definition for the Web server
    pool:


    table webpool persist { 192.0.2.214, 192.0.2.215, 192.0.2.216, 192.0.2.217 }


    It has this match to set up the redirection:


    ```

    match on $ext_if proto tcp $webserver port $webports \

    rdr-to <webpool> round-robin

    ```


    Or on pre-OpenBSD 4.7 versions, you''d use the following:


    ```

    rdr on $ext_if proto tcp to $webserver port -> <webpool> round-robin

    ```


    To make this configuration work slightly better, we remove the redirection and
    the table (remember to take care of both sets in a dual-stack configuration),
    and we let relay handle the redirection or redirections by setting up its own
    versions inside the anchor. (Don''t remove the pass rule, however, because your
    rule will still need to have a pass rule that lets traffic flow to the IP addresses
    in relayed''s tables. If you had separate rules for your inet and inet6, you might
    be able to merge these rules into one.)


    Once the pf.conf parts have been taken care of, we turn to relayed''s relayed.conf
    configuration file. The syntax in this configuration file is similar enough to
    pf.conf to make it easy to read and understand. First, we add the macro definitions
    we''ll be using:


    ```

    web1="192.0.2.214"

    web2="192.0.2.215"

    web3="192.0.2.216"

    web4="192.0.2.217"

    webserver="192.0.2.227"

    sorry_server="192.0.2.200"

    ```'
