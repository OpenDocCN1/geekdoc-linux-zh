  md: '# Spam-Fighting Tips


    When used selectively, blacklists combined with spam are powerful, precise, and
    efficient spam-fighting tools. The load on the spam machine is minimal. On the
    other hand, spam will never perform better than its weakest data source, which
    means you''ll need to monitor your logs and use whitelisting when necessary.


    It''s also feasible to run spam in a pure greylist mode, with no blacklists. In
    fact, some users report that a purely greylisting spam configuration is about
    as effective as a spam-fighting tool as configurations with blacklists and sometimes
    significantly more effective than content filtering. One such report posted to
    opensb-misc claimed that pure greylisting immediately rid the company of approximately
    95 percent of its spam load. (This report is accessible via http://marc.info/,
    among places; for the subject "Followup – spam greylisting results.")


    I recommend two very good blacklists. One is Bob Beck''s trast based on "ghosts
    of unused postings." Generated by computers running spam at the University of
    Alberta, Bob''s setup is a regular system that removes addresses automatically
    after 24 hours, which means that you have an extremely low number of false positives.
    The number of hosts varies widely and has been as high as 670,000. While still
    officially in testing, the list was made public in January 2006. The list is available
    from http://www.opensb.org/spam/traplist.gz. It''s part of recent sample spam.com
    files by the uatrap blacklist.


    The other I recommend is heist.de:nixspam, which has a 12-hour automatic expiry
    and extremely good accuracy. It''s also in the spam.com file. Detailed information
    about this list is available from http://www.heise.de/ix/nixspam/dnxsbl_en/


    Once you''re happy with your setup, try introducing local greylapping This is
    likely to cause a few undesirable, and it''s good, clean fun. Some limited experiments-carried
    out while we wrote this chapter (chronicled at http://bady.blogspot.com/ in entries
    starting with http://bady.blogspot.com/2007/027/hey-spammer-list-for-you.html)
    – even suggest that harvesting the invalid addresses you use from your mail server
    logs, from spam logs, or directly from your greylist to put in your traplist is
    extremely efficient. Publishing the list on a moderately visible Web page appears
    to ensure that the addresses you put there will be recorded over and over again
    by address-harvesting robots and will provide you with even better greytapping
    material, as they''re more likely to be kept on the spammers'' list of known good
    addresses.'
