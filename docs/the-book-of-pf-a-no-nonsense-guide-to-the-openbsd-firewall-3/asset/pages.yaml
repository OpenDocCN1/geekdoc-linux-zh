  md: 'Here''s another rule that is useful to those who want the ability to administer
    machines from elsewhere:


    ```

    pass in proto tcp to port ssh

    ```


    Or use this form, if you prefer:


    ```

    pass in proto tcp to $ext_if port ssh

    ```


    When you leave out the from part entirely, the default is from any, which is permissive.
    It lets you log in from anywhere, which is great if you travel a lot and need
    SSH access from unknown locations around the world. If you''re not mobile—say
    you haven''t developed the taste for conferences in far-flung locations, on vacation—or
    you feel your colleagues can fend for themselves while you''re on vacation—you
    may need to tighten up with a from that includes only the places where you and
    other administrators are likely to log in for legitimate reasons.


    Our very basic rule is still not complete. Next, we will need to make the name
    service work for our clients. We start with another macro at the start of our
    rule:


    ```

    udp_services = "{ domain, ntp }"

    ```


    This is supplemented with a rule that passes the traffic we want through our firewall:


    ```

    pass quick proto { tcp, udp } to port $udp_services

    ```


    Note the keyword in this rule. We''ve writing rule sets that consist of several
    rules, and it''s time to revisit the relationships and interactions between them.


    As noted in the previous chapter, the rules are evaluated from top to bottom in
    the sequence they''re written in the configuration file. For each packet or connection
    evaluated by PF, the last matching rule in the rule set is the one''s applied.


    The quick keyword offers an escape from the ordinary sequence. When a packet matches
    a quick rule, the packet is treated according to the present rule. The rule processing
    stops without considering any further rules that might have matched the packet.
    Your rule sets grow longer and more complicated, you''ll find this quite handy.
    For example, when you need a few isolated exceptions to your general rules.


    This quick rule also takes care of NTP, which is used for time synchronization.
    Common to both the name service and time synchronization protocols is that they
    may, under certain circumstances, communicate alternately over TCP and UDP.'
