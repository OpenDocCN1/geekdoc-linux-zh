  md: '# # 7


    # # TRAFFIC SHAPING WITH QUEUES AND PRIORITIES


    In this chapter, we look at how to use traffic shaping to allocate bandwidth resources
    efficiently and according to a specified policy. If the term *traffic shaping*
    seems unfamiliar, rest assured it means what you think it means: that you’ll be
    altering the way your network allocates resources in order to satisfy the requirements
    of your users and their applications. With a proper understanding of your network
    traffic and the applications and users that generate it, you can, in fact, go
    quite a bit of distance towards “bigger, better, faster, more” just by optimizing
    your network for the traffic that''s actually supposed to pass there.


    A small but powerful arsenal of traffic-shaping tools is at your disposal; all
    of them work by introducing nondefault behavior into your network setup to bend
    the realities of your network according to your wishes. Traffic shaping for PF
    contexts currently comes in two flavors: the once experimental'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'ALTQ (short for alternate queueing) framework, now considered old-style after
    some 15 years of service, and the newer OpenBSD priorities and queuing systems
    introduced in OpenBSD 5.5.


    In the first part of the chapter, we introduce traffic shaping looking at the
    features of the new OpenBSD priority and queuing system. If you''re about to set
    up OpenBSD 5.5 or newer, you can jump right in, starting with the next section,
    "Always-On Priority and Queues for Traffic Shaping." This is also where the main
    traffic-shaping concepts are introduced with examples.


    On OpenBSD 5.4 and earlier as well as other BSDs where the code wasn''t current
    with OpenBSD 5.5, traffic shaping was the domain of the ALTQ system. On OpenBSD,
    ALTQ was removed after one transitional release, leaving only the newer traffic-shaping
    place in OpenBSD 5.6 onward. If you''re interested in converting an existing ALTQ
    setup to the new system, you will likely find "Transitioning from ALTQ to Priorities
    and Queues" on page 131 useful; this section highlights the differences between
    the older ALTQ system and the new system.


    If you''re working with an operating system where the queues system introduced
    in OpenBSD 5.5 isn''t yet available, you will want to study the ALTQ traffic-shaping
    subsystem, which is described in "Directing Traffic with ALTQ" on page 133. If
    you''re learning traffic-shaping concepts and want to apply them to an ALTQ setup,
    please read the first part of this chapter before diving into ALTQ-specific configuration
    details.


    # Always-On Priority and Queues for Traffic Shaping


    Handling your bandwidth has a lot in common with balancing your book or handling
    other resources that are either scarce or available in finite quantities. The
    resource is available in a constant supply with upper limits, and you need to
    allocate the resource with maximum efficiency, according to the priorities set
    out in your policy or specification.


    OpenBSD 5.5 and newer offer different options for managing your bandwidth via
    classification mechanisms in your PF rule sets. We''ll take a look at what you
    can do with pure traffic prioritization first and then move on to subdivide your
    bandwidth resources by allocating defined subsets of your traffic queues.


    118 Chapter 7'
