- img_proc: true
  md: 'If PF not enabled, the pfctl -e command will enable PF and display this:

    PF enabled


    In versions prior to OpenBSD 4.6, PF wasn''t enabled by default. You can override
    the default by editing your /etc/rc.conf.local file (or creating the file, if
    it doesn''t). Although it isn''t necessary on recent OpenBSD versions, it doesn''t
    hurt to add this to your /etc/rc.conf.local file:


    ```

    pf=YES # enable PF

    ```


    If you take a look at the /etc/pf.conf file in a fresh OpenBSD installation, you
    get your first excuse to a working rule.

    The default OpenBSD pf.conf file starts off with a set skip on 0 rule to make
    sure traffic on the loopback interface isn''t filtered in any way. The next active
    line is a simple pass default to let your network traffic pass by default. An
    explicit block rule blocks X11 traffic to your machine.


    As you noticed, the default pf.conf also contains some comment lines starting
    with a hash (#). In these comments, you''ll find suggested rules that hint at
    useful configurations, such as FTP passthrough through ftp-proxy (see Chapter
    3) and spend, the OpenBSD spam-daemon daemon (see Chapter 6). These items are
    potentially useful in various real-world scenarios, but they may not be relevant
    in all configurations, and are commented out in the file by default.


    If you look for PF-related settings in /etc/rc.conf file, you''ll find the setting
    of pf.rules=. In principle, this lets you specify that your configuration is in
    a file other than the /etc/pf.conf. However, changing this setting is probably
    not worth the trouble. Using the default setting lets you take advantage of a
    number of automatic housekeeping features, such as automatic nightly backup of
    your configuration to /var/backups.


    On OpenBSD, the /etc/rc script has a built-in mechanism to help you out of reboot
    with either pf.conf file or one that contains an invalid rule set. Before enabling
    any network interfaces, the rc script allows a rule set that allows few basic
    services: SSH from anywhere, base name resolution, and NFS mounts. This allows
    you to log in and correct any errors in your rule set, and then go on working
    from there.


    # Setting Up PF on FreeBSD


    Good code travels well, and FreeBSD users will tell you that good code from elsewhere
    tends to find its into FreeBSD sooner or later. PF is no exception, and from FreeBSD
    5.2.1 and the 4.x series on although, PF and related tools became part of FreeBSD.'
