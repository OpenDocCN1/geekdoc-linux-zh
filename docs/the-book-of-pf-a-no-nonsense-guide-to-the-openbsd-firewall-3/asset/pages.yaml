  md: '+   * "Effective spam and malware countermeasures" (http://bsdl.blogspot.com/2014/02/effective-spam-and-malware.html),
    originally by BSDC 2007 paper with some updates, includes a best-practice description
    of how to use greylisting, spam, and other free tools in OpenBSD to successfully
    fight spam and malware in your network.

    * A promising development is Peter Hessler''s BGP-spamd project, which abuses
    the BGP routing protocol slightly to distribute spam between participating hosts.
    The project''s website is at http://bpg-spamd.net/ for further information.


    # Book-Related Web Resources


    For news and updates about this book, check the book''s home page at the No Starch
    Press website (http://www.nostarch.com/pf3/). That page contains links to pages
    on my personal web space, where various updates and bookrelated resources will
    appear as they become available. I post book-related news and updates at http://www.bsdl.net/bookpf/.
    Announcements to the book are likely to turn up my blog at http://bsdl.blogspot.com/,
    too.

    I maintain the tutorial manuscript "Firewalling with OpenBSD''s PF filter". My
    policy is to make updates appropriately, as I become aware of changes or features
    of PF and related software while preparing for appearances at conferences. The
    tutorial manuscript is available under a BSD license and can be downloaded in
    several formats from my web space at http://home.nuug.org/~peter/pf/. Updated
    versions will appear at that URL more or less in the natural course of tinkering
    between events.


    # Buy OpenBSD CDs and Donate!


    If you''ve enjoyed this book and found it useful, please go to the OpenBSD.org
    ordering page at http://www.openbsd.org/inters.html to buy CDs, or for matter,
    go to the donations page at http://www.openbsd.org/donations.html to support further
    development work by the OpenBSD project via a monetary contribution.


    If you''re the kind of entity that''s more comfortable with donating to a corporation,
    you can contact the OpenBSD foundation, a Canadian nonprofit corporation created
    in 2007 for that specific purpose. See the OpenBSD Foundation website at http://www.openbsdfoundation.org/
    for more information.


    If you''ve found this book at a conference, there might even be an OpenBSD booth
    nearby where you can buy CDs, T-shirts, and other items.

    Remember that even free software takes real work and money to develop and maintain.'
  merge: -1
