    # How Complicated Is Your Network?—Revisited


    Early on in this chapter, we posed the questions “How complicated is your network?”
    and “How complicated does it need to be?” Over the sections of this chapter, we''ve
    presented a number of tools and techniques that make it possible to build complex
    infrastructure with PF and related tools that help manage that complexity while
    keeping the network administrator sane.


    If you''re in charge of one site where you need to apply all or most of the techniques
    we''ve mentioned in this chapter, I feel your pain. On the other hand, if you''re
    in charge of a network that is diverse, the subsequent chapters on traffic shaping
    and managing resource availability are likely to be useful to you as well.


    The rest of this book deals with optimizing your setup for performance and resource
    availability, with the exception of one chapter where we deviate slightly and
    take on a lighter tone. Before we dive into how to how to make your infrastructure
    unavailable or hard to reach for selected groups or individuals. The next chapter
    deals exclusively with making life harder for the unwashed masses—or perhaps even
    well-organized criminals—who try to abuse services in your care.'
