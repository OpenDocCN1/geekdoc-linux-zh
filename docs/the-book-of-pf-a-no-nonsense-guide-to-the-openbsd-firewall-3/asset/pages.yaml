- img_proc: true
  md: '# The First Step: Enabling PF


    Before you can get started on the fun parts of shaping your network with PF and
    related tools, you need to make sure that PF is available and enabled. The details
    depend on your specific operating system: OpenBSD, FreeBSD, or NetBSD. Check your
    setup by following the instructions for your operating system and then move to
    "A Simple PF Rule Set: A Single, Stand-Alone Machine" on page 16.


    The pfctl command is a program that requires higher privilege than the default
    for ordinary users. In the rest of this book, you''ll see commands that require
    extra privilege prefixed with sudo. If you haven''t started sudo yet, you should,
    be in the base system on OpenBSD. On FreeBSD, DragonBSD, and NetBSD, it''s within
    easy reach the ports system or pkgsrc system respectively, as security/sudo.


    Here are a couple general notes regarding pfctl:


    +   - The command to disable PF is pfctl -d. Once you''ve entered that, all PF-based
    filtering that may have been in place will be disabled, and all traffic will be
    allowed to pass.

    - For convenience, pfctl can handle several operations on a single command. To
    enable PF and load the rule set in a single command, enter the following:


    ```

    sudo pfctl -ef /etc/pf.conf

    ```


    # Setting Up PF on OpenBSD


    In OpenBSD 4.6 and later, you don''t need to enable PF because it''s enabled by
    default with a minimal configuration in place. If you were watching the system
    console closely while the system was starting up, you may have noticed the pf
    enabled message appear after the kernel messages.


    If you didn''t see the pf enabled message on the console at startup, you have
    several options to check that PF is indeed enabled. One simple way to check is
    to enter the command you would otherwise use to enable PF from the command line:


    ```

    sudo pfctl -le

    ```


    > If PF is already enabled, the system responds with this message:


    ```

    pfctl: pf already enabled

    ```


    +   - If you''re setting up your first PF configuration on an OpenBSD version
    earlier than this, the best advice is to upgrade to the most recent stable version.
    For some reason you must stay with the older version, it might be useful to consult
    the first edition of this book well as the man pages and other documentation for
    the specific version you''re using.'
