- img_proc: true
  md: 'Unless you''ve actually followed the advice from some of those old guides and
    flushed your existing rules (that is possible, pfctl -F all or similar) before
    attempting to load a new one from your configuration file, the last valid configuration
    remain loaded. In fact, flushing the rule set is rarely a good idea because it
    puts your packet filter in a pass mode, which in turn opens the door to any comes
    and runs the risk of useless traffic while you''re getting ready to load your
    rules.


    # Testing the Changed Rule Set


    Once you have a rule that pfctl loads without any errors, it''s time to see whether
    the rules''ve written behave as expected. Testing name resolution with a command
    as $ host nochart.com as we did earlier, should still work. However, it''s better
    to choose a domain you haven''t accessed recently, as one for a political party
    you wouldn''t voting for, to be sure that you''re not pulling DNS information
    from the cache.


    You should be able to surf the Web and use several mail-related services, but
    due to the nature of this updated rule, attempts to access TCP services other
    than ones defined—SSH, SMTP, and so—on any remote system should fail. And, as
    with our simple rule, your system should refuse all connections that don''t matching
    state table entries; only return traffic for connections initiated by this machine
    will be allowed.


    # Displaying Information About Your System


    The tests you''ve performed on your rule sets should have shown that PF is running
    and your rules''re behaving as expected. There are several ways to keep track
    of what happens in your running system. One of the more straightforward ways of
    extracting information about PF is to use the familiar pfctl program.


    Once PF is enabled and running, the system updates various counters and statistics
    in response to network activity. To confirm that PF is running and to view statistics
    about your activity, you can use pfctl -s followed by the type of information
    you want to display. A long list of information types is available (man 8 pfctl
    and for -s options). We''ll get back to some of those display options in Chapter
    9 and go into further detail about some the statistics they provide in Chapter
    10, when we use the data to optimize the configuration we''re building.


    The following shows an example of just the top part of the output of pfctl -s
    info (taken from my home gateway). The high-level information that indicates the
    system actually passes traffic can be found in this upper part.'
