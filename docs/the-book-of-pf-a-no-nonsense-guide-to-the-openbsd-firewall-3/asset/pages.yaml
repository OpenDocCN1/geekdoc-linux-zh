  md: 'If a spam sender managed to get a message delivered despite your best efforts,
    you could correct the situation by adding the spam sender to the spamamd-greytrap
    list like this:


    ```

    $ sudo spamamd -a t 192.168.2.128

    ```


    Adding a new trap address is just as simple:


    ```

    $ sudo spamamd -a -T _medvetsky@ehtrib.org

    ```


    If you want to reverse either of these choices, you would simply substitute -d
    for the -a option in these commands.


    # Keeping greylists in Sync


    Beginning with OpenBSD 4.1, spamamd can keep greylisting databases in sync across
    any number of cooperating greylisting gateways. The implementation is via a set
    of spam command-options:


    +   - The -y option specifies a sync target—that is, the IP address(es) of other
    spam-running gateways you want to inform of updates to your greylist information.


    +   - On the receiving end, the -y option specifies a sync listener, which is
    the address or interface where this spam instance is prepared to receive greylisting
    updates from other hosts.


    For example, our main spam gateway mainoffice-gw.example.com might have the following
    options added to its startup command line to establish a sync target and sync
    listener, respectively:


    ```

    -Y minorbranch-gw.example.com -y mainoffice-gw.example.com

    ```


    Conversely, minorbranch-gw.example.com at the branch office would have the hostnames
    reversed:


    ```

    -Y mainoffice-gw.example.com -y minorbranch-gw.example.com

    ```


    The spam daemon also supports shared-secret authentication between the synchronization
    partners. Specifically, if you create the file /etc/mail/spamamd.key and distribute
    copies of it to all synchronization partners, it''ll be used to calculate the
    necessary checksums for authentication. The spamamd.key file itself can be any
    kind of data, such as random data harvested from /dev/random, as suggested by
    the spam mand page.'
