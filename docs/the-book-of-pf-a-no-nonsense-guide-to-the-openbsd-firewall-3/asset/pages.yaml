  md: '# Testing Your Rule Set


    You may not have gotten around to writing that formal test suite for your rules
    sets just yet, but there''s every reason to test that your configuration works
    as expected.


    The same basic tests in the standalone example from the previous chapter still
    apply. But now you will need to test from the other hosts in your network as well
    as from your packet-filtering gateway. For each of the services specified in your
    pass rules, test that machines in your local network get meaningful results. From
    any machine in your local network, enter a command like:


    ```

    $ hostarch.com

    ```


    It should return exactly the same results as when you tested the standalone rule
    set in the previous chapter, and traffic for the services you have specified should
    pass.⁴


    You may not think it''s necessary, but it doesn''t hurt to check that the rule
    works as expected from your gateway as well. If you do exactly what this chapter
    says so far, it shouldn''t be possible to contact machines in your local network
    from the outside.


    ![](img/838f49667801fd8460438797800410dd_57_0.png)


    Looking at the examples up to this point, you''ve probably noticed that the rules
    all have macros that expand into IP addresses or address ranges but never into
    hostnames or domain names. You''re wondering why. After all, you''ve seen that
    PF lets you use service names in your rule set, so why not include hostnames or
    domain names?


    The answer is that if you used domain names and hostnames in your rule set, the
    rule set would be valid only after the service name was running and accessible.
    In the default configuration, PF is loaded before any network services are running.
    This means that if you want to use domain names and hostnames in your PF configuration,
    you''ll need to change the system''s startup sequence (editing /etc/pf.conf) to
    load the name service-dependent rule set only after the service name is available.
    If you have only a limited number of hostnames or domain names you want to reference
    in your PF configuration, it''s likely at least as useful to add those as IP addresses
    to name-mapping entries in your /etc/hosts file and leave the rc scripts alone.'
