    # Tracking Your Real Mail Connections: spamlog


    Beyond scenes, rarely mentioned and barely documented, is one of spam''s most
    important helper programs: the spamlog whitelist updater. It works in the background,
    logging connections to your mail servers to keep your whitelist updated. The idea
    is to make sure that mail sent between hosts you communicate with goes through
    a minimum of fuss,


    NOTE


    If you''ve followed the discussion up to this point, spamlog has probably started
    automatically already. However, if your initial spam configuration didn''t include
    greylisting, spamlog may not have started, and you may experience strange symptoms,
    like the greylist and whitelist not being updated properly. Restarting spam after
    you''ve enabled greylisting should ensure that spamlog is loaded and available,
    too.'
