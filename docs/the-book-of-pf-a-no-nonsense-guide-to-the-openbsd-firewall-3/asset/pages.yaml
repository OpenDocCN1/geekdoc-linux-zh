  md: 'On FreeBSD, the /etc/rc.d/pf script requires at least a line in /etc/rc.conf
    that reads pf_enable=YES and a valid /etc/pf.conf file. If either of these requirements
    isn''t met, the script will exit with an error message. There is no /etc/pf.conf
    in a default FreeBSD installation, so you''ll need to create one before rebooting
    the system with PF enabled. For our purposes, creating an empty /etc/pf.conf with
    touch will do, but you could also work from a copy of the /usr/share/examples/pf/pf.conf
    file supplied by the system.


    The sample file /usr/share/examples/pf/pf.conf contains no active settings. It
    only comments lines starting with a # character and commented-out rules, but it
    gives you a preview of what a working rule set will look like. For example, if
    you remove the # sign before the line that says set skip on lo to enable the line
    and save the file as your /etc/pf.conf, loopback interface group will not be filtered
    once you enable PF and load the rule set. However, even if PF is enabled on your
    FreeBSD system, we haven''t gone around writing an actual rule set, so PF isn''t
    doing much of anything and all packets will pass.


    As of this writing (August 2014), the FreeBSD rc scripts don''t set up a default
    rule set as a fallback if the configuration read from /etc/pf.conf fails to load.
    This means enabling PF with no rule set or with content that is syntactically
    invalid will leave the packet filter enabled with a default pass rule.


    # Setting Up PF on NetBSD


    On NetBSD 2.0, PF became available as a loadable kernel module that could be installed
    via packages (security/pfinfra) or compiled into a static kernel configuration.
    In NetBSD 3.0 and later, PF is part of the base system. On NetBSD, PF is one of
    several possible packet-filtering systems, and you need to take action to enable
    it.


    Some details of PF configuration have changed between NetBSD releases. This book
    assumes you are using NetBSD 6.0 or later.²


    To use the loadable PF module for NetBSD, add the following lines to your /etc/rc.conf
    to enable loadable kernel modules, PF, and the PF log interface, respectively.


    ```

    lkm="YES" # do load kernel modules

    pf=YES

    pflog=YES

    ```


    To load the pf/module manually and enable PF, enter this:


    ```

    $ sudo modload /usr/lkm/pf.o

    $ sudo pfctl -e

    ```


    > 2. For instructions on using PF in earlier releases, see the documentation for
    your release and look up supporting literature in Appendix A of this book.'
