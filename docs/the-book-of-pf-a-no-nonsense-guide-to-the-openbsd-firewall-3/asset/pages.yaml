- img_proc: true
  md: '# Collecting NetFlow Data with pflow(4)


    NetFlow is a network data collection and analysis method that has spawned many
    supporting tools for recording and analyzing data about TCP/IP connections. NetFlow
    originated at Cisco and over time has become an essential feature in various network
    equipment as a tool for management and analysis.


    The NetFlow data model defines a network flow as a unidirectional sequence of
    packets with source and destination IP address and protocol. As other, a TCP connection
    will appear in NetFlow data as two flows: one in each direction.


    PF data can be made available to NetFlow via pflow(4) pseudo-interface that was
    introduced in OpenBSD 4.5 along with the pflow state option. Essentially, all
    the information you''d expect to find in a NetFlow-style flow is easily derived
    from the data PF keeps in the state table, and the pflow interface offers a straightforward
    way to export PF state-table data in this processing-friendly and well-documented
    format. With other logging, you enable NetFlow data collection in your PF set
    on a per-rule basis.


    A complete NetFlow-based network-monitoring system consists of several distinct
    parts. The NetFlow data originates at one or more sensors that generate data about
    network traffic. The sensors forward the flows to a collector, which stores the
    data it receives. Finally, a reporting analysis system lets you extract and process
    the data.


    # Setting Up the NetFlow Sensor


    The NetFlow sensor requires two components: one or more configured pflow(4) devices
    and at least one pass rule in your rule set with the pflow state enabled. The
    pflow interfaces are created with two required parameters: the flow source IP
    address and flow destination''s IP address and port. Here''s an example of the
    ifconfig command for /etc/hostname.pflow:


    ```

    flowsrc 192.0.2.1 flowdst 192.0.2.105:3001

    ```


    From the command line, use this command:


    ```

    $ sudo ifconfig pflow create flowsrc 192.0.2.1 flowdst 192.0.2.105:3001

    ```


    In both cases, this command sets up the host to send NetFlow data with a flow
    source data 192.0.2.1 to a collector that will listen for NetFlow data at 192.0.2.105,
    UDP port 3001.


    > It is possible to set up several pflow devices with separate destinations. It''s
    not currently possible, however, to specify on a per-rule basis which-pflow device
    should receive the generated data.


    +   3. For a more in-depth treatment of network analysis with NetFlow-based tools,
    see NetFlow Analysis by Michael W. Lucas (No Starch Press, 2010).'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'After enabling the pflow device, specify in /etc/pf.conf which pass rules should
    provide Netflow to the sensor. For example, if your main concern is to collect
    data on your clients'' email traffic to IPv4 hosts, this would set up the necessary
    sensor:


    ```

    pass out log inet proto tcp from <client> port $email \ client-email keep state
    (pflow)

    ```


    When pf was first introduced to PF, the immediate reaction from early adopters
    was that more likely than not, they''d want to add the pflow option to pass rules
    in their rule sets. This led PF developer Henning Brauer to introduce another
    useful PF feature—the ability to set defaults that apply to all rules unless otherwise
    specified. For example, if you add the following line at the start of your rule
    set, all pass rules in the configuration will generate Netflow data to be exported
    via the pflow device.


    ```

    set-defaults pflow

    ```


    With least one pflow device configured and at least one rule in pf.conf that generates
    data for export via the pflow device, you are almost setting up the sensor. You
    may still need to add a rule, that allows the UDP data to the collector''s IP
    address you specified as the target port at the destination. Once you''ve completed
    this last step, you should be ready to turn your attention to collecting the data
    for further processing.


    # Netflow Data Collecting, Reporting, and Analysis


    If you have a Netflow-based collection and analysis infrastructure in place, you
    may have already added the necessary configuration to feed the PF-originated data
    into the data collection and analysis system. If you have not yet set up a flow-analysis
    environment, there are a number of options available.


    The OpenBSD package offers three Netflow collector and analysis packages: flow-tools,
    flowd, and nddump. All three systems have a dedicated and competent developer
    and user community as well as various add-ons, including graphical web interfaces.
    flow-tools is the main component in many sites'' flow-analysis setups. The nddump
    fans point to the ndump analysis package that integrates nddump in a powerful
    and flexible Web-based frontend that will, among others, display the command-line
    equivalent of your selections. You''ll find the line useful when you need to drill
    down further into the data selections in the GUI allow. You can copy the command
    displayed in the GUI and make any adjustments you need on the nddump command in
    a line shell or script to extract the data you want.


    +   4. The actively maintained project home pages for flow-tools and nddump are
    available at http://code.google.com/pf-tools/ and http://ndump.sourceforge.net/.
    The older versions are still available from http://www.splinter.net/sw/flow-tools/.
    The ndump Web frontend has a project page at http://www.nsen.sourceforge.net/.
    For the latest information about flowd, visit http://www.mindrot.org/flowd.html.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# CHOOSING A COLLECTOR


    The choice of collector is somewhat tied to the choice of analysis package. Perhaps
    because the collectors tend to store flow data in their own unique formats, most
    reporting and analysis backends are developed with a distinctive bias for one
    or the other.


    Regardless of your choice of Netflow collector, the familiar logging caveats apply:
    Detailed traffic log information will require significant storage. In the case
    of Netflow, each flow will generate a record of fairly fixed size, and anecdotal
    evidence that even modest collector profiles on busy sites can generate gigabytes
    of Netflow data per day. The amount of storage you''ll need is directly proportional
    to the number of connections and how long you keep the original Netflow data.
    Finally, recording and storing traffic logs with this level of detail is likely
    to have legal implications.


    Collectors generally offer filtering features that let you discard data about
    specific hosts or networks or discard some parts of the Netflow records themselves,
    either globally or for data about specific hosts.


    To illustrate some basic Netflow collection and how to extract a subset of the
    collected data for further analysis, we''ll use flowd, developed by-time OpenBSD
    developer Damien Miller and available via the package systems (OpenBSD as net/flowd
    and on FreeBSD as net-mgmt/flowd).

    I''ve chosen to use flowd mainly because it was developed to be small, simple,
    and secure. As you''ll see, flowd still manages to be useful and flexible. Flow
    data operations with other tools will differ in some details, but the underlying
    principles remain the same.


    When compared to other Netflow collector suites, flowd is very compact, with only
    two executables—the collector daemon and the flow-filtering and presentation program
    flow-reader—as well as the supporting library and controlling configuration file.
    The documentation is adequate, if a bit terse, and the sample /etc/flowd.conf
    contains a generous number of comments. Based on the main pages and the comments
    in the sample configuration file, it shouldn''t take you long to create a useful
    collector configuration.


    After stripping out any comment lines—using grep -v # /etc/flowd.conf or similar—a
    basic flowd configuration could look like this:


    ```

    "/var/log/flowd"

    listen 192.0.2.105:3001

    flow source 192.0.2.1

    ```'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'While this configuration barely contains more information than the pflow interface''s
    configuration in the earlier description of setting up the sensor, it includes
    two important items:


    +   - The logfile tells us where the collected data is to be stored (and reveals
    that flow tends to store all data in a single file).

    - The final line tells us that flow will store all fields in the data it receives
    from the designated flow source.


    With this configuration in place, start up the flow daemon, and almost immediately
    you should see the /var/log/flow file grow as network traffic passes through your
    gateway and flow records are recorded. After a while, you should be able to look
    at the data using flow''s companion program flow-reader. For example, with all
    fields stored, the data for one lookup from a host on the NATed local network
    looks like this in flow-reader''s default view:


    # ### sudo flow-reader /var/log/flow


    ```

    FLOW recv_2011-04-01T21:15:53.607179 170 tcp flags 00 tos 00 os 00 [213.187.179.198]
    src [192.0.2.1]:55108 dst [192.0.2.1]:53 packets octets 62

    FLOW recv_2011-04-01T22:15:53.607179 170 tcp flags 00 tos 00 os 00 [213.187.179.198]
    src [192.0.2.1]:55108 dst [192.0.2.254] packets octets 129

    ```


    Notice that the lookup generates two flows: one in each direction. The first identified
    by the time it was received, by the protocol used (protocol 17 is UDP, as /etc/protocols
    will tell you). The connection had both TCP and TOS flags, and the collector received
    the data from our gateway at 192.0.2.1. 192.0.2.254, source port 55108, and the
    destination address 192.0.2.1, source port 53, conventionally the DNS port. The
    flow identified of 1 packet with a payload of 62 octets. The return flow was received
    by the collector at the same time, and we see that this flow has the source and
    destination reversed, with a slightly larger payload of 129 octets. flow-reader''s
