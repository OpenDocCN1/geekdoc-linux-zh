- img_proc: true
  md: 'Some sites use overload to implement a multitied system, where hosts that trip
    one overload rule are transferred to one or more intermediate "probation" tables
    for special treatment. It can be useful in Web contexts not to block traffic from
    the overload tables outright but rather to redirect all HTTP requests from these
    hosts to specific Web pages (as in the authtpf example near the end of Chapter
    4).


    # # Tying Your Tables with pctctl


    With the overload rules from the previous section in place, you now have an adaptive
    firewall that automatically detects undesirable behavior and offenders'' IP addresses
    to tables. Watching the logs and the tables can be fun in the short run, but because
    those rules only add to tables, we run into the next challenge: keeping the content
    of the tables up-to-date and relevant.


    When you run a configuration with an adaptive rule set for a while, at some point,
    you''ll discover that an IP address of your overload blocked last week due to
    a brute-force attack was actually a dynamically assigned address, which is now
    assigned to a different ISP customer with a legitimate reason to communicate with
    hosts in your network. If your adaptive rules catch a lot of traffic on a busy
    network, you may also find that the overload tables grow over time to take up
    an increasing amount of memory.


    The solution is to *expire table entries*—to remove entries after a certain amount
    of time. In OpenBSD 4.1, pctctl acquired the ability to expire table entries based
    on the time since their statistics reset.(In all instances, this reset time is
    equal to the time the table was added.) The keyword is expire, and the table entry''s
    age is specified in seconds. Here''s an example:


    ```

    $ sudo pctctl -t expire 86400

    ```


    This command will remove entries that had their statistics more than 86,400 seconds
    (24 hours).


    > The choice of 24 hours as the expiry time is a fairly arbitrary one. You should
    choose a value that you feel is a reasonable amount of time for any problem at
    the other end to be noticed and fixed. If you have adaptive rules in place, it''s
    a good idea to set up crontab entries to run table expiry at regular intervals
    with a command like the preceding to make sure your tables are kept up-to-date.


    +   3. From a long-term perspective, it''s fairly normal for networks and larger
    ranges of IP addresses to be reassigned to new owners in response to events in
    the physical, business-oriented world.

    4. Before pctctl acquired the ability to expire table entries, table expiry was
    more likely not handled by the special-purpose utility expire. If your pctctl
    does not have the expire option, you should seriously consider upgrading to a
    newer system. If upgrading is for some reason not practical, look for expirable
    in your package system.'
