  md: '# Turning Away the Brutes


    The Secure Shell security, commonly referred to as SSH, is a fairly crucial service
    for Unix administrators. It''s frequently the main interface to the machine and
    a favorite target of script kiddie attacks.


    # SSH Brute-Force Attacks


    If you run an SSH login service that''s accessible from the Internet, you''ve
    probably seen these entries in your authentication logs:


    ```

    Sep 26 03:12:34 skapet sshd[25771]: Failed password for root from 200.72.41.31
    40992 ssh2

