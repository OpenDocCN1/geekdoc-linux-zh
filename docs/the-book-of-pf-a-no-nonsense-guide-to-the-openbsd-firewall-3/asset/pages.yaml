  md: '# Greylisting: My Admin Told Me Not to Talk to Strangers


    Greylisting consists mainly of interpreting the current SMTP standards and adding
    a little white lie to make life easier.


    Spammers tend to use other people''s equipment to send their messages, and the
    software they install without the legal owner''s permission needs to be lightweight
    in order to run undetected. Unlike legitimateers, spammers typically do not consider
    any individual message they send to be important. Taken together, this means that
    typical spam and malware sender software are not set up to interpret SMTP status
    codes correctly. This is a fact that we can use to our advantage, Evan Harris
    proposed in his 2003 paper titled "The Next Step in the Spam Control War: Greylisting."*


    As Harris noted, when a compromised machine is used to send spam, the sender application
    tends to delivery only once, without checking for any results or return codes.
    Real SMTP implementations interpret return codes and act on them, and real mail
    servers retry if the initial attempt fails with any kind of temporary error.


    In his paper, Harris outlined a practical approach:


    +   - On first SMTP contact from a previously unknown communication partner, do
    not receive email on the first delivery attempt, but instead, respond with a status
    code that indicates a temporary local problem, and store the sender IP address
    for future reference.


    +   - If the sender retries immediately, reply as before with the temporary failure
    status code.


    +   - If the sender retries after a set minimum amount of time (1 hour, for example)
    but not more than a maximum waiting period (4 hours, for example), accept the
    message for delivery and record the sender IP in your whitelist.


    This is the essence of greylisting. And fortunately, you can set up and maintain
    a greylisting on your PF-equipped gateway.


    # Setting Up spamd in Greylisting Mode


    OpenBSD''s spamd acquired its ability to greylist in OpenBSD 4.1. Beginning with
    OpenBSD 4.1, spamd runs in greylist mode by default.


    In the default greylisting mode, the spam table used for blacklisting, as described
    in the previous section, becomes superfluous. You can still use blacklists, but
    spamd will use a combination of private data structures for blacklist data and
    the spamd database to store greylisting-related data. A typical set of rules for
    spamd in default mode looks like this:


    ```

    table <spamd-white> persist

    table <nospamd> persist file "etc/mail/nospamd"

    ```


    +   - The original Harris paper and a number of other useful articles and resources
    can be found at http://www.greylisting.org/'
