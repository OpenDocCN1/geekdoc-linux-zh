- img_proc: true
  md: '# A Little IEEE 802.11 Background


    Setting up any network interface, in principle, is a two-step process: You establish
    a link, and then you move on to configuring the interface for TCP/IP traffic.


    In the case of wired Ethernet-type interfaces, establishing the link consists
    of plugging in a cable and seeing the link indicator light up. However, some interfaces
    require extra steps. Networking over dial-up connections, requires telephony steps,
    such as dialing a number to get a carrier signal.


    In the case of IEEE 802.11–wireless networks, getting the carrier signal involves
    quite a few steps at the lowest level. First, you need to select the proper channel
    in the assigned frequency spectrum. Once you find a signal, you need to set a
    few link-level network identification parameters. Finally, if the station you
    want to link uses some of link-level encryption, you need to set the correct kind
    and negotiate some additional parameters.


    Fortunately, on OpenBSD systems, all configuration of wireless network devices
    happens via ifconfig commands and options, as with any other network interface.
    While most network configuration happens via ifconfig on other BSDs, too, on some
    systems, specific features require other configuration.¹ Still, because we''re
    introducing wireless networks here, we need to look at security at various levels
    in the networking stack from this new perspective.


    There are basically three kinds of popular and simple IEEE 802.11 privacy mechanisms,
    and we''ll discuss them briefly over the next sections.


    > For more complete overview of issues surrounding security in wireless networks,
    Professor Kjell Jørgen Hole''s articles and slides at http://www.kjhole.com/ and
    http://www.nowires.org/


    # MAC Address Filtering


    The short version of the story about PF and MAC address filtering is that we don''t
    do it. A number of consumer-grade, off-the-shelf wireless access points offer
    MAC address filtering, but contrary to common belief, they don''t really add much
    security. The marketing succeeds largely because most consumers are unaware that
    it''s possible to change the MAC address of any wireless network adapter on the
    modern today².


    +   1. On some systems, the older, device-specific programs, such as control,
    are still around, but for the most part, they are deprecated and have long been
    replaced with ifconfig configuration. On OpenBSD, the consolidation into ifconfig
    has been completed.

    2. A quick map lookup on OpenBSD will tell you that the command to change the
    MAC address for the interface rum0 is simply ifconfig rum0 lladdr 00:ba:ad:fd:00:11.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'If you really want to try MAC address filtering, you could look into using
    the bridge(4) and the bridge-related rule options in ifconfig(8) on OpenBSD 4.7
    and later. We''ll look at bridges and some of the more useful ways to use them
    with packet filtering in Chapter 5. Note that you can use the bridge filtering
    without running a bridge by just adding one interface to the bridge.


    # WEP


    One consequence of using radio waves instead of wires to move data is that it''s
    comparatively easy for outsiders to capture data in transit over radio waves.
    The designers of the 802.11 family of wireless network standards seem to have
    been aware of this, and they came up with a solution that they went on market
    under the Wired Equivalent Privacy, or WEP.


    Unfortunately, the WEP designers came up with wired encryption actually relying
    upon recent research or consulting active researchers in the field. So the link-level
    encryption scheme they recommended is a pretty primitive homegrown among cryptography
    professionals. There was no great surprise when WEP was reversed-engineered and
    cracked within a few months after the first products were released.


    Even though you can download free tools to descramble WEP-encoded traffic in a
    matter of minutes, for a variety of reasons, WEP is still widely supported and
    used. Essentially, all IEEE 802.11 equipment available today has support for at
    least WEP, and a surprising number offer MAC address filtering, too.


    You should consider traffic protected only by WEP to be just more secure than
    data broadcast in the clear. Then again, the token effort needed to crack into
    a WEP network may be sufficient to deter lazy and unsophisticated attackers.


    # WPA


    It dawned on the 802.11 designers fairly quickly that their WEP system wasn''t
    quite enough when it was cracked up, so they came up with a revised and slightly
    more comprehensive solution called Wi-Fi Protected Access, or WPA.


    WPA looks better than WEP, at least on, but the specification is complicated enough
    that its widespread implementation was delayed. In addition, WPA has attracted
    its share of criticism over design issues and bugs that have occasional interoperability
    problems. Combined with the familiar issues of access to documentation and hardware,
    free software varies. Most free systems have WPA support, and even though you
    may find that it''s not available for all devices, the situation has improving
    over time. If your project specification includes WPA, look carefully at your
    operating system and driver documentation.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'And, of course, it goes almost without saying that you''ll need further security
    measures, such as SSH or SSL encryption, to maintain any significant level of
    confidentiality for your data stream.


    # The Right Hardware for the Task


    Picking the right hardware is not necessarily a daunting task. On a BSD system,
    the following simple command is all you need to enter to see a listing of all
    manual pages with the word *wireless* in their subject lines.


    # apropos wireless


    Even on a freshly installed system, this command will give you a complete list
    of all network drivers available in the operating system.

    The next step is to read the driver manual pages and compare the lists of compatible
    devices with what is as parts or built into the systems you''re considering. Take
    some time to think through your specific requirements. For test purposes, low-end
    run or USB dongles (the newer atun) will also be quite convenient. Later, when
    you''re about to build a more permanent infrastructure, you may want to look into
    higher-end gear, although you may find that the inexpensive test gear works fine
    for reasons that cannot be distributed on the OpenBSD install. The *fw_update*
    script will be able to fetch the required firmware on first boot after a successful
    install, as long as a network connection is available. If you install the units
    in an already configured system, you can try running *fw_update* manually. You
    may also want to read Appendix B of this book for some further discussion.


    # Setting Up a Simple Wireless Network


    For our first network, it makes sense to use the basic gateway configuration from
    the previous chapter as our starting point. In your design, it''s likely that
    the wireless network isn''t directly attached to the Internet at all that the
    wireless network will require a gateway of some sort. For that reason, it makes
    sense to reuse the working gateway setup for this wireless access point, with
    some modifications introduced over the next few paragraphs. After all, doing so
    is more convenient than starting a new configuration from scratch.


    > We''re in infrastructure-building mode here, and we''ll be setting up the access
    point first. If you prefer to look at the client setup first, see "The Client
    Side" on page 35.


    The first step is to make sure you have a supported card and check that the driver
    loads and initializes the card properly. The boot-time system messages scroll
    by the console, but they''re also recorded in the file


    +   1. In addition, it''s possible to look up man pages on the Web. Check http://www.openbsd.org/
    and the other project websites. They offer keyword-based man page searching.'
  merge: -1
