    udp_services = "{ domain, ntp }"

    pass log (all) inet proto udp to port $udp_services

    ```


    With these rules in place, here''s an example of what happens when a Russian name
    server sends a name request to our network:


    +   $ sudo tcpcdump -lttfi pf0 port domain

    tcpdump: WARNING: snaplen raised from 16 to 160

    tcpdump: listening on pf0, link-type PFLOG

    Sep 30 24:27:41.260190 212.5.66.14.53 > 194.54.107.19.53: [domain]

    Sep 30 24:27:41.260253 212.5.66.14.53 > 194.54.107.19.53: [domain]

    Sep 30 24:27:41.260267 212.5.66.14.53 > 194.54.107.19.53: [domain]

    Sep 30 24:27:41.260368 194.54.107.19.53 > 212.5.66.14.53: [domain]

    Sep 30 24:27:41.260797 194.54.107.19.53 > 212.5.66.14.53: [domain]

    Sep 30 24:27:41.260923 194.54.107.19.53 > 212.5.66.14.53: [domain]


    We have six entries instead of just one.

    Even with all port domain filtered out by tcpcdump, adding log (all) to one or
    more rules considerably increases the amount of data in your logs. If you need
    to log all traffic but your gateway''s storage capacity is limited, you may find
    yourself shopping for additional storage, and the added I/O activity in fact have
    a negative impact on performance. Also, recording and storing traffic logs with
    this level of detail is likely to have legal implications.


    # LOG RESPONSIBLY!


    Creating logs of any kind could have surprising consequences, including some legal
    implications. Once you start log data generated by your network traffic, you are
    creating a store of information about your users. There may be good technical
    and business reasons to store logs for extended periods, but logging just enough
    data and storing it for the right amount of time can be a fine.

    You probably have some idea of the practical issues related to generating log
    data, such as arranging for sufficient storage to retain enough log data long
    enough to be useful. The legal implications vary according to your location. Some
    countries and territories have specific requirements for handling log data, along
    with restrictions on how that data may be used and how long logs can be retained.
    Others require service providers to retain traffic logs for a specific period
    of time, in some cases with a requirement to deliver any data to law enforcement
    upon request. Make sure you understand the legal issues before you build a logging
    infrastructure.'
