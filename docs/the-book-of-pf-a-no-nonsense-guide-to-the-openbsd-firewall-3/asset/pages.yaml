  md: '# # 4

    # WIRELESS NETWORKS MADE EASY


    ![](img/838f49667801fd8460438797800410dd_68_0.png)


    It’s rather tempting to say that on BSD—and OpenBSD, in particular—there’s no
    need to “make wireless networking easy” because it already is. Getting a wireless
    networking isn''t very different from getting a wired one up and running, but
    there are some issues that turn up simply because we''re dealing with radio waves
    and not wires. We’ll look briefly at some of the issues before moving on to the
    practical steps involved in creating a usable setup.


    Once we have covered the basics of getting a wireless network up and running,
    we’ll turn to some of the options for making your wireless network more interesting
    and harder to break.'
  merge: -1
