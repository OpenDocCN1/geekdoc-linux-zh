  md: 'focus on some techniques based on pure network-level behavior, which are most
    evident in the example configurations in Chapter 6. These techniques will help
    ease the load on content-inspecting packets if you have them in place. As you''ll
    see in the following chapters, the network offers a lot of fun and excitement,
    in addition to the blocking or passing packets.


    # Where the Packet Filter Fits In


    The packet filter''s main function is, as the name suggests, to filter network
    packets by matching the properties of individual packets and the network connections
    built from those packets against the filtering criteria defined in its configuration
    files. The packet filter is responsible for deciding what to do with these packets.
    This could mean passing them through or rejecting them, or could triggering events
    that other parts of the operating system or external applications are set to handle.


    PF lets you custom filtering criteria to control network traffic based on any
    packet or connection property, including address family, source and destination
    address, interface, protocol, and direction. Based on these criteria, the packet
    filter performs the action you specify. One of the simplest and most common actions
    is to block traffic.


    A packet filter can keep unwanted traffic out of your network. It can also contain
    network traffic inside your own network. These functions are important to the
    firewall concept, but blocking is from the only useful or interesting feature
    of a functional packet filter. As you see in this book, you can use filtering
    criteria to direct certain kinds of traffic to specific hosts, assign classes
    of traffic to queues, perform traffic shaping, and even hand off selected kinds
    of traffic to other software for special treatment.


    All this happens at the network level, based on packet and connection properties.
    PF is part of the network stack, family embedded in the operating system kernel.
    While there are examples of packet filtering implemented in user space, most operating
    systems, the filtering functions are performed in the kernel because it''s faster
    to do so.


    # The Rise of PF


    If you have a taste for history, you probably already know that OpenBSD and the
    other BSDs are direct descendants of the BSD system (sometimes referred to as
    BSD Unix), the operating system that contained the original reference implementation
    of the TCP/IP Internet protocols in the early 1980s.


    > If BSD doesn''t sound familiar, here is a short explanation: The acronym expands
    to Software Distribution and originally referred to a collection of useful software
    developed for the Unix operating system by staff and students at the University
    of California, Berkeley. Over time, the collection expanded into a complete operating
    system, which in turn became the forerunner of a family of systems, including
    OpenBSD, FreeBSD, NetBSD, and by some definitions, Apple''s Mac OS X. For a very
    readable explanation of what BSD is, see Greg Lechinsky’s “Explaining BSD” at
    http://www.freebsd.org/doc/en/articles/explaining-bsd/(and, of course, the projects''
    websites).'
