    to 1,440 bytes.


    Other variations are possible, and even though the list of scrub options shrunk
    somewhat for the OpenBSD 4.6 version, you should be able to cater to specific
    needs by consulting the man pages and doing some experimentation. For most setups,
    a global match rule like the one earlier is appropriate, but keep in mind that
    you can vary scrub options on a per-rule basis if needed.


    If you find yourself needing to debug a scrub-related problem, study the pf.conf
    man page and consult the gurus on the relevant mailing lists.


    # Protecting Against Spoofing with antisof


    Some very useful and common packet-handling actions could be written as PF rules,
    but without becoming long, complicated, and error-prone rule boilerplate. Thus,
    antisof was implemented for a common special case of filtering and blocking. This
    mechanism protects against spoofed or forged IP addresses, by blocking packets
    that appear traveling in directions that aren''t logically possible.


    With antisof, you can specify that you want to weed out spoofed traffic from the
    rest of the world as well as any spoofed packets that might originate in your
    own network. Figure 10-1 illustrates the concept.


    ![](img/838f49667801fd8460438797800410dd_217_0.png)


    ![](img/838f49667801fd8460438797800410dd_217_1.png)


    ```

    src: 192.168.12.23

    dst: 192.0.2.19:25

    Data-data-data-data

    ```


    ```

    src: 192.168.12.23

    dst: 192.0.2.19:25

    Data-data-data-data

    ```


    ![](img/838f49667801fd8460438797800410dd_217_2.png)


    ![](img/838f49667801fd8460438797800410dd_217_3.png)


    ![](img/838f49667801fd8460438797800410dd_217_4.png)


    Figure 10-1: antisof drops packets that come from the wrong network.'
