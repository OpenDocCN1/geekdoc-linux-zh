- img_proc: true
  md: 'Both proprietary and open source network management and monitoring systems
    generally have SNMP support in one form or the other, and in some products, it''s
    a core feature. The BSDs, SNMP support has generally come in the form of the net-snmp
    package, which provides the tools you need to retrieve SNMP data and collect data
    for retrieval management systems. The package is available on OpenBSD as net/net-snmp,
    and on NetBSD as net/net-snmp. OpenBSD''s snmpd (written mainly by Reyk Floeter)
    in OpenBSD 4.3 and implements all required SNMP functionality. (See man snmp and
    man snmp.conf for details.)


    There are MIBs to make PF data available to SNMP monitoring. Joel Knight maintains
    the MIBs for retrieving data on PF, CARP, and OpenBSD for download from http://www.packetmischief.ca/opensbd/snmp/.
    The site also offers patches to the net-snmp package to integrate the OpenBSD
    MIBs.


    After installing the package and the extension, your SNMP-capable monitoring systems
    will be able to watch PF data in any detail you desire. (FreeBSD''s snmpd includes
    a PF module. See the bsnmpd man page for details.)


    # Log Data as the Basis for Effective Debugging


    In this chapter, we walked through the basics of collecting, displaying, and interpreting
    data about a running system with PF enabled. Knowing how to find and use information
    about how your system behaves is useful for several purposes.


    Keeping track of the status of a running system is useful in itself, but the ability
    to read and interpret log data is even more essential when testing your setup.
    Another prime for log data is to track the effect of changes you make in the configuration,
    such as when tuning your system to give optimal performance. In the next chapter,
    we''ll focus on checking your configuration and tuning it for optimal performance,
    based on log data and other observations.'
