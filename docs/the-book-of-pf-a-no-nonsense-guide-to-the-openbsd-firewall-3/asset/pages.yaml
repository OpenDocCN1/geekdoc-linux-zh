  md: '# That Sad FTP Thing


    The short list of real-life TCP ports we looked at a few moments back contained,
    among other things, FTP, the classic file transfer protocol. FTP is a relic of
    the Early Internet, when experiments were not and security was not really on the
    horizon in any modern sense. FTP actually prefers TCP/IP, and it''s possible to
    track the protocol''s development through more than 50 RFCs. After more than 30
    years, FTP is both a sad old thing and a problem child—emphatically so for anyone
    trying to combine FTP and firewalls. FTP is an old and weird protocol with a lost
    dictate. Here are the common points against it:


    +   * Passwords are transferred in the clear.

    * The protocol demands the use of at least two TCP connections (control and data)
    on separate ports.

    * When a session is established, data is communicated via ports usually selected
    at random.


    All of these points make for challenges security-wise, even considering potential
    weaknesses in client or server software that may lead to security issues. As any
    network graveyard will tell, these things tend to crop when you need them least.


    Under any circumstances, even more modern and more secure options for file transfer
    exist, such as SFTP and SCP, which feature both authentication and data transfer
    via encrypted connections. Competent IT professionals should have a preference
    for some form of file transfer other than FTP.


    Regardless of our professionalism and preferences, we sometimes would prefer not
    to use at all. In the case of FTP through firewalls, we can combat problems by
    redirecting the traffic to a small program that''s written specifically for this
    purpose. The upside is that handling FTP offers us a chance to utilize two finely
    advanced PF features: redirection and anchors.


    The easiest way to handle FTP in a default-block scenario as ours is to have PF
    redirect the traffic to that service to an external application that acts as a
    proxy for the service. The proxy maintains its own named sub-rule (an anchor in
    PF terminology), where it inserts or deletes rules needed for the FTP traffic.
    The combination of redirection and the anchor provides a clean, well-defined interface
    between the packet-filtering system and the proxy.


    +   5. The earliest RFC describing the FTP protocol is RFC 114, dated April 10,
    1971. The switch to TCP/IP happened with FTP version 5, as defined in RFCs 765
    and 775, dated June and December 1980, respectively.

    6. An encrypted version of the protocol, dubbed FTPS, is specified in RFC4217,
    but support remains somewhat spotty.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# If We Must: ftp-proxy with Divert or Redirect


    Enabling FTP transfers through your gateway is amazingly simple, thanks to the
    FTP-proxy program included in the OpenBSD base system. The-program is called—you
    guessed it—ftp-proxy.


    To enable ftp-proxy, you need to add this line to your /etc/rc.conf.local file
    on OpenBSD:


    ```

    ftpproxy_flags=""

    ```


    On FreeBSD, /etc/rc.conf needs to contain at least the first of these two lines:


    ```

    ftpproxy_enable="YES"

    ftproxy_flags="" # and put any command line options here

    ```


    If you need to specify any command-line options to ftp-proxy, you put them in
    the ftpproxy_flags variable.

    You can start the proxy manually by running /usr/sbin/ftp-proxy if you like (or
    even better, use the /etc/rc.conf-proxy script with the start option on OpenBSD),
    and you may want to do this in order to check that the changes to the PF configuration
    make sure you have the intended effect.


    For a basic configuration, you need to add only three elements to your /etc/pf.conf:
    the anchor and two pass rules. The anchor declaration looks like:


    ```

    anchor "ftp-proxy/*"

    ```


    In-OpenBSD 4.7 versions, two anchor declarations were needed:


    ```

    nat-anchor "ftp-proxy/*"

    dr-anchor "ftp-proxy/*"

    ```


    The proxy will insert the rules it generates for the FTP sessions. Then, you also
    need a pass cto to let ftp traffic into the proxy:


    ```

    pass in quick inet proto tcp to port ftp divert-to 127.0.0.1 port 8021

    ```


    The divert-to redirects the traffic to the local port, where the proxy listens
    via the highly efficient, connections-only divert(4) interface. In OpenBSD versions
    4.9 and older, the traffic diversion happened via rdr-to. If you are upgrading
    an existing pre-OpenBSD 5.0 configuration, you''ll need to update your rdr-rules
    for the FTP proxy to use-divert-to-invert.


    If your operating system uses a pre-OpenBSD 4.7 PF version, this version of the
    redirection will


    ```

    rdr pass on $if_inet proto tcp tcm from any port ftp -> 127.0.0.1 port 8021

    ```'
