- img_proc: true
  md: '+   You should be aware that BSDs, the configuration is /etc/rc.conf-centric.
    In general, the BSDs are organized to read the configuration from the file /etc/rc.conf,
    which is read by the /etc/rc script at startup. OpenBSD recommends using /etc/rc.conf.local
    for local customizations because rc.conf contains the default values. FreeBSD
    uses /etc/defaults/rc.conf to store the default settings, /etc/rc.conf the correct
    place to make changes. In addition, OpenBSD uses per-interface configuration files
    called hostname.<if>, where <if> is replaced with the interface name.\ For the
    purpose of learning PF, you''ll need to concentrate on /etc/pf.conf file, which
    will be your own creation.


    If you need a broader and more thorough introduction to your BSD of choice, like
    the operating system''s documentation, including FAQs and guides, at the project''s
    website. You can also find some suggestions for further reading in Appendix A.


    # Frequently Answered Questions About PF


    This section is based on questions I have been asked via email or at meetings
    and conferences as well as those that have popped up in mailing lists and other
    discussion forums. Some of the more common questions are covered in a FAQ-style”
    format.


    # Can I run PF on my Linux machine?


    In a word, Over the years, announcements have appeared on the PF mailing list
    from someone claiming to have started a Linux port of PF, but at the time of this
    writing, no one has yet claimed to have completed the task. The main reason for
    this is probably that PF is developed as a deeply integrated part of the OpenBSD
    networking stack. The OpenBSD code still shares enough fundamentals with the other
    BSDs to make porting possible, but porting PF to a non-BSD system would require
    rewriting large chunks of PF itself as whatever integration is needed at the target
    side.


    For basic orientation tips for Linux users to find their way in BSD network configurations,
    see “Pointers for Linux Users” on page 6.


    # Can you recommend a GUI tool for managing my PF rule set?


    This book is mainly oriented towards users who edit their rules in their text
    editor. The sample rule sets in this book are simple enough that you probably
    wouldn''t get a noticeable benefit from any of the visualization options the GUI
    tools are known to offer.


    A common claim is that the PF configuration files are generally readable enough
    that a graphical visualization tool isn''t really necessary. There are, however,
    several GUI tools available that can edit and/generate PF


    +   8. The three-letter abbreviation FAQ expands to either frequently asked questions
    or answered questions—both equally valid.'
