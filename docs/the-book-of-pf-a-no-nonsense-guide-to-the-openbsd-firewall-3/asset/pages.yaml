    # Filtering on Interface Groups


    Your network could have subnets that may never need to interact with your local
    network except for some common services, like email, Web, file, and print. How
    you handle the traffic from to such subnets depends on how your network is designed.
    One useful approach is to treat eachprivileged network as a separate local network
    attached to its own interface on a common filtering gateway and give it a rule
    set that allows only the desired direct interaction with the neighboring attached
    to the main gateway.


    You can make your PF configuration more manageable and readable by grouping similar
    interfaces into interface groups and by filtering rules to the groups rather than
    the individual interfaces. Interface groups, implemented via the ifconfig group
    option, originally appeared in OpenBSD 3.6 and have been adopted in FreeBSD 7.0
    onward.


    All configured network interfaces can be belonged to one or more groups. Some
    interfaces automatically belong to one of the default groups. For example, all
    IEEE 802.11 network interfaces belong to the wan group, interfaces associated
    with the default routes belong to the egress group. Fortunately, an interface
    can be a member of several groups, and you can add interfaces to interface groups
    via the appropriate ifconfig command, as in this example:


    ```

    # ifconfig sis2 group untrusted

    ```


    For a permanent configuration, the equivalent under OpenBSD would be in the hostname.sis2
    file or the ifconfig_sis2= line in the re.conf file on FreeBSD 7.0 or later.'
