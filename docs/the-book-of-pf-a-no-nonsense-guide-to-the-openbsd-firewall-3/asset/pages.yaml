  md: "queue_dns bandwidth 3% priority 7 qlimit 100 hsc (realtime 30Kb 1200), \nlinkshare\
    \ 3%)\nqueue spend bandwidth 0% priority 0 qlimit 300 hsc (realtime, upperlimit\
    \ 1%, \nlinkshare 1%)\n\nThe hsc queue definitions take slightly different parameters\
    \ than the simpler disciplines. We start off with this rather small hierarchy\
    \ by splitting the top-level queue into two. At the next level, we subdivide the\
    \ main queue into several subqueues, each with a defined priority. All the subqueues\
    \ have a realtime value set-guaranteed minimum bandwidth allocated to the queue.\
    \ The upper limit sets a hard upper limit on the queue's allocation. The linkshare\
    \ parameter sets the allocation the queue will have available when it is backlogged—that\
    \ is, when it's started to eat into its qlimit allocation.\n\nIn case of congestion,\
    \ each queue by default has a pool of 50 slots, the queue limit (qlimit), to keep\
    \ packets around when they can't be transmitted immediately. In this example,\
    \ the top-level queues main and spam both larger-than-default pools by their qlimit\
    \ setting: 100 for main and 300 for spam. Spanning queue sizes here means we're\
    \ a little less likely to drop packets when the traffic approaches the set limits,\
    \ but it also means that the traffic kicks in, we will see increased latency for\
    \ connections that end up in larger than default pools.\n\nThe queue hierarchy\
    \ uses two familiar tricks to make efficient use of available bandwidth:\n\n+\
