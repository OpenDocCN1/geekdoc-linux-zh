- img_proc: true
  md: 'Labels to more identify rules for processing specific kinds of traffic; they
    also make it easier to extract the traffic statistics. By attachinglabels to rules,
    you can store certain extra data about parts of your rule set. For example, you
    could use labeling to measure bandwidth use for accounting purposes.


    In the following example, we attach the labels mail-in and mail-out to our pass
    rules for incoming and outgoing mail-out, respectively.


    ```

    pass log proto { tcp, udp } to @emailserver proto smtp label "mail-in"

    pass log proto { tcp, udp } from @emailserver proto smtp label "mail-out"

    ```


    You''ve used the rule with labels, check the data using pfctl -vsl:


    ```

    $ sudo pfctl -vsl

    mail-in 1664158 1601986 76372591 887895 68242415 714091 81335176

    mail-out 2814933 492510664 1407278 23977627 1303933 252734397

    ```


    This output contains the following information:


    +   * The label

    * The number of times the rule has been executed

    * The total number of packets passed

    * The total number of bytes passed

    * The number of packets passed in

    * The number of bytes passed in

    * The number of packets passed out

    * The number of bytes passed out


    The format of this list makes it very well suited for parsing by scripts and applications.

    Labels accumulate data from the time the rule set is loaded until their counters
    are reset. And, in many contexts, it makes sense to set up a cron job that reads
    label values at fixed intervals and then those values into permanent storage.

    If you choose to run the data collector at fixed intervals, collecting the data
    using pfctl -vsl -z. The option resets the counters once pfctl has read them,
    with the result that your data collector will fetch periodic data, accumulated
    since the command or the last run.


    Rules with macros and lists expand to several distinct rules. If your rule contains
    with lists and macros that have a label attached, the in-memory result will be
    a number of rules, each with a separate, identically named label attached to it.
    While this may lead to confusing pfctl -vsl output, it shouldn''t be a problem
    as long as the application or script that receives the data can interpret the
    data correctly by adding up the totals for the identical labels.'
