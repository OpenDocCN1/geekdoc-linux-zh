  md: 'In the next section, we''ll look at some options for segregating the services
    that need to interact with the world at large from the local network.


    # A Degree of Separation: Introducing the DMZ


    In the previous section, you saw how to set up services on your local network
    and make them selectively available to the outside world through a sensible PF
    rule. For more fine-grained control over access to your internal network, as well
    as the services you need to make it visible to the rest of the world, add a degree
    of physical separation. Even a separate virtual area network (VLAN) will do nicely.


    Achieving the physical and logical separation is fairly easy: Simply move the
    machines that run the public services to a separate network''s attached to a separate
    interface on the gateway. The net effect is a separate network that isn''t quite
    part of your local network but isn''t entirely in the public part of the Internet
    ether. Conceptually, the segregated network looks like Figure 5-2.


    Our gateway,

    PF firewall


    ![](img/838f49667801fd8460438797800410dd_93_0.png)


    $ext_if

    192.0.2/24

    2001:db8::1


    $dmz_if

    192.0.2.128/25

    2001:db8::aad:f00d:1


    $emailserver

    192.0.2.225

    2001:db8::aad:f00d:f17


    $webserver

    192.0.2.227

    2001:db8::aad:f00d:f17


    $nameserver

    192.0.2.221

    2001:db8::aad:f00d:fbaa


    Figure 5-2: A network with the servers in a DMZ


    Think of this little network as a zone of relative calm between the territories
    of hostile factions. It''s no great surprise that a few years back, someone coined
    the phrase demilitarized zone (DMZ) to describe this type of configuration.'
  merge: -1
  pgno: 93
- img_proc: true
  md: "For address allocation, you can segment off an appropriately sized chunk of\
    \ your official address space for the DMZ network. Alternatively, you can move\
    \ parts of your network that do not have a specific need to run with publicly\
    \ accessible and routable IPv4 addresses into a NAT environment. Either way, you\
    \ end up with at least one interface in your filtering configuration. As you'll\
    \ see later, if you're really short of official IPv4 addresses, it's possible\
    \ to run a DMZ setup in all-NAT environments as well.\n\nThe adjustments to the\
    \ rule set itself don't need to be extensive. If necessary, you can change the\
    \ configuration for each interface. The basic rule remains, but you may need to\
    \ adjust the definitions of the macros (webserver, mailserver, nameservers, and\
    \ possibly others) to reflect your network layout.\n\nIn our example, we could\
    \ choose to segment part of our address ranges where we leave some room for growth,\
    \ we can set the IPv4 range for the new dmz_if on a /25 subnet with a network\
    \ address and mask of 192.0.2.128/255.255.255.128. This leaves us with 192.0.2.129\
    \ through 192.0.2.254 as the usable address range for hosts in the DMZ. As we've\
    \ already placed our servers in the 2001:db8::ba000::/112 network (with nearly\
    \ 65,536 addresses to play), the easiest way forward for the IPv6 range is to\
    \ segment off that network, too, and assign the interfacing facing the network\
    \ an appropriate IPv6 address, like the one in 5-2.\n\nWith that configuration\
    \ and no changes in the IP addresses assigned to the servers, you won't need to\
    \ touch the rule set at all the packet filtering after setting up a physically\
    \ segregated DMZ. That's a side effect, which could be due to either laziness\
    \ or excellent long-range planning. Either way, it underlines the importance of\
    \ having a sensible address-allocation policy in place.\n\nIt might be useful\
    \ to tighten up your rule set by editing your pass rules so the traffic to and\
    \ from your servers is allowed to pass only on the interfaces that are actually\
    \ relevant to the services:\n\n```\npass in $ext_if proto {tcp, udp } to $nameservers\
    \ domain\npass in $int_if proto {tcp, udp } from $localhost to $nameservers \\\
    \n  domain\npass out $dmz_if proto {tcp, udp } to $nameservers domain\npass out\
    \ $ext_if proto tcp to $webserver $webports\npass in $int_if proto tcp from $localhost\
    \ to $webserver $webports\npass out $dmz_if proto tcp to $webserver $webports\n\
    pass in log $ext_if proto tcp to $mailserver smtp\npass in log $int_if proto tcp\
    \ from $localhost to $mailserver \\\n  port\npass out $dmz_if proto tcp to $mailserver\
    \ smtp\npass in $dmz_if from $mailserver to port smtp\npass out $ext_if proto\
    \ tcp from $mailserver to port smtp\n```\n\nYou could choose to make the other\
    \ pass rules reflect your local network interface-specific, too, but if you leave\
    \ them intact, they'll continue to work."
  merge: -1
