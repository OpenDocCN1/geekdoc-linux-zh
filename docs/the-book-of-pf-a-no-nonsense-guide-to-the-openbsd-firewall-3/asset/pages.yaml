  md: 'can get at your network resources. This belief is closely related to the idea
    that the IP address of your firewall in the local network must be either 192.168.0.1
    or 10.0.0.1.


    There''s an element of truth in both notions, and those addresses are common defaults.
    But the real story is that it''s possible to sniff one''s way past address translation,
    although PF offers some tricks that make that harder.


    The real reason we use a specific set of internal address ranges and a different
    set of addresses for unique external address ranges is primarily to address security
    concerns. Rather, it''s the easiest way to work around a design problem in the
    Internet protocols: a limited range of possible addresses.


    In the 1980s, when the Internet (or ARPANET, as was known at the time) were large
    machines with anything from dozen to several thousand users each. At the time,
    a 32-bit address space with more than four billion seemed quite sufficient, but
    several factors conspired to prove that assumption wrong. One factor is that the
    address-allocation process led to a situation where the largest chunks of the
    available address space were already allocated before some of the world''s most
    populous nations connected to the Internet. The other, and perhaps more significant,
    factor was that by the early 1990s, it was no longer a research project, but rather
    a commercially available resource with consumers and companies of all sizes consuming
    IP address at an alarming rate.


    The long-term solution was to redefine the Internet to use a large address space.
    In 1998, the specification for IPv6 with 128 bits of address space for a total
    of $2^{128}$ addresses, was published as RFC 2460. While we were waiting for IPv6
    to become generally available, we needed a stopgap solution. That solution came
    as a series of RFCs that specified how a gateway could forward traffic with IP
    addresses translated so that a large local network would look just like one computer
    to the rest of the Internet. Certain previously unallocated IP address ranges
    were set aside for these private networks. Were free for use, on condition that
    traffic in those ranges wouldn''t be allowed on the Internet untranslated. Thus,
    network address translation (NAT) was born in the mid-1990s and quickly became
    the default to handle addressing in local networks.


    PF supports IPv6 as well as the previous IPv4 address translation tricks. In (fact,
    BSDs were among the earliest IPv6 adopters, thanks to the efforts of the KAME
    project.) All systems that PF can support both the IPv4 and IPv6 families. If
    your IPv4 network needs NAT


