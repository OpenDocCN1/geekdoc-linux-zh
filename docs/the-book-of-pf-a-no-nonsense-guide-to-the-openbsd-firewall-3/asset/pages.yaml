- img_proc: true
  md: 'configurations, including a complete, customized build of FreeBSD called pfSense
    (http://www.pfsense.org/), which includes a sophisticated GUI rule editor.


    I recommend that you work through the parts of this book to apply to your situation
    and then decide whether you need to use a GUI tool to feel comfortable and maintaining
    the systems you build.


    # Is there a tool I can use to convert my OtherProduct® setup to a PF configuration?


    The best strategy when converting network setups, including firewall setups, from
    one product to another is to go back to the specifications or policies for your
    network or firewall configuration and then implement the policies using the new
    tool.


    Other products will inevitably have a slightly different feature set, and the
    existing configuration you created for OtherProduct® is likely to mirror slightly
    different approaches to specific problems, which do not map easily, or at all,
    to features in PF and related tools.


    Having a documented policy, and taking care to update it will make your life easier.
    This documentation should contain a complete specification of what your setup
    is to achieve. (You might start out by putting comments in your configuration
    file to explain the purpose of yours.) This makes it possible to verify whether
    the configuration you''re running implements the design goals. In some cases,
    there may be a formal for a written policy. the impulse to look for a way to automate
    your conversion is quite understandable and perhaps expected in a system administrator.
    I urge you to resist the impulse and perform your conversion after evaluating
    your business and technical needs (preferably) after creating or updating a formal
    specification or policy in the process.


    Some of the GUI tools serve as administration frontends claim the ability to be
    used as conversion tools. However, this has the effect of inserting another layer
    of abstraction between you and your rule set, and it puts you at the mercy of
    the tool author''s understanding of how PF rules set work. I recommend working
    through at least the relevant parts of this book before spending serious time
    on considering an automated conversion.


    I heard PF is based on IPFilter, which I know from working with Solaris. Can I
    just copy my IPFilter configuration across and have a working setup away?


    If people claim that PF is "based on" IPFilter, they are saying something that
    isn''t true. PF was written from scratch to be a replacement for the newly deleted
    IPFilter code. For first version of PF, one of the design goals was to keep the
    syntax fairly compatible with the older software so the transition to OpenBSD
    3.0 would be as painless as possible and not break setups too badly or in unpredictable
    ways.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'However, a version or two down the road, it was reasonable to believe that
    no OpenBSD users were still likely to upgrade from a version that contained OpenFilter,
    staying compatible with the older system fell off the list of priorities. Some
    syntax similarities remain, even after 25 OpenBSD releases and more than 12 years
    of development. Trying to load one system configuration on the other—for example,
    copying across an IPFilter configuration to an OpenBSD system and trying to copy
    it or copying a PF configuration to a Solaris system and trying to load it as
    an IPFilter configuration—is guaranteed to fail in all cases, except for a few
    specially crafted but still quite trivial and, in fact, useless configurations.


    # Why did the PF rule syntax change all of a sudden?


    The world changed, and PF changed with it. More specifically, the OpenBSD developers
    were a very active and pragmatically critical relationship to the code, and all
    parts of OpenBSD, the PF code is under constant review.


    The lessons learned over more than a decade of PF development led to internal
    changes in the code that eventually made it clear to the developers that changing
    the syntax would make sense. The changes would make the PF syntax more consistent
    and make life easier for users in the long run at the price of edits of configuration
    files. The result for you, the user, is that PF is now easier to use and it performs
    better than the earlier versions. If you''re upgrading your system to OpenBSD
    4.7 or newer, you''re in a real treat.


    And with OpenBSD 5.5, you''ll find another good reason to upgrade: the new queuing
    system for traffic shaping, which is intended to replace the venerable ALTQ system.
    ALTQ is still part of OpenBSD 5.5, although in slightly modified form, but it
    has already been removed from the OpenBSD kernel in time for the OpenBSD 5.6 release.
    Chapter 7 contains a section about migrating to the new traffic-shaping system.


    # Where can I find out more?


    There are several sources of information about PF and the systems on which it
    runs. You''ve already found one in this book. You can find references to a number
    of printed and online resources in Appendix A.


    If you have a BSD system with PF installed, consult the online manual, or man
    pages, for information about your exact release of the software. Unless otherwise
    indicated, the information in this book refers to the world as it looks from the
    command line on OpenBSD 5.5 system.


    # A Little Encouragement: A PF Haiku


    If you''re not convinced yet, or even if you are, a little encouragement may be
    in order. Over the years, a good many people have said and written their bit about
    PF—sometimes odd, sometimes wonderful, and sometimes downright strange.'
  merge: -1
