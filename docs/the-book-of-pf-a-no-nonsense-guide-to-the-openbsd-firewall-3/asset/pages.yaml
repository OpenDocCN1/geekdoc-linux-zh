- img_proc: true
  md: 'fragment option. The default is set reassemble on, which means that fragments
    are reassembled and that reassembled packets in which the do-not-bit was set on
    individual fragments will have the bit cleared.


    # Cleaning Up Your Traffic


    The next two features we''ll discuss, scrub and antispoof, share a common theme:
    They provide automated protection against potentially dangerous cluster in your
    network traffic. Together, they are commonly referred to as tools "network hygiene"
    because they sanitize your networking considerably.


    # Packet Normalization with scrub: OpenBSD 4.5 and Earlier


    In PF versions up to and including OpenBSD 4.5, the scrub key enables network
    traffic normalization. With scrub, fragmented packets are reassembled—and invalid
    fragments—are discarded, so the resulting packet is complete and unambiguous.


    Enabling scrub provides a measure of protection against certain kinds of attacks
    based on incorrect handling of packet fragments. A number of supplementing options
    are available, but the simplest form is for most configurations:


    scrub in


    In order for certain services to work with scrub, specific options must be set.
    For example, some NFS implementations won''t work with scrub unless you use the
    no-df parameter to clear the do-not-fragment bit on any packets that have the
    bit set. Certain combinations of services, operating systems, and work configurations
    may require more of the exotic scrub options.


    # Packet Normalization with scrub: OpenBSD 4.6 Onward


    In OpenBSD 4.6, scrub was demoted from stand-alone rule to become an action you
    could attach to pass match rules (the introduction of match rules being one of
    the new PF features in OpenBSD 4.6). One other important development in the same
    rewrite of scrub code is that the numerous packet-reassembly options were eliminated
    in favor of the new reassemble option, which simply resembles on or off.


    With the new scrub syntax, you need to supply at least one option in parentheses.
    The following works quite well for several networks in my care:


    ```

    match in all scrub (no-df max-mss 1440)

    ```


    +   2. Some notable attack techniques, including several historical denial-of-service
    setups, have exploited bugs in fragment handling that could lead to out-of-memory
    conditions or other resource exhaustion. One exploit, which aimed at Cisco''s
    PIX firewall series, is described in the advisory at http://www.cisco.com/en/us/products/products_security_advisory0918a600801e78d.html.'
