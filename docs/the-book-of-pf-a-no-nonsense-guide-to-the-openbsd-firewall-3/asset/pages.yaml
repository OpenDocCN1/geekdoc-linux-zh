    Reload your PF configuration:


    ```

    $ sudo pfctl -f /etc/pf.conf

    ```


    Before you know it, your users will thank you for making FTP work.


    # Variations on the ftp-proxy Setup


    The preceding example covers a basic setup where the clients in your local network
    need to contact FTP servers elsewhere. This configuration should work well with
    most combinations of FTP clients and servers.


    You can change the proxy''s behavior in various ways by adding options to the
    $ftp_proxy_flags= line. You may bump into clients or servers with specific quirks
    that you must compensate for in your configuration, or you may want to integrate
    the proxy in your setup in specific ways, such as assigning FTP traffic to a specific
    queue. These and other finer points of $ftp-proxy configuration, your best bet
    is to spend studying the man page.


    If you''re interested in ways to run an FTP server by PF and ftp-proxy, you could
    look into running a separate ftp-proxy in reverse mode (using the -R option) on
    a separate port with its redirecting rule. It''s even possible to set up the proxy
    in IPv6 mode, but if you''re ahead of the pack in running the modern protocol,
    you''re less likely to bother with FTP as your main file transfer protocol.


    > If your PF version predates the ones described, you''re running on an outdated,
    unsupported operating system. I strongly urge you to schedule an operating system
    upgrade as soon as possible. If an upgrade is for some reason not an option, look
    up the first edition of this book and study the documentation for your operating
    system information on how to use older FTP proxies.


    # Making Your Network Troubleshooting-Friendly


    Making your network troubleshooting-friendly is a potentially large subject. Generally,
    the debugging-or troubleshooting-friendliness of your TCP/IP network depends on
    how you treat the Internet protocol that was designed specifically with debugging
    in mind: ICMP.


    ICMP is the protocol for sending and receiving control messages between hosts
    and gateways, mainly to provide feedback to a sender about any unusual or difficult
    conditions encountered on the target host.


    There''s a lot of ICMP traffic, which usually happens in the background while
    you are surfing the Web, reading mail, or transferring files.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '(remember,you''re building one) use ICMP to negotiate packet sizes and other
    transmission parameters in a process often referred to as path MTU discovery.


    You may have heard admins refer to ICMP as either "evil", or if your understanding
    runs a little deeper, "a necessary evil." The reason for this attitude is purely
    historical. A few years back, it was discovered that the working stacks of several
    operating systems contained code that could make the machine crash if it were
    sent a sufficiently large ICMP request. You can find a lot of material on the
    ping of death bug using your favorite search engine. However, this happened in
    the second half of the 1990s, and all modern operating systems have thoroughly
    sanitized their network code since (at least, that''s what we re to believe).


    One of the early work-arounds was to simply block either ICMP echo (ping) requests
    or every ICMP traffic. That measure almost certainly led to poor performance and
    hard-to-debug problems. In some cases, these rules were around for almost two
    decades, and the people who put them are still scared. There''s most likely little
    to reason to worry about destructive ICMP traffic anymore, but we''ll look at
    how to manage just what ICMP passes to your network.


    In modern IPv6 networks, the updated icmp protocol plays a more crucial role in
    parameter passing and each configuration, and network admins are playing high-stakes
    game while learning the points of blocking or passing ICMP traffic. To a large
    extent, issues that are relevant for IPv4 ICMP generally apply to IPv6 as well,
    but in addition, ICMP6 is used for several mechanisms that were handled differently
    in IPv4. We''ll dip into some of these issues after walking through the issues
    that are relevant for both IP protocol versions.


    # We Let It All Through?


    The obvious question becomes, "If ICMP is such a good and useful thing, shouldn''t
    we let it go all the time?" The answer is that it depends.


    Letting diagnostic traffic pass unconditionally makes debugging easier, of course,
    but it also makes relatively easy for others to extract information about your
    network. So, a rule like the following might not be optimal if you want to cloak
    the internal workings of your IPv4:


    ```

    pass inet proto icmp

    ```


    > If you want the same free flow of messages for your IPv6 traffic, the responding
    rule is this:


    ```

    pass inet6 proto icmp6

    ```


    In fairness, it should also be said that you might find some ICMP and ICMP6 traffic
    quite harmless riding piggybacking on your keep state rules.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# The Easy Way Out: The Buck Stops Here


    The easiest solution could very well be to allow all ICMP and ICMP6 traffic from
    your local network and to let probes from elsewhere drop at your gateway:


    ```

    pass proto icmp icmp-type $icmp_types from $localnet

    pass inet6 proto icmp6 icmp6-type $icmp6_types from $localnet

    pass inet6 proto icmp6 icmp6-type $icmp_types to $ext_if

    pass inet6 proto icmp6 icmp6-type $icmp6_types to $ext_if

    ```


    This is assuming, of course that you''ve identified the list of desirable ICMP
    and ICMP6 types to fill out your macro definitions. We''ll get back to those shortly.
    Stopping probes at the gateway might be an attractive option anyway, but let''s
    look at a few other options that''ll demonstrate some of PF''s flexibility.


    # Lping Through


    The rule set we have developed so far in this chapter has one clear disadvantage:
    Common troubleshooting commands, such as ping and traceroute (and their IPv6 equivalents,
    ping6 and traceroute6), will not work. That may have scared people into filtering
    or blocking ICMP traffic in the first place, there are apparently people who feel
    better off without it. However, you''ll find these troubleshooting tools useful.
    And with a couple of additions to the rule set, they will be available to you.


    The diagnostic commands ping and ping6 rely on the ICMP and ICMP6 echo request
    (and the matching echo reply) types, and in order to keep our rule tidy, we start
    by defining another set of macros:


    ```

    icmp_types = "echoreq"

    icmp6_types = "echo6"

    ```


    Then, we add rules that use the definitions:


    ```

    pass proto icmp icmp-type $icmp_types

    pass inet6 proto icmp6 icmp6-type $icmp6_types

    ```


    The macros and the rules mean that ICMP and ICMP6 packets with type echo request
    will be allowed through and matching echo replies will be allowed to pass back
    due to PF''s stately nature. This is all the ping and ping6 commands need in order
    to produce their expected results.


    If you need more or other types of ICMP or ICMP6 packets to go through, you can
    expand icmp_types and icmp6_types to lists of types you want to allow.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Helping traceroute


    The traceroute command (and the IPv6 variant traceroute6) is useful when your
    users claim the Internet is not working. By default, Unix traceroute uses UDP
    connections according to a formula based on destination. The following rules work
    with the traceroute and traceroute6 commands on all forms of Unix I had access
    to, including GNU/Linux:


    ```

    # allow out the default range for traceroute(8)

    # "baseinhops*queries-1" (33433:64*3-1)

    ass out on egress inet6 proto udp 33433:3326 # For IPv4

    pass out on egress inet6 proto udp 33433:3326 # For IPv6

    ```


    This also gives you first taste of what port ranges like. They''re quite useful
    in some contexts.


    Experience so far indicates that traceroute and traceroute6 implementations on
    other operating systems work roughly the same way. One notable exception is Microsoft
    Windows. On that platform, the tracert.exe and its IPv6 sister tracer6.exe use
    ICMP echo requests for this purpose. If you want to let traceroutes through, you
    only need the first rule, much as when letting ping through. The Unix traceroute
    program can be instructed to use other protocols and will behave remarkably like
    its Microsoft counterpart if you use its -command-line option. You can check the
    traceroute page (or its source code, for that matter) for details.


    This solution is based on a sample rule I found in openbsd-misc post. I''ve found
    that list, and the searchable list archives (accessible among other pages from
    http://marc.info/0/), to be a valuable resource whenever you need OpenBSD/PF-related
    information.


    # Path MTU Discovery


    The last I''ll remind you about when it comes to troubleshooting the path MTU
    discovery. Internet protocols are designed to be device-independent, and one consequence
    of device independence is that you cannot predict what the optimal packet size
    is for a given connection. The main constraint on your packet size is called the
    maximum transmission unit, or MTU, which sets the upper limit on the packet size
    for an interface. The ifconfig command will show you the MTU for your network
    interfaces.


    Modern TCP/IP implementations expect to be able to determine the correct packet
    size for a connection through a process that involves sending packets of varying
    sizes within the MTU of the local link with the "do fragment" flag set. If a packet
    exceeds the MTU somewhere along the way to the destination, the host with the
    lowest MTU will return an ICMP packet indicating "type 3, code 4" and quoting
    its local MTU when the local upper limit has been reached. Now, you don''t need
    to dive into the RFCs right away. Type 3 means destination unreachable, and code
    4'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'is short for fragmentation needed, but the "do not fragment" flag is set. So
    if your connections to other networks, which may have MTUs that differ from your
    own, seem suboptimal, you could try changing your list of ICMP types slightly
    to let the IPv4 destination-unreachable packets through:


    ```

    icmp_types = { echoreq, unreachable }

    ```


    As you can see, this means you do not need to change the pass rule itself:


    ```

    pass inset proto icmp icmp-type $icmp6_types

    ```


    Now I''ll let you in on a little secret: In all cases, these rules aren''t necessary
    for purposes of path MTU discovery (but they don''t hurt either). Even though
    the default PF keep state behavior takes care of the ICMP you''ll need, PF does
    filter on all variations of ICMP types and codes. For IPv6, you''d probably want
    to let the more common ICMP6 diagnostics through, such as the following:


    ```

    icmp6_types = { echoreq unreach timex paramprob } }

    ```


    This means that we let requests and destination unreachable, time exceeded, and
    parameter problem messages pass for IPv6 traffic. Thanks to the macro definitions,
    you don''t need to touch the pass rule for the ICMP6 case:


    ```

    pass inet6 proto icmp icmp-type $icmp6_types

    ```


    But it''s worth keeping in mind that IPv6 relies on ICMP6 messages for automatic
    configuration-related tasks, and you may want to explicitly filter in order to
    allow or deny specific ICMP types at various points in your network.


    For example, you''ll want to let a router and its clients exchange router solicitation
    and advertisement messages (ICMP type router6 and routers6, respectively), you
    may want to make sure that neighboradvertisements and neighbor solicitations (ICMP
    type neighboradv6 and neighborsol6) stay confined within their directly connected
    networks.


    If you want to delve into more detail, the list of possible types and codes are
    documented in the icmp(4) and icmp6(4) man pages. The background information is
    available in the RFCs.7


    +   The main RFCs describing ICMP and some related techniques are 792, 950, 1191,
    2521, and 6145. ICMP updates for IPv6 are in RFC 3542 and RFC 4443. These documents
    are available in a number of places on the Web, such as http://www.ietf.org/ and
    http://www.rfc.org/, and probably also via your package system.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Tables Make Your Life Easier


    By now, you may be thinking that this setup gets awfully static and rigid. There
    will, after all, be some kinds of data relevant to filtering and redirection at
    a given time, but they don''t deserve to be put into a configuration file! Quite
    right, and PF offers mechanisms for handling those situations.


    Tables are one such feature. They''re useful lists of IP addresses that can be
    manipulated without reloading the entire rule set and also when fast lookups are
    always enclosed in <, like this:


    ```

    table <clients> persist { 192.168.2/04, 192.168.2.5 }

    ```


    Here, the network 192.168.2/04 is part of the table as the address 192.168.2.5
    is excluded using the ! operator (logical NOT). The keyword persist makes the
    table itself will exist, even if no rules refer to it.

    It''s also possible to load tables from files where each item is on a separator-rate,
    such as the file /etc/clients:


    192.168.2/04

    !192.168.2.5


    This, in turn, is used to initialize the table in /etc/pf.conf.


    ```

    table <clients> persist file "/etc/clients"

    ```


    So, for example, you can change one of our earlier rules to read this to manage
    outgoing traffic from tcp from your client computers:


    ```

    pass inet proto tcp from <clients> to any port $client_out

    ```


    With this in hand, you can manipulate the table''s contents live, like this:


    ```

    sudo pfctl -t clients -T add 192.168.1/16

    ```


    Note that this changes the in-memory copy of the table only, meaning that the
    change will not survive a power failure or reboot, unless you arrange to store
    your changes.


    You might opt to maintain the on-disk copy of the table with a cron job that dumps
    the table content to disk at regular intervals, using a command such as the following:


    ```

    sudo pfctl -t clients -T show >/etc/clients

    ```'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Alternatively, you could edit the /etc/clients file and replace the memory-table
    contents with the file data:


    ```

    $ sudo pfctl -t clients replace -f /etc/clients

    ```


    For operations you''ll be performing frequently, sooner or later, you''ll end
    up writing shell scripts. It''s likely routine operations on tables, such as inserting
    or removing items or replacing table contents, will be part of your housekeeping
    scripts in the near future.


    One common example is to enforce network access restrictions via cron jobs that
    replace the contents of the tables referenced as from addresses at specific times.
    In some networks, you may even need different access rules for different days
    of the week. The only real limitations lie in your own needs and your creativity.


    We''ll be returning to some handy uses of tables frequently over the next chapters,
    and we''ll look at a few programs that interact with tables in useful ways.'
