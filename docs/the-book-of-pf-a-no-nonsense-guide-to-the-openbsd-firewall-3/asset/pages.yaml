- img_proc: true
  md: '/var/run/dmesg.boot. You can view the file itself or use the dmesg command
    to see these messages. With a successfully configured PCI card, you should see
    something like this:


    ```

    ral0 pci dev 10 function 0 Ralink Rt2561s rev 0x00: apic 2 int 11 (irq 11), address
    00:25:9c:72:cf:60

    ral0: MAC/BBP Rt2561c, RF27527

    ```


    If the interface you want to configure is a hot-pluggable type, such as USB or
    PC Card device, you can see the kernel messages by viewing the /var/log/messages
    file—for example, by running tail -f on the file before you plug in the device.


    Next, you need to configure the interface: first to enable the link and, finally,
    to configure the system for TCP/IP. You can do this from the command line, like
    this:


    ```

    $ sudo ifconfig ral0 mediaopt hostap map chan 11 unwiredbsd nkey 0x1idebeef9

    ```


    This command does several things at once. It configures the ral0 interface, enables
    the interface with the up parameter, and specifies that the interface is an access
    point for a wireless network with mediaopt hostap. It explicitly sets the operating
    mode to 11g and the channel to 11. Finally, it uses the mwid parameter to set
    the network name to unwiredbsd, with the WEP key (mwkey) set to the hexadecimal
    string 0x1idebeef9.


    Use ifconfig to check if the command successfully configured the interface:


    ```

    $ ifconfig ral0

    ral0: flags=8843<UP,BROCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500

    lladdr 00:25:9c:72:cf:60

    priority: 4

    groups: wlan

    media: IEEE802.11 autoselect mode 11g hostap

    status: active

    ieee80211: mwid unwiredbsd chan 1 bssid 00:25:9c:72:cf:60 mwid <not displayed>
    100dbm

    inet6 fe80::225:9ff:fe72:cf60%ral0 prefixlen 64 speed ox2

    ```


    Note the contents of the media and ieee80211 lines. The information displayed
    should match what you entered on the ifconfig command line.


    With the link of your wireless network operation, you can assign an IP address
    to the interface. First, set an IPv4 address:


    ```

    $ sudo ifconfig ral alias 10.50.90.1 255.255.255.250

    ```


    Setting an IPv6 is equally straightforward:


    ```

    $ sudo ifconfig alias ral 2001:db8::aad:f0d1:1 64

    ```'
