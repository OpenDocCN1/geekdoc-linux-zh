- img_proc: true
  md: 'It might also be useful to supplement rules like these with table-entry expiry,
    as described in "Tidying Your Tables with pfctl" on page 97.


    # Queue Assignments Based on Operating System Fingerprint


    Chapter 6 covered several ways to use spend to cut down on spam. If running spend
    isn''t an option in your environment, you can use a queue and rule set based on
    the common knowledge that machines send spam are likely to run a particular operating
    system.


    PF has a fairly reliable operating system fingerprinting mechanism, which detects
    the operating system at the other end of a network connection based on characteristics
    of the initial SYN packets at connection setup. The following may be a simple
    substitute for spend if you''ve determined that legitimate mail is highly likely
    to be delivered from systems that run that particular operating system.


    ```

    pass quick tcp from os "Windows" to $ext_if port smtp mqtt smallpipe

    ```


    Here, email traffic originating from hosts that run a particular operating system
    gets no more than 1KB of your bandwidth, with borrowing.


    # Conclusion: Traffic-Shaping for Fun, and Perhaps Even Useful


    This chapter has dealt with traffic-shaping techniques that can make your traffic
    move faster, or at least make preferred traffic pass more efficiently and according
    to your specifications. By now you should have at least a basic understanding
    of traffic-shaping concepts and how they apply to the traffic-shaping tool you
    will be using on your systems.


    I hope that the somewhat stylized (but functional) examples in this chapter have
    given you a taste of what''s possible with traffic shaping and that the material
    has inspired you to play with some of your own ideas of how you can use the traffic-shaping
    tools in your networks. If you pay attention to your network traffic and the underlying
    needs it expresses (see Chapters 9 and 10 for more on studying network traffic
    in detail), you can use the traffic-shaping tools to improve the way your network
    serves its users. With a bit of luck, your users will appreciate your efforts
    and you may even enjoy the experience.'
