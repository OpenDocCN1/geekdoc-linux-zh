  md: '# WHY GREYLISTING WORKS


    A significant amount of design and development effort has been put into making
    essential services, such as SMTP email transmission, fault-tolerant. In practical
    terms, this means that the best effort of a service such as SMTP is as close as
    you can get to having a perfect record for delivering messages. That''s why we
    can rely on greylisting to eventually receive email from proper servers.


    The current standard for Internet email transmission is defined in RFC 5321. The
    following are several excerpts from Section 4.5.4.1, "Sending Strategy":


    > "In a typical system, the program that composes a message has some method for
    requesting immediate attention for a new piece of outgoing mail, which mail cannot
    be transmitted immediately MUST be queued and periodically retrieved by the sender..."


    > "Sender MUST delay retrying a particular destination after one attempt has failed.
    In general, the retry interval SHOULD be at least 30 minutes; however, more sophisticated
    and variable strategies will be beneficial when the SMTP client can determine
    the reason for non-delivery.


    > "Retries continue until the message is transmitted or the server gives up; the
    give-up time generally needs to be at 4-5 days."


    Delivering email is a collaborative, best-effort process, and the RFC clearly
    states that if you are trying to send mail to reports that cannot receive at the
    moment, it is your duty (a requirement) to try again later, giving the receiving
    server a chance to recover from its problem.


    The clever wrinkle to greylisting is that it''s a convenient while. When we claim
    to have a temporary local problem, that problem is really the equivalent of "Admin
    tell not to talk to strangers." Well-behaved senders with valid messages will
    call again, but spammers won''t wait around for retry, since so increasing their
    cost of delivering messages. This is why greylisting still works, and since it''s
    based on strict adherence to standards,¹ false positives are rare.


    * The relevant parts of RFC 5321 are identical to the corresponding parts of RFC
    2821, which is obsolete. From those we were more than a little disappointed that
    the IETF did not clarify these chunks of the text, now moving forward on the standards
    track. My reaction (actually, it''s quite a rant) is at http://bsdly.blogspot.com/2008/10/ietf-failed-to-account-for-greylisting.html.


    ² The relevant RFCs are mainly RFC 1123 and RFC 5321, which made obsolete the
    earlier RFC 2821. Remember that temporary rejection is an SMTP fault-tolerance
    feature.


    106 Chapter 6'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'The colon-separated list 2:4:864 represents the values passtime, greyxep, and
    whiteexp:


    +   * passtime denotes the minimum number of minutes spend considers a reasonable
    time before retry. The default is 25 minutes, but here we use

    * greyxep is the number of hours an entry stays in the greylist list before it''s
    removed from the database.

    * whiteexp determines the number of hours a whitelist is kept. The default values
    for greyxep and whiteexp are 4 hours and 864 hours (just over 1 month), respectively.


    # Greylisting in Practice


    Users and administrators at sites that implement greylisting tend to agree greylisting
    gets rid of their spam, with a significant drop in the load on any content filtering
    they have in place for their mail. We''ll start by looking at what spam greylisting
