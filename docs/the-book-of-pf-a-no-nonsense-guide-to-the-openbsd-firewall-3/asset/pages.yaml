- img_proc: true
  md: 'The connection shown here is a successful connection to a website.

    There are more interesting things to look for, though, such as connections that
    fail when they shouldn''t according to your specifications or connections that
    succeed when your specification says they shouldn''t.

    The test in these cases involves tracking the packets'' path through your configuration.
    Once more, it''s useful to check whether PF is enabled or disabling PF makes a
    difference. Building on the result from that initial test, you perform the same
    kind of analysis of the rule set as described previously:


    +   - Once you have a reasonable theory of how the packets traverse your rule
    set and your network interfaces, use tcpdump to see the traffic on each of the
    interfaces turn.

    - Use tcpdump''s filtering features to extract the information you need—that is,
    to see the packets that match your specific case, such as sort port and dst 392.0.2.19.

    - Find the place where your assumptions no longer match the reality of your network
    traffic.

    - Turn on logging for the rules that may be involved and tcpdump loose on the
    relevant pflog interface to see which rule the packets actually match.


    The main outline for the test procedure is fairly fixed. If you''ve narrowed down
    the cause to your PF configuration, again, it''s a case of finding out rules match
    and which rule ends determining whether the packet passes or is blocked.


    # Your Network and Stay in Control


    The recurring theme in this book has been how PF and related tools make it relatively
    easy for you, as the network administrator, to take control of your network and
    make it behave the way you want it to—in words, PF allows you to build the network
    you need.


    Running a network can be fun, and I hope you''ve enjoyed this tour of what I consider
    to be the best tool available for network security. In present, I made a conscious
    decision early on to introduce you to the methods and ways of thinking interesting
    and useful configurations, rather than offering a full catalog of available features,
    or for that, making this book the complete reference. The complete PF reference
    already exists in the man pages, which are updated every six months with the new
    OpenBSD releases. You can also find further information in the resources I''ve
    listed in Appendix A.


    Now that you have a broad, basic knowledge of what PF can do, you can start building
    the network according to your own ideas of what you need. You''ve reached the
    point where you can find your way around the man pages and locate the exact information
    you need. This is when the fun part starts!'
