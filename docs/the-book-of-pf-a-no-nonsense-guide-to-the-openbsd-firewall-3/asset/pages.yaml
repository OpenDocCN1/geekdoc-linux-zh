- img_proc: true
  md: "All of these correspond to definitions we could have put in a pf.conf.\nThe\
    \ default checking interval in relayd is 10 seconds, which means that a host could\
    \ be down for almost 10 seconds before it's taken offline. Being cautious, we'll\
    \ set the checking interval to 5 seconds to minimize visible downtime, with the\
    \ following line:\n\n```\ninterval 5 # check hosts every 5 seconds\n```\n\nNow,\
    \ we make a table called webpool that uses most of the macros:\n\n```\ntable <webpool>\
    \ { $web1, $web2, $web3, $web4 }\n```\n\nFor reasons we'll return shortly, we\
    \ define one other table:\n\n```\ntable <sorry> { $sorry_server }\n```\n\nAt this\
    \ point, we're ready to set up the redirect:\n\n```\nredirect {\n  listen on $webserver\
    \ port 80 sticky-address\n  laylay\n  forward to <webpool> check http \"/status.html\"\
    \ code 200 timeout 300\n  forward to <sorry> timeout 300 icmp\n}\n```\n\nThis\
    \ redirect says that connections to port 80 are redirected to the members of the\
    \ webpool table. The sticky-address option has the same effect here as the rdr-to\
    \ in PF rules: New connections from the source IP address (the time interval defined\
    \ by the timeout value) are redirected to the same host in the backend pool as\
    \ the previous ones.\nThe relayd daemon checks to see whether a host is available\
    \ by asking for the file /status.html, using the HTTP protocol, and expecting\
    \ the return code to be equal 200. This is the expected result for a file it asking\
    \ running Web server has it available.\nNo big so far, right? The relayd daemon\
    \ will take care of excluding hosts from the table if they go down. But if all\
    \ the hosts in the webpool table go down? Fortunately, the developers of that,\
    \ too, and introduced the concept of backup tables for services. This is the last\
    \ part of the definition for the service, with the sorry table as the backup table:\
    \ The hosts in the sorry table take over if the webpool table becomes empty. This\
    \ means that you need to configure a service that offers a \"Sorry, we're down\"\
    \ message in all the hosts in your webpool fail.\nIf you're running IPv6-only\
    \ addresses, you should, substitute IPv6 addresses for the ones given in the example.\
    \ If you're running a dual-stack setup, you should probably set up the load-balancing\
    \ mechanism separately for each protocol, where the configurations differ only\
    \ in names (append a 4 or 6, for example, to the IPv4 and IPv6 sets of names,\
    \ respectively) and the addresses themselves."
  merge: -1
