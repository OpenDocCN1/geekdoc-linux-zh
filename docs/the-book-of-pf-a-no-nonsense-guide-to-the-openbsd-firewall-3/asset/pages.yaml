  md: "If you worked through the examples in Chapters 3 and 4, your rule set probably\
    \ has a match rule that applies nat-to on your outgoing traffic. To introduce\
    \ priority-based queuing to your rule set, you first add the queue definitions\
    \ and make some minor adjustments to your outgoing match.\nStart with the queue\
    \ definition from the preceding example and adjust the total bandwidth to local\
    \ conditions, as shown in here.\n\n```\naltq $ext_if priq bandwidth $ext_bw queue\
    \ { q_pri, q_def\n\tqueue q_pri priority 7\n\tqueue q_def priority 1 priq(default)\n\
    ```\n\nThis gives the queues whatever bandwidth allocation you define with\nThe\
    \ simplest and quickest way to integrate the queues into your rule set\nis to\
    \ edit your outgoing match rule to read something like this:\n\n```\nmatch out\
    \ $ext_if from $int_if:network-to ($ext_if) queue (q_def, q_pri)\n```\n\nReload\
    \ your rule set, and the priority-queuing regime is applied to all traffic that's\
    \ initiated from your local network.\nYou can use the sysat command to get a live\
    \ view of how traffic is assigned to your queues.\n\n$ sudo sysat queues\n\nThis\
    \ will give you a live display that looks something like this:\n\n| 2 users |\
    \ Load 0.39 0.27 0.30 | Apr 1 16:33:44 2015 |\n| QUEUE | BW SCH PR | PKTS | BYTES\
    \ | DROP_P | DROP_B | QLEN | BORRO | SUSPE | P/S | B/S |\n| q_pri | | priq 7 |\
    \ 21705 | 1392K | 0 | 0 | | | 12 | 803 |\n| q_def | | priq | 12138 | 6759K | 0\
    \ | 0 | | | 9 | 460 |\n\nLooking at the numbers in the PKTS (packets) and BYTES\
    \ columns, show a clear indication that the queuing is intended.\nThe q_pri queue\
    \ has processed a larger number of packets in relation to the amount of data,\
    \ just as we expect. The ACK packets do not take up a lot of space. On the other\
    \ hand, the traffic assigned to the q_def queue has more data in each packet,\
    \ and the numbers show essentially the reverse packets-to-data size ratio as in\
    \ the q_pri queue.\n\n> NOTE sysat is a rather capable program on all BSDs, and\
    \ the OpenBSD version offers details that are relevant to PF and that aren't found\
    \ in the sysat variants of the other systems of this writing. We'll be looking\
    \ at sysat in the next chapter. In the meantime, read the man pages and play with\
    \ the program. It's a very useful tool for knowing your system."
