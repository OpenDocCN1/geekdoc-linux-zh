  md: 'As the complexity of the rule set grows, consider using tag in match and pass
    rules to make your rule set readable and easier to maintain.

    Tags are sticky, and once a packet has been tagged by a matching rule, the tag
    stays, which means a packet can have a tag if it''s applied by the last matching
    rule. However, a packet can have only one tag at any time. If a packet matches
    several rules that apply, the tag will be overwritten with a new one by each matching
    tag rule.

    For example, you could set several tags on incoming traffic via a set of or pass
    rules, supplemented by a set of pass rules that determine where packets pass out
    based on the tags on the incoming traffic.


    # # The Bridging Firewall


    An Ethernet bridge consists of two or more interfaces that are configured to forward
    Ethernet frames transparently and aren''t directly visible to the upper layers,
    such as the TCP/IP stack. In a filtering context, the bridge configuration is
    often considered attractive because it means the filtering can be performed on
    a machine that doesn''t have its own IP addresses. If the machine in question
    runs OpenBSD or a similarly capable operating system, it can filter and redirectnThe
    main advantage of such a setup is attacking the firewall itself is more difficult.
    The disadvantage is that all admin must be performed at the firewall''s console,
    unless you configure a network interface that''s reachable via a secured network
    of some kind or even a server console. It also follows that bridges with no IP
    address configured can''t be set as the gateway for a network and can''t run any
    services on the bridged interfaces. Rather, you can think of a bridge as an intelligent
    bulge on the network cable, which can filter and redirect.


    +   - The interfaces are placed in promiscuous mode, which means they''ll receive
    (and to some extent) every packet on the network.

    - Bridges operate on the Ethernet level and, by default, forward all types of
    packets, not just TCP/IP.

    - The lack of IP addresses on the interfaces makes some of the effective redundancy
    features, such as CARP, unavailable.


    A few general caveats apply to using bridges implemented as:

    The method for configuring bridges differs among operating systems in some details.
    The following examples are very basic and don''t cover all possible wrinkles,
    but they should be enough to get you started.


    5. How much security this actually adds is a matter of occasional heated debate
    on mailing lists such as openbs-mix and other networking-oriented lists. Reading
    up on the pros and cons as perceived core OpenBSD developers can be entertaining
    as well as enlightening.'
