  md: '# Giving Spammers a Hard Time with spamd


    Email is a fairly essential service that needs special attention due to the large
    volume of unwanted messages, or *spam*. The volume of unsolicited commercial messages
    was already a painful problem when malware discovered that email-borne worms would
    work and using email to spread their payload. During the early 2000s, the combined
    volume of spam and email-borne malware had increased to the point where running
    an SMTP service without some of spam countermeasures became almost unthinkable.


    Spam-fighting measures are as old as the spam problem itself. The early efforts
    focused on analysis of the messages'' contents (known as *content filtering*)
    and to some extent on interpretation of the messages'' rather trivially foldable
    headers, such as the purported sender address (From:) or the store and forward
    paths of intermediate deliveries recorded in the Headers:


    When FreeBSD designed its spam-fighting solution, first introduced with FreeBSD
    3.3 in 2003, the developers focused on the network level and the immediate communication
    partner in the SMTP conversations with any available information about hosts that
    tried to deliver messages. The developers set out to create a small, simple, secure
    program. The early implementation was based almost entirely on creative use of
    PF tables combined with data from trusted external sources.


    In addition to the OpenBSD spam-daemon, the content-filtering-based antispam package
    SpamAssassin (http://spamassassin.apache.org/) features a program called spam.
    Both programs are designed to help fight spam, but they take very different approaches
    to the underlying problem and don''t operate independently. However, when both
    programs are correctly configured and running, they complete each other.


    # Network-Level Behavior Analysis and Blacklisting


    The original spam design is based on the observation that spammers send a lot
    of mail and the incredibly small likelihood of being the first person to receive
    a particular message. In addition, spam is sent via a few spam-friendly networks
    and numerous hijacked machines. Both the individual messages and the machines
    that send them will be reported to blacklist maintainers quickly, and the blacklist
    data consisting of known spam spenders'' IP addresses forms the basis for spam''s
    processing.


    When dealing with blacklisted hosts, spam employs a method called *tarpitting*.
    When the daemon receives an SMTP connection, it presents its banner and immediately
    switches to a mode where it answers SMTP traffic at the rate of 1 byte per second,
    using a tiny selection of SMTP commands designed to make sure that mail is never
    delivered but rejected back. The intention is to waste as much time as possible
    on the sending end'
  merge: -1
