  md: "When you use verbose, pfctl should expand your macros into their\nrules before\
    \ returning you to the command-line prompt, as follows:\n\n```\n$ sudo pfctl -vf\
    \ /etc/pf.conf\ntcp services = { ssh, smtp, domain, www, pop3, auth, https, pop3s\
    \ }\nudp_ services = { domain }\nblock drop all\npass out tcp from any to port\
    \ = ssh flags S/A keep state\npass out tcp from any to port = smtp flags S/A keep\
    \ state\npass out tcp from any to port = domain flags S/A keep state\npass out\
    \ tcp from any to port = www flags S/A keep state\npass out tcp from any to port\
    \ = pop3 flags S/A keep state\npass out tcp from any to port = auth flags S/A\
    \ keep state\npass out tcp from any to port = https flags S/A keep state\npass\
    \ out tcp from any to port = pop3 flags S/A keep state\npass out udp from any\
    \ to port = domain keep state\n$\n```\n\nCompare this output to the content of\
    \ the /etc/pf.conf file you actually\\wrote. Our single TCP service is expanded\
    \ into eight different ones:\none for each service in the list. The single UDP\
    \ rule takes care of only one\nservice, and expands from what we wrote to include\
    \ the default options.\nNotice that the rules are displayed in full, with default\
    \ values such as flags\nS/A keep state applied in place of any options you do\
    \ not specify explicitly.\nThis is the configuration as it's actually loaded.\n\
    \n# Checking Your Rules\n\nIf you've made extensive changes to your rule set,\
    \ check them before attempt-\nto load the rule set by using the following:\n\n\
    ```\n$ pfctl -nf /etc/pf.conf\n```\n\n- The option tells PF to parse the rules\
    \ only, without loading them—\nmore or less as a dry run and if pfctl finds any\
    \ syntax errors in your rule set, it will exit with an error mes-\ns that points\
    \ to the line number where the error occurred.\n\nSome firewall guides advise\
    \ you to make sure that your old configuration is\ntuly gone, or you run into\
    \ trouble—your firewall might be in some kind\nof intermediate state that doesn't\
    \ match the before or after state.\nThat's not truly true when you're using PF.\
    \ The last valid rule set loaded is\n until you disable PF or load a new rule\
    \ set. pfctl checks the syn-\ntax and then loads your rule set completely before\
    \ switching over to\nnew one. This is often referred to as atomic rule set load\
    \ and means that once\na valid rule has been loaded, there's no intermediate state\
    \ with a partial\nrule set or no rules loaded. One consequence is that traffic\
    \ that matches\nstates that are valid in both the old and the new rule set will\
    \ not be disrupted."
