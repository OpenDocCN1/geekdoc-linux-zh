- img_proc: true
  md: 'The poem quoted here is a good indication of the level of feeling PF sometimes
    inspires in its users. This poem appeared on the PF mailing list, in a thread
    that started with a message with the subject “Things PF can’t do?” in May 2004.
    The message was written by someone who didn''t have a lot of firewall experience
    and consequently found it hard to get the desired setup.


    This, of course, led to some discussion, with several participants saying that
    if PF was hard on a newbie, the alternatives weren''t any better. The thread ended
    in the following haiku of praise from Jason Dixon, dated May 20, 2004.


    Compared to working with iptables, PF is like this haiku:


    A breath of fresh air,

    floating on white rose petals,

    eating strawberries.


    Now I''m getting carried away:


    Hartmeier codes now,

    Henning knows not why it fails,

    fails only for n0ob.


    Tables load my lists,

    tarpit due the asshole spammer,

    death to his mail store.


    CARP due to Cisco,

