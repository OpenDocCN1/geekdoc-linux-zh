  md: '# IS SYNPROXY WORTH THE TROUBLE?


    Over the years, the synproxy state option has received a lot of attention as a
    possible bulwark against ill-intentioned traffic from the outside. Specifically,
    the synproxy state option was intended to protect against SYN-flood attacks that
    could lead to resource exhaustion at the back end.


    It works like this: When a new connection is created, PF normally lets the communication
    partners handle the connection setup, simply passing the packets if they match
    a pass rule. With synproxy enabled, PF handles the initial connection setup and
    hands over the connection to the communication partners only once it is properly
    established, essentially creating a buffer between the communication partners.
    The SYN proxy is slightly more expensive than the default key state, but not necessarily
    noticeably on reasonably scaled equipment.


    The potential downsides become apparent in load-balancing setups where a synproxy
    PF could accept that the backend isn''t ready to accept, in some cases short-circuiting
    the redundancy by setting connections to hosts other than the load-balancing logic
    would have selected. The classic example is a pool of HTTP servers with round-robin
    DNS. The problem becomes especially apparent in protocols like SMTP, where the
    built-in redundancy dictates (by connection, at least—the actual RFC is a bit
    ambiguous) that if a primary mail exchanger isn''t accepting connections, you
    should try a secondary indeed.


    When considering a setup where synproxy seems attractive, keep these issues in
    mind and analyze the potential impact on your setup that would come from adding
    synproxy to the mix. You conclude that SYN proxy is needed, simply tack on synproxy
    state at the end of the rules that need the option. The rule of thumb is, if you
    are under active attack, inserting the synproxy option may be useful as a temporary
    measure. Under normal circumstances, it isn''t needed as a permanent part of your
    configuration.


    On a similar note, let the world talk to the mail server:


    ```

    pass proto tcp to $emailserver port $email

    ```


    This lets clients anywhere have the same access as the ones in your local network,
    including a few mail-retrieval protocols that may run without encryption. That''s
    common enough in the real world, but you might want to consider your options if
    you''re setting up a new network.


    For the mail server to be useful, it needs to be able to send mail to hosts outside
    the local network, too:


    ```

    pass log proto tcp from $emailserver to port smtp

    ```'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'Keep in mind that the rule starts with a block all rule, which means that only
    the mail server is allowed to initiate SMTP traffic from the local network to
    the rest of the world. If any of the other hosts on the network need to send email
    or receive email from the outside world, they would need to use the designated
    mail server. This could be a good way to ensure, for example, that you make it
    as hard as possible for any spam-spamming zombies that turn up in your network
    to deliver their payloads.


    Finally, the mail servers need to be accessible to clients outside our network
    who look up the information about example.com and any other domains for which
    we answer authoratively:


    pass proto { tcp, udp } to $servers port domain


    Having integrated all the services that need to be accessible from the outside
    world, our rule ends up looking like this:


    ```

    ext_if = "eth0" # marco for external interface use tun or pppoe for PPPoE

    int_if = "eth1" # marco for internal interface

    localnet = "$int_if:network"

    webserver = {192.0.2.227,2001:db8::baad:f00d:f17}

    webports = {http, https}

    mailserver = {192.0.2.225,2001:db8::baad:f00d:f17}

    mail = {192.0.2.221,192.0.2.223,

    namesvers = {2001:db8::baad:f00d:fbaa,2001:db8::baad:f0ff0}

    client_out = {ssh, domain, pop3, auth, ntp, https, cvpserver, 0}

    udp_services = {domain, ntp}

    icmp_types = {echoreq, unreach}

    icmp6_types = {echoreq unreach timex paramprob}

    block all

    pass quick proto { tcp, udp } from $localnet to port $udp_services

    pass log inet proto icmp all icmp-type $icmp_types

    pass inet6 proto icmp6 icmp6-type $icmp6_types

    pass proto tcp from $localnet to port $client_out

    pass proto tcp to $servers port domain

    pass proto tcp to $webserver port webports

    pass log porto tcp to $mailserver port $email

    pass log porto tcp from $mailserver to port smtp

    ```


    This is a relatively simple setup, but unfortunately, it has one troubling security
    disadvantage. The way this network is designed, the servers that offer services
    to the world are all in the same local network as your clients, and you''d need
    to restrict any internal services to local access. In principle, this means that
    an attacker would need to compromise only one host in your local network to gain
    access to any resource, putting the딨 on equal footing with any user in your local
    network. Depending on how well each machine and resource are protected from unauthorized
    access, this could range from minor annoyance to a major headache.'
  merge: -1
