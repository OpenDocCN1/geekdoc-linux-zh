  md: '# Setting sysctl Values


    On all CARP-capable systems, the basic functions are governed by a hand-ful of
    sysctl variables. The main one is net.inet.carp.allow, and it''s enabled by default.
    On a typical OpenBSD system, you will see:


    ```

    $ sysctl net.inet.carp.allow

    net.inet.carp.allow=1

    ```


    This means that your system comes equipped for CARP. If your kernel isn''t configured
    with a CARP device, this command should produce something like the following on
    FreeBSD:


    ```

    sysctl: unknown oid ''net.inet.carp.allow''

    ```


    Or it could produce something like this on NetBSD:


    ```

    sysctl: third level name ''carp'' in ''net.inet.carp.allow'' is invalid

    ```


    Use this sysctl command to view all CARP-related variables:


    ```

    $ sysctl net.inet.carp.allow=1

    net.inet.carp.preempt=0

    net.inet.carp.log=2

    ```


    On FreeBSD, you''ll also encounter the read-only status variable net.inet.carp\_suppress_preempt,
    which indicates whether preemption is possible. On systems with CARP code based
    on OpenBSD 4.2 or earlier, you also see net.inet.carp\_arpbalance, which is used
    to enable CARP ARP balancing to offer some limited load balancing for hosts on
    a local network.


    To enable the graceful failover between the gateways in our setup, we need to
    set the net.inet.carp.preempt variable so on hosts with more one network interface
    (like our gateways), all CARP interfaces will move between master and backup status
    concurrently. This setting must be identical on all hosts in the CARP group, and
    it should be repeated on all hosts during setup.


    ```

    $ sudo sysctl net.inet.carp.preempt-1

    ```


    The net.inet.carp.log variable sets the debug level for CARP logging between 0
    and 7. The default of 2 means only CARP state changes are logged.


    # Up Network Interfaces with ifconfig


    Notice in the network diagram shown in Figure 8-2 that the local-work addresses
    in the 192.168.12.0 network, while the Internet-facing'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'interface is in 192.0.2.0 network. With these address ranges and the CARP interface''s
    default behavior in mind, the commands for setting up the virtual interfaces are
    actually quite straightforward.


    In addition to the network parameters, CARP requires one additional parameter:
    the virtual host ID (vid), which uniquely identifies the interfaces that share
    the virtual IP address.


    > > The vid is an 8-bit value that must be set uniquely within the network''s
    broadcast domain. Setting the vid to the wrong value can lead to network problems
    that can be hard to debug, and there''s even anecdotal evidence that ID collisions
    with unrelated systems can occur and cause disruption on redundancy and loadbalancing
    systems based on VRRP, which uses a virtual node identification scheme similar
    to CARP.


    Run these commands on the machine that will be the initial master for the group:


    ```

    $ sudo ifconfig carp0 192.0.2.19 vid 1

    $ sudo ifconfig carp1 192.168.1.1 vid 2

    ```


    We don''t need to explicitly set the physical interface because the carp0 and
    carp1 virtual interfaces bind themselves to the physical interfaces that are already
    configured with addresses in the same subnets as the assigned CARP address.


    On systems that offer the carpdev option to ifconfig, it''s recommended to use
    the carpdev option for all CARP interface setups, even if it isn strictly required.
    The carpdev option becomes indispensable in cases where the choice of physical
    network device for the CARP interface isn''t obvious from the existing network
    configuration, and adding a carpdev interface string to the ifconfig commands
    can make the difference between a nonfunctional setup and a working one. This
    can be particularly useful in nonintitive configurations and where the number
    of free IP addresses in the relevant network is severely limited. The FreeBSD
    offers the carpdev option starting with FreeBSD 10.0.


    Use ifconfig to make sure that each CARP interface is properly configured and
    pay particular attention to the line: which indicates MASTER, as shown here:


    # $ ifconfig carp0


    ```

    carp0: flags=8843<BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500

    ldaddr 00:00:5e:00:01:01

    carp: MASTER carpdev ep0 vid 1 advbase 1 advskew 0

    groups: carp

    inet 192.0.2.19 mask 0xffffff broadcast 192.0.2.255

    inet6 fe80::200:5eff:fe00:101%carp0 prefixlen 64 scopeid 0x

    ```'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'The setup is almost identical on the backup except that you add the advskew
    parameter, which indicates how much less preferred it is for the specified machine
    to take over than the current master.


    ```

    $ sudo ifconfig carp0 192.0.2.19 whid 1 advskew 100

    $ sudo ifconfig carp1 192.168.1.1 whid 2 advskew 100

    ```


    The advskew parameter and its companion value, advbase, are used to calculate
    the interval between the current host''s announcement status once it''s taken
    over. The default value for advbase is 1, and the default for advskew is 0. In
    the preceding example, the master would announce an every second (1 + 0/256),
    the backup would wait for 1 + 100/256 seconds.


    With net.inet.carp.preempt-1 on all hosts in the failover group, the master stops
    announcing or announces it''s not available, the backups take over, and the new
    master starts announcing at its configured rate. Smaller advskew mean shorter
    announcement intervals and a higher likelihood that the host becomes the new master.
    If more hosts have the same advskew, the one that''s master will keep its status.


    On OpenBSD 4.1 and higher, one more factor in the equation determines which host
    takes over CARP duty. The demotion counter is a value each CARP host announces
    for its interface group as a measure of readiness for CARP interfaces. When the
    demotion counter is 0, the host is in complete readiness; higher values indicate
    measures of degradation. You can set the demotion counter from the command line
    using ifconfig -g, but the value is usually set by the system itself, usually
    during the boot process. All other things being equal, the host with the lowest
    demotion counter will contest to take over as the CARP master.


    > As of writing, FreeBSD versions earlier than FreeBSD 10 don''t support setting
    the demotion counter.


    On the backup, use ifconfig once again to check that each CARP interface is properly
    configured:


    ```

    $ ifconfig carp0

    arp: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500

    lladdr 00:00:5e:00:01:01

    carp: BACKUP carpdev ep0 whid 1 advskew 100

    groups: carp

    inet 192.0.2.19 netmask 0xffffff broadcast 192.0.2.255

    inet6 fe80::200:5ff:fe00:101%carp0 prefixlen 64 scopeid 05

    ```'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'The output here is only slightly different from what you''ve just seen on the
    master. Note that the carp: line indicates BACKUP status along with the advbase
    and advskew parameters.


    For actual production use, you should add a measure of security against unauthorized
    CARP activity by configuring the members of the CARP group with a shared, secret
    passphrase, such as the:


    ```

    $ sudo ifconfig pass meksitsdigoat 192.0.2.19 whid 1

    $ sudo ifconfig carp1 pass meksitsdigoat 192.168.1.1 whid 2

    ```


    As with any other password, the passphrase will become a required ingredient in
    all CARP traffic in your setup. Be sure to configure all CARP interfaces in a
    failover group with the same passphrase (or none).


    Once you''ve figured out the appropriate settings, preserve them through future
    system reboots by putting them in the proper files in /etc:


    +   - On OpenBSD, put the proper ifconfig parameters into hostname.carp0 and hostname.carp1.

    - On FreeBSD and NetBSD, put the relevant lines in your rc.conf file as contents
    of the ifconfig_carp= and ifconfig_carpi=.


    # Keeping States Synchronized: Adding pfsync


    As the final piece of configuration, set up state-table synchronization between
    the hosts in your redundancy group to prevent traffic disruption during failover.
    This feat is achieved through a set of pfsync interfaces. (As noted earlier, of
    this writing, NetBSD doesn''t support pfsync.)


    Configuring pfsync interfaces requires planning and a few ifconfig commands. You
    can set up pfsync on any configured network interface, but it''s best to set up
    a network for the synchronization. The sample configuration in Figure 8-2 shows
    a tiny network aside for the purpose. A crossover cable connects the two Ethernet
    interfaces, but in configurations with more than two hosts in the failover group,
    you may want a setup with a switch, hub, or VLAN. The interfaces to be used for
    the synchronization have been assigned the IP addresses 10.0.12.16 and 10.0.12.17,
    respectively.


    With the basic TCP/IP configuration in place, the complete pfsync setup for each
    synchronization partner interface is


    ```

    $ sudo ifconfig pfsync syncdev ep2

    ```'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'The pfsync protocol itself offers little in the way of security features: It
    has no authentication mechanism and, by default, communicates via IP multicast
    traffic. However, in cases where a physically separate network is not feasible,
    you can tighten your pfsync security by setting up pfsync with a specified syncpeer:


    ```

    $ ifconfig pfsync syncpeer 10.0.12.16 syncdev ep2

    ```


    This produces a configured interface that shows up in ifconfig like this:


    ```

    pfsync: flags=41<UP,RUNNING> mtu 1500

    priority: 0

    pfsync: syncdev: ep2 syncpeer: 10.0.12.16 maxupd: 128 defer: off groups: carp
    pfsync

    ```


    Another option is to set up an IPsec tunnel and use that to protect the sync traffic.
    In this case, the ifconfig command is


    ```

    $ ifconfig device pfsync syncpeer 10.0.12.16 syncdev enc

    ```


    This means that the syncdev device becomes the enc encapsulating interface instead
    of the physical interface.


    > If possible, set up synchronization across a physically separate, dedicated
    network or a separate VLAN because any lost pfsync updates could lead to less
    than clean failover.


    One very useful way to check that your PF state synchronization is running properly
    is watch the state table on synchronized hosts using sysat states on each machine.
    The command gives you a live display of states, showing updates happening in bulk
    on the sync targets. Between the synchronizations, states should display identically
    on all hosts (Traffic counters—like the number of packets and bytes passed—are
    the exception; they display updates only on the host that handles the connection.)


    This takes us to the end of the basic network configuration for CARP-based failover.
    In the next section, we''ll discuss what to keep in mind when writing rules for
    redundant configurations.


    # Putting Together a Rule Set


    After all the contortions we''ve been through in order to configure basic networking,
    you may be wondering what it will take to migrate the rules in your current pf.conf
    for the new setup. Fortunately, not much. The main change we''ve introduced is
    essentially invisible to the rest of the world, and a well-designed rule set for
    a single gateway configuration will generally work well for a redundant setup,
    too.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'That said, we''ve introduced two additional protocols (CARP and pfsync), and
    you''ll probably need to make some relatively minor changes to your rule set in
    order for the failover to work properly. Basically, you need to pass the CARP
    and pfsync traffic to the appropriate interfaces. The simplest way to handle the
    CARP traffic is to introduce a macro definition for your carpdevs that includes
    all physical interfaces that will handle CARP traffic. You''ll also introduce
    an accompanying pass rule, like the following one, in order to pass CARP traffic
    on the appropriate interfaces:


    ```

    pass on $carpdevs traffic carp

    ```


    Similarly, for pfsync traffic, you can introduce a macro definition for your syncdev
    and an accompanying pass rule:


    ```

    pass on $syncdev proto pfsync

    ```


    Skipping the pfsync interfaces entirely for filtering is cheaper performance-wise
    than filtering and passing. To take the pfsync device out of the filtering altogether,
    use this rule:


    ```

    set skip on $syncdev

    ```


    You should also consider the roles of the virtual CARP interface and its address
    versus the physical interface. As far as PF is concerned


    You may find that you have rules in your configuration that you don''t want to
    synchronize in case of a failover, such as connections to services that run on
    the gateway itself. One prime example is the typical rule to allow SSH for the
    administrator:


    ```

    pass in $int_if from $ssh_allowed to self

    ```


    For rules like these, you could use the state option no-sync to prevent synchronizing
    state changes for connections that aren''t relevant once your failover has occurred:


    ```

    pass in $int_if from $ssh_allowed to keep state (no-sync)

    ```


    With this configuration, you''ll be able to schedule operating system upgrades
    and formerly downtime-producing activities on members of your CARPed group of
    systems at times when they''re most convenient, with noticeable downtime for the
    users of your services.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# IFSTATED, THE INTERFACE STATE DAEMON


    In properly CARPed setups, basic networking functionality is well provided for,
    but your setup may include elements that need special attention when the network
    configuration changes on a host. For example, some services might need to be started
    or stopped when a specific interface goes down or restarts, or you may want to
    run specific commands or scripts in response to interface state changes. If this
    sounds familiar, ifstated is for you.


    The ifstated tool was introduced in OpenBSD 3.5 to trigger actions based on the
    state of network interfaces. You''ll find it in the base system on OpenBSD and
    via the ports system as net/ifstated on FreeBSD. On OpenBSD, the /etc/ifstated.conf
    or /local/etc/ifstated.conf if you installed the port from FreeBSD contains an
    almost-ready-to-run configuration with a few pointers on how to set up ifstated
    for a CARPed environment.


    The main controlling objects are interfaces and their states—for example, carpo.link
    is the state where the carpo interface becomes master—and you perform actions
    in response to state changes.


    The states and actions to perform whenever the state of an interface changes are
    specified in a straightforward scripting language with basic features like variables,
    macros, and simple logical conditions. (See man ifstated and man ifstated.conf
    as well as the default ifstated.conf sample file supplied in your base system
    install for more on this topic and on implementing Carp-clustering features in
    your environment.)


    # CARP for Load Balancing


    Redundancy by failover is nice, but sometimes it''s less attractive to have hardware
    sitting around in case of failure and better to create a configuration that spreads
    the network load over several hosts.


    In addition to ARP balancing (which works by calculating hashes based on the source
    MAC address on incoming connections), CARP in OpenBSD 4.3 and higher supports
    varieties of IP-based load balancing, with traffic allocated based hashes from
    the connections'' source and destination IP addresses. Because ARP balancing is
    based on the source MAC address, it''ll only work for hosts in the directly connected
    network segment. On the other hand, the IP-based methods are appropriate for load-balancing
    connections to and from the Internet at large.


    The choice of method for your application will depend on the specifications of
    the rest of the network equipment you need to work with. The basic ip balancing
    mode uses a multicast MAC address to have the directly connected switch forward
    traffic to all hosts in the load-balancing cluster.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Unfortunately, the combination of a unicast IP address and multicast MAC address
    isn''t supported by some systems. In those cases, you may need to configure your
    load balancing in ip-unicast mode, which uses a unicast MAC address, and configure
    your switch to forward to the appropriate hosts. Or you may need to configure
    your load balancing in ip-stealth mode, which doesn''t use the multicast MAC address
    at all. As usual, the devil is in the details, and the answers are found in many
    pages and other documentation, most likely with a bit of experimentation thrown
    in.


    Traditionally, relayd has been used to intelligent load balancing as the frontend
    for servers that serve the rest of the world. In OpenBSD4.7, relayd acquired the
    ability to track uplinks and alter the system''s routing tables in link health,
    with the functionality wrapped in a bundle with the router keyword. For setups
    with possible uplinks or various routing tables, you can set up relayd to choose
    your uplink, or with a little help from the sysctl variables inet.ip.multipath
    perform load balancing across available routes and uplinks. The specifics vary
    with your networking environment. The relayd.conf page contains a complete example
    to get started.


    # CARP in Load-Balancing Mode


    In load-balancing, the CARP concept is extended by letting each interface be a
    member of multiple failover groups and as many load-balancing groups as there
    are physical hosts that will share the virtual address. In contrast with the failover
    case, where there can be only one master, each in a load-balancing cluster must
    be the master of its own group so that it can receive traffic. The choice of group—and
    by extension, physical host—is determined by CARP via a hash value calculation.
    This calculation is based on the connection''s source MAC address in the ARP-balancing
    case and on the source and destination IP address in the IP-balancing case and
    as well as actual availability. The downside to this scheme is that each group
    consumes run out of these IDs a bit more quickly in a load-balancing configuration
    when using failover only. In fact, there''s a hard upper limit to the number of
    CARP-based load-balancing clusters of 32 virtual hosts.


    The advertised pattern plays a similar role in load-balancing configurations as
    in the failover ones, but ifconfig (and hostname.hostname) for CARP load balancing
    is slightly different from that of the failover case.


    # Setting Up CARP Load Balancing


    Changing the CARPPrimer group built over the previous sections to a load-balancing
