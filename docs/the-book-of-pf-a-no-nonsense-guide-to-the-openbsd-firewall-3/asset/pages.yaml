    not be filtered once you enable PF and load the rule set. However, even if

    PF is enabled on your FreeBSD system, we haven''t gone around writing

    an actual rule set, so PF isn''t doing much of anything but passing packets.

    NetBSD implements a default or fallback rule set via the file /etc/defaults/

    pf.boot.conf This rule set is intended only to let your system complete its boot

    process in case the /etc/pf.conf file does not exist or contains an invalid rule

    set. You can override the default rules by putting your customizations

    in /etc/pf.conf.


    # A Simple PF Rule Set: A Single, Stand-Alone Machine


    Mainly to have a common, minimal baseline, we will start building rule sets

    from the simplest possible configuration.


    # A Minimal Rule Set


    The simplest PF setup is on a single machine that will not run any

    services and talk to only one network, which may be the Internet.

    We''ll begin with an /etc/pf.conf file that looks like this:


    ```

    block in all

    pass out all keep state

    ```'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'This rule set denies all incoming traffic, allows traffic we send, and retains
    state information on our connections. PF reads rules from top to bottom; the *last*
    rule in a rule set that matches a packet or connection is the one that is applied.


    Here, any connection coming into our system from anywhere else will match the
    block `in rule`. Even with this tentative result, the evaluation will continue
    to the next rule (pass out keep state), but the traffic will not match the first
    criterion (the out direction) in this rule. With no more rules to evaluate, the
    status will not change, and the traffic will be blocked. In a similar manner,
    any connection initiated from the machine with this rule will not match the first
    rule (again, but will match the second rule, which is a pass rule, and the connection
    is allowed to pass.


    We''ll examine the way that PF evaluates rules and how ordering matters in a bit
    more detail in Chapter 3, in the context of a slightly longer rule.


    For any rule that has a keep state part, PF keeps information about the connection,
    including various counters and sequence numbers, as an entry in the *state table*.
    The state table is where PF keeps information about existing connections that
    have already matched a rule, and new packets arrive are compared to existing state
    table entries to find a match. Only when a packet doesn''t match any existing
    state PF move on a full rule evaluation, checking whether the packet matches a
    rule in the loaded rule set. We can also instruct PF to act on state information
    in various ways, but in a simple case like this, our main goal is to return traffic
    for connections we initiate to return to us.


    Note that OpenBSD 4.1 and later, the default for rules is to keep state information,
    and we no longer need to keep state explicitly in a simple case like this. This
    means the rule set could be written like this:


    +   # minimal rule set, OpenBSD 4.1 onward keeps state by default

    block in all

    pass out


    In fact, you could leave out the all keyword here if you like. The other BSDs
    have mostly caught up with this change now, and for the rest of this book, we''ll
    stick to the newer rules, with an occasional reminder in case you are using an
    older system.


    It goes pretty much without saying that passing all traffic generated by a specific
    host is, in fact, trustworthy. This is something you do if this is a machine you
    can trust.


    In fact, the new default corresponds to keep state flags S/5A, ensuring that any
    SYN packets during connection setup state, eliminating puzzling error scenarios.
    To filter stateless, you can specify no state for the rules where you don''t want
    to record or keep state information. On FreeBSD, OpenBSD 4.1-equivalent PF code
    was merged into version 7.0. If you''re using a PF version old enough that does
    not have this default, it is a very strong indicator that you should consider
    upgrading your operating system as soon as possible.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'When you''re ready to use this rule set, load it with the following:


    ```

    $ sudo pfctl -ef /etc/pf.conf

    ```


    The rule set should load without any error messages or warnings. On all but the
    slowest systems, you should be returned to the $ prompt immediately.


    # Testing the Rule Set


    It''s always a good idea to test your rule sets to make sure they work as expected.
    Proper testing will become essential once you move on to more complicated configurations.


    To test the simple rule set, see whether it can perform domain name resolution.
    For example, you could see whether host nochart.com returns information, such
    as the IP address of the host nochart.com and the names of your domain''s mail
    changers. Or just whether you can surf the Web. By name, the rule set allows your
    system to connect to external websites and perform domain name resolution. Basically,
    any service you try to access from your system should work, and any service you
    try to access on your system from another machine should produce a Connection
    refused message.


    # Slightly Stricter: Using Lists and Maps for Readability


    The rule set in the previous section is an extremely simple—probably too simplistic
    for practical use. But it''s a useful starting point to build from to create a
    slightly more structured and complete setup. We''ll start by denying all services
    and protocols and then allow only those that we need, using lists and maps for
    better readability and control.


    A list is simply two or more objects of the same type that you can refer in a
    rule set, as this: }


    ```

    pass proto tcp to port { 22 80 443 }

    ```


    > Here, ( 22 80 443 ) is a list. Macro is a pure readability tool. If you have
    objects that you''ll refer to more than one in your configuration, such as an
    IP address for important host, it could be useful to define a macro instead. For
    example, you might define this macro early in your rule set:


    ```

    external_mail = 192.0.2.12

    ```


    +   Why relate the rule set to default deny? The short answer is that it gives
    you better control. The point of packet filtering is to take control, not to play
    catch-up with the bad guys go. Marcus Ranum has written a very interesting and
    informative article about this "The Dumbest Ideas in Computer Security" (http://www.ranum.com/security/computer_security/editorials/dumb/index.html).'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Then you could refer to host as $external_mail later in the rule set:

    pass proto tcp to $external_mail port 25


    These two techniques have great potential for keeping your rule sets

    readable, and as such, they are important factors that contribute to the

    overall goal of keeping you in control of your network.


    # A Stricter Baseline Rule Set


    Up to this, we''ve been rather permissive with regard to any traffic we

    generate ourselves. A permissive rule set can be very useful when we check

    basic connectivity is in place or we check whether filtering is part of

    problem we''re seeing. The "Do we have connectivity?" phase is over,

    t to start tightening up to create a baseline that keeps us in control.

    To begin, add the following rule to /etc/pf.conf:


    ```

    block all

    ```


    This rule is completely restrictive and will block all traffic in all direc-

    tions. This is the initial baseline filtering rule that we''ll use in complete

    rule sets over the next few chapters. We basically start from zero, with a con-

    figuration nothing is allowed to pass. Later on, we''ll add rules that cut

    tour traffic more slack, as we''ll do so incrementally and in a way that keeps\us
    firmly in control.


    Next, we''ll define a few macros for later in the rule set:


    ```

    tcp_services = "{ ssh, smtp, domain, www, pop3, auth, https, pop3s }"

    udp_services = "{ domain }"

    ```


    Here, we can see how the combination of lists and macros can be turned

    to our advantage. Macros can be lists, and as demonstrated in the example,

    PF understands rules that use the names of services as well as port numbers,

    listed in your /etc/services file. We''ll take care to use all these elements

    and further readability tricks as we tackle complex situations that

    require more elaborate rules.


    Having defined macros, we can use them in our rules, which we''ll

    now edit to look like this:


    ```

    block all

    pass proto tcp to port $tcp_services

    pass proto udp to port $udp_services

    ```


    The strings $tcp_services and $udp_services are macro references.

    Macros that appear in a rule set are expanded in place when the rule set

    loads, and the running rule set will have the full lists inserted where

    macros are referenced. Depending on the exact nature of the macros,

    may cause single rules with macro references to expand into several rules.

    Even in a small rule set like this, the use of macros makes the rules easier'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'to grasp and maintain. The amount of information that needs to appear in the
    rule set shrinks, and with sensible macro names, the logic becomes clearer. To
    follow the logic in a typical rule set, more often than not, don''t need to see
    full lists of IP addresses or port numbers in place of every reference.


    From a practical rule set maintenance perspective, it''s important to keep in
    which services allow on which protocol in order to keep a comfortably tight regime.
    Keeping separate lists of allowed services according to protocol is likely to
    be useful in keeping your rule set functional and readable.


    # TCP VS. UDP


    We''ve taken care to separate out UDP services from TCP services. Several services
    run primarily on well-known port numbers on either TCP or UDP, and a few alternate
    using TCP and UDP according to specific conditions.


    The two protocols are quite different in several respects. TCP is connection oriented
    and reliable, a perfect candidate for state filtering. In contrast, UDP is stateless
    and connectionless, PF creates and maintains data equivalent to state information
    for UDP traffic in order to ensure UDP return traffic is allowed back if it matches
    an existing state.


    One common example where state information for UDP is useful when handling name
    resolution. When you ask a name server to resolve a domain name to an IP address
    or to resolve an IP address back to a hostname, it''s reasonable to assume that
    you want to receive the answer. Retaining state information, or the functional
    equivalent about your UDP traffic, makes this possible.


    # Reloading the Rule Set and Looking for Errors


    After we''ve changed our pf.conf file, we need to load the new rules as follows:


    ```

    $ sudo pfctl -f /etc/pf.conf

    ```


    If there are no syntax errors, pfctl shouldn''t display any messages during the
    rule load.


    If you prefer to display verbose output, use the -v flag:


    ```

    $ sudo pfctl -vf /etc/pf.conf

    ```'
