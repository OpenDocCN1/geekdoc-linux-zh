  md: '# #6


    # ## TURNING THE TABLES FOR PROACTIVE DEFENSE


    ![](img/838f49667801fd8460438797800410dd_118_0.png)


    In the previous chapter, you saw how you might need to spend considerable time
    and energy making sure that the services you want to offer will be available even
    when you have strict packet filtering in place. Now, with your working setup in
    place, you''ll soon notice that some services tend to attract a little more unwanted
    attention than others.


    Here''s the scenario: You have a network with packet filtering to match your site''s
    needs, including some services need to be accessible from elsewhere. Unfortunately,
    when services are available, there''s a risk that someone will want to exploit
    them for some sort of mischief.

    You''ll almost certainly have remote login via SSH (Secure Shell), as well as
    SMTP email running on your network—both are tempting targets. In this chapter,
    we''ll look at ways to make it harder to gain unauthorized access via SSH, and
    then we''ll turn to some of the more effective ways to deny spammers use of your
    servers.'
