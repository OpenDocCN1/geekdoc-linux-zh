  md: '# BUILD A

    MORE SECURE

    NETWORK

    WITH PF


    Covers OpenBSD 5.6,

    FreeBSD 10.x, and

    NETBSD 6.x


    OpenBSD''s masterful packet filter, PF, is the heart of the OpenBSD firewall.
    With more and more services placing high demands on bandwidth and an increasing-increasingly
    hostile Internet environment, no sysadmin can afford to be without PF expertise.


    +   - Build adaptive firewalls to proactively defend against attackers and spammers


    +   - Harness OpenBSD''s latest traffic-shaping system to keep your network responsive,
    and convert your existing ALTQ configurations to the new system


    The third edition of The Book of PF covers the most up-to-date developments in
    PF, including new content on IPv6, dual stack configurations, the "queues and
    priorities" traffic-shaping system, NAT and redirection, wireless networking,
    spam fighting, failover provisioning, logging, and more.


    +   - Stay in control of your traffic with monitoring and visualization tools
    (including NetFlow)


    The Book of PF is the essential guide to building a secure network with PF. With
    a little effort and this, you will be well prepared to unlock PF potential.


    You''ll learn how to:


    # ABOUT THE AUTHOR


    +   - Create rule sets for all kinds of network traffic, crossing a simple LAN,
    hiding behind NAT, traversing DMZs, or spanning bridges or wider networks


    +   - Set up wireless networks with access points, and lock them down using authpf
    and special access restrictions


    Peter N.M. Hansteen is a consultant, writer, and sysadmin based in Bergen, Norway.
    A longtime Freenex advocate, is a frequent contributor to OpenBSD and FreeBSD
    Magazine, and the author of often-slashed dot blog (http://bsdl.blogspot.com/).
    Hansteen was a participant in the original RFC 1149 implementation team. The Book
    of PF is an expanded follow-up to his very popular online PF tutorial (http://home.nuvg.no/-peter/pf/).


    +   - Maximize flexibility and service availability via CARP, relayd, and redirection


