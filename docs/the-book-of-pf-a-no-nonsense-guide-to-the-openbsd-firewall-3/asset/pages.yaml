    First, because packet forwarding is off by default in BSDs, we need turn it on
    in order to forward the network traffic it receives on one interface to others
    via one or more separate interfaces. Initially, we''ll do this on the command
    line with a sysctl command for traditional IPv4:


    ```

    # sysctl net.inet.ip.forwarding=1

    ```


    If we need to forward IPv6 traffic, we use this sysctl:


    ```

    # sysctl net.inet6.ip6.forwarding=1

    ```


    This is fine for now. However, in order for this to work once you reboot the computer
    you need to enter these settings into the relevant configuration files.

    In OpenBSD and NetBSD, you do this by editing /etc/sysctl.conf and adding IP-forwarding
    lines to the end of the file so the last lines look like this:


    ```

    net.inet.ip.forwarding=1

    net.inet6.ip6.forwarding=1

    ```


    In FreeBSD, make the change by putting these lines in /etc/sysctl.conf:


    ```

    gateway_enable="YES" #for ipv4

    ip6_gateway_enable="YES" #for ipv6

    ```


    The effect is identical; the FreeBSD rc script sets the two values via sysctl
    commands. A larger part of the FreeBSD configuration is centralized into the rc.conf
    file.

    Now it''s time to check whether all of the interfaces you intend to use are up
    and running. Using ifconfig -a or ifconfig interface_name to find out. The output
