    # Tracking Statistics for Each Rule with Labels


    The sequential information you get from retrieving log data basically tracks packet
    movements over time. In other contexts, the sequence or history of connections
    is less important than aggregates, such as the number of bytes that have matched
    a rule since the counters were cleared.


    At the end of Chapter 2, you know how to use pfctl -s info to view the global
    aggregates, with other data. For a more detailed breakdown of the data, track
    traffic on a per-rule basis with a slightly different format of pfctl command,
    such as rules, to display along with rule, as here show:


    ```

    pfctl -vs rules

    pass in tcp proto from any to 192.02.2.225 = smtp flags S/A keep state label "mail-in"

    [ Evaluations: 1664158 Packets: 16019886 Bytes: 763762591 States: 0 ]

    [ Inserted: oid 0 pid 24490 ]

    ```


    ```

    pass in tcp proto from any to 192.02.2.225 = smtp flags S/A keep state label "mail-out"

    [ Evaluations: 2814933 Packets: 27112211 Bytes: 492510664 States: 0 ]

    [ Inserted: oid 0 pid 24490 ]

    ```


    The format of output is easy to read, and it''s obviously designed for contexts
    in which you want to get an idea of what is going on a glance. If you specify
    more verbose output with pfctl -vs rules, you''ll see essentially the same display,
    with rule numbers added. On the other hand, the output from this command isn''t
    well suited for feeding to a script or other program for processing. To extract
    these statistics and a few more items in a script-friendly format—and to make
    your own decisions about which rules are worth tracking—use rule labels.'
