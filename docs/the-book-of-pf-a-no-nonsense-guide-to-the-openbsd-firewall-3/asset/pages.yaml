- img_proc: true
  md: 'As the research project behind BSD development started winding down in the
    early 1990s, the code was liberated for further development by small groups of
    enthusiasts around the world. Some of these enthusiasts were responsible for keeping
    vital parts of the emerging Internet''s infrastructure running reliably, and BSD
    development continued along parallel lines in several groups. The OpenBSD group
    became known as the most security-oriented of the BSDs. For its packet-filtering
    needs, it used a subsystem called IPFilter, written mainly by Darren Reid. During
    these early years, OpenBSD quickly earned a positive reputation as “THE firewall
    OS,” and it’s still quite common for people to believe that OpenBSD was developed
    specifically for purpose.


    It shocked the OpenBSD community when Reid announced in early 2001 that IPFilter,
    at which point was intimately integrated with OpenBSD, was not covered under the
    BSD license. Instead, it used almost a word-for-word copy of the code, omitting
    the right to make changes to the code and distribute the result. The problem was
    that the OpenBSD version of IPFilter contained several changes and customizations,
    as it turned out, were not allowed under the license. As a result, IPFilter was
    deleted from the OpenBSD source tree on May 29, 2001, and for a few weeks, the
    development version of OpenBSD (current) didn’t include any packet filter software.


    Fortunately, at this time, in Switzerland, Daniel Hartmaier performing some limited
    experiments kernel hacking in the working code. He began by hacking a small function
    of his own into the networking stack and then making packets through it. Then,
    he began about filtering. When the license crisis happened, PF was already under
    development on a small scale. The first commit of the PF code was on Sunday, June
    24, 2001, at 19:48:58 UTC. A few moments of intense activity by many developers
    followed, and the resulting version of PF was launched as a default part of the
    OpenBSD 3.0 base system in December of 2001. This version contained an implementation
    of packet filtering, including network address translation, with a configuration
    language that was similar enough to IPFilter’s migrating to the new OpenBSD version
    did not pose major problems.


    +   4. The IPFilter copyright spurred the OpenBSD team to perform a license audit
    of the entire source tree to avoid similar situations in the future. Potential
    problems were resolved over the months that followed, resulting in the removal
    of a number of license pitfalls for everyone involved in free software development.
    De Raadt summed up the effort in a message to the open-source mailing list on
    February 20, 2003. The initial drama of the license crisis blew over, and the
    get in was not a problem for the filtering system under a free license, with the
    best code quality available, as well as free benefits for a large body of code
    in OpenBSD itself and in widely used free software.


    +   5. Compatibility with IPFilter configurations was an early design goal for
    the PF developers, but it stopped being a priority once it could be assumed that
    all OpenBSD users had moved to PF (around the time OpenBSD 3.2 was released, if
    not earlier). Shouldn’t assume that an existing IPFilter configuration will work
    without any version of PF. With the syntax changes introduced in OpenBSD 4.7,
    even upgrades from earlier PF versions will some correction.'
