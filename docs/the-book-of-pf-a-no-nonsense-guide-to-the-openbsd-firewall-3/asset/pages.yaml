    Now you should perform a structured walk-through of the loaded rule set. Find
    the rules that match the packets you investigating. What''s the last matching
    rule? If more than one rule matches, is one of them a quick rule? (As you probably
    recall from earlier chapters, when whatever the quick packet matches a quick rule,
    evaluation stops, and specifies what happens to the packet.) If so, you''ll need
    to evaluate until you hit the end of the set or the packet matches a quick rule,
    which ends the process. If your rule set ends somewhere other than the you were
    expecting to match your packet, you''ve found your logic error. Be sure to watch
    out for match rules. If you can''t determine why a specific packet matched a particular
    rule, the reason could be a match rule applied an action that made the packet
    or connection filtering criteria other than the expected ones.


    Rule set errors fail into three types:


    +   - Your rule doesn''t match because it''s evaluated. A quick error in the rule
    set, and the evaluation stopped.

    - Your rule is evaluated but doesn''t match the packet after, due to the rule''s
    criteria.

    - Your rule is evaluated and the rule matches, but the packet matches another
    rule in the rule set. The last matching rule is the one that determines what happens
    to your connection.


    Chapter 9 introduced tcpdump as a valuable tool for reading and interpreting logs.
    The program is also very well suited for viewing the traffic that passes on a
    specific interface. What you learned about PF''s logs and how to use tcpdump features
    will be quite handy when you want to track exactly which packets reach your interface.


    Here''s an example of using tcpdump for TCP traffic (but not SSH or traffic) on
    the x0 interface and put in the very version mode (vv):


    ```

    $ sudo tcpdump -nnvpi x0 and not port ssh and smtp

    tcpdump: listening on x0, link-type ENIOMQB

    21:41:42.424368. 137.54.107.19.22418 > 137.217.190.41:80 = [tcp [sum up

    3304313886:3304313886(0)] win 1460,nop,nop,sack,0,wscale

    nop,nop,nop,timestamp 1380370594 0 > (ttl 63, id 30934, len 64)

    21:41:42.424368. 137.217.190.41:80 > 194.54.107.19.22418 = [tcp [sum up

    1755375376798:1375376798(0)] ack 3304313886 win 572 1460,sack,0,timestamp

    1688992131 1380370594,wscale 9> (ttl 55, id 0, len 60)

    ```'
