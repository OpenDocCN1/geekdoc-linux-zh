- img_proc: true
  md: '# Logging to Several plog Interfaces


    Versions of PF newer than OpenBSD 4.1 make it possible to direct your log data
    to more than one plog interface. In OpenBSD 4.1, the plog interface became a clone
    device, meaning that you can use ifconfig to create several plog interfaces, in
    addition to the default plog. This makes it possible to record the log data for
    different parts of your rule set to separate plog interfaces, and it makes it
    easier to process the resulting data separately if necessary.


    Moving from the default single plog interface to several plog interfaces requires
    some changes to your setup that are subtle but effective. To log to several interfaces,
    make sure that all the interfaces your rule set uses are created. You don''t need
    to create the devices before the rule set is loaded; if your rule set logs to
    a nonexistent interface, the log data is simply discarded.


    When tuning your setup to several plog interfaces, you''ll likely add the required
    interfaces from the command line, like so:


    ```

    $ ifconfig create plog1

    ```


    Specify the log device when you add the log keyword to your rule set, as follows:


    ```

    pass log (plog1) proto tcp to $emailserver port $email\pass log (plog1) proto
    tcp from $emailserver to smtp

    ```


    For a more permanent configuration on OpenBSD, create a hostname.plog1 file containing
    only up and similar hostname.plogV for any additional logging interfaces.


    On FreeBSD, the configuration of the cloned plog interfaces belongs in your rc.conf
    file in the following form:


    ```

    ifconfig_plog1="up"

    ```


    As of this writing, cloning plog interfaces on NetBSD isn''t an option.

    As you saw in Chapter 6, directing log information for different parts of your
    rule set to separate interfaces makes it possible to feed different parts of the
    log data PF produces to separate applications. This makes it easier to have programs
    likelog process only the relevant information, while you feed other parts of your
    PF log data to other log-processing programs.


    # Logging to syslog, Local or Remote


    One way to avoid storing log data on the gateway itself is to instruct your gateway
    to log to another machine. If you already have a centralized logging infrastructure
    in place, this is a fairly logical thing to do, even if PF''s ordinary logging
    mechanisms weren''t really designed with traditional syslog-style logging in mind.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'As old BSD will tell you, the traditional syslog system log facility is a bit
    naive about managing the data it receives over UDP from other hosts, with denial-of-service
    attacks involving full disks one mentioned danger. There''s also the ever-present
    risk that log information will be under high load on either individual systems
    or the network. Therefore, consider setting up remote logging only if hosts communicate
    over a well-secured and properly dimensioned network. Most BSDs, syslog is not
    set up by default to accept log data from other hosts. The syslog man page for
    information about how to enable listening for log data from remote hosts if you
    plan to use syslog logging.


    If you''d like to do your PF logging the following is a short recipe for how to
    accomplish this. In ordinary PF setups, pflog copies the log data to the log file.
    When you want to store the log data on a remote system, you should disable pflog''s
    data accumulation by changing daemon''s startup option in rc.conf.local (on OpenBSD),
    like so:


    ```

    pflog_flags="NO"

    ```


    On FreeBSD and NetBSD, change the pflog_flats setting in rc.conf. Then kill the
    pflog process. Next, make sure that the log data, no longer collected by pflog,
    is transmitted in a meaningful way to your logger to the log-processing system.
    This step has two parts: First, set up your logger to transmit data and use tcpdump
    with logger to convert the data and inject it into your syslog system.


    To set up syslog to process the data, choose your log facility, log level, and
    action and produce the resulting line in etc/syslog.conf. These concepts are very
    well explained in main syslog.conf, which is required reading if you want to understand
    system logs. The action part is usually a file in a file system. For example,
    if you''ve already set up the system logger at loghost.example.com to receive
    your data, choose log facility local2 with level info and enter this line:


    ```

    local2.info @loghost.example.com

    ```


    Once you''ve made this change, restart syslog to make the new settings.


    Next, set tcpdump to convert the log data from the pflog device and feed it to
    logger, which will then send it to the system logger. Here, we reuse the tcpdump
    command from the basic examples earlier in this chapter, with some additions:


    ```

    $ sudo nohup tcpdump -lnetti pflog0 -t pf -p local2.info &

    ```


    The nohup command makes sure the process keeps running even if it doesn''t have
    a controlling terminal or it''s in the background (as we do here with the trailing
    &). The -l option to the tcpdump command specifies line-buffered output, which
    is useful for redirecting to other programs.'
  merge: -1
  pgno: 191
