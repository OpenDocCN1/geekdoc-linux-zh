  md: 'As mentioned earlier, MAC address filtering is not really a solid defense against
    attackers changing a MAC address is just too easy. The Open-BSD developers chose
    a radically different approach to this problem when they introduced authpf in
    OpenBSD 3.1. Instead of tying access to a hardware identifier, using the network
    card''s MAC address, they decided that the robust and highly flexible user authentication
    mechanisms in place were more appropriate for the task. The user authpf lets the
    system load PF on a per-user basis, effectively deciding which user gets to do
    what.


    To use authpf, you create users with the auth program as their shell. To order
    network access, the user logs in to the gateway using SSH. The user successfully
    completes SSH authentication, authpf loads the rules you have defined for the
    user or the relevant class of users.


    These rules, which usually are written to apply only to the IP address the user
    logged in from, stayed loaded and in force for as long as the user stays via the
    SSH connection. Once the SSH session is terminated, the rules are unloaded, and
    in most scenarios, non-SSH traffic from the user''s IP address is denied. With
    a reasonable setup, only traffic originated by authenticated users will be let.


    NOTE


    OpenBSD, authpf is one of the login classes offered by default, as you''ll notice
    the next time you create a user with aduser.


    For systems where the authpf login class is not available by default, you may
    need to add the following lines to /etc/login.conf file:


    ```

    authpf:

    :welcome=/etc/motd.authpf:

    :shell=/usr/sbin/authpf:

    :tc=default:

    ```


    The next couple of sections contain a few examples that may or not fit your situation
    directly but I hope will give you ideas you can use.


    # A Basic Authenticating Gateway


    Setting up an authenticating gateway with authpf involves creating and maintaining
    a few files besides your pf.conf. The main addition is authpf.rules. The other
    files are fairly static entities that you won''t be spending time on once they''ve
    been created.


    Start by creating an /etc/authpf/authpf.conf file. This file needs to be there
    in order for authpf to work, but it doesn''t actually need any content, so creating
    an empty file with touch is appropriate.


    macros:


    other bits of /etc/pf.conf. First, here are the interface


    ```

    ext_if = "reo"

    int_if = "athno",

    ```


    60 Chapter 4'
  merge: -1
