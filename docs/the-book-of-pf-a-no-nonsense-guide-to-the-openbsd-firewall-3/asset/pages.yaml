  md: 'CARP addresses are virtual addresses, and unless you have console access to
    all machines in your CARP group, you should almost always assign an IP address
    to the physical interfaces. With a unique IP address for each physical interface,
    you''ll be able to communicate with the host and be sure Without IP addresses
    assigned to physical interfaces, you could find yourself with a setup where the
    backup gateways are unable to communicate (except with hosts in networks where
    the physical interfaces have addresses assigned) until they become master in redundancy
    group and take over the virtual IP addresses.


    It''s reasonable to assume that the IP address assigned to the physical interface
    will belong in the same subnet as the virtual, shared address. It''s also important
    to be aware that this is, in fact, not a requirement—it''s even possible to configure
    CARP where the physical interface hasn''t been assigned an address. If you don''t
    specify a specific physical interface for the CARP interface, the kernel will
    try to assign the CARP address to a physical interface that''s already configured
    with an address in the same subnet as the CARP address. Even if it may not be
    required in simple configurations, it''s generally useful to make the interface
    selection explicit via the carpdev option in the ifconfig command that you use
    to set up the CARP interface.


    > If you reconfigure your network, the default gateway address goes from a specific
    interface and from to a virtual address, it''s nearly impossible to avoid a temporary
    loss of connectivity.


    # Setting Up CARP


    Most CARP setup lies in cabling (according to the schematic for your network),
    sysctl values, and issuing ifconfig commands. Also, on some systems, you''ll need
    to make sure that your kernel is set up with the required devices compiled in.


    # Checking Kernel Options


    OnBSD, both the CARP and pfsync devices are in the default GENERIC and GENERIC.MP
    kernel configurations. Unless you''re running a custom kernel without options,
    no kernel reconfiguration is necessary. If you''re running FreeBSD, make sure
    that the kernel has the CARP and pfsync devices compiled in because the default
    GENERIC kernel lacks these options. (See * FreeBSDBSD Handbook to learn how to
    compile and install a custom kernel with these options.)


    NetBSD should check that the kernel has pseudo-device CARP compiled because NetBSD''s
    default GENERIC kernel configuration doesn''t have it. (You''ll find the relevant
    line commented out in the GENERIC configuration file.) As of this writing, NetBSD
    doesn''t support pfsync due to protocol-numbering issues.'
  merge: -1
