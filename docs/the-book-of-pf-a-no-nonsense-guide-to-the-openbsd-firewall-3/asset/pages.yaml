  md: 'In situations where direct synchronization of spamd-related data is not practical
    or you simply want to share your spand-greytrap with others, exporting the contents
    of your list of locally trapped spammers to a text file may be desirable. The
    list format spand-setup is one address per line, optionally with comment lines
    starting with one or more # characters. Exporting your list of currently trapped
    addresses in a usable format can be as simple as putting together one-liner with
    spamd, grep, and a little imagination.


    # Detecting Out-of-Order MX Use


    OpenBSD 4.1 gave spamd the ability to detect out-of-order MX use. Contacting a
    secondary mail exchanger instead of trying the main one is a fairly well-known
    spammer trick and one that runs contrary to the behavior we expect from ordinary
    email transfer agents. In other words, if someone tries the emails in the wrong
    order, we can be sure that they''re delivering spam


    For our example.com domain with mail server 192.0.2.225 and backup 192.0.2.224,
    -M 192.0.2.224 to spamd''s startup options would mean that any host that tries
    to contact 192.0.2.224 via SMTP before contacting the main mail server at 192.0.2.225
    will be added to the local spamd-greytrap list for the next 24 hours.


    # Handling Sites that Do Not Play Well with Greylisting


    Unfortunately, there are situations where you''ll need to compensate for the peculiarities
    of other sites'' email setups.


    The first email message sent from any site that hasn''t contacted you will be
    delayed for some random amount of time, which depends mainly on the sender''s
    interval. There are times when even a minimal delay is undesirable. If, for example,
    you have some infrequent customers who demand your immediate and urgent attention
    to their business when they contact you, an initial delay of what could be to
    several hours may not be optimal. In addition, you are bound to encounter misconfigured
    mail servers that don''t retry at all or retry too quickly, stopping delivery
    retrieves after just one attempt.


    Also, some sites are large enough to have several SMTP servers, and they don''t
    play well with greylisting because they''re not guaranteed to retry delivery of
    any given message from the same IP address used with the prior delivery attempt.
    Even though those sites comply with the retry requirements, it''s obvious that
    this is one of the few remaining downsides of greylisting.'
