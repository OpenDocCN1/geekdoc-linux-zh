  md: 'The corresponding rule set specification looks something like this:


    +   - Machines outside our network should have access to the services offered
    by our servers in the DMZ and should not have access to the local network.


    +   - The machines in our local network, attached to $int_if, should have access
    to the services offered by the servers in the DMZ and access to a defined list
    of services outside our network.


    +   - The machines in the DMZ should have access to some network services in the
    outside world.


    The task at hand is to make sure the rule set we have in place actually implements
    the specification. We need to test the setup. A useful test would be to try the
    sequence in Table 10-1.


    Your configuration may call for other tests or could your real-life test scenario
    specify how packets and connections should be logged. The main point is that you
    should decide what the expected and desired result for each of your test cases
    before you start testing.


    In general, you should test using the applications you expect the typical user
    to have, such as Web browsers or mail clients on various operating systems. The
    connections should simply succeed or fail, according to specifications. If one
    of your basic tests gives an unexpected result, move on debugging your rule set.


    # Table 10-1: Sample Rule Set Test Case Sequence


    | Test Action | Expected Result |

    | Try a connection from the local network to each allowed port on the servers
    in the DMZ | The connection should pass. |

    | Try a connection from the local network to each allowed port on servers outside
    your network | The connection should pass. |

    | Try a connection from any port from the DMZ to the local network | The connection
    should be blocked. |

    | Try a connection from the DMZ to each allowed port on servers outside your network
    | The connection should pass. |

    | Try a connection from outside your network to $webserver in the DMZ on each
    port in ports | The connection should pass. |

    | Try a connection from outside your network to $webserver in the DMZ on port
    25 [SMTP] | The connection should be blocked. |

    | Try a connection from outside your network to $emailserver in the DMZ on port
    80 [HTTP] | The connection should be blocked. |

    | Try a connection from outside your network to $emailserver in the DMZ on port
    25 [SMTP] | The connection should pass. |

    | Try a connection from outside your network to one or more machines in the local
    network. | The connection should be blocked. |'
