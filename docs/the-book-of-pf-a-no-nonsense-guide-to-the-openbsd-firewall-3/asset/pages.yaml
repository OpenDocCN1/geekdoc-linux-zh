- img_proc: true
  md: 'To establish the kind of protection depicted in the diagram, specify antispoof
    for both ext_if interfaces in the illustrated network with these two lines:


    ```

    antispoof for $ext_if

    antispoof for $int_if

    ```


    These lines expand to complex rules. The first blocks incoming traffic when the
    source address appears to be part of the network directly connected to the antispoof
    interface but arrives on a different interface. The second rule performs the same
    functions for the internal interface, blocking any traffic with apparently local
    network addresses that arrive on interfaces other than $int_if. Keep in mind,
    however, that antispoof isn''t designed to detect address spoofing for remote
    networks that aren''t directly connected to the machine running PF.


    # Testing Your Setup


    Now it''s time to dust off the precise specification that describes how your setup
    should work. physical layout of our sample network is centered on a gateway connected
    to the Internet via $ext_if. Attached to the gateway via $int_if is a local network
    with workstations and possibly one or more servers for local use. Finally, we
    have a DMZ connected to $dmz_if, populated with servers offering services to the
    local network and the Internet. Figure 10-2 shows the logical layout of the network.


    ![](img/838f49667801fd8460438797800410dd_218_0.png)


    Figure 10-2: Network with servers in a DMZ'
