- img_proc: true
  md: '+   - RFC 1918, Address Allocation for Private Internets, February 1996 (http://www.ietf.org/rfc/rfc1918.txt,
    written by Y. Rehter, B. Moskowitz, D. Karrenberg, G.J., de Groot, and E. Learn)
    is the second part of the NAT and private address space puzzle. This RFC describes
    the motivations for the allocation of private, nonroutable address space and defines
    the address ranges. RFC 1918 has been designated a Best Current Practice.


    +   - If you''re looking for a text that gives you thorough and detailed treatment
    of network protocols with a clear slant toward the TCP/IP worldview, Charles M.
    Kozierok''s The TCP/IP Guide (No Starch Press, October 2005), available online
    at http://www.tcpipguide.com/, has few, if any, serious rivals. At more than 1,600
    pages, it''s not exactly a pocket guide, but it''s very useful to have on your
    desk or in a browser window to set the record straight on any networking terms
    that you find insufficiently explained in other texts.


    # # Sample Configurations and Related Musings


    A number of people have been kind enough to write up their experiences and make
    sample configurations available on the Web. The following are some of my favorites.


    +   - Marcus Ranum’s “The Dumbest Ideas in Computer Security” (http://www.ranum.com/security/computer_security/editorials/dumb/index.html),
    from September 1, 2005, is a longtime favorite of mine. This article explores
    some misconceptions about security and their unfortunate implications for real-world
    security efforts.


    +   - Randall L. Schwartz’s “Monitoring Traffic with OpenBSD’s Packet Filter”(http://www.stonehenge.com/merlyn/UnixReview/col5.html)
    shows a real-life example of traffic monitoring and using labels for accounting.
    Some details about PF and labels have changed in the intervening years, but the
    article is still quite readable and serves several important concepts well.


    +   - The Swedish group Unix.se’s Brandvägg med OpenBSD(http://unix.se/Brand%C3gg_OpenBSD)
    and its sample configurations, such as the basic ALT configurations, were quite
    useful to me early on. The site serves as a nice reminder that volunteer efforts,
    as local user groups, can be excellent sources of information.


    +   - The #pfIRC channel wiki (http://www.probs.net/pf/) is a collection of documentation,
    sample configurations, and other PF information maintained by participants in
    the #pfIRC discussions. It’s another example of a very worthwhile volunteer effort.'
