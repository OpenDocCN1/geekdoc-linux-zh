    # Logging the Packet''s Path Through Your Rule Set: log (matches)


    Early versions of the PF logging code didn''t find an easy way to track all rules
    that a packet would match during rule-set traversal. This omission became more
    evident before match rules were introduced in OpenBSD 4.6 and PF users were offered
    a more convenient and easier way to subject packets and connections to transformations,
    such as addressing rewriting, match rules allow you to perform actions on a packet
    or connection independently of the eventual pass or block decision. The specified
    actions—as nat-to, rdr-to, and few others—are performed immediately. This can
    lead to situations in which a packet has been transformed by a match rule and
    no longer matches criteria in a filtering rule appears later in the rule set that
    would have matched if the transformation hadn''t already occurred. One fairly
    basic example is a match rule that applies nat-to on the external interface, placed
    before any pass rules in the rule set. Once the nat-to action has been applied,
    any filtering criteria that would have matched the packet''s original source address
    would no longer match the packet.


    This greater versatility makes rule sets harder to debug (typically with several
    match rules that perform transformations), and it became clear that a new logging
    option was needed.


    PF developers had been seeing the logging code for a rewrite for some time, and
    by the time the logging system was rewritten for the OpenBSD 4.9, the restructured
    code made it easy to introduce the log option matches to help debug rule sets
    and to track a packet through path rule sets where several sets of match or pass
    rules transform the packet.


    Adding log (matches) to a rule forces the logging of all matched rules once a
    packet matches a rule containing a log (matches) clause. Such as


    164 Chapter 9'
