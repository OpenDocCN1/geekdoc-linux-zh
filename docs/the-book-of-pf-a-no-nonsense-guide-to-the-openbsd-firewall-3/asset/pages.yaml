- img_proc: true
  md: 'In order to perform its job properly, spamlogd needs to log SMTP connections
    to and from your mail servers, just as we did in the sample rate sets in Chapter
    5:


    ```

    emailserver = "192.0.2.225"

    pass log proto tcp to $emailserver port $email

    pass log proto tcp from $emailserver port smtp

    ```


    OpenBSD 4.1 and higher (and equivalents), you can create several pfig interfaces
    and specify where rules should be logged. Here''s how to separate the data spamlogd
    needs to read from the rest of your PF logs:


    +   1. Create a separate pfiglog interface using ifconfig pfiglog create, or create

    a hostname.pfiglog file with just the line up.

    2. Change the rules to the following:


    ```

    pass log (pfiglog) proto tcp to $emailserver port $email

    pass log (pfiglog) proto tcp from $emailserver port smtp

    ```


    +   3. Add -1 pfiglog to spamlogd''s startup parameters.


    This separates the spamd-related logging from the rest. (See Chapter 9

    for about logging)

    With the preceding rules in place, spamlogd will allow the IP addresses that

    receive email you send to the whitelist. This isn''t an iron guarantee that

    t reply will pass immediately, but in most configurations, it helps speed

    things significantly.


    # Greytrapping


    We know that spammers rarely use a fully compliant SMTP implementation

    to send their messages, which is why greylisting works. We also know

    that spammers rarely check the addresses they feed their hijacked

    machine are actually deliverable. Combine these facts, and if you see that

    greylisted machine tries to send a message to an invalid address in your

    domain, there''s a good chance that the message is spam or malware.


    This realization led to the next evolutionary step in spam development—na technique
    dubbed greytrapping. When a greylisted host tries to deliver\mail to a known bad
    address in our domains, the host is added to a

    maintained blacklist called spam-greytrap. Members of the spam-greylist list

    are treated to the same 1-byte-per-second tarpitting as members of other

    blacklists.

    Greytrapping as implemented in spam is simple and elegant. The main

    thing you need as a starting point is spam running in greylisting mode.

    The other crucial component is a list of addresses in domains your servers

    handle for, but only ones that you''re sure will receive legitimate

    mail. The number of addresses in your list is unimportant, but there

    must be at least one, and the upper limit is mainly defined by how many

    addresses you wish to add.'
