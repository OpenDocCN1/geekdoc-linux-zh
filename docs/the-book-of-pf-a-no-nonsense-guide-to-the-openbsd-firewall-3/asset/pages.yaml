  md: '# FOREWORD

    from the first edition


    OpenBSD''s PF packet filter has enjoyed a lot of

    success and attention since it was first released in

    OpenBSD 3.0 in late 2001. While you''ll find out

    more about PF''s history in this book, in a nutshell,

    PF happened because it was needed by the developers and users of

    BSD. Since the original release, PF has evolved greatly and

    became the most powerful free tool available for firewalling, load balanc-

    ing, and traffic management. When PF is combined with CARP and pfsync,

    PF lets system administrators not only protect their services from attack,

    and it makes those services more reliable by allowing for redundancy,

    and it makes them faster by scaling them pools of servers managed

    through PF and relayed.


    While I have been involved with PF''s development, I am first and fore-most a
    large-scale user of PF. I use PF for security, to manage both

    internal and external, and to help me run large pieces of critical infra-structure
    in a redundant and scalable manner. This saves my employer'
  merge: -1
  pgno: 16
- img_proc: true
  md: '(the University of Alberta, where I wear the headsadmin hat by day) money,
    both in terms of downtime and in terms of hardware and software. You can use PF
    to do the same.


    With these features comes the necessary evil of complexity. For someone well versed
    in TCP/IP and OpenBSD, PF''s system documentation is quite extensive and usable
    all on its own. But in spite of extensive examples in the system documentation,
    it is never possible to put all the things you can do with PF and its related
    set of tools front and center making the system documentation so large that it
    to be useful for those experienced people who need to use it as a reference.


    This book bridges the gap. If you are a relative newcomer, it can get you to speed
    on OpenBSD and PF. If you are a more experienced user, this book can show you
    some examples of the more complex applications that help people with problems
    beyond the scope of the typical. For several years, Peter N.M. Hansteen has been
    an excellent resource for people learning how to apply PF in more than just “How
    do I make a firewall?” sense, and this book extends his tradition of sharing that
    knowledge with others. Firewalls are now ubiquitous enough that most people have
    one, or several. But this is not simply about building a firewall, it is about
    learning techniques for manipulating your network traffic and understanding those
    techniques enough to make your life as a system and network administrator easier.
    A simple firewall is easy to build or off the shelf, but a firewall you can live
    with and manage yourself is somewhat more complex. This book goes a long way toward
    flattening the learning curve and getting you not only about how to build a firewall,
    but how PF works and where its strengths can help you. This book is an investment
    to save you time. It will get you up and running the right way—faster, with fewer
    false starts and less time experimenting.


    **Bob Beck

    Director, The OpenBSD Foundation

    http://www.openbsdfoundation.org/

    Edmonton, Alberta, Canada'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# ACKNOWLEDGMENTS


    This manuscript started out as a user group lecture, first presented at the January
    27, 2005 meeting of the Bergen [BSD and] Linux User Group (BLUG). After I had
    translated the manuscript into English and expanded it slightly, Greg Lehey suggested
    I should stretch it a little further and present it as a half day tutorial for
    the AUUG 2005 conference. After a series of tutorial revisions, I finally started
    working on what was to become the book version in early 2007.


    The next two paragraphs are salvaged from the tutorial manuscript and still apply
    to this book:


    This manuscript is a slightly further developed version of a manuscript prepared
    for a lecture which was announced as (translated from Norwegian):


    > “This lecture is about firewalls and related functions, with examples from real
    life with the FreeBSD project''s PF (Packet Filter). PF offers firewalling, NAT,
    traffic control, and bandwidth management in a single, flexible, and sysadmin-friendly
    system. Peter hopes that the lecture will give you some ideas about how'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'to control your network traffic the way you want—keeping some things outside
    your network, directing traffic to specified hosts events, and of course, giving
    spammers a hard time.


    Some portions of content from the tutorial (and certainly all the really useful
    topics) made it into this book in some form. People who have offered significant
    useful input regarding early versions of this manuscript include Rolf Aarseth,
    David Snyder, Peter Postma, Henrik Kramshøj, Vegard Engen, Greg Lehigh, Ian Darwin,
    Daniel Hartmann, Mark Uemura, Hallvor Engen, and probably a few who will remain
    in my mail archive until I can grep them out of.


    I would like to thank the organizations for their kind support: the NUUG Foundation
    for a travel grant, which partly financed my AUG 2005 appearance; the AUG, UKUG,
    SANE, BSDCan, AsiaBSDCon, NUUG, BLUG and BSD-DK organizations for inviting me
    to speak at their events, and the FreeBSD Foundation for sponsoring my trips to
    BSDCan 2006 and EuroBSDCon 2006.


    Much like the first, the second edition was written mainly at night and on weekends,
    as well as during stolen moments at odd hours. I would like to thank my colleagues
    at FreeCode for allowing me some chunks of time to work on the second edition
    in other projects during the early months of 2010. I would also like to thank
    several customers, who have asked that their interesting and challenging projects,
    which inspired some of the configurations offered here. You know who you are.


    The reason this third edition exists is OpenBSD 5.5 introduced a new traffic shaping
    system that replaced ALTQ. Fortunately Bill Pollock and his team at No March Press
    agree that this functionality with several other improvements since the second
    edition were adequate reason to start work on the third edition during the second
    half of 2013.


    Finally, during the process of turning the manuscript into a book, several people
    did amazing things that helped this book become a better little. I am indebted
    to Bill Pollock and Adam Wright for excellent developmental editing; I would like
    to thank Henning Brauer for excellent technical review; heartfelt thanks to Eystein
    Roll Aarseth, Jakob Brevik Grimm, Hallvor Engen, Christen Solskogen, Ian Darwin,
    Jeff Martin, and Lars Noöden for valuable input on many parts of the manuscript;
    and, warm thanks to Megan Danch and Linda Reckental for their efforts in getting
    the first edition of the book into its place and Serena Yang for guiding the second
    and third editions to completion. Special thanks are to Dru Lavigne for making
    the introductions which led to this book getting written in the first place, instead
    of just hanging around as an online tutorial and occasional conference memorial.


    Last but not least, I would like to thank my dear wife, Birthe, and my daughter,
    Nora, for all their love and support, before and throughout the rather intense
    period that yielded the second and edition. This would not have been possible
    with-'
