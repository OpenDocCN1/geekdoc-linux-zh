    We replace the single gateway with a redundant pair of gateways that share a private
    network for state-information updates over pfsync. The result is shown in Figure
    8-2.


    ![](img/838f49667801fd8460438797800410dd_172_1.png)


    Figure 8-2: Network with redundant gateways'
