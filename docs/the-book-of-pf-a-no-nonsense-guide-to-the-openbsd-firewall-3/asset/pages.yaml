    sense because it''s likely the part of our network with the least restrictions
    on available bandwidth.


    # Using ALTQ to Handle Unwanted Traffic


    So far, we''ve focused on queuing as a method to make sure specific kinds of traffic
    are let through as efficiently as possible given the conditions that exist in
    and around your network. Now, we''ll look at two examples that present a slightly
    different approach to identify and handle unwanted traffic using queuing tricks
    you can use to keep miscreants in line.


    # Overloading to a Tiny Queue


    Think back to “Turning Away the Brutes” on page 94, where we used a combination
    of state-tracking options and overload rules to fill up a table of addresses for
    special treatment. The special treatment we demonstrated in Chapter 6 was to cut
    all connections, but it''s equally possible to assign overload traffic to a special
    queue instead.


    Consider this rule from our class-based bandwidth example in “Class-Based Bandwidth
    Allocation for Small Networks” on page 139.


    ```

    pass log quick on $ext_if proto tcp to port ssh flags S/SA \

    keep state queue (ssh_bulk, ssh_interactive)

    ```


    > We could add state-tracking options, as shown in here.


    ```

    pass log quick on $ext_if proto tcp to port ssh flags S/SA \

    keep state (max-src-conn 15, max-src-conn-rate 5/3),

    overload <bruteforce> global queue (ssh_bulk, ssh_interactive)

    ```


    Then, we could make one of the queues slightly smaller.


    queue smallpipe bandwidth 1kb cb


    Next, we could assign traffic from miscreants to the small-bandwidth queue with
    the following rule.


    ```

    pass inet proto tcp from <bruteforce> to port $tcp_services queue smallpipe

    ```'
  merge: -1
