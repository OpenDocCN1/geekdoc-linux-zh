    # # OpenBSD WPA Access Point


    WPA was introduced in OpenBSD 4.4, with extensions to most

    wireless network drivers, and all basic WPA keying functionality was merged to

    ifconfig(8) in OpenBSD 4.9.


    There may still be wireless network drivers that don''t have WPA support, so check

    t driver''s man page to see whether WPA is supported before you try to configure

    your network to use it. You can combine 802.1 key management with an external

    authentication server for "enterprise" via the security/wpa_supplicant package,

    but we''ll stick to the simpler preshared key setup for our purposes.


    The procedure for setting up an access point with WPA is quite simi-

    to the one you followed for. For a WPA setup with a preshared key

    (sometimes referred to as a network password), you would typically write a

    hostname.if file like this:


    ```

    media autoselect mediaopt host mode 11g 1 nwid unwiredbd wpkey 0xidebeef9

    inet6 alias 2001:db8::baad:food:1

    ```


    If you''re already running the WEP setup described earlier, disable

    those settings with the following:


    ```

    $ ifconfig ralo -nwid -mwkey

    ```


    Then, enable the new settings with this command:


    ```

    $ sudo sh /etc/netstart ralo

    ```'
