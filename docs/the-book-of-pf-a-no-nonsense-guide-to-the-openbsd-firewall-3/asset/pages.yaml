  md: '# 9


    # LOGGING, MONITORING,

    AND STATISTICS


    ![](img/838f49667801fd8460438797800410dd_184_0.png)


    Exercising control over a network—nwhether for your home networking needs

    or in a professional context—is likely to be

    a main objective for anyone who reads this

    book. One necessary element of keeping control is

    having access to all relevant information about what

    happens in your network. Fortunately for us, PF—like

    most components of Unix-like systems—is able to gen-

    erate log data for network activity.


    PF offers a wealth of options for setting the level of logging detail,

    processing log files, and extracting specific kinds of data. You can already

    do a lot with the tools that are in your base system, and several other tools

    are available via your package system to collect, study, and view log data

    in a number of useful ways. In this chapter, we take a closer look at PF

    logs in general and some of the tools you can use to extract and present

    information.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# PF Logs: The Basics


    The information that PF logs and the level of logging detail are up to you, as
    determined by your rule set. PF logging is simple: For each rule that you want
    to log data for, add the log keyword. When you load the rule set with log added
    to one or more rules, any packet starts a connection matching the logging rule
    (blocked, passed, or matched) is copied to a pflog device. The packet is logged
    as it is seen by PF and at the same time that the logging rule is evaluated.


    > In complicated rule sets, a packet may go through several transformations due
    to match or pass rules, and criteria that matched a packet when it entered the
    host might not match after a transformation.


    PF will also store additional data, such as the timestamp, interface, original
    source and destination IP addresses, whether the packet was blocked or passed,
    and the associated rule number from the loaded rule set.

    PF data is collected by the pflog daemon, which starts by default when PF is enabled
    at system startup. The default location for storing the log is /var/log/pflog.
    The log is written in a binary format, usually called packet capture format (pcap),
    which''s intended to be read and processed by tcpdump. We will discuss additional
    tools to extract and display information from your log file. The log file format
    is a well-documented and widely supported binary.

    To started, here''s a basic log example. Start with the rules you want to log
    and add the log keyword:


    ```

    block log

    pass log proto { tcp, udp } to port ssh

    ```


    Reload the rule set, and you should see the timestamp on your /var/log/pflog file
    change as the file starts growing. To see what''s being there, use tcpdump with
    the -r option to read the file.

    If logging has been going on for a while, entering the following on a command
    line can produce large amounts of output:


    ```

    $ sudo tcpdump -n -ttt -r /var/log/pflog

    ```


    For example, this are the first lines from a few screens, with almost all lines
    enough to wrap:


    ```

    $ sudo tcpdump -n -ttt -r /var/log/pflog

    tcpdump: WARNING: snaplen raised from 116 to 160

    Sep 13 13:00:30.556063 rule 10/(match) pass out on en0: 194.54.107.19.34834 >

    194.54.103.66:113 : S 3097635127:3097635127(0) win 16384 < 1460,nop,nop,sackOK,nop,wscale

    0,|[tcp] (OF)

    Sep 13 13:00:30.556063 rule 10/(match) pass out on fpx0: 194.54.107.19.34834 >

    194.54.103.66:113 : S 3097635127:3097635127(0) win 16384 < 1460,nop,nop,sackOK,nop,wscale

    0,|[tcp] (OF)

    ```'
