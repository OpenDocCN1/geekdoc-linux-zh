  md: '# INTRODUCTION


    ![](img/838f49667801fd8460438797800410dd_20_0.png)


    This is a book about building the network you need. We''ll dip into the topics
    of fire-walls and related functions, starting from a little theory. You''ll see
    plenty of examples of filtering and other ways to direct network traffic. I''ll
    assume that you have a basic to intermediate command of TCP/IP networking concepts
    and Unix administration.


    All the information in this book comes with a warning: As in many endeavors, the
    solutions we discuss can be done in more one way. And, of course, the software
    world is always changing and the best way to do things may have changed since
    this book was printed. This book was tested with OpenBSD version 5.6, FreeBSD
    10.0, and NetBSD 6.1, and any patches available in late July 2014.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# This Is Not a HOWTO


    The book is a direct descendant of my popular PF tutorial, and the third edition
    of the manuscript in book form. With all the work that''s gone into making this
    book a useful one over the years, I am fairly confident you will find it useful,
    and I hope you will find it an enjoyable read, too. But keep in mind that this
    document is not intended as a precooked recipe for cutting and pasting.


    Just to hammer this in, repeat after me:


    ```

    //The Pledge of the Network Admin//

    ```


    This is my network.


    It is mine,

    or technically, my employer''s.

    It is my responsibility,

    and I care for it with all my heart.


    There are many other networks a lot like mine,


    but none are just like it.


    I solemnly swear


    that I will mindlessly paste from HOWTOs.


    The point is that while I have tested all of the configurations in this book,
    they''re almost certainly at least a little wrong for your network as writ-ten.
    Please keep in mind that this book is intended to show you a few useful techniques
    and inspire you to achieve good things.


    Strive to understand your network and what you need to do to make it better and
    please not paste blindly from this document or any other.


    # What This Book Covers


    The book is intended to be a stand-alone document to enable you to work on your
    machines with only short forays into man pages and occasional reference to the
    online and printed resources listed in Appendix A.


    Your system probably comes with a prewritten pf.conf file containing commented-out
    suggestions for useful configurations, as well as few examples in the documentation
    directories such as /usr/share/pf/. These examples are useful as a reference,
    but we won''t use them directly in this book. Instead, you''ll learn how to construct
    a pf.conf from scratch.


    Here is a brief rundown of what you will find in this book:


    +   - Chapter 1, “Building the Network You Need,” walks through basic net-working
    concepts, gives a short overview of PF’s history, and provides'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   some pointers on how to adjust to the BSD way if you are new to this family
    of operating systems. Read this first chapter to get a sense of how to work with
    BSD systems.


    +   Chapter 2, "PF Configuration Basics," shows how to enable PF on your system
    and covers a very basic rule for a single machine. This chapter is crucial, since
    all the later configurations are based on the one you build here.


    +   Chapter 3, "Into the Real World," builds on the single-machine configuration
    in Chapter 2 and leads you through the basics of setting up a gateway as a point
    of contact between separate networks. By the end of Chapter 3, you will have built
    a configuration that is typical for a home or small office network, and have some
    tricks up your sleeve to make network management easier. You''ll also get an early
    taste of how to handle services with such requirements as FTP, as well some tips
    on how to make your network troubleshooting-friendly by catering to some of the
    frequently less understood protocols and services.


    +   Chapter 4, "Wireless Networks Made Easy," walks you through adding networking
    to your setup. The wireless environment presents some security challenges, and
    by the end of this chapter, you may find yourself with a wireless network with
    access control and authentication via authpf. Some of the information is likely
    to be useful in wired environments, too.


    +   Chapter 5, "Bigger or Trickier Networks," tackles the situation where you
    introduce servers and services that need to be accessible from outside your network.
    By the end of this chapter, you may have a network with one or several subsets
    and DMZs, and you will have tried your way at a couple of different load-balancing
    schemes via redirections and relay to improve service quality for your users.


    +   Chapter 6, "Turning the Tables for Proactive Defense," introduces some of
    the tools in the PF chest for dealing with attempts at undesirable activity, and
    shows how to use them productively. We deal with brute-force password-guarding
    attempts and network flooding, as well as the antispam tool spam, the OpenBSD
    spam daemon. This chapter should make your network more pleasant one for legitimate
