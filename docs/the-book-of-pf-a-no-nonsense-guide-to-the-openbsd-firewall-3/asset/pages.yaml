  md: '# 2

    PF CONFIGURATION BASICS


    ![](img/838f49667801fd8460438797800410dd_34_0.png)


    In this chapter, we''ll create a very simple setup with PF. We''ll begin with
    the simplest configuration possible: a single machine configured to communicate
    with a single network. This network could very well be the Internet.


    Your two main tools for configuring PF are your favorite text editor and the pfctl
    command-line administration tool. PF configurations, usually stored in `/etc/pf.conf`,
    are called rule sets because each line in the configuration file is a rule that
    helps determine what the packet-filtering subsystem should do with the network
    traffic it sees. In ordinary, day-to-day administration, you edit your configuration
    in the `/etc/pf.conf` file and then load your changes using pfctl. There are Web
    interfaces for PF administration tasks, but they''re not part of the base system.
    The PF developers aren''t hostile toward these options, they''ve yet to see a
    graphical interface for configuring PF that''s clearly preferable to editing `pf.conf`
    using pfctl commands.'
  merge: -1
