  md: 'One way to compensate for such situations is to define a table for a local
    whitelist to be fed from a file in case of reboots. To make sure SMTP traffic
    from the addresses in the table is not fed to spam, add a pass rule to allow the
    traffic to pass:


    ```

    table <nospamd> persist file "/etc/mail/nospamd"

    pass in log on egress proto tcp from <nospamd> to port smtp

    ```


    In pre-OpenBSD 4.7 syntax, add a rdr rule at the top of your redirection block
    and a matching rule to let SMTP traffic from the hosts through your nospamd table,
    as shown here:


    ```

    no rdr proto tcp from <nospamd> to $mailserver port smtp

    pass in log on egress proto tcp from <nospamd> to port smtp

    ```


    Once you''ve made these changes to your rule set, enable the addresses you need
    to protect from redirection into the /etc/nospamd file. Then reload your rule
    set using pfctl -f /etc/pf.conf. You can then use all the expected table tracks
    on the <nospamd> table, including replacing its content after editing the nospamd
    file. In fact, this approach is strongly hinted at in both pages and sample configuration
    files distributed with recent versions of spam.


    At least some sites with many outgoing SMTP servers publish information about
    which hosts are allowed to send email for their domain via Sender Policy Framework
    (SPF) records as part of the domain''s DNS information. To retrieve SPF records
    for our example.com domain, use the host command-ttxt as follows:


    ```

    $ host -ttxt example.com

    ```


    This command will produce an answer roughly like the following:


    ```

    example.com descriptive text "v=spf1 ip4:192.0.2/25 -all"

    ```


    Here, the text in quotes is the example.com domain''s SPF record. If you want
    email from example.com to arrive quickly and you trust the people there not to
    send or relay spam, choose the address range from the SPF record, add it to your
    nospamd file, and reload the <nospamd> table contents from the updated file.'
