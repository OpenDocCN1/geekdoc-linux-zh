- img_proc: true
  md: 'OnBSD, you can combine both steps into one by creating /etc/hostname.ral0 file,
    roughly like this:


    ```

    up mediaopt hostap 11g chan 1 nwid unwiredbsd mkey 0xidebeef9

    inet6 alias 2001:db8::baad:food:6

    ```


    Then, run sh /etc/netstart ral0 (as root) and wait for your next boot to complete.

    Notice that the preceding configuration is divided over several lines. The first
    line generates an ifconfig command that sets the interface with the correct parameters
    for the physical wireless network. The second line generates the commands that
    set the IPv4 address after the first command completes, followed by setting an
    IPv6 address for a dual-stack configuration. Because this is our access point,
    we set the channel explicitly, and enable weak WEP encryption by setting the mkey
    parameter you can normally combine all of these parameters in your rc.conf:


    ```

    ifconfig_ral0=mediaopt hostap 11g chan 1 nwid unwiredbsd mkey

    0xidebeef inet 10.50.90.1 netmask 255.255.255.0 inet6 2001:db8::baad:food

    prefix len 64

    ```


    FreeBSD 8 and newer versions take a slightly different approach, employing wireless
    network devices to the unified wlan(4) driver. Depending on your kernel configuration,
    you may need to add the relevant module loads to /boot/loader.conf. On one of
    your systems, /boot/loader.conf looks like this:


    ```

    if_run_load="YES"

    wlan_scan ap_load="YES"

    wlan_scan_sta_load="YES"

    wlan_wep_load="YES"

    wlan_ccmp_load="YES"

    wlan_tkip_load="YES"

    ```


    With the relevant modules loaded, setup is a multicomand affair, best handled
    by a start_*.if file for your wireless network. Here is an example of /etc/start_i0rum0
    for a WEP access point on FreeBSD 8:


    ```

    wlan0="wlan0"

    create_args_wlan0="wlandev rum0 wlanmode hostap"

    ifconfig_inet0="inet 10.50.90.1 netmask 255.255.255.0 ssid unwiredbsd \

    weep on mkey 0xidebeef mode 11"

    ifconfig_ipv6="prefix len 64: 2001:db8::baad:food"

    ```


    After a successful configuration, your ifconfig output should show both the physical
    interface and the wlan interface up running:


    ```

    rum0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> metric 0 mtu 2290

    ether 00:24:1d:9a:bf:67

    ```'
