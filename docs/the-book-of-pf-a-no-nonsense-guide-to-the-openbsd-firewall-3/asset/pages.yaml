    # FreeBSD WPA Access Point


    Moving from the WEP point we configured earlier to a somewhat safer setup is straightforward.
    WPA support on FreeBSD comes in the form of hostapd (a program that is somewhat
    similar to OpenBSD''s hostapd but not identical). We start by editing the /etc/start_if0
    to remove the authentication information. The edited file should look something
    like this:


    ```

    wlans_rumo="wlan0"

    create_args wlan0="wland rumo wlanmode hostapd"

    ifconfig wlan0=inet 10.50.90.1 netmask 255.255.255.0 ssid unwiredbroad mode 11g"

    ifconfig wlan0_ipv6="2001:db8::baad:f0d:1 prefixlen 64"

    ```


    Next, add the enable line for hostapd in /etc/rc.conf:

    hostapd_enable="YES"


    And finally, hostapd will need some configuration of its own, in /etc/

    hostapd.conf:


    ```

    interface=wlan0

    debug=1

    ctrl_interface=/var/run/hostapd

    ctrl_interface_group=wheel

    ssid=unwiredbroad

    wpa=1

    wpa_passphrase=0xideadebeef9

    wpa_key_mgmt=WPA-PSK

    wpa_pairwise=CCMP TKIP

    ```


    Here, this interface specification is self-explanatory, the debug value is to
    produce minimal messages. The range is 0 through 4, where there is no debug messages
    at all. You shouldn''t need to change the ctrl_interface* settings unless you''re
    developing hostapd. The first of the next five lines'
