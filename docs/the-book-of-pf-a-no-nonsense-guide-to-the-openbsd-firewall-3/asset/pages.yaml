  md: 'Once you have a rule set where an otherwise unused anchor is defined, you can
    even manipulate anchor contents from the command line using pfctl -s a switch,
    like this:


    ```

    echo "block drop all" | pfctl -a baddies -f

    ```


    Here, a rule is inserted into the existing anchor baddies, overwriting any previous
    content.

    You can load rules from a separate file into an anchor:


    ```

    pfctl -a baddies -f /etc/anchor-baddies

    ```


    Or you can list the current contents of an anchor:


    ```

    pfctl -a baddies -s rules

    ```


    > There are a few pfctl options that you''ll find useful for handling anchors.
    See the pfctl man page for inspiration.


    You can also split your configuration by putting the contents of separate files
    to be loaded at rule-set load time. That becomes possible to edit the rules in
    the anchors separately, reload the edited anchor, and of course, do any other
    manipulation like the ones described above. To do this, add a line like this to
    pf.conf:


    ```

    anchor ssh-good load anchor ssh-good from "/etc/anchor-ssh-good"

    ```


    This references the file /etc/anchor-ssh-good, which could look like this:


    ```

    table <sshbuddies> file "/etc/sshbuddies"

    pass inet proto tcp from <sshbuddies> to any port

    ```


    Perhaps simply make it possible to delegate the responsibility for the table sshuddies
    to a junior admin, the anchor loads the table from the file /etc/sshbuddies, which
    could look like this:


    ```

    192.168.103.84

    10.11.12.13

    ```


    This way, you can manipulate the contents of the anchor in the following-ways:
    Add rules by editing the file and reloading the anchor, replace the rules by following
    other rules from the command line by standard input (as seen in the earlier example),
    or change the behavior of the rules inside the anchor by manipulating the contents
    of the table they reference.


    > For more anchors, the ones discussed in the following paragraphs, it''s probably
    more useful to include clauses in your pf.conf if you want to maintain the anchors
    as separate files.'
