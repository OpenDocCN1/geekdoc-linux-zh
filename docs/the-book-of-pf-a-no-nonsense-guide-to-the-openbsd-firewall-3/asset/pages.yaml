    \ earlier-priority example.\n- We speed up all other traffic (and most certainly\
    \ the Web traffic that appears to be the main priority here) by allocating a small\
    \ guaranteed portion of bandwidth for name lookups. The q_dns queue, we set up\
    \ the realtime value with a time limit—after 3000 milliseconds, the realtime allocation\
    \ goes down to 12Kb. This can be useful to speed connections that transfer most\
    \ of their payload during the early phases.\n\n# Rule Set\n\nNext, we tie the\
