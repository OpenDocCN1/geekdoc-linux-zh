    # The Power of Tags


    In some networks, the decision of whether a packet should be allowed to pass can''t
    be made to easily criteria like subnet and service. The finegrained the site''s
    demands could make the rule set complicated and potentially hard to maintain.


    Fortunately, PF offers another mechanism for classification and filtering in the
    form of packet tagging. The useful way to implement packet tagging is to tag incoming
    packets that match a specific rule and then let the packets pass elsewhere based
    on identifies the packet is tagged with. In OpenBSD 4.6 and later, it''s even
    possible to match rules that tag according to the criteria, leaving decisions
    on passing, redirecting, or taking other actions to rules later in the rule set.


    One example could be the wireless access points used in Chapter 4, which we could
    reasonably inject traffic into the local network with an apparent source address
    equal to the access point $ext_if address. In that scenario, a useful addition
    to the rule set of a gateway with several of these access points might be the
    following (assuming, of course, that defines of the $wifi_allowed and $wifi_ports
    macros fix the site''s requirements):


    ```

    wifi = "10.0.0.115, 10.0.0.125, 10.0.0.135, 10.0.0.145"

    pass on $int_if from $wifi to $wifi_allowed port $wifi_ports tag wifood

    pass out on $ext_if tagged wifood

    ```'
