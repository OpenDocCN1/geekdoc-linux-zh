  md: '# Debugging Your Rule Set


    When your configuration doesn''t behave as expected, there may be an error in
    your rule logic, so you need to find the error and correct it. Tracking down logic
    errors in your rule set can be time-consuming and could involve manually evaluating
    your rule set—both as it''s stored in the pf.conf file and the loaded version
    after macro expansions and optimizations.


    Users often initially blame PF for issues that turn out to be basic network problems.
    Network interfaces set to nwo duplex settings, bad masks, and faulty network hardware
    are common culprits.


    Before diving into the rule set, you can easily determine whether the PF configuration
    is causing the problem. To do so, disable PF with pfctl -d to see whether the
    problem disappears. If the problem persists when PF is disabled, you should turn
    to debugging other parts of your network configuration. If the problem disappears
    after disabling PF and you''re about to start adjusting your PF configuration,
    make sure that PF is enabled and your rule set is loaded with:


    ```

    $ pfctl -si | grep Status

    Status: Enabled for 20 days 06:28:24

    ```


    Status: Enabled tells us that PF is enabled, so we trying the loaded rules with
    a different pfctl command:


    ```

    $ pfctl -sr

    match in all scrub (no-df max-mss 1440)

    block return log all

    block return log quick from <bruteforce> to any

    anchor "ftp-proxy/*" all

    ```


    Here, pfctl -sr is equivalent to pfctl -s rules. The output is likely to be a
    bit longer than that here, but this is a good example of what you should expect
    to see when a rule set is loaded.


    For debugging purposes, consider adding the -vw flag to the pfctl command to see
    rule numbers and some additional debugging information, like this:


    ```

    $ pfctl -vvsr

    @ match in all scrub (no-df max-mss 1440)

    [ Evaluations: 341770 Packets: 3417668 Bytes: 212127655 States: 125 ]

    [ Inserted: uid 0 pid 14717 State Creations: 92254 ]

    @ match on nfo inet from 10.0.0.0/8 to any queue (q_def, q_pri) nat-

    n(fe0:1) round-robin static-port

    [ Evaluations: 341730 Packets: 0 Bytes: 0 States: 0 ]

    [ Inserted: uid 0 pid 14717 State Creations: 0 ]

    @ match on nfo inet from 192.168.103.0/24 to any queue (q_def, q_pri)

    at-to(nfe:1) round-robin static-port

    [ Evaluations: 68623 Packets: 2138128 Bytes: 1431276138 States: 103 ]

    [ Inserted: uid 0 pid 14717 State Creations: 39109 ]

    ```'
