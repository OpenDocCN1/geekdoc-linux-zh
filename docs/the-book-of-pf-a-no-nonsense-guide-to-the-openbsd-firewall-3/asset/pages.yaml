- img_proc: true
  md: 'In addition, if you define a table called <authpf users>, authpf will add the
    IP addresses of authenticated users to the table:


    ```

    table <authpf_users> persist

    ```


    If you need to run NAT, the rules that take care of the translation could just
    easily go in authpf.rules, keeping them in the pf.conf file doesn''t hurt in a
    simple setup like this:


    ```

    pass out on $ext_if from localnet nat-to ($ext_if)

    ```


    Here''s pre-OpenBSD 4.7 syntax:


    ```

    nat on $ext_if from localnet to any -> ($ext_if)

    ```


    Next, we create the authpf anchor, where rules from authpf.rules loaded once the
    user authenticates:


    ```

    anchor "authpf/*"

    ```


    For pre-OpenBSD 4.7 authpf versions, several anchors were required, so the corresponding
    section would be as follows:


    ```

    nat-anchor "authpf/*"

    dr-anchor "authpf/*"

    binat-anchor "authpf/*"

    anchor "authpf/*"

    ```


    This brings us to the end of the required parts of a pf.conf file for an authpf
    setup.


    For the filtering part, we start with the block all default and then the pass
    rules we need. The only essential item this point is to let SSH traffic pass the
    internal network:


    ```

    pass quick on $int_if proto ( tcp, udp ) to $int_if port ssh

    ```


    From here on out, it is really up to you. Do you want to let your clients have
    name resolution before they authenticate? If so, put the pass rules for the TCP
    and UDP service domain in your pf.conf file, too.


    For a relatively simple and egalitarian setup, you could include the rest of our
    baseline rule set, changing the pass rules to allow traffic from the addresses
    in the <authpf_users> table, rather than any address in your local network:


    ```

    pass quick proto ( tcp, udp ) from <authpf_users> to port $udp_services

    pass proto tcp from <authpf_users> to port $client_out

    ```'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'For a more differentiated setup, you could put the rest of your rule set in
    /etc/authpf/authpf.rules or per-user rules in customized authpf files in each
    user''s directory under /etc/authpf/users/. If users generally need some protection,
    your general /etc/authpf/authpf.rules could have content like this:


    ```

    client_out = "{ ssh, domain, pop3, auth, nntp, http, https }

    udp_services = "{ domain, ntp }

    pass quick proto { tcp, udp } from $user_ip to port $udp_services

    pass proto tcp from $user_ip to port $client_out

    ```


    The macro user_ip is built into authpf and extends to the IP address from which
    the user was authenticated. These rules will apply to any user who completes authentication
    at your gateway.


    A nice and relatively easy addition to implement is special-case rules for users
    with different requirements than your general user population. An authpf.rules
    file exists in the user''s directory under /etc/authpf/users/, the rules in that
    file will be loaded for the user. This means that naive user Peter who only needs
    to surf the Web and have access to a service on a high port on a specific machine
    could get what he needs with a /etc/authpf/users/peter/authpf.rules file like
    this:


    ```

    client_out = "{ domain, http, https }

    pass inet $user_ip to 192.168.103.84 port 9000

    pass quick in proto { tcp, udp } from $user_ip to port $client_out

    ```


    On the other hand, Peter''s colleague Christina runs OpenBSD and generally knows
    what she''s doing, even if she generates traffic to and from all ports. You could
    give her free rein by putting this in /etc/authpf/users/christina/authpf.rules:


    ```

    pass $user_ip os = "OpenBSD" to any

    ```


    This means Christina can do pretty anything she likes over TCP/IP as long as she
    authenticates from her OpenBSD machines.


    # Wide Open but Actually Shut


    In some settings, it makes sense to set up your network to be open and unencrypted
    at the link level, while enforcing restrictions via authpf. The next example is
    very similar to Wi-Fi zones you may encounter in airports or other public spaces,
    where anyone can access the access points and get an IP address, but any attempt
    at accessing the Web will be redirected to one specific Web page until the user
    has cleared sort of authentication.


    +   5. Thanks to Vegard Engen for the idea and for showing me his configuration,
    which is here in spirit, if not in all its details.'
