    # # Graphing Traffic with pfstat


    Once you have a system running up and producing data, a graphical representation
    of traffic is useful to view and analyze your data. One way to graph your PF data
    is with pfstat, a utility developed by Daniel Hartmeister to extract and present
    the statistical data that automatically generated by PF. The pfstat tool is available
    via the OpenBSD package system or for the net/pfstat, via the FreeBSD ports as
    sysutils/pfstat, and via NetBSD pkg.


    +   1. On OpenBSD, pfstat functionality is included in various systat, as described
    in the previous section.'
