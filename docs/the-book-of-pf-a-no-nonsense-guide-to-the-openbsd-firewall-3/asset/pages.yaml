- img_proc: true
  md: 'slowed down disproportionately whenever outgoing traffic started—more than
    could be explained by measuring the raw amount of data transferred. It all came
    back to a basic feature of TCP.


    When a TCP packet is sent, the sender expects acknowledgment in the form of an
    ACK packet from the receiver and will wait a time for it. If the ACK doesn''t
    arrive within that time, the sender assumes the packet hasn''t been received and
    resends it. And because in a default setup, packets are served sequentially by
    the interface as they arrive, ACK packets, with essentially no data payload, or
    up waiting in line while the larger data packets are transferred.

    ACK packets could slip between the larger data packets, the result would be more
    efficient use of available bandwidth. The simplest practical way to implement
    such a system with ALTQ is to set up two queues with different priorities and
    integrate them into the rule set. Here are the relevant parts of the rule.


    ```

    ext_if="kue0"


    alt on $ext_if priq bandwidth 100Kb queue q_pri, q_def

    queue q_pri priority 7

    queue q_def priority 1 priq(default)

    ```


    ```

    pass out on $ext_if proto tcp from $ext_if queue (q_def, q_pri)

    pass in $ext_if proto tcp to $ext_if queue (q_def, q_pri)

    ```


    Here, the priority-based queue is set up on the external interface with two subordinate
    queues. The first subqueue, q_pri, has a high-priority value of 7; the other subqueue,
    q_def, has a significantly lower-priority value of 1.

    This seemingly simple rule set works by exploiting how ALTQ treats different priorities.
    Once a connection is set, ALTQ inspects each packet''s TOS field. ACK packets
    have the TOS delay set to low, which indicates that the sender wanted the fastest
    delivery possible. When ALTQ sees a low-delay packet and queues of differing priorities
    are available, it assigns the packet to the higher-priority queue. This means
    that ACK packets skip ahead of the lower-priority queue and are delivered quickly,
    which in turn means data packets are serviced more quickly. The result is better
    performance than a pure FIFO configuration with the same hardware and available
    bandwidth. (Daniel Hartmier''s article about this setup, cited previously, contains
    a more detailed analysis.)


    # With a match Rule for Queue Assignment


    In the previous example, the rule set was constructed the traditional way, with
    the queue assignment as part of the pass rules. However, this isn''t the only
    way to do queue assignment. When you use match rules (available in OpenBSD 4.6
    and later), it''s incredibly easy to retrofit this simple priority-queuing regime
    onto an existing rule set.'
