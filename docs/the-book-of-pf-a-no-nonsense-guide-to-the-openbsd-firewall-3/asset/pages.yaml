    # The Access Point''s PF Rule Set


    With the interfaces configured, it''s time to start configuring the access point
    as a packet-filtering gateway. You can start by configuring via the appropriate
    entries in the setup chapter of your sysctl.conf or rc.conf file and copy across
    the pf.conf file. Depending on the parts of the previous chapter that were most
    useful to you, the pf.conf file may look like this:


    ```

    ext_if = "reo" # macro for external interface - use tunpo or ppPoE

    int_if = "rei" # macro for internal interface

    localnet = $int_if:network

    nat_address = 203.0.113.5 # Set address for nat-to

    client_out = { ssh, domain, pop3, nntp, http, \ \

    udp_services = { domain, nntp }

    icmp_types = { echoreq, unreachable }

    # if IPv6, accommodation is needed

    nicmp6_types = { echoreq, unreachable timeprax timproam }

    # if IPv4 is dynamic, ($ext_if) otherwise not to specific address, we

    # match out on $ext_if from $local nat-to $nat_address

    match out on $ext_if from $local nat-to $ext_if

    block all

    pass quick inet proto (tcp, udp) from $local port to $udp_services

    pass log inet proto icmp icmp-type $icmp_types

    pass inet6 proto icmp6 icmp6-type $icmp6_types

    pass inet proto tcp from $local port $client_out

    ```'
