    ```


    Following the name (uatraps), the first data field specifies the list type—in
    this case, the msg field contains the message to be displayed to blacklisted senders
    during SMTP dialogue. The method field specifies how spamsetup fetches the list
    data—in this case, via HTTP. Other possibilities include fetching via FTP (ftp),
    from a file in a mounted filesystem (file), or via execution of an external program
    (exec). Finally, the file field specifies the name of the spamd expects to receive.


    The definition of a whitelist follows much the same pattern but omits message
    parameter:


    ```

    whitelist:\n:white:\n:method=file:\nn:file=/etc/mail/whitelist.txt

    ```


    The suggested blacklists in the current default spamd.conf are actively maintained
    and have rarely, if ever, contained false positives. However, earlier versions
    of this file also suggested lists that excluded large blocks of the Internet,
    including several addresses that cover entire countries. If your site expects
    to exchange legitimate mail with any of the countries in question, these lists
    may be optimal for your setup. Other popular lists have been known to list /16
    ranges as spam sources, and it is worth reviewing the details of the list''s maintenance
    policy before putting a blacklist into production.


    Put the lines for the startup parameters you want in your /etc/rc.conf.local on
    OpenBSD or in /etc/rc.conf on FreeBSD or NetBSD. Here''s an example:


    ```

    spamd_flags="-v -b" # for normal use: " and see spamd-setup(8)

    ```


    Here, we enable spamd and set it to run in blacklisting mode with the -b flag.
    The -v flag enables verbose logging, which is useful for keeping track of spamd''s
    activity for debugging purposes.'
