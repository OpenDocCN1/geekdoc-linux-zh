  md: 'If you''re running a PF version equal to OpenBSD 4.6 or earlier, the match
    rule with nat-to instead becomes this (assuming the external interface has one
    address, dynamically assigned):


    ```

    nat $ext_if from $localnet to any -> ($ext_if)

    ```


    The only difference that''s strictly necessary for your access point to work is
    to change the definition of int_if to match the wireless interface. In our example,
    this means the line should now read as follows:


    ```

    int_if = "raldo" # macro for internal interface

    ```


    More than likely, you''ll also want to set up dhcpd to serve addresses and other
    relevant network information to IPv4 clients after your access point. For IPv6
    networks, you probably want to set up rta6d (or a DHCP6 daemon) to manage IPv6
    clients in autoconfiguration. Setting up dhcpd and rta6d is fairly straightforward
    if you read the main pages.


    That''s all there is to it. This configuration gives you a functional BSD access
    point, with least token security (actually more like a Keep Out!) with WEP encryption
    or a slightly more robust link-level encryption with WPA. If you need to support
    FTP, the ftp-proxy configuration from the machine you set up in Chapter 3 and
    changes similar to those you made for the rest of the rule set.


    # Access Points with Three or More Interfaces


    If your network design dictates that your access point is also the gateway for
    a wired network, or even several wireless networks, you need to make some changes
    to your rule set. Instead of just changing the value of the int_if macro, you
    might want to add another (descriptive) definition for the wireless interface,
    such as the following:


    ```

    air_if = "raldo"

    ```


    Your wireless interfaces are likely to be on separate subnets, so it might be
    useful to have a separate rule for each of them to handle any IPv4 NAT configuration.
    Here''s an example for OpenBSD 4.7 and newer systems:


    ```

    match out on $ext_if from $air_if:network nat-to ($ext_if)

    ```


    And here''s one on pre–OpenBSD 4.7 PF versions:


    ```

    nat on $ext_if from $air_if:network to any -> ($ext_if) static-port

    ```'
