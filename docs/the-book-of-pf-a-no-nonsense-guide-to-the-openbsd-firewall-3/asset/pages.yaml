  md: '# A


    # RESOURCES


    ![](img/838f49667801fd8460438797800410dd_224_0.png)


    Though I may have wanted to, it proved impossible to cover all possible wrinkles
    of PF configuration within these pages. I hope that the resources listed here
    fill in some details or present a slightly different perspective. Some of them
    are even quite enjoyable reads for their sake.


    # General Networking and BSD Resources on the Internet


    The following are the general web-accessible resources cited throughout the book.
    It is worth looking at the various BSD projects'' websites for the most up-to-date
    information.


    +   - Of particular interest for OpenBSD users is the online OpenBSD Journal (http://undeadly.org/).
    It offers news and articles about OpenBSD and related issues.'
