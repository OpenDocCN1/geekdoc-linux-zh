    #  Handling IPSec, VPN Solutions


    You can set up virtual private networks (VPNs) using built-in IPSec tools, OpenSSH,
    or other tools. However, due to the perceived poor security of wireless networks
    in general or for other reasons, you''re likely to set up some additional security.


    The options fall roughly into three categories:


    +   - SSH If your VPN is based on SSH tunnels, the baseline rule set already contains
    all the filtering you need. Your tunneled traffic is indistinguishable from SSH
    traffic to the packet filter.


    +   - IPSec with UDP key exchange (IKE/AKMP) Several IPSec variants depend critically
    on exchange via proto udp port 500 and use udp port 4500 for NATTraversal (NAT-T).
    You need to let this traffic through in order to let the flows become established.
    Almost all implementations also depend critically on letting ESP protocol traffic
    (protocol number 50) pass between the hosts with the following:


    ```

    pass proto from $source to $target

    ```


    +   Filtering on IPSec encapsulation interfaces With a properly configured IPSec
    setup, you can set up PF to filter on the encapsulation enc itself with the following:^1


    ```

    pass enc proto ipenc from $source to $target keep state (if-bound)

    ```


    See Appendix A for references to some of the more useful literature on the subject.


    # The Client Side


    As long as you have BSD clients, setup is extremely easy. The steps involved in
    connecting a BSD machine to a wireless network are quite similar to the ones we
    just went to set up a wireless access point. On OpenBSD, the configuration centers
    on the $hostname.if for the interface. On FreeBSD, the configuration centers on
    $rc.conf but will most likely involve a few others, depending on your exact configuration.


    > 4. In OpenBSD 4.8, the encapsulation interface became a cloneable interface,
    and you can configure several separate enc interfaces. All enc interfaces become
    members of the enc interface group.'
