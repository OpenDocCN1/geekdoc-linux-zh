    The right way to achieve this is by hot encoding. Pandas have a function for this
    known as the get_dummies. Once this method is applied to a data column, it changes
    every unique value into a new binary column.


    Another style which a feature may require to be converted for machine learning
    is called binning. A great example of this data set is the age feature. It can
