- pgno: 304
  md: '# ## Chapter 9: Tips and Tricks to Get the Most Out of Python


    ![](img/e34dde0654d255bebea353c553e965ac_304_0.png)


    Now that we have had some time to talk about the Python code and all of the different
    things that we are able to do with that kind of code, it is now time for us to
    work on how to get the most out of this code. In this chapter, we are going to
    really focus on some of the things that you can do when your code is not behaving
    the way that you want, or to help make coding, in general, a bit easier as well.
    Some of the tips that you as a beginner can follow when working with Python in
    this manner include:


    # **Comment Out the Code**


    Every type of coding language that you will work on is going to have the comment,
    which is basically a way that you can leave a note in your code without the compiler
    going through and trying to execute these notes as part of the program. This is
    advantageous to you because you can choose to comment out of a code that you don’t
    want to run right now, but which you don’t want to lose track of. You just need
    to put the # in front of that line that you want to comment out of.


    If your script is long, you can comment on some parts of the code that are not
    related to the'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'changes that you want to work on. This can sometimes make it run faster, and
    it can make it easier to search through the rest of the code to help find that
    mistake. You need to be careful when doing this though because it won’t help you
    to comment out parts that set the variables that the program needs to use later
    on. If you do this, then you are going to have issues getting the code to run.


    When you are done testing out the code, and you have gotten it all organized and
    ready to go, you must go back through and remove these comment characters. This
    helps you to turn the whole program back on so you can see if it works the right
    way.


    # Print Things Out


    When there are times when you are not able to figure out what is wrong with the
    code that you are working on, then you can take some time to print out a lot of
    things to see what is going to work. If you are unsure about which values are
    ever attached to one of your variables, then print it out. if you are uncertain
    about anything that is going on in the code that you are writing, then it is time
    to print it out. Then, when you are actually going through and running the program,
    you are able to look at your screen and see how the values change or what has
    been a bit different thanks to that.


    You may find that this is going to be helpful to print out some strings before
    you go through and print out the variable. This is a good way to make sure that
    your print statements are going to help you to learn how to make the program work
    for your needs.


    # Work with the Code You Know Will Behave


    When you are in doubt about things, you may want to take some time to practice
    codes that are in existence already, ones that you know are going to work, and
    you don’t have to worry about whether they are going to do what you would like
    or not. This is going to help you to figure out some of the syntax and the structure
    that has to come with these codes, and then you can work from there to get the
    best results. This is a good thing for a beginner to just gain some familiarity
    so that they are able to use that later on as they work on their own codes, or
    on things that are more complex.


    If you do decide to work on your own project, then you can Google around to find
    a script that has a lot of what you need. It doesn’t have to be perfect, but sometimes
    having that background in place and some of the syntaxes can make a big difference.
    Make sure that you take the time to run the code before you try to implement any
    changes. This ensures that the code works before you make any changes. Then you
    can add in some small changes to that code, and stop to test it often to see if
    any of the changes that you implement cause the bugs.'
