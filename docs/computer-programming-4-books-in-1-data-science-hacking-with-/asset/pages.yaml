- pgno: 233
  md: '# **What is an IP Address?**


    An Internet protocol (IP) address is a four-octet, eight-bit digital address (32
    bits total) that, when written out, looks like this: 10.156.158.12. Evidently,
    an IP is a unique set of numbers that are separated by dots. The set of numbers
    is used to identify a computer (or network device) using Internet Protocol (IP)
    for network communication. In an IP address, the value of any of the octets-the
    numbers between the periods-can be from 0 to 255.


    An IP address is not entirely different from a phone number. If you know someone’s
    phone number-say, your Uncle Mike-you can call her by dialing her number on your
    telephone’s keypad. Then, your phone company’s computers and switching equipment
    go to work to connect your phone with the phone belonging to Uncle Mike over an
    audio communication channel. Once connected, you can speak with buddy Bradley,
    even if he is many miles away. When you do, the audio signal carrying your voice
    will typically travel over a pair of copper wires from your house to a switch
    at your local phone company.


    From there, the signal might be converted to a light wave in order to travel over
    a fiber optic cable to another switch. From this second switch, the audio signal
    might be converted to a radio-wave signal in order to travel from one microwave
    tower to another. Eventually, as the signal nears its destination-Uncle Mike’s
    house-it will be converted back to an audio analog signal, traveling over a pair
    of copper wires from Uncle Mike’s phone company to her house. (This scenario assumes
    the use of land lines. If cell phones are involved, then this process will vary
    in the details, but not in the concept.)


    # **What is the Function of an IP Address?**


    In a similar fashion to how phones use numbers to connect on a local, regional,
    national, or international scale, an IP address facilitates connections between
    computer hosts as well as routing equipment. Put another way, if two computers
    on the Internet have each other’s IP address, they can communicate. But unlike
    phones, which use switching equipment to connect, computers connect to each other
    over the Internet through the use of routing equipment, which shares the communication
    paths with hundreds or thousands of other computers.


    When data is sent from a computer to a router, the router’s job is to find a short,
    open communication path to another router that is both close to and connected
    to the destination computer.


    The router accomplishes this either by using default routes or by dynamically
    learning and recording tables, called “routing tables,” that keep track of which
    IP addresses are present on any one of the router’s many open, up-and running
    communication ports. Because all the routers connected together on the Internet
    resemble a spider’s web, data can travel over many different routes or paths if
    necessary, to get to its intended destination. If one of the routers or some other
    connecting link goes offline, the other routers trying to move the data search
    for an alternative route to the destination.


    In order to facilitate this dynamic communication method, routers are also assigned
    IP addresses so they can find each other.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# **IP Sub-netting**


    Routed IP environments require that your pool of IP addresses be sub-netted. This
    allows each sub-net to see itself as a separate segment of the larger internetwork.
    The router then ties together the various sub-nets into one network. The router
    knows how to route traffic to the correct segment because it builds a routing
    table. The routing table is basically the networks roadmap.


    IP sub-netting is fairly complex, and so to make this discussion informative but
    still digestible at an introductory level, we will limit our exploration of sub-netting
    to one class of IP addresses; we will look at an example of sub-netting a Class
    B range of IP addresses. The mathematical tricks that we use to sub-net the Class
    B network can also be used to sub-net a Class A or Class C network (although sub-netting
    Class C networks greatly limits the number of usable IP addressed that you end
    up with).


    Sub-netting is a two-part process.


    First you must determine the sub-net mask for the network (it will be different
    than the default sub-net masks; for example, the default for Class B is 255.255.0.0).
    After figuring out the new sub-net mask for the network, you must then compute
    the range of IP addresses that will be in each sub-net.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# **IPv4 vs. IPv6**


    Currently, IP version 4 (IPv4) addresses are the Internet IP addresses of choice.
    As mentioned, these addresses are composed of four sets of eight bits. In the
    future, we will likely adopt the IP version 6 (IPv6) address scheme. IPv6 differs
    in form and substance from IPv4 in two ways:


    +   - IPv6 addresses have eight 16-bit numbers (128 bits total), usually expressed
    in four-digit hexadecimal form. The range of a single 16-bit number is greater
    than that of an eight-bit number, spanning from zero to 65,535.


    +   - The 16-bit numbers in an IPv6 address are separated by colons rather than
    periods.


    Why make the switch? Because under IPv4, there are not enough numbers available
    to assign one to every computer or device on the Internet that needs one. IPv6
    solves this problem, offering 2 raised to the 128th power addresses; in contrast,
    IPv6 offers only 2 raised to the 32nd power-although masking and private-address
    strategies have been used to extend the number of available IPv4 addresses on
    the Internet.'
  merge: -1
  img_proc: true
