- pgno: 229
  md: '# **Network Time Servers**


    Network time servers are servers that handle all network timing information from
    different sources including radio broadcasts and satellites. These servers then
    avail the gathered information (from different sources) the given network.


    Time servers rely of NTP and UDP/Time protocols to communicate with other nodes.
    In so doing, there is proper synchronization of coordinated activities in the
    network.


    # **Device Servers**


    A device server refers to a specialized and network-based network device that
    meant to perform one or more server functions. A device has three main features
    that include client access and minimal operating architecture.


    There is no per seat operating system license in the minimal operating architecture.
    Also, client access is independent of any proprietary protocol or operating system.


    Besides the above two features, a device server is a “closed-box” server. This
    means that it requires minimal maintenance, is easy to install, and is remotely
    manageable via a browser.


    Examples of device include network time servers, terminal servers and print servers.
    These device servers are designed to handle perform specific tasks. Each device
    server is characterized by a unique set of configuration features in software
    and hardware. The unique features help these servers to work optimally.


    # **Multiport Device Servers**


    These servers allow sharing of devices between terminals and hosts locally and
    all over a given network. One terminal can be connected to multiple hosts and
    can conveniently switch among the different hosts. Multiport device servers can
    as well be used on device that have serial ports only.


    A multiport device server can convert between known protocols such as TCP/IP and
    LAT. This is possible primarily due to a multiport device server’s natural ability
    of translation.


    # **Print Servers**


    Print servers make it possible for different network users to share network printers.
    A print server may support either a serial or parallel interface. As a result,
    print server accepts requests from all network users using appropriate protocols.
    A print server also manages printing jobs on every network printer.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Understanding VLAN


    VLAN is an acronym for Virtual Local Area Network (normally referred to Virtual
    LAN). It refers to a switched network that is segmented logically using a project
    team, application or function. The logical segmentation is done without consideration
    of users'' physical locations. VLANs are more or less same as physical LANs. The
    only difference is that VLANs allow end stations to be grouped regardless of whether
    they are on the same physical segment or not. A VLAN can accommodate any form
    of switch module port. Multicast, broadcast and unicast data packets can be forwarded
    and flooded to end stations only in a given VLAN. Each VLAN is taken as a logical
    network. Packets destined for stations outside of a VLAN must be forwarded through
    a router to reach its destination. Notably, a VLAN can be associated with an IP
    sub-nets.


    # Supported VLANs


    Conventionally, we identify VLANs with a number ranging from 1 to 4094.

    The following must be noted:


    +   - 1002-1005 VLAN IDs are reserved for FDDI and Token Ring VLANs

    +   - VLAN IDs > 1005 are not found in the VLAN database since they are extended
    range.

    +   - Switch module supports extended-range and normal range VLANs (1005).

    +   - Number of configured features, SVIs and routed ports affects functioning
    of the switch module hardware.


    # VLAN Configuration Guidelines


    It is important to understand the following facts:


    +   - 1005 VLANs are supported on the switch module.

    +   - Numbers between 1 and 1001 are used to identify normal-range VLANs.

    +   - 1002 -1005 are reserved for FDDI and Token Ring VLANs.

    +   - Switch module has no FDDI and Token Ring support.

    +   - 1-1005 VLAN IDs are normally stored in the VLAN database as well as the
    file containing the switch module configuration information.

    +   - 1006-4094 (extended-range) VLAN IDs are limited to private LAN, RSPAN VLAN,
    MTU, and UNI-ENI VLANs. These VLAN IDs are not saved in the VLAN database.


    The following steps will help you create or modify a VLAN:


    +   1. Use the [configure terminal] command to enter the global configuration
    mode.

    +   2. Enter the [vlan <vlan-id>] to enter VLAN configuration mode.'
  merge: -1
  img_proc: true
