- pgno: 160
  md: '# **Chapter 13: Penetration Testing**


    ![](img/e34dde0654d255bebea353c553e965ac_160_0.png)


    Each and every infrastructure of IT comes with some weak points which can ultimately
    lead to some serious attack and can be used for the purpose of stealing and manipulating
    data. Only one thing can be done in such situations which can help in preventing
    the hackers from entering the system. You need to perform regular checks of the
    infrastructure of your security and make sure that there is no form of vulnerabilities
    present in the structure. Penetration testing helps in finding out the vulnerabilities
    along with the several weak points in a system. As the owner or administrator
    of a network, they can always have some advantage over the hackers as they are
    bound to know the topology of network, the components of infrastructure, the services,
    the probable points of attack, the executed services and many more.


    Penetration testing is done within a real and secure environment so that in case
    any vulnerability is found, you can mend the same and secure the system.


    # **Penetration testing in details**


    As the name goes by, penetration testing is the process of testing a system to
    find out whether penetration by any third party is possible in the system or not.
    Penetration testing is often mixed up with ethical hacking as both are somewhat
    similar in features and functioning. The motive of are also the same but a very
