- pgno: 193
  md: '# Computer Network Components


    These comprise of network hardware and network software components that constitute
    a computer network. In this section, we''re typically concerned with the major
    hardware components that are crucial for the installation of a computer network.
    Computer network components include computers, cables, network interface card
    (NIC), switches, modems, hubs and routers.


    # Computers


    Computers may be desktop computers, laptops as well as portable devices (smart
    phones and tablets) plus their additional accessories such as portable hard drives,
    CD Players, keyboards and mice. They are the major hardware components of any
    computer network.


    Computers are the primary components without which a network is just but a dream.
    Computers offer the platform for users to perform their different tasks on the
    network. In case of a centralized system, computers serve as a link between users
    and the dedicated network server.


    # The Network Interface Card


    The NIC (as it is commonly called) is a hardware component that links one computer
    to another on the same network.


    The NIC supports network transfer rates from 10Mbps through to 1000Mbps.


    All network cards have a unique address assigned by the IEEE. These unique addresses
    are referred to as the physical/MAC addresses, and are used to recognize each
    computer on the network.


    There are two unique forms of network cards: Wireless and Wired NICs.


    # Hub


    A hub divides a network connection into several devices. A hub connects all computers
    on a network via cables. Every computer sends a request to the network through
    the hub.


    When the hub gets a request from a particular computer, it broadcasts that request
    across the network to all network devices.


    Each network device checks the request to determine if it belongs there. If not,
    the request is subsequently discarded.


    The downside to this process is consumption of more bandwidth and communication
    is highly limited. Presently, a hub is as good as obsolete due to the hype with
    routers and switches.


    # Switch


    A switch links a number of devices on a computer network. This important connection
    device is technologically more advanced than a hub.


    A switch has an updated that determines the destination of transmitted data. The
    switch transmits a message to the desired destination as per the physical address
    on each incoming request.


    Unlike the hub, it does not transit data to all devices across the network. Thus,
    there is increased data transmission speeds since individual computers communicate
    directly with the'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'switch.


    # Router


    A router gives an internet connection to a local area network. It receives, analyzes
    and forwards incoming packets to another computer network.


    It operates in Layer three of the OSI Reference model-simply referred to as the
    network layer.


    Packet forwarding is based on the information contained in the routing table.
    A router is smart enough to choose or decide the most appropriate path for the
    transmission of data from all available paths.


    # Modem


    A modem is an acronym that stand for Modulator/Demodulator. It changes digital
    data into analog signals over a telephone line.


    The modem makes it possible for a computer to establish a connection to the Internet
    via an existing telephone line. It is installed on the PCI slot of the motherboard-not
    on the motherboard itself.


    # Connectors and Cables


    A cable is a physical transmission medium which is used to transmit a signal.


    The cables used for transmission include the coaxial cables, twisted pair cables
    and fiber optic cables.


    # Testing the Network Wiring


    The first step to test the network wiring is to make a chart to help keep track
    of the testing progress. A floor plan showing where the wires are or a room-by-room
    listing will work fine. Check each one off when it tests okay.


    Once the chart is done, get someone to help you, posting that person at the distant
    end of the cable from you. In a large building, use two-way handheld radios or
    cell phones to communicate; this will move the testing project along faster.


    To test your cables, use a cable tester or, if you don’t have a cable tester,
    a volt-ohm meter. If you are going to test a lot of end-point jacks, then borrow
    or invest in a cable tester. When the connections are good, with all four pairs
    of wires in the cable conducting properly, lights will illuminate on both ends
    of the tester. Having this tester makes checking a large number of cables an easy
    job.


    If you opt to use a volt-ohm meter, you will need to build a patch cable that
    can be used to sort out the respective pairs on one end of the cable run so you
    can check for continuity on the other end. A shorting cord for the distant end
    of the cable connects together the appropriate pairs on RJ-11 or RJ-12 or on the
    Ethernet connector.


    If you are going to use this more primitive method instead of a cable tester,
    you will need three shorted patch cables; one four-position plug will work for
    RJ-11 and 12. If you have RJ-25s, you'
  merge: -1
  img_proc: true
- pgno: 195
  md: will need to test them with a 6P6C plug; to test Ethernet cables, you will need
    an 8P8C plug with the appropriate pairs shorted out. You will then to need to
    fabricate another plug and patch cord with the wire stripped back 1/2 inch for
    connecting to the leads on the ohm meter. Each pair should trigger the alarm on
    the continuity check or just read a few ohms of resistance, which will vary with
    distance. The resistance reading should not exceed 19.7 ohms over 100 meters of
    cable length.
  merge: -1
