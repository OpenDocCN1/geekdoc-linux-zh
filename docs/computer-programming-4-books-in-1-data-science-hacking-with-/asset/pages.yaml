    used space indicated in % along with in KBs. If you want to view the same in megabytes,
    type in df -m.


    # du


    This command is used for knowing the usage of the disk by a file in the system.
    In case you are required to know the disk usage for one specific file or folder
    in the system of Linux, type in du followed by the folder or file name. For example,
    if you need to know the disk usage which is being used by the folder documents
    in the system of Linux, type in du Documents. You can also use ls -lah command
    for viewing the size of the files within a folder.


    # zip & unzip


    You can use the command zip for compressing a file into an archive of zip. For
    the purpose of extracting files from zip archive use the command unzip.


    # uname


    You can use this command for showing all the information about that system in
