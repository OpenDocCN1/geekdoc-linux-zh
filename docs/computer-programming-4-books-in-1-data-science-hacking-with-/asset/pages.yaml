    engineers and network administrators through to network specialists.


    The certification program was founded in 1998. An estimated 1 million certificates
    have been awarded to qualified persons ever since.


    CCNA program spans numerous crucial networking concepts. It is an essential foundational
    course for interested candidates in the preparation for current and emerging networking
    technologies.


    # **CCNA Scope**


