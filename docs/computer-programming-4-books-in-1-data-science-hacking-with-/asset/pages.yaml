  md: '# Chapter 11: How can Kali Linux be Used For Hacking?


    ![](img/e34dde0654d255bebea353c553e965ac_151_0.png)


    As we all know by now that Kali Linux has been designed especially for the purpose
    of penetration testing and security auditing, it can also be used for the purpose
    of ethical hacking which is required while performing penetration testing and
    other security checks. Kali Linux comes packed with a huge number of tools which
    helps in the venture of security infrastructure testing and other forms of testing
    for securing an organization or company.


    # **Who all uses Kali Linux and why?**


    Kali Linux can be regarded as the most unique form of OS which can be found today
    as serves as a platform which can be used up by both the good guys and the bad
    guys. The administrators of security along with the black hat hackers all use
    this platform for meeting their needs. One uses this system for the purpose of
    preventing and detecting breaches in security infrastructure while the other uses
    this OS for identifying and thereby exploiting the security breaches. The huge
    number of tools which comes packed with Kali Linux can be regarded as the Swiss
    Knife for the toolbox of the security professionals. The professionals who widely
    use Kali Linux are:


    +   - **Security Administrators**: The administrators of security come with the
    responsibility of safeguarding the information and data of the concerned institution.
    The security administrators widely use Kali Linux for the purpose of ensuring
    that there are no forms of vulnerabilities in the environment of the security
    infrastructure.'
  merge: -1
  img_proc: true
