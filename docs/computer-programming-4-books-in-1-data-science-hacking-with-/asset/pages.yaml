  md: 'It is also known as vulnerability or network discovery. Enumeration is the
    process of obtaining all those information which is available readily from the
    system of the target, networks and application which are used by the target. It
    is also to be noted that the phase of enumeration is the actual point where the
    thin line between malicious attacks and ethical hacking gets blurred very often
