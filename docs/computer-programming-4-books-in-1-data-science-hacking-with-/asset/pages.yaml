    # Comparison with Supervised & Unsupervised Learning


    Notice that the definition of Reinforcement Learning doesn''t exactly fit under
    either Supervised or Unsupervised Learning. Remember that Supervised Learning
    is about learning through supervision and training. On the other hand, Unsupervised
    Learning is actually revealing or discovering insights from unstructured data
    (no supervision, no labels).


    One key difference compared to RL is in maximizing the set reward, learning from
    user interaction, and the ability to update itself in real-time. Remember that
    RL is first about exploring and exploiting. In contrast, both Supervised and Unsupervised
    Learning can be more about passively learning from historical data (not real-time).
    There''s a fine boundary among the 3 because all of them are still concerned about
    optimization in one way or another. Whichever is the case, all 3 have useful applications
    in both scientific and business settings.


