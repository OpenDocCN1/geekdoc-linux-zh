- pgno: 239
  md: '# Chapter 8: Fundamentals of Network Security


    Network security is one of the most important aspects in overall computer. Now,
    more than ever, having an adequate security protocol which can combine both functionality
    and protection is essential for all types of users.


    Amid the large amount of threats out there, users must have a system which they
    can rely on when going about their usual day to day business. In that regard,
    the need to integrate these aspects motivates users to find the ideal solution
    to their individual needs.


    In this chapter, we are going to be taking a look at the fundamentals of network
    security, guidelines and best practices, as well as, the most common threats found
    lurking today. In addition, we are going to be discussing the ways in which the
    average user can take better care to avoid becoming the victim of unscrupulous
    folks out there.


    # The only thing to fear, is fear itself


    It’s natural for the average user to fear hackers. This may lead the average user
    to spend a pretty penny on security measures which may or may not offer the combination
    of security and functionality that such users need. In fact, the most common side
    effect of top-notch security measures is a slow system. For example, a solid online
    security system will essentially scan every single bit of information that goes
    through their system. However, this can lead to an overall slowing of internet
    connection speeds.


    As a result, users may feel that they have been short-changed by the performance
    of their security system. Other systems may sacrifice certain safety features
    in exchange for faster performance and internet speeds. Yet, these tradeoffs may
    leave critical information and transactions vulnerable to unwanted folks.


    That is why the first thing to keep in mind is that breaking the bank out of fear
    of being vulnerable may lead you to overspend on a system that, while keeping
    your system safe, may end up costing you more in the end. That is why finding
    the right balance is essential; striking a balance between features and performance
    is the ultimate goal of all users. Therefore, we will be taking an objective look
    at what threats are out there, which ones you will most likely be vulnerable to,
    and what you can do to protect yourself.


    Please keep one thing in mind: of all the horror stories out there, some may not
    necessarily apply to so long as you don’t engage in the types of practices that
    attract hackers and fraudsters such as handle a large volume of financial transactions
    on a daily basis. Consequenty, taking the proper steps to secure the transactions
    that you do make, will go a long way toward keeping your information, and your
    money, safe.


    # What to be on the Llookout for


    Threats are out there, and they are real. However, the most important thing to
    keep in mind is that hackers and fraudsters love feeding on low-hanging fruit.


    What does that mean?


    It means that cheaters are looking for vulnerable people who don’t know any better.
    Hence, they'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'prey on these individuals. This is why the elderly are a common target for
    phone scammers. As such, online cheaters are looking for folks who have left windows
    unlocked or have neglected to ensure their information is safe.

    Also, please keep in mind that a lot of the fraudsters and hackers out there will
    essentially go on a phishing expedition. That’s right, we mean “phishing” and
    not “fishing” since hackers tend to cast a wide net in search of unsuspecting
    victims.

    As a matter of fact, phishing is one of the most common means of victimizing individuals.
    A hacker will go the extra mile to produce an official-looking email in which
    they feign to be part of some organization, such as a bank, in which you are registered
    with. Now, they have no way of knowing if you are actually a customer of that
    bank. So, the email needs to look as natural as possible so that, in the event
    that you are actually a customer of that bank, you will believe that it is an
    official communication. The scammers then trick the user into providing their
    username and password under the pretense that the bank is undergoing security
    updates and so on. When the unsuspecting victim falls for the scam, it is quite
    plausible that the crooks will then proceed to empty the victim’s bank account.

    This scam was so predominant, that virtually every company out there took the
    necessary steps to ensure that their customers would not be subject to these attacks.
    In the end, phishing has been essentially crushed. Nevertheless, there are one,
    or two, hackers out there who still give it the old college try.

    That being said, the following threats outlined in this chapter are examples of
    what you need to be on the lookout for.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# **Network Intruders**


    Intruders are lurking about. There is no doubt about that. It should be noted
    that most intrusion events happen from within. That means that intruders are generally
    people who have access to the network and seek to gain unauthorized access to
    other parts of the network. Thus, it is important to have a clear picture of who
    has access to what and how sensitive information ought to be protect. For instance,
    if a company handles personal information belonging to their customers, great
    care needs to be taken in order to ensure that such information does not fall
    into the wrong hands. This is especially critical if such information could potentially
    become profitable.


    A good practice in this regard is to update the roster of individuals who have
    access to your network, or your personal computer for that matter. That way, if
    a breach should happen to occur, it will be easier to pinpoint who has access
    to what and where the breach may have originated.


    Outside intruders may attempt some kind of remote access to your network, but
    they would at least need to have some kind of insight into usernames and passwords.
    Although, it’s worth pointing out that hackers need only a healthy list of usernames,
    because as we will see in a moment, they can use other means to break through
    a password.


    # **Social Engineering**


    Phishing is an example of social engineering. As such, social engineering seeks
    to use clever tactics in order to extract as much information as possible from
    potential victims. That is why all users need to take care with sensitive information
    in all means of online interaction. For example, hackers may be circling the water
    on social media, looking for unsuspecting prey to pounce on. If you are getting
    visions of sharks swimming about, then you are right on the money. The fact of
    the matter is that hackers will often pose as customer service agents pretending
    to help customers regain access to their accounts or open a new one. Even if the
    customer does not reveal all of their information, the hacker may get just enough
    to breach an account.


    The saying, “if it’s too good to be true, it probably is” still rings true when
    it comes to social engineering. So, always keep an eye out for any suspicious
    activity out there. If you are even in doubt, just stay away from suspicious users
    and websites.


    # **Password hacking**


    Virtually every type of network requires two things to access it: a username and
    a password. Even if hackers happen to get their hands on your username, they still
    have to crack your password. This can be rather complex. Yet, you can make it
    easy for hackers if you don’t pay close attention to the types of passwords you
    are using.


    Currently, most sites and network protocols require passwords to have a combination
    of letters, numbers and special characters (@, #, & or *). In short, the longer
    your password is, the better. In fact, the best passwords make use of random characters
    and numbers. This makes it virtually impossible for password cracking software
    to get its hands on your password.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'For instance, “happy” isn’t exactly the safest password. It may take a password
    cracking software minutes to break it. However, a password like “H@\#py” is far
    more complex and may take password cracking software days to or even weeks before
    it is able to get anywhere. By then, the hacker will have given up and moved on
    to the next target.

    If you happen to use a password generator software, please bear in mind that you
    will get a password of around 16 characters using random letters numbers and special
    characters. Perhaps the best piece of advice here is to make sure that your passwords
    don’t have any type of logical connection to you. They need to be as random as
    possible. That way, you can ensure that your account will be as safe as it can
    be.


    # **Packet sniffing**


    This is a complex endeavor, but if successful, a hacker can have access to potentially
    unlimited amounts of data. This requires the hacker to install software that can
    read the information traffic going through your network. If your information is
    not encrypted, then you are just a sitting duck. That is why most network routers
    come with their own built-in encryption. Furthermore, free webmail services also
    use their own encryption. That way, if a hacker happens to intercept your package,
    the only thing they will be able to get is meaningless gibberish. It may end up
    taking them week or months before they are able to even get close to breaking
    through the encryption. While it is not impossible, it will certainly deter hackers
    from wasting their time on your data.


    # **Exploiting vulnerabilities**


    Nothing is perfect; and software is no exception. That is why the shark metaphor
    is so apt when it comes to hackers. They are consistently circling the water looking
    for backdoors, loopholes and other coding errors that may allow then access to
    a network. In fact, an entire industry has been built around hacking large corporations
    and then extorting them out of large sums of money. If the software you are using
    happens to have one such mistake, you might be vulnerable to an intrusion. These
    issues are generally addressed by software manufacturers and solved as promptly
    as possible. However, software manufacturers don’t generally become aware of the
    problem until someone’s network has been breached. Nevertheless, always be on
    the lookout for software updates and security patches. That way, you can improve
    the overall level of protection in your network.


    # **Malware**


    This has got to be the most common means of granting unauthorized access to wrongdoers.
    Malware consists of a program that latches onto your computer files and opens
    a door for hackers to walk through. When installed, it may be very difficult to
    detect its presence. Most of time, you will pick up on it until it’s too late.
    The most common form of malware is a program commonly referred to as a virus.

    Now, malware is completely ineffective unless one thing happens: the user needs
    to allow the'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'malware package to enter their computer. This can be done through a download,
    inserting a pen drive or installing software. Often, malware poses as another
    type of software thereby tricking the user to open the file, installing the program
    or downloading the virus. In such cases, you can still kill the program from ruining
    your computer though you would have to kill it immediately. A good antivirus program
    will help keep you safe especially if you usually download information online.


    The best thing you can do to protect yourself in this case is to avoid opening
    any email attachments, downloading software or installing anything that isn''t
    from a trusted source or that might look fishy.


    # Denial of Service (ransomware)


    Ransomware works in the same manner as malware does but with one particular twist:
    malware generally looks to snoop on your activity and steal information such as
    account numbers, passwords and usernames whereas ransomware will lock up your
    computer and deny you access to your network. What the hackers are after in this
    case is a payment in order to liberate your system and/or files. However, once
    you pay, there is no guarantee they won''t try it again. If you should ever fall
    prey to a ransomware attack, you need to drastically overhaul your security settings.
    Otherwise, it will only be a matter of time before hackers try the same shenanigans
    again.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'What can be done about these threats?


    Fortunately, there is plenty which can be done to ensure the security of your
    network. We have already pointed out some of the best practices which you can
    implement as a part of your usual activity. Moreover, there are other measure
    which you can take so that you can avoid becoming a target of unwanted attacks.


    # Network Security Areas or Zones


    In a perfect world, there would be a single solution to all of the threats we
    have outlined. However, engineers are yet to produce a one-size-fits-all solution.
    The main reason for this is that hackers like keeping up with the times, that
    is, as soon as a security measured is implemented, hackers are looking for a workaround.
    That being said, let’s take a look at the various network areas, or zones, which
    comprise a typical network apparatus.


    # Logical Security Zones


    The most common type of network is a small, home-based network. Typically, these
    networks consist of internet access coming from an ISP into a router installed
    in a customer’s home. Then, various devices are connected to this network in order
    to access the internet.


    Now, in general terms, most home networks are relative safe given the type of
    security measures that come preinstalled with the equipment that the average user
    purchases. Unless users attempt to access the dark web or frequently download
    software from untrusted sources, then risks should be minimal.


    There are two types of traffic that you will find in this type of setup, intranet
    traffic and internet traffic. Intranet traffic is all of the traffic that happens
    within the network itself. This traffic cannot be accessed by anyone that does
    not have access to the network. Unless the network is somehow compromised, the
    data contained within is rather bulletproof.


    Internet traffic is any data that comes in or goes out of the network. This is
    where things get tricky. If care is not taken to encrypt data or restrict access,
    then the network may be compromised. One simple example of compromise could be
    removing your router’s password thereby leaving it as an open network. That means
    that anyone can access your network and even play with your router. This could
    lead to packet sniffing and interception of your data. Therefore, great care needs
    to be taken to restrict the access to wireless data points. If you are not careful
    to restrict network access through the use of a username and password, you would
    be opening up the door to unwanted intruders.


    # Data security areas or zones


    The next level of security is protecting the data itself. So, even if the network
    is comprised and subsequently breached by an unwanted intruder, the data package
    will be useless to them unless'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'they are able to break the encryption. High-level encryption is virtually impossible
    to break. This can only be done through the use of the algorithm which was used
    to encrypt the data in the first place. So, unless the hacker actually has access
    to the algorithm, there is not much they can do to break it.


    It should be noted that if the data is encrypted with a low-level algorithm, then
    there is a chance that a very clever hacker could break the code and subsequently
    crack into your data. However, sites and networks that use 128-bit encryption
    are essentially bulletproof as cracking through encryption that complex may take
    forever. Unless a hacker is somehow unusually determined to break through, they
    will give up when they see that breaking through may take them years to achieve.


    # **Physical Access areas or zones**


    This is the next line of network security. It is also arguably the most important
    since a breach in the physical security of a network can lead to catastrophic
    results. This is the reason why you see armed guards at the door of server rooms,
    or at the entrance of building housing physical equipment.


    While physical security doesn’t always need to go to such extremes, it is important
    to protect access to physical equipment. Often, the biggest breaches of security
    don’t occur as a result of hack, but rather, they are the work of an individual
    who gains access to physical computers and is able to download information into
    a pen drive or a CD. Some of the standard practices which many companies implement
    include disabling USB ports or disk drives. Also, restrictions on data transfer
    can be set in place such as the requirement of administrator passwords for file
    copying and accessing shared folders.


    For the average user, adding password protection to a computer is often enough
    to keep snoops out. Also, logging out of a session on a shared computer is a great
    way to avoid unwanted access to file folders. One common mistake is allowing a
    web browser to save the password to your accounts on a shared computer. If someone
    figures out your username, all they need to do is enter it and the browser takes
    care of the rest.


    # **Understanding access to data**


    One common practice is to assign levels of access to data. This means that certain
    data sets may have “open data” meaning that anyone within the organization, or
    with network access, may be able to see it. In other cases, the definition of
    open access may refer to certain information being of public domain. This kind
    of information can be downloaded from a website or accessed by request. This kind
    of information may lack encryption in order to facilitate access.


    “Restricted data” refers to data which is not freely available to all users. Now,
    the definition of “restricted” is rather broad in the sense that it may only apply
    to users with network access, or it might be restricted to users with password
    access. This is commonly found in shared folders and cloud-based storage applications.
    These data sets may also have some kind of encryption attached to it thus limiting
    the abilities of unwanted users to read the information.


    Lastly, “confidential data” is the type which contains sensitive information of
    an organization. In'
  merge: -1
  img_proc: true
- pgno: 246
  md: this type of data, there are extreme security measures attached to it including
    high-level encryption and password access. This type of data may also be stored
    in “secret” drives and folders which only a limited number of users have access
    to. By understanding the tiers of sensitivity attached to data, you can take the
    appropriate measures that you need in order to protect your files and sensitive
    information. One such example “confidential data” could personal information belonging
    to customers while “open data” may be information about the products and services
    that a company offers to its customers.
  merge: -1
  img_proc: true
- pgno: 247
  md: '# **Network security best practices**


    Here are the best practices which you can put into practice when looking to protect
    your data.


    +   - Take control of physical access points such as USB and disk drives

    +   - Don’t neglect password restrictions to any sensitive information, folders
    and drives

    +   - Ensure that access to wireless networks is protected by password access
    while wired connections are accessible to only those users who have permission
    to use them

    +   - Avoid the use of external pen drives, disks and any other media which has
    not been previously scanned or cleared

    +   - The usage of high-level encryption will ensure that your data is bulletproof

    +   - Avoid the exchange of information over open networks or hotspots; these
    could be prone to packet sniffing

    +   - Shut down network access if there is a suspected network breach

    +   - Update passwords regularly (once a month is a good rule of thumb)

    +   - Discourage password sharing among co-workers

    +   - It is better to spring a little extra for top-level encryption in order
    to ensure that confidential data is safe even if intercepted

    +   - On the whole, network security is a matter of ensuring that you have the
    proper procedures in place. Also, it is important to have a clear idea of what
    to do in case of a data or security breach. Most firewall and antivirus programs
    will offer functionalities that will alert you of coming from an unknown source.
    In general terms, these alerts happen in real time. Consequently, you will have
    the opportunity to promptly shut down any potential attacks on your network'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Chapter 9: Wireless Technology and Security


    ![](img/e34dde0654d255bebea353c553e965ac_248_0.png)


    Fully functional wireless networks and devices seemed like a dream a decade ago.
    In fact, many experts in the field did not believe that that entire computer networks
    could be run on wireless connections. Yet, the dependence on wired connections
    has been drastically reduced over the last few years. Nowadays, a great deal of
    networks are run on wireless connections. For instance, cellphone communications
    are run entirely on wireless communications. Everything from calls to internet
    access; there is no need for any wired connections.


    In a nutshell, a wireless network is connection among devices which does not require
    the use of cables to connect the devices, either to the network or amongst themselves.
    In that sense, wireless networks offer a high degree of flexibility and simplicity
    as the physical limitations of having to install large amounts of wires and cabling
    is not needed. In addition, the network can span over longer distances and does
    not demand that users be physically present in a given location in order to gain
    access to the network.


    At present, wireless networks have simplified both access and mobility. Users
    can be on the move constantly and not miss a beat. This has enabled a multitude
    of users to experience new ways of communicating especially when moving away for
    long distances. Indeed, wireless technology has revolutionized the way we interact
    with the world around us.


    However, the use of wireless connections has also opened up a new set of threats
    and considerations which need to be taken into account. In general, wireless access
    requires both providers and users to exercise increased security practices. This
    is a stark contrast to a traditional wired connection.


    With wired connections, unauthorized users needed to have access to both a physical
    terminal and a port to connect to. This means that breaking into the network itself
    was a rather complex'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'task. Of course, an authorized user could perform a remote hack by gaining
    access through the use of a username and password. But most times, there had to
    be someone physically present in order to gain access to the network itself. This
    aspect of wired networks is lost in wireless communications. Anyone within range
    of the Wi-Fi signal can potentially gain access to the network. This is why free
    Wi-Fi hotspots can become so unsafe for the average user. The fact of the matter
    is that anyone can gain access to the network especially if it lacks encryption
    or the use of authentication.


    As a result, security experts advocate the use of authentication either by means
    of a username and password, or a captive portal in the case of hotspots. Furthermore,
    encryption is highly recommended in order to avoid potential loss of information
    due to a package interception. With that in mind, most home networks are rather
    safe, that is, a typical residential network that provides wireless internet access
    to a group of devices is rather safe from unwanted users. Yet, there is always
    the risk of someone being on the prowl looking to find a vulnerable network.


    In the case of business networks, wireless access needs to offer a greater degree
    of security. In many cases, enterprises deal with sensitive and confidential information.
    What this means is that networks administrators need to ensure that unwanted users
    stay as far away as possible. Still, employees need to gain access to the network
    so that they can perform their day to day functions. With this in mind, awareness
    of the need to protect access to such connections truly becomes of the utmost
    importance.


    # What to consider when setting up a wireless connection


    First and foremost, security is the biggest concern for wireless networks. In
    a world in which information is power, having access to information is a valuable
    commodity. As such, the question of security boils down to access to information
    and not access to the network itself. This means that the biggest concern in the
    mind of network administrators is not that unwanted users log on to the network;
    their biggest concern is that by logging on to the network, unwanted users will
    be privy to potentially sensitive information.


    In that regard, restricting access to unwanted users in the number one priority
    for network administrators. Simple measures such as making sure that all users
    have a username and password is often enough to stifle the average hacker.


    The next item that network administrators look to when setting up their wireless
    networks is simplicity. Simplicity implies the ease with which users can log on
    to the network and then use it to complete their objectives. With that in mind,
    administrators need to consider the bandwidth that will be required in order to
    accommodate the number of users on that particular network. Often, it is easy
    to underestimate the requisite bandwidth. In fact, it is quite common for an administrator
    to estimate a given bandwidth and then realize that it is not enough to handle
    a full load. Other times, an administrator might make an appropriate assessment
    of the bandwidth that is required for the current load of users but does not take
    into account future users. Therefore, it is essential that an administrator consider
    both present and future bandwidth requirements.


    Another important aspect to consider is the actual, physical infrastructure that
    is needed to produce the wireless network or provide Wi-Fi access to users. This
    physical infrastructure'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'comes in the way of routers and signal extenders. The most challenging part
    of the physical infrastructure is directing the signal to where users will be.
    This can be a potential headache when homes and buildings are designed in a free-flowing
    style. Wi-Fi signal can often get stuck going around corners or up and down stairs.
    Even concrete buildings can absorb the signal rather reflect to the devices that
    will connect.

    One other key consideration when setting up a wireless network is understanding
    the devices that will connect to it. For example, if the network will mainly consist
    of smartphones and tablets, then a larger number of devices can be accommodated
    on the network. In contrast, if a large number of PCs (which tend to be hungrier
    for bandwidth) connect to the network, then arrangements need to be made in order
    to accommodate the larger number of devices.

    On the whole, setting up a wireless network is far easier than a standard wired
    connection. The configuration of software is less complex while there is a definite
    savings in terms of money; there are far fewer components to purchase and cabling
    that needs to be installed.

    So, if you are looking to set up a network that won''t break the bank and will
    allow multiple users to long on easily, then a wireless network can certainly
    fulfill those needs.


    # Drawbacks of a wireless network


    For all its merits, a wireless network also poses a series of drawbacks that need
    to be taken into account. For starters, Wi-Fi access is far less reliable than
    wired access. The main reason for this is that signal strength on wireless networks
    fluctuates a lot more on wireless connections than it does on wired connections.
    In fact, there are many factors which can influence the quality of a wireless
    connection''s signal strength. Factors such as the weather or interference from
    other devices (phones, TVs and radios) may play into reducing the quality of a
    wireless signal. As a result, close monitoring of signal quality is essential
    in order to ensure proper functioning of the network.


    Another drawback is the connection''s speed. Generally speaking, a wired connection
    will always run a lot faster than a wireless one. The reason for this is that
    a Wi-Fi signal can disperse throughout the environment where it is located. In
    the case of a wired connection, it has nowhere else to go, but the cable where
    it is being transmitted. This is what makes wired connections a lot more reliable
    and faster than wireless ones.


    Also, wireless connections are dependent on the wireless adapter used by the devices
    that are connecting to the network. So, even if the network is reliable and free
    from obstructions, devices that do not have a solid and functional wireless adapter
    may actually experience decreased performance. Therefore, it is important to ensure
    that the devices connecting to the network have the best available wireless hardware.


    As you can see, wireless networks, even with their drawbacks, offer a serviceable
    solution for virtually all residential users and most enterprises. Ultimately,
    the network administrator, or home user, needs to determine if the characteristics
    of a wireless network meets their needs, or if a wired network might be more suitable.
    Yet, wireless networks offer a good solution across the board.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Types of wireless networks and connections


    Thus far, we have focused on wireless networks under the assumption that the network
    is designed to connect to the internet. This assumption is valid since the vast
    majority of networks will require some kind of internet access at some point.
    Most of the time, the reason for the network is so that it can connect to the
    internet.


    Yet, there are other types of wireless connections which devices can use to communicate
    among each other.


    To start off, Bluetooth is a common tool used to connect a small number of devices
    together. Usually, it consists two devices which are paired with each other. A
    common example of this wireless headphones connected to a smartphone. Also, a
    printer can connect to a computer or a phone may sync with a computer and so on.


    Bluetooth is far slower than other types of wireless communication. Yet, it is
    useful for linking devices which aren’t too far apart. Perhaps the biggest drawback
    is security as Bluetooth connections don’t have much in the way of encryption
    to speak of. So, a skilled hacker may be able to connect to a device which happens
    to have Bluetooth enabled.


    Beyond a run-of-the-mill Bluetooth connection, wireless networks can be rather
    simple and straightforward, or they can get rather complex.


    A Wireless Local Area Network (WLAN) can be set up to enable communication among
    a small number of computers with or without access to the internet. In most cases,
    WLANs will have some form of access to the internet. Although, very confidential
    connections may be confined to a small workgroup using a WLAN without necessarily
    having access to the internet. In fact, there may be a separate WLAN that does
    have internet access. That way, the risk of a security breach can be limited.
    This type of connection can be limited to a home, individual office or perhaps
    an entire building.


    The next level is a Wireless Wide Area Network (WWAN). In this type of network,
    there is a much larger area to be covered. If the physical area exceeds the usual
    range of a wireless network, internet access may be required in order to join
    multiple connections. This type of connection can be used to link larger geographical
    areas such as several city blocks.


    A larger type of network is known as a Wireless Metropolitan Area Network (WMAN).
    This is the kind of network which can be used to link an entire city. Unless there
    are several repeater points that can distribute the signal over large physical
    areas, the most effective way to connect devices over a large area is to link
    them over the internet. In that case, any number of users can log on to the network
    as the need may be.


    WMANs are used to connect entire cities. These are the types of networks which
    are used by large organizations. For instance, companies with several locations
    spread out over a city may rely on this type of configuration to help them manage
    communication among all of their users. These networks are also commonly used
    for commercial purposes such as advertising and broadcasting information.


    One important factor that all of these connections have in common is that there
    is a central hub from which the signal is generated. This hub then sends out the
    signal to the various devices that'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'will connect to it. Also, repeaters and signal extenders may be used in order
    to ensure that the signal covers the entire physical space that the administrator
    is looking to grant access. Based on this logic, an ad-hoc connection is one that
    is set up without any kind of planning. For example, a laptop computer uses Bluetooth
    to connect a wireless printer and a smartphone. Then, the network will be disbanded
    once the tasks are complete. Another good example is when a smartphone is used
    as a wireless hotspot. In this case, the phone enables various devices to connect
    to it and thereby access the internet. Once the need for internet access is gone,
    then the network is disbanded.


    As you can see, an ad-hoc network serves a very specific purpose and then when
    it is no longer required, it disappears. Experienced users are good at building
    ad-hoc networks from scratch, either to help them when they are in a tough spot,
    or as means of streamlining work.


    Lastly, a hybrid connection is the kind which combines both wired and wireless
    access. This kind of network is commonly seen in enterprise settings. This type
    of network addresses all of the needs of a company in that wired connections are
    generally used for desktop PCs while wireless connections are used for laptops
    and mobile devices. Furthermore, a hybrid network offers a combination of mobility
    and security. Secure connections can be achieved on the wired connection while
    the wireless network can provide mobility to users. Since wireless connections
    tend to be less reliable than wired ones, the most sensitive tasks and information
    is carried out over the wired connection leaving less complex and sensitive tasks
    to the wireless network.


    # Other uses of wireless technology


    In the past, more rudimentary wireless technology such as shortwave radios provided
    the opportunity to connect over certain distances especially when traditional
    broadcasting was unavailable. To this day, shortwave radios are essentially used
    by emergency broadcast systems and aficionados. However, this type of technology
    is still seen in law enforcement and emergency crews. While shortwave technology
    does not have a great deal of range, it is often enough to cover larger areas
    such as a medium-sized city.


    Also, traditional radio communications are a great alternative since they provide
    users with the ability to connect without having the need for an expensive setup.
    With that in mind, user don''t have to rely on the internet or even electrical
    energy to communicate.


    As a matter of fact, military grade radios use solar powered cells to recharge
    batteries. This enables military units to remain operational for extended periods
    of time especially when deployed in battle. These types of radios are also used
    in marine communications as well as airborne surveillance.


    In addition, companies that have a great deal of moving parts use radios to communicate
    among its various parts. Trucking companies, factories and warehouses all use
    some type of radio communication to stay in the loop. Hospitals and emergency
    services utilize radio communications as a means of ensuring capabilities.


    Radio technology has also been applied to what is now known as Radio Frequency
    Identification'
  merge: -1
  img_proc: true
- pgno: 253
  md: '(RFID). This type of technology is used as a wireless network mainly deployed
    to identify and track units such as people, animals and vehicles. It is commonly
    used by trucking and cab companies to keep tabs on their vehicles. Additionally,
    researchers use RFID to track animals in the wild.


    There are two parts to an RFID system, an emitter and a receiver. The emitter,
    or transmitter, sends out a radio frequency that is picked up by the receiver.
    The receiver can then translate that signal into a digital signal which can be
    utilized to track movements on a map or pinpoint the location of a unit. This
    system has been deployed in search and rescue operations as well as scientific
    research.


    Some critics of RFID claim that it is used to illegally surveil individuals. However,
    there is not conclusive evidence of its use outside of tracking people and objects
    for legitimate purposes. For example, people who are under house arrest that must
    wear an ankle bracelet have an RFID system attached to them. This allows law enforcement
    to determine their position in case they choose to flee.


    One other interesting application of wireless technology can be seen in satellite
    communications. Traditional cellular telephony makes use of the Global System
    for Mobile (GSM) network. This network uses a SIM card with a unique ID on it
    to identify a mobile phone’s number. This enables the mobile phone to place calls
    and have access to the internet.


    However, in the case of a satellite communication, mobile receivers and transmitters
    don’t necessarily use the traditional GSM network. In fact, they may bypass this
    system altogether and connect to any of the other communications satellites in
    the Earth’s orbit. These so-called satellite phones have coverage in virtually
    all corners of the Earth.


    One great example of this kind of communications is military satcom. Harris radios,
    for instance, use UHF and VHF frequencies to communicate among aircraft and seaborne
    vessels. Ultra-high frequency (UHF) and Very High Frequency (VHF), can be used
    to triangulate communication between an airborne vessel and a ground crew. Given
    the advancements in this type of technology, air crews can send live video in
    HD to ground crews who can then assess a situation as seen from the aircraft.


    This type of technology has been widely employed for aerial reconnaissance, for
    example in border protection, as well as, search and rescue and disaster relief.
    There is also a weather application for the use of the technology through the
    use of Unmanned Aerial Vehicles (UAV). These types of vehicles can track weather
    patterns to a point where a manned crew would never be able to reach. All of the
    communications are relayed from the aircraft up to the satellite and then broadcast
    back down to the ground crew. Likewise, the ground crew can then communicate with
    the aircraft in mid-flight.


    These examples all show how wireless communications have a plethora of applications.
    There ensure that communication does not breakdown and can be maintained over
    vast areas of physical space. While the more robust capabilities of such wireless
    communication is reserved for the domain of military and law enforcement, civilian
    applications have led to the mapping of'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'remote areas of the planet and the discovery of previously unknown features
    of the Earth.


    One of the most common issues that arises when discussing UHF and VHF communications
    is encryption. It should be noted that these types of networks use military-grade
    encryption meaning that it uses the most robust algorithms known to date. These
    algorithms are essentially impossible to crack since they would require a vast
    amount of computing power that the average hacker would never be able to procure.


    If you are keen on using these types of communication networks, there are civilian
    versions of satellite phones which can be purchased freely. They come with a subscription
    that grants access to the network of satellites that orbit the Earth. They are
    essentially the same satellites that the military uses. However, you would not
    have access to the same channels and frequencies that the military does.


    # ## The Global Positioning System


    The Global Positioning System (GPS) is essentially a wireless network that is
    used as a navigation aid. It is used in all types of transportation. In fact,
    it is so common nowadays, that most smartphones come equipped with a GPS application
    that enables users to pinpoint any location on the planet.


    One great example of such application is Google Maps. This application can help
    drivers navigate practically any city in the world with frightening accuracy.
    Technically, this application does not need internet access since it uses its
    satellite link and not its internet signal. Yet, the application does not function
    appropriately since it uses an internet connection to download maps for its current
    location. What this means is that your phone determines your location by using
    the GPS network, but needs internet access to download the map for that location.


    Google Street View is an example of how accurate satellite mapping can be. The
    satellite orbiting the Earth can literally take pictures of an average street
    while it is hundreds of miles above. This is certainly an incredible and very
    useful feature.


    The GPS system uses the same system as satcom or GSM technology. It essentially
    works in a triangulation system, that is, the satellite, the receiver and the
    tower. This triangulation is what enables the pinpointing of precise locations.


    In the case of marine applications in which there are no towers in the middle
    of the ocean, GPS can maintain triangulation by using other satellites in orbit.
    This is why military applications of the GPS system enable units to navigate any
    corner of the world. For the average user though, GPS is a lifesaver when driving
    in a new city or through an unknown path.


    # ## Bringing it all together


    Wireless networks are here to stay. They make linking devices, and by extension
    users, a lot easier than through traditional wired connections. For all of the
    ease of use and mobility, questions about the overall reliability of wireless
    networks still abound. The fact of the matter is that this is technology which
    is yet to be perfected. What this means is that there are bugs still to be worked
    out.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'As far as the average user is concerned, wireless has come a long way. Most
    cell carriers have a decent record of reliability. So, unless there is a natural
    disaster that disrupts coverage, wireless networks are usually reliable.


    The other aspect to wireless networks is security. High-level encryption has increased
    information security tremendously over the last few years. In fact, standard encryption
    as offered by free web-based email servers is good enough to keep the average
    intruder away from your information. There are more robust subscription services
    out there which offer closet to military-grade encryption. These services are
    commonly used by companies and individuals who handle a great deal of sensitive
    information. On the whole, wireless technology is easy to use and very flexible.
    It will certainly meet the needs of the average user while enabling more advanced
    users to get their job done. By following the security guidelines which we have
    outlined earlier in this book, you can rest assured that your information will
    be safe from the attacks of unscrupulous folks. After all, hackers love to feed
    off low hanging fruit. They generally run away from a serious challenge. Thus,
    you can make it hard for them by beefing up your security measures.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Chapter 10: Introduction to Machine Learning: A Computer Networking Perspective


    ![](img/e34dde0654d255bebea353c553e965ac_256_0.png)'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# What is Machine Learning?


    The above analogy is merely intended to draw our attention to the primary topic
    issue that concerns this study session: machine learning.


    Can computers really learn? Better still, can they learn from their experiences
    with the different tasks that they handle on a day-to-day basis? Machine learning
    is a discipline that can sufficiently provide answers to the above questions.


    In a layman’s language, machine learning can be described as a process of acquiring
    skills that have been accumulated over time through observation. We can deduce
    from this simple description that machine learning starts by observation. The
    observation goes for a certain period.


    In the process of observing, skills are acquired while others are sharpened even
    further-learning from experience. This is one example of a normal human’s learning
    throughout their time here on planet earth.


    A more concrete definition of machine does exist. Let’s say that machine is a
    process that involves the acquisition of specialized skill(s) computed/accumulated
    from data over a period of time. Still, this sounds like we’re talking about humans.


    But we need to talk about machine learning in terms of machine ‘behavior’, and
    more specifically, as regards computers.


    # In Computing Terms


    Machine learning is classified as a subset of Artificial Intelligence. As a subset
    of Artificial Intelligence, machine learning entails the development of algorithms
    that enable computers to learn from accumulated data and functions performed in
    the past. This concept was conceived in 1959 by Arthur Samuel.


    Sample historical data (training data) offer a basis for machine learning algorithms
    to deliver models that aid in decision-making as well as predictions. This is
    done without any explicit programming.


    Creative predictive models are products of the union between statistics and computer
    science.


    # How Machine Learning Works


    Machine learning system achieves its mandate by following the following steps:


    +   - Thorough examination of (or learning from) historical data that has accumulated
    over a given period.


    +   - Building of prediction models.


    +   - Prediction of output (on reception of new data).


    The amount of data largely determines how accurate the predicted output turns
    out to be. A huge sample of historical is necessary for creating better prediction
    models that guarantee high accuracy of predicted output.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Features of Machine Learning


    The following are the main characteristics of Machine Learning:


    +   - The use of data for pattern detection in datasets.

    +   - Automatic improvement after learning from historical data.

    +   - Machine learning is technologically data driven.

    +   - It has appreciable similarities with data mining-dealing with huge data
    amounts.


    # Why Machine Learning?


    There is a day-by-day increase in the need for machine learning. One key factor
    for embracing machine learning with unimaginable seriousness as it is now, obviously,
    is the ability of machines to handle tasks that are highly sophisticated; better
    than humans. We can read, understand and interpret data, but we are only limited
    to a few megabytes of data. Machines can handle terabytes of data, or even more,
    with a lot of accuracy.


    With machine learning, the world can now boast of self-driven cars. Friend suggestion
    on social media platforms is also real, thanks to machine learning. Furthermore,
    face recognition, among other big advancements, are outcomes after big strides
    in machine learning.


    In summary, the need for machine learning is anchored on the following key observations:


    +   - Increment and rapid production of data, in respect of the widespread adoption
    of information systems.

    +   - Handling highly sophisticated tasks that are practically impossible to a
    human being.

    +   - Critical decision-making needs with regards to large and complex data or
    information. For instance, in finance and economics projections for individual
    businesses, companies and even governments.

    +   - Extracting patterns and information that are not easily visible to the human
    eye


    # Classification of machine learning


    Machine learning is classified as follows:


    **Reinforcement learning:** this is a feedback-based mode of learning. A learning
    agent (machine) is penalized for every wrong pattern prediction and undesirable
    outcome. On the other hand, the same learning agent (machine) is rewarded for
    a job well done.


    **Unsupervised learning:** a machine trains on outcome prediction without any
    supervision. Given data sets are not labeled, but the machine has to learn and
    eventually predict an outcome. Unsupervised machine learning is categorized into
    clustering and association.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '**Supervised learning:** labeled data is provided to a machine. The machine
    is trains on pattern prediction therefrom and eventually gives a prediction on
