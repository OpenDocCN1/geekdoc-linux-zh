  md: '# Techniques of Hacking


    There are various techniques which are being used by the hackers for exploiting
    a system.


    +   **SQL Injection**: SQL or structured query language has been designed for
    the purpose of exploiting various forms of data in the database of the victim.
    This form of attack falls under the cyber attack which targets the databases via
    the statements of SQL for tricking the systems. This form of attack is generally
    carried out by the use of website interface which attempts in issuing the commands
    of SQL through a database for hacking the passwords, usernames and other related
    information related to the database. All those websites along with web applications
    which are coded poorly are very much prone to the SQL injection attacks. This
    is because the applications which are based on the web contains various user input
    fields like login pages, search pages, request forms related to support and products,
    comments section and many others which are very much susceptible to the attacks
    and can be very easily hacked by simple manipulation of the codes.


    +   **DDoS or Distributed Denial of Service:** It is a form of hacking attack
    in which the normal traffic of a server is distorted from entering the server
    and floods the traffic of the network. This ultimately results in denial of service
    as it serves just like a traffic jam which clogs the roads and also prevents the
    regular form of traffic from reaching the destination. All the devices of today
    such as IoT devices, computers, mobile phones etc. which connects with the network
    are very much prone to the attacks of DDoS.


    +   **MAC Spoofing:** Each and every form of device which are used by the people
    today come with network interface controller or NIC. It helps the users to connect
    with the network such as with the internet directly. The NIC of each device is
    accompanied with a MAC address which is assigned after various processes of hard
    coding. The MAC spoofing attack is a very deadly form of attack in which the hackers
    hide themselves and their system behind a customized and false MAC address. This
    reduces the risks on the part of the hackers from getting caught. So, you might
    give access to a new system thinking of it to be absolutely legitimate but it
    might happen that a hacker will hide himself behind a false MAC address which
    you cannot even realize.


    By using this technique, the hackers can easily hack internet connection via Wi-Fi
    and can also gain access to all those devices which are connected to each other
    via LAN. The technique of MAC spoofing also leads to several forms of other serious
    crimes in which the hackers steal the identity of someone else and carries on
    with some serious form of data breaching in which someone will be held as guilty
    without even knowing about the actual hacker. However, there'
