    # ## Clustering


    There are a number of different clustering techniques that you are able to work
    with when it comes to handling a data analysis. These are all going to take the
    data, though and put them together in clusters so you can see more about the distribution
    of where your points of data are going to fall. There are different ways that
    you are able to work with clustering, and different ways that you can cluster
    up your data, but it is a good way to put the information into groups and see
    some good insights right away.


    The number of clusters that you will have in your work is going to depend on what
    you are focusing on. For example, if you are working to divide your group into
    males and females, then you will only need to have two clusters. But if you would
    like to divide things up by the age of your customers, or by where they live in
    the country or the world, then you will probably need to have more than two clusters
    in order to have the best idea of what is going on.


    With these clusters, you will be able to plot them on something like a scatterplot,
    and then figure out where everything is going to fall. This is a great way to
    figure out the best options to take, whether there is a new demographic that you
    need to work with, and more. You can just put these clusters on your scatterplot,
    and you can learn a lot of information in a short amount of time.


    The idea of these clusters is pretty simple. When you have some data points that
    fall into the same cluster, you can safely make the assumption that the points
    are going to have some similarities with one another. But if the data points are
    not in the same cluster, then this is a sign that they are going to be different
    from one another. If we are able to keep this in mind, it is a lot easier for
    us to work with understanding this kind of algorithm.


