  md: 'system that does the conversation of data from a given presentation format
    to another presentation format.


    This layer is also referred to as the syntax layer.


    # Role of the Presentation Layer


    +   - **Translation:** processes in different systems exchange information as
    character numbers, character strings, and many more. Different encoding techniques
    are applied on different computing machines. It is the presentation layer that
    handles interoperability between them unlike encoding techniques.


    The layer does the conversion of data from the sender-based formats into common
    formats into receiver-dependent formats at the destination computers.


    +   - **Encryption:** the presentation layer performs encryption to ensure the
    privacy of data.


    Encryption is the process that involves the conversion of information transmitted
    from the sender into another unique form that is then transmitted over the network.


    +   - **Compression:** the presentation compresses data before its transmission.
    The compression involves the reduction of the number of bits. This is process
    is essential especially in the transmission of multimedia such as video and audio
    files.


    # The Application Layer


    This layer offers the interface for users and applications to access resources
    on the network. It handles network issues like resource allocation, transparency,
    and many more. This is not an application. It simply plays its application layer
    role. It provides network services to end-users.


    # Application Layer Functions


    +   - **Access, transfer, and management of files:** this layer allows users to
    access files remotely, retrieve them and still manage them remotely.


    +   - **Mail services:** this layer offers an email storage and forwarding storage
    facility.


    +   - **Directory services:** this layer offers the distributed database bases.
    This is essential in the provision of important information about different objects.'
  merge: -1
