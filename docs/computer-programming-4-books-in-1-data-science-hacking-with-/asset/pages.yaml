    # ### K Means Clustering


    Let us manually demonstrate how this algorithm works before implementing it on
    Scikit-Learn:


    Suppose we have two-dimensional data instances given below and by the name D:


    ```

    ```text

    D = ((2,3), (10,12), (12,13), (5,8), (30,42), (82,30), (1,80), (80,3), (2,25),
    (80,81))

    ```

    ```


    Our objective is to classify the data based on the similarity between the data
    points.


    We should first initialize the values for the centroids of both clusters, and
    this should be done randomly. The centroids will be named c1 and c2 for clusters
    C1 and C2 respectively, and we will initialize them with the values for the first
    two data points, that is, (5,3) and (10,15). It is after this that you should
    begin the iterations. Anytime that you calculate the Euclidean distance, the data
    point should be assigned to the cluster with the shortest Euclidean distance.
    Let us take the example of the data point (5,3):


    ```

    ```text

    Euclidean Distance from the Cluster Centroid c1 = (5,3) = 0

    Euclidean Distance from the Cluster Centroid c2 = (10,15) = 13

    ```

    ```


    The Euclidean distance for the data point from point centroid c1 is shorter compared
    to the distance of the same data point from centroid c2. This means that this
    data point will be assigned to the cluster C1. The distance from the data point
    to the centroid c2 is shorter; hence, it will be assigned to the cluster C2. Now
    that the data points have been assigned to the right clusters, the next step should
    involve the calculation of the new centroid values. The values should be calculated
    by determining the means of the coordinates for the data points belonging to a
    certain cluster. If for example for C1 we had allocated the following two data
    points to the cluster:


    (5, 3) and (24, 10). The new value for x coordinate will be the mean of the two:

    x = (5 + 24) / 2'
