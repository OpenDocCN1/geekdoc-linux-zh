- pgno: 213
  md: '# Peer-to-Peer Communication


    The peer-to-peer network setup offers a simple and cost-friendly networking solution
    in which the basic networking functions are needed. Peer-to-peer is ideal where
    file sharing and other basic resources such as printers. In this networking arrangement,
    there is no need for a dedicated server. The elimination of a network from the
    budget makes this kind of networking a highly pocket-friendly venture. It must
    be understood that network servers are quite expensive. They significantly contribute
    to the overall cost of a network. Therefore, its omission from the shopping list
    is a great way of cutting down on the installation cost of a network, as well
    as overall management of the network. It is the most ideal option for the implementation
    of small networks.


    Features of Peer-to-Peer Networking


    The following are the main features of Peer-to-Peer Networking:


    +   - All network computers have equal privileges. They behave like peers.


    +   - Each network host acts like both client and server. Essentially, a network
    can send out requests to another network hosts. Similarly, each host can receive
    requests from other any other host on the network.


    +   - There is centralized administration of resources. This is due to the omission
    of a dedicated server from the setup. This also forms a concrete basis for connoting
    a peer-to-peer network as a workgroup. The peers collaborate freely without any
    centralized control or regulation.


    +   - You only need to install an operating system on each peer and then physically
    connecting the peers via the NICs (NICs are not even necessary when working with
    Macintosh computers).


    # Merits of Peer-to-Peer Communication


    The following are the main advantages of a peer-to-peer network implementation:


    +   - Peer-to-peer network implementations are easy install since they only involve
    the installation of operating systems on peer computers and physically connecting
    them.


    +   - They are less expensive since a costly server computer is not needed. Furthermore,
    a Network Operating System (NOS) is also not needed.


    +   - All required is readily available, most of which comes packaged in your
    operating system.


    +   - The network implementation is reliable since failure or malfunction of a
    single peer does not lead to failure of another, or failure of the entire network.


    # Demerits of Peer-to-Peer Communication


    The following are the main limitations of a peer-to-peer network:'
  merge: -1
  img_proc: true
