    # Neural networks


    A neural network refers to a set of algorithms that are used for pattern recognition.
    The algorithms are loosely molded after the brains of humans.


    Neural networks are most crucial in the interpretation of sensory data via machine
    perception, clustering and labelling raw data.


    A neural network recognizes numerical patterns that are found in vectors. All
    data-time series, images, text and sound-are translated in the vectors.


    # Functions of Neural Networks


    The following are the 3 most vital roles that can be performed by neural networks:


    **Classification:** labeled data sets are the key factors in any classification.
    Humans have to transfer their own knowledge to the labeled dataset so as to enable
    a neural network to get the correlation data and the labels in a process known
    as supervised learning.


    A neural network can achieve the following classification tasks:


    +   - Face detection, people identification in images and recognition of facial
    expressions.


    +   - Object identification in images.'
