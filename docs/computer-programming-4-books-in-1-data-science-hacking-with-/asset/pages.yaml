    engineering. Once the rootkits have been installed in the system of the victim,
    the attacker gains access to the system secretly and controls the overall functioning
    with which they can easily steal confidential data and information and can also
    shut down a system completely.


    +   **Keyloggers**: This is a very special type of tool which has been designed
