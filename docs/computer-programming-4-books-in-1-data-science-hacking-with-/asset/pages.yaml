  md: '# Networks Types


    The following are the four major classifications of computer networks based on
    size:


    # Local Area Network (or simply, LAN)


    A LAN refers to any group of computers that are linked to one another a small
    area like an office or a small building. In a LAN, two or more computers are connected
    via communication media like coaxial cables, twisted pair cable or fiber-optic
    cable.


    It is easy and less costly to set up a LAN since it can do just fine with inexpensive
    network hardware such as switches, Ethernet cables and network adapters. The limited
    traffic allows for faster transmission of data over LANs.


    Besides, LANs are easy to manage since they are set up in a small space. Thus,
    even security enforcement is also enhanced through closer monitoring of activities
    within the network''s geographical location.


    # Personal Area Network (PAN)


    This network is arranged and managed in the space of its user(s)-normally a range
    not exceeding 10m. It is typically used to connect computer devices for personal
    use.


    Components of a personal area network include a laptop, mobile phone, media player
    devices as well as play stations. Such components are located within an area of
    about 30ft of a person''s space.


    The idea of PANs was born by one Thomas Zimmerman-the first lead research scientist
    to conceive the idea of personal area networks.


    There are 2 classes of PANSs:


    +   - **Wired PANs**: a wired personal area network is created when a person uses
    a USB cable to connect two different hardware devices. For instance, it is common
    practice nowadays to connect a phone to a computer via a USB cable-to share files,
    access the Internet, and many other things.


    +   - **Wireless PANs**: a wireless PAN is set up by the use of existing wireless
    technologies such as Bluetooth and Wi-Fi. This is basically a low-range technology
    network type.


    # Examples of PANs


    There are 3 common types of personal area networks:


    +   1. **Body Area Network**: it moves with an individual. A good example is a
    mobile network-when one establishes a network connection and then makes a connection
    with a different device within their range.


    +   2. **Offline Network**: it is also called a home network. It can be set up
    in a home-linked computer, TV, printers and phones-but is not connected to the
    internet.


    +   3. **Small Home Office Network**: different devices are connected to the Internet
    and'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'corporate network via VPN.


    # Metropolitan Area Network (or simply, MAN)


    A MAN is a type of network that extends over a larger geographical area by interconnecting
    different LANs to form a bigger network of computers. Thus, it covers a wider
    area than a LAN. MANs are ideally set up in cities and big towns. Hence, the name
    metropolitan area network. It is often used by government agencies to connect
    with citizens some big institutions; communication among banking institutions
    within a given city; in big institutions of higher learning located in a metropolis;
    and even used for communication in military bases within a city/town.\nThe commonly
    adopted Metropolitan area network protocols include Frame Relay, ISDN, RS-232,
    ADSL, ATM and OC-3, among others.


    # Wide Area Network (or simply, WAN)


    This is a network that stretches over large geographical regions-cities, states
    and even countries. It is bigger than LAN or MAN. It is not restricted to a particular
    geographical location. It spans over large geographical locations by the use of
    telephone lines, satellite links or fiber optic cables. The Internet is a perfect
    example among the existing WANs globally.\nWANs are widely embraced for education,
    government and business activities.


    # WAN Examples


    +   * **Mobile Broadband:** 3G or 4G networks are widely serving people in a big
    region, state or even country.

    +   * **Private Network:** banks create private networks that link different offices
    established in different locations via a telephone leased line that’s obtained
    from a telecom company.

    +   * **Last Mile:** telecommunication companies offer internet services to thousands
    of customers in different cities by simply connecting homes, offices and business
    premises with fiber.


    # Advantages of WANs


    +   * WANs cover large geographical locations reaching out to masses of the human
    population. The impact of the Internet in people’s lives globally sums up the
    advantages of a wide area network.

    +   * Centralized data: WANs support centralization of data/information. This
    eliminates a need for individuals to buy back-up servers for their emails and
    files.

    +   * Getting updated files: programmers get updated files within seconds since
    software work on live servers.

    +   * Quick exchange of message: WANs use technologies and sophisticated tools
    that enable message exchange to happen faster than on most other networks.'
  merge: -1
  img_proc: true
