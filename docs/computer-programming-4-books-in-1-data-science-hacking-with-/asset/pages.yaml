- pgno: 12
  md: '# Chapter 1: Introduction to Data Analysis


    ![](img/e34dde0654d255bebea353c553e965ac_12_0.png)


    The act of inspecting, cleaning, transforming, and modeling data with the intention
    to find relevant information and reaching a conclusion to boost the decision-making
    process is referred to as Data Analysis.


    There are different facets and techniques for data analysis. The data analysis
    in statistics is categorized into exploratory data analysis, confirmatory data
    analysis, and descriptive statistics. Data requires to be cleaned. Data cleaning
    is the procedure of fixing the outliers and other inaccurate and unwanted information.
    There are different types of data cleaning processes to use based on the type
    of data to be cleaned. Business intelligence explores the data analysis that extends
    heavily on aggregation, slicing, disaggregation, dicing, and concentrating on
    the business information. Predictive analytics refers to the use of statistical
    models for predictive forecasting. Text analytics describes the application of
    statistical, structural models, and linguistic models to derive and categorize
    the information from texts. All these describe different varieties of data analysis.


    # Python for Data Science


    # Why Select Python


    Python is a simple, clear, and elaborate programming language. That is the reason
    many scientists and engineers go for Python to implement numerous applications.
    Probably they prefer handling the main task quickly rather than spend hundreds
    of hours mastering the nuances of a “complex” programming language.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'This lets scientists, engineers, researchers, and analysts to dive into the
    project more quickly. As a result, they gain important insights into the minimum
    amount of time and resources. This does not imply that Python is fit and perfect
    programming language on where to complete data analysis and machine learning.
    Languages such as R may have advantages and properties Python doesn’t have. However,
    Python is a good starting point, and you may attain the right knowledge of data
    analysis if you use it in future projects.


    # Python vs. R


    You may have already come across this in Reddit, Stack Overflow, and other forums
    and websites. You may have also searched for other programming languages because
    even learning Python or R requires a few weeks and months. It is a huge time investment,
    and you don’t want to make any mistake.


    To avoid any confusion, just begin with Python because the usual skills and concepts
    are easy to transfer to other languages. In some cases, you may need to adopt
    a whole new approach to thinking. But all in all, understanding how to apply Python
    in data analysis will provide you a channel to solve many complex problems.


    Some may say that R is designed for statisticians, especially when it comes to
    easy and better data visualization properties. It’s also easy to learn, especially
    if you plan to use it for data analysis. On the flipside, Python is a bit flexible
    because it goes past data analysis. Most data scientists and machine learning
    practitioners may have selected Python because the code they write can be integrated
    into a dynamic and live web application. While it’s open for debate, Python is
    still a great choice for beginners or anyone who wants to get started with data
    analysis and machine learning. It is quite easy to learn, and you can dive into
    full-time programming if you see that this suits you well.


    # Widespread Application of Data Analysis


    There are a lot of packages and tools that enable the usage of Python in Data
    analysis and machine learning. Some of these packages consist of Numpy, scikit-learn,
    and Pandas. These tools simplify the data analysis process.


    Additionally, graduates from the university can dive into data science because
    most universities nowadays provide an introductory course in computer science
    with Python as the main programming language. The change from computer programming
    and software development can happen so fast because many people already have the
    correct foundation to begin learning and using programming to tackle real-world
    data problems.


    Another reason for Python’s popularity use is that there are numerous resources
    that will show you how to complete anything. If you’ve any questions, it is because
    someone else has requested'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'that, and another solved it for you. This makes Python more popular because
    of the presence of resources online.


    # **Clarity**


    Because of the ease of learning and Python’s syntax clarity, experts can concentrate
    on the crucial features of their projects and problems. For instance, they can
    apply Numpy, TensorFlow, and scikit-learn to gain insights rather than build everything
    from scratch. This generates another level of clarity because professionals can
    concentrate on the nature of the problem and its effects. They can also come up
    with effective approaches to handling the problem rather than being bombarded
    with the many challenges a given programming language presents.


    The main aim should always be on the challenge and the opportunities it may bring.
    It only requires a single breakthrough to change the entire thinking about a given
    problem, and Python can achieve that because of its ease and clarity.


    # **Types of Data Analysis**


    # **Descriptive Analysis**


    Data science is related to information retrieval and data collection approaches
    with the aim of reconstituting past events to determine patterns and identify
    insights that help determine what happened and what made it happen. For instance,
    looking at sales figures by region to identify customer preferences. This section
    requires that you remain familiar with statistics and data visualization approaches.


    # **Predictive Analysis**


    Data science is a means to determine the chances that some events are currently
    taking place or will occur in the future. In the following case, the data scientist
    considers past data to determine explanatory variables and create statistical
    models that can be used in other data points. For instance, trying to predict
    the probability that a certain credit card transaction is fraudulent in real-time.
    This section is usually related to the machine learning field.


    # **Prescriptive Analysis**


    In this case, data analysis is considered as a way to make informed decisions,
    or probably data-driven decisions. The focus should be to search for multiple
    options and applying simulation approaches and optimize the results. For instance,
    maximizing the supply chain by aiming to reduce the operating costs. Typically,
    descriptive data science aims to address the question of what does the data tell
    me. On the other hand, the predictive analysis answers the question of why is
    the data behaving in this'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'way, and prescriptive analysis respond to the question of how you optimize
    the data toward a given goal.


    # **Why Data Analysis Is on the Rise?**


    There are several factors that lead to the rise of data science.


    First, the amount of data gathered increases at an exponential rate. According
    to a certain IBM Marketing Cloud research, around 2.5 quintillion bytes are generated
    daily. This is around 2.5 billion bytes, but only a small fraction of this data
    is ever analyzed, leaving a lot of missed opportunities on the table.


    Secondly, we are experiencing a cognitive revolution that began some years ago.
    Nearly every industry is going for AI technology, which comprises of natural language
    processing (NLP) and machine learning. Although these sections existed for some
    time, they have recently achieved renewed attention to the point that they are
    now popular courses in colleges. It is now clear that, if they are to survive,
    companies require to be more agile, move faster, and shift into digital businesses,
    and as the time available for decision-making reduces, they must be fully data-driven.


    If you also include the fact that AI algorithms require high-quality data, you
    can start to understand the vital role played by data scientists.


    Another reason is that with the growth of cloud technologies and the rise of platforms
    as a Service (PaaS), access to computing engines and storage has never been easier.
    Running big data workloads is now available to smaller organizations or any person
    with a credit card. In turn, this is driving the growth of innovation across the
    board.


    Because of the following reasons, there is no question that data science is here
    with us and that its development will continue for a long time. Still, we cannot
    ignore the fact that it hasn''t achieved its full potential and generated the
    right results, especially in enabling companies to transform into data-driven
    organizations. In most cases, the problem lies in achieving that next step, which
    is to convert data science and analytics into a key business activity that provides
    clear-sighted and intelligent business decisions.


    # **Summary of the Data Science Process**


    Sticking to a structured method in data science helps you to increase your chances
    of success in a data science project at the lowest cost. It also makes it possible
    to handle a project as a team, with every team member concentrating on what they
    do best. However, this procedure might not be helpful for every project type or
    be the only means to implement the right data science.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The typical data science procedure comprises of six steps through which you
    will iterate.


    Here is a short introduction to each of the steps.


    +   1.  The first step is to set a research goal. The main focus here is to ensure
    all the stakeholders know the what, how, and why of the project.


    +   2.  The next step is data retrieval. You need to have data ready for analysis,
    so the following step involves searching for the best data and getting access
    to the data from the data owner. The result is that raw data probably demands
    polishing and transformation before it is usable.


    +   3.  Once you have the raw data, the next thing is to prepare it. This involves
    transforming the data from a raw type into data that’s directly usable in your
    models. To achieve this, you will identify and correct various types of errors
    within the data, integrate data from various sources, and change it. If you complete
    this step successfully, you can move to data visualization and modeling.


    +   4.  The fourth step is data exploration. The purpose of this step is to attain
    a deep understanding of the data. You will search for patterns, deviations, and
    correlations depending on visual and descriptive techniques. The insights you
    derive from this step will allow you to begin modeling.


    +   5.  Lastly, you will get to the most interesting part. And that is data modeling.
    This is the time when you try to make the insights or predictions outlined in
    your project charter. Now is the time to generate heavy guns, but remember that
    research has taught us that always a mix of simple models tends to overcome a
    complex model. If you have completed this phase, you’re almost done.


    +   6.  The last step of the data science model is the results presentation and
    automating the analysis. One focus of a project is to change a process or make
    better decisions. You might still need to convince the businesses that your findings
    will, in fact, change the business process as required. This is the point where
    you can shine in your influence role. The importance of the following step is
    obvious on a strategic and tactical level. Some projects require you to complete
    the business process over and over again. Hence, automating the project saves
    time.


    The reality is that this is not going to be a straightforward process. In most
    cases, you will regress and iterate between the various phases.


    Following the above six steps pays off based on a higher project success ratio
    and an increased'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'effect of research results. This process helps you attain a well-defined research
    plan, a great understanding of the business question, and clear deliverables before
    you begin looking at the data. The first steps allow you to concentrate on achieving
    high-quality data as input for your models. This way, your model will do well
    in the later stages.


    Another advantage of sticking to a structured approach is that you work a lot
    more in a prototype model while you look for the best model. When creating a prototype,
    you will probably attempt multiple models and won''t concentrate heavily on problems
    such as program speed or writing code standards. This enables you to concentrate
    on generating business value.


    Not every project is created by the business itself. Insights derived at the time
    of analysis or the arrival of new data can generate new projects. When the data
    science team comes up with an idea, work has already been conducted to present
    a preposition and identify a business sponsor.


    Dividing a project into smaller stages will enable employees to work together
    as a team. It is impossible to be an expert in everything. You don''t need to
    learn how to upload all the data to all the various databases, determine an optimal
    data scheme that works not only for your application but also for other projects
    within your company, and then monitor all the statistical and data mining techniques.


    # Prerequisite and Reminders


    By now, you need to be familiar with the Python syntax plus other basic things
    in Python. Some of the basic things you need to be conversant include functions,
    variables, loops, and lists. You don''t need to be a specialist, but it''s important
    to have the right knowledge, so the rest become smoother.


    You don''t need to make it hard because programming revolves around telling the
    computer what is supposed to be done. Then, the computer should be able to understand
    and successfully implement your instructions. You may only need to write several
    lines of code to suit your application.


    Plus, a lot of things that you will implement in Python for data analysis are
    already pre-built for you. So, you may only need to copy and run the code. But
    remember that mastering Python programming is still important. This will also
    provide you with confidence because you understand how something operates.


    # Do You Need Some Expertise in Mathematics?


    Data analysis implies working with numbers and mining useful insights from them.
    But do you really need to be an expert on numbers and mathematics?


    Successful data analysis using Python always demands great skills and knowledge
    in math,'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'programming, and the field you are working on. This implies that you don’t
    have to be an expert in any of them.


    Don’t allow a lot of experts to fool you because many of them are fake or just
    inexperienced. What you really need to know is what’s the next thing to do so
    you can successfully complete your projects. You won’t be an expert in anything
