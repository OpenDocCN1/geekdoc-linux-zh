  md: '# **Chapter 14: Ensemble Methods**


    This chapter will deal with ensemble methods. Anytime you experience uncertainty
    while you make real-time decisions, do you look for a friend to help you? Well,
    the fact is that we make decisions depending on the collective knowledge that
    we find from friends. Ensemble uses the same concept in ML.


    The idea behind is to develop more data models and generate the final prediction
    depending on the prediction from all the individual models. For a regression problem,
    the end result can be the mean prediction value from all the models. In a classification
    environment, a lot of the vote is selected to determine the output class.


    The popular idea is to have numerous models, each model presenting slightly different
    outputs on the training dataset. Some models learn the properties of the data
    better compared to others. The belief that the final result from all these models
    should be better than the result generated by anyone of them.


    As already said, the notion behind the ensemble is to integrate different models
    together. These models can be of the same kind or different. For example, you
    can merge a neural network model output by applying a Bayesian model. This chapter
    will be restricted only to ensemble of the same type of models.


    Merging the same type of models is normally common in Data science society through
    bagging and boosting techniques.


    The bootstrap aggregation is a perfect approach for creating a lot of models and
    combining their output to generate the last prediction. Every model within a bagging
    ensemble uses only a single section of the training data. The idea behind bagging
    is to cut down data overfitting. As previously said, you want every model to be
    unique from the rest. So, you need to sample the data using replacement for training
    every model and thus introduce variability. Another approach used to introduce
    variation within the model is to sample the properties. You don''t submit all
    the features to the model, but different models attain specific properties.


    Bagging can easily be parallelized. According to the parallel processing framework
    available, models can be generated in parallel using different samples of the
    training dataset. The bagging method doesn''t work with linear predictors like
    linear regression.


    Boosting is part of an ensemble technique that produces various complex models.
    It works sequentially by training the newer models based on the errors in the
    original models. Every model trained is associated with a weight, which is calculated
    based on how better the model has done on a given data.


    When the final prediction is performed, the above weights define the percentage
    of influence that a certain model has over the final result. Boosting doesn''t
    result in parallelism like bagging. And this is because the models are built in
    a sequence. Thus, it is impossible to parallelize.


    The errors presented by classifiers in the sequence are considered as hard instances
    to classify.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'The framework is created in a manner that the models come later in the sequence,
    or erroneous predictions are generated by the first predictor and attempt to improve
    them.


    In general, the weak classifiers are used to boost, for example, a decision stump,
    which describes a decision tree using a single splitting node and two leaves.


    # Mastering the Bagging Method


    Ensemble methods belong to the committee-based learning family. If we can succeed
    in introducing variation in the dataset, it will lead to models with slight differences.


    You take advantage of bootstrapping to fed to these models variation within the
    dataset.


    Bootstrapping is the means of randomly sampling a certain dataset for a specific
    number of cases, with or without replacement. For bagging, you need to leverage
    bootstrapping to generate. For instance, let us assume m has different datasets,
    and we create a model for each of them. Finally, you take advantage of the output
    of all the models to produce the last prediction in case of regression issues.


    For example, you bootstrap the data m times; you will get m models, that is, y,
    m values and the final prediction would include:


    ```

    $$Y_{\text{final}}(x) = \frac{1}{m} \sum_{i=1}^{m} y_m(x)$$

    ```


    For the case of classification problems, the final result is determined depending
    on voting. Therefore, you have one hundred models in your ensemble, and you have
    a two-class classification problem using class labels as {+1, -}. Suppose more
    than 50 models predict the output as +1, you need to declare the prediction as
    +1.


    Randomization is a unique approach by which variability can be applied in the
    model creation exercise. An example is to define randomly a collection of properties
    for each model within the ensemble.


    An example is to choose a random subset of properties for each model in the ensemble.
    That way, different models will consist of different sets of properties. This
    approach is known as random subspace method.


    When you apply stable models, bagging may not attain huge results. Bagging is
    important if the underlying classifier is highly sensitive to even small changes
    to the data. For example, the decision trees, which are unstable. The pruned decision
    trees are the best selection for bagging. However, you need to consider a Nearest
    Neighbor Classifier. K is a stable model. But you can still leverage the random
    subspaces, and bring some instability into the nearest neighbor methods.


    In the following recipe, you will realize how to leverage bagging and random subspaces
    on a K-Nearest Neighbor algorithm. You will acquire a classification problem,
    and the final prediction will rely on the majority of the voting.


    # How to Do It'
