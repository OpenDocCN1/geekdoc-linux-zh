    a bit easier for the researcher to see and pay some attention to as they go through
    the process.


    Another thing to add to any data analysis that we are working on is that the charts,
    textual writeups, and graphs are all going to be important forms of data analysis.
    These methods are going to be important because they are meant to distill and
    refine the data in a manner that readers are able to glean the most interesting
    parts of the information without having to sort through the data all on their
    own.


    Summarizing the data and what all has happened during the analysis is often going
    to be pretty important when you would like to support any of the arguments that
    you made with that data, as is presenting the data in a manner that is clear and
    understandable. The raw data is something that you may choose to include in the
    appendix in some cases, because this allows those who'
