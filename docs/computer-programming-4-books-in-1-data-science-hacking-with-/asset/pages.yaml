- pgno: 199
  md: '# **Hardware Management and Maintenance**


    Hardware maintenance can be performed as per the following routines and considerations:


    # **Cleaning**


    Every two weeks clean all network equipment. Doing so will help keep your equipment
    cool and make other maintenance tasks easier to perform. When cleaning, dust the
    equipment, shelves, and nearby areas. A small vacuum should be used to vacuum
    keyboards and the computer vent and fan openings. Additionally, you should use
    the vacuum to gently suck dust out of removable media drives. Unused wall jacks
    and empty equipment jacks in dust-prone environments can be vacuumed on occasion
    as well.


    For printers and plotters, follow the manual instructions for cleaning print heads
    on ink jets and vacuuming paper dust from laser printers. Monitors can be wiped
    down with eye-glass cleaning solution and glasses-cleaning cloths.


    # **Performing Inspections**


    Keeping a close eye on the condition of all hardware is essential. For this reason,
    you should inspect all hardware at least once per month. This inspection should
    include the following:


    +   *   Make sure cooling vents are not blocked or excessively dusty.

    +   *   Listen to and feel the vents to make sure cooling fans are operating.

    +   *   Sniff the area. When power supplies and other parts are near failing,
    they may emit an odd odor from excessive heating. A burnt smell means trouble
    is imminent or has already occurred.

    +   *   Check all power cables, peripheral cables, and network cables for tightness
    in their sockets.

    +   *   Check all power cables, peripheral cables, and network cables for fraying
    or other damage.

    +   *   Check the server area for proper operation of heating, venting, and cooling
    systems to be sure they are operable- even if those systems are not needed at
    the time of the inspections.


    # **Upgrading Firmware**


    “Firmware” refers to any program that is resident in a chip. For example, a computer’s
    BIOS is firmware. Sometimes, manufacturers release updates for firmware to fix
    flaws or to enable the equipment to work with some newly released hardware device
    or operating-system upgrade. You should check the manufacturer’s Web site or help
    desk for all network equipment at least quarterly to determine whether any firmware
    upgrades are available for your equipment.

    If so, be sure to adhere to the maker’s instructions to the letter for loading
    new firmware and firmware updates. Firmware loads often require low-level booting
    from a DOS or maintenance'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'disk, although some will be compatible with the computer’s operating system.


    # **Upgrading Hardware**


    Two factors drive hardware upgrades:


    +   • Performance issuses due to changes in applications or the addition of new
    applications may necessitate a hardware upgrade or the addition of new features
    that are linked to the hardware’s capability or capacity. For example, adding
    memory and installing an additional hard drive for more file space are typical
    upgrades performed to support those changes.


    +   • You may opt to upgrade hardware on a purely optional basis-for example,
    adding a bigger monitor, higher-quality sound card, a TV card, or a similar device.


    # **Repairing Hardware**


    As the person responsible for the network, you must assess your willingness and
    ability to perform hardware repairs-before a hardware component stops working.
    To that end, you should go through your entire hardware inventory and determine
    the following:


    +   • Is the equipment still under warranty? If so, take advantage of that warranty
    in the event the equipment stops working.


    +   • Would it be more cost-effective to simply replace a piece of hardware if
    it breaks? Given the high cost of technical labor, repairing a low-cost item,
    such as a printer that can be replaced for $50, may not be justified. It might
    even be best to replace rather than repair PCs purchased for less than $600 if
    you’ve used them for more than 10 months. Don’t get me wrong; I am not advocating
    short equipment life cycles or unnecessarily adding to scrap piles.


    +   • For big-ticket items, you may want to transfer the repair risk to someone
    else by arranging for service and support contracts-assuming your budget can support
    this.


    # **Administration**


    Large networks often have one or more staff members dedicated exclusively to performing
    network administrative tasks. For smaller networks, the manager must wear various
    hats and perform multiple roles to support the network. Over time, he or she must
    rise to the level of journeyman-or at least experienced apprentice-to be successful.
    Primary or routine network-administrative tasks fall into one of the following
    categories:


    +   • Administering and supporting end users


    +   • Adding workstations and peripheral devices


    +   • Maintaining system-wide documentation


    # **Maintaining System-Wide Documentation**'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Maintaining system-wide documentation might seem like a task you could skip,
    but you shouldn’t. Without complete documentation, a lot of person hours can be
    wasted when something goes wrong, or when you are trying to add hardware to a
    server or applications to network hosts or workstations. Regrettably, for some
    technicians and network managers, checking the documentation prior to making system
    changes is not priority one as it should be. Good documentation practices are
    not a bane because they take time; they are a benefit to the network manager with
    little time to waste. Network documentation should include all operation and maintenance
    booklets as well as manuals for all the hardware.


    # **Administering and Supporting End Users**


    As the network administrator, you will likely be responsible for administering
    and supporting end-users. Examples of tasks you''ll need to perform may include
    the following:


    +   * Vetting new users for security purposes

    +   * Adding, deleting, and changing end-user accounts

    +   * Creating and administering group, role-based, and individual access controls

    +   * Providing technical support

    +   * Adding workstations and peripheral devices


    # **Adding Workstations and Peripheral Devices**


    There will likely be times when some software-based administrative chores must
    be completed in order to add new workstations and peripheral devices to the network.
    Examples are hardcoding an IP address into a new workstation or printer or attaching
    a new printer to a print server’s queue. In addition, users may need to be assigned
    rights to access new equipment such as printers, along with access passwords for
    new workstations on the network. For more information, consult the documentation
    provided with the new equipment and your own documentation of necessary steps
    from previous changes.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Virtualization in Cloud Computing


    # What is cloud computing?


    Cloud computing refers to delivery of IT resources via the internet as per the
    demand. It is normally implemented on a pay-as-you-go pricing basis. The concept
    of cloud computing seeks to offer a solution to users'' needs of IT infrastructure
    at a low cost.


    # Why cloud computing?


    For small as well as big IT companies that still rely on traditional methods to
    operate primarily require a server to carry out their different tasks. The setting
    up of a server room requires skilled personnel, different servers, modems, switches,
    and lots of other networking resources-plus a lot more of other non-IT requirements
    that contribute to the completeness of a working office.


    Traditional methods require a lot of human input, expensive equipment and a lot
    of other logistical necessities. These things require large sums of money. In
    order to set up a fully functional server, the organization or individual must
    be willing to break the bank. However, that is no longer thanks to the concept
    of cloud computing. Cloud computing helps individuals to cut down on infrastructure
    costs by eliminating the need for the purchase of expensive equipment and spending
    a lot of funds on hired personnel for the administration and management of IT
    resources.


    # Features of Cloud Computing


    +   - Cloud computing operates in a distributed computing environment. This makes
    resource sharing to happen quickly.

    +   - Cloud computing minimizes chances of infrastructural failure due to the
    existences of many servers. This makes it a more reliable infrastructure for IT
    operations.

    +   - Cloud computing allows for large-scale, on-demand provision of IT resources
    without the need for engineers and many other professional that would otherwise
    come in handy.

    +   - Cloud computing enables multiple users to share resources and work more
    efficiently by sharing the same infrastructure.

    +   - Cloud computing eliminates physical location or distance concerns since
    users can access systems and resources regardless of their geographic location.

    +   - Maintaining cloud computing applications is easier since they do not need
    to be installed on each user''s computer.

    +   - Cloud computing reduces the operating cost of an organization since it eliminates
    the organization''s need to set up its own infrastructure-this turns out to be
    quite an expensive undertaking for most organizations. Besides, it allows an organization
    to only pay for a service or resource when needed.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   * Cloud computing allows for pay-per-use mode for different services. It
    is a convenient way to use especially when a user needs to use a resource only
    once.


    # Benefits of Cloud Computing


    The following are the major benefits of cloud computing:


    +   * A person can conveniently use a low-cost computer to perform complex computer
    tasks that would otherwise require powerful machines-machines that fetch high
    prices in the market. Applications run on a cloud, not on the user''s machine.

    +   * Low-cost IT infrastructure is can sufficiently meet an organization''s needs.
    There is no need of investing in high-cost IT infrastructure to handle big servers.

    +   * Low-cost maintenance due to reduced infrastructural requirements-in terms
    of both hardware and software.

    +   * Instant software updates for web-based applications-no need to worry about
    obsolete applications and high upgrade costs.

    +   * The execution capacity of cloud servers is very high. This increases computing
    power and leads to efficient task execution due to high speeds of data processing
    and message delivery

    +     * A cloud provides users with very large storage capacities-at very low
    costs.


    # Disadvantages of Cloud Computing


    Some of the most conspicuous limitations of cloud computing are listed below:


    +   * You cannot access resources on a cloud without internet connectivity. It
    is mandatory that the user is connected to the internet in order to access resources
    (or use the IT infrastructure) offered on a cloud.

    +   * Low internet connectivity may be greatly frustrating when trying to perform
    important tasks on a cloud. Most web-based applications run effectively on a lot
    of bandwidth. Low bandwidth may at times cripple the execution of some tasks.

    +   * There is no guarantee of security and confidentiality of data stored on
    a cloud. Unauthorized users can gain access to your data/information stored on
    a cloud.


    # What is virtualization?


    Virtualization is a process by which a virtual version of some actual thing is
    created. In computing, this may involve virtualization of an operating system,
    network resources, server, storage device or even a desktop.


    Technically, we can refer to virtualization as a technique which permits sharing
    of one instance of a physical resource or application among multiple users or
    groups.


    The technique involves the assignment of a logical name to a physical storage
    of a given'
  merge: -1
  img_proc: true
- pgno: 204
  md: resource or application and offering a pointer to the specific resource or application
    as is required.
  merge: -1
  img_proc: true
- pgno: 205
  md: '# The Concept behind Virtualization


    The process of creating a virtual machine over an existing hardware and operating
    system is referred to as Hardware virtualization.


    Hardware virtualization creates an environment which is separated logically from
    the actual machine.


    The machine on which the creation of a virtual machine occurs is referred to as
    the host machine.


    On the other hand, the created virtual machine is technically referred to as a
    guest machine.


    # Types of Virtualization


    The following are the different types of virtualization


    +   * Server virtualization

    +   * Storage virtualization

    +   * Operating system virtualization

    +   * Hardware virtualization


    # Server Virtualization


    When virtual machine manager (VMM)-virtual machine software-is directly installed
    on the server then the process is referred to as server virtualization.


    Why Server Virtualization?


    Server virtualization is essential because it is possible to subdivide a physical
    server into multiple servers on a demand basis, and also for load balancing.


    # Storage Virtualization


    This is the process that involves the grouping of multiple physical storage devices
    in a network so that they appear like a single storage device. Software applications
    are also used for the implementation of storage virtualization.


    Why storage virtualization?


    This is crucial for recovery and back-up reasons.


    # Operating System Virtualization


    In this case, the virtual machine software (VMM) is installed directly on the
    operating system of the host machine. Unlike in hardware virtualization, VMM is
    not installed on the hardware.


    Why operating system virtualization?


    Operating system virtualization comes in handy when there is a need to test applications
    on a different operating system platform.


    # Hardware Virtualization


    In hardware virtualization, the virtual machine software is installed directly
    on the hardware system.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Hypervisor is charged with the responsibility of controlling and monitoring
    the memory, processor and hardware resources.


    We can install different operating system on the system and use it to run a lot
    of other applications-after virtualization of the hardware system.


    Why hardware virtualization?


    Hardware virtualization is largely important for server platforms since the control
    of virtual machines is not as difficult as the control of a physical server.


    # **How Virtualization Works in Cloud Computing**


    Virtualization is a greatly potent concept in cloud computing. Normally, in cloud
    computing, users need to share resources available in the clouds. For instance,
    applications and files are some of the sharable resources that may be stored in
    the clouds. With virtualization, users are provided with a platform that making
    sharing of such resources a practical experience.


    The primary goal of virtualization is to offer applications with their standard
    versions to users in the clouds. When new application versions are released, users
    look up to software developer for the new release. This is possible but may turn
    out to be quite a hectic affair if all users have to download the new version
    from a central server. To resolve that issue, virtualized servers and software
    can be maintained by third parties at fee, but cloud users can efficiently access
    the new software releases.


    In summary, virtualization primarily means running several operating systems on
    one machine that share all hardware resources.


    This technique is hugely helpful because it makes it possible to pool network
    resources and share them to different users conveniently, and at less cost.'
  merge: -1
  img_proc: true
