    The goal here is to discover how items are “related” or associated with one another.
    This can be very useful in determining which products should be placed together
    in grocery stores. For instance, many customers might always be buying bread and
    milk together. We can then rearrange some shelves and products so the bread and
    milk will be near to each other. This can also be a good way to recommend related
