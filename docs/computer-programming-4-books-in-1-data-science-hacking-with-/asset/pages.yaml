  md: '# The OSI Model


    OSI is short form for Open System Interconnection. The model offers a description
    of the way information and data from a software application is transmitted through
    a physical media to another software application in a totally unrelated computer.


    This reference model is comprises of seven layers. Each layer has a specific role
    to play.


    The OSI Reference model was born in 1984 by the International Organization (ISO).
    In modern days, this is taken to be the basic architectural model for communication
    between different network hosts.


    In the OSI model, whole tasks are broken down into 7 smaller and manageble chunks.
    Layers are assigned distinct roles-each layer is assigned a specific task to handle.
    Also, each layer is sufficiently equipped to handle its tasks independently.


    # Features of the OSI Model


    The OSI model is broadly divided into 2 layers: upper and lower layers.


    The upper layer of this model primarily handles issues related to applications.
    Those issues are executed in the software. The layer that is closest (or the uppermost
    layer) to the user is the application layer. The end user interacts with software
    application just as the application software does.


    When a layer is said to be an upper layer, it is said so in reference to another.
    An upper layer is a layer that lies right above the other one.


    The lower layer of this model handles issues of data transport. The implementation
    of the data link as well as physical layers occurs in software and hardware. In
    this model, the physical layer stands as the lowest layer. It is also the nearest
    to the physical medium. Primarily, the physical layers provide the necessary information
    to the physical medium.


    # Roles of the 7 Layers of the OSI Model


    We''re going to focus on the functions of the unique layers of the OSI Reference
    model from the lowest to the uppermost.


    # Physical Layer


    +   - **Data Transmission**: it defines the mode of transmission between two network
    devices- whether it is full-duplex, half-duplex or simplex mode.


    +   - **Line Configuration**: it offers a clear definition of the way two or more
    network devices are physically linked.


    +   - **Signals**: the physical layer determines the nature of signals used to
    transmit information.


    +   - **Topology**: the physical layer offers a comprehensive definition of the
    arrangement of network devices.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# **Data Link Layer**


    This layer is charged with the task of ensuring error-free data transfer of data
    frames over the network. It also defines data format on the network.


    The data link layer ensures that there is reliable and efficient inter-network
    device communication. It is responsible for the unique identification of each
    device that is found on the network.


    Data link layer comprises of the following two layers:


    +   1. **Logical link control layer:** it transfers packets to the destination’s
    network layer. Besides, it identifies the specific address of the network layer
    of the receiver from the packet header. Furthermore, flow control is implemented
    in this layer.


    +   2. **Media Access Control Layer:** this refers to a link that exists between
    the physical layer and link control layer. This is what transfers data packets
    over a network.


    # **The Data Link Layer’s Actual Functions**


    +   - **Framing:** the data link layer does the translation of the physical layer’s
    raw bit stream into data packets referred to as frames. It adds a header and trailer
    to the data frame. The header contains both the destination and source addresses.


    +   - **Physical addressing:** the physical addressing layer en joins a header
    to the frame. This header has the address of the receiver. The frame is relayed
    to the receiver whose address is indicated on the header.


    +   - **Data Flow control:** this is the data link layer’s primary role. It maintains
    a constant data rate so that no data is corrupted while on transit.


    +   - **Error control:** this is achieved by addition of a cyclic redundant check
    (CRC) on the trailer that is put onto the data packet before being sent to the
    physical layer. In case of any errors, the receiver can request for the retransmissions
    of the corrupted frame.


    +   - **Access control:** this layer determines which of the available network
    devices is given top priority over the link at a particular moment.


    # **The Network Layer**


    This is number 3 on the 7-layer OSI Reference model. It handles device addressing
    and keeps track of device location on the network. Based on network conditions,
    the layers determine the most favorable path for data transfer from sender to
    receiver. Another condition that is considered in determining the best path is
    service priority, among others.


    This layer is charged with the responsibility of routing and forwarding packets.
    Routers some of the devices on layer 3. The routers are specified in the network
    layer and are used to offer routing services in a computer internetwork.


    Protocols that are used in the routing of network traffic include IPv6 and IP.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Network Layer Functions


    +   - **Addressing:** this layer ensures that the destination and source addresses
    are added to the header of the frame. Addressing is helpful in the identification
    of devices on a network.


    +   - **Internetworking:** the network layer offers a logical link between network
    devices.


    +   - **Packetizing:** the network layer receives frames from upper layers and
    turns them into packets in a process that is conventionally referred to as packetizing.
    It is realized by the Internet protocol.


    # The Transport Layer


    This is layer number 4 in the model.


    The layer ensures that follows the order in which they are sent. It makes sure
    that duplication of data does not occur. This layer''s core business is to ensure
    that data is transferred totally.


    The physical layer receives data from the upper layers and subdivides them further
    into smaller chunks that are referred to as segments.


    The layer provides communication between destination and source-from end to end-
    for data reliability. It can also be termed as end-to-end layer.


    There are two protocols that are implemented at this layer:


    # Transmission Control Protocol


    This is a standard protocol which allows systems to share messages/information
    over the internet. The protocol establishes and preserves the link between hosts.


    TCP divides data into smaller units referred to as segments. The resulting segments
    do not travel over the internet using the same route. They reach the destination
    in no specific. However, TCP reorders the individual segments at the destination
    to reconstitute the original message.


    # User Datagram Protocol (or simply, UDP)


    This is also a transport layer protocol. As opposed to what happens in TCP, the
    source does not receive any acknowledgement when the destination receives data.
    This renders the protocol quite unreliable.


    # Transport Layer Functions


    +   - **Service-point Addressing:** service-point addressing enables computers
    to run multiple applications simultaneously. It also allows data transmission
    to receiver not only from one machine to another machine, but also from one process
    to the next process. The transport layer adds a port address or service-point
    address to the packet.


    Whereas the network does the transmission of data from one machine to another,
    it is the transport layer that ensures data transmission to the appropriate processes.'
  merge: -1
  img_proc: true
