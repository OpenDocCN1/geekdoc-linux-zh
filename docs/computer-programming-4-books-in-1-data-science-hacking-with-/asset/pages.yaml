    load the dataset into our workspace. The library comes loaded with a number of
    datasets that we can load and work with. We will demonstrate this by using a dataset
    known as *Iris*. This is a dataset of flowers. The following code shows how we
    can use scikit-learn to load the dataset:


    ```

    # Import scikit-learn library

    from sklearn import datasets

    # Load iris dataset

    iris = datasets.load_iris()

    # Confirm by printing the shape of the data

    print(iris.data.shape)

    ```


    # **Simple Linear Regression**


    We need to use our previous example, which is, predicting the number of marks
