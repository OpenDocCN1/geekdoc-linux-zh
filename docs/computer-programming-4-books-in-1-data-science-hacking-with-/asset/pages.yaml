  md: '# Chapter 1: Basics of hacking


    ![](img/e34dde0654d255bebea353c553e965ac_109_0.png)


    Hacking is nothing but unauthorized intrusion within a network or computer which
    is executed by attackers known as hackers. The attackers try to attack those systems
    which are vulnerable to threats. They keep their prying eyes open all the time,
    searching around for vulnerabilities. They can act as an individual or even work
    in a group. Not only might that but the hackers also function as a part of an
    organization which works with the motive of disrupting the functionalities of
    other organizations. Most of the time they try to alter the system of an organization
    and target the security infrastructure for breaching of information and gaining
    access. However, hackers not only work as attackers but also use their skills
    for finding out the weak spots along with the various vulnerabilities within a
    system. This is also carried out for finding and mending the weaknesses for preventing
    all forms of malicious attacks from entering the system.


    Different Types of Hackers

    There are various types of hackers in the world of hacking which perform different
    types of functions. The types of hackers help in defining the relationship between
    the systems and hackers which are trying to attack. The most common types of hackers
    are:


    +   - Black Hat Hackers: The term black hat had its origin from the old Western
    movies in'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'which the villains used to wear black hats. The black hat hackers act as individuals
    who try to have unauthorized access into the system of an organization or network
    for the purpose of exploiting the security infrastructure for various malicious
    reasons. The hackers of this type do not come with any sort of authority or permission
    for compromising the targets. They attempt to do damage by compromising the infrastructure
    of the security systems, shutting down the systems or also by altering the primary
    functions of a website or network. The primary intention of the black hat hackers
    is to gain all-over access or steal the information regarding finances, access
    various passwords or gain insights into other forms of personal data.


    +   **White Hat Hackers:** The white hat hackers are the second type of hackers
    but they act as the good guys. The white hat hackers work with various organizations
    for the purpose of strengthening the security of any system. The white hat hackers
    come with all sorts of permissions for engaging the targets and also compromise
    the same within the provided boundary of rules. The white hat hackers are also
    known as ethical hackers. The ethical hackers specialize in this field with various
    forms of ethical tools and techniques meant for hacking. They use special methodologies
    for securing up the information system of an organization. Contrary to the black
    hat hackers, the ethical hackers exploit the security system of a network and
    then check out for the backdoors after being legally permitted to perform so.
    The ethical hackers always point out all forms of vulnerabilities that they dig
    out from the systems of the organizations to make sure that the gaps are mended
    for preventing exploitation by the malicious attackers.


    +   **Grey Hat Hackers:** The grey hat hackers gain access to the security systems
    of the organizations and networks in the same way just like black hat hackers
    do. But the grey hat hackers perform such actions without any form of malicious
    intent and disclose the vulnerabilities along with the loopholes to the agencies
    of law enforcement or various intelligence agencies. The grey hat hackers generally
    surﬁt the internet and hack the computer systems for notifying the owners or the
    administrator of the network or system which contains various vulnerabilities
    which need to be mended immediately. The grey hat hackers might also extort the
    hacked systems by offering to inform about the defects for some fees too.


    # ## Common Tools of Hacking


    For accomplishing the act of hacking, the hackers implement various types of techniques.
    Let’s have a look at some of them.


    +   **Rootkits:** Rootkit acts like a program or a huge set of software which
    allows the attackers to gain complete access or control of a system or network
    which directly connects or interacts with the system of the internet. Rootkit
    was ﬁrst introduced as a system of backdoor process for ﬁxing various issues in
    regards to software. However, today this software is widely being used by the
    hackers for disrupting the functionality and control of a system from its actual
    owner or administrators. There are various ways in which rootkits can be installed
    in the system of the victim. The most common way of'
  merge: -1
