- pgno: 178
  md: '# Networking Essentials


    # What is a computer network?


    Computer network is a term that refers to any group of computers that are linked
    to one another allowing for communication among them. A network also allows member
    computers to share applications, data and other network resources (file servers,
    printers, and many others).


    Computer networks may be differentiated according to size, functionality and even
    location. However, size is the main criterion with which computer networks are
    classified. Thus, there are a number of unique computer networks that we shall
    discuss individually under the subtopic *Types of Computer Networks*.


    # Network Topologies


    A network topology refers to the arrangement and the way components of a network
    are interconnected. Two forms of computer network topologies exist:


    # Logical Topology


    Logical topology defines how linked network devices appear in a network. It is
    the architectural design of a network’s communication mechanism among the different
    devices.


    # Physical Topology


    Physical topology can be said to be the way all the nodes of a network are geometrically
    represented. The following are the various types of physical topologies:


    # Bus Topology


    In this topology, all hosts on a network are linked via a single cable. Network
    devices are either linked directly to the backbone cable or via drop cables.


    When a node wants to relay some message, it relays it to the entire network. The
    message is received by all the network nodes regardless of whether it is addressed
    or not.


    This topology is primarily adopted for 802.4 and 802.3 (Ethernet) standard networks.


    Bus topology configuration is simpler in comparison with other topologies.


    The backbone cable is a “single lane” through which messages are relayed to all
    the nodes on the network.


    Bus topologies popularly rely on CSMA as the primary access method. CSMA is a
    media access control that regulates data flow in order to maintain data integrity
    over the network.


    # Advantages of Bus Topology


    +   - The cost of installation is low since nodes are interconnected directly
    using cables without the need for a hub or switch.

    +   - Support for moderate data speeds by use of coaxial and twisted pair cables
    that allows up to 10 Mbps only.'
  merge: -1
  img_proc: true
