- pgno: 216
  md: '# **Internet basics**


    This section covers some of the basic technology concepts that makes the Internet
    work and discusses various options for connecting to the information superhighway
    so that everyone on your network can surf the Internet, communicate via e-mail,
    share digital pictures with others, conduct research using countless online resources,
    make purchases online, download movies and music, video conference, and more.


    # **Internet Technical Terms**


    Just as you don’t necessarily need to know the inner works of a combustion engine
    to drive a car, it’s not imperative that you understand every aspect of how the
    Internet works in order to take advantage of all that it offers. That said, it
    never hurts to examine, however briefly, the various terms and concepts that relate
    to the Internet.


    # **TCP/IP**


    TCP/IP—short for Transmmission Control Protocol/Internet Protocol—is a group of
    rules called protocols that define how devices, be they similar or diverse (i.e.,
    computers, routers, and modems), connect and communicate with each other. (In
    this context, a “protocol” describes technical details about how any two communication
    devices will interact and work together to move digital data from one device to
    another.)


    TCP/IP works by determining the best available transmission path for data to travel.
    Rather than sending all the data in one large chunk, however, the protocol breaks
    the data into small packets. These packets can travel over any number of different
    paths to reach their destination; when they arrive, they are reassembled in order.


    To ensure that packets arrive at the correct destination, each one contains both
    the destination address and the source address. This information is stored in
    each packet’s “envelope,” or “header.”


    The TCP part of the protocol controls the breakdown of data on the sending end
    and its reassembly on the receiving end, while IP handles the routing of the data
    packets.


    Think of it this way: Sending data via TCP/IP is not unlike sending letters via
    the U.S. Postal Service. Each letter you send by post contains the sender’s address
    (i.e., the source address) and the recipient’s address (i.e., the destination
    address). The difference is that with snail mail, you send the whole letter in
    one package or envelope (packet). If you were to send that same letter over the
    Internet, it would be sent in hundreds if not thousands of packets (envelopes)
    to get to its destination, after which it would be electronically reassembled.


    Internet protocols in use under the TCP/IP banner include UDP, PPP, SLIP, VoIP,
    and FTP.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# **Sub-net Mask**


    A sub-net mask is a number applied within a host configuration file that allows
    for the division of an IP class C network into separately routable networks. For
    home networks on an ISP''s larger network, the sub-net mask will most often be
    255.255.255.0, because home networks are not usually split into physically separate
    segments with internal routers. In office buildings and business environments,
    sub-nets are used to detach traffic onto physically isolated networks to retain
    the data traffic on the low and to enhance performance for access to peripherals
    and local servers. Data traffic destined for another sub-net or to the WAN will
    have to pass through the router.


    # **DNS**


    Just as it is easier to remember someone''s name than it is to remember her phone
    number, so, too, is it easier to remember the location of a Web site by its domain
    name rather than its IP address. For example, suppose you frequently visit the
    Web site of Ford Motor Company. Chances are, you will probably remember the site''s
    domain name–i.e., Ford.com–and not its IP address. Your computer''s Web browser,
    however, operates in the exact opposite way. It needs to know Ford.com''s IP address
    in order to connect with the site.


    That''s the point domain name system comes in. When you enter the domain name
    of a site you want to visit (Ford.com), your Web browser initiates a session with
    a DNS server either locally or on the Internet to locate the IP address associated
    with that domain name. DNS servers perform a hierarchical lookup for the IP addresses
    using domain name associations for registered domain names to locate the IP address
    of the site you want to visit. If the DNS server your computer is linked to cannot
    determine the IP address linked with the domain name you entered, the DNS server
    will then look up the number on successively higher-level DNS servers until it
    finds the entry (or errors out).


    Once the IP address is found, your computer can locate and communicate with the
    computer housing the Ford.com Web site. The first DNS server stores the association
    in memory for a time in case you or someone else it serves needs to visit that
    site again. The DNS server stores only frequently used associations because it
    can look up the ones it does not know on the higher-level DNS servers.


    # **Assessing Internet Service Plans**


    Two things are necessary to establish home access to the Internet: at least one
    Internet-capable computer on your network and the purchase of an Internet service
    plan from an Internet service provider (ISP). What plans are available will vary
    somewhat by geography (with suburban and rural areas having fewer options than
    urban ones), the communication media you want to use, and the options put forth
    by your ISP.


    Some critical plan features include the following:


    +   - Price'
  merge: -1
  img_proc: true
- pgno: 218
  md: '+   - Internet speed

    +   - Equipment provided by ISP

    +   - Customer service support

    +   - Nature of IP address provided-static or dynamic

    +   - Transmission media used

    +   - Email addresses

    +   - Webpage hosting

    +   - Complimentary Wi-Fi access


    # Making the Connection


    To connect your computer to the Internet, you must choose from the service-plan
    options available in your area. Once you have evaluated the connection plans and
    media options in your area and have selected an ISP, review some of the following
    considerations below for guidelines on how to set up Internet access.


    # Connecting with Dial-Up


    Dial-up is, for the most part, obsolete from a speed perspective, but in some
    rural areas, it is the only available low-cost Internet-connection option. When
    connecting your computer using dial-up over a plain old telephone service (POTS)
    line, there are three common scenarios:


    +   - Hooking up a computer or laptop with a built-in modem

    +   - Using an external dial-up modem connected via a USB port

    +   - Using a modem that will connect to a 9-pin serial port.


    # Connecting with Cable


    A popular Internet-connection choice in many areas is cable. In fact, your home
    or small office may already have a cable connection for television service, making
    the addition of a cable modem to the mix fairly simple. Cable Internet service
    is high speed-much better than that offered by dial-up. In addition, many cable-based
    packages bundle increased television channels for viewing and Internet phone service.


    # Connecting with Wireless (Wi-Fi)


    Connecting wirelessly to the Internet is fairly simple, but your network must
    include a gateway or router designed for wireless connections. In addition, any
    computers on your network must have Wi-Fi capabilities built in or, in the case
    of a laptop or notebook computer, a slot for a wireless Wi-Fi card.

    If your computer or workstations are not configured for Wi-Fi, fear not. There
    are hosts of'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'manufacturers making devices to support wireless connections—essentially, these
    are portable wireless NICs that can be plugged into either an Ethernet port or
    a USB port.


    # ### Connecting with DSL


    Using DSL to connect to the Internet over standard phone lines has an advantage
    of accessing the internet are higher speeds than the dial-up option (assuming
    you live in an area where DSL service is available). Moreover, whereas a dial-up
    connection relies upon the audio/analog band on a phone line, data on a DSL Internet
    connection passes over the wire pair at a frequency that is higher—meaning that
    users can still use their phone lines while at the same time using the Internet
    (and, by extension, keep your Internet connection live 24/7).


    # ### Network Address Translation


    Network address translation (NAT) is an important feature on Internet connection
    devices and gateways that allows a computer to have an IP addresses that is not
    visible on the Internet, yet still receive and send data packets over the Internet.
    These addresses are hidden and are assigned from a different set of IP addresses—called
    private IP addresses—from the addresses that are seen or exposed on the Internet.
    These private addresses are assigned to computers inside the firewall, enabling
    them to use TCP/IP protocols for communicating to internal devices and to hosts
    on the Internet without being seen—thereby making it harder to hack into the internal
    computer. Using NAT is the first tier in firewalling or protecting your network
    computers from unwanted intruders anywhere on the Internet.


    Private IP addresses also extend the connectivity of the Internet to more computers
    than there are available IP addresses because the same private, internal network
    IP address can be used at hundreds, thousands, or even millions of locations.


    It works like this: When you open a browser to reach, for example, Yahoo.com,
    the data packet reaches your Internet gateway/firewall, which in turn starts a
    session to keep track of your MAC address and IP address. It then replaces your
    private IP address from the data packet with its own visible IP address in the
    data packet and sends the request to Yahoo.com. When the information is returned
    from Yahoo for your session, the process is reversed; the Internet gateway/firewall
    strips out its own IP address, re-inserts your computer’s private IP address and
    MAC address into the packet header, and passes the packet down the network wire
    to your computer.


    When this happens, your internal IP address is said to have been “network address
    translated”— although a better term might be “network address substituted.” By
    default, most home network gateways use NAT and assign private IP addresses to
    all the computers on the home network.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# **Private Networks**


    Private networks are IP networks with host computers that hide behind a device
    that provides NAT. The computers on these networks are assigned IP addresses outside
    of the pool of numbers used on the Internet. Essentially, any number in the private
    address range can be assigned locally to a computer or host.

    Private network IP addresses begin with any of the following numbers:


    +   - 10

    +   - 172.16~172.31

    +   - 192.168


    A complete example might be 192.168.11.4 or 10.101.101.1.


    # **Worldwide Web: Window to the World**


    Like a living organism, the Web is constantly changing as networks are added or
    changed. The growth of the Internet both in geographic reach and audience presents
    every connected entity with opportunities to communicate like never before in
    history. If your use of the Web is limited to simply downloading information and
    receiving e-mail, you are hardly scratching the surface of what can be accomplished
    over the Web. Ways to use the Web to inform, educate, and exchange ideas, goods,
    and services with a worldwide audience are limited only by one’s imagination and
    creativity. This chapter merely skims the surface of what you can do on the Web.


    # **Leveraging Your Connection to the Web**


    Connecting your network-or a sub-network of your network-to the Internet stretches
    the reach of your home or office network to the far corners of the earth. For
    under $120 per month in most markets around the country, you can obtain a connection
    to the Internet that runs at decent speeds and includes up to five static IP addresses.

    These addresses can significantly enhance your ability to garner the most benefit
    from your connection to the Internet. That’s because in order to make Web servers,
    Web cams, and other resources available on the Web, you need at least one static
    IP address that is visible on the Internet. Additionally, a static IP address
    can be used to enable VPN clients to connect to your network resources. Without
    a static IP address, much of your communication to the outside world is limited.
    With a static IP address, however, your network can become a Web site, client-services
    provider, radio station, TV station, or blog-just to name a few.

    The Web really is a window on the world. Not only can you see out, obtaining incredible
    amounts of data from the Web, so too can others anywhere in the world see in,
    enabling you to share information of your choosing with a worldwide audience.
    Adding your own resources to the Web-the ultimate unfettered two-way, free-speech
    forum-can both provide value to you and your organization and increase the utility
    of the Web for others.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Popular Uses of the Web


    The following are the main uses of the web:


    # Finding or Publishing Information


    Most people use the Internet to obtain information-which is why some people call
    it the largest library in the world. The best way to obtain information online
    is to enter keywords or phrases into a search engine like Yahoo, Google and Ask.
    When you type a keyword or phrase into the search field on any one of these sites,
    it returns any number of links to Web pages that relate to the word or phrase
    you entered. Ask yourself or your organization’s management: What information
    about you, your family, or your company should be posted to a Web server?


    There is more to getting your information found or your voice heard on the Internet
    than simply getting a domain name such as thisismywebsite.com. To ensure that
    the information on your site can be found when someone performs a related search,
    you enter key search words into your document headings and possibly pay to register
    your site with various search engines. Learning key search words and adapting
    your document headings and labels accordingly is a science in itself. And even
    if you master it, your business Web site might be listed at the top of the search
    results one day and slip to 100 or 1,000 the next. Like the Wild West, there are
    few rules on the Internet, and anything goes when it comes to getting noticed.


    # Communication


    This takes place in the following ways:


    # E-mail


    The most popular Internet communication tool is e-mail-that is, messages are sent
    electronically from sender to host on the Internet, potentially forwarded to other
    hosts, and ultimately downloaded at the recipient’s convenience.


    One way to obtain an e-mail account is from your Internet service provider (ISP);
    most plans include the use of at least one e-mail address. Alternatively, you
    might run your own home or office e-mail server under a domain name you own. You
    access messages received via these accounts through special software called an
    e-mail client.


    Another option is to use any one of several free Web browsers-accessible e-mail
    services, such as the following:


    +   - Yahoo! Mail (http://mail.yahoo.com)

    +   - Gmail (http://www.gmail.com)


    # Instant Messaging (IM)


    Another way to communicate over the Internet is via instant messaging (IM). IM
    provides instant communication; there is no middleman to store or forward the
    message. Both end-users must be online to IM; when they do, the text they type
    is transmitted instantly from one to the other in'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'back-and-forth fashion the second the Send button (or similar) is clicked.
    You can IM using an IM client on your desktop or, in some cases, a Web browser.
    Popular instant-messaging applications include the following:


    +   - Yahoo! Messenger

    +   - Window Live Messenger


    # **Video Conferencing**


    Video conferencing gives users the rare chance of conducting virtual meetings,
    thereby saving on a lot of travel expenses. To do a video conference over the
    Internet, at least one participant ought to have a static IP address visible to
    the Internet. Additionally, each participant should have service with an upload
