    why it is used in numerous applications data compression, economic forecasting,
    and genetics. KNN is a supervised learning algorithm, which means that we are
    given a labeled dataset made up of training observations (x, y) and our goal is
    to determine the relationship between x and y. This means that we should find
    a function that x to y such that when we are given an input value for x, we are
    able to predict the corresponding value for y. The concept behind the KNN algorithm
    is very simple. We will use a dataset named Iris. We had explored it previously.
