  md: '+   - Uses familiar technology which makes its installation and troubleshooting
    a walk in the park since tools and materials are readily available.

    +   - There is a great degree of reliability since failure of a single node does
    has no effect on the rest of the network nodes.


    # Disadvantages of Bus Topology


    +   - Cabling is quite extensive. This may make the process quite tedious.

    +   - Troubleshooting for cable failures is mostly a pain to most network administrators.

    +   - Chances of message collision are high in case different nodes send messages
    simultaneously.

    +   - Addition of new nodes slows down the entire network.

    +   - Expansion of the network causes attenuation-loss of signal strength. This
    may be corrected with the use of repeaters (to regenerate the signal).


    # Ring Topology


    The only difference between ring topology and bus topology is that in the former
    the ends are connected; while in the former, ends are open.

    When one node gets a message from the sender, that node sends the message to the
    next node.

    Hence, communication takes place in one direction-it is unidirectional

    Each and every single node on the network is linked to another node without a
    termination point.

    Data flows continuously in one loop-endless loop.

    Data flow always takes a clockwise direction.

    Ring topology often use **token passing** as the main access method.


    **Token passing:** an access method in which tokens are passed from station to
    another.

    **Token:** a data frame that moves around the network.

    **Token Passing in Action**


    +   - A token moves around the network-from one node to another till the destination.

    +   - The sender puts an address plus data in the token.

    +   - The token passes from one node to the next-checking the token address against
    the individual addresses of each and every node on the network until it finds
    a match.

    +   - The token is used as a carrier-for data (and the destination address).


    # Merits of Ring Topology


    +   - Network management is relatively easy since faulty components can be removed
    without interfering with the others.'
