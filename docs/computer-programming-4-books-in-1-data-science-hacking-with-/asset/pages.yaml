    +   - Use of cabling at times makes routing an exhausting exercise-cable routing
    is normally difficult.


    # Tree Topology


    This topology puts the features of bus and star topologies in one basket. In this
    topology, all computers are interconnected, but in a hierarchical manner. The
    top-most node in this topology is referred to as a **root node** whereas all the
    others are descendants of the root node. There exists just a single path between
    two nodes for the transmission of data-forming a parent-child hierarchy.


    # Merits of Tree Topology


    +   - It supports broadband data transmission over long distances without issues
    of attenuation.

    +   - Star topology allows for easy expansion of a network since new devices can
    be added without to an existing network with little difficulty.

    +   - Ease of management-networks are segmented into star networks that make it
    relatively easy to manage.

    +   - Errors can be detected and corrected with ease.

    +   - Malfunctioning or breakdown of a single node does not affect the other nodes
    on the network. Thus, there is limited failure on tree topology networks.

    +   - It supports point-to-point wiring of each and every network segment.


    # Demerits of Tree Topology


    +   - It is always difficult to handle issues in respect of a fault in a node.

    +   - It’s a high cost network topology since broadband transmission can cost
    an arm and a leg.

    +   - Failure or faults in the main bus cable affects the entire network.

    +   - There is difficulty in reconfiguring the network when new devices are added
    onto the network.


    # Mesh Topology'
