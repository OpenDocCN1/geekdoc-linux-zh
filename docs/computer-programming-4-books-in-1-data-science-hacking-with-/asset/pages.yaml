    # The Structure of Neuron


    A neuron is made up of the cell body, having a number of extensions from it. Majority
    of these are in the form of branches commonly known as “dendrites”.


    A long process or a branching exists, and this is referred to as the “axon”.

    The transmission of signals begins at a region in this axon, and this region is
    known as the “hillock”.


    The neuron has a boundary, which is known as the “cell membrane”. A potential
    difference exists between the inside and the outside of the cell membrane. This
    is known as the “membrane potential”.


    If the input becomes large enough, some action potential will be generated. This
    action potential then travels will then travel down the axon and away from the
    cell body. A neuron is connected to another neuron by synapses. The information
    leaves the neuron via an axon and is then passed to the synapses and to the neuron,
    which is expected to receive it. Note that a neuron will only fire once the threshold
    exceeds a certain amount. The signals are very important as they are received
    by the other neurons. The neurons use the signals or the spikes for communication.
    The spikes are also responsible for encoding the information which is being sent.


    Synapses can either be inhibitory or excitatory. When spikes arrive at the excitatory
    synapse, the receiving neuron will be caused to fire. If the signals are received
    at an inhibitory synapse, then the receiving neuron is inhibited from firing.
    The synapses and the cell body usually calculate the difference in the incoming
    inhibitory and excitatory inputs. If this difference is found to be too large,
    the neuron will be made to fire.


    # Back Propagation


    To ensure that a neural network completes a problem, the units must be changed
    so that we can limit the error between the original output and the required output.
    In other words, the difference of the weights must be calculated by the network.
    To simplify everything, the network has to follow up with the changes in error.
    The backpropagation algorithm is popularly used in the error computation.


    In case you have the network units as linear, then this particular algorithm will
    be easy to master. For the algorithm to compute the error difference of the weights,
    it requires to first understand the rate at which the error changes because the
    activity level is being changed.'
