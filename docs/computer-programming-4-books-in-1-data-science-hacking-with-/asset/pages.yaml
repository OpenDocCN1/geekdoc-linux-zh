    # **Blogging**


    Blogs, short for Weblogs, are sites on which people can share information with
    other interested or likeminded individuals. Think of a blog as a digital journal
    that can be read by people around the world.


    # **Entertainment and Media**


    The Internet boasts a plethora of entertainment options, including the following:


    +   - Interactive gaming

    +   - Music

    +   - Video

    +   - News

    +   - Internet radio

    +   - Internet television


    # **Engaging in Commerce**


    Commerce represents one of the most common uses of the Internet. Business-related
    activities include (but are not limited to) the following:


    +   - Banking

    +   - Advertising

    +   - Retail sales and marketing'
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   - Auctions


    # **Downloading Software**


    Many major software publishers-including Microsoft, Corel, and Sun-offer users
    the ability to download what would otherwise be boxed commercial off-the-shelf
    software (COTS). All you need is a good Internet connection and a PayPal account,
    credit card, or in some cases a checkbook to pay the fee. There is also a wide
