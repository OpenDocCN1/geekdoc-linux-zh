    +   - Will an engine or component fail? (preventive maintenance in manufacturing)

    +   - Is a transaction fraudulent?

    +   - Is an email spam or not?


    These are made possible by the availability of massive datasets and great processing
    power. However, advanced data analysis using Python (and machine learning) is
