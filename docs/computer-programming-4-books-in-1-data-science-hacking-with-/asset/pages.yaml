- pgno: 208
  md: '# **How computers communicate in a network**


    Communication among different computers in a network takes place when data is
    transmitted from one machine to another.

    The transmitting computer is referred the sender (source). The machine to which
    data is transmitted is referred to as the receiver (destination).

    For communication to take place, data is transmitted in the form of data packets.
    For data to get to the desired destination, data packets are assigned source and
    destination address. The source address identifies the sender. On the other hand,
    the destination address identifies the receiver (destination).

    There are different ways in which data may be transmitted from one machine to
    another. Notably, there is more than one way in which data transmission happens.

    The way in which data can be transmitted from one computer to another is referred
    to as data transmission mode. Transmission mode is also referred to as communication
    mode.

    The different data transmission modes include the following:


    +   * Simplex mode: communication goes on in one direction. That is, the communication
    is unidirectional. A device can only receive data but can''t send, and vice-versa.

    +   * Half-duplex mode: communication is bidirectional. That is, a device can
    send and receive data. However, it cannot send and receive at the same time.

    +   * Full-duplex mode: communication is bidirectional. Unlike in half-duplex
    mode, communicating devices can transmit and receive at the same time.


    # **Addressing**


    A message needs to originate from a known sender and be clearly addressed to a
    known recipient.


    For instance, traditional post office requires that the sender identifies himself
    or herself by name and location. The sender must also indicate the recipient''s
    name and exact location (address).

    Similarly, computers in a network are identified by their MAC addresses and IP
    addresses. MAC addresses are embedded on the computers'' NICs while IP addresses
    are manually assigned during the configuration process; or the IP addresses are
    dynamically assigned by enabling the Dynamic Host Configuration Protocol (DHCP)
    on each machine. Each and every network host has a unique MAC address and unique
    IP address that identifies the given machine.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# ## Understanding Ethernet


    Ethernet network architecture is the most widespread of all network architecture
    all over the globe. We''re going to examine the depths of this architecture and
    most likely find out why this architecture is as popular as it is.


    Most network peripheral components have a built-in NIC. As a result, they can
    be easily plugged into an Ethernet wall outlet. It must be noted that the standard
    predetermined Ethernet length of wire of 100m from a hub or switch remains so
    even when it comes to NIC-equipped print servers and printers; just as it is the
    case with workstations.


    Printers that do not have a built-in NIC can still be used on a network by getting
    a connection with a network print server through a parallel, serial or USB port,
    or onboard NIC.


    # ## Ethernet Network Access Strategy


    Suffice to say, Ethernet is a passive network architecture that embraces the wait-and-listen
    approach. It is also referred to as contention-based architecture since all computers
    on the network have to contend with the time of transmission on a given network
    medium.


    Access to Ethernet networks is via CSMA/CD. This simply means that the network
    hosts have to listen to the network until the transmission medium is clear so
    that they can also transmit. Basically, they have to “sense” and determine that
    the line is indeed clear to initiate their own data transmission processes. A
    network host only sends out its data once it “feels” that the transmission is
    clear. In case there are multiple transmissions, a collision or collisions take
    place on the transmission medium. The machines sense the collisions and immediately
    halt their transmission processes.


    One of the machines starts the retransmission as the others wait for the line
    to clear before they can retransmit their data. This process happens until all
    the network have completed their transmissions.


    In a similar fashion, hosts wait and listen on the line for data meant for them.
    When a particular host senses that incoming is mean for them, they open door for
    its reception and actually does receive the data onto its NIC interface. Ethernet
    is characterized by frequent collisions. As a result, some devices have collision
    to prompt you when a collision happens. In fact, collisions are the main limitations
    of the Ethernet architecture. On the hand, Ethernet is the most affordable of
    all other network architectures.


    **Note:**


    +   - Collisions slow down the network.

    +   - Excess collisions may bring down a network completely.


    # ## Fast Ethernet


    The traditional Ethernet has a speed of 10Mbps. Fast Ethernet offers a speed that
    is higher than the original 10Mbps. It has a 100Mbps transfer rate. The throughput
    is higher than the traditional Ethernet standard since the time it takes to transmit
    data over a network medium has been'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'minimized by whopping factor of 10. Thus, Fast Ethernet works at a rate that
    is 10 times the traditional speed of 10Mbps. Traditionally, hubs and other connecting
    devices were designed to accommodate the 10 Mbps transfer rate. For such devices,
    Fast Ethernet is not supported. Fortunately, many connecting devices are being
    with NICs that can comfortably handle both 10Mbps and 100Mbps transfer rates.
    That means that the devices can accommodate both the original 10Mbps Ethernet
    as well the Fast Ethernet.


    # **Gigabit Ethernet**


    This is another version of Ethernet that is even faster than Fast Ethernet. It
    uses the same data formats and IEEE Ethernet specifications just like the other
    Ethernets-10Mbps and Fast Ethernet. With Gigabit Ethernet, users are able to enjoy
    1000Mbps transfer on a network. Unlike Fast Ethernet that operates on both twisted-pair
    cables and fiber-optic cables, Gigabit Ethernet was initially restricted to fiber—optic
    cabling. This required that a LAN be set up with specialized servers and high-speed
    switches. Gigabit Ethernet was considered to be a backbone for large LANs that
    required high transmission speeds. Currently, anyone can practically enjoy the
    amazing high speeds of Gigabit Ethernet since it is being bundled out in network
    cards that can be conveniently installed in network servers and network clients.


    # **Ethernet IEEE Cable Specifications**


    The following is a list showing some of the Ethernet specifications:


    +   - 802.3 for Ethernet LAN

    +   - 802.5 for Token-Ring LAN

    +   - 802.7 for Broadband TAG

    +   - 802.8 for Fiber-Optic TAG

    +   - 802.9 for Data Networks and Integrated Voice

    +   - 802.10 for Network Security

    +   - 802.11 for Wireless Networks


    Note: TAG stands for Technical Advisory Group


    The following points must be taken into account:


    +   - Ethernet is well-defined by the IEEE specifications of 802.3.

    +   - It works at the Data Link layer of the OSI mode.

    +   - A number of the various IEEE types of Ethernet are available depending on
    the nature'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'of cabling preferred on the given computer network.


    These types of Ethernet-Gigabit Ethernet and Fast Ether- are designated by 3-part
    names, like **10BASE-T**. The first section of the name describes the transmission
    speed. For instance, 10 specifies 10Mbps Ethernet.


    The second part of the name, which is "base" for all the different forms of Ethernet,
    indicates that the Ethernet signal is *baseband*. This means that the data drifts
    in a stream as one signal. This type of data transmission cannot allow the transmission
    of multiple channels of data or information as can the alternative-the *broadband*.


    The last part of the Ethernet type name specifies the type of cable in use. For
    instance, in 10BASE-T, the *T* indicates a twisted-pair cable, and it is presumed
    to be unshielded twisted-pair cable.


    **10BASE-T**: This type of Ethernet works with a twisted-pair cable (unshielded
    twisted cable). The maximum cable length (without signal amplification) is 100m.
    10BASE-T is operable on a star topology.


    **10BASE-2**: This type of Ethernet works with a fairly flexible coaxial cable
    (RG-58A/U I or a *thinet*), with a maximum cable length of 185m (this is rounded
    off to 200. Thus, the 2 in 10BASE-2). With the use of T-connectors to link the
    cabling to the network hosts'' network cards, 10BASE-2 uses a bus topology. Though
    10BASE-2 has always been the most pocket-friendly option for the Ethernet implementation,
    10BASE-T setups are presently the most widespread.


    **10BASE-5**: This is type of Ethernet that uses a large-gauge coaxial cable (also
    referred to as *thicknet*), and the hosts on the network are linked to a main
    trunk line. The cables from the network hosts join the main trunk cable using
    vampire tabs, which pierce the primary trunk cable.


    **100BASE-TX**: This is the type of Fast Ethernet that relies on the same Category
    5 UTP cabling that is available on 10BASE-T Ethernet. This enactment can also
    employ 100-Ohm shielded twisted pair cable. The maximum cable length in the absence
    of a repeater is 100 meters.


    **100BASE-T4**: This is the sort of Fast Ethernet that runs over Category 5 cabling,
    as can the 100BASE-TX. However, it can as well run over lower-grade twisted-pair
    cabling like Categories 3 and 4. In this type of Ethernet, the maximum cable run
    is the standard 100m length.


    **100BASE-FX**: This is the sort of Fast Ethernet that spans over fiber-optic
    cable with a maximum length of 412m.


    **1000Base-T**: This is the kind of Gigabit Ethernet that delivers 1000Mbps over
    Category 5'
  merge: -1
  img_proc: true
