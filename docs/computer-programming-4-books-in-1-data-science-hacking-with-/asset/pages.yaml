- pgno: 182
  md: 'All computers are interconnected via redundant connections in this topology.
    It offers different (multiple) paths from one node to another.


    In mesh topology, there are no connecting devices like switches or hubs. For instance,
    the Internet.


    WANs normally are implemented with mesh topology since communication failures
    are of serious concern. It is also largely implemented in wireless networks.


    The formula for forming mesh topology is shown below:


    **Number of Cables = (z\*(z-1))/2**


    Where;


    z = the number of nodes on the network


    There are 2 categories of this topology:


    # Partially Connected Mesh


    In this topology, not all the network devices are linked to the devices with which
    they have frequent communications. The devices are only connected to some of the
    devices with which they are normally in constant communication.


    # Full Mesh Topology


    Each network device has a link to every other device in the network in full mesh
    topology. In simple words, all computers are connected to one another via the
    redundant connections.


    # Merits of Mesh Topology


    +   - Mesh topologies are highly reliable since a breakdown in one single connection
    does not affect the working of the nodes in the network.

    +   - Communication is fast since each computer has connections with all other
    computers on the network.

    +   - Addition of new devices has no effect on other devices on the network-making
    reconfiguration quite easy.


    # Demerits of Mesh Topology


    +   - Mesh topology networks has the capacity to accommodate more devices and
    transmission media than any other network topology. This translates to a high
    cost of setting up mesh networks than all other networks.

    +   - Mesh topology networks are normally too large to manage and maintain effectively.

    +   - A lot of redundancy on the network reduces the network efficiency significantly.


    # Hybrid Topology


    The amalgamation of different network topologies (at least two of them) result
    in another topology that is conventionally referred to as hybrid topology. It
    is a connection among different links and computers for data transmission.'
  merge: -1
  img_proc: true
