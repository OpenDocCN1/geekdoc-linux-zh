  md: '+   - The System Utility


    # The Kernel


    The kernel functions as the core part of any form of OS. It is responsible for
    handling the tasks along with the hardware of the system of a computer. The CPU
    time and memory are the two examples of the entities which are being managed by
    the kernel. The kernel of an OS is of two types:


    +   - **Microkernel:** The microkernel is a type of OS kernel. As its name goes
    by, it comes with a very basic form of functionality. It is the least amount of
    software which can provide with the environment which is required for the functioning
    of an operating system. This environment of kernel covers management of threads,
    low level management of address space and inter-process form of communication.


    +   - **Monolithic kernel:** Monolithic kernel is the form of kernel which comes
    with various drivers along with it. It is an architecture of the operating system
    in which the operating system of a system works in the space of kernel. This form
    of the kernel is able to load or unload dynamically all the modules which are
    executable at the time of running. The monolithic form of kernel stays in the
    supervisor mode. The major point of difference between the micro kernel and the
    monolithic kernel is that the monolithic form of kernel can alone define a very
    high level of interface over the hardware of the system of a computer.


    # Supervisor mode


    The supervisor mode of the monolithic kernel is a flag which mediates from the
    hardware of a system. It can be easily modified by running the codes in the software
    system level. All form of system level tasks comes with this flag while they are
    operating or running. However, the applications of user space do not come with
    this flag set. The flag makes sure that whether the execution of machine code
    operations is possible or not such as performing various operations like disabling
    the interruptions or modifying the registers for various forms of descriptor table.
    The main idea behind having two different types of operation comes from the idea
    “with more amount of control come more responsibilities”.


    Any program in the supervisor mode is trusted so much that it will never fail
    as any form of failure will lead to crashing of the computer system. In simple
    words, the kernel is the component which is responsible for all form of activities
    of the OS. It is composed of various types of modules and also directly interacts
    with the base hardware. The kernel comes with all the necessary abstraction for
    the purpose of hiding all the low-level details of hardware to system or programs
    of application.


    # The System Library


    The system library is composed of a collection of resources which are non-volatile
    in nature and'
  merge: -1
  img_proc: true
