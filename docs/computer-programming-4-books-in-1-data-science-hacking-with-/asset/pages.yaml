  md: '# Installing Python on Mac OS X


    The first option that we are going to take a look at when it is time to install
    Python on our computers is the Mac OS X. If you are working off of a computer
    that will rely on the Mac operating system, then you should notice early on that
    there will be some kind of version of Python 2 already on the computer. The exact
    version is something that can change based on how long you have had your computer,
    but we can easily check on which version by opening up our terminal app and work
    with the prompt below to get it done:


    # Python – V


    This is going to show you the version you get so a number will come up. You can
    also choose to install Python 3 on this system if you would like, and it isn’t
    required to uninstall the 2.X version on the computer. To check for the 3.X installation,
    you just need to open up the terminal app and then type in the following prompt:


    # Python3 – V


    The default on OS X is that Python 3 is not going to be installed at all. If you
    want to use Python 3, you can install it using some of the installers that are
    on Python.org. This is a good place to go because it will install everything that
    you need to write and execute your codes with Python. It will have the Python
    shell, the IDLE development tools, and the interpreter. Unlike what happens with
    Python 2.X, these tools are installed as a standard application in the Applications
    folder.


    You have to make sure that you are able to run both the Python IDLE and the Python
    shell on any computer that you are using. And being able to run these can be dependent
    on which version you have chosen for your system as well. You will need to go
    through and check on your system which version of Python is there before proceeding
    and then moves on from there to determine which IDLE and shell you need to work
