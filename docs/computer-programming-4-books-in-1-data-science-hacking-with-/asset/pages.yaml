- pgno: 307
  md: '# Read All of the Error Messages


    This one is sometimes hard as a beginner because you may assume that you will
    have no idea what the error messages mean in the first place, so why should you
    take the time to learn them and actually read them? But, actually taking your
    time to read through those and learn how they work, and what they are telling
    you, can make it easier to fix up some of your code when things are not working
    well.


    You will quickly find that a lot of your error messages are accurate and will
    actually be pretty descriptive for you. The language runtime tried to execute
    the program, but it ran into a problem. This would mean that you skipped a step,
    you had a typo, or something else is missing from your code.


    There may be times when you do not understand the message that comes up with an
    error, but it does try to tell you what went wrong with the code. At a minimum,
    there will be information on a line number the error is on, and you can head to
    that part of the code and look for where the bug might be located.


    # Run the Code Often


    Another thing that you need to consider doing when it is time to work with the
    Python code is run it on a regular basis. There is nothing worse, especially when
    you are a beginner, then sitting down and writing code for hours. You may feel
    accomplished, but when you go and try to run that code, you are going to be in
    for a surprise. There will be a ton of errors that you need to go through and
    fix, and then you will feel really frustrated with yourself in the process.


    Instead of having hours of code that you need to sort through and try to sort
    through a bunch of errors, it is best if you try to run the code as often as possible.
    If you are able to go through and run it every few minutes or after you finish
    each little part that you are working with, then this is often going to be the
    best. It will ensure that you are catching some of the mistakes and issues early
    on in the work, and will make it so much easier for you to really figure out what
    is going on in the code, and fix the errors.


    It is a lot easier to find the errors and the mistakes in a small amount of code
    than it is to try and do this in a large block of code that you worked on for
    hours. It may seem like a waste of time and that it is slowing you down to run
    the code so often. But in the long run, it is going to end up saving you a ton
    of time and energy and can ensure that you are able to find the solutions that
    you are looking for. And it makes it so much easier to be able to fix any of the
    errors that show up because you know exactly where they are going to fall along
    the way as well.


    # Take a Break When Needed'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'Sometimes, working on coding can be a breeze. Everything is going to fit in
    just as you need it to and you can spend hours working on this part and getting
    it all to match up the way that you would like. And other times, things are not
    going to run as smoothly for you and will not work out as well. When the latter
    starts to happen, it is time to take a break.


    Often, we work on the code for far too long. We want to get it done or get something
    figured out with it, so we will spend hours and hours working on it. And then
    we get frustrated. Something or other on the code is not working out the way that
    we want, and we can’t seem to get it fixed and working well again. And no matter
    how hard we try, and how much work we put into it, we end up just making the whole
    situation worse in the process.


    While it is sometimes hard to just let go of the coding that we are doing and
    take a break, sometimes this is just what we need. When we are tired and have
    been staring at something for a long time, it is just going to be worse if we
    continue to stare at it and try out too many things. When we take a break and
    learn how to walk away from what we are doing on the computer, it is going to
    become so much easier.


    You may have to force yourself to take this break a bit. When we are frustrated
    is usually the time when we wan to dig our heels into it a bit more, and we don’t
    want to leave all of the work that we are doing at the time. But even an hour
    break or more can be nice to allow us to get away and rethink things. And when
    we come back, we can find the mistake or the error or the problem that we couldn’t
    before, and we can get it taken care of.


    # Ask for Help


    As a beginner, there may be some times when you will need help with the coding
    that you are doing. It is hard for some people to ask for help because they want
    to be able to do it all on their own. But learning how to code takes some time
    and patience, and then there are going to be those times when we just need some
    help because we aren’t sure what steps to take next.


    When you are asking for help, there are a few steps that you should consider taking
    in order to make it easier. These help to make sure that the other person knows
    what you have tried and doesn’t waste time going through all of that again as
    well. Some of the things that you can consider knowing and explaining to the person
    who is going to help you out with your code will include:


    +   1. Explain what you want the program to do for you and where the error is
    occurring.

    +   2. Show the other person the code that is sending you an error so they can
    see it for themselves.

    +   3. Show the other person the stack trace, all of it, including the message
    you got stating'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'the error.


    +   4.  Explain everything that you have already tried on the error. This helps
    the other person have a good idea of what you have tried and what they should
    try to get the code to work.


    You may find that the process of thinking through these items in your mind and
    then getting them written down on paper can help make a brand-new solution obvious.
    If that doesn’t work, try to find someone who may be able to look through the
    code and tell you what is going wrong and what you can do to fix the error.


    There are a lot of parts that need to come together when you are working as a
    programmer for the first time. being able to get all of these to work with one
    another, and ensuring that you are able to learn how to fix some of the problems
    that come up in your own code can be so important when you are a beginner trying
    to figure all of this out. Make sure to check out some of the different steps
    and tips that you can do when working in Python to make sure that you are coding
    correctly and that your program or application is going to work for your needs.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Chapter 10: A Quick Introduction to Data Analysis


    ![](img/e34dde0654d255bebea353c553e965ac_310_0.png)


    Many of the topics that we have spent time talking about in this guidebook are
    going to lead us to a good look at data analysis and what this can entail for
    us. There are many companies who would like to learn how to work with the Python
    coding language because they know it is going to help them figure out how to better
    serve their customers, figure out the best options when it comes to which products
    to release to their customers, and so much more.


    There are a lot of benefits that will come with working on data analysis, but
    before we do that, we need to first learn a little bit more about data analysis
    and what this process is all about. Data analysis is simply going to be a process
    that we can use in order to take our raw data and order and organize it in a meaningful
    manner. This is going to make sure that we are able to take out some of the important
    information that is found in that set of data, and then use it for our needs.


    The process of organizing and then thinking about our data is going to be so important
    in helping us figure out what the data is going to contain and what we are able
    to learn from it. There are going to be methods that we are able to use in order
    to approach one of these kinds of analyses for their own needs, but the most important
    thing that we need to remember here is to keep our biases and any manipulation
    out of the mix.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'It is really easy for someone to get in there and add in some of their own
    biases and more in the mix. This is sometimes done on purpose if the person wants
    to make sure some of their ideas are going to be the ones picked. But this is
    also something that can happen on a more unconscious level as well. No matter
    where it comes from, it is important to pay attention to the presentation of the
    data analysis and to really be critical about the process that is used along with
