  md: 'The smoker column will be removed from the above data frames because its values
    will be kept as keys within a DataFrameGrouped object. Additionally, the different
    groups of smokers and non-smokers will enable the complete reconstruction of the
    smoker column when needed.


    The aggregation functions represent the ones that accept different input and display
    a scalar value that sums up the values of that particular series. These refer
    to statistical functions such as min, max, stdev, and many more.


    Once the data has been combined, next you can use aggregation function to get
    the integrated data structure that sums up the original data.


    ```

    grouped := tips group: #total_bill by: #day.

    grouped apply: [ :each | each average round: 2 ].

    ```


    Since the grouping is being done to a column of DataFrame by a separate column,
    the result will be a DataSeries object.


    As said before, the DataGrouped presents shortcuts for popularly applied aggregation
    functions such as count, sum, min, and max. At the moment, these are shortcuts,
    but in future, they will execute the optimized aggregations that will be used
    faster.


    Once the data frame was grouped into an object of DataFrameGrouped, we can also
    apply an aggregation function to this object. DataFrameGrouped implements the
    apply: message in such a way that the function is applied to each column of each
    sub-data frame, producing the scalar value. These scalars are then combined into
    a new data frame.


    The result of this query will be a data frame containing the number of non-empty
    cells for each column, corresponding to `Male'' and `Female'' rows


