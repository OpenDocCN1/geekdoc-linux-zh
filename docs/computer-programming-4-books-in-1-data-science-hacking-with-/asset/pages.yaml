  md: 'For the case of DataSeriesGrouped, every subseries will be attached to a scalar,
    and all the following scalars will be joined into a DataSeries. When it comes
    to the DataFrameGrouped, it will include the block to every column of each sub-data
    frame and display the eventual matrix of scalars as a new DataFrame.


    Aggregation happens with the use of messages. It requires a block as an argument,
    and uses it on every value of the groups series, and then integrates into a new
    data structure.


    The most common aggregation functions, such as average, min, and max deliver shorter
    messages. In the following iteration, these messages are useful and work as shortcuts.


    ```

    average

    \^ self apply: [:each | each average].

    ```


    However, these messages will carry the optimized implementations of the likened
    aggregations because it is necessary that these functions are time and memory
    efficient.


