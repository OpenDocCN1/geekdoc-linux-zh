    phase. However, this phase is the actual phase in which the ability of ethical
    hacker in taking logical decisions plays a very important role.


    # Analysis of vulnerability


    For the purpose of effectively analyzing all the data, an ethical hacker needs
    to employ a pragmatic approach which is logical in nature as well. In the phase
    of vulnerability analysis, all the information which has been collected is compared
    with all the known forms of vulnerabilities in the practical process. Any form
    of information is useful in the process, no matter from where it originates or
    what the source is. A small pinch of information can also help in finding out
    some new sort of vulnerability in the system and might also lead to several other
    discoveries of vulnerabilities which have not been found yet. The known form of
    vulnerabilities, service packs, incidents, updates along with various hacker tools
    helps in properly identifying the point of attack. The internet provides the ethical
    hackers with a huge amount of information which can be associated very easily
    with the system architecture along with weak and strong points in a system.


    # Exploitation


    A considerable amount of time is spent for the purpose of evaluating and planning
    an ethical hack. It is very obvious that all of these planning will lead to some
    sort of attack. The level of exploitation of a system can be as simple as running
    a very small tool in the system or as tough as a collection of many complex steps
    which needs to be executed in a proper way for gaining access to the system. The
    process of exploitation can be broken into a collection of subtasks which can
    be either one single step or a collection of various steps. As each and every
    step is performed, a process of evaluation takes place which ensures that the
    outcome which has been expected is met. Any form of divergence from the plan of
