- pgno: 42
  md: '# firstSeries groupBy: secondSeries.


    Once this message is sent, firstSeries will define an object of DataSeriesGrouped,
    which divides firstSeries into various subseries depending on the values of secondSeries.


    The collection of subseries is later kept as an object of DataSeries whose keys
    are equivalent to the special values of the secondSeries and values store the
    subseries of firstSeries. That will match each of those unique values.


    ![](img/e34dde0654d255bebea353c553e965ac_42_0.png)


    When a receiver of a groupBy: message is a DataFrame, it creates an instance of
    DataFrameGrouped, which splits the data similarly to the way DataSeriesGroup does
    it, except the values of groups series are sub-data frames, not subseries.


    This means groups represent DataSeries that hold keys that match the unique values
    contained in a series which the data frame is identified. Where the data frame
    is categorized by a single column, this column is removed from data frame before
    the grouping. Therefore, this eliminates data duplication because the same values
    will be kept as keys.'
