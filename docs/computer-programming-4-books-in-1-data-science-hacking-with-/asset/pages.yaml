    +   **Vulnerability scanner**: A vulnerability scanner is used for the purpose
    of classifying and then detecting various forms of weaknesses in a system, network,
    communication system, computers etc. This is one of the most common forms of tool
    which is being used by the ethical hackers for finding out the potential vulnerabilities
    and loopholes and then fixes them up on urgent basis. However, a vulnerability
    scanner can also be used by the black hat hackers for checking the vulnerabilities
    and weak spots within a system and then finding out the proper tool for exploiting
    the same.'
