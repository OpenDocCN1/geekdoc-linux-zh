  md: '# Chapter 11: Classification


    Is it spam or not spam? This is one of the popular applications and examples of
    Classification. Similar to regression, Classification is also categorized under
    Supervised Learning. The model learns from labeled data. Then the system uses
    that learning to a new dataset.


    For instance, there’s a dataset with various email messages, and each dataset
    is classified as spam or not spam. The model may then identify features among
    email messages that are highlighted as spam.


    When conducting a prediction, the model may attempt to identify those features
    in new email messages.


    There are different ways of accomplishing a successful classification. Let’s look
    a few of them:


    # Logistics Regression


    In most classification problems, the objective is to confirm whether it’s 0 or
    1 by using two independent variables. For instance, provided that the Age and
    Estimated Salary determine a result such as when the person bought, how can we
    successfully build a model that represents their relationships, and use that for
    prediction.


    This might sound confusing, and that is why you need to get an example.


    ![](img/e34dde0654d255bebea353c553e965ac_82_0.png)


    In the above examples, there are two variables Age and Estimated Salary. Every
    data point is'
