- pgno: 196
  md: '# Basic Network Troubleshooting


    Network troubleshooting refers to all the measures and techniques assembled to
    identify, diagnose and resolve network issues. The process is systematic and primarily
    seeks to restore normalcy to the functionality of a computer network.


    Network administrators are charged with the responsibility of identifying network
    problems and repairing it with the aim of ensuring a smooth run of operations
    in the network. They also do whatever it takes to ensure that the network is operating
    at optimal levels.


    The following are among the many computer network troubleshooting processes:


    +   - Configuration and reconfiguration of switches, routers or any other network
    component.

    +   - Identifying any network issues and figuring out a way to fix it.

    +   - Installation and repair of network cables as well as Wi-Fi devices.

    +   - Getting rid of malware from the network.

    +   - Getting firmware devices up to date.

    +   - Installation and uninstallation of software as is necessary.


    Network troubleshooting can be done manually, or as an automated task-especially
    when it has to do with network software applications. Network diagnostic software
    is a valuable tool when it comes to the identification of network issues that
    may not be easy to detect with the human eye.


    Network troubleshooting includes both hardware troubleshooting and software troubleshooting.


    # Hardware Troubleshooting


    This is a form troubleshooting that takes care of issues with hardware components.
    It may include:


    +   - Removal of faulty or damaged RAM, hard disk or NIC.

    +   - Dusting of computer and other network devices-dust accumulation sometimes
    leads to malfunctioning of devices.

    +   - Tightening of cables that connect different network components.

    +   - Updating or installation of important hardware drivers


    Hardware troubleshooting begins with the discovery of a given hardware issue,
    the cause and, finally, taking the necessary remedial action.


    # Software Troubleshooting'
  merge: -1
  img_proc: true
- pgno: 197
  md: Software entails a set of measures for scanning, recognizing, diagnosing and
    offering solutions to issues with software in the network. It includes issues
    with network operating systems, diagnostic software as well as software applications
    installed on individual network computers.
  merge: -1
  img_proc: true
