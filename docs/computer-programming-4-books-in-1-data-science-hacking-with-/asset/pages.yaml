  md: 'then categorized either as 0 or 1. There’s a line that separates the two. This
    method is based on probability.


    As with Regression, wherein there’s the black box, and the behind the scenes of
    Logistics regression can be difficult. The good thing is that its execution is
    straightforward when you apply scikit-learn and Python.


    It is a usual step to first learn from the Training Set and then use that learning
    to test set. At the end of the day, this is the purpose of Supervised Learning.
    First, you will find there’s training and supervision. Next, the lesson will be
    used in new situations.


    As you discover in the visualization for the test set, the majority of the green
    dots fall under the green region. Therefore, the model can be best for predicting
    whether a person with specific age and estimated salary can buy or not.


    ```

    # Feature Scaling

    from sklearn.preprocessing import StandardScaler

    sc = StandardScaler()

    X_train = sc.fit_transform(X_train)

    X_test = sc.transform(X_test)

    ```


    First, we convert the data into the same range or scale to avoid skewing or over-dependency
    on a given variable. In the dataset, the approximated salary is represented in
    thousands, while age is represented on a smaller scale. We need to set them in
    the same range so that we can expect a reasonable model.


    Besides Logistic Regression, there are other methods of grouping tasks. Let’s
    discuss them:


    # **K-Nearest Neighbors**


    This algorithm is popular for creating advanced classifiers. It is an easy algorithm,
    but it has done better than other classifiers. That is the reason it’s popular
    in genetics, forecasting, and data compression.


    The KNN belongs to a supervised learning algorithm. In other words, we are presented
    with a dataset made up of training observations (x, y), and the main goal is to
    identify the association between x and y. So, we need to define a function x-y
    such that when we are provided with an input value for x, we can predict the corresponding
    value for y.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The idea behind the KNN algorithm is quite simple. It computes the distance
    of the new data point to all the other training data points. The distance can
    be of different types, including Euclidean, Manhattan, etc. The K-nearest data
    points are selected, where K can be an integer. Lastly, the data point is assigned
    to the class, which most of the K data points belong to.


    Remember that Logistic Regression appears to feature a linear boundary between
    0s and 1s. Therefore, it lacks a few of the data points that require to be on
    the other end. Luckily, there are non-linear models that feature a lot of data
    points in a more accurate style. One of them is the application of K-Nearest Neighbors.
    It operates by letting a new data point and then counting the number of neighbors
    that belong to either category. In case a lot of neighbors belong to category
    A than category B, then the new point should be part of category A.


    Therefore, the classification of a given point depends on the majority of its
