    # **Portability**


    Portability is the feature that made Linux OS so famous among the users. Portability
    does not mean at all that it can be carried around in CDs, pen drive or memory
    cars nor the size of the file is small. By portability, it means that the OS of
    Linux along with all its application can function on various types of hardware
    in the exact same way. The kernel of Linux and the application programs of the
    OS support the installation of the same on even those systems which comes with
    the least configuration of hardware.


    # **Security**


    Security is considered as the most essential part of any operating system. It
    is really important for all those users and organizations who are using the system
    for various forms of confidential tasks. Linux OS comes with various concepts
    of security for the purpose of protecting the users from any form of unauthorized
    access of the system and their data.


    # **Main concepts of Linux security**


    Linux provides 3 main types of security concepts.


    +   -   **Authentication**: This helps in authenticating the user with the system
    by providing login names and password for the individual users so that their work
    cannot be accessed by any third party.


    +   -   **Authorization**: At the file level of Linux OS, it comes with limits
    of authorization for the users. There are write, read and execution permissions
    for every file which determines who all can access the files, who can modify the
    same and who all can execute the files.


    +   -   **Encryption**: This feature of Linux OS helps in encoding the user files
    into a format which is unreadable in format and is called cypher text. This makes
