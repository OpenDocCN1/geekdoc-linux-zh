    We can proceed and multiply the weights using the error derivatives in the weights,
    and then the product is compiled. The sum you find will be equivalent to the error
    change rate for the hidden unit. Once you get the error change rate in the weights
    of the hidden layer which is just before the output layer, we will manage to calculate
    these error changes for the other layers.


    The computation for this will happen from one layer to the next, and in the direction
    which is different from the one transmitted through network.


    This indicates where the name “back propogation” originates from. After the error
    change rate has been determined for some unit, the error difference for the weights
    for all the connections of the weight can be computed easily. The error difference
    for the weights can used by multiplying the rate of error change with activity
    through incoming connection.


