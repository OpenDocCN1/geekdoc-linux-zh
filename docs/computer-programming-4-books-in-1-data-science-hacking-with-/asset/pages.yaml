- pgno: 224
  md: '# Chapter 5: Router and Server Basics


    Routers and servers are very important network devices. This section seeks to
    outline some of the fundamental concepts of routing as well as the client/server
    architecture. We''re also going to examine a VLAN and how to configure it.


    # Router: what is it, and what does it do?


    A router is just another networking device that primarily connects different networks.
    A router plays the role of forwarding data packets based on what information is
    contained in the header of a data packet.


    This is a device that operates in the network layer of the OSI model. In the TCP/IP
    model, a router operates in the internet layer.


    Routing refers to the process of determining the best path along which data transmission
    takes place-from source to destination. Routing is done by a router, which has
    been defined above.


    Routing algorithms are responsible for actualizing the routing process. The routing
    algorithms refer to a piece of software that works behind the scenes to ensure
    that the most appropriate path is selected for the transmission of data from sender
    to receiver.


    The routing algorithms are also responsible for the initialization of the routing
    table. They are also responsible for the maintenance of the routing table.


    Routing metrics are used by routing protocols in the determination of the best
    path for data transmission. Routing metrics include hop count, delay, bandwidth
    and current load among others.


    # Routing Metrics and Costs


    Metrics and costs play a key role in determining the best path. Metrics refer
    to network variables that are considered in the determination of the best path.
    Routing metrics include the following:


    +   - Delay: this refers to the time that a router takes in the queueing, processing
    and transmitting of data to a given interface. The path with the lowest delay
    value is unquestionably taken to be the best path.


    +   - Hop Count: this refers to a metric that offers a specification of passes
    through a connecting device like a router. The path with the lowest hop count
    is preferred to any other available path if routing protocols consider the hop
    as a primary variable.


    +   - Bandwidth: this refers to the link capacity. It is given in bits per second.
    The transfer rates of all links are compared. The link with the highest transfer
    rate is embraced as the best path.


    +   - Reliability: the reliability value is determined dynamically. Some links
    are more vulnerable to malfunctioning than others. Besides, some links are more
    easily repaired'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'than others-after a breakdown. Whatever the case, a more reliable link is preferred
    to a less reliable link. The system administrator is charged with responsibility
    of assigning reliability values which are numeric in nature.


    +   * Load: this is the degree of how busy a network link is at any given moment.
    It may be in the form of packets that are processed per unit time; processor utilization
    or memory use. The load increases with increasing traffic. In routing, the link
    with a lighter load is considered to be the best path for data transmission.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# **Routing Types**


    Routing appears in the following classifications:


    Static Routing


    This is also referred to as non-adaptive routing. The administrator has to add
    routes in the routing table manually. Packets are sent from source to destination
    along a path that’s defined by the administrator. Routing does not depend on network
    topology or network state. It is the job of the administrator to decide the routes
    along which data are transmitted from source to destination.


    # **Merits of static routing**


    +   - There is no overhead on router CPU usage.


    +   - There is more security since the administrator has control over a particular
    network only.


    +   - There is no bandwidth usage between different routers.


    # **Limitations of Static Routing**


    +   - It is quite exhausting to come up with a routing table for a big network.


    +   - The administrator must be highly knowledgeable in networking and particularly
    in the network topology he or she’s dealing with.


    # **Default Routing**


    In this technique, router configuration is done in a way that a router sends all
    data packets to a single hop. It does not matter the network on which the hop
    is found. Packets are simply relayed to the machine on which it configured by
    default.


    This technique is most ideal when a given network has to handle a single exit
    point. However, a router would choose another path that is specified in a routing
    table and ignore the one that’s set by default.


    # **Dynamic Routing**


    This is also referred to as adaptive routing. In this approach, a router determines
    the routing path as per the prevailing condition in the network.


    Dynamic protocols the heavy lifting when it comes to discovering of new routes.
    These protocols are RIP and OSPF. Automatic adjustments are meant when particular
    routes fail to function as expected.


    # **Features of Dynamic Protocols**


    The following are features of dynamic protocols:


    +   - Routers must have the same protocols to exchange routes.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   • A router broadcasts information to all connected routers in whenever
    it discovers an issue or issues in the topology or network status.


    # Merits of dynamic Routing


    +   - They’re quite easy to configure.


    +   - The best option when it comes to determining the best paths due to changes
    in network status and topology.


    # Limits of Dynamic Routing


    +   - It’s a lot more costly when it comes to bandwidth and CPU usage.


    +   - It’s not as secure as default and static routing.


    # Important Notes!


    +   - A router filters out network traffic not merely by packet address, but by
    a specific protocol.


    +   - A router does not divide a network physically. It does so logically.


    +   - IP routers divides networks into a number of subnets to ensure that specific
    network traffic meant for a particular IP address can be allowed to pass between
    specified network segments. However, this intelligent data forwarding leads to
    decreased speeds.


    +   - Network efficiency is higher with the use of routers in complex networks.'
  merge: -1
  img_proc: true
- pgno: 228
  md: "# Network Servers\n\nA network server refers to a software application that\
