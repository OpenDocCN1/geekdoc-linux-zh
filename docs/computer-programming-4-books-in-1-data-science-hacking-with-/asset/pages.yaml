    \ network.  \nClient computers in a network make requests to the server whenever\
    \ they need certain services.  \nThe offers an open window for client request,\
    \ but does not, at given moment, initiate a service.  \nServers are infinite programs\
    \ that, when started, runs infinitely unless an issue pops up. A server  \nalways\
    \ stands in wait for requests from client machines on a given network. The server\
    \ responds  \nappropriately to all incoming client requests.  \nSome networks\
    \ do not have a dedicated server to control communication on the network. Given\
    \  \nsuch arrangements, network devices communicate directly with one another.\
    \ There are, however,  \na number of merits as well as demerits of servers in\
    \ network operation.\n\n# Merits of Servers\n\nThe following are pros of using\
    \ a server to handle client request on networks:\n\n+   - Centralized administration\
    \ ensures more security in in respect of resource sharing.\n+   - Use of a server\
    \ provides a centralized back-up system since important data is stored in a\n\
    +     server computer.\n+   - There is increased network speed in respect of resource\
    \ sharing.\n+   - There is a higher scalability level since it’s possible to expand\
    \ the network in terms of\n+     clients and server separately.\n\n# Limitations\
    \ of Using Servers\n\n+   - Traffic congestion is always a big issue when many\
    \ clients have to send requests\n+     simultaneously.\n+   - There is no robustness\
    \ in a network since a breakdown or malfunction of a server\n+     derails all\
    \ request handling features of a network.\n+   - Specific hardware may be required\
    \ at the server-side since a client/server network is\n+     greatly decisive.\n\
    +   - There may exist a resource in server computer, but not in a client computer.\n\
    \nServers are available in different forms. The following is a list of different\
