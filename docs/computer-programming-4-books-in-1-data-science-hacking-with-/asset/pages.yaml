  md: '# # Chapter 13: Reinforcement Learning


    Notice that in the previous chapters, the focus is on working on past information
    and then deriving insights from it. In other words, we’re much focused on the
    past than on the present and future. But for data science and machine learning
    to become truly useful, the algorithms and systems should work on real-time situations.
    For instance, we require systems that learn real-time and adjust accordingly to
    maximize the rewards.


    # ## What is Reinforcement Learning?


    This is where Reinforcement Learning (RL) comes in. In a nutshell, RL is about
    reinforcing the correct or desired behaviors as time passes. A reward for every
    correct behavior and a punishment otherwise. Recently RL was implemented to beat
    world champions at the game of Go and successfully play various Atari video games
    (although Reinforcement Learning there was more sophisticated and incorporated
    deep learning). As the system learns from reinforcement, it was able to achieve
    a goal or maximize the reward.


    One simple example is in the optimization of click-through rates (CTR) of online
    ads. Perhaps you have 10 ads that essentially say the same thing (maybe the words
    and designs are slightly different from one another). At first, you want to know
    which ad performs best and yields the highest CTR. After all, more clicks could
    mean more prospects and customers for your business. But if you want to maximize
    the CTR, why not perform the adjustments as the ads are being run? In other words,
    don’t wait for your entire ad budget to run out before knowing which one performed
    best. Instead, find out which ads are performing best while they’re being run.
    Make adjustments early on, so later, only the highest-performing ads will be shown
    to the prospects.


    It’s very similar to a famous problem in probability theory about the multiarmed
    bandit problem. Let’s say you have a limited resource (e.g., advertising budget)
    and some choices (10 ad variants). How will you allocate your resource among those
    choices so you can maximize your gain (e.g., optimal CTR)?


    First, you have to “explore” and try the ads one by one. Of course, if you’re
    seeing that Ad 1 performs unusually well, you’ll “exploit” it and run it for the
    rest of the campaign. You don’t need to waste your money on underperforming ads.
    Stick to the winner and continuously exploit its performance. There’s one catch,
    though. Early on, Ad 1 might be performing well, so we’re tempted to use it again
    and again. But what if Ad 2 catches up and if we let things unfold Ad 2 will produce
    higher gains?'
  merge: -1
  img_proc: true
