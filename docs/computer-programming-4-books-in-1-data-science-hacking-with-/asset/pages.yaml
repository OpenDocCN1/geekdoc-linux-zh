  md: '# ## Chapter 2: What is Ethical Hacking?


    ![](img/e34dde0654d255bebea353c553e965ac_114_0.png)


    Ethical hacking is also called as intrusion testing, penetration testing and also
    red teaming, in simple words, it is the controversial technique of finding out
    vulnerabilities and weaknesses in a system simply by imitating the actions and
    intent of the malicious hackers. An ethical hacker is a person or security professional
    who uses his skills for the purpose of various defensive measures on part of the
    administrators of an information system. An ethical hacker is also known as a
    white hat or white hat hacker. By conducting various tests, an ethical hacker
    tries to find out the answers to the following questions:


    +   - What are the locations, systems or information can the attacker gain access?

    +   - What will the attacker see before setting his target?

    +   - What will the attacker do with the information which is available in the
    system?

    +   - Is anyone able to notice the various attempts made by the attacker to gain
    access?


    The ethical hacker who has been given the job of penetration testing operates
    on the permission along with the knowledge of that organization for which he has
    been assigned the job of defense. There are various cases in which an organization
    will not be informing the security information team about all the activities which
    is going to be carried out by the ethical hacker just for testing the effectiveness
    and concise of the security information team. This whole thing is also known as'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'double blind environment. For the purpose of effective and legal operation,
    the organization needs to inform an ethical hacker about all those assets and
    information which are meant to be protected, the potential sources of threats
    and the limit to which the organization will be supporting the efforts of the
    ethical hacker.


    # **Process of ethical hacking**


    All the ethical hackers follow a strict process in order to get the best usable
    and to the point legal results. Let’s have a look at the processes which are followed
    by the ethical hackers.


    # **Planning**


    No matter what kind of project it is, for every successful project planning is
    of utmost importance. It provides the ethical hackers with the opportunity of
    thinking about what are the things that need to be done, set the goals which are
    to be reached and also for the assessments of risks for evaluating how to carry
    out a complete project. There are various factors which are considered by the
    ethical hackers before carrying out a project of ethical hacking. The list of
    factors includes culture, policies of security, laws, regulations, requirements
    of the industry and best practices. All of these factors play an important role
    in the process of decision making when it comes to the initiation of ethical hacking.


    The phase of planning in ethical hacking will be having an overall influence on
    how the process of hacking is being performed, the information which is collected
    and shared and will also be directly influencing the integration and delivery
    of the results into the program of security. The planning phase is the very first
    step and will be describing most of the details about the controlled attack of
    hacking. It will also be answering all forms of questions regarding hacking such
    as how the process of ethical hacking is going to be controlled and supported,
    what are the basic actions which needs to be performed and for how long will the
    process go on.


    # **Reconnaissance**


    It is the process of searching for all those information which are freely available
    for assisting in the process of attack. This whole process can be as easy and
    simple as just using a ping or browsing the various newsgroups which are available
    on the internet for searching that information which is leaked by the employees
    or as tough and messy as digging through a huge trash of letter or receipts. This
    process can also include several other processes such as phone tapping, social
    engineering, network tapping and also data theft. The process of information searching
    will be limited only to the extent to which the organization and the ethical hacker
    will want to go for the purpose of recovering all the required information which
    they are looking out for.


    The phase of reconnaissance introduces the deep relationship in between the tasks
    which needs to be completed and all those methods which will be needed for protecting
    the information and assets of the organization.


    # **Enumeration**'
  merge: -1
  img_proc: true
