    \ SecurityTrails](img/rsrc1PW.jpg) 启动二维码 攻击\n\n## 19. BeEF\n\n`BeEF` 代表浏览器利用框架，一种极其强大的渗透测试工具，依赖程序漏洞和缺陷来利用主机。与其他\
