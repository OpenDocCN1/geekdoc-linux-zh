    ### Set permissions

    You should make a client other than the web administration''s framework client
    the owner of the record base of your website. You should also deny write authorizations
    to the web service. The web service just needs to read the consent to serve content,
    and assigning write or execute authorizations to it leaves an attack vector for
    pariahs.


    For instance, you should set the ownership for the whole catalog as `wp-user:
    www-data`. This setting implies that the `wp-client` has client ownership, and
