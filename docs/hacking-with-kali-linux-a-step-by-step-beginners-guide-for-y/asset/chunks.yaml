    道德黑客攻击流程分为如下所示的六阶段：

    ![道德黑客流程](img/rsrc1P7.jpg)


    ## 什么是侦察？


    侦察（Reconnaissance）是一种收集数据的初步审查；特别是：对敌方区域进行的探索性军事研究。网络安全观察是一种利用各种技术收集目标数据的方法。在对目标进行侦察练习时，道德黑客会利用三种基础数据：


    * 网络

    * 主机

    * 包含在内的客户端人员


    ## 执行侦察练习的步骤


    收集数据和熟悉目标框架是道德黑客的主要程序。监控涉及许多过程和系统；足迹（Foot-printing）、`Scanning`（扫描）和 `Enumeration`（枚举）用于发现并收集有关目标的数据。在侦察工作/阶段中，道德黑客努力在完成下面记录的七个阶段后，尽可能地按照合理预期收集关于目标框架的数据：


    * 收集初始数据

    * 确定系统范围

    * 识别活动机器

    * 发现可用的开放端口以及应用程序（接入点）

    * 操作系统指纹

    * 寻找运行在不同端口上的管理程序

    * 网络制图


    侦察本质上分为两个重要部分。


    ### 主动侦察

    主动侦察包括与你的目标计算机框架直接接触以收集数据，直接获得的数据非常准确。在未经授权的情况下进行主动侦察时存在被发现的风险。然而，大多数黑客攻击练习都需要主动侦察。


    ### 被动侦察

    在此过程中，你不会与计算机框架直接关联。此程序用于在不与目标框架进行交互的情况下收集基础数据。


    ### 足迹 (Foot-Printing)

    足迹是一种更大层次的尝试，旨在从高层勾勒场景特征。在 CEH（认证道德黑客）术语中它们是互义词，但如果你只需记住足迹是一种监控就足够了。


    在足迹阶段，你正在寻找任何可能让你了解目标某些知识的数据，无论其大小如何。具有特定意义的事项例如：高层系统设计（他们声称在使用哪些交换机？买了哪些服务器？）、应用程序和网站（他们会说是面向公众的吗？）以及物理安全措施（什么种区域控制框架构成了主要障碍？员工的日常日程是怎样的？）。显然，任何关于员工本身的数据都是极其宝贵的，因为这些人员在测试测试后期将成为你的巨大目标。虽然获取这些部分信息可能有些困难，但大多数信息获取相对容易，而且只要你睁开双眼，它们就在你面前。与监控一样，足迹分为两种：主动足迹和被动足迹。


    在此过程中，黑客还会特别关注以下内容：


    * 域名

    * IP 地址

    * 命名空间

    * 员工信息

    * 电话号码

    * 电子邮件

    * 职位信息


    ### 枚举 (Enumeration)

    真正意义上的枚举是按照类别对物品进行有组织的完整列出。枚举是列出配置、客户端记录、共享和不同资产列表的过程。这一过程发生在漏洞评估之前、`scanning`
    之后。这使得攻击者能够制定获取访问权限的最佳策略。规范可用于收集以下数据：


    * 用户和组

    * 网络和共享路径

    * 主机名

    * 路由表

    * 服务设置

    * SNMP 端口过滤

    * DNS 详细应用程序和横幅


    可以使用相应的工具进行识别。在 Windows 操作系统中，可以使用许多设备来列出 NetBIOS 名称，命令如下：


    * `net accounts`

    * `net config server`

    * `net config workstation`

    * `net view`


    以及更多


    ### 扫描 (Scanning)

    在此过程中，攻击者开始有效地测试目标机器或系统是否存在可被利用的漏洞。在此过程中使用的设备有 `Nessus`、`Nexpose` 和 `NMAP`。


    ### 获取访问 (Getting Access)

    在此过程中发现漏洞并尝试利用它以进入框架。在此过程中使用的基本工具是 `Metasploit`。


    ### 维持访问 (Maintaining Access)

    这是黑客刚刚进入框架的地方。在获得访问后，黑客会引入几个后门，以便将来需要访问该框架时再次进入。`Metasploit` 是此过程中的优选。


    ### 清除轨迹 (Clearing Tracks)

    此过程实际上是一种利用性行动。它涉及删除黑客过程中发生的大量日志。


    ### 报告 (Reporting)

    报告是完成道德黑客过程的最后步骤。在这里，道德黑客收集一份包含其发现的操作的操作，例如使用的设备、成功率、发现的漏洞和利用过程。


    ## KALI LINUX

    安装操作系统（例如微软的 Windows、苹果的 OSX 或 Debian 和 Ubuntu 等开源平台）对某些人来说很自然，但对这一过程进行更新在任何时候都是很好的。从未引入过工作框架的人不应该压力，此部分的后续将提供查找、下载和安装
    Kali Linux 所需的所有手段。Kali Linux 在许多方面与众不同，但该发行版最重要的区别在于它可以从硬盘安装运行，也可以作为现场光盘启动，以及默认引入的特定应用程序的数量和种类。现场光盘是安装在光盘（CD）、数字视频光盘（DVD）或蓝光磁盘上的工作框架。作为渗透渗透分析师，启动现场光盘的能力是非常重要的。


    拥有系统本地机器访问权限的人可以使用现场光盘来使用这些机器，无论渗透测试人员对已安装的操作系统是否有记录。框架将启动到现场光盘而不是本地硬盘；换之，如果机器配置得当，渗透分析师此时将访问本地系统上的大量资源，同时不会在本地机器的硬盘上留下证据。Kali
    Linux 上安装的程序是另一个说明它为何为渗透分析师奇备的理由。通常情况下，Kali Linux 内置了 400 个渗透测试和安全设备、包和应用程序，并可以根据需要包含更多。


    ## 系统信息

    每个操作系统都有其特性和细微差异，这些差异会通过其底层架构和配置体现出来；无论如何，大多数基于 Linux/Unix 的平台本质上是相似的。在引入 Kali
    Linux 时，与其它 Linux 工作框架一样，安装前的配置至关重要。以下是引入 Kali Linux 时一些要点的简要列表：


    * 工作框架将运行在 PC 还是服务器 上？

    * 需要多大的硬盘？

    * 可用硬盘是否有足够的可用空间？

    * 需要多少个硬盘分区？

    * 日志管理是否令人担忧？

    * 安全是否令人担忧？

