    # 选择安装硬件平台


    通常情况下，操作系统安装在 PC 的硬盘上。在任何情况下，对于某些操作系统（例如 `Kali Linux`），由于大容量设备的持续性、易用性且合理性，可以将操作系统安装到
    U 盘（也称为闪存盘）和 SD 卡中。尽管大容量便携存储设备被用于安装操作系统，但决定是安装到独立 PC（例如实验室 PC）还是安装到将考虑移动部署的 PC
    上至关重要。如果将使用某些特定设备（例如强大的设计显卡）进行密码破解，建议在个人电脑上安装 `Kali Linux`。如果需要将操作系统从一个站点传输到另一个站点，或者想要测试远程设备，建议使用
    PC。操作系统的安装对于 PC 和个人电脑来说是同一样的。


    ## 硬盘选择


    尽管不言过其实，但“容量确实很重要”。一个通用的可靠指南是：硬盘越大越好。本书建议使用至少具有 120GB 空间的驱动器；此外，即使是这样也很快就会满，特别是考虑到密码破解、取证或渗透测试项目需要大量的权限、证据、日志以及报告或收集的素材。由于一般的业务和政府安全评估，操作系统会被清理、删除或完全移除，以保持处于标准状态。这种做法在整个安全网络中是公认的，因为需要对客户分类信息进行合法处理，并限制可能损害组织架构或声誉的企业数据泄露。


    ## 硬盘分区


    分区是通过设置唯一的区域大小和部分将文件系统分离到硬盘的特定区域的过程。分区可以防止操作系统被接管框架的日志记录所破坏，并在某些情况下提供更强的安全性。操作系统在根本上被有效地拆分为两个不同的部分。主分区是交换区域（swap
    territory），用于内存分页和容量。另一个分区被分配给其他所有内容，并带有文件结构进行组织，例如全扩展文件系统 3 (`ext3`) 或扩展文件系统
    4 (`ext4`)。对于工作站，特别是那些工作框架将反复加载的设备，进一步划分并不是必要的。对于具有持久持久操作系统的修改设备或 PC，有必要分离临时（`tmp`）记录。


    硬盘的高级分区和 PC 双系统启动不在本书的范围内，将不会提供。主要的特殊情况位于附录 A，其中展示了带有名为 `Tribal Chicken` 的第三方应用程序的修改设备。


    ## 安装期间的安全性


    `Kali Linux` 是一个极其强大的操作系统，拥有许多预装工具，这些工具可以破坏 PC、网络基础设施，而且如果被不当或不合道德地使用，可能会导致被视为犯罪或违法的活动。因此，密码是至关重要的。虽然密码是最基本的安全实践，但许多管理员和安全专家经常忽略或忽视密码的使用。基本的安全实践（例如对密码的合法使用）对于确保你的
    `Kali Linux` 安装不被其他可能无意或恶意对个人、PC 或网络造成损害的人使用至关重要。


