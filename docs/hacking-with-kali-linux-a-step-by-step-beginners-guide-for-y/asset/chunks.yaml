    你在框架上引入的大多数与网络相关的编程都需要登录凭据。这里最重要的一点不是在所有应用程序中使用相同的密码。这会让他人极轻易地入侵你的所有记录，并可能夺取你的身份。如果你在记忆一整组密码时遇到困难，可以尝试使用密码管理器。这将确保你所有密码的安全，你只需要记住一个即可。可以与电子邮件或短信结合作为双重验证（2SV）策略的一个部分，以增加安全性。大多数情况下，2SV
    在你从另一个或未识别的设备登录网站或应用程序时启动，要求你通过 `PIN code` 验证身份。


    虽然许多安全措施可以识别隐性危险，但始终存在有人可能获取你真实电脑的可能性。这里基本的防线是设置一个强力的电脑密码，至少这会增加他们进入的难度。不同类型的检查包括生物识别策略，如指纹或视网膜扫描。其他的物理检查策略可能包括插卡和密钥，例如
    `Yubico` 提供的设备。这些中的任何一个都可以相互结合，并配合密码作为双重身份验证（2FA）过程的一个部分。如果你担心有人真的带走你的电脑，另一种选择是物理锁。这是笔记本电脑的完美答案，也可以用于家庭或办公电脑。`Kensington
    locks` 以及其他类似品牌是插入设备特殊开口的微型安全装置。有些需要物理钥匙，而另一些则通过代码工作。平板电脑也有解决方案，尽管这些通常会变得越来越笨拙，且越来越适合展示柜之类的物品。


    ## 7. 加密你的信息


    无论你的电脑里存储的是你所有的目标，还是许多具有纪念价值的文件（如照片和视频），确保数据安全都是值得的。确保数据不落入他人之手的一种方法是对你的信息进行加密。加密后的信息需要资源才能解码；这本身可能足以阻止黑客进行活动。现在有很多工具可以帮助你对在线流量、记录、邮件以及存储在电脑上的文档进行加密。对于全加密，一些著名的工具是
    `Vera Crypt` 和 `BitLocker`。你可以找到帮助你加密手机的独立工具，`Android` 和 `iOS` 都有相应的应用程序。


    ## 8. 使用 VPN


    虚拟私人网络（VPN）是增强安全的极佳方法，特别是在浏览网页时。使用 VPN 时，你所有的网络流量都会被加密并通过位于另一个地区的中间服务器进行传输。这会掩盖你的
    `IP`，将其替换为另一个，这样你的 `ISP` 就再也无法监控你的活动。此外，你通常可以根据需求选择服务器区域，例如获取最速度或解锁地理限制的内容。此外，VPN
    还可以帮助你在使用开放 WiFi 系统时安全浏览，并访问受审查的内容（例如在中国访问 Facebook）。在选择供应商方面，市面上有一些不错的免费方案，但付费服务的月费可以非常低，甚至低至每月
    `$3`。免费版通常在功能上受到限制，但对于发现哪些服务可用可能很有帮助。一些付费选项提供全功能支持的免费试用期和慷慨的退款保证期。无论你在电脑上存储了什么，保护其内容免受犯罪分子和窥探者的侵犯都是明智的。虽然没有任何东西是绝对安全的，但上述方法将为绝大多数人提供足够的保护并保护他们的信息。


    ## 9. 结论


    感谢你读到 `Hacking With Kali Linux` 的最后。希望它对你有所启发，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。下一步是继续你的道路。在你走上黑客之路时，将你所学的一切转化为适合自己的实践习惯。并不是每个人都会拥有和你同样的经历；这条道路完全取决于你个人和你的工作，所以要为自己的成长感到自豪，并在继续的过程中倾听直觉。随着黑客技术的不断发展并遍及全球，我们也必须以
    `Kali` 为指南，开启个人的旅程。这些道路没有终点，而是穿行在复杂的森林、荒凉的沙漠和咸涩的海风中。虽然这些实践可能并不适合所有人，如果你已经读到了这本书的最后，那么你可能成为这一实践的终身追随者。运用你所学的知识去成长，成为优秀黑客的典光榜样。最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在
    Amazon 上的评价！


