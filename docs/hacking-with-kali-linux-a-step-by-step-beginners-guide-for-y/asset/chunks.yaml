    *   Update your antivirus and other security program and run a full output on
    your gadget to evacuate harmful projects and documents that might be spying or
    taking your login data. Restart your device and run the output once more. Set
    your device to a programmed update so you''ll be shielded from new attacks.

    *   Upgrade to a one of a kind and strong password for every social media account
    you claim and empower 2-Factor Authentication (otherwise called 2-Step Verification)
    to give your record an additional layer of security.

    *   Review your social media account authorizations and confine access to outsider
