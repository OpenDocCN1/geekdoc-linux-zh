    * 尽管其核心较小，但该语言具有极佳的扩展性。

    * Scheme 提供了延迟求值（deferred evaluation），这意味着你可以非常有效地用它创建独特的编程模式。

    * Scheme 提供的卫生宏（hygienic macros）允许设计人员在不干扰其局部语言结构的情况下有效地扩展该语言。


    ## 14. Lua


    Lua 是一种极其轻量级的语言，可以轻松运行在几乎所有安装的框架上。该语言速度快，并配备了相当简单但强大的 `C API`，让伦理黑客能够制造潜在的黑客项目来渗透此类框架。基于此，对于对植入设备（如智能手表、智能电视和许多
    IoT 设备）需求激增的框架，Lua 可能是入侵这些框架的最佳编程语言。作为专家伦理黑客，拥有破解这些设备的选项对你来说是绝对。


    ### 这种黑客编程语言的特性


    * 这种轻量且快速的编程语言是破解嵌入式系统的惊人答案。

    * Lua 在业务中被大量用于创建入侵检测系统（`IDS`）等安全框架。

    * Lua 极快的执行速度和动态垃圾回收使其成为构建敏捷漏洞（exploits）的理想选择。

    * Lua 的多阶段特性使其特别适用于创建通用的黑客程序。


    ## 15. HTML


    如果不提到 `HTML`，任何最佳黑客编程语言列表都是不完整的的。它代表超文本标记语言，并将整个 Web 网连接在一起。没有 HTML，你甚至无法看到这篇文章。基于此，你现在应该已经意识到它的必要性。此外，学习
    HTML 并不困难。因此，我们建议你花些时间彻底掌握 HTML 的基础知识。当你不断进步并开始编写日益复杂的黑客程序时，它将证明是一个基础贡献。


    ### 这种黑客编程语言的特性


    * HTML 是 Web 的语言。

    * 如果你需要破解 Web 应用程序，完全理解 HTML 是基础。

    * HTML 也用于创建跨平台移动应用和桌面应用程序，因此如果你需要测试此类应用程序的真实性，HTML 是必不可少的。

