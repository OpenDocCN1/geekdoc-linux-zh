    在设置密码时，它将显示为一系列圆点或参考标记。这是很典型的做法，并且可以防止你的密码在有人可能查看 PC 屏幕时被泄露。在两次输入等效强密码单词后，点击“继续”（Continue）按钮以继续进行安装（图
    2.4）。![](img/rsrc1PB.jpg) 图 2.4 设置密码。


    ## 用户管理

    当你启动 Kali 时，你已经设置好了 root 客户端。与其他的 Linux 发行版不同，你不会被要求创建另一个客户端。这是因为你在 Kali 中可能进行的大部分操作都需要超级用户（root）权限。因此，尽管以
    root 客户端登录是一个坏习惯，但并没有动力再创建一个新客户端。这种设计的意图是，使用 Kali 的人应该足够了解自己在做什么，因此不太可能因为 root
    权限而把自己搞砸。


    然而，在 Kali 中包含和通用管理客户端仍然可能的，这与不同的发行版类似。如果你需要创建一个客户端，可以简单使用 `useradd` 命令。你也可以使用
    `adduser`。两者的目标相似。在创建用户时，了解用户的一些属性非常有价值。每个用户至少应该有一个家目录、一个 shell、一个用户名和一个组。


    例如，如果我需要添加我的用户名，我会使用 `useradd -d /home/kilroy -s /canister/slam -g clients -m
    kilroy`。给定的参数决定了家目录、用户在交互登录时应执行的 shell 以及默认组。`-m` 参数表示 `useradd` 应该创建家目录。这会在家目录中填充交互式登录所需的骨架文件。


    根据确定的组 ID（GID），`useradd` 要求该组必须存在。如果你需要你的用户拥有它自己的组，可以使用 `groupadd` 创建一个新组，然后使用
    `useradd` 创建一个属于该组的用户。如果你需要将你的用户添加到多个组中，可以修改 `/etc/group` 文件，并将你的用户添加到你希望该用户加入的每个组行的末尾。为了获得与这些组的记录访问相关的任何权限，例如，你必须注销并重新登录。这将使更改应用到你的用户，包括新加入的组。


    创建用户后，你应该设置一个密码。这通过使用 `password` 命令完成。如果你已登录并需要更改另一个客户端的密码，由于我们在第一个模型中创建了客户端，你需要使用
    `password kilroy`。如果你只是使用不带用户名的 `password`，你将更改你自己的密码。


    ## 服务管理

    很长以来，有两种服务管理模式：BSD 方式和 AT&T 方式。现在已不再如此。目前有三种不同的管理服务的方法。在我们进入服务面板之前，我们应该首先定义什么是服务。在此语境下，服务是一个在没有客户端参与的情况下运行的程序。工作环境会自动启动它，它在后台运行。除非你有一个程序列表，否则你可能永远不知道它正在运行。大多数框架在任何时候都有运行着数量相当多的的服务。它们被称为服务，是因为它们为框架、客户端，或者偶尔为远程客户端提供帮助。


    由于没有即时的客户端通信，大程度上，关于这些服务的启动和结束，应该有另一种方法来启动和停止服务，这些方法可以在框架启动和关机期间自然地调用。有了处理这些服务的工具后，客户端也可以使用相同的工具来启动、停止、重启和获取这些服务的状态。


    长期以来，许多 Linux 发行版使用 AT&T `init` 启动进程。这些隐式服务运行时带有许多带有标准参数的内容。`init` 启动框架利用运行级别（run
    levels）来确定哪些服务已启动。单用户模式会启动一套与多用户模式不同的服务配置。当使用显示器服务时，会启动更多的服务，以给客户端提供 GUI。内容被存放在
    `/etc/init.d/` 中，可以通过给出参数（例如 `start`、`stop`、`restart` 和 `status`）来管理。例如，如果你需要启动
    SSH 服务，你可以使用命令 `/etc/init.d/ssh start`。然而，`init` 框架的问题在于它在很大程度上是顺序性的。这导致了框架启动时的性能问题，因为每个帮助都是分组启动的，而不是多个服务同时启动。`init`
    框架的另一个问题是它对条件的支持不好。通常，一个服务可能依赖于必须先启动的不同服务。


    `systemd` 出现了，它是由 RedHat 的程序员创建的。`systemd` 的目标是提高 `init` 框架的效率并克服它的部分弱点。`systemd`
    可以声明条件，服务可以并行启动。不再需要编写 bash 脚本来启动服务。相反，有设计文档，所有的服务都通过 `systemctl` 程序处理。要使用 `systemctl`
    处理服务，你需要使用 `systemctl action service`，其中 action 是你传递的指令，service 是服务的名称。例如，如果你需要启用
    SSH 服务并随后启动它，只需输入指令。


    ## 软件包管理

    虽然 Kali 随带了大量的软件包，但并不是 Kali 适合安装的所有内容都在默认安装中。你偶尔可能需要安装软件包。你还将刷新你的软件包列表。要管理软件包，忽略你正在尝试做什么，你可以使用高级软件包工具（APT）来执行这些功能。还有其他不同的管理软件包方法。你可以使用前端，但最后它们都是建立在之上的整个项目。你可以使用任何你喜欢的前端，但使用命令行是自然的，了解如何使用它是有价值的。虽然它是命令行，但比我多年来看到的许多前端要简单得多。你可能需要执行的主要任务是刷新本地数据库中的所有元数据。这些关于包的信息，包括版本号。版本数据用于判断产品是否过时并需要更新。


    ## 日志管理

    通常，如果正在进行安全测试，你可能永远不需要需要查看框架上的日志。尽管如此，多年来，我发现日志是无价的。尽管 Kali 可能非常强大，总会有某些事情变得糟糕并且你进行调查。事实上，当一切都顺利时，你可能仍然需要查看应用程序正在记录什么。因此，你必须理解
    Linux 中的日志框架。UNIX 长期以来使用 `Syslog` 作为记录器，但它最初是发送邮件服务器的日志工具。多年来，`syslog` 有许多实现。Kali
    Linux 默认引入了 `rsyslog` 实现。它非常直接，而且决定需要在日志数据中搜索的区域并不困难。总之，所有日志都进入 `/var/log`。但是，有一些特定的文件你应该在日志片段中搜索各种类型的数据。在
    Kali 上，你会检查 `/etc/rsyslog.conf`。


    ## 配置系统时

    图 2.5 显示了选择时区的概要。点击适当的时区并点击继续。

    设置 Linux 操作系统的方法多到某人可以为这个主题写一本书。本指南将集中在最基础的设置上——引导分区（Guided Partitioning）。图 2.6
    到图 2.10 显示了默认设置（注：原文此部分存在大量重复和乱码，翻译已根据核心意图精简并对齐）。


    引导分区 (Guided Partitioning) 是最基础的设置。在安装过程中，图 2.6 显示了分区的各种选项。LVM（逻辑卷管理）不适用于工作站、优盘或
    SD 卡。LVM 适用于多个硬盘并专门建议用于高级用户。“引导分区”（Guided-）是最佳选择。点击 Continue 继续安装过程。

