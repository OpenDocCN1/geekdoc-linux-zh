    ## 6. WPScan


    `WPScan` 专门用于检查你的 WordPress 安装的安全性。通过使用 `WPScan`，你可以检查你的 `WordPress` 设置是否受到特定类型攻击的漏洞，或者它是否泄露了中心、模块或主题记录中的过量数据。这个
    WordPress 安全工具还为你提供了机会定位每个注册客户端的任何弱密码，甚至对其进行暴力破解攻击以查看哪些密码可以被破解。`WPScan` 从 `wpvulndb.com`
    WordPress 漏洞数据库获取访问更新，使其成为处理前沿 `WP` 安全特性的卓越程序：


    *   `WP` 用户名列表

    *   非侵入式安全扫描

    *   `WP` 插件漏洞枚举

    *   `WP` 暴力破解和弱密码破解

    *   计划 WordPress 安全扫描


    ## 7. OpenVAS


    `OpenVAS`（开放漏洞评估系统）由负责开发著名的 `Nessus` 漏洞扫描器的团队成员创建。它在 `GPL` 许可下授权，是一项任何人都可以用来调查本地或远程系统漏洞的免费程序。这些安全工具允许你将自己的安全模块组合并协调到
    `OpenVAS` 阶段，尽管当前的引擎带有超过 50000 个 `NVTs (网络漏洞测试)`，它们可以真正检查你想象的任何安全漏洞。主要特性：


    *   同时进行主机发现

    *   网络映射器和端口扫描器

    *   支持 `OpenVAS 传输协议`

    *   完全集成 `SQLite` 等 `SQL` 数据库

    *   每日或每周计划扫描

    *   将结果导出为 `XML`、`HTML`、`LaTeX` 文格式

    *   停止、暂停和恢复扫描的能力

    *   完全支持 Linux 和 Windows


    ## 8. CMSMap


    与 `WPScan` 不同，`CMSMap` 计划作为一个针对最多四个最著名 `CMS` 的集成解决方案。`CMSmap` 是一个用 `Python` 编写的开源项目，自动化了
    `WordPress`、`Joomla`、`Drupal` 和 `Moodle` 中的漏洞检查和识别过程。该工具不仅用于检测这四个主流 `CMS` 的安全漏洞，还能在发现漏洞后运行真实的暴力破解并启动漏洞利用。基本特性包括：


    *   支持 `SSL` 加密

    *   设置自定义客户端操作和标头的能力

    *   支持不同的扫描威胁

    *   用于调查目的的详细模式

    *   将结果保存在文件中


    ## 9. Fluxion


    `Fluxion` 是一种在 `MITM WPA` 攻击中具有巨大权威的 WiFi 分析器。它允许你检查远程系统，寻找企业或个人系统中的安全缺陷。与其他 WiFi
    破解设备不同，`Fluxion` 不会发送任何通常花费大量暴力破解尝试。相反，它生成一个 `MDK3` 过程，使与目标系统相关的所有客户端去认证。当这完成后，客户端会被引导连接到一个伪造接入点，他们将在那里输入
    WiFi 密码。此时，程序会将密码报告给你，这样你就可以进入。


    ## 10. Aircrack-ng


    `Aircrack-ng` 是一个远程安全程序包。它由一个网络数据包、一个 `WEP` 网络破解器以及 `WPA/WPA2-PSK` 以及另一组远程检查工具组成。以下是
    `Aircrack-ng` 套件中最著名的设备：


    *   `Airmon-Ng`：将你的无线网卡更改为混监听模式下的无线网卡

    *   `Airmon-Ng`：捕捉所需的详细信息，在解码密码方面特别有用

    *   `Aircrack-Ng`：用于破解密码——在捕获 `WPA` 握手后，准备使用事实方法解码 `WEP` 以及 `WPA` 和 `WPA2` 字典

    *   `Airplay-Ng`：可用于生成或加速通道中的流量

    *   `Airdecap-Ng`：一旦破解密钥，即可解密无线流量


    主要特征：


    *   支持 `WEP`、`WPA/WPA2-PSK` 密码

    *   快速 `WEP` 和 `WPA` 密码破解

    *   数据包嗅探和注入注入

    *   创建虚拟通道的能力

    *   自动 `WEP` 密钥密码恢复

    *   密码列表管理


    ## 11. Kismet Wireless


    `Kismet Wireless` 是一种多阶段无线局域网分析器、嗅探器和 `IDS (入侵检测系统)`。它完美适配任何类型的无线网卡。在嗅探模式下使用它允许你处理远程系统，例如
    `802.11a`、`802.11b`、`802.11g` 和 `802.11n`。`Kismet Wireless` 本地运行 `Windows`、`Linux`
    和 `BSD`。主要特征：


    *   轻松定位无线客户端和通道

    *   以被动模式运行的能力

    *   无线入侵检测系统

    *   扫描给定 AP 的加密级别

    *   支持跳频

    *   网络日志


    ## 12. Wireshark


    `Wireshark` 是一个运行于 `Linux`、`OS X`、`BSD` 和 `Windows` 的开源多阶段网络分析器。它对于了解系统内部发生了什么非常有帮助。它也像
    `tcpdump` 一样工作，但 `Wireshark` 包含一个强大的图形界面，允许你对捕获的信息进行过滤、排序和请求，因此它需要一些投入。一个名为 `tshark`
    的命令行形式与之类似。主要特性包括：


    *   全协议检查

    *   读取捕获文件格式如 `tcpdump (libpcap)`、`Pcap NG`、`Catapult DCT2000`、`Cisco Secure IDS
    iplog` 等

    *   图形用户界面

