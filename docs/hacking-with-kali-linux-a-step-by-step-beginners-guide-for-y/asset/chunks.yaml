    *   更新您的杀病毒软件和其他安全程序，并对您的设备运行全盘扫描，以清除可能监视或窃取您登录数据的有害项目和文档。重启设备并再次运行扫描。将您的设备设置为计划更新，以防范新的攻击。

    *   为拥有的每一个社交媒体账户升级独特且强力的密码，并启用双因素身份验证（也称为两步验证），为您的账户增加额外的安全保护。

    *   检查您的社交媒体账户授权，限制外部应用程序的访问权限。

    *   在所有设备上使用 `VPN`，特别是在公共网络环境下。通过使用 `VPN`，您的流量和身份会被加密，使黑客难以破解您的互联网生活账户。这种技术是防止中间人攻击等其他威胁的可靠方法。

    *   避免使用局域网（LAN）和开放 Wi-Fi 进行社交媒体操作、在线银行以及发送重要或敏感信息。将任何公共或开放 Wi-Fi 视为社交黑客的乐场。

    *   检查您的社交媒体登录页的 URL，远离来自可疑或未知网页的链接。

    *   如果您发现自己的社交媒体账户被盗，请向您的社交网络平台报告此入侵行为，以便阻止攻击扩散。您应该提醒亲友防范诈骗。


    # 系统破解


    攻击者有几种不同的方式访问特定的框架，但无论何种方式，攻击者都需要滥用缺陷、漏洞甚至人为错误的能力。


    ## 攻击类型


    ### 1. 操作系统攻击

    攻击者扫描操作系统漏洞并对其进行滥用。此类模型包括漏洞（bugs）、缓冲区溢出和故障，以及未打补丁的工作框架。


    ### 应用层/预装代码攻击

    编程是一项困难的任务，有时会反复使用未绑代码来降低这种难度，例如使用现有的代码库。如果代码已经存在，为什么要重新发明一个已经解决的问题？这导致这些应用程序缺乏或完全没有错误检查，从而引发缓冲区溢出攻击、跨站脚本、`DoS`、SQL
    注入攻击、会话劫持、中间人攻击等。


    ### 配置错误攻击

    当对文档授权进行更改时，就会发生框架配置错误。在这种情况下，该记录或应用程序再无法被认为是安全的。管理员负责在设备发送到系统之前更改其设置和最高权限。未能做到这一点会导致攻击者利用默认设置来攻击框架。


    ### 2. 密码破解

    使用不同的程序和工具从 PC 框架中恢复密码。黑客可以利用这些工具增加对漏洞框架的未经授权访问。这些方法中很大一部分之所以有效，是因为密码薄弱或易于猜中，例如字典单词或默认密码。此类密码破解方法包括字典攻击、混合攻击、组合攻击、音节攻击和基于规则的攻击。令人震惊的是，最近已记录了许多非专业的密码破解程序，例如窥视偷窥（shoulder
    surfing）、社会工程和垃圾桶翻找。


    ### 3. 间谍软件/键盘记录器

    指专门隐藏的程序或设备（编程或设备），用于在不告知用户信息的情况下记录客户端与框架的交互。不同类型的间谍软件包括：截屏间谍软件、`USB` 间谍软件、儿童监控间谍软件、视频间谍软件（秘密记录摄像头和视频聊天内容，攻击可以通过网络或手机远程查看）、声音/手机间谍软件、GPS
    间谍软件（利用全球定位框架确定车辆、个人或其连接/引入的资产区域），甚至是打印间谍软件。


    ### 4. 病毒/木马/蠕虫

    通常是指框架上的恶意软件实例、未经请求的代码或程序，这些程序在很大程度上考虑了信息泄露、黑客访问的次级通道访问或执行损坏框架的操作？这类恶意软件通常由恶意代码或可以攻击脆弱框架的设备和工具制作（只要程序员知道漏洞所在）。


    ### 5. Rootkits（根内核程序）

    指隐藏在工作框架内部的代码，它可以隐藏并掩盖恶意目的的迹象。具体来说，它将某些工作框架调用和工具替换为它自己的自定义版本。从此，攻击者通过引入感染、木马、蠕虫或其他恶意软件获取框架的
    root 权限（某种执行级别），以便滥用。这使得攻击者能够保持对框架的隐藏访问。此类 rootkits 包括虚拟机级、内核级、应用级、设备/固件和启动加载程序级。


    ### 6. 信息隐术

    是一种将秘密信息隐藏在普通信息或文档中并在目标处移除以保持其隐藏身份程序。这种程序最常见的用法是黑客使用一张真实的图片，并在图片文件中插入代码来执行恶意操作。这隐藏了文档内部的信息。此类系统包括替换、域变换、覆盖生成、弯曲、统计和空域范围。除图片外的其他隐术方法还包括文件、视频和音频隐术。


    # 道德黑客及其目的


    在道德黑客过程中具有实践经验的人被称为道德黑客。他们是专家，通过破解框架或系统寻找潜在的缺陷、陷阱和漏洞，这些漏洞可能会被灰帽黑客或破解者滥用。道德黑客的能力和观点与具有恶意目标的黑客相当，但他们是值得信任的。道德黑客在对目标框架执行破解时经过认证和批准（“认证道德黑客
    - CEH | | EC-Council”）。道德黑客拥有合法权限访问目标的个人数据并调整目标框架。道德黑客掌握的能力可以用于限制网络犯罪。除了白帽黑客和黑帽黑客，还发现了另一类黑客，他们与道德黑客紧密合作，但面临某些社会后果。这些黑客被称为帽黑客，他们为了良好的目的（如帮助协会修复安全问题）破解专用和组织框架，但他们未经授权的。灰帽黑客执行道德破解，但他们未经授权的方法导致了社会认可。办公室、组织和协会聘请道德黑客来确保其安全符合标准。


    # 破解过程


    简而言之，由白帽黑客执行的道德破解是一个用于描述组织和协会防御性破解的术语，其中包括对计算机或系统潜在风险的区分证明。像任何伟大的工程一样，道德破解有很多特定的阶段。它使黑客进行组织的道德破解攻击。不同的安全手册以各种方式定义了道德破解的过程，但据我所知，整个过程可以分为以下六个阶段：


    1.  `Reconnaissance`（侦察）

    2.  `Scanning`（扫描）

    3.  `Access Gain`（获取访问）

    4.  `Maintain the Access`（维持访问）

    5.  `Clearing your Tracks`（清除踪迹）

    6.  `Reports`（报告）


