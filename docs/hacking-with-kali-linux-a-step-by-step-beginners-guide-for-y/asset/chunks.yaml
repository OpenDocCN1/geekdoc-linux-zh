    # 什么是密码学？


    密码学是利用科学对信息进行编码和解码的研究。密码学让你能够存储敏感数据，或在不确定的系统（如互联网）上进行交叉传输，其目标是让计划受益者之外的任何人无法读取。如果说密码学是验证信息的学科，那么密码分析就是研究检查和破解安全通信的。旧式的密码分析包含了解释性思维、数值工具的使用、设计发现、容错、保证以及运气，等有趣的组合。密码分析人员也被称为攻击者。


    对于通过开放系统进行的私密通信，密码学起着至关重要的作用。密码学的作用可以用图 8.1.1 所示的密码学基本模型来表示。通过不稳定介质发送的消息称为`plaintext`（明文），它在通过介质发送之前会被加密。加密后的称为`ciphertext`（密文），在介质的另一端获取并解码还原为原始`plaintext`。在练习中，我们将讨论不同的密码计算，这些计算可以分为两个大类——对称密钥加密和公钥加密。依赖对称密钥加密的加密算法显示在第
    8.1.2 节。公钥加密在 Sec.![](img/rsrc1PX.jpg) 中讨论。


    ## 对称密钥加密


    该图是一种用于将`plaintext`转换为`ciphertext`的算法，它基于一个`key`（密钥），密钥本质上是一个特殊产生的数字（数值）。为了解密秘密消息（`ciphertext`）以还原原始消息（`plaintext`），解码计算使用`decrypt
    key`（解密密钥）。在对称密钥加密中，共享同一个密钥，例如如图 8.1.2 所示，加密和解码都使用相同的密钥。用于解密的计算仅是加密算法的反过程。例如，如果加密使用扩展和除法，那么解密时将使用加法和减法。


    对称密钥加密算法简单，执行时间较短。因此，它们通常用于长消息。然而，这些算法面临相应限制带来的负面影响：需要大量的特殊密钥。例如，对于`n`个客户端，所需的密钥数量为`n(n-1)/2`。以安全的方式在客户端之间分配密钥是非常困难的![](img/rsrc1PY.jpg)


    ## 公钥加密


    在公钥加密中，有两个密钥：`private key`（私钥）和`public key`（公钥）。公钥向公众宣布，而`private key`由所有者保留。发送者使用接收者的`general
    public key`进行加密，所有者使用自己的`private key`进行解密。公钥加密的主要优势是允许没有事先安全计划的人员安全地交换消息。消除了发送者和受益者通过某些安全通道共享秘密密钥的需求；所有通信仅包含公钥，且永远不会传输或共享`private
    key`。


    公钥加密系统的几个实例包括`Elgamal`（以其设计者 Taher Elgamal 命名）、`RSA`（以其发明者 Ron Rivest、Adi Shamir
    和 Leonard Adleman 命名）、`Diffie-Hellman`（当然，以其创建者命名）以及`DSA`，数字签名算法（由 David Kravitz
    开发）。![](img/rsrc1PZ.jpg)


    由于传统密码学曾是传输秘密数据的唯一可用方法，安全通道和密钥分发的成本使得其使用仅限于能够负担这些成本的个人，例如政府和大型银行（或带有秘密解码环的小孩）。公钥加密是为大众提供强有力密码学的创新变革。还记得那个手腕上系着锁链文件夹的信使吗？公钥加密让他失业了（对他来说可能是松了口气）。


    ## 密码学是如何工作的？


    密码算法（或图）是加密和解码过程中使用的科学函数。密码算法与一个`key`（一个单词、数字或表达式）配合工作，对`plaintext`进行加密。相同的`plaintext`通过不同的密钥加密为不同的`ciphertext`。加密信息的安全性完全取决于两个因素：密码算法的质量和`key`的机密性。密码算法除了每一个可能的密钥和每一个使其运行的约定外，还包含包含一个密码系统。`PGP`就是一个密码系统。


    ## 什么是代理服务器？


    代理或代理服务器是位于网络和你的电脑或智能设备之间的服务器，在你的网络流量中充当经纪人。它充当了`IP 混淆器`；它向你访问的网站隐藏你的`IP`，并显示代理服务器的`IP`，这样你的在线活动看起来就像是来自其他地方。


    例如，假设你物理位于英国，你需要访问一个地理限制仅供物理位于纽约市的人访问的网站。你可以使用位于纽约市的代理服务器来连接并访问该地理限制网站的内容。该网站不会看到你真实的`IP
    address`；它只会观察你代理服务器的`IP address`，并认为你正在不受限制的地理区域浏览其内容。


    代理服务器经常用于低风险任务，例如绕过基于 IP 的服务的限制、绕过内容过滤器或访问地区限制的内容。在任何情况下，代理服务器都不包含其他安全措施；它们能做的只是隐藏你的`IP`或将其替换为别处的
    IP，并解锁封 IP 的网站。此外，由于它们没有使用其他安全措施，任何人都可以窥探你的连接并访问通过的数据。


    最后，代理服务器无法渗透整个框架或设备；它只是在应用层工作。这意味着整个框架不会通过代理服务器与网络交互；你需要设置特定的应用程序通过代理与网络连接。有多种类型的代理；最广为人知的包括：


    1.  WEB（或 HTTP）代理


    这种代理专门为基于网络的流量设计。它允许你通过使用程序扩展或将中间服务器连接到互联网浏览器的设置中与代理服务器交互，从而将整个网络流量通过代理路由。这种代理通常是免费且易用的。然而，大多数
    HTTP 代理无法处理复杂的网站或处理运行 Java、JavaScript 和 Flash 的网站。此外，它不会加密你的网络流量，因此当你访问任何敏感 Web
    管理（如你的银行或电子邮件）时，你需要为自己提供加密。在这种情况下，当你使用 Web 代理连接敏感 Web 管理时，请确保你使用启用 SSL 的程序访问支持
    SSL 加密的网站。


    2.  SOCKS 代理


    '
