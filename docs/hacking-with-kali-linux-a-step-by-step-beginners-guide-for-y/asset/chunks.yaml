    \ security (shroud your IP) for simple internet browsing\n\n## THE DRAWBACKS OF\
    \ PROXIES\n\n* The proxy server owner will realize your genuine IP address\n*\
    \ Most proxies have no encryption; this implies somebody can catch the data coursing\
    \ through your association\n* Finding out who is running a proxy is troublesome,\
