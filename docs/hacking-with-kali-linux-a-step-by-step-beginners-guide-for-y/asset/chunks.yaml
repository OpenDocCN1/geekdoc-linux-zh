    - [保护你的计算机和网络免受恶意攻击的方法]\n- [9. 结论]\n\n黑客通常是指未经授权中断系统或电脑；通常由至少一个“黑客”完成。然而，黑客可以是任何人。他们可以是像你我这样的个人。他们可以单独工作，也可以被有动机干扰某些事情或毫无制造混乱的协会利用。通常，他们希望通过改变安全框架来实现自己的目标，而这些目标与框架背后的真实动机不同。还有许多协会聘佣黑客作为员工的一部分。这些黑客利用他们的技能发现协会安全框架中的缺陷、脆弱区域和弱点。这样做是为了发现并修复缺点，并防止恶意黑客入侵安全框架。\n\
    \n## 世界各地的黑客类型\n\n### 1. 白帽黑客\n首先，我们有一种理想的黑客类型来打破刻板印象。白帽黑客是一个英雄，尽管听起来可能很有趣。白帽黑客、白帽黑客或道德黑客是指测试现有网络基础以寻找漏洞的个人。将这想象成一把开锁器，他可能会绕过锁具，只是为了建议所有者如何改进锁具。事实证明，白帽黑客在确保大型公司保持领先地位方面至关重要。从政府代表到私人专家，白帽黑客帮助网络变得更更好、更安全。这与黑帽黑客完全不同，道德黑客使用安全系统并寻找框架中的漏洞，目标是在这些漏洞被恶意娱乐者利用之前对其进行修复。像\
    \ Facebook、微软和 Google 这样的财富 500 强组织也使用了白帽黑客。\n\n### 2. 黑帽\n基本上，这些人是麻烦制造者。黑帽黑客对黑客行为所有不当行为负责。这些人仅仅出于负面目的入侵框架。从获取信用卡数据到调整开放数据库，黑帽黑客希望通过滥用网络结构中的漏洞来获得名声或财务利益。著名的黑帽黑客曾抢劫了银行和金融机构的大量资金和重要的私人信息。\n\
    \n### 3. 灰帽黑客\n灰帽黑客通常有混合的。正如颜色代码所暗示的，这种类型的程序员既没有白帽黑客的诚实目标，也没有黑帽的邪恶意图。灰帽会入侵框架，但绝不是为了他们自己的利益。著名的灰帽黑客滥用框架只是为了让数据公开，并凸显包含不良行为的大量数据集。这种黑客类型是互联网上最常见的类型。最广为人知的入侵通常是黑帽和灰帽类型的，但由于没有带带大写字母标签的显著个人成员，灰帽赢得了作为“真正的坏蛋”的桂冠。\n\
    \n### 4. 脚本小子 (SCRIPT KIDDIE)\n在许多种电脑黑客中，脚本小子是新手。作为黑客领域的孩童，这种黑客类型对大量的损害不负责，特别是由于他们在进行黑客攻击时投入的技能或精力很少。通过下载黑客代码或预编译的内容，这些黑客只需针对某个产品运行网站并干扰其工作。从引导过载流量或多次运行交换程序，这种黑客类型的影响值得注意，但并不显著。\n\
    \n### 5. 自杀式黑客 (SUICIDE HACKER)\n\n"
