    $120 \div 14" = 8⅛ (width)


    $250 \div 14" = 17⅞ (height)


    Finished size = 8⅛ x 17⅞


    # Securing Floss


    Insert needle up from the underside of the fabric at starting point. Hold 1" of
    thread behind the fabric and stitch over it, securing with the first few stitches.
    To finish thread, run under four or more stitches on the back of the design. Avoid
    knotting floss, unless working on clothing.


    Another method of securing floss is the waste knot. Knot floss and insert needle
    down from the top right side of the fabric by 1" from design area. Cut off the
    several stitches over the thread to secure.


    # Preparing Fabric


    Cut fabric at least 3" larger on all sides than the finished design size to ensure
    enough space for desired assembly. To prevent fraying, whipstitch or machine-zigzag
    along the raw edges or apply liquid prevent.


    # Carrying Floss


    To carry floss, weave floss under the previously worked stitches on the back.
    Do not carry any fabric that is not or will be stitched. Loose threads, especially
    dark ones, will show through the fabric.


    # Needles for Cross-stitch


    Blunt needles slip easily through the fabric holes without piercing or stretching
    threads. For fabric with 11 or more threads per inch, use a tapestry needle #24;
    for 14 threads per inch, use a tapestry needle #24, #26, or #28; for 18 or more
    threads per inch, use a tapestry needle #26 or #28. Avoid leaving the needle in
    the design area of the fabric. It may leave rust or a permanent impression on
    the fabric.


    # Cleaning Finished Design


    When stitching is finished, soak the fabric in water with a mild soap for ten
    to minutes. Rinse well and roll in a towel to remove excess water. Do not w. Place
    the piece face down on a dry towel and iron on a warm setting until the fabric
    is dry.


    # Floss


    All numbers and color names on codes represent the DMC brand of floss. Use 18"
    lengths of floss. For best coverage, separate the strands and dampen with a wet
    sponge. Then recombine the number of strands required for the fabric used.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_124_0.png)


    # Centering Design


    Fold the fabric in half horizontally, then vertically. Place a pin in the fold
    point to mark the center. Locate the center of the design on the graph. Begin
    stitching all at the center point of the graph and fabric.


