  md: '# Say it in cross-stitch!


    Choose from 555 little sayings and pretty motifs whenever you have a cross-stitch
    project, and everyone will know that your feelings come straight from the heart.
    Are you embellishing towels for newlyweds? Designing ornaments for the Christmas
    tree? Creating a framed picture to celebrate Mother''s Day? Whether it''s a gift
    for someone special or a decoration to enliven your home, these patterns will
    enhance it.


