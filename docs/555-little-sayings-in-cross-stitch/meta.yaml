    ## 关于作者


    玛丽·巴伯（Marie Barber）出生并成长于瑞典的克里斯蒂安斯德，现与丈夫和三个孩子住在阿拉罗巴马州拉格兰的库萨萨河畔。


    玛丽说，她一直很喜欢绘画和插画。14岁时，她是她在已故的 Göran Trönnberg 博士指导下学习油画的最年轻学生。


    她于1983年作为交换生来到美国，并在1987年在被亚特兰达艺术学院录取后回到。她曾担任一家瑞典周刊物的自由小说插画师，她的作品曾在阿拉罗巴马州的 Loretta
    Goodwin 画廊展出。尽管探索过多个艺术领域，但玛丽说她在1993年开始设计十字绣时发现了自己的热情。


