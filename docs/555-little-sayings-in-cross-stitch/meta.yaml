  md: '# Algerian Eye Stitch (AE)


    # Cross-stitch (XS)


    Stitches are done in a row, or if necessary, one at a time in an area.


    +   1. Insert needle between woven threads at A.


    +   1. Insert needle between woven threads at A.


    +   2. Go down at B. Continue around center seven times, bringing needle down
    through center each time.


    +   2. Go down at B, the opening diagonally across from A.


    +   3. Come up at C and go down at D, etc.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_0.png)


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_1.png)


    +   4. To complete the top stitches creating an "X", come up at E and go down
    at B, come up at C and go down at F, etc. All top stitches should lie in the same
    direction.


    # Backstitch (BS)


    +   1. Insert needle between woven threads at A.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_2.png)


    +   2. Go down at B, one opening to the right.


    +   3. Come up at C.


    +   4. Go down at A, one opening to the right.


    # Eyelet Stitch (ES)


    +   1. Insert needle between woven threads at A.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_3.png)


    # Bead Attachment (BD) and Treasure Attachment (TR)


    Beads and treasures should facing the same direction as the top-stitch.


    +   2. Go down at B (center). Continue around center sixteen times, bringing needle
    through center each time.


    +   1. Make first half of a cross-stitch.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_4.png)


    +   2. Insert needle between woven threads at A.


    +   3. Thread one bead before going down at B, the opening diagonally from A.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_5.png)


    +   4. To strengthen stitch, come up again at A and either go through bead again
    or split threads to lay around bead and go down at B.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_125_6.png)'
