  md: '# General Instructions


    # Thread Descriptions


    Embroidery floss is a stranded cotton and the most versatile thread available.

    Overdyed floss is Egyptian cotton, overdyed by hand, creating a subtle shaded
    effect.

    Waterlies floss is a 12-ply-dyed silk with subtle sheen.


    # Introduction


    Contained in this book are 555 counted cross-stitch sayings. To create your own-of-a-kind
    sayings, vary colors in graphic designs.


    # Fabric for Cross-stitch


    Where overdyed floss, silk, or specialty threads have been used, a solid color
    DMC floss has been selected and listed as an acceptable design alternative.


    Counted cross-stitch is woven on even-weave fabrics. These fabrics are manufactured
    specifically for counted-thread embroidery, and are woven with the same number
    of vertical as horizontal threads per inch.


    Because the number of threads in the fabric is equal in each direction, each stitch
    will be the same size. The number of threads per inch in even-weave fabrics determines
    the size of a finished design.


    +   The threads listed above are distributed by the following:

    * Anchor (Embroidery floss), 30 Mathews Dr., Greenville, SC 29615

    * DMC Corporation (Embroidery floss and Metallic floss), 10 Port Kearney, South
    Kearney, NJ 07032

    * Kreink Manufacturing Company, Inc. (Silk floss), 3106 Timanus Lane, Suite #101,
    Baltimore, MD 21244

    * Needle Necessities, Inc. (Overdyed floss), 7211 Garden Grove Blvd., Suite B/C,
    Garden Grove, CA 92841

    * Caron Collection (Waterlies and Watercolors), 67 Polish St., Bridgeport, CT
    06605


    # Number of Strands


    The number of strands used per stitch varies, depending on the fabric used. Generally,
    the rule to follow for cross-stitching is three strands on Aida 14, one or two
    on Aida 18 (depending on desired thickness of stitches), and one strand on Hardanger
    22.


    For basting, use one strand on all fabrics unless specified. When completing a
    French Knot (FK), use two strands and one wrap on all fabrics, unless otherwise
    directed.


    # Finished Design Size


    To determine the size of the finished design, divide the stitch count by the number
    of threads per inch of fabric. When designing, divide stitch count by half the
    threads per inch. For example, a design with a stitch count of 120 width and 250
    height was stitched on a 28 count


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_123_0.png)


    Simple Pleasures

    122'
