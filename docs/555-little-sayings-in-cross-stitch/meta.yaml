  md: '# French Knot (FK)


    1. Insert needle between woven threads at A, using two strand of floss.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_126_0.png)


    2. Loosely wrap floss around needle.


    3. Go down at B, the opening across from A. Pull floss taut as needle is pushed
    through fabric.


    4. Carry floss across back of work between knots.


    # Long Stitch (LS)


    1. Insert needle between woven threads at A.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_126_1.png)


    2. Go down at B, crossing two threads. Pull flat Repeat A-B for each stitch. Stitch
    may be horizontal, vertical, or diagonal as indicated in Examples 1, 2, and 3.
    The length of the stitch should be the same as the length indicated on the graph.


    # Satin Stitch (SS)


    # Half-cross Stitch (HC)


    Stitches are done in a row horizontally from the left to the right.


    1. Insert needle between woven threads at A.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_126_2.png)


    2. Go down at B, the opening diagonally from A.


    2. Go down at B, forming a straight stitch.


    3. Come up at C and down at D, etc.


    3. Come up at C and go down at D, forming another smooth straight stitch that
    sits closely to the first stitch, covering the area.itches should not overlap.


    # Lazy Daisy Stitch (LD)


    1. Insert needle between woven threads at A.


    ![](img/0a7014b323406aa8c1dc3ac3a190924c_126_3.png)


    2. Go down at B, using same opening as A.


    3. Come up at C, crossing under two threads. Pull through, holding floss under
    needle to form loop.


    4. Go down at D, crossing one thread.


    4. Repeat to fill design area.


    # Silk Thread Tips


    +   - Strands should be 12"–15" in length.

    - Color variation between blends and bleeding of thread onto fabrics is common
    with silk thread.

    - Silk thread can be combined with cotton thread in the same piece.

    - When using variegated strands, each stitch as is made rather than crossing the
    stitch on the back across a row.

    - Silk cross-stitched pieces should be dry-cleaned rather than hand-washed.'
