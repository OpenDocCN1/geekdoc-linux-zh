  md: '# # About the Author


    Marie Barber, born and raised in Kristianstad, Sweden, now lives in Ragland, Alabama,
    on the Coosa River with her husband and her three children.


    Marie says she has always loved to draw and illustrate. At the age of 14, she
    was the youngest student to study oil painting under the instruction of the late
    Dr. Göran Trönnberg.


    She came to the United States in 1983 as an exchange student, and in 1987, returned
    after being accepted to the Art Institute of Atlanta. She has freelanced as a
    novel illustrator for a Swedish weekly publication and her artwork is featured
    at Loretta Goodwin''s Gallery in Birmingham, Alabama. Although she has explored
    several avenues of the art world, Marie says she found her passion in 1993 when
    she began designing cross-stitch patterns.


