    ## Algerian Eye Stitch (AE)


    ## Cross-stitch (XS)


    Stitches are done in a row, or if necessary, one at a time in an area.


    - 1. Insert needle between woven threads at A.

    - 1. Insert needle between woven threads at A.

    - 2. Go down at B. Continue around center times, bringing needle down each time.

    - 2. Go down at B, the opening diagonally across A.

    - 3. Come up at C and go down at D, etc.

    - 4. To complete the top stitches creating an "X", come up at E and go down at
    B, come up at C and go down at F, etc. All top stitches should lie in the same
    direction.


    ## Backstitch (BS)


    - 1. Insert needle between woven threads at A.

    - 2. Go down at B, one opening to the right.

    - 3. Come up at C.

    - 4. Go down at A, one opening to the right.


    ## Eyelet Stitch (ES)


    - 1. Insert needle between woven threads at A.


    ## Bead Attachment (BD) and Treasure Attachment (TR)


    Beads and treasures should facing the same direction as the top stitch.


    - 1. Make first half of cross-stitch.

    - 2. Insert needle between woven threads at A.

    - 3. Thread one bead before going down at B, the opening diagonally from A.

    - 4. To strengthen stitch, come up again at A and either go through bead again
    or split threads to lay around bead and go down at B.


    ## French Knot (FK)


    - 1. Insert needle between woven threads at A, using two strand of floss.

    - 2. Loosely wrap floss around needle.

    - 3. Go down at B, the opening across from A. Pull floss taut as needle is pushed
    through fabric.

    - 4. Carry floss across back of work between knots.


    ## Long Stitch (LS)


    - 1. Insert needle between woven threads at A.

    - 2. Go down at B, crossing two threads. Pull flat Repeat A-B for each stitch.
    Stitch may be horizontal, vertical, or diagonal as indicated in Examples 1, 2,
    and 3. The length of the stitch should be the same as the length indicated on
    the graph.


    ## Satin Stitch (SS)


    ## Half-cross Stitch (HC)


    Stitches are done in a row horizontally from the left to the right.


    - 1. Insert needle between woven threads at A.

    - 2. Go down at B, forming a straight stitch.

    - 3. Come up at C and go down at D, forming another smooth straight stitch that
    sits closely to the first stitch, covering the area. Stitches should not overlap.


    ## Lazy Daisy Stitch (LD)


    - 1. Insert needle between woven threads at A.

    - 2. Go down at B, using same opening as A.

    - 3. Come up at C, crossing under two threads. Pull through, holding floss under
    needle to form loop.

    - 4. Go down at D, crossing one thread.

    - 4. Repeat to fill design area.


    ## Silk Thread Tips


    - Strands should be 12"–15" in length.

    - Color variation between blends and bleeding of thread onto fabrics is common
    with silk thread.

    - Silk thread can be combined with cotton thread in the same piece.

    - When using variegated strands, each stitch as is made rather than crossing the
    stitch on the back across a row.

    - Silk cross-stitched pieces should be dry-cleaned rather than hand-washed.


