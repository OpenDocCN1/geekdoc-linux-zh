    In the following example, the owner of the file assigns read and write permission
    to a specific user who does not belong to his group.


    ```bash

    ls -l fich1.txt

    -rw-r ----- 1 usu1 group1 11776 2010-01-27 19:20 fich1.txt

    group add usu2

    usu2: group2

    setfacl -m user: usu2: rw fich1.txt

    ls -l fich1.txt

    -rw-r ----- + 1 usu1 group1 11776 2010-01-27 19:20 fich1.txt

    getfacl fich1.txt

    # file: fich1.txt

    # owner: usu1

    # group: group1

    user :: rw-

    user: usu2: rw-

    group :: r--

    other :: r--

    ```


    In this other example, a compound order is used to copy the ACL from one file
    to another.

    ```bash

    getfacl fich1 | setfacl --set-file = - fich2

    ```


    ## Environment Settings


    The errand interpreter of each user account has its own operating environment,
    which includes a series of configuration variables. The system administrator will
    assign some variables for the execution environment common to each group of users
    or all of them, while each user can customize some of these features in their
    input profile, adding or modifying those variables that the manager has not defined
    as read-only.


    To create the global environment, the administrator creates a common input profile
    for all users (file `/etc/bashrc` in the case of `BASH`), where - among other
    tasks - the system variables are defined and the configuration files are executed,
    one for each application. These small programs are located in the `/etc/profile.d`
    subdirectory; there must be files of the command interpreters based on Bourne''s
    (`BSH`, `BASH`, `PDKSH`, etc.), with extension `.sh`, and others for those based
    on interpreter C (`CSH`, `TCSH`, etc.), with extension `.csh`.


    The user connection process is completed with the execution of the user''s personal
    input profile (file `~/.bash_profile` for `BASH`). Although the administrator
    must provide a valid profile, the user can tweak it at his convenience. The reader
    can go to the documentation of the training courses on Advanced Programming in
    Shell for more information on the most important environment variables.


    ## Account Management


    Modern Linux systems (and desktop environments) offer graphical management tools
    to perform common system administration tasks, including their own set of applications
    for user and group management. With this type of program, the simplest operations
    of revision and control can be executed, but they are quite poor to perform an
    automated and advanced administration of user accounts.


    The operating system also offers a series of management mandates, which must be
    used to customize and automate the process of creation, review and elimination
    of users and groups. The following table describes these functions.


    | Mandate | Description |

    | :--- | :--- |

    | `useradd` | Create a new user account. |

    | `usermod` | Modify the parameters of an account. |

    | `userdel` | Delete a user account. |

    | `passwd` | Modify the password to an account. |

    | `chpasswd` | Change the password to several users using a data entry file. |

    | `chage` | Change the temporary restrictions of an account. |

    | `chfn` | Change the user description. |

    | `chsh` | Change the account interpreter for the account. |

    | `groupadd` | Create a new user group. |

    | `groupmod` | Modify the parameters of a user group. |

    | `groupdel` | Delete a user group. |

    | `gpasswd` | Change the access code to a private group. |


    ## Planning


    The management of user accounts is one of the most important aspects of administrative
    tasks, so the characteristics and needs of the users and the groups that are going
    to register in the system must be planned in detail. Fundamentally, the following
    previous operations must be performed before creating an account:


    * Create the different user groups, one for each set of tasks that users will
    execute, or one for each administrative role.

    * Define the global parameters of the system, such as restrictions for the creation
    of keys, the main method of access, the possibility of remote storage of accounts,
    etc.

    * Create the basic directory structure for the accounts, separating the subdirectories
    of each main group. Assigning Permissions is adequate, users with less privilege
    can be prevented from accessing reserved areas of other groups.

    * Define private lists where the administrator can verify the identity of each
    user, storing the basic data of each person and their associated account.

    * Create programs for account management, generating configuration files that
    automate the processes of creation, modification, review, expiration and deletion
    of users.


    ### Example: University Internship Server


    To illustrate the account management process, the following table describes, in
    summary, a structure that can be used in a university internship server, relatively
    similar to that existing in the Calculation Center of the E.T.S. of Computer Engineering
    from the University of New York, for example.


    | Mandate | Description |

    | :--- | :--- |

    | General restrictions for keys | Those defined earlier in this chapter. |

    | Creation of user groups | Create groups for administrators, normal students,
    final year students and professors. A group for each department. Define groups
    for students by course. |

    | Directory Structure | Private directory for the group of administrators. Private
    directory for teachers with private subdirectories for each department. Directories
    for normal students grouped by courses and for project students. Directory for
    notes, with writing permits for teachers and reading for students. |

    | Create user lists | Generate a different list for each user group. |

    | Management Programs | Creation of configuration profiles for programs where
    default information is stored for each type of user and for the generation of
    selection menus. Interactive account creation using these profiles. Automatic
    creation of several accounts using an input data file. User data check; showing
    the contents of the corresponding list, the entry of the `/etc/passwd` file, the
    account directory, the expiration date and the disk quota. Concordance check between
    user list data and created accounts. Registration of disk quotas and weekly verification
    of their status. Checking the expiration of accounts. Automatic account renewal.
    Automatic deletion of expired accounts. Interactive deletion of accounts and their
    directories. Record of incidents about blocking and unlocking accounts. Automatic
    password change. |

    '
