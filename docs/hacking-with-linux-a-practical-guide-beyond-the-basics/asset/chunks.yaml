  trans: "\n\n-   **User (用户)**：创建文件的人。即 `File` 的所有者。\n- **Group (组)**：这是一个将多个用户聚集在一起的类别。每个用户可以是一个或多个组的一部分，允许访问对应组的文件。默认情况下，初始用户组与你的用户名相同。组\
    \ ID 称为 `gid` (group id)。\n- **Other (其他)**：指不属于文件所有者或特定组的用户的类别。\n\n所有者、组和其他用户的访问权限是相互独立的，因此允许有不同的访问级别。`root`\
    \ 账户也称为超级用户。这是一个没有安全限制的登录账户。`root` 账户应仅用于系统管理。操作系统时，请使用普通用户账户代替 `root` 账户。避免使用\
    \ `root` 权限的原因之一是很容易对系统造成不可逆的损坏。\n\n### 会话、登录、密码、注销\n在 Linux 上，系统通过登录名和密码进行登录，其中登录是用户名，密码是安全密码。登录后，用户进入其账户并打开一个会话，他们在其中直接与\
    \ `Shell` 交互。注销（以清除账户）通过 `exit` 命令完成。\n\n### 虚拟控制台\n终端（或控制台）是连接到计算机的键盘和显示器。Linux\
    \ 利用其多用户功能，主要使用“虚拟终端”。虚拟终端是与其他完全独立的第二个工作会话，可以在本地计算机上访问，也可以通过 `telnet`、`rsh`、`rlogin`\
    \ 等远程访问。\n\n在 Linux 模式下，你可以按住 `<ALT>` 键按下 `<F1>` 到 `<F6>` 来访问其他虚拟终端。每个功能键对应一个从\
    \ 1 到 6 的终端号（第 7 个由图形环境 `X` 默认使用）。Linux 拥有超过 63 个虚拟终端，但出于节省内存的考虑，最初只有 6 个可用。如果你使用图形模式，必须在按住\
    \ `<CTRL>` + `<ALT>` 的同时按下 `<F1>` 到 `<F6>` 之间的键。\n\n一个实际示例：如果你正在 `Terminal 1`\
    \ 中以任何身份使用系统，并想以 `root` 身份登录安装程序，只需打开一个虚拟终端并执行所需任务即可。\n\n### 文件系统\n文件是 UNIX 的核心，这在其他操作系统中是找不到的。命令是可执行文件，通常位于目录树中可预测的位置。系统权限和许可很大程度上通过文件控制。`I/O`\
    \ 设备和 `I/O` 文件在最高层上是不区分的。甚至进程间的通信也是通过类文件实体进行的。所有系统安全很大程度上取决于文件和用户账户上设置的所有权和保护措施的组合。\n\
    \n### 分级系统、目录树、分支结构\nUNIX 具有分级的目录组织结构，格式被称为文件系统。该树的基础是一个被称为 `root directory`（根目录）的目录。在\
    \ UNIX 系统上，所有可用磁盘空间都合并到 `/` 下的单一目录树中，文件所在的物理位置不受 UNIX 规范。\n\n### 基本文件类型：普通文件、目录\n\
    文件是记录数据的地方。文件可以包含文本、歌曲、程序等。每个 UNIX 系统至少识别三种文件类型：\n\n ** **普通文件 (Common Files)**：用于存储数据。用户可以直接向普通文件追加数据（例如通过编辑器）。可执行程序也存储为普通文件。\n\
    - **目录文件 (Directory Files)**：目录文件包含一个文件列表。列表中的每个条目由两部分组成：文件名和指向磁盘上实际文件的指针。另一方面，目录的行为与普通文件完全一样，只是用于处理普通文件的某些命令不适用于目录文件。\n\
    - **特殊文件 (Special Files)**：这些文件用于引用终端、打印机、磁盘等物理设备。它们像普通文件一样被读取和写入，但这种关联会导致连接到它的物理设备激活。\n\
    \nLinux 是区分大小的，这意味着在文件中也是区分大小的。目录与任何其他文件一样，也是区分大小的。在同一个目录中，不能有两个同名的文件，也不能有与子目录同名的文件。Linux\
    \ 上的目录由 `/` 指定。\n\n注意：我们习惯看到格式为 `name.ext` 的文件名，其中 `ext` 是文件类型的扩展，例如 `.txt`、`.html`、`.doc`。但在\
    \ Linux 上，名称不必遵循此规则。可以由多种扩展组成，例如 `list.ord.txt`、`names.may.class`、`books.my.ord.txt`。\n\
    \nLinux 通过 `inodes` 组织你的系统。Inode 是描述和存储文件属性（包括位置）的磁盘数据结构。某些 字段包括：`user`、`group`、`file\
    \ type`（文件类型）、`creation time`（创建时间）、`access`（访问）、`mode`（修改）、`number of links`（链接数）、`size`（大小）和\
    \ `address on disk`（磁盘地址）。\n\n存在允许多个名称指向磁盘上单个文件的机制。这些机制就是 `links`（链接）。链接有两种：硬链接（或符号链接）或软链接。\n\
    \n- **硬链接 (Hard link)**：将两个或多个文件名关联同一个 `inode`。硬链接共享相同的数据块，同时作为独立的目录条目运行。\n- **软链接\
    \ (Soft link)**：这些指向文件系统中另一个文件名的指针。\n\n### 文件访问权限\nUNIX 系统提供了一种简单的方法来控制系统用户访问所有三种文件类型。这是为了允许或限制对重要系统文件的访问，并确保系统上每个拥有账户的用户的隐私。系统区分了三类用户。首先，每个文件都有一个所有者，由系统中的用户指定。所有者对随时访问该文件的限制或权限具有完全控制权。除了对文件的个人所有权外，一个或多个系统用户可以在组属性类型中共同拥有文件。不拥有该文件的用户如果属于具有相应权限的用户组，则他们可以访问它。然而，该用户无法限制或允许对文件的访问。不拥有文件且不属于最后一类（具有访问权限组）的用户被称为“其他\
    \ (others)”。\n\n- 所有者（由 `u`、`user` 指定）：创建文件的人。\n- 组（称为 `g`，来自 `group`）：该组由可以访问该文件的一个或多个用户组成。\n\
    - 其他（被他人称为 `o`）：指任何其他系统用户。\n\nUnix 系统还允许三种文件访问模式：读取、写入和执行。这三种访问模式相对逻辑化，但这三种模式的含义对于目录文件来说是不同的。具有读取权限的用户可以读取目录内容，例如使用\
    \ `ls` 命令。具有写入权限的用户可以使用某些特权程序向目录写入内容。创建或删除目录中的文件需要写入权限。用户必须对目录具有执行权限才能访问分配在那的文件。如果一个用户对目录中列出的普通文件具有读取和写入权限，但对该目录没有执行权限，系统将不允许其读取或写入该普通文件的内容。权限如上例所示的文件可以由所有者或任何其他人读取、写入或执行。在下例示例中，所有者可以读取和写入，其他人只能读取，而无人可以执行。\n\
    \n| 用户 | 组 | 其他 |\n| :--- | :--- | :--- |\n| r w - | r - - | r - - |\n"
