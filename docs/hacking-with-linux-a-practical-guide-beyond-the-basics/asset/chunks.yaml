    | apachewww-data | 48833 | HTTP hypertext service. |

    | sshdssh | 484111 | SSH secure connection service. |

    | users | 100 | 100 | Normal users. |

    | nobody | 99 | 65534 | Service control. |

    | squidproxy | 23 | 13 | Representative service. |


    You will see the execution of tools for basic user management such as `users-admin`
    of the GNOME 2.30 environment under Ubuntu 10.04 Lucid (left) and `system-config-users`
    of Fedora 13 (right).

    Dummy users, who manage the services offered by the computer, must have their
    account disabled to avoid a possible gateway for intruders. This is achieved by
    blocking the access code and assigning `/sbin/nologin` as the account''s interpreter.


    ## The Root User Defined by Default


    Ubuntu and Fedora establish in their installation programs different policies
    to define the way to work by default with the superuser account (`root`).

    As can be seen in the previous section, in both cases the account has the same
    name and the same `UID` and `GID` parameters. However, the Fedora installation
    program asks to set a password for that user, while the Ubuntu one does not request
    it.

    Ubuntu does not allow direct connection to the system as `root`, and only users
    belonging to the `admin` group can execute privileged orders using the `sudo`
    command and entering their own password.

    The following table shows a summary of the differences between both operating
    systems defining the root account.


    | Characteristic | Ubuntu 10.04 | Fedora 13 |

    | :--- | :--- | :--- |

    | Password | No password | Defined in the installation |

    | Access to the system | No access | With access |

    | A user can execute orders as root | Order `sudo` (members of the admin group)
    | Sudo order not configured |

    | A user can run the root interpreter | Your `sudo` (members of the admin group)
    | your any user. |


    ## Password


    As indicated above, the keys of local Linux users are stored, encoded, in the
    inaccessible `/etc/shadow` file.

    The coding algorithms of the keys are "one-way", that is, they prevent the direct
    decoding of the keys. Therefore, when a user enters the system, the password is
    encrypted and compared with the valid encrypted key. If the result is correct,
    the user can connect.

    Linux can use the `Crypt` coding algorithm, used in the old Unix systems, and
    named for the C language function that performs the calculations. This method
    is insecure because it uses weak 56-bit encryption keys, and passwords can only
    have a maximum of 8 characters.

    The new Linux also supports more powerful coding algorithms such as `MD5` or `SHA`,
    much more robust and that allow. `MD5` uses 128 bits, while `SHA` - by default
    in Fedora 13 and Ubuntu 10.04 - increases this length.


    ## Restrictions to Have Secure Keys


    The administrator should recommend to their users that they create passwords that
    may be difficult to find out for hacker. It must also make the system create difficulties
    for the intruder, using complex encodings and creating restrictions that compromise
    the user. All users of the system must take into account the following recommendations
    with their passwords:


    - Do not use common words or numbers associated with the person.

    - Do not repeat the keys on different machines.

    - Use keys of at least 8 characters, with at least 2 non-alphabetic characters.

    - Do not use keyboard sequences.

    - Change the password periodically and do not repeat previous passwords.

    - Do not leave or write down the password.

    - Prevent another person from entering the password.


    ## Permissions


    One of the main elements of security in Unix is the proper use of permissions
    to access files and directories. Every user - not just the administrator - must
    be clear about the most basic concepts to prevent another user from reading, modifying,
    or even deleting data of interest.

    The administrator user - having full control of the system - can also perform
    operations on the files and directories of any user.

    We can divide the permit policy into three broad categories. The classification
    of these is as follows:


    1. Permissions applied to owner user (`Owner`)

    2. Permissions applied to the group (`Group`)

    3. Permissions applied to the other (`Other`) users of the system not contemplated
    in 1 or 2.


    According to these categories, we can apply to each of these three permissions:
    read (`r`), write (`w`), and execute (`x`). In particular:


    - `r`: indicates that the user has-read permission. You can execute read commands
    such as `ls`, `cat`, etc.

    - `w`: indicates that the user has to write permission. This will allow you to
    edit text files, for example.

    - `x`: indicates that you have execution permissions. You can run a script.

