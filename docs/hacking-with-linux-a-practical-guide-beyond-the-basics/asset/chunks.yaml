    # Journalctl


    Under `systemd`, the service responsible for collecting and storing messages from
    the kernel and other sources is called `journald`. A distinctive feature of `journald`
    is that it does not store information in plain text. On the contrary, it does
    so in a structured way in binary files within `/run/log/format/`. This makes it
    easy to identify relevant information quickly, although it requires the use of
    the external `journalctl` tool to interpret the logs.


    The advantage of the use of `journalctl` is that it allows us to centralize the
    administration and inspection of the various system logs (often dispersed in `/var/log`
    or in any of its subdirectories as we saw before) regardless of the process that
    originates them.


    For example, to display the messages originated by the `ssh` and `cups` units
    in Debian, we will use the `-u` (of unit) option. As we see below, we can repeat
    it as many times as we want:


    ```

    journalctl -u ssh -u cups

    ```


    If we want to have more context information, we will use the combined option `-xu`.
    This alternative will be particularly useful when the start of a `systemctl` service
    fails for some reason, giving us valuable information to find the source of the
    problem. To exit `journalctl`, we must press the `q` key.


    In addition, with `journalctl --boot`, we can access the data corresponding to
    a particular boot. The list of beginnings for which information is available can
    be seen by replacing `--boot` with `--list-boots`. The `-0` argument is used to
    indicate the booting indicated as 0:


    ```bash

    journalctl --list-boots # List of available starts

    journalctl --boot -0 | head -n 5 # First 5 lines

    journalctl --boot -0 | tail -n 5 # Last 5 lines

    ```


    To ensure that system boot logs are saved persistently, we must enable it as follows:


    ```bash

    mkdir /var/log/journal

    systemd-tmpfiles --create --prefix /var/log/journal

    systemctl restart systemd-journald

    ```


    Another way to configure the permanence of the logs is through the file `/etc/systemd/journald.conf`
    indicating `Storage = persistent` under the `[Journal]` section.


    # Chapter 11: Disk Quotas


    Storage is a resource that must be granted and carefully monitored, more especially
    on a Linux system used as a mail or web server, to name two examples. Apart from
    the problem that may not be able to save new files, a system with little available
    space will soon experience performance problems. For that reason, limits should
    be set per file system (more frequently called quotas for users and groups) to
    disk usage and the number of files that users can create.


    ## Previous Steps


    Before starting, it is important that we consider the following useful points
    (both are related to the two methods of quota allocation):


    - A disk block corresponds to 1 KB. A block fee would correspond to the total
    blocks that can be used in the system. Recall that the files are saved in disk
    blocks. In this way, a 100-byte file will occupy a block of 1 KB on the hard disk
    since the block is the smallest unit of fractionation.

    - An `inode` (or index node inode in English) is a number that acts as a pointer
    for the file system and indicates in which specific blocks of the disk the data
    of a file is found. Also, the `inode` in your reference stores information about
    permissions, owner, attributes, etc. It could be seen in a simple analogy that
    an `inode` is like a unique serial number for each system file, and through this
    number, the system retrieves its data (blocks) and its attributes (permissions,
    owner, dates, etc.).


    A fee for inodes would indicate the total number of `inodes` to which the user
    is entitled. In other words, one could say that this would represent the total
    files that the user can create. Keep in mind that this does not change the fact
    that users could still create symbolic links on existing files that do not increase
    the amount of inodes. Anyway, for simplicity, we can see it as `1 inode = 1 file`.


    The first step to enable quotas in a file system is to mount it with the `usrjquota`
    or `grpquota` options (for the user or group quotas, respectively) using a line
    in the `/etc/fstab` file. To illustrate, given the logical volumes `/dev/vgcareerlinux/lvadministrador`
    and `/dev/vgcareerlinux/lvredes` existing and previously formatted with `ext4`,
    let''s enable group quotas in the first and user quotas in the second.


    While we can specify in each `/etc/fstab` each logical volume (such as any storage
    device) through its device identification (`/dev/vgcareerlinux/lvadministrador`
    and `/dev/vgcareerlinux/lvredes` in this case), it is more prudent and stable
    to specify them through your `UUID`. Remember that we can find out this data using
    the `blkid` command followed by the identification of the formatted device:


    ```bash

    blkid /dev/vgcareerlinux/lvadministrator

    blkid /dev/vgcareerlinux/lvredes

    ```


    We will copy the `UUID` of each volume and insert the following lines in `/etc/fstab`
    with the help of the `echo` command:


    ```bash

    echo "UUID = 7457567b-28f3-46c5-9f92-d74780536188 /srv/admin ext4 defaults,grpjquota
    = aquota.group,jqfmt = vfsv0 0 0" >> /etc/fstab

    echo "UUID = 01be396e-1a2e-4070-87c9-4b41f0c091d0 /srv/networks ext4 defaults,usrjquota
    = aquota.user,jqfmt = vfsv0 0 0" >> /etc/fstab

    ```


    The mount options `usrjquota = aquota.user` and `grpquota = aquota.group` represents
    the files that keep user and group information within the root. The `jqfmt = vfsv0`
    enables the use of journaling with version 2. The next step is to disassemble
    (if they were already mounted; omit the following commands) and reassemble the
    file systems identifying them by their mount point as specified in `/etc/fstab`:


    ```bash

    umount /srv/admin

    umount /srv/networks

    mount /srv/admin

    mount /srv/networks

    ```


    Now we must ensure that the `usrjquota` and `grpquota` options are present at
    the output of the mount command. To be able to visualize the lines that are of
    interest, we will use `grep`:


    ```bash

    mount | grep vgcareer

    ```


    Finally, with the following commands we can initialize and enable disk quotas
    by users and groups (which will require that we have previously installed the
    quota package):


    ```bash

    quotacheck -avmug

    ls /srv/networks

    ls /srv/admin

    ```


    The first command will initialize the quota table and create the special files
    `aquota.user` and `aquota.group`. As for the options, these indicate:

    - `-a`: verifies all file systems.

    - `-u`: checks user fees.

    - `-g`: does the same for groups.

    - `-m`: prevents the system from being read-only.

    - `-v`: reports the operation as it progresses through visible messages in the
    terminal.


    Then, with `quotaon`, we will enable the functionality in the mentioned file systems.
    The use of `ls` will simply allow us to verify that the files containing the information
    of users and groups have been created.


    ## Set Quotas for Users and Groups


    Let''s now see how to set disk quotas by specific users and groups. We will use
    as an example a user called a student, to whom we will grant an initial quota
    of 10 MB (unreal, by the way, but it will suffice for our demonstrations) using
    the commanded `quota -u student`. Next, the quota configuration file for the student
    user will be opened with our default text editor. In it, we must place the following
    values, as we can see in the image:


    ```text

    /dev/mapper/vgcareerxyz-lvredes 0 9000 10000 0 15 25

    ```


    Let''s look at the meaning of each field:

    - **File system**: indicates the device in question.

    - **blocks**: represent the number of blocks of 1024 bytes (1 KB) used in the
    file system by the student user.

    - **soft**: the lower limit of blocks that the user can have before receiving
    a warning. If, after 7 days (grace period by default) after receiving it, no space
    has been released, the soft limit becomes hard.

    - **hard**: the upper limit of the use of the device. Above this value, you cannot
    continue writing on it until you free up space.

