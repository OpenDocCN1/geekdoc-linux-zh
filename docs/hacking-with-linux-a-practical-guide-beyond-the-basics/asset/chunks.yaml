    当向 CentOS 添加新软件库时，系统会要求我们确认是否要在设备上安装该软件库出于安全考虑提供的 GPG 密钥。有时，我们需要手动添加第三方软件库。通常，当我们想要安装比发行版官方仓库中提供的更新版本的程序时，就不得不使用此选项。为了说明，我们将在
    `/etc/yum.repos.d/mariadb.repo` 中添加以下软件库以安装最新稳定版本的 MariaDB。首先，在上述文件中添加以下行：


    ```ini

    # MariaDB 10.3 CentOS repository list - created 2018-06-08 00:28 UTC

    # [http://downloads.mariadb.org/mariadb/repositories/]

    [mariadb]

    name = MariaDB

    baseurl = [http://yum.mariadb.org/10.3/centos7-amd64]

    gpgkey=https://yum.mariadb.org/RPM-GPG-KEY-MariaDB

    gpgcheck=1

    ```


    手动添加的软件库配置文件必须以 `.repo` 结尾。这适用于 CentOS 类似的系统（在 `/etc/yum.repos.d` 中）以及 SUSE 家族发行版（在
    `/etc/zypp/repos.d` 中）。为了确保系统能够看到软件库中完整且更新软件包列表，我们必须将本地索引与其同步。在 Debian 及其衍生版中，我们通过
    `apt-get update` 实现，而在 CentOS 或类似系统中，我们使用 `yum makecache fast`。在 openSUSE 中，对应的命令是
    `zypper refresh`。在下一节中，我们将解释在从第三方软件库安装包之前需要采取的步骤。


    # Linux 软件包管理


    ## Debian 及其衍生版

    要安装 `.deb` 文件，我们将使用 `dpkg` 命令后跟 `-i` 或 `--install` 选项以及要安装的文件路径。例如，要安装当前工作目录下的
    `mipackage.deb`，我们将使用以下命令：


    ```bash

    dpkg -i mipackage.deb

    ```


    如果我们以后想使用较新的 `.deb` 文件安装同一程序的相同版本，可以使用之前的相同命令。另一方面，如果我们需要卸载它，将使用 `-r` 选项（也可以 `--remove`）或
    `-P`（`de --purge`），只需包含包名即可：


    ```bash

    dpkg -r mipackage

    ```


    `--remove` 和 `--purge` 的区别在于，后者会删除包以及在安装过程中可能创建的任何配置文件，而前者不会。最后，通过 `-l`，我们可以看到系统中所有安装的包列表。由于在这种情况下输出会非常多，建议使用较少的内容进行视觉化处理，或使用
    `tail`、`head` 或 `grep` 等工具进行过滤。


    ```bash

    dpkg -l | head

    ```


    另外两个非常有用的选项是 `--info` 和 `--contents`。前者允许我们查看相关包的信息，而后者将向我们显示包的内容（在这两种情况下，我们都必须指定要检查的
    `.deb` 文件的完整名称）：


    ```bash

    dpkg --info mipackage.deb

    dpkg --contents mipackage.deb

    ```


    与 `--contents` 类似，我们可以使用 `--listfiles`（在这种情况下我们只使用包名，不带 `.deb` 扩展名）来查看安装包时添加到系统的文件（无论通过
    `dpkg` 还是 `apt-get` 执行了什么操作，如下文所示）。


    为了确保安装程序时包含所有必要的依赖，我们可以使用 `apt-get` 包管理器代替 `dpkg`。相关的 `apt-cache` 工具对于查找软件库中的程序以及查看感兴趣程序的详细信息也有用。这两个工具（以及其他工具）都是
    APT（高级软件包工具）的一部分，它是 Debian 主要软件包管理系统。在 `/etc/apt/sources.list` 或 `/etc/apt/sources.list.d`
    中的文件中添加软件库后，让可用包列表与 Debian 仓库同步：


    ```bash

    apt-get update

    ```


    之后，我们可以使用 `apt-cache search mipackage` 将 `mipackage` 作为搜索模式；或者如果我们已经知道确切名称，可以使用
    `apt-cache show mipackage` 或 `apt-cache showpkg mipackage` 查看其详细信息，或者使用 `apt-get
    install mipackage` 进行安装。如果我们在之前的命令中添加 `-f` 选项，还可以完成任何之前通过 `dpkg` 执行但由于缺少依赖而未成功完成的安装。


    为了自动接受确认请求，我们可以在之前的命令中添加 `-y` 选项。当我们准备以某种方式自动化安装（或更新）时，这特别有用。这同样适用于 CentOS 等类系统中使用
    `yum install`。


    另一方面，如果我的包已经安装且我们想删除它，以下任何一个命令都可以实现目标：


    ```bash

    apt-get remove mipackage

    apt-get purge mipackage

    ```


    后者不仅会删除我的系统磁盘，还会对该程序相关的任何配置文件执行相同的操作。要将包更新到最新可用版本，我们将使用 `apt-get upgrade mipackage`。如果在之前的命令中省略包名，结果将是所有包都将更新到系统配置仓库中的最新版本。


    ## 重新配置软件包


    需要注意的是，在安装过程中，我们通常会有配置相关程序的选择。如果我们那时没有进行，稍后也可以使用 `dpkg-reconfigure` 工具进行配置。首先，我们可以使用
    `debconf` 命令后跟指定的包名来查看当前配置。让我们以 `keyboard-configuration` 包为例：


    ```bash

    debconf-show keyboard-configuration

    ```


    如果我们看到了想要的内容或发现有需要更改，现在是切换到 `dpkg-reconfigure` 的时候了。按照同样的示例，现在应该使用该命令：


    ```bash

    dpkg-reconfigure keyboard-configuration

    ```


    以便仅使用键盘进行相应的修改。使用这种方法配置已安装软件的优点是，避免了手动编辑文本文件。即使没有考虑到所有的选项，它也能为我们节省工作。


    `dpkg-reconfigure` 有用的另一个情况是将包的配置恢复到原始状态。如果我们犯了错误且在开始之前没有制作备份，此工具可以帮助我们摆离困境。只需接受向我们提供的默认选项，就能解决问题。


    ## CentOS 及类系统


    RPM（Red Hat 软件包管理器）是 Red Hat Enterprise Linux 以及 SuSE（以及衍生发行版，如 CentOS、Fedora
    或 OpenSUSE）默认使用的软件包管理器。它由 Red Hat 开发，后被其他发行版采用。我们可以说它由两个基本部分组成：

    1) `rpm` 命令，以及

    2) 本地数据库。后者包含已安装包的列表及其信息，位于 `/var/lib/rpm` 目录下。


    首先，以 `bc-1.06.95-13.el7.x86_64.rpm` 为例。我们可以从 CentOS 7 可用的包列表中下载相同的包。在文件名中，我们一眼就能看出以下数据：

    * 包名：`bc`

    * 版本：`1.06-95-13.el7`

    * 架构：`x86_64`


    通常，安装使用的是组合选项 `-Uvh` 或 `-Fvh` 而不是简单的 `-i`（或等效的 `--install`，也是有效的）。在前两个候选项中，第一个是安装或更新（视情况而定），而第二个只会安装包，如果已经存在之前的版本，则不会采取任何操作。为了方便起见，`-v`
    在安装期间显示包名，`-h` 输出一系列 `#` 以指示安装进度。这两者在我们一次性安装多个包时特别有用。


    要卸载之前通过 `rpm` 安装的包，我们将使用相同的工具，但这次使用 `-e` 选项后跟包名。没有必要包含此版本或架构。

    `rpm` 命令中其他在工具箱中非常有用的选项是（始终后跟 `-q`，查询）：


    '
- fmt: '

    - `-a`: shows the list of all installed packages.

    - `-l`: list of files installed by a given package.

    - `-ip`: view detailed information about a `.rpm` file that has not been installed.

    - `-f`: returns the name of the package that contains the file specified below.

    - `-Rp`: shows the list of package dependencies.


    In the result, we will see the following illustrated examples:


    - We check if the htop package is installed using `rpm -qa | grep htop`

    - We show the list of files added to the system as a result of installing htop
    with `rpm -ql htop`

    - We see the dependencies of the tuxpaint package using `rpm -qRp tuxpaint- 0.9.22-1.x86_64.rpm`


    To view, the full contents of a `.rpm` file use the `rpm2cpio` and `Cpio` as follows:

    ```

    rpm2cpio tuxpaint-0.9.22-1.x86_64.rpm | cpio -idv

    ```


    Despite how useful `rpm` is, perhaps the most practical way to install a specific
    program (if it is in the repositories of our distribution, or if the available
    version meets our needs) is to use the `yum` package manager. It contains all
    the necessary utilities to satisfy the required dependencies and configure the
    program already installed (in short, it saves us a lot of work!). Using this tool,
    we can:


    - Search for a package by keyword (mipackage, for example): `yum search mipackage`

    - See information about mipackage: `yum info mipackage`

    - Install it: `yum install mipackage`

    - Update to the latest available version: `yum update mipackage`


    As in the case of Debian with the `apt-get upgrade`, if, in this case, we omit
    the package name, all those present in the system will be updated.


    - Unpack it: `yum remove mipackage`

    - Find out in which package a specific command is included (for example, `mic`
    command): `yum whatprovides "* / mic command."`


    The `yum` configuration is in `/etc/yum.conf`. Although we can add repositories
    in this file, by neatness and order, it is preferred to do it through individual
    files (with the extension `.repo`) within the directory `/etc/yum.repos.d` as
    explained before.


    When we add a new repository to CentOS, we will be asked to confirm that we want
    to install the GPG key that the repository provides on our computer. Without this
    step, it will not be possible to download any package from that source.


    If, at any time, we are interested in reviewing `yum`''s activity, we can consult
    the log file (or logs) at `/var/log/yum.log`.


    Whether we add a third-party repository (as in the case of MariaDB before) or
    even in `/etc/yum.repos.d/CentOS-Base.repo`, we can use the `enabled` directive
    to indicate whether it should be enabled immediately or not. For example, we can
    see the configuration of the `centosplus` repository and note `enabled = 1`. This
    indicates that centosplus is enabled in the system.


    Because `centosplus` contains packages that are improvements for those present
    in the base repositories and updates, we may want to disable it on occasion so
    that they do not interfere with the latter. We can do this by editing the value
    of the directive to `enabled = 0` before doing `yum update` or indicating `yum
    update - disablerepo = centosplus`. The same applies if disabled, and we would
    like to enable it with `yum update --enablerepo = centosplus`.


    Enabling or disabling a repository through the command line takes effect only
    during the current transaction. To do this permanently, we must change the corresponding
    value in the `enabled` directive as we showed before.


    Fedora has started using a package manager called `dnf` for a couple of years
    (it was introduced with version 18 and became the default tool after 22). It is
    similar to the available `yum` options we have seen, although it is faster and
    consumes less memory than its predecessor. The Fedora project provides detailed
    documentation on DNF on its official site.


    ### SUSE Family

    These distributions, among which openSUSE stands out, also use the `rpm` tool
    to manage individual packages. In addition, they also have a complete package
    manager called `zypper`. Next, we will see the most common operations we can perform
    with `zypper`:


    - Refresh (update) repositories: `zypper refresh`

    - Search by keyword (apache in this case): `zypper search apache`

    - Information about a particular package: `zypper info apache2`

    - Installing a package: `zypper install apache2`

    - Update: `zypper update apache2`

    - Desintalación: `zypper remove apache2`

    - General help: `zypper help`

    - Help on a specific operation (install in this case): `zypper help install`

