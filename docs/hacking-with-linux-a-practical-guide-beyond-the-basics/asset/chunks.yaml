    # 第 7 章：深入理解 RAID\n\nRAID 是独立磁盘冗余阵（Redundant Array of Independent Disks）的缩写。它是一种存储解决方案，通过将两个或多个磁盘组合在同一个逻辑驱动器，以提供数据冗余和/或提高读写操作的性能。然而，这两个特性都取决于磁盘在所谓的\
    \ RAID 级别（可以被视为一种类型）中的组织方式。\n\nRAID 允许将整个磁盘组视为单个集合进行访问，即使底层有多个物理磁盘或分区。使用在线 RAID\
    \ 计算器，我们可以根据使用的 RAID 级别可视化阵列的容量，并确认其提供的容错能力类型。无论 RAID 级别如何，无论我们选择何种级别或实现它的存储技术可靠性如何，RAID\
    \ 阵列都不能替代适当备份策略的需求——即使它提供了数据冗余。\n\n## Linux 中的三种 RAID \n\n尽管根据我们需要有更多选项，但为了介绍该主题，我们仅介绍最常用的三种\
    \ RAID 级别：`RAID 0`、`RAID 1` 以及 `RAID 1+0` 或 `RAID 10`。在插图中，磁盘上写入的数据块标记为 `A1`、`A2`、`A3`\
    \ 等。\n\n### RAID 0\n也以英文名称 `stripe`（条带）闻（因为它将数据均匀地分布在两个或多个磁盘之间，如图所示），这种 RAID 级别提高了读取操作的性能，但不提供容错能力。它至少需要两个磁盘才能实现，结果的大小等于每个磁盘大小之和。\n\
    \n![](img/rsrc3J1.jpg)\n\n### RAID 1\n俗称为镜像（mirror），这种磁盘阵列通过同时在两个磁盘上写入数据（如图像所示）来提供数据冗余。这使得如果其中一个磁盘发生故障，另一个磁盘上仍有相同的信息。然而，由于数据必须写入两次，它会对写入性能产生负面影响。通过用新磁盘更换缺陷磁盘，可以重建该配置并将信息复制到其中。它至少需要两个磁盘才能实现，结果的大小等于最小磁盘。\n\
    \n![](img/rsrc3J7.jpg)\n正如我们在上图中看到的，数据块 `A1`、`A2`、`A3` 和 `A4` 被写入了两个设备中（因此使用了“镜像”一词来描述这种\
    \ RAID 级别）。\n\n### RAID 1+0\n也称为 `RAID 10`，这种 RAID 级别是前两种的一种“组合”：它由两个 `RAID 1`（镜像）阵列的\
    \ `RAID 0`（条带）组成，如下所示：\n\n![](img/rsrc3JE.jpg)\n正如预期的，这种配置同时提供了整体读写性能的提升和冗余，尽管它每个镜像最多允许一个磁盘故障。结果的大小等于两个\
    \ `RAID 1` 容量之和。\n\n## 创建软件 RAID \n\n在 Linux 中用于创建软件 RAID 的工具是 `mdadm`（multiple\
    \ disks admin 的缩写），如果还没有它，可以使用 `apt-get install mdadm` 进行安装。为了完成本节提到的示例，我们需要 4\
    \ 个分区的磁盘，我们这次称它们为 `/dev/sdb1`、`/dev/sdc1`、`/dev/sdd1` 和 `/dev/sde1`。\n\n**重要**：目前，选择单一\
    \ RAID 级别开始是方便的。\n\n### RAID 0\n如果我们想使用 `/dev/sdb1` 和 `/dev/sdc1` 创建 RAID 0，将使用以下命令：\n\
    \n```\nmdadm --create --verbose /dev/md0 --level=stripe --raid-devices=2 /dev/sdb1\
    \ /dev/sdc1\n```\n其中 `--verbose` 选项允许我们获取有关阵列创建进的详细信息，而 `--level` 和 `--raid-devices`\
    \ 分别用于指定本次练习使用的级别和设备数量。\n\n### RAID 1\n如果我们倾向于这种情况，命令与上一个示例基本相同。唯一的区别在于 `--level`\
    \ 选项的值：\n\n```\nmdadm --create --verbose /dev/md0 --level=1 --raid-devices=2 /dev/sdb1\
    \ /dev/sdc1\n```\n这种类型的配置将是我们在本章中通过图像说明的内容。稍后我们将看到如何验证 `/dev/md0` 的状态。\n\n###\
    \ RAID 1+0\n在这种情况下，我们应该使用四个磁盘：\n\n```\nmdadm --create --verbose /dev/md0 --level=10\
    \ --raid-devices=4 /dev/sd[b-e]1\n```\n在上一个示例中，我们可以看到 `mdadm` 支持使用正则表达式来指定我们将使用的磁盘，而不需要逐个列出它们。\n\
    \n## 创建文件系统并挂载设备\n\n在创建 RAID（无论级别如何）之后，是时候在上面创建一个文件系统并挂载它以便使用了。然而，在此之前，我们必须将配置详情添加到配置文件\
    \ `/etc/mdadm/mdadm.conf` 中，作为实现持久化的第一步。否则，当系统重启时，它可能无法以我们创建的名称识别它。\n\n```\nmdadm\
    \ --detail --scan >> /etc/mdadm/mdadm.conf\n```\n现在我们将使用 `ext4` 作为文件系统并将 `/mnt/miraid`\
    \ 作为挂载点：\n\n```\nmkfs.ext4 /dev/md0\nmount -t ext4 /dev/md0 /mnt/miraid\n```\n\
    实现持久化的最后一步是在 `fstab` 中添加必要的行并更新初始 RAM 磁盘：\n\n```bash\necho \"/dev/md0 /mnt/miraid\
    \ ext4 defaults 0 0\" >> /etc/fstab\nupdate-initramfs -u\n```\n与我们在之前的章节中所做一样，我们可以为文件系统分配\
    \ `LABEL` 或通过 `blkid` 查找 `UUID`。这两种替代方案都可以允许我们挂载阵列。\n\n## RAID 管理\n\n在本节中，我们将学习如何监控阵列状态、如何向其添加额外的磁盘（以备在发生故障时就绪），以及如何模拟故障。最后，我们将解释如何“回收”曾经作为阵列一部分或多个磁盘。\n\
    \n一旦执行了创建阵列的命令，我们可以使用以下任何命令监控状态：\n\n```bash\ncat /proc/mdstat\nmdadm --detail\
    \ /dev/md0\n```\n特别是，第二个命令将在列出状态时警告我们存在的问题（如果有的话）。要模拟磁盘 `/dev/sdc1` 故障，我们将使用以下命令，注意\
    \ `--fail` 选项：\n\n```bash\nmdadm /dev/md0 --fail /dev/sdc1\n```\n接下来，我们将停止修复以避免问题，并使用\
    \ `--remove` 移除问题的设备：\n\n```bash\nmdadm --stop /dev/md0\nmdadm /dev/md0 --remove\
    \ /dev/sdc1\n```\n在物理上将磁盘连接到系统并创建了标识为 `/dev/sdg1` 的相应分区后，可以使用它来替换损坏的磁盘并重启阵列：\n\
    \n```bash\nmdadm /dev/md0 --add /dev/sdg1\nmdadm --assemble /dev/md0\n```\n如果我们想一个或多个磁盘以便在另一个阵列中使用，可以这样做。在\
    \ 1) 采取了必要的措施，2) 保护了重要数据，以及 3) 从阵列中移除特定磁盘后，我们将以 `/dev/sdc1` 为例删除超级块信息：\n\n```bash\n\
    mdadm --zero-superblock /dev/sdc1\nupdate-initramfs -u\n```\n此时，如果我们愿意，我们已经可以在另一个阵列中使用\
    \ `/dev/sdc1`。\n\n# 第 8 章：更广泛的 LVM（逻辑卷管理）\n\nLVM 是一组允许管理称为逻辑卷的存储单元的工具。它最显著的特征可能是它提供了管理系统存储的灵活性，以便在需要时可以轻松扩展。LVM\
    \ 的另一个优势是它允许您对逻辑卷创建快照，快照可以作为备份副本，或用于迁移、测试、恢复等，而不影响整个系统的运行。\n\n## 传统分区与 LVM\n\n\
    如今大多数主流的发行版默认都安装在逻辑卷上。那么与传统分区相比，`LVM` 失去地位的原因是什么？\n\n首先，请记住至少在 `MBR` 中，对每个磁盘的主分区数量是有限制的。如果我们需要调整其中一个分区，需要非常小心。虽然我们可以缩小一个分区来给另一个变得太小的分区留出空间，但此过程会产生以下不便：\n\
    \n"
- fmt: "\n*   Causes downtime. This means that while we are resizing the partitions,\
    \ no one else can use the equipment. If it is our personal team, the only ones\
    \ affected would be us. But if we are talking about a server that other users\
    \ need to access, this alternative may not be viable.\n*   Requires backup copies.\
    \ If no extra space is available on any partition, there will be no choice but\
    \ to add another disk to the computer. If we want to use the new device for `/home`\
    \ (for example), this will involve moving all user files from the previous location\
    \ to the new one. Why is this inconvenient? Depending on the size of the backup,\
    \ the restoration will add time to the downtime we talked about in the previous\
    \ point.\n\nOn the other hand, the resizing of the logical volumes under LVM can\
    \ be done without interrupting the normal operation of the equipment. In addition,\
    \ the procedure is much faster than traditional partitioning. The changes are\
    \ available to users immediately without the need to restart any service.\n\n\
    ## LVM Structure\n\nA logical volume is - broadly speaking - a storage device\
    \ that may have been created on the union of 1) whole disks or 2) partitions thereof\
    \ using the logical volume manager. Unlike traditional partitioning, LVM provides\
    \ us with the flexibility to easily resize logical volumes. Let's look a little\
    \ more in detail what the process is about.\n\nThe LVM structure consists of the\
    \ following components:\n\n*   Two (or more) hard drives or partitions on which\
    \ physical volumes (`PVs`) of Physical Volume will be created. In this chapter\
    \ we will use 3 500 MB disks represented by `/dev/sdb`, `/dev/sdc`, and `/dev/sdd`\
    \ to create three PVs. It is important to clarify that we can create each of them\
    \ on the entire disk directly or partition it first. If we choose the second option,\
    \ we must indicate that the partition is of type `8e` (Linux LVM). In this opportunity,\
    \ we will create the PV on the entire disk without partitioning.\n*   A volume\
    \ group (`VGs`, from Volume Group) is created from one or more physical volumes.\
    \ For simplicity, we can consider a group of volumes as a storage unit (similar\
    \ to an entire disk in traditional partitioning).\n*   In each `VG`, we can create\
    \ several logical volumes, which can be considered as analogs of traditional partitions.\n\
    \n![](rsrc3N5.jpg)\n\n## Logical Volume Creation\n\nTo create physical volumes\
    \ on the disks mentioned above, we will do the following:\n\n```\npvcreate /dev/sdb\n\
    pvcreate /dev/sdc\npvcreate /dev/sdd\n```\n\nWe should see the following confirmation\
    \ message after executing each command. To show the attributes or view information\
    \ about a physical volume, we can use the `pvdisplay` and `pvs` commands, respectively,\
    \ followed by the PV path (`pvdisplay /dev/sdb` or `pvs /dev/sdb`, for example).\
    \ If we omit the latter, we will see the list of all physical volumes that exist\
    \ in our system.\n\nNow is the time to create the volume group (we will call it\
    \ `vgcourse`). We will only use `/dev/sdb` and `/dev/sdc`, for now, to show later\
    \ how easy it is to extend a `VG` by adding an additional device (`/dev/sdd`).\
    \ Then we will use `vgs` and `vgdisplay` to see the details of the volume group\
    \ we just created.\n\n```\nvgcreate vgcourse /dev/sdb /dev/sdc\n```\n\nLet us\
    \ take into account that the storage space available in the course is now 2 *\
    \ 500 MB = 1 GB. This fact allows us to see another of the advantages of LVM:\
    \ we can create a storage unit of considerable capacity using smaller disks or\
    \ partitions.\n\nTo create a first 600 MB size LV called `lvadmin` on video, and\
    \ we must do the following (if we omit `-n lvadmin`, the name of the LV will be\
    \ automatically assigned by `lvcreate`):\n\n```\nlvcreate -n lvadmin -L 600M vgcourse\n\
    ```\n\nAt this point, we can create a file system on `lvadmin` and mount it in\
    \ a directory previously created for this purpose. We will use `/mnt/courseadmin`\
    \ and pay attention to using the full path to the device this time:\n\n```\nmkfs.ext4\
    \ /dev/vgcourse/lvadmin\nmount /dev/vgcourse/lvadmin /mnt/courseadmin\n```\n\n\
    Before proceeding, we can ensure that the device was correctly mounted using any\
    \ of the following commands:\n\n```\nmount | grep lvadmin\ndf -h /mnt/courseadmin\n\
    ```\n\nAs we see in the image above, we are already able to start using the logical\
    \ volume. However, in this chapter, we will focus on possible operations through\
    \ LVM rather than using the storage device (a topic that we have already learned\
    \ previously).\n\n## Operations\n\nTo add a PV to a `VG`, we will use the `vgextend`\
    \ command followed by the name of the `VG` and finally the PV:\n\n```\nvgextend\
    \ vgcourse /dev/sdd\n```\n\nBy using the `vgs` command (or `vgdisplay`, for more\
    \ details) followed by the name of the volume group, we can see its size after\
    \ adding the physical volume.\n\nTo shrink an existing LV, we must take special\
    \ care because if we reduce the size below the space currently used, we will irreversibly\
    \ lose data! Having taken that into account, we will decrease the size of `lvadmin`\
    \ to 450 MB:\n\n```\nlvresize --resizefs --size 450M vgcourse /lvadmin\n```\n\n\
    The `--resizefs` option resizes the logical volume and the associated file system\
    \ in one step. As the device is currently mounted, we will be asked for confirmation\
    \ to disassemble it in order to proceed with the action indicated.\n\nIf we had\
    \ not previously created a file system, we could have simply used \n\n```\nlvreduce\
    \ -L 450M vgcourse /lvadmin\n```\n\nto modify the size of `lvadmin`.\n\nLet's\
    \ now see how to create a second LV - which we will call `lvredes` - and allocate\
    \ all available space in your course. We will notice that the command is almost\
    \ identical to the one we used in the previous post, but the `100% FREE` argument\
    \ will tell `lvcreate` to use all the space available for the new logical volume.\n\
    \n```\nlvcreate -n lvredes -l 100% FREE vgcourse\n```\n\nEach of the operations\
    \ we use so far has their counterpart (which we detail below) and the possibility\
    \ of renaming the components we create:\n\n*   `pvremove`, `vgremove`, and `lvremove`\
    \ (followed by the route to PV, VG, and LV, respectively) are used to remove the\
    \ device from the LVM structure. As expected, this does NOT remove the underlying\
    \ device - it only removes the label that identifies it as a physical volume,\
    \ volume group, or logical volume.\n*   `vgrename` and `lvrename` (followed by\
    \ the current VG and VG / LV combination, respectively) allow us to rename groups\
    \ of volumes and logical volumes. For example, to rename `vgcourse` as `vgcareerlinux`\
    \ and `lvadmin` as `lvadministrador` we must do:\n"
