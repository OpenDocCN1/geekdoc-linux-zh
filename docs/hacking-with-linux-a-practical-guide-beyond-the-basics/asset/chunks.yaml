    | sshd | 74 | 123 | Fictitious user manager of the SSH service. |

    | apachewww-data | 48 | 33 | Owner of the files and directories of the Apache
    hypertext service. |

    | squidproxy | 23 | 13 | Squid representation service controller. |


    | Group | GID (1) | GID (2) | Description |

    | :--- | :--- | :--- | :--- |

    | root | 0 | 0 | Administrators with total control. |

    | bin | 1 | 2 | System binaries. |

    | daemon | 2 | 1 | General services. |

    | sys | 3 | 3 | System control. |

    | adm | 4 | 4 | Historical and administrative files. |

