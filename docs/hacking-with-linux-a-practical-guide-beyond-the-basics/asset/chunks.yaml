  trans: '


    *   会导致停机。这意味着当我们调整分区大小时，其他人都无法使用该设备。如果只是我们个人团队，受影响的将只有我们自己。但如果我们讨论的是其他用户需要访问的服务器，那么这种替代方案可能不可行。

    *   需要备份副本。如果任何分区上没有额外的可用空间，将只能选择为计算机添加另一块磁盘。如果我们想将新设备用于 `/home`（例如），这将涉及将所有用户文件从旧位置移动到新位置。为什么这不方便呢？这取决于备份的大小，恢复过程会为上一点中提到的停机时间增加额外的时间。


    另一方面，在 LVM 下对逻辑卷进行大小调整可以在不中断设备正常运行的情况下完成。此外，该过程比传统的分区要快得多。更改立即对用户生效，无需重启任何服务。


    ## LVM 结构


    广来说，逻辑卷（Logical Volume）是一种使用逻辑卷管理器（LVM）在 1) 整个磁盘或 2) 其分区上创建的存储设备。与传统分区不同，LVM 为我们提供了轻松调整逻辑卷大小的灵活性。让我们详细查看一下这个过程。


    LVM 结构由以下组件组成：


    *   两个（或多个）硬盘或分区，在上面将创建物理卷的物理卷（`PVs`）。在本章中，我们将使用三个 500 MB 的磁盘，表示为 `/dev/sdb`、`/dev/sdc`
    和 `/dev/sdd` 来创建三个 PV。需要明确的是我们可以直接在整个磁盘上创建每一个，也可以先对其进行分区。如果我们选择第二个选项，必须指定分区的类型为
    `8e`（Linux LVM）。在此机会中，我们将直接在整个磁盘上创建 PV 而不分区。

    *   卷组（`VGs`，来自 Volume Group）由一个或多个物理卷创建。为了简单起见，我们可以一组卷视为一个存储单元（类似于传统分区中的整个磁盘）。

    *   在每个 `VG` 中，我们可以创建多个逻辑卷，它们可以被视为传统分区的类比。


    ![](img/rsrc3N5.jpg)


    ## 逻辑卷创建


    要在上述磁盘上创建物理卷，我们将执行以下操作：


    ```

    pvcreate /dev/sdb

    pvcreate /dev/sdc

    pvcreate /dev/sdd

    ```


    在执行每个命令后，我们应该看到相应的确认消息。要显示物理卷的属性或查看其信息，我们可以分别使用 `pvdisplay` 和 `pvs` 命令，后接 PV 路径（例如
    `pvdisplay /dev/sdb` 或 `pvs /dev/sdb`）。如果我们省略后者，将看到系统中存在的所有物理卷列表。


    现在是创建卷组的时间（我们将将其命名为 `vgcourse`）。我们目前只使用 `/dev/sdb` 和 `/dev/sdc`，以便稍后展示如何通过添加额外的设备（`/dev/sdd`）来轻松扩展
    `VG`。然后我们将使用 `vgs` 和 `vgdisplay` 来查看刚刚创建的卷组的详情。


    ```

    vgcreate vgcourse /dev/sdb /dev/sdc

    ```


    考虑到课程中可用的空间现在是 2 * 500 MB = 1 GB。这一事实让我们看到了 LVM 的另一个优势：我们可以使用较小的磁盘或分区创建一个容量相当大的存储单元。


    要在视频上创建一个名为 `lvadmin` 的大小为 600 MB 的第一个 LV，我们必须执行以下操作（如果省略 `-n lvadmin`，LV 的名称将由
    `lvcreate` 自动分配）：


    ```

    lvcreate -n lvadmin -L 600M vgcourse

    ```


    此时，我们可以在 `lvadmin` 上创建文件系统并将其挂载到以前为此目的创建的目录。我们将使用 `/mnt/courseadmin`，并注意这次使用设备的完整路径：


    ```

    mkfs.ext4 /dev/vgcourse/lvadmin

    mount /dev/vgcourse/lvadmin /mnt/courseadmin

    ```


    在继续之前，我们可以可以使用任何一个命令确保设备已正确挂载：


    ```

    mount | grep lvadmin

    df -h /mnt/courseadmin

    ```


    正如上面的图片所示，我们已经能够开始使用逻辑卷。然而，在本章中，我们将专注于通过 LVM 进行的操作，而不是使用存储设备（我们之前已经学过的主题）。


    ## 操作


    要向 `VG` 添加 PV，我们将使用 `vgextend` 命令，其后接 `VG` 的名称，最后是 PV：


    ```

    vgextend vgcourse /dev/sdd

    ```


    通过使用 `vgs` 命令（或使用 `vgdisplay` 查看更多详情）后接卷组的名称，我们可以看到添加物理卷后的尺寸。


    要缩小现有的 LV，必须特别小心，因为如果我们将大小缩小到当前使用的空间以下，将不可逆转地丢失数据！考虑到这一点，我们将 `lvadmin` 的大小减小到
    450 MB：


    ```

    lvresize --resizefs --size 450M vgcourse /lvadmin

    ```


    `--resizefs` 选项将一步到位调整逻辑卷和相关文件系统的大小。由于设备目前已挂载，系统将要求确认卸载它以便继续执行指示的操作。


    如果我们之前没有创建文件系统，可以简单地使用


    ```

    lvreduce -L 450M vgcourse /lvadmin

    ```


    来修改 `lvadmin` 的大小。


    现在让我们如何创建第二个 LV - 我们将其命名为 `lvredes` - 并分配课程中所有的可用空间。我们会注意到命令与我们在上一篇文章中使用的命令几乎相同，但
    `100% FREE` 参数将告诉 `lvcreate` 使用所有可用空间给新的逻辑卷。


    ```

    lvcreate -n lvredes -l 100% FREE vgcourse

    ```


    我们到目前为止使用的每个操作都有对应的操作（我们将在下文中详细说明）以及重命名我们创建的组件的可能性：


    *   `pvremove`、`vgremove` 和 `lvremove`（分别后接 PV、VG 和 LV 的路径）用于从 LVM 结构中删除设备。正如预期的，这**不会**删除底层设备
    - 它仅删除标识其为物理卷、卷组或逻辑卷的标签。

    *   `vgrename` 和 `lvrename`（分别后接当前的 VG 和 VG / LV 组合）允许我们重命名组和逻辑卷。例如，要将 `vgcourse`
    重命名为 `vgcareerlinux`并将 `lvadmin` 重命名为 `lvadministrador`，我们必须执行：


