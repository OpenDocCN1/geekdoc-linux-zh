    Linux 是一个基于开源的操作系统，管理员可以根据需要重新制作内核，包括或消除某些功能。重新编译 Linux 内核的过程变得越来越简单，因为它通过带有大量选项的菜单进行配置的。


    为了提高系统性能，拥有一个能够处理系统所有基本函数的微内核是非常方便的。额外设备和功能的管理可以通过内核模块来控制。


    ## Linux 内核模块

    Linux 内核模块是用 C 语言编译的实例，用于控制特定的元素或功能。控制连接设备的基础模块在操作系统启动过程中加载。系统管理员认为必要的其他模块应该列在配置文件中，以及这些模块为了获得最佳服务器运行状态所需的可选参数。


    Linux 内核 2.4 版本使用单个文件 `/etc/modules.conf`，而 2.6 版本的发行版在 `/etc/modprobe.d` 目录中定位多个文件（每个模块或模块组一个文件）。


    在配置文件中，指定了真实模块与虚拟模块之间的关联（别名）。虚拟模块是系统与控制真实设备的模块之间的接口；它们负责管理网络、特殊文件系统、独占声卡功能等。


    下表描述了涉及内核模块运行的系统命令。


    | 命令 | 说明 |

    | :--- | :--- |

    | `lsmod` | 列出已加载的模块。 |

    | `modprobe` | 测试特定的系统模块并指示是否可以安装。 |

    | `insmod` | 安装新模块。 |

    | `rmmod` | 卸载已加载的模块。 |


    ## 运行参数

    新版本的 Linux 内核支持对其运行参数进行配置和自定义，影响组件的行为，例如：增加最大打开文件数 (`fs.file-max`) 或激活数据包转发以创建防火墙
    (`net.ipv4.ip_forward`)。


    内核预定义环境中的修改将反映在对应修改功能的系统中，位于虚拟 `/proc/sys` 文件系统中。


    内核运行参数的配置文件为 `/etc/sysctl.conf`，管理员可以编辑它并在下次系统启动时包含更改。此外，通过执行 `sysctl -p` 命令会自动激活更改。


    下表显示了 `/etc/sysctl.conf` 文件的行格式。


    | 格式 | 说明 |

    | :--- | :--- |

    | `/etc/sysctl.conf` | `Component[.Subcomp].Parameter = Value...` | 内核参数的配置。字段如下：
    |

    | | 1. 内核的核心组件：`kernel`、虚拟内存 (`vm`)、文件系统 (`fs`) 或网络 (`net`)。其中某些组件可能有参数组（目录）。
    |

    | | 2. 运行参数。 |

    | | 3. 分配给参数的值。 |


    某些程序可能将内核参数配置文件存储在 `/etc/sysctl.d` 目录下，其语法与主文件类似。Linux 内核运行参数的完整信息可以在内核源码文档及其下载页面上获得。


    ## Sysvinit 中的运行级别

    许多 Linux 发行版（如 Fedora）使用继承自 Unix System V 的顺序启动过程，被称为 SysVinit。运行级别允许 SysVinit
    根据管理员的需求以不同的方式运行。只需更改运行级别，操作系统即可进入维护模式，然后返回多用户模式。


    下表描述了 SysVinit 支持的执行级别。


    | 级别 | same |

    | :--- | :--- |

    | 0 | 系统停止。 |

    | 1 o S | 特权用户的维护级别（单用户）。 |

    | 2 | Fedora 中由管理员定义，Ubuntu 中默认，Solaris 和 AIX 中无 NFS 的多用户。 |

    | 3 | 多用户级别，由 Ubuntu 中的管理员定义。 |

    | 4 | 由管理员定义或未使用。 |

    | 5 | Ubuntu 中带有图形化环境的多用户级别。 |

    | 6 | 系统重启。 |


    系统默认使用的运行级别定义在配置文件 `/etc/inittab` 中。然而，`init` 命令允许你随时修改机器的执行级别。


    `init` 命令读取存储在 `/etc/rcN.d` 子目录中的配置脚本，这些子与与选定的执行级别对应。运行模式如下：


    *   按顺序停止与 `KNNservice` 文件对应的进程，`NN` 是该服务的顺序数字（2 位）（执行顺序为：`/etc/rcN.d/KMM stop`
    服务）。

    *   按顺序启动 `SNN` 服务文件进程（运行：`/etc/rcN.d/SMM start` 服务）。


    服务执行脚本通常位于 `/etc/init.d` 目录中，并与每个执行级别的脚本建立符号链接。通过这种方式，管理员可以独立地启动或停止服务，执行相应的脚本或
    Fedora 服务顺序：


    ```bash

    service Service { start |stop |restart |reload |status }

    ```


    下表描述了 Fedora 13 中包含的一些用于在服务器启动过程中管理服务的程序。


    | 命令 | 说明 |

    | :--- | :--- |

    | `chkconfig` | 建立符号链接以在指定的启动级别包含服务。 |

    | `ntsysv` | 设置在多用户级别下运行服务的菜单。 |

    | `service` | 启动或停止特定服务。 |

    | `system-config-services` | 服务管理的图形界面，包括 Inetd 进程。 |

    | `telinit` | 切换到指定的执行级别。 |


    ## Upstart 中的任务

    `Upstart` 是一种非顺序的基于事件的启动过程，从 Ubuntu 6.10 版本默认包含。任务（Job）是在触发事件时可以执行或停止的任务或服务，并且还可以生成新事件以管理依赖它的其他任务。


    这种类型的启动系统的优势是当系统识别到相应设备时可以启动必要的任务，而无需等待之前的任务执行完成。因此，可以定义一种任务执行树。Upstart 可以模拟 SysVinit
    的工作方式，为通用系统服务定义执行级别。Ubuntu 8.10 Intimid 除维护级别（0, 1 和 6）外，默认定义级别 2。


    以下示例显示了文件 `/etc/event.d/rc2`，它配置了定义执行级别 2 的任务：


    ```bash

    start on runlevel 2

    stop on runlevel !2

    console output

    script

    set $(runlevel --set 2) || true

    exec /etc/init.d/rc 2

    ```


    管理员可以定义服务的启动顺序，类似于 SysVinit，包括指向 `/etc/init.d/rcN.d` 目录对应脚本的符号链接，或通过执行 `update-rc.d`
    命令。启动或停止服务的执行格式如下：


    ```bash

    /etc/init.d/ Service { start |stop |restart |reload |status }

    ```


    表格描述了 Ubuntu 7.10 中的某些服务管理命令和启动任务。


    | 命令 | same |

    | :--- | :--- |

    | `initctl` | 启动过程控制工具，执行命令并启动事件。 |

    | `start` | 启动任务 |

    | `status` | 显示任务的执行状态。 |

    | `stop` | 停止任务。 |

    | `telinit` | 切换到指定的执行级别。 |

    | `update-rc.d` | 管理 sysVinit 脚本的链接。 |


    ## 服务

    服务是在特定执行级别下加载的程序，为用户提供某些实用程序或好处。每个服务都意味着可能与机器建立连接，这也意味着可能遭受针对系统安全的攻击。


    管理员应仅激活其机器严格必需的服务。下表简要描述了 Linux 中最常用的服务。


    '
