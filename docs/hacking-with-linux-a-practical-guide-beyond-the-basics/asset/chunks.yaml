    ## cron 示例


    ### 通配符的使用

    请记住，`crond` 服务每分钟会检查一次 crontab 条目，如果满足了每个条目中指定的日期、天和时间条件，它就会执行它们。当我们希望某个条件始终满足时，我们会在相应的位置使用星号
    `*`。例如，如果我们需要每天下午 12:45 运行脚本 `/home/alumno/miscript.sh`，我们将在表中添加以下行：


    ```

    45 12 * * * /home/alumno/miscript.sh

    ```


    前两个数字指定了时间（下午 12:45），接下来的三个星号 `*` 表示任务必须执行：1) 每天（1 到 31 号），2) 每月，以及 3) 每周的每天（周一到周六）。


    按照这个推理，下一行表示什么？


    ```

    00,15,30,45 11 * * 1-5 /home/alumno/segundoscript.sh

    ```


    让我们详细回顾一下：

    第一个字段 `(00,15,30,45)` 和第二个字段 `(11)` 表示该脚本应在每月任何一天的上午 11:00、11:15、11:30 和 11:45
    运行，每月运行一次（第三和第四字段分别由 `*` 表示），但仅限于周一到周五（第五字段中的 `(1-5)`）。简单来说，cron 将在周一至周五的上午 11:00、11:15、11:30
    和 11:45 执行此脚本。


    如我们所示，crontab 条目支持用逗号分隔元素列表和范围来指定日期、天和时间的条件。要查看我们自己的计划任务表，我们将使用 `crontab -l`。root
    用户也可以查看（当然，也可以编辑）其他用户的表。为此，你必须添加 `-u` 选项并在后跟相关的用户名。


    ## 最终考虑


    crontab man 页的第 5 节（通过 `man 5 crontab` 调用）规定，在该程序的配置文件（`/etc/crontab`）以及我们的个人表中，我们可以使用环境变量。这意味着可以为我们希望在执行期间使用的变量赋值。其中一些变量如下：


    `PATH` 包含 `crontab` 可以搜索可执行二进制文件的目录。如果某个特定的目录恰好是此变量的一部分，我们可以在 crontab 条目的第六个字段中使用相对路径（而不是像我们在上一篇文章中提到的那样使用绝对路径）。例如，给定下文所示的
    `PATH` 变量值：


    `PATH = /usr/local/sbin: /usr/local/bin: /sbin: /bin: /usr/sbin: /usr/bin`


    如果我们想要运行的程序位于 `/usr/local/bin`（见红色高亮处），我们可以写：


    ```

    10 15 * * * myprogram

    ```


    而不是：


    ```

    10 15 * * * /usr/local/bin/myprogram

    ```


    `SHELL` 指定了执行计划任务时要使用的 shell。如果省略此变量，crontab 将使用默认的 `/bin/sh`。


    `MAILTO` 允许你指定一个电子邮件地址，程序的输出（包括任何错误）应发送到该地址。如果你想将电子邮件发送给同一团队的用户，只需指定该用户即可。另一方面，也可以将报告发送到外部地址（只要该团队安装了电子邮件服务）。例如：


    `MAILTO = student` 将把邮件发送给同一团队的 `student` 用户，而 `MAILTO=john@mydomain.com` 则表示应发送到上述地址。


    可能会出现这种情况：我们不希望系统的所有用户都能访问 `cron`（可能是为了防止他们调度任务或启动消耗系统资源或存在安全漏洞的进程）。为了限制访问，我们必须创建（如果尚不存在）以下文件：


    * `/etc/cron.allow`

    * `/etc/cron.deny`


    这些文件由用户列表组成，每行一个。如果 `.allow` 文件存在，只有出现在其中的用户可以使用相应的工具。如果 `.allow` 不存在但 `.deny`
    存在，则只允许不在其中的用户访问。如果两个文件（`.allow` 和 `.deny`）都不存在，所有用户都可以访问 cron。


    ## Anacron


    尽管我们在维护任务表方面付出了努力，任务仍可能不在规定时间内运行（例如设备关闭或重启）。这样，系统将等待到下次时间匹配时运行它。例如，如果一个脚本必须每天上午
    11:30 运行，而电脑在那个时候关闭了。为了克服这一限制，我们可以使用 anacron。在下面的示例中，我们看到了在 `/etc/anacab` 中的配置：在顶部我们看到以下通用变量：


    * `SHELL` 指定将使用哪个控制台运行：`/bin/sh`。

    * `PATH` 代表搜索可执行文件的路径：`/sbin: /bin`。

    * `MAILTO` 是发送错误信息的电子邮件地址：`root`。

    * `RANDOM_DELAY` 是从系统启动并开始待处理任务经过的最大分钟数。

    * `START_HOURS_RANGE` 代表待处理任务的时间间隔。


    下面我们可以看到以下计划任务：

    `cron.daily` (nice run-parts /etc/cron.daily)

    `cron.weekly` (nice run-parts /etc/cron.weekly)

    `cron.monthly` (nice run-parts /etc/cron.monthly)


    `run-parts` 命令负责执行指定目录内的可执行文件。它按照字母顺序逐个执行，间隔由延迟列指定的间隔决定。如我们所见，这意味着位于 `/etc/cron.daily`
    中的脚本将在 5 分钟后运行。最后，周期列告诉我们检查是否有待处理任务的频率。总而言之，cron 更新执行特定任务的日期和时间，如果该日期和时间在给定的范围内，Anacron
    就不会再次执行它。


    ## 执行一次性计划任务


    有时，我们希望只调度执行一次一次任务。尽管在理论上，我们可以使用 crontab 条目来实现这个目标，但在 Linux 中，我们有一个名为 `at` 的工具，它可以让我们更轻松地完成，而无需稍后删除条目。因此，在这篇文章中，我们将展示如何使用运行一次程序或执行一次计划命令。


    ### 如何使用 at

    要使用 `at`，必须安装它，然后启动服务并允许它在下次重启时启动。要安装，我们将使用以下命令：


    ```bash

    yum install at # CentOS

    aptitude install at # Debian 及类似系统

    systemctl start atd # 启动

    systemctl enable atd # 启用

    ```


    一旦 `atd` 服务运行，我们可以如下调度任何任务：


    ```bash

    echo "在引号内输入命令" | at [指定所需时刻的选项]

    ```


    其中所需的执行时间（日期和时间）必须符合 POSIX 标准。这里是一些示例：

    小时：`9 pm`、`20:45`、`now`、`noon (12 pm)`、`midnight (00:00)`。日期：`today`、`tomorrow`、`Sep
    10 (9 月 10 日)`、`Jan 5 (1 月 5 日)`。


    我们还可以创建日期和时间的组合，例如：

    '
- fmt: '

    - `10:45 pm Jan 10` represents 10:45 p.m. on January 10

    - `8:23 am May 11` indicates 8:23 a.m. on May 11


    ## Increase


    - `+ minutes` (minutes)

    - `+ hours` (hours)

    - `+ days` (days)

    - `+ weeks` (weeks)

    - `+ months` (9months)

    - `+ years` (years)


    For the increase, the singular forms `minute`, `hour`, `day`, `week`, `month`,
    and `year` are also accepted. The increase is used to "add" a certain measure
    of time to the time indicated for the execution of the task. Let us now see some
    examples that will help us to illustrate:


    **EXAMPLE 1** - To create a tarball called `scripts.tar.gz` (where we will save
    all the `.sh` files located within the current directory) within 2 minutes, we
    will do the following:


    ```bash

    echo "tar czf scripts.tar.gz * .sh" | at now +2 minutes

    ```


    Let''s see the result in the following image, where we can see that the file modification
    date corresponds to the time announced by `at` for the execution of the previous
    command.


    **EXAMPLE 2** - If we want to run `updatedb` on September 11 at 7:15 am, we will
    use the following command:


    ```bash

    echo "updatedb" | at 7:15 am Sep 11

    ```


    There are other commands to manage the tasks we have scheduled using this tool:

    1. See our own list of scheduled tasks (or those of all users, if we have root
    permissions): `atq`.

    2. delete them individually: `atrm`, followed by the task number returned by `atq`.

    3. make one of them run only when the system usage levels are below a given threshold:
    `batch`.


    If we are facing a team in which processes that occupy the CPU are running more
    or less intensively, we can use this command to execute a task when the average
    load (`load average`) falls below `0.8`. For example,


    ```bash

    echo "updatedb" | batch

    ```

    will make `updatedb` run when the condition just mentioned is met.


    ## The Timers In systemd


    Timers (`timers`) in `systemd` are a special type of unit that allows you to schedule
    tasks periodically in a similar way to `cron`. However, they have the particularity
    of having greater flexibility in specifying when to take action.


    Timers definition files are characterized by having the extension `.timer` and
    contain instructions for controlling a service or event. To illustrate, let''s
    analyze an example.


    In the `[Unit]` section we will find a description of the timer, while under `[Timer]`
    we will see the configuration itself, where `OnCalendar` indicates the date and
    time at which the timer should be triggered. In this particular case, it will
    be every day of every month of every year at 6 and 6:00 p.m. `RandomizedDelaySec
    = 12h` specifies a random delay interval that can be applied to the timer, between
    0 and the indicated value. `Persistent = true` tells us that if `systemd` did
    not trigger the timer on a previous occasion (for example, if the equipment was
    off), it would do so automatically as soon as possible.


    In the man page of `systemd.timer`, we can find all the available configuration
    directives.


    In the event that the `Unit` directive is not displayed (not to be confused with
    the section that bears the same name), the timer will control the service that
    has the same name. In other words, `apt-daily.timer` and `apt-daily-upgrade.timer`
    will control the related services (`apt-daily.service` and `apt-daily-upgrade.service`).
    Luckily, all this happens without specifying it in the timer configuration file.


    ## System Event Logs


    Most (if not all) of the services running on a Linux system originate some type
    of registration as a result of its operation. Whether it is error messages, login
    events, or even purely informative issues, it is important that we know where
    they are stored. This will allow us to examine them when necessary in search of
    important information.


    A log message usually has information about system security, although it may contain
    any information. The date and time of the shipment are included with each message.


    The protocol used for the transmission of these messages is called `rsyslog`,
    as is the application that handles such sending. It replaced `syslog` in this
    function as the de facto standard in most distributions over a decade ago. The
    protocol itself is very simple. It consists of a server running the related service,
    also called `rsyslog` (`rsyslog daemon`), that records plain text messages (less
    than 1024 bytes) sent by each application.


    Although `rsyslog` has some security problems, its simplicity has led many devices
    to implement it, both for sending and receiving. This makes it possible to integrate
    messages from several types of systems in a single central repository (even from
    different computers). Let''s look at the following lines in the configuration
    file `/etc/rsyslog.conf` where the lines that start with `#` are ignored by the
    service.


    - `kern.*` Indicates all kernel messages, whatever the severity they are.

    - `.info; mail.none; authpriv.none; cron.none` is used to record all informational
    messages (`info`) regardless of the resource that issues them (hence the use of
    the wildcard at the beginning) with the exception of those whose origin is `mail`,
    `authpriv`, and `cron`.

    - All `authpriv` (private authentication) messages must be saved in `/var/log/secure`,
    while for `mail` and `cron` the destination must be `/var/log/maillog` and `/var/log/cron`,
    respectively. As in the first example, the use of `*` after the point tells us
    that this rule applies to any type of event regardless of its severity.


    The sign `-` in front of `/var/log/maillog` (and others) was used in previous
    versions to skip synchronization with the file immediately after each writes a.
    Today is an unused option. The examples just analyzed will help us explain the
    structure of the message in the next section.


    ## Message Structure


    The message sent by `rsyslog` consists of three fields:

    1. Priority

    2. Header

    3. Text


    Among the three previous fields should not add more than 1024 bytes, but there
    is no minimum length. Let us now see in a little more detail the meaning and possibilities
    of each of them:


    - The **priority** indicates both the resource (origin) of the message and the
    severity of the message. It usually follows the convention taken from RFC3164.
    The most common resources are `auth`, `authpriv`, `cron`, `daemon`, `kern`, `lpr`,
    `mail`, and `local0` to `local7` for user-defined messages. The severity (in order
    of importance) can be `debug`, `info`, `notice`, `warn`, `err`, `crit`, `alert`,
    and `emerg`. By default, all messages of the specified severity and greater will
    be recorded.

    - The **header** indicates both the date and time of the message and the server
    (name of the computer from which it originates) and, together with the explanatory
    text, constitutes the information stored in the log file.


    With the `logger` command, we can send personalized messages to `rsyslog` manually
    or through scripts. For example:


    ```bash

    logger -p local1.notice "This is a warning"

    logger -p local1.warn "This is a warning"

    ```

    It will keep messages in `/var/log/mi.log` (destination for `local1.notice` and
    severity) messages. After making changes to the configuration file, it will be
    necessary for us to restart the service using `systemctl restart rsyslog` for
    them to take effect.


    Alternatively, system messages can be sent to:


    - another machine, to store them remotely. For this, it is necessary to indicate
    in the field of action the name or address of said system preceded by two `@`
    signs instead of a path to a local log file. This is useful if we have a secure
    machine, which we can rely on (connected to the network). In this way, a copy
    of the messages of our system would be stored there, which could not be modified
    if someone could log in to the machine that is generating them. This requires
    that the remote system be enabled to take messages from other computers.

    - a script that is executed every time a message of a certain type originates.
    In this case, we must place the `^` sign in front of the full path to the script.

