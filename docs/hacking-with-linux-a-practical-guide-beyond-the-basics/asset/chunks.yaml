    ## Basic Process Control


    The process can be understood as any program or command in execution. A process
    has the following characteristics:


    - Each process consists of code, data and stack zone.

    - The processes exist in a tree hierarchy (several children, one parent).

    - The system assigns a unique process identifier (`PID`) at the start of the process.

    - The task scheduler allocates a time-share for the process based on its priority
    (only root can increase the priority of a process).

    - Each process stores its identifier (`PID`) of its parent process (`PPID`), the
    owner and group of the process, and the environment variables.


    The superuser must maintain control of the system at all times, making periodic
    reviews of the processes that are running on the server, which can avoid problems
    and abuses that affect the normal operation of the machine. The following table
    describes the most used commands for process control.


    | Mandate | Description |

    | :--- | :--- |

    | `ps` | Presents a list of the active processes on the machine, indicating owner,
    process identifier (`PID`), parent process identifier (`PPID`), mandate, etc.
    |

    | `kill` | Send an interrupt signal to one or several processes. It is usually
    used to finish its execution. |

    | `pgrep` | List processes that meet certain criteria. |

    | `pkill` | Send a signal to processes that meet certain criteria (take special
    care when executing this order). |

    | `nice` | Change the priority of the processes. It is usually used to reduce
    the execution time of processes that saturate the system. |

    | `top` | Presents an updated list of the processes that consume more resources.
    It also allows us to send signals and modify the priority of execution. |

    | `lsof` | List the files and network connections opened by each process, also
    indicating the owner, `PID`, priority, command, etc. |


    The `lsof` command is a powerful administrative tool, as it shows all files, named
    pipes, devices, and network connections opened by each process. It is usually
    used to check those processes suspected of creating problems and to check the
    network connections of each service.


    ## Conclusion


    We have arrived at the end of the book! We believe this section should not be
    called "Conclusion," but "Happy Ending"! Joking aside, we would like to emphasize
    that GNU / Linux systems have gone from anonymity to the cover of various magazines
    and specialized pages, gaining strength and status among large corporations and
    other segments. They are no longer seen as alternative systems, but rather a serious
    system option for our computers, whether home, office, college, where their use
    is being considered.


    Despite the supremacy of Windows - especially on workstations -, GNU / Linux systems
    are gaining momentum in many different areas. Its versatility, robustness, independence,
    and “complete” way of being, driven by its very low overall cost, are major and
    powerful factors for its adoption. Slowly, but progressively, the system and its
    numerous high-performance, high-performance applications are gaining ground ranging
    from server-side solutions to embedded systems portable devices. Even on some
    video game consoles, our dear Tux has a marked presence! Large distributions incorporate
    everyday resources and tools that aim to maximize their purposes, where they propose
    solutions.


    For us, end-users, all efforts for enhancements, implementation of user-friendly
    interfaces are being enhanced so that in the not too distant future, we can have
    an operating system with all the desired (and many unique) features and qualities
    available, thus contributing to making the use of computers a pleasant and enjoyable
    activity, regardless of the degree of knowledge, training, and availability of
    resources and facilities of the enthusiastic micron. Now with the initiatives
    of various companies, corporations, and projects, we believe it will not be long
    before the dream comes true.


    Even so, after major and countless evolutions, the following question (and expectation)
    still remains: “When will GNU / Linux systems dominate the market?” It''s hard
    to answer. Whether due to the qualities of the system, the support of its users,
    or the commitment of large corporations, in short, or by several factors that
    may have a greater or lesser influence on this aspect. But a big step has already
    been taken: its existence is due to a wonderful community that since ancient times
    (not so much ...) believes in freedom, and based on its ideologies, built an amazing
    and wonderful operating system, and of a wide range of applications. Thanks to
    their willpower, character, and intense passion, we have on our computers the
    fruit of these great efforts: a free, open, efficient, powerful, robust, stable,
    complete, flexible, versatile, friendly, beautiful ... and passionate system.
    At last, you will find all the web page references about GNU / Linux systems and
    available applications. These materials have been consulted for information before,
    during, and after the process of developing this book.


    ### Resources


    1. iLinux OnLine!: http://www.linux.org/

    2. The Linux Documentation Project (TLDP): http://www.tldp.org/

    3. Filesystem Hierarchy Standard: http://www.pathname.com/fhs/

    4. GNU Project: http://www.gnu.org/

    5. Open Source Initiative: http://www.opensource.org/

    6. Upstart - event-based init daemon: http://upstart.ubuntu.com/

    7. Migrating to Ext4: http://www.ibm.com/developerworks/linux/library/l- ext4
    /

    8. The Linux Kernel Archives: http://www.kernel.org/

    9. The Internet Engineering Task Force: http://www.ietf.org/

