    To change these permissions, use the `chmod` command. See the explanation of using
    this command in the next chapter.


    ## Directories

    We call a directory tree the organization of directory files, alluding to their
    branches, similar to tree branches. We give the root directory the name "root"
    that contains all the other subdirectories.


    * The current directory is the directory the user is currently in at a given time.

    * "Home" directory is where the user account is registered.

    * The ascending directory is the directory where a given file or directory is
    contained.

    * Descending directory is the directory contained in another directory.


    The path is the list of directories that need to be traversed, from the root directory
    to the file, with slashes separating the components. Absolute Path is the full
    path from the root to the file. If the full path from the root to the file is
    `/root/pet/courses/Linux` and the user''s working directory was `pet` at the moment,
    then he could type `courses/Linux`. This name is called a relative path.


    The main directories, among others, with their content, are listed below:


    * `/etc` - Files for system administration.

    * `/bin` - Most commonly used UNIX commands.

    * `/usr` - All user accounts and some commands.

    * `/dev` - Input and output device files.

    * `/lib` - Library files for C programming.

    * `/tmp` - Temporary file storage.

    * `/mmt` - Mounting discs and peripherals.

    * `/sbin` - Directory used at system startup. Other system administration packages
    should be in `/usr/sbin` or `/usr/local/sbin`.

    * `/var` - Directory that contains various files such as spool (email, crontab,
    print) and logs. This directory exists so that files that need to be modified
    who in it and not in `/usr`.

    * `/home` - Contains users'' home directories.

    * `/root` - This is the directory that contains the administrator files (your
    home). However, some Unix-like systems use `/home/root`.

    * `/proc` - Virtual directory where the kernel stores its information.

    * `/boot` - Contains the kernel image and everything needed for the boot process
    except configuration.


    ## Processes

    ### Processes and Subprocesses

    A process generally is a simple program that runs on its own virtual address space.
    It is different from a command or job, which can consist of multiple processes
    performing a single task on UNIX systems. Simple commands, for example, the execution
    of `ls` are simple processes. But a complex command comprising pipes execute a
    single process per pipe section as a rule. To track the status of each process,
    the system creates a `PID` (Process ID) for each open process.


    There are elements called execution control guides that help control program execution.


    1. **Fork**: It is the system call whose execution creates a process (identical)
    to the one that called it. Parent process: Process that generates a new process.

    2. **Child Process**: Process generated by the parent process.

    3. **Pid (Process ID)**: This is a number that uniquely identifies each process
    and is used to refer to it.

    4. **Parent Process ID (PPid)**: This is the `Pid` of the parent process.


    ### Process Control

    There are some topics that will allow the user to perform some interesting tasks,
    such as:


    * execute more than one process at a time;

    * run a process at a low priority.


    If you are using a program that will take a long time to finish, and you want
    to start working on another task, you can call your program to run in what is
    known as the background. This can be done by placing at the end of the command
    line the `&` symbol. You can also, while the program is running, press `CTRL +
    Z`. With that, the command will be suspended, and the system will drop the prompt.


    We call foregrounding the act of making a program run in the foreground. In this
    mode, processes can interact with users and display execution on the monitor.


    When the `nice` command is placed before a command line, the time devoted by the
    CPU execution of that task is reduced, so that it does not delay so much more
    important processes. That is, the priority of that process is reduced. This command
    should be used when there are other, more important processes running on the system.


    Other process-related commands:


    * `jobs` lists the background jobs.

    * `fg [job]` takes the job to the foreground. `bg [job]` takes the job to the
    background.

    * `ps` shows the processes that are running on the computer.

    * `top` continuously shows the status of each process running on the computer.

    * `kill [Pid]` terminates the process.


    The example below illustrates the use of some of these commands. There is the
    following script running on the system:


    ```bash

    #! /bin/bash

    #Sleep 10

    echo "It''s time to leave !!"

    date

    ```


    This program issues a warning after 10 minutes of being set to run, then displays
    the date and time. It would make no sense to leave this program running, locking
    the terminal while you could be doing other things, so it can be put in the background
    to free the terminal. After 10 minutes, the message appears. The program is called
    `latch.sh`.


    ```bash

    $ ./lock.sh & [1] 2906

    $ jobs

    [1]+ Running ./lock.sh &

    $ ps

    PID TTY TIME CMD

    1916 ttyp1 00:00:00 bash

    2906 ttyp1 00:00:00 lock.sh

    2907 ttyp1 00:00:00 sleep

    2909 ttyp1 00:00:00 ps

    $ fg 1.

    ./lock.sh

    here was typed: ctrl + z

    [1]+ Stopped ./lock.sh

    $ jobs

    [1]+ Stopped ./lock.sh

    [1]+ Stopped ./lock.sh

    $ bg 1

    [1]+ ./lock.sh &

    $ jobs

    [1]+ Running ./lock.sh &

    $ ... miscellaneous user commands while waiting for the message to appear ...

    $ It’s time to leave!!

    Tue Jan 10 16:01:51 PST 2006

    here was typed: enter

    [1]+ Done ./lock.sh

    $ jobs

    $ ps

    PID TTY TIME CMD

    1916 ttyp1 00:00:00 bash

    2935 ttyp1 00:00:00 ps

    $

    ```


    As can be seen, the program was executed in the background. The `job` command
    command showed the job `lock.sh` in all its states: running, suspending, and running,
    just as it did the `ps` command.


    ## Chapter 2: Users, Groups, Permissions and Users Administration

    ### Administrator Tasks

    The administrator of any type of server must be a specialized person, who knows
    his equipment, his applications, and his users as well as possible, keeping up
    with technological advances, reviews and patches of installed programs and the
    needs of your company.


    ### Planning and Forecasting Needs

    One of the main functions in the administration of computer systems is the detailed
    planning of management tasks, which can avoid unpleasant surprises when executing
    them.

    The systems analyst should advise the administrative staff of his company on technological
    needs in the acquisition of computer equipment, estimating the resources required
    by users in relation to the economic possibilities of the company.


    Once the equipment is received, an installation plan must be carried out, including
    at least the following information:


    * Documentation and study of available resources.

    * Forecast of possible extensions.

    * Fill in the application for registration in the corporate computer network and
    activation of the connection parameters.

    * Documentation of needs of the operating environment (UPS, air conditioning,
    etc.).

    * Documentation on registration, configuration, installation, and update of the
    operating system, the required applications, and the own programs by the services
    that the new equipment must provide.

    * Creation and publication of applications for opening and modifying user accounts,
    program installation, resource improvement, etc.


    ### Documentation

    The system manager also undertakes to carry out internal documentation for the
    Calculation Center, which must describe the following needs:


    * Updated registry of users and groups of the system.

    * Utilization policies and permissions for each user group.

    * Description of the common procedures to be performed by system operators (backups,
    account management, reports, etc.).

    * Complete and updated records of changes in the server configuration (operating
    system, applications, files, etc.).

    * Periodic collection and archiving of data on the performance of the system and
    its components.

