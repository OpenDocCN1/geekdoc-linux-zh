    # 介绍


    如果你不能像黑客一样思考，将更难防御破解者（crackers）的攻击。这就是伦理黑客的前提。安全泄露可能给企业带来巨大损害，可能窃取信息和资金，造成破坏以及许多其他损失。由于这些风险，银行、电信、大型企业等领域的公司一直在寻找专攻伦理黑客的专业人士。


    伦理黑客（也称为渗透测试人员，pentester）是专注于进攻安全的安全专业人员，即关注漏洞识别过程，并关注保护措施的。通常来说，他们做什么？他们付钱尝试入侵系统以发现漏洞。大多数伦理黑客通过两种方式成为渗透测试人员：通过自学，或者通过参加专业课程。耐心、坚持和执着是伦理黑客所需的素质。


    Linux 的诞生于 1991 年，由芬兰赫尔辛基大学的学生 Linus Torvalds 发起。他认为 Minix 过于简单，因此决定创建一个更复杂的类
    Unix 系统。由于 Linux 是开源的，任何人都可以查看并修改其代码，这使得 Linux 广泛普及。此处提供的信息声明是真实且一致的，这意味着任何由于疏忽或其他原因，在使用或滥用文中所包含的任何策略、流程或指令而导致的任何责任，均由接收读者自行承担。在任何情况下，出版者均不对由于此处信息直接或间接导致的任何赔偿、损害或金钱损失承担任何法律责任或责任。各自作者拥有出版者未持有的所有版权。此处信息仅供参考之用，且具有通用性。信息的呈现不带有合同或任何类型的保证说明。


