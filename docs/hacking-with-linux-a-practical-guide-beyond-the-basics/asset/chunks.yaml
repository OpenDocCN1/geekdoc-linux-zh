    * `inodes` 是当前使用的 inode 数量（代表学生用户拥有的文件数量）。

    * `inodes` 的软下限。

    * `nodes-i` 的硬上限。


    当使用软限制时，可能会发生两种情况：1) 如果没有建立宽限期（grace period），用户可以继续使用块（blocks）或 inode，直到达到硬限制，这将是其使用的绝对限制。2)
    否则，你将能够允许继续使用块或 inode，直到宽限期结束或达到硬限制（以先到者为准）。让我们在下面的图图中看看，当学生用户尝试在 `/srv/networks`（`/dev/mapper/vgcareerxyz-lvredes`
    的挂载点）保存一个 15 MB 的文件时会发生什么：


    ```bash

    dd if=/dev/zero of=/srv/networks/test.iso bs=15M count=1

    ```


    我们可以看到，该文件在 `/srv/networks/` 中为学生用户设置的硬限制处截断了。若要为组设置限制，请以相同的方法操作，只是我们将使用 `edquota
    -g student` # 编辑组配额。最后，要全局更改宽限期，必须使用 `edquota -t` 将时间间隔的值和单位更改所需的值。默认值（`7days`）可以替换为数值
    `X` 以及关键词 `seconds`、`minutes`、`hours`、`days`、`weeks` 或 `months`（分别代表秒、分钟、小时、天、周或月）。针对特定用户，个用户的宽限期设置应通过使用相同命令的
    `-T` 选项并指定用户来完成：`edquota -u student -T`。每个用户的宽限期应该比全局宽限期短。这样，`2weeks` 将块使用的宽限期改为
    2 周，`3days` 将 inode 使用的宽限期改为 3 天。


    ### 配额超限通知


    为了避免达到配额超限实例，我们有两个非常有用的资源来报告 i-blocks 和 nodes 的使用情况：`quota` 和 `repquota` 命令：


    ```bash

    quota -u student

    repquota /srv/networks

    ```


    这两个工具都表明，在这种情况下，学生用户已达到两个硬限制，因此宽限期已激活。要报告组配额的使用情况，我们也将使用 `quota` 但带有 `-g` 选项后跟组名。如果我们想立即通过电子邮件通知此情况，将使用
    `warnquota` 命令。当在不带参数的情况下调用此实用程序时，将检查已启用配额的文件系统。在识别出责任用户后，将向他们发送电子邮件通知上述情况。我们可以在
    `/etc/crontab` 中添加如下所示的一行，以便 `warnquota` 每小时执行一次任务：


    ```bash

    0 12 * * * warnquota

    ```


    ### 12. 启动与服务


    #### 启动过程


    在启动过程中，内核被加载以配置和激活服务。`x86` 上的 Linux 启动过程遵循以下步骤：


    1. `BIOS` 执行必要的检查并加载位于第一块磁盘上的加载程序。

    2. `GRUB` 执行第一步，选择分区。

    3. 内核被加载到内存中并挂载根分区。

    4. 内核加载必要的模块来控制特定设备。

    5. `SystemVInit` 或 `Upstart` 提供环境并启动服务。


    `GRUB` 的配置文件通常是 `/boot/grub/menu.lst` 或 `/boot/grub/grub.conf`。要更改选项，使用了 `warnquota`
    命令（注：此处原文可能为误，通常应为 edquota）。


