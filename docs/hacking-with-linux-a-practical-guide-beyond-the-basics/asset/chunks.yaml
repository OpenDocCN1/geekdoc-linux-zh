    = aquota.group,jqfmt = vfsv0 0 0" >> /etc/fstab

    echo "UUID = 01be396e-1a2e-407e-9f92-d74780536188 /srv/networks ext4 defaults,usrjquota
    = aquota.user,jqfmt = vfsv0 0 0" >> /etc/fstab

    ```

