  trans: "\n\n以下示例展示了执行 `ls` 命令的过程以查看 Ubuntu 10.04 Lucid 中默认定义的 `/etc/skel` 目录的内容和权限。\n\
    \n```bash\nls -al /etc/skel\ntotal 32\ndrwxr-xr-x 2 root root 4096 2010-05-02\
    \ 20:26 .\ndrwxr-xr-x 186 root root 12288 2010-05-30 13:49 ..\n-rw-r--r-- 1 root\
    \ root 220 2008-05-12 20:49 .bash_logout\n-rw-r--r-- 1 root root 3103 2010-04-19\
    \ 04:15 .bashrc\n-rw-r--r-- 1 root root 179 2010-03-26 13:31 examples.desktop\n\
    ```\n同样，在 Ubuntu 10.04 环境下 GNOME 2.30 文件浏览器的属性框的“权限”选项卡显示了来自上一个目录的 `.bashrc` 文件的数据。下表显示了执行某些命令所需的权限。\n\
    \n| 指令 | 源目录权限 | 文件权限 | 目标目录权限 |\n| :--- | :--- | :--- | :--- |\n| cd | X | 不适用\
    \ | 不适用 |\n| ls | R | 不适用 | 不适用 |\n| mkdir | W, X | 不适用 | 不适用 |\n| rmdir | W,\
    \ X | 不适用 | 不适用 |\n| cat | X | R | 不适用 |\n| rm | W, X | - | 不适用 |\n| cp | X |\
    \ R | W, X |\n| mv | W, X | - | W, X |\n\n## 特殊权限\n特殊权限补充了普通权限，增强了系统安全性，并用于支持某些特定的操作。与之前所示，根据目录条目的类型，`ls\
    \ -l` 表示的特殊权限字符如下：\n\n- **文件：**\n    - 激活用户标识符（所有者的 s）：一个可执行程序可以激活用户标识符 (SUID)，允许用户在程序执行期间成为文件的所有者。例如，`passwd`\
    \ 命令访问只有 root 用户可以修改的文件。该命令激活了 SUID，以便在程序执行期间，另一个用户在一段时间内是 root 并更改其密码。必须小心处理这些可执行文件，因为未经授权的用户可能会获取权限。\n\
    \    - 激活组标识符（组的 s）：与之前的情况，一个可执行程序可以激活组标识符 (SGID)，使用户可以执行文件所属组的操作。例如，`mail` 命令激活了\
    \ SGID，以便任何用户都可以访问自己的信箱，而无法读取任何其他用户的邮件。\n\n- **目录：**\n    - 交换目录（其他用户中的 t）：它允许在共享目录中，文件只能由所有者修改（通常用于如\
    \ `/tmp` 等临时文件目录）。\n    - 激活组标识符（组的 s）：在该目录中创建的文件将具有与目录本身相同的组，而不是所有者的组。\n\n管理员必须对在安装操作系统或任何应用程序后创建的、且包含特殊权限的所有文件和目录进行记录。你应该定期检查这些文件的状态，并验证它们没有被修改过。\n\
    \n## 符号和八进制表示\n`chmod` 命令用于修改上述访问权限，并支持两种表示法：符号表示和八进制格式的数值表示。下表显示了如何在两种表示法上分配权限。\n\
    \n| 普通权限 | 八进制值 | 符号表示 |\n| :--- | :--- | :--- |\n| 所有者：读取 | 400 | u+r |\n| 写入\
    \ | 200 | u+w |\n| 执行/访问 | 100 | u+x |\n| 组：读取 | 40 | g+r |\n| 写入 | 20 | g+w |\n\
    | 执行/访问 | 10 | g+x |\n| 其他用户：读取写入 | 4 | o+w |\n| 执行/访问 | 1 | o+x |\n\n| 特殊权限 |\
    \ 八进制值 | 符号表示 |\n| :--- | :--- | :--- |\n| 所有者激活用户 (SUID) | 4000 | u+s |\n| 组激活组\
    \ (SGID) | 2000 | g+s |\n| 其他用户：交换目录 | 1000 | +t |\n\n符号表示法用于添加 (+)、删除 (-) 或分配\
    \ (=) 按类型分组的权限。八进制数值表示用于一次性分配所有权限，应用逻辑或操作获取结果。例如：\n\n- `file1` 被分配所有者和相关组的读写权限，并移除其他用户的写入和执行权限。\n\
    - `file2` 直接为所有者分配读写权限，为组分配读取权限。用户没有任何权限。\n\n```bash\n$ chmod ug = rw, o-wx file1\n\
    chmod 640 file2\n```\n\n## 访问控制列表 (ACL)\nLinux 基础权限相当固定；但访问控制列表 (ACL) 作为文件系统的扩展，允许为用户和组定义不同的权限集。\n\
    \nACL 由一系列条目组成，条目指定了三个 Unix 权限的分配：读取 (r)、写入 (w) 或执行/访问 (x)，按此顺序；某些权限的缺失用连字符 (-)\
    \ 表示。下表显示了 ACL 的通用格式。\n\n`[类型]: [限定符]: 权限列表, ...`\n\n当文件定义了 ACL 时，`ls -l` 权限输出的第\
    \ 11 个字符为加号 (+) 即可指示。下表描述了管理 ACL 的主要命令。\n\n| 命令 | 描述 |\n| :--- | :--- |\n| getall\
    \ | 返回文件或目录的访问控制列表。 |\n| setfacl | 分配、修改或删除访问控制列表。 |\n\n"
