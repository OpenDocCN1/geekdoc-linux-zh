    # Introduction


    If you can''t think like a hacker, it will be harder to defend yourself from crackers.
    This is the premise of ethical hacking. A security breach can cause massive damage
    to businesses, potentially stealing information and money, cause damage, and many
    other losses. Due to these risks, companies from various areas such as banks,
    telecommunications, large corporations have been looking for professionals and
    specialized in ethical hacking.


    An ethical hacker (or pentester, as it is also commonly called), is a security
    professional specializing in offensive security, that is focused on vulnerability
    identification processes and, consequently, on the development of protection.
    Generally speaking, what does he do? paid to try to break into systems to detect
    vulnerabilities.


    Most ethical hackers become penetration testers by learning these techniques in
    two ways: either by learning hacking skills on their own or by taking formal classes.
    Many, like Grimes, coauthor of this text, have done both.


    Patience, persistence, and perseverance are important qualities for ethical hackers
    due to the time frame and level of concentration required to succeed in most attacks.
    Based on this fundamental knowledge, an ethical hacker will use specific techniques
    that will allow him to invade and detect system to perform ethical hacking. But
    these professional penetration testers must follow a code of ethics to guide everything
    they do. To do so, they need to develop skills in system administration.


