- fmt: "\n# Chapter 9: Shell Scripting\n\nPart of the flexibility of Linux lies in\
    \ the possibility it offers us to configure the work environment easily according\
    \ to the needs of each user. In addition, if you want to prevent a particular\
    \ account from being used for logging in, you usually configure `/bin/false` as\
    \ the default shell for that user. This is the case of accounts that are used\
    \ to run network services or processes exclusively in the background. The same\
    \ effect is achieved for all users if a file called `nologin` is placed inside\
    \ the `/etc` directory. This automatically disables any login attempt from any\
    \ account other than `root` and returns the content of the file for information\
    \ purposes. As if this were not enough, using only a text editor, we can create\
    \ our own programs and execute them from the command line to automate tasks.\n\
    \n## Configure the Shell Environment\n\nEach user has a series of scripts in their\
    \ personal directory in the form of hidden files that configure their environment.\
    \ For example, `~/.bash_profile` (or `/.profile`) and `/.bashrc` store one or\
    \ more aliases and environment variables, while `~/.bash_history` and `~/.bash_logout`\
    \ save the command history and an optional list of actions to take when we close\
    \ our user session.\n\nThese files can, in turn, execute other scripts through\
    \ the `source` command or using the period (`.`). As a shortcut, as we can see\
    \ in the following image. The result in both cases is the same: the second script\
    \ is launched within the same environment as the first. As a consequence, any\
    \ variable or alias that is set in the second will be available in the environment\
    \ of the first.\n\n## Chained Execution of Commands\n\nSo far, we have talked\
    \ about executing commands one by one from the terminal. However, Bash allows\
    \ us to execute a series of commands from a single line, and even do so under\
    \ certain conditions. In particular, when writing `command1`, `command2`, `command3`,\
    \ and press Enter, Bash will execute `command1`, then `command2` and finally `command3`\
    \ without stopping in case of any failure.\n\nOn the other hand, `command1 &&\
    \ command2` it will cause `command2` to only run in case `command1` has finished\
    \ successfully, while `command1 || command2` will cause `command2` to be executed\
    \ only in case `command1` fails.\n\nConsider the following examples to illustrate,\
    \ the result of which we can see below:\n\n```\ncd; echo \"I am an intermediate\
    \ command\"; ls -l /user && echo \"This message will appear only if /user exists\"\
    \nls -l /user || echo \"This message will appear if /user does not exist\"\n```\n\
    \nA classic example of the use of `&&` is in the process of installing a package\
    \ only if the repositories update was successful. In other words, `apt-get update\
    \ && apt-get install tmux` will only attempt to install the `tmux` package if\
    \ synchronization with repositories is successfully completed in Debian or the\
    \ like. The same applies to CentOS or similar distributions with `yum`, for example.\n\
    \nAs we can see, in the first example, all the commands in the list were executed\
    \ one after the other, while in the next two, that depends on the output status\
    \ of the command with which the list starts. Recall that the exit status or exit\
    \ status of a command will be `0` if it finished successfully or a different number;\
    \ otherwise, which can we verify through `echo $?` anytime.\n\n## Shell Scripting\n\
    \nOne of the ways to discover the power of the command line in Linux is by creating\
    \ shell scripts, which are executable plain text files that contain command after\
    \ command on successive lines. These commands are interpreted by a shell, a program\
    \ that takes them as input and acts as an interface for the kernel to execute.\n\
    \n### First Steps\n\nThe custom, when presenting a new programming language, is\
    \ to show the classic message “Hello World” on the screen. Let's take a different\
    \ course to do something a little more interesting, useful, and that allows us\
    \ to present basic concepts.\n\nUsing a text editor, let's write the following\
    \ within `primerscript.sh`:\n\n```bash\n#!//bin/bash\n# The current date = $(date\
    \ +%d/%m/%Y)\n# Number of open sessions = $(who | wc -l)\n# Message\necho \"Today\
    \ is $DATE. There are $SESSIONS open sessions.\"\n```\n\nLet's make some clarifications:\n\
    \n*   The first line of the script should always indicate the shell with which\
    \ we want to execute it. On most occasions, we will choose Bash. The absolute\
    \ path to the shell must be preceded by the characters `#!`.\n*   Except for the\
    \ first line of the script, all those that begin with a numeral sign (`#`) are\
    \ informative comments. We will use them to explain the purpose of the commands\
    \ that follow, in order to clarify the operation of our script to another person\
    \ to examine it in the future (and to remind ourselves too!). These lines are\
    \ not interpreted by the shell during script execution.\n*   To avoid having to\
    \ repeat the same command in several parts of the script, and to facilitate its\
    \ reading too, we will often want to save the result in a variable. That way,\
    \ if we want to change the command in the future, we will only have to do it in\
    \ the place where we declare the variable. In the example above, we save the output\
    \ of the commands that indicate the current date and the number of user sessions\
    \ opened in the variables `DATE` and `SESSIONS`, respectively. After indicating\
    \ the desired name for the variable, we place the signs `=` and enclose the command\
    \ in parentheses.\n*   Finally, the `echo` command will help us to display a message\
    \ on the screen in which we mix text of our choice with the value of `DATE` and\
    \ `SESSIONS`. When we want to use the value saved in a variable in another part\
    \ of the script, we do so by putting the `$` sign before the variable name. At\
    \ this point, we can realize that it is much friendlier to read \"Today is $DATE\"\
    \ than \"Today is $(date +%d/%m/%Y).\"\n\nWe close the file saving the changes\
    \ and give execution permissions to the newly created file: `chmod +x primerscript.sh`.\
    \ As a final step, let's run the script with a period and a bar before the name\
    \ (this is necessary to indicate that `primerscript.sh` is an executable file\
    \ present in the current directory, where usually the system does not expect to\
    \ find such files): `./primerscript.sh`\n\n## Positional Arguments\n\nWe will\
    \ often want to apply an action to different objects, so to avoid having to modify\
    \ the script for each particular case, we can make use of parameters - that is,\
    \ values that we pass to the script at the time of executing it. Within the script,\
    \ the first parameter is called by `$1`, the second as `$2`, and so on.\n\nThe\
    \ following script (`backupbasic.sh`) expects two parameters:\n- Directory to\
    \ compress\n- Desired name for the resulting tarball\n\n```bash\n#!//bin/bash\n\
    # The directory to be compressed is the first parameter\nDIRECTORY=$1\n# Name\
    \ of tarball\nFILE=$2\n# Compress the contents of $DIRECTORY\ntar czf $FILE $DIRECTORY/*\n\
    # Display message on the screen\necho \"You have finished backing $DIRECTORY in\
    \ $FILE.\"\n```\n\nLet's give the script permission to execute: `chmod +x backupbasic.sh`.\
    \ And let's run it by passing `/var/log/httpd` and `primerbackup.tar.gz` as parameters:\
    \ `./backupbasic.sh /var/log/httpd primerbackup.tar.gz`. As we can see in the\
    \ image above, the script was executed correctly since its output status is equal\
    \ to `0`.\n\n## Conditionals\n\nThe most elementary form of flow control in any\
    \ programming language is the use of an `if / else` structure. In shell scripting,\
    \ it is implemented as follows:\n\n```bash\nif [CONDITION]; then\n    ACTION\n\
    else\n    [ALTERNATIVE ACTION]\nfi\n```\n\nThe indentation of the code, although\
    \ not strictly required by Bash, helps to read the script. Among the possible\
    \ conditions, we might want to check are the following, although there are more\
    \ alternatives:\n\n*   Existence of a file or directory\n*   Successful completion\
    \ of the last command executed\n*   Verification of empty files\n\nTo exemplify,\
    \ we will take the script we created above (`backupbasic.sh`) and modify it to\
    \ meet the following conditions:\n"
