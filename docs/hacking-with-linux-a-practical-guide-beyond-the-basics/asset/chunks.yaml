    # 6. 用户个人目录的路径


    # 7. 用户命令解释器（通常使用 `/bin/bash`）


    大多数发行版预留了前 1000 个 UID（从 `0` 到 `999`）。这些被称为系统 UID，仅供系统使用。人类用户的 UID 始终从 `1000` 开始。


    ## 用户与组


    Unix 用户既代表某个人（真实用户），也代表一个管理服务或应用程序的实体（逻辑用户或虚拟用户）。系统中定义的每个用户对应一个唯一的标识符（`UID`）和一个账户，其个人数据存储在预留的磁盘区域中。


    组是一个逻辑结构——具有唯一的名称和标识符（`GID`），用于将多个账户组合到一个共同目的中，并在某些资源上共享相同的访问权限。每个账户必须至少包含在一个用户组，这称为主组（primary
    group）。


    ## 账户的通用特性


    定义用户账户的特征有：


    * 它在系统中具有唯一的名称和用户标识符（`UID`）。

    * 属于主组。

    * 可能属于其他用户组。

    * 可以定义与账户所有者相关的信息。

    * 它有一个用于用户数据的关联个人目录。

    * 用户在连接时使用特定的命令解释器，可以在其中运行其应用程序和操作系统实用工具。

    * 用户必须有一个个人密码，且该密码难以被冒充者破解。

    * 它有自己的输入配置文件，在其中定义了其操作环境的基本特征。

    * 可能有过期日期。

    * 可以为每个文件系统定义磁盘配额。

    * 可能拥有一个审计系统，记录用户执行的操作。


    ## 系统文件


    Linux 提供了几种方法来定义可以连接到系统的用户。通常，用户和组账户在每台服务器上本地定义，尽管也可以使用外部认证方法，允许多台机器共享共同用户的定义。


    下表显示了定义本地用户过程中涉及的系统文件。


    | 格式 | 描述 |

    | :--- | :--- |

    | `/etc/passwd` | `User:x:UID:GID:Description:Direct:Shell...` | 本地用户的主文件，其字段为：<br>1.
    用户名。<br>2. 空（曾用于密码）。<br>3. 用户标识符（`UID`）。<br>4. 主组标识符。<br>5. 代表该用户的个人描述或全名。<br>6.
    个人目录。<br>7. 强制解释器。 |

    | `/etc/shadow` | `User:password:F1:N1:N2:N3:N4:Caduc:...` | 包含账户访问密钥加密和限制的隐藏文件。其字段为：<br>1.
    用户名。<br>2. 加密密钥。<br>3. 上次更改密码的日期。<br>4. 可以更改密码的天数。<br>5. 请求再次更改密码的天数。<br>6. 密码更改更改的天数。<br>7.
    账户过期后禁用账户的天数。<br>8. 过期日期。<br>9. 预留。注意：日期自 `1970` 年起计算。 |

    | `/etc/group` | `Group:x:GID:Users...` | 包含组的定义。其字段为：<br>1. 组名。<br>2. 未使用。<br>3.
    标识符（`GID`）。<br>4. 成员列表。 |

    | `/etc/gshadow` | `Group:password:Admins:Users...` | 包含密钥的隐藏文件。其字段为：<br>1. 组名。<br>2.
    密码。<br>3. 管理员用户。 |


    ## 创建用户和组


    要创建一个用户，我们将使用 `useradd` 命令。默认情况下，用户的个人目录将在 `/home/` 下创建，并将 `/bash` 分为 shell：


    ```bash

    useradd john

    ```


    如果我们想将用户的 shell 改为 `/bin/sh`，我们将使用 `usermod` 命令配合 `-s`（更改 shell）和 `-d`（更改家目录）选项，以及
    `-c`（注释）：


    ```bash

    usermod -s /bin/sh

    ```


    要为用户分配初始密码，我们将使用 `passwd` 命令：


    ```bash

    passwd john

    ```


    在第一次登录后，用户可以使用相同的命令更改密码，无需指定用户名：


    ```bash

    passwd

    ```


    例如，我们现在将看到如何编辑某个账户，使该账户在 2018 年 12 月 31 日过期（`-E`），在此期间，允许每周仅更改一次（`-m`，即 7 天）。每个密码的有效期最多为
    60 天（`-M`），并且在过期前 3 天必须发送提醒（`-W`）。最后，在密码过期 5 天后，账户将被锁定（`-I`）：


    ```bash

    chage -E 2018-12-31 -m 7 -M 60 -W 3 -I 5

    ```


    为了安全起见，我们可以强制用户在下次登录时更改密码：


    ```bash

    chage -d 0 john

    ```


    显示给定账户信息的另一种方法是使用 `finger` 命令，后跟所查询用户名：


    ```bash

    finger john

    ```


    ## 组管理


    在 Linux 中，组是控制系统资源访问的第一种方法。当创建一个用户账户时，也会创建一个同名的组（称为该账户的主组），并将两者关联起来。


    要创建一个名为 `migroup` 的新附加组，我们将使用 `groupadd` 命令：


    ```bash

    groupadd migroup

    ```


    然后，为了将该用户添加到组中，我们将再次使用 `usermod` 命令，配合 `-a`（追加）和 `-G`（组）选项，后跟组名和我们要添加的用户名：


    ```bash

    usermod -a -G migroup john

    ```


    要从附加组中删除用户账户，有两种替代方案：


    * 使用 `usermod -G` 后跟用户需要保持活跃状态的组，最后是目标用户名。

    * 使用 `gpasswd -d` 后跟要从中删除的用户名和组名。


