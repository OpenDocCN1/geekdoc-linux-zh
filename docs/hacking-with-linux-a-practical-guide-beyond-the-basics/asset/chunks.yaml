    ## 逻辑卷


    逻辑卷是 Linux 内核 2.4 版本开始提供的存储管理技术——继承自 AIX 操作系统（IBM 的 Unix 方言）——它允许你调整分区大小并将其分布在多个磁盘上。在某些
    Linux 发行版中，可能会受到逻辑卷管理器 (`LVM`) 的限制，即 `/boot` 目录必须位于实际分区中，而不能是任何逻辑卷的一部分。当逻辑卷将存储系统自己的文件系统时，必须在安装过程中定义逻辑卷。逻辑卷管理器由
    3 个基本元素组成：


    | `Physical Volume:` | 代表物理磁盘的结构。 |

    | `Logical Volume:` | 等同于 Linux 文件系统的结构。 |

    | `Volume Group:` | 多个逻辑卷的集合，可以存储在多个物理卷中。因此，一个磁盘可以包含多个文件系统，一个文件系统也可以记录在几块磁盘上。
    |


    系统安装程序必须遵循以下步骤：


    * 如果 Linux 发行版较旧，为 `/boot` 目录创建一个 `Ext3` 类型的普通分区，将其包含在根目录中或单独分区中。

    * 在每块磁盘上定义一个物理卷。

    * 通过合理组合物理卷来创建卷组。

    * 定义每个卷组的逻辑卷，为每个逻辑卷分配初始大小和挂载点。


    建议留出一些未分配的空间以扩展需要的分区。系统包含了许多种命令来管理逻辑卷管理器的每个组件。下表根据其功能描述了大部分这些指令。


    | Operation | Physical volume | Group Volume | Logical Volume |

    | :--- | :--- | :--- | :--- |

    | Create | `pvcreate` | `vgcreate` | `lvcreate` |

    | Remove | `pvremove` | `vgremove` | `lvremove` |

    | Check status | `pvscan` | `vgscan` | `lvscan` |

    | Change the size | `pvresize` | `vgresize vgextend vgreduce` | `lvresize lvextend
    lvreduce` |

    | Show information | `pvs` | `vgs` | `lvs` |

    | Show attributes | `pvdisplay` | `vgdisplay` | `lvdisplay` |


    下表显示了一个真实示例，用于定义一组带有两个磁盘的 `vg0` 卷组，其中定义了 3 个逻辑卷；随后管理员可以使用它们挂载服务器文件系统。


    ## 远程文件系统


    远程连接计算机在信息共享过程中是一个巨大的优势。远程文件系统允许将信息存储在中心节点并让不同的客户端访问，从而实现用户的移动性。在本章最后，将描述最常用的远程文件系统。


    ### NFS


    网络文件系统 (NFS) 由 Sun Microsystems 为 SunOS（其 Unix 方言）使用远程过程调用 (`RPC`) 技术创建。NFS 允许像访问本地文件一样访问远程文件，对客户端而言完全透明，且与服务器架构无关。IETF
    [11] 在其 RFC 3530 中规定了 NFS 第 4 版本 (`NFSv4`)，重新定义了协议并包含了文件使用阻塞、安全协商、ACL、平台互操作性、国际化等改进。下表描述了在
    NFS 服务器和客户端上必须激活的服务。


    | Service | Description |

    | :--- | :--- |

    | `portmap` | `RPC` 的主服务。 |

    | `rpc.mountd` | NFS 客户端组控制。 |

    | `rpc.nfsd` | NFS 服务器。 |

    | `rpc.statd` | 网络状态监控 (NSM)，用于通知 NFS 服务器重启。 |

    | `rpc.rquotad` | 为远程用户提供配额信息。 |


    `/etc/exports` 文件包含服务器上的 NFS 配置。下表描述了文件的格式，每行对应一个导出的目录。


