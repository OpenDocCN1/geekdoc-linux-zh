    换句话说，考虑到此时用户是前一个图像所示的组的成员，使用以下两个命令中的任一个都可以将其从 `migroup` 组中移除：


    ```

    usermod -G JohnGpasswd -d John Migroup

    ```


    如果我们的目的是删除用户账户及其主目录和邮件队列，我们将执行以下操作（如果我们只兴趣删除账户但想保留这些资源，则必须省略 `-r` 选项）：


    ```

    userdel -r john

    ```


    要删除指定的组（在以下示例为 `migroup`），我们将使用迁移组。


    ## 预定义的用户和组


    在所有的 Unix “方言”中，操作系统都预定义了一些用户和组，用于管理和控制计算机提供的不同服务。

    特别是 `root` 用户——`UID 0`——是机器的管理员，对系统拥有完全控制权。还有一个 `root` 组——`GID 0`——具有管理特性，上述用户属于该组。

    例如，下表列出了 Fedora 13 (1) 和 Ubuntu 10.04 Lucid (2) 中一些预定义的用户和组，并指出了可能存在的差异。


    | User | UID (1) | UID (2) | Description |

    | :--- | :--- | :--- | :--- |

    | root | 0 | 0 | 拥有完全控制权的管理员。 |

    | bin | 1 | 2 | 操作系统实用程序的所有者。 |

    | daemon | 2 | 1 | 通用服务管理器。 |

    | adm sys | 3 | 3 | 历史和管理记录存档的所有者。 |

    | lp | 4 | 7 | 打印服务管理员。 |

    | nobody | 99 | 65534 | 杂项服务管理器。 |

    | ftp | 14 | 50 | 匿名 FTP 服务树控制器 .. |

    | sshd | 74 | 123 | SSH 服务的虚构用户管理器。 |

    | apachewww-data | 48 | 33 | Apache 超文本服务文件和目录的所有者。 |

    | squidproxy | 23 | 13 | Squid 代表服务控制器。 |


    | Group | GID (1) | GID (2) | Description |

    | :--- | :--- | :--- | :--- |

    | root | 0 | 0 | 拥有完全控制权的管理员。 |

    | bin | 1 | 2 | 系统二进制文件。 |

    | daemon | 2 | 1 | 通用服务。 |

    | sys | 3 | 3 | 系统控制。 |

    | adm | 4 | 4 | 历史和管理文件。 |

    | tty | 5 | 5 | 控制台访问。 |

    | lp | 7 | 7 | 打印服务。 |

    | kmem | 9 | 15 | Linux 内核内存控制。 |

    | cdrom | 11 | 24 | 访问可移动磁盘 (CDROM, DVD)。 |

    | man | 15 | 12 | 手册页。 |

    | admin | | 123 | 可以执行 sudo 命令的管理员。 |

    | apachewww-data | 48833 | HTTP 超文本服务。 |

    | sshdssh | 484111 | SSH 安全连接服务。 |

    | users | 100 | 100 | 普通用户。 |

    | nobody | 99 | 65534 | 服务控制。 |

    | squidproxy | 23 | 13 | 代表服务。 |


    你将看到 Ubuntu 10.04 Lucid（左）下 GNOME 2.30 环境的 `users-admin` 以及 Fedora 13（右）的 `system-config-users`
    等基本用户管理工具。

    管理计算机提供的服务的虚拟用户必须禁用其账户，以避免成为入侵者的可能网关。这通过阻塞访问代码并将 `/sbin/nologin` 分配为账户解释器来实现。


    ## 默认定义的 Root 用户


    Ubuntu 和 Fedora 在其安装程序建立了不同的策略，以定义默认使用超级用户账户（`root`）的方式。

    如前一节所示，在两种情况下，账户名称相同，`UID` 和 `GID` 参数也相同。然而，Fedora 安装程序要求为该用户设置密码，而 Ubuntu 则没有要求。

    Ubuntu 不允许以 `root` 身份直接连接系统，只有属于 `admin` 组的用户才能通过 `sudo` 命令并输入自己的密码来执行特权命令。

    下表总结了两个操作系统在定义 root 账户方面的差异。


    | Characteristic | Ubuntu 10.04 | Fedora 13 |

    | :--- | :--- | :--- |

    | Password | 无密码 | 在安装时定义 |

    | Access to the system | 无访问 | 可访问 |

    | A user can execute orders as root | 订单 `sudo`（admin 组成员） | 未配置 sudo 命令 |

    | A user can run the root interpreter | 你的 `sudo`（admin 组成员） | 任何用户均可。 |


    ## 密码


    如上所述，本地 Linux 用户的密钥以编码形式存储在不可访问的 `/etc/shadow` 文件中。

    密钥的编码算法是“单向”的，也就是说它们防止密钥被直接解码。因此，当用户进入系统时，密码会被加密并与有效的加密密钥进行比较。如果结果正确，用户即可连接。

    Linux 可以使用旧 Unix 系统中的 `Crypt` 编码算法，该算法以执行计算的 C 语言函数命名。这种方法是不安全的，因为它使用了弱的 56 位加密密钥，且密码最多只能有
    8 个字符。

    新的 Linux 还支持更强大的编码算法，如 `MD5` 或 `SHA`，它们更健壮且允许更大的长度。`MD5` 使用 128 位，而 `SHA`（在 Fedora
    13 和 Ubuntu 10.04 中默认）增加了这一长度。


    ## 获取安全密钥的限制


    管理员应建议用户创建黑客难以发现的密码。还必须通过使用复杂的编码和创建增加用户的限制条件，使系统为入侵者制造困难。由于系统中的所有用户在设置密码时必须考虑以下建议：


    - 不要使用与个人相关的常用单词或数字。

    - 不要在不同的机器上重复使用密钥。

    - 使用至少 8 个字符的密钥，并至少包含 2 个非字母字符。

    - 不要使用键盘序列。

    - 定期更改密码，不要重复之前的密码。

    - 不要遗留或写下密码。

    - 防止他人输入密码。


    ## 权限


    Unix 安全性的主要元素之一是正确使用权限访问文件和目录。每个用户——而不只是管理员——都必须清楚最基本的概念，以防止其他用户读取、修改甚至删除感兴趣的数据。

    管理员用户——拥有系统的完全控制权——也可以对任何用户的文件和目录执行操作。

    我们可以将权限策略分为三大类。其分类如下：


    1. 应用于所有者（`Owner`）的权限

    2. 应用于组（`Group`）的权限

    3. 应用于系统中未在 1 或 2 中考虑的其他（`Other`）用户


    根据这些类别，我们可以对这三种权限中的每一种应用读取（`r`）、写入（`w`）和执行（`x`）：


    - `r`: 表示用户具有读取权限。你可以执行如 `ls`、`cat` 等读取命令。

    - `w`: 表示用户具有写入权限。这将允许你编辑文本文件，例如。

    - `x`: 表示你具有执行权限。你可以运行脚本。


