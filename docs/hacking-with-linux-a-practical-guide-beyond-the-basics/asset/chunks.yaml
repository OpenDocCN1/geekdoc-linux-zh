- fmt: '

    # Automation

    The IT staff of a company must periodically execute the functions defined in the
    action plan. The programmer needs to automate most of these repetitive procedures
    to avoid typographical or conceptual errors and to improve the overall treatment
    of applications. At least the following tasks must be automated on each server:


    - Checking the free space on the disks.

    - User account management and periodic review of disk quotas.

    - Procedures for creating, checking, and restoring backup copies, according to
    the action plan.

    - Check and record the overall performance of the system and the computer network.

    - Specific jobs (reports, service management, documentation creation, etc.).

    - Creation of security alerts (change checking, intrusion detection, etc.).


    # Inform Users

    The system administrator must also keep their users informed and give them operation
    and good use guides, which can avoid errors caused by ignorance. It is also necessary
    to report on the changes that may affect each user group, indicating the following
    information:


    - The nature of the changes that will be made in the system and their temporal
    evolution.

    - When each modification will be made.

    - What results are expected with the operation, and what are the results.

    - Estimated time and real-time of the duration of the operation.

    - Possible impact on users (new configuration, system shutdown, etc.).

    - Contact information to collect questions and queries.


    On the other hand, the person in charge of the system must know the general behavior
    of its users deeply, recording their queries, their suggestions and the performance
    and resource usage data. This allows us to offer better quality in the services
    offered.


    # System Security Control

    Depending on the type of information processed by the system, the administrator
    must define their security policies, both for the server and for the corporate
    network, since users have the right to the privacy and integrity of their data.
    The means must be put in place to avoid possible attacks or computer failures
    that affect - or even paralyze - the normal operation of the machine. You should
    never have the presumption that a system is completely secure or that it can only
    be attacked from outside. Therefore, the superuser must perform the following
    operations:


    - Activate and review historical records of incidents.

    - Perform periodic reviews of possible unwanted changes in the system.

    - Installing the devices and applications that ensure the safety of the computer
    network and the servers (firewalls, filters, intrusion detections systems, access
    card readers etc.).


    # Failure Forecast

    Finally, the company must put the necessary physical means in place to prevent
    and correct possible computer failures. Environmental changes (electrical, temperature,
    humidity...) are some of the most important and expensive aspects of error prevention.
    The following topics should be emphasized:


    - Have the correct electrical installation, which prevents unexpected drops and
    rises in voltage, as well as installing uninterruptible power supplies (`UPS`)
    that protect the company''s critical services (communications cabinets, servers,
    etc.).

    - Have an adequate air conditioning system that filters and regulates the temperature
    and humidity of the environment, without affecting the health of the operators.

    - Have adequate lighting, which does not affect the computer power line.

    - Maintain an adequate infrastructure in the computer network, with convenient
    and restricted access to communications devices.


    Other possible causes of failures that are more difficult to predict are:


    - Saturation or failure of system resources (processors, memory, disks, etc.).
    The need to request the extension or replacement of the affected components must
    be weighed.

    - Programming failures, both in the S.O., as in the installed applications or
    in the own programs. The administrator must stay informed about the updates and
    patches that he has to install.

    - Human errors of the administrator himself, of the operators, of the technical
    service or of the end-users.


    # Permissions and Users Administration

    The administration of user and group accounts on Linux is a fundamental task of
    any system administrator. In this chapter, we will show you how to create, modify,
    and delete user accounts and groups in Linux. This also includes how to set permissions
    for these groups and users to access files and directories as they need.


    ## Introduction To User Administration

    The internal database of users in GNU / Linux is related to two files:

    - `/etc/passwd` contains the names of the users

    - `/etc/shadow` contains the password encrypted with `SHA512`


    A good security policy is to change passwords periodically. By doing this, even
    if they can decrypt our passwords, doing so will require much more time and, hopefully
    by the time they manage it, we will have changed it again. Passwords must be combinations
    of letters and numbers, including upper and lower case letters, in addition to
    special characters such as `%`, `_`, or `$`.


    ## File Description / /etc/passwd

    When we add a user, the operating system adds a line in the file `/etc/passwd`
    and also adds a group for each user created in `/etc/group`. Working with groups
    makes the administrator''s task easier since they allow more efficient and less
    laborious permission management.


    When adding a user, we add not only this and a group but also their mailbox. The
    mail file is created in the `/var/spool/mail/` directory, and finally, your personal
    directory is created (usually simply called home). It is in this last location
    that each user keeps their personal files organized in subdirectories. Outside
    there, you cannot write (except in the directories `/tmp` and `/var/tmp`).


    > NOTE: When adding a new user account, the `.bashrc`, `.bash_profile`, and `.bash_logout`
    files are also copied from `/etc/skel/` to your home. The first two contain information
    on the user''s prompt and command aliases, while the third stores information
    on what to do when the user executes the logout (system exit).


    All this happens simultaneously when we register new users. For this, the operating
    system uses `PAM` (Plugable Administration Module). `PAM` modules are defined
    in the `/etc/pam.d` directory.


    The user and service login process is related to `PAM` (Plugable Authentication
    Module). Therefore, before starting to work with the commands to add users, let''s
    see how the operating system validates these.


    `PAM` is a hierarchy of authentication checks and authorizations. These checks
    are distributed in administration groups. These groups are composed of one or
    more stacked `PAM` modules, each of which performs a specific test function. Some
    of these checks may be mandatory (such as user existence) and others optional.


    > NOTE: The `PAM` configuration is in the `/etc/pam.d/` directory. Each application
    or service with `PAM` capabilities has a file in the `/etc/pam.d/` directory.
    Each file in this directory has the same name as the service to which it controls
    access. If an application uses `PAM`, it is responsible for defining its service
    name and installing its own configuration file in the `/etc/pam.d/` directory.
    For example, the login program defines its service name as `login` and installs
    the `PAM` configuration file in `/etc/pam.d/login`.


    Let''s look at the lines corresponding to the root and student users in the `/etc/passwd`
    file:

    ```

    root: x: 0: 0: root: /root: /bin/bash

    student: x: 1000: 1000: student,,: /home/student: /bin/bash

    ```

    Each line is divided into 7 fields separated from each other by the character
    `:` (two points). The meaning of each field is as follows:


    1. Username

    2. If it contains an `x`, it indicates that the user has an encrypted password
    within `/etc/shadow`.

    3. UID (User ID)

    4. GID (Group ID)

    5. Full name of the user, and optionally additional information about it, such
    as the work phone or home phone

    6. Descriptive comment about the user.

