    A partition is each of the subdivisions that the system manager defines in a system
    disk drive, where a certain file system or paging space is stored. Following the
    rules described in the previous section, the administrator must define the different
    file systems of his system, creating partitions on each disk, taking into account
    the available resources, and the main use that users will make of them. The process
    of creating the basic file systems is usually done during the installation of
    the machine, although they can be added and extended later. The following table
    defines a typical distribution and indicates some recommendations.


    | File System | Recommendations |

    | :--- | :--- |

    | `/` | It is necessary to work, and it does not have to be large. |

    | `/proc` | It is necessary to work and should occupy between half and double
    the physical memory, inversely to its size. |

    | `/usr` | It contains the operating system; its size depends on the packages
    to be installed and the expansion forecasts. |

    | `/tmp` | Space for temporary files depends on the number of users to be defined
    and the estimated space for their work. |

    | `/var` | It will have files that grow, a sufficient size should be provided,
    but without wasting disk space. |

    | `/boot` | It can be used to store the bootloader; It is used when it is necessary
    to load a driver to locate the root file system. |

    | `/home` | User accounts; It may be advisable to use a separate disk, the size
    of which will depend on the number of users and the estimated capacity of their
    accounts. |

    | `/usr/local` | It must be large enough to store installed utilities and applications;
    It is advisable to use a separate disk. |


    Although Linux distributions often include graphical tools that help manage storage
    space, both during the installation and normal execution period, certain applications
    that have a separate appearance can be included.


    ## File Systems Ext3 And Ext4


    Linux supports the mounting of different file systems, both local and remote,
    as an interface between them, and the kernel, known as Virtual File System (`VFS`),
    has been programmed. The most used file system in Linux, until some years ago,
    was known as Extended File System 2 (`Ext2`), which increased the performance
    of the first version, but still presented problems in the event of an unexpected
    system crash, as it needed a Long process of checking and correcting.


    Modern Linux distributions use the Extended File System 3 (`Ext3`), which includes
    the following improvements:

    - The journal of records is the most important feature, which improves the integrity
    review processes since only the verification of said journal is required.

    - Supports higher levels of data integrity to avoid file system corruption, allowing
    you to choose the type and level of protection.

    - Greater flow and faster speed of repeated data access.

    - Easy transition between `ext2` and `ext3`, without re-formatting partitions.


    The Linux kernel includes support for Extended File System 4 (`Ext4`) as of version
    2.6.30; therefore, `Ext4` is incorporated by default in new installations of Fedora
    13 and Ubuntu 10.04 Lucid. The `Ext4` file system includes the following improvements
    with respect to `Ext3`:

    - Larger file system size (up to `1 EB = 220 TB`).

    - No restrictions on the number of subdirectories.

    - The higher processing speed of large files through "extents".

    - Prior disk allocation or delayed allocation.

    - Checking the file system registry.

    - Live defragmentation without the need to disassemble the file system.

    - Recovery of deleted files.

    - Faster checks on the status of the file system.

    - Timestamps have nanosecond precision.

    - Upgradeable from `Ext3` (you can return to `Ext3` losing the “extents”).


    The permanent configuration of file systems mounted on a server is defined in
    the `/etc/fstab` file, including data on the source device, the mount point, the
    type of the file system, as well as the set of mounting options, debugging and
    checking the consistency of the data. The following table describes the general
    format of the configuration file `/etc/fstab`.


    | Format | Description |

    | :--- | :--- |

    | `/etc/fstab` | Mounting Type Options... | File description file system. His
    fields are: |

    | | 1. Label or UUID of the partition, device, or remote directory. |

    | | 2. Local assembly point. |

    | | 3. Type of file system (`ext3`, `ext4`, `swap`, `vfat`, `ntfs`, `nfs`, `cifs`,
    etc.). |

    | | 4. Mounting options (depend on the type of file system). |

    | | 5. Automatic safety dump control against system crashes. |

    | | 6. Order of data consistency checks during server startup (1 for `/`, increase
    in file systems of different disks). |


    In addition, the most common commands in file system management are briefly described
    below.


    | Mandate | Description |

    | :--- | :--- |

    | `fdisk `sfdisk` | Manipulation of the partition table of a disk. |

    | `parted` | Partition management and file systems. |

    | `mkfs` | Format a new partition. |

    | `mount` | Mount a file system in the global directory tree. |

    | `umount` | Remove a file system. |

    | `tune2fs` | Converter between `ext2`, `ext3`, and `ext4` file systems. |


    ## Pagination And Processes


    ### Paging Spaces

    A multi-user and multitasking operating system such as Linux needs a large amount
    of physical memory to run all processes. Pagination spaces are disk partitions
    that allow you to virtually expand the system memory, keeping the state of the
    processes that are waiting to be executed at any given time, if the physical memory
    is depleted.


    The main factors that should determine the size of the total paging space are:

    - The amount of memory and disk in the system.

    - The number of users who will have access to the machine.

    - The expected number of processes/user.

    - The number of active services in the system.

    - The estimated number of customers/service.


    Due to the growth of the memory in the new servers, the general rule is to use
    for paging between half and double the physical memory installed. In case of need,
    the administrator can expand the amount of paging using disk files that can be
    subsequently deleted. The following table describes the Linux commands used to
    manipulate the paging spaces.


    | Mandate | Description |

    | :--- | :--- |

    | `fdisk` | The disk manager used to define partitions. |

    | `mkswap` | Create partitions or paging files. |

    | `swapon` | Activate a partition or paging file. |

    | `swapoff` | Disable a partition or a paging file. |


    ### Virtual file systems /proc and /sys

    The virtual file systems mounted in `/proc` and `/sys` are stored in memory and
    contain a hierarchy of files and special directories that maintain the current
    state of the Linux system kernel, collecting information about the devices and
    running processes. The following table shows the typical format of the definition
    of both file systems in the `/etc/fstab` file.


    | sysfs | /sys | sysfs defaults | 0 0 |

    | :--- | :--- | :--- | :--- |

    | proc | /proc | proc defaults | 0 0 |


    Most virtual `/proc` files appear with length 0, although they can be reviewed
    as if they were text files, some of them with a lot of information. In `/proc`
    there are a series of special directories that describe the current status of
    each running process - denoted by the process identifier (`PID`) - including data
    such as: the line of the executed order, the root and working directories of the
    process, memory states, execution and use of processors, environment variables,
    etc. Other files and directories of interest are those that inform about processors,
    memory, interruptions, devices, partitions, mount points, kernel modules, network
    parameters, etc.


    The special directory `/proc/sys` contains files that can only be modified by
    the administrator to make configuration changes in the kernel, enabling or disabling
    certain operational features. Great care must be taken when modifying virtual
    files in `/proc/sys`. The following table describes the contents of that directory
    `/proc/sys`.


    | Directory | Description |

