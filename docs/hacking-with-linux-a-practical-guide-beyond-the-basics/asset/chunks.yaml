    ## Predefined Users and Groups


    In all Unix "dialects," there are some users and groups predefined by the operating
    system, which are used for the management and control of the different services
    offered by the computer.

    Especially the `root` user - with `UID 0` - is the administrator of the machine,
    with full control over the system. There is also a `root` group - with `GID 0`
    - with administrative characteristics, to which the said user belongs.

    As an example, the following table lists some of the predefined users and groups
    in Fedora 13 (1) and in Ubuntu 10.04 Lucid (2), also indicating the possible differences.


    | User | UID (1) | UID (2) | Description |

    | :--- | :--- | :--- | :--- |

    | root | 0 | 0 | Administrator with total control. |

    | bin | 1 | 2 | Owner of operating system utilities. |

    | daemon | 2 | 1 | General services manager. |

    | adm sys | 3 | 3 | Owner of the archives of historical and administrative records.
    |

    | lp | 4 | 7 | Print services administrator. |

