    | Group:​ Reading | 40 | g+r |


    | Writing | 20 | g+w |


    | Execution / Access | 10 | g+x |


    | Other users: ​ ReadingWriting | 42 | o+ro+w |


    | Execution / Access | 1 | o+x |


    | Special permissions | Octal value | Symbolic notation |


    | Owner: ​ Active User (SUID) | 4000 | u+s |


    | Group: ​ Active group (SGID) | 2000 | g+s |


    | Other users: ​ Exchange directory | 1000 | +t |


    The symbolic notation is used to add (+), remove (-), or assign (=) permissions
    grouped by type.The numerical notation in octal format is used to assign all permissions
