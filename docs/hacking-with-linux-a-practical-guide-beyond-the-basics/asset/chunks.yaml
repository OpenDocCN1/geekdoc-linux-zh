    分区是系统管理员在系统磁盘驱动器中定义的子划分，用于存储特定的文件系统或分页空间。按照上一节描述的规则，管理员必须定义其系统的不同文件系统，在每个磁盘上创建分区，并考虑到可用资源以及用户对它们的主要用途。创建基本文件系统的过程通常在机器安装期间完成，尽管之后可以对其对其进行添加和扩展。下表定义了典型的分布情况并给出了一些建议。


    | 文件系统 | 建议 |

    | :--- | :--- |

    | `/` | 必需的，且不需要很大。 |

    | `/proc` | 必需的，其占用应在物理内存的一半到两倍之间，且与其大小反比。 |

    | `/usr` | 包含操作系统；其大小取决于要安装的软件包和扩展预测。 |

    | `/tmp` | 临时文件空间取决于定义的用户数量以及他们工作的估计空间。 |

    | `/var` | 将包含不断增长的文件，应提供足够的大小，但不要浪费磁盘空间。 |

    | `/boot` | 可存储启动加载程序；当需要加载驱动程序来定位根文件系统时使用。 |

    | `/home` | 用户账户；建议使用单独磁盘，其大小取决于用户数量和账户的估计容量。 |

    | `/usr/local` | 必须足够大以存储安装的实用程序和应用程序；建议使用单独磁盘。 |


    尽管 Linux 发行版通常包含图形化工具来帮助管理存储空间（无论安装期间还是正常运行期间），但也可以包含具有独立外观的应用程序。


    ## Ext3 和 Ext4 文件系统


    Linux 支持挂载不同的文件系统（包括本地和远程）作为它们与内核之间的接口，该内核被称为虚拟文件系统（`VFS`）。在直到几年前以前，Linux 中最常用的文件系统被称为扩展文件系统
    2 (`Ext2`)，它提高了第一版本的性能，但在系统发生意外崩溃时仍会存在问题，因为它需要长时间的检查和纠正过程。


    现代 Linux 发行版使用扩展文件系统 3 (`Ext3`)，它包含了以下改进：

    - 记录日志是最重要的特性，它改进了完整性检查过程，因为只需要验证该日志即可。

    - 支持更高级别的数据完整性以避免文件系统损坏，允许你选择保护的类型和级别。

    - 重复数据访问的流量更大、速度更快。

    - 在 `ext2` 和 `ext3` 之间轻松转换，无需重新格式化分区。


    Linux 内核从 2.6.30 版本开始包含对扩展文件系统 4 (`Ext4`) 的支持；因此，`Ext4` 默认包含在 Fedora 13 和 Ubuntu
    10.04 Lucid 的新安装中。相对于 `Ext3`，`Ext4` 文件系统包含了以下改进：

    - 更大的文件系统尺寸（可达 `1 EB = EB TB`）。

    - 对子目录数量没有限制。

    - 通过“区”（extents）提高大文件的处理速度。

    - 预磁盘分配或延迟分配。

    - 检查文件系统注册表。

    - 无需卸载文件系统的在线碎片整理。

    - 恢复被删除的文件。

    - 更快地检查文件系统状态。

    - 时间戳具有纳秒级精度。

    - 可从 `Ext3` 升级（你可以返回 `Ext3` 但会丢失“区”）。


    挂载在服务器上的文件系统的永久配置定义在 `/etc/fstab` 文件中，包括源设备数据、挂载点、文件系统类型以及一组挂载选项、调试和数据一致性检查。下表描述了配置文件
    `/etc/fstab` 的通用格式。


    | 格式 | 描述 |

    | :--- | :--- |

    | `/etc/fstab` | 挂载类型 选项... | 文件系统描述文件。其字段为： |

    | | 1. 分区、设备或远程目录的标签或 UUID。 |

    | | 2. 本地挂载点。 |

    | | 3. 文件系统类型 (`ext3`, `ext4`, `swap`, `vfat`, `ntfs`, `nfs`, `cifs` 等）。 |

    | | 4. 挂载选项（取决于文件系统类型）。 |

    | | 5. 针对系统崩溃的自动安全转储控制。 |

    | | 6. 服务器启动期间数据一致性检查的顺序（`/` 为 1，不同磁盘的文件系统增加）。 |


    此外，下面简要描述了文件系统管理中最常见的命令。


    | 命令 |  |

    | :--- | :--- |

    | `fdisk sfdisk` | 操作磁盘的分区表。 |

    | `parted` | 分区管理和文件系统。 |

    | `mkfs` | 格式化新分区。 |

    | `mount` | 在全局目录树中挂载文件系统。 |

    | `umount` | 移除文件系统。 |

    | `tune2fs` | `ext2`、`ext3` 和 `ext4` 文件系统之间的转换器。 |


    ## 分页与进程


    ### 分页空间

    多用户多任务任务操作系统（如 Linux）需要大量的物理内存来运行所有进程。分页空间是磁盘分区，允许你虚拟扩展系统内存，在物理内存耗尽时保持等待执行的进程状态。


    决定总分页空间大小的主要因素有：

    - 系统中内存和磁盘的量。

    - 访问机器的用户数量。

    - 预期的每用户进程数。

    - 系统中活动服务的数量。

    - 估计的客户/服务数量。


    由于新服务器内存的增长，通常规则是使用安装物理内存的一半到两倍作为分页。如有需要，管理员可以使用随后可以删除的磁盘文件扩展分页数量。下表描述了用于操作分页空间的
    Linux 命令。


    | 命令 | 描述 |

    | :--- | :--- |

    | `fdisk` | 用于定义分区的磁盘管理器。 |

    | `mkswap` | 创建分区或分页文件。 |

    | `swapon` | 激活分区或分页文件。 |

    | `swapoff` | 禁用分区或分页文件。 |


    ### 虚拟文件系统 /proc 和 /sys

    挂载在 `/proc` 和 `/sys` 中的虚拟文件系统存储在内存中，包含文件和特殊目录的层次结构，维护 Linux 系统内核的当前状态，收集有关设备和运行进程的信息。下表显示了
    `/etc/fstab` 文件中文件系统定义的典型格式。


    | sysfs | /sys | sysfs defaults | 0 0 |

    | :--- | :--- | :--- | :--- |

    | proc | /proc | proc defaults | 0 0 |


    大多数虚拟 `/proc` 文件显示长度为 0，尽管它们可以像文本文件一样查看，但其中一些包含大量信息。在 `/proc` 中有一系列特殊目录，描述每个运行进程的当前状态——由进程标识符
    (`PID`) 表示——包括此类数据：执行顺序的行、进程的根目录和工作目录、内存状态、处理器的执行和使用、环境变量等。其他感兴趣的文件和目录是那些关于处理器、内存、中断、设备、分区、挂载点、内核模块、网络参数等的信息。


    特殊目录 `/proc/sys` 包含只有管理员可以修改的文件，以便更改内核配置，启用或禁用某些操作功能。在修改 `/proc/sys` 中的虚拟文件时必须非常小心。下表描述了该目录
    `/proc/sys` 的内容。


    | 目录 | 描述 |

    | :--- | :--- |


    '
- fmt: '

    | `/proc/sys/dev` | Information on special devices (CDROM, RAID disks, etc.).
    |

    | `/proc/sys/fs` | File system parameters (file limits and open nodes, quotas,
    etc.). |

    | `/proc/sys/kenrel` | Core configuration (process accounting, system name, stop
    by console, modules, message queues, etc.). |

    | `/proc/sys/net` | Connection parameters for each type of network (IPv4, IPv6,
    Token Ring, local (loopback), etc.). |

    | `/proc/sys/vm` | Virtual memory configuration (pages used, the minimum size
    that memory should be free, etc.). |


    Full information about the virtual `/proc` file system can be found in the kernel
    source code package, which is usually found in the subdirectory `/usr/src/Core
    Version/Documentation`. For its part, the Linux kernel uses the `/sys` file system
    to inform user applications about the objects managed by the `Kernel` and the
    dependency relationships between them. The main structure of `/sys` groups information
    about the classes of registered devices, physical buses, connected devices, controllers
    and kernel modules.


    ## Redundant Disks (RAID)


    The Redundant Array of Independent Disks (RAID) represents a set of valid techniques
    to save costs or improve the performance and security of access to mass storage,
    combining multiple disks in a single logical device. The main concept of RAID
    is to divide the data into certain pieces and distribute them into the array devices,
    according to the level of need. A reverse reconstruction algorithm is followed
    during the reading process. The main features of disk usage in a RAID are:


    * Increase the speed of access to data.

    * Increase storage capacity, combining smaller capacity disks into a single larger
    logical disk.

    * Improve fault tolerance of discs.


    There are devices and controllers prepared to perform RAID techniques on their
    own hardware, which increases the performance and the final price of the machine.
    The new operating systems are suitable to perform this task under software. The
    following table describes the most used RAID levels.


    | `RAID 0:` | The data is divided into bands, writing each of them on a disk.
    Access performance is improved. The total capacity is the sum of the capacities
    of each disk. |

    | `RAID 1:` | The data is stored in a mirror, repeating the same writing on each
    disk. The safety and fault tolerance of the system is increased because a defective
    disk can be replaced without affecting the operation of the machine. The total
    capacity corresponds to that of any disk (all must be equal). |

    | `RAID 5:` | More than 2 disks are used to distribute the pieces of data and
    their parities. Each disc contains a band of data and the parity of the bands
    of other data. Security, benefits and costs are increased. The total capacity
    is approximately the total sum of the capacity of the disks minus 1. |

    | `RAID 6:` | It is a `RAID 5` with 2 check bands. It further increases the security
    of the system and its costs. The total capacity with respect to RAID 5 is somewhat
    reduced. |

    | `RAlinear:` | The disks are grouped sequentially to form a logical disk higher.
    No benefits or safety are increased, only the capacity. |


    If the partitions to be used for software RAID are to be mounted on essential
    file systems for Linux, they must be defined during the operating system installation
    process. Utilities such as Disk Druid (used in Fedora and Red Hat Enterprise)
    allow you to define RAID partitions, associate the level of redundancy, and generate
    the logical disk (`metadevice`). The definition of the matrix is in the file `/etc/raidtab`.
    The following example shows the configuration of an `md0` RAID 1 (mirror) meta
    device formed by the 2-disk `sda1` and `sdb1` partitions, which contain an `Ext3`
    type file system mounted on the root directory.


    ```bash

    $ cat /etc/raidtabraiddev /dev/md0 raid-level 1nr-raid-disks 2chunk-size 64kpersistent-superblock
    1nr-spare-disks 0

    ```


    | device | `/dev/sda1` | | |

    | raid-disk | 0 | | |

    | device | `/dev/sdb1` | | |

    | raid-disk | 1 | | |


    ```bash

    $ df -h /dev/md0

    ```


    | S. files | Size Used | Disp Usage% | Mounted on |

    | `/dev/md0` | 40G 21,5G | 19,5G 51% | / |


    ## Logical volumes


    Logical volumes are storage management techniques available as of version 2.4
    of the Linux kernel - inherited from the AIX operating system, the IBM Unix dialect
    - that allow you to resize partitions and distribute them on multiple disks. In
    some Linux distributions, there may be a restriction imposed by the Logical Volume
    Manager (`LVM`) that the `/boot` directory must be in a real partition and not
    be part of any logical volume. It is mandatory to define the logical volumes in
    the installation process when they are going to store the system''s own file systems.
    The Logical Volume Manager consists of 3 fundamental elements:


    | `Physical Volume:` | the structure that represents a physical disk. |

    | `Logical Volume:` | equivalent structure to a Linux file system. |

    | `Volume Group:` | set of several logical volumes that can be stored in several
    physical volumes. Thus, a disc can contain several file systems, and a file system
    can be recorded on several discs. |


    The system installer must follow the following steps:


    * If the Linux distribution is old, create a normal partition of type `Ext3` for
    the `/boot` directory, either included in the root directory or in an own partition.

    * Define a physical volume on each disk.

    * Create volume groups by properly combining physical volumes.

    * Define the logical volumes of each volume group, assigning for each of them
    its initial size and its mounting point.


    It is advisable to leave some unallocated space to expand the partitions that
    need it. The system includes a wide variety of commands to manage each of the
    components of the logical volume manager. The following table describes most of
    these instructions according to their function.


    | Operation | Physical volume | Group Volume | Logical Volume |

