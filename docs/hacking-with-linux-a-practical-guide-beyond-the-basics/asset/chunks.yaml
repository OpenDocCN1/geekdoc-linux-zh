  trans: "\n为了避免单个仓库出现拥堵，全球范围内针对每个发行版的中央仓库都存在若干个相同的副本或镜像。\n\n在 Debian 中，仓库列表维护在 `/etc/apt/sources.list`\
    \ 文件以及 `/etc/apt/sources.list.d/` 目录下的文件中。无论哪种情况，其文件格式都如下所示，这里以阿根廷布宜艾利斯大学（UBA）提供的\
    \ Debian 镜像源为例：\n\n```deb\ndeb http://ftp.ccc.uba.ar/pub/linux/debian/debian/\
    \ stable main contrib non-free\ndeb-src http://ftp.ccc.uba.ar/pub/linux/debian/debian/\
    \ stable main contrib non-free\n```\n\n现在让我们详细查看上述行行的组成部分：\n\n- `deb` 和 `deb-src`\
    \ 分别表示仓库包含预编译的二进制包还是源码包（源码包包含编译特定程序所需的所有内容）。\n- 接下来，是仓库的路径。\n- 接着出现 `stable` 单词（或者是稳定版本的代号，例如截至目前为\
    \ `stretch`）。\n- 最后，是仓库的组件列表（这三个部分并不一定都会出现）：\n    - `main`：包含与 Debian 软件政策兼容的软件。\n\
    \    - `contrib`：包含与 Debian 软件政策兼容的软件，但其依赖通常包含在 `non-free` 中（见下文）。\n    - `non-free`：与\
    \ Debian 软件政策不的软件。\n\n在 Debian 官方网站上，你可以按国家查询镜像列表。我们可以选择自己所在的国家，或者使用主内容分发网络（CDN）。\n\
    \n在 CentOS 或类似的系统中，仓库是通过 `/etc/yum.repos.d/` 下的独立文件进行配置的。以 `CentOS-Base.repo`\
    \ 为例。在上一个示例中，我们可以区分出仓库的配置由以下部分组成：\n\n- 名称 (`base`)。\n- 镜像列表 (`mirrorlist`)，系统将根据地理位置选择最近的一个，或者一个固定的仓库地址\
    \ (`baseurl`)。\n- 如果需要，使用仓库公钥的指示。\n- 公钥文件的路径。\n"
- fmt: '

    When we add a new repository to CentOS, we will be asked to confirm that we want
    to install in our equipment the GPG key that said repository provides for security
    reasons. Sometimes it will be necessary to manually add a third-party repository.
    Generally, we will have to resort to this option when we want to install a more
    recent version of a program than the one available in the official repositories
    of the distribution. To illustrate we will add the following repository in `/etc/yum.repos.d/mariadb.repo`
    to install the latest stable version of MariaDB. First, let''s add following lines
    within the mentioned file:


    ```ini

    # MariaDB 10.3 CentOS repository list - created 2018-06-08 00:28 UTC

    # [http://downloads.mariadb.org/mariadb/repositories/]

    [mariadb]

    name = MariaDB

    baseurl = [http://yum.mariadb.org/10.3/centos7-amd64]

    gpgkey=https://yum.mariadb.org/RPM-GPG-KEY-MariaDB

    gpgcheck=1

    ```


    The name of the configuration files of the repositories that we add manually must
    end in `.repo`. The same applies to CentOS and the like (in `/etc/yum.repos.d`)
    and to the SUSE family distributions within `/etc/zypp/repos.d`. To ensure that
    our system can see the complete and updated list of packages available in the
    repositories, we must synchronize the local index with them. In Debian and derivatives,
    we do it through `apt-get update`, while in CentOS or similar, we use `yum makecache
    fast`. In openSUSE, the equivalent command is `zypper refresh`. In the next section,
    we will explain the next necessary step to take before installing the package
    itself from a third-party repository.


    # Linux Package Management


    ## Debian And Derivatives

    To install `.deb` files, we will use the `dpkg` command followed by the `-i` or
    `--install` option and the path to the file to be installed. For example, to install
    `mipackage.deb` (present in our current working directory) we will use the following
    command:


    ```bash

    dpkg -i mipackage.deb

    ```


    If we later wanted to install a new version of the same program using a more recent
    `.deb` file, we can use the same previous command. On the other hand, if we need
    to uninstall it, we will use the `-r` option (it can also be `--remove`) or `-P`
    (`de --purge`) simply by including the package name:


    ```bash

    dpkg -r mipackage

    ```


    The difference between `--remove` and `--purge` is that the latter removes the
    package along with any configuration file that may have been created as part of
    the installation, while the former does not. Finally, with `-l`, we can see a
    list of all packages installed in the system. As the output will be extensive
    in this case, it is recommended that we visualize it with less or filter it with
    a tool such as the `tail`, `head`, or `grep`.


    ```bash

    dpkg -l | head

    ```


    Two other very useful options are `--info` and `--contents`. The first will allow
    us to see the information about the package in question, while the second will
    show us the contents of this (in both cases we must specify the full name of the
    `.deb` file to examine):


    ```bash

    dpkg --info mipackage.deb

    dpkg --contents mipackage.deb

    ```


    Similar to `--contents`, we can use `--listfiles` (in this case we only use the
    package name, without the extension `.deb`) to see the files that were added to
    the system when installing a package (whatever we have done through `dpkg` or
    `apt-get`, as we will see below).


    To ensure that a program is installed with all the necessary dependencies, we
    can use the `apt-get` package manager instead of `dpkg`. The associated `apt-cache`
    tool will also be useful to find programs in the repositories and to see detailed
    information about one that has caught our attention. Both utilities (along with
    others) are part of the APT (Advanced Package Tool), which is Debian''s main package
    management system. After adding repositories in `/etc/apt/sources.list` or in
    a file within `/etc/apt/sources.list.d`, let''s synchronize the list of available
    packages with Debian repositories:


    ```bash

    apt-get update

    ```


    After that, we can use `apt-cache search mipackage` to use `mipackage` as a search
    pattern, or if we already know the exact name we can use `apt-cache show mipackage`
    or `apt-cache showpkg mipackage` to view detailed information about it, or `apt-get
    install mipackage` to install it. If we add the `-f` option to the previous command,
    we can also complete any installation that we have carried out using `dpkg`, and
    that has not been successfully completed due to missing dependencies.


    To automatically accept confirmation requests, we can add the `-y` option to the
    previous command. This can be particularly useful if we are going to automate
    an installation (or update) in some way. The same applies to the use of `yum install`
    in CentOS and the like.


    On the other hand, if my package is already installed and we would like to remove
    it, any of the following commands will allow us to do so:


    ```bash

    apt-get remove mipackage

    apt-get purge mipackage

    ```


    The last one will not only eliminate my system diskette but also do the same with
    any configuration file related to the program in question. To update a package
    to the latest available version, we will use `apt-get upgrade mipackage`. If in
    the previous command, we omit the name of the package, the result would be that
    all of them would be updated to the latest version available in the configured
    repositories of the system.


    ## Reconfigure Packages

    It is important to note that during the course of installation, we are usually
    offered the possibility of configuring the program in question. If we do not do
    it at that time, we can also do it later using the `dpkg-reconfigure` tool. First,
    we can review the current configuration with the `debconf` command, followed by
    the name of a given package. Let''s use the `keyboard-configuration` package as
    an example:


    ```bash

    debconf-show keyboard-configuration

    ```


    If we see something we want or see the need to change, now is the time to turn
    to `dpkg-reconfigure`. Following the same example, the command should now be used:


    ```bash

    dpkg-reconfigure keyboard-configuration

    ```


    to make the corresponding modifications using only the keyboard. The advantage
    of using this method to configure already installed software is that we avoid
    having to edit text files by hand. Even if not all options are contemplated, it
    saves us work.


    Another situation in which the `dpkg-reconfigure` can be useful is to restore
    the configuration of a package to its original state. If we made a mistake and
    did not make backup copies before starting, this tool can help us get out of trouble.
    Simply accepting the options presented to us by default, we should solve the problem.


    ## CentOS and Similar

    RPM (Red Hat Package Manager) is the package manager used by default in Red Hat
    Enterprise Linux as in SuSE (and derived distributions such as CentOS, Fedora,
    or OpenSUSE). It was developed by Red Hat and then adopted by other distributions.
    We can say that it consists of 2 fundamental components:

    1) the `rpm` command, and

    2) a local database. The latter contains the list of installed packages and information
    about them and is located within the directory `/var/lib/rpm`.


    To begin, let''s take as an example `bc-1.06.95-13.el7.x86_64.rpm`. We can download
    the same from the list of packages available for CentOS 7. In the name of the
    file we can find at first glance the following data:

    * Package name: `bc`

    * Version: `1.06-95-13.el7`

    * The architecture: `x86_64`


    Usually, the installation is done with the combined options `-Uvh` or `-Fvh` instead
    of the simple `-i` (or its equivalent `--install`, also valid). Of the two previous
    alternatives, the first one installs or updates (as the case may be), while the
    second one will only install the package and will not take any action if a previous
    version of it already exists. For our convenience, `-v` shows the package name
    during installation and `-h` prints a series of `#` to indicate the progress of
    the installation. Both are useful in particular if we are installing several packages
    at once.


    To uninstall a package that we have previously installed with `rpm`, we will use
    the same tool, but this time with the `-e` option followed by the package name.
    It is not necessary to include this version or architecture.

    Other useful options of the `rpm` command that cannot be missing in our arsenal
    are (always followed by `-q`, query):

    '
