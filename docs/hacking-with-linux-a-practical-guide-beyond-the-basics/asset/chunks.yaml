    use the package name, without the extension .deb) to see the files that were added
    to the system when installing a package (whatever we have done through dpkg or
    apt-get, as we will see below).To ensure that a program is installed with all
    the necessary dependencies, we can use the apt-get package manager instead of
    dpkg. The associated apt-cache tool will also be useful to find programs in the
    repositories and to see detailed information about one that has caught our attention.
    Both utilities (along with others) are part of the APT (Advanced Package Tool),
    which is Debian''s main package management system.After adding repositories in
    /etc/apt/sources.list or in a file within /etc/apt/sources.list.d, let''s synchronize
    the list of available packages with Debian repositories:apt-get updateAfter that,
    we can useapt-cache search mipackageto use mipackage as a search pattern, or if
    we already know the exact name we can useapt-cache show mipackageapt-cache showpkg
    mipackageto view detailed information about it, or apt-get install mipackage to
    install it If we add the -f option to the previous command, we can also complete
    any installation that we have carried out using dpkg, and that has not been successfully
    completed due to missing dependencies.To automatically accept confirmation requests,
    we can add the -y option to the previous command. This can be particularly useful
    if we are going to automate an installation (or update) in some way. The same
    applies to the use of yum install in CentOS and the like.On the other hand, if
    my package is already installed and we would like to remove it, any of the following
    commands will allow us to do so:apt-get remove mipackageapt-get purge mipackageThe
    last one will not only eliminate my system diskette but also do the same with
    any configuration file related to the program in question.To update a package
    to the latest available version, we will useapt-get upgrade mipackageIf in the
    previous command, we omit the name of the package, the result would be that all
    of them would be updated to the latest version available in the configured repositories
    of the system.Reconfigure PackagesIt is important to note that during the course
    of installation, we are usually offered the possibility of configuring the program
    in question. If we do not do it at that time, we can also do it later using the
    dpkg-reconfigure tool.First, we can review the current configuration with the
    debconf command, followed by the name of a given package. Let''s use the keyboard-configuration
    package as an example:debconf-show keyboard-configurationIf we see something we
    want or see the need to change, now is the time to turn to dpkg-reconfigure. Following
    the same example, the command should now be used:dpkg-reconfigure keyboard-configurationto
    make the corresponding modifications using only the keyboard. The advantage of
    using this method to configure already installed software is that we avoid having
    to edit text files by hand. Even if not all options are contemplated, it saves
    us work.Another situation in which the dpkg-reconfigure can be useful is to restore
    the configuration of a package to its original state. If we made a mistake and
    did not make backup copies before starting, this tool can help us get out of trouble.
    Simply accepting the options presented to us by default, we should solve the problem.CentOS
    and SimilarRPM (Red Hat Package Manager) is the package manager used by default
    in Red Hat Enterprise Linux as in SuSE (and derived distributions such as CentOS,
    Fedora, or OpenSUSE). It was developed by Red Hat and then adopted by other distributions.
    We can say that it consists of 2 fundamental components:1) the rpm command, and2)
    a local database. The latter contains the list of installed packages and information
    about them and is located within the directory/ var /lib/rpm.To begin, let''s
    take as an example bc-1.06.95-13.el7.x86_64.rpm. We can download the same from
    the list of packages available for CentOS 7\. In the name of the file we can find
    at first glance the following data:• Package name: bc• Version: 1.06-95-13.el7•
    The architecture: x86_64Usually, the installation is done with the combined options
    -Uvh or -Fvh instead of the simple -i (or its equivalent --install, also valid).
    Of the two previous alternatives, the first one installs or updates (as the case
    may be), while the second one will only install the package and will not take
    any action if a previous version of it already exists. For our convenience, -v
    shows the package name during installation and -h prints a series of #''s to indicate
    the progress of the installation. Both are useful in particular if we are installing
    several packages at once.To uninstall a package that we have previously installed
    with rpm, we will use the same tool, but this time with the -e option followed
    by the package name. It is not necessary to include this version or architecture.Other
    useful options of the rpm command that cannot be missing in our arsenal are (always
    followed by -q, query):'
