  trans: '


    - `-a`: 显示所有已安装软件包的列表。

    - `-l`: 列出指定软件包安装的文件列表。

    - `-ip`: 查看未安装的 `.rpm` 文件的详细信息。

    - `-f`: 返回包含下方指定文件的包名。

    - `-Rp`: 显示包依赖关系列表。


    在结果中，我们将看到以下插图示例：


    - 我们使用 `rpm -qa | grep htop` 检查是否安装了 htop 软件包。

    - 我们使用 `rpm -ql htop` 显示安装 htop 后添加到系统的文件列表。

    - 我们使用 `rpm -qRp tuxpaint- 0.9.22-1.x86_64.rpm` 查看 tuxpaint 包的依赖关系。


    要查看 `.rpm` 文件的完整内容，可以使用如下的 `rpm2cpio` 和 `Cpio`：

    ```

    rpm2cpio tuxpaint-0.9.22-1.x86_64.rpm | cpio -idv

    ```


    尽管 `rpm` 非常有用，但安装特定程序最实用的方法（如果它在我们发行发行版的存储库中，或者可用版本符合我们的需求）可能是使用 `yum` 软件包管理器。它包含了所有必要的工具，以满足所需的依赖关系并配置已安装的程序（简而言之，它为我们节省了大量工作！）。使用此工具，我们可以：


    - 通过关键字搜索软件包（例如，mipackage）：`yum search mipackage`

    - 查看关于 mipackage 的信息：`yum info mipackage`

    - 安装它：`yum install mipackage`

    - 更新到最新的可用版本：`yum update mipackage`


    就像 Debian 中使用 `apt-get upgrade` 的情况一样，如果在这种情况下省略了包名，系统中存在的所有包都将被更新。


    - 卸载它：`yum remove mipackage`

    - 查找特定命令包含在包中（例如，`mic` 命令）：`yum whatprovides "* / mic command."`


    `yum` 的配置位于 `/etc/yum.conf`。虽然我们可以在此文件中添加存储库，但为了整洁和有序，优选通过 `/etc/yum.repos.d`
    目录下的独立文件（扩展名为 `.repo`）来操作，如前所述。


    当我们向 CentOS 添加新存储库时，系统会要求确认是否要在计算机上安装该存储库提供的 GPG 密钥。没有这一步，将无法从该源下载任何软件包。


    如果我们在任何时候对查看 `yum` 的活动感兴趣，可以查看 `/var/log/yum.log` 日志文件（或日志）。


    无论添加第三方存储库（如之前的 MariaDB 情况），还是在 `/etc/yum.repos.d/CentOS-Base.repo` 中，我们都可以使用
    `enabled` 指令来指示是否应立即启用。例如，我们可以查看 `centosplus` 存储库的配置并注意到 `enabled = 1`。这表示 centosplus
    在系统中已启用。


    由于 `centosplus` 包含了对基础存储库中包的改进和更新，我们可能偶尔需要禁用它，以防它们干扰后者。我们可以通过在执行 `yum update`
    之前将指令的值修改为 `enabled = 0`，或者指定 `yum update - disablerepo = centosplus` true。如果已禁用，情况也一样，我们想通过
    `yum update --enablerepo = centosplus` 启用它。


    通过命令行启用或禁用存储库仅在当前事务期间有效。要永久生效，我们必须像之前所示，更改 `enabled` 指令中的对应值。


    Fedora 多年来已开始使用名为 `dnf` 的软件包管理器（它在版本 18 中引入，并在版本 22 后成为默认工具）。它与我们看到的 `yum` 选项类似，尽管它比前身更快且消耗内存更少。Fedora
    项目在其官方网站上提供了关于 DNF 的详细文档。


    ### SUSE 系

    这些发行版（其中 openSUSE 脱颖而出）也使用 `rpm` 工具来管理单个软件包。此外，它们还有一个名为 `zypper` 的完整软件包管理器。接下来，我们将看到可以使用
    `zypper` 执行的最常见操作：


    - 刷新（更新）存储库：`zypper refresh`

    - 通过关键字搜索（在此情况下为 apache）：`zypper search apache`

    - 关于特定包的信息：`zypper info apache2`

    - 安装软件包：`zypper install apache2`

    - 更新：`zypper update apache2`

    - 卸载：`zypper remove apache2`

    - 通用帮助：`zypper help`

    - 特定操作的帮助（在此情况下为 install）：`zypper help install`


    '
