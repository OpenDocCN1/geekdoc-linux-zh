    commands:quota -u studentrepquota / srv / networksBoth tools indicate that in
    this case, the student user has reached both hard limits and, therefore, that
    the grace period has been activated.To report the use of group fees, we will also
    use quota but with the -g option followed by the group name.If what we want is
    to immediately notify by email about this situation, we will use the warnquota
    command. When invoking this utility without arguments, file systems with quotas
    activated will be reviewed. When identifying the responsible users, an email will
    be sent notifying them of the above.We can add in / etc / crontab a line like
    the following one so that warnquota do your job every 12 hours:0 0.12 * * * root
    / usr / sbin / warnquotaThe warnquota command comes with the English messages
    by default, but the configuration file is /etc/warnquota.conf is very intuitive
    and easy to change.Chapter 12: Startup and ServicesBoot ProcessDuring the machine
    startup process, the necessary checks are carried out to configure and activate
    all the services defined by the system administrator. It is essential to know
    this procedure and prepare the necessary changes according to the planning made
    for that computer.The boot process of a Linux server based on x86 architecture
    (Intel, AMD) comprises the following steps :After checking the devices of the
    machine, the BIOS executes the first step of the system loader, located in the
    boot sector of the first hard disk. GRUB is the loader currently used in Linux.


    *   The boot loader executes the second step of the process, located in the /
    boot partition.


    *   The Linux kernel and its additional modules are loaded into memory, and the
    root partition is mounted in read-only mode.


    *   The kernel takes control of the boot sequence and executes the boot process
    (/ sbin / init.


    *   This initiation program loads all defined services runs the initiation and
    configuration programs and mounts the defined partitions. / sbin / init reads
    the information from the configuration files (/ etc / inittab in Fedora SysVinit
    or /etc/event.d/* in Ubuntu Upstart). The process first loads the basic services
    and then those associated with the boot level chosen by the administrator.


    *   The system startup is finished by presenting the user with the connection
    process (login) or the graphical environment (usually GNOME or KDE).


    SysVinit, implemented by default in Fedora and many other Linux distributions,
    is a sequential boot process (based on System V Init), which is slow and presents
    certain problems for using new devices (such as USB file systems).Ubuntu uses
    Upstart, an event-controlled process that is still under development and can emulate
    the operation of SysVinit.There are also other alternatives under development
    based on parallel (init-NG) or event-driven methods (Solaris Service Management
    Facility or Apple launchd).The GRUB ChargerAs described in the previous section,
    a boot loader program is responsible for starting an operating system.The main
    loaders used by Linux support the definition of an execution menu for the different
    operating systems installed on the computer and start them at certain execution
    levels.The GNU Unified Startup Loader (GRUB) allows the user to choose the operating
    system and the kernel with which they want to work.GRUB has 2 modes of operation:


    *   Direct mode is used to load the Linux kernel without any intermediaries.


    *   The chained mode is used to load other operating systems and points to the
    first boot sector of the partition, where the system startup files are located.


    GRUB offers the user a valid operating environment to perform configurations prior
    to the start of the operating system, being able to directly access its control
    file /boot/grub/grub.conf or /boot/grub/menu.lst.The orders for the GRUB configuration
    define the characteristics of the boot menu, indicating the different system load
    options, the default option, time limits, graphic environment, etc.The following
    example presents the configuration of a menu to boot Ubuntu 10.04 Lucid with a
    kernel version 2.6.32-22 in the second partition of the first disk, and Windows
    XP in the first partition.boot=/dev/sda default=0 timeout=5title Ubuntu 10.04
    LTS, kernel 2.6.32-22-generickernel /boot/vmlinux-2.6.32-22-generic root=/dev/sda2
    ro quiet initrd /boot/initrd.img-2.6.32-22-genericquiettitle Windows XP SP3 root
    (hd0,1) makeactive chainloader +1When the machine is turned on, GRUB presents
    the user with a selection menu, and the user can edit the different options before
    starting the corresponding operating system.GRUB 2 is a development version, included
    in the new Linux distributions, which means a redefinition of the loader, to allow
    its use in different architectures, access local file systems, including a complex
    scripting language, etc.The NucleusUnix operating systems are based on a layer
    structure, where the internal layers provide basic services to the external ones.
    The Kernel is the main part of the operating system, performs the basic control
    functions, and provides the essential services to manage the operating system.The
    Linux kernel consists mainly of the components described in the following table.


    | Memory Manager: | Responsible for assigning memory areas and paging spaces to
    processes, kernel modules and cache area. |


    | Process Manager: | The essential part that creates activates and terminates
    processes; Implement the rules of multitasking. |


    | Device Drivers: | They manage the communication of the system with each of the
    connected devices. The kernel is configured in the boot process to load the modules
    necessary to control the specific devices of each machine. |


    | Virtual file system manager: | Intermediate layer that allows uniform access
    to file systems, maintaining a homogeneous directory tree. |


    | Network Manager: | Abstract layer for general access to the computer network,
    regardless of the type of devices used and the architecture of the network. |'
