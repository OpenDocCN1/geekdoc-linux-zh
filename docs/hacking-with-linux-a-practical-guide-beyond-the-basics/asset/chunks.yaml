    # Journalctl


    在 `systemd` 下，负责收集和存储来自内核及其他源的消息被称为 `journald`。`journald` 的一个显著特征是它不以明文形式存储信息。相反，它以结构化的方式存储在
    `/run/log/format/` 下的二进制文件中。这使得快速识别相关信息变得容易，尽管需要使用外部工具 `journalctl` 来解析日志。


    使用 `journalctl` 的优势在于，它允许我们集中管理和检查各种系统日志（这些日志通常分散在 `/var/log` 或其任何子目录下，如我们之前所示），无论产生这些日志的进程是什么。


    例如，要显示 Debian 中由 `ssh` 和 `cups` 单元产生的消息，我们将使用 `-u`（unit，单元）选项。如下所示，我们可以根据需要重复使用该选项：


    ```

    journalctl -u ssh -u cups

    ```


    如果我们想获得更多的上下文信息，将使用组合选项 `-xu`。当 `systemctl` 服务由于某些原因启动失败时，这种方法将特别有用，因为它为我们提供了寻找问题源的价值信息。要退出
    `journalctl`，必须按 `q` 键。


    此外，通过 `journalctl --boot`，我们可以访问对应特定启动的数据。通过将 `--boot` 替换为 `--list-boots`，可以看到可用信息的启动列表。`-0`
    参数用于指定标记为 0 的启动：


    ```bash

    journalctl --list-boots # 可用启动列表

    journalctl --boot -0 | head -n 5 # 前 5 行

    journalctl --boot -0 | tail -n 5 # 最后 5 行

    ```


    为了确保系统启动日志是持久保存的，我们必须按照如下方式启用：


    ```bash

    mkdir /var/log/journal

    systemd-tmpfiles --create --prefix /var/log/journal

    systemctl restart systemd-journald

    ```


    另一种配置日志持久性的方法是通过文件 `/etc/systemd/journald.conf`，在 `[Journal]` 节下指定 `Storage =
    persistent`。


