- fmt: '

    Let''s see how to create a directory called `midirectory` in `/tmp` and show the
    user and the group owners:


    ```bash

    mkdir /tmp/midirectory

    ls -ld /tmp/midirectory

    ```


    If we want to change the owner user or the owner group of `/tmp/mydirectory`,
    we can use the `chown` command as follows:


    ```bash

    chown john:/tmp/midirectory # Change owner user

    chown :john /tmp/midirectory # Change owner group (similar to chgrp)

    chown john:/tmp/midirectory # Change both

    ```


    Another option to change the owner group is `chgrp`:


    ```bash

    chgrp john /tmp/midirectory

    ```


    Now let''s change the owner group to so and so:


    ```bash

    chgrp john /tmp/midirectory

    ```


    In the case of `chown` and for `chgrp`, one of the most used options is `-R`,
    which causes the operation to be applied recursively to all the contents of a
    directory. We will see the result of having changed the owner group of the directory
    to `john`.


    In the first column of the output of `ls -ld` we will see the permissions assigned
    for the owner user and the owner group of `/tmp/midirectory`, and for the rest
    of the users of the system:


    *   The first letter (`d`) indicates that `/tmp/midirectory` is a directory. While
    we knew this for having created it previously, sometimes we will have to identify
    whether the indicated resource is a directory, a common file (indicated by a `-`
    instead of `d`), or a symbolic link (by the presence of an `l`), among others.

    *   Next, the first three characters (`rwx`) indicates that the owner user has
    read (`r`), write (`w`), and execute (`x`) permissions on the directory. The second
    shortlist (`r-x`) indicates that the members of the owner group have read and
    execute permissions (but not write). Finally, the last list shows that all other
    users of the system have the same permissions as in the previous case.


    Let''s see how `rwx` permits allow us to restrict access to system resources:


    *   Read permission (`r`) is required to list the contents of the directory.

    *   Write permission (`w`) allows files to be added to the directory, other existing
    ones to be renamed, those files to be deleted, or the directory attributes to
    be modified. In any case, it must be borne in mind that in order to perform these
    operations, the execution permission on the same directory is necessary.

    *   Execution permission (`x`) is necessary to enter the directory and access
    files and subdirectories within it.


    To give write permissions on `/tmp/midirectory` to members of the group we must
    use the `chmod` command followed by the option `g` (group), the `+` sign and the
    permission we want to assign (in this case `w`):


    ```bash

    chmod g+w /tmp/midirectory

    ```


    If we wanted to assign (or remove, in which case we will use the sign `-`) more
    than one permission at a time, we could do it easily. For example, let''s see
    how to remove read and execute permissions for the rest of the users of the system
    (symbolized by the option `o`, or `others` in English):


    ```bash

    chmod o-rx /tmp/midirectory

    ```


    In the case that we want to modify the permissions of a directory and its contents
    simultaneously, we can use the `-R` (recursive) option of `chmod`. Taking the
    previous case as an example:


    ```bash

    chmod -R o-rx /tmp/midirectory

    ```


    Finally, to assign or remove permissions to the owner user, we use the option
    `u` (English user), while if we want to grant or remove particular permission
    for all, we will use the option `a` (from there). In this way, the following command
    activates the execution permissions on `/tmp/midirectory` for all users:


    ```bash

    chmod a+x /tmp/midirectory

    ```


    **NOTE**: The user who owns a resource can manage group and other permissions.
    This means that you can grant or remove rights to your own resources.


    Additionally, we can indicate certain octal permission instead of `r`, `w`, or
    `x`:


    | | Owner | Group | Other |

    | :--- | :--- | :--- | :--- |

    | Read | 4 | 4 | 4 |

    | Write | 2 | 2 | 2 |

    | Execute | 1 | 1 | 1 |


    To find help in conversion, we can consult any online permit calculator. For example,
    to assign `rwx` permissions for the owner, `rw` for the group, and the only `r`
    for the rest on the `test.txt` file we can do:


    ```bash

    chmod u+rwx,g+rw,or +r test.txt

    # or its equivalent

    chmod 764 test.txt

    ```


    All these facts make it essential that those responsible for the machine take
    special care when using the `root` user account. In the next section, we will
    explain where the permissions that are set on new files and directories come automatically
    when they are created.


    ## File and Directory Masks


    Usually, every time we use a limited user account to create a file or directory,
    the permissions `rw-rw-r--` (octal `664`) and `rwxrwxr-x` (octal `775`) are set
    by default, respectively. If we do it as `root`, the permissions are set as `rw-r--r--`
    (octal `644`) and `rwxr-xr-x` (octal `755`). This is the result of applying what
    is known as file and directory masks, whose values we can visualize and change
    using the `umask` command.


    In essence, the resulting permission arises from subtracting the user''s masks
    to the values `666` for files and `777` for directories.


    The following example will allow us to illustrate:


    1. Let''s run `umask` for any user.

    2. When creating a file called `file1`, the permissions will result from the subtraction
    between `666` and the file creation mask (`002` for a common user and `022` for
    `root`).

    3. When we add a `dir1` directory, the permissions will result from the subtraction
    between `777` and the directory creation mask (same values as in the previous
    case).

    4. Remove `file1` and `dir1`.

    5. Let''s set a new value for the masks (`000` in the following example) and rerun
    the commands from steps 1 to 3.


    ```bash

    umask 000

    touch file1

    mkdir dir1

    ls -ld file1 dir1

    rm file1

    rmdir dir1

    ```


    The changes we made to the mask will remain until we restart the computer or make
    another modification. If we want to apply them permanently, we must place the
    `umask` command together with the desired value in the initialization file of
    our shell (`~/.bash_profile` or `~/.profile`) and log in again or apply the changes
    to our environment using `source`:


    ```bash

    source ~/.bash_profile

    # or

    source ~/.profile

    ```

    According to the file where we modified.


    ## Access permissions


    Access permissions are mainly divided into two categories:


    *   normal permissions,

    *   special permissions.


    On the other hand, we have already learned that permissions are also subdivided
    into three groups:


    *   permissions for the owner,

    *   permissions for the owner group,

    *   permissions for other users of the system,


    Access control lists (`ACLs`) allow you to assign permissions specifically to
    sets of users and groups.


    ### Normal Permissions


    Each user has a unique connection name on the computer and will belong to one
    or more user groups. The owner of a file or directory can select which permissions
    to activate and which to disable. To check more clearly, take the first group
    of values obtained with the `ls -l` command, which will allow you to observe the
    permissions. These 11 characters indicate:


    *   1 character showing the type: file (`-`), directory (`d`), link (`l`), pipe
    (`p`), a symbolic link (`l`), etc.

    *   3 characters for the owner''s permissions.

    *   3 characters for the permissions of other users of the group.

    *   3 characters for the rest of the user''s permissions.

    *   1 optional character that indicates whether an ACL is defined.


    Depending on the type of directory entry, normal permission characters may vary
    in meaning:


    | Files | |

    | :--- | :--- |

    | Reading (`r`) | the user can read the file. |

    | Writing (`w`) | the user can write to the file. |

    | Execution (`x`) | the user can execute the file (as long as it is an executable
    or a command interpreter script). |


    | Directories | |

    | :--- | :--- |

    | Reading (`r`) | the user can read the contents of the directory. |

    | Writing (`w`) | the user can create, modify, and delete directory entries. |

    | Access (`x`) | the user can access the directory and can use it as the current
    directory (by executing the `cd` command). |

