- fmt: '

    Being Linux, an operating system based on open-source, the administrator can redo
    the kernel, including or eliminating operational features, according to their
    needs. The process to recompile the Linux kernel is increasingly easy to perform,
    as it is configured through menus with a large number of options.


    To increase the performance of the system, it is convenient to have a small core,
    but that can handle all the basic functions of the system. The management of additional
    devices and functions can be controlled by the core modules.


    ## Linux kernel modules

    Linux kernel modules are objects compiled in C language that control specific
    elements or functions. The basic modules for the control of the connected devices
    are loaded in the operating system startup process. The rest of the modules that
    the system manager considers necessary should be listed in the configuration files,
    as well as the optional parameters that these require in order to obtain optimum
    server operation.


    Version 2.4 of the Linux kernel uses a single file `/etc/modules.conf`, while
    version-based distributions 2.6 of the kernel locate several files (one per module
    or group of modules) in the `/etc/modprobe.d` directory.


    In the configuration files, the associations (aliases) between real and virtual
    modules are specified. Virtual modules are the interfaces between the system and
    the modules that control real devices; they are responsible, for example, for
    managing the network, special file systems, exclusive sound card capabilities,
    etc.


    The following table describes the system orders involved in the management of
    the kernel modules.


    | Mandate | Description |

    | :--- | :--- |

    | `lsmod` | List the loaded modules. |

    | `modprobe` | Test a certain system module and indicate if it can be installed.
    |

    | `insmod` | Install a new module. |

    | `rmmod` | Uninstall a loaded module. |


    ## Operation Parameters

    The new versions of the Linux kernels support the configuration and customization
    of its operating parameters, which affect the behavior of its components, such
    as: increasing the maximum number of open files (`fs.file-max`) or activate the
    ability to forward packets to create firewalls (`net.ipv4.ip_forward`).


    Modifications in the predefined environment for the kernel will be reflected in
    the file corresponding to the modified feature, located in the virtual `/proc/sys`
    file system.


    The configuration file of the kernel operating parameters is `/etc/sysctl.conf`
    and can be edited by the system manager to include the changes at the next system
    startup. Also, the changes are activated automatically by executing the `sysctl
    -p` command.


    The following table shows the format of the file lines `/etc/sysctl.conf`.


    | Format | Description |

    | :--- | :--- |

    | `/etc/sysctl.conf` | `Component[.Subcomp].Parameter = Value...` | Configuration
    of the kernel parameters. The fields are: |

    | | 1. The core component of the kernel: `kernel`, virtual memory (`vm`), file
    system (`fs`), or network (`net`). Some of these may have groups (directories)
    of parameters. |

    | | 2. Operation parameter. |

    | | 3. The value assigned to the parameter. |


    Some programs may also store kernel parameter configuration files in the `/etc/sysctl.d`
    directory, which uses a syntax similar to the main file. Complete information
    on the operating parameters of the Linux Core can be obtained in the Kernel source
    code documentation and on its download page.


    ## Boot Levels In Sysvinit

    Many Linux distributions, such as Fedora, use a sequential boot process inherited
    from Unix System V, known as SysVinit. Boot levels serve to allow SysVinit to
    operate in different ways according to the needs of the administrator. Simply
    by changing the boot level, the operating system can enter maintenance mode and
    then return to multi-user mode.


    The following table describes the execution levels supported by SysVinit.


    | Level | Description |

    | :--- | :--- |

    | 0 | System stop. |

    | 1 o S | Maintenance level for the privileged user (single user). |

    | 2 | Defined by the administrator in Fedora, by default in Ubuntu, multi-user
    without NFS on Solaris and AIX. |

    | 3 | Multi-user level, defined by the administrator in Ubuntu. |

    | 4 | Defined by the administrator or not used. |

    | 5 | Multi-user level with a graphical environment defined in Ubuntu. |

    | 6 | System reboot. |


    The boot level used by default in the system is defined in the configuration file
    `/etc/inittab`. However, the `init` command allows you to modify the level of
    execution of the machine at any time.


    The `init` command reads the configuration scripts stored in the `/etc/rcN.d`
    subdirectory, corresponding to the selected execution level. The mode of operation
    is as follows:


    *   Stop in sequence the processes corresponding to the `KNNservice` files, `NN`
    being the sequence order (2 digits) for that service (it is executed: `/etc/rcN.d/KMM
    stop` service).

    *   Start the file processes sequentially `SNN` service (runs: `/etc/rcN.d/SMM
    start` service).


    Service execution scripts are normally found in the `/etc/init.d` directory and
    are symbolically linked to the scripts of each execution level. In this way, the
    administrator can start or stop services independently, executing the corresponding
    script or the Fedora service order:


    ```bash

    service Service { start |stop |restart |reload |status }

    ```


    The following table describes some of the programs included in Fedora 13 for the
    management of services executed in the server startup process.


    | Mandate | Description |

    | :--- | :--- |

    | `chkconfig` | Establish symbolic links to include a service at the indicated
    boot levels. |

    | `ntsysv` | Menu to set the services that will run at multi-user levels. |

    | `service` | Start or for a certain service. |

    | `system-config-services` | Graphical interface for service management, including
    Inetd employees. |

    | `telinit` | Change to the specified execution level. |


    ## Jobs in Upstart

    `Upstart` is a non-sequential event-based boot process that has been included
    by default as Ubuntu version 6.10. A job is a task or service that can be executed
    or stopped when an event is triggered, and that can also generate new events to
    manage other jobs that depend on it.


    A boot system of this type has the advantage of being able to launch the necessary
    tasks when the system recognizes the corresponding devices, without having to
    wait to finish the execution of previous tasks. Therefore, a kind of task execution
    tree can be defined. Upstart can emulate the way SysVinit works, defining execution
    levels for general system services. Ubuntu 8.10 Intimid defines level 2 by default,
    in addition to maintenance levels (0, 1 and 6).


    The following example shows the file `/etc/event.d/rc2`, which configures the
    job to define execution level 2:


    ```bash

    start on runlevel 2

    stop on runlevel !2

    console output

    script

    set $(runlevel --set 2) || true

    exec /etc/init.d/rc 2

    ```


    The administrator can define the starting order of the services, similar to SysVinit,
    including symbolic links to the corresponding scripts in the `/etc/init.d/rcN.d`
    directory or by executing the `update-rc.d` command. The execution format to start
    or stop a service is as follows:


    ```bash

    /etc/init.d/ Service { start |stop |restart |reload |status }

    ```


    The table describes some of the service management commands and boot jobs in Ubuntu
    7.10.


    | Mandate | Description |

    | :--- | :--- |

    | `initctl` | Boot process control utility to execute orders and launch events.
    |

    | `start` | Start a job |

    | `status` | Shows the execution status of a job. |

    | `stop` | For a job. |

    | `telinit` | Change to the specified execution level. |

    | `update-rc.d` | Manage the links for sysVinit scripts. |


    ## Services

    Services are programs loaded at a certain level of execution, which provides the
    user with certain utilities or benefits. Each service implies a possibility of
    connection with the machine, which also implies the possibility of suffering attacks
    against the security of the system.


    The administrator should only activate the services strictly necessary for his
    machine. The following table briefly describes the most used services in Linux.

    '
