    # 第 3 章：特殊权限与 ACL 深度解析


    通常，我们需要允许普通用户以另一个用户的权限运行一个由该用户拥有的二进制文件。此外，也可能某个特定程序无论由谁运行，都必须以管理员权限运行。针对这些情况，我们有了特殊的
    `SUID` 和 `SGID` 权限（设置用户 ID 和设置组 ID）。本章的目标是对这些主题、限制文件和目录的访问以及为它们建立特殊属性。


    ## SUID、SGID 与粘滞位 (Sticky Bit)


    如果一个程序具有 `SUID` 权限且 `root` 是该文件的所有者，那么执行该程序产生的进程将具有超级用户权限，并在整个系统中拥有相同的 root 访问权限。这强调了将具有这种特殊权限的文件限制到最小范围的重要性。


    通常，拥有 `SUID` 权限的程序只有 `passwd`，它允许系统的每个用户更改自己的密码（默认情况下不是他人的密码），而不需要依赖管理员。同样的情况也适用于文件的
    `SGID`，尽管它允许进程以该文件所属组的权限运行。


    要为 `executable.sh` 文件添加 `SUID`，我们可以使用两种替代方法。一种是在分配的权限开头添加 `4`（如果用八进制表示），或者像下文所示使用
    `u + s`。


    ```bash

    chmod 4755 executable.sh

    chmod u + s executable.sh

    ```


    对另一个 `executable.sh` 设置 `SGID` 的步骤也类似：


    ```bash

    chmod 2755 otherexecutable.sh

    chmod g + s otherxecutable.sh

    ```


    我们可以在下面的图中看到这两种情况，在对应所有者或组的权限列表中，`SUID` 和 `SGID` 分别用字母 `s` 表示。


    除了 `/usr/bin/passwd` 文件外，取决于电脑上安装的软件，可能还有其他具有 `SUID` 权限的文件（顺便提一下，另一个通常具有 `SUID`
    位的二进制文件位于 `/bin/at`）。除了这两个示例，对应 X Window 系统的二进制文件（末尾没有 `s`）也具有此类权限（显而易见，所有用户都必须能够登录图形环境）。


    ### 查找高权限文件


    作为系统管理员，我们将致力于识别所有具有 `SUID` 或 `SGID` 权限的文件，并将它们限制到最小必要范围。一旦识别，我们就可以删除它们或将它们的权限更改为对系统完整性潜在危险较小的权限。


    为了完成这项任务，我们可以使用 `find` 命令以及将文件权限作为搜索标准的功能。以下两个示例允许您找到所有具有这两种特殊权限之一的文件。


    ```bash

    find /usr/bin -type f -perm -u +s

    find /usr/bin -type f -perm -g +s

    ```


    结果，我们将在 CentOS 7 系统中看到上述两个命令的执行结果（其他发行版的输出可能有所不同）。或者，我们可以将之前两个命令的输出保存到文本文件中，过段时间再次执行。这样，我们就可以使用
    `diff` 命令对它们进行比较，并确保自上次修订以来没有其他程序被设置特殊权限。


    ### 粘滞位 (Sticky Bit)


    在 Linux 系统中，可能存在某些系统用户都可以在其中创建、修改和删除文件的目录。例如，我们可以提到 `/tmp` 和任何共享目录（例如，FTP 服务器上多个用户可以访问的公共空间）。应用到目录上的粘滞位是一种特殊权限，只有目录内文件的所有者或目录的所有者才能删除该文件。


    为了说明这一点，我们将创建目录 `/tests` 并分配 `777` 权限：


    ```bash

    mkdir /tests

    chmod 777 /tests

    ```


    下一步，让我们添加一个名为 `example1.txt` 的空文件：


    ```bash

    touch /tests/example1.txt

    ```


    现在使用另一个用户账户尝试删除该文件：


    ```bash

    rm /tests/example1.txt

    ```


    接下来，我们可以运行上述命令并确认 `example1.txt` 已删除。让我们看看在对 `/tests` 分配粘滞位后，尝试重复之前的步骤会发生什么：


    ```bash

    chmod + t /tests

    touch /tests/example2.txt

    rm /tests/example2.txt

    ```


    正如我们所见，这次粘滞位的存在防止非目录所有者的用户删除不属于他的文件。


    通常情况下，要进入目录（使用 `cd` 命令）并在其中执行操作，需要对该目录及其父目录具有读取和执行权限。要删除一个文件，你需要对父目录具有写权限，并对所有上级父目录具有执行权限。例如，要删除文件
    `/dir1/example.txt`，需要对 `/` 和 `/dir1` 具有执行权限，并且对 `/dir1` 还需要写权限。


    ## 访问控制列表：ACLs


    目录和文件具有为文件所有者、文件所有者组以及系统所有其他用户配置的权限集。但是，这些权限有其局限性。例如，我们无法为同一个目录或文件的不同用户配置不同的权限。为了实现这一点，创建了访问控制列表，通常缩写为
    `ACL`（Access Control Lists）。


    需要说明的是，要使用 ACL，文件系统必须带有相应的选项挂载。默认情况下，`ext4` 系统挂载时开启了此功能。我们可以通过 `tune2fs` 命令加上
    `-l` 选项和文件系统来验证，例如：`tune2fs -l /dev/sda1`。


    通常有两种类型的 ACL：


    *   **访问 ACL (Access ACLs)**：针对特定文件和目录的访问权限列表。

    *   **默认 ACL (Default ACLs)**：这种类型只能与目录关联。如果一个连接到目录的相关文件没有 ACL，它将从默认目录 ACL 继承规则。


    我们可以配置 ACL：


    *   按用户

    *   按组

    *   针对文件用户组之外的用户

    *   通过有效权限的掩码 (mask)


