    ### SMB / CIFS

    The Common File System for the Internet (CIFS) provides a series of open and independent
    mechanisms for the platform used for client systems to request file services from
    other machines through the network. This protocol is an implementation of what
    is known as the Server Message Block (SMB), mainly used by Windows computers [12].
    Microsoft has redefined new protocol dialects (`SMB2` released with Windows Vista
    and `SMB2.1` with Windows 7), to improve performance and reduce communications
    complexity.


    The main features of CIFS are:

    * Access to files, allowing to share information in reading and writing.

    * Blocked and unlocked access to both files and records.

    * Notification of changes in files and directories.

    * Inclusion of extended attributes.

    * Independence of the name resolution protocol.


    CIFS Extensions for UNIX are newly created standards and are only implemented
    in version 2.6 of the Linux kernel file services, while old ones need to be recompiled
    or generate their own module for managing CIFS clients, although they support
    the assembly of `SMBFS` file systems.


    The file server can be a machine with the Windows operating system (from NT) or
    with Linux and the Samba service activated. In both cases, the resources to be
    exported must be configured. Each Linux distribution includes a series of packages
    with the basic tools for the control of CIFS/SMB file systems, clients for access
    to resources, or the Samba file server. Ubuntu 10.04 Lucid distributes the 3.4
    branches of Samba, which incorporates initial compatibility with the future version
    of Samba 4, while Fedora 13 comes with reversion 3.5, which includes experimental
    support for `SMB2`.


    The following table shows the commands used by the Samba client.


    | Mandate | Description |

    | :--- | :--- |

    | `smbclient` | Samba client with an interface similar to the FTP client. |

    | `smbpasswd` | Allows changing the user''s remote password. |

    | `smbcquotas` | Manage quotas on NTFS resources. |

    | `smbcacls` | Manage the access control list (ACL) to the files. |

    | `smbspool` | Send a file to a remote print queue. |

    | `net` | Samba and remote server administration tool. |

    | `pdbedit` | Management tool for the Samba user database. |

    | `findsmb` | List the machines that respond to an SMB request in a subnet. |

    | `mount.cifs` | CIFS file system editor. |

    | `umount` | General disassembly of file systems. |


    The assembly of a CIFS file system requires authentication by username and password.
    The safest method is to indicate in the assembly order a file where the user''s
    credentials (`user`, `password`) are used.


    ```bash

    mount -t cifs Server:MountingPoint /LocalPath

    ```


    ### Chapter 5: Network Settings

    The assembly of a CIFS file system requires authentication by username and password.
    The safest method is to indicate in the assembly order a file where the user''s
    credentials (`user`, `password`) are used.

    ```bash

    mount -t cifs Server:MountingPoint /LocalPath

    ```


    #### Username

    The format for mounting is:

    ```

    Server:MountingPoint

