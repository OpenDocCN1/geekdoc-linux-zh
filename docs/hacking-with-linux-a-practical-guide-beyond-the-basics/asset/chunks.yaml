  trans: '


    让我们看看如何在 `/tmp` 中创建一个名为 `midirectory` 的目录，并显示用户和组所有者：


    ```bash

    mkdir /tmp/midirectory

    ls -ld /tmp/midirectory

    ```


    如果我们想更改 `/tmp/mydirectory` 的所有用户或所有组，可以使用 `chown` 命令：


    ```bash

    chown john:/tmp/midirectory # 更改所有用户

    chown :john /tmp/midirectory # 更改所有组（类似于 chgrp）

    chown john:/tmp/midirectory # 同时更改

    ```


    更改所有组的另一种选项是 `chgrp`：


    ```bash

    chgrp john /tmp/midirectory

    ```


    现在让我们将所有组更改为某某：


    ```bash

    chgrp john /tmp/midirectory

    ```


    在 `chown` 和 `chgrp` 的情况下，最常用的选项之一是 `-R`，它会导致操作递归地应用于目录的所有内容。我们将看到将目录所有组更改为 `john`
    后的结果。


    在 `ls -ld` 输出的第一列中，我们将看到为 `/tmp/midirectory` 的所有用户和所有组分配的权限，以及系统上其他用户的权限：


    *   第一个字母 (`d`) 表示 `/tmp/midirectory` 是一个目录。虽然我们通过之前创建它知道这一点，但有时我们必须识别指示的资源是目录、普通文件（用
    `-` 代替 `d`）还是符号链接（通过存在 `l`）等。

    *   接下来，前三个字符 (`rwx`) 表示所有用户对该目录具有读取 (`r`)、写入 (`w`) 和执行 (`x`) 权限。第二组快捷列表 (`r-x`)
    表示所有组的成员具有读取和执行权限（但没有写入权限）。最后，列表显示系统所有其他用户具有与上述情况相同的权限。


    让我们看看 `rwx` 权限如何允许我们限制对系统资源的访问：


    *   读取权限 (`r`)：用于列出目录的内容。

    *   写入权限 (`w`)：允许向目录添加文件、重命名其他现有文件、删除这些文件或修改目录属性。在任何情况下，必须记住，为了执行这些操作，需要对同一目录具有执行权限。

    *   执行权限 (`x`)：进入目录并访问其中的文件和子目录是必要的。


    要为组成员赋予 `/tmp/midirectory` 的写入权限，我们必须使用 `chmod` 命令，加上选项 `g` (group)、`+` 号和我们要分配的权限（在本例中为
    `w`）：


    ```bash

    chmod g+w /tmp/midirectory

    ```


    如果我们想一次性分配（或移除，此时我们将使用 `-` 号）多个权限，可以轻松做到。例如，让我们看看如何移除系统其他用户（由选项 `o` 或英语中的 `others`
    表示）的读取和执行权限：


    ```bash

    chmod o-rx /tmp/midirectory

    ```


    在如果我们想要同时修改目录及其内容的权限时，可以使用 `chmod` 的 `-R`（递归）选项。以之前的例子为例：


    ```bash

    chmod -R o-rx /tmp/midirectory

    ```


    最后，要为所有用户分配或移除权限，我们使用选项 `u` (英语 user)，而如果我们想为所有人授予或移除特定权限，将使用选项 `a` (来自 all)。这样，以下命令激活了所有用户对
    `/tmp/midirectory` 的执行权限：


    ```bash

    chmod a+x /tmp/midirectory

    ```


    **注意**：拥有资源的用户可以管理组和其他权限。这意味着你可以对你自己的资源授予或移除权限。


    此外，我们可以使用特定的八进制权限代替 `r`、`w` 或 `x`：


    | | 所有者 | 组 | 其他 |

    | :--- | :--- | :--- | :--- |

    | 读取 | 4 | 4 | 4 |

    | 写入 | 2 | 2 | 2 |

    | 执行 | 1 | 1 | 1 |


    为了找到转换帮助，我们可以咨询任何在线权限计算器。例如，要为 `test.txt` 文件为所有者分配 `rwx` 权限，为组分配 `rw` 权限，为其余用户仅分配
    `r`，我们可以这样做：


    ```bash

    chmod u+rwx,g+rw,or +r test.txt

    # 或等效命令

    chmod 764 test.txt

    ```


    所有事实使得负责机器的人在使用 `root` 用户账户时必须特别小心。在下一节中，我们将解释在创建新文件和目录时，设置的权限是从哪里自动生成的。


    ## 文件和目录掩码


    通常，每当我们使用受限用户账户创建文件或目录时，默认分别设置 `rw-rw-r--`（八进制 `664`）和 `rwxrwxr-x`（八进制 `775`）。如果我们以
    `root` 身份操作，权限将设置为 `rw-r--r--`（八进制 `644`）和 `rwxr-xr-x`（八进制 `755`）。这是应用所谓的文件和目录掩码，我们可以使用
    `umask` 命令可视化并更改这些值。


    本质上，生成的权限是通过将用户的掩码从文件的 `666` 和目录的 `777` 值减去得到的。


    以下示例将允许我们说明：


    1. 为任何用户运行 `umask`。

    2. 创建名为 `file1` 的文件时，权限将是 `666` 与文件创建掩码（普通用户为 `002`，`root` 为 `022`）相减的结果。

    3. 当我们添加一个 `dir1` 目录时，权限将是 `777` 与目录创建掩码（值与上例相同）相减的结果。

    4. 移除 `file1` 和 `dir1`。

    5. 为掩码设置新值（在以下示例中使用 `000`）并重新运行步骤 1 到 3 的命令。


    ```bash

    umask 000

    touch file1

    mkdir dir1

    ls -ld file1 dir1

    rm file1

    rmdir dir1

    ```


    我们对掩码的更改将一直保留，直到重启计算机或进行其他修改。如果我们想永久生效，必须将 `umask` 命令与所需的值放在 shell 的初始化文件（`~/.bash_profile`
    或 `~/.profile`）中，并重新登录或使用 `source` 将更改应用于环境：


    ```bash

    source ~/.bash_profile

    # 或

    source ~/.profile

    ```

    取决于我们修改的文件。


    ## 访问权限


    访问权限主要分为类：


    *   普通权限，

    *   特殊权限。


    另一方面，我们已经学习过权限也分为三组：


    *   所有者的权限，

    *   所有组的权限，

    *   系统其他用户的权限。


    访问控制列表 (`ACLs`) 允许你专门为一组用户和组分配权限。


    ### 普通权限


    每个用户在计算机上都有唯一的连接名称，并属于一个或多个用户组。文件或目录的所有者可以选择激活哪些权限以及禁用哪些权限。为了更清楚地检查，请查看 `ls -l`
    命令获取的第一组值，这允许你观察权限。这 11 个字符表示：


    *   1 个字符显示类型：文件 (`-`)、目录 (`d`)、链接 (`l`)、管道 (`p`)、一个符号链接 (`l`) 等。

    *   3 个字符表示所有者的权限。

    *   3 个字符表示组内用户的权限。

    *   3 个字符表示其余用户的权限。

    *   1 个可选字符表示是否定义了 ACL。


    根据目录条目的类型，普通权限字符的含义可能不同：


    | 文件 | |

    | :--- | :--- |

    | 读取 (`r`) | 用户可以读取文件。 |

    | 写入 (`w`) | 用户可以向文件写入。 |

    | 执行 (`x`) | 用户可以执行该文件（只要它是可执行文件或命令解释器脚本）。 |


    | 目录 | |

    | :--- | :--- |

    | 读取 (`r`) | 用户可以读取目录的内容。 |

    | 写入 (`w`) | 用户可以创建、修改和删除目录条目。 |

    |  (`x`) | 用户可以访问目录并将其作为当前目录（通过执行 `cd` 命令）。 |


    '
- fmt: "\nThe following example shows the execution of an `ls` command to see the\
    \ contents and permissions of the `/etc/skel` directory defined by default in\
    \ Ubuntu 10.04 Lucid.\n\n```bash\nls -al /etc/skel\ntotal 32\ndrwxr-xr-x 2 root\
    \ root 4096 2010-05-02 20:26 .\ndrwxr-xr-x 186 root root 12288 2010-05-30 13:49\
    \ ..\n-rw-r--r-- 1 root root 220 2008-05-12 20:49 .bash_logout\n-rw-r--r-- 1 root\
    \ root 3103 2010-04-19 04:15 .bashrc\n-rw-r--r-- 1 root root 179 2010-03-26 13:31\
    \ examples.desktop\n```\nAlso, the \"Permissions\" tab of the properties box of\
    \ the file browser of the GNOME 2.30 environment under Ubuntu 10.04, shows the\
    \ data of the `.bashrc` file from the previous directory. The following table\
    \ shows the necessary permissions to be able to execute some commands.\n\n| Mandate\
    \ | Source Directory Permissions | File permissions | Destination Directory Permissions\
    \ |\n| :--- | :--- | :--- | :--- |\n| cd | X | Not applicable | Not applicable\
    \ |\n| ls | R | Not applicable | Not applicable |\n| mkdir | W, X | Not applicable\
    \ | Not applicable |\n| rmdir | W, X | Not applicable | Not applicable |\n| cat\
    \ | X | R | Not applicable |\n| rm | W, X | - | Not applicable |\n| cp | X | R\
    \ | W, X |\n| mv | W, X | - | W, X |\n\n## Special Permissions\nSpecial permissions\
    \ complement the set of normal permissions, enhance system security, and are used\
    \ to support certain specific operations. As in the previous point, depending\
    \ on the type of directory entry, the special permission characters represented\
    \ by `ls -l` are:\n\n- **Files:**\n    - Active user identifier (s for the owner):\
    \ an executable program can activate the user identifier (SUID), which allows\
    \ a user to become the owner of the file during program execution. For example,\
    \ the `passwd` command accesses files that can only be modified by the root user.\
    \ This command has the SUID active so that during the execution of the program,\
    \ another user is for some time root and can change his password. Special care\
    \ must be taken with these executables because unauthorized users can take privileges.\n\
    \    - Active group identifier (s for the group): as in the previous case, an\
    \ executable program can activate the group identifier (SGID) so that a user can\
    \ perform operations of the group to which the file belongs. For example, the\
    \ `mail` command activates the SGID so that any user can access their mailbox\
    \ without the possibility of reading mail from any other user.\n\n- **Directories:**\n\
    \    - Exchange directory (t in the rest of users): it allows that in shared directories,\
    \ the files can only be modified by the owner (usually used in directories for\
    \ temporary files like `/tmp`).\n    - Active group identifier (s for the group):\
    \ the files created in that directory will have the same group as that of the\
    \ directory itself, instead of the owner's group.\n\nThe administrator must catalog\
    \ all files and directories created after the installation of the operating system\
    \ or any application, and that contain special permissions. Periodically you should\
    \ check the status of these files and verify that they have not been modified.\n\
    \n## Symbolic and Octal Notations\nThe `chmod` command is used to modify the access\
    \ permissions described above and supports two types of notations: symbolic and\
    \ numerical in octal format. The following table shows how to assign permissions\
    \ on both notations.\n\n| Normal permissions | Octal value | Symbolic notation\
    \ |\n| :--- | :--- | :--- |\n| Owner: Reading | 400 | u+r |\n| Writing | 200 |\
    \ u+w |\n| Execution / Access | 100 | u+x |\n| Group: Reading | 40 | g+r |\n|\
    \ Writing | 20 | g+w |\n| Execution / Access | 10 | g+x |\n| Other users: Reading\
    \ Writing | 42 | o+ro+w |\n| Execution / Access | 1 | o+x |\n\n| Special permissions\
    \ | Octal value | Symbolic notation |\n| :--- | :--- | :--- |\n| Owner: Active\
    \ User (SUID) | 4000 | u+s |\n| Group: Active group (SGID) | 2000 | g+s |\n| Other\
    \ users: Exchange directory | 1000 | +t |\n\nThe symbolic notation is used to\
    \ add (+), remove (-), or assign (=) permissions grouped by type. The numerical\
    \ notation in octal format is used to assign all permissions at the same time,\
    \ applying a logical OR operation to obtain the result. See an example. If the\
    \ user has permission to modify the directory and if he owns the files, the following\
    \ modifications will be executed:\n\n- `File1` is assigned to read and write permissions\
    \ for the owner and the associated group and write and execute permissions for\
    \ other users are removed.\n- `File2` is directly assigned to read and write permissions\
    \ for the owner and read permissions for his group. The other users do not have\
    \ any permission.\n\n```bash\n$ chmod ug = rw, o-wx file1\nchmod 640 file2\n```\n\
    \n## Access Control Lists (ACL)\nThe basic distribution of Linux permissions is\
    \ quite rigid; however, Access Control Lists (ACL) are implemented as an extension\
    \ to the file system to define different sets of permissions for users and groups\
    \ individually.\n\nAn ACL consists of a list of entries in which the assignment\
    \ of the 3 basic Unix permissions is specified: read (r), write (w) or execute\
    \ / access (x), in this order; the absence of certain permission is denoted by\
    \ a hyphen (-). The following table shows the generic format of an ACL.\n\n`[Type]:\
    \ [Qualifier]: Permissions List, ...`\n\nThe existence of an ACL defined on a\
    \ file is denoted when the character number 11 of the permission output of the\
    \ order `ls -l` is a plus sign (+). The following table describes the main orders\
    \ for ACL management.\n\n| Mandate | Description |\n| :--- | :--- |\n| getall\
    \ | Returns the access control list to a file or directory. |\n| setfacl | Assign,\
    \ modify, or delete an access control list. |\n"
