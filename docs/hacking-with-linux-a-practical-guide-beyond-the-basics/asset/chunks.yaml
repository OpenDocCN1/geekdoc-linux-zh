    ## 冗余磁盘 (RAID)


    独立磁盘冗余阵列 (RAID) 代表了一组用于节省成本或提高质存储访问性能和安全性的有效技术，它将多个磁盘组合在单个逻辑设备中。RAID 的核心概念是根据需要将数据划分为某些部分并将其分布到阵列设备中。在读取过程中遵循反向重构算法。RAID
    中磁盘使用的主要特征有：


    * 提高数据访问速度。

    * 增加存储容量，将较小容量的磁盘组合成一个较大的逻辑磁盘。

    * 提高磁盘的容错能力。


    有专门的设备和控制器可以在其硬件上独立执行 RAID 技术，这会增加机器的性能和最终价格。新的操作系统则适合在软件层面执行此任务。下表描述了最常用的 RAID
    级别。


    | `RAID 0:` | 数据被划分为若干带，并将每个带写入一个磁盘中。访问性能得到提高。总容量是每块磁盘容量之和。 |

    | `RAID 1:` | 数据存储在镜像中，在每块磁盘上重复相同的写入。系统的安全性和容错能力提高，因为可以替换缺陷磁盘而不影响机器的运行。总容量对应于任意磁盘的容量（所有磁盘必须相等）。
    |

    | `RAID 5:` | 使用超过 2 块磁盘来分布数据块及其校验位。安全性、优势和成本都增加了。总容量约为所有磁盘容量的总和减去 1 个。 |

    | `RAID 6:` | 它是带有 2 个校验带的 `RAID 5`。它进一步增加了系统的安全性和成本。与 RAID 5 相比，总容量有所减少。 |

    | `RAlinear:` | 磁盘按顺序分组以形成一个更大的逻辑磁盘。没有增加优势或安全性，仅增加了容量。 |


    如果要将用于软件 RAID 的分区挂载到 Linux 的关键文件系统上，则必须在操作系统安装过程中定义它们。使用诸如 Disk Druid（用于 Fedora
    和 Red Hat Enterprise）等工具允许你定义 RAID 分区、关联冗余级别并生成逻辑磁盘（`metadevice`）。矩阵的定义在文件 `/etc/raidtab`
    中。接下来的示例显示了由 2 块磁盘 `sda1` 和 `sdb1` 分区组成的 `md0` RAID 1（镜像）元设备的配置，它包含一个挂载在根目录上的
    `Ext3` 类型文件系统。


