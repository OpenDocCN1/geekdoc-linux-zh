    *   Blocked and unlocked access to both files and records.


    *   Notification of changes in files and directories.


    *   Inclusion of extended attributes.


    *   Independence of the name resolution protocol.


    CIFS Extensions for UNIX are newly created standards and are only implemented
    in version 2.6 of the Linux kernel file services, while old ones need to be recompiled
    or generate their own module for managing CIFS clients, although they support
    the assembly of SMBFS file systems.The file server can be a machine with the Windows
    operating system (from NT) or with Linux and the Samba service activated. In both
    cases, the resources to be exported must be configured.Each Linux distribution
    includes a series of packages with the basic tools for the control of CIFS / SMB
    file systems, clients for access to resources, or the Samba file server.Ubuntu
    10.04 Lucid distributes the 3.4 branches of Samba, which incorporates initial
    compatibility with the future version of Samba 4, while Fedora 13 comes with reversion
    3.5, which includes experimental support for SMB2.The following table shows the
    commands used by the Samba client.


    | Mandate | Description |


    | smbclient | Samba client with an interface similar to the FTP client. |


    | smbpasswd | Allows changing the user''s remote password. |


    | smbcquotas | Manage quotas on NTFS resources. |


    | smbcacls | Manage the access control list (ACL) to the files. |


    | smbspool | Send a file to a remote print queue. |


    | net | Samba and remote server administration tool. |


    | pdbedit | Management tool for the Samba user database. |


    | findsmb | List the machines that respond to an SMB request in a subnet. |


    | mount.cifs | CIFS file system editor. |


    | umount | General disassembly of file systems. |


    The assembly of a CIFS file system requires authentication by username and password.
    The safest method is to indicate in the assembly order a file where the user''s
    credentials (user, password, and optional authentication domain) are included,
    with the following format:Username = RemoteUserPassword = KeyThe format for mounting
    a CIFS file system is as follows:mount –t cifs // Server / Resource PointMounting
    \–o credentials= FileCredentials [,Option=Value,... ]Chapter 5: Network SettingsThe
    computer network is the means by which the server can communicate with users and
    other machines, both servers and clients, allowing the mass exchange of information
    between computers.According to the planning carried out, the company must have
    adequate infrastructure for data exchange. Also, server devices must meet the
    expected needs, offering adequate bandwidth and processing capacity.There is a
    wide variety of types of networks and communications protocols; however, this
    chapter focuses on Ethernet networks with TCP / IP protocols, the most used in
    connection to the Internet and private networks.Network InterfacesThe computer
    needs a device - known as a network card - that allows it to connect to each of
    the subnets it has directly at its disposal.The Linux operating system can work
    with a wide variety of types of machines and peripherals. To normalize access
    to the network, the system has a series of basic functions. The set of these functions
    used in a given communications architecture is known as a network interface.Finally,
    the network interface dialogues with the physical device through a specific kernel
    module called a network controller.Modern versions of Linux automatically detect
    network cards, load the appropriate kernel modules, and assign default network
    interfaces. The administrator can set the connection parameters during the system
    installation process.Linux establishes a nomenclature for each type of network
    interface, adding an order number for each connector of the same type (starting
    with the number 0). The following table describes the nomenclature used by Red
    Hat for the main network interfaces.


    | Interface | Description |


    | lo | Virtual interface for testing (IP address 127.0.0.1 is assigned). |


    | eth | Ethernet devices (you can also define ADSL and Ethernet devices.). |


    | wlan | Wireless Ethernet devices |


    | tr | Token Ring-type ring networks. |


    | ppp | Modem or ISDN connection. |


    | hdi | Bluetooth device |


    Each network device has a unique and different physical media access address (MAC
    address), assigned by the manufacturer. However, the connection parameters must
    be assigned during the activation process of the network interface.The MAC address
    of an Ethernet card is made up of 48 bits represented in 6 fields with 2 hexadecimal
    digits each.TCP / IPThe TCP / IP (Transmission Control Protocol / Internet Protocol)
    communications protocol allows the location and communication of all types of
    machines connected to the Internet. TCP / IP consists of a set of protocols based
    on layers:


    *   The network layer –equivalent to level 3 of the OSI standard–,, which establishes
    the optimal path that the information packets that communicate several machines
    must follow. Use Internet Protocol (IP).


    *   The transport layer –equivalent to level 4 of the OSI protocol stack–, which
    allows a connection between nodes in the network to be established. There are
    2 transport protocols: the Transmission Control Protocol (TCP) –which performs
    synchronous and secure communication with data recovery in case of error– and
    the User Datagram Protocol (UDP) –which allows an asynchronous communication based
    on packages called datagrams.


    *   The TCP / IP protocol set establishes a mechanism based on addresses and names
    that allows unequivocally to locate each machine connected to the Internet. The
    equivalences between IP addresses and machine names are made by special computers
    that answer queries using the protocol known as Domain Name Service (DNS).


    The system administrator has to set the parameters for each network interface
    of the system, either through local configuration files, or generated by a remote
    DHCP server, which can be assigned the values ​​ statically or dynamically. In
    both cases, the aspects described in the following table must be specified.


    | The IP address of the interface: | Unique and differentiated address throughout
    the Internet or in the private network, consisting of 32 bits in IPv4 or 128 bits
    in IPv6. |


    | Net Mask: | Specify by a logical operation AND the bit portion of the IP address
    common to all machines on the same subnet. |


    | Network broadcast address: | Used to send information packets to all devices
    on the same subnet. |


    | Node name and network domain name: | Both values together describe easily and
    uniquely a particular machine in the entire Internet or in the private network.
    |'
