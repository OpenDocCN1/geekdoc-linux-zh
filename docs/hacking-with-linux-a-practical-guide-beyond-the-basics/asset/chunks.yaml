    `setfacl` 命令用于配置目录和文件的 ACL（访问控制列表）。`-m` 选项（或其等价 `--modify`）用于修改目录或文件的 ACL。该工具负责在文件或目录（下例中的
    `<object>`）上执行 ACL 权限更改（用 `<groups>` 表示）。其语法如下：


    ```

    setfacl -m <roll> <object>

    ```


    举一个示例来此说明。`John` 和 `John` 用户都是 `family` 组的成员。因此，他们对文件 `/common/archivaltest` 都具有读取和写入权限。使用传统的权限方案，为每个用户为该文件分配不同级别的访问权限会变得有些复杂。为了解决这种情况，我们可以使用访问控制列表。假设我们希望
    `John` 继续拥有写入权限，但另一个用户只能读取。为了实现这一目标，我们将为后者在 `/common/archival test` 中创建一个只读的 ACL，如下所示：


    ```

    setfacl -m u:john: r /common/testfile

    ```


    通过 `getfacl /common/testfile` 我们可以验证 ACL 是否已应用。现在让我们关注修改后尝试写入同一文件的结果。要消除该 ACL，我们将使用：


    ```

    setfacl -x u:john /common/testfile

    ```


    此后，用户将再次对 `/commons/proof` 拥有写入权限。如果我们在同一个文件上创建了多个 ACL，可以使用 `setfacl -b` 后跟文件路径来一次性删除它们。默认
    ACL 通过添加 `-d:` 来分配：


    ```

    setfacl -dm g:family: r /common

    ```


    通过这种方式，稍后添加到 `/common` 的任何文件都将继承相同的规则（`family` 组成员可以读取它们，但不能写入）。


    ### 特殊属性

    除了与所有者、所有组和系统其他用户关联的读取、写和执行权限外，Linux 还允许我们在文件和目录中设置其他属性。这些属性特定于文件系统的类型。在本节中，我们将介绍在扩展类型文件系统中可以找到的一些属性（我们将使用
    `ext4` 作为示例）。通过使用这些属性，我们可以防止某些文件被删除或重命名，或者防止其内容被删除。


    要查看可用特殊属性的完整列表，可以查阅 `chattr` 手页。如果我们想查看文件或目录中设置了哪些属性，将使用 `lsattr` 后跟对象的路径。首先，我们将在当前目录下创建两个名为
    `test1.txt` 和 `test2.txt` 的文件。在每个文件中，我们随后添加以下内容：


    ```

    echo "I am the file test1.txt"> test1.txt

    echo "I am the file test2.txt"> test2.txt

    ```


    现在我们对建立以下特殊属性感兴趣：

    - 只追加（append-only），用 `a` 表示。

    - 不可变（immutable），用 `i` 表示。

    - 这些属性分别允许我们：

    - 向文件添加内容，但不删除任何内容。

    - 防止其被删除、重命名、编辑或向其添加链接。


    使用具有超级用户权限的账户，为 `test1.txt` 添加只追加属性，并为 `test2.txt` 添加不可变属性：


    ```

    chattr +a test1.txt

    chattr +i test2.txt

    ```


    现在让我们回到普通用户账户，看看当 1) 我们尝试添加和删除 `test1.txt` 的测试内容时，2) 对 `test2.txt` 执行相同操作，3) 删除、重命名、编辑或创建测试链接
    `2.txt` 会发生什么。在上述属性存在的情况下，失败的操作无法执行。最后，要删除它们，我们必须（也需要 root 用户）：


    ```

    chattr -a test1.txt

    chattr -i test2.txt

    ```


    使用文件属性可以帮助我们防止（例如）获得系统访问权的入侵者修改或删除系统日志（如果此类文件具有相应的属性！）。还可以从一个目录将默认 ACL 复制到另一个目录。在工作中，我们经常发现一个目录应用了许多访问控制规则，并且希望在另一个目录中复制这些规则。为此，我们将同时使用
    `getfacl` 和 `setfacl`：


    ```

    getfacl directory1 | setfacl -b -n -M - directory2

    ```


    上述命令使用 `-M` 选项将 ACL 从 `directory1` 复制到 `directory2`，该选项允许 `getfacl` 的输出转换为 `setfacl`
    的输入。此外，记住 `-b` 表示应该清理第二个目录的 ACL（如果存在），并通过 `-n` 为其建立新的 ACL。


    # 第 4 章：文件系统

    妥善管理磁盘访问是多用户多任务操作系统管理过程的另一个重要方面，对于维护具有特定组织级别的基本结构至关重要。操作系统与用户和应用程序交互，一个取决于文件在设备上存储方式的安全模型是必要的。文件系统可以从文件的两个逻辑范类来看：

    - 无法购买或与其他机器共享的本地文件。

    - 静态或变量文件。


    因此，文件系统是一个带有根目录的目录子树——根目录必须根据访问其文件的需要具有权限——一个逻辑存储结构以及全局服务器目录树中适当的挂载点。


    ### 文件系统层次结构标准 (FHS)

    文件系统层次结构标准 (FHS) 描述了一组规则，允许用户和程序预测系统中安装的文件和目录的位置。下表简要描述了主层次结构中的子目录，按字母顺序排列。


    | 目录 | 说明 |

    | :--- | :--- |

    | `/bin` | 用于所有系统用户的基本二进制文件。 |

    | `/boot` | 静态加载器文件。 |

    | `/dev` | 其条目代表系统设备（应该记住“在 Unix 中，一切皆文件”）。 |

    | `/etc` | 本地系统配置。 |

    | `/home` | 用户账户（如果定义，则必须是一个独立的系统）。 |

    | `/lib` | 共享系统库和核心模块。 |

    | `/lib32/lib64` | 针对 32 位或 64 位架构的特定库。 |

    | `/media` | 可移动式设备（软磁盘、CD/DVD、USB 连接等）的挂载点。 |

    | `/mnt` | 临时文件系统的挂载点。 |

    | `/opt` | 大型应用程序包的共享区域（可以是一个拥有独立层次结构的独立文件系统）。 |

    | `/proc` | 关于进程和内核信息的虚拟文件系统。 |

    | `/root` | root 管理员账户（可选）。 |

    | `/sbin` | 系统二进制文件 |

    | `/srv` | 系统提供的服务数据。 |

    | `/usr` | 与主结构相似的次级层次结构，包含供其他计算机只读访问的信息（在服务器上必须是独立的文件系统）。 |

    | `/usr/local` | 本地软件的层次结构（必须是独立的文件系统）。 |

    | `/tmp` | 临时文件的共享区域。 |

    | `/var` | 变量信息，包括历史、状态、阻塞、恢复、作业队列等。 |


    ### 磁盘与分区

    所有 Unix 系统——因此所有 Linux 变言都使用设备文件来访问机器资源，存储在 `/dev` 目录。然而，每个 Unix 变言都有不同的表示法来识别每个存储设备。Fedora
    13 和 Ubuntu 10.04 Lucid 使用以下格式识别单磁盘的分区控制器文件：

    - 设备类型（`sd` 用于普通磁盘）。

    - 单元（`a` 表示设备 1，`b` 表示 2，以此此类推）。

    - 分区编号。


    在情况冗余硬件磁盘的情况下，设备文件位于以 RAID 控制器命名的子目录下（例如对于 HP Smart Array 使用 `cciss`），其名称具有以下格式：

    - `cN`（控制器编号，从 0 开始）。

    - `dN`（磁盘编号，从 0 开始）。

    - `pN`（分区编号，从 1 开始）。


