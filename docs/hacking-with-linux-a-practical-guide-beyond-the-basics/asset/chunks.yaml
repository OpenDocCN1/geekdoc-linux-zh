    要更改这些权限，请使用 `chmod` 命令。请参阅下一章关于使用该命令的说明。


    ## 目录

    我们将目录树称为目录文件的组织结构，这比喻了它们的分支，类似于树的分支。我们将根目录命名为 "root"，它包含了所有其他子目录。


    * 当前目录是用户在给定时刻所在的目录。

    * “主目录”（Home）是用户账户注册的地方。

    * 上级目录（ascending directory）是包含给定文件或目录的目录。

    * 下级目录（descending directory）是被包含在目录。


    路径是从根目录到文件需要遍历的目录列表，用斜杠分隔各个部分。绝对路径是从根目录到文件的完整路径。如果根目录到文件的完整路径为 `/root/pet/courses/Linux`，而用户当前的工作目录是
    `pet`，那么他可以输入 `courses/Linux`。这个名称被称为相对路径。


    下面列出了主要目录及其内容：


    * `/etc` - 用于系统管理的文件。

    * `/bin` - 最常用的 UNIX 命令。

    * `/usr` - 所有的用户账户和某些命令。

    * `/dev` - 输入/输出设备文件。

    * `/lib` - C 语言编程的库文件。

    * `/tmp` - 临时文件存储。

    * `/mmt` - 挂载磁盘和外设。

    * `/sbin` - 系统启动时使用的目录。其他系统管理软件包应该位于 `/usr/sbin` 或 `/usr/local/sbin`。

    * `/var` - 包含各种文件的目录，如打印队列（邮件、crontab、打印）和日志。该目录的存在是为了让那些需要修改的文件存储在此，而不是在 `/usr`
    中。

    * `/home` - 包含用户的家目录。

    * `/root` - 这是包含管理员文件（你的家目录）的目录。然而，某些 Unix 类系统使用 `/home/root`。

    * `/proc` - 内核存储信息的虚拟目录。

    * `/boot` - 包含内核镜像以及启动过程所需的配置之外的所有内容。


    ## 进程

    ### 进程与子进程

    进程通常是一个运行在独立虚拟地址空间中的简单程序。它与命令或任务不同，在 UNIX 系统上，一个命令或任务可以由多个执行单一任务的进程组成。例如，执行 `ls`
    等简单命令是简单的进程。但一个包含管道的复杂命令根据规则为每个管道部分执行一个进程。为了跟踪每个进程的状态，系统会为每个打开的进程创建一个 `PID`（进程
    ID）。


    还有一些称为执行控制指南的元素，可以帮助控制程序的执行。


    1. **Fork**：这是一个系统调用，其执行会创建一个与调用者相同（相同的）进程。父进程：生成新进程的进程。

    2. **子进程（Child Process）**：由父进程生成的进程。

    3. **Pid（进程 ID）**：这是一个唯一标识每个进程的数字，用于引用它。

    4. **父进程 ID (PPid)**：这是父进程的 `Pid`。


    ### 进程控制

    有一些主题可以允许用户执行一些有趣的任务，例如：


    * 同时执行多个进程；

    * 以低优先级运行进程。


    如果你正在使用一个需要长时间才能完成的程序，并且想开始处理另一项任务，可以调用你的程序在所谓的“后台”中运行。这可以通过在命令行末尾添加 `&` 符号来实现。你也可以在程序运行时按下
    `CTRL + Z`。这样做之后，命令将被挂起，系统将返回提示符。


    我们将“前台化”（foregrounding）称为让程序在前台运行的行为。在这种模式下，进程可以与用户交互并在显示器上显示执行情况。


    当将 `nice` 命令放在命令行之前时，CPU 执行该任务的时间会被减少，这样它就不会阻塞过多更重要的进程。也就是说，该进程的优先级降低了。当系统上有其他更重要的进程运行时，应该使用此命令。


    其他与进程相关的命令：


    * `jobs` 列出后台作业。

    * `fg [job]` 将作业移至前台。`bg [job]` 将作业移至后台。

    * `ps` 显示电脑上运行的进程。

    * `top` 持续显示电脑上每个进程的状态。

    * `kill [Pid]` 终止进程。


    下面的示例说明了其中一些命令的使用。系统上运行以下脚本：


    ```bash

    #! /bin/bash

    #Sleep 10

    echo "It''s time to leave !!!"

    date

    ```


    该程序在设置运行 10 分钟后发出警告，然后显示日期和时间。让这个程序一直运行并锁定终端是没有意义的，因为你本可以做其他事情，因此可以将其放入后台以释放终端。10
    分钟后，消息出现。该程序名为 `latch.sh`。


    ```bash

    $ ./lock.sh & [1] 2906

    $ jobs

    [1]+ Running ./lock.sh &

    $ ps

    PID TTY TIME CMD

    1916 ttyp1 00:00:00 bash

    2906 ttyp1 00:00:00 lock.sh

    2907 ttyp1 00:00:00 sleep

    2909 ttyp1 00:00:00 ps

    $ fg 1.

    ./lock.sh

    here was typed: ctrl + z

    [1]+ Stopped ./lock.sh

    $ jobs

    [1]+ Stopped ./lock.sh

    [1]+ Stopped ./lock.sh

    $ bg 1

    [1]+ ./lock.sh &

    $ jobs

    [1]+ Running ./lock.sh &

    $ ... 在等待消息出现期间执行杂杂用户命令 ...

    $ It’s time to leave!!

    Tue Jan 10 16:01:51 PST 2006

    here was typed: enter

    [1]+ Done ./lock.sh

    $ jobs

    $ ps

    PID TTY TIME CMD

    1916 ttyp1 00:00:00 bash

    2935 ttyp1 00:00:00 ps

    $

    ```


    如所示，程序是在后台执行的。`jobs` 命令显示了作业 `lock.sh` 的所有状态：运行、挂起和再次运行，正如 `ps` 命令所做的那样。


    ## 第 2 章：用户、组、权限与用户管理

    ### 管理员任务

    任何类型服务器的管理员都必须是专业人士，能够尽可能地了解其设备、应用程序和用户，并进技术进展、已安装软件的审查和补丁。


    ### 需求规划与预测

    系统管理的主要功能之一是对管理任务进行详细计划，这可以避免执行时出现意外。系统分析师应就计算机设备采购的技术需求向管理人员提供建议，并根据公司的经济能力估算所需的资源。


    一旦收到设备，必须执行安装计划，至少包含以下信息：


    * 可用资源的文档和研究。

    * 可能扩展的预测。

    * 填写在公司网络中注册并激活连接参数的申请。

    * 运行环境需求（UPS、空调等）文档。

    * 操作系统、所需应用程序以及新设备提供的服务的注册、配置、安装和更新文档。

    * 创建并发布用户账户、程序安装、资源改进等的申请。


    ### 文档

    系统管理员还承担为计算中心编制内部文档的任务，文档必须描述以下需求：


    * 用户和组的更新注册。

    * 每个用户组的使用策略和权限。

    * 系统操作员执行的常用程序描述（备份、账户管理、报告等）。

    * 服务器配置变更的完整更新记录（操作系统、应用程序、文件等）。

    * 定期收集和存档系统及其组件性能数据。

