    # 自动化

    公司的 IT 人员必须定期执行行动计划中定义的函数。程序员需要将这些大多数重复性程序自动化，以避免输入错误或概念性错误，并提高应用程序的整体处理水平。在每台服务器上至少必须自动化以下任务：


    - 检查磁盘剩余空间。

    - 用户账户管理和磁盘配额的定期审查。

    - 根据行动计划创建、检查和恢复备份副本的程序。

    - 检查并记录系统和计算机网络的整体性能。

    - 特定作业（报告、服务管理、文档创建等）。

    - 创建安全告警（更改检查、入侵检测等）。


    # 通知用户

    系统管理员还必须让用户了解情况，并提供操作和良好使用的指南，以避免因无知而导致的错误。有必要对可能影响每个用户组的更改进行报告，并注明以下信息：


    - 系统将进行的更改性质及其时间演变。

    - 每项修改将于何时进行。

    - 操作预期的结果是什么，以及实际结果如何。

    - 操作持续的预计时间和实际时间。

    - 对用户可能的影响（新配置、系统关机等）。

    - 用于收集问题和查询的联系信息。


    另一方面，系统负责人必须深入了解其用者的通用行为，记录他们的查询、建议以及性能和资源使用数据。这使我们能够提供更高质量的服务。


    # 系统安全控制

    根据系统处理的信息类型，管理员必须为服务器和企业网络定义其安全策略，因为用户拥有对其数据隐私和完整性的权利。必须采取措施来避免可能的攻击或计算机故障，这些故障可能会影响甚至瘫痪机器的正常运行。你永远不要认为一个系统是完全安全的，或者认为它只能从外部受到攻击。因此，超级用户必须执行以下操作：


    - 激活并审查事件的审核记录。

    - 对系统中可能出现的意外更改进行定期审查。

    - 安装确保计算机网络和服务器安全的设备和应用程序（防火墙、过滤器、入侵检测系统、访问卡读器等）。


    # 故障预测

    最后，公司必须采取必要的物理手段来防止和纠正可能的计算机故障。环境变化（电力、温度、湿度……）是预防错误的最重要且昂贵的方面之一。应该强调以下主题：


    - 拥有正确的电气安装，防止电压意外下降和上升，并安装不间电源（`UPS`）来保护公司的关键服务（通信机柜、服务器等）。

    - 拥有适当的空调系统，过滤并调节环境的温度和湿度，且不影响操作者的健康。

    - 拥有充足的光线，且不影响计算机电源线。

    - 在计算机网络中维持适当的基础，对通信设备提供方便且受限的访问。


    其他难以预测的可能故障原因包括：


    - 系统资源的饱和或故障（处理器、内存、磁盘等）。必须权衡请求扩展或更换受影响组件的性。

    - 编程故障，包括操作系统、已安装的应用程序或程序本身的故障。管理员必须了解其需要安装的更新和补丁。

    - 管理员本身、操作员、技术服务或终端用户的人为错误。


    # 权限与用户管理

    在 Linux 上管理用户和组账户是任何系统管理员的基本任务。在本章中，我们将向你展示如何在 Linux 中创建、修改和删除用户账户和组。这包括如何为这些组和用户设置权限，以便根据需要访问文件和目录。


    ## 用户管理简介

    GNU / Linux 用户内部数据库与两个文件相关：

    - `/etc/passwd` 包含用户名

    - `/etc/shadow` 包含用 `SHA512` 加密的密码


    良好的安全策略是定期更改密码。通过这样做，即使他们能够解密我们的密码，这样做也需要更多的时间，并且希望在他们成功之前，我们已经再次更改了。密码必须是字母和数字的组合，包括大写字母和小写字母，以及如
    `%`、`_` 或 `$` 等特殊字符。


    ## 文件描述 /etc/passwd

    当我们添加一个用户时，操作系统会在 `/etc/passwd` 文件中添加一行，并在 `/etc/group` 中为创建的每个用户添加一个组。与组一起工作使管理员的任务更容易，因为它们允许更高效、更少费力的权限管理。


    在添加用户时，我们不仅添加了该用户和组，还添加了他们的邮箱。邮件文件创建在 `/var/spool/mail/` 目录下，最后会创建你的个人目录（通常简单称为
    home）。每个用户就在这最后一个位置以子目录的形式组织他们的个人文件。在此之外，你无法写入内容（`/tmp` 和 `/var/tmp` 目录除外）。


    > 注意：在添加新用户账户时，`.bashrc`、`.bash_profile` 和 `.bash_logout` 文件也会从 `/etc/skel/` 拷贝到你的家目录。前两个包含用户提示符和命令别名的信息，而第三个存储了用户执行注销（系统退出）时要执行的信息。


    这一切在注册注册新用户时同时发生。为此，操作系统使用 `PAM`（可插拔管理模块）。`PAM` 模块定义在 `/etc/pam.d` 目录下。


    用户和服务登录过程与 `PAM`（可插拔认证模块）有关。因此，在开始使用添加用户的命令之前，让我们看看操作系统是如何验证这些内容的。


    `PAM` 是认证检查和授权的层级结构。这些检查分布在管理组中。这些组由一个或多个堆叠的 `PAM` 模块组成，每个模块执行特定的测试函数。其中某些检查可能是强制的（如用户是否存在），另一些是可选的。


    > 注意：`PAM` 配置位于 `/etc/pam.d/` 目录。每个具有 `PAM` 能力的应用程序或服务在 `/etc/pam.d/` 目录下都有一个文件。该目录下的每个文件名与其控制访问的服务同名。如果一个应用程序使用
    `PAM`，它就负责定义其服务名称并在 `/etc/pam.d/` 目录中安装自己的配置文件。例如，登录程序定义其服务名称为 `login`，并在 `/etc/pam.d/login`
    中安装 `PAM` 配置。


    让我们查看 `/etc/passwd` 文件中对应 root 和 student 用户的行：

    ```

    root: x: 0: 0: root: /root: /bin/bash

    student: x: 1000: 1000: student,,: /home/student: /bin/bash

    ```

    每行由 `:`（两个冒号）分隔成 7 个字段。每个字段的含义如下：


    1. 用户名

    2. 如果包含 `x`，表示该用户在 `/etc/shadow` 中有一个加密密码

    3. UID（用户 ID）

    4. GID（组 ID）

    5. 用户全名，以及关于关于它的附加信息，如工作电话或家庭电话

    6. 关于用户的描述性注释。


