    to important system files and to ensure the privacy of every user who has an account
    on the system. The system differentiates three classes of users. First, every
    file has an owner, designated in the system by the user. The owner has full control
    over the restriction or permission to access the file at any time. In addition
    to individual ownership of the file, it is possible for one or more system users
    to own the file collectively in a group property type. A user who does not own
    the file may have access to it if they belong to the user group that has permission
    for this. However, this user cannot restrict or allow access to the file. Users
    who do not own or belong to a group that has access to the file from the last
    category, known simply as "others."


    *   The owner (designated by u, user): who created the file.


    *   Group (called g, from group): The group consists of one or more users who
    can access the file.


    *   Other (referred to as o by others): Refers to any other system user.


    The Unix system also allows three modes of file access: reading, writing and execution.
    The three access modes are relatively logical, but the meaning of these three
    access modes is different for directory files. The user with reading permission
    can read the directory contents, for example, with the command "ls." The user
    with write permission can use some privileged programs to write to a directory.
    Write permission is required to create or remove files from the directory.A user
    must have execute permission on a directory to have access to the files allocated
    there. If a user has read and write permission on a common file that is listed
    in a directory but does not have to execute permission for that directory, the
    system will not let him read or write the contents of that common file.A file
    that has its permissions like those in the example above could be read, written,
    or executed by the owner or anyone else. In the example below, the owner can read
    and write, the others can only read, and no one can execute it.


    | User | Group | Others |


    | r w - | r - - | r - - |'
