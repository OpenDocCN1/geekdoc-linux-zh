    # 第 11 章：磁盘配额 (Disk Quotas)


    存储是一个必须授予并仔细监控的资源，特别是在作为邮件或 Web 服务器的 Linux 系统上。除了可能无法保存新文件的问题，可用空间不足的系统很快就会遇到性能问题。因此，应该对每个文件系统的磁盘使用量和用户可以创建的文件数设置限制（通常称为用户和组配额）。


    ## 之前的步骤


    在开始之前，考虑以下有用点是非常重要的（两者都与配额分配的两种方法有关）：


    - 一个磁盘块对应 1 KB。块费用将对应系统中可以使用的总块数。回想一下，文件是保存在在磁盘块中的。这样，一个 100 字节的文件将占用硬盘上一个 1 KB
    的数据块，因为块是划分的最小单位。

    - `inode`（或英文中的 index node inode）是一个数字，它充当文件系统的指针，并指示文件数据位于磁盘的哪些特定块中。此外，你引用中的
    `inode` 存储了关于权限、所有者、属性等的信息。可以用一个简单的类比来看：`inode` 就像是每个系统文件的唯一序列号，通过这个数字，系统检索其数据（块）和其属性（权限、所有者、日期等）。


    `inodes` 费用将指示用户有享的 `inodes` 总数。换句话说，可以说这代表了用户可以创建的文件总数。记住，这并没有改变用户仍然可以在现有文件上创建符号链接的事实，这不会增加
    inode 的数量。无论如何，为了简单起见，我们可以认为 `1 inode = 1 file`。


    在文件系统中启用配额的第一步是使用 `/etc/fstab` 文件中的行通过 `usrjquota` 或 `grpquota` 选项（分别用于用户或组配额）挂载它。为了说明，假设逻辑卷
    `/dev/vgcareerlinux/lvadministrador` 和 `/dev/vgcareerlinux/lvredes` 存在且之前已 `ext4`
    格式化，让我们在第一个中启用组配额，在第二个启用用户配额。


