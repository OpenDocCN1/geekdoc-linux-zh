    * `inodes` are the number of inodes (which represent the number of files owned
    by the student user) currently used.

    * the soft lower limit of `inodes`.

    * the hard upper limit of `nodes-i`.


    When using the soft limit, two situations can occur: 1) If a grace period is not
    established, the user can continue using blocks or inodes until the hard limit
    is reached, which will be his absolute limit of use. 2) Otherwise, you will be
    allowed to continue using blocks or inodes until the grace time is over or the
    hard limit is reached, whichever comes first. Let''s see in the following image
    what happens if the student user tries to save a 15 MB file in `/srv/networks`
    (mount point of `/dev/mapper/vgcareerxyz-lvredes`):


    ```bash

    dd if=/dev/zero of=/srv/networks/test.iso bs=15M count=1

    ```


    As we can see, the file was truncated in the hard limit set for the student user
    in `/srv/networks/`. To set the limit for groups, proceed in the same way, only
    we will use `edquota -g student` # Edit group fees. Finally, to change the grace
    period globally, you must use `edquota -t` to change the value and denomination
    of the time interval to the desired one. The default value (`7days`) can be replaced
    by an amount `X` and the keywords `seconds`, `minutes`, `hours`, `days`, `weeks`,
    or `months` (`seconds`, `minutes`, `hours`, `days`, `weeks`, or `months`, respectively).
    By specific user it is done with the `-T` option of the same command and indicating
    the user: `edquota -u student -T`. Grace times per user should always be shorter
    than the global one. In this way, `2weeks` change the grace period to 2 weeks
    for the use of blocks and `3days` to 3 days for the use of inodes.


    ### Notices of Exceeded Fees


    To avoid reaching the instance of an exceeded quota, we have two valuable resources
    to report the use of i-blocks and nodes: the `quota` and `repquota` commands:


    ```bash

    quota -u student

    repquota /srv/networks

    ```


    Both tools indicate that in this case, the student user has reached both hard
    limits and, therefore, that the grace period has been activated. To report the
    use of group fees, we will also use `quota` but with the `-g` option followed
    by the group name. If what we want is to immediately notify by email about this
    situation, we will use the `warnquota` command. When invoking this utility without
    arguments, file systems with quotas activated will be reviewed. When identifying
    the responsible users, an email will be sent notifying them of the above. We can
    add in `/etc/crontab` a line like the following one so that `warnquota` do your
    job every hours:


    ```bash

    0 12 * * * warnquota

    ```


    ### 12. Startup and Services


    #### Boot Process


    During the startup, the kernel is loaded to configure and activate services. The
    boot process of Linux on `x86` follows the steps:


    1. `BIOS` performs the necessary checks and loads the loader, located on the first
    disk.

    2. `GRUB` executes the first step, selecting the partition.

    3. The kernel is loaded into memory, and the root partition is mounted.

    4. The kernel loads the necessary modules to control the specific devices.

    5. `SystemVInit` or `Upstart` provides the environment and starts the services.


    The configuration file for `GRUB` is usually `/boot/grub/menu.lst` or `/boot/grub/grub.conf`.
    To change the options, the `warnquota` command is used.

