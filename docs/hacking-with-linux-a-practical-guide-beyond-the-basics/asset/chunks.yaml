  trans: "\n\n*   在执行之前，检查要压缩的目录是否存在。如果不存在，则以错误代码 `10` 退出（任意选择的错误代码）。\n*   如果压缩成功，在屏幕上显示一条指示消息。否则，显示描述性消息并以错误代码\
    \ `20` 退出（另一个任意选择）。\n*   验证 tar 包是否不为空（即检查其大小是否不等于 `0 B`）。根据情况显示相应的确认或错误消息（在最后一种情况下，以错误\
    \ `30` 退出）。\n\n生成的脚本如下：\n```bash\n#!/bin/bash\n# 要压缩的目录是第一个参数\nDIRECTORY = $1\n\
    # Tar 包名\nFILE = $2\n# 检查目录是否存在\nif [ -d $DIRECTORY ]; then\n  # 压缩 $DIRECTORY\
    \ 的内容\n  tar czf $ARCHIVE $DIRECTORY /*\n  if [ $? -eq 0 ]; then\n    if [ -s\
    \ $ARCHIVE ]; then\n      # 在屏幕上显示消息\n      echo \"You have finished backing $DIRECTORY\
    \ in $ARCHIVE.\"\n    else\n      # 针对空文件报告错误\n      echo \"The resulting file\
    \ ($FILE) is empty\"\n    fi\n  else\n    # 报告错误并完成\n    echo \"Compression of\
    \ $DIRECTORY in $FILE not completed or correctly.\"\n    exit 30\n  fi\nelse\n\
    \  # 如果目录不存在并以错误代码退出\n  echo \"The directory $DIRECTORY does not exist.\"\n  exit\
    \ 10\nfi\n```\n\n现在让我们解释每个 `if / else` 块中参数的用途：\n\n*   `-d` 选项后接目录路径，用于检查其是否存在。\n\
    *   正如我们所解释的，`$?` 表示紧接上命令的退出状态。`-eq 0` 选项检查退出状态是否等于 `0`。\n*   `-s` 选项后接文件路径，用于验证该文件是否存在以及其大小是否不等于\
    \ `0 B`。\n\n让我们看看当我们将其传递给脚本时会发生什么（以及相关的错误代码）：\n\n*   不存在的目录\n*   空目录\n\n正如我们所见，使用自定义退出码允许我们根据遇到的情况提供相应的错误信息。\n\
    \n### 测试用表达式 (Test Expressions)\n\n正如我们所见，我们经常需要在脚本中评估条件。另一种方法是使用测试表达式，这允许我们非常轻松地在两个条件之间执行\
    \ `AND` 或 `OR` 类型的逻辑操作。下列表中所有的表达式均指向 `test1` 文件，我们必须在放置脚本的同一目录下创建该文件。\n\n*   `[-f\
    \ test1]` 用于检查 `test1` 是否存在且是一个普通文件。\n*   `[-e test1]` 或 `[-a test1]` 验证 `test1`\
    \ 是否存在。然而，在这种情况下，即使是目录、符号链接或其他类型的文件，该条件也会成立。\n*   `[-s test1]` 如果 `test1` 存在且大小大于\
    \ `0` 字节，则结果为真。\n*   `[-O test1]` 用于验证当前用户是否拥有该文件。\n\n最后，\n\n*   `[-r test1]`、`[-w\
    \ test1]` 和 `[-x test1]` 将帮助我们判断是否对 `test1` 具有读取、写入和执行权限。\n\n要查看测试表达式的完整列表，可以参考\
    \ *The Linux Documentation Project* 中提供的文档。首先，我们将创建一个包含一行内容的 `test1` 文件：\n`echo\
    \ \"I am a test file\" > test1`\n并创建 `test.sh` 脚本：\n```bash\n#! /bin/bash\nFILE\
    \ = test1\n# 条件验证\nif [ -f $FILE -a -s $FILE ]; then\n  echo \"$FILE exists, it\
    \ is a regular file, and its size is greater than 0 bytes.\";\nfi\nif [ -r $FILE\
    \ -a -w $FILE ]; then\n  echo \"$FILE exists, and I have permissions of reading\
    \ and writing.\";\nfi\nif [ ! -x $FILE -o ! -O $FILE ]; then\n  echo \"I do not\
    \ own $FILE, or I do not have execution permits.\";\nfi\n```\n\n让我们赋予执行权限，然后运行脚本：\n\
    `chmod +x test.sh`\n`./test.sh`\n\n让我们看看第一次运行脚本时会发生什么。然后我们更改一些条件并再次验证。我们可以看到，在使用\
    \ `cat /dev/null > test1` 清空文件 `test1` 后，第一个条件不再满足。在授予文件所有者执行权限后，第三个条件也会发生同样的情况。最后，逻辑\
    \ `AND` / `OR` 操作分别通过 `-a` 和 `-o` 实现。可以通过在想要拒绝的条件前放置感叹号 `!` 来实现 `NOT` 操作。\n\n\
    ### 循环与决策 (Loops And Decision Making)\n\n到为止，我们处理的是待执行操作没有重复的情况。当我们想要重复这些操作时，必须诉用循环，正如我们在下面解释的那样。\n\
    \n#### for 循环 (The for Loop)\n\n这种循环用于执行预先定义的固定次数的操作。语法如下：\n```bash\nfor VARIABLE\
    \ in element1 element2 ... elementN; do\n  action\ndone\n```\n例如，假设我们想通过在末添加 `.bkp`\
    \ 来重命名文件列表：\n```bash\nfor FILE in archive1.conf file2.conf file3.conf; do\n  mv\
    \ $FILE $FILE.bkp\ndone\n```\n在这个示例中，我们将变量任意命名为 `FILE`。我们想要执行的操作将在列表中的每个文件上执行。在第一次迭代中，`file1.conf`\
    \ 将重命名为 `file1.conf.bkp`。在第二次和第三次迭代中，`file2.conf` 和 `file3.conf` 将发生相同的情况。\n\n\
    #### while 循环 (The while Loop)\n\n如果我们最初不知道集合中的元素数量，我们将使用 `while` 循环，正如我们将要解释的。该循环的语法所示：\n\
    ```bash\nwhile CONDITION; do\n  ACTION\ndone\n```\n只要满足 `CONDITION`，就会执行 `ACTION`。在下一节中，我们将说明\
    \ `while` 循环的使用。\n\n#### Case 使用 (Use of Case)\n\n程序或脚本流控制的一个经典案例出现在存在两个或多个可选方案且我们必须选择其之一时。例如，当我们面对菜单时。在这种情况下，程序流将由我们的选择决定。为了说明，假设我们想逐个检查具有\
    \ Bash 权限的用户账户，并决定是否添加一个移除提醒。让我们在 `examplecase.sh` 脚本中保存以下内容：\n\n```bash\n#! /bin/bash\n\
    # 在此文件中保存任务列表\nFILE_TASKS = tasks.txt\n# 如果任务文件存在，则先删除它\nif [ -f $FILE_TASKS ];\
    \ then\n  rm $FILE_TASKS\nfi\n# 将具有 Bash 权限的用户列表保存到 users.txt\nUSERS_BASH = users.txt\n\
    grep bash /etc/passwd | cut -d: -f1 > $USERS_BASH\n\n# 逐账户浏览\nwhile read ACCOUNT;\
    \ do\n  # 为每个用户显示消息。从终端读取答案\n  read -p \"Remove access to Bash at $ACCOUNT? [s/n]:\"\
    \ REMOVE </dev/tty\n  case $REMOVE in\n    [sS])\n      # 如果答案是 Yes [sS]，向文件添加一条消息\n\
    \      echo \"Remove access to Bash at $ACCOUNT\" >> $FILE_TASKS\n      ;;\n \
    \   [nN])\n      # 否则，在屏幕上显示消息\n      echo \"You chose not to remove access to\
    \ Bash at $ACCOUNT.\"\n      ;;\n  esac\ndone < $USERS_BASH\n```\n\n在执行之前，让我们赋予你执行权限：\n\
    `chmod +x examplecase.sh`\n\n"
- fmt: '

    - Next, with the keyword `case`, we evaluate the user input. If this entry consists
    of a letter `s` or `S`, a message is saved in the `tasks.txt` file. Otherwise
    (`n` or `N`), a message is displayed on the screen.

    - Each option evaluated by `case` must end with a semicolon (`;`), and the block
    must be closed with the keyword `esac`.


    ## Functions


    When you need to perform an action repeatedly within a script, it is most convenient
    to write a function. Then we can use it as many times as necessary in order to
    duplicate code unnecessarily while facilitating reading the script, as we will
    explain in the next section.


    The concept of function is the same as in traditional programming languages. In
    simple words, a function is a set of instructions to be carried out. In our case,
    these instructions consist of commands that will be executed sequentially when
    invoking the function. Using functions in shell scripts allows us to reuse the
    code when we need it and modify it in one place if we want to make any changes.


    To begin, let''s see how to declare a function in a script. Either of the two
    alternatives shown below is valid for declaring a function called `Now`:


    ```bash

    function () Now {

    command1

    command2

    }

    ```

    or

    ```bash

    Now () {

    command1command2

    }

    ```

    In this case, `command1` and `command2` represent any two commands, although we
    can use as many as we want.


    Although the following example is somewhat trivial, it will serve to illustrate
    the use of functions in shell scripts. Suppose we have a script that performs
    certain tasks, and at the end of each one saves it in a text file or shows the
    end time on the screen. The following script (`exemplofuncion.sh`) begins with
    the declaration of the `Now` function. This function, when invoked with an argument
    (as we will see below), will pause for 5 seconds and display the current date
    and time on the screen 3 times:


    ```bash

    #!/bin/bash

    # We declare the function Now

    Now () {

    DATE_HOUR=$(date +''%d-%m-%Y %H:%M:%S'')

    sleep 5

    echo "Task $1 complete - $DATE_HOUR"

    }

    # First task: breakfast

    Now breakfast

    # Second task

    Now lunch

    # Third task

    Now dinner

    ```


    Let''s run the script after giving it the corresponding permissions:

    ```bash

    chmod +x ejemplofuncion.sh

    ./exemplofuncion.sh

    ```

    As we can see above, the `Now` function allows us to reuse code and facilitates
    reading or analyzing the script.


    ## Chapter 10: Rsyslog And Scheduled Tasks


    In a Linux system, there are many routine tasks that must be carried out periodically:
    updating the file database using `updatedb`, backup copies, cleaning temporary
    files, to name a few examples. In Linux, we have a utility called `cron` that
    allows us to perform repetitive tasks automatically and periodically, to record
    the result in a log, and to report any anomaly to the administrator. If we only
    need to execute one task in the future for once, at least it will be more useful.
    These will be the main topics of this chapter, together with the system event
    log using the classic `rsyslog` and `journald`, the tool provided by `systemd`.


    ### How To Use cron


    To begin, let''s clarify that `cron` is actually composed of two separate utilities:


    - `crond` is the service that “wakes up” every minute and checks if there are
    tasks to be executed in the table of scheduled tasks.

    - `crontab` is the program that allows us to edit the table (which actually consists
    of a plain text file) of scheduled tasks.


    Unless the administrator has configured it differently, all users can automate
    their own tasks by creating a personal table. As we said earlier, scheduled task
    tables are plain text files. Typically, these files are saved in `/var/spool/cron`,
    and on each line of these are the details of what the task is to be executed,
    when, and using what system account. For this reason, each scheduled task is generally
    called `crontab entry`, or `crontab entry`.


    ### Create And Schedule A Task


    To create a scheduled task, we will use the command `crontab -e`.


    Next, the text editor that we have configured by default will be opened, with
    which we must write (in the first free line of the file that is opened) using
    the following format:

    `minute hour day_of_month day_of_the_week command`


    Where:


    - `minute` (0 to 59)

    - `hour` (0 to 23)

    - `month_day` (1 to 31)

    - `month` (1 to 12)

    - `week_day` (0: Sunday to 6: Saturday)


