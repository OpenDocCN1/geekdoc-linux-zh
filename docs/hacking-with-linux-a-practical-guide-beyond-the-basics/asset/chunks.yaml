    #### Password

    The format for mounting is:

    ```

    [password]

    ```


    #### Option

    The format for mounting is:

    ```

    [options]

    ```


    #### Value

    The format for mounting is:

    ```

    [value]

    ```


    #### Network Interfaces

    The NFS client can configure the import of directories in its file `/etc/fstab`
    or mount it directly with the `mount` command.


    | Interface | Description |

    | :--- | :--- |

    | `lo` | Virtual interface for testing (IP address 127.0.0.1). |

    | `eth` | Ethernet devices. |

    | `wlan` | Wireless Ethernet devices. |

    | `tr` | Token Ring-type networks. |

    | `ppp` | Modem or ISDN connection. |

    | `hdi` | Bluetooth device |


    Each network device has a unique and different physical access address (`MAC address`),
    assigned by the manufacturer. However, the connection parameters must be assigned
    during the activation of the network interface.


    #### TCP / IP

    The TCP / IP (Transmission Control Protocol / Internet Protocol) communications
    protocol allows the location and communication of all types of machines connected
    to the Internet. TCP / IP consists of a set of protocols based on layers:


    * The network layer –equivalent to level 3 of the OSI standard–, which establishes
    the optimal path that the information packets that communicate several machines
    must follow. Use `IP`.

    * The transport layer –equivalent to level 4 of the OSI protocol stack–, which
    allows a connection between nodes in the network to be established. There are
    2 transport protocols: the Transmission Control Protocol (`TCP`) –which performs
    synchronous and secure communication with data recovery in case of error– and
    the User Datagram Protocol (`UDP`) –which allows an asynchronous communication
    based on packages called datagrams.

    * The TCP / IP protocol set establishes a mechanism based on addresses and names
    that allows unequivocally to locate each machine connected to the Internet. The
    equivalences between IP addresses and machine names are made by special computers
    that answer queries using the protocol known as Domain Name Service (`DNS`).


    Modern versions of Linux automatically detect network cards, load appropriate
    modules, and assign default interfaces. The system administrator has to set the
    parameters for each network interface of the system, either through local configuration
    files, or generated by a remote `DHCP` server, which can be assigned the values
    statically or dynamically.

