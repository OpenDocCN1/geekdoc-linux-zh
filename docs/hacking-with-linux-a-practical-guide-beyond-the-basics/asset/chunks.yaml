    # 名称地址

    服务器负责使用 `DNS` 协议在互联网上解析名称。它通常不用于私有网络。


    ## 网络设置

    为了完成网络的基础安装，系统管理员必须检查——在某些情况下需要修改——系统核心服务的配置文件。下表描述了这些文件的格式。


    | 路径 | 描述 | 格式 |

    | :--- | :--- | :--- |

    | `/etc/sysconfig/network` | 用于 Fedora，用于设置网络服务基础变量的值（名称、域名、路由器地址等）。 | `Variable=Value...`
    |

    | `/etc/sysconfig/network-scripts/ifcfg-Interface` | 用于 Fedora，用于为每个网络接口分配特定网络变量的值（通过
    DHCP、BOOTP 或本地获取的网络值集合）、IP 地址、子掩码、广播地址等。 | `Variable = Value...` |

    | `/etc/network/interfaces` | 与前一个文件相同，用于 Ubuntu，配置系统所有的网络接口。 | `[auto Interface
    ]iface Interface Parameters[Variable Value ]......` |

    | `/etc/hosts` | 存储已知计算机的 IP 地址、名称和别名之间的关联。必须始终存在地址 `127.0.0.1`。 | `IP Address
    Name [Alias ...]...` |

    | `/etc/resolv.conf` | 建立名称解析的基础，指定计算机域、名称服务器地址以及感兴趣的其他域。 | `domain Domainnameserver
    IP DNSServer...[search DomainSearch ...]` |

    | `/etc/nsswitch.conf` | 指示网络文件的搜索顺序。 | `Type File Type Search ......` |

    | **搜索类型** | `files`: 本文件。`nis`: NIS。`nisplus`: NIS +.`ldap`: 目录服务。`dns`: 名称服务。
    | - |

    | `/etc/services` | 指示每个通信服务使用的协议和端口（此文件不应修改，因为通常已配置良好）。 | `Port / Protocol Service
    [Alias ...]...` |


    ## 网络服务

    用于控制每个通信服务的协议使用一种类似于 `TCP` 或 `UDP` 协议的锚点。这种机制被称为端口。如果一个应用程序想要提供某种服务，它会将自己挂钩到一个端口并等待客户请求（在端口上监听）。当客户端想要使用此服务时，系统会在其本地节点上分配一个空闲端口，并连接到远程节点上的服务器端口。服务器端口可以被不同的机器打开，但不可能同时被它们中的多个使用。因此，为了满足多个客户端的请求，服务器可以将这些请求委托给线程进行单独管理。


    ### 主要网络服务简要描述

    在章节结束之前，下表提供了 Linux 中最常用网络服务的简要描述。


    | 服务 | 描述 | 配置文件 |

    | :--- | :--- | :--- |

    | `dhcp` | 用于远程分配网络参数的服务，包括静态和动态；它使用 `DHCP` 协议，你也可以使用 `BOOTP`。 | `/etc/dhcpd.conf`
    |

    | `ldap` | 通过 `LDAP` 协议进行目录访问的服务。目录是一棵树，包含了各种逻辑分组的资源。 | `/etc/openldap/slapd.conf`
    |

    | **LDAP 模式目录** | - | `/etc/openldap/schemes` |

    | `httpd`, `apache2` | 通过超文本访问信息服务，使用 `HTTP` 协议。 | `/etc/Service /conf/httpd.conf`,
    `/etc/Service /conf.d/*` |

    | `squid` | 使用 `HTTP` 协议访问信息的服务。 | `/etc/squid/squid.conf` |

    | `samba` | 允许通过 `CIF` 或 `SMB` 协议共享资源（文件和打印机）的服务。 | `/etc/samba/smb.conf` |

    | `ssh` | 通过 `Secure Shell` 远程安全连接到系统命令解释器的服务。 | `/etc/ssh/sshd_config`, `/etc/ssh/ssh_config`
    |

    | `subversion` | 文件版本控制和存储的服务，支持 `SVN` 和 `WebDAV` 访问。 | 通过 Apache 进行 WebDAV 访问配置。
    |


    ## 第 6 章：包管理

    在 Linux 中，“程序”和“包”这两个词经常通用，尽管严格来说它们不是一个东西。然而，对于我们目前的用途，可以将它们视为等同。这样，当我们谈论包管理时，我们指的是程序管理。如此，让我们进入
    Linux 软件管理的精彩世界。


    ### 核心概念

    让我们首先将包管理定义为在系统上安装、更新和卸载软件资源的任务集。今天，Linux 上的软件发行主要通过三种方式进行：


    - **存储库 (Repositories)**：它们是中心服务器，通常由特定的发行版、社区或其他第三方维护，其中包含系列软件，可以通过互联网或本地网络进行安装。简单来说，Linux
    中的存储库（也称为软件源）是与给定发行版兼容的程序集合。存储库可以位于远程服务器上（最常见），也可以位于一个（或多个）本地存储设备上。

    - **预编译文件**：它们是适用于特定发行版的可执行文件，既可以通过网络安装，也可以通过命令行工具本地安装（在几分钟后，我们将详细介绍）。

    - **源代码**：这是 Linux 早期软件分发的初始形式。尽管它被前两种方式取代，但它仍然用于为终端用户提供使用特定选项编译给定程序的能力。这种软件发行方法还用于向公众发布比存储库中版本性能更高的、更新的版本。


    每个发行版都有不同的包管理工具。其中某些工具（例如 CentOS 和 Debian 的 `yum` 或 `apt-get`，以及它们各自家族的成员）具备在安装给定程序的同时安装其依赖项的能力，即运行该程序程序所需的额外包。出于这个原因，它们更常被称为包管理器。其他工具如
    `dpkg`（Debian 及其衍生版）和 `rpm`（CentOS 家族），只安装 `.deb` 或 `.rpm` 文件中的程序，而不安装依赖项。


    ### 关于存储库

    出于实际考虑，并非所有可用存储库都包含在发行版的初始安装中，但可以在需要时以后添加。所有发行版都维护自己的官方存储库，还有由社区或私人用户维护的其他存储库（后者通常是包含少量包的存储库）。此外，存储库通常根据其包含的软件类型进行分类。尽管每个发行版处理存储库的方式略有不同，但操作原理是相同的：


    1. 配置你想为系统寻找软件的存储库。

    2. 在使用新配置的存储库之前，需要更新本地包索引，以反映存储库的内容。

    3. 使用每个发行版的包管理器来查找给定包的信息或直接安装它。


    '
- fmt: "\nTo avoid congesting a single repository, around the world, there are several\
    \ identical replicas or mirrors of the central repositories of each distribution.\n\
    \nIn Debian, the list of repositories is maintained in the file `/etc/apt/sources.list`\
    \ and in files located within `/etc/apt/sources.list.d/`. In either case, the\
    \ file format is the same as shown below, taking as an example the Debian mirror\
    \ provided by the UBA (University of Buenos Aires, Argentina):\n\n```deb\ndeb\
    \ http://ftp.ccc.uba.ar/pub/linux/debian/debian/ stable main contrib non-free\n\
    deb-src http://ftp.ccc.uba.ar/pub/linux/debian/debian/ stable main contrib non-free\n\
    ```\n\nLet's now see in detail how the lines above are composed:\n\n- `deb` and\
    \ `deb-src` indicate whether the repository contains precompiled binary packages\
    \ or source packages (which contain everything necessary for one to compile a\
    \ particular program), respectively.\n- Next, we find the path to the repository.\n\
    - Then the word `stable` appears (or the codename of the stable version, such\
    \ as `stretch` as of today).\n- Finally, we have the list of components of the\
    \ repository (the three do not necessarily have to appear):\n    - `main`: contains\
    \ software compatible with the Debian Free Software Policies.\n    - `contrib`:\
    \ contains software compatible with the Debian Free Software Policies, although\
    \ its dependencies are generally included in `non-free` (see below).\n    - `non-free`:\
    \ software not compatible with the Debian Free Software Policies.\n\nOn the official\
    \ Debian project site, you can consult the list of mirrors by country. We can\
    \ choose the country in which we live or use the main content distribution network\
    \ (CDN).\n\nIn CentOS or similar, the repositories are configured using individual\
    \ files within `/etc/yum.repos.d/`. Take as example `CentOS-Base.repo`. In the\
    \ previous example we can distinguish that the configuration of a repository consists\
    \ of:\n\n- The name (`base`).\n- A list of mirrors (`mirrorlist`) from which the\
    \ closest one will be selected geographically, or a fixed repository (`baseurl`).\n\
    - The indication, if needed, uses the public key of the repository.\n- The path\
    \ to the public key file.\n"
