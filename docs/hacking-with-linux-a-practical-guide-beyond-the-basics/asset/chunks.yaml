    The `setfacl` command configures ACLs for directories and files. The `-m` option
    is used (or its equivalent `--modify`) for modification of the ACL of a directory
    or file. This tool is responsible for carrying out the change of ACL permissions
    (represented by `<groups>`) on a file or directory (`<object>` in the example
    below). Its syntax is as follows:


    ```

    setfacl -m <roll> <object>

    ```


    Consider an example to illustrate. `John` and `John` users are members of the
    family group. Therefore, both have read and write access to the file `/common/archivaltest`.
    With the traditional permission scheme, it becomes somewhat complicated to assign
    different levels of access to this file for each user. To remedy this situation,
    we can use access control lists. Suppose we want `John` to continue to have write
    permissions, but that only can read. To achieve that goal, we will create a read-only
    ACL in `/common/archival test` for the latter as follows:


    ```

    setfacl -m u:john: r /common/testfile

    ```


    With `getfacl /common/testfile` we can verify that the ACL has been applied. Now
    let''s focus the result of trying to write to the same file after the change.
    To eliminate the ACL we will use:


    ```

    setfacl -x u:john /common/testfile

    ```


    After which the user will again have write permissions on `/commons/proof`. In
    the case that we have created more than one ACL on the same file, we can remove
    them all together using `setfacl -b` followed by the path to the file. Default
    ACLs are assigned by adding the `-d:`:


    ```

    setfacl -dm g:family: r /common

    ```


    In this way, any file that is added into `/common` later will inherit the same
    rule (family group members can read them, but not write to them).


    ### Special Attributes

    In addition to the read, write, and execute permissions associated with the owner,
    the owner group, and the rest of the system users, Linux allows us to set other
    attributes in files and directories. These properties are specific to the type
    of file system. In this section, we will talk about some of the ones we can find
    in file systems of the extended type (we will use as an example `ext4`). By using
    these attributes, we can prevent, among other things, that a file is deleted or
    renamed, or that content is deleted from it.


    To see the full list of special attributes available, we can consult the `chattr`
    man page. If we want to see which attributes are set in a file or directory, we
    will use `lsattr` followed by the path to that object. To start, we will create
    two files called `test1.txt` and `test2.txt` in our current directory. In each
    of them, we will then add the following content:


    ```

    echo "I am the file test1.txt"> test1.txt

    echo "I am the file test2.txt"> test2.txt

    ```


    Now we are interested in establishing the following special attributes:

    - append-only, represented with a `a`.

    - immutable, represented by an `i`.

    - These attributes allow us, respectively:

    - add content to the file, but do not delete anything.

    - Prevent it from being deleted, renamed, edited, or a link added to it.


    With an account with superuser permissions, let''s add the append-only attribute
    to `test1.txt` and also the immutable to `test2.txt`:


    ```

    chattr +a test1.txt

    chattr +i test2.txt

    ```


    Now let''s go back to our common user account and see what happens when 1) we
    try to add and delete test content `test1.txt`, 2) do the same with `test2.txt`,
    3) delete, rename, edit, or create a test link `2.txt`. The operations that failed
    cannot be performed while the mentioned attributes are present. Finally, to remove
    them, we must do (also as root):


    ```

    chattr -a test1.txt

    chattr -i test2.txt

    ```


    The use of file attributes can help us prevent, for example, that an intruder
    who has gained access to our system can modify or delete system logs (if such
    files have the corresponding attributes!) It is also possible to copy default
    ACLs from one directory to another. Many times when we work, we find that one
    directory has many access control rules applied, and we want to replicate this
    in another directory. For this, we will use `getfacl` and `setfacl` simultaneously:


    ```

    getfacl directory1 | setfacl -b -n -M - directory2

    ```


    The above command copies the ACL from `directory1` to `directory2` using the `-M`
    option that allows the `getfacl` output to be transformed into `setfacl` input.
    In addition, remember that `-b` indicates that the ACLs of the second directory
    should be cleaned (if they exist) and through `-n` we establish new ACLs for it.


    # Chapter 4: File Systems

    Proper management of disk access is another important aspect of the administration
    process of multi-user and multitasking operating systems, and it is essential
    to maintain a basic structure with a certain organizational level. The operating
    system interacts with users and applications, and a security model that is dependent
    on the way files are stored on devices is necessary. A file system can be viewed
    from two logical categories of files:

    - Local files that cannot be purchased or shared with other machines.

    - Static or variable files.


    Therefore, a file system is a subtree of directories with a root directory - which
    must have permissions according to the needs of access to its files -, a logical
    storage structure and an appropriate mount point in the directory tree global
    server.


    ### Standards for the Hierarchy of File Systems (FHS)

    The Standards for the Hierarchy of File Systems (FHS) describe a set of rules
    that allow both users and programs to predict the location of files and directories
    installed in the system. The following table briefly describes the subdirectories
    of the main hierarchy, arranged alphabetically.


    | Directory | Description |

    | :--- | :--- |

    | `/bin` | Basic binaries for all system users. |

    | `/boot` | Static loader files. |

    | `/dev` | Its entries represent the system devices (it should be remembered "in
    Unix, everything is a file"). |

    | `/etc` | Local system configuration. |

    | `/home` | User accounts (if defined, it must be a separate system). |

    | `/lib` | Shared system libraries and core modules. |

    | `/lib32/lib64` | Specific libraries for 32 or 64-bit architectures. |

    | `/media` | Mounting points for removable devices (floppy disk, CDs / DVDs, USB
    connections, etc.). |

    | `/mnt` | Mount points for temporary file systems. |

    | `/opt` | Shared area for large application packages (can be an independent file
    system with its own hierarchy). |

    | `/proc` | A virtual file system with information about processes and the kernel.
    |

    | `/root` | Root administrator user account (optional). |

    | `/sbin` | System binaries |

    | `/srv` | Data for the services provided by the system. |

    | `/usr` | Secondary hierarchy similar to the main one, with information that
    can be shared by other computers with read-only access (it must be a separate
    file system on servers). |

    | `/usr/local` | The hierarchy for local programs (must be a separate file system).
    |

    | `/tmp` | Shared area for temporary files. |

    | `/var` | Variable information, including historical, status, blocking, recovery,
    job queues, etc. |


    ### Disks And Partitions

    All Unix systems - and, therefore, all Linux "dialects" use device files to access
    machine resources, stored in the `/dev` directory. However, each Unix dialect
    has a different notation to identify each storage device. Both Fedora 13 and Ubuntu
    10.04 Lucid identify partition controller files for single disks with the following
    format:

    - Device type (`sd` for normal disks).

    - Unit (`a` for device 1, `b` for 2, etc.).

    - Partition number.


    In case of using redundant hardware disks, the device file is in a subdirectory
    with the name of the RAID controller (for example `cciss` for HP Smart Array)
    and its name has the following format:

    - `cN` (controller number, starting with 0).

    - `dN` (disk number, starting with 0).

    - `pN` (partition number, starting with 1).

