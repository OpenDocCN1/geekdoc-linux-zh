    在在下面的示例中，文件所有者为一个不属于其组的用户分配了读写权限。


    ```bash

    ls -l fich1.txt

    -rw-r ----- 1 usu1 group1 11776 2010-01-27 19:20 fich1.txt

    group add usu2

    usu2: group2

    setfacl -m user: usu2: rw fich1.txt

    ls -l fich1.txt

    -rw-r ----- + 1 usu1 group1 11776 2010-01-27 19:20 fich1.txt

    getfacl fich1.txt

    # file: fich1.txt

    # owner: usu1

    # group: group1

    user :: rw-

    user: usu2: rw-

    group :: r--

    other :: r--

    ```


    在另一个示例中，使用了复合命令将 ACL 从一个文件复制到另一个文件。

    ```bash

    getfacl fich1 | setfacl --set-file = - fich2

    ```


    ## 环境设置


    每个用户账户的命令解释器都有其自己的运行环境，其中包含一系列配置变量。系统管理员为每组用户或所有用户分配某些执行环境变量，而每个用户可以在其输入配置文件中自定义其中一些功能，添加或修改管理员未定义为只读的变量。


    为了创建全局环境，管理员为所有用户创建一个通用的输入配置文件（对于 `BASH`，为文件 `/etc/bashrc`），在该文件中，除了其他任务外，定义了系统变量并执行了配置文件，每个应用程序对应一个。这些小型程序位于
    `/etc/profile.d` 子目录；必须存在基于 Bourne（`BSH`、`BASH`、`PDKSH` 等）且扩展名为 `.sh` 的命令解释器文件，以及基于
    C 解释器（`CSH`、`TCSH` 等）且扩展名为 `.csh` 的文件。


    用户连接过程通过执行用户的个人输入配置文件（`BASH` 为文件 `~/.bash_profile`）完成。尽管管理员必须提供一个有效的配置文件，但用户可以方便地对其进行调整。读者可以查看《Shell
    高级编程》课程的文档，获取有关最重要的环境变量的更多信息。


    ## 账户管理


    现代 Linux 系统（以及桌面环境）提供了图形化管理工具来执行常见的系统管理任务，包括用于用户和组管理的一套应用程序。通过这类程序，可以执行简单的修订和控制操作，但对于执行用户账户的自动化和高级管理来说相当糟糕。


    操作系统还提供系列管理命令，必须使用这些命令来自定义和自动化用户及组创建、审核和删除。下表描述了这些功能。


    | 命令 | 说明 |

    | :--- | :--- |

    | `useradd` | 创建新用户账户。 |

    | `usermod` | 修改账户的参数。 |

    | `userdel` | 删除用户账户。 |

    | `passwd` | 修改账户的密码。 |

    | `chpasswd` | 使用数据文件更改多个用户的密码。 |

    | `chage` | 修改账户的临时限制。 |

    | `chfn` | 修改用户描述。 |

    | `chsh` | 更改账户的解释器。 |

    | `groupadd` | 创建新用户组。 |

    | `groupmod` | 修改用户组的参数。 |

    | `groupdel` | 删除用户组。 |

    | `gpasswd` | 更改私组的访问密码。 |


    ## 规划


    用户账户管理是管理任务中最重要的方面之一，因此必须对注册系统中的用户和组的特征和需求进行详细规划。从根本上说，在创建账户之前必须执行以下后续操作：


    *   创建不同的用户组，为用户执行的每组任务创建一个组，或为每个管理角色创建一个组。

    *   定义系统的全局参数，例如密钥创建的限制、主要访问方法、账户远程存储的可能性等。

    *   为账户创建基本的目录结构，分离每个主组的子目录。分配权限是足够的，可以防止低权限的用户访问其他组的保留区域。

    *   定义私有列表，管理员可以在其中核实每个用户的身份，存储每个人的基本数据及其关联账户。

    *   创建账户管理程序，生成配置文件以自动处理用户创建、修改、审核、过期和删除的过程。


    ### 示例：大学实习服务器


    为了说明账户管理过程，下表简要描述了可以使用于大学实习服务器的结构，该结构类似于例如纽约大学计算机工程系 E.T.S. 计算中心的现有结构。


    | 命令 | 说明 |

    | :--- | :--- |

    | 密钥通用限制 | 本章之前定义的那些内容。 |

    | 创建用户组 | 为管理员、普通学生、毕业届学生和教授创建组。每个部门创建一个组。按课程为学生定义组。 |

    | 目录结构 | 管理员组的私有目录。教师的私有目录，并带有每个部门的私有子目录。按课程分组的普通学生目录和项目学生目录。笔记目录，教师具有写权限，学生具有读权限。
    |

    | 创建用户列表 | 为每个用户组生成一个不同的列表。 |

    | 管理程序 | 为程序创建配置文件，其中存储了每种类型用户的默认信息并用于生成选择菜单。使用这些配置文件进行交互式账户创建。使用输入数据文件自动创建多个账户。用户数据检查；显示相应列表的内容、`/etc/passwd`
    文件的内容、账户目录、过期日期和磁盘配额。用户列表数据与已创建账户之间的一致性检查。注册磁盘配额并每周检查其状态。检查账户过期。自动续期账户。自动删除过期的账户。交互式删除账户及其目录。记录关于锁定和解锁账户的事件。自动更改密码。
    |


