    ## Functions


    当你需要在脚本中重复执行某个操作时，编写函数是最方便的。这样我们我们可以根据需要多次使用它，从而避免不必要的代码重复，并方便脚本的阅读，我们将在下一节中进行解释。


    函数的概念与传统编程语言相同。简单来说，函数是一组要执行的指令。在我们的案例中，这些指令由调用函数时按顺序执行的命令组成。在 shell 脚本中使用函数允许我们能够在需要时重用代码，并在想要进行任何更改时仅在一个处进行修改。


    首先，让我们看看如何在脚本中声明函数。下面所示两种替代方案中的任一都适用于声明名为 `Now` 的函数：


    ```bash

    function () Now {

    command1

    command2

    }

    ```

    or

    ```bash

    Now () {

    command1command2

    }

    ```

    在这种情况下，`command1` 和 `command2` 代表任意两个命令，尽管我们可以使用任意数量的命令。


    虽然下面的示例有些简单浅见，但它将用于说明函数在 shell 脚本中的用法。假设我们有一个脚本执行某些任务，并在每个任务结束时将其保存到文本文件中或在屏幕上显示结束时间。以下脚本（`exemplofuncion.sh`）从声明
    `Now` 函数开始。该函数在带有参数调用时（如下文所示），将暂停 5 秒，并在屏幕上显示 3 次当前的日期和时间：


    ```bash

    #!//bin/bash

    # We declare the function Now

    Now () {

    DATE_HOUR=$(date +''%d-%m-%Y %H:%M:%S'')

    sleep 5

    echo "Task $1 complete - $DATE_HOUR"

    }

    # First task: breakfast

    Now breakfast

    # Second task

    Now lunch

    # Third task

    Now dinner

    ```


    让我们在赋予相应权限后运行脚本：

    ```bash

    chmod +x ejemplofuncion.sh

    ./exemplofuncion.sh

    ```

    如上文所示，`Now` 函数允许我们重用代码，并方便阅读或分析脚本。


    ## Chapter 10: Rsyslog And Scheduled Tasks


    在 Linux 系统中，有很多必须定期执行的常规任务：例如使用 `updatedb` 更新文件数据库、备份副本、清理临时文件等。在 Linux 中，我们有一个名为
    `cron` 的实用程序，它允许我们自动且定期执行重复任务，将结果记录在日志中，并向管理员报告任何异常。如果将来我们只需要执行一次某个任务，至少它也会更有用。这些将是本章的主要主题，以及使用经典的
    `rsyslog` 和 `systemd` 提供的工具 `journald` 系统事件日志。


    ### How To Use cron


    首先，让我们明确 `cron` 实际上是由两个独立的工具组成的：


    - `crond` 是每分钟“唤醒”一次的服务，并检查计划任务表中是否有要执行的任务。

    - `crontab` 是允许我们编辑计划任务表（实际上由一个纯文本文件组成）的程序。


    除非管理员对其进行了不同的配置，否则所有用户都可以通过创建个人表来自动化自己的任务。正如我们之前提到的，计划任务表是纯文本文件。通常，这些文件保存在 `/var/spool/cron`
    中，每行都包含了要执行的任务的细节、执行时间以及使用哪个系统账户。出于此原因，每个计划任务通常被称为 `crontab entry`。


    ### Create And Schedule A Task


    要创建一个计划任务，我们将使用 `crontab -e` 命令。


    接下来，将打开默认配置的文本编辑器，我们必须在打开的文件的第一个空行上使用以下格式进行编写：

    `minute hour day_of_month day_of_the_week command`


    其中：


    - `minute` (0 到 59)

    - `hour` (0 to 23)

    - `month_day` (1 to 31)

    - `month` (1 to 12)

    - `week_day` (0: 周日到 6: 周六)


    例如，要在 9 月的每个周一下午 1:55 执行 `/bin/updatedb` 命令，我们将在权限执行此类程序的用户的 crontab 中添加以下行：

    `55 13 * 9 1 /bin/updatedb`


    当我们把命令放在 crontab 文件中，建议编写可执行文件的完整路径。


    让我们分析上一行：


    - 前两个数字表示时间 (13:55)。

    - 星号（或星号）`*` 表示无论月份的哪一天（1 到 31）是周一，该规则都生效。

    - 后两个数字代表我们想要执行任务的月份（9：9 月）和星期（1：周一）。


    或者，我们可以使用以下指示来指定任务执行所需的时间：


    | Alternative | Description |

    | :--- | :--- |

    | `@reboot myprogram` | 启动时运行一次 |

    | `@yearly myprogram` | 每年运行一次（等同于 `0 0 1 1 * myprogram`） |

    | `@monthly myprogram` | 每月运行一次（等同于 `0 0 1 * * myprogram`） |

    | `@weekly myprogram` | 每周运行一次（等同于 `0 0 * 0 myprogram`） |

    | `@daily myprogram` | 每天运行一次（等同于 `0 0 * * * myprogram`） |

    | `@hourly myprogram` | 每小时运行一次（等同于 `0 * * * * myprogram`） |


