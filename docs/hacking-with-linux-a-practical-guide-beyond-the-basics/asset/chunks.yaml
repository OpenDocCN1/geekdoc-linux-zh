    identical replicas or mirrors of the central repositories of each distribution.In
    Debian, the list of repositories is maintained in the file /etc/apt/sources.list
    and in files located within /etc/apt/sources.list.d. In either case, the file
    format is the same as shown below, taking as an example the Debian mirror provided
    by the UBA (University of Buenos Aires, Argentina):deb http://ftp.ccc.uba.ar/pub/linux/debian/debian/
    stable main contrib no n-freedeb-src http://ftp.ccc.uba.ar/pub/linux/debian/debian/
    stable main contri b non-freeLet''s now see in detail how the lines above are
    composed:


    *   deb and deb-src indicate whether the repository contains precompiled binary
    packages or source packages (which contain everything necessary for one to compile
    a particular program), respectively.


    *   Next, we find the path to the repository.


    *   Then the word stable appears (or the codename of the stable version, such
    as stretch as of today).


    *   Finally, we have the list of components of the repository (the three do not
    necessarily have to appear):


    *   main: contains software compatible with the Debian Free Software Policies.


    *   contrib: contains software compatible with the Debian Free Software Policies,
    although its dependencies are generally included in non-free (see below).


    *   non-free: software not compatible with the Debian Free Software Policies.


    On the official Debian project site, you can consult the list of mirrors by country.
    We can choose the country in which we live or use the main content distribution
    network (CDN).In CentOS or similar, the repositories are configured using individual
    files within /etc/yum.repos.d. Take as an example CentOS-Base.repo.In the previous
    example we can distinguish that the configuration of a repository consists of:


    *   The name (base).


    *   A list of mirrors (mirrorlist) from which the closest one will be selected
    geographically, or a fixed repository (baseurl).


    *   The indication, if needed, uses the public key of the repository.


    *   The path to the public key file.'
