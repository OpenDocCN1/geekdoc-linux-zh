    Each of the above operations has a brief equivalent: `ref` (refresh), `it` (search),
    `if` (info), `in` (install), `up` (update), and `rm` (remove). Due to a large
    number of options available for the use of `zypper`, it is not possible to list
    them all here. For more information, it is recommended to use the `man` page and
    carefully examine the help for each operation, as mentioned in the last two points
    above.


    # Chapter 7: RAID in More Depth


    RAID is the acronym for Redundant Array of Independent Disks. It consists of a
    storage solution that combines two or more disks in the same logical drive in
    order to provide data redundancy and / or increase the performance of reading
    or write operations. However, both features depend on the way in which the disks
    have been organized in what is called a given level (can be thought of as a type)
    of RAID.


    RAID allows access to the entire array of disks as a single set, even if there
    are several physical disks or partitions at a low level. Using the online RAID
    Calculator, we can visualize the capacity of an array according to the RAID level
    used and confirm the type of fault tolerance it provides. Regardless of the level
    of RAID, we have chosen or how reliable the storage technology we use to implement
    it is, a RAID array does not replace the need for an appropriate backup strategy
    - even if it provides data redundancy.


    ## Three Levels Of RAID In Linux


    Although there are more options according to the needs we have, to introduce the
    topic, we will present only the three most commonly used RAID levels `RAID 0`,
    `RAID 1`, and `RAID 1 + 0` or `RAID 10`. In the illustrative images, the written
    data blocks on discs are indicated as `A1`, `A2`, `A3`, and so on.


    ### RAID 0

    Also known by its English name `stripe` (because it distributes the data evenly
    between two or more disks, as shown in the following image), this RAID level provides
    an increase in the performance of reading operations, but it does not provide
    fault tolerance. It requires at least two disks to be implemented, and the resulting
    size is equal to the sum of the size of each disk.


    ![](rsrc3J1.jpg)


    ### RAID 1

    Better known as a mirror, this disk array provides data redundancy by writing
    them simultaneously on two disks, separately as the image indicates. This allows
    if one of the disks experiences a failure, the same information is available on
    the other. However, it impacts negatively on the writing performance since data
    has to be written twice. By replacing the defective disk with a new one, the arrangement
    can be rebuilt, and the information copied to it. It requires at least two disks
    to be implemented, and the resulting size is equal to the smallest disk.


    ![](rsrc3J7.jpg)

    As we can see in the diagram above, the data blocks `A1`, `A2`, `A3`, and `A4`
    are written on both devices (hence the term mirror used to describe this RAID
    level).


    ### RAID 1 + 0

    Also called `RAID 10`, this RAID level is a kind of “combination” of the previous
    two: it consists of a `RAID 0` (stripe) of two `RAID 1` (mirror) arrays, as shown
    below:


    ![](rsrc3JE.jpg)

    As expected, this arrangement provides both an improvement in the overall read
    and write performance and redundancy, although it admits at most one disk failure
    in each mirror. The resulting size is equal to the sum of the capacity of the
    two `RAIDs 1`.


    ## Create RAID Software


    The tool used to create software RAIDs in Linux is `mdadm` (short for multiple
    disks admin), which we can install using `apt-get install mdadm` if we don''t
    have it available yet. To complete the examples mentioned in this section, we
    will need to have 4 partitioned disks that we will call this time `/dev/sdb1`,
    `/dev/sdc1`, `/dev/sdd1`, and `/dev/sde1`.


    **IMPORTANT**: At the moment, it is convenient that we choose a single RAID level
    to start.


    ### RAID 0

    If we wanted to create a RAID 0 using `/dev/sdb1` and `/dev/sdc1`, we would use
    the following command:


    ```

    mdadm --create --verbose /dev/md0 --level=stripe --raid-devices=2 /dev/sdb1 /dev/sdc1

    ```

    where the `--verbose` option will allow us to obtain a certain degree of detail
    about the progress of the creation of the array, while `--level` and `--raid-devices`
    are used to indicate the level and quantity of devices to be used for this exercise,
    respectively.


    ### RAID 1

    If we are inclined to this case, the command is essentially identical to the previous
    example. The only difference lies in the value of the `--level` option:


    ```

    mdadm --create --verbose /dev/md0 --level=1 --raid-devices=2 /dev/sdb1 /dev/sdc1

    ```

    This type of arrangement will be the one we will illustrate through images in
    this chapter. Later we will see how to verify the status of `/dev/md0`.


    ### RAID 1 + 0

    In this case, we should use the four discs:


    ```

    mdadm --create --verbose /dev/md0 --level=10 --raid-devices=4 /dev/sd[b-e]1

    ```

    In the previous example, we can see that `mdadm` supports the use of a regular
    expression to specify the disks that we will use without having to list them one
    by one.


    ## Create A File System and Mount The Device


    After having created our RAID (whatever the level may be), it is time to create
    a file system on it and to mount it to be able to use it. However, before this,
    we must add the detail of our arrangement in the configuration file `/etc/mdadm/mdadm.conf`
    as a first step to achieve persistence. Otherwise, when the system restarts, it
    may not recognize it with the name we created.


    ```

    mdadm --detail --scan >> /etc/mdadm/mdadm.conf

    ```

    Now we will use `ext4` as file system and `/mnt/miraid` as mount point:


    ```

    mkfs.ext4 /dev/md0

    mount -t ext4 /dev/md0 /mnt/miraid

    ```

    The last step to achieve persistence is to add the necessary line in `fstab` and
    update initial RAM:


    ```bash

    echo "/dev/md0 /mnt/miraid ext4 defaults 0 0" >> /etc/fstab

    update-initramfs -u

    ```

    In the same way that we have done in previous chapters, we can assign `LABEL`
    to the file system or find out `UUID` by `blkid`. Either of these two alternatives
    will allow us to mount the arrangement.


    ## RAID Administration


    In this section, we will learn how to monitor the status of the array, how to
    add an extra disk to it (to have it ready in the event of failure), and how to
    simulate a fault. Finally, we will explain how to "recycle" one or more disks
    that have previously been part of.


    Once we execute the command to create an array, we can monitor the status using
    any of the following commands:


    ```bash

    cat /proc/mdstat

    mdadm --detail /dev/md0

    ```

    In particular, the second command will warn us of problems (if any) when listing
    the status. To simulate a disk failure `/dev/sdc1`, we will use the following
    command, paying attention to the `--fail` option:


    ```bash

    mdadm /dev/md0 --fail /dev/sdc1

    ```

    Next, we will stop the fix to avoid problems and remove the device with problems
    using `--remove`:


    ```bash

    mdadm --stop /dev/md0

    mdadm /dev/md0 --remove /dev/sdc1

    ```

    After having physically connected the disk to our system and having created the
    corresponding partition identified as `/dev/sdg1`, we can use it to replace the
    damaged one and then restart the array:


    ```bash

    mdadm /dev/md0 --add /dev/sdg1

    mdadm --assemble /dev/md0

    ```

    If we wanted to recycle one or several disks in order to use them in another arrangement,
    we could do it as follows. After having 1) taken the necessary precautions, 2)
    protected the important data, and 3) removed a particular disk from the array,
    we will proceed to delete the superblock information using a `/dev/sdc1` as an
    illustrative example:


    ```bash

    mdadm --zero-superblock /dev/sdc1

    update-initramfs -u

    ```

    At this point, we can already use `/dev/sdc1` in another arrangement if we wish.


    # Chapter 8: LVM (Logical Volume Management) In Broader Spectrum


    LVM is a set of tools that allow the management of storage units called logical
    volumes. Perhaps its most distinctive feature is that it provides flexibility
    to manage system storage so that it can be easily expanded when the need requires
    it. An additional advantage of LVM is that it allows you to take snapshots of
    the logical volumes, which can function as backup copies or be used for migrations,
    tests, restorations, etc., without affecting the operation of the system as a
    whole.


    ## Traditional Partitioning vs. LVM


    The most used distributions nowadays install on logical volumes by default. What
    are the reasons why the traditional partitioning versus `LVM` has lost ground?


    To begin, remember that at least in `MBR`, there is a limitation on the number
    of primary partitions per disk. In case we need to resize one of them, great care
    is required. Although we can shrink a partition to give space to another one that
    has been left small, this procedure causes the following inconveniences:

