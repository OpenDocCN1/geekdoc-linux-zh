    # Name addresses

    Servers are responsible for resolving names on the Internet using the `DNS` protocol.
    It is not usually used in private networks.


    ## Network Settings

    To complete the basic installation of the network, the system manager must review
    - and in some cases, modify - the configuration files of the essential services
    of the system. The following table describes the formats of these files.


    | Path | Description | Format |

    | :--- | :--- | :--- |

    | `/etc/sysconfig/network` | Used in Fedora to set the values of the basic variables
    for the network service (name, domain, router address, etc. | `Variable=Value...`
    |

    | `/etc/sysconfig/network-scripts/ifcfg-Interface` | Used in Fedora to assign
    the values of the specific network variables for each network interface (collection
    of network values via DHCP, BOOTP, or local), IP address, netmask, broadcast address,
    etc. | `Variable = Value...` |

    | `/etc/network/interfaces` | File equivalent to the previous one, used in Ubuntu
    to configure all the network interfaces of the system. | `[auto Interface ]iface
    Interface Parameters[Variable Value ]......` |

    | `/etc/hosts` | Stores the association between IP address, name and alias of
    known computers. The address `127.0.0.1` must always be present. | `IP Address
    Name [Alias ...]...` |

    | `/etc/resolv.conf` | It establishes the bases for name resolution, indicating
    computer domain, address of name servers, and other domains of interest. | `domain
    Domainnameserver IP DNSServer...[search DomainSearch ...]` |

    | `/etc/nsswitch.conf` | Indicates the search order for network files. | `Type
    File Type Search ......` |

    | **Search Types** | `files`: local files. `nis`: NIS. `nisplus`: NIS +. `ldap`:
    directory service. `dns`: name service. | - |

    | `/etc/services` | Indicates the protocol and port used by each communications
    service (this file should not be modified, as it is usually well configured).
    | `Port / Protocol Service [Alias ...]...` |


    ## Network Services

    The protocols defined to control each communication service use a kind of anchor
    point to the `TCP` or `UDP` protocols. This mechanism is known as a port. If an
    application wants to offer a certain service, it hooks itself to a port and awaits
    customer requests (listen at the port). When a client wants to use this service,
    the system assigns a free port on its local node and connects to the server port
    on the remote node. A server port can be opened by different machines, but there
    is no possibility of being used by more than one of them at the same time. Therefore,
    to meet the requests of multiple clients, the server can delegate them to threads
    that manage them individually.


    ### Brief Description Of The Main Network Services

    To end the chapter, the following table presents a simple description of the most
    used network services in Linux.


    | Service | Description | Configuration file |

    | :--- | :--- | :--- |

    | `dhcp` | Service for remote assignment of network parameters, both statically
    and dynamically; It uses the `DHCP` protocol, but you can also use `BOOTP`. |
    `/etc/dhcpd.conf` |

    | `ldap` | Directory access service through `LDAP` protocol. A directory is a
    tree where all kinds of logically grouped resources are included. | `/etc/openldap/slapd.conf`
    |

    | **Schema Directory LDAP** | - | `/etc/openldap/schemes` |

    | `httpd`, `apache2` | Access to information service through hypertext, using
    `HTTP` protocols. | `/etc/Service /conf/httpd.conf`, `/etc/Service /conf.d/*`
    |

    | `squid` | Service of access to information through hypertext, using the `HTTP`
    protocol. | `/etc/squid/squid.conf` |

    | `samba` | Service that allows sharing resources (files and printers) through
    the `CISS` or `SMB` protocols. | `/etc/samba/smb.conf` |

    | `ssh` | Service for remote and secure connection to the system command interpreter
    through `Secure Shell`. | `/etc/ssh/sshd_config`, `/etc/ssh/ssh_config` |

    | `subversion` | Service for the control and storage of versions and revisions
    of files supports `SVN` and `WebDAV` access. | WebDAV access configuration through
    Apache. |


    ## Chapter 6: Package Management

    In Linux, the words program and package are often used interchangeably, although
    strictly speaking, they are not the same. However, for our current purposes, we
    can consider them equivalent. That way, when we refer to package management, we
    will be talking about programs. With that in mind, let''s enter the exciting world
    of Linux software management.


    ### Essential Concepts

    Let''s start by defining package management as the set of tasks for installing,
    updating, and uninstalling software resources on our system. Today, software distribution
    on Linux is done in three main ways:


    - **Repositories**: they are central servers, generally maintained by a particular
    distribution, by the community, or by other third parties, where a collection
    of software is available for installation via the Internet or a local network.
    In simple terms, a repository in Linux (also called software source) is a collection
    of programs compatible with a given distribution. A repository can reside on a
    remote server (which is the most common) or on one (or several) local storage
    devices.

    - **Precompiled files**: they are compatible executable files for a particular
    distribution and can be installed both through the network and locally with a
    command-line tool (in a few minutes, we will see this in more detail).

    - **Source code**: it is the initial form by which software was distributed in
    Linux at the beginning. Although it has been surpassed by the previous two, it
    is still used to offer end users the possibility of compiling a given program
    with particular options. This software distribution method is also used to make
    a more up-to-date version available to the public that has higher performance
    than those present in the repositories.


    Each distribution has different utilities for package management. Some of them
    (such as `yum` or `apt-get`, for CentOS and Debian, respectively, together with
    the members of each family) have the ability to install together with a program
    given their dependencies, that is, those additional packages that are necessary
    for the operation of the first. For that reason, they are more commonly known
    as package managers. Others, as `dpkg` (Debian and derivatives) and `rpm` (CentOS
    and family), only install the program present in the `.deb` file or `.rpm` but
    without installing dependencies.


    ### More On Repositories

    For practical reasons, not all available repositories are included in the initial
    installation of distribution but can be added later when needed. All distributions
    maintain their own official repositories and also have others that are maintained
    by the community or private users (in the latter case it is usually repositories
    that contain a few packages). In addition, repositories are often classified according
    to the type of software they contain. Although each distribution differs slightly
    from the others in the way it handles its repositories, the principle of operation
    is the same:


    1. The repositories in which you want to find software for our system are configured.

    2. Before using the newly configured repositories, it is necessary to update the
    local package index in a way that reflects the contents of the repositories.

    3. The package manager of each distribution is used to find information about
    a given package or directly to install it.

    '
