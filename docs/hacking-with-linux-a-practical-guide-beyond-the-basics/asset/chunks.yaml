    of the properties box of the file browser of the GNOME 2.30 environment under
    Ubuntu 10.04, shows the data of the .bashrc file from the previous directory.The
    following table shows the necessary permissions to be able to execute some commands.


    | Mandate | Source Directory Permissions | File permissions | Destination Directory
    Permissions |


    | cd | X | Not applicable | Not applicable |


    | ls | R | Not applicable | Not applicable |


    | mkdir | W, X | Not applicable | Not applicable |


    | rmdir | W, X | Not applicable | Not applicable |


    | cat | X | R | Not applicable |


    | rm | W, X | ­ | Not applicable |


    | cp | X | R | W, X |


    | mv | W, X | ­ | W, X |


    Special PermissionsSpecial permissions complement the set of normal permissions,
    enhance system security, and are used to support certain specific operations.As
    in the previous point, depending on the type of directory entry, the special permission
    characters represented by ls -l are:


    | Files: | Active user identifier (s for the owner): an executable program can
    activate the user identifier (SUID) , which allows a user to become the owner
    of the file during program execution. For example, the passwd command accesses
    files that can only be modified by the root user. This command has the SUID active
    so that during the execution of the program, another user is for some time root
    and can change his password. Special care must be taken with these executables
    because unauthorized users can take privileges.Active group identifier (s for
    the group): as in the previous case, an executable program can activate the group
    identifier (SGID) so that a user can perform operations of the group to which
    the file belongs. For example, the mail command activates the SGID so that any
    user can access their mailbox without the possibility of reading mail from any
    other user. |


    | Directories: | Exchange directory (t in the rest of users): it allows that in
    shared directories, the files can only be modified by the owner (usually used
    in directories for temporary files like / tmp.Active group identifier (s for the
    group): the files created in that directory will have the same group as that of
    the directory itself, instead of the owner''s group. |


    The administrator must catalog all files and directories created after the installation
    of the operating system or any application, and that contain special permissions.
    Periodically you should check the status of these files and verify that they have
