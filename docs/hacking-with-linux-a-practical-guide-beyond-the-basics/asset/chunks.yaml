    every chapter individually, so for example, if you only need information related
    to Shell Scripting, you can read only the sections that refer to this topic. However,
    this guide is fundamentally a tutorial, and you can read it as a whole or sequentially.This
    book is not meant to be used in isolation. The rest of the documentation for GNU
    / Linux systems is important for administrators too. Since the system administrators
    are only users with unique perquisites and obligations, a handy resource of this
    book is the tables and charts, which should be consulted whenever a command is
    unfamiliar.While this guide is focused on the general principles of GNU / Linux,
    it is also ensured that it can be used with other operating systems based on Unix.
    Unfortunately, there are several UNIX versions, and in particular, there are differences
    in the system administration. As such, it isn''t possible to cover all the variants.There
    is no official distribution of GNU / Linux, so different people have different
    configurations, and many have a configuration that they made themselves. This
    book is not aimed at a particular GNU / Linux distribution, as the different distributions
    vary considerably from each other. Therefore, whenever possible, attempts are
    made to note the differences and develop alternatives.Efforts have been made to
    describe how each aspect of the system works, rather than simply listing "five
    easy steps" for each task. This means that there is a lot of information in this
    document that may not be necessary for everyone, so these parts of the manual
    are specially marked and may be ignored if a pre-configured system is being used.Reading
    the entire book will naturally increase the understanding of the operation of
    the system, and it will be possible to make the use and administration of the
    system more productive (and enjoyable).A particular point that should be clarified
    is that many issues that are well documented in other freely distributed manuals
    have not been developed in-depth. This applies especially to the documentation
    of specific programs, such as all the details of using the mkfs command. Only
    the purpose of the program is described, and at most, its use to the extent necessary
    to achieve the goal of this manual. Additional information can be found in those
    other free manuals. Usually, all documentation referenced is part of the complete
    set of GNU / Linux documentation.Chapter 1: An Overview of the Linux SystemAlthough
    you may not realize it, Linux is a standalone implementation of the UNIX operating
    system. Linux itself is a kernel, not a complete operating system. Complete systems
    built around the Linux kernel use the GNU system, which offers a shell, utilities,
    libraries, compilers, and tools, as well as other programs such as text editors.
    For this reason, Richard M. Stallman of the GNU project asks users to refer to
    the complete system as GNU / Linux. In the appendix, there is more information
    about the GNU project.Linux development started from a personal project by a student
    at Helsinki University in Finland called Linus Torvalds. He intended to create
    a more sophisticated operating system than Minix, a relatively simple UNIX whose
    source code he had available. Linux follows the US government standard, POSIX.
    POSIX is the UNIX Application Programming Interface (API) standard, references
    for developers in the UNIX-like family. Since the introduction of Linux on October
    5, 1991, by Linus Torvalds, a large number of people involved in programming have
    started to develop Linux. The name Linux derives from the junction Linus + UNIX
    = Linux.PortabilityLinux is a top ported kernel''s operating system, It runs on
    systems from iPaq (a portable computer) to IBM S/390 (an enormously expensive
    mainframe), although this type of portability was not one of the primary goals
    of Linus Torvalds. His effort was to make his system portable enough to ensure
    ease for the compilation of applications on this system from different sources.
    Therefore, Linux initially became popular to some extent due to the power to get
    everyone''s favorite GPL or other fonts to run on Linux.DistributionsThe complete
    operating system (GNU / Linux) is considered a Linux Distribution. It is a collection
    of free (and sometimes non-free) software created by individuals, groups, and
    organizations around the world, with the kernel at its core. Today, companies
    like Red Hat or SuSE, as well as community projects with Debian or Gentoo, compile
    the software and provide a complete system, ready for installation and use. In
    addition, there are personal projects such as Patrick Volkerding that provides
    a Linux distribution, Slackware.As soon as Linus Torvalds made Linux available,
    he only made the kernel available with a few basic commands. The user himself
    should pack up the other programs, compile them, and configure them. To avoid
    this work, the availability of pre-compiled programs for the user just to install
    was then started. This is how MCC (Manchester Computer Center), the first Linux
    distribution made by the University of Manchester, came into being. Some distributions
    are larger, others smaller depending on the number of applications and their quality.
    Some smaller size distributions fit on a 1.44 MB floppy disk; others need multiple
    CDs. All of them have their audience and their nature, the small ones (which occupy
    a few floppy disks) are used for recovery of damaged systems or for monitoring
    of disks computer network. What makes the difference is how the applications are
    organized and preconfigured.Linux BasicsStartup and ShutdownThey correspond respectively
    to the procedures of turning the computer on and off. The first concerns the supply
    of power for the operation of the machine''s electronic circuits and requires
    no major precautions from the user. On the other hand, the Shutdown process requires
    caution, as improper shutting down of the computer can cause damage to the operating
    system by destroying the internal tables it needs to function. When the computer
    "hangs," therefore, turning it off should be the last choice. One option is to
    start another session, check where the problem is, and end the locked session
    with an appropriate command.Section Opening on LinuxTo use Linux, you first need
    to enter your username and password, which are read and verified by the login
    program. In UNIX, a password file is used to store information having a line for
    each user, containing their alphabetic and numeric identification, their encrypted
    password, their home directory, and other information. When the user identifies
    himself, the login program encrypts the password just read from the terminal and
    compares it to the password file password to give the user permission. This user
    information file is usually found in the file:/ etc / passwd. The encrypted passwords
    came in the file / etc / shadowUser, Root, Groups, access, ProtectionThe principle
    of UNIX file system security is based on users, groups, and other users.'
