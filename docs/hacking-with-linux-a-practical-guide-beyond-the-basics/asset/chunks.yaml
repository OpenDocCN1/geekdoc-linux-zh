    ## Remote File Systems


    Remote connection to other computers is a great advantage in the process of sharing
    information. Remote file systems allow information to be stored in a single central
    node and make it accessible to different clients, enabling user mobility. To end
    this chapter, the most commonly used remote file systems will be described.


    ### NFS


    The Network File System (NFS) was created by Sun Microsystems for SunOS - its
    Unix dialect - using Remote Procedure Call (`RPC`) techniques. NFS allows access
    to files on remote nodes in exactly the same way as if they were local, in a completely
    transparent way to the client and independently of the server architecture. IETF
    [11] specifies in its RFC 3530 version 4 of NFS (`NFSv4`), completely redefining
    the protocol and including improvements such as file usage blocking, security
    negotiation, ACLs, interoperability between platforms, internationalization, etc.
    The following table describes the services that must be activated on the NFS server
    and client computer.


    | Service | Description |

    | :--- | :--- |

    | `portmap` | `RPC`''s main control service. |

    | `rpc.mountd` | NFS client assembly control. |

    | `rpc.nfsd` | NFS server. |

    | `rpc.statd` | Network Status Monitor (NSM), which notifies the restart of the
    NFS server. |

    | `rpc.rquotad` | Provide quota information for remote users. |


    The `/etc/exports` file contains the NFS configuration on the server. The following
    table describes the format of the file lines, one for each exported directory.


    | Format | Description |

    | :--- | :--- |

