    There is no official distribution of GNU / Linux, so different people have different
    configurations, and many have a configuration they made themselves. This book
    is not aimed at a particular GNU Linux distribution, as different distributions
    vary considerably from each other. Therefore, whenever possible, attempts are
    made to note the differences and develop alternatives.


    # Chapter 1: An Overview of the Linux System


    Although you may not realize it, Linux is a standalone implementation of the UNIX
    operating system. Linux itself is a kernel, not a complete operating system. Complete
    systems built around the Linux kernel use the GNU system, which offers a shell,
    utilities, libraries, compilers, and tools, as well as other programs such as
    text editors. For this reason, Richard M. Stallman of the GNU project asks users
    to refer to the complete system as GNU / Linux. In the appendix, there is more
    information about the GNU project.


    Linux development started from a personal project by a student at Helsinki University
    in Finland called Linus Torvalds. He intended to create a more sophisticated operating
    system than Minix, a relatively simple UNIX whose source code he had available.
    Linux follows the US government standard, POSIX. POSIX is the UNIX Application
    Programming Interface (API) standard, references for developers in the UNIX-like
    family. Since the introduction of Linux on October 5, 1991, by Linus Torvalds,
    a large number of people involved in programming have started to develop Linux.
    The name Linux derives from the junction Linus + UNIX = Linux.


    # Portability


    Linux is a top ported kernel''s operating system, It runs on systems from `iPaq`
    (a portable computer) to `IBM S/390` (an enormously expensive mainframe), although
    this type of portability was not one of the primary goals of Linus Torvalds. His
    effort was to make his system portable enough to ensure ease for the compilation
    of applications on this system from different sources. Therefore, Linux initially
    became popular to some extent due to the power to get everyone''s favorite GPL
    or other fonts to run on Linux.


    # Distributions


    The complete operating system (GNU / Linux) is considered a Linux Distribution.
    It is a collection of free (and sometimes non-free) software created by individuals,
    groups, and organizations around the world, with the kernel at its. Today, companies
    like Red Hat or SuSE, as well as community projects with Debian or Gentoo, compile
    the software and provide a complete system, ready for installation and use. In
    addition, there are personal projects such as Patrick Volkerding that provides
    a Linux distribution, Slackware.


    # Linux Basics


    ## Startup and Shutdown


    They correspond respectively to the procedures of turning the computer on and
    off. The first concerns the supply of power for the operation of the machine''s
    electronic circuits and requires no major precautions from the user. On the other
    hand, the Shutdown process requires caution, as improper shutting down of the
    computer can cause damage to the operating system by destroying the internal tables
    it needs. When the computer "hangs," therefore, turning it off should be the last
    choice. One option is to start another session, check where the problem is, and
    end the locked session with an appropriate command.


    ## Section Opening on Linux


    To use Linux, you first need to enter your username and password, which are read
    and verified by the login program. In UNIX, a password file is used to store information
    having a line for each user, containing their alphabetic and numeric identification,
    their encrypted password, their home directory, and other information. When the
    user identifies himself, the login program encrypts the password just read from
    the terminal and compares it to the password file password to give the user permission.
    This user information file is usually found in the file:/etc/passwd`.


    ## User, Root, Groups, access, Protection


    The principle of UNIX file system security is based on users, groups, and other
    users.

