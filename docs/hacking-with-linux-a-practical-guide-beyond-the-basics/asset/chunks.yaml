    - **User**: is the person who created the file. The owner of the `File`.

    - **Group**: It is a category that brings together several users. Each user can
    be part of one or more groups, which allow access to files that belong to the
    corresponding group. By default, the initial user group is the same as your username.
    The group id is called `gid` (group id).

    - **Other**: This is the category of users who do not fit as file owners or groups.


    Access permissions for owners, groups, and other users are independent of each
    other, thus allowing a different level of access. The `root` account is also called
    a superuser. This is a login that has no security restrictions. The `root` account
    should only be used for system administration. Use the normal user account instead
    of the `root` account to operate your system. One reason to avoid using `root`
    privileges is because of the ease of irreparably damaging the system.


    ### Session, Login, Password, Logout

    On Linux, the system is logged in with a login and password, where login is the
    username and password is a security password. Once logged in, the user logs into
    their account and opens a session where they interact directly with the `Shell`.
    Logout (to clear the account) is done via the `exit` command.


    ### Virtual Consoles

    Terminal (or console) is the keyboard and display connected to your computer.
    Linux makes use of its multiuser feature, mainly using "virtual terminals." A
    virtual terminal is a second work session completely independent of others that
    can be accessed on the local computer or remotely via `telnet`, `rsh`, `rlogin`,
    etc.


    On Linux, in text mode, you can access other virtual terminals by holding the
    `<ALT>` key and pressing `<F1>` to `<F6>`. Each function key corresponds to a
    terminal number from 1 to 6 (the seventh is used by default by the graphical environment
    `X`). Linux has more than 63 virtual terminals, but only 6 are initially available
    for RAM saver reasons. If you are using graphics mode, you must hold `<CTRL>`
    + `<ALT>` while pressing a key from `<F1>` to `<F6>`.


    A practical example: If you are using the system in `Terminal 1` with any login
    and want to login as `root` to install a program, just open a virtual terminal
    and perform the desired task.


    ### File System

    Files are central to UNIX in a way not found on other operating systems. Commands
    are executable files, usually found in predictable locations in the directory
    tree. System privileges and permissions are controlled largely through files.
    `I/O` devices and `I/O` files are not distinguished at the highest levels. Even
    inter-process communication occurs through file-like entities. All system security
    depends largely on the combination of ownership and safeguards set on your files
    and your user accounts.


    ### The Hierarchical System, Directory Tree, Branch Assembly

    UNIX has a hierarchical directory organization in a format known as the file system.
    The base of this tree is a directory called `root directory`. On UNIX systems,
    all available disk space is combined into a single directory tree below `/`, where
    the physical location where a file resides is not part of the UNIX specification.


    ### Basic File Types: Plain Files, Directory

    The files are where the data is recorded. A file can contain text, song, program,
    etc. Every UNIX system recognizes at least three file types:


    - **Common Files**: Used to store data. Users can append data directly to common
    files, such as through an editor. Executable programs are also stored as common
    files.

    - **Directory Files**: A directory file contains a list of files. Each entry in
    the list consists of two parts: the file name and a pointer to the actual file
    on disk. On the other hand, directories behave exactly like common files, except
    that some commands used for handling common files do not work for directory files.

    - **Special Files**: These files are used to refer to physical devices such as
    terminals, printers, disks. They are read and written as common files, but such
    associations cause the physical device attached to it to activate.


    Linux is case sensitive, meaning it is case sensitive in files. The directory,
    like any other file, is also case sensitive. In the same directory, there cannot
    be two files with the same name or a file with the same name from a subdirectory.
    Directories on Linux are specified by a `/`.


    NOTE: We are used to seeing filenames as `name.ext`, where `ext` is the extension
    of the file type, for example `.txt`, `.html`, `.doc`. However, on Linux names
    do not have to follow this rule. Names can be made up of various extensions, such
    as `list.ord.txt`, `names.may.class`, `books.my.ord.txt`.


    Linux organizes your system through `inodes`. Inodes are disk data structures
    that describe and store file attributes, including its location. Some inode fields
    are: `user`, `group`, `file type`, `creation time`, `access`, `mode` (modification),
    `number of links`, `size` and `address on disk`.


    There are mechanisms that allow multiple names to refer to a single file on disk.
    These mechanisms are the `links`. There are two types of links: hard link (or
    symbolic) or soft link.


    - **Hard link**: associates two or more file names as the same `inode`. Hard links
    share the same block of data while functioning as independent directory entries.

    - **Soft link**: These are files pointers that point to another file name in the
    file system.


    ### File Access Permissions

    The UNIX system provides an easy means of controlling how system users can access
    all three file types. This is to allow or restrict access to important system
    files and to ensure the privacy of every user who has an account on the system.
    The system differentiates three classes of users. First, every file has an owner,
    designated in the system by the user. The owner has full control over the restriction
    or permission to access the file at any time. In addition to individual ownership
    of the file, it is possible for one or more system users to own the file collectively
    in a group property type. A user who does not own the file may have access to
    it if they belong to the user group that has permission for this. However, this
    user cannot restrict or allow access to the file. Users who do not own or belong
    to a group that has access to the file from the last category, known simply as
    "others."


    - The owner (designated by `u`, `user`): who created the file.

    - Group (called `g`, from group): The group consists of one or more users who
    can access the file.

    - Other (referred to as `o` by others): Refers to any other system user.


    The Unix system also allows three modes of file access: reading, writing and execution.
    The three access modes are relatively logical, but the meaning of these three
    access modes is different for directory files. The user with reading permission
    can read the directory contents, for example, with the command `ls`. The user
    with write permission can use some privileged programs to write to a directory.
    Write permission is required to create or remove files from the directory.A user
    must have execute permission on a directory to have access to the files allocated
    there. If a user has read and write permission on a common file that is listed
    in a directory but does not have execute permission for that directory, the system
    will not let him read or write the contents of that common file.A file that has
    its permissions like those in the example above could be read, written, or executed
    by the owner or anyone else. In the example below, the owner can read and write,
    the others can only read, and no one can execute it.


    | User | Group | Others |

    | :--- | :--- | :--- |

    | r w - | r - - | r - - |

    '
