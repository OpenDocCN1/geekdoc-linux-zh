    # Chapter 3: Special Permits and ACL In More Depth


    It is often necessary to allow a common user to run a binary that is owned by
    another user with the latter''s permissions. It can also happen that a particular
    program must run with administrative privileges no matter who runs it. For these
    situations, we have the special `SUID` and `SGID` permits (Set User ID and Set
    Group ID). This topic, together with the possibility of restricting access to
    files and directories and establishing special attributes for these will be the
    objectives of this chapter.


    ## SUID, SGID, And Sticky Bit


    If a program has the `SUID` permission and `root` is the owner of that file, the
    process that results from executing it will have superuser permissions and will
    have the same root accesses throughout the system. This emphasizes the need to
    restrict files that have this special permission to the minimum possible.


    Typically, the only program that has `SUID` is `passwd`, which allows each user
    of the system to change their own password (by default, not that of others) without
    having to rely on an administrator for it. The same applies to `SGID` in a file,
    although it provides access for a process to run with the privileges of the group
    that owns that file.


    To add the `SUID` to the `executable.sh` file, we can use two alternatives. One
    of them is to add a `4` at the beginning of the permissions to be assigned (if
    we express them in octal) or use `u + s` as we see below.


    ```bash

    chmod 4755 executable.sh

    chmod u + s executable.sh

    ```


    To set the `SGID` over another `executable.sh` the procedure is similar:


    ```bash

    chmod 2755 otherexecutable.sh

    chmod g + s otherxecutable.sh

    ```


    We can see both cases in the following image, where the `SUID` and the `SGID`
    are indicated with a letter `s` in the list of permits corresponding to the owner
    or the group, respectively.


    In addition to the `/usr/bin/passwd` file, it is also likely that there are others
    that have the `SUID` permission depending on the software that we have installed
    on our computer (incidentally, another binary that usually has the `SUID` bit
    is at `/bin/at`). In addition to these two examples, the binary corresponding
    to the X Window system (without the `s` at the end) also has such permission (for
    obvious reasons, all users must be able to log in to a graphical environment).


    ### Search for Files with Elevated Permissions


    As system administrators, we will be interested in identifying all the files that
    have the `SUID` or `SGID` permissions, and restricting them to the minimum necessary.
    Once identified, we can proceed to remove them or change their permits to others
    less potentially dangerous to the integrity of the system.


    To perform this task, we can use `find` and the possibility of using the permissions
    of a file as search criteria. The following two examples allow you to find all
    the files that have either of the two special permissions.


    ```bash

    find /usr/bin -type f -perm -u +s

    find /usr/bin -type f -perm -g +s

    ```


    As a consequence, we will see the result of the two commands above in a CentOS
    7 system (the output may vary in other distributions). Alternatively, we could
    save the output of the two previous commands in text files and after a while,
    execute them again. In this way, we could compare them with the `diff` command
    and make sure that the special permissions have not been set in any other program
    since the last revision.


    ### Sticky Bit


    In a Linux system, there may be directories in which all system users can create,
    modify, and delete files. As examples, we can name `/tmp` and any shared directory
    (think, for example, in the common space that can be accessed by several users
    on an FTP server). The sticky bit applied to a directory is a special permission
    that only the owner of a file contained in the directory or the owner of the directory
    can delete it.


    To illustrate, we will create the directory `/tests` and assign `777` permissions:


    ```bash

    mkdir /tests

    chmod 777 /tests

    ```


    As a next step, let''s add an empty file called `example1.txt`:


    ```bash

    touch /tests/example1.txt

    ```


    With another user account now let''s try to delete the file:


    ```bash

    rm /tests/example1.txt

    ```


    Next, we can appreciate the above commands and confirm that `example1.txt` was
    deleted. Let''s see what happens if we try to repeat the previous steps after
    having assigned the sticky bit over `/tests`:


    ```bash

    chmod + t /tests

    touch /tests/example2.txt

    rm /tests/example2.txt

    ```


    As we can see, the presence of the sticky bit this time prevents a user who is
    not the owner of the directory from deleting a file that is not his property.


    In general, to enter a directory (using the `cd` command) and perform operations
    within it, it is necessary to have read and execute permissions on that directory
    and its parents. To delete a file, you need to have write permissions on the parent
    directory, and execution permissions on all parent directories up. For example,
    to delete the file `/dir1/example.txt`, it is necessary to have executed permissions
    on `/`, on `/dir1`, and on the latter, also write permissions.


    ## Access Control Lists: ACLs


    Directories and files have the permission sets configured for the file owner,
    the file owner group, and all the other users of the system. But, these permissions
    have their limitations. We cannot configure different permissions to different
    users on the same directory or file, for example. In order to do so, access control
    lists were created, more commonly known by the acronym `ACL` (Access Control Lists).


    It is important to clarify that to use ACLs, and the file system must be mounted
    with the respective option. By default, `ext4` systems are mounted with this functionality.
    We can verify this with the `tune2fs` command followed by the `-l` option and
    the file system to verify, for example, `tune2fs -l /dev/sda1`.


    There are generally two sorts of ACLs:


    *   **Access ACLs**: list of access permissions for specific files and directories.

    *   **Default ACLs**: This type only can be linked with a directory. If a relevant
    file connected to a directory doesn''t have an ACL, inherit the rules from the
    default directory ACL.


    We can configure ACLs:


    *   By user

    *   By per group

    *   For users who are outside of the user group of the file

    *   Through the mask of effective rights

