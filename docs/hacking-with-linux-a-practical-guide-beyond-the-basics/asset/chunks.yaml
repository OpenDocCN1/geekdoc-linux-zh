    # 6. Path to the user''s personal directory


    # 7. User command interpreter (normally used `/bin/bash`)


    Most distributions reserve the first 1000 UIDs (from `0` to `999`). These are
    called system UIDs and are used only by the system. Human users will always have
    a `UID` from ID `1000`.


    ## Users and Groups


    A Unix user represents both a person (real user) and an entity that manages a
    service or application (logical or dummy user). Every user that is defined in
    the system corresponds to a unique identifier (`UID`) and an account, where their
    personal data is stored in a reserved disk area.


    A group is a logical construct - with a unique name and identifier (`GID`) - used
    to combine several accounts into a common purpose, sharing the same access permissions
    on some resources. Each account must be included in at least one user group, known
    as the primary group or primary group.


    ## General Characteristics of An Account


    The characteristics that define a user''s account are:


    * It has a unique name and user identifier (`UID`) in the system.

    * Belongs to the main group.

    * May belong to other user groups.

    * Information associated with the person who owns the account can be defined.

    * It has an associated personal directory for user data.

    * The user uses a specific command interpreter in their connection, where they
    can run their applications and operating system utilities.

    * You must have a personal password and difficult to find out by an imposter.

    * It has its own input profile, where the fundamental characteristics of its operating
    environment are defined.

    * May have an expiration date.

    * Disk quotas can be defined for each file system.

    * It is possible to have an audit system that records the operations performed
    by the user.


    ## System Files


    Linux provides several methods to define the users that can connect to the system.
    Typically, the accounts of users and groups are defined locally on each server,
    although external authentication methods can also be used, which allow multiple
    machines to share the same definitions for their common users.


    The following table shows the system files involved in the process of defining
    local users.


    | Format | Description |

    | :--- | :--- |

    | `/etc/passwd` | `User:x:UID:GID:Description:Direct:Shell...` | The main file
    describing local users, its fields are: <br>1. Username.<br>2. Not used (formerly,
    password).<br>3. User identifier (`UID`).<br>4. Identifier of the primary group.<br>5.
    Description or full name of the person representing that user.<br>6. Personal
    directory.<br>7. Mandate interpreter. |

    | `/etc/shadow` | `User:password:F1:N1:N2:N3:N4:Caduc:...` | The hidden file that
    includes coding and restrictions on account access keys. His fields are: <br>1.
    Username.<br>2. Coded key.<br>3. Date of the last password change.<br>4. Days
    until the password can be changed.<br>5. Days to request another password change.<br>6.
    Days to notify of the password change.<br>7. Days to disable the account after
    its expiration.<br>8. Expiration date.<br>9. Reserved. Note: Dates are expressed
    since `1970`. |

    | `/etc/group` | `Group:x:GID:Users...` | It contains the definition of groups.
    Its fields are: <br>1. Name of the group.<br>2. It is not used.<br>3. Identifier
    (`GID`).<br>4. List of members. |

    | `/etc/gshadow` | `Group:password:Admins:Users...` | A hidden file containing
    the keys. Its fields are: <br>1. Group name.<br>2. Password.<br>3. Admin users.
    |


    ## Create Users and Groups


    To create a user, we will use the `useradd` command. By default, the user''s personal
    directory will be created in `/home/` and `/bash` will be assigned as shell:


    ```bash

    useradd john

    ```


    If we want to change the user''s shell to `/bin/sh`, we will use `usermod` with
    the options `-s` (change shell) and `-d` (change home), along with `-c` (comment):


    ```bash

    usermod -s /bin/sh

    ```


    To assign an initial password to the user, we will use the `passwd` command:


    ```bash

    passwd john

    ```


    After logging in for the first time, the user can change it using the same command
    without specifying their username:


    ```bash

    passwd

    ```


    For example, we will now see how to edit the account of so and so that the account
    expires (`-E`) on December 31, 2018, and in the meantime, you are allowed to change
    it only (`-m`) once a week (7 days). Each password will be valid at most (`-M`)
    for 60 days, and 3 days before, you must be sent a reminder (`-W`). Finally, 5
    days after the expiration date of the password, the account will be blocked (`-I`):


    ```bash

    chage -E 2018-12-31 -m 7 -M 60 -W 3 -I 5

    ```


    For security, we can force the user to change his password the next time he logs
    in:


    ```bash

    chage -d 0 john

    ```


    Another way to display information about a given account is to use the `finger`
    command, followed by the username in question:


    ```bash

    finger john

    ```


    ## Group Administration


    In Linux, groups constitute the first method of controlling access to system resources.
    When a user account is created, a group with the same name (known as the primary
    group for that account) is also created and both are linked.


    To create a new additional group called `migroup`, we will use the `groupadd`
    command:


    ```bash

    groupadd migroup

    ```


    Then, to add the guy to it, we will use the `usermod` command again with its options
    `-a` (of append) and `-G` (group) followed by the name of the group and the user
    we want to add to it:


    ```bash

    usermod -a -G migroup john

    ```


    To delete a user account from a supplementary group, we have two alternatives:


    * Use `usermod -G` followed by the groups in which the user needs to remain active,
    and finally, the name of the user in question.

    * Use `gpasswd -d` followed by the username and group from which you want to delete
    it.

