    ## 增加


    - `+ minutes`（分钟）

    - `+ hours`（小时）

    - `+ days`（天）

    - `+ weeks`（周）

    - `+ months`（月份）

    - `+ years`（年）


    对于增加操作，也接受单数形式 `minute`、`hour`、`day`、`week`、`month` 和 `year`。增加功能用于在执行任务执行所指示的时间上“添加”特定长度的时间。现在让我们来看一些示例，以帮助我们说明这一点：


    **示例 1** - 为了在 2 分钟内创建一个名为 `scripts.tar.gz` 的压缩包（我们将当前目录下的所有 `.sh` 文件保存其中），我们将执行以下操作：


    ```bash

    echo "tar czf scripts.tar.gz * .sh" | at now +2 minutes

    ```


    让我们看下图中的结果，我们可以看到文件修改日期与 `at` 宣布执行上一个命令的时间相对应。


    **示例 2** - 如果我们想在 9 月 11 日上午 7:15 运行 `updatedb`，我们将使用命令：


    ```bash

    echo "updatedb" | at 7:15 am Sep 11

    ```


    还有其他命令可以管理我们使用此工具调度的任务：

    1. 查看我们自己的调度任务列表（如果我们有 root 权限，也可以查看所有用户的任务）：`atq`。

    2. 逐个删除：使用 `atrm`，后跟 `atq` 返回的任务号。

    3. 使其中一个任务仅在系统使用率低于给定阈值时运行：`batch`。


    如果我们面临一个占用 CPU 的进程运行密集程度不相等的团队，可以使用此命令在平均负载（`load average`）低于 `0.8` 时执行任务。例如，


    ```bash

    echo "updatedb" | batch

    ```

    这将在满足上述提到的条件时让 `updatedb` 运行。


    ## systemd 中的定时器


    `systemd` 中的定时器（`timers`）是一种特殊的单元，允许你以类似于 `cron` 的方式定期调度任务。然而，它们的特殊之处在于在指定何时采取操作方面更大的灵活性。


    定时器定义文件的特点是以 `.timer` 扩展，并包含控制服务或事件的指令。为了说明这一点，让我们来分析一个示例。


    在 `[Unit]` 部分中，我们将找到定时器的描述，而在 `[Timer]` 下，我们将看到配置本身，其中 `OnCalendar` 指明了定时器应该触发的日期和时间。在特定情况下，它将在每年每月的每天的上午
    6:00 和下午 6:00 触发。`RandomizedDelaySec = 12h` 指定了一个可以应用于定时器的随机延迟间隔，范围在 0 到指定值之间。`Persistent
    = true` 告诉我们，如果 `systemd` 在之前的某个时刻没有触发定时器（例如，如果设备当时关闭），它将尽可能地自动触发。


    在 `systemd.timer` 的帮助页面中，我们可以找到所有可用的配置指令。


    如果未显示 `Unit` 指令（请勿与同名的节混淆），定时器将控制具有同名的服务。换句话说，`apt-daily.timer` 和 `apt-daily-upgrade.timer`
    将控制相关的服务（`apt-daily.service` 和 `apt-daily-upgrade.service`）。幸运的是，这一切都在无需在定时器配置文件中指定的情况下发生。


    ## 系统事件日志


    运行在 Linux 系统上的大多数（如果不是所有）服务都会由于其运行产生某种类型的记录。无论是错误消息、登录事件甚至是纯粹的信息性问题，知道它们存储在哪里都至关重要。这将允许我们在需要寻找重要信息时检查它们。


    日志消息通常包含系统安全信息，尽管它可能包含任何信息。每条消息都包含了发送的日期和时间。


    传输这些消息使用的协议被称为 `rsyslog`，处理此类发送的应用程序也是如此。它在十多年前取代了 `syslog` 成为大多数发行版的事实标准。协议本身非常简单。它由一个运行相关服务的服务器组成（也称为
    `rsyslog` (`rsyslog daemon`)），记录每个应用程序发送的纯文本消息（小于 1024 字节）。


    尽管 `rsyslog` 有一些安全问题，但它的简单性导致许多设备都实现了它，用于发送和接收。这使得将多种类型系统的消息集成到单一中央存储中（即使来自不同的计算机）成为可能。让我们查看
    `/etc/rsyslog.conf` 中的以下行，其中以 `#` 开头的行会被服务忽略。


    - `kern.*` 表示所有内核消息，无论严重程度如何。

    - `.info; mail.none; authpriv.none; cron.none` 用于记录所有信息消息（`info`），无论发布它们的资源是什么（因此在开头使用通配符），但源自
    `mail`、`authpriv` 和 `cron` 的除外。

    - 所有 `authpriv`（私有身份验证）消息必须保存到 `/var/log/secure`，而 `mail` 和 `cron` 分别在第一个例子中，在点点
    之后，使用 `*` 告诉我们该规则适用于任何类型的事件，无论严重程度如何。


    `-` 在 `/var/log/maillog`（以及其他）符号在之前的版本中用于跳过立即写入。现在是一个不再使用的选项。上述的示例将帮助我们在下一节中解释消息结构。


    ## 消息结构


    `rsyslog` 发送的消息由三个字段组成：

    1. 优先级

    2. 头部

    3. 文本


    上述三个字段之间不应超过 1024 字节，但没有最小长度。让我们现在详细查看每一个的含义和可能性：


    - **优先级**指示消息的资源（来源）和消息的严重程度。它通常遵循 RFC3164。最常见的资源有 `auth`、`authpriv`、`cron`、`daemon`、`kern`、`lpr`、`mail`
    以及用于自定义消息的 `local0` 到 `local7`。严重程度（按重要排序）可以是 `debug`、`info`、`notice`、`warn`、`err`、`crit`、`alert`
    和 `emerg`。默认情况下将记录指定严重程度及以上的消息。

    - **头部**指示消息的日期和时间以及服务器（源计算机的名称），并与解释性文本共同构成存储在日志文件中的信息。


    通过 `logger` 命令，我们可以手动或通过脚本向 `rsyslog` 发送个性化消息。例如：


    （代码省略）


    它会将消息保存在 `/var/log/mi.log`（`local1.notice` 和严重程度的目的地）中。在修改配置文件后，我们需要使用 `systemctl
    restart rsyslog` 重启服务以使其生效。


    或者，系统消息可以被发送到：


    - 另一台机器，进行远程存储。为此，我们需要在操作字段中使用两个 `@` 符号而不是本地日志路径来指示该系统的名称或地址。如果我们有一台可以赖的机器（连接到网络），这将非常有用。这样，我们系统的消息副本将存储在那里，即使有人登录到生成消息的机器，也无法修改。这需要远程系统启用接收来自其他计算机的消息。

    - 每当特定类型的消息产生时执行的脚本。在这种情况下，我们必须在脚本的完整路径前放置 `^` 符号。


