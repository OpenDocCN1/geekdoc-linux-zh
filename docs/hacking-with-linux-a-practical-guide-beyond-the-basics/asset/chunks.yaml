    ### `/etc/exports`


    | 客户端目录 (选项) | 描述 NFS 可导出目录的主文件。其字段如下： |

    | :--- | :--- |

    | a) | 要导出的本地目录。 |

    | b) | 客户端的名称或 IP（支持在名称和域名中使用通配符）。 |

    | c) | 导出选项：只读 (`ro`)、读/写 (`rw`)、防止客户端 root 权限访问 (`root_squash`)、允许 root 权限访问
    (`no_root_squash`) 等。 |


    客户端可以在其文件 `/etc/fstab` 中配置目录的挂载，或使用 `mount` 命令直接挂载：

    ```bash

    mount –t nfs4 Server:Mounting PointDirectory [Options]

    ```


    ### SMB / CIFS

    互联网通用文件系统 (CIFS) 提供了一系列开放且独立的机制，供客户端系统平台通过网络向其他机器请求文件服务。该协议是所谓的服务器消息块 (SMB) 的实现，主要由
    Windows 计算机使用 [12]。微软重新定义了新的协议版本（随 Windows Vista 发布的 `SMB2` 和随 Windows 7 发布的 `SMB2.1`），以提高性能并降低通信复杂度。


    CIFS 的主要特性是：

    * 访问文件，允许以读写方式共享信息。

    * 对文件和记录进行锁定和解锁访问。

    * 文件和目录更改的通知。

    * 包含扩展属性。

    * 命名解析协议的独立性。


    UNIX 的 CIFS 扩展是新创建的标准，仅在 Linux 内核 2.6 版本的文件服务中实现，而旧版本则需要重新编译或生成自己的模块来管理 CIFS 客户端，尽管它们支持组装
    `SMBFS` 文件系统。


    文件服务器可以是 Windows 操作系统的机器（从 NT 开始），也可以是了 Samba 服务的 Linux。在这两种情况下，必须配置要导出的资源。每个
    Linux 发行版都包含一组软件包，提供用于控制 CIFS/SMB 文件系统的基本工具、访问资源的客户端或 Samba 文件服务器。Ubuntu 10.04
    Lucid 分发了 Samba 的 3.4 分支，该分支包含了与未来版本 Samba 4 的初始兼容性；而 Fedora 13 则带有 3.5 版本，包含了对
    `SMB2` 的实验性支持。


    下表显示了 Samba 客户端使用的命令。


    | 命令 | 描述 |

    | :--- | :--- |

    | `smbclient` | 类似于 FTP 客户端的 Samba 客户端。 |

    | `smbpasswd` | 允许用户的远程密码。 |

    | `smbcquotas` | 管理 NTFS 资源的配额。 |

    | `smbcacls` | 管理文件的访问控制列表 (ACL)。 |

    | `smbspool` | 将文件发送到远程打印队列。 |

    | `net` | Samba 和远程服务器管理工具。 |

    | `pdbedit` | Samba 用户数据库管理工具。 |

    | `findsmb` | 列出子网中响应 SMB 请求的机器。 |

    | `mount.cifs` | CIFS 文件系统编辑器。 |

    | `umount` | 通用卸载文件系统。 |


    组装 CIFS 文件系统需要用户名和密码身份验证。最安全的方法是在挂载顺序中指定一个使用用户凭据 (`user`, `password`) 的文件。


    ```bash

    mount -t cifs Server:MountingPoint /LocalPath

    ```


    ### 第 5 章：网络设置

    组装 CIFS 文件系统需要用户名和密码身份验证。最安全的方法是在挂载顺序中指定一个使用用户凭据 (`user`, `password`) 的文件。

    ```bash

    mount -t cifs Server:MountingPoint /LocalPath

    ```


    #### 用户名

    挂载格式为：

    ```

    Server:MountingPoint

    ```


    #### 密码

    挂载格式为：

    ```

    [password]

    ```


    #### 选项

    挂载格式为：

    ```

    [options]

    ```


    #### 数值

    挂载格式为：

    ```

    [value]

    ```


    #### 网络接口

    NFS 客户端可以在其文件 `/etc/fstab` 中配置目录的挂载，或使用 `mount` 命令直接挂载。


    | 接口 | 描述 |

    | :--- | :--- |

    | `lo` | 用于测试的虚拟接口 (IP 地址 127.0.0.1)。 |

    | `eth` | 以太网设备。 |

    | `wlan` | 无线以太网设备。 |

    | `tr` | 令牌环型网络。 |

    | `ppp` | 调制解调器或 ISDN 连接。 |

    | `hdi` | 蓝牙设备 |


    每个网络设备都有由制造商分配的唯一且不同的物理访问地址 (`MAC address`)。然而，连接参数必须在激活网络接口时分配。


    #### TCP / IP

    TCP / IP（传输控制协议 / 互联网协议）通信协议允许连接到互联网的所有类型机器进行定位和通信。TCP / IP 由一组基于分层的协议组成：


    * 网络层——等同于 OSI 标准的第 3 层——建立了多台机器间通信的数据包必须遵循的最优。使用 `IP`。

    * 传输层——等同于 OSI 协议栈的第 4 层——允许网络节点之间建立连接。有两种传输协议：传输控制协议 (`TCP`)——执行同步的安全通信，并在出错时进行数据恢复；以及用户数据报协议
    (`UDP`)——允许基于称为数据报的数据包的异步通信。

    * TCP / IP 协议集建立了一种基于地址和名称的机制，允许唯一地定位每台连接到互联网的机器。IP 地址与机器名称之间的等效关系通过使用域名服务 (`DNS`)
    协议进行查询的特殊计算机完成。


    现代版本的 Linux 会自动检测网卡、加载适当模块并分配默认接口。系统管理员必须为系统的每个网络接口设置参数，可以通过本地配置文件，也可以由远程 `DHCP`
    服务器生成，后者可以静态或动态地分配值。


