  trans: "\n\n# 第 9 章：Shell 脚本\n\nLinux 的灵活性部分在于它允许我们根据每个用户的需求轻松地配置工作环境。此外，如果你想防止特定账户用于登录，通常会将\
    \ `/bin/false` 配置为该用户的默认 shell。这适用于那些专门用于在后台运行网络服务或进程的账户。如果在 `/etc` 目录下放置一个名为\
    \ `nologin` 的文件，所有用户都会产生相同的效果。这会自动禁用除 `root` 之外任何账户的登录尝试，并返回文件内容作为信息提示。不仅如此，仅需使用文本编辑器，我们就可以创建自己的程序并从命令行执行它们以实现任务自动化。\n\
    \n## 配置 Shell 环境\n\n每个用户在个人目录下都有系列以隐藏文件形式存在的脚本，用于配置他们的环境。例如，`~/.bash_profile`（或\
    \ `/.profile`）和 `/.bashrc` 存储了一个或多个别名（aliases）和环境变量，而 `~/.bash_history` 和 `~/.bash_logout`\
    \ 则保存了命令历史以及关闭用户会话时执行的可选操作列表。\n\n这些文件反过来可以通过 `source` 命令或使用点符号（`.`）来执行其他脚本。作为快捷方式，正如我们在后续图中所示。两种情况的结果都是相同的：第二个脚本在第一个脚本相同的环境中启动。因此，在第二个脚本中设置的任何变量或别名在第一个脚本环境中可用。\n\
    \n## 命令的链式执行\n\n到为止，我们讨论了从终端一个接一个地执行命令。然而，Bash 允许我们从单行执行一系列命令，甚至在某些条件下执行。特别是，当输入\
    \ `command1`、`command2`、`command3` 并按下回车时，Bash 将执行 `command1`，然后执行 `command2`，最后执行\
    \ `command3`，且在任何失败的情况下都不会停止。\n\n另一方面，`command1 && command2` 会导致 `command2` 只在\
    \ `command1` 成功完成后运行，而 `command1 || command2` 则会导致在 `command1` 失败时才执行 `command2`。\n\
    \n考虑以下示例进行说明，其结果如下所示：\n\n```\ncd; echo \"I am an intermediate command\"; ls -l\
    \ /user && echo \"This message will appear only if /user exists\"\nls -l /user\
    \ || echo \"This message will appear if /user does not exist\"\n```\n\n使用 `&&`\
    \ 的经典示例是：仅在仓库更新成功后才安装包。换句话说，`apt-get update && apt-get install tmux` 只有在 Debian\
    \ 或类似系统中与仓库的同步成功完成后，才会尝试安装 `tmux` 软件包。这同样适用于 CentOS 或使用 `yum` 的类似发行版。\n\n正如我们所看到的，在第一个示例中，列表中的所有命令都是一个接一个执行的；而在接下来的两个中，这取决于列表开头命令的输出状态。请记住，命令的退出状态状态码（exit\
    \ status）如果执行成功则为 `0`，否则为不同的数字；我们可以随时通过 `echo $?` 来验证这一点。\n\n## Shell 脚本\n\n发现\
    \ Linux 命令行力量的一种方法是创建 Shell 脚本，它们是可执行的纯文本文件，连续行包含一个接一个命令。这些命令由 shell 解释，shell\
    \ 是一个接收这些作为输入并作为内核执行接口的程序。\n\n### 第一步\n\n在介绍新编程语言时，惯做法是在屏幕上显示经典的“Hello World”。让我们采取不同的路线，做一些更有趣、更有用的东西，并让我们能够展示基础概念。\n\
    \n使用文本编辑器，在 `primerscript.sh` 中编写以下内容：\n\n```bash\n#!//bin/bash\n# 当前日期 = $(date\
    \ +%d/%m/%Y)\n# 打开的会话数 = $(who | wc -l)\n# 信息\necho \"Today is $DATE. There are\
    \ $SESSIONS open sessions.\"\n```\n\n让我们进行一些说明：\n\n*   脚本的第一行始终指示我们想要执行它的的 shell。在大多数情况下，我们会选择\
    \ Bash。shell 的绝对路径之前必须以字符 `#!` 开头。\n*   除了脚本的第一行外，所有以井号（`#`）开头的行都是信息性注释。我们将使用它们来解释后续命令的目的，以便在未来由他人检查脚本时，明确我们脚本的操作（也为了提醒我们自己！）。这些行在脚本执行期间不会被\
    \ shell 解释。\n*   为了避免在脚本的多个部分重复相同的命令，并便于阅读，我们通常希望将结果保存在变量中。这样，如果我们将来想更改命令，只需要在声明变量的地方修改即可。在上面的示例中，我们将指示当前日期和打开的用户会话数量的命令输出分别保存到变量\
    \ `DATE` 和 `SESSIONS` 中。在指定变量所需的名称后，我们放置等号 `=` 并命令括在括号中。\n*   最后，`echo` 命令将帮助我们在屏幕上显示消息，其中我们将自己选择的文本与\
    \ `DATE` 和 `SESSIONS` 的值混合。当我们想在脚本的其他部分使用保存在变量中的值时，通过在变量名前加上 `$` 符号来实现。此时，我们可以发现读取\
    \ \"Today is $DATE\" 比读取 \"Today is $(date +%d/%m/%Y).\" 要友好得多。\n\n我们保存更改关闭文件，并给新的文件执行权限：`chmod\
    \ +x primerscript.sh`。作为最后一步，我们在名称前加上点和杠来运行脚本（这是为了指示 `primerscript.sh` 是存在于当前目录下的可执行文件，系统通常不会在该处查找此类文件）：`./primerscript.sh`\n\
    \n## 位置参数\n\n我们经常想要对不同的对象应用操作，因此为了避免为每个特定情况修改脚本，我们可以利用参数——即在执行脚本时传递给脚本的值。在脚本内部，第一个参数通过\
    \ `$1` 调用，第二个参数为 `$2`，依此类推。\n\n以下脚本（`backupbasic.sh`）期望两个参数：\n- 要压缩的目录\n- 结果 tarball\
    \ 的预期名称\n\n```bash\n#!//bin/bash\n# 要压缩的目录是第一个参数\nDIRECTORY=$1\n# tarball 的名称\n\
    FILE=$2\n# 压缩 $DIRECTORY 的内容\ntar czf $FILE $DIRECTORY/*\n# 在屏幕上显示消息\necho \"\
    You have finished backing $DIRECTORY in $FILE.\"\n```\n\n给脚本执行权限：`chmod +x backupbasic.sh`。通过传递\
    \ `/var/log/httpd` 和 `primerbackup.tar.gz` 作为参数来运行它：`./backupbasic.sh /var/log/httpd\
    \ primerbackup.tar.gz`。正如上面的图片所示，脚本执行正确，因为它的输出状态等于 `0`。\n\n## 条件判断\n\n任何编程语言中最基本的流程控制形式都是使用\
    \ `if / else` 结构。在 Shell 脚本中，它的实现如下：\n\n```bash\nif [CONDITION]; then\n    ACTION\n\
    else\n    [ALTERNATIVE ACTION]\nfi\n```\n\n代码的缩进虽然 Bash 并不严格要求，但有助于阅读脚本。在可能的条件中，我们可能想要检查以下内容，尽管还有其他可选方案：\n\
    \n*   文件或目录是否存在\n*   上一个执行的命令是否成功完成\n*   空文件的验证\n\n为了说明，我们将上面创建的脚本（`backupbasic.sh`）进行修改，以满足以下条件：\n\
    \n"
- fmt: "\n*   Before executing, check that the directory to be compressed exists.\
    \ If it does not exist, end with error code `10` (an arbitrary error code choice).\n\
    *   If the compression is successful, display a message on the screen that indicates\
    \ this. Otherwise, show a descriptive message and end with error code `20` (another\
    \ arbitrary choice).\n*   Verify that the tarball is not empty (that is, its size\
    \ is different from `0 B`). Show confirmation or error messages as appropriate\
    \ (end with error `30` in this last scenario).\n\nThe resulting script:\n```bash\n\
    #!/bin/bash\n# The directory to be compressed is the first parameter\nDIRECTORY\
    \ = $1\n# Tarball name\nFILE = $2\n# Check directory existence\nif [ -d $DIRECTORY\
    \ ]; then\n  # Compress the contents of $DIRECTORY\n  tar czf $ARCHIVE $DIRECTORY\
    \ /*\n  if [ $? -eq 0 ]; then\n    if [ -s $ARCHIVE ]; then\n      # Show message\
    \ on screen\n      echo \"You have finished backing $DIRECTORY in $ARCHIVE.\"\n\
    \    else\n      # Report error per empty file\n      echo \"The resulting file\
    \ ($FILE) is empty\"\n    fi\n  else\n    # Report error and finish\n    echo\
    \ \"Compression of $DIRECTORY in $FILE not completed or correctly.\"\n    exit\
    \ 30\n  fi\nelse\n  # Indicate if the directory does not exist and end with error\
    \ code\n  echo \"The directory $DIRECTORY does not exist.\"\n  exit 10\nfi\n```\n\
    \nLet us now explain the purpose of the arguments of each `if / else` block:\n\
    \n*   The `-d` option, followed by the path to a directory, is used to check that\
    \ it exists.\n*   As we explained, `$?` indicates the completion code of the immediately\
    \ preceding command. The `-eq 0` option checks if the completion code is equal\
    \ to `0`.\n*   The `-s` option followed by the path to a file verifies that it\
    \ exists and that its size is different from `0 B`.\n\nLet's see next what happens\
    \ and (the associated error code) when we pass it to the script:\n\n*   A nonexistent\
    \ directory\n*   An empty directory\n\nAs we can see, the use of custom exit codes\
    \ allows us to provide error messages that are in accordance with the situations\
    \ encountered.\n\n### Test Expressions\n\nAs we can see, we will often need to\
    \ evaluate the conditions in our scripts. An alternative way of doing this is\
    \ by using test expressions, which also allows us to perform logical operations\
    \ of the `AND` or `OR` type between two conditions very easily. All the expressions\
    \ in the following list refer to the `test1` file that we must have created within\
    \ the same directory where we will place the script.\n\n*   `[-f test1]` is used\
    \ to check that `test1` exists and that it is a regular file.\n*   `[-e test1]`\
    \ or `[-a test1]` verify that `test1` exists. However, in this case, the condition\
    \ will be fulfilled even in the case of a directory, symbolic link, or other types\
    \ of files.\n*   `[-s test1]` will be true if `test1` exists, and its size is\
    \ greater than `0` bytes.\n*   `[-O test1]` is used to verify that the current\
    \ user owns the file.\n\nFinally,\n\n*   `[-r test1]`, `[-w test1]`, and `[-x\
    \ test1]` will help us determine if we have read, write, and execute permissions\
    \ on `test1`, respectively.\n\nTo see the complete list of test expressions, we\
    \ can refer to the documentation available in *The Linux Documentation Project*.\
    \ To begin, we will create the `test1` file with a line of content:\n`echo \"\
    I am a test file\" > test1`\nAnd also the `test.sh` script:\n```bash\n#! /bin/bash\n\
    FILE = test1\n# Condition verification\nif [ -f $FILE -a -s $FILE ]; then\n  echo\
    \ \"$FILE exists, it is a regular file, and its size is greater than 0 bytes.\"\
    ;\nfi\nif [ -r $FILE -a -w $FILE ]; then\n  echo \"$FILE exists, and I have permissions\
    \ of reading and writing.\";\nfi\nif [ ! -x $FILE -o ! -O $FILE ]; then\n  echo\
    \ \"I do not own $FILE, or I do not have execution permits.\";\nfi\n```\n\nLet's\
    \ grant the execution permission and then run the script:\n`chmod +x test.sh`\n\
    `./test.sh`\n\nLet's see what happens when we run the script for the first time.\
    \ Then we change some of the conditions and verify again. We can see that after\
    \ emptying the file `test1` with `cat /dev/null > test1`, the first condition\
    \ is no longer met. The same happens with the third condition after granting execution\
    \ permissions to the owner of the file. Finally, the logical `AND` / `OR` operations\
    \ are implemented through `-a` and `-o`, respectively. It is possible to implement\
    \ the `NOT` by placing the exclamation point `!` in front of the condition that\
    \ we want to deny.\n\n### Loops And Decision Making\n\nSo far, we have treated\
    \ cases in which there is no repetition in the actions to be carried out. When\
    \ we want to repeat them, we must resort to the use of loops, as we will explain\
    \ below.\n\n#### The for Loop\n\nThis type of loop is used to perform a certain\
    \ action, a defined number of times that is known in advance. The syntax is as\
    \ follows:\n```bash\nfor VARIABLE in element1 element2 ... elementN; do\n  action\n\
    done\n```\nFor example, suppose we wanted to rename a list of files by placing\
    \ `.bkp` at the end:\n```bash\nfor FILE in archive1.conf file2.conf file3.conf;\
    \ do\n  mv $FILE $FILE.bkp\ndone\n```\nIn this example, we name (arbitrarily)\
    \ our variable as `FILE`. The action we wish to perform will be carried out on\
    \ each file in the list. During the first iteration, `file1.conf` will be renamed\
    \ to `file1.conf.bkp`. The same will happen with `file2.conf` and `file3.conf`\
    \ in the second and third iterations, respectively.\n\n#### The while Loop\n\n\
    If we do not initially know the number of elements in the set, we will use the\
    \ `while` loop, as we will explain. The syntax of this loop is shown below:\n\
    ```bash\nwhile CONDITION; do\n  ACTION\ndone\n```\nWhile `CONDITION` is met, `ACTION`\
    \ will be carried out. In the next section, we will illustrate the use of the\
    \ while loop.\n\n#### Use of Case\n\nA classic case of the flow control of a program\
    \ or script occurs when there are two or more viable alternatives, and we must\
    \ choose one. For example, when we are presented with a menu. In this case, the\
    \ program flow will be given by our choice. To illustrate, suppose we want to\
    \ examine user accounts with access to Bash one by one and choose whether we want\
    \ to add a reminder to remove it. Let's save the following content inside `examplecase.sh`\
    \ script:\n\n```bash\n#! /bin/bash\n# In this file we will save the list of tasks\n\
    FILE_TASKS = tasks.txt\n# If the task file exists, delete it first\nif [ -f $FILE_TASKS\
    \ ]; then\n  rm $FILE_TASKS\nfi\n# Save the list of users with access to Bash\
    \ in users.txt\nUSERS_BASH = users.txt\ngrep bash /etc/passwd | cut -d: -f1 >\
    \ $USERS_BASH\n\n# Browse account by account\nwhile read ACCOUNT; do\n  # Show\
    \ a message for each user. Read the answer from the terminal\n  read -p \"Remove\
    \ access to Bash at $ACCOUNT? [s/n]:\" REMOVE </dev/tty\n  case $REMOVE in\n \
    \   [sS])\n      # If the answer is Yes [sS], add a message to the file\n    \
    \  echo \"Remove access to Bash at $ACCOUNT\" >> $FILE_TASKS\n      ;;\n    [nN])\n\
    \      # Otherwise, display a message on screen\n      echo \"You chose not to\
    \ remove access to Bash at $ACCOUNT.\"\n      ;;\n  esac\ndone < $USERS_BASH\n\
    ```\n\nBefore executing it, let's give you execution permissions:\n`chmod +x examplecase.sh`\n"
