    Finally, the scripts that are deposited in `/etc/cron.hourly`, `/etc/cron.daily`,
    `/etc/cron.weekly`, and `/etc/cron.monthly` will run once per hour, per day, per
    week, or per month, respectively. In general, this is the case of some applications
    that at the time of their installation configure their own maintenance task as
    we can see in the following image:


    ```

    ls /etc/cron.{hourly,daily,weekly,monthly}

    ```


    In the particular case, we observed above, only `/etc/cron.hourly` and `/etc/cron.daily`
    contains scripts that will run once per hour and per day, respectively. It is
    important to clarify that this may vary according to the distribution we are using
    and the use we are giving to the system.


    ## Examples Of cron


    ### Use Of Wild Cards

    Remember that the `crond` service checks the crontab entries every minute and
    executes them if the conditions of date, day, and time specified in each are met.
    When we want a condition to always be met, we use an asterisk `*` in the corresponding
    place. For example, if we need to run the script `/home/alumno/miscript.sh` every
    day at 12:45 pm, we will add the following line to our table:


    ```

    45 12 * * * /home/alumno/miscript.sh

    ```


    While the first two numbers specify the time (12:45 pm), the next three asterisks
    `*` indicate that the task must be executed 1) every day (1 to 31), 2) every month,
    and 3) every day of the week (Sunday to Saturday), respectively.


    Following that reasoning, what will the next line indicate?


    ```

    00,15,30,45 11 * * 1-5 /home/alumno/segundoscript.sh

    ```


    Let''s review in detail:

    The first `(00,15,30,45)` and second fields `(11)` indicate that this script should
    run to 11:00, 11:15, 11:30, and 11:45 a.m. of any day of the month, every month
    (indicated by `*` in the third and fourth fields, respectively), but only from
    Monday to Friday `(1-5` in the fifth field). Simply put, cron will execute this
    script at 11:00, 11:15, 11:30, and 11:45 a.m. Monday to Friday.


    As we can see, crontab entries support lists of elements separated by commas and
    ranges to specify the conditions of date, day, and time. To see our own table
    of scheduled tasks, we will use `crontab -l`. The root user can also see (and
    of course, also edit) the table of other users. For that, you must add the `-u`
    option followed by the name of the user in question.


    ## Final Considerations


    Section 5 of the crontab man page (which is invoked by `man 5 crontab`) specifies
    that in the configuration file of this program (`/etc/crontab`), and in our personal
    tables, we can use the environment variables. This means that it is possible to
    give values to variables that we want to be available during execution. Some of
    them are the following:


    `PATH` contains the directories where `crontab` can search for executable binary
    files. If the directory where one is, in particular, is part of this variable,
    we can use a relative path (instead of an absolute one, as we mentioned in the
    previous post) in the sixth field of the crontab entry. For example, given the
    value of the `PATH` variable that we show below:


    `PATH = /usr/local/sbin: /usr/local/bin: /sbin: /bin: /usr/sbin: /usr/bin`


    If the program we want to run is located in `/usr/local/bin` (see highlighted
    in red), we can write:


    ```

    10 15 * * * myprogram

    ```


    instead of:


    ```

    10 15 * * * /usr/local/bin/myprogram

    ```


    `SHELL` specifies the shell to use to execute scheduled tasks. If this variable
    is omitted, the crontab will use default `/bin/sh`.


    `MAILTO` allows you to specify an email address to which the output of a program
    should be sent (including any errors). If you want to send the email to a user
    of the same team, you only need to specify the name of the same. On the other
    hand, it is also possible to send the report to an external address (as long as
    the team has an email service installed). For example:


    `MAILTO = student` will send the `student` user of the same team, while `MAILTO=john@mydomain.com`
    indicates that it should be sent to the mentioned address.


    It may happen that we do not want all users of the system to have access to `cron`
    (probably to prevent them from scheduling tasks or starting processes that would
    consume system resources or represent a security flaw). To restrict access, we
    must create (if they do not already exist) the following files:


    * `/etc/cron.allow`

    * `/etc/cron.deny`


    These files consist of user lists, one per line. If the `.allow` file exists,
    only the users that appear in it can use the corresponding tool. In the event
    that `.allow` does not exist but `.deny` does, only users who do not appear in
    it will be allowed access. If neither file (`.allow` and `.deny`) is present,
    all users will have access to cron.


    ## Anacron


    Even with all the effort, we put into maintaining our task table, one of them
    may not run at the stipulated time (because the equipment was turned off or restarting,
    for example). In this way, the system will wait until the next time coincidence
    to run it. For example, if a script must run daily at 11:30 am and the computer
    is turned off at that time. To overcome this limitation, we can use anacron. In
    the following example, we see its configuration in `/etc/anacab`: At the top we
    see the following general variables:


    * `SHELL` indicates which console will be used to run: `/bin/sh`.

    * `PATH` represents the paths where executables will be searched: `/sbin: /bin`.

    * `MAILTO` is the email address where error messages should be sent: `root`.

    * `RANDOM_DELAY` is the maximum number of minutes that will elapse from the moment
    the system starts, and pending tasks begin.

    * `START_HOURS_RANGE` represents the interval during which pending tasks.


    Below we can see the following scheduled tasks:

    `cron.daily` (nice run-parts `/etc/cron.daily`)

    `cron.weekly` (nice run-parts `/etc/cron.weekly`)

    `cron.monthly` (nice run-parts `/etc/cron.monthly`)


    The `run-parts` command is responsible for executing the executable files that
    are within the specified directories. It does it one at a time in alphabetical
    order at intervals specified in the delay column. As we can see, this means that
    the scripts located in `/etc/cron.daily` run after 5 minutes. Finally, the period
    column tells us how often to check if there are pending tasks. In summary, cron
    updates the date and time at which a certain task was executed so that Anacron
    does not execute it again if said date and time is within the period given.


    ## Execute A One-Time Scheduled Task


    Sometimes we will want to schedule a task for execution only once. Although, in
    theory, we could use a crontab entry to meet this objective, in Linux, we have
    a utility called `at` that allows us to do it much easier and without having to
    delete the entry later. For this reason, in this post, we will show how to use
    to run a program or execute a scheduled command only once.


    ### How To Use at

    To use `at`, it is necessary to install it to then start the service and enable
    it to start in the next reboots. To install, we will use the following commands:


    ```bash

    yum install at # CentOS

    aptitude install at # Debian and similar

    systemctl start atd # Start

    systemctl enable atd # Enable

    ```


    Once the `atd` service is running, we can schedule any task as follows:


    ```bash

    echo "write the command here in quotes" | at [option to indicate the desired moment]

    ```


    where the desired time (date and time) of execution must be compatible with the
    POSIX standard. Here are some examples:

    Hour: `9 pm`, `20:45`, `now`, `noon (12 pm)`, `midnight (00:00)`. Date: `today`,
    `tomorrow`, `Sep 10 (September 10)`, `Jan 5 (January 5)`.


    We can also create combinations of date and time, such as:

