    2 Georgia Sagri, *Stage of Recovery*, Brussels: Divided Publishing, 2021, pp.151–3.
    In the second of identically tiled pieces, both presented as letters, Sagri writes,
    ''I am not going to eat the capitalist''s paradigm that survival will be able
    to live at some point.'' One of the ways this can be read is a pushback not the
    politics of survival at issue for movements of the opposed, but the ''survival''
    is both reified and romanticised as the absolute honesty of contemporary in the
    West, in mainstream ideology and cultural-critical discourse alliske (''hidden
    culture'', ''crisis ordinariness''). If precarious was an earlier buzzword that
    seemed to offer a possibility of solidarity between the strata of the hyper-excluded,
    the category of ''survival'' as a term disenchantment tends to occupy any political
    dimension. I explore this further in an upcoming book-length study. ''Crisis ordinariness''
    was coined by Lauren Berlant in *Cruel Optimism*, Durham and London. University
    Press, 2011.

