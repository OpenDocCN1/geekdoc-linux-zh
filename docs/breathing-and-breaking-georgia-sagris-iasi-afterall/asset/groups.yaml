  mdcn: '

    那个世界。这种系统性的、或社会性的生态学，可以说也描述了近期艺术领域对“关怀”辩论的参与。无疑，从今年的到此前提到的“YOYI!”艺术节——其策展概念为“否定”以及“延续”治愈观念留出了空间——此类项目都要求对其物质条件以及通过艺术手段对其构建或翻译的意义进行审慎且结合语境的关注。然而，这种理解已经体现在萨格里（Sagri）的愿景中，即将身体视为“在变化的动量中、在不同行为和动作的加速与加速之间发展的复杂关系序列”，这引用了吉尔·德勒兹对斯宾诺莎的分析。⁸
    因此，文中强调了呼吸、声音和运动，以突破图像身体和表演身体的窒息感，这些身体构成了我们所有人工作的资本主义世界中“生存”那不可逃避的现实主义。在这里，用“破门”而不是谈论它似乎更为恰当。敲门是对权力的精疲力竭的诉求；破门意味着进入另一个由（个人的、集体的）运动塑造的景观，这种运动从寻找你的身体运动和生活的新方式开始。


    ![](img/edefbf950d524c377ff438833ac0a686_5_0.png)


    Georgia Sagri, Early Morning, Cool Passage, Cave, Organ, Installation View, Kunstthalle
    Friart, Fribourg, 2022. Photo: Stath Malamakis. ©Georgia Sagri


    那么，以景观作为结束。放置在素描周围墙壁上的六幅神秘的、较小的蛋彩画——《清晨、凉爽通道、洞穴、管风（左侧）；清晨、凉爽通道、洞穴、管风（右侧）；午后、通道、洞穴、温暖管风（左侧）；午后、通道、洞穴、温暖管风（右侧）；潮湿之夜、通道、冷洞穴、管风（左侧）；潮湿之夜、通道、冷洞穴、管风（右侧）均为2022年——根据太阳在一天内穿越空间的移动排列，描绘了身体的想象，并形成了一种至少对于这种西方作品而言让人想起东正教圣像的形式。由于尺寸和材料，但也由于类型小说的语言风格，一整天洞穴那种诡异且无处依附的情绪（有时有人影，有时没有），让我开始想象一种治疗过程，在这个过程中，我的目光并没有游离到医生办公室墙上通用的印刷品上，而是治疗的一部分是在一个既是我的内部也是我的环境的地物理场域中进行理解。09
    本杰雅明的另一段文字，摘自梦梦记：“我发现自己站在一张地图前，同时也站在它所描绘的景观中。景观是可怕地阴郁和荒凉的；我无法说那种荒凉是岩石荒野，还是在一个充斥着大写字母的空旷灰色地上。这些字母在地形上书写并弯曲，仿佛在追随山脉；……我知道或得知我正处在我听耳道的迷宫中。但这张地图同时也是地狱的地图”：10


    ## 脚注




    - 1 Walter Benjamin, ''The Destructive Character'', Frankfurter Zeitung, 1931年11月20日,
    可访问 https://libcom.org/library/destructive-character-walter-benjamin (最后访问于2022年10月4日)。

    - 2 Georgia Sagri, *Stage of Recovery*, Brussels: Divided Publishing, 2021, pp.151–3.
    在两件完全相同的瓷砖作品中（均以信的形式呈现），萨格里写道：“我不会吃资本主义的范式，即生存在某点能够生活。”这种说法的解读之一是，对反对者运动所涉及的生存政治的反击，而是“生存”既被物化也被浪漫化为西方当代人的绝对诚实，这存在于主流意识形态和文化批判话语的全部之中（“隐藏文化”，“危机常态化”）。如果说“脆弱”（precarious）是一个早期的流行词，似乎为过度排斥阶层之间提供了团结的可能性，那么“生存”这一术语的去魔幻化倾向于占据任何政治维度。我将在即将出版的长篇研究中进一步探讨这一点。“危机常态化”是由劳伦·伯兰特（Lauren
    Berlant）在《残酷的乐观》中提出的，Durham and London University Press, 2011。

    - 3 Georgia Sagri, ''Case/L'', Kunststelle Friart, Fribourg, Switzerland, 2022年6月10日至7月3日。

    - 4 G. Sagri, ''Spiritual anarchism'', in *Stage of Recovery*, op. cit., pp.151-3.

    - 5 作为愤怒的入侵物种，雅典的水葫芦（正如我从艺术家交流时所学）可以被视为展览舞台上的另一个“破坏性角色”。正如“生存”等其他显而易见的术语一样，“入侵”这一标记具有高度的歧义。正在进行的科学辩论一方面面临着“否定论”的指控，另一方面面临着“本土主义”，这显示了本土/外来主题如何涵盖并投影到生态话语中——生态法西斯长期以来一直在强调这一点。

    - 6 G. Sagri, *Stages of Recovery*, op. cit., p.79.

    - 07 Karl Marx “时间就是一切，我无一所有；他最多只是时间的尸体。”《贫穷》，1847年，可访问 https://www.marxists.org/archive/marx/works/1847/poverty-philosophy/ch01b.htm
    (最后访问于2022年10月4日)。

    - 08 Gilles Deleuze, Spinoza: Practical Philosophy (trans. Robert Hurley), San
    Francisco: City Lights, 1988, 引自 G. Sagri, ''Practical Patologies'', Case_L, Freiburg
    : Kunsthalle Friart, p.19.

    - 09 最近在柏林一家医院的经历——治疗室墙上挂着康丁斯基和卢梭-莱特克的线条褪色印刷品——可能引发了这些反思

    - 10 W. Benjamin, ''Diary Entries, 1936'', 1938年3月6日，载 Howard Eiland and Michael
    W. Jennings (编.), Walter Benjamin. Selected Writings, Volume 3, 1935–1938, Cambridge
    MA and London, The Belknap Press of Harvard University Press, 2002, pp.335–36.

