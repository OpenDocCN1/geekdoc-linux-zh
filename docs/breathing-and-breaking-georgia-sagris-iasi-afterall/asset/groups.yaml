    conception is instead the body as a condenser and amplifier of social, structural
    and impersonal forces. This is the conception that traverses performance and therapy
    for her. The body as the basic material where these forces can be disclosed, externalised
    and worked through thought: a politics of subjectivity that redefines the ontology
    of becoming collective and the resistance this redefinition is able to power.
    With its strenuous, cyclical temporality, this work emphasises spectacle. Since
    no one can view the performance in full, it makes an incision in the self-evidence
    of the performative body generating an experience to be consumed. Like the labour
    body, it is instead counted by time, the time that elapses and time’s analogue
    in the husk-cooon-igloo, the object that exists alongside and apart from it, is
    itself a product of labour.


    The formalisation of a therapeutic process as a condensation of the power it can
    generate, its uncontrollable affects and energies, took another turn on the ground
    floor, where the room-size installation of drawings (all produced in 2020) generated
    from several IASASI drawings were installed, hanging banner-style from the ceiling.
    These were the public registrations of a process that has in recent and upcoming
    instances taken the form of one-on-one encounters in the exhibition space, literally
    on a raised podium called the Stage of Recovery. Here the large multi-media drawings
    at first appeared like body imprints, filled in visual phenomena as lines and
    dots could be taken as coded tracing pain points, or results of specific movements
    undertaken in each event of treatment. These visual-material elements are typical
    of the approach Sagri has developed doing IASI, which is predicated on finding
    the location in the body where the harm or pain is felt, and then finding a method
    in breath or movement to address it. This is one level of formalisation which
    can be deemed ‘performative’, while the drawings are another, and feed back into
    the treatment process–the representational. Session dates, times, and symptoms
    are indicated in the titles of the drawings. All stem from Case_L, which gives
    its title; an encounter with someone experiencing acute panic attacks. These work,
    with the performance and sculptures and the paintings that circumscribe the room
    I will come to next, in their various ontologies as medical notes, performance
    scores, and ‘autonomous’ drawings, in their mixed being as documentation (something
    that happened at another time and place) a dazzling immense, seems to register
    the compelling friction Sagri generates from this evolving therapeutic practice,
    its somatisations and externalisations rooted in a radical anti-capitalist and
    anti-patriarchal worldview, and the gradual habitation of many corners of the
    contemporary art complex in later years by discourses around care. We witness
    institutional care, self-care, the politics of care, and their more and less concrete
    adoptions thematically and, less often, programmatically. For Sagri and IASI,
    the emphasis on recovery is its integration into a praxis of refusing lifelong
    as reconciliation. This requires a view of the totality of experience in which
    the need to reproduce social and biological life cannot be disentangled from a
    saturation with the toxic effects of life. It is an approach to therapy that attends
    to a systematic ecology as well as a politics of what it takes to live in'
