    without I start to imagine a process of therapy where my doesn''t wander to a
    generic print on the page of a doctor''s office but where part of the therapy
    is understanding in a geophysical site that is both the interior and the milieu
    for my. 09 Another passage in Benjamin, from a dream diary: ''I found myself standing
