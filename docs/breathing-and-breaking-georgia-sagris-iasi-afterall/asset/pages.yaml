  md: '# Afterall


    # Breathing and Breaking. Georgia Sagri’s IASI


    ![](img/edefbf950d524c377ff438833ac0a686_0_0.png)


    Georgia Sagri, ''Case_L'', Installation View, Kunsthalle Friart, Fribourg, 2022.
    Photo: Stathis Malamakis. ©Georgia Sagri.


    Essay


    Publish date: 24 aug 2022


    Written by Marina Vishmidt'
  merge: -1
  img_proc: true
- pgno: 1
  md: 'Critic and theorist Marina Vishmidt discusses Georgia Sagri’s IASI practice
    of self-care and recovery, paying special attention to the conceptual and material
    trajectories of this specific healing practice and the translation of such therapeutic
    approaches into gestural languages.


    ![](img/edefbf950d524c377ff438833ac0a686_1_0.png)


    Georgia Sagri, Food Disorder, Treatment, October 15th, 2020, Installation View,
    Kunsthalle Friat, Fribourg, 2022.

    Photo: Stathis Mamalakis.


    Where others encounter walls or mountains, there, too, he sees a way. [...] No
    moment can know what the next will bring. What he reduces to rubble – not for
    the sake of rubble, but for that of the way leading through it. 01


    She is breaking the door. She is not talking about it. 02


    The arc of Georgia Sagri’s work, and what has been involved in, is enormous, and,
    based on the criteria brought to bear in the analysis of it, illimatable at first
    sight. So, this essay will focus primarily on the exhibition ‘Case_L.’ staged
    over the summer at'
  merge: -1
  img_proc: true
- pgno: 2
  md: 'Kunsthalla Friart. 03 The exhibition, departure from other recent projects
    such as ‘IASI’ at Mimosa house in late 2020 or her participation in this autumn’s
    ‘YOY!! Care, Repair, Heal at the Gropius Bau, does not take the form of a one-to-one
    process of guided somatic therapy, but is instead a multi-mode, synthetic anthology
    of the IASI (recovery) practice she has been developing, with paintings, drawings,
    sculpture, live performance and a parallel programme. This introduces the idea
    of attempted healing by ‘recovery’ not just as a goal, narrated by Sagri as the
    sharing of her own experience of mediating the arduous effects of performance
    pieces and political engagement on her total life, but a conceptual framework,
    a worldview and an aesthetics, conceived as ‘education of the senses’ by the artist
    and an activation of the body towards psycho-physical recovery and political resistance.


    A striking characteristic of the work presented at Friart is that the viewer experiences
    it as an object and a passage at the same time, evoking the ‘spiritual anarchism’
    Sagri identifies with her recent collection of writings and resonates with Walter
    Benjamin’s short, gnomic essay cited in the epigraph. How did this concretely
    unfold in the work brought together at Friart? 04 Beyond, rather rather, to this
    question is another: what is the relation of the IASI work as performed within
    an art context and what distinguishes this practice, and its multiple iterations,
    from other therapeutic approaches that operate according similar techniques but
    from within spaces for therapy? And perhaps before an answer is attempted, it
    needs to be turned around – what if the practice is the preconditions that make
    it possible, and all aesthetic and conceptual rationales for its appearance and
    its enactment are to be sought in that preconditionality? In other words, the
    point here may be less to discern why therapeutic practices unfold in an art institutional
    context and some elsewhere, but how the folding of a performative practice as
    well as political engagement into the preconditions of their (human, somatic)
    possibility becomes the gesture made in the art field, how conditions are made
    to eclipse the ‘object’ and supplant it – even as the practice continues and develops
    elsewhere in between, and at the same time. The question, turned in any of its
    significant directions, is crucial, and yet not the focal point in ‘Case_L’, which
    seems to be more interested in the conceptual and material trajectories of a specific
    healing practice or their translation into gestural languages that it is in the
    embodied displacement of such practices into an art context.'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'Georgia Sagri, ''Case_L'', Installation View, Kunstthalle Friart, Fribourg,
    2022. Photo: Stathis Mamalakis. ©Georgia Sagri.


    This displacement was enacted by each work in its own way. Shelter Refuge (2022)
    refers both to the ongoing, day-long performance and the hulking, convex shelters,
    woven of water hyacinths and other grasses (Shelter_Refuge I; Shelter_Refuge II,
    2022) that sat in the upstairs space and provided the focal point to the movements
    of Sagri in the space and the occasional collaborator, as well as the viewers
    at the room''s perimeter following the action. 05 They offered the cleanest emblem
    of the double exposure between object and passage – a superposition, not a vacillation
    – in their performance at the same time as sculptural presences, and as tunnels
    through or obstacles around which Sagri’s activities flowed. During the times
    that this activity included vocalization, they turned into singing caves, as she
    was not visible in every location in the space. Sagri undressed and horizontal
    exits and entries into pods unavoidably evoked birth and death, two kinds of traumatic
    passage whose metaphorical dimension recur in both performance practice and forms
    of therapy – rehearsals of emergence and extinction power is guaranteed by formalisation,
    or containment. This becoming-object as a passage is complemented, from the opposite
    side, Sagri’s understanding of performance as a medium, in the sense of material
    but also in the sense of channelling, which radically modifies the functioning
    of the body, inaugurating a new relationship with representation’ 06 Although
    such a use of medium can be easily linked to therapy, or a mystified version of
    it – a channelling of healing forces, for example – the crucial element in Sagri’s'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'conception is instead the body as a condenser and amplifier of social, structural
    and impersonal forces. This is the conception that traverses performance and therapy
    for her. The body as the basic material where these forces can be disclosed, externalised
    and worked through thought: a politics of subjectivity that redefines the ontology
    of becoming collective and the resistance this redefinition is able to power.
    With its strenuous, cyclical temporality, this work emphasises spectacle. Since
    no one can view the performance in full, it makes an incision in the self-evidence
    of the performative body generating an experience to be consumed. Like the labour
    body, it is instead counted by time, the time that elapses and time’s analogue
    in the husk-cooon-igloo, the object that exists alongside and apart from it, is
    itself a product of labour.


    The formalisation of a therapeutic process as a condensation of the power it can
    generate, its uncontrollable affects and energies, took another turn on the ground
    floor, where the room-size installation of drawings (all produced in 2020) generated
    from several IASASI drawings were installed, hanging banner-style from the ceiling.
    These were the public registrations of a process that has in recent and upcoming
    instances taken the form of one-on-one encounters in the exhibition space, literally
    on a raised podium called the Stage of Recovery. Here the large multi-media drawings
    at first appeared like body imprints, filled in visual phenomena as lines and
    dots could be taken as coded tracing pain points, or results of specific movements
    undertaken in each event of treatment. These visual-material elements are typical
    of the approach Sagri has developed doing IASI, which is predicated on finding
    the location in the body where the harm or pain is felt, and then finding a method
    in breath or movement to address it. This is one level of formalisation which
    can be deemed ‘performative’, while the drawings are another, and feed back into
    the treatment process–the representational. Session dates, times, and symptoms
    are indicated in the titles of the drawings. All stem from Case_L, which gives
    its title; an encounter with someone experiencing acute panic attacks. These work,
    with the performance and sculptures and the paintings that circumscribe the room
    I will come to next, in their various ontologies as medical notes, performance
    scores, and ‘autonomous’ drawings, in their mixed being as documentation (something
    that happened at another time and place) a dazzling immense, seems to register
    the compelling friction Sagri generates from this evolving therapeutic practice,
    its somatisations and externalisations rooted in a radical anti-capitalist and
    anti-patriarchal worldview, and the gradual habitation of many corners of the
    contemporary art complex in later years by discourses around care. We witness
    institutional care, self-care, the politics of care, and their more and less concrete
    adoptions thematically and, less often, programmatically. For Sagri and IASI,
    the emphasis on recovery is its integration into a praxis of refusing lifelong
    as reconciliation. This requires a view of the totality of experience in which
    the need to reproduce social and biological life cannot be disentangled from a
    saturation with the toxic effects of life. It is an approach to therapy that attends
    to a systematic ecology as well as a politics of what it takes to live in'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'that world. Such a systematic, or social, ecology can be said to also characterise
    the more recent engagements with debates ‘care’ in the space of art. Surely, from
    this year’sa to the previously named ‘YOYI!’ festival – whose curatorial concept
    makes space for ‘disavowing’ as well as ‘perpetuating’ notions of healing – such
    projects entails a careful and contextual attending to their material conditions
    and what it means either to formulate or translate them by artistic means. Such
    an understanding, however, is already at work in Sagri’s vision of a body as a
    ‘sequence of complex relations which develop within a varied momentum, between
    decelerations and accelerations of different acts and behaviours’, drawing on
    Gilles Deleuze’s analysis of Spinoza. ⁸ There is then an emphasis on breath, voice
    and movement to push past the suffocation of image-bodies and performing bodies
    which form the inescapable realism of ‘survival’ in the world of capital where
    we all work. The notion of ‘breaking the door’ rather than talking about it seems
    apt here. Knocking on the door would be the exhausting petition to power; breaking
    it means to move into another landscape shaped by (personal, collective) movement,
    which starts from finding a new way for your body to move and live.


    ![](img/edefbf950d524c377ff438833ac0a686_5_0.png)


    Georgia Sagri, Early Morning, Cool Passage, Cave, Organ, Installation View, Kunstthalle
    Friart, Fribourg, 2022. Photo: Stath Malamakis. ©Georgia Sagri


    With landscape, then, to conclude. The six enigmatic, smallish egg tempera paintings
    placed on the walls surrounding the drawings – Early morning, cool passage, cave,
    organ and three.'
