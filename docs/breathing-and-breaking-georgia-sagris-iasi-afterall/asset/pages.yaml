    # # Footnotes


    +   1 Walter Benjamin, ''The Destructive Character'', Frankfurter Zeitung, 20
    November 1931, available at https://libcom.org/library/destructive-character-walter-benjamin
    (last accessed on 4 October 2022).

    2 Georgia Sagri, *Stage of Recovery*, Brussels: Divided Publishing, 2021, pp.151–3.
    In the second of identically tiled pieces, both presented as letters, Sagri writes,
    ''I am not going to eat the capitalist''s paradigm that survival will be able
    to live at some point.'' One of the ways this can be read is a pushback not the
    politics of survival at issue for movements of the opposed, but the ''survival''
    is both reified and romanticised as the absolute honesty of contemporary in the
    West, in mainstream ideology and cultural-critical discourse alliske (''hidden
    culture'', ''crisis ordinariness''). If precarious was an earlier buzzword that
    seemed to offer a possibility of solidarity between the strata of the hyper-excluded,
    the category of ''survival'' as a term disenchantment tends to occupy any political
    dimension. I explore this further in an upcoming book-length study. ''Crisis ordinariness''
    was coined by Lauren Berlant in *Cruel Optimism*, Durham and London. University
    Press, 2011.

    3 Georgia Sagri, ''Case/L'', Kunststelle Friart, Fribourg, Switzerland, 10 June–3
    July 2022.

    4 G. Sagri, ''Spiritual anarchism'', in *Stage of Recovery*, op. cit., pp.151-3.

    5 As the outraged invasive species, the water hyacinth in Athens (as I learned
    in conversation with the artist) can be deemed another ''destructive character''
    in the mise-en-scène of the show. With, as with others ostensibly self-evident
    terms such as ''survival'', the designation ''invasive'' is highly equivocal.
    The ongoing scientific debate is touched by charges of ''denialism'' on the one
    hand and ''nativism'' on the other, showing how the topics of native/alien both
    encompasses and is projected into ecological discourse – a point that eco-facism
    has been underlined for a long time.

    6 G. Sagri, *Stages of Recovery*, op. cit., p.79.'
