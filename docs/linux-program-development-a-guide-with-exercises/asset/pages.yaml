  md: '# JOURNLLING FILESYSTEMS


    and a minor number (unit). Note that a device node requires a small amount of
    disk space for the inode, but operates no data blocks.


    **Reserved Space:** Usually, 5 percent of the blocks (usually 4 KB in size) are
    reserved for root, with screw-ups where filesystem gets filled by a user (This
    allocation can be changed with the tune2fs utility, without reformatting the filesystem).


    **State:** A field in the superblock indicates "Clean," "Not Clean" or "Erroneous."
    Used to see if fck should be run at boot.


    **Physical Structure:** Details of the disk structure can be viewed with the dumpe2fs
    utility. The structure looks like:


    +   - Boot Sector — Block Group 1 — Block Group 2 — ... Block Group N —

    Each block group looks like:


    | Super Block | Group Descriptors | Data Block Bitmap | Inode Bitmap | Inode Table
    (n blocks) | Data Blocks (n blocks) |

    | --- | --- | --- | --- | --- | --- |


    Figure 9.1: ext3 filesystem layout


    The superblock and filesystem descriptors are redundant in multiple block groups,
    which is great for safety. (Note block groups may not be tied to physical layout
    of the disk)

    mkfs.ext2, mkfs.ext3** makes the filesystem. Checking the filesystem is done with
    fck.ext2, fck.ext3. **De-fragmentation** is generally necessary nor not recommended.
    **fdisk** is the partitioning program; use with great care!


    You can shrink or expand a partition with **resize2fs**, but be careful as it
    does not change the actual partition table; see the **man** page for details about
    how to do this in concert with fdisk. There are good graphical utilities, such
    as **gparted** which can reliably take care of the complications. Additionally
    many parameters can be reset or tuned after filesystem creation with the program
    **tune2fs**.


    # 9.4 Journaling Filesystems


    **Journaling** files recover from system crashes or ungraceful shutdowns with
    little or no corruption, and they can do so rapidly. While this comes at the price
    of having some operations to do, additional enhancements can more than offset
    the price.


    In a journaling filesystem operations are grouped into **transactions**. A transaction
    must be completed without error, **atomically**; otherwise the filesystem is not
    changed. A log file is maintained of transactions. When an error occurs usually
    only the last transaction needs to be examined.'
  merge: -1
