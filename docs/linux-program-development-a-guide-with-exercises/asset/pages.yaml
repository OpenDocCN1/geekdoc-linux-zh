- img_proc: true
  md: 'The following five journissystems are freely available under Linux:


    +   - The ext3 filesystem is an extension of the ext2 filesystem.


    +   - The ext4 filesystem is an extension of the ext3 filesystem, and was included
    in the mainline kernel as an experimental branch, and as a stable feature in the
    kernel 2.6.28. Features includes extents, 48-bit block numbers, and up to 16 TB
    size.


    +   - The Reiser filesystem was the first journalling implementation in Linux,
    but has lost its leadership and development has stalled.


    +   - The JFS filesystem is a product of IBM and has been ported from IBM''s AIX
    operating system.


    +   - The XFS filesystem is a product of SGI and has ported from SGI''s IRIX operating
    systems. The main home page is http://oss.sgi.com/projects/xfs.


    # 9.5 The ext4/ Filesystem


    The ext4 filesystem had its experimental design with the 2.6.28 kernel release.
    Pre-existing ext3 partitions can be migrated to ext4 without risk; the new features
    will only be used in subsequent file system operations. However, one cannot safely
    go back to ext3 at a later time.


    Maximum filesystem size has been increased to 1 EB from 16 TB, and maximum file
    size up to 16 TB from 2 TB. These limits arise from the 48-bit addressing that
    is used; full 64-bit addressing is probable in the future but not really needed
    at this point. The number of subdirectories, which was limited to 32 K, now has
    no limit.


    Large files are now split into extents as large as possible, instead of using
    indirect block mapping. In addition, multiblock allocation can allocate space
    all at once instead of one block at a time. Delayed allocation can also increase
    performance.


    One immediately obvious improvement is fast fsck. The speed of a filesystem check
    can easily go up by an order of magnitude or more.


    There are some other features which introductory documentation can be found at
    http://kernelnewbies.org/Ext4.


    In order to use ext4 you need a kernel for which it is compiled, and the newer
    version of the e2fspros utilities in order to have utilities including mkfs.ext4,
    fsck.ext4, elabel, tune4fs, dump4s, etc. Most recent Linux distributions have
    already taken this step. Depending on the distribution one may have to install
    e4fsspro, or the e2fsprogs package may have been updated to handle ext4.'
  merge: -1
