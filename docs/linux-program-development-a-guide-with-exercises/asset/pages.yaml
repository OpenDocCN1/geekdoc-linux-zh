- img_proc: true
  md: '# CHAPTER 4. MAKE


    One should note, however, there are other versions of make, including-GNU vendor-supplied
    versions, and similarly named systems such as imake and CMake which are sometimes
    used in particular projects.


    Upon invocation make looks for a file name Makefile; if it fails it looks for
    Makefile. It scans the make for rules and dependencies and then adds its built-in
    rules (These names can be overridden with the -f option).


    The version of make overrides these rules and will give the highest priority to
    a file named GNUmakefile, which is intended to be used only on systems which fully
    support all the GNU extensions to the conventional make program.


    Suppose you have a program with several source files which must be compiled and
    linked. A trivial Makefile might look like:


    ```

    foobar: main.c sub1.c sub2.c

    gcc -o foobar main.c sub1.c sub2.c

    ```


    Simply typing make will compile foobar. If typed again nothing will happen because
    foobar is up to date. If main.c is modified, a subsequent invocation of make will
    cause re-compilation.


    NOTE: The action lines must start with a TAB (also bound to Ctrl-I in emacs and
    vi) not blank space!


    It is possible to use make even without a Makefile, as there are built-in implicit
    rules for creating files with certain extensions. For example if a directory main.c
    and sub.c, typing


    make main sub.o


    produces


    ```

    cc -o main.c

    cc -c sub.c

    ```


    The automake and autoconf utilities can be used to generate makefiles across a
    wide variety of platforms and compilers. You have been using these facilities
    every time you download an application in source form, and then run the command
    ./configure to generate themakefile. If you need to prepare software for wide
    distribution, familiarity with how to use these utilities may be a worthwhile
    investment of your time.


    # 4.2 Building large projects


    A non-trivial project may have the following complications and others:


    +   - The source may need to be in a number of different directories.


    +   - The source may need to be compiled on different platforms.


    +   - The source may need to be compiled with different options.'
  merge: -1
