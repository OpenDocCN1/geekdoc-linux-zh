- img_proc: true
  md: "# 28.8 LABS\n\nThis is a very common and well established model; it permits\
    \ the server handle many clients once.\n\nHowever, creating a process is not a\
    \ cheap operation. It makes sense when there is a significant amount of work to\
    \ do for each client, and/or when the length of time the client process might\
    \ require the server to be lengthy. Often the client request may be short lived\
    \ or trivial.\n\nIn this case, the concurrent server can be implemented in terms\
    \ of a multi-threaded model, in which the children are so-called light weight\
    \ processes, or LWPs.\n\nIn this kind of multi-threaded parallel implementation,\
    \ the sibling processes all share the same file descriptor space, memory, signal\
    \ handlers and other attributes. This multi-threading may be the way to go when\
    \ the child needs to communicate back to the parent after processing the request,\
    \ perhaps by making the data available.\n\nA code fragment showing how a multi-threaded\
    \ concurrent server using the Posix Threads library might look like:\n\n```\n\
    /* Do not forget to compile with -pthread */\n\n#include <pthread.h>\n\ns = socket(...);\n\
    ...\nlisten(...);\nfor ( ; ; ) {\n  cd = accept(...);\npthread_create(&thr[cd],\
    \ NULL, handle_the_client, &Data[cd]);\npthread_detach(&thr[cd]);\n}\n...\n```\n\
    \nWhen the thread is started up, it will execute the handle_the_client() function.\
    \ Note it doesn't do a close() on the socket descriptor; threads share their descriptor\
    \ space and would close it in the server too! Obviously, some care is required\
    \ that the threads don't get in each other's way.\n\n# 28.8 Labs\n\n# Lab 1: I/O\
