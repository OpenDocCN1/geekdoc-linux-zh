    # 12.1 What is a Process?


    A process is an instance of a program in execution. It may be in a number of different
    states, such as running, sleeping, etc.


    Every process has a **pid** (Process ID), a **ppid** (Parent Process ID), and
    a **pgid** (Process Group ID). In addition every process has program code, data,
    variables, file descriptors, and an environment.'
