    | EACCES | No write access for newpath directory. |

    | ENAMETOOL | newpath directory improper of dangling, or oldpath is an empty string.
    |

    | ENOTDIR | newpath is not a directory. |

    | ENOMEM | Insufficient memory available. |

    | EROFS | newpath is on a read-only filesystem. |

    | EXIST | newpath already exists. |

    | E | Too many symbolic links. |

    | ENOSPC | No room for the directory entry on the device. |

    | EIO | I/O error occurred. |

    | EXDEV | oldpath and newpath are not on the same filesystem. (link() only). |

    | EMLINK | File referred to by oldpath already has too many links. (link() only).
    |


    readlink places the contents of the symbolic link path in buf, returning the number
    of characters placed in buf. Error returns are similar to those of symlink().


    unlink removes a file. If the name is a symbolic link, the link is removed but
    not the underlying file. If the name is a link to a file being used, the file
    will not be deleted until the last file descriptor referring to it is closed.
    On success 0 is returned, on error -1 with errno. Error returns are similar to
    those for link().


    # chmod(), chown()


    These functions change the ownership and permission of filesystem entries.


    ```

    #include <sys/types.h>

    #include <sys/stat.h>

    #include <unistd.h>

    ```


    ```

    int chmod (const char *path, mode_t mode);

    int chown (const char *path, uid_t owner, gid_t group);

    ```


    chmod() changes the permissions on path. According to mode, which carries the
    possible values we discussed in reference to the (stat()) functions.


    own() changes the ownership on path. The superuser can change the owner; any user
    can change the group on a file they belong to another group they belong to. Using
    -1 for either the owner or group ID makes no change for component.


    One can also use fchmod (int fd, mode_t mode) and fchown (int fd, uid_t owner,
    gid_t group), which differ only in that a file descriptor is used instead of a
    path name. lchown() differs only in that it does not follow symbolic links.'
