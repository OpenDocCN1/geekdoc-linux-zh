    \ | The socket has hung up. |\n| POLLINVAL | Invalid descriptor |\n\nThe return\
    \ value of poll() is the number of structures which have non-zero values in their\
    \ revents elements. A value of 0 implies the call timed out, and a value of -1\
    \ indicates an error (including EINTR, which means a signal has occurred).\n\n\
    # Example:\n\n```\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
    #include <fcntl.h>\n#include <sys/poll.h>\n\nint main (void) {\n    struct pollfd\
