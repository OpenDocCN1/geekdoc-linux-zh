    # 24.3 listen()


    The listen() function is called only by a server. It is called after bind() and
    moves the socket into a passive state; i.e., the kernel should accept connections
    directed to this socket.

    The prototype of the function looks like:


    ```

    #include <sys/socket.h>

    ```


    ```

    int listen(int sd, int backlog);

    ```


    Only sockets of type SOCK_STREAM and SOCK_SEPACKET can utilize the listen() call.

    The first argument, sd, is a socket descriptor as obtained from socket(). The
    second parameter, backlog, is the number of connections allowed on the incoming
    queue.

    Exactly what this means has varied from one operating system to another. In particular
    two queues are maintained:


    +   - The **complete** connection queue contains entries for each client with
    whom the full handshake has been established.

    - The **incomplete** connection queue contains entries for each client for which
    the process is not yet complete.


    Under **Linux** the backlog parameter describes only the length of the **complete**
    connection queue. The maximum length of the **incomplete** connection queue can
    be read (or set by a super-user) by examining /proc/sys/net/ipv4/tcp_max_backlog.

    If CONFIG_SOCKET is set as a kernel configuration option, a socket will be protected
    from overload when too many connection attempts are made; clients can no longer
    detect an overloaded machine in this circumstance. Thus, denial of service through
    congestion is side-stepped. The maximum value is no longer effective and packets
    do not get dropped. See the **man** page for **tcp** for details.

    On success listen() returns 0, and the possible error returns are:


    Table 24.2: listen() error return values


    | Error | Meaning |'
