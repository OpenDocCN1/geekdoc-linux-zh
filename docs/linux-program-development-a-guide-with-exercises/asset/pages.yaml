- img_proc: true
  md: 'In some cases the above protocols are not fully implemented under Linux but
    space has been reserved for them in the table of communication domains.


    The most important ones (which we will concentrate on) are: PF_LOCAL (PF_UNIX),
    for Unix domain sockets local to the machine, and PF_INET, PF_INET6 for IP (Internet
    Protocol) versions 4 and 6.


    Note that all these domains can be referred to by the prefix AF_ in place of PF_,
    where AF stands for Address Family and PF stands for Protocol Family. Historically,
    the possibility was left open for a protocol family supporting multiple addresses.
    However, this has never happened, so you can use either form, strictly speaking
    you should be using the PF-prefixed values for the socket() function.


    The second argument to the socket() call is the type of socket and is enumerated
    in the same header file as the name:


    # Table 23.2: Socket types


    | Type | Value | Meaning |

    |---|---|-|

    | SOCK_STREAM | 1 | Sequenced, reliable, two way connection based on byte stream,
    as TCP. Out-of-band data transmission may be supported |

    | SOCK_DGRAM | 2 | Connectionless unreliable domains: messages of fixed maximum
    length, no guarantee of delivery or ordering |

    | SOCK_RAW | 3 | Raw network protocol interface, only for super-user |

    | SOCK_RDM | 4 | Reliably delivered messages, but ordering guaranteed |

    | SOCK_SEQPACK | 5 | Sequenced, reliable, two-way connection-based datagrams of
    maximum length. Every packet must be read with each reading system call. Not supported
    with PF_INET |

    | SOCK_PACKET | | Linux-specific; get packets at the device level, used for rar
    and some other things. Considered obsolete; from Linux 2.0 kernels |


    Not all combinations of domain and type are valid.


    The most frequently used ones are SOCK_STREAM (used in TCP) and SOCK_DGRAM (used
    in UDP) of which may be used in combination with PF_INET(6).


    The third argument to socket(), protocol specifies which protocol to use with
    the socket; normally there is only one kind of protocol provided for each protocol
    family, and a value of 0 passed to socket() selects that default. However, raw
    sockets have some other possibilities.


    A common misunderstanding is to simply equate SOCK_STREAM with TCP and SOCK_DGRAM
    with UDP. While in practice this assumption is generally a good one, the protocol
    argument to socket() actually specifies the choice; using zero gets the most common
    default behaviour.


    The possible error returns to socket() are:


    # Table 23.3: socket() error return values


    | Error | Meaning |

    |---|-|'
