  md: '# Chapter 27


    # Netlink Sockets


    ![](img/f604778e5fd8b5339b52bd5345099d26_236_0.png)


    We''ll discuss the use of **netlink** sockets, explaining what they are, how to
    connect to them, and how to send messages through them.


    +   27.1 What are netlink Sockets? . . . . . . . . . . . . . . . . . . . . . .
    . . . . . . 213

    27.2 Opening a netlink Socket . . . . . . . . . . . . . . . . . . . . . . . .
    . 214

    27.3 netlink Messages . . . . . . . . . . . . . . . . . . . . . . . . . . 215

    27.4 Labs . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 217


    # 27.1 What are netlink Sockets?


    **Netlink** sockets provide a convenient method of transferring information between
    the kernel and user-space, or between various kernel subsystems.


    Because they use the well established socket infrastructure they afford a relatively
    safe and well known interface, which is often preferable to either old-fashioned
    methods such as **ioctl** commands, or the use of various pseudo-filesystems,
    such as **proc** or **sysfs**.


    **Netlink** sockets are most often used for network system administration and
    monitoring. For instance they provide flexible advanced methods for controlling
    firewalls and routing.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# CHAPTER 27. NETLINK SOCKETS


    The messages transferred are datagrams, and as with UDP this is not a reliable
    protocol. This means if a message cannot be delivered (perhaps due to a lack of
    required memory) it is dropped. It is up to the sender and recipient to handle
    proper acknowledgments of receipt and resending.


    A message consists of a byte stream with one or more headers (described by nlmsghdr
    data structures), together with a data payload. We''ll discuss details.


    Messages are sent with the send() and sendmsg() standard socket library functions,
    and are received by the recvfrom() and recvmsg functions.


    For an excellent description and tutorial on working with netlink see http://people.redhat.com/norman/papers/netlink.pdf
    by Neil Horman at Red Hat.


    Applications using netlink sockets can be made using libnl, a library providing
    an interface for raw netlink messaging and various netlink family specific interfaces.
    It can be downloaded with documentation from http://people.suug.ch/tgr/libnl/


    # 27.2 Opening a netlink Socket


    One creates a netlink socket in the usual way:


    ```

    #include <linux/types.h>

    #include <sys/socket.h>

    #include <linux/netlink.h>

    ```


    ```

    netlink_socket = socket (PF_NETLINK, type, netlink_family);

    ```


    The type should be SOCK_RAW. The kernel will accept SOCK_DGRAM as well, but will
    not distinguish between them.


    The last argument, netlink_family, is what is usually what is described as the
    protocol in the general(socket) system call, it can be confusing.


    netlink_family can be one of the following:


    Table 27.1: Netlink families


    | netlink_family | Description |

    |---|---|

    | NETLINK_ROUTE | Receive packets and modify the routing table. (IPv4) |

    | NETLINK_SKIP | Reserved for ENskip. |

    | NETLINK_USERSOCK | Reserved for future user-space protocols. |

    | NETLINK_FIREWALL | Receive packets for firewall code. (IPv4) |

    | NETLINK_TCPDIAG | For monitoring TCP sockets. |

    | NETLINK_NFLOG | For netfilter and iptables logging. |

    | NETLINK_ARP | Manage the ARP table (Address Resolution Protocol). |

    | NETLINK_ROUTE6 | Receive packets and modify the routing table. (IPv6) |

    | NETLINK_IP6_FW | Receive packets for firewall code. (IPv6) |

    | NETLINK_DRTMSG | Decnet routing messages. |

    | NETLINK_TAPBASE | 16 instances of the ethertap device, a pseudo-network tunnel
    device |

    | NETLINK_TAPBASE+15 | for simulating an Ethernet driver. |'
  merge: -1
  pgno: 237
- img_proc: true
  md: "# 27.3. NETLINK MESSAGES\n\nNote that the list of families in the man page\
    \ for netlink is out of date.\n\nThe usual network system calls as connect() and\
    \ bind() require a pointer to an address structure generically cast to the type\
    \ struct sockaddr . For netlink sockets the actual address structure:\n\n```\n\
    struct sockaddr_nl\n{\n    sa_family_t nl_family;     /* AF_NETLINK */\n    unsigned\
    \ short nl_pad;      /* zero * */\n    pid_t               nl_pid;      /* process\
    \ pid * */\n    u32                 nl_groups;   /* multicast groups mask */\n\
    };\n```\n\nwhere nl_family is always AF_NETLINK and nl_pad is for internal kernel\
    \ use and should not be modified.\n\nThe process owning the socket is described\
    \ as nl_pid; the sending process should set this field. The kernel sets this to\
    \ describe the process to receive the message, or to zero for either multicast\
    \ messages or destined for internal delivery.\n\nThe nl groups field is used for\
    \ multicasting. It is a bit-mask describing 32 multicast groups it may wish to\
    \ listen to; by default the bits are all cleared. Each protocol family has its\
    \ own set of 32 multicast groups.\n\n# 27.3 netlink Messages\n\nA netlink message\
    \ is described by the following nlmsghdr data structure:\n\n```\nstruct nlmsghdr\n\
    {\n    u32               nlms_len;    /* Length of message including header *\
    \ */\n    u16               nlms_type;   /* Message content * */\n    u16    \
    \           nlms_flags;  /* Additional flags * */\n    u32               nlms_seq;\
    \    /* Sequence number * */\n    u32               nlms_pid;    /* Sending process\
    \ PID * */\n};\n```\n\n```\nstruct nlmsgerr\n{\n    int               error;\n\
    \    struct nlmsghdr msg;\n};\n```\n\nNote that the data payload directly follows\
    \ the message, and nlms_len describes the full length including the header.\n\n\
    The type of message is indicated by nlmsg_type"
  merge: -1
  pgno: 238
- img_proc: true
  md: "# Table 27.2: Netlink message types\n\n| Message Type | Description |\n|---|---|\n\
    | NLMS_NOOP | Ignore the message. |\n| NLMS_ERROR | The message signals an error;\
    \ the payload contains a nlmsgerr data structure describing it. |\n| NLMS_DONE\
    \ | The message is the terminator of a multipart message. |\n| NLMS_OVERRUN |\
    \ Signals data was lost. |\n\nIn addition each netlink family (or protocol) has\
    \ other types relevant only to it.\n\nThe nlmsg_flags can also have protocol dependent\
    \ values, as well as a bit mask of the following standard values:\n\n```\n#define\
    \ NLM_F_REQUEST 1  /* It is request message. */\n#define NLM_F_MULTI 2  /* Multipart\
    \ message,\n  terminated by NLMS_DONE */\n#define NLM_F_ACK 4      /* Reply with\
    \ ack, with zero or error\n  code */\n#define NLM_F_ECHO 8    /* Echo this request\
    \ */\n```\n\n```\n/* Modifiers to GET request */\n#define NLM_F_ROOT 0x100  /*\
    \ specify tree root */\n#define NLM_F_MATCH 0x200  /* return all matching */\n\
    #define NLM_F_ATOMIC 0x400  /* atomic GET */\n#define NLM_F_DUMP (NLM_F_ROOT|NLM_F_MATCH)\n\
    ```\n\n```\n/* Modifiers to NEW request */\n#define NLM_F_REPLACE 0x100  /* Override\
    \ existing */\n#define NLM_F_EXCL 0x200  /* Do not touch, if it exists */\n#define\
    \ NLM_F_CREATE 0x400  /* Create, if it does not exist */\n#define NLM_F_APPEND\
    \ 0x800  /* Add to end of list */\n```\n\nnlmsg_seq should be a serial message\
    \ counter, used to aid in correlating acknowledgments. The nlmsg_pid field is\
    \ discussed before.\n\nThe data passed to from netlink sockets should only be\
    \ accessed using the following macros:\n\n# Table 27.3: Netlink macros\n\n| Macro\
    \ | Description |\n|---|---|\n| int NLMS_ALIGNTO | Alignment value (set to 4).\
    \ |\n| int NLMS_ALIGN(size_t len) | Rounds the length of a message for alignment.\
    \ Used internally. |\n| int NLMS_LENGTH(size_t len) | Given the length of the\
    \ ancillary-data, returns the size of the payload plus header, rounded up for\
    \ alignment. Used to set nlmsg_len. |"
  merge: -1
