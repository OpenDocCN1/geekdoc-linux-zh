  md: '# 24.2 bind()


    The socket() function creates a socket, but does not by itself associate with
    either an address, or if necessary, a service port. For this servers need to use
    the bind() function; for clients, address association usually begins with connect()
    (which does something bind()-like under the hood).


    The prototype for bind() is:


    ```

    #include <sys/types.h>

    #include <sys/socket.h>


    int bind(int sd, struct sockaddr *my_addr, socklen_t addr);

    ```


    where the arguments are the same as the connect() function, except the address
    structure, which usually means its value can change. However, in this case Linux
    seems to disagree with the usual function prototype used on other operating systems,
    and indeed you can check that the address is in unchanged.


    One source of confusion is the bind() function is often described as "assigning
    a name" to a socket. In fact, this function has nothing to do with "names" (such
    as cooj.com); it assigns addresses and protocols.


    If one wants to bind a IP address and service port to an Internet server socket
    one would have like:


    ```

    int sd;

    short int port = 50000;

    struct sockaddr_in addr;

    struct in_addr inaddr;


    s = socket(PF_INET, SOCK_STREAM, 0);

    memset(addr, 0, sizeof(addr));

    addr.sin_family = AF_INET;

    addr.sin_port = htons(port);

    addr.sin_addr.s_addr = inet_addr("192.168.1.1");

    ```


    ```

    bind(sd, (struct sockaddr *)&addr, sizeof(struct sockaddr));

    ```


    where in the interest of brevity we''ve used the old-fashioned inet_addr function
    rather than inet_aton(). Also note that we have been careful to zero out the address
    structure before using it and to make sure the service port is placed in proper
    network order.


    However, it is possible to the kernel choose both the service port and IP automatically.
    If we select a service port of 0, the kernel will choose an ephemeral (dynamic)
    one from the available selection. If we desire to know what was picked, we cannot
    examine the address structure after the call to bind(), as we noted it will not
    change. To do this we need something like:


    ```

    struct sockaddr_in check;

    ...

    check_len;


    bind(sd,...), (struct sockaddr*)&check, &check_len);

    printf("selected port %d\n", ntohs(check.sin_port));

    ```'
