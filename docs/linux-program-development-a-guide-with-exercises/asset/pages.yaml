  md: 'While our material will not be very advanced, it will strive to be thorough
    and complete. It worth repeating that we are not aiming for an expert audience,
    but instead for a competent and motivated one.


    Much of what we discuss will apply to any operating system that is Unix-like and
    strives to be Posix-compliant. However, we will discuss many topics that are particular
    to Linux. Mostly this means features and APIs that were written for Linux and
    have not been ported to other operating systems. Sometimes it means the Linux
    interpretation of a standard may have some conflict with other operating systems.


    We will point out when we are discussing Linux-specific material and warn you
    that any applications you develop these features is likely to be non-portable
    to other operating systems.


    # About the Author


    By training I''m a physicist; I have a PhD in theoretical nuclear astrophysics
    and I research on dense nuclear matter, supernova explosions, neutrino diffusion,
    hydrodynamics, shockwaves, general relativity, etc. for a couple of decades and
    published papers, review articles and book chapters in the main physics and astrophysics
    journals. I was on the faculty at a number of major universities and government
    labs.


    I''ve been teaching in one form or for more than 30 years. I''ve taught as well
    as introductory courses on a wide variety of subjects in physics and astrophysics
    at both the undergraduate and graduate level as well as supervised a good number
    of students. I''ve been teaching material such as the present subject matter for
    more than a decade.


    While I never worked primarily as a software or hardware engineer, I''ve used
    and programmed for computers for a long time. The first time I sat down at a computer
    was 1969; the machine was a PDP-9 and the keyboard was an actual typewriter with
    booting done through paper tapes. I''ve used every operating system and programming
    language that has been thrown my way over four decades and fortunately I''ve been
    able to forget about most of them as they became obsolete.


    In 1994 I left academia and entered the business world. I spent the next 5 years
    as a consultant with a major petrochemical company, helping with the geophysics
    and seismic analysis software used for oil exploration and recovery (Equations
    are equations whether they describe nuclei, exploding stars, or seismic waves
    propagating through the layers of the earth).


    During this period I began to use Linux extensively as it was a Unix-like platform
    I could use to develop and debug code which would then run on supercomputer platforms.


    In 1998 a major chips manufacturer employed my employer and asked us to develop
    materials to train a bunch of NT engineers to work with Linux. I was tasked with
    developing materials and teaching from them and I have been doing it since.


    Eventually this project grew into three classes. One was on programming, a second
    was on Linux kernel internals, and the third on Linux device drivers. My company,
    Axian of Beaverton, OR, funded and deployed these classes. Eventually we franchised
    the material out, with some modifications, to various Linux distributors. In particular
    all three classes were used by Red Hat Inc for 10 years as their curriculum for
    Linux developers.


    Over those ten years I personally taught sessions of these classes at least 100
    times and also functioned as the courseware maintainer and contact person for
    the many other instructors who taught from this'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'material world-wide, and who contributed in a major way to its improvement.


    Great efforts were made to keep the material up to date, since the Linux kernel
    morphs rather quickly. New editions were published four times a year, gradually
    coming into sync with the kernel release schedule.


    Over the years many students had requested that the coursework be obtainable in
    bookstores or mail order. Because it was not possible to publish the coursework
