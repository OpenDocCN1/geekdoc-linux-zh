    We''ll consider the use of **ports** and **protocols** with sockets, concentrating
    on how they are used and how to obtain information about them.


    +   22.1 Service Port Information . . . . . . . . . . . . . . . . . . . . . .
    . . . . 171

    22.2 Protocol Information . . . . . . . . . . . . . . . . . . . . . . . . . .
    173

    22.3 Labs . . . . . . . . . . . . . . . . . . . . . . . . . . . 174


    # 22.1 Service Port Information


    Multiple processes may be using a given transmission protocol (generally UDP or
    **TCP**) at a given time. In order to differentiate between the various services
    operating concurrently, **port numbers** are assigned uniquely.


    A port number is a 16-bit integer; we have already seen it pop up in the **sin_port**
    element of the socket address structure, where it is always stored in **network
    order**.


    It may sound silly to emphasize this, but there is no physical aspect to a port,
    nothing to plug a cable into, just as there is no physical manifestation of a
    socket. It is a convenient concept to which one can draw mechanical analogues,
    however, just as is a socket.'
  merge: -1
