    # 32.1 What are Message Queues?


    Message Queues constitute an IPC method in which linked lists of messages are
    used to send data from one process to another without using pipes.


    Messages may be sent and received according to priority or type, rather than in
    purely first-in, first-out FIFO order.


    In System V, messages may be retrieved in any order according to type; in POSIX,
    highest priority messages are always dealt with first.'
