    \ == EINPROGRESS){\n...\n```\n\nwhere we use the ao_error() function to wait for\
    \ completion of pending requests on the control block.\n\n# 15.3 Linux Implementation\n\
    \nThe original AIO implementation for Linux was done by glibc completely in user-space.\
    \ A thread was launched for each file descriptor for there were pending AIO requests.\n\
    \nThis approach is costly, if there are large numbers, even thousands, of each\
    \ requests; true support in the kernel can lead to far better performance. Thus\
    \ glibc also permits the important parts of the implementation to be passed off\
    \ to the kernel and more efficiently in kernel-space.\n\nThe 2.6 kernel contains\
    \ full kernel support for AIO: in fact all I/O is done through the asynchronous\
    \ method, with normal I/O being the result if flags are not set.\n\nA document\
    \ describing the details of this implementation can be found at http://ise.sourceforge.net/aio/ionext.txt.\n\
    \nHowever, there is a native user-space API in Linux with system calls that can\
