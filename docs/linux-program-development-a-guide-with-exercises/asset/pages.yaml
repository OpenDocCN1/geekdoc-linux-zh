    | 5.5 Labs . . . . . . . . . . . . . . . . . . . | 31 |


    # 5.1 Source Control


    Software projects become more complex to manage as the size of the project increases,
    or as the the number of developers working on them goes up.


    In order to organize updates and facilitate cooperation, many different schemes
    are available for source control. Standard features of such programs included
    the ability to keep an accurate history, or log of, changes, be able to back up
    to earlier releases, coordinate possibly conflicting updates from more than one
    developer, etc.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 28 CHAPTER 5. SOURCE CONTROL


    There is no shortage of available products, both proprietary and open; a brief
    list of products released under a GPL license includes:


    Table 5.1: Available source control systems


    | Product | URL |

    | --- | --- |

    | RCS | http://www.gnu.org/software/rcs/ |

    | CVS | http://ximbiot.com/cvs/wiki |

    | Subversion | http://subversion.tigris.org |

    | git | http://www.kernel.org/pub/scm/git/ |

    | GNU Arch | http://www.gnu.org/software/gnu-arch |

    | Monotone | http://www.monotone.ca |

    | PRCS | http://prcs.sourceforge.net |


    We will briefly discuss RCS and CVS, and then focus in more more detail on Subversion,
    a next-generation product.


    We will also discuss git, a somewhat different product arising from the Linux
    kernel development community.


    # 5.2 RCS and CVS


    # RCS


    One of the oldest methods of source code control is RCS (Revision Control System)
    from the Free Software Foundation. Full documentation can be found at RCS web
    site or by looking at man pages.


    Another older system, SCCS (Source Code Control System) was widely available in
    most Unix systems and is easy to convert to RCS.


    Normally there will be a sub-directory named RCS (or rcs) placed under the directory
    containing the files under control.


    make has built-in rules for RCS which makes it easy to use in development projects.
    In addition, emacs can be used tightly with RCS using the vc mode and related
    functions ,e.g., vc-ediff.


    When a file is unlocked no one can commit changes to a file, but the lock is available
    to anyone with access to the RCS repository.


    When a file is locked, only the holder of the lock can commit changes to the file.'
  merge: -1
