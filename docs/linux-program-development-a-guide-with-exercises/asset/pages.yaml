    # Semaphores


    ![](img/f604778e5fd8b5339b52bd5345099d26_270_0.png)


    We''ll learn how to create and use semaphores to protect critical regions of code
    from simultaneous access by more than one process. We''ll learn how to control
    semaphore operations.


    +   31.1 What is a Semaphore? . . . . . . . . . . . . . . . . . . . . . . . .
    . 247

    31.2 System V Semaphores . . . . . . . . . . . . . . . . . . . . . . . 248

