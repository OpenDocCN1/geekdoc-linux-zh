- img_proc: true
  md: '# CHAPTER 16. SIGNALS - I


    A process can send signals only to a process for which it has the appropriate
    permissions.


    Signals may be used to alert a process to take certain actions or to do gracefully.
    For most signals, if a process receives it without first arranging to catch it
    the process will terminate.


    If the process does not terminate execution will be resumed by going back to the
    instruction that was being executed when the signal was received.


    However, it is possible using the functions setjmp(), setjmp(), longjmp(), siglongjmp(),
    resume execution at an alternative location. This requires some care to avoid
    corruption.


    The earliest implementations of signal() were not reliable; i.e., it could not
    be assured that signals would get lost. Under Linux the newer reliable signification()
    interface is used and the older signal() interface is a wrapper around it.


    The signal API dates back to the early days of Unix, before some other methods
    of inter-process communication and alternatives were developed, in particular
    before multi-threading was a option. While the API is mature it also contains
    lot of baggage, and is in some sense old-fashioned.


    If you are developing a new application that makes extensive use of signals you
    question whether your design model makes sense, and whether you would be better
    off using threading, mapping to share memory, etc.


    # 16.2 Signals Available


    The command kill -1 will list available signals, and the command man 7 signal
    will give further documentation. The header file giving the actual definitions
    is /usr/include/asm-x86_64/signal.h.


    Here is a list of signals for the x86 platform; the available signals will differ
    on other architectures:


    > Table 16.1: Available signals


    | Signal | Value | Default Action | Posix? | Meaning |

    | SIGHUP | 1 | Terminate | Yes | Hangup detected on controlling terminal or death
    of controlling process. |

    | SIGINT | 2 | Terminate | Yes | Interrupt from keyboard. |

    | SIGQUIT | 3 | Core dump | Yes | Quit from keyboard. |

    | SIGILL | 4 | Core dump | Yes | Illegal Instruction. |

    | SIGTRAP | 5 | Core dump | No | Trace/breakpoint trap for debugging. |

    | SIGABRT | 6 | Core dump | Yes | Abnormal termination. |

    | SIGIOT | | | | |

    | SIGBUS | 7 | Core dump | Yes | Bus error. |

    | SIGFPE | 8 | Core dump | Yes | Floating point exception. |

    | SIGKILL | 9 | Terminate | Yes | Kill signal (cannot be caught or ignored). |

    | SIGUSR1 | 10 | Terminate | Yes | User-defined signal 1. |

    | SIGSEGV | 11 | Core dump | Yes | Invalid memory reference. |

    | SIGUSR2 | 12 | Terminate | Yes | User-defined signal 2. |

    | SIGPIPE | 13 | Terminate | Yes | Broken pipe: write to pipe with no readers.
    |

    | SIGALRM | 14 | Terminate | Yes | Timer signal from alarm. |

    | SIGTERM | 15 | Terminate | Yes | Process termination. |'
