    # ## 7.1 System Calls vs. Library Functions


    Programs may request actions, or services, from the **Linux** kernel through a
    well defined set of **system calls**. This is done because all interaction with
    hardware (including memory) requires kernel privileges.


    There are many other functions accessed from user programs which are not system
    calls, but which may make system calls on their own. An example would be `fopen()`.
    In principle, an application doesn''t know whether it is making a system call,
    or a call to a library that can be satisfied without recourse to a system call.


    Technically, all arguments to system calls (as they are presented to the kernel,
    not as they appear'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'to the application) are unsigned longs, which may be interpreted as pointers.
    The library or application making the system call will take care of any casting
    required.


    Usually, the maximum number of arguments to the system call as it is presented
    to the kernel is 6, including the system call number.


    On line documentation can be found by doing man 2 intro or man syscalls. Since
    chapter 2 of the online manual contains system call documentation, the command
    ls /usr/share/man/man2 will give a list of relevant man pages. This documentation
    may not be up to date.


    # 7.2 How System Calls are Made


    In version 2.6.31 of the 32-bit x86 Linux kernel there are 336 system calls, and
    for 2.4.30 after 252; the number has been gradually growing. For other architectures,
    the numbers can be different. Note that the precise number depends on the minor
    kernel version number.


    Some calls have not been implemented (or are ancient relics) although space has
    been reserved for them. Calling any one of these system calls returns the error
    -ENOSYS.


    These function calls are listed in /usr/include/asm/unistd.h. The head of this
    file includes:


    ```

    #define __NR_exit 1

    #define __NR_fork 2

    #define __NR_read 3

    #define __NR_write 4

    #define __NR_open 5

    #define __NR_close 6

    #define __NR_waitpid 7

    #define __NR_creat 8

    #define __NR_link 9

    #define __NR_unlink 10

    ...

    ```


    The kernel level uses sys_ prepended to the user level function name.


    The arguments at the user level may be different than at the kernel level; the
    library takes care of any message necessary.


    When the user makes a system call (like open()) the library glibc in this case)
    determines the number associated with that system call and passes that to the
    kernel while making an int 0x80 instruction, which generates an exception, which
    causes the CPU to enter kernel mode on 32-bit x86.


    Together with the routine number, the library passes any arguments to the kernel
    which executes the call; when it is finished it returns an exit to user-space.


    # 7.3 Return Values and Error Numbers


    Most (but not all) system calls return 0 on success and -1 on failure. To get
    more specific information use the function perror(). For example:'
