  md: '# 5.5. VALGRIND


    All of these utilities gain their information from reading entries in the /proc
    pseudo-filesystem. You can directly examine entries without using special programs
    once you become familiar with the formats of the various entries.


    # 6.5 valgrind


    valgrind is an integrated set of tools useful for profiling and debugging under
    Linux. The three main tools involve memory error detection, cache profiling, and
    heap profiling. Complete documentation and the latest versions can be obtained
    from http://valgrind.org.


    To invoke valgrind on an executable named foobar, just do:


    ```

    valgrind --tool=<toolname> [options] foobar [arguments]

    ```


    where toolname can be one of:


    +   - lackey

    - memcheck

    - corecheck

    - helgrind

    - addrcheck

    - massif

    - callgrind

    - cachegrind

    - none


    By default memcheck should be chosen, but it depends on how valgrind is installed,
    one should not assume this. In order to get the most information, programs should
    be compiled with the -g flag.


    It is possible to divert valgrind''s output from the default stderr. For example,
    if one uses the helper program :


    ```

    valgrind-listener [--exit-at-zero-1] [port-number]

    ```


    on a host with address of ipaddr, and invokes valgrind as in


    ```

    valgrind --log-socket=ipaddr[:port-number] --tool=memcheck foobar

    ```


    output will appear on a socket being monitored by valgrind-listener. Note that
    the address must be given in numerical form, not by name (and could be the current
    host), and the default port number 1500.


    Programs run under valgrind are slowed down by a factor that can range from 5
    to 100. Programs are instrumented and run under a simulated CPU; the amount of
    slowdown depends on which tool is being used. For example, memcheck increases
    code size by an order of magnitude and slows down by a factor of 25 to 50.


    Besides your application, valgrind will debug and profile whatever shared libraries
    it uses, and thus output can be quite noisy. It is possible to selectively suppress
    the output from the shared libraries.'
  merge: -1
