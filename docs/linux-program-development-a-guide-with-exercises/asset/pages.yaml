  md: '# Linux Program Development

    na guide with exercises


    is designed to bring experienced programmers up to speed quickly in a Linux environment.


    Students will learn the tools and methods for developing C programs and doing
    systems programming under Linux.


    The exposition and exercises are designed to work with the most recent kemel version
    (2.6.32) and all major Linux distributions. There are many exercises on a wide
    variety of topics involving compiling, libraries, version control, memory management,
    debugging, multi-threading, signals, networking and sockets, and methods of Inter-process
    Communication.


    Upon mastering this material, you will have the necessary tools to develop advanced
    applications on a Linux system.


    Jerry Cooper has been working with computers since 1969. He has a PhD in theoretical
    nuclear astrophysics, and has been using Linux since 1994. He has done many Linux
    engineering projects both at the application and kernel level since 1998 has been
    developing and teaching courses on Linux Device Drivers, Kernel Internals, and
    Systems Programming.


    For information on obtaining training classes on these subjects including detailed
    outlines and customization options see http://www.coopj.com, or email coop@coopj.com


