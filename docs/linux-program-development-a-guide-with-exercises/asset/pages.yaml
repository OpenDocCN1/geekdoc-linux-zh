  md: 'Unix I/O is not part of the ANSI C specification, and sometimes elementary
    textbooks neglect it or recommend not using it. However, it is basic to programming
    on any Unix-like operating system, and such advice should be ignored.


    Files are referenced using file descriptors, which are simple non-negative integers,
    not the *FILE stream type used in the standard I/O library.


    Three file descriptors are created by default and do not have to be opened and
    closed explicitly.


    Table 10.1: Predefined Unix I/O descriptors


    | Name | Symbolic Name | Value |

    |---|---|---|

    | standard input | STDIN_FILENO | 0 |

    | standard output | STDOUT_FILENO | 1 |

    | standard error | STDERR_FILENO | 2 |


    Full POSIX conformance requires the use of the symbolic names, but many programs
    use the actual values which are always used.


    # 10.2 Opening and Closing


    The following functions open and close files for Unix I/O:


    ```

    #include <unistd.h>

    #include <fcntl.h>

    #include <sys/types.h>

    #include <sys/stat.h>


    int open (const char *pathname, int flags, mode_t mode);

    int create (const char *pathname, mode_t mode);

    int close (int fd);

    ```


    When successful, open(pathname) returns a file descriptor for the file (or device)
    referenced by pathname. The third argument, mode, is needed only when a new file
    is created.


    The flags argument must have one of the mandatory values:


    Table 10.2: Main open() flags


    | Flag | Meaning |

    |---|---|

    | O_RDONLY | Read-only access. |

    | O_WRONLY | Write-only access. |

    | O_RDWR | Read/write access. |'
