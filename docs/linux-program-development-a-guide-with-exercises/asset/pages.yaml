  md: '# 28.1 Multiplexed and Asynchronous Socket I/O


    An application may have a need to handle input from/or output to a number of different
    sources simultaneously. These may correspond to file descriptors, socket descriptors,
    or a combination of the two. For instance, concentrating on reading:


    +   - A client or server may be waiting for input from a terminal or a file pipe.

    - A server may be listening for new connections which it can accept().

    - A client or server may be ready to accept input from connected sockets, or from
    connectionless sockets.


    In most cases by default I/O is a blocking operation: an application will not
    return from a reading system call until data is present, either any amount at
    all or until the low-water mark has passed. While the application is blocked it
    can''t do anything.


    An application can do non-blocking operations, but often this requires it to frequent
    polling; i.e., it sits in a loop checking so often for input. This can be a big
    waste of CPU cycles. There are several methods an application can choose that
    satisfy these two:


    +   - Multiplexing can be done using select(), pselect(), or poll(). This is still
    a variation on polling but waits on a number of different I/O channels, and can
    be optimized by the kernel rather than an application. The newer Linux-specific
    method termed epoll scales best to large numbers of descriptors.

    - An application can use signal-driven I/O; when action needs to be taken with
    respect to a descriptor, the I/O activity can be taken care of by a signal handler.
    This removes the polling activity, but requires a lot of signal activity.

    - An application can use true asynchronous I/O; here I/O operations are initiated
    and the return happens before completion. A signal indicates the end of the I/O
    activity, rather than the start.

    - A server can be written to handle concurrent operations by either forking children
    for each channel that needs to be handled, or by launching light threads for that
    purpose. This can be done in parallel with some of the other techniques as well.


    There is no “one size fits all” approach for all applications, in that the I/O
    channels can be open for a short time or a long time, there may be many simultaneous
    requests or just a few, etc.


