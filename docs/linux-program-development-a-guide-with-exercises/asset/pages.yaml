    ![](img/f604778e5fd8b5339b52bd5345099d26_24_0.png)


    We''ll discuss our procedures and make some comments about Linux distributions.
    We''ll also consider standards such as Posix and the Linux Standard Base.


    | 1.1 Procedures | . . . . . . . . . . . . . . . . . . . . . . . . | 1 |

    | 1.2 Linux Distributions | . . . . . . . . . . . . . . . . . . . . . . | 2 |

