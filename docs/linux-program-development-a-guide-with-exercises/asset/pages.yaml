    Use valgrind is best learned through experimentation with the different tools,
    but let''s just survey the main ones:


    # memcheck


    Detect use of uninitialized memory.


    Detect accessing memory past the end of malloc''ed regions, or accessing memory
    which has been deed.


    Detect use of inappropriate stack areas,


    Detect memory leaks (allocated buffers which are never re-used or freed).


    Pinpoint other memory related errors.


    # addrcheck


    Same as memcheck but doesn''t check for use of uninitialized memory; runs much
    faster as a result.


    # cachegrind


    Profiles the use of cache.


    Simulates L1, L2, D1 CPU caches and logs the number of cache hits and misses,
    memory references and instructions for each line of program code.


    Can slow programs down up to 100 times.


    The helper program callgrind is a wrapper which gives even more information. The
    KDE application cachegrind gives an advanced graphical interface.


    # helgrind


    Thread debugger which looks for multi-threaded race conditions.


    Identifies memory locations used by more than one thread without mutual exclusion
    primitives.'
