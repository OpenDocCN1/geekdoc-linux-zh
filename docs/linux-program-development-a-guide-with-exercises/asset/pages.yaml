  md: '# 3.4. DYNAMIC LINKING LOADER


    Valid options for the LD_DEBUG environment variable are:


    +   - libs display library search paths

    - reloc display relocation processing

    - files display progress for input file

    - symbols display symbol table processing

    - bindings display information about symbol binding

    - versions display version dependencies

    - all all previous options combined

    - statistics display relocation statistics

    - help display this help message and exit


    To direct the debugging output into a file instead of standard output

    a filename can be specified using the LD_DEBUG_OUTPUT environment variable.


    You can show how symbols are resolved upon program execution, and help find things
    like linking to

    t wrong version of a library. Try:


    ```

    LD_DEBUG=all ls

    ```


    to see a sample.


    # Stripping executables


    The command


    ```

    strip foobar

    ```


    where foobar is an executable program, object file, or library archive, can be
    used to reduce file

    size and save disk space. The symbol table is discarded. This step is generally
    done on production

    versions.


    Don''t use strip on either the Linux kernel or kernel modules, both of which need
    the symbol

    information!


    # 3.4 Dynamic Linking Loader


    It is possible to avoid choosing the dynamic library until run-time, in fact after
    execution of the

    binary begins.


    While the choice of shared library to run can be controlled by environmental variables,
    it is

    also possible to dynamically load, unload, and substitute during the program execution.


    The functions which accomplish this are:


    ```

    #include <dlfcn.h>

    ```'
