    # Signals - II


    ![](img/f604778e5fd8b5339b52bd5345099d26_158_0.png)


    We''ll discuss the issue of reentrancy and signal handlers. We''ll also learn
    more advanced signal operations involving jumping to alternate returns, and the
    sigqueue function. Finally we''ll discuss real-time signals.


    +   17.1 Reentrancy and Signal Handlers . . . . . . . . . . . . . . 135

    17.2 Jumping and Non-Local Returns . . . . . . . . . . . . . . 136

    17.3 siginfo and sigqueue() . . . . . . . . . . . . . . 138

    17.4 Real Time Signals . . . . . . . . . . . . . . . . 139

    17.5 Labs . . . . . . . . . . . . . . . . . . . . 140


    # 17.1 Reentrancy and Signal Handlers


    Exactly when a signal handler is going to be called is of course unpredictable.
    Thus one has to be particularly careful about the various resources a signal handler
    uses. In practice this means one has to worry about reentrancy and thread-safety;
    these are not the same thing.


    Being careful about reentrancy simply means being careful about functions which
    can call themselves, directly or indirectly.'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'Being thread-safe means that any data areas that can be touched in more than
    one thread must be protected by proper locking mechanisms.


    For the moment we will concentrate on reentrancy. For an excellent article on
    this problem in signal handlers, see http://www.ibm.com/developerworks/linux/library/l-reent.html.


    A function is reentrant if:


    +   - Does not hold static data over successive calls.

    - Does not return a pointer to static data; all data is provided by the caller
    of the function.

    - Uses local data or ensures protection of global data by making a local copy
    of it.

    - Does not call any non-reentrant functions.


    In practice this means a function is not reentrant if:


    +   - Calls malloc() or free().

    - Uses static data structures.

    - Uses the standard I/O library.


    This doesn''t mean you can''t use reentrant functions in a signal handler. What
    it means is that you had better be careful if you do not understand your code
    well enough to ensure that the functions that can cause problems are never called
    in a context where the signal may be received and called in the signal handler
    itself.


    Note that code can be reentrant but not thread-safe. These are two independent
    concepts


    # 17.2 Jumping and Non-Local Returns


    Normally after a non-fatal signal handler is executed, execution will resume from
    the point in the code where the signal was received.


    The following functions permit alternative non-local goto''s after a handler is
    invoked:


    ```

    #include <setjmp.h>


    int setjmp(jmp_buf env);

    void longjmp(jmp_buf env, int val);


    sigsetjmp(jmp_buf env, int savesigns);

    void siglongjmp(jmp_buf env, int val);

    ```


    An initial call to setjmp() or sigsetjmp() save the stack context and environment
    in the first argument, env, so that can later be restored. (One need not look
    into the details of how the jmp_buf and sig_jmp_buf buffers are defined.) The
    initial call will give a return value of 0.'
  merge: -1
  pgno: 159
- img_proc: true
  md: "# JUMPING AND NON-LOCAL RETURNS\n\nA subsequent call to longjmp() or siglongjmp()\
    \ will reposition the instruction flow at the place of the call to setjmp() or\
    \ sigetjmp(), and the second argument, val, will provide the return value of the\
    \ setting functions.\n\nThe difference between the two sets of functions is in\
    \ how they deal with the signal environment. The savesigs argument is non-zero\
    \ the mask of block signals is saved by sigetjmp() and is restored when siglongjmp()\
    \ is called.\n\nThe simpler functions have signal behaviour that is not specified\
    \ in the Posix standard and can vary in different Unix implementations. Therefore\
    \ they should be avoided if signals are involved.\n\nHere's an example of a program\
    \ using these functions to have an alternative return from a signal handler:\n\
    \n```\n#include <stdio.h>\n#include <unistd.h>\n#include <signal.h>\n#include\
    \ <stdlib.h>\n#include <errno.h>\n#include <string.h>\n#include <setjmp.h>\n\n\
    #define DEATH(mess) { perror(mess); exit(errno); }\n\nsigjmp_buf senv;\n\nvoid\
    \ sig_int (int what)\n{\n    static int counter = 0;\n    printf(\"We have received\
    \ SIGINT\\n\",\n        siglongjmp(senv, ++counter);\n}\n\nint main(int argc,\
    \ char *argv[])\n{\n    int savesigs = 1;\n    struct sigaction act;\n    memset(&act,\
    \ 0, sizeof(act));\n    act.sa_handler = sig_int;\n    if (sigaction(SIGINT, &act,\
    \ NULL) < 0) /* for CTRL-C */\n        DEATH(\"sigaction\");\n    printf(\"Successfully\
    \ installed signal handler for SIGINT\\n\");\n    printf(\"returning from setjmp/longjmp,\
    \ rc=%d\\n\",\n        setjmp(senv, savesigs));\n    /* hit Ctrl-C while the sleep\
    \ is proceeding */\n    sleep(10);\n    DEATH(\"returned to the wrong place!\\\
    n\");\n}\n```\n\nThese methods can cause subtle problems and make programs difficult\
    \ to maintain and comprehend. So they are not recommended for new code, but may\
    \ be encountered when dealing with previously written programs."
