  md: '# # Network Layers


    ![](img/f604778e5fd8b5339b52bd5345099d26_179_0.png)


    Thus networking can always be seen as consisting of a number of stacked layers.
    This stack may be categorized in a number of ways, but a simple description appropriate
    for Linux (in which traffic moves both ways) would be:


    +   * **Application Layer:** This can be familiar programs as ftp, http and smtp,
    that communicate across the Internet, or programs as X clients and servers that
    communicate either across the Internet or the local machine, as well as any custom
    network application.


    +   * **Transport Layer:** This is the method of data-encapsulation, error checking
    protocols, etc. The two most common examples are streaming (usually TCP (Transmission
    Control Protocol)) connection-oriented; and datagram (usually UDP (User Datagram
    Protocol)) connectionless. Other examples include SLIP and PPP.


    +   * **Network Layer:** This describes how data is to be sent across the network,
    containing routing information etc. The most common protocols are IPv4 (Internet
    Protocol Version 4) or the newer IPv6, and Unix for local machine communication.
    Other examples include ARP and ICMP'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# NETWORKING Layer


    +   - Datalink Layer: This is the hardware part. It includes both the type of
    device (Ethernet, Token Ring, etc.) and the actual device driver for the network
    card.


    Networking applications send and receive information by creating and connecting
    to sockets, whose endpoints may be anywhere. Data is sent to and received from
    sockets as a stream. This is true whether or not the underlying transport layer
    deals with connectionless unsequenced data (such as UDP), or connection-oriented
    sequenced data (such as TCP). Note that various combinations of these layers are
    possible, such as TCP/IP or UDP/IP.


    The basic data unit that moves through the networking layers and through the network
    is the packet, which contains the data but has headers and footers containing
    control information. Within the kernel, the packet is described by a socket buffer,
    a data structure of sk buff.


    These headers and footers contain information such as the source and destination
    of the packet, various options about priority, sequencing, and routing, identification
    of the device driver associated with the socket, etc.


    When an application writes into a socket, the transport layer creates a series
    of one or more packets and adds control information. It then hands off to the
    network layer which adds more control information, and decides where the packets
    are going; Packets going out on the network are handed off to the datalink layer
    and the device driver.


    When packets of data are received by the datalink layer, it first sees if they
    are intended for the local machine, and if so it processes them and hands off
    to the network layer, which then passes them through the transport layer, which
    sequences the packets, and finally strips out the data and sends it back to the
    application.


    # Data Packet Encapsulation


    ![](img/f604778e5fd8b5339b52bd5345099d26_180_0.png)


    Figure 20.2: Data Packet Encapsulation'
  merge: -1
