  md: "# 2.2. SYSTEM IPC\n\n# Identifiers\n\nEach IPC (a shared memory segment, semaphore\
    \ set, or message queue), has associated with a unique identifier, a system-generated\
    \ non-negative integer based on a user-supplied key.\n\nTwo IPC objects of different\
    \ kind can have the same ID (e.g., a message queue and a semaphore set), but two\
    \ objects of the same type can never share an ID.\n\nThe first process accessing\
    \ the structure (perhaps the server) creates the ID from the key; subsequent processes\
    \ (perhaps the clients) attaching to the IPC structure fetch it using the key.\n\
    \n# Keys\n\nObtaining a unique ID requires use of a unique key. All processes\
    \ accessing the IPC structure must agree upon the key.\n\nThe key may be arrived\
    \ at in a number of ways:\n\n+   - It may be hard coded into the application(s).\
    \ This can lead to collisions and security holes.\n\n+   - The first process can\
    \ initiate a new IPC structure with a key of IPC_PRIVATE and store the returned\
    \ ID in a file which other processes can read. One disadvantage is that file operations\
    \ are required.\n\n+   - If the processes have a parent-child relationship, the\
    \ parent can use IPC_PRIVATE and the child will have the identifier after the\
    \ fork(). The child can then pass the ID as an argument and when it exec()'s a\
    \ new program.\n\n+   - The function flock() can be used to generate a key. It\
    \ requires as arguments a pathname and project ID. This is not particularly an\
    \ advantage over the other methods. Likewise any commonly agreed upon algorithm\
    \ can be. This is an ancient method which is hard to justify.\n\nThe functions\
    \ that create (or attach to) a new IPC object (shmget(), semget(), msgget()) have\
    \ a flag argument. A new IPC object can be created only if the key is IPC_PRIVATE,\
    \ or the key is not already used by an existing IPC object, and the IPC_CREAT\
    \ bit of flag is set.\n\nIf the IPC already exists access will be given to it\
    \ when the right key is given, and a new IPC not generated, if the IPC_CREAT flag\
    \ is set. However, if the IPC_EXCL flag is also set, an error will result if the\
    \ object already exists.\n\n# Permission Structure\n\nEvery IPC object has an\
    \ ipc_perm() structure, defined as:\n\n```\nstruct ipc_perm\n{\n    key_t key;\
    \      /* IPC key */\n    uid_t uid;      /* owner user id */\n    gid_t gid;\
    \      /* owner group id */\n```"
  merge: -1
