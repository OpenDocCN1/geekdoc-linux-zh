- img_proc: true
  md: '# CHAPTER 2. COMPILERS


    Virtually every operating system you think of has a version of gcc, and it can
    be used for cross-compilation.


    gcc also forms the back end for compiler front ends in Ada95 (package gcc-gnat),
    Fortran (package gcc-gfortran), and Pascal (package gcc-prc); i.e., first there
    is a translation to the C language, and then a back end (silently) invokes gcc.


    Tons of documentation can be found at the gcc home page, http://gcc.gnu.org, including
    a complete manual, FAQ, and platform specific information. In addition, doing
    info gcc will give you detailed on-line documentation.


    Note invoking gcc actually entails a number of different programs or stages, each
    of which has its own man page, and can be independently invoked:


    # Table 2.1: Compiling stages


    | Stage | Command | Default Input | Default Output | -W switch |

    |---|---|---|---|--|

    | preprocessing | cpp | .c | .1 | -W... |

    | compilation | gcc | .i | .s | N/A |

    | assembly | as | .s | .0 | -Wa... |

    | linking | 1d | .o | a.out | -Wl... |


    Depending on your Linux distribution, details about the gcc installation and defaults
    can be found in the /usr/lib/gcc, /usr/lib64/gcc and/or /usr/libexec/gcc directories.


    +   * Intel has a mature set of compilers which are described at http://software.intel.com/en-us/intel-compilers/.
    Evaluation copies can be downloaded for free, and a free non-commercial license
    can be obtained for learning purposes (see http://software.intel.com/en-us/articles/non-commercial-software-faq/.

    * Intel C compiler works well for compiling applications under Linux. It can be
    used to compile the kernel but it is not a trivial exercise and it is doubtful
    anyone is using it for this purpose in a production environment.


    # 2.2 Major gcc Options


    The output format for the executable will be ELF (Executable and Linkable Format)
    which makes using shared libraries easy; the older-so a.out format, while obsolete
    (although the name), may still be used if the kernel has been configured to support
    it.


    Here''s a list of some of the main options that can be given to gcc:'
  merge: -1
