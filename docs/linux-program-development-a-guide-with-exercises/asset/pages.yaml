  md: '# Table 2.3: Compiler path options


    | -Idir | Include dir in search for included files. Cumulative. |

    | -Ldir | Search dir for libraries. Cumulative. |

    | -l | Link to lib; -lfoo links to libfoo.so if it exists, or to libfoo.a as a
    second choice. |


    # Table 2.4: Compiler preprocessor options


    | -M | Don''t compile. Give dependencies for Make |

    | -H | Print out names of included files. |

    | -E | pre-process only |

    | -Ddef | Define def |

    | -Udef | Undefine def |

    | -d | Print #defines |


    # Table 2.5: Compiler warning options


    | -v | Verbose mode, gives version number |

    | -pedantic | Warn very verbously |

    | -w | Suppress warnings |

    | -W | more verbose warnings |

    | -Wall | enable a bunch of important warnings |


    # Table 2.6: Compiler debugging and profiling options


    | -g | Include debugging information |

    | -pg | Provide profile information for gprof |


    # Table 2.7: Compiler input and output options


    | -c | Stop after creating object files, don''t link |

    | -ofile | Output is file; default is a.out |

    | -xlang | Expect input to be in lang, which can be c, objective-c, c++ (and some
    others.) Otherwise, guess by input file extension |'
