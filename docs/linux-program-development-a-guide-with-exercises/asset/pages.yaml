  md: '# signal (V) (up)


    They work so that:


    +   - sv is **true** when the critical section is available.

    - P(sv) decrements the counter until it reaches zero. This is often called the
    **down** operation instead of **wait**.

    - V(sv) increments the counter. This is often called the **up** operation instead
    of signal.


    A semaphore variable is a counter, and can have any non-negative value, not just
    1 and 0. For an example, suppose you want to permit up to n users to have access
    to facility at once, no more than that. You would initialize the counter to n,
    and then decrease it every time a new user joins. When the semaphore reaches 0,
    no further users are added until one user releases (increments the value by unity)
    thereby permitting a new user to access.


    The System V semaphore implementation is complicated because it deals with semaphore
    sets instead of individual objects. Thus the semaphore function calls are more
    painful than for the other System V IPC mechanisms, and much messier than those
    in the POSIX implementation. Furthermore, System V semaphores should never be
    used in multi-threaded programs.


    Semaphores will not be removed unless done so explicitly. **ipcrm** can be used
    to remove System V semaphores, and POSIX semaphores can be directly removed from
    the /dev/shm directory.


    # 31.2 System V Semaphores


    The functions for dealing with **System V** semaphores are:


    ```

    #include <sys/types.h>

    #include <sys/ipc.h>

    #include <sys/sem.h>

    ```


    ```

    int semget(key_t key, int nms, int semflg);

    int semop(int semid, struct sembuf *ops, unsigned nsops);

    int semctl(int semid, int semun, int cmd, union semun *arg);

    ```


    **nsms** is the number of semaphores (usually 1). If a semaphore is being accessed
    (not) created its value is ignored.


    **semctl** argument to semget() contains the usual permission bits (such as 0644)
    which may be combined with creating a new object. If **IPC_EXCL** is also specified,
    failure results if the object already exists. If **IPC_CREAT** is not specified
    the entire argument is ignored.


    If **IPC_PRIVATE** is used for the key, a new segment can be created. If **IPC_CREAT**
    or **IPC_PRIVATE** is specified, one attaches to a previously existing segment.


    The return value of semget() is a semaphore identifier (generated from the **key**
    argument) to be used as an argument for the other functions.


    The members of a new semaphore set are **not** initialized; this must be done
    with semctl(). **semop(** can **change** the value of the semaphore, but not set
    it to a specific value.)'
