    port numbers and protocols for a given service. If the port number changes, the
    program will not require recompilation.


    The system calls that access the /etc/services file are:


    ```

    #include <netdb.h>


    struct servent *getservbyname(const char *name, const char *char *proto);

    struct servent *getservbyport(int port, const char *char *proto);


    struct servent *getservent(void);

    void endserv(int stayopen);

    void endservent(void);


    struct servent {

    char *s_name; /* official service name */

    char **s_aliases; /* alias list */

    int s_port; /* port number */

    char *s_proto; /* protocol to use */

    }

    ```


    Thus the call


    ```

    serv_entry = getservbyname("ftp", "udp");

    ```


    returns the structure describing the ftp service with the UDP protocol, and


    ```

    serv_entry = getservbyport(htons(80),"tcp");

    ```


    returns the structure describing http with the TCP protocol.


    The function getserv() opens and rewinds /etc/services for reading; if stayopen=1,
    the file will not be closed between subsequent calls to the get functions.


    Once the file has been opened, the function getserv() can be used to read it line
    by line, and the function endservent() closes the file when done.


    Remember that port numbers must be passed to these functions, and are stored in
    the servent structure, in network byte order.


