  md: '# Chapter 29


    # Inter Process Communication


    ![](img/f604778e5fd8b5339b52bd5345099d26_256_0.png)


    We''ll learn about three methods of IPC: shared memory, semaphores, and message
    queues, and their System V and POSIX implementations.


    +   29.1 Methods of IPC .................................................................................................
    . . . . 233

    29.2 System V IPC . . . . . . . . . . . . . . . . . . . . . . . . . 234

    29.3 Posix IPC .................................................................................................
    . . . . . . . . . . . . 237

    29.4 Labs .................................................................................................................................
    . . . . . . . . . . . . 238


    # 29.1 Methods of IPC


    Broadly speaking, the term Inter Process Communication (IPC) includes any method
    that exchanges information or promotes cooperation more than one process.


    This includes pipes, networks. Unix domain sockets, etc., as well as the following
    three mechanisms that are often taken as a group and all connect processes only
    on a local machine, which may or not have a parent-child relationship:


    +   * Shared Memory allows one process to allocate memory to which other processes
    can attach and detach. The processes communicate directly through this sharing.
    This is the fastest IPC method. Careful synchronization is essential to preserve
    integrity and avoid race conditions.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '+   Semaphores are used by processes to signal each other when a resource is
    either available or unavailable due to concurrent use. One invokes down operations
    to gain access and up operations to let others gain access. Semaphores differ
    from other locking devices in that they are counters rather than binary; i.e.,
    more than one (but less some limiting number of processes) may share simultaneous
    access.


    +   Message Queues are used to exchange data among processes without using pipes.
    Depending on the implementation, messages may be retrieved by priority, type,
    and/or first-in, first-out (FIFO) order.


    There are two standardized IPC implementations available on Linux systems: System
    V IPC and POSIX IPC. We will discuss both in detail and as contrast them.


    In both of these implementations these three mechanisms are closely linked. For
    instance, a basic system call, ipc(), can be used to invoke all three System V
    methods. Furthermore, all the POSIX IPC methods are implemented using pseudo-filesystems
    (on Linux) and can be examined and modified with normal file utilities.


    When used improperly, IPC methods can cause leaks in resources such as memory.
    By design it is possible for an IPC object to remain in existence even after processes
    which have used it have terminated it. The System V implementation is particularly
    clumsy in this regard, and inconsistencies between the methods used to remove
    the various kinds of objects leads to further programming errors, as removing
    objects in use, thereby corrupting or terminating the processes using them.


    The IPC methods are relatively old and predicate large scale of multi-threaded
    programming as well as many methods of network programming currently in use. If
    you need to have a lot of IPC usage, going over to a multi-threaded (or network)
    design may be a much cleaner and efficient choice.


    Both System V IPC and POSIX IPC can be configured in or out during Linux kernel
    configuration; they are not mandatory.


    # 9.2 System V IPC


    Implementation of System V IPC is not part of the POSIX standard, and not part
    of ANSI C. However, it is required for an operating system to be certified as
    Unix.


    While these mechanisms may not be the best choice for modern applications, if
    you have to maintain or port any legacy programs, you''ll quite likely need to
    know System V IPC.


    All System V IPC methods share certain structures and flags and have others which
    are closely related. Such features include use of unique key to identify the shared
    resource (provided by input) and the use of unique identifier which is then generated
    by the kernel to be used as a handle.'
