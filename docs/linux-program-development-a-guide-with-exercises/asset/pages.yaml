    # 15.1 What is Asynchronous I/O?


    Normally all I/O operations are performed synchronously; an application will block
    until the read or write is completed, successfully or unsuccessfully.


    Note that this does not mean all pending writes will be flushed to disk immediately,
    only that the interaction with the virtual file system has been completed.


    But if I/O requests could be queued, and program execution continued in parallel
    with completion of the I/O request? This can be particularly useful on SMP systems
    and using DMA, which does not involve the CPU. When this is, it is called asynchronous
    I/O, or AIO.'
  merge: -1
  pgno: 140
- img_proc: true
  md: "In order for this to work properly, there has to be notification when the I/O\
    \ request is complete and code must contain synchronization points, or completion\
    \ barriers.\n\nIn addition, policies must be set as to queued requests are serialized,\
    \ especially when they refer to the file descriptors.\n\nYou can request asynchronous\
    \ I/O by using the ASYNC flag when opening a file, the -o async option to the\
    \ mount command, but this won't give true asynchronous I/O.\n\n# 15.2 The Posix\
    \ Asynchronous I/O API\n\nPOSIX 1.b standard defines a basic data structure, the\
    \ aiocb, which stands for AIO control block, and a set of basic functions that\
    \ can be performed on it. These are defined and prototyped in /usr/include/aio.h\
    \ and are provided with glibc.\n\nThe data structure looks like:\n\n```\nstruct\
    \ aiocb\n{\n    int aio_fildes;             /* File descriptor. *\n    int aio_lio_opcode;\
    \        /* Operation to be performed. *\n    int aio_reqrio;            /* Request\
    \ priority offset. *\n    volatile void *aio_buf;     /* Location of buffer. *\n\
    \    size_t aio_nbytes;          /* Length of transfer. *\n    struct sigevent\
    \ aio_sigevent;/* Signal number and value. *\n    __off64 t aio_offset;      \
    \ /* File offset\n};\n```\n\nwhere we have omitted the purely internal members\
    \ of the data structure.\n\naio_fildes can be any valid file descriptor, but it\
    \ must permit use of the lseek() call.\n\naio_lio_opcode is used by the lio_listio()\
    \ function and stores information about the type of operation to be performed.\n\
    \naio_reqrio can be used to control scheduling priorities.\n\naio_buf points to\
    \ the buffer where the data is to be written to or read from.\n\naio_nbytes is\
    \ the length of the buffer.\n\naio_sigevent controls what any signal is sent to\
    \ the calling process when the operation completes.\n\naio_offset gives the offset\
    \ into the file where the I/O should be performed; this is necessary because doing\
    \ I/O operations in parallel voids the concept of a current position.\n\nThe basic\
    \ functions are actually not part of glibc proper, but are part of another library,\
    \ librt.\n\nThese functions are:\n\n```\n#include <aio.h>\n\nvoid aio_init(const\
    \ struct aioint *init);\nint aio_read(struct aiocb *cb);\n```"
