    ```

    int system(const char *cmd);

    ```


    In effect, system() invokes /bin/sh -c cmd and sends the output of cmd to standard
    output. This differs from what will happen when we use the popen() function in
    our discussion of pipes, which actually re-directs standard input and/or output
    onto file descriptors.


    For example:


    ```

    printf("exit status = %d\n", system("ps au"));

    ```


    On success system() returns the exit code for cmd; if it fails it can''t start
    a shell it returns 127 with any other error returning -1.


    The calling program will block, waiting for system() to complete its actions.
    One can use & to run cmd as a background process but results can be unpredictable.


    The system() call is not very efficient, but it is very easy to use. For more
    critical tasks one should use one of the exec() functions.


    Never use system() from within a program with super-user privileges; this can
    be a wide open security hole because behaviour can be influenced by environmental
    variables set by the normal user.


    # 13.2 Using fork() to Create a Process


    Creating a new (child) process without terminating the old one can be done with:


    ```

    #include <unistd.h>

    #include <sys/types.h>

    ```


    ```

    pid_t fork(void);

    ```


    After a fork() two processes are running. The child inherits the parent''s resources.
    Only the pid, pfile locks and pending signals are not carried forth. File descriptors,
    memory, etc., are inherited. However Linux uses a copy-on-write implementation,
    so memory is not duplicated until it is actually used.


    An additional process creation call, vfork() creates a child that shares the memory
    address space of the parent. To prevent the parent from stepping on the child''s
    use of the memory, the parent''s execution is blocked until the child exits or
    executes an execve(). Note that the child cannot write to this address space and
    thus there is no need to copy page tables.


    fork() is primarily a vestige of earlier Unix implementations which did not have
    have a copy-on-write technique. It can be dangerous and/or inefficient and should
    generally be avoided.


    fork() returns 0 to the child process and the child''s pid to the parent process,
    on success. On failure it returns -1 and errno is set. The possible error returns
    are:'
