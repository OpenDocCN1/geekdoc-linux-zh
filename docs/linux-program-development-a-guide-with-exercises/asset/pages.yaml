    Try running it on any other Internet address you think the echo server might be
    running on. What happens if it is not?


    # Lab 2: Simple Internet finger Client


    Write a client that connects to the finger socket on some host, asks it for information
    and displays what it returns.


    You can look in /etc/services to find out the finger socket''s port.


    You might get information on all users or only selected users.


    A naked carriage return sent to the finger server will return information on all
    logged in users (if the host will allow it). A user followed by a carriage return
    will return information on that user.


    The sample solution is written to work with this usage:


    ```

    lab2_finger_host user1 user2 . . .

    ```


    Try it on the local host, and if you know any Internet sites finger is still running,
    try there. If you want to be fancy you can get it to work with the standard finger
    syntax:


    ```

    finger user1@host user2@host2

    - finger @host1 @host2

    ```


    Note: By default the finger server may not be installed, and if it is it may not
    be enabled. To take care of both steps, one could do (as root):


    ```

    yum install finger-server

    chkconfig xinetd restart

    service xinetd restart

    ```'
