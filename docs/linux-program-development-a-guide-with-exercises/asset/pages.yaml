  md: '# 16.6 Signal Sets


    It is possible to create a data type to represent multiple signals, a so-called
    signal set. With such a set can tell the kernel to block, not block, or change
    the effect of any of the signals in the set on a given process.


    There are five elementary functions in the POSIX standard for manipulating signal
    sets:


    ```

    #include <signal.h>


    int sigemptyset(sigset_t *set);

    int sigfillset(sigset_t *set);

    int sigaddset(sigset_t *set, int signal);

    int sigdelset(sigset_t *set, int signal);

    int sigismember(const sigset_t *set, int signal);

    ```


    We don''t need to consider how the sigset data type is defined.


    +   * sigemptyset() initializes the signal set to empty; all signals excluded.

    * sigfillset() initializes the signal set to full.

    * sigaddset() adds signal to set.

    * sigdelset() deletes signal from set.

    * sigismember() tests whether signal is a member of a set.


    The first four functions return 0 on success, -1 on error. sigismember() returns
    1 if signal is a member, 0 if it is not, -1 on error. On errors, errno is EINVAL
    if sig is not a valid signal.


    The following three functions permit more elaborate manipulations of signal sets:


    ```

    #include <signal.h>


    int sigprocmask(int how, const sigset_t *set, sigset_t *oldset);

    int sigpending(sigset_t *set);

    int sigsuspend(const sigset_t *set, int *mask);

    ```


    sigprocmask() changes the list of currently blocked signals, according to value
    of how:


    Table 16.5: Signal mask selection


    | Value | Meaning |

    |---|---|

    | SIG_BLOCK | Set of blocked signals is the union of the current set and set argument;
    L.e., set contains the additional signals to block. |

    | SIG_UNBLOCK | Set of blocked signals is the intersection of the current set
    and the complement of the set argument; i.e., the signals specified in set are
    removed from the current set. |

    | SIG_SETMASK | The set of blocked signals is to be set to the argument. |'
  merge: -1
