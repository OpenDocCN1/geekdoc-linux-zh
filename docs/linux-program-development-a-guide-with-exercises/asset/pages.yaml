  md: '# CLOSE(<unist.h>) AND SHUTDOWN()


    ```

    #include <unistd>

    int close(int sd);

    ```


    In this case the argument is a socket descriptor, rather than the usual file descriptor,
    but the usage of close() is the same as it when it is used on a file.


    Any remote attempt to read or write on the socket after close() is called will
    result in an error. However, there may be some problems with just close().


    The first limitation is that the way close() works on any descriptor is to decrement
    the reference count associated with it (the number of processes using it) and
    not perform the actual close until the count reaches zero. An example be where
    a socket descriptor is created before a fork(), which means both parent and child
    would need to close it before it is released.


    This release may be implicit when the process terminates, normally or abnormally,
    since the exit handlers always close all open descriptors. A delay in releasing
    is probably what is desired, but you have no control over it with this simple
    close() function.


    The second limitation arises from the full-duplex nature of the connection. Both
    directions are terminated at once with close(), but perhaps one wants to finishing
    to the socket but would like to receive pending data for some time.


    More control can be gained with the shutdown() function:


    ```

    #include <sys/socket.h>

    int shutdown(int sd, int how);

    ```


    The parameter how can have the following values:


    Table 23.5: Socket shutdown methods


    | Value | Meaning |

    |---||

    | SHUT_RD | No more data will be received. Any data currently in the socket buffer
    is discarded. |

    | SHUT_WR | No more data will be transmitted. Any data currently in the socket
    send buffer will be sent. |

    | SHUT_RDWR | No more data will be received or transmitted. |


    Note that shutdown() does not close the socket. It returns 0 on success, and the
    following possible errors:


    Table 23.6: shutdown() error return values


    | Error | Meaning |

    |---||

    | EBADF | sd is not a valid descriptor. |

    | ENOTSOCK | sd describes a file, not a socket. |

    | ENOTCONN | Socket not connected |'
