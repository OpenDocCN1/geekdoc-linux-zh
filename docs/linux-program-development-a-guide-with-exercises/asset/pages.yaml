    # 19.2 Mutex Operations


    A *mutex* is a MUTex device, used to protect shared data structures from concurrent
    modifications and protecting critical sections of code.

    nA mutex can be *unlocked* (not owned by any thread); or *locked* (owned by a
    thread.) Normally a thread which tries to lock an already locked mutex is suspended.


    ```

    #include <pthread.h>


    int pthread_mutex_init(pthread_mutex_t *mutex, const pthread_mutex_t *mutexattr);

    int pthread_mutex_lock(pthread_mutex_t *mutex);

    int pthread_mutex_trylock(pthread_mutex_t *mutex);

    int pthread_mutex_unlock(pthread_mutex_t *mutex);

    int pthread_mutex_destroy(pthread_mutex_t *mutex);

    ```


    +   - pthread_mutex_lock() does what is says. If the mutex is already locked the
    thread is suspended until it is unlocked (by default), but this can be modified
    by changing attributes.

    - pthread_mutex_trylock() is the same as pthread_mutex_lock() except it does not
    block if the mutex is already locked by another thread.

    - pthread_mutex_destroy() destroys a mutex object, freeing any resources. It just
    checks if the mutex is unlocked.


    A mutex can be initialized in an unlocked state with the macro


    ```

    pthread_mutex_t my_mutex = PTHREAD_MUTEX_INITIALIZER;

    ```'
