- img_proc: true
  md: '# Signals


    Signals can be used to send short messages between any two processes, regardless
    of their relationship, as long as privileges are appropriate. This is one of the
    oldest methods of IPC.


    Normally only a signal is delivered, but with the siginfo interface, more information
    including the identity of the sending process can be supplied.


    Upon receiving a signal, a process suspends its normal operation, invokes a handling
    routine, and returns to its instruction flow or exits.


    # Pipes


    Pipes (created by the popen() or pipe() functions), create a data flow between
    two processes which may or not have an ancestral relationship.


    Data flow proceeds only when both a reader and a writer are present.


    # Named Pipes (Fifos)


    Named Pipes (fifos) create a data flow between two processes which may or not
    have an ancestral relationship.


    A filesystem entry is set and flow through the pipe is accomplished through normal
    I/O calls through the fifo.


    Data flow proceeds only when both a reader and a writer are present. There can
    be more than one reader and more than one writer.


    # Unix Domain Sockets


    Unix Domain Sockets create a data flow between two processes which may or not
    have an ancestral relationship.


    A filesystem entry is set up and flow through the socket is accomplished by opening
    up socket descriptors and reading and writing through them.


    Unlike fifos communication is truly multiplexed and bidirectional. There can be
    more than one reader and more than one writer.


    # Internet Sockets


    Internet Sockets create a data flow between two processes which may be on different
    machines. There is no filesystem entry associated with them.


    Flow through the socket is accomplished by opening up socket descriptors and reading
    and writing through them, just as with Unix Domain Sockets.


    Once again communication is truly multiplexed and bidirectional.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 12.6. LABS


    # System V IPC


    System V IPC consists of three methods: shared memory, semaphores, and message
    queues.


    All processes which have access to the appropriate identifier can use these methods
    whether or not there is an ancestral relationship.


    These methods are prone to leaks and have an interface which shows its age. They
    are used abundantly in legacy code, but can be avoided in new programs.


    # POSIX IPC


    POSIX IPC consists of the same three methods as System V IPC, but has a vastly
    improved interface and implementation.


    Shared resources show up as special filesystem entries.


    These methods are not prone to leaks and are a better choice than System V IPC.


    # Multi-threading


    Multi-threaded applications have more than one thread of execution. They communicate
    among each other through shared resources such memory and file descriptors.


    Careful coordination is required to preserve the integrity and sequencing of shared
    resources.


    # Advanced Modern Techniques


    Desktop applications often communicate through various IPC protocols closely connected
    to their windowing environment.


    DCOP is closely integrated into the KDE desktop environment, and the QT object-oriented
    libraries.


    Bonabo, based on CORBA, is heavily used in the Gnome desktop, and the GTK graphic
    toolkit.


    SOAP and XML-RPC are designed for Web services, and use http as the transport
    protocol.


    These methods are generally tied to an underlying framework, and are best studied
    as part of those environments. They can work together for unified “drag and drop”
    protocols etc.


