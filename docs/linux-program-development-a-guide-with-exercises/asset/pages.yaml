- img_proc: true
  md: '# 4.3 MORE COMPLICATED RULES


    +   * There may be many targets.


    We''ll work out in exercises, but some of the ways these matters might be addressed
    involve noting:


    +   * make can be recursive (call itself) and do it in subdirectories.

    * output files can be placed in other directories.

    * macros and environmental variables can be overridden on the command line.

    * more than one Makefile can be used; it can be selected based on command line
    specifications and environmental variables.


    # 4.3 More complicated rules


    Within Makefiles string variables can be set by simply using the = sign; assignment
    is not sticky, i.e., white space doesn''t matter.


    Within the Makefile these variables are used by preceding them with $ and surrounding
    them with parenthesis, e.g.:


    ```

    MYOBJS = a.o b.o c.o

    ...

    $(CC) -o foobar $(MYOBJS)

    ```


    Certain of these variables are predefined, by $(CC) and $(CFLAGS), but their values
    can be replaced in the Makefile or given on the make command line. By default
    the precedence is: command line first, assignment in Makefile second, and assignment
    in the shell environment third. If you have we


    ```

    export CFLAGS=''Wall''

    make foobar CFLAGS="-pedantic"

    ```


    the -pedantic flag will be the effective one.

    There are many things you can do in Makefiles; by no means are we trying to tell
    you everything. Full documentation can be obtained by doing info Make.


    A little more complicated examples would be:


    ```

    foobar: main.o sub1.o sub2.o

    gcc -0 -o foobar main.o sub1.o sub2.o

    main.o: main.c defs.h

    gcc -0 -c -I. main.c

    sub1.o: sub1.c sub1.h

    gcc -0 -c -I. sub1.c

    sub2.o: sub2.c sub2.h

    gcc -0 -c -I. sub2.c

    ```'
