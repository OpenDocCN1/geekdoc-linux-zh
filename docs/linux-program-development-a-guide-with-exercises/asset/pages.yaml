    Note that you may see depend on exactly which kernel you are using.


    The real time signals thus between SIGRTMIN and SIGRTMAX.


    The maximum queue length for real time signals can be seen and modified (per user)
    from the command line with the ulimit -i command, and from a program using getlimit()
    and setrlimit(), with the usual restriction that only a superuser can increase
    limit.


    If multiple real time signals of the same name are pending, they are delivered
    in FIFO order.


    The POSIX standard dictates that if more than one real time signal is pending,
    the lower number should be delivered first. Further Linux gives priority to normal
    signals over real time signals, although POSIX is mum on this issue.


