  md: '# 26.5 LABS


    | | | |

    |---|---|---|

    | SO_LINGER | struct linger | When enabled, closing the socket delays return until
    all queued messages have been sent or the timeout has passed. The structure contains
    the timeout value. |

    | SO_PRIORITY | int | Set a priority for all packets on the socket. |

