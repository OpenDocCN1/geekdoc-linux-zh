    \ for poll() one can use as an alternative enhanced function\n\n```\n#include\
    \ <poll.h>\n```\n\n```\nint poll(struct pollfd *fds, std::fd_t nfds, const struct\
    \ timespec *timeout,\nconst sigset_t *sigmask);\n```\n\nwhere the two new arguments\
    \ function exactly as in pselect().\n\n# 28.5 epoll\n\nBoth select() and poll()\
    \ suffer in performance when the number of file (socket) descriptors being watched\
