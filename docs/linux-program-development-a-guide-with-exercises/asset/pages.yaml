  md: '# SYSTEM V SHARED MEMORY


    ```

    time_t shm_dtime;      /* last detach time */

    time_t shm_ctime;      /* last change time */

    unsigned short shm_cpid;  /* pid of creator */

    unsigned short shm_lpid;  /* pid of last operator */

    short shm_nattch;        /* no. of current attaches */

    unigned                are private *

    unsigned short shm_pages;  /* size of segment (pages) */

    unsigned long               shm_pages;

    struct shm_desc *attaches;  /* descriptors for attaches */

    };

    ```


    cmd can have the following values:


    # Table 30.1: System V shared memory shmctl parameters


    | Value | Meaning |

    | IPC_STAT | Retrieve the shmid_ds structure and put in buf. |

    | IPC_SET | Set values of the shm_perm member of the shmid_ds structure to that
    in buf. |

    | IPC_RMID | Mark the shared memory segment for removal. |

    | SHM_LOCK | Prevent swapping of the segment. (Super user only) |

    | SHM_UNLOCK | Allow swapping of the segment. (Super user only) |


    Note that using IPC_RMID will not actually remove the segment; this will only
    happen all processes have detached from it. This is different from the other System
    V IPC mechanisms for which removal is immediate.


    The following limits are associated with shared memory segments:


    # Table 30.2: System V shared memory limits


    | Parameter | Value |

    | SHMMAX | 32 MB | Maximum size for a segment. |

    | SHMIN | 1 B | Minimum size for a segment. |

    | SHMNI | 4096 | System wide maximum number of segments. |

    | SHSEG | SHMNI | Maximum number of segments for process. |

    | SHMALL | (SHMMAX/PAGE_SIZE)*(SHMNI/16) = 2 M (8 GB) | System wide maximum for
    shared memory pages. |


    Here''s an example of a minimal program that sets up a shared memory segment,
    attaches to it, detaches from it, and marks the shared memory segment for removal:'
