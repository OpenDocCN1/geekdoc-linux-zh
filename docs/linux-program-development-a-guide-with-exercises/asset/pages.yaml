  md: 'When act is NULL, a new handler for signum is taken from. When oldact is not
    NULL, the previous act() is retrieved into it.


    sa_handler() is either SIG_DFL for the default action, SIG_IGN to ignore the signal,
    or a pointer to

    a signal handler.


    sa_sigaction() is an alternative signal handler, to be used instead of sa_handler(),
    with some

    other capabilities. We will detail its use when we discuss siginfo.


    You cannot use both sa_sigaction() and sa_handler() at the same time; there is
    a union involved

    and you choose one or the other. If you choose the second one will wipe out the
    first.


    sa_mask is a mask of signals to be blocked while the handler executes. (Note that
    the signal which

    invoked the handler will also be blocked unless SA_NODEFER and SA_NOMASK are used
    in sa_flags).


    sa_restorer() is an historical vestige and should not be used. It is not part
    of the POSIX standard.

    There has been discussion in the past about using this field for various purposes
    but it seems

    to have dried out.


    sigaction() has the same error codes as other functions which operate on signal
    sets.


    sa_flags field modifies the signal handling behaviour. It is made up of the bitwise
    OR of any

    combination (or none of) the following:


    # Table 16.8: Signal handler flags


    | Flag | Meaning |

    |---|---|

    | SA_NOCLDSTOP | If signum is SIGCHLD, no notification when child processes stop.
    |

    | SA_ONESHOT | Restore the signal to its default state once the handler is done.
    |

    | SA_RESTART | System calls returning EINTR are restarted after the signal is
    handled. There are some exceptions such as sleep() and pause(), for which restarting
    could lead to an infinite loop. System calls which return -ERRETS always restart.
    |

    | SA_NOMASK | Don''t prevent the signal from being received from inside its own
    signal handler. If SA_NOMASK is used, the signal field (sa_mask) is ignored completely;
    the list of blocked signals for the process remains unchanged while the handler
    executes. |

    | SA_NODEFER | |

    | SA_SIGINFO | Use the sa_sigaction() function as the handler instead of sa_handler().
    Three arguments are specified, not one. |'
