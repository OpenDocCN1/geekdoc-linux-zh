  md: '# CHAPTER 11. ADVANCED FILE OPERATIONS


    +   - The tmpfs filesystem (mounted on /dev/shm) provides an easy way to generate
    temporary files that leave no record on the persistent filesystem.


    +   - This filesystem exists purely in memory (i.e., it is a ramdisk) and creating
    temporary files in this location can lead to significant performance boosts, since
    no actual disk operations are required. No special permissions are needed to create,
    use and remove files under /dev/shm and they can be easily removed after use and
    disappear automatically on reboot.


    # 11.7 Other System Calls


    ioctl()


    This function (whose name stands for Input/Output Control) is a multi-purpose
    system call which can be used to control a particular device or class of device:


    ```

    #include <sys/ioctl.h>

    ```


    ```

    int ioctl(int fd, int command, char *argp);

    ```


    The command parameter controls what the ioctl() will do and has to be known to
    the hardware or software device which has already been opened and connected to
    file descriptor fd.


    The third argument is really a pointer whose meaning depends on the command. For
    many commands it is unused.


    On success 0 is returned, and on error -1 is returned with errno set. The possible
    error returns are:


    Table 11.10: ioctl() error return values


    | Value | Meaning |

    |---|---|

    | EBADF | Bad file descriptor fd. |

    | ENOTTY | File descriptor fd not associated with a character special device.
    |

    | EINVAL | Invalid command or argp. |


