  md: '# Chapter 5


    # Source Control


    ![](img/f604778e5fd8b5339b52bd5345099d26_50_0.png)


    We will learn about source control tools under Linux, focussing on RCS, CVS and
    Subversion. We''ll also examine the git tool, used for source control for the
    Linux kernel.


    | 5.1 Source Control . . . . . . . . . . . . . . . . . . | 27 |

    | 5.2 RCS and CVS . . . . . . . . . . . . . . . . . . | 28 |

