    # 3.1 Static Libraries


    Static libraries have the extension .a. When a program is compiled, full copies
    of any loaded library routines are make part of the executable.


    The following tools are used for maintaining static libraries:


    +   * ar creates, updates, lists and extracts files from the library. The command


    `ar rv libsubs.a *o`'
