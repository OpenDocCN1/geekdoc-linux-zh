  md: '# 13.6 Constructors and Destructors


    The gcc compiler permits the use of special constructor() and destructor functions.


    The constructor functions are called before the main() routine is called.


    The destructor functions are called after the exit() function is called from main();
    if exit() or return() is not explicitly called, the destructors will still be
    called.


    We already saw the use of these methods in our discussion of libraries, and repeat
    the example of how they are used:


    ```

    /* prototype them with attributes */

    void init_fun(void) __attribute__ ((constructor));

    void exit_fun(void) __attribute__ ((destructor));

    /* define them */

    void init_fun(void) { ... whatever ... };

    void exit_fun(void) { ... whatever ... };

    ```


    # 13.7 Waiting


    The parent process can wait (suspend execution) until one of its child processes
    dies or is stopped, or a signal interrupts it.


    ```

    #include <sys/types.h>

    #include <sys/wait.h>


    pid_t wait(int *status);

    pid_t waitpid(pid_t pid, int *status, int options);

    ```


    wait() returns on any child process; waitpid() on a particular process or set
    of processes.


    status contains the exit status of the process, unless it is set to NULL. The
    following interrogation macros can be used:


    Table 13.3: Wait status interrogation macros

    | Macro | Meaning |

    | WIFEXITED(status) | Non-zero if the child exited normally. |

    | WEXITSTATUS(status) | If WIFEXITED is non-zero, returns child exit code. |

    | WIFSIGNALED(status) | Non-zero if terminated by uncaught signal. |

    | WTERMSIG(status) | If WIFSIGNALED is non-zero, returns signal number. |

    | WIFSTOPPED(status) | Non-zero if the child has stopped on a signal. |

    | WSTOPSIG(status) | If WIFSTOPPED is non-zero, returns signal number. |


    The macros WIFSTOPPED() and WSTOPSIG() are meaningful only if the flag WUNTRACED
    is given.'
