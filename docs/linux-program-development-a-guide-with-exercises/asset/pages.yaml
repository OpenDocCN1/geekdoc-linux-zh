  md: '# 13.9 LABS


    parent; the child is then adopted by the init process with process ID = 1.

    Other steps are taken including:


    +   - Closing all file descriptors and then redirecting stdin, stdout and stderr
    to /dev/null, thereby breaking any association from the controlling terminal.

    - Becoming the session and process group leader.

    - Setting the root directory to /. This lets one potentially unmount the file
    system the process was started from, and also avoids security and other errors
    that would depend on where the process was started.


    One can construct this all by hand, but to make things easy one can use the function:


    ```

    #include <unistd.h>

    int daemon (int nochdir, int noclose);

    ```


    If nochdir is not zero, the root directory is not reset to /.

    If noclose is not zero, standard input, output and error are not redirected to
    /dev/null.


