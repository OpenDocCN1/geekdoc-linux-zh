  md: "Note that it is also possible to set the SO_LINGER option on the socket, using\
    \ the setsockopt() function we will discuss. This gives more control over the\
    \ close() method, enabling flushing the socket receive and send buffers before\
    \ the actual release. In this case it is important to check the return value of\
    \ close(), a step which is often neglected.\n\n# 23.5 Unix Client\n\nHere's a\
    \ simple example of a PF_UNIX socket client.\nit reads one line from standard\
    \ input, sends it to the local socket, /tmp/mysock, and then terminates.\n\n```\n\
    #include <stdlib.h>\n#include <stdio.h>\n#include <unistd.h>\n#include <sys/socket.h>\n\
    #include <sys/un.h>\n\n#define MSG_LEN 1024\n\nint main (void) {\n    struct sockaddr_un\
    \ uaddr;\n    int msg_len, sd;\n    char message[MSG_LEN];\n\n    uaddr.sun_family\
