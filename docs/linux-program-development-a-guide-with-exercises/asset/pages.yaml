  md: '# Chapter 26


    # Sockets - Options


    ![](img/f604778e5fd8b5339b52bd5345099d26_230_0.png)


    We''ll show how socket behaviour can be modified through the use of the fcntl()
    and ioctl() system calls on open socket descriptors. We''ll also consider examining
    and modify socket options directly.


    +   26.1 Getting and Setting Socket Options . . . . . . . . . . . . . . . . 207

    26.2 fcntl() . . . . . . . . . . . . . . . . . . . . . . . . . . 208

    26.3 ioctl() . . . . . . . . . . . . . . . . . . . . . . . . 209

    26.4 getsockopt() and setsockopt() . . . . . . . . . . . 209

    26.5 Labs . . . . . . . . . . . . . . . . . . . . . . . . . . . 211


    # 26.1 Getting and Setting Socket Options


    There are a number of ways to get and set options for sockets. For a particular
    sending or reception of a packet, one can set flag values to control behaviour.


    The most general form for getting and setting options is to use the getsockopt()
    and setsockopt() functions.


    It is also possible to set options by using the fcntl() (file control) and ioctl()
    (input/output control) functions.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 26.2 fcntl()


    fcntl() function (the name stands for file control) is used to control a number
    of characteristics descriptors. In the following we limit our attention to those
    of interest when the descriptor is associated with a socket.


    fcntl() can be used a number of ways to influence or modify the way a socket descriptor
    is:


    ```

    #include <unistd.h>

    #include <fcntl.h>

    ```


    ```

    int fcntl (int sd, int cmd);

    int fcntl (int sd, int cmd, long arg);

    ```


    fcntl() depends on the value of cmd:


    Table 26.1: fcntl() parameters


    | Flag | Operations |

    | F_GETFL | Read all the flags of the file descriptor and give them as the return
    value. |

    | F_SETFL | Set the descriptor''s flags to arg; |

    | F_GETOWN | Find out the process ID of the socket owner; i.e., who is to receive
    the signals SIGIO and SIGURG, and give it as the return value. |

    | F_SETOWN | Set the socket owner. |

    | F_GETSIG | Find out what signal is sent when I/O becomes possible. |

    | F_SETSIG | Set the signal to be sent when I/O becomes possible. A value of 0
    sets this to SIGIO. The return value is the signal to be sent, or zero if SIGIO.
    |


    The only flags that can be set for a socket are:


    +   * O_NONBLOCK: The socket for non-blocking operation.

    "* O_ASYYNC: Send the SIGIO signal when input or output becomes possible on the
    descriptor. The signal to be sent can be modified. This flag is not available
    on all operating systems."


    Common mistake is not to preserve the unmodified flag values when using fcntl().
    For example the following code avoids this problem:


    ```

    flags = fcntl (sd, F_GETFL, 0);

    fcntl (sd, F_SETFL, flags | O_NONBLOCK);

    ```


    The signal SIGURG is sent when out-of-band data arrives on a socket (This will
    cause select() to report an exceptional condition.) The use of F_SETSIG, F_GETSIG
    is Linux-specific, and generally not portable.


    When a socket is created it is considered as not having an owner. But when a new
    is created from a listening socket, the owner is inherited from the listening
    socket connected.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# 26.4. GETSOCKOPT() AND SETSOCKOPT()


    # 26.3 ioctl()


    ioctl() function (the name stands for input/output control) can be used for almost
    any hardware device and many kernel facilities, to examine and set behaviour.


    The prototype of this function is:


    ```

    #include <sys/ioctl.h>

    int ioctl(int sd, int command, char *arg);

    ```


    where the third argument is optional, depending on the value of the second argument,
    command. Restricting ourselves to those possible commands that are directly of
    interest to sockets, we have:


    Table 26.2: Socket ioctl commands


    | Command | Meaning |

    |---|---|

    | SIOCGSTAMP | Return the third argument a struct timeval timestamp for the last
    packet passed to the user on this socket. |

    | SIOCSPGRP | Set the process (or group) receiving the SIGIO and SIGUR signals;
    in this case the third argument points to a process ID. This is equivalent to
    using fcntl() with F_SETOWN. |

    | FIOCASYNC | Reset the value of O_ASYNC flag; the third is the flag. This is
    equivalent to using fcntl() with F_SETFL and 0_ASYNC. |

    | SIOCGPGRP | Get the current process (or group) receiving the signals. This is
    equivalent to fcntl() with F_GETOWN. |


    The last three duplicate the abilities of fcntl(), and as far as Posix is concerned,
    the use of ioctl() is deprecated in favor of it. However, you are quite likely
    to encounter code that is using the ioctl() interface.


    There are many other commands which are of interest to networking in general,
    rather than just sockets. These have to do with routing and interfaces. See man
    7 socket for detailed information.


    # 26.4 getsockopt() and setsockopt()


    In order to examine or modify the characteristics of a socket, one uses the functions:


    ```

    #include <sys/types.h>

    #include <sys/socket.h>

    int getsockopt(int sd, int level, int optname, void *optval, socklen_t *optlen);

    int setsockopt(int sd, int level, int optname, const void *optval, socklen_t optlen);

    ```


    The socket must have previously been opened with sd being a valid socket descriptor.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# CHAPTER 26. SOCKETS - OPTIONS


    The level argument indicates the general type of option manipulated. The value
    SOL_SOCKET works at the socket level, the value IPPRTO_IP works at the IPv4 level,
    etc.


    The particular option examined or set is defined by the name argument, optval
    points to a buffer that either contains the value of option to be set, or returns
    the current value. The length of that buffer is returned in the last argument
    of the function, and is supplied in the function. (Note that in setsockopt() this
    last argument is not a pointer!)


    For most socket-level options optval is either an integer value, and in the case
    of boolean on/off situations a value of 1 turns it on, and 0 turns it off. Remember
    we enabled a socket for immediate reuse with the code:


    ```

    int yes=

    setsockopt(sd, SOL_SOCKET, SOL_REUSEADDR, &yes, sizeof(yes));

    ```


    as a typical example.


    The socket level options Linux understands are listed by man 7 socket, and we
    are:


    Table 26.3: Socket options


    | Value | Type | Meaning |

    | --- | --- | --- |

    | SO_KEEPALIVE | int | Periodically check to see if the connection is still alive.
    Out of band data should be left in line. |

    | SO_GOADDRIN | int | |

    | SO_RCVLOWAT | int | Receive and Send buffer low water marks, the minimum bytes
    in the buffer before data is passed to the protocol or the user. Under Linux this
    value is always 1 |

    | SO_SNDLOWAT | | |

    | SO_RCVTIMEO | struct timeval | Receive and Send timeouts, before errors are
    reported. These cannot be modified under Linux |

    | SO_SNDTIMEO | | |

    | SO_BSDCOMPAT | int | Enable BSD bug compatibility; obsolete and only for UDP
    |

    | SO_PASSCRED | int | Enable reception of the S_CREDENTIALS control message. |

    | SO_PEERCRED | struct ucred | Return credentials of a foreign process connected
    to the socket. Only by PF_UNIX can it be examined, not set. |

    | SO_BINDTODEVICE | char * | Bind to a particular device (such as eth0). Passing
    an empty string creates a binding. |

    | SO_DEBUG | int | Enable tracing. For super-users. |

    | SO_REUSEADDR | int | Allow reuse of local addresses |

    | SO_TYPE | int | Get the socket type (e.g., SOCK_STREAM). |

    | SO_DONTROUTE | int | Bypass routing table; used only for directly connected
    hosts. |

    | SO_BROADCAST | int | Enable to receive or send broadcast datagrams. |

    | SO_SNDBUF | int | Get or set the maximum send buffer. See /proc/sys/net/core/wmem_default
    and /proc/sys/net/core/wmem_max. |

    | SO_RCVBUF | int | Get or set the maximum socket receive buffer. See /proc/sys/net/core/rmmem_default
    and /proc/sys/net/core/rmmem_max. |'
  merge: -1
