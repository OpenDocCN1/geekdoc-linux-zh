  md: '# 9.6 LABS


    # Lab 1: Using the loopback Filesystem


    The loopback filesystem driver can be used to mount a file to be used as a hard
    disk image. This can be very useful for mounting CD or DVD images as filesystems
    as well as simulating or learning about various types of filesystems.


    First you''ll have to create a file for the use and it is best to fill it with
    zeros by doing:


    ```

    # create a 200 MB loopback file

    $ dd if=/dev/zero of=/tmp/fsimage bs=1024 count=204800

    ```


    We can then create an ext3 filesystem on it with:


    ```

    $ mkfs.ext3 /tmp/fsimage

    ```


    and mount it (as root) with:


    ```

    $ mkdir /tmp/mnt

    $ mount -o loop /tmp/fsimage /tmp/mnt

    ```


    and can verify its mounting and check capacity with:


    ```

    $ df /tmp/mnt

    ```


    | Filesystem Type | K-blocks | Used Available Use% Mounted on |

    | /tmp/fsimage ext3 | 198337 | 5664 | 182433 | 4% | /tmp/mnt |


    You may now go ahead and create files, read and write them etc. Such files will
    survive unmounting (with unmount /tmp/mnt) and remounting in any location.


    You can do this with other filesystem types as long as you have both kernel support
    for them (examine /proc/filesystems) and the appropriate tool for formatting,
    such as mkfs.ext4 or mkfs.vfat, etc.'
