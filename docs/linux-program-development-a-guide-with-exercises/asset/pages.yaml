- img_proc: true
  md: '# 20.3. STREAM SOCKETS


    handshaking and agreement over protocols.


    Basic documentation can be obtained by doing man 7 socket and man 7 unix.


    # 20.3 Stream Sockets


    A stream socket is connection-oriented; two sockets will be plugged into each
    other and any data can flow back and forth, the connection must be established.


    The most common type of stream socket has the type known as SOCK_STREAM.


    In addition Linux supports the type known as SOCK_SEPACKET which is similar the
    packets of data are of fixed length and when reading from such a socket, only
    the amount of data requested is returned, and the rest discarded.


    Stream sockets are reliable: the integrity of packets is checked and if there
    is any corruption they are dropped. Packets are not successfully sent and acknowledged
    until resent until is achieved.


    Data sent through stream sockets is ordered; while packets may take different
    times to reach their destination and arrive out of order, the kernel will order
    them upon arrival.


    Communication is full-duplex; each end of a connection is free to read and write
    as long as permissions are appropriate.


    The connected sockets may be on the same machine or on any two points of a network;
    this will change the communication domain, but not the type.


    # 20.4 Datagram Sockets


    Datagram sockets are connectionless; the two socket endpoints are not connected
    before mission can start.


    The most common type of datagram socket has the type known as SOCK_DGRAM.


    In addition Linux supports the type known as SOCK_RDM (for Reliable Delivered
    Messages) which is similar except the packets are guaranteed to arrive.


    Datagram sockets are unreliable: the integrity of packets is not checked, and
    if any packets are dropped because of traffic or corruption they are not reset.
    It is up to the receiving application to maintain its own flow control.


    Data sent through datagram sockets is unordered; if packets take different times
    to reach their destination and arrive out of order, the kernel will not order
    them upon arrival. Once it is up to the receiving application to perform any ordering
    operations.


    Communication is full-duplex; each end of a connection is free to read and write
    as long as permissions are appropriate.


    The connected sockets may be on the same machine or on any two points of a network;
    this will change the communication domain, but not the type.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 20.5 Raw Sockets


    Raw sockets permit user-space implementation of the IPV4 protocols. Layers in
    the TCP/IP stack are bypassed, and the socket sends and receives raw datagrams
    (excluding the link-level headers, such as for Ethernet.)


    Only super-users can gain access to raw socket facilities.


    While many Unix-like operating systems have a raw socket implementation, the lack
    of standardization is such that portability is unlikely.


    Raw sockets are used by networking utilities, such as traceroute and ping, and
    Internet security and filtering tools. They are also useful in the development
    of new protocol implementations.


    # 20.6 Byte Ordering


    When multi-byte values are sent over the network, all nodes must agree about how
    the bytes (or octets) are usually called in network parlance) to be ordered, if
    communication is to be effective.


    The network order is which the high-order byte is at the starting address. This
    is also known as Big-endian, and is used natively on many architectures, such
    as all Sun platforms.


    In the Little-endian order, the low-order byte is at the starting address. This
    is also the native architecture on many platforms, including all x86 machines.


    Just to give an example, consider the 16-bit short int representation of the number
    700 (0x02BC) . is stored in memory cells 1000-1001, we find:


    Table 20.1: Byte ordering


    | Order | *1000 | *1001 |

    | Little Endian | BC | 02 |

    | Big Endian | 02 | BC |


    Note that there are even architectures which can run with either byte-ordering,
    although it cannot be changed on the fly.


    Mistakes with byte order are quite common, and some can go undetected until an
    application is ported to another platform, or tested on a network which has machines
    of both byte-orders.


    For instance, while it is necessary to properly convert a 32 bit Internet address
    in order to make a connection, such errors would be caught, failing to convert
    a 16 bit port assignment may go undetected as the error is twice; i.e., in both
    the client and the server.


    Even when storing multi-byte values in local address structures, it is necessary
    to do the byte swapping conversions; while it would be possible to have this done
    transparently to the application, in the kernel networking layers, this would
    go against the Posix specification which requires certain fields be maintained
    in network byte order.'
  merge: -1
