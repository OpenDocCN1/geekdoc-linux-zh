    # 1.1 Procedures


    You will need a computer installed with a current Linux distribution, with the
    important developer tools (for compiling, etc.) properly deployed.


    The emphasis will be on hands-on programming, with most sections having laboratory
    exercises. Where feasible labs will build upon previous lab assignments. The solution
    set can be retrieved from http://www.coopj/LPD. As they become available, errata
    and updated solutions will also be posted on that.


    Lab solutions are made available so you can see at least one successful implementation,
    and a possible template to begin the next lab exercise if it is follow up. In
    addition, examples as shown during the exposition are made available as part of
    the SOLUTIONS package, in the EXAMPLES'
