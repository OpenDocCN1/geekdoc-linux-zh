  md: "# CHAPTER 28. SOCKETS - MULTIPLEXING AND CONCURRENT SERVERS\n\nThe 2.6 kernel\
    \ introduces the new epoll set of system calls, for which the time taken to locate\
    \ the descriptor for action is independent of the number; i.e., it is O(1) algorithmically.\n\
    The relevant functions and data structures for user applications are to be found\
    \ in /usr/include/sys/epoll.h.\n\n```\n#include <sys/epoll.h>\n\nint epoll_create(int\
    \ size);\nint epoll_ctl(int epfd, int fd, struct epoll_event *event);\nint epoll_wait(int\
    \ epfd, struct epoll_event *events, int maxevents, int timeout);\n\ntyped union\
    \ epoll_data {\n    void *ptr;\n    int fd;\n    uint32_t u32;\n    uint64_t u64;\n\
    } epoll_data_t;\n\nstruct epoll_event {\n    uint32_t events;\n    epoll_data_t\
    \ data;\n}\n```\n\nFirst one calls epoll_create(), passing in the maximum number\
    \ of file descriptors the process will need to manage. This functions returns\
    \ a special file descriptor (epfd) which is used as input for the other functions,\
    \ and which should have a normal close() applied to it when done.\nThe function\
    \ epoll_ctl() should then be called for each file descriptor of interest, where\
    \ op can be:\n\n# Table 28.4: epoll operations\n\n| EPOLL_CTL_ADD | Add a file\
    \ descriptor |\n| EPOLL_CTL_DEL | Remove a file descriptor |\n| EPOLL_CTL_MOD\
    \ | Change the epoll_event structure for a file descriptor. |\n\nThe epoll_event\
    \ has a data structure embedded in it that is a union so it can be used in different\
    \ ways. Using it as void *ptr it can hold as much detailed information about the\
    \ file descriptor and activity you choose to use.\nThe events field of the data\
    \ structure is a bit mask of what events would inspire attention. For the instance\
    \ value EPOLLIN | EPOLLOUT would indicate the file is available for read and/write\
    \ operations. (See man epoll_ctl for the full set of event types).\nNot that set\
    \ up is, one can enter into a loop around epoll_wait() which will wait until to\
    \ maxevents are available. If timeout = NULL, there is no blocking and an immediate\
    \ return, and if timeout = -1 the wait is infinitely long."
