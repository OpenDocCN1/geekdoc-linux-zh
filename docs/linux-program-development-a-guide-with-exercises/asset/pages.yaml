    \ <sys/shm.h>\n#include <string.h>\n\nint main (int argc, char *argv[]) {\n  \
    \  int shmid;\n    void *shared_mem;\n\n    shmid = shmget((key_t) 89, pagesize\
    \ (), 0666 | IPC_CREATE);\n    shared_mem = shmat(shmid, (void*)0, 0);\n    strcpy(shared_mem,\
    \ \"a string\");\n\n    /* do something */ sleep (5);\n\n    shmdt(shared_mem);\n\
