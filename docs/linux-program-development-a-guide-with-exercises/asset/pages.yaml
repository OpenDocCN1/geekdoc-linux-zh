  md: "# SPLICE(), VMSPLICE AND TEE\n\nThe input/output offset arguments, off_in,\
    \ off_out, require some care. File descriptors corre-sponding to a pipe must be\
    \ NULL or return an error. For normal file descriptors a NULL offset just a normal\
    \ read and the file position is advanced. If the offset is not NULL the read or\
    \ write begins from the offset, the file position is not advanced; i.e., the read/write\
    \ calls function like read(), write().\n\nOne or both of the file descriptors\
    \ must be a pipe or an error is returned. On successful execution splice() returns\
    \ the number of bytes transferred.\n\nBefore looking at the flags argument we\
    \ consider why this system call exists and what it does. One could accomplish\
    \ the same thing with normal reads followed by writes. However, this involves\
    \ significant overheads:\n\n+   - One has to make system calls, not one.\n- One\
    \ has to create a buffer to store the data from the read before doing the write.\n\
    \nOf course one could keep the buffer small by chunking the I/O but that just\
    \ raises the number of system calls.\n\nWe will see that the sendfile() system\
    \ call has some of the objectives when the output file descriptor is a socket,\
    \ and indeed the goal is to eventually implement sendfile() in terms of the newer\
    \ system call splice().\n\nThese considerations are not the whole picture. Essentially\
    \ splice() makes a kernel buffer available to user-space. Whenever there is no\
    \ movement of data, only passing pointers. The kernel does this by implementing\
    \ a pipe buffer as a set of pointers (which are reference-counted) to pages of\
    \ memory. Copies do not involve copying the pages, just the pointers.\n\nThe second\
    \ system call,\n\n```\nlong tee fd_in, int fd_out, size_t len, unsigned int flags;\n\
    ```\n\ncopies up to len bytes by pipe fd_in to pipe fd_out without consuming the\
    \ data; i.e, a splice() after a tee() will still see the data. It functions like\
    \ the command line tee utility and can be used to split an output stream to two\
    \ different destinations.\n\nThe third system call,\n\n```\n#include <sys/uio.h>\n\
    ```\n\n```\nstruct iovec {\n    void *iov_base;      /* Starting address */\n\
    \    size_t iov_len;      /* Number of bytes */\n};\n```\n\ntakes nr_segs of user\
    \ memory, each described by an iovec structure, and maps them into fd, which must\
    \ be a pipe descriptor. Doing I/O on the pipe thus works on the memory buffers.\n\
    \nThe flags in these system calls are a combination of the following values:"
