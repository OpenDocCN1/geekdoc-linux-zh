  md: '# 2.4. OTHER LANGUAGES


    as well as a lot of minimum and maximum limits.

    The include path can be listed with:


    ```

    gcc -v -E foo.c

    ```


    foo.c should exist (even if it is empty), and on a recent x86_64 Red Hat system
    would be:

    /usr/local/include

    /usr/lib/gcc/x86_64-redhat-linux/4.1.2/include

