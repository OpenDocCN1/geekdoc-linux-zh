- img_proc: true
  md: '# 1.3. STANDARDS AND THE LSB


    Explicitly we have used:


    +   * Red Hat Enterprise Linux 5.4

    * Fedora 12

    * Centos 5.4

    * Scientific Linux 5.4

    * Open Suse 11.1

    * Debian Lenny

    * Ubuntu 9.10

    * Gentoo


    As far as software installation and control is concerned distributions tend to
    use RPM-based or deb-based package management. In the above list Red Hat, Fedora,
    Centos, Scientific Linux and OpenSUSE are RPM-based, Debian and Ubuntu are deb-based.
    When necessary we will give required instructions for each of these two broad
    families.


    GENTOO is based on neither of these packaging systems, and instead uses the portage/emerge
    system which involves compiling directly from source. If you are a GENTOO user,
    and you have successfully accomplished a fully functional installation (which
    is generally not a task for novices) you won''t need detailed instructions in
    how to install and find things, and so we won''t insult you by offering it.


    If you are running any other distribution shouldn''t have any trouble adapting
    what we are doing to your installation.


    # 1.3 Standards and the LSB


    There are a variety of different standards (specifications) that are relevant
    to working on Unix-like operating systems such as Linux. For example, typical
    man page (such as the one for open() in the following example) might have a statement
    in its CONFORMING TO section such as:


    CONFORMING TO


    ```

    SVR4, 4.3BSD, POSIX.1-2001. The O_NOATIME, O_NOFOLLOW, and O_DIRECTORY

    flags are Linux-specific. One may define the _GNU_SOURCE macro

    to get their definitions.

    ```


    The history of the different standards and specifications is complicated and much
    wrapped up in the convoluted Unix family tree with two main branches, BSD and
    System V. For the most Linux strives to be Posix-compliant, a later standard that
    incorporates earlier ones and stands for Portable Operating System for Unix. However,
    Linux distributions are not generally certified as Unix-compliant as the rapid
    development pace is not amenable, and the cost is high and the derived benefits
    would generally be considered marginal.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'It is important, however, that software developed for Linux is portable across
    different distributions without much pain, and the LSB specification (Linux Standard
    Base) has stepped into that role. It''s home page is at http://www.linuxbase.org
    and it is administered by the Linux Foundation, http://www.linuxfoundation.org.


    In addition to coding considerations, the LSB also considers matters such as standard
    utilities and libraries required, where various things are put on the filesystem
    etc. If one follows the specification, one should be able to develop on any distribution
    and use on any other if both are LSB-compliant.'
  merge: -1
