- img_proc: true
  md: '# CHAPTER 22. SOCKETS - PORTS AND PROTOCOLS


    It is important that all network programs agree about what port numbers are associated
    with particular services. Deed a central registry is maintained by the Internet
    Assigned Numbers Authority (IANA). http://www.iana.org/assignments/port-numbers


    Ports 0-1023 are formally known as Well Known Ports. For instance ftp is assigned
    to port 21, and http to port 80.


    These well known ports are reserved, in the sense that only a super-user process
    can assign these to a socket. This prevents a rogue server from masquerading a
    service. However, super-user clients are perfectly capable of connecting to such
    sockets.


    Ports 1024-49151 are known as Registered Ports. IANA does not control these ports
    but does register them and list their use. For instance quake is assigned to port
    26000, and traceroute is assigned to port 3344.


    Ports 49152-65535 are known as Ephemeral Ports, Dynamic Ports, or Private Ports.
    IANA has nothing to say about these values.


    Ephemeral Ports are used by clients. They are meant to be short lived (through
    the life of the process at most). A client never cares what the actual value is,
    only that it is unique. This is guaranteed by the relevant transmission protocol,
    which takes care of assigning and releasing these dynamic objects.


    The current list of port assignments is maintained in the file /etc/services.
    (On other operating systems the file may be elsewhere, but it is at this location
    under Linux.) Looking at just a few lines near the top we see


    ```

    # service-name port/protocol [aliases ...] [# comment]


    tctpmux   1/tcp               # TCP port service multiplexer

    tctpmux   1/udp               # TCP port service multiplexer

    rje      5/tcp               # Remote Job Entry

    rje      5/udp               # Remote Job Entry

    echo     7/tcp

    echo     7/udp

    discard   9/tcp               sink null

    discard   9/udp               sink null

    ....

    ```


    and note the following:


    +   - The same port number is assigned by both the UDP and TCP transmission protocols
    for a given service. This is official policy and is unusual except for some historical
    exceptions.

    - Even though services use only one particular protocol, the port is delegated
    identically for both.

    - The service name can also have aliases; thus references to the services discard,
    sink and null are treated identically.

    - Appearance of an entry in the file no implies that the service is actually running.


    All networking programs should reference this list of services (through library
    functions) to ascertain'
