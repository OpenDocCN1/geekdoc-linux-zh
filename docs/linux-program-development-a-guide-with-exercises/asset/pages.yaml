  md: '```

    int pthread_sigmask(int how, const sigset_t *set, sigset_t *oldset);

    sigwait(const sigset_t *set, int *sig);

    ```


    The first function has the exact same arguments and use as sigprocmask(), except
    it affects only the current thread.


    The second function, sigwait() takes as its first argument a mask describing which
    signals to wait for; upon return the second argument contains which signal caused
    the return, which also supplies the return value if successful.


    Using these it is possible deal with signals without actually using signal handlers
    and sigaction(); one first blocks all possible signals in all threads with sigprocmask().
    Then one has a signal-dealing use sigwait() to deal with the signals. This can
    help avoid some complexities in signal handlers.


    # 18.5 Forking vs. Threading


    There are at least three basic approaches one can take when developing applications
    under Linux which lend themselves to threading:


    +   * Use the POSIX pthreads approach.

    * Use the parent/child fork (and possibly exec) approach.

    * Use the clone call directly.


    Some of the advantages and disadvantages are:


    +   * Use the threads approach is POSIX compliant, and recent improvements have
    improved both compliance and conformance.

    * The parent/child model is straightforward and very portable. However, creating
    new processes is expensive, and why not use the more modern multi-threaded approach?

    * The clone call is used (under Linux) to implement both of the other approaches.
    However it is very non-portable.

    * For short-lived tasks one should probably avoid forking; the overhead for creating
    a new process is expensive, while threads are much cheaper. On the other hand,
    if the new task can be performed without much interaction with the parent, forking
    is a better solution than is easier and more portable.


    Thus each application requires evaluation as to which is the proper programming
    framework; there is no "one size fits all" solution.'
