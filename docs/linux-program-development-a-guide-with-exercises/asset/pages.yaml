    \ signal (int signum, sighandler_t handler);\n```\n\nsignal returns the value\
    \ of the handler, or SIG_ERR on error.\n\nAccording to the man page, under Linux\
    \ signals are reset to their default behavior when raised. This is not true. An\
    \ inspection of the glibc source shows shows this to be otherwise. The reason\
    \ is that the signal() system call is actually never invoked; instead signal()\
    \ is called with flags that give different behaviour.\n\nThus, if you want to\
    \ be sure the default behaviour is reinstated you have to call signal() again\
    \ with SIG_DFL. If you want to make sure the default is not restored (portably)\
    \ you would have to make the signal handler reinstall itself after it deals with\
    \ a signal.\n\nThe signal that activates the handler is blocked while the handler\
    \ executes; however, the handler might be interrupted if another signal that it\
    \ handles is raised.\n\nAn example:\n\n```\n#include <signal.h>\n#include <stdio.h>\n\
    #include <unistd.h>\n\nvoid ouch (int sig)\n{\n    printf(\"OUCH! - I got a signal\
    \ %d\\n\", sig);\n    signal(sig, SIG_DFL);\n}\n\nint main ()\n{\n    signal(SIGINT,\
