    | Value | Meaning |

    | EEXIST | pathname already exists; O_CREATE and O_EXCL were used. |

    | EISDIR | pathname is a directory and write access is requested. |

    | EACCES | Access permission denied. |

    | ENAMOOLONG | pathname was too long. |

    | ENOENT | Part of pathname does not exist, or a dangling symbolic link. |

    | ENOTDIR | Part of pathname is not a directory or O_DIRECTORY was requested and
    it is not a directory. |

    | ENXIO | O_NONBLOCK | O_WRONLY, set the file is a FIFO, but is not open for reading.
    Or the special device file doesn''t exist. |

    | ENODEV | pathname is a device file that doesn''t exist. |

    | ENOFS | pathname is on a read only filesystem and write access was requested.
    |

    | ETMXTBSY | pathname is an executable image to which write permission was requested.
    |

    | EFAULT | pathname points to an illegal address. |

    | ELOOP | Too many symbolic links, or hit O_NOFOLLOW flag. |

    | ENOSPC | No room to create pathname. |

    | ENOMEM | Not kernel memory available. |

    | EMPFILE | Maximum number of files already open. |

    | ENFILE | System has reached its total file number limit |


    close() releases a descriptor so it loses association with any file and may be
    reused. All file locks are released. If unlink() has been used on the file and
    this is the last file descriptor currently in use that references it, the file
    will be deleted.


    On success close() returns 0; on failure returns -1, with errno set to EBADF,
    which means fd was not a valid file descriptor. Terminating processes implicitly
    call close() on all open file descriptors.


    # 10.3 Reading, Writing and Seeking


    These three functions access a file descriptor already obtained through open():


    ```

    #include <unistd.h>

    #include <sys/types.h>

    ```


    ```

    size_t read (int fd, void *buf, size_t count);

    size_t write (int fd, const void *buf, size_t count);

    off_t lseek (int fd, off_t offset, int whencece);

    ```


    read() gets byte counts from file descriptor fd and places them into buf.


    On success, read() returns the number of bytes read and the file position is advanced
    appropriately. If this is non-negative, but less than count, it means fewer bytes
    are presently available due to an end-of-file, no more data present on a read
    from a pipe or a terminal, or interruption by a signal.'
