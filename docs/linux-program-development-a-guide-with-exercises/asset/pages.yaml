  md: 'Each protocol deals with the address in its own way.


    In the above case the use of SOCK_STREAM indicates one is attempting to make a
    connection-based linking to a specific address (which is a host IP address or
    a path name) as specified in the second input parameter. This would be true for
    a specification of SOCK_SEQPACKET. Connection-based protocols may use connect()
    only for a given socket.


    If instead the above example had used SOCK_DGRAM it would have established a connection
    association with the specified address; where datagrams are to be sent, and from
    where they are to be received.


    A connectionless protocol can connect() to again establish a new address association.
    Releasing all association can be done by connecting again, using AF_UNSPEC in
    the sa_family element of the address.


    On success, connect() returns 0, and on failure returns -1 and errno appropriately.
    The possible error returns to connect() are:


    # Table 23.4: connect() error return values


    | Error | Meaning |

    | --- | --- |

    | EBADF | Invalid value for socket descriptor given. |

    | EFAULT | Address structure has an invalid address. |

    | ENOTSOCK | Socket descriptor not associated with a socket. |

    | EISCONN | Socket already connected |

    | ECONREFUSED | No one listening at remote address. |

    | ETIMEDOUT | Connection timed out, perhaps because server is too busy. |

    | ENETUNREACH | Network is unreachable. |

    | EADDRINUSE | Local address already in use. |

    | EINPROGRESS | A non-blocking socket; connection can not be completed at once.
    |

    | EALREADY | A non-blocking socket; a previous connection attempt has not yet
    finished. |

    | |

    | EAGAIN | No more free local ports. |

    | EAFNOSupport | Incorrect value in the sa_family field of the address |

    | EACCES, PERM | Either an attempt was made to broadcast with out the flags set,
    or a firewall prevented the connection. |


    After a connection has been made, the function


    ```

    int getsockname(int sd, struct sockaddr *addr, socklen_t *addrlen);

    ```


    will supply information about the address and port number assigned to the connection.


