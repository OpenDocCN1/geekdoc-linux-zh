  md: "# Host Information\n\nUp to now we have converged on numeric Internet addresses,\
    \ or their representation in dotted-quad notation; i.e., OX0CA80100 or 192.168.1.0.\
    \ However, in many if not most circumstances we prefer to use names (as coopj.com)\
    \ instead of numbers for at least three reasons:\n\n+   - They are easier to remember.\n\
    - Numbers may change while the name representation should be persistent.\n- Moving\
    \ to IPv6 will preserve the names while making the numbers (in the longer style)\
    \ much harder to type in correctly.\n\nBoth servers and clients interact with\
    \ DNS through a resolver library, the central functions of which are:\n\n```\n\
    #include <sys/socket.h>\n#include <netdb.h>\n\nstruct host *getostbyname(const\
    \ char *name);\nstruct host *getostbyaddr(const void *addr, int len, int type);\n\
    ```\n\ngetostbyname takes an input host name (either as a name or an IP number\
    \ in standard dot notation), and returns its IP address in the host structure\
    \ pointed to by its return value.\n\ngetostbyaddr does the inverse process. Its\
    \ first *addr is a pointer to an in_addr structure containing the binary address.\
    \ This structure has a length given by the second argument, and third argument\
    \ specifies the address family which is AF_INET or AF_INET6.\n\nSuccessful completions\
    \ return a pointer to a host structure, defined as:\n\n```\nstruct host {\n  \
    \  char *h_name;               /* official name of host *\n    char **h_aliases;\
    \          /* alias list */\n    int h_addrtype;             /* host address type\
    \ *\n    int h_length;               /* length of address *\n    char **h_addr_list;\
    \         /* list of addresses *\n}\n#define h_addr h_addr_list[0]  /* for backward\
    \ compatibility *\\/\n```\n\nThe h_name element contains a pointer to the so-called\
    \ canonical name of the host; this can be different than the actual host which\
    \ specific has moved to another host, in a fashion transparent to the user; i.e.,\
    \ it could be ftp.coopj.com instead of coopj.com.\n\nThe h_aliases argument contains\
    \ a NULL-terminated array of alternative names, or aliases, for the host."
