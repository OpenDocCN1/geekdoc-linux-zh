- img_proc: true
  md: '# CHAPTER 20. NETWORKING AND SOCKETS


    As packets move up and down through the networking layers, the kernel avoids copying
    by passing pointers to the encapsulated buffer, or payload, in the packet, with
    modifying headers and footers as necessary.


    The outermost header and footer correspond to the datalink layer, which describes
    the hardware, device driver, and the hardware type of network, such as Ethernet
    or Token Ring. For instance, the MAC address will appear here.


    The next layer describes the network protocol, such as IPv4, and the innermost
    header describes the transmission protocol, such as TCP or UDP.


    For reasons of optimization, the network and transport layers are not as completely
    separated as they might be in place. For instance the network layer implementations
    may contain implementations of the transport layer, rather than always passing
    through a common code base. For instance, both Internet and Unix sockets have
    their own dat (connectionless) code.


    # 20.2 What are Sockets?


    Communication through a socket is generally bi-directional, and can be multiplexed;
    i.e., data moves from and to socket, and more than one process can access the
    socket in each direction (at least in principle).


    The processes communicating may be related (in parent/child, or sibling threads),
    or completely unrelated. They may reside on the same machine, or on nodes anywhere
    on a local or world-wide network. Many Unix functions (such as ftp, finger, telnet,
    or lpr) use sockets.


    When a socket is created, it is associated with a so-called communication domain,
    or protocol family. For example, Unix domain sockets, use pipes (fifo''s), and
    are bound, or tied, to filesystem nodes. They are used for communication only
    on a local machine. Internet sockets are in the IPv4 or IPv6 communication domains,
    have no associated file system entries, and binding (naming) involves tying the
    socket to a specific Internet address (or range of addresses).


    Each communication domain has its own way of specifying an address, be it a local
    node on the filesystem, or a network address.


    The type of communication describes how data should be encapsulated and sent from
    one socket to another; although certain combinations of domain and type are more
    frequent, and not others.


    Two basic types are stream sockets (described as SOCK_STREAM), and datagram sockets
    (described as SOCK_DGRAM). These can also be considered as connection versus connectionless.
    We will describe them in detail shortly.


    Finally, with each socket is associated a protocol. For instance, sockets of the
    IP domain are usually used with the streaming Transmission Control Protocol (TCP),
    from whence the often used phrase TCP/IP. Note that the IP part deals with routing
    through the Internet, while the TCP part deals with data integrity; these are
    quite independent degrees of freedom.


    One can use datagram transmission, with UDP (User Datagram Protocol), across the
    Internet, which has the combination UDP/IP.


    Creation of a socket doesn''t do much and establish any communication. In order
    for a socket to be used, something has to be plugged into it and a connection
    has to be made, which requires'
