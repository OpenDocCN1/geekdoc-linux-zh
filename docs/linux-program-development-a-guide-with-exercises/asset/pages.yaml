  md: "# CHAPTER 3. LIBRARIES\n\n```\nvoid *dlopen(const char *filename, int flag);\n\
    const char *dlerror(void);\nvoid *dlsym(void *handle, char *symbol);\nint dlclose(void\
    \ *handle);\n```\n\nThe function dlopen() opens the shared library pointed to\
    \ by filename; otherwise if this begins with a / then is understood to be an absolute\
    \ path; or is looked for in the usual list for the system or in the LD_LIBRARY_PATH\
    \ environment variable.\n\nThe flag controls when symbols are resolved. only when\
    \ needed; when RTLD_NOW is used, resolution is immediate. In addition these flags\
    \ can be or' with RTLD_GLOBAL which makes the symbols available to all subsequently\
    \ loaded libraries.\n\nThe function dlsym() looks in the shared library pointed\
    \ to by handle (which is the return value of dlopen()), for the function or variable\
    \ pointed to symbol. It returns a pointer to the symbol which can be used.\n\n\
    The function dlclose() unloads the dynamic library.\n\nThe function dlerror()\
    \ returns NULL if no errors have occurred since the last of these functions has\
    \ been called); otherwise it returns a pointer to a string describing the error.\n\
    \nA short example shows how this hangs together:\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <dlfcn.h>\n\nint main (int argc, char *argv[])\n\
    {\n    void *handle;\n    void (*function)(void);\n\n    handle = dlopen(\"./libshared.so\"\
    , RTLD_LAZY);\n    if (handle) {\n        fprintf(stderr, \"error opening library\
    \ is %s\\n\", dlerror());\n        exit(-1);\n    }\n\n    function = dlsym(handle,\
    \ \"lib_function\");\n    function();\n    dlclose(handle);\n    exit(0);\n}\n\
    ```\n\nThis assumes that the library ./libshared.so exists and has a function\
    \ lib_function() in it, and that the resulting executable has been linked to libdl;\
    \ i.e, we have something like\n\n```\ngcc -O2 -Wall -pedantic -fPIC -shared -o\
    \ libshared.so libshared.c\ngcc -O2 -Wall -pedantic -o testit.c -ldl\n```\n\n\
    As a further refinement, the shared library contains constructor and destructor\
    \ functions, they will be called when the library is loaded and unloaded."
