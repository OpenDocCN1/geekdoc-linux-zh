    \ around their name in a ps listing).\ninit.\n\nIf the parent process dies before\
    \ the child, the pid of the child is set to 1; i.e., the process is adopted by\
    \ init.\n\nA process which terminates (either normally or abnormally) before its\
    \ parent, has not waited for it and examined its exit code is known as a zombie\
    \ (defunct) process. Zombies have released all resources and remain only to convey\
