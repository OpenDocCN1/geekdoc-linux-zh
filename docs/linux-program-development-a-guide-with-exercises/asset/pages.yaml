    # 10.1 Unix File I/O


    The basic file operations are opening and closing, reading and writing, and positioning
    within a file. Only a few functions are needed to perform these basic I/O operations
    under **Linux**: **open(), close(), read(), write(),** and **lseek().** These
    basic file operations are **unbuffered**, unlike the standard I/O functions we
    will discuss later.'
