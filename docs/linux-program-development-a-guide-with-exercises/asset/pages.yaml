  md: '# 16.8 LABS


    # 16.8 Labs


    # Lab 1: Signals


    Using the signal() interface for installing signal handlers, write a simple program
    to do pointless in an infinite loop. (Like printing out the same message after
    every second.)


    Upon getting CTRL-C (SIGINT) the program should print a message, but not die.


    Upon getting a CTRL-\ (SIGQUIT) it should call abort() to dump core.


    Note: Linux distributions set the maximum core dump size to 0. Ulimit -c to find
    what you actually have. If the maximum core dump size has to be, do it with ulimit
    -c [nbytes].


    # Lab 2: sigaction()


    Adapt the previous exercise (or start fresh) to use the sigaction() interface.
    Set up a signal set and mask to this.


    Have the SIGINT handler sleep for a couple of seconds; what happens if you send
    a SIGQUIT while it is sleeping?


    # Lab 3: Blocking Signals


    Adapt the previous exercise so that SIGQUIT is blocked while the handler for SIGINT
    is running.


    # Lab 4: Examining Signal Priorities.


    In the below, do not send or either of the signals SIGKILL or SIGSTOP.


    Write a C program that includes a signal handler that can handle any signal. The
    handler should avoid making any system calls (such as those that occur during
    I/O).


    The handler should simply store the sequence of signals as they come in, and update
    a counter array for each signal that indicates how many times the signal has been
    handled.


    The program should begin by suspending processing of all signals (using sigprocmask()).


    It should then install the new set of signal handlers (which can be the same for
    all signals, registering them with the sigaction() interface.


    The program should send every possible signal to itself multiple times, using
    the raise() function.


    Signal processing should be resumed, once again using sigprocmask().


    Before completing, the program should print out statistics:


    +   - The total number of times each signal was received.


    +   - The order in which the signals were received, noting each time the total
    number of times that signal had been received up to that point.'
