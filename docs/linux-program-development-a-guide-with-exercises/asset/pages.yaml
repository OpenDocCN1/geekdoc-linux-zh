  md: 'which success returns a non-negative integer known as the socket descriptor,
    which is similar

    in many ways to a file descriptor.


    However, unlike a file descriptor returned by the open() call, obtaining a socket
    descriptor successfully

    is not enough to be ready to input/output operations. In the case of a typical
    network client, one needs

    to follow this with a call to connect(). In the case of a typical server, one
    needs

    bind(), listen(), accept() sequence, and another descriptor will be generated
    first.


    The socket() function takes three integer arguments. The first of these is the
    domain, which

    specifies the protocol family (or communication domain) how data should be set
    out

    out over the network. The permissible values are defined in /usr/include/bits/socket.h,
    (included

    from /usr/include/sys/socket.h) and are:


    # Table 23.1: Socket domains


    | Domain | Value | Meaning |

    | PF_UNSPEC | 0 | Unspecified |

    | PF_LOCAL | 1 | POSIX name for PF_UNIX |

    | PF_UNIX, PF_FILE | PF_LOCAL | Domain Sockets |

    | PF_INET | 2 | Internet Protocol (IPv4), Version 4 |

    | PF_AX25 | 3 | Amateur Radio AX.25 Protocol |

    | PF_IPX | 4 | Novell IPX |

    | PF_APPETALK | 5 | Appletalk |

    | PF_NETROM | 6 | Amateur Radio NetROM |

    | PF_BRIDGE | 7 | Multi-protocol Bridge |

    | PF_ATMPVC | 8 | Access to Raw ATM PVC |

    | PF_X25 | 9 | ITU-T X.25 / ISO-8208 protocol |

    | PF_INET6 | 10 | Internet Protocol (IPv6), Version 6 |

    | PF_ROSE | 11 | Amateur Radio X.25 PLP |

    | PF_DECnet | 12 | DECnet |

    | PF_NETBEUI | 13 | Reserved for 802.2C project |

    | PF_SECURITY | 14 | Security callback pseudo AF |

    | PF_KEY | 15 | PF_KEY key management API (used for cryptography.) |

    | PF_NETLINK | 16 | Kernel-User Interface Pseudo-code |

    | PF_ROUTE | PF_NETLINK | Alias to Emulate 4.4BSD |

    | PF_PACKET | 17 | Low Level Packet Interface |

    | PF_ASH | 18 | Ash |

    | PF_ECONET | 19 | Acorn Ethernet |

    | PF_ATMSVC | 20 | ATM SVCs |

    | PF_SNA | 22 | Linux SNA Project |

    | PF_IRDA | 23 | IRDA sockets |

