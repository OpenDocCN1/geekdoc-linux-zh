    It then listens for clients trying to make connections:


    listen (sd, backlog);


    When it notices a client trying to contact it has to accept the connection:


    confd = accept (sd, &client_addr, addrnlen);


    It can then send or receive information through the socket:


    ```

    read (confd, buf, nbytes);

    write (confd, buf, nbytes);

    ```


    using standard Unix reads and writes the send and receive functions we''ll discuss
    later.


    When done with the client connection it should release it with:


    ```

    close (confd);

    ```


    Finally when done with all connections, it should release the socket with one
    of:


    ```

    close (sd);

    shutdown (sd, how);

    ```


    ![](img/f604778e5fd8b5339b52bd5345099d26_211_0.png)


    Figure 24.1: Basic Socket Server Sequences


    Note: for connectionless protocols, such as UDP, the listen() and accept() steps
    are not required;

    input/output operations will use sendto(), recvfrom().'
