  md: '# SENDFILE()


    # 25.5 sendfile


    Suppose you want to copy data from one file to another in an application. The
    simple way to do it would be something like:


    ```

    rc = read (fd1, buf, NBUF);

    rc = write (fd2, buf, rc )

    ```


    However, this is not very efficient for at least two reasons:


    +   - It requires two system calls, each of which requires the kernel switching
    in and out of kernel-mode from user-mode.

    - It requires temporary storage in buffer, which is then merely emptied out, requiring
    an extra copy operation and wasting of memory.


    The sendfile() function offers a way to handle this more efficiently:


    ```

    #include <sys/sendfile.h>

    ssize_t sendfile (int out_fd, int in_fd, off_t offset, size_t count);

    ```


    The data will be copied directly from file descriptor in_fd to file descriptor
    out_fd, starting from offset in the input file, and counting count bytes.


    While the value of offset will be incremented by the number of bytes read, the
    file position will not change; in this sendfile() operates similarly to the pread()
    and write() system calls.


    Thus the above code fragment now becomes:


    ```

    rc = sendfile (fd2, fd1, NBUF);

    ```


    While either file descriptor may refer to a socket, it is difficult and rarely
    required to copy from a socket to a file; the inverse operation, sending a file
    down a socket is more useful.


    In this case Linux makes use of zero-copy networking when using sendfile(). This
    means the file is sent directly to the network without any copying in the kernel
    as well.


    ![](img/f604778e5fd8b5339b52bd5345099d26_226_0.png)


    +   - In the 2.6 kernel, sendfile() won''t work if the output descriptor does
    not describe a TCP socket.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# CHAPTER 25. SOCKETS - INPUT/OUTPUT OPERATIONS


    When successful, sendfile() returns the number of bytes written to the output
    descriptor. On failure, the possible error codes are:


    Table 25.5: sendfile() error return values


    | Error | Meaning |

    | --- | --- |

    | EBADF | The input file not open for reading or output file not open for writing.
    |

    | EINVAL | Invalid or locked descriptor. |

    | ENOMEM | Insufficient memory to read from the input descriptor. |

    | EIO | Unspecified error while reading the input descriptor. |


    One should be aware that other operating systems have versions of sendfile() and
    sendfile()-like functions which have different prototypes and usage under Linux.
    Thus you have to be very careful if trying to write any kind of portable code.


    # 25.6 socketpair()


    The function socketpair() creates a pair of connected sockets.


    ```

    #include <sys/types.h>

    #include <sys/socket.h>


    int socketpair(int domain, int type, int protocol, int sv[2]);

    ```


    where domain must have the PF_LOCAL, type can be SOCK_DGRAM or SOCK_STREAM, and
    protocol must be 0; i.e., one must have Unix domain sockets.


    The pair of sockets is returned in the final argument.


    This function works much like the pipe() command that works with unnamed pipes.
    What is written into one is read out of the other.


    Unlike the endpoints created by the pipe() command, however, those created by
    socketpair() are full-duplex; one can read and write to both descriptors.


