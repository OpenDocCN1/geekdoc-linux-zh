  md: '# 29.3. POSIX IPC


    ipcrm


    ipcrm can remove IPC objects. Its usage is:


    ```

    ipcrm [ shm | msg | sem ] id

    ```


    The identifier can be retrieved by using ipcs.


    The user must have proper ownership.


    If one tries to remove a shared memory object in use, it will be marked as destroyed
    but may remain while other attachments remain. If one tries to remove a semaphore
    or message queue object, the removal is immediate.


    The POSIX IPC implementation is newer than that of System V IPC. In fact it was
    incomplete in Linux until the 2.6 kernel added POSIX message queues.


    It shouldn''t be surprising that it is careful to avoid some of the incoherence
    in its older competitor''s design. For example, each mechanism''s function for
    removing an object (shm_unlink(), mq_unlink, sem_unlink()) only marks the object
    for deletion, which can occur only when the object''s usage vanishes.


    Each object is created with an open function (shm_open(), sem_open(), mq_open())
    which takes a name as an identifier, not a key. This name should begin with a
    slash (and contain no others) and the choice is left open to the implementation
    about whether the named IPC object has a filesystem representation.


    Linux has chosen this route, and all shared memory and semaphore objects can be
    found under /dev/shm. Message queues need to be mounted somewhere using the mqueue
    filesystem, such as in


    ```

    mount -t mqueue /dev/mqueue

    ```


    Note that the shared interface also permits unnamed semaphores, but they are intended
    to be used only between threads of a multi-threaded application.'
