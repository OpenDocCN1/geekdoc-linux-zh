    # 2.1 GCC


    gcc is the GNU C compiler. (Its proper name is the GNU Compiler Collection.) It
    can also be invoked as cc. gcc can compile programs written in C, C++, and Objective
    C.

    g++ is the C++ compiler. (It can also be invoked as c++).

    gcc works closely with the GNU libc, glibc, and the debugger, gdb.'
