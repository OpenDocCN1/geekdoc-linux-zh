    31.4 Labs . . . . . . . . . . . . . . . . . . . . . . . . . 253


    # 31.1 What is a Semaphore?


    Semaphores are used by processes to signal each other, and to avoid race conditions
    between asynchronous tasks that share resources.


    Semaphores are counters often used to control shared resources or protect critical
    sections of code, and can implement an (advisory) locking mechanism.


    There are only two operations that can be performed on a semaphore variable (sv):


    +   * wait (P) (down)'
