- img_proc: true
  md: 'The functions which accomplish the byte swapping are:


    ```

    #include <netinet/in.h>

    uint32_t htonl(uint32_t hostlong)

    uint16_t htons(uint16_t hostshort)

    uint32_t ntohl(uint32_t netlong)

    uint16_t ntoohs(uint16_t netshort);

    ```


    Note that the bit-lengths are explicitly specified in the types. On Linux these
    are all coded as fast

    in-line assembly instructions.


    On Big-endian architectures these operations become no-ops.


    # 20.7 Labs


    # Lab 1: Using netstat to Examine Connections.


    The command line utility netstat is an all-purpose tool for examining the state
    of the various sockets

    and interfaces active on the system and can be used for other purposes as well,
    such as examining

    routing. Typing netstat -h will give a brief summary of possibilities.


    Typing netstat -ie will give a quick summary of all the information. Typing netstat
    -i will give

    a summary by interface:


    ```

    $ netstat -i

    Kernel Interface table

    Iface MTU Met RX-OK RX-ERR RX-DRP RX-OVR TX-OK TX-ERR TX-DRP TX-OVR Flg

    eth0 1500 0 98577 0 0 0 83195 0 0 0 BMRU

    eth1 1500 0 11560 0 0 0 13574 0 0 0 BMRU

    lo 16436 0 106 0 0 0 106 0 0 0 LRU

    ```


    Note that typing netstat -ie will give the same output as ifconfig.


    Typing


    ```

    $ netstat -ae --raw --tcp --udp

    ```


    will show information about the state of raw, TCP, and UDP sockets.


    To obtain information about Unix domain sockets:


    ```

    $ netstat -ae --unix

    ```


    and to gain global statistics:


    ```

    $ netstat -as

    ```'
