  md: '# 5.5 LABS


    # 5.5 Labs


    # Lab 1: Version Control with Subversion


    First you''ll need to create a central repository:


    ```

    $ svadmin create my_repos

    ```


    putting in whatever path you want for the last argument. Take a look at the directory
    tree created under there. Note that one should never manually edit the contents
    of the repository, but really on the tools that are of the Subversion package.


    Now you have to create a project, consisting of files and directories which you
    will import into the Subversion repository. For example:


    ```

    $ mkdir my_project

    $ cp -a [whatever files and dirs you want] my_project

    ```


    Note that we are keeping things simple; the recommended route is to create three
    subdirectories (branch, tags, trunk) and put your files in the trunk subdirectory
    because this convention is followed; however, Subversion does not require it.


    Now it is time to import data into your repository with:


    ```

    $ svn import my_project file:///tmp/SVN/my_repos -m "Original Import"

    ```


    where the last argument just gives an identifying string. This will tell you about
    all the files you added, and if you examine the repository you will see where
    things went and what some of the other files created and modified look like.


    Now lets checkout of the project so we can work on it and modify it. Do this this
    with:


    ```

    $ svn checkout file:///tmp/SVN/my_repos/ my_project_work

    ```


    Compare the contents of the working copy with the original project. You''ll notice
    each subdirectory has a .svn subdirectory with revision control information.


    Now make some changes to the contents of the files in the working copy. Execute


    ```

    $ svn diff

    ```


    (in your main source directory) to see the changes. Run


    ```

    $ svn commit -m "I made some changes"

    ```


    to place your changes in the repository. If you want to update your copy to whatever
    the most recent version is in the repository, you do it with


    ```

    $ svn update

    ```


    We could do a lot more, but this should have you started.'
  merge: -1
