  md: '# 11.6 Making Temporary Files


    Often one has a need to generate a temporary file to be used by an application.
    It is very important that the name of this file be unique so that collisions do
    not occur.


    Another consideration may be that the filename is not easily predictable, so that
    anyone snooping around the system can compromise its integrity or security. The
    ancient practice of basing the filename on the process ID (which is unique) suffers
    from this security hole.


    Linux provides a variety of functions to accomplish this. They differ in how seriously
    they take security, how safe they are with regard to race conditions, and historical
    compatibility with older Unix-type operating systems:


    ```

    #include stdlib.h


    int दस्तक(char *template);

    char *mkstemp(char *template);

    FILE *tmpfile(void);

    ```


    mkstemp() constructs a unique filename from template, which must contain XXXXXX
    for the last six characters. The value of template is modified in the filename
    construction. Thus it can''t be a constant string.


    This function will also open the file with the O_EXCL flag, guaranteeing that
    the only user. Its return value is the file descriptor for the temporary file.


    To make a directory mktemp(); the template argument is used exactly the same way
    as in mkstemp().


    The above functions do not remove the temporary file when the program completes,
    either normally or abnormally. You must do unlink() on the filename, or rdir()
    on the directory.


    The tmpfile() function opens a unique file without ever telling you the name.
    It differs from mktemp() in that when you don''t supply a template for the name,
    and when you are done it is automatically deleted; no unlink() is required.


    According to the standard, the temporary file appears in the directory P_tmpdir
    defined in /usr/include/stdlib.h; if that is not defined it goes /tmp, which matches
    the actual definition in the header file anyway. However, under Linux the library
    substitutes an anonymous mapping for a file, and will be hard to find the file.


    The following functions are considered obsolete but you may find them in legacy
    code:


    ```

    char memp(char *template);

    char *tempnam(const char *dir, const char *pfx);

    char *tmpnam(char *s);

    ```


    These functions do not actually create and open the file. This creates a race
    condition between whether a file already exists and opening it can be a security
    risk, particularly old BSD versions of these functions constructed a filename
    by simply replacing XXXXXX by a single letter and the process identifier in a
    predictable way. Thus one should not use these functions and should replace them
    in legacy code.'
  merge: -1
