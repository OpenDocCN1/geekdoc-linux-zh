  md: '# 3. READING, WRITING AND SEEKING


    On error, write() returns -1, the file position is indeterminate, and errno is
    set. The possible error returns are:


    Table 10.6: read() error return values


    | Value | Meaning |

    | --- | --- |

    | EINTR | Interrupted by a signal before any data read. |

    | EAGAIN | 0_NONBLOCK specified and data not immediately available for reading.
    |

    | EIO | I/O error: a background process tries to read a tty or a low level error
    from a disk or tape. |

    | EISDIR | fd is a directory. |

    | EBADF | invalid file descriptor or not open for reading. |

    | EINVAL | fd is not an object suitable for reading. |

    | EFAULT | buf is not in the process''s address space. |


    write() counts bytes to file descriptor from buf.


    On success, write() returns the number of bytes written and the file position
    is advanced appropriately. On error, write() returns -1, the file position is
    indeterminate, and errno is set. The possible error returns are:


    Table 10.7: write() error return values


    | Value | Meaning |

    | --- | --- |

    | EINTR | Interrupted by a signal before any data written. |

    | EAGAIN | 0_NONBLOCK specified and no room immediately available in the pipe
    or socket fd is connected to. |

    | EIO | a low level error occurred while modifying the inode. |

    | EBADF | invalid file descriptor or not open for writing. |

    | EINVAL | fd is not an object suitable for writing. |

    | EFAULT | buf is not in the process''s address space. |

    | EPIPE | fd is connected to a pipe or socket whose reading end is closed. |


    Note both read() and write() may produce other errors, depending on exactly what
    kind of object is connected to fd.


