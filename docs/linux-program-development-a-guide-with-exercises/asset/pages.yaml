    \ /* data byte count, including header */\n    int         msg_level;  /* originating\
    \ protocol */\n    int         msg_type;   /* protocol-specific type */\n    unsigned_char\
    \ *msg_data[]; /* pointer to the start of the ancillary data control buffers */\n\
    };\n```\n\nand should be created and accessed with the macros defined in the man\
    \ page for msmsg().\n\nAn in-depth description of sending and receiving ancillary\
    \ data would take too much time, so we recommend reading the msmsg documentation\
    \ to fill in the details.\n\nThe final element in the msghdr structure is msg_flags.\
    \ For sendmsg() it is not used, but for recvmsg() it can contain the following\
    \ values on return:\n\nTable 25.3: sendmsg() flags\n\n| Flag | Meaning |\n|---|---|\n\
    | MSG_EOR | Indicates an end of record was reached; used generally with SOCK_SEQPACKET\
    \ sockets. Not used for TCP or other byte-stream protocols. |\n| MSG_TRUNC | The\
    \ datagram had be truncated because there was not enough room in iovec structures.\
    \ |\n| MSG_CTRUNC | Control data was discarded because msg_control was not big\
    \ enough. |\n| MSG_O0B | out-of-band data was received. Note the flags variable\
    \ can not be altered as it is passed by value, this situation is recorded here.\
    \ |\n| MSG_ERRQUEUE | An extended error was retrieved from the socket error queue.\
    \ |\n| MSG_DONTWAIT | If this value was set in flags it will be set here. |"
