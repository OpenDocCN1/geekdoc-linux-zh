  md: "# CHAPTER 28. SOCKETS - MULTIPLEXING AND CONCURRENT SERVERS\n\ndetermining\
    \ which process should receive the SIGIO signal when the socket has activity.\n\
    \nRemember that we can set this with fcntl() or setsockopt(). Under Linux we can\
    \ also set the signal handler itself.\n\nA signal handler has to be installed,\
    \ preferably with the sigaction() system call (rather than the weaker and less\
    \ reliable signal() system call.)\n\nThe signal handler can then read the data\
    \ (with recvfrom() for example) and perhaps notify the main program that data\
    \ is available, or it can notify the main program to read the data. Meanwhile\
    \ the main program joins in a loop.\n\nUnder true asynchronous I/O, the operation\
    \ is somewhat reverse. The I/O operation is initiated and the program continues\
    \ to execute. When the I/O operation is done, a signal is generated to signify\
    \ completion.\n\nThis can be done through the explicit use of signals, but the\
    \ more advanced implementation uses the AIO interface, whose functions are defined\
    \ in /usr/include/aio.h. There are special functions for reading, writing, and\
    \ other necessities.\n\n# 28.7 Concurrent Servers\n\nThe concurrent server model\
    \ permits a server to handle multiple requests simultaneously, while preventing\
    \ blocking in one of them from stalling the entire operation.\n\nThe basic idea\
    \ is to have the main parent process listen for connections and then whenever\
    \ one is accepted, to create a child process to handle that connection. When there\
    \ is no more work to do for the client the child process terminates.\n\nThis creates\
    \ code that looks like:\n\n```\nsd = socket(...);\n...\nlisten(...);\n...\nfor\
    \ ( ; ; ) {\n  cd = accept(...);\n  pid = fork();\n  if (pid==0) { /* child process\
    \ */\n    close(sd);\n    handle_the_client(cd);\n    close(cd);\n    exit(0);\n\
    \  }\n  close(cd);\n}\n```\n\nAll the real work will be done by the handle_the_client()\
    \ function.\n\nNote that the child inherits a copy of all file (and socket) descriptors\
    \ across the fork and thus should close the socket descriptor while working on\
    \ the descriptor returned by accept()."
  merge: -1
