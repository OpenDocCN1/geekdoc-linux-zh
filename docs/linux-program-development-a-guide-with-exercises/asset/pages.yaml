  md: '# Table 2.8: Compiler control options


    | -ansi | Enforce full ANSI compliance |

    | -pipe | Use pipes between stages |

    | -static | Suppress linking with shared libraries |

    | -O[lev] | Optimization level; 0, 1, 2, 3. Default is 1. |

    | -Os | Optimize for size; use all -O2 options except those that increase the
    size. |


    A good set of options to use is:


    -O2 -Wall -pedantic


    Make sure you understand any warnings and if you obliterate them, you will save
    yourself a lot of debugging. However, don''t use -pedantic when compiling code
    for the Linux kernel, which uses many gcc extensions.


    # 2.3 Preprocessor


    The preprocessor can run alone either by invoking cpp directly, or doing gcc -E
    . . . Preloaded defines can be listed by doing


    ```

    touch foo.h; gcc -E -dM foo.h; rm foo.h

