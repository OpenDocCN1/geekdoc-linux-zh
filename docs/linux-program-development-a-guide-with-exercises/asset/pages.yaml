  md: '# 12.3 Process Groups


    Besides having a pid, every process is also a member of a process group. The Process
    Group ID (pgid) is also a positive integer, expressed in the pid_t type. Processes
    can join or leave process groups.


    A process group has a leader for whom pid = pgid. The group continues even if
    the group leader terminates, ending when all of its members terminate.


    The following functions are used to manipulate process groups:


    ```

    #include <unistd.h>


    int setpgid(pid_t pid, pid_t pgid);

    pid_t getpgid(pid_t pid);

    int setpgrp(void);

    pid_t getpgrp(void);

    ```


    The function setpgid() sets the pgid of process pid to pgid. If pid = 0, the current
    process pid is used. If pid = 0 the pgid of process pid is used.


    The function getpgid() returns the pgid of process pid. If pid = 0, the current
    process pid is used.


    The function setpgrp() is equivalent to setpgid(0,0).


    The function getpgrp() is equivalent to getpgid(0).


    On success, these functions return 0. On failure, they return -1 with errno set.
    The possible error returns are:


    Table 12.2: Process group function error return values


    | Value | Meaning |

    |---|---|

    | EINVAL | pgid < 0 |

    | EPERM | Permission violation. |

    | ESRCH | pid doesn''t match any process. |


    # 12.4 The proc Filesystem


    The proc filesystem is a pseudo-filesystem which exists only in memory; i.e.,
    the /proc directory is empty when the system is not running. Information in the
    proc filesystem is generated only when examined; it is not continuously updated.


    Entries in /proc can be used to obtain system information when read. Writing to
    entries can set various system parameters.


    The name proc is short for process and thus it should be no surprise that it contains
    abundant information about each process running on the system, in addition to
    global information. For each'
