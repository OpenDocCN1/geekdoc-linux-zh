  md: '# # Chapter 30


    # # Shared Memory


    ![](img/f604778e5fd8b5339b52bd5345099d26_264_0.png)


    We''ll learn how to use shared memory under **Linux**; how to create and attach
    (detach) to shared memory regions, and control operations.


    +   30.1 What is Shared Memory? . . . . . . . . . . . . . . . . . . . . . . .
    . . . . . 241

    30.2 System V Shared Memory . . . . . . . . . . . . . . . . . . . . . . . . 242

    30.3 POSIX Shared Memory . . . . . . . . . . . . . . . . . . . . . 244

    30.4 Labs . . . . . . . . . . . . . . . . . . . . . . . . . 246


    # ## 30.1 What is Shared Memory?


    **Shared Memory** is the most commonly used and the fastest of the three **IPC**
    methods.

    One process allocates a memory region and then others attach to and detach from
    it. Synchronization is important and may require various kinds of locking mechanisms,
    such as semaphores.


    Often the region creator functions as a **server** and subsequent attaches are
    **clients** with read-only access. In this case synchronization becomes simple.


    One has to be particularly careful to have programs **remove** shared memory segments
    when they are no longer needed by any process. This may not done automatically
    and memory leaks can result.'
  merge: -1
  pgno: 264
- img_proc: true
  md: "Note that detaching is not the same as removing.\n\nAn alternative method of\
    \ using shared memory which is very useful when the processes possess a parent/child\
    \ relationship, is anonymous memory mapping, which we have already discussed.\
    \ This can provide a cleaner alternative in which the shared segment will be removed\
    \ as soon as all processes use it having unmapped it or exited.\n\nIn fact, the\
    \ Linux kernel implementations of both System V and POSIX shared memory are based\
    \ on memory mapping.\n\n# 30.2 System V Shared Memory\n\nThe functions for dealing\
    \ with System V shared memory objects are:\n\n```\n#include <sys/types.h>\n#include\
    \ <sys/ipc.h>\n#include <sys/shm.h>\n\nint shmget(key_t key, int size, int shmflg)\n\
    void *shmat(int shmid, void *shmaddr, int shmflg)\nint shmdt(int shmid, void *shmaddr)\n\
    int shmctl(int shmid, int cmd, struct shmid_ds *buf);\n```\n\nThe shmflg argument\
    \ to shmget() contains the usual permission bits (such as 0644) which may be combined\
    \ with IPC_CREAT when creating a new object. If IPC_EXCL is also specified, failure\
    \ results if the object already exists. If IPC_CREAT is not specified the entire\
    \ argument is ignored.\n\nIf IPC_PRIVATE is given for the key, a new segment can\
    \ be created. If neither IPC_CREAT or IPC_PRIVATE is specified, one attaches to\
    \ a previously existing segment.\n\nThe size argument rounded up to be a multiple\
    \ of the size of memory (which can be obtained with getpagesize()) which yields\
    \ 4 KB by x86.\n\nThe successful return value of shmget() is a valid shared memory\
    \ identifier (generated from the key argument) to be used as an argument for the\
    \ other functions.\n\nIn order to use the shared memory segment, one has to attach\
    \ and detach from it with shmat() and shmdt().\n\nBesides the shared memory identifier,\
    \ shmat() takes as an argument shaddr, a preferred address for the segment. Usually\
    \ one uses NULL for this value, which allows the system to choose the address\
    \ of the shared memory. The other argument, shmflag is not the same as the one\
    \ passed to shmat(), and can be SH_RM or SH_RDONLY.(You can have read-only, but\
    \ no write-only segments). The SH_RD value is important only when shmid is specified.\n\
    \nFurther control of the shared segment is done with the shmctl() function, which\
    \ provides instructions through the cmd argument on a type of shmid_ds:\n\n```\n\
    struct shmid_ds {\n  struct\n    ipc_perm shm_perm;    /* operation perms */\n\
    \  int\n    shm_szgs;             /* size of segment (bytes) */\n  time_t sh_atime;\
    \          /* last attach time */\n```"
