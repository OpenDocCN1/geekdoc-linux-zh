    # 16.3 Dispatching Signals


    Dispatching (sending) signals is easy; handling (catching) properly and avoiding
    race conditions is more difficult. There are two functions for raising signals:


    ```

    #include <sys/types.h>

    #include <signal.h>


    int kill(pid_t pid, int sig);

    int raise(int sig);

    ```


    kill() can send any signal to any process group or process. Note that the sending
    process must have the proper permissions to send a signal to another process.


    raise() is used for a process to send a signal to itself; raise(sig) is equivalent
    to kill(getpid(),sig) in the case of a single-threaded process. In a multi-threaded
    process it sends a signal only to the current thread.


    The pid argument in kill() can be used in several ways:'
