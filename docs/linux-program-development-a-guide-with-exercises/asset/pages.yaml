    # 4.1 Using make and Makefiles


    **make** is an essential utility for managing all but the smallest of projects.
    Using **make** facilitates coherent distribution of software and eases compilation
    on new systems.


    Through careful construction of **makefiles**, which much tedious and repetitive
    work can be performed automatically, hopefully minimizing errors.


    We will consider directly the GNU version of **make** which contains considerable
    enhancements over other implementations and is now available on virtually every
    platform.'
