    By default all sub-directories are recursively compiled, but one can narrow the
    choice of directories:


    ```

    make SDIRS=s_22

    make SDIRS="s_0* s_23"

    ```


    The genmake script in the main directory is very useful for automatically generating
    makefiles, and is worth a perusal.

    One should note that we have emphasized clarity and brevity over rigor in the
    solutions; e.g., we haven''t tried to catch every possible error or take into
    account every system configuration option. The code is not bullet-proof; it is
    meant to be of pedagogical use.

    If you have any questions or feedback on this material contact us at coop@coopj.com.


    +   - The provided solutions will from time to time contain functions and features
    not discussed in the main text.

    - This is done to illustrate methods to do more than the minimum work to solve
    the problem and teach extra material.

    - If there is anything that must be used and is not covered in the material, its
    omission is a bug, not a feature, and should be brought to our attention.


    # 1.2 Linux Distributions


    There are many Linux distributions, ranging from very widely used to obscure.
    They vary by intended usage, hardware and audience, as well as support level.
    A very comprehensive list can be found at http://lwn.net/Distributions/.


    We have tried to keep this material as distribution-agnostic as possible. For
    all the most specialized-distributions this won''t present any inconveniences.


    Occasionally which distribution you are using matter, but this should only happen
    when we (reluctantly) descend into system administration, as when we describe
    the location of particular files and directories or how to install required software
    packages. Fortunately, modern distributions differ less in these matters than
    they did in the early days of Linux and we will rarely have to deal with these
    inconveniences.


    The material has been developed primarily on Red Hat-based systems, mostly on
    64-bit variants with testing done on 32-bit systems. But it has also been tested
    on a number of other distributions.'
