  md: '# 11.7. OTHER SYSTEM CALLS


    ```

    int dup (int oldfd);

    int dup2 (int oldfd, int newfd);

    ```


    File descriptor oldfd is duplicated and the old and new descriptors may be used
    interchangeably, and share locks, pointers and flags.


    dup() uses the lowest-numbered unused descriptor for the new descriptor, while
    dup2() makes newfd the copy of oldfd, closing newfd first if necessary.


    On success the new descriptor is returned, and on error -1 it is returned with
    errno set. The possible error returns are:


    Table 11.11: dup(), dup2() error return values


    | Value | Meaning |

    |---|---|

    | EBADF | oldfd is not an open file descriptor, or newfd is out of the allowed
    range. |

    | ENFILE | Maximum number of file descriptors would be exceeded. |


    An example in the use of dup() would be:


    fd = open (...);

    close(STDOUT_FILENO);

    dup(fd);


    This redirects standard output to file descriptor fd.


    # link(), symlink(), unlink(), readlink()


    These functions deal with symbolic links and with deleting files.


    ```

    int link (const char *oldpath, const char *newpath);

    int symlink (const char *oldpath,const char *newpath);

    int readlink (const char *path, char *buf, size_t bufsize);

    int unlink (const char *pathname);

    ```


    link() creates a hard link (a new name) to an existing file. If newpath exists
    it won''t be overwritten. The new name and the old name may be used interchangeably.


    symlink() creates a symbolic link. If newpath exists it won''t be overwritten.
    Permissions are irrelevant; the link may also be dangling.


    These functions return 0 on success and -1 on failure with errno set. The possible
    error returns are:


    Table 11.12: symlink(), link() error return values'
