  md: "# 2. SELECT()\n\n```\n#include <sys/types.h>\n#include <sys/time.h>\n#include\
    \ <unistd.h>\n```\n\n```\nint select(int n, fd_set *readfds, fd_set *writefds,\
    \ fd_set *exceptfds,\n       struct timeval *timeout);\n```\n\n```\nstruct timeval\
    \ {long tv_sec, long tv_usec};\n```\n\nThe argument n gives the number of file\
    \ descriptors to check, which should be one higher than the highest file descriptor\
    \ (they start with 0.) The Linux kernel has a limit of __FD_SETSIZE=1024 file\
    \ descriptors that can be used for select().\n\nThe arguments readfds, writefds,\
    \ exceptfds are pointers-to-caller descriptor sets, which are stored in the fd_set\
    \ data type, which signal to the kernel which descriptors are to be watched for\
    \ what kind of action.\n\nWhen data is ready to read on a descriptor, the appropriate\
    \ bit is set in the read set. When a descriptor is ready for input, a bit is set\
    \ in the write set. When there is a socket error, both bits can be set. Bits in\
    \ the exception set are out-of-band data arrives.\n\nThe following macros operate\
    \ on these sets:\n\n| FD_ZERO(fd_set *set) | Clear bits in set. |\n|---|---|\n\
    | FD_CLR(int fd, fd_set *set) | Turn off bit for fd in set. |\n| FD_SET(int fd,\
    \ fd_set *set) | Turn on bit for fd in set. |\n| FD_ISSET(int fd, fd_set *set)\
    \ | Test bit for fd in set. |\n\nThe argument timeval gives the maximum time period\
    \ select() should wait for one of the file descriptors to indicate a change in\
    \ its status. If one or more are ready before the period has expired, the function\
    \ returns at that time. The two elements of the structure give the expiration\
    \ period in seconds and microseconds.\n\nIf timeval = NULL, the wait period is\
    \ infinite, although it can be interrupted by a signal. If tv_usec = 0, the return\
    \ is immediate; i.e., the function does a non-blocking call.\n\nAny of the sets\
    \ can be a NULL pointer; if all three are, select() works as a higher precision\
    \ timer than the simple sleep() function; this is exploited.\n\nUnder Linux the\
    \ argument timeout is modified to return the amount of time slept. Most operating\
    \ systems do not do this, so not to be safe use this variable after the function\
    \ returns. Keep in mind the descriptor sets themselves are modified during the\
    \ system call so they need to be reinitialized each time select() is called.\n\
    \nOn success, select() returns the number of descriptors that are ready for some\
    \ kind of action; if a file descriptor is ready for read and write it would add\
    \ 2 to the return value under Linux; some operating systems only 1, so again dont\
    \ use this value in any important way. A return value of 0 indicates the time\
    \ limit expired before any file descriptor was ready. A return value"
