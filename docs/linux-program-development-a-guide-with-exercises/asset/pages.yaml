  md: "# 32. POSIX MESSAGE QUEUES\n\nqueue according to priority. Upon reception,\
    \ the highest priority message is always received, and that priority value will\
    \ be returned in msg_prio.\n\nMessages are received in FIFO order, and it is not\
    \ possible to receive a message lower than the highest priority one available.\n\
    \nTimeouts for both sending and receiving can be enforced through:\n\n```\n#include\
    \ <mqueue.h>\n#include <time.h>\n\nint mq_timesend(mq_t mqdes, const char *msg_ptr,\
    \ size_t msg_len,\n               unsigned msg_prio, const struct timespec *abs_timeout);\n\
    size_t mq_timedreceive(mq_t mqdes, char *restrict msg_ptr, size_t msg_len,\n \
    \                       unsigned *restrict msg_prio, const struct timespec *restrict\
    \ abs_timeout);\n\nstruct timespec {\n    long tv_sec; /* seconds */\n    long\
    \ tv_nsec; /* nanoseconds */\n};\n```\n\nDepending on your Linux installation,\
    \ mq_open() will have to link with the Posix real library; e.g.\n\n```\ngcc -o\
    \ mq_example mq_example.c -lrt\n```\n\nHere's an example of how we creates a message\
    \ queue and waits for other processes to attach to it and send messages. (Make\
    \ sure to remove the message queue when done with it to avoid a memory leak).\n\
    \n```\n/* compile with -lrt */\n```\n\n```\n#include <stdlib.h>\n#include <stdio.h>\n\
    #include <fcntl.h>\n#include <mqueue.h>\n\nint main (int argc, char *argv[]) {\n\
    \    struct mq_attr attr = {\n        .mq_maxmsg = 10,\n        .mq_msgsize =\
    \ 4096,\n    };\n\n    mqd_t msg_fd;\n    char buffer[4096];\n\n    msg_fd = mq_open(\"\
    /my_mq\", O_RDWR | O_CREAT | O_EXCL, &attr);\n\n    while (1) {\n        if ((mq_receive(msg_fd,\
    \ buffer, attr.mq_msgsize, NULL)) == -1) {\n            exit (-1);\n        }\n\
    \        printf(\"Message Received %s\\n\", buffer);\n```"
