- img_proc: true
  md: '# HOST INFORMATION


    The h_addrtype element can be either AF_INET for IPv4 or AF_INET6 for IPv6.


    The h_addr_length element gives the length of the address, in bytes.


    The last element, h_addr_list is a NULL-terminated array of network addresses
    (in network order) for the host. The name h_addr can be used as shorthand for
    the first member of this array, and dates back to an early implementation where
    there was no array.


    Note that the address pointer is to an in_addr structure, not directly to the
    32-bit binary address, so you''ll have to do something like


    ```

    struct *hostentry;

    struct in_addr addr;

    ...

    mempy(&addr, hostentry->h_addr, hostentry->h_length);

    printf("the address is %x\n", ntohl(addr.s_addr));

    ```


    Note that all recent versions of bind permit specifying the name argument in dotted-quad
    format; ie, the results of gethostname("coop.com") and gethostbyname("65.254.254.254")
    are identical.


    A word of caution is that gethostbyname() and gethostbyaddr() return pointers
    to static data, which may be overwritten by later calls, and are thus not re-entrant.
    Copying the host structure is not sufficient, as it contains pointers. A more
    careful and deeper copy is required.


    If these functions fail, information about the cause can be obtained through the
    usual error() function. However, it is also possible to use


    ```

    extern int h_errno;

    void error(const char *err);

    const char *hstrerror(int err);

    ```


    where error() works in the same fashion as perror(), and hstrerror() retrieves
    a pointer to the associated error string associated with err (generally h_errno).
    These functions are considered deprecated, but are still widely used anyway.


    The h_errno variable can be:


    # Table 21.1: h_errno values


    | Error | Meaning |

    | HOST_NOT_FOUND | Specified host unknown. |

    | NO_ADDRESS, NO_DATA | The name is valid, but has no IP address. |

    | NO_RECOVERY | Unrecoverable name server error. |

    | TRY_AGAIN | Temporary error on name server; try again later. |


    Note that if a particular host is known locally (i.e., specified in the /etc/hosts
    file), gethostbyname() will return successfully without actually contacting a
    name server to verify the information; it may be unreliable.'
