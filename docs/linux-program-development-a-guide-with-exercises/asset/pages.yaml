  md: "# 28.4 pselect() and poll()\n\nIn fact, under Linux, since the 2.2 kernel select()\
    \ has been implemented internally as a wrapper around poll.\n\nAn enhancement\
    \ of the select() function is provided by the pselect() function:\n\n```\n#include\
    \ <sys/select.h>\n#include <sys/time.h>\n#include <sys/types.h>\n#include <unistd.h>\n\
    ```\n\n```\nint pselect (int n, fd_set *readfds, fd_set *writefds, fd_set *exceptfds,\n\
    const struct timespec *timeout, const sigset_t *sigmask);\n```\n\nThere are three\
    \ differences as compared to select():\n\n+   - Instead of a struct timeval, it\
    \ uses\n```\nstruct timespec {\n  long tv_sec;      /* seconds */\n  long tv_nsec;\
    \     /* nanoseconds */\n};\n```\n\nwhich has nanosecond resolution (which does\
    \ not imply your system can properly resolve\n\n+   - The timeout parameter is\
    \ not changed by the function.\n- The sigmask parameter can be used to set a temporary\
    \ signal mask (which signals should be blocked) when pselect() is called. (You\
