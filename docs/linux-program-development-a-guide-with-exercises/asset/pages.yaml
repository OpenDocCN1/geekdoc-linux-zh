  md: '# 2.2. PROCESS LIMITS


    The rlim_cur field is the current usage limit for the resource, and the rlim_max
    field is the maximum value to which it can be set.


    Only the superuser can change rlim_cur to a value greater than rlim_max, or change
    the rlim_max field.


    Most of these usage limits are initialized to RLIM_INFINITY=OUL which means no
    effective limit is imposed.


    For x86 the following resource limits are defined in /usr/src/linux/include/linux/
    resource.h:


    # Table 12.1: Resource limits


    | Limit | Default rlim_cur | Default rlim_max | Meaning |

    | --- | --- | --- | --- |

    | RLIMIT_CPU | RLIM_INFINITY | RLIM_INFINITY | Maximum CPU time in msecs. If a
    process exceeds this it gets a SIGCPU signal, and then doesn''t terminate. |

    | RLIMIT_SIZE | RLIM_INFINITY | RLIM_INFINITY | Maximum size. Attempts to exceed
    this generate a SIGFSZ signal. |

    | RLIMIT_DATA | RLIM_INFINITY | RLIM_INFINITY | Maximum (heap) data size. This
    limit is checked when the kernel expands the heap of a process. |

    | RLIMIT_STACK | _STK_LIM=8M | RLIM_INFINITY | Maximum stack size. This limit
    is checked whenever the kernel expands the user stack of a process. |

    | RLIMIT_CORE | 0 | RLIM_INFINITY | Maximum core dump size. If set to 0 no cores
    are produced. |

    | RLIMIT_RSS | RLIM_INFINITY | RLIM_INFINITY | Maximum resident size (number of
    page frames owned by a process) |

    | RLIMIT_NPROC | 0 | 0 | Maximum number of processes a user can own. Both values
    reset during initialization to the maximum number of threads. |

    | RLIMIT_NOFILE | INR_OPEN=1024 | INR_OPEN=1024 | Maximum number of open files.
    |

    | RLIMIT_MEMLOCK | RLIM_INFINITY | RLIM_INFINITY | Maximum locked-in memory (non-swappable)
    address space. |

    | RLIMIT_AS | RLIM_INFINITY | RLIM_INFINITY | Maximum size of address space. Checked
    whenever a malloc()-like function is used. |'
