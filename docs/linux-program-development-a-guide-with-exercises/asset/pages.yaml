  md: '# THE VIRTUAL FILE SYSTEM


    # 9.2 The Virtual File System


    Linux implements a Virtual File System (VFS), as do all modern operating systems.
    For the most part neither the specific filesystem or actual physical media and
    hardware need be addressed by filesystem operations. Furthermore, network filesystems
    (such as NFS) can be handled transparently.


    This permits Linux to work with more filesystem varieties than any other operating
    system. The democratic attribute has been a large factor in its success.


    Most filesystems have full read/write access while a few have only read access
    and perhaps experimental access.


    A (partial) list of currently supported filesystem types:


    # Table 9.2: Available filesystems


    | Name | Description |

    |---|---|

    | ext2 | Native Linux filesystem |

    | minix | predecessor to ext2 |

    | proc | Used for /proc/ |

    | msdos | MSDOS |

    | umsdos | extensions to MSD |

    | vfat | Windows VFAT (includes FAT32, FAT, etc) |

    | ntfs | Windows NTFS (read-only) |

    | sysv | System/Venix/Coherent FS |

    | hpfs | OS/2 HPFS |

    | affs | Amiga Atlas Filesystem |

    | ufs | Sun |

    | udf | CD R/W, DVD |

    | hfs | Apple Macintosh Filesystem (HFS) |

    | hfs+ | Apple Macintosh Extended HFS. |

    | befs | BeOS filesystem. |

    | bfs | SCO Unixware boot filesystem. |

    | jjfs, jjfs2 | Journaling Flash File Systems |

    | vxfs | Veritas VxFS, used on SCO Unix |

    | iso9660 | cdrom entry, including Juliet extensions |

    | cramfs | Compressed read-only file system. |

    | romfs | Small read-only file system. |

    | tmpfs | Ram disk that is swappable. |

    | ramfs | Ram disk, for example of a file system. |

    | Network File System (through version 4) |

    | smb | Samba networking |

    | ncp | Novell NTFS using NCP Protocol |

    | coda | Experimental distributed filesystem |

    | afs | Andrew distributed filesystem, from Carnegie Mellon |

