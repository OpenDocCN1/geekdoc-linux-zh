    # 32.3 POSIX Message Queues


    **POSIX** message queues are created, opened and removed with:


    ```

    #include <mqueue.h>

    ```


    ```

    mq_t mq_open(const char *name, int oflag, ...);

    int mq_close(mq_t mq_des);

    int mq_unlink(const char *name);

    ```


    Although **Linux** does not require, name should start with a / and have no others
    embedded. When the message queue exists it will be visible if the **mqueue** filesystem
    is mounted (which must be done by root),


    ```

    $ mkdir /dev/mqueue

    $ mount -t mqueue none /dev/mqueue

    $ ls -1 /dev/mqueue

    ```


    ```

    drwxrwxrwt 2 root root 60 Feb 09 05:56 ./

    drwxr-xr-x 13 root 5900 Feb 09 05:56 ../

    -rw-rw-r-- 1 coop coop 80 Feb 09 05:56 my_mq

    ```


    The oflag argument to `mq_open()` must include either O_RDONLY, O_WRONLY or O_RDWR
    and can be combined with:


    +   - **O_CREATE**: Create the message queue if it does not exist. In this case
    the **mode** argument contains the usual permission bits. If this flag is not
    set, the mode is ignored as the usual `open()` system call.

    - **O_EXCL**: Return an error if O_CREATE is specified and an object of the same
    name already exists.

    - **O_NONBLOCK**: If this flag is set, calls to `mq_send()` and `mq_receive` will
    fail with `**errno = EAGAIN**` if resources or messages are not available, rather
    than block and wait.


    The successful return value of `mq_open()` is a valid queue descriptor, which
    is essentially a file descriptor.


    When the message queue is no longer needed, it can be removed with `mq_unlink()`.
    Note that this will occur only when all processes have called `mq_close()` or
    terminated. The object can also be removed from `/dev/mqueue` from the command
    line, or from wherever the **mqueue** filesystem may be mounted.


    When a message queue is created, one more argument must be given to `mq_open`,
    a pointer to a structure of type:'
