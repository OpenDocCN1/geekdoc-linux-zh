  md: '# Table 14.3: splice() flags


    | Flag | Meaning |

    |---|---|

    | SPLICE_F_MOVE | Trying moving the pages, avoiding a copy. This is just a hint,
    and if the buffers don''t refer to full pages of memory, or the kernel can''t
    move the buffer for any other reason, copies still happen. For tee(), vmsplice()
    this flag has no effect. |

    | SPLICE_F_NONBLOCK | Make the I/O non-blocking. However, blocking can still occur
    if the spliced file don''t have O_NONBLOCK set and they block. |

    | SPLICE_F_MORE | A hint that more data is coming. For tee(), vmsplice() this
    flag has no effect. |

    | SPLICE_F_GIFT | Unused for splice(), tee(). For vmsplice(), the user pages are
    given to the kernel and the application may never modify them. |


    This system calls are Linux-specific and cannot be used in portable programs.


