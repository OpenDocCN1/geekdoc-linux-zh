  md: '# 2. DYNAMIC ALLOCATION


    ulimit -s 1024


    which would limit the stack to 1 MB, or from within a program with:


    ```

    struct rlimit rl = {1024,1024};

    setrlimit(RLIMIT_STACK, &rl);

    ```


    (Cons the man page for setrlimit().) Normal users can only decrease the stack
    size which by default is 8 MB on Linux systems.


    Thus dynamic memory allocation is extremely useful in that objects of arbitrary
    size (limited only by the total memory available in the system and even) can be
    allocated and de-allocated when no longer necessary. The memory comes from the
    heap, the size of which can be elastically modified according needs.


    When using dynamic allocation it is important to free memory when it is no longer
    needed to avoid the generation of memory leaks. However, many programs rely on
    program termination to take care of freeing.


    The standard functions are:


    ```

    #include <stdlib.h>


    void *malloc(size_t size);

    void *calloc(size_t nmemb, size_t size);

    void *realloc(void *ptr, size_t size);

    void free(void *ptr);

    ```


    size is the number of bytes to be allocated. The calloc() function is equivalent
    to malloc() followed by clearing the memory. (Note it calls the product nmemb*size,
    the number of elements size of each one, so the parameter size is somewhat differently
    in this case.)


    The function realloc will perform resizing the buffer; if it can be done in place,
    but if necessary the new memory will be allocated and the contents of the original
    buffer copied over.


    Old versions of libc required explicit casting of the pointers returned by malloc(),
    but using void in the prototype eliminates that need. Such casting should not
    be used. (Note, C++ requires it.)


    How memory allocation works depends explicitly on libc and on the operating system
    kernel. In particular, a strategy which is non-unget and optimistic is followed.


    By non-unget one means that a legal address may be given as a return value from
    malloc() may not actually be physical memory yet associated with the address.
    For instance, not all of the memory may actually be used, the kernel may map physical
    memory to virtual addresses using demand page fault. It is also possible that
    the page may have been swapped out and needs to be swapped back in which also
    induces a normal page fault.


    By optimistic, one means that the system is allowed to overcommit memory (like
    an airline-booking flight.) This can lead to invocation of the dreaded OOM killer
    (Out Of Memory) which tries to select candidates to throw overboard. This can
    be turned off by:'
