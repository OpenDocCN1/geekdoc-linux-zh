    # 14.4 Named Pipes (FIFOs)


    Named pipes (or FIFO''s) allow you to create a pipe between two processes which
    may or not have a common ancestor. **FIFO** stands for *First In, First Out*.


    You can create a named pipe and wait for another process to establish a communication
    link with it.


    Unlike pipes, named pipes create an entry in the filesystem that can then be accessed
    by another process.


    No data transfer can take place until both a reader and writer are present (i.e.,
    a *rendezvous* takes place).


    A FIFO may be created either from the command line or by using a system call.
    From the command line try:


    ```

    cd /tmp

    mkfifo afifo

    cat < afifo &

    ls -l -1 afifo

    ```


    Note the use of **&**. Without it couldn''t type the next line, since **cat**
    blocks waiting for input.


    As a system call:


    ```

    #include <sys/types.h>

    #include <sys/stat.h>


    int mkfifo(const char *pathname, mode_t mode);

    ```


    For example:


    ```

    rc = mkfifo("/tmp/afifo", 0666);

    ```


    FIFO''s may be opened for reading or writing but not for both; i.e., in mode,
    **O_RDWR** is allowed, but **O_RDONLY** and **O_WRONLY** may only open FIFO with
    no data will return 0 bytes; a write on a non-blocking FIFO that can''t accept
    all of the bytes being written will fail or write only some of the bytes.


    A read on a non-blocking FIFO can be in the pipe at any time is given by the size
    of a **page** of memory (which is 4096 bytes on **x86**). Another limit, **PIPE_BUF**=4096
    gives the limit for an **atomic** write to the pipe; the amount of information
    that can be written on **x86** these numbers are the same but on other architectures
    with bigger page sizes, such as the **alpha**, they can be different.'
