  md: '# 30.4 Labs


    # Lab 1: Shared Memory


    Construct one or more programs to pass messages to each other in shared memory.


    The receiving program may terminate when it receives the message from the sending
    program.


    Make sure the shared memory is released when no longer needed.


    You may write more than one program, or write one program that can do multiple
    actions based on the arguments.


    Two solutions are given; one for System V IPC and one for POSIX IPC.


    The solutions are written so that they take an argument, which can be either create,
    remove, send, or receive, which controls their action.


    Don’t forget to compile with -lrt for the POSIX IPC solution.'
