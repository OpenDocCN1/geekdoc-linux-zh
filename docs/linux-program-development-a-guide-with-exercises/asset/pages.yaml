  md: '# 24.4 accept()


    After calling socket(), bind(), and listen(), a server needs to call accept()
    to actually use the socket:


    ```

    #include <sys/types.h>

    #include <sys/socket.h>


    int accept(int sd, struct sockaddr *addr, socklen_t *addrlen);

    ```


    Only connection-based sockets can use accept(), with types like SOCK_STREAM, SOCK_RDM,
    and SOCK_SEQPACKET.


    On success, accept() returns a new socket descriptor (a non-negative integer),
    which will be used for subsequent input and output operations with the client
    that has connected.


    On input, the third parameter, points to a variable giving the size of the address
    structure pointed to by the second parameter. On return, it returns the actual
    length (in bytes) of the filled-in address structure, which may not be more than
    the initial value.


    Unless the socket has been marked as non-blocking through fcntl() or setsockopt(),
    if no pending connections are queued, accept() will block until a client requests
    a connection.


    If using select() or poll() with multiple socket descriptors, one would call these
    functions and wait for an incoming connection. At that point accept() would get
    called and establish the connection.


    It is often the case that a server needs to handle requests from multiple clients
    as simultaneously as possible. There are a number of ways of designing such a
    concurrent server, such as creating a new child or sibling thread for each request.
    We''ll discuss this later.


    The possible error returns to accept() are:


    Table 24.3: accept() error return values


    | Error | Meaning |

    | --- | --- |

    | EAGAIN | No connections present, a non-blocking socket. |

    | EULDBLOCK | | |

    | EBADF | Invalid socket descriptor. |

    | ENOTSOCK | First argument is a file descriptor. |

    | EOPNOTSUP | Socket is not of type SOCK_STREAM. |'
