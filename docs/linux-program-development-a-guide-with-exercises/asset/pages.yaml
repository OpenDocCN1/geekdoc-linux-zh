  md: "# 15. CONDITIONAL OPERATIONS\n\nThe basic operations are initialization, signalling,\
    \ waiting, and destruction.\n\nA condition variable can be initialized first with\
    \ pthread_cond_init(); using NULL for the second argument gives default attributes.\
    \ However, a static allocation using PTHREAD_COND_INITIALIZER is sufficient.\n\
    \nCondition variables are connected to a mutex to avoid race conditions that would\
    \ arise when one thread signals a condition before another actually waits on it.\n\
    \npthread_cond_wait() unlocks the mutex and waits for the condition variable to\
    \ be signaled. The_timedwait() version gives a maximum waiting time.\n\npthread_cond_signal()\
    \ restarts one of the threads waiting on cond; pthread_cond_broadcast() wakes\
    \ up all threads.\n\nAs an example from the man page (See man pthread_cond_init):\n\
    \nConsider two variables x and y, protected by the mutex mut, and a condition\
    \ variable cond that is to be signaled whenever x becomes greater than y.\n\n\
    ```\nint x,y;\npthread_mutex_t mut = PTHREAD_MUTEX_INITIALIZER;\npthread_cond_t\
    \ cond = PTHREAD_COND_INITIALIZER;\n```\n\nWaiting until x is greater than y is\
    \ performed as follows:\n\n```\npthread_mutex_lock(&mut);\nwhile (x <= y) {\n\
    \    pthread_cond_wait(&cond, mut);\n}\n/* operate on x and y */\npthread_mutex_unlock(&mut);\n\
    ```\n\nModifications on x and y that may cause x to become greater than y should\
    \ signal the condition if needed:\n\n```\npthread_mutex_lock(&mut);\n/* modify\
    \ x and y */\nif (x > y) pthread_cond_broadcast(cond);\npthread_mutex_unlock(&mut);\n\
    ```\n\nNote that pthread_cond_wait() also make use of the same mutex that is referred\
    \ to in the pthread_mutex_lock() function.\n\nOne subtlety is that the function\
    \ pthread_cond_wait() function releases the mutex upon entry and reacquires it\
    \ upon exit. Otherwise, it would be impossible to broadcast that the condition\
    \ has been satisfied, since the mutex lock is taken out in order to do so."
