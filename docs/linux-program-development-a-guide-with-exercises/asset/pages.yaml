  md: '+   - Compile your code with the -pg option. (You need compile all the routines
    you run

    profile; for no others time will be available.)


    +   - Then running it as you normally will produce a file called gmon.out. This
    is binary file,

    so you can''t look at it directly.


    +   - Type gprof foo to get a report on program foo. (Use the -b option to make
    it less verbose).


    Input options control exactly what is reported, and the locations of the profile
    data file and the binary program.


    The open-source profile project (http://oprofile.sourceforge.net) doesn''t require
    a re-compilation to regenerate profiling information. It should come installed
    on most major Linux distributions. Full documentation including installation instructions
    and examples can be found at the project web site.


    Intel offers the VTune (http://developer.com/software/products/vtune) performance
    analyzer. This can perform time-based and event-based sampling, gaining all kinds
    of performance statistics, and source-level tuning. Using VTune for Linux requires
    (at present) the use of a Windows computer to run the user-interface, together
    with the target Linux system.


    The TAU (Tuning and Analysis Utilities) project ( http://www.cuoregon.edu/research/paracom/tau/)
    gives a complete performance analysis environment for a number of languages, including
    C, C++, Java, Fortran. TAU uses the PAPI (Performance Application Interface) (http://itcs.utk.edu/projects/papi/)
    which provides the hooks the hardware counters for monitoring.


    A number of small utilities should be used on your Linux distribution, which form
    a quite robust suite of performance monitoring capabilities. Some of the ones
    are:


    # Table 6.2: Performance monitoring utilities


    | Utility | Package | Use |

    |---|---|---| |

    | ps | proccs | Information about processes. |

    | top | proccs | Dynamic view of running tasks and system. |

    | vmstat | proccs | Information about memory paging, I/O, swapping, etc. |

    | free | proccs | Memory statistics. |

    | netstat | net-tools | Network connections, routing, statistics, etc. |

    | iostat | sysstat | Monitor I/O load. |

    | mpstat | sysstat | Processor related statistics. |

    | sar | sysstat | Collect, report, save system activity information. |


    You can view the man pages for these utilities for more information, and note
    that the ones which are purely text-based can be accessed from GUI''s under your
    desktop environment. You can find out about other utilities that are on your system
    by looking at the various packages. For example, on an RPM-based system:


    ```

    rpm -q proccs sysstat net-tools | grep bin

    ```'
