    # 18.4 Signals and Threads


    Signal handlers are shared among all threads of a multi-threaded application.
    However, each thread can have its own unique masks of pending and blocked signals.


    A termination signal must terminate all threads; however the Linux-specific tkill()
    system call can send a signal to one thread.


    When a signal is sent using kill() any thread may receive it. The kernel will
    pick any thread which does not have the signal blocked and cannot control the
    choice of which thread gets the assignment.


    Note that for a multi-threaded process, it is not true raise(sig) = kill(getpid(),sig);
    in fact raise() will send a signal to the current thread and not to any and all
    of them as kill() does.


    It is heretofore uncommon to have an application block all throwable signals in
    all but one thread, which takes the role of signal handler.


    Two function calls which implement this are:


    ```

    #include <signal.h>

    ```'
