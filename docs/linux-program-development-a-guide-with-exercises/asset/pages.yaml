  md: "# Lab 2: Version Control with git\n\nYour system may already have git installed.\
    \ Doing which git should show you if it is already present. If not, while you\
    \ may obtain the source and compile it, it is usually easier to install the appropriate\
    \ pre-compiled binary packages.\n\nFor RHEL-based systems (including CentOS) the\
    \ easiest way is to use the EPEL repository. Obtain the rpm for installing the\
    \ repository from http://fedaproject.org/wiki/EPEL. Then yum install git will\
    \ accomplish installation. For Fedora-based systems the same command will work\
    \ and there is no need to use EPEL.\n\nFor Debian-based systems (including Ubuntu)\
    \ it should be sufficient to do apt-get install git-core.\n\nFor Suse-based systems,\
    \ one can do zypper install git-core.\n\nNow we can proceed, First we'll have\
    \ to make a directory to work in, and then initialize git:\n\n```\n$ mkdir git-test;\
    \ cd git-test\n$ git init\n```\n\nNext we have to add some files to our project:\n\
    \n```\n$ git update-index --add [whatever files you want]\n```\n\nNow we modify\
    \ one of the files in the project; perhaps something like:\n\n```\n$ echo \"An\
    \ extra line\" >> [one of the project files]\n```\n\nand see the difference with\
    \ the original repository created with:\n\n```\n$ git diff\n```\n\nTo finish setting\
    \ up the repository we do:\n\n```\n$ tree=$(git write-tree)\n$ commit+$(echo 'The\
    \ Initial Commit' | git commit-tree $tree)\n$ git update-ref HEAD $commit\n```\n\
    \nDoing diff HEAD will also show the changes now.\nTo actually commit the changes\
    \ to the repository we do:\n\n```\n$ git commit\n```\n\nIf we now do git diff\
    \ we'll see no changes with the committed repository. To see the history we\n\
    \ do:\n\n```\n$ git log\n```"
