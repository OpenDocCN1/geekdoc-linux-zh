  md: 'Besides searching the data base built up by ldconfig, the linker will first
    search any directories specified in the environmental variable LD_LIBRARY_PATH,
    a colon separated list of directories, as in the PATH variable. It is important
    to do


    ```

    export LD_LIBRARY_PATH=$HOME/foo/lib

    ```


    rather than


    ```

    LD_LIBRARY_PATH=$HOME/foo/lib

    ```


    Do you see why?


    # 3.3 Linking To Libraries


    Whether a library is static or fixed, executables are linked to the library with:


    ```

    gcc -o foo foo.c -L/mypath/lib -lfoolib

    ```


    which will link in /mypath/lib/libfoolib.so, if it exists, and /mypath/lib/libfoolib.a
    otherwise.


    The name convention is that -what refers to library libwat.so.(a) If both libwat.so
    and libwat.a, the shared library will be used, unless -static is used on the compile
    line.


    It is possible to have circular library dependencies, and since the loader make
    only one pass through the libraries requested, you can have something like:


    ```

    gcc ... -1A -1B -1A ..

    ```


    if lib refers to a symbol in libA which is not otherwise referred to. While there
    is an option to make the loader make multiple passes (see info gcc for details)
    it is very slow, and a proper, layered, library architecture should avoid this
    going in circles.


    The default library search path will always include /usr/lib and /lib. To see
    exactly what is being searched you can do gcc --print-search-dirs. User-specified
    library paths come before the default ones, there are extended options to gcc
    to reverse this pattern.


    # Getting Debug Information


    Once can use the environmental variable LD_DEBUG to obtain useful debugging information.
    For instance, doing:


    ```

    LD_DEBUG=help

    ```


    and then typing a command gives:'
