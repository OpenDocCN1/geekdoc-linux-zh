    # 23.7 Labs


    # Lab 1: Simple Internet echo Client


    Take the simple Internet echo client program, and make it more robust, checking
    for errors at each stage, such as creating the socket, connecting to it, and reading
    and writing from it.


    Try it first on your local machine. (Make sure the echo server is on with chconfig
