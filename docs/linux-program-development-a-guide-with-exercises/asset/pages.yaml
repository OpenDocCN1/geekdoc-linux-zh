    and include:


    # Table 2.9: Preloaded compiler definitions


    | -D_GNUC_=4 | -D_GNUC_MINOR_=1 | -D_GNUC_PATCHLEVEL_=2 |

    | -Dunix | -D_unix | -D_unix_ |

    | -Di386 | -D_i386_ | -D_i386_ |

    | -Dlinux | -D_linux | -D_linux_ |

    | -D_gnu_linux | | |'
