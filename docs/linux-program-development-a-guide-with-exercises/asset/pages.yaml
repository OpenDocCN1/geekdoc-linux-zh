  md: '# 11.4 Memory Mapping


    Through the use of mmap() function regions of a file may be mapped directly to
    memory.


    Access may be done through memory references rather than read/write functions.
    If permissions are appropriate more than one process may share the mapping simultaneously.


    Mapping and unmapping are done with:


    ```

    #include <unistd.h>

    #include <sys/mman.h>


    void *mmap(void *start, size_t length, int prot, int flags, int fd, off_t offset);

    munmap(void *start, size_t length);

    ```


    The mmap() function maps length starting at offset bytes from the beginning of
    the file referred to by fd.(The offset must be an integral number of pages, or
    an error occurs.) Success yields a pointer to the memory mapped region, and MAP_FAILED
    on failure.


    You use mmap() like you would call malloc(): i.e.,


    ```

    char *buf, *buf2;

    int nbytes;

    ...

    buf = mmap(NULL, nbytes, ...);

    buf2 = malloc(nbytes);

    ...

    memcpy(buf,buf2,nbytes);

    ...

    munmap(buf, nbytes);

    free(buf2);

    ```


    The argument start gives a preferred address; usually 0 (or NULL) should be given
    and the system will furnish the address where the mapping occurs as a return value.
    If this argument is given, it must be page aligned and not already in use.


    The prot argument can be:


    Table 11.5: mmap() protection values


    | Value | Meaning |

    |---|||

    | PROT_READ | Mapped pages may be read. |

    | PROT_WRITE | Mapped pages may be written. |

    | PROT_EXEC | Mapped pages may be executed. |

    | PROT_NONE | Mapped pages may not be accessed. |


    The protection must agree with the access flags used when the file was opened;
    e.g., you can''t write to a file opened with O_RDONLY.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'The flags argument can have the following values:


    # Table 11.6: mmap() flags


    | Flag | Meaning |

    |--- |--- |

    | MAP_FIXED | If the specified address can not be used, fail. |

    | MAP_SHARED | Share with other processes. Writes are written back to the file.
    |

    | MAP_PRIVATE | Create a private copy-on-write mapping. |


    Either MAP_SHARED or MAP_PRIVATE must be specified.


    Note that a private mapping does not change the file on disk. Whatever changes
    are made will be lost when the process terminates.


    Other non-POSIX flags can be specified (see man mmap.) In particular, the MAP_ANONYMOUS
    flag permits a mapping only in memory, without a file association.


    munmap() releases the mapping and causes further references to the mapped address
    to fail. When the process terminates or begins a new program through an exec()
    call, unmapping is done automatically.


    To find out how a process is using memory mapping, you can can


    ```

    cat /proc/<pid>/maps

    ```


    where you substitute the process ID of any running process. Note a p indicates
    a private memory mapping and an i indicates a shared one.


    This information can be filtered through the pmap utility to make it more readable:
    e.g.,


    ```

    $ flock -d <pid>

    ```


    # 11.5 flock() and fcntl()


    These two functions, flock() and fcntl() can be used to apply locking mechanisms
    to a file, or a region of a file. In addition fcntl() can be used for other purposes
    as well.


    Locking can be mandatory or advisory; the first blocks all read and write access
    to a file or an area of a file, except to the owner of the lock. The second kind
    of lock is effective only when both users agree to examine the lock on the file,
    and then permits read and write operations as long as the appropriate lock is
    set up and released when done. Mandatory locking is less efficient because of
    the extra checks that must be made on all I/O operations, and is not usually used.


    By default, locks are advisory. One way to change a lock to mandatory is setting
    a file''s set-group (sgid) while clearing its execute bit. Since this combination
    makes no sense, the kernel uses the combination as an indication to use mandatory
    locks.


    If one wants to make all locks on a given filesystem, the filesystem can be mounted
    (or remounted) with the MS_MANDLOCK flag. This, however, requires super-user access'
