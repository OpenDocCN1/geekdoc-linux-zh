    # 13.5 Exiting


    The following functions result in process termination, which may be normal or
    abnormal:


    ```

    #include <unistd.h>

    void _exit (int status);


    #include <stdlib.h>

    void exit (int status);

    void abort(void);

    ```


    Normal termination can occur in three ways:


    +   - Calling return() from main(); this is the same as calling exit().

    - Calling exit(). All streams are flushed and closed. All handlers registered
    with atexit() and on_exit() (to be discussed shortly) are called (in reverse order
    of registration).

    - Calling _exit() (which is also called by exit()). All open file descriptors
    are closed, all child processes are inherited by process 1 (init) and SIGCHLD
    is sent to the parent process.


    Abnormal termination can occur over two ways:


    +   - An abort() generates SIGABRT and causes a core dump to be generated. All
    open streams are closed and finished. If SIGABRT is blocked or ignored, abort()
    will still terminate and core dump, if the signal is caught it may be avoided.

    - Any signal whose default behaviour is termination and for which a non-terminating
    signal handler is not installed kills the process.


    Exit handling functions may be registered with the functions:


    ```

    #include <stdlib.h>

    int atexit(void (*function)(void));

    int on_exit(void (*function)(int, void *), void *arg

    ```


    The on_exit() is similar to atexit() except that the function is passed the argument
    to exit() and the argument. These functions return 0 on success; -1 on failure.
    (errno is not set).


    Note that these functions are not in the case of an abnormal termination.


    It is also possible to use destructor methods as we describe next.'
