  md: '# Preface


    ![](img/f604778e5fd8b5339b52bd5345099d26_18_0.png)


    # Objectives


    Linux Program Development is designed to bring experienced programmers up to speed
    quickly in a Linux environment.


    You will learn the tools and methods for developing C programs and doing systems
    programming under Linux, including:


    +   - Compilers, compiling, linking and loading programs.

    - Building and using both static and shared libraries.

    - Using make and developing Makefiles.

    - Version control.

    - Debugging techniques.

    - How system calls are made and the difference with regular library functions.

    - The structure of Linux systems.

    - File I/O functions, using both system-level and standard library calls.

    - Advanced file operations, including directory and stat functions, and file locking.

    - Process management, including forking and exiting, process groups, and waiting.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# PREFACE


    +   - Pipes, unnamed and named (FIFO).

    - Signal dispatching and handling.

    - Writing multi-threaded applications using the pthreads (Posix Threads) library
    and API.

    - An introduction to network socket programming.

    - System V and POSIX IPC, including shared memory, semaphores, and message queues.


    Upon mastering this material, you will have the necessary tools to develop advanced
    applications on a Linux system.


    # Target Audience


    You are interested in learning how to write applications for or port them to the
    Linux environment. Maybe you are just doing this for fun, but more likely you
    have this task as part of your job. The purpose here is to ease your path and
    perhaps shorten the amount of time it takes to reach a level of basic competence
    in this endeavor.


    How much you get out of this and how bug-free, efficient, and optimized your drivers
    will depends on how good a programmer you were before you started with the present
    material. There is no intent here to teach you the elements of good programming
    or the Linux operating system design in great detail.


    You should:


    +   - Be proficient in the C programming language. (You can do the programming
    exercises in C++ if you prefer, but all example solutions are in C.)

    - Be familiar with basic Linux (Unix) utilities, it belongs as ls, rm, grep, tar.

    - Be comfortable using any of the available text editors (i.e., emacs, vi.).

    - See the X-Window system before.


    Experience with any major Linux distribution is helpful but not strictly required.
    Likewise readers could be weak on any of the above except familiarity with the
    C programming language.


    There is no shortage of books and classes on programming methods. For Linux operating
    system the choices may be fewer, but they exist.


    One text demands special mention is Advanced Programming in the UNIX Environment,
    by W. Richard Stevens, published by Addison Wesley; it belongs on every developer''s
    bookshelf and is used as a primary source by virtually every book on the subject.


    All major Linux distributions come with exhaustive documentation, and programming
    subjects including functions, data structures, are covered by man pages. These
    can be accessed from the command line (e.g., man 2 open to get documentation on
    the system call open(), which is in chapter 2 of the manual), or graphical front-ends
    installed on most distributions.


    Some slapped Linux books merely rephrase man pages, or even copy, paste and regurgitate
    them. I''ve tried to avoid that and will recommend looking at the man page for
    more details.


    # xviii'
