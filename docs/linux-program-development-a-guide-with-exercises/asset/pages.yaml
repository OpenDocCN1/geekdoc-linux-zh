  md: 'cmd can have the following values:


    # Table 31.1: System V semaphores semctl() parameters


    | Value | Meaning |

    |---||

    | IPC_STAT | Retrieve semid_ds structure and put in buf. |

    | IPC_SET | Set values of the sem_perm member of the semid_ds structure to that
    in buf. |

    | IPC_RMID | Remove the semaphore (immediately). |

    | GETALL | Retrieve the semaphore values in the set and put in array pointed by
    arg.array. |

    | GETNCNT | Return value of semcnt for member semnum. |

    | GETPID | Return value of semid for member semnum. |

    | GETVAL | Return value of semval for member semnum. |

    | GETZCNTC | Set all semaphore values in the set to those pointed to by arg.array.
    |

    | SETVAL | Set the value of semval for member semnum. Used to initialize to a
    known value, passed as val. |


    Note that IPC_RMID will actually remove the semaphore set immediately! Any processes
    subsequently addressing the semaphore set will return with an errno set to EIDRM.

    semctl() returns 0 on success, -1 on error (errno is set).

    The following limits are associated with semaphore sets:


    # Table 31.2: System V semaphore limits


    | Parameter | Value | Meaning |

    |---|---||

    | SEMMNI | 128 | System wide maximum number of semaphore sets. |

    | SEMSSL | 250 | Maximum number of semaphores per ID. |

    | SEMNS | 32000 | System wide maximum number of semaphores, = SEMNI*SEMMSL. |

    | SEMVMX | 32767 | Maximum value for a semaphore. |

    | SEMOPM | 32 | Maximum number of operations per semop() call. |


