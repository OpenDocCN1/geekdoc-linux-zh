    # 18.1 Multi-threading under Linux


    Threads are so called light-weight processes that share access to a single memory
    space and environment, and are quite different from ordinary Unix processes.


    A multi-threaded approach divides a process into a number of execution paths that
    can be executed in parallel; the threads may be spawned and then joined back together.
    Careful synchronization is required among the parallel processes.'
