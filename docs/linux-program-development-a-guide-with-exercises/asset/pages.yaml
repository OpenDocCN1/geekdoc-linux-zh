- img_proc: true
  md: '# 5.3 SUBVERSION


    # CVS


    CVS is the Concurrent Versions System. and does a more thorough job of letting
    multiple developers work on the same source concurrently. However, it has a steeper
    learning curve, as it has many more commands and provides possible environmental
    customizations.


    CVS stores all files in a centralized repository. One never works directly with
    the files in the repository; instead you get your own copies into your working
    directory, and when you are finished with changes you (commit) them back into
    the repository.


    It is possible for the repository to be on a remote machine anywhere in the world.
    Its location may be specified either by setting the CVSROOT environmental variable,
    or with the -d option; i.e., the two lines are equal:


    ```

    cvs -d /home/coop/mycvs init


    export CVSROOT=/home/coop/mycvs ; cvs init

    ```


    A number of users can make changes to a given module at once. There are a number
    of commands to help with resolving differences and merging work.

    As for RCS, emacs can be used tightly with CVS using the vc mode and related functions.


    # 5.3 Subversion


    The open-source Subversion project is designed to be the successor to CVS and
    is gradually placing it in many arenas.


    In order to keep the transition smooth the Subversion interface resembles that
    of its predecessor, and it is easy to migrate CVS repositories over to it.


    Directories, copies and versions are renamed, not just files and contents. Metadata
    associated with files (such as permissions) can also be versioned.


    Revision numbering is in a per-commit, not per-file, and atomicity of commits
    is complete; unless the entire commit is complete part of it goes through.


    A standalone Subversion server can be set up using a custom protocol, which runs
    as an inet server or as a daemon, authentication and authorization. One can also
    use Apache to set up a http-based server.


    There are many enhancements that improve efficiency and reduce storage size requirements.
    In particular, costs are proportional to the size of the change set, not that
    of the data set.


    In particular, binary files can be handled, and there are built in tools for the
    mirroring of repositories.'
  merge: -1
