  md: "# CHAPTER 8. MEMORY MANAGEMENT AND ALLOCATION\n\n```\n$ echo 2 > /proc/sys/vm/overcommit_memory\n\
    ```\n\nThere are many implementations of malloc() and depending on how a program\
    \ is linked, different ones can be chosen at runtime by forcing certain shared\
    \ library choices; this is often done for debugging purposes for example. It is\
    \ also possible to tune the allocation routine's behaviour as we will discuss\
    \ shortly.\n\n# 8.3 Tuning malloc()\n\nThe malloc() implementation in libc permits\
    \ a significant amount of tuning as well as the ability to gather information\
    \ about ongoing allocations.\n\nFor small allocations malloc() uses the brk()\
    \ and sbrk() system calls, which reset and resize the data segment by a process.\
    \ For larger allocations, malloc() uses the mmap() system call, which always provides\
    \ multiples of the page size (4 KB on x86).\n\nThe competition between sbrk()\
    \ and mmap() can be influenced through the use of:\n\n```\nint mallopt(int param,\
    \ int value);\n```\n\nThe meaning of parameters and values passed to malloc()\
    \ are:\n\nTable 8.1: malloc() parameters\n\n| Parameter | Value |\n| M_MMAP_THRESHOLD\
    \ | Any memory request that the value supplied are allocated using mmap() rather\
    \ than sbrk(). Smaller chunks may still be allocated with malloc(). |\n| M_MMAP_MAX\
    \ | The value is the maximum number of chunks to allocate with malloc(); setting\
    \ to 0 disables all use of mmap(). |\n| M_TRIM_THRESHOLD | The value is the minimum\
    \ bytes that will cause sbrk() to be called with a negative argument, returning\
    \ memory to the system. |\n| M_TOP_PAD | The value is the amount of extra memory\
    \ to obtain when calling sbrk(), and is the number of bytes to keep shrinking\
    \ the heap. This provides hysteresis in heap size to avoid frequent system calls.\
    \ |\n\nStatistics about the current allocations can be obtained using the functions:\n\
    \n```\nstruct mallinfo mallinfo (void);\nvoid malloc_stats (void);\n\nstruct mallinfo\
    \ {\n  int arena;      /* non-mapped space allocated from system */\n  int ordblks;\
    \   /* number of free chunks */\n```"
