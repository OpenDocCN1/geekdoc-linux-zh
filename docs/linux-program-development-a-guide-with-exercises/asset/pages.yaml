- img_proc: true
  md: '# SHARED LIBRARIES


    gcc -fPIC -Wl,-soname=libfunctions.so.1 *.o -o libfunctions.so.1.0 -lc


    where the -Wl gcc tells to pass the option to the linker. The -lc tells the linker
    that lib is needed which is generally the case.


    You can usually get away ignoring the -fPIC and -Wl,-soname options, but it is
    not a good idea. This is because gcc normally emits code anyway; in fact giving
    the option prevents the compiler from ever issuing position-dependent code.


    Note that it is really the linker (ld) that is doing the work, and the above step
    could also have been written as:


    ```

    ld -shared -soname=libfunctions.so.1 *.o -o libfunctions.so.1.0 -lc

    ```


    To get the above to link and run properly, you will also have to do:


    ```

    ln -s libfunctions.so.1.0 libfunctions.so

    l -s libfunctions.so.1.0 libfunctions.so.1

    ```


    If you leave out the first symbolic link you won''t be able to compile the program;
    if you leave out the second you won''t be able to run it. It is at this point
    the version check done, and if you don''t use the soname option when compiling
    the library, no check will be done.


    In many cases both a shared and a static version of the same library may exist
    on the system, and the linker will choose the shared version by default. This
    may be overridden with the -static option to the linker. However, if you do this
    all will be linked in statically, including libc, so the resulting executable
    will be large; you will have to be more careful than that.


    The GNU libtool script can assist in providing shared library support, with compiling
    and linking libraries and executables, and is particularly useful for distributing
    applications and packages. Full documentation can be obtained by info libtool.


    # Finding shared libraries


    A program which uses shared libraries has to be able to find them at run time.


    ld can be used to ascertain what shared libraries an executable requires. It shows
    the soname of the library and what it points to:


    ```

    $ ld /bin/bd

    ```


    ```

    linux-vdso.so.1 -> (0x0000fffd7e2000)

    librt.so.1 => /lib64/librt.so.1 (0x0000003f16c00000)

    ibc.so.6 -> /lib64/libc.so.6 (0x0000003f14400000)

    libthread.so.0 -> /lib64/libthread.so.0 (0x0000003f15000000)

    lib64/ld-linux-x86-64.so.2 (0x0000003f14000000)

    ```


    ldconfig is generally run at boot time (but can be run anytime), and uses the
    file /etc/ld.so.conf, which lists the directories that will be searched for shared
    libraries. ldconfig must be run as root and shared libraries should only be stored
    in system directories when they are stable and useful.'
