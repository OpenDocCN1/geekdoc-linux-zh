    And that is how we got here. This not just a repackaging of the courses that were
    previously marketed and delivered. There has been a rather rewrite, development
    of new exercises, addition of new material and deletion of old material.


    # Linux Developer Classes Now Available


    I don''t expect to get rich by publishing this material. I do hope that if you
    have Linux training needs you view it as a good advertisement for engaging our
    services for live in-person training classes.


    The following classes are available:


    +   * Linux Program Development

    * Linux Device Drivers

    * Linux Kernel Internals


    Each of these classes are a five days in length. Customization and combination
    options are available. Until demand gets out of control your author is expected
    to be the instructor.


    For detailed descriptions and outlines and pricing and logistics visit http://www.coopj.com
    and contact coop@coopj.com.


    # Acknowledgments


    First of I must thank my employer of over 15 years, Axian Inc (http://www.axian.com)
