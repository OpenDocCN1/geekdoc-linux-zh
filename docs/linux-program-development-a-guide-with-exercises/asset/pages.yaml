  md: 'create libsubs.a if it does not exist, and insert or update any object files
    in the current directory.


    +   ranlib generates, and stores within an archive, an index to its contents.
    It lists each symbol defined by the relocatable object files in the archive. This
    index speeds up linking to the library.

    The command


    ```

    ranlib libsubs.a

    ```


    is completely equivalent to running -libsubs.a. While running ranlib is essential
    under some Unix implementations, under Linux it is not strictly necessary, but
    it is a good habit to get into.


    +   nm lists symbols from object files or libraries. The command


    ```

    nm -s libsubs.a

    ```


    gives useful information. nm has a lot of other options.


    # 3.2 Shared Libraries


    A single copy of a shared library can be used by many applications at once; thus
    executable sizes are reduced.


    Shared libraries have the extension .so. Typically the full name is something
    like libc.so.N N is a major version number.


    Under Linux shared libraries are carefully versioned. For example, a shared library
    might have any of the following names:


    > Table 3.1: Shared library names


    | libmyfuncs.so.1.0 | The actual shared library |

    | libmyfuncs.so.1 | The name included in the soname field of the library. Used
    by the executable at run-time to find the latest revision of the v. 1 myfuncs
    library. |

    | libmyfuncs.so | Used by gcc to resolve symbol names in the library at link time
    when the executable is created. |


    To create a shared library first one must compile all sources with the -fPIC option,
    which generates so-called Position Independent Code; don''t use -fpic; it produces
    somewhat faster code on m68k, m88k, and Sparc chips, which imposes arbitrary size
    limits on shared libraries.


    ```

    gcc -fPIC -c func1.c

    gcc -fPIC -c func2.c

    ```


    To create a shared library, the option -shared must be given during compilation,
    giving the soname of the library as well as the full library name as the output:'
  merge: -1
