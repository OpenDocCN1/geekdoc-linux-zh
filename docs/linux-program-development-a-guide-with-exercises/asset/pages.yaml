  md: 'The constructor functions are executed before dlopen() returns, or before main()
    is started if the library is loaded at load time. The destructor functions are
    executed before dlclose() returns, or after exit() or completion of main() if
    the library is loaded at run time.


    Here''s an example showing how they are used:


    ```

    /* prototype them with attributes */

    void init_fun(void) __attribute__ ((constructor));

    void exit_fun(void) __attribute__ ((destructor));

    /* then define them */

    void init_fun (void) { ... whatever ... };

    void exit_fun (void) { ... whatever ... };

    ```


