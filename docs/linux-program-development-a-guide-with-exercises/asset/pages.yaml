    \ Memory\n\nPOSIX shared memory objects are created, opened and removed with:\n\
    \n```\n#include <sys/types.h>\n#include <sys/mman.h>\n```\n\n```\nint shm_open(const\
    \ char *name, int oflag, mode_t mode);\nshm_unlink(const char *name);\n```\n\n\
    Although Linux does not require it, name should start with a / and have no others\
    \ embedded. When the shared memory segment exists it will be visible under /dev/shm.\n\
    \nThe flag argument to shm_open() must include either O_RDONLY or O_RDWR and can\
    \ be combined with:\n\n+   * O_CREAT: Create the shared memory object if it does\
    \ not exist. In this case the mode argument contains the user permission bits.\
    \ If this flag is not set, the mode argument is ignored as for the usual open().\n\
    * O_EXCL: Return an error if O_CREAT is specified and an object of the same name\
    \ already exists.\n* O_TRUNC: If the object already exists, truncate to zero length.\n\
    \nThe successful return value of shm_open() is a valid descriptor.\n\nWhen the\
    \ shared memory object is no longer needed, it can be removed with shm_unlink().\
    \ Note that this will occur only when all processes have called it munmap() or\
    \ terminated. The object can also be removed from /dev/shm from the command line."
