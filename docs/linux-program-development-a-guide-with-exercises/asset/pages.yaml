  md: '# CHAPTER 31. SEMAPHORES


    Although Linux doesn''t require, name should start with a / and have no others
    embedded. When the semaphore exists it will be visible under /dev/shm.\u00a0\u00a


    The oflag argument to semopen() is used only when creating a semaphore; attaching
    to one already exists is ignored.


    If the value O_CREAT is specified, the semaphore is created if it does not exist.
    This is combined with O_EXCL an error is returned by an object of the same name
    already exists.


    When O_CREAT is specified, the mode argument contains the usual permission bits,
    and the fourth argument contains the initial semaphore value (usually 1). If this
    flag is not set, both the third and fourth arguments are ignored.


    If sem_open() fails it returns a value of SEM_FAILED.


    When the semaphore no longer needed, it can be removed with sem_unlink(). Note
    that this will occur only when all processes have called sem_close() or terminated.
    The object can also be removed from /dev/shm from the command line.


    So far we have named semaphores. it is also possible to use unnamed semaphores,
    which are usually local to a process (which can have multiple threads). To do
    this one declares (or allocates) a structure of type sem_t and then uses


    ```

    int sem_init(sem_t *sem, int pshared, unsigned int value);\int sem_destroy(sem_t
    * sem);

    ```


    to initialize and destroy the semaphore object, instead of the earlier set of
    functions. If pshared is 0 the semaphore is local to the current process; otherwise
    it may be shared.


    Semaphore control is done with the following functions:


    ```

    int sem_wait(sem_t * sem);\int sem_trywait(sem_t * sem);\int sem_timedwait(sem_t
    *sem, const struct timespec *abs_timeout);\int sem_post(sem_t * sem);\int sem_getvalue(sem_t
    * sem, int * sval);

    ```


    where:


    sem_wait() is the down operation, the caller is suspended if the semaphore counter
    is zero, until an up operation gives it a non-zero value. The counter is then
    atomically decreased. This function returns .


    sem_trywait() is the non-blocking version of sem_wait(). If the semaphore counter
    is 0 returns EAGAIN.


    sem_timedwait() puts an upper limit on how long the down operation should block,
    with the time value using the following structure:


    ```

    #include <time.h>

    struct timespec {

    long tv_sec;    /* seconds */

    long tv_nsec; /* nanoseconds */

    };

    ```'
