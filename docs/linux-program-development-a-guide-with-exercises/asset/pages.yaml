    # 2.4 Other Languages


    Pascal (done with translation to C.)

    Fortran can be invoked with gfortran, f77, g77, and f95. Once again the backend
    is gcc.

    Java support is well-featured, with a number of options for runtime environments,
    development kits, compilers, integrated environments etc.

    One can also find compilers for other languages, including Basic, Ada and lisp,
    by searching various Linux resources. In addition many commercial compilers are
    out there and can be purchased.


    # 2.5 Integrated Development Environments (IDE)


    There are a very large number of Integrated Development Environment (IDE)''s available
    under Linux. These typically include an editor, an interactive debugger with source
    code navigation, object disassembly, and automatic Makefile generation.


    Many developers used to working in a Unix-like environment prefer to roll their
    own IDE, with emacs is an editor or vi at the center.

    While emacs is an editor at the core, it has evolved into a complete desktop environment.
    There is a steep learning curve but it is very powerful. Generally a lot of site
    and user customization is required before it becomes a satisfactory IDE.


    If you prefer working with a pre-packaged IDE, there are many offered. Some are
    under open-source licenses, and some are proprietary, or offer versions in either
    form.

    The following list gives a sense of what is available; You''ll have to investigate
    further to see what fits your needs.'
