    \ the default is fast. These describe what happens if a thread tries to lock a\
    \ mutex with pthread_mutex_lock():\n\nTable 19.1: Posix threads types\n\n| Type\
    \ | Symbolic Name | Meaning |\n|---| fast | PTHREAD_MUTEX_FAST_NP | Suspend the\
    \ calling thread forever. |\n recursive | PTHREAD_MUTEX_RECURSIVE_NP | Return\
    \ immediately with a success return code. |\n error checking | PTHREAD_MUTEX_ERRORCHECK_NP\
    \ | Return immediately with error code EADLK. |\n\nThe _NP suffix indicates these\
    \ are non-portable extensions to the POSIX standard and shouldn't be used in portable\
    \ code.\n\n# 19.3 Semaphores\n\nIt is also possible to use POSIX semaphore operations\
    \ to control access to resources. We will defer a full treatment until we discuss\
    \ POSIX IPC, even though it properly here.\n\nThe following functions are for\
    \ POSIX 1003.1b semaphores (not System V) and are counters for resources shared\
    \ between threads:\n\n```\n#include <pthread.h>\n#include <semaphore.h>\n\nint\
    \ sem_init(sem_t *sem, int shared, unsigned int value);\nint sem_wait(sem_t *sem);\n\
    int sem_trywait(sem_t *sem);\nint sem_post(sem_t *sem);\nint sem_getvalue(sem_t\
    \ *sem, int *sval);\nint sem_destroy(sem_t *sem);\n```\n\nThe structure sem_t\
    \ *sem points to a semaphore object. One need not to be concerned with the internal\
    \ details of the structure.\n\nsem_init() initializes the semaphore object pointed\
    \ to by sem, setting it to value. If pshared is 0 the semaphore is local to the\
    \ current process; otherwise it may be shared.\n\nsem_wait() suspends the calling\
    \ until the semaphore pointed to by sem non-zero count and atomically decreases\
    \ the count.\n\nsem_trywait() is a non-blocking version of sem_wait(). If the\
