  md: '# CHAPTER 6. DEBUGGING


    gdb allows you to step through C and C++ programs, setting breakpoints, displaying
    variables, etc. (Actually it will work with programs in native Fortran and other
    languages that use gcc as a back end as well). In addition, gdb can properly debug
    multi-threaded programs.


    Programs have to be compiled with the -g option for symbol and line number information
    to be available to gdb. Note, you can still use gdb to get some information even
    if this hasn''t been done; for instance the where command often tells you exactly
    where the program bombed.


    There are many graphical interfaces for gdb which make it much easier to use;
    we will mention three: ddd, kdbg, and Insight. Technically, while none of these
    provides a complete integrated development environment, you can easily provide
    some of the ingredients for building your own.


    +   * The home site for ddd is: http://www.gnu.org/software/ddd. Your distribution
    may offer it as a standard package.

    * The kdbg graphical front end to gdb is part of the KDE desktop system, but can
    be run under other desktop managers as Gnome. If only the kdbg package is installed,
    the debugger will work without problem, but one must install at the kdebase package
    to have the help system operational.

    * The Insight graphical front end to gdb is written in T/Tk, and is provided under
    the GPL by Red Hat its Cygnus Solutions subsidiary. Documentation, features and
    binaries can be downloaded from http://sources.redhat.com/insight/


    ```

    If fork() is called, the default behaviour of gdb is to continue following the
    process. This can be controlled with the command:


    set follow-fork-mode child


    to proceed with debugging the child instead, after the fork() call.


    One can restore the default behaviour:


    set follow-fork-mode parent

    ```


    # 6.2 Electric Fence


    Electric Fence is a memory allocation debugger, written by Bruce Perens. It is
    a rather old project, but still has very useful capabilities. Documentation can
    be accessed by typing man fence, or looking at http://perens.com/FreeSoftware.


    This tool detects overruns of malloc() memory allocations or accesses of memory
    allocations that have been released by free(). It can do such on both reads and
    writes. In order to do this, Electric Fence substitutes specialized versions of
    the malloc() and free() functions (and their relatives) for the dynamic allocation
    and freeing of memory.


    To use Electric Fence all you have to do is link to its library with -lefence
    during compilation.'
  merge: -1
