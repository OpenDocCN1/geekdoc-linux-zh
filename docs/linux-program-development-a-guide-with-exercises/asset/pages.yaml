  md: '# 15. FLOCK() AND FCNTL()


    flock() can apply or remove an advisory lock:


    ```

    #include <sys/file.h>

    ```


    ```

    int flock (int fd, int operation)

    ```


    The file specified by fd must be open and operation may be:


    Table 11.7: fcntl() flock operations


    | Value | Meaning |

    |---|---|

    | LOCK_SH | More than one process may share the lock. |

    | LOCK_EX | Only one process can hold the lock. |

    | LOCK_UN | Unlock the file. |

    | LOCK_NB | Don''t block when locking. Can be OR''ed with other operations. |


    On success, 0 is returned; on error -1, errno set. Currently the only error is
    EWOULDBLOCK means the file is locked and LOCK_NB was specified.


    fcntl() can be used a number of ways to influence or modify the way a file descriptor
    is:


    ```

    #include <unistd.h>

    #include <fcntl.h>

    ```


    ```

    int fcntl (int fd, int cmd);

    int fcntl (int fd, int cmd, long arg);

    int fcntl (int fd, int cmd, struct flock * lock);

    ```


    What fcntl() does depends on the value of cmd:


    Table 11.8: fcntl() commands


    | Value | Meaning |

    |---|---|

    | F_DUPFD | arg will be a copy of fd, which may be closed first if necessary (equivalent
    to dup2()). The new file descriptor is returned on success. |

    | F_GETFD | Obtain the close-on-exec flag; if low order bit is 0 remains open
    across exec(); otherwise close. |

    | F_SETFD | Set close-on-exec flag to arg''s lowest bit. |

    | F_GETFL | Read all the flags of the file descriptor. |

    | F_SETFL | Set the file descriptor''s flags to arg; only 0_APPEND, 0_NONBLOCK,
    0_ASYNC may be set. |

    | File Locking | |

    | F_GETLK | If the file is unlocked set the l_type of the flock structure to F_UNLCK.
    If the file is locked fill in the entire flock structure with values, not just
    the l_type element. |'
