  md: '# 5.4 git


    The Linux kernel development system has special needs in that it is widely distributed
    throughout the world, with hundreds (even thousands) of developers. Furthermore
    it is all done very much publicly; under the GPL.


    For a long time there was no real source revision control system. Then major kernel
    developers went over the use of BitKeeper (see http://www.bitkeeper.com), which
    while a commercial project granted a restricted license for Linux kernel development.


    However in a very public dispute over licensing restrictions in the spring of
    2005, the free use of BitKeeper became unavailable for Linux kernel development.


    The response was the development of git, whose primary author is Lin Torvalds.
    The source code for git can be obtained from http://www.kernel.org/pub/software/scm/git/;
    and full documentation can be found at http://www.kernel.org/pub/software/scm/git/docs.


    An article explaining the internals of git can be found at http://lnw.net/Articles/130865/.


    A look at the Kernel Hackers'' Guide to git, which can be found at http://linux.yyz.us/git-howto.html,
    shows the source code management system is used by many senior kernel developers.


    Technically git is not a source control management system in the usual sense,
    and the basic units it works with are not files. It has two important data structures:
    an object database and a directory cache.


    The object database contains objects of three varieties:


    +   - Blobs: Chunks of binary data containing file contents.

    - Trees: Sets of blobs including file names and attributes, giving the directory
    structure.

    - Commits: Changesets describing tree snapshots.


    The directory cache captures the state of the directory tree.


    By letting the controls system from a file by file based system, one is better
    to handle changesets which involve many files.


    git is under rapid development and graphical interfaces to it also under speedy
    construction. For example, see http://www.kernel.org/git/. One can easily browse
    particular changes as well as source trees.'
  merge: -1
