  md: '# CHAPTER 29. INTER PROCESS COMMUNICATION


    ```

    uid_t cuid; /* creator user id */

    gid_t cgid; /* creator group id */

    mode_t mode; /* access modes */

    unsigned short seq; /* slot usage sequence number */

    };

    ```


    The owner and creator of the structure may be defined; hence both the group and
    user identification fields appear.


    Access modes control whether not reading and/or writing (altering) are allowed.


    seq is a counter that gets incremented, every time an IPC object is released,
    by the maximum number of IPC objects permitted; it can safely be ignored.


    When an IPC structure is created, all fields other than seq are initialized.


    Secondly, the uid, gid, cuid, cgid, and mode fields can be modified by the appropriate
    function call for each IPC mechanism: shmctl(), semctl(), or msgctl(). Of course,
    the caller must be either the creator of the IPC object or superuser.


    # ipcs


    This command reports on the status of all System V IPC objects. Typing ipcs -h
    gives the following usage message:


    ```

    ipcs provides information on ipc facilities for which you have

    read access.

    Resource Specification:

    -m : shared_mem

    -q : messages

    -s : semaphores

    -a : all (default)

    Output Format:

    -t : time

    -p : pid

    -c : creator

    -l : limits

    -u : summary

    -i [-s -q -m] : details on resource identified by id

    usage : ipcs [-s -m -q] -asmq -tclup

    ipcs [-s -m -q] -i id

    ipcs -h for help.

    ```


    Note that the key is listed:


    ```

    $ ipcs -m

    ```


    |------ Shared Memory Segments ------|

    | key shmid owner perms bytes nattach status |

    | 0x7b056858 1 coop 600 1024 3 dest |


    Note that system limits are generated by: ipcs -l.


    You can get similar information directly from the kernel by examining the files
    under /proc/sysvipc.'
