  md: '# CHAPTER 9. FILES AND FILESYSTEMS IN LINUX


    Some filesystem types, especially non-Unix based, may require more manipulation
    in order to be represented in the VFS.


    For instance variants such as vfat do not have direct read/write/execute permissions
    for the owner/group fields; the VFS has to make an assumption about how to distinct
    permissions for the three types of user, and such behaviour can be influenced
    by mounting operations.


    Even more drastically, such filesystems store information about files in a File
    Allocation Table (FAT) at the beginning of the disk, rather than in the directories
    themselves, a basically different architecture.


    # 9.3 The ext2/ext3 Filesystem


    The native filesystems for Linux are ext2 and its journaling descendants, ext3
    and ext4.


    Note that the ext3 filesystem has the same on-disk layout as the ext2 filesystem,
    the only important difference between the presence of a log file. Thus ext3 filesystems
    can be mounted as ext2 when convenient, such as when running a kernel which does
    not have ext3 support.


    The ext3 filesystem has the following limits:


    Table 9.3: ext3 filesystem limits


    | Parameter | Value |

    |---|---|n| Maximum Filesystem Size | 2TB |

    | Maximum File Size | 2TB |

    | Maximum Filename Length | 255 characters |


    # Basic Filesystem Concepts


    **Inodes:** Each file is represented by a structure called an inode, containing
    file type, access rights, owners, timestamps, size, and pointers to data blocks.
    Addresses of data blocks are stored in the inode. Each is indexed by a number
    which is unique per filesystem.


    **Blocks:** A file''s contents are kept in a linked list of blocks, whose size
    can be set when the filesystem is formatted. The block size can not be bigger
    than a page of memory, 4 KB on most architectures. For large filesystems, 4 KB
    is used by default, and for small filesystems, 1 KB. This is different from the
    hardware sector size, which is usually 512 bytes.


    **Directories:** These are maintained in a hierarchical tree with files and subdirectories.
    A directory is actually containing a list of inodes and names.


    **Links:** Several names can be associated with an inode. (The inode contains
    a counter of the links to a inode.) This is called a hard link, and cannot be
    used for directories. **Symbolic** or soft links are files which contain a filename,
    and can be used across filesystems, and for directories. Extremely


    **Device specials:** special file, uses no space, is only an access point to a
    device driver, generated /dev. Block and character special files. Special files
    have both a major number (device type)'
  merge: -1
