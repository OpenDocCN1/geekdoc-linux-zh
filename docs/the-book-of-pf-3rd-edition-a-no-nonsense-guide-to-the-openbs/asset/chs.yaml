  \ man-pages（帮助页）和其他文档，可能会有所帮助。\n\n6. 关于在早期版本中使用 `PF` 的说明，请参阅你所对应版本的文档，并查看本书 `Appendix\
  \ A` 中列出的支持文献。\n\n7. 事实上，新的默认设置对应于 `keep state flags S/SA`，确保只有连接建立期间的初始 SYN 包会创建状态，从而消除了一些令人困惑的错误场景。要进行无状态过滤，你可以在不希望记录或保留状态信息的规则中指定\
  \ `no state`。在 FreeBSD 上，等同于 OpenBSD 4.1 的 `PF` 代码已合并到 7.0 版本。如果你使用的 `PF` 版本旧到还没有这个默认设置，这是一个非常强烈的信号，表明你应该考虑尽早升级你的操作系统。\n\
