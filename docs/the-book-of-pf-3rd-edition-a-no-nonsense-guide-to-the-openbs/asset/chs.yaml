- "# PF 之书（第3版）：OpenBSD 防火墙实战指南\n\n\n\n![](img/orm_front_cover.jpg)\n\n![PF 之书：OpenBSD\
  \ 防火墙实不虚用的指南](img/orm_front_cover.jpg)\n\n\n\n\n\n## 对《PF 之书》的赞誉\n\n> “这是一本关于 PF\
  \ 防火墙部署和配置的权威纸质指南，写作风格清晰、严谨。其涵盖范围非常出色。”\n\n> —CHAD PERRIN, TECH REPUBLIC\n\n> “这本书是写给每一个使用\
  \ PF 的人的。无论你使用的操作系统和技能水平如何，这本书都会教你一些新颖且有趣的知识。”\n\n> —BSD MAGAZINE\n\n> “由于 Hansteen\
  \ 先生密切关注状态检测、垃圾邮件过滤、黑名单/灰名单列表等许多重要主题，这本 BSD 用户必读的参考书将极大地帮助你精调 BSD 机器上访问控制的‘谁/何事/何地/何时/如何’。”\n\
  \n> —INFOWORLD\n\n> “对于任何处理防火墙配置的人来说都是必备资源。如果你听过关于 PF 的好评并一直想尝试一下，这本书绝对是为你准备的。从头开始学，不知不觉中你就会读完整本书，并成为一名\
  \ PF 大师。即使你已经是一个 PF 大师，这仍然是一本值得放在书架上的好书，以便在棘手的情况下查阅或借给同事。”\n\n> —DRU LAVIGNE, *BSD\
  \ HACKS* 和 *THE DEFINITIVE GUIDE TO PC-BSD* 的作者\n\n> “这本书是一个极好的资源，让我迫不及待想要重写我那些过时的规则集。”\n\
  \n> —;LOGIN:\n\n> “这本书读起来非常容易。我太喜欢了！这本书轻松地进入了我的‘个人五五五书单’。”\n\n> —DAEMON NEWS\n\n\
  ## 第一版前言\n\nOpenBSD 的 PF 数据包过滤器自 2001 年底在 OpenBSD 3.0 中首次发布以来，取得了巨大的成功并引起了广泛关注。虽然你将在书中了解到更多关于\
  \ PF 的历史，但简而言之，PF 的出现是因为 OpenBSD 的开发者和用户需要它。自最初发布以来，PF 已经发生了巨大的演变，并成为可用防火墙、负载均衡和流量管理中最强大的免费工具。当\
  \ PF 与 `CARP` 和 `pfsync` 结合时，PF 让系统管理员不仅能够保护服务免受攻击，还能通过冗余使服务更可靠，并通过通过 PF 和 `relayed`\
  \ 管理的服务器池进行扩展，使服务运行得更快。\n\n虽然我参与了 PF 的开发，但我首要的是 PF 的高级用户。我使用 PF 用于安全，管理内部和外部威胁，并帮助我以冗余和可扩展的方式运行大型关键基础设施。这为我的雇主（阿尔伯塔大学，我白天担任首席系统管理员）节省了资金，无论是在停机时间还是硬件软件方面。你也可以使用\
  \ PF 做同样的事情。\n\n这些功能也带来了不可避免的复杂性。对于精通 TCP/IP 和 OpenBSD 的人来说，PF 的系统文档非常详尽且完全独立可用。但尽管系统文档中有大量的示例，你永远无法将\
  \ PF 及其相关工具集能做到的所有事情都放在核心位置，而不让系统文档变得如此巨大以至于对于那些需要将其作为参考的经验丰富人士失去实用性。\n\n这本书弥补了这一空白。如果你是一个相对的新手，它可以让你快速上手\
  \ OpenBSD 和 PF。如果你是一个经验更丰富的的用户，这本书可以向你展示一些更复杂的应用示例，帮助人们解决超出典型范围的问题。多年来，Peter N.M.\
  \ Hansteen 一直是学习如何应用 PF 的人的优秀资源，不仅仅是“我如何制作防火墙？”这种意义上的应用，这本书延续了他与他人分享这些知识的传统。防火墙现在已变得无处不在，大多数人都有一个或几个。但这本书不仅仅是关于构建防火墙，它关乎学习操纵网络流量的技术，并让你足够理解这些技术，从而让你作为系统和网络管理员的生活变得轻松得多。简单的防火墙很容易构建或现成购买，但一个你可以自己长期并管理的防火墙则要复杂得多。这本书在平滑学习曲线方面发挥了作用，让你不仅思考如何构建防火墙，还思考\
  \ PF 是如何工作的以及它的优势可以在何处帮助你。这本书是一项节省你时间的投资。它将让你以正确的方式运行起来——更快、更少的错误尝试和更少的实验时间。\n\n\
  **Bob Beck**\n\n**OpenBSD 基金会主任**\n\n*[http://www.openbsdfoundation.org/]*\n\n**加拿大，阿尔伯塔省，埃德蒙顿**\n\
  \n## 致谢\n\n这份手稿最初是一个用户组的讲座，首次在 2005 年 1 月 27 日的卑根 [BSD 和] Linux 用户组 (BLUG) 上上进行。在我将手稿翻译成英文并稍作扩展后，Greg\
  \ Lehey 建议我应该进一步充实它，并作为 AUUG 2005 大会议的半天教程进行演示。在了一系列教程修订后，我终于在 2007 年初开始编写后来成为书籍的版本。\n\
  \n接下来的两段节自教程手稿，仍然适用于本书：\n\n> 这份手稿是一份已公布（从挪威语翻译过来）的手稿的稍作开发版本：\n\n> “这次讲座是关于防火墙及相关功能的，并带有\
  \ OpenBSD 项目 PF（数据包过滤器）的真实案例。PF 为防火墙、NAT、流量控制和带宽管理提供了一个单一、灵活且对管理员友好的系统。Peter 希望讲座能给你提供关于如何按照你想要控制网络流量的想法——将某些东西排除在网络之外，将流量引导至特定的主机或服务，当然还有让垃圾邮件者难以受。”\n\
  \n教程中的部分内容（当然还有所有真正有用的主题）以某种形式进入本书。对手稿早期版本提供重大有用建议的人包括 Eystein Roll Aarseth, David\
  \ Snyder, Peter Postma, Henrik Kramshøj, Vegard Engen, Greg Lehey, Ian Darwin, Daniel\
  \ Hartmeier, Mark Uemura, Hallvor Engen，可能还有一些留在我邮件存档中等待 `grep` 的人。\n\n感谢以下组织的支持：NUUG\
  \ 基金会的差旅补助，部分资助了我参加 AUUG 2005；AUUG、UKUUG、SANE、BSDCan、AsiaBSDCon、NUUG、BLUG 和 BSD-DK\
  \ 组织邀请我在他们的活动中演讲；以及 FreeBSD 基金会赞助我参加 BSDCan 2006 和 EuroBSDCon 2006。\n\n与第一版一样，第二版主要是在晚上、周末以及其他时间偷来的时间编写的。我要感谢我在\
  \ FreeCode 的前同事们，他们在 2010 年初的其他项目期间允许我抽出一些时间编写第二版，从而减轻了我的负担。还要感谢几位要求不具姓名的客户，他们有趣且具有挑战性的项目启发了这里提供的的一些配置。你们知道自己是谁。\n\
  \n第三版的出现是因为 OpenBSD 5.5 引入了取代 ALTQ 的新流量整形系统。幸运的是，Bill Pollock 和 No Starch Press\
  \ 的团队认为，这项新功能结合自第二版以来的几项改进，是我们在 2013 年下半年开始编写第三版的充分理由。\n\n\n\n\n最后，在手稿转变为书籍的过程中，几位人士付出了巨大的努力，帮助这本书变得完善了很多。感谢\
  \ Bill Pollock 和 Adam Wright 提供出色的开发编辑；感谢 Henning Brauer 提供出色的技术审查；衷心感谢 Eystein\
  \ Roll Aarseth、Jakob Breivik Grimstveit、Hallvor Engen、Christer Solskogen、Ian Darwin、Jeff\
  \ Martin 以及 Lars Noodén 对手稿各部分提供的宝贵建议；最后，热烈感谢 Megan Dunchak 和 Linda Recktenwald\
  \ 两人在使本书第一版最终定型方面付出的努力，感谢 Serena Yang 引导了第二版和第三版的完成。特别感谢 Dru Lavigne，由于他撰写了引言，才让这本书得以成书，而不是仅仅作为一个在线教程和偶尔使用的会议材料而存在。\n\
  \n最后但同样重要的是，我想感谢我亲爱的妻子 Birthe 和女儿 Nora，感谢她们在书籍写作之前、期间，以及在产出第二版的高强度工作期间给予给予我所有的爱与支持。没有你们，这一切是不可能的。\n\
  \n## 引言\n\n![Introduction](img/httpatomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n这是一本关于构建你所需网络的书。我们将从一些基础理论开始，探讨防火墙及相关功能。你将看到许多过滤以及其他引导网络流量的示例。我假设你对 TCP/IP 网络概念和\
  \ Unix 系统管理具备基础到以上的水平。\n\n书中的所有信息都带有一个警告：正如许多尝试一样，我们讨论的解决方案可能有多种实现方式。而且，软件世界总是在变化的，最好的方法可能自本书印刷以来已经发生了变化。本书在\
  \ OpenBSD 5.6 版本、FreeBSD 10.0 和 NetBSD 6.1 上经过测试，并包含了 2014 年 7 月底的所有可用补丁。\n\n##\
  \ 这不是一个教程 (HOWTO)\n\n本书是我流行的 PF 教程的直接后代，也是该手稿书籍版的第三版。考虑到多年来为了让这本书变得实用所付出的努力，我有信心你会发现它是很有用的，我也希望你会觉得读起来很愉快。但请记住，本文文档并非旨在提供可以直接复制粘贴的“现成配方”。\n\
  \n为了强调这一点，请跟着我重复一遍：\n\n```c\n//网络管理员的誓言//\n\n这是我的网络。\n\n它属于我，\n或者从技术上，属于我的雇主。\n\
  这是我的责任，\n我会全心地照顾它。\n\n还有许多与我的网络类似的网络，\n\n但没有一个和它完全一样。\n\n我庄重宣誓\n\n我不会盲目地从 HOWTO\
  \ 中粘贴内容。\n```\n\n重点在于，虽然我测试了书中的所有配置，但对于你目前的网络来说，它们几乎至少有一点错误。请记住，本书旨在向你展示一些实用的技巧，并启发你成就目标。\n\
  \n努力理解你的网络以及为了让它变得更好需要什么，请不要盲目地从本文或其他任何文档中粘贴。\n\n## 本书内容\n\n本书旨在作为一个独立的文档，让你只需少量查阅手册（man\
  \ pages）并偶尔参考附录 A 列出的在线和打印资源即可在你的机器上工作。\n\n你的系统可能带有一个预先写的 `pf.conf` 文件，其中包含了一些注释掉的配置建议，以及文档目录（如\
  \ `/usr/share/pf/`）中的一些示例。这些示例可以作为参考，但我们不会在书中直接使用它们。相反，你将学习如何从零开始构建一个 `pf.conf`。\n\
  \n以下是书中内容的简述：\n\n*   第 1 章：介绍了基础网络概念，简要概述了 PF 的历史，并如果你是这个操作系统家族的新手，将提供关于如何适应 BSD\
  \ 风格的建议。请先读这一章，以了解如何操作 BSD 系统。\n\n*   第 2 章：展示如何在你的系统上启用 PF，并涵盖了单机的非常基本的规则集。这一章至关重要，因为后续所有的配置都基于我们在这里构建的内容。\n\
  \n*   第 3 章：基于第 2 章 中的单机配置，引导你学习设置网关的基础知识，作为不同网络之间的接触点。完成第 3 章 后，你将构建出一个相当典型的家庭或小型办公室网络配置，并掌握一些让网络管理更简单的技巧。你还将尽早体验如何处理具有特殊要求的服务（如\
  \ FTP），并获得通过满足一些经常不被理解的 Internet 协议和服务来让你的网络易于排故障的技巧。\n\n*   第 4 章：引导你向你的设置中添加无线网络。无线环境带来了一些安全挑战，在本章结束时，你可能会发现自己拥有了一个通过\
  \ `authpf` 进行访问控制和认证的无线网络。\n\n*   第 5 章：处理需要从外部访问的服务器和服务的状况。在本章结束时，你可能拥有一个带有或多个独立子网和\
  \ DMZ（非军事化区）的网络，并尝试了通过重定向和 `relayd` 实现负载均衡方案，以提高用户服务质量。\n\n*   第 6 章：介绍了 PF 工具箱中用于处理不良活动的一些工具，并展示了如何高效使用它们。我们处理了暴力破解密码尝试和其他网络泛滥，以及\
  \ OpenBSD 垃圾邮件推迟守护 `spamd`。这一章将让你的网络对合法用户更友好，对意图不良的不那么欢迎。\n\n*   第 7 章：介绍了通过 OpenBSD\
  \ 5.5 引入的优先级和队列系统进行流量整形。本章包含了如何将早期 ALTQ 设置转换为新系统的提示，以及在没有较新队列系统的操作系统上设置和维护 ALTQ\
  \ 的信息。这一章将通过根据网络需求调整流量整形来实现更好的资源利用。\n\n*   第 8 章：展示如何创建冗余配置，包括用于故障转移和负载均衡的 CARP\
  \ 配置。这一章将让你了解如何创建和维护基于 CARP 的高可用、冗余配置。\n\n*   第 9 章：解释 PF 日志。你将学习如何使用基础系统工具以及可选包从你的\
  \ PF 配置中提取和处理日志和统计数据。我们还将讨论基于 NetFlow 和 SNMP 的工具。\n\n\n\n\n\n*   第 10 章介绍了许多可以帮助你调整设置的各种选项。它将你之前章节中获得的知识与一套规则集调试教程结合在一起。\n\
  *   附录 A 是一份关于印刷版和在线文献以及其他资源的带注释列表，当你扩展对 PF 和网络主题的了解时，你可能会发现它们很有用。\n*   附录 B 概述了在作为免费软件创建顶级工具时涉及的一些问题。\n\
  \n本书中的每一章都建立在前一章的基础上。虽然作为一个自由的人，你完全可以随意跳读，但按顺序阅读这些章节可能会有所帮助。\n\n出于许多原因，OpenBSD 是我最喜欢的操作系统。我编写这本书的主要环境由运行\
  \ OpenBSD 系统主导，这些系统运行最近的快照（snapshots）、偶尔使用的 -stable 系统，以及偶尔的本地构建的 -current 系统。这意味着书中的主要视角是从\
  \ OpenBSD 5.6 命令行看到的世界。然而，我保留了足够的其他 BSD 系统，以至于即使你的平台选择是 FreeBSD、NetBSD 或 DragonFly\
  \ BSD，这本书也将是有用的。在网络配置和 PF 设置的某些领域，这些系统与 OpenBSD 基准有明显不同，在这些情况下，你将找到关于差异的注释，以及关于如何为你的环境构建有效配置的特定平台建议。\n\
  \n## 第 1 章. 构建你需要的网络\n\n![构建你需要的网络](img/httpatomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n在我看来，PF（即 OpenBSD 的 `Packet Filter subsystem`，包过滤子系统）是现用于控制你网络的最优秀工具。在深入研究如何让你的网络成为梦梦以求的精细机制的细节之前，请阅读本章。它介绍了基础网络术语和概念，提供了一些\
  \ PF 的历史，并让你对可以在此书中发现的内容有一个大致的了解。\n\n## 你的网络：高性能、低维护和安全\n\n如果这个标题准确地描述了你的网络，那么你很可能是为了纯粹的娱乐而阅读这本书，我希望你会喜欢剩下的部分。相反，如果你仍在学习如何构建网络，或者对自己的技能还没有足够的把握，那么对基础网络安全概念进行简要回顾将是有用的。\n\
  \n技术（IT）安全是一个庞大、复杂且有时令人困惑的主题。即使我们将范围限制在仅从网络安全的角度考虑，似乎我们并没有缩小缩小领域，也没有消除足够固有的令人困惑的术语。几年前，当个人电脑开始加入网络世界时，情况变得显著恶化，它们配备了系统软件和应用程序，这些程序显然不是为网络环境设计的。\n\
  \n结果是可以预料的。即使在小型计算机联网之前，它们已经成为了恶意软件的家园，例如 `viruses`（病毒，能够“感染”其他文件以传递其载荷并创建自身副本的半自主软件）和\
  \ `trojans`（特洛伊木马，最初指嵌入了代码的软件或文档，一旦激活，它们将导致受害计算机执行用户无意执行的操作）。当小型计算机联网后，它们又接触到了另一种恶意软件，称为\
  \ `worm`（蠕虫），这是一类利用网络传播其载荷的软件。^([¹]) 在此过程中，各种欺诈的联网版本也出现在网络安全视野中，今天，计算机安全活动的一个重要部分（可能是行业中最大的部分）集中在威胁管理上，重点是对抗和分类恶意软件，或\
  \ `malware`（恶意软件）。\n\n列举坏事的徒劳性在其他地方已得到很有说服力的论证（请参见 附录 A，例如 Marcus Ranum 优秀的论文《计算机安全中六个最愚蠢的想法》）。OpenBSD\
  \ 的方法是在第一范围内正确设计。然而，聪明的人偶尔也会出错，产生漏洞，因此确保设计可以使此类故障的影响降至最低。([2]) 在 PF 中，并扩展到本书中，重点集中在网络层面。OpenBSD\
  \ 4.7 引入 `divert(4)` 套接字使得设置某些深度包检测（deep packet inspection）变得越来越容易，尽管该接口尚未被广泛使用。因此，我们将专注于基于纯网络层面的技术，这些技术在第\
  \ 6 章的配置中尤为明显。正如你所看到的，除了阻塞数据。\n\n## 包过滤器的位置\n\n包过滤器的主要功能正如其名所示，通过匹配单个数据包的属性以及基于这些数据包建立的连接定义的规则来过滤网络包。包过滤器负责决定对这些数据包做什么。这可能意味着允许它们通过或拒绝它们，也可以意味着触发操作系统其他部分或外部应用程序设置的事件。\n\
  \nPF 允许你编写自定义过滤规则，根据几乎任何数据包或连接属性控制网络流量，包括地址族、源和目的地址、接口、协议和方向。根据这些规则，包过滤器执行你指定的。简单且常用的操作之一是阻塞流量。\n\
  \n包过滤器可以防止意外流量进入你的网络。它还可以帮助包含网络内部的流量。这两个功能对于防火墙概念都很重要，但阻塞不是功能性包过滤器的唯一功能。正如你在书中看到的，可以使用过滤规则将某些类型的网络流量重定向到特定主机，将流量分类分配到队列，执行流量整形并将某些流量交给其他软件进行特殊处理。\n\
  \n所有这些处理都在网络层面进行，基于数据包和连接属性。PF 是网络栈的一部分，深植在操作系统内核中。虽然有在用户空间实现包过滤的例子，但在大多数系统中，过滤功能是在内核中执行的，因为这样做更快。\n\
  \n## PF 的兴起\n\n如果你对历史感兴趣，你可能已经知道 OpenBSD 和其他 BSD 系统^([3]) 是 BSD 系统（有时被称为 *BSD Unix*）的直接后代，该操作系统在\
  \ 20 世纪 80 年代包含了 TCP/IP  协议的原始参考实现。\n\n\n\n\n随着 BSD 开发背后的研究项目在 20 世纪 90 年代初开始结束，代码被释放给全球各地的小爱好者小组进行进一步开发。这些爱好者中，有些人负责维护当时新兴互联网基础设施中关键部分的可靠运行，BSD\
  \ 的开发因此在多个小组中并行进行。OpenBSD 小组因作为 BSD 中最注重安全的而闻名。为了满足数据包过滤需求，它使用了一个名为 `IPFilter` 的子系统，该系统主要由\
  \ Darren Reed 编写。在这些早期几年，OpenBSD 迅速赢得了“防火墙操作系统”的美誉，且现在许多人仍然认为 OpenBSD 是专门为了这一目的而开发的。\n\
  \n当 Reed 在 2001 年初宣布 `IPFilter` 不受 BSD 协议保护时，OpenBSD 社区感到震惊。因为当时 `IPFilter` 与 OpenBSD\
  \ 是紧密集成的。相反，它使用了几乎逐字一致的协议副本，仅省略了修改代码和分发结果的权利。问题在于，OpenBSD 版本的 `IPFilter` 包含了若干更改和自定义，事实证明这些内容在协议下是不被允许的。结果，`IPFilter`\
  \ 于 2001 年 5 月 29 日从 OpenBSD 源码树中删除，在之后的几周里，OpenBSD 的开发版本（`-current`）不再包含任何数据包过滤软件。\n\
  \n幸运的是，此时在瑞士的 Daniel Hartmeier 正在对网络代码进行一些内核破解的有限实验。他首先将自己编写的一个小函数挂载到网络栈中，然后让数据包通过它。接着，他开始考虑过滤。当协议危机发生时，`PF`\
  \ 已经在小规模进行开发。`PF` 代码的首次提交是 2001 年 6 月 24 日星期日 UTC 时间 19:48:58。随后，许多开发者进行了数月的高强度活动，最终生成的\
  \ `PF` 版本于 2001 年 12 月作为 OpenBSD 3.0 基础系统的默认部分发布。该版本包含了一个数据包过滤的实现，包括网络地址转换，其配置语言与\
  \ `IPFilter` 足够相似，因此迁移到新的 OpenBSD 版本并不会产生重大问题。\n\n`PF` 被证明是一项良好的软件。2002 年，Hartmeier\
  \ 发表了一篇 USENIX 论文，其性能测试显示，OpenBSD 3.1 `PF` 在压力测试下的表现与 OpenBSD 3.1 上的 `IPFilter`\
  \ 或 Linux 上的 `iptables` 平手甚至更好。此外，在 OpenBSD 3.0 的原始 `PF` 上运行的测试主要表明，代码从 3.0 版本到\
  \ 3.1 版本在效率上得到了提升。\n\nOpenBSD 的 `PF` 代码由经验丰富且注重安全的开发者编写了全新的数据包过滤引擎，这自然也引起了其他 BSD\
  \ 系统的兴趣。FreeBSD 项目逐渐采纳了 `PF`，最初作为一个软件包，然后从 5.3 版本开始，作为三个数据包过滤系统之一包含在基础系统中。`PF` 也被包含了\
  \ `NetBSD` 和 `DragonFly BSD` 中。\n\n本书侧重于 OpenBSD 5.5 中提供的 `PF` 版本。我将在适当的情况下指出该版本与其他系统中集成的版本之间的显著差异。\n\
  \n如果你已准备好研究 `PF` 配置，可以跳转到第 2 章开始。如果你想花多一点时间在陌生的 BSD 领域找清方向，请继续阅读本章。\n\n##较新版本的 PF\
  \ 性能更好\n\n与计算世界的其他部分一样，OpenBSD 和 `PF` 也受到硬件和网络条件快速变化的影响。我没有看到进行过与 Daniel Hartmeier\
  \ 的 USENIX 论文中的测试相当的测试，但 `PF` 用户发现过滤开销很小。\n\n举例来说（主要为了说明即使是不起眼的硬件配置也是有用的），我负责的一个小型办公室网络与世界连接的网关机器是一台\
  \ 450MHz 的 Pentium III，配备 384MB 内存。每当我记得检查时，根据 `top(1)` 命令的输出，我从未见过该机器的空闲率低于 96%。\n\
  \n值得注意的是，当前的 `PF` 开发者（主要是 Henning Brauer 和 Ryan McBride，以及其他几个人的贡献）在最近的发布中重写了 OpenBSD\
  \ `PF` 代码的大部分，并将提高性能作为主要目标目标，这使得从 4.4 到 5.6 的每个发布版本都明显优于其之前的版本。\n\n## 如果你是从其他系统过来的\n\
  \n如果你阅读本书是因为考虑从其他系统将你的设置迁移到 `PF`，那么这一节是为你准备的。\n\n如果你使用 `PF`，你需要安装并运行一个 BSD 系统，例如\
  \ OpenBSD、FreeBSD、`NetBSD` 或 `DragonFly BSD`。这些都是很好的操作系统，但我个人最喜欢 OpenBSD，主要是因为基本上所有的\
  \ `PF` 开发都是在这个操作系统上进行的。我也发现开发者和系统这种不搞虚头的方法令人耳目一新。\n\n偶尔，其他系统上的 `PF` 实现会将细微的更改和错误修复回传\
  \ `PF` 主代码库，但最新、最及时的 `PF` 代码始终可以在 OpenBSD 上找到。本书书中描述的某些功能仅在 OpenBSD 的最新版本中可用。其他\
  \ BSD 倾向于及时将从 OpenBSD 发布的最新 `PF` 版本移植到自己的代码库中，以赶上下一次发布，但同步更新远不能保证，滞后有时是相当的。\n\n\
  如果你计划在 FreeBSD、`NetBSD`、`DragonFly BSD` 或其他系统运行 `PF`，你应该检查系统的发行说明或其他文档，以获取包含哪个版本的\
  \ `PF`。\n\n### 给 Linux 用户的提示\n\nLinux 和 BSD 之间的差异和相似性如果深入探讨将是一个巨大的话题，但如果你掌握了基础知识，并不太长时间就能适应\
  \ BSD 的操作方式。在本书的其余部分，我将假设你熟悉 BSD 网络配置的基础。因此，如果你熟悉配置 Linux 或其他系统胜过 BSD，有必要注意 BSD\
  \ 配置的几点：\n\n- Linux 和 BSD 使用不同的网络接口命名规范。Linux 的惯例是为给定的机器上的所有网络接口标记为 `eth0`、`eth1`\
  \ 等（尽管在某些 Linux 版本和驱动组合中，你会看到无线接口为 `wlan0`、`wlan1` 等）。在 BSD 上，接口的名称等于驱动程序名称加上序列号。例如，使用\
  \ `ep` 驱动的旧 3Com 网卡显示为 `ep0`、`ep1` 等；英特尔千兆网卡可能变为 `em0`、`em1` 等。某些 SMC 网卡显示为 `sn0`、`sn1`\
  \ 等。这种系统非常有逻辑，并便于查找该接口的特定文档。如果你的内核（在启动时或在 `ifconfig` 输出中）报告你有一个名为 `em0` 的接口，你只需要在\
  \ shell 命令行提示符输入 `man em` 即可找到它支持的速度——是否有任何需要注意的异常、是否需要下载固件等等。\n\n\n\n\n*   你应当意识到，在\
  \ BSD 中，配置是以 `/etc/rc.conf` 为中心的。通常情况下，BSD 的设计是从 `/etc/rc.conf` 文件中读取配置，而该文件在启动时由\
  \ `/etc/rc` 脚本读取。OpenBSD 建议使用 `/etc/rc.conf.local` 进行本地化定制，因为 `rc.conf` 包含了默认值。FreeBSD\
  \ 使用 `/etc/defaults/rc.conf` 来存储默认设置，使得 `/etc/rc.conf` 成为进行更改的正确位置。此外，OpenBSD 使用了名为\
  \ `hostname.<if>` 的每个接口配置文件，其中 `<if>` 被替换为接口名称。\n*   为了学习 PF 的目的，你需要集中关注 `/etc/pf.conf`\
  \ 文件，该文件很大程度上将是你自己的创建。\n\n如果你需要对你所选择的 BSD 有更广泛、更深入的介绍，请在项目网站上查找操作系统文档，包括常见问题解答（FAQs）和指南。你也可以在附录\
  \ A 中找到一些进一步阅读的建议。\n\n## 关于 PF 的常见问题解答\n\n本节基于我通过电子邮件、会议和会议收到的问题，以及在邮件列表和其他讨论论坛中出现的一些问题。一些较常见的问题将以常见问题解答^([⁴])\
  \ 的格式在此列出。\n\n### 我可以在我的 Linux 机器上运行 PF 吗？\n\n简而言之，不能。多年来，PF 邮件列表曾出现过一些公告，称有人声称已经启动了\
  \ PF 的 Linux 移植，但在本文写作时，还没有人声称已完成该任务。主要原因可能是因为 PF 主要是作为 OpenBSD 网络堆栈中深度集成的部分而开发的。即使在经过了十多年的并行开发后，OpenBSD\
  \ 的代码仍然与其他 BSD 共享足够的底层知识，以使得移植成为可能，但将 PF 移植到非 BSD 系统将需要重写 PF 本身大部分代码，以及目标端所需的任何集成。\n\
  \n关于让 Linux 用户在 BSD 网络配置中找到方向的一些基础引导提示，请参阅 Linux 用户指南。\n\n### 你能推荐一个管理我的 PF 规则集的\
  \ GUI 工具吗？\n\n这本书主要面向那些在自己喜欢的文本编辑器中编辑规则集的用户。书中的示例规则集足够简单，你可能无法从各种 GUI 工具所提供的任何可视化选项中获得显著益处。\n\
  \n一种常见的说法是，PF 配置文件通常具有足够的可读性，因此图形化可视化工具并不是真正必要的。然而，目前有几种 GUI 工具可以编辑和/或生成 PF 配置，包括一个名为\
  \ `pfSense` 的完整、定制的 FreeBSD 构建版本（`[`www.pfsense.org/`](http://www.pfsense.org/)`），它包含了一个复杂的\
  \ GUI 规则编辑器。\n\n我建议你通读此书中适用于你情况的部分，然后决定你是否需要使用 GUI 工具来让你在运行和维护你构建的系统时感到从容。\n\n###\
  \ 是否有一个工具可以让我将我的 OtherProduct® 设置转换为 PF 配置？\n\n在将网络设置（包括防火墙设置）从一个产品转换为另一个产品时，最佳策略是回溯到你网络或防火墙配置的规范或策略，然后使用新工具实现这些策略。\n\
  \n其他产品不可避免会有略有不同的功能集，而你为 OtherProduct® 创建的现有配置可能反映了处理特定问题的略有不同的方法，这些方法很难或无法映射到 PF\
  \ 及相关工具的功能中。\n\n拥有的文档化的策略，并在需求变化时及时更新它，会让你的生活变得更轻松。这份文档应该包含一份关于你的设置旨在实现什么的完整散散文说明。（你可以从在配置文件中添加注释来解释规则的作用开始。）这使得验证你正在运行的配置是否实际实现了设计目标成为可能。在某些企业环境中，甚至可能对书面策略有正式要求。\n\
  \n寻找自动化转换方法的冲动是完全可以理解的，对于系统管理员来说甚至是意料之。我敦促你克制这种冲动，在重新评估你的业务和技术需求之后，并且（最好）在在此过程中创建或更新正式的规范或策略之后进行转换。\n\
  \n一些作为管理前端的 GUI 工具声称能够输出多个防火墙产品的配置文件，理论上可以被当作转换工具。然而，这样做的效果是在你和规则集之间又插入了另一层抽象，并使你受限于工具作者对\
  \ PF 规则集工作原理的理解。我建议在投入大量时间考虑自动化转换之前，至少通读书中相关的部分。\n\n### 我听过 PF 是基于 IPFilter 的，我在处理\
  \ Solaris 时用过它。我可以直接把我的 IPFilter 配置拷贝过去并立即获得运行设置吗？\n\n如果人们声称 PF 是“基于”IPFilter 的，那么他们说的话不是事实。PF\
  \ 是从零开始编写，旨在替换被新删除的 IPFilter 代码。对于 PF 的第一个版本，其设计目标之一是保持语法与旧软件相当兼容，以便在过渡到 OpenBSD\
  \ 3.0 的过程中尽可能不痛苦，并且不会太严重地或以不可预测的方式破坏现有的设置。\n\n然而，在后续的一两个版本之后，人们认为可能不再有 OpenBSD 用户会从一个包含\
  \ IPFilter 的版本升级了，因此与旧系统保持兼容已不再优先考虑的范围内。即使在经过 25 个 OpenBSD 版本和 12 多年的活跃开发后，仍然存在一些语法上的相似之处。尝试将一个系统的配置加载到另一个系统——例如，将\
  \ IPFilter 配置拷贝到 OpenBSD 系统并尝试在那里加载，或者将现代 PF 配置拷贝到 Solaris 系统并尝试作为 IPFilter 配置加载——在几乎所有情况下都会失败。\n\
  \n### 为什么 PF 语法突然发生了？\n\n世界变了，PF 也随之变了。更具体地说，OpenBSD 开发人员对代码保持着非常活跃且务实批判性的关系，像 OpenBSD\
  \ 的所有部分一样，PF 代码一直在接受持续审查。\n\n在十多年 PF 开发和使用中获得的教训导致了代码内部的变化，最终让开发人员明确稍微更改语法是有意义的。这些更改将使\
  \ PF 语法更加一致，并从长期来看让用户的生活更轻松。对于你，用户来说，结果是 PF 现在更更容易使用，而且性能比之前的版本更好。如果你正在将系统升级到 OpenBSD\
  \ 4.7 或更高版本，你将大有收获。\n\n而在 OpenBSD 5.5 中，你将发现另一个升级的良好理由：新的流量整形队列系统，它旨在取代经典的 ALTQ\
  \ 系统。ALTQ 仍然是 OpenBSD 5.5 的一部分，尽管形式略有修改，但它 OpenBSD 5.6 发布之前已经从 OpenBSD 内核中删除了。第\
  \ 7 章包含一个专门关于迁移到新流量整形系统的章节。\n\n### 我可以在哪里找到更多信息？\n\n\n\n\n\n关于 PF 以及运行它的系统，有几个很好的信息来源。你已经在书中找到了一个。你可以在附录\
  \ A 中找到许多印刷版和在线资源的引用。\n\n如果你有一台安装了 PF 的 BSD 系统，请查阅在线手册页（即 `man pages`）以获取有关你所用软件版本的信息。除非另有说明，书中的信息指的是从\
  \ OpenBSD 5.5 系统命令行视角看到的世界。\n\n## 一些鼓励：一首 PF 俳句\n\n如果你还没有完全被说服，即使你已经说服了，可能也需要一些鼓励。多年来，有许多人对\
  \ PF 发表过并写过自己的见解——有时很奇怪，有时很奇妙，有时则纯粹是疯狂。\n\n这里引用的诗很好地说明了 PF 有时带给用户的情感波动有多深。这首诗出现在\
  \ PF 邮件列表中，源于 2004 年 5 月一个主题为“PF 做不到的事？”的邮件帖中。这封邮件是由一个没有多少防火墙经验的人写的，因此他发现很难实现所需的配置。\n\
  \n当然，这引发了一些讨论，几位参与者表示，如果 PF 对新手来说很难，那么替代方案也并不比。该帖以 Jason Dixon 在 2004 年 5 月 20 日发表的一首赞美俳句结束了。\n\
  \n```\n与使用 iptables 相比，PF 就像这首俳句：\n\n一缕清新的风，\n漂浮在白玫瑰花瓣上，\n吃着草莓。\n\n现在我有点过头了：\n\n\
  Hartmeier 正在写代码，\nHenning 不知道为什么失败，\n唯独对 n00b 失败。\n\n表格加载我的列表，\n陷阱留给那个垃圾邮件发送者，\n\
  让他的邮件存储死掉。\n\n由于 Cisco 有了 CARP，\n冗余的受祝福的数据包，\n对我来说是免费的。\n```\n\nDixon 在这里提到的某些概念可能听起来有点陌生，但如果你继续读下去，很快一切都会变得合理。\n\
  \n^([2]) 关于 OpenBSD 安全方法的若干场演示文稿可以通过 *[`www.openbsd.org/papers/`](http://www.openbsd.org/papers/)*\
  \ 集合找到。我最喜欢的包括 Theo de Raadt 的“Exploit Mitigation Techniques”（以及 2013 年的续作“Security\
  \ Mitigation Techniques: An Update After 10 Years”）、Damien Miller 的“Security Measures\
  \ in OpenSSH”，以及 Henning Brauer 和 Sven Dehmlow 的“Puffy at Work—以 OpenBSD 的方式确保代码正确且安全”。\n\
  \n^([3]) 如果 *BSD* 听起来熟悉，这里有一个简短的解释：该缩写是 *Berkeley Software Distribution*（伯克利软件发行版），最初是指加州大学伯克利分校教职和学生为\
  \ Unix 操作系统开发的实用软件集合。随着时间的推移，该集合变成了一个完整的操作系统，并而成为一系列系统的先驱，包括 OpenBSD、FreeBSD、NetBSD、DragonFly\
  \ BSD，以及根据某些定义，甚至包括 Apple 的 Mac OS X。关于 BSD 是什么非常易读的解释，请参见 Greg Lehey 在 *[`www.freebsd.org/doc/en/articles/explaining-bsd/`](http://www.freebsd.org/doc/en/articles/explaining-bsd/)*\
  \ 中的“Explaining BSD”（当然，还有这些项目的网站）。\n\n^([6]) 提供这些测试细节的文章可以在 Daniel Hartmeier 的网站获取。请访问\
  \ *[`www.benzedrine.cx/pf-paper.html`](http://www.benzedrine.cx/pf-paper.html)*。\n\
  \n^([7]) 曾经甚至存在过一个运行在 Microsoft Windows 上的个人防火墙产品，名为 *Core Force*，它是基于 PF 的移植版。到\
  \ 2010 年初，开发 Core Force 的公司 Core Security（[*http://force.coresecurity.com/](http://force.coresecurity.com)*）似乎转向转向安全领域，例如渗透测试，但该产品仍然可以下载。\n\
  \n## 第 2 章：PF 配置基础\n\n![PF 配置基础](img/pfatomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n在本章中，我们将使用 PF 创建一个简单的设置。我们将从最简单的配置开始：一台配置为与单个网络通信的机器。这个网络完全可以是互联网。\n\n你配置 PF 的两个主要工具是你喜喜欢的文本编辑器和\
  \ `pfctl` 命令行管理工具。PF 配置通常存储在 `/etc/pf.conf` 中，被称为*规则集*（rule sets），因为配置文件的每一行都是一条*规则*（rule），它帮助确定数据包过滤子系统应该如何处理它看到的网络流量。在通常的日常管理中，你可以在\
  \ `/etc/pf.conf` 文件中编辑你的配置，然后使用 `pfctl` 加载更改。也有用于 PF 管理任务的 Web 界面，但它们不是基础系统的一部分。PF\
  \ 开发者对这些选项并不敌对，但他们还没有看到明显比编辑 `pf.conf` 更好的 PF 配置图形化界面。\n\n### 第一步：启用 PF\n\n在开始之前，你需要确保\
  \ PF 已经启用。\n\n\n\n\n\n默认的 OpenBSD `pf.conf` 文件以 `set skip on lo` 规则开头，以确保回环接口组上的流量不会被任何形式的过滤。下一条激活的行是简单的\
  \ `pass` 默认设置，允许你的网络流量默认通过。最后，一条显式的 `block` 规则会阻止指向你机器的远程 X11 流量。\n\n正如你可能注意到的，默认的\
  \ `pf.conf` 文件还包含几行以哈希标记（#）开头的注释行。在这些注释中，你会发现一些建议的规则，它们提示了实用的配置，例如通过 `ftp-proxy`\
  \ 进行 FTP 旁路（参见第 3 章）以及 OpenBSD 垃圾延迟守护进程 `spamd`（参见第 6 章 ）。这些项目在各种现实场景中可能很有用，但因为它们可能并不适用于所有配置，所以默认情况下它们在文件中是被注释掉的。\n\
  \n如果你在 `/etc/rc.conf` 文件中查找 PF 相关的设置，你会发现 `pf_rules=` 设置。从原则上讲，这允许你指定配置位于默认 `/etc/pf.conf`\
  \ 之外的文件中。然而，更改此设置可能不值得费此精力。使用默认设置可以让你利用许多自动维护功能，例如每晚自动将你的配置备份到 `/var/backups` 目录。\n\
  \n在 OpenBSD 上，`/etc/rc` 脚本有一个内置机制，如果你在没有 `pf.conf` 文件或包含无效规则集的文件的情况下重启系统，该机制会帮助你。在启用任何网络接口之前，`rc`\
  \ 脚本会加载一组允许一些基本服务的规则集：从任何地方进行 SSH、基础域名解析以及 NFS 挂载。这允许你登录并修正规则集中的任何错误，加载修正后的规则集，然后继续工作。\n\
  \n### 在 FreeBSD 上设置 PF\n\n好的代码流传得远，FreeBSD 用户会告诉你，来自其他地方的优秀代码迟早会进入 FreeBSD。PF 也不例外，从\
  \ FreeBSD 5.2.1 和 `4.x` 系列开始，PF 及相关工具成为了 FreeBSD 的一部分。\n\n如果你阅读了上一节关于在 OpenBSD 上设置\
  \ PF 的内容，你会看到在 OpenBSD 上 PF 是默认启用的。在 FreeBSD 上情况并非如此，PF 是三个可能的数据包过滤选项之一。在这里，你需要采取显式步骤来启用\
  \ PF，而且与 OpenBSD 相比，似乎你需要在 `/etc/rc.conf` 中多花一点“魔法”。查看你的 `/etc/defaults/rc.conf`\
  \ 文件可以发现 FreeBSD 对 PF 相关设置的默认值如下所示：\n\n```\npf_enable=\"NO\"                 # 设置为\
  \ YES 以启用数据包过滤器 (PF)\npf_rules=\"/etc/pf.conf\"        # PF 的规则定义文件\npf_program=\"\
  /sbin/pfctl\"       # pfctl 所在位置\npf_flags=\"\"                    # pfctl 的额外标记\n\
  pflog_enable=\"NO\"              # 设置为 YES 以启用数据包过滤器日志\npflog_logfile=\"/var/log/pflog\"\
  \ # pflogd 存储日志的位置\npflog_program=\"/sbin/pflogd\"   # pflogd 所在位置\npflog_flags=\"\
  \"                 # pflogd 的额外标记\npfsync_enable=\"NO\"             # 将 pf 状态暴露给其他主机进行同步\n\
  pfsync_syncdev=\"\"              # pfsync 工作所需的接口\npfsync_ifconfig=\"\"        \
  \     # 为 pfsync 的 ifconfig(8) 的额外选项\n```\n\n幸运的是，你可以安全地忽略大部分内容——至少目前是这样。以下是你需要添加到\
  \ `/etc/rc.conf` 配置中的唯一几项选项：\n\n```\npf_enable=\"YES\"       # 启用 PF（如果需要则加载模块）\n\
  pflog_enable=\"YES\"    # 启动 pflogd(8)\n```\n\nFreeBSD 版本之间在 PF 上存在某些差异。请参考 [`www.freebsd.org/`](http://www.freebsd.org/)\
  \ 提供的 *FreeBSD Handbook（*FreeBSD 手册*）*——特别是“防火墙”章节中的 PF 部分——以查看哪些信息适用于你的情况。FreeBSD\
  \ 9 和 10 中的 PF 代码与 OpenBSD 4.5 的代码等同，修复了一些错误。本书中的指令假设你正在运行 FreeBSD 9.0 或更高版本。\n\n\
  在 FreeBSD 上，PF 默认编译为内核可加载模块。如果你的 FreeBSD 设置使用 `GENERIC` 内核运行，你应该能够通过以下命令启动 PF：\n\
  \n```\n$ sudo kldload pf\n$ sudo pfctl -e\n```\n\n假设你已经将上述行放入了 `/etc/rc.conf` 并创建了\
  \ `/etc/pf.conf` 文件，你也可以使用 PF 的 `rc` 脚本来运行 PF。以下命令启用 PF：\n\n```\n$ sudo /etc/rc.d/pf\
  \ start\n```\n\n而以下命令禁用数据包过滤器：\n\n```\n$ sudo /etc/rc.d/pf stop\n```\n\n### 注意\n\
  \n在 FreeBSD 上，`/etc/rc.d/pf` 脚本要求 `/etc/rc.conf` 中至少有一行读取为 `pf_enable=\"YES\"` 并且有一个有效的\
  \ `/etc/pf.conf` 文件。如果未满足这些任一要求，脚本将带有错误消息退出。在默认的 FreeBSD 安装中没有 `/etc/pf.conf` 文件。\n\
  \n提供的 `/usr/share/examples/pf.conf` 仅包含以 `#` 开头的注释行。它为你展示了工作规则集的预览。如果你删除了行 `set\
  \ skip on lo` 前的 `#` 号，一旦启用 PF，你的回环接口组将不再受过滤。截至本文写作（2014 年），如果 FreeBSD `rc` 脚本读取\
  \ `pf.conf` 失败，将不会设置规则集。这意味着使用空规则集或内容无效的 `pf.conf` 启用 PF 将留下 `pass all` 规则集。\n\n\
  ### 在 NetBSD 上设置 PF\n\n在 NetBSD 2.0 中，PF 以加载内核模块的形式出现，可以通过软件包安装或编译进静态内核。在 NetBSD\
  \ 3.0 及更高版本中，PF 是基础系统的一部分。在 NetBSD 上，PF 是几种数据包过滤系统之一，你需要采取明确操作来启用它。\n\nNetBSD 版本之间\
  \ PF 配置的一些细节有所变化。\n\n要在 NetBSD 使用加载 PF 模块，请在 `/etc/rc.conf` 中添加以下行以分别启用加载内核模块、PF\
  \ 和 PF 日志：\n\n```\nlkm=\"YES\" # 加载内核模块\npf=YES\npflogd=YES\n```\n\n要手动加载 `pf` 模块并启用\
  \ PF，输入：\n\n```\n$ sudo modload /usr/lkm/pf.o\n$ sudo pfctl -e\n```\n\n或者，你也可以运行\
  \ `rc.d` 脚本来启用 PF 和日志，如下：\n\n```\n$ sudo /etc/rc.d/pf start\n$ sudo /etc/rc.d/pflogd\
  \ start\n```\n\n为了在启动时自动加载该模块，请将以下行添加到 `/etc/lkm.conf`：\n\n```\n/usr/lkm/pf.o -\
  \ - - BEFORENET\n```\n\n如果你的 `/usr` 文件系统位于独立分区上，请将此行添加到 `/etc/rc.conf`：\n\n```\n\
  critical_filesystems_local=\"${critical_filesystems_local} /usr\"\n```\n\n\n\n\n\
  提供的 `/etc/pf.conf` 文件不包含任何活动设置；它只包含以井号（`#`）开头的注释行和注释掉的规则。然而，它确实让你预览了运行中的规则集是什么样子。例如，如果你删掉\
  \ `set skip on lo` 这一行前面的井号以取消注释并保存文件，那么一旦你启用 PF 并加载规则集，你的回环接口将不会被经过过滤。但是，即使在你的\
  \ NetBSD 系统上启用了 PF，我们还没有来得及编写实际的规则集，因此 PF 除了通过数据包之外几乎没有做任何事情。\n\nNetBSD 通过 `/etc/defaults/pf.boot.conf`\
  \ 文件实现了一个默认或回退规则集。该规则集仅用于在 `/etc/pf.conf` 文件不存在或包含无效规则集时，让你的系统完成启动过程。你可以通过在 `/etc/pf.boot.conf`\
  \ 中放置自己的自定义内容来覆盖默认规则。\n\n## 简单的 PF 规则集：单台独立机器\n\n为了建立一个通用的、最小的基准，我们将从最简单的配置开始构建规则集。\n\
  \n## 极简规则集\n\n最简单的 PF 设置是在单台机器上，该机器不运行任何服务，且仅与一个网络（可能是互联网）通信。\n\n我们将从一个看起来这样的 `/etc/pf.conf`\
  \ 文件开始：\n\n```\nblock in all\npass out all keep state\n```\n\n此规则集拒绝所有入站流量，允许我们发送的流量，并保留我们连接的状态信息。PF\
  \ 从上到下读取规则；规则集中匹配某个数据包或连接的最后一条（`last`）规则是最终生效的规则。\n\n在这里，任何从其他地方进入我们系统的连接都将匹配 `block\
  \ in all` 规则。即使有了这个初步结果，规则评估将继续到下一条规则（`pass out all keep state`），但该流量甚至不符合该规则中的第一个标准（`out`\
  \ 方向）。由于没有更多规则需要评估，状态将不会改变，流量将被拦截。同样，从带有此规则集的机器发起的任何连接都无法匹配第一条规则（再次，方向错误），但将匹配第二条规则，这是一条\
  \ `pass` 规则，因此连接被允许通过。\n\n我们将在第 3 章中，在稍长的规则集的背景下，更详细地检查 PF 评估规则的方式以及顺序的重要性。\n\n\
  对于任何带有 `keep state` 部分的规则，PF 会将有关连接的信息（包括各种计数器和序列号）作为 `state table`（状态表）中的一项。状态表是\
  \ PF 存储已匹配规则的连接信息的地方，新到达的数据包将首先与现有的表项进行比较以查找匹配。只有当数据包不匹配任何现有状态时，PF 才会进行全面的 `rule\
  \ set evaluation`，检查该数据包是否匹配已加载规则集中的规则。我们也可以以各种方式指示 PF 对状态信息采取操作，但在像这样简单的案例中，我们的主要目标是允许我们发起的连接的返回流量回到我们这里。\n\
  \n请注意，在 OpenBSD 4.1 及更高版本中，`pass` 规则的默认设置是保留状态信息，我们不再需要在像这样简单的案例中显式指定 `keep state`。这意味着规则集可以写成：\n\
  \n```\n## 极简规则集，OpenBSD 4.1 之后默认保留状态\nblock in all\npass out all\n```\n\n事实上，如果你喜欢，甚至可以省略这里的\
  \ `all` 关键字。\n\n其他 BSD 系统现在已基本跟上这一变化，在本书的其余部分，我们将坚持较新的规则，并在你可能使用旧系统时偶尔进行提醒。\n\n\
  不言而喻的是，允许特定主机产生的所有流量意味着该主机实际上是可信的。只有在你知道这台机器是你可以信任的机器时，才会这样做。\n\n当你准备好使用此规则集时，使用以下命令加载它：\n\
  \n```\n$ sudo pfctl -ef /etc/pf.conf\n```\n\n规则集应该在没有任何错误消息或警告的情况下加载。除了最慢的系统外，你应该立即返回到\
  \ `$` 提示符。\n\n### 测试规则集\n\n测试你的规则集以确保它们按预期工作一直是一个好习惯。一旦你转向更复杂的配置，适当的测试将变得至关重要。\n\
  \n要测试简单的规则集，查看它是否可以执行域名解析。例如，你可以查看 `$ host nostarch.com` 是否返回信息，例如主机 `nostarch.com`\
  \ 的 IP 地址以及该域邮件交换服务器的主机名。或者只需查看你是否可以上网。如果你能通过名称连接到外部网站，说明规则集允许你的系统执行域名解析。基本上，你从自己的系统尝试访问的任何服务都应该正常工作，而你从另一台机器尝试访问你系统上的任何服务都应该产生\
  \ `Connection refused` 消息。\n\n## 稍微严格：使用列表和宏提高可读性\n\n上一节中的规则集极其简单——对于实际使用来说可能过于简单了。但它是构建更具结构化且更完整的设置的有用起点。我们将从拒绝所有服务和协议开始，然后只允许我们知道自己需要的那些，并使用列表和宏来提高可读性。\n\
  \n`list`（列表）简单来说两个或多个相同类型的对象，你可以在规则集中引用它们，例如：\n\n```\npass proto tcp to port 222\
  \ 80 44 } }\n```在这里，`{ 22 80 443 }` 是列表。\n\n`macro`（宏）是一个纯的可读性工具。如果你在配置中多次引用某些对象（例如某个主机的\
  \ IP 地址），定义宏可能会很有用。例如，你可能会在规则集的早期定义此宏：\n\n```\nexternal_mail = 192.0.2\n```\n\n\
  然后你可以在规则集的后部分通过 `$external_mail` 引用该主机：\n\n```\npass proto tcp to $external_mail\
  \ port 25\n```\n\n这两个技术在保持规则集可读性方面具有巨大潜力，因此它们是实现整体控制目标的重要因素。\n\n### 更加严格的基准集\n\n\
  到为止，我们对生成的任何流量都是相当宽松的。宽松的规则集在我们检查基本连通性或检查过滤是否是我们正在遇到的问题所在时非常有用。一旦“我们是否有连通性？”阶段结束，就是时候开始收紧以创建一个让我们保持控制的基准了。\n\
  \n首先，在 `/etc/pf.conf` 中添加以下规则：\n\n```\nblock all\n```\n\n此规则是完全限制性的，将拦截所有方向的流量。这是我们在未来几章中所有完整规则集中使用的初始基准过滤规则。我们基本上从零开始，配置中没有任何流量允许通过。稍后，我们将添加规则来放宽流量，但我们将以循序渐进的方式进行，并稳固地保持控制。\n\
  \n接下来，我们将定义几个宏供以后在规则集使用：\n\n```\ntcp_services = \"{ ssh, smtp, domain, www, pop3,\
  \ auth, https, pop3s }\"\nudp_services = \"{ domain }\"\n```\n\n在这里，你可以看到列表和宏的结合如何转化为我们的优势。宏可以是列表，而且如示例所示，PF\
  \ 理解使用服务名称以及端口号的规则，正如你的 `/etc/services` 文件中列出的一样。在处理需要更复杂规则集的复杂情况时，我们会运用所有这些元素以及一些额外的可读性技巧。\n\
  \n\n\n定义了这些宏后，我们就可以在规则中使用它们了，现在对规则进行微调，使其看起来如下：\n\n```\nblock all\npass out proto\
  \ tcp to port $tcp_services\npass proto udp to port $udp_services\n```\n\n字符串 `$tcp_services`\
  \ 和 `$udp_services` 是宏引用。规则集中的宏在规则集加载时会在原处展开，运行中的规则集将在引用宏的地方插入完整的列表。根据宏的具体性质，它们可能会导致带有宏引用的单条规则展开为多条规则。即使在像这样较小的规则集中，使用宏也使得规则更易于理解和维护。规则集中需要显示的信息量缩减了，而且通过合理的宏命名，逻辑变得更加清晰。为了遵循典型规则集中的逻辑，在大多数情况下，我们不需要在每个宏引用处看到完整的\
  \ IP 地址列表或端口号列表。\n\n从实用的规则集维护角度来看，记住在哪些协议上允许哪些服务是非常关重要的，这可以保持一个恰到好处的紧密策略。根据协议对允许的服务分开分开列表，可能有助于保持你的规则集既具有功能性又具有可读性。\n\
  \n### TCP vs. UDP\n\n我们特意将 UDP 服务与 TCP 服务隔离开。某些服务主要运行在 TCP 或 UDP 的已知端口上，而少数服务会根据特定条件在\
  \ TCP 和 UDP 之间切换。\n\n这两个协议在几个方面有很大区别。TCP 是面向连接且可靠的，是状态过滤的完美人选。相比之下，UDP 是无状态且无连接的，但\
  \ PF 会为 UDP 流量创建并维护等同于状态信息的数据，以确保如果 UDP 返回流量匹配现有状态，则允许其通过。\n\nUDP 状态信息有用的一个常见示例是处理域名解析。当你请求\
  \ DNS 服务器将域名解析为 IP 地址，或将 IP 地址解析回主机名时，假设你想收到答案是合理的。保留状态信息或关于你的 UDP 流量的功能等效信息使得这成为可能。\n\
  \n### 重新加载规则集并查找错误\n\n在我们更改了 `pf.conf` 文件后，我们需要如下所示加载新规则：\n\n```\n$ sudo pfctl -f\
  \ /etc/pf.conf\n```\n\n如果没有语法错误，`pfctl` 在加载规则期间不应显示任何消息。\n\n如果你倾向于显示详细输出，请使用 `-v`\
  \ 标志：\n\n```\n$ sudo pfctl -vf /etc/pf.conf\n```\n\n当你使用详细模式时，`pfctl` 应该在返回命令行提示符之前将你的宏展开为独立的规则，如下所示：\n\
  \n```\n$ sudo pfctl -vf /etc/pf.conf\ntcp_services = \"{ ssh, smtp, domain, www,\
  \ pop3, auth, https, pop3s }\"\nudp_services = \"{ domain }\"\nblock drop all\n\
  pass out proto tcp from any to any port = ssh flags S/SA keep state\npass out proto\
  \ tcp from any to any port = smtp flags S/SA keep state\npass out proto tcp from\
  \ any to any port = domain flags S/SA keep state\npass out proto tcp from any to\
  \ any port = www flags S/SA keep state\npass out proto tcp from any to any port\
  \ = pop3 flags S/SA keep state\npass out proto tcp from any to any port = auth flags\
  \ S/SA keep state\npass out proto tcp from any to any port = https flags S/SA keep\
  \ state\npass out proto tcp from any to any port = pop3s flags S/SA keep state\n\
  pass proto udp from any to any port = domain keep state\n$ _\n```\n\n将此输出与你实际编写的\
  \ `/etc/pf.conf` 文件的内容进行比较。我们的单个 TCP 服务规则展开成了八条不同的规则：列表中的每个服务对应一个。单条 UDP 规则只处理一个服务，它从我们写的内容展开并包含了默认选项。注意，规则是全显示的，并应用了如\
  \ `flags S/SA keep state` 等默认值来替换你未显式指定的任何选项。这是实际加载时的配置。\n\n### 检查你的规则\n\n如果你已经对规则集进行了大量更改，请在尝试加载规则集之前，使用以下命令对其进行检查：\n\
  \n```\n$ pfctl -nf /etc/pf.conf\n```\n\n`-n` 选项告诉 PF 仅解析规则而不加载它们——在某种程度上类似于干运行，并允许你检查和纠正任何错误。如果\
  \ `pfctl` 在你的规则集中发现任何语法错误，它将带有错误消息退出，该消息指向错误发生的行号。\n\n一些防火墙指南建议你确保旧配置已彻底删除，否则你将遇到麻烦——你的防火墙可能处于某种中间状态，既不匹配之前的状态也不匹配更改后的状态。当你使用\
  \ PF 时，这完全不是事实。最后加载的有效规则集保持活动，直到你禁用 PF 或加载新的规则集。`pfctl` 会检查语法，然后完全加载你的新规则集，然后再切换到新规则集。这通常被称为原子规则集加载，意味着一旦加载了有效规则集，就不会存在带有部分规则或未加载规则的中间状态。其结果之一是，匹配旧新规则集中都有效的状态的流量不会被中断。\n\
  \n除非你真的遵循了某些那些旧指南的建议，在尝试加载新规则之前刷新了现有的规则（这是可能的，使用 `pfctl -F all` 或类似命令），否则最后一个有效配置将保持加载状态。事实上，刷新规则集很少是一个好主意，因为这实际上会将你的防火墙置于\
  \ `pass all` 模式，从而增加了干扰有用流量的风险。\n\n### 测试规则集\n\n一旦你有了 `pfctl` 无错误加载的规则集，就是时候测试你编写的规则是否符合预期了。使用像之前之前的\
  \ `host.com` 命令进行域名解析测试仍然有效。不过，最好选择一个你最近没有访问过的域名，例如你不会考虑投票的某个政党的域名，以确保你不是从缓存中获取\
  \ DNS 信息。\n\n你应该能够浏览网页并使用某些邮件服务，但由于这个更新后的规则集的性质，访问任何远程系统除 SSH、SMTP 等其他 TCP 服务的尝试都将失败。而且，和我们的简单规则一样，你的系统将拒绝所有不受现有状态条目的连接；只有由本机发起的返回流量会被允许进入。\n\
  \n## 显示有关系统的信息\n\n你对规则集的测试应该表明 PF 正在运行且你的规则行为符合预期。有多种方法可以跟踪运行系统的情况。提取 PF 信息的最直接方法之一是使用熟悉的\
  \ `pfctl` 程序。\n\n一旦启用并运行 PF，系统就会根据网络活动更新各种计数器统计数据。要确认 PF 是否运行并查看其活动统计数据，可以使用 `pfctl\
  \ -s` 后跟你想显示的类型。有很多信息类型可用（参见 `man 8 pfctl` 并查找 `-s` 选项）。我们将在第 9 章回到其中一些显示选项，并在第\
  \ 10 章对它们提供的一些统计数据进行更深入的讨论。\n\n\n\n以下是 `pfctl -s info` 输出顶部分的示例（摘自我的家庭网关）。指示系统实际通过流量的高级信息可以在此部分找到。\n\
  \n```\n$ sudo pfctl -s info\nStatus: Enabled for 24 days 12:11:27              \
  \  Debug: err\n\nInterface Stats for nfe0               IPv4               IPv6\n\
  \  Bytes In                      43846385394                  0\n  Bytes Out   \
  \                  20023639992                 64\n  Packets In\n    Passed    \
  \                      49380289                 0\n    Blocked                 \
  \           49530                 0\n  Packets Out\n    Passed                 \
  \         45701100                 1\n    Blocked                             1034\
  \                 0\n\nState Table                            Total            \
  \  Rate\n  current entries                        319\n  searches              \
  \           178598618            84.3/s\n  inserts                            4965347\
  \             2.3/s\n  removals                           4965028             2.3/s\n\
  ```\n\n`pfctl` 输出的第一行表示 PF 已启用，并且已经运行了三个多周，这等于自我上一次执行需要重启的系统升级以来的时间。\n\n显示中的 `Interface\
  \ Stats` 部分表明系统管理员选择了一个接口（此处为 `nfe0`）作为系统的日志接口，并显示了该接口处理的入站和出站字节数。如果没有选择日志接口，显示内容将略有不同。现在是检查你的系统产生什么输出的好时机。接下来的几项在我们的语境下可能更有趣，显示了每个方向被拦截或通过的数据包数量。在这里，我们可以发现我们编写的过滤规则是否捕获了流量的早期迹象。在这种情况下，要么规则集很好匹配预期流量，要么我们的用户和访客的行为比较良好，两个方向的通过数据包数量都远大于被拦截的数据包数量。\n\
  \n正在处理流量的运行系统的另一个重要指标是 `State Table` 统计块。状态表的 `current entries` 行显示有 319 个活动状态或连接，而状态表被搜索以匹配现有状态的次数（`searches`）平均每秒略多\
  \ 84 次，自计数器重置以来总计超过 1.78 亿次。`inserts` 和 `removals` 计数器分别显示了状态创建和删除的次数。如所预期，插入和删除的数量取决于当前活动状态的数量，速率计数器显示，自上次计数器重置以来，状态创建和删除的速率在显示的分辨率范围内完全匹配。\n\
  \n这里的信息大致符合你在一个仅配置了 IPv4 的小规模网络网关上应该看到的统计数据。无需为 IPv6 列中通过的数据包而惊惊。OpenBSD 内置了 IPv6。在网络接口配置期间，TCP/IP\
  \ 栈默认会为链路本地地址发送 IPv6 邻居请求请求。在正常的仅限 IPv4 配置中，实际上只有前几个数据包会通过，而等到 `/etc/pf.conf` 中的\
  \ PF 规则集完全加载时，IPv6 数据包就会被“拦截所有”规则拦截。（在本例中，它们没有出现在 `nfe0` 的统计数据中，因为 IPv6 是通过另一个接口进行隧道的。）\n\
  \n## 展望\n\n你现在应该拥有一台可以与其他连接互联网的机器通信的设备，使用了一套非常基本的规则集作为控制你网络流量的起点。随着你阅读这本书，你将学习如何添加执行各种用途的规则。在第\
  \ 3 章 中，我们将扩展配置以作为小型网络的网关。服务于几台电脑的需求会带来一些后果，我们将查看如何允许某些 ICMP 和 UDP 流量通过——至少是为了你自己的排故障需求。\n\
  \n在第 3 章 中，我们还将考虑对你的安全产生产生影响的网络服务，例如 `FTP`。智能地使用数据包过滤来处理对安全性要求较高的服务是本书反复出现的主题。\n\
  \n^([12]) 为什么要将规则集写为默认拒绝？简单的答案是它能给你提供更好的控制。数据包过滤的意义在于掌握控制，而不是去追赶坏家伙们的行为。Marcus Ranum\
  \ 写了一篇非常有趣且富有见解的文章，标题为“计算机安全中的六个最蠢的想法”（*[`www.ranum.com/security/computer_security/editorials/dumb/index.html`](http://www.ranum.com/security/computer_security/editorials/dumb/index.html)*）。\n\
  \n## 第 3 章. 进入真实世界\n\n![进入真实世界](img/httpatomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n上一章演示了单机基础数据包过滤的配置。在本章中，我们将在此基础设置的基础上移动到更常规的领域：数据包过滤网关（`gateway*`）。虽然本章中的大多数项目在单机设置中都可能有用，但我们的主要重点是建立一个转发特定网络流量并为基础网络处理常用服务的网关。\n\
  \n## 简单网关\n\n我们将从构建你可能与“防火墙”一词相关的机器开始：一台作为至少其他机器的网关。除了在各个网络之间转发数据包外，该机器的任务将提高它处理的网络流量的信噪比。这就是我们配置\
  \ 配置的地方。\n\n但在深入具体的配置细节之前，我们需要接触一些理论并完善一些概念。请耐心阅读；这将为你避免我在邮件列表、新闻组和网络论坛经常看到的麻烦。\n\
  \n### 保持简单：避免 in、out 和 on 的陷阱\n\n在单机设置中，生活相对简单。你创建的流量要么流向世界其他地方，要么被你的过滤规则拦截，你可以决定从其他地方允许进入。\n\
  \n当你设置网关时，你的视角发生了变化。你从“我对抗外面的网络”的心态转变为“我是决定通过我所连接的所有网络的人”。这台机器有多个（或至少两个）网络接口，每个接口连接到一个独立的网络，它的主要功能（或至少我们在这里感兴趣的功能）是在网络之间转发网络流量。概念上，该网络看起来像图\
  \ 3-1。\n\n![单一网关](img/httpatomoreillycomsourcenostarchimages2127151.png.jpg)图 3-1.\
  \ 单一网关\n\n人们合理认为，如果你想让流量从连接 `re1` 的网络通过连接 `re0` 网络上的主机，你可能需要类似下面的规则：^([⁸])\n\n```\n\
  pass in proto tcp on re1 from re1:network to re0:network \\\n                  port\
  \ $ports keep state\n```\n\n\n\n然而，防火墙配置中最常见且最受抱怨的错误之一，就是没有意识到 `to` 关键字本身并不保证流量到达终点。在这里，`to`\
  \ 关键字仅意味着数据包或连接的目的地址必须符合这些准则，才能匹配该规则。我们刚刚编写的规则允许流量 `in`（进入）到网关本身，并运行在规则中指定的特定接口\
  \ `on`（在...上）。为了让数据包进一步进入并进入下一个网络，我们需要一条类似下方的匹配规则：\n\n```\npass out proto tcp on\
  \ re0 from re1:network to re0:network \\\n                     port $ports keep\
  \ state\n```\n\n但请停下来，花点时间再读一遍这些规则。最后这条规则仅允许目的地位于直接连接到 `re0` 的网络的数据包通过，不再允许其他。如果这恰恰是你想要的，那很好。在其他语境下，这种规则虽然完全有效，但比实际需要的更具体了。人们很容易深陷于特定的细节中，从而失去对配置目的的高层视角——并可能在此过程中让自己多花上几轮调试。\n\
  \n如果有充分理由编写像前面那些规则那样非常具体的规则，你可能已经知道你需要它们以及为什么需要它们。当你读完这本书时（如果不是更早），你应该能够清楚地阐述在何时需要更具体的规则。然而，对于本章中的基础网关配置，你可能希望编写不针对特定接口的规则。事实上，在某些情况下，指定方向也是没用的；你只需要使用如下规则来让你的本地网络访问互联网：\n\
  \n```\npass proto tcp from re1:network to port $ports keep state\n```\n\n对于简单的设置，绑定接口的\
  \ `in` 和 `out` 规则给规则集带来的混乱可能远大于其价值。对于一个忙碌的网络管理员来说，一个易读的规则集是一个更安全的规则集。（我们还将查看一些额外的安全措施，例如\
  \ `antispoof`，位于第 10 章）。）\n\n在本书的剩余部分，我们将，我们将规则保持尽可能简单以便于阅读。\n\n### 网络地址翻译与 IPv6\n\
  \n一旦我们开始处理不同网络之间的流量，了解一下网络地址的工作原理以及为什么你可能会遇到几种不同的地址方案是很有用的。多年来，网络地址这一主题一直是困惑和术语堆砌的源源。除非你去溯源并查阅一系列\
  \ RFC，否则底层的实往往很难确立。在接下来的几个段落中，我将努力消除一些困惑。\n\n例如，一种广泛接受的观点是，如果你有一个内部网络使用的地址范围与连接到互联网的接口分配范围完全不同，那么就是安全的，外部人员无法访问你的网络资源。这种观点与这种想法：本地网络中防火墙的\
  \ IP 地址必须是 `192.168.0.1` 或 `10.0.0.1` 的想法密切相关。\n\n这两种观点都包含事实元素，这些地址也是常见的默认值。但真实情况是，通过嗅探绕过网络地址翻译是可能的，尽管\
  \ PF 提供了一些技巧让这项变得更加困难。\n\n我们之所以使用特定的内部地址范围和另一组不同的地址用于唯一的外部地址范围，主要原因不是为了解决安全顾虑。相反，这是解决互联网协议中一个设计问题最简单的方法：可能的地址范围有限。\n\
  \n在 20 世纪 80 年互联网协议制定时，互联网上的大多数计算机（或当时被称为 ARPANET）都是大型机器，每个机器拥有从几十到几千个用户。当时，一个拥有四十十亿多个地址的\
  \ 32 位地址空间似乎足够了，但几个因素的共同证明了这一假设是错误的。一个因素是地址分配过程导致了这样的情况：在世界上一些人口最多的国家连接到互联网之前，可用地址空间最大的部分已经被分配掉了。另一个，可能更重要的因素是，到\
  \ 20 世纪 90 年代初，互联网不再是一个研究项目，而是一项商业资源，各种规模的消费者和公司以惊人的速度消耗 IP 地址空间。\n\n长期解决方案是重新定义互联网以使用更大的地址空间。1998\
  \ 年，IPv6 规范具有 128 位地址空间，总共 `2¹²⁸` 个地址，作为 `RFC 2460` 发布。但在我们等待 IPv6 普及期间，我们需要一个权宜之计。该方案是以一系列\
  \ RFC 的形式规定了网关如何转发经过 IP 地址翻译的流量，使得大型本地网络在互联网的其他部分看起来就像一台计算机。某些以前未分配的 IP 地址范围被留给了这些私有网络。这些地址供任何人免费使用，前提是这些范围内的流量不允许在未经翻译的情况下流向互联网。因此，`网络地址翻译\
  \ (NAT)` 在 20 世纪 90 年代中期诞生，并迅速成为处理本地网络地址的默认方式。\n\nPF 支持 IPv6 以及各种 IPv4 地址翻译技巧。（事实上，得亏\
  \ KAME 项目的努力，BSD 是最早的 IPv6 采用者之一。）所有支持 PF 的系统都支持 IPv4 和 IPv6 族。如果你的 IPv4 网络需要 NAT\
  \ 配置，你可以在 PF 规则集中根据需要集成。换句话说，如果你使用支持 PF 的系统，可以合理认为你的 IPv6 需求已经得到了解决。然而，某些带有 PF 的操作系统使用的是旧版本的代码，意识到“新代码更好”的通用规则同样适用于\
  \ IPv6。书中的示例主要使用 IPv4 地址并在适当的情况下使用 NAT，但大部分内容对于实现 IPv6 的网络同样。\n\n### 最后的准备：定义你的本地网络\n\
  \n在第 2 章中，我们为单台独立机器设置了配置。我们正准备将该配置扩展到网关版本，定义一些宏有助于可读性，并在概念上将你拥有一定控制权的本地网络与其他隔离开。那么，在\
  \ PF 术语中如何定义你的“本地”网络呢？\n\n在本章前面，你看到了 `interface:network` 表示法。这是一个很好的简写，但通过进一步使用宏，可以让你的规则集更加易读且于维护。例如，你可以将\
  \ `$localnet` 宏定义为直接连接到内部接口的网络（示例中的 `re1:network`）。或者你可以将 `$localnet` 的定义改为 IP 地址/掩码表示法表示网络，例如用于私有\
  \ IPv4 地址子网的 `192.168.100.0/24` 或用于 IPv6 范围的 `2001:db8:dead:beef::/64`。\n\n如果你的网络环境需要，你可以将\
  \ `$localnet` 定义为网络列表。例如，合理的 `$localnet` 定义结合使用宏的 `pass` 规则（如下），可能会为你节省很多麻烦：\n\n\
  ```\npass proto { tcp, udp } from $localnet to port $ports\n```\n\n\n\n从现在起，我们将坚持使用类似\
  \ `$localnet` 的宏约定以提高可读性。\n\n### 设置网关\n\n我们将以上一章中从零构建的单机配置为起点，构建我们的数据包过滤网关。我们假设该机器已获取了另一个网卡（或者你已经通过以太网、PPP\
  \ 或或其他手段建立了从本地网络到一个或多个其他网络的网络连接）。\n\n在我们的语文中，查看接口配置的细节并不十分有趣。我们只需要知道接口正处于运行状态即可。\n\
  \n对于后续的讨论和示例，PPP 设置和以太网设置之间区别在于接口名称，我们将尽力尽快不再使用具体的接口名称。\n\n首先，由于所有 BSD 系统默认关闭数据包转发，我们需要开启它，以便让机器能够将其从一个接口收到的网络流量通过一个或多个独立的接口转发到其他网络。最初，我们将在命令行中使用\
  \ `sysctl` 命令对传统的 IPv4 进行此操作：\n\n```\n### sysctl net.inet.ip.forwarding=1\n```\n\
  \n如果我们需要转发 IPv6 流量，则使用此 `sysctl` 命令：\n\n```\n### sysctl net.inet6.ip6.forwarding=1\n\
  ```\n\n目前这样可以了。但是，为了在将来某时刻重启电脑后这些设置仍然有效，你需要将这些设置输入相关的配置文件。\n\n在 OpenBSD 和 NetBSD\
  \ 中，你通过编辑 `/etc/sysctl.conf` 并向文件末尾添加 IP 转发行来实现，使得最后几行看起来如下：\n\n```\nnet.inet.ip.forwarding=1\n\
  net.inet6.ip6.forwarding=1\n```\n\n在 FreeBSD 中，通过将这些行放入你的 `/etc/rc.conf` 来进行更改：\n\
  \n```\ngateway_enable=\"YES\" #用于 ipv4\nipv6_gateway_enable=\"YES\" #用于 ipv6\n```\n\
  \n最终效果是相同的；FreeBSD 的 `rc` 脚本通过 `sysctl` 命令设置了这两个值。然而，FreeBSD 配置的大部分内容集中在 `rc.conf`\
  \ 文件中。\n\n现在是时候检查你想要使用的接口是否都处于运行状态了。使用 `ifconfig -a` 或 `ifconfig interface_name`\
  \ 来查找。\n\n在我其中一个系统上运行 `ifconfig -a` 的输出如下：\n\n```\n$ ifconfig -a\nlo0: flags=8049<UP,LOOPBACK,RUNNING,MULTICAST>\
  \ mtu 33224\n        groups: lo\n        inet 127.0.0.1 netmask 0xff000000\n   \
  \     inet6 ::1 prefixlen 128\n        inet6 fe80::1%lo0 prefixlen 64 scopeid 0x5\n\
  xl0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500\n        lladdr\
  \ 00:60:97:83:4a:01\n        groups: egress\n        media: Ethernet autoselect\
  \ (100baseTX full-duplex)\n        status: active\n        inet 194.54.107.18 netmask\
  \ 0xfffffff8 broadcast 194.54.107.23\n        inet6 fe80::260:97ff:fe83:4a01%xl0\
  \ prefixlen 64 scopeid 0x1\nfxp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 00:30:05:03:fc:41\n        media: Ethernet autoselect\
  \ (100baseTX full-duplex)\n        status: active\n        inet 194.54.103.65 netmask\
  \ 0xffffffc0 broadcast 194.54.103.127\n        inet6 fe80::230:5ff:fe03:fc41%fxp0\
  \ prefixlen 64 scopeid 0x2\npflog0: flags=141<UP,RUNNING,PROMISC> mtu 33224\nenc0:\
  \ flags=0<> mtu 1536\n```\n\n你的设置可能有些不同。在这里，网关上的物理接口是 `xl0` 和 `fxp0`。逻辑接口 `lo0`（回回接口）、`enc0`（用于\
  \ IPSEC 的封装接口）和 `pflog0`（PF 日志设备）可能也存在于你的系统中。\n\n如果你使用的是拨号连接，你可能使用某种 PPP 变体进行 Internet\
  \ 连接，你的外部接口是 `tun0` 伪设备。如果你的连接是通过某种宽带连接的，你可能有一个以太网接口可以操作。然而，如果你是使用以太网拨号（PPPoE）的\
  \ ADSL 用户这一重要群体，正确的外部接口将是伪设备 `tun0` 或 `pppoe0` 之一（取决于你使用的是用户态的 `pppoe(8)` 还是内核态的\
  \ `pppoe(4)`），而不是物理以太网接口。\n\n根据具体的设置，你可能需要对接口进行某些其他特定设备的配置。在你完成这些设置后，就可以进入数据包过滤层面并处理接口。如果你仍然打算允许内部机器发起的任何流量，你网关的\
  \ `/etc/pf.conf` 配置看起来大致如下：\n\n```\ngateway_enable=\"YES\" #用于 ipv4\nipv6_gateway_enable=\"\
  YES\" #用于 ipv6\n```\n\n最终效果是完全相同的；FreeBSD 的 `rc` 脚本通过 `sysctl` 命令设置了这两个值。然而，FreeBSD\
  \ 配置的大部分内容集中在 `rc.conf` 文件中。\n\n现在是时候检查你想要使用的接口是否都处于运行状态了。使用 `ifconfig -a` 或 `ifconfig\
  \ interface_name` 来查找。\n\n在我其中一个系统上运行 `ifconfig -a` 的输出如下：\n\n```\n$ ifconfig -a\n\
  lo0: flags=8049<UP,LOOPBACK,RUNNING,MULTICAST> mtu 33224\n        groups: lo\n \
  \       inet 127.0.0.1 netmask 0xff000000\n        inet6 ::1 prefixlen 128\n   \
  \     inet6 fe80::1%lo0 prefixlen 64 scopeid 0x5\nxl0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 00:60:97:83:4a:01\n        groups: egress\n        media:\
  \ Ethernet autoselect (100baseTX full-duplex)\n        status: active\n        inet\
  \ 194.54.107.18 netmask 0xfffffff8 broadcast 194.54.107.23\n        inet6 fe80::260:97ff:fe83:4a01%xl0\
  \ prefixlen 64 scopeid 0x1\nfxp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 00:30:05:03:fc:41\n        media: Ethernet autoselect\
  \ (100baseTX full-duplex)\n        status: active\n        inet 194.54.103.65 netmask\
  \ 0xffffffc0 broadcast 194.54.103.127\n        inet6 fe80::230:5ff:fe03:fc41%fxp0\
  \ prefixlen 64 scopeid 0x2\npflog0: flags=141<UP,RUNNING,PROMISC> mtu 33224\nenc0:\
  \ flags=0<> mtu 1536\n```\n\n你的设置可能有些不同。在这里，网关上的物理接口是 `xl0` 和 `fxp0`。逻辑接口 `lo0`（回回接口）、`enc0`（用于\
  \ IPSEC 的封装接口）和 `pflog0`（PF 日志设备）可能也存在于你的系统中。\n\n如果你使用的是拨号连接，你可能使用某种 PPP 变体进行 Internet\
  \ 连接，你的外部接口是 `tun0` 伪设备。如果你的连接是通过某种宽带连接的，你可能有一个以太网接口可以操作。然而，如果你是使用以太网拨号（PPPoE）的\
  \ ADSL 用户这一重要群体，正确的外部接口将是伪设备 `tun0` 或 `pppoe0` 之一（取决于你使用的是用户态的 `pppoe(8)` 还是内核态的\
  \ `pppoe(4)`），而不是物理以太网接口。\n\n根据具体的设置，你可能需要对接口进行某些其他特定设备的配置。在你完成这些设置后，就可以进入数据包过滤层面并处理接口。如果你仍然打算允许内部机器发起的任何流量，你网关的\
  \ `/etc/pf.conf` 配置看起来大致如下：\n\n```\ngateway_enable=\"YES\" #用于 ipv4\nipv6_gateway_enable=\"\
  YES\" #用于 ipv6\n```\n\n\n\n\n```\npass proto tcp from $localnet to port $client_out\n\
  ```\n\n这组端口的选择可能有些奇特，但确实是我的同事们当时所需要的。某些编号端口是为了那些在其他站点为特定目的而建立的系统。你的需求可能在某些细节上有所不同，但这些应该涵盖一些最实用的服务。\n\
  \n这里是另一个 `pass` 规则，对于那些想要从其他地方管理机器的人来说非常有用：\n\n```\npass in proto tcp to port ssh\n\
  ```\n\n或者，如果你更喜欢，可以使用这种形式：\n\n```\npass in proto tcp to $ext_if port ssh\n```\n\n\
  当你完全省掉 `from` 部分时，默认值是 `from any`，这是非常宽松的设置。它允许你从任何地方登录，如果你经常旅行并需要在全球各地的未知未知位置进行\
  \ `SSH` 访问，这太棒了。如果你并不怎么经常移动——比如，你对在偏远地区参加会议并没有产生兴趣，或者你觉得在你度假期间同事们可以自当其力——你可能想通过添加\
  \ `from` 部分来收紧限制，只包含你和其他管理员可能出于正当理由登录的地方。\n\n我们非常基础的规则集仍然不完整。接下来，我们需要为客户端让名服务工作。我们从规则集的开始引入另一个宏：\n\
  \n```\nudp_services = \"{ domain, ntp }\"\n```\n\n这通过一条规则进行补充，该规则允许我们想要的流量通过防火墙：\n\
  \n```\npass quick proto { tcp, udp } to port $udp_services\n```\n\n注意这条规则中的 `quick`\
  \ 关键字。我们已经开始编写由几条规则组成的规则集，现在是时候重新审视它们之间的关系和交互了。\n\n正如上一章提到的，规则按照它们在配置文件中的编写顺序从上到下进行评估。对于\
  \ `PF` 评估的每个包或连接，规则集中的**最后一个匹配规则**将被应用。\n\n`quick` 关键字提供了一个跳出普通序列的机会。当数据包匹配 `quick`\
  \ 规则时，包将按照当前规则进行处理。规则处理停止，不再考虑任何可能匹配该包的后续规则。随着你的规则集变得越来越长复杂，你会发现这非常方便。例如，当你需要在通用规则上设置少数孤例外时，这很有用。\n\
  \n这条 `quick` 规则还处理了用于时间同步的 `NTP`。名服务和时间同步协议的共同点是，在某些情况下，它们可能会交替通过 `TCP` 和 `UDP`\
  \ 进行通信。\n\n### 测试你的规则集\n\n你可能还没有来得及为你的规则集编写那个正式的测试套件，但完全有理由测试你的配置是否按预期工作。\n\n上一章中独立示例的相同基本测试仍然适用。但现在你不仅需要从网络中的其他主机进行测试，还需要从你的包过滤网关进行测试。对于你在\
  \ `pass` 规则中指定的每个服务，请测试本地网络中的机器是否获得了有意义的结果。从本地网络中的任何机器，输入如下的命令：\n\n```\n$ host nostarch.com\n\
  ```\n\n它返回的结果应该与你在上一章测试独立规则集时完全相同，并且你所指定的服务的流量应该能够通过。\n\n你可能认为这没有必要，但从网关外部检查规则集是否按预期工作也无坏处。如果你到目前为止完全按照本章所言操作，那么就不可能从外部连接到本地网络中的机器。\n\
  \n### 为什么只用 IP 地址——而不是主机名或域名？\n\n观察到此的示例，你可能已经注意到所有的规则集都包含扩展为 IP 地址或地址范围的宏，但从未扩展为主机名或域名。你可能在好奇为什么。毕竟，你已经看到\
  \ `PF` 允许你在规则集中使用服务名，那么为什么不包含主机名或域名呢？\n\n答案是，如果你在规则集中使用了域名和主机名，那么该规则集只有在名服务运行且可访问后才是有效的。在默认配置中，`PF`\
  \ 在任何网络服务运行之前加载。这意味着，如果你想在 `PF` 配置中使用域名和主机名，你就需要更改系统的启动顺序（可能需要通过编辑 `/etc/rc.local`），仅在名服务可用后才加载依赖名服务的规则集。如果你在\
  \ `PF` 配置中想要引用的主机名或域名数量有限，那么将它们作为 IP 地址添加到 `/etc/hosts` 文件的名称映射条目中，并保持 `rc` 脚本不变，可能至少同样有用。\n\
  \n### 那件可怜的旧式 FTP 东西\n\n在我们刚才查看的现实 `TCP` 端口短列表，其中包含了 `FTP`，即经典的**文件传输协议**。`FTP`\
  \ 是互联网早期的遗物，那时实验是常态，而安全在任何现代意义上都不真正存在。`FTP` 实际上早于 `TCP/IP`，通过超过 50 份 `RFC` 可以追踪该协议的发展。在经历了\
  \ 30 多年后，`FTP` 既是一件可怜的老古董，也是一个麻烦骨头——对于任何试图将 `FTP` 与防火墙结合的人来说，尤其是如此。`FTP` 是一个老旧且奇怪的协议，有很多令人讨厌的地方。以下是反对它最常见的点：\n\
  \n* 密码以明文传输。\n* 该协议要求使用两个独立的 `TCP` 连接（控制和数据）。\n* 当会话建立时，数据通过随机选择的端口进行通信。\n\n所有这些点在安全性方面都是挑战，更不用说客户端或服务器软件可能导致的安全漏洞了。任何网络老手都会告诉你，这些问题往往在你最不需要它们的时候出现。在任何情况下，都有更现代、更安全的文件传输选项，例如\
  \ `SFTP` 和 `SCP`，它们具有通过加密连接进行身份验证和数据传输的功能。合格的 IT 专业人士倾向于使用 FTP 以外的任何形式的文件传输。\n\n\
  无论我们的专业程度和偏好如何，我们有时必须处理一些不愿处理的事情。在防火墙通过 `FTP` 的情况下，我们可以通过将流量重定向到一个专门为此编写的小程序来解决问题。对我们有利的一方面是处理\
  \ `FTP` 让我们有机会学习两个相当的 `PF` 特性：重定向和锚点。\n\n在我们的这种默认阻塞的情况下，处理 `FTP` 最简单的方法是让 `PF` 将服务的流量重定向到一个作为该服务代理的外部应用程序。代理维护自己命名的子规则集（在\
  \ `PF` 术语中称为锚点），根据 `FTP` 流量需要插入或删除规则。重定向和锚点的结合为包过滤子系统与代理之间提供了一个清晰、定义的接口。\n\n###\
  \ 如果必须使用：带有 divert 或 redirect 的 ftp-proxy\n\n得益于 OpenBSD 基础系统中包含 `ftp-proxy` 程序，通过网关启用\
  \ `FTP` 传输异常简单。该程序的名字——你猜得着——`ftp-proxy`。\n\n要启用 `ftp-proxy`，你需要在 OpenBSD 的 `/etc/rc.conf.local`\
  \ 文件中添加此行：\n\n```\nftpproxy_flags=\"\"\n```\n\n在 FreeBSD 上，`/etc/rc.conf` 需要至少包含以下两行中的行：\n\
  \n```\nftpproxy_enable=\"YES\"\nftpproxy_flags=\"\" # 并将任何命令行选项放在这里\n```\n\n如果你需要为\
  \ `ftp-proxy` 指定任何命令行选项，请将它们放在 `ftpproxy_flags` 变量中。\n\n\n\n\n如果你愿意，可以通过运行 `/usr/sbin/ftp-proxy`\
  \ 来手动启动代理（或者更好，是在 OpenBSD 上使用带有 `start` 选项的 `/etc/rc.d/ftp-proxy` 脚本），你可能会这样做，以检查你即将对\
  \ PF 配置所做的更改是否达到了预期效果。\n\n对于基础配置，你只需要向 `/etc/pf.conf` 添加三个元素：一个 anchor（锚点）和两条 `pass`\
  \ 规则。anchor 的声明如下：\n\n```\nanchor \"ftp-proxy/*\"\n```\n\n在 OpenBSD 4.7 之前的版本中，需要两个\
  \ anchor 声明：\n\n```\nnat-anchor \"ftp-proxy/*\"\nrdr-anchor \"ftp-proxy/*\"\n```\n\
  \n代理将在此处插入它为 FTP 会话生成的规则。然后，你还需要一条 `pass` 规则来让 FTP 流量进入代理：\n\n```\npass in quick\
  \ inet proto tcp to port ftp divert-to 127.0.0.1 port 8021\n```\n\n注意 `divert-to`\
  \ 部分。它将流量重定向到本地端口，代理在那里通过高效的、仅限本地连接的 `divert(4)` 接口监听。在 OpenBSD 4.9 及之前的版本中，流量重定向是通过\
  \ `rdr-to` 完成的。如果你正在升级现有的 OpenBSD 5.0 前配置，你需要更新 `rdr-to` 规则，让 FTP 代理使用 `divert-to`\
  \ 代替。\n\n如果你的操作系统使用的是 OpenBSD 4.7 之前的 PF 版本，你需要使用这个版本的重定向规则：\n\n```\nrdr pass on\
  \ $int_if inet proto tcp from any to any port ftp -> 127.0.0.1 port 8021\n```\n\n\
  最后，确保你的规则集包含一条 `pass` 规则，允许数据包从代理通过到世界的其他地方，其中 `$proxy` 扩展为代理守护进程绑定的地址：\n\n```\n\
  pass out inet proto tcp from $proxy to any port ftp\n```\n\n重载你的 PF 配置：\n\n```\n\
  $ sudo pfctl -f /etc/pf.conf\n```\n\n很快，你的用户就会因为你让 FTP 正常工作而感谢你。\n\n### ftp-proxy\
  \ 设置的变体\n\n前面的示例涵盖了基础设置，即本地网络中的客户端需要连接其他地方的 FTP 服务器。这种配置应该与大多数 FTP 客户端和服务器的组合良好地工作。\n\
  \n你可以通过向 `ftpproxy_flags=` 行添加选项以各种方式更改代理的行为。你可能会遇到具有特定癖的客户端或服务器，你需要在配置中对其进行补偿，或者你可能想以特定的方式将代理集成到你的设置中，例如将\
  \ FTP 流量分配给特定的队列。对于这些以及 `ftp-proxy` 配置的其他更细微之处，你最好的办法是从学习手册页（man page）开始。\n\n如果你对运行受\
  \ PF 和 `ftp-proxy` 保护的 FTP 服务器感兴趣，你可以考虑在单独的端口上运行反向模式（使用 `-R` 选项）的 `ftp-proxy`，并配有自己的重定向\
  \ `pass` 规则。甚至可以设置代理运行在 IPv6 模式下，但如果你在运行现代协议方面领先，那么你不太可能费心于将 FTP 作为你的主要文件传输协议。\n\
  \n### 注意事项\n\n*如果你的 PF 版本早于这里描述的版本，说明你正在运行一个过时的、不受支持的操作系统。我强烈建议你尽快安排操作系统升级。如果出于某些原因无法升级，请查阅本书的第一版，并研究你操作系统的文档，以获取如何使用某些早期\
  \ FTP 代理的信息。*\n\n## 让你的网络易于故障排除\n\n让你的网络易于故障排除是一个潜在的大课题。通常情况下，你的 TCP/IP 网络的调试或故障排除友好程度，取决于你如何处理这种专门为调试而设计的\
  \ Internet 协议：ICMP。\n\nICMP 是用于在主机和网关之间发送和接收 `control messages`（控制消息）的协议，主要向发送者提供有关通往目标主机途中任何异常或困难状况的反馈。\n\
  \n存在大量的 ICMP 流量，这些通常在你浏览网页、读取邮件或传输文件时在后台发生。路由器（记住，你正在构建一个）使用 ICMP 来协商数据包大小和其他传输参数，这个过程通常被称为\
  \ `path MTU discovery`（路径 MTU 发现）。\n\n你可能听过管理员将 ICMP 称为“邪恶的”，或者，如果他们的理解得更深一点，则称其“必要的邪恶”。这种态度的原因完全是历史性的。几年前，人们发现几个操作系统的网络栈包含某种代码，如果发送足够大的\
  \ ICMP 请求，就会导致机器崩溃。\n\n受此影响严重的公司之一是微软，你可以通过你喜喜欢的搜索引擎找到大量关于 `ping of death`（死亡之 ping）漏洞的资料。然而，这一切都发生在\
  \ 1990 年代的下半叶，从以后，所有现代操作系统都彻底清理了它们的网络代码（至少，我们被引导认为是这样）。\n\n早期的变通方法之一是简单的阻塞 ICMP\
  \ 回显（ping）请求，甚至是所有的 ICMP 流量。这种措施几乎肯定导致了性能下降和难以调试的网络问题。但在某些地方，这些规则集已经存在了近二十年，而放置它们的人仍然感到害怕。现在可能几乎完全没有理由担心破坏性的\
  \ ICMP 流量了，但在这里我们将查看如何管理 ICMP 流量。\n\n在现代 IPv6 网络中，`icmp6` 协议在参数传递甚至主机配置中起着比以往任何时候都重要的作用，网络管理员在学习拦截或通过\
  \ `icmp6` 流量时进行着高风险的游戏。在很大程度上，适用于 IPv4 ICMP 的问题通常适用于 IPv6，但此外，ICMP 还用于某些在 IPv4 中处理不同的机制。\n\
  \n### 我们允许全部通过吗？\n\n明显的问题变成了：“如果 ICMP 如此良好且有用，我们难道不应该让它一直通过吗？”答案是取决于。\n\n让诊断流量通过确实让调试更容易，但也让其他人相对容易获取有关你网络的信息。因此，如果你想隐藏网络的内部运行机制，如下规则可能并非最优：\n\
  \n```\npass inet proto icmp\n```\n\n如果你希望 IPv6 流量也有同样的自由流动，相应的规则是：\n\n```\npass\
  \ inet6 proto icmp6\n```\n\n公平地说，还应该提到你可能会发现某些 ICMP 和 ICMP6 流量可以安全地附在你的 `keep state`\
  \ 规则上。\n\n### 简单的出口：到此为止\n\n最简单的解决方案可能是允许来自本地网络的所有 ICMP 和 ICMP6 流量通过，并让来自其他的探测在网关处停止：\n\
  \n```\npass inet proto icmp icmp-type $icmp_types from $localnet\npass inet6 proto\
  \ icmp6 icmp6-type $icmp6_types from $localnet\npass inet proto icmp icmp-type $icmp_types\
  \ to $ext_if\npass inet6 proto icmp6 icmp6-type $icmp6_types to $ext_if\n```\n\n\
  这当然是假设你已经确定了理想的 ICMP 和 ICMP6 类型列表以填充你的宏定义。我们很快就会回到这些内容。在网关处停止探测可能是一个吸引力的选择，但让我们看看其他一些可以展示\
  \ PF 灵活性的选项。\n\n### 让 ping 通过\n\n\n\n\n我们在本章中到目前为止开发的规则集有一个明显的缺点：常见的故障排除命令，例如 `ping`\
  \ 和 `traceroute`（以及它们对应的 IPv6 等效命令 `ping6` 和 `traceroute6`）将无法工作。这对你的用户来说可能并不重要，而且正是因为最初\
  \ `ping` 命令让人们害怕过滤或阻塞 ICMP 流量，所以显然有些人认为觉得没有它反而更好。然而，你会发现这些故障排除工具是很有用的。只要对规则集进行一些小小的补充，你就可以使用它们了。\n\
  \n诊断命令 `ping` 和 `ping6` 依赖于 ICMP 和 ICMP6 的 `echo request`（以及匹配的 `echo reply`）类型，为了保持规则集的整洁，我们首先开始定义另一组宏：\n\
  \n```\nicmp_types = \"echoreq\"\nicmp6_types = \"echoreq\"\n```\n\n然后，我们添加使用这些定义的规则：\n\
  \n```\npass inet proto icmp icmp-type $icmp_types\npass inet6 proto icmp6 icmp6-type\
  \ $icmp6_types\n```\n\n这些宏和规则意味着类型为 `echo request` 的 ICMP 和 ICMP6 包将被允许通过，由于 PF\
  \ 的状态化特性，匹配的 `echo replies` 将允许放回。这就是 `ping` 和 `ping6` 命令产生预期结果所需的全部内容。\n\n如果你需要更多或其他类型的\
  \ ICMP 或 ICMP6 包通过，你可以扩展 `icmp_types` 和 `icmp6_types`，将其扩展为你想要允许的包类型列表。\n\n### 帮助\
  \ traceroute\n\n当你的用户声称互联网无法使用时，`traceroute` 命令（以及 IPv6 变体 `traceroute6`）非常有用。默认情况下，Unix\
  \ `traceroute` 根据基于目的地的公式使用 UDP 连接。以下规则适用于我用过的所有 Unix Unix（包括 GNU/Linux）上的 `traceroute`\
  \ 和 `traceroute6` 命令：\n\n```\n## 允许 traceroute(8) 的默认范围输出:\n### \"base+nhops*nqueries-1\"\
  \ (33434+64*3-1)\npass out on egress inet proto udp to port 33433:33626 # 用于 IPv4\n\
  pass out on egress inet6 proto udp to port 33433:33626 # 用于 IPv6\n```\n\n这还让你初步了解了端口范围的样式。它们在某些语境下非常有用。\n\
  \n到目前为止表明，其他操作系统上的 `traceroute` 和 `traceroute6` 实现方式大致相同。一个显著的例外是 Microsoft Windows。在该平台上，`tracert.exe`\
  \ 程序及其 IPv6 兄弟程序 `tracert6.exe` 使用 ICMP echo requests 实现此目的。因此，如果你想让 Windows traceroutes\
  \ 通过，你只需要第一条规则，就像让 `ping` 通过一样。Unix `traceroute` 程序也可以被指示使用其他协议，如果你使用其 `-I` 命令行选项，它的行为将与微软的程序非常相似。你可以查看\
  \ `traceroute` 的手册页（或者其源代码）来获取所有细节。\n\n此解决方案基于我在 `openbsd-misc` 帖子中找到的一个示例规则。我发现该列表以及可搜索的列表存档（可以通过\
  \ `http://marc.info/` 等地方访问），每当你需要与 OpenBSD 或 PF 相关的信息时，都是非常宝贵的资源。\n\n### 路径 MTU\
  \ 发现\n\n在故障排除方面，我要最后提醒你的一点是路径 MTU 发现。互联网协议的设计是与设备无关的，设备无关性的后果之一是，你无法总是可靠地预测给定连接的最佳数据包大小。数据包大小的主要限制被称为“最大传输单元”，或\
  \ `MTU`，它设置了接口数据包大小的上限。`ifconfig` 命令将向你显示网络接口的 MTU。\n\n现代 TCP/IP 实现预计能够通过一个过程确定连接的正确包大小，该过程仅涉及在本地链路的\
  \ MTU 范围内通过设置“不分片”标记来发送不同大小的数据包。如果数据包在通往目的地的某处超过了 MTU，则 MTU 较低的主机将返回一个 ICMP 包，指示“type\
  \ 3, code 4”，并在达到本地上限时引用的其本地 MTU。现在，你不需要立即查阅 RFC。类型 3 意味着 `destination unreachable`（目标不可达），代码\
  \ 4 是 `fragmentation needed, but the “do not fragment” flag is set` 的缩写。因此，如果你到其他网络（其\
  \ MTU 可能与你的不同）的连接看起来不是最优的，你可以尝试稍微修改你的 ICMP 类型列表，以允许 IPv4 目标不可达包通过：\n\n```\nicmp_types\
  \ = \"{ echoreq, unreach }\"\n```\n\n如你所见，这意味着不需要更改 `pass` 规则本身：\n\n```\npass inet\
  \ proto icmp icmp-type $icmp_types\n```\n\n现在我告诉你一个小秘密：在几乎所有情况下，这些规则对于路径 MTU 发现的目的并不是必要的（但它们也没有坏处）。然而，尽管\
  \ PF 的默认 `keep state` 行为处理了你所需的大部分 ICMP 流量，PF 确实允许你对所有变体的 ICMP 类型进行过滤。\n\n### 表格让你的生活更轻松\n\
  \n到这里，你可能认为这种设置变得非常死板和僵化。毕竟，在特定时刻会有某些与过滤和重定向相关的数据，但它们并不值得放在配置文件！确实如此，PF 提供了处理这些情况的机制。\n\
  \n表格就是这样一种功能。它们作为 IP 地址列表非常有用，可以在无需重新加载规则集的情况下进行操作，并在需要快速查找的情况下。\n\n表名始终包含在 `<>`\
  \ 中，例如：\n\n```\ntable <clients> persist { 192.168.2.0/24, !192.168.2.5 }\n```\n\n\
  在这里，网络 `192.168.2.0/24` 是表的一部分，但有一个例外：地址 `192.168.2.5` 使用 `!` 运算符（逻辑非）排除。`persist`\
  \ 关键字确保即使没有规则引用它，表本身也会存在。\n\n也可以从文件加载表格，每个项目单独占一行，例如 `/etc/clients` 文件：\n\n```\n\
  192.168.2.0/24\n!192.168.2.5\n```\n\n反过来，这用于在 `/etc/pf.conf` 中初始化表：\n\n```\ntable\
  \ <clients> persist file \"/etc/clients\"\n```\n\n例如，你可以将我们早期的规则之一改为如下，以管理来自客户端计算机的出站流量：\n\
  \n```\npass inet proto tcp from <clients> to any port $client_out\n```\n\n掌握此方法，你可以实时操作表的内容，如下：\n\
  \n```\n$ sudo pfctl -t clients -T add 192.168.1/16\n```\n\n\n\n\n请注意，这仅更改内存中的表副本，这意味着除非你安排了存储更改，否则这些更改在掉电或重启后将丢失。\n\
  \n你可能会选择通过 `cron` 任务来维护磁盘上的表副本，该任务会定期将表内容转储到磁盘，可以使用如下命令：\n\n```\n$ sudo pfctl -t\
  \ clients -T show >/etc/clients\n```\n\n或者，你可以编辑 `/etc/clients` 文件，并用文件数据替换内存中的表内容：\n\
  \n```\n$ sudo pfctl -t clients -T replace -f /etc/clients\n```\n\n对于你将要频繁执行的操作，早晚你会发现自己最终会编写\
  \ shell 脚本。在不久的将来，对表进行例行操作（例如插入或删除项目或替换表内容）可能会成为你日常维护脚本的一部分。\n\n一个常见的例子是通过通过 `cron`\
  \ 任务强制执行网络访问限制，这些任务会在特定时间替换 `pass` 规则中被作为 `from` 地址引用的表内容。在某些网络中，你可能甚至为不同的日期设置不同的访问规则。真正的限制在于你自己的需求和创造力。\n\
  \n在接下来的章节中，我们将再次回到表的某些方便用法，并查看一些以有用方式与表交互的程序。\n\n引用 [`www.kame.net/`](http://www.kame.net/)\
  \ 项目主页的话：“KAME 项目是日本六家公司共同努力的旨在为 BSD 变体提供免费的 IPv6、IPsec 和移动 IPv6 栈。”主要的研发活动已于 2006\
  \ 年 3 月完成，由于重要部分已整合到相关系统中，现在仅剩维护活动。\n\n描述 ICMP 及某些相关技术的主要 RFC 有 792、950、1191、1256、2521\
  \ 和 6145。针对 IPv6 的 ICMP 更新在 RFC 3542 和 RFC 4443 中。这些文档可以在网上多个地方找到，例如 [`www.ietf.org/`](http://www.ietf.org/)\
  \ 和 [`www.faqs.org/`](http://www.faqs.org/)，可能也可以通过你的包管理器获取。\n\n## 第 4 章：轻松上手无线网络\n\
  \n![Wireless Networks Made Easy](img/6atomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n有一种说法非常有吸引：在 BSD 上——特别是 OpenBSD 上——根本不需要“让无线网络变得简单”，因为它已经很简单了。让无线网络运行起来与让有线网络运行起来没有太大区别，但由于我们处理的是无线电波而不是电线，会出现一些问题。在进入创建可用设置的实际步骤之前，我们将简要查看一些问题。\n\
  \n一旦我们涵盖了让无线网络运行起来的基础知识，我们将转向一些让你的无线网络更有趣且更难破解的选项。\n\n## IEEE 802.11 简介\n\n原则上讲，设置任何网络接口都是两步过程：你首先建立链路，然后配置接口以处理\
  \ TCP/IP 流量。\n\n对于有线以太网类型的接口，建立链路通常包括插入电缆并看到链路指示灯亮。然而，某些接口需要额外的步骤。例如，通过拨号连接进行网络连接需要电话步骤，如拨打号码以获取载波信号。\n\
  \n对于 IEEE 802.11 类型的无线网络，获取载波信号在底层涉及相当许多步骤。首先，你需要在分配的频谱范围内选择正确的信道。一旦找到信号，你就需要设置几个链路级网络标识参数。最后，如果你想要连接的站点使用某种形式的链路级加密，你需要设置正确的类型并可能还需要协商一些额外的参数。\n\
  \n幸运的是，在 OpenBSD 系统上，所有无线网络设备的配置都是通过 `ifconfig` 命令和选项完成的，与其他任何网络接口一样。虽然大多数网络配置在其他\
  \ BSD 上也通过 `ifconfig` 完成，但在某些系统上，特定功能需要其他配置。尽管如此，由于我们在这里引入了无线网络，我们需要从这个新视角来看网络协议栈中各个层面的安全问题。\n\
  \n基本上有三种流行且简单的 IEEE 802.11 隐私机制，我们将在接下来的章节中简要讨论它们。\n\n### 注意事项\n\n要获得有关无线网络安全问题的更完整概述，请参阅\
  \ Kjell Jørgen Hole 教授位于 [`www.kjhole.com/`](http://www.kjhole.com/) 和 [`www.nowires.org/`](http://www.nowires.org/)\
  \ 的文章和幻灯片。\n\n### MAC 地址过滤\n\n关于 PF 和 MAC 地址过滤的简短版本是：我们不使用它。许多消费级现成无线接入点提供 MAC 地址过滤，但与通常认知相反，它们并没有真正增加多少安全性。营销之所以成功，在很大程度上是因为大多数消费者并不知道今天基本上可以更改任何无线适配器的\
  \ MAC 地址。\n\n### 注意事项\n\n如果你真的想尝试 MAC 地址过滤，可以研究在 OpenBSD 4.7 及更高版本中使用 `bridge(4)`\
  \ 设施设施以及 `ifconfig(8)` 中与桥接相关的规则选项。我们将在第 5 章 中查看桥接以及使用它们进行数据过滤的一些更有有用的方法。注意，你可以通过向桥接添加一个接口，在不真正运行桥接的情况下使用桥接过滤。\n\
  \n### WEP\n\n使用无线电波而非电线传输数据的一个后果是，外部人员更容易捕获通过无线波传输的数据。802.11 系列无线网络标准的设计者似乎意识到了这一事实，他们提出了一种解决方案，并以“线等等隐私”（WEP）之名上市。\n\
  \n遗憾的是，WEP 设计者在没有实际阅读最新研究或咨询领域活跃研究人员的情况下就想出了他们的线等加密方案。因此，他们推荐的链路级加密方案在密码专业人士看来是非常原始的自制产物。当第一批产品发布几个月后，WEP\
  \ 加密被逆向工程并破解，这并不令人意外。\n\n尽管你可以在几分钟内下载免费工具解密 WEP 编码流量，但由于各种原因，WEP 仍然被广泛支持和使用。基本上，今天市面上所有的\
  \ IEEE 802.11 设备都支持 WEP，而且数量大量的设备还提供地址过滤。\n\n### WPA\n\n802.11 设计者很快意识到他们的 WEP 系统并不如宣传的那样好，因此他们提出了一种改进的且稍微全面的解决方案，称为“Wi-Fi\
  \ 保护访问”（WPA）。\n\n\n\n\n\nWPA 在纸面上看起来比 WEP 更好，但其规范足够复杂，导致其广泛实现被推迟。此外，WPA 在设计问题和 Bug\
  \ 方面也面临不少批评，这些问题导致了偶尔的互操作性故障。结合获取文档和硬件访问的常见问题，自由软件的支持程度各不相同。大多数自由系统都支持 WPA，尽管你可能发现它并不适用于所有设备，但随着时间的推移，情况正在不断改善。如果你的项目规范包含\
  \ WPA，请仔细查看你的操作系统和驱动程序文档。\n\n当然，不言而喻的是，你还需要进一步的安全措施，例如 `SSH` 或 `SSL` 加密，以保持数据流具有任何水平的机密性。\n\
  \n### 任务所需的正确硬件\n\n选择合适的硬件并不一定是一项艰的任务。在 BSD 系统上，你只需要输入以下简单的命令，即可列出所有主题中包含 `wireless`\
  \ 单词的手册页。\n\n```\n$ apropos wireless\n```\n\n即使在新安装的系统上，此命令也会为你提供操作系统中所有可用无线网络驱动程序的完整列表。\n\
  \n下一步是阅读驱动程序手册页，并将兼容设备列表与你所考虑的系统中可部件或内置设备进行比较。花些时间思考你的具体需求。为了测试之目的，低端的 `rum` 或 `ural`\
  \ USB 适配器（或较新的 `urtwn` 和 `run`）可以使用，而且非常方便。之后，当你准备构建更持久的基础设施时，你可能想要寻找高端设备，尽管你可能会发现廉价的测试设备性能相当良好。某些无线芯片组需要固件，由于法律原因，这些固件无法在\
  \ OpenBSD 安装介上发布。在大多数情况下，只要有网络连接，`fw_update` 脚本将在成功安装后的首次启动时获取所需的固件。如果你在已经配置好的系统中安装这些单元，可以尝试手动运行\
  \ `fw_update`。你可能还想阅读本书的附录 B 以获取进一步的讨论。\n\n### 设置简单的无线网络\n\n对于我们的第一个无线网络，使用上一章中的基础网关配置作为起点是有意义的。在你的网络设计中，无线网络可能没有直接连接到整个互联网，而是需要某种网关。因此，复用现有的网关设置来实现这个无线接入点是合理的，并在接下来的几段中引入一些细小的修改。毕竟，这样做比从头开始新配置要方便得多。\n\
  \n### 注意事项\n\n我们现在处于基础设施构建模式，并将先接入点。如果你倾向于先查看客户端设置，请参阅“客户端”（The Client Side）。\n\n\
  第一步是确保你有一个支持的网卡，并检查驱动程序是否正确加载并初始化网卡。启动时的系统消息会在控制台上滚动，但它们也被记录在 `/var/run/dmesg.boot`\
  \ 文件中。你可以查看文件本身，或使用 `dmesg` 命令查看这些消息。成功配置 PCI 卡后，你应该看到类似下面的的内容：\n\n```\nral0 at\
  \ pci1 dev 10 function 0 \"Ralink RT2561S\" rev 0x00: apic 2 int 11 (irq\n11), address\
  \ 00:25:9c:72:cf:60\nral0: MAC/BBP RT2561C, RF RT2527\n```\n\n如果你想要配置的接口是热插拔类型（例如\
  \ USB 或 PC Card 设备），你可以通过查看 `/var/log/messages` 文件来查看内核消息——例如，在插入设备之前对该文件运行 `tail\
  \ -f`。\n\n接下来，你需要配置接口：首先启用链路，最后为系统配置 TCP/IP。你可以从命令行执行此操作，如下所示：\n\n```\n$ sudo ifconfig\
  \ ral0 up mediaopt hostap mode 11g chan 1 nwid unwiredbsd nwkey 0x1deadbeef9\n```\n\
  \n此命令同时完成了多项任务。它配置了 `ral0` 接口，通过 `up` 参数启用接口，并指定该接口为带有 `mediaopt hostap` 的无线网络接入点。然后，它显式地将工作模式设置为\
  \ `11g`，通道设置为 `11`。最后，它使用 `nwid` 参数将网络名称设置为 `unwiredbsd`，并将 WEP 密钥 (`nwkey`) 设置为十六进制字符串\
  \ `0x1deadbeef9`。\n\n使用 `ifconfig` 检查命令是否成功配置了接口：\n\n```\n$ ifconfig ral0\nral0:\
  \ flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500\n        lladdr 00:25:9c:72:cf:60\n\
  \        priority: 4\n        groups: wlan\n        media: IEEE802.11 autoselect\
  \ mode 11g hostap\n        status: active\n        ieee80211: nwid unwiredbsd chan\
  \ 1 bssid \n```\n\n\n\n\n\n```\nrum0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ metric 0 mtu 2290\n        ether 00:24:1d:9a:bf:67\n        media: IEEE 802.11\
  \ Wireless Ethernet autoselect mode 11g <hostap>\n        status: running\nwlan0:\
  \ flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> metric 0 mtu 1500\n       \
  \ ether 00:24:1d:9a:bf:67\n        inet 10.50.90.1 netmask 0xffffff00 broadcast\
  \ 10.50.90.255\n        inet6 2001:db8::baad:f00d:1 prefixlen 64\n        media:\
  \ IEEE 802.11 Wireless Ethernet autoselect mode 11g <hostap>\n        status: running\n\
  \        ssid unwiredbsd channel 6 (2437 Mhz 11g) bssid 00:24:1d:9a:bf:67\n    \
  \    country US authmode OPEN privacy ON deftxkey UNDEF wepkey 1:40-bit\n      \
  \  txpower 0 scanvalid 60 protmode CTS dtimperiod 1 -dfs\n```\n\n`status: running`\
  \ 这一行意味着你已经启动并运行，至少在链路层是如此。\n\n### 注意\n\n请务必检查最新的 `ifconfig` man 页面，以查看其他可能更适合你配置的选项。\n\
  \n### 一个 OpenBSD WPA 接入点\n\nWPA 支持是在 OpenBSD 4.4 中引入的，并对大多数无线网络驱动程序进行了扩展，所有的基础 WPA\
  \ 密钥功能已在 OpenBSD 4.9 中合并到 `ifconfig(8)` 中。\n\n### 注意\n\n可能仍然存在不支持 WPA 的无线网络驱动程序，因此在尝试配置网络使用\
  \ WPA 之前，请检查驱动程序的 man 页面查看是否支持 WPA。你可以通过 `security/wpa_supplicant` 包将 802.1*x 密钥管理与外部认证服务器结合，用于“企业”模式，但为了我们的目的，我们将坚持使用简单的预共享密钥设置。\n\
  \n设置带有 WPA 的接入点的程序与我们为 WEP 遵循的步骤非常相似。对于带有预共享密钥（有时称为网络密码）的 WPA 设置，你通常会编写如下的 `hostname.if`\
  \ 文件：\n\n```\nup media autoselect mediaopt hostap mode 11g chan 1 nwid unwiredbsd\
  \ wpakey 0x1deadbeef9\ninet6 alias 2001:db8::baad:f00d:1 64\n```\n\n如果你已经在运行之前描述的\
  \ WEP 设置，请使用以下命令禁用那些设置：\n\n```bash\n$ sudo ifconfig ral0 -nwid -nwkey\n```\n\n然后，使用此命令启用新设置：\n\
  \n```bash\n$ sudo sh /etc/netstart ral0\n```\n\n你可以通过 `ifconfig` 检查接入点是否启动并运行：\n\
  \n```bash\n$ ifconfig ral0\nral0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 00:25:9c:72:cf:60\n        priority: 4\n        groups:\
  \ wlan\n        media: IEEE802.11 autoselect mode 11g hostap\n        status: active\n\
  \        ieee80211: nwid unwiredbsd chan 1 bssid 00:25:9c:72:cf:60 wpapsk <not displayed>\n\
  wpaprotos wpa1,wpa2 wpaakms psk wpaciphers tkip,ccmp wpagroupcipher tkip 100dBm\n\
  \        inet6 fe80::225:9cff:fe72:cf60%ral0 prefixlen 64 scopeid 0x2\n        inet6\
  \ 2001:db8::baad:f00d:1 prefixlen 64\n        inet 10.50.90.1 netmask 0xff000000\
  \ broadcast 10.255.255.255\n```\n\n注意 `status: active` 指示，以及我们没有显式设置的 WPA 选项以其合理的默认值显示。\n\
  \n### 一个 FreeBSD WPA 接入点\n\n从我们之前配置的 WEP 接入点迁移到更安全的 WPA 设置是非常直接的。FreeBSD  WPA 支持以\
  \ `hostapd` 的形式出现（该程序与 OpenBSD 的 `hostapd` 类似但不完全相同）。我们首先编辑 `/etc/start_if.rum0`\
  \ 文件以移除认证信息。编辑后的文件看起来如下：\n\n```\nwlans_rum0=\"wlan0\"\ncreate_args_wlan0=\"wlandev\
  \ rum0 wlanmode hostap\"\nifconfig_wlan0=\"inet 10.50.90.1 netmask 255.255.255.0\
  \ ssid unwiredbsd mode 11g\"\nifconfig_wlan0_ipv6=\"2001:db8::baad:f00d:1 64\"\n\
  ```\n\n接下来，通过以下命令启用新设置，在 `/etc/hostapd.conf` 中添加 WPA 配置：\n\n```\ninterface=wlan0\n\
  ```\n\n最后，在 `rc.conf` 中启用 `hostapd`：\n\n```\nhostapd_enable=\"YES\"\n```\n\n\n\n\
  \n很有可能，你还会想要设置 `dhcpd`，在 IPv4 客户端关联你的接入点后，为它们提供地址和其他相关的网络信息。对于 IPv6 网络，你可能想设置 `rtadvd`（甚至是一个\
  \ DHCP6 守护进程）来帮助你的 IPv6 客户端进行自动配置。如果你阅读了手册（man pages），设置 `dhcpd` 和 `rtadvd` 是非常简单的。\n\
  \n以上就是全部。此配置为你提供了一个功能性的 BSD 接入点，通过 WEP 加密或稍微健壮的 WPA 链路加密提供了至少的令牌安全（实际上更像是一个*禁止进入！*标志）。如果你需要支持\
  \ FTP，请从你在第 3 章中设置的机器上复制 `ftp-proxy` 配置，并进行类似于你对其他规则集部分的修改。\n\n### 具有三个或更多接口的接入点\n\
  \n如果你的网络设计规定接入点也是有线局域网（甚至是几个无线网络）的网关，你需要对规则集进行一些微调。与其只更改 `int_if` 宏的值，你可能想为无线接口添加另一个（描述性的）定义，如下：\n\
  \n```\nair_if = \"ral0\"\n```\n\n你的无线接口可能位于不同的子网上，因此为每个接口设置一个单独的规则来处理任何 IPv4 NAT\
  \ 配置可能会很有用。以下是 OpenBSD 4.7 及更高版本系统的示例：\n\n```\nmatch out on $ext_if from $air_if:network\
  \ nat-to ($ext_if)\n```\n\n这里是 OpenBSD 4.7 之前的 PF 版本的示例：\n\n```\nnat on $ext_if\
  \ from $air_if:network to any -> ($ext_if) static-port\n```\n\n根据你的策略，你可能还想调整 `localnet`\
  \ 定义，或者至少在合适的 `pass` 规则中包含 `$air_if`。再次，如果你需要支持 FTP，可能需要一个单独的 `pass` 规则，通过分流（divert）或重定向将无线网络引导到\
  \ `ftp-proxy`。\n\n### 处理 IPSec 和 VPN 解决方案\n\n你可以使用内置的 IPsec 工具、OpenSSH 或其他工具建立虚拟专用网络（VPN）。然而，由于通常认为无线网络的安全性较差或其他原因，你可能想要设置一些额外的安全性。\n\
  \n这些选项大致分为三类：\n\n* **SSH**。如果你的 VPN 基于 SSH 隧道，那么基础规则集已经包含了你需要的所有过滤。你的隧道流量对数据包过滤器来说与其他\
  \ SSH 流量无异。\n\n* **带有 UDP 密钥交换的 IPsec (IKE/ISAKMP)**。几种 IPsec 变体关键取决于通过 `proto udp\
  \ port 500` 进行密钥交换，并使用 `proto udp port 4500` 进行 NAT 穿越（NAT-T）。你需要允许这些流量通过以建立连接。几乎所有的实现还关键取决于允许\
  \ ESP 协议流量（协议号 50）通过以下规则在主机之间通过：\n\n```\npass proto esp from $source to $target\n\
  ```\n\n* **在 IPsec 封装接口上过滤**。通过正确配置 IPsec 设置，你可以设置 PF 如下：\n\n```\npass on enc0 proto\
  \ ipencap from $source to $target keep state (if-bound)\n```\n\n参见附录 A 关于该主题的一些更有用的文献引用。\n\
  \n### 客户端侧\n\n只要你有 BSD 客户端，设置就极其简单。将 BSD 机器连接到无线网络的步骤与我们刚刚设置无线接入点的步骤非常相似。在 OpenBSD\
  \ 上，配置集中在无线接口的 `hostname.if` 文件。在 FreeBSD 上，配置集中在 `rc.conf`，但取决于你的具体配置，极可能涉及其他几个文件。\n\
  \n### OpenBSD 设置\n\n从 OpenBSD 案例开始，为了连接到我们刚刚配置的 WEP 接入点，你的 OpenBSD 客户端需要一个包含以下行的\
  \ `hostname.if`（例如 `/etc/hostname.ral0`）配置文件：\n\n```\nup media autoselect mode 11g\
  \ chan 1 nwid unwiredbsd nwkey 0x1deadbeef9\ndhcp\nrtsol\n```\n\n第一行提供了比通常要求的更详细的链路层参数。只有\
  \ `up` 以及 `nwid` 和 `nwkey` 参数是严格必要的。在几乎所有情况下，驱动程序都会相应的信道和最佳可用模式与接入点关联。第二行要求 DHCP\
  \ 配置，在实践中这会导致系统运行 `dhclient` 命令来获取 TCP/IP 配置信息。最后一行调用 `rtsol(8)` 来启动 IPv6 配置。\n\n\
  如果你选择使用 WPA 配置，文件将如下所示：\n\n```\nup media autoselect mode 11g chan 1 nwid unwiredbsd\
  \ wpakey 0x1deadbeef9\ndhcp\nrtsol\n```\n\n再次，第一行设置了链路层参数，其中关键的是网络选择和 `nwkey`。使用\
  \ `ifconfig` 命令检查 `hostname.if` 文件将显示 `mode` 和参数。如果你想尝试 `/etc/hostname.if` 配置，设置命令如下：\n\
  \n```\n\nup media autoselect mode 11g chan 1 nwid unwiredbsd wpakey 0x1deadbeef9\n\
  ```\n\n\n\n\n`rtsol` 命令通常在执行后不输出任何信息。使用 `ifconfig` 检查接口配置，确认接口是否确实收到了 IPv6 配置。\n\
  \n### FreeBSD 设置\n\n在 FreeBSD 上，你可能需要比在 OpenBSD 上多一些工作。根据你的内核配置，你可能需要将相关的模块加载行添加到\
  \ `/boot/loader.conf`。在我其中一个测试系统中，`/boot/loader.conf` 如下所示：\n\n```\nif_rum_load=\"\
  YES\"\nwlan_scan_ap_load=\"YES\"\nwlan_scan_sta_load=\"YES\"\nwlan_wep_load=\"YES\"\
  \nwlan_ccmp_load=\"YES\"\nwlan_tkip_load=\"YES\"\n```\n\n加载相关模块后，你可以通过执行以下命令加入之前配置的\
  \ WEP 网络：\n\n```bash\n$ sudo ifconfig wlan create wlandev rum0 ssid unwiredbsd wepmode\
  \ on wepkey 0x1deadbeef9 up\n```\n\n然后，执行此命令为接口获取 IPv4 配置：\n\n```bash\n$ sudo dhclient\
  \ wlan0\n```\n\n要初始化接口以支持 IPv6，输入以下内容：\n\n```bash\n$ sudo rtsol ral0\n```\n\n`rtsol`\
  \ 命令通常在执行后不输出任何信息。使用 `ifconfig` 检查接口配置，确认接口是否确实收到了 IPv6 配置。\n\n为了实现更持久的配置，创建一个 `start_if.rum0`\
  \ 文件（如果物理接口名称不同，请将 `rum0` 替换），内容如下：\n\n```\nwlans_rum0=\"wlan0\"\ncreate_args_wlan0=\"\
  wlandev rum0 ssid unwiredbsd wepmode on wepkey 0x1deadbeef9 up\"\nifconfig_wlan0=\"\
  DHCP\"\nifconfig_wlan0_ipv6=\"inet6 accept_rtadv\"\n```\n\n如果你想加入 WPA 网络，你需要设置 `wpa_supplicant`\
  \ 并稍微修改你的网络接口设置。对于 WPA 接入点，请在你的 `start_if.rum0` 文件中使用以下配置连接：\n\n```\nwlans_rum0=\"\
  wlan0\"\ncreate_args_wlan0=\"wlandev rum0\"\nifconfig_wlan0=\"WPA\"\n```\n\n你还需要一个\
  \ `/etc/wpa_supplicant.conf` 文件，包含以下内容：\n\n```\nnetwork={\n  ssid=\"unwiredbsd\"\
  \n  psk=\"0x1deadbeef9\"\n}\n```\n\n最后，在 `rc.conf` 中添加第二行 `ifconfig_wlan0` 配置，以确保\
  \ `dhclient` 正常运行。\n\n```\nifconfig_wlan0=\"DHCP\"\n```\n\n对于 IPv6 配置，在 `rc.conf`\
  \ 中添加以下行：\n\n```\nifconfig_wlan0_ipv6=\"inet6 accept_rtadv\"\n```\n\n其他 WPA 网络可能需要额外的选项。配置成功后，`ifconfig`\
  \ 的输出应该类似于此：\n\n```\nrum0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> metric\
  \ 0 mtu 2290\n        ether 00:24:1d:9a:bf:67\n        media: IEEE 802.11 Wireless\
  \ Ethernet autoselect mode 11g\n        status: associated\nwlan0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ metric 0 mtu 1500\n        ether 00:24:1d:9a:bf:67\n        inet 10.50.90.16 netmask\
  \ 0xffffff00 broadcast 10.50.90.255\n        inet6 2001:db8::baad:f00d:1635 prefixlen\
  \ 64\n        media: IEEE 802.11 Wireless Ethernet OFDM/36Mbps mode 11g\n      \
  \  status: associated\n        ssid unwiredbsd channel 1 (2412 Mhz 11g) bssid 00:25:9c:72:cf:60\n\
  \        country US authmode WPA2/802.11i privacy ON deftxkey UNDEF\n        TKIP\
  \ 2:128-bit txpower 0 bmiss 7 scanvalid 450 bgscan bgscanintvl 300\n        bgscanidle\
  \ 250 roam:rssi 7 roam:rate 5 protmode CTS roaming MANUAL\n```\n\n### 使用 authpf\
  \ 保护你的无线网络\n\n安全专业人员倾向于认为，尽管 WEP 加密提供的保护微乎其微，但它至少足以向潜在攻击者发出信号，表明你并不打算让任何人使用你的网络资源。使用\
  \ WPA 可以显著提高安全性，代价是在需要“企业级”选项的场景中增加一些复杂性。\n\n我们在本章中到为止构建的配置都是功能性的。WEP 和 WPA 配置都允许所有配置得当的无线客户端连接，这本身可能是一个问题，因为该配置没有内置任何真正的支持来让你能够决定谁可以使用你的网络。\n\
  \n如前提到的，MAC 地址过滤并不是针对攻击者的稳固防御手段，因为更改 MAC 地址实在太容易了。Open-BSD 开发者在引入 `authpf` 时，对这个问题采取了截然不同的方法。\n\
  \n### 身份验证网关\n\n使用 `authpf` 设置身份验证网关除了 `pf.conf` 之外，还需要创建几个文件。主要的添加是 `authpf.rules`。\n\
  \n首先，创建一个空的 `/etc/authpf.conf` 文件。该文件对于 `authpf` 的工作是必须的，但它不需要任何内容，因此使用 `touch`\
  \ 命令即可。\n\n以下是 `pf.conf` 的其他部分。首先是接口宏：\n\n```\next_if = \"re0\"\nint_if = \"athn0\"\
  \n```\n\n此外，如果你定义了一个名为 `<authpf_users>` 的表，`authpf` 将用户加入表中：\n\n```\ntable <authpf_users>\
  \ persist\n```\n\n如果你需要 NAT，处理转换的规则可以很容易放在 *authpf.rules* 中，但在这种简单的设置下，放在 `pf.conf`\
  \ 中也没有坏：\n\n```\npass out on $ext_if inet from $localnet nat-to ($ext_if)\n```\n\
  \n这是 OpenBSD 4.7 的语法：\n\n```\nnat on $ext_if inet from $localnet to any -> ($ext_if)\n\
  ```\n\n接下来，我们创建 `authpf` 锚点，用户通过验证后加载来自 *authpf.rules* 的规则：\n\n```\nanchor \"authpf/*\"\
  \n```\n\n对于 OpenBSD 4.7 之前的 `authpf` 版本，需要几个锚点，因此相应的部分如下：\n\n```\nnat-anchor \"\
  authpf/*\"\nrdr-anchor \"authpf/*\"\nbinat-anchor \"authpf/*\"\nanchor \"authpf/*\"\
  \n```\n\n这标志我们完成了 `authpf` 配置中 *pf.conf* 的必要部分。对于过滤部分，我们从默认拦截所有开始，然后添加所需的 `pass`\
  \ 规则。此时唯一的关键项是允许 SSH 流量通过内部网络：\n\n```\npass quick on $int_if proto { tcp, udp }\
  \ to $int_if port ssh\n```\n\n从这里开始，完全取决于你。你是否想让客户端在身份验证之前进行域名解析？如果是这样，也将将 TCP 和\
  \ UDP 服务的 `pass` 规则加入你的 *pf.conf* 文件中。\n\n\n\n\n\n对于一个相对简单且平等的设置，你可以包含我们基础规则集的其余部分，将\
  \ `pass` 规则改为允许来自 `<authpf_users>` 表中地址的流量，而不是来自你本地网络中的任何地址：\n\n```\npass quick\
  \ proto { tcp, udp } from <authpf_users> to port $udp_services\npass proto tcp from\
  \ <authpf_users> to port $client_out\n```\n\n对于更具差异化的设置，你可以将规则集的其余部分放在 `/etc/authpf/authpf.rules`\
  \ 中，或者在 `/etc/authpf/users/` 下的每个用户目录中使用自定义的 `authpf.rules` 文件来存放每个用户的特定规则。如果你的用户通常需要某些保护，你的通用\
  \ `/etc/authpf/authpf.rules` 可以包含如下内容：\n\n```\nclient_out = \"{ ssh, domain, pop3,\
  \ auth, nntp, http, https }\"\nudp_services = \"{ domain, ntp }\"\npass quick proto\
  \ { tcp, udp } from $user_ip to port $udp_services\npass proto tcp from $user_ip\
  \ to port $client_out\n```\n宏 `user_ip` 是 `authpf` 内置的，并扩展为用户身份验证时的 IP 地址。这些规则适用于任何在你的网关完成身份验证的用户。\n\
  \n一个很好且相对容易实现的补充是针对与普通用户群体有不同需求的用户设置特殊情况规则。如果 `/etc/authpf/users/` 下的用户目录中存在 `authpf.rules`\
  \ 文件，则该文件中的规则将为该用户加载。这意味着你那个朴实的用户 Peter 只需要浏览网页并访问运行在特定机器高端口上的服务，他可以通过如下的 `/etc/authpf/users/peter/authpf.rules`\
  \ 文件获得他所需的权限：\n\n```\nclient_out = \"{ domain, http, https }\"\npass inet from $user_ip\
  \ to 192.168.103.84 port 9000\npass quick inet proto { tcp, udp } from $user_ip\
  \ to port $client_out\n```\n\n另一方面，Peter 的同事 Christina 运行 OpenBSD，并且通常很自己在做什么，即使她有时会产生进出奇特端口的流量。你可以通过将以下内容放入\
  \ `/etc/authpf/users/christina/authpf.rules` 来让她自由发挥：\n\n```\npass from $user_ip\
  \ os = \"OpenBSD\" to any\n```\n这意味着只要 Christina 从她的 OpenBSD 机器进行身份验证，她就可以在 TCP/IP\
  \ 上做她想做的任何事情。\n\n### 完全开放但实际上关闭\n\n在某些环境中，将网络设置为在链路层上开放且不加密是有意义的，同时通过 `authpf` 执行某些限制。下一个示例与你在机场或其他公共场所遇到的\
  \ Wi-Fi 区域非常相似，在那里任何人都可以连接访问点并获取 IP 地址，但任何访问 Web 的尝试都将被重定向到一个特定的网页，直到用户通过了某种身份验证。\n\
  \n此 `pf.conf` 文件同样构建在我们基础版本之上，对基础 `authpf` 设置增加了两个重要的部分——一个宏和一个重定向：\n\n```\next_if\
  \ = \"re0\"\nint_if = \"ath0\"\nauth_web=\"192.168.27.20\"\ndhcp_services = \"{\
  \ bootps, bootpc }\" # DHCP server + client\ntable <authpf_users> persist\npass\
  \ in quick on $int_if proto tcp from ! <authpf_users> to port http rdr-to $auth_web\n\
  match out on $ext_if from $int_if:network nat-to ($ext_if)\nanchor \"authpf/*\"\n\
  block all\npass quick on $int_if inet proto { tcp, udp } to $int_if port $dhcp_services\n\
  pass quick inet proto { tcp, udp } from $int_if:network to any port domain\npass\
  \ quick on $int_if inet proto { tcp, udp } to $int_if port ssh\n对于较旧的 authpf 版本，请使用此文件：\n\
  ext_if = \"re0\"\nint_if = \"ath0\"\nauth_web=\"192.168.27.20\"\ndhcp_services =\
  \ \"{ bootps, bootpc }\" # DHCP server + client\ntable <authpf_users> persist\n\
  rdr pass on $int_if proto tcp from ! <authpf_users> to any port http -> $auth_web\n\
  nat on $ext_if from $localnet to any -> ($ext_if)\nnat-anchor \"authpf/*\"\nrdr-anchor\
  \ \"authpf/*\"\nbinat-anchor \"authpf/*\"\nanchor \"authpf/*\"\nblock all\npass\
  \ quick on $int_if inet proto { tcp, udp } to $int_if port $dhcp_services\npass\
  \ quick inet proto { tcp, udp } from $int_if:network to port domain\npass quick\
  \ on $int_if inet proto { tcp, udp } to $int_if port ssh\n```\n\n`auth_web` 宏和重定向确保了所有来自\
  \ `<authpf_users>` 表之外地址的 Web 流量都会将未身份验证的用户引导至一个特定地址。在该地址上，你设置了一个 Web 服务器来提供你需要的任何内容。这可以从一个包含如何联系谁以获取网络权限的单页面，到一个接受信用卡并处理用户创建的系统。\n\
  \n\n\n\n在网络基础参数就绪后，我们可以开始为需要处理的服务设置一套合理的规则集。我们再次从基准规则集开始，并添加一些宏以提高可读性。\n\n我们需要的宏自然而然地源于规范：\n\
  \n*   Web 服务器：\n    ```\n    webserver = \"{ 192.0.2.227, 2001:db8::baad:f00d:f17\
  \ }\"\n    ```\n\n*   Web 服务器服务：\n    ```\n    webports = \"{ http, https }\"\n\
  \    ```\n\n*   邮件服务器：\n    ```\n    emailserver = \"{ 192.0.2.225, 2001:db8::baad:f00d:f117\
  \ }\"\n    ```\n\n![内部带有服务器和客户端的基础网络](img/httpatomoreillycomsourcenostarchimages2127153.png.jpg)图\
  \ 5-1。内部带有服务器和客户端的基础网络\n\n*   邮件服务器服务：\n    ```\n    email = \"{ smtp, pop3, imap,\
  \ imap3, imaps, pop3s }\"\n    ```\n\n*   DNS 服务器：\n    ```\n    nameservers = \"\
  { 192.0.2.221, 192.0.2.223 , \\\n                          2001:db8::baad:f00d:fbaa,\
  \ 2001:db8::baad:f00d:ff00 }\"\n    ```\n\n### 注意事项\n\n此时，你可能已经注意到，我们服务器的 IPv4 和\
  \ IPv6 地址都位于各自地址范围内非常较近的位置。有些观点认为，在 IPv6 的情况下，如果你的总分配允许，每个接口都应该分配至少 `/64` 范围。另一些人则主张更保守的分配。IETF\
  \ 关于此问题的当前最佳实践文档是 `RFC6177`，可以在 IETF 网站（[`www.ietf.org`](http://www.ietf.org)）获取。\n\
  \n我们假设文件服务器不需要外部世界访问，除非我们选择将其配置为需要在本地网络外部可见的服务，例如我们域名的权威从用 DNS 服务器。这时，有了这些宏，我们添加\
  \ `pass` 规则。从 Web 服务器开始，我们通过以下规则使其对世界开放：\n\n```\npass proto tcp to $webserver port\
  \ $webports\n```\n\n### Synproxy 值得费精力吗？\n\n多年来，`synproxy state` 选项受到了广泛关注，作为防御外部恶意流量的可能堡垒。具体来说，`synproxy\
  \ state` 选项旨在防止可能导致后端资源耗尽的 SYN 泛洪攻击。\n\n它的工作原理是：当建立一个新连接时，PF 通常让通信双方自己处理连接建立，如果数据包匹配\
  \ `pass` 规则，则直接转发数据包。启用 `synproxy` 后，PF 会处理初始连接建立，仅在连接正确建立后才将连接交给通信双方，这本质上是在通信双方之间创建了一个缓冲区。SYN\
  \ 代理的开销比默认的 `keep state` 略大，但在规模合理的设备上并不一定明显。\n\n潜在的缺点在负载均衡设置中变得显而易见，在这种设置中，开启 SYN\
  \ 代理的 PF 可能会接受后端尚未准备好接受的连接，在某些情况下，它会通过与负载均衡逻辑未选择的其他主机建立连接，从而短路冗余性。这里的经典示例是带有轮询 DNS\
  \ 的 HTTP 服务器池。但在像 SMTP 这样的协议中，问题变得尤为明显，在协议中内置的冗余机制规定（至少按照惯例——实际的 RFC 有些模糊），如果主邮件交换器不接受连接，你应该尝试备用服务器。\n\
  \n在考虑使用 `synproxy` 似乎很有吸引力的设置时，请记住这些问题，并分析在配置中加入 `synproxy` 对你的设置带来的潜在影响。如果你认为需要\
  \ SYN 代理，只需在需要该选项的规则末尾加上 `synproxy state` 即可。经验法是，如果你正遭受活跃攻击，插入 `synproxy` 选项可能作为临时措施很有用。在正常情况下，它不需要作为配置的永久部分。\n\
  \n与此类似，我们允许外部访问邮件服务器：\n\n```\npass proto tcp to $emailserver port $email\n```\n\n\
  这让任何地方的客户端与本地网络中的客户端具有相同的访问权限，包括可能在没有加密的情况下运行的邮件检索协议。这在现实世界中常见，但如果你正在建立新网络，你可能想考虑其他选项。\n\
  \n为了让邮件服务器有用，它还需要能够向本地网络之外的主发送邮件：\n\n```\npass log proto tcp from $emailserver to\
  \ port smtp\n```\n\n请记住，规则集从 `block all` 规则开始，这意味着只允许邮件服务器从本地网络向世界其他地方发起 SMTP 。如果网络上的任何其他主机需要向外部世界发送或接收电子邮件，它们需要使用指定的邮件服务器。这可能是一个好方法，例如可以确保你的网络中可能出现的任何垃圾邮件僵尸机器尽可能无法发送其载荷。\n\
  \n最后，DNS 服务器需要允许我们网络外的查询 `example.com` 以及任何其他我们提供权威回答的域名的客户端访问：\n\n```\npass proto\
  \ { tcp, udp } to $nameservers port domain\n```\n\n整合所有需要从外部访问的服务后，我们的规则集大致如下：\n\
  \n```\next_if = \"ep0\" # 外部接口宏 - PPPoE 使用 tun0 或 pppoe0\nint_if = \"ep1\" # 内部接口宏\n\
  localnet = $int_if:network\nwebserver = \"{ 192.0.2.227, 2001:db8::baad:f00d:f17\
  \ }\"\nwebports = \"{ http, https }\"\nemailserver = \"{ 192.0.2.225, 2001:db8::baad:f00d:f117\
  \ }\"\nemail = \"{ smtp, pop3, imap, imap3, imaps, pop3s }\"\nnameservers = \"{\
  \ 192.0.2.221, 192.0.2.223 , \\\n                          2001:db8::baad:f00d:fbaa,\
  \ 2001:db8::baad:f00d:ff00 }\"\n```\n\n\n\n\n\n实现物理和逻辑隔离相当容易：只需将运行公共服务的机器移动到连接到网关独立接口的独立网络中。其最终效果是获得了一个独立的网络，它不完全属于你的本地网络，但也不完全位于互联网的公共部分。从概念上讲，该隔离网络如图\
  \ 5-2 所示。\n\n![A network with the servers in a DMZ](img/httpatomoreillycomsourcenostarchimages2127155.png.jpg)图\
  \ 5-2. 包含服务器的 DMZ 网络\n\n### 注意\n\n将这个小网络想象成敌对势力领土之间的一个相对平静区域。几年前，有人发明了 `demilitarized\
  \ zone (DMZ)`（非军事化区）这一术来描述这种配置并不意外。\n\n对于地址分配，你可以从你的官方地址空间中划分出一块大小合适的区域供新的 DMZ 网络使用。或者，你也可以将网络中不需要运行具有公共访问且可路由\
  \ IPv4 地址的部分移动到 NAT 环境中。无论哪种方式，你最终在过滤配置中至少多了一个接口。正如你后面将看到的，如果你真的非常缺官方 IPv4 地址，在全\
  \ NAT 环境下运行 DMZ 设置也是可以的。\n\n对规则集本身的调整不需要非常广泛。如有必要，你可以更改每个接口的配置。基本的规则逻辑保持不变，但你可能需要调整宏（`webserver`、`mailserver`、`nameservers`\
  \ 以及可能的其他宏）的定义以反映你的新网络布局。\n\n在我们的示例中，我们可以选择划分已经放置服务器的地址范围部分。如果我们为增长留出空间，可以为新的 `dmz_if`\
  \ 设置 IPv4 范围为 `/25` 子网，网络地址和子网掩码为 `192.0.2.128/255.255.255.128`。这为我们留下了 `192.0.2.129`\
  \ 到 `192.0.2.254` 作为 DMZ 主机的可用地址范围。由于我们已经将服务器放置在 `2001:db8::baad:f00d:0/112` 网络中（只有\
  \ 65,536 个地址可用），对于 IPv6 范围最简单的方法是也划分该网络，并为面向网络的接口分配一个适当的 IPv6 地址，如图 5-2 所示。\n\n\
  有了这种配置，并且在分配给服务器的 IP 地址不发生变化的情况下，在建立物理隔离的 DMZ 后，你实际上不需要触碰规则集即可让数据包过滤生效。这是一个不错的副作用，可能是因为懒惰，也可能是因为优秀的远期规划。无论何种情况，这都强调了建立合理的地址分配策略的重要性。\n\
  \n通过编辑你的 `pass` 规则来收紧规则集可能会有用，使得访问服务器的流量仅在与服务实际相关的接口上通过：\n\n```\npass in on $ext_if\
  \ proto { tcp, udp } to $nameservers port domain\npass in on $int_if proto { tcp,\
  \ udp } from $localnet to $nameservers \\\n     port domain\npass out on $dmz_if\
  \ proto { tcp, udp } to $nameservers port domain\npass in on $ext_if proto tcp to\
  \ $webserver port $webports\npass in on $int_if proto tcp from $localnet to $webserver\
  \ port $webports\npass out on $dmz_if proto tcp to $webserver port $webports\npass\
  \ in log on $ext_if proto tcp to $mailserver port smtp\npass in log on $int_if proto\
  \ tcp from $localnet to $mailserver \\\n     port $email\npass out log on $dmz_if\
  \ proto tcp to $mailserver port smtp\npass in on $dmz_if from $mailserver to port\
  \ smtp\npass out log on $ext_if proto tcp from $mailserver to port smtp\n```\n\n\
  你可以选择让其他引用本地网络接口的 `pass` 规则也具有特定性，但如果你保持它们不变，它们将继续工作。\n\n### 分担负载：重定向到地址池\n\n一旦你设置了供全世界访问的服务，一种可能的情况是随着时间的推移，你的一个或多个服务将变得更加复杂且消耗资源，或者仅仅吸引的流量超过了你认为单台服务器可以承受的范围。\n\
  \n有许多方法可以让多台机器共享运行服务的负载，包括微调服务本身的方法。对于网络级负载均衡，PF 通过通过重定向到表或地址池提供了你所需的基本功能。事实上，如果你的环境尚未实现双栈，你甚至可以在不触碰\
  \ `pass` 规则的情况下实现形式的负载均衡。\n\n以我们示例中的 Web 服务器为例。我们已经有了代表服务的 Web 服务器的宏。由于稍后会显而易见的原因，我们需要为地址池\
  \ `set up` `IPv4 addresses`。首先，定义一个包含地址的 `table`（表）：\n\n```\ntable <webpool> { 192.0.2.130\
  \ 192.0.2.131 192.0.2.132 }\n```\n\n然后，执行重定向：\n\n```\nmatch in on $ext_if proto\
  \ tcp to $webserver port $webports \\\n        rdr-to <webpool> round-robin\n```\n\
  \n在这两种情况下，`round-robin` 意味着 PF 通过顺序遍历池中的机器来分担负载。\n\n某些应用程序期望来自每个源地址的访问始终进入后端的同一台主机（例如，某些服务取决于客户端或会话参数，如果新连接命中不同的后端主机，参数将会丢失）。如果你的配置需要满足此类服务，你可以添加\
  \ `sticky-address` 选项，以确保来自客户端的新连接始终重定向到同一台机器。该选项的缺点是 PF 需要为每个客户端维护源跟踪数据，且跟踪源节点的最大值设置为\
  \ `10,000`，这可能会成为限制因素。（有关调整此类及类似限制值的建议，请参第 10 章。）\n\n当即使负载均衡也不是绝对要求时，使用 `random`\
  \ 选择重定向地址可能是合适的：\n\n```\nmatch in on $ext_if proto tcp to $webserver port $webports\
  \ \\\n        rdr-to <webpool> random\n```\n\n### 注意\n\n在 OpenBSD 4.7 之前的 PF 版本中，重定向到表或地址列表时不支持\
  \ `random` 选项。\n\n\n\n\n\n即使是拥有大量官方可路由 IPv4 地址的组织，也选择在它们负载均衡的服务器池与整个互联网之间引入 `NAT`。这种技术在各种基于\
  \ `NAT` 的环境中效果同样良好，但迁移到 `NAT` 会提供一些额外的可能性并带来挑战。\n\n为了以这种方式适应 IPv4 和 IPv6 双栈环境，您需要为地址池设置单独的表，并为\
  \ IPv4 和 IPv6 设置带有重定向的独立 `pass` 或 `match` 规则。将 IPv4 和 IPv6 地址放在同一个表中起初听起来可能是一个很优雅的想法，但这里概述的简单重定向规则并不足够智能，无法根据单个表条目的地址族类型做出正确的重定向决策。\n\
  \n### 使用 relayd 正确实现负载均衡\n\n在通过轮询（round-robin）重定向进行负载均衡运行一段时间后，您可能会发现重定向不会自动适应外部状况。例如，除非采取特殊措施，否则如果定向目标列表中的主机宕机，流量仍然会被重定向到可能列表中的\
  \ IP 地址。\n\n显然，需要一个监控解决方案。幸运的是，OpenBSD 基础系统提供了一个。中继进程 `relayd` 与您的 `PF` 配置交互，提供了从池中剔除无法工作主机的能力。然而，在您的设置中引入\
  \ `relayd` 可能需要对规则集进行一些微调。\n\n`relayd` 进程基于两类主要的服务工作，将其称为 `redirects`（重定向）和 `relays`（中继）。它期望能够向其控制的\
  \ `PF` 表添加或删除主机的 IP 地址。该进程通过一个名为 `relayd` 的专用锚点（anchor）与您的规则集交互（在 OpenBSD 4.7 之前的版本中还有一个同名的重定向锚点\
  \ `rdr-anchor`）。\n\n为了查看如何通过使用 `relayd` 让我们的示例配置运行得更好，我们将回顾负载均衡规则集。从 `pf.conf`文件的顶部开始，添加\
  \ `relayd` 锚点以根据需要插入规则：\n\n```\nanchor \"relayd/*\"\n```\n\n在 OpenBSD 4.7 之前的版本中，您还需要重定向锚点：\n\
  \n```\nrdr-anchor \"relayd/*\" anchor \"relayd/*\"\n```\n\n在负载均衡规则集中，我们对 Web 服务器池有如下定义：\n\
  \n```\ntable webpool persist { 192.0.2.214, 192.0.2.215, 192.0.2.216, 192.0.2.217\
  \ }\n```\n\n它包含此 `match` 规则来设置重定向：\n\n```\nmatch in on $ext_if proto tcp to $webserver\
  \ port $webports \\\n         rdr-to <webpool> round-robin\n```\n\n或者在 OpenBSD 4.7\
  \ 之前的版本中，您将使用：\n\n```\nrdr on $ext_if proto tcp to $webserver port $webports ->\
  \ <webpool> round-robin\n```\n\n为了让此配置运行得稍微更好，我们移除重定向和表（记住在双栈配置中处理两组），并让 `relayd`\
  \ 通过在锚点内部设置自己的版本来处理重定向或多次重定向。（但不要删除 `pass` 规则，因为您的规则集仍然需要一个 `pass` 规则允许流量流向 `relayd`\
  \ 表中的 IP 地址。如果您为 `inet` 和 `inet6` 流量编写了单独的规则，您可能可以将这些规则合并回一个。）一旦处理好 `pf.conf` 的部分，我们就转向\
  \ `relayd` 自己的 `relayd.conf` 配置文件。该配置文件的语法与 `pf.conf` 非常相似，易于阅读和理解。首先，我们添加稍后将使用的宏定义：\n\
  \n```\nweb1=\"192.0.2.214\"\nweb2=\"192.0.2.215\"\nweb3=\"192.0.2.216\"\nweb4=\"\
  192.0.2.217\"\nwebserver=\"192.0.2.227\"\nsorry_server=\"192.0.2.200\"\n```\n\n\
  所有这些都对应于我们可以放在 `pf.conf` 文件中的定义。`relayd` 的默认检查间隔为 10 秒，这意味着主机在宕机近 10 秒钟后才会被离线。为了保险起见，我们将通过以下行将检查间隔设置为\
  \ 5 秒，以尽可能减少可见的停机时间：\n\n```\ninterval 5 # check hosts every 5 seconds\n```\n\n现在，我们创建一个使用了大部分宏的表\
  \ `webpool`：\n\n```\ntable <webpool> { $web1, $web2, $web3, $web4 }\n```\n\n由于稍后将讨论的原因，我们定义了另一个表：\n\
  \n```\ntable <sorry> { $sorry_server }\n```\n\n此时，我们准备好设置重定向了：\n\n```\nredirect\
  \ www {\n       listen on $webserver port 80 sticky-address\n       tag relayd\n\
  \       forward to <webpool> check http \"/status.html\" code 200 timeout 300\n\
  \       forward to <sorry> timeout 300 check icmp\n}\n```\n\n\n\n\n正如我们之前提到的，如果你的\
  \ `rc.conf.local` 文件中 `relayd_flags` 为空，`relayd` 将在启动时启用。然而，一旦启用了配置，你与 `relayd`\
  \ 的大部分交互将通过 `relayctl` 管理程序进行。`relayctl` 不仅能让你监控状态，还能让你重新重载 `relayd` 配置，并选择性地禁用或启用主机、表和服务。你甚至可以如下式交互地查看服务状态：\n\
  \n```\n$ sudo relayctl show summary\nId      Type            Name              \
  \                   Avlblty Status\n1       redirect        www                \
  \                          active\n1       table           webpool:80          \
  \                         active (2 hosts)\n1       host            192.0.2.214\
  \                          100.00% up\n2       host            192.0.2.215     \
  \                     0.00%   down\n3       host            192.0.2.216        \
  \                  100.00% up\n4       host            192.0.2.217             \
  \             0.00%   down\n2       table           sorry:80                   \
  \                  active (1 hosts)\n5       host            127.0.0.1         \
  \                   100.00% up\n```\n\n在这个示例中，`webpool` 性能严重下降，四个主机中仅有两个在线并运行。幸运的是，备份表仍在运行，希望如果最后两台服务器也故障，它仍然能够在线。目前，所有表均为激活状态，且至少有一个主机在线。对于不再包含任何成员的表，`Status`\
  \ 列将变为空。向 `relayctl` 查询主机信息将以以主机为中心的格式显示状态信息：\n\n```\n$ sudo relayctl show hosts\n\
  Id      Type            Name                              Avlblty Status\n1    \
  \   table           webpool:80                                active (3 hosts)\n\
  1       host            192.0.2.214                       100.00% up\n         \
  \               total: 11340/11340 checks\n2       host            192.0.2.215 \
  \                      0.00%   down\n                        total: 0/11340 checks,\
  \ error: tcp connect failed\n3       host            192.0.2.216               \
  \        100.00% up\n                        total: 11340/11340 checks\n4      \
  \ host            192.0.2.217                       0.00%   down\n             \
  \           total: 0/11340 checks, error: tcp connect failed\n2       table    \
  \       sorry:80                                  active (1 hosts)\n5       host\
  \            127.0.0.1                         100.00% up\n                    \
  \    total: 11340/11340 checks\n```\n\n如果你需要将某个主机从池中移除以进行维护（或任何耗时的操作），可以使用 `relayctl`\
  \ 禁用它，如下：\n\n```\n$ sudo relayctl host disable 192.0.2.217\n```\n\n在大多数情况下，该操作将显示\
  \ `command succeeded` 表示操作已成功完成。一旦你完成了维护并将机器上线，可以使用此命令将其重新启用到 `relayd` 的池中：\n\n\
  ```\n$ sudo relayctl host enable 192.0.2.217\n```\n\n同样，你应该几乎立即看到 `command succeeded`\
  \ 消息，表示操作成功。\n\n除了这里演示的基础负载均衡外，`relayd` 在最近的 OpenBSD 版本中还经过了扩展，提供了许多功能，使其在更复杂的设置下更具吸引力。例如，它现在可以处理\
  \ HTTP 和 HTTPS 的第 7 层代理或转发功能，包括带有标头添加和重写的协议处理、URL 路径添加和重写，甚至是会话和 cookie 处理。协议处理需要根据你的应用程序进行定制。例如，以下是一个简单的\
  \ HTTPS 转发，用于对客户端到 Web 服务器的加密 Web 流量进行负载均衡。\n\n```\nhttp protocol \"httpssl\" {\n\
  \          header append \"$REMOTE_ADDR\" to \"X-Forwarded-For\"\n          header\
  \ append \"$SERVER_ADDR:$SERVER_PORT\" to \"X-Forwarded-By\"\n          header change\
  \ \"Keep-Alive\" to \"$TIMEOUT\"\n          query hash \"sessid\"\n          cookie\
  \ hash \"sessid\"\n          path filter \"*command=*\" from \"/cgi-bin/index.cgi\"\
  \n\n          ssl { sslv2, ciphers \"MEDIUM:HIGH\" }\n          tcp { nodelay, sack,\
  \ socket buffer 65536, backlog 128 }\n}\n```\n\n此协议处理器定义演示了对 HTTP 标头的一系列简单操作，并设置了\
  \ SSL 参数和特定的 TCP 参数以优化连接处理。标头选项作用于协议标头，通过向现有标头添加内容（`append`）或将内容更改为新值（`change`）来插入变量值。\n\
  \nURL 和 cookie 哈希值被负载均衡器用于选择将请求转发到目标池中的哪一个主机。`path filter` 指定了任何 `get` 请求（包括第一个引号内的字符串作为第二个字符串的子串）都将被丢弃。`ssl`\
  \ 选项指定仅接受 SSL 版本 2 算法，密钥长度在中等高范围——换句话说，128 位或更高。最后，`tcp` 选项指定了 `nodelay` 以最小化延迟，指定使用选择性确认（RFC\
  \ 2018），并设置了套接字缓冲区和队列大小。这些选项仅供示例；在大多数情况下，你的应用程序在这些默认值下运行良好。\n\n```\nrelay wwwssl\
  \ {\n          # 作为 SSL 加速器\n          listen on $webserver port 443 ssl\n     \
  \     protocol \"httpssl\"\n          table <webhosts> loadbalance check ssl\n}\n\
  ```\n\n### 注意\n\n*我们添加了 check ssl，假设 webhosts 表中的每个成员已正确配置以完成 SSL 握手。根据你的应用程序，保持后端加密可能是很有用的。*\n\
  \n最后，对于运行 `relayd` 的主机进行基于 CARP 的故障转移（信息见第 8 章），`relayd` 可以通过启动或关闭时为接口组设置 CARP 计数来支持\
  \ CARP。\n\n与 OpenBSD 系统的其他部分一样，`relayd` 提供了丰富的 man 页。对于本文未涵盖的角度和选项（有很多），请深入 `relayd`、`relayd.conf`\
  \ 和 `relayctl` 的 man 页并开始实验以找到你所需的配置。\n\n## 内部的 Web 服务器和邮件服务器——NAT 版本\n\n让我们稍微回溯，重新回到基础场景：第\
  \ 3 章中的示例客户端有了三个新邻居：邮件服务器、Web 服务器和文件服务器。这次，外部可见的 IPv4 地址要么不可用，要么太贵，而且在主要作为防火墙的机器上运行多个其他服务并不理想。这意味着我们回到了在网关处进行\
  \ NAT 的情况。幸运的是，PF 的重定向机制使得保持服务器在内部相对容易。\n\n网络规范与我们刚刚处理的 example.com 设置相同：我们需要运行一个提供明文（`http`）和加密（`https`）格式数据的\
  \ Web 服务器，并且我们需要一个发送和接收电子邮件的邮件服务器，让本地网络内外部的客户端可以使用许多已知的提交和检索协议。简而言之，我们想要与上一节设置中几乎相同的功能，但只有一个可路由地址。\n\
  \n\n\n\n在这三个服务器中，只有 Web 服务器和邮件服务器需要对外部可见，因此我们为它们的 IP 地址和服务添加了第 3 章规则集的宏：\n\n```\n\
  webserver = \"192.168.2.7\"\nwebports = \"{ http, https }\"\nemailserver = \"192.168.2.5\"\
  \nemail = \"{ smtp, pop3, imap, imap3, imaps, pop3s }\"\n```\n\n由于只有一个可路由地址且服务器隐藏在\
  \ NAT 地址空间中，我们需要在网关处设置规则，以重定向我们希望服务器处理的流量。我们可以定义一组 `match` 规则来设置重定向，稍后在另一组规则中处理\
  \ `block`（拦截）或 `pass`（通过）问题，如下：\n\n```\nmatch in on $ext_if proto tcp to $ext_if\
  \ port $webports rdr-to $webserver\nmatch in on $ext_if proto tcp to $ext_if port\
  \ $email rdr-to $emailserver\n\npass proto tcp to $webserver port $webports\npass\
  \ proto tcp to $emailserver port $email\npass proto tcp from $emailserver to port\
  \ smtp\n```\n\n这种 `match` 和 `pass` 规则的组合与 OpenBSD 4.7 之前的 PF 版本的做法非常接近，如果你是从之前的版本升级，这种快速编辑可以迅速地弥补语法差异。但你也可以选择新样式，并编写这个稍微紧凑的版本：\n\
  \n```\npass in on $ext_if inet proto tcp to $ext_if port $webports rdr-to $webserver\
  \ tag RDR\npass in on $ext_if inet proto tcp to $ext_if port $email rdr-to $mailserver\
  \ tag RDR\npass on $int_if inet tagged RDR\n```\n\n注意在 `rdr-to` 中使用 `pass` 规则的使用。这种过滤与重定向的组合将有助于在稍过后的时间里让事情变得更简单，所以目前请先尝试这种组合。\n\
  \n在 OpenBSD 4.7 之前的 PF 中，规则集将非常相似，区别在于我们处理重定向的方式。\n\n```\nwebserver = \"192.168.2.7\"\
  \nwebports = \"{ http, https }\"\nemailserver = \"192.168.2.5\"\nemail = \"{ smtp,\
  \ pop3, imap, imap3, imaps, pop3s }\"\n\nrdr on $ext_if proto tcp to $ext_if port\
  \ $webports -> $webserver\nrdr on $ext_if proto tcp to $ext_if port $email -> $emailserver\n\
  \npass proto tcp to $webserver port $webports\npass proto tcp to $emailserver port\
  \ $email\npass proto tcp from $emailserver to any port smtp\n```\n\n### 带有 NAT 的\
  \ DMZ\n\n在全 NAT 设置下，分配给 DMZ 的可用地址池可能比我们之前的示例中更大，但相同的原理仍然适用。当你将服务器移动到物理上隔离的网络时，你需要检查规则集中的宏定义是否合理，并在必要时调整这些值。\n\
  \n与可路由地址的情况一样，通过编辑 `pass` 规则来收紧你的规则集可能是很有用的，这样进出你你服务器的流量将仅允许在与服务实际相关的接口上通过：\n\n\
  ```\npass in on $ext_if inet proto tcp to $ext_if port $webports rdr-to $webserver\n\
  pass in on $int_if inet proto tcp from $localnet to $webserver port $webports\n\
  pass out on $dmz_if proto tcp to $webserver port $webports\npass in log on $ext_if\
  \ inet proto tcp to $ext_if port $email rdr-to $mailserver\npass in log on $int_if\
  \ proto tcp from $localnet to $mailserver port $email\npass out log on $dmz_if proto\
  \ tcp to $mailserver port smtp\npass in on $dmz_if from $mailserver to port smtp\n\
  pass out log on $ext_if proto tcp from $mailserver to port smtp\n```\n\nOpenBSD\
  \ 4.7 之前的 PF 版本在某些细节上有所不同，重定向仍然在独立的规则中：\n\n```\npass in on $ext_if proto tcp to\
  \ $webserver port $webports\npass in on $int_if proto tcp from $localnet to $webserver\
  \ port $webports\npass out on $dmz_if proto tcp to $webserver port $webports\npass\
  \ in log on $ext_if proto tcp to $mailserver port smtp\npass in log on $int_if proto\
  \ tcp from $localnet to $mailserver port $email\npass out log on $dmz_if proto tcp\
  \ to $mailserver port smtp\npass in on $dmz_if from $mailserver to port smtp\npass\
  \ out log on $ext_if proto tcp from $mailserver to port smtp\n```\n\n你可以创建引用本地网络接口的特定\
  \ `pass` 规则，但如果你保持现有的 `pass` 规则不变，它们将继续工作。\n\n### 用于负载均衡的重定向\n\n上示例中基于重定向的负载均衡规则在\
  \ NAT 模式下同样有效，在这种模式下，公共地址是网关的外部接口，而重定向地址位于私有范围内。\n\n这里是 `webpool` 的定义：\n\n```\n\
  table <webpool> {192.168.2.7, 192.168.2.8, 192.168.2.9, 192.168.2.10}\n```\n\n可路由地址情况与\
  \ NAT 版本之间的主要区别在于，在你添加 `webpool` 定义后，编辑现有的 `pass` 规则，将其变为：\n\n```\npass in on $ext_if\
  \ inet proto tcp to <webpool> keep state\n```\n\n或者对于 OpenBSD 4.7 之前的 PF，使用这个：\n\
  \n```\nrdr on $ext_if proto tcp <webpool>\n```\n\n### 注意\n\n你可以像 IPv4 一样配置 IPv6。与人们认为的不同，带有\
  \ `nat-to` 的 IPv6 规则同样有效。\n\n### 回到单个 NAT 网络\n\n你可能会惊讶地发现，某些情况下设置小网络比大网络更困难。例如，当服务器位于同一个物理网络时，基础\
  \ NAT 的效果非常好。以下是完整的配置：\n\n```\next_if = \"re0\" # 外部接口宏\nint_if = \"re1\" # 内部接口宏\n\
  localnet = $int_if\nproxy = \"127.0.0.1\" # 用于 ftp-proxy\nicmp_types = \"{ echoreq,\
  \ unreach }\"\nclient_out = \"{ ssh, domain, pop3, nntp, http, https, 446, cvserver,\
  \ 5999, 8000, 8080 }\"\nudp_services = \"{ domain, ntp }\"\nwebserver = \"192.168.2.7\"\
  \nwebports = \"{ http, https }\"\nemailserver = \"192.168.2.5\"\nemail = \"{ smtp,\
  \ pop3, imap, imap3, imaps, pop3s }\"\n## NAT: ext_if IP 地址可能是动态的，因此使用 ($ext_if)\n\
  match out on $ext_if from $localnet nat-to ($ext_if)\nblock all\n## 对于 ftp-proxy：记得在你的\
  \ /etc/rc.conf 中取消以下行的注释以启用 ftp-proxy:\nftpproxy_flags=\"\"\nanchor \"ftp-proxy/*\"\
  \npass in quick proto tcp to port ftp rdr-to $proxy port 8021\npass out proto tcp\
  \ from $proxy to port ftp\npass quick inet proto { tcp, udp } to port $udp_services\n\
  pass proto tcp to $client_out\n## 允许 traceroute(8) 的默认范围：\n### \"base+nhops*nqueries-1\"\
  \ (33434+64*3-1)\npass out on $ext_if inet proto udp to port 33433 >< 33626 keep\
  \ state\n### 确保 icmp 直接通过\npass inet proto icmp icmp-type $icmp_types from $localnet\n\
  pass inet proto icmp icmp-type $icmp_types to $ext_if\npass in on $ext_if inet proto\
  \ tcp to $ext_if port $webports rdr-to $webserver\npass in on $ext_if inet proto\
  \ tcp to $ext_if port $email rdr-to $mailserver\npass on $int_if inet proto tcp\
  \ to $webserver port $webports\npass on $int_if inet proto tcp to $mailserver port\
  \ $email\n```\n\n\n\n\n这里的最后四条规则是我们最感兴趣的。如果你尝试从自己网络中的主机通过官方地址访问服务，你很快就会发现，来自本地网络机器对重定向服务的请求可能永远到达外部接口。这是因为所有的重定向和翻译都是在外部接口上完成的。网关在内部接口上接收来自本地网络的数据包，其目的地址被设置为外部接口的地址。网关识别该地址为自己的地址之一，并尝试像处理指向本地服务的请求一样处理它；结果是，重定向在内部无法正常工作。\n\
  \n对于 OpenBSD 4.7 之前的系统，上述最后四行规则的等效部分如下：\n\n```\nrdr on $ext_if proto tcp to $ext_if\
  \ port $webports -> $webserver\nrdr on $ext_if proto tcp to $ext_if port $email\
  \ -> $emailserver\n\npass proto tcp to $webserver port $webports\npass proto tcp\
  \ to $emailserver port $email\npass proto tcp from $emailserver to any\n```\n\n\
  幸运的是有很多解决方法。这个问题非常常见，用户指南列出了四种不同的解决方案，包括将服务器移动到 DMZ。由于这是一本关于 PF 的书，我们将重点关注基于 PF\
  \ 的解决方案（实际上是非常糟糕的变通方法），即将本地网络视为重定向和 NAT 规则的特殊情况。我们需要拦截来自本地网络的数据包并正确处理这些连接，确保任何返回流量都定向到实际发起连接的伙伴。这意味着为了让重定向从本地网络正常工作，我们需要添加与处理外部请求的规则镜像的特殊情况重定向规则。首先，这里是\
  \ OpenBSD 4.7 及更高版本的重定向 `pass` 规则：\n\n```\npass in on $ext_if proto tcp to $ext_if\
  \ port $webports rdr-to $webserver\npass in on $ext_if proto tcp to $ext_if port\
  \ $email rdr-to $mailserver\npass in log on $int_if proto tcp from $int_if:network\
  \ to $ext_if \\\nport $webports rdr-to $webserver\npass in log on $int_if proto\
  \ tcp from $int_if:network to $ext_if \\\nport $email rdr-to $mailserver\nmatch\
  \ out log on $int_if proto tcp from $int_if:network to $webserver \\\nport $webports\
  \ nat-to $int_if\npass on $int_if inet tcp to $webserver port $webports\nmatch out\
  \ log on $int_if proto tcp to $mailserver \\\nport $email\npass on $int_if inet\
  \ tcp to $mailserver \n```\n\n前两条规则与原始规则相同。接两条规则拦截来自本地网络的流量，`rdr-to` 操作像处理外部流量的规则一样重写目的地址。`pass\
  \ on $int_if` 规则的作用与早期版本相同。\n\n带有 `nat-to` 的 `match` 规则作为路由变通方法存在。如果没有它们，`webserver`\
  \ 和 `mailserver` 主机会将重定向连接的返回流量直接路由回本地网络主机，那里流量将匹配任何传出连接。有了 `nat-to`，服务器会将网关视为流量的源，并将返回流量按原路径返回。网关根据来自本地网络连接创建的状态匹配返回流量，并将流量返回给正确的客户端。\n\
  \nOpenBSD 4.7 之前的等效规则初看起来有点复杂，但最终结果是一样的：\n\n```\nrdr on $int_if proto tcp from $localnet\
  \ to $ext_if port $webports -> $webserver\nrdr on $int_if proto tcp from $localnet\
  \ to $ext_if port $email -> $emailserver\nno nat on $int_if proto tcp from $int_if\
  \ to $localnet\nnat on $int_if proto tcp from $localnet to $webserver port $webports\
  \ -> $int_if\nnat on $int_if proto tcp from $localnet to $emailserver port $email\
  \ -> $int_if\n```\n\n通过这种方式，我们扭曲了重定向和地址转换逻辑来实现需求，而完全不需要碰 `pass` 规则。（我有幸通过邮件和 IRC\
  \ 目证了多位网络管理员在得知这五行重配置的真相时的反应。）\n\n## 接口组过滤\n\n你的网络可能有多个子网，除了电子邮件、Web、文件和打印等常用服务外，它们可能永远不需要与本地网络交互。你如何处理进出子网的流量取决于你的网络设计。一种有效的方法是将每个低权限网络视为独立的本地网络，连接到公共过滤网关的独立接口上，然后给它一套规则，允许与连接到主网关的相邻网络进行所需的直接交互。\n\
  \n通过将逻辑上相似的接口分组接口组，并将过滤规则应用于组而不是单个接口，你可以使你的 PF 配置更易于管理和可读。接口组通过 `ifconfig` 的 `group`\
  \ 选项实现，最初出现在 OpenBSD 3.6 中，并从 FreeBSD 7.0 开始被采用。\n\n所有配置的网络接口都可以配置为属于一个或多个组。某些接口自动属于默认组之一。例如，所有\
  \ 802.11 网络接口都属于 `wlan` 组，而与默认路由相关的接口属于 `egress` 组。坦率地说，一个接口可以是多个组的成员，你可以通过适当的 `ifconfig`\
  \ 命令将接口添加到接口组，例如所示：\n\n```\n## ifconfig sis2 group untrusted\n```\n\n对于持久性配置，OpenBSD\
  \ 下的等效设置位于 *hostname.sis2* 文件中或 FreeBSD *rc.conf* 文件中的 `ifconfig_sis2=` 行中。\n\n\
  在合理的情况下，你可以像处理单个接口一样处理接口组：\n\n```\npass in on untrusted to any port $webports\n\
  pass out on egress to any port $webports\n```\n\n如果到这里你认为在到为止的大多数、不是所有的规则示例中，都可以过滤\
  \ `egress` 组而不是宏 `$ext_if`，那么你已经掌握了一个重要的点。回顾你现有的任何规则集并看看使用接口组如何进一步帮助是一个实用的练习。记住，接口组可以有一个或多个成员。\n\
  \n注意，接口组过滤使得编写硬件无关的规则集成为可能。只要你的 *hostname.if* 文件或 `ifconfig_if=` 行将接口放入正确的组中，过滤接口组的规则集在不同硬件配置机器之间就是完全移植的。\n\
  \n在不支持接口组功能的系统中，你可能通过创造性地使用宏来实现类似的效果，如下：\n\n```\nuntrusted = \"{ ath0 ath1 wi0 ep0\
  \ }\"\negress = \"sk0\"\n```\n\n## 标签的力量\n\n在某些网络中，数据包允许通过的决策无法轻松映射到子网和服务的标准。站点策略要求的的细粒度控制可能会使规则集变得复杂且可能难以维护。\n\
  \n\n\n幸运的是，PF 提供了另一种名为 `packet tagging`（数据包标记）的分类和过滤机制。实现数据包标记的一种有效方法是 `tag` 匹配特定\
  \ `pass` 规则的入数据包，然后根据数据包被 `tagged` 的标识符让其通过到其他地方。在 OpenBSD 4.6 及更高版本中，甚至可以拥有独立的\
  \ `match` 规则来根据匹配标准进行 `tag`，而将通过、重定向或采取其他动作的决策留给规则集后面的规则。\n\n一个示例可以是我们在第 4 章 中设置的无线接入点，我们可以合理预期它将向本地网络注入流量，其表源地址等同于接入点的\
  \ `$ext_if` 地址。在这种情况下，对于一个具有多个此类接入点的网关，规则集的一个有用补充可能如下（当然，假设 `wifi_allowed` 和 `wifi_ports`\
  \ 宏的定义符合现场的需求）：\n\n```\nwifi = \"{ 10.0.0.115, 10.0.0.125, 10.0.0.135, 10.0.0.145\
  \ }\"\npass in on $int_if from $wifi to $wifi_allowed port $wifi_ports tag wifigood\n\
  pass out on $ext_if tagged wifigood\n```\n\n随着规则集复杂性的增加，考虑在入站 `match` 和 `pass` 规则中使用\
  \ `tag`，使你的规则集具有可读性并易于维护。\n\n标记是粘性的（sticky），一旦数据包被匹配规则标记，该标记就会一直保留，这意味着即使数据包不是由最后一个匹配规则应用的，它也可能拥有标记。然而，一个数据包在任何时候只能有一个标记。如果数据包匹配了多个应用标记的规则，标记将被每个新的匹配\
  \ `tag` 规则用新的覆盖。\n\n例如，你可以通过一组 `match` 或 `pass` 规则对入站流量设置多个标记，并辅以一组 `pass` 规则，根据入站流量上设置的标记来决定数据包从何处通过。\n\
  \n## 桥接防火墙 (The Bridging Firewall)\n\n以太网 `bridge` 由两个或多个接口组成，这些接口被配置为透明地转发以太网帧，并且对上层（如\
  \ TCP/IP 栈）不可见。在过滤上下文中，桥接配置通常被认为很有吸引力，因为这意味着过滤可以在一个没有自己 IP 地址的机器上执行。如果目标机器运行 OpenBSD\
  \ 或具有类似能力的操作系统，它仍然可以过滤和重定向流量。\n\n这种设置的主要优势是攻击防火墙本身变得更加困难。缺点是，所有的管理任务必须在防火墙的控制台上执行，除非你配置了一个可以通过某种安全网络甚至串行控制台访问的网络接口。随之推论的是，没有配置\
  \ IP 地址的桥接器不能设置为网络的网关，并且不能在桥接接口上运行任何服务。相反，你可以将桥接器看作网络电上的上的智能凸起，它可以进行过滤和重定向。\n\n\
  使用实现为桥接器的防火墙时，有几点通用的注意事项：\n\n- 接口被置于混杂模式（promiscuous mode），这意味着它们将接收（并在某种程度上处理）网络上的每一个包。\n\
  - 桥接工作在以太网层，默认情况下转发所有类型的数据包，而不仅仅是 TCP/IP。\n- 接口上缺少 IP 地址导致某些更有效的冗余功能（如 `CARP`）不可用。\n\
  \n配置桥接器的方法在不同操作系统之间的某些细节上有所不同。以下示例非常基础，没有涵盖所有可能的细微差别，但它们应该足够让你快速入门。\n\n### OpenBSD\
  \ 上的基础桥接设置\n\nOpenBSD 的 GENERIC 内核包含了配置桥接器并对其进行过滤的所有必要代码。除非你编译了没有桥接代码的自定义内核，否则设置是非常直观的。\n\
  \n### 注意事项\n\n在 OpenBSD 4.7 及更高版本中，`brconfig` 命令不再存在。所有的桥接配置和相关功能已在 OpenBSD 4.7\
  \ 版本中合并到 `ifconfig` 中。如果你运行在可用 `brconfig` 的 OpenBSD 版本上，你运行的是过时的、不受支持的配置。请尽快升级到较新版本。\n\
  \n要在命令行上设置带有两个接口的桥接器，你首先创建桥接设备。同类第一个设备通常赋予序号 0，因此我们通过以下命令创建 `bridge0` 设备：\n\n```\n\
  $ sudo ifconfig bridge0 create\n```\n\n在执行下一个 `ifconfig` 命令之前，使用 `ifconfig` 检查可选的成员接口（在我们案例中为\
  \ `ep0` 和 `ep1`）是否已启动但未分配 IP 地址。接下来，通过输入以下内容配置桥接：\n\n```\n$ sudo ifconfig bridge0\
  \ add ep0 add ep1 blocknonip ep0 blocknonip ep1 up\n```\n\nOpenBSD 的 `ifconfig`\
  \ 命令本身包含了大量的过滤代码。在这个示例中，我们为每个接口使用 `blocknonip` 来阻塞所有非 IP 流量。\n\n### 注意事项\n\n除了其他配置选项，OpenBSD\
  \ 的 `ifconfig` 命令还有自己的过滤选项。`bridge(4)` 和 `ifconfig(8)` 手页提供了更多信息。由于它工作在以太网层，可以使用\
  \ `ifconfig` 来指定过滤规则。\n\n### FreeBSD 上的基础桥接设置\n\n对于 FreeBSD，步骤比 OpenBSD 稍微复杂一些。为了能够使用桥接，运行的内核必须包含\
  \ `if_bridge` 模块。默认内核配置构建了该模块，因此在通常情况下你可以直接创建接口。要将桥接设备编译进内核，请在内核配置中添加以下行：\n\n```\n\
  device if_bridge\n```\n\n你也可以通过在 `/etc/loader.conf` 文件中放入以下行在启动时加载设备：\n\n```\nif_bridge_load=\"\
  YES\"\n```\n\n通过输入以下创建桥接：\n\n```\n$ sudo ifconfig bridge0 create\n```\n\n创建 `bridge0`\
  \ 接口还会创建一组桥接相关的 `sysctl` 值：\n\n```\n$ sudo sysctl net.link.bridge\nnet.link.bridge.ipfw:\
  \ 0\nnet.link.bridge.pfil_member: 1\nnet.link.bridge.pfil_bridge: 1\nnet.link.bridge.ipfw_arp:\
  \ 0\nnet.link.bridge.pfil_onlyip: 1\n```\n\n检查这些 `sysctl` 值可用。如果是，说明桥接已启用。如果没有，回去查看哪里错了以及为什么。\n\
  \n### 注意事项\n\n这些值适用于桥接接口本身的过滤。你不需要碰它们，因为成员接口（管道末端）的 IP 级过滤默认开启。\n\n在执行下一个 `ifconfig`\
  \ 命令之前，检查可选的成员接口（在我们案例中为 `ep0` 和 `ep1`）是否已启动但尚未分配 IP 地址。然后通过输入以下内容配置桥接：\n\n```\n\
  $ sudo ifconfig bridge0 addm ep0 addm ep1 up\n```\n\n要使配置永久，请向 `/etc/rc.conf` 添加以下行：\n\
  \n```\nifconfig_ep0=\"up\"\nifconfig_ep1=\"up\"\ncloned_interfaces=\"bridge0\"\n\
  ifconfig_bridge0=\"addm ep0 addm ep1 up\"\n```\n\n\n\n\n这意味着你的桥接已经建立，你可以继续创建 PF\
  \ 过滤规则了。请参考 `if_bridge(4)` 手页以获取更多关于 FreeBSD 的桥接信息。\n\n### 在 NetBSD 上设置基础桥接\n\n\
  在 NetBSD 上，默认内核配置没有编译过滤桥接支持。你需要通过在内核配置文件中添加以下选项来编译自定义内核。一旦你部署了带有桥接代码的新内核，设置就会非常简单。\n\
  \n```\noptions      BRIDGE_IPF #      bridge uses IP/IPv6 pfil hooks too\n```\n\n\
  若要在命令行上创建一个包含两个接口的桥接，首先创建 `bridge0` 设备：\n\n```\n$ sudo ifconfig bridge0 create\n\
  ```\n\n在执行下一个 `brconfig` 命令之前，使用 `ifconfig` 检查预期的成员接口（在我们的案例中为 `ep0` 和 `ep1`）是否已启动但未分配\
  \ IP 地址。然后，通过输入以下内容来配置桥接：\n\n```\n$ sudo brconfig bridge0 add ep0 add ep1 up\n```\n\
  \n接下来，启用 `bridge0` 设备上的过滤功能：\n\n```\n$ sudo brconfig bridge0 ipf\n```\n\n要使配置持久化，创建或编辑\
  \ `/etc/ifconfig.ep0` 并输入以下行：\n\n```\nup\n```\n\n对于另一个接口，`/etc/ifconfig.ep1` 应该包含相同的行：\n\
  \n```\nup\n```\n\n最后，在 `/etc/ifconfig.bridge0` 中输入桥接设置：\n\n```\ncreate\n!add ep0\
  \ add ep1 up\n```\n\n现在你的桥接应该已经建立，你可以继续创建 PF 过滤规则了。欲需更多信息，请参阅 NetBSD 上的 PF 文档 [`www.netbsd.org/Documentation/network/pf.html`](http://www.netbsd.org/Documentation/network/pf.html)*。\n\
  \n### 桥接规则集\n\n图 5-3 显示了我们在本章中开始的基础规则集在“线缆插入式”版本的 `pf.conf` 文件。如你所见，网络发生了细微变化。\n\
  \n![带有桥接防火墙的网络](img/1atomoreillycomsourcenostarchimages2127157.png.jpg)图 5-3. 带有桥接防火墙的网络\n\
  \n本地网络中的机器共享一个默认网关，该网关不是桥接，但可以位于桥接的内部或外部。\n\n```\next_if = ep0\nint_if = ep1\nlocalnet=\
  \ \"192.0.2.0/24\"\nwebserver = \"192.0.2.227\"\nwebports = \"{ http, https }\"\n\
  emailserver = \"192.0.2.225\"\nemail = \"{ smtp, pop3, imap, imap3, imaps, pop3s\
  \ }\"\nnameservers = \"{ 192.0.2.221, 192.0.2.223 }\"\nclient_out = \"{ ssh, domain,\
  \ pop3, auth, nntp, http, https, \\\n                446, cvspserver, 2628, 5999,\
  \ 8000, 8080 }\"\nudp_services = \"{ domain, ntp }\"\nicmp_types = \"{ echoreq,\
  \ unreach }\"\nset skip on $int_if\nblock all\npass quick on $ext_if inet proto\
  \ { tcp, udp } from $localnet \\\n        to port $udp_services\npass log on $ext_if\
  \ inet proto icmp all icmp-type $icmp_types\npass on $ext_if inet proto tcp from\
  \ $localnet to port $client_out\npass on $ext_if inet proto { tcp, udp } to $nameservers\
  \ port domain\npass on $ext_if proto tcp to $webserver port $webports\npass log\
  \ on $ext_if proto tcp to $emailserver port $email\npass log on $ext_if proto tcp\
  \ from $emailserver to port smtp\n```\n\n还可以实现更为复杂的设置。但请记住，虽然重定向可以生效，但你无法在任何没有 IP\
  \ 地址的接口上运行服务。\n\n### 处理来自其他地方的不可路由 IPv4 地址\n\n即使你正确配置了网关来处理你自己网络的过滤和可能需要的 NAT，你可能发现自己处于一种令人尴尬的境地：需要为他人的配置错误进行补偿。\n\
  \n### 建立全局规则\n\n一种令人沮丧的常见配置错误是允许带有不可路由地址的流量流向互联网。来自不可路由 IPv4 地址的流量在几种 `拒绝服务 (DoS)`\
  \ 攻击技术中都起着作用，因此值得考虑显式阻止来自不可路由地址的流量进入你的网络。这里概述了一种可能的解决方案。为了保险起见，它还阻止了任何通过网关外部接口尝试与不可路由地址建立联系的操作。\n\
  \n```\nmartians = \"{ 127.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, \\\n         \
  \     10.0.0.0/8, 169.254.0.0/16, 192.0.2.0/24, \\\n              0.0.0.0/8 }\"\n\
  ```\n\n`martians = \"{ 127.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, \\\n        \
  \      10.0.0.0/8, 169.254.0.0/16, 192.0.2.0/24, \\\n              0.0.0.0/8 }\"\
  `\n\n`set skip on $int_if`\n`block all`\n`pass quick on $ext_if inet proto { tcp,\
  \ udp } from $localnet \\`\n`to port $udp_services`\n`pass log on $ext_if inet proto\
  \ icmp all icmp-type $icmp_types`\n`pass on $ext_if inet proto tcp from $localnet\
  \ to port $client_out`\n`pass on $ext_if inet proto { tcp, udp } to $nameservers\
  \ port domain`\n`pass on $ext_if proto tcp to $webserver port $webports`\n`pass\
  \ log on $ext_if proto tcp to $emailserver port $email`\n`pass log on $ext_if proto\
  \ tcp from $emailserver to port smtp`\n\n### 注意事项\n\n*还有几个 pfctl 选项对你处理锚点（anchors）时非常有用。请参考\
  \ pfctl 手页以获取灵感。*\n\n\n\n\n\n之前提到的概念（指定一组适用于锚点（anchor）内所有操作的通用标准）在你的配置规模大到需要一些额外的结构化辅助手段时非常有吸引力。例如，“在接口（on\
  \ interface）”可以作为到达特定接口的流量的有用通用标准，因为这些流量通常具有某些相似性。例如，看以下内容：\n\n```\nanchor \"dmz\"\
  \ on $dmz_if {\n    pass in proto { tcp udp } to $nameservers port domain\n    pass\
  \ in proto tcp to $webservers port { www https }\n    pass in proto tcp to $mailserver\
  \ port smtp\n    pass in log (all, to pflog1) in proto tcp from $mailserver \\\n\
  \                 to any port smtp\n}\n```\n\n另一个独立的锚点 `ext` 将用于出口 `egress` 接口组：\n\
  \n```\nanchor ext on egress {\n    match out proto tcp to port { www https } set\
  \ queue (qweb, qpri) set prio (5,6)\n    match out proto { tcp udp } to port domain\
  \ set queue (qdns, qpri) set prio (6,7)\n    match out proto icmp set queue (q_dns,\
  \ q_pri) set prio (7,6)\n    pass in log proto tcp to port smtp rdr-to 127.0.0.1\
  \ port spamd queue spamd\n    pass in log proto tcp from <nospamd> to port smtp\n\
  \    pass in log proto tcp from <spamd-white> to port smtp\n    pass out log proto\
  \ tcp to port smtp\n    pass log (all) proto { tcp, udp } to port ssh keep state\
  \ (max-src-conn 15, \\\n        max-src-conn-rate 7/3, overload <bruteforce> flush\
  \ global)\n}\n```\n\n如果根据接口亲和性在锚点中分组规则，另一个明显的逻辑优化是加入标签（tags）来帮助策略路由决策。一个简单但有效的例子如下：\n\
  \n```\nanchor \"dmz\" on $dmz_if {\n    pass in proto { tcp udp } to $nameservers\
  \ port domain tag GOOD\n    pass in proto tcp to $webservers port { www https }\
  \ tag GOOD\n    pass in proto tcp to $mailserver port smtp tag GOOD\n    pass in\
  \ log (all, to pflog1) in proto tcp from $mailserver\n                 to any port\
  \ smtp tag GOOD\n    block log quick ! tagged GOOD\n}\n```\n\n即使这里的锚点示例在锚点内部都包含了拦截决策，但基于标签信息进行拦截或通过的决策并不非发生在锚点内部。\n\
  \n在对作为结构化工具的锚点进行了这种“旋风之旅”后，你可能会尝试将你的整个规则集转换为基于锚点的结构。如果你尝试这样做，可能会发现一些让内部逻辑更清晰的方法。但如果某些规则需要全局全局、位于绑定到通用标准的锚点之外，请不要感到惊讶。你几乎肯定会发现，在你的环境中证明有用的东西与激发我这里展示的场景的灵感至少有些许不同。\n\
  \n## 你的网络有多复杂？——重温\n\n在本章的开头，我们提出了问题：“你的网络有多复杂？”以及“它需要有多复杂？”在这一章的各个小节中，我们介绍了许多工具和技术，这些工具使得使用\
  \ `PF` 和相关工具构建复杂基础设施成为可能，并帮助在管理复杂性的同时让网络管理员保持理智。\n\n如果你负责一个站点，需要在那里应用本章中提到的所有或大部分技术，我深感你的痛苦。另一方面，如果你负责一个如此多样化的网络，那么后续关于流量整形和管理资源可用性的章节可能对你同样有用。\n\
  \n本书的其余部分主要处理如何优化你的设置以提高性能和资源可用性，但有一章我们略微偏离了这一点并采取了更轻松的语气。在我们深入研究如何优化性能和确保高可用性之前，是时候看看如何让你的基础设施对于特定的群体或个人变得不可用或难以访问了。下一章专门涉及如何为试图滥用你所维护服务的未洗涤大众——甚至是那些有组织的组织的犯罪分子——的生活增加难度。\n\
  \n^([28]) 参见 `PF` 用户指南中的“重定向与反射”部分（[`www.openbsd.org/faq/pf/rdr.html#reflect`](http://www.openbsd.org/faq/pf/rdr.html#reflect)）。\n\
  \n## 第 6 章.转被动为主动防御\n\n![转被动为主动防御](img/statomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n在上一章中，你看到了可能需要花费大量的时间和精力来确保即使在实施了严格的数据包过滤的情况下，你想要提供的服务也是可用的。现在，随着你的工作设置就绪，你很快就会注意到某些服务往往比其他服务吸引更多不受欢迎的关注。\n\
  \n这里是这样的场景：你有一个带有数据包过滤的网络，以匹配你站点的需求，包括一些需要让其他用户访问的服务。不幸的是，当服务可用时，存在有人想利用它们进行某种恶作剧的风险。\n\
  \n你的网络中几乎肯定会有通过 `SSH`（安全外）的远程登录，以及运行着 `SMTP` 电子邮件——这两者都是诱人的目标。在本章中，我们将查看如何让通过 `SSH`\
  \ 获取未经授权访问变得更加困难，然后转向一些更有效的方法来拒绝服务器。\n\n## 拒绝\n\n`Secure Shell` 服务通常被称为 `SSH`，是一个非常重要的服务。它经常是脚本小子的主要目标。\n\
  \n### 暴力破解攻击\n\n如果你运行一个从互联网访问的 `SSH` 登录，你可能在日志中看到这样的条目：\n\n```\nSep 26 03:12:34\
  \ sshd[25771] Failed password for root from 200.72.41 port 4092\nSep 26 03:12:34\
  \ sshd[5279] Failed password for root from 200.72.41 port 4092\nSep 26 03:12:35\
  \ sshd[5279] Received disconnect from 200.72.41: 11: Bye\nSep 26 03:12:44 sshd[29635]\
  \ Invalid user admin from 200.72.41\nSep 26 03:12:44 sshd[29635] Failed password\
  \ for user admin from 200.72.41 port 43811\nSep 26 03:12:44 sshd[24703] Failed password\
  \ for user admin from 200.72.41 port 43811\nSep 26 03:12:45 sshd[24703] Connection\
  \ closed by 200.72.41\nSep 26 03:13:10 sshd[11459] Failed password for root from\
  \ 200.72.41 port 43344\nSep 26 03:13:10 sshd[7635] Failed password for root from\
  \ 200.72.41 port 43344\nSep 26 03:13:10 sshd[11459] Received disconnect from 200.72.41:\
  \ 11: Bye\nSep 26 03:13:15 sshd[31357] Invalid user admin from 200.72.41\nSep 26\
  \ 03:13:15 sshd[10543] input_auth_request: user admin\nSep 26 03:13:15 sshd[10543]\
  \ Failed password for user admin from 200.72.41 port 43811\nSep 26 03:13:15 sshd[31357]\
  \ Failed password for user admin from 200.72.41 port 43811\nSep 26 03:13:15 sshd[10543]\
  \ Received disconnect from 200.72.41: 11: Bye\n```\n\n这就是*暴力破解攻击*的样子。某些人或事物正试图通过暴力破解寻找可以进入你系统的用户名和密码组合。\n\
  \n最简单的响应是写一条 `pf.conf` 规则来阻止所有访问，但这会导致另一类问题，包括如何让对你的系统有正当业务的人访问。设置你的 `sshd` 仅接受密钥身份验证会有帮助，但可能无法阻止脚本小子尝试。你可能会考虑将服务移动到另一个端口，但是，那些在\
  \ 22 端口攻击你的人可能会扫描到 22222 端口重演一遍。^([30])\n\n\n\n\n\n自 OpenBSD `3.7`（及相应版本）以来，`PF`\
  \ 提供了一个稍微更优雅的解决方案。\n\n### 设置自适应防火墙\n\n为了阻挡暴力破解，你可以编写 `pass` 规则，使其对连接主主机可以执行的操作维持某些限制。为了保险起见，你可以将违规者封禁到一个地址表中，并拒绝对该表的某些或全部访问。你甚至可以选择丢弃来自超出你限制的机器的所有现有连接。要启用此功能，请先在任何过滤规则之前，在配置中添加以下行来设置该表：\n\
  \n```\ntable <bruteforce> persist\n```\n\n然后，在规则集的早期，如下所示，`block` 暴力破解者：\n\n```\n\
  block quick from <bruteforce>\n```\n\n最后，添加你的 `pass` 规则：\n\n```\npass proto tcp\
  \ to $localnet port $tcp_services \\\n     keep state (max-src-conn 100, max-src-conn-rate\
  \ 15/5, \\\n         overload <bruteforce> flush global)\n```\n\n这条规则与你之前在示例中看到的非常相似。在此语境下，有趣的部分是括号中的内容，被称为*状态跟踪选项\
  \ (state-tracking options)*：\n\n*   `max-src-conn` 是允许从单个主机的并发连接数。在这个示例中，它被设置为 `100`。根据你的网络流量模式，你可能想要稍高或稍低的值。\n\
  \n*   `max-src-conn-rate` 是允许任何单个主机的新连接速率。在这里，它被设置为每 5 秒 15 次连接，表示为 `15/5`。选择一个适合你设置的速率。\n\
  \n*   `overload <bruteforce>` 意味着任何超过上述限制的主机地址将被添加到 `bruteforce` 表中。我们的规则集会拦截来自\
  \ `bruteforce` 表中地址的所有流量。一旦主机超过了任何这些限制并进入溢载表，该规则将不再匹配来自该主机的流量。确保溢载者得到了处理，即使仅通过默认的块规则或类似规则也行。\n\
  \n*   `flush global` 表示当主机达到限制时，其所有连接的状态都将被终止（刷新）。`global` 选项意味着为了保险起见，`flush` 应用于由该主机流量创建的所有状态，无论是由哪条规则创建的状态。\n\
  \n正如你可以想象的，在规则集中添加这一微小变化的效果是巨大的。在尝试几次后，暴力破解者最终会进入 `bruteforce` 表。这意味着他们所有的现有连接都将被终止（刷新），并且任何新尝试都将被拦截，在他们那边可能会收到\
  \ `Fatal: timeout before authentication` 消息。你创建了一个*自适应防火墙*，它能够根据你的网络状况自动调整，并对不当活动采取行动。\n\
  \n### 注意\n\n*这些自适应规则仅对防御传统的、快速连击型的暴力破解尝试有效。 2008 年首次被识别为此类并从那时起反复出现的低强度、分布式密码猜测尝试（在其他名称中被称为*“圣母玛云”\
  \ (The Hail Mary Cloud)*）不会产生匹配这些规则的流量。*\n\n你可能希望你的规则集具有某些灵活性，并希望为某些服务允许更多的连接，但在涉及\
  \ SSH 时可能想更严格一些。在这种情况下，你可以在规则集的早期使用类似下面的规则补充通用的 `pass` 规则：\n\n```\npass quick proto\
  \ { tcp, udp } to port ssh \\\n     keep state (max-src-conn 15, max-src-conn-rate\
  \ 5/3, \\\n        overload <bruteforce> flush global)\n```\n\n你应该能够通过阅读相关的 man\
  \ 页面和*PF 用户指南*（参见 附录 A））找到正适合你情况的参数集。\n\n### 注意\n\n*请记住，这些示例规则仅用于说明，你的网络需求可能通过不同的规则得到更好的服务。将并发连接数或连接速率设置过低可能会阻塞合法流量。当配置包含许多位于共同\
  \ NAT 网关后的主机，且 NAT 后的主机上的用户在具有严格 `overload` 规则的网关另一侧有合法业务时，存在遭受自残式拒绝服务（DoS）的潜在风险。*\n\
  \n状态跟踪选项和 `overload` 机制不需要专门适用于 SSH 服务，而且拦截违规者的所有流量并不总是如所愿的。例如，你可以使用如下所示规则：\n\n\
  ```\npass proto { tcp, udp } to port $mail_services \\\n     keep state (max 1500,\
  \ max-src-conn 100)\n```\n\n在这里，`max` 指定了每个规则可以创建的最大状态数，且没有 `overload`，以保护邮件或 Web\
  \ 服务不会接收超过其处理能力的连接（请记住，加载的规则数量取决于 `$mail_services` 宏扩展的内容）。一旦达到 `max` 限制，在旧连接终止之前，新连接将匹配此规则。或者，你可以移除\
  \ `max` 限制，为规则添加 `overload` 部分，并将违规者分配到具有极低带宽分配的队列中（参见第 7 章中关于流量的讨论）。\n\n### 使用\
  \ pfctl 整理表\n\n在使用上一节的 `overload` 规则后，你现在有了一个自适应防火墙，它可以自动检测不当行为并将违规者的地址添加到表中。观察日志和表在短期内可能很有趣，但由于这些规则只负责添加，我们遇到了下一个挑战：保持表的内容更新。\n\
  \n当你运行带有自适应规则集的配置一段时间后，某点你会发现上周被你的 `overload` 规则拦截的 IP 地址实际上是一个动态分配的地址，而现在它被分配给了具有合法通信理由的另一个\
  \ ISP 用户。解决方案是让表条目*过期*——即在一段时间后移除条目。在 OpenBSD 4.1 中，`pfctl` 获取了根据统计数据重置以来的时间使表条过的能力。在大多数情况下，这种重置时间等于添加表条目的的时间。关键字是\
  \ `expire`，条目的年龄以秒为单位。这是一个示例：\n\n```\n$ sudo pfctl -t bruteforce -T expire 86400\n\
  ```\n\n此命令将删除统计数据重置超过 86400 秒（24 小时）的 `bruteforce` 表条目。\n\n### 注意\n\n*选择 24 小时作为过期时间是非常任意的。你应该选择一个你认为合理的时间，让对方发现并修复问题。如果你部署了自适应规则，最好设置\
  \ `crontab` 条目以定期运行类似上述的命令来执行表过期，以确保你的表保持更新。*\n\n\n\n\n电子邮件是一项相当重要的服务，但由于大量的垃圾信息（或称\
  \ `spam`），它需要特别关注。当恶意软件制作者者发现通过电子邮件传播的蠕虫可以发挥作用并开始使用电子邮件传播其载荷时，未经许可的商业邮件数量已经变成了一个棘手的问题。在\
  \ 21 世纪 20 年初，垃圾邮件和邮件恶意软件的总量已增加到这种程度：在没有某种反垃圾邮件措施的情况下运行 `SMTP` 邮件服务几乎是不可思议的。\n\n\
  反垃圾邮件措施几乎与垃圾邮件问题本身一样悠久。早期的工作集中在对邮件内容的分析（称为 `content filtering`），以及在某种程度上对邮件中极易被伪造的头部进行解释，例如声称的发送者地址（`From:`）或记录在\
  \ `Received:` 头部中中间投递的存储和转发路径。\n\n当 OpenBSD 团队设计其反垃圾邮件解决方案 `spamd` 时（该方案于 2003 年随\
  \ OpenBSD 3.3 首次引入），开发者专注于网络层面以及 `SMTP` 会话中的直接通信伙伴，以及任何关于尝试投递消息的主机的可用信息。开发者们旨在创建一个小型、简单且安全的程序。早期的实现几乎完全基于对\
  \ `PF` 表的创意使用，并结合来自信任外部源的数据。\n\n### Note\n除了 OpenBSD 垃圾邮件延迟守护进程外，基于内容过滤的反垃圾邮件包 `SpamAssassin`\
  \ ([`spamassassin.apache.org/`](http://spamassassin.apache.org/)) 也包含一个名为 `spamd`\
  \ 的程序。这两个程序都旨在帮助对抗垃圾邮件，但它们对底层问题采取了完全不同的方法，并且不直接相互操作。然而，当两个程序都正确配置并运行时，它们可以很好良好补充。\n\
  \n## 网络级行为分析与黑名单\n原始的 `spamd` 设计基于一种观察：垃圾邮件发送者发送大量邮件，而你成为特定消息首位接收者的概率极低。此外，垃圾邮件通过少数对垃圾邮件发送者友好的网络和许多被劫持机器发送。单条消息以及发送消息的机器都会迅速报告给黑名单维护者，由已知垃圾邮件发送者\
  \ IP 地址组成的黑名单数据构成了 `spamd` 处理的基础。\n\n在处理黑名单主机时，`spamd` 采用一种称为 `tarpitting`（焦罐填充）的方法。当守护进程接收到\
  \ `SMTP` 连接时，它会呈现其横幅并立即切换到每秒 1 字节的速度回答 `SMTP` 流量的模式，使用一小部分 `SMTP` 命令，以确保在邮件头部传输后邮件永远不会被投递，而是被退回发送者的队列。其意图是在发送端尽可能地浪费时间，而接收端几乎不产生任何成本。这种带有\
  \ 1 字节 `SMTP` 响应的特定焦罐填充实现通常被称为 `stuttering`（断结式）。基于黑名单且带有断结式的焦罐填充直到 OpenBSD 4.0（包含该版本在内）一直是\
  \ `spamd` 的默认模式。\n\n### Note\n在 FreeBSD 和 NetBSD 上，`spamd` 不是基础系统的一部分，但可以通过端口（ports）和包作为\
  \ `mail/spamd` 可用。如果你在 FreeBSD 或 NetBSD 上运行 `PF`，在遵循后续几页的说明之前，你需要先安装相应的端口或包。\n\n\
  ### 在黑名单模式下设置 spamd\n要将 `spamd` 设置为运行传统的仅限黑名单的模式，你首先要在 `pf.conf` 中放入一个特殊表和一个匹配的重定向，然后将转向\
  \ `spamd` 自身的 `spamd.conf`。随后，`spamd` 将通过表和重定向挂入 `PF` 规则集。\n\n以下是此配置的 `pf.conf`\
  \ 行：\n\n```\ntable <spamd> persist\npass in on $ext_if inet proto tcp from <spamd>\
  \ to \\\n      { $ext_if, $localnet } port smtp rdr-to 127.0.0.1 port 8025\n```\n\
  \n这里是预 OpenBSD 4.7 版本的语法：\n\n```\ntable <spamd> persist\nrdr pass on $ext_if inet\
  \ proto tcp from <spamd> to \\\n         { $ext_if, $localnet } port smtp -> 127.0.0.1\
  \ port 8025\n```\n\n表 `<spamd>` 用于存储你从信任的黑名单源导入的 IP 地址。重定向处理所有来自已在黑名单中的主机的 `SMTP`\
  \ 尝试。`spamd` 监听在端口 8025，并对由于重定向接收的所有 `SMTP` 连接以 s-l-o-w 的速度（每秒 1 字节）响应。在规则集的后面，你将有一条规则确保合法的\
  \ `SMTP` 流量通过邮件服务器。`spamd.conf` 是你指定黑名单数据源以及任何你需要的异常或本地覆盖的地方。\n\n### Note\n在 OpenBSD\
  \ 4.0 及更早版本中（以此此类推，基于 OpenBSD 4.1 之前的版本的端口），`spamd.conf` 位于 `/etc`。从 OpenBSD 4.1\
  \ 开始，`spamd.conf` 位于 `/etc/mail`。FreeBSD 端口在 `/usr/local/etc/spamd/spamd.conf.sample`\
  \ 中安装了一个示例配置。\n\n在 `spamd.conf` 的开头附近，你会注意到有一行没有 `#` 注释符号的、看起来像 `all:\\` 的行。此行指定了你将使用的黑名单。这里是一个示例：\n\
  \n```\nall:\\\n:uatraps:whitelist:\n```\n\n在 `all:\\` 下方添加所有你想使用的黑名单，并用冒号分隔。例如：\n\
  \n```\nuatraps:\\\n        black:\\\n        msg=\"您的地址在过去 24 小时内发送过垃圾邮件\":\n  \
  \      method=http:\\\n        file=www.openbsd.org/spamd/traplist.gz\n```\n\n紧随名称\
  \ uatraps，第一个字段指定了列表类型——在此处为黑。`msg` 字段包含了给黑名单发送者的消息。`method` 字段指定 `spamd` 如何获取列表——在此处为\
  \ HTTP。其他可能性包括通过 FTP (`ftp`)、文件 (`file`) 或执行外部程序 (`exec`)。最后，`file` 字段指定了 `spamd`\
  \ 期望的文件名。\n\n白名单定义遵循类似的模式，但缺少消息参数：\n\n```\nwhitelist:\\\n        white:\\\n    \
  \    method=file:\\\n        file=/etc/mail/whitelist.txt\n```\n\n### Note\n*当前\
  \ spamd.conf 中建议的黑名单维护活跃，且很少出现误报。然而，该文件的早期版本还建议排除互联网的大区块，包括几个声称覆盖整个国家的地址范围。如果你的站点预计与这些任何国家进行合法邮件交换，这些列表可能不适用于你的设置。其他流行的列表已知某些会将整个\
  \ /16 段列为垃圾邮件源。*\n\n在 OpenBSD 的 `/etc/rc.local` 或 FreeBSD/NetBSD 的 `/etc/rc.conf`\
  \ 中放入 `spamd` 的行以及你想要的启动参数。这里是一个示例：\n\n```\nspamd_flags=\"-v -b\" # 普通使用：查看 spamd-setup(8)\n\
  ```\n\n在这里，我们启用 `spamd` 并通过 `-b` 标志以黑名单模式运行。此外，`-v` 标志启用详细日志有助于跟踪 `spamd` 的活动。\n\
  \n在 FreeBSD 上，控制 `spamd` 行为的 `rc.conf` 设置是 `obspamd_enable`（它应设置为 `\"YES\"` 以启用\
  \ `spamd`）和 `obspamd_flags`（你可以在此处填写 `spamd` 的任何命令行选项）：\n\n```\nobspamd_enable=\"\
  YES\"\nobspamd_flags=\"-v -b\"\n```\n\n\n\n要在 OpenBSD 4.1 或更高版本上让 `spamd` 以纯黑名单模式运行，你可以通过将\
  \ `spamd_black` 变量设置为“YES”并重启 `spamd` 来实现相同的效果。\n\n完成设置编辑后，使用你需要的选项启动 `spamd`，并使用\
  \ `spamd-setup` 完成配置。最后，创建一个 `cron` 任务调用 `spamd-setup` 以按合理的间隔更新黑名单。在纯黑名单模式下，你可以使用\
  \ `pfctl` 表命令查看并操作表内容。\n\n### spamd 日志\n\n默认情况下，`spamd` 将日志记录在你的通用系统日志中。要将 `spamd`\
  \ 日志消息发送到单独的日志文件中，可以在 `syslog.conf` 中添加如下条目：\n\n```\n!!spamd\ndaemon.err;daemon.warn;daemon.info;daemon.debug\
  \         /var/log/spamd\n```\n\n当你确认 `spamd` 正在运行并按预期工作后，你可能还想将 `spamd` 日志文件添加到你的日志轮转（log\
  \ rotations）中。在运行 `spamd-setup` 且填充填充后，你可以使用 `pfctl` 查看表内容。\n\n### 注意\n\n在本节开头的示例\
  \ `pf.conf` 片段中，`rdr-to` 规则也是一条 pass 规则。如果你选择的是匹配规则（match rule）（或者你正在使用旧版本的 PF 并且选择编写一个不包含\
  \ pass 部分的 rdr 规则），请务必设置 pass 规则以允许流量通过你的重定向。你可能还需要设置规则以允许合法的邮件通过。然而，如果你已经在网络上运行了电子邮件服务，你可能可以继续使用旧的\
  \ SMTP pass 规则。\n\n在有一组可靠且维护良好的黑名单的情况下，纯黑名单模式下的 `spamd` 在减少垃圾邮件方面表现良好。然而，通过纯黑名单，你只能捕获来自那些已经尝试在其他地方发送垃圾邮件的主机的流量，而且你必须信任外部数据源来决定哪些主机应该被节流（tarpitted）。对于一种能够对网络级行为提供更即时响应并在防止垃圾邮件方面提供实际收益的设置，请考虑灰白名单（greylisting），这是现代\
  \ `spamd` 工作的关键部分。\n\n### 灰白名单：我的管理员告诉我不要和陌生人说话\n\n灰白名单主要由解释当前的 SMTP 标准并添加一点小谎言来让生活变得简单组成。\n\
  \n垃圾邮件发送者倾向于使用他人的设备来发送信息，而他们在未经所有者许可的情况下安装的软件必须足够轻量以便在不被发现的情况下运行。与合法的邮件发送者不同，垃圾邮件发送者通常不认为他们发送的任何单独消息是重要的。综合来看，这意味着典型的垃圾邮件和恶意软件发送软件并没有配置为正确解释\
  \ SMTP 状态码。这是一个我们可以利用的的事实，正如 Evan Harris 在他 2003 年名为《垃圾邮件控制战争的下一步：灰白名单》的论文中所提出的那样样。\n\
  \n正如 Harris 所指出的，当使用受损的机器用于发送垃圾邮件时，发送程序倾向于只尝试交付一次，而不检查任何结果或返回码。真实的 SMTP 实现会解释 SMTP\
  \ 返回码并据此采取行动，而真实的邮件服务器在初始尝试因任何种类的临时错误而失败时会进行重试。\n\n在论文中，Harris 概述了一种实用的方法：\n\n-\
  \ 对于来自先未知通信伙伴的首次 SMTP 联系，不要在第一次交付尝试时接收邮件，而是响应一个指示临时临时问题的状态码，并存储发送者 IP 地址以备后参考。\n\
  - 如果发送者立即重试，则像以前一样回复临时失败状态码。\n- 如果发送者在设定的最小时间（例如 1 小时）后重试，但没有超过最大等待时间（例如 4 小时），则接受消息交付并将发送者\
  \ IP 地址记录在你的白列表中。\n\n这就是灰白名单的精髓。幸运的是，你可以在配备 PF 的网关上设置并维护灰白名单 `spamd`。\n\n### 在灰白名单模式下设置\
  \ spamd\n\nOpenBSD 的 `spamd` 在 OpenBSD 3.5 中获得了使用灰白名单的能力。从 OpenBSD 4.1 开始，`spamd`\
  \ 默认以灰白名单模式运行。\n\n在默认的灰白名单模式下，上一节描述的用于黑名单的 `spamd` 表变得多余了。你仍然可以使用黑名单，但 `spamd` 将结合用于黑名单数据的私有数据结构和\
  \ `spamdb` 数据库来存储灰白名单相关的数据。默认模式下 `spamd` 的典型规则集如下：\n\n```\ntable <spamd-white> persist\n\
  table <nospamd> persist file \"/etc/mail/nospamd\"\npass in log on egress proto\
  \ tcp to port smtp \\\n            rdr-to 127.0.0.1 port spamd\npass in log on egress\
  \ proto tcp from <nospamd> to port smtp\npass in log on egress proto tcp from <spamd-white>\
  \ to port smtp\npass out log on egress proto tcp to port smtp\n```\n\n这包含了必要的 `pass`\
  \ 规则，允许合法邮件从你的网络流向预期目的地。`<spamd-white>` 表是白名单，由 `spamd` 维护。`<spamd-white>` 表中的主机已经通过了灰白名单关卡，这些机器的邮件被允许通过。\n\
  \n在你的网络中，你可能想收紧这些规则，仅允许允许发送的主机之间通过 SMTP。`nospamd` 表确保了 SMTP 流量通过。\n\n在非 OpenBSD\
  \ 4.7 的语法中，以下是等效写法：\n\n```\ntable <spamd-white> persist\ntable <nospamd> persist\
  \ file \"/etc/mail/nospamd\"\nrdr pass in on egress proto tcp to port smtp \\\n\
  \            -> 127.0.0.1 port spamd\npass in log on egress proto tcp from <nospamd>\
  \ to port smtp\npass in log on egress proto tcp from <spamd-white> to port smtp\n\
  pass out log on egress proto tcp to port smtp\n```\n\n在 FreeBSD 上，为了在灰白名单模式下使用 `spamd`，你需要挂载一个位于\
  \ `/dev/fd` 的文件描述符系统（`man 5 fdescfs`）。要实现这一点，在 `/etc/fstab` 中添加以下行，并确保内核中包含了 `fdescfs`\
  \ 代码，无论是编译进去的还是通过适当的 `kldload` 命令加载的。\n\n开始配置 spamd，将 `spamd` 的行和你需要的启动参数放在 `/etc/rc.conf.local`\
  \ 中。例如：\n\n```\nspamd_flags=\"-v -G 2:4:864\" # for normal use: \"\" and see spamd-setup(8)\n\
  ```\n\n在 FreeBSD 上，等效行应该放在 `/etc/rc.conf` 中：\n\n```\nobspamd_flags=\"-v -G 2:4:864\"\
  \ # for normal use: \"\" and see spamd-setup(8)\n```\n\n### 为什么灰白名单有效\n\n人们投入了大量的设计和开发努力，使如\
  \ SMTP 电子邮件传输等基本服务具有容错能力。在实践中，这意味着诸如 SMTP 等服务的尽力而已经尽可能接近于消息交付的完美记录。这就是为什么我们可以依靠灰白名单来最终让我们从正确的邮件服务器接收邮件。\n\
  \n互联网电子邮件传输当前标准定义在 RFC 5321 中。以下是第 4.5.4.1 节“发送策略”的几段节录：\n\n\n\n\n\n> “在一个典型的系统中，组合消息的程序具有某种方法来请求对新的发出的邮件进行立即关注，而无法立即传输的邮件必须排队，并由发送者定期重试。\
  \ . . .\n>\n> “发送者在一次尝试失败后，*必须*延迟对特定目的进行重试。通常情况下，重试间隔*应该* 至少为 30 分钟；然而，当 SMTP 客户端能够确定无法投递的原因时，更复杂且多变的策略将大有益处。\n\
  >\n> “重试一直持续直到消息传输或发送者放弃；放弃时间通常需要至少 4–5 天。”\n\n发送电子邮件是一个协作的、尽力而为的过程，RFC 明确指出，如果你尝试发送邮件的站点报告目前无法接收，那么你的职责（一项强制性要求）就是稍后重试，给接收服务器一个从其问题中恢复的机会。\n\
  \n灰名单列表（greylisting）的巧妙之处在于它是一个方便的谎言。当我们声称遇到了临时的本地问题时，该问题实际上等同于“我的管理员告诉我不要和陌生人说话”。带有有效消息的良好发送者会再次调用，但垃圾邮件发送者不会等待尝试的机会，因为这样做会增加他们发送消息的成本。这就是为什么灰名单机制仍然有效，而且由于基于严格遵守已接受的标准，误报的情况非常罕见。\n\
  \n用冒号分隔的列表 `2:4:864` 代表 `passtime`、`greyexp` 和 `whiteexp` 的值：\n\n*   `passtime`\
  \ 表示 `spamd` 认为重试前合理时间的最小分钟数。默认值为 25 分钟，但在这里我们将其缩短到了 2 分钟。\n*   `greyexp` 是条目在灰名单状态下保留的小时，直到它从数据库中移除。\n\
  *   `whiteexp` 决定白名单条目的时长。`greyexp` 和 `whiteexp` 的默认值分别为 4 小时和 864 小时（略大于 1 个月）。\n\
  \n## 实践中的灰名单\n\n实施灰名单的站点的用户和管理员倾向于认为，灰名单消除了他们大部分的垃圾邮件，他们对邮件实施的任何内容过滤负载也显著下降。我们将首先通过日志文件查看\
  \ `spamd` 灰名单的状况，然后带回一些数据。\n\n如果你在启动 `spamd` 时使用 `-v` 命令行选项进行详细日志记录，你的日志将包含 IP 地址之外的几项更多信息。使用详细日志后，典型的日志摘要如下：\n\
  \n```\nOct 2 19:53:21 delilah spamd[26905]: 65.210.185.131: connected (1/1), lists:\
  \ spews1\nOct 2 19:55:04 delilah spamd[26905]: 83.23.213.115: connected (2/1)\n\
  Oct 2 19:55:05 delilah spamd[26905]: (GREY) 83.23.213.115: <gilbert@keyholes.net>\
  \ ->\n<wkitp98zpu.fsf@datadok.no>\nOct 2 19:55:05 delilah spamd[26905]: 83.23.213.115:\
  \ disconnected after 0 seconds.\nOct 2 19:55:05 delilah spamd[26905]: 83.23.213.115:\
  \ connected (2/1)\nOct 2 19:55:06 delilah spamd[26905]: (GREY) 83.23.213.115: <gilbert@keyholes.net>\
  \ ->\n<wkitp98zpu.fsf@datadok.no>\nOct 2 19:55:06 delilah spamd[26905]: 83.23.213.115:\
  \ disconnected after 1 seconds.\nOct 2 19:57:07 delilah spamd[26905]: (BLACK) 65.210.185.131:\
  \ <bounce-3C7E0A4B3@branch15.\nsummer-bargain.com> -> <adm@dataped.no>\nOct 2 19:58:50\
  \ delilah spamd[26905]: 65.210.185.131: From: Auto Insurance Savings <noreply@\n\
  branch15.summer-bargain.com>\nOct 2 19:58:50 delilah spamd[26905]: 65.210.185.131:\
  \ Subject: Start SAVING on Auto\ninsurance\nOct 2 19:58:50 delilah spamd[26905]:\
  \ 65.210.185.131: To: adm@dataped.no\nOct 2 20:00:05 delilah spamd[26905]: 65.210.185.131:\
  \ disconnected after 404 seconds. lists:\nspews1\nOct 2 20:03:48 delilah spamd[26905]:\
  \ 222.240.6.118: connected (1/0)\nOct 2 20:03:48 delilah spamd[26905]: 222.240.6.118:\
  \ disconnected after 0 seconds.\nOct 2 20:06:51 delilah spamd[26905]: 24.71.110.10:\
  \ connected (1/1), lists: spews1\nOct 2 20:07:00 delilah spamd[26905]: 221.196.37.249:\
  \ connected (1/1)\nOct 2 20:07:00 delilah spamd[26905]: 221.196.37.249: disconnected\
  \ after 0 seconds.\nOct 2 20:07:12 delilah spamd[26905]: 24.71.110.10: disconnected\
  \ after 21 seconds. lists:\nspews1\n```\n\n第一行是来自 `spews1` 黑名单机器的连接开始。接六行显示了另一台机器的两次连接尝试完整记录，每次都是作为第二次连接的。这台第二个机器不在任何黑名单中，因此它被灰名单了。注意灰名单机器尝试投递的那个奇特邮件\
  \ `wkitp98zpu.fsf@datadok.no`。我们将在灰色陷阱（grey trapping）中查看一个实技巧。地址前的 `(GREY)` 和 `(BLACK)`\
  \ 表示灰名单或黑名单。然后黑名单主机有更多活动，稍后我们看到在 404 秒（或 6 分钟 44 秒）之后，黑名单主机放弃了未完成投递。\n\n剩余行显示了几个非常短的连接，包括一个来自已经在黑名单中的机器的连接。然而，这次机器断开连接太快，在\
  \ SMTP 对话开始时没有看到 `(BLACK)` 标记，但我们在结尾看到了对列表名 (`spews1`) 的引用。\n\n大约 400 秒大约是幼稚黑名单垃圾邮件发送者停留的时间（根据各个站点的数据），以及以每秒\
  \ 1 字节的速度完成 `EHLO` 对话直到 `spamd` 拒绝消息所需的时间。然而，在偷看日志时，你可能会发现一些停留时间长得垃圾邮件发送者。例如，在我们办公室网关的数据中，有一条日志记录非常突出：\n\
  \n```\nDec 11 23:57:24 delilah spamd[32048]: 69.40.26: connected (1/1), lists:\n\
  spamhaus spews1 spews2\nDec 12 00:30:08 delilah spamd[32048]: 69.40.26: disconnected\
  \ after 1964\nseconds. lists: spamhaus spews1 spews2\n```\n\n这台特定的机器在 12 月 9 日至\
  \ 12 月 12 日期间尝试 13 次投递时，已经在几个黑名单中了。最后一次尝试持续了 32 分 44 秒，未完成投递。相对智能的垃圾邮件发送者在前几秒内断开连接，就像第一个日志片段中的那样。其他在大约\
  \ 400 秒后放弃。少数几个持续了几个小时。（我们记录的最极端情况持续了 42,673 秒，几乎是 12 小时。）\n\n## 跟踪你的真实连接：spamlogd\n\
  \n在后台，很少被提到且几乎没有文档的是 `spamd` 最重要的助手程序之一：`spamlogd` 白名单更新器。正如名称所示，`spamlogd` 在后台静默运行，记录指向和离开你邮件服务器的连接以更新你的白名单。这种想法是确保你经常通信的主机之间发送的有效邮件以最少麻烦通过。\n\
  \n### 注意\n\n如果你一直学习到这里，`spamlogd` 可能已经自动启动了。然而，如果你最初的 `spamd` 配置没有包含灰名单，`spamlogd`\
  \ 可能没有启动，你可能会遇到奇怪的症状，例如灰名单和白名单没有正确更新。在启用灰名单后重启 `spamd` 应该确保 `spamlogd` 被加载并可用。\n\
  \n为了正常工作，`spamlogd` 需要你记录指向和离开你邮件服务器的 SMTP 连接，正如我们在第 5 章的示例规则集中做样：\n\n```\nemailserver\
  \ = \"192.0.2.225\"\npass log proto tcp to $emailserver port $email\npass log proto\
  \ tcp from $emailserver to port smtp\n```\n\n\n\n\n\n在 OpenBSD 4.1 及更高版本（以及等效版本）中，你可以创建多个\
  \ `pflog` 接口并指定记录规则的位置。以下是如何将 `spamlogd` 需要读取的数据与你的 PF 日志隔离开的方法：\n\n1.  使用 `ifconfig\
  \ pflog1 create` 创建一个独立的 `pflog1` 接口，或者创建一个仅包含 `up` 一行的 `hostname.pflog1` 文件。\n\n\
  2.  将规则更改为以下内容：\n\n```\npass log (to pflog1) proto tcp to $emailserver port $email\n\
  pass log (to pflog1) proto tcp from $emailserver to port smtp\n```\n\n3.  在 `spamlogd`\
  \ 的启动参数中添加 `-l pflog1`。\n\n这会将与 `spamd` 相关的日志与其他日志隔离开来。（有关日志的更多信息，请参阅第 9 章）。\n\n\
  在启用上述规则后，`spamlogd`会将你发送的邮件的接收方 IP 地址添加到白名单。这并不能保证回复会立即通过，但在大多数配置下，它能显著提高速度。\n\n\
  ### 灰名单捕获 (Greytrapping)\n\n我们知道垃圾邮件发送者很少使用完全符合标准的 SMTP 实现来发送信息，这就是为什么灰名单（greylisting）有效的原因。我们也知道，垃圾邮件发送者很少检查他们提供给劫持机器的地址是否真的可以送达。结合这些事实你可以发现，如果一个灰名单中的机器尝试向你域名中的一个无效地址发送信息，那么该信息很有可能是垃圾邮件或恶意软件。\n\
  \n这种认识导致了 `spamd` 开发的下一个进化步骤——一种被称为“灰名单捕获”（greytrapping）的技术。当灰名单主机尝试向我们域名中的已知坏地址投递邮件时，该主机会被添加到名为\
  \ `spamd-greytrap` 的本地维护黑名单。`spamd-greytrap` 列表成员将受到与其他黑名单成员相同的每秒 1 字节的慢速（tarpitting）处理。\n\
  \n在 `spamd` 中实现的灰名单捕获简单而优雅。作为起点，你主要需要的是运行在灰名单模式下的 `spamd`。另一个关键组件是你服务器处理邮件的域名中的地址列表，但仅限于那些确定永远不会接收合法邮件的地址。你列表中的地址数量并不重要，但必须至少有一个，而上限主要取决于你想要添加多少个地址。\n\
  \n接下来，你使用 `spamdb` 将你的列表喂给灰名单捕获功能，然后坐在一旁观察。首先，一个发送者尝试向你的灰名单列表上的地址发送邮件，会被简单的灰名单，就像任何你从未交换过邮件的发送者一样。如果同一台机器再次尝试（无论是向同一个无效地址还是灰名单捕获列表上的另一个地址），就会触发捕获，违规者将被放入\
  \ `spamd-greytrap` 中持续 24 小时。在接下来的 24 小时内，来自捕获主机的任何 SMTP 流量将断断续续，以每次 1 字节的速度回复。\n\
  \n这 24 小时足够短到不会对正常流量造成严重干扰，因为真实的 SMTP 实现会持续尝试投递几天。该技术的大规模应用经验表明，它很少产生误报。在 24 小时后继续发送垃圾邮件的机器很快会回到慢速陷阱中。\n\
  \n要设置捕获列表（traplist），请使用 `spamdb` 的 `-T` 选项。在我的案例中，之前在灰名单实践`中提到的奇怪地址 `[fn24]` 是一个自然的候选对象：\n\
  \n```\n$ sudo spamdb -T -a wkitp98zpu.fsf@datadok.no\n```\n\n我实际输入的命令是 `$ sudo spamdb\
  \ -T -a \"<wkitp98zpu.fsf@datadok.no>\"`。在 OpenBSD 4.1 和更高版本中，`spamdb` 不需要角括号或引号，但它也能接受。\n\
  \n你可以添加尽可能数量的地址。我倾向于通过查看灰名单和邮件服务器日志，寻找向我域名中不存在的地址投递失败报告的失败尝试，以此为我的本地垃圾邮件陷阱地址列表寻找新条目（是的，这听起来确实很疯狂）。\n\
  \n### 警告\n\n确保你添加到到垃圾邮件陷阱列表的地址是无效的且将保持无效。一旦发现自己把一个有效地址变成了垃圾邮件陷阱（即使是暂时的），那种尴尬是无与伦比的。\n\
  \n下面的日志片段显示了一个发送垃圾邮件的机器在首次接触时被列入灰名单，然后回来笨拙地尝试向我添加到捕获列表的奇地址投递信息，结果在几分钟后进入了 `spamd-greytrap`\
  \ 黑名单。我们知道它在接下来的 20 多小时里将做什么。\n\n```\nNov 6 09:50:25 delilah spamd[23576]: 210.214.12.57:\
  \ connected (1/0)\nNov 6 09:50:32 delilah spamd[23576]: 210.214.12.57: connected\
  \ (2/0)\nNov 6 09:50:40 delilah spamd[23576]: 210.214.12.57: (GREY) grebert@keyholes.net\
  \ -> wkitp98zpu.fsf@ok..\nNov 6 09:50:40 delilah spamd[23576]: 210.214.12.57: disconnected\
  \ 15 seconds\nNov 6 09:50:42 delilah spamd[23576]: 210.214.12.57: connected (2/0)\n\
  Nov 6 09:50:45 delilah spamd[23576]: 210.214.12.57: (GREY) bounce-3C7E04B3@branch15.mailz.com\
  \ -> adm@dataped\nNov 6 09:50:45 delilah spamd[23576]: 210.214.12.57: disconnected\
  \ 13 seconds\nNov 6 09:50:50 delilah spamd[23576]: 210.214.12.57: connected (2/0)\n\
  Nov 6 09:51:00 delilah spamd[23576]: 210.214.12.57: (GREY) grebert@keyholes.net\
  \ -> wkitp98zpu.fsf@datadok.no\nNov 6 09:51:00 delilah spamd[23576]: 210.214.12.57:\
  \ disconnected 18 seconds\nNov 6 09:51:02 delilah spamd[23576]: 210.214.12.57: connected\
  \ (2/0)\nNov 6 09:51:02 delilah spamd[23576]: 210.214.12.57: disconnected 12 seconds\n\
  Nov 6 09:51:02 delilah spamd[23576]: 210.214.12.57: connected (2/0)\nNov 6 09:51:18\
  \ delilah spamd[23576]: 210.214.12.57: (GREY) grebert@keyholes.net -> wkitp98zpu.fsf@datadok.no\n\
  Nov 6 09:51:18 delilah spamd[23576]: 210.214.12.57: disconnected 16 seconds\nNov\
  \ 6 09:51:18 delilah spamd[23576]: 210.214.12.57: (GREY) bounce-3C7E04B3@branch15.mailz.com\
  \ -> adm@dataped\nNov 6 09:51:18 delilah spamd[23576]: 210.214.12.57: disconnected\
  \ 16 seconds\n```\n\n要设置捕获列表，请使用 `spamdb` 的 `-T` 选项。在我的案例中，我之前在[灰名单实践]中提到的奇怪地址 `[fn24]`\
  \ 是一个自然的候选对象：\n\n```\n$ sudo spamdb -T -a wkitp98zpu.fsf@datadok.no\n```\n\n我实际输入的命令是\
  \ `$ sudo spamdb -T -a \"<wkitp98zpu.fsf@datadok.no>\"`。在 OpenBSD 4.1 和更高版本中，`spamdb`\
  \ 不需要角括号或引号，但它也能接受。\n\n你可以添加尽可能数量的地址。我倾向于通过查看灰名单和邮件服务器日志，寻找向我域名中不存在的地址投递失败报告的失败尝试，以此为我的本地垃圾邮件陷阱地址列表寻找新条目（是的，这听起来确实很疯狂）。\n\
  \n### 警告\n\n确保你添加到到垃圾邮件陷阱列表的地址是无效的且将保持无效。一旦发现自己把一个有效地址变成了垃圾邮件陷阱（即使是暂时的），那种尴尬是无与伦比的。\n\
  \n下面的日志片段显示了一个发送垃圾邮件的机器在首次接触时被列入灰名单，然后回来笨拙地尝试向我添加到捕获列表的奇地址投递信息，结果在几分钟后进入了 `spamd-greytrap`\
  \ 黑名单。我们知道它在接下来的 20 多小时里将做什么。\n\n```\nNov 6 09:50:25 delilah spamd[23576]: 210.214.12.57:\
  \ connected (1/0)\nNov 6 09:50:32 delilah spamd[23576]: 210.214.12.57: connected\
  \ (2/0)\nNov 6 09:50:40 delilah spamd[23576]: 210.214.12.57: (GREY) grebert@keyholes.net\
  \ -> wkitp98zpu.fsf@datadok.no\nNov 6 09:50:40 delilah spamd[23576]: 210.214.12.57:\
  \ disconnected 15 seconds\nNov 6 09:50:42 delilah spamd[23576]: 210.214.12.57: connected\
  \ (2/0)\nNov 6 09:50:45 delilah spamd[23576]: 210.214.12.57: (GREY) bounce-3C7E04B3@branch15.mailz.com\
  \ -> adm@dataped\nNov 6 09:50:45 delilah spamd[23576]: 210.214.12.57: disconnected\
  \ 13 seconds\nNov 6 09:50:50 delilah spamd[23576]: 210.214.12.57: connected (2/0)\n\
  Nov 6 09:51:00 delilah spamd[23576]: 210.214.12.57: (GREY) grebert@keyholes.net\
  \ -> wkitp98zpu.fsf@datadok.no\nNov 6 09:51:00 delilah spamd[23576]: 210.214.12.57:\
  \ disconnected 18 seconds\nNov 6 09:51:02 delilah spamd[23576]: 210.214.12.57: connected\
  \ (2/0)\nNov 6 09:51:02 delilah spamd[23576]: 210.214.12.57: disconnected 12 seconds\n\
  Nov 6 09:51:02 delilah spamd[23576]: 210.214.12.57: connected (2/0)\nNov 6 09:51:18\
  \ delilah spamd[23576]: 210.214.12.57: (GREY) grebert@keyholes.net -> wkitp98zpu.fsf@datadok.no\n\
  Nov 6 09:51:18 delilah spamd[23576]: 210.214.12.57: disconnected 16 seconds\nNov\
  \ 6 09:51:18 delilah spamd[23576]: 210.214.12.57: (GREY) bounce-3C7E04B3@branch15.mailz.com\
  \ -> adm@dataped\nNov 6 09:51:18 delilah spamd[23576]: 210.214.12.57: disconnected\
  \ 16 seconds\n```\n\n作为侧面说明，看起来即使垃圾邮件发送者换了不同的机器进行发送，发件人和收件人地址也保持不变。他仍然尝试向一个从未可以送达的地址发送邮件，这强烈表明该垃圾发送者并不频繁检查他的列表。\n\
  \n### 使用 spamdb 管理列表\n\n你可能需要查看或更改黑名单、白名单和灰名单的内容。这些记录位于 `/var/db/spamdb` 数据库中，管理员管理这些列表的主要接口是\
  \ `spamdb`。\n\n早期版本的 `spamdb` 仅提供了向数据库添加或更新现有白名单项的选项（`spamdb -a`）。你可以删除白名单项（`spamdb\
  \ -d`）来补偿所使用的黑名单或灰名单算法的缺陷。新版本的 `spamdb` 提供了一些支持灰名单捕获的新功能。\n\n#### 更新列表\n\n如果你不带任何参数就运行\
  \ `spamdb`，它将列出你的 `spamdb` 数据库的内容，并允许你添加或删除垃圾陷阱地址和捕获列表项。你也可以随时添加白名单项。\n\n\n\n\n\n\
  如果你想将一个主机添加到白名单，但又不想将其添加到永久的 `nospamd` 文件并重新加载规则集或表，你可以直接从命令行执行此操作，如下所示：\n\n```\n\
  $ sudo spamdb -a 213.187.179.198\n```\n\n即使你付尽了努力，如果垃圾邮件发送者仍然投递了邮件，你可以通过以下方式将该发送者添加到\
  \ `spamd-greytrap` 列表来纠正这一局面：\n\n```\n$ sudo spamdb -a -t 192.168.2.128\n```\n\n\
  添加新的陷阱地址也同样简单：\n\n```\n$ sudo spamdb -a -T _-medvetsky@ehtrib.org\n```\n\n如果你想撤销上述任何一个决定，只需在这两个命令中将\
  \ `-a` 替换为 `-d` 即可。\n\n### 保持 spamd 灰名单同步\n\n从 OpenBSD 4.1 开始，`spamd` 可以在任意数量协作的灰名单网关之间同步灰名单数据库。其实现方式是通过一组\
  \ `spamd` 命令行选项：\n\n* `-Y` 选项指定一个 `sync target`（同步目标）——即你希望通知其灰名单信息更新的其它运行 `spamd`\
  \ 的网关的 IP 地址。\n* 在接收端，`-y` 选项指定一个 `sync listener`（同步监听器），即该 `spamd` 实例准备接收来自其他主机灰名单更新的地址或接口。\n\
  \n例如，我们的主 `spamd` 网关 `mainoffice-gw.example.com` 可能会在其启动命令行中添加以下选项，分别建立同步目标和同步监听器：\n\
  \n```\n-Y minorbranch-gw.example.com -y mainoffice-gw.example.com\n```\n\n相反，分机构办公室的\
  \ `minorbranch-gw.example.com` 的主机名则将反过来：\n\n```\n-Y mainoffice-gw.example.com -y\
  \ minorbranch-gw.example.com\n```\n\n`spamd` 守护进程支持同步伙伴之间的共享密钥认证。具体来说，如果你创建了 `/etc/mail/spd.key`\
  \ 文件并将其副本分发给所有同步伙伴，它将被用于计算认证所需的校验和。`spamd.key` 文件本身可以是任何类型的数据，如 `spamd` 手页建议的、从\
  \ `/dev/arandom` 收集的随机数据。\n\n### 注意\n\n在直接同步 `spamd` 相关数据不实际，或者你只是只想与他人共享你的 `spamd-greytrap`\
  \ 的情况下，将本地捕获的垃圾邮件发送者列表导出到文本文件可能是理想的。`spamd-setup` get 列表格式是每行一个地址，可选包含以一个或多个 `#`\
  \ 字符开头的注释行。通过 `spamdb`、`grep` 和一点想象力组合成单行命令，将当前捕获的地址列表导出为可用的格式非常简单。\n\n### 检测异常顺序的\
  \ MX 使用\n\nOpenBSD 4.1 使 `spamd` 具备了检测异常 MX 使用的能力。首先联系备用邮件交换服务器而不是尝试主邮件服务器是一个广为人知的垃圾邮件发送者技巧，而且这与我们对普通邮件传输代理期望的行为相反。换句话说，如果有人以错误的顺序尝试邮件交换服务器，我们几乎可以确定他们正在尝试投递垃圾邮件。\n\
  \n对于主邮件服务器为 192.0.2.225、备份服务器为 192.0.2.224 的 `example.com` 域名，在 `spamd` 的启动选项中添加\
  \ `-M 192.0.2.224` 意味着任何在联系 192.0.2.225 的主邮件服务器之前通过 SMTP 联系 192.0.2.224 的主机都将被添加到本地\
  \ `spamdgreytrap` 列表中，持续 24 小时。\n\n### 处理与灰名单不兼容的站点\n\n遗憾的是，在某些情况下，你需要补偿其他站点邮件设置的特殊性。\n\
  \n任何在灰名单保留其数据期间未联系过你的站点发送的第一封邮件都将延迟一段随机时间，这主要取决于发送者的重试间隔。有时即使是极微的延迟也是不可取的。例如，如果你有一些不常联系的客户在他们联系你时要求你立即紧急关注他们的业务，那么长达数小时的初始投递延迟可能并非最优。此外，你不可避免遇到配置错误的邮件服务器，它们要么完全不重试，要么重试太快，可能在仅尝试一次后就停止投递重试。\n\
  \n此外，某些站点规模大到拥有多个出站 SMTP 服务器，它们与灰名单并不兼容，因为无法保证在投递任何特定邮件时使用与先前的投递尝试相同的 IP 地址。尽管这些站点遵守重试要求，但显而易见，这是灰名单剩余的少数缺点之一。\n\
  \n补偿此类情况的方法之一是定义一个本地白名单表，从文件馈入以防重启。为了确保来自表中地址的 SMTP 流量不被馈送给 `spamd`，请添加 `pass` 规则以允许流量通过：\n\
  \n```\ntable <nospamd> persist file \"/etc/mail/nospamd\"\n```\n\n或者，在预-OpenBSD\
  \ 4.7 版本的语法中，在重定向块顶部添加 `no rdr` 规则以允许来自 `nospamd` 的流量通过：\n\n```\nno rdr proto tcp\
  \ from nospamd to any\n```\n\n当你对 *nospamd* 文件进行这些更改后，使用 `pfctl -f /etc/pf.conf`\
  \ 从更新后的文件加载 `<nospamd>` 表的内容。\n\n### 垃圾邮件斗争技巧\n\n在选择性使用时，黑名单结合 `spamd` 是强大、精确且高效的垃圾邮件斗争工具。这对\
  \ `spamd` 机器的负载最小。另一方面，`spamd` 的性能永远不会优于其最弱的数据源，这意味着你需要监控日志并在需要时白名单。\n\n在纯灰名单模式下运行没有黑名单的\
  \ `spamd` 是可行的。事实上，某些用户报告说，纯灰名单 `spamd` 配置是带有黑名单的配置同样有效的垃圾邮件斗争工具，有时甚至比内容过滤更有效。一个发布在\
  \ *openbsd-misc* 上的此类报告声称，纯灰名单配置立即消除了公司大约 95% 的垃圾邮件负载。（该报告可以通过 *[`marc.info/`](http://marc.info/)*\
  \ 等地方访问；搜索主题为“Followup – spamd greylisting results”的内容即可。）\n\n\n\n\n我推荐两个非常棒的黑名单。一个是\
  \ Bob Beck 的 `traplist`，它基于“过去 Usenet 帖子的幽灵”。该列表由在阿尔伯塔大学运行 `spamd` 的计算机自动生成，Bob\
  \ 的设置是一套标准的 `spamd` 系统，会在 24 小时后自动移除被捕获的地址，这意味着你的误报率极低。主机数量差异很大，曾高达 670,000 个。虽然该列表目前仍处于官方测试阶段，但已于\
  \ 2006 年 1 月公布。你可以通过 [`www.openbsd.org/spamd/traplist.gz`](http://www.openbsd.org/spamd/traplist.gz)\
  \ 获取该列表。它是近期示例 `spamd.conf` 文件中 `uatraps` 黑名单的一部分。\n\n我推荐的另一个列表是 `heise.de` 的 `nixspam`，它具有\
  \ 12 小时自动过期机制且准确性极高。它也位于示例 `spamd.conf` 文件中。关于此列表的详细信息可以从 [`www.heise.de/ix/nixspam/dnsbl_en/`](http://www.heise.de/ix/nixspam/dnsbl_en/)\
  \ 获取。\n\n一旦你对设置感到满意，可以尝试引入本地灰名单机制（greytrapping）。这可能会捕捉到更多的不受欢迎者，而且是一项单纯、有趣的活动。一些有限的实验（在编写本章时进行，记录在\
  \ [`bsdly.blogspot.com/`](http://bsdly.blogspot.com/) 中以 [`bsdly.blogspot.com/2007/07/hey-spammer-heres-list-for-you.html`](http://bsdly.blogspot.com/2007/07/hey-spammer-heres-list-for-you.html)\
  \ 开头的文章中）甚至表明，从邮件服务器日志、`spamd` 日志或直接从你的灰名单中收集垃圾邮件者使用的无效地址并将其放入 `traplist` 是极其高效的。在可见度适中的\
  \ Web 页面上发布该列表似乎可以确保你放入其中的地址会被地址收割机器人反复记录，并为你提供更好的灰名单素材，因为它们更有可能被留在垃圾邮件者的“已知良好地址”列表中。\n\
  \n在本章首次撰写时，这纯粹是理论上的；我还没有收到任何可靠报告显示这种情况正在发生。这种情况在 2012 年发生了变化，当时可靠来源开始报告在奇端口出现暴力破解序列。更多信息请参阅\
  \ [`bsdly.blogspot.com/2013/02/theres-no-protection-in-high-ports.html`](http://bsdly.blogspot.com/2013/02/theres-no-protection-in-high-ports.html)。\n\
  \n关于“Hail Mary Cloud”系列暴力破解尝试的概述，请参阅 [`bsdly.blogspot.com/2013/10/the-hail-mary-cloud-and-lessons-learned.html`](http://bsdly.blogspot.com/2013/10/the-hail-mary-cloud-and-lessons-learned.html)\
  \ 文章《Hail Mary Cloud 与教训》。更多资源在那里以及 附录 A 中引用。\n\n原始的 Harris 论文以及其他有用文章和资源可以在 [`www.greylisting.org/`](http://www.greylisting.org/)\
  \ 找到。\n\n`RFC 5321` 的相关部分与 `RFC 2821` 的对应部分相同，后者已过时。我们中的一些人对 IETF 没有澄清这些正向标准轨道推进的文本片段感到相当失望。我的反应（实际上，这是一段吐槽）见\
  \ [`bsdly.blogspot.com/2008/10/ietf-failed-to-account-for-greylisting.html`](http://bsdly.blogspot.com/2008/10/ietf-failed-to-account-for-greylisting.html)。\n\
  \n`SPF` 记录作为 `TXT` 记录存储在 DNS 区域中。详情请见 [`www.openspf.org/`](http://www.openspf.org/)。\n\
  \n## 第 7 章：使用队列和优先级进行流量整形\n\n![Traffic Shaping with Queues and Priorities](img/trafficatomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n在本章中，我们将研究如何使用流量整形来根据指定的策略高效地分配带宽资源。如果 `traffic shaping`（流量整形）这个术语让你陌生，请放心它的意思正如你认为的那样：你将改变网络分配资源的方式，以满足用户及其应用程序的需求。通过对你的网络流量以及产生流量的应用和用户进行良好的理解，你可以做很多事情。\n\
  \n### 用于流量整型的常开优先级和队列\n\n管理带宽与平衡支票或处理其他稀缺或有限的资源有许多共同点。资源的供应是持续但带有硬性上限，你需要根据策略或规范中设定的优先级以最高效率分配资源。\n\
  \nOpenBSD 5.5 及更高版本提供了通过 PF 规则集中的分类机制管理带宽资源的若干种不同选项。我们将首先查看使用纯流量优先级可以做什么，然后讨论如何通过将定义的流量子集分配到队列来细分你的带宽资源。\n\
  \n\n\n\n始终开启的优先级（always-on priorities）在 OpenBSD 5.0 中作为一种预告被引入。经过几年的开发和测试，新的队列系统最终被提交，并包含在\
  \ 2014 年 5 月 1 日发布的 OpenBSD 5.5 中。如果你正准备在 OpenBSD 5.5 或更高版本从零开始流量整形，或者正在考虑这样做，那么本节将是你的入门指南。如果你是从较版本的\
  \ OpenBSD 升级，或者从另一个 ALTQ 系统迁移到近期的 OpenBSD，你可能会发现以下章节 从 ALTQ 迁移到优先级和队列 很有帮助。\n\n\
  #### 通过设置流量优先级进行整形\n\n如果你主要感兴趣的是将某些类型的流量置于其他流量之前，你可能通过简单的设置优先级来实现你的目标：为某些项目分配较高的优先级，以便它们在其他项目之前获得关注。\n\
  \n##### prio 优先级方案\n\n从 OpenBSD 5.0 开始，提供了一种基于规则的网络流量分类优先级方案。优先级的范围从 0 到 7，其中 0\
  \ 是最低优先级。分配优先级 7 的项目将跳过所有其他项目，而默认值 3 会自动分配给大多数流量。这种优先级方案（在 PF 语法关键字后，你通常被称为 `prio`）是始终开启的，你可以通过\
  \ `match` 或 `pass` 规则设置优先级来微调你的流量。\n\n例如，为了最快地加速你的出站 SSH 流量，你可以在配置中放置如下规则：\n\n```\n\
  pass proto tcp to port ssh set prio 7\n```\n\n这样你的 SSH 流量将会在任何其他流量之前被处理。\n\n然后你可以检查规则集的其他部分，决定哪些流量更重要或不那么重要，哪些流量希望始终到达目的地，以及你认为哪些流量较重要。\n\
  \n为了将你的 Web 流量置于所有流量之前，并提高网络时间和名称解析服务的优先级，你可以使用此类规则修改你的配置：\n\n```\npass proto tcp\
  \ to port { www https } set prio 7\npass proto { udp tcp } to port { domain ntp\
  \ } set prio 6\n```\n\n或者，如果你有一个规则集已经包含了匹配端口以外其他标准的规则，你也可以通过将优先级流量整形写为 `match` 规则来实现类似的效果：\n\
  \n```\nmatch proto tcp to port { www https } set prio 7\nmatch proto { udp tcp }\
  \ to port { domain ntp } set prio 6\n```\n\n在某些网络中，对时间敏感的流量（如 IP 语音 VoIP）可能需要特殊处理。对于\
  \ VoIP，像这样的优先级设置可能会提高电话通话质量：\n\n```\nvoip_ports=\"{ 2027 4569 5036 5060 10000:20000\
  \ }\"\nmatch proto udp to port $voip_ports set prio 7\n```\n\n但务要检查你的 VoIP 应用程序文档，获取有关它使用的特定端口的信息。在任何情况下，使用此类类似的\
  \ `match` 规则也可以通过其他方式对你的配置产生积极影响：你可以使用此处示例中的 `match` 规则来将过滤决策（如通过、阻塞或重定向）与流量整形决策隔离开，有了这种分离，你可能会获得更具可读性且易于维护的配置。\n\
  \n值得注意的是，OpenBSD 网络栈的某些部分为某些类型的流量设置了默认优先级，开发者认为这些流量对于网络正常运行是必需的。如果你没有设置任何优先级，任何带有\
  \ `proto carp` 以及其他一些管理协议和数据包类型的将以优先级 6 通过，而所有没有通过 `set prio` 规则接收特定分类的流量类型将具有默认优先级\
  \ 3。\n\n##### 双优先级加速技巧\n\n在刚才的示例中，我们为不同类型的流量设置了不同的优先级，并成功让特定类型的流量（如 VoIP 和 SSH）比其他流量移动得。但得益于携带你大部分流量的\
  \ TCP 设计，只需对规则集进行细微调整，简单的优先级整形方案就能提供更多功能。\n\n正如 RFC 的读者和一些从业者发现的那样，TCP 的面向连接设计意味着对于发送的每个数据包，发送方都期望在预设时间内或匹配定义的序列号“窗口”内接收确认（ACK）包。如果发送方在预期限制内没有收到确认，则假设数据包在传输过程中丢失，并安排重新发送数据。\n\
  \n另一个需要考虑的重要因素是，默认情况下，数据包按照到达的顺序进行处理。这被称为先入先出（FIFO），这意味着本质上没有数据的 ACK 包将在较大的数据包之间等待轮次。在繁忙或拥塞的链路上（这正是流量整形变得有趣的地方），等待\
  \ ACK 和执行重传会显著地消耗有效带宽并减慢所有传输。事实上，双方向的并发传输对彼此的减速影响远大于其预期数据大小的值。\n\n幸运的是，这个问题有一个简单且相当流行的解决方案现手可用：你可以使用优先级来确保那些较小的数据包跳到前面。如果你在\
  \ `match` 或 `pass` 规则中分配两个优先级，例如：\n\n```\nmatch out on egress set prio (5, 6)\n\
  ```\n\n第一个优先级将分配给普通流量，而 ACK 包和其他具有低延迟服务类型（ToS）的数据包将获得分配第二个优先级，并比普通数据包处理得更快。\n\n\
  当数据包到达时，PF 会检测 ACK 包并将其放入高优先级队列中。PF 还会检查到达数据包的 ToS 字段。将 ToS 设置为低延迟以表示发送方希望更快速交付的数据包也将获得高优先级处理。当指示多个优先级时（如前面的规则所示），PF\
  \ 会相应分配优先级。其他 ToS 值的数据包按其到达顺序处理，但由于 ACK 包到达得更快，发送方等待 ACK 和重发可能丢失的数据的时间就会更短。最终结果是可用带宽被更有效地利用。（引用的\
  \ `match` 规则是我在 OpenBSD 5.0 开发周期内提交后不久，为了感受新的 `prio` 功能而编写的第一条规则——当然，是在测试系统上。如果你将该单独\
  \ `match` 规则放在现有的规则集之上，可能会发现在出现明显的拥塞症状之前，链路可以承受更多的流量和并发连接。）\n\n#### 引入队列进行带宽分配\n\
  \n\n\n\n我们已经看到，仅使用优先级进行流量整形可能是非常有效的，但在某些情况下，仅基于优先级的方案将无法满足你的目标。其中一种场景是：当你面临某些需求时，最有效的解决方法是为某些类型的流量（例如电子邮件和其他高价值服务）分配更高的优先级以及可能更大的带宽份额，并相应地为其他流量分配较少的带宽。另一种场景是：你只是简单地将可用带宽以不同大小的分块分配给特定的服务，并可能为某些类型的流量设置硬性上限，同时又要确保你关心的所有流量至少获得其在可用带宽中的公平份额。在这些情况下，你将放弃纯优先级方案（至少不再作为主要工具），并开始使用\
  \ `queues`（队列）进行实际的流量整形。\n\n与优先级级别不同，优先级始终可用且无需额外准备即可使用，而在任何规则中，队列都代表你可用带宽的特定部分，并且只有在你根据可用容量定义了它们后才能使用。队列是用于网络数据包的缓冲区。队列通过特定的带宽定义，或作为可用带宽的特定部分定义，你可以将每个队列带宽份额的部分分配给子队列（即队列中的队列），子队列共享父队列的资源。数据包被保留在队列中，直到根据队列的标准被丢弃或发送，并受队列可用带宽的限制。队列附加到特定的接口上，带宽管理是以接口为单位进行的，而给定接口上的可用带宽被细分为你定义的队列。\n\
  \n定义队列的基本语法遵循此模式：\n\n```\nqueue name on interface bandwidth number [ ,K,M,G]\n \
  \    queue name1 parent name bandwidth number[ ,K,M,G] default\n     queue name2\
  \ parent name bandwidth number[ ,K,M,G]\n     queue name3 parent name bandwidth\
  \ number[ ,K,M,G]\n```\n\n带宽数字后的字母表示测量单位：`K` 表示千比特（kilobits）；`M` 表示兆比特；`G` 表示吉比特。当你只写带宽数字时，它被解释为每秒比特数。在这个基础语法上添加其他选项是可能的，我们在后续示例中看到。\n\
  \n### Note\n> 子队列定义需要命名其父队列，并且必须有一个队列作为默认队列，用于接收任何未专门分配给其他队列的流量。\n\n一旦定义了队列，你就可以通过重写\
  \ `pass` 或 `match` 规则将流量分配给特定队列，从而将流量整形集成到你的规则集中。\n\n## 你的总可用带宽是多少？\n\n一旦我们开始处理总带宽的定义部分，而不是某种方式共享整体的优先级，确定你总可用带宽的确切值就变得有趣了。要确定特定接口上用于队列的实际可用带宽可能是困难的。如果你不指定总带宽，将使用可用总带宽来计算分配，但某些类型的接口无法可靠地报告实际带宽值。这种差异的一个常见例子是：你的网关外部接口是一个\
  \ 100 兆比特 (Mb) 的以太网接口，连接到仅提供 8Mb 下载和 1Mb 上传的 DSL 线路上。此时，以太网接口会理所信地报告 100Mb 的带宽，而不是面向互联网的连接的实际值。\n\
  \n出于这个原因，将总带宽设置为固定值通常是有意义的。遗憾的是，所使用的值可能与带宽供应商告诉你的可用值并不完全相同，因为各种技术和实现总是会产生开销。例如，在典型的有线以太网\
  \ TCP/IP 中，开销可能低至单位数的百分比，但基于 ATM 的 TCP/IP 已知具有接近 20% 的开销。如果你的带宽供应商不提供开销信息，你需要对起始值进行理性的推测。无论什么情况下，请记住可用总带宽永远大于你网络路径中最薄弱环节的带宽。\n\
  \n队列仅支持相对于执行队列的系统的出站连接。在规划带宽管理时，请考虑实际可用带宽等于连接路径中最薄弱（带宽最低）的链路，即使你的队列设置在不同的接口上。\n\n\
  ### HFSC 算法\n\n在 OpenBSD 5.5 及更高版本中使用队列系统定义的任何队列系统，其底层都是`分层公平服务曲线 (Hierarchical\
  \ Fair Service Curve, HFSC)` 算法。HFSC 设计用于在层次结构中的队列之间公平地分配资源。它的有趣特性之一是，在某些流量部分达到其预设限制之前，它不会施加任何限制。该算法在流量达到可能剥夺其他队列保证最小份额的位点之前开始整形。\n\
  \n### Note\n> 我们在书中提供的所有示例配置都将流量分配到输出方向的队列中，因为现实中你只能控制本地生成的流量，而且一旦达到限制，任何流量整形系统最终都会通过丢弃数据包来迫使端点退缩。正如我们在前面的示例中看到的，所有良好的\
  \ TCP 栈都会通过较慢的数据包速率对丢失的 ACK 做出响应。\n\n现在你至少了解了 OpenBSD 队列系统背后的理论基础，让我们来看看队列是如何工作的。\n\
  \n## 将你的带宽划分为固定大小的分块\n\n你经常会发现某些流量应该比其他流量获得更高的优先级。例如，你通常希望重要流量（如邮件和其他关键服务）始终拥有基准可用带宽，而其他服务（如点对点文件共享）不应被允许消耗超过特定数量。为了解决这类问题，队列提供了比纯优先级方案更广泛的选项。\n\
  \n第一个队列示例建立在前面的章节规则集的基础上。场景是：我们有一个小的本地网络，我们希望本地网络的用户连接到其网络外的预定义服务，同时让来自本地网络以外的用户访问本地网络某处的\
  \ Web 服务器和 FTP 服务器。\n\n### 队列定义\n\n在下面的示例中，所有队列都设置在名为 `main` 的根队列上，位于外部接口。这种方法之所以有意义，主要是因为带宽在外部链路上比在本地网络上更容易受到限制。但从原则上讲，可以在任何网络接口上分配队列并运行流量整形。\n\
  \n此设置包含一个总带宽为 20Mb 的队列，带有六个子队列。\n\n```\nqueue main on $ext_if bandwidth 20M\n  \
  \    queue defq parent main bandwidth 3600K default\n      queue ftp parent main\
  \ bandwidth 2000K\n      queue udp parent main bandwidth 6000K\n      queue web\
  \ parent main bandwidth 4000K\n      queue ssh parent main bandwidth 4000K\n   \
  \     queue ssh_interactive parent ssh bandwidth 800K\n        queue ssh_bulk parent\
  \ ssh bandwidth 3200K\nqueue icmp parent main bandwidth 400K\n```\n\n上述示例中的子队列 `defq`\
  \ 分配带宽为 3600K（占带宽的 18%），并被指定为默认队列。这意味着任何匹配 `pass` 规则但未显式分配给其他队列的流量都会进入这里。\n\n\n\n\
  \n其他队列遵循多或少的相同模式，直到子队列 `ssh` 为止，它本身又有两个子队列（其下方的两个缩进行）。在这里，我们看到了这种使用两个独立优先级来加速 ACK\
  \ 数据包技巧的变体，正如我们很快将看到的，将流量分配到两个 `ssh` 子队列的规则分配了不同的优先级。大容量的 `ssh` 传输（通常是 SCP 文件传输）使用指示吞吐量的\
  \ ToS 标志传输，而交互式 `ssh` 流量的 ToS 标志被设置为低延迟，并跳到大容量传输之前。交互式流量可能消耗的带宽较低，占带宽份额也较小，但由于被分配了更高的优先级值，它获得了优先处理。这种方案也有助于提高\
  \ SCP 文件传输的速度，因为 SCP 传输的 ACK 数据包将被分配更高的优先级。\n\n最后，我们有一个 `icmp` 队列，它预留了顶层剩余的 400K（或\
  \ 2%）的带宽。这保证了我们想要通过的 ICMP 流量拥有最小带宽，尽管这些流量并不符合将其分配到其他队列的标准。\n\n### 规则集\n\n为了将队列连接到规则集中，我们使用\
  \ `pass` 规则来指示哪些流量被分配到队列及其标准。\n\n```\nset skip on { lo, $int_if }\npass log quick\
  \ on $ext_if proto tcp to port ssh \\\n    queue (ssh_bulk, ssh_interactive) set\
  \ prio (5,7)\npass in quick on $ext_if proto tcp to port ftp queue ftp\npass in\
  \ quick on $ext_if proto tcp to port www queue http\npass out on $ext_if proto udp\
  \ queue udp\npass out on $ext_if proto icmp queue icmp\npass out on $ext_if proto\
  \ tcp from $localnet to port $client_out ➊\n```\n\n`ssh`、`ftp`、`www`、`udp` 和 `icmp`\
  \ 的规则将流量分配到相应的队列，我们再次注意到 `ssh` 队列的子队列被分配了两种不同优先级的流量。最后一个通用规则 ➊ 允许所有来自本地网络的其他出站流量，将其归入默认的\
  \ `defq` 队列。\n\n你始终可以让一组 `match` 规则来执行队列分配，以使配置更加灵活。有了 `match` 规则，你可以将过滤决策移动到块、pass\
  \ 甚至重定向到其他处的规则集。\n\n```\nmatch log quick on $ext_if proto tcp to port ssh \\\n \
  \   queue (ssh_bulk, ssh_interactive) set prio (5,7)\nmatch in quick on $ext_if\
  \ proto tcp to port ftp queue ftp\nmatch in quick on $ext_if proto tcp to port www\
  \ queue http\nmatch out on $ext_if proto udp queue udp\nmatch out on $ext_if proto\
  \ icmp queue icmp\n```\n\n注意，使用 `match` 规则执行队列分配时，不需要最后的通用规则来将不匹配其他规则的流量放入默认队列。任何不匹配这些规则且允许通过的流量最终将进入默认队列。\n\
  \n### 带有突发流量（Bursts）的上限和下界\n\n固的带宽分配固然很好，但具有流量整形野心的网络管理员在入门后，往往倾向于寻找更多的灵活性。如果存在一种灵活的带宽分配机制，能够为每个队列的可用带宽提供保证的下限和上限，并实现随时间变化的可变分配——而且只有在实际需要时才开始整形，那不是很好吗？\n\
  \n好消息是，OpenBSD 队列可以做到这一点，这得益于之前讨论的底层 HFSC 算法。HFSC 使设置具有保证最小分配和硬上限的队列方案成为可能，你甚至可以拥有包含\
  \ `burst` 值的分配，让可用容量随时间变化。\n\n### 队列定义\n\n从我们在前面几章节中增量修改的典型网关配置开始，我们在 `pf.conf`\
  \ 文件的早期插入此队列定义：\n\n```\nqueue rootq on $ext_if bandwidth 20M\n        queue main\
  \ parent rootq bandwidth 20479K min 1M max 20479K qlimit 100\n             queue\
  \ qdef parent main bandwidth 9600K min 6000K max 18M default\n             queue\
  \ qweb parent main bandwidth 9600K min 6000K max 18M\n             queue qpri parent\
  \ main bandwidth 700K min 100K max 1200K\n             queue qdns parent main bandwidth\
  \ 200K min 12K burst 600K for 3000ms\n        queue spamd parent rootq bandwidth\
  \ 1K min 0K max 1K qlimit 300\n```\n\n此定义与《介绍用于带宽分配的队列》中之前的定义有显著不同。我们通过将顶层队列 `rootq`\
  \ 拆分为两个，从这个较小的层次结构开始。接下来，我们将 `main` 队列细分为几个子队列，所有子队列都设置了 `min` 值——即分配给队列的保证最小带宽。（`max`\
  \ 值将设置队列分配的硬上限）。`bandwidth` 参数还设置了队列在积压时可用的分配——即当它开始消耗其 `qlimit` 时。\n\n（注：由于提供的文本在后续部分存在大量重复段落，已根据逻辑进行了处理以提供清晰版本。）\n\
  \n### 规则集\n\n下一步是将新定义的队列连接到规则集中。如果你已经有了过滤机制，连接非常简单——只需添加几个 `match` 规则：\n\n```\n\
  match out on $ext_if proto tcp to port https \\\n    queue (qweb, qpri) set prio\
  \ (5,6)\nmatch out on $ext_if proto udp to port domain \\\n    queue (qdns, qpri)\
  \ set prio (6,7)\nmatch out on $ext_if proto icmp \\\n    queue (qdns, qpri) set\
  \ prio (6,7)\n```\n\n在这里，`match` 规则再次通过高低优先级分配实现 ACK 数据包加速，正如我们之前在纯优先级系统中看到的那样。例外是将流量分配到最低优先级队列（对现有的\
  \ `pass` 规则进行了微调），我们在那里并不希望任何加速。\n\n```\npass in log on egress proto tcp to port\
  \ smtp \\\n    rdr-to 127.0.0.1 port spamd queue spamd set prio 0\n```\n\n将 `spamd`\
  \ 流量分配到优先级为 0 的最小队列，旨在减慢垃圾邮件发送者到达 `spamd`。（关于 `spamd` 及相关事项，请参阅第 6 章。）\n\n\n\n\n\
  从这个例子中可能一眼看出，但 `HFSC` 要求流量只能分配给 `leaf queues`（叶节点队列），即没有子队列的队列。这意味着我们可以将流量分配给 `main`\
  \ 的子队列——`qpri`、`qdef`、`qweb` 和 `qdns`，以及 `rootq` 的子队列——`spamd`（正如我们刚刚使用 `match`\
  \ 和 `pass` 规则所的那样），但不能分配给 `rootq` 或 `main` 本身。完成所有队列分配后，我们可以使用 `systat` 队列来显示队列及其流量：\n\
  \n```\n 6 users Load 0.31 0.28 0.34                   Tue May 19 21:31:54 2015\n\
  \nQUEUE            BW SCH  PR PKTS BYTES DROP_P DROP_B QLEN BORR SUSP P/S B/S\n\
  rootq           20M            0     0      0      0    0\nmain            20M \
  \           0     0      0      0    0\n qdef            9M        48887   15M \
  \     0      0    0\n qweb            9M        18553 8135K      0      0    0\n\
  \ qpri          600K        37549 2407K      0      0    0\n qdns          200K\
  \        15716 1568K      0      0    0\nspamd            1K        10590 661K \
  \    126   8772   47\n```\n\n队列通过缩进显示以指示它们的层级结构，从根队列到叶队列。`main` 队列及其子队列——`qpri`、`qdef`、`qweb`\
  \ 和 `qdns` 显示了它们的带宽分配以及通过的字节数和包数。`DROP_P` 和 `DROP_B` 列显示丢弃的数据包和字节数，如果我们我们在此阶段被迫丢弃数据包，这些列就会出现。`QLEN`\
  \ 是等待处理的数据包数量，而最后两列显示每秒数据包和字节的实时更新。\n\n要查看更详细的视图，请使用 `pfctl -vvsq` 来显示队列及其流量：\n\n\
  ```\nqueue rootq on xl0 bandwidth 20M qlimit 50\n  [ pkts:          0  bytes:  \
  \        0  dropped pkts:      0 bytes:      0 ]\n  [ qlength:   0/ 50 ]\n  [ measured:\
  \     0.0 packets/s, 0 b/s ]\nqueue main parent rootq on xl0 bandwidth 20M, min\
  \ 1M, max 20M qlimit 100\n  [ pkts:          0  bytes:          0  dropped pkts:\
  \      0 bytes:      0 ]\n  [ qlength:   0/100 ]\n  [ measured:     0.0 packets/s,\
  \ 0 b/s ]\nqueue qdef parent main on xl0 bandwidth 9M, min 6M, max 18M default qlimit\
  \ 50\n  [ pkts:       1051  bytes:     302813  dropped pkts:      0 bytes:     \
  \ 0 ]\n  [ qlength:   0/ 50 ]\n  [ measured:   2.6 packets/s, 5.64Kb/s ]\nqueue\
  \ qweb parent main on xl0 bandwidth 9M, min 6M, max 18M qlimit 50\n  [ pkts:   \
  \    1937  bytes:    1214950  dropped pkts:      0 bytes:      0 ]\n  [ qlength:\
  \   0/ 50 ]\n  [ measured:     3.6 packets/s, 13.65Kb/s ]\nqueue qpri parent main\
  \ on xl0 bandwidth 600K, max 1M qlimit 50\n  [ pkts:       2169  bytes:     143302\
  \  dropped pkts:      0 bytes:      0 ]\n  [ qlength:   0/ 50 ]\n  [ measured: \
  \    6.6 packets/s, 3.55Kb/s ]\nqueue qdns parent main on xl0 bandwidth 200K, min\
  \ 12K burst 600K for 3000ms qlimit 50\n  [ pkts:        604 bytes:       65091 \
  \ dropped pkts:      0 bytes:      0 ]\n  [ qlength:    0/ 50 ]\n  [ measured: \
  \     1.6 packets/s, 1.31Kb/s ]\nqueue spamd parent rootq on xl0 bandwidth 1K, max\
  \ 1K qlimit 300\n  [ pkts:        884 bytes:       57388  dropped pkts:      0 bytes:\
  \ 0 ]\n  [ qlength: 176/300 ]\n  [ measured:     1.9 packets/s, 1Kb/s ]\n```\n\n\
  此视图显示队列接收的流量大致符合网站的典型负载。请注意，在规则集重载后没多久，`spamd` 队列就已经积压了其 `qlimit` 设置的一半以上，这表明队列的设置对于实际流量是合理的。\n\
  \n### 注意\n\n注意每个队列的丢弃数据包。\n\n#### DMZ 网络，现在有了流量\n\n在 `第 5 章` 中，我们设置了队列，以便将站可用带宽分配给我们允许的流量。DMZ\
  \ 接口的带宽可能是 100Mb 或 1Gb，而其实用带宽要小得多。这种考虑体现在我们的队列定义中，外部流量的实际可用是队列设置的主要限制。\n\n该网络可能的瓶颈是网关外部接口的带宽。尽管我们设置的其他地方不是无限的，但任何接口的可用带宽可能都会较低。为了提供获得性能的服务，我们需要设置队列。网络的物理和逻辑布局不会改变。\n\
  \n![带有 DMZ 的网络](http://atomoreillycomsourcenostimages127159.jpg) 图 7-1. 带有 DMZ 的网络\n\
  \n注意每个接口都有一个根队列，它决定了连接到该接口的所有队列的分配。为了使用新的队列基础，我们需要对过滤规则进行一些更改。\n\n添加队列后，过滤规则的主要部分可能如下：\n\
  \n```\nqueue ext on $ext_if bandwidth 2M\n        queue ext_main parent ext bandwidth\
  \ 500K default\n        queue ext_web parent ext bandwidth 500K\n        queue ext_udp\
  \ parent ext bandwidth 400K\n        queue ext_mail parent ext bandwidth 600K\n\n\
  queue dmz on $dmz_if bandwidth 100M\n        queue ext_dmz parent dmz bandwidth\
  \ 2M\n                queue ext_dmz_web parent ext_dmz bandwidth 800K default\n\
  \                queue ext_dmz_udp parent ext_dmz bandwidth 200K\n             \
  \   queue ext_dmz_mail parent ext_dmz bandwidth 1M\n        queue dmz_main parent\
  \ dmz bandwidth 25M\n        queue dmz_web parent dmz bandwidth 25M\n        queue\
  \ dmz_udp parent dmz bandwidth 20M\n        queue dmz_mail parent dmz bandwidth\
  \ 20M\n```\n\n\n\n\n\n```\npass in on $ext_if proto { tcp, udp } to $nameservers\
  \ port domain \\\n    set queue ext_udp set prio (6,5)\npass in on $int_if proto\
  \ { tcp, udp } from $localnet to $nameservers \\\n    port domain\npass out on $dmz_if\
  \ proto { tcp, udp } to $nameservers port domain \\\n    set queue ext_dmz_udp set\
  \ prio (6,5)\npass out on $dmz_if proto { tcp, udp } from $localnet to $nameservers\
  \ \\\n    port domain set queue dmz_udp\npass in on $ext_if proto tcp to $webserver\
  \ port $webports set queue ext_web\npass in on $int_if proto tcp from $localnet\
  \ to $webserver port $webports\npass out on $dmz_if proto tcp to $webserver port\
  \ $webports \\\n    set queue ext_dmz_web\npass out on $dmz_if proto tcp from $localnet\
  \ to $webserver port $webports \\\n    set queue dmz_web\npass in log on $ext_if\
  \ proto tcp to $mailserver port smtp\npass in log on $ext_if proto tcp from $localnet\
  \ to $mailserver port smtp\npass in log on $int_if proto tcp from $localnet to $mailserver\
  \ port $email\npass out log on $dmz_if proto tcp to $mailserver port smtp set queue\
  \ ext_mail\npass in on $dmz_if proto tcp from $mailserver to port smtp set queue\
  \ dmz_mail\npass out log on $ext_if proto tcp from $mailserver to port smtp \\\n\
  \    set queue ext_dmz_mail\n```\n\n请注意，只有通过 DMZ 或外部接口的流量会被分配到队列。在此配置中，由于内部网络没有可从外部访问的服务，在内部接口上进行队列化意义不大，因为那里通常是网络可用带宽限制最少的部分。此外，与之前的示例一样，也可以通过创建一组\
  \ `match` 规则来负责队列分配，从而将队列分配与规则集的过滤部分分离开，这也是非常有合理的做法。\n\n### 使用队列处理非必要的流量\n\n到为止，我们关注的是将队列作为一种确保特定类型流量尽可能高效通过的方法。现在，我们将查看两个示例，它们展示了如何使用各种队列相关的技巧来识别和处理非必要的流量，从而让违规者乖乖办事。\n\
  \n#### 将流量过载到微队列\n\n在拒绝粗暴攻击 中，我们使用结合了状态跟踪选项和 `overload` 规则来填充地址表，以便进行特殊处理。我们在第 6\
  \ 章 中演示的特殊处理是切断所有连接，但同样可以将 `overload` 流量分配给特定的队列。例如，考虑我们第一个队列示例中的规则，如下所示：\n\n```\n\
  pass log quick on $ext_if proto tcp to port ssh flags S/SA \\\n    keep state queue\
  \ (ssh_bulk, ssh_interactive) set prio (5,7)\n```\n\n要创建一个源自第 6 章 的过载表技巧的变体，请添加状态跟踪选项，如下所示：\n\
  \n```\npass log quick on $ext_if proto tcp to port ssh flags S/SA \\\n    keep state\
  \ (max-src-conn 15, max-src-conn-rate 5/3, \\\n    overload <bruteforce> flush global)\
  \ queue (ssh_bulk, ssh_interactive) \\\n    set prio (5,7)\n```\n\n然后，将其中一个队列稍微调小：\n\
  \n```\nqueue smallpipe parent main bandwidth 512\n```\n\n并使用此规则将违规者的流量分配到小带宽队列：\n\
  \n```\npass inet proto tcp from <bruteforce> to port $tcp_services queue smallpipe\n\
  ```\n\n结果是，来自破解者的流量将通过，但每秒有一个 512 比特的硬性上限限制。（值得注意的是，由于网络栈的定时器分辨率，在高速链路上强制执行极小的带宽分配可能很困难。如果分配相对于链路容量足够小，那么在带宽限制生效之前，超过指定的每秒最大分配额的封包仍会被传输。）配合表条目过期功能来补充此类规则可能也会很有用，正如在使用\
  \ pfctl 清理你的表 中描述的那样。\n\n#### 基于操作系统指纹的队列分配\n\n第 6 章 介绍了几种使用 `spamd` 减少垃圾邮件的方法。如果你的环境中无法运行\
  \ `spamd`，你可以根据发送垃圾邮件的机器可能运行特定操作系统的知识可以使用队列和规则集。（我们将该操作系统称为 Windows。）\n\nPF 拥有一种相当可靠的操作系统指纹机制，它可以根据连接建立时初始\
  \ SYN 包的特征检测网络连接另一端的操作系统。以下可以是 `spamd` 的简单替代方案：\n\n```\npass log on $dmz_if proto\
  \ tcp to $mailserver port smtp set queue ext_mail\n```\n\n### 从 ALTQ 迁移到优先级和队列\n\
  \n如果你已经有了使用 ALTQ 进行流量整形的配置，并计划迁移到 OpenBSD 5.5 及更高版本，本节包含有关如何迁移的提示。主要点包括：\n\n####\
  \ 迁移后的规则可能更简单\nOpenBSD 5.5 及更高版本的流量整形系统取消了晦涩的 ALTQ 语法，并清晰区分了队列和优先级。在大多数情况下，你的配置变得更具可读性和可维护性。\n\
  \n#### 对于简单配置，set prio 就足够了\nALTQ 最简单的队列调度是 `priq`。最常见的用例是 Daniel Hartmeier 在前文中插图的双优先级加速。基础的双优先级配置如下：\n\
  \n```\next_if=\"kue0\"\n\naltq on $ext_if priq bandwidth 100Kb queue { q_pri, q_def\
  \ }\n      queue q_pri priority 7\n      queue q_def priority 1 priq(default)\n\n\
  pass out on $ext_if proto tcp from $ext_if queue (q_def, q_pri)\npass in on $ext_if\
  \ proto tcp to $ext_if queue (q_def, q_pri)\n```\n\n在 OpenBSD 5.5 及更高版本中，不需要定义队列，通过在\
  \ `match` 或 `pass` 规则中分配两个优先级，如下：\n\n```\nmatch out on egress set prio (5, 6)\n\
  ```\n\n在这里，第一个优先级将分配给普通流量，而 ACK 和其他低延迟服务类型（ToS）数据包将分配第二个优先级，其处理速度比普通包更快。效果与我们刚刚引用的\
  \ ALTQ 示例相同，但定义的带宽限制外。\n\n#### 优先级队列在大多数情况下可以被替换\n对于纯优先级的区分，在每个 `pass` 或 `match`\
  \ 规则的基础上应用 `set prio` 比定义队列并分配流量更简单，且仅影响数据包优先级。ALTQ 允许你定义 CBQ 或 HFSC 队列，并将优先级值作为定义的一部分。在新队列系统中，优先级的分配仅在\
  \ `match` 或 `pass` 规则中进行，但如果你的应用程序要求同一条规则中同时设置优先级和队列分配，新语法也允许这样做：\n\n```\npass log\
  \ quick on $ext_if proto tcp to port ssh \\\n      queue (ssh_bulk, ssh_interactive)\
  \ set prio (5,7)\n```\n\n\n\n这种效果与之前在将您的带宽划分为固定大小的分块中所示的行为类似，这种变体在过渡期间可能特别有帮助。\n\
  \n**优先级现在始终重要。请记住默认值为 3。** 必须意识到，自 OpenBSD 5.0 以来，流量优先级始终开启的，即使在你没有主动分配优先级时，也需要考虑它们。在采用“双重优先级技巧”来加速\
  \ ACK（并扩展到所有流量）的旧式配置中，唯一重要的是执行中运行着两个不同的优先级。低延迟包会被分配到高优先级队列，其最终效果是流量通过速度可能比默认的 FIFO\
  \ 队列更快，且带宽利用率更高。现在默认优先级是 3，如果像一些较旧的示例那样将某个队列的优先级设置为 0，将意味着分配给该优先级的流量只有在没有更高优先级的流量需要处理时，才被认为准备好通过。\n\
  \n**对于实际的带宽整形，HFSC 在后台工作。** 一旦你确定你的规范要求将可用带宽划分为分块，底层算法始终是 `HFSC`。不同类型队列的各种语法已经消失。选择\
  \ `HFSC` 是由于它的灵活性，而且它只有在流量接近你队列配置设置的限制之一时才会开始积极整形流量。此外，通过将队列定义限制为仅带宽声明，可以创建类似于 CBQ\
  \ 的配置。将您的带宽划分为固定大小的分块（之前提到）展示了一个将 CBQ 实现为 HFSC 子集的静态配置。\n\n**你可以通过 oldqueue 机制从\
  \ ALTQ 迁移过渡。** OpenBSD 5.5 支持遗留的 ALTQ 配置，在配置上仅有一处细微变化：`queue` 关键字被作为新队列系统的保留字，因此\
  \ ALTQ 队列需要声明为 `oldqueue`。在完成这一处更改后（一个纯粹的搜索替换操作，你甚至可以在启动操作系统升级之前执行该操作），配置将按预期工作。\n\
  \n**如果你的设置足够复杂，请回到规范并重新实现。** 本章中的示例有些程式化且相当简单。如果你运行的配置是多年来逐步构建的，并且达到了比这里描述的高出几个数量级的复杂度，那么新语法可能提供一个机会，让你定义你设置的用途，并产生一个适合在更简洁、更易维护的配置中重新实现的规范。\n\
  \n采用 `oldqueue` 路线并在此基础上进行调整在某种程度上是可行的，但在测试环境中通过修订后的规范进行纯净的重新来实现过渡可能更简单，在测试环境中，你可以测试你积累的假设在新的流量整形系统背景下是否成立。无论你选择哪种过渡路线，在在切换到\
  \ OpenBSD 5.5 或更高版本后，你或少都会获得一个更易读且更易维护的配置。\n\n## 使用 ALTQ 流量\n\n`ALTQ` 是一种非常灵活的遗留网络流量整形机制，由\
  \ Henning Brauer 在 OpenBSD 3.3 发布前^([41]) 集成到 `PF` 中，他也是 OpenBSD 5.5 中引入的优先级和队列系统的主要开发者（见本章的前几节）。从\
  \ OpenBSD 3.3 开始，所有 ALTQ 配置都移动到了 `pf.conf` 中，以便流量整形和过滤的集成。移植到其他 BSD 的 `PF` 迅速采用了至少可选的\
  \ ALTQ 集成。\n\n### Note\n\n`OpenBSD 5.5 引入了一种新的流量整形队列系统，具有完全不同（且更具读性）的语法，补充了 OpenBSD\
  \ 5.0 中引入的始终开启的优先级系统。新系统旨在一个过渡版本后完全取代 ALTQ。本章的其余部分仅在你感兴趣学习设置或维护基于 ALTQ 的系统时有用。`\n\
  \n### ALTQ 概念\n\n顾如其名，ALTQ 配置完全是以队列为中心的。与较新的流量整形系统一样，ALTQ 队列根据带宽定义并附加到接口上。队列可以分配优先级，在某些情况下，它们可以拥有子队列，子队列接收父队列带宽的份额。\n\
  \nALTQ 队列的一般语法如下：\n\n```\naltq on interface type [options ... ] main_queue { sub_q1,\
  \ sub_q2 ..}\n  queue sub_q1 [ options ... ]\n  queue sub_q2 [ options ... ] { subA,\
  \ subB, ... }\n[...] \npass [ ... ] queue sub_q1 \npass [ ... ] queue sub_q2\n```\n\
  \n### Note\n\n`在 OpenBSD 5.5 及更高版本上，由于与新队列子系统存在不可解决的语法冲突，ALTQ 队列用 oldqueue 代替 queue。`\n\
  \n一旦定义了队列，你就可以通过重写 `pass` 或 `match` 规则将流量分配到特定的队列，从而集成流量整形。任何你未显式分配给特定队列的流量都会与默认队列中的所有流量合并。\n\
  \n### 队列调度器，又名队列规则\n\n在默认的网络设置中，没有使用队列，TCP/IP 栈及其过滤子系统根据 FIFO 原处理包。\n\nALTQ 提供了三种队列调度算法（或*队列规则*），可以改变这种行为。类型为\
  \ `priq`、`cbq` 和 `hfsc`。在这些类型中，`cbq` 和 `hfsc` 队列可以有多个子队列。`priq` 队列本质上是平面的，只有一个队列级。\n\
  \n#### priq\n\n`基于优先级的队列完全根据优先级在带宽范围内定义。对于 priq 队列，允许的优先级范围是 0 到 15，数值越高优权越高。匹配高优先级队列的包将在匹配低优先级队列的包之前处理。`\n\
  \n#### cbq\n\n`基于类的队列定义为固定大小的带宽分配，以可用带宽百分比或每秒千比特、兆比特或吉比特为单位。cbq 队列可以细分为分配 0 到 7\
  \ 范围内优先级的队列，再次，高优先级意味着优权。`\n\n#### hfsc\n\n`hfsc` 规则使用 `HFSC` 算法确保层级结构中队列带宽分配的“公平”。`HFSC`\
  \ 提供了设置具有保证最小分配和硬上限的队列方案的可能性。分配甚至可以随时间变化，你甚至可以拥有 0 到 7 范围内细粒度的优先级。\n\n由于算法以及相应的\
  \ ALTQ 设置都相当复杂，具有许多可调参数，大多数 ALTQ 实践者倾向于使用简单的队列类型。然而，那些声称理解 `HFSC` 的人对其深信不疑。\n\n\
  ### 设置 ALTQ\n\n启用 ALTQ 可能需要额外的步骤，取决于你选择的操作系统。\n\n#### OpenBSD 上的 ALTQ\n\n在 OpenBSD\
  \ 5.5 上，所有支持的队列规则都编译到了 `GENERIC` 和 `GENERIC.MP` 内中。检查你的 OpenBSD 版本是否仍然支持 ALTQ。如果是，你需要的唯一配置涉及编辑\
  \ `pf.conf`。\n\n### FreeBSD 上的 ALTQ\n\n\n\n\n在 FreeBSD 上，请确保你的内核编译了 `ALTQ` 和 `ALTQ`\
  \ 队列调度选项。默认的 FreeBSD `GENERIC` 内核没有启用 `ALTQ` 选项，正如你可能在运行启用 `PF` 的 `/etc/rc.d/pf*`\
  \ 脚本时看到的提示信息所示。相关的选项如下：\n\n```\noptions            ALTQ\noptions            ALTQ_CBQ\
  \        # 类基队列 (CBQ)\noptions            ALTQ_RED        # 随机早期检测 (RED)\noptions\
  \            ALTQ_RIO        # RED 入/出\noptions            ALTQ_HFSC       # 分层数据调度器\
  \ (HFSC)\noptions            ALTQ_PRIQ       # 优先级队列 (PRIQ)\noptions           \
  \ ALTQ_NOPCC      # SMP 构建必需\n```\n\n`ALTQ` 选项用于在内核中启用 `ALTQ`，但在 SMP 系统上，你还需要 `ALTQ_NOPCC`\
  \ 选项。根据你将使用的队列类型，你需要至少启用以下其中之一：`ALTQ_CBQ`、`ALTQ_PRIQ` 或 `ALTQ_HFSC`。最后，你可以分别通过 `ALTQ_RED`\
  \ 和 `ALTQ_RIO` 选项启用拥塞避免技术 `随机早期检测 (RED)` 和 `RED 入/出`。（参阅 *FreeBSD Handbook* 获取有关编译和安装带有这些选项的自定义内核的信息。）\n\
  \n### NetBSD  ALTQ\n\n`ALTQ` 已集成到 NetBSD 4.0 的 `PF` 实现中，并支持 NetBSD 4.0 及更新后的版本。NetBSD\
  \ 的默认 `GENERIC` 内核配置不包含 `ALTQ` 相关选项，但 `GENERIC` 文件中附带了所有注释掉的相关选项，方便包含。主要的内核选项是这些：\n\
  \n```\noptions    ALTQ         # 操作网络接口的输出队列\noptions    ALTQ_CBQ     # 类基队列\noptions\
  \    ALTQ_HFSC    # 分层公平服务曲线\noptions    ALTQ_PRIQ    # 优先级队列\noptions    ALTQ_RED\
  \     # 随机早期检测\n```\n\n`ALTQ` 选项用于在内核中启用 `ALTQ`。根据你将使用的队列类型，你必须启用以下其中之一：`ALTQ_CBQ`、`ALTQ_PRIQ`\
  \ 或 `ALTQ_HFSC`。\n\n使用 `ALTQ` 要求你将 `PF` 编译进内核，因为 `PF` 可加载模块不支持 `ALTQ` 功能。（请访问 NetBSD\
  \ `PF` 文档 [`www.netbsd.org/Documentation/network/pf.html`](http://www.netbsd.org/Documentation/network/pf.html)\
  \ 获取最新信息。）\n\n### 优先级队列\n\n优先级队列(`priq`) 背后的基本概念非常直观。在分配给主队列的总带宽内，只有流量优先级是重要的。你为队列分配一个\
  \ 0 到 15 之间的优先级值，值越高意味着该队列的流量请求被处理得越快。\n\n### 使用 ALTQ 优先级队列提高性能\n\nDaniel Hartmeier\
  \ 发现了一种简单而有效的方法，通过使用 `ALTQ` 优先级队列提高他家庭网络的吞吐量。像许多人一样，他的家庭网络处于非对称连接上，总可用带宽低到让他希望有更好的带宽利用率。此外，当线路以满容量或接近容量运行时，异\
  \ {开始出现。一个特别的症状似乎暗示了改进空间：每当出站流量开始时，入站流量（下载、入站邮件等）就会不成比例地变慢——这无法通过测量传输的数据原始量来解释。这一切归结于\
  \ `TCP` 的基本特性。\n\n当发送 `TCP` 数据包时，发送者期望收到接收器的确认（以 `ACK` 数据包的形式），并会等待指定时间其到达。如果 `ACK`\
  \ 没有在规定时间内到达，发送者将假设数据包未收到并重新发送。由于在默认设置下，数据包按到达顺序由接口逐一处理，基本上没有数据负载的 `ACK` 数据包最终会在传输较大的数据包时排队等待。\n\
  \n如果 `ACK` 数据包可以插队在较大的数据包之间，结果将是更高效地利用可用带宽。使用 `ALTQ` 实现此类系统的最简单实用的方法是设置两个具有不同优先级的队列，并将它们集成到规则集中。以下是规则集的相关部分。\n\
  \n```\next_if=\"kue0\"\n\naltq on $ext_if priq bandwidth 100Kb queue { q_pri, q_def\
  \ }\n      queue q_pri priority 7\n      queue q_def priority 1 priq(default)\n\n\
  pass out on $ext_if proto tcp from $ext_if queue (q_def, q_pri)\n\npass in on $ext_if\
  \ proto tcp to $ext_if queue (q_def, q_pri)\n```\n\n在这里，优先级队列设置在外部接口上，并带有两个子队列。第一个子队列\
  \ `q_pri` 具有 7 的高优先级值；另一个子队列 `q_def` 具有显著较低的优先级值 1。\n\n这个看似简单的规则集通过利用 `ALTQ` 如何处理不同优先级的队列来工作。一旦建立连接，`ALTQ`\
  \ 会检查每个数据包的 `ToS` 字段。`ACK` 数据包具有 `ToS` 延迟位，这表示发送者想要最快的交付。当 `ALTQ` 看到低延迟数据包且存在不同优先级的队列时，它将其分配给优先级较高的队列。\n\
  \n### 使用 match 规则进行分配\n\n如果你使用的是 OpenBSD 4.6 及更新后的示例，你的规则集可能有一个 `match` 规则对出站流量应用\
  \ `nat-to`。要在你的规则集中引入优先级队列，你首先要添加队列定义，并对出站 `match` 进行微调。\n\n在之前的示例中，规则集是用传统方式构建的，使用了以下一个之一：`ALTQ_CBQ`、`ALTQ_PRIQ`\
  \ 或 `ALTQ_HFSC`。当你使用 `match` 规则时，将这种优先级队列回接到现有的规则集中非常简单。\n\n从先前的队列定义开始，如下所示调整总带宽：\n\
  \n```\naltq on $ext_if priq bandwidth $ext_bw queue { q_pri, q_def }\n      queue\
  \ q_pri priority 7\n      queue q_def priority 1\n```\n\n这为队列提供了通过 `ext_bw` 宏定义的带宽。将队列集成到规则集的最简单快速的方法是编辑你的出站\
  \ `match` 规则，使其类似于：\n\n```\nmatch out on $ext_if from $int_if:network nat-to ($ext_if)\
  \ queue (q_def, q_pri)\n```\n\n重新加载规则集，优先级方案将应用于所有从本地网络发起的流量。你可以使用 `systat` 命令查看流量分配给队列的实时情况。\n\
  \n```\nsystat queues\n```\n\n这将给你一个类似这样的实时显示：\n\n```\n 2 users    Load 0.39 0.27\
  \ 0.30                      Fri Apr 1 16:33:44 2015\n\nQUEUE                BW SCH\
  \  PR   PKTS  BYTES  DROP_P  DROP_B  QLEN BORRO SUSPE  P/S   B/S\nq_pri        \
  \           priq  7  21705  1392K       0       0     0               12   803\n\
  q_def                   priq     12138  6759K       0       0     0            \
  \    9  4620\n```\n\n观察 `PKTS` 和 `BYTES` 列中的数字，你可以清楚地看到队列按预期工作。\n\n\n\n`q_pri` 队列处理的数据包数量相对于数据量相当大，这正如我们预期的那样。ACK\
  \ 数据包占据的空间不大。另一方面，分配给 `q_def` 队列的流量每个数据包的数据更多，数字显示其包数量与数据大小的比例与 `q_pri` 队列本质上是相反的。\n\
  \n### 注意\n\n`systat` 是所有 BSD 系统中一个非常强大的程序，OpenBSD 版本提供了几个与 PF 相关的视图，这些视图在本文编写时其他系统的\
  \ `systat` 变体中并没有找到。我们将在下一章再次查看 `systat`。在此，请阅读 man 页面并尝试运行该程序。它是了解系统的一个非常有用的工具。\n\
  \n### 针对小型网络的基于类的带宽分配\n\n最大化网络性能通常听起来很棒。然而，你可能会发现网络还有其他需求。例如，对于某些流量（如邮件和其他关键服务）来说，始终拥有基准带宽可能是重要的，而其他服务（考虑到点对点文件共享）则不应允许消耗超过特定数量。为了解决这类需求或顾虑，ALTQ\
  \ 提供了选项稍多的基于类的队列 (`cbq`) 队列。\n\n为了说明如何使用 `cbq`，我们将基于之前章节中的规则集在一个小型本地网上构建。我们希望让本地网络的用户连接到其网络之外预定义的服务集，并让本地网络之外的用户访问本地网络中某处的\
  \ Web 服务器和 FTP 服务器。\n\n### 队列定义\n\n所有队列都建立在面向外部的互联网接口上。这种方法之所以合理，是因为带宽在外部链路上比在本地网上更容易限制。但从原则上讲，分配队列和运行流量整形可以在任何网络接口上完成。这里显示的示例设置包含了一个总带宽为\
  \ 2Mb、带有六个子队列的 `cbq` 队列。\n\n```\naltq on $ext_if cbq bandwidth 2Mb queue { main,\
  \ ftp, udp, web, ssh, icmp }\n      queue main bandwidth 18% cbq(default borrow\
  \ red)\n      queue ftp bandwidth 10% cbq(borrow red)\n      queue udp bandwidth\
  \ 30% cbq(borrow red)\n      queue web bandwidth 20% cbq(borrow red)\n      queue\
  \ ssh bandwidth 20% cbq(borrow red) { ssh_interactive, ssh_bulk }\n            queue\
  \ ssh_interactive priority 7 bandwidth 20%\n            queue ssh_bulk priority\
  \ 5 bandwidth 80%\n      queue icmp bandwidth 2% cbq\n```\n\n子队列 `main` 拥有 18% 的带宽，并被指定为默认队列。这意味着任何匹配\
  \ `pass` 规则但未显式分配给其他队列的流量最终都会进入这里。`borrow` 和 `red` 关键字意味着该队列可以从其父队列“借用”带宽，同时系统尝试通过应用\
  \ RED 算法来避免拥塞。\n\n其他队列遵循多或少相同的模式，直到子队列 `ssh`，该队列本身包含两个具有不同优先级的子队列。在这里，我们看到了 ACK\
  \ 优先级示例的变体。批量 SSH 传输（通常是 SCP 文件传输）使用指示吞吐量的 ToS 进行传输，而交互式 SSH 流量的 ToS 标志被设置为低延迟，并向前跳跃到批量传输之前。交互式流量可能消耗的带宽较低，获得的带宽份额较小，但由于分配给它的高优先级值，它接受了优待待遇。这种方案也有助于提高\
  \ SCP 文件传输的速度，因为 SCP 传输的 ACK 数据包将被分配到高优先级的子队列。\n\n最后，我们有 `icmp` 队列，它预留了顶层剩余的 2%\
  \ 带宽。这保证了我们希望通过但不符合符合分配到其他队列标准的 ICMP 流量拥有最少带宽。\n\n### 规则集\n\n为了实现这一切，我们使用这些 `pass`\
  \ 规则，它们指示了哪些流量被分配到队列以及及其标准：\n\n```\nset skip on { lo, $int_if }\npass log quick\
  \ on $ext_if proto tcp to port ssh queue (ssh_bulk, ssh_\ninteractive)\npass in\
  \ quick on $ext_if proto tcp to port ftp queue ftp\npass in quick on $ext_if proto\
  \ tcp to port www queue http\npass out on $ext_if proto udp queue udp\npass out\
  \ on $ext_if proto icmp queue icmp\npass out on $ext_if proto tcp from $localnet\
  \ to port $client_out\n```\n\n`ssh`、`ftp`、`www`、`udp` 和 `icmp` 的规则将流量分配到各自的队列。最后一个通配规则通过了来自本地网络的所有其他流量，将其归入默认的\
  \ `main` 队列。\n\n### 基础 HFSC 流量整形器\n\n我们目前为止看过的简单调度器可以实现高效的设置，但具有流量整形目标的网络管理员倾向于寻找比纯基于优先级的队列或简单基于类的队列更多的灵活性。HFSC\
  \ 队列算法（`pf.conf` 术语中的 `hfsc`）提供了灵活的带宽分配、为每个队列保证的可用带宽上下限，以及随时间变化的分配，并且只有在实际需要时才开始整形。然而，增加的灵活性是有代价的：设置比其他\
  \ ALTQ 类型复杂一点，而且为了获得最佳结果调整你的设置可能是一个非常有趣的过程。\n\n### 队列定义\n\n首先，从我们之前稍作修改的配置开始，我们在\
  \ `pf.conf` 文件的早期插入此队列定义：\n\n```\naltq on $ext_if bandwidth $ext_bw hfsc queue {\
  \ main, spamd }\n       queue main bandwidth 99% priority 7 qlimit 100 hfsc (realtime\
  \ 20%, linkshare 99%) \\\n            { q_pri, q_def, q_web, q_dns }\n         \
  \ queue q_pri bandwidth 3% priority 7 hfsc (realtime 0, linkshare 3% red )\n   \
  \       queue q_def bandwidth 47% priority 1 hfsc (default realtime 30% linkshare\
  \ 47% red)\n          queue q_web bandwidth 47% priority 1 hfsc (realtime 30% linkshare\
  \ 47% red)\n          queue q_dns bandwidth 3% priority 7 qlimit 100 hfsc (realtime\
  \ (30Kb 300 12Kb), \\\n                  linkshare 3%)\n       queue spamd bandwidth\
  \ 0% priority 0 qlimit 300 hfsc (realtime 0, upperlimit 1%, \\\n            linkshare\
  \ 1%)\n```\n\n`hfsc` 队列定义与简单的类型采用了略不同的参数。我们首先通过拆分顶层队列开始这种层次。在下一层，我们将 `main` 队列划分为多个子队列，每个子队列都有定义的优先级。所有子队列都设置了\
  \ `realtime` 值——这是保证给队列的最小带宽。可选的 `upperlimit` 设置了队列分配的硬上限。`linkshare` 参数设置了队列在积压时（即它开始消耗其\
  \ `qlimit` 分配时）可获得的分配份额。\n\n在拥塞的情况下，每个队列默认拥有 50 个槽位，即队列限制 (`qlimit`)，用于保留无法立即传输的数据包。在这个示例中，顶层队列\
  \ `main` 和 `spamd` 都通过其 `qlimit` 设置了比默认值更大的池：`main` 为 `100`，`spamd` 为 `300`。\n\n\
  这里的队列层次结构使用了两种熟悉的技巧来有效利用可用带宽：\n\n*   它使用了在早期的纯优先级示例中演示的高低优先级混合的变体。\n\n\n\n\n-  \
  \ 我们通过为域名服务查找分配一小部分但保证性的带宽，加速了几乎所有其他流量（毫无疑问是这里看起来优先级的 Web 流量）。对于 `q_dns` 队列，我们设置了带有时间限制的\
  \ `realtime` 值——在 `3000` 毫秒后，`realtime` 分配将降至 `12Kb`。这对于加速那些在早期阶段传输大部分负载的连接可能很有用。\n\
  \n### 规则集\n\n接下来，我们将新创建的队列绑定到规则集中。如果你已经有一套过滤机制（我们假设你已经有了），这种绑定将变得惊奇地简单，只需添加几个 `match`\
  \ 规则即可。\n\n```\nmatch out on $ext_if from $air_if:network nat-to ($ext_if) \\\n\
  \    queue (q_def, q_pri)\nmatch out on $ext_if from $int_if:network nat-to ($ext_if)\
  \ \\\n    queue (q_def, q_pri)\nmatch out on $ext_if proto tcp to port { www https\
  \ } queue (q_web, q_pri)\nmatch out on $ext_if proto { tcp udp } to port domain\
  \ queue (q_dns, q_pri)\nmatch out on $ext_if proto icmp queue (q_dns, q_pri)\n```\n\
  \n在这里，`match` 规则再次使用了通过高、低优先级队列分配实现的 ACK 包加速技巧，正如你之前在纯基于优先级的系统中看到的那样。唯一的例外是我们将流量分配到最低优先级队列时，在那里我们真的并不在乎有任何加速。\n\
  \n```\npass in log on egress proto tcp to port smtp rdr-to 127.0.0.1 port spamd\
  \ queue spamd\n```\n\n此规则旨在让垃圾邮件发送者在到达我们的 `spamd` 的过程中稍微慢一点。有了分级队列系统，`systat queues`\
  \ 也会以层级结构显示队列及其流量。\n\n```\n 2 users    Load 0.22 0.25 0.25                    Fri\
  \ Apr 3 16:43:37 2015\n\nQUEUE         BW  SCH  PRIO    PKTS    BYTES  DROP_P  DROP_B\
  \ QLEN  BORROW SUSPEN P/S    B/S\nroot_nfe0     20M hfsc    0       0        0 \
  \      0       0    0                  0      0\n main         19M hfsc    7   \
  \    0        0       0       0    0                  0      0\n  q_pri      594K\
  \ hfsc    7    1360    82284       0       0    0                 11    770\n  q_def\
  \     9306K hfsc          158    15816       0       0    0                0.2 \
  \    11\n  q_web     9306K hfsc          914   709845       0       0    0     \
  \            50  61010\n  q_dns      594K hfsc    7     196    17494       0   \
  \    0    0                  3    277\n  spamd         0 hfsc    0     431    24159\
  \       0       0    0                  2    174\n```\n\n根队列显示为连接到物理接口——在本例中为 `nfe0`\
  \ 和 `root_nfe0`。`main` 及其子队列——`q_pri`、`q_def`、`q_web` 和 `q_dns` 显示了它们的带宽分配以及通过的字节和包数。`DROP_P`\
  \ 和 `DROP_B` 列是如果我们被迫在此阶段丢弃包，丢弃的包数和字节数将出现的地方。最后两列显示每秒数据数和每秒字节数的实时更新。\n\n### DMZ\
  \ 中服务器的队列\n\n在第 5 章中，我们设置了一个单网关网络，但将所有外部可见的服务都配置在独立的 DMZ 网络上。这样，所有来自互联网和内部网络到服务器的流量都必须通过网关（参见图\
  \ 7-1）。\n\n以第 5 章中的规则集为起点，我们将添加一些队列以优化我们的网络资源。网络的物理和逻辑布局不会改变。该网络最可能的瓶颈是网关外部接口与整个互联网之间连接的带宽。当然，我们设置中其他部分的带宽不是无限，但本地网络中任何接口的可用带宽可能不像与外部世界通信的实际可用带宽那样具有限制性。为了让服务以最佳性能可用，我们需要设置队列，以便站点可用的带宽能够提供给我们想要允许的流量。\n\
  \n在我们的示例中，DMZ 接口的带宽可能是 100Mb 或 1Gb，而来自本地网络外部的连接的`实际可用带宽`要小得多。\n\n```\ntotal_ext\
  \ = 100Mb\ntotal_dmz = 1Gb\n```\n\n\n\n到目前为止，我们一直关注将队列作为一种方法，以确保在网络及其周围现有条件下，让特定类型的流量尽可能高效地通过。现在，我们将看两个示例，这两个示例展示了略有不同的方法来识别和处理不需要的流量，以演示你可以使用的一些与队列相关的技巧，让违规者乖乖听话。\n\
  \n### 通过过载到微型队列\n\n回想一下拒之门外者，在其中，我们结合了状态跟踪选项和 `overload` 规则来填充一个地址表以进行特殊处理。我们在第\
  \ 6 章中展示的特殊处理是切断所有连接，但将 `overload` 流量分配给特定的队列也是同样可能的。\n\n考虑一下我们在小型网络基于类别的带宽分配中基于类别的带宽示例的这条规则：\n\
  \n```\npass log quick on $ext_if proto tcp to port ssh flags S/SA \\\n   keep state\
  \ queue (ssh_bulk, ssh_interactive)\n```\n\n我们可以像这里所示添加状态跟踪选项。\n\n```\npass log\
  \ quick on $ext_if proto tcp to port ssh flags S/SA \\\n   keep state (max-src-conn\
  \ 15, max-src-conn-rate 5/3, \\\n   overload <bruteforce> flush global) queue (ssh_bulk,\
  \ ssh_interactive)\n```\n\n然后，我们可以让其中一个队列稍微小一点。\n\n```\nqueue smallpipe bandwidth\
  \ 1kb cbq\n```\n\n接下来，我们可以通过以下规则将来自违规者的流量分配到小带宽队列。\n\n```\npass inet proto tcp from\
  \ <bruteforce> to port $tcp_services queue smallpipe\n```\n\n将此类规则与表目过期结合起来也可能很有用，这在使用\
  \ pfctl 清理你的表项中有所描述。\n\n### 基于操作系统指纹的队列分配\n\n第 6 章涵盖了使用 `spamd` 减少垃圾邮件的几种方法。如果在你的环境中运行\
  \ `spamd` 不是一个选项，你可以根据一项常识使用队列和规则集：发送垃圾邮件的机器很可能运行特定的操作系统。\n\nPF 有一套相当可靠的操作系统指纹机制，它根据连接建立时初始\
  \ SYN 数据包的特征检测网络连接另一端的操作系统。如果你确定合法邮件不太可能从运行特定操作系统的系统发送，以下可以是 `spamd` 的简单替代方案。\n\n\
  ```\npass quick proto tcp from any os \"Windows\" to $ext_if port smtp queue smallpipe\n\
  ```\n\n在这里，源自运行特定操作系统主机的电子邮件流量获得的带宽不超过 1KB，且不可借用。\n\n## 结论：为了乐趣、甚至为了利润的流量整形\n\n\
  本章处理了流量整形技术，这些技术可以让你的流量移动得更快，或者至少让优先流量按照你的规范更高效地通过。到目前，你应该至少对流量整形概念以及它们如何应用于你将在系统上使用的流量整形工具集有了基本的了解。\n\
  \n我希望本章中这些有些风格化（但其实用）的示例已经让你领略了流量整形的可能性，并且这些材料激发了你去尝试一些关于你如何在网络中使用流量整形工具的设想。如果你关注网络流量及其所表达的底层需求（请参阅第\
  \ 9 章和第 10 章以详细研究网络流量），你可以使用流量整形工具来改进你的网络服务用户的方式。运气运气，你的用户会感激你的努力，你甚至可能享受这种体验。\n\
  \n^([39]) Daniel Hartmeier 是 PF 的原始开发人员之一，他针对这个问题写了一篇很棒的文章，可以在 *http://www.benzedrine.cx/ackpri.html*（(http://www.benzedrine.cx/ackpri.html)）找到。Daniel\
  \ 的解释使用了较旧的 ALTQ 优先级队列语法，但包含了清楚阐明了分配两个不同优先级以帮助 ACK 效果的数据。\n\n^([41]) 关于 ALTQ 的原始研究发表在\
  \ USENIX 1999 会的一篇论文中。你可以在网上阅读 Kenjiro Cho 的论文“Managing Traffic with ALTQ”，地址 *http://www.usenix.org/publications/library/proceedings/usenix99/cho.html*（(http://www.usenix.org/publications/library/proceedings/usenix99/cho.html)）。在\
  \ Cho 和 Chris Cappucio 的努力下，代码很快就出现在了 OpenBSD 中。\n\n## 第 8 章：冗余与资源可用性\n\n![冗余与资源可用性](img/redatomillycomsourcenostarchimages2127149.jpg)\n\
  \n*高可用性*和*不间断的服务*一直是营销术语，也是现实世界 IT 专业人士梦寐以求的目标。为了满足这一需求并解决一些相关问题，`CARP` 和 `pfsync`\
  \ 在 OpenBSD 3.5 中作为两个备受期待的功能引入。有了这些工具，OpenBSD 以及其他采用它们的 BSD 操作系统在提供其他操作系统所说的通用集群方面迈出了一大步。OpenBSD\
  \ 使用的术语与其他产品不同，但正如你在本章中看到的，CARP、pfsync 以及相关工具提供的可用性等同于许多贵的额外功能。\n\n本章介绍了如何使用系统自带的工具来管理资源可用性——换句话说，如何使用它们确保你维护的资源和服务在不利情况下保持可用。\n\
  \n## 冗余与故障转移：CARP 和 pfsync\n\n通用地址冗余协议 (`CARP`) 的开发是作为虚拟路由器冗余协议 (`VRRP`) 的一种非专利限制的替代方案，后者已非常接近成为\
  \ IETF 认可的标准，尽管可能存在的专利问题尚未解决。([²⁶])。`CARP` 的主要目的之一是确保即使防火墙或其他服务由于错误或计划维护而崩溃，网络也能继续正常运行。OpenBSD\
  \ 的开发人员并不满足于仅仅做一个专利限制协议的克隆，他们决定在几个方面更上一层楼。作为 CARP 的补充，`pfsync` 协议设计用于在冗余的数据包过滤节点或网关之间同步\
  \ PF 状态。\n\nCARP 的原理是将一组机器设置为一个主节点和多个备份节点，所有节点都配备了处理公共 IP 地址的能力。如果主节点崩溃，一个备份节点将继承该\
  \ IP 地址。从一个 CARP 主机到另一个的交接可以验证，本质上是通过设置共享密钥（在实践中类似于密码）。\n\n\n\n在 PF 防火墙的用例中，可以设置\
  \ `pfsync` 来处理同步。如果通过 `pfsync` 的同步已正确设置，活动连接将进行接管而不会产生可感知的中断。本质上，`pfsync` 是一种专门设计的虚拟网络接口，用于同步\
  \ PF 防火墙之间的状态信息。其接口通过 `ifconfig` 分配给物理接口。\n\n尽管在技术上可以将 `pfsync` 流量与普通接口上的其他流量合并，但强烈建议您在独立的网络、甚至是虚拟局域网（VLAN）上设置\
  \ `pfsync`。`pfsync` 不对其同步伙伴进行身份验证，因此保证正确同步的唯一方法是使用专用接口来传输您的 `pfsync` 流量。\n\n## 项目规范：冗余网关对\n\
  \n为了说明使用 CARP 和 `pfsync` 实现实用的故障转移设置，我们将检查一个通往世界的单一网关的网络。我们对重配置后网络的目标如下：\n\n*  \
  \ 网络的运行方式应与引入冗余之前基本保持一致。\n*   我们应该获得更好的可用性，且没有明显的停机时间。\n*   网络应该经历平滑的故障转移，活动连接不会中断。\n\
  \n我们将从第 3 章中相对简单的网络开始，如图 8-1 所示。\n\n![单网关的网络](img/httpatomoreillycomsourcenostarchimages2127161.png.jpg)图\
  \ 8-1. 单网关的网络\n\n我们将单一网关替换为一对冗余网关，它们共享一个私有网络，通过 `pfsync` 进行状态信息更新。结果如图 8-2 所示。\n\
  \n![具有冗余网关的网络](img/httpatomoreillycomsourcenostarchimages2127163.png.jpg)图 8-2.\
  \ 具有冗余网关的网络\n\nCARP 地址是虚拟地址，除非您对 CARP 组中的所有机器都有控制台访问权限，否则几乎应该为物理接口分配 IP 地址。通过为每个物理接口分配唯一的\
  \ IP 地址，您将能够与主机通信并确定您正在与哪台机器交互。如果没有为物理接口分配 IP 地址，您可能会发现这样一种设置：备用网关无法通信（在物理接口已分配地址的网络中的主机除外），直到它们成为冗余组中的主节点并接管虚拟\
  \ IP 地址。\n\n可以合理地假设分配给物理接口的 IP 地址将与虚拟共享 IP 地址属于同一个子网。同样重要的是，要意识到这实际上并不是一项强制要求——甚至可以配置物理接口未分配地址的\
  \ CARP。如果您没有为 CARP 接口指定特定的物理接口，内核将尝试将 CARP 地址分配给已经配置了地址且与 CARP 地址在同一子网的物理接口。尽管在较简单的配置中可能并不需要，但在您用于设置\
  \ CARP 接口的 `ifconfig` 命令字符串中，通过 `carpdev` 选项显式选择接口通常是有用的。\n\n### 警告\n\n*如果当您重新配置网络时，默认网关地址从固定变为特定接口，并从主机变为虚拟地址，那么几乎无法避免连接的临时中断。*\n\
  \n### 设置 CARP\n\n大多数 CARP 设置涉及布线（根据您的网络原理图）、设置 `sysctl` 值以及发布 `ifconfig` 命令。此外，在某些系统上，您可能需要确保内核在编译时已包含了所需的设备。\n\
  \n### 检查内核选项\n\n在 OpenBSD 上，CARP 和 `pfsync` 设备都在默认的 `GENERIC` 和 `GENERIC.MP` 内核配置中。除非您运行的是没有包含这些选项的自定义内核，否则不需要重新配置内核。如果您运行的是\
  \ FreeBSD，请确保内核已编译 CARP 和 pfsync` 设备，因为默认的 `GENERIC` 内核缺少这些选项。（参阅 *FreeBSD Handbook*\
  \ 了解如何编译和安装带有这些选项的自定义内核。）\n\nNetBSD 应该检查内核是否已编译了伪设备 CARP，因为 NetBSD 默认的 `GENERIC`\
  \ 内核配置不包含它。（您会在 `GENERIC` 配置文件中发现相关行被注释掉了。）截至本文写作时，由于所谓的协议编号问题，NetBSD 不支持 `pfsync`。\n\
  \n### 设置 sysctl 值\n\n在所有支持 CARP 的系统上，基本功能由少量 `sysctl` 变量控制。主变量是 `net.inet.carp.allow`，它默认启用。在典型的\
  \ OpenBSD 系统上，您将看到：\n\n```\n$ sysctl net.inet.carp.allow \nnet.inet.carp.allow=1\n\
  ```\n\n这意味着您的系统已经为 CARP 准备绪。\n\n如果您的内核没有配置 CARP 设备，此命令在 FreeBSD 上应该产生类似以下的结果：\n\n\
  ```\nsysctl: unknown oid 'net.inet.carp.allow'\n```\n\n或者在 NetBSD 上可能产生类似的内容：\n\n\
  ```\nsysctl: third level name 'carp' in 'net.inet.carp.allow' is invalid\n```\n\n\
  使用此 `sysctl` 命令查看所有 CARP 相关变量：\n\n```\n$ sysctl net.inet.carp \nnet.inet.carp.allow=1\n\
  net.inet.carp.preempt=0\nnet.inet.carp.log=2\n```\n\n### 注意\n\n*在 FreeBSD 上，您还会遇到只读变量\
  \ `net.inet.carp.suppress_preempt`，它表示是否可以抢占。在基于 OpenBSD 4.2 或更早版本的 CARP 系统上，您还会看到\
  \ `net.inet.carp.arpbalance`，它用于为本地网络启用 ARP 负载均衡。*\n\n为了在我们设置的网关之间实现平滑故障转移，我们需要设置\
  \ `net.inet.carp.preempt` 变量，以便具有多个接口的主机（如我们的网关）所有 CARP 接口能够同步切换。此设置在 CARP 组中的所有主机上必须相同，并且应在设置时重复执行。\n\
  \n```\n$ sudo sysctl net.inet.carp.preempt=1\n```\n\n`net.inet.carp.log` 变量设置 CARP\
  \ 的调试级别，范围从 0 到 7。默认值 2 表示记录 CARP 状态变化。\n\n### 使用 ifconfig 设置网络接口\n\n注意图 8-2](#ch08.html_network_with_redundant_gateways\
  \ \"图 8-2. 具有冗余网关的网络\")所示的网络图，本地网络使用 192.168.1.0 网络，而面向互联网的接口位于 192.0.2.0 网络。考虑到这些地址范围和\
  \ CARP 接口的默认行为，设置虚拟接口的命令实际上非常简单。\n\n除了通常的网络参数外，CARP 接口还需要一个参数：虚拟主机 ID（`vhid`），用于唯一标识共享\
  \ IP 地址的接口。\n\n### 警告\n\n*`vhid` 是一个 8 位值，必须在网络广播域内唯一。设置错误的 `vhid` 可能会导致难以调试的网络问题，甚至有间接证据表明与其他无关系统的\
  \ ID 冲突可能会影响基于 VRRP 的冗余负载均衡系统（VRRP 使用了与 CARP 类似的虚拟节点识别方案）。*\n\n在将作为初始主节点的机器上运行这些命令：\n\
  \n```\n$ sudo ifconfig carp0 192.0.2.19 vhid 1 \n$ sudo ifconfig carp1 192.168.1.1\
  \ vhid 2\n```\n\n\n\n我们不需要显式设置物理接口，因为 `carp0` 和 `carp1` 虚拟接口会自动绑定到已经配置了与分配的 CARP\
  \ 地址相同子网的物理接口上。\n\n### 注意\n\n在为 `ifconfig` 提供 `carpdev` 选项的系统中，建议对所有 CARP 接口设置都使用\
  \ `carpdev` 选项，即使这并非严格要求。当从现有网络配置无法明显看出 CARP 接口的物理网络设备选择时，`carpdev` 选项变得不可或缺，此时在\
  \ `ifconfig` 命令中添加 `carpdev interface` 字符串可以产生“无法运行”与“正常工作”之间的差异。这在某些不符合直觉的配置以及相关网络空闲\
  \ IP 地址极其有限的情况下尤为有用。CARP 的 FreeBSD 移植版从 FreeBSD 10.0 开始提供了 `carpdev` 选项。\n\n使用 `ifconfig`\
  \ 确保每个 CARP 接口都配置正确，并特别注意 `carp:` 行，该行指示 `MASTER` 状态，如下所示：\n\n```\n$ ifconfig carp0\
  \ \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500\n       \
  \ lladdr 00:00:5e:00:01:01\n        carp: MASTER carpdev ep0 vhid 1 advbase 1 advskew\
  \ 0\n        groups: carp\n        inet 192.0.2.19 netmask 0xffffff00 broadcast\
  \ 192.0.2.255\n        inet6 fe80::200:5eff:fe00:101%carp0 prefixlen 64 scopeid\
  \ 0x5\n```\n\n备份机上的设置几乎相同，但你添加了 `advskew` 参数，该参数表示指定机器接管当前主备的优先级要有多低。\n\n```\n$\
  \ sudo ifconfig carp0 192.0.2.19 vhid 1 advskew 100 \n$ sudo ifconfig carp1 192.168.1.1\
  \ vhid 2 advskew 100\n```\n\n`advskew` 参数及其伴随值 `advbase` 用于计算当前主机在接管后宣布其主状态的间隔。`advbase`\
  \ 的默认值为 1，`advskew` 的默认值为 0。在前面的示例中，主机会每秒宣布一次（1 + 0/256），而备份机将等待 1 + 100/256 秒。\n\
  \n当故障转移组中的所有主机上都设置了 `net.inet.carp.preempt=1` 时，当主机停止广播或宣布其不可用时，备份机将接管，新主机会按照其配置的速率开始广播。较小的\
  \ `advskew` 值意味着更短的广播间隔以及主机成为新主的概率更高。如果有多个主机具有相同的 `advskew`，则已经是主机的主机将保留其主状态。\n\n\
  在 OpenBSD 4.1 及更高版本上，公式中的另一个因素决定了哪台主机接管 CARP 主职责。降级计数器（demotion counter）是每个 CARP\
  \ 主机为其接口组发布的一个值，用于衡量其 CARP 接口的就绪程度。当降级计数器值为 0 时，主机处于完全就绪状态；较高的值表示性能下降的程度。你可以使用命令行通过\
  \ `ifconfig -g` 设置降级计数器，但该值通常由系统本身设置，较高的值通常出现在启动过程中。在其他条件相同的情况下，降级计数器最低的主机将赢得接管\
  \ CARP 主的竞争。\n\n### 注意\n\n截至本文写作，FreeBSD 10 之前的 FreeBSD CARP 版本不支持设置降级计数器。\n\n在备份机上，再次使用\
  \ `ifconfig` 检查每个 CARP 接口是否配置正确：\n\n```\n$ ifconfig carp0 \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 00:00:5e:00:01:01\n        carp: BACKUP carpdev ep0 vhid\
  \ 1 advbase 1 advskew 100\n        groups: carp\n        inet 192.0.2.19 netmask\
  \ 0xffffff00 broadcast 192.0.2.255\n        inet6 fe80::200:5eff:fe00:101%carp0\
  \ prefixlen 64 scopeid 0x5\n```\n\n这里的输出与你刚刚在主主机上看到的略有不同。注意 `carp:` 行指示了 `BACKUP`\
  \ 状态，以及 `advbase` 和 `advskew` 参数。\n\n对于实际生产使用，你应该通过为 CARP 组成员配置共享的秘密密码短来防止未经授权的\
  \ CARP 活动，例如所示：\n\n```\n$ sudo ifconfig carp0 pass mekmitasdigoat 192.0.2.19 vhid\
  \ 1\n$ sudo ifconfig carp1 pass mekmitasdigoat 192.168.1.1 vhid 2\n```\n\n### 注意\n\
  \n与其他任何密码一样，密码短将成为一个必需的要素。\n\n在备份机上，再次使用 `ifconfig` 检查每个 CARP 接口是否配置正确：\n\n```\n\
  $ ifconfig carp0 \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu\
  \ 1500\n        lladdr 00:00:5e:00:01:01\n        carp: BACKUP carpdev ep0 vhid\
  \ 1 advbase 1 advskew 100\n        groups: carp\n        inet 192.0.2.19 netmask\
  \ 0xffffff00 broadcast 192.0.2.255\n        inet6 fe80::200:5eff:fe00:101%carp0\
  \ prefixlen 64 scopeid 0x5\n```\n\n这里的输出与你刚刚在主主机上看到的略有不同。注意 `carp:` 行指示了 `BACKUP`\
  \ 状态以及 `advbase` 和 `advskew` 参数。\n\n对于实际生产使用，你应该通过为 CARP 组成员配置共享的秘密密码来防止未经授权的 CARP\
  \ 活动，如下：\n\n```\n$ sudo ifconfig carp0 pass mekmitasdigoat 192.0.2.19 vhid 1\n$\
  \ sudo ifconfig carp1 pass mekmitasdigoat 192.168.1.1 vhid 2\n```\n\n### 注意\n\n\
  与其他任何密码一样，密码短将成为一个必需的要素。\n\n在备份机上，再次使用 `ifconfig` 检查每个 CARP 接口是否配置正确：\n\n```\n$\
  \ ifconfig carp0 \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu\
  \ 1500\n        lladdr 00:00:5e:00:01:01\n        carp: BACKUP carpdev ep0 vhid\
  \ 1 advbase 1 advskew 100\n        groups: carp\n        inet 192.0.2.19 netmask\
  \ 0xffffff00 broadcast 192.0.2.255\n        inet6 fe80::200:5eff:fe00:101%carp0\
  \ prefixlen 64 scopeid 0x5\n```\n\n这里的输出与你刚刚在主主机上看到的略有不同。注意 `carp:` 行指示了 `BACKUP`\
  \ 状态以及 `advbase` 和 `advskew` 参数。\n\n对于实际生产使用，你应该通过为 CARP 组成员配置共享的秘密密码来防止未经授权的 CARP\
  \ 活动，如下：\n\n```\n$ sudo ifconfig carp0 pass mekmitasdigoat 192.0.2.19 vhid 1\n$\
  \ sudo ifconfig carp1 pass mekmitasdigoat 192.168.1.1 vhid 2\n```\n\n### 注意\n\n\
  与其他任何密码一样，密码短将成为一个必需的要素。\n\n在备份机上，再次使用 `ifconfig` 检查每个 CARP 接口是否配置正确：\n\n```\n$\
  \ ifconfig carp0 \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu\
  \ 1500\n        lladdr 00:00:5e:00:01:01\n        carp: BACKUP carpdev ep0 vhid\
  \ 1 advbase 1 advskew 100\n        groups: carp\n        inet 192.0.2.19 netmask\
  \ 0xffffff00 broadcast 192.0.2.255\n        inet6 fe80::200:5eff:fe00:101%carp0\
  \ prefixlen 64 scopeid 0x5\n```\n\n这里的输出与你刚刚在主主机上看到的略有不同。注意 `carp:` 行指示了 `BACKUP`\
  \ 状态以及 `advbase` 和 `advskew` 参数。\n\n\n\n\n这标志着我们基于 CARP 的故障转移基础网络配置圆满结束。在下一节中，我们将讨论在为冗余配置编写规则集时需要注意的事项。\n\
  \n### 整合规则集\n\n在为了配置基础网络而经历了这一切折腾之后，你可能在想，将你当前 `pf.conf` 中使用的规则迁移到新设置需要什么。幸运的是，并不复杂。我们引入的主要变化对于外部和其他其他部分来说基本上是不可见的，而且一个为单网关配置设计的良好规则集通常也能在冗余设置中良好运行。\n\
  \n话虽如此，我们引入了两个额外的协议（`CARP` 和 `pfsync`），为了让故障转移正常工作，你可能需要对规则集进行一些相对微小的更改。基本上，你需要将\
  \ `CARP` 和 `pfsync` 流量传递到相应的接口。处理 `CARP` 流量的最简单方法是为你的 `carpdevs` 引入宏定义，包含所有处理 `CARP`\
  \ 流量的物理接口。你还会引入一个相应的 `pass` 规则（如下所示），以便在相应的接口上通过 `CARP` 流量：\n\n```\npass on $carpdevs\
  \ proto carp\n```\n\n同样，对于 `pfsync` 流量，你可以为你的 `syncdev` 引入宏定义以及一个相应的 `pass` 规则：\n\
  \n```\npass on $syncdev proto pfsync\n```\n\n从性能角度来看，完全跳过 `pfsync` 接口的过滤比过滤和通过效率更高。要将\
  \ `pfsync` 设备完全排除在过滤之外，请使用此规则：\n\n```\nset skip on $syncdev\n```\n\n你还应该考虑虚拟 `CARP`\
  \ 接口及其地址与物理接口的角色区别。对于 `PF` 而言，所有流量都将通过物理接口，但流量可能会将 `CARP` 接口的 IP 地址作为源地址或目的地址。\n\
  \n你可能会发现配置中存在某些你不希望在发生故障转移时费力去同步的规则，例如运行在网关本身上的服务的连接。一个典型的例子是允许管理员进行 SSH 的典型规则：\n\
  \n```\npass in on $int_if from $ssh_allowed to self\n```\n\n对于此类规则，你可以使用 `state`\
  \ 选项 `no-sync` 来防止对那些在故障转移发生后不再相关的连接进行状态更改同步：\n\n```\npass in on $int_if from $ssh_allowed\
  \ to self keep state (no-sync)\n```\n\n通过这种配置，你可以在最方便的时间为你的 `CARPed` 组系统成员调度操作系统升级和以往会产生停机的活动，而服务的用户不会有可察觉的停机。\n\
  \n### 接口状态守护进程：ifstated\n\n在完善的 CARP 设置中，基础网络功能已经得到了很好，但你的设置可能包含在主机网络配置更改时需要特殊关注的元素。例如，某些服务可能需要在特定接口下降或重启时启动或停止，或者你可能响应接口状态的变化运行特定的命令或脚本。如果这听起来很熟悉，那么\
  \ `ifstated` 正适合你。\n\n`ifstated` 工具引入 OpenBSD 3.5，用于根据网络接口状态的变化触发操作。你可以在 OpenBSD\
  \ 的基础系统中找到它，通过 FreeBSD 的端口系统 `net/ifstated` 获取它。在 OpenBSD 上，`/etc/ifstated.conf`\
  \ 文件（如果你在 FreeBSD 上安装了端口，则为 `/usr/local/etc/ifstated.conf`）包含一个几乎可以直接运行的配置，其中包含了关于如何为\
  \ CARPed 环境设置 `ifstated` 的少量提示。\n\n主要的控制对象是接口及其状态——例如，`carp0.link.up` 是 `carp0`\
  \ 接口变为主节点的状态——你根据状态的变化执行操作。\n\n每当接口状态变化时要执行的状态和操作是在一种简单的脚本脚本语言中指定的，该语言具有变量、宏和简单逻辑条件等基本功能。（请参阅\
  \ `man ifstated` 和 `man ifstated.conf`，以及基础系统安装提供的默认 `ifstated.conf` 示例文件，获取更多关于此主题以及在你的环境中实现基于\
  \ CARP 的集群功能的信息。）\n\n### 用于负载均衡的 CARP\n\n故障转移冗余虽然很好，但有时让硬件闲置以备发生故障并不那么吸引人，创建一个创建一个将网络负载分布在多个主机的配置会更好。\n\
  \n除了 ARP 均衡（通过根据入站连接的源 MAC 地址计算哈希来工作）外，OpenBSD 4.3 及更高版本的 `CARP` 支持多种基于 IP 的负载均衡，流量根据从连接的源和目的\
  \ IP 地址计算出的哈希进行分配。由于 ARP 均衡基于源 MAC 地址，它仅对直接连接的网络网段中的主机有效。另一方面，基于 IP 的方法适用于通往整个互联网的连接负载均衡。\n\
  \n你应用程序的方法选择将取决于你需要配合的其他网络设备的规范。基本的 `ip` 均衡模式使用组播 MAC 地址让直接连接的交换机将流量转发到负载均衡集群中的所有主机。\n\
  \n遗憾的是，某些系统不支持单播 IP 地址和组播 MAC 地址的组合。在这种情况下，你可能需要在 `ip-unicast` 模式下配置负载均衡（该模式使用单播\
  \ MAC 地址），并配置你的交换机转发到相应的主机。或者你可能需要在 `ip-stealth` 模式下配置负载均衡，该模式完全不使用组播地址。如既往，细节在于细节，答案可以在手册页和其他文档中找到。\n\
  \n### 注意\n\n传统上，`relayd` 被用于为面向世界的服务器提供智能负载均衡前端。在 OpenBSD 4.7 中，`relayd` 获得了跟踪可用上链路的能力并根据链路状况更改系统路由表，该功能封装在带有\
  \ `router` 关键字的包中。对于具有多个可能的上链路或各种路由表的设置，你可以设置 `relayd` 来选择上链路，或者在 `sysctl` 变量 `net.inet.ip.multipath`\
  \ 和 `net.inet6.ip6.multipath` 的帮助下跨可用路由和上链路执行负载均衡。具体细节取决于你的网络环境。`relayd.conf` 手册页包含一个完整的入门示例。\n\
  \n### 负载均衡模式下的 CARP\n\n在负载均衡模式下，CARP 概念得到了扩展，允许每个 `CARP` 接口成为多个故障转移组的成员，以及与共享虚拟地址的物理数量相同的负载均衡组。与故障转移情况（只能有一个主节点）不同，负载均衡集群中的每个节点*必须*是自己组的主节点以便接收流量。处理给定连接的组（以及物理主机）的选择由\
  \ `CARP` 通过哈希值计算确定。这种计算在 ARP 均衡情况下基于连接的源 MAC 地址，在 IP 均衡情况下则基于源 IP 和目的 IP 地址以及实际可用性。这种方案的缺点是每个组都会消耗一个虚拟主机\
  \ ID，因此与仅使用故障转移相比，你耗尽这些 ID 的速度会快得多。事实上，由于有 32 个虚拟主机 ID，基于 CARP 的负载均衡*集群*的数量存在硬性上限。\n\
  \n\n\n\n\n`advskew` 参数在负载均衡配置中的作用与故障转移配置类似，但用于 CARP 负载均衡的 `ifconfig`（以及 `hostname.carpN`）语法与故障转移情况略有不同。\n\
  \n### 设置 CARP 负载均衡\n\n将之前章节中构建的 CARP 故障转移组更改负载均衡集群，只需编辑配置文件并重新加载即可。在接下来的示例中，我们选择了\
  \ IP 负载均衡方案。如果你选择不同的方案，配置本身的区别仅在于用于模式选择的关键字。\n\n在第一台主机上，我们将 `/etc/hostname.carp0`\
  \ 修改为：\n\n```\npass mekmitasdigoat 192.0.2.19 balancing ip carpnodes 5:100,6:0\n\
  ```\n\n这表示在该主机上，`carp0` 接口是 `vhid 5` 组的成员（`advskew` 为 `100`），同时也是 `vhid 6` 接口的成员，且它是成为初始主节点的优选候选（`advskew`\
  \ 设置为 `0`）。\n\n接下来，我们将 `/etc/hostname.carp1` 修改为：\n\n```\npass mekmitasdigoat 192.168.12.1\
  \ balancing ip carpnodes 3:100,4:0\n```\n\n对于 `carp1`，成员关系是 `vhid` `3` 和 `4`，`advskew`\
  \ 值分别为 `100` 和 `0`。\n\n对于另一台主机，`advskew` 值反相反，但配置在其他方面与预期的地相似。在这里，`/etc/hostname.carp0`\
  \ 的内容为：\n\n```\npass mekmitasdigoat 192.0.2.19 balancing ip carpnodes 5:0,6:100\n\
  ```\n\n这意味着 `carp0` 接口是 `vhid 5` 的成员（`advskew 0`），并且是 `vhid 6` 的成员（`advskew 100`）。与之互补的是\
  \ `/etc/hostname.carp1` 文件，其内容为：\n\n```\npass mekmitasdigoat 192.168.12.1 balancing\
  \ ip carpnodes 3:0,4:100\n```\n\n同样，`carp1` 是 `vhid 3` 和 `4` 的成员，第一个中的 `advskew`\
  \ 为 `0`，另一个为 `100`。\n\n第一台主机上 `carp` 接口组的 `ifconfig` 输出如下：\n\n```\n$ ifconfig carp\
  \ \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST> mtu 1500\n       \
  \ lladdr 01:00:5e:00:01:05\n        priority: 0\n        carp: carpdev vr0 advbase\
  \ 1 balancing ip\n                state MASTER vhid 5 advskew 0\n              \
  \  state BACKUP vhid 6 advskew 100\n        groups: carp\n        inet 192.0.2.19\
  \ netmask 0xffffff00 broadcast 192.0.2.255\n        inet6 fe80::200:24ff:fecb:1c10%carp0\
  \ prefixlen 64 scopeid 0x7\ncarp1: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 01:00:5e:00:01:03\n        priority: 0\n        carp:\
  \ carpdev vr1 advbase 1 balancing ip\n                state MASTER vhid 3 advskew\
  \ 0\n                state BACKUP vhid 4 advskew 100\n        groups: carp\n   \
  \     inet 192.168.12.1 netmask 0xffffff00 broadcast 192.168.12.255\n        inet6\
  \ fe80::200:24ff:fecb:1c10%carp1 prefixlen 64 scopeid 0x8\npfsync0: flags=41<UP,RUNNING>\
  \ mtu 1500\n        priority: 0\n        pfsync: syncdev: vr2 syncpeer: 10.0.12.17\
  \ maxupd: 128 defer: off\n        groups: carp pfsync\n```\n\n另一台主机的 `ifconfig`\
  \ 输出如下：\n\n```\n$ ifconfig carp \ncarp0: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 01:00:5e:00:01:05\n        priority: 0\n        carp:\
  \ carpdev vr0 advbase 1 balancing ip\n                state BACKUP vhid 5 advskew\
  \ 100\n                state MASTER vhid 6 advskew 0\n        groups: carp\n   \
  \     inet 192.0.2.19 netmask 0xffffff00 broadcast 192.0.2.255\n        inet6 fe80::200:24ff:fecb:1c18%carp0\
  \ prefixlen 64 scopeid 0x7\ncarp1: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
  \ mtu 1500\n        lladdr 01:00:5e:00:01:03\n        priority: 0\n        carp:\
  \ carpdev vr1 advbase 1 balancing ip\n                state MASTER vhid 3 advskew\
  \ 0\n                state BACKUP vhid 4 advskew 100\n        groups: carp\n   \
  \     inet 192.168.12.1 netmask 0xffffff00 broadcast 192.168.12.255\n        inet6\
  \ fe80::200:24ff:fecb:1c10%carp1 prefixlen 64 scopeid 0x8\n```\n\n\n\n\n\n```\n\
  $ sudo tcpdump -n -ttt -r /var/log/pflog\ntcpdump: WARNING: snaplen raised from\
  \ 116 to 160\nSep 13 13:00:30.556038 rule 10/(match) pass in on epic0: 194.54.107.19.34834\
  \ >\n194.54.103.66.113: S 3097635127:3097635127(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n\
  0,[|tcp]> (DF)\nSep 13 13:00:30.556063 rule 10/(match) pass out on fxp0: 194.54.107.19.34834\
  \ >\n194.54.103.66.113: S 3097635127:3097635127(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n\
  0,[|tcp]> (DF)\nSep 13 13:01:07.796096 rule 10/(match) pass in on epic0: 194.54.107.19.29572\
  \ >\n194.54.103.66.113: S 2345499144:2345499144(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n\
  0,[|tcp]> (DF)\nSep 13 13:01:07.796120 rule 10/(match) pass out on fxp0: 194.54.107.19.29572\
  \ >\n194.54.103.66.113: S 2345499144:2345499144(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n\
  0,[|tcp]> (DF)\nSep 13 13:01:15.096643 rule 10/(match) pass in on epic0: 194.54.107.19.29774\
  \ >\n194.54.103.65.53: 49442 [au][|domain]\nSep 13 13:01:15.607619 rule 12/(match)\
  \ pass in on epic0: 194.54.107.19.29774 >\n194.54.107.18.53: 34932 [au][|domain]\n\
  ```\n\n`tcpdump` 程序非常灵活，尤其是在输出方面，它提供了许多选择。此示例遵循 `tcpdump` 的格式。程序总是显示数据包到达的时间（`-ttt`\
  \ 选项指定了这种格式）。接下来，`tcpdump` 列出加载规则集中的规则编号、数据包出现的接口、源地址和端口（`-n` 选项告诉 `tcpdump` 显示\
  \ IP 地址而不是主机名），以及各种数据包属性。\n\n### 注意\n\n日志文件中的规则编号指向内存中的规则集。你的规则集在加载过程中会经过一些步骤，例如宏展开和优化，这使得你在\
  \ `pf.conf` 文件顶部看到的规则编号很可能无法匹配。如果你无法立即看出是哪个规则匹配了，请使用 `pfctl -v rules` 并查看输出。\n\n\
  ### 记录数据在规则集中的路径：log (matches)\n\n该序列以一个域名解析开始，随后是两个来自打开的 SSH 连接的数据包，这告诉我们网站管理员可能在匹配规则上开启了\
  \ `log (all)`（请参见“记录数据包：log (all)”）。第四个数据包属于一个网站连接，第五个是出站连接的一部分，最后是另一个 SSH 包。如果你让这个命令继续运行，显示的行最终会滚出屏幕顶部，但你可以将数据重定向到文件或单独的程序进行处理。\n\
  \n为了实时显示日志，使用 `tcpdump` 直接从日志设备读取信息。这样做需要使用 `-i` 选项指定你想让 `tcpdump` 从哪个接口读取（`-l`\
  \ 选项启用行缓冲，如果你想查看捕获的内容，它非常有用）。\n\n```\n$ sudo tcpdump -l pflog0\nApr 29 22:07:36.097434\
  \ rule 16/(match) pass in on xl0: 85.19.150.98.53 > 213.187.179.198.41101:63267*-\
  \ 1/2 (68)\nApr 29 22:07:36.097760 rule def/(match) pass out on em0: 213.187.179.198.22\
  \ >\n192.168.103.44.30827: P 1825500807:182500883(76) ack 884130750 win 17520 [tos\
  \ 0x10]\nApr 29 22:07:36.098386 rule def/(match) pass in on em0: 192.168.103.44.30827\
  \ >\n213.187.179.198.22: ack 76 win 16308 (DF) [tos 0x10]\nApr 29 22:07:36.099544\
  \ rule 442/(match) pass in on xl0: 93.57.15.161.4487 >\n213.187.179.198.80:P ack\
  \ 3570451894 win 65535 <nop,nop,timestamp 417023961 0\nApr 29 22:07:36.108037 rule\
  \ 25/(match) pass out on xl0: 213.187.179.198.25 >\n236.166.45.65106: P 203817705:203817719(14)\
  \ ack 149019161 17424 (DF)\nApr 29 22:07:36.108240 rule def/(match) pass out on\
  \ em0: 213.187.179.198.22 >\n192.168.103.44.30827: P 76:232(156) ack 1 17520 [tos\
  \ 0x10]\n```\n\n\n\n\n\n```\nApr 29 21:08:24.386474 rule 3/(match) match in on em0:\
  \ 192.168.103.44.14054 > 81.93.163.115.80:\nS 1381487359:1381487359(0) win 16384\
  \ <mss 1460,nop,nop,sackOK,nop,wscale 3,nop,nop,timestamp\n735353043[|tcp]> (DF)\
  \ ➊\nApr 29 21:08:24.386487 rule 11/(match) block in on em0: 192.168.103.44.14054\
  \ >\n81.93.163.115.80: S 1381487359:1381487359(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n\
  3,nop,nop,timestamp 735353043[|tcp]> (DF) ➋\nApr 29 21:08:24.386497 rule 17/(match)\
  \ pass in on em0: 192.168.103.44.14054 > 81.93.163.115.80:\nS 1381487359:1381487359(0)\
  \ win 16384 <mss 1460,nop,nop,sackOK,nop,wscale 3,nop,nop,timestamp\n735353043[|tcp]>\
  \ (DF) ➌\nApr 29 21:08:24.386513 rule 17/(match) pass in on em0: 192.168.103.44.14054\
  \ > 81.93.163.115.80:\nS 1381487359:1381487359(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\
  \ 3,nop,nop,timestamp\n735353043[|tcp]> (DF)\nApr 29 21:08:24.386553 rule 5/(match)\
  \ match out on xl0: 213.187.179.198.14054 >\n81.93.163.115.80: S 1381487359:1381487359(0)\
  \ win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n3,nop,nop,timestamp 735353043[|tcp]>\
  \ (DF) ➍\nApr 29 21:08:24.386568 rule 16/(match) pass out on xl0: 213.187.179.198.14054\
  \ >\n81.93.163.115.80: S 1381487359:1381487359(0) win 16384 <mss 1460,nop,nop,sackOK,nop,wscale\n\
  3,nop,nop,timestamp 735353043[|tcp]> (DF) ➎\n```\n\n初始数据包首先匹配了 `rule 3`，即日志片段 ➊\
  \ 上方引用的 `match log (matches)`（匹配日志（匹配项））规则。下一个匹配项是我们加载的规则集中的 `rule 11` ➋，它是初始的 `block\
  \ all`（拦截所有）规则，但数据包也匹配了 `rule 17`，该规则允许其 `pass in on em0`（通过 em0 传入）➌。在 ➍ 处的下一个匹配\
  \ `rule 5` 显然是一个应用 `nat-to`（地址转换）的 `match` 规则（注意源地址发生了变化）。最后，由于匹配 `pass` 规则 `rule\
  \ 16` ➎，数据包 `out on xl0`（从 xl0 传）。\n\n这个示例实际上只包含一次转换（`nat-to`），但 `log (matches)`\
  \ 功能允许跟踪连接的初始数据包通过规则集中所有的匹配规则，包括源地址的替换。\n\n### 记录所有数据包：log (all)\n\n对于大多数调试和轻量级监控目的，记录连接中的第一个数据包就提供了足够的信息。然而，有时你可能想记录匹配某些规则的所有数据包。要这样做，请在你想要监控的规则中使用\
  \ `(all)` 日志选项。对我们的最小规则集进行此更改后，我们将得到如下：\n\n```\nblock log (all)\npass log (all)\
  \ quick proto tcp to port ssh keep state\n```\n\n此选项会让日志变得详细得多。为了说明 `log (all)`\
  \ 生成了多少数据，我们将使用以下规则集片段，它允许域名查询和网络同步：\n\n```\nudp_services = \"{ domain, ntp }\"\n\
  pass log (all) inet proto udp to port $udp_services\n```\n\n在这些规则生效的情况下，当俄罗斯 DNS\
  \ 服务器发送域名请求时，发生的情况如下：\n\n```\n$ sudo tcpdump -lnt pflog0 domain\ntcpdump: WARNING:\
  \ snaplen raised from 116 to 160\ntcpdump: listening on pflog0, link-type PFLOG\n\
  Sep 30 14:27:41.260190 212.56.14.53 > 194.54.107.53\nSep 30 14:27:41.260253 212.56.14.53\
  \ > 194.54.107.53\nSep 30 14:27:41.260267 212.56.14.53 > 194.54.107.53\nSep 30 14:27:41.260638\
  \ 212.56.14.53 > 194.54.107.53\nSep 30 14:27:41.260798 212.56.14.53 > 194.54.107.53\n\
  Sep 30 14:27:41.260923 212.56.14.53 > 194.54.107.53\n```\n\n现在我们有六条记录，而不是一条。即使 `port\
  \ domain` 被 `tcpdump` 过滤掉了，在一条或多个规则中添加 `log (all)` 也会显著增加日志数据量。如果你需要记录所有流量但网关的存储容量有限，可能会发现自己需要额外的存储，而且增加的\
  \ I/O 活动实际上对性能产生负面影响。此外，以此细节记录和存储流量日志可能会产生法律影响。\n\n### 负责任日志\n\n创建任何日志都可能有意想不到的后果，包括法律影响。一旦你开始存储流量生成的日志数据，你就在创建一个关于用户的信息的存储库。长期存储日志可能有良好的技术和业务理由，但记录足够的数据并存储合适的时间是一门艺术。\n\
  \n关于生成日志数据的实际问题可能取决于你所在地。某些国家和地区对处理日志数据有特殊要求，限制了数据的使用方式以及日志的保留时间。其他要求服务供应商保留特定时间的流量日志，在某些情况下还要求根据请求向执法部门提交此类数据。在构建日志基础设施之前，请确保你理解法律问题。\n\
  \n### 到多个 pflog 接口\n\nOpenBSD 4.1 之后的 PF 版本允许将日志数据重定向到多个 `pflog` 接口。在 OpenBSD 4.1\
  \ 中，`pflog` 接口变成了克隆设备，这意味着除了默认的 `pflog0` 之外，你还可以使用 `ifconfig` 命令创建多个 `pflog` 接口。这使得记录规则集不同部分的日志成为可能，并在必要时更容易处理结果。\n\
  \n从默认的单一 `pflog0` 接口切换到多个 `pflog` 接口需要对你的设置进行细微但有效的更改。要记录到多个接口，请确保规则集使用的所有日志接口都已创建。你不需要在加载规则集之前创建设备；如果规则集记录到一个不存在的接口，日志数据将被丢弃。\n\
  \n当你调整设置使用多个 `pflog` 接口时，你可能会从命令行添加所需的接口，如下：\n\n```\n$ sudo ifconfig pflog1\n```\n\
  \n在规则集中添加 `log` 关键字时，如下所示指定日志设备：\n\n```\npass log (to pflog1) proto tcp to $emailserver\
  \ port $email\npass log (to pflog1) proto tcp from $emailserver to port smtp\n```\n\
  \n在 OpenBSD 上为了更持久的配置，创建一个仅包含 `up` 的 `hostname.pflog1` 文件，以及任何额外日志接口的类似的 `hostname.pflogN`\
  \ 文件。\n\n在 FreeBSD 上，克隆 `pflog` 接口的配置应放在 `rc.conf` 文件中，格式如下：\n\n```\nifconfig_pflog1=\"\
  up\"\n```\n\n截至，在 NetBSD 上克隆 `pflog` 接口并不是一个选项。\n\n正如你在第 6 章 中看到的，将规则集不同部分的日志信息重定向到单独的接口，使得将\
  \ PF 生成的日志数据的不同部分提供不同的应用程序成为可能。这让 `spamlogd` 等程序只处理相关信息变得更容易，同时你可以将 PF 日志数据的其他部分提供给其他的日志处理程序。\n\
  \n### 记录 syslog，本地或远程\n\n避免在网关本身上存储 PF 日志数据的方法之一是指示网关记录到另一台机器上。如果你已经有了集日志日志基础设施，这是一个非常合逻辑的做法，即使\
  \ PF 的普通日志机制并不是真正为传统的 `syslog` 风格日志而设计的。\n\n\n\n\n\n正如任何老 BSD 手会告诉你的那样，传统的 `syslog`\
  \ 系统日志设施在管理从其他主机通过 `UDP` 接收的数据时有些笨拙，其中涉及磁盘满的拒绝服务攻击是一个经常被提到的危险。此外还一直存在一种风险，即在单个系统或网络的高负载下，日志信息可能会丢失。因此，*仅*当所有涉及的主机都通过安全良好且配置恰当的网络进行通信时，才考虑设置远程日志。在大多数\
  \ BSD 系统中，`syslogd` 默认并不接受来自其他主机的日志数据。（如果你计划使用远程 `syslog` 日志，请参阅 `syslogd` 手页获取有关如何启用监听来自远程主机日志数据的信息。）\n\
  \n如果你仍然想通过 `syslog` 进行 PF 日志记录，以下是实现此目的的简要方案。在普通的 PF 设置中，`pflogd` 将日志数据复制到日志文件中。当你想要将日志数据存储在远程系统时，应该通过更改\
  \ `rc.conf.local`（在 OpenBSD 上）中的守护启动选项来禁用 `pflog` 的数据累积，如下所示：\n\n```\npflogd_flags=\"\
  NO\"\n```\n\n在 FreeBSD 和 NetBSD 上，更改 `rc.conf.` 中的 `pflog_flats=` 设置行。然后杀死 `pflogd`\
  \ 进程。接下来，确保现在不再由 `pflogd` 收集的日志数据以有意义的方式传输到你的日志处理系统。这一步包含两个部分：首先，设置你的系统日志记录器将数据传输到日志处理系统，然后使用\
  \ `logger` 配合 `tcpdump` 转换数据并注入 `syslog` 系统。\n\n要设置 `syslogd` 处理数据，请选择你的*日志设施*（log\
  \ facility）、*日志级别*（log level）和*动作*（action），并将生成的行放入 `/etc/syslog.conf`。这些概念在 `man\
  \ syslog.conf` 中解释得非常清楚，如果你想理解系统日志，这是必读的。*动作*部分通常是本地文件系统中的一个文件。例如，如果你已经在 `loghost.example.com`\
  \ 设置了系统日志记录器来接收你的数据，请选择日志设施 `local2` 和日志级别 `info`，并输入此行：\n\n```\nlocal2.info   \
  \          @loghost.example.com\n```\n\n一旦执行了此更改，重启 `syslogd` 以读取新设置。\n\n接下来，设置\
  \ `tcpdump` 转换来自 `pflog` 设备的日志数据并将其交给 `logger`，随后将其发送到系统日志记录器。在这里，我们复用了本章之前基础示例中的\
  \ `tcpdump` 命令，并添加了一些有用的：\n\n```\n$ sudo nohup tcpdump -lnettti pflog0 | logger\
  \ -t pf -p local2.info &\n```\n\n`nohup` 命令确保进程即使在没有控制终端或被放入后台（如我们在这里在末尾使用 `&` 所示）时也能继续运行。`tcpdump`\
  \ 命令的 `-l` 选项指定行缓冲输出，这对于重定向到其他程序有用。`logger` 选项添加标签 `pf` 以识别流中的 PF 数据，并使用 `-p` 选项将日志优先级指定为\
  \ `local2.info`。结果被记录到你在日志主机上指定的文件中，条目看起来类似于所示：\n\n```\npf: Sep 21 14:05:11.492590\
  \ rule 93/(match) pass in on ath0:\n10.168.103.11.15842 > 82.117.50.17.80: [|tcp]\
  \ (DF)\npf: Sep 21 14:05:11.492648 rule 93/(match) pass out on xl0:\n194.54.107.19.15842\
  \ > 82.117.50.17.80: [|tcp] (DF)\npf: Sep 21 14:05:11.506289 rule 93/(match) pass\
  \ in on ath0:\n10.168.103.11.27984 > 82.117.50.17.80: [|tcp] (DF)\npf: Sep 21 14:05:11.506330\
  \ rule 93/(match) pass out on xl0:\n194.54.107.19.27984 > 82.117.50.17.80: [|tcp]\
  \ (DF)\npf: Sep 21 14:05:11.573561 rule 136/(match) pass in on ath0:\n10.168.103.11.6430\
  \ > 10.168.103.1.53:[|domain]\npf: Sep 21 14:05:11.574276 rule 136/(match) pass\
  \ out on xl0:\n194.54.107.19.26281 > 209.62.178.21.5[:domain]\n```\n\n### 使用标签跟踪每个规则的统计数据\n\
  \n标签不仅可以标识规则，还能更容易追踪特定流量。例如，你可以使用标签来测量带宽使用。在下面的示例中，我们分别为 `pass` 规则附加了 `mail-in`\
  \ 和 `mail-out` 标签。\n\n```\npass log proto { tcp, udp } to $logserver port smtp label\
  \ \"mail-in\"\npass log proto { tcp, udp } from $logserver port smtp label \"mail-out\"\
  \n```\n\n一旦加载了标签规则集，使用 `pfctl -vsl` 查看数据：\n\n```\n$ sudo pfctl -vsl\n    ➊     \
  \ ➋       ➌        ➍➎➏␐\nmail-in 1664158 1601986 763762591 887895 682427415 714091\
  \ 81335176\nmail-out 2814933 271121 492510664 1407278 239776267 1303933 25273497\n\
  ```\n\n此输出包含以下信息：\n\n1.  ➊ 标签\n2.  ➋ 规则评估次数\n3.  ➌ 通过的数据包总数\n4.  ➍ 通过的字节总数\n5. \
  \ ➎ 入站的数据包数\n6.  ➏ 入站的字节数\n7.  ␐ 出站的数据包数\n8.  �� 出站的字节数\n\n此列表的格式非常适合脚本和应用程序进行解析。\n\
  \n标签从规则集加载开始累积数据，直到其计数器被重置。而且，在许多场景下，设置一个 `cron` 任务以固定间隔读取标签值并将这些值存入持久化存储中是有意义的。\n\
  \n如果你选择以固定间隔收集数据，请考虑使用 `pfctl -vsl -z` 收集数据。`-z` 选项会在 `pfctl` 读取计数器后将其重置，这样你的数据收集器随后将获取自上次运行命令或脚本以来的*周期性数据*。\n\
  \n\n\n\n带有宏和列表的规则会展开为几个不同的规则。如果你的规则集包含带有列表以及带有标签（label）宏的规则，内存中的结果将是多个规则，每条规则都带有一个独立的、同名的标签。这可能会导致\
  \ `sudo pfctl -vsl` 输出产生困惑，但只要接收数据的应用程序或脚本可以通过累加相同标签的总和来正确解释数据，这就没有问题。\n\n如果你觉得这种数据收集方式对你有用，还需要注意的是，最近的\
  \ PF 版本提供了以 NetFlow 或 IPFIX 数据收集流量元数据的选项。详情请参阅使用 pflow(4) 收集 NetFlow 数据 收集 NetFlow\
  \ 数据\")。\n\n## PF 日志和统计的附加工具\n\n保持网络控制的另一个重要部分是能够保持系统状态的更新视图。在本节中，我们将检查一些你可能会发现有用的监控工具。这里介绍的所有工具在\
  \ OpenBSD 和 FreeBSD 的基础系统中可用，或者通过包系统可用（在某些例外情况下，在 NetBSD 上也可用）。\n\n## 使用 systat\
  \ 监控状态\n\n如果你感兴趣查看当前通过你系统的流量即时快照，OpenBSD 上的 `systat` 程序提供了非常有用的视图。在第 7 章中，我们简要查看了\
  \ `systat queues`，以查看流量是如何分配到流量整形规则集中的队列的。在这里，我们将回顾一些额外的实用选项。\n\n`systat` 程序在所有\
  \ BSD 操作系统上都可用，版本略有不同。在所有系统中，`systat` 都提供了系统统计的视图，但在语法和输出上略有差异。例如，`queues` 视图是最近\
  \ OpenBSD 版本提供的几个 `systat` 视图之一，但截至本文编写，FreeBSD 或 NetBSD 并不支持。\n\n为了获得比 `queues`\
  \ 更通用的当前状态表视图，请尝试 `systat states`，它提供的与 `top(1)` 进程列表非常类似的列表。以下是典型的 `systat states`\
  \ 输出示例：\n\n```\n 2 users     Load 0.24 0.28 0.27 (1-16 of 895)       Wed Apr 1 14:00:04\
  \ 2015\n\nPR   D SRC                  DEST                 STATE    AGE   EXP  PKTS\
