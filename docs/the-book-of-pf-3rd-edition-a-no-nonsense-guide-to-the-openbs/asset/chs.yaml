  \   Out 213.187.179.198:31709 209.250.145.51:6667   ESTABLISHED:ESTABLISHED 62082\
  \ 86379   6685   617K\ntcp   In  192.168.103.254:53863 69.90.74.197:80       ESTABLISHED:ESTABLISHED\
  \ 57056 29506     10   3282\ntcp   Out 213.187.179.198:53863 69.90.74.197:80   \
  \    ESTABLISHED:ESTABLISHED 57056 29506     10   3282\ntcp   In  10.168.103.15:33241\
  \   192.168.103.84:22     ESTABLISHED:ESTABLISHED 47254 82340   7555   897K\ntcp\
  \   Out 10.168.103.15:33241   192.168.103.84:22     ESTABLISHED:ESTABLISHED 47254\
  \ 82340   7555   897K\n```\n\n你可以使用 `pftop` 根据多种不同的标准对连接进行排序，包括按 PF、数据量、年龄和源目的地。\n\
  \n## 使用 pfstat 绘制流量图表\n\n一旦你的系统运行并产生数据，流量的图形化表示将是查看和分析数据的有用方法。为 PF 数据绘制图的一种方法是使用\
  \ `pfstat`，这是一种由 Daniel Hartmeier 开发的实用，用于提取并展示 PF 生成的统计数据。`pfstat` 工具可以通过 OpenBSD\
  \ 软件包获取，在 OpenBSD 和 FreeBSD 上通过 `sysutils/pfstat` 提供，在 NetBSD 上通过 `pkgsrc` 以 `sysutils/pfstat`\
  \ 提供。\n\n\n\n\nPF 数据可以通过 OpenBSD 4.5 中引入的 `pflow(4)` 伪接口以及 `pflow` 状态选项提供给 NetFlow\
  \ 工具。本质上，你预期在 NetFlow 风格流记录中找到的所有信息，都可以从 PF 保留在状态表中的数据轻松得出，而 `pflow` 接口提供了一种直接的方法，以这种易于处理且文档良好的格式导出\
  \ PF 状态表数据。与其他日志记录一样，你需要在 PF 规则集中按规则启用 NetFlow 数据采集。\n\n一个完整的基于 NetFlow 的网络监控系统由几个不同的部分组成。NetFlow\
  \ 数据源于一或多个生成网络流量数据的 `sensors`（传感器）。传感器将关于流（flows）的数据并转发到 `collector`（收集器），收集器存储接收到的数据。最后，`reporting`（报告）或\
  \ `analysis`（分析）系统让你提取并处理这些数据。\n\n## 设置 NetFlow 传感器\n\nNetFlow 传感器需要两个组件：一个或多个已配置的\
  \ `pflow(4)` 设备，以及你的规则集中至少有一条启用了 `pflow` 状态选项的 `pass` 规则。`pflow` 接口在创建时需要两个参数：流源\
  \ IP 地址和流目的 IP 地址及端口。以下是用于 `/etc/hostname.pflow0` 文件的 `ifconfig` 命令示例：\n\n```\n\
  flowsrc 192.0.2.1 flowdst 192.0.2.105:3001\n```\n\n在命令行中使用此命令：\n\n```\n$ sudo ifconfig\
  \ pflow0 create flowsrc 192.0.2.1 flowdst 192.0.2.105:3001\n```\n\n在这两种情况下，该命令都将设置主机将流源地址为\
  \ 192.0.2.1 的 NetFlow 数据发送到在 192.0.2.105、UDP 端口 3001 监听 NetFlow 数据的收集器。\n\n### 注意\n\
  \n可以设置具有不同流目的的多个 `pflow` 设备。然而，目前无法按规则指定由哪一个 `pflow` 设备接收生成的数据。\n\n在启用 `pflow` 设备后，在\
  \ `/etc/pf.conf` 中指定哪些 `pass` 规则应为传感器提供 NetFlow 数据。例如，如果你主要关注的是收集客户端到 IPv4 主机的电子邮件流量数据，则该规则将设置好所需的传感器：\n\
  \n```\npass out log inet proto tcp from <client> to port $email \\\n      label\
  \ client-email keep state (pflow)\n```\n\n当 `pflow` 首次引入 PF 时，早期采用者的直接反应是，他们很可能想在规则集中的大多数\
  \ `pass` 规则中添加 `pflow` 选项。这导致 PF 开发者 Henning Brauer 引入了另一个实用的 PF 特性——设置适用于所有规则（除非另有指定）的\
  \ `state defaults`。例如，如果你在规则集的开头添加以下行，配置中的所有 `pass` 规则将生成通过 `pflow` 设备导出的 NetFlow\
  \ 数据。\n\n```\nset state-defaults pflow\n```\n\n只要配置了至少一个 `pflow` 设备并且 `pf.conf`\
  \ 中至少有一条通过 `pflow` 设备导出数据的规则，你几乎就完成了传感器的设置。但是，你可能仍需要添加一条规则，允许 UDP 数据从你指定的流数据源 IP\
  \ 地址流向收集器的 IP 地址和流目的的目标端口。一旦完成最后一步，你就可以将注意力转向收集数据以进行进一步处理了。\n\n## NetFlow 数据采集、报告与分析\n\
  \n如果你的站点已经建立了基于 NetFlow 的采集和分析基础设施，你可能已经添加了必要的配置，将源自 PF 的数据馈给采集和分析系统。如果你还没有设置流分析环境，还有许多可用选项。\n\
  \nOpenBSD 软件包系统提供了三个 NetFlow 收集器和分析包：`flow-tools`、`flowd` 和 `nfdump`。这三个系统都有专门且胜任的开发者和用户社区，以及各种插件，包括图形化的\
  \ Web 界面。`flow-tools` 是许多站点流分析设置中的主要组件。`nfdump` 的粉丝则指向 `nfsen` 分析包，该包将 `nfdump`\
  \ 工具集成在一个强大且灵活的基于 Web 的分析前端中，该前端除其他功能外，还会显示你 GUI 选择对应的等效命令行。当你需要比 GUI 选择允许的范围更深入地钻取数据时，你会发现命令行显示非常有用。你可以复制\
  \ GUI 中显示的的命令，并在 Shell 会话或脚本的 `nfdump` 命令行中进行任何所需的进一步调整，以提取你所需的精确数据。\n\n### 选择收集器\n\
  \n收集器的选择在某种程度上取决于分析包的选择。可能因为收集器倾向于以各自独特的格式存储流数据，大多数报告和分析后端在开发时对其中一种收集器有明显的偏好。\n\n\
  无论你选择哪种 NetFlow 收集器，常见的日志注意事项都适用：详细的流量日志需要存储。在 NetFlow 的情况下，每个流都会生成一个大小相当固定的记录，经验表明，即使是繁忙站点上中等的采集配置每天也能产生数\
  \ GB 的 NetFlow 数据。你需要的存储空间与连接数量以及保留 NetFlow 数据的时间成正比。最后，记录和存储如此详细的流量日志可能会产生法律影响。\n\
  \n收集器通常提供过滤功能，允许你丢弃特定主机或网络的数据，甚至丢弃 NetFlow 记录本身的部分。为了说明基本的 NetFlow 采集以及如何提取部分数据，我们将使用由长期\
  \ OpenBSD 开发者 Damien Miller 开发的、通过软件包系统可用（在 OpenBSD 上为 `net/flowd`，在 FreeBSD 上为\
  \ `net-mgmt/flowd`）。\n\n我在这里选择 `flowd` 主要因为它的设计初衷是精巧、简单且安全。正如你将看到的，`flowd` 仍然非常有用且灵活。与其他工具的流数据操作在细节上会有不同，但基本原理是相同的。它非常紧凑，只有两个执行程序——采集守护进程\
  \ `flowd` 和流过滤演示程序 `flowd-reader`——以及支持库和配置文件。文档足够，尽管有些简短，示例配置文件 `/etc/flowd.conf`\
  \ 包含了大量的注释。根据手册页和示例配置中的注释，创建一个实用的收集器配置不需要长时间。\n\n在删掉所有注释行（使用 `grep -v \\# /etc/flowd.conf`\
  \ 或类似命令）后，一个非常基本的 `flowd` 配置可能如下：\n\n```\nlogfile \"/var/log/flowd\"\nlisten on\
  \ 192.0.2.105:3001\nflow source 192.0.2.1\nstore ALL\n```\n\n虽然此配置比之前描述设置传感器时 `pflow`\
  \ 接口的配置信息不多，但它包含了两个重要的项：\n\n*   `logfile` 行告诉我们收集的数据存储在何处（揭示了 `flowd` 倾向将所有数据存储在单个文件中）。\n\
  *   最后一行告诉我们 `flowd` 将存储从指定流源收到的数据的所有字段。\n\n\n\n\n配置好后，启动 `flowd` 守护进程，你应该几乎就能看到\
  \ `/var/log/flowd` 文件开始增大，因为网络流量通过你的网关且流记录正在被收集。一段时间后，你就可以使用 `flowd` 的伴侣程序 `flowd-reader`\
  \ 查看数据了。例如，在存储所有字段的情况下，来自 NAT 局域网主主机的一次名称查找的数据在 `flowd-reader` 的默认视图中如下：\n\n```\n\
  $ sudo flowd-reader /var/log/flowd\nFLOW recv_time 2011-04-01T21:15:53.607179 proto\
  \ 17 tcpflags 00 tos 00 agent\n[213.187.179.198] src [192.0.2.254]:55108 dst [192.0.2.1]:53\
  \ packets 1 octets\n62\nFLOW recv_time 2011-04-01T21:15:53.607179 proto 17 tcpflags\
  \ 00 tos 00 agent\n[213.187.179.198] src [192.0.2.1]:53 dst [192.0.2.254]:55108\
  \ packets 1 octets\n129\n```\n\n注意，该查找生成了两个流：每个方向各一个。\n\n第一个流主要通过接收时间识别，随后是所使用的协议（协议\
  \ 17 是 UDP，查看 `/etc/protocols` 即可获）。该连接的 TCP 和 TOS 标志位均未设置，且收集器从我们的网关 192.0.2.1\
  \ 接收了该数据。该流的源地址为 192.0.2.254，源端口 55108，目的地址为 192.0.2.1，源端口 53（传统上是 DNS 端口）。该流由 1\
  \ 个数据包组成，负载为 62 字节。返回流在同一时间被收集器接收，我们看到该流的源和目的地址反转了，且负载稍大，为 129 字节。`flowd-reader`\
  \ 的输出格式便于通过正则表达式解析，以便在报告工具或绘图软件中进行后处理。\n\n你可能认为这些数据就是人们对某个特定网络流想要的所有全部，但也可以提取更详细的信息。例如，使用\
  \ `flowd-reader -v` 进行详细输出，你可能会看到类似的内容：\n\n```\nFLOW recv_time 2011-04-01T21:15:53.607179\
  \ proto 17 tcpflags 00 tos 00\nagent [213.187.179.198] src [192.0.2.254]:55108 dst\
  \ [192.0.2.1]:53 gateway\n[0.0.0.0] packets 1 octets 62 in_if 0 out_if 0 sys_uptime_ms\
  \ 1w5d19m59s.000\ntime_sec 2011-04-01T21:15:53 time_nanosec 103798508 netflow ver\
  \ 5 flow_start\n1w5d19m24s.000 flow_finish 1w5d19m29s.000 src_AS 0 src_masklen 0\
  \ dst_AS 0\ndst_masklen 0 engine_type 10752 engine_id 10752 seq 5184351 source 0\
  \ crc32\n759adcbd\nFLOW recv_time 2011-04-01T21:15:53.607179 proto 17 tcpflags 00\
  \ tos 00\nagent [213.187.179.198] src [192.0.2.1]:53 dst [192.0.2.254]:55108 gateway\n\
  [0.0.0.0] packets 1 octets 129 in_if 0 out_if 0 sys_uptime_ms 1w5d19m59s.000\ntime_sec\
  \ 2011-04-01T21:15:53 time_nanosec 103798508 netflow ver 5 flow_start\n1w5d19m24s.000\
  \ flow_finish 1w5d19m29s.000 src_AS 0 src_masklen 0 dst_AS 0\ndst_masklen 0 engine_type\
  \ 10752 engine_id 10752 seq 5184351 source 0 crc32\nf43cbb22\n```\n\n`gateway` 字段表示传感器本身充当此连接的网关。你可以看到涉及的接口列表（`in_if`\
  \ 和 `out_if` 值）、传感器的系统运行时间（`sys_uptime_ms`）以及许多其他参数——例如 `src_AS` 和 `dst_AS`——这些在各种统计情况下可能有用。再次，这种输出非常适合通过正则表达式进行过滤。你不需要对从\
  \ `pflow` 传感器收集的数据依赖外部软件进行初始过滤。`flowd` 本身提供一系列过滤功能，使其能够存储你需要的数据。另一种方法是将过滤表达式放在 `flowd.conf`\
  \ 中（如下，去掉了注释以节省空间）：\n\n```\nlogfile \"/var/log/flowd.compact\"\nlisten on 192.0.2.105:3001\n\
  flow 192.0.2.1\nstore SRC_ADDR\nstore DST_ADDR\nstore PACKETS\nstore OCTETS\ninternalnet\
  \ = \"192.0.2/24\"\nunwired = \"192.168.103.0/24\"\ndiscard internalnet\ndiscard\
  \ unwired\n```\n\n你可以选择只存储某些字段。例如，在只有一个收集器的配置中，`agent` 字段没有用且不需要存储。在此配置中，我们只存储源目的地址、数据包数量和字节数。你可以进一步限制存储的数据。`internalnet`\
  \ 和 `unwired` 宏扩展为两个 NAT 网络，而 `discard` 行意味着 `flowd` 将丢弃接收到的这两个本地网络中的任何源或目的地址。结果是一个更紧凑的针对你需求的数据集，你只会看到可路由地址以及传感器的外部接口：\n\
  \n```\n$ sudo flowd-reader /var/log/flowd.compact | head\nFLOW src [193.213.112.71]:38468\
  \ dst [192.0.2.1]:53 packets 1 octets 79\nFLOW src [192.0.2.1]:53 dst [193.213.112.71]:38468\
  \ packets 1 octets 126\nFLOW src [200.91.75.5]:33773 dst [192.0.2.1]:53 packets\
  \ 1 octets 66\nFLOW src [192.0.2.1]:53 dst [200.91.75.5]:33773 packets 1 octets\
  \ 245\nFLOW src [200.91.75.5]:3310 dst [192.0.2.1]:53 packets 1 octets 75\nFLOW\
  \ src [192.0.2.1]:53 dst [200.91.75.5]:3310 packets 1 octets 199\nFLOW src [200.91.75.5]:2874\
  \ dst [192.0.2.1]:53 packets 1 octets 75\nFLOW src [192.0.2.1]:53 dst [200.91.75.5]:2874\
  \ packets 1 octets 122\nFLOW src [192.0.2.1]:15393 dst [158.37.91.134]:123 packets\
  \ 1 octets 76\nFLOW src [158.37.91.134]:123 dst [192.0.2.1]:15393 packets 1 octets\
  \ 76\n```\n\n即使使用了详细选项，`flowd-reader` 的显示也只显示你在过滤配置中明确指定的内容：\n\n```\n$ sudo flowd-reader\
  \ -v /var/log/flowd.compact | head\nLOGFILE /var/log/flowd.compact\nFLOW src [193.213.112.71]:38468\
  \ dst [192.0.2.1]:53 packets 1 octets 79\nFLOW src [192.0.2.1]:53 dst [193.213.112.71]:38468\
  \ packets 1 octets 126\nFLOW src [200.91.75.5]:33773 dst [192.0.2.1]:53 packets\
  \ 1 octets 66\nFLOW src [192.0.2.1]:53 dst [200.91.75.5]:33773 packets 1 octets\
  \ 245\nFLOW src [200.91.75.5]:3310 dst [192.0.2.1]:53 packets 1 octets 75\nFLOW\
  \ src [192.0.2.1]:53 dst [200.91.75.5]:3310 packets 1 octets 199\nFLOW src [200.91.75.5]:2874\
  \ dst [192.0.2.1]:53 packets 1 octets 75\n```\n\n幸运的是，`flowd` 并不会强制你在收集器从传感器接收流数据时做出所有的过滤决策。使用\
  \ `-f` 标志，你可以指定一个带有过滤语句的单独文件，以从较大的收集流数据集中提取特定数据。例如，为了查看访问你 Web 服务器的 HTTP 流量，你可以编写过滤器，只存储以\
  \ Web 服务器地址和 TCP 端口 80 为目的地的流，或者以 Web 服务器和 TCP 端口 80 为源的流：\n\n```\nwebserver = 192.0.2.227\n\
  discard all\naccept dst $webserver port 80 proto tcp\naccept src $webserver port\
  \ 80 proto tcp\nstore RECV_TIME\nstore SRC_ADDR\nstore DST_ADDR\nstore PACKETS\n\
  store OCTETS\n```\n\n假设你将过滤器存储为 `towebserver.flowdfilter`，那么你就可以从 `/var/log/flowd`\
  \ 中提取符合过滤标准的数据，如下所示：\n\n\n\n\n\n```bash\n$ sudo flowd-reader -v -f towebserver.flowd\
  \ /var/log/flowd | tail\nFLOW recv_time 2011-04-01T21:13:15.505524 src [89.250.115.174]\
  \ dst\n[192.0.2.227] packets 6 octets 414\nFLOW recv_time 2011-04-01T21:13:15.505524\
  \ src [192.0.2.227] dst\n[89.250.115.174] packets 4 octets 725\nFLOW recv_time 2011-04-01T21:13:49.605833\
  \ src [216.99.96.53] dst [192.0.2.227]\npackets 141 octets 7481\nFLOW recv_time\
  \ 2011-04-01T21:13:49.605833 src [192.0.2.227] dst [216.99.96.53]\npackets 212 octets\
  \ 308264\nFLOW recv_time 2011-04-01T21:14:04.606002 src [91.121.94.14] dst [192.0.2.227]\n\
  packets 125 octets 6634\nFLOW recv_time 2011-04-01T21:14:04.606002 src [192.0.2.227]\
  \ dst [91.121.94.14]\npackets 213 octets 308316\nFLOW recv_time 2011-04-01T21:14:38.606384\
  \ src [207.46.199.44] dst\n[192.0.2.227] packets 10 octets 642\nFLOW recv_time 2011-04-01T21:14:38.606384\
  \ src [192.0.2.227] dst\n[207.46.199.44] packets 13 octets 16438\nFLOW recv_time\
  \ 2011-04-01T21:15:14.606768 src [213.187.176.94] dst\n[192.0.2.227] packets 141\
  \ octets 7469\nFLOW recv_time 2011-04-01T21:15:14.606768 src [192.0.2.227] dst\n\
  [213.187.176.94] packets 213 octets 308278\n```\n\n除了此处演示的过滤选项外，`flowd` 过滤函数还接受许多其他选项。其中某些选项在其他过滤场景（如\
  \ PF）中会很常见，包括一系列网络相关的参数；另一些则更侧重于提取源特定日期或时间段的流数据，以及与其他存储相关的参数。一如既往，完整信息可以在 `man flowd.conf`\
  \ 中找到。\n\n一旦你提取了所需的数据，就有多种工具可用于处理和展示你的数据。\n\n### 使用 pfflowd 收集 NetFlow 数据\n\n对于不支持通过\
  \ `pflow` 导出 NetFlow 数据的系统，可以通过 `pfflowd` 包提供 NetFlow 支持。正如我们在上一节看到的，PF 状态表数据与 NetFlow\
  \ 数据模型匹配得非常好，`pfflowd` 用于记录本地系统 `pfsync` 设备的状态变化。一旦启用，`pfflowd` 将作为一个 NetFlow 传感器，将\
  \ `pfsync` 数据转换为 NetFlow 格式，并传输到网络上的 NetFlow 收集器。\n\n`pfflowd` 工具由 Damien Miller\
  \ 编写并维护，可以通过 `http://www.mindrot.org/projects/pfflowd/` 以及通过 OpenBSD 和 FreeBSD 的包系统以\
  \ `net/pfflowd` 获取。由于 NetBSD 不支持 `pfsync`，意味着在本文期间该平台尚不支持 `pfflowd`。\n\n### SNMP\
  \ 工具与 PF 相关的 SNMP MIBs\n\n*简单网络管理协议 (SNMP)* 设计旨在让网络管理员能够集中式系统收集并监控有关系统运行情况的关键数据，并更改多个网络节点上的配置。SNMP\
  \ 协议带有一个定义良好的接口和一种扩展*管理信息库 (MIB)* 的方法，MIB 定义了受管理的设备和对象。\n\n专有和开源的网络管理与监控系统通常以某种形式支持\
  \ SNMP，在某些产品中更是如此。\n\n\n\n\n\n多年来，阻止策略（block policies）的正确策略一直是讨论的热题。`block-policy`\
  \ 的默认设置为 `drop`，这意味着数据包被静默丢弃而不提供任何反馈。然而，静默丢弃数据包会导致发送方可能重发未确认的数据包，而不是断开连接。因此，发送方可能会持续尝试，直到相关的超时计数器过期。如果你不希望这种行为在你的设置中成为默认值，请将阻止策略设置为\
  \ `return`：\n\n```\nset block-policy return\n```\n\n此设置意味着发送方的网络堆栈将收到一个明确的信号，指示连接已被拒绝。\n\
  \n无论你使用哪种 `block-policy` 选项，它都会指定你阻止策略的*全局*默认值。但是，如果有需要，你仍然可以为特定规则更改阻止类型。例如，你可以从第\
  \ 6 章更改暴力破解保护规则集，将 `block-policy` 设置为 `return`，同时使用 `block drop quick from <bruteforce>`，让暴力破解者在加入\
  \ `<bruteforce>` 表后如果仍然逗留，就会浪费时间。你也可以对于从面向互联网的接口进入的不可路由地址的流量，或其他明显不需要的流量（例如尝试将你的设备用于分布式拒绝服务\
  \ (DDoS) 攻击放大），指定 `drop`。\n\n### 跳过接口 (Skip Interfaces)\n\n`skip` 选项允许你从所有 PF 处理中排除特定接口。其最终效果相当于为接口设置了\
  \ `pass-all` 规则，但它实际上禁用了该接口上所有的 PF 处理。例如，你可以使用此选项禁用回环接口组（loopback interface）的过滤，在大多数配置中，这里的过滤在安全性或便利性方面的作用很小：\n\
  \n```\nset skip on lo\n```\n\n事实上，在回环接口上进行过滤几乎没有用，并且会导致许多常用程序和服务的出现异常结果。默认情况下 `skip`\
  \ 为未设置，这意味着所有配置的接口都可以参与 PF 处理。除了使你的规则集变得稍微简单外，在不想执行过滤的接口上设置 `skip` 还能获得性能提升。\n\n\
  ### 状态策略 (State Policy)\n\n`state-policy` 选项指定了 PF 如何匹配数据包到状态表。它有两个可能的值：\n\n*  \
  \ 使用默认的 `floating` 状态策略，流量可以在所有接口上匹配状态，而不仅仅是创建状态的接口。\n*   使用 `if-bound` 策略，流量将仅在创建状态的接口上进行匹配；其他接口上的流量将不会匹配现有状态。\n\
  \n与 `block-policy` 选项类似，此选项指定了全局状态匹配策略，但如果需要，你可以根据每个规则来覆盖状态匹配策略。例如，在具有默认 `floating`\
  \ 策略的规则集中，你可以有一条如下的规则：\n\n```\npass out on egress inet proto tcp to any port $allowed\
  \ modulate state (if-bound)\n```\n\n通过此规则，任何尝试传回的入站流量都需要在创建状态的相同接口上通过，才能匹配状态表条目。\n\
  \n`if-bound` 策略实用的情况非常少，因此你应该保持该设置为为默认值。\n\n### 状态默认值 (State Defaults)\n\nOpenBSD\
  \ 4.5 引入了 `state-defaults` 选项，它允许你将特定的状态选项作为规则集中所有规则的默认选项——除非这些状态选项专门被单个规则中的其他选项显式覆盖。\n\
  \n这是一个常见的示例：\n\n```\nset state-defaults pflow\n```\n\n此选项将配置中的所有 `pass` 规则设定为生成\
  \ NetFlow 数据，并通过 `pflow` 设备导出。\n\n在某些上下文中，将状态跟踪选项（如连接限制）作为整个规则集的全局状态默认值是有意义的。这是一个示例：\n\
  \n```\nset state-defaults max 1500, max-src-conn 100, source-track rule\n```\n\n\
  此选项将每个规则的默认最大状态条目数设置为 1,500，任何单个主机的最大并发连接数为 100，并为加载的规则集中的每个规则设置了独立限制。\n\n在单个规则的\
  \ `keep state` 括号内有效的任何选项也可以包含在 `set state-defaults` 语句中。如果某些状态选项不是系统默认值，而你想将其应用到配置中的所有规则，那么通过这种方式设置状态默认值将非常有用。\n\
  \n### 超时 (Timeouts)\n\n`timeout` 选项设置了与状态表条目各种交互的超时时间和相关选项。可用参数的大多数是以秒存储的特定特定值，并带有\
  \ `tcp.`、`udp.`、`icmp.` 和 `other.` 前缀。然而，`adaptive.start` 和 `adaptive.end` 表示状态表条目的数量。\n\
  \n以下 `timeout` 选项影响状态表的内存使用，并在某种程度上影响查找速度：\n\n*   `adaptive.start` 和 `adaptive.end`\
  \ 值设置了当状态数量达到 `adaptive.start` 值时缩减超时值的限制。当状态数量达到 `adaptive.end` 时，所有超时时间都被设置为 0，实质是立即过期所有状态。默认值是\
  \ 6,000 和 12,000（分别计算为状态限制的 60% 和 120%）。这些设置与你通过 `limit` 选项设置的内存池限制密切相关。\n*   `interval`\
  \ 值表示清理过期状态之间间隔秒数。默认值为 10 秒。\n*   `frag` 值表示分片在被丢弃前保留的秒数。默认值为 30 秒。\n*   如果设置了 `src.track`\
  \ 表示在最后一个状态过期后保留源跟踪数据的秒数。默认值为 0 秒。\n\n你可以使用 `pfctl -s timeouts` 检查所有 `timeout` 参数的当前设置。例如，以下显示了运行默认值的系统：\n\
  \n```\nsudo pfctl -s timeouts\ntcp.first                  120s\ntcp.opening    \
  \             30s\ntcp.established          86400s\ntcp.closing                900s\n\
  tcp.finwait                 45s\ntcp.closed                  90s\ntcp.tsdiff   \
  \               30s\nudp.first                   60s\nudp.single               \
  \   30s\nudp.multiple                60s\nicmp.first                  20s\nicmp.error\
  \                  10s\nother.first                 60s\nother.single          \
  \      30s\nother.multiple              60s\nfrag                        30s\ninterval\
  \                    10s\nadaptive.start            6000 states\nadaptive.end  \
  \           12000 states\nsrc.track                    0s\n```\n\n这些选项可以调优你的设置。然而，偏离默认值更改协议设置会导致有效空闲连接被过早丢弃或直接阻塞的显著风险。\n\
  \n### 限制 (Limits)\n\n`limit` 选项设置 PF 用于状态表和地址表的内存池大小。这些是硬限制，因此由于各种原因你可能需要增加或调整这些值。如果你的网络流量很大，超过了默认值，或者你的设置需要大型地址表或大量的表，那么这一部分对你来说非常重要。\n\
  \n请记住，通过内存池获得的总内存是从内核内存空间中提取的，总量是可用内核内存的函数。内核内存在某种程度上是动态的，但分配给内核的内存永远不能等于或超过系统中所有的物理内存。（如果发生这种情况，将没有空间留给用户态程序运行。）\n\
  \n\n\n\n可用池内存的大小取决于你使用的硬件平台，还取决于特定本地系统的若干难以预测的变量。在 `i386` 架构上，最大内核内存处于 `768MB` 到\
  \ `1GB` 之间，取决于许多因素，包括系统中的硬件设备的数量和种类。实际分配给内存池的内存从此总量中得出，同样取决于许多系统特定的变量。\n\n要检查当前的\
  \ `limit` 设置，请使用 `pfctl -sm`。典型输出如下：\n\n```\n$ sudo pfctl -sm\nstates        hard\
  \ limit   10000\nsrc-nodes     hard limit   10000\nfrags         hard limit    5000\n\
  tables        hard limit    1000\ntable-entries hard limit   200000\n```\n\n要更改这些值，请编辑\
  \ `pf.conf` 以包含一个或多行带有新 `limit` 值的行。例如，你可以使用以下行将状态数量的硬限制提高到 25,000，将表项数量提高到 300,000：\n\
  \n```\nset limit states 25000\nset limit table-entries 300000\n```\n\n你也可以通过用括号将多个\
  \ `limit` 参数括起来，在单行中同时设置它们：\n\n```\nset limit { states 25000, src-nodes 25000, table-entries\
  \ 300000 }\n```\n\n最后，除了为了较大的安装量可能需要增加这三个参数外，你几乎肯定不应该更改这些限制。然而，如果你确实这样做，重要的是观察系统日志，是否有任何迹象表明你更改的限制产生了不良的副作用或不符合可用内存。将\
  \ `debug` 级别设置为较高的值对于观察调整 `limit` 参数的效果可能非常有用。\n\n### 调试\n\n`debug` 选项决定了 PF 在 `kern.debug`\
  \ 日志级别生成哪些（如果有的话）错误信息。默认值为 `err`，这意味着只记录严重错误。从 OpenBSD 4.7 版本开始，这里的日志级别与普通的 `syslog`\
  \ 级别对应，范围从 `emerg`（记录内核崩溃）、`alert`（记录可修正但非常严重的错误）、`crit`（记录关键状态）和 `err`（记录错误）到 `warning`（记录警告）、`notice`（记录异常状态）、`info`（记录信息消息）以及\
  \ `debug`（记录完整的调试信息，可能仅对开发者有用）。\n\n### 备注\n\n在 OpenBSD 4.7 之前的版本中，PF 使用自己的日志级别系统，默认值为\
  \ `urgent`（等于新系统中的 `err`）。其他可能的设置为 `none`（无消息）、`misc`（报告比 `urgent` 稍多）和 `loud`（产生大多数操作的状态消息）。为了兼容，`pfctl`\
  \ 解析器仍然接受旧式的调试级别。\n\n在我其中一个网关以 `debug` 级别运行了一段时间后，`/var/log/messages` 文件的一个典型片段看起来如下：\n\
  \n```\n$ tail -f /var/log/messages\nOct 4 11:41:11 skapet /bsd: pf_map_addr: selected\
  \ address 194.54.107.19\nOct 4 11:41:15 skapet /bsd: pf: loose state match: TCP\
  \ 194.54.107.19:25\n194.54.107.19:25 158.36.191.135:62458 [lo=3178647045 high=3178664421\
  \ win=33304\nmodulator=0 wscale=1] [lo=3111401744 high=3111468309 win=17376 modulator=0\n\
  wscale=0] 9:9 R seq=3178647045 (3178647044) ack=3111401744 len=0 ackskew=0\npkts=9:12\n\
  Oct 4 11:41:15 skapet /bsd: pf: loose state match: TCP 194.54.107.19:25\n194.54.107.19:25\
  \ 158.36.191.135:62458 [lo=3178647045 high=3178664421 win=33304\nmodulator=0 wscale=1]\
  \ [lo=3111401744 high=3111468309 win=17376 modulator=0\nwscale=0] 10:10 R seq=3178647045\
  \ (3178647044) ack=3111401744 len=0 ackskew=0\npkts=10:12\nOct 4 11:42:24 skapet\
  \ /bsd: pf_map_addr: selected address 194.54.107.19\n```\n\n\n\n\n我们将接下来讨论的两个功能\
  \ `scrub` 和 `antispoof` 具有共同的主题：它们能够针对网络流量中潜在的危险杂质提供自动化保护。它们通常合称为“网络卫生”工具，因为它们极极地清理了你的网络环境。\n\
  \n### 使用 `scrub` 进行包规范化：OpenBSD 4.5 及早期版本\n\n在包含 OpenBSD 4.5 在内的 PF 版本中，`scrub`\
  \ 关键字启用网络流量归一化。通过 `scrub`，分片包会被重组，而无效分片（例如重叠分片）会被丢弃，因此生成的包是完整且无歧的。\n\n启用 `scrub`\
  \ 可以防止某些基于对数据分片处理不当的攻击。虽然有许多补充选项可用，但最简单的形式适用于大多数配置：\n\n```\nscrub in\n```\n\n为了让某些服务能够与\
  \ `scrub` 配合，必须设置特定的选项。例如，某些 NFS 实现如果不使用 `no-df` 参数清除任何设置了“不可分片”位的数据包上的该位，则将完全无法与\
  \ `scrub` 工作。某些服务、操作系统和网络配置的组合可能需要一些较为罕见的 `scrub` 选项。\n\n### 使用 `scrub` 进行包规范化：OpenBSD\
  \ 4.6 及更高版本\n\n在 OpenBSD 4.6 中，`scrub` 从独立的规则内容降级为可以附加到 `pass` 或 `match` 规则的动作（`match`\
  \ 规则的引入是 OpenBSD 4.6 的主要新特性之一）。在 `scrub` 代码的这次重写的另一个重要进展是，消除了大量的包重组选项，取而代之的是新的 `reassemble`\
  \ 选项，它仅用于开启或关闭重组。\n\n使用新的 `scrub` 语法，需要在括号中提供至少一个选项。以下配置对我负责管理的几个网络效果良好：\n\n```\n\
  match in all scrub (no-df max-mss 1440)\n```\n\n此选项会清除“不可分片”位并将最大段大小设置为 1,440 字节。\n\
  \n还可以进行其他变体，尽管 OpenBSD 4.6 版本的 `scrub` 选项列表有所缩减，但你应该能够查阅手册页（man pages）并进行一些实验来满足特定需求。对于大多数设置，像前面引用的全局匹配规则将是合适的，但请记住，如果需要，你可以按规则更改\
  \ `scrub` 选项。\n\n如果你发现自己需要调试与 `scrub` 相关的问题，请研究 `pf.conf` 手册页并咨询相关邮件列表的专家。\n\n###\
  \ 使用 `antispoof` 防止欺骗\n\n一些非常实用且常见的包处理动作可以写成 PF 规则，但这样做会产生冗长、复杂且容易出错的规则集模板代码。因此，`antispoof`\
  \ 是为了过滤和拦截的一种常见特殊情况而实现的。该机制通过阻止那些在逻辑上不可能的方向出现在接口上的伪造包，来防止来自伪造或仿骗 IP 地址的活动。\n\n通过\
  \ `antispoof`，你可以指定要剔除来自世界其他地区的伪造流量，以及可能源于你内部网络的任何伪造包。[图 10-1. antispoof 丢弃了来自错误网络的入包。]\
  \ 说明了这一概念。\n\n![antispoof drops packets that come in from the wrong network.](img/httpatomoreillycomsourcenostarchimages2127169.png.jpg)图\
  \ 10-1. antispoof 丢弃了来自错误网络的入包。\n\n要建立图中所示的保护，通过以下两行为图中网络的两个接口指定 `antispoof`：\n\n\
  ```\nantispoof for $ext_if\nantispoof for $int_if\n```\n\n这些行会扩展为复杂的规则。第一条规则当源地址似乎是直接连接到\
  \ antispoof 接口的网络一部分，但从不同的接口到达时，拦截入站流量。第二条规则对内部接口执行相同的功能，拦截任何显然具有本地网络地址但从 `$int_if`\
  \ 以外接口到达的流量。但请记住，`antispoof` 并不是用于检测未直接连接到运行 PF 机器的远程网络的地址欺骗。\n\n## 测试你的设置\n\n现在是时候翻出描述你的设置*应该*如何运行的精确规范了。\n\
  \n我们示例网络的物理布局以一个*网关*为中心，该网关通过 `$ext_if` 连接到。通过 `$int_if` 连接到网关的是一个*本地网络*，带有工作站以及可能有一台或多台本地使用的服务器。最后，我们有一个通过\
  \ `$dmz_if` 连接的 *DMZ*，其中充满了为本地网络和互联网提供服务的服务器。[图 10-2. 带有 DMZ 服务器的网络]显示了网络的逻辑布局。\n\
  \n![Network with servers in a DMZ](img/httpatomoreillycomsourcenostarchimages2127171.png.jpg)图\
  \ 10-2. 带有 DMZ 服务器的网络\n\n相应的规则集规范看起来大致如下：\n\n*   我们网络之外的机器应该能够访问 DMZ 中服务器提供的服务。\n\
  *   连接到 `$int_if` 的本地网络中的机器应该能够访问 DMZ 服务器提供的服务，并且不应访问本地网络。\n*   DMZ 应该能够访问我们网络之外的一些服务。\n\
  *   DMZ 应该能够访问世界上的服务。\n\n眼下的任务是确保我们现规则集实际上实现了规范。我们需要测试该设置。一个有效的测试是尝试[表 10-1. 规则集测试]中的序列。\n\
  \n通常情况下，你应该使用预计典型用户拥有的应用程序进行测试，例如各种操作系统上的网络浏览器或邮件客户端。连接应根据规范简单地成功或失败。如果你的一个或多个基础测试给出了意外结果，请开始调试规则集。要点在于，在开始测试之前，你应该决定每个测试用例的预期和理想结果。表\
  \ 10-1. 规则集测试序列\n\n| 测试动作 | 预期结果 |\n| --- | --- |\n| 从本地网络连接到 DMZ 中服务器的每个允许端口 |\
  \ 连接应通过。 |\n| 从本地网络连接到网络外部服务器的每个允许端口 | 连接应通过。 |\n| 从 DMZ 连接到本地网络的任何端口 | 连接应被拦截。\
  \ |\n| 从 DMZ 连接到网络外部服务器的每个允许端口 | 连接应通过。 |\n| 从网络外部尝试连接到 DMZ 中 `$webserver` 的 `$webports`\
  \ 中的每个端口 | 连接应通过。 |\n| 连接应通过。尝试从网络外部尝试连接到 DMZ 中 `$webserver` 的端口 25 (SMTP) | 连接应被拦截。\
  \ |\n\n\n\n\n当你的配置行为不符合预期时，规则逻辑中可能存在错误，因此你需要找到错误并纠正它。追踪规则集中的逻辑错误可能非常耗时，并且可能涉及对你的规则集进行手动评估——包括存储在\
  \ `pf.conf` 文件中的版本，以及经过宏展开和任何优化后加载的版本。\n\n用户最初经常会将问题归咎于 PF，但事实证明这些是基础的网络问题。设置为错误双工模式的网络接口、错误的子掩码以及故障的网络硬件都是常见的罪祸首。\n\
  \n在深入研究规则集之前，你可以轻松判断是否是 PF 配置导致了问题。你可以通过 `pfctl -d` 禁用 PF 来查看问题是否消失。如果禁用 PF 后问题仍然存在，则你应该转而调试网络配置的其他部分。如果禁用\
  \ PF 后问题消失，且你正准备调整 PF 配置，请确保 PF 已启用，并使用此命令加载你的规则集：\n\n```\n$ sudo pfctl -si | grep\
  \ Status\nStatus: Enabled for 20 days 06:28:24          Debug: err\n```\n\n`Status:\
  \ Enabled` 告诉我们 PF 已启用，因此我们尝试使用另一个 `pfctl` 命令查看加载的规则：\n\n```\n$ sudo pfctl -sr\n\
  match in all scrub (no-df max-mss 1440)\nblock return log all\nblock return log\
  \ quick from <bruteforce> to any\nanchor \"ftp-proxy/*\" all\n```\n\n在这里，`pfctl\
  \ -sr` 等同于 `pfctl -s rules`。输出可能比这里显示的长一点，但这是你在加载规则集时预期会看到的良好示例。\n\n为了调试，可以考虑在 `pfctl`\
  \ 命令行中添加 `-vv` 标志以查看规则编号和一些额外的调试信息，如下所示：\n\n```\n$ sudo pfctl -vvsr\n@0 match in\
  \ all scrub (no-df max-mss 1440)\n  [ Evaluations: 341770    Packets: 3417668  \
  \ Bytes: 2112276585  States: 125  ]\n  [ Inserted: uid 0 pid 14717 State Creations:\
  \ 92254 ]\n@1 match out on nfe0 inet from 10.0.0.0/8 to any queue(q_def, q_pri)\
  \ nat-to\n(nfe0:1) round-robin static-port\n  [ Evaluations: 341770    Packets:\
  \ 0         Bytes: 0           States: 0    ]\n  [ Inserted: uid 0 pid 14717 State\
  \ Creations: 0 ]\n@2 match out on nfe0 inet from 192.168.103.0/24 to any queue(q_def,\
  \ q_pri)\nnat-to (nfe0:1) round-robin static-port\n  [ Evaluations: 68623     Packets:\
  \ 2138128   Bytes: 1431276138  States: 103  ]\n  [ Inserted: uid 0 pid 14717 State\
  \ Creations: 39109 ]\n@3 block return log all\n  [ Evaluations: 341770    Packets:\
  \ 114929    Bytes: 62705138    States: 0    ]\n  [ Inserted: uid 0 pid 14717 State\
  \ Creations: 0 ]\n@4 block return log (all) quick from <bruteforce:0> to any\n \
  \ [ Evaluations: 341770    Packets: 2         Bytes: 104         States: 0    ]\n\
  \  [ Inserted: uid 0 pid 14717 State Creations: 0 ]\n@5 anchor \"ftp-proxy/*\" all\n\
  \  [ Evaluations: 341768    Packets: 319954    Bytes: 263432399   States: 0    ]\n\
  \  [ Inserted: uid 0 pid 14717 State Creations: 70 ]\n```\n\n现在，你应该对加载的规则集进行结构化的梳理检查。找到与你正在调查的数据包匹配的规则。最后一条匹配的规则是什么？如果有多个规则匹配，其中某一个匹配规则是\
  \ `quick` 规则吗？（正如你可能从早的章节中记得的那，当数据包匹配 `quick` 规则时，评估就会停止，`quick` 规则指定的任何内容将应用于数据包。）如果是这样，你需要追踪评估过程直到到达规则集的末或数据包匹配了\
  \ `quick` 规则（从而结束该过程）。如果你的规则集梳理结束的地方不是你预期的匹配该数据包的规则，那么你就找到了逻辑错误。请务必注意 `match` 规则。如果你无法确定为什么特定的数据包会匹配特定的\
  \ `block` 或 `pass` 规则，原因可能是因为 `match` 规则应用了操作，导致数据包或连接匹配了除预期之外的过滤标准。\n\n规则集逻辑错误通常分为三类：\n\
  \n*   你的规则没有匹配，是因为它从未被评估。规则集中较早的 `quick` 规则匹配了，导致评估停止。\n*   你的规则没有匹配，是因为匹配标准不正确。\n\
  *   你的规则匹配了，但它不是决定结果的规则。\n\n\n\n运行网络是一件很有趣的事，我希望你喜欢这段关于我认为的网络安全领域最优秀工具的导览。在介绍 `PF`\
  \ 时，我在早期就做出了一个自觉的决定，即通过有趣且实用的配置向你介绍方法和思维方式，而不是提供所有可用功能的完整目录，或者将这本书写成完整的参考书。完整的 `PF`\
  \ 参考指南已经存在于 man pages（手册帮助文档）中，它们会随着每六个月一次的 OpenBSD 发布而更新。你也可以在附录 A 中列出的资源中找到更多信息。\n\
  \n现在你已经对 `PF` 的功能有了宽泛且基础的了解，可以根据自己对需求的想法开始构建网络了。你已经达到了能够熟练查阅 man pages 并定位到所需精确信息的程度。这正是有趣部分的开始！\n\
  \n### 即使你还没有遇到过这种特定的恶意攻击，你终将遇到。这里有一篇关于 DDOS 情况的记录，其中攻击者和被攻击者的笨拙程度不相：[DDOS 机器人是人还是有人操控](http://bsdly.blogspot.com/2012/12/ddos-bots-are-people-or-manned-by-some.html](http://bsdly.blogspot.com/2012/12/ddos-bots-are-people-or-manned-by-some.html)。你的攻击者可能会比这些更聪明、装备更好。\n\
  \n### 一些著名的攻击技术（包括几种历史上的拒绝服务设置）利用了分片处理中的漏洞，这些漏洞可能导致内存溢出或其他资源耗尽。其中一种针对 Cisco PIX\
  \ 防火墙系列的漏洞利用，描述在以下公告中：[`www.cisco.com/en/US/products/products_security_advisory09186a008011e78d.shtml`](http://www.cisco.com/en/US/products/products_security_advisory09186a008011e78d.shtml)。\n\
  \n## 附录 A. 资源\n\n![Resources](img/2atomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n尽管我可能想这样做，但事实在这些页面中涵盖 `PF` 配置的所有可能细节证明是不可能的。我希望这里列出的资源能填补某些细节，或者提供略有不同的视角。其中一些内容本身就非常值得一读。\n\
  \n## 互联网上的通用网络和 BSD 资源\n\n以下是贯书中引用的通用 Web 资源。查看各个 BSD 项目的网站以获取最新的信息是值得的。\n\n*  \
  \ 对于 OpenBSD 用户来说，特别特别感兴趣的是在线的 OpenBSD Journal ([`undeadly.org/`](http://undeadly.org/))。它提供了关于\
  \ OpenBSD 及相关问题的文章和文章。\n\n*   OpenBSD 官方网站 [`www.openbsd.org/`](http://www.openbsd.org/)\
  \ 是 OpenBSD 信息的主要参考。如果你正在使用 OpenBSD，你将不定期地访问这个网站。\n\n*   你可以在 [`www.openbsd.org/papers/`](http://www.openbsd.org/papers/)\
  \ 找到 OpenBSD 开发者的一系列演示稿和论文集。该网站是获取 OpenBSD 持续进展信息的良好来源。\n\n*   OpenBSD 常见问题解答 ([`www.openbsd.org/faq/index.html`](http://www.openbsd.org/faq/index.html))\
  \ 与其说是一个用户指南，而不是传统的问答文档。在这里你可以找到大量的背景信息以及关于如何设置和运行你的 OpenBSD 系统的逐步说明。\n\n*   Henning\
  \ Brauer 的演讲“更快的数据包——网络栈和 PF 中的性能调优” ([`quigon.bsws.de/papers/2009/eurobsdcon-faster_packets/`](http://quigon.bsws.de/papers/2009/eurobsdcon-faster_packets/))\
  \ 是当前 `PF` 开发者对近期 OpenBSD 版本中为提高网络性能所做工作的主要概述，其中 `PF` 是核心组件。\n\n*   PF: OpenBSD\
  \ 数据包过滤器 ([`www.openbsd.org/faq/pf/index.html`](http://www.openbsd.org/faq/pf/index.html))，也称为\
  \ `PF 用户指南`或 `PF 常见问题解答`，是由 OpenBSD 团队维护的官方 `PF` 文档。该指南随每次发布而更新，是 `PF` 从业者极具价值的参考资源。\n\
  \n*   Bob Beck 的“pf. 不仅仅用于防火墙了” ([`www.ualberta.ca/~beck/nycbug06/pf/`](http://www.ualberta.ca/~beck/nycbug06/pf/))\
  \ 是 NYCBUG 2006 的场演讲，涵盖了 `PF` 的冗余和可靠性功能，并以阿尔伯塔大学网络的真实案例进行了插说明。\n\n*   Daniel Hartmeier\
  \ 的 PF 页面 ([`www.benzedrine.cx/pf.html`](http://www.benzedrine.cx/pf.html)) 是他的\
  \ `PF` 相关材料集。\n\n*   Daniel Hartmeier 在 Usenix 2002 上展示的“OpenBSD 状态过滤的设计与性能”是一个关于\
  \ `PF` 的系列报告，其中第三部分“规则集优化” ([`quigon.bsws.de/papers/2009/eurobsdcon-faster_packets/`](http://quigon.bsws.de/papers/2009/eurobsdcon-faster_packets/))\
  \ 是当前 `PF` 开发者对近期 OpenBSD 版本中为提高网络性能所做工作的主要概述，其中 `PF` 是核心组件。\n\n*   Daniel Hartmeier\
  \ 的 PF 页面 ([`www.benzedrine.cx/pf.html`](http://www.benzedrine.cx/pf.html)) 是他的\
  \ `PF` 相关材料集。\n\n## 示例配置与感悟\n\n许多人慷慨地记录了自己的经验并在 Web 上提供了示例配置。以下是我最喜欢的几个。\n\n*  \
  \ Marcus Ranum 的“计算机安全中的六个愚蠢想法” ([`www.ranum.com/security/computer_security/editorials/dumb/index.html`](http://www.ranum.com/security/computer_security/editorials/dumb/index.html))\
  \ 写于 2005 年 9 月 1 日，是我一直喜欢的文章。这篇文章探讨了一些关于安全的常见误区，以及它们对现实安全努力的不利影响。\n\n\n\n\n*  \
  \ Randal L. Schwartz 的使用 OpenBSD 的 Packet Filter 监控网络流量) 展示了流量监控和使用标签进行计费的真实案例。虽然在过去的几年里，关于\
  \ `PF` 和标签的一些细节发生了变化，但该文章仍然具有可读性，并很好地展示了几个重要概念。\n\n*   瑞典用户组 `Unix.se` 的带上 OpenBSD\
  \ 的防火墙) 及其示例配置（例如基础的 `ALTQ` 配置）早期对我非常有帮助。该网站是一个很好的提醒：志愿者努力（如本地用户组）可以成为极佳的信息来源。\n\
  \n*   `#pf` IRC 频道的 wiki（[`www.probsd.net/pf/`](http://www.probsd.net/pf/)) 是由 `#pf`\
  \ IRC 频道讨论者维护的文档、示例配置和其他 `PF` 信息的集合。另一个非常值得的志愿者努力的例子。\n\n*   来自意大利的 OpenBSD 粉丝 Daniele\
  \ Mazzocchio 维护着网站 `Kernel Panic`，该网站在 [`www.kernel-panic.it/openbsd.html`](http://www.kernel-panic.it/openbsd.html)\
  \ 汇集了大量关于各种 OpenBSD 主题的实用文章和教程类文档（提供英文和意大利语）。它非常值得访问，可以从一个全新的视角了解各种有趣的话题，而作者似乎致力于让材料与最新的稳定\
  \ OpenBSD 版本保持同步。\n\n*   Kenjiro Cho 撰写的使用 ALTQ 管理流量) 是描述 `ALTQ` 设计及其在 FreeBSD 上早期实现的原始论文。\n\
  \n*   Jason Dixon 选于 2005 年 5 月在 SysAdmin 杂志) 上发表的[使用 OpenBSD 和 CARP 实现故障转移防火墙]是对\
  \ `CARP` 和 `pfsync` 的概览，并包含了一些实用示例。\n\n*   Theo de Raadt 在 OpenCON 2006 上的演讲硬件的开放文档：为什么硬件文档如此重要以及为什么如此难以获取)\
  \ 为附录 B 中关于通用自由操作系统（特别是 OpenBSD）硬件的说明文字提供了重要的启示。\n\n## 其它 BSD 系统上的 PF\n\n`PF` 已经从\
  \ OpenBSD 移植到其他 BSD 系统。虽然这些努力的明确目标自然是尽可能与 OpenBSD 推出的最新 `PF` 版本保持同步，但跟踪其他 BSD 中的\
  \ `PF` 项目是有用的。\n\n*   FreeBSD 数据包过滤器 (`pf`) 的主页（[`pf4freebsd.love2party.net/`](http://pf4freebsd.love2party.net/))\
  \ 描述了在 FreeBSD 上使用 `PF` 的早期工作和项目目标。目前，该页面并未更新最新进展，但希望在 Max Laier 注意到自己被一本印刷物引用后，它能再次焕发生机。\n\
  \n*   NetBSD 项目维护着 [`www.netbsd.org/docs/network.html`](http://www.netbsd.org/docs/network.html)\
  \ 的 `PF` 页面，你可以在那里找到关于其 的 `PF` 信息。\n\n## BSD 与网络书籍\n\n除了不断扩展的在线资源外，几本书可以作为本书的伴读或补充：\n\
  \n*   Michael W. Lucas 的 Absolute OpenBSD 是关于 OpenBSD 的深入介绍。\n\n*   Michael W. Lucas\
  \ 的 Network Analysis 展示了如何使用 `NetFlow` 进行网络分析。\n\n*   Brandon Palmer 和 Jose Nazario\
  \ 的 Secure Architectures with OpenBSD 介绍了构建安全的系统。\n\n*   Douglas R. Mauro 和 Kevin\
  \ J. Schmidt 的 Essential SNMP 正如其标题所示的。\n\n*   Jeremy C. Reed 的 The OpenBSD Packet\
  \ Filter 是关于 OpenBSD `PF` 的。\n\n*   Christopher M. Buechler 和 Jim Pingle 的 pfSense:\
  \ The Definitive Guide 是 `pfSense` 的综合指南。\n\n## 无线网络资源\n\nKjell Jørgen Hole 的 Wi-Fi\
  \ 课程 ([`www.nowires.org/`](http://www.nowires.org/)) 主要面向学生。\n\n## spamd 与白名单资源\n\
  \n如果处理邮件是你生活的一部分（或很可能是），你可能已经过以下白名单相关的 RFC：\n\n*   Evan Harris 的 The Next Step in\
  \ the Spam War: Greylisting) 是白名单的原始论文。\n\n*   Bob Beck 的 OpenBSD spamd—greylisting\
  \ and beyond) 是一个 NYCBUG 演讲，解释了 `spamd` 的工作原理，并介绍了阿尔伯塔大学的基础。（注意：演讲中提到的许多“未来工作”已经实施。）\n\
  \n*   Effective spam and malware countermeasures)) 是我 BSDCan 2007 的论文，包含了如何使用白名单、`spamd`\
  \ 以及其他工具成功对抗垃圾邮件和恶意软件的最佳实践。\n\n*   一个很有前景的新进展是 Peter Hessler 的 `BGP-spamd` 项目，它轻微利用\
  \ BGP 路由协议在参与的主机之间分发 `spamd` 数据。更多信息请参见项目网站 [`bgp-spamd.net/`](http://bgp-spamd.net/)。\n\
  \n## 书籍相关网络资源\n\n有关本书的新闻和更新，请查看 No Starch 网站上的书籍主页（[`www.nostarch.com/pf3/`](http://www.nostarch.com/pf3/)）。该页面包含指向我个人网络空间的链接，当各种更新和书籍资源可用时，它们将出现在那里。我将在\
  \ [`www.bsdly.net/bookofpf/`](http://www.bsdly.net/bookofpf/) 发布有关书籍的新闻和更新。与书籍相关的公告也可能出现在我的博客\
  \ [`bsdly.blogspot.com/`](http://bsdly.blogspot.com/) 上。\n\n\n\n\n我维护着教程稿《使用 OpenBSD\
  \ 的 PF 数据包过滤器构建防火墙》，这是本书的前身。我的政策是在适当的时候进行更新，通常是在我了解到 `PF` 及相关软件发生变化或新增功能时，以及在准备参加会议期间。该教程稿在\
  \ BSD 许可证下发布，可以从我的个人网络空间 [`home.nuug.no/~peter/pf/`](http://home.nuug.no/~peter/pf/)\
  \ 下载多种格式的版本。更新后的版本将在活动期间的自然钻研过程中多或少地出现在该 URL 上。\n\n## 购买 OpenBSD CD 并捐赠！\n\n如果你喜欢这本书或觉得它很有用，请前往\
  \ [`www.openbsd.org/orders.html`](http://www.openbsd.org/orders.html) OpenBSD.org\
  \ 订购页面购买 CD 组；或者，前往 [`www.openbsd.org/donations.html`](http://www.openbsd.org/donations.html)\
  \ 捐赠页面，通过资金贡献支持 OpenBSD 项目的进一步开发工作。\n\n如果你是那种更倾向于向公司捐赠的实体，可以联系 OpenBSD 基金会，这是一个成立于\
  \ 2007 年为了该特定目的而的加拿大非营利机构。请访问 [`www.openbsdfoundation.org/`](http://www.openbsdfoundation.org/)\
  \ OpenBSD 基金会网站获取更多信息。\n\n如果你在会议上发现了这本书，附近可能还有一个 OpenBSD 展位，你可以在那里购买 CD、T 恤等物品。\n\
  \n请记住，即使是免费软件，开发和维护也需要真实的投入和资金。\n\n## 录 B 关于硬件支持的说明\n\n![关于硬件支持的说明](img/Aatomoreillycomsourcenostarchimages2127149.png.jpg)\n\
  \n“硬件支持如何？”我经常听到这个问题，我的回答通常是：“根据我的经验，OpenBSD 和其他免费系统往往能够直接运行。”\n\n但出于某种原因，人们普遍认为，使用自由软件意味着要让硬件组件工作将是一场艰苦的斗争。在过去，这有一定的事实依据。我记得我曾在现有的硬件上安装\
  \ FreeBSD 2.0.5 时费过大劲。我可以从安装 CD 启动，但安装从未完成，因为我的 CD 驱动器没有被完全支持。\n\n那是 1995 年 6 月的事了，当时\
  \ PC CD 驱动器通常带有连接在声卡上的几乎相同但并不完全相同的 IDE 接口，而且廉价 PC 没有内置任何类型的网络硬件。为网络使用配置机器通常意味着移动网卡或主板上的跳线帽，或者运行某些奇异的专有设置软件——前提是你足够好拥有一个拥有或可以配备以太网接口的系统。\n\
  \n时代已经变了。今天，你可以合理地预期系统中的所有重要组件都能与 OpenBSD 配合。当然，为了构建最佳配置可能需要一些谨慎和计划，但这并不一定是一件坏事。\n\
  \n## 获取正确的硬件\n\n为你的系统获取正确的硬件本质上是检查你的系统是否满足你的项目和网络的需求：\n\n* 检查在线硬件兼容列表。\n* 检查 man\
  \ 手页（帮助页），或使用 `apropos` `keyword` 命令（其中 `keyword` 是你寻找的设备类型）。\n*   如果你需要更多背景信息，请搜索相关邮件列表的存档。\n\
  *   使用你最喜欢的搜索引擎查找有关特定设备与你的操作系统兼容情况的有用信息。\n\n在大多数情况下，硬件将按预期工作。然而，有时功能正常的硬件可能会带有奇特的限制。\n\
  \n许多设备的设计依赖于固件，这些固件在操作系统使用该设备之前必须被加载。这种设计选择的初衷几乎总是为了降低设备成本。当某些制造商拒绝授予固件的再分发权时，这个问题就成了一个麻烦，因为这意味着像\
  \ OpenBSD 这样的操作系统无法在发行版中包含固件。\n\n这类问题已出现在几种类型的硬件中。在许多情况下，制造商已被说服改变主意并允许再分发。然而，这并非所有情况下都会发生。一个例子是内置在许多流行笔记本电脑中的\
  \ Intel 无线网络硬件。这些硬件在许多操作系统中都支持，包括通过 `wpi` 和 `iwn` 驱动支持 OpenBSD。但即使有了这些驱动，除非用户手动获取并安装所需的固件文件，否则硬件无法工作。一旦安装完成并可以使用某种互联网连接，OpenBSD\
  \ 用户可以运行 `fw_update` 命令，来为系统识别为需要固件文件的组件获取并安装或升级固件。\n\n### 备注\n\n对于受限的支持性硬件，OpenBSD\
  \ 的 man 手页通常会注明该事实，甚至可能包含可能更改制造商政策的人员电子邮件地址。\n\n只需对制造商的许可政策做出微小的改变，就能让各地自由软件用户的生活变得更轻松并提高销量。可能在你读到这里时，大多数此类已经得到了解决。请务必在网上检查最新信息——如果特定公司拒绝采取明智行动，请准备用钱包投票。\n\
  \n如果你在网上购物，请在另一个标签页或窗口中保留 man 手页。如果你去实体店，请确保告诉店员你将使用 BSD。如果你不确定他们试图卖给你的部件，请要求借用机器从\
  \ CD 或 U 盘启动你感兴趣的硬件，并研究 `dmesg` 输出。提前告知店员你的项目可能会在部件无法使用时更容易退款。如果部件确实可用，告知供应商是很好的倡导。你的要求很可能是他们第一次听到你的操作系统。\n\
  \n## 如何帮助硬件支持工作\n\n如果你能贡献高质量的代码，BSD 项目希望听到你的声音。如果你自己不是开发者，贡献代码可能不是一个选项。以下是其他你可以贡献的方法：\n\
  \n\n\n\n\n- **从对开源友好的供应商处购买硬件。** 在对组织的设备采购做出决策或建议时，告诉供应商 `open source friendliness`\
  \ 是你们购买决策的考虑因素之一。\n\n- **让硬件供应商知道你对他们支持你喜爱的操作系统（或缺乏支持）的看法。** 一些硬件供应商非常有帮助，既提供样品机也提供编程文档。其他供应商则不那么配合，甚至直接敌视。这两种供应商，以及介于两者之间的供应商，都需要鼓励。写信给他们，告诉他们认为他们做得好的地方以及可以做哪些改进来提高。例如，如果某个供应商拒绝提供编程文档，或者仅在\
  \ `NDA` 之后提供，来自潜在客户的一封合理且措辞良好的信可能会改变局局面。\n\n- **帮助测试系统并检查你感兴趣的硬件的驱动程序。** 如果驱动程序存在或正在开发，开发者总是对他们的代码在他人设备上的运行情况报告感兴趣。系统运行良好的报告总是受欢迎的，但带有详细错误描述的\
  \ bug 报告对于创建和维护高质量的系统来说更为关重要。\n\n- **捐赠硬件或资金。** 开发者总是需要硬件来进行开发，而资金也对日常需求非常有帮助。如果你可以捐赠资金或硬件，请查看项目的捐赠页面（`[`www.openbsd.org/donations.html`](http://www.openbsd.org/donations.html)`\
  \ 用于 OpenBSD）或需求物品页面（`[`www.openbsd.org/want.html`](http://www.openbsd.org/want.html)`\
  \ 用于 OpenBSD）。倾向于通过加拿大非营利机构向 OpenBSD 捐赠的企业实体或其他可以通过 `OpenBSD Foundation` 进行，其网站地址为\
  \ `[`www.openbsdfoundation.org/`](http://www.openbsdfoundation.org/)`。向 OpenBSD\
  \ 捐赠极可能会帮助 `PF` 的开发，但如果你倾向于捐赠给 `FreeBSD`、`NetBSD` 或 `DragonFly BSD`，可以在它们的网站上找到相关方法的信息。\n\
  \n无论你与 BSD 以及硬件的关系如何，我希望这个附录能帮助你对购买什么以及如何支持 BSD 开发做出明智的决策。你的支持将有助于为所有人提供更多、质量更好的免费软件。\n\
  \n这也是经常被讨论的话题。例如，请参见 Theo de Raadt 在 OpenCON 2006 上的演讲“为什么硬件文档如此重要以及为什么如此难以获得”，该文位于\
  \ `[`www.openbsd.org/papers/opencon06-docs/index.html`](http://www.openbsd.org/papers/opencon06-docs/index.html)`。\n\
