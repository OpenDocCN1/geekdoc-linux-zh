  \ 是一位位于挪威卑根的顾问、作家和系统管理员。作为 Freenix 的长期倡导者，Hansteen 是 FreeBSD 和 OpenBSD 主题的频繁讲师，偶尔为《BSD\
  \ Magazine》的贡献者，并在 `http://bsdly.blogspot.com` 上撰写经常被 Slashdot 的博客。Hansteen 曾是 RFC\
  \ 1149 原始实现团队的成员。《PF 书》是他广受欢迎的在线 PF 教程（`http://home.nuug.no/~peter/pf/`）的扩展后续。\n\
