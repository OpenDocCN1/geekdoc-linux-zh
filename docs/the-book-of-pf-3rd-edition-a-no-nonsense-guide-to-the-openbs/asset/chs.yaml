  \  203.27.42.11:6667    4:4   61744 86375  6000  487K     0    49  *\ntcp  O 213.187.179.198:3000\
  \ 203.27.42.11:6667    4:4   61744 86375  6000  487K     0    49  *\ntcp  I 10.168.103.15:31709\
  \  129.240.64.10:6667    4:4   61998 86375  9266  849K     0    58    14  *\ntcp\
  \  O 213.187.179.198:31709 129.240.64.10:6667    4:4   61998 86375  9266  849K \
  \    0    58    14  *\ntcp  I 10.168.103.15:41785  213.187.179.198:22    4:4   62377\
  \ 86398  2954  613K 13264    *\ntcp  O 213.187.179.198:41785 213.187.179.198:22\
  \    4:4   62377 86398  2954  613K 13264 1*\n```\n\n如果你的状态（states）无法全部在一个屏幕上显示，请翻页查看。同样，`systat\
  \ rules` 会显示已加载规则集的实时包、字节和其他统计数据，如下所示：\n\n```\n2 users       Load 0.25 0.87 0.52\
  \  (1-16 of 239)        Fri  3 14:01:59 2015\n\nRUL ANCHOR      A DIR L    PR  \
