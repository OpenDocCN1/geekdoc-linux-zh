  \ ftp\n 15             P In L    egres tcp  K  18330 1350K   708     inet from any\
  \ to any port = smtp\n```\n\n`systat rules` 视图特别有用，因为它提供了完全解析并加载的规则集的实时视图。例如，如果你的规则集行为异常，`rules`\
  \ 视图可以指引你正确的方向并显示包流。\n\n`systat` 程序还提供了一个视图，呈现与通过命令行执行 `pfctl -s status` 获取相同的数据。下面的示例显示了\
  \ `systat pf` 的部分。`systat pf` 视图提供的信息比大多数屏幕能容纳的要多，但你可以翻页查看。\n\n```\n2 users    Load\
  \ 0.34 0.64 0.47  (1-16 of 51)        Fri  3 14:04:04 2015\n\n         TYPE NAME\
  \                          VALUE       RATE NOTES\n           pf Status        \
  \              Enabled\n           pf Since                     139:05:08\n    \
  \       pf Debug                           err\n           pf Hostid           \
  \        0x82aea02\n\n         nfe0 Bytes In                 6217042900        \
  \    IPv4\n         nfe0 Bytes In                          0            IPv6\n \
  \        nfe0 Bytes Out                5993394114            IPv4\n         nfe0\
  \ Bytes Out                        64            IPv6\n         nfe0 Packets In\
