  \ de Raadt 在 2003 年 2 月 20 日在 *openbsd-misc* 邮件列表中总结了这项工作。许可危机的最初风暴已经过去，净收益是一个处于免费许可下的全新数据包过滤系统，具有可用的最佳代码质量，并且\
  \ OpenBSD 自身和其他广泛使用的免费软件中获得了更好的免费许可。\n3. 与 IPFilter 配置的兼容是 PF 开发人员的早期设计目标，但一旦可以安全假设所有\
  \ OpenBSD 用户已迁移到 PF（大约在 OpenBSD 3.2 发布期间，如果不是的话），它就不是重点了。你不认为现有的 IPFilter 配置在任何\
