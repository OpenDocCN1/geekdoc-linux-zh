  \          167            IPv4, Blocked\n```\n\n`systat` 程序还提供了许多其他视图，包括网络相关的视图，如\
  \ `netstat`、用于虚拟内存统计的 `vmstat` 以及用于设备输入/输出统计的 `iostat`。你可以使用左、右方向键在所有 `systat` 视图之间切换。（详情请参阅\
  \ `man systat`）。\n\n\n\n\n\n## 使用 pftop 监控状态\n\n如果你的系统没有带有与 PF 相关视图的 `systat` 版本，你仍然可以使用\
  \ Can Erkin Acar 开发的 `pftop` 实时监控进出你网络的流量。该命令显示了你流量的实时运行快照。`pftop` 并不包含包含在基础系统中，但它可以作为包的形式提供——在\
  \ OpenBSD 和 FreeBSD 上通过 ports 以 `sysutils/pftop` 提供，在 NetBSD 上通过 `pkgsrc` 以 `sysutils/pftop`\
  \ 提供。以下是其输出的一个示例：\n\n```\npfTop: Up State 1-17/771, View: default, Order: none,\
  \ Cache: 10000                             14:05:42\n\nPR    DIR SRC           \
  \        DEST                           STATE            AGE   EXP   PKTS  BYTES\n\
  udp   Out 192.168.103.1:56729   192.168.103.9:12345        SINGLE:NO_TRAFFIC  8346m\
