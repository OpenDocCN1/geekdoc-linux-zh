  \ Windows 分区的起始地址（即 `/dev/nvme0n1p1` 结束的 `/dev/nvme0n1p2`）：\n\n```\nCommand (m for\
  \ help): d\nPartition 6 marked deleted.\nCommand (m for help): d\nPartition 5 will\
