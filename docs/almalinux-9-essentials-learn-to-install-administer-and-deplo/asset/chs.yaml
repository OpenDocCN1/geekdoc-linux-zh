  \     └─984 /usr/sbin/NetworkManager --no-daemon\n\n## 12.3 基础 nmcli 命令\n\n`nmcli`\
  \ 工具作为 `NetworkManager` 包的一部分安装，可以使用以下语法从命令行执行：\n\n```bash\nnmcli [Options] Object\
  \ {Command | help}\n```\n\n在上述语法中，`Object` 将是 general、networking、radio、connection、monitor、device\
  \ 或 agent 之一，可以缩写为单词的几个字母（例如，connection 可以写为 `con`，甚至只是字母 `c`）。例如，以下所有命令将输出与设备对象相关的帮助信息：\n\
  \n```bash\nnmcli device help\nnmcli dev help\nnmcli d help\n```\n\n要检查系统上 `NetworkManager`\
  \ 的整体状态，使用以下命令：\n\n```bash\nnmcli general status\n```\n\nSTATE CONNECTIVITY WIFI-HW\
  \ WIFI WWAN-HW WWAN\nconnected full enabled enabled enabled enabled\n\n要检查系统上安装的设备状态，可以使用以下命令：\n\
  \n```bash\nnmcli dev status\n```\n\nDEVICE TYPE STATE CONNECTION\neno1 ethernet\
  \ connected eno1\nwlp0s26u1u2 wifi connected zoneone\nvirbr0 bridge connected virbr0\n\
  lo loopback unmanaged --\nvirbr0-nic tun unmanaged --\n\n输出也可以通过使用 `-p` (pretty)\
  \ 选项进行修改，使输出更符合人类习惯：\n\n```bash\nnmcli -p dev status\n```\n\n=====================\n\
  \  设备状态\n=====================\nDEVICE TYPE STATE CONNECTION\n-------------------------------------------------------------------\n\
  eno1 ethernet connected eno1\nwlp0s26u1u2 wifi connected zoneone\nvirbr0 bridge\
  \ connected virbr0\nlo loopback unmanaged --\nvirbr0-nic tun unmanaged --\n\n相反，可以使用\
  \ `-t` 选项使输出更简练，并适用于自动化处理：\n\n```bash\nnmcli -t dev status\n```\n\neno1:ethernet:connected:eno1\n\
  wlp0s26u1u2:wifi:connected:emilyzone\nvirbr0:bridge:connected:virbr0\nlo:loopback:unmanaged:\n\
  virbr0-nic:tun:unmanaged:\n\n状态输出显示系统安装了两个物理设备，一个以太网设备，另一个 WiFi 设备。\n\n网桥 (`virbr`)\
  \ 条目是用于为虚拟机提供网络的虚拟设备（虚拟化主题将从名为\"虚拟化技术概述\"的章节开始介绍）。最后，回环接口（loopback）是一个特殊的虚拟设备，允许系统与自身通信，通常用于执行网络诊断。\n\
  \n在使用 `NetworkManager` 时，理解设备（device）和连接（connection）之间的区别非常重要。如上所述，设备是物理或虚拟网络设备，而连接是设备所连接的网络配置。\n\
  \n以下命令显示系统上配置的连接信息：\n\n```bash\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\nzoneone\
  \ 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 wifi wlp0s26u1u2\neno1 99d40009-6bb1-4182-baad-a103941c90ff\
  \ ethernet eno1\nvirbr0 e13e9552-1765-42d1-b739-ff981668fbee bridge virbr0\nzonetwo\
  \ f940a2d1-8c18-4a9e-bf29-817702429b8a wifi --\nzonethree fd65c5e5-3e92-4e9e-b924-1b0b07b7032\
  \ wifi --\n\n上述输出显示 WiFi 设备 (`wlp0s26u1u2`) 连接到名为 `zoneone` 的无线网络，而以太网设备 (`eno1`)\
  \ 连接到名为 `eno1` 的连接。除了 `zoneone` 之外，`NetworkManager` 还列出了另外两个名为 `zonetwo` 和 `zonethree`\
  \ 的 WiFi 连接，目前没有设备连接到。\n\n要查找分配给连接的 IP 地址，可以使用 `ip` 工具配合 `address` 选项：\n\n```bash\n\
  ip address\n```\n\n上述命令也可以缩写：\n\n```bash\nip a\n```\n\n3: wlp0s26u1u2: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc mq state UP group default qlen 1000\n      link/ether 74:da:38:ee:be:50\
  \ brd ff:ff:ff:ff:ff:ff\n      inet 192.168.1.121/24 brd 192.168.1.255 scope global\
  \ dynamic noprefixroute wlp0s261u2\n      valid_lft 57584sec preferred_lft 57584sec\n\
  \n`ip` 命令将输出系统上检测到的设备的信息。例如，上述输出显示 WiFi 设备已分配了 IP 地址 192.168.1.121。\n\n如果我们只想列出活动连接，可以使用\
  \ `-a` 配合 `nmcli` 命令：\n\n```bash\nnmcli con show -a\n```\n\n\n\n\n\n# 设备信息\n\n|\
  \ 名称 (NAME) | UUID | 类型 (TYPE) | 设备 (DEVICE) |\n| :--- | :--- | :--- | :--- |\n\
  | zoneone | 2abecafa-4ea2-47f6-b20f-4fb0c0fd5e94 | wifi | wlp0s26u1u2 |\n| eno1\
  \ | 99d40009-6bb1-4182-baad-a103941c90ff | ethernet | eno1 |\n| virbr0 | e13e9552-1765-42d1-b739-ff981668fbee\
  \ | bridge | virbr0 |\n\n## WiFi 管理\n\n要将 WiFi 连接从 `zoneone` 切换到 `zonetwo`，我们可以运行以下命令：\n\
  \n```bash\nnmcli device wifi connect zonetwo -ask\n```\n\n密码：\n\n`-ask` 会让 `nmcli`\
  \ 提示用户输入 WiFi 网络密码。要在命令行中包含 WiFi 密码（特别是在脚本中执行命令时有用），请使用 password 选项：\n\n```bash\n\
  nmcli device wifi connect zonetwo password <password here>\n```\n\n`nmcli` 工具还可以如下所示扫描可用的\
  \ WiFi 网络：\n\n```bash\nnmcli device wifi list\n```\n\n| 使用中 (IN-USE) | SSID | 模式\
  \ (MODE) | 通道 (CHAN) | 速率 (RATE) | 信号 (SIGNAL) | 强度 (BARS) | 安全 (SECURITY) |\n|\
  \ :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| | zoneone | Infra |\
  \ 6 | 195 Mbit/s | 80 | | WPA2 |\n| * | zonetwo | Infra | 11 | 130 Mbit/s | 74 |\
  \ | WPA1 WPA2 |\n\n可以使用如下方式禁用当前活动连接：\n\n```bash\nnmcli con down <connection name>\n\
  ```\n\n同样，可以随时恢复非活动连接：\n\n```bash\nnmcli con up <connection name>\n```\n\n当连接关闭时，NetworkManager\
  \ 会自动搜索另一个连接，激活它并将其分配到之前建立连接的设备上。要防止在这种情况下使用连接，请按如下方式禁用自动连接选项：\n\n```bash\nnmcli\
  \ con mod <connection name> connection.autoconnect no\n```\n\n可以使用以下命令获取有关特定连接的附加信息。包括所有连接属性的当前值：\n\
  \n```bash\nnmcli con show eno1\n```\n\n```text\nconnection.id: eno1\nconnection.uuid:\
  \ 99d40009-6bb1-4182-baad-a103941c90ff\nconnection.stable-id: --\nconnection.type:\
  \ 802-3-ethernet\nconnection.interface-name: eno1\nconnection.autoconnect: yes\n\
  connection.autoconnect-priority: 0\nconnection.autoconnect-retries: -1 (default)\n\
  connection.multi-connect: 0 (default)\nconnection.auth-retries: -1\nconnection.timestamp:\
  \ 1554833695\nconnection.read-only: no\nconnection.permissions: --\nconnection.zone:\
  \ --\nconnection.master: --\nconnection.slave-type: --\nconnection.autoconnect-slaves:\
  \ -1 (default)\n```\n\n所有这些属性都可以使用 `nmcli` 的 `modify` 选项通过以下语法进行修改：\n\n```bash\n\
  nmcli con mod <connection name> connection.<property name> <setting>\n```\n\n##\
  \ 12.4 使用连接配置文件\n\n到为止，我们已经探索了如何使用连接，但还没有解释如何配置连接。连接的配置被称为连接配置文件（connection profile），存储位于\
  \ `/etc/NetworkManager/system-connections` 目录下的文件中，其内容如下：\n\n```bash\nls /etc/NetworkManager/system-connections\n\
  ```\n\n```text\nzoneone.nmconnection eno1.nmconnection\nzonethree.nmconnection zonetwo.nmconnection\n\
  ```\n\n例如，考虑 `eno1.nmconnection` 文件的内容：\n\n```ini\nid=eno1\nuuid=99d40009-6bb1-4182-baad-a103941c90ff\n\
  type=ethernet\nautoconnect-priority=-999\ninterface-name=eno1\ntimestamp=1679678184\n\
  [ethernet]\n[ipv4]\nmethod=auto\n[ipv6]\naddr-gen-mode=eui64\nmethod=auto\n[proxy]\n\
  ```\n\n该文件包含有关连接的基本信息，包括当前分配的设备（`eno1`）的类型（以太网），以及在系统启动时使用 DHCP 获取 IP 地址自动激活连接（`auto`）。可以通过修改此文件并指示\
  \ `nmcli` 重新加载连接配置文件来实现连接更改：\n\n```bash\nnmcli con reload\n```\n\n也可以手动创建或通过 `nmcli`\
  \ 自动生成新的连接配置文件。例如，假设系统上安装了新的网络设备。发生这种情况时，NetworkManager 服务将检测到新硬件并为其设备。在下面的示例中，新设备被分配了名称\
  \ `eno2`：\n\n```bash\nnmcli dev status\n```\n\n| 设备 (DEVICE) | 类型 (TYPE) | 状态 (STATE)\
  \ | 连接 (CONNECTION) |\n| :--- | :--- | :--- | :--- |\n| eno1 | ethernet | connected\
  \ | eno1 |\n| eno2 | ethernet | connected | Wired connection 1 |\n\nNetworkManager\
  \ 自动检测到设备、激活了它并将其分配到名为“Wired connection 1”的连接。这是一个默认连接，我们对其没有配置控制，因为在 `/etc/NetworkManager/system-connections`\
  \ 中没有它的接口配置文件。因此，下一步是删除“Wired connection 1”连接，并使用 `nmcli` 创建新连接将其分配给设备。删除连接的命令如下：\n\
  \n```bash\nnmcli con delete \"Wired connection 1\"\n```\n\n接下来，可以使用 `nmcli` 创建一个新的连接配置文件，可以配置为静态\
  \ IP 地址或从 DHCP 服务器获取的动态 IP 地址。要创建一个名为 `dyn_ip` 的动态连接配置文件，将使用以下命令：\n\n```bash\nnmcli\
  \ connection add type ethernet con-name dyn_ip ifname eno2\n```\n\n连接 `dyn_ip` (`160d9e10-bbc8-439a-9c47-a2ec52990472`)\
  \ 已成功添加。\n\n要创建一个不锁定到特定设备的新连接配置文件，只需在命令中省略 `ifname` 选项即可：\n\n```bash\nnmcli connection\
  \ add type ethernet con-name dyn_ip\n```\n\n创建连接后，名为 `dyn_ip.nmconnection` 的文件将被添加到\
  \ `/etc/NetworkManager/system-connections` 目录中。\n\n或者，要创建一个名为 `static_ip` 并分配静态\
  \ IP 地址（在此情况下为 192.168.1.200）的连接，将使用以下命令：\n\n```bash\nnmcli con add type ethernet\
  \ con-name static_ip ifname eno0 ip4 192.168.1.200/24 gw4 1\n```\n\n连接 `static_ip`\
  \ (`41eca181-381c-4d12-b6c9-3044e986`) 已成功添加。对应的 `static_ip.nmconnection` 文件内容如下：\n\
  \n```ini\n[connection]\nid=static_ip\nuuid=41eca181-381c-4d12-b6c9-3044e986e9f1\n\
  type=ethernet\ninterface-name=eno0\n[ethernet]\n[ipv4]\nmethod=manual\naddress=192.168.1.200/24\n\
  gateway4=1\n[ipv6]\nmethod=auto\n[proxy]\n```\n\n## 12.5 交互式编辑\n\n除了带有命令行选项的 `nmcli`\
  \ 外，该工具还包含一个用于创建和修改连接配置文件的交互模式。例如，下面的记录显示了如何使用交互模式创建一个名为 `demo_con` 的新以太网连接：\n\n\
  ```bash\nnmcli edit\n\n可用连接类型: lowpan, 802-11-olpc-mesh (olpc-mesh), 802-11-wireless\
  \ (wifi), 802-3-ethernet (ethernet), adsl, bluetooth, bond, bridge, cdma, dummy,\
  \ generic, gsm, infiniband, ip-tunnel, macsec, macvlan, ovs-bridge, ovs-interface,\
  \ ovs-port, pppoe, team, tun, vlan, vpn, vxlan, wimax, wpan, bond-slave, bridge-slave,\
  \ team-slave\n\n连接连接: ethernet\n\n===| nmcli interactive connection editor |===\n\
  正在添加一个新的 '802-3-ethernet' 连接\n\n输入 'help' 或 '?' 查看可用命令。\n输入 'print' 显示所有连接属性。\n\
  输入 'describe <setting>.<prop>' 获取详细属性描述。\n\n你可以编辑以下设置: connection, 802-3-ethernet\
  \ (ethernet), 802-1x, dcb, sriov, ethtool, match, ipv4, ipv6, tc, proxy\n\nnmcli>\
  \ set connection.id demo_con\nnmcli> set connection.interface eno1\nnmcli> set connection.autoconnect\
  \ yes\nnmcli> set ipv4.method auto\nnmcli> set 802-3-ethernet.mtu auto\nnmcli> set\
  \ ipv6.method auto\nnmcli> save save\n\n正在保存 autoconnect=yes 的连接。这可能会立即激活连接。仍然要保存吗？yes/no)\
  \ [yes] yes\n连接 'demo_con' (cb837408-6c6f-4572-9548-4932f88b9275) 已成功保存。\n\nnmcli>\
  \ quit\n```\n\n另一方面，下面的记录修改了之前创建的 `static_ip` 连接配置文件，使其使用与最初指定的不同的静态 IP 地址：\n\n\
  ```bash\nnmcli con edit static_ip\n\n===| nmcli interactive connection editor |===\n\
  ```\n\n\n\n\n正在编辑现有的 '802-3-ethernet' 连接：'static_ip'\n\n输入 `help` 或 `?` 可查看可用命令。\n\
  \n输入 `print` 显示所有连接属性。\n\n输入 `describe [<setting>.<prop>]` 获取详细的属性描述。\n\n你可以编辑以下设置：`connection`,\
  \ `802-3-ethernet` (ethernet), `802-1x`, `dcb`, `sriov`, `ethtool`, `match`, `ipv4`,\
  \ `ipv6`, `tc`, `proxy`\n\n```\nnmcli> print ipv4.addresses\nipv4.addresses: 192.168.1.200/24\n\
  nmcli> set ipv4.addresses 192.168.1.201/24\nnmcli> save\nConnection 'static_ip'\
  \ (3fccafb3-e761-4271-b310-ad0f28ee8606) successfully updated.\nnmcli> quit\n```\n\
  \n修改现有连接后，请记住指示 NetworkManager 重新加载配置方案：\n\n```\nnmcli con reload\n```\n\n在使用交互模式时，了解可以使用广泛的内置帮助系统对于学习如何使用该工具非常有帮助。在\
  \ `nmcli >` 提示符下输入 `help` 或 `?` 访问帮助主题：\n\n```\nnmcli> ?\n```\n\n------------------------------------------------------------------------------\n\
  \n---[ 主菜单 ]---\n\n- `goto [<setting> | <prop>]` :: 跳转到设置或属性\n- `remove <setting>[.<prop>]\
  \ | <prop>` :: 移除设置或重置属性值\n- `set [<setting>.<prop> <value>]` :: 设置属性值\n- `describe\
  \ [<setting>.<prop>]` :: 描述属性\n- `print [all | <setting>[.<prop>]]` :: 连接\n- `verify\
  \ [all | fix]` :: 验证连接\n- `save [persistent|temporary]` :: 保存连接\n- `activate [<ifname>]\
  \ [/<ap>|<nsp>]` :: 激活连接\n- `back` :: 返回上一级\n- `help/? [<command>]` :: 打印此帮助\n-\
  \ `nmcli <conf-option> <value>` :: nmcli 配置\n- `quit` :: 退出 nmcli\n\n------------------------------------------------------------------------------\n\
  \n## 12.6 配置 NetworkManager 权限\n\n除了让 AlmaLinux 9 的网络管理更加容易外，NetworkManager 还允许为连接指定权限。例如，以下命令将连接方案限制为\
  \ root 账户以及名为 `john` 和 `caitlyn` 的用户账户：\n\n```\nnmcli con mod static_ip connection.permissions\
  \ user:root,john,caitlyn\n```\n\n一旦 NetworkManager 重新加载了连接方案，`static_ip` 连接只有在系统中至少有一个指定用户登录到活动会话时，才会激活并供其他用户访问。一旦这些用户中的最后一人注销，连接将关闭并保持非活动状态，直到其中一个用户重新登录。\n\
  \n此外，只有具有权限的用户才能更改连接状态或配置。\n\n## 12.7 Summary\n\nNetworkManager 服务负责 AlmaLinux 9\
  \ 上的网络管理。`NetworkManager` 将网络视为由网络接口设备和连接组成。网络设备可以是物理以太网或 WiFi 设备，也可以是虚拟机客户端使用的虚拟设备。连接代表设备所连接的网络，并通过连接方案进行配置。配置方案除了其他设置外，还会定义连接是使用静态还是动态\
  \ IP 地址、网络使用的任何网关的 IP 地址，以及每次系统启动时是否应自动建立连接。\n\n可以使用多种工具管理 `NetworkManager`，包括 `nmcli`\
  \ 和 `nmtui` 命令行工具、`nm-connection-editor` 图形工具以及 Cockpit Web 界面的网络设置部分。通常，`nmcli`\
  \ 命令行工具提供了最多的功能和灵活性。\n\n## 13 AlmaLinux 9 防火墙基础\n\n防火墙是单个计算机系统或计算机网络免受外部攻击（通常来自互联网连接）的关键组件。任何直接连接到互联网的计算机在理想情况下都应该运行防火墙以防止恶意活动。同样，任何内部网络与其外部互联网连接之间都必须有某种形式的防火墙。\n\
  \nAlmaLinux 9 内置了名为 `iptables` 的强大防火墙技术。关于配置 `iptables` 甚至可以编写整本书的书。如果你想学习 `iptables`，我们推荐以下内容：\n\
  \nhttps://www.linuxtopia.org/Linux_Firewall_iptables/index.html\n\n本章将涵盖防火墙、TCP/IP\
  \ 端口和服务的某些基本概念。AlmaLinux 9 上的防火墙配置将在标题为“AlmaLinux 9 Firewall Configuration with\
  \ firewalld”的章节中介绍。\n\n## 13.1 理解端口和服务\n\n如今最主要的网络通信协议是 TCP/IP。它是互联网所使用的协议，因此扫清了大多数以前用于局域网（LAN）的流行协议。\n\
  \n`TCP/IP` 定义了总共 65,535 个端口，其中 1023 个被认为是良好端口。至关重要的是理解，这些不是连接网缆的物理端口，而是每个网络连接上的虚拟端口，应用程序和服务可以通过可以通过\
  \ TCP/IP 网络连接对其进行通信。事实上，流行的网络客户端和服务所使用的端口数量仅占良好端口组中更更小的子集。\n\n操作系统可以提供几种不同的 TCP/IP\
  \ 服务。本章末尾的表格提供了此类服务的完整列表。如此，这些服务包括用于运行安全 Web 服务器的 `HTTPS`、允许文件传输的 `FTP`、提供安全远程登录访问和文件传输的\
  \ `SSH` 以及用于传输电子邮件消息的 `SMTP`。每个服务随后被分配到一个标准的 TCP/IP 端口。例如，`HTTPS` 被分配给端口 443，而 `SSH`\
  \ 通信发生在端口 22 上。\n\n### 13.2 端口和服务的安全\n\n服务器安全的大部分涉及定义角色，并根据角色定义应该启用哪些服务和端口。例如，仅作为\
  \ Web 服务器运行的服务器应该只运行 `HTTPS` 服务（可能还有用于远程管理访问的 `SSH`）。所有其他服务都应该禁用，并且理想情况下应从操作系统中完全删除（这使得入侵者难以重新启用该服务）。\n\
  \n确保系统安全涉及从操作系统删除任何不必要的服务，并确保使用防火墙阻塞与非本质服务相关的端口。定义哪些端口可访问以及在什么情况下访问的规则是使用 `iptables`\
  \ 定的。\n\n许多操作系统在安装时默认安装并激活了若干服务。在安装新的操作系统之前，必须对安装进行仔细规划。这种规划涉及决定哪些服务不需要，并识别哪些服务是默认安装并启用的。部署新操作系统安装绝不能仓忙。系统上可的服务和开放端口越少，攻击者的表面和机会就越小。\n\
  \n## 13.3 AlmaLinux 9 服务和 iptables 规则\n\n默认情况下，新安装的 AlmaLinux 9 系统没有定义任何 `iptables`\
  \ 规则来限制对端口的访问。可以在终端窗口执行以下命令来查看当前的 `iptables` 设置：\n\n```\niptables -L\n\nChain INPUT\
  \ (policy ACCEPT)\ntarget prot opt source destination\n\nChain FORWARD (policy ACCEPT)\n\
  target prot opt source destination\n\nChain OUTPUT (policy ACCEPT)\ntarget prot\
  \ opt source destination\n```\n\n\n\n如上图所示的输出所示，目前尚未定义任何规则。虽然这看起来像是一个不安全的配置，但必须记住，新安装的\
  \ AlmaLinux 9 系统默认运行的服务较少，这使得端口对于潜在的攻击者来说是无用的。例如，访问新安装的 AlmaLinux 9 系统上的 Web 服务器是不可能的，因为默认没有安装或运行任何\
  \ Web 服务器服务。一旦系统上开始激活服务，通过定义 `iptables` 规则来建立防火墙策略将至关重要。\n\n有多种方法可以定义 `iptables`\
  \ 规则，包括使用命令行工具和配置文件。例如，要阻止来自 IP 地址 192.168.2.76 访问端口 25（用于 SMTP 邮件传输协议），可以在终端窗口中执行以下命令：\n\
  \n```\niptables -A INPUT -s 192.168.2.76 -p tcp --destination-port 25 -j DROP\n\
  ```\n\n如果我们现在检查当前规则，将看到该规则目前列在其中：\n\n```\niptables -L\n\nChain INPUT (policy ACCEPT)\n\
  \ntarget prot opt source destination\n\nDROP tcp -- 192.168.2.76 anywhere tcp dpt:smtp\n\
  \nChain FORWARD (policy ACCEPT)\n\ntarget prot opt source destination\n\nChain OUTPUT\
  \ (policy ACCEPT)\n\ntarget prot opt source destination\n```\n\n该规则随后可以按如下方式删除：\n\
  \n```\niptables -D INPUT -s 192.168.2.76 -p tcp --destination-port 25 -j DROP\n\
  ```\n\n考虑到 `iptables` 的复杂性，创建几个用户友好的配置工具来简化规则创建过程，这并不令人意外。其中一种工具是 `firewall-cmd`\
  \ 命令行工具，它将在章节“使用 firewalld 配置 AlmaLinux 9 防火墙”中进行介绍。\n\n## 13.4 常用端口和服务\n\n\n\n\
  在继续介绍更复杂的防火墙规则之前，首先值得花时间概述 AlmaLinux 9 系统提供的一些关键服务以及相应的端口号：\n\n| 端口 | 分配 | 描述 |\n\
  | :--- | :--- | :--- |\n| 20 | FTP | 文件传输协议（数据）- 文件传输协议提供了一种在连接网络的计算机系统之间传输特定文件的机制。传输通常使用\
  \ `ftp` 客户端进行。大多数现代网络浏览器也可以在远程 FTP 服务器上浏览和下载文件。FTP 使用 TCP（而不是 UDP）来传输文件，这被认为是一种非常可靠的传输机制。FTP\
  \ 不加密数据，不被认为是一种安全的文件传输协议。强烈建议使用安全拷贝协议 (SCP) 和安全文件传输协议 (SFTP) 代 FTP。 |\n| 21 | FTP\
  \ | 文件传输（控制） - 传统上，FTP 分配了两个端口（端口 20 和 21）。端口 20 最初被认为是数据传输端口，而端口 21 分用于通信控制信息。然而，在现代实现中，端口\
  \ 20 很少使用，所有通信都在端口 21 上进行。 |\n| 22 | SSH | 安全 Shell - Secure Shell 通过 TCP/IP 网络为主机提供安全、加密的远程登录会话。原始远程访问机制是\
  \ Telnet 协议。然而，由于 Telnet 以明文传输数据，强烈建议不要使用它，而应使用安全 shell，它可以加密包括登录和密码凭据在内的所有通信。SSH\
  \ 还提供了通过安全拷贝协议 (SCP) 安全传输文件的机制，并作为安全文件传输协议 (SFTP) 的基础。SSH 同时也替代了 `rsh` 和 `rlogin`\
  \ 客户端。 |\n| 23 | Telnet | Telnet - Telnet 是一种终端仿真协议，可以通过 TCP/IP 连接登录远程系统。该访问是基于文本的，允许用户在远程主机的命令提示符中输入，远程主机显示的文本显示在本地\
  \ Telnet 客户端上。Telnet 不加密客户端和服务器之间通信的密码或文本。因此，强烈建议不要 telnet。大多数现代系统都会关闭端口 23 并禁用\
  \ telnet 服务以防止其使用。应该用 SSH 代替 Telnet。 |\n| 25 | SMTP | 简单邮件传输协议 - SMTP 定义了邮件消息从一个网络主机发送到另一个主机的机制。SMTP\
  \ 是一种简单的协议，要求邮件服务在接收主机上始终可用。通常，接收主机会将传入的消息存储在存储池中，供收件人随后使用 `POP3` 或 `IMAP` 协议访问。此外，SMTP\
  \ 使用 TCP 传输协议来确保消息无错交付。 |\n| 53 | DNS | 域名系统 - TCP/IP 网络用于将主机名和完全限定域名 (FQDN) 翻译为\
  \ IP 地址的服务。 |\n| 69 | TFTP | 简单文件传输协议 - TFTP 是文件传输协议 (FTP) 的精简版本。它具有减少的命令集且缺乏认证。TFTP\
  \ 最显著的特征是它使用 UDP 传输数据。这导致了高速传输速度，但因此缺乏数据可靠性。TFTP 通常用于无盘工作站的网络启动。 |\n| 80 | HTTP\
  \ | 超文本传输协议 - HTTP 用于从 Web 服务器向网络浏览器下载文本、图形和多媒体内容。它定义了浏览器和服务器之间的命令和控制机制，定义了客户端请求和服务器响应。HTTP\
  \ 基于 TCP 传输协议，因此是一种面向连接的协议。 |\n| 110 | POP3 | 邮局协议 - `POP3` 是一种从服务器存储和检索传入的邮件消息的机制。在大多数企业环境中，传入的邮件存储在邮件服务器上，并在用户检查邮件时下载到运行在用户桌面或笔记本电脑上的邮件客户端上。然而，`POP3`\
  \ 将所有新消息下载到客户端，不允许用户选择下载哪些消息、查看标头或仅下载部分消息。出于此原因，`IMAP` 协议越来越多地被用于替代 `POP3`。 |\n\
  | 119 | NNTP | 网络新闻传输协议 - 负责向 Usenet 新服务器（即托管在远程服务器上的新闻组和讨论论坛）发布和检索消息。NNTP 运行在 OSI\
  \ 栈的应用层，并使用 TCP 确保消息无错检索和传输。 |\n| 123 | NTP | 网络时间协议 - 一种旨在同步计算机时钟与外部时间源的协议。使用此协议，操作系统或应用程序可以向远程\
  \ `NTP` 服务器请求当前时间。远程 `NTP` 服务器通常基于核钟提供的时间。NTP 有助于确保网络中的所有系统设置为相同的准确的当天时间。这在安全情况下尤为重要，例如当对客户端或服务器上文件访问或修改的时间存在疑问时。\
  \ |\n| 143 | IMAP4 | 互联网消息访问协议第四版 - `IMAP4` 是一种先进且安全的邮件检索协议。`IMAP` 类似于 `POP3`，允许用户访问存储在邮件服务器上的邮件消息。然而，`IMAP`\
  \ 包含许多额外功能，例如选择性下载消息、查看消息标头、搜索消息和下载部分消息。此外，`IMAP4` 使用认证并完全支持 Kerberos 认证。 |\n\n\n\
  \n\n\n| 161 | SNMP | 简单网络管理协议 - 提供了一种机制，允许网络管理员收集有关网络设备（如集线器、网桥器、路由器和交换机）的信息。SN\
  \ 协议允许运行在网络设备上的代理向中央管理器报告其状态，反之也允许管理器向设备代理发送新的配置参数。可以进一步配置代理，在某些特定事件（称为陷阱，traps）发生时通知管理器。SNMP\
  \ 使用 UDP 发送和接收数据。 |\n| 443 | HTTPS | 超文本传输安全协议 - 标准的 HTTP（非安全）协议以明文传输数据（即没有加密，且任何可能拦截流量的人都能看到）。虽然这对于大多数网页浏览用途是可以接受的，但当需要将信用卡详情等敏感信息从浏览器传输到\
  \ Web 服务器时，它会带来严重的安全风险。HTTPS 使用安全套接层（SSL）在客户端和服务器之间发送加密数据来解决这个问题。 |\n| 2049 | NFS\
  \ | 网络文件系统 - 最初由 Sun Microsystems 开发，随后在整个行业广泛采用。NFS 允许另一个系统通过网络访问远程系统上的文件系统，就像该文件系统位于本地磁盘驱动器一样。NFS\
  \ 广泛用于 UNIX 和基于 Linux 的系统。后版本的 Microsoft Windows 也可以访问 UNIX 和基于 Linux 的系统上的 NFS\
  \ 共享文件系统。 |\n\n表 13-1\n\n## 13.5 总结\n\n新安装的 AlmaLinux 9 系统通常被认为是安全的，因为系统端口上没有运行任何服务。然而，一旦系统开始配置使用，确保通过实施防火墙来保护它是非常重要的。在配置防火墙时，理解各种端口及其相应的服务很重要。\n\
  \n有多种防火墙选项，最基础的是 `iptables` 防火墙接口的命令行配置。更直观、更高级的选项可以通过 `firewalld` 提供，我们将在下一章中介绍。\n\
  \n## 14. 使用 firewalld 进行 AlmaLinux 9 防火墙配置\n\n防火墙对于保护计算机系统或计算机网络免受外部攻击（通常来自通过互联网连接的外部源）至关重要。例如，任何直接连接到互联网的计算机都必须运行防火墙以防止恶意活动。同样，任何内部网络都必须在其与外部互联网连接之间拥有某种形式的防火墙。所有的\
  \ Linux 发行版都提供了某种形式的防火墙解决方案。在 AlmaLinux 9 的情况下，这表现为 `firewalld` 服务。\n\n虽然防火墙配置的主题可能很复杂，但幸运的是\
  \ AlmaLinux 9 提供了命令行、基于 Web 和图形工具来简化防火墙配置过程。本章将介绍 `firewalld` 的基本概念，并涵盖使用操作系统提供的工具配置防火墙所需的步骤。\n\
  \n## 14.1 firewalld 简介\n\n`firewalld` 服务使用一组规则来控制入站网络流量并定义哪些流量应被阻止，哪些流量被允许通过系统，它是构建在名为\
  \ `iptables` 的更复杂的防火墙工具之上的。\n\n`firewalld` 系统提供了一种管理入站流量的灵活方法。例如，可以将防火墙配置为阻止来自特定外部\
  \ IP 地址的流量，或者防止到达特定 TCP/IP 端口的所有流量。还可以定义规则将入站流量转发到不同的系统，或作为互联网网关来保护网络上的其他计算机。\n\n\
  与标准安全实践一致，默认的 `firewalld` 安装配置为阻止除 SSH 远程登录和系统用于获取动态 IP 地址的 DHCP 服务之外的所有访问（如果系统管理员要在完成安装后能够访问系统，这两项都是必不可少的）。\n\
  \nAlmaLinux 9 防火墙配置的关键元素是区域（zones）、接口（interfaces）、服务（services）和端口（ports）。\n\n###\
  \ 14.1.1 区域\n\n默认情况下，`firewalld` 安装时带有一系列预配置区域。区域是一组可以随时应用于系统的预配置规则，以便快速实现特定场景的防火墙配置。例如，block\
  \ 区域阻止所有入站流量，而 `home` 区域假设系统运行在更安全的环境中（预期会有更高水平的信任），实施较不严格的规则。可以向系统添加新区域，并修改现有区域以添加或删除规则。也可以从系统中完全删除区域。[表\
  \ 14-1] 列出了 AlmaLinux 9 系统上默认提供的区域集：\n\n| 区域 | 说明 |\n| --- | --- |\n| drop | 最安全的区域。仅允许出站连接，所有入站连接都会丢弃，且不向连接客户端发送任何通知。\
  \ |\n| block | 与 drop 区域类似，区别是入站连接会被 `icmp-host-prohibited` 或 `icmp6-adm-prohibited`\
  \ 通知后被拒绝。 |\n| public | 用于连接到公共网络或互联网，且已知其他计算机不可信的场景。允许某些特定的入站连接。 |\n| external\
  \ | 当系统作为计算机网络的互联网网关时，外部区域被应用于连接到互联网的接口。在本章稍后概述中，该区域与内部区域配合实现伪装（masquerading）或网络地址翻译（NAT）。允许某些特定的入站连接。\
  \ |\n| internal | 与外部区域配合使用，并应用于连接到内部网络的接口。假设内部网络上的计算机是信任的。允许某些特定的入站连接。 |\n| dmz\
  \ | 用于系统运行在非军事化区域（DMZ）。这些计算机通常是公开访问的，但与你内部网络的其他部分隔离开。允许某些特定的入站连接。 |\n| work | 用于在工作环境网络上运行系统，此时其他计算机是信任的。允许某些特定的入站连接。\
  \ |\n| home | 用于在家庭网络上运行系统，此时其他计算机是信任的。允许某些特定的入站连接。 |\n| trusted | 最不区域。接受所有入站连接。\
  \ |\n| nm-shared | 该区域由 `NetworkManager` 在实现连接共享时内部使用。 |\n| libvirt | 用于虚拟网络，通常当服务器托管虚拟机时使用。\
  \ |\n\n表 14-1\n\n要查看区域的特定设置，请参考位于系统 `/usr/lib/firewalld/zones` 目录下的对应 XML 文件。例如，以下列出了\
  \ `public.xml` 区域配置文件的内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <zone>\n  <short>Public</short>\n  <description>用于公共区域。你不信任网络上的其他计算机不会伤害你的计算机。只接受某些特定的入站连接。</description>\n\
  \  <service name=\"ssh\"/>\n  <service name=\"dhcpv6-client\"/>\n  <service name=\"\
  cockpit\"/>\n  <forward/>\n</zone>\n```\n\n### 14.1.2 接口\n\n\n\n\n\n任何连接到互联网或网络（或两者）的\
  \ AlmaLinux 9 系统都包含至少一个物理或虚拟网络设备形式的接口。当 `firewalld` 激活时，这些接口每一个会被分配到一个区域（zone），允许为不同的接口分配不同级别的防火墙安全策略。例如，考虑一个包含两个接口的服务器；一个连接到外部互联网，另一个连接到内部网络。在这种情况下，面向外部的接口可能会被分配到限制更严格的外部区域，而内部接口可能会使用内部区域。\n\
  \n### 14.1.3 服务\n\nTCP/IP 定义了一组在标准端口上通信的服务。例如，安全的 HTTPS 网页连接使用端口 `443`，而 SMTP 邮件服务使用端口\
  \ `25` 。为了有选择性地启用特定服务的入站流量，可以在区域中添加 `firewalld` 规则。例如，家庭区域（home zone）默认不允许入站 HTTPS\
  \ 连接。可以通过向区域添加规则允许入站 HTTPS 连接来启用此流量，而无需引用特定的端口号。\n\n### 14.1.4 端口\n\n尽管在添加 `firewalld`\
  \ 规则时可以引用常用的 TCP/IP 服务，但会出现需要允许在未分配给服务的特定端口进行入站连接的情况。可以通过添加引用特定端口而非服务的规则来实现。这种技术在“Cockpit\
  \ Web 界面概述”章节中使用过，当时打开了端口 `9090` 以允许访问 Cockpit Web 界面。\n\n### 14422 检查 firewalld\
  \ 状态\n\n`firewalld` 服务在所有 AlmaLinux 9 安装中默认安装并启用。可以通过以下命令检查服务的状态：\n\n```\n# systemctl\
  \ status firewalld\n```\n\n● firewalld.service - firewalld -动态防火墙守护进程\n\n      Loaded:\
  \ loaded (/usr/lib/systemd/system/firewalld.service; enabled; preset>\n      Active:\
  \ active (running) since Thu 2023-08-17 16:12:54 CDT; 4 days ago\n      Docs: man:firewalld(1)\n\
  \      Main PID: 894 (firewalld)\n      Tasks: 4 (limit: 22131)\n      Memory: 37.1M\n\
  \      CPU: 4.328s\n      CGroup: /system.slice/firewalld.service\n            \
  \  └─894 /usr/bin/python3 -s /usr/sbin/firewalld --nofork --nopid\n\n```\n\n如有必要，可以如下安装\
  \ `firewalld` 服务：\n\n```\n# dnf install firewalld\n```\n\n`firewalld` 服务默认启用，并在安装后每次系统启动时自动启动。\n\
  \n### 14.3 使用 firewall-cmd 配置防火墙规则\n\n`firewall-cmd` 命令行工具允许在终端窗口中查看 `firewalld`\
  \ 配置信息，并对区域和规则进行更改。\n\n在更改防火墙设置时，必须运行时（runtime）和永久（permanent）配置的概念。默认情况下，任何规则更改都被视为运行时配置更改。这意味着虽然更改将立即生效，但在下次系统重启或重载\
  \ `firewalld` 服务时（例如通过执行以下命令），将会丢失：\n\n```\n# firewall-cmd --reload\n```\n\n必须使用\
  \ `--permanent` 命令行选项来使更改永久。在 `firewalld` 服务重载之前，永久更改不会发生，但在手动更改之前它们将保持有效。\n\n####\
  \ 14.3.1 识别并更改默认区域\n\n要识别默认区域（换句话，除非专门选择了不同的区域，否则所有接口将被分配到的区域），请如下所示使用 `firewall-cmd`\
  \ 工具：\n\n```\n# firewall-cmd --get-default-zone\npublic\n```\n\n将默认更改更改不同的区域：\n\n\
  ```\n# firewall-cmd --set-default-zone=home\nsuccess\n```\n\n#### 14.3.2 显示区域信息\n\
  \n列出系统中所有可用区域：\n\n```\n# firewall-cmd --get-zones\nblock dmz drop external home\
  \ internal libvirt nm-shared public trusted work\n```\n\n按如下方式获取当前激活的区域及其分配的接口列表：\n\
  \n```\n# firewall-cmd --get-active-zones\nexternal\n  interfaces: eth0\ninternal\n\
  \  interfaces: eth1\n```\n\n可以如下方式列出当前为特定区域配置的所有规则：\n\n```\n# firewall-cmd --zone=home\
  \ --list-all\nhome (active)\n  target: default\n  icmp-block-inversion: no\n  interfaces:\
  \ eth0\n  sources:\n  services: cockpit dhcpv6-client mdns samba-client ssh\n  ports:\n\
  \  protocols:\n  masquerade: no\n  forward-ports:\n  source-ports:\n  icmp-blocks:\n\
  \  rich rules:\n```\n\n使用以下命令列出当前可包含在 firewalld 规则的服务：\n\n```\n# firewall-cmd --get-services\n\
  RH-Satellite-6 amanda-client amanda-k5-client amqp amqps apcupsd audit bacula bacula-client\
  \ bgp bitcoin bitcoin-rpc bitcoin-testnet bitcoin-testnet-rpc ceph ceph-mon cfengine\
  \ cockpit ...\n```\n\n列出当前为某个区域启用的服务：\n\n```\n# firewall-cmd --zone=public --list-services\n\
  cockpit dhcpv6-client ssh\n```\n\n按如下方式获取端口规则列表：\n\n```\n# firewall-cmd --zone=public\
  \ --list-ports\n9090/tcp\n```\n\n#### 14.3.3 添加和删除区域服务\n\n要向区域添加服务（在本例中，向 public\
  \ 区域添加 HTTPS），将使用以下命令：\n\n```\n# firewall-cmd --zone=public --add-service=https\n\
  success\n```\n\n默认情况下，这是一个运行时更改，因此添加的规则将在系统重启后丢失。要永久添加服务以便其在下次系统重启时仍然有效，请使用 `--permanent`\
  \ 标记：\n\n```\n# firewall-cmd --zone=public --permanent --add-service=https\nsuccess\n\
  ```\n\n要验证服务已永久添加，务必在请求服务列表时包含 `--permanent` 标记：\n\n```\n# firewall-cmd --zone=public\
  \ --permanent --list-services\ncockpit dhcpv6-client http https ssh\n```\n\n请注意，作为永久更改，此新规则在系统重启或\
  \ firewalld 重载之前不会生效：\n\n```\n# firewall-cmd --reload\n```\n\n使用 `--remove-service`\
  \ 选项从区域中删除服务。由于这是运行时更改，规则将在下次系统启动时重新恢复：\n\n```\n# firewall-cmd --zone=public --remove-service=https\n\
  ```\n\n要永久删除服务，请使用 `--permanent` 标记，并记住如果需要更改立即生效，则需要重载 firewalld：\n\n```\n# firewall-cmd\
  \ --zone=public --permanent --remove-service=https\n```\n\n#### 14.3.4 使用基于端口的规则\n\
  \n要启用特定端口，使用 `--add-port` 选项。注意，在手动定义端口时，需要提供端口号和协议（TCP 或 UDP）：\n\n```\n# firewall-cmd\
  \ --zone=public --permanent --add-port=5000/tcp\n```\n\n在向区域添加规则时，也可以指定端口范围：\n\n\
  ```\n# firewall-cmd --zone=public --permanent --add-port=5900-5999/udp\n```\n\n\
  #### 14.3.5 创建新区域\n\n通过运行以下命令可以创建一个全新的区域。一旦创建，就可以像管理任何预定义区域一样管理该区域：\n\n```\n# firewall-cmd\
  \ --permanent --new-zone=myoffice\nsuccess\n```\n\n在添加新区域后，需要重启 firewalld 该区域才能变得可用：\n\
  \n```\n# firewall-cmd --reload\nsuccess\n```\n\n#### 14.3.6 更改区域/接口分配\n\n如前所述，系统上的每个接口都必须分配到一个区域。可以使用\
  \ `firewall-cmd` 工具更改接口分配的区域。在以下示例中，`eth0` 接口被分配到 public 区域：\n\n```\n# firewall-cmd\
  \ --zone=public --change-interface=eth0\nsuccess\n```\n\n#### 14.3.7 伪装（Masquerading）\n\
  \n\n\n\n\n伪装（Masquerading）在网络管理领域广为人知的网络地址翻译（NAT）。当使用 AlmaLinux 9 系统作为计算机网络访问互联网的网关时，伪装允许所有内部系统在通过互联网时使用该\
  \ AlmaLinux 9 系统的 IP 地址。这样做的好处可以向恶意的外部实体隐藏任何系统的内部 IP 地址，并且避免了为网络上的每台计算机分配公共 IP 地址的必要。\n\
  \n使用以下命令检查防火墙是否已经启用了伪装：\n\n```bash\nfirewall-cmd --zone=external --query-masquerade\n\
  ```\n\n使用以下命令启用伪装（如果需要更改永久生效，请使用 `--permanent` 标记）：\n\n```bash\nfirewall-cmd --zone=external\
  \ --add-masquerade\n```\n\n## 14.3.8 添加 ICMP 规则\n\n互联网控制消息协议（ICMP）用于网络上的客户端系统之间发送信息（例如错误消息）。它也是\
  \ `ping` 命令的基础，网络管理员和用户利用它来检测特定客户端在网络上是否活跃。ICMP 类别允许阻塞特定的 ICMP 消息类型。例如，管理员可能会选择阻塞入的\
  \ ping（回显请求）ICMP 消息，以防止基于 `ping` 的拒绝服务（DoS）攻击的可能性（即服务器被恶意大量的 ping 消息冲击，导致无法响应合法请求）。\n\
  \n要查看可以包含在 firewalld 规则中的 ICMP 类型，请运行以下命令：\n\n```bash\nfirewall-cmd --get-icmptypes\n\
  ```\n\n`address-unreachable bad-header beyond-scope communication-prohibited destination-unreachable\
  \ echo-reply ...`\n\n例如，以下命令为公共区域永久添加一条规则以阻塞 echo-reply（ping 请求）消息：\n\n```bash\n\
  firewall-cmd --zone=public --permanent --add-icmp-block=echo-reply\n```\n\n## 14.3.9\
  \ 实现端口转发\n\n当 AlmaLinux 9 系统作为内部计算机网络访问互联网的网关时，端口转发与伪装配合使用。端口转发允许通过互联网特定端口到达防火墙的流量转发到内部网络上的特定系统。这通过示例来描述可能是最好的。\n\
  \n假设一个 AlmaLinux 9 系统作为内部计算机网络的防火墙，并且网络上的一个系统被配置为 Web 服务器。假设该 Web 服务器系统的 IP 地址为\
  \ `192.168.2.20`。托管在该系统上的网站的域名记录配置了 AlmaLinux 9 防火墙系统背后的公共 IP 地址。当 HTTP Web 页面请求到达\
  \ 80 端口时，作为防火墙的 AlmaLinux 9 系统需要知道如何处理它。通过配置端口转发，可以将所有 Web 流量重定向到托管 Web 服务器的内部系统（在这种情况下，IP\
  \ 地址为 `192.168.2.20`），可以继续使用 80 端口，也可以将流量重定向到目标服务器上的不同端口。事实上，端口转发甚至可以配置为将流量转发到防火墙同一系统上的不同端口（这一概念被称为本地转发）。\n\
  \n要使用端口转发，首先按照如下方式启用伪装（在这种情况下假设连接到互联网的接口已分配给外部区域）：\n\n```bash\nfirewall-cmd --zone=external\
  \ --add-masquerade\n```\n\n要从一个端口转发到另一个本地端口，将使用类似下方的命令：\n\n```bash\nfirewall-cmd\
  \ --zone=external --add-forward-port=port=22:proto=tcp:toport=2750\n```\n\n在上面的示例中，端口\
  \ 22 上的任何 TCP 流量将转发到本地系统的 2750 端口。另一方面，下面的命令将本地系统的 20 端口转发到 IP 地址为 `192.168.0.19`\
  \ 的系统的 22 端口：\n\n```bash\nfirewall-cmd --zone=external \\\n             --add-forward-port=port=20:proto=tcp:toport=22:toaddr=192.168.0.19\n\
  ```\n\n同样，以下命令将本地 20 端口转发到 IP 地址为 `192.168.0.18` 的系统的 2750 端口：\n\n```bash\nfirewall-cmd\
  \ --zone=external --add-forward-port=port=20:proto=tcp:toport=2750:toaddr=192.168.0.18\n\
  ```\n\n## 14.4 从 Cockpit 接口管理 firewalld\n\n到目前，本章提供了 firewalld 的概述，并探讨了如何使用 `firewall-cmd`\
  \ 命令行工具管理防火墙区域和接口。虽然 `firewall-cmd` 提供了管理 firewalld 配置的最灵活的方法，但也可以在 Cockpit Web\
  \ 控制台中查看和管理默认区域的服务。\n\n要访问 firewalld 设置，请登录 Cockpit 接口并从导航面板中选择“网络（Networking）”。在网络页面上，找到下方[图\
  \ 14-1]所示的“防火墙（Firewall）”部分并点击“编辑规则和区域（Edit rules and zones）”按钮：\n\n![](img/rhel_cockpit_firewall.png)\n\
  \n图 14-1\n\n防火墙页面显示默认区域配置的当前服务规则（允许删除服务）、向区域添加新服务，以及关闭防火墙：\n\n![](img/rhel_cockpit_firewall_settings.png)\n\
  \n图 14-2\n\n## 14.5 使用 firewall-config 管理 firewalld\n\n如果您可以访问图形桌面环境，也可以使用 `firewall-config`\
  \ 工具配置防火墙。虽然默认未安装，但可以通过如下安装 `firewall-config`：\n\n```bash\ndnf install firewall-config\n\
  ```\n\n启动时，将出现如[图 14-3]所示的 `firewall-config` 主界面：\n\n![](img/rhel_firewall_config.png)\n\
  \n图 14-3\n\n该工具的关键区域可以总结如下：\n\nA - 显示所有当前激活的接口及其所属的区域。要将接口分配到不同区域，请从此面板中选择它，点击“更改区域（Change\
  \ Zone）”按钮，并在生成的对话框中选择所需的区域。\n\nB - 控制显示的信息以及工具内所做的任何更改是应用于运行时规则还是永久规则。\n\nC - 系统上配置的区域、服务或\
  \ IPSets 列表。此面板中的信息取决于从工具栏 F 进行的选择。\n\nD - 主面板包含有关工具栏 E 中当前选择类别的信息。在此示例中，面板显示了公共区域的服务。每个服务旁边的复选框控制服务是否在防火墙中启用。在这些类别面板中，可以添加新规则或配置或删除现有规则。\n\
  \nE - 控制面板 D 中显示的内容。从此栏中选择项目将显示所选类别的当前规则。\n\nF - 控制面板 C 中显示的列表。\n\n`firewall-config`\
  \ 工具使用起来简单直观，允许在可视化环境中执行许多 `firewall-cmd` 可执行的任务。\n\n## 14.6 总结\n\n精心规划和实施的防火墙对于任何安全系统都至关重要。在\
  \ AlmaLinux 9 中，firewalld 服务提供了一个既灵活又易于管理的防火墙系统。\n\n\n\n\nfirewalld 服务使用“区域”（zones）的概念来对一组防火墙规则分组，并包含了一系列预定义的区域，旨在满足各种防火墙保护需求。可以对这些区域进行修改以添加或删除规则，也可以创建并配置全新的区域。系统上连接到网络或互联网的网络设备被称为“接口”（interfaces）。每个接口会被分配到一个区域。操作\
  \ firewalld 的主要工具是 `firewall-cmd` 命令行工具和 `firewall-config` 图形化工具。此外，通过 Cockpit Web\
  \ 界面也可以极简的防火墙管理选项。\n\n# 15 在 AlmaLinux 9 上配置基于密钥的身份验证\n\n当首次安装 AlmaLinux 9 系统时，默认配置允许通过\
  \ Secure Shell (SSH) 连接进行远程命令行访问。SSH 为 root 账户以及安装期间添加的任何其他用户提供了密码保护和加密的系统访问。然而，这种安全级别是不够的，应该尽快升级为基于密钥的身份验证。\n\
  \n本章将概述通过实施基于密钥的 SSH 身份验证来提高 AlmaLinux 9 系统安全性的步骤。\n\n## 15.1 Secure Shell (SSH)\
  \ 概述\n\nSSH 允许安全地远程访问系统，以获取 shell 访问并传输文件和数据。基础 SSH 配置由一个客户端（用于建立连接的计算机）和一个服务器（运行在要建立连接的系统上）组成。例如，用户可以使用运行在\
  \ Linux、Windows 或 macOS 系统上的 SSH 客户端连接到运行在 AlmaLinux 9 系统上的 SSH 服务器，以获取 shell 命令行提示符的访问或执行文件传输。客户端和服务器之间的所有通信（包括获取访问时输入的密码）都经过了加密，以防止外部人员截获数据。\n\
  \n基础 SSH 实现的固有缺陷是它完全依赖于分配给系统账户的密码强度。如果恶意一方能够识别出某个账户的密码（通过猜测、欺骗或暴力破解攻击），系统就会变得脆弱。通过实施\
  \ SSH 基于密钥的身份验证，可以解决这一缺陷。\n\n## 15.2 SSH 基于密钥的身份验证\n\nSSH 基于密钥的身份验证使用非对称公钥加密为远程系统访问增加了一层安全性。公钥加密的概念由\
  \ Whitfield Diffie 和 Martin Hellman 于 1975 年发明，基于使用一对私钥和公钥。。\n\n在公钥加密系统中，公钥用于加密数据，只有私钥所有者才能解密。\n\
  \n在 SSH 基于密钥的身份验证情况下，宿主机持有 SSH 客户端所在的私钥，而相应的公钥则存储在运行 SSH 服务器的系统上。因此，保护私钥至关重要，因为密钥的所有权将允许任何人登录远程系统。作为额外的保护层，私钥还可以被加密并由密码保护，在每次连接到服务器时必须输入该密码。\n\
  \n## 15.3 设置基于密钥的身份验证\n\n设置基于密钥的 SSH 身份验证共有四个步骤，总结如下：\n\n1. 生成公钥和私钥。\n2. 将公钥安装到服务器上。\n\
  3. 测试身份验证。\n4. 在服务器上禁用基于密码的身份验证。\n\n本章其余部分将为 Linux、macOS 和 Windows 客户端操作系统详细介绍这些步骤。\n\
  \n## 15.4 安装并启动 SSH 服务\n\n如果系统尚未安装并运行 SSH 服务器，可以使用以下命令进行添加：\n\n```bash\ndnf install\
  \ openssh-server\nsystemctl start sshd.service\nsystemctl enable sshd.service\n\
  ```\n\n## 15.5 从 Linux 和 macOS 客户端进行基于密钥的 SSH 身份验证\n\n设置基于密钥的 SSH 身份验证的第一步是在客户端系统上生成密钥对。如果客户端系统运行\
  \ Linux 或 macOS，可以使用 `ssh-keygen` 工具实现：\n\n```bash\nssh-keygen\n```\n\n该命令将产生类似下面的输出：\n\
  \n```\nGenerating public/private rsa key pair.\nEnter file in which to save the\
  \ key (/home/<username>/.ssh/id_rsa):\nPress the Enter key to accept the default\
  \ location for the key files. 这会在当前用户目录下的 .ssh 子目录下两个文件。私钥将存储在名为 `id_rsa` 的文件中，而公钥将存储在名为\
  \ `id_rsa.pub` 的文件中。\n```\n\n接下来，`ssh-keygen` 将提示输入用于保护私钥的短语。如果提供了短语，私钥将在本地磁盘上加密，并且在访问远程系统时需要该短语。因此，为了更好的安全，建议使用短语。\n\
  \n```\nEnter passphrase (empty for no passphrase):\n```\n\n最后，`ssh-keygen` 工具将生成以下输出，表示密钥已生成：\n\
  \n```\nYour identification has been saved in /home/neil/.ssh/id_rsa.\nYour public\
  \ key has been saved in /home/neil/.ssh/id_rsa.pub.\nThe key fingerprint is:\nSHA256:FOLGWEEGFIjWnCT5wtTOv5VK4hdimzWghZizUEMYbfo\
  \ <username>@<hostname>\nThe key’s randomart image is:\n+---[RSA 2048]----+\n|.BB+=+*..\
  \ |\n|o+B= * . . |\n|===.. + . |\n|*+ * . . |\n|.++ o S |\n|..E+ * o |\n| o B *\
  \ |\n| + + |\n| . |\n+----[SHA256]-----+\n```\n\n下一步是将公钥安装到远程服务器系统。可以使用 `ssh-copy-id`\
  \ 工具如下实现：\n\n```bash\nssh-copy-id username@remote_hostname\n```\n\n例如：\n\n```bash\n\
  ssh-copy-id neil@192.168.1.100\n/usr/bin/ssh-copy-id: INFO: Source of key(s) to\
  \ be installed: \"/home/neil/.ssh/id_rsa.pub\"\n/usr/bin/ssh-copy-id: INFO: attempting\
  \ to log in with the new key(s), to filter out any that are already installed\n\
  /usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you are prompted\
  \ now it is to install the new keys\nneil@192.168.1.100’s password:\nNumber of key(s)\
  \ added: 1\n```\n\n现在尝试登录机器：`ssh 'neil@192.168.1.100'` 并检查只添加了你想要的密钥。\n\n一旦安装了密钥，使用\
  \ ssh 客户端尝试远程登录以测试身份验证是否正常：\n\n```bash\nssh -l <username> <hostname>\n```\n\n如果私钥已加密并受短语保护，在提示时输入短语以完成身份验证并建立对\
  \ AlmaLinux 9 系统的远程访问：\n\n```\nEnter passphrase for key '/home/neil/.ssh/id_rsa':\n\
  Last login: Fri Mar 31 14:29:28 2023 from 192.168.86.21\n[neil@demosystem02 ~]$\n\
  ```\n\n对服务器上任何需要远程访问的其它账户重复这些步骤。如果其他客户端系统也需要访问，请将 `id_rsa` 私钥文件复制到其他系统上主目录下的 `.ssh`\
  \ 子目录下。\n\n按照目前的配置，仍然可以使用安全性较低的密码验证访问远程系统。一旦你验证了基于密钥的身份验证有效，则需要在系统上禁用密码身份验证。要了解如何更改此设置，请先打开\
  \ `/etc/ssh/sshd_config` 文件并找到以下行：\n\n```bash\nInclude /etc/ssh/sshd_config.d/*.conf\n\
  ```\n\n这告诉我们 sshd 配置设置由 `/etc/ssh/sshd_config.d` 目录中的文件控制。这些文件名必须以数字开头并具有 `.conf`\
  \ 文件扩展名，例如：\n\n```\n01-permitrootlogin.conf\n50-cloud.conf\n```\n\n\n\n数字前缀指定了该文件相对于文件夹中其他文件的优先级，其中\
  \ `01` 优先级最高。这确保了如果某个配置文件包含与另一个文件冲突的设置，优先级最高的文件始终具有优先权。\n\n在 `/etc/ssh/sshd_config.d`\
  \ 文件夹中，创建一个名为 `02-nopasswordlogin.conf` 的新文件，内容如下：\n\n```\nPasswordAuthentication\
  \ no\n```\n\n保存文件并重启 `sshd` 服务以实施更改：\n\n```bash\nsystemctl restart sshd.service\n\
  ```\n\n从现在起，将仅允许使用 SSH 密钥认证远程访问系统，并且在进行此类操作时，无需输入密码。\n\n## 15.6 管理多个密钥\n\n在客户端系统中存在多个私钥是常见现象，每个密钥提供对不同服务器的访问。因此，在建立连接时，有多种方法可以选择特定的密钥。例如，可以在启动\
  \ `ssh` 客户端时如下指定要使用的私钥文件：\n\n```bash\nssh -l neilsmyth -i ~/.ssh/id_work 35.194.18.119\n\
  ```\n\n或者，SSH 客户端用户配置文件可以将密钥文件与服务器关联。该配置文件名为 `config`，必须位于用户家目录下的 `.ssh` 目录，并可用于配置各种选项，包括私钥文件、连接时使用的默认端口、默认用户名以及用于引用服务器的简短别名。下面的示例配置文件为两个服务器定义了不同的密钥文件，并允许通过别名\
  \ `home` 和 `work` 引用它们。在工作系统的情况下，该文件还指定了验证时使用的用户名：\n\n```\nHost work\n  HostName\
  \ 35.194.18.119\n  IdentityFile ~/.ssh/id_work\n  User neilsmyth\n\nHost home\n\
  \  HostName 192.168.0.21\n  IdentityFile ~/.ssh/id_home\n```\n\n在设置配置文件之前，用户会使用以下命令连接到工作系统：\n\
  \n```bash\nssh -l neilsmyth -i ~/.ssh/id_work 35.194.18.119\n```\n\n但现在，命令可以缩短为如下：\n\
  \n```bash\nssh work\n```\n\n运行以下命令可以查看配置选项完整列表：\n\n```bash\nman ssh_config\n```\n\
  \n## 15.7 从 Windows 客户端进行 SSH 密钥认证\n\n最近版本的 Windows 包含了部分大多数 Linux 和 macOS 系统使用的\
  \ OpenSSH 实现，作为 Windows PowerShell 的一部分。这允许从 Windows 客户端使用与适用于 Linux 和 macOS 类似的步骤来设置\
  \ SSH 密钥认证。\n\n在 Windows 上，搜索 `Windows PowerShell` 并从结果中选择它。运行后，将出现 PowerShell 窗口，如图\
  \ 15-1 所示：\n\n![](img/windows_powershell.png)\n\n图 15-1\n\n如果您已拥有另一个客户端系统的私钥，请将\
  \ `id_rsa` 文件复制到 Windows 系统上名为 `.ssh` 的文件夹中。一旦文件到位，在 PowerShell 窗口中按如下方式测试认证：\n\n\
  ```bash\nssh -l <username>@<hostname>\n```\n\n例如：\n\n```powershell\nPS C:\\Users\\\
  neil> ssh -l neil 192.168.1.101\n```\n\n为密钥 'C:\\Users\\neil\\.ssh\\id_rsa' 输入密码短语：\n\
  \n在提示时输入密码短语并完成认证过程。\n\n如果私钥尚不存在，请在 PowerShell 窗口中使用 `ssh-keygen` 工具按照适用于 Linux\
  \ 和 macOS 的相同步骤生成新的私公钥对。一旦生成了密钥，它们将再次位于当前用户家目录的 `.ssh` 目录中，公钥文件 `id_rsa.pub` 需要安装在远程\
  \ AlmaLinux 9 系统上。遗憾的是，Windows PowerShell 不包含 `ssh-copy-id` 工具，因此此任务必须手动执行。\n\n\
  在 PowerShell 窗口中，切换到 `.ssh` 子目录并显示公钥文件 `id_rsa.pub` 的内容：\n\n```powershell\nPS C:\\\
  Users\\neil> cd .ssh\nPS C:\\Users\\neil\\.ssh> type id_rsa.pub\n```\n\n```\nssh-rsa\
  \ \
  \ neil@DESKTOP-S8P8D3N\n```\n\n高亮文件内容并使用快捷键 `Ctrl-C` 复制它。\n\n留在 PowerShell 窗口中，使用密码认证登录远程系统：\n\
  \n```powershell\nPS C:\\Users\\neil\\.ssh> ssh -l <username> <hostname>\n```\n\n\
  登录后，检查 `.ssh` 子目录是否存在。如果不存在，按如下方式创建：\n\n```bash\nmkdir .ssh\n```\n\n切换到 `.ssh` 目录并检查是否存在名为\
  \ `authorized_keys` 的文件。如果不存在，创建它并将来自 Windows 系统的公钥文件内容粘贴其中。\n\n如果 `authorized_keys`\
  \ 文件已存在，它可能包含其他密钥。如果是这样，编辑该文件并将新的公钥粘贴在文件末尾。例如，以下文件包含两个密钥：\n\n```\nssh-rsa \
  \ neil@localhost.localdomain\n\nssh-rsa \
  \ neil@DESKTOP-S8P8D3N\n```\n\n一旦公钥安装在服务器上，在 PowerShell 窗口中登录服务器测试认证，例如：\n\n```powershell\n\
  PS C:\\Users\\neil\\.ssh> ssh -l neil 192.168.1.100\n```\n\n为密钥 'C:\\Users\\neil\\\
  .ssh\\id_rsa' 输入密码短语：\n\n一旦所有账户设置并验证了密钥认证，按照上一节最后在 AlmaLinux 9 系统上禁用密码认证。\n\n##\
  \ 15.8 使用 PuTTY 进行 SSH 密钥认证\n\n对于没有 OpenSSH 或作为使用 PowerShell 更灵活替代方案的 Windows 系统，PuTTY\
  \ 工具是一种广泛使用的替代方案。使用 PuTTY 的第一步是在需要 SSH 客户端的 Windows 系统上下载并安装它。PuTTY 是一个免费工具，可以通过链接下载：\n\
  \nhttps://www.chiark.greenend.uk/~sgtatham/putty/latest.html](https://www.chiark.greenend.uk/~sgtatham/putty/latest.html)\n\
  \n下载与您的 Windows 系统匹配的 Windows 安装程序（提供 32 位和 64 位版本），然后运行安装程序完成安装。\n\n如果另一个系统中已存在私钥，请在当前用户家目录创建\
  \ `.ssh` 文件夹并将私钥 `id_rsa` 复制其中。接下来，需要使用 `PuTTYgen` 工具将私钥文件转换为 PuTTY 私钥格式文件。在 Windows\
  \ 开始菜单搜索栏中输入“PuTTY Key Generator”来查找此工具并启动它：\n\n![](img/putty_key_generator.png)\n\
  \n图 15-2\n\n\n\n启动后，点击 `Actions` 区域的 `Load` 按钮，并导航到之前复制到 `.ssh` 文件夹的私钥文件（注意，可能需要将文件类型过滤器更改为\
  \ `All Files (*.*)` 才能看到密钥文件）。找到后，选择该文件并将其加载到 `PuttyGen`。在提示时，输入最初用于加密该文件的口令（passphrase）。私钥导入后，点击\
  \ `Save Private Key` 按钮将其保存为 `PuTTY` 密钥文件。为了保持一致性，请将密钥文件保存到 `.ssh` 文件夹，但赋予一个不同的名称以与原始密钥文件区分来。\n\
  \n从开始菜单启动 `PuTTY`，在主界面输入远程服务器的 IP 地址或主机名，然后在左侧面板中选择 `Connection -> SSH -> Auth ->\
  \ Credentials` 类别，如图 15-3 所示：\n\n![](img/putty_credentials.png)\n\n图 15-3\n\n点击认证字段\
  \ `Private key` 旁边的 `Browse` 按钮，导航并选择之前保存的 `PuTTY` 私钥文件。然后，可选地滚动到左侧面板顶部，选择 `Session`\
  \ 条目，在 `Saved Sessions` 字段中为会话命名，然后点击 `Save` 按钮。这将保存会话配置以便以后使用，而无需每次重新输入设置。\n\n\
  最后，点击 `Open` 按钮建立与远程服务器的连接，在提示时输入用户名和口令以完成认证。\n\n## 15.9 使用 PuTTYgen 生成私钥\n\n上一节探讨了在使用\
  \ `PuTTY` 时使用现有的私钥和公钥。如果不存在密钥，可以使用 `PuTTYgen` 工具创建，该工具包含在 `PuTTY` 主安装包中。\n\n要创建新密钥，启动\
  \ `PuttyGen` 并点击图 15-4 中亮显示的 `Generate` 按钮：\n\n![](img/putty_key_generator_generate.png)\n\
  \n图 15-4\n\n按照指示移动鼠标指针以生成随机数据，然后输入可选的口令来加密私钥。密钥生成后，使用 `Save public key` 和 `Save\
  \ private key` 按钮将文件保存到合适的位置。如上一节所述，私钥可用于 `PuTTY`。若要在远程服务器上安装公钥，请参考早些章节中关于 Windows\
  \ 上 `PowerShell` 中 SSH 的步骤。\n\n## 15.10 总结\n\n对 AlmaLinux 9 系统的任何远程访问必须以提供高安全性的方式实现。默认情况下，`SSH`\
  \ 允许使用基于密码的认证进行远程系统访问。然而，这使得系统受到任何能猜出密码或其他手段获取密码的人的影响。因此，建议使用基于密钥的认证来保护系统访问。基于密钥的认证涉及公钥和私钥的公钥加密。实施后，用户只有在使用与服务器上公钥匹配的私钥的客户端时才能连接到服务器。作为额外的安全层，私钥也可以被加密并受密码保护。一旦实施了基于密钥的加密，服务器系统将被配置禁用安全性较低的基于密码的认证。\n\
  \n本章概述了 `SSH` 基于密钥的认证，并概述了在 macOS、Linux 和 Windows 上生成密钥和配置客户端的步骤，以及在 AlmaLinux 9\
  \ 服务器上安装和管理公钥的步骤。\n\n## 16. 使用 VNC 访问 AlmaLinux 9 远程桌面\n\nAlmaLinux 9 可以配置为通过网络或互联网连接提供图形桌面环境的远程访问。虽然默认未启用，但从网络或互联网上的任何其他系统显示并访问\
  \ AlmaLinux 9 桌面是相对简单的。无论该系统运行的是 Linux、Windows 还是 macOS，都可以实现这一点。甚至有适用于 Android\
  \ 和 iOS 的应用程序，允许你从几乎任何有数据信号的地方访问你的 AlmaLinux 9 桌面。\n\n远程桌面访问在许多场景下都很有帮助。例如，它允许你或他人从同一网络或通过互联网从另一台计算机系统查看并与你的\
  \ AlmaLinux 9 桌面环境进行交互。当你离开办公位（例如旅行期间）需要从电脑上工作时，这非常有用。当同事或 IT 支持技术人员需要访问你的桌面以解决问题时，这也会很有帮助。\n\
  \n当 AlmaLinux 9 系统运行在云服务器上时，它还允许访问桌面环境，作为使用命令行提示符或 `Cockpit` Web 控制台执行管理任务的替代方案。\n\
  \nAlmaLinux 9 的远程桌面功能基于称为虚拟网络计算 (`VNC`) 的技术。本章将涵盖在 AlmaLinux 9 中配置和使用远程桌面的关键方面。\n\
  \n### 16.1 安全与不安全的远程桌面访问\n\n在本章中，我们将涵盖安全和不安全的远程桌面访问方法。假设你是在安全的内部网络内从一个系统访问另一个系统，则使用不安全的访问方法通常是安全的。另一方面，如果你计划通过任何公共网络远程访问桌面，则必须使用安全的访问方法，以避免你的系统和数据受到损害。\n\
  \n## 16.2 安装 GNOME 桌面环境\n\n当然，只有在安装了桌面本身的情况下才可能访问桌面环境。例如，如果系统最初被配置为服务器，很可能没有安装桌面包。运行\
  \ `GNOME` 桌面所需软件包的最简单方法是执行组安装（group install）。安装包组以启用特定功能的关键是知道该组的名称。在编写时，AlmaLinux\
  \ 9 上安装桌面环境有两个组：“Server with GUI”和“Workstation”。由于组名称可能会在不同的 AlmaLinux 版本之间发生变化，因此使用\
  \ `dnf` 工具获取已安装或可安装的组列表是有帮助的，如下所示：\n\n```\ndnf grouplist\n```\n\n可用的环境组：\n\n   \
  \ Server\n    Minimal Install\n    Workstation\n    Virtualization Host\n    Custom\
  \ Operating System\n\n已安装的环境组：\n    Server with GUI\n\n已安装组：\n    Container Management\n\
  \    Headless Management\n\n可用组：\n    RPM Development Tools\n    .NET Development\n\
  \    Console Internet Tools\n    Scientific Support\n    Legacy UNIX Compatibility\n\
  \    Graphical Administration Tools\n    Network Servers\n    System Tools\n   \
  \ Development Tools\n    Security Tools\n    Smart Card Support\n\n在上面的示例中，`Workstation`\
  \ 环境组被列为可用（因此尚未安装）。若要在安装前查找有关组组内容的更多信息，请使用以下命令：\n\n```\ndnf groupinfo workstation\n\
  ```\n\n环境组：Workstation\n\n描述：Workstation 是一个适用于笔记本电脑和 PC 的友好桌面系统。\n\n强制性组：\n   \
  \ Common NetworkManager submodules\n    Core\n    Fonts\n    GNOME\n    Guest Desktop\
  \ Agents\n    Hardware Support\n    Internet Browser\n    Multimedia\n    Printing\
  \ Client\n    Standard\n    Workstation product core\n    base-x\n\n可选组：\n    Backup\
  \ Client\n    GNOME Applications\n    Headless Management\n    Internet Applications\n\
  \    Office Suite and Productivity\n    Remote Desktop Clients\n    Smart Card Support\n\
  \n确认这是正确的组后，可以按以下方式安装：\n\n```\ndnf groupinstall workstation\n```\n\n\n\n\n\n安装完成后，假设系统已添加显示器，可以使用以下\
  \ `startx` 命令启动桌面：\n\n```bash\n$ startx\n```\n\n若要在系统每次启动时都启动图形化桌面，请按照如下方式更改默认目标：\n\
  \n```bash\n# systemctl set-default graphical.target\n```\n\n反，如果系统是台没有直接连接显示器的服务器，则运行和访问桌面的唯一方法是在系统上配置\
  \ VNC 支持。\n\n## 16.3 在 AlmaLinux 9 上安装 VNC\n\n访问远程桌面需要在远程系统上安装 VNC 服务器，在建立连接的本地系统上安装\
  \ VNC 查看器，并且（可选地）需要一个安全的 SSH 连接。虽然有多种 VNC 服务器和查看器实现版本，但红帽已将 TigerVNC 确定为标准，它为基于\
  \ Linux 的操作系统提供了服务器端和查看器组件。非 Linux 平台的 VNC 查看器客户端包括 `RealVNC` 和 `TightVNC`。\n\n\
  在 AlmaLinux 9 上安装 `TigerVNC` 服务包，请运行以下命令：\n\n```bash\n# dnf install tigervnc-server\n\
  ```\n\n如果需要，也可以按如下方式安装 `TigerVNC` 查看器：\n\n```bash\n# dnf install tigervnc\n```\n\
  \n安装服务器后，必须配置系统运行一个或多个 VNC 服务，并在防火墙上打开相应的端口。\n\n## 16.4 为用户分配端口\n\nVNC 使用从 `5900`\
  \ 开始的端口范围与远程客户端通信。当连接到 VNC 服务器时，这些端口被引用为显示数字（其中 `5901` 是显示 `:1`，`5902` 是显示 `:2`，依此类推）。\n\
  \n在 AlmaLinux 9 上设置 VNC 时，为每个远程用户分配特定端口将有助于保持访问的一致性。端口分配在 `/etc/tigervnc/vncserver.users`\
  \ 文件中声明，并使用以下格式：\n\n`display_number=user`\n\n建议端口分配从 `5902` 开始。例如，`vncserver.users`\
  \ 文件中的以下条目将显示 `:2`（端口 `5902`）分配给用户 `demo`：\n\n```text\n:2=demo\n```\n\n## 16.5 配置\
  \ VNC 服务器\n\n安装 VNC 服务器包后，下一步是配置服务器。系统级设置可能会在 `/etc/tigervnc/vncserver-config-defaults`\
  \ 文件中声明，而单个用户的设置可以放在 `$HOME/.vnc/config` 文件中。至少这些文件之一应包含以下条目：\n\n```text\nsession=gnome\n\
  ```\n\n## 16.6 设置 VNC 密码\n\n下一步是为远程桌面环境用户指定密码。以远程用户身份登录时，按如下方式执行 `vncpasswd` 命令：\n\
  \n```bash\n[demo@demoserver ~]$ vncpasswd\n\nPassword:\n\nVerify:\n\nWould you like\
  \ to enter a view-only password (y/n)? n\n```\n\n未使用只读密码\n\n接下来，需要配置防火墙以为远程 VNC\
  \ 查看器实例提供对 VNC 服务器的访问，例如：\n\n```bash\n# firewall-cmd --permanent --add-service=vnc-server\n\
  # firewall-cmd --reload\n```\n\n## 16.7 启动 VNC 服务器\n\n创建服务配置文件后，需要按如下方式启动服务（将 `<number>`\
  \ 替换为 VNC 显示数字）：\n\n```bash\nsystemctl start vncserver@<number>\n```\n\n例如，以下命令启动显示\
  \ `:2` 的 VNC 服务器：\n\n```bash\n# systemctl start vncserver@:2\n```\n\n按如下方式检查服务是否已成功启动：\n\
  \n```bash\n# systemctl status vncserver@:2\n```\n\n```text\n● vncserver@:2.service\
  \ - Remote desktop service (VNC)\n      Loaded: loaded (/usr/lib/systemd/system/vncserver@.service;\
  \ enabled; prese>\n      Active: active (running) since Thu 2023-08-24 15:50:07\
  \ CDT; 21h ago\n      Process: 1027 ExecStartPre=/usr/libexec/vncsession-restore\
  \ :2 (code=exited,>\n      Process: 1107 ExecStart=/usr/libexec/vncsession-start\
  \ :2 (code=exited, stat>\n      Main PID: 1114 (vncsession)\n       Tasks: 0 (limit:\
  \ 22131)\n      Memory: 1.9M\n         CPU: 38ms\n      CGroup: /system.slice/system-vncserver.slice/vncserver@:2.service\n\
  \               1114 /usr/sbin/vncsession demo :2\n```\n\n如果服务启动失败，运行 `journalctl`\
  \ 命令检查错误消息：\n\n```bash\n# journalctl -xe\n```\n\n此外，在再次尝试之前尝试重启系统。如果问题仍然存在，检查位于用户\
  \ `$HOME/.vnc` 目录下的 VNC 日志文件中的诊断信息。\n\n## 16.8 连接到 VNC 服务器\n\nVNC 查看器实现适用于多种操作系统。因此，在互联网上快速搜索可能会提供许多有关如何在所选平台上获取和安装此工具的详细链接。\n\
  \n首先，验证远程用户已注销所有本地桌面会话（如果用户有活跃的桌面会话，VNC 服务器将启动）。\n\n在安装了 `TigerVNC` 等 VNC 查看器的 Linux\
  \ 系统桌面上，可以从终端窗口如下所示建立远程桌面连接：\n\n```bash\n$ vncviewer <hostname>:<display number>\n\
  ```\n\n在上述示例中，`<hostname>` 是远程系统的主机名或 IP 地址，`<display number>` 是 VNC 服务器桌面的显示数字，例如：\n\
  \n```bash\n$ vncviewer 192.168.86.34:2\n```\n\n或者，运行不带任何选项的命令，以提示输入远程服务器的详细信息：\n\
  \n![](img/rhel_vnc_authentication_dialog.png)\n图 16-1\n\n在 VNC 服务器字段中输入主机名或 IP 地址，后跟显示数字（例如\
  \ `192.168.86.34:2`），并点击连接按钮。查看器将提示输入用户的 VNC 密码以完成连接，此时此后一个包含远程桌面的新窗口将会出现：\n\n![](img/almalinux_vnc_viewer.png)\n\
  图 16-2\n\n本节假设是从 Linux 或 UNIX 系统访问远程桌面；相同的步骤也适用于大多数其他操作系统。\n\n使用本节中的步骤连接到远程 VNC\
  \ 服务器将导致客户端和服务器之间建立不安全、未加密的连接。这意味着在远程会话期间传输的数据容易被拦截。因此，需要额外的步骤来建立安全且加密的连接。\n\n##\
  \ 16.9 建立安全的远程桌面会话\n\n本章探讨的远程桌面配置被认为是不安全的，因为没有使用加密。当远程连接不延伸防火墙保护的内部网络之外时，这是可以接受的。然而，当通过互联网连接需要远程会话时，需要更安全的选项。这通过通过安全壳\
  \ (SSH) 连接对远程桌面进行隧道传输来实现。本节将涵盖如何在 Linux、UNIX 和 macOS 客户端上执行此操作。\n\nSSH 服务器通常在 AlmaLinux\
  \ 9 系统上默认安装并激活。如果你的系统上并非如此，请参阅章节 “在 AlmaLinux 9 上配置基于密钥的认证”。\n\n假设 SSH 服务器已安装并激活，现在是切换到另一个系统了。在另一个系统上，使用以下命令登录远程系统，将在两个系统之间建立安全隧道：\n\
  \n```bash\n$ ssh -l <username> -L 5902:localhost:5902 <remotehost>\n```\n\n在上述示例中，`<username>`\
  \ 指配置了 VNC 访问的远程用户账户，`<remotehost>` 是远程系统的主机名或 IP 地址，例如：\n\n```bash\n$ ssh -l neilsmyth\
  \ -L 5902:localhost:5902 192.168.1.115\n```\n\n在提示时，使用账户密码登录。安全连接建立后，现在是启动 `vncviewer`\
  \ 以使用安全隧道了。在另一个终端窗口中保持 SSH 会话运行，启动另一个终端并输入以下命令：\n\n```bash\n$ vncviewer localhost:5902\n\
  ```\n\n`vncviewer` 会话会在需要时提示密码，然后启动提供安全访问你桌面环境的 VNC 查看器。\n\n\n\n\n尽管连接已经是安全且加密的，但\
  \ VNC 视器极可能仍然报告连接是不安全的。例如，图 16-3 显示了运行在 macOS 系统上的 RealVNC 视器显示的警告对话框：\n\n![](img/rhel_8_vnc_viewer_not_encrypted.png)\n\
  \n图 16-3\n\n遗憾的是，尽管连接现在是安全的，但 VNC 视器软件无法得知这一点，因此继续发出警告。然而，请放心，只要正在使用 SSH 隧道，连接确实是安全的。\n\
  \n在上面的示例中，我们在终端窗口中保留了 SSH 隧道会话。如果你希望在后台运行会话，可以在启动连接时使用 `-f` 和 `-N` 标志来实现：\n\n```bash\n\
  ssh -l <username> -f -N -L 5902:localhost:5902 <remotehost>\n```\n\n上述命令将提示输入远程服务器的密码，然后在后台建立连接，将终端窗口留给其他任务使用。\n\
  \n如果你正从防火墙外部连接到远程桌面，请记住 SSH 连接的 IP 地址将是 ISP 或云托管提供商提供的外部 IP 地址，而不是远程系统的 LAN IP（因为该\
  \ IP 地址对防火墙外部的人不可见）。因此，你还需要配置防火墙，将端口 `22`（用于 SSH 连接）转发到运行桌面的系统的 IP 地址上。没有必要转发端口\
  \ `5900`。执行端口转发的步骤在不同防火墙之间不同，请参考你的防火墙、路由器或无线基站的文档以获取适用于你配置的细节。\n\n### 16.10 在 Windows\
  \ 上使用 PuTTY 建立安全隧道\n\n从 Windows 系统到 AlmaLinux 9 服务器建立安全桌面会话也采用了类似的方法。假设你已经安装了 TightVNC\
  \ 等 VNC 客户端，剩余的要求是一个 Windows SSH 客户端（在此例下为 `PuTTY`）。\n\n一旦下载并安装了 `PuTTY`，第一步是在 Windows\
  \ 系统和远程 AlmaLinux 9 系统之间建立一个配置了适当隧道的安全连接。启动 `PuTTY` 后，会显示以下屏幕：\n\n![](img/putty_home_screen.png)\n\
  \n图 16-4\n\n输入远程主机的 IP 地址或主机名（如果你从防火墙外部连接，则输入网关的外部 IP 地址）。下一步是设置隧道。点击左侧对话框分类树中 `SSH`\
  \ 旁的 `+` 号，并选择 `Tunnels`。屏幕随后应如下：\n\n![](img/putty_tunnels_screen.png)\n\n图 16-5\n\
  \n输入 `5902` 作为源端口（Source），`localhost:5902` 作为目标（Destination），并点击 `Add` 按钮。最后，点击\
  \ `Session` 返回主界面。在 `Saved Sessions` 文本字段中为会话输入名称并按 `Save`。点击 `Open` 建立连接。将出现一个带有远程系统登录提示的终端窗口。输入相应的用户名和密码凭据。\n\
  \nSSH 连接现在已建立。启动 TightVNC 视器，在 VNC Server 文本字段中输入 `localhost:5902` 并点击 `Connect`。视器将建立连接、提示密码，然后显示桌面。你现在正通过安全的\
  \ SSH 隧道从 Windows 访问 Linux 系统的远程桌面。\n\n### 16.11 关闭桌面会话\n\n要关闭 VNC Server 托管的桌面会话，请使用\
  \ `systemctl stop` 命令。例如，停止桌面 `:2`：\n\n```bash\nsystemctl stop vncserver@:2\n```\n\
  \n在用户尝试登录本地桌面会话之前，必须停止 VNC 服务器。如果用户的 VNC 服务器仍在运行，本地桌面会话将显示为空屏。\n\n### 16.12 总结\n\
  \n可以使用虚拟网络计算（VNC）启用对 AlmaLinux 9 系统 GNOME 环境远程访问。VNC 由运行在远程服务器上的 VNC 服务器和本地主机上的相应客户端组成，允许访问运行在服务器上的多个桌面实例。\n\
  \n当通过公共连接使用 VNC 连接时，建议使用 SSH 隧道以确保客户端和服务器之间的通信是加密且安全的。\n\n# 17 远程显示 AlmaLinux 9\
  \ 应用程序 (X11 转发)\n\n在上一章中，我们查看了如何在远程计算机上显示整个 AlmaLinux 9 桌面。如果你需要远程显示整个桌面，这种方法很好，但如果你只想显示单个应用程序，这可能显得大材小用。因此，本章将介绍如何在远程系统上显示单个应用程序。\n\
  \n## 17.1 远程显示 AlmaLinux 9 应用程序的要求\n\n在一个 AlmaLinux 9 系统上运行应用程序并在另一个系统上显示它有一些前提条件。首先，显示应用程序的系统必须运行\
  \ X 服务器。如果该系统是运行带有桌面环境的 Linux 或类 Unix 系统，则这没有问题。但如果系统运行的是 Windows 或 macOS，你必须在从远程系统显示应用程序之前在其上安装\
  \ X 服务器。有多种商用和免费的 Windows 版 X 服务器可供选择，网络搜索可以提供选项列表。\n\n其次，运行应用程序的系统（而不是显示应用程序的系统）必须配置为允许\
  \ SSH 访问。在 AlmaLinux 9 系统上配置 SSH 的细节可以参阅章节“在 AlmaLinux 9 上配置基于密钥的认证”。该系统必须运行来自 X.org\
  \ 的 X Window 系统，而不是 Wayland。要在桌面内部启用 X.org 系统，请注销 Gnome 桌面，从登录界面选择你的用户账户，然后点击屏幕右下角的设置按钮：\n\
  \n![](img/almalinux_x_org_gnome_menu.png)\n\n图 17-1\n\n在像往常登录之前，从菜单中选择 Standard\
  \ (X11 display server) 。要恢复到 Wayland，请重复这些步骤，从登录界面设置菜单中选择 Standard (Wayland display\
  \ server) 。\n\n另一个选项是编辑 `/etc/gdm/custom.conf` 文件，取消所示 `WaylandEnable` 行的注释并重启系统：\n\
  \n```ini\n# 取消下面行的注释以强制登录界面使用 Xorg\nWaylandEnable=false\n```\n\n一旦重新登录桌面，打开终端窗口并运行以下命令以确认\
  \ X.org 系统已启用：\n\n```bash\necho $XDG_SESSION_TYPE\n```\n\n上述命令将根据当前配置输出 `x11` 或\
  \ `wayland`。\n\n最后，必须配置 SSH 以允许 X11 转发。这通过在发生转发的源系统上的 SSH 配置中添加以下指令来实现。在 AlmaLinux\
  \ 9 默认情况下，`/etc/ssh/sshd_config` 文件包含一条指令，用于包含 `/etc/ssh/sshd_config.d` 目录下的所有配置文件：\n\
  \n```text\nInclude /etc/ssh/sshd_config.d/*.conf\n```\n\n在 `/etc/ssh/sshd_config.d`\
  \ 文件夹中创建一个名为 `05_x11forwarding` 的新文件，并编辑它如下所示启用 `X11Forwarding` 属性：\n\n```ini\n\
  X11Forwarding yes\n```\n\n进行更改后，保存文件并重启 SSH 服务：\n\n```bash\nsystemctl restart sshd\n\
  ```\n\n一旦满足上述要求，就应该能够远程显示基于 X 的桌面应用程序。请记住，并非所有 GNOME 应用程序都兼容 X11 转发。如果应用程序不兼容，当你尝试使用\
  \ X11 转发运行它时，将出现以下错误：\n\n```text\nX11 connection rejected because of wrong authentication.\n\
  ```\n\n## 17.2 远程显示 AlmaLinux 9 应用程序\n\n\n\n\n\n远程显示应用程序的第一步是移动到要显示应用程序的系统。在该系统上，建立一个到远程系统的\
  \ SSH 连接，以获得命令提示符。这可以通过 `ssh` 命令实现。在使用 `ssh` 命令时，我们需要使用 `-X` 标记来告诉系统我们计划通过连接隧道传输\
  \ X11 流量：\n\n```bash\nssh -X user@hostname\n```\n\n在上面的示例中，`user` 是用于登录远程系统的用户名，`hostname`\
  \ 是远程系统的主机名或 IP 地址。在登录提示处输入您的密码，一旦登录成功，运行以下命令查看 `DISPLAY` 设置：\n\n```bash\necho $DISPLAY\n\
  ```\n\n该命令的输出应类似于以下内容：\n\n```\nlocalhost:10.0\n```\n\n若要显示应用程序，请从命令提示符中运行它。例如：\n\
  \n```bash\ngedit\n```\n\n执行上述命令时，`gedit`将在远程系统上运行，但在本地系统上显示用户界面。\n\n## 17.3 受信的\
  \ X11 转发（Trusted Forward）\n\n你还可以通过在 `05_x11forwarding` 文件中添加以下行并重启 ssh 服务来启用受信的\
  \ X11 转发：\n\n```\nForwardX11Trusted yes\n```\n\n受信的 X11 转发比不可信的转发快一点，但安全性较低，因为它没有参与\
  \ X11 安全控制。在使用受信的 X11 转发时，需要 `-Y` 标记：\n\n```bash\nssh -Y user@hostname\n```\n\n\
  ## 17.4 压缩 X11 转发\n\n在使用较慢的连接时，可以使用 `ssh -C` 标记对 X11 数据进行压缩以提高性能：\n\n```bash\nssh\
  \ -X -C user@hostname\n```\n\n## 17.5 在 Windows 上显示远程 AlmaLinux 9 应用\n\n要在 Windows\
  \ 上显示基于 AlmaLinux 9 的应用程序，必须在 Windows 系统上安装 SSH 客户端和 X 服务器。在 Windows 上安装和使用 `PuTTY`\
  \ 客户端的内容在本书之前的 “在 AlmaLinux 9 上配置基于密钥的认证” 章节中介绍过。如果你尚未在 Windows 系统上安装 `PuTTY`，请参考该章节。\n\
  \n关于 X 服务器，有多种选项可供，尽管 `VcXsrv` 似乎是一个流行的选择，可以从以下 URL 免费获取：[`sourceforge.net/projects/vcxsrv/`](https://sourceforge.net/projects/vcxsrv/)\n\
  \n一旦安装了 `VcXsrv` X 服务器，桌面和开始菜单会出现一个名为 `XLaunch` 的应用程序。启动 `XLaunch` 并选择显示选项（最灵活的是\
  \ Multiple windows 选项，允许每个客户端应用在自己的窗口中显示）：\n\n![](img/vcxsrvr_xlaunch_settings.png)\n\
  \n图 17-2\n\n点击 Next 按钮继续后续屏幕，接受默认配置设置。在最后一个屏幕上，点击 Finish 按钮启动 X 服务器。如果出现 Windows\
  \ Defender 对话框，点击按钮允许访问所选的网络。\n\n运行后，`XLaunch` 将显示在任务栏中，可以通过右键点击图标并选择 `Exit...`\
  \ 菜单选项来退出：\n\n![](img/vcxsrvr_xlaunch_menu.png)\n\n图 17-3\n\n安装并运行 X 服务器后，启动 `PuTTY`\
  \ 并输入远程主机的连接信息或加载以前保存的会话配置。然而，在建立连接之前，需要启用 X11 转发。因此，在 `PuTTY` 主窗口中，向下滚动左面板中的选项，展开\
  \ SSH 部分并选择 X11 选项，如图 17-4 所示：\n\n![](img/win_10_putty_ssh.png)\n\n图 17-4\n\n开启图\
  \ 17-5 中高亮的 Enable X11 forwarding 复选框，返回到会话屏幕并打开连接（如果你打算再次使用，请先保存会话）：\n\n![](img/putty_enable_x11_forwarding.png)\n\
  \n图 17-5\n\n在 `PuTTY` 会话窗口中登录 AlmaLinux 9 系统并运行一个桌面应用。稍等片，该应用将以自己的窗口出现在 Windows\
  \ 桌面上。应用程序打开的任何对话框也将出现在独立的窗口中，就像它们在 AlmaLinux 9 GNOME 桌面上的显示一样。例如，图 17-6 显示了在 Windows\
  \ 11 系统上显示的 AlmaLinux 9 `nm-connection-editor` 工具：\n\n![](img/x11_windows_forwarding.png)\n\
  \n图 17-6\n\n## 17.6 总结\n\n对于需要访问单个 AlmaLinux 9 桌面应用程序而非整个 GNOME 桌面的情况，X11 转发提供了一种远程显示图形应用程序的轻量解决方案。显示的系统必须运行基于\
  \ X Window 系统的桌面环境（例如 GNOME）或安装并运行 X 服务器。一旦在远程服务器上启用了 X11 转发，并在本地系统使用 X11 转发选项建立了安全的\
  \ SSH 连接，大多数应用程序就可以在本地 X 服务器上远程显示。\n\n# 18. 在 AlmaLinux 9 上使用 NFS 与远程系统共享文件\n\n\
  AlmaLinux 9 提供了与网络上其他系统共享文件和文件夹的机制。一种方法是使用 Samba 技术。Samba 基于 Microsoft Windows 文件夹共享，允许\
  \ Linux 系统让 Windows 系统访问文件夹，并允许 Linux 访问基于 Windows 的文件夹共享。如果其他 Linux 和 UNIX 系统安装并配置了\
  \ Samba 支持，此方法也可用于在它们之间共享文件夹。这是异构网络环境中共享文件夹的最流行方法。使用 Samba 共享文件夹的内容在“使用 Samba 在\
  \ AlmaLinux 9 和 Windows 之间共享文件” 中介绍。\n\n另一种显式针对 Linux 和 UNIX 系统之间共享文件夹的选项是网络文件系统\
  \ (NFS)。NFS 允许另一个 Linux 或 UNIX 系统通过网络连接访问一台 Linux 计算机上的文件系统。NFS 最初由 Sun Microsystems（现为\
  \ Oracle 公司的一部分）于 20 世纪 80 年代开发，一直是共享远程 Linux/UNIX 文件系统的标准机制。\n\nNFS 与 Samba 的 Windows\
  \ SMB 资源共享技术非常不同。本章将介绍使用 NFS 在 AlmaLinux 9 与其他 UNIX/Linux 系统之间进行网络文件夹共享。\n\n###\
  \ 18.1 确保 AlmaLinux 9 上的 NFS 服务运行\n\n第一个任务是验证你的 AlmaLinux 9 系统上是否安装并运行了 NFS 服务。这可以通过命令行或\
  \ Cockpit 界面实现。\n\n通过从终端窗口运行以下命令开始安装 NFS 服务：\n\n```bash\ndnf install rpcbind nfs-utils\n\
  ```\n\n接下来，配置这些服务以便它们在启动时自动启动：\n\n```bash\nsystemctl enable rpcbind nfs-server\n\
  ```\n\n一旦启用服务，按如下方式启动它们：\n\n```bash\nsystemctl start rpcbind nfs-server\n```\n\n\
  ### 18.2 配置防火墙允许 NFS 流量\n\n接下来，需要配置防火墙以允许 NFS 流量。要实现此点，运行以下 `firewall-cmd` 命令，并将\
  \ `<zone>` 替换为防火墙和系统配置相应的区域：\n\n```bash\nfirewall-cmd --zone=<zone> --permanent\
  \ --add-service=mountd\nfirewall-cmd --zone=<zone> --permanent --add-service=nfs\n\
  firewall-cmd --zone=<zone> --permanent --add-service=rpc-bind\nfirewall-cmd --reload\n\
  ```\n\n## 18.3 指定要共享的文件夹\n\n现在 NFS 已运行且防火墙已配置，我们需要指定 AlmaLinux 9 文件系统的哪些部分允许远程 Linux\
  \ 或 UNIX 系统访问。这些设置可以在 `/etc/exports` 文件中声明，必须修改该文件以通过 NFS 导出目录。该文件中导出行的语法如下：\n\n\
  ```\n<export> <host1>(<options>) <host2>(<options>)...\n```\n\n\n\n在上述行中，`<export>`\
  \ 被替换为要导出的目录，`<host1>` 是授予访问的系统名称或 IP 地址，而 `<options>` 代表要对该访问施加的限制（只读、读写等）。如果需要，可以在同一行上放置多个主机和选项条目。例如，下行为\
  \ IP 地址为 `192.168.2.38` 的主机授予了 `/datafiles` 目录的只读权限：\n\n```\n/datafiles 192.168.2.38(ro)\n\
  ```\n\n允许使用通配符将导出应用到多个主机。例如，下行允许所有外部主机对 `/home/demo` 拥有读写访问权限：\n\n```\n/home/demo\
  \ *(rw)\n```\n\n在本章中，我们将按照如下所示的内容配置 `/etc/exports` 文件：\n\n```\n/tmp *(rw,sync)\n\
  /vol1 192.168.86.42(ro,sync)\n```\n\n配置完成后，需要使用 `exportfs` 命令根据最新的 `/etc/exports`\
  \ 设置更新 NFS 服务器维护的导出文件系统表，如下：\n\n```bash\nexportfs -a\n```\n\n也可以使用 `exportfs` 工具从命令行查看当前的共享设置：\n\
  \n```bash\nexportfs\n```\n\n上述命令将生成以下输出：\n\n```\n/vol1 192.168.86.42\n/tmp <world>\n\
  ```\n\n## 18. 访问共享文件夹\n\n可以通过从命令行手动挂载共享文件夹，从客户端系统访问这些文件夹。然而，在尝试挂载远程 NFS 文件夹之前，必须先在客户端系统上安装该包：\n\
  \n```bash\ndnf install nfs-utils\n```\n\n要从命令行挂载远程文件夹，打开终端窗口并创建一个你想挂载远程共享文件夹的目录：\n\
  \n```bash\n$ mkdir /home/demo/tmp\n```\n\n接下来，使用远程 NFS 服务器的 IP 地址或主机名输入挂载远程文件夹的命令，例如：\n\
  \n```bash\nsudo mount -t nfs 192.168.86.24:/tmp /home/demo/tmp\n```\n\n远程 `/tmp`\
  \ 文件夹将被挂载到本地系统。一旦挂载完成，`/home/demo/tmp` 文件夹将包含远程文件夹及其所有内容。\n\n在挂载远程 NFS 文件系统时也可以指定选项。例如，以下命令挂载了相同的文件夹但将其配置为只读：\n\
  \n```bash\n$ sudo mount -t nfs -o ro 192.168.86.24:/tmp /home/demo/tmp\n```\n\n\
  ## 18.5 在系统启动时挂载 NFS 文件系统\n\n也可以通过编辑 `/etc/fstab` 文件，配置 AlmaLinux 9 系统在每次启动时自动挂载远程文件系统。当加载到编辑器中时，它可能如下：\n\
  \n```\n/dev/mapper/almalinux-root / xfs defaults 0 0\nUUID=bc3e41a5-24ff-47c7 /boot\
  \ xfs defaults 0 0\nUUID=78B1-8B87 /boot/efi vfat umask=0077,shortname=winnt 0 2\n\
  /dev/mapper/almalinux-home /home xfs defaults 0 0\n/dev/mapper/almalinux-swap none\n\
  ```\n\n例如，要挂载位于 IP 地址为 `192.168.86.24` 系统上的路径为 `/tmp` 的文件夹到本地路径为 `/home/demo/tmp`\
  \ 的目录中（注意该目录必须已经存在），请向 `/etc/fstab` 文件添加以下行：\n\n```\n192.168.86.24:/tmp /home/demo/tmp\
  \ nfs rw 0 0\n```\n\n当系统下次重启时，远程系统上的 `/tmp` 文件夹将挂载到本地的 `/home/demo/tmp` 挂载点。此时可以像访问本地硬盘驱动一样访问远程文件夹中的所有文件。\n\
  \n## 18.6 卸载 NFS 挂载点\n\n一旦使用 NFS 挂载远程文件系统，可以使用 `umount` 命令并将本地挂载点作为命令行参数进行卸载。例如，以下命令将卸载我们的示例文件系统挂载点：\n\
  \n```bash\n$ sudo umount /home/demo/tmp\n```\n\n## 18.7 在 Cockpit 中访问 NFS 文件系统\n\
  \n除了使用命令行在客户端上挂载远程 NFS 文件系统外，也可以在 Cockpit 界面内部执行挂载操作。假设客户端系统已安装并配置了 Cockpit，从浏览器登录\
  \ Cockpit 界面，并从左侧导航面板选择“Storage”选项。如果没有显示“Storage”选项，则需要安装 `cockpit-storaged` 包：\n\
  \n```bash\ndnf install cockpit-storaged\nsystemctl restart cockpit.socket\n```\n\
  \nCockpit 服务重启后，重新登录 Cockpit 界面，此时 Storage 选项应该是可见的。\n\n选中后，主存储页面将包含一个列出所有当前挂载的\
  \ NFS 文件系统的部分，如图 18-1 所示：\n\n![](img/rhel_cockpit_nfs.png)\n图 18-1\n\n要挂载远程文件系统，点击上方高亮的“+”按钮，并在生成的对话框中输入远程\
  \ NFS 服务器和文件系统共享的信息，以及本地挂载点任何必要的选项，然后点击“Add”按钮：\n\n![](img/rhel_cockpit_nfs_new.png)\n\
  图 18-2\n\n要修改、卸载或删除 NFS 文件系统共享，请从 NFS Mounts 列表（上方的图 18-1）选择相应的挂载项，以显示下方图 18-3 所示的页面：\n\
  \n![](img/rhel_cockpit_nfs_modify.png)\n图 18-3\n\n在此屏幕中执行更改服务器或挂载点或卸载文件系统等任务。例如，“Remove”选项会卸载文件系统并从\
  \ `/etc/fstab` 文件中删除该条目，以便系统重启时不会重新挂载。\n\n## 18.8 总结\n\n网络文件系统（NFS）是一种基于客户端/服务器的系统，最初由\
  \ Sun Microsystems 开发，为 Linux 和 Unix 系统提供了通过网络共享文件系统的方法。NFS 允许客户端系统访问并在取决于权限修改远程服务器上的文件，就像这些文件存储在本地文件系统中一样。本章提供了\
  \ NFS 的概述，并概述了使用命令行或 Cockpit Web 界面配置客户端和服务系统的选项。\n\n## 19. 使用 Samba 在 AlmaLinux\
  \ 9 和 Windows 之间共享文件\n\n尽管 Linux 在桌面市场取得了一定进展，但它的起源和未来很大程度上是基于服务器的。因此，AlmaLinux\
  \ 9 可以作为文件服务器并不意外。AlmaLinux 和 Windows 系统在网络环境中并存使用也是常见现象。因此，一个常见的需求是 AlmaLinux 9\
  \ 系统上的文件可以通过网络连接被 Linux、UNIX 和基于 Windows 的系统访问。同样，Windows 系统上的共享文件夹和打印机可能也需要被 AlmaLinux\
  \ 9 系统访问。\n\nWindows 系统使用 Server Message Block (SMB) 协议共享文件系统和打印机。为了让 AlmaLinux\
  \ 9 系统能够向 Windows 系统提供此类资源，必须支持 SMB。这通过名为 Samba 的技术实现。除了提供 Linux 和 Windows 系统之间的集成外，Samba\
  \ 还可以提供 Linux 系统之间的文件夹共享（作为上一章介绍 NFS 的替代方案）。\n\n在本章中，我们将介绍在 AlmaLinux 9 系统上共享文件系统资源和打印机，以及访问\
  \ Windows 资源的步骤。\n\n### 19.1 从 GNOME 桌面访问 Windows 资源\n\n在详细介绍 Samba 共享之前，值得注意的是，如果你只是想在\
  \ GNOME 桌面内访问 Windows 共享文件夹，那么 GNOME Files 应用已经提供了这种支持。Files 应用位于任务栏（dash）中，如图 19-1\n\
  图 19-1\n\n启动后，选择左侧导航面板中的“Other Locations”选项，然后点击主面板中的“Windows Network”图标以浏览可用 Windows\
  \ 资源：\n\n![](img/ubuntu_files_windows_network.png)\n图 19-2\n\n\n\n\n\n# 19.2 Samba\
  \ 与 Samba Client\n\nSamba 允许将 AlmaLinux 9 资源与 Windows 系统共享，同时也允许 Windows 资源与 AlmaLinux\
  \ 9 系统共享。AlmaLinux 使用 Samba 客户端访问 Windows 资源。另一方面，通过安装和配置 Samba 服务，可以将 AlmaLinux\
  \ 资源共享给 Windows 系统。\n\n## 19.3 在 AlmaLinux 9 上安装 Samba\n\n在 AlmaLinux 9 安装过程中使用的默认设置通常不会安装必要的\
  \ Samba 软件包。除非你特别要求安装 Samba，否则你的系统中很可能没有安装 Samba。要检查是否已安装 Samba，请打开终端窗口并运行以下命令：\n\
  \n```bash\nrpm -q samba samba-common samba-client\n```\n\n任何缺失的包可以使用 `dnf` 命令行工具进行安装：\n\
  \n```bash\ndnf install samba samba-common samba-client\n```\n\n# 19.4 配置 AlmaLinux\
  \ 9 防火墙以启用 Samba\n\n接下来，必须配置保护 AlmaLinux 9 系统的防火墙以允许 Samba 流量。可以使用 `firewall-cmd`\
  \ 命令按照如下方式实现：\n\n```bash\nfirewall-cmd --permanent --add-port={139/tcp,445/tcp}\n\
  firewall-cmd --reload\n```\n\n在启动 Samba 服务之前，需要执行一些配置步骤来定义 AlmaLinux 系统在 Windows\
  \ 系统中的呈现以及与远程客户端共享的资源。大多数配置任务发生在 `/etc/samba/smb.conf` 文件中。\n\n## 19.5 配置 smb.conf\
  \ 文件\n\nSamba 是一个高度灵活且可配置的系统，为控制 Windows 网络上的资源共享方式提供了许多选项。遗憾的是，这种灵活性可能会导致人们认为 Samba\
  \ 过于复杂。然而实际上，典型的安装不需要许多配置选项，设置基础配置的学习曲线相对较短。\n\n在本章中，我们将查看如何将 AlmaLinux 9 系统加入 Windows\
  \ 工作组，并并设置一个目录作为特定用户可以访问的共享资源。这种配置被称为独立 Samba 服务器。还有更高级的配置，例如将 Samba 集成到 Active\
  \ Directory 环境中，但这些内容超出了本书的范围。\n\n配置 Samba 的第一步是编辑 `/etc/samba/smb.conf` 文件。\n\n\
  ## 19.5.1 配置 [global] 段\n\n`smb.conf` 文件分为多个部分。第一部分是 `[global]` 段，可以在此处指定适用于整个 Samba\
  \ 配置的设置。虽然这些设置是全局的，但在其他配置文件的段中可以对其进行覆盖。\n\n第一个任务是定义 AlmaLinux 9 资源将共享的 Windows 工作组名称。这通过\
  \ `[global]` 段的 `workgroup =` 指令控制，其默认配置如下：\n\n```ini\nworkgroup =\n```\n\n如有必要，首先将其更改为实际的工作组名称。\n\
  \n除了 `workgroup` 设置外，其他设置表明这是一个独立服务器，用户密码将保护共享资源。在继续配置要共享的资源之前，还需要如下所示向 `[global]`\
  \ 段中添加其他参数：\n\n```ini\n[global]\n...\n    netbios name = LinuxServer\n```\n\n`netbios\
  \ name` 属性指定了服务器在网络上其他系统可见的名称。\n\n## 19.5.2 配置共享资源\n\n下一步是配置共享资源（换句话说，就是 Windows\
  \ 网络上其他系统可以访问的资源）。为了实现这一点，需要为该段命名名称，并在共享时引用该名称。例如，如果我们计划共享 AlmaLinux 9 系统的 `/sampleshare`\
  \ 目录，我们可能会将该段命名为 `[sampleshare]`。在此段中，可以使用各种配置选项。但对于本示例，我们将定义要共享的目录，指示该目录是可浏览且可写的，并声明该资源为公共以便访客用户访问：\n\
  \n```ini\n[sampleshare]\n    comment = Example Samba share\n    path = /sampleshare\n\
  \    browseable = Yes\n    public = yes\n    writable = yes\n```\n\n要限制特定用户的访问，可以使用\
  \ `valid users` 属性，例如：\n\n```ini\nvalid users = demo, bobyoung, marcewing\n```\n\
  \n## 19.5.3 移除不需要共享\n\n`smb.conf` 文件预先配置了共享打印机和系统用户主目录的段。如果不需要共享这些资源，可以将相应的段注释掉，以便\
  \ Samba 忽略它们。在以下示例中，`[homes]` 段被注释了：\n\n```ini\n...\n#[homes]\n# comment = Home\
  \ Directories\n# valid users = %S, %D%w%S\n# browseable = No\n# read only = No\n\
  # inherit acls = Yes\n...\n```\n\n# 19.6 为 Samba 配置 SELinux\n\nSELinux 是默认集成到所有\
  \ AlmaLinux 9 系统 Linux 内核中的系统，为操作系统和用户文件提供了额外的安全保护。\n\n从传统上讲，Linux 安全基于允许用户决定谁有权访问他们拥有的文件和其他资源。例如，考虑一个位于某个特定用户主目录并由该用户拥的文件。该用户可以控制该文件的访问权限，即系统上的其他用户是否可以读写该文件，或者在脚本或二进制文件的情况下可以执行该文件。这种安全类型被称为自主访问控制，因为资源访问权留给用户自行决定。\n\
  \n然而，通过 SELinux，访问由系统管理员控制，且不能由用户覆盖。这被称为强制性访问控制，由管理员使用 SELinux 策略进行定义。继续上一个的例子，只有在系统默认或管理员定义的\
  \ SELinux 策略允许的情况下，文件所有者才能对该文件执行操作。\n\n可以使用 `sestatus` 工具按照如下所示的方法确识别 AlmaLinux\
  \ 9 系统上 SELinux 的当前状态：\n\n```bash\nsestatus\n```\n\n```\nSELinux status: enabled\n\
  SELinuxfs mount: /sys/fs/selinux\nSELinux root directory: /etc/selinux\nLoaded policy\
  \ name: targeted\nCurrent mode: enforcing\nMode from config file: enforcing\nPolicy\
  \ MLS status: enabled\nPolicy deny_unknown status: allowed\nMemory protection checking:\
  \ actual (secure)\nMax kernel policy version: 33\n```\n\nSELinux 可以运行在 enforcing（强制）或\
  \ permissive（宽容）模式下。启用时，enforcing 模式会拒绝所有 SELinux 策略未允许的操作。另一方面，permissive 模式允许通常会被拒绝的操作继续，但在日志文件中记录这些违规行为。\n\
  \nSELinux 安全基于上下文标签的概念。系统上的所有资源（包括进程和文件）都分配分配了由用户、角色、类型和可选安全级别组成的 SELinux 上文标签。例如，文件或文件夹的\
  \ SELinux 上下文可以如下所示：\n\n```bash\n$ ls -Z /home/demo\nunconfined_u:object_r:user_home_t:s0\
  \ Desktop\nunconfined_u:object_r:user_home_t:s0 Documents\n```\n\n同样，可以使用 `ps` 命令识别正在运行进程的上下文，在此例中为\
  \ `ls` 命令：\n\n```bash\n$ ps -eZ | grep ls\n```\n\n```\nunconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\
  \ 14311 tty1 00:00:18 ls\n```\n\n当一个进程（如上述 `ls` 命令）尝试访问文件或文件夹时，SELinux 系统将检查策略以识别是否允许访问。现在考虑\
  \ Samba 上下文：\n\n```bash\n$ ps -eZ | grep smb\n```\n\n```\nsystem_u:system_r:smbd_t:s0\
  \ 66576 ? 00:00:00 smbd\nsystem_u:system_r:smbd_t:s0 66578 ? 00:00:00 smbd-notifyd\n\
  system_u:system_r:smbd_t:s0 66579 ? 00:00:00 cleanupd\n```\n\n\n\nSELinux 通过多种方式实现安全防护，其中最常见的是类型强制执行（type\
  \ enforcement）。简单来说，当进程尝试对对象执行某些任务（例如，写入文件）时，SELinux 会检查进程和对象的上下文类型，并验证安全策略是否允许执行该操作。假设一个类型为\
  \ A 的进程尝试写入一个类型为 B 的文件。在这种情况下，只有当 SELinux 策略明确规定类型 A 的进程可以对类型 B 文件执行写入操作时，该操作才会被允许。在\
  \ SELinux 强制模式下，除非规则明确允许执行操作，否则所有操作均被拒绝。\n\nSELinux 和 Samba 之间的问题在于，SELinux 策略未配置允许类型为\
  \ `smb_t` 的进程对 `samba_share_t` 以外的任何类型的文件执行操作。例如，上述的 `/home/demo` 目录将无法被 Samba 服务访问，因为它的类型是\
  \ `user_home_t`。要让 Samba 服务能够访问系统上的文件或文件夹，必须将这些特定资源的强制类型更改为 `samba_share_t`。\n\n\
  在本示例中，我们将创建之前在 `smb.conf` 文件中引用的 `/sampleshare` 目录，并更改强制类型使其供 Samba 服务访问。首先按照如下方式创建目录：\n\
  \n```\nmkdir /sampleshare\n```\n\n接下来，检查目录当前的 SELinux 上下文：\n\n```\n$ ls -aZ /sampleshare/\n\
  \nunconfined_u:object_r:root_t:s0 .\n```\n\n在此情况下，文件夹的上下文标签被分配了类型 `root_t`。为了让 Samba\
  \ 共享该文件夹，需要使用 `semanage` 工具将强制类型设置为 `samba_share_t`，如下：\n\n```\nsemanage fcontext\
  \ -a -t samba_share_t \"/sampleshare(/.*)?\"\n```\n\n注意在 `semanage` 命令中使用了通配符，以确保该类型适用于\
  \ `/sampleshare` 目录包含的任何子目录和文件。添加后，需要使用 `restorecon` 命令应用更改，并利用 `-R` 标志递归地应用更改到任何子目录：\n\
  \n```\nrestorecon -R -v /sampleshare\n```\n\nRelabeled /sampleshare from unconfined_u:object_r:default_t:s0\
  \ to unconfined_u:object_r:samba_share_t:s0\n\n完成这些更改后，该文件夹已配置符合 `smb` 进程的 SELinux\
  \ 策略，并准备好 共享。\n\n## 19.7 创建 Samba 用户\n\n任何需要访问 Samba 共享资源的用户必须配置为 Samba 用户并分配密码。此任务通过\
  \ `smbpasswd` 命令行工具完成。例如，假设需要一个名为 `demo` 的用户能够从 Windows 系统访问我们 AlmaLinux 9 系统的 `/sampleshare`\
  \ 目录。为了满足这一要求，我们必须如下所示将 `demo` 添加为 Samba 用户：\n\n```\nsmbpasswd -a demo\n```\n\n\
  新 SMB 密码：\n\n重输新 SMB 密码：\n\n已添加用户 demo。\n\n现在我们已经完成了基础 Samba 服务器的配置，是时候测试我们的配置文件并启动\
  \ Samba 服务了。\n\n## 19.8 测试 smb.conf 文件\n\n可以使用 `testparm` 命令行工具按照如下所示的方法检查 `smb.conf`\
  \ 文件中的设置是否存在错误：\n\n```\ntestparm\n```\n\nLoad smb config files from `/etc/samba/smb.conf`\n\
  \nLoaded services file OK.\n\nWeak crypto is allowed\n\nServer role: ROLE_STANDALONE\n\
  \nPress enter to see a dump of your service definitions\n\n```\n# Global parameters\n\
  \n[global]\nlog file = /var/log/samba/%m.log\nnetbios name = LINUXSERVER\nprintcap\
  \ name = cups\nsecurity = USER\nwins support = Yes\nidmap config * : backend = tdb\n\
  cups options = raw\n\n[sampleshare]\ncomment = Example Samba share\nguest ok = Yes\n\
  path = /sampleshare\nread only = No\n\n[homes]\nbrowseable = No\ncomment = Home\
  \ Directories\ninherit acls = Yes\nread only = No\nvalid users = %S %D%w%S\n\n[printers]\n\
  browseable = No\ncomment = All Printers\ncreate mask = 0600\npath = /var/tmp\nprintable\
  \ = Yes\n```\n\n## 19.9 启动 Samba 和 NetBIOS 名称服务\n\n为了让 AlmaLinux 9 服务器在 Windows\
  \ 网络中运行，必须启动 Samba (SMB) 和 NetBIOS 名称服务 (NMB)。可选情况下，还应启用这些服务，以便它们在每次系统启动时自动运行：\n\
  \n```\nsystemctl enable smb nmb\nsystemctl start smb nmb\n```\n\n在尝试从 Windows 系统连接之前，使用\
  \ `smbclient` 实用程序验证共享是否配置：\n\n```\nsmbclient -U demo -L localhost\n```\n\n输入 WORKGROUP\\\
  demo 的密码：\n\nSharename Type Comment\n--------- ---- -------\nsampleshare Disk Example\
  \ Samba share\nprint$ Disk Printer Drivers\nIPC$ IPC IPC Service (Samba 4.9.1)\n\
  demo Disk Home Directories\n\n## 19.10 访问 Samba 共享\n\n现在 Samba 资源已配置好且服务正在运行，是时候从\
  \ Windows 系统访问共享资源了。在与 AlmaLinux 9 处于同一工作组的可用 Windows 系统上，打开资源管理器并点击侧边栏中的“网络”，以显示图\
  \ [19-3] 所示的内容：\n\n![](img/windows_map_drive.png)\n\n19-3\n\n选择“映射网络驱动器...”选项显示图\
  \ [19-4] 所示的对话框：\n\n![](img/windows_map_drive.png)\n\n19-4\n\n选择一个驱动器号并输入共享路径。例如，假设服务器名称为\
  \ `LinuxServer` 且 Samba 用户名为 `demo`，路径如下：\n\n`\\\\LinuxServer\\demo`\n\n勾选“使用其他凭据连接”并完成。当网络凭据对话框出现时，输入之前使用\
  \ `smbpasswd` 分配的 Samba 用户名和密码：\n\n![](img/windows_credentials.png)\n\n19-5\n\n\
  建立连接后，将出现资源管理器对话框，包含共享文件夹的内容：\n\n![](img/windows_drive.png)\n\n19-6\n\n## 19.11\
  \ 从 AlmaLinux 9 访问 Windows 共享\n\n如前所述，Samba 是双向的，不仅允许 Windows 系统访问托管在 AlmaLinux\
  \ 9 上的文件打印机，还允许 AlmaLinux 9 系统访问 Windows 上的共享资源。这是通过在本章开头安装的 `samba-client` 包实现的。如果尚未安装，请从终端窗口如下安装：\n\
  \n```\ndnf install samba-client\n```\n\n在 AlmaLinux 桌面面上可以使用“文件”应用程序或命令行提示符使用 `smbclient`\
  \ 和 `mount` 工具访问 Windows 系统的共享资源。本节的步骤假设 Windows 系统已开启适当的网络共享设置。\n\n要使用 GNOME 桌面访问\
  \ Windows 系统的任何共享资源，启动“文件”应用程序并选择“其他位置”。这将显示图 [19-7] 所示的屏幕，其中包含“网络”图标（如果检测到的话）：\n\
  \n![](img/windows_network.png)\n\n19-7\n\n选择“网络”将显示网络上检测到的 Windows 系统并访问任何共享资源。\n\
  \n![](img/windows_list.png)\n\n19-8\n\n或者，可以使用“连接服务器”选项连接到特定系统。注意，远程系统的名称或 IP 地址必须以前缀\
  \ `smb://` 开，并跟随特定共享资源的路径，例如：\n\n`smb://WinServer/Documents`\n\n如果没有桌面环境，可以使用 `mount`\
  \ 命令并指定 `cifs` 文件系统类型从命令行挂载远程 Windows 共享。例如，以下命令将名为 `WinServer` 的 Windows 系统上名为\
  \ `Documents` 的共享挂载到本地挂载点 `/winfiles`：\n\n```\nmount -t cifs //WinServer/Documents\
  \ /winfiles -o user=demo\n```\n\n## 19.12 总结\n\n\n\n\n在本章中，我们学习了如何配置 AlmaLinux 9\
  \ 系统使其同时作为 Samba 客户端和服务器，从而与 Windows 系统共享资源。涵盖的主题包括安装 Samba 客户端和服务器包，以及将 Samba 配置为独立服务器。此外，我们还介绍了\
  \ SELinux 的基本概念，以及为共享资源提供 Samba 访问权限的步骤。\n\n# 20. 虚拟化技术概述\n\n虚拟化是在单台计算机系统上同时运行多个操作系统的能力。虽然这不是一个新概念，但虚拟化近年来变得非常突出，因为它提供了一种充分利用服务器系统\
  \ CPU 和资源容量的方法，同时提供了稳定性（即如果一个虚拟机客户系统崩溃，主机和其他任何虚拟机系统都将继续运行）。\n\n虚拟化对于在不配置双启动环境的情况下尝试不同的操作系统也很有帮助。例如，你可以在虚拟机中运行\
  \ Windows 而无需重新划分磁盘，只需关闭 AlmaLinux 9 并从 Windows 启动。相反，你也可以启动一个虚拟化的 Windows 版本作为客户操作系统。同样，虚拟化允许你在\
  \ AlmaLinux 9 系统中运行其他 Linux 发行版，提供对两个操作系统的并发访问。\n\n在决定实现虚拟化的最佳方法时，清楚了解目前可用的各种虚拟化解决方案至关重要。因此，本章的目的是从通俗的角度描述目前常用的虚拟化技术。\n\
  \n## 20.1 客户操作系统虚拟化\n\n客户操作系统虚拟化（也称为基于应用程序的虚拟化）是最容易理解的概念。在这种情况下，物理主机运行标准的、未修改的操作系统，例如\
  \ Windows、Linux、UNIX 或 macOS。运行在该操作系统上的一个虚拟化应用程序，其执行方式与任何应用程序（如文字处理器或电子表格）在系统上运行的方式相同。在虚拟化应用程序内部，创建了一个或多个虚拟机，以便在主机上运行客户操作系统。\n\
  \n虚拟化应用程序负责启动、停止和管理每个虚拟机，并本质上代表每个虚拟机控制对物理硬件资源的访问。虚拟化应用程序还参与称为二进制重写的过程，这涉及扫描执行中的客户系统的指令流，并将任何特权指令替换为安全的模拟。这使得客户系统认为它是直接运行在系统硬件上，而不是应用程序中的虚拟机中。\n\
  \n下图说明了基于客户操作系统的虚拟化：\n\n![](img/guest_os_virtualization.png)\n图 20-1\n\n如上图所示，客户操作系统在虚拟化应用程序内的虚拟机中运行，而虚拟机反过来又像任何其他应用程序一样运行在主机操作系统之上。客户操作系统与底层主机硬件之间的多层抽象不利于实现高水平的虚拟机性能。然而，这种技术的优势是不需要对主机或客户操作系统进行任何更改，也不需要特殊的\
  \ CPU 硬件虚拟化支持。\n\n## 20.2 Hypervisor（虚拟机程序）虚拟化\n\n在虚拟机程序虚拟化中，虚拟机程序的任务是处理虚拟机的资源和内存分配，并为高级管理和监控工具提供接口。基于虚拟机程序的解决方案被分为\
  \ Type-1 或 Type-2。\n\nType-2 虚拟机程序（有时称为托管型虚拟机程序）作为软件应用程序安装并运行在主机操作系统之上，通过协调客户虚拟机对\
  \ CPU、内存和网络等资源的访问来提供虚拟化能力。图 21-2 展示了使用 Type-2 虚拟机程序虚拟化系统的典型架构：\n\n![](img/type-2_hypervisor_virtualization.png)\n\
  图 20-2\n\n为了理解 Type-1 虚拟机程序的工作原理，了解 Intel x86 处理器架构会有帮助。x86 系列 CPU 提供了一系列称为“环”（rings）的保护级别，代码可以在其中执行。`ring\
  \ 0` 具有最高级权限，操作系统内核通常运行在该环中。在 `ring 0` 中执行的代码被认为运行在系统空间、内核模式或监督模式下。所有其他代码（例如运行在操作系统上的应用程序）都运行在权限较低的环中，通常是\
  \ `ring 3`。\n\n与 Type-2 虚拟机程序相比，Type-1 虚拟机程序（也称为金属或原生虚拟机程序）直接运行在主机系统的硬件 `ring 0`\
  \ 中。由于虚拟机程序占据了 CPU 的 `ring 0`，运行在系统上的任何客户操作系统内核必须运行在权限较低的 CPU 环中。遗憾的是，大多数操作系统内核被显式编写为运行在\
  \ `ring 0`，因为它们需要执行只有在该环中才能执行的任务，例如执行特权 CPU 指令和直接操作内存。近年来，针对这个问题设计了几种不同的解决方案，下面将分别描述：\n\
  \n### 20.2.1 半虚拟化\n\n在半虚拟化下，客户操作系统的内核经过专门修改以运行在虚拟机程序上。这通常涉及将仅在 CPU `ring 0` 中运行的特权操作替换为对虚拟机程序的调用（称为\
  \ `hypercalls`）。虚拟机程序反过来代表客户内核执行任务。遗憾的是，这通常将支持限制在 Linux 等这种可以自由更改的开源操作系统，以及所有者已同意针对特定虚拟机程序进行必要代码修改的专有操作系统上。尽管存在这些问题，客户内核与虚拟机程序直接通信的能力比其他虚拟化方法具有更高的性能。\n\
  \n### 20.2.2 全虚拟化\n\n全虚拟化为未修改的客户操作系统提供支持。“未修改”一词是指没有被修改以运行在虚拟机程序上的操作系统内核，因此它们仍然像运行在\
  \ CPU `ring 0` 中一样执行特权操作。在这种情况下，虚拟机程序提供 CPU 模拟，以处理和修改由未修改的客户操作系统内核执行的特权受保护 CPU 操作。遗憾的是，这种模拟过程运行需要时间和系统资源，导致与半虚拟化相比的性能水平较低。\n\
  \n### 20.2.3 硬件虚拟化\n\n硬件虚拟化利用了 Intel 和 AMD 最新代 CPU 内置的虚拟化功能。这些技术分别称为 `Intel VT`\
  \ 和 `AMD-V`，为运行未修改的客户虚拟机提供了必要的扩展，避免了全虚拟化 CPU 模拟中固有的开销。通俗地说，这些处理器提供了位于 `ring 0` 之上的一个额外权限模式（`ring\
  \ -1`），虚拟机程序可以在其中运行，从而将 `ring 0` 留给未修改的客户操作系统使用。\n\n下图说明了 Type-1 虚拟机程序的虚拟化方法：\n\n\
  ![](img/type-1_hypervisor_virtualization.png)\n图 20-3\n\n如上图所示，除了虚拟机之外，管理操作系统或管理控制也运行在虚拟机程序之上，允许系统管理员管理虚拟机。\n\
  \n## 20.3 虚拟机网络\n\n\n\n\n虚拟机始终需要连接到网络才能具有实际用途。一种方案是让客户连接到运行在主机计算机操作系统内部的虚拟网络。在此种配置下，虚拟网络上的任何虚拟机都可以相互可见，但网络地址转换\
  \ (NAT) 提供了对外部网络的访问。当使用虚拟网络和 NAT 时，每台虚拟机都将使用主机系统的 IP 地址在外部网络（即主机所连接的网络）上表述出来。这是\
  \ AlmaLinux 9 上 KVM 虚拟化的默认行为，通常不需要额外的配置。通常情况下，默认会创建一个单一虚拟网络，名称为 `default`，设备名称为\
  \ `virbr0`。\n\n为了让客户在外部网络上显示为独立且独立的系统（即拥有它们自己的 IP 地址），必须将其配置为共享主机上的物理网络接口。实现这一目标的最快方法是将虚拟机配置为“直接连接”（direct\
  \ connection）网络配置选项（也称为 MacVTap），这将为客户系统提供一个与主机相同网络上的 IP 地址。遗憾的是，虽然这允许虚拟机访问网络上的其他系统，但在使用\
  \ MacVTap 驱动时，无法在客户和主机之间建立连接。\n\n更好的选项是在主机系统上配置一个网络桥接接口，让客户连接到该接口。这为客户提供了外部网络上的\
  \ IP 地址，同时允许客户和主机之间进行通信，该主题在名为“创建 AlmaLinux 9 KVM 网络桥接接口”的章节中介绍。\n\n## 20.4 总结\n\
  \n虚拟化是在单个主机操作系统中运行多个客户操作系统的能力。目前已经开发了多种虚拟化方法，包括客户操作系统虚拟化和程序管理程序虚拟化。程序管理程序虚拟化又分为\
  \ Type-1 和 Type-2 两类。Type-2 虚拟化解决方案被分为半虚拟化、全虚拟化和硬件虚拟化，后者使用了某些 Intel 和 AMD 处理器型号的特殊虚拟化特性。\n\
  \n虚拟机客户操作系统在网络方面有多种选择，包括 NAT、直接连接（MacVTap）和网络桥接配置。\n\n## 21. 在 AlmaLinux 9 上安装 KVM\
  \ 虚拟化\n\n早期版本的 Red Hat Enterprise Linux（AlmaLinux 基于此构建）提供了两个虚拟化平台：基于内核的虚拟机 (KVM)\
  \ 和 Xen。在最近的发布中，对 Xen 的支持已被移除，使得 KVM 成为 AlmaLinux 9 提供的唯一内置虚拟化选项。除了 KVM 之外，VMware\
  \ 和 Oracle VirtualBox 等产品也提供了第三方解决方案。然而，由于 KVM 是随 AlmaLinux 9 提供的，本章及后续章节将介绍这种虚拟化解决方案。\n\
  \n在安装和运行 KVM 之前，讨论它如何融入上一节概述的各种虚拟化类型是有意义的。\n\n## 21.1 KVM 概述\n\nKVM 被归类为 Type-1\
  \ hypervisor 解决方案，利用 Intel VT 和 AMD-V 硬件虚拟化支持，实现了对未修改客户操作系统的全虚拟化。\n\nKVM 与许多其他 Type-1\
  \ 解决方案的不同之处在于，它将主机 Linux 操作系统变成了 hypervisor，在运行完整的企业级主机操作系统的同时实现了裸金属虚拟化。\n\n## 21.2\
  \ KVM 硬件要求\n\n在继续本章之前，我们必须讨论在 KVM 环境中运行虚拟机的硬件要求。首先，KVM 虚拟化仅适用于特定的处理器。如前所述，这些处理器必须包含\
  \ Intel VT 或 AMD-V 技术。\n\n要检查虚拟化支持情况，请在终端窗口中运行 `lscpu` 命令：\n\n```bash\nlscpu | grep\
  \ Virtualization:\n```\n\n如果系统包含支持 Intel VT 的 CPU，上述命令将提供以下输出：\n\n```\nVirtualization:\
  \ VT-x\n```\n\n或者，当检测到支持 AMD-V 的 CPU 时，将显示以下输出：\n\n```\nVirtualization: AMD-V\n\
  ```\n\n如果 CPU 不支持虚拟化，上述 `lscpu` 命令将不会任何输出。\n\n请注意，虽然上述命令仅报告处理器是否支持相应功能，但并不表示该功能当前在\
  \ BIOS 中已启用。这是因为在实践中，大多数系统的 BIOS 默认通常禁用了虚拟化支持。因此，在继续本教程之前，您应该检查 BIOS 设置以确保已启用适当的虚拟化技术。\n\
  \n与双启动环境不同，虚拟化环境涉及在单台计算机系统中并发运行两个或多个完整的操作系统。这意味着系统必须具有足够的物理内存、磁盘空间和 CPU 处理能力，以舒适地并行运行所有这些系统。因此，在开始配置和安装之前，请检查\
  \ AlmaLinux 9 以及您选择的客户系统的最低系统要求，并验证您的主机系统有足够的资源来处理这两个系统的需求。\n\n### 21.3 为 KVM 虚拟化准备\
  \ AlmaLinux 9\n\n与 Xen 不同，不需要运行特殊版本的内核来支持 KVM。因此，通过安装 KVM 内核模块，标准内核已经可以用于 KVM 支持，从而消除了安装和从特殊内核启动的需求。\n\
  \n然而，为了避免冲突，如果系统当前运行着启用 Xen 的内核，在继续本章其余内容之前，请重启系统并在启动菜单中选择非 Xen 内核。\n\n设置和维护基于 KVM\
  \ 的虚拟化系统所需的工具，只有在 AlmaLinux 9 操作系统安装过程中显式选择时才会被默认安装。要从命令行提示安装 KVM 工具，请在终端窗口中执行以下命令：\n\
  \n```bash\ndnf install qemu-kvm qemu-img libvirt virt-install libvirt-client\n```\n\
  \n如果您可以使用图形化桌面环境，还建议安装 `virt-manager` 软件包：\n\n```bash\ndnf install virt-manager\n\
  ```\n\n### 21.4 验证 KVM 安装\n\n在继续之前，检查 KVM 安装是否正常工作是有意义的。当 KVM 安装并运行时，将有两个模块被加载到内核中。可以通过在终端窗口中运行\
  \ `lsmod` 命令来验证这些模块的存在：\n\n```bash\nlsmod | grep kvm\n```\n\n假设安装成功，上述命令应生成类似下面的输出：\n\
  \n```\nkvm_intel 409600 0\nkvm 1134592 1 kvm_intel\nirqbypass 16384 1 kvm\n```\n\
  \n请注意，如果系统包含 AMD 处理器，`kvm` 可能会读取 `kvm_amd` 而不是 `kvm_intel`。\n\n安装过程还应该配置了 `libvirtd`\
  \ 守护进程在后台运行。再次使用终端窗口运行以下命令以确保 `libvirtd` 正在运行：\n\n```bash\nsystemctl status libvirtd\n\
  ```\n\n```\n● libvirtd.service - Virtualization daemon\n     Loaded: loaded (/usr/lib/systemd/system/libvirtd.service;\
  \ enabled; preset:>)\n     Active: active (running) since Tue 2023-09-12 09:45:13\
  \ CDT; 3s ago\n```\n\n如果进程未运行，请按照以下方式启用并启动它：\n\n```bash\nsystemctl enable --now\
  \ libvirtd\n```\n\n\n\n\n\n如果可用桌面环境，可以通过选择“活动”（Activities）并在搜索框中输入“virt”来运行 `virt-manager`\
  \ 工具。当虚拟机管理器图标出现时，点击它进行启动。加载后，管理器将如附所示：\n\n![](img/virt-manager_main_screen.png)\n\
  \n图 21-1\n\n如果没有列出 `QEMU/KVM` 项，选择“文件 -> 添加连接”（File -> Add Connection）菜单选项，并在弹出的对话框中点击“连接”（Connect）按钮之前选择\
  \ `QEMU/KVM` Hypervisor：\n\n![](img/virt-manager_add_connection.png)\n\n图 21-2\n\
  \n如果管理器未连接到虚拟化进程，右键点击列出的项并从弹出菜单中选择“连接”（Connect）。\n\n## 21.5 总结\n\nKVM 是一种 Type-1\
  \ 虚拟机解决方案，它利用 `Intel VT` 和 `AMD-V` 硬件虚拟化支持，实现了对未修改客体操作系统的全虚拟化。它是 AlmaLinux 9 自带的默认虚拟化解决方案，可以快速方便地安装在任何具有适当处理器支持的\
  \ AlmaLinux 9 系统上。在安装并启用了 KVM 支持后，后续章节将概述在 AlmaLinux 9 主机上安装和管理虚拟机的某些选项。\n\n## 22.\
  \ 使用 Cockpit 在 AlmaLinux 9 上创建 KVM 虚拟机\n\n可以使用 `virt-install` 命令行工具、`virt-manager`\
  \ GUI 工具或 Cockpit Web 控制台的“虚拟机”模块在 AlmaLinux 9 上轻松配置基于 KVM 的虚拟机。本章将使用 Cockpit 在\
  \ AlmaLinux 9 主机上作为 KVM 客体安装操作系统。标题为“使用 virt-manager 在 AlmaLinux 9 上创建 KVM 虚拟机”的章节将介绍使用\
  \ `virt-manager` 工具创建新的虚拟机。\n\n下一章使用 virt-install 和 virsh 创建 KVM 虚拟机”将介绍命令行创建虚拟机的方法。\n\
  \n### 22.1 安装 Cockpit 虚拟机模块\n\n默认情况下，虚拟机模块可能未被包含在标准的 Cockpit 安装中。假设 Cockpit 已安装并配置完成，可以按如下方式安装虚拟机模块：\n\
  \n```bash\ndnf install cockpit-machines\n```\n\n安装完成后，下次登录 Cockpit 界面时，导航面板中将出现“虚拟机”选项（图\
  \ 22-1 中标记为 A）：\n\n![](img/cockpit_virtual_machines.png)\n\n图 22-1\n\n## 22.2 在\
  \ Cockpit 中创建虚拟机\n\n要在 Cockpit 中创建虚拟机，点击图 22-1 中标记为 B 的“创建虚拟机”（Create VM）按钮显示创建对话框。\n\
  \n在对话框中，为机器输入名称，并选择安装媒体是通过 URL 访问的 ISO 格式还是本地文件路径，或者选择客体的操作系统信息并选择“下载操作系统”（Download\
  \ an OS）选项，以便在安装过程中自动下载镜像。\n\n此外，指定用于操作系统安装的虚拟磁盘驱动的大小以及分配给虚拟机的内存量：\n\n![](img/kvm_cockpit_create_vm.png)\n\
  \n图 22-2\n\nKVM 提供系统（System）或用户（User）会话虚拟机的选择。系统虚拟机以 root 权限运行，并对硬件设备和网络具有完全权限，但被阻止将磁盘镜像存储在用户文件夹中。另一方面，用户会话限于用户权限，且网络和设备访问受到限制。然而，磁盘镜像可以存储在用户目录中。在本教程中，请选择“系统”（System）选项。\n\
  \n点击“创建并编辑”（Create and Edit）按钮构建虚拟机。创建过程完成后，从列表中选择新虚拟机以显示配置详情，如图 22-3 所示：\n\n![](img/rhel_cockpit_vm_overview.png)\n\
  \n图 22-3\n\n正如虚拟化技术概述”中所描述，KVM 在网络配置方面为虚拟机提供了多种选项。要查看并更改虚拟机的网络设置，滚动到客体概述屏幕的“网络接口”（Network\
  \ interfaces）部分并点击“编辑”（Edit）按钮：\n\n![](img/rhel_cockpit_vm_network.png)\n\n图 22-4\n\
  \n在弹出的对话框中，可以使用“网络类型”（Network Type）菜单更改网络连接类型，例如从虚拟网络（NAT）更改为直接附加（MacVTap）或桥接到局域网（Bridge\
  \ to LAN）。\n\n### 22.3 开始安装\n\n要启动新虚拟机并从指定的安装媒体安装操作系统，点击概述页顶部的“安装”（Install）按钮。Cockpit\
  \ 将启动虚拟机并更新控制台（Console）视图，客体系统的屏幕将出现在：\n\n![](img/kvm_cockpit_console_running.png)\n\
  \n图 22-5\n\n如果安装失败，请检查消息查看打开安装镜像时是否出错。这通常是因为 `QEMU` 仿真器以名为 `qemu` 的用户运行，该用户没有访问\
  \ ISO 安装镜像所在目录的权限。要解决此问题，打开终端窗口（如果是远程系统请通过 SSH 连接），切换到 ISO 镜像文件目录，并如下将 `qemu` 用户添加到父目录的访问控制列表\
  \ (ACL) 中：\n\n```bash\ncd /path/to/iso/directory\nsetfacl --modify u:qemu:x ..\n\
  ```\n\n进行此更改后，按如下方式检查设置：\n\n```bash\ngetfacl ..\n# file: ..\n# owner: demo\n# group:\
  \ demo\nuser::rwx\nuser:qemu:--x\ngroup::---\nmask::--x\nother::---\n```\n\n完成这些更改后，再次点击“安装”（Install）按钮完成安装。\n\
  \n要完成安装，请控制台（Consoles）视图中的屏幕进行交互，就像在物理硬件上安装操作系统一样。如果控制台太小无法容整个客体操作系统屏幕，请点击右上角的“展开”（Expand）按钮。\n\
  \n还可以使用 `virt-viewer` 工具从 Cockpit 浏览器会话外部连接并显示虚拟机的图形控制台。要在 AlmaLinux 9 系统上安装 `virt-viewer`，运行以下命令：\n\
  \n```bash\ndnf install virt-viewer\n```\n\n`virt-viewer` 工具适用于 Windows 系统，可以从以下\
  \ URL 下载：[`virt-manager.org/download/`](https://virt-manager.org/download/)\n\n\
  如下所示运行 `virt-viewer` 以连接到运行在本地主机上的系统虚拟机：\n\n```bash\nsudo virt-viewer\n```\n\n`virt-viewer`\
  \ 启动后，从弹出的对话框中选择您想要连接的虚拟机：\n\n![](img/virt-viewer_select_vm.png)\n\n图 22-6\n\n要列出并访问基于会话的客体，如下方式启动\
  \ `virt-viewer`：\n\n```bash\nvirt-viewer --connect qemu:///session\n```\n\n或者也可以指定虚拟机名称并完全跳过选择对话框，例如：\n\
  \n```bash\nsudo virt-viewer demo-vm-guest\n```\n\n要使用 SSH 将 `virt-viewer` 实例连接到运行在远程主机上的虚拟机，可以使用以下命令：\n\
  \n```bash\nvirt-viewer --connect qemu+ssh://<user>@<host>/system <guest name>\n\
  ```\n\n例如：\n\n```bash\nvirt-viewer --connect qemu+ssh://root@192.168.1.122/system\
  \ demo_vm_guest\n```\n\n在使用此技术时，请注意的是在完全建立连接之前会提示输入两次用户密码。\n\n创建虚拟机后，Cockpit 界面可以监控机器并执行重启、关机或删除客体系统等任务。磁盘（Disks）面板也包含一个向虚拟机配置添加磁盘的选项。\n\
  \n## 22.4 处理存储卷和存储池\n\n\n\n\n\n当创建虚拟机时，它通常会至少有一个虚拟磁盘驱动器。代表这些虚拟磁盘驱动器的镜像存储在存储池中。存储池可以可以是本地文件系统上的现有目录、文件系统分区、物理磁盘设备、逻辑卷管理（LVM）卷组，甚至是远程网络文件系统（NFS）。\n\
  \n每个存储池被划分为一个或多个存储卷。存储卷通常是单个映像文件，每个代表一个虚拟磁盘驱动器，但也可以以物理磁盘分区、整个磁盘驱动器或 LVM 卷组的形式存在。\n\
  \n使用前面的步骤创建虚拟机时，会创建一个默认存储池来存储虚拟机镜像。该默认存储池占用根文件系统的空间，可以在 Cockpit 虚拟机界面，通过选择上方图 22-1\
  \ 中标记为 C 的面板顶部的“存储池”（Storage Pools）选项来进行查看。\n\n选择后，将出现如下方图 22-7 所示的屏幕，其中包含系统当前配置的存储池列表：\n\
  \n![](img/rhel_cockpit_vm_storage_pools.png)\n\n图 22-7\n\n在上述示例中，默认存储池位于根文件系统，并将虚拟机镜像存储在\
  \ `/var/lib/libvirtd/images` 目录。要查看池中包含的存储卷，请选择图 22-8 中高亮的“存储卷”（Storage Volumes）选项卡：\n\
  \n![](img/cockpit_virtual_machines_storage_pools.png)\n\n图 22-8\n\n在演示客机的情况下，存储卷以名为\
  \ `demo-vm-guest.qcow2` 的映像文件形式存在。根据创建虚拟机时所的选择，池还可能包含一个包含安装 ISO 镜像的存储卷。要查找特定虚拟机使用哪个存储卷，返回虚拟机主屏幕，选择该虚拟机，并滚动到“磁盘”（Disks）面板，如图\
  \ 22-9 所示：\n\n![](img/rhel_cockpit_vm_disks.png)\n\n图 22-9\n\n虽然出于测试目的和早期实验考虑使用默认存储池是可以接受的，但建议为通用虚拟化用途创建额外的池。要创建新的存储池，在\
  \ Cockpit 中显示“存储池”屏幕，并点击“创建存储池”（Create storage pool）按钮以显示如图 22-10 所示的对话框：\n\n![](img/rhel_cockpit_vm_create_pool.png)\n\
  \n图 22-10\n\n在上述示例中，正在创建一个名为 `MyPool` 的新存储池，其使用了本地文件系统中挂载为 `/MyPool` 的文件系统分区（磁盘驱动器、分区和挂载点的主题将在后续名为“向\
  \ AlmaLinux 9 系统添加新磁盘驱动器”的章节中介绍）。一旦创建，该池将列在 Cockpit 存储池屏幕中，并在创建新虚拟机时包含存储卷。\n\n##\
  \ 22.5 总结\n\n本章概述了如何使用 Cockpit Web 界面创建和管理基于 KVM 的虚拟机。Cockpit 界面的优势在于不需要访问运行在主机系统上的桌面环境。另一种选项是使用下一章中概述的\
  \ `virt-manager` 图形工具。\n\n## 23. 在 AlmaLinux 9 上使用 virt-manager 创建 KVM 虚拟机\n\n上一章探讨了如何使用\
  \ Cockpit Web 工具在 AlmaLinux 9 上创建 KVM 虚拟机。尽管一旦虚拟机 Cockpit 扩展完全实现后，`virt-manager`\
  \ 可能会停止使用，本章将介绍如何使用该工具创建新的虚拟机。\n\n### 23.1 启动虚拟机管理器\n\n如果您尚未安装，请按照以下方式安装 `virt-manager`\
  \ 软件包：\n\n```bash\ndnf install virt-manager\n```\n\n接下来，在终端窗口中通过运行 `virt-manager`\
  \ 从命令行启动虚拟机管理器。加载后，虚拟机管理器将在显示以下屏幕之前提示输入当前活动用户的密码：\n\n![](img/virt-manager_main_screen1.png)\n\
  \n图 23-1\n\n主屏幕列出了系统上运行的当前虚拟机。\n\n默认情况下，管理器应该连接到系统的 `libvirtd` 实例。如果不是，请右键点击列表中的项并从弹出菜单中选择“连接”（Connect）以连接到主机系统。\n\
  \n要管理基于会话虚拟机，选择 `File -> Add Connection...` 菜单选项以显示如图 23-2 所示的对话框：\n\n![](img/virt-manager_add_connection1.png)\n\
  \n图 23-2\n\n从“虚拟机监控程序”（Hypervisor）菜单中选择 `QEMU/KVM` 用户会话，并点击此对话框中的“连接”（Connect）按钮。返回\
  \ `virt-manager` 主屏幕后，`QEMU/KVM` 会话现在应如上方图 23-1 所示列出。\n\n要创建一个虚拟系统，点击新建虚拟机按钮（工具栏上最左侧的按钮）以显示新虚拟机向导的第一个屏幕。在“名称”（Name）字段中，为虚拟系统输入一个合适的描述性名称。在此屏幕上，还要选择安装客操作系统的介质位置。可以是\
  \ CD 或 DVD 驱动器、本地主机访问的 ISO 映像文件、使用 HTTP、FTP、NFS 或 PXE 进行网络安装，或者来自现有虚拟机的磁盘映像：\n\n\
  ![](img/virt-manager_select_media.png)\n\n图 23-3\n\n### 23.2 配置 KVM 虚拟系统\n\n点击“以前”（Forward）将显示一个请求有关安装过程额外信息的屏幕。显示的屏幕和所需信息将取决于在初始屏幕上进行的选择。例如，如果选择了\
  \ CD、DVD 或 ISO，此屏幕将询问 ISO 文件或物理介质设备的特定位址。此屏幕还会尝试根据指定的安装介质识别操作系统的类型和版本（例如 Windows\
  \ 版本或 Linux 发行版）。如果无法识别，请关闭“从安装介质/源自动检测”（Automatically detect from installation\
  \ media/source）选项，输入操作系统名称的前几个字符，并从可能的匹配列表中选择选项：\n\n![](img/almalinux_iso_virt-manager.png)\n\
  \n图 23-4\n\n完成这些设置后，点击“以前”（Forward）按钮以配置 CPU 和内存设置。最佳设置取决于主机上存在的 CPU 数量和物理内存量，以及与新虚拟机并行运行的其他应用程序和虚拟机的需求：\n\
  \n![](img/virt-manager_memory.png)\n\n图 23-5\n\n在下一个屏幕上，可以使用选项创建指定大小的映像磁盘、选择预存卷或创建指定格式（`raw`、`vmdk`、`ISO`\
  \ 等）的存储卷。除非您有使用特定格式的需要（例如，您以后可能需要使用 `vmdk` 迁移到基于 VMware 的虚拟化环境）或需要使用专用磁盘或分区，否则在此屏幕上指定大小通常足够：\n\
  \n![](img/virt-manager_disk.png)\n\n图 23-6\n\n如果在此使用默认设置，虚拟机将使用默认存储池内的存储卷作为虚拟磁盘驱动器。要使用上一章创建的自定义\
  \ `MyPool` 存储池，在点击“管理...”（Manage...）按钮之前启用“选择或创建自定义”（Select or create custom storage）选项。\n\
  \n在存储卷对话框中，在左侧面板选择 `MyPool` 项，然后点击主面板中的 `+` 按钮创建新的存储卷：\n\n![](img/virt-manager_storage_volumes.png)\n\
  \n图 23-7\n\n\n\n\n请注意，对话框左下角的 `+` 按钮也可用于创建新的存储池，作为使用 `Cockpit` 界面的替代方案。\n\n在配置屏幕（图\
  \ 23-8）上，命名存储卷，选择卷大小并点击 `Finish` 按钮创建卷并将其分配给虚拟机：\n\n![](img/virt-manager_volume_details.png)\n\
  \n图 23-8\n\n一旦完成这些设置，选择新卷并点击 `Choose Volume` 按钮。然后，再次点击 `Forward` 按钮。最后一个屏幕显示配置摘要。检查显示的信息。还可以使用高级选项来更改客\
  \ true 机的虚拟网络配置，如图图 23-9 所示：\n\n![](img/almalinux_virt-manager_create_vm.png)\n\n\
  图 23-9\n\n### 23.3 启动 KVM 虚拟机\n\n点击 `Finish` 按钮开始创建过程。虚拟化管理器将在启动客系统之前创建磁盘并配置虚拟机。最后，新的虚拟机将出现在主\
  \ `virt-manager` 窗口中，状态设为 `Running`，如图图 23-10 所示：\n\n![](img/virt-manager_vm_running.png)\n\
  \n图 23-10\n\n默认情况下，虚拟机的控制台应出现在虚拟机查看器窗口中。要在以后任何时候查看运行机器控制台，请确保在虚拟机列表中选择了它，并选择工具栏上的\
  \ `Open` 按钮。虚拟机查看器应准备好开始安装过程：\n\n![](img/almalinux_vm_running.png)\n\n图 23-11\n\n\
  从现在开始，按照安装说明在 KVM 虚拟机中安装操作系统。\n\n## 23.4 总结\n\n在 AlmaLinux 9 宿主机系统上创建新的 KVM 虚拟机有多种方法。本章使用\
  \ `virt-manager` 图形工具来创建、配置和运行客户操作系统，包括创建一个新的存储卷。在涵盖这些基础知识后，下一章将介绍如何从命令行创建虚拟机。\n\
  \n# 24. 使用 virt-install 和 virsh 创建 KVM 虚拟机\n\n在之前的章节中，我们探索了如何使用 `Cockpit` 和 `virt-manager`\
  \ 图形工具在 AlmaLinux 9 宿主机上创建 KVM 客操作系统。本章将重点介绍使用 `virt-install` 和 `virsh` 命令行工具创建基于\
  \ KVM 的虚拟机。这些工具提供了 `virt-manager` 和 `Cockpit` 选项的所有功能，且优点可以在脚本中使用以自动化虚拟机的创建。此外，`virsh`\
  \ 命令允许根据配置文件中的规范创建虚拟机。\n\n`virt-install` 工具通过提供命令行选项列表来创建新的虚拟机。本章假设已安装了必要的 KVM 工具。请参阅章节“在\
  \ AlmaLinux 9 上安装 KVM 虚拟化” 了解有关这些要求的详情。\n\n### 24.1 运行 virt-install 构建 KVM 客系统\n\
  \n`virt-install` 实用接受广泛的命令行参数，这些参数提供了与创建的虚拟机相关的配置信息。某些命令行选项是强制性的（明确要求必须提供 `name`、`memory`\
  \ 和 `disk` 存储），而其他是可选的。\n\n至少，`virt-install` 命令通常需要以下参数：\n\n* `--name` - 分配给虚拟机的名称。\n\
  * `--memory` - 分配给虚拟机的内存量。\n* `--disk` - 用于虚拟机存储的镜像文件名称和位置。该文件将由 `virt-install`\
  \ 在虚拟机创建期间创建，除非指定了 `--import` 选项以指示要使用现有的镜像文件。\n* `--cdrom` 或 `--location` - 指定包含客操作系统安装介质的本地路径或远程\
  \ ISO 镜像的 URL。\n\n在运行 `virt-install` 时可用的所有参数摘要可以在 man 手页中找到：\n\n```bash\n$ virt\
  \ virt-install\n```\n\n### 24.2 一个 AlmaLinux 9 virt-install 命令示例\n\n参考上述命令行参数列表，我们现在可以使用使用\
  \ `virt-install` 工具的示例命令行结构。\n\n注意，为了显示虚拟机并完成安装，在 `virt-install` 实用程序启动虚拟机后，必须连接一个\
  \ `virt-viewer` 实例。默认情况下，`virt-install` 会在虚拟机开始运行后尝试启动 `virt-viewer`。但是，如果 `virt-viewer`\
  \ 不可用，`virt-install` 将等待到建立 `virt-viewer` 连接。例如，如果宿主机有图形桌面，`virt-viewer` 会话可能在本地运行，或者从远程客户端建立连接，正如章节“使用\
  \ virt-manager 在 AlmaLinux 9 上创建 KVM 虚拟机” 中概述。\n\n以下命令创建了一个新的 KVM 虚拟机，其配置为使用 KVM\
  \ 半虚拟化运行 AlmaLinux 9 客机。它创建一个新的 10GB 磁盘镜像，为虚拟机分配 2048MB 内存，并为安装介质 ISO 镜像配置了虚拟 CD\
  \ 设备：\n\n```bash\n# virt-install --name demo_vm_guest2 --memory 2048 --disk path=/tmp/demo_vm_guest.img,size=10\
  \ --network network=default --cdrom ./AlmaLinux-9.2-x86_64-minimal.iso\n```\n\n\
  当创建过程运行时，`virt-install` 命令将显示创建进度的状态更新：\n\n```\nStarting install...\nAllocating\
  \ 'demo_vm_guest.img' | 10 GB 00:00:01\nRunning graphical console command: virt-viewer\
  \ --connect qemu:///system --wait demo_vm_guest\n```\n\n一旦客系统创建完成，`virt-viewer`\
  \ 屏幕将出现，包含从指定安装介质加载的客操作系统安装程序：\n\n![](img/almalinux_virt-viewer_install.png)\n\n\
  图 24-1\n\n从这里开始，按照客操作系统的标准安装程序进行。\n\n### 24.3 从命令行启动和停止虚拟机\n\n既然从命令行创建了虚拟机，推测以后可能也需要从命令行启动它。这可以通过\
  \ `virsh` 命令行工具实现，并引用创建时分配的名称。例如：\n\n```bash\n# virsh start demo_vm_guest\n```\n\
  \n同样，可以通过以下方式向虚拟机发送关闭信号：\n\n```bash\n# virsh shutdown demo_vm_guest\n```\n\n假设虚拟机对关闭信号没有响应且没有开始正常关闭。在这种情况下，可以使用\
  \ `destroy` 指令强制停止虚拟机（伴随数据丢失的风险）：\n\n```bash\n# virsh destroy demo_vm_guest\n```\n\
  \n## 24.4 通过配置文件创建虚拟机\n\n`virsh create` 命令可以接受一个文件名作为参数，并以此为基础创建新的虚拟机。配置文件使用 XML\
  \ 格式。创建配置文件的最简单方法是导出现有虚拟机的配置，并为新虚拟机进行修改。这可以通过 `virsh dumpxml` 命令实现。例如，以下命令将名为 `demo_vm_guest`\
  \ 的虚拟机域配置数据输出到名为 `demo_vm_guest.xml` 的文件中：\n\n```bash\n# virsh dumpxml demo_vm_guest\
  \ > demo_vm_guest.xml\n```\n\n一旦生成文件，将其加载到编辑器中检查并更改新虚拟机的设置。\n\n至少必须更改 `<name>`、`<uuid>`\
  \ 和镜像文件路径 `<source file>`，以避免与获取配置的原始虚拟机发生冲突。对于 UUID，可以从文件中删除该行。\n\n\n\n\n虚拟化类型、内存分配以及\
  \ CPU 数量等仅列部分选项，根据需要也可以进行更改。一旦修改了文件，可以如下所示创建新的虚拟机：\n\n```bash\nvirsh create demo_vm_guest.xml\n\
  ```\n\n## 24.5 总结\n\nKVM 提供了 `virt-install` 和 `virsh` 命令行工具，作为使用 `Cockpit` 和 `virt-manager`\
  \ 工具创建和管理虚拟机实例的快速高效替代方案。这些工具的优势在于可以在脚本内部使用，以实现虚拟机的创建和管理。`virsh` 命令还包含了从基于 XML 配置文件创建\
  \ VM 实例的选项。\n\n## 25. 创建 AlmaLinux 9 KVM 网络化桥接接口\n\n默认情况下，AlmaLinux 9 上的 KVM 虚拟化环境会创建一个虚拟网络，虚拟机可以连接到该网络。也可以使用\
  \ `MacVTap` 驱动配置直接连接。然而，正如虚拟化技术概述章节概述的，这种方法不允许主机和客机系统进行通信。\n\n本章将介绍在 AlmaLinux 9\
  \ 上创建网络桥接器的步骤，使客机系统能够共享主机的一个或多个物理网络连接，同时仍允许客机和主机系统进行通信。\n\n在本章的剩余部分中，我们将解释如何为基于\
  \ KVM 的客操作系统配置 AlmaLinux 9 网络桥接器。\n\n## 25.1 获取当前的 Network Manager 设置\n\n可以使用 `NetworkManager`\
  \ 命令行工具 (`nmcli`) 创建网络桥接器。`NetworkManager` 在 AlmaLinux 9 系统上默认安装并启用，负责检测和连接网络设备，并为管理网络配置提供接口。\n\
  \n主机系统上当前网络连接的列表显示所示：\n\n```bash\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\n\
  eno1 f8d7c1b3-994c-3b5a-87f1-f8430e49f992 ethernet eno1\nlo 05d13946-2ae4-49b7-92b5-1ecfbe604adb\
  \ loopback lo\nvirbr0 91d7e0e0-d953-446a-887b-62c2635951e2 bridge virbr0\n\n上述输出显示主机已通过名为\
  \ `eno1` 的设备建立了以太网网络连接，以及名为 `virbr0` 的默认桥接接口，该接口提供了对 KVM 客机系统默认连接的 NAT 虚拟网络的访问。\n\
  \n同样，可以使用以下命令识别系统上当前配置设备（包括虚拟和物理设备）：\n\n```bash\nnmcli device show\n```\n\nGENERAL.DEVICE:\
  \ eno1\nGENERAL.TYPE: ethernet\nGENERAL.HWADDR: 00:23:24:52:52:57\nGENERAL.MTU:\
  \ 1500\nGENERAL.STATE: 100 (connected)\nGENERAL.CONNECTION: eno1\nGENERAL.CON-PATH:\
  \ /org/freedesktop/NetworkManager/ActiveConnection/2\nWIRED-PROPERTIES.CARRIER:\
  \ on\nIP4.ADDRESS[1]: 192.168.86.39/24\nIP4.GATEWAY: 192.168.86.1\nIP4.ROUTE[1]:\
  \ dst = 192.168.86.0/24, nh = 0.0.0.0, mt = 100\nIP4.ROUTE[2]: dst = 0.0.0.0/0,\
  \ nh = 192.168.86.1, mt = 100\nIP4.DNS[1]: 192.168.86.1\nIP4.DOMAIN[1]: lan\nIP6.ADDRESS[1]:\
  \ fd1e:fe64:8988:2c34:223:24ff:fe52:5257/64\nIP6.ADDRESS[2]: fe80::223:24ff:fe52:5257/64\n\
  \n上述部分输出表明执行命令的主机系统包含一个物理以太网设备 (`eno1`) 和一个虚拟桥接器 (`virbr0`)。\n\n可以使用 `virsh` 命令列出系统上当前配置的虚拟网络：\n\
  \n```bash\nvirsh net-list --all\n```\n\n Name State Autostart Persistent\n----------------------------------------------------------\n\
  \ default active yes yes\n\n目前，唯一的虚拟网络是由 `virbr0` 提供的默认网络。现在已获取当前网络配置的一些基本信息，下一步是创建一个连接到物理网络设备（在此情况下为\
  \ `eno1`）的网络桥接器。\n\n### 25.2 从命令行创建 Network Manager 桥接器\n\n创建桥接器的第一步是在配置中添加新连接。可以使用\
  \ `nmcli` 工具实现，指定该连接为桥接器并为连接和接口提供名称：\n\n```bash\nnmcli con add ifname br0 type bridge\
  \ con-name br0\n```\n\n一旦添加了连接，需要在物理设备 `eno1`（从设备）和桥接连接 `br0`（主设备）之间建立桥接从设备接口，如下：\n\
  \n```bash\nnmcli con add type bridge-slave ifname eno1 master br0\n```\n\n连接 'bridge-slave-eno1'\
  \ (07e588c0-14a1-4168-a9c6-e9056f55c11f) 已成功添加。\n\n此时，`NetworkManager` 连接列表应如下：\n\
  \n```bash\nnmcli con show\n```\n\neno1 f8d7c1b3-994c-3b5a-87f1-f8430e49f992 ethernet\
  \ eno1\nvirbr0 91d7e0e0-d953-446a-887b-62c2635951e2 bridge virbr0\nbr0 5eac7f23-d0fa-4df9-986b-b643f1b4d35b\
  \ bridge --\nbridge-slave-eno1 07e588c0-14a1-4168-a9c6-e9056f55c11f ethernet --\n\
  \n下一步是启动桥接接口。如果通过网络连接（例如通过 SSH）执行配置桥接器的步骤，则此步骤可能会出现问题，因为在调起桥接连接之前，必须关闭当前的 `eno1`\
  \ 连接。这意味着在启用桥接连接进行替换之前，当前连接将丢失，可能导致远程主机无法访问。\n\n如果你正在远程访问主机系统，可以通过创建一个 shell 脚本来执行网络更改以避免这个问题。这将确保\
  \ `eno1` 接口关闭后启用桥接接口，允许你在更改完成后重新连接到主机。首先创建一个名为 `bridge.sh` 的 shell 脚本文件，包含以下命令：\n\
  \n```bash\n#!/bin/bash\nnmcli con down eno1\nnmcli con up br0\n```\n\n创建脚本后，如下所示执行它：\n\
  \n```bash\nsh ./bridge.sh\n```\n\n当脚本执行时，当 `eno1` 连接关闭时连接将丢失。然而，等待几秒钟，一旦 `br0` 连接激活，就可以重新连接到主机。请注意，在某些情况下，桥接接口分配的\
  \ IP 地址与之前分配的不同。在尝试通过 ssh 重新连接时记住这一点。\n\n如果你在主机本地操作，可以运行这两个 `nmcli` 命令而不会丢失连接性：\n\
  \n```bash\nnmcli con down eno1\nnmcli con up br0\n```\n\n一旦桥接启动，连接列表现在应该包含桥接和桥接从设备连接：\n\
  \n```bash\nnmcli con show\n```\n\nNAME UUID TYPE DEVICE\neno1 f8d7c1b3-994c-3b5a-87f1-f8430e49f992\
  \ ethernet eno1\nvirbr0 91d7e0e0-d953-446a-887b-62c2635951e2 bridge virbr0\nbr0\
  \ 5eac7f23-d0fa-4df9-986b-b643f1b4d35b bridge --\nbridge-slave-eno1 07e588c0-14a1-4168-a9c6-e9056f55c11f\
  \ ethernet --\n\n请注意该连接仍在列表中，但不再激活。要从列表中排除非活动连接，在请求列表时使用 `--active` 标志：\n\n```bash\n\
  nmcli con show --active\n```\n\nNAME UUID TYPE DEVICE\nbr0 5eac7f23-d0fa-4df9-986b-b643f1b4d35b\
  \ bridge --\nvirbr0 91d7e0e0-d953-446a-887b-62c2635951e2 bridge virbr0\n\n## 25.3\
  \ 声明 KVM 桥接网络\n\n此时，桥接连接存在于系统上，但对 KVM 环境不可见。运行 `virsh` 命令仍列出默认网络为唯一的可用网络选项：\n\n\
  ```bash\nvirsh net-list --all\n```\n\n Name State Autostart Persistent\n----------------------------------------------------------\n\
  \ default active yes yes\n\n在虚拟机可以使用桥接器之前，必须将其声明并添加到 KVM 网络配置中。这涉及定义文件的创建，并再次使用\
  \ `virsh` 命令行工具。\n\n首先为桥接网络创建一个名为 `bridge.xml` 的定义文件，内容如下：\n\n\n\n\n\n```xml\n<network>\n\
  \  <name>br0</name>\n  <forward mode=\"bridge\"/>\n  <bridge name=\"br0\" />\n</network>\n\
  ```\n\n接下来，使用该文件定义新网络：\n\n```bash\nvirsh net-define ./bridge.xml\n```\n\n已从 `./bridge.xml`\
  \ 定义了网络 `br0`\n\n一旦定义了网络，启动它，并根据需要将其配置为每次系统重启动时自动启动：\n\n```bash\nvirsh net-start\
  \ br0\nvirsh net-autostart br0\n```\n\n再次列出网络，以验证桥接网络现在是否可以在 KVM 环境中访问：\n\n```bash\n\
  virsh net-list --all\n```\n\nName State Autostart Persistent\n----------------------------------------------------------\n\
  br0 active yes yes\ndefault active yes yes\n\n## 25.4 在虚拟机中使用桥接网络\n\n要创建一个使用桥接网络的虚拟机，请使用\
  \ `virt-install` 的 `--network` 选项并指定 `br0` 桥接名称。例如：\n\n```bash\nvirt-install --name\
  \ alma_vm_guest --memory 1024 --disk path=/tmp/alma_vm_guest.img,size=10 --network\
  \ network=br0 --cdrom /home/demo/AlmaLinux-9.2-x86_64-minimal.iso\n```\n\n当客机操作系统运行时，它将出现在与主机系统相同的物理网络上，而不再位于基于\
  \ NAT 的虚拟网络上。\n\n也可以在 Cockpit 界面中编辑虚拟机，找到 **Network interfaces**（网络接口）部分，并点击此处亮显示的\
  \ **Edit**（编辑）按钮（如下图 25-1),来选择桥接：\n\n![](img/ubuntu_cockpit_edit_network.png)\n\n\
  图 25-1\n\n在生成的界面设置对话框中，将 `Interface type`（接口类型）菜单更改为 `Bridge to LAN`（桥接到局域网），并将\
  \ `Source`（源）设置为 `br0`，如图 25-2 所示：\n\n![](img/cockpit_kvm_bridge.png)\n\n图 25-2\n\
  \n同样，当使用 `virt-manager` 工具创建新虚拟机时，桥接将在 **Network**（网络）选择菜单中可用：\n\n![](img/ubuntu_virt-manager_bridge.png)\n\
  \n图 25-3\n\n要修改现有虚拟机以使其使用桥接，请使用 `virsh edit` 命令。该命令将 XML 定义文件加载到编辑器中，可以在其中进行更改并保存：\n\
  \n```bash\nvirsh edit GuestName\n```\n\n默认情况下，文件将加载到 `vi` 编辑器。若要使用不同的编辑器，请更改 `$EDITOR`\
  \ 环境变量，例如：\n\n```bash\nexport EDITOR=gedit\n```\n\n要从默认虚拟网络更改，定位到文件的 `<interface>`\
  \ 部分，对于基于 NAT 的配置，该部分内容如下：\n\n```xml\n<interface type='network'>\n  <mac address='<your\
  \ mac address here>'/>\n  <source network='default'/>\n  <model type='virtio'/>\n\
  \  <address type='pci' domain='0x0000' bus='0x01' slot='0x00' function='0x0'/>\n\
  </interface>\n```\n\n或者，如果虚拟机使用的是直接连接，该条目可能如下：\n\n```xml\n<interface type='direct'>\n\
  \  <mac address='<your mac address here>'/>\n  <source dev='eno1' mode='vepa'/>\n\
  \  <model type='virtio'/>\n  <address type='pci' domain='0x0000' bus='0x01' slot='0x00'\
  \ function='0x0'/>\n</interface>\n```\n\n要使用桥接，在保存文件之前，将 `source network` 属性更改为：\n\
  \n```xml\n<interface type='network'>\n  <mac address='<your mac address here>'/>\n\
  \  <source network='br0'/>\n  <model type='virtio'/>\n  <address type='pci' domain='0x0000'\
  \ bus='0x01' slot='0x00' function='0x0'/>\n</interface>\n```\n\n## 25.5 使用 nm-connection-editor\
  \ 创建桥接网络\n\n如果虚拟机可用，可以使用 `nm-connection-editor` 工具配置桥接。要使用此工具，请运行命令：\n\n```bash\n\
  nm-connection-editor\n```\n\n要创建新连接，点击如图 25-4 所示的 `+` 按钮：\n\n![](img/nm-connection-home.png)\n\
  \n图 25-4\n\n选中桥接选项后，点击如图 25-5 所示的 `Add`（添加）按钮：\n\n![](img/nm-connection-type.png)\n\
  \n图 25-5\n\n在生成的对话框中，将 `name` 字段更改为 `br0`，如图 25-6 所示：\n\n![](img/nm-connection-br0.png)\n\
  \n图 25-6\n\n在设置中，将 `Connection type`（连接类型）更改为 `Ethernet`（以太网）并点击 `Add` 按钮：\n\n![](img/nm-connection-ethernet.png)\n\
  \n图 25-7\n\n在下一个对话框中，将 `Device` 设置为 `eno1`，如图 25-8 所示：\n\n![](img/nm-connection-port.png)\n\
  \n图 25-8\n\n点击 `Save` 应用更改。返回主窗口后，桥接现在应列在其中：\n\n![](img/nm-connection-added.png)\n\
  \n图 25-9\n\n只需使用以下命令禁用 `eno1` 连接并启用 `br0` 连接：\n\n```bash\nnmcli down eno1\nnmcli\
  \ up br0\n```\n\n还需要按照声明 KVM Bridge 部分的将桥添加到 KVM 网络。\n\n## 25.6 总结\n\n默认情况下，KVM\
  \ 虚拟机连接到使用 NAT 的虚拟网络以访问主机系统所在的网络。如果需要虚拟机具有自己的 IP 地址出现在网络上，则需要将其配置为共享主机的物理接口。本章概述了使用\
  \ `nmcli` 或 `nm-connection-editor` 工具创建网络桥。\n\n# 26. 使用 virsh 命令行工具管理 KVM\n\n在之前的章节中，我们涵盖了在\
  \ AlmaLinux 9 上安装和配置基于 KVM 的虚拟机操作系统。本章探索了 `virsh` 工具中之前章节未涵盖的其他领域，以及如何从命令行管理 KVM。\n\
  \n## 26.1 virsh Shell 和命令行\n\n`virsh` 工具既是一个命令行工具，也是一个交互式 shell 环境。在命令行模式下使用时，在提示符处输入带有适用于任务的参数命令：\n\
  \n```bash\nvirsh <option>\n```\n\n`virsh` 工具在 shell 模式下使用时，提供了一个可以执行命令序列的交互环境。要在\
  \ virsh shell 中运行命令，请运行以下命令：\n\n```bash\nvirsh\n\nWelcome to virsh, the virtualization\
  \ interactive terminal.\n\nType: 'help' for help with commands\n'quit' to quit\n\
  \nvirsh #\n```\n\n\n\n\n在 `virsh` # 提示符下，输入您想要运行的选项。例如下面的 `virsh` 会话将列出当前的虚拟机，启动一个名为\
  \ `FedoraVM` 的虚拟机，然后再次获取列表以验证该虚拟机正在运行：\n\n# virsh\n\n```\n欢迎使用 virsh，虚拟化交互式终端。\n\
  \n输入 'help' 获取命令帮助\n       输入 'quit' 退出\n\nvirsh # list\n\n  Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n\nvirsh # start FedoraVM\n\nDomain FedoraVM\
  \ started\n\nvirsh # list\n\n  Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n10 FedoraVM running\nvirsh#\n```\n\n\
  `virsh` 工具支持广泛命令，可以使用帮助选项获取完整的命令列表：\n\n# virsh help\n\n通过在帮助指令后指定命令，可以获取有关每个命令语的更多细节：\n\
  \n# virsh help restore\n\n```\n  NAME\n    restore - 从文件中保存的状态中恢复域\n\n  SYNOPSIS\n\
  \    restore <file> [--bypass-cache] [--xml <string>] [--running] [--paused]\n\n\
  \  DESCRIPTION\n    恢复一个域。\n\n  OPTIONS\n    [--file] <string> 要恢复的状态\n    --bypass-cache\
  \ 恢复时避免使用文件系统缓存\n    --xml <string> 包含目标更新 XML 的文件名\n    --running 将域恢复到运行状态\n \
  \   --paused 将域恢复到暂停状态\n```\n\n在本章的剩余部分，我们将详细介绍其中的一些命令。\n\n## 26.2 列出客户系统状态\n\n\
  可以使用 `virsh` 工具的 `list` 选项随时查看 AlmaLinux 9 虚拟化宿主机上客户系统的状态。例如：\n\n# virsh list\n\n\
  上述命令将显示包含每个客户系统一行的输出，类似于所示：\n\n```\nvirsh # list\n\n  Id Name State\n----------------------------------------------------\n\
  \ 8 RHEL9VM running\n 9 CentOS9VM running\n10 FedoraVM running\n```\n\n## 26.3 启动客户系统\n\
  \n可以使用 `virsh` 工具结合 `start` 命令启动客户操作系统。\n\n## 26.4 关闭客户系统\n\n顾其名，可以使用 `virsh` 工具关闭客户操作系统：\n\
  \n```\nvirsh shutdown\n```\n\n## 26.5 挂起和恢复客户系统\n\n可以使用 `virsh` 工具挂起和恢复客户系统。例如：\n\
  \n```\nvirsh suspend\nvirsh resume\n```\n\n## 26.6 保存和恢复客户系统\n\n可以使用 `virsh` 工具保存和恢复客户系统。这对客户来说是可能的。\n\
  \n## 26.7 重启客户系统\n\n可以使用 `virsh` 工具重启客户系统：\n\n```\nvirsh reboot\n```\n\n## 26.8\
  \ 配置分配给客户系统的内存\n\n要配置分配给客户的内存，请使用 `setmem` 选项。例如：\n\n```\nvirsh setmem\n```\n\n\
  ## 26.9 总结\n\n`virsh` 工具提供了创建、监控和管理虚拟机的各种选项。\n\n## 27 Linux 简介\n\n前面的章节介绍了虚拟化概念。本章将介绍相关的容器技术。\n\
  \n## 27.1 Linux 容器与内核共享\n\n简单来说，容器是虚拟化的轻量级替代方案。虚拟机包含并运行整个客户系统。而虚拟机又运行在管理物理资源访问的超管理器之上。\n\
  \n为了理解内核共享和容器的工作原理，首先理解 Linux 或 UNIX  way 系统的两个主要组件会有帮助。操作系统的核心是内核。简单来说，内核处理操作系统与物理硬件之间所有的交互。第二个关键组件是根文件系统，它包含了操作系统运行所需的所有库、文件和实用。利用这种结构，每个容器都有自己的文件系统，但共享宿主机操作系统的内核。这种结构在下方的图\
  \ 27-1 架构图中所示。\n\n![](img/linux_container_diagram.png)\n\n图 27-1\n\n## 27.2 容器的用途和优势\n\
  \n容器的主要优势是它们所需的资源开销远小于虚拟化，允许在单个服务器上同时运行许多容器实例。它们可以根据需求水平快速高效地启动和停止。此外，容器具有高度的可移植性，可以在系统之间轻松地迁移。结合\
  \ Docker、OpenShift 和 Kubernetes 等容器管理系统，可以在跨越多个服务器和云平台的大范围内部署和管理容器，可能运行数千个容器。\n\n\
  \n\n\n容器经常用于为应用程序创建轻量级执行环境。在这种情况下，每个容器都提供了一个隔离的环境，包含了应用程序以及该程序运行所需的所有运行时和支持文件。随后，容器可以部署到任何其他支持容器执行的兼容主机系统，而无需担心目标系统可能缺少应用程序所需的运行时配置——因为应用程序的所有依赖已经包含在容器中。\n\
  \n容器在桥接开发环境与生产环境之间的差距也很有帮助。通过在容器中进行开发和质量保证（QA）工作，可以将它们安全地传递到生产环境并启动，因为应用程序运行在其开发和测试时相同的容器环境中。\n\
  \n容器还促进了大型和复杂解决方案的模块化部署方法。与其将应用程序作为单一的单体进行开发，可以使用容器将应用程序设计成一组相互作用的模块，每个模块运行在独立的容器中。\n\
  \n容器的一个可能缺点是客户操作系统必须与共享的内核版本兼容。例如，无法在 Linux 上的容器中运行 Microsoft Windows。同样，为 `2.6`\
  \ 版本内核设计的 Linux 客户系统无法共享 `2.4` 版本的内核。然而，这些要求并不是容器的设计初衷。与其将这些限制视为局限性，不如将这些限制视为容器提供简单、可扩展且可靠的部署平台的一些关键优势。\n\
  \n## 27.3 AlmaLinux 9 容器工具\n\nAlmaLinux 9 提供了多种用于创建、检查和管理容器工具。主要工具如下：\n\n*   `buildah`\
  \ – 用于构建容器镜像的命令行工具。\n*   `podman` – 一个基于命令行的容器运行时和管理工具。执行诸如从远程仓库下载容器镜像、检查、启动和停止镜像等任务。\n\
  *   `skopeo` – 用于转换容器镜像、在仓库之间复制镜像以及在不下载的情况下检查存储在仓库中的镜像的命令行实用。\n*   `runc` – 一个轻量级容器运行时，用于从命令行启动和运行容器。\n\
  *   `OpenShift` – 企业级容器应用程序管理平台，由命令行和基于 Web 的工具组成。\n\n上述所有工具都符合开放容器倡议 (`OCI`)，这是一组旨在确保容器在竞争工具和平台之间遵循相同标准的规范。\n\
  \n## 27.4 Docker 注册表\n\n尽管 AlmaLinux 9 提供了一套旨在替代 Docker 提供的工具的工具，但这些工具在构建容器时仍需要访问\
  \ AlmaLinux 镜像。为此，AlmaLinux OS 基金会在 Docker Hub 内部维护一组容器镜像。Docker Hub 是一个由多个仓库组成的在线容器注册表（registry），每个仓库都包含多种在构建容器时可供下载的容器镜像。仓库中的每个镜像都被分配了一个仓库标签（例如\
  \ `9.2`、`latest` 等），在执行镜像下载时可以引用该标签。例如，是 Docker Hub 中包含的最新 AlmaLinux 镜像的 URL：\n\n\
  `docker://docker.io/library/almalinux`\n\n除了从 Docker 和其他第三方托管注册表下载（容器术语中称为“拉取”，pulling）容器镜像外，您还可以使用注册表来存储您自己的镜像。这可以通过托管自己的注册表，或者利用现有的服务来实现，例如\
  \ Docker、`Amazon AWS`、`Google Cloud`、`Microsoft Azure` 和 `IBM Cloud` 提供的服务（这众多选项中的几个）。\n\
  \n## 27.5 容器网络\n\n默认情况下，容器使用容器网络接口 (`CNI`) 桥接网络栈连接到网络。在桥接配置中，运行在服务器上的所有容器都属于同一个子网，因此它们可以相互通信。容器还通过桥接主机系统的网络连接连接到外部网络。同样，主机可以通过虚拟网络接口（通常命名为\
  \ `podman0`）访问容器，该接口是在安装容器工具时创建的。\n\n## 27.6 总结\n\nLinux 容器提供了虚拟化的轻量级替代方案，并利用了 Linux\
  \ 和 Unix 操作系统的结构。Linux 容器共享宿主机操作系统的内核，每个容器都有自己的根文件系统，其中包含文件、库和应用程序。因此，容器具有高效高效和可扩展性，为构建和部署模块化的企业级解决方案提供了理想平台。此外，还有多种工具和平台用于构建、部署和管理容器，包括第三方解决方案以及\
  \ AlmaLinux OS 基金提供的解决方案。\n\n# 28. 在 AlmaLinux 9 上使用容器\n\n在上一章介绍了 Linux 容器的基础知识之后，本章将演示如何在\
  \ AlmaLinux 9 上使用 `Podman`、`Skopeo` 和 `Buildah` 工具创建和管理容器。到本章结束，你将对如何在 AlmaLinux\
  \ 9 上创建和管理容器有更清晰的理解。此外，你将获得知识基础，以便继续探索 Linux 容器的力量。\n\n## 28.1 安装容器工具\n\n在开始使用容器之前，第一步是使用以下命令安装上一章中概述的所有容器工具：\n\
  \n```bash\ndnf install container-tools\n```\n\n## 28.2 拉取 AlmaLinux 9 容器镜像\n\n本示例将从注册表拉取\
  \ AlmaLinux 9。然而，在拉取镜像之前，可以使用 `skopeo` 工具获取镜像仓库的信息，例如：\n\n```bash\nskopeo inspect\
  \ docker://docker.io/library/almalinux:minimal\n```\n\n```json\n{\n    \"Name\"\
  : \"docker.io/library/almalinux\",\n    \"Digest\": \"sha256:0240ad1be8c11dda3af295a293e619f9bafcd6041f21c1123c6b5f2698298e49\"\
  ,\n    \"RepoTags\": [\n        \"8.6-20220512\",\n        \"9.1-minimal-20230407\"\
  ,\n        \"9.2\",\n        \"9.2-20230512\",\n        \"9.2-20230718\",\n    \
  \    \"9.2-minimal\",\n        \"9.2-minimal-20230512\",\n        \"9.2-minimal-20230718\"\
  ,\n        \"latest\",\n        \"minimal\"\n    ],\n    \"Created\": \"2023-07-18T19:20:31.493826474Z\"\
  ,\n    \"DockerVersion\": \"20.10.23\",\n    \"Labels\": null,\n    \"Architecture\"\
  : \"amd64\",\n    \"Os\": \"linux\",\n    \"Layers\": [\n        \"sha256:c5196fa8a2407565b9824e8b01912e41e0d1758fc1392c90795d704ff1b\"\
  \n    ],\n    \"LayersData\": [\n        {\n            \"MIMEType\": \"application/vnd.docker.image.rootfs.diff.tar\"\
  ,\n            \"Digest\": \"sha256:c5196fa8a2407565b9824e8b01912e41e0d1758fc1392c90795d704ff1b\"\
  ,\n            \"Size\": 3346621,\n            \"Annotations\": null\n        }\n\
  \    ],\n    \"Env\": [\n        \"PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
  \n    ]\n}\n```\n\n该镜像是构建最小操作系统容器的 AlmaLinux 9 基础镜像，并将作为本章示例的基础。\n\n```bash\npodman\
  \ search almalinux\n```\n\nNAME DESCRIPTION\ndocker.io/library/almalinux AlmaLinux\
  \ OS 的官方构建版本。\ndocker.io/kasmweb/almalinux-9-desktop 用于 Kasm Workspaces 的 AlmaLinux\
  \ 9 桌面。\ndocker.io/almalinux/8-base AlmaLinux OS 8 官方基础镜像。\ndocker.io/kasmweb/almalinux-8-desktop\
  \ 用于 Kasm Workspaces 的 AlmaLinux 8 桌面。\n\n在确认这确实是正确的镜像后，以下 podman 命令将将镜像拉取到本地系统：\n\
  \n```bash\npodman pull almalinux:minimal\n```\n\n\n\n已将 \"almalinux\" 解析为别名（`/etc/containers/registries.conf.d/000-shortnames.conf`）\n\
  \n正在拉取 `docker.io/library/almalinux:minimal`...\n\n正在获取镜像源签名\n复制 blob `c5196fa8a240`\
  \ 完成\n复制配置 `ee68e22f25` 完成\n正在将清单写入镜像目标\n正在存储签名\n`ee68e22f25ea07acd821995ad02bf292d1d78e241255447a1204fbe56e619f74`\n\
  \n通过让 `podman` 列出所有本地镜像来验证该镜像是否已存储：\n\n```bash\npodman images\n\nREPOSITORY TAG\
  \ IMAGE ID CREATED SIZE\ndocker.io/library/almalinux minimal ee68e22f25ea 3 months\
  \ ago 88.8 MB\n```\n\n通过运行 `podman inspect` 命令可以获取本地镜像的详细信息：\n\n```bash\npodman\
  \ inspect docker.io/library/almalinux:minimal\n```\n\n## 28. 在容器中运行镜像\n\n从注册库拉取的镜像是一个完全可运行的镜像，无需修改即可在容器中运行。要运行该镜像，请使用\
  \ `podman run` 命令。在这种情况下，将指定 `--rm` 选项，表示我们希望在容器中运行镜像，执行一条命令然后让容器退出。在这种情况下，将使用 `cat`\
  \ 工具输出位于容器根文件系统上的 `/etc/passwd` 文件内容：\n\n```bash\npodman run --rm docker.io/library/almalinux:minimal\
  \ cat /etc/passwd\n```\n\n```\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\n\
  daemon:x:2:2:daemon:/sbin:/sbin/nologin\nadm:x:3:4:adm:/var/adm:/sbin/nologin\n\
  lp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\nsync:x:5:0:sync:/sbin:/bin/sync\nshutdown:x:6:0:shutdown:/sbin:/sbin/shutdown\n\
  halt:x:7:0:halt:/sbin:/sbin/halt\nmail:x:8:12:mail:/var/spool/mail:/sbin/nologin\n\
  operator:x:11:0:operator:/root:/sbin/nologin\ngames:x:12:100:games:/usr/games:/sbin/nologin\n\
  ftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\nnobody:x:65534:65534:Kernel Overflow\
  \ User:/:/sbin/nologin\nsystemd-oom:x:995:995:systemd Userspace OOM Killer:/:/usr/sbin/nologin\n\
  ```\n\n将容器内的 `/etc/passwd` 文件与宿主机系统上的 `/etc/passwd` 文件进行对比。注意，它缺少了宿主机上的所有额外用户，这证实了\
  \ `cat` 命令是在容器环境中执行的。此外，请注意容器启动、运行命令并在几秒钟内退出了。将此与启动一个完整的操作系统、执行任务并关闭一台虚拟机所需的时间相比，你将开始体会容器的速度和效率。\n\
  \n要启动一个容器、保持其运行并访问 shell，可以使用以下命令：\n\n```bash\npodman run --name=mycontainer -it\
  \ docker.io/library/almalinux:minimal /bin/bash\n```\n\n```\n[root@16b6e7ffea1f\
  \ /]#\n```\n\n在这种情况下，使用了一个额外的命令行选项为容器分配了名称 `mycontainer`。虽然是可选的，但与使用自动生成的容器 ID 相比，这使得容器更易于被识别和引用。\n\
  \n在容器运行期间，在不同的终端窗口中运行 `podman` 以查看系统上所有容器的状态：\n\n```bash\npodman ps -a\n\nCONTAINER\
  \ ID IMAGE COMMAND CREATED STATUS PORTS NAMES\n16b6e7ffea1f docker.io/library/almalinux:minimal\
  \ /bin/bash 3 minutes ago Up 3 minutes mycontainer\n```\n\n要从宿主机在正在运行的容器中执行命令，请使用\
  \ `podman exec` 命令，引用运行中容器的名称和要执行的命令。例如，以下命令在名为 `mycontainer` 的容器中启动了第二个 bash 会话：\n\
  \n```bash\npodman exec -it mycontainer /bin/bash\n```\n\n```\n[root@16b6e7ffea1f\
  \ /]#\n```\n\n注意，尽管上面的示例引用了容器名称，但使用 `podman ps -a` 命令列出的容器 ID 也可以相同的结果：\n\n```bash\n\
  podman exec -it 16b6e7ffea1f /bin/bash\n```\n\n```\n[root@16b6e7ffea1f /]#\n```\n\
  \n或者，`podman attach` 命令也会挂载到运行中的容器并访问 shell 提示符：\n\n```bash\npodman attach mycontainer\n\
  ```\n\n```\n[root@16b6e7ffea1f /]#\n```\n\n一旦容器启动，就可以将其挂载到运行中的容器并访问 shell 提示符：\n\
  \n## 28. 管理容器\n\n一旦容器启动，就可以将其挂载到运行中的容器并访问 shell 提示符：\n\n一旦容器启动不再需要运行，可以使用 `podman\
  \ stop` 命令停止它，例如：\n\n```bash\npodman stop mycontainer\n```\n\n在容器停止后，可以使用 `podman\
  \ rm` 命令删除容器，例如：\n\n```bash\npodman rm mycontainer\n```\n\n一旦容器停止后，可以使用 `podman\
  \ ps -a` 查看系统上所有容器的状态：\n\n```bash\npodman ps -a\n\nCONTAINER ID IMAGE COMMAND CREATED\
  \ STATUS PORTS NAMES\n16b6e7ffea1f docker.io/library/almalinux:minimal /bin/bash\
  \ 3 minutes ago Exited (0) \n```\n\n要从宿主机在正在运行的容器中执行命令，请使用 `podman exec` 命令，引用运行中容器的名称和要执行的命令。例如，以下命令在名为\
  \ `mycontainer` 的容器中启动了第二个 bash 会话：\n\n```bash\npodman exec -it mycontainer /bin/bash\n\
  ```\n\n## 28. 将容器保存为镜像\n\n一旦容器运行不再需要，可以使用 `podman commit` 将其保存为镜像，这将使用容器的名称或 ID\
  \ 来实现，例如：\n\n```bash\npodman commit mycontainer my__image\n```\n\n一旦镜像保存完成，可以使用\
  \ `podman images` 检查它现在是否出现在本地仓库中：\n\n```\npodman images\n\nREPOSITORY TAG IMAGE\
  \ ID CREATED SIZE\nlocalhost/my_image latest 038c40bccff About minute ago 88.8 MB\n\
  docker.io/library/almalinux minimal ee68e22f25ea 3 months ago 88.8 MB\n```\n\n保存的镜像现在可以用来创建与原始镜像相同的容器：\n\
  \n```bash\npodman run --name=mycontainer -it localhost/my_image /bin/bash\n```\n\
  \n## 28. 从本地存储中删除镜像\n\n当镜像不再需要时，运行 `podman rmi` 命令将其从本地存储中删除，引用 `podman images`\
  \ 列出的镜像名称或 ID。例如，要删除上一节创建的名为 `my_image` 的镜像，请运行 `podman`：\n\n```bash\npodman rmi\
  \ my_image\n```\n\n在删除镜像之前，必须先删除基于该镜像的所有容器。\n\n\n\n从零开始构建容器会创建一个空容器。一旦创建完成，就可以安装软件包以满足容器的需求。这种方法在创建一个仅需安装最少软件包的容器时非常有用。\n\
  \n从零开始构建的第一步是运行以下命令来构建空容器：\n\n```bash\nbuildah from scratch\nworking-container\n\
  ```\n\n构建完成后，将创建一个名为 `working-container` 的新容器：\n\n```bash\nbuildah containers\n\
  CONTAINER ID BUILDER IMAGE ID IMAGE NAME CONTAINER NAME\n16b6e7ffea1f * ee68e22f25ea\
  \ docker.io/library/almalinux:m... 16b6e7ffea1f9997ef8481e9eb56d1fb0c2213f3fe4ec021777e0acb125fd0bd\n\
  89bfb616d19f * ee68e22f25ea docker.io/library/almalinux:m... almalinux-working-container\n\
  5ce904577d32 * scratch working-container\n```\n\n空容器现在已准备好安装某些软件包。遗憾的是，这无法在容器内进行，因为里面甚至没有\
  \ `bash` 或 `dnf` 工具。因此，需要将容器文件系统挂载到主机系统，并使用 `dnf` 安装软件包，同时将系统根目录设置为挂载的容器文件系统。通过以下方式挂载容器文件系统开始此过程：\n\
  \n```bash\nbuildah mount working-container\n/var/lib/containers/storage/overlay/5aff7bec2c6890219dfcdb974b5b0e49256c81ea3dcbf860ad88cc014aeb6261/merged\n\
  ```\n\n如果文件系统挂载成功，`buildah` 将输出容器文件系统的挂载点。现在我们已经可以访问容器文件系统，可以使用 `dnf` 命令通过 `--installroot`\
  \ 选项指向挂载的容器文件系统，从而向容器安装软件包。例如，以下命令在容器文件系统上安装 `bash`、`CoreUtils` 和 `dnf` 软件包（其中 `<container_fs_mount>`\
  \ 是之前 `buildah mount` 命令输出的挂载路径）：\n\n```bash\ndnf install --releasever=9 --installroot\
  \ <container_fs_mount> bash coreutils dnf\n```\n\n注意，`--releasever` 选项指示 `dnf` 在容器内安装\
  \ AlmaLinux 9 的软件包。\n\n安装完成后，按照以下方式卸载空文件系统：\n\n```bash\nbuildah umount working-container\n\
  ```\n\n一旦 `dnf` 完成了软件包安装，就可以运行容器并按如下方式访问 `bash` 命令行提示符：\n\n```bash\nbuildah run\
  \ working-container bash\nbash-5.1#\n```\n\n 28.10 容器桥接网络\n\n如前一节所述，容器网络是使用容器网络接口\
  \ (CNI) 桥接网络栈实现的。以下命令显示了运行容器的宿主机系统上的典型网络配置：\n\n```bash\nip a\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000\n     link/loopback\
  \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n     inet 127.0.0.1/8 scope host lo\n\
  \        valid_lft forever preferred_lft forever\n     inet6 ::1/128 scope host\n\
  \        valid_lft forever preferred_lft forever\n2: eno1: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc fq_codel state UP group default qlen 1000\n     link/ether 00:23:24:52:52:57\
  \ brd ff:ff:ff:ff:ff:ff\n     altname enp0s25\n     inet 192.168.86.35/24 brd 192.168.86.255\
