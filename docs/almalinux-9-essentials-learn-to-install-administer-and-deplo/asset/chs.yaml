  \n最后，要从一个模块流切换到另一个流，运行引用新流的安装命令如下：\n\n```\ndnf install @modulename:otherstream\n\
  ```\n\n此命令将下载新流的软件包并将现有软件包升级或降级到指定的版本。一旦过程完成后，重新同步新流的模块软件包：\n\n```\ndnf distro-sync\n\
  ```\n\n## 10.4 总结\n\nAlmaLinux 9 系统由 RPM 格式的软件包组成，这些软件包从 AlmaLinux BaseOS、AppStream\
  \ 和 Extras 仓库下载并安装。根据需要，可以在系统中添加额外的仓库以安装软件包。\n\nBaseOS 仓库包含了实现操作系统的基础核心功能的软件包。另一方面，AppStream\
  \ 软件包提供了额外的功能和特性，将根据配置系统的目的选择性地安装。在类这样的复杂系统中，可能存在大量的包依赖关系，部分系统可能需要特定版本的另一个软件包才能正常运行。AppStream\
  \ 允许创建模块和配置文件，其中包含所有必要的依赖包，以便在正确的版本级别上一起安装特定功能。AppStream 还允许已安装的软件包接收当前版本的更新，而不必下载下一个主版本，从而避免破坏其他软件包的依赖关系。\n\
  \n\n\n\n要精练管理 AlmaLinux 9 系统，理解 `systemd` 单元的概念至关重要，特别是两种名为目标（targets）和服务（services）的特定类型。本章概述了\
  \ AlmaLinux 9 支持的不同 `systemd` 单元，以及如何配置在运行的 Linux 系统后台运行的服务。\n\n## 11.1 理解 AlmaLinux\
  \ 9 systemd 目标\n\nAlmaLinux 9 可以配置为启动到若干状态之一（称为目标），每种状态都旨在提供特定级别的操作系统功能。系统管理员根据系统的用途，配置系统默认启动的目标。例如，桌面系统可能会被配置为使用图形用户界面目标启动。相比之下，云服务器系统更有可能启动到多用户（multi-user）目标级别。\n\
  \n在启动过程中，名为 `systemd` 的进程会在 `/etc/systemd/system` 文件夹中查找默认目标设置。确定默认目标后，它将开始启动与该目标相关的\
  \ `systemd` 单元，以便系统在运行所有必要进程的情况下完成启动。\n\n对于熟悉旧版本 AlmaLinux 的用户来说，`systemd` 目标取代了旧的运行级别（runlevel）系统。\n\
  \n## 11.2 理解 AlmaLinux 9 systemd 服务\n\n服务是一个通常在后台运行的提供特定功能的进程。例如，`sshd` 服务是一个为系统提供安全外壳（shell）访问的后台进程（称为守护进程\
  \ daemon）。不同的 `systemd` 目标被配置为自动启动不同的服务集合，具体取决于该目标需要提供的功能。\n\n目标和服务都都是 `systemd`\
  \ 单元的类型，这一主题将在本章稍后介绍。\n\n## 11.3 AlmaLinux 9 systemd 目标描述\n\n如前所述，AlmaLinux 9 可以启动到若干目标级别之一。系统配置的默认目标将反过来决定启动哪些哪些\
  \ `systemd` 单元。与系统启动和关闭直接相关的目标可以总结如下：\n\n- `poweroff.target` - 该目标关闭系统。你不太可能将其作为默认目标。\n\
  - `rescue.target` – 导致系统在单用户模式下启动，在该模式下只有 root 用户可以登录。在此模式下，系统不会启动任何网络、图形用户界面或多用户服务。此运行级别是系统管理员执行系统维护或修复活动的的理想选择。\n\
  - `multi-user.target` - 将系统启动到具有文本控制台登录能力的多用户模式。\n- `graphical.target` - 将系统启动到具有\
  \ X Window 系统能力的联网多用户状态。默认情况下，图形桌面环境将在启动过程结束时启动。这是桌面或工作站最常用的运行级别。\n- `reboot.target`\
  \ - 重启系统。这是另一个目标，由于显而易见的原因，你不太可能将其作为默认。\n\n除了上述目标外，系统还包含约 70 个其他目标，其中许多是上述主目标使用的子目标（sub-targets）。例如，在后台，`multi-user.target`\
  \ 会启动一个名为 `basic.target` 的目标，该目标反过来启动 `sockets.target` 单元，该单元是不同进程之间通信所必需的。这确保了\
  \ `multi-user` 目标依赖的所有服务在启动过程中也会启动。\n\n可以通过在终端窗口中运行以下命令来查看特定目标所依赖的目标和服务列表：\n\n```bash\n\
  systemctl list-dependencies <target>\n```\n\n例如，图 11-1 显示了图形目标 `systemd` 单元依赖的部分列表（完整列表包含了全功能的多用户系统所需的\
  \ 140 多个目标和服务）：\n\n![](img/rhel_target_dependecies.png)\n\n图 11-1\n\n列表以分级树的形式呈现，说明了某些依赖项具有自己的子依赖项。例如，滚动到列表底部会发现图形目标依赖于两个与网络文件系统相关的目标（即\
  \ `nfs-client.target` 和 `remote-fs.target`），每个目标都有自己的服务和目标子依赖项：\n\n![](img/rhel_nfs_dependecies.png)\n\
  \n图 11-2\n\n列表每个条目左侧的彩色点表示该服务或目标的当前状态，如下：\n\n- **绿色** - 服务或目标处于活动并运行状态。\n- **白色**\
  \ - 服务或目标处于非活动（已死亡）。通常是因为服务或目标尚未启用、由于某些原因停止，或者服务或目标所依赖的条件未满足。\n- **红色** - 服务或目标由于致命错误未能启动。\n\
  \n要了解更多关于 `systemd` 单元状态的详细信息，请使用 `systemctl status` 命令后跟单元名称，如下：\n\n```bash\nsystemctl\
  \ status systemd-machine-id-commit.service\n```\n\n```\nsystemd-machine-id-commit.service\
  \ - Commit a transient machine-id on disk\n      Loaded: loaded (/usr/lib/systemd/system/systemd-machine-id-commit.service;\
  \ static)\n      Active: inactive (dead)\n      Condition: start condition failed\
  \ at Thu 2023-03-30 08:41:05 EDT; 16min ago\n               └─ ConditionPathIsMountPoint=/etc/machine-id\
  \ was not met\n```\n\n## 11.4 识别和配置默认目标\n\n可以使用 `systemctl` 命令如下识别 AlmaLinux 9 系统的当前默认目标：\n\
  \n```bash\nsystemctl get-default\n```\nmulti-user.target\n\n在上述情况下，系统配置为默认使用多用户目标启动。可以使用\
  \ `systemctl` 命令配合 `set-default` 选项随时更改默认设置。以下示例将默认目标更改为在下次系统启动时启动图形用户界面：\n\n```bash\n\
  systemctl set-default graphical.target\n```\n\n```\nRemoved /etc/systemd/system/default.target.\n\
  Created symlink /etc/systemd/system/default.target → /usr/lib/systemd/system/graphical.target.\n\
  ```\n\n默认更改的输出显示了 `systemctl` 在后台执行以实施更改的步骤。当前默认是通过通过位于 `/etc/systemd/system` 中的\
  \ `default.target` 文件建立符号链接，指向 `/usr/lib/systemd/system` 中对应的目标文件（在本例中为 `graphical.target`\
  \ 文件）配置的。\n\n## 11.5 理解 systemd 单元和单元类型\n\n如前所述，目标和服务都是 `systemd` 单元的类型。`/usr/lib/systemd/system`\
  \ 文件夹中的所有文件都称为 `systemd` 单元配置文件，每个文件代表一个 `systemd` 单元。每个单元又被归类为特定的单元类型。AlmaLinux\
  \ 9 支持 12 种不同的单元类型，包括本章已涵盖的目标和服务的单元类型。\n\n单元文件的类型由下面的文件名扩展名表示：\n\n| 单元类型 | 文件名扩展名\
  \ | 类型描述 |\n| :--- | :--- | :--- |\n| Service (服务) | .service | 系统服务。 |\n| Target\
  \ (目标) | .target | systemd 单元组。 |\n| Automount (自动挂载) | .automount | 文件系统自动挂载点。\
  \ |\n| Device (设备) | .device | 内内核识别的设备文件。 |\n| Mount (挂载) | .mount | 文件系统挂载点。 |\n\
  | Path (路径) | .path | 文件系统文件或目录。 |\n| Scope (范围) | .scope | 外部创建的进程。 |\n| Slice\
  \ (切片) | .slice | 管理系统进程的分层单元组。 |\n| Snapshot (快照) | .snapshot | systemd 管理器的保存状态。\
  \ |\n| Socket (套接字) | .socket | 进程间通信套接字。 |\n| Swap (交换) | .swap | 交换设备或交换文件。 |\n\
  \n\n\n\n\n| Timer 器 | .timer | Systemd 定时器。 |\n\n表 11-1\n\n注意，目标单元（target unit）与其他类型的不同在于，它包含了一组\
  \ systemd 单元，例如服务或其他目标。\n\n## 11.6 动态更改当前目标\n\n之前介绍的 `systemctl set-default` 命令指定了下次启动系统将使用的目标，但不会更改当前系统的状态。要动态切换到不同的目标，请再次使用\
  \ `systemctl` 命令，使用 `isolate` 选项后跟目标目标。例如，要在不重启的情况下将当前系统切换到图形目标，可以使用以下命令：\n\n```bash\n\
  systemctl isolate graphical.target\n```\n\n执行后，系统将启动图形桌面环境。\n\n## 11.7 启用、禁用和掩蔽\
  \ systemd 单元\n\n新安装的 AlmaLinux 9 系统将包含基础 systemd 服务单元，但不太可能包含系统在进入生产环境后最终需要的所有服务。例如，基础的\
  \ AlmaLinux 9 安装通常不会包含运行 Apache Web 服务器所需的包，而其关键元素之一是 `httpd.service` 单元。\n\n系统管理员将通过以下命令安装必要的\
  \ httpd 包来解决这个问题：\n\n```bash\ndnf install httpd\n```\n\n配置好服务器后，下一个任务是检查 `httpd.service`\
  \ 单元的状态，以识别它是否作为安装过程的一部分被激活：\n\n```bash\nsystemctl status httpd.service\n```\n\n\
  ```\nhttpd.service - The Apache HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
  \ disabled; vendor preset: disabled)\n    Active: inactive (dead)\n      Docs: man:httpd.service(8)\n\
  ```\n\n注意，服务状态可能列为 loaded（已加载）但 inactive（未激活），这种情况发生在供应商首次安装时将其设置为禁用的。要启动未激活的服务，可以使用以下命令：\n\
  \n```bash\nsystemctl start httpd.service\n```\n\n现在检查状态将显示服务处于 active（激活状态）：\n\n\
  ```bash\nsystemctl status httpd.service\n```\n\n```httpd.service - The Apache HTTP\
  \ Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service; disabled; vendor\
  \ preset: disabled)\n    Active: active (running) since Fri 2019-02-15 11:13:26\
  \ EST; 8s ago\n      Docs: man:httpd.service(8)\n    Main PID: 10721 (httpd)\n \
  \   Status: \"Started, listening on: port 80\"\n    Tasks: 213 (limit: 13923)\n\
  \    Memory: 24.1M\n```\n\n在上面的示例输出中，状态显示该服务被禁用了（disabled）。这意味着下次系统重启时，`httpd` 服务将不会自动启动，需要由系统管理员手动启动。\n\
  \n要配置服务在每次系统启动时自动启动，必须按照如下方式将其启用：\n\n```bash\nsystemctl enable httpd.service\n```\n\
  \n一旦服务被启用，状态输出中的 Loaded 部分将如下：\n\n```\nLoaded: loaded (/usr/lib/systemd/system/httpd.service;\
  \ enabled; vendor preset: disabled)\n```\n\n```bash\nsystemctl status httpd.service\n\
  ```\n\n```●httpd.service - The Apache HTTP Server\n    Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
  \ enabled; vendor preset: disabled)\n    Active: active (running) since Thu 2023-03-30\
  \ 09:04:21 EDT; 2min 17s ago\n      Docs: man:httpd.service(8)\n    Main PID: 4500\
  \ (httpd)\n    Status: \"Total requests: 0; Idle/Busy workers 100/0;Requests/sec:\
  \ 0; Bytes served/sec: 0 B/sec\"\n    Tasks: 213 (limit: 22087)\n    Memory: 35.4M\n\
  ```\n\n当前运行的服务可以随时按如下停止：\n\n```bash\nsystemctl stop httpd.service\n```\n\n既然它已经被启用，下次系统重启到当前目标时，`httpd`\
  \ 服务将自动启动。假设，该服务在系统运行多用户目标时被启用，那么 `httpd` 服务将作为另一个依赖项被添加到 `multi-user.target` systemd\
  \ 单元。\n\n在后台，`systemctl` 通过在 `/etc/systemd/system` 文件夹中为目标创建 `.wants` 文件夹的符号链接来向目标添加依赖项。例如，`multi-user.target`\
  \ 单元在 `/etc/systemd/system` 中有一个名为 `multi-user.target.wants` 的文件夹，其中包含指向 `/usr/lib/systemd/system`\
  \ 中其所依赖的所有 systemd 单元的符号链接。检查此文件夹将显示与在本章之前 `systemctl list-dependencies` 命令列出的依赖项之间的关联。\n\
  \n要配置服务使其不再作为目标依赖项自动启动，请按如下方式禁用：\n\n```bash\nsystemctl disable httpd.service\n```\n\
  \n此命令将删除 `.wants` 目录中指向 `httpd.service` 单元文件的符号链接，使其不再成为依赖项，从而在下次系统启动时不会启动。\n\n\
  `.wants` 文件夹包含的依赖项如果不存在不会阻止单元的启动和运行。强制依赖（换句话说，不存在会导致单元失败的依赖项）应该放在 `.requires` 文件夹中（例如\
  \ `multi-user.target.requires`）。\n\n除了启用和禁用，还可以按如下方式掩蔽 systemd 单元：\n\n```bash\n\
  systemctl mask httpd.service\n```\n\n掩蔽的 systemd 单元在任何情况下都无法启用、禁用或启动，即使它被列为另一个单元的依赖项。对于系统而言，就像掩蔽的\
  \ systemd 单元不再存在一样。这对于确保单元无论系统状况如何都不启动非常有用。重新访问服务的唯一方法是取消掩蔽：\n\n```bash\nsystemctl\
  \ unmask httpd.service\n```\n\n## 11.8 在 Cockpit 中处理 systemd 单元\n\n除了本章介绍的命令行技术外，还可以从\
  \ Cockpit Web 界面内部查看和管理 systemd 单元。例如，假设 Cockpit 已经按照“Cockpit Web 界面概述”章节所述进行了安装和设置，可以通过登录\
  \ Cockpit 并选择左侧导航面板中标记为 A 的[图 11-3]中的`Services`选项来访问系统的 systemd 单元列表。\n\n![](img/rhel_cockpit_services1.png)\n\
  \n图 11-3\n\n标记为 B 的选项行在标记为 C 的主区域显示特定类型的单元，每个单元的当前状态列在 State 列中。\n\n从列表中选择一个单元将显示详细信息。例如[图\
  \ 11-4]显示了 `httpd` 实例的详情界面，包括服务日志 (A) 以及用于执行启动、停止、启用/禁用以及掩蔽/取消掩蔽单元任务的开关和菜单 (B)：\n\
  \n![](img/rhel_cockpit_service_details.png)\n\n图 11-4\n\n## 11.9 总结\n\n新安装的 AlmaLinux\
  \ 9 系统包含了一组基础 systemd 单元，其中许多单元在后台运行以提供系统的大部分功能。这些单元按类型分类，最常见的是目标（targets）和服务单元（services）。目标单元是将被共同启动的其他单元组。系统有一个默认目标单元，定义了每次系统启动时要启动的其他单元。最常见的目标是那些将系统引导到多用户或图形模式的目标。此外，`systemctl`\
  \ 命令行工具为执行 systemd 单元配置任务提供了系列选项，其中许多选项也可以通过 Cockpit Web 界面使用。\n\n# 12. AlmaLinux\
  \ 9 网络管理\n\n\n\n\n\n很难想象一个没有任何一个网络连接的 AlmaLinux 9 系统，更难以想象这样一个孤立的系统如何具有多大的实用价值。简单而易的事实是，AlmaLinux\
  \ 9 的设计目的是通过网络和互联网连接提供企业级服务。因此，学习如何管理 AlmaLinux 9 系统的关键部分涉及学习如何配置和管理系统上安装的网络接口。\n\
  \n本章概述了 AlmaLinux 9 上的网络管理，包括 `NetworkManager` 服务、工具以及其他一些实实用程序。\n\n## 12.1 NetworkManager\
  \ 简介\n\n`NetworkManager` 是一项专门设计用于简化 Linux 系统网络配置管理的的服务和工具集，它是 AlmaLinux 9 上的默认网络管理服务。\n\
  \n除了运行在后台的服务外，`NetworkManager` 还包含以下工具：\n\n• `nmcli` - 一个通过命令行与 `NetworkManager`\
  \ 工作的工具。在无法访问图形环境时，该工具非常有用，也可以在脚本中使用进行网络配置更改。\n\n• `nmtui` - 用于管理 `NetworkManager`\
  \ 的基础文本用户界面。该工具可以在任何终端窗口中运行，允许通过菜单选择和输入数据进行更改。虽然它有助于执行基础任务，但 `nmtui` 缺乏 `nmcli`\
  \ 工具提供的许多功能。\n\n• `nm-connection-editor` - 一个完整的图形化管理工具，提供了对大多数 `NetworkManager`\
  \ 配置选项的访问。\n\n• `GNOME Settings` - GNOME 桌面设置应用程序中的网络屏幕允许执行基础网络管理任务。\n\n• `Cockpit\
  \ Network Settings` - Cockpit Web 界面的“网络”屏幕允许执行一系列网络管理任务。\n\n虽然有多种方法可以管理 AlmaLinux\
  \ 9 上的网络环境，但本章将重点介绍 `nmcli` 命令。虽然在访问桌面环境或已启用 Cockpit 时，图形化工具无疑很有帮助，但在只有命令行提示符的情况下，理解命令行界面是至关重要的。此外，图形化工具（包括\
  \ Cockpit）仅包含 `nmcli` 工具的部分功能。最后，一旦你熟悉了 `NetworkManager` 和 `nmcli`，这些技能在这些更直观的工具选项时可以轻松转换。而图形化工具选项则不能如此。例如，如果你只用过\
  \ `nm-connection-editor`，那么使用 `nmcli` 就会变得困难。\n\n## 12.2 安装并启用 NetworkManager\n\n\
  大多数 AlmaLinux 9 默认都会安装了 `NetworkManager`。使用以下命令检查它是否需要安装：\n\n```bash\nrpm -q NetworkManager\n\
  ```\n\nNetworkManager-1.42.2-1.el9.x86_64\n\n如有必要，按照如下方式安装包：\n\n一旦安装了包，就需要启用 `NetworkManager`\
  \ 守护进程以便在每次系统启动时启动：\n\n```bash\nsystemctl enable NetworkManager\n```\n\n最后，启动服务并检查状态以验证启动成功：\n\
  \n```bash\nsystemctl start NetworkManager\nsystemctl status NetworkManager\n```\n\
  \n● `NetworkManager.service` - Network Manager\n      Loaded: loaded (/usr/lib/systemd/system/NetworkManager.service;\
  \ enabled; preset: enabled)\n      Active: active (running) since Thu 2023-08-17\
