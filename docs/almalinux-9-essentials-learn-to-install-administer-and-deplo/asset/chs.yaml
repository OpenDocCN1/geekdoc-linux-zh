  \n\n\n\n```json\n{\n    \"internal\": false,\n    \"dns_enabled\": true,\n    \"\
  ipam_options\": {\n        \"driver\": \"host-local\"\n    }\n}\n```\n\n可以对此文件进行修改，以更改子网地址范围、IPv6\
  \ 支持和网络类型（本例中设置为 bridge）等设置，实现不同的网络配置。\n\n最后，我们可以使用以下命令删除自定义网络：\n\n```bash\npodman\
  \ network rm demonet\n```\n\n## 28.11 在 Cockpit 中管理容器\n\n除了本章概述的命令行工具外，还可以使用 Cockpit\
  \ Web 界面创建和管理 Linux 容器。假设系统已安装并启用了 Cockpit（该主题在 \"Cockpit Web 界面概览\" 中介绍过），请登录 Cockpit\
  \ 并选择 Podman Containers 选项。如果 Cockpit 中没有安装 Podman 模块，请打开终端窗口并运行以下命令：\n\n```bash\n\
  dnf install cockpit-podman\n```\n\n如有必要，点击按钮启动 Podman 服务，此时屏幕应类似于图 28-1：\n\n![](img/almalinux_cockpit_podam_containers.jpg)\n\
  \n图 28-1\n\n第一步是下载一个镜像作为容器的基础（除非已使用命令行工具下载了镜像）。要执行下载，请点击上方图 28-1 中由箭头标记的菜单按钮，并选择\
  \ Download new image（下载新镜像）选项。当搜索对话框出现时，在其中输入关键词。例如图 28-2 显示了搜索 AlmaLinux 9 镜像的结果：\n\
  \n![](img/almalinux_cockpit_container_search.png)\n\n图 28-2\n\n一旦找到镜像，选中它并点击 Download\
  \ 按钮从注册表中拉取。下载完成后，它将出现在镜像列表中，如图 28-3 所示：\n\n![](img/almalinux_cockpit_container_image.png)\n\
  \n图 28-3\n\n要将镜像作为容器运行，点击 Create container（创建容器）按钮并在弹出的对话框中配置容器：\n\n![](img/almalinux_cockpit_create_container.png)\n\
  \n图 28-4\n\n注意，提供的选项允许将主机端口映射到容器端口（例如，当容器托管 Web 服务器时非常有用）、限制分配给容器的内存，并指定用作容器存储的卷。还有一个选项可以指定容器启动时运行的程序。配置完成后，点击\
  \ Create and run（创建并运行）按钮启动容器。\n\n容器运行后，它将出现在 Containers 部分，如下方的图 28-5 所示：\n\n![](img/almalinux_cockpit_container_running.png)\n\
  \n图 28-5\n\n高亮显示的菜单按钮允许执行启动、停止、暂停和保存容器等操作。此外，还可以通过本章较早概述的步骤从命令行访问并管理容器。\n\n## 28.12\
  \ 总结\n\n本章学习了如何使用 `podman`、`skopeo` 和 `buildah` 工具结合 Cockpit Web 界面，在 AlmaLinux\
  \ 9 上创建和管理 Linux 容器，包括使用从仓库获取的容器镜像以及完全从零开始构建的新镜像。\n\n# 29. 设置 AlmaLinux 9 Web 服务器\n\
  \nApache Web 服务器是组成 AlmaLinux 9 操作系统的许多软件包之一。AlmaLinux 9 的可扩展性和韧性使其成为托管即使是流量最大的网站的理想平台。\n\
  \n本章将解释如何使用 Apache 配置 AlmaLinux 9 系统以作为 Web 服务器，包括安全的（HTTPS）和不安全的（HTTP）配置。\n\n##\
  \ 29.1 配置 AlmaLinux 9 Web 服务器的要求\n\n要建立自己的网站，您需要一台计算机（或云服务器实例）、一个操作系统、一个 Web 服务器、一个域名、一个名称服务器以及一个\
  \ IP 地址。\n\n如前所述，AlmaLinux 9 支持 Apache Web 服务器，一旦操作系统开始运行，就可以轻松安装它。此外，可以在任何域名注册服务处注册域名。\n\
  \n如果您在云实例上运行 AlmaLinux 9，提供商分配的 IP 地址将列在服务器概览信息中。但是，如果您托管自己的服务器，并且您的互联网服务提供商（ISP）为您分配了静态\
  \ IP 地址，则你必须将域名与该地址关联。这是通过使用名称服务器实现的，所有域名注册服务都会提供此服务。\n\n如果您没有静态 IP 地址（即您的 ISP 为您提供频繁更改的动态地址），可以使用几种免费的动态\
  \ DNS（简称为 DDNS 或 DynDNS）服务之一，将您的动态 IP 地址映射到您的域名。\n\n一旦配置了域名和名称服务器，下一步是安装和配置您的 Web\
  \ 服务器。\n\n## 29.2 安装 Apache Web 服务器软件包\n\nAlmaLinux 的当前版本通常不会默认安装 Apache Web 服务器。要检查服务器是否已经安装，请运行以下命令：\n\
  \n```bash\nrpm -q httpd\n```\n\n如果 `rpm` 生成了类似下面的输出，则说明 Apache 服务器已安装：\n\n`httpd-2.4.57-2.el9.x86_64`\n\
  \n或者，如果 `rpm` 生成了“package httpd is not installed”的消息，下一步是安装它。要安装 Apache，请在命令提示符运行以下命令：\n\
  \n```bash\ndnf install httpd\n```\n\n## 29.3 配置防火墙\n\n在启动和测试 Apache Web 服务器之前，必须修改防火墙以允许\
  \ Web 服务器与外部世界通信。默认情况下，HTTP 和 HTTPS 协议分别使用端口 80 和 443，因此根据所使用的协议，需要打开其中一个或两个端口。在打开端口时，务必指定适用于面向互联网的网络连接的防火墙区域：\n\
  \n```bash\nfirewall-cmd --permanent --zone=<zone> --add-port=80/tcp\nfirewall-cmd\
  \ --permanent --zone=<zone> --add-port=443/tcp\n```\n\n打开端口后，务必重载防火墙：\n\n```bash\n\
  firewall-cmd --reload\n```\n\n在云托管服务器上，可能还需要在云控制台中为服务器实例启用相应的端口。请检查云提供商的文档以执行此操作的步骤。\n\
  \n## 29.4 端口转发\n\n假设托管 Web 服务器的 AlmaLinux 9 系统位于受防火墙保护的网络（另一台运行防火墙、路由器或包含内置防火墙保护的无线基站计算机）。在这种情况下，您必须配置防火墙将端口\
  \ 80 和 443 转发到您的 Web 服务器系统。执行此操作的机制在不同的防火墙和设备之间不同，请检查您的文档以了解如何配置端口转发。\n\n## 29.5\
  \ 启动 Apache Web 服务器\n\n一旦安装 Apache 服务器并配置了防火墙，下一步是验证服务器正在运行，并在必要时启动它。\n\n要从命令行检查\
  \ Apache 服务的状态，请在命令提示符输入以下：\n\n```bash\nsystemctl status httpd\n```\n\n如果上述命令指示服务未运行，可以通过以下方式从命令行启动它：\n\
  \n```bash\nsystemctl start httpd\n```\n\n如果您希望 Apache httpd 服务在系统启动时自动启动，请运行以下命令：\n\
  \n```bash\nsystemctl enable httpd\n```\n\n## 29.6 测试 Web 服务器\n\n安装完成后，下一步是验证 Web\
  \ 服务器正在运行。\n\n\n\n\n\n如果你可以（本地或远程）访问服务器的桌面环境，请启动网络浏览器并在地址栏中输入 `http://127.0.0.1`（`127.0.0.1`\
  \ 是回环网络地址，告诉系统连接到本地机器）。如果一切设置正确，浏览器应该加载如图 29-1 所示的测试页面：\n\n![](img/almalinix_apache_test_page.png)\n\
  \n图 29-1\n\n如果无法使用桌面环境，请从服务器所在本地局域网中的另一个系统进行连接，或者如果是远程托管的，请使用分配给该系统的外部 IP 地址。\n\n\
  ## 29.7 为您的域名配置 Apache Web 服务器\n\n设置 Web 服务器的下一步是为您的域名进行配置。要配置 Web 服务器，首先切换目录到 `/etc/httpd`，该目录包含若干文件和子目录。\n\
  \n## 29.8 安全网站的基础\n\n本章创建的 Web 服务器和网站使用 80 端口的 HTTP 协议，因此被认为是不安全的。问题在于 Web 服务器与客户端（通常是用户的\
  \ 浏览器）之间的流量是以明文传输的。换句话说，数据未经过加密且容易被截获。虽然这对于一般的网页浏览不是问题，但在执行登录网站或传输身份标识或信用卡详情等敏感信息任务时，这是一个严重的弱点。\n\
  \n如今，网站被要求使用 HTTPS，它使用安全套接层 (SSL) 或传输层安全协议 (TLS) 在 Web 服务器和客户端之间建立安全的加密通信。这种安全性是通过公共加密、私有加密、会话加密以及证书的使用建立的。\n\
  \n为了支持 HTTPS，网站必须拥有由受信任权威（证书颁发机构 CA）颁发的证书。当浏览器连接到安全网站时，Web 服务器会返回网站 SSL 证书副本，该证书还包含站点的公钥副本。随后，浏览器将向信任的证书权威验证证书的真实性。\n\
  \n如果证书有效，浏览器将使用服务器发送的公钥加密会话密钥并将其传递给服务器。服务器使用私钥解密会话密钥，向浏览器发送加密确认。一旦完成此过程，浏览器和服务器将使用会话密钥加密后续的所有数据传输，直到话结束。\n\
  \n## 29.9 为 Apache 配置 HTTPS\n\n默认情况下，Apache 服务器不包含实现安全 HTTPS 网站所需的模块。因此，第一步按照如下方式在服务器系统中安装\
  \ Apache `mod_ssl` 模块：\n\n```bash\ndnf install mod_ssl\n```\n\n安装完成后重启以将新模块加载到 Apache\
  \ 服务器：\n\n```bash\nsystemctl restart httpd\n```\n\n使用以下命令检查模块是否已加载到服务器：\n\n```bash\n\
  httpd -M | grep ssl_module\n```\n\n`ssl_module (shared)`\n\n假设模块已安装，下一步是为网站生成 SSL\
  \ 证书。\n\n## 29.10 获取 SSL 证书\n\n网站证书必须从证书颁发机构获取。有多种价格范围的选择。然而，目前最好的选项是从以下 URL 从 Let’s\
  \ Encrypt 获取免费证书：\n\n[`letsencrypt.org/`](https://letsencrypt.org/)\n\n从 Let’s Encrypt\
  \ 获取证书涉及安装和运行 `Certbot` 工具。该工具将扫描服务器上的 Apache 配置文件，并提供为系统上配置的任何虚拟主机生成证书的选项。它将生成证书并为相应的网站在\
  \ Apache 配置中添加虚拟主机项。\n\n按照 Let’s Encrypt 网站上的步骤在您的 AlmaLinux 9 系统上下载并安装 Certbot，然后按照如下方式运行\
  \ `certbot` 工具以生成并安装证书：\n\n```bash\ncertbot --apache\n```\n\n在请求电子邮件地址并寻求服务条款后，`Certbot`\
  \ 将列出在 `httpd.conf` 文件中找到域名，并允许选择一个或多个要安装证书的站点。`Certbot` 然后在系统中获取并安装证书之前将执行一些检查：\n\
  \n您想为哪些名称激活 HTTPS？\n\n- - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - -\n\n1: www.myexample.com\n\n- - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - -\n\n选择用逗号和/或空格分隔的数字，或留空输入以选择显示的所有选项（输入‘c’取消）：1\n\
  \n正在获取新证书\n\n正在执行以下挑战：\n\nhttp-01 challenge for www.myexample.com\n\n等待验证...\n\n\
  清理挑战\n\n已在 `/etc/httpd/conf/httpd-le-ssl.conf` 创建 SSL vhost\n\n正在将证书部署到虚拟 Host `/etc/httpd/conf/httpd-le-ssl.conf`\n\
  \n通过向根配置中添加 Include 来启用站点 `/etc/httpd/conf/httpd-le-ssl.conf`\n\n`Certbot` 还将在 `/etc/httpd/conf/`\
  \ 目录下创建一个名为 `httpd-le-ssl.conf` 的新文件，其中包含每个已生成证书域名的安全虚拟主机项。这些项将类似于所示：\n\n```apache\n\
  <IfModule mod_ssl.c>\n<VirtualHost *:443>\n    ServerAdmin feedback@myexample.com\n\
  \    ServerName www.myexample.com\n    DocumentRoot /var/www/myexample\n    ErrorLog\
  \ logs/myexample_error_log\n    CustomLog logs/myexample_access_log combined\nSSLCertificateFile\
  \ /etc/letsencrypt/live/www.myexample.com/fullchain.pem\nSSLCertificateKeyFile /etc/letsencrypt/live/www.myexample.com/privkey.pem\n\
  Include /etc/letsencrypt/options-ssl-apache.conf\n</VirtualHost>\n</IfModule>\n\
  ```\n\n最后，`Certbot` 将询问服务器是否应将未来的 HTTP Web 请求重定向到 HTTPS。换句话说，如果用户尝试访问 `http://www.myexample.com`，Web\
  \ 服务器将用户重定向到 `https://www.myexample.com`：\n\n请选择是否将 HTTP 流量重定向到 HTTPS 并移除 HTTP 访问。\n\
  \n- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\n\
  \n1: 不重定向 - 对 Web 服务器配置不做任何更改。\n\n2: 重定向 - 将所有请求重定向到安全的 HTTPS。新站点选择此项，或者如果您确定您的网站在\
  \ HTTPS 上正常工作。您可以通过编辑 Web 服务器的配置来撤销此更改。\n\n- - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - -\n\n选择合适的数字 [1-2] 然后按 [enter]（按‘c’取消）：2\n\
  \n如果您目前正在测试 HTTPS 配置并希望保持 HTTP 版本运行到稍后，请选择“不重定向”选项。否则，通常建议重定向到 HTTPS。\n\n一旦安装证书，请在浏览器中使用以下\
  \ URL 进行测试（将 `myexample.com` 替换为自己的域名）：\n\n[`www.ssllabs.com/ssltest/analyze.html?d=www.myexample.com`](https://www.ssllabs.com/ssltest/analyze.html?d=www.myexample.com)\n\
  \n如果证书配置成功，SSL Labs 报告将提供高评分，如图 29-2 所示：\n\n![](img/rhel_8_ssl_labs_report.png)\n\
  \n图 29-2\n\n最后测试，打开浏览器窗口并使用 `https://` 前缀导航到您的域名。页面应像以前一样加载，浏览器应指示浏览器与服务器之间的连接是安全的（通常由地址栏中的锁图标指示，点击它可以查看更多信息）：\n\
  \n![](img/ubuntu_secure_site.png)\n\n图 29-3\n\n# 29.11 \n\n\n\n\n一个 AlmaLinux 9\
  \ 系统可以通过安装 Apache Web 服务器来托管网站。在 AlmaLinux 9 上可以部署不安全的 (HTTP) 和安全的 (HTTPS) 网站。安全网站使用安全套接层\
  \ (SSL) 或传输层安全 (TLS) 通过公共、私有和会话加密在 Web 服务器与客户端之间建立加密通信，并配合受信任证书颁发机构（CA）颁发的证书。\n\n\
  # 30. 配置 AlmaLinux 9 Postfix 电子邮件服务器\n\n除了作为 Web 服务器，电子邮件是 AlmaLinux 9 系统的主要用途之一，特别是在业务环境中。鉴于电子邮件的重要性和普及，某些人发现\
  \ Linux 系统上的电子邮件结构如此复杂时会感到很惊讶。这种复杂性往往会让 AlmaLinux 9 的初学者感到无从。。\n\n好消息是，大部分复杂性是为了让经验丰富的电子邮件管理员为大型企业级安装实施复杂的配置。然而，对于大多数\
  \ Linux 管理员来说，建立一个基础电子邮件系统相对简单，让用户能够发送和接收电子邮件。\n\n《AlmaLinux 9 基础》的这一章将解释 Linux\
  \ 电子邮件配置的基础知识，并逐步介绍配置基础电子邮件环境步骤。为了提供核心内容，我们将电子邮件系统的复杂性留给关于该主题的高级书籍。\n\n## 30.1 电子邮件系统的结构\n\
  \n完整的电子邮件系统由几个组件组成。以下是每个组件的简单描述：\n\n### 30.1.1 邮件用户代理 (MUA)\n\n典型用户可能对系统的这部分最为熟悉。邮件用户代理\
  \ (MUA)，或邮件客户端是用于编写、发送和读取电子邮件消息的应用程序。任何在任何计算机上编写和发送过消息的人都使用过某种类型的邮件用户代理。\n\nLinux\
  \ 上典型的图形化 MUA 有 Evolution、Thunderbird 和 KMail。对于那些偏好基于的邮件客户端的用户，还有更传统的 Pine 和 mail\
  \ 工具。\n\n### 30.1.2 邮件传输代理 (MTA)\n\n邮件传输代理 (MTA) 是电子邮件系统中将电子邮件消息从一台计算机传输到另一台计算机的部分（在本地局域网内或通过互联网传输到远程系统）。一旦配置正确，大多数用户只有在希望重新配置时才会直接与所选择的\
  \ MTA 交互。Linux 有许多 MTA 可选，包括 Sendmail、Postfix、Fetchmail、Qmail 和 Exim。\n\n### 30.1.3\
  \ 邮件投递代理 (MDA)\n\n基础设施的另一个通常对用户隐藏的部分——邮件投递代理 (MDA)，在后台运行，并在邮件传输代理 (MTA) 和邮件客户端 (MUA)\
  \ 之间对电子邮件消息进行过滤。MDA 最常见的形式是垃圾邮件过滤器，在到达用户邮件客户端 (MUA) 的收件箱之前从系统中删除所有不需要的电子邮件消息。流行的\
  \ MDA 有 Spamassassin 和 Procmail。需要注意的是，某些邮件用户代理应用程序（如 Evolution、Thunderbird 和 KMail）包含了了自己的\
  \ MDA 过滤。而其他（如 Pine 和 Basla）则没有。这可能是 Linux 初学者的困惑来源。\n\n### 30.1.4 SMTP\n\nSMTP\
  \ 是简单邮件传输协议（Simple Mail Transport Protocol）的缩写。电子邮件系统使用此协议将邮件消息从一个服务器传输到另一个服务器。该协议是\
  \ MTA 用于通信以及往返传输消息的语言。\n\n### 30.1.5 SMTP 中继 (SMTP Relay)\n\nSMTP 中继是一种允许外部 SMTP\
  \ 服务器发送电子邮件而不是托管本地 SMTP 服务器的协议。这通常涉及使用诸如 Mailjet、SendGrid 或 MailGun 等服务。这些服务避免了配置和维护自己的\
  \ SMTP 服务器，并通常提供分析等额外益处。\n\n## 30.2 配置 AlmaLinux 9 电子邮件服务器\n\n许多系统使用 Sendmail MTA\
  \ 来传输电子邮件消息；在许多 Linux 发行版中，这是默认的邮件传输代理。遗憾的是，Sendmail 是一个复杂的系统，对于初学者和经验丰富的用户都难以理解和配置。因为它被认为处理电子邮件消息的速度比许多较新的\
  \ MTA 慢，它正逐渐失去青。\n\n许多系统管理员现在使用 Postfix 或 Qmail 来处理电子邮件。两者都比 Sendmail 更快且更容易配置。\n\
  \n因此，本章我们将 Postfix 视为一种 MTA，因为它简单且流行。然而，如果你更倾向于使用 Sendmail，有很多专门研究该主题的书籍会比我们在本章中讲解得透彻。\n\
  \n作为第一步，本章将涵盖配置 AlmaLinux 9 系统作为完整电子邮件服务器的步骤。在章节后半部分，还将涵盖使用 SMTP 中继服务的步骤。\n\n##\
  \ 30.3 Postfix 安装前的步骤\n\n在安装 Postfix 之前的第一步是确保 Sendmail 没有在你的系统上运行。你可以使用以下命令检查此项：\n\
  \n```bash\nsystemctl status sendmail\n```\n\n如果未安装 sendmail，该工具将显示类似下面的消息：\n\n```\n\
  Unit sendmail.service could not be found.\n```\n\n如果 sendmail 在你的系统上运行，则在安装和配置 Postfix\
  \ 之前有必要停止它。要停止 sendmail，运行以下命令：\n\n```bash\nsystemctl stop sendmail\n```\n\n下一步是确保\
  \ sendmail 在系统重启时不会自动重启：\n\n```bash\nsystemctl disable sendmail\n```\n\n现在 Sendmail\
  \ 已关闭，并配置为在系统启动时不自动启动。可选情况下，要从系统中完全删除 sendmail，运行以下命令：\n\n```bash\ndnf remove sendmail\n\
  ```\n\n## 30.4 防火墙/路由器配置\n\n由于发送和接收电子邮件消息涉及网络连接，必须配置防火墙以允许 SMTP 流量。如果 firewalld\
  \ 已激活，请使用 `firewall-cmd` 工具：\n\n```bash\nfirewall-cmd --permanent --add-service=smtp\n\
  ```\n\n配置，服务器与互联网之间的任何防火墙或路由器以允许连接也是必需的，并在必要时配置这些端口转发到电子邮件服务器相应的端口。\n\n完成这些初始步骤后，我们现在可以安装\
  \ Postfix。\n\n## 30.5 在 AlmaLinux 9 上安装 Postfix\n\n默认情况下，AlmaLinux 9 安装过程为大多数配置安装了\
  \ postfix。要验证 postfix 是否安装，使用以下 `rpm` 命令：\n\n```bash\nrpm -q postfix\n```\n\n如果\
  \ `rpm` 报告未安装 postfix，可以通过以下方式安装：\n\n```bash\ndnf install postfix\n```\n\n该工具将下载并安装\
  \ postfix，并在 `/etc/passwd` 文件中配置特殊的 postfix 用户。\n\n## 30.6 配置 Postfix\n\npostfix\
  \ 主配置位于 `/etc/postfix/main.cf` 文件。互联网上的许多资源提供了 postfix 的详细信息，因此本节将重点关注让电子邮件运行的基础选项。尽管\
  \ `dnf` 安装设置了一些基础配置选项，但它往往会漏掉某些设置并对其他设置进行错误的猜测，因此仔细检查 `main.cf` 文件。\n\n`main.cf`\
  \ 文件中的关键选项如下：\n\n```\nmyhostname = mta1.domain.com\nmydomain = domain.com\nmyorigin\
  \ = $mydomain\nmydestination = $myhostname, localhost.$mydomain, localhost, $mydomain\n\
  inet_interfaces = $myhostname\nmynetworks = subnet\n```\n\n其他设置要么已由安装过程为你设置，或者只有在你尝试冒险并想要配置更复杂的电子邮件系统时才需要。\n\
  \n`myhostname` 的格式格式为 `host.domain.extension`。例如，如果你的 Linux 系统名为 MyLinuxHost 且你的互联网域名是\
  \ MyDomain.com，你应该如下设置 `myhostname` 选项：\n\n```\nmyhostname = mylinuxhost.mydomain.com\n\
  ```\n\n`mydomain` 设置仅仅是上述设置的域名部分。例如：\n\n\n\n\n\n`mydomain = mydomain.com`\n\n`myorigin`\
  \ 设置定义了邮件在收件人收件箱中时显示的发件人域名名称，它应该被设置为您的域名：\n\n`myorigin = $mydomain`\n\n最重要的参数之一\
  \ `mydestination` 与入站邮件有关，它声明了该服务器作为其最终投递目的地的域名。任何发送至列表中不在此列表的域名的入站邮件都将被视为中继中继请求（relay\
  \ request），在受限于 `mynet` 设置（下文介绍）的情况下，这通常会导致投递失败。\n\n`inet_interfaces` 设置定义了系统中允许\
  \ `postfix` 接收邮件的网络接口，通常被设置为 `all`：\n\n`inet_interfaces = all`\n\n`mynet` 设置定义了哪些外部系统被信任可以使用该服务器作为\
  \ SMTP 中继器。该设置的可能取值如下：\n\n- `host`: 仅信任本地系统。所有外部客户端尝试使用该服务器作为中继的尝试都将被拒绝。\n- `subnet`:\
  \ 只有同一网络子网上的系统可以使用该服务器作为中继。例如，如果服务器的 IP 地址为 `192.168.1.29`，则 IP 地址为 `192.168.1.30`\
  \ 的客户端系统可以使用该服务器作为中继。\n- `class`: 同一 IP 地址类（A、B 和 C）内的任何系统可以使用该服务器作为中继。\n\n信任的 IP\
  \ 地址可以通过指定子网、地址范围或引用模式文件手动定义。以下示例将本地主机和子网 `192.168.0.0` 声明为信任 IP 地址：\n\n`mynetworks\
  \ = 192.168.0.0/24, 127.0.0.0/8`\n\n对于此示例，将属性设置为 `subnet`，这样与服务器同一本地网络上的任何其他系统都可以通过\
  \ SMTP 中继发送邮件。相比之下，外部系统被阻止执行操作：\n\n`mynetworks = subnet`\n\n## 30.7 配置 DNS MX 记录\n\
  \n当您在注册商处注册并配置域名时，DNS 设置中将已经配置了几个默认值。其中之一就是所谓的邮件交换器（MX）记录。该记录定义了发送至您的域名的邮件应该发送到何处，通常默认设置为您的注册商提供的邮件服务器。如果您自己托管自己的邮件服务器，则\
  \ MX 记录应设置为您的域名或邮件服务器的 IP 地址。进行此更改的步骤取决于您的域名注册商，但通常涉及编辑域名的 DNS 信息，并添加或编辑现有的 MX 记录，使其指向您的邮件服务器。\n\
  \n## 30.8 在 AlmaLinux 9 系统上启动 Postfix\n\n一旦在 `/etc/postfix/main.cf` 文件中配置了正确的设置，现在是启动\
  \ `postfix` 的时候了。可以通过以下命令行实现这一点：\n\n```bash\nsystemctl start postfix\n```\n\n如果\
  \ `postfix` 已经在运行，请确保使用以下命令加载配置更改：\n\n```bash\nsystemctl reload postfix\n```\n\n\
  要配置 `postfix` 在系统启动时自动启动，请运行以下命令：\n\n```bash\nsystemctl enable postfix\n```\n\n\
  `postfix` 进程现在应该会启动。验证一切运行正常的良好方法是检查您的邮件日志。这通常在 `/var/log/maillog` 文件中，现在应该包含一条类似于以下输出的条目：\n\
  \n```\nMar 25 11:21:48 demo-server postfix/postfix-script[5377]: starting the Postfix\
  \ mail system\nMar 25 11:21:48 demo-server postfix/master[5379]: daemon started\
  \ -- version 3.3.1, configuration /etc/postfix\n```\n\n只要没有记录错误信息，您就成功安装并启动了 `postfix`，并准备好测试\
  \ `postfix` 配置。\n\n## 30.9 测试 Postfix\n\n测试 `postfix` 配置的一种简便方法是在系统的本地用户之间发送电子邮件消息。要进行快速测试，请如下所示使用\
  \ `mail` 工具（其中 `name` 和 `mydomain` 分别替换为系统上的用户名和您的域名）：\n\n```bash\nmail name@mydomain.com\n\
  ```\n\n在收到提示时，为邮件消息输入主题，然后输入邮件正文。要发送邮件，按下 `Ctrl-D`。例如：\n\n```bash\nmail demo@mydomain.com\n\
  ```\n\nSubject: Test email message\n\n这是一条测试消息。\n\nEOT\n```\n\n再次运行 `mail` 命令，这次使用另一个用户身份，并验证消息是否已发送并接收：\n\
  \n```bash\nmail\nHeirloom Mail version 12.5 7/5/10\\. Type ? for help.\n\"/var/spool/mail/demo\"\
  : 1 message 1 new\n>N 1 root Mon Mar 25 13:36 18/625 \"Test email message\"\n&\n\
  ```\n\n如果消息没有出现，请检查日志文件（/var/log/maillog`）是否有错误。成功的邮件投递将如下所示出现在日志文件中：\n\n```\nMar\
  \ 25 13:41:37 demo-server postfix/pickup[7153]: 94FAF61E8F4A: uid=0 from=<root>\n\
  Mar 25 13:41:37 demo-server postfix/cleanup[7498]: 94FAF61E8F4A: message-id=<20190325174137.94FAF61E8F4A@demo-server.mydomain.com>\n\
  Mar 25 13:41:37 demo-server postfix/qmgr[7154]: 94FAF61E8F4A: from=<root@mydomain.com>,\
  \ size=450, nrcpt=1 (queue active)\nMar 25 13:41:37 demo-server postfix/local[7500]:\
  \ 94FAF61E8F4A: to=<neil@mydomain.com>, relay=local, delay=0.12, delays=0.09/0.01/0/0.02,\
  \ dsn=2.0.0, status=sent (delivered to mailbox)\nMar 25 13:41:37 demo-server postfix/qmgr[7154]:\
  \ 94FAF61E8F4A: \n```\n\n## 30.10 通过 SMTP 中继服务器发送邮件\n\nSMTP 中继服务是配置邮件服务器处理发送邮件的另一种方案。如前所述，有许多服务可用，大多数可以通过搜索“SMTP\
  \ Relay”找到。本部分假设 `postfix` 已安装在您的系统上，并且已完成所选 SMTP 中继的所有初始步骤。\n\n首先编辑 `/etc/postfix/main.cf`\
  \ 文件，并使用域名配置 `myhostname` 参数：\n\n`myhostname = mydomain.com`\n\n接下来，在 `/etc/postfix`\
  \ 创建名为 `sasl_passwd` 的新文件，并添加包含中继服务提供的邮件主机、用户名和密码的行。例如：\n\n`[smtp.myprovider.com]:587\
  \ neil@mydomain.com:mpassword`\n\n注意上述条目也指定了端口 `587`。如果没有此设置，`postfix` 将默认使用端口 `25`。\n\
  \n创建密码文件后，使用 `postmap` 工具生成包含邮件凭据的哈希数据库：\n\n```bash\npostmap /etc/postfix/sasl_passwd\n\
  ```\n\n在继续之前，采取额外步骤保护您的 `postfix` 凭据：\n\n```bash\nchown root:root /etc/postfix/sasl_passwd\
  \ /etc/postfix/sasl_passwd.db\nchmod 0600 /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db\n\
  ```\n\n再次编辑 `main.cf` 文件并添加条目以指定中继服务器：\n\n`relayhost = [smtp.myprovider.com]:587`\n\
  \n在 `main.cf` 文件中，添加以下行以配置 SMTP 服务器的验证设置：\n\n`smtp_use_tls = yes`\n`smtp_sasl_auth_enable\
  \ = yes`\n`smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd`\n`smtp_tls_CAfile\
  \ = /etc/ssl/certs/ca-bundle.crt`\n`smtp_sasl_security_options = noanonymous`\n\
  `smtp_sasl_tls_security_options = noanonymous`\n\n最后，重启 `postfix` 服务：\n\n```bash\n\
  systemctl restart postfix\n```\n\n服务重启后，尝试使用 `mail` 工具或您偏好的邮件客户端尝试发送和接收邮件。\n\n\n\
  \n\n\n一个完整的端到端邮件系统由邮件用户代理 (MUA)、邮件传输代理 (MTA)、邮件投递代理 (MDA) 和 SMTP 协议组成。AlmaLinux\
  \ 9 为 MTA 解决方案提供了多种选择，其中最流行的是 `Postfix`。本章概述了如何在 AlmaLinux 9 系统上安装、配置和测试 `postfix`，使其作为邮件服务器，并使用第三方\
  \ SMTP 中继服务器发送和接收邮件。\n\n# 31. 为 AlmaLinux 9 系统添加新硬盘驱动器\n\n用户和系统管理员遇到的第一个问题之一是系统需要更多的磁盘空间来存储数据。幸运的是，磁盘空间现在是最廉价的\
  \ IT 基础商品之一。在本章和下一章中，我们将介绍如何配置 AlmaLinux 9 以使用安装新物理或虚拟硬盘驱动器时提供的空间。\n\n## 31.1 挂载的文件系统或逻辑卷\n\
  \n在 AlmaLinux 9 系统上配置新硬盘驱动器有两种方法。一种直接的方法是在新驱动器上创建一个或多个 Linux 分区，在这些分区上创建 Linux 文件系统，然后将它们挂载到特定的挂载点以进行访问。这种方法将在本章中介绍。\n\
  \n另一种方法是向现有卷组添加新空间或创建一个新卷组。安装 AlmaLinux 9 时，会创建一个名为 `almalinux` 的卷组。该卷组内有三个名为 `root`、`home`\
  \ 和 `swap` 的逻辑卷，分别用于存储 `/` 和 `/home` 文件系统以及交换分区。我们可以通过将新磁盘配置为卷组的一部分来增加现有逻辑卷的可用磁盘空间。例如，使用这种方法，我们可以通过将新磁盘的部分或全部空间分配给\
  \ home 卷来增加 `/home` 文件系统的大小。此主题将在向 AlmaLinux 9 卷组和逻辑卷添加新硬盘 中进行详细讨论。\n\n## 31.2 查找新硬盘\n\
  \n本教程假设已经安装了一个新的物理或虚拟硬盘，并且操作系统可见可见。一旦添加，操作系统应该自动检测到新驱动器。通常，系统中的硬盘驱动器被分配为以 `hd`、`sd`\
  \ 或 `nvme` 开头的设备名称，后跟一个字母来指示设备号。第一个设备可能是 `/dev/sda????`，第二个是 `/dev/sdb`，以此类推。\n\n\
  以下是一个仅连接到 SATA 控制器的典型系统的输出：\n\n```bash\nls /dev/sd*\n```\n\n```\n/dev/sda /dev/sda1\
  \ /dev/sda2\n```\n\n这显示由 `/dev/sda` 表示的硬盘驱动器被分为两个分区，分别由 `/dev/sda1` 和 `/dev/sda2`\
  \ 表示。\n\n以下是安装第二个硬盘驱动器后同一系统的输出：\n\n```bash\nls /dev/sd*\n```\n\n```\n/dev/sda /dev/sda1\
  \ /dev/sda2 /dev/sdb\n```\n\n新硬盘已分配到设备文件 `/dev/sdb`。该驱动器没有显示任何分区（因为我们尚未创建任何分区）。\n\
  \n或者，带有 NVMe 控制器的系统上的存储设备可能命名如下所示：\n\n```bash\nls /dev/nvme*\n```\n\n```\n/dev/nvme0\
  \ /dev/nvme0n1 /dev/nvme001p1 /dev/nvme0n1p2 /dev/nvme0n1p3\n```\n\nLinux 系统上的 NVMe\
  \ 设备使用以下命名规范：\n\n`/dev/nvme<device number>n<namespace>p<partition number>`\n\n设备号由\
  \ Linux 在系统启动时根据检测到设备的顺序分配（`0` 表示第一个检测到的设备）。命名空间由 NVMe 控制器分配，代表连接到控制器的存储设备上的逻辑块地址\
  \ (LBA) 集合。在大多数情况下，NVMe 存储设备将包含单个命名空间。例如，第一个检测到的控制器将具有命名空间 1，第二个命名空间 2，以此类推。\n\n\
  每个命名空间进一步划分为一个或多个分区，从分区 1 开始。可以使用 `nvme` 命令管理和检查 NVMe 设备。例如，以下命令列出了所有检测到的 NVMe 设备：\n\
  \n```bash\nnvme list\n```\n\n```\nNode Generic SN Model Namespace Usage\n---- -------\
  \ -- ----- --------- ----------------------\n/dev/nvme0n1 /dev/ng0n1 SG21235 SAMSUNG\
  \ 1 21.47 GB / 21.47 GB\n```\n\n可以使用以下命令列出有关特定设备的更详细信息：\n\n```bash\nnvme id-ctrl\
  \ -H /dev/nvme0\n```\n\n```\nNVME Identify Controller:\nvid : 0x15ad\nssvid : 0x15ad\n\
  sn : VMware NVME_0000\nmn : VMware Virtual NVMe Disk\nfr : 1.3\nrab : 0\nieee :\
  \ 565000\ncmic : 0\n  [3:3] : 0 ANA not supported\n  [2:2] : 0 PCI\n  [1:1] : 0\
  \ Single Controller\n  [0:0] : 0 Single Port\nmdts : 8\n```\n\n以下是安装第二个 NVMe 存储设备后同一系统的输出：\n\
  \n```bash\nls /dev/nvme*\n```\n\n```\n/dev/nvme0 /dev/nvme0n1 /dev/nvme0n1p1 /dev/nvme0n1p2\
  \ /dev/nvme0n1p3\n/dev/nvme0n2\n```\n\n此时，我们可以在新驱动器上创建分区和文件系统并挂载它们以便访问，或者将磁盘作为物理卷作为卷组的一部分。要执行前者，请继续本章；否则，请阅读向\
  \ AlmaLinux 9 卷组和逻辑卷添加新硬盘 以了解配置逻辑卷的详情。\n\n## 31.3 创建 Linux 分区\n\n下一步是在新硬盘驱动器上创建一个或多个\
  \ Linux 分区。这是通过使用 `fdisk` 工具实现的，它接受要分区的设备作为命令行参数。\n\n```bash\nfdisk /dev/nvme0n2\n\
  ```\n\n```\nWelcome to fdisk (util-linux 2.37.4).\nChanges will remain in memory\
  \ only, until you decide to write them.\nBe careful before using the write command.\n\
  Device does not contain a recognized partition table.\nCreated a new DOS disklabel\
  \ with disk identifier 0x1010c62c.\nCommand (m for help):\nTo view the current partitions\
  \ on the disk, enter the p command:\nCommand (m for help): p\nDisk /dev/nvme0n2:\
  \ 20 GiB, 21474836480 bytes, 41943040 sectors\nDisk model: VMware Virtual NVMe Disk\n\
  Units: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes\
  \ / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type:\
  \ dos\nDisk identifier: 0x1010c62c\n```\n\n从上面的 fdisk 输出中可以看出，磁盘目前没有分区，因为它之前未被使用。下一步是在磁盘上创建一个新分区，通过输入\
  \ `n`（新建分区）和 `p`（主分区）完成此任务：\n\n```\nCommand (m for help): n\nPartition type\n  \
  \  p primary (0 primary, 0 extended, 4 free)\n    e extended (container for logical\
  \ partitions)\nSelect (default p): p\nPartition number (1-4, default 1):\n```\n\n\
  在这个示例中，我们只计划创建一个分区，这将是分区 1。接下来，我们需要指定分区的起始和结束位置。由于这是第一个分区，我们需要它从第一个可用扇区开始，由于我们想使用整个磁盘，我们将最后一个扇区指定为结束。注意，如果您想创建多个分区，可以按扇区、字节、千字节或兆字节来指定每个分区的大小：\n\
  \n```\nFirst sector (2048-41943039, default 2048):\nLast sector, %+sectors or +/-size{K,M,G,T,P}\
  \ (2048-41943039, default 41943039):\nCreated a new partition 1 of type 'Linux'\
  \ and of size 20 GiB.\nCommand (m for help):\n```\n\n现在我们已经指定了分区，需要使用 `w` 命令将其写入磁盘：\n\
  \n```\nCommand (m for help): w\nThe partition table has been altered.\nCalling ioctl()\
  \ to re-read partition table.\nSyncing disks.\n```\n\n如果我们再次查看设备，将看到新分区显示为 `/dev/nvme0n2p1`：\n\
  \n```bash\nls /dev/nvme*\n```\n\n```\n/dev/nvme0 /dev/nvme0n1 /dev/nvme0n1p1 /dev/nvme0n1p2\
  \ /dev/nvme0n1p3\n/dev/nvme0n2 /dev/nvme0n2p1\n```\n\n下一步是在我们的新分区上创建文件系统。\n\n\n\n\
  \n我们现在安装了一个新磁盘，它在 `AlmaLinux 9` 中可见，并且我们已经在该磁盘上配置了一个 Linux 分区。下一步是在该分区上创建一个 Linux\
  \ 文件系统，以便操作系统可以使用它来存储文件和数据。在分区上创建文件系统最简单的方法是使用 `mkfs.xfs` 实用：\n\n# mkfs.xfs -f /dev/nvme0n2p1\n\
  \n```\nmeta-data=/dev/nvme0n2p1 isize=512 agcount=4, agsize=1310656 blks\n     \
  \   = sectsz=512 attr=2, projid32bit=1\n        = crc=1 finobt=1, sparse=1, rmapbt=0\n\
  \        = reflink=1 bigtime=1 inobtcount=1\ndata = bsize=4096 blocks=5242624, imaxpct=25\n\
  \        = sunit=0 swidth=0 blks\nnaming =version 2 bsize=4096 ascii-ci=0, ftype=1\n\
  log =internal log bsize=4096 blocks=2560, version=2\n        = sectsz=512 sunit=0\
  \ blks, lazy-count=1\nrealtime =none extsz=4096 blocks=0, rtextents=0\n```\n\n在这种情况下，我们创建了一个\
  \ XFS 文件系统。`XFS` 是一种高性能文件系统，它是 `AlmaLinux 9` 上的默认文件系统类型，并且在并行 I/O 性能和日志的使用方面具有若干优势。\n\
  \n## 31.5 日志文件系统概述\n\n日志文件系统在磁盘写入期间，对文件系统所所的更改维护一个日志或记录，这些日志可以用于快速恢复由于系统崩溃或停电等事件可能发生的损坏。\n\
  \n使用日志文件系统有几个优势。首先，多年来存储在磁盘驱动器上的数据大小和容量呈指数级增长。非日志文件系统的问题在于，在崩溃之后，必须运行 `fsck`（文件系统一致性检查）工具。`fsck`\
  \ 工具将扫描整个文件系统，验证所有条目，并确保块被正确分配和引用。如果它发现损坏的条目，它将尝试修复问题。这里的问题有两个方面：首先，`fsck` 工具并不总是能够修复损坏，你最终会在\
  \ `lost+found` 目录中得到一些数据。应用程序使用了这些数据，但系统不再知道它们是从哪里被引用的。另一个问题是时间问题。在大型文件系统上完成 `fsck`\
  \ 过程可能需要很长时间，这可能导致无法接受的停机时间。\n\n另一方面，日志文件系统在每次写入期间都会在磁盘上的一个日志区域记录信息（日志和记录不需要在同一设备上）。这在本质上是向文件系统“提交”数据的“意图”。日志中记录的信息量是可配置的，范围从不记录任何内容到记录所谓的“元数据”（即，所有权、时间戳信息等），再到记录“元数据”以及要写入文件的数据块。一旦日志更新，系统就会将实际数据写入适当的文件系统区域，并标记条目以表示数据已提交。\n\
  \n崩溃后，可以使用日志记录快速将文件系统恢复到在线状态，从而将使用 `fsck` 可能需要几分钟的时间缩短到几秒，而且优点是数据丢失或损坏的概率大大降低。\n\
  \n## 31.6 挂载文件系统\n\n现在我们已经在新磁盘驱动器的 Linux 分区上创建了新的文件系统，我们需要挂载它以便进行访问和使用。为了做到这一点，我们需要创建一个挂载点。挂载点简单来说就是文件系统将要挂载的目录或文件夹。在本例中，我们将创建一个\
  \ `/backup` 目录以匹配我们的文件系统标签（尽管这些值不需要匹配）：\n\n```\nmkdir /backup\n```\n\n然后可以使用 `mount`\
  \ 命令手动挂载文件系统：\n\n```\nmount /dev/nvme0n2p1 /backup\n```\n\n运行不带参数的 `mount` 命令将向我们显示所有当前已挂载的文件系统（包括我们新的文件系统）：\n\
  \n```\nmount\nproc on /proc type proc (rw,nosuid,nodev,noexec,relatime)\nsysfs on\
  \ /sys type sysfs (rw,nosuid,nodev,noexec,relatime,seclabel)\n.\n.\n/dev/nvme0n2p1\
  \ on /backup type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)\n\
  ```\n\n## 31.7 配置 AlmaLinux 9 自动挂载文件系统\n\n为了设置系统在启动时自动挂载新文件系统，需要添加一个条目。fstab 格式如下：\n\
  \n`<device> <mountpoint> <type> <options> <dump> <pass>`\n\n- `<device>`：文件系统设备。\n\
  - `<mountpoint>`：挂载点目录。\n- `<type>`：文件系统类型。\n- `<options>`：挂载选项。\n- `<dump>`：是否进行备份。\n\
  - `<pass>`：fsck 检查顺序。\n\n为了设置系统在启动时自动挂载新的文件系统，需要在 `/etc/fstab` 文件中添加一个条目。对于日志文件系统如\
  \ XFS，此检查项应设置为 `0`。\n\n以下示例显示了我们的 fstab 设置：\n\n```\nUUID=d228403-efd9-4509-a6b7-eead32ecff09\
  \ / root defaults 0 0\n/dev/mapper/almalux-swap none swap defaults 0 0\n.\n/dev/nvme0n2p1\
  \ /backup xfs defaults 0 0\n```\n\n`/backup` 文件系统现在每次重启都会自动挂载。\n\n## 31.8 使用 Cockpit\
  \ 添加磁盘\n\n除了使用本章概述的命令行工具处理存储之外，还可以使用 Cockpit 控制台配置新的存储设备。要查看当前存储，请登录 Cockpit 控制台并选择\
  \ `Storage` 选项，如图 31-1 所示：\n\n![31-1](img/almalux_cockpit_storage)\n\n要找到新添加的存储，滚动到\
  \ `Storage` 页面底部直到 `Drives` 部分出现（注意 `Drives` 部分也可能位于屏幕右上角）：\n\n![31-2](img/cockpit_drives.png)\n\
  \n在上述图的情况下，新驱动器是 15.5 GB 驱动器。选择新驱动器以显示 `Drive` 屏幕，如图 31-3 所示：\n\n![31-3](img/cockpit_drive_details.png)\n\
  \n点击 `Create partition` 按钮并使用对话框指定为该分区分配的空间、文件系统类型（推荐 XFS）以及可选的标签、文件系统挂载点和挂载选项。注意，如果此新分区没有使用所有可用空间，可以在驱动器上添加更多分区。要更改是否为只读或在启动时挂载的设置，请更改\
  \ `Mount options` 部分的设置：\n\n![31-4](img/cockpit_drive_create_partition.png)\n\n\
  选择设置后，点击 `Create partition` 按钮提交更改。创建过程完成后，新分区将添加到磁盘上，相应的文件系统将创建并挂载到指定的挂载点，并且对 `/etc/fstab`\
  \ 文件进行相应的更改。\n\n31.9 总结\n\n\n\n本章节介绍了如何向现有的 AlmaLinux 9 系统添加物理或虚拟磁盘驱动器。这是一个相对简单的过程，只需确保操作系统检测到新驱动器，在驱动上创建一个或多个分区，然后在这些分区上创建文件系统。虽然\
  \ AlmaLinux 9 提供了多种文件系统类型，但通常推荐 `XFS`。一旦文件系统就绪，就可以使用 `mount` 命令进行挂载。为了让新创建的文件系统在系统启动时自动挂载，可以在\
  \ `/etc/fstab` 配置文件进行添加。\n\n# 32. 向 AlmaLinux 9 卷组和逻辑卷添加新磁盘\n\n上一节中，我们查看了如何向 AlmaLinux\
  \ 9 系统添加新磁盘驱动器、创建分区和文件系统，然后挂载该文件系统以访问磁盘。创建固定分区和文件系统的替代方案是使用逻辑卷管理 (`LVM`) 来创建由一个或多个物理/虚拟磁盘或分区空间组成的逻辑磁盘。使用\
  \ `LVM` 的优势是可以在逻辑卷中添加或删除空间，而无需将数据分散在多个文件系统上。\n\n让我们以基于 AlmaLinux 9 的服务器文件系统为例。如果没有\
  \ `LVM`，该文件系统在安装操作系统时将以特定大小创建。如果安装了新磁盘驱动器，将无法将任何空间分配给 `/` 文件系统。唯一的选项是在新磁盘上创建新文件系统并将其挂载到特定的挂载点。在这种情况下，虽然新文件系统上有充足的空间，但\
  \ `/` 文件系统仍然几乎满额。唯一的选择是将文件移动到新文件系统。通过 `LVM`，可以将新磁盘（或其部分内容）分配给包含家目录文件系统的逻辑卷，从而动态扩展可用空间。\n\
  \n在本章中，我们将介绍向卷组和逻辑卷添加新磁盘空间所需的步骤，以便为 AlmaLinux 9 系统的家目录文件系统添加额外空间。\n\n## 32.1 逻辑卷管理\
  \ (LVM) 概述\n\n`LVM` 提供了一种灵活且高级的磁盘空间管理方法。与其将每个磁盘驱动器划分为固定大小的分区并在其创建固定大小的文件系统，`LVM`\
  \ 提供了一种将磁盘空间分组为逻辑卷的方法，逻辑卷可以轻松调整大小和移动。此外，`LVM` 允许管理员通过向不同用户组分配不同的卷组或逻辑卷，来精确控制分配给不同用户的磁盘空间。当最初分配给卷的空间耗尽时，管理员可以增加空间，而无需将用户文件移动到不同的文件系统。\n\
  \n`LVM` 由以下组件组成：\n\n### 32.1.1 卷组 (VG)\n卷组（Volume Group）是一个高级容器，包含一个或多个逻辑卷和物理卷。\n\
  \n### 32.1.2 物理卷 (PV)\n物理卷（physical volume）代表存储设备，如磁盘驱动器或其他存储媒体。\n\n### 32.1.3 逻辑卷\
  \ (LV)\n逻辑卷（logical volume）等于磁盘分区，与磁盘分区一样，它可以包含文件系统。\n\n### 32.1.4 物理区 (PE)\n每个物理卷\
  \ (`PV`) 都被划分为等大小的块，称为物理区。\n\n### 32.1.5 逻辑区 (LE)\n每个逻辑卷 (`LV`) 都被划分为等相同的块，称为逻辑区。\n\
  \n假设我们正在创建一个名为 `VolGroup001` 的新卷组。该卷组需要物理磁盘空间才能运行，因此我们分配了三个磁盘分区 `/dev/sda1`、`/dev/sdb1`\
  \ 和 `/dev/sdb2`。这些成为 `VolGroup001` 中的物理卷。然后，我们在卷组内创建一个名为 `LogVol001` 的逻辑卷，由这三个物理卷组成。\n\
  \n如果 `LogVol001` 的空间耗尽，我们将更多的磁盘分区作为物理卷，并将它们分配给卷组和逻辑卷。\n\n## 32.2 获取逻辑卷信息\n\n作为在\
  \ AlmaLinux 9 中使用 `LVM` 的示例，我们将通过为标准 AlmaLinux 9 安装的 `/` 文件系统添加空间的示例。考虑到分区大小的灵活性需求，AlmaLinux\
  \ 9 将 `/` 文件系统设置为逻辑卷（名为 `home`），位于名为 `almalinux` 的卷组中。然而，在对 `LVM` 设置进行任何更改之前，首先收集信息是关重要的。\n\
  \n运行 `mount` 命令将输出关于一系列挂载点的信息，包括关于家目录文件系统的条目：\n\n```\n/dev/mapper/almalinux-home\
  \ on /home type xfs (rw,relatime,seclabel,attr2,inode64,logbufs=8,logbsize=32k,noquota)\n\
  ```\n\n可以使用 `vgdisplay` 命令获取卷组信息：\n\n```bash\n# vgdisplay\n\n  --- Volume group\
  \ ---\n\n  VG Name almalinux\n  System ID\n  Format lvm2\n  Metadata Areas 1\n \
  \ Metadata Sequence No 4\n  VG Access read/write\n  VG Status resizable\n  MAX LV\
  \ 0\n  Cur LV 3\n  Open LV 3\n  Max PV 0\n  Cur PV 1\n  Act PV 1\n  VG Size 296.50\
  \ GiB\n  PE Size 4.00 MiB\n  Total PE 75904\n  Alloc PE / Size 75904 / 296.50 GiB\n\
  \  Free PE / Size 0 / 0\n  VG UUID HSp6WF-NrHn-KHrv-NbI8-jDhe-WTpc-Lb1CNa\n```\n\
  \n如我们在上面的示例所示，`almalinux` 卷组的物理区大小为 `4.00MiB`，总共有 `296.50GB` 可供分配给逻辑卷。目前已分配了 75904\
  \ 个物理区，等于总容量。因此，我们必须添加一个或多个物理卷以增加分配给 `almalinux` 卷组中任何逻辑卷的空间。`vgs` 工具也有助于快速显示系统中卷组中可用空间的概览：\n\
  \n```bash\n# vgs\n\n  VG #PV #LV #SN Attr VSize VFree\n  almalinux 1 3 0 wz--n-\
  \ 296.50g 0\n```\n\n同样，可以使用 `lvdisplay` 命令获取卷组中逻辑卷的信息：\n\n```bash\n# lvdisplay\n\
  \n  --- Logical volume ---\n  LV Path /dev/almalinux/swap\n  LV Name swap\n  VG\
  \ Name almalinux\n  LV UUID GwyCy4-JjCg-Nj1l-cmWf-GttL-MHwJ-YmaDYV\n  LV Write Access\
  \ read/write\n  LV Creation host, time demoserver, 2023-08-17 15:48:07 -0500\n \
  \ LV Status available\n  # open 2\n  LV Size 3.75 GiB\n  Current LE 961\n  Segments\
  \ 1\n  Allocation inherit\n  Read ahead sectors auto\n  - currently set to 256\n\
  \  Block device 253:1\n  --- Logical volume ---\n  LV Path /dev/almalinux/home\n\
  \  LV Name home\n  VG Name almalinux\n  LV UUID lHky-CV0Z-Wc4Z-fq3-je8e-EWoo-\n\
  \  LV Write Access read/write\n  LV Creation host, time demoserver, 2023-08-17 15:48:07\
  \ -0500\n  LV Status available\n  # open 1\n  LV Size 222 GiB\n  Current LE 57023\n\
  \  Segments 1\n  Allocation inherit\n  Read ahead sectors auto\n  - currently set\
  \ to 256\n  Block device 253:2\n  --- Logical volume ---\n  LV Path /dev/almalinux/root\n\
  \  LV Name root\n  VG Name almalinux\n  LV UUID rGk5UZ-X0sJ-Lb3x-lhe8-\n  LV Write\
  \ Access read/write\n  LV Creation host, time demoserver, 2023-08-17 15:48:09 -0500\n\
  \  LV Status available\n  # open 1\n  LV Size 70.00 GiB\n  Current LE 17920\n  Segments\
  \ 1\n  Allocation inherit\n  Read ahead sectors auto\n  - currently set to 256\n\
  \  Block device 253:0\n```\n\n如上例所示，`almalinux` 卷组中的 70 GiB 空间分配给了逻辑卷 `root`（用于\
  \ `/` 文件系统），大约 222 GiB 分配家目录卷（用于 `/home`），3.75 GiB 分给了 swap（用于交换空间）。\n\n现在我们知道了哪些空间被使用了，了解哪些设备提供了空间（即哪些设备被用作物理卷）通常很有帮助。为了获取这些信息，我们需要运行\
  \ `pvdisplay` 命令：\n\n```bash\n# pvdisplay\n\n  --- Physical volume ---\n  PV Name\
  \ /dev/sda2\n  VG Name almalinux\n  PV Size 296.50 GiB / not usable 4.00 MiB\n \
  \ Allocatable yes (but full)\n  PE Size 4.00 MiB\n  Total PE 75904\n  Free PE 0\n\
  \  Allocated PE 75904\n  PV UUID GboISU-O0WH-fdEU-3sre-mHr0-T1X9-ObypcW\n```\n\n\
  \n\n\n显然，由逻辑卷 `almalinux` 控制的空间是通过位于 `/dev/sda2` 上的物理卷提供的。\n\n现在我们已经对 LVM 配置有了更深入的了解，可以为卷组以及其中包含的逻辑卷添加空间。\n\
  \n## 32.3 从命令行为卷组添加额外空间\n\n与之前收集 AlmaLinux 9 系统当前逻辑卷管理（LVM）配置信息的步骤一样，对该配置的更改也可以从命令行进行。\n\
  \n在本章的剩余部分中，我们假设系统已添加了一块新磁盘，并且操作系统将其识别为 `/dev/sdb`。我们还假设这是一块没有现有分区的磁盘。如果存在现有分区，应先对其进行备份，然后使用\
  \ `fdisk` 工具从磁盘上删除这些分区。例如，假设表示 `/dev/sdb` 的设备包含如下所示两个分区：\n\n```\n# fdisk -l /dev/sdb\n\
  \nDisk /dev/sdb: 14.46 GiB, 15525216256 bytes, 30322688 sectors\n\nDisk model: USB\
  \ 2.0 FD\n\nUnits: sectors of 1 * 512 = 512 bytes\n\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\n\nI/O size (minimum/optimal): 512 bytes / 512 bytes\n\n\
  Disklabel type: dos\n\nDisk identifier: 0x4c33060b\n\nDevice Boot Start End Sectors\
  \ Size Id Type\n\n/dev/sdb1 2048 30322687 30320640 14.5G 83 Linux\n```\n\n一旦这些分区上的任何文件系统已卸载，就可以按照以下方式删除它们：\n\
  \n```\n# fdisk /dev/sdb\n\nWelcome to fdisk (util-linux 2.37.4).\n\nChanges 将仅保留在内存中，直到你决定写入它们。\n\
  \n在使用 write 命令之前请要小心。\n\nCommand (m for help): d\n\nSelected partition 1\n\nPartition\
  \ 1 has been deleted.\n\nCommand (m for help): w\n\nThe partition table has been\
  \ altered.\n\nCalling ioctl() to re-read partition table.\n\nSyncing disks.\n```\n\
  \n在移动到下一步之前，删除 `/etc/fstab` 文件中关于这些文件系统的条目，以便系统在下次重启时不会尝试挂载它们。\n\n一旦磁盘准备就绪，下一步是使用\
  \ `pvcreate` 命令将此磁盘转换为物理卷（同时擦除可能存在的 dos 签名）：\n\n```\n# pvcreate /dev/sdb\n\nWARNING:\
  \ dos signature detected on /dev/sdb at offset 510\\. Wipe it? [y/n]: y\n\n  Wiping\
  \ dos signature on /dev/sdb.\n\n  Physical volume \"/dev/sdb\" successfully created.\n\
  ```\n\n如果创建失败并显示类似“Device /dev/<device> excluded by a filter”的消息，则可能有在创建物理卷之前使用\
  \ `wipefs` 命令擦除磁盘：\n\n```\n# wipefs -a /dev/sdb\n\n/dev/sdb: 8 bytes were erased\
  \ at offset 0x00000200 (gpt): 45 46 49 20 50 41 52 54\n\n/dev/sdb: 8 bytes were\
  \ erased at offset 0x1fffffe00 (gpt): 45 46 49 20 50 41 52 54\n\n/dev/sdb: 2 bytes\
  \ were erased at offset 0x000001fe (PMBR): 55 aa\n\n/dev/sdb: calling ioctl to re-read\
  \ partition table: Success\n```\n\n创建物理卷后，我们现在需要使用 `vgextend` 命令将其添加到卷组（在此例下为 `almalinux`）：\n\
  \n```\n# vgextend almalinux /dev/sdb\n\n  Volume group \"almalinux\" successfully\
  \ extended\n```\n\n新的物理卷现在已添加到卷组中，并准备好分配给逻辑卷。要此此，我们运行 `lvextend` 工具，并提供我们想要扩展卷的大小。在此例中，我们想要将逻辑卷的大小扩展\
  \ 14 GB。注意，我们需要提供逻辑卷的路径，该路径可以通过 `lvdisplay` 命令获取（在此例下为 `/dev/almalinux/home`）：\n\
  \n```\n# lvextend -L+14G /dev/almalinux/home\n\n  Size of logical volume almalinux/home\
  \ changed from <223.34 GiB (57174 extents) to <237.34 GiB (60758 extents).\n\n \
  \ Logical volume almalinux/home successfully resized.\n```\n\n最后一步是调整逻辑卷上文件系统的大小以使用额外空间。执行方法取决于文件系统类型，可以通过以下\
  \ `df` 命令并检查 Type 列来识别类型：\n\n```\n# df -T /home\n\nFilesystem Type 1K-blocks Used\
  \ Available Use% Mounted on\n\n/dev/mapper/almalinux-home xfs 234070356 3345116\
  \ 230725240 2% /home\n```\n\n如果 `/` 是使用 XFS 文件系统格式化的，则可以使用 `xfs_growfs` 工具对其进行调整大小：\n\
  \n```\n# xfs_growfs /home\n\nmeta-data=/dev/mapper/almalinux-home isize=512 agcount=4,\
  \ agsize=14636544 blks\n          = sectsz=512 attr=2, projid32bit=1\n\n       \
  \   = crc=1 finobt=1, sparse=1, rmapbt=0\n\n          = reflink=1 bigtime=1 inobtcount=1\n\
  data = bsize=4096 blocks=58546176, imaxpct=25\n\n          = sunit=0 swidth=0 blks\n\
  naming =version 2 bsize=4096 ascii-ci=0, ftype=1\nlog =internal log bsize=4096 blocks=4096\n\
  ```\n\n## 32.4 总结\n\n卷组和逻辑卷在物理存储之上提供了一个抽象层，允许灵活的磁盘管理。本章概述了卷组和逻辑卷的基本概念，并演示了如何管理它们。\n\
  \n## 33 添加和管理 AlmaLinux 9 交换空间\n\n维护 AlmaLinux 9 系统性能的一个重要部分是确保有足够的交换空间（swap space）。因此，本章将提供交换管理的概述。\n\
  \n### 33.1 什么是交换空间？\n\n计算机系统供操作系统使用的物理内存是有限的。当操作系统接近内存限制时，它通过将内存页写入磁盘来释放空间。当操作系统需要这些任何一个页时，它们会被重新读回内存。分配给此任务的磁盘区域称为交换空间。\n\
  \n## 33.2 AlmaLinux 9 推荐的交换空间\n\n为 AlmaLinux 9 推荐的交换空间取决于几个因素，包括系统的内存量、施在内存上的工作负载以及系统是否需要支持休眠（hibernation）。AlmaLinux\
  \ 9 交换空间的当前指南如下：\n\n| 安装的 RAM 容量 | 推荐的交换空间 | 启用休眠时的推荐交换空间 |\n| :--- | :--- | :---\
  \ |\n| 2GB 或少 | 安装 RAM x 2 | 安装 RAM x 3 |\n| 2GB - 8GB | 安装 RAM x 1 | 安装 RAM x 2\
  \ |\n| 8GB - 64GB | 至少 4GB | 安装 RAM x 1.5 |\n| 64GB 或更多 | 至少 4GB | 不建议休眠 |\n\n表\
  \ 33-1\n\n当系统进入休眠时，当前的系统状态会被写入硬盘，然后关闭主机电源。\n\n当随后开启电源时，系统状态将从硬盘恢复。这与挂起（suspension）不同，后者的系统状态存储在\
  \ RAM 中。\n\n### 33.3 识别当前交换空间使用情况\n\n可以通过方法识别 AlmaLinux 9 系统当前使用的交换空间。一种方法是输出 `/proc/swaps`\
  \ 文件：\n\n```\n# cat /proc/swaps\n\nFilename Type Size Used Priority\n\n/dev/dm-1\
  \ partition 3932156 0B -2\n```\n\n或者，可以使用 `swapon` 命令：\n\n```\n# swapon\n\nNAME\
  \ TYPE SIZE USED PRIO\n\n/dev/dm-1 partition 3.7G 0B -2\n```\n\n\n\n要查看交换空间相对于总可用\
  \ RAM 的数量，可以使用 `free` 命令：\n\n```\nfree\n              total used free shared buff/cache\
  \ available\nMem: 3601420 1577696 1396172 404412 1273236 2023724\nSwap: 3932156\
  \ 0 3932156\n```\n\n## 33.4 向 AlmaLinux 9 系统中添加交换文件\n\n通过创建一个文件并将其分配为交换，可以系统添加额外的交换空间。首先使用\
  \ `dd` 命令创建交换文件。可以通过调整 `count` 变量来更改文件大小。例如，以下命令行创建了一个 2.0 GB 的文件：\n\n```\ndd if=/dev/zero\
  \ of=/newswap bs=1024 count=2000000\n```\n\n```\n2000000+0 records in\n2000000+0\
  \ records out\n2048000000 bytes (2.0 GB, 1.9 GiB) copied, 29.3601 s, 69.8 MB/s\n\
  ```\n\n在将文件转换为交换文件之前，必须确保该文件设置了安全权限：\n\n```\nchmod 0600 /newswap\n```\n\n一旦创建了合适的文件，就需要使用\
  \ `mkswap` 命令将其转换为交换文件：\n\n```\nmkswap /newswap\n```\n\n```\nSetting up swapspace\
  \ version 1, size = 1.9 GiB (2047995904 bytes)\nno label, UUID=28d314e9-492f-46f8-bdcf-3a734c4426db\n\
  ```\n\n创建并配置好交换文件后，可以使用 `swapon` 工具将其实时添加到系统中：\n\n```\nswapon /newswap\n```\n\n\
  现在重新运行 `swapon` 应该报告新文件正在用作交换空间：\n\n```\nswapon\nNAME TYPE SIZE USED PRIO\n/dev/dm-1\
  \ partition 3.7G 1M -2\n/newswap file 1.9G 0B -3\n```\n\n可以使用 `swapoff` 工具如下所示动态移除交换空间：\n\
  \n```\nswapoff /newswap\n```\n\n最后，修改 `/etc/fstab` 文件并添加以下行，以便系统启动时自动添加新的交换空间：\n\
  \n```\n/newswap swap swap defaults 0 0\n```\n\n## 33.5 将分区作为交换空间\n\n作为指定文件作为交换空间的替代方案，也可以将整个磁盘分区指定为交换。实现此目的步骤与添加交换文件的步骤相同。在将分区分配给交换之前，请确保相应文件系统上的任何现有数据已备份或不再需要，并且该文件系统已卸载。\n\
  \n假设在由 `/dev/sdb1` 表示的磁盘驱动上存在一个分区，第一步将再次使用 `mkswap` 工具将其转换为交换分区：\n\n```\nmkswap\
  \ /dev/sdb1\n```\n\n```\nSetting up swapspace version 1, size = 14.5 GiB (15524163584\
  \ bytes)\nno label, UUID=306b7fee-eb20-4679-9f14-f94548683557\n```\n\n接下来，将新分区添加到系统交换空间并验证其确实已添加：\n\
  \n```\nswapon /dev/sdb1\nswapon\n```\n\n```\nNAME TYPE SIZE USED PRIO\n/dev/dm-1\
  \ partition 3.7G 996K -2\n/dev/sdb1 partition 14.5G 0B -3\n```\n\n再次，可以如下所示修改 `/etc/fstab`\
  \ 文件，以便在启动时自动添加交换分区：\n\n```\n/dev/sdb1 swap swap defaults 0 0\n```\n\n## 33.6 为\
  \ AlmaLinux 9 LVM 交换卷添加空间\n\n在运行逻辑卷管理（LVM）的系统上，通过文件或磁盘分区添加交换的替代方案是扩展用于交换空间的逻辑卷。\n\
  \n第一步是使用 `lvdisplay` 工具识别当前可用的交换数量，以及用于交换空间的卷组和逻辑卷（有关 LVM 的更多信息，请参阅名为“向 AlmaLinux\
  \ 9 卷组和逻辑卷添加新磁盘”章节）：\n\n```\nlvdisplay\n```\n  --- Logical volume ---\n  LV Path\
  \ /dev/almalinux/swap\n  LV Name swap\n  VG Name almalinux\n  LV UUID MlUJL2-OLJB-0bIV-CeWs-Qwel-wUdT-0nmOv0\n\
  \  LV Write Access read/write\n  LV Creation host, time localhost.localdomain, 2023-08-13\
  \ 14:06:53 -0500\n  LV Status available\n  # open 2\n  LV Size 2.00 GiB\n  Current\
  \ LE 512\n  Segments 1\n  Allocation inherit\n  Read ahead sectors auto\n  - currently\
  \ set to 256\n  Block device 253:1\n```\n\n显然，交换空间位于名为 `swap` 的逻辑卷上，它是名为 `almalinux`\
  \ 的卷组的一部分。下一步是验证卷组上是否有可用空间可以分配给交换卷：\n\n```\nvgs\n```\n  VG #PV #LV #SN Attr VSize\
  \ VFree\n  almalinux 2 2 0 wz--n- <38.41g <6.00g\n```\n\n如果可用空间足以满足额外的交换需求，请关闭交换并扩展交换逻辑卷，以尽可能使用可用空间来满足系统的交换需求：\n\
  \n```\nswapoff /dev/almalinux/swap\nlvextend -L+8GB /dev/almalinux/swap\n```\n```\n\
  \      Logical volume almalinux/swap successfully resized.\n```\n\n接下来，重新格式化交换卷并重新交换：\n\
  \n```\nmkswap /dev/almalinux/swap\n```\n```\nmkswap: /dev/almalinux/swap: warning:\
  \ wiping old swap signature.\nSetting up swapspace version 1, size = 12 GiB (12754874368\
  \ bytes)\nno label, UUID=241a4818-e51c-4b8c-9bc9-1697fc2ce26e\n```\n```\nswapon\
  \ /dev/almalinux/swap\n```\n\n完成更改后，检查交换空间是否增加：\n\n```\nswapon\n```\n```\nNAME TYPE\
  \ SIZE USED PRIO\n/dev/dm-1 partition 12G -2\n```\n\n## 33.8 总结\n\n当内存资源受限时，交换空间对任何操作系统都是至关重要的。通过将内存区域交换到磁盘，系统可以继续运行并满足运行其上的进程和应用程序的需求。\n\
  \n\n\n\n\nAlmaLinux 9 提供了一组指南，根据系统安装的内存（RAM）容量建议应分配的磁盘交换空间（swap space）大小。当这些建议证明不足时，可以向系统添加额外的交换空间，通常不需要重启。本章概述了可以通过文件、磁盘或磁盘分区添加交换空间，或者通过扩展配置为交换空间的现有逻辑卷来添加。\n\
  \n# 34 章 AlmaLinux 9 系统与进程监控\n\n运行和管理 AlmaLinux 9 系统的一个基本组成部分是监控内存、交换空间、存储和处理器使用方面的系统整体健康状况。这包括了解如何检查和管理在后台运行的系统进程和用户进程。本章将概述一些用于监控\
  \ AlmaLinux 9 系统资源和进程的工具和实用程序。\n\n## 34.1 管理进程\n\n即使 AlmaLinux 9 系统看起来处于空闲状态，许多系统进程也会在后台静默运行以保持操作系统的正常运行。例如，当你执行命令或启动应用程序时，会启动用户进程并一直运行到相关任务完成。\n\
  \n要获取当前在单个终端或命令提示符会话上下文中运行的活动用户进程列表，请如下所示使用 `ps` 命令：\n\n```bash\n$ ps\n\nPID TTY\
  \ TIME CMD\n10395 pts/1 00:00:00 bash\n13218 pts/1 00:00:00 ps\n```\n\n`ps` 命令的输出显示当前终端窗口或命令提示符会话上下文中运行了两个用户进程：输入命令的\
  \ `bash` 壳以及 `ps` 命令本身。\n\n要列出当前用户运行的所有活动进程，请使用带有 `-a` 标志的 `ps` 命令。该命令将列出与用户相关的所有运行进程，无论它们运行在哪里（例如运行在其他终端窗口中的进程）：\n\
  \n```bash\n$ ps -a\n\nPID TTY TIME CMD\n5442 tty2 00:00:00 gnome-session-b\n6350\
  \ pts/0 00:00:00 sudo\n6354 pts/0 00:00:00 su\n6355 pts/0 00:00:00 bash\n9849 pts/2\
  \ 00:00:00 nano\n9850 pts/1 00:00:00 ps\n```\n\n如上述输出所示，该用户正在运行与 GNOME 桌面、壳会话、`nano`\
  \ 文本编辑器以及 `ps` 命令相关的进程。\n\n要列出特定用户的进程，请运行带有 `-u` 标志的 `ps` 命令并跟随用户名：\n\n```bash\n\
  # ps -u john\n\nPID TTY TIME CMD\n914 ? 00:00:00 systemd\n915 ? 00:00:00 (sd-pam)\n\
  970 ? 00:00:00 gnome-keyring-d\n974 tty1 00:00:00 gdm-x-session\n```\n\n请注意，每个进程都分配有一个唯一的进程\
  \ ID（PID），可以通过 `kill` 命令向该进程发送终止（TERM）信号来停止该进程。例如：\n\n\n\n```bash\n$ kill 13217\n\
  ```\n\n使用 TERM 信号结束进程的优点是它允许进程优雅地退出，从而可能保存任何可能丢失的数据。\n\n如果标准终止信号未能终止进程，请重复使用带有 `-9`\
  \ 选项的 `kill` 命令。该命令发送 KILL 信号，这应该导致即使是冻结的进程也会退出，但它没有给进程优雅退出的机会，可能会导致数据丢失：\n\n```bash\n\
  $ kill -9 13217\n```\n\n执行以下命令列出系统上运行的所有进程（包括所有用户和系统进程）：\n\n```bash\n$ ps -ax\n\n\
  PID TTY STAT TIME COMMAND\n1 ? Ss 0:22 /usr/lib/systemd/systemd rhgb --switched-root\n\
  2 ? S 0:00 [kthreadd]\n3 ? I< 0:00 [rcu_gp]\n4 ? I< 0:00 [rcu_par_gp]\n5 ? I< 0:00\
  \ [netns]\n```\n\n要列出所有进程并包含进程所有者、CPU 和内存使用情况的信息，请使用 `-aux` 选项执行 `ps` 命令：\n\n```bash\n\
  $ ps -aux\n\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\nroot 2 0.0\
  \ 0.0 0 0 ? S 09:59 0:00 [kthreadd]\nroot 3 0.0 0.0 0 0 ? I< 09:59 0:00 [rcu_gp]\n\
  root 4 0.0 0.0 0 0 ? I< 09:59 0:00 [rcu_par_gp]\nroot 5 0.0 0.0 0 0 ? I< 09:59 0:00\
  \ [netns]\nroot 7 0.0 0.0 0 0 ? I< 09:59 0:00 [kworker/0:0H-events_highpri]\nroot\
  \ 9 0.0 0.0 0 0 ? I< 09:59 0:00 [kworker/0:1H-events_highpri]\ndemo 9788 0.1 1.4\
  \ 763248 50480 ? Ssl 15:05 0:00 /usr/libexec/gnome-terminal-serv\ndemo 9814 0.0\
  \ 0.1 224108 5664 pts/2 Ss 15:05 0:00 bash\ndemo 9849 0.0 0.0 222412 3588 pts/2\
  \ S+ 15:06 0:00 nano\ndemo 9873 0.0 0.1 233416 6280 pts/1 R+ 15:08 0:00 ps -aux\n\
  ```\n\nLinux 进程可以启动自己的子进程（称为产生），导致进程之间形成层次化的父子关系。要查看进程树，请使用 `ps` 命令并包含 `-H` 选项。以下是执行\
  \ `ps -aH` 时树输出的一部分部分：\n\n```bash\n$ ps -aH\n\nPID TTY TIME CMD\n10036 pts/3 00:00:00\
  \ ps\n6350 pts/0 00:00:00 sudo\n6354 pts/0 00:00:00 su\n6355 pts/0 00:00:00 bash\n\
  5442 tty2 00:00:00 gnome-session-b\n```\n\n进程信息也可以通过 GNOME 桌面的“系统监视器”（System Monitor）工具查看。该工具可以通过桌面环境中搜索“System\
  \ Monitor”来启动，也可以通过以下命令行启动：\n\n```bash\n$ gnome-system-monitor\n```\n\n一旦系统监视器启动，点击工具栏上的“进程”（Processes）按钮即可列出系统上运行的进程，如图\
  \ 34-1 所示。\n\n## 34.2 使用 top 进行实时系统监控\n\n正如“Cockpit Web 界面概述”章节所概述，Cockpit Web 界面可以执行基础系统监控。上一节还解释了如何使用\
  \ GNOME 监视工具来监控进程和系统资源。本章还探讨了 `ps` 命令如何提供 AlmaLinux 9 系统上运行进程的快照。然而，`ps` 命令不提供进程和资源使用情况的实时视图。`top`\
  \ 命令是从命令行提示符进行系统资源和进程实时监控的理想工具。\n\n运行时，`top` 将根据系统资源使用情况对系统上运行的进程进行排序（需求最大的进程位于顶部）。屏幕上半部分显示内存和交换空间的使用信息，以及所有\
  \ CPU 核心的数据。所有这些输出不断更新，允许实时监控系统。\n\n要将显示的信息限制为属于特定用户的进程，可以使用 `-u` 选项并跟随用户名启动 `top`：\n\
  \n```bash\n$ top -u john\n```\n\n要查看 `top` 可功能的完整列表，请按键盘上的‘h’键或参考帮助手册（man page）：\n\
  \n```bash\n$ man top\n```\n\n\n\n\n# 34.3 命令行磁盘与交换空间监控\n\n可以通过 Cockpit 内部和使用 GNOME\
  \ 系统监器监控磁盘空间。然而，要从命令行识别磁盘使用情况，`df` 命令提供了有用且快速的概览：\n\n```bash\ndf -h\n\nFilesystem\
  \ Size Used Avail Use% Mounted on\n\ndevtmpfs 4.0M 0 4.0M 0% /dev\ntmpfs 1.8G 0\
  \ 1.8G 0% /dev/shm\ntmpfs 704M 9.6M 694M 2% /run\n/dev/mapper/almalinux-root 70G\
  \ 6.3G 64G 9% /\n/dev/mapper/almalinux-home 224G 1.8G 222G 1% /home\n/dev/sda1 1014M\
  \ 290M 725M 29% /boot\ntmpfs 352M 144K 352M 1% /run/user/1000\n```\n\n查看当前交换空间和内存使用情况，运行\
  \ `free` 命令：\n\n```bash\nfree\n\n             total used free shared buff/cache\
  \ available\nMem: 3823720 879916 1561108 226220 1382696 2476300\n```\n\n要持续监控内存和交换级别，请使用带有\
  \ `-s` 的 `free` 命令，指定每次更新之间的秒数（请注意，`top` 工具提供了实时查看这些数据的更好方法）：\n\n```bash\nfree -s\
  \ 1\n\nMem: 3823720 879472 1561532 226220 1382716 2476744\nSwap: 2097148 0 2097148\n\
  \n             total used free shared buff/cache available\nMem: 3823720 879140\
  \ 1559940 228144 1384640 2475152\nSwap: 2097148 0 2097148\n```\n\n要从命令行监控磁盘 I/O，可以考虑使用\
  \ `iotop` 命令，其安装方式如下：\n\n```bash\ndnf install iotop\n```\n\n一旦安装并执行（`iotop` 必须以系统管理员权限运行），该工具将按进程显示磁盘\
  \ I/O 的实时列表：\n\n![](img/iotop_running.png)\n\n图 34-8\n\n## 34.4 总结\n\n即使是一个看起来什么都没做的系统，后台也会有许多系统进程在运行。用户在系统上的操作会导致启动额外的进程。进程还可以产生自己的子进程。每个进程都会使用一些系统资源，包括内存、交换空间、处理器周期、磁盘存储和网络带宽。本章探索了一组工具，这些工具用于监控运行系统上的进程和系统资源，并在必要时杀死可能影响系统性能的错误进程。\n\
