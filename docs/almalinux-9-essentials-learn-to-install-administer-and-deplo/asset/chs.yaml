- "# AlmaLinux 9 基础：学习安装、管理和部署 Rocky Linux 9 系统\n\n\n\n\n\n\n\n\n\n\n\n# 1. 引言\n\n\
  《AlmaLinux 9 精要》旨在提供 AlmaLinux 9 发行版的安装、使用和管理详细信息。对于初学者，本书涵盖了如操作系统安装、GNOME 桌面环境基础、配置电子邮件和\
  \ Web 服务器，以及安装软件包和系统更新等主题。还涵盖了额外的安装主题（例如与 Microsoft Windows 进行双启动），以及所有重要的安全主题（例如配置防火墙和用户及组管理）。\n\
  \n对于经验丰富的用户，本书详细介绍了远程桌面访问、Cockpit Web 界面、逻辑卷管理 (LVM)、磁盘分区、交换空间管理、KVM 虚拟化、安全外壳 (SSH)、Linux\
  \ 容器以及使用 Samba 和 NFS 进行文件共享，以提供对这一企业级操作系统的全面概述。\n\n## 1.1 超用户规范\n\nAlmaLinux 9 与普通\
  \ Linux 一样，两种用户账户：一种是标准用户账户，对操作系统的许多管理文件和功能的访问受限；另一种是具有特权权限的超级用户（root）账户。通常，用户可以通过登录\
  \ root 用户或使用 `su -` 命令并输入 root 密码来获取 root 权限。在下面的示例中，用户通过 `su -` 命令获取 root 权限：\n\
  \n```\n[root@demoserver ~]$ su -\n\nPassword:\n\n[root@demoserver ~]#\n```\n\n注意，普通用户的命令提示符以\
  \ `$` 符号结束，而 root 用户使用 `#` 字符。在命令行操作时，这是判断你当前是否以 root 用户身份发布命令的有用指示。\n\n如果 `su -`\
  \ 命令失败，系统上的 root 账户可能出于安全原因被禁用了。在这种情况下，可以使用下述的 `sudo` 命令。\n\n使用 `sudo`，非 root 用户可以执行需要\
  \ root 权限的单条命令。考虑以下尝试使用最新补丁和软件包更新操作系统的操作：\n\n```\n$ dnf update\n\nError: This command\
  \ has to be run with superuser privileges (under the root user on most systems).\n\
  ```\n\n可选地，可以配置用户账户使其访问 root 级权限。与其使用 `su -` 命令先获取 root 权限，具有管理权限的用户账户可以使用 `sudo`\
  \ 运行其他受限的命令：\n\n```\n$ sudo dnf update\n```\n\n我们相信你已经听过本地系统管理员的惯常教诫。这通常归结为以下三点：\n\
  \n#1) 尊重他人的隐私。\n\n#2) 在输入之前先思考。\n\n#3) 权力越大，责任越大。\n\n```\n[sudo] password for demo:\n\
  ```\n\n为了在不反复使用 `sudo` 命令的情况下执行多条命令，可以通过以下方式访问具有持久超级用户权限的命令提示符：\n\n```\n[root@demoserver\
  \ ~]$ sudo su -\n\n[root@demoserver ~]#\n```\n\n在本书这么早阶段提出这个问题的原因是，书中列出的许多命令行示例都需要\
  \ root 权限。与其在每个命令行示例之前都重复说明以 root 身份运行命令的指令，将使用行首的命令提示符来指示是否需要以 root 执行执行命令。如果命令可以作为普通用户运行，则命令将以\
  \ `$` 命令提示符为开头，如下：\n\n```\n$ date\n```\n\n反，如果命令需要 root 权限，则命令将以 `#` 命令提示符为开头：\n\
  \n```\n# dnf install openssh\n```\n\n## 1.2 打开终端窗口\n\n如果你在使用 GNOME 桌面并需要访问命令提示符，则你需要打开终端窗口。要这样做，可以按下键盘上的\
  \ Windows 键，或者点击屏幕左上角的“活动”按钮，然后从启动器中选择“终端”，如图 1-1 所示：\n\n![](img/gnome_terminal_in_dock.png)\n\
  \n图 1-1\n\n## 1.3 编辑文件\n\n配置 Linux 系统通常涉及编辑文件。对于 Linux 新手来说，可能不清楚使用哪种编辑器。如果你正在运行终端会话且还没有首选的编辑器，我们建议使用\
  \ `nano` 编辑器。要在终端窗口中启动 `nano`，输入以下命令：\n\n```\n# nano <file>\n```\n\n其中 `<file>`\
  \ 替换为想要编辑的文件路径。例如：\n\n```\n# nano /etc/passwd\n```\n\n加载后，`nano` 将如图 1-2 所示：\n\n\
  ![](img/ubuntu_18.04_nano.png)\n\n图 1-2\n\n要创建一个新文件，请按如下方式运行 `nano`：\n\n```\n# nano\n\
  ```\n\n当你完成文件编辑后，输入 `Ctrl-S` 保存文件，然后按 `Ctrl-X` 退出。要打开现有文件，请使用快捷键 `Ctrl-R`。\n\n如果你倾向于在\
  \ GNOME 桌面环境中使用图形化编辑器，`gedit` 是执行基础编辑任务的良好起点。要从桌面启动 `gedit`，按 `Alt-F2` 显示“运行命令”窗口，如图\
  \ 1-3 所示：\n\n![](img/gnome_run_command.png)\n\n图 1-3\n\n在文本字段中输入 `gedit` 并按回车键。稍后，`gedit`\
  \ 将加载并准备好打开、创建和编辑文件：\n\n![](img/gnome_gedit.png)\n\n图 1-4\n\n或者，也可以从终端窗口启动 `gedit`，带或不带要打开的文件路径：\n\
  \n```\n# gedit\n\n# gedit /etc/passwd\n```\n\n## 1.4 反馈\n\n我们希望你对购买本书满意。如果你在书中发现任何错误，或有任何意见、问题或担忧，请通过\
  \ `feedback@ebookfrenzy.com` 与我们联系。\n\n## 1.5 勘误\n\n尽管我们尽力确保书中内容的准确性，但一本涵盖如此规模和复杂领域的书籍不可避免可能会包含一些错误和遗漏。书中任何已知问题将在以下\
  \ URL 列出并给出解决方案：\n\n`https://www.ebookfrenzy.com/errata/almalinux9.html`\n\n如果你发现勘误列表中未列出的错误，请通过邮件向我们的支持团队\
  \ `feedback@ebookfrenzy.com` 告知我们。\n\n# 2. AlmaLinux 简史\n\nAlmaLinux 9 是 Linux 操作系统的几种变体（也称为发行版）之一。它基于红帽企业\
  \ Linux (RHEL) 发行版的源码，该版本由一家名为 Red Hat, Inc. 的美国公司开发。该公司位于北卡罗来纳州罗利，成立于 20 世纪 90\
  \ 年代中期，通过当时 Marc Ewing 和 Bob Young 拥有的两家合并合并。然而，Linux 的起源可以追溯。本章将概述 Linux 操作系统和红帽的历史，然后解释\
  \ AlmaLinux 是如何融入这一图景的。\n\n## 2.1 到底什么是 Linux？\n\n\n\n\nLinux 是一个操作系统，就像 Windows\
  \ 是一个操作系统一样（尽管 Linux 和 Windows 之间几乎没有相似之处）。“操作系统”一词用于描述在计算机硬件与我们日常运行的应用程序之间充当层作用的软件。当程序员编写应用程序时，他们与操作系统交互以执行诸如将文件写入硬盘和在屏幕上显示信息等任务。如果没有操作系统，每位程序员都必须编写代码来直接访问系统硬件。此外，程序员必须能够支持自以来创造的每一件硬件，以确保应用程序能够在任何可能的硬件配置上运行。由于操作系统处理了所有这些硬件复杂性，应用程序开发变成了一项简单得多的的任务。Linux\
  \ 今天许多不同操作系统之一。\n\n## 2.2 UNIX 的起源\n\n要理解 Linux 的历史，我们首先必须追溯到 20 世纪 60 年末的 AT&T\
  \ 实验室。期间，AT&T 停止了对名为 `Multics` 的新操作系统的开发。然而，AT&T 的两位工程师肯·汤普森（Ken Thompson）和丹尼斯·里奇（Dennis\
  \ Ritchie）决定将他们在 `Multics` 项目中学到的知识，创建一个名为 `UNIX` 的新操作系统，该系统迅速在企业和学术机构中流行并被广泛采用。\n\
  \n各种专有的 UNIX 实现最终进入市场，包括由 IBM (`AIX`)、惠尔惠 (`HP-UX`) 和太阳微系统 (`SunOS` 和 `Solaris`)\
  \ 创建的版本。此外，安德鲁·S·塔能鲍（Andrew S. Tanenbaum）创建了一个名为 `MINIX` 的类 UNIX 操作系统，专为教育设计，并向大学提供源代码访问。\n\
  \n## 2.3 谁创建了 Linux？\n\nLinux 的起源可以追溯到两个工作和哲学。Linux 操作系统的核心是被称为 `kernel`（内核）的内核。这是操作系统运行所需的核心功能集。`kernel`\
  \ 管理系统资源并处理硬件与应用程序之间的通信。Linux `kernel` 由林纳斯·托瓦兹（Linus Torvalds）开发，他由于不喜欢 `MS-DOS`，并且对在新的\
  \ Intel 80386 微处理器上无法使用 `MINIX` 感到不耐烦，因此决定编写自己的类 UNIX `kernel`。当他完成 `kernel` 的第一个版本时，他以开源许可发布了它，允许任何人下载源代码并自由使用和修改，而无需向林纳斯支付费用。\n\
  \n大约时期，自由软件基金会的理查德·斯尔曼（Richard Stallman）是自由和开源软件的有力支持者，他当时正在开发自己的开源操作系统。然而，斯尔曼最初并没有专注于\
  \ `kernel`，而是从开发使用和维护操作系统所需的所有 UNIX 工具、实用程序和编译器的开源版本开始。当他完成这些基础设施的开发时，明显的解决方案是将他的工作与林纳斯编写的\
  \ `kernel` 结合，创建一个完整的操作系统。这种组合被称为 `GNU/Linux`。纯洁者坚持认为 Linux 应该被称为 `GNU/Linux`（事实上，曾有一次，理查德·斯尔曼拒绝接受任何未将\
  \ Linux 称为 `GNU/Linux` 的出版物的采访）。这并非没有，因为自由软件基金会开发的 `GNU` 工具构成了 `GNU/Linux` 中重要且至关重要的部分。遗憾的是，大多数人和出版物将\
  \ Linux 称为 Linux，这种情况可能会一直持续下去。\n\n## 2.4 红帽的早期\n\n1993 年，鲍·杨（Bob Young）创建了一家名为\
  \ `ACC Corporation` 的公司，根据杨的说法，他在“妻子的缝衣柜”里经营这家公司。`ACC` 这个名字旨在代表目录业务，但他妻子经营的一家名为“康涅狄格州古董与收藏品”的小企业的缩写。通过\
  \ `ACC` 目录业务销售的物品包括 Linux 光盘和相关的开源软件。\n\n大约同一时间，马克·尤文（Marc Ewing）创建了自己的 Linux 发行版公司，将其命名为\
  \ `Red Hat Linux`（由于他在卡内基·梅隆大学期间习惯戴红色棒球帽而得名）。\n\n1995 年，`ACC` 收购了红帽，采用了 `Red Hat,\
  \ Inc.` 的名称，并经历了快速且巨大的增长。鲍·杨在公司于 1999 年 8 月上市后不久辞去了 CEO 职位，之后从事了许多商业和慈善活动，包括一家名为\
  \ `Lulu` 的按需打印图书出版公司以及两支加拿大职业运动队的所有权。2018 年，IBM 以 340 亿美元的交易价格收购了 `Red Hat, Inc.`。\n\
  \n## 2.5 红帽支持\n\n早期的 Red Hat Linux 通过软磁盘和 CD 发送给客户（当然，这早于宽带互联网连接的普及）。当用户在使用软件遇到问题时，他们只能通过电子邮件联系红帽。事实上，鲍·杨经常开玩笑说，这在限制支持请求方面非常有效，因为当客户意识到需要帮助时，他们的计算机通常处于无法工作的状态，因此无法用来发送电子邮件向红帽支持团队寻求帮助。在随后的几年里，红帽提供了与付费订阅挂钩的更高级别，现在提供从“自救”（无支持）到高级支持的各种支持级别。\n\
  \n## 2.6 开源\n\n`Red Hat Enterprise Linux 9` 是红帽目前的商业产品，主要针对企业级、任务关键型安装。它也是红帽所提供的不断扩展的程序和服务生态系统的基石。\n\
  \n`RHEL` 曾经是一个开源产品，这意味着任何人都可以免费下载源代码并自己构建软件（这项任务绝非易事）。这种情况在 2023 年发生了变化，当时红帽开始仅向付费客户提供源代码。\n\
  \n## 2.7 Fedora 项目\n\n红帽还赞助 Fedora 项目，其目标是以 `Fedora Linux` 的形式提供免费的 Linux 操作系统（包括源码和二进制发行版）。`Fedora\
  \ Linux` 还作为许多新功能的测试场，这些功能最终会被采用到 Red Hat Enterprise Linux 操作系统族和 `CentOS` 衍生中。\n\
  \n## 2.8 CentOS Stream\n\n对于无法负担 Red Hat Enterprise Linux 订阅的用户，另一个选项是 `CentOS Stream`\
  \ 操作系统。`CentOS` 项目最初是一个社区驱动的努力，但现在由红帽拥有，它获取 `Red Hat Enterprise Linux` 源代码，移除红帽标识和订阅要求，进行编译并提供发行版供下载。与\
  \ Fedora 一样，`CentOS Stream` 在新的操作系统功能包含在未来的 `RHEL` 版本之前对其进行现场测试。因此，它可能缺乏稳定性，但提供了获取尖端的功能。\n\
  \n## 2.9 AlmaLinux\n\n`AlmaLinux` 由 `AlmaLinux OS Foundation` 于 2021 年创建，旨在提供 100%\
  \ 兼容 Red Hat Enterprise Linux 的稳定 Linux 发行版。这最初涉及从 `RHEL` 源代码构建。现在 `RHEL` 源代码不再公开，目标已变为\
  \ 100% 的二进制兼容。二进制兼容意味着，虽然 `AlmaLinux` 可能与 `RHEL` 不相同，但它可以运行与 `RHEL` 上运行的相同的软件和应用程序。\n\
  \n## 2.10 总结\n\nLinux 操作系统的起源可以追溯到林纳斯·托瓦兹和理查德·斯尔曼的工作，表现为 Linux `kernel` 与 `GNU`\
  \ 项目构建的工具和编译器的结合。\n\n\n\n多年来，Linux 的开源特性导致了各种不同 Linux 发行版的发布。其中一种发行版是红帽企业 Linux（Red\
  \ Hat Enterprise Linux），它由 Bob Young 和 Mark Ewing 创立的 Red Hat 公司创建。红帽专注于提供企业级 Linux\
  \ 软件解决方案并结合广泛的技术支持服务。AlmaLinux 基于 Red Hat Enterprise Linux 并且与之 100% 二进制兼容。\n\n\
  # 3. 在空白磁盘驱动上安装 AlmaLinux 9\n\n现在有两种方法部署 AlmaLinux 9 系统。一种方法是购买新硬件，或者重新利用现有的计算机系统以在其上安装和运行操作系统。另一种选择是使用\
  \ Amazon AWS、Google Cloud 或 Microsoft Azure（仅列举几个）等服务创建云操作系统实例。由于云实例通常是通过选择一个预配置的、针对云平台优化的即插即用操作系统镜像，并将其作为\
  \ AlmaLinux 9 系统的基础，因此情况下不需要执行手动安装操作系统。\n\n另一方面，如果你计划在自己的硬件上安装 AlmaLinux 9，那么学习\
  \ AlmaLinux 9 道路上的第一步就是安装操作系统。\n\nAlmaLinux 9 可以安装在空白磁盘环境（即清除整个磁盘上的所有现有分区并将其完全用于\
  \ AlmaLinux 9）或安装在双启动环境中（其中 AlmaLinux 9 与磁盘上的另一个操作系统共存，通常是 Microsoft Windows 系列操作系统的成员）。\n\
  \n本章将介绍从本地或远程安装介质进行空白磁盘安装的方法。与 Windows 11 系统的双启动安装将在 与 Windows 一起双启动 AlmaLinux 9\
  \ 中介绍。\n\n## 3.1 使用 Live 镜像尝试 AlmaLinux\n\n如果你想在安装之前尝试 AlmaLinux，可以通过从 AlmaLinux\
  \ Live 镜像启动来实现，该镜像可以从以下 URL 下载：\n\nhttps://repo.almalinux.org/almalinux/9/live/x86_64\n\
  \nAlmaLinux Live 镜像适用于 KDE 和 GNOME 桌面环境（本书涵盖了 GNOME 桌面），但仅适用于 64 位 Intel (x86_64)\
  \ 系统。一旦下载了镜像，请将其写入 USB 驱动器，并按照本章稍后概述的步骤从其启动。\n\n当系统启动后，将显示下方图 3-1 所示的屏幕，提供启动会话的选项。选择启动选项时，AlmaLinux\
  \ 将启动并加载桌面环境。虽然 AlmaLinux Live 功能齐全，但它使用虚拟磁盘驱动器，因此系统关闭或重启时，配置更改、数据和文件将会丢失。\n\n```\n\
  image/almalinux_9_grub_live.png\n```\n\n图 3-1\n\n## 3.2 获取 AlmaLinux 安装介质\n\n可以通过项目网站使用以下\
  \ URL 下载 AlmaLinux 发行版：\n\nhttps://almalinux.org/#downloads\n\n安装介质以 ISO 镜像的形式提供，有以下几种：\n\
  \n- Boot ISO（引导镜像）：一个小型镜像，可以启动系统但通过互联网下载安装所需的所有包。对于修复损坏的 AlmaLinux 安装也有帮助。\n- Minimal\
  \ ISO（最小化镜像）：此镜像包含开始安装所需的必要文件，并需要访问远程服务器上的完整安装介质。引导镜像也可以对现有的 AlmaLinux 系统执行救援操作。\n\
  - DVD ISO：一个自包含的镜像，包含了安装 AlmaLinux 系统所需的所有包。\n\n出于本书的目的，请下载 DVD ISO 镜像，其命名规范如下：\n\
  \nAlmaLinux-<version>-<architecture>-dvd.iso\n\n例如，适用于 64 位 Intel 系统的 AlmaLinux\
  \ 9 DVD 镜像命名如下：\n\nAlmaLinux-9.2-x86_64-dvd.iso\n\n镜像还适用于 ARM64 (aarch64)、ppc64le\
  \ 和 s390x 架构。\n\n下载镜像后，将其刻录到磁盘或使用下一节中的步骤将介质写入 USB 驱动器，配置你的虚拟化环境将其视为 DVD 驱动器，或使用本章稍后概述的步骤通过网络连接访问安装镜像。\n\
  \n## 3.3 将 ISO 安装镜像写入 USB 驱动器\n\n如今，操作系统安装更有可能通过 USB 驱动器而非 DVD 进行。在下载了 AlmaLinux\
  \ 9 的 ISO 安装镜像后，将镜像写入 USB 驱动器的步骤取决于驱动器连接到 Linux、macOS 还是 Windows 系统。本节剩余部分的步骤假设\
  \ USB 驱动器是新的或已重新格式化以删除任何现有数据或分区：\n\n### 3.3.1 Linux\n\n在 Linux 上向 USB 驱动器写入 ISO\
  \ 镜像的第一步是识别设备名称。在插入 USB 驱动器之前，通过列出 `/dev` 中的设备来识别系统已检测到的存储设备：\n\n```\n# ls /dev/sd*\n\
  ```\n\n`/dev/sda /dev/sda1 /dev/sda2`\n\n将 USB 驱动器连接到 Linux 系统并运行 `dmesg` 命令获取最近的系统消息列表，其中一个将是关于检测到\
  \ USB 驱动器的报告，类似于如下：\n\n```\ndmesg\n```\n\n`[406.2417] sd 6:0:0: Attached SCSI disk`\n\
  \n此输出告诉我们，我们预期的设备名称将包含 `sdb`，我们可以通过再次列出 `/dev` 中的设备来确认这一点：\n\n```\n# ls /dev\n```\n\
  \n`/dev/sda /dev/sda1 /dev/sda2 /dev/sdb`\n\n此输出显示 USB 驱动器已分配给 `/dev/sdb`。在将 ISO\
  \ 写入设备之前的下一步操作，是运行 `findmnt` 命令以确保它没有被自动挂载：\n\n```\n# findmnt /dev/sdb\n```\n\n\
  `/run/media/neil/d6bf9574-7e31-4f54-8b1 /dev/sdb ext3 rw,nosuid`\n\n如果 `findmnt`\
  \ 显示 USB 驱动器已挂载，请在继续之前将其卸载：\n\n```bash\n# umount /run/media/neil/d6bf9574-7e31-4f54-8b1\n\
  ```\n\n一旦文件系统已卸载，使用如下 `dd` 命令将 ISO 写入驱动器：\n\n```\n# dd if=/path/to/<image>.iso of=/dev/sdb\
  \ bs=512\n```\n\n写入过程可能需要一些时间（长达 10-15 分钟），取决于镜像大小以及运行它的系统速度。镜像写入完成后，将出现类似如下的输出，USB\
  \ 驱动器即可准备好安装 AlmaLinux 9：\n\n```\n5956+0 records in\n5956+0 records out\n3122659328\
  \ bytes (3.1 GB, 2.9 GiB) copied, 426.234 s, 7.3 MB/s\n```\n\n### 3.3.2 macOS\n\n\
  在连接到 macOS 系统的 USB 驱动器上写入 ISO 镜像的第一步是使用 `diskutil` 工具识别设备。在连接 USB 设备之前，打开终端窗口并运行以下命令：\n\
  \n```\n$ diskutil list\n```\n\n/dev/disk0 (internal, physical):\n# TYPE NAME SIZE\
  \ IDENTIFIER\n0: GUID_partition_scheme *1.0 TB disk0\n1: EFI 209.7 MB disk0s1\n\
  2: Apple_APFS Container disk2 1000.0 GB disk0s2\n\n/dev/disk1 (internal):\n# TYPE\
  \ NAME SIZE IDENTIFIER\n0: GUID_partition_scheme 28.0 GB disk1\n1: EFI 314.6 MB\
  \ disk1s1\n2: Apple_APFS Container disk2 27.7 GB disk1s2\n\n/dev/disk2 (synthesized):\n\
  # TYPE NAME SIZE IDENTIFIER\n0: APFS Container Scheme - +1.0 TB disk2\nPhysical\
  \ Stores disk1s2, disk0s2\n1: APFS Volume Macintosh HD 473.6 GB disk2s1\n2: APFS\
  \ Volume Preboot 42.1 MB disk2s2\n3: APFS Volume Recovery 517.0 MB disk2s3\n4: APFS\
  \ Volume VM 1.1 GB disk2s4\n\n\n\n\n在建立已检测设备的基准后，将 USB 驱动器插入 macOS 系统的端口并重新运行命令。将会出现相同的结果，但多了一个类似于下面的\
  \ USB 驱动器条目：\n\n```\n/dev/disk3 (external, physical):\n   #: TYPE NAME SIZE IDENTIFIER\n\
  \   0: *16.0 GB disk3\n```\n\n在上面的示例中，USB 驱动器被分配给 `/dev/disk3`。在继续之前，按照以下方式卸载磁盘：\n\
  \n```bash\n$ diskutil unmountDisk /dev/disk3\n```\n\ndisk3 上所有卷的卸载成功\n\n最后，使用 `dd`\
  \ 命令将 ISO 镜像写入设备，注意要引用原始磁盘设备（`/dev/rdisk3`），并在提示时输入用户密码：\n\n```bash\n$ sudo dd if=/path/to/iso/image.iso\
  \ of=/dev/rdisk3 bs=1m\n```\n\n镜像写入完成后，USB 驱动器即就就绪了。\n\n### 3.3.3 Windows/macOS\n\
  \nWindows 和 macOS 有多种免费工具可以将 ISO 镜像写入 USB 驱动器，但有一个专门为写入 Linux ISO 镜像设计的工具是 Fedora\
  \ Media Writer，可以从以下 URL 下载：\n\n[`getfedora.org/en/workstation/download/`](https://getfedora.org/en/workstation/download/)\n\
  \n安装完成后，插入目标 USB 驱动器，启动写入工具，并选择如图 3-2 中所示的“Select .iso file”选项：\n\n![](img/almalinux_media_writer_main.png)\n\
  \n图 3-2\n\n点击“Next”（下一步）进入“Write Options”（写入选项）屏幕，并在点击“Select...”按钮之前选择 USB 驱动器：\n\
  \n![](img/almalinux_media_writer_iso.png)\n\n图 3-3\n\n在弹出的文件选择对话中，导航并选择 AlmaLinux\
  \ 9 安装 ISO 镜像，点击“Open”（打开）按钮。最后，点击“Write”（写入）按钮开始将镜像写入 USB 驱动器：\n\n![](img/almalinux_media_writer_writing.png)\n\
  \n图 3-4\n\n镜像写入完成后，设备即可进行安装。\n\n## 3.4 安装 AlmaLinux 9\n\n将 AlmaLinux 9 安装介质插入合适的驱动器并开启电源。如果系统尝试从硬盘启动，你将需要进入计算机的\
  \ BIOS 设置并更改启动顺序，使其从安装介质驱动器启动。系统启动后，你将看到以下屏幕：\n\n![](img/almalinux_9_install_grub_screen.png)\n\
  \n图 3-5\n\n使用方向键在选项之间导航，并使用 `<Enter>` 键进行选择。例如，如果选择了“Troubleshooting”（故障排除）选项，将出现图\
  \ 3-6 所示的屏幕，包括从本地驱动器上的当前操作系统（如果已安装）启动、测试系统内存或救兴已安装的 AlmaLinux 9 系统的选项。还有一个选项允许在没有图形控制台的系统上以基本图形模式进行安装：\n\
  \n![](img/almalinux_9_install_trouibleshooting.png)\n\n图 3-6\n\n在主屏幕上选择安装 AlmaLinux\
  \ 选项，稍等后，将出现图形化安装程序的第一个屏幕：\n\n![](img/almalinux_9_install_language.png)\n\n图 3-7\n\
  \n在第一个屏幕上选择你偏好的语言，然后点击“Continue”（继续）进入主安装屏幕，如图 3-8 所示：\n\n![](img/almalinux_9_install_main.png)\n\
  \n图 3-8\n\n从“Network & Host Name”（网络与主机名）选项开始，启用系统上的网络设备并在点击“Apply”（应用）按钮之前输入主机名：\n\
  \n![](img/almalinux_9_install_network_screen.png)\n\n图 3-9\n\n如果你的网络连接需要额外设置，点击“Configure...”（配置）按钮访问图\
  \ 3-10 所示的高级网络设置屏幕：\n\n![](img/rhel9_install_network_configure.png)\n\n图 3-10\n\n\
  一旦定义了主机名并启网络连接，点击“Done”（完成）返回主屏幕。\n\n如果你想更改键盘、语言或时间和日期设置，请从主屏幕的“Localization”（本地化）列选择相应的选项。在“Time\
  \ & Date”（时间与日期）屏幕上，根据你的地理位置选择相应的选项。还提供了使用 Network Time（网络时间）选项，它会自动与外部网络时间协议服务器同步。\n\
  \n不需要更改 Installation Source（安装源）设置，因为安装是从本地介质执行的。要完成来自远程服务器的介质的安装，请选择“Installation\
  \ Source”，启用“On the network”（在网络）选项，然后指定安装介质的位置和使用的 URL 类型。例如，安装介质可以是安装在远程 Web 服务器上的\
  \ ISO 镜像，或者是本地网络上使用 NFS 的系统（NFS 文件共享的主题在名为“在 AlmaLinux 9 上使用 NFS 与远程系统共享文件”的章节中详细介绍），或者是远程仓库的\
  \ URL（仓库本质上是组成操作系统的软件、软件包和应用程序的在线集合，通过它们可以在本地系统进行安装）。\n\n默认情况下，安装程序将对 AlmaLinux\
  \ 9 执行带 GUI 的服务器安装。要选择不同的配置，选择“Software Selection”（软件选择）选项以显示下面的屏幕：\n\n![](img/rocky_linux_install_software.png)\n\
  \n图 3-11\n\n使用左侧面板选择基本配置，使用右侧面板添加你确定在系统启动后需要的任何额外软件包。如果不需要桌面环境且你不确定要在系统上安装哪些包，请使用“Minimal\
  \ install”（最小化安装）选项，并在启动后根据需要安装额外的包。这避免了安装任何可能永远需要的包。\n\n“Security Policy”（安全策略）选项允许在系统上安装额外的安全软件包，从而对系统施加符合安全内容自动化协议（SCAP）标准的安全限制。虽然从列表中选择配置文件（profile）会安装必要的包，但在运行的系统上启用它们之前，策略限制将不会被执行。\n\
  \nKdump 功能在启用时，会在系统崩溃时写操作系统内核的状态。此转储文件可以帮助识别崩溃原因，但在启用时会占用系统内存。除非你的系统内存有限，否则可以保持启用状态。\n\
  \n配置好基本设置后，下一步是决定如何划分硬盘以容纳操作系统。\n\n## 3.5 为 AlmaLinux 9 分区\n\n当选择“Installation Destination”（安装目标）选项时，安装程序将显示一个类似于下方图\
  \ 3-12 所示的屏幕：\n\n![](img/almalinux_9_install_disk_selection.png)\n\n图 3-12\n\n默认情况下，安装程序配置为使用当前选择磁盘驱动器的可用空间自动安装操作系统，并配置标准的分区大小。如果磁盘之前包含另一个操作系统，这些现有分区不会被删除，在\
  \ AlmaLinux 9 安装后，磁盘上可能会留下未使用的空间。要删除任何现有分区以便 AlmaLinux 9 回收并使用，请启用“I would like\
  \ to make additional space available”（我想提供更多空间）选项并点击“Done”（完成）按钮，显示图 3-13 所示的对话框：\n\
  \n![](img/rhel9_install_reclaim_space.png)\n\n图 3-13\n\n\n\n\n\n要回收空间，请选择不再需要的分区，并点击\
  \ `Delete` 按钮将其标记为删除。一旦选中了所有要删除的分区，点击 `Reclaim Space` 按钮执行删除操作。回收的空间现在将由 AlmaLinux\
  \ 9 安装程序自动使用。\n\n若要根据可用空间的分配方式手动配置磁盘布局，请将 `Storage Allocation` 设置从 `Automatic` 更改为\
  \ `Custom` 并点击 `Done` 显示手动分区界面（如图 3-14）：\n\n![](img/almalinux_9_install_manual_partitioning.png)\n\
  \n图 3-14\n\n手动分区界面允许使用逻辑卷管理 (`LVM`）或标准分区来配置磁盘。`LVM` 是推荐的选项，因为它在系统运行后，管理分区大小方面提供了灵活性（LVM\
  \ 将在名为“向 AlmaLinux 9 卷组和逻辑卷中添加新磁盘”的章节中详细介绍）。\n\n一旦选定了分区方案，最后一步是决定分区的大小以及相应的文件系统挂载点。通常，`Click\
  \ here to create them automatically` 提供的默认配置可以满足大多数系统需求。然而，若要手动创建分区并分配挂载点，请点击 `+`\
  \ 按钮手动声明并分配每个分区。\n\n另一个选项是选择自动分区，然后使用生成的界面根据需要手动更改分区配置。例如，图 3-15 显示了通过选择自动创建选项定义的分区配置，并在对磁盘进行任何更改之前修改每个分区的设置：\n\
  \n![](img/almalinux_9_install_lvm.png)\n\n图 3-15\n\n磁盘配置完成后，点击 `Done`，检查对磁盘进行的更改摘要（如图\
  \ 3-16），然后点击 `Accept Changes` 按钮：\n\n![](img/almalinux_9_install_lvm_summary.png)\n\
  \n图 3-16\n\n## 3.6 磁盘加密\n\nAlmaLinux 9 还允许通过加密保护磁盘内容。这将在每次系统启动时要求输入密码。要启用加密，请在主安装目标界面上选择\
  \ `Encrypt my data` ，并在点击 `Done` 按钮后，在图 3-17 所示的对话框中输入密码：\n\n![](img/rhel_8_installation_disk_encryption.png)\n\
  \n图 3-17\n\n## 3.7 用户设置\n\n在完成安装之前，必须创建一个 root 密码和一个可选的用户账户。root（或超级用户）账户是系统上具有管理权限的特殊用户。虽然你通常使用自己的账户登录系统，但在配置系统和执行其他管理任务时需要\
  \ root 权限。\n\n选择 `Root Password` 选项并输入足够安全的密码。还有选项可以锁定 root 账户使其无法访问，以及允许通过密码验证通过远程连接访问\
  \ root 账户。通常，建议保持 root 账户解锁状态，但禁止使用密码进行远程 SSH 访问。如果需要远程 root 访问，应使用 SSH 密钥身份验证来实现，我们将在本书的“在\
  \ AlmaLinux 9 上配置基于密钥的身份验证”章节中涵盖这一主题。\n\n接下来，选择 `User Creation` 选项并输入用户名和密码。如果你希望此用户能够使用\
  \ `sudo` 命令执行管理任务，请勾选 `Make this user administrator` 复选框。如果未启用此选项，用户必须使用 `su` 命令并输入\
  \ root 密码来获得 root 权限（假设未启用上述锁定 root 账户的选项）。如果你添加的用户需要执行管理任务，推荐使用 `sudo`，并启用该复选框。\n\
  \n## 3.8 物理安装\n\n在选择适当软件包后，点击 `Begin Installation` 将开始分区磁盘并安装符合所选安装设置的软件包。在此阶段，将出现如图\
  \ 3-18 所示的安装进度界面：\n\n![](img/almalinux_9_installing.png)\n\n图 3-18\n\n所有系统软件包安装并配置完成后，移除安装媒体并点击\
  \ `Reboot System` 重启系统。\n\n## 3.9 最终配置步骤\n\n系统启动时控制台上出现的内容取决于从软件选择界面中选择了哪个选项。如果在安装期间选择了\
  \ GUI 选项，将出现 GNOME 显示管理器 (`GDM`) 登录界面。相反，如果选择了最小或服务器配置选项，将显示基于文本的登录提示。无论配置如何，请作为安装过程最后步骤中创建的用户登录系统。\n\
  \n在 GUI 安装的情况下，GNOME 初始设置工具将启动并提供桌面环境的引导导览。\n\n## 3.10 安装更新\n\n与当今大多数操作系统一样，AlmaLinux\
  \ 发行版的每个版本在公开发后都会继续演进。这通常表现为错误修复、安全更新，以及偶尔可以从互联网下载并安装到系统中的新功能。\n\n最佳实践规定，安装 AlmaLinux\
  \ 9 后的第一步是确保将任何可用更新应用到系统。这可以通过 Terminal 窗口中的命令行提示符使用 `dnf` 软件包管理器来实现。要检查可用更新，请运行以下命令：\n\
  \n```bash\ndnf check-update\n```\n\n再次使用 `dnf` 工具应用任何待处理更新：\n\n```bash\ndnf update\n\
  ```\n\n执行后，`dnf` 工具将提供可用更新的软件包列表，并请求许可执行更新。\n\n更新完成后，安装基本完成，AlmaLinux 9 已准备好使用。\n\
  \n## 3.11 显示启动消息\n\n在启动过程中，AlmaLinux 9 将显示 Red Hat 图形启动 (`RHGB`) 屏幕，该屏幕会隐藏系统加载时生成的所有启动消息。若要在启动过程中显示这些消息（如图\
  \ 3-19 所示），请在系统启动时按下键盘上的 `Esc` 键：\n\n![](img/rhel_9_boot_messages.png)\n\n图 3-19\n\
  \n编辑 `/etc/default/grub` 文件并更改 `GRUB_CMDLINE_LINUX` 设置可以更改默认行为，该设置默认类似于如下：\n\n```\n\
  GRUB_CMDLINE_LINUX=\"... rhgb quiet\"\n```\n\n若要移除图形启动界面以便无需按 `Esc` 键即可看到消息，请从设置中移除\
  \ `rhgb` 选项：\n\n```\nGRUB_CMDLINE_LINUX=\"... rhgb quiet\"\n```\n\n此更改将导致系统仅显示部分生成的启动消息。要显示系统生成的所有消息，请同时移除\
  \ `quiet` 选项：\n\n```\nGRUB_CMDLINE_LINUX=\"... quiet\"\n```\n\n完成更改后，运行以下命令生成新的启动配置，以便在下次系统启动时生效：\n\
  \n```bash\ngrub2-mkconfig --output=/boot/grub2/grub.cfg\n```\n\n## 3.12 总结\n\n\n\
  \n\n使用 AlmaLinux 9 的第一步是安装操作系统。对于云端服务器，此任务通常在根据云服务提供商提供的系列选项为系统选择操作系统镜像时自动完成。然而，在您自己的硬件上安装则涉及下载为\
  \ ISO 镜像格式的安装介质，将该镜像写入合适的存储设备（如 DVD 或 USB 驱动器），并从其启动。一旦运行，安装过程允许配置一系列选项，包括网络设置、安装应从本地介质还是通过远程服务器或存储库进行、要安装的软件包以及磁盘分区。安装完成后，重要的是安装任何自原始安装镜像创建以来发布的操作系统更新。\n\
  \n# 4. 与 Windows 双启动 AlmaLinux 9\n\n与大多数 Linux 发行版一样，AlmaLinux 9 能够非常乐意地与几乎任何版本的\
  \ Windows（最高到 Windows 11）共存在硬盘驱动器（HDD）上。这种概念被称为“双启动”。当您启动系统时，将看到一个菜单，提供启动 AlmaLinux\
  \ 9 安装系统或 Windows 的选项。显然，您一次只能运行一个操作系统。尽管如此，值得注意的是，无论您的 Windows 分区是使用 NTFS、FAT16\
  \ 还是 FAT32 格式化的，硬盘驱动器上 Windows 分区中的文件都可以从 AlmaLinux 9 使用。\n\n这种安装方法涉及缩小现有 Windows\
  \ 分区的大小，然后将 AlmaLinux 9 安装到回收的空间中。本章假设 AlmaLinux 9 正安装在当前运行 Windows 11 的系统上。\n\n\
  ## 4.1 调整分区大小\n\n为了在已包含 Windows 安装的磁盘驱动器上容纳 AlmaLinux 9，第一步涉及缩小 Windows 分区以腾出空间。建议的做法是在尝试安装\
  \ AlmaLinux 9 之前，使用 Windows 磁盘管理界面减小分区大小。\n\n要在 Windows 11 上访问磁盘管理，右键点击开始菜单，并从生成的菜单中选择图\
  \ 4-1 所示所示的选项：\n\n![](img/windows_start_menu.png)\n\n图 4-1\n\n加载后，磁盘管理工具将显示系统上检测到的磁盘驱动器的图形表示：\n\
  \n![](img/windows_disk_management.png)\n\n图 4-2\n\n右键点击您想要缩小大小的分区，并从弹出菜单中选择 `收缩卷...`。工具将计算在不丢失数据的情况下卷大小可以减小的最大量（此过程取决于分区的总大小，可能需要几分钟）。一旦分析完成，将出现与下方图\
  \ 4-3 所示类似的对话框：\n\n![](img/windows_shrink_partition.png)\n\n图 4-3\n\n在 `输入收缩的空间量（MB）`\
  \ 字段中指定一个值，并点击 `收缩` 按钮继续。一旦调整操作完成，使用 AlmaLinux 9 安装介质重启系统（如“在空白磁盘驱动器上安装 AlmaLinux\
  \ 9”所述），并使用新的空空间进行安装。在 AlmaLinux 9 安装过程中，可以通过在“安装摘要”屏幕上选择 `安装目标` 选项并确保选择了 `自动存储配置`\
  \ 选项来实现。这将 AlmaLinux 9 自动安装到 Windows 分区缩小后创建的未分配空间中。\n\n一旦完成磁盘上的 AlmaLinux 9 并重启系统，将出现标准的\
  \ AlmaLinux 9 启动菜单，其中包含启动 Windows 系统的额外选项：\n\n![](img/almalinux_9_grub_windows.png)\n\
  \n图 4-4\n\n## 4.2 更改默认启动选项\n\n系统启动时，会出现启动选项屏幕，并等待 5 秒让用户选择操作系统。如果在超时结束之前未进行任何选择，将启动默认操作系统。在新配置的系统上，默认操作系统将是标准（非救援）的\
  \ AlmaLinux 9 镜像。然而，可以在 AlmaLinux 9 内部更改此默认值。\n\n一系列启动配置选项（包括 5 秒超时和“在空白磁盘驱动器上安装\
  \ AlmaLinux 9”中列出的启动 RHGB 设置）在 `/etc/default/grub` 文件中声明，新安装的读取内容如下：\n\n```\nGRUB_TIMEOUT=5\n\
  GRUB_DISTRIBUTOR=\"$(sed 's, release .*$,,g' /etc/system-release)\"\nGRUB_DEFAULT=saved\n\
  GRUB_DISABLE_SUBMENU=true\nGRUB_TERMINAL_OUTPUT=\"console\"\nGRUB_CMDLINE_LINUX=\"\
  crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M resume=/dev/mapper/almalinux-swap rd.lvm.lv=almalinux/root\
  \ rd.lvm.lv=almalinux/swap rhgb quiet\"\nGRUB_DISABLE_RECOVERY=\"true\"\nGRUB_ENABLE_BLSCFG=true\n\
  ```\n\n更改默认启动系统的第一步是在此文件中声明 `GRUB_SAVEDEFAULT` 设置：\n\n```\nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR=\"\
  $(sed 's, release .*$,,g' /etc/system-release)\"\nGRUB_DEFAULT=saved\nGRUB_SAVEDEFAULT=true\n\
  ```\n\n此设置将在启动配置中保存一个新的默认值。接下来，运行 `grub2-set-default` 命令，使用将第一个选项计为 0 的数字系统更改默认设置。例如，如果\
  \ Windows 11 选项是菜单中的第 3 个，则将 Windows 11 设置为默认启动选项的命令如下：\n\n```bash\n# grub2-set-default\
  \ 2\n```\n\n运行以下命令检查新设置是否生效：\n\n```bash\n# grub2-editenv list\nsaved_entry=2\nmenu_auto_hide=1\n\
  boot_success=1\nboot_indeterminate=0\n```\n\n注意 `saved_entry` 值现在已设置为 Linux 启动分区。更改默认值后，如下所示重新生成启动配置文件：\n\
  \n```bash\n# grub2-mkconfig --output=/boot/grub2/grub.cfg\n```\n\n重启系统并验证启动菜单默认选择\
  \ Windows 选项，并且 Windows 在超时后加载。\n\n## 4.3 从 AlmaLinux 9 访问 Windows 分区\n\n在双启动配置下运行\
  \ AlmaLinux 9 时，可以通过命令行手动挂载分区来访问位于 Windows 分区上的文件。在此之前，需要在系统中安装一些额外的软件包。首先，需要下载并安装\
  \ `fuse` 内核模块：\n\n```bash\n# dnf install fuse\n# modprobe fuse\n```\n\n接下来需要安装 Fuse\
  \ NTFS 驱动。遗憾的是，该软件包未包含在标准的 AlmaLinux 9 中，因此需要如下所示向系统添加企业 Linux 额外软件包 (EPEL) 仓库：\n\
  \n```bash\n# dnf config-manager --set-enabled crb\n# crb enable\n# dnf install \\\
  \n  https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch \\\n  https://dl.fedoraproject.org/pub/epel/epel-next-release-9.noarch\n\
  ```\n\n添加 EPEL 仓库后，现在可以安装驱动程序：\n\n```bash\n# dnf install ntfs-3g\n```\n\n一旦安装了所需的软件包，下一步是创建一个目录作为\
  \ Windows 分区的挂载点。在本例中，我们将创建一个名为 `/mnt/windows` 的目录：\n\n```bash\n# mkdir /mnt/windows\n\
  ```\n\n使用以下 `fdisk` 命令识别分配给 Windows 分区的设备名称：\n\n```bash\n# fdisk -l\n```\n\n```Device\
  \ Start End Sectors Size Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n\
  /dev/nvme0n1p2 206848 239615 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616\
  \ 49362943 49123328 23.4G Microsoft basic data\n/dev/nvme0n1p4 132933632 134213631\
  \ 1280000 625M Windows recovery environment\n/dev/nvme0n1p5 49362944 51460095 2097152\
  \ 1G Linux filesystem\n```\n\n\n\n\n```\n/dev/nvme0n1p6 51460096 132933631 81473536\
  \ 38.8G Linux LVM\n```\n\n在上述输出中，包含我们需要访问的文件的主 Windows 分区由 `/dev/nvme0n1p3` 表示。接下来，我们需要运行\
  \ `mount` 命令（假设 Windows 分区为 `/dev/nvme0n1p3`），如下所示：\n\n```bash\nmount /dev/nvme0n1p3\
  \ /mnt/windows\n```\n\n通过列出挂载点顶层目录的内容来检查挂载是否成功：\n\n```bash\nls /mnt/windows\n```\n\
  \n```\n'$Recycle.Bin' ProgramData swapfile.sys\n'Documents and Settings' 'Program\
  \ Files' 'System Volume Information'\n pagefile.sys 'Program Files (x86)' Users\n\
  PerfLogs Recovery Windows\n```\n\n为了在每次系统启动时自动挂载，请向 `/etc/fstab` 文件中添加相应的挂载行：\n\n\
  ```\n/dev/nvme0n1p3 /mnt/windows ntfs defaults 0 0\n```\n\n要随时卸载 Windows 文件系统：\n\
  \n```bash\numount /mnt/windows\n```\n\n## 4.4 总结\n\nAlmaLinux 9 可以通过创建双启动环境，与 Windows\
  \ 操作系统在同一磁盘驱动器上安全共存。这涉及到在执行安装之前，缩小 Windows 系统的空间为 AlmaLinux 9 腾出空间。一旦安装了 AlmaLinux\
  \ 9，必须修改启动菜单配置以包含从 Windows 启动的选项。要从 AlmaLinux 9 内部访问 Windows 文件系统，必须安装 Fuse NTFS\
  \ 驱动程序并使用它挂载 Windows 分区。\n\n# 5. 将 Windows 磁盘分区分配给 AlmaLinux 9\n\n在上一节中，我们查看了在与\
  \ Windows 相同的磁盘上安装 AlmaLinux 9 方法。这种所谓的“双启动”配置允许用户在单个磁盘驱动器上安装两个操作系统，并在系统通电时提供启动其中一个的选项。\n\
  \n本章节适用于那些决定足够喜欢 AlmaLinux 9，从而完全从磁盘上删除 Windows 并并将空间用于 Linux 的用户。在接下来的章节中，我们将结合使用命令行工具和\
  \ gnome-disks 实用程序逐步完成这一过程。\n\n## 5.1 卸载 Windows 分区\n\n如果已按照“与 Windows 双启动 Ubuntu”章节中的步骤，在\
  \ AlmaLinux 9 内部挂载了 Windows 分区，则在继续本章节之前应采取措施卸载该分区。假设 Windows 分区已挂载为 `/mnt/windows`，可以如下进行卸载：\n\
  \n```bash\numount /mnt/windows\n```\n\n如果之前添加了 `/mnt/windows` 自动挂载，也应编辑 `/etc/fstab`\
  \ 文件将其删除。\n\n## 5.2 从磁盘上删除 Windows 分区\n\n为 AlmaLinux 9 释放 Windows 分区的第一步是删除该分区。但在在此之前，必须从\
  \ Windows 和 AlmaLinux 9 分区备份任何需要保留的数据。完成这些后，即可安全地进行本章节。\n\n要删除 Windows 分区，我们首先需要使用\
  \ `fdisk` 工具识别它们所在的磁盘：\n\n```bash\nfdisk -l\n```\n\n```\nDisk /dev/nvme0n1: 64 GiB,\
  \ 68719476736 bytes, 134217728 sectors\nDisk model: VMware Virtual NVMe Disk\nUnits:\
  \ sectors of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512\
  \ bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisklabel type: gpt\n\
  Disk identifier: 7A38CD86-091E-4781-BFB0-928FD383C935\nDevice Start End Sectors\
  \ Size Type\n/dev/nvme0n1p1 2048 206847 204800 100M EFI System\n/dev/nvme0n1p2 206848\
  \ 239615 32768 16M Microsoft reserved\n/dev/nvme0n1p3 239616 49362943 49123328 23.4G\
  \ Microsoft basic data\n/dev/nvme0n1p4 132933632 134213631 1280000 625M Windows\
  \ recovery environment\n/dev/nvme0n1p5 49362944 51460095 2097152 1G Linux filesystem\n\
  /dev/nvme0n1p6 51460096 132933631 81473536 38.8G Linux LVM\n```\n\n在上述示例输出中，系统包含一个由设备名称\
  \ `/dev/nvme0n1` 引用的物理磁盘。在该磁盘驱动器上，六个分区分别通过设备名称 `/dev/nvme0n1p1` 到 `/dev/nvme0n1p`\
  \ 访问。根据 `Types` 列中的值，存在三个与 Windows 相关的分区。第一个是 Windows 系统分区，第二个大得多的分区是包含 Windows\
  \ 操作系统和用户数据的 Windows 启动分区，最后是 Windows 恢复分区。\n\n要删除分区，请使用包含该分区的磁盘设备名称（在本例中为 `/dev/nvme0n1`）启动\
  \ `fdisk` 工具，并按照指令再次显示分区和扇区信息：\n\n```bash\nfdisk /dev/nvme0n1\n```\n\n```\nWelcome\
  \ to fdisk (util-linux 2.37.4).\nChanges 将仅保留在内存中，直到你决定写入它们。\n在使用 write 命令前要小心。\n\
  Command (m for help): p\nDisk /dev/nvme0n1: 64 GiB, 68719476736 bytes, 134217728\
