  \ `ip` 命令可能会得到如下输出：\n\n（此处内容与上方 `ip a` 输出一致）\n\n新的容器网络使用以下语法创建：\n\n`podman network\
  \ create <name>`\n\n例如，创建一个名为 `demonet` 的新网络，将使用以下命令：\n\n```bash\npodman network\
