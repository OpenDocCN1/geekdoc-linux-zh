  \ has been altered.\nSyncing disks.\n```\n\n要提交更改，现在我们需要将新的分区信息写入磁盘并退出 `fdisk` 工具：\n\
  \n```\nCommand (m for help): w\nThe partition table has been altered.\nSyncing disks.\n\
  ```\n\n## 5.3 格式化未分配的磁盘分区\n\n\n\n\n为了使新分区适用于 AlmaLinux 9 使用，需要在其上创建一个文件系统。当前版本 AlmaLinux\
  \ 推荐的文件系统类型是 XFS，相关细节将在名为“向 AlmaLinux 9 系统添加新硬盘”的章节中进行详细介绍。使用 `mkfs.xfs` 命令按如下方式进行文件系统的创建：\n\
  \n```\nmkfs.xfs -f /dev/nvme0n1p2\n\nmeta-data=/dev/nvme0n1p2 isize=512 agcount=4,\
  \ agsize=1536128 blks\n            = sectsz=512 attr=2, projid32bit=1\n        \
  \    = crc=1 finobt=1, sparse=1, rmapbt=0\n            = reflink=1 bigtime=1 inobtcount=1\n\
  data = bsize=4096 blocks=6144512, imaxpct=25\n            = sunit=0 swidth=0 blks\n\
  naming =version 2 bsize=4096 ascii-ci=0, ftype=1\nlog =internal log bsize=4096 blocks=3000,\
  \ version=2\n            = sectsz=512 sunit=0 blks, lazy-count=1\nrealtime =none\
  \ extsz=4096 blocks=0, rtextents=0\n```\n\n## 5.4 挂载新分区\n\n接下来，我们需要挂载新分区。在示例中，我们将将其挂载到名为\
  \ `/data` 的目录中。不过，你可以自由使用任何所需的有效挂载点来挂载新分区，或将其作为逻辑卷的一部分（相关细节将在名为“向 AlmaLinux 9 卷组和逻辑卷添加新硬盘”的章节中介绍）。首先，我们需要创建一个作为挂载点的目录：\n\
  \n```\nmkdir /data\n```\n\n其次，我们需要编辑 `/etc/fstab` 中的挂载表，以便该分区在每次系统启动时都能自动自动挂载。在\
  \ `/etc/fstab` 文件的末尾添加以下行来挂载新分区（请根据你的环境修改 `/dev/nvme0n1p2` 设备）：\n\n```\n/dev/nvme0n1p2\
  \ /data xfs defaults 0 0\n```\n\n最后，我们可以手动挂载新分区（注意，在随后的重启中不需要这样做，因为由于我们之前在 `/etc/fstab`\
  \ 文件中添加的设置，分区将自动挂载）：\n\n```\nmount /data\n```\n\n要检查分区，运行以下命令显示可用空间：\n\n```\ndf\
  \ -h /data\nFilesystem Size Used Avail Use% Mounted on\n/dev/nvme0n1p2 24G 200M\
  \ 24G 1% /data\n```\n\n## 5.5 修改启动菜单\n\n下一步是修改 AlmaLinux 启动菜单。由于这原初是一个双启动系统，因此菜单被配置为允许启动\
  \ Windows 或 AlmaLinux。现在 Windows 分区已经删除，我们必须移除此启动选项。在 AlmaLinux 上，可以通过以下步骤实现此目标：\n\
  \n```\nrm -rf /boot/efi/EFI/Microsoft\ngrub2-mkconfig --output=/boot/grub2/grub.cfg\n\
  ```\n\n## 5.6 使用 GNOME 磁盘工具\n\n`gnome-disks` 工具提供了一个用户友好的图形化界面，用于从命令行回收 Windows\
  \ 分区。由于此处使用的示例将把 Windows NTFS 分区转换为 XFS 格式，第一步是按照如下方式安装 `xfsprogs` 包：\n\n```\ndnf\
  \ install xfsprogs\n```\n\n安装好包后，打开终端窗口并启动 `gnome-disks` 工具：\n\n```\ngnome-disks\n\
  ```\n\n稍等片刻，`gnome-disks` 工具将如图 5-1 所示所示：\n\n![](img/gnome_disks_main.png)\n\n图\
  \ 5-1\n\n在上面的示例中，磁盘包含两个需要删除的 Windows NTFS 分区。磁盘图中显示带有星号的任何 NTFS 分区（如上图高亮的分区所示）在删除之前必须先卸载。这可以通过选择分区并点击下图中图\
  \ 5-2 所示的卸载按钮来实现：\n\n![](img/gnome_disks_unmount_button.png)\n\n图 5-2\n\n所有 NTFS\
  \ 分区都卸载后，下一步是删除它们。选择磁盘中最左侧的 NTFS 分区，并点击如图 5-3 所示的删除按钮：\n\n![](img/gnome_disks_delete_button.png)\n\
  \n图 5-3\n\n在点击删除按钮提交更改之前，请检查确认对话框中的信息。一旦删除了第一个分区，对任何剩余的 NTFS 分区重复此步骤。一旦删除了 NTFS\
  \ 分区，磁盘中的空间应显示为空闲。现在需要创建一个新分区来使用这些空闲空间。选中空间后，点击新分区按钮（如图 5-4 中的箭头所示）：\n\n![](img/gnome_disks_create_button.png)\n\
  \n图 5-4\n\n在“创建分区”对话框中，选择分区是应占据所有可用空间，还是在计划将该空间用于多个分区时减小尺寸：\n\n![](img/gnome_disks_create_partition.png)\n\
  \n图 5-5\n\n点击“下一步”，并在后续屏幕上为新分区输入名称，并选择在创建期间应擦除分区。这会导致创建过程花费更多时间，但这是一个推荐的选项。最后，为卷输入名称并选择文件系统类型。这通常是\
  \ ext4 或 XFS。考虑到 XFS 的优势，在点击“下一步”按钮之前选择“其他”。\n\n![](img/gnome_disks_format_volume.png)\n\
  \n图 5-6\n\n在下一个屏幕上，在点击“创建”按钮之前选择 XFS 选项：\n\n![](img/gnome_disks_custom_format.png)\n\
  \n图 5-7\n\n`gnome-disks` 工具将开始格式化过程并显示状态：\n\n![](img/gnome_disks_formatting.png)\n\
  \n图 5-8\n\n分区准备好后，可以使用命令行或 `gnome-disks` 工具进行挂载。要配置挂载点，选择分区并点击如图 5-9 所示的设置按钮：\n\n\
  ![](img/gnome_disks_settings_button.png)\n\n图 5-9\n\n从设置菜单中选择编辑挂载选项...显示如图 5-10\
  \ 所示的对话框：\n\n![](img/gnome_disks_mount_option.png)\n\n图 5-10\n\n关闭用户默认开关，并根据你的需求配置挂载点。在上面的图中，分区在系统启动时挂载到\
  \ `/data`。\n\n设置完成后，点击确定，然后点击如图 5-11 所示的挂载按钮：\n\n![](img/gnome_disks_mount_button.png)\n\
  \n图 5-11\n\n要检查分区现在已挂载并可以使用，运行以下命令显示可用空间：\n\n```\ndf -h /data\nFilesystem Size Used\
  \ Avail Use% Mounted on\n/dev/nvme0n1p3 17G 152M 17G 1% /data\n```\n\n最后，按照本章较早概述的步骤更新启动菜单以移除\
  \ Windows 。\n\n## 5.7 总结\n\n双启动配置中的 Windows 分区可以随时删除，通过识别哪些分区属于 Windows 并删除它们，可以为\
  \ AlmaLinux 9 系统释放空间。删除后，可以使用空闲空间创建新文件系统并进行挂载以便使用。\n\n# 6. GNOME 40 桌面指南\n\nAlmaLinux\
  \ 9 包含了 GNOME 40 桌面环境。不像 Windows 和 macOS 桌面那样复杂，GNOME 40 提供了一个简洁直观的桌面环境，提供了窗口环境的所有功能，并且优点是易于学习。\n\
  \n在本章中，将涵盖 GNOME 桌面的主要功能，并概述基本任务的操作方法。\n\n## 6.1 安装 GNOME 桌面\n\n如果在安装 AlmaLinux\
  \ 9 的过程中选择了工作站或带有 GUI 的服务器软件配置，则 GNOME 桌面将已安装，并在每次系统启动时自动启动。\n\n\n\n\n如果在 AlmaLinux\
  \ 9 安装过程中选择了任何其他软件配置，则系统安装的软件包中将不会包含 `GNOME` 桌面。对于没有连接显示器的服务器级系统来说，安装图形化桌面环境可能看起来是多此一的。然而，值得注意的是，远程访问\
  \ `GNOME` 桌面也是可行的；即使在无头服务器（即缺少显示器、键盘和鼠标的服务器）上，安装 `GNOME` 桌面软件包可能仍有益。关于建立远程桌面访问的话题将在本书的“使用\
  \ VNC 访问 AlmaLinux 9 桌面”章节详细介绍。\n\n如果安装配置未包含 `GNOME` 桌面，可以使用以下命令随时进行安装：\n\n```bash\n\
  dnf groupinstall workstation\n```\n\n`Workstation` 组是多个可用安装的包组之一。运行以下命令查看所有可用和已安装的包组列表：\n\
  \n```bash\n$ dnf grouplist\n```\n\n`dnf grouplist`\n\n可用环境组：\n- Server（服务器）\n- Minimal\
  \ Install（最小化安装）\n- Workstation（工作站）\n- Virtualization Host（虚拟化主机）\n- Custom Operating\
  \ System（自定义操作系统）\n\n已安装环境组：\n- Server with GUI（带 GUI 的服务器）\n\n已安装组：\n- Container\
  \ Management（容器管理）\n- Headless Management（无头管理）\n\n安装完成后，可以如下从显示器上的命令行提示符启动桌面环境：\n\
  \n```bash\n$ startx\n```\n\n运行以下命令可以在重启时自动启动桌面环境（我们将在“管理 AlmaLinux 9 systemd ”](#Systemd_Targets_and_States.xhtml__idTextAnchor212)中详细探讨此命令）：\n\
  \n```bash\nsystemctl isolate graphical.target\n```\n\n## 6.2 GNOME 40 桌面概述\n\n图\
  \ 6-1 所示屏幕显示了在启动任何其他程序或更改配置之前，典型的新启动 `GNOME` 桌面会话的外：\n\n![](img/almalinux_desktop.png)\n\
  图 6-1\n\n主桌面区域（标记为 A）是启动应用程序和实用程序时窗口出现的地方与其他桌面环境不同，无法将文件或应用程序拖放到桌面，这提供了一个整洁且不杂乱的工作空间。\n\
  \n屏幕顶部的栏（B）称为 `top bar`（顶栏）。它包含 `Activities` 菜单（C）、日期和时间（B）以及一组状态图标（D），点击这些图标会显示一个包含更多选项的菜单。\n\
  \n此外，运行在桌面上的当前活动应用程序的应用程序菜单也会出现在顶栏中。例如，图 6-2 显示了 `Terminal` 程序的应用程序菜单：\n\n![](img/almalinux_desktop_app_menu.png)\n\
  图 6-2\n\n## 6.3 活动概览\n\n应用程序和实用程序通过 `Activities Overview`（活动概览）启动可以通过点击顶栏中的 `Activities`\
  \ 按钮或按下键盘上的特殊键来显示。在 Windows 键盘上，这是 `Windows` 键；在 macOS 上是 `Command` 键；在 Chromebook\
  \ 上，是显示放大镜的键。\n\n显示时，`Activities Overview` 将类似于下方的图 6-3：\n\n![](img/almalinux_gnome_activities_overview.png)\n\
  图 6-3\n\n概览的中心区域（如上方图 6-3 中标记为 A）显示了所有当前打开的应用窗口。屏幕底部（B）是 `dashboard`（仪表板，也称为 `dash`），可以从中启动应用。默认情况下，`dash`\
  \ 将显示一组定义的常用应用程序的图标以及任何正在运行的应用程序的图标。如果应用程序正在运行，图标下方将显示一个点。要启动应用程序，只需点击 `dash` 中的图标即可。\n\
  \n要找到 `dash` 中未包含的应用程序，一种方法是选择右侧的网格图标（由九个点组成的正方形）以显示可浏览的应用程序列表，如图 6-4 所示：\n\n![](img/almalinux_gnome_app_grid.png)\n\
  图 6-4\n\n同样重要的是要意识到列表中的某些项目是包含其他应用程序的文件夹。可以通过拖放图标来重新定位网格中的项目。要将应用程序添加到文件夹中，请在网格中找到它并将其拖入文件夹。此外，拖动一个图标并将其释放到另一个图标上将创建一个包含这两个应用程序的新文件夹，并可以向该文件夹添加其他应用程序。\n\
  \n浏览应用程序的替代方案是使用搜索栏进行搜索（如上方图 6-3 中标记为 C），并在图中显示了操作过程：\n\n![](img/rhel_9_gnome_activities_search.png)\n\
  图 6-5\n\n随着在搜索框中输入文本，可能的匹配项列表将不断精炼。\n\n为了更方便地访问将应用程序添加到 `dash` 中，请找到应用程序的图标，右键点击它并选择\
  \ `Add to Favorites`（添加到收藏夹）菜单选项：\n\n![](img/almalinux_gnome_fav_menu.png)\n图 6-6\n\
  \n要从 `dash` 中移除应用程序，请右键点击 `dash` 中的图标并选择 `Remove from Favorites`（从收藏夹中移除）。或者，拖放图标进入或离开\
  \ `dash`。\n\n## 6.4 窗口管理\n\n与其他桌面环境一样，应用程序在 `GNOME` 中以窗口运行。当打开多个应用程序窗口时，`Super +\
  \ Tab` 快捷键将显示切换面板（图 6-7），允许选择不同的窗口（`Super` 键是 `Windows` 键，如果是 Mac 键盘，则是 `Cmd` 键）：\n\
  \n![](img/almalinux_switcher.png)\n图 6-7\n\n如果一个应用程序打开了多个窗口，切换器会将这些窗口显示在第二个面板中以便选择特定窗口：\n\
  \n![](img/almalinux_switcher_multiple.png)\n图 6-8\n\n要在切换器中的图标之间循环切换，使用快捷键。\n\n\
  要最大化窗口以填充整个屏幕，点击标题栏并将窗口拖到屏幕顶部。要恢复窗口的原始大小，点击标题栏并向下拖动。或者双击标题栏切换窗口大小。同样，将窗口拖到屏幕的左侧或右侧将使其填充屏幕的一半。\n\
  \n## 6.5 使用工作空间\n\n显示应用程序窗口的屏幕区域被称为 `workspace`（工作空间），GNOME 允许配置多个工作空间。要查看当前的工作空间，点击顶栏中的\
  \ `Activities`（如图 6-1 所示的 C）或按下键盘 `Super` 键显示以下屏幕：\n\n![](img/almalinux_gnome_workspaces.png)\n\
  图 6-9\n\n上方标记为 A 的区域是当前选择的工作空间。点击标记为 B 和 C 的区域将分别选择并显示上一个和下一个工作空间。中心工作空间面板（A）显示了当前活动的应用程序窗口。将鼠标指针悬停在窗口上将显示退出窗口按钮。要将窗口从一个工作空间移动到另一个，显示工作空间面板并将应用程序窗口拖放到目标工作空间。当窗口添加到空工作空间时，另一个空工作空间会被添加到工作空间面板，从而创建多个工作空间。\n\
  \n工作空间缩略图（D）提供了切换工作空间的方便方法，在处理许多工作空间时特别有用。\n\n要删除工作空间，要么关闭该工作空间上的所有窗口，要么将它们移动到另一个工作空间。\n\
  \n显示应用程序屏幕也提供了访问当前工作空间的接口，如下图 6-10 所示：\n\n\n\n\n\n![](img/almalinux_gnome_workspace_thumbnails.png)\n\
  图 6-10\n\n## 6.6 日历与通知\n\n当系统需要通知你某个事件（例如系统或应用程序更新可用）时，工作区顶部会弹出一个弹出面板。此外，通过点击顶栏上的日期和时间可以访问日历和任何之前的通知，如图\
  \ 6-11 所示：\n\n![](img/rhel_9_gnome_date_time.png)\n图 6-11\n\n## 6.7 GNOME 桌面设置\n\
  \n要访问“设置”应用程序，点击顶栏右侧的图标行并选择“设置”，如图 6-12 所示：\n\n![](img/almalinux_gnome_settings_menu.png)\n\
  图 6-12\n\n“设置”应用程序提供了许多选项，以太网和 WiFi 连接、屏幕背景自定义选项、屏幕锁定和电源管理控制以及语言偏好。要探索每个类别中的可用设置，请从“设置”窗口左侧面板选择一个选项：\n\
  \n![](img/almalinux_gnome_settings.png)\n图 6-13\n\n上述图 6-11 中显示的菜单还包括切换用户、调整音量、更改到不同的\
  \ WiFi 网络以及注销、重启或关闭系统的选项。\n\n## 6.8 基础自定义之外\n\nGNOME 40 桌面在设计上是一个简洁且不杂的环境，自定义选项极少。然而，对桌面进行额外的更改是可行的。GNOME\
  \ 项目开发了一个名为 GNOME Tweaks 的工具来实现此目的。请使用以下命令安装并运行该工具：\n\n```bash\ndnf install gnome-tweaks\n\
  gnome-tweaks\n```\n\n一旦 GNOME Tweaks 加载，将出现如图 6-14 所示的界面：\n\n![](img/almalinux_gnome_tweaks.png)\n\
  图 6-14\n\n现在可以使用广泛的桌面自定义选项。由于选项过多，本章无法全部涵盖，因此在继续后续章节之前，请先尝试这些设置。\n\n## 6.9 安装 GNOME\
  \ 桌面应用\n\n任何桌面环境如果没有应用商店都是不完整的，GNOME 桌面也不例外。GNOME 桌面的应用商店被称为“软件”（Software），可以从启动器（dash）中启动，如图\
  \ 6-15 所示：\n\n![](img/almalinux_gnome_software_dash.png)\n图 6-15\n\n一旦加载，“软件”应用程序将如图\
  \ 6-16 所示出现，允许你浏览并安装应用：\n\n![](img/almalinux_gnome_software.png)\n图 6-16\n\n## 6.10\
  \ 总结\n\nAlmaLinux 9 包含了 GNOME 40 桌面环境，该环境可能在初始安装期间包含，也可以以后使用 `dnf` 组包安装功能进行。与大多数其他桌面环境不同，GNOME\
  \ 40 旨在提供一个简洁且易于使用的窗口用户界面。GNOME 40 桌面的关键区域包括顶栏、活动概览和启动器。此外，GNOME 40 支持多个工作区，以保持运行中的应用程序井然有序并使屏幕整洁。“设置”应用程序中提供了各种配置选项，包括桌面背景设置、音频、网络配置和\
  \ WiFi 网络选择。\n\n# 7. Cockpit Web 界面概览\n\n尽管配备了最新的 Linux 桌面环境，但 AlmaLinux 9 很大程度上仍然服务器操作系统。因此，大多数\
  \ AlmaLinux 部署都是针对远程物理服务器或作为云端虚拟机实例运行的。不可避免的是，这些系统在没有键盘、鼠标或显示器的情况下运行，仅可以通过网络连接上的命令行提示符进行直接访问。这在从远程位置管理系统方面带来了挑战。虽然通过远程访问命令行和桌面环境确实可以实现许多功能，但对于在像\
  \ AlmaLinux 9 这样的企业级操作系统上必须每天执行的管理和监控任务，需要一个一致且统一的解决方案。\n\nCockpit 基于 Web 的管理界面提供了这种功能。本章将解释如何安装、配置和访问\
  \ Cockpit 界面，同时提供 Cockpit 关键特征的概述，其中许多特征将在后面的章节中进行更详细的介绍。\n\n## 7.1 Cockpit 概览\n\
  \nCockpit 是一个轻量级的 Web 界面，允许远程执行常规系统管理任务。安装并配置后，系统管理员打开本地浏览器窗口并导航到远程服务器上的 Cockpit\
  \ 端口。在浏览器中加载 Cockpit 界面并登录后，可以使用管理和监控工具可视化的方式执行广泛的任务。\n\n在后台，Cockpit 使用通常在命令行工作时使用的工具来执行任务，并自动更新以反映系统其他处的变化。这使得\
  \ Cockpit 可以与其他管理工具和技术配合，而无出现一种方法覆盖另一种方法的风险。Cockpit 还可以配置为访问多一台服务器，允许通过单个浏览器会话同时管理和监控多台服务器。\n\
  \nCockpit 默认安装并捆绑了一系列工具，并允许根据需要安装额外的扩展插件。Cockpit 的设计还允许你结合 HTML 和 JavaScript 创建自己的扩展，以添加缺失或自定义机功能。\n\
  \nCockpit 的模块化设计还允许许多功能嵌入到其他基于 Web 的应用程序中。\n\n## 7.2 安装并启用 Cockpit\n\nCockpit 通常默认没有安装在\
  \ AlmaLinux 9 上，但可以通过几个简单的步骤进行设置和启用。第一步按照如下方式安装 `cockpit` 包：\n\n```bash\ndnf install\
  \ cockpit\n```\n\n接下来，需要启用 `cockpit.socket` 服务：\n\n```bash\nsystemctl enable --now\
  \ cockpit.socket\n```\n\n最后，如果你的系统启用了防火墙，则需要在防火墙上打开必要的端口，以允许远程浏览器连接到达 Cockpit（有关防火墙的详情，请参阅“AlmaLinux\
  \ 9 防火墙基础所示的登录页面：\n\n![](img/almalinux_cockpit_login.png)\n图 7-1\n\n使用 root 或你的用户凭据登录\
  \ Cockpit 界面。注意，由于权限限制，以用户身份登录时 Cockpit 界面中的某些任务将受到限制。在这种情况下，Cockpit 控制台将显示名为“受限访问”的按钮，如图\
  \ 7-2 所示：\n\n![](img/almalinux_cockpit_limited_access.png)\n图 7-2\n\n要提升权限，点击受限访问按钮并在提示时输入你的密码：\n\
  \n![](img/rhel_cockpit_access_password.png)\n图 7-3\n\n登录后，Cockpit 将显示概览界面。\n\n\n\
  \n\n\n## 7.4 概述\n\n概述屏幕提供了当前系统的概览，包括对 CPU、内存、存储和网络活动性能指标的访问。此屏幕还包含有关系统的信息，包括底层硬件、主机名、系统时间以及系统软件是否为最新版本。此外还提供了重启或关闭系统的选项。\n\
  \n例如，图 7-4 显示了 Cockpit 界面的概述页：\n\n![](img/almalinux_cockpit_overview.png)\n\n图 7-4\n\
  \n如需有关特定类别的更多信息，请点击相应的链接。例如，图 7-5 显示了系统性能历史屏幕：\n\n![](img/rhel_cockpit_usage_metrics.png)\n\
  \n图 7-5\n\n## 7.5 日志\n\n当选择“日志”类别时，Cockpit 会显示 `systemd` 日志的内容。选择一个日志条目将显示整个日志消息。日志条目按时间排序，最新的在最上方，并包含菜单用于根据不同的时间跨度和消息严重程度过滤日志。\n\
  \n![](img/rhel_cockpit_logs.png)\n\n图 7-6\n\n## 7.6 存储\n\n选择“存储”选项来查看和管理系统上的存储，包括磁盘、分区、卷组、网络文件系统\
  \ (NFS) 挂载和 RAID 存储。此屏幕允许实时监控磁盘 I/O 活动，并列出用于查询和管理存储设备的系统 `udisksd` 服务的日志输出：\n\n\
  ![](img/rocky_cockpit_storage.png)\n\n图 7-7\n\n## 7.7 网络\n\n网络屏幕提供了各种网络相关配置和服务的信息，包括网络接口和防火墙设置。此外，它允许进行配置更改，例如创建网桥或设置虚拟网络：\n\
  \n![](img/rhel_cockpit_networking.png)\n\n图 7-8\n\n## 7.8 账户\n\n选择此选项查看配置在系统上的当前用户账户并为额外用户创建账户。用户管理的主题将在本章标题为\
  \ 管理 AlmaLinux 9 用户和组”的章节中介绍：\n\n![](img/rhel_cockpit_accounts.png)\n\n图 7-9\n\n\
  点击现有账户查看详情并进行更改。用户账户详情页还可用于向用户账户查看和添加公共 SSH 密钥，以便远程访问服务器，正如章节“在 AlmaLinux 9 上配置基于密钥的身份验证”](#SSH_Authentication.xhtml__idTextAnchor270)所示概述。\n\
  \n## 7.9 服务\n\n此屏幕显示运行在服务器上的系统服务列表，并允许对这些服务进行添加、删除、停止和启动。\n\n![](img/rhel_cockpit_services.png)\n\
  \n图 7-10\n\n服务的主题将在章节“管理 AlmaLinux 9 systemd 单元”](#Systemd_Targets_and_States.xhtml__idTextAnchor212)中进行详细介绍。\n\
  \n## 7.10 应用程序\n\n如前所述，可以作为扩展向 Cockpit 添加额外功能。这些扩展可以是自开发的扩展，也可以是第三方提供的扩展。应用程序屏幕列出了已安装的扩展，并允许添加或删除扩展：\n\
  \n![](img/rhel_cockpit_applications.png)\n\n图 7-11\n\n## 7.11 虚拟机\n\n虚拟化允许多个操作系统实例在单个计算机系统上同时运行，每个系统都运行在自己的虚拟机中。虚拟机\
  \ Cockpit 扩展提供了一种创建和管理安装在服务器上的虚拟机客户端的方法：\n\n![](img/rhel_8_cockpit_virtual_machines.png)\n\
  \n图 7-12\n\n虚拟机扩展默认不安装，但可以通过 Cockpit 应用程序屏幕或运行以下命令添加：\n\n```bash\ndnf install cockpit-machines\n\
  ```\n\n在 AlmaLinux 9 中使用虚拟化的内容将从章节“虚拟化技术概述”](#Virtualization_Overview.xhtml__idTextAnchor347)开始介绍。\n\
  \n## 7.12 软件更新\n\n如果系统有任何可用的软件更新，它们将列在此处，并可以从此屏幕进行安装：\n\n![](img/rhel_cockpit_updates.png)\n\
  \n图 7-13\n\n## 7.13 终端\n\n顾如名，终端屏幕提供了命令行提示符的访问：\n\n![](img/cockpit_terminal.png)\n\
  \n图 7-14\n\n## 7.14 连接到多台服务器\n\n可以配置 Cockpit 在单个会话中管理多台服务器。要向 Cockpit 会话添加另一个主机，请点击图\
  \ 7-15 中突出按钮以显示主机面板：\n\n![](img/cockpit_hosts.png)\n\n图 7-15\n\n点击“添加新主机 (Add new\
  \ host)”按钮，输入其他系统的 IP 地址或主机名，并选择一种颜色将此服务器与之前添加到 Cockpit 的任何服务器区分开，然后点击“添加 (Add)”按钮：\n\
  \n![](img/rhel_cockpit_add_new_host.png)\n\n图 7-16\n\n如果是第一次连接到远程服务器，Cockpit 将要求您接受新的\
  \ SSH 密钥。接受密钥后，将提示您输入上方图 7-16](#Ubuntu_Cockpit_Overview.xhtml__idTextAnchor173)中指定的用户名密码。还提供了设置并授权密码保护的\
  \ SSH 密钥的选项，以便下次需要访问第二台主机系统时能够自动登录：\n\n![](img/rhel_cockpit_remote_login.png)\n\n\
  图 7-17\n\n若要在主机之间切换，请显示主机面板（上方图 7-15](#Ubuntu_Cockpit_Overview.xhtml__idTextAnchor172)）并选择所需的系统。\n\
  \n## 7.15 启用存储的指标\n\n在标准安装中，Cockpit 不保留图表覆盖的短窗口之外的任何性能指标数据。为了保留 Cockpit 收集的数据，需要安装\
  \ Cockpit Co-Pilot (PCP) 包。按照如下方式开始安装 `cockpit-pcp` 包：\n\n```bash\ndnf install cockpit-pcp\n\
  ```\n\n安装 cockpit-pcp 后，注销当前 Cockpit 会话并重新登录。\n\n接下来，显示“性能指标”屏幕并点击“指标设置”按钮显示图 7-18](#Ubuntu_Cockpit_Overview.xhtml__idTextAnchor176)所示的屏幕，开启“收集指标\
  \ (Collect metrics)”选项并点击“保存 (Save)”：\n\n![](img/rhel_cockpit_collect_metrics.png)\n\
  \n图 7-18\n\n在 Cockpit 有了足够的时间收集数据后，指标信息将如图 7-19](#Ubuntu_Cockpit_Overview.xhtml__idTextAnchor178)所示出现，按小时块分类：\n\
  \n![](img/ubuntu_220.04_cockpit_stored_metrics.png)\n\n图 7-19\n\n## 7.16 总结\n\n\
  Cockpit Web 界面允许在浏览器内可视化地执行远程系统管理任务，而无需依赖提示符和命令行工具。一旦安装并启用，系统管理员只需打开浏览器，连接到远程服务器并登录\
  \ Cockpit 界面。在后台，Cockpit 使用与通过命令行提示符提供的相同的命令行工具，允许使用这两种方式而不会产生配置冲突的风险。此外，Cockpit\
  \ 使用模块化框架，允许添加额外的扩展并开发和集成自定义扩展。Cockpit 会话可用于管理单台服务器，也可配置为同时访问多台服务器。\n\n# 8. 在 AlmaLinux\
  \ 9 上使用 Bash Shell\n\n\n\n\n\n学习使用 AlmaLinux 9 以及通用 Linux 发行版的一个重要部分是熟练掌握 Shell\
  \ 环境下的操作。虽然 Linux 自带的 GNOME 等图形桌面环境为操作系统提供了用户友好的界面，但 Shell 环境提供了比图形桌面工具无法实现的强大功能、灵活性和自动化能力。当桌面环境不可用时，Shell\
  \ 环境还提供了与操作系统交互的手段，这在处理如 AlmaLinux 9 这种基于服务器的操作系统或无法完全启动的损坏系统时非常常见。\n\n因此，本章旨在概述\
  \ AlmaLinux 9 上默认的 Shell 环境（特别是 `Bash` Shell）。\n\n## 8.1 什么是 Shell（外壳）？\n\nShell\
  \ 是一个交互式命令解释器环境，在该环境中，可以在提示符处输入命令，或将命令作为脚本输入文件并执行。Shell 的起源可以追溯到 UNIX 操作系统的早期。事实上，在\
  \ Linux 早期，在引入图形桌面之前，Shell 是是用户与操作系统交互的唯一方式。\n\n多年来，人们开发了多种 Shell 环境。第一个广泛使用的 Shell\
  \ 是由贝尔实验室的 Stephen Bourne 编写的 `Bourne shell`。另一个早期产物是 `C shell`，它与 `C 编程语言` 有一些语法相似之处，并引入了命令行编辑和历史记录等可用性增强。\n\
  \n`Korn shell`（由贝尔实验室的 David Korn 开发）基于 `Bourne` 和 `C shells` 提供的功能。\n\nAlmaLinux\
  \ 9 上的默认 Shell 是 `Bash` Shell（`Bourne Again SHell` 的缩写）。该 Shell 起初是 `Bourne shell`\
  \ 的开源版本，由 Brian Fox 为 GNU 项目开发，并基于 `Bourne shell` 和 `C shell` 提供的功能。\n\n## 8.2 访问\
  \ Shell\n\n在 GNOME 桌面环境中，可以通过选择顶部栏中的 `Activities`（活动）选项、在搜索栏中输入 `Terminal` 并点击 `Terminal`\
  \ 图标，从 `Terminal` 窗口访问 Shell 提示符。\n\n例如，使用 `SSH` 远程登录 AlmaLinux 9 服务器时，用户将看到一个 Shell\
  \ 提示符。标题为 在 AlmaLinux 9 上配置 SSH 密钥身份验证 的章节将介绍使用 `SSH` 访问远程服务器的细节。在启动未安装桌面环境的服务器系统时，用户在物理控制台终端或远程登录会话完成登录程序后将立即进入\
  \ Shell。\n\n## 8.3 在提示符输入命令\n\n在 Shell 命令提示符处，只需输入命令并按回车键即可输入命令。虽然某些命令会静默执行任务，但大多数命令在返回提示符之前都会显示某种形式的输出。例如，可以使用\
  \ `ls` 命令显示当前工作目录下的文件和目录：\n\n```bash\n$ ls\nDesktop Documents Downloads Music Pictures\
  \ Public Templates Videos\n```\n\n可用的命令要么内置在 Shell 本身，要么位于物理文件系统中。可以使用 `which` 命令识别命令在文件系统中的位置。例如，要查找\
  \ `ls` 可执行文件在文件系统中的位置：\n\n```bash\n$ which ls\nalias ls='ls --color=auto’\n/usr/bin/ls\n\
  ```\n\n显然，`ls` 命令位于 `/usr/bin` 目录中。请注意，还配置了 `alias`（别名），该主题将在本章稍后部分讨论。使用 `which`\
  \ 命令定位 Shell 内置命令的路径将导致指示找不到可执行文件的消息。例如，尝试查找 `history` 命令的位置（该命令内置在 Shell 中，而不是作为文件系统上的可执行文件），将产生类似下面的输出：\n\
  \n```bash\n$ which history\n/usr/bin/which: no history in (/home/demo/.local/bin:/home/demo/bin:/home/share/Modules/bin:/home/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin)\n\
  ```\n\n## 8.4 获取命令信息\n\nLinux Shell 可用的许多命令看起来可能晦涩。要查找有关命令功能的详细信息以及如何使用，请使用 `man`\
  \ 命令并将命令名作为参数。例如，学习更多关于 `pwd` 命令的信息：\n\n```bash\n$ man pwd\n```\n\n执行上述命令后将显示 `pwd`\
  \ 命令的详细描述。许多命令在带有 `--help` 命令行选项运行时也会提供额外信息：\n\n```bash\n$ wc --help\n```\n\n##\
  \ 8.5 Bash 命令行编辑\n\n早期的 Shell 环境不提供任何形式的行编辑功能。这意味着如果你在长命令行的开头发现错误，你必须删除之后的所有字符，修正错误然后重新输入命令的剩余部分。幸运的是，`Bash`\
  \ 提供了多种行编辑功能，如下表所示：\n\n| 按键序列 | 操作 |\n| :--- | :--- |\n| Ctrl-b 或 左箭头 | 光标向左移动一位\
  \ |\n| Ctrl-f 或 右箭头 | 光标向右移动一位 |\n| Delete | 删除光标下方的字符 |\n| Backspace | 删除光标左侧的字符\
  \ |\n| Ctrl-_ | 撤销更改（可以重复撤销所有更改） |\n| Ctrl-a | 光标移动到行首 |\n| Ctrl-e | 光标移动到行尾 |\n\
  | Meta-f 或 Esc, 然后 f | 向右移动一个单词 |\n| Meta-b 或 Esc, 然后 b | 向左移动一个单词 |\n| Ctrl-l |\
  \ 清除屏幕当前命令以外的内容 |\n| Ctrl-k | 删除从光标到行尾的内容 |\n| Ctrl-u | 删除光标之前的内容 |\n| Ctrl-y |\
  \ 粘贴最近删除的文本 |\n| Meta-d 或 Esc, 然后 d | 删除光标后的单词 |\n| Ctrl-w | 删除光标前的单词 |\n\n表 8-1\n\
  \n## 8.6 使用 Shell 历史记录\n\n除了命令行编辑功能外，`Bash` Shell 还提供了历史记录支持。可以使用 `history` 命令查看已执行的命令：\n\
  \n```bash\n$ history\n    1 ps\n    2 ls\n    3 ls –l /\n    4 ls\n    5 man pwd\n\
  \    6 apropos\n```\n\n此外，可以使用 `Ctrl-p`（向上箭头）和 `Ctrl-n`（向下箭头）来遍历之前的命令。最后，当历史记录显示了所需的命令时，按回车键执行。\n\
  \n另一种选项是输入 `!` 字符，后跟要执行命令的前几个字符，然后按回车键。\n\n## 8.7 文件名简写\n\n许多 Shell 命令接受一个或多个文件名作为参数。例如，要显示名为\
  \ `list.txt` 的文本文件的内容，可以使用 `cat` 命令：\n\n```bash\n$ cat list.txt\n```\n\n同样，通过指定所有文件名作为参数可以显示多个文本文件的内容：\n\
  \n```bash\n$ cat list.txt list2.txt list3.txt list4.txt\n```\n\n不需要输入每个名称，可以使用模式匹配指定符合某些标准的文件。例如，可以使用\
  \ `*` 通配符来简化上面的示例：\n\n```bash\n$ cat *.txt\n```\n\n上述命令将显示所有以 `.txt` 结尾的文件内容。这可以进一步限制为以\
  \ `list` 开头并以 `.txt` 结尾的文件：\n\n```bash\n$ cat list*.txt\n```\n\n可以使用 `?` 字符指定单个字符匹配：\n\
  \n```bash\n$ cat list?.txt\n```\n\n## 8.8 文件名和路径补全\n\n\n\n\n\n与其输入完整的文件名或路径，或使用模式匹配来减少输入量，shell\
  \ 提供了文件名补全功能。要使用文件名补全，请输入文件或路径名称的前几个字符，然后按两次 Esc 键。随后，shell 将根据目录中匹配你所输入字符的第一个文件或路径名来为你补全文件名。要获取可能匹配项的列表，请在输入前几个字符后按\
  \ `Esc` 键。\n\n## 8.9 输入和输出重定向\n\n如前所述，许多 shell 命令在执行时会输出信息。默认情况下，这些输出将指向名为 `stdout`\
  \ 的设备文件，该文件本质上是运行 shell 的终端窗口或控制台。相反，shell 从一个名为 `stdin` 的设备文件获取输入，默认情况下，该文件是键盘。\n\
  \n可以使用 `>` 字符将命令的输出从 `stdout` 重定向到文件系统上的物理文件。例如，要将 `ls` 命令的输出重定向到名为 `files.txt`\
  \ 的文件，需要执行以下命令：\n\n```\n$ ls *.txt > files.txt\n```\n\n完成后，`files.txt` 将包含当前目录下的文件列表。同样，文件的内容也可以作为\
  \ `stdin` 输入到命令中。例如，要将文件内容作为输入重定向到命令：\n\n```\n$ wc –l < files.txt\n```\n\n上述命令将显示\
  \ `files.txt` 文件中的行数。\n\n需要注意的是，`>` 重定向操作符在使用时会创建一个新文件或截断现有文件。如需向现有文件追加内容，请使用 `>>`\
  \ 运算符：\n\n```\n$ ls *.dat >> files.txt\n```\n\n除了标准输出外，shell 还提供了使用 `stderr` 这种标准错误输出。当命令的输出重定向到\
  \ `stdout` 时，命令生成的任何错误信息都将重定向到 `stderr`。这意味着如果 `stdout` 被重定向到文件，错误信息仍然显示在终端上。这通常是期望的行为，但如果需要，也可以使用\
  \ `2>` 运算符重定向 `stderr`：\n\n```\n$ ls dkjfnvkjdnf 2> errormsg\n```\n\n命令执行完成后，`errormsg`\
  \ 文件将包含一条提示找不到名为 `dkjfnvkjdnf` 文件的错误报告。\n\n可以使用 `&>` 运算符将 `stderr` 和 `stdout` 都重定向到同一个文件：\n\
  \n```\n$ ls /etc dkjfnvkjdnf &> alloutput\n```\n\n执行完成后，`alloutput` 文件将包含 `/etc`\
  \ 目录内容的列表以及与尝试列出不存在的文件相关的错误信息。\n\n## 8.10 在 Bash Shell 中使用管道\n\n除了 I/O 重定向外，shell\
  \ 还允许将一个命令的输出直接通过管道传输到另一个命令的输入中。管道操作通过在命令行中的两个或多个命令之间放置 `|` 字符来实现。例如，要统计系统上运行的进程数，可以将\
  \ `ps` 命令的输出通过管道传递给 `wc` 命令：\n\n```\n$ ps –ef | wc –l\n```\n\n命令行上可以执行的管道操作数量没有限制。例如，要查找文件中包含名字\
  \ \"Smith\" 的行数：\n\n```\n$ cat namesfile | grep Smith | wc –l\n```\n\n## 8.11 配置别名（Aliases）\n\
  \n随着对 shell 环境越来越熟练，你可能会频繁执行带有相同参数的命令。例如，你可能会经常配合 `l` 和 `t` 选项使用 `ls` 命令：\n\n```\n\
  $ ls –lt\n```\n\n为了减少执行命令时的输入量，可以创建一个映射到该命令和参数的别名。例如，要创建一个别名，使得输入字母 `l` 就会执行 `ls\
  \ –lt` 命令，可以使用以下语句：\n\n```\n$ alias l=\"ls –lt\"\n```\n\n现在在命令提示符处输入 `l` 将将执行原始语句。\n\
  \n## 8.12 环境变量\n\nshell 环境变量提供了数据和配置设置的临时存储。shell 本身设置了几个环境变量，用户可以更改这些变量来修改 shell\
  \ 的行为。可以使用 `env` 命令获取当前定义的变量列表：\n\n```\n$ env\nSSH_CONNECTION=192.168.0.1 61231\
  \ 192.168.0.28 22\nMODULES_RUN_QUARANTINE=LD_LIBRARY_PATH\nLANG=en_US.UTF-8\nHISTCONTROL=ignoredups\n\
  HOSTNAME=demo-pc.ebookfrenzy.com\nXDG_SESSION_ID=15\nMODULES_CMD=/usr/share/Modules/libexec/modulecmd.tcl\n\
  USER=demo\nENV=/usr/share/Modules/init/profile.sh\n```\n\n\n\n\n`#!` 被称为“shebang”，是一个特殊的字符序列，用于指示执行脚本所需的解释器路径是该行中的下一个项（在本例中，是位于\
  \ `/bin` 的 `sh` 可执行文件）。如果你想使用的解释器是 `/bin/csh` 或 `/bin/ksh`，那么同样可以是这些路径。\n\n下一步是编写一个简单的脚本：\n\
  \n```bash\n#!/bin/sh\nfor i in *\ndo\n    echo $i\ndone\n```\n\n该脚本的作用是遍历当前目录下的所有文件，并显示每个文件的名称。可以通过将脚本名称作为参数传递给\
  \ `sh` 来执行此脚本：\n\n```bash\n$ sh simple.sh\n```\n\n要使该文件具有可执行权限（从而消除了通过将其传递给 `sh`\
  \ 命令的需要），可以使用 `chmod` 命令：\n\n```bash\n$ chmod +x simple.sh\n```\n\n一旦在文件权限中设置了执行位，就可以直接执行它。例如：\n\
  \n```bash\n$ ./simple.sh\n```\n\n## 8.14 总结\n\n在《AlmaLinux 9 基础》的章节中，我们简要浏览了 Bash\
  \ Shell 环境。在图形化桌面环境中，人们很容易忘记操作系统的真正力量和灵活性通常只有在放弃用户友桌面界面并使用 Shell 环境时才能利用。此外，对于管理和维护没有安装桌面的服务器系统，或者在尝试修复受损到导致桌面或\
  \ `Cockpit` 界面无法启动的系统时，熟悉 Shell 是必要的。\n\nShell 的功能远超本章涵盖的内容。如果你是 Shell 的初学者，我们强烈建议你寻找额外的资源。一旦熟悉了这些概念，你会很快发现，在终端窗口中使用\
  \ Shell 执行许多任务比在桌面上翻阅菜单和对话框快得多。\n\n# 9. 管理 AlmaLinux 9 用户和组\n\n在安装 AlmaLinux 9 期间，安装程序创建了一个\
  \ root 或超级用户账户并要求配置密码。安装程序还提供了为系统创建用户账户的机会。我们应该记住，AlmaLinux 9 是一个企业级的多用户、多任务操作系统。因此，为了充分利用\
  \ AlmaLinux 9 的功能，可能需要让多个用户访问系统。每个用户都应该有自己的用户账户登录、密码、主目录和权限。\n\n用户进一步被分为组以便于管理，这些组可以具有不同级别的权限。例如，你可能有一个在财务部门工作的用户组。在这种环境下，你可以创建一个\
  \ `accounts` 组并将所有财务部门的用户分配该组。\n\n本章将涵盖在 AlmaLinux 9 系统上添加、删除和管理用户及组的步骤。可以使用命令行工具、`Cockpit`\
  \ Web 界面和桌面设置应用在 AlmaLinux 9 上管理用户和组。在本章中，我们将这些用户管理的每种方法。\n\n## 9.1 从命令行管理用户\n\n\
  可以通过命令行使用 `useradd` 实用向 AlmaLinux 9 系统添加新用户。要创建一个新用户账户，请输入类似下面的命令：\n\n```bash\n\
  # useradd john\n```\n\n默认情况下，这会在 `/home` 目录下为用户创建一个主目录（在本例中为 `/home/john`）。要指定不同的主目录，请在创建账户时使用\
  \ `-d` 命令行选项：\n\n账户创建后，需要使用 `passwd` 工具分配密码，用户才能登录系统：\n\n```bash\n# passwd john\n\
  Changing password for user john.\nNew password:\nRetype new password:\npasswd: all\
  \ authentication tokens updated successfully.\n```\n\n可以通过命令行使用 `userdel` 工具删除现有用户。虽然这会删除账户，但用户的文件和数据将完好保留在系统中：\n\
  \n```bash\n# userdel john\n```\n\n也可以在删除过程中同时删除用户的主目录和邮件邮箱池：\n\n```bash\n# userdel\
  \ --remove john\n```\n\nAlmaLinux 9 系统上的所有用户都是一个或多个组的成员。默认情况下，新用户会被添加到与用户同名的私有组中（在上面的示例中，为用户\
  \ `john` 创建的账户是一个同名为 `john` 的私有组成员）。然而，作为管理员，将用户组织成更有逻辑的组是有意义的。例如，所有销售人员可能属于 `sales`\
  \ 组，财务人员可能属于 `accounts` 组，依此类推。可以使用 `groupadd` 命令行工具从命令行添加新组，例如：\n\n```bash\n# groupadd\
  \ accounts\n```\n\n使用 `usermod` 工具从命令行将现有用户添加到现有组：\n\n```bash\n# usermod -G accounts\
  \ john\n```\n\n要将现有用户添加到多个现有组中，请运行带有 `-G` 选项的 `usermod` 命令：\n\n```bash\n# usermod\
  \ -G accounts,sales,support john\n```\n\n注意，上述命令会将用户从 `-G` 之后未列出但用户目前所属的补充组中移除。要保留任何当前的组成员关系，请使用\
  \ `-a` 标志追加新的组成员关系：\n\n```bash\n# usermod -aG accounts,sales,support john\n```\n\
  \n可以使用 `groupdel` 工具从系统删除删除现有组：\n\n```bash\n# groupdel accounts\n```\n\n注意，如果要删除的组是任何用户的主组或初始组，则无法删除。在删除该组之前，必须先删除用户或使用\
  \ `usermod` 命令为其分配一个新的主组。可以使用 `usermod -g` 选项为用户分配新的主组：\n\n```bash\n# usermod -g\
  \ sales john\n# groupdel accounts\n```\n\n运行 `groups` 命令查找用户所属的组。例如：\n\n```bash\n\
  $ groups john\njohn : accounts support\n```\n\n默认情况下，除非用户知道 root 密码，否则用户账户无法执行需要超级用户（root）权限的任务。但是，可以配置用户账户使用\
  \ `sudo` 命令执行特权任务。这涉及将用户账户作为 `wheel` 组的成员，例如：\n\n```bash\n# usermod -aG wheel john\n\
  ```\n\n一旦添加到 wheel 组，用户将能够通过 `sudo` 执行其他受限的任务，如下所示：\n\n```bash\n$ sudo dnf update\n\
  [sudo] password for demo:\nUpdating Subscription Management repositories.\n...\n\
  ```\n\n可以通过编辑 `/etc/sudoers` 文件并找到以下部分来修改 wheel 组的 `sudo`set：\n\n```bash\n## Allows\
  \ people in group wheel to run all commands\n%wheel ALL=(ALL) ALL\n```\n\n要禁用所有\
  \ wheel 组成员的 `sudo`，如下所示注释第二行：\n\n```bash\n## Allows people in group wheel to run\
  \ all commands\n# %wheel ALL=(ALL) ALL\n```\n\n允许 wheel 组成员在不输入密码的情况下使用 `sudo`（出于安全考虑，不建议这样做），如下所示修改\
  \ sudoers 文件：\n\n```bash\n## Same thing without a password\n%wheel ALL=(ALL) NOPASSWD:\
  \ ALL\n```\n\n在背后，这些命令仅仅是更改系统上的 `/etc/passwd`、`/etc/group` 和 `/etc/shadow` 文件。\n\
  \n## 9.2 使用 Cockpit 管理用户\n\n如果系统上安装并启用了 `Cockpit` Web 界面（该主题在“Cockpit Web 界面概述”章节中有所介绍），可以在所示的“账户”（Accounts）屏幕中执行若干用户和组管理任务：\n\
  \n![](img/cockpit_accounts.png)\n\n图 9-1\n\n屏幕将显示系统上任何现有的用户账户，并提供添加额外账户的按钮。要创建新账户，请点击\
  \ `Create New Account` 按钮并在弹出的对话框中输入所需信息。注意，还有一个选项是可以创建账户但稍后锁定：\n\n![](img/rhel_cockpit_new_account.png)\n\
  \n图 9-2\n\n\n\n要修改用户账户，请从主屏幕选择该账户并对账户详情进行任何修改：\n\n![](img/rhel_cockpit_modify_account.png)\n\
  图 9-3\n\n此屏幕允许执行各种任务，包括锁定或解锁账户、更改密码或强制用户配置新密码。此外，如果选择了服务器管理员（Server Administrator）选项，用户将被添加到\
  \ `wheel` 组，并允许使用 `sudo` 执行管理任务。系统还提供了一个用于从系统中删除该用户的按钮。\n\n如果用户使用带有密钥加密的 SSH 连接远程访问系统，则可以在此屏幕内添加用户的公钥。SSH\
  \ 访问和身份验证将在后文“在 AlmaLinux 9 上配置基于密钥的身份验证” 中介绍。\n\n## 9.3 使用设置应用管理用户\n\n通过 GNOME\
  \ 桌面设置应用可以使用第三种用户管理选项。通过点击 GNOME 桌面右上角的图标并选择“设置”（Settings）选项即可访问此应用，如图 9-4 所示：\n\
  \n![](img/almalinux_gnome_settings_menu1.png)\n图 9-4\n\n当主设置屏幕出现时，点击左侧导航面板中的“用户”（Users）选项。默认情况下，设置将被锁定，无法对系统上的用户账户进行任何更改。要解锁“设置”应用，请点击下方图\
  \ 9-5 中的“解锁”（Unlock）按钮并输入密码。注意，只有当您以具有 `sudo` 权限的用户登录时，才能解锁设置：\n\n![](img/rhel_settings_users.png)\n\
  图 9-5\n\n应用解锁后，点击“添加用户...”（Add User...）以显示如下方图 9-6 所示的对话框：\n\n![](img/rhel_settings_add_user.png)\n\
  图 9-6\n\n如果需要，选择“管理员”（Administrator）选项为新用户分配 `sudo` 权限；否则，保留选择“标准”（Standard）。接下来，输入用户的全名和用户名，并现在分配密码，或允许用户在首次登录账户时设置密码。输入信息后，点击“添加”（Add）按钮创建账户。\n\
  \n可以通过选择 `Users` 屏幕内相应的图标，随时查看、修改现有用户的设置或删除该账户，如图图 9-7 所示。系统还提供了查看用户登录活动的选项。注意，在对账户进行任何更改之前，必须再次解锁“设置”应用：\n\
  \n![](img/rhel_settings_user_details.png)\n图 9-7\n\n## 9.4 总结\n\n作为一个多用户操作系统，AlmaLinux\
  \ 9 的设计目标是支持对多个用户的受控访问。在安装期间，创建了 `root` 用户账户并分配了密码，同时还提供了创建用户账户的选项。可以使用 Cockpit\
  \ Web 界面或 GNOME 设置应用通过一组命令行工具向系统添加额外的用户账户。除了用户账户外，Linux 还实现了“组”（groups）的概念。可以使用命令行工具添加新组，并将用户分配到这些组中，且每个用户必须至少属于一个组。默认情况下，标准非\
  \ `root` 用户没有权限执行特权任务。然而，特殊组 `wheel` 组成员的用户可以使用 `sudo` 命令执行特权任务。\n\n# 10 AlmaLinux\
  \ 9 软件安装与 AppStreams\n\n难以确定一个新安装的 AlmaLinux 9 系统将包含执行其预期任务所需的所有软件包。即使已经安装了所有所需的软件，几乎可以确定，在系统的生命周期内，许多此类软件包的更新版本将会发布。在某些情况下，您需要确保系统上安装了这些最新的软件包版本，以修复任何漏洞。但在其他情况下，可能需要在系统中保留特定软件包的旧版本，以兼容其他软件。\n\
  \n本章介绍了 AlmaLinux 9 软件管理的基本概念，解释了如何解决这些问题，解释了存储库（repositories）、软件包以及 AlmaLinux 应用流（AppStream），并探索了如何列出、安装和删除构成\
  \ AlmaLinux 9 系统的软件包。\n\n## 10.1 存储库 (Repositories)\n\nLinux 本质上由基础包组成，这些包提供了操作系统的核心功能，以及一系列在基础操作系统之上添加功能和特性的包和模块。\n\
  \n在首次安装 AlmaLinux 9 时，将安装各种软件包，这取决于安装阶段选择的软件选项。然而，一旦系统运行，就可以根据需要安装额外的软件。通常，所有属于\
  \ AlmaLinux 9 的软件（换句话说，即第三方供应商未提供的软件）都是使用 `dnf` 命令下载并安装在系统上的。正如我们在前面的章节中看到的，这通常涉及在命令行提示符处执行类似下面的命令：\n\
  \n```bash\ndnf install httpd\n```\n\n当执行此类命令时，将从远程存储库下载请求的软件并安装在本地系统中。默认情况下，AlmaLinux\
  \ 9 配置从名为 `BaseOS`、`AppStream` 和 `Extras` 的存储库下载软件。例如，运行以下命令将提供系统当前配置用于下载软件时使用的存储库列表：\n\
  \n```bash\ndnf repolist\n```\n\n| repo id | repo name |\n| :--- | :--- |\n| appstream\
  \ | AlmaLinux 9 - AppStream |\n| baseos | AlmaLinux 9 - BaseOS |\n| extras | AlmaLinux\
  \ 9 - Extras |\n\n上面的示例显示系统上启用了 Appstream、BaseOS 和 Extras 存储库。请记住，可以为第三方软件添加存储库。\n\
  \n可以通过向 `/etc/dnf/dnf.conf` 文件写入条目，或者通过向 `/etc/yum.repos.d/` 目录添加 `.repo` 文件来向系统添加额外的存储库。或者，可以使用\
  \ `dnf config-manager` 工具，并将存储库的 `.repo` 文件 URL 作为命令行参数传递：\n\n```bash\ndnf config-manager\
  \ --add-repo https://url/of/repo/file\n```\n\n## 10.2 BaseOS 存储库\n\n该存储库包含构成操作系统核心功能的软件包。这些软件元素以红帽软件包管理器\
  \ (RPM) 包文件的格式下载，并安装在系统中。一个典型的 AlmaLinux 9 系统将安装约 1500 个 RPM 软件包。要查看系统中当前安装的所有 RPM\
  \ 软件包列表，请按所示运行 `rpm` 命令：\n\n```bash\nrpm -qa | more\n```\n\n```text\nlibgcc-11.3.1-4.3.el9.alma.x86_64\n\
  fonts-filesystem-2.0.5-7.el9.1.noarch\nlinux-firmware-whence-20230310-133.el9_2.noarch\n\
  crypto-policies-20221215-1.git9a18988.el9.noarch\n```\n\n通过运行所示的 `dnf` 命令可以获取存储库中可安装的软件包列表：\n\
  \n```bash\ndnf list\n```\n\n获取匹配搜索字符串的软件包列表，请如下使用 `dnf`：\n\n```bash\ndnf search\
  \ \"search string\"\n```\n\n还可以识别哪个软件包包含特定文件：\n\n```bash\ndnf provides filename\n\
  ```\n\n在使用 `dnf provides` 时，在搜索文件时通常需要使用通配符字符 `*`。例如：\n\n```bash\ndnf provides */httpd.conf\n\
  ```\n\n\n\n要安装软件包，请运行以下命令：\n\n```\ndnf install packagename\n```\n\n同样，要删除软件包：\n\n\
  ```\ndnf delete packagename\n```\n\n当软件包有新版本可用时，它将在系统下一次更新时被下载并安装，通常通过 `dnf` 命令进行：\n\
  \n```\ndnf update\n```\n\n任何更新的软件包都将替换系统上当前安装的旧版本。虽然在处理基础操作系统软件包时这通常是理想情况，但在处理其他软件包（例如编程环境或开发库）时，这并不一定是预期的行为，因为升级到新版本可能会与系统中已安装的其他软件包产生兼容性问题。这个问题通过\
  \ AppStream 仓库得到了。\n\n## 10.3 AppStream 仓库\n\nAppStream 仓库以软件包、模块（modules）、流（streams）和配置文件（profiles）的形式管理软件。正如前一节描述\
  \ BaseOS 时概述，AppStream 软件包再次是 RPM 软件包。另一方面，AppStream 模块是属于一组或之间存在依赖关系的包组（例如，在构建\
  \ Web 服务器时需要一起安装的包组）。每个模块可以有多个流，每个模块流代表软件模块的不同版本。\n\n考虑一个例子，一个 AlmaLinux 9 系统托管了一个依赖于\
  \ 7.2 版本 PHP 脚本语言的网站。服务器仍然需要接收 PHP 7.2 的任何更新以获得补丁和错误修复，但与最新版本的 PHP（8.1 版本）兼容。在引入\
  \ AppStream 之前，当发布新版本时，很难继续接收 7.2 版本的更新。\n\n为了解决这个问题，AlmaLinux 9 软件管理工具可以使用 AppStream\
  \ 仓库仅订阅特定模块的特定流（在这种情况下为 PHP 模块的 7.2 流）。\n\n除了流之外，模块还可以通过模块配置文件进行子类划分。模块配置文件根据系统需求提供了组成安装模块的软件包的不同配置。例如，`nodejs`\
  \ JavaScript 运行时环境模块可以使用开发（development）或最小化（minimal）配置文件进行安装。在运行 `nodejs` 进行开发的系统中，最可能会使用开发配置文件。当部署使用\
  \ `nodejs` 开发的软件时，可能会改为安装仅包含运行环境的最小化系统。\n\n要查看可用安装的模块列表，请按如下方式使用 `dnf` 命令：\n\n```\n\
  dnf module list\n```\n\n上次元数据过期检查：0:08:48 之前，时间为 2023 年 4 月 24 日周一 上午 10:33:24 EDT。\n\
  \nAlmaLinux 9 - AppStream\n\nName Stream Profiles Summary\nmaven 3.8 common [d]\
  \ Java 项目管理和项目理解工具\nnodejs 18 common [d], development, minimal, s2i Javascript runtime\n\
  php 8.1 common [d], devel, minimal PHP 脚本语言\nruby 3.1 common [d] 面向对象脚本语言的解释器\n\n\
  提示：`[d]`默认，`[e]`启用，`[x]`禁用，`[i]`已安装\n\n列表的第一列是模块名称，第二列是流名称（通常是模块的版本）。流名称后的字母（`[d]`）表示该流是否为默认流（即如果没有引用特定流，则将使用该流进行安装），或者在执行安装时是否已已启用。第三列列出了对应软件包可用的配置文件，并指示了该配置文件是默认的、已安装还是已禁用。\n\
  \n用于列出特定模块信息的 `dnf` 命令结构如下：\n\n```\ndnf module list modulename\n```\n\n例如，以下输出列出了可用安装的模块信息：\n\
  \n```\ndnf module list php\n```\n\nName Stream Profiles Summary\nphp 8.1 [d] common\
  \ [d], devel, minimal PHP 脚本语言\n\n显然，PHP 8.1 版本将默认安装在系统中，且该模块在 common、development\
  \ 和 minimal 配置中均可用。\n\n要使用默认流和配置文件安装模块，可以使用以下语法的 `dnf` 命令：\n\n```\ndnf install @modulename\n\
  ```\n\n例如：\n\n```\ndnf install @php\n```\n\n或者，可以指定特定的流来执行安装：\n\n```\ndnf install\
  \ @modulename:stream\n```\n\n例如：\n\n```\ndnf install @php:8.1\n```\n\n最后，还可以如下声明声明配置文件：\n\
  \n```\ndnf install @modulename:stream/profile\n```\n\n例如，为 PHP 8.1 安装最小化的软件包集：\n\
  \n```\ndnf install @php:8.1/minimal\n```\n\n使用上述命令安装模块后，PHP 模块现在将列出如下：\n\nphp 8.1\
  \ [e] common [d], devel, minimal [i] PHP 脚本语言\n\n流列中的 `[e]` 标识告诉我们该流已启用，而配置文件列中的\
  \ `[i]` 显示已使用最小化配置文件安装了模块。\n\n要在安装模块的情况下启用流，请按如下方式使用 `dnf`：\n\n```\ndnf module enable\
  \ modulename\n```\n\n同样，可以如下方式禁用流：\n\n```\ndnf module disable modulename\n```\n\n\
  要卸载模块，使用以下语法：\n\n```\ndnf module remove modulename\n```\n\n可以使用以下 `dnf` 命令识别模块的附加信息：\n\
  \n```\ndnf module info modulename\n```\n\n要找到哪些 RPM 软件包构成了特定模块和流组合的不同配置文件，请如下方式使用\
  \ `dnf`：\n\n```\ndnf module info --profile modulename:stream\n```\n\n例如：\n\n```\n\
  dnf module info --profile php:8.1\n```\n\n更新订阅管理仓库。\n上次元数据过期检查：1:44:32 之前，时间为 2023\
