  \ 49362943 49123328 23.4G Microsoft basic data\n/dev/nvme0n1p4 132933632 134213631\
  \ 1280000 625M Windows recovery environment\n/dev/nvme0n1p5 49362944 51460095 2097152\
  \ 1G Linux filesystem\n/dev/nvme0n1p6 51460096 132933631 81473536 38.8G Linux LVM\n\
  ```\n\n在上述示例输出中，系统包含一个由设备名称 `/dev/nvme0n1` 引用的物理磁盘。在该磁盘驱动器上，六个分区分别通过设备名称 `/dev/nvme0n1p1`\
  \ 到 `/dev/nvme0n1p` 访问。根据 `Types` 列中的值，存在三个与 Windows 相关的分区。第一个是 Windows 系统分区，第二个大得多的分区是\
  \ Windows 启动分区，包含 Windows 操作系统和用户数据，随后是 Windows 恢复分区。\n\n要删除分区，请使用包含该分区的磁盘设备名称（在本例中为\
  \ `/dev/nvme0n1`）启动 `fdisk` 工具，并按照指令再次显示分区和扇区信息：\n\n```\nWelcome to fdisk (util-linux\
