    # Better skills come with increased learning.


    > Your main focus as a novice should be on becoming familiar with the ins and
    outs of operating system architecture as well as discovering shortcuts and time-saving
    techniques.


    ![](img/69fdaac95fca1cdd9f4079cb7470b3aa_11_0.png)


    CentOS is a wonderful option if you use Windows and want to learn Linux because
    it is one of the best Linux distributions for beginners. Your first few days using
    CentOS won''t be that odd. But you must learn how to utilize Linux''s command
    line interface if you want to experience its full capabilities. You will initially
    experience some difficulty learning several instructions. Although employing the
    instructions will not make you a genius, it will assist you in carrying out certain
    fundamental tasks. Here are the most basic CentOS commands for new users to ensure
    a smooth start. Let''s get right into it!


    ![](img/69fdaac95fca1cdd9f4079cb7470b3aa_12_0.png)


    ![](img/69fdaac95fca1cdd9f4079cb7470b3aa_13_0.png)


    > "... being a Linux user is sort of like living in a house inhabited by a large
    family of carpenters and architects. Every morning when you wake up, the house
    is a little different. Maybe there is a new turret, or some walls have moved.
    Or perhaps someone has temporarily removed the floor under your bed."


    ~ Unix for Dummies, 2nd Edition


    # Linux Commands


    ### Description:

    Display system date and time.


    Command:

    ```

    date

    ```


    ### Description:

    Display calendar.


    Command:

    ```

    cal

    ```


    ### Description:

    Display date, time and calendar.


    Command:

    ```

    date & cal

    ```


    ### Description:

    Display August month 2016 year calendar.


    Command:

    ```

    cal 8 2016

    ```


    ### Description:

    Used to clear the terminal window.


    Command:

    ```

    clear

    ```


    ### Description:

    Exit from the terminal window.


    Command:

    ```

    exit

    ```


    ### Description:

    Display free and used system memory.


    Command:

    ```

    free

    ```


    ### Description:

    Display free and used system memory in bytes.


    Command:

    ```

    free -b

    ```


    ### Description:

    Display free and used system memory in kilobytes.


    Command:

    ```

    free -k

    ```


    ### Description:

    Display free and used system memory in megabytes.


    Command:

    ```

    free -m

    ```


    ### Description:

    Change user password.


    Command:

    ```

    passwd

    ```


    ### Description:

    Power-off the machine.


    Command:

    ```

    shutdown

    ```


    ### Description:

    Power-off the machine immediately.


    Command:

    ```

    shutdown -h now

    ```


    ### Description:

    Power-off the machine after 10 minutes.


    Command:

    ```

    shutdown -h +10

    ```


    ### Description:

    Print current working directory.


    Command:

    ```

    echo $PWD

    ```


    ### Description:

    Print previous working directory.


    Command:

    ```

    echo $OLDPWD

    ```


    ### Description:

    Executes the 11th command in command history.


    Command:

    ```

    !!11

    ```


    ### Description:

    Reveals your command history.


    Command:

    ```

    history

    ```


    ### Description:

    Power off or reboot the Operating system.


    Command:

    ```

    sudo reboot

    ```


    ### Description:

    Display the IP address of the host.


    Command:

    ```

    ip address

    ```


    ### Description:

    List the size of files and directories.


    Command:

    ```

    ls -s

    ```


    ### Description:

    View mounted file systems.


    Command:

    ```

    mount

    ```


    ### Description:

    Display the information of disk usage of files and directories.


    Command:

    ```

    du

    ```


    ### Description:

    Tells you how long the system has been running.


    Command:

    ```

    uptime

    ```


    ### Description:

    Set current date as 02 Nov 1988.


    Command:

    ```

    date --set 1998-11-02

    ```


    ### Description:

    Set current time as 12:11:02 IST.


    Command:

    ```

    date --set 12:11:02

    ```


    ### Description:

    View Specific Disk Partition in Linux.


    Command:

    ```

    fdisk -l /dev/sda

    ```


    ### Description:

    Lists all files and directories in the present working directory.


    Command:

    ```

    ls

    ```


    ### Description:

    Report the process information.


    Command:

    ```

    ps

    ```


    ### Description:

    Display disk usage.


    Command:

    ```

    df

    ```


    ### Description:

    Display disk usage in gigabytes, megabytes, or kilobytes.


    Command:

    ```

    df -H

    ```


    ### Description:

    Delete every file and every directory.


    Command:

    ```

    rm -r *

    ```


    ### Description:

    Provides a quick overview of the currently running processes.


    Command:

    ```

    top

    ```


    ### Description:

    The system performs an immediate reboot.


    Command:

    ```

    reboot

    ```


    ### Description:

    Terminate processes without having to log out or reboot.


    Command:

    ```

    kill

    ```


    ### Description:

    Change the current working directory.


    Command:

    ```

    cd

    ```


    ### Description:

    Create a new session on the system.


    Command:

    ```

    login

    ```


    ### Description:

    List open files.


    Command:

    ```

    lsof

    ```


    ### Description:

    List USB devices.


    Command:

    ```

    lsusb

    ```


    ### Description:

    Check the status of the network services.


    Command:

    ```

    service network status

    ```


    ### Description:

    Start the network service.


    Command:

    ```

    service network start

    ```


    ### Description:

    Stop the network service.


    Command:

    ```

    service network stop

    ```


    ### Description:

    Restart the network service.


    Command:

    ```

    service network restart

    ```


    ### Description:

    Report information about the users currently on the machine and their processes.


    Command:

    ```

    w

    ```


    ### Description:

    Display the current directory.


    Command:

    ```

    pwd

    ```


    ### Description:

    Displays CPU architecture information (such as number of CPUs, threads, cores,
    sockets, and more).


    Command:

    ```

    lscpu

    ```


    ### Description:

    Displays the number of processing units available to the current process.


    Command:

    ```

    nproc

    ```


    ### Description:

    The system performs an immediate reboot.


    Command:

    ```

    init 6

    ```


    ### Description:

    Power-off the machine.


    Command:

    ```

    init 0

    ```


    ### Description:

    List files by date.


    Command:

    ```

    ls -lrt

    ```


    ### Description:

    Report information about storage devices such as hard disks, flash drives etc.


    Command:

    ```

    lsblk

    ```


    ### Description:

    Show exit status of previous command.


    Command:

    ```

    echo $?

    ```


    ### Description:

    Lists a few useful info commands.


    Command:

    ```

    info

    ```


    ### Description:

    Prints current year''s calendar.


    Command:

    ```

    cal -y

    ```


    ### Description:

    Check the status of all the services.


    Command:

    ```

    service --status-all

    ```


    ### Description:

    Display time in hh:mm:ss.


    Command:

    ```

    date +%T

    ```


    ### Description:

    Tells when the user logged in on and off from where.


    Command:

    ```

    last -l username

    ```


    ### Description:

    Sort files and directories by extension name.


    Command:

    ```

    ls -X

    ```


    ### Description:

    Display the manual for the pwd command.


    Command:

    ```

    man pwd

    ```


    ### Description:

    Displays information about running processes in the form of a tree.


    Command:

    ```

    pstree

    ```


    ### Description:

    Resets your terminal.


    Command:

    ```

    reset

    ```


    ### Description:

    Displays What date is it this Friday.


    Command:

    ```

    date -d fri

    ```


    ### Description:

    Displays the size of each individual file.


    Command:

    ```

    du -a

    ```


    ### Description:

    Display information about the Advanced configuration and power Interface.


    Command:

    ```

    acpi

    ```


    ### Description:

    Takes you two folders back.


    Command:

    ```

    cd ../

    ```


    ### Description:

    Takes you to the previous directory.


    Command:

    ```

    cd -

    ```


    ### Description:

    Displays a list of shell built-in commands.


    Command:

    ```

    help

    ```


    ### Description:

    Lists your last logins.


    Command:

    ```

    last yourusername

    ```


    ### Description:

    Create a new directory called myfiles.


    Command:

    ```

    mkdir myfiles

    ```


    ### Description:

    Remove the directory myfiles.


    Command:

    ```

    rmdir myfiles

    ```


    ### Description:

    Disable password for a specific user "root1".


    Command:

    ```

    passwd -d root1

    ```


    ### Description:

    Switch to user "root1".


    Command:

    ```

    sudo su root1

    ```


    ### Description:

    Exit from the terminal window.


    Command:

    ```

    logout

    ```


    ### Description:

    Creates a user "root1".


    Command:

    ```

    useradd "root1"

    ```


    ### Description:

    Assign password to user "root1".


    Command:

    ```

    passwd "root1"

    ```


    ### Description:

    Repeats the last command.


    Command:

    ```

    !!

    ```


    ### Description:

    Display Who you are logged in as.


    Command:

    ```

    whoami

    ```

