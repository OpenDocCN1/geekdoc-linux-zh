    **Linux** is a complex example of the wisdom of crowds. It''s a good example in
    the sense that it shows you can set people to work in a decentralized way - that
    is, without anyone really directing their efforts in a **particular direction**
    - and still trust that they''re going to come up with good answers.


    > - James Surowiecki


    # One final thought:


    If you feel that this information has been useful to you, please take a moment
