    # # What is Linux and why is it so popular?


    Whether you know it or not you are already using Linux (the best-known and most-used
    open source operating system) every day. From supercomputers to smartphones, the
    Linux operating system is everywhere. As an operating system, Linux is a family
    of open source Unix-like software based on the Linux kernel - that sits underneath
    all the other software on a computer, receiving requests from those programs and
    relaying these requests to the computer''s hardware. With regard to careers, it
    is becoming increasingly valuable to have Linux skills rather than just knowing
    how to use Windows. In general, Linux harder to manage than Windows, but offers
    more flexibility and configuration options.


    Every desktop computer uses an operating system. The most popular operating systems
    in use today are: Windows, Mac OS, and LINUX. Linux is the best-known notoriously
    reliable and highly secure source portable operating system -- much like UNIX
    -- that becomes very popular over the last several years -- created as a task
    done for pleasure by Linux Torvalds - computer science student at the University
    of Helsinki in Finland -- in the early 1990s and later developed by more than
    a thousand people around the world.


    Linux is fast, easy to use, that sits underneath all the other software on a computer
    – runs your computer -- handling all interactions between you and the hardware
    i.e., whether you''re typing a letter, calculating a money budget, or managing
    your food recipes on your computer, the Linux operating system (similar to other
    Operating Systems, such as Windows XP, Windows 7, Windows 8, and Mac OS X) provides
    the essential air that your computer breathes.


    Linux is the most important technology advancement of the twenty-first century
    and Licensed under the General Public License (GPL) that Linux ensures the software
    will always be open to anyone and whose source code is open and available for
    any user to check, which makes it easier to find and repair vulnerabilities and
    it power the laptops, development machines and'
  - '[PAGE 288]


    servers at Google, Facebook, Twitter, NASA, and New York Stock Exchange, just
    to name a few. Linux has many more features to amaze its users as: Live CD/USB,
    Graphical user interface (X Window System) etc.


    # Why LINUX?


    Although Microsoft Windows (which is the most likely victim of viruses and malware)
    has made great improvements in reliability in recent years, it considered less
    reliable than Linux. Linux is notoriously reliable and secure and it is free from
    constant battling viruses and malware (which may affect your desktops, laptops,
    and servers by corrupting files, causing slow downs, crashes, costly repairs and
    taking over basic functions of your operating system) – and it keep yourself free
    from licensing fees i.e., zero cost of entry ... as free. You can install Linux
    on as many computer ecosystems on the planet as you like without paying a cent
    for software or server licensing. While Microsoft Windows usually costs between
    $99.00 and $199.00 USD for each licensed copy and fear of losing data.


    Below are some examples of where Linux is being used today:


    +   - Android phones and tablets

    - Servers

    - TV, Cameras, DVD players, etc.

    - Amazon

    - Google

    - U.S. Postal Service

    - New York Stock Exchange


