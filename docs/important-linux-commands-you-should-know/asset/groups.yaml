    # 技能会随着学习的增加而提高。


    > 作为一个新手，你的主要重点应该是熟悉操作系统架构的细节，并发现捷径和节省时间的技巧。


    ![](img/69fdaac95fca1cdd9f4079cb7470b3aa_11_0.png)


    如果你使用 Windows 并且想学习 Linux，那么 CentOS 是一个很棒的选择，因为它是适合初者的 Linux 发行版之一。你使用 CentOS
    的前几天不会觉得奇怪。但如果你想体验它的全部功能，就必须学会使用 Linux 的命令行界面。最初你在学习某些指令时可能会遇到困难。虽然使用这些指令不会让你成为天才，但它们将帮助你执行某些基础任务。以下是新用户最基本的
    CentOS 命令，以确保顺利开始。让我们直接开始吧！


    ![](img/69fdaac95fca1cdd9f4079cb7470b3aa_12_0.png)


    ![](img/69fdaac95fca1cdd9f4079cb7470b3aa_13_0.png)


    > "... 成为一名 Linux 用户就像住在一个由一大群木工和建筑师组成的房子里。每天早上当你醒来时，房子都有所不同。也许多了一个新塔楼，或者某些墙移动了。又也许有人临时移走了你床下的地板。”


    ~ 《Linux入门》，第2版


    # Linux 命令


    ### 描述：

    显示系统日期和时间。


    命令：

    ```

    date

    ```


    ### 描述：

    显示日历。


    命令：

    ```

    cal

    ```


    ### 描述：

    显示日期、时间和日历。


    命令：

    ```

    date & cal

    ```


    ### 描述：

    显示 2016 年 8 月日历。


    命令：

    ```

    cal 8 2016

    ```


    ### 描述：

    用于清除终端窗口。


    命令：

    ```

    clear

    ```


    ### 描述：

    退出终端窗口。


    命令：

    ```

    exit

    ```


    ### 描述：

    显示空闲和已使用的系统内存。


    命令：

    ```

    free

    ```


    ### 描述：

    以字节为显示空闲和已使用的系统内存。


    命令：

    ```

    free -b

    ```


    ### 描述：

    以千字节为显示空闲和已使用的系统内存。


    命令：

    ```

    free -k

    ```


    ### 描述：

    以兆字节为显示空闲和已使用的系统内存。


    命令：

    ```

    free -m

    ```


    ### 描述：

    更改用户密码。


    命令：

    ```

    passwd

    ```


    ### 描述：

    关机。


    命令：

    ```

    shutdown

    ```


    ### 描述：

    立即关机。


    命令：

    ```

    shutdown -h now

    ```


    ### 描述：

    在 10 分钟后关机。


    命令：

    ```

    shutdown -h +10

    ```


    ### 描述：

    打印当前工作目录。


    命令：

    ```

    echo $PWD

    ```


    ### 描述：

    打印上一个工作目录。


    命令：

    ```

    echo $OLDPWD

    ```


    ### 描述：

    执行命令历史记录中的第 11 条命令。


    命令：

    ```

    !!11

    ```


    ### 描述：

    显示你的命令历史。


    命令：

    ```

    history

    ```


    ### 描述：

    关机或重启操作系统。


    命令：

    ```

    sudo reboot

    ```


    ### 描述：

    显示主机的 IP 地址。


    命令：

    ```

    ip address

    ```


    ### 描述：

    列出文件和目录的大小。


    命令：

    ```

    ls -s

    ```


    ### 描述：

    查看挂载的文件系统。


    命令：

    ```

    mount

    ```


    ### 描述：

    显示文件和目录的磁盘占用信息。


    命令：

    ```

    du

    ```


    ### 描述：

    告诉系统已运行了多久。


    命令：

    ```

    uptime

    ```


    ### 描述：

    将当前日期设置为 1998 年 11 月 2 日。


    命令：

    ```

    date --set 1998-11-02

    ```


    ### 描述：

    将当前时间设置为 IST 时间 12:11:02。


    命令：

    ```

    date --set 12:11:02

    ```


    ### 描述：

    查看 Linux 中特定的磁盘分区。


    命令：

    ```

    fdisk -l /dev/sda

    ```


    ### 描述：

    列出当前工作目录下的所有文件和目录。


    命令：

    ```

    ls

    ```


    ### 描述：

    报告进程信息。


    命令：

    ```

    ps

    ```


    ### 描述：

    显示磁盘占用。


    命令：

    ```

    df

    ```


    ### 描述：

    以千字节、兆字节或千字节为显示磁盘占用。


    命令：

    ```

    df -H

    ```


    ### 描述：

    删除每个文件和每个目录。


    命令：

    ```

    rm -r *

    ```


    ### 描述：

    提供当前运行进程的快速概览。


    命令：

    ```

    top

    ```


    ### 描述：

    系统执行立即重启。


    命令：

    ```

    reboot

    ```


    ### 描述：

    在不注销或重启的情况下终止进程。


    命令：

    ```

    kill

    ```


    ### 描述：

    更改当前工作目录。


    命令：

    ```

    cd

    ```


    ### 描述：

    在系统上创建新会话。


    命令：

    ```

    login

    ```


    ### 描述：

    列出打开的文件。


    命令：

    ```

    lsof

    ```


    ### 描述：

    列出 USB 设备。


    命令：

    ```

    ls

    ```


    ### 描述：

    检查网络状态。


    命令：

    ```

    service status

    ```


    ### 描述：

    启动网络服务。


    命令：

    ```

    service start

    ```


    ### 描述：

    停止网络服务。


    命令：

    ```

    service stop

    ```


    ### 描述：

    重启网络服务。


    命令：

    ```

    service restart

    ```


    ### 描述：

    报告当前登录机器的用户及其进程。


    命令：

    ```

    w

    ```


    ### 描述：

    显示当前目录。


    命令：

    ```

    pwd

    ```


    ### 描述：

    显示 CPU 信息（如核心、线程、插槽等）。


    命令：

    ```

    lscpu

    ```


    ### 描述：

    显示当前进程的处理单元数量。


    命令：

    ```

    nproc

    ```


    ### 描述：

    系统执行立即重启。


    命令：

    ```

    init 6

    ```


    ### 描述：

    关机。


    命令：

    ```

    init 0

    ```


    ### 描述：

    按日期列出文件。


    命令：

    ```

    ls -lt

    ```


    ### 描述：

    列出存储设备信息（如硬盘、闪存器等）。


    命令：

    ```

    lsblk

    ```


    ### 描述：

    显示上一个命令的状态。


    命令：

    ```

    echo $?

    ```


    ### 描述：

    列出一些有用的命令。


    命令：

    ```

    info

    ```


    ### 描述：

    打印当年的日历。


    命令：

    ```

    cal -y

    ```


    ### 描述：

    告诉用户何时从何处登录和退出。


    命令：

    ```

    last -l username

    ```


    ### 描述：

    按扩展名排序文件和目录。


    命令：

    ```

    ls -X

    ```


    ### 描述：

    显示 pwd 命令的手册。


    命令：

    ```

    man pwd

    ```


    ### 描述：

    以树状显示运行进程的信息。


    命令：

    ```

    pstree

    ```


    ### 描述：

    重置你的终端。


    命令：

    ```

    reset

    ```


    ### 描述：

    显示今天是周几。


    命令：

    ```

    date -d fri

    ```


    ### 描述：

    显示每个单独文件的空间。


    命令：

    ```

    du -a

    ```


    ### 描述：

    显示关于高级配置和电源接口的信息。


    命令：

    ```

    acpi

    ```


    ### 描述：

    返回上两个文件夹。


    命令：

    ```

    cd ../

    ```


    ### 描述：

    回到上一个目录。


    命令：

    ```

    cd -

    ```


    ### 描述：

    显示内置内置命令列表。


    命令：

    ```

    help

    ```


    ### 描述：

    列出你的最后登录记录。


    命令：

    ```

    last yourusername

    ```


    ### 描述：

    创建一个名为 myfiles 的目录。


    命令：

    ```

    mkdir myfiles

    ```


    ### 描述：

    删除目录 myfiles。


    命令：

    ```

    rmdir myfiles

    ```


    ### 描述：

    禁用特定用户 "root1" 的密码。


    命令：

    ```

    passwd -d root1

    ```


    ### 描述：

    切换到用户 "root1"。


    命令：

    ```

    sudo su root1

    ```


    ### 描述：

    退出终端窗口。


    命令：

    ```

    logout

    ```


    ### 描述：

    创建一个用户 "root1"。


    命令：

    ```

    useradd "root1"

    ```


    ### 描述：

    为用户 "root1" 分配密码。


    命令：

    ```

    passwd "root1"

    ```


    ### 描述：

    重复上一个命令。


    命令：

    ```

    !!

    ```


    ### 描述：

    显示你以什么身份登录的。


    命令：

    ```

    whoami

    ```


