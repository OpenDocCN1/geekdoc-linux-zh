- fmt: "\n# Every time switch on your computer on, it will come to the Login window,\
    \ where you have to type your name and password. But how that Login window looks\
    \ like, and what is displayed on it, is a totally different story. Let us configure\
    \ it for you.\n\n## Login Window Configuration\n\n- Under `Administration`, in\
    \ the open `System Settings` window, click on the `Login Window` icon.\n\n![](image_rsrc24V.jpg)\n\
    \n- If you see an `Authentication` little window appear, that means that there\
    \ has been set a `User Account` already, and that is about the `Administration`\
    \ account, whoever is an `Administrator` on your computer. Usually, it is you,\
    \ the owner of the computer, who will be the `Administrator`. So, you have to\
    \ type the `Administrator User Account` password, in order to continue.\n\n- It\
    \ does not mean that you will see that `Authentication` window appear, but it\
    \ all depends, if an `Administrator` account is already configured or not.\n\n\
    ![](image_rsrc24W.jpg)\n\n- In the `Login Window` settings, click on the `Appearance`\
    \ tab.\n\n- Under `General`, click on the drop down menu on the right side of\
    \ the window, in the `Alignment` field, and chose, where on the screen you want\
    \ the Login to be. \n\n![](image_rsrc24X.jpg)\n\n- You can see on the following\
    \ image bellow, that you can align the Login window, in the center, left or right\
    \ side.\n\n![](image_rsrc24Y.jpg)\n\n- Under `Background`, click on the background\
    \ buttons on the right side, and chose the background you prefer.\n\n![](image_rsrc24Z.jpg)\n\
    \n- Navigate to the background images on your computer, and chose the background\
    \ you prefer. You can use any images you already have, on your computer, if you\
    \ have any, and use any of them, for the background.\n\n![](image_rsrc250.jpg)\n\
    \n- If there are a few users, configured on your computer already, any time any\
    \ user comes to the Login window, and try to login, that particular user background\
    \ image, will be displayed. But, to be able to have that option, you have to click\
    \ on the little white button, on the right side of the window, in the `Draw user\
    \ backgrounds` field, under `Backgrounds`.\n\n![](image_rsrc251.jpg)\n\n- Now,\
    \ let us chose some theme for the Login window. To do that, click on the drop\
    \ down menu, in the `GTK theme` field, under `Themes`, in the open window.\n\n\
    ![](image_rsrc252.jpg)\n\n- From the drop down menu, with various available themes,\
    \ click and select the theme you prefer to use.\n\n![](image_rsrc253.jpg)\n\n\
    - For the theme of the icons used in your Login window, click on the drop down\
    \ menu, in the `Icon theme` field, under `Themes`.\n\n![](image_rsrc254.jpg)\n\
    \n- Click on any of the icon themes available, in the drop down menu.\n\n![](image_rsrc255.jpg)\n\
    \n- Next is to select the theme for the mouse pointer, in the Login window. To\
    \ do that, click on the drop down menu, in the `Mouse pointer` field, under `Themes`.\n\
    \n![](image_rsrc256.jpg)\n\n- Select one of the themes from the drop down menu,\
    \ for the mouse pointer, in the `Mouse pointer` field, under `Themes`.\n\n![](image_rsrc257.jpg)\n\
    \n- Let us configure the size of the mouse pointer, for the Login window. To do\
    \ that, click on the slider, in the `Mouse pointer size` field, and while you\
    \ click and hold down the mouse button, drag to the left or right, the slider,\
    \ to determine the size of the mouse pointer, which you prefer.\n\n![](image_rsrc258.jpg)\n\
    \n## Users Settings\n\n- Let us configure now, some of the users settings, that\
    \ is the user of your computer. To do so, click on the `Users` tab, in the open\
    \ window.\n\n![](image_rsrc259.jpg)\n\n- Under `User list`, click on the little\
    \ white button, on the right side, in the `Allow manual login` field. That option,\
    \ will ask any of the users of your computer, when they want to login and use\
    \ your computer, for their password. The other alternative for login into your\
    \ computer, is the automatic login, which will be available, if the manual login\
    \ is disabled. So enable the manual login, for a better security of your computer.\n\
    \n![](image_rsrc25A.jpg)\n\n- Under `Guest sessions`, click on the little white\
    \ button, on the right side of the window, in the `Allow guest sessions` field.\
    \ That is a very good feature in the `Linux Mint 21.3 Cinnamon`, because it enables\
    \ you to let anyone else who wants to use your computer for browsing the Internet,\
    \ or doing other computer tasks, to be able to do so. And do not worry, the guest\
    \ users using your computer, would not be able to see or browse your files and\
    \ folders, on your computer, because Linux will protect them automatically, so\
    \ a guest user of your computer, can not see or do whatever, with your own files\
    \ and folders on your computer.\n\n![](image_rsrc25B.jpg)\n\n- If you want to\
    \ enable the automatic login into your computer, you can type the user name and\
    \ password for that particular user, in the fields available, under `Automatic\
    \ login` option.\n\n![](image_rsrc25C.jpg)\n\n## Additional Settings\n\n- Let\
    \ us configure some other additional settings, for the Login window.\n\n- Click\
    \ on the `Settings` tab.\n\n- Under the `Panel indicators`, click on the little\
    \ white button, on the right side of the window, in the `Allow manual login` field.\
    \ That option, will ask any of the users of your computer, when they want to login\
    \ and use your computer, for their password. The other alternative for login into\
    \ your computer, is the automatic login, which will be available, if the manual\
    \ login is disabled. So enable the manual login, for a better security of your\
    \ computer. ![](image_rsrc25D.jpg)\n\n- To see the features available, on the\
    \ Login window, by clicking on the little white button, for each of the features.\
    \ If you want the clock to be visible, in the Login window, click on the little\
    \ white button, the `Clock` field, under `Panel indicators`. ![](image_rsrc25D.jpg)(image_rsrc25E.jpg)\n\
    \n### USERS AND GROUPS\n\n- In this part of the tutorial, we will configure the\
    \ users who are to use your computer.\n\n- Click on the `Users and Groups` icon,\
    \ under `Administration`, in the open `System Settings` window.\n\n![](image_rsrc25F.jpg)\n\
    \n- First, I am going to show you how to change or configure the settings, of\
    \ an user who has been added to your computer. Latter in this tutorial, I will\
    \ show you how to add new users.\n\n- Now, when the `Users and Groups` window\
    \ is open, as an example here, you can see, that a user, with the name `Deyan`,\
    \ has been added to the computer, and that user’s name appears in the open `Users\
    \ and Groups` window. These settings here for the user `Deyan`, are only given\
    \ as an example, for you to see how to configure or change on an already existing\
    \ user, on your computer.\n\n- Click on the user `Deyan`, under the `Users` tab,\
    \ in the open window.\n\n- On the right side of the window, you will see the option\
    \ to change the picture of that user. That is the `Picture` option.\n\n![](image_rsrc25G.jpg)\n\
    \n- Click on the `Picture` option, in the window, in order to change the user\
    \ picture.\n\n![](image_rsrc25H.jpg)\n\n- From the pictures available, in the\
    \ drop down list of pictures, click and chose the one you like. If you want to\
    \ use your own photo, instead of the pictures available, click on the `Browse\
    \ for more pictures` button…\n\n![](image_rsrc25J.jpg)\n"
