    - 在 `Item` 下，在打开的窗口中，点击取消勾选 `Internet` 框，换句话说，就是让 `Internet` 类别处于未选中或未勾选状态。


    ![](img/image_rsrc26R.jpg)


    - 你现在可以看到，`Main Menu` 的应用程序类别中不再显示 `Internet` 应用程序类别，因为我们在上一步中取消勾选了 `Internet`
    类别的复选框。


    ![](img/image_rsrc26S.jpg)


    - 在 `Item` 下，在打开的窗口中，通过点击复选框，点击并选择 `Internet` 类别。


    ![](img/image_rsrc26T.jpg)


    - 现在，`Internet` 应用程序类别将在 `Main Menu` 的应用程序类别中变得可见了。


    ![](img/image_rsrc26U.jpg)


    - 如果你想从 `Main Menu` 中删除并移除 `Internet` 应用程序类别，请点击选中它，然后点击位于打开窗口右侧的 `Delete` 按钮。


    ![](img/image_rsrc26V.jpg)


    - `Internet` 是 `Main Menu` 中的一个应用程序类别。但在该 `Internet` 应用程序类别中包含一些快捷方式，例如 `Firefox`
    浏览器的快捷方式。


    - 点击 `Main Menu` 中的 `Internet` 应用程序类别以选中它。


    ![](img/image_rsrc26W.jpg)


    - 当选中 `Internet` 应用程序类别时，你可以在打开的 `Main Menu` 的 `Item` 下看到 `Internet` 类别下的各种应用程序图标或快捷方式。


    - 例如，如果你点击取消勾选 `Firefox Web Browser` 复选框，那么 `Firefox Browser` 将不再出现在 `Main Menu`
    的 `Internet` 类别下。


    ![](img/image_rsrc26X.jpg)


    - 如果你在打开的 `Main Menu` 的 `Item` 下，在 `Internet` 类别中点击并选中 `Firefox Web Browser` 复选框，`Firefox
    Web Browser` 快捷图标将再次出现在 `Main Menu` 的 `Internet` 类别下。


    ![](img/image_rsrc26Y.jpg)[](image_rsrc26Z.jpg)


    - 当你想向 `Internet` 应用程序类别添加新的应用程序快捷图标时，你可以点击并选中 `Main Menu` 中的 `Internet` 类别，然后点击位于打开窗口右侧的
    `New Item` 按钮。这将开始创建一个新的应用程序启动器。


    ![](img/image_rsrc270.jpg)


    - 在打开的 `Launcher Properties` 窗口中，输入你想添加的应用程序快捷方式名称。然后点击 `Browse` 按钮，导航到计算机上该应用程序所在的位置。


    - 一旦你找到了想要添加到 `Internet` 类别的应用程序，点击 `OK` 按钮。


    ![](img/image_rsrc271.jpg)


    - 当你想查看 `Main Menu` 中某个应用程序类别的属性时，点击 `Main Menu` 中的该特定类别，然后点击位于打开窗口右侧的 `Properties`
    按钮。这将显示该应用程序类的属性。


    ![](img/image_rsrc272.jpg)


    - 你对 `Main Menu` 进行了某些更改，但有时你可能对所做的更改并不满意，想从头开始，或者将 `Main Menu` 恢复到默认设置。


    - 如果你想将 `Main Menu` 恢复到默认设置，点击位于打开窗口左下角的 `Restore System Configuration` 按钮。


    ![](img/image_rsrc273.jpg)


    # SYNAPTIC PACKAGE MANAGER


    - 每当你想在计算机上安装某些新应用程序，或想更新或移除应用程序时，都可以使用 `Synaptic Package Manager`。这是一个让你免费安装超过
    70,000 个应用程序的程序。


    - 要打开 `Synaptic Package Manager`，打开 `Main Menu`。


    - 点击菜单中的 `Administration` 应用程序类别。


    - 点击子菜单中的 `Synaptic Package Manager`。


    ![](img/image_rsrc274.jpg)


    - 如果看到出现 `Authentication` 窗口，请输入你的 `Administrator password` 以继续使用 `Synaptic Package
    Manager`。出现 `Authentication` 窗口的唯一是你已经在计算机上安装了 `Administrator` 用户，通常情况下该用户是你，即计算机的所有者。


    - `Linux Mint 21.3 Cinnamon` 不带 `root login password`，而该 root 密码用于管理 `Linux Mint
    21.3 Cinnamon`。因此，如果计算机上还没有安装 `Administrator` 用户，就没有理由输入任何身份验证密码。


    ![](img/image_rsrc275.jpg)


    - 你在下方图中看到的是 `Synaptic Package Manager` 窗口。


    - 点击窗口左上角的 `All`。这会让所有应用程序在窗口右侧显示，以便你浏览并安装其中任何一个。


    - 查看 `Synaptic Package Manager` 窗口的左下角，此时显示有 77,794 个应用程序供下载和安装。


    ![](img/image_rsrc276.jpg)


    - 点击列表中可用的任何应用程序。在打开的 `Synaptic Package Manager` 窗口列表中，右键点击任意应用程序以选中它。这将弹出一个菜单，你可以选择安装。


    ![](img/image_rsrc277.jpg)


    - 当你想安装 `Firefox Web Browser` 时，只需点击 `Apply` 按钮即可。


    ![](img/image_rsrc278.jpg)


    - 你会看到 `Firefox Web Browser` 已经已安装。


    ![](img/image_rsrc27A.jpg)


    - 如果你在打开的 `Main Menu` 的 `Item` 下，在 `Internet` 类别中点击并选中 `Firefox Web Browser` 复选框，它将再次出现在
    `Main Menu` 的 `Internet` 类别下。


    - 点击 `Apply` 按钮即可。


    ![](img/image_rsrc27B.jpg)


    - 当你想向 `Internet` 应用程序类别添加新的应用程序快捷图标时，可以按照上述步骤操作（如前文）。


    ![](img/image_rsrc27C.jpg)


    - 在打开的 `Launcher Properties` 窗口中，输入你想添加的应用程序快捷方式名称。然后点击 `Browse` 按钮，导航到计算机上该应用程序所在的位置。


    - 一旦你找到了想要添加到 `Internet` 类别的应用程序，点击 `OK` 按钮。


    ![](img/image_rsrc27D.jpg)


    - 当你想查看 `Main Menu` 中某个应用程序类别的属性时，点击 `Main Menu` 中的该特定类别，然后点击位于打开窗口右侧的 `Properties`
    按钮。这将显示该应用程序类的属性。


    ![](img/image_rsrc27E.jpg)


    - 如果你想移除刚刚安装的应用程序，在打开的 `Synaptic Package Manager` 窗口列表中选中该应用程序。右键点击你想移除的应用程序，在在菜单中点击
    `Mark for Complete Removal`。


    ![](img/image_rsrc27F.jpg)


    - 点击窗口左侧的 `Apply` 按钮。


    ![](img/image_rsrc27G.jpg)


    - 你将看到 `Summary` 窗口弹出，它将显示要从计算机中移除的应用程序。


    - 点击底部右侧的 `Apply` 按钮。


    ![](img/image_rsrc27H.jpg)


    - 应用程序将从你的计算机上卸载。你可以看到打开窗口列表列表中应用程序名称旁的小方框变回白色或空白，这意味着该应用程序未安装在你的计算机上。


