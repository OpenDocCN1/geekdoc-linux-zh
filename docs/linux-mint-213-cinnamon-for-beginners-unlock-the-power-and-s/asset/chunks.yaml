  trans: '


    - 当你设置面板（Panel）时，请注意，在对面板进行任何更改之前，必须先将其切换到“编辑模式（Edit mode）”。


    - 在面板的空白处点击鼠标右键，然后从弹出菜单中点击“面板编辑模式”按钮。一旦点击后，你就可以开始配置和更改面板上的内容了。


    ![](img/image_rsrc246.jpg)


    - 在面板的左下角是所谓的“分组窗口列表（Grouped window list）”。也就是说，某些应用程序图标被分组合在一个列表中，这些就是你在面板左下角看到的图标。


    - 如果你想从面板中移除分组窗口列表，只需在面板左侧的这些分组图标上点击鼠标右键，然后从弹出菜单中点击“移除分组窗口列表（Remove Grouped window
    list）”选项。


    ![](img/image_rsrc247.jpg)


    ## 首选应用程序 (PREFERRED APPLICATIONS)


    - 有时，你可能希望使用特定的应用程序来完成电脑上的某项任务，但在执行相同任务时倾向于使用其中一个而不是另一个。例如，你可能更倾向于使用 Mozilla Firefox
    浏览器浏览网页，而不是 Chrome 浏览器。现在我们来配置 Linux Mint 21.3 Cinnamon 中的首选应用程序。


    - 在打开的“系统设置（System Settings）”窗口中，点击“偏好（Preferences）”下的“首选应用程序”图标。


    ![](img/image_rsrc248.jpg)


    - 点击“首选应用程序”标签页。


    ![](img/image_rsrc249.jpg)


    - 在“多媒体（Multimedia）”选项下，点击“照片（Photos）”字段中的下拉菜单。


    - 从下拉菜单中选择你喜欢的用于显示电脑照片的应用程序。例如，你可以从下拉菜单中选择“图片查看器（Image Viewer）”应用程序。


    - 同样，你也可以为其他电脑任务选择首选应用程序，例如浏览网页或撰写办公文档。


    ![](img/image_rsrc24A.jpg)


    - 现在，在打开的“系统设置”窗口中点击“可移动媒体（Removable media）”标签页。


    - 在这一步中，我们将配置每当你将可移动媒体插入电脑端口时会发生什么情况。


    - 例如，如果你在电脑 CD 播放器中插入一张音频 CD，你可以设置电脑上某个特定的应用程序来自动播放该音频 CD。


    ![](img/image_rsrc24B.jpg)


    - 在“可移动媒体”选项下的“选择音频 CD 的应用程序（Select an application for audio CDs）”字段中，你可以点击下拉菜单并选择
    Rhythmbox 播放器来播放音频 CD。


    ![](img/image_rsrc24C.jpg)


    - 但如果你对下拉菜单中提供的播放特定媒体的应用程序不满意，可以点击窗口底部中间的“其他媒体（Other Media…)”按钮，选择另一个应用程序来播放该媒体。电脑上还可以使用其他类型的媒体，你只需点击“其他媒体”按钮并进行选择，也可以播放这些媒体。


    ![](img/image_rsrc24D.jpg)


    - 你可以从下面的图片看到菜单中可用的其他类型媒体。


    ![](img/image_rsrc24E.jpg)


    - 例如，你可以从下拉菜单中选择电子书阅读器（E-book reader），以便你的电脑处理该特定类型的媒体。


    - 你还可以在打开的小窗口中选择“询问做什么（Ask what to do）”下拉菜单中的操作选项，这样你就会收到消息，询问你想要对电脑上的该特定媒体做什么，而不是自动用某个应用程序播放它。


    ![](img/image_rsrc24F.jpg)


    - 点击下拉菜单中的“其他应用程序（Other application…)”选项，选择另一个应用程序来播放该媒体。


    ![](img/image_rsrc24G.jpg)


    - 例如，在电脑上阅读电子书，你可以从可用应用程序列表中选择“文档查看器（Document Viewer）”应用程序。


    ![](img/image_rsrc24H.jpg)


    ## 隐私 (PRIVACY)


    - 现在让我们讨论一下如何处理之前在电脑上查看或使用过的所有文件。你是希望保留电脑上使用的文件记录，还是希望将它们从电脑中删除以保护你的电脑隐私？


    - 在打开的“系统设置”窗口中，点击“偏好（Preferences）”下的“隐私”图标。


    ![](img/image_rsrc1YE.jpg)


    - 打开隐私设置后，点击窗口右侧“记住最近访问的文件（Remember recently accessed files）”选项的小白色按钮。这将使你最近访问的文件保留在电脑上。如果点击或启用该按钮，电脑将不会保留最近访问的文件。


    ![](img/image_rsrc24J.jpg)


    - 在“最近文件（Recent files）”选项下，点击窗口右侧“永不忘记旧文件（Never forget old files）”字段的小白色按钮。这将允许电脑保留你最近访问的文件一段时间，持续时间取决于你设置的保留时间。


    - 在“记住旧文件的天数（Number of days to remember old files）”字段中，点击窗口右侧的加号或减号，选择你想保留多少天。


    ![](img/image_rsrc24K.jpg)


    ## 屏幕保护程序 (SCREAVER)


    - 如果你想在电脑上使用屏幕保护程序，请在“系统设置”窗口中点击“偏好（Preferences）”下的“屏幕保护程序”图标。


    ![](img/image_rsrc1YE.jpg)


    - 打开屏幕保护设置后，点击“设置（Settings）”标签页。


    ![](img/image_rsrc24M.jpg)


    - 在屏幕保护设置下，点击“启动屏幕保护之前的延迟（Delay before starting the screensaver）”字段中的下拉菜单。设置你希望激活屏幕保护程序之前的分钟数。


    ![](img/image_rsrc24N.jpg)


    - 如果你想增加电脑隐私性，可以设置电脑在每次进入睡眠模式时自动锁定。


    - 点击窗口右侧“进入睡眠时锁定电脑（Lock the computer when put to sleep）”字段的小白色按钮。这样每当电脑进入睡眠模式时都会锁定，每当你唤醒或重新启动电脑时，屏幕都会显示锁定状态。你需要输入登录密码来解锁屏幕并开始使用电脑。


    ![](img/image_rsrc24P.jpg)


    - 另一个增加隐私的选项是选择在屏幕保护程序激活时自动锁定电脑。


    - 点击打开窗口右侧“启动屏幕保护后锁定电脑（Lock the computer after the screensaver starts）”字段的小白色按钮。


    ![](img/image_rsrc24R.jpg)


    - 如果你已选择在电脑上使用屏幕保护程序，现在是时候自定义该屏幕保护程序了。


    - 点击屏幕保护设置窗口中的“自定义（Customize）”标签页。


    ![](img/image_rsrc24S.jpg)


    - 我们将配置的第一个选项是，如果你希望在屏幕保护程序激活的任何时候显示时，请点击窗口右侧“日期和时间（Date and Time）”选项下的“始终显示时（Always
    show the clock）”字段的小白色按钮。


    ![](img/image_rsrc24T.jpg)


    - 屏幕保护设置中有一个消息选项，如果你想在屏幕保护程序中输入任何消息，可以这样做。


    - 在“离开时的消息（Away message）”选项下，在“锁定时显示此消息（Show this message when the screen is locked）”字段中输入你的消息。这里给出的示例是“不要碰我的电脑!!!”。这就是每次屏幕保护程序开启时都会显示的消息。


    ![](img/image_rsrc24U.jpg)


    ## 管理 (ADMINISTRATION)


    ### 登录窗口 (LOGIN WINDOW)


