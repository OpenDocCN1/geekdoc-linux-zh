    ![](image_rsrc25K.jpg)


    - Click on the `Password` option, to change the existing user login password.


    - When the `Change Password` window opens, type your new chosen password, for
    login on your computer. Type the same new password twice.


    - Click on the `Change` button.


    ![](image_rsrc25M.jpg)


    - For the `Name` option, type and change the name of the user, if you want to
    do so.


    ![](image_rsrc25N.jpg)


    - When you want to add a new user to your computer, click on the `Add` button,
    located at the bottom left side, of the open `Users and Groups` window, under
    the `Users` tab.


    ![](image_rsrc25P.jpg)


    - `Account Type`, chose the Standard type! Do not give any other users of your
    computer, the Administrator type of account, because they can mess up your operating
    system! Keep the Administrator account for yourself, the owner of the computer!


