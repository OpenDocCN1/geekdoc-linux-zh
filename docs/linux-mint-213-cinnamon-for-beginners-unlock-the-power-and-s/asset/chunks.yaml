    CONFIGURE


    ● You can use the Main Menu, as it comes configured by default, with the Linux
    Mint 21.3 Cinnamon, but, it is always good, to know, how can you configure it,
    and add or remove, other applications shortcut icons.


    ● With the right mouse button, click over the Linux Mint logo, on the bottom of
    the Main Menu.


    ●       In the menu which will popup, click on the Configure option.


    ![](image_rsrc261.jpg)


    ●       Once the Main Menu settings window is open, click on the Panel tab.


    ![](image_rsrc262.jpg)


    ● Under the Appearance option, click on the little white button, on the right
    side fo the window, in the Use a custom icon and label field. That will allow
    you to change the icon of the Main Menu, which you see, at the bottom of the Main
    Menu. That is, if you want to add another Main Menu icon.


    ![](image_rsrc263.jpg)


    ● In the Icon field, click on the little icon button, located at the right side
    of the window.


    ![](image_rsrc264.jpg)


    ● From the Choose an icon open window, click on one of the icons available, which
    you prefer to have for the Main Menu.


    ![](image_rsrc265.jpg)


    ● In the Icon size (px) field, click on the plus or minus signs, on the right
    side of the window, to adjust the size of the Main Menu icon.


    ● In the Text field, type the text you want to appear, on the Main Menu, next
    to the Main Menu icon.


    ![](image_rsrc266.jpg)


    ● Under the Behavior option, click on the little white button, on the right side
    of the window, in the Force the panel to be visible when opening the menu field.
    That will cause the Panel also to be visible, each time you open the Main Menu,
    if the Panel has been configured, to be auto-hidden.


    ![](image_rsrc267.jpg)


    ●       Now, click on the Menu tab, in the open Menu settings window.


    ● Under the Layout and content option, click on the little white button, on the
    right side of the window, in the Show category icons field. That will allow the
    category icons, to be visible for each application, in the Main Menu.


    ![](image_rsrc268.jpg)


    ● You can adjust the size of the category icons, in the Main Menu. To do that,
    click on the plus or minus signs, in the Categories icon size (px) field.


    ![](image_rsrc269.jpg)


    ● Still under the Layout and content option, click on the little white button,
    located on the right side of the window, in the Show favorites and session buttons
    field. That will show all those Favorites icons, the shortcut icons, of various
    applications, in the Main Menu. The Session icons also will be displayed, in the
    Main Menu.


    ![](image_rsrc26A.jpg)


    ● Now, notice that the Favorites and Session icons, will be displayed on the very
    left side, of the Main Menu.


    ![](image_rsrc26B.jpg)


    ● Now I am going to show you, how the size of the Favorites icons, on the Main
    Menu, look like, when you change their size.


    ● Under the Layout and content option, click on the plus sign, in the Favorites
    icons size (px) field. Make it up to 60.


    ![](image_rsrc26C.jpg)


    ●       Now the Favorites icons size looks much bigger, than it was before.


    ![](image_rsrc26D.jpg)


    ●       Look how big the Favorites icons size is, after the change.


    ![](image_rsrc26E.jpg)


    ● If you want the Favorites and Places folders, to be shown in the Main Menu,
    next to the applications categories, click on the little white button, on the
    right side of the window, in the Show bookmarks and places field, under the Layout
    and content option.


    ![](image_rsrc26F.jpg)


    ● Now you can see, that the Favorites and Places folders, are visible in the Main
    Menu.


    ● If you click on the Favorites folder, you will see your bookmarked files or
    folders, on your computer.


    ● If you click on the Places folder, it will navigate you, to various places on
    your computer.


    ![](image_rsrc26G.jpg)


    ● To configure the Main Menu further, click on the Open the menu editor button,
    located towards the bottom middle of the open window.


    ![](image_rsrc26H.jpg)


    ● You can see, that the Main Menu editor window, is open, and you can carry on
    configuring the Main Menu.


    ![](image_rsrc26J.jpg)


    ● You can also restore the size of the Main Menu, to its original size, after
    you have made some changes, if you wish to do so. To do so, click on the Restore
    the menu to its original size button, in the lower middle part, of the open window.


    ![](image_rsrc26K.jpg)


    ● Sometimes, you will make some changes, to the Main Menu, but occasionally, you
    may not like those changes, and you want to go back, to the Main Menu default
    settings.


    ● To restore the Main Menu to its default settings, click on the little square
    button, with three lines on it, located at the top right side, of the open window.


    ● From the drop down menu, click on the Reset to defaults option. That will bring
    back the Main Menu, to its original settings.


    ![](image_rsrc26M.jpg)


    EDIT MENU


    ● In this step, we will configure the Main Menu, in such way, that we will chose,
    which application categories, and application icons, will appear, and which will
    not appear, in the Main Menu.


    ● Right click on the Main Menu logo icon, located at the bottom left corner, with
    the right mouse button.


    ●       From the popup menu, click on the Edit menu option.


    ![](image_rsrc26N.jpg)


    ● Click on Applications icon, located at the top of the open window. All the applications
    categories, are under that Applications icon. You can see all the applications
    categories on the left side of the open window.


    ![](image_rsrc26P.jpg)'
