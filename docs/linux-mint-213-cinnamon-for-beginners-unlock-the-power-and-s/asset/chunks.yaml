  trans: "\n\n- 在打开的窗口中，点击`General Settings`（通用设置）标签。\n\n![](img/image_rsrc23D.jpg)\n\
    \n- 在`General Desklets Settings`（桌面组件设置）选项下，点击窗口右侧`Decorations of desklets`（组件装饰）字段中的下拉菜单。然后从该下拉菜单中选择你喜欢的装饰设置。\n\
    \n![](img/image_rsrc23E.jpg)\n\n- 如果你想将`Desktop`（桌面）上的`Desklets`组件锁定在某个固定位置，可以通过点击窗口右侧`Lock\
    \ desklets in their current position`（锁定组件在当前位置）字段中的白色小按钮来实现。\n\n![](img/image_rsrc23F.jpg)\n\
    \n# 桌面\n\n- 你有一个选项，可以选择哪些文件夹显示在你的`Desktop`上，或者哪些不显示，而且不仅是文件夹，如果你想让`Network`（网络）以及一些挂载驱动器的快捷方式图标显示在桌面上。\n\
    \n- 在`System Settings`（系统设置）窗口中，点击`Preferences`（偏好）下的`Desktop`图标。\n\n![](img/image_rsrc23G.jpg)\n\
    \n- 在下方的图片中，你可以看到`Desktop Layout`（桌面布局）设置。\n\n- 要选择哪些图标显示或不显示在`Desktop`上，点击窗口右侧每个文件夹字段的小按钮。例如，如果你想让`Computer`（计算机）文件夹显示在`Desktop`上，就点击`Computer`字段中的按钮。\n\
    \n![](img/image_rsrc23H.jpg)\n\n# 热角 \n\n- 现在，让我们来配置`Linux Mint 21.3 Cinnamon`中最实用的功能，那就是`Hot\
    \ Corners`（热角）功能。我之所以说它是实用的功能之一，是因为`Hot Corner`的作用之一就是让你能够快速在打开的应用程序窗口之间切换，从而更快地在电脑上完成任务。\n\
    \n- 在`Preferences`（偏好）下，点击`Hot Corners`图标。\n\n![](img/image_rsrc23J.jpg)\n\n-\
    \ 在打开的`Hot Corner`设置窗口中，点击`Enable this corner`（启用此角）选项旁的小按钮。\n\n- 从下拉菜单中，我建议你使用`Show\
    \ all workspaces`（显示所有工作区）选项。这将让你能够快速查看所有已打开的应用程序窗口，从而选择你想处理哪一个应用程序窗口。\n\n![](img/image_rsrc23K.jpg)\n\
    \n- 一旦启用了`Hot Corner`，只需将鼠标指针悬放在屏幕左上角，即可立即看到所有工作区以及所有打开的的窗口。\n\n![](img/image_rsrc23M.jpg)![](img/image_rsrc23N.jpg)\n\
    \n- 如果你想启用额外的`Hot Corner`，即第二个`Hot Corner`，可以点击打开的`Hot Corners`设置窗口右上角的`Enable\
    \ this corner`（启用此角）选项的白色小按钮。\n\n- 从下拉菜单中，点击并选择`Show the desktop`（显示桌面）选项。这将让你在任何将鼠标指针放在屏幕右上角时都能快速查看`Desktop`。\n\
    \n![](img/image_rsrc23P.jpg)\n\n# 通知\n\n- 我不知道你们如何，但我讨厌某些通知不断在我的`Desktop`上弹出。但如果你喜欢在电脑上接收通知，那么让我们现在来配置它们。\n\
    \n- 在`System Settings`（系统设置）窗口中，点击`Preferences`（偏好）下的`Notification`（通知）图标。\n\n\
    ![](img/image_rsrc23R.jpg)\n\n- 在打开的`notifications`设置窗口中，点击窗口右侧`Enable notifications`（启用通知）字段中的白色小按钮。这将开启电脑上的通知功能。\n\
    \n- 关于电脑通知的另一个可配置选项是，如果你希望在通知过期后将其移除。要这样做，请点击窗口右侧`Remove notifications after their\
    \ timeout is reached`（在超时后移除通知）字段中的白色小按钮。\n\n- 然后，在`Notification duration (seconds)`（通知持续时间（秒））字段中，点击窗口右侧的加号或减号，选择通知显示多久。\n\
    \n![](img/image_rsrc23S.jpg)\n\n# 面板\n\n- 现在让我们在这一步中配置`Panel`（面板）。你可能会奇怪`Panel`是什么？很好，它是你在桌面屏幕底部看到的条条。\n\
    \n- 在打开的`System Settings`（系统设置）窗口中，点击`Preferences`（偏好）下的`Panel`图标。\n\n![](img/image_rsrc23T.jpg)\n\
    \n- 在`Panel Visibility`（面板可见性）的`Auto hide panel`（自动隐藏面板）字段下，点击窗口右侧的下拉菜单，选择你希望在使用电脑时对`Panel`发生什么。我建议你选择`Auto\
    \ hide panel`（自动隐藏面板）选项，因为当你不需要它时，`Panel`会从屏幕上消失，这意味着屏幕上会有更多空间显示其他打开的应用程序。另一个选项是始终显示`Panel`，但同样，`Panel`会占用屏幕空间，留给应用程序窗口显示的空间更少。\n\
    \n![](img/image_rsrc23U.jpg)\n\n- 在`Customize`（自定义）选项下，向左或向右移动滑块以调整高度。\n\n- 在`Panel\
    \ appearance`（面板外观）选项下，点击`Iconic size (px)`字段右侧的加号或减号，以调整图标大小。\n\n![](img/image_rsrc23W.jpg)\n\
    \n- 在`General Panel`（常规面板）选项下，点击`Panel edit mode`（面板编辑模式）按钮。\n\n![](img/image_rsrc23X.jpg)\n\
    \n- 当面板处于编辑模式时，你就可以就可以将`Panel`上的内容移动到其他位置。例如，用鼠标点击`Panel`上的`time icon`（时间图标）并按住左键，将`time\
    \ icon`拖向左侧。\n\n![](img/image_rsrc23Y.jpg)\n\n- 在下方的图片中，你可以看到`time icon`已移动了位置。\n\
    \n![](img/image_rsrc23Z.jpg)\n\n- 如果你想在桌面上添加另一个面板，可以在`General Panel`选项下点击`Add\
    \ new panel`（添加新面板）按钮。记住，`Panel`必须处于编辑模式。\n\n![](img/image_rsrc240.jpg)\n\n- 现在你看到屏幕边缘显示了四条粗红线。这四条红线是你可以选择放置新`Panel`的位置。例如，如果你用鼠标指针点击顶部的红线，那就是第二个`Panel`显示的位置。\n\
    \n![](img/image_rsrc241.jpg)\n\n- 在下方的图片中，你可以看到新的`Panel`现在位于屏幕顶部。这就是你在屏幕顶部看到的宽宽黑线。\n\
    \n![](img/image_rsrc242.jpg)\n\n- 如果你想从屏幕顶部移除创建的第二个`Panel`，可以在顶部的`Panel`上点击右键。\n\
    \n- 在弹出的菜单中，如果你想向那个新`Panel`添加一些插件，可以点击`Applets`（插件）选项。\n\n- 在弹出的菜单中，你也可以通过点击菜单中的`Remove`（移除）选项来移除第二个`Panel`。\n\
    \n- 在显示的菜单中，有一个通过点击`Panel settings`（面板设置）选项来配置第二个`Panel`的。\n\n![](img/image_rsrc243.jpg)\n\
    \n- 如果你想将`Panel`恢复到默认设置（例如），`Panel`实际上有一个故障排除选项。但不限于恢复默认的`Panel`设置，你也可以重启 Cinnamon\
    \ 桌面环境。\n\n- 在`Panel`上的空白处点击鼠标右键。在弹出的菜单中，点击`Troubleshoot`（故障排除）选项。\n\n![](img/image_rsrc244.jpg)\n\
    \n- 点击菜单中的`Restart Cinnamon`（重启 Cinnamon）选项。这将重启 Cinnamon 桌面，在某些情况下，这也是一种故障排除的方法。\n\
    \n![](img/image_rsrc245.jpg)\n\n"
- fmt: '

    - When you are setting up the Panel, it is important to notice, that the Panel
    has to be switched into the Edit mode first, before you do any changes to it.


    - Right click with the right mouse button, on an empty space on the Panel, and
    then, from the popup menu, click on the Panel edit mode button. Once you do, you
    can start configuring and changing things on the Panel.


    ![](image_rsrc246.jpg)


    - On the bottom left side of the Panel, there is the so called Grouped window
    list. That is, some applications icons, are grouped together in a kind of a list,
    and that is the icons you see, at the bottom left side of the Panel.


    - If you want to remove the Grouped window list from the Panel, just click with
    the right mouse button, over those grouped icons, on the left side of the Panel,
    and then, from the popup menu, click on the Remove Grouped window list option.


    ![](image_rsrc247.jpg)


    ## PREFERRED APPLICATIONS


    - Sometimes, you would like to use, not whatever application, for doing a certain
    task on your computer, but you would prefer using one application over another,
    for doing that same task. For example, you may prefer, to use the Mozilla Firefox
    browser, for browsing the Internet, instead of using the Chrome browser, for the
    Internet. So, we come now to configuring the preferred applications, in the Linux
    Mint 21.3 Cinnamon.


    - Click on the Preferred Applications icon, under Preferences, in the open System
    Settings window.


    ![](image_rsrc248.jpg)


    - Click on the Preferred applications tab.


    ![](image_rsrc249.jpg)


    - Under the Multimedia options, click on the drop down menu, in the Photos field.


    - From the drop down menu, choose your preferred application, to use for displaying
    photos, on your computer. For example, you could chose the Image Viewer application
    from the drop down menu.


    - In the same way, you can choose your preferred application, for the other computer
    tasks, like for browsing the Internet, or for typing office documents for example.


    ![](image_rsrc24A.jpg)


    - Now, click on the Removable media tab, in the open System Settings window.


    - Here, in this step, we are going to configure, what happens, every time you
    insert a removable media, into one of your computer ports.


    - For example, if you insert an audio CD, in your computer CD player, you can
    set a particular application on your computer, to play automatically that audio
    CD.


    ![](image_rsrc24B.jpg)


    - Under the Removable media option, in the Select an application for audio CDs
    field, you can click on the drop down menu, and choose the Rhythmbox audio player,
    for playing the audio CD.


    ![](image_rsrc24C.jpg)


    - But, if you are not happy, with the available applications, which are in the
    drop down menus, for playing a certain media, you can click on the Other Media…
    button, located at the bottom middle of the open window, and chose another application,
    for playing that media. There are other types of media, which you could use on
    your computer, and you can play that media too, by just clicking on the Other
    Media button, and making the choice.


    ![](image_rsrc24D.jpg)


    - You can see on the following image bellow, the additional other type of media
    available, in the menu.


    ![](image_rsrc24E.jpg)


    - For example, you can choose an E-book reader from the drop down menu, in order
    for your computer, to handle, that particular type of media.


    - You can also select the option for the Action, in the opened little window,
    of Ask what to do, in the drop down menu, so, you will get a message asking you
    what you want to do, with that particular media, on your computer, instead of
    playing that media, automatically with a certain application.


    ![](image_rsrc24F.jpg)


    - Click on the Other application… option, in the drop down menu, to choose another
    application, for playing that media.


    ![](image_rsrc24G.jpg)


    - For example, for reading E-books on your computer, you can choose the Document
    Viewer application, from the list of applications available.


    ![](image_rsrc24H.jpg)


    ## PRIVACY


    - Let us now discuss, what you want to happen with all those files, you have viewed
    or used on your computer previously. Do you want to keep a history of the files
    you use on your computer, or you want them to be deleted from the computer, so
    you protect your privacy, on the computer?


    - Click on the Privacy icon, under Preferences, in the open System Settings window.


    ![](image_rsrc1YE.jpg)


    - Once the Privacy settings are opened, click on the little white button, on the
    right side of the window, for the Remember recently accessed files option. That
    will cause the recently accessed by you files, to be kept on the computer. If
    that button is not clicked, or enabled, the computer will not keep the recently
    accessed files.


    ![](image_rsrc24J.jpg)


    - Under the Recent files option, click on the little white button, on the right
    side of the window, in the Never forget old files field. That will enable the
    computer, to keep those recently accessed by you files, for a certain period of
    time, the time you set to keep them.


    - In the Number of days to remember old files field, click on the plus or minus
    sign, on the right side of the window, and select how many days you want to keep
    them.


    ![](image_rsrc24K.jpg)


    ## SCREENSAVER


    - In the case you want to use a Screensaver on your computer, click on the Screensaver
    icon, under Preferences, in the open System Settings window.


    ![](image_rsrc1YE.jpg)


    - Once the Screensaver settings are opened, click on the Settings tab.


    ![](image_rsrc24M.jpg)


    - Under the Screensaver settings, click on the drop down menu, on the right side
    of the window, in the Delay before starting the screensaver field. Select the
    time in minutes, after which you want the Screensaver, to be activated.


    ![](image_rsrc24N.jpg)


    - If you want more privacy, on your computer, you can make the computer screen,
    to be locked, every time you put it in Sleep mode.


    - Under the Lock settings option, click on the little white button, on the right
    side of the window, in the Lock the computer when put to sleep field. The computer
    will be automatically locked, every time it goes into Suspend, or Sleep mode,
    and any time you wake up the computer, or start it again, it will show your screen
    being locked. You have to type your login password, in order to unlock the screen,
    and start using your computer.


    ![](image_rsrc24P.jpg)


    - Another option to increase your computer privacy, is to select the option, to
    lock your computer automatically, every time your Screensaver is activated.


    - Click on the little white button, on the right side of the open window, in the
    Lock the computer after the screensaver starts field.


    ![](image_rsrc24R.jpg)


    - If you have chosen to use a Screensaver, on your computer, then now it is the
    time, to customize that Screensaver.


    - Click on the Customize tab, in the open Screensaver settings window.


    ![](image_rsrc24S.jpg)


    - The first option, we are going to configure, is if you want to have the clock
    displayed, on the Screensaver, any time the Screensaver is activated. If you do,
    then click on the little white button, on the right side of the window, under
    the Date and Time option, in the Always show the clock field.


    ![](image_rsrc24T.jpg)


    - There is a message option in the Screensaver settings, so if you want to type
    any message to be displayed in the Screensaver, you can do that.


    - Under the Away message option, type your message in the field available. That
    is in the Show this message when the screen is locked field. The example given
    here is, “Do not touch my computer!!!”. That is the message which will be displayed,
    every time the Screensaver is on.


    ![](image_rsrc24U.jpg)


    ## ADMINISTRATION


    ### LOGIN WINDOW

