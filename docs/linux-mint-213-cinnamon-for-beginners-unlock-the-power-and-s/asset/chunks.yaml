    ● Click on the Picture option, in the window, in order to change the user picture.


    ![](image_rsrc25H.jpg)


    ● From the pictures available, in the drop down list of pictures, click and chose
    the one you like. If you want to use your own photo, instead of the pictures available,
    click on the Browse for more pictures button…


    ![](image_rsrc25J.jpg)


    ● Now for the Account Type option, click on the drop down menu, and chose an Administrator
    type of account, if you are configuring your user account settings, on your computer!!!
    That is important, because the Administrator account type, will give you much
    more privileges on your computer, than the Standard type of account. Those privileges
    mean that you can configure and change much more system settings, than a Standard
    type of account user, can do. But, be very careful, because if you do something
    which you are not sure about, while you are being the Administrator of your computer,
    you could mess up, your Linux Mint 21.3 Cinnamon computer, and damage the operating
    system. The privileges are only good, for people who are sure what they do or
    change on the computer.'
