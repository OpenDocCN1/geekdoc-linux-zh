  trans: '


    - 确保窗口底部的两个复选框 `Connect automatically`（自动连接）和 `Make available to other users`（其他用户可用）已选中。

    - 点击 `Apply`（应用）按钮。


    ![](img/image_rsrc20K.jpg)

    - 你是否看到打开窗口左下角的小加号？那是用于为你的电脑添加新连接的。


    ![](img/image_rsrc20M.jpg)


    - 再次，从下面的图中可以看到，必须启用 `WiFi` 无线连接按钮，你的电脑才能连接互联网。


    ![](img/image_rsrc20N.jpg)


    - 如果你想在家里使用以太网线连接，只需要将以太网线的一端插入电脑或笔记本电脑的以太网口，另一端插入 `router` 设备的以太网口，就完成了。你可以立即开始使用互联网。你不需要任何额外的配置或设置或任何密码。


    ![](img/image_rsrc20P.jpg)


    # 打印机


    - 如果你计划在你的 Linux Mint 21.3 Cinnamon 电脑上使用打印机，那么在这一步中，你将学习如何配置打印机。

    - 在打开的 `System Settings` 窗口中，点击 `Hardware` 下的 `Printers` 图标。


    ![](img/image_rsrc20R.jpg)

    - 当 `Printers` 窗口打开时，点击 `Add` 按钮开始为电脑配置打印机。


    ![](img/image_rsrc20S.jpg)

    - 在打开的 `New Printer` 窗口中，在选项列表中点击 `Generic CUPS Browser` 选项。

    - 点击 `Forward` 按钮继续。


    ![](img/image_rsrc20T.jpg)

    - 你会弹出一个小窗口，显示你的电脑正在搜索打印机驱动程序。驱动程序是一个小型软件，使你的电脑能够与打印机通信并使用打印机打印。


    ![](img/image_rsrc20U.jpg)

    - 在打开的 `New Printer` 窗口中，在 `Choose Driver`选项下，点击并选择 `Select printer from database`（从数据库选择打印机）选项。

    - 如果在显示的打印机列表中看到你的打印机名称，点击它进行选择。例如，如果你的打印机是 `Canon`，点击列表中的 `Canon`，然后点击 `Forward`
    按钮。


    ![](img/image_rsrc20V.jpg)![](img/image_rsrc20W.jpg)

    - 如果你知道你打印机的型号，请点击列表中的该型号名称。例如，在下图中，你可以看到对于 `Canon` 打印机选择了 `BJ-5`。

    - 点击 `Forward` 按钮继续。


    ![](img/image_rsrc20X.jpg)

    - 在可用的 `Printer Name` 字段中输入打印机名称，然后点击 `Apply` 按钮。


    ![](img/image_rsrc20Y.jpg)

    - 如果小窗口中出现打印机测试选项，点击 `Print Test Page`（打印测试页）按钮，查看你新安装的打印机工作情况。不要担心，它不会消耗很多墨水。这是一个很好的功能，因为它向你显示打印机是否已准备好打印。


    ![](img/image_rsrc20Z.jpg)

    - 一个小窗口将向你显示测试页面任务已提交给打印机进行打印。


    ![](img/image_rsrc210.jpg)

    - 在打开的 `Printers` 窗口中，你可以看到在本教程示例中的 `Canon` 打印机已安装成功，它的图标出现在 `Printers` 窗口中。


    ![](img/image_rsrc211.jpg)

    - 现在让我们查看新安装的打印机的一些属性。

    - 点击打开的 `Printers` 窗口中的 `Printer` 标签。


    ![](img/image_rsrc212.jpg)

    - 点击打开菜单中的 `Properties`（属性）选项。


    ![](img/image_rsrc213.jpg)

    - 当 `Printer Properties` 窗口打开时，点击窗口左侧列表中的 `Printer` 选项。

    - 对于 `Page size`（页面大小）选项，你可以点击下拉菜单并选择打印页的尺寸。例如，这里的示例是 `A4` 尺寸。

    - 然后，对于窗口中的 `Resolution`（分辨率）选项，点击下拉菜单并选择你偏好的打印分辨率。记住，如果你选择了更高的打印分辨率，你打印的文本或照片质量会更好，但同时，打印机在打印该文本或照片时消耗更多的墨水。

    - 点击 `OK` 按钮。

    - 查看下面关于调整纸张尺寸和打印分辨率的几张图片。


    ![](img/image_rsrc214.jpg)![](img/image_rsrc215.jpg)![](img/image_rsrc216.jpg)

    - 在打开的 `Printer Properties` 窗口中，点击位于窗口左上角的 `Settings`（设置）选项。


    ![](img/image_rsrc217.jpg)

    - 当你在打印机上尝试打印页面时，面板（Panel）右下角会出现一个小打印机图标。如果你点击该打印机图标，可以导航并查看打印任务，如果你需要，也可以从该打印机图标取消所有打印任务。


    ![](img/image_rsrc21D.jpg)

    - 你也可以通过点击面板上的小打印机图标看到，我们在教程之前进行的测试页打印任务也显示在菜单中。

    - 如果弹出一个窗口询问你继续还是取消测试页打印，你可以选择你想做什么，取消打印任务或继续打印页面。


    ![](img/image_rsrc21E.jpg)

    - 如果你在面板点击小打印机图标后点击弹出菜单中的 `Canon Printer` 选项，你可以看到当前的打印任务。


    ![](img/image_rsrc21G.jpg)

    - 会弹出一个新的 Document Print Status 窗口，这是一个向你显示当前打印任务的窗口，即现在正在打印的文本或照片等文档。例如，在下图中，你可以看到我们之前进行的测试页打印任务作为当前打印任务显示在窗口中。

    - 如果你在打开的 Document Print Status 窗口用鼠标右键点击可见打印任务（在本例中为测试页任务），你会看到一个菜单。通过点击菜单中的
    `Cancel` 选项，你可以取消该测试页打印任务。


    ![](img/image_rsrc21H.jpg)


