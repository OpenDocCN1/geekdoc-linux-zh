- fmt: '

    - Click on the `General Settings` tab, in the open window.


    ![](image_rsrc23D.jpg)


    - Under the `General Desklets Settings` option, click on the drop down menu, on
    the right side of the window, in the `Decorations of desklets` field. Then chose
    the decoration setting you prefer, from that drop down menu.


    ![](image_rsrc23E.jpg)


    - If you want to lock the `Desklets` on the `Desktop`, in a certain fixed position,
    you can do that, by clicking on the little white button, located on the right
    side of the window, in the `Lock desklets in their current position` field.


    ![](image_rsrc23F.jpg)


    # DESKTOP


    - There is an option for you, to chose which folders will be displayed on your
    `Desktop`, or not be displayed on the `Desktop`, and not only folders, but if
    you want the `Network` and some mounted drives and their shortcut icons, to be
    displayed on the desktop.


    - Click on the `Desktop` icon, under `Preferences`, in the `System Settings` window.


    ![](image_rsrc23G.jpg)


    - In the following image bellow, you can see the `Desktop Layout` settings.


    - For choosing which icons will be or not be displayed on the `Desktop`, click
    the little buttons, on the right of the window, for each of the folder fields.
    For example, if you want the `Computer` folder, to be displayed on the `Desktop`,
    then click the button in the `Computer` field.


    ![](image_rsrc23H.jpg)


    # HOT CORNERS


    - And now, let us configure, on the most useful feature in the `Linux Mint 21.3
    Cinnamon`, and that is the feature of the `Hot Corners`. The reason why I am saying
    that it is one of the most useful feature, is because one of the things the `Hot
    Corner` does, is to enable you quickly switch between the open applications windows,
    so you can do your tasks on the computer, much faster.


    - Under `Preferences`, click on the `Hot Corners` icon.


    ![](image_rsrc23J.jpg)


    - In the open `Hot Corner` settings, click on the little button, for the `Enable
    this corner` option.


    - From the drop down menu, I would suggest that you use `Show all workspaces`
    option. That will enable you to have a quick glimpse, of all the opened applications
    windows, at the same time, so that you can choose, which one of all those applications
    windows, you want to work with.


    ![](image_rsrc23K.jpg)


    - Once the `Hot Corner` has been enabled, just place the mouse pointer, over the
    top left corner of the screen, and immediately, you can see all the workspaces
    and the windows of all the opened applications, at once.


    ![](image_rsrc23M.jpg)![](image_rsrc23N.jpg)


    - If you want to enable additional `Hot Corner`, or that is a second `Hot Corner`,
    you can click on the little white button, for the `Enable this corner` option,
    located at the top right corner, of the opened `Hot Corners` settings window.


    - From the drop down menu, click and select the `Show the desktop` option. That
    will enable you to quickly see the `Desktop`, any time you place the mouse pointer,
    over the top right corner of the screen.


    ![](image_rsrc23P.jpg)


    # NOTIFICATIONS


    - I do not know about you, but I hate having some notifications popup on my `Desktop`,
    all the time. But, if you prefer to have notifications on your computer, then
    let us configure them now.


    - Click on the `Notification` icon under `Preferences`, in the `System Settings`
    window.


    ![](image_rsrc23R.jpg)


    - In the open `notifications` settings window, click on the little white button,
    on the right side of the window, in the `Enable notifications` field. That will
    enable notifications on your computer.


    - Another option about the notifications on your computer to configure is, if
    you want the notifications to be removed after their time has expired. To do that,
    click on the little white button on the right side of the window, in the `Remove
    notifications after their timeout is reached` field.


    - Then, in the `Notification duration (seconds)` field, click on the plus or minus
    signs, on the right side of the window, to select for how long, a notification
    will be displayed for.


    ![](image_rsrc23S.jpg)


    # PANEL


    - Let us now configure the `Panel`, in this step. What is the `Panel` you may
    wonder? Well, that is the bar you see displayed on the bottom of your desktop
    screen.


    - Click on the `Panel` icon, under `Preferences`, in the open `System Settings`
    window.


    ![](image_rsrc23T.jpg)


    - Under the `Panel Visibility`, in the `Auto hide panel` field, click on the drop
    down menu on the right side of the window, and select, what you want to happen
    to the `Panel`, when you are using your computer. I would suggest that you choose
    the `Auto hide panel` option, because, the `Panel` will disappear from your screen,
    when you do not need to use it, and than means more space available on your screen,
    for other open applications, to be displayed. Another option is to always show
    the `Panel`, but again, the `Panel` will take space on your screen, and will be
    less space, for the applications windows, to be displayed.


    ![](image_rsrc23U.jpg)


    - Under the `Customize` option, move the slider to the left or right side, to
    adjust the height of the `Panel`.


    - Under the `Panel appearance` option, in the `Symbolic icon size (px)` field,
    click on the plus or minus signs, on the right side of the window, to adjust the
    size of the icons.


    ![](image_rsrc23W.jpg)


    - Under the `General Panel` options, click on the `Panel edit mode` button.


    ![](image_rsrc23X.jpg)


    - When the `Panel` is in the Edit mode, you will be able to move things on the
    `Panel`, from one place to another. For example, click with the mouse pointer
    on the `time icon`, on the `Panel`, and hold the left button. Drag the `time icon`
    towards the left side.


    ![](image_rsrc23Y.jpg)


    - On the following image bellow, you can see that the `time icon` has been moved
    to another location on the `Panel`.


    ![](image_rsrc23Z.jpg)


    - Under the `General Panel` options, click on the `Add new panel` button, if you
    want to add another `Panel` to your Desktop. Bear in mind, the `Panel` has to
    still be in Edit mode.


    ![](image_rsrc240.jpg)


    - Now you see four thick red lines, being displayed at the four edges of the screen.
    Those four red lines are where you can chose to place the new `Panel` you want
    to. For example, if you click with the mouse pointer on the top red line, that
    is the location where the second `Panel` will be displayed.


    ![](image_rsrc241.jpg)


    - You can see on the following image bellow, that the new `Panel` has now positioned
    on the top of the screen. That is the wide black line you see on the top of the
    screen.


    ![](image_rsrc242.jpg)


    - You can remove the second new `Panel` you have created, from the top of the
    screen, if you right click with the right mouse button over the top `Panel`.


    - From the menu which appears, you can click on the `Applets` option, if you want
    to add some Applets to that new `Panel`.


    - From the menu that appears, you can also remove the second new `Panel`, by clicking
    on the `Remove` option, in the menu.


    - In that menu displayed, there is an option to configure the new second `Panel`,
    by clicking on the `Panel settings` option, in the menu.


    ![](image_rsrc243.jpg)


    - There is actually a troubleshooting option, for the `Panel`, if you want to
    restore the `Panel` to its default settings for example. But, it is not limited
    only to the restoring of the default `Panel` settings, but you can restart the
    Cinnamon desktop environment too.


    - Click with the right mouse button, over an empty space on the `Panel`. From
    the menu which appears, click on the `Troubleshoot` option.


    ![](image_rsrc244.jpg)


    - Click on the `Restart Cinnamon` option, in the menu. That will restart the Cinnamon
    desktop, and in some cases, that is a type of troubleshooting.


    ![](image_rsrc245.jpg)

    '
