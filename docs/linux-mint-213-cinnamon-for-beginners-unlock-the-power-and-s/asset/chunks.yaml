    # 声音


    - 在 Linux Mint 21.3 Cinnamon 电脑中，还有另一组可以配置的声音，那就是系统声音。换句话说，当你听音乐时不会使用系统声音，但这些声音是在你在电脑上执行某些系统和应用程序任务时触发的，例如打开一个新的应用程序窗口。


    - 系统声音的音量可以通过鼠标在 `Sounds Volume`（声音音量）字段下方移动滑块向左或右来调整。


    - 在 `Sounds`（声音）字段下，你可以使用每个字段右侧的小白色按钮来启用或禁用电脑上的特定声音。例如，你可以通过切换窗口右侧的小按钮来启用或禁用 `Starting
    Cinnamon`（启动 Cinnamon）声音。


    ![](img/image_rsrc22G.jpg)![](img/image_rsrc22H.jpg)![](img/image_rsrc22J.jpg)


    - 接下来，点击 `Applications`（应用程序）选项卡。


    - 在 `Applications`（应用程序）选项下，移动滑块向左或右，调整在此窗口中显示的特定应用程序的音量。


    - 当你打开并使用电脑上的某个应用程序时，如果该程序能够在电脑上播放声音，你就会在此窗口中看到该应用程序及其音量滑块。例如，你可以看到 `Firefox`
    互联网浏览器的音量在这里显示。这是因为该 `Firefox` 浏览器已经在互联网上播放了一些视频或音乐。


    ![](img/image_rsrc22K.jpg)![](img/image_rsrc22M.jpg)


    - 我们现在将配置一些额外的声音设置。


    - 在打开的 `System Settings`（系统设置）窗口中，点击 `Sounds`（声音）下的 `Settings`（设置）选项卡。


    - 下面图片所示的是关于声音放大的。


    - 现在，你可以看到有一个滑块可以向左或向右移动以调整声音放大，但我想提醒你，如果将该滑块移动超过 `100%`，电脑的声音可能会失真且听起来非常不舒服。因此，我建议你不要将该放大滑块超过
    `100%`。


    ![](img/image_rsrc22N.jpg)


    # 偏好


    ## 账户详情


    - 在这一步中，我将向你简单介绍如何在设置用户账户后更改你的 Linux Mint 21.3 Cinnamon 电脑账户的密码。


    - 在打开的 `System Settings`（系统设置）窗口下，点击 `Account details`（账户详情）图标。


    ![](img/image_rsrc22P.jpg)


    - 一旦打开 `Account details`（账户详情）设置，你可以通过点击打开窗口右侧 `Picture`（图片）字段中的图片正方形来更改你的账户图片。


    - 要更改你的账户密码，请点击 `Password`（密码）字段，你会看到弹出一个小窗口。


    - 输入你当前的账户登录密码。


    - 在可用字段中输入两次你选择的新账户密码。


    - 点击 `Change`（更改）按钮。


    ![](img/image_rsrc22R.jpg)


    ## 小组件 (APPLETS)


    - Linux Mint 21.3 Cinnamon 中有一些称为 `Applets` 的程序。它们类似于额外的应用程序，你可以通过将它们的快捷方式放置在
    `Panel`（面板）上来配置和使用。


    - 要开始配置和使用某些小组件，点击打开的 `System Settings`（系统设置）窗口中 `Preferences`（偏好）下的 `Applets`
    图标。


    ![](img/image_rsrc22S.jpg)


    - 一旦打开 `Applets` 窗口，点击 `Manage`（管理）选项卡。


    - 在这一步中，我将向你演示如何配置 `Expo` 小组件，这仅作为一个示例。


    - 在显示的 `Applets`（小组件）列表中，点击 `Expo` 以选中它。


    ![](img/image_rsrc22T.jpg)


    - 一旦你在列表中点击并选择了 `Expo` 小组件，点击窗口底部的加号，将 `Expo` 及其快捷方式添加到 `Panel`（面板）中。


    ![](img/image_rsrc22U.jpg)


    - 现在你可以看到 `Expo` 小组件快捷方式已添加到 `Panel`（面板）中。


    ![](img/image_rsrc22V.jpg)


    - 当你想从 `Panel` 中移除任何小组件及其快捷方式时，只需点击打开窗口中的 `Manage`（管理）选项卡，然后在 `Applets` 列表中点击你想要移除的特定小组件进行选中。在示例中，我向你演示如何从
    `Panel` 中移除 `Expo` 小组件快捷方式。


    - 在列表中点击并选择 `Expo` 小组件。


    - 点击打开窗口底部的减号。这将从 `Panel` 中移除 `Expo` 小组件快捷方式。


    ![](img/image_rsrc22W.jpg)![](img/image_rsrc22X.jpg)


    - 但假设你想从电脑上完全删除其中一个小组件。要这样做，点击特定的小组件，然后点击 `Uninstall`（卸载）按钮。


    ![](img/image_rsrc22Y.jpg)


    - 但如果你电脑上现有的小组件不够用，你想要更多怎么办？嗯，你可以获取更多。点击打开窗口中的 `Download`（下载）选项卡。


    ![](img/image_rsrc22jpg)


    - 从列表中选择你想下载并安装到电脑上的特定小组件。


    - 点击窗口右侧的 `Install`（安装）按钮将该特定小组件下载并安装到你的电脑。


    ![](img/image_rsrc230.jpg)


    - 如果你想配置某些小组件，在列表中选择你想要配置的小组件。然后点击窗口右侧的 `Configure`（配置）按钮。


    ![](img/image_rsrc231.jpg)![](img/image_rsrc232.jpg)


    # 桌面组件 (DESKLETS)


    - 现在我们将配置另一类额外应用程序，称为 `Desklets`。桌面组件类似于小组件，但当你配置它们时，它们会将快捷方式放置在 `Desktop`（桌面）上。


    - 在打开的 `System Settings`（系统设置）窗口中，在 `Preferences`（偏好）下点击 `Desklets` 图标。


    ![](img/image_rsrc234.jpg)


    - 点击 `Manage`（管理）选项卡。


    ![](img/image_rsrc235.jpg)


    - 在此示例中，我们将配置 `Clock`（时钟）桌面组件。因此，点击列表中的 `Clock` 桌面以选中它。


    - 然后点击窗口底部的加号，将 `Clock` 桌面组件添加到 `Desktop`（桌面）。


    ![](img/image_rsrc236.jpg)


    - 现在你可以看到 `Clock` 桌面组件已添加到 `Desktop`（桌面）。


    ![](img/image_rsrc237.jpg)


    - 要从 `Desktop` 移除 `Clock` 桌面组件，在显示的 `Desklets` 列表中选择 `Clock` 桌面，然后点击窗口底部的减号。这将从
    `Desktop` 中移除 `Clock` 桌面组件。


    ![](img/image_rsrc238.jpg)


    - 如果你想配置某些桌面组件，在列表中选择你想要配置的桌面组件。然后点击窗口右侧的 `Configure`（配置）按钮。在给出的示例中，被配置的是 `Clock`
    桌面组件。


    ![](img/image_rsrc239.jpg)


    - 当你想向电脑上添加更多桌面组件而不是使用已安装的桌面组件时，你可以点击打开窗口中的 `Download`（下载）选项卡。


    ![](img/image_rsrc23B.jpg)


    - 从列表中选择你想下载并安装到电脑上的特定桌面组件。


    - 点击窗口右侧的 `Install`（安装）按钮，将该特定桌面组件下载并安装到你的电脑。


    ![](img/image_rsrc23C.jpg)


