    ## 主题


    - 在打开窗口的 `Applications`（应用程序）字段中，点击窗口右侧的下拉菜单，然后点击并选择你喜爱的电脑应用程序主题。


    ![](img/image_rsrc1YH.jpg)


    - 若要为你的电脑图标选择颜色，点击打开窗口的 `Icons`（图标）字段，然后点击窗口右侧的下拉菜单。然后，点击并选择你喜爱的图标颜色。


    ![](img/image_rsrc1YJ.jpg)


    - 现在，在打开窗口的 `Desktop`（桌面）字段中，点击窗口右侧的下拉菜单，然后点击并选择桌面的主题。


    ![](img/image_rsrc1YK.jpg)


    - 你将看到出现更多桌面选项和设置。例如，如果你想让你的电脑桌面显示为深色或浅色，你可以在 `Appearance`（外观）选项中进行选择。


    ![](img/image_rsrc1YM.jpg)


    - 若要更改桌面外观的样式，点击 `Style`（样式）选项，并在下拉菜单中选择你喜欢的样式。


    ![](img/image_rsrc1YN.jpg)


    - 我们仍然处于 `Appearance`（外观）下的 `Themes`（主题）分类中。


    - 当你想为你的 Linux Mint 21.3 Cinnamon 电脑添加更多主题或删除某些主题时，点击打开窗口顶部中间的 `Add/Remove`（添加/删除）标签页。


    ![](img/image_rsrc1YP.jpg)


    - 查看窗口中显示的所有可下载的主题，如果你选中了一个想要安装到电脑上的主题，只需点击该主题名称字段右侧的 `Install`（安装）按钮即可。


    ![](img/image_rsrc1YR.jpg)


    - 但如果你有一个想要从电脑中删除的主题，只需点击并选择打开窗口显示的该主题，然后点击位于窗口底部中间的 `Uninstall`（卸载）小按钮。这将把主题移动到
    `Trash`（垃圾箱）。


    ![](img/image_rsrc1YS.jpg)


    - 接下来是配置更多主题设置。


    - 点击打开窗口中的 `Settings`（设置）标签页。


    - 如果你想让 `Main Menu`（主菜单）及子菜单中的应用程序名称旁边出现应用程序图标，可以在 `Miscellaneous`（杂项）选项下，点击 `Show
    icons in menus`（在菜单中显示图标）字段中的白色小按钮，以启用该选项。


    - 你可以将 `Settings` 标签页中的其他选项保持默认设置，那样也可以了。


    ![](img/image_rsrc1YT.jpg)


    ## 桌面


    - 当你想在桌面上创建一个新文件夹时，在桌面屏幕上找到一个空白处，使用鼠标右键点击此处。


    - 从弹出菜单中，点击 `Create New Folder`（新建文件夹）选项。桌面上将创建一个文件夹。


    ![](img/image_rsrc1YU.jpg)![](img/image_rsrc1YV.jpg)


    - 如果你想删除在桌面上创建的文件夹，只需将鼠标指针悬停上方，然后使用鼠标右键点击。从弹出菜单中，点击 `Move to Trash`（移动到垃圾箱）。这将文件夹移动到
    `Trash`（垃圾箱）。


    ![](img/image_rsrc1YW.jpg)


    - 如果你想在桌面上创建一个新的启动器，在桌面找到一个空白处，然后使用鼠标右键点击，并从弹出菜单中点击 `Create a launcher here.`（在此处创建启动器）选项。


    ![](img/image_rsrc1YX.jpg)


    - 一旦 `Launcher Properties`（启动器属性）窗口打开，点击 `Browse`（浏览）按钮，并导航到你想创建启动器的应用程序路径。


    ![](img/image_rsrc1YY.jpg)


    - Linux Mint 21.3 Cinnamon 中有一些名为 `Desklets`（桌面组件）的小程序。如果你想在桌面放置一些 `Desklets`
    快捷方式，在桌面找到一个空白处，然后使用鼠标右键点击。一旦菜单出现，点击 `Add Desklets`（添加桌面组件）选项。


    ![](img/image_rsrc1YZ.jpg)


    - 然后，在 `Desklets` 窗口中点击 `Manage`（管理）标签页。


    ![](img/image_rsrc1Z0.jpg)


    - 选择窗口中显示的 `Desklets`之一。例如，点击窗口中的 `Clock`（时钟）组件。


    ![](img/image_rsrc1Z1.jpg)


    - 然后点击窗口底部的加号，将 `Clock` 组件添加到桌面。


    ![](img/image_rsrc1Z2.jpg)


    - 你可以看到 `Clock` 组件已添加到桌面。


    ![](img/image_rsrc1Z3.jpg)


    - 但假设你已经用够了桌面上的 `Clock` 组件，想要将其移除。鼠标右键点击桌面上的 `Clock` 组件。然后从菜单中点击 `Remove this
    desklet`（移除此组件）选项。


    ![](img/image_rsrc1Z4.jpg)


    - 如果已安装的 `Desklets` 不能帮助你完成某些电脑任务，你可以下载一些 `Desklets`。


    - 点击打开的 `Desklets` 窗口中的 `Download`（下载）标签页。


    - 点击并选择列表中的一个 `Desklets`。


    - 然后，点击窗口右侧下载并安装该组件。


    ![](img/image_rsrc1Z5.jpg)


    - 现在，让我们更改桌面背景。在桌面找到一个空白处，使用鼠标右键点击此处。


    - 从弹出菜单中，点击 `Change Desktop`（更改桌面）选项。


    ![](img/image_rsrc1Z6.jpg)


    - 在 `Backgrounds`（背景）窗口中点击 `Images`（图片）。


    - 在左侧显示的不同背景分类中，点击一个。假设我们点击左侧顶部的 `Linux Mint` 分类。


    - 然后点击右侧的可用背景之一，将其应用到桌面。


    ![](img/image_rsrc1Z7.jpg)![](img/image_rsrc1Z8.jpg)


    - 你可以在下面的图中看到更改后的桌面背景。


    ![](img/image_rsrc1Z9.jpg)


    - 下一步是自定义桌面。为为此，在桌面空白处使用鼠标右键点击。


    - 从打开的菜单中，点击 `Customize`（自定义）选项。


    ![](img/image_rsrc1ZA.jpg)


    - 如果你想让桌面图标自动排列，点击 `Layout`（布局）下 `Auto-arrange`（自动排列）字段中的白色按钮。


    ![](img/image_rsrc1ZB.jpg)


    - 若要调整桌面图标的大小，点击窗口右侧的 `Icon Size`（图标大小）字段。然后从下拉菜单选择大小。


    ![](img/image_rsrc1ZC.jpg)


    - 你希望桌面图标垂直排列还是水平排列？点击 `Direction`（方向）字段的下拉菜单，然后选择 `Vertical`或 `Horizontal`。


    ![](img/image_rsrc1ZD.jpg)


    - 若要按大小、日期或名称排序桌面项目，点击 `Sort items by`（排序方式）字段的下拉菜单并做出选择。


    ![](img/image_rsrc1ZE.jpg)


    ## 硬件


    ### 蓝牙


    - 我们要处理的第一项硬件配置是 `Bluetooth`（蓝牙）。


    - 在 `System Settings`（系统设置）窗口中，点击 `Hardware`下的 `Bluetooth`图标。


    ![](img/image_rsrc1ZF.jpg)


    - 在打开的 `Bluetooth Devices`（蓝牙设备）窗口中，点击 `Search`（搜索）按钮，让电脑搜索范围内的任何外部蓝牙设备。


    ![](img/image_rsrc1ZG.jpg)


    - 在下图，你可以发现了一个蓝牙设备，那就是 `ZK606`。这里描述的 `ZK606` 蓝牙设备只是一个例子。在你情况下，会有你已开启且在范围内的外部蓝牙设备，它们将显示在
    `Bluetooth Devices` 窗口中。


    - 点击找到的蓝牙设备进行选择。


    ![](img/image_rsrc1ZH.jpg)


    - 点击 `Pair`（配对）按钮，让电脑内部的蓝牙与外部蓝牙设备配对。蓝牙设备需要配对才能工作。


    ![](img/image_rsrc1ZJ.jpg)


    - 同时，点击 `Trust`（信任）按钮，让你的电脑蓝牙在连接时“信任”该外部蓝牙设备。


    ![](img/image_rsrc1ZK.jpg)


    '
- fmt: '

    - Now, in the following image bellow, you can see that there are some green indicators
    on the right side of the window, for the `ZK606` Bluetooth device, which show,
    that your external Bluetooth device is connected and working properly.


    ![](image_rsrc1ZM.jpg)


    - Click on the `Device` tab, in the open `Bluetooth Devices` window.

    - From the drop down menu, click on the `Audio Profile` option.

    - Then, click on the `High Fidelity Playback` option, in the open sub-menu. That
    is the option I would recommend, for the `Audio Profile`.


    ![](image_rsrc1ZN.jpg)


    - When you want to remove an external Bluetooth device, which has been configured
    to work with your computer, just click to select the device, in the open `Bluetooth
    Devices` window, and then, click on the `Remove` button, which looks like a minus
    sign, and that external Bluetooth device, will not be connected and will not work
    with your computer anymore.


    ![](image_rsrc1ZP.jpg)


    # KEYBOARD


    - Let us configure the computer keyboard now.

    - Click on the `Keyboard` icon, under `Hardware`, in the open `System Settings`
    window.


    ![](image_rsrc1ZR.jpg)


    - Click on the `Typing` tab, on the top of the window.

    - Move the sliders for the `Key repeat` setting, to the left or right, to adjust,
    according to how you prefer.


    ![](image_rsrc1ZS.jpg)


    - For setting the keyboard layouts, click on the `Layouts` tab, on the top of
    the window.


    ![](image_rsrc1ZT.jpg)


    - In the `Dysplay` options of the `Layout` settings window, click on the little
    checkbox, for using a country flag, on the `Panel`, for showing which keyboard
    layout, is being used currently on your desktop. That is a very useful feature,
    because it will allow you to switch between keyboard layouts, quickly.

    - To add another keyboard layout to your computer, click on the plus sign, located
    at the bottom left side of the open window.


    ![](image_rsrc1ZU.jpg)


    - From the open `Choose a Layout` window, select the layout you like to use. In
    the example following, the choice is the French layout.

    - Click on the `Add` button.


    ![](image_rsrc1ZV.jpg)![](image_rsrc1ZW.jpg)


    - You can see, that the French layout, has been added, to the computer, and you
    can start using it.

    - You can leave the other keyboard layout setting, in their default if you wish,
    and they will be fine.


    ![](image_rsrc1ZX.jpg)


    - If you look at the bottom left side of the `Panel`, you can see the French and
    the British flags, are both displayed, so that you can click on any of them, and
    switch the layout at any time.


    ![](image_rsrc1ZY.jpg)


    - When you want to remove a keyboard layout from your computer, click on the layout
    displayed, in the list of keyboard layouts, displayed on the left side, and click
    on the minus sign, on the bottom left.


    ![](image_rsrc1ZZ.jpg)


    # MOUSE AND TOUCHPAD


    - Configuring the mouse and touchpad, on your computer, can be done by clicking
    on the `Mouse and Touchpad` icon, under `Hardware`, in the open `System Settings`
    window.


    ![](image_rsrc200.jpg)


    - Click on the `Mouse` tab, in the open `System Settings` window.

    - The only two settings which I would recommend, for the mouse, at this step are
    the `pointer speed`, and `pointer size`. You can leave the other mouse settings
    in their default, and they will be fine.

    - Under the `Pointer size` and `speed` option, drag the first slider, to the left
    or right side, by clicking with the mouse over it, and dragging it. That will
    make the mouse pointer bigger or smaller.

    - Drag the second slider to the left or right side, to adjust the speed, of the
    mouse pointer, which will determine, how fast the mouse pointer is moved from
    one place on the computer, to another. Look at the following images.


    ![](image_rsrc201.jpg)![](image_rsrc202.jpg)![](image_rsrc203.jpg)![](image_rsrc204.jpg)![](image_rsrc205.jpg)


    - If you want to change the double click speed, then drag the slider to the left
    or right, with the mouse pointer, under the `Double Click` option. You can also
    test the double click timing, by clicking on `Double click test` button.


    ![](image_rsrc206.jpg)


    - In this step, we will adjust touchpad settings. Click on the `Touchpad` tab,
    in the open `System Settings` window.


    ![](image_rsrc207.jpg)


    - Click and enable the `Tap to click` option, under `General`, to enable clicking
    with the touchpad.


    ![](image_rsrc208.jpg)


    - Also, click and enable the `Disable the touchpad while typing` option, by clicking
    on the little white button, on the right side of the window. That is a useful
    feature, because it is very annoying, when you type some document, and suddenly,
    your hand touches the touchpad, and all your text gets messed up. So, enable that
    option, under `General`.


    ![](image_rsrc209.jpg)


    - For the scrolling, I would suggest that you use `two finger scrolling` option,
    because I personally find it, to be easy to do, and very convenient.

    - Under `Scrolling`, click on the drop down menu on the right side, in the `Scrolling
    method` field, and select `two finger scrolling option`.


    ![](image_rsrc20A.jpg)


    - You can also adjust the speed of the scrolling, by moving the slider, under
    `Scrolling`, to the left or right side.


    ![](image_rsrc20B.jpg)


    # NETWORK


    - In this step, we will configure your `Linux Mint 21.3 Cinnamon` network. The
    configuration will be primarily for the `WiFi` wireless network, because the `Ethernet`
    connection is very straightforward and easy to do, if you are using your computer
    at home, and a router.

    - Click on the `Network` icon, in the open `System Settings` window.


    ![](image_rsrc20C.jpg)


    - Click on the `WiFi` icon, on the left side of the open window.

    - You could see some already WiFi wireless connections available, which are in
    your proximity. For example, you can see the Dani wireless network, in the following
    image.

    - Bear in mind, that `Linux Mint 21.3 Cinnamon`, will automatically find and show,
    the `WiFi` wireless networks, in your proximity, including the name of your WiFi
    wireless connection, coming from your switched on and configured router.

    - Make sure the little white `WiFi wireless connection button`, on the right side
    of the window, is already switched on, in order to enable the wireless connection.


    ![](image_rsrc20D.jpg)


    - Now, in this example, we will look at how the available wireless connection
    `Nedko-71 EXT`, is configured.

    - Click on the little settings icon, on the right side of the field of `Nedko-71
    EXT` wireless network, to open the settings for the connection.


    ![](image_rsrc20E.jpg)


    - Now the `Nedko-71 EXT` wireless connection settings window, is open.

    - Click on `Details` in the list, on the left side of the open window, to see
    some details of the wireless connection.


    ![](image_rsrc20F.jpg)


    - Click on `Security` in the list on the left side of the open window.


    ![](image_rsrc20G.jpg)


    - For the `Security` option, click and select the `WPA & WPA2 Personal` option,
    from the drop down menu.


    ![](image_rsrc20H.jpg)


    - For configuring the password for your WiFi wireless connection, click on the
    `Password` field, in the open window, and type the wireless connection password,
    which was provided, from your Internet provider. The wireless connection password,
    is configured in the router settings. If you have changed the default wireless
    connection password, which you have received from your Internet provider, then
    type that new wireless connection password.

    - Click on the `Apply` button, to apply the new settings.


    ![](image_rsrc20J.jpg)


    - Click on the `Identity` category, in the list of settings categories, in the
    left side of the open window.

    - For the `SSID`, which is the name of your WiFi wireless connection, type that
    name, in the field. In this example here, it is the `Nedko-71 EXT` wireless connection.

    - Leave the other settings for the `Identity` category, in their default setting.

