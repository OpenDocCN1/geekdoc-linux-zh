    # 主菜单


    ## 编辑菜单


    -   在这一步中，我们将配置主菜单，以便能够选择哪些应用程序类别和应用程序图标将出现在主菜单中，哪些不会出现。


    -   用鼠标右键点击位于左下角的主菜单图标。


    -   在弹出的菜单中，点击`Edit`编辑菜单选项。


    ![](img/image_rsrc26N.jpg)


    -   点击打开窗口顶部的`Applications`应用程序图标。所有的应用程序类别都在该`Applications`图标下。你可以在打开窗口的左侧看到所有的应用程序类别。


    ![](img/image_rsrc26P.jpg)


    '
- fmt: "\n- Under `Item`, in the open window, click to clear the `Internet` checkbox,\
    \ or in other words, to make the `Internet` category, not selected or checked.\n\
    \n![](image_rsrc26R.jpg)\n\n- You can see now, that the `Internet` application\
    \ category, is not visible in the applications categories, in the `Main Menu`,\
    \ because we cleared the checkbox for the `Internet` category, in the previous\
    \ step.\n\n![](image_rsrc26S.jpg)\n\n- Under `Item`, in the open window, click\
    \ and select, the `Internet` category, by clicking on the checkbox.\n\n![](image_rsrc26T.jpg)\n\
    \n- The `Internet` application category, will be now visible, in the applications\
    \ categories, in the `Main Menu`.\n\n![](image_rsrc26U.jpg)\n\n- If you want to\
    \ delete and remove the `Internet` applications category from the `Main Menu`,\
    \ click to select it, and then, click on the `Delete` button, located at the right\
    \ side of the open window.\n\n![](image_rsrc26V.jpg)\n\n- The `Internet` is an\
    \ application category, in the `Main Menu`. But in that `Internet` applications\
    \ category, are some applications shortcuts, like the shortcut, for the `Firefox`\
    \ browser, for example.\n\n- Click on the `Internet` application category, in\
    \ the `Main Menu`, to select it.\n\n![](image_rsrc26W.jpg)\n\n- While the `Internet`\
    \ applications category is selected, you can see the various applications icons\
    \ or shortcuts, which are under the `Internet` category, under `Item`, in the\
    \ open `Main Menu`.\n\n- If you click to clear the `Firefox Web Browser` checkbox\
    \ for example, the `Firefox Browser`, will not longe appear in the `Main Menu`,\
    \ under the `Internet` category.\n\n![](image_rsrc26X.jpg)\n\n- If you click and\
    \ select the `Firefox Web Browser` checkbox, under `Item`, in the open `Main Menu`,\
    \ which is in the `Internet` category, the `Firefox Web Browser` shortcut icon,\
    \ will appear again, in the `Main Menu`, under the `Internet` category.\n\n![](image_rsrc26Y.jpg)![](image_rsrc26Z.jpg)\n\
    \n- When you want to add, a new application shortcut icon, to the `Internet` applications\
    \ category for example, you can click and select the `Internet` category, in the\
    \ `Main Menu`, and then, click on the `New Item` button, located on the right\
    \ side of the open window. That will start creating, a new application launcher.\n\
    \n![](image_rsrc270.jpg)\n\n- In the open `Launcher Properties` window, type the\
    \ name of the application shortcut, you want to add. Then click on the `Browse`\
    \ button, to navigate to the location on your computer, where that application\
    \ is located.\n\n- Once you have located the application you want to add, to the\
    \ `Internet` category, click on the `OK` button.\n\n![](image_rsrc271.jpg)\n\n\
    - When you want to see the properties, of one of the applications categories in\
    \ the `Main Menu`, click on that particular category in the `Main Menu`, and then,\
