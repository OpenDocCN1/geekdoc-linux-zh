    -   对于添加到电脑的任何其他用户，请务必为他们提供并配置标准（Standard）类型的账户！不要给他们管理员（Administrator）类型的账户！


    ![](img/image_rsrc25K.jpg)


    -   点击`Password`密码`选项，更改现有用户的登录密码。


    -   当`Change Password`更改密码`窗口打开时，输入你选择的登录电脑的新密码。输入两次相同的新密码。


    -   点击`Change`更改`按钮。


    ![](img/image_rsrc25M.jpg)


    -   对于`Name`名称`选项，如果你需要，可以输入并更改用户名称。


    ![](img/image_rsrc25N.jpg)


    -   当你想为电脑添加新用户时，点击位于打开的`Users and Groups`用户和组`窗口左下角的、位于`Users`用户`选项卡下方的`Add`添加`按钮。


    ![](img/image_rsrc25P.jpg)


    -   `Account Type`账户类型，选择标准（Standard）类型！不要给电脑的任何其他用户管理员（Administrator）类型的账户，因为他们可能会搞乱你的操作系统！将管理员账户留给你自己，即电脑的所有者！


    -   在`Username`用户名框中输入新用户名。


    -   点击`Add`添加`按钮。


    ![](img/image_rsrc25R.jpg)


    -   例如，你可以看到 John Smith 的用户账户被设置为标准（Standard）类型账户。


    -   点击`Add`添加`按钮，将 John Smith 作为你电脑的用户。


    ![](img/image_rsrc25S.jpg)


    -   点击`Picture`图片`选项，更改 John Smith 的图片或照片。


    ![](img/image_rsrc25T.jpg)


    -   从可用图片中为 John Smith 选择一张图片，或者点击`Browse for more pictures…`浏览更多图片…按钮来选择另一张图片。


    ![](img/image_rsrc25U.jpg)


    -   为 John Smith 选择标准（Standard）类型账户。


    ![](img/image_rsrc25V.jpg)


    -   在`Name`名称框中，输入新用户名称 John Smith。


    ![](img/image_rsrc25W.jpg)


    -   在`Password`密码框中，为 John Smith 及其账户输入新密码。


    ![](img/image_rsrc25X.jpg)


    -   在`Change Password`更改密码框中，输入并更改 John Smith 的登录密码。输入两次相同的新密码。


    -   点击`Change`更改`按钮。


    ![](img/image_rsrc25Y.jpg)


    -   查看下方图片所示 John Smith 的示例密码配置。


    ![](img/image_rsrc25Z.jpg)


    -   如果你想从电脑删除并移除用户账户，可以这样做。


    -   例如，如果你想从电脑中移除 John Smith 的用户账户，在打开的`Users and Groups`窗口中点击并选择 John Smith 的账户。


    -   然后，点击`Delete`删除`按钮，John Smith 就会从你的电脑中消失。


    ![](img/image_rsrc260.jpg)


    # 主菜单


