    ![](image_rsrc24M.jpg)


    ● Under the Screensaver settings, click on the drop down menu, on the right side
    of the open window, in the Delay before starting the screensaver field. Select
    the time in minutes from the menu, after which you want the Screensaver, to be
    activated automatically.


    ![](image_rsrc24N.jpg)


    ● If you want more privacy, on your computer, you can make the computer screen,
    to be locked automatically, every time you put the computer in the Sleep mode.


    ● Under the Lock settings option, click on the little white button, on the right
    side of the window, in the Lock the computer when put to sleep field. The computer
    will be automatically locked, every time it goes into the Suspend, or Sleep mode,
    and any time you wake up the computer, or start using it again, it will show your
    screen being locked. You have to type your login password, in order to unlock
    the screen, and start using your computer again.


    ![](image_rsrc24P.jpg)


    ● Another option to increase your computer privacy, is to select the option, to
    lock your computer automatically, every time your Screensaver is activated.


    ● Click on the little white button, on the right side of the open window, in the
    Lock the computer after the screensaver starts field.


    ![](image_rsrc24R.jpg)


    ● If you have chosen to use a Screensaver, on your computer, then now it is the
    time, to customize that Screensaver.


    ●       Click on the Customize tab, in the open Screensaver settings window.


    ![](image_rsrc24S.jpg)


    ● The first option, we are going to configure, is if you want to have the clock
    displayed, on the Screensaver, any time the Screensaver is activated. If you do,
    then click on the little white button, on the right side of the window, under
    the Date and Time option, in the Always show the clock field.


    ![](image_rsrc24T.jpg)


    ● There is a massage option in the Screensaver settings, so if you want to type
    any message to be displayed in the Screensaver, you can do that.


    ● Under the Away message option, type your message in the field available. That
    is in the Show this message when the screen is locked field. The example given
    here is, “Do not touch my computer!!!”. That is the message which will be displayed,
    every time the Screensaver is on.


    ![](image_rsrc24U.jpg)


    ADMINISTRATION


    LOGIN WINDOW'
