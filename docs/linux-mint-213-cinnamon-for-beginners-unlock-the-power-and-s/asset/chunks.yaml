  trans: '


    首先，我将向你展示如何创建一个带有 Linux Mint 21.3 Cinnamon 的启动型 U 闪盘。你需要制作一个启动型 U 闪盘，并将 Linux
    Mint 21.3 Cinnamon ISO 文件安装在其中。完成后，你可以将该启动型 U 闪盘插入电脑的 USB 接口，重启电脑，Linux Mint 21.3
    Cinnamon 就会开始加载。一旦加载到桌面，桌面上有一个安装图标，点击它将开始从启动型 U 闪盘将 Linux Mint 21.3 Cinnamon 安装到你的电脑上。但现在，让我们按照下面的步骤先制作启动型
    U 闪盘。


    ### 创建启动型 U 闪盘


    -   你将使用一个名为 `BalenaEtcher` 的免费工具。只需访问以下网站：[`www.balena.io/etcher`](https://www.balena.io/etcher)
    并在电脑上下载该免费程序。一旦从互联网下载了 `BalenaEtcher`，你甚至不需要安装它。如果你使用的是 Windows 或 Linux 电脑来下载
    `BalenaEtcher` 免费程序，你只需要点击下载的 `BalenaEtcher` 程序，几秒钟后它就会打开并准备就绪。


    -   这是 `BalenaEtcher` 程序打开后的截图。请查看下图。


    ![](img/image_rsrc27J.jpg)


    -   如你从上面的图片所示，使用 `BalenaEtcher` 工具制作启动型 U 闪盘只需三个简单的步骤。一旦你已从 Linux Mint 21.3 Cinnamon
    官方网站下载了 ISO 格式的 Linux Mint 21.3 Cinnamon 文件，你只需要在 `BalenaEtcher` 程序中按照图中三个简单的步骤操作即可。不要担心那个
    `ISO` 文件是什么！它只是你从 Linux 官方网站下载的 Linux Mint 21.3 Cinnamon 文件的扩展名。


    -   如你在上方 `BalenaEtcher` 程序图中蓝色所示，第一步 `Flash from file` 是蓝色按钮，点击它可以选择你已经从网上下载的
    Linux Mint 21.3 Cinnamon 操作系统文件。完成后，继续进行制作启动型 U 闪盘的第二步。


    -   第二步是选择你正在使用的 U 闪盘，使其成为带有 Linux Mint 21.3 Cinnamon 的启动型 U 闪盘。因此，只需点击已打开的 `BalenaEtcher`
    程序中的 `Select target`，然后从选项中选择你要制作成启动型的 U 闪盘。


    -   下一步是点击打开的 `BalenaEtcher` 程序中的 `Flash` 按钮。让它`小火慢炖`几分钟，换句话说，让它完成该做的工作几分钟，哒！你就制作好了一个带有
    Linux Mint 21.3 Cinnamon 操作系统的启动型 U 闪盘。现在，这个带有 Linux Mint 21.3 Cinnamon 的启动型 U
    闪盘被称为“现场操作系统”（live operating system），这意味着这个启动型 U 闪盘可以插入任何电脑，你可以从 U 闪盘运行并使用 Linux
    Mint 21.3 Cinnamon，就像使用已安装在任何电脑上的其他操作系统一样。它就像是任何电脑上的 Windows 操作系统一样，准备好处理你所需的各种任务。唯一的区别是，你制作的启动型
    U 闪盘上的 Linux Mint 21.3 Cinnamon 操作系统仅从该启动型 U 闪盘现场运行，尚未安装到任何电脑上，甚至尚未安装到可以运行它的你的电脑上。它在插入了启动型
    U 闪盘的电脑上现场运行，而尚未安装在该电脑上。你只需开启已插入启动型 U 闪盘的电脑，电脑就会从该启动型 U 闪盘以现场模式启动 Linux Mint 21.3
    Cinnamon，即使电脑上已经安装了 Microsoft Windows。不要担心，从启动型 U 闪盘现场运行 Linux Mint 21.3 Cinnamon
    **不会** 影响、更改或影响同一台电脑上的任何其他操作系统，例如该电脑上已存在的 Windows。你在该带有 Linux Mint 21.3 Cinnamon
    的启动型 U 闪盘上进行的所有操作都仅在该闪盘中完成。当然，你可以在你选择的任何时候，从启动型 U 闪盘在电脑上安装 Linux Mint 21.3 Cinnamon。


    -   要从互联网下载 Linux Mint 21.3 Cinnamon 操作系统，只需访问以下网站链接并下载 Linux Mint 21.3 Cinnamon。一旦点击下面的网站链接，你的电脑将开始下载
    Linux Mint 21.3 Cinnamon 安装包。文件下载完成后，你必须使用它来制作启动型 U 闪盘。


    -   点击以下网站链接下载 Linux Mint 21.3 Cinnamon：[`linuxmint.com/edition.php?id=31`](https://linuxmint.com/edition.php?id=31)


    ### 安装过程


    -   要启动 Linux Mint 21.3 Cinnamon 的安装，从启动型 U 闪盘加载到桌面后，点击屏幕上的 Install 图标。


    ![](img/image_rsrc27K.jpg)


    -   选择你的语言并点击 Continue 按钮。


    ![](img/image_rsrc27M.jpg)


    -   选择你偏好的键盘布局并点击 Continue 按钮。


    ![](img/image_rsrc27N.jpg)


    -   当此步骤询问你是否连接 WiFi 无线网络时，选择不连接，因为这会让安装更快，你以后可以在窗口中执行所有描述的操作，如下载更新或安装第三方软件。


    ![](img/image_rsrc27P.jpg)


    -   在此步骤勾选 Install multimedia codes（安装多媒体解码器）以安装它们，因为这样在 Linux Mint 21.3 Cinnamon
    完全安装完成后你就可以播放各种多媒体。


    -   点击 Continue 按钮。


    ![](img/image_rsrc27R.jpg)


    -   如果弹出窗口询问你是否要卸载某些正在使用的分区，点击 Yes 按钮选择 Yes。


    ![](img/image_rsrc27S.jpg)


    -   在此步骤中，选择 Erase disk and install Linux Mint（擦除磁盘并安装 Linux Mint）选项。


    -   请记住，此选项将删除你硬盘上的所有内容，包括 Micro$oft Windows 等其他操作系统，并将删除你电脑硬盘上的每一个文件。因此，你必须将
    Linux Mint 安装在一台专用于 Linux Mint 的电脑上！！！


    '
- fmt: '

    - I could show you how to use the other installation options, but they are usually
    for more advanced users of Linux, and this tutorial, is mainly for beginners in
    Linux.

    - Click on the `Continue` button.


    ![](image_rsrc27T.jpg)


    - Click on the `Install Now` button, to start the installation of the Linux Mint
    21.3 Cinnamon, on your computer.

    - Take a cut of coffee or tea, and wait for the installation to complete. You
    will have time to read three books, while you are waiting for the installation
    to finish….. Just joking! :-)

    - Linux Mint will inform you, once the installation is complete.


    ![](image_rsrc27U.jpg)


    # USING LINUX MINT 21.3 CINNAMON


    ## MAIN MENU


    - Let us start with showing you, how to use the Main Menu.

    - Click on the Linux Mint logo icon, located at the bottom left corner of the
    screen, in order to open the Main Menu.


    ![](image_rsrc27V.jpg)


    - When you want to shut down the computer, restart the computer, or just put the
    computer to sleep, click on the `Quit` red shortcut icon, located in the Favorites,
    in the Main Menu, at the left side of the open Main Menu.


    ![](image_rsrc27W.jpg)


    - From the open window, chose what you want to do, to restart your computer, to
    suspend your computer, or to shut down your computer, by clicking on one of the
    buttons.


    ![](image_rsrc27X.jpg)


    - If you just want to logout from your desktop, click on the `Logout` shortcut
    icon, located in the Favorites section, of the Main Menu, at the left side.


    ![](image_rsrc27Y.jpg)


    - But let us say, you do not want to switch off your computer, you just want to
    lock the desktop screen.

    - Click on the `Lock screen` shortcut icon, located in the Favorites section,
    of the Main Menu, at the left side.


    ![](image_rsrc27Z.jpg)


    - The files and folders on your computer, can be accessed, by opening the files
    manager called `Files`.

    - To open the `Files` file manager, click on the yellow `Files` shortcut folder
    icon, located in the Favorites section, of the open Main Menu, on the left side.


    ![](image_rsrc280.jpg)


    - The `System Settings`, can be accessed, by clicking on the `System Settings`
    shortcut icon, located in the Favorites section, of the Main Menu, at the left
    side of the Main Menu.


    ![](image_rsrc281.jpg)


    - When you just want to browse the Internet, click on the `Firefox` browser shortcut
    icon, located at the top of the Favorites section, in the Main Menu.


    ![](image_rsrc282.jpg)


    - The applications categories shortcuts, are placed on the left side, of the Main
    Menu. The applications sub-categories, are placed in the sub-menu, on the right
    side of the Main Menu.

    - For example, click on the Main Menu to open it. Once opened, click on the `Internet`
    applications category, in the Main Menu. In the sub-menu on the right side, of
    the Main Menu, you can see all those Internet applications, which are under the
    Internet applications category.


    ![](image_rsrc283.jpg)


    - If you want to see all the installed on your computer applications, click to
    open the Main Menu.

    - On the top of the Main Menu, click on the `All Applications` icon. On the right
    side of the Main Menu, you will see all the installed applications, in the sub-menu.
    Just scroll down in the sub-menu, to see all of them.


    ![](image_rsrc284.jpg)


    - Now, there is a folder category shortcut, in the Main Menu, called `Places`.
    When you click on that folder looking icon, in the Main Menu, you will see in
    the sub-menu, shortcuts to the various places on your computer, like the `Documents`
    folder, the `Music` folder, `Pictures` folder, the `Home` folder, and other places.

    - Open the Main Menu, and click on the `Places` category shortcut, and look at
    the various places on your computer, in the sub-menu.


    ![](image_rsrc285.jpg)


    ## Managing Shortcuts on the Panel


    - In this step, we will look into how to place an application shortcut, on the
    `Panel`. Remember the `Panel` is at the bottom of your desktop.

    - Let us say, you want to place an application shortcut, on the `Panel`.

    - To do this, click on the Main Menu to open it.

    - Click on the `Internet` applications category.

    - In the sub-menu, right click on the `Thunderbird` application.

    - Click the `Add to Panel` option.


    ![](image_rsrc286.jpg)


    - Now the `Thunderbird` shortcut has been added to the `Panel`.

    - If you want to remove the `Thunderbird` shortcut from the `Panel`, right click
    on it.

    - Click the `Move to Trash` option.


    ![](image_rsrc287.jpg)


    - And of course, you can add the `Mail` shortcut to the `Favorites`.

    - To do that, click on the Main Menu to open it.

    - Click on the `Internet` category.

    - In the sub-menu, right click on the `Mail` icon.

    - Click the `Add to Favorites` option.


    ![](image_rsrc288.jpg)


    - Now the `Mail` shortcut icon has been added to the `Favorites` section of the
    Main Menu.

    - When you want to remove the `Mail` shortcut icon from the `Favorites` section,
    right click on it in the `Internet` category.

    - Click the `Remove from Favorites` option.


    ![](image_rsrc289.jpg)


    - There may be times, when you want to write some text document. To do that, Linux
    Mint 21.3 Cinnamon gives you the `LibOffice Writer` application, which will do
    all common things, when you type documents.

    - To do this, click on the Main Menu to open it.

    - Click on the `Office` applications category, in the Main Menu.

    - Click on the `LibOffice Writer` application shortcut.


    ![](image_rsrc28A.jpg)


    - For listening to music, you can use the `Rhythmbox` application, which comes
    by default, with Linux Mint 21.3 Cinnamon.

    - To open and use the `Rhythmbox` application, click on the Main Menu to open
    it.

    - Click on the `Sound & Video` applications category, in the Main Menu.

    - From the open sub-menu, click on the `Rhythmbox` application shortcut.


    ![](image_rsrc28B.jpg)


    - Let us say, you have stored some photos on your Linux Mint computer, and now
    you want to browse and see those photos. To do so, you can use the `Pix` application.

    - To open the `Pix` application, click on the Main Menu to open it.

    - Click on the `Graphics` applications category, in the Main Menu.

    - Click on the `Pix` applications shortcut, in the open sub-menu, to open the
    application.


    ![](image_rsrc2J.jpg)

    '
