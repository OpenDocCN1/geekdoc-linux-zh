- fmt: "\n- Another way, to cancel the Test Page printing job, is by clicking on the\
    \ print job visible in the open window, and then click on the Cancel selected\
    \ job red button, located at the top of the open window.\n\n![](image_rsrc21J.jpg)![](image_rsrc21K.jpg)\n\
    \n- But there may be the case, when you just want to reprint, that same printing\
    \ job, which you have done previously, like the Test Page job for example. All\
    \ you need to do, is to select the printing job in the Document Print Status open\
    \ window, and then, click on the green arrow, at the top of the window, which\
    \ is the Reprint selected job option. That will reprint that printing job, again.\n\
    \n![](image_rsrc21M.jpg)\n\n# POWER MANAGEMENT\n\n- In order for your computer\
    \ to work efficiently, we have to configure the Power Management.\n\n- Click on\
    \ the Power Management icon, in the open System Settings window.\n\n![](image_rsrc21N.jpg)\n\
    \n- Click on the `Power` tab, in System Settings window.\n\n![](image_rsrc21P.jpg)\n\
    \n- The first setting we are going to configure, is about turning the computer\
    \ screen off, after a certain time of inactivity.\n\n- Under the Power Options,\
    \ click on the drop down menu on the right side of the window, for the A/C power,\
    \ in the field for the `Turn off the screen when inactive for` option.\n\n![](image_rsrc21R.jpg)\n\
    \n- From the drop down menu, chose in minutes, after how many minutes, you want\
    \ the computer screen to be turned off, automatically, after a certain time of\
    \ inactivity.\n\n![](image_rsrc21S.jpg)\n\n- Now we will configure after how many\
    \ minutes, the computer will go into the Suspend mode, automatically, when there\
    \ is no activity on the computer.\n\n- Under Power Options, click on the drop\
    \ down menu, in the field of the `Suspend when inactive for` option, and select\
    \ the time in minutes, which must elapse, before the computer goes automatically,\
    \ into the `Suspend` mode. That is still for the A/C power option.\n\n![](image_rsrc21T.jpg)![](image_rsrc21U.jpg)\n\
    \n- In this step we will configure, what happens, every time you close, the laptop\
    \ lid.\n\n- Still under the Power Options, click on the drop down menu, in the\
    \ field for the `When the lid is closed` option, and select what the computer\
    \ should do. That is still under the A/C power. You can chose the computer to\
    \ `Shut Down`, `Suspend`, or `Lock Screen`, when the computer lid is closed.\n\
    \n![](image_rsrc21V.jpg)![](image_rsrc21W.jpg)\n\n- Until now, we have been configuring\
    \ the power settings for the computer, when the computer is working with the A/C\
    \ power. But now, we will configure your laptop, and its Power Management setting,\
    \ to use it, when your laptop is working only by using the battery power.\n\n\
    - Under the `On battery power` setting, click on the drop down menu, in the `Turn\
    \ off the screen when inactive for` field, and select the time in minutes, after\
    \ which, the laptop screen will be turned off automatically, when there is no\
    \ activity on the computer.\n\n![](image_rsrc21X.jpg)![](image_rsrc21Y.jpg)\n\n\
    - Now let us set the time of inactivity, after which your laptop will go into\
    \ Suspend mode. To do that, in the Power Options, under the `On battery power`\
    \ settings, click on the drop down menu, in the `Suspend when inactive for` field,\
    \ and select what you want the laptop to do. Chose the time of inactivity, after\
    \ which you want the laptop to go automatically into the `Suspend` mode. Or, if\
    \ you prefer, you can chose the laptop to never go into the `Suspend` mode automatically.\n\
    \n![](image_rsrc21Z.jpg)![](image_rsrc220.jpg)\n\n- And now, let us adjust what\
    \ will happen with your laptop, each time you close the laptop lid.\n\n- In the\
    \ Power Options, under the On the battery power, click on the drop down menu,\
    \ in the `When the lid is closed` field, and choose what happens to the computer,\
    \ if you want it to go into the `Suspend` mode, into `Shut down immediately` mode,\
    \ or just in the `Lock Screen` mode.\n\n![](image_rsrc221.jpg)![](image_rsrc222.jpg)\n\
    \n- Under the Extra options, click on the drop down menu, in the `When the power\
    \ button is pressed` field, to set, what will happen, each time you press the\
    \ power button, of your laptop. You can choose the `Shut down immediately` option,\
    \ the `Suspend` mode, or just the `Screen Lock` option. Also, you can choose the\
    \ `Ask` option, from the drop down menu, if you want to see a small window popup,\
    \ and give you the option, of what you want to do about the laptop, and its various\
    \ power options.\n\n![](image_rsrc223.jpg)\n\n- In this step, we are going to\
    \ set what happens, each time the laptop battery becomes critically low.\n\n-\
    \ Under the Extra options, click on the drop down menu, in the `When the battery\
    \ is critically low` field, and chose what happens, either the computer goes into\
    \ the `Shut down immediately` mode, or just do nothing about it.\n\n![](image_rsrc224.jpg)\n\
    \n- The laptop monitor, needs a lot of power, in order to function. Therefore,\
    \ it is a good idea, the screen brightness to be automatically regulated, when\
    \ you are away from your laptop, for awhile, in the.\n\n- Move the `Brightness`\
    \ slider to the left or right, to adjust the screen brightness.\n\n![](image_rsrc225.jpg)![](image_rsrc226.jpg)\n\
    \n- Under the `Brightness` option, click on the drop down menu, in `Dim screen\
    \ when inactive` field, and choose the percentage.\n\n![](image_rsrc227.jpg)![](image_rsrc228.jpg)\n\
    \n- And the last option is, to dim the screen when it is inactive for period of\
    \ time. Click on the drop down menu, in `Dim screen after inactive for` field,\
    \ and chose the time. \n\n![](image_rsrc22A.jpg)\n\n# SOUND\n\n- A computer without\
    \ sound, is not computer at all… Let us configure the sound of your Linux Mint\
    \ 21.3 Cinnamon, in this step.\n\n- Click on the Sound icon, under `Hardware`,\
    \ in the open System Settings window.\n\n![](image_rsrc22B.jpg)\n\n- Click on\
    \ the `Output` tab, in the open System Settings window.\n\n![](image_rsrc22C.jpg)\n\
    \n- Under the Device settings, make sure that `Analog Stereo Output` is selected,\
    \ in the drop down menu, and that is, in the `Output profile`.\n\n- For the output\
    \ Device, you can see in the example here, that the built-in audio, is used and\
    \ configured. But, if you are planning to use some external sound devices, like\
    \ earphones for example, once you plug them in, into the computer, their icon\
    \ will appear here in this settings window, too.\n\n- You can also adjust the\
    \ volume level and the sound balance here in this step, by using and moving the\
    \ sliders for the volume and the balance, to the left or right, with the mouse\
    \ pointer.\n\n- The `Test sound` button, can be used to test your sound configuration,\
    \ and see, if the sound on your computer is working properly.\n\n![](image_rsrc22D.jpg)\n\
    \n- Click on the `Input` tab, to configure any microphone you are going to use,\
    \ on your computer.\n\n- Under Device, here in this example, you can see that\
    \ the internal build in microphone of the laptop, has been configured and used.\
    \ But, if you plug in some external microphone into your computer, you will see\
    \ its icon also shown here, under Device.\n\n- You can adjust the volume of the\
    \ input device, by moving the slider, to the left or right side.\n\n- The `Input\
    \ Level` indicator will show you, first, if the microphone is working, and second,\
    \ to what level it is detecting, any external sound.\n\n![](image_rsrc22E.jpg)![](image_rsrc22F.jpg)\n"
  raw: '● Another way, to cancel the Test Page printing job, is by clicking on the
    print job visible in the open window, and then click on the Cancel selected job
    red button, located at the top of the open window.


    ![](image_rsrc21J.jpg)![](image_rsrc21K.jpg)


    ● But there may be the case, when you just want to reprint, that same printing
    job, which you have done previously, like the Test Page job for example. All you
    need to do, is to select the printing job in the Document Print Status open window,
    and then, click on the green arrow, at the top of the window, which is the Reprint
    selected job option. That will reprint that printing job, again.


    ![](image_rsrc21M.jpg)


    POWER MANAGEMENT


    ● In order for your computer to work efficiently, we have to configure the Power
    Management.


    ●       Click on the Power Management icon, in the open System Settings window.


    ![](image_rsrc21N.jpg)


    ●       Click on the Power tab, in System Settings window.


    ![](image_rsrc21P.jpg)


    ● The first setting we are going to configure, is about turning the computer screen
    off, after a certain time of inactivity.


    ● Under the Power Options, click on the drop down menu on the right side of the
    window, for the A/C power, in the field for the Turn off the screen when inactive
    for option.


    ![](image_rsrc21R.jpg)


    ● From the drop down menu, chose in minutes, after how many minutes, you want
    the computer screen to be turned off, automatically, after a certain time of inactivity.


    ![](image_rsrc21S.jpg)


    ● Now we will configure after how many minutes, the computer will go into the
    Suspend mode, automatically, when there is no activity on the computer.


    ● Under Power Options, click on the drop down menu, in the field of the Suspend
    when inactive for option, and select the time in minutes, which must elapse, before
    the computer goes automatically, into the Suspend mode. That is still for the
    A/C power option.


    ![](image_rsrc21T.jpg)![](image_rsrc21U.jpg)


    ● In this step we will configure, what happens, every time you close, the laptop
    lid.


    ● Still under the Power Options, click on the drop down menu, in the field for
    the When the lid is closed option, and select what the computer should do. That
    is still under the A/C power. You can chose the computer to Shut Down, Suspend,
    or Lock Screen, when the computer lid is closed.


    ![](image_rsrc21V.jpg)![](image_rsrc21W.jpg)


    ● Until now, we have been configuring the power settings for the computer, when
    the computer is working with the A/C power. But now, we will configure your laptop,
    and its Power Management setting, to use it, when your laptop is working only
    by using the battery power.


    ● Under the On battery power setting, click on the drop down menu, in the Turn
    off the screen when inactive for field, and select the time in minutes, after
    which, the laptop screen will be turned off automatically, when there is no activity
    on the computer.


    ![](image_rsrc21X.jpg)![](image_rsrc21Y.jpg)


    ● Now let us set the time of inactivity, after which your laptop will go into
    Suspend mode. To do that, in the Power Options, under the On battery power settings,
    click on the drop down menu, in the Suspend when inactive for field, and select
    what you want the laptop to do. Chose the time of inactivity, after which you
    want the laptop to go automatically into the Suspend mode. Or, if you prefer,
    you can chose the laptop to never go into the Suspend mode automatically.


    ![](image_rsrc21Z.jpg)![](image_rsrc220.jpg)


    ● And now, let us adjust what will happen with your laptop, each time you close
    the laptop lid.


    ● In the Power Options, under the On the battery power, click on the drop down
    menu, in the When the lid is closed field, and choose what happens to the computer,
    if you want it to go into the Suspend mode, into Shut down immediately mode, or
    just in the Lock Screen mode.


    ![](image_rsrc221.jpg)![](image_rsrc222.jpg)


    ● Under the Extra options, click on the drop down menu, in the When the power
    button is pressed field, to set, what will happen, each time you press the power
    button, of your laptop. You can choose the Shut down immediately option, the Suspend
    mode, or just the Screen Lock option. Also, you can choose the Ask option, from
    the drop down menu, if you want to see a small window popup, and give you the
    option, of what you want to do about the laptop, and its various power options.


    ![](image_rsrc223.jpg)


    ● In this step, we are going to set what happens, each time the laptop battery
    becomes critically low.


    ● Under the Extra options, click on the drop down menu, in the When the battery
    is critically low field, and chose what happens, either the computer goes into
    the Shut down immediately mode, or just do nothing about it.


    ![](image_rsrc224.jpg)


    ● The laptop monitor, needs a lot of power, in order to function. Therefore, it
    is a good idea, the screen brightness to be automatically regulated, when you
    are away from your laptop, for awhile, in order to save battery power.


    ●       Click on the Brightness tab, in the open System Settings window.


    ●       Move the slider to the left or right, to adjust the screen brightness.


    ![](image_rsrc225.jpg)![](image_rsrc226.jpg)


    ● Under the Screen brightness option, click on the little white button, on the
    right side of the window, in the On battery, dim screen when inactive field. That
    setting will cause the screen to be dimmed automatically, each time you move away
    from the laptop, for a certain period of time. That will save your laptop battery
    power.


    ![](image_rsrc227.jpg)


    ● Also, click on the drop down menu, in the Brightness level when inactive option,
    and choose the percentage of the brightness level.


    ![](image_rsrc228.jpg)![](image_rsrc229.jpg)


    ● And the last option is, to dim the screen when it is inactive for period of
    time. Click on the drop down menu, in the Dim screen after inactive for field,
    and chose the time elapsing, after which, the screen goes dim, automatically. 


    ![](image_rsrc22A.jpg)


    SOUND


    ● A computer without sound, is not computer at all… Let us configure the sound
    of your Linux Mint 21.3 Cinnamon, in this step.


    ●       Click on the Sound icon, under Hardware, in the open System Settings window.


    ![](image_rsrc22B.jpg)


    ●       Click on the Output tab, in the open System Settings window.


    ![](image_rsrc22C.jpg)


    ● Under the Device settings, make sure that the Analog Stereo Output is selected,
    in the drop down menu, and that is, in the Output profile.


    ● For the output Device, you can see in the example here, that the built-in audio,
    is used and configured. But, if you are planning to use some external sound devices,
    like an earphones for example, once you plug them in, into the computer, their
    icon will appear here in this settings window, too.


    ● You can also adjust the volume level and the sound balance here in this step,
    by using and moving the sliders for the volume and the balance, to the left or
    right, with the mouse pointer.


    ● The Test sound button, can be used to test your sound configuration, and see,
    if the sound on your computer is working properly.


    ![](image_rsrc22D.jpg)


    ● Click on the Input tab, to configure any microphone you are going to use, on
    your computer.


    ● Under Device, here in this example, you can see that the internal build in microphone
    of the laptop, has been configured and used. But, if you plug in some external
    microphone into your computer, you will see its icon also shown here, under Device.


    ● You can adjust the volume of the input device, by moving the slider, to the
    left or right side.


    ● The Input Level indicator will show you, first, if the microphone is working,
    and second, to what level it is detecting, any external sound.


    ![](image_rsrc22E.jpg)![](image_rsrc22F.jpg)'
