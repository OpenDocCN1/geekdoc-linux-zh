    -   在打开的主菜单上，有一个搜索栏。在搜索栏中，你可以输入电脑上已安装的应用程序名称，它将为你找到。


    ![](img/image_rsrc28K.jpg)


    # 面板 (PANEL)


    -   如果你是 Linux 初学者，了解如何正确地使用面板对你很有帮助。当然，了解如何使用 Linux 操作系统的每个部分对你都有，但我强调面板，因为就像桌面（面板是桌面的一部分）一样，在你使用
    Linux Mint 21.3 Cinnamon 电脑时，是你最频繁使用它的。


    -   例如，如果你在面板左侧分组图标中的文件夹图标（即 `File Manager` 文件管理器的图标）上用鼠标右键点击单击，你将看到一个弹出的菜单。


    -   从该弹出菜单中，你可以访问计算机上的各种位置、访问各种最近文件，或者仅配置某些设置。


    ![](img/image_rsrc28M.jpg)


    -   你只需将鼠标指针悬停在面板左侧分组图标之一上，即可获取打开应用程序窗口的预览。不要点击图标，只需将指针悬停在上面，你就会看到弹出一个小的预览窗口。从这个小预览窗口中，你也可以点击预览窗口中的红色
    `Close` 按钮来关闭该应用程序。


    ![](img/image_rsrc28N.jpg)![](img/image_rsrc28P.jpg)


    -   当你在面板的空白区域用鼠标右键点击单击时，你将看到一个弹出的菜单。


    -   从该弹出菜单中，你可以将面板移动到桌面的另一个位置、移除面板，以及向面板添加一些小组件（Applets）。你还可以配置面板，或在桌面上添加第二个面板。


    -   只需确保首先点击该弹出菜单中的面板编辑模式按钮，这样你就可以对面板执行上述提到的所有操作。


    ![](img/image_rsrc28R.jpg)


    -   你在屏幕边缘看到的红线，是桌面上的位置，在你启用面板的编辑模式后，可以通过拖动鼠标指针将面板移动到那里。你可以通过点击上一步中提到的弹出菜单中的 `Move`
    选项来移动面板。


    ![](img/image_rsrc28S.jpg)


    -   在下方的图中，你可以看到面板已经移动到了桌面屏幕的顶部。


    ![](img/image_rsrc28T.jpg)


    -   如需查看时间和日期，只需点击面板右下角的时间图标。


    ![](img/image_rsrc28U.jpg)


    -   可以通过点击面板右侧的音量图标更改音量。


    ![](img/image_rsrc28V.jpg)


    -   只需点击面板右侧的电源图标，即可调整屏幕亮度。从该电源图标，你也可以访问电源设置。


    ![](img/image_rsrc28W.jpg)


    -   当你想要将应用程序快捷图标固定到面板时，一旦你打开了该应用程序，你就能看到面板上显示了该打开的应用程序图标。图标已显示，但尚未固定到面板上。


    -   要将该已打开的应用程序快捷图标固定到面板，只需在 във应用程序图标上用鼠标右键点击，然后从弹出菜单中点击 `Pin` 选项。下方显示了一个 `Firefox`
    浏览器打开并将其快捷图标固定到面板的示例。


    ![](img/image_rsrc28X.jpg)


    -   但有时你可能想从面板上取消固定某个应用程序快捷图标。要这样操作，请用鼠标右键点击面板上已固定的应用程序图标，然后从弹出菜单中点击 `Unpin` 选项。


    ![](img/image_rsrc28Y.jpg)


    -   面板最右侧有一小块空间，点击它可以隐藏桌面上的所有已打开应用程序，这样你就能看到桌面了。如果你点击面板右边缘的这个空间，所有隐藏的窗口都将可见。


    ![](img/image_rsrc28Z.jpg)


