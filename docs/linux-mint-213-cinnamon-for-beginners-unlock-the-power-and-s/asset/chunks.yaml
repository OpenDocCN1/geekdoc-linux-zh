  trans: "\n\n- 我可以向你展示如何使用其他的安装选项，但它们通常是为更高级的 Linux 用户准备的，而本教程主要针对 Linux 初学者。\n-\
    \ 点击 `Continue` 按钮。\n\n![](img/image_rsrc27T.jpg)\n\n- 点击 `Install Now` 按钮，开始在你的计算机上安装\
    \ Linux Mint 21.3 Cinnamon。\n- 去喝杯咖啡或茶，等待安装完成。在等待安装结束的过程中，你会有时间读三本书了……只是开个玩笑啦！\
    \ :-)\n- 安装完成后，Linux Mint 会通知你。\n\n![](img/image_rsrc27U.jpg)\n\n# 使用 LINUX MINT\
    \ 21.3 CINNAMON\n\n## 主菜单 (MAIN MENU)\n\n- 让我们从向你展示如何使用主菜单开始。\n- 点击位于屏幕左下角的 Linux\
    \ Mint 标志图标，即可打开主菜单。\n\n![](img/image_rsrc27V.jpg)\n\n- 当你想关闭电脑、重启电脑或仅让电脑进入睡眠状态时，点击位于主菜单左侧“收藏\
    \ (Favorites)”栏中的红色 `Quit` 快捷图标。\n\n![](img/image_rsrc27W.jpg)\n\n- 在打开的窗口中，点击其中一个按钮来选择你想的操作：重启电脑、挂起电脑或关闭电脑。\n\
    \n![](img/image_rsrc27X.jpg)\n\n- 如果你只想注销桌面，点击位于主菜单左侧“收藏 (Favorites)”区域的 `Logout`\
    \ 快捷图标。\n\n![](img/image_rsrc27Y.jpg)\n\n 但假设你不想关闭电脑，只是想锁定桌面屏幕。\n- 点击位于主菜单左侧“收藏\
    \ (Favorites)”区域的 `Lock screen` 快捷图标。\n\n![](img/image_rsrc27Z.jpg)\n\n- 你可以通过打开名为\
    \ `Files` 的文件管理器来访问计算机上的文件和文件夹。\n- 要打开 `Files` 文件管理器，点击已打开的主菜单左侧“收藏 (Favorites)”区域中的黄色\
    \ `Files` 快捷文件夹图标。\n\n![](img/image_rsrc280.jpg)\n\n- 通过点击主菜单左侧“收藏 (Favorites)”区域中的\
    \ `System Settings` 快捷图标，可以访问“系统设置”。\n\n![](img/image_rsrc281.jpg)\n\n- 当你只想浏览网页时，点击主菜单“收藏\
    \ (Favorites)”区域顶部的 `Firefox` 浏览器快捷图标。\n\n![](img/image_rsrc282.jpg)\n\n- 应用程序分类快捷方式位于主菜单的左侧。应用程序的子分类位于主菜单右侧的子菜单中。\n\
    - 例如，点击主菜单打开它。打开后，点击主菜单中的 `Internet` 应用程序分类。在主菜单右侧的子菜单中，你可以看到所有属于 `Internet` 应用程序分类下的互联网应用。\n\
    \n![](img/image_rsrc283.jpg)\n\n- 如果你想查看计算机上所有已安装的应用，点击打开主菜单。\n- 在主菜单顶部，点击 `All\
    \ Applications` 图标。在主菜单右侧，你将在子菜单中看到所有已安装的应用。只需在子菜单中向下滚动即可查看所有它们。\n\n![](img/image_rsrc284.jpg)\n\
    \n- 现在，主菜单中有一个名为 `Places` 的文件夹分类快捷方式。当你点击主菜单中那个像文件夹的图标时，你将在子菜单中看到计算机上各个位置的快捷方式，例如\
    \ `Documents` 文件夹、`Music` 文件夹、`Pictures` 文件夹、`Home` 文件夹和其他地方。\n- 打开主菜单，点击 `Places`\
    \ 分类快捷方式，并在子菜单中查看计算机上的各种位置。\n\n![](img/image_rsrc285.jpg)\n\n## 在面板（Panel）上管理快捷方式\n\
    \n- 在这一步中，我们将介绍如何将应用程序快捷方式放在`Panel”（面板）上。记得 `Panel` 位于你桌面的底部。\n- 假设你想在 `Panel`\
    \ 上放置一个应用程序快捷方式。\n- 为此，点击主菜单打开它。\n- 点击 `Internet` 应用程序分类。\n- 在子菜单中，右键点击 `Thunderbird`\
    \ 应用程序。\n- 点击 `Add to Panel` 选项。\n\n![](img/image_rsrc286.jpg)\n\n- 现在 `Thunderbird`\
    \ 快捷方式已添加到 `Panel` 中。\n- 如果你想从 `Panel` 中移除 `Thunderbird` 快捷方式，右键点击它。\n- 点击 `Move\
    \ to Trash` 选项。\n\n![](img/image_rsrc287.jpg)\n\n- 当然，你还可以将 `Mail` 快捷方式添加到“收藏\
    \ (Favorites)”中。\n- 为此，点击主菜单打开它。\n- 点击 `Internet` 分类。\n- 在子菜单中，右键点击 `Mail` 图标。\n\
    - 点击 `Add to Favorites` 选项。\n\n![](img/image_rsrc288.jpg)\n\n- 现在 `Mail` 快捷图标已添加到主菜单的“收藏\
    \ (Favorites)”区域。\n- 当你想从“收藏 (Favorites)”区域移除 `Mail` 快捷图标时，在 `Internet` 分类中右键点击它。\n\
    - 点击 `Remove from Favorites` 选项。\n\n![](img/image_rsrc289.jpg)\n\n- 有时候你想编写某些文本文档。为此，Linux\
    \ Mint 21.3 Cinnamon 提供了 `LibOffice Writer` 应用程序，输入文档时它可以完成所有常用操作。\n- 为此，点击主菜单打开它。\n\
    - 点击主菜单中的 `Office` 应用程序分类。\n- 点击 `LibOffice Writer` 快捷方式。\n\n![](img/image_rsrc28A.jpg)\n\
    \n- 为了听音乐，你可以使用 `Rhythmbox` 应用程序，它是 Linux Mint 21.3 Cinnamon 自带的。\n- 要打开并使用 `Rhythmbox`\
    \ 应用程序，点击主菜单打开它。\n- 点击主菜单中的 `Sound & Video` 应用程序分类。\n- 从打开的子菜单中，点击 `Rhythmbox`\
    \ 应用程序快捷方式。\n\n![](img/image_rsrc28B.jpg)\n\n- 假设你在 Linux Mint 计算机上存储了一些照片，现在你想浏览并查看这些照片。为此，你可以使用\
    \ `Pix` 应用程序。\n- 要打开 `Pix` 应用程序，点击主菜单打开它。\n- 点击主菜单中的 `Graphics` 应用程序分类。\n- 在打开的子菜单中点击\
    \ `Pix` 应用程序快捷方式以打开该程序。\n\n![](img/image_rsrc2J.jpg)\n\n"
