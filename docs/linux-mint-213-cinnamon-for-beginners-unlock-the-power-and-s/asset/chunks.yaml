  raw: 'First I will show you, how to create, the bootable USB flash drive, with Linux
    Mint 21.3 Cinnamon on it. You need to make a bootable USB flash drive, and by
    installing the Linux Mint 21.3 Cinnamon ISO file on it. Once that is done, you
    can plug that bootable USB flash drive into the USB port of your computer, restart
    your computer, and the Linux Mint 21.3 Cinnamon, will start loading. Once it has
    loaded to the Desktop, there is an installation icon on the Desktop, which if
    you click on it, will start installing the Linux Mint 21.3 Cinnamon, from the
    bootable USB flash drive, on to your computer. But now, let us make the bootable
    USB flash drive first, by following the steps bellow.


    ● You will be using a free tool, called ‘BalenaEtcher’. Just visit the following
    website: [https://www.balena.io/etcher](https://www.balena.io/etcher) and download
    the free program, on your computer. You do not even have to install the ‘BalenaEtcher’,
    once you download it, on your computer, from the Internet. If you are using a
    Windows or a Linux computer, on which you will download the ‘BalenaEtcher’ free
    program, all you need to do, in order to use it, is to click on the ‘BalenaEtcher’
    program you have downloaded, and in a few seconds, it will be opened and ready
    to use.


    ● Here is a screenshot, of how ‘BalenaEtcher’ program looks like, once it is opened.
    Look at the following image bellow.


    ![](image_rsrc27J.jpg)


    ● As you can see from the image above, it has only three easy steps, in order
    to make a bootable USB flash drive, by using the ‘BalenaEtcher’ program tool.
    Once you have downloaded the Linux Mint 21.3 Cinnamon, from the Linux Mint 21.3
    Cinnamon official website, on your computer, as an ISO file, all you have to do,
    is to follow the three easy steps, in the ‘BalenaEtcher’ program, as you see above
    on the image. Do not worry what that ‘ISO’ file means! It is just the extension
    of the Linux Mint 21.3 Cinnamon file, which you will download, from the Linux
    Mint official website.


    ● The first step as you can see in the blue color, on the ‘BalenaEtcher’ program
    image above, which says ‘Flash from file’ is the blue button, which you click
    on, in order to select, the Linux Mint 21.3 Cinnamon operating system file, which
    you have downloaded, from the Internet, already. Once you do that, you continue
    to the second step, in making the bootable USB flash drive.


    ● The second step is, to select the USB flash drive, which you are using, to make
    it a bootable USB flash drive with Linux Mint 21.3 Cinnamon on it. So, just click
    on the ‘Select target’, in the ‘BalenaEtcher’ program, you have already opened,
    and then, chose the USB flash drive, which you are going to make bootable, from
    the options.


    ● The next step is, to click on the ‘Flash’ button, in the opened ‘BalenaEtcher’
    program. Let it ‘cook on slow fire’, for a few minutes, or in other words, let
    it do what it is supposed to do, for a few minutes, and voila, you have made a
    bootable USB flash drive, with the Linux Mint 21.3 Cinnamon operating system on
    it. Now, that bootable USB flash drive, with Linux Mint 21.3 Cinnamon on it, is
    what is called a live operating system, meaning, that bootable USB flash drive,
    with the Linux Mint 21.3 Cinnamon on it, can be plugged into any computer, and
    you can run the Linux Mint 21.3 Cinnamon from the USB flash drive, and use it,
    like any other operating system which is already installed on any computer. It
    is like Windows operating system, which is on any computer, ready to be used,
    for the various tasks you desire. The only difference is, that the Linux Mint
    21.3 Cinnamon operating system, which is on the bootable USB flash drive, which
    you have made, is only run live, from that bootable USB flash drive, and is NOT
    yet installed, on any computer, even not yet on your computer, on which can run
    it live. It runs live on the computer where the bootable USB flash drive is plugged
    into, and is not installed yet, on the computer. You just switch on the computer,
    with the bootable USB flash disk, already plugged into the computer, and the computer
    will start Linux Mint 21.3 Cinnamon, from that bootable USB flash drive, in a
    live mode, even if you have already Microsoft Windows, installed on that computer.
    Do not worry, running the Linux Mint 21.3 Cinnamon live, from the bootable USB
    flash drive, will NOT affect, change or do, anything on any other operating system,
    you have on that same computer, like for example, Windows existing on that computer
    already. Everything you do with that bootable USB flash drive, with Linux Mint
    21.3 Cinnamon on it, is done in that flash drive only. And of course, you can
    at any time, install the Linux Mint 21.3 Cinnamon from the bootable USB flash
    drive, on the computer, any time you chose to do so.


    ● To download the Linux Mint 21.3 Cinnamon operating system, from the Internet,
    just visit the following website link, and download Linux Mint 21.3 Cinnamon.
    Once you click on the website link bellow, your computer will start to download
    the Linux Mint 21.3 Cinnamon ISO installation file, on your computer. Once the
    file is downloaded, then you have to use the file, to make the bootable USB flash
    disk, to use it, for installing the Linux Mint 21.3 Cinnamon, on your computer:


    ●                   For the download web page, from where you can download the
    Linux Mint 21.3 Cinnamon ISO installation file, click on the following website
    link:


    Click [here](https://linuxmint.com/edition.php?id=311) to Download Linux Mint
    21.3 Cinnamon


    You are looking to download the: linuxmint-21.3-cinnamon-64bit[.iso](https://cdimage.debian.org/images/release/current-live/amd64/iso-hybrid/debian-live-12.4.0-amd64-kde.iso)
    file, from that web page link above. That will be the file, to make the bootable
    Live Linux Mint 21.3 Cinnamon USB Flash disk.


    ●                   Click on the following website link bellow, to start the Linux
    Mint 21.3 Cinnamon download on your computer:


    [Click here to start downloading Linux Mint 21.3 Cinnamon ISO file](https://mirrors.edge.kernel.org/linuxmint/stable/21.3/linuxmint-21.3-cinnamon-64bit.iso),
    which you will use, to make the bootable Live Linux Mint 21.3 Cinnamon USB Flash
    disk.


    INSTALLATION PROCESS


    ● To start the installation of Linux Mint 21.3 Cinnamon, once it has loaded to
    the Desktop, from the Live bootable Linux Mint 21.3 Cinnamon USB disk, click on
    the Install Linux Mint icon, located on the top of the screen.


    ![](image_rsrc27K.jpg)


    ●       Chose your language and click on the Continue button.


    ![](image_rsrc27M.jpg)


    ●       Chose your preferred keyboard layout, and click on the Continue button.


    ![](image_rsrc27N.jpg)


    ● When the option comes, asking you if you want to connect to the WiFi wireless
    network, at this step, chose not to connect, because you will make the installation
    faster, and you can always do all those described things in the window, like downloading
    updates, or installing third party software, latter.


    ![](image_rsrc27P.jpg)


    ● Click on the checkbox, for the Install multimedia codes at this step, in order
    to install them, because that will allow you to play various multimedia latter
    on, once Linux Mint 21.3 Cinnamon, has been completely installed.


    ●       Click on the Continue button.


    ![](image_rsrc27R.jpg)


    ● If there is a popup window, asking you if you want to unmount some partitions
    that are in use, chose the Yes option, by clicking on the Yes button.


    ![](image_rsrc27S.jpg)


    ●       In this step, chose the Erase disk and install Linux Mint option.


    ● Bear in mind, that this option, will erase everything on your hard drive, including
    other operating system, like Micro$oft Windows, and it will erase every file on
    the hard drive of your computer. So, you have to install Linux Mint, on a dedicated
    computer, which will be used only for Linux Mint!!!'
