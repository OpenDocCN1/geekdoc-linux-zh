    - There is a Search bar, on the open Main Menu. In Search bar, you can type the
    name of an installed application on your computer, it will find it for you.


    ![](image_rsrc28K.jpg)


    # PANEL


    - It is good for you, if you are beginner of Linux, to know how to properly use
    the Panel. Of course, it is good for you to know how to use every part of the
    Linux operating system, but I emphasize the Panel, because like the Desktop, of
    which the Panel is a part of, it is what you will use most of the time, when you
    use your Linux Mint 21.3 Cinnamon computer.


    - If for example you right click with the right mouse button, over the folder
    icon, in the grouped icons on the left side of the Panel, which is the icon for
    the `File Manager`, you will see a menu popup.


    - From that popup menu, you can access various places on your computer, access
    various recent files, or just configure some settings.


    ![](image_rsrc28M.jpg)


    - You can get a preview of an open application window, by just placing the mouse
    pointer, over one of the grouped icons on the left side of the Panel. Do not click
    on the icon, just place the mouse pointer over it, and you will see a little preview
    window, popup. From that little preview window popup, you can also close that
    application, by clicking on the `Close` red button, in the preview window.


    ![](image_rsrc28N.jpg)![](image_rsrc28P.jpg)


    - When you right click with the right mouse button, over an empty space on the
    Panel, you will see a menu popup.


    - From that popup menu, you can move the Panel, on another place on the Desktop,
    you can remove the Panel, and you can add some Applets to the Panel. Also, you
    can configure the Panel, or add a second Panel to the Desktop.


    - Only make sure that first, you click on the Panel edit mode button, in that
    popup menu, so that you can do all those things, mentioned above, with the Panel.


    ![](image_rsrc28R.jpg)


    - The red lines you see, on the edges of the screen, are the places on the Desktop,
    where you can move the Panel to, by dragging with with the mouse pointer, after
    you have enabled the Edit Mode for the Panel. You can move the Panel, by clicking
    on the `Move` option, in the popup menu, mentioned in the previous step.


    ![](image_rsrc28S.jpg)


    - In the following image bellow, you can see that the Panel, has been moved to
    the top edge of the Desktop screen.


    ![](image_rsrc28T.jpg)


    - To see the time and dates, just click on the time icon, shown in the bottom
    right side of the Panel.


    ![](image_rsrc28U.jpg)


    - The Volume can be changed, by clicking on the Volume icon, located at the right
    side of the Panel.


    ![](image_rsrc28V.jpg)


    - The screen brightness, can be adjusted, just by clicking on the Power icon,
    located on the right side of the Panel. From that Power icon, you can also access
    the Power Settings.


    ![](image_rsrc28W.jpg)


    - When you want to pin an application shortcut icon, to the Panel, once you open
    that application, you can see that open application icon, displayed on the Panel.
    The icon is displayed, but not pinned to the Panel yet.


    - To pin that open application shortcut icon, to the Panel, just right click with
    the right mouse button, over that application icon, and then, from the popup menu,
    click on `Pin` option. An example is shown bellow, of `Firefox` browser being
    open, and its shortcut icon, being pinned, to the Panel.


    ![](image_rsrc28X.jpg)


    - But there will be times, when you will want to unpin, an application shortcut
    icon, from the Panel. To do so, right click on the already pinned application
    icon, on the Panel, with the right mouse button, and then, from the popup menu,
    click `Unpin` option.


    ![](image_rsrc28Y.jpg)


    - There is a little space on the very right side of the Panel, which if clicked,
    will hide all opened applications, from the Desktop, so you can see the Desktop.
    If you click on that space, on the right edge of the Panel, all hidden windows,
    will be visible.


    ![](image_rsrc28Z.jpg)


    ## Other Books by the Author


    Click [here](https://www.amazon.com/stores/Deyan-Arnaud/author/B0CS1B4D?ref_=pe_1724030_13299860&isDram=true&shoppingEnabled=true),
    to access the author’s page. If you are interested, you can check some other Linux
    systems e-books, by the author, which are on Amazon.


    ### DEBIAN LINUX 12.4.0

    Why give the Debian Linux system a go, on your computer? Did you know that the
    Debian Linux is one of the oldest, most robust and stable Linux system? If you
    want to learn more about the Debian Linux, click on the following link. [Debian
    Linux 12.4.0 on Amazon](https://www.amazon.com/dp/B0CS4QH95F)


    ### FEDORA LINUX 39

    Fedora Linux 39 is a Linux system, based on the Red Hat Linux. The Red Hat Linux,
    is used by many businesses worldwide, and is one of the popular Linux systems
    used in business. If you want to learn more about the Fedora Linux 39, click on
    the following Amazon link. [Fedora Linux 39 on Amazon](https://www.amazon.com/dp/B0CPW8D94)


    ### UBUNTU LINUX 23.10 CINNAMON FOR BEGINNERS

    One of the very good Linux versions you can try, is the Ubuntu Linux 23.10 Cinnamon.
    If you want to see the tutorial for that, please visit the web link at Amazon.
    [Ubuntu Linux 23.10 Cinnamon on Amazon](https://www.amazon.com/dp/B0CN3RL2CN)


    ### UBUNTU LINUX 23.04 FOR BEGINNERS

    The Ubuntu Linux 23.04 tutorial, will teach you, how to download, install and
    use the Ubuntu Linux 23.04 on your computer. If you would like to check it, visit
    the following web link: [Ubuntu Linux 23.04 on Amazon](https://www.amazon.com/dp/B0CC8BCDX)


    ### FEDORA LINUX 37 WORKSTATION

    This e-book, is about installing, configuring and using the Fedora Linux 37 Workstation.
    You will learn how to install Fedora Linux 37, how to configure various settings
    in the operating system, and how to use the desktop, applications, for your daily
    computing needs. Click on the link bellow, to check it out: [Fedora Linux 37 on
    Amazon](https://www.amazon.com/dp/B0BVD6RHQ3)


    ### UBUNTU LINUX 22.04 LTS

    This e-book, will teach you, how to install, configure and use successfully, the
    Ubuntu Linux 22.04 LTS. Click on the link bellow, to check it out: [Ubuntu Linux
    22.04 LTS on Amazon](https://www.amazon.com/dp/B0BQ1H8Z6Y)


    ### LINUX MINT 21 MATE

    This e-book will teach you how to install, configure and use, the Linux Mint 21
    MATE version. Click on the link bellow, to check it out: [Linux Mint 21 MATE on
    Amazon](https://www.amazon.com/dp/B0BSDV9RXS)


    ### INSTALLING MX LINUX 21.3

    To learn how to quickly and easily, install MX Linux 21.3 on your computer, click
    on the following link: [Installing MX Linux 21.3 KDE on Amazon](https://www.amazon.com/dp/B0BXJX2M7P)


    ### CONFIGURING MX LINUX 21.3 KDE

    If you like to learn, how to configure MX Linux 21.3 KDE, click on the following
    website link: [Configuring MX Linux 21.3 KDE on Amazon](https://www.amazon.com/dp/B0BXM5BZJP)


    ## About the Author


    ![](image_rsrc290.jpg)


    Deyan is a Linux enthusiast, and a qualified Computer Technician, from the United
    Kingdom, and has been installing, configuring, troubleshooting, and using various
    Linux and Windows operating systems, for many years.


    Deyan likes the simplicity, robustness and the effective work of the Linux operating
    system, and has been finding again and again, that the various versions of the
    Linux operating system, although not perfect, and having sometimes their own shortcomings,
    are still one of the best choice, when it comes down to choosing and operating
    system to use, either for a notebook, laptop, or a Desktop computer.


    Deyan has been using the different versions of the Linux operating system, on
    notebooks, laptops and Desktop computers, for a long time, and his own conclusion
    is, that it is worthwhile for any person, even beginners of using Linux, to install
    and use the Linux operating system, on their own computer.

