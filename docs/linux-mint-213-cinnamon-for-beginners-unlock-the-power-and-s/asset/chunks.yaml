  trans: '


    -   现在，在下方的图中，你可以看到窗口右侧有一些绿色指示器，针对`ZK606` 蓝牙设备，这显示你的外部蓝牙设备已连接并正常工作。


    ![](img/image_rsrc1ZM.jpg)


    -   在打开的`Bluetooth Devices（蓝牙设备）窗口中，点击`Device（设备）选项卡。

    -   从下拉菜单中，点击`Audio Profile（音频配置文件）选项。

    -   然后，在打开的子菜单中点击`High Fidelity Playback（高保真播放）选项。这是我推荐的`Audio Profile`选项。


    ![](img/image_rsrc1ZN.jpg)


    -   当你想要移除已配置为与电脑工作的外部蓝牙设备时，只需在打开的`Bluetooth Devices`窗口中点击选择该设备，然后点击像减号一样的`Remove（移除）按钮，该外部蓝牙设备将不再被连接，并且无法再次与你的电脑工作。


    ![](img/image_rsrc1ZP.jpg)


    # 键盘


    -   现在让我们配置电脑键盘。

    -   在打开的`System Settings（系统设置）窗口中，点击`Hardware（硬件）下的`Keyboard（键盘）`图标。


    ![](img/image_rsrc1ZR.jpg)


    -   点击窗口顶部的`Typing（输入）`选项卡。

    -   根据你的喜好，向左或右移动`Key repeat（键重复）`设置的滑块进行调整。


    ![](img/image_rsrc1ZS.jpg)


    -   若要设置键盘布局，点击窗口顶部的`Layouts（布局）`选项卡。


    ![](img/image_rsrc1ZT.jpg)


    -   在`Layout`设置窗口的`Display（显示）`选项中，点击`Panel（面板）`上用于使用国旗的小复选框，以显示当前桌面正在使用哪种键盘布局。这是一个非常实用的功能，因为它让你能够快速切换不同的键盘布局。

    -   若要为电脑添加另一种键盘布局，点击位于窗口左下角的加号。


    ![](img/image_rsrc1ZU.jpg)


    -   在打开的`Choose a Layout（选择布局）`窗口中，选择你喜欢的布局。在接下来的示例中，选择的是法语布局。

    -   点击`Add（添加）`按钮。


    ![](img/image_rsrc1ZV.jpg)![](img/image_rsrc1ZW.jpg)


    -   你可以看到，法语布局已添加到电脑中，你可以开始使用了。

    -   如果你愿意，可以将其他键盘布局设置保持为默认值，它们将是没问题的。


    ![](img/image_rsrc1ZX.jpg)


    -   如果你查看`Panel`的左下角，你会看到法国旗和英国国旗都显示了，这样你可以点击其中任何一个并随时切换布局。


    ![](img/image_rsrc1ZY.jpg)


    -   当你想要从电脑中移除键盘布局时，点击左侧键盘布局列表中显示的某个布局，然后点击左下角的减号。


    ![](img/image_rsrc1ZZ.jpg)


    # 鼠标和触控板


    -   可以通过点击打开的`System Settings`窗口中`Hardware`下的`Mouse and Touchpad（鼠标和触控板）`图标来配置你电脑的鼠标和触控板。


    ![](img/image_rsrc200.jpg)


    -   在打开的`System Settings`窗口中，点击`Mouse（鼠标）`选项卡。

    -   在这一步中，我建议鼠标的唯一两个设置是`pointer speed（指针速度）`和`pointer size（指针大小）`。你可以将其他鼠标设置保持为默认，它们将是没问题的。

    -   在`Pointer size`和`speed`选项下，用鼠标悬停在第一个滑块上并点击拖动向左或右移动。这会让鼠标指针变大或变小。

    -   将第二个滑块向左或右移动以调整鼠标指针的速度，这决定了鼠标指针从电脑的一个地方移动到另一个地方的速度。请查看以下图片。


    ![](img/image_rsrc201.jpg)![](img/image_rsrc202.jpg)![](img/image_rsrc203.jpg)![](img/image_rsrc204.jpg)![](img/image_rsrc205.jpg)


    -   若你想更改双击速度，请在`Double Click（双击）`选项下用鼠标指针向左或右移动滑块。你也可以点击`Double click test（双击测试）`按钮来测试双击计时。


    ![](img/image_rsrc206.jpg)


    -   在这一步中，我们将调整触控板设置。在打开的`System Settings`窗口中点击`Touchpad（触控板）`选项卡。


    ![](img/image_rsrc207.jpg)


    -   点击并启用`General（通用）`下的`Tap to click（点击点击）`选项，以启用触控板点击。


    ![](img/image_rsrc208.jpg)


    -   同样，点击窗口右侧的小白色按钮并启用`Disable the touchpad while typing（打字时禁用触控板）`选项。这是一个实用的功能，因为当你输入文档时，手突然碰触触控板会导致所有文本错乱，这非常烦人。所以，请在`General`下启用该选项。


    ![](img/image_rsrc209.jpg)


    -   对于滚动，我建议使用`two finger scrolling（双指滚动）`选项，因为我个人觉得它很容易且非常方便。

    -   在`Scrolling（滚动）`下，点击`Scrolling method（滚动方式）`字段右侧的下拉菜单，选择`two finger scrolling
    option`。


    ![](img/image_rsrc20A.jpg)


    -   你还可以通过移动`Scrolling`下的滑块向左或右来调整滚动速度。


    ![](img/image_rsrc20B.jpg)


    # 网络


    -   在这一步中，我们将配置你的`Linux Mint 21.3 Cinnamon`网络。配置将主要针对`WiFi`无线网络，因为如果你在家中使用电脑和路由器，`Ethernet（以太网）`连接非常简单易于操作。

    -   在打开的`System Settings`窗口中点击`Network（网络）`图标。


    ![](img/image_rsrc20C.jpg)


    -   点击打开窗口左侧的`WiFi`图标。

    -   你可以看到附近已经有一些可用的 WiFi 无线连接。例如，在接下来的图中，你可以看到 Dani 无线网络。

    -   请记住，`Linux Mint 21.3 Cinnamon`会自动找到并显示范围内的`WiFi`无线网络，包括来自你开启的路由器的 WiFi 连接名称。

    -   确保窗口右侧的 WiFi 无线连接按钮已开启，以便启用无线连接。


    ![](img/image_rsrc20D.jpg)


    -   现在，在这个示例中，我们将查看可用的无线连接`Nedko-71 EXT`是如何配置的。

    -   点击打开窗口左侧列表中的设置小图标，打开`Nedko-71 EXT`无线网络的设置。


    ![](img/image_rsrc20E.jpg)


    -   现在，`Nedko-71 EXT`无线连接的设置窗口已打开。

    -   点击打开窗口左侧列表中的`Details（详情）`，查看无线连接的一些详细信息。


    ![](img/image_rsrc20F.jpg)


    -   点击打开窗口左侧列表中的`Security（安全）`。


    ![](img/image_rsrc20G.jpg)


    -   对于`Security`选项，从下拉菜单点击并选择`WPA & WPA2 Personal`选项。


    ![](img/image_rsrc20H.jpg)


    -   配置配置 WiFi 无线连接密码，点击打开窗口中的`Password（密码）`字段，并输入从运营商提供的无线连接密码。该密码是在路由器设置中配置的。如果你更改了运营商提供的默认无线连接密码，请输入新的无线连接密码。

    -   点击`Apply（应用）`按钮应用新设置。


    ![](img/image_rsrc20J.jpg)


    -   点击打开窗口左侧设置列表中的`Identity（标识）`类别。

    -   对于`SSID`（即你的 WiFi 无线连接的名称），在字段中输入该名称。在此示例中，它是`Nedko-71 EXT`无线连接。

    -   将`Identity`类别的其他设置保持为默认值即可。


    '
- fmt: '

    - Make sure the little two checkboxes, the `Connect automatically`, and `Make
    available to other users`, at the bottom of the window, are selected.

    - Click on the `Apply` button.


    ![](image_rsrc20K.jpg)

    - Do you see the little plus sign, on the bottom left side of the open window?
    That is for adding a new connection to your computer.


    ![](image_rsrc20M.jpg)


    - Again, you can see on the following image bellow, that the `WiFi` wireless connection
    button, must be enabled, in order for your computer to be able to connect to the
    Internet.


    ![](image_rsrc20N.jpg)


    - If you want to use an Ethernet cable connection at home, all you need to do,
    is to just plug one end of the Ethernet cable, in the Ethernet port of your computer
    or laptop, and the other end of the cable, to the Ethernet port of your `rooter`
    device, and you are set. You can start using the Internet straightway. You don
    not need any additional configurations or settings, or any passwords.


    ![](image_rsrc20P.jpg)


    # PRINTERS


    - If you are planning to use a printer, with your Linux Mint 21.3 Cinnamon computer,
    then here in this step, you will learn, how to configure a printer.

    - Click on the `Printers` icon, under `Hardware`, in the open `System Settings`
    window.


    ![](image_rsrc20R.jpg)

    - When the `Printers` window opens, click on the `Add` button, to start configuring
    a printer for your computer.


    ![](image_rsrc20S.jpg)

    - In the `New Printer` open window, click on the `Generic CUPS BRF` option, in
    the list of options.

    - Click on the `Forward` button, to continue.


    ![](image_rsrc20T.jpg)

    - You will a little window popup, and shows you, that your computer is searching
    for a driver, for the printer. A driver is a small piece of software, which enables
    your computer to communicate with your printer, and to use the printer for printing.


    ![](image_rsrc20U.jpg)

    - In the `New Printer` open window, under the `Choose Driver` option, click and
    select the `Select printer from database` option.

    - If you see the name of your printer in the list of printer names displayed,
    click on it to select it. For example, if your printer is `Canon`, click on `Canon`
    in the list, and then click on the `Forward` button.


    ![](image_rsrc20V.jpg)![](image_rsrc20W.jpg)

    - If you know the model of your printer, then click on the name of that model,
    in the list. For example, in the image bellow, you can see that for the `Canon`
    printer, the `BJ-5` is selected.

    - Click on the `Forward` button to continue.


    ![](image_rsrc20X.jpg)

    - Type the name of the printer, in the `Printer Name` field available, and then
    click on the `Apply` button.


    ![](image_rsrc20Y.jpg)

    - If a printer test option appears in a small window, click on the `Print Test
    Page` button, to see how your freshly installed printer is working. Do not worry,
    it is not going to use a lot of printer ink. It is a good feature, because will
    show you, if your printer is ready for printing or not.


    ![](image_rsrc20Z.jpg)

    - A small window will show you, that the test page task, has been submitted to
    the printer for printing.


    ![](image_rsrc210.jpg)

    - In the `Printers` open window, you can see that the `Canon` printer, in the
    example given here, in this tutorial, has been installed successfully, and its
    icon appears, in the `Printers` window.


    ![](image_rsrc211.jpg)

    - Let us now see, some of the properties, of the newly installed printer.

    - Click on the `Printer` tab, in the open `Printers` window.


    ![](image_rsrc212.jpg)

    - Click on the `Properties` option, in the opened menu.


    ![](image_rsrc213.jpg)

    - When the `Printer Properties` window is open, click on the `Printer` option,
    in the list on the left side of the window.

    - For the `Page size` option, you can click on the drop down menu, and chose the
    size of the printed page. For example given here, it is the `A4` size.

    - Then, for the `Resolution` option in the window, click on the drop down menu,
    and chose the printing resolution you prefer. Bear in mind, that if you chose
    a higher number printing resolution, your printed text or photo, will be a better
    quality, but also, at the same time, more printer ink will be used from the printer,
    for printing that text or photo.

    - Click on the `OK` button.

    - Look at the following few images bellow, about adjusting the paper size and
    the resolution for printing.


    ![](image_rsrc214.jpg)![](image_rsrc215.jpg)![](image_rsrc216.jpg)

    - In the open `Printer Properties` window, click on the `Settings` option, located
    at the top left side of the open window.


    ![](image_rsrc217.jpg)

    - When you try to print a page, on your printer, a little printer icon will appear,
    on the bottom right of the Panel. If you click on that printer icon, you can navigate
    to, and see the printing jobs, and you can cancel all printing jobs too, from
    that printer icon, if you wish to do so.


    ![](image_rsrc21D.jpg)

    - You can also see, by clicking on the little printer icon, in the Panel, that
    the Test Page printing job, which we did earlier, in this tutorial, is also shown,
    in the menu.

    - If a little window appears, asking you to continue or cancel the Test Page printing,
    you can chose what you want to do, cancel the printing job, or carry on printing
    the page.


    ![](image_rsrc21E.jpg)

    - If you click on the `Canon Printer` option, in this example here, in the popup
    menu, when you click on the little printer icon, in the Panel, you can see the
    current print jobs.


    ![](image_rsrc21G.jpg)

    - A new Document Print Status window appears, which is a window showing you, the
    current printer jobs, that is, the documents like text or photos being printed
    now. For example, on the following image bellow, you can see that the printing
    job, for the Test Page we did earlier, is shown in the window, as a current print
    job.

    - If you right click, with the right mouse button, on the print job visible, in
    the Document Print Status open window, in this example, the Test Page job, you
    will see a menu appear. From that menu, you can cancel that Test Page printing
    job, by clicking on the `Cancel` option, in the menu.


    ![](image_rsrc21H.jpg)

