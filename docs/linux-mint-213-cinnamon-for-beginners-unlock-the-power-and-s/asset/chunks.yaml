    PANEL


    ● Let us now configure the Panel, in this step. What is the Panel you may wonder?
    Well, that is the bar you see displayed on the bottom of your desktop screen.


    ●       Click on the Panel icon, under Preferences, in the open System Settings
    window.


    ![](image_rsrc23T.jpg)


    ● Under the Panel Visibility, in the Auto hide panel field, click on the drop
    down menu on the right side of the window, and select, what you want to happen
    to the Panel, when you are using your computer. I would suggest that you choose
    the Auto hide panel option, because, the Panel will disappear from your screen,
    when you do not need to use it, and than means more space available on your screen,
    for other open applications, to be displayed. Another option is to always show
    the Panel, but again, the Panel will take space on your screen, and will be less
    space, for the applications windows, to be displayed.


    ![](image_rsrc23U.jpg)


    ● Under the Customize option, move the slider to the left or right side, to adjust
    the height of the Panel, according to how high you want the Panel to be.


    ![](image_rsrc23V.jpg)


    ● Under the Panel appearance option, in the Symbolic icon size (px) field, click
    on the plus or minus signs, on the right side of the window, to adjust the size
    of the icons, which will appear on the Panel.


    ![](image_rsrc23W.jpg)


    ●       Under the General Panel Options, click on the Panel edit mode button.


    ![](image_rsrc23X.jpg)


    ● When the Panel is in the Edit mode, you will be able to move things on the Panel,
    and adjust them from one place on the Panel, to another. For example, click with
    the mouse pointer on the time icon, on the bottom right side of the Panel, and
    hold the left mouse button, after you have clicked on the time icon. Now, drag
    the time icon on the Panel, towards the left side of the Panel, to move it towards
    the left side on the Panel.


    ![](image_rsrc23Y.jpg)


    ● On the following image bellow, you can see that the time icon has been moved
    to another location on the Panel.


    ![](image_rsrc23Z.jpg)


    ● Under the General Panel Options, click on the Add new panel button, if you want
    to add another Panel to your Desktop. Bear in mind, the Panel has to still be
    in the Edit mode!


    ![](image_rsrc240.jpg)


    ● Now you see, four thick red lines, being displayed, at the four edges of the
    screen. Those four red lines, are where you can chose to place the new second
    Panel you want to have. For example, if you click with the mouse pointer on the
    top red line, that is the location, where the second new Panel, will be displayed.


    ![](image_rsrc241.jpg)


    ● You can see on the following image bellow, that the new second Panel, has now
    positioned, on the top of the screen. That is the wide black line you see on the
    top of the screen.


    ![](image_rsrc242.jpg)


    ● You can remove the second new Panel you have created, from the top of the screen,
    if you right click, with the right mouse button over the top Panel.


    ● From the menu which appears, you can click on the Applets option, if you want
    to add some Applets to that new second Panel.


    ● From the menu that appears, you can also remove the second new Panel, by clicking
    on the Remove option, in the menu.


    ● In that menu displayed, there is an option to configure the new second Panel,
    by clicking on the Panel settings option, in the menu.


    ![](image_rsrc243.jpg)


    ● There is actually a troubleshooting option, for the Panel, if you want to restore
    the Panel to its default settings for example. But, it is not limited only to
    the restoring of the default Panel settings, but you can restart the Cinnamon
    desktop environment too.


    ● Click with the right mouse button, over an empty space on the Panel. From the
    menu which appears, click on the Troubleshoot option.


    ![](image_rsrc244.jpg)


    ● Click on the Restart Cinnamon option, in the menu. That will restart the Cinnamon
    desktop, and in some cases, that is a type of troubleshooting.


    ![](image_rsrc245.jpg)'
