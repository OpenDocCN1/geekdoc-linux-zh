    INTRODUCTION


    Welcome to the Linux Mint 21.3 Cinnamon operating system tutorial!


    If you have ever considered before, to give the Linux operating system a go, on
    your computer, you have been thinking about something very good and useful!


    If you are someone, who has been using the Micro$oft Windows operating system,
    for some time, perhaps for years, and have decided to swap to Linux, you are going
    in the right direction. Why? Because using Linux on your computer, instead of
    Windows, has many benefits like:


    ●       Linux is a free of charge to download and use


    ●       Linux is a stable and secure operating system


    ● You can do on Linux all those most common computer tasks like, browsing the
    Internet, watching YouTube videos, listening to music, playing games, watching
    your own videos, manipulating and browsing photos, typing and printing text documents,
    Email, and much more…


    ● Linux Mint comes with more than 60 000 free applications, waiting for you to
    download them and use them on your computer.


    ● Linux Mint is one of the most popular and most used Linux operating system in
    the world.


    ● Linux is nearly free from viruses, so you will not be worrying about a virus
    on you computer, and you do not even need to install an antivirus application,
    on your computer. The author of this tutorial has been using Linux for many, many
    years, various Linux versions, and he never needed to install an antivirus application,
    on his computer, and during all those years, he never had any virus, on his Linux
    computers, as much as he is aware.


    ● Linux Mint is based on the Ubuntu Linux, another most popular operating system
    in the world, which is used, in businesses and at home.


    Linux Mint is easy to use, even if you are a beginner of Linux, especially, if
    you have already been using, the Micro$oft Windows operating system.


    INSTALLATION PART 1


    Making a bootable flash drive. You may be wondering, what is a bootable USB flash
    drive? Well, it is an USB empty disk, which needs to be with about 4 GB of empty
    space on it, which we will use, to download from the Internet Linux Mint 21.3
    Cinnamon, and install that downloaded Linux Mint 21.3 Cinnamon file, on the USB
    flash drive, so that we can latter, plug that bootable USB flash drive with the
    downloaded Linux Mint 21.3 Cinnamon on it, and install Linux Mint 21.3 Cinnamon,
    from that USB flash drive, on the computer, which we have prepared already, to
    install Linux Mint 21.3 Cinnamon on that computer.


    Do not worry, if you think it is difficult to do that! If you follow all the steps
    here, which I describe in this tutorial, then you will be able to download Linux
    Mint 21.3 Cinnamon and install it on your computer, in no time!


    Refer to Part 2 of the Installation process, which is described, latter on, in
    this tutorial….


    CONFIGURATION


    ● Let us start the Linux Mint 21.3 Cinnamon configuration, by opening the System
    Settings window.


    ● Click on the Main Menu icon, located at the bottom left side of the screen.


    ● Once the Main Menu is opened, click on the Preferences category. Then, click
    on the System Settings icon, in the opened sub-menu.


    ![](image_rsrc1Y6.jpg)


    APPEARANCE


    BACKGROUNDS


    ● First, let us configure the background of your computer desktop. To do that,
    click on Backgrounds icon, in the opened System Settings window, under the Appearance
    category.


    ![](image_rsrc1Y7.jpg)


    ●       Click on the Images tab, in the open window.


    ● Click on Linux Mint option, in the list of image options on the left side of
    the window.


    ● Click on one of the background images displayed in the open System Settings
    window.


    ![](image_rsrc1Y8.jpg)![](image_rsrc1Y9.jpg)


    ● Click on the Settings tab, in the open System Settings window, where you can
    adjust some background settings.


    ● Under the Background Settings, click on the little white button on the right
    side of the window, in the Play backgrounds as a slideshow field, if you want,
    a few backgrounds, to change automatically on your screen, after a certain period
    of time.


    ● For the Picture aspect field, you can chose the Zoom option, from the drop down
    list. That is about how the background will look like, when it is applied to your
    desktop.


    ![](image_rsrc1YA.jpg)![](image_rsrc1YB.jpg)


    ● You can also add a new folder of pictures, by clicking on the plus button, on
    the bottom left side of the screen.


    ![](image_rsrc1YC.jpg)


    ● Navigate to the folder with pictures, in order to add those additional background
    images, to the collection.


    ![](image_rsrc1YD.jpg)


    THEMES


    ● Now, let us configure some of the desktop themes, for your Linux Mint 21.3 Cinnamon
    computer.


    ● Click on the Themes icon, under the Appearance category, in the open System
    Settings window.


    ![](image_rsrc1YE.jpg)


    ●       Click on the Themes tab, in the open window.


    ![](image_rsrc1YF.jpg)


    ● In the Mouse Pointer field, click on the button on the right side of the window,
    and select a mouse pointer, which you like, from the mouse pointers displayed.


