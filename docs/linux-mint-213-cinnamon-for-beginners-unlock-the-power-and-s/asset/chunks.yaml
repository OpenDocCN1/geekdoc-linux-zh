    # 每当你打开电脑电源时，它都会进入登录窗口，你需要在那里输入用户名和密码。但是这个登录窗口看起来是什么样的，上面显示了，完全是另一回事。让我们为您配置它。


    ## 登录窗口配置


    - 在打开的`System Settings`系统设置窗口中，点击`Administration`管理下的`Login Window`登录窗口图标。


    ![](img/image_rsrc24V.jpg)


    - 如果你看到出现一个`Authentication`身份验证小窗口，这意味着已经设置了一个`User Account`用户账户，那是关于`Administration`账户的，即你电脑上的`Administrator`管理员。通常情况下，你作为电脑的所有者将成为`Administrator`管理员。因此，你必须输入`Administrator
    User Account`密码才能继续。


    - 这并不意味着你一定会看到那个`Authentication`窗口出现，这完全取决于是否已经配置了`Administrator`账户。


    ![](img/image_rsrc24W.jpg)


    - 在`Login Window`登录窗口设置中，点击`Appearance`外观选项卡。


    - 在`General`通用下，点击窗口右侧`Alignment`对齐字段中的下拉菜单，并选择你希望登录界面位于屏幕的哪个位置。


    ![](img/image_rsrc24X.jpg)


    - 你可以在下方的图中看到，可以将登录窗口对齐在中间、左侧或右侧。


    ![](img/image_rsrc24Y.jpg)


    - 在`Background`背景下，点击右侧的背景按钮，并选择你喜欢的背景。


    ![](img/image_rsrc24Z.jpg)


    - 导航到你电脑上的背景图片，并选择你喜欢的背景。如果你电脑上已经有了任何图片，可以使用它们中的任何一张来作为背景。


    ![](img/image_rsrc250.jpg)


    - 如果你的电脑上已经配置了几个用户，每当有任何用户来到登录窗口并尝试登录时，都会显示该用户的背景图片。但是，为了启用此选项，你必须点击`Backgrounds`背景下、窗口右侧`Draw
    user backgrounds`绘制用户背景字段中的白色小按钮。


    ![](img/image_rsrc251.jpg)


    - 现在，让我们为登录窗口选择一些主题。要做到这一点，点击打开窗口中`Themes`主题下`GTK theme`字段中的下拉菜单。


    ![](img/image_rsrc252.jpg)


    - 从带有各种可用主题的下拉菜单中，点击并选择你喜喜主题。


    ![](img/image_rsrc253.jpg)


    - 对于登录窗口中使用的图标主题，点击`Themes`主题下`Icon theme`图标主题字段中的下拉菜单。


    ![](img/image_rsrc254.jpg)


    - 点击下拉菜单中任何可选图标主题。


    ![](img/image_rsrc255.jpg)


    - 下一步是选择登录窗口的鼠标指针主题。要做到这一点，点击`Themes`主题下`Mouse pointer`鼠标指针字段中的下拉菜单。


    ![](img/image_rsrc256.jpg)


    - 从`Themes`主题下`Mouse pointer`鼠标指针字段的下拉菜单中选择一个鼠标指针主题。


    ![](img/image_rsrc257.jpg)


    - 让我们配置登录窗口的鼠标指针大小。要做到这一点，点击`Mouse pointer size`鼠标指针大小字段中的滑块，在点击并按住鼠标按钮的同时，向左或向右拖动滑块，确定你喜欢的指针大小。


    ![](img/image_rsrc258.jpg)


    ## 用户设置


    - 现在让我们配置一些用户设置，即你电脑的用户。要做到这一点，点击打开窗口中的`Users`用户选项卡。


    ![](img/image_rsrc259.jpg)


    - 在`User list`用户列表下，点击右侧`Allow manual login`允许手动登录字段中的白色小按钮。该选项会在你电脑的任何用户想要登录并使用电脑时向他们询问密码。登录电脑的另一种替代方案是自动登录，如果禁用了手动登录，则可以使用自动登录。因此，为了你电脑的安全性，请启用手动登录。![](img/image_rsrc25A.jpg)


    - 在`Guest sessions`访客会下，点击窗口右侧`Allow guest sessions`允许访客会字段中的白色小按钮。这是`Linux Mint
    21.3 Cinnamon`中一个非常好的功能，因为它允许任何其他想使用你的电脑上网或执行其他电脑任务的人这样做。不要担心，使用你电脑的访客用户无法查看或浏览你电脑上的文件和文件夹，因为
    Linux 会自动保护它们，所以你电脑的访客无法对你电脑自己的文件和文件夹进行任何操作。


    ![](img/image_rsrc25B.jpg)


    - 如果你想开启电脑的自动登录，可以在`Automatic login`自动登录选项下的字段中输入该特定用户的用户名和密码。


    ![](img/image_rsrc25C.jpg)


    ## 其他设置


    - 让我们为登录窗口配置其他额外设置。


    - 点击`Settings`设置选项卡。


    - 在`Panel indicators`面板指示下，点击窗口右侧`Allow manual login`允许手动登录字段中的白色小按钮。该选项会在你电脑的任何用户想要登录并使用电脑时向他们询问密码。登录电脑的另一种替代方案是自动登录，如果禁用了手动登录，则可以使用自动登录。因此，为了你电脑的安全性，请启用手动登录。![](img/image_rsrc25D.jpg)


    - 可以点击每个功能的白色小按钮来查看登录窗口上的可用功能。如果你希望登录窗口中显示时钟，点击`Panel indicators`面板指示下`Clock`时钟字段的白色小按钮![](img/image_rsrc25D.jpg)(image_rsrc25E.jpg)


    ### 用户与组


    - 在教程的这部分，我们将配置将使用你电脑的用户。


    - 在打开的`System Settings`系统设置窗口中，点击`Administration`管理下的`Users and Groups`图标。


    ![](img/image_rsrc25F.jpg)


    - 首先，我将向你展示如何更改或配置已添加到电脑的用户设置。在教程稍后的部分，我将向你展示如何添加新用户。


    - 现在，当`Users and Groups`窗口打开时（此处示例），你可以看到名为`Deyan`的用户已添加到电脑中，该用户的名称出现在打开的`Users
    and Groups`窗口中。这里为用户`Deyan`提供的设置仅作为示例，让你看到如何配置或更改电脑上已存在的用户。


    - 在打开窗口的`Users`用户选项卡下点击用户`Deyan`。


    - 在窗口右侧，你将看到更改该用户图片的选项。那就是`Picture`图片选项。![](img/image_rsrc25G.jpg)


    - 点击窗口中的`Picture`图片选项以更改用户图片。![](img/image_rsrc25H.jpg)


    - 从图片下拉列表的可用图片中，点击并选择你喜欢的图片。如果你想使用自己的照片而不是可用图片，请点击`Browse for more pictures`浏览更多图片按钮…


    ![](img/image_rsrc25J.jpg)


