    Just scroll down in the sub-menu, to see all of them.


    ![](image_rsrc284.jpg)


    ● Now, there is a folder category shortcut, in the Main Menu, called Places. When
    you click on that folder looking icon, in the Main Menu, you will see in the sub-menu,
    shortcuts to the various places on your computer, like the Documents folder, the
    Music folder, Pictures folder, the Home folder, and other places.


    ● Open the Main Menu, and click on the Places category shortcut, and look at the
    various places on your computer, in the sub-menu.


    ![](image_rsrc285.jpg)


    ● In this step, we will look into how to place an application shortcut, on the
    Panel. Remember the Panel is that bar, at the bottom of your desktop, on which
    are places various applications shortcut, the Task Bar, and others.


    ● Let us say for example, that you want to place a shortcut, of your Email application,
    called Thunderbird Mail, on the Panel.


    ●       Click on the Main Menu to open it.


    ●       Click on the Internet applications category, in the Main Menu.


    ● In the sub-menu, right click with the right mouse button, on the Thunderbird
    Mail application shortcut.


    ●       From the drop down menu, click on the Add to panel option.


    ![](image_rsrc286.jpg)![](image_rsrc287.jpg)


    ● Now, if you look at the left side, of the Panel, you will the Thunderbird Mail
    shortcut, which is ready to be clicked, and to open the Thunderbird Mail application.


    ![](image_rsrc288.jpg)


    ● There are a few grouped together, applications shortcuts, on the left side of
    the Panel. If you want to remove those grouped together applications shortcuts
    from the Panel, right click with the right mouse button, over those grouped applications
    icons shortcuts.


    ● From the popup menu, click on the Remove ‘Grouped window list’ option. That
    will remove all those grouped together applications icons, from the Panel.


    ![](image_rsrc289.jpg)


    ● You now know how to add an application shortcut, to the Panel. But what if you
    want to add an application shortcut, to the Desktop? This step will show you to
    do, exactly that.


    ●       Click on the Main Menu to open it.


    ●       Click on the Internet applications category.


    ● Right click with the right mouse button, over the Thunderbird Mail icon, in
    the sub-menu of all the Internet applications.


    ●       Click on the Add to desktop option, in the drop down menu.


    ![](image_rsrc28A.jpg)


    ● Now you can see, that the Thunderbird Mail shortcut icon, has been added to
    the Desktop.


    ![](image_rsrc28B.jpg)


    ● You can remove the Thunderbird Mail shortcut, from the Desktop, by right clicking,
    with the right mouse button, over the icon, and then, from the drop down menu,
    click on the Move to Trash option.


    ![](image_rsrc28C.jpg)


    ● And of course, you can add the Thunderbird Mail shortcut icon, to the Favorites.


    ●       To do that, click on the Main Menu, to open it.


    ●       Click on the Internet applications category.


    ● In the sub-menu, right click on the Thunderbird Mail icon, with the right mouse
    button.


    ●       From the drop down menu, click on the Add to Favorites option.


    ![](image_rsrc28D.jpg)


    ● Now the Thunderbird Mail shortcut icon, has been added, to the Favorites section,
    of the Main Menu.


    ![](image_rsrc28E.jpg)


    ● When you want to remove the Thunderbird Mail shortcut icon, from the Favorites
    section, just right click with the right mouse button, over the Thunderbird Mail
    icon, in the sub-menu, of the Internet applications category, and then, from the
    drop down menu, click on the Remove from Favorites option.


    ![](image_rsrc28F.jpg)


    ● There may be times, when you want to write some text document. To do that, Linux
    Mint 21.3 Cinnamon, gives you the LibreOffice Writer application, which will do
    all those common things, you want to do, when you type documents.


    ●       Click on the Main Menu to open it.


    ●       Click on the Office applications category, in the Main Menu.


    ●       Click on the LibreOffice Writer application shortcut.


    ![](image_rsrc28G.jpg)


    ● For listening to music, you can use the Rhythmbox application, which comes by
    default, with the Linux Mint 21.3 Cinnamon.


    ● To open and use the Rhythmbox application, click on the Main Menu to open it.


    ●       Click on the Sound & Video applications category, in the Main Menu.


    ●       From the open sub-menu, click on the Rhythmbox application shortcut.


    ![](image_rsrc28H.jpg)


    ● Let us say, you have stored some photos on your Linux Mint computer, and now
    you want to browse and see those photos. To do so, you can use the Pix application.


    ●       To open the Pix application, click on the Main Menu, to open it.


    ●       Click on the Graphics applications category, in the Main Menu.


    ● Click on the the Pix applications shortcut, in the open sub-menu, to open the
    application.


    ![](image_rsrc28J.jpg)'
