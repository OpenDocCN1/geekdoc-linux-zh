  trans: "\n\n- 另一种取消测试页面打印任务的方法，是点击打开窗口中显示的打印任务，然后点击位于打开窗口顶部的“取消已选任务”红色按钮。\n\n![](img/image_rsrc21J.jpg)!(image_rsrc21K.jpg)\n\
    \n- 但可能存在一种情况，你只是想重新打印之前执行过的同一个打印任务，例如测试页面任务。你所做的仅仅是在“文档打印状态”打开窗口中选择该打印任务，然后点击窗口顶部的绿色箭头，这即是“重新打印已选任务”选项。这将再次打印该打印任务。\n\
    \n![](img/image_rsrc21M.jpg)\n\n# 电源管理\n\n- 为了让你的电脑高效运行，我们必须配置电源管理。\n\n- 在打开的“系统设置”窗口中，点击电源管理图标。\n\
    \n![](img/image_rsrc21N.jpg)\n\n- 在“系统设置”窗口中，点击 `Power` 选项卡。\n\n![](img/image_rsrc21P.jpg)\n\
    \n- 我们要配置的第一个设置是关于在电脑闲置一段时间后关闭显示器。\n\n- 在“电源选项”下，点击窗口右侧 A/C 电源对应的 `Turn off the\
    \ screen when inactive for` 字段的下拉菜单。\n\n![](img/image_rsrc21R.jpg)\n\n- 从下拉菜单中，以分钟为单位选择你希望电脑在闲置特定时间后，多少分钟后自动关闭显示器。\n\
    \n![](img/image_rsrc21S.jpg)\n\n- 现在我们将配置电脑在没有没有活动时，多少分钟后自动进入挂起（Suspend）模式。\n\n\
    - 在“电源选项”下，点击 `Suspend when inactive for` 字段的下拉菜单，并选择在电脑自动进入 `Suspend` 模式之前必须经过的分钟数。这仍然适用于\
    \ A/C 电源选项。\n\n![](img/image_rsrc21T.jpg)!(image_rsrc21U.jpg)\n\n- 在这一步中，我们将配置每次关闭笔记本电脑盖子时会发生什么。\n\
    \n- 同样在“电源选项”下，点击 `When the lid is closed` 字段的下拉菜单，并选择电脑应该做什么。这仍然属于 A/C 电源设置。你可以选择在盖子关闭时让电脑\
    \ `Shut Down`（关机）、`Suspend`（挂起）或 `Lock Screen`（锁定屏幕）。\n\n![](img/image_rsrc21V.jpg)!(image_rsrc21W.jpg)\n\
    \n- 直到现在，我们配置的是电脑在使用 A/C 电源工作时的电源设置。但现在，我们将配置笔记本电脑及其电源管理设置，以便在笔记本仅使用电池供电运行时。\n\
    \n- 在 `On battery power` 设置下，点击 `Turn off the screen when inactive for` 字段的下拉菜单，并选择在电脑没有活动时，多少分钟后笔记本屏幕将自动关闭。\n\
    \n![](img/image_rsrc21X.jpg)!(image_rsrc21Y.jpg)\n\n- 现在让我们设置在笔记本电脑进入挂起模式之前的闲置时间。要为此，在“电源选项”的\
    \ `On battery power` 设置下，点击 `Suspend when inactive for` 字段的下拉菜单，并选择你希望笔记本做什么。选择你希望笔记本自动进入\
    \ `Suspend` 模式之前的闲置时间。或者，如果你愿意，也可以选择让笔记本从不（never）自动进入 `Suspend` 模式。\n\n![](img/image_rsrc21Z.jpg)!(image_rsrc220.jpg)\n\
    \n- 现在，让我们调整每次关闭笔记本盖子时笔记本电脑会发生什么。\n\n- 在“电源选项”的 `On the battery power` 下，点击 `When\
    \ the lid is closed` 字段的下拉菜单，根据你想要让它进入 `Suspend` 模式、`Shut down immediately`（立即关机）模式或仅仅\
    \ `Lock Screen`（锁定屏幕）模式来选择。\n\n![](img/image_rsrc221.jpg)!(image_rsrc222.jpg)\n\
    \n- 在“额外选项”下，点击 `When the power button is pressed` 字段的下拉菜单，设置每次按下笔记本电源按钮时会发生什么。你可以选择\
    \ `Shut down immediately` 选项、`Suspend` 模式或仅 `Screen Lock`（锁定屏幕）选项。此外，你也可以从下拉菜单中选择\
    \ `Ask`（询问），，如果你希望弹出一个小窗口并提供关于笔记本及其各种电源选项的操作选择。\n\n![](img/image_rsrc223.jpg)\n\
    \n- 在这一步中，我们将设置每次笔记本电池电量极低时会发生什么。\n\n- 在“额外选项”下，点击 `When the battery is critically\
    \ low` 字段的下拉菜单，并选择发生什么，是电脑进入 `Shut down immediately` 模式，还是什么都不做。\n\n![](img/image_rsrc224.jpg)\n\
    \n- 笔记本显示器运行需要大量电量。因此，当你离开笔记本一段时间时，让屏幕亮度自动调节是一个好主意。\n\n- 移动 `Brightness` 滑块来调整屏幕亮度。\n\
    \n![](img/image_rsrc225.jpg)!(image_rsrc226.jpg)\n\n- 在 `Brightness` 选项下，点击 `Dim\
    \ screen when` 字段的下拉菜单，选择百分比。\n\n![](img/image_rsrc227.jpg)!(image_rsrc228.jpg)\n\
    \n- 最后选项是在闲置一段时间后调暗屏幕。点击 `Dim screen after for` 字段的下拉菜单，选择时间。\n\n![](img/image_rsrc22A.jpg)\n\
    \n# \n\n- 没有声音的电脑完全无法工作……让我们在这一步中配置 Linux Mint 21.3 的声音。\n\n- 在“系统设置”窗口中，点击 `Hardware`\
    \ 下的声音图标。\n\n![](img/image_rsrc22B.jpg)\n\n- 在打开的“系统设置”窗口中，点击 `Output` 选项卡。\n\n\
    ![](img/image_rsrc22C.jpg)\n\n- 在设备设置下，确保下拉菜单中选择了 `Analog Stereo Output`，这位于 `Output\
    \ profile` 中。\n\n- 对于输出设备，你可以在此示例中看到内置音频已被使用并配置。但是，如果你计划使用某些外部音频设备（例如耳机），一旦将它们插入电脑，它们的图标也会出现在此设置窗口中。\n\
    \n- 在这一步中，你还可以通过向左或向右移动音量平衡滑块来调整音量水平和平衡。\n\n- `Test sound` 按钮可以测试你的声音配置，并查看电脑声音是否正常工作。\n\
    \n![](img/image_rsrc22D.jpg)\n\n- 点击 `Input` 选项卡，配置你将在电脑上使用的任何麦克风。\n\n- 在此示例的\
    \ Device 下，你可以看到笔记本内置麦克风已配置并使用。但是，如果你将外部麦克风插入电脑，你会在 Device 下也看到它的图标。\n\n- 你可以通过向左或向右移动滑块来调整输入设备的音量。\n\
    \n- `Input Level` 指示器将向你展示麦克风是否正在工作，以及它检测到任何外部声音的水平。\n\n![](img/image_rsrc22E.jpg)!(image_rsrc22F.jpg)\n\
    \n"
- fmt: '

    # Sounds


    - There is another set of sounds we can configure, in the Linux Mint 21.3 Cinnamon
    computer, and those are the system sounds. In other words, the system sounds are
    not used when you listen to music for example, but are the sounds which are triggered,
    when you do some system and application tasks on your computer, like opening a
    new application window, for example.


    - The sounds volume, for the system sounds, can be adjusted, by moving the slider
    to left or right, with the mouse pointer, under the `Sounds Volume` field.


    - Under the `Sounds` field, you can use the little white buttons on the right
    side of each field, to enable or disable that particular sound, on your computer.
    For example, you can enable or disable the `Starting Cinnamon` sound, by switching
    on or off, the little button on the right side of the window.


    ![](image_rsrc22G.jpg)![](image_rsrc22H.jpg)![](image_rsrc22J.jpg)


    - Next, click on the `Applications` tab.


    - Under `Applications` option, move the slider to left or right, to adjust the
    sound volume, for that particular application, displayed here, in this window.


    - Any time you open and use an application, on your computer, if that application
    is capable of playing sounds on your computer, you will see that application and
    its volume slider, displayed here, in this window. For example, you can see that
    the volume for the `Firefox` Internet browser, is shown and displayed here. That
    is because that `Firefox` browser has been playing some videos or music, on the
    Internet.


    ![](image_rsrc22K.jpg)![](image_rsrc22M.jpg)


    - There are some additional sound settings, which we are going to configure now.


    - Click on the `Settings` tab, in the open `System Settings` window, under `Sounds`.


    - What you see on the following image bellow, is about sound amplification.


    - Now, you can see that there is a slider which you can move to the left or right
    side, for adjusting the sound amplification, but I want to warn you, that if you
    move that slider, over the `100%`, the sound of your computer could become distorted
    and very unpleasant to listen to. So, I would suggest, that you do not move that
    amplification slider, over the `100%`.


    ![](image_rsrc22N.jpg)


    # PREFERENCES


    ## ACCOUNT DETAILS


    - Here in this step, I am going to show you briefly, how to change the password,
    of your Linux Mint 21.3 Cinnamon computer account, once a user account, has already
    been set.


    - Under the `Preferences` category, in the open `System Settings` window, click
    on the `Account details` icon.


    ![](image_rsrc22P.jpg)


    - Once the `Account details` settings have been opened, you can click and change
    the picture of your account if you want to, by clicking on the picture square,
    on the right side of the open window, in the `Picture` field.


    - To change the password for your account, click on the `Password` field, and
    you will see a little window appear.


    - Type your current account login password.


    - Type twice, your new chosen account password, in the fields available.


    - Click on the `Change` button.


    ![](image_rsrc22R.jpg)


    ## APPLETS


    - There are some programs in the Linux Mint 21.3 Cinnamon, called `Applets`. They
    are like additional applications, which you can configure and use, by placing
    their shortcuts, to the `Panel`.


    - To start configuring and using some Applets, click on the `Applets` icon, under
    `Preferences`, in the `System Settings` open window.


    ![](image_rsrc22S.jpg)


    - Once the `Applets` window is opened, click on the `Manage` tab.


    - In this step here, I will show you how to configure the `Expo` applet, and that
    will just be for an example.


    - In the list of `Applets` displayed, click on `Expo` to select it.


    ![](image_rsrc22T.jpg)


    - Once you have clicked and selected the `Expo` applet in the list, click on the
    plus sign, located at the bottom of the window, to add the `Expo`, and its shortcut,
    to the `Panel`.


    ![](image_rsrc22U.jpg)


    - Now you can see that the `Expo` applet shortcut, is added to the `Panel`.


    ![](image_rsrc22V.jpg)


    - When you want to remove any of the Applets, and its shortcut from the `Panel`,
    just click on the `Manage` tab in the open window, and then, click that particular
    applet you want to remove, in the list of `Applets`, to select it. In the example
    here, I am showing you how to remove the `Expo` applet shortcut, from the `Panel`.


    - Click and select the `Expo` applet in the list.


    - Click on the minus sign located at the bottom of the open window. That will
    remove the `Expo` applet shortcut, from the `Panel`.


    ![](image_rsrc22W.jpg)![](image_rsrc22X.jpg)


    - But let us say, you want to completely remove one of the Applets, from your
    computer. To do that, click the particular applet, and then click on `Uninstall`
    button.


    ![](image_rsrc22Y.jpg)


    - But what if the Applets already, on your computer, are not enough for you and
    you want some? Well, you can get more. Click on the `Download` tab, in the open
    window.


    ![](image_rsrc22Z.jpg)


    - Select one particular applet from the list, which you want to download and install
    on your computer.


    - Click on the `Install` button, located at the right side of the window, to download
    and install that particular applet, to your computer.


    ![](image_rsrc230.jpg)


    - But if you want to configure some of the Applets, click and select an applet
    in the list, which you want to configure. Then, click on the `Configure` button,
    located at the right side of the window.


    ![](image_rsrc231.jpg)![](image_rsrc232.jpg)


    # DESKLETS


    - And now, we are going to configure another type of additional applications,
    called `Desklets`. Desklets are like the Applets, but when you configure them,
    they will place their shortcuts, on the `Desktop`.


    - Under `Preferences`, in the open `System Settings` window, click on the `Desklets`
    icon.


    ![](image_rsrc234.jpg)


    - Click on the `Manage` tab.


    ![](image_rsrc235.jpg)


    - In this example here, we are going to configure the `Clock` desklet. So, click
    on the `Clock` desklet in the list, to select it.


    - Then, click on the plus sign, located at the bottom of the window, to add the
    `Clock` desklet to the `Desktop`.


    ![](image_rsrc236.jpg)


    - Now you can see that the `Clock` desklet, has been added to the `Desktop`.


    ![](image_rsrc237.jpg)


    - To remove the `Clock` desklet from the `Desktop`, select the `Clock` desklet
    in the list of `Desklets` displayed, and then, click on the minus sign, located
    at the bottom of the window. That will remove the `Clock` desklet, from the `Desktop`.


    ![](image_rsrc238.jpg)


    - If you want to configure some of the Desklets, click and select a desklet in
    the list, which you want to configure. Then, click on the `Configure` button,
    located at the right side of the window. In this example given here, it is the
    `Clock` desklet, which has been configured.


    ![](image_rsrc239.jpg)


    - In the case when you want to add more Desklets to your computer, instead of
    using the already installed Desklets, you can click on the `Download` tab, in
    the open window.


    ![](image_rsrc23B.jpg)


    - Select one particular desklet from the list, which you want to download and
    install on your computer.


    - Click on the `Install` button, located at the right side of the window, to download
    and install that particular desklet, to your computer.


    ![](image_rsrc23C.jpg)

