    ![](image_rsrc22P.jpg)


    ● Once the Account details settings have been opened, you can click and change
    the picture of your account if you want to, by clicking on the picture square,
    on the right side of the open window, in the Picture field.


    ● To change the password for your account, click on the Password field, and you
    will see a little window appear.


    ●       Type your current account login password.


    ●       Type twice, your new chosen account password, in the fields available.


    ●       Click on the Change button.


    ![](image_rsrc22R.jpg)


    APPLETS


    ● There are some programs in the Linux Mint 21.3 Cinnamon, called Applets. They
    are like additional applications, which you can configure and use, by placing
    their shortcuts, to the Panel.


    ● To start configuring and using some Applets, click on the Applets icon, under
    Preferences, in the System Settings open window.


    ![](image_rsrc22S.jpg)


    ●       Once the Applets window is opened, click on the Manage tab.


    ● In this step here, I will show you how to configure the Expo applet, and that
    will just be for an example.


    ●       In the list of Applets displayed, click on the Expo to select it.


    ![](image_rsrc22T.jpg)


    ● Once you have clicked and selected the Expo applet in the list, click on the
    plus sign, located at the bottom of the window, to add the Expo, and its shortcut,
    to the Panel.


    ![](image_rsrc22U.jpg)


    ● Now you can see that the Expo applet shortcut, is added to the Panel.


    ![](image_rsrc22V.jpg)


    ● When you want to remove any of the Applets, and its shortcut from the Panel,
    just click on the Manage tab in the open window, and then, click that particular
    applet you want to remove, in the list of Applets, to select it. In the example
    here, I am showing you how to remove the Expo applet shortcut, from the Panel.


    ●       Click and select the Expo applet in the list.


    ● Click on the minus sign located at the bottom of the open window. That will
    remove the Expo applet shortcut, from the Panel.


    ![](image_rsrc22W.jpg)![](image_rsrc22X.jpg)


    ● But let us say, you want to completely remove one of the Applets, from your
    computer. To do that, click on the particular applet in the list, and then, click
    on the Uninstall button, located at the bottom of the open window. That will completely
    remove that applet, from your computer.


    ![](image_rsrc22Y.jpg)


    ● But what if the Applets available already, on your computer, are not enough
    for you, and you want some more different Applets? Well, you can do that. You
    can get more Applets on your computer too.


    ●       Click on the Download tab, in the open window.


    ![](image_rsrc22Z.jpg)


    ● Select an applet in the list of Applets displayed, and then, click on the Install
    button, located at the right side of the open window.


    ![](image_rsrc230.jpg)


    ●       You can also configure an applet, which is already installed on your computer.


    ● To configure an applet, click and select an applet from the list, and then,
    click on the Configure button, located at the right side of the open window.


    ●       In the example given here, the configuration is for the Corner bar applet.


    ![](image_rsrc231.jpg)


    ● On the following image bellow, you can see the Corner bar applet settings window
    being opened, and from that window, you can adjust the various settings, for the
    Corner bar applet.


    ![](image_rsrc232.jpg)![](image_rsrc233.jpg)


    DESKLETS


    ● And now, we are going to configure, another type of additional applications,
    called Desklets. Desklets are like the Applets, but when you configure to use
    them, they will place their shortcuts, on the Desktop, and therefore, called Desklets.


    ●       Under Preferences, in the open System Settings window, click on the Desklets
    icon.


    ![](image_rsrc234.jpg)


    ●       Click on the Manage tab.


    ![](image_rsrc235.jpg)


    ● In this example here, we are going to configure the Clock desklet. So, click
    on the Clock desklet in the list, to select it.


    ● Then, click on the plus sign, located at the bottom of the window, to add the
    Clock desklet to the Desktop.


    ![](image_rsrc236.jpg)


    ●       You can see that the Clock desklet, has been added to the Desktop.


    ![](image_rsrc237.jpg)


    ● To remove the Clock desklet from the Desktop, select the Clock desklet in the
    list of Desklets displayed, and then, click on the minus sign, located at the
    bottom of the window. That will remove the Clock desklet from the Desktop.


    ![](image_rsrc238.jpg)


    ● If you want to configure some of the Desklets, click and select a desklet in
    the list, which you want to configure.


    ● Then, click on the Configure button, located at the right side of the window.
    In this example given here, it is the Clock desklet, which has been configured.


    ![](image_rsrc239.jpg)


    ● You can see the opened Clock desklet settings window, on the following image
    bellow. From that window, you can change the font size of the Clock desklet, change
    the color, and some other settings.


    ![](image_rsrc23A.jpg)


    ● In the case when you want to add more Desklets to your computer, instead of
    using the already installed Desklets, you can click on the Download tab, in the
    open window.


    ![](image_rsrc23B.jpg)


    ● Select one particular desklet from the list, which you want to download and
    install on your computer.


    ● Click on the Install button, located at the right side of the window, to download
    and install that particular desklet, to your computer.


    ![](image_rsrc23C.jpg)


    ●       There are some other Desklets settings, which can be configured too.'
