    # 引言

    欢迎阅读 Linux Mint 21.3 Cinnamon 操作系统教程！


    如果你以前考虑过在你的电脑上尝试 Linux 操作系统，那么你考虑了一些非常棒且实用的事情！


    如果你已经使用 Windows 操作系统有一段时间（也许是多年），并决定切换到 Linux，那么你的方向是正确的。为什么？因为在电脑上使用 Linux 而不是
    Windows 有许多优点，例如：

    - Linux 免费下载和使用

    - Linux 是一个稳定且安全的操作系统

    - 你可以在 Linux 上完成所有常见的计算机任务，如浏览网页、看 YouTube 视频、听音乐等

    - Linux Mint 自带了超过 60 个免费应用程序

    - Linux Mint 是世界上最受欢迎、最常用的操作系统之一

    - 使用 Linux Mint 几乎不需要担心病毒

    - 本教程的作者将教你如何使用它。


    # 安装部分 1

    ## 制作启动盘

    制作启动盘之前，你需要一个至少 4GB 空间的 U 闪盘。首先，从官方网站下载 Linux Mint 21.3 Cinnamon ISO 镜像。然后插入 U
    盘，并使用像 Disk Etcher 这样的工具将镜像写入驱动。


    ## 安装过程

    一旦启动盘准备就绪，重启电脑进入启动菜单（通常在启动期间按下 `F12` 或 `Esc`）。选择从 U 盘启动。按照屏幕指令将 Linux Mint 安装到你的硬盘。你可以选择语言、键盘布局和分区方案。


    # 使用 Linux Mint 21.3 Cinnamon

    安装完成后，重启电脑并登录你的新桌面。


    ## 配置

    要开始配置系统，点击左下角的菜单按钮并选择“偏好设置”。在这里你可以根据需要调整各种设置。


    ## 外观

    ### 背景

    首先，让我们配置电脑桌面背景。为此，点击打开窗口中“外观”类别下的“背景”图标。


    ![](img/image_rsrc1Y6.jpg)


    - 点击打开窗口中的“图像”选项卡。

    - 点击左侧列表中的 Linux Mint 。

    - 点击设置窗口中显示的背景图像之一。


    ![](img/image_rsrc1Y8.jpg)(image_rsrc1Y9.jpg)


    - 点击打开窗口中的“设置”选项卡，你可以在这里调整背景设置。

    - 如果你想让几个背景在一段时间后自动切换，请点击“作为幻灯片播放背景”字段右侧的小白色按钮。

    - 对于“图片纵比例”字段，你可以从下拉列表中选择“缩放”选项。这就是背景应用到桌面时的显示方式。


    ![](img/image_rsrc1YA.jpg)(image_rsrc1YB.jpg)


    - 你也可以点击屏幕左下角的加号添加新的图片文件夹。


    ![](img/image_rsrc1YC.jpg)


    - 导航到图片文件夹，将这些额外的背景图像添加到集合中。


    ### 主题

    现在让我们为你的 Linux Mint 21.3 Cinnamon 配置一些桌面主题。


    - 点击打开窗口中“外观”类别下的“主题”图标。


    ![](img/image_rsrc1YE.jpg)


    - 点击打开窗口中的“主题”选项卡。


    ![](img/image_rsrc1YF.jpg)


    - 在“鼠标指针”字段中，点击右侧的按钮，并从显示的鼠标指针中选择一个你喜欢的。


    ![](img/image_rsrc1YG.jpg)


    '
- fmt: '

    ## Themes


    - In the `Applications` field, of the open window, click on the drop down menu
    on the right side of the window, and then, click and select, your preferred theme,
    for the applications of your computer.


    ![](image_rsrc1YH.jpg)


    - For choosing a color for your computer icons, click in the `Icons` field, of
    the open window, and then, click on the drop down menu, on the right side of the
    window. Then, click and select the icons colors you prefer.


    ![](image_rsrc1YJ.jpg)


    - And now, in the `Desktop` field, of the open window, click on the drop down
    menu, on the right side of the window, and then, click and select, the theme for
    the desktop.


    ![](image_rsrc1YK.jpg)


    - You will see a few more desktop options and settings appear. For example, if
    you want the desktop of your computer to be dark or light, you can chose that,
    in the `Appearance` option.


    ![](image_rsrc1YM.jpg)


    - To change the style of your desktop appearance, click on the `Style` option,
    and from the drop down menu, chose the style you prefer.


    ![](image_rsrc1YN.jpg)


    - We are still in the `Themes` category of the `Appearance`.


    - When you want to add more themes for your Linux Mint 21.3 Cinnamon computer,
    or you want to remove some themes, click on the `Add/Remove` tab, in the top middle
    of the open window.


    ![](image_rsrc1YP.jpg)


    - Look at the all available themes displayed for download, in the window, and
    if you chose one, which you want to install on your computer, just click on the
    `Install` button, on the right side of the window, in that theme name field.


    ![](image_rsrc1YR.jpg)


    - But if there is a theme, which you want to remove from your computer, just click
    and select that theme displayed in the open window, and then click on the `Uninstall`
    little button, located at the bottom middle of the open window.


    ![](image_rsrc1YS.jpg)


    - Next, is to configure some more theme settings.


    - Click on the `Settings` tab, in the open window.


    - If you want the applications icons, to appear next to the names of the applications,
    in the `Main Menu`, and sub-menus, then under the `Miscellaneous` options, click
    on the little white button, in the `Show icons in menus` field, in order to enable
    that option.


    - You can leave the other options, in the `Settings` tab, in their default, and
    that will be fine.


    ![](image_rsrc1YT.jpg)


    ## DESKTOP


    - When you want to create a new folder, on the desktop, find an empty space on
    the desktop screen, and right click, with the right mouse button over it.


    - From the popup menu, click on the `Create New Folder` option. A folder will
    be created on the desktop.


    ![](image_rsrc1YU.jpg)![](image_rsrc1YV.jpg)


    - If you want to remove the folder you created on the desktop, just place the
    mouse pointer over it, and then right click with the right mouse button, over
    it. From the popup menu, click on the `Move to Trash` option. That will move the
    folder to the `Trash`.


    ![](image_rsrc1YW.jpg)


    - In the case when you want to create a new launcher, on the desktop, find an
    empty space on the desktop, and then, right click, with the right mouse button,
    and from the popup menu, click on `Create a launcher here.` option.


    ![](image_rsrc1YX.jpg)


    - Once the `Launcher Properties` window is open, click on the `Browse` button,
    and navigate to the application, for which you want to create the launcher.


    ![](image_rsrc1YY.jpg)


    - There are little programs called `Desklets`, in Linux Mint 21.3 Cinnamon. If
    you want to place some `Desklets` shortcut, on the desktop, find an empty space
    on the desktop, and then right click with the right mouse button, over it. Once
    the menu appears, click on the `Add Desklets` option.


    ![](image_rsrc1YZ.jpg)


    - Then, in the `Desklets` window, click on `Manage` tab.


    ![](image_rsrc1Z0.jpg)


    - Select one of the `Desklets`, which are displayed in the window. For example,
    click on the `Clock` desklet, in the window.


    ![](image_rsrc1Z1.jpg)


    - Then click on the plus sign, located at the bottom of the open window, in order
    to add, the `Clock` desklet, to the desktop.


    ![](image_rsrc1Z2.jpg)


    - You can see that the `Clock` desklet, is added to the desktop.


    ![](image_rsrc1Z3.jpg)


    - But let us say, you had enough with the `Clock` desklet, on the desktop, and
    you want to remove it. Right click, with the right mouse button, over the `Clock`
    desklet on the desktop. Then, from the menu, click on `Remove this desklet` option.


    ![](image_rsrc1Z4.jpg)


    - You can download some `Desklets`, if the already installed `Desklets` are not
    helping you to accomplish, some of the computer tasks.


    - Click on the `Download` tab, in the open `Desklets` window.


    - Click and select on of the `Desklets` in the list.


    - Then, click on the down pointing arrow, on the right side of the window, to
    start downloading and installing that desklet.


    ![](image_rsrc1Z5.jpg)


    - Now, let us change the desktop background.


    - Click on an empty space on the desktop, with the right mouse button, and then,
    click on the `Change Desktop Background` option, in the opened menu.


    ![](image_rsrc1Z6.jpg)


    - In the `Backgrounds` open window, click on `Images` tab.


    - In the list of different backgrounds on the left side, click on one of the categories.
    Let us say, you click on the `Linux Mint` background category, which is on the
    top of the list on the left side of the window.


    - Then, from the backgrounds available, click on one of the backgrounds, to apply
    it to your desktop.


    ![](image_rsrc1Z7.jpg)![](image_rsrc1Z8.jpg)


    - You can see an example of a changed desktop background in the following image.


    ![](image_rsrc1Z9.jpg)


    - The next step is to customize the desktop. To do that, right click with the
    right mouse button, on an empty space, on the desktop.


    - From the opened menu, click on the `Customize` option in the menu.


    ![](image_rsrc1ZA.jpg)


    - If you want the desktop icons, to be arranged automatically, click on the little
    white button on the right side of the window, in the `Auto-arrange` field, under
    `Layout`.


    ![](image_rsrc1ZB.jpg)


    - To adjust the size of the desktop icons, click on the drop down menu on the
    right side of the window, in the `Icon Size` field. Then, chose the size of the
    icons from the drop down menu.


    ![](image_rsrc1ZC.jpg)


    - How do you want the icons on your desktop, to be arranged, vertically, or horizontally?
    To select the option you want, click on the drop down menu, in the `Direction`
    field, and then, chose `Vertical` or `Horizontal`.


    ![](image_rsrc1ZD.jpg)


    - For sorting the items on your desktop, by size, date, or name, in the `Sort
    items by` field, click on the drop down menu, and make you choice.


    ![](image_rsrc1ZE.jpg)


    ## HARDWARE


    ### BLUETOOTH


    - The first hardware configuration we are going to deal with, is the `Bluetooth`.


    - In the open `System Settings` window, click on the `Bluetooth` icon, under `Hardware`.


    ![](image_rsrc1ZF.jpg)


    - In the open `Bluetooth Devices` window, click on the `Search` button, to make
    the computer search for any external Bluetooth devices, which are in your proximity.


    ![](image_rsrc1ZG.jpg)


    - In the following image below, you can see that a Bluetooth device has been found,
    and that is the `ZK606`. The `ZK606` Bluetooth device described here, is just
    to give you an example. In your case, there will be your own external Bluetooth
    devices, which are switched on, and in your proximity, that will be displayed
    as found, in the `Bluetooth Devices` window.


    - Click on the Bluetooth device, which has been found, to select it.


    ![](image_rsrc1ZH.jpg)


    - Click on the `Pair` button, in order for the Bluetooth inside of your computer,
    to be paired together with the external Bluetooth device. Bluetooth devices need
    to be paired, in order to work together.


    ![](image_rsrc1ZJ.jpg)


    - Also, click on the `Trust` button, to make your computer Bluetooth, to ‘trust’
    the external Bluetooth device, when they are connecting.


    ![](image_rsrc1ZK.jpg)

