  md: '# HONEY TECHNIQUES


    WINDOWS


    Honey Ports Windows:


    Ref. http://securityweekly.com/wp-content/uploads/2013/06/howtogetbetterpentest.pdf


    Step 1: Create new TCP Firewall Block rule on anything connecting on port 3333:


    ```

    C:\> echo @echo off for /L %i in (1,1,1) do @for /f "tokens=3" %j in (''netstat
    -nao ^| find "^3333^''\'') do @for /f "tokens=1 delims=:" %k in ("%j") do

    netsh advfirewall firewall add rulename="HONEY TOKEN RULE" dir=in remoteip=%k
    localport=any protocol=TCP action=block >> BATCH FILE>.bat

    ```


    Step 2: Run Batch Script


    ```

    C:\> <BATCH FILE NAME>.bat

    ```


    Windows Honey Ports PowerShell Script:


    Ref.

    https://github.com/Pwdrkeg/honeyport/blob/master/honeyport.ps1


    Step 1: Download PowerShellFiles Script


    ```

    C:\> "%ProgramFiles%\Internet Explorer\iexpl.exe"

    https://github.com/Pwdrkeg/honeyport/blob/master/honeyport.ps1

    ```


    Step 2: Run PowerShell Script


    ```

    C:\> honeyport.ps1

    ```'
