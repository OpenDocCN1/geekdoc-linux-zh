  md: '# WINDOWS


    NETWORK DISCOVERY


    Basic network discovery:


    ```

    C:\> net view /all

    ```


    ```

    C:\> net view \<HOST NAME>

    ```


    Basic ping scan and write output to file:


    ```

    C:\> for /L %I in (1,1,254) do ping -w 30 -n 1 192.168.1.%I | find "Reply" >>
    <OUTPUT FILE_NAME>.txt

    ```


    # DHCP


    Enable DHCP server logging:


    ```

    C:\> reg add

    ```


    ```

    HKLM\System\CurrentControlSet\Services\DhcpServer\Parameters /v ActivityLogFlag
    /t REG_DWORD /d 1

    ```


    Default Location Windows 2003/2008/2012:


    ```

    C:\> %windir\System32\Dhcp

    ```


    # DNS


    Default location Windows 2003:


    ```

    C:\> %SystemRoot%\System32\Dns

    ```


    Default location Windows 2008:


    ```

    C:\> %SystemRoot%\System32\Winevt\Logs\DNS Server.evtx

    ```


    Default location of enhanced DNS Windows 2012 R2:


    ```

    C:\> %SystemRoot%\System32\Winevt\Logs\Microsoft-Windows-DNSServer%4Analytical.etl

    ```'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Ref. https://technet.microsoft.com/en-us/library/cc94079.aspx


    # Enable DNS Logging:


    ```

    C:\> DNSCmd <DNS SERVER NAME> /config /logLevel 0x8100F331

    ```


    # Set log location:


    ```

    C:\> DNSCmd <DNS SERVER NAME> /config /LogFilePath <PATH TO LOG FILE>

    ```


    # Set size of log file:


    ```

    C:\> DNSCmd <DNS SERVER NAME> /config /logfilemaxsize 0xffffff

    ```


    HASHING


    # File Checksum Integrity Verifier (FCIV):

    Ref. http://support2.microsoft.com/kb/841290


    # Hash a file:


    ```

    C:\> fciv.exe <FILE TO HASH>

    ```


    # Hash all files on C:\ into a database file:


    ```

    C:\> fciv.exe c:\ -r -md5 -xml <FILE NAME>.xml

    ```


    # List all hashed files:


    ```

    C:\> fciv.exe -list -sha1 -xml <FILE NAME>.xml

    ```


    # Verify previous hashes in db with file system:


    ```

    C:\> fciv.exe -v -sha1 -xml <FILE NAME>.xml

    ```


    Note: May be possible to create a master db and compare to all systems from a
    cmd line. Fast baseline and difference.


    Ref. https://technet.microsoft.com/en-us/library/dn520872.aspx


    ```

    PS C:\> Get-FileHash <FILE TO HASH> | Format-List

    ```'
  merge: -1
  pgno: 14
- img_proc: true
  md: '```

    C:\> Get-Hash -algorithm md5 <FILE TO HASH>

    C:\> certutil -hashfile <FILE TO HASH> SHA1

    C:\> certutil -hashfile <FILE TO HASH> MD5

    ```


    # NETBIOS


    Basic nbtstat scan:


    ```

    C:\> nbtstat -A <IP ADDRESS>

    ```


    Cached NetBIOS info on localhost:


    ```

    C:\> nbtstat -c

    ```


    Script loop scan:


    ```

    C:\> for /L %i in (1,1,254) do nbstat -An

    192.168.1.%i

    ```


    # USER ACTIVITY


    Ref. https://technet.microsoft.com/en-us/sysinternals/psloggedon.aspx


    Get users logged on:


    ```

    C:\> psloggedon \\computename

    ```


    Script loop scan:


    ```

    C:\> for /L %i in (1,1,254) do psloggedon

    192.168.1.%i >> C:\users_output.txt

    ```'
  merge: -1
  pgno: 15
