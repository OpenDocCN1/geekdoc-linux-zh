  md: '# Look for suspicious and self-signed SSL certificates:


    ```

    # tcpdump -s 1500 -A ''(tcp((((tcp[12:1] & 0xf0)) >>\n2)+5:1) = 0x01 and tcp(((tcp[12:1]
    & 0xf0)) >>\n2):1) = 0x16''

    ```


    # Get SSL Certificate:


    ```

    # openssl s_client -connect <URL>:443

    # openssl s_client -connect <SITE>:443 </dev/null2>/dev/null | sed -ne ''/BEGIN
    CERTIFICATE-,\/-END CERTIFICATE-/p'' > <CERT>.pem

    ```


    # Examine and verify the certificate and check for Self-Signed:


    ```

    # openssl x509 -text -in <CERT>.pem

    # openssl x509 -in <CERT>.pem -noout -issuer subject -startdate -enddate -fingerprint

    # openssl verify <CERT>.pem

    ```


    # Extract Certificate Server Name:


    ```

    # tshark -nr <PCAP FILE NAME> -Y\n"ssl.handshake.ciphersuite" -Vx | grep "Server
    Name" | sort | uniq -c | sort -r

    ```


    # Extract Certificate info for analysis:


    ```

    # ssldump -Nr <FILE NAME>.pcap | awk ''BEGIN {c=0};\n { ($0 ~ /^\\]]+Certificate$/)
    {c=1}; print\n"========================================";} if\n($0 ! ~ /^\+\/)
    {c=0}; if (c==1) print $0; }''

    ```'
