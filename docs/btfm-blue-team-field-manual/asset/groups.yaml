    Ref.

    https://isc.sans.edu/forums/diary/Detecting+Mimikatz+Use+On+Your+Network/19311/


    Step 1: Create Fake Honey Hash. Note enter a fake password and keep command prompts
    open to keep password in memory


    ```

    C:\> runas /user:yourdomain.com\fakeadministratoraccount /netnoly cmd.exe

    ```


    Step 2: Query for Remote Access Attempts


    ```

    C:\> weevutil q System /q:"*[System[(EventID=20274)]" /f:text /rd:true /c:1 /r:remotecomputename

    ```


    Step 3: Query for Failed Login Attempts


    ```

