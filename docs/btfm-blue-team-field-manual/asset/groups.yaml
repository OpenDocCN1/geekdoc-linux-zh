    ToggleKeys\" /v Flags /t REG_SZ /d 58 /f\n```\n\n## 禁用过滤键：\n\n```\nC:\\> reg add\
    \ \"HKCU\\Control Panel\\Accessibility\\Keyboard Response\" /v Flags /t REG_SZ\
    \ /d 122 /f\n```\n\n## 禁用屏幕键盘：\n\n```\nC:\\> reg add \"HKCU\\Control Panel\\Accessibility\\\
    StickyKeys\" /v Flags /t REG_SZ /d 506 /f\n```\n\n将活动目录用户对象移动到新组：\n\n```\nPS C:\\\
