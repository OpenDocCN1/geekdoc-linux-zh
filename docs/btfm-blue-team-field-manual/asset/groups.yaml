    \ proxy\n  return \"DIRECT\"\n}\n```\n\n# IPSEC\n\nAllow firewall to pass IPSEC\
    \ traffic:\n\n- # iptables -A INPUT -p esp -j ACCEPT\n- # iptables -A INPUT -p\
    \ ah -j ACCEPT\n- # iptables -A INPUT -p udp --dport 500 -j ACCEPT\n- # iptables\
    \ -A INPUT -p udp --dport 4500 -j ACCEPT\n\nPass IPSEC traffic:\n\nStep 1: Install\
    \ Racoon utility on <HOST1 IP ADDRESS> and <HOST2 IP ADDRESS> to enable IPSEC\
    \ tunnel in Ubuntu.\n\n- # apt-get install racoon\n\nStep 2: Choose direct then\
