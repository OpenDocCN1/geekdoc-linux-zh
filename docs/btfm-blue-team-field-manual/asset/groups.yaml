    \ security=authenticate\n```\n\n## 创建一个用于网页浏览的规则：\n\n```\nC:\\> netsh advfirewall\
    \ firewall add rule name=\"Allow\nOutbound Port 80\" dir=out localport=80 protocol=TCP\n\
    action=allow\n```\n\n## 创建一个 DNS 规则：\n\n```\nC:\\> netsh advfirewall firewall\
    \ add rule name=\"Allow\nOutbound Port 53\" dir=out localport=53 protocol=UDP\n\
