- md: '

    ## GridView list of any local rules applicable:

    PS C:\> Get-AppLockerPolicy -Local -Xml | OutGridView


    ## IPSEC


    Create a IPSEC Local Security Policy, applied to any connection, any protocol,
    and using a preshared key:


    ```

    C:\> netsh ipsec static add filter

    filterlist=MyIPsecFilter srcaddr=Any dstaddr=Any

    protocol=ANY

    ```


    ```

    C:\> netsh ipsec static add filteraction

    name=MyIPsecAction action=negotiate

    ```


    ```

    C:\> netsh ipsec static add policy

    name=MyIPsecPolicy assign=yes

    ```


    ```

    C:\> netsh ipsec static add rule name=MyIPsecRule

    policy=MyIPsecPolicy filterlist=MyIPsecFilter

    filteraction=MyIPsecAction conntype=all activate=yes

    k=<PASSWORD>

    ```


    Add rule to allow web browsing port 80 (HTTP) and 443 (HTTPS) over IPSEC:


    ```

    C:\> netsh ipsec static add filteraction name=Allow

    action=permit

    ```


    ```

    C:\> netsh ipsec static add filter

    filterlist=WebFilter srcaddr=Any dstaddr=Any

    protocol=TCP dstport=80

    ```


    ```

    C:\> netsh ipsec static add filter

    filterlist=WebFilter srcaddr=Any dstaddr=Any

    protocol=TCP dstport=443

    ```


    ```

    C:\> netsh ipsec static add rule name=WebAllow

    policy=MyIPsecPolicy filterlist=WebFilter

    filteraction=Allow conntype=all activate=yes

    k=<PASSWORD>

    ```


    ## Shows the IPSEC Local Security Policy with name "MyIPsecPolicy":


    ```

    C:\> netsh ipsec static show policy

    name=MyIPsecPolicy

    ```


    ## Stop or Unassign a IPSEC Policy:


    ```

    C:\> netsh ipsec static set policy

    name=MyIPsecPolicy

    ```


    ## Create a IPSEC Advance Firewall Rule and Policy and preshared key from and
    to any connections:


    ```

    C:\> netsh advfirewall consec add rule name="IPSEC"

    endpoint1=any endpoint2=any action=requireinrequireout qmsecethods=default

    ```


    ## Require IPSEC preshared key on all outgoing requests:


    ```

    C:\> netsh advfirewall firewall add rule name="IPSEC_Out"

    dir=out action=allow enable=yes

    profile=any localip=any remoteip=any protocol=any

    interfacetype=any security=authenticate

    ```


    ## Create a rule for web browsing:


    ```

    C:\> netsh advfirewall firewall add rule name="Allow

    Outbound Port 80" dir=out localport=80 protocol=TCP

    action=allow

    ```


    ## Create a rule for DNS:


    ```

    C:\> netsh advfirewall firewall add rule name="Allow

    Outbound Port 53" dir=out localport=53 protocol=UDP

    action=allow

    ```


    ## Delete ISPEC Rule:


    ```

    C:\> netsh advfirewall firewall delete rule

    name="IPSEC_RULE"

    ```


    ACTIVE DIRECTORY (AD) – GROUP POLICY OBJECT (GPO)


    ## Get and force new policies:


    ```

    C:> gpupdate /force

    C:> gpupdate /sync

    ```


    Audit Success and Failure for user Bob:


    ```

    C:> auditpath /set /user:bob /category:"Detailed

    Tracking" /include /success:enable /failure:enable

    ```


    Create an Organization Unit to move to suspected or infected users and machines:


    ```

    C:> dsadd ou <QUARANTINE BAD OU>

    ```


    Move an active directory user object into NEW GROUP:


    ```

    PS C:\> Move-ADObject ''CN=<USER NAME>,CN=<OLD USER GROUP>,DC=<OLD DOMAIN>,DC=<OLD
    EXTENSION>'' -

    TargetPath ''OU=<NEW GROUP>,DC=<OLD DOMAIN>,DC=<OLD EXTENSION>''

    ```


    Alt Option:


    ```

    C:\> smove "CN=<USER NAME>,OU=<OLD USER OU>,DC=DOMAIN,DC=<OLD EXTENSION>" -newparent
    OU=<NEW GROUP>,DC=<OLD DOMAIN>,DC=<OLD EXTENSION>

    ```


    ## STAND ALONE SYSTEM WITHOUT ACTIVE DIRECTORY (AD)


    Disallow running a .exe file:


    ```

    C:\> reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
    /v DisallowRun /t REG_DWORD /d 00000001 /f

    ```


    ```

    C:\> reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun
    /v badfile.exe /t REG_DWORD /d <BAD FILE NAME>.exe /f

    ```


    Disable Remote Desktop:


    ```

    C:\> reg add HKLM\SYSTEM\CurrentControlSet\Control\TerminalServer" /v fDenyTSConnections
    /t REG_DWORD /d 1

    ```


    ## Send NTLM2 response only/refuse LM and NTLM:

    (Windows 7 default)


    ```

    C:\> reg add HKLM\SYSTEM\CurrentControl\Control\Lsa\ /v lmcompatibilitylevel /t
    REG_DWORD /d 5 /f

    ```


    ## Restrict Anonymous Access:


    ```

    C:\> reg add HKLM\SYSTEM\CurrentControl\Control\Lsa /v restrictanonymous /t REG_DWORD
    /d 1 /f

    ```


    ## Do not allow anonymous enumeration of SAM accounts and shares:


    ```

    C:\> reg add HKLM\SYSTEM\CurrentControl\Control\Lsa /v restrictanomoussam /t REG_DWORD
    /d 1 /f

    ```


    ## Disable IPv6:


    ```

    C:\> reg add HKLM\SYSTEM\CurrentControl\services\TCPIP6\Parameters / DisabledComponents
    /t REG_DWORD /d 255 /f

    ```


    ## Disable sticky keys:


    ```

    C:\> reg add "HKCU\Control Panel\Accessibility\StickyKeys" /v Flags /t REG_SZ
    /d 506 /f

    ```


    ## Disable Toggle Keys:


    ```

    C:\> reg add "HKCU\Control Panel\Accessibility\ToggleKeys" /v Flags /t REG_SZ
    /d 58 /f

    ```


    ## Disable Filter Keys:


    ```

    C:\> reg add "HKCU\Control Panel\Accessibility\Keyboard Response" /v Flags /t
    REG_SZ /d 122 /f

    ```


    ## Disable On-screen Keyboard:


    ```

    C:\> reg add "HKCU\Control Panel\Accessibility\StickyKeys" /v Flags /t REG_SZ
    /d 506 /f

    ```


    Move an active directory user object into NEW GROUP:


    ```

    PS C:\> Move-ADObject ''CN=<USER NAME>,CN=<OLD USER GROUP>,DC=<OLD DOMAIN>,DC=<OLD
    EXTENSION>'' -

    TargetPath ''OU=<NEW GROUP>,DC=<OLD DOMAIN>,DC=<OLD EXTENSION>''

    ```


    Move an active directory user object into NEW GROUP:


    ```

    PS C:\> Move-ADObject ''CN=<USER NAME>,CN=<OLD USER GROUP>,DC=<OLD DOMAIN>,DC=<OLD
    EXTENSION>'' -

    TargetPath ''OU=<NEW GROUP>,DC=<OLD DOMAIN>,DC=<OLD EXTENSION>''

    ```

