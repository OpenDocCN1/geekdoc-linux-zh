    ## APPLICATION RESTRICTIONS


    AppLocker - Server 2008 R2 or Windows 7 or higher: Using GUI Wizard configure:


    - Executable Rules (.exe, .com)

    - DLL Rules (.dll, .ocx)

    - Script Rules (.ps1, .bat, .cmd, .vbs, .js)

    - Windows Install Rules (.msi, .msp, .mst)


    ## Steps to employ AppLocker (GUI needed for digital signed app restrictions):


    Step 1: Create a new GPO.


    Step 2: Right-click on it to edit, and then navigate through Computer Configuration,
    Policies, Windows Settings, Security Settings, Application Control Policies and
    AppLocker.


    Click Configure Rule Enforcement.


    Step 3: Under Executable Rules, check Enforce rules.


    Step 4: In the left pane, click Executable Rules.


    Step 5: Right-click select New Rule.


    Step 6: On the Conditions screen, click Next.


    Step 7: On the Permissions screen, click Next.


    Step 8: Use the Browse button to select any executable.


    Step 9: Click Next.


    Step 10: If this is your first time creating an AppLocker policy, Windows will
    prompt you to create.


    Step 11: Ensure AppLocker service is running.


    Step 12: Use the Appocker policy to test whether calc.exe and notepad.exe are
    allowed for users who are members of the Everyone group. If you do not specify
    a group, the Everyone group is used by default.

