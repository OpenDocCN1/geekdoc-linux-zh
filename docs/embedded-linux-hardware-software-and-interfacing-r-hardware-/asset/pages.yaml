  md: '# CHAPTER 11 Using Interrupts For Timing


    # Race Timer Status Display Using System Timers


    The race timer status and Racer Go LEDs inform officials, fans, and racers of
    race activity. A solid signal means the system is ready for a race to begin. Blinking
    LEDs mean a race is in progress. When the LEDs are off, a race is complete and
    the system is ready for another racer to enter the starting gate. The Project
    Trailazer engineers need to figure out how to blink the LEDs at a constant 1-second
    rate.


    As you saw at the beginning of this chapter, Linux offers five timing mechanisms,
    and the engineers choose to use do_gettimeofday for race timing. The racer driver
    could sit in a loop calling do_gettimeofday and wait for 1 second to elapse. The
    racer driver could also call a system sleep function (usleep) and wait for 1 second
    to elapse. Both approaches would work, but neither is desirable. The kernel scheduler
    does not drive code that is executing in the kernel space. A 1-second sleep in
    the kernel would occupy the processor for 1 second, and other processing would
    not occur during this time. Device drivers that use sleep functions for long delays
    negatively affect system performance.


    Kernel timers solve time delay problems. By using a timer, device drivers can
    schedule a function for execution at a future time. A device driver creates a
    timer, populates the timer''s data, function fields and adds the timer to the
    kernel''s timer list. The x86 kernel scans the timer approximately 100 times per
    second. If the kernel''s jiffy value is greater than the timer''s expires field,
    the kernel executes the timer''s function handler. Timers operate in a one-shot
    mode. The kernel executes timer handlers only once. Drivers that periodic function
    execution need to reschedule their kernel timers in the timer''s function handler.


    In the race timer, the bottom-half tasklet, racimer_do_tasklet, starts the kernel
    timer called status_timer. One second later, the status_timer expires and the
    kernel executes the status_timer''s function handler, status_timer_timed_out.
    If the race is in progress (the timing where the LEDs blink at 1 second intervals),
    status_timer_timed_out toggles the Status and Racer Go LEDs, sets the status_timer.expires
    value, and then reschedules (via the add_timer function) status_timer_timed_out
    for execution 1 second later. If the race has completed, status_timer_timed_out
    turns off the LEDs.


    Let''s look at how the racer_x86.c device driver, shown in Listing 11.4, implements
    bottom-half interrupt processing using a scheduled tasklet and 1-second timing
    of the Status and Racer Go LEDs.


