  md: '# CHAPTER 7 Parallel Port Interfacing


    +   - Many Linux processes make available information via files in the /proc directory.

    - /proc directory device files are created on-the-fly and do not clash with other
    device files and can be found easily by filename.


    The “Linux Kernel Programming Guide” is out of date, and its examples are difficult
    to compile. engineers found the “Linux Kernel Procs Guide,” which applies to kernel
    2.4 and is up-to-date. They decided to create the lift monitoring and snow-making
    control device driver, which would be a loadable kernel module that would use
    the /proc file system. The engineers planned to be extra careful when writing
    the device driver, to make sure that array-of-bounds conditions never occur. They
    knew they could not rely on glibc functions. They planned to develop their kernel
    module device driver around the Linux Kernel Procs program procsfs_example.c.
    They began by writing a helloworld device driver for the /proc directory. After
    they were confident in their skills at creating device drivers, they would modify
    helloworld and create the lift monitoring and snow-making control device driver.


    # Understanding helloworld_proc_module


    Most helloworld programs print "Hello World" and terminate. Kernel module versions
    of helloworld print "Hello World" to the console or to the system log when loaded
    and print "Goodbye World" when they are unloaded. The helloworld_proc_module will
    print loading and unloading messages, and it will also store a character string
    that offers persistence across the life of the module. helloworld_proc_module
    will demonstrate the process of creating the /proc directory file, transferring
    data from users to the module, transferring data from the module back to users,
    and removing the /proc directory file. Here are the basic steps involved in the
    execution of helloworld_proc_module:


    +   1. The module is loaded from a script or by hand, with insmod helloworld_proc_module.o.

    2. The kernel calls the module init function. The source code uses a macro define
    called module_init that declares function is init. In this case, the statement
    is module_init(init_helloworld).

    3. The module''s init function executes and creates a /proc directory file entry
    called helloworld_file, fills its fields, and then prints a message to the system
    log. The helloworld_file /proc entry structure contains four fields that the kernel
    requires for read and write operations:'
  merge: -1
  pgno: 190
- img_proc: true
  md: "+   read_proc—The read_proc field should contain a pointer to the file's callback\
    \ function that executes for a read file operation. For example, if a user ran\
    \ the cat /proc/helloworld_proc_module command at the bash prompt, the kernel\
    \ would ultimately call the file's read_proc function to handle this file read\
    \ operation.\n\n+   write_proc—The write_proc field should contain a pointer to\
    \ the file's callback function that executes for a write file operation. If a\
    \ user ran the echo test > /proc/helloworld_proc_module command at the bash prompt,\
    \ the kernel would call the file's write_proc function to handle this file write\
    \ operation.\n\n+   data—The data field contains a pointer to the file's data.\
    \ During initialization, a data structure is created and populated. When a read\
    \ or write callback occurs, using read_proc or write_proc, this data pointer is\
    \ passed as a parameter. This way, the read_proc and write_proc functions can\
    \ find their associated data.\n\n+   owner—Because the proc file entry is loaded\
    \ in a module, the owner field should be set to THIS_MODULE.\n\n+   4. The module\
    \ is unloaded by a script or by hand, with rmmod helloworld_proc_module.\n\n+\
    \   5. The kernel calls the module's exit function. The source code uses a macro\
    \ definition module_exit that declares which function is exit. In this case, the\
    \ statement is module_exit(cleanup_helloworld);\n\n+   6. The exit routine removes\
    \ the /proc file entry and prints a message to the system log file.\n\nThis is\
    \ a bit different from the standard helloworld.c program that you're used to seeing.\
    \ This helloworld_proc_module program seems complicated, but after you get into\
    \ it and understand how to set the helloworld_file fields and how the data pointer\
    \ is passed to read and write callback functions, it's pretty simple. Listing\
