  md: '# About the Author


    Craig Hollabaugh has been fascinated by electronics since he bought an AM radio
    in elementary school. He was first exposed to Unix during a cross-country talk
    session in 1985. Later, he networked Sun and DEC workstations while pursuing a
    doctoral degree in electrical engineering at Georgia Institute of Technology.


    Craig''s first embedded SCADA (supervisory control and data acquisition) design,
    the PacMester, remotely monitored the gasoline additive injection process and
    earned him a U.S. patent. His next embedded design, the Titan PAC-3, based on
    Intel x86 architecture, controlled this injection process, a home-growth multitasking
    operating system complete, with boot code, communications ability, and field-downloadable
    application code.


    In 1995 Craig co-founded Wireless Scientific, where he developed 20 spread-900MHz
    ISM telemetry products. Craig worked with more than 200 developers, systems integrators,
    and equipment manufacturers to incorporate wireless telemetry within their SCADA
    applications or product lines. In 1996 Wireless Scientific''s Global Data Management
    project used Linux as a development platform to remotely monitor and control tank
    levels.


    In 1997 Lanier Corporation charged Craig with architecting his next-generation
    VoiceWriter, a digital dictation and transcription system with revenues beyond
    $100 million. His responsibilities included ensuring that product followed current/future
    technological trends, adhered to technical/medical information standards, and
    incorporated Lanier''s legacy products.


    Craig comes from his home in Ouray, Colorado. He developed the firmware for Antic''s
    cable distribution product, the Proteus Scalar Node. At Clifton, Weiss and Associates,
    Craig is a member of a carrier-class telecommunications network design team. His
    current responsibilities involve designing and analyzing wired and wireless voice
    and data networks for Dallas Area Rapid Transit, Metro North Railroad, New York
    City, and Pittsburgh Area Transit. He also designs- FM, MP3, and Bluetooth electronics
    for Arriva.


    The Ouray community benefits through Craig''s system administration support of
    Ouranet and his adult education classes in electronics and programming. Most recently,
    Craig co-founded The Silverjack Baking Company, where he will bake and sell scrumptious
    delights from a horse-drawn bakery on Ouray''s Main Street during the summer months.
    If there''s snow flying, you''ll most likely find him snow-boarding at Telluride.'
