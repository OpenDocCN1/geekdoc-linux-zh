    # USB Interfacing


    Silverjack guests enjoy music and photographs. Whether it''s Mozart in the village
    or Nine Inch Nails in the half pipe, people enjoy outdoor music and continually
    make positive comments. Project Trailblazer will enhance the mountain''s audio
    capabilities.


    Pictures also play an important role at Silverjack. Images are used around the
    mountain to provide current status information. “How long is the Lift 4 line?”
    and “Is it snowing at the top of Lift 9?” are common questions that could be immediately
    answered with pictures. With current images, guests can make decisions about where
    to go on the mountain in order to avoid long lift lines. Images also enhance safety
    by allowing guests to view the mountaint conditions. If it’s snowing high, some
    people might decide to stay low. Project Trailblazer image collection will enhance
    guest enjoyment of Silverjack and their safety.


    This chapter follows the Project Trailblazer engineers as they use embedded Linux
    to play music and collect images.


    Linux audio is easy: You install a sound card, recompile the kernel, and reboot.
    Similarly, for video, you install a video capture card, recompile, and reboot.
    But these simple processes are possible only if the kernel supports the sound
    card and video capture card. Many devices don''t have Linux support, or if the
    support is via reverse-engineering that provides an unofficial solution.


    Cost is a big consideration for Project Trailblazer. Sound cards, which are a
    commodity item, are inexpensive. Video capture and the associated cameras, on
    the other hand, are relatively expensive. Project Trailblazer requires image'
