  md: 'CHAPTER 10 Synchronous Serial Communication Interfacing


    # Temperature Sensing and Display


    The engineers need a temperature-sensing technology that''s inexpensive, accurate
    and covers an extensive temperature range. They''ve found the National Semiconductor
    LM70 SPI digital temperature sensor (www.national.com). For the outdoor temperature
    display, they''ve decided to use the Philips Semiconductor I2C SAA1064 four-digit
    seven-segment LED display driver (www.semiconductor.philips.com).


    National Semiconductor''s LM70 digital temperature sensor offers 0.25°C resolution
    over a temperature range of -55°C to +150°C (that is, -67°F to +302°F). The LM70
    operates with a supply voltage between +2.65V and +5.5V and consumes 490µA with
    a temperature accuracy of ±2°C from -40°C to +85°C. It interfaces to microprocessors
    through an SPI interface. The LM70 is ideal for Project Trailblazer, and each
    one costs about $1.


    Philips Semiconductor specifically designed the SAA1064 with an I2C bus interface
    capable of driving four seven-segment LED displays. The I2C serial interface permits
    connection of to four SAA1064s to a single synchronous serial port. One board
    connected to four SAA1064s, each driving four seven-segment LEDs, enables display
    of temperatures at the top and bottom of the lift, in Fahrenheit and Celsius.
    For example, a single temperature display with 16 digits can show the lift temperature
    of 10°F and -12°C and the bottom temperature of 44°F and 6°C. Each SAA1064 costs
    about $4.


    The Project Trailblazer engineers need to connect an LM70 to the x86 parallel
    port and develop an SPI synchronous communication algorithm for a device driver.
    Embedded developers refer to synchronous serial communication algorithms as “bit-banging”
    routines. Then the engineers need to connect an LM70 to the MediaEngine''s ARM
    processor. The ARM processor''s Serial Port 4 is a synchronous serial port (SPI)
    that simplifies communications with external SPI devices. Next, the engineers
    need to connect an SAA1064 to the x86 parallel port and use pre-existing I2C device
    driver software. Finally, the engineers need to develop an I2C bit-banging routine
    for the PowerPC, to enable the RPX-CLL to develop the temperature LED displays.
    In summary, this chapter outlines the connection and rapid development for the
    devices listed in Table 10.1.


    # TABLE 10.1 Temperature Device Connectivity and Driver Type


    | Platform | Software Type |

    | --- | --- |

    | LM70 Temperature Sensor (SPI) | Bit-banging algorithm |

    | x86, parallel port SA-1110, SPI | On-chip controller |

    | SAA1064 LED Driver (I2C) | Open-source device driver |

    | x86, parallel port MPC860, Port B | Bit-banging algorithm |'
