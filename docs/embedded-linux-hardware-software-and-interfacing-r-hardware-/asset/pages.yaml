    # The Linux root filesystem


    The Linux root filesystem contains files and executables that the kernel requires,
    as

    well as executables for system administration. In a desktop workstation installation,

    t kernel mounts a hard disk partition on the / directory. The following directories

    ext exist the / directory:


    +   * /bin and sbin contain system executables such as init, ifconfig, mount,
    cdnmkdir, and ping.

    * /lib contains the shared libraries (libc and others) and the Linux dynamic

    loader.

    * /etc contains system configuration files and scripts.'
