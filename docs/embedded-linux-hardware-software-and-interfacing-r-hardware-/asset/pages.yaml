  md: '# Remote Debugging


    target computer. The debugging server, gdbserver, interfaces the target executable
    with the host debugger, gdb. The debugging server and the debugger converse over
    a communications link. You are using the TCP/IP Ethernet network, by serial links
    can also be used. After link establishment, the debugging process proceeds as
    local debugging session.


    In this section, you will boot the MediaEngine, tbdevarm, as you did in Chapter
    4 "Booting Linux," and then run gdbserver on it. (In Chapter 4, the buildrootfilesystem
    script copied gdbserver and helloworld-arm-linux to the target''s root file system).
    You can run gdb on the tbdev1 host and establish a TCP connection to tbdevarm''s
    gdbserver. Then, you can debug helloworld-arm-linux running on the tbdevarm.


    Figure 5.1 shows tbdev1 and tbdevarm, with a serial connection and a network connection.
    You are using minicom on tbdev1 to boot the tbdevarm (Chapter 4) and gain access
    to it. Remember that tbdevarm''s console is routed through its serial port, ttyS0.


    ![](img/6d9baeee8ddb96b5248c3d68b6bc0ecb_139_0.png)


    FIGURE 5.1 The remote debugging computer configuration.


    Here are the steps to remotely debug helloworld-arm-linux running on the MediaEngine
    and gdb running on tbdev1:


    +   1. Run minicom on tbdev1 and boot tbdevarm. Start gdbserver on tbdevarm, telling
    gdbserver to accept a TCP/IP connection from tbdev1 and start executing helloworld-arm-linux


    ```

    bash-2.04# cd /tmp

    bash-2.04# gdbserver 192.168.1.11:2345 helloworld-arm-linux

    Process helloworld-arm-linux created; pid = 17

    ```'
