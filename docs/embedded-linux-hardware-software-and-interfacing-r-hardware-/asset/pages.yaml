  md: '# Developing the Target and CGI Integration Scripts


    The engineers decided to use the Project Trailblazer database in an innovative
    way. They developed a target board bash script called imageReport, shown in Listing
    12.7. imageReport queries the Silverjack database for the vgrabbj command. The
    server returns a vgrabbj command that the imageReport script executes. The Apache
    HTTP server sets the target board''s IP address to CGI scripts in the REMOTE_ADDR
    variable. A CGI script called imageGetCommand, shown in Listing 12.8, performs
    a database query, using the imageGetCommand to determine the target''s location
    description. The imageGetCommand CGI script then returns to the target board a
    complete vgrabbj command with the overlay command-line parameter set to the board''s
    location, current time and date, and the output filename parameter set to a unique
    filename. The imageReport script executes this unique command and creates an image
    file with the appropriate overlay. Use of the imageGetCommand CGI script, every
    camera-equipped target board executes the same imageReport script and therefore,
    the target boards do not require unique configuration.


