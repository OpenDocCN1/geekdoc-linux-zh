    # The root Filesystem Binary: Compile or Download?


    The engineers determined that it would be easy to find all these files for the
    i386 platforms. The ARM and PowerPC versions would require cross-compiling. Although
    this list is short compared to the Debian base installation of 10,734 files, cross-compiling
    all these executables would require significant effort. The most current source
    code would have to be located and downloaded. The individual files would require
    modification for cross-compiling and library linking. Finally, the code would
    need to be compiled. The engineers thought that there must be an easier way, that
    someone has already done this ARM and PowerPC cross-compiling. During their initial
    research, the engineers found that the Debian Linux site (www.debian.org) contains
    source and compiled binaries for Alpha, ARM, i386, PowerPC, and SPARC processors.
    This availability of compiled binaries looking promising, until the engineers
    investigated the source code versions. The Debian software distribution lags behind
    current versions of open-source software. Debian publicly acknowledges and distributes
    software “when it''s time”. In addition, the Debian versions of PowerPC are compiled
    for microprocessors that have floating-point units. The Trailblazer RPX-CLFF target
    board uses a Motorola MPC860 that doesn''t have a floating-point unit. They decided
    to look elsewhere.


    Recently, MontVista software released Hat Linux (HHL), version 2 using kernel
    2.4.2. MontVista distributes two varieties of HHLv2: the Jouryman and the Professional
    editions. The Jouryman caught the engineers'' attention because it supports i386,
    ARM, and PowerPC, specifically the MPC8xx processors—and it''s free. The Jouryman
    CD contents as well as CD images are publicly available at the MontVista FTP site
    (ftp.mvista.com/pub/Jouryman).'
