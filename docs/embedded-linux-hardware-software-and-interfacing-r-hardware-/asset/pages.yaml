    # The Linux Boot Process


    A target board booting proceeds through several steps after reset to get a system
    prompt. The initial steps, such as ROM startup code and register configuration,
    are microprocessor hardware dependent. The kernel itself contains microprocessor
    architecture-dependent initialization code that is executed. The first initialization
    code configures the microprocessor registers for protected-mode operation and
    invokes the architecture-independent kernel starting point called start_kernel.
    From this point, the boot process is identical for all architectures. The Linux
    boot process involves the following steps:


    +   1. After a process is reset, it executes ROM startup code.


    +   2. The ROM startup code initializes the CPU, memory controller, and on-chip
    devices, and it initializes the memory map. The ROM startup code then executes
    a bootloader.


    +   3. The bootloader decompresses the Linux kernel into RAM from Flash memory
    or a TFTP server transfer. It executes a jump to the first instruction. The kernel
    first configures microprocessor registers and then invokes start_kernel, which
    is the architecture-independent starting point.


    +   4. The kernel initializes its caches and various hardware devices.


    +   5. The kernel mounts the root filesystem.


    +   6. The kernel executes the init process.'
