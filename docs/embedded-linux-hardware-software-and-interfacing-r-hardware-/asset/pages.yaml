  md: '# Measuring Interrupt Latency


    ![](img/6d9baeee8ddb96b5248c3d68b6bc0ecb_343_0.png)


    FIGURE 11.2 The MZ104''s interrupt signal.


    # Measuring Interrupt Latency on the MediaEngine


    The MediaEngine''s general-purpose input/output signal 1 (GPI01), located on target
    board''s connector J10, can generate SA-1110 Interrupt 1 on the rising edge, on
    the falling edge, or both. The Project Trablazer engineers decide to configure
    the interrupt controller for rising-edge operation. (For more information, see
    Section 9.2, "Interrupt Controller," of Intel SA-1110 Developer''s Manual.) The
    SA-1110''s interrupt controller is connected to the GPI01''s input, which monitors
    pin status, regardless of whether the pin is configured as input or output. The
    engineers set GPI01 as an output and then generate the interrupt signal. Figure
    11.3 shows the internal connection of GPI01 output register (GSPR/GPCR), the connection
    of the input register (GPLR), the connection to the interrupt controller and the
    external connection to the oscilloscope.


    Listing 11.2 shows the source code for the interrupt_latency_mediaengine.c device
    driver.'
