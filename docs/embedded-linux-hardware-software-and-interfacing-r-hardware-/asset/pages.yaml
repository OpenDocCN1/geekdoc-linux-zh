  md: 'which acts as a repository for current Linux USB driver information and organizes
    drivers into these categories: audio, communication, human interface devices,
    hub, image, keyboard, mass storage, multifunctional, networking, printer, scanner,
    vendor, and video. The site offers device and driver overviews, a searchable index,
    and the ability to add and edit device information. This USB information clearinghouse
    enabled the engineers to select hardware that had operational Linux USB drivers.


    # Project Trailblazer USB Hardware


    Based on driver functionality, component availability, and cost, the engineers
    selected the following USB devices for Project Trailblazer:


    +   * Yamaha YST-MS35D USB speakers

    * Kensington VideoCAM Super-VGA PC camera, model 67016

    * SanDisk USB SmartMedia card reader


    One additional product that caught the engineers'' attention was the JVC RK-8010VK
    receiver, with a USB input and 100-watt output channels. This could be a solution
    for powering audio to the Silverjack AirPark. The engineers couldn''t determine
    the device''s USB specs from online information, but they assumed that the device
    adheres to the USB Audio Class specification. Therefore, this chapter focuses
    on the Yamaha YST-MS35D USB speakers for use around the village. At this point,
    the engineers threw in an extra side project. They envied an image kiosk, which
    visitors could transfer, view, and see images as email messages from their personal
    digital cameras. These kiosks would be equipped with SmartMedia cards (future
    kiosks have Compact Flash readers), keyboards, monitors, and network connections.
    Guests would be able to insert their memory cards, view images, and select ele
    options. The remaining sections of this chapter address kernel configuration and
    supplemental software compilation to get these Project Trailblazer USB devices
    up and running using tbdev1.


