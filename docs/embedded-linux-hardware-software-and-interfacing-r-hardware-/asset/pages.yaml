  md: '# Safety Requirements


    TIP

    Defining high-level requirements and then forming the project''s system architecture
    helps developers and programmers understand the big picture. The requirements
    help answer the why questions and the architecture answers how a project is connected
    together.


    Safety is a prime concern at Silverjack. Quickly changing weather conditions could
    pose a serious health threat to guests and employees. The mountain peaks'' temperatures
    and visibilities always differ from those of the village. Project Trailblazer
    will collect and display resort temperatures and visibilities.


    Safety Requirement 1: Temperature Information

    The temperature differential between the mountain base and peaks routinely exceeds
    30 degrees. This differential could affect the health of guests, especially those
    who are inexperienced or unprepared. Project Trailblazer should collect and store
    the current temperatures for all key mountain locations. Project Trailblazer should
    display current temperature readings at the bottom of each lift. Project Trailblazer
    should provide a Web page displaying all the current temperatures.


    Temperature information collection and display is addressed in Chapter 10, "Synchronous
    Serial Communication Interfacing." Web integration is addressed in Chapter 12,
    "System Integration."


    Safety Requirement 2: Visual Information

    Mountaintop visibility could affect the health of inexperienced or unprepared
    guests. Project Trailblazer should collect and store current visibility information
    in the form of still images for all key mountaintop locations. Project Trailblazer
    should provide Web pages that display recent still images.


    Visual information collection is addressed in Chapter 8, "USB Interfacing." Visual
    information distribution is addressed in Chapter 12.


    # Operations Requirements


    The Operations Department manages and maintains Silverjack''s equipment. Operations
    seeks high efficiency at a low cost and achieves this through the effective use
    of manpower and low-cost equipment. Project Trailblazer addresses operations requirements
    in these areas: guest activities, snow-making control, lift monitoring, race timing,
    and music playback.'
