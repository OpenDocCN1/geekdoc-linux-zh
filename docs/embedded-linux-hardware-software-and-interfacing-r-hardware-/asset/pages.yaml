  md: '# CHAPTER 3 Selecting a Platform and Installing Tool Sets


    The Trailazer engineers are using the Embedded Planet RPX-CLLF (PowerPC MPC860)
    and the Brightstar MediaEngine (ARM SA-1110). They found two HOWTOs that explain
    explaining the GNU tool chain for the ARM and PowerPC processors:


    +   - The GNU Toolchain for ARM targets HOWTO: https://www.linux.org/docs/toolchain

    - The Linux for PowerPC Embedded Systems HOWTO: http://penguinppc.org/usr/embedded/howto/PowerPC-Embedded-HOWTO.html


    Reading these HOWTOs, the engineers discovered that building a cross-compiled
    version of the GNU tool chain is quite an operation. They first manually built
    the tool chain. Later, they switched kernel versions and found that they had to
    rebuild the tool because gcc and glibc depend on header files. Manually building
    the tool chain is tedious and prone to mistakes, so the engineers automated the
    process by developing a bash script called buildtoolchain.


    buildtoolchain can either PowerPC and ARM cross-compiled versions of gcc, glibc,
    gdb, GNU utilities, and a helloworld test program. The buildtoolchain script simplifies
    compiling of powerpc-linux and arm-linux-gcc, the appropriate glibc library files,
    and gdb. buildtoolchain isn''t a monolithic script with 12 steps; rather, it is
    a collection of 13 scripts. Because buildtoolchain is broken into steps, the build
    process can be restarted in case of failure. tdevdt (which is a 400MHz Celeron)
    requires more than an hour to completely run buildtoolchain.


    buildtoolchain starts by executing the script called buildtoolchain-environment,
    which sets a series of environment variables. buildtoolchain continues by executing
    additional scripts that perform these steps:


    +   1. Checks for the required source files:

    ```nbuildtoolchain-step01-check

    ```


    +   2. Cleans up builds:

    ```nbuildtoolchain-step02-clean

    ```


    +   3. Makes build directories:

    ```nbuildtoolchain-step03-makebuildldirectories

    ```


    +   4. Builds binutils:

    ```nbuildtoolchain-step04-binutils

    ```'
