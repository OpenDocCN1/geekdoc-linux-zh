    # Building the GNU Tool Chain for Cross-Compiling


    A cross-compiler runs on a processor but generates executable code for a different
    processor. For example, an ARM cross-compiler running on an x86 processor generates
    code for an ARM processor, and a PowerPC cross-compiler generates code for PowerPC.


    Why does Project Trailazer require a cross-compiler? Typically embedded systems
    don''t have the RAM or storage resources to compile their own executables. A host
    processor, in this case, can cross-compile code to create an executable. An executable
    is then transferred and executed on the target board. The GNU tool chain is capable
    of cross-compiling, but not as a command-line option. The entire tool chain requires
    compiling for operation as a cross-compiler. This is not a simple make, install,
    apt-get, or rpm process. The cross-compiler build process is not completely documented
    or kept current.'
