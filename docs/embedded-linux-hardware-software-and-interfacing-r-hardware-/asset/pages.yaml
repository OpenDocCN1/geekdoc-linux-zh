    # Using Interrupts For Timing


    The first snowfall at Silverjack filled the air with excitement. Soon the village
    would bustle and the slopes would open. In past years, many skiers and snowboarders
    would race against the clock on the mountain''s racecourse. This year, however,
    Project Trailazer wants to collect, display, log, and post race results. Using
    embedded Linux for Silverjack race timing will reduce data entry errors, increase
    efficiency, and enhance the racers'' experience.


    This chapter explores using Linux as an event timer with 1-millisecond resolution.
    The Project Trailazer engineers need to develop interrupt handlers for the target
    boards—the MZ104, the MediaEngine, and the RPX-CLLEF. Then they need to use these
    handlers to measure average interrupt latencies. The engineers need to design
    a race timer that uses a split interrupt approach with “top half” and “bottom
    half” handler routines, tasklets, and a self-rescheduling kernel timer.


    # Linux Timing Sources


    Linux provides several mechanisms for event timing, ranging from 1-second to submicrosecond
    resolution. This section discusses the following timing sources:


    +   - **date**—The resolution of date is 1s. Using the %+s formatter, date returns
    the number of seconds that have elapsed since 00:00:00, January 1, 1970.

    - **jiffies**—The resolution of jiffies is 10ms. On all platforms, Linux configures
    a hardware timer that interrupts the processor periodically—typically every'
  merge: -1
  pgno: 333
- img_proc: true
  md: '10ms (this value is defined in the kernel source as HZ). The timer interrupt
    routine increments the kernel variable jiffs by 1. Therefore, the value of jiffs
    represents the number of 10ms increments that have occurred since booting. It
    is possible to increase jiffs by altering the HZ source declaration, however could
    ultimately lower overall system performance due to increased interrupt processing.
    Other mechanisms offer higher resolution.


    +   - PSR—The resolution of PSR (which stands for processor-specific registers)
    is various. Some newer processors contain two 32-bit counters that increment on
    every system clock. The counters accessed through PSR provide resolutions that
    are dependent on processor clock speed. Kernel source provides functions to access
    the PSR. For example, the rdtsc function returns the timestamp counter (TSC) on
    Pentium and newer processors, and the get_tbl function returns the mbt register
    value on PowerPCs. 486 and ARM processors do not contain system clock counters.


    +   - get_cycles—The resolution of get_cycles is various. The get defined on all
    platforms, returns a count of system clock cycles that fit into a single CPU register.
    Typically this is the lower of the two 32-bit counters mentioned previously. If
    the processor does not contain a clock counter, get_cycles returns 0; get_cycles
    returns 0 on 486 and ARM processors.


    +   - do_getimeofday—The resolution of do_getimeofday is about 1µs. The do_getimeofday
    function fills a time structure with the number of seconds and microseconds elapsed
    since booting. The x86 and PowerPC kernel source claim near-microsecond resolution
    for do_getimeofday.


    The ProjectBlazer racer tier needs to have 1ms resolution. This eliminates using
    date and jiffs. The MZ104''s 486 and the MediaEngine/ARM processors don''t contain
    system clock counters, so the ProjectBlazer engineers cannot use PSR. The get_cycles
    function returns only a 32-bit counter value. On the slowest clocked target, the
    RX-CLI (at 70MHz), the get_cycles function can only count 61 seconds of microseconds.
    A typical race will be longer than 61 seconds, the get_cycles function won''t
    work for ProjectBlazer. This leaves the do_getimeofday function. With near-microsecond
    resolution and a 32-bit counter of seconds (2^32 = 49,710 days), the do_getimeofday
    will provide accuracy for even the longest race. The race timer''s interrupt routine
    can timestamp the race''s start and finish by using do_getimeofday. A scheduled
    task can later compute the race''s overall time.


    Interrupt latency is a measure of the time between an event occurring (for example,
    the race start) and when the processor executes the interrupt handler code. Even'
