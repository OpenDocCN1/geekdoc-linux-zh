  md: '# Asynchronous Serial Communication Interfacing


    # IN THIS CHAPTER


    +   * The Project Trailblazer Asynchronous Serial Hardware Development Environment


    +   * Linux Serial Communications


    +   * Additional Reading


    Project Trailblazer boards was proceeding nicely. The four target hardware boards
    had been booted, with bash running and an Ethernet network connection. The engineers
    were ready to begin tackling hardware interfacing. They decided to start with
    the guest authentication and lift access design. The Silverjack wants Project
    Trailblazer to replace paper lift tickets with low-cost radio-frequency identification
    (RFID) technology. Guests receive RFID tags that permit passage through an access
    point located at the bottom of each lift. These lift access points also display
    individual guest-specific messages. RFID tag reader receives display information
    via an asynchronous serial link. The access point display receives commands via
    an asynchronous serial link. The tag reader and display will connect to the target
    board''s serial ports.


    A guest can proceed through an access point after authentication by looking at
    signaling lights: A red light means permission to pass is denied, and a green
    light indicates permission to go. The permission signaling circuit requires a
    single bit of information. This bit of information, the RFID tag reader and access
    point display communication can be accomplished through the use of a target board''s
    serial ports.'
