  md: '# CHAPTER 7 Parallel Port Interfacing


    When it is loaded, this device driver asserts OUTPUT_ENABLE. It shields software
    developers from interface logic specifics. It provides bash script access to individual
    lift monitoring and snow-making equipment through a /proc file interface. Use
    of this device driver eases system equipment integration using bash scripts.


    # Summary


    This chapter covers a tremendous amount of information. The Project Trailblazer
    engineers started off by establishing their input and output requirements for
    lift monitoring and snow-making control through discussions with the Operations
    Department. They investigated I/O boards and decided on PC parallel port use.
    They then designed an interface to connect a PC parallel port to an input module
    and an output module. When they began writing control software, three approaches
    emerged: port I/O using in and outb functions, parallel port control using the
    Linux ppdev driver, and development of a custom device driver. The first I/O approach
    was simple. However, its had drawbacks that make it too risky. The second approach,
    using ppdev, didnt solve the drawbacks. The engineers needed to develop a custom
    device driver with an easy-to-use interface (that is, files in the /proc directory)
    for lift monitoring and snow-making control. The driver hides circuit-specific
    knowledge from the developer and provides an eloquent interface for bash scripting.
    The liftmon_snowcon device driver development was a little more complicated than
    the use of port I/O, but the benefits far outweighed the costs.


    # Additional Reading


    +   1. Riku Saikonen, "Linux I/O port programming mini-HOWTO," www.linuxdoc.org/HOWTO/mini/IO-Port-Programming.html.

    2. Tim Waugh, "The Linux 2.4 Parallel Port Subsystem," http://people.redhat.com/twaugh/parport/html/parportguide.html.

    3. Ori Pomerantz, "Linux Kernel Module Programming Guide," www.linuxdoc.org/LDP/lkmpg/mpg.html.

    4. Erik Mouw, "Linux Kernel Procfs Guide," http://kernelnewbies.org/documents/kdoc/procfs-guide/lkprocsfsguide.html.'
