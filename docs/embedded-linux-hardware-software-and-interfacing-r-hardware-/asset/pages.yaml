    **Figure 7.2** The parallel port software development test feature.


    An SPP has six inputs and four outputs Project Trailazer needs. However, some
    Silverjack locations will require eight outputs, so the parallel port alone doesn''t
    meet the lift monitoring and snow-making I/O requirements. The engineers designed
    an interface circuit, shown in Figure 7.3, that connects the PC port to two offshelf
    Grayhill I/O modules. This interface circuit consists of an input path that uses
    an buffer 74HC244, connected to an input module rack and an output path that uses
    an latch, 74HC533, connected to an output module rack. Both the buffer and the
    latch bus connects to the parallel port''s bidirectional data signals, D7–D0.
    The input buffer''s enable (/OE) and latch enable (/LE) connect to parallel port''s
    control lines. In an output operation, one that turns on or off an AC output module,
    a byte is pulsed by the parallel port''s data bus and the OUTPUT_LATCH signal
    is asserted. The latch transfers the data byte from the signal lines D7–D0 to
    its output signals that in turn drives the output module board. The board''s AC
    output modules'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# CHAPTER 7 Parallel Interfacing


    turn on or off corresponding to the bit pattern seen during the output operation.
    In an input operation, the parallel port''s bidirectional data bus, now configured
    for input, reads the D7–D0 signal lines driven by the input buffer. When the INPUT_ENABLE
    signal is asserted, the input buffer transfers the eight signals from the Input
    module and reads the D7–D0 signal lines accordingly. The parallel port control
    register contains 0s that results in the OUTPUT_ENABLE signal to not be asserted.
    This disables the output latch, This interface circuit will perform input and
    output operations by accessing the parallel port''s data and control registers.
    Datasheets for the 74HC244 and 74HC533 are available from Texas Instruments (www.ti.com).


    > TIP

    When you are designing circuitry, pay close attention to the hardware''s startup
    conditions. You don''t want the interface circuitry turning on or off devices,
    by itself your control software starts executing. You should look at register
    values and determine their effect on your logic circuitry. Then pull-up or pull-down
    resistors to force your logic into a known state. When the control software starts
    executing, it can take over and control your devices.


    | Control | OUTPUT_ENABLE | IE | | | |

    |---|---|---|---|---|---||

    | 14 | OUTPUT_LATCH | | 74HC244 | Graphit | Water Valve 1 |

    | 2-STORAGE | 01 | 01 | OCTAL | 70CK6 | Water Valve 2 |

    | 1 UNIFIED | 02 | 02 | INVERTING | 8 Channel | Water Valve 3 |

    | 2 INITIALIZE | 03 | 03 | | | I/O Module | | Heater 1 |

    | 3 SELECT | 04 | 04 | WITH 3-STATE | | Spare |

    | 4 D5 | 05 | | OUTPUTS | Output | Spare |

    | 5 D6 | 06 | | | | | |

    | 6 D7 | 07 | | | | | |

    | 17 | INPUT_ENABLE | | | | |


    FIGURE 7.3 Project Trailazer PC parallel port acquisition and control circuit.


