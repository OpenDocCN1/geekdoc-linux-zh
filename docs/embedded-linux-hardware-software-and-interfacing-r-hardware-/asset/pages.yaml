  md: '# CHAPTER 10 Synchronous Serial Communication Interfacing


    figure all this out. Nor did they want to risk making Linux unstable by incorrectly
    configuring MPC860 registers.


    The engineers chose to implement a MPC860 I2C bit-banging device driver for the
    SAA1064s. This driver will provide a named /proc directory entry interface, allowing
    for easy bash scripting. The I2C bus communications will be slowed, allowing for
    longer bus wire lengths. Their driver will be simple and reliable, and should
    provide exactly what the engineers need.


    The hardware interface uses the MPC860''s Port B because Port B offers open-collector/drain
    functionality. Remember that both I2C communication lines, SDA and SCL, are bidirectional.
    The unused lines PB30 and PB31 can serve as the SDA and SCL lines. Figure 10.7
