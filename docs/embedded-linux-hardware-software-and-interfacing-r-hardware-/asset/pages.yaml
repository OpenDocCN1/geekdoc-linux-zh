  md: '# SPI Communication and the LM70


    # TIP


    The LM70 is one device within an LM temperature sensor family offered by National
    Semiconductor. Other temperature sensors, as the LM78, provide additional on-chip
    interfacing capabilities. The LM78 has an on-chip temperature sensor, 7 analog
    inputs to monitor voltages, 3 tachometer inputs, a watchdog timer, an interrupt
    controller, and 32 bytes of RAM. See the National Semiconductor Web site (www.national.com)
    for more information.


    # SPI Communication and the LM70


    The LM70 operates in a continuous temperature conversion mode. In this mode, the
    LM70 operates as a slave device, accepting communication with a host microprocessor.
    It is an SPI-compatible device that communicates with the host via three signals:
    chip select (/S8), and bidirectional serial data line (S1/0). Synchronous communication
    with the LM70 is very simple. Because it determines the temperature (continuous
    conversion mode), the LM70 doesn''t require temperature conversion commands to
    be sent from the host, as do other temperature sensors. Also, the SPI bus doesn''t
    support multiple devices; therefore, SPI communication with an LM70 requires no
    packet format or address information. SPI communication consists of the host communication
    with the assertion of the LM70'' /S8 line, sending 16 clock pulses while reading
    the LM70''s output on the S1/0 signal, and then de-asserting the chip select.
    The LM70 outputs 10 bit temperature (most significant bit [MSB] first), 3 high
    bits, and 2 undefined bits on the falling edge of the serial clock signal. This
    11-bit temperature representation is a two''s-complement word with a least significant
    (LSB) resolution of 0.25°C.


    Let''s clarify this temperature value by examining the bits of two examples of
    temperatures. If the temperature was 25°C, communication with the LM70 would return
    the binary 0000 0100 1001 1111, which equals 0x09F. The five significant bits
    don''t contain temperature information, and they affect the magnitude of the temperature
    value. These bits are removed by dividing the temperature value by 32, which is
    2⁵. 0x09F divided by 32 is 0x64, which is equal to 100. Each least significant
    bit corresponds to 0.25°C; therefore, 100 times 0.25°C equals 25°C. If the temperature
    was -25°C, communication with the LM70 would return the binary 1111 0011 1001
    1111, which equals 0xF3F. Dividing by 32 results in a value of 0xF9C, which corresponds
    to -100. -100 times 0.25°C equals -25°C.


    The LM70 datasheet contains serial bus timing diagrams and switching characteristics.
    These specifications place an upper limit on communication speed, but that is
    not a concern in this design. In fact, this design will intentionally slow synchronous
    communication to increase design reliability. Typically, the Trailblazer target
