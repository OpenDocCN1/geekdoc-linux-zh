  md: 'board''s temperature sensor will be close—within about 20 feet—to measure

    outside temperatures, for example. Use of slow synchronous communication enables

    line drivers to overcome the extra capacitance to long wire lengths.


    A device driver communicating with the LM70 temperature sensor performs five

    steps:


    +   1. It initializes serial communication with SC high /CS high. It enters the
    start

    condition by taking /CS low.

    2. It takes data transfer by taking SC low. The LM70 then actively drives the

    SI/O signal with the first bit of information.

    3. It takes SC high and then samples the first data bit on the SI/O signal.

    4. It continues toggling the SC signal and sampling S1/O until 16 bits are received.

    5. It enters the stop condition and terminates communication by taking /CS high.


    # Connecting the LM70 to the x86 Parallel Printer Port


    The LM70 SPI signal lines—/CS, SC, and S1/O—as well as the power line and the

    ground (GND) connect directly to the parallel port (see Figure 10.1). The port
    portndrives /CS and SC but not S1/O. The LM70 drives the S1/O line, which returns
    the

    serial data stream. Because of its continuous conversion mode, there''s no need

    to send data to the sensor.


    | x86 Parallel Printer Port | 2 D0 | Power | V+ | LM70 Digital Temperature Sensor
    |

    |---|---|---|---|---||

    | | 3 D1 | Chip Select | /CS |

    | | 4 D2 | Serial Clock | SC |

    | Status 5 SELECT | S SELECT | Serial Data | S1/O |

    | | 25 GND | GND | GND |


    FIGURE 10.1 The LM70 temperature sensor connection to the x86 parallel printer
    port.


    TIP


    Check your x86 parallel printer port signal voltages before connecting your interface
    circuits.

    Some printer ports operate with +5V, and newer motherboards use +3.3V. You may
    not be

    able to power your +5 devices from a +3.3V signal. Or you might destroy +3.3V
    devices

    by connecting them to a +5V signal.'
