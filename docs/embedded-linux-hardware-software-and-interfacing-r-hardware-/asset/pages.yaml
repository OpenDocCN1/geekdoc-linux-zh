  md: '# Configuring the Kernel with SCSI Operation and SDDR-09 Use


    To use the SanDisk USB SmartMedia reader, you will need to configure and rebuild
    the kernel support for SCSI and SDDR-09. Follow these steps to configure and compile
    the kernel:


    +   Configure the kernel options with SCSI and SDDR-09, by using menuconfig:

    ```bash

    root@tdedev1[553]: cd /usr/src/linux

    root@tdedev1[554]: make menuconfig

    ```


    +   configure the kernel options using the up and down keys, scroll to the SCSI
    support item and press Enter. Select the SCSI support item and press the spacebar
    until a * character appears between < > (that is, <>). Select and configure these
    three SCSI support items:

    * <*> SCSI support

    * <*> SCSI disk support

    * <*> SCSI generic support


    Select Exit and press Enter. The SDDR-09 driver is considered new. You will not
    see an option for it in the USB support menu unless you configure the kernel for
    development drivers. Using the up and down keys, scroll to the Code Maturity Level
    options and press Enter. Select the Prompt for Development and/or Incomplete Code/Drivers
    item and press the spacebar until a * character appears between < >. Select Exit
    and press Enter. This takes you back to the main menu.


    +   Configure the USB support options. Using the up and down keys, scroll to the
    USB support item and press Enter. Configure these USB support items:

    * <*> USB Mass Storage support

    * <*> SanDisk SDDR-09 (and other SmartMedia) support (NEW)


    Select Exit and press Enter. This takes you back to the main menu. SmartMedia
    cards use the DOS FAT filesystem. You need to configure the kernel for DOS FAT
    filesystem support. Using the up and down keys, scroll to the File Items item
    and press Enter. Configure these file system items:

    * <*> DOS FAT fs support

    * <*> MSDOS fs support


    Select Exit and press Enter. This takes you back to the main menu.'
