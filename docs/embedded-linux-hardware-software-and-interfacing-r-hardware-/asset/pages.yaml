    # Collecting and Distributing Image Data


    The Project Trailblazer requirements call for image collection at the base and
    top of each lift, as well as at other than 20 targets with cameras. The image-grabbing
    software vaggrab, which is explained in Chapter 8, "USB Interfacing," performs
    a text overlay operation that labels an image with location and timestamp information.
    The Project Trailblazer engineers wanted to use this overlay functionality, but
    it would require individual configuration for each camera-equipped target board.
    For example, the bash script executing on the'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'target board at the top of Lift 1 would contain the text Lift 1 Top as the
    vgrabbj overlay command-line parameter. Likewise, the script executing at the
    top of Lift 2 would contain Lift 2 Top.


    # Lift 1 Base Temperature


    ![](img/6d9baeee8ddb96b5248c3d68b6bc0ecb_398_0.png)


    FIGURE 12.2 The Lift 1 Base Temperature Plot, with test data.


    You could store location information in a configuration file on each target board''s
    root filesystem. A bash script could open this file to determine what location
    text to use in the overlay. However, using a file still requires a unique location
    configuration for each image board. The engineers stayed away from unique configurations
    because it is time-consuming and potentially leads to problems. Taking a unique
    configuration approach requires complete and up-to-date project documentation.
    The Silverjack technicians who maintain field equipment will require additional
    training. They will need to learn how to configure the target boards properly
    before field installation. Image collection is more than convenience; it''s a
    safety system. Configuration mistakes result in system downtime, which could potentially
    put guests and employees in dangerous situations. The engineers wanted to design
    an image collection system that required no unique configuration for each target
    board.'
