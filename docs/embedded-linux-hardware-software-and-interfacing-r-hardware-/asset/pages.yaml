  md: '# CHAPTER 7 Parallel Interfacing


    Controlling a single snow-making branch requires at least four control outputs
    for this AC equipment::


    +   * Water Valve 1

    * Water Valve 2

    * Water Valve 3

    * Heater 1


    Some snow-making branches have six water valves and two heaters. The engineers
    began to explore options for process control that supported six inputs and four
    outputs (with the capacity for eight outputs). Numerous input/output (I/O) boards
    exist, from companies such as Computer Boards (www.computerboards.com), all of
    which exceed Project Trailazer for I/O as well as size. The engineers decided
    that because Project Trailazer has modest I/O requirements, the onboard PC parallel
    port is ideally suited for lift monitoring and snow-making control.


    # TIP


    > You should use solid-state relay modules to connect external devices to target
    boards. For types exists: input AC (IAC), output AC (OAC), input direct current
    (IDC), and output direct current (IDC). Both input and output modules provide
    electrical isolation that protects a target board''s sensitive circuitry. Mounting
    racks have module sockets, fuses, light emitting diodes (LEDs) showing operation,
    and barrier strips for field connections.


    This chapter discusses PC parallel ports, hardware interfacing, and three approaches
    to parallel port software development for data acquisition and control. The first
    approach, io, is simple, and clearly demonstrates the low-level hardware control
    that is necessary for device driver development. The second approach, pdev, uses
    Linux''s parallel port device driver to control the port. This approach is similar
    to serial control through the use of device files and the Project Trailazer engineers
    have implemented a solution for lift monitoring and snow-making control using
    port I/O or pdev; they decided to take the third approach; they created their
    own custom device driver that uses the /proc directory. This solution will simplify
    their future bash scripting. At first, the engineers were totally intimidated
    at the thought of device driver development. They''re great C programmers, but
    none knew anything about device drivers, kernel modules, or the process directory.
    After successfully developing a device driver, they had a new understanding of
    Linux.'
