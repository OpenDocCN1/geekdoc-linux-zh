  md: 'Trailblazer system integration is as simple as possible. Their approach uses
    bash scripts wherever on the target boards and on the server. Figure 12.1 shows
    a soft-ware block diagram for the Project Trailblazer system integration.


    # TIP


    A block diagram shows a high-level representation of a system''s major components,
    interfaces, and connections. It provides the big picture for a system.


    ![](img/6d9baeee8ddb96b5248c3d68b6bc0ecb_380_0.png)


    FIGURE 12.1 Target board and Silverjack Server software components.


    The engineers'' approach includes the following components:


    +   - bash scripting is used for field device control and for the Web server Common
    Gateway Interface (CGI).

    - Communication between field devices and the Operations Department uses the Hypertext
    Transfer Protocol (HTTP).

    - The nc program provides network communication for bash scripts.

    - A MySQL database stores all field data except for images, which are stored as
    files on the server.

    - The ggplot program generates any required data plots on demand.

    - The Apache HTTP server distributes data to field devices and to the Web.


    The remainder of this chapter describes how the Project Trailblazer engineers
    configured tbdev to act as the Silverjack server and provided system integration
    functionality for Project Trailblazer. This chapter focuses on three of the Project
    Trailblazer systems:'
