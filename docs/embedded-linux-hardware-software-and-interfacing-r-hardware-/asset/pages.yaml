    \ the output modules: There is no electrical mechanism to determine these bit\
    \ values, other than to keep track of the last value written. If multiple bash\
    \ scripts call thecontrol program, somehow these scripts need to store and recall\
    \ the last written bit value for their manipulation. The third drawback deals\
    \ with use of the ioperm system call. Only the root user can call non-root users'\
    \ bash access to the parallel port. Accessing the parallel port using inb and\
    \ out system calls, with these three drawbacks, is not ideal. Improper control\
    \ of snow-making equipment could lead to slope closures, operations failure, and\
    \ expensive repair."
