    After the kernel initializes its caches and various hardware devices, it executes
    the first user process, init, which spawns all other process. For order to run,
    it needs certain files and libraries to be present in the filesystem. On tbdev1,
    the engineers used a program called ldd to discover init''s shared library dependencies.
    This is the output of ldd:'
  merge: -1
