    Figure 9.3 shows the connections between the output latch (7HC574 Edge Triggered
    D Flip Flop with three-state outputs), the input buffer (7HC244 Octal Buffer with
    three-state outputs), and the RPX-CLLF. PA controls the OutputModuleEnable line.
    The signals A0, /OE, /WE1 and /CS5 control the eight line decoder that performs
    address and write sign encoding. Byte read and write operations are similar to
    those for the MediaEngine (see the section “Designing the External Interface Hardware
    for the MediaEngine,” earlier in this chapter). This design’s HC logic components
    are fast, but the Project Trailazer engineers want to configure the CPU to access
    this interface as slowly as possible because the I/O board trace capacitance could
    affect performance and reliability.


