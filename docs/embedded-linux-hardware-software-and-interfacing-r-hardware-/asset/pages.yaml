  md: '# CHAPTER 7 Parallel Port Interfacing


    Notice that there is no manipulation and that the device driver provides actual
    named files that correspond to the physical world.


    These requirements should simplify system integration using bash scripts. Scripts
    should work with named lift monitoring and snow-making files in the /proc directory.
    This driver overrules the limitations of I/O and ppdev by automatically enabling
    the OUTPUT_ENABLE signal and maintaining the latch output value internally. This
    approach is more robust and less prone to errors. Code can be added to helloworld_proc_module.c
    to enable these lifton_snowcon requirements.


    # Enhancements to helloworld_proc_module to Create


    lifmon_snowcon


    The lifton_snowcon module has module_init, module_exit, proc_read, and proc_write_routines,
    just like helloworld_proc_module. The lifton_snow init code doesn''t create /proc
    entries in the /proc directory. Rather, it first creates the directory /proc/trailblazer.
    Then it creates all the lifton_snowcon entries snowwatervalve1, snowwatervalve2,
    liftaams, liftmotorcontroller, and so—in the /proc/trailblazer. The function then
    fills each of the proc file''s data, read_proc, write_proc, and owner fields.
    it then writes 0 to the latch. This turns off all the output modules. it then
    asserts the OUTPUT_ENABLE signal. completes by writing a message to the system
    log.


    # TIP


    You should separate your /proc file entries from other system entries by making
    a directory within the /proc directory, using the proc_mkdir function. This makes
    it easy to identify your project''s /proc files.


    In Listing 7.5 there''s not separate proc_read and proc_write functions for each
    /proc file. The snow-making control files share the same write_proc routine, proc_write_snowcondata,
    and share the same read_proc routine, proc_read_snowuserdata. The data structure
    lifton_snowcon_data_t contains a bitmask to distinguish one /proc file from another.
    The bitmask matches up the hardware bit that is used to control the output port.
    For example, the snowwatervalve3 proc file''s data field contains a pointer to
    snowwatervalve3_data. snowwatervalve3_data.mask = SNOWWATERVALVE3, which equals
    0x04. 0x04 corresponds to D3, which controls the third output module (Water Valve
    3). Similarly, the lifmon proc share the same proc_read function and use data.mask
    to distinguish one from another.'
