    # Summary


    This chapter briefly introduced gdb. You used gdb to start and stop an executable
    and to examine and alter variables. Using the Project Trailbl target platforms,
    the Ethernet network, and cross-compiled versions of helloworld and gdbserver,
    performed remote debugging. You configured and tested boards mounting their root
    filesystem over NFS. The Project Trailazer engineers will use this combination
    of gdb, gdbserver, and an NFS-mounted target root filesystem to reduce development
    time and effort.


