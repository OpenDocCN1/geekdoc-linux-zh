    Driving the HC138''s A signal permits a state of eight inputs and eight outputs
    to be connected to the MediaEngine bus. GPIO104 asserts the OutputModuleEnable
    line, which enables the HC574''s output buffers. The HC574''s output can then
    turn the output modules on or off. The ready input signal, RDY, slows CPU and
    write operations for use with slow memory devices.


    TIP

    The MediaEngine''s ARM clock speed is 200MHz. This design''s high-speed CMOS logic
    components are fast, but the Project Trailbl engineers need to configure the CPU
    to access the interface circuit as slowly as possible because the I/O board capacitance
    could affect performance and reliability.'
