  md: '# Memory I/O Interfacing


    Skiers and snowboarders want snow and short lift lines. Silverjack supplements
    natural snowfall by snowmaking equipment. The Project Trailblazer engineers want
    to provide guests with lift status information. In Chapter 7, "Parallel Port Interfacing,"
    the engineers interfaced lift monitoring and snowmaking to the x86 parallel printer
    port, using an interface circuit connected to six input and four output modules.
    The ARM and PowerPC target boards have the capability to monitor the lifts and
    control the snow-making equipment. The MediaEngine and the RPX-CLL don''t have
    parallel printer ports, but they do offer extension connectors that are perfect
    for memory-mapped input/output (I/O).


    This chapter discusses how the Project Trailblazer engineers redesigned the lift
    monitoring and snow-making control interface circuit and device driver software
    module. This chapter steps through the process of designing memorymapped I/O hardware,
    configuring the CPU registers, and developing the driver software for the ARM
    and PowerPC target boards.


    # The Hardware Design Process


    The hardware design process can be broken down into eight phases:


    +   1. Design the external interface hardware.

    2. Find space in the memory map.

    3. Find the CPU configuration register base address.

    4. Configure the memory controller.

    5. Assign the output module enable signal.


    # IN THIS CHAPTER


    +   * The Hardware Design Process

    * Developing Lift Monitoring and Snow-Making Control for the MediaEngine

    * Developing Lift Monitoring and Snow-Making Control for the RPX-CLLF

    * Additional Reading'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# CHAPTER 9 Memory I/O Interfacing


    +   6. Configure the I/O port controller.


    +   7. Write the hellowrdbit testing driver.


    +   8. Write the liftmon_snowcoon device driver.


    Using memory-mapped I/O requires the interface circuit to appear as though it
    is a static RAM device. The circuit should respond to memory chip selection, write
    enabling, and the bidirectional data bus, and it should perform address decoding.
    The I/O requirements of six inputs and eight outputs can be implemented by usinging
    transfers. Upon reset, the interface circuit must not energize any output control
    module. When the liftmon_snowcoon device initializes (that is, when the module
    loads), it should turn off all output control modules and enable output module
    driving circuit.


    Memory-mapped I/O hardware connects to the CPU bus and acts like static RAM. The
    I/O interface circuit needs to be placed in the memory map where no other device
    or device (such as an Ethernet controller). Using manufacturers'' documentation,
    the Project Trailblazer engineers need to find a place in memory to locate the
    I/O circuit.


    The ARM and PowerPC processors configure their internal controllers and peripherals
    using special configuration registers that are located at a specific memory address
    upon. Using memory-mapped I/O requires determining the register base location.
    With this location and predefined offsets from this memory location, the CPU memory
    controller and general-purpose I/O port configurations can be modified.


    Some board designs and operating systems move the register base location after
    reset. It''s possible to fix the register address either in CPU documentation,
    in Linux source code, or by making a software system call.


    When the I/O circuit is physically mapped to a memory location, the CPU''s memory
    controller needs to be configured. The ARM and PowerPC memory controllers offer
    interfaces to SRAM, EPROM, Flash EPROM, DRAM, and SRAM-like devices in burst and
    nonburst modes. The Project Trailblazer engineers need to configure the ARM and
    PowerPC processors to access the I/O circuit as an SRAM-like device.


    The interface circuit designs a signal—called OutputModuleEnable—to control the
    output enable for the output control modules. The driver asserts OutputModuleEnable
    during initialization. Both the ARM and PowerPC processors have many pins that
    could serve as this control line. The Project Trailblazer engineers need to determine
    which unused pin, that''s available on an expansion connector, should be used.'
