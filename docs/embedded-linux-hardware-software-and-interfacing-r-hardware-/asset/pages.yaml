    As mentioned previously, using ppdev doesn''t solve the two port I/O drawbacks
    (OUTPUT_MEMORY and latch value retention). Then why discuss ppdev? Using ppdev
    gives you another approach to control the parallel port. snowmakingcontrol.c uses
    inb and out system calls that require ioperm. Using of ioperm requires root operation.
    SPP control using ppdev doesn''t require root operation. Access to the parallel
    port device driver, /dev/parport, can be controlled through file permissions.
    Non-root users can access the parallel port by using ppdev.


    # Developing a Custom Device Driver


    After twiddling parallel port bits using I/O and ppdev, the Project Trailblazer
    engineers decided that the potential failures due to drawbacks were unacceptable.
    Port I/O and ppdev approaches were error prone and risky. They needed a custom
    device driver for their interface circuit.'
