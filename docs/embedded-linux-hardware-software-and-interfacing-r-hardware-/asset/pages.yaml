  md: '# System Integration


    With all the Project Trailblazer field hardware interfaces developed and tested,
    the engineers were ready to integrate everything. In other words, they were ready
    to tackle system integration. They developed and tested the individual components
    of Project Trailblazer at the bash prompt on in the final design, these boards
    will not function autonomously. Input devices, such as lift-monitored devices,
    will collect information for storage elsewhere. Output devices will control hardware,
    based on information provided to them. For example, temperature displays will
    obtain the value to display from a database. Information will be passed between
    field devices and the database, via the Silverjack network.


    Project Trailblazer system integration needs to take place in two areas: field
    devices and the Silverjack server. The engineers need to connect field hardware
    to the database. In this chapter, you will see how the engineers developed the
    Project Trailblazer system integration by using bash², an Apache HTTP server²,
    a MySQL database², grep¹, and a networking connection utility program called netcat.


    # Integration Overview


    The integration task is to transfer data to the server’s database and then distribute
    that data back to the field and to the Web. Although Project Trailblazer has many
    field devices, the amount of data traveling back and forth consumes a small number
    of bytes. A variety of network communication protocols exist to connect the field
    devices to the Silverjack database. Each protocol offers different functionality,
    complexity, and target board file system usage. The engineers decided to keep
    the Project


    # IN THIS CHAPTER


    +   - Integration Overview

    - Installing the System Integration Applications

    - Creating and Testing the Project Trailblazer Database

    - Developing the Target and CGI Integration Scripts

    - Additional Reading'
