- img_proc: true
  md: '# Developing Lift Monitoring and Snow-Making Control for the MediaEngine


    configured for the slowest possible configuration of MSC2 for the liftmon_snowcon
    interface circuit. Table 9.3 shows the MSC2 bit field descriptions and the values
    used in this design.


    # TABLE 9.3 MSC2 Bit Field Descriptions and Design Values


    | Bits | Name | Value | Description |

    |---|---|---|--|

    | 1.. | RTS 1.0 | 01 | ROM Type: Nonburst variable-latency I/O |

    | 2 | RBW5 | 1 | ROM bus width: 16 bits |

    | 7..3 | RFS 4.0 | 11111 | ROM delay first access: delay set to maximum |

    | 12..8 | RDNS 4.0 | 11111 | ROM delay next access: delay set to maximum |

    | 15..13 | RDS 2.0 | 111 | ROM recovery time: recovery time set to maximum |


    The liftmon_snowcon interface design requires MSC2 to be 0b111111111111101 or
    0xFFFF.


    # Assigning the Output Module Enable Signal for the MediaEngine


    The MediaEngine bus expansion interface connector offers only GPIO14. Therefore,
    the Project Trailblazer engineers assigned GPIO14 to control the OutputModuleEnable
    signal.


    # Configuring the I/O Port Controller for the MediaEngine


    GPIO14 is a general-purpose I/O pin and has an alternate function: It can also
    be the transmit pin for UART. The Project Trailblazer engineers need to configure
    the ARM I/O port controller registers shown in Table 9.4 for GPIO14 output with
    no alternate function.


    # TABLE 9.4 Additional ARM register settings to make an output pin


    | Register | Description | Bit Setting | Description |

    |---|---|---|--|

    | GAFR | GPIO Alternate Function Register | AF14 = 0 | No alternate function |

    | GDPR | GPIO Pin Direction | PD14 = 1 | Output |


    # Writing the hell Testing Device Driver for the MediaEngine


    Now that the Project Trailblazer engineers have defined the memory space, and
    determined the register base addresses, assigned the OutputModuleEnable signal,
    and determined the configuration of the memory and I/O controllers, it''s time
    to write a helloworld program. Instead of printing "Hello world", this program
    should control signal lines. They decide to write a simple device driver to configure
    the ARM I/O and memory controllers and then control the GPIO14 and CS5 signals.'
