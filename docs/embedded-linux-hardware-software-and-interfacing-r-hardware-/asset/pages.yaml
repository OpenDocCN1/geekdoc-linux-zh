    This output shows that the RPX-CLLF has 16MB of memory, mapped to address 0x00000000
    (CS1). This 16MB extends to address 0x01000000, and 0xFA000000. Note that CS5
    is unused. Traditionally, in embedded 8xx devices, RAM is mapped at address 0x00
    and I/O devices are mapped above physical address 0xFA000000. That where the engineers
    decided to map the lift monitoring and snow-making control interface circuit.


    # Finding the Register Base Address for the RPX-CLLF


    To accommodate a wide variety of devices, the MPC860 CPU uses an internal memory-map
    register (IMMR) whose memory location can be modified via software controller.
    The PlanetCore Loader output in the section section reports that the address of
    the IMMR is 0xFA200000. Current or future Linux versions may not move the IMMR
    during the boot process. Device driver code written for the PowerPC8xx processor
    family should not hard-code the IMMR location as 0xFA200000. Rather, it should
    use the mfpr function, which finds the IMMR. Here''s a line of kernel code from
    arch/ppc/8xx_io/ethernet.c using mfpr:


    ```

    imap = (imap_*) (mfpr (IMMR) & 0xFFFF0000);

    ```


    By using IMMR with table offsets, the Project Trailazer engineers can configure
    all the MPC860 registers.


    # Configuring the Memory Controller for the RPX-CLLF


    The MPC860 features a sophisticated memory controller that is capable of interfacing
    with SRAM, EPROM, Flash EPROM, regular DRAM devices, self-refresh DRAM devices,
    extended-data-output DRAM devices, synchronous DRAM devices, and other peripherals.
    It performs this interfacing through either its general-purpose chip-select machine
    (GPCM) or a user-programmable machine (UPM). The interface circuit in Figure 9.3
    interfaces with the GPCM because it supports nonsubstantial memory-mapped peripherals.
    (See Chapter 16, “Memory Controller,” in MPC860 User Manual for more information.)'
