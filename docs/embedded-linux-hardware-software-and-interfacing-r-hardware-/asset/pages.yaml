  md: '# CHAPTER 11 Using Interrupts For Timing


    To measure the average interrupt latency, the Project Trailblazer engineers need
    to do the following:


    +   Write a device driver that contains the following:

    * Configuration code for the interrupt controller, if necessary

    * A request for the interrupt from Linux

    * A function that asserts the interrupt signal

    * An interrupt handler that deaserts the interrupt signal


    +   Connect an output port pin to a processor interrupt pin and to the oscilloscope-scope.


    +   Load the device driver.


    +   Assert the interrupt pin.


    +   Watch for the deassertion.


    +   Repeat steps 4, 5, and 6 to determine the average interrupt latency.


    As discussed in the section “Linux Timing Sources,” earlier in this chapter, the
    do_gettimeofday function provides information with microsecond resolution. By
    using two calls to do_gettimeofday, the device driver can calculate its own instantaneous
    interrupt latency. (Instantaneous in this case refers to the interrupt latency
    associated with a single interrupt event.) The instantaneous interrupt latency
    value will not be the same for interrupt events. The average interrupt latency
    is the numerical value of several interrupt latency values.


    The magnitude of the average interrupt latency is what the engineers want to determine
    for each of their target boards. They need to find out if it is greater than 1ms.
    A race timer with 1ms accuracy requires a timing source with interrupt latencies
    of less than1ms. The engineers need to write an interrupt latency device driver
    for each of their target boards. They then need to execute this driver several
    times, record the instantaneous interrupt latency values, and compute an average
    interrupt latency value for each board. With an oscilloscope measurement, the
    engineers can also verify the microsecond accuracy of the do_gettimeofday function.


    The three board interrupt latency device drivers contain four functions: init,
    proc_read, interrupt_latency, and cleanup. The init function creates a /proc directory
    called interrupt_latency and configures the processor’s interrupt controller and
    port settings. Reading from the interrupt_latency file calls the function proc_read,
    which generates an interrupt electrical signal. The device driver'
