    # TIP


    The vendor and product information pair identifies a unique USB device. Designs
    are often licensed to several companies for production and distribution. For example,
    two companies may offer USB cameras based on the same hardware design. These cameras
    are identical from an electrical perspective and can use the same USB driver.
    If you can''t find driver information for your USB device, use the vendor and
    product information pair.


