    processing using kernels and timers.


    # Race Timer Interrupt Processing Using Tasklets


    Complex or lengthy interrupt processing tasks are often split into two sections.
    The top-half routine executes at interrupt time, performs the minimal amount of
    work, and schedules the remainder of work, called the bottom half routine, to
    be performed at a later or safer time. The top-half routine can request execution
    with interrupts disabled; therefore, it should execute and terminate as quickly
    as possible. The kernel executes bottom-half routines with interrupts enabled.
    With Linux kernel 2.4 and above, the preferred way to implement bottom-half uses
    tasklets.


    Tasklets are declared using the DECLARE_TASKLET macro. This macro also associates
    a handler to the task. The top-half interrupt handler should schedule an already
    declared task for later execution. The kernel executes the scheduled task handler
    functions after all the interrupt handler completes before execution of the scheduler.


    In the race timer design, the interrupt handler, racetimer_interrupt, schedules
    the race timer’s handler routine, racetimer_do_tasklet, for later execution. The
    racetimer_do_tasklet function prints race status information to the system log,
    which is a somewhat lengthy process, and starts a system timer.'
