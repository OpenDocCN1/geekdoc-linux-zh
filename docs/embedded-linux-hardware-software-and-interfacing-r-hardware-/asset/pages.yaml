  md: '# CHAPTER 4 Booting Linux


    ```

    root@tbdev1[514]: ldd /sbin/init

    libc.so.6 => /lib/libc.so.6 (0x40015000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    The new root filesystem needs is /sbin/init, which requires

    /lib/libc.so.6 and /lib/ld-linux.so.2. By reading the man page for init,

    engineers determined that init uses a configuration file /etc/initabb

    contains instructions for init. On a desktop or server Linux, the init

    process initializes the networking and system services, and then it enters runlevel-

    tically the login process. On the target systems, the engineers are not concerned

    with runlevels per se; rather, they want to boot the system and get running. So

    they using a predefined runlevel, as in the Unix/Linux world. They are config-\uring
    init to simply initialize the network. Then they are configuring init to

    execute bash without authentication and to respawn bash if bash terminates.


    # TIP


    The kernel completes booting by executing the first user process, init''s scripts
    start all

    the services. You can configure init to start programs and then restart them if
    they

    terminate.


    The engineers examined the /etc/initabb file on the tbdev1 workstation. They then

    created a simplified version that initializes the network and then executes bash.

    Here''s their simplified initfile:


    ```

    id:2:initdefault:

    12:2:wait:/etc/init.d/rcS

    1:2435:respawn:/bin/bash

    2:6:wait:/etc/init.d/umountfs

    ```


    In this version of the /etc/initabb file, id:2:initdefault tells init the default

    level to enter. 12:2:wait:/etc/init.d/rcS tells init to run the /etc/init.d/rcS

    script before entering runlevel 2, and then wait for completion.

    1:2435:respawn:/bin/bash tells init to run /bin/bash and respawn it if it bash

    terminates. 2:6:wait:/etc/init.d/umountfs tells that upon entering runlevel

    6, someone is rebooting the target board, to run the umountfs script and wait
    for it

    completion.


    # Required Files for bash


    The shell requires libraries to execute. On tbdev1, the engineers again used ldd

    to discover bash''s shared library dependencies. Here is the output of ldd:'
