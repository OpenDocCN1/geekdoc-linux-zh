- img_proc: true
  md: 'In this chapter, you''ll develop three C programs: one that sets the serial
    port control signal (setSerialSignal), one that queries the control signal (getSerialSignal),
    and one that sends and receives asynchronous communication (querySerial). Ultimately,
    within the Project Trailblazer, bash scripts on the target boards call all these
    programs and provide system integration to the Silverjack server. (Chapter 12,"System
    Integration," addresses all system integration development.) This chapter discusses
    how to develop a serial interface for the Project Trailblazer access points callable
    from bash.


    The original RS-232 standard, defined by the Electronic Industry Association and
    the Telecommunications Industry Association (EIA/TIA), in 1962, is a complete
    standard that specifies electrical, functional, and mechanical characteristics
    for communications between host and peripheral equipment. RS stands for *recommended
    standard*. The characters RS have been officially replaced by the characters EIA/TIA
    to identify the source of the standard. Nonetheless, people continue to use the
    term RS-232. In this chapter, RS-232 is synonymous with EIA/TIA-232.


    > Dallas Semiconductor''s Application Note 83,"Fundamentals of RS-232 Serial Communications"
    fully describes RS-232. This application note covers electrical, functional, and
    mechanical characteristics, explains implementation and signaling, and describes
    PC/modem communications and limitations.


    # The Project Trailblazer Asynchronous Serial Hardware Development Environment


    The Project Trailblazer serial development environment consists of the development
    workstation, tbdev1, target platform and the peripheral devices: RFID tag reader,
    LCD display, and lift access permission signal. Figure 6.1 shows the various electrical
    connections and signal. ESPTech of Lakewood, Colorado, supplies the RFID tag reader.
    Scott Edwards Electronics supplies the serial LCD display. The access permission
    circuitry driven by an RS-232 signal illuminates a red light or green light.'
