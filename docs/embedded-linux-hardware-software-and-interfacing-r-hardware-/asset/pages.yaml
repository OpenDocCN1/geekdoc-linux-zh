  md: '# Developing a Custom Device Driver


    Armed with their interface circuit, port I/O, and ppdev knowledge, the Project

    Trailblazer engineers developed a few requirements for their first device driver:


    +   - The driver should load at startup.

    - When loaded, the driver should enable the latch output to drive the output

    modules.

    - The driver should shield software developers from interface logic specifics.

    - The driver should offer control of individual pieces of snow-making equipment

    without requiring the developer to perform bit manipulation.

    - The driver should offer monitoring of individual lift signals without requiring

    the developer to perform bit manipulation.


    The engineers started learning about device driver development by reading. own

    Corbet''s Linux Drivers (published by O''Reilly) offers a complete discussion

    of driver development. It covers kernel version 2.4 and new kernel additions.

    Unfortunately, after reading this book, the engineers still didn''t know where
    to start.

    Then they found the "Kernel Module Programming Guide," which steps

    through kernel module development, device files, /proc filesystem,

    communications with device files, I/O controls, blocking processes, scheduling
    tasks,

    and interrupt handlers. The engineers learned the following about device drivers:


    +   - Device drivers are accessed through file operations such as read and write.

    - Device drivers run in the kernel space.

    - Device drivers can be written as loadable modules.

    - Device drivers running in the kernel do not have access to glibc.

    - Device drivers that have memory problems (for example, array out of bounds)

    crash the kernel.

    - Traditionally, accessing device drivers is performed through file operations
    in

    the /dev directory.

    - Device files in the /dev directory require static or dynamic assignment of major

    numbers, the general class of the device.

    - Static assignment of major numbers creates the potential for device drivers
    to

    cl with each other.

    - Dynamic assignment of major numbers introduces a small inconvenience in

    locating the device driver.

    - Device drivers can exist in the /proc directory.'
