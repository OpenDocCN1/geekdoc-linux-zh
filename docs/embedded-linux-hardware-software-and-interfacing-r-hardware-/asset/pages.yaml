    TIP


    There''s a slight difference between the register configuration of helloworld_rpxllf.c
    and that of helloworld_mediaengine.c. The RPX-CLLF version uses a register structure
    whereas the MediaEngine version uses offsets from a register base address. The
    PowerPC programmers developed the imaju structure to make coding easier and less
    error prone (see /usr/src/powerpc-linux/include/asm-pc/8xx_immap.h). helloworld_rpxllf.c
    uses the immap register instead of defining offsets from the base register address,
    as in helloworld_mediaengine.c.


