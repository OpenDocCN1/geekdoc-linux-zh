  md: "# CHAPTER 5 Debugging\n\n| tbdev1 | eth0 |\n|---|---|\n| ttyS0 9600 8N1 | x86\
    \ 192.168.1.11 |\n| tfp server, NFS Server, gdb |\n\n| tbdevarm | eth0 |\n|---|---|\n\
    | BSE MediaEngine | \n| ttyS0 9600 8N1 | 192.168.1.21 |\n| gdbserver helloworld-arm-linux\
    \ |\n\n| tbdevmz | |\n|---|---|\n| Tri-M MZ104 | |\n| eth0 192.168.1.23 | |\n\n\
    | tbdevppc | eth0 |\n|---|---|\n| EP RPX-CLLF | \n| eth0 192.168.1.22 | |\n\n\
    | tbdevcots | |\n|---|---|\n| x86 COTS PC | |\n| eth0 192.168.1.24 | |\n\n**FIGURE\
    \ 5.2** The Project Trailblazer development stations and their IP addresses.\n\
    \nHere are the steps to install, configure, and run the NFS server on tbdev1:\n\
    \n+   1. Install the NFS server on tbdev1:\n\n```\nroot@tbdev1[50]: apt-get install\
    \ nfs-server\n```\n\n+   2. Configure tbdev1's NFS server by adding an entry to\
    \ its configuration file, /etc/exports, for each target platform. Each entry contains\
    \ a directory, an IP address, and mounting permissions. To do so, add lines to\
    \ /etc/exports:\n\n```\n- /tftpboot/arm-rootfs 192.168.1.21(rw,no_root_squash)\n\
    - /tftpboot/powerpc-rootfs 192.168.1.22(rw,no_root_squash)\n- /tftpboot/i386-rootfs\
    \ 192.168.1.23(rw,no_root_squash)\n- /tftpboot/i386-rootfs 192.168.1.24(rw,no_root_squash)\n\
    ```\n\nThe mounting permissions shown here are rw and no_root_squash. rw allows\
    \ the clients (the target boards) to mount their root filesystems with read and\
    \ write permissions. The no_root_squash option allows the clients to mount their\
    \ root filesystems as user root on tbdev1. See the exports man page for more information."
