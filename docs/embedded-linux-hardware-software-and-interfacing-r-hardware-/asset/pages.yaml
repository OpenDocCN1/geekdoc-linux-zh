    # Creating the root Filesystem


    The Trailblazer engineers’ decision to use the MontaVista compiled versions of
    the binary, library, and configuration files that are required in order for the
    kernel to execute init and bash was just the beginning. Many Linux programs aren''t
    distributed singly; rather they’re grouped by functionality and distributed as
    a package. For example, the ls program doesn''t exist as is package, nor does
    the ls source code exist on its own. The GNU binaries bundled ls and other utilities
    copied into the fileutils package, which contains chgrp, chmod, chown, cp, dd,
    df, dir,icolors, du, install, ln, is, mkdir, mkfifo, mknod, mv, rm, rdir, touch,
    vdr, and sync. If you want the ls program, you have to extract it from the fileutils
    package.


    You should extract files from packages into a temporary directory. After all the
    packages, the required binaries from Table 4.1 should be copied from the temporary
    directory to a new root filesystem directory. Linux distribution packages, whether
    they’re Red Hat Package Management (RPMs) files or Debian Package Management (deb)
    files, contain extra files, such as man pages, that may not have any application
    in the new root filesystem. These extra files take up space. When you build the
    root filesystem, contents of a package are extracted to a temporary directory
    and then you can copy required files to the new root filesystem directory. Later,
    this new root filesystem directory can be used to create the actual root filesystem
    that the target systems will mount.


