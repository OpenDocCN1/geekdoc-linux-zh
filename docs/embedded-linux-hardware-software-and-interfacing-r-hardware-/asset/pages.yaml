  md: 'Additional Reading


    403


    Most of the Project Blazer hardware connected to the MediaEngine or RPX-CLLF was
    debugged using this capability. These target boards also offer easy interface
    connectors to the CPU bus. Both the StrongARM 1110 and the PowerPC MPC860 processors
    contain a variety of on-board peripherals that permit external interfacing without
    additional hardware controllers. Your design might require the universal serial
    bus, inter-integrated circuit (I2C) communications, serial peripheral interface
    (SPI), or memory-mapped input/output. An ARM or PowerPC processor might easily
    contain the peripherals your design requires. This would reduce your design time,
    part count, physical size, and cost while increasing reliability. Kernel version
    availability is a potential drawback of selecting an ARM or PowerPC solution.
    ARM and PowerPC kernel patches require development time. Patch releases for processors
    typically lag releases.


    # Summary


    The world wants smart, network-connected devices. This desire will only increase,
    and these devices will pervade our lives as we can only imagine. Processor and
    memory advances enable developers to concentrate on the application, not the technology.
    Powerful hardware is not only commonplace but also inexpensive. This combination
    allows Linux to move into the embedded world. It brings reliability, features,
    open-source code, and a proven track record.


    You now have the tools, the development environment, the hardware examples, and
    the knowledge you need to build your future. Unencumbered by technology, you can
    use your imagination, creativity, and expertise to create extraordinary products.
    Your designs can build and power the world.


