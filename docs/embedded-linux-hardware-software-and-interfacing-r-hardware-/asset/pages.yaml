    In addition to init, initab, rS, mountfs, ld-linux.so.2, and libncurses.so.5.
    The new root filesystem needs bash, around the /bin, /sbin and /usr/bin directories
    and that the following programs would also be needed to operate in a functional
    system: cat, ls, mount, ps, df, kill, chmod, touch, ifconfig, telnet, and gdbserver.
    They checked for shared library and configuration file dependencies, and after
    a trial and error, they compiled the root filesystem file list in Table 4.1. These
    files exist in a directory that consists of the following directories: /bin, /dev,
    /etc/init.d, /lib, /proc, /sbin, /tmp, /usr/bin. With this root filesystem, the
    kernel calls init, which initializes the network and then executes bash. A user
    can ping other network computers and run helloworld. This booted system will fulfill
    all seven PBRs.


    > TIP

    The Linux program ldd outputs a list of shared libraries required by a program
    or library. When adding programs to the root filesystem, one should use ldd to
    determine whether additional libraries are required.


