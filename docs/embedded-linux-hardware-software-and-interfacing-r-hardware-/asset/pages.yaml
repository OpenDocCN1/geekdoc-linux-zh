    +   4. Connect the S1064 SDA and SCL lines to the x86 printer port and connect
    the ground lines to a floppy disk controller. The author of i2c-pport has written
    instructions for connecting I2C devices to the parallel printer port (/root/i2c-2.6.1/doc/i2c-pport).
    The parallel port''s control lines allow for bidirectional communication. The
    i2c-port driver uses the control line active line for SDA and the control line
    initialize printer signal for SCL. Figure 10.5 shows the complete schematic for
    connection of four saa1064 that drives the four seven-segments LEDs.


    > TIP

    You can provide an interface circuit from the PC''s power supply. The floppy disk
    controller provides +5VDC, +12VDC and ground connections. The connector''s 0.1-inch
    pin spacing allows for use of standard headers, simplifying the wiring to your
    interface board. A 250-Watt power supply can typically source more than 20A from
    the +5V supply and 5A from the +12V supply. See your PC''s power supply for actual
    specifications.


    +   5. Write, compile, and run a program that communicates with the device driver.

    The device driver saa1064_x86.c communicates with the SAA1064 via the i2c-pport
    device driver. SAA1064_x86.c opens the device file, uses ioctl1 to set the I2C
    slave address, uses the write system call to send a 6-byte stream to the SAA1064,
    and then closes the device file and exits. The 6-byte stream consists of the following:


    +   * Byte 1—The internal starting Saa1064 register address

    * Byte 2—The configuration register setting

    * Byte 3—The LED segment value 1'
