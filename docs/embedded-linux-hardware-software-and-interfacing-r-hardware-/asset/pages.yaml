    posed that question to seven experts. These experts agree that a real-time system
    guarantees a deterministic response to event and that a late response is considered
    a system failure. They also agree that soft real-time systems attempt to minimize
    response time and don''t consider late responses a system failure. The experts''
    opinions diverged when addressing real-time implementation and system performance
    characterization.


    One performance aspect of Linux is clear: Stock linux the kernel and device drivers
    to enable interrupts. This could seriously affect a system''s responsiveness.
    Fortunately, open-source code availability has allowed solutions to be developed
