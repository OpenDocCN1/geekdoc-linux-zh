    # I2C Communication with the Philips Semiconductor SAA1064


    The Project Trailblazer engineers use the Philips Semiconductor SAA1064 to interface
    four seven-segment LED displays to a target board that uses I2C bus signaling.
    In I2C requires two bidirectional signal lines: serial data (S) and serial clock
    (SCL). This bus supports multiple slave devices through software-addressing in
    which each device has a unique address. I2C communication is 8-bit communication,
    with the data receiver acknowledging the reception of each transferred byte. Bus
    devices connect or disconnect at any time, without restarting the master. Philips
    offers complete and thorough I2C documentation.


    Up to four SAA1064 can connect on a single I2C bus. Therefore, the engineers can
    use to display the lift top and bottom temperatures in both Fahrenheit and Celsius.
    Each SAA1064 can drive up to four seven-segment LED displays, for a total of 16
    LEDs on a single serial bus. The SAA1064 design lowers overall package pin count
    with two multiplexing LED drive circuits that control two common-anode segments.
    (See SAA1064 Datasheet for more information.)'
  merge: -1
