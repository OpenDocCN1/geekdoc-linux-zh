  md: "capture at the bottom and top of each lift, as well as in other Silverjack\
    \ locations. Equipment costs will therefore add up quickly. The engineers need\
    \ a low-cost solution for audio playback and image capture. Unfortunately, the\
    \ Project Trailblazer target platforms don't have peripheral interconnect (PCI)\
    \ card bus connectors. Therefore, the engineers opted to use serial bus (USB)\
    \ speakers and cameras. The consumer market has driven the price of speakers and\
    \ cameras very low—in the $30 range. The engineers know that the majority of USB\
    \ devices available today support Windows drivers. They didn't know which devices\
    \ and their drivers support Linux. The engineers figured that if the drivers did\
    \ not exist, they may have to write their own.\n\n# Learning About USB\n\nThe\
    \ engineers found USB Complete by Jan Axelson, which claims to tell “everything\
    \ you need to develop USB peripherals.” The first half of this book explains USB,\
    \ data transfers, and device identification (called enumeration). The second half\
    \ addresses device hardware design using chipsets. The book content isn't an exact\
    \ match for developing Linux USB drivers, but it provides a great introduction\
    \ to USB communications. Here's what the engineers learned:\n\n+   - The USB bus\
    \ is asynchronous serial, with differential signaling.\n- USB is plug-and-play;\
    \ the user doesn't configure memory addresses, I/O addresses, interrupts or direct\
    \ memory access (DMA).\n- USB v1.1 supports a 12Mbps data rate.\n- USB v2.0, which\
    \ is relatively new, supports a 480Mbps data rate.\n- The USB bus supports up\
    \ to 127 devices, using a tiered topology of hubs and devices.\n- USB devices\
    \ are self-describing.\n- USB supports four transfer modes that address the bandwidth\
    \ requirements of different devices:\n  - Interrupt transfers support periodic\
    \ bandwidth.\n  - Isochronous transfers support guaranteed bandwidth.\n  - Control\
    \ transfers support guaranteed bus access.\n  - Bulk transfers support low-priority\
    \ large data transfers.\n- The USB controllers prioritize communications by using\
    \ the four transfer modes to optimize bus communications."
  merge: -1
