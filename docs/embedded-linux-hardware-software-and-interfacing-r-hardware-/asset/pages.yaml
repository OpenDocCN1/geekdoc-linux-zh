  md: '# Summary


    If you build and distribute a kernel that includes your device driver, then your
    device driver code is automatically included under the GPL and you must make your
    source code available to customers. Device drivers or modules that load dynamically
    after the kernel boot process are not included under the GPL, and you don''t have
    to distribute your source code.


    NOTE


    Designing products with Linux and other open-source software doesn''t mean you
    have to make your software open source. Use of loadable modules and LGPL libraries
    protects your intellectual property.


    If an embedded product executes solely in the user space (that is, it has no kernel
    code or drivers), it is not affected by the Linux kernel source code GPL. An embedded
    product running an application in the user space can be affected through linking
    to libraries that are included in the GPL or another licensing model, called LGPL.
    called the Library General Public License, LGPL now stands for Lesser General
    Public License. This licensing model allows developers to link to code, without
    having their code automatically included under the GPL. GNU released under LGPL.
    If an embedded application statically or dynamically links to glplibc for functionality,
    the application is not included under the GPL or LGPL, and you do not have to
    release your source code.


    Use of open-source software promotes creativity and allows developers to quickly
    design embedded applications that are reliable and robust. Using your embedded
    design on open source software doesn''t automatically mean that you have to release
    your intellectual property in source form. It''s quite possible that you can develop
    device drivers and kernel modules that load after the kernel boot process and
    your user space application code links to LGPL libraries.


    # Summary


    Linux was created more than a decade ago. Since then, countless programmers have
    enhanced it, it has more features, and made it efficient, reliable, and robust.
    Today, thousands of businesses rely on Linux for daily client and server operations.
    Linux has a proven track record. Commodity pricing of microprocessors and memory
    devices will make future embedded designs using 32-bit architectures commonplace.
    Linux is already ported to these architectures and embedded Linux products exist
    in the marketplace. Embedded system designers adopting Linux enjoy open source
    availability, POSIX compliance, solid reliability, a large application base, and
    no licensing fees. These benefits, combined with commodity pricing, make Linux
    an excellent solution for an embedded operating system.'
