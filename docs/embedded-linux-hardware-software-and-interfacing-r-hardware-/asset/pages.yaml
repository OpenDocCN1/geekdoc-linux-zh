  md: '# Standard Parallel Port Control Using ppdev


    The parallel port control approach described in the next section—using the parallel
    port device driver (ppdev)—has the same two drawbacks as the port I/O approach.
    In the following section you will implement snowcontrol.c functionality using
    ppdev instead of outb. This includes here for Linux completeness but isn''t considered
    a viable option for snow-making control. The custom device driver, developed later
    in this chapter, has no drawbacks and implements a robust and eloquent solution
    for lift monitoring and snow-making control.


    # Standard Parallel Port Control Using ppdev


    Using in and outb isn''t the only way to query and control the PC parallel port''s
    data, control, and status registers. The Linux parallel port device driver, ppdev,
    also allows for this control, by ioctl. This approach is similar to the approach
    used in Chapter 6, "Asynchronous Serial Communication Interfacing," to control
    the serial port. A file (/dev/parport0) is opened, and a file descriptor is returned.
    With this descriptor, ioctl set individual control bits, query the port status,
    and read to the port''s data bus. The program in Listing 7.3, snowcontrolppdev.c,
    uses ppdev to control the parallel port registers that control the interface circuit
    in Figure 7.3. ("The Linux 2.4 Parallel Port Subsystem" provides a complete discussion
    of parport and ppdev.) The following are the steps that the snowcontrolppdev program
    takes:


    +   1. It opens the /dev/port0 file.

    2. It requests access to the port, by using PPCLAIM.

    3. It configures the port for SSP mode, by using IEEE1284_MODE_COMPAT.

    4. It sets the OUTPUT_ENABLE line for latch output drive.

    5. It writes the command-line argument 1 to the data bus.

    6. It toggles the OUTPUT_LATCH line to latch data to the output module.

    7. It releases the port.

    8. It closes the /dev/port0 file.


    LISTING 7.3 The snowcontrolppdev.c Program


    ```

    /*

    * snowcontrolppdev v0.1/9/25/01

    * www.embeddedlinuxinterfacing.com

    *

    * The original location of this code is

    * http://www.embeddedlinuxinterfacing.com/chapters/07/

    ```'
