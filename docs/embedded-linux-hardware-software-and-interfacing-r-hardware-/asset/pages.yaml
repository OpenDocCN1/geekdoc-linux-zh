  md: '# SPI Communication and the LM70


    +27 root@tbdev1[519]:


    Embedded designs often implement bit-banging routines to communicate with synchronous
    serial devices. In the interfacing example shown in Listing 10.1, a bitbanging
    function, getTemperature communicates with the LM70 that is connected to the x86
    parallel port port. Communication delays can be increased to allow for lower communication
    signals between the host CPU and the temperature sensor.


    This example clocks in only 16 temperature data bits. Although it is short, the
    bitbanging operation requires CPU cycles. Bit-banging operations for long serial
    communication streams. This affects the performance of other programs because
    it does not interrupt driver routines.


    Other CPUs can contain dedicated peripherals for synchronous communications, alleviating
    the CPU from having to perform the bit-banging chores. Both the ARM SA-1110 and
    PowerPC MPC860 contain SPI synchronous communication controllers.


    # Connecting the LM70 to the MediaEngine


    The MediaEngine allows access to the ARM SA-1110''s Serial Port 4 through the
    J13 controller. Selecting Port 4 contains two synchronous serial controllers:
    the multimedia communication port (MCP) and the SSP. register configuration selects
    which controller attaches to the pins of Serial Port 4. Selecting neither allows
    these pins to become general input/output (I/O) pins. The Project Trailazer engineers
    implement a bit-banging algorithm for the ARM processor, but they don''t. The
    SA-1110 SSP controller supports SPI, which makes it ideal for synchronous communication
    with the LM70. (See section 11.12.7, "SPP Operation," of SA-1110 Developer''s
    Manual, for more information on SSP) Figure 10.3 shows the connection between
    the MediaEngine and the LM70 temperature sensor.


    The MediaEngine LM70 driver uses I/O operation. That is, it doesn''t use CPU interrupts
    or direct memory access (DMA). Synchronous communication with the LM70 is short
    and simple; introducing interrupts and DMA channel usage would unnecessary complications.


    Programmed I/O polling is simple. Prior to SPI communication, the SA-1110 SSP
    receive first in, first out (FIFO) buffer is cleared. The getTemperature function
    starts SPI communication and continuously monitors the SSP busy flag Status Register
    (SSSR). When SPI communication completes, the busy flag is cleared and the SSP
    Data Register (SDDR) contains the 16-bit temperature reading. Programmed I/O'
