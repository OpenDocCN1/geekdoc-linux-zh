    > TIP

    With interrupt latencies in the microsecond range, Linux routines can easily count
    mechanical switches. If you would like to see this for yourself, use a toggle
    switch to generate the interrupt signal on the parallel port ACK line. Then examine
    the interrupt count in the /proc/interrupts file. You should see that one switch
    closure in more than one interrupt. Mechanical switches alone should not be used
    to generate interrupt signals in interrupt-based designs or during interrupt driver
    testing. Use a switch debounce circuit or device driver, for the parallel port,
    that drives the ACK line from another parallel port pin. The gate_x86 device driver
