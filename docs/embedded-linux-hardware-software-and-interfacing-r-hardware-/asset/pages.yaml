    8. init reads its configuration file, /etc/inittab, and executes scripts. Typically,

    init executes a startup script, /etc/rc.d/rcS, which configures and startsnnetworking
    and other system services.


    9. init enters a runlevel where system duties can be performed or the login

    process can start, allowing for user sessions.


    The Project Trailblazer engineers learned from the board manufacturers'' document-

