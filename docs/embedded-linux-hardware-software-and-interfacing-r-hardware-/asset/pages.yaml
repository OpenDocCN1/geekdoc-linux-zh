    # Providing Serial Communication for bash Scripts, Using querySerial


    The querySerial program provides serial communication functionality for bash scripts.
    Project Trailblazer use querySerial to communicate with the lift access point
    and output hardware—the RFID tag reader and the message display. querySerial command
    line requires the port, the baud rate, the timeout, and a command to be set. querySerial
    performs the following procedures:


    +   1. It opens the requested port.

    2. It sets the baud rate.

    3. It configures the input buffer.

    4. It sets noncanonical mode.

    5. It sets the timeout.

    6. It sends the user supplied command.

    7. It awaits a timeout.

    8. It returns the received characters.

    9. It exits.


    These operations are similar to those for polled serial communications, except
    for the noncanonical mode setting. As previously mentioned, the Linux serial driver
    contains code for model control and terminal operation. To optimize communications
    over serial links, this driver has a mode called canonical that performs various
    character translations, echoing, command-line processing, and other manipulations.
    Project Trailblazer doesn''t require any serial communications processing. Therefore,
    the serial port should be configured in noncanonical mode.'
