    a wire.

    The following console output shows an instantaneous result for the MZ104 target
    board:


    ```

    bash-2.04# insmod interrupt_latency_x86.0

    interrupt_latency_x86 1.0 initialized

    bash-2.04# cat /proc/interrupts

    CPU0

    0: 4188487 XT-PIC timer

    1: 2057 XT-PIC keyboard

    2: 0 XT-PIC cascade

    4: 6016 XT-PIC serial

    7: 0 XT-PIC interrupt_latency

    10: 14884 XT-PIC usb-uhci

    12: 102528 XT-PIC eth0

    14: 3518 XT-PIC ide0

    15: 2541 XT-PIC ide1

    NMI: 0

    ERR: 0

    bash-2.04# cat /proc/interrupt_latency

    Start 1006763905.483513

    Finish 1006763905.483566

    Latency 53

    Count 1

    ```


    The /proc/interrupts file shows that the interrupt_latency routine is registered
    on Interrupt 7. Reading from the /proc/interrupt_latency file shows an instantaneous
    latency of 53µs. Figure 11.2 shows an oscilloscope capture of the interrupt signal.


    The oscilloscope interrupt signal measurement shows a latency of 44.75µs, whereas
    the driver returns a calculated latency of 53µs. This small inaccuracy, 8.25µs
    discrepancy is not an issue because the race timer requires 1ms, 1000µs resolution.
    8.25 is negligible compared to 1000.


    By using a latency device driver and oscilloscope measurements, the Project Trailblazer
    engineers calculated the MZ104 average interrupt latency to be approximately 50µs.
    The x86 version of the do_gettimeofday function has near-microsecond accuracy.'
