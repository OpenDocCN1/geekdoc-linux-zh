  md: '# Linux serial Communications 145


    The Linux serial driver provides functionality for modem control through the serial
    port control signals DTR and RTS. DTR controls the on-hook/off-hook modem status,
    and RTS controls serial data flow control. In most communications applications,
    the program opens a serial port, makes a dialup connection, performs a task, hangs
    up the connection, and exits. The Linux serial driver contains code to handle
    improperly written or terminated serial communication programs by automatically
    hanging up the phone line when the port is closed: that is if it drops "DTR."
    becomes 1, asserted, or as an RS-232 negative voltage. This has an electrical
    limitation on the lift access point hardware design. Opening and closing the serial
    port can change the permission signal that is going to the access point—the red
    light or the green light. Fortunately, the serial driver has an option to disable
    this automatic hangup at closure. It is settable through changes to the serial
    ports configuration''s c_oflag. The source code in Listing 6.1 disables the automatic
    hangup at port close and sets the serial port''s control signals. The setSerialSignal
    code is shown in Listing 6.1.


