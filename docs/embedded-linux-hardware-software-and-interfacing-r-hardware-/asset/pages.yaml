    **Step 9, Preparation A: The root Filesystem on a RAM Disk**

    If it is configured with RAM support, the kernel contains code to create a disk
    drive in RAM memory, extract the contents of this RAM disk from another location,
    and then this RAM disk as its root filesystem. This common procedure allows embedded
    system operation without a hard disk. Keep in mind that the RAM disk exists only
    until the power cycles or the machine reboots. The contents of the RAM disk are
    not typically stored across reboots. (Project Trailblazer accepts this limitation
    because no field unit will store information locally.)


    To prepare a RAM disk, the buildrootfilesystem script implements these steps:


    +   1. It creates a file, called ramrootfs, that is the same size as the final
