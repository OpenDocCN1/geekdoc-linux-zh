    # Measuring Interrupt Latency on the RPX-CLLF


    The RPX-CLLF''s MPC860 has seven external interrupt pins. The Project Trailazers
    want to drive IRQ2 with PA0, so they configure the interrupt controller for IRQ2
    rising-operation. Asserting PA0 should generate Interrupt 2. (For more information,
    see Section 11.5.1, “Interrupt Structure,” of Motorola MPC860 PowerQUICC User’s
