    TIP

    When debugging I2C hardware and software, you can use an oscilloscope to look
    for the acknowledgement bit of the address byte sent by the receiver. If it is
    there, you have success-wired the circuit and send the I2C device the correct
    start condition and its status. If the bit is not present, you need to check the
    circuit''s wiring, signal and power supply voltage levels, and pull-up resistor
    values, and you need to closely examine the start condition and the data and clock
    signal timing. Also, while you''re debugging the circuit, you should operate your
    I2C communication at the slowest possible speed. This gives your devices time
    to properly drive the data and clock signals. When your circuit functions correctly,
    you can remove delays and increase the communication speed.'
