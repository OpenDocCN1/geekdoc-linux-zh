  md: '# Boost Comparison


    The Project Trailblazer engineers developed a target comparison table shown in
    Table 4.3. This table compares the “power on bash prompt” timing and root filesystem
    size for the four platforms involved in Project Trailblazer.


    TABLE 4.3 Project Trailblazer Target Comparison

    | Platform | bash Prompt Time | Target root Filesystem Size |

    |---|---||

    | Embedded Planet RPX-CLLF, PowerPC 860 | 27 seconds, including 6-second TFTP
    download of the kernel and RAM disk | 4262KB |

    | Brightstar Engineering MediaEngine, StrongMZ110 | 13 seconds, including 6-second
    TFTP download of the kernel and RAM disk | 4888KB |

    | Tri-M MZ104, Pentium (100MHz) | 29 seconds, including 17-sec BIOS completion
    time | 4888KB |

    | Micron COTS PC, Celeron (400MHz) | 27 seconds, including 20-sec BIOS completion
    time | 4888KB |


    All the platforms power up and boot to a prompt in under 30 seconds. The fastest
    is the MediaEngine, at 13 seconds. The RPX-CLLF and MediaEngine boot times include
    a 6-second TFTP kernel transfer time. This would be eliminated if the on-board
    Flash memory stored the kernel image. The x86 MZ104 and COTS PC boot times include
    the mandatory PC BIOS completion time. The filesystem size similarity shows that
    the compiled binary files are roughly the same size for x86, ARM, and PowerPC
    microprocessors.


    # Summary


    This chapter covered a lot of ground. The Embedded Planet RPX-CLLF, the Brightstar
    Engineering MediaEngine, the Tri-M MZ104 x86 single-computer, and the COTS PC.
    They developed seven target boot requirements, and then they learned about the
    Linux boot process and developed the root filesystem. The root filesystem programs
    themselves, the engineers decided to use the Montavista Journeyman product, which
    contains compiled binaries for all the target platforms. They developed the buildrootfilesystem
    script, which generates the target root filesystem and prepares it for use.'
