  md: '# Finding Space in the Memory Map for the MediaEngine


    The MediaEngine has 4MB Boot Flash memory, an Ethernet controller, optional Flash
    memory, an optional internal modem, an expansion port, and 32MB SDRAM. Table 9.2,
    which is a reprint of Table 3-1 from the MediaEngine Hardware Reference Manual*,
    shows device memory mappings. The MediaEngine bus expansion port contains Chip
    Select 5 (/CS5), which the ARM processor maps to address 0x48000000. Section 2.4,
    “Memory Map,” of the SA-1110 Developer’s Manual*, explains that Chip Select 5
    is mapped to an 128MB memory block for static-memory or variable-latency I/O devices.


    Table 9.2 MediaEngine Memory Map

    | Address Range | Description |

    |---|---|n| 0x00000000-0x003FFFF | 4MB Boot Flash |

    | 0x08003000-0x0800303F | CS8900A Ethernet Controller |

    | 0x01000000-0x01100000 | 16MB Flash (Optional) |

    | 0x18000000-0x1800000F | Board Control Reg 0 |

    | 0x19000000-0x1900000F | Board Control Reg 1 |

    | 0x40000000-0x4000001F | Internal Modem (Optional) |

    | 0x48000000-0x4FFFFFFF | Expansion Port |

    | 0xC0000000-0xC1FFFFFFFF | 32MB SDRAM |


    The MediaEngine hardware design makes available chip select 5, /CS5, the expansion
    port through the JP1 connector. The Lif*nowcon interface should use /CS5, which
    is mapped to address 0x48000000.


    # Finding the Register Base Address for the MediaEngine


    The ARM SA-1110 peripheral, system, memory, and expansion-chip registers are mapped
    to physical addresses between 0x00000000 and 0xFFFFFF (see Section 2.4, “Memory
    Map,” of SA-1110 Developer’s Manual). Here are the register base addresses for
    memory and general-purpose I/O:


    +   * Memory interface control registers: 0xA0000000

    * General-purpose I/O control registers: 0x90040000


    # Finding the Memory Controller for the MediaEngine


    The static memory control register, MSC2 (see Section 10.2.4, “Static Memory Control
    Registers,” of SA-1110 Developer’s Manual), configures control bits for Chip Select
    4 and Chip Select 5. MSC2 configures the ROM type, bus width, first access delay,
    next access delay, and recovery time. Remember that the ARM needs to be'
  merge: -1
