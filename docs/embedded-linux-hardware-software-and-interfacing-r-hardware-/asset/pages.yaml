    # Target EIA/TIA-232-E Compliance


    When you have Linux booted on all platforms, you should be able to develop software
    for any platform and port it to another platform by merely cross-compiling. Ideally,
    the Project Trailblazer engineers could develop and test all the serial communications
    code on tbdev1 and then cross-compile it for the PowerPC and ARM platforms. Unfortunately,
    the RPX-CLLF and MediaEngine hardware design does not allow for control of the
    serial port signal lines. The manufacturers state that there is no hardware flow
    control over the serial ports. This means that hardware designs cannot access
    the Request to Send (RTS), Data Terminal Ready (DTR), Clear to Send (CTS), Data
    Set Ready (DSR), and Ring (RI) control signals. These boards support asynchronous
    serial communication but not fully comply with the current EIA/TIA-232-E standard.
    The Access Permission circuit in Figure 6.1 requires connection to the DTR control
    signal. Therefore, the RPX-CLLF and MediaEngine cannot''t be used in this hardware
    design. You will use the x86 target platforms to develop and test the setSerialSignal,
    getSerialSignal and querySerial programs.'
