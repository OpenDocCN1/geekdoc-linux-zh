    # Connecting the SAA1064 to the RPX-CLLF


    The RPX-CLLF''s MPC860 carries a dedicated I2C controller. Use of the controller
    is more CPU efficient than bit-banging software. The current8xx_lm_sensors utilizes
    the MPC860''s I2C controller. The lm_sensors device drivers provide access to
    I2C devices through /dev files. Ideally, use of these drivers would reduce Project
    Trailblazer development time the engineers don''t need a full understanding of
    MPC860 internals.


    At first, the Project Trailblazer engineers were excited about using the lm_sensors
    project, however, when it came to cross-compile code for the PowerPC, they changed
    their minds. Although 8xx files are contained within the lm_sensors project, they
    aren''t kept current and aren''t part of their configuration process. Cross-compiling
    isn''t a simple make process. The engineers spent too much time compiling and
    editing files. inserting modules resulted in errors because some assembly code
    was missing. Confused, the engineers read about I2C on the PowerPC mailing list.
    They decided to abandon the lm_sensors code when they read about the I2C developer
    discussion concerning the I2C restructuring: Accounts of unsuccessful compiling,
    missing assembly, and restructuring led the team to write their own SAA1064 driver.


    Right after successfully using the SA-1110s controller for SPI communication,
    the engineers decided to investigate the MPC860''s I2C controller. Unfortunately,
    it wasn''t. The MPC860''s I2C controller uses interrupts, DMA, and memory buffers.
    The engineers simply didn''t have the time or the expertise to'
