  md: '# Measuring Interrupt Latency


    with microsecond timing access, race time won''t have millisecond accuracy if
    the system interrupt latency exceeds a millisecond. The next section examines
    the Project Trailblazer engineers'' development of interrupt handlers within a
    device driver to measure average interrupt latencies for the MZ104, MediaEngine,
    and RPX-CLLF targets.


    # Measuring Interrupt Latency


    Interrupt latency is comprised of hardware propagation time, register saving,
    and software execution. Propagation time and register saving occur extremely fast—on
    the order of 10s of nanoseconds. Software execution, on the other hand, can be
    extremely slow. The Linux kernel allows device drivers to disable interrupts by
    using the c1 system call. While interrupts are disabled, other interrupts can
    occur, but their service routines are not executed until interrupts re-enabled.
    Developers disable interrupts to protect critical sections of the code. For example,
    a video card driver might disable interrupts for 16ms when waiting for video.
    A serial card driver might disable interrupts during a busy transmission. Therefore,
    *maximum latency* is a combination of system hardware, peripherals, and the quality
    of the device driver software. With source code availability, the asynchronous
    nature of interrupts makes calculating the maximum interrupt latency difficult,
    if not impossible, task. On a heavily loaded system with little or no peripherals,
    it''s likely that the average interrupt latency is smaller than the maximum. Even
    so, the Project Trailblazer engineers had no idea of the average interrupt latency
    magnitude. Was it microseconds or milliseconds? They decided to measure it for
    each target board.


    # TIP


    When you are writing device drivers, you should disable interrupts only when your
    driver requires absolutely no interruption. While interrupts are disabled, Linux
    does not update system timers, transfer network packets to and from buffers, or
    update video information. You should perform your interrupt task as quickly as
    possible. For lengthy tasks, you should split your handler and tasklets to perform
    most of the processing.


    Each target board—the MZ104, the MediaEngine, and the RPX-CLLF—has external connections
    that are capable of generating processor interrupts. In addition, each board can
    generate an interrupt signal by using one of its own output ports. In the device
    driver code we''re about to discuss, one function asserts the interrupt signal,
    which causes the interrupt handler to execute. The handler deasserts the interrupt
    signal and exits. The interrupt assertion and deassertion can be viewed on an
    oscilloscope, to determine the average interrupt latency.'
