- img_proc: true
  md: '# CHAPTER 7 Parallel Interfacing


    software registers data, status, and control exist at the base address, base address
    + 1, and base address +2 (that is, 0x378, 0x379, and 0x37A). Figure 7.1 shows
    these software registers, their bit definitions, and the hardware connections
    to the DB-25 parallel port connector.


    ![](img/6d9baeee8ddb96b5248c3d68b6bc0ecb_176_0.png)


    Figure 7.1 PC parallel port connection to switches fixtures. The highlighted registers
    to DB-25 port connections are electrically inverted.


    The control register contains two additional bits that are not shown in Figure
    7.1. Control bit 5, directional port enable, configures the data bus for input.
    Control bit 4, IRQ via Ack Line enable, configures the port hardware to generate
    an interrupt on the low-to-high transition of the Ack line, DB-25 pin 10. Parallel
    port interrupts are not required for Project Blazer acquisition or control. The
    engineers build a parallel port software development test fixture, shown in Figure
    7.2, with switches connected to inputs and LEDs connected to outputs.


    # TIP


    Some parallel ports don''t actively drive their data and control signals when
    Logic Level 1. These open collector/drain signals are pulled high with a resistor
    located inside the PC: The value of this resistor, which you don''t know and can''t
    control, affects the LED''s brightness. If you are experiencing problems using
    LEDs to debug your parallel port programs, you should use a voltmeter or logic
    probe instead. Also, keep in mind that certain control and status signals are
    inverted in hardware.'
