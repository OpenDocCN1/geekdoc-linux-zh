  md: '# Linux Serial Communications


    The Project Trailblazer engineers found three documents specifically addressing
    Linux asynchronous serial communications:


    +   - Gary Ferking’s "Serial Programming HOWTO" (www.linuxdoc.org/HOWTO/Serial-Programming-HOWTO.html)

    - David S. Lawyer’s "Serial HOWTO" (www.linuxdoc.org/HOWTO/Serial-HOWTO.html)

    - Michael Sweet’s "Serial Programming Guide for POSIX Operating Systems" (www.easysw.com/-mike/serial)


    Using Linux—or, more properly, POSIX—serial communications terminology, they searched
    for code examples that access the serial port’s universal receiver transmitter
    (UART) control signals and send buffers. Discovering that the UART’s control signals
    was straightforward and easy to understand. Manipulating the receive buffers requires
    a more in-depth understanding of the Linux serial device driver capabilities.
    This device driver contains numerous options, beyond basic UART configuration,
    for control and processing of modern and terminal communications. Most of these
    options don’t apply for Project Trailblazer. The engineers wrote their own simplified
    serial communications driver for UART control, but they decided that after finding
    C code examples that resemble the required functionality of setSerialSignal, getSerialSignal,
    and querySerial.


    Linux device files provide access to hardware serial ports. The file open command
    returns a file descriptor that is used for serial port configuration, control,
    reading, and writing. The following sections demonstrate this through development
    of the setSerialSignal, getSerialSignal, and querySerial programs.


    # Setting the Serial Port Control Signals with setSerialSignal


    The Project Trailblazer lift access point receives RFID tag information, authentication,
    and displays a permission signal (that is, a red or green light) permitting or
    denying access to the lift. For the sake of simplicity, the engineers decided
    to use an RS-232 serial port control signal as the permission signal. There’s
    no to involve another hardware input/output (I/O) port, as a parallel port, when
    the access point serial communications between the target and the RFID reader
    or display don’t use hardware flow control or a DTR signal. The serial port signals
    RTS or DTR provide this single bit of output, to drive the red light/green light
    permission signal.'
