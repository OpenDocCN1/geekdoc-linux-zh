- img_proc: true
  md: 'In addition to providing electrical and communication protocol specifications,
    USB defines a number of device classes for common peripherals as audio devices,
    mouse devices, keyboards, printers, and mass storage devices. A peripheral device
    that implements a device class can utilize preexisting host device driver code.
    Device classes promote interoperability.


    Many USB peripheral devices don''t fit into a defined device class, such as video
    devices, Ethernet devices, MP3 players, and serial/parallel converters. Manufacturers
    of these devices must develop device driver code.


    USB host controllers fall into two categories: universal host controller interface
    (UHCI) and open host controller interface (OHCI). These controllers are functionally
    different from one another; a UHCI controller is simpler from a hardware-perspective
    and shifts some communication processing to the host CPU and driver, complicating
    the driver. A variety of vendors offer UHCI and OHCI host controllers.


    The engineers continued their research and found the Linux USB Project home (www.linux-usb.org)
    and The Programming Guide for Linux Device Drivers. Browsing through this, they
    discovered the complexities of Linux USB drivers. The first half of "USB Complete"
    clearly establishes that USB communications is not simple. "The USB Programming
    Guide" confirms this. The engineers decided that Project Trailazer would not develop
    any USB driver code because the steep learning curve would affect the development
    schedule.


    The Linux USB Project home offers a wealth of USB information. Linux USB support
    started in 1996 as the Universal USB Driver (UUSB). In 1999, Linux Torvalds developed
    the Alternate USB driver, which was released under the GPL license. With other
    Linux kernel, a group of developers and testers fixed and enhanced the Alternate
    USB driver. Later that, a complete USB driver rewrite matured and incorporated
    into the kernel version 2.4.x configuration process and has been back-ported to
    kernel version 2.2.18. For device classes (audio devices, mouse devices, keyboards,
    and mass storage devices) as well as numerous vendor-specific drivers (scanners,
    video devices, Ethernet devices, MP3 players, and serial/parallel converters)
    have been developed. Several vendor-specific drivers are incorporated into the
    kernel process, and the others are compiled separately as loadable modules.


    The Project Trailblazer engineers continued learning by reading "The Linux USB
    Subsystem." This early draft offers an excellent introduction and usage guide
    for USB at kernel revision 2.4.0-test9. While the engineers were researching USB
    for Linux, kernel version 2.4.10 was released. They understood that USB driver
    development continually evolves. This led them to the Linux-USB Device Overview
    website,'
  merge: -1
