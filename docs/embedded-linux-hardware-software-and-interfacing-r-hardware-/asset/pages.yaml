    while [ 1 ]\ndo\n\n# get temp\ntemperature=`proc/trailblazer/temperature`\n\n\
    # form the query and pipe to nc\necho 'GET /cgi-bin/temperatureRecord?$temperature'\
    \ \\ \\\n  | nc -w 10 192.168.1.11 80\n\n# print out temperature\necho $temperature\n\
