  md: '# Developing Lift Monitoring and Snow-Making Control for the MediaEngine 229


    Before the Project Trailblazers can access the OutputModuleEnable, the CPU''s
    port I/O controller must be configured. Many I/O pins on both the ARM and PowerPC
    processors have an alternate function for on-chip peripherals, such as port signals.
    The Project Trailblazer engineers need to configure the I/O controller so that
    the OutputModuleEnable signal does not use an alternate function and so that it
    is an output.



    With the hardware design complete and tested, the Project Trailblazer engineers
    need to write the lift monitoring and snow-making control device driver for the
    ARM and PowerPC processors. Using the liftmon_snowon.device driver source code
    from Chapter 7, the engineers can develop lift monitoring and snow-making control
    drivers for the MediaEngine and the RPX-CLLF.


    # Developing Lift Monitoring and Snow-Making Control for the MediaEngine


    This section details the MediaEngine interface hardware design. After the engineers
    find space in the memory map for the I/O circuit, they configure the CPU registers
    and test the circuit using the howeverdit program. They then develop the MediaEngine
    liftmon_snowon device driver, to monitor lifts and control snow-making equipment.


    # Designing the External Interface Hardware for the MediaEngine


    In order for the MediaEngine to monitor lifts and control snow-making, it needs
    to read six inputs and control four outputs. In this design, an output latch and
    an input buffer connect directly to the MediaEngine''s CPU bus. The MediaEngine
    features external interface connectors that permit buffered access to various
    CPU signals. The bus expand JP1, provides the signals listed in Table 9.1.


    # TABLE 9.1 MediaEngine JP1 Signals


    | Description | Signals |

    |---|---|

    | Address lines | A0–A15 |

    | Data lines | D0–D15 |

    | Chip select | /CSS |'
