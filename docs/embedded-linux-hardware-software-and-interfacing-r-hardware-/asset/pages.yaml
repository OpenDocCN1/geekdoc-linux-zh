  md: '# Summary


    The Project Trailblazer engineers started with a collection of high-level requirements.
    Nine of these addressed safety and the Operations Department’s need for automation.
    In this chapter, the engineers developed a system integration infrastructure using
    bash, nc, Apache, and MySQL; then implemented and tested scripts for temperature
    data, image, and access control. For each solution, the engineers developed an
    area within the infrastructure.


    The temperature collection, storage, and distribution scripts form the foundation
    for data storage and presentation. Using gnuplot along database queries forms
    a powerful visualization tool for representation of field data. The scripts engineers
    developed for temperature data can easily be extended to handle lift monitoring,
    guest messaging, and race timing.


    The access point scripts control field hardware that is based on database values.
    These hardware control scripts can be extended to control music playback and snowmaking
    equipment.


    # Additional Reading


    +   1. Chet Ramey and Brian Fox, *Bash Reference Manual*, www.gnu.org/manual/bash.


    +   2. Mendel Cooper, *Advanced Bash-Scripting Guide*, www.linuxdoc.org/LDP/abs/html.


    +   3. The Apache Software Foundation Web site, www.apache.org.


    +   4. MySQL Speed, Power and Precision Web site, www.mysql.com.


    +   5. Gnuplot Central Web site, www.gnuplot.vt.edu.'
