  md: '# Standard Parallel Port Control Using the Custom Device Driver liftmon_snowcon


    The Project Trailblazers could barely contain their enthusiasm. They had an interface
    circuit that connected I/O modules to the parallel port. They had written code
    inb and out to control their interface board. They had created, compiled, and
    tested a proc module. Now they needed to take a really big step: Combine all these
    accomplishments to develop the custom lift monitoring and snow-making control
    device driver, liftmon_snowcon.


    The engineers created the following requirements for liftmon_snowcon:


    +   LS1: The driver should load at startup. This is easily accomplished by adding
    a line to /etc/init.d/rc5 or using the kernel module load file /etc/modules.


    +   LS2: When it is loaded, the driver should enable the latch output to drive
    the output modules. The driver''s module_init function needs to assert OUTPUT_ENABLE
    and its module_exit function should de-assert OUTPUT_ENABLE.


    +   LS3: The driver should shield developers from interface logic specifics. The
    device driver should provide a hardware control interface so that the developer
    doesn''t need to know about OUTPUT_ENABLE, OUTPUT_LATCH, data lines, INPUT_ENABLE,
    or assertion levels.


    +   LS4: The driver should offer control of individual pieces of snowmaking equipment,
    without requiring the developer to perform manipulation. The driver should create
    a /proc file for each of the output modules: snowwatervalve1, snowwatervalve2,
    snowwatervalve3, and snowheater. Writing 1 or 0 to a specific file will turn the
    specific module on or off. For example, this turns on the Water Valve 2 output
    module:


    ```

    echo 1 > /proc/trailblazer/snowwatervalve2

    ```


    Notice that there is no manipulation and the device driver provides actual names
    that correspond to the physical world. Internal to the device driver should be
    an unsigned char snowcondata. The driver should perform the necessary manipulation
    within snowcondata.


    +   LS5: The driver should offer monitoring of individual modules, without requiring
    the developer to perform bit manipulation. The device driver should create a /proc
    file for each of the input modules: liftchains, liftmotorcontroller, lifslowpeed,
    lifighspeed, liftoperatorswitchbase, and liftoperatorswitch. Reading a specific
    file should return the status of an input module. For example, this returns 1
    or 0:


    ```

    cat /proc/trailblazer/liftchains

    ```'
