    # Developing the Target and CGI Integration Scripts


    With the Project Trailblazer database created, populated with test data, and queried,
    you are ready to move on to developing the Project Trailblazer target and CGI
    integration scripts.


    # Collecting and Distributing Temperature Data


    The collection and storage of temperature data requires two bash scripts:


    +   - temperatureReport—The collection script temperatureReport, shown in Listing
    12.2, executes continuously on a target board, periodically communicates with
    an external temperature sensor, and then reports the temperature value via an
    HTTP connection. The target board''s init program or a startup script starts the
    temperatureReport script.

    - temperatureRecord—The database script temperatureRecord, shown in Listing 12.3,
    executes as an on-demand CGI script, receives the temperature value, and then
    sends a formulated database query to the Project Trailblazer database.


    # LISTING 12.2 The temperatureReport Temperature Collection bash script


    ```

    #!/bin/bash

    # temperatureReport v1.0 12/31/01

    # www.embeddedlinuxinterfacing.com

    #

    # The original location of this code is

    # http://www.embeddedlinuxinterfacing.com/chapters/12/

    #

    ```'
