    | TABLE 9.1 Continued |

    | Description | Signals |

    | I/O line | GPI014 |

    | Write enable | /WE |

    | Output enable | /OE |

    | Data ready | /RDY |

    | Reset | /RST |

    | Power | +5V, +3V |

    | Ground | GND |


    9.1 shows the connections between the output latch (74HC574 Edge Triggered D Flip
    Flop with three-state outputs), and the MediaEngine. Upon reset, GPI014 is configured
    as an input buffer (74HC244 Octal Buffer with three-state outputs). A pull-up
    reset enables the OutputEnable line, which disables the output modules. GPI014
    is then configured as an output pin. It controls OutputEnable line, which in turn
    enables or disables the I/O modules. Signals A0, /OE, /WE, and /CS5 control the
    three line decoder, 74HC138, which performs address and read/write signaling.


    Here’s the operation of 1 byte (see Figure 10-17, “Variable Latency I/O Write
    Timing Diagram,” in SA-1110 Developer’s Manual* for more information):


    +   1. Deassert A0, /OE and /WE.

    2. Set D0–D7.

    3. Assert CS5, this enables the HC138.

    4. Assert /WE. The HC138’s Y2 output asserts the HC574’s CLK because /WE = C =
    L, /OE = B, and A0 = A = L.

    5. Deassert /WE. The HC138’s Y2 deassert HC574 CLK because /WE = C = H, /OE =
    B, and A0 = A = L. D0–D7 enters HC574’s flip-flops.

    6. Assert /CS5.


    Here’s read operation of 1 byte (see Figure 10-16, “Variable Latency I/O Read
    Timing Diagram,” in SA-1110 Developer’s Manual* for more information):


    +   1. Deassert A0, /OE and /WE.

    2. Assert /CS5, this enables the HC138.

    3. Assert /OE. The HC138’s Y4 asserts the HC244’s /OE because /WE = C = H, /OE
    = B = L, and A0 = A = L. D0–D7 enters CPU.'
