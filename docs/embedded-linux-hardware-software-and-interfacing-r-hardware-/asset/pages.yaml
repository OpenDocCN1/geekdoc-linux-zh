    # Writing the liftmon_snowcon Device Driver for the RPX-CLLF


    All the pieces are in place for the Project Trailblazer engineers to write the
    RPX-CLLF version of liftmon_snowcon. The interface circuit connects to the RPX-CLLF''s
    bus and I/O expansion connectors. The MPC860 memory and I/O controllers were properly
    configured and tested, using the helloworld_rpxllf device driver. Using the liftmon_snowcon.c
    source, Listing 7.5, as a template, the engineer can replace the parallel port
    control code with PA0 and CS5 control code from helloworld_rpxllf.c. Here''s a
    quick summary of the changes that the engineers need to make to Listing 7.5:


    +   1. Port reads use the readb function instead of in.


    +   2. Port writes use the writeb function instead of outb.


    +   3. The OutputModuleenable is handled by PA0.'
