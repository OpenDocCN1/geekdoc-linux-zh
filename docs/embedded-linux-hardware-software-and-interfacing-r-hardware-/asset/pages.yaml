    # Installing the TFTP Server


    MediaEngine and RPX-CLLF bootloaders can download files over Ethernet using Trivial
    File Transfer Protocol (TFTP). The bootloader configures the target board’s Ethernet
    hardware and can download the kernel and RAM disk files into specific RAM locations.
    The user can then execute the kernel loaded in memory. The target specific commands
    for doing this are covered in the following sections. This section shows how to
    configure the tbdev1 workstation as a TFTP server.


    TFTP is a simple file transfer protocol that doesn’t require authentication. TFTP
    servers primarily serve boot over a network to diskless workstations (such as
    Project Gazetteer’s MediaEngine and RPX-CLLF boards). Follow these steps to install
    and configure a TFTP server on tbdev1:


    +   1. Install the TFTP server and the client on the tbdev1 workstation using
    these commands:


    ```

    root@tbdev1[520]: apt-get install tftpd

    root@tbdev1[521]: apt-get install tftp

    ```'
