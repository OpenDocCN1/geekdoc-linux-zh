    \ the follow-ing two registers:\n\n+   * SSP Control Register 1 (SSCR1) configuration\
    \ bit settings:\n  * Receive FIFO Interrupt Enable (RIE): 0 masks interrupt\n\
    \  * Transmit FIFO Interrupt Enable (TIE): 0 masks interrupt\n  * Loopback Mode\
    \ (LBM): 0 disables loopback mode\n  * Serial Clock Polarity (SPO): 0 holds SC\
    \ low during idle\n  * Serial Clock Phase (SPH): 0 adds 1 clock cycle delay\n\
    \  * External Clock Select (ECS): 0 uses internal clock\n* SSP Control Register\
    \ 0 (SSCR0) configuration bit settings:\n  * Data Size Select (DSS): 1111 selects\
    \ 16-bit length\n  * Frame Format (FRF): 00 selects Motorola SPI\n  * Synchronous\
    \ Serial Port Enable (SSE): 1 for enable\n  * Serial Clock Rate (SCR): 1111111\
    \ selects slowest clock\n\nThe MediaEngine’s LM7_mediaengine.c device driver,\
    \ shown in Listing 10.2, needs to configure the SA-1110’s SSCR1 register with\
    \ 0x0000 and the SSCR0 register with 1111 1111 1000 1111 (0xFF8F).\n\n| Media\
