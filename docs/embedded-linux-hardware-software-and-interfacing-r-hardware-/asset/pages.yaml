    TIP


    Some PowerPC microprocessors don''t have a floating-point unit and don''t execute
    floating-point instructions gracefully. When executing PowerPC programs, you should
    make sure they have been compiled correctly for your microprocessor.


    MontVista® HHLv2 isn''t just a repackaging of the open-source GNU software. MontVista''s
    engineers are leading developers in architecture potting issues and development
    activities. They have incorporated much of their work (patches) into the MontVista
    distribution. All their architecture-specific work for the kernel and other GNU
    software is incorporated into the HHLv2 source and binaries. The Project Trailblazer
    engineers, who aren''t architecture experts, were excited when the engineers decided
    that instead of reinventing the wheel, they could use MontVista''s Journeyman
    product, including the Journeyman cross-compiled versions of the programs for
    their ARM and PowerPC root filesystem. After a successful booting of both the
    ARM and PowerPC targets, they decided to use Journeyman for i386 root filesystem
    as well. This decision simplified their lives in they didn''t imagine. Building
