    # Collecting Guest Pass Identification and Allowing Lift Access


    The Project Trablazer lift access design uses radio frequency identification (RFID)
    readers from ESPTech. Each guest''s daily or season pass contains an RFID tag
    that emits a unique 20-character identification string is read when it is near
    the RFID reader. When the pass is purchased, a unique ID string is generated and
    the pass''s is programmed with the ID. This process creates an entry in the Project
    Trablazer database guests table.


    A guest wants to gain access passes his or her pass to the lift access point.
    The pass''s emits the guest''s unique ID string, the RFID reader reads and passes
    via an asynchronous serial link to the access point''s target board. The board
    script accessPointControl, shown in Listing 12.10, is executing on the target
    board reads this unique ID and then queries the Trablazer database for pass validity.
    If the pass is valid, the accessPointControl script runs on the access point''s
    green light for S5 seconds, permitting access to the lift. If the pass is not
    valid, the script runs on the access point''s red light. The accessAllow CGI script,
    shown in Listing 12.11, not only returns pass validity information but also logs
    guest lift access.


