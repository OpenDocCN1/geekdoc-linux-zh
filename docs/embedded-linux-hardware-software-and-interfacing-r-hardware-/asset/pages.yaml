  md: '# System Architecture


    A group of devices forming a network to distribute functionality that share a
    common purpose defines a system. The initial system design phase creates a framework
    called the system architecture. The system architecture specifies, at a block
    level, the system components and their intersection architecture, which provides
    a structure and an overall understanding of the project or product. System architecture
    provides the big picture. Furthermore, a set of high-level system requirements
    help to define the system architecture. Also, a system architecture does not address
    technical details of its blocks. Details such as component specification and selection,
    are determined during a block''s design phase.


    This chapter introduces Project Trailblazer, a winter resort automation project.
    This project starts with the formation of the high-level system requirements,
    which will develop into a system architecture consisting of functional blocks
    and its interfaces. This chapter does not address any technical details concerning
    the functional block; it merely defines the Project Trailblazer system architecture.
    This book follows the Project Trailblazer development and the design and implementation
    of its functional blocks using embedded Linux.


