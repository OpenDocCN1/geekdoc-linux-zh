  md: "You have now completed your first multi-architecture remote debugging session.\n\
    Wasn't that easy? You now have a functional multiarchitecture system to build\
    \ on.\nFrom here, you can investigate the use of the tools that are built in gdb,\
    \ as did\ninsight, to make your debugging life easier. See the “Additional Reading\"\
    \nsection at the end of this chapter for more information.\n\n# Network-Mounting\
    \ the root Filesystem\n\ntdbevarm's root filesystem, generated by the buildrootfilesystem\
    \ script, contains\nt cross-compiled version of helloworld and gdbserver. Changing\
    \ the helloworld\nsource code would require completely rebuilding the root filesystem,\
    \ rebooting the\nMediaEngine, and then downloading the kernel and root filesystem\
    \ again. Even\nthough the MediaEngine boots quickly, this approach over time would\b\
    ecome tedious and time-consuming.\n\nInstead of transferring the root filesystem,\
    \ you can mount it over the Ethernet\nnetwork by NFS. With a network-mounted root\
    \ filesystem, you can generate\nt ARM cross-compiled version of helloworld on\
    \ tbdev1. You can then directly\nexecute it or remotely debug it without regenerating\
    \ the MediaEngine root filesystem\nor rebooting. The buildrootfilesystem script\
    \ creates the minimum root filesystem\nin /ttpboot directory and can be NFS-mounted.\n\
    \nThe Unix world uses NFS to mount home directory for user workstations or computers.\n\
    for example, a server can share its /home directory for user workstations or the\
    \ /ttpboot\ndirectory for diskless workstations to mount their root filesystem.\
    \ (Note that diskless\nworkstations and the Project Trailblazer target platforms\
    \ use TFTP, not NFS, to down-\nload their kernels). The Linux kernel itself contains\
    \ NFS code, which allows the\nkernel to mount its own root filesystem during the\
    \ process.\n\nIn this section, you'll learn how to configure tbdev1 to act as\
    \ an NFS server and\nconfigure the target board's kernel options for network-mounting\
    \ your root file\nsystems.\n\n# Configuring the NFS Server\n\ntbdev1 serves as\
    \ the Project Trailblazer root filesystem NFS server. You can\nconfigure it to\
    \ serve the i386 files to the i386 target (MZ104 and COTS PC), the ARM\nfiles\
    \ to the ARM target (MediaEngine), and the PowerPC files to the PowerPC target\n\
    (RPX-CLLF). As you can tell, it's important to serve the correct files to each\
    \ architec-\nture. Figure 5.2 shows the Project Trailblazer development computers\
    \ and its IP"
  merge: -1
