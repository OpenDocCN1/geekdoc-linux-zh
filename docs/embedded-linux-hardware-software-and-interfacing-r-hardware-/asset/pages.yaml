  md: "# LISTING 12.2 Continued\n\n```\n# Copyright (C) 2001 by Craig Hollabaugh\n\
    #\n# This program is free software; you can redistribute it and/or modify\n# it\
    \ however you want.\n#\n# temperatureReport\n# temperatureReport is a bash script\
    \ that executes on a target board\n# with an external temperature sensor and its\
    \ module loaded. Loading\n# the module, as LW70_x86.0 from Chapter 10 creates\
    \ the\n# /proc/trailblazer/temperature file. This script gets the current\n# temperature\
    \ from /proc/trailblazer/temperature, forms an HTTP GET\n# query using temperatureRecord\
    \ with the temperature as the\n# parameter. This query is piped into nc which\
    \ has a TCP connection\n# to tbdev1's apache HTTP server on port 80. nc is configured\
