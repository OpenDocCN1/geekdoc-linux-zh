  md: '# # Booting the Tri-M MZ104 and the COTS PC with a Flash IDE Drive


    The x86 CPUs perform the final two targets: the Tri-M MZ104 and COTS PC. These
    targets boot from and use IDE drives. This section presents the flash IDE technology
    selected and shows how to compile the kernel, create the target root filesystem,
    and prepare the flash drive for booting.


    # ## Flash IDE Technology


    Flash technology has matured and provides “no moving parts” solution for embedded-designs.
    Flash ATA drive capacity ranges from 8MB to 384MB, with single-piece pricing starting
    at $25 (as of fall 2001). The smallest size, 8MB, provides ample capacity for
    the Project Trailbl filesystem. The following components were selected for evaluation:


    +   * SanDisk 8MB Compact Flash Card ($24.99, www.sandisk.com)

    * SST58SD/LD32 32MB ATA-Disk Chip ($50.00, www.ssti.com/ata_disk/atabrief.pdf)

    * PCEngines IDE to Compact Flash Adapter ($20.00, www.pcengines.com/cflash.htm)

    * VersaLogic VL-CFA-1 CompactFlash Adapter ($70.00, www.versalogic.com)


    > **TIP**nConnecting a Compact Flash memory card to an IDE controller requires
    an adapter. Using Compact Flash drives eliminates moving parts from your design.


    Pricing shown here reflects the manufacturer''s suggested retail price in fall
    2001. The SanDisk Compact Flash Card and SST ATA-Disk chip claim 100% ATA IDE
    compatibility. This means the Project Trailblazer engineers should be able to
    treat it like a regular drive (that is, they should be able to use fdisk, format,
    copy, and so on). The engineers also discovered that removable IDE drives bays,
    such as the StarTech SNT127A (www.startech.com), ease swapping IDE drives during
    development.


    # ## Preparing the Tri-M MZ104 and the COTS PC


    Installing Linux with a distribution CD, such as Debian or Red Hat, on a commercial
    off-the-shelf PC is easy. Just put in the CD, boot, and install. As you saw earlier
    in this chapter, a minimum Debian installation requires 67MB and Red Hat requires
    382MB, both of which are beyond the capacity of the Project Trailblazer Flash
    IDE drives.'
  merge: -1
  pgno: 121
- img_proc: true
  md: "# CHAPTER 4 Booting Linux\n\nThey have these installations, what actually happens?\
    \ The distribution installation program partitions the destination drive, and\
    \ if necessary, formats the drive, creates directories, extracts files from an\
    \ archive file into these directories, configures systems and subsystems, prepares\
    \ the drive to be bootable, and then reboots. Sounds simple enough, doesn't it?\n\
    \nPreparing the root filesystem presents the largest challenge for distribution\
    \ vendors. They have to select from the thousands of existing programs. The Project\
    \ Trailblazer engineers decided early in this chapter what their target Linux\
    \ machines require. They also know what configuration files are necessary to boot\
    \ the root filesystem. Therefore, they now have to partition and format the Flash\
    \ IDE drive, compile the x86 kernel, build the root filesystem on the IDE drive,\
    \ and boot the board.\n\n# Partitioning and Formatting the Flash IDE Drive\n\n\
    The Tri-M MZ104 or the OTS PC will boot and mount its root filesystem from a Flash\
