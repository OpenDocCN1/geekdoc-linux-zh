    # IN THIS CHAPTER


    # Debugging


    +   * Introducing gdb


    +   * Local Debugging


    +   * Remote Debugging


    +   * Network-Mounting the root Filesystem


    +   * Additional Reading


    Regardless of their talent or expertise, all programmers need to debug code. The
    Project Trailazer engineers know they''ll need to do some debugging and that the
    time they spend on debugging will affect their schedule.


    The Project Trailazer engineers want a reliable and robust solution for their
    remote debugging. They want to span the project''s target processors (x86, ARM
    and PowerPC), communicate over the Transmission Control Protocol/Internet Protocol
    (TCP/IP) network, and be non-proprietary. The GNU debugging tools gdb and gdserver
    provide this solution.


    In this chapter, you''ll debug the helloworld program locally and remotely, using
    gdb and gdserver. You''ll need to reduce the compile/run/debug iteration cycle
    by configuring the project target to mount their root filesystems via Network
    File System (NFS). This chapter is by no means a comprehensive explanation of
    debugging; other sources of information already exist.¹,² does it not use graphical
    user interface (GUI) debugging tools, such as xgdb,$ DDD,$ and insight,⁴ which
    are built on gdb. This chapter presents information on remotely debugging a simple
    program across the network. You can then use this debugging knowledge and other
    tools to enhance your environment and decrease your development time.


    # Introducing gdb


    The GNU tool debugger, gdb, allows you to control program execution, view and
    change program variables, examine program internals, and examine core files of
    crashed programs. You can use gdb to start an executable, debug an already running
    executable, or make a connection to gdbserver. gdb and gdserver handle'
