  md: '# Network-Mounting the root Filesystem 133


    Line 1 of the /etc/exports configuration file says that the MediaEngine with an
    ARM processor at IP address 192.168.1.21 has NAS read and write mounting access
    to the /tftpboot/arm-rootfs directory. Similarly, the RPX CLL with a PowerPC processor
    at IP address 192.168.1.22 has NAS read and write access to the /tftpboot/powerpc-rootfs
    directory. Finally, the Tri-M and COTS PC with i1386 processor at IP addresses
    192.168.1.23 and 192.168.1.24 have NAS read and write access to the /tftpboot/i386-rootfs
    directory.


    +   3. Make /etc/exports readable by:


    ```

    root@tbdev1[502]: chmod 444 /etc/exports

    ```


    +   4. The NFS reads the /etc/exports configuration file at startup, so you need
    to tell it to reload configuration:


    ```

    root@tbdev1[503]: /etc/init.d/nfs-server reload

    ```


    The NFS server is now configured and ready for NFS mounting with the targets.


    # Configuring the Target Kernels


    During the boot process, the bootloader passes the root filesystem location to
    the kernel, using boot prompt mechanism. The ARM and PowerPC bootloaders are configured
    during the kernel configuration process. On x86 machines, the Linux loader (lilo)
    is configured to pass the root filesystem location to the kernel.


    lilo is configured using the /etc/lilo.conf file. Both kernel compilation and
    lilo configuration result in the root filesystem location being passed to the
    kernel. Without root filesystem location information, the kernel can''t mount
    its root filesystem and stops, with a “kernel panic.”


    > TIP


    You can supervise the root filesystem location by entering new location information
    at the Linux boot: prompt. See the Linux BootPrompt HOWTO for more information.
    This section does not use the boot prompt because of the length of the NFS server
    root filesystem location.


    In the following steps, you''ll compile the MediaEngine ARM kernel for NFS mounting
    of the ARM root filesystem; the other platforms are similarly configured, except
    that their IP addresses and root filesystem paths are different:


    +   1. Change directory to the ARM kernel source and run make menuconfig:


    ```

    root@tbdev1[504]: cd /usr/src/arm-linux/

    root@tbdev1[505]: make menuconfig

    ```'
