  md: 'The querySerial program requires four command-line parameters: the serial port
    to use (/dev/ttyS0 or /dev/ttyS1), the baud rate (1200, 2400, 9600, 19200, or
    38400), a timeout value in milliseconds, and the command to be sent. querySerial
    sends the command at the baud rate, waits the specified amount of time, and returns
    all the characters received on the serial port. You can test querySerial directly
    on tdev1, without using a target board. Here are the steps to compile and test
    querySerial:


    +   1. Compile querySerial.c:

    root@tdev1[510]: gcc -o querySerial querySerial.c

    2. Physically connect tdev1''s serial ports together, using a null modem adapter
    and minicom.

    3. In one console window, run minicom and configure it by typing CTRL-a and then
    o. Select Serial Port Setup. Set SERIAL DEVICE to /dev/ttyS0 and the Bps/Par/Bits
    to 1200 8N1.

    4. In another console window, run querySerial to send a command ttyS1 to ttyS0,
    which then shows up in the minicom window. To do this, issue the following command:


    root@tdev1[517]: querySerial /dev/ttyS1 1200 5000 "this is a test"


    The string "this is a test" should show in the minicom window. The querySerial
    timeout, which is set to 5000 milliseconds, gives you 5 seconds to type a reply.

    5. In the minicom window, type "got it". If you do this within 5 seconds, you
    should see this in the bash prompt:

    root@tdev1[518]: querySerial /dev/ttyS0 1200 5000 "this is a test"

    got it

    root@tdev1[519]:


    If you don''t finish typing got it within 5 seconds, querySerial returns what
    you did in 5 seconds.


    # Summary


    You have now developed and tested three programs that set and query serial port
    control signals and issue serial commands from the bash prompt. That''s quite
    a feat because you had a lot to learn about the internal workings and configuration
    of the Linux serial device driver. Fortunately, you discovered that the driver
    provides'
  merge: -1
