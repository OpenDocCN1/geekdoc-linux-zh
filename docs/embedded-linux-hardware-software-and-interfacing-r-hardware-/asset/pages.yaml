  md: '+   /dev contains special device files.


    +   The kernel dynamically creates the /proc directory in memory to provide system
    information.


    +   /usr contains additional programs and libraries.


    +   /var contains files that change during runtime, such as lock and log files.


    The Trailazer engineers began to understand the root filesystem contents by examining
    tbdev1 (the Debian distribution development computer, which is described in Chapter
    3, "Selecting a Platform and Installing Tool Sets") They found that the root filesystem
    contained 10,734 files and used 67.428MB of disk space. They found a default Red
    Hat installation contains 29,296 files and uses 382.020MB. Clearly, taking the
    simple of merely copying the contents from a default Debian or Red Hat exceeds
    the storage capability of the engineers'' four target platforms, which ranges
    from 4MB to 16MB. The engineers needed to determine what files are really necessary
    to boot Linux and execute a bash prompt.


    # TIP


    Developing a root filesystem by examining the Linux boot process from start_kernel
    to the bash prompt results in a minimum set of required files and gives you an
    understanding of Linux''s interaction with processes and libraries.


    Someone suggested that they could start deleting files and see what happens. That
    hit-or-miss approach was quickly dismissed. The engineers learned from the Linux
    boot process that the kernel starts the init process that executes network and
    system initialization scripts and executes bash. The engineers wondered what files
