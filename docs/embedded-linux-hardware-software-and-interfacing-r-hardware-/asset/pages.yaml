  md: '# CHAPTER 10 Synchronous Serial Communication Interfacing


    Remember that the LM70 clocks MSB first and then clocks out data bits on the SC
    falling edge. The SI/O line should be sampled on the SC rising edge. The oscilloscope
    capture shown in Figure 10.2 shows a bit stream of 0000.1111.1111.1111, which
    corresponds to 27.75°C. The device driver returns 27°C because the getTemperature
    function performs an integer division on the value.


    ![](img/6d9baeee8ddb96b5248c3d68b6bc0ecb_300_0.png)


    **FIGURE 10.2** An oscilloscope capture of SC (top trace) and SI/O (bottom trace)
    signals during an SPI communication with the LM70.


    TIP


    The LM70 integrated circuit surface mount packaging has little thermal mass. This
    means it''s very responsive to temperature changes. Merely touching the LM70 affects
    its temperature reading. You can accurately measure the temperature of an object
    by gluing the LM70 with nonconductive glue.


    Here are the commands to compile and get a temperature from an LM70 using tbdev1:


    ```

    root@tbdev1[516]: gcc -O2 -D_KERNEL -DMODULE \

    -I/usr/src/linux/include -c LM70_x86.c -o LM70_x86.o

    root@tbdev1[517]: insmod LM70_x86.o

    root@tbdev1[518]: cat /proc/trailblazer/temperature

    ```'
