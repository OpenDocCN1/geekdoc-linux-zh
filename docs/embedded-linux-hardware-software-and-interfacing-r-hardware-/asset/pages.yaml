  md: "# Control Using the Parallel Port\n\nThe parallel port, sometimes called a\
    \ printer port, was originally designed to connect a printer to the computer.\
    \ Over the years, many other devices, such as scanners, removal drives, and copy\
    \ protection devices, have been connected to PCs via parallel ports. In today's\
    \ PCs, this port has eight data lines, four bidirectional control lines, and five\
    \ status input lines, and they are accessed through a DB-25 female connector.\
    \ Since its inception, the parallel port has evolved into four types:\n\n+   -\
    \ The standard parallel port (SPP)\n- The PS/2-type (simple bidirectional) port\n\
    - The enhanced parallel port (EPP)\n- The extended capabilities port (ECP)\n\n\
    The IEEE standard 1284, \"IEEE Standard Signaling Method for a Bidirectional Parallel\
    \ Interface for Personal Computers,\" defines these four types and is summarized\
    \ in this document:\n\n+   - Warp Nine Engineering's \"Introduction to the IEEE\
    \ 1284-1994 Standard,\" www.fapo.com/1284int.htm.\n\nOther online documentation\
    \ fully explains the similarities and differences between these types and are\
    \ as follows:\n\n+   - Jan Axelson's \"Parallel Port Complete Programming, Interfacing,\
    \ & Using the PC's Parallel Printer Port,\" www.lvr.com/files/ppc1.pdf.\\n- Craig\
    \ Peacock's \"Interfacing the Standard Parallel Port,\" www.boundarylogic.org/spp/parallel.pdf.\n\
    - Craig Peacock's \"Interfacing the Enhanced Parallel Port,\" www.boundarylogic.org/epp/epp.pdf.\n\
    - Craig Peacock's \"Interfacing the Extended Capabilities Port,\" www.boundarylogic.org/ecp/ecp.pdf.\n\
    \n Trailblazer uses six inputs and four outputs. Using the online documentation,\
    \ the engineers determined the bidirectional SPP type of port will suffice. The\
    \ port does not need to control a high-speed printer—just some slow-speed inputs\
    \ and outputs.\n\nSPP hardware is usually port I/O mapped to the x86 ISA bus (that\
    \ is, port isn't memory mapped) at I/O base address 0x378. By using the motherboard\
    \ BIOS, you can change this address and port type. For this chapter, your PC's\
    \ BIOS configures LPT1 as an SPP type at the base address 0x378. The three"
  merge: -1
