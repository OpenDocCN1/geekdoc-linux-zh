  md: '# # Chapter 13 Switching Users


    To switch users at the command line, use the **su** command. Without any arguments,
    **su will** switch to the superuser account, also known as root. Alternatively,
    you can execute **su root**. Switching users will not change your current working
    directory or environment variables, unless you specify a hyphen following su.
    By specifying a hyphen, you simulate logging into the system as that user. For
    example, `su - root`.


    **su [username]** Change to username or become the superuser.


    Common **su** options:


    +   - A hyphen is used to provide an environment similar to what the user would
    expect had the user logged in directly.


    +   **su -c command** Specify a command to be executed. If the command is more
    than one word in length, it needs to be quoted.


    ```

    jason@linuxsvr:~$ export TEST=1

    jason@linuxsvr:~$ su oracle

    Password:

    oracle@linuxsvr:~/home/jason$ echo TEST

    1

    jason@linuxsvr:~/home/jason$ pwd

    /home/jason

    oracle@linuxsvr:~/home/jason$ exit

    exit

    jason@linuxsvr:~$ su oracle

    Password:

    oracle@linuxsvr:~$ echo TEST

    ```


    ```

    oracle@linuxsvr:~$ pwd

    /home/oracle

    oracle@linuxsvr:~$ exit

    jason@linuxsvr:~$ su -c ''echo $ORACLE_HOME'' oracle

