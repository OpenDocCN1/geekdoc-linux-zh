  md: "# Chapter 10 I/O Redirection\n\nThe Linux operating system features a concept\
    \ called I/O streams. The three default I/O streams are standard input, standard\
    \ output, and standard error. When a process is launched, it is connected to these\
    \ three I/O streams, also called standard streams. By default, standard input\
    \ comes from your keyboard while standard output and standard error are displayed\
    \ on your screen. By convention, standard output is used for normal output while\
    \ standard error is reserved for error messages.\n\nEach stream is assigned a\
    \ file descriptor. A file descriptor is referenced by a number and represents\
    \ an open file. Standard input is assigned file descriptor 0, standard output\
    \ is assigned file descriptor 1, and standard error is assigned file descriptor\
    \ 2. This effectively means that your keyboard and display can be substituted\
    \ for actual files. This layer of abstraction allows you to save output that would\
    \ normally appear on your screen to a file. It also allows you to send input to\
    \ a command from a file. You can use the output of one command as the input for\
    \ another command.\n\nTable 34: Standard Streams\n\n| File Descriptor | Abbreviation\
    \ | Stream |\n|---|---||\n| 0 | stdin | standard input |\n| 1 | stdout | standard\
    \ output |\n| 2 | stderr | standard error |\n\nMany Linux commands allow you to\
    \ provide input by specifying a file as argument or by accepting standard input.\
    \ In the absence of a file, many commands expect standard input. Files, as well\
    \ as standard input, are terminated with an end of file (EOF) marker. You can\
    \ produce this EOF marker using your keyboard by typing **Ctrl-d**.\n\nAs an example\
    \ of this behavior, let's look at the **sort** command. To have **sort** operate\
    \ on a file, supply that file as an argument in the following example:\n\n```\n\
    $ \text{cat test.txt}\ne\na\nc\nb\nd\n$ sort test.txt\na\nb\nc\n```"
  merge: -1
  pgno: 63
- img_proc: true
  md: 'To have sort operate on standard input, run the sort command without any arguments
    and start typing text. When you are finished, type Ctrl-d to send the EOF character.
    The standard input you provided will then be sorted.


    ```

    $ sort

    a

    b

    c

    d

    <Ctrl-d>

    a

    b

    c

    d

    e

    $


    ```


    To send the standard output of one command as the standard input to another command,
    use a pipe (|) between the commands. The following example demonstrates sending
    the output of cat text.txt as the input to the sort command.


    ```

    $ cat test.txt | sort

    a

    b

    c

    d

    e

    $


    ```


    To use the contents of a file as standard input, separate the command from the
    file with a less sign (<).


    ```

    $ sort < test.txt

    a

    b

    c

    d


    ```'
