    ^G Get Help ^O WriteOut ^R Read File ^Y Prev Page ^K Cut Text ^C Pos

    ^X Exit ^J Justify ^W Where Is ^V Next Page ^U Uncut Text ^T To Shell


    # The Vim Editor


    If you are looking for an editor that has advanced editing capabilities, and one
    that you can use at the command line, use vi or Emacs. On a Linux system, when
    you attempt to use vi, you will actually be using Vim, short for improved. The
    vi is typically symlinked to Vim. The Vim editor is compatible with the commands
    found in the vi editor, which was originally created for the Unix operating system.
    Vim includes additional features not found in vi, syntax highlighting, the ability
    to edit files over the network, multi-level undo and redo, and screen splitting.
    One advantage of learning Vim or vi is that you can apply the key mappings to
    other commands, such as man, more, less, and view.


    # Command Mode


    One unique characteristic of the vi and Vim editors is the concept of modes. The
    three modes in Vim are command, insert, and line. Vim starts in command mode.
    To get back to command mode at any time, simply press the Escape key. When in
    command mode, the keys sent to the editor do not end up in the file, but are rather
    interpreted as commands. Command mode allows you to navigate about the file, perform
    searches, delete text, copy text, paste text, and more.'
