  md: '# Chapter 12 Processes and Jobs


    The ps command is used to list the currently running processes on a Linux system.
    If you run ps without any arguments, it displays the processes that are running
    as you and associated with your terminal. If you were to connect to a Linux server
    twice, you would see different output from the ps command. You might see the following
    for the first session, which is using pts/0 (pseudo terminal 0).


    ```

    $ ps

    PID TTY         TIME CMD

    1309 pts/0     00:00:00 bash

    1635 pts/0     00:00:00 ps

    ```


    The following is the output from ps on the second connection, which is using pts/1.


    ```

    $ ps

    PID TTY         TIME CMD

    1721 pts/1     00:00:00 bash

    1821 pts/1     00:00:00 ps

    ```


    If you want to display all of your running processes, regardless of the associated
    terminal or lock, use the command ps -u username.


    ```

    $ ps -u jason

    PID TTY         TIME CMD

    1308 ?           00:00:00 sshd

    1309 pts/0     00:00:00 bash

    1720 ?           00:00:00 sshd

    1721 pts/1     00:00:00 bash

    ```


    To see every process running on the system, use the command ps -e.


    ```

    $ ps -e | head

    PID TTY         TIME CMD

    1 ?             00:00:00 init

    2 ?             00:00:00 kthread

    3 ?             00:00:00 ksoftirqd/0

    6 ?             00:00:00 migration/0

    ```'
