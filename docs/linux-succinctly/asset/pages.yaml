  md: '# Working with Groups


    Let''s look at a situation where multiple people need access to the same file.
    For example, the members of a sales team need to update a file named **sales.report**,
    the group owner of the file could be set to the Linux group named **sales** using
    the `chgrp` command. Next, the permissions could be set to 664 (rw-r--r--) or
    even 660 (rw-rw--) if you do not want others on the system to be able to read
    it. Technically, 774 (rwxrxr-x) and 770 (rwxrwx--) also work, but since **sales.report**
    is not an executable program, it makes sense to use 664 (rw-r--r--) or 660 (rw-rw--).


    When a file is created, it is set to the current user''s primary group. You can
    override this behavior by using the `newgrp` command, but remember that a new
    file will inherit its default group. In the following example, Jason''s primary
    group is **users**. The format of the `chgrp` command is `chgrp GROUP FILE`.


    ```

    $ sales.report

    $ ls -l .report

    -rw-r--r-- 1 json users 6 Jun 15 20:41 sales.report

    $ chgrp sales.report

    $ ls -l .report

    -rw-r--r-- 1 json sales 6 Jun 15 20:41 sales.report

    $ chmod 664 sales.report

    $ ls -l .report

    -rw-rw--r-- 1 json sales 6 Jun 15 20:41 sales.report

    ```


    Sharing files within individual user''s home directories can be confusing. It''s
    often easier to keep shared data in a shared location. If you have supervisor
    privileges, you could create **/usr/local/sales** directory for the sales team.
    If you don''t have such permissions you can ask the system administrator to create
    that directory for you. The group owner should be set to **sales** and the permissions
    should be set to 775 (rwxrxr-x) or 770 (rwxrwx--). Use 775 (rwxrwxrxr--) if no
    one outside the sales team should have access to any files, directories, or programs
    located in **/usr/local/sales**.


    ```

    $ ls /usr/local/sales

    drwxr-xr-x 2 root sales 4096 1 Jun 15 20:53 /usr/local/sales

    $ mv sales.report /usr/local/sales/

    $ ls -l /usr/local/sales

    total 4

    -rw-rw--r-- 1 json sales 6 Jun 15 20:41 sales.report

    ```


