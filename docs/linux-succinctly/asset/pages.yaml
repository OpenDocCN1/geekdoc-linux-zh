    The most common way to see the contents of a directory is to use the **ls** command.
    To view the contents of a file, use the **cat** command.


    **ls** The **ls** command lists directory contents. Additionally, **ls** can be
    used to display information about files and directories including permissions,
    size, and type.


    **cat [file]** The **cat** command concatenates, or displays, files.


