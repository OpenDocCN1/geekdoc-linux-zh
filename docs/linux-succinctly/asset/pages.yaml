    $ sudo -u fred /opt/fredsApp/bin/start

    Fred''s app started as user fred.

    $ sudo su - oracle

    [sudo] password for jason:

    oracle@linuxsvr~$ whoami

    oracle

    oracle@linuxsvr~$ exit

    $ whoami

    jason

    $

    ```


    The output of sudo -1 displays what commands can be executed with sudo and under
    which account. In the previous example, sudo will not prompt for a password for
    the commands preceded by NOPASSWD. This type of configuration may be required
    to automate jobs via cron that require escalated privileges.'
