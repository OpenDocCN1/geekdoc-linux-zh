  md: '# Chapter 4 Directories


    In addition to referencing directories by their full or absolute paths, you can
    reference directories by their relative paths. An absolute path starts with a
    forward slash. An example of a full path is /home/jason/Music. A relative path
    does not start with a forward slash. When using relative paths, the paths are
    relative to the current working directory. To change into the Music directory
    from /home/jason, you would simply type cd Music.


    ```

    $ cd /home

    $ pwd

    /home

    $ cd jason/Music

    $ pwd

    /home/jason/Music

    $ cd JohnColtrane

    $ pwd

    /home/jason/Music/JohnColtrane

    ```


    Linux uses a to represent the current directory and .. to represent the parent
    directory. Also, in a trailing slash, but this is often assumed. The following
    commands place you in the same directory.


    ```

    $pwd

    /home/jason

    $ cd ..

    $pwd

    /home

    $ cd /home

    $ pwd

    /home

    $ cd /home/

    $ pwd

    /home

    ```


    To quickly return to your previous working directory, use the cd - command.


    ```

    $ cd /var/log

    $ pwd

    /var/log

    $ cd /etc/init.d

    $ pwd

    ```'
  merge: -1
  pgno: 21
