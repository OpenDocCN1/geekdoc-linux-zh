  md: 'The find command examines each file and directory in the provided path to determine
    if it matches the given expression. Sometimes this is if only a small number of
    items have to be examined. However, if you were to run find / -name some_name,
    find would examine every single file on the system and this could potentially
    be a slow process. There is another utility that you can use to find items on
    a Linux system and it''s called locate.


    locate pattern Display files and directories that match pattern.


    The locate command examines an index, or database, which is updated daily by a
    process named updatedb. The advantage to this approach is that it''s really fast
    since it doesn''t have to examine files and directories in real time. The disadvantage
    is that it is not in real time. The locate command is great for finding files
    or directories that are older than a day, but it won''t find items that have just
    been created. Also, locate and updatedb are sometimes not installed enabled.


    ```

    $ locate giant

    /home/jason/Music/JohnColtrane/giantsteps.mp3

    $ locate httpd.conf

    /etc/apache2/httpd.conf

    $

    ```


    # Sorting


