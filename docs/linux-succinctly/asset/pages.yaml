    \ |\n\nWhen a program is started in the background, two numbers are returned before\
    \ the new prompt is displayed. Those two pieces of information are the job number,\
    \ which is enclosed in brackets, and the process ID (PID). Job numbers can be\
    \ referenced by preceding them with a percent sign. The following example demonstrates\
    \ starting multiple processes in the background.\n\n```\n$ ./long-running-proc\
