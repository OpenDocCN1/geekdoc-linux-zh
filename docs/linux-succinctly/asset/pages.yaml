  md: '# Chapter 9 Finding, Sorting, and Comparing Files and Directories


    To locate files or directories on a Linux system, you can use the find command.
    You can find files by owner, size, permissions, name, modification time, and more.


    find [path... ] [expression] Recursively find files and directories in path that
    match expression. When running find without arguments, path is assumed to be the
    current directory.


    ```

    $ find

    ./.bash_history

    ./Pictures

    ./.bashrc

    ./Downloads

    ./.bash_logout

    ./.viminfo

    ./Desktop

    ./Documents

    ./goals.txt

    ./to-do.txt

    ./.profile

    ./Music

    ./Music/JohnColtrane

    $

    ```


    Table 32: Common find Commands


    | Command | Description |

    | find -name pattern | Display items whose names match pattern (case sensitive).
    |

    | find -iname pattern | Same as -name, but not case sensitive. |

    | find -ls | Perform an ls operation on each of the items. |

    | find -mtime number_of_days | Display items that are number_of_days old. |'
