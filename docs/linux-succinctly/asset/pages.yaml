    $ cd Music

    $ ls

    JohnColtrane

    ```


    To end your command line session, type **exit**, **logout**, or **Ctrl-d**.


    **exit**, **logout**, or **Ctrl-d** Exits the shell or your current session.


    ```

    $ exit

