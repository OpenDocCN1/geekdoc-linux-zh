  md: "commands. Once the program is finished, a new command prompt is displayed,\
    \ ready to execute your next command. Many commands take anywhere from a fraction\
    \ of a second to just a few seconds to run. However, you may want to execute a\
    \ long running program and continue to perform other work in the meantime. To\
    \ start a program in the background, end the command line with an ampersand. When\
    \ you start a program in the background, the command prompt is immediately returned\
    \ and allows you to continue other commands. These background programs and processes\
    \ are often referred to as jobs.\n\n| Command | Description |\n| command & | Start\
    \ command in the background. |\n| Ctrl-c | Kill the foreground process. |\n| Ctrl-z\
    \ | Suspend the foreground process. |\n| bg [%num] | Background a suspended process.\
    \ |\n| fg [%num] | Foreground a backgrounded process. |\n| kill [%num] | Kill\
