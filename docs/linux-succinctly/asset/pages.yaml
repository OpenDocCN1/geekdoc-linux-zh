- img_proc: true
  md: 'To redirect the output of a command to a file, use the greater than sign (>)
    followed by a file name. If the file doesn''t exist it will be created. If it
    does exist, it will be overwritten.


    ```

    $ sort test.txt > sorted.txt

    $ cat sorted.txt

    a

    b

    c

    d

    e

    $

    ```


    If you want to append output to a file, use the double greater sign (>>). If the
    file doesn''t exist, it will be created, but if it does exist, the output from
    the command will be appended to the file.


    ```

    $ sort test.txt >> sorted.txt

    $ cat sorted.txt

    a

    b

    c

    d

    e

    a

    b

    c

    d

    e

    $

    ```


    You are not limited to just redirecting input or just redirecting output—you can
    do both at the same time. The following example demonstrates reading standard
    input from test.txt while redirecting standard output to sorted.txt.


    ```

    $ sort < test.txt > sorted.txt

    $ cat sorted.txt

    a

    b

    c

    ```'
