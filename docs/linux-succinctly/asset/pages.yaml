  md: 'umask [-S] [mode] Sets the creation mask to a mode if specified. If a mode
    is omitted, the current mode will be displayed. Using the -S argument allows umask
    to display or set the mode with symbolic notation.


    A quick way to estimate how a umask mode affects default permissions is to subtract
    the octal umask mode from 777 in the case of directories, and 666 in the case
    of files. The following is an example of a 022 umask, which is typically the default
    umask used by Linux distributions or by system administrators.


    # Table 13: Creation Permission Estimation


    | File | Directory |

    |---|---|-|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -022 | -022 |

    | Creation Permission | 644 | 755 |


    Using a umask of 002 is ideal for working with members of your group. When files
    or directories are created, the permissions allow members of the group to manipulate
    those files and directories.


    # Table 14: Creation Permission Estimation


    | File | Directory |

    |---|---|-|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -002 | -002 |

    | Creation Permission | 664 | 775 |


    Here is another possible umask to use for working with members of your group.
    By using 007, no permissions are granted to users outside of the group.


    # Table 15: Creation Permission Estimation


    | File | Directory |

    |---|---|-|

    | Base Permission | 666 | 777 |

    | Subtract the Umask | -007 | -007 |

    | Creation Permission | 660 * | 770 |


    Again, using this subtraction method is a good estimation. You can see that the
    method breaks down with the umask of 007. To get an accurate result each time,
    you need to convert the octal permissions into binary values. From there, you
    use a bitwise NOT operation on the umask mode and then perform a bitwise AND operation
    against that the base permissions. Another way to think of this is that the umask
    disables the values specified.'
