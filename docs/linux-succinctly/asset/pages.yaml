- img_proc: true
  md: "# Table 35: Redirecting I/O\n\n| Operator | Format | Action |\n| --- | ---\
    \ | --- |\n| > | cmd > file | Create or overwrite file with standard output from\
    \ cmd. |\n| >> | cmd >> file | Create or append to file with standard output from\
    \ cmd. |\n < | cmd < file | Use the contents of file as standard input to cmd.\
    \ |\n\nBy default, input redirection operates on file descriptor 0 and output\
    \ redirection operates on descriptor 1. You can explicitly declare a file descriptor\
    \ to use with redirection by immediately preceding the operator with the file\
    \ descriptor number. Do not use a space between the file descriptor number and\
    \ the redirection operator. If the file descriptor does not immediately precede\
    \ the redirection operator, it will be interpreted as another item on the command\
    \ line.\n\nTo capture error messages to a file while displaying standard output\
    \ to your screen, use 2>. You can also redirect standard output to one file while\
    \ redirecting standard output to another.\n\n```\n$ ls test.txt no-such-file\n\
    ls: cannot access no-such-file: No such file or directory\ntest.txt\n$ ls test.txt\
    \ no-such-file 2>errors\ntest.txt\n$ cat errors\nls: cannot access no-such-file:\
    \ No such file or directory\n$ ls test.txt no-such-file 1>normal-output 2>errors\n\
    $ cat normal-output\ntest.txt\n$ cat errors\nls: cannot access no-such-file: No\
    \ such file or directory\n$\n```\n\nNot only can you redirect output to a file,\
    \ you can redirect it to another file descriptor using an ampersand followed by\
    \ the file descriptor number. Using this method, you can combine standard output\
    \ and standard error using 2>&1. Do not use spaces."
  merge: -1
  pgno: 66
- img_proc: true
  md: 'The following-output means, "send the standard output of the ls command to
    the combined-output file and append standard error to standard output." All output
    will be sent to the combined-output file because standard error is redirected
    to standard output and standard output is redirected to combined-output.


    ```

    $ ls test.txt no-such-file > combined-output 2>&1

    $ cat combined-output

    ls: cannot access no-such-file: No such file or directory

    test.txt

    $

    ```


    If you do not want to display the output of a command to your screen or save it
    to a file, you redirect the output to the null device, /dev/null. This special
    file simply discards any input that is sent to it. The null device is sometimes
    referred to as the "black hole" or "bit bucket". The following example redirects
    the errors from sort to the null device.


    ```

    $ ls test.txt no-such-file

    ls: cannot access no-such-file: No such file or directory

    test.txt

    $ ls test.txt no-such-file 2>/dev/null

    test.txt

    $

    ```'
