  md: '# About the Author


    Jason Cannon started his career as a Unix and Linux System Engineer in 1999. Since
    that time, he has utilized his Linux skills at companies such as Xerox, UPS, Hewlett-Packard,
    and Amazon. Additionally, he has acted as a technical consultant and independent
    contractor for small businesses as well as Fortune 500 companies.


    Jason has professional experience with CentOS, RedHat Enterprise Linux, SUSE Linux
    Enterprise Server, and Ubuntu. He has used several Linux distributions on personal
    projects including Debian, Slackware, CrunchBang, and others. In addition to Linux,
    Jason has experience supporting proprietary Unix operating systems including AIX,
    HP-UX, and Solaris.


    He enjoys teaching others how to use and exploit the power of the Linux operating
    system. Jason is the author of Command Line Kung Fu: Bash Scripting Tricks, Linux
    Shell Programming Tips, and Bash Oneliners as well as Linux for Beginners: An
    Introduction to the Linux Operating System and Command Line. He is also the founder
    of http://LinuxTrainingAcademy.com, where he blogs and teaches online video training
    courses.'
