    $ jobs

    [3]- Running ./long-running-proc &

    [4]+ Running ./long-running-proc &

    $

    ```


    In order to return a job to the foreground, use the fg command followed by a percent
    sign and job number. A shorthand to perform the exact task is to type a percent
    sign followed by the job number on the command line. So, fg %2 and %2 are equivalent.


    Remember that the current job can be referenced by %% or %+. Also, the fg command
    operates on the current job unless another job is supplied. The following four
    commands are identical.


    ```

    $ fg

    $ fg %%

    $ fg %+

    $ %%

    ```


