  md: '# Command Line Help


    The Linux operating system provides built-in documentation. To access these online
    manuals, also called man pages, use the man command. Man pages are great for looking
    up the available options for a given command or even finding a command that will
    help you accomplish the task at hand.


    [command] The man command displays the online manual for a given command.


    Once you have executed the man command, you can navigate through the man page
    with the arrow keys, as well as the Page Up and Page Down keys. You can also use
    Enter to move down a line, the Spacebar to move down a page, g to move to the
    beginning, and capital g to move to the end of the man page. To quit, type q.
    To learn about even more commands available while viewing man pages, type h for
    help.


    Table 1: Navigating Man Pages


    | Key | Action |

    |---|---|n| Enter, Down Arrow | Move down one line. |

    | Up Arrow | Move up one line. |

    | Spacebar, Page Down | Move down one page. |

    | g | Go to the start or top. |

    | G | Go to the end or bottom. |

    | q | Quit. |


    ```

    $ man

    What manual page do you want?

    $ man ls

    LS(1) User Commands LS(1)

    NAME

    ls - list directory contents

    SYNOPSIS

    ls [OPTION]... [FILE]...

    DESCRIPTION

    List information about the FILEs (the current directory by default).

    Sort entries alphabetically if none of -fctuvSUX nor --sort is specified.

    ```'
  merge: -1
  pgno: 18
