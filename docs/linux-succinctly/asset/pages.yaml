    # # Comparing


    You can use the **diff**, **sdiff**, and **vimdiff** commands to compare files
    and directories. The **diff** command displays just the differences, **sdiff**
    displays the two files side-by-side while highlighting the differences, and **vimdiff**
    uses the Vim editor to display the differences. Simply supply the command items
