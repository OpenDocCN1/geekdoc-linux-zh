  md: 'previous job. The current job is the last job that was started in the background
    or the most recent process that was stopped while it was running in the foreground.
    You can reference the current job by using double percent signs (%% or a percent
    sign followed by a plus sign (+). The previous job can be accessed by using a
    percent sign followed by a minus sign (-). When working with the fg and bg commands,
    the current job is operated upon unless you explicitly specify a different job.


    In the preceding output of the jobs command, job number 1 is reported as done
    while the other jobs are in a running state. The shell reports job statuses right
    before a new prompt is displayed. The shell will not interrupt your current command
    line, even if it is empty, to report that a job has completed. For a new prompt
    to be displayed, press the Enter key. If any of your jobs have completed, a status
    will be displayed before your new prompt is presented. The following is an example
    of that behavior.


    ```

    $ <ENTER>

    $ <ENTER>

