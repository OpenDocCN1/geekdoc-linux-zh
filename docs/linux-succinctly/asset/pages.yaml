    to just the dollar sign, unless displaying the entire prompt provides additional
    clarity.


    # # Basic Commands


    In Linux, commands are case-sensitive and are typically lowercase. Note that items
    surrounded by square brackets are optional. Let''s start with two commands that
    will allow you to navigate around the system at the command line. They are **pwd**
    and **cd**.


    The **pwd** command displays the working directory to your screen. A command allows
    you to keep track of where you are in the file system hierarchy.


    **cd [directory]** The **cd** command changes the current directory to the supplied
    directory. If **cd** is executed without specifying a directory, it changes the
    current directory to your home directory. This is how you navigate around the
    system.


    The following is an example of how the **pwd** and **cd** commands can be used.
    Remember that order matters.


    ```

    ```$ pwd

    /home/jason

    $ Pwd```

    ```'
