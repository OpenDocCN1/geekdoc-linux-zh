  md: '# Chapter 6 Permissions


    Looking back at the long listings provided by the ls command, we can now decipher
    the permissions for a given file or directory listing. Permissions are displayed
    at the beginning of long listings.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data

    ```


    The first character in the permissions string reveals the type. For example, -
    is a regular file, d is a directory, and l is a symbolic link. Those are the most
    common types you will encounter. However, there are other file types listed in
    the following table.


    Table 4: File Types


    | File Type | Symbol |

    | Regular file | - |

    | Block special file | b |

    | Character special file | c |

    | Directory | d |

    | Symbolic link | 1 |

    | FIFO (named pipe) | p |

    | Socket | s |

    | Some other file type | ? |


    The remaining characters in the permissions string represent the three main types
    of permissions: read, write, and execute. Each permission is represented by a
    single letter, known as a symbol. Read is represented by r, write by w, and execute
    by x.


    Table 5: Permissions


    | Permission | Symbol |

    | Read | r |

    | Write | w |

    | Execute | x |'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'For files as opposed to directories, read, write, and execute permissions have
    intuitive meanings. Read permissions allow you to view the contents of a file.
    Write permissions allow you to modify a file. Execute permissions allow you to
    run, or execute, a file as a program.


    The meanings of the read, write, and execute permissions are not intuitive when
    it comes to directories. Read permissions allow you to read the file names in
    a directory. Write permissions allow you to change the entries in a directory
    by renaming files, creating files, and deleting files. Execute permissions allow
    you to cd or change into the directory. Review the following differences between
    file and directory permissions.


    Table 6: File and Directory Permissions


    | Permission | File Meaning | Directory Meaning |

    | --- | --- | --- |

    | Read | Allows a file to be read. | Allows file names in the directory to be
    read. |

    | Write | Allows a file to be modified. | Allows entries within the directory
    to be modified. |

    | Execute | Allows the execution of a file. | Allows access to the contents and
    metadata of entries within the directory. |


    All files in Linux are owned by a user and a group. This allows for unique permissions
    to be applied across three sets of users: the user owner, the group owner, and
    others. When modifying permissions, these sets can be represented by a single
    letter: u for the user owner, g for the group owner, and e for others. In addition,
    the letter a can represent all three of these permissions groups. Note that these
    characters do not show up in an ls listing, but they can be used when changing
    permissions.


    Table 7: User Categories


    | Category | Symbol |

    | --- | --- |

    | User | u |

    | Group | g |

    | Other | o |

    | All | a |


    Going back to our original example, we can view the user and group owner of the
    file sales.data. The user owner is listed first, followed by the group owner.
    In this case, jason is the user owner, and users is the group owner.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data

    ```'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Every user is a member of at least one group, called their primary group. However,
    users can be members of many groups. Groups are used to organize users into logical
    sets. For example, a group named sales might be created and contain all the employees
    from the sales department. You can set a file''s group owner as the sales group,
    and allow members of the sales group read and write permissions to the file, or
    any other set of permissions for that matter.


    To determine which groups you belong run the groups command. If you supply another
    user''s ID as an argument to the groups command, you will see the list of groups
    to which that belongs. You can also run id -Gn [user] to get the same result.


    ```

    $ groups

    users sales

    $ id -Gn

    users sales

    $ groups tracy

    users projectx dba

    $ groups john

    users sales manager

    ```


    # Decoding Permissions


    Now you have enough background information to start decoding permissions strings.
    The first character in the permissions string is the type. The next three characters
    represent the permissions available to the user, also known as the owner of the
    file. The next three characters represent the permissions available to the group.
    The last three characters represent the permissions available to all others.


    In this case, order matters. Permission groups will always be displayed in this
    order: user, group, and others. Within these three permission groups, permission
    types will be in this order: read, write, and execute. If a particular permission
    is not granted, then a hyphen (-) will take its place.


    Here is colorized representation of the permission information displayed ls -
    The file type is highlighted in red, the user permissions in green, the group
    permissions in blue, and the other permissions in purple.


    ```

    $ ls -l sales.data

    -rw-r-- 1 jason users 10400 Jun 14 09:31 sales.data

    ```


    By examining the preceding example, you can determine that the file type is a
    regular file (-), the user owner is allowed read and write permissions (rw-),
    the group owner is granted read permissions (r--), and others are allowed read
    permissions as well (r--). The user owner is jason, and the group owner is users.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'If there happens to be an additional character at the end of the permissions
    string, an alternative access control method has been applied. A trailing period
    (.) means that a SELinux (Security-Enhanced Linux) security context has been applied
    to the file or directory. A trailing plus (+) means that ACLs (Access Control
    Lists) are in use. SELLinux and ACLs are beyond the scope of this book. However,
    you will be pleased to know that the use of these is rare. If you are having issues
    with permissions, look for an additional trailing character in the permissions
    string. If one is present be aware that further investigation may be necessary.


    ```

    $ ls -l sales.data.selinux

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data.selinux

    $ ls -l sales.data.acl

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data.acl

    ```


    # Changing Permissions


    Permissions are also known as modes. The command chmod, which is short for "change
    mode", is used to change permissions. The format of the chmod command is chmod
    mode file. There are two ways to specify the mode. The first way is symbolic mode.
    The symbolic mode format is chmod user_category operator permission. Here is a
    table view of the chmod command using the symbolic format.


    | Symbol | Description |

    | --- | --- |

    | chmod | The change mode command itself. |

    | ugoa | The user category. Use one or more of u for g for group, o for other,
    a for all. |

    | +- | One of +, -, or =. Use + to add permissions, to subtract them, or = to
    explicitly set them. |

    | rwx | The actual permissions. Use one or more of r for read, w for write, and
    x for execute.


    You can add, subtract, or set permissions using user category and permission pairs.
    For example, if you want to add the permission for the group owner, you would
    specify chmod g+w file.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data

    $ chmod g+w sales.data

    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data

    ```'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'After running chmod g+w sales.data, the permissions string changed from -rw-r--r--
    to -rw-r--r-- Remember that the permissions are displayed in the order of user,
    group, and other. The group permission now includes the w symbol, indicating that
    the write permission has been granted. Now Jason, the owner of the file, and members
    of the users can read and write to the sales.data file. The following example
    demonstrates how to subtract the write permission.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason 10400 Jun 14 09:31 sales.data

    $ chmod g-w sales.data

    $ ls -l sales.data

    -rw-r--r-- 1 jason 10400 Jun 14 09:31 sales.data

    ```


    Multiple permissions can be changed at once. For example, you can add and execute
    permissions for the group owner using g+wx.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason 10400 Jun 14 09:31 sales.data

    $ chmod g+wx sales.data

    $ ls -l sales.data

    -rw-rwxrxr-- 1 jason 10400 Jun 14 09:31 sales.data

    ```


    You can also modify multiple permissions at once. For example, ug+wx will add
    and execute permissions for the user and group if they don''t already have them.
    In this case, notice that the user owner already had write permission before the
    chmod command was executed. After running chmod, the user owner will still have
    write permissions, as well as the newly added execute permissions. Using + to
    add permissions will always add permissions, if applicable. It never takes away.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason 10400 Jun 14 09:31 sales.data

    $ chmod ug+wx sales.data

    $ ls -l sales.data

    -rw-rwxrwx-- 1 jason 10400 Jun 14 09:31 sales.data

    ```


    If you want to set different permissions for different user categories, you can
    separate the specifications with comma. You can mix and match to produce the permissions
    you desire. For example, u=rw,g+wx will set the read, write, and execute permissions
    for the file owner while adding the execute permission for the group. See how
    the permissions change for sales.data in the following example.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason 10400 Jun 14 09:31 sales.data

    $ chmod u=rw,g+x sales.data

    ```'
