  md: '# Chapter 7 Viewing and Editing Files


    In a preceding chapter, you learned that the cat command displays the the entire
    contents of a file. If you would like to navigate the contents of a file, you
    can use a pager utility such as more or less. To display the top portion of a
    file, use the head command. The tail command allows you to display the end of
    a file.


    cat file Concatenate (display) the entire contents of a file.


    more file Browse through a text file. Press the Spacebar to advance to the next
    page. Enter to advance to the next line. Type q to quit viewing the file.


    less file Like more, but allows backward movement and pattern searches.


