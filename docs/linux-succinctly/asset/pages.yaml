    | sort -k FIELD_NUM file | Sort by "key". Sort by the FIELD_NUM column. |

    | sort -r file | Sort in reverse order. |

    | sort -u file | Sort uniquely. No duplicates are displayed. |


    ```

    $ cat random-states

    Tennessee Nashville

    Wyoming Cheyenne

    Indiana Indianapolis

    Indiana Indianapolis

    Arizona Phoenix

    Colorado Denver

    Indiana Indianapolis

    ```'
