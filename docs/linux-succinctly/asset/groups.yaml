    ## 第 9 章 查找、排序和比较文件与目录


    要在 Linux 系统上定位文件或目录，你可以使用 `find`。你可以通过名称、大小、权限、修改时间来查找文件。但是，如果你运行 `find / -name
    some_name`，`find` 将检查系统上的每一个文件，这可能是一个缓慢的过程。另一个可用于查找项的工具叫做 `locate`。


    `locate pattern` 显示匹配模式的文件和目录。


    `locate` 命令检查一个索引（或数据库），该数据库由名为 `updatedb` 的进程每天更新一次。这种方法的优点是它非常快，因为不需要实时检查文件和目录。缺点是它不是实时的。`locate`
    命令对于查找旧于一天的文件或目录非常棒，但它找不到刚刚创建的项目。此外，`locate` 和 `updatedb` 有时未安装或启用。


    ## 表 32: 常用 find 命令


    | 命令 | 说明 |

    |---|---|

    | find -name | 按名称显示项。 |

    | find -iname | 与 name 相同，但不区分大小写。 |

    | find -ls | 对每个项执行 `ls`。 |

    | find -mtime | 显示旧于指定天数的项。 |

    | find -size | 按大小显示项。 |

    | find -type d | 显示目录。 |

    | find -exec | 对每个项运行命令。 |

    | find {} | 找到的项占位符。 |


    `find` 命令检查提供路径中的每个文件和目录，以确定其是否匹配给定的表达式。在不带参数运行 `find` 时，假设路径为当前目录。


    ```

    $ ls Desktop Downloads Music todo.txt

    .bash_history .bashrc .profile

    .hidden

    .viminfo

    $ find -name

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name *

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name t*

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name g*

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name g?

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name g????

    .bash_history .bashrc .profile


    hidden .viminfo

    $ ls -d .*

    .bash_history .bashrc .profile

    .hidden .viminfo

    ```


    ## 表 33: 常用 sort 选项


    | 选项 | 说明 |

    |---|---|

    | sort | 对文本排序。 |

    | sort -k FIELD_NUM | 按“键”排序。按 FIELD_NUM 列排序。 |

    | sort -r | 反向排序。 |

    | sort -u | 唯一排序。不显示重复项。 |


    使用 `sort` 命令对文件内容排序。


    ```

    $ find -mtime 1

    .bashrc .viminfo

    $ find -size +2M

    /Music/Johntrane/giantsteps.mp3

    $ find -type d -newer-do

    /Music/Johntrane

    $ find -name *|exec;

    ```


