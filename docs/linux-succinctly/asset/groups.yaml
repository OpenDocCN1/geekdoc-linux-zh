    ```


    To send the standard output of one command as the standard input to another command,
    use a pipe (|) between the commands. The following example demonstrates sending
    the output of cat text.txt as the input to the sort command.


    ```

    $ cat test.txt | sort

    a

    b

    c

    d

    e

    $


    ```


    To use the contents of a file as standard input, separate the command from the
    file with a less sign (<).


    ```

    $ sort < test.txt

    a

    b

    c

    d


    ```'
