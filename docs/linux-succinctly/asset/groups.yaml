    # Chapter 11 Additional Command Line Concepts


    An environment variable is a name-value pair. Programs can use data from environment
    variables to determine how to behave in certain situations. For example, the default
    command used to display man pages can be altered by setting a value for the PAGER
    environment variable.


    Environment variables are case-sensitive; however, by convention they are in uppercase
    letters. To view the value of a known environment value, run echo $VAR_NAME or
    printenv VAR_NAME. You can use the env or printenv commands without arguments
    to display all the environment variables that are currently set.


    ```

    $ echo $HOME

    /home/jason

    $ printenv HOME

    /home/jason

    $ printenv

    SHELL=/bin/bash

    TERM=xterm

    USER=jason

    MAIL=/var/mail/jason

    PATH=/usr/local/bin:/usr/bin:/usr/local/games:/usr

    PWD=/home/jason

    LANG=en_US.UTF-8

    PS1=$

    SHLV=1

    HOME=/home/jason

    LOGNAME=jason

    OLDPWD=/home/jason

    $ env

    SHELL=/bin/bash

    TERM=xterm

    USER=jason

    MAIL=/var/mail/jason

    PATH=/usr/local/bin:/usr/bin:/usr/local/games:/usr

    PWD=/home/jason

    LANG=en_US.UTF-8

    PS1=$

    SHLV=1

    HOME=/home/jason

    ```'
