    | w | Move right one word. |

    | b | Move left one word. |

    | ^ | Move to the beginning of the line. |

    | $ | Move to the end of the line. |


    The commands are case sensitive. For example, lowercase l moves the cursor right
    one character, uppercase L moves the cursor to the bottom of the window. Even
    though the original vi editor did not allow you use arrow keys, Vim does. Even
    though you can use the arrow keys, some argue that the original vi key bindings
    can be faster since your hand does not have to leave the row.


    # Insert Mode


    Insert mode allows you to actually type text in a file. To enter insert mode,
    press i, I, a or A. After you have entered the desired text, you can press the
    Escape key to return to command mode.


    | Key | Action |

    | --- | --- |

    | i | Insert at the current position. |

    | I | Insert at the beginning of the line. |

    | a | Append after the cursor position. |

    | A | Append at the end of the line. |


    # Line Mode


    Line mode, sometimes called command mode, is accessed from command mode by typing
    a colon. Line mode allows you to save a file, exit the editor, replace text, and
    perform some forms of navigation. The following are some of the most common line
    mode commands you will want to familiarize yourself with.'
