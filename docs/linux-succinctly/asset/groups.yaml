    The head and tail commands display 10 lines by default. To specify a specific
    number of lines to display, append -N to the command where N is the number of
    lines you want to display. For example, to display the first line in a file, run
    head -1 file.


    ```

    $ head -2 goals.txt

    1) Write a book.

    2) Travel the world.

    $ tail -1 goals.txt

    12) Be a millionaire.

    $

    ```


    If you want to view files as they are being updated, use tail -f file. The -f
    flag makes the tail command follow the file as it grows. This is great for viewing
    log files. You can also use the less command. After running less file, type F
    to start following the file as it grows.


    ```

