    \nIf you want to create a command line that visually spans multiple lines but\
    \ acts as a single command, use a backslash at the end of each line you want to\
    \ continue. When the backslash appears at the end of a command line, it acts as\
    \ the line continuation character. If you use this at the command prompt, the\
    \ continued lines will be prefixed with the greater than symbol. You may encounter\
    \ this when reading documentation or examining shell scripts.\n\n```\n$ diff \\\
    \\\n> random-states \\\\\n> random-states.bak\n3c3\n< Georgia Atlanta\n---\n>\
    \ Georgia Savannah\n$ diff random-states random-states.bak\n3c3\n< Georgia Atlanta\n\
    ---\n> Georgia Savannah\n$ \n```\n\n# Chapter 12 Processes and Jobs\n\nThe ps\
    \ command is used to list the currently running processes on a Linux system. If\
    \ you run ps without any arguments, it displays the processes that are running\
    \ as you and associated with your terminal. If you were to connect to a Linux\
    \ server twice, you would see different output from the ps command. You might\
    \ see the following for the first session, which is using pts/0 (pseudo terminal\
    \ 0).\n\n```\n$ ps\nPID TTY         TIME CMD\n1309 pts/0     00:00:00 bash\n1635\
    \ pts/0     00:00:00 ps\n```\n\nThe following is the output from ps on the second\
    \ connection, which is using pts/1.\n\n```\n$ ps\nPID TTY         TIME CMD\n1721\
    \ pts/1     00:00:00 bash\n1821 pts/1     00:00:00 ps\n```\n\nIf you want to display\
    \ all of your running processes, regardless of the associated terminal or lock,\
    \ use the command ps -u username.\n\n```\n$ ps -u jason\nPID TTY         TIME\
    \ CMD\n1308 ?           00:00:00 sshd\n1309 pts/0     00:00:00 bash\n1720 ?  \
    \         00:00:00 sshd\n1721 pts/1     00:00:00 bash\n```\n\nTo see every process\
    \ running on the system, use the command ps -e.\n\n```\n$ ps -e | head\nPID TTY\
    \         TIME CMD\n1 ?             00:00:00 init\n2 ?             00:00:00 kthread\n\
    3 ?             00:00:00 ksoftirqd/0\n6 ?             00:00:00 migration/0\n7\
    \ 00:00:00 watchdog/0\n8 00:00:00 cuset\n9 00:00:00 khelper\n10 00:00:00 kdevmpfs\n\
    11 00:00:00 netns\n```\n\nBy default, the information provided by ps is rather\
    \ sparser. Typically when using ps you will supply additional arguments to display\
    \ more detailed information. The following are some of the most common options\
