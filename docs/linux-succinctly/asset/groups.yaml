    If you do not want to display the output of a command to your screen or save it
    to a file, you redirect the output to the null device, /dev/null. This special
    file simply discards any input that is sent to it. The null device is sometimes
    referred to as the "black hole" or "bit bucket". The following example redirects
    the errors from sort to the null device.


    ```

    $ ls test.txt no-such-file

    ls: cannot access no-such-file: No such file or directory

    test.txt

    $ ls test.txt no-such-file 2>/dev/null

    test.txt

    $

    ```'
- md: "\n## Chapter 11 Additional Command Line Concepts\n\nAn environment variable\
    \ is a name-value pair. Programs can use data from environment variables to determine\
    \ how to behave in certain situations. For example, the default command used to\
    \ display man pages can be altered by setting a value for the PAGER environment\
    \ variable.\n\nEnvironment variables are case-sensitive; however, by convention\
    \ they are in uppercase letters. To view the value of a known environment value,\
    \ run echo $VAR_NAME or printenv VAR_NAME. You can use the env or printenv commands\
    \ without arguments to display all the environment variables that are currently\
    \ set.\n\n```\n$ echo $HOME\n/home/jason\n$ printenv HOME\n/home/jason\n$ printenv\n\
    SHELL=/bin/bash\nTERM=xterm\nUSER=jason\nMAIL=/var/mail/jason\nPATH=/usr/local/bin:/usr/bin:/usr/local/games:/usr\n\
    PWD=/home/jason\nLANG=en_US.UTF-8\nPS1=$\nSHLV=1\nHOME=/home/jason\nLOGNAME=jason\n\
    OLDPWD=/home/jason\n$ env\nSHELL=/bin/bash\nTERM=xterm\nUSER=jason\nMAIL=/var/mail/jason\n\
    PATH=/usr/local/bin:/usr/bin:/usr/local/games:/usr\nPWD=/home/jason\nLANG=en_US.UTF-8\n\
    PS1=$\nSHLV=1\nHOME=/home/jason\nLOGNAME=jason\nOLDPWD=/home/jason\n$\n```\n\n\
    When a process is launched, it inherits the exported environment variables of\
    \ the parent process. An environment variable that is set only affects the current\
    \ running process, unless it is explicitly exported. In the following example,\
    \ the PAGER environment variable is set to less for the current shell. If a subprocess\
    \ is started without that variable being exported, such as another instance of\
    \ the Bash shell, that environment variable is not inherited. When PAGER is exported\
    \ and a new Bash shell is started, it is available to that process. To remove\
    \ an environment variable, use the unset command.\n\n```\n$ echo $PAGER\n\n$ PAGER=less\n\
    $ echo $PAGER\nless\n$ bash\n$ echo $PAGER\n\n$ exit\nexit\n$ export PAGER=less\n\
    $ bash\n$ echo $PAGER\nless\n$ exit\nexit\n$ echo $PAGER\nless\n$ unset\n$ echo\
    \ $PAGER\n```\n\n| Variable | Use |\n| :--- | :--- |\n| EDITOR | The program used\
    \ to edit files. |\n| HOME | The user's home directory. |\n| LOGNAME | The user\
    \ ID or login ID of the current user. |\n\nTable 36: Common Environment Variables\n\
    \n| Variable | Use |\n| :--- | :--- |\n| MAIL | The location of the user's mailbox\
    \ on the local system. |\n| OLDPWD | The old, or previous, working directory.\
    \ |\n| PATH | The search path for commands. |\n| PAGER | The program used for\
    \ paging through a file. |\n| PS1 | The primary prompt string. |\n| PWD | The\
    \ present working directory. |\n| USER | The user ID or login ID of the current\
    \ user. |\n\n## Aliases\n\nYou can use keyboard shortcuts, called aliases, at\
    \ the command line. You can save yourself some time and by creating aliases for\
    \ commands that you repeat often, are long, that are hard to type, or that are\
    \ difficult to remember. You can use aliases to fix common typing mistakes. Some\
    \ people use aliases to make Linux behave like another operating system they are\
    \ familiar with.\n\n**alias [alias_name=[value]]** Without any arguments, the\
    \ alias command lists the aliases that are in your environment. So **alias alias_name=value**\
    \ to create a new alias.\n\n**unalias alias_name** Remove **alias_name**. Use\
    \ **unalias -a** to delete aliases.\n\n```\n$ alias ls='ls -l'\n$ alias\nalias\
    \ ls='ls -l'\n$ ls -l\ntotal 32\ndrwxr-xr-x 2 jason 4096 Jun 21 22:01 Desktop\n\
    drwxr-xr-x 2 jason 4096 Jun 21 22:01 Documents\ndrwxr-xr-x 2 jason 4096 May 17\
    \ 13:37 Downloads\n-rw-rw-r-- 1 jason 274 Jun 28 14:52 goals.txt\ndrwxr-xr-x 3\
    \ jason 4096 Jun 21 22:05 Music\ndrwxr-xr-x 2 jason 4096 Jun 21 22:01 Pictures\n\
    -rw-rw-r-- 1 jason 73 Jun 29 02:30 to-do.txt\n$ ls -l\ntotal 32\ndrwxr-xr-x 2\
    \ jason 4096 Jun 21 22:01 Desktop\ndrwx-xr-x 2 jason 4096 Jun 21 22:01 Documents\n\
    drwx-xr-x 2 jason 4096 May 17 13:37 Downloads\n-rw-rw-r-- 1 jason 274 Jun 28 14:52\
    \ goals.txt\ndrwx-xr-x 3 jason 4096 Jun 21 22:05 Music\ndrwx-xr-x 2 jason 4096\
    \ Jun 21 22:01 Pictures\n-rw-rw-r-- 1 jason 73 Jun 29 02:30 to-do.txt\n$ alias=$usr/local/bin/backup-database.sh\n\
    $ $\n```\n\nStarting database backup.\n...\nDatabase backup complete.\n\n```\n\
    $ alias\nalias bu=$usr/local/bin/backup-database.sh\nalias ll='ls -l'\n```\n\n\
    Aliases exist only for your current session. So, if you were to create an alias,\
    \ log out, and log again, that alias would not be available. To make them persist\
    \ between sessions, you have to add them to your personal initialization files.\n\
    \n## Personal Initialization Files\n\nTo save customizations to your shell environment,\
    \ place them in a personal initialization file. If you are using Bash, you can\
    \ place your customizations in ~/.bashrc or ~/.bash_profile. The ~/.bash_profile\
    \ file is read and executed for login sessions. When bash is not started as a\
    \ login shell, for example when you open a new tab in your terminal emulator application,\
    \ ~/.bashrc is read and executed. If you do not want or need this distinction,\
    \ you can source ~/.bashrc in ~/.bash_profile and place all your customizations\
