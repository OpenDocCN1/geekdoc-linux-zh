    # Default Permissions and the File Creation Mask


    The file creation mask, also known as the umask, determines the default permissions
    of new files and directories. The umask is typically set by the system administrator;
    however, an individual user may override the setting by using a umask statement
    in his or her account''s initialization files.


    If no mask is applied, new directories receive 777 (rwwxrwxx) permissions and
    new files receive 666 (rw-rw-rw-) permissions. When the umask is applied to these
    base permissions, it disables, or masks, certain permissions. For example, a umask
    of 000 will disable, or mask, zero bits. In this case, new directories receive
    777 and new files receive 666 permissions. At the other extreme, a umask of 777
    disables all permissions bits. New files and directories receive 000 permissions
    in this instance.'
- md: '

    umask [-S] [mode] Sets the creation mask to a mode if specified. If a mode is
    omitted, the current mode will be displayed. Using the -S argument allows umask
    to display or set the mode with symbolic notation.


    A quick way to estimate how a umask mode affects default permissions is to subtract
    the octal umask mode from 777 in the case of directories, and 666 in the case
    of files. The following is an example of a 022 umask, which is typically the default
    umask used by Linux distributions or by system administrators.


    # Table 13: Creation Permission Estimation


    | File | Directory |

    |---|---|---|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -022 | -022 |

    | Creation Permission | 644 | 755 |


    Using a umask of 002 is ideal for working with members of your group. When files
    or directories are created, the permissions allow members of the group to manipulate
    those files and directories.


    # Table 14: Creation Permission Estimation


    | File | Directory |

    |---|---|---|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -002 | -002 |

    | Creation Permission | 664 | 775 |


    Here is another possible umask to use for working with members of your group.
    By using 007, no permissions are granted to users outside of the group.


    # Table 15: Creation Permission Estimation


    | File | Directory |

    |---|---|---|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -007 | -007 |

    | Creation Permission | 660 | 770 |


    Again, using this subtraction method is a good estimation. You can see that the
    method breaks down with a umask of 007. To get an accurate result each time, you
    need to convert octal permissions into binary values. From there, use a bitwise
    NOT operation on the umask and then perform a bitwise AND operation against the
    base permissions. Another way to think of this is that umask disables the values
    specified. umask of 022 effectively means "disable the write bits for the group."
    umask of 007 means "disable all the bits for others."


    The following table contains the resulting permissions created by each of the
    eight mask settings. The most common and practical umask modes to use are 022,
    002, 077, and 007.


    # Table 16: umasks and Resulting Permissions


    | File Permissions | Directory Permissions | Binary | Octal |

    |---|---|---|---|

    | rw- | rwx | 000 | 0 |

    | rw- | rw- | 001 | 1 |

    | r-- | r-x | 010 | 2 |

    | r-- | -- | 011 | 3 |

    | -w- | -wx | 100 | 4 |

    | -w- | -w- | 101 | 5 |

    | --- | --x | 110 | 6 |

    | --- | --- | 111 | 7 |


    ## Special Modes


    When umask command is queried for the current setting, it returns four characters
    instead of three. The following example shows umask clearly set to 022, but umask
    returns 002.


    ```

    $ umask 022

    $ umask 002

    ```


    Until now, you have only introduced permissions for user, group, and other. However,
    there is a class of special modes called setuid, setgid, and sticky. These special
    modes are declared by prepending a character to the octal that you normally use
    with chmod. The important point here is to know that umask 022 is the same as
    chmod 755. Likewise, 644 is the same as chmod 644.


    The setuid permission allows a program to run as the owner of the file, not the
    user executing it. One example of where this permission is used is the passwd
    command. The passwd command allows a user to change his or her password, but it
    requires superuser privileges to modify /etc/passwd and /etc/shadow files.


    Prepend the number 4 using octal mode to enable the setuid permission. For symbolic
    mode, use u+s.


    ```

    $ ls -ld /usr/bin/passwd

    -rwxr-xr-x 1 root root 47032 Jul 26 /usr/bin/passwd

    $ chmod 4555

    $ ls -l

    -r-sr-xr-x 1 jason users 0 Jun 7

    ```


    Similar to the setuid permission, the setgid permission allows a program to run
    with the group of the file, not the group of the user executing it. A Linux command
    that uses such a permission is locate. When setgid is used on a directory, it
    causes new entries in that directory to be created with the same group as the
    directory. With groups, using setgid on directories can prevent someone from accidentally
    creating a file in their default group instead of the intended group. Prepend
    the number 2 octal mode to enable the setgid permission. For symbolic mode, use
    g+s.


    ```

    $ ls -ld /usr/bin/locate

    -rwx-s--x 1 root root 35548 Oct 10 /usr/bin/locate

    $ chmod 2555

    $ ls -l

    -r-xr-xr-x 1 jason users 0 Jun 7

    $ mkdir salesdir

    $ chgrp salesdir

    $ chmod g+s salesdir

    $ ls -ld salesdir/

    drwxr-xr-x 2 jason users 4096 Jun 7

    $ touch salesdir/file-before-setgid

    $ ls -1 salesdir/

    total 0

    -rw-r--r-- 1 jason users 0 Jun 7 file-before-setgid

    $ chmod g+s salesdir

    $ ls -ld salesdir

    drwxrwxr-x 2 jason users 4096 Jun 7

    $ touch salesdir/file-after-setgid

    $ ls -ld salesdir/

    total 0

    -rw-r--r-- 1 jason sales 0 Jun 7 file-after-setgid

    -rw-r--r-- 1 jason users 0 Jun 7 file-before-setgid

    $

    ```


    The sticky bit prevents one user from deleting another user''s files if he or
    she would normally have permission to do so. The most common place you will see
    the sticky bit employed is on the /tmp and /var/tmp directories.


    Prepend the number 1 when using the sticky bit. For symbolic mode, use +t.


    ```

    $ ls -ld /tmp

    drwxrwxrwt 1 root 20480 Jun 6 18:17 /tmp

    $ ls -ld /var/tmp

    drwxxr-xr 4 root 4096 Jun 7 16:46 /var/tmp

    $ chmod 1777 tmp

    $ ls -ld tmp

    drwxrwxrwt 2 jason users 4096 Jun 7 16:50 tmp

    ```


    # Table 17: Special Modes


    | Permission | Octal |

    |---|---|

    | setuid | 4 |

    | setgid | 2 |

    | sticky | 1 |


