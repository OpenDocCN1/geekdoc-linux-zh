    # Table 35: Redirecting I/O\n\n| Operator | Format | Action |\n| :--- | :--- |\
    \ :--- |\n| > | cmd > file | Create or overwrite file with standard output. |\n\
    | >> | cmd >> file | Create or append to file with standard output. |\n| < | cmd\
    \ < file | Use contents of file as standard input. |\n\nBy default, input redirection\
