    # Sudo Super User Do


    The sudo command allows you to run as superuser if no username is specified, hence
    the name sudo will run the command as the root user. For example, sudo ls will
    run the ls command as the root user. sudo is commonly used to install, start,
    and stop applications that require superuser privileges.


    sudo Execute as another user, typically the superuser.


    One advantage of using sudo over the su is that you do not need to know the password
    of the other user, usually the root user. When you execute the sudo command, you
    are prompted for shared passwords and generic accounts. When are prompted for
    the current user''s password. If the sudo configuration permits access, the command
    is executed. The sudo configuration is typically controlled by the system administrator
    and requires access to change.


    The su command is similar to sudo, but you should note these differences: su (switch
    user) asks for the new user''s password, whereas sudo asks for the current user''s
    password, or possibly no password at all. Su will change the current user of the
    shell, allowing multiple separate commands to be executed, whereas sudo runs a
    single command and is finished. For security reasons, sudo is generally preferable
    to su. The system administrator need not give the user root password, and has
    full control over what commands works with sudo.


    # Using Sudo


    Here are the common ways to use the sudo command.


    +   - sudo -1 List available commands that can be executed with sudo.


    +   - sudo command Run command as the superuser.


    +   - sudo -u root command Same as sudo command.'
