    上一个作业。当前作业是最后一个在后台启动的任务，或者是最近一个在前台运行期间被停止的进程。你可以使用双百分号（%% 或百分号后加加号 (+)）来引用当前作业。可以使用百分号后加减号（-）来访问上一个作业。在使用
