    `rm -f file` 使用 `-f` 选项进行删除，且不提示确认。


    通配符形式的搜索模式可以用于 `rm` 和 `ls` 等命令。常用的通配符是星号（*）和问号（?）。星号匹配任意内容，而问号匹配单个字符。记住，带有点的文件和目录被视为隐藏，不会被星号匹配。要在搜索中包含隐藏文件，请以点开头搜索。


