    # Default Permissions and the File Creation Mask


    The file creation mask, also known as the umask, determines the default permissions
    of new files and directories. The umask is typically set by the system administrator;
    however, an individual user may override the setting by using a umask statement
    in his or her account''s initialization files.


    If no mask is applied, new directories receive 777 (rwxrwxrwx) permissions and
    new files receive 666 (rw-rw-rw-) permissions. When the umask is applied to these
    base permissions, it disables, or masks, certain permissions. For example, a umask
    of 000 will disable, or mask, zero bits. In this case, new directories receive
    777 and new files receive 666 permissions. At the other extreme, a umask of 777
    disables all permissions bits. New files and directories receive 000 permissions
    in this instance.

