    $ touch file

    $ ls -l

    total 4

    drwxr-xr-x 2 jason users 4096 Jun 5 00:03 directory

    -rw-r--r-- 1 jason users 0 Jun 5 00:03 file

    $ rmdir directory

    $ rm file

    $ umask 007

    $ umask

    ```'
