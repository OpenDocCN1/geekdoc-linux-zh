    # Numeric Based Permissions


    The second way to specify modes with the chmod command is called mode. Understanding
    symbolic mode will help you learn octal mode. Some Linux users never move beyond
    symbolic permissions. However, experienced Linux users find octal mode quicker
    and easier in the long term; there are only a few commonly permissions which can
    be easily remembered and recalled.


    Octal permissions are based on the binary numeric system, also known as the base-2
    numerical system. Each permission type is treated as a bit that is either set
    off, represented by a zero (0), or represented by a one (1). In permissions, order
    has meaning. Permissions are always in read, write, and execute order. If r, w,
    and x are all set to off, the binary representation is 000. If they are all set
    to on, the binary representation is 111. To read and write permissions while omitting
    execute permissions, the binary number is 110.


    | Table 9: Base-2 and Base-10 Representations of Permissions |

    | | Read | Write | Execute |

    |---|---|---|---|

    | Binary and decimal value for off. | 0 | 0 | 0 |


    | Read | Write | Execute |

    |---|---|---|---|

    | Binary value for on. | 1 | 1 | 1 |

    | Decimal value for on. | 4 | 2 | 1 |


    Supply the chmod command with the base-10 value of the desired permissions. To
    convert the binary representation into decimal, remember that read equals 4, write
    equals 2, and execute equals 1. The permissions number is determined by adding
    up the values for each permission type. For example, read and execute permissions
    are represented by 5 for read, plus 1 for execute, equals 5. There are eight possible
    values from zero to seven, hence the name octal. The following table demonstrates
    all eight of the possible permissions.


    Table 10: Octal Permissions


    | Permissions | String | Binary | Octal |

    |---|---|---|---|

    | No permissions | --- | 000 | 0 |

    | Execute only | -x | 001 | 1 |

    | Write only | -w- | 010 | 2 |

    | Write and Execute | -wx | 011 | 3 |

    | Read only | r-- | 100 | 4 |

    | Read and Execute | r-x | 101 | 5 |

    | Read and Write | rw- | 110 | 6 |

    | Read, Write, and Execute | rwx | 111 | 7 |


    Remember that permissions order has meaning. The user categories are always in
    this order: user, group, and other. Once the octal value is determined for each
    category, it must be specified in that order. For example, to get -rwxr-xr-- permissions,
    chmod 754 file. That means the owner of the file has read, write, and execute
    permissions; the members of the file''s group have read and execute permissions;
    and others only read permissions.


    Table 11: Symbolic, Binary, and Decimal Representations of a Given Permission


    | User | Group | Other |

    |---|---|---|---|

    | Symbolic | rwx | rw- | r-- |

    | Binary | 111 | 110 | 100 |

    | Decimal | 7 | 6 | 4 |


    # Commonly Used Permissions


    The table illustrates the most commonly used permissions. These five permission
    sets will cover most permission situations.


    Table 12: Commonly Used Permissions


    | Meaning | Octal | Symbolic |

    | --- | --- | --- |

    | Allows the file''s owner full control over the file. No others on the system
    access. | 700 | -rwx------ |

    | Allows everyone on the system to execute the file but only the owner can edit
    it. | 755 | -rwxr-xr-x |

    | Allows a group of people to modify the file and let others read it. | 664 |
    -rw-rw-r-- |

    | Allows a group of people to modify the file and not others read it. | 660 |
    -rw-rw---- |

    | Allows everyone on the system to read the file but only the owner can edit it.
    | 644 | -r--r--r-- |


    Many newcomers to the Linux operating system err on the side of permissive permissions.
    Instead of thinking through the required permissions they sometimes grant "everything
    to everybody" by using **777** or **666** permissions. Whenever you see a file
    or directory with **777** or **666** permissions, know that there is always a
    better permission set that can be used.


    Granting unnecessary privileges to a file or directory not only has security implications,
    but can also invite unwanted changes to those files or directories. If each has
    **777** permissions, then anyone on the Linux system can edit that file. This
    can lead to a situation where someone accidentally saves changes to a file when
    they really wanted to view the file''s contents with an editor.


    Also, a user on the system could purposefully use the weak permissions to escalate
    privileges, gain access to data they shouldn''t, or even destroy data. They could
    potentially insert malicious code into a script or program and wait for it to
    be executed by someone else on the system. Remember that anyone on the system
    can execute the file because all permissions, including the execute permission,
    have been granted.


    If multiple people require write access to a file, make use of groups and limit
    the access of others. Consider it a best practice to avoid **777** and **666**
    permission modes.


    # Working with Groups


    Let''s look at a situation where multiple people need access to the same file.
    For example, the members of a sales team need to update a file named **sales.report**,
    the group owner of the file could be set to the Linux group named **sales** using
    the `chgrp` command. Next, the permissions could be set to 664 (rw-r--r--) or
    even 660 (rw-rw--) if you do not want others on the system to be able to read
    it. Technically, 774 (rwxr-xr-x) and 770 (rwxrwx--) also work, but since **sales.report**
    is not an executable program, it makes sense to use 664 (rw-r--r--) or 660 (rw-rw--).


    When a file is created, it is set to the current user''s primary group. You can
    override this behavior by using the `newgrp` command, but remember that a new
    file will inherit this.


    ```

    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data

    $ chmod a=r sales.data

    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data


    $ ls -l sales.data

    -rw-r--r-- 1 jason users 10400 Jun 14 09:31 sales.data

    $ chmod u=rwx,o= sales.data

    $ ls -l sales.data

    -rwxr-xr-x 1 jason users 10400 Jun 14 09:31 sales.data

    ```


