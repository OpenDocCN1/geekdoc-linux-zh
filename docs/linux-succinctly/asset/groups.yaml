    \ in the first file, while the greater than sign means the line only exists in\
    \ the second file.\n\n# Chapter 10 I/O Redirection\n\nThe Linux operating system\
    \ features a concept called I/O streams. The three default I/O streams are standard\
    \ input, standard output, and standard error. When a process is launched, it is\
    \ connected to these three I/O streams, also called standard streams. By default,\
