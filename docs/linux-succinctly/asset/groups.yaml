    - /opt/widget/apache/bin apache 二进制文件。\n- /opt/widget/apache/etc apache 配置文件。\n\
    \n这些是相同主题的变体，但基于公司内部的团队。\n- /opt/sysadmin 系统管理员团队的顶级目录。\n- /opt/widget/sysadmin\
    \ 系统管理员团队的顶级目录。\n- /usr/local/widget/sysadmin 系统管理员团队的顶级目录。\n\n## 第 3 章 命令行界面\n\
    \nShell（壳）是一个接受命令并指示操作系统执行这些命令的程序。例如，当你通过网络连接到 Linux 系统时，会启动 shell 并作为你与系统的接口。在这种特定情况下，shell\
    \ 是命令行解释器。命令行界面通常简称为 CLI。\n\n当你直接通过外接的键盘和显示器连接到 Linux 系统时，你将看到一个文本界面或图形界面，取决于系统的如何配置。在文本界面的情况下，你的体验与通过网络连接到该系统非常相似。当你登录时，命令行\
    \ shell 会启动并向你显示一个提示符。\n\n如果你连接到图形模式的系统，你将与图形界面 (GUI) 交互。为了访问命令行，你需要启动终端模拟器应用程序。常见的终端模拟器包括\
    \ xterm、GNOME Terminal、Konsole 和 Eterm。你的选择取决于个人喜好和可用性，但它们都提供相同的功能——访问命令行。\n\n\
    以下演示了在命令行下登录 Ubuntu Linux 服务器。\n\n```\nUbuntu 14.04 LTS linuxsvr tty1\nlinuxsvr\
    \ login:\nPassword:\nWelcome to Ubuntu 14.04 LTS\n\njason@linuxsvr:~$\n```\n\n\
    行 `jason@linuxsvr:~` 是命令行提示符。默认提示符随发行版和 shell 的不同而不同。有很多 shell，其中最常用且受欢迎的是 Bash。所有用户都可以按照喜好自定义他们的\
    \ shell 提示符。这里的提示符包含用户名、服务器名称和当前目录。波浪号代表家目录，在示例中是 `/home/jason`。你也可以在波浪号后指定用户名，此时它将展开为用户的家目录。例如，~john\
    \ 会展开到 `/home/john`。对于像 wwwdata 这样的应用程序用户，~wwwdata 会展开到 `/var/www`。\n\n以下是提示符的示例。\n\
    \n```\n[jason@linuxsvr /tmp]\nsvr:/home/jason\n```\n\n```\n12:32:19 linuxsvr ~]$\n\
    $\n```\n\n 提示符并不限于单行。以下是跨多行的提示符示例。\n\n```\nlinuxsvr://home/jason\n$\n(jason@linuxsvr)-(09:22am)-\n\
    ~)\n\nMon 14/12/15 09:22 EST[pts/3][x86_64]\n<jason@linuxsvr:~>\nzsh 26 %\n```\n\
    \n后续示例中的 shell 提示符将简化为美元符号，除非显示整个提示符提供了额外的清晰度。\n\n## 基础命令\n\n在 Linux 中，命令是大小写敏感的并且通常全小写。注意方括号中的项目是可选的。让我们从两个可以在命令行导航系统的命令开始。它们是\
    \ **pwd** 和 **cd**。\n\n**pwd** 命令将工作目录显示在你的屏幕上。命令让你跟踪自己在文件系统层次结构中的位置。\n\n**cd\
    \ [directory]** cd 命令将当前目录更改为指定的目录。执行 cd 时没有指定目录，它会将当前目录更改为你的家目录。这就是导航系统的方式。\n\
    \n以下是使用 **pwd** 和 **cd** 命令的示例。记住顺序很重要。\n\n```\n$ pwd\n/home/jason\n$ cd /tmp\n\
    $ pwd\n/tmp\n```\n\n"
