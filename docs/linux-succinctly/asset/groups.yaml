    # Chapter 5 Viewing File Directory Details


    The ls command was briefly introduced in Chapter 3. It not only lists files and
    directories, it can provide details about those files and directories. One of
    the most common options to use with ls is -l, which displays a long listing format.
    The following is an example.


    ```

    $ ls

    Desktop Documents Downloads Music to-do.txt

    $ ls -l

    total 20

    drw-xr-x 2 jason users 4096 May 3 08:33 Desktop

    drw-xr-x 2 jason users 4096 May 3 08:35 Documents

    drw-xr-x 2 jason users 4096 May 3 08:38 Downloads

    drw-xr-x 3 jason users 4096 Jun 21 21:16 Music

    -rw-r---- 1 jason users 73 Jun 22 19:34 to-do.txt

    $

    ```


    The information provided by ls -l starts with a series of characters to represent
    the permissions of the file or directory. Permissions will be covered in Chapter
    6. The number that follows the permissions string represents the number of links
    to the file or directory. Next, the owner is displayed followed by the group name.
    The file size is then displayed. The timestamp represents the modification time.
    The last item is the name of the file or directory.


    ```

    $ ls -l to-do.txt

    -rw-r---- 1 jason users 73 Jun 22 19:34 to-do.txt

    ```


    | | File Name |

    | +---| Modification Time |

    | +--- | Size in bytes |

    | +--- | Group |

    | +--- | User (owner) |

    | +--- | Number of Links |

    | +--- | Permissions |'
