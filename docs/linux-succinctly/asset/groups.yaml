  - "[PAGE 86]\n\n# Chapter 14 Installing Software\n\nThe most common way to install\
    \ software on a Linux system is through the use of packages. A package not only\
    \ contains the files that are installed on the system, but also additional information\
    \ called metadata. This metadata can include such information as the steps required\
    \ to complete the installation in the form of pre-installation and post-installation\
    \ scripts, the permission information for each of the files, the description of\
    \ the package, the version, the package maintainer, and any additional packages\
    \ that are required for it to function properly.\n\nTo install, upgrade, or remove\
    \ packages, use a package manager. When you tell the package manager to install\
    \ a given package, it not only installs that, but also any other required packages,\
    \ also called dependencies, based on the package's metadata. The package manager\
    \ also maintains a database of package information. The package manager records\
    \ what packages are installed, what versions are installed, and what files belong\
    \ to what packages.\n\n# RPM-Based Distributions\n\nRPM is a recursive acronym\
    \ for RPM Package Manager; however, it started its life as the RedHat Package\
    \ Manager. RPM-based distributions include Red Hat Linux (RHEL), CentOS, Fedora,\
    \ Oracle Linux, and Scientific Linux. You can manipulate RPM packages directly\
    \ with the `rpm` command or with another command line utility called yum.\n\n\
    yum search-pattern Search for search-pattern.\n\nyum install [-y] package Install\
    \ package. Use the -y option to automatically answer yes to your questions.\n\n\
    yum remove package Remove or uninstall package.\n\nyum info [package] Display\
    \ information about package.\n\nTo search for available software, use yum search\
    \ search-pattern.\n\n```\nyum search web browser\nLoaded plugins: refresh-packagekit,\
    \ security\n============================================ N/S Matched: web, browser\
    \ ====================\nicedtea-web.i686 : Additional Java components for OpenJDK\
    \ Java browser\n      : plug-in and Web Start implementation\nelinks.i686 : A\
    \ text-mode Web browser\nfirefox.i686 : Mozilla Firefox Web browser\nlynx.i686\
    \ : A text-based Web browser\n\nFull name and summary matches only, use \"search\
    \ all\" for everything.\n```"
