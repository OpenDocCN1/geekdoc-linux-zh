    # Shell History


    The commands that you execute at the command line are preserved in your shell
    history. Your history is retained in memory by Bash until your current session
    is ended. At that time, your history is saved to the ~/.bash_history file. Different
    shells save history in different files, but they usually include the word history
    and are stored as a dot file in your home directory. You can set the HISTSIZE
    environment variable to control the number of commands to save in your shell history.
    The default value is 500.


    history When the history command is executed without arguments, it displays a
    list of commands in your shell history.


    !N Repeat the command associated with line number N.


    !! Repeat the previous command line.


    !pattern Repeat the most recent command starting with .pattern.


