    |-- 1file

    |-- 2file

    |-- 2dir

    |-- 1file

    |-- 2file

    2 directories, 4 files

    ```


    要将文件和目录移动另一个另一个，请使用 `mv` 命令。此外，`mv` 也用于重命名文件和目录。


    `mv source destination` 将 source 移动到 destination。如果 destination 是目录，则 source 将移动到
    destination 中。如果 destination 不是目录，则 source 将重命名为 destination。


    `mv -i destination` 使用 `-i` 选项以交互模式运行。如果 destination 存在，`mv` 将给你机会中止操作或通过覆盖 destination
