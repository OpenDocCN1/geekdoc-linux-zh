    A symbolic link, sometimes called a symlink or link, points to the location of
    an actual file or directory. The symlink is just a pointer, but you can operate
    on it as if were the actual file or directory. Symbolic links are often used to
    create shortcuts to long paths. Another common use for symlinks is to point to
    the current version of an application as the following example.


