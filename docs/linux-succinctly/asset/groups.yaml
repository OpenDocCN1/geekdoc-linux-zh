    ```'
  - "[PAGE 66]\n\n# Table 35: Redirecting I/O\n\n| Operator | Format | Action |\n\
    | --- | --- | --- |\n| > | cmd > file | Create or overwrite file with standard\
    \ output from cmd. |\n| >> | cmd >> file | Create or append to file with standard\
    \ output from cmd. |\n < | cmd < file | Use the contents of file as standard input\
    \ to cmd. |\n\nBy default, input redirection operates on file descriptor 0 and\
    \ output redirection operates on descriptor 1. You can explicitly declare a file\
    \ descriptor to use with redirection by immediately preceding the operator with\
    \ the file descriptor number. Do not use a space between the file descriptor number\
    \ and the redirection operator. If the file descriptor does not immediately precede\
    \ the redirection operator, it will be interpreted as another item on the command\
    \ line.\n\nTo capture error messages to a file while displaying standard output\
    \ to your screen, use 2>. You can also redirect standard output to one file while\
    \ redirecting standard output to another.\n\n```\n$ ls test.txt no-such-file\n\
    ls: cannot access no-such-file: No such file or directory\ntest.txt\n$ ls test.txt\
    \ no-such-file 2>errors\ntest.txt\n$ cat errors\nls: cannot access no-such-file:\
    \ No such file or directory\n$ ls test.txt no-such-file 1>normal-output 2>errors\n\
    $ cat normal-output\ntest.txt\n$ cat errors\nls: cannot access no-such-file: No\
    \ such file or directory\n$\n```\n\nNot only can you redirect output to a file,\
    \ you can redirect it to another file descriptor using an ampersand followed by\
    \ the file descriptor number. Using this method, you can combine standard output\
    \ and standard error using 2>&1. Do not use spaces."
