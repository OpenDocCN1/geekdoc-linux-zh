    \ 应用程序的配置文件。\n- /opt/apache/lib 应用程序库。\n- /opt/apache/logs 应用程序日志文件。\n\n另一种常见的应用程序目录结构模式包括将配置和可变数据移出\
    \ `/opt`。不是将所有应用程序组件放置在 `/opt/app-name` 中，而是使用 `/etc/opt/app-name` 用于配置文件，使用 `/var/opt/app-name`\
    \ 用于日志。继续以 apache 示例，这里是这种方法的演示：\n\n- /etc/opt/apache 应用程序的配置文件。\n- /opt/apache/bin\
    \ 应用程序的二进制文件和其他可执行程序。\n- /opt/apache/lib 应用程序库。\n- /var/opt/apache 应用程序日志文件。\n\
    \n应用程序不仅可以隔离在自己的目录中，还可以与其他不属于标准操作系统的应用程序共享共同目录结构。例如，apache 可以可以直接安装到 `/usr/local`。在这种情况下，二进制文件将位于\
    \ `/usr/local/bin`，而配置将位于 `/usr/local/etc`。由于 apache 可能不是本地安装的唯一应用程序，它可以与其他程序共享空间。\n\
    \n## 组织目录结构\n\n目录结构可以基于组织，例如公司、小组或团队。例如，如果你为 Widget 公司工作，你可能会在公司的 Linux 服务器上发现一个名为\
