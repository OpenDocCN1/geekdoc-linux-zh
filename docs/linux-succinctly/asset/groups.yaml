    # # Emacs


    Another powerful text editor that you can use at the command line is Emacs. Emacs
    relies heavily on keyboard shortcuts. In the Emacs documentation, you will see
    **C-<character>**, which means press and hold Ctrl and press **<character>**.
    For example, if you see C-x, that means hold down Ctrl and press x. You will also
    see sequences, C-x u. That means hold down Ctrl and press, release the Ctrl key,
    and **C-x C-c** means press and hold Ctrl, and press c while still holding Ctrl.


    You will also encounter **M-<character>**, which means hold down the meta key,
    which is the Alt key, and press **<character>**. A substitute for holding down
    Alt as the meta key is to press and release the Esc key instead. For example,
    you can press and hold Alt and press b to represent **M-b**, or you can press
    Esc followed by the b key. Some terminal emulators intercept the Alt key, so you
    may be forced to use Esc as the meta key in some situations.


