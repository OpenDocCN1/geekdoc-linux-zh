    # DEB-Based Distributions


    Linux distributions that are based on Debian use the DEB package format. Some
    of the popular Debian-based distributions include Debian, Elementary OS, Linux
    Mint, and Ubuntu. The package manager for Debian-based distributions is called
    APT, the advanced packaging tool. APT is broken up into a few small commands.
    The most commonly used APT commands are apt-cache and apt-get.


    apt-cache search search-pattern Search for search-pattern.


