    $

    ```


    # 第 13 章 切换用户


    在命令行切换用户，使用 **su** 命令。在不带任何参数的情况下，**su** 将切换到超级用户账户，也称为 root。或者，你可以执行 **su root**。切换用户不会改变你当前的工作目录或环境变量，除非你在
    `su` 后面指定一个连字符（hyphen）。通过指定连字符，你模拟了作为该用户登录系统。例如，`su - root`。


    **su [username]** 切换到用户名或成为超级用户。


    常用的 **su** 选项：


    - - 连字符用于提供一个与用户直接登录时所预期的环境。

    - **su -c command** 指定一个要执行的命令。如果命令长于一个单词，则需要加引号。


    ```

    $ su - root

    $ su - username

    ```


    # Sudo 用


    `sudo` 命令允许用户以另一个用户（通常是超级用户）身份执行命令。使用 `sudo` 替代 `su` 的一个优势是你不需要知道 root 密码，并且对哪些命令可以执行有完全的控制权。`su`
    命令与 `sudo` 类似，但你应该注意这些差异：`su`（切换用户）请求新用户的密码，而 `sudo` 请求当前用户的密码，或者可能不需要密码。


    如果你想知道自己是哪个用户，请运行 `whoami` 命令。


    # 使用 Sudo


    以下是使用 `sudo` 命令的常用方法。


    - sudo -l 列出可以使用 sudo 执行的可用命令。

    - sudo command 以超级用户身份执行命令。

    - sudo -u root 与 sudo 命令相同。

    - sudo -u user 以用户身份执行命令。

    - sudo su 切换到超级用户账户。

    - sudo su - 切换到超级用户账户，并提供用户登录时预期的环境。

    - sudo su - username 切换到用户名账户，并提供以该用户名登录时预期的环境。


    ```

