    $ chgrp salesdir

    $ chmod g+s salesdir

    $ ls -ld salesdir/

    drwxr-xr-x 2 jason users 4096 Jun 7

    $ touch salesdir/file-before-setgid

    $ ls -1 salesdir/

    total 0

    -rw-r--r-- 1 jason users 0 Jun 7 file-before-setgid

    $ chmod g+s salesdir

    $ ls -ld salesdir

    drwxrwxr-x 2 jason users 4096 Jun 7

    ```


    粘滞位（sticky bit）防止用户删除另一个用户的文件，即使他或她通常拥有权限。最常见使用粘滞位的地方是 /tmp 和 /var/tmp 目录。使用粘滞位时，在前面加上数字
    1。对于符号模式，使用 +t。


    ```

    $ ls -ld /tmp

    drwxrwxrwt 1 root 20480 Jun 6 18:17 /tmp

    $ ls -ld /var/tmp

