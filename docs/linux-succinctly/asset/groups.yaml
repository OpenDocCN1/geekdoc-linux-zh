    # Editing Files


    An extremely simple, but ample text editor is nano. It doesn''t have advanced
    editing features, but if you are looking to make simple changes to a file, this
    will surely work. To edit an existing file or create a new one, run nano file-name.
    When it loads, you will see the contents of the file and a list of available commands
    at the bottom of the screen. The caret represents the Ctrl key. For example, to
    edit the editor type Ctrl-x, and to save the file type Ctrl-o. For help, type
    Ctrl-g.


    In addition to using the navigation commands listed at the bottom of the screen,
    you can simply use the arrow keys, the Page Up and Page Down keys, and the Home
    and End keys. To add, simply type it. Deleting it is as simple as the Delete and
    Backspace keys. To delete an entire line, use Ctrl-k.


    ```

    GNU nano 2.2.6

    File: to-do.txt

    ```


    - This file contains my to-do list.

    - Mow the lawn.

    - Take over the world.


    > [ Read 3 lines ]

    ^G Get Help ^O WriteOut ^R Read File ^Y Prev Page ^K Cut Text ^C Pos

    ^X Exit ^J Justify ^W Where Is ^V Next Page ^U Uncut Text ^T To Shell


    # The Vim Editor


    If you are looking for an editor that has advanced editing capabilities, and one
    that you can use at the command line, use vi or Emacs. On a Linux system, when
    you attempt to use vi, you will actually be using Vim, short for improved. The
    vi is typically symlinked to Vim. The Vim editor is compatible with the commands
    found in the vi editor, which was originally created for the Unix operating system.
    Vim includes additional features not found in vi, syntax highlighting, the ability
    to edit files over the network, multi-level undo and redo, and screen splitting.
    One advantage of learning Vim or vi is that you can apply the key mappings to
    other commands, such as man, more, less, and view.


    # Command Mode


    One unique characteristic of the vi and Vim editors is the concept of modes. The
    three modes in Vim are command, insert, and line. Vim starts in command mode.
    To get back to command mode at any time, simply press the Escape key. When in
    command mode, the keys sent to the editor do not end up in the file, but are rather
    interpreted as commands. Command mode allows you to navigate about the file, perform
    searches, delete text, copy text, paste text, and more.


    | Key | Action |

    | --- | --- |

    | k | Move up one line. |

    | j | Move down one line. |

    | h | Move left one character. |

    | l | Move right one character. |

    | w | Move right one word. |

    | b | Move left one word. |

    | ^ | Move to the beginning of the line. |

    | $ | Move to the end of the line. |


    The commands are case sensitive. For example, lowercase l moves the cursor right
    one character, uppercase L moves the cursor to the bottom of the window. Even
    though the original vi editor did not allow you use arrow keys, Vim does. Even
    though you can use the arrow keys, some argue that the original vi key bindings
    can be faster since your hand does not have to leave the row.


    # Insert Mode


    Insert mode allows you to actually type text in a file. To enter insert mode,
    press i, I, a or A. After you have entered the desired text, you can press the
    Escape key to return to command mode.


    | Key | Action |

    | --- | --- |

    | i | Insert at the current position. |

    | I | Insert at the beginning of the line. |

    | a | Append after the cursor position. |

    | A | Append at the end of the line. |


    # Line Mode


    Line mode, sometimes called command mode, is accessed from command mode by typing
    a colon. Line mode allows you to save a file, exit the editor, replace text, and
    perform some forms of navigation. The following are some of the most common line
    mode commands you will want to familiarize yourself with.


    # Table 20: Vim Line Mode Commands


    | Key | Action |

    |---|---|

    | :w | Writes, or saves, the file. |

    | :w! | Forces the file to be saved even if the write permission is not set. |

    | :q | Quits the editor. This fails if there are unsaved changes to the file.
    |

    | :q! | Quit without saving the file. |

    | :wq! | Write and quit. |

    | :x | Same as :wq! |

    | :n | Position the cursor at line n. |

    | $: | Position the cursor on the last line of the file. |

    | :set nu | Turn on line numbering. |

    | :set nonu | Turn off line numbering. |

    | :help [subcommand] | Access the built-in help documentation. |


    # Repeating Commands


    Most commands can be repeated by preceding them with a number. For example, to
    move the cursor down three lines, type **3j**. To insert the same piece of text
    20 times, type **20i** followed by the desired text, and press Escape when you
    are finished. The insert operation will repeat 20 times. To insert a line of underscores,
    type **80i**.


    # Additional Commands


    The following tables list some combinations to use while in command mode.


    # Table 21: Vim Mode—Deleting Text


    | Key | Action |

    |---|---|

    | x | Delete a character. |

    | dw | Delete a word. |

    | dd | Delete a line. |


    # Table 22: Vim Mode—Changing Text


    | Key | Action |

    |---|---|

    | ci | Change a character. |

    | cw | Change a word. |

    | cc | Change the line. |

    | c$ | Change to the end of the line. |


    # Table 23: Vim Mode—Copying and Pasting


    | Key | Action |

    |---|---|

    | yy | Yank, or copy, the current line. |

    | yw | Yank, or copy, a word. |

    | p | Yank, or paste, from previously killed text. |


    # Table 24: Vim Mode—Undo and Redo


    | Key | Action |

    |---|---|

    | u | Undo. |

    | r | Redo. |


    # Table 25: Vim Mode—Searching


    | Key | Action |

    |---|---|

    | /pattern | Start a forward search. |

    | ?pattern | Start a reverse search. |


    # Table 26: Emacs Basic Shortcuts


    | Key | Action |

    |---|---|

    | C-h | Help. |

    | C-x C-c | Exit. |

    | C-x C-s | Save the file. |

    | C-h t | Access the built-in tutorial. |

    | C-h <key> | Describe <key>. |

    | C-u N <command> | Repeat <command> N times. |


    # Table 27: Emacs Shortcuts—Navigation


    | Key | Action |

    |---|---|

    | C-p | Move to the previous line. |

    | C-n | Move to the next line. |

    | C-b | Move backward one character. |

    | C-f | Move forward one character. |

    | M-f | Move forward one word. |

    | M-b | Move backward one word. |

    | C-a | Move to the beginning of the line. |

    | C-e | Move to the end of the line. |

    | M-< | Move to the beginning of the file. |

    | M-> | Move to the end of the file. |


    # Table 28: Emacs Shortcuts—Deleting Text


    | Key | Action |

    |---|---|

    | C-d | Delete a character. |

    | M-d | Delete a word. |


    # Table 29: Emacs Shortcuts—Copying and Pasting


    | Key | Action |

    |---|---|

    | C-k | Kill, or copy, the rest of the current line. |

    | C-y | Yank, or paste, from previously killed text. |

    | C-x u | Undo. Repeat for multiple-level undo. |


    # Table 30: Emacs Shortcuts—Searching


    | Key | Action |

    |---|---|

    | C-s | Start a forward search. The text you are looking for and press C-s to
    move to the next occurrence. Press Enter to stop searching. |

    | C-r | Start a reverse search. |


    # Graphical Editors


    Nano, Vim, and Emacs are great for editing files at the command line. However,
    if you are using a GUI, you have many more options, but don''t think that the
    effort you put into learning Vim or Emacs is worthless in a graphical environment.
    The graphical version of Vim is gvim. Emacs detects this and starts in graphical
    mode.

