    # 基于数值的权限


    使用 `chmod` 命令指定模式的第二种方法称为模式（mode）。理解符号模式将帮助你学习八进制模式。一些 Linux 用户永远不会脱离符号权限。然而，经验丰富的
    Linux 用户发现，长远来看，八进制模式更快、更简单；只有几种常用的权限可以被容易记住和回想起。


    八进制权限基于二进制数值系统，也称为二进制数值系统。每种权限类型被视为一个位，要么是关闭的（用 0 表示），要么是开启（用 1 表示）。在权限中，顺序是有意义的。权限始终按照读取、写入和执行的顺序排列。如果
    `r`、`w` 和 `x` 都被设置为关闭，二进制表示为 `000`。如果它们都被设置为开启，二进制表示为 `111`。要在省略执行权限的情况下读取和写入权限，二进制数为
    `110`。


    | 表 9：权限的二进制和十进制表示法 |

    | | 读取 | 写入 | 执行 |

    |---|---|---|---|

    | 关闭的二进制值和十进制值 | 0 | 0 | 0 |


    | 读取 | 写入 | 执行 |

    |---|---|---|---|

    | 开启的二进制值 | 1 | 1 | 1 |

    | 开启的十进制值 | 4 | 2 | 1 |


    为 `chmod` 命令提供所需权限的十进制值。若要将二进制表示转换为十进制，请记住读取等于 4，写入等于 2，执行等于 1。权限数字通过相加每个权限类型的值来确定。例如，读取和执行权限表示为读取的
    4 加上执行的 1，等于 5。从零到七共有八种可能的值，因此被称为八进制（octal）。下表演示了所有八可能的权限。


    表 10：八进制权限


    | 权限 | 字符串 | 二进制 | 八进制 |

    |---|---|---|---|

    | 无权限 | --- | 000 | 0 |

    | 仅执行 | -x | 001 | 1 |

    | 仅写入 | -w- | 010 | 2 |

    | 写入和执行 | -wx | 011 | 3 |

    | 仅读取 | r-- | 100 | 4 |

    | 读取和执行 | r-x | 101 | 5 |

    | 读取和写入 | rw- | 110 | 6 |

    | 读取、写入和执行 | rwx | 111 | 7 |


    记住权限顺序是有意义的。用户类别始终是这个顺序：用户（user）、组（group）和其他（other）。一旦确定了每个类别的八进制值，必须按该顺序指定。例如，要获得
    `-rwxr-xr--` 权限，使用 `chmod 754 file`。这意味着文件的所有者拥有读取、写入和执行权限；文件组的成员拥有读取和执行权限；而其他人只有读取权限。


    表 11：给定权限的符号、二进制和十进制表示


    | 用户 | 组 | 其他 |

    |---|---|---|---|

    | 符号 | rwx | rw- | r-- |

    | 二进制 | 111 | 110 | 100 |

    | 十进制 | 7 | 6 | 4 |


    # 常用权限


    该表说明了最常用的权限。这五组权限设置将涵盖大多数权限情况。


    表 12：常用权限


    | 含义 | 八进制 | 符号 |

    | --- | --- | --- |

    | 允许文件所有者对文件完全控制。系统上的其他人无法访问。 | 700 | -rwx------ |

    | 允许系统上的所有人执行文件，但只有所有者可以编辑它。 | 755 | -rwxr-xr- |

    | 允许一组人员修改文件并让其他人读取。 | 664 | -rw-rw-r-- |

    | 允许一组人员修改文件但不让他读取。 | 660 | -rw-rw---- |

    | 允许系统上的所有人读取文件，但只有所有者可以编辑它。 | 644 | -r--r--r-- |


    Linux 操作系统的许多新手倾向于使用宽松的权限。他们有时并不仔细思考所需的权限，而是通过使用 **777** 或 **666** 权限来“给所有人所有权限”。每当你看到一个具有
    **777** 或 **666** 权限的文件或目录时，请知道总有更好的权限集可以使用。


    向文件或目录授予不必要的权限不仅具有安全影响，还可能导致这些文件或目录引入意外的更改。如果每个文件都有 **777** 权限，那么 Linux 系统上的任何人都可以编辑该文件。这可能导致某人在实际上只想用编辑器查看文件内容时，不小心保存了更改。


    此外，系统上的用户可能会故意利用弱权限来提升权限，访问他们不应该访问的数据，甚至破坏数据。他们可能会向脚本或程序中插入恶意代码，并等待系统上的其他人执行它。记住，系统上的任何人都可以执行该文件，因为所有权限（包括执行权限）都已授予。


    如果有多个人需要对文件进行写入访问，请利用组并限制他人的访问。将避免 **777** 和 **666** 权限模式视为最佳实践。


