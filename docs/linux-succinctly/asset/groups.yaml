    ls cannot access g?: No such file or directory

    $ ls -d .*

    .bash_history .bashrc .profile

    $ rm .hidden

    ```


    `cp` 命令用于复制文件和目录。要创建副本，运行 `cp source_file destination_file`。你也可以通过在 `cp` 命令末尾指定目标目录将一个或多个文件复制到目录中。


    `cp source_file destination_file` 将 source_file 复制到 destination_file。


    `cp source_file... destination_directory` 将 source_files 复制到 destination_directory。


    `cp -i source_file destination_file` 使用 `cp` 的 `-i` 选项以交互模式运行。如果 destination_file
    存在，`cp` 将给你机会中止操作或通过覆盖 destination_file 继续执行。


    `cp -r source_directory destination_directory` `cp` 的 `-r` 选项导致 source_directory
    递归复制到 destination_directory。如果 destination_directory 存在，则将源目录复制到目标目录中。否则，将创建一个包含
    source_directory 内容的 destination_directory。


    ```

    $ ls

    1file

    $ cp 1file 2file

    $ ls

    1file 2file

    $ mkdir 1dir

    $ cp 1file 2file 1dir

    $ ls 1dir/

    1file 2file

    $ cp -i 2file 1file

