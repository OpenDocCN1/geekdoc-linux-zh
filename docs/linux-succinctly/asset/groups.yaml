    ## Escaping Spaces and Special Characters


    Even though spaces are permitted in file and directory names, it is easier to
    avoid them if possible. Instead of using spaces consider hyphens or underscores.
    Another good option is to use CamelCase. For example, instead of naming a file
    my to do list, name it my-to-do-list, my_to_do_list, or even MyToDoList.


    Even if you choose to use spaces in file names, you may encounter file created
    by others that do. The two ways of operating on files with spaces in their names
    is to use quotation marks or escaping. To operate on a file named my to do list,
    enclose it in quotation marks like "my to do list". To escape the file name, precede
    the spaces with a backslash like my\ to\ do\ list. Escaping is using quotation
    marks except that it is for single characters.


    If you are unsure how to escape a file or directory name, let ls show you by using
    the -b option. Quoting and escaping not only spaces, but to other special characters
    including |, &, ''\'', ;, space, and tab.


    ```

    $ ls

    my to do list

    $ ls -l

    total 4

    -rw-r--r-- 1 jason users 73 Jun 22 22:16 my to do list

    $ ls -1 my to do list

    ls: cannot access my: No file or directory

    ls: cannot access to: No file or directory

    ls: cannot access do: No file or directory

    ls: cannot access list: No file or directory

    $ ls -1 "my to do list"

    ```

