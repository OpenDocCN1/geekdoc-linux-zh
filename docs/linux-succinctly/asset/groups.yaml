    # Creating and Removing Directories


    To create a directory, use the mkdir command. Directories can be deleted with
    the rmdir and rm commands.


    mkdir [-p] directory Create a directory. When used with the -p (parents) option,
    intermediate directories are created.


    rmdir [-p] directory Remove a directory. When used with the -p (parents) option,
    all the specified directories in the path are removed. The rmdir command only
    removes empty directories. To remove directories and their contents, use rm.


    rm -rf directory The rm command removes files, directories, or both. To have rm
    recursively remove a directory and all of its contents, use the -r (recursive)
    and -f (force) options. Multiple options can be combined by using a dash followed
    by all the options without a space. Order does not matter. The commands rm -r
    -f dir, rm -rf dir, and rm -f -r dir are all equivalent.


    Use the rm with caution, especially rm -rf. The command line doesn''t have a trash
    container where you can restore accidentally deleted files. When you delete something
    with the command line it is gone. The following demonstrates the use of mkdir,
    rmdir, and rm.


    ```

    $ mkdir newdir

    $ mkdir newdir/one/two

    mkdir: cannot create directory ''newdir/one/two'': No such file or directory

    $ mkdir -p newdir/one/two

    $ rmdir newdir

    rmdir: directory "newdir": Directory not empty

    $ rm -rf newdir

    $ ls newdir

    ls: newdir: No such file or directory

    $ mkdir newdir

    $ rmdir newdir

    $ ls newdir

    ls: cannot access newdir: No such file or directory

    $

    ```'
