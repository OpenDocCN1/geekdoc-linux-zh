    要将作业返回到前台，请使用 `fg` 命令后跟百分号和作业号。执行相同任务的简便方法是在命令行上输入百分号后跟作业号。因此，`fg %2` 和 `%2` 是等价的。


    记住当前作业可以通过 `%%` 或 `%+` 引用。此外，除非提供了另一个作业，否则 `fg` 命令对当前作业操作。以下四个命令是相同的。


