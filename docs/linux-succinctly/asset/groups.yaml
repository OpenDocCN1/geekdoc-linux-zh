  - "[PAGE 79]\n\ncommands. Once the program is finished, a new command prompt is\
    \ displayed, ready to execute your next command. Many commands take anywhere from\
    \ a fraction of a second to just a few seconds to run. However, you may want to\
    \ execute a long running program and continue to perform other work in the meantime.\
    \ To start a program in the background, end the command line with an ampersand.\
    \ When you start a program in the background, the command prompt is immediately\
    \ returned and allows you to continue other commands. These background programs\
    \ and processes are often referred to as jobs.\n\n| Command | Description |\n\
    | command & | Start command in the background. |\n| Ctrl-c | Kill the foreground\
    \ process. |\n| Ctrl-z | Suspend the foreground process. |\n| bg [%num] | Background\
    \ a suspended process. |\n| fg [%num] | Foreground a backgrounded process. |\n\
    | kill [%num] | Kill a process by job number or PID. |\n| jobs [%num] | List all\
    \ jobs or %num job. |\n\nWhen a program is started in the background, two numbers\
    \ are returned before the new prompt is displayed. Those two pieces of information\
    \ are the job number, which is enclosed in brackets, and the process ID (PID).\
    \ Job numbers can be referenced by preceding them with a percent sign. The following\
    \ example demonstrates starting multiple processes in the background.\n\n```\n\
    $ ./long-running-proc & \n[1] 2793\n$ ./long-running-proc & \n[2] 2795\n$ ./long-running-proc\
    \ & \n[3] 2807\n$ ./long-running-proc & \n[4] 2809\n$ jobs\n[1] Done /long-running-proc\
    \ & \n[2] Running /long-running-proc & \n[3]- Running /long-running-proc & \n\
    [4]+ Running /long-running-proc & $\n```\n\nIn the output of the jobs command,\
    \ you will notice a plus sign and a minus sign. The plus sign represents the current\
    \ job, while the minus sign represents what is considered to be"
- md: "\nprevious job. The current job is the last job that was started in the background\
    \ or the most recent process that was stopped while it was running in the foreground.\
    \ You can reference the current job by using double percent signs (%% or a percent\
    \ sign followed by a plus sign (+). The previous job can be accessed by using\
    \ a percent sign followed by a minus sign (-). When working with the fg and bg\
    \ commands, the current job is operated upon unless you explicitly specify a different\
    \ job.\n\nIn the preceding output of the jobs command, job number 1 is reported\
    \ as done while the other jobs are in a running state. The shell reports job statuses\
    \ right before a new prompt is displayed. The shell will not interrupt your current\
    \ command line, even if it is empty, to report that a job has completed. For a\
    \ new prompt to be displayed, press the Enter key. If any of your jobs have completed,\
    \ a status will be displayed before your new prompt is presented. The following\
    \ is an example of that behavior.\n\n```\n$ <ENTER>\n$ <ENTER>\n[2] Done ./long-running-proc\
    \ &\n$ jobs\n[3]- Running ./long-running-proc &\n[4]+ Running ./long-running-proc\
    \ &\n$\n```\n\nIn order to return a job to the foreground, use the fg command\
    \ followed by a percent sign and job number. A shorthand to perform the exact\
    \ task is to type a percent sign followed by the job number on the command line.\
    \ So, fg %2 and %2 are equivalent.\n\nRemember that the current job can be referenced\
    \ by %% or %+. Also, the fg command operates on the current job unless another\
    \ job is supplied. The following four commands are identical.\n\n```\n$ fg\n$\
    \ fg %%\n$ fg %+\n$ %%\n```\n\nThe following demonstrates bringing job number\
    \ three into the foreground.\n\n```\n$ jobs\n[3]- Running ./long-running-proc\
    \ &\n[4]+ Running ./long-running-proc &\n$ fg %3\n./long-running-proc &\n```\n\
    \nTo pause or suspend the foreground process, type Ctrl-z. A job that has been\
    \ suspended can be resumed in the background or foreground. To resume a suspended\
    \ job in the background, type the job specification followed by an ampersand,\
    \ or use the bg command followed by the specification. If you want to background\
    \ the process that was most recently suspended, you can omit the job specification\
    \ as bg will operate on the current job. Resume the job in the foreground, use\
    \ the fg command or just the job specification. The following demonstrates these\
    \ methods.\n\n```\n$ jobs\n[1] Running /long-running-proc &\n[2] Running /long-running-proc\
    \ &\n[3]- Running /long-running-proc &\n[4]+ Running /long-running-proc &\n$ %2\n\
    ./long-running-proc\n^Z\n[2]+ Stopped /long-running-proc\n$ fg %3\n./long-running-proc\n\
    ^Z\n[3]+ Stopped /long-running-proc\n$ jobs\n[1] Running /long-running-proc &\n\
    [2]- Stopped /long-running-proc &\n[3]+ Stopped /long-running-proc &\n[4] Running\
    \ /long-running-proc &\n$ bg\n[3]+ /long-running-proc &\n$ jobs\n[1] Running /long-running-proc\
    \ &\n[2]+ Stopped /long-running-proc &\n[3] Running /long-running-proc &\n[4]-\
    \ Running /long-running-proc &\n$\n```\n\nTo kill a job that is running in the\
    \ foreground, use Ctrl-c. To kill a job that has been backgrounded, use the kill\
    \ command. The kill command takes a job specification or process ID as an argument.\
    \ To list the PIDs in addition to the job numbers, use the -1 option of the jobs\
    \ command.\n\n```\n$ jobs\n[1] Running /long-running-proc &\n[2] Running /long-running-proc\
    \ &\n[3]- Running /long-running-proc &\n[4]+ Running /long-running-proc &\n$ fg\
    \ %1\n```\n\n```\n./.long-running-proc\n^C$ jobs\n[2] Running      ./long-running-proc\
    \ &\n[3]- Running      ./long-running-proc &\n[4]+ Running      ./long-running-proc\
    \ &\n$ kill %3\n[3]- Terminated   ./long-running-proc\n$ jobs -l\n[2]- 2914 Running\
    \  ./long-running-proc &\n[4]+ 2918 Running  ./long-running-proc &\n$ kill 2914\n\
    [2]- Terminated   ./long-running-proc\n$\n```\n\nThe kill command sends a signal\
    \ to a running process. The default signal, however, is termination. The termination\
    \ signal is referred to as SIGTERM or just TERM for short. To display a list of\
    \ signals and their corresponding numbers, use the kill -1 command. To specify\
    \ a signal to send to a process, follow the kill command with a dash and the name\
    \ or number.\n\n```\n$ kill -1 | grep SIGTERM\n11) SIGSEGV 12) SIGUSR2 13) SIGPIPE\
    \ 14) SIGALRM 15) SIGTERM\n$ kill 123\n$ kill -SIGTERM 234\n$ kill -TERM 345\n\
    $ kill -15 456\n```\n\nIf a process does not terminate after it has been sent\
    \ the TERM signal, use the KILL signal. The corresponding number for SIGKILL is\
    \ 9.\n\n```\n$ ps | grep cannot-stop-me\n2994 pts/1 00:00:00 cannot-stop-me\n\
    $ kill 2994\n$ ps | grep cannot-stop-me\n2994 pts/1 00:00:00 cannot-stop-me\n\
    $ kill -9 2994\n$ ps | grep cannot-stop-me\n$\n```\n\n# Chapter 13 Switching Users\n\
    \nTo switch users at the command line, use the **su** command. Without any arguments,\
    \ **su** will switch to the superuser account, also known as root. Alternatively,\
    \ you can execute **su root**. Switching users will not change your current working\
    \ directory or environment variables, unless you specify a hyphen following su.\
    \ By specifying a hyphen, you simulate logging into the system as that user. For\
    \ example, `su - root`.\n\n**su [username]** Change to username or become the\
    \ superuser.\n\nCommon **su** options:\n\n- - A hyphen is used to provide an environment\
    \ similar to what the user would expect had the user logged in directly.\n- **su\
    \ -c command** Specify a command to be executed. If the command is more than one\
    \ word in length, it needs to be quoted.\n\n```\n$ su - root\n$ su - username\n\
    ```\n\n# Sudo Do\n\nThe sudo command allows a user to execute a command as another\
    \ user, typically the superuser. One advantage of using sudo over su is that you\
    \ do not need to know the root password, and has full control over what commands\
    \ works. The su command is similar to su, but you should note these differences:\
    \ su (switch user) asks for the new user's password, whereas sudo asks for the\
    \ current user's password, or possibly no password at all.\n\nIf you want to know\
    \ what user you are, run the whoami command. \n\n# Using Sudo\n\nHere are the\
    \ common ways to use the sudo command.\n\n- sudo -1 List available commands that\
    \ can be executed with sudo.\n- sudo command Run command as the superuser.\n-\
    \ sudo -u root Same as sudo command.\n- sudo -u user Run command as user.\n- sudo\
    \ su Switch to the superuser account.\n- sudo su - Switch to the superuser account\
    \ with an environment you would expect to see logged in as that user.\n- sudo\
    \ su - username Switch to the username account with an environment you would expect\
    \ to see had you logged in as that username.\n\n```\n$ sudo -l\nUser user may\
    \ run the following commands on this host:\n(root) NOPASSWD: /etc/init.d/apache2\n\
    (fred) NOPASSWD: /opt/fredsApp/bin/start\n(fred) NOPASSWD: /opt/fredsApp/bin/stop\n\
    (root) /bin/su - oracle\n$ sudo /etc/init.d/apache2 start\n* Starting web server\
    \ apache2\n$ sudo -u fred /opt/fredsApp/bin/start\nFred's app started as user\
    \ fred.\n$ sudo su - oracle\n[sudo] password for jason\noracle@linuxsvr~$ whoami\n\
