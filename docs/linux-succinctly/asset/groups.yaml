    # The Story behind the Succinctly Series of Books


    Daniel Jebaraj, Vice President

    Syncfusion, Inc.


    Sating on the cutting edge


    As many of you know, Syncfusion is a provider of software components for the Microsoft
    platform. This puts us in the exciting but challenging position of always being
    on the cutting edge.


    Whenever platforms or tools are shipping out of Microsoft, which seems to be about
    every other week these days, we have to educate ourselves, quickly.


    ## Information is plentiful but hard to digest


    In reality, this translates into a lot of book orders, blog searches, and Twitter
    scans.


    While more information is becoming available on the Internet and more and more
    books are being published, even on topics that are relatively new, one aspect
    that continues to inhibit us is the inability to find concise technology overviews.


    We are usually faced with two options: read several 500+ page books or scour the
    web for relevant blog posts and other articles. Just as everyone who has a job
    to do and customers to serve, we find this quite frustrating.


    ## The Succinctly series


    This frustration translated into a deep desire to produce a series of concise
    technical books that would be targeted at developers working on the Microsoft
    platform.


    We firmly believe, given the background knowledge such developers have, that most
    topics can be translated into books that are between 50 and 100 pages.


    This is exactly what we resolved to accomplish with the Succinctly series. Isn''t
    everything wonderful born out of a deep desire to change things for the better?


    ## The best authors, the best content


    Each author was carefully chosen from a pool of talented experts who shared our
    vision. The book you now hold in your hands, and the others available in this
    series, are a result of the authors'' tireless work. You will find original content
    that is guaranteed to get you up and running in the time it takes to drink a few
    cups of coffee.


    ## Free forever


    Syncfusion will be working to produce books on several topics. The books will
    always be free.

    Any updates we publish will also be free.


    ## Free? What is the catch?


    There is no catch here. Syncfusion has a vested interest in this effort.


    As a component vendor, our unique claim has always been that we offer deeper and
    broader frameworks than anyone else on the market. Developer education greatly
    helps us market and sell against competing vendors who promise to "enable AJAX
    support with one click," or "turn the moon to cheese!"


    ## Let us know what you think


    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly-series@syncfusion.com.


    We sincerely hope you enjoy reading this book and that it helps you better understand
    the topic of study. Thank you for reading.


    Please follow us on Twitter and "Like" us on Facebook to help us spread the word
    about the Succinctly series!


    ## About the Author


    Jason Cannon started his career as a Unix and Linux System Engineer in 1999. Since
    that time, he has utilized his Linux skills at companies such as Xerox, UPS, Hewlett-Packard,
    and Amazon. Additionally, he has acted as a technical consultant and independent
    contractor for small businesses as well as Fortune 500 companies.


    Jason has professional experience with CentOS, RedHat Enterprise Linux, SUSE Linux
    Enterprise Server, and Ubuntu. He has used several Linux distributions on personal
    projects including Debian, Slackware, CrunchBang, and others. In addition to Linux,
    Jason has experience supporting proprietary Unix operating systems including AIX,
    HP-UX, and Solaris.


    He enjoys teaching others how to use and exploit the power of the Linux operating
    system. Jason is the author of Command Line Kung Fu: Bash Scripting Tricks, Linux
    Shell Programming Tips, and Bash Oneliners as well as Linux for Beginners: An
    Introduction to the Linux Operating System and Command Line. He is also the founder
    of http://LinuxTrainingAcademy.com, where he blogs and teaches online video training
    courses.


    # Chapter 1 Introduction


    ## What is Linux?


    Linux is a Unix-like open source operating system. At the core of the operating
    system is the Linux kernel. It acts as the intermediary between the applications
    which run in the operating system and the underlying hardware.


    ## Linux Distributions


    A distribution is the Linux kernel and a collection of software that, together,
    creates an operating system. Even though the Linux kernel is at the heart of every
    distribution, the software that is installed by default can vary greatly as each
    distribution has its own goals and areas of focus. However, what you will learn
    in this book is applicable to any distribution as the concepts are fundamental
    to the Linux operating system as a whole.


    Some distros (distributions) are maintained by a community of volunteers, while
    others are backed by companies that charge fees for subscriptions and support.
    Some distros are designed to run on laptops and desktops, others are designed
    to run on servers. The following are just a few of the most popular Linux distributions
    available today:


    - Linux Mint

    - Ubuntu

    - Debian

    - Fedora

    - openSUSE

    - Arch Linux

    - CentOS

    - Red Hat Enterprise


    # Chapter 2 Linux Directory Structure


    The Linux directory structure is like a tree. The base of the Linux file system
    hierarchy begins at the root, trunk, and directories branch off from there. Each
    of these directories, called folders on other operating systems, and can often
    contain other directories. The directories on a Linux system are separated by
    a forward slash.


    ## Common Top-Level Directories


    What follows is a list of some of the most important top-level directories. Of
    course, all of the directories on a Linux system have a purpose, but understanding
    what these particular directories are for is as important as using a Linux system.
    These top-level directories will be the ones that you interact with most often.


    ### The Root Directory


    Every file and directory on a Linux system resides under the / directory. This
    directory is referred to as the root directory or sometimes "slash," a shorthand
    way of saying forward slash.


    Even additional physical or virtual storage devices that are attached to a Linux
    system live somewhere underneath the / directory. The c:\ drive on a Windows system
    is analogous to / Linux. When another storage device is attached to a Windows
    system, it is assigned a new drive letter such as D:\. On a Linux system, storage
    devices are attached, or mounted, to a directory such as /mnt or /media/external.


    ### /bin Binaries


    The /bin directory houses essential user binaries and other executable programs.
    The most basic and fundamental command line utilities reside in /bin. For example,
    some of the commands in /bin are used to list, copy, move, and view files. Other
    non-essential binaries are located in /usr/bin. You will find graphical applications
    such as web browsers and mail readers here, as well as any other command line
    utilities.


    ### /etc System Configuration Files


    Configuration files that control how applications or the operating system behave
    are located in the /etc directory. For example, there is a configuration file
    in /etc that tells the operating system whether to boot into text mode or a graphical
    mode.


    ### /home Home Directories


    Each user on a Linux system has a subdirectory dedicated to his or her account
    in the /home directory. For example, my user account is "jason" and thus my home
    directory is /home/jason. Since all users have their own home directory, they
    have the option of keeping their data private, sharing it with other users on
    the system, or a combination of the two.


    Typical home directory contents include files created by the user, text documents,
    pictures, music, etc. Additionally, user-specific configurations are stored in
    the home directory. These configuration files can control the behavior of the
    user''s graphical or text environment, by example.


    ### /opt Optional or Third-Party Software


    Optional or third-party software resides in the /opt directory. The /opt directory
    is for software that is not bundled with the operating system. For example, the
    Google Chrome browser is not part of the standard operating system and installs
    in /opt/google/chrome.


    ### /tmp Temporary Space


    Temporary space is available in /tmp. This directory can be used by applications
    or individual users on the system. The contents of /tmp are typically cleared
    at boot time, so not storing anything in tmp that you cannot live without or that
    you want to store long-term.


    ### /usr User-Related Data, Read-Only


    The usr directory is where user-related programs and read-only data reside. The
    contents of /usr are meant to be used by actual users of the system as opposed
    to the operating system itself. A whole directory hierarchy exists in /usr. For
    example, the /usr/bin directory contains binary files and applications, while
    /usr/share/doc contains documentation related to those applications.


    ### /var Variable Data


    Variable data, the most notable being log files, is stored in the /var directory.
    Several log files exist in the /var/log directory or subdirectory thereof.


    ## Comprehensive Listing of Top-Level Directories


    In addition to the directories previously covered, there are additional top-level
    directories you may encounter on a Linux system. Many of these directories will
    be of little concern to you in your day-to-day use of the operating system; however,
    they are an essential part of a functioning Linux system. This may be used as
