    # Vim 编辑器


    如果你正在一个具有高级编辑功能且可以在命令行使用的编辑器，请使用 vi 或 Emacs。在 Linux 系统上，当你尝试使用 vi 时，你实际上在使用 Vim（improved
    的缩写）。vi 通常是指向 Vim 的软链接。Vim 编辑器兼容 vi 编辑器中的命令，vi 最初是为 Unix 操作系统创建的。Vim 包含了 vi 不具备的额外功能：语法高亮、通过网络编辑文件的能力、多级撤销和重做以及分屏。学习
    Vim 或 vi 的优势之一是将按键映射应用到其他命令，例如 `man`、`more`、`less` 和 `view`。


    # 命令模式


    vi 和 Vim 编辑器的一个独特特性是模式的概念。Vim 有三种模式：命令模式、插入模式和行模式。Vim 启动时处于命令模式。要随时返回命令模式，只需按下
    Escape 键。在命令模式下，发送到编辑器的按键不会出现在文件中，而是被解释为命令。命令模式允许你在文件中导航、执行搜索、删除文本、复制文本、粘贴文本等操作。


    | 键 | 动作 |

    | --- | --- |

    | k | 向上移动一行。 |

    | j | 向移动一行。 |

    | h | 向左移动一个字符。 |

    | l | 向右移动一个字符。 |

    | w | 向右移动一个单词。 |

    | b | 向左移动一个单词。 |

    | ^ | 到行首。 |

    | $ | 到行尾。 |


    命令区分大小写。例如，小写的 `l` 将光标向右移动一个字符，大写的 `L` 将光标移动到窗口底部。尽管原始 vi 编辑器不允许使用方向键，但 Vim 可以。尽管你可以使用方向键，但有人认为原始
    vi 的按键绑定更快，因为你的手不需要离开主行。


    # 插入模式


    插入模式允许你在文件中实际输入文本。要进入插入模式，按下 `i`、`I`、`a` 或 `A`。输入所需的文本后，可以按下 Escape 键返回命令模式。


    | 键 | 动作 |

    | --- | --- |

    | i | 在当前位置插入。 |

    | I | 在行首插入。 |

    | a | 在光标位置后追加。 |

    | A | 在行尾追加。 |


    # 行模式


    行模式（有时称为命令行模式）通过在命令模式下输入冒号 `:` 来访问。行模式允许你保存文件、退出编辑器、替换文本并执行某些形式的导航。以下是你可能想要熟悉的一些常用的行模式命令。


    # 表 20：Vim 行模式命令


    | 键 | 动作 |

    |---|---|

    | :w | 写入或保存文件。 |

    | :w! | 强制保存文件，即使没有设置写入权限。 |

    | :q | 退出编辑器。如果文件有未保存的更改，则执行失败。 |

    | :q! | 不保存文件直接退出。 |

    | :wq! | 写入并退出。 |

    | :x | 等同于 :wq! |

    | :n | 将光标置于第 n 行。 |

    | $: | 将光标置于文件的最后一行。 |

    | :set nu | 打开行号显示。 |

    | :set nonu | 关闭行号显示。 |

    | :help [子命令] | 内置帮助文档。 |


    # 重复命令


    大多数命令可以通过在它们前面加上数字来重复。例如，要将光标向下移动三行，输入 **3j**。要插入 20 次相同的文本，输入 **20i** 后跟所需的文本，完成后按下
    Escape 键。插入操作将重复 20 次。要插入一行下划线，输入 **80i**。


    # 额外命令


    下表列出了在命令模式下使用的一些按键组合。


    # 表 21：Vim 模式—删除文本


    | 键 | 动作 |

    |---|---|

    | x | 删除一个字符。 |

    | dw | 删除一个单词。 |

    | dd | 删除一行。 |


    # 表 22：Vim 模式—更改文本


    | 键 | 动作 |

    |---|---|

    | ci | 更改一个字符。 |

    | cw | 更改一个单词。 |

    | cc | 更改整行。 |

    | c$ | 更改到行尾。 |


    # 表 23：Vim 模式—复制与粘贴


    | 键 | 动作 |

    |---|---|

    | yy | 复制（yank）当前行。 |

