    \ **diff**、**sdiff** 和 **vimdiff** 命令来比较文件和目录。**diff** 命令仅显示差异，**sdiff** 并排显示两个文件并高亮显示差异，而\
    \ **vimdiff** 则使用 Vim 编辑器显示差异。只需提供要比较的命令项即可。\n\n```\n$ cat random-states\nArizona\
    \ Phoenix\nColorado Denver\nGeorgia Atlanta\nIndiana Indianapolis\n$ cat random-states.bak\n\
    Arizona Phoenix\nColorado Denver\n```\n\nGeorgia Savannah Denver\nIndiana Indianapolis\n\
    \n```\n$ diff random-states random-states.bak\n3c3\n```\n\n```\n< Georgia Atlanta\n\
    ---\n> Georgia Savannah\n$ diff random-states random-states.bak\nArizona Phoenix\
    \ Phoenix\nColorado Denver Denver\nGeorgia | Georgia Savannah\nIndiana Indianapolis\
    \ Indiana\n$ diff random-states random-states.bak\nArizona Arizona Phoenix\nColorado\
    \ Colorado Denver\nGeorgia | Georgia Savannah\nIndiana Indiana Indianapolis\n\
    ```\n\nrandom-states 1,1 All random-states.bak 1,1 All\n\"random-states.bak\"\
    \ 4L, 104C\n$ tree\n\n```\n|-- dir1\n|   -- file1\n|-- dir2\n|   -- file1\n| \
    \  -- file2\n```\n\n2 个目录，3 个文件\n$ diff dir1 dir2: file2\n仅在 dir2\n$\n\n在 diff\
    \ 输出中，`<` 符号后的文本属于第一个文件，而 `>` 符号后的文本属于第二个文件。此外，diff 还以简写格式提供差异信息。第一个数字代表第一个文件的行号。下一个字符将\
    \ `c` 表示更改、`d` 表示删除或 `a` 表示添加。最后一个数字代表第二个文件的行号。\n\ndiff 命令使用管道 `|` 来表示同一行的更改。`<`\
    \ 符号表示该行仅存在于第一个文件中，而 `>` 符号表示该行仅存在于第二个文件中。\n\n# 第10 章 I/O 重定向\n\nLinux 操作系统具有一个称为\
    \ I/O 流的概念。三个默认的 I/O 流是标准输入、标准输出和标准错误。当一个进程启动时，它会连接到这三个 I/O 流，也称为标准流。默认情况下，标准输入来自你的键盘，而标准输出和标准错误显示在你的屏幕上。按照习惯，标准输出用于正常输出，而标准错误留给错误消息。\n\
    \n每个流都被分配了一个文件描述符。文件描述符由一个数字引用并代表一个打开的文件。标准输入被分配文件描述符 0，标准输出分配文件描述符 1，标准错误分配文件描述符\
    \ 2。这实际上意味着你的键盘和显示器可以替代实际文件。这种抽象层允许你将通常显示在屏幕上的输出保存到文件中。它还允许你从文件向命令发送输入。你可以将一个命令的输出作为另一个命令的输入。\n\
    \n表 34：标准流\n\n| 文件描述符 | 缩写 | 流 |\n| :--- | :--- | :--- |\n| 0 | stdin | 标准输入 |\n\
    | 1 | stdout | 标准输出 |\n| 2 | stderr | 标准错误 |\n\n许多 Linux 命令允许你通过指定文件作为参数或接受标准输入来提供输入。在没有文件的情况下，许多命令期望标准输入。文件以及标准输入都以文件结束\
    \ (EOF) 标记终止。你可以通过按键盘输入 **Ctrl-d** 来产生此 EOF 标记。\n\n作为这种行为的示例，让我们来看 **sort** 命令。要让\
    \ **sort** 在文件上操作，请在下面的示例提供该文件作为参数：\n\n```\n$ cat test.txt\ne\na\nc\nb\nd\n$ sort\
    \ test.txt\na\nb\nc\n```\n\n要让 sort 在标准输入上操作，在不带任何参数的情况下运行 sort 命令并开始输入文本。完成后，输入\
    \ Ctrl-d 发送 EOF 字符。你提供的标准输入将会被排序。\n\n```\n$ sort\na\nb\nc\nd\n<Ctrl-d>\na\nb\n\
    c\nd\ne\n$\n```\n\n要将一个命令的标准输出作为另一个命令的标准输入发送出去，请在命令之间使用管道 (|)。下面的示例演示了如何将 cat\
    \ text.txt 的输出发送给 sort 命令作为输入。\n\n```\n$ cat test.txt | sort\na\nb\nc\nd\ne\n\
    $\n```\n\n要将文件的内容作为标准输入，使用小于号 (<) 将命令与文件分开。\n\n```\n$ sort < test.txt\na\nb\n\
    c\nd\n```\n\n要将命令的输出重定向到文件，使用大于号 (>) 后跟文件名。如果文件不存在，它将被创建。如果它已存在，它将被覆盖。\n\n```\n\
    $ sort > sorted.txt\n$ cat sorted.txt\na\nb\nc\nd\ne\n```\n\n要将命令的输出追加到文件，使用双大于号\
    \ (>>) 后跟文件名。如果文件不存在，它将被创建。如果它已存在，输出将被追加到其中。\n\n```\n$ sort >> sorted.txt\n$ cat\
    \ sorted.txt\na\nb\nc\nd\ne\n```\n\n要从文件重定向命令的输入，使用小于号 (<) 后跟文件名。文件的内容将用用作标准输入。\n\
    \n```\n$ sort < test.txt\na\nb\nc\nd\n```\n\n重定向命令的输出到文件，使用大于号 (>) 后跟文件名。如果文件不存在，它将被创建。如果它已存在，它它覆盖。\n\
    \n重重重重重到文件。\n\n```\n$ sort > sorted.txt\n$ cat sorted.txt\na\nb\nc\nd\ne\n```\n\
    \n重定向命令的输入从文件，使用小于号 (<) 后跟文件名。文件的内容将用用作标准输入。\n\n```\n$ sort < test.txt\na\nb\n\
    c\nd\n```\n\n。你也可以同时重定向输入和输出。下面的示例演示了从 test.txt 重定向输入并将输出重定向到 sorted.txt。\n\n\
    ```\n$ sort < test.txt\n重定向到重定向。\n\n# 表 35：重定向 I/O\n\n| 操作符 | 格式 | 动作 |\n| :---\
    \ | :--- | :--- |\n| > | cmd > file | 创建或覆盖文件标准输出。 |\n| >> | cmd >> file | 创建或追加文件标准输出。\
    \ |\n| < | cmd < file | 使用文件作为标准输入。 |\n\n默认情况下，输入重定向操作描述符 0，输出重定向操作描述符 1。你可以通过紧跟操作符的声明文件描述符。如果文件描述符没有紧跟操作符，它将被解释为命令行上的另一个项。\n\
    \n为了将错误消息重定向到文件而将标准输出显示在你的屏幕上，使用 2>。你也可以将输出重定向到另一个文件。\n\n```\n$ ls test.txt no-such-file\n\
    ls: cannot access no-such-file: No such directory\ntest.txt\n$ ls test.txt no-such-file\
    \ 2>errors\ntest.txt\n$ cat errors\nls: cannot access no-such-file: No such directory\n\
    $ ls test.txt no-such-file 1>normal-output 2>errors\n$ cat normal-output\ntest.txt\n\
    $ cat errors\nls: cannot access no-such-file: No such directory\n$\n```\n\n不仅你可以将输出重定向到文件，你还可以使用\
    \ & 号后跟文件描述符将其重定向到另一个文件描述符。使用这种方法，你可以使用 2>&1 合并标准输出和标准错误。不要使用空格。\n\n输出意味着，“将 ls\
    \ 命令的标准输出发送到 combined-output 文件”。等等，“将 ls 命令的标准输出发送到 combined-output 文件并追加标准错误到标准输出。”所有输出都将发送到\
    \ combined-output 文件，因为标准错误被重定向到了标准输出，而标准输出被重定向到了 combined-output。\n\n```\n$ ls\
    \ test.txt no-such-file > combined-output 2>&1\n$ cat combined-output\nls: cannot\
    \ access no-such-file: No such directory\ntest.txt\n$\n```\n\n如果你不想将命令的输出显示在你的屏幕上或将其保存到文件中，你将输出重定向到空设备\
    \ /dev/null。这个特殊文件简单地丢弃任何发送到它的输入。空设备有时被称为“黑洞”或“比特桶”。下面的示例将 sort 的错误重定向到空设备。\n\n\
    ```\n$ ls test.txt no-such-file\nls: cannot access no-such-file: No such directory\n\
    test.txt\n$ ls test.txt no-such-file 2>/dev/null\ntest.txt\n$\n```\n\n"
