    $ history

    1 ls

    2 diff random-states random-states.bak

    3 history

    $ !

    1 ls

    Desktop Documents Downloads link-to-to-do Music program tmp to-do.txt

    $ echo $SHELL

    /bin/bash

    $ !!

    echo $SHELL

    /bin/bash

