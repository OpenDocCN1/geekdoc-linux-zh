  - '[PAGE 41]


    umask [-S] [mode] Sets the creation mask to a mode if specified. If a mode is
    omitted, the current mode will be displayed. Using the -S argument allows umask
    to display or set the mode with symbolic notation.


    A quick way to estimate how a umask mode affects default permissions is to subtract
    the octal umask mode from 777 in the case of directories, and 666 in the case
    of files. The following is an example of a 022 umask, which is typically the default
    umask used by Linux distributions or by system administrators.


    # Table 13: Creation Permission Estimation


    | File | Directory |

    |---|---|-|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -022 | -022 |

    | Creation Permission | 644 | 755 |


    Using a umask of 002 is ideal for working with members of your group. When files
    or directories are created, the permissions allow members of the group to manipulate
    those files and directories.


    # Table 14: Creation Permission Estimation


    | File | Directory |

    |---|---|-|

    | Base Permission | 666 | 777 |

    | Subtract the umask | -002 | -002 |

    | Creation Permission | 664 | 775 |


    Here is another possible umask to use for working with members of your group.
    By using 007, no permissions are granted to users outside of the group.


    # Table 15: Creation Permission Estimation


    | File | Directory |

    |---|---|-|

    | Base Permission | 666 | 777 |

    | Subtract the Umask | -007 | -007 |

    | Creation Permission | 660 * | 770 |


    Again, using this subtraction method is a good estimation. You can see that the
    method breaks down with the umask of 007. To get an accurate result each time,
    you need to convert the octal permissions into binary values. From there, you
    use a bitwise NOT operation on the umask mode and then perform a bitwise AND operation
    against that the base permissions. Another way to think of this is that the umask
    disables the values specified.'
  - '[PAGE 42]


    umask of 007 effectively means "disable all of the bits for the other users."
    A umask of 022 means "disable the write bits for the group and others."


    The following table contains all the resulting permissions created by each one
    of the eight mask settings. The most common and practical umask modes to use are
    022, 002, 077, and 007.


    Table 16: umasks and Resulting Permissions


    | File Permissions | Directory Permissions | Binary | Octal |

    |---|---|---|--|

    | rw- | rwx | 000 | 0 |

    | rw- | rw- | 001 | 1 |

    | r -- | r-x | 010 | 2 |

    | r -- | r -- | 011 | 3 |

    | -w- | -wx | 100 | 4 |

    | -w- | -w- | 101 | 5 |

    | --- | --x | 110 | 6 |

    | --- | --- | 111 | 7 |


    # Special Modes


    When the umask command is queried for the current setting, it returns four characters
    instead of three. The following example shows the umask clearly set to 002, but
    umask returns 0022.


    ```

    $ umask 022

    $ umask

    0022

    ```


    Until now, you have only been introduced to permissions for user, group, and other.
    However, there is a class of special modes called setuid, setgid, and sticky.
    These special modes are declared by prepending a character to the octal that you
    normally use with umask or chmod. The important point here is to know that umask
    022 is the same as umask 0022. Likewise, chmod 644 is the same as chmod 0644.


    The setuid permission allows the program to run as the owner of the file, not
    the user executing it. One example of where this permission is used with the passwd
    command. The passwd command allows a user to change his or her own password, but
    it requires superuser privileges to modify the /etc/passwd and /etc/shadow files.'
  - '[PAGE 43]


    Prepend the number 4 when using octal mode to enable the setuid permission. For
    symbolic mode, use u+s.


    ```

    $ ls -ld /usr/bin/passwd

    -rwxr-xr-x 1 root root 47032 Jul 26 2013 /usr/bin/passwd

    $ chmod 4555 script

    $ ls -l script

    -r-sr-xr-x. 1 jason users 0 Jun 7 18:11 script

    ```


    Similar to the setuid permission, the setgid permission allows a program to run
    with the group of the file, not the group of the user executing it. A Linux command
    that uses such a permission is the locate command.


    When the setgid is used on a directory, it causes new entries in that directory
    to be created with the same group as the directory. When with groups, using setgid
    on directories can prevent someone from accidentally creating a file in their
    default group instead of the intended group.


    Prepend the number 2 when using octal mode to enable the setgid permission. For
    symbolic mode, use g+s.


    ```

    $ ls -1 /usr/bin/locate

    -rwx-s--x 1 root root 35548 Oct 10 2012 /usr/bin/locate

    $ chmod 2555 script

    $ ls -l script

    -r-xr-xr-x 1 jason users 0 Jun 7 18:28 script

    $ mkdir salesdir

    $ chgrp salesdir

    $ chmod g+s salesdir

    $ ls -ld salesdir/

    drwxr-xr-x 2 jason users 4096 Jun 7 18:29 salesdir/

    $ touch salesdir/file-before-setgid

    $ ls -1 -salesdir/

    total 0

    -rw-r--r-- 1 jason users 0 Jun 7 18:29 file-before-setgid

    $ chmod g+s salesdir

    $ ls -ld salesdir

    drwxrwxr-x 2 jason users 4096 Jun 7 18:29 salesdir

    $ touch salesdir/file-after-setgid

    $ ls -ld salesdir/

    total 0

    -rw-r--r-- 1 jason sales 0 Jun 7 18:30 file-after-setgid

    -rw-r--r-- 1 jason users 0 Jun 7 18:29 file-before-setgid

    $

    ```'
