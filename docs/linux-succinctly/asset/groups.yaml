    |---|---|---|---|

    | rw- | rwx | 000 | 0 |

    | rw- | rw- | 001 | 1 |

    | r-- | r-x | 010 | 2 |

    | r-- | -- | 011 | 3 |

    | -w- | -wx | 100 | 4 |

    | -w- | -w- | 101 | 5 |

    | --- | --x | 110 | 6 |

    | --- | --- | 111 | 7 |


    ## 特殊模式


    当使用 umask 命令查询当前设置时，它返回四个字符而不是三个。以下示例显示 umask 明确设置为 022，但 umask 返回 002。


    ```

    $ umask 022

    $ umask 002

    ```


    到目前为止，你只引入了用户、组和其他用户的权限。然而，有一类被称为 setuid、setgid 和 sticky（粘滞位）的特殊模式。这些特殊模式通过在通常用于
    chmod 的八进制数字前面加上一个字符来声明。这里的关键点是得知道 umask 022 等同于 chmod 755。同样，644 等同于 chmod 644。


    setuid 权限允许程序以文件所有者的身份运行，而不是执行它的用户的身份。该权限的一个示例是 `passwd` 命令。`passwd` 命令允许用户更改自己的密码，但修改
    /etc/passwd 和 /etc/shadow 文件需要超级用户权限。


    使用八进制模式在前面加上数字 4 以启用 setuid 权限。对于符号模式，使用 u+s。


    ```

    $ ls -ld /usr/bin/passwd

    -rwxr-xr-x 1 root root 47032 Jul 26 /usr/bin/passwd

    $ chmod 4555

    $ ls -l

    -r-sr-xr-x 1 jason users 0 Jun 7

    ```


    与 setuid 权限类似，setgid 权限允许程序以文件组的身份运行，而不是执行它的用户的组。使用此类权限的 Linux 命令是 `locate`。当在目录上使用
    setgid 时，它会导致该目录中的新条目以与目录相同的组创建。对于组，在目录上使用 setgid 可以防止有人无意中在默认组中创建文件，而不是预期的组。使用八进制模式在前面加上数字
    2 以启用 setgid 权限。对于符号模式，使用 g+s。


    ```

    $ ls -ld /usr/bin/locate

    -rwx-s--x 1 root root 35548 Oct 10 /usr/bin/locate

    $ chmod 2555

    $ ls -l

    -r-xr-xr-x 1 jason users 0 Jun 7

