    # # Aliases


    You can use keyboard shortcuts, called aliases, at the command line. You can save
    yourself some time and by creating aliases for commands that you repeat often,
    are long, that are hard to type, or that are difficult to remember. You can use
    aliases to fix common typing mistakes. Some people use aliases to make Linux behave
    like another operating system they are familiar with.


    **alias [alias_name=[value]]** Without any arguments, the alias command lists
    the aliases that are in your environment. So **alias alias_name=value** to create
    a new alias.


    **unalias alias_name** Remove **alias_name**. Use **unalias -a** to delete aliases.


