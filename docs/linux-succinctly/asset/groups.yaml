    \ 公司安装或创建的二进制文件和程序。\n- /opt/widget/etc Widget 公司安装或创建的程序的配置文件。\n\n在该组织目录结构内可以进行进一步的细分。例如，每个应用程序可以接收自己的子目录，如下：\n\
