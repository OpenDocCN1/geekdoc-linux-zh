    cp source_file1 [source_fileN ...] destination_directory Copy the source_files
    to the **destination_directory**.


    **cp -i source_file destination_file** Use the `-i` option of **cp** to run in
    interactive mode. The **destination_file exists**, cp will give you the opportunity
    to abort the operation or continue by overwriting the **destination_file**.


    **cp -r source_directory destination_directory** The `-r` option of **cp** causes
    the **source_directory** to be recursively copied to the **destination_directory**.
    If the **destination_directory exists**, the source directory is copied into the
    **destination_directory**. Otherwise the **destination_directory** will be created
    with the contents of the **source_directory**.


