    ## Chapter 8 Deleting, Moving, and Renaming Files and Directories


    Files and directories can be deleted with the `rm` command.


    `rm file` Remove file.


    `rm -r directory` To remove a directory with `rm`, the `-r` argument is required.
    The `-r` argument tells `rm` to remove files and directories recursively.


    `rm -f file` Use the `-f` option for removal without prompting for confirmation.


    Search patterns in the form of wildcards can be used with commands like `rm` and
    `ls`. The commonly used wildcards are the asterisk and the question mark. The
    asterisk matches anything, while the question mark matches a single character.
    Remember that files and directories with a period are considered hidden and will
    not matched by the asterisk. To include hidden files in your search, start your
    search with a period.


    ```

    $ ls Desktop Downloads Music todo.txt

    $ ls t*

    ls cannot access t*: No such file or directory

    $ ls g*goals.txt

    $ ls g?

    ls cannot access g?: No such file or directory

    $ ls -d .*

    .bash_history .bashrc .profile

    $ rm .hidden

    ```


    The `cp` command is used to copy files and directories. To create a copy, run
    `cp source_file destination_file`. You can also copy one or more files to a directory
    by ending the `cp` command with a destination directory.


    `cp source_file destination_file` Copy the source_file to the destination_file.


    `cp source_file... destination_directory` Copy the source_files to the destination_directory.


    `cp -i source_file destination_file` Use the `-i` option of `cp` to run in interactive
    mode. If the destination_file exists, `cp` will give you the opportunity to abort
    the operation or continue by overwriting the destination_file.


    `cp -r source_directory destination_directory` The `-r` option of `cp` causes
    the source_directory to be recursively copied to the destination_directory. If
    the destination_directory exists, the source directory is copied into the destination_directory.
    Otherwise, the destination_directory will be created with the contents of the
    source_directory.


    ```

    $ ls

    1file

    $ cp 1file 2file

    $ ls

    1file 2file

    $ mkdir 1dir

    $ cp 1file 2file 1dir

    $ ls 1dir/

    1file 2file

    $ cp -i 2file 1file

    cp: overwrite ''1file''? n

    $ cp -r 1dir 2dir

    $ ls 2dir/

    1file 2file

    $ cp 1dir 3dir

    cp: omitting directory ''1dir''

    $ mkdir 3dir

    $ cp -r 1dir 2dir 3dir

    $ ls 3dir

    1dir 2dir 3dir

    |-- 1dir

    |-- 1file

    |-- 2file

    |-- 2dir

    |-- 1file

    |-- 2file

    2 directories, 4 files

    ```


    To move files and directories from one location to another, use the `mv` command.
    Additionally, the `mv` command is used to rename files and directories.


    `mv source destination` Moves source to destination. If destination is a directory,
    source will be moved into destination. If destination is not a directory, then
    source will be renamed destination.


    `mv -i destination` Use the `-i` option to run in interactive mode. If the destination
    exists, `mv` will give you the opportunity to abort the operation or continue
    by overwriting the destination.


    In the following example, 1dir is renamed to 1dir-renamed using the `mv` command.
    Next, 1file is renamed to 2file and moved into the 1dir-renamed directory. If
    you do not specify the `-i` option to `mv`, it will overwrite an existing file
    without prompting. This is demonstrated by moving 1file to 2file. An existing
    file is demonstrated with 2file.


    ```

    $ ls -F

    1dir/ 1file 2dir/ 2file 3dir/

    $ mv 1dir 1dir-renamed

    $ ls -F

    1dir-renamed/ 1file 2dir/ 2file 3dir/ file1

    $ mv 1file file1

    $ ls -F

    1dir-renamed/ 2dir/ 2file 3dir/

    $ ls -F

    1dir-renamed/

    1file 2file file1

    $ cat 1dir-renamed/1file

    The contents of 1file.

    $ cat 1dir-renamed/2file

    The contents of 2file.

    $ mv 1dir-renamed/1file 1dir-renamed/2file

    $ cat 1dir-renamed/2file

    The contents of 1file.

    $ ls -F 1dir-renamed/

    2file file1

    $ mv -i 1dir-renamed/2file/file1

    mv: overwrite ''1dir-renamed/file1''? n

    $

    ```


    ## Chapter 9 Finding, Sorting, and Comparing Files and Directories


    To locate files or directories on a Linux system, you can use `find`. You can
    find files by name, size, permissions, modification time. However, if you were
    to run `find / -name some_name`, find would examine every file on the system and
    this could potentially be a slow process. There is another utility that you can
    use to find items and it''s called locate.


    locate pattern Display files and directories that match pattern.


    The locate command examines an index, or database, which is updated daily by a
    process named updatedb. The advantage to this approach is that it''s really fast
    since it doesn''t have to examine files and directories in real time. The disadvantage
    is that it is not in real time. The locate command is great for finding files
    or directories that are older than a day, but it won''t find items that have just
    been created. Also, locate and updatedb are sometimes not installed enabled.


    ## Table 32: Common find Commands


    | Command | Description |

    |---|---|

    | find -name | Display items by name. |

    | find -iname | Same as name, but not case sensitive. |

    | find -ls | Perform ls on each item. |

    | find -mtime | Display items that are older than days. |

    | find -size | Display items by size. |

    | find -type d | Display directories. |

    | find -exec | Run command against each item. |

    | find {} | Placeholder for found items. |


    The `find` command examines each file and directory in the provided path to determine
    if it matches the given expression. When running `find` without arguments, path
    is assumed to be current directory.


    ```

    $ ls Desktop Downloads Music todo.txt

    .bash_history .bashrc .profile

    .hidden

    .viminfo

    $ find -name

    .bash_history .bashrc .profile

    .hidden ..viminfo

    $ find -name *

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name t*

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name g*

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name g?

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ find -name g????

    .bash_history .bashrc .profile

    .hidden .viminfo

    $ ls -d .*

    .bash_history .bashrc .profile

    .hidden .viminfo

    ```


    ## Table 33: Common sort Options


    | Option | Description |

    |---|---|

    | sort | Sort the text in file. |

    | sort -k FIELD_NUM | Sort by "key". Sort by the FIELD_NUM column. |

    | sort -r | Sort in reverse order. |

    | sort -u | Sort uniquely. No duplicates are displayed. |


    Use the sort command to sort the contents of files.


    ```

    $ find -mtime 12

    .bashrc .viminfo

    $ find -size +2M

    /Music/Johntrane/giantsteps.mp3

    $ find -type d -newer-do

    /Music/Johntrane

    $ find -name *|exec;

    ```


    High Performance MPEG 1.0/2.5 Audio Player for 1, 2 version 1.12; copyright by
    Michael Hipp and others free software (LGPL/GPL) without any warranty best wishes


    Directory: ./Music/Johntrane/

    Playing MPEG stream of 1...

    Title: Giant Steps

    MPEG 1.0 layer III, 192 kbit/s, 44100 Hz

    [0:00] Decoding of giantsteps.mp3 finished.

    $'
