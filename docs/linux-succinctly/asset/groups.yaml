    umask [-S] [mode] 如果指定了模式，则将创建掩码设置为该模式。如果省略了模式，则将显示当前模式。使用 -S 参数允许 umask 以符号表示法显示或设置模式。


    快速估算 umask 模式如何影响默认权限的一种快捷方法是：对于目录，从 777 中减去八进制 umask 模式；对于文件，则从 666 中减去。以下是一个
    022 umask 的示例，这通常是 Linux 发行版或系统管理员使用的默认 umask。


    # 表 13：创建权限估计


    | 文件 | 目录 |

    |---|---|---|

    | 基础权限 | 666 | 777 |

    | 减去 umask | -022 | -022 |

    | 创建权限 | 644 | 755 |


    使用 002 umask 非常适合与用户组成员共同工作。当创建文件或目录时，该权限允许组内成员操作这些文件和目录。


    # 表 14：创建权限估计


    | 文件 | 目录 |

    |---|---|---|

    | 基础权限 | 666 | 777 |

    | 减去 umask | -002 | -002 |

    | 创建权限 | 664 | 775 |


    这是另一个可以用于与组内成员工作的 umask。通过使用 007，不会向组外用户授予任何权限。


    # 表 15：创建权限估计


    | 文件 | 目录 |

    |---|---|---|

    | 基础权限 | 666 | 777 |

    | 减去 umask | -007 | -007 |

    | 创建权限 | 660 | 770 |


    再次提到，使用这种减法方法是一个很好的估算。你可以看到，当 umask 为 007 时，该方法失效了。为了每次都能获得准确的结果，你需要将八进制权限转换为二进制值。从那里开始，对
    umask 使用位取反（NOT）操作，然后对基础权限执行位与（AND）操作。另一种思考此方式是：umask 禁用了指定的值。022 的 umask 实际上意味着“禁用组的写位”。007
    的 umask 意味着“禁用所有的所有位”。


    下表包含了由八种掩码设置产生的权限。最常用且实用的 umask 模式是 022、002、077 和 007。


    # 表 16：umask 及其产生的权限


