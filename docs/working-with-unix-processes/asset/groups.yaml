  - '[PAGE 122]


    ```

    perform(job, &block)

    ```


    Here in the child process is where the job is actually ''performed'' by Resque.


    ```

    exit! unless @cant_fork

    ```


    Then the child process exits.


    # Why Bother?


    As mentioned in the first paragraph of this chapter, Resque isn''t doing this
    to achieve concurrency or to make things faster. In fact, it adds an extra step
    to the processing of each job which makes the whole slower. So why go to the trouble?
    Why not just process job after job?


    Resque uses fork(2) to ensure that the memory usage of its worker processes don''t
    bloat. Let''s review what happens when a Resque worker forks and how that affects
    the Ruby VM.


    You''ll recall that fork(2) creates a new process that''s an exact copy of the
    original process. The original process, in this case, has preloaded the application
    environment and nothing else. So we know that after forking we''ll have a new
    process with just the application environment loaded.


    Then the child process will go to the task of working off the job. This is where
    memory usage can go awry. The background job may require that image files are
    loaded into main memory for processing, or many ActiveRecord objects are fetched
    from the'
  - '[PAGE 123]


    database, or any other operation that requires large amounts of main memory to
    be used.


    Once the child process is finished with the job exits, which releases all of its
    memory back to the OS to clean up. Then the original process can resume, once
    again with only the application environment loaded.


    So each time a job is performed by Resque you end up back at a clean slate in
    terms of memory usage. This means that memory usage may spike when jobs are being
    worked on, but it should always come back to that nice baseline.


    # Doesn''t the GC clean up for us?


    Well, yes, but it doesn''t do a great job. It does an OK job. The truth is that
    MRI''s GC has a hard time releasing memory that it doesn''t need anymore.


    When the Ruby VM boots up it is allocated a certain block of main memory by the
    kernel. When it uses all that it has it needs to ask for another block of main
    memory from the kernel.


    Due to numerous issues with Ruby''s GC (naive approach, disk fragmentation) it
    is rare that the VM is able to release a block of memory back to the kernel. So
    the memory usage of a Ruby process is likely to grow over time, but not to shrink.
    Now Resque''s approach begins to make sense!


    If the Resque worker simply worked off each job as it became available then it
    wouldn''t be able to maintain that nice baseline level of memory usage. As soon
    as it worked on a job that required lots of main memory then that memory would
    be stuck with the worker process until it exited.'
  - '[PAGE 124]


    Even if subsequent jobs needed much less memory Ruby would have a hard time giving
    that memory back to the kernel. Hence, the worker processes would inevitably get
    bigger over time. Never shrinking.


    Thanks to the power of fork(2) Resque workers are reliable and don''t need to
    be restarted after working a certain number of jobs.'
  - '[PAGE 125]


    # Appendix: How Unicorn Reaps Worker Processes


    Any investigation of Unix Programming in the Ruby language would be remiss without
    many mentions of the Unicorn web server¹. Indeed, the project has already been
    mentioned several times in this book.


    What''s the big deal? Unicorn is a web server that attempts to push as much responsibility
    onto the kernel as it can. It uses lots of Unix Programming. The codebase is chock
    full of Unix Programming techniques.


    Not only that, but it''s performant and reliable. It''s used by lots of big Ruby
    websites like Github and Shopify.


    The point is, if this book has whet your appetite and you want to learn more about
    Unix Programming in Ruby you should plumb the depths of Unicorn. It may take you
    several trips into the belly of the mythical beast but you will come out with
    better understanding and new ideas.


    # Reaping What?


    > ¹http://unicorn.bogomips.org'
