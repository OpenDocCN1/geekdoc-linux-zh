    # Chapter 8

    Processes Have Arguments


    Every process has access to a special array ARGV. Other programming languages
    may implement it slightly differently, but every one has something called ''argv''.


    argv is a short form for ''argument vector''. In other words: a vector, or array,
    of arguments. It holds the arguments that were passed to the current process on
    the command line. Here''s an example of inspecting ARGV and passing in some simple
    options.


    ```

    $ cat argv.rb

    p ARGV

