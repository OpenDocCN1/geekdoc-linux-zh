- raw:
  - '[PAGE 49]


    Now it becomes clear that the code in the if block is being executed by the parent
    process, while the code in the else block is being executed by the child process.
    The child process will exit after executing its code in the else block, while
    the parent process will carry on.


    Again, there''s a rhythm to this beat, and it has to do with the return value
    of the fork method. **In the child process** fork returns nil. Since nil is falsy
    it executes the code in the else block.


    **In the parent process** fork returns the pid of the newly created child process.
    Since an integer is truty it executes the code in the if block.


    This concept is illustrated nicely by simply printing the return value of a fork
    call.


    ```

    puts fork

    ```


    outputs


    ```

    21423

    nil

    ```


    Here we have the two different return values. The first value returned is the
    pid of the newly created child process; this comes from the parent. The second
    return value is the nil from the child process.'
  - '[PAGE 50]


    # # Multicore Programming?


    In a roundabout way, yes. By making new processes it means that your code is able,
    but not guaranteed, to be distributed across multiple CPU cores.


    Given a system with 4 CPUs, if you fork 4 new processes then can be handled each
    by a separate CPU, giving you multicore concurrency.


    However, there''s no guarantee that stuff will be happening in parallel. On a
    busy system it''s possible that all 4 of your processes are handled by the same
    CPU.


    > fork(2) creates a new process that''s a copy of the old process. So if a process
    is using 500MB of main memory, then it forks, now you have 1GB in main memory.


    Do this another ten times and you can quickly exhaust main memory. This is often
    called a fork bomb. Before you turn up the concurrency make sure that you know
    the consequences.


    # # Using a Block


    In the example above we''ve demonstrated fork with an if/else construct. It''s
    also possible, and more common in Ruby code, to use fork with a block.


    When you pass a block to the fork method that block will be executed in the new
    child process, while the parent process simply skips over it. The child process
    exits'
