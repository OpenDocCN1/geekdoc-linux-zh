    // It blew up time. So we can''t preserve the system default behaviour with this
    technique, but we can preserve other Ruby code handlers that have been defined.


    > In terms of best practices your code probably shouldn''t define any signal handlers,
    unless it''s a server. As in a long-running process that''s booted from the command
    line. It''s very rare that library code should trap a signal.


    ```

    # The ''friendly'' method of trapping a signal.


    old_handler = trap(:QUIT) {

    # do some cleanup

    puts ''All done!''


    old_handler.call if old_handler.respond_to?(:call)

    }

    ```


    This handler for the QUIT signal will preserve any previous QUIT handlers that
    have been defined. Though this looks ''friendly'' it''s not generally a good idea.
    Imagine a scenario where a Ruby server tells its users they can send a QUIT signal
    and it will do a graceful shutdown. You tell the users of your library that they
    can send a QUIT signal and it will draw an ASCII rainbow. If a user sends the
    QUIT signal both handlers will be invoked. This violates the expectations of both
    libraries.


    Whether or not you decide to preserve previously defined signal handlers is up
    to you, just make sure you know why you''re doing it. If you simply want to wire
    up some behaviour to clean up resources before exiting you can use an `at_exit`
    hook, which we touched on in the chapter about exit codes.'
  - '[PAGE 86]


    # # When Can''t You Receive Signals?


    Your process can receive a signal anytime. That''s the beauty of them! They’re
    asynchronous.


    Your process can be pulled out of a busy for-loop into a signal handler, or even
    out of a long sleep. Your process can even be pulled from one signal handler to
    another if it receives one signal while processing another. But, as expected,
    it will always go back and finish the code in all the handlers that are invoked.


    # # In the Real World


    With signals, any process can communicate with any other process on the system,
    so long as it knows its pid. This makes signals a very powerful communication
    tool. It’s common to send signals from the shell using kill(1).


    In the real world signals are mostly used by long running processes like servers
    and daemons. And for the most part it will be the human users who are sending
    signals rather than automated programs.


    For instance, the Unicorn web server responds to the INT signal by killing all
    of its processes and shutting down immediately. It responds to the USR signal
    by re-executing itself for a zero-downtime restart. It responds to the TTIN signal
    by incrementing the number of worker processes it has running.'
