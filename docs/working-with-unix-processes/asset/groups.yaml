    # Bumping the Soft Limit


    Let’s go ahead and bump the soft limit for the current process:


    ```

    Process.setrlimit(:NOFILE, 4096)

    p Process.getrlimit(:NOFILE)

    ```


    outputs:


    ```

    [4096, 4096]

    ```


    We can see that we set a new limit for the number of open files, and upon asking
    for that limit again both the hard limit and the soft limit were set to the new
    value 4096.


    We can optionally pass a third argument to Process.setrlimit specifying a new
    hard limit as well, assuming we have the permissions to do so. Note that lowering
    the hard limit, as we did in that last snippet, is irreversible: once it comes
    down it won’t go back up.


    The following example is a common way to raise the soft limit of a system resource
    to be equal with the hard limit, the maximum allowed value.


    ```

    Process.setrlimit(:NOFILE, Process.getrlimit(:NOFILE)[1]

    ```'
