  - '[PAGE 62]


    # Communicating with Process.wait2


    But wait! Process.wait has a cousin called Process.wait2!


    Why the name confusion? It makes sense once you know that Process.wait returns
    1 value (pid), but Process.wait2 returns 2 values (pid, status).


    This status can be used as communication between processes via exit codes. In
    our chapter on Exit Codes we mentioned that you can use exit codes to encode information
    for other processes. Process.wait2 gives you direct access to that information.


    The status returned from Process.wait2 is an instance of Process::Status. It has
    a lot of useful information attached to it for figuring out exactly how a process
    exited.'
  - "[PAGE 63]\n\n```\n# We create 5 child processes.\n5.times do\n  fork do\n   \
    \ # Each generates a random number. If even they exit\n    # with a 111 exit code,\
    \ otherwise they use a 112 exit code.\n    if rand(5).even?\n      exit 111\n\
    \    else\n      exit 112\n    end\nend\n5.times do\n  # We wait for each of the\
    \ child processes to exit.\n  pid, status = Process.wait2\n\n  # If the child\
    \ process exited with the 111 exit code\n  # then we know they encountered an\
    \ even number.\n  if status.exitstatus == 111\n    puts \"{pid}encountered an\
    \ even number!\"\n  else\n    puts \"{pid}encountered an odd number!\"\n  end\n\
    end\n```\n\nCommunication between processes without the filesystem or network!"
  - '[PAGE 64]


    # Waiting for Specific Children


    But wait! The Process.wait cousins have two more cousins. Process.waitpid and
    Process.waitpid2.


    You can probably guess what these do. They function the same as Process.wait and
    Process.wait2 except, rather than waiting for *any* child to exit they only wait
    for a specific child to exit, specified by pid.


    ```

    favourite = fork do

    exit 77

    end

    middle_child = fork do

    abort "I want to be waited on!"

    end

    npid, status = Process.waitpid2 favourite

    puts status.exitstatus

    ```


    Although it appears that Process.wait and Process.waitpid provide different behaviour
    won''t be fooled! They are actually aliased to the same thing. Both will accept
    the same arguments and behave the same.


    You can pass a pid to Process.wait in order to get it to wait for a specific child,
    and you can pass -1 as the pid to Process.waitpid to get it to wait for any child
    process.'
  - '[PAGE 65]


    The same is true for `Process.wait` and `Process.waitpid2`.


    Just like with `Process.pid` vs. $$ I think it''s important that, as programmers
    we use the provided tools to reveal our intent where possible. Although these
    methods are identical you should use `Process.wait` when you''re waiting for any
    child process and use `Process.waitpid` when you''re waiting for a specific process.


    # # Race Conditions


    As you look at these simple code examples you may start to wonder about race conditions.


    What if the code that handles one exited process is still running when another
    child process exits? What if I haven''t gotten back around to `Process.wait` and
    another process exits? Let''s see:'
  - "[PAGE 66]\n\n```\n# We create two child processes.\n2.times do\n  fork do\n \
    \   # Both processes exit immediately\n    abort \"Finished!\"\n  end\nend\n```\n\
    \n# The parent process waits for the first process, then sleeps for 5 seconds.\n\
    # In the meantime the second child process has exited and is no\n# longer running.\n\
    puts Process.wait\nsleep 5\n\n# The parent process asks to wait once again, and\
    \ amazingly enough, the\n# process' exit information has been queued up and is\
    \ returned here.\nputs Process.wait\n\nAs you can see this technique is free from\
    \ race conditions. The kernel queues\ninformation about exited processes so that\
    \ the parent always waits the information\nin the order that the children exited.\n\
    \nEven if the parent is slow at processing each exited child it will always be\
    \ able to get\nthe information for each exited child when it's ready for it.\n\
    \n> Take note that calling any variant of Process.wait when there are no child\n\
    processes will raise Errno::ECHILD. It's always a good idea to keep track of how\n\
    many child processes you have created so you don't encounter this exception."
  - '[PAGE 67]


    # In the Real World


    The idea of looking in your child processes is at the core of a common Unix programming
    pattern. The pattern is sometimes called babysitting processes, master/worker,
    or preforking.


    At the core of this pattern is the concept that you have one process that forks
    several child processes, for concurrency, and spends its time looking after them:
    making sure they are still responsive, reacting if any of them exit, etc.


    For example, the Unicorn web server ¹ employs this pattern. You tell it how many
    worker processes you want it to start up for 5 for instance.


    Then a `unicorn` process will boot up that `fork` 5 child processes to handle
    requests. The parent (or master) process maintains a heartbeat with each child
    and ensures that all of the child processes stay responsive.


    This pattern allows for both concurrency and reliability. Read more about Unicorn
    in its Appendix at the end of the book.


    For an alternative usage of this technique read through the Lookout class in the
    attached Spyglass project.


    # System Calls


    Ruby''s `Process.wait` and cousins map to waitpid(2).'
  - '[PAGE 68]


    # Zombie Processes


    At the beginning of the last chapter we looked at an example that used a child
    process to asynchronously handle a task in a fire and forget manner. We need to
    revisit that example and ensure that we clean up that child process appropriately,
    lest it become a zombie!


    # Good Things Come to Those Who wait(2)


    In the last chapter I showed that the kernel queues up status information about
    child processes that have exited. So even if you call `Process.wait` long after
    the child has exited its status information is still available. I''m sure you
    can smell a problem here...


    The kernel will retain the status of exited child processes until the parent process
    requests that status using `Process.wait`. If the parent never requests the status
    the kernel can never reap that status information. Creating fire and forget child
    processes without collecting their status information is a poor use of kernel
    resources.


    If you''re not going to wait for a child process to exit using `Process.wait`
    (or the technique described in the next chapter) then you need to ''detach'' that
    child process. Here''s the fire and forget example from last chapter rectified
    to properly detach the child process:'
