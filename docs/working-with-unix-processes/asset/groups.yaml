    $ nc localhost 8080

    $ telnet localhost 8080

    ```


    Notice that I snuck something new into that one? We haven''t seen Process.waitall
    yet, it appeared on the last line of the example code above.


    Process.waitall is simply a convenience method around Process.wait. It runs a
    loop waiting for all child processes to exit and returns array of process statuses.
    Useful when you don''t actually want to do anything with the process status info,
    it just waits for the children to exit.'
  - '[PAGE 140]


    # Appendix: Spyglass


    If you want to know even more about Unix processes then your next stop should
    be the included Spyglass project. Why? Because it was written specifically to
    showcase Unix programming concepts.


    > If you have a copy of this book but didn''t get the included code project, send
    me an email and I''ll hook you up: jesse@workingwithunixprocesses.com.


    The case studies you read are meant to showcase the same thing, but at times they
    can be dense and hard to read when you''re new to Unix programming. Spyglass is
    meant to bridge that gap.


    # Spyglass'' Architecture


    Spyglass is a web server. It opens a socket to the outside world and handles web
    requests. Spyglass parses HTTP, is Rack-compliant, and is awesome.


    Here''s a brief summary of how to start a Spyglass server and what happens when
    it receives an HTTP request.'
  - '[PAGE 141]


    # Booting Spyglass


    ```

    $ spyglass

    $ spyglass -p other_port

    $ spyglass -h # for help

    ```


    # Before a Request Arrives


    After it boots, control is passed to Spyglass::Lookout. This class DOES NOT preload
    the Rack application and knows nothing about HTTP, it just waits for a connection.
    At this point in time Spyglass is extremely lightweight, it''s nothing more than
    just an open socket.


    # Connection is Made


    When Spyglass::Lookout is notified that a connection has been made it forks Spyglass::Master
    to actually handle the connection. Spyglass::Lookout uses Process::wait after
    forking the master process, so it remains idle until the master exits.


    Syglass::Master is responsible for preloading the Rack application and forking/
    babysitting worker processes. The master process itself doesn''t know anything
    about HTTP parsing or request handling.


    The real work is done in Spyglass::Worker. It accepts connections using the method
    outlined in the chapter on prefetching, leaning on the kernel for load balancing.
    Once'
  - '[PAGE 142]


    it has a connection it parses the HTTP request, calls the Rack app, and writes
    the response to the client.


    # # Things Get Quiet


    So long as there is a steady flow of incoming traffic Spyglass continues to act
    as a prefetching server. If its internal timeout is able to expire without receiving
    any more incoming requests then the master process, and all its worker processes,
    exit. Control is returned to `Spyglass::Lookout` and the workflow begins again.


    # # Getting Started


    Spyglass is not a production-ready server, so don''t rush to start using it for
    your projects! It''s a codebase that''s meant to be read. It''s heavily commented
    and formatted documentation is generated with rocco ¹


    The best thing to do at this point is enter the `code` directory that comes with
    this book in your terminal, find the Spyglass codebase, and run `rake read`. This
    will open up the formatted documentation in your browser for your reading pleasure.


    Now go forth and read the code! And may the fork(2) be with you!'
  md: "\nGiven 10 unrelated processes that aren't sharing a socket each one must bind\
    \ to a unique port. Now a piece of infrastructure must sit in front of all of\
    \ the Mongrel processes. It must know which port each Mongrel processes is bound\
    \ to, and it must do the job of making sure that each Mongrel is handling only\
    \ one connection at a time and that connections are balanced properly.\n\nAgain,\
    \ preforking wins both for simplicity and resource efficiency.\n\n## 3. Efficient\
    \ sysadminning\n\nThis point is less technical, more human-centric.\n\nAs someone\
    \ administering a preforking server you typically only need to issue commands\
    \ (usually signals) to the master process. It will handle keeping track of and\
    \ relaying messages to its worker processes.\n\nWhen administering many instances\
    \ of a non-preforking server the sysadmin must keep track of each instance, administer\
    \ them separately and ensure that their commands are followed.\n\n## Basic Example\
    \ of a Preforking Server\n\nWhat follows is really basic code for a preforking\
    \ server. It can respond to requests in parallel using multiple processes and\
    \ will leverage the kernel for load balancing. For a more involved example of\
    \ a preforking server I suggest you check out the Spyglass source code (next chapter)\
    \ or the Unicorn source code.\n\n```ruby\nrequire 'socket'\n# Open a socket.\n\
    socket = TCPServer.open('0.0.0.0', 8080)\n\n# Preload app code.\n# require 'config/environment'\n\
    \n# Forward any relevant signals to the child processes.\n[:INT, :QUIT].each do\
    \ |signal|\n Signal.trap(signal) {\n  wpids.each { |wpid| Process.kill(signal,\
    \ wpid) }\n }\n}\n\n\n# For keeping track of child process pids.\n wpids = []\n\
    \n5.times {\n wpids << fork do\n  loop {\n   connection = socket.accept\n   connection.puts\
    \ 'Hello Readers!'\n   connection.close\n  }\n  }\n\nProcess.waitall\n```\n\n\
    You can consume it with something like nc(1) or telnet(1) to see it in action.\n\
    \n```bash\n$ nc localhost 8080\n$ telnet localhost 8080\n```\n\nNotice that I\
    \ snuck something new into that one? We haven't seen Process.waitall yet, it appeared\
    \ on the last line of the example code above.\n\nProcess.waitall is simply a convenience\
    \ method around Process.wait. It runs a loop waiting for all child processes to\
    \ exit and returns array of process statuses. Useful when you don't actually want\
    \ to do anything with the process status info, it just waits for the children\
    \ to exit.\n\n## Appendix: Spyglass\n\nIf you want to know even more about Unix\
    \ processes then your next stop should be the included Spyglass project. Why?\
    \ Because it was written specifically to showcase Unix programming concepts.\n\
    \n> If you have a copy of this book but didn't get the included code project,\
    \ send me an email and I'll hook you up: jesse@workingwithunixprocesses.com.\n\
    \nThe case studies you read are meant to showcase the same thing, but at times\
    \ they can be dense and hard to read when you're new to Unix programming. Spyglass\
    \ is meant to bridge that gap.\n\n## Spyglass' Architecture\n\nSpyglass is a web\
    \ server. It opens a socket to the outside world and handles web requests. Spyglass\
    \ parses HTTP, is Rack-compliant, and is awesome.\n\nHere's a brief summary of\
    \ how to start a Spyglass server and what happens when it receives an HTTP request.\n\
    \n## Booting Spyglass\n\n```bash\n$ spyglass\n$ spyglass -p other_port\n$ spyglass\
    \ -h # for help\n```\n\n## Before a Request Arrives\n\nAfter it boots, control\
    \ is passed to Spyglass::Lookout. This class DOES NOT preload the Rack application\
    \ and knows nothing about HTTP, it just waits for a connection. At this point\
    \ in time Spyglass is extremely lightweight, it's nothing more than just an open\
    \ socket.\n\n## Connection is Made\n\nWhen Spyglass::Lookout is notified that\
    \ a connection has been made it forks Spyglass::Master to actually handle the\
    \ connection. Spyglass::Lookout uses Process::wait after forking the master process,\
    \ so it remains idle until the master exits.\n\nSpyglass::Master is responsible\
    \ for preloading the Rack application and for forking/babysitting worker processes.\
    \ The master process itself doesn't know anything about HTTP parsing or request\
    \ handling.\n\nThe real work is done in Spyglass::Worker. It accepts connections\
    \ using the method outlined in the chapter on prefetching, leaning on the kernel\
    \ for load balancing. Once it has a connection it parses the HTTP request, calls\
    \ the Rack app, and writes the response to the client.\n\n## Things Get Quiet\n\
    \nSo long as there is a steady flow of incoming traffic Spyglass continues to\
    \ act as a prefetching server. If its internal timeout is able to expire without\
    \ receiving any more incoming requests then the master process, and all its worker\
    \ processes, exit. Control is returned to `Spyglass::Lookout` and the workflow\
    \ begins again.\n\n## Getting Started\n\nSpyglass is not a production-ready server,\
    \ so don't rush to start using it for your projects! It's a codebase that's meant\
    \ to be read. It's heavily commented and formatted documentation is generated\
    \ with rocco ¹\n\nThe best thing to do at this point is enter the `code` directory\
    \ that comes with this book in your terminal, find the Spyglass codebase, and\
    \ run `rake read`. This will open up the formatted documentation in your browser\
    \ for your reading pleasure.\n\nNow go forth and read the code! And may the fork(2)\
    \ be with you!\n"
  mdcn: "\n\n假设有10个互独立不共享套接字的进程，每个进程都必须绑定到一个唯一的端口。现在必须有一个基础设施运行在所有 Mongrel 进程之前。它必须知道每个\
    \ Mongrel 进程绑定到了哪个端口，并且必须确保每个 Mongrel 一时间只处理一个连接，并确保连接得到适当平衡。\n\n再次，预Fork（preforking）在简单性和资源效率方面都胜出。\n\
    \n## 3. 高效的系统管理\n\n这一点技术性较少，更多是是以人为本的。\n\n作为一个预分派服务器的管理员，你通常只需要向主进程发送命令（通常是信号）。它将负责跟踪并向其工作进程中送消息。\n\
    \n在管理多个非预分派服务器实例时，系统管理员必须跟踪每个实例，分别对它们进行管理，并确保它们的命令得到执行。\n\n## 预Fork服务器的基本示例\n\n\
    以下是预分派服务器的一个非常基础的代码。它可以使用多个进程并行响应请求，并利用内核进行负载均衡。如果需要更复杂的预分派服务器示例，我建议你查看 Spyglass\
    \ 的源代码（下一章）或 Unicorn 的源代码。\n\n```ruby\nrequire 'socket'\n# 打开一个套接字。\nsocket =\
    \ TCPServer.open('0.0.0.0', 8080)\n\n# 预加载应用代码。\n# require 'config/environment'\n\
    \n# 将任何相关信号传递给子进程。\n[:INT, :QUIT].each do |signal|\n Signal.trap(signal) {\n \
    \ wpids.each { |wpid| Process.kill(signal, wpid) }\n }\n}\n\n\n# 用于跟踪子进程 pid。\n\
    \ wpids = []\n\n5.times {\n wpids << fork do\n  loop {\n   connection = socket.accept\n\
    \   connection.puts 'Hello Readers!'\n   connection.close\n  }\n  }\n\nProcess.waitall\n\
    ```\n\n你可以使用类似 `nc(1)` 或 `telnet(1)` 的工具来查看它的效果。\n\n```bash\n$ nc localhost 8080\n\
    $ telnet localhost 8080\n```\n\n注意，我在代码里偷偷加入了一个新东西吗？我们还没有见过过 `Process.waitall`，它出现在上面示例代码的最后一行。\n\
    \n`Process.waitall` 仅仅是 `Process.wait` 封装的一个便利方法。它运行一个循环等待所有子进程退出，并返回一个进程状态数组。当你实际上不想对进程状态信息做任何处理时，它非常有用，只需等待子进程退出。\n\
    \n## 附录：Spyglass\n\n如果你想了解更多关于 Unix 进程的知识，那么下一个目标应该是包含的 Spyglass 项目。为什么？因为它是专门为了展示\
    \ Unix 编程概念而编写的。\n\n> 如果你有这本书的副本但没有获得附带的代码项目，请给我发邮件，我会提供给你的：jesse@workingwithunixprocesses.com。\n\
    \n你读到的案例旨在展示相同的内容，但当你刚开始学习 Unix 编程时，它们有时会非常晦涩且难以阅读。Spyglass 的目的是弥补这一差距。\n\n##\
    \ Spyglass 的架构\n\nSpyglass 是一个 Web 服务器。它向外部世界打开一个套接字并处理 Web 请求。Spyglass 解析 HTTP，符合\
    \ Rack 标准，并且非常棒。\n\n以下关于如何启动 Spyglass 服务器以及它在接收到 HTTP 请求会发生什么的简要总结。\n\n## 启动 Spyglass\n\
    \n```bash\n$ spyglass\n$ spyglass -p other_port\n$ spyglass -h # 用于帮助\n```\n\n\
    ## 请求到达之前\n\n启动后，控制权被移交给 `Spyglass::Lookout`。这个类**没有**预加载 Rack 应用，并且对 HTTP 一无所知，它只是在等待连接。在此时，Spyglass\
    \ 极其轻量，它仅仅是一个打开的套接字。\n\n## 连接建立\n\n当 `Spyglass::Lookout` 通知连接已建立时，它会 fork 出 `Spyglass::Master`\
    \ 来实际处理连接。`Spyglass::Lookout` 在 fork 主进程后使用 `Process::wait`，因此它在主进程退出之前一直保持空闲状态。\n\
    \n`Spyglass::Master` 负责预加载 Rack 应用以及 fork/监控工作进程。主进程本身对 HTTP 解析或请求处理一无所知。\n\n\
    真正的工作是在 `Spyglass::Worker` 中完成的。它使用预取章节中概述的方法接受连接，依靠内核进行负载均衡。一旦获得连接，它就会解析 HTTP\
    \ 请求，调用 Rack 应用，并将响应写入客户端。\n\n## 归于平静\n\n只要有稳定的入流量，Spyglass 就会继续作为预取服务器工作。如果它的内部超时在没有收到更多入请求的情况下到期，那么主进程及其所有工作进程将退出。控制权返回给\
    \ `Spyglass::Lookout`，工作流再次开始。\n\n## 开始上手\n\nSpyglass 不是一个生产就绪的服务器，所以不要急于在你的项目中使用它！它是为了阅读而编写的代码库。它有大量的注释，并使用\
    \ rocco ¹ 生成了格式化文档。\n\n此时最好的做法是在终端中进入随书提供的 `code` 目录，找到 Spyglass 代码库并运行 `rake\
    \ read`。这将在浏览器中打开格式化文档供你尽情阅读。\n\n现在去阅读代码吧！愿 `fork(2)` 与你同在！\n\n"
