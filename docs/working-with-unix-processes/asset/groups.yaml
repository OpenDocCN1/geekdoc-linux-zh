    # Chapter 10

    Processes Have Exit Codes


    When a process comes to an end it has one last chance to make its mark on the
    world: its exit code. Every process that exits so with a numeric code (0-255)
    denoting whether it exited successfully or with an error.


    Traditionally, a process that exits with **an exit code of o is said to be successful**.
    Any other exit code denotes an error, with different codes pointing to different
    errors.


    Though traditionally they''re used to denote different errors, they''re really
    just a channel for communication. All you need to do is handle the different exit
    codes that a process may exit with in a way that suits your program and you''ve
    gotten away from the traditions.


    It''s usually a good idea to stick with the ''o as success'' exit code tradition
    so that your programs will play nicely with other Unix tools.


    # How to Exit a Process


    There are several ways you can exit a process in Ruby, each for different purposes.


    exit


    The simplest way to exit a process is using `Kernel#exit`. This is also what happens
    implicitly when your script ends without an explicit exit statement.'
