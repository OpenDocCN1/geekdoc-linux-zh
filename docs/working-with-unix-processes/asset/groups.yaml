    Process: 10\nProcess: 9\nProcess: 8\nProcess: 7\nProcess: 6\nProcess: 5\nProcess:\
    \ 4\nProcess: 3\nProcess: 2\nProcess: 1\n```\n\nAs a fun exercise you can start\
    \ an irb session, print the pid, and change the process name. Then you can use\
    \ the ps(1) utility to see your changes reflected on the system.\n\n> Unfortunately\
    \ this global variable (and its mirror $0) is the only mechanism provided by Ruby\
    \ for this feature. There is not a more intent-revealing way to change the name\
    \ of the current process."
