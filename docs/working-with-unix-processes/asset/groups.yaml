    \n内核会保留退出子进程的状态，直到父进程使用 `Process.wait` 请求该状态。如果父进程从不请求状态，内核就永远无法回收这些状态信息。创建触发后不管的子进程而不收集其状态信息是对内核资源的资源的浪费。\n\
