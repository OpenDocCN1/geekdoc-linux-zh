    Every Unix process comes with three open resources. These are your standard input
    (STDIN), standard output (STDOUT), and standard error (STDERR).


    These standard resources exist for a very important reason that we take for granted.
    STDIN provides a generic way to read input from keyboard devices or pipes, STDOUT
    and STDERR provide generic ways to write output to monitors, etc. This was one
    of the innovations of Unix. Before STDIN existed your program had to include a
    keyboard driver for all the keyboards it wanted to support.


    ```ruby

    puts STDIN.fileno

    puts STDOUT.fileno

    puts STDERR.fileno

    ```


    outputs:


    ```

    0

    1

    2

    ```


    That''s where those first 3 file descriptor numbers went.


