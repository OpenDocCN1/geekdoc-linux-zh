    # Daemon Processes


    Daemon processes are processes that run in the background, rather than under the
    control of a user at a terminal. Common examples of daemon processes are things
    like web servers, or database servers which will always be running in the background
    order to serve requests.


    Daemon processes are also at the core of your operating system. There are many
    processes that are constantly running in the background that keep your system
    functioning normally. These are things like the window server on a GUI system,
    printing services or audio services so that your speakers are always ready to
    play that annoying ''ding'' notification.


    # The First Process


    There is one daemon process in particular that has special significance for your
    operating system. We talked in a previous chapter about every process having a
    parent process. Can that be true for all processes? What about the very first
    process on the system?


    This is a classic who-created-the-creator kind of problem, and it has a simple
    answer. When the kernel is bootstrapped it spawns a process called the `init`
    process. This process has a ppid of 0 and is the ''grandparent of all processes''.
    It''s the first one and it has no ancestor. Its pid is 1.'
