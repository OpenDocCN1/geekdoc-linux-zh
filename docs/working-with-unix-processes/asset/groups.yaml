    ["foo", "bar", "-va"]

    ```


    # It''s an Array!


    Unlike the previous chapter, where we learned ENV isn''t a Hash, ARGV is simply
    an Array. You can add elements to it, remove elements from it, change the elements
    it contains, whatever you like. But if it simply represents the arguments passed
    in on the command line why would you need to change anything?


    Some libraries will read from ARGV to parse command line options, for example.
    can programmatically change ARGV before they have a chance to see it in order
    to modify the options at runtime.'
