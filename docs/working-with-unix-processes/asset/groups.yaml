  mdcn: "\n\n[content]\n\n# 第 9 章\n\n## 进程具有名称\n\nUnix 进程通信其状态的固有方式非常少。\n\n程序员们一直在回避这个问题，并发明了日志文件（logfiles）等工具。日志文件允许进程通过写入文件系统来通信关于状态的任何信息，但这种操作是在文件系统层面的，而不是进程固有的。\n\
    \n同样，进程可以使用网络打开 socket 并与其他进程进行通信。但同样，这在与进程本身不同的层面运行，因为它依赖于网络。\n\n有两种机制可以在进程本身层级运行并用于通信信息。其中一个是进程名称，另一个是退出状态码（exit\
    \ codes）。\n\n## 命名进程\n\n系统上的每个进程都有一个名称。例如，当你启动一个 irb 会话时，该进程被命名为 'irb'。进程名称的妙之处在于，它们可以在运行时更改，并作为一种通信手段。\n\
    \n在 Ruby 中，你可以通过 `$PROGRAM_NAME` 变量访问当前进程的名称。同样，你也可以给该全局变量赋值来更改当前进程的名称。\n\n作为一个有趣的练习，你可以启动一个\
    \ irb 会话，打印 pid，并更改名称。然后你可以使用 `ps` 工具查看系统上反映的更改。遗憾的是，这个全局变量（及其默认值 0）是 Ruby 为此功能提供的唯一机制。没有其他方法可以更改当前进程的名称。\n\
    \n```ruby\n10.downto(1) do |num|\n  $PROGRAM_NAME = \"Process: #{num}\"\n  puts\
    \ $PROGRAM_NAME\nend\n```\n\n输出：\n\n```\nProcess: 10\nProcess: 9\nProcess: 8\n\
    Process: 7\nProcess: 6\nProcess: 5\nProcess: 4\nProcess: 3\nProcess: 2\nProcess:\
    \ 1\n```\n\n## 在现实世界中\n\n要查看在实际项目中如何使用此点的示例，请阅读附录中的《进程如何管理》。\n\n# 第 10 章\n\n##\
    \ 进程具有退出状态码\n\n当一个进程结束时，它有最后一个机会在世界上留下印记：那就是它的退出状态码。每个进程退出时的代码（0-255）表示它是成功退出还是带错误退出。传统上，退出状态码为\
    \ 0 的进程被认为是成功的。任何其他退出状态码都表示错误。尽管传统上它们被用来表示错误，但它们实际上只是一个通信通道。你需要做的就是处理退出状态码，以便你的程序能与\
    \ Unix 工具良好地协作。\n\n## 如何退出进程\n\n在 Ruby 中有几种退出进程的方法，每种都有不同的目的。\n\n退出进程简单的方法是使用\
    \ `Kernel#exit`。当你的脚本在没有显式退出语句的情况下结束时，也会发生这种情况。\n\n```ruby\n# 这将以成功状态 (0) 退出程序。\n\
    exit\n```\n\n```ruby\n# 你可以向此方法传递一个自定义的退出状态码\nexit 2\n```\n\n```ruby\n# 当调用 Kernel#exit\
    \ 时，在退出之前 Ruby 会调用任何由 at_exit 定义的块\nat_exit { puts 'Last!' }\nexit\n```\n\n将输出：\n\
    \n```\nLast!\n```\n\nexit!\n\nKernel#exit! 与 Kernel#exit 几乎完全相同，但有两个关键区别。第一个是它默认设置一个不失败的状态码（1），第二个是它不会调用任何使用\
    \ at_exit 定义的块。\n\n```ruby\n# 这将以状态码 1 退出程序。\nexit!\n```\n\n```ruby\n# 你仍然可以传递一个退出状态码。\n\
    exit! 3\n```\n\n```ruby\n# 这个块将永远不会被调用。\nat_exit { puts 'Silence!' }\nexit!\n\
    ```\n\nabort\n\nKernel#abort 提供了一种不失败退出进程的通用方法。Kernel#abort 会将当前进程的退出状态码设置为 1。\n\
    \n```ruby\n# 将以状态码 1 退出。\nabort\n```\n\n```ruby\n# 你可以向 Kernel#abort 传递消息。此消息将在进程退出前打印到\
    \ STDERR。\nabort \"Something went horribly wrong.\"\n```\n\n```ruby\n# 使用 Kernel#abort\
    \ 时会调用 Kernel#at_exit 块。\nat_exit { puts 'Last!' }\nabort \"Something went horribly\
    \ wrong.\"\n```\n\n将输出：\n\n## raise\n\n结束进程的另一种方法是使用未处理的异常。这是你永远不希望在生产环境中发生的，但在开发和测试环境中几乎总是发生的。\n\
    \n注意，Kernel#raise 与之前的方法不同，它不会立即退出进程。它只是抛出一个异常，该异常可能会在栈上被捕获。如果异常在代码库的任何地方都没有被捕获，那么未处理的异常将导致进程退出。这种方式结束进程仍然会调用任何\
    \ at_exit 处理器，并将异常消息和回溯跟踪打印到 STDERR。\n\n```ruby\n# 与 abort 类似，未处理的异常会将退出状态码设置为\
    \ 1。\nraise 'hell'\n```\n\n## 进程可以 fork\n\n### 使用 fork(2)，Luke\n\nFork（分叉）是 Unix\
    \ 编程中最强大的概念之一。fork(2) 系统调用允许运行中的进程程序化地创建新进程。这个新进程是原始进程的精确副本。\n\n到为止，我们讨论的是如何通过终端启动进程来创建进程。我们还提到了创建其他进程的低级操作系统进程：fork(2)\
    \ 就是它们这样做的方法。\n\n在 forking 时，发起 fork(2) 的进程被称为“父进程”，新创建的进程被称为“子进程”。\n\n子进程继承父进程使用的所有内存的副本，以及属于父进程的任何打开的文件描述符。让我们花一点时间从前三章的角度回顾子进程。\n\
    \n由于子进程是一个全新的进程，它有它自己的 pid。\n\n子进程继承父进程使用的所有内存的副本，以及属于父进程的任何打开的文件描述符。通过这种方式，两个进程可以共享文件、socket\
    \ 等。子进程继承父进程在 fork 时所拥的所有内容的副本。通过这种方式，进程可以 fork 一个大型代码库，比如一个 Rails 应用，它占用了 500MB\
    \ 的内存。然后这个进程可以 fork 2 个新进程。这些子进程中的每个实际上都有它们自己的 500MB 内存。这对于当你想要加载多个应用程序实例时非常完美。因为只需要一个进程加载应用，而且\
    \ forking 是快速的，这种方法比在单独实例中加载 3 次应用要快。\n\n子进程可以自由修改它们的内存副本而不影响父进程在内存中的内容。请看下一章关于写时复制（copy-on-write）以及它在\
    \ forking 时如何影响内存的讨论。\n\n让我们通过一个令人头脑的示例开始在 Ruby 中学习 fork：\n\n```ruby\nif fork\n\
    \  puts \"entered the if block\"\nelse\n  puts \"entered the else block\"\nend\n\
    ```\n\n输出：\n\n```\nentered the if block\nentered the else block\n```\n\nWTF！这里发生了什么？fork\
    \ 方法的调用将曾经熟悉的结构颠倒了。这段代码竟然同时进入了 if 结构的 if 和 else 块！\n\n这里发生的事情并不神秘。一次 fork 方法调用实际上返回了两次。记住\
    \ fork 创建了一个新进程。因此它在调用进程（父进程）中返回一次，在新创建的进程（子进程）中返回一次。\n\n如果我们打印出来，最后一个示例就变得更加明显了。\n\
    \n```ruby\nputs \"parent process pid is #{Process.pid}\"\n\nif fork\n  puts \"\
    entered the if block from #{Process.pid}\"\nelse\n  puts \"entered the else block\
    \ from #{Process.pid}\"\n\nend\n```\n\n输出：\n\n```\nparent process pid is 21268\n\
    entered the if block from 21268\nentered the else block from 21282\n```\n\n[/content]\n"
