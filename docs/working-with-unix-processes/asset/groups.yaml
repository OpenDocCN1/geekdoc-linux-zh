  - '[PAGE 128]


    in an endless loop we''ll need a hard `return` or a `break` in order to finish
    this method.


    ```

    wpid, status = Process.waitpid(-1, Process::WNOHANG)

    ```


    This line should have some familiarity. We looked at `Process.waitpid2` in the
    chapter on `Process.wait`, and we always passed in a pid as the first option and
    never passed anything as the second option.


    So we saw that passing a valid pid as the first option would cause the `Process.waitpid`
    call to wait only for that pid. What happens when you pass `-1` to `Process.waitpid`?
    We know that there are no processes with a pid less than 1, so...


    Passing `-1` waits for any child process to exit. It turns out that this is the
    default option to that method. If you don''t specify a pid then it uses `-1` by
    default. In case, since the author needed to pass something in the second argument,
    the first argument couldn''t be blank, so it was set to the default.


    Hey, if you''re waiting on any child process why not use `Process.wait2` then?
    I suspect the author decided here, and I agree with him, that it was most readable
    to use a `waitpid` variation when specifying a value for the pid. As mentioned
    above the value specified is simply the default, but nonetheless it''s most salient
    to use `waitpid` if you''re specifying any value for the pid.


    The second argument is for special flags. Passing `Process::WNOHANG` causes this
    normally blocking call to become a non-blocking call. When using this flag if
    there are no processes that have exited for us then it will not block and simply
    return nil.'
