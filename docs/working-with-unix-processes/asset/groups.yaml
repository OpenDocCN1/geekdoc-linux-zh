  - '[PAGE 53]


    If you run this program from a terminal you''ll notice that since the parent process
    dies immediately the terminal returns you to the command prompt. At which point,
    it''s overwritten by the `STDOUT` from the child process! Strange things can start
    to happen when forking processes.


    # Abandoned Children


    What happens to a child process when its parent dies?


    The short answer is, *nothing*. That is to say, the operating system doesn''t
    treat child processes any differently than any other processes. So, when the parent
    process dies the child process continues on; the parent process does not take
    the child down with it.


    # Managing Orphans


    Can you still manage orphaned processes?


    We''re getting a bit ahead of ourselves with this question, but it touches on
    two interesting concepts.


    The first thing is called daemon processes. Daemon processes are long running
    processes that are intentionally orphaned and meant to stay running forever. These
    are covered in detail in a later chapter.'
  - '[PAGE 54]


    The second interesting bit here is communicating with processes that are not attached
    to a terminal session. You can do this using something called Unix signals. This
    is also covered in more detail in a later chapter.


    We''ll soon talk about how to properly manage and control child processes.'
  - '[PAGE 55]


    # Processes Are Friendly


    Let''s take a step back from looking at code for a minute to talk about a higher
    level concept and how it''s handled in different Ruby implementations.


    # Being CoW Friendly


    As mentioned in the forking chapter, fork(2) creates a new child process that''s
    an exact copy of the parent process. This includes a copy of everything the parent
    process has in memory.


    Physically copying all of that data can be considerable overhead, so modern Unix
    systems employ something called copy-on-write semantics (CoW) to combat this.


    As you may have guessed from the name, CoW delays the actual copying of data until
    it needs to be written.


    So a parent process and a child process will actually share the same physical
    data in memory until one of them needs to modify it, at which point the memory
    will be copied so that proper separation between the two processes can be preserved.'
  - "[PAGE 56]\n\n```\narr = [1,2,3]\n\nfork do\n# At this point the child process\
    \ has been initialized.\n# Using CoW this process doesn't need to copy the arr\
    \ variable,\n# since it hasn't modified any shared values it can continue running\n\
    # from the same memory location as the parent process.\n  arr\nend\n```\n\n```\n\
    arr = [1,2,3]\n\nfork do\n# At this point the child process has been initialized.\n\
    # Because of CoW the arr variable hasn't been copied yet.\narrr << 4\n# The above\
    \ line of code modifies the array, so a copy of\n# the array will need to be made\
    \ for this process before\n# it can modify it. The array in the parent process\
    \ remains\n# unchanged.\nend\n```\n\nThis is a big win when using fork(2) as it\
    \ saves on resources. It means that fork(2) is fast since it doesn't need to copy\
    \ any of the physical memory of the parent. It also means that child processes\
    \ only get a copy of the data they need, the rest can be shared.\n\nCoW is great,\
    \ but unfortunately it's not supported in MRI or Rubinius."
  - '[PAGE 57]


    In order for CoW to work properly programs need to be written in a CoW friendly
    manner. In other words, they need to manage memory in a way that makes CoW possible.
    MRI and Rubinius are not written in this way.


    # Why not?


    MRI''s garbage collector uses a ''mark-and-sweep'' algorithm. In a nutshell this
    means when the GC is invoked it must iterate over every known object and write
    to it, either saying it should be garbage collected or it shouldn''t. The important
    point here is that every time the GC runs every object in memory is written to.


    So, after forking, the first time that the GC runs will retract the benefit that
    copy-on-write provides.


    This is one of the main reasons why Ruby Enterprise Edition was created. *ree
    is CoW friendly*. For a deeper look at this issue and how Ruby Enterprise Edition
    solves it check out their Google Tech Talk: Building a More Efficient Ruby Interpreter.


    # MRI / RBX users


    What does this mean for users of other Ruby VMs?


    > 1.http://www.rubyenterpriseedition.com/

    2.http://www.youtube.com/watch?v=ghLctCwAKwQQ'
  - '[PAGE 58]


    Simply, when forking processes you will not reap the benefits of CoW. Child processes
    will require a complete copy of the memory owned by the calling process.


    If you''re building something that will depend heavily on fork(2) then have a
    serious look at Ruby Enterprise Edition. Looking ahead to the future, MRI trunk
    now has patches 3 that make the GC CoW-friendly. So the 2.0 release of Ruby will
    ship with a CoW-friendly GC!


    3.http://bugs.ruby-lang.org/issues/5839'
