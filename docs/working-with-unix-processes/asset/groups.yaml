- raw:
  - '[PAGE 137]


    Given 10 unrelated processes that aren''t sharing a socket each one must bind
    to a unique port. Now a piece of infrastructure must sit in front of all of the
    Mongrel processes. It must know which port each Mongrel processes is bound to,
    and it must do the job of making sure that each Mongrel is handling only one connection
    at a time and that connections are balanced properly.


    Again, preforking wins both for simplicity and resource efficiency.


    # 3. Efficient sysadminning


    This point is less technical, more human-centric.


    As someone administering a preforking server you typically only need to issue
    commands (usually signals) to the master process. It will handle keeping track
    of and relaying messages to its worker processes.


    When administering many instances of a non-preforking server the sysadmin must
    keep track of each instance, administer them separately and ensure that their
    commands are followed.


    # Basic Example of a Preforking Server


    What follows is really basic code for a preforking server. It can respond to requests
    in parallel using multiple processes and will leverage the kernel for load balancing.
    For a more involved example of a preforking server I suggest you check out the
    Spyglass source code (next chapter) or the Unicorn source code.'
  - "[PAGE 138]\n\n```\nrequire 'socket'\n# Open a socket.\nsocket = TCPServer.open('0.0.0.0',\
    \ 8080)\n\n# Preload app code.\n# require 'config/environment'\n\n# Forward any\
    \ relevant signals to the child processes.\n[:INT, :QUIT].each do |signal|\n Signal.trap(signal)\
    \ {\n wpids.each { |wpid| Process.kill(signal, wpid) }\n }\n\n\n# For keeping\
    \ track of child process pids.\n wpids = []\n\n5.times {\n wpids << fork do\n\
    \ loop {\n connection = socket.accept\n connection.puts 'Hello Readers!'\n connection.close\n\
    \ }\\n}\n\nProcess.waitall\n```\n\nYou can consume it with something like nc(1)\
    \ or telnet(1) to see it in action."
