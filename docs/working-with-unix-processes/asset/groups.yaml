    \ `status` 对象上的 `success?` 方法将此消息记录为 INFO 级别或 ERROR 级别。\n\n`success?` 方法只在一种情况下返回\
    \ `true`，即进程以退出代码 0 退出。如果以不同的代码退出，它将返回 `false`。如果被信号杀死，它将返回 `nil`。\n\n```ruby\n\
    rescue Errno::ECHILD\n  break\n```\n\n这是此方法中顶层 `begin` 语句的一部分。如果抛出此异常，此方法的无限循环将执行\
    \ `break` 并返回。\n\n如果当前进程没有子进程，`Process.waitpid2`（或任何类似的方法）将抛出 `Errno::ECHILD`\
    \ 异常。如果在这种情况下发生这种情况，意味着此方法的任务完成了！所有子进程都已收割（reaped）。因此它返回。\n\n# 结论\n\n这段代码对你产生了兴趣，如果你想学习更多关于\
    \ Ruby 中的 Unix 编程，Unicorn 是一个很棒的资源。访问官网 http://unicorn.bogomips.org 去学习吧！\n\n\
    # 附录：预分服务器\n\n我很高兴你读到了这里，因为这一章可能是整书中内容最丰富的内容。预分服务器将书中解释的许多概念整合成一种强大且高效的方法，来解决某些特定问题。\n\
    \n你很有可能用过 Phusion Passenger¹ 或 Unicorn²。这两者服务器，以及 Spyglass（本文包含的 Web 服务器）-\n\n"
