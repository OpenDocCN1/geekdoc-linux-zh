  mdcn: "\n\n# 第 17 章\n进程可以进行通信\n\n到目前为止，我们查看了共享内存和共享开放资源的相关进程。但在多个进程之间如何传递信息呢？\n\n\
    这是一个名为“进程间通信”（Inter-process communication，简称 IPC）的整个领域。实现 IPC 有许多不同的方法，但我将介绍两种常用的实用方法：管道（pipes）和套接字对（socket\
    \ pairs）。\n\n## 我们的第一个管道\n\n管道是一个单向的数据流。换句话说，你可以打开一个管道，一个进程可以“占用”其中一端，另一个进程可以“占用”另一端。然后数据就可以沿着管道传递，但只能向一个方向。因此，如果一个进程“占用”了读取者而非写入者的位置，它将无法向管道写入数据。反之亦然。\n\
    \n在引入多个进程之前，让我们先看看如何创建一个管道以及我们从中得到什么：\n\n```ruby\nreader, writer = IO.pipe =>\
    \ [#<IO:fd 5>, <IO:fd 6>]\n```\n\nIO.pipe 返回一个包含两个元素的数组，这两个元素都是 IO 对象。Ruby 极其强大的\
    \ IO 类是 `File`、`TCPSocket`、`UDPSocket` 等类的父类。因此，所有这些资源都有共同的接口。\n\nIO.pipe 返回的\
    \ IO 对象可以被视为匿名文件。你基本上可以像构建 `File` 一样对待它们。你可以调用 `#read`、`#write`、`#close` 等。但该对象不会响应\
    \ `#path` 方法，且在文件系统中没有位置。\n\n在暂不引入多个进程的情况下，让我们演示使用管道进行通信：\n\n```ruby\nreader,\
    \ writer = IO.pipe\nwriter.write(\"Into the pipe I go...\")\nwriter.close\nputs\
    \ reader.read\n```\n\n输出\n\n```\nInto the pipe I go...\n```\n\n非常简单对吧？注意到我在向管道写入数据后必须关闭写入者了吗？这是因为当读取者调用\
    \ `IO#read` 时，它将继续读取数据，直到看到 EOF（即文件结束标记符）。这告诉读取者将不再有更多数据可供读取。\n\n只要写入者仍打开状态，读取者就可能看到更多数据，因此它会一直等待。通过在读取之前关闭写入者，可以在管道上放置一个\
    \ EOF，这样读取者在获取初始数据后就会停止。如果你跳过关闭写入者的步骤，读取者将阻塞并无限读取下去。\n\n1. http://libreflist.com/browser/usp.ruby/2011/9/17/the-ruby-io-class/\n\
    2. http://en.wikipedia.org/wiki/End-of-file\n\n## 管道仅单向\n\n```ruby\nreader, writer\
    \ = IO.pipe\nreader.write(\"Trying to get the reader to write something\")\n```\n\
    \n输出\n\n```\n>> reader.write(\"Trying to get the reader to write something\")\n\
    IOError: not opened for writing\n  from (irb):2:in `'write'\n  from (irb):2\n\
    ```\n\nIO.pipe 返回的 IO 对象只能用于单向通信。因此，读取者只能读取，写入者只能写入。\n\n让我们把进程引入进来。\n\n## 共享管道\n\
    \n在关于 fork（派生）的章节中，我描述了当进程派生子进程时开放资源是如何共享或复制的。管道被视为一种资源，它们有自己的文件描述符等，因此它们会与子进程共享。\n\
    \n这里有一个使用管道在父进程和子进程之间进行通信的简单示例。子进程通过向管道写入数据向父进程指示它已完成了一次迭代：\n\n```ruby\nreader,\
    \ writer = IO.pipe\n\nfork do\n  reader.close\n\n  10.times do\n    # 重负载操作\n\
    \    writer.puts \"Another one bites the dust\"\n  end\nend\n\nwriter.close\n\
    while message = reader.gets\n  $stdout.puts message\nend\n```\n\n输出 Another one\
    \ bites the dust 十次。\n\n注意到，像上面一样，管道未使用的端被关闭了，以防干扰 EOF 的发送。当涉及到两个进程时，考虑 EOF 实际上还有多一层。由于文件描述符被复制了，现在有\
    \ 4 个实例在运行。由于只有其中 2 个将用于通信，另外 2 个实例必须关闭。这就是为什么有额外的关闭操作。\n\n由于管道的两端是 IO 对象，我们可以在它们上调用任何\
    \ IO 方法，而不仅仅是 `#read` 和 `#write`。在这个示例中，我使用 `#puts` 和 `#gets` 来读取和写入以换行符分隔的字符串。我实际上在这里使用这些方法是为了简化管道的一个方面：管道持有数据流。\n\
    \n## 流 vs 消息\n\n当我说“流”（stream）时，我的意思是向管道写入和读取数据时，没有开始和结束的概念。在处理 IO 流（如管道或 TCP\
    \ 套接字）时，你将数据写入流中，并跟上某些特定特定的分隔符。例如，HTTP 使用一系列换行符来分隔头部和正文。\n\n然后当从该 IO 流中读取数据时，你一次读取一个块，遇到分隔符时停止。这就是为什么我在上一个示例中使用了\
    \ `#puts` 和 `#gets`：它为我使用了换行符作为分隔符。\n\n正如你可能猜到的，使用消息（messages）而不是流进行通信是可能的。我们无法通过管道做到，但可以通过\
    \ Unix 套接字做到。在不涉及过过多细节的情况下，Unix 套接字是一种只能在同一台物理机器上通信的套接字。因此，它比 TCP 套接字快得多，非常适合\
    \ IPC。\n\n这里有一个创建一个 Unix 套接字对的示例，它们通过消息通信：\n\n```ruby\nrequire 'socket'\nSocket.pair(:UNIX,\
    \ :DGRAM, 0) => [#<Socket:fd 15>, #<Socket:fd 16>]\n```\n\n这创建了一对 Unix 套接字，它们已经连接在一起。这些套接字使用数据报（datagrams）而不是流。通过这种方式，你向一个套接字写入完整消息，从另一个套接字读取完整消息。不需要分隔符。\n\
    \n这是一个稍微复杂的管道示例，其中子进程等待父进程告诉它要做什么，然后在完成完成后向父进程报告：\n\n```ruby\nrequire 'socket'\n\
    \nchild_socket, parent_socket = Socket.pair(UNIX, DGRAM, 0)\nmaxlen = 1000\n\n\
    fork do\n  parent_socket.close\n\n  4.times do\n    instruction = child_socket.recv(maxlen)\n\
    \    child_socket.send(\"#{instruction} accomplished!\", 0)\n  end\nchild_socket.close\n\
    \n2.times do\n  parent_socket.send(\"Heavy lifting\", 0)\nend\n2.times do\n  parent_socket.send(\"\
    Feather lifting\", 0)\nend\n\n4.times do\n  $stdout.puts parent_socket.recv(maxlen)\n\
    end\n```\n\n输出\n\n```\nHeavy lifting accomplished!\nHeavy lifting accomplished!\n\
    Feather lifting accomplished!\nFeather lifting accomplished!\n```\n\n因此，虽然管道提供单向通信，但套接字对提供了双向通信。父套接字可以同时读取和写入子套接字，反之亦然。\n\
    \n## 远程 IPC？\n\nIPC 指运行在同一机器上的进程之间的通信。如果你对从一台机器扩展到许多机器并进行类似于 IPC 操作感兴趣，有一些东西可以研究。第一种方案只需通过\
