    # # Where do Signals Come From?


    Technically signals are sent by the kernel, just like text messages are sent by
    a cell phone carrier. But text messages have an original sender, and so do signals.
    Signals are sent from one process to another process, using the kernel as a middleman.


    The original purpose of signals was to specify different ways that a process should
    be killed. Let''s start there.


