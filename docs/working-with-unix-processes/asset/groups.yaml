    Processes Can Communicate


    Up until now we''ve looked at related processes that share memory and share open
    resources. But what about communicating information between multiple processes?


    This is part of a whole field of study called Inter-process communication (IPC
    for short). There are many different ways to do IPC but I''m going to cover two
    commonly useful method: pipes and socket pairs.


    # ## Our First Pipe


    A pipe is a uni-directional stream of data. In other words you can open a pipe,
    one process can ''claim'' one end of it and another process can ''claim'' the
    other end. Then data can be passed along the pipe but only in one direction. So
    if one process ''claims'' the position of reader, rather than writer, it will
    not be able to write to the pipe. And vice-versa.


    Before we involve multiple processes let''s just look at how to create a pipe
    and what we get from that:


    ```

    reader, writer = IO.pipe => [#<IO:fd 5>, <IO:fd 6>]

    ```


    IO.pipe returns an array with two elements, both of which are IO objects. Ruby''s
    amazing IO class is the superclass to File, TCPSocket, UDPSocket, and others.
    As such, all of these resources have a common interface.'
  - '[PAGE 89]


    The IO objects returned from IO.pipe can be thought of something like anonymous
    files. You can basically treat them the same way you would build a File. You can
    call #read, #write, #close, etc. But this object won''t respond to #path and won''t
    have a location on the filesystem.


    Still holding back from bringing in multiple processes let''s demonstrate communication
    with a pipe:


    ```

    reader, writer = IO.pipe

    writer.write("Into the pipe I go...")

    writer.close

    puts reader.read

    ```


    outputs


    ```

    Into the pipe I go...

    ```


    Pretty simple right? Notice that I had to close the writer after I wrote to the
    pipe? That''s because when the reader calls IO#read it will continue to read data
    until it sees EOF (aka. end-of-file marker ²). This tells the reader that no more
    data will be available for reading.


    So long as the writer is still open the reader might see more data, so it waits.
    By closing the writer before reading it puts an EOF on the pipe so the reader
    stops after it gets the initial data. If you skip closing the writer then the
    reader will block and continue reading indefinitely.


    +   1.http://libreflist.com/browser/usp.ruby/2011/9/17/the-ruby-io-class/

    2.http://en.wikipedia.org/wiki/End-of-file'
