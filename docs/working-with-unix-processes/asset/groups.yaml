  - '[PAGE 92]


    # Streams vs. Messages


    When I say stream I mean that when writing and reading data to a pipe there''s
    no concept of beginning and end. When working with an IO stream, like pipes or
    TCP sockets, you write your data to the stream followed by some protocol-specific
    delimiter. For example, HTTP uses a series of newlines to delimit the headers
    from the body.


    Then when reading data from that IO stream you read it in one chunk at a time,
    stopping when you come across the delimiter. That''s why I used #puts and #gets
    in the last example: it used a newline as the delimiter for me.


    As you may have guessed it''s possible to communicate with messages instead of
    streams. We can''t do it with pipe, but we can do it with Unix sockets. Without
    going into too much detail, Unix sockets are a type of socket that can only communicate
    on the same physical machine. As such it''s much faster than TCP sockets and is
    a great fit for IPC.


    Here''s an example where we create a pair of Unix sockets that can communicate
    via messages:


    ```

    require ''socket''

    Socket.pair(:UNIX, :DGRAM, 0) => [#<Socket:fd 15>, #<Socket:fd 16>]

    ```


    This creates a pair of UNIX sockets these sockets are already connected up to
    each other. These sockets communicate using datagrams, rather than a stream. In
    this way you write a whole message to one of the sockets and read a whole message
    from the other socket. No delimiters required.'
  - "[PAGE 93]\n\nHere's a slightly more complex version of the pipe example where\
    \ the child process actually waits for the parent to tell it what to work on,\
    \ then it reports back to the parent once it's finished the work:\n\n```\nrequire\
    \ 'socket'\n\nchild_socket, parent_socket = Socket.pair(UNIX, DGRAM, 0)\nmaxlen\
    \ = 1000\n\nfork do\n  parent_socket.close\n\n4.times do\n  instruction = child_socket.recv(maxlen)\n\
    \  child_socket.send(\"#{instruction} accomplished!\", 0)\nend\nchild_socket.close\n\
    \n2.times do\n  parent_socket.send(\"Heavy lifting\", 0)\nend\n2.times do\n  parent_socket.send(\"\
    Feather lifting\", 0)\nend\n\n4.times do\n  $stdout.puts parent_socket.recv(maxlen)\n\
    end\n```\n\noutputs:"
  - '[PAGE 94]


    ```

    Heavy lifting accomplished!

    Heavy lifting accomplished!

    Feather lifting accomplished!

    Feather lifting accomplished!

    ```


    So whereas pipes provide uni-directional communication, a socket pair provides
    bi-directional communication. The parent socket can both read and write to the
    child socket, and vice versa.


    # Remote IPC?


    IPC implies communication between processes running on the same machine. If you''re
    interested in scaling up from one machine to many machines while still doing something
    resembling IPC there are a few things to look into. The first one would simply
    be to communicate via TCP sockets. This option would require more boilerplate
    code than the others for a non-trivial system. Other plausible solutions would
    be RPC ³ (remote procedure call), a messaging system like ZeroMQ ⁴ or the general
    body of distributed systems.


    # In the Real World


    Both pipes and socket pairs are useful abstractions for communicating between
    processes. They''re fast and easy. They''re often used as a communication channel
    instead of a brute force approach such as a shared database or log file.


    +   ³http://en.wikipedia.org/wiki/Remote_procedure_call

    ⁴http://www.zermq.org/

    ⁵http://en.wikipedia.org/wiki/Distributed_computing'
  - '[PAGE 95]


    As for which method to use: it depends on your needs. Keep in mind that pipes
    are uni-directional and socket pairs are bi-directional when weighing your decision.


    For a more in-depth example have a look at the Spyglass Master class in the included
    Spyglass project. It uses a more involved example of the code you saw above where
    many child processes communicate over a single pipe with their parent process.


    # System Calls


    Ruby’s `IO.pipe` maps to pipe(2), `Socket.pair` maps to socketpair(2). `Socket.recv`
    maps to recv(2) and `Socket.send` maps to send(2).'
