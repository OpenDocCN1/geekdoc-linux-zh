    \ same code path as the parent.\n\n```\nfork do\n  # Code here is only executed\
    \ in the child process\nend\n\n  # Code here is only executed in the parent process.\n\
    ```\n\n# In the Real World\n\nHave a look at either of the appendices, or the\
    \ attached Spyglass project, to see some real-world examples of using fork(2).\n\
    \n# System Calls\n\nRuby’s Kernel#fork maps to fork(2)."
