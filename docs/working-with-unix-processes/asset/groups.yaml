  - '[PAGE 59]


    # Chapter 14

    Processes Can Wait


    In the examples of fork(2) up until now we have let the parent process continue
    on in parallel with the child process. In some cases this led to weird results,
    such as when the parent process exited before the child process.


    That kind of scenario is really only suitable for one use case, fire and forget.
    It''s useful when you want a child process to handle something asynchronously,
    but the parent process still has its own work to do.


    ```

    message = ''Good Morning''

    recipient = ''tree@mybackyard.com''


    fork do

    # In this contrived example the parent process forks a child to take

    # care of sending data to the stats collector. Meanwhile the parent

    # process has continued on with its work of sending the actual payload.


    # The parent process doesn''t want to be slowed down with this task,

    # it doesn''t matter if this would fail for some reason.

    StatsCollector.record message, recipient

    end


    # send message to recipient

    ```'
  - "[PAGE 60]\n\n# Babysitting\n\nFor most other use cases involving fork(2) you'll\
    \ want some way to keep tabs on your child processes. In Ruby, one technique for\
    \ this is provided by Process.wait. Let's rewrite our orphan-inducing example\
    \ from the last chapter to perform with less surprises.\n\n```\nfork do\n  5.times\
    \ do\n    sleep 1\n    puts \"I am an orphan!\"\n  end\nend\n\nProcess.wait\n\
    abort \"Parent process died...\"\n```\n\nThis time the output will look like:\n\
    \n```\nI am an orphan!\nI am an orphan!\nI am an orphan!\nI am an orphan!\nI am\
    \ an orphan!\nParent process died...\n```\n\nNot only that, but control will not\
    \ be returned to the terminal until all of the output has been printed."
