    \n当你观察这些简单示例时，你可能会开始担心竞态条件。如果父进程处理每个子进程退出的速度很慢怎么办？\n\n### 在现实世界中\n\n查看子进程的理念是一个常见\
    \ Unix 模式的核心。这种模式有时被称为照看进程（babysitting processes）、主/工作进程模式（master/worker）或预派生（preforking）。\n\
    \n这种模式的核心概念是：你有一个进程它派生了几个子进程以实现并发，并花时间照看它们：确保它们有响应，在其中任何一个进程退出时做出反应等。\n\n例如，Unicorn\
