    how the system works.


    From the README:


    +   - Resque is a Redis-backed library for creating background jobs, placing jobs
    on multiple queues, and processing them later.


    The component that we''re interested in is the Resque worker. Resque workers take
    care of the ''processing them later'' part. The job of a Resque worker is to boot
    up, load your application environment, then connect to Redis and try to reserve
    any background jobs. When it''s able to reserve one such job it works off the
    bench, then goes back to step 1. Simple enough.'
  - '[PAGE 120]


    For an application of non-trivial size one Resque worker is not enough. It''s
    very common to spin up multiple Resque workers in parallel to work off jobs.


    # Forking for Memory Management


    Resque workers employ fork(2) for memory management purposes. Let''s have a look
    at the relevant bit of code and dissect it line by line.


    ```

    if @child = fork

    srand # Reseeding

    procline "Forked @{child} at #{Time.now.to_i}"

    Process.wait(@child)

    else

    procline "Processing #{job.queue} since #{Time.now.to_i}"

    perform(job, &block)

    exit! unless @cant_fork

    end

    ```


    This bit of code is executed every time Resque works off a job.


    If you''ve read through the Forking chapter then you''ll already be familiar with
    the if/else style there here. Otherwise go read it now!


    We''ll start by looking at the code inside the parent process (ie. inside the
    if block).


    ```

    srand # Reseeding

    ```


    This line is here simply because of a bug in a certain patchlevel of MRI Ruby
    1.8.7.'
  md: "\nThe most common usage for IO.popen is an implementation of Unix pipes in\
    \ pure Ruby. That's where the 'p' comes from in popen. Underneath it's still doing\
    \ the fork+exec, but it's also setting up a pipe to communicate with the spawned\
    \ process. That pipe is passed as the block argument in the block form of IO.popen.\n\
    \n```\n# An IO object is passed into the block. In this case we open the stream\n\
    # for writing, so the stream is set to the STDIN of the spawned process.\n# If\
    \ we open the stream for reading (the default)\n# the stream is set to the STDOUT\
    \ of the spawned process.\nIO.popen('less', 'w') { |stream|\n  stream.puts \"\
    some\\data\"\n}\n```\n\nWith IO.popen you have to choose which stream you have\
    \ access to. You can't access them all at once.\n\n## open3\n\nOpen3 allows simultaneous\
    \ access to the STDIN, STDOUT, and STDERR of a spawned process.\n\n```\n# This\
    \ is available as part of the standard library.\nrequire 'open3'\n\nOpen3.popen3('grep',\
    \ 'data') { |stdin, stdout, stderr|\nstdin.puts \"some\\ndata\"\nstdin.close\n\
    puts stdout.read\n}\n\n# Open3 will use Process.spawn when available. Options\
    \ can be passed to\n# Process.spawn like so:\nOpen3.popen3('ls', '-uhh', :err\
    \ => :out) { |stdin, stdout, stderr|\nputs stdout.read\n}\n```\n\nOpen3 acts like\
    \ a more flexible version of IO.popen, for those times when you need it.\n\n##\
    \ In the Real World\n\nAll of these methods are common in the Real World. Since\
    \ they all differ in their behaviour you have to select one based on your needs.\n\
    \nOne drawback to all of these methods is that they rely on fork(2). What's wrong\
    \ with that? Imagine this scenario: You have a big Ruby app that is using hundreds\
    \ of MB of memory. You need to shell out. If you use any of the methods above\
    \ you'll incur the cost of forking.\n\nEven if you're shelling out to a simple\
    \ ls(1) call the kernel will still need to make sure that all of the memory that\
    \ your Ruby process is using is available for that ls(1) process. Why? Because\
    \ that's the API of fork(2). When you fork(2) the process kernel doesn't know\
    \ that you're about to transform that process with an exec(2). You may be forking\
    \ in order to run Ruby code, in which case you'll need to have all of the memory\
    \ available.\n\nIt's good to keep in mind that fork(2) has a cost, and sometimes\
    \ it can be a performance bottleneck. What if you need to shell out a lot and\
    \ don't want to incur the cost of fork(2)?\n\nThere are some native Unix system\
    \ calls for spawning processes without the overhead of fork(2). Unfortunately\
    \ they don't have support in the Ruby language core library. However, there is\
    \ a Rubygem that provides a Ruby interface to these system calls. The posix-spawn\
    \ project provides access to posix_spawn(2), which is available on most Unix Systems.\n\
    \nposix-spawn mimics the Process.spawn API. In fact, most of the options that\
    \ you pass to Process.spawn can also be passed to POSIX::spawn.spawn. So you can\
    \ keep using the same API and repeat the benefits of factor, more resource efficient\
    \ spawning.\n\nAt a basic level posix_spawn(2) is a subset of fork(2). Recall\
    \ the discerning attributes of a new child process from fork(2): 1 it gets an\
    \ exact copy of everything that the parent process had in memory, and 2 it gets\
    \ a copy of all the file descriptors that the parent process had open.\n\nposix_spawn(2)\
    \ preserves #2, but not #1. That's the big difference between the two. So you\
    \ can expect a newly spawned process to have access to any of the file descriptors\
    \ opened by the parent, but it won't share any of the memory. This is what makes\
    \ posix_spawn(2) faster and more efficient than fork(2). But keep in mind that\
    \ it makes it less flexible.\n\n> 2.http://github.com/rtomayko/posix-spawn \n\n\
    ## System Calls\n\nRuby’s `Kernel#system` maps to system(3), `Kernel#exec` maps\
    \ to execve(2), `IO.popen` maps to popen(3), posix-spawn uses posix_spawn(2).\n\
    \n## Ending\n\nWorking with processes in Unix is about two things: abstraction\
    \ and communication.\n\n## Abstraction\n\nThe kernel has an extremely abstract\
    \ (and simple) view of its processes. As programmers we're used to looking at\
    \ source code as the differentiator between two programs.\n\nWe are masters of\
    \ many programming languages, using each for different purposes. We couldn't possibly\
    \ write memory-efficient code in a language with a garbage collector, we'll have\
    \ to use C. But we need objects, let's use C++. And on on.\n\nBut if you ask the\
    \ it it looks the same. In the end, all of our code is compiled down to something\
    \ simple that the kernel can understand. When it's working at that level all processes\
    \ are treated the same. Everything gets its numeric identifier and is given equal\
    \ access to the resources of the kernel.\n\nWhat's the point of all this jibber-jabber?\
    \ Using Unix programming lets you twiddle with these knobs a little bit. It lets\
    \ you do things that you can't accomplish when working at the programming language.\n"
  mdcn: "\n\n`IO.popen` 最常用的用法是在纯 Ruby 中实现 Unix 管道。这正是 `popen` 中 'p' 的来源。在底层，它仍然在执行\
    \ `fork+exec`，但它同时也建立了一个管道与派生的进程进行通信。该管道作为块参数传递给 `IO.popen` 的块形式。\n\n```\n# 一个\
    \ IO 对象被传递到块中。在这种情况下，我们以写入模式打开流，\n# 因此流被设置为派生进程的 STDIN。\n# 如果我们以读取模式打开流（默认值）\n\
    # 流将被设置为派生进程的 STDOUT。\nIO.popen('less', 'w') { |stream|\n  stream.puts \"some\\\
    data\"\n}\n```\n\n使用 `IO.popen` 时，你必须选择你可以访问哪种流。你无法同时访问它们。\n\n## open3\n\nOpen3\
    \ 允许同时访问派生进程的 STDIN、STDOUT 和 STDERR。\n\n```\n# 这是标准库的一部分可用。\nrequire 'open3'\n\
    \nOpen3.popen3('grep', 'data') { |stdin, stdout, stderr|\nstdin.puts \"some\\\
    ndata\"\nstdin.close\nputs stdout.read\n}\n\n# Open3 会在可用时使用 Process.spawn。选项可以像这样\n\
    # 传递给 Process.spawn：\nOpen3.popen3('ls', '-uhh', :err => :out) { |stdin, stdout,\
    \ stderr|\nputs stdout.read\n}\n```\n\nOpen3 的作用就像是 `IO.popen` 的一个更灵活的版本，供你在需要的时候使用。\n\
    \n## 在现实世界中\n\n所有这些方法在现实世界中都非常常见。由于它们的行为各不相同，你必须根据自己的需求选择其中一种。\n\n所有这些方法的共同缺点是它们依赖于\
    \ `fork(2)`。这有什么问题呢？想象这样一个场景：你有一个占用数百 MB 内存的大型 Ruby 应用。你需要调用外部命令（shell out）。如果你使用上述任何方法，你将承担\
    \ `fork` 的开销。\n\n即使你只是调用一个简单的 `ls(1)` 命令，内核仍然需要确保 Ruby 进程正在使用的所有内存对于该 `ls(1)`\
    \ 进程可用。为什么？因为这就是 `fork(2)` 的 API。当你执行 `fork(2)` 时，进程内核并不知道你正准备通过 `exec(2)` 转换该进程。你可能是为了运行\
    \ Ruby 代码而进行 fork，在这种情况下，你需要所有内存都可用。\n\n记住 `fork(2)`是有开销的，有时它可能会成为性能瓶颈。如果你需要频繁调用外部命令且不想承担\
    \ `fork(2)` 的开销怎么办？\n\n有一些原生的 Unix 系统调用可以在不产生 `fork(2)` 开销的情况下派生进程。遗憾的是，Ruby 语言的核心库并没有对这些支持的支持。不过，有一个\
    \ Rubygem 为这些系统调用提供了 Ruby 接口。`posix-spawn` 项目提供了对 `posix_spawn(2)` 的访问，它在大多数 Unix\
    \ 系统上都是可用的。\n\n`posix-spawn` 模拟了 `Process.spawn` API。事实上，你传递给 `Process.spawn`\
    \ 的大多数选项也可以传递给 `POSIX::spawn.spawn`。因此，你可以继续使用相同的 API，并重复 factor 的优势——更高效的进程派生。\n\
    \n在基础层面，`posix_spawn(2)` 是 `fork(2)` 的子集。回一下 `fork(2)` 产生的新子进程的显著特征：1. 它获得了父进程内存中所有内容的精确拷贝；2.\
    \ 它获得了父进程已打开的所有描述符的拷贝。\n\n`posix_spawn(2)` 保留了 #2 但没有保留 #1。这是两者最大的区别。因此，你可以预期新派生的进程可以访问父进程打开的任何描述符，但它不会共享任何内存。这就是为什么\
    \ `posix_spawn(2)` 比 `fork(2)` 更快、更高效。但请记住，这使其灵活性降低了。\n\n> 2.http://github.com/rtomayko/posix-spawn\n\
    \n## 系统调用\n\nRuby 的 `Kernel#system` 映射到 `system(3)`，`Kernel#exec` 映射到 `execve(2)`，`IO.popen`\
    \ 映射到 `popen(3)`，posix-spawn 使用 `posix_spawn(2)`。\n\n## 结\n\n在 Unix 中处理进程涉及两件事：抽象和通信。\n\
    \n## 抽象\n\n内核对它的进程有一个极其抽象（且简单）的视角。作为程序员，我们习惯于将源代码视为程序之间的区别。\n\n我们精通许多编程语言，并将每种语言用于不同的目的。我们不可能在带有垃圾回收的语言中编写出内存高效的代码，我们必须使用\
    \ C。但我们需要对象，让我们用 C++ 吧。以此类推。\n\n但如果你问内核，它们看起来是一样的。最终，我们所有的代码都被编译成内核可以理解的简单内容。当它在那个层级工作时，所有进程都被同等对待。每个东西都会获得一个数字标识符，并获得访问内核资源的平等权限。\n\
    \n这些废话的意义何？使用 Unix 编程让你能够稍微调节一下这些旋钮。它让你能够完成那些在编程语言层面无法实现的事情。\n\n"
