    ```


    In `bash` environment variables are accessed using the syntax: `$VAR`. As you
    can tell from these few examples environment variables can be used to share state
    between processes running different languages, `bash` and `ruby` in this case.


    # It''s a hash, right?


    Although `ENV` uses the hash-style accessor API it''s not actually a `Hash`. For
    instance, it implements `Enumerable` and some of the `Hash` API, but not all of
    it. Key methods like `merge` are `not` implemented. So you can do things like
    `ENV.has_key?`, but don''t count on all hash operations working.


    ```

    puts ENV[''EDITOR'']

    puts ENV.has_key?(PATH)

    puts ENV.is_a?(Hash)

    ```


