    # Ending


    Working with processes in Unix is about two things: abstraction and communication.


    # Abstraction


    The kernel has an extremely abstract (and simple) view of its processes. As programmers
    we''re used to looking at source code as the differentiator between two programs.


    We are masters of many programming languages, using each for different purposes.
    We couldn''t possibly write memory-efficient code in a language with a garbage
    collector, we''ll have to use C. But we need objects, let''s use C++. And on on.


    But if you ask the it it looks the same. In the end, all of our code is compiled
    down to something simple that the kernel can understand. When it''s working at
    that level all processes are treated the same. Everything gets its numeric identifier
    and is given equal access to the resources of the kernel.


    What''s the point of all this jibber-jabber? Using Unix programming lets you twiddle
    with these knobs a little bit. It lets you do things that you can''t accomplish
    when working at the programming language level.


    Unix programming is programming language agnostic. It lets you interface your
    Ruby script with a C program, and vice versa. It also lets you reuse its concepts
    across programming languages. The Unix Programming skills that you get from Ruby
    will be'
