    # In the Real World


    The most common use case for ARGV is probably for accepting filenames into a program.
    It''s very common to write a program that takes one or more filenames as input
    on the command line and does something useful with them.


    The other common use case, as mentioned, is for parsing command line input. There
    are many Ruby libraries for dealing with command line input. One called optparse
    is available as part of the standard library.


