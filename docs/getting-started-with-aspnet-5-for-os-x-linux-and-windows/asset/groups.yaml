    \ include/uv-version.h include/uv-unix.h include/uv-linux.h '/usr/local/include/'\n\
    /bin/mkdir -p '/usr/local/lib/pkgconfig'\n/usr/bin/install -c -m 644 libuv.pc\
    \ '/usr/local/lib/pkgconfig'\nmake[1]: Leaving directory '/usr/local/src/libuv-1.4.2'\n\
    agusk@ubuntu15:/usr/local/src/libuv-1.4.2$ sudo rm -rf /usr/local/src/libuv-1.4.2\
    \ && cd ~/agusk@ubuntu15:~$ sudo ldconfig\nagusk@ubuntu15:~$ \n```\n\n#### 3.2.3\
    \ 安装 DNVM\n\n最后一步是安装 DNVM。输入此命令。\n\n```bash\n$ curl -sSL https://raw.githubusercontent.com/aspnet/Home/dev/dnvminstall.sh\
    \ | DNX_BRANCH=dev sh && source ~/.dnx/dnvm/dnvm.sh\n```\n\n如果成功，你会看到一个你应该执行的任务。我们必须将\
    \ dnvm 添加到我们的配置文件（profile）中。\n\n```bash\nagusk@ubuntu15:~\nagusk@ubuntu15:~$ curl\
