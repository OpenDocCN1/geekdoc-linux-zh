    \ sh && source ~/.dnx/dnvm/dnvm.sh\nDownloading dnvm as script to '/home/agusk/.dnx/dnvm/dnvm'\n\
    Appending source string to /home/agusk/.bashrc\nType 'source /home/agusk/.dnx/dnvm/dnvm.sh'\
    \ to start using dnvm\nagusk@ubuntu15:~$ \n```\n\n输入此命令。\n\n```bash\n$ nano /home/<account>/.bashrc\n\
    ```\n\n请将 `<account>` 替换为你的 Linux 登录账户。\n\n然后，你将看到 nano 编辑器。你也可以使用 gedit 或其他文本编辑器来编辑此文件。将此脚本添加到你的配置文件（例如，`/home/<account>/.bashrc`）中的\
