    \ 6.3.4 创建视图\n        - 6.3.5 AngularJS 程序\n    - 6.4 测试\n    - 6.5 下一步是什么？\n\
    - 源代码\n- 联系方式\n\n## 前言\n\n本书旨在帮助任何希望开始使用 ASP.NET 5 core 的人。它描述了 ASP.NET 5 core\
    \ 的部署以及 ASP.NET 5 core 的基本元素，并展示了如何使用几个 ASP.NET 5 core 功能。\n\nAgus Kurniawan\n\
    柏林 & 德波克，2015 年 6 月\n\n## 1. 准备开发环境\n\n### 1.1 ASP.NET 5\n\nASP.NET 5 是一个轻量级且可组合的框架，用于构建\
    \ Web 和云应用程序。\nASP.NET 5 完全开源，可在 GitHub 上获取，http://github.com/aspnet/home。\n撰写本书时，ASP.NET\
    \ 5 目前处于预览阶段。\n\n本书将重点介绍如何在 OS X、Linux 和 Windows 平台上开发 ASP.NET 5。我们使用 ASP.NET\
    \ 5 core beta4。\n\n### 1.2 系统要求\n\n为了进行测试，我使用了 Debian/Ubuntu Linux、OS X Yosemite\
    \ 和 Windows 8.1。你可以使用任何源自 Debian 的 Linux 发行版。\n\n### 1.3 开发工具\n\n一般来说，我们可以使用任何编辑器来编写\
    \ ASP.NET 5 程序。我建议使用 Sublime Text，[http://www.sublimetext.com/](http://www.sublimetext.com/)，来编写\
    \ ASP.NET 5 代码。微软还发布了 Visual Studio Code，你可以在 [https://code.visualstudio.com/](https://code.visualstudio.com/)\
    \ 上下载。\n\n## 2 在 OS X 上部署 ASP.NET 5\n\n在本章中，我们将学习如何在 OS X 上部署 ASP.NET 5。\n\n###\
    \ 2.1 入门\n\n在本节中，我们开始在 OS X 上部署 ASP.NET 5。在本书中，我使用 ASP.NET 5 预览版，beta4。请按照下一节的步骤进行安装。\n\
    \n### 2.2 部署 ASP.NET 5\n\n要在 OS X 上安装 ASP.NET，你可以使用 brew，[http://brew.sh/](http://brew.sh/)。输入以下命令来安装\
    \ ASP.NET 5。\n\n```bash\n$ brew tap aspnet/dnx\n$ brew update\n$ brew install\
    \ dnvm\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_12_0.png)\n\n如果成功，你会看到一个你应该执行的任务。我们必须将\
    \ dnvm 添加到我们的配置文件中。\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_13_0.png)\n\n\
    输入此命令。\n\n```bash\n$ nano ~/.bash_profile\n```\n\n然后，你会打开 nano 编辑器。你可以使用其他文本编辑器。将此脚本添加到\
    \ `~/.bash_profile` 中。\n\n```bash\nsource dnvm.sh\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_14_0.png)\n\
    \n完成后，保存此文件。然后，关闭你的终端并重新打开，以便终端加载配置文件脚本。\n\n下一步是升级。输入此命令。\n\n```bash\n$ dnvm upgrade\n\
    ```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_15_0.png)\n\n现在你已经安装了 dnvm。它将用于管理\
    \ OS X 上的 ASP.NET 5 运行时。你可以通过输入此命令来验证 dnvm。\n\n```bash\n$ dnvm help\n```\n\n因此你会看到\
    \ dnvm 参数列表。\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_16_0.png)\n\n你还可以通过输入此命令来查看你的\
    \ DNX 运行时列表。\n\n```bash\n$ dnvm list\n```\n\n```text\ndnvm alias <alias>\n   \
    \ display value of the specified alias\n\ndnvm alias <alias> <semver>|<alias>|<package>\n\
    \    <alias>\n        <semver>|<alias>|<package>   the name of the alias to set\n\
    \        the DNX version to set the alias to. Alternatively use the version of\
    \ the specified alias\n\ndnvm unalias <alias>\n    remove the specified alias\n\
    \ndnvm [help|-h|--help|--help]\n    displays this help text.\n\ndnvm update-self\n\
    \    updates dnvm itself.\n\nagusk$ dnvm list\n\nActive Version              \
    \  Runtime Arch Location                 Alias\n----- ------                 \
    \ ---- ---- ----- ---                 -----\n    *  1.0.0-beta4            mono\
    \            ~/.dnx/runtimes      default\nagusk$\n```\n\n### 2.3 测试\n\n为了测试我们的\
    \ ASP.NET 5，我们使用来自 [https://github.com/aspnet/Home](https://github.com/aspnet/Home)\
    \ 的代码示例。我们克隆这些代码示例，然后使用 dnu 命令还原所有必需的库。输入这些命令。\n\n```bash\n$ git clone https://github.com/aspnet/Home\n\
    $ cd Home\n$ dnu restore\n```\n\n如果你的 OS X 上没有 git，你可以通过 brew 安装它。\n\n```bash\n\
    $ brew install git\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_18_0.png)\n\
    \n现在你准备好运行代码示例了。\n\n#### 2.3.1 ASP.NET 控制台\n\n要运行 ASP.NET 控制台，我们可以使用 dnx。首先，导航到\
    \ ConsoleApp 项目。输入这些命令。\n\n```bash\n$ cd samples/latest/ConsoleApp/\n$ dnx . run\
    \ .\n```\n\n如果成功，你可以在终端上看到消息 “Hello World”。\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_19_0.png)\n\
    \n#### 2.3.2 ASP.NET 5\n\n要运行 ASP.NET 5 应用程序，我们可以使用带有 kestrel 的 dnx。首先，导航到 HelloWeb\
    \ 项目。\n输入这些命令。\n\n```bash\n$ cd samples/latest/HelloWeb/\n$ dnx . kestrel\n```\n\
    \n现在打开浏览器，然后导航到 http://localhost:5004/。你应该会看到\nASP.NET 5 应用程序。\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_20_0.png)\n\
    \n要停止 kestrel，你可以输入 `exit`。\n\n```bash\nexit\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_20_1.png)\n\
    \n#### 2.3.3 ASP.NET MVC\n\n要运行 ASP.NET MVC，我们可以使用 dnx。首先，导航到 HelloMvc 项目。输入这些命令。\n\
    \n```bash\n$ cd samples/latest/HelloMvc/\n$ dnx . kestrel\n```\n\n现在打开浏览器，然后导航到\
    \ http://localhost:5004/。你应该会看到 ASP.NET MVC 应用程序。\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_21_0.png)\n\
    \n要停止 kestrel，你可以输入 exit。\n\n#### 2.4 开发工具\n\n下一步是构建程序。要编写程序，你可以使用任何文本编辑器。微软还提供了\
    \ Visual Studio Code。它可以在 Windows、Linux 和 Mac 上运行。你可以在 [https://code.visualstudio.com/](https://code.visualstudio.com/)\
    \ 上下载。\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_23_0.png)\n\n"
