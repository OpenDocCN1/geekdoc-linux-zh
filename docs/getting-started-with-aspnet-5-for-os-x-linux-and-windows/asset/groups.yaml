    # Preface


    This book was written to help anyone want to get started with ASP.NET 5 core.
    It describes ASP.NET 5 core deploying and the basic elements of ASP.NET 5 core
    and shows how to work with several ASP.NET 5 core features.


    Agus Kurniawan

    Berlin & Depok, June 2015'
  - '[PAGE 6]


    # 1. Preparing Development Environment'
  - '[PAGE 7]


    # **1.1 ASP.NET 5**


    ASP.NET 5 is a lean and composable framework for building web and cloud applications.

    ASP.NET 5 is fully open source and available on GitHub, http://github.com/aspnet/home
    .

    ASP.NET 5 is currently in preview when this book is written.


    This book will focus on how to develop ASP.NET 5 on OS X, Linux and Windows platforms.
    We use ASP.NET 5 core beta4.'
  - '[PAGE 8]


    # **1.2 System Requirements**


    For testing, I use Debian/Ubuntu Linux, OS X Yosemite and Windows 8.1. You can
    use any Linux distribution which inherited from Debian based.'
  - '[PAGE 9]


    # 1.3 Development Tools


    In general, we can use any editor to write ASP.NET 5program. I recommend to use
    Sublime Text, [http://www.sublimetext.com/](http://www.sublimetext.com/), to write
    ASP.NET 5 codes. Microsoft also released Visual Studio Code and you can download
    it on [https://code.visualstudio.com/](https://code.visualstudio.com/).'
  - '[PAGE 10]


    # ## 2 Deploying ASP.NET 5 on OS X


    In this chapter we will learn how to deploy ASP.NET 5 on OS X.'
  - '[PAGE 11]


    # 2.1 Getting Started


    In this section we start to deploy ASP.NET 5 on OS X. In this book I use ASP.NET
    5 preview, beta4. Please follow installation steps on next section.'
  - '[PAGE 12]


    # ### 2.2 Deploying ASP.NET 5


    To install ASP.NET on OS X, you can use brew, [http://brew.sh/](http://brew.sh/).
    Type these commands to install ASP.NET 5.


    ```

    $ brew tap aspnet/dnx

    $ brew update

    $ brew install dnvm

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_12_0.png)


    If success, you can see a task which you should do. We must add dnvm on our profile.'
  - '[PAGE 13]


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_13_0.png)


    Type this command.


    ```

    $ nano ~/.bash_profile

    ```


    Then, you get nano editor. You can use another text editor. Add this script on
    `~/.bash_profile`.


    ```

    source dnvm.sh

    ```'
