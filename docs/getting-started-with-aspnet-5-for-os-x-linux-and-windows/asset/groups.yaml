    # ## 3.2 Deploying ASP.NET 5


    This installation process is based on this documentation, [https://github.com/aspnet/Home/blob/dev/GettingStartedDeb.md](https://github.com/aspnet/Home/blob/dev/GettingStartedDeb.md)
    . In this section, we install ASP.NET 5 on Linux manually (without docker). Firstly,
    you update your distro.


    ```

    ```

    $ sudo apt-get update

    ```

    ```


    In general, to install ASP.NET 5 on Ubuntu, you can do the following steps:


    +   - Installing Mono

    +   - Installing libuv

    +   - Installing DNVM

    +   - Installing git (optional)


    # ### 3.2.1 Installing Mono


    Mono is .NET runtime for Linux. You need the latest version of Mono runtime. To
    install it, you can type these commands.


    ```

    ```

    $ sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 3FA7E032

    $ echo "deb http://download.mono-project.com/repo/debian wheezy main" > /etc/apt/sources.list.d/mono.list

    $ sudo apt-get update

    $ sudo apt-get install mono-complete

    ```

    ```


    If finished, you can verify it by checking its version.


    ```

    ```

    $ mono --version

    ```

    ```'
