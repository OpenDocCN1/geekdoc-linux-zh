    # 4. Deploying ASP.NET 5 on Windows


    In this chapter we will learn how to deploy ASP.NET 5 on Windows.


    ## 4.1 Getting Started


    In this section we start to deploy ASP.NET 5 on Windows. In this book I use ASP.NET
    5 preview, beta4. For illustration, I use Windows 8.1. Please follow installation
    steps on next section.


    ## 4.2 Deploying ASP.NET 5


    This installation process is based on this documentation, `https://github.com/aspnet/Home/blob/dev/GettingStartedDeb.md`.
    In this section, we install ASP.NET 5 on Windows. Firstly, you update your Windows.


    In general, to install ASP.NET 5 on Ubuntu, you can do the following steps:


    - Installing .NET

    - Installing DNVM

    - Installing git (optional)


    ### 4.2.1 Installing .NET


    You need the latest version of .NET Framework runtime. To install it, you can
    download it on `https://www.microsoft.com/net`.


    ### 4.2.2 Installing DNVM


    You can install DNVM via Command Prompt. Open CMD and type this command.


    ```

    @powershell -NoProfile -ExecutionPolicy unrestricted -Command "&{$Branch=''dev'';iex
    ((new-object net.webclient).DownloadString(''https://raw.githubusercontent.com/aspnet/Home/dev/dnvminstall.ps1''))}"

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_39_0.png)


    If success, you can verify where `dnvm` is by typing this command.


    ```

    where dnvm

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_40_0.png)


    If got error, check your PATH configuration. Make sure `.dnx` path already added.


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_40_1.png)


    The next step is to upgrade DNVM. Type this command.


    ```

    $ dnvm upgrade

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_41_0.png)


    Now you already installed `dnvm`. It will be used to manage ASP.NET 5 runtime
    on Windows. You can verify `dnvm` by typing this command.


    ```

    $ dnvm help

    ```


    So you see a list of `dnvm` parameter.


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_41_1.png)


    You can also see a list of your DNX runtime by typing this command.


    ```

    $ dnvm list

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_42_0.png)


    ### 4.2.3 Installing git


    This task is optional but I recommend to install it because we want to run the
    sample app from `https://github.com/aspnet/Home`. You can install git by downloading
    it on `https://git-scm.com/downloads`.


    ## 4.3 Testing


    To test our ASP.NET 5, we use code samples from `https://github.com/aspnet/Home`.
    We clone this code samples and then restore all required libraries using `dnu`
    command.


    Type these commands.


    ```

    $ git clone https://github.com/aspnet/Home

    $ cd Home

    $ dnu restore

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_43_0.png)


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_43_1.png)


    Now you are ready to run code samples.


