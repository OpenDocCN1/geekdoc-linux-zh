    \        - 5.3.1 Creating a Project\n        - 5.3.2 Writing Program\n       \
    \     - 5.3.2.1 Creating Model\n            - 5.3.2.2 Creating Controller\n  \
    \          - 5.3.2.3 Creating View\n        - 5.3.3 Testing\n- 6. ASP.NET 5 RESTful\
    \ and AngularJS\n    - 6.1 Getting Started\n    - 6.2 Creating Project\n    -\
    \ 6.3 Writing Program\n        - 6.3.1 Creating Model\n        - 6.3.2 Dummy Database\n\
    \        - 6.3.3 Creating Controller\n        - 6.3.4 Creating View\n        -\
    \ 6.3.5 AngularJS Program\n    - 6.4 Testing\n    - 6.5 What's The Next?\n- Source\
    \ Code\n- Contact\n\n## Preface\n\nThis book was written to help anyone want to\
    \ get started with ASP.NET 5 core. It describes ASP.NET 5 core deploying and the\
    \ basic elements of ASP.NET 5 core and shows how to work with several ASP.NET\
    \ 5 core features.\n\nAgus Kurniawan\nBerlin & Depok, June 2015\n\n## 1. Preparing\
    \ Development Environment\n\n### 1.1 ASP.NET 5\n\nASP.NET 5 is a lean and composable\
    \ framework for building web and cloud applications.\nASP.NET 5 is fully open\
    \ source and available on GitHub, http://github.com/aspnet/home.\nASP.NET 5 is\
    \ currently in preview when this book is written.\n\nThis book will focus on how\
    \ to develop ASP.NET 5 on OS X, Linux and Windows platforms. We use ASP.NET 5\
    \ core beta4.\n\n### 1.2 System Requirements\n\nFor testing, I use Debian/Ubuntu\
    \ Linux, OS X Yosemite and Windows 8.1. You can use any Linux distribution which\
    \ inherited from Debian based.\n\n### 1.3 Development Tools\n\nIn general, we\
    \ can use any editor to write ASP.NET 5 program. I recommend to use Sublime Text,\
    \ [http://www.sublimetext.com/](http://www.sublimetext.com/), to write ASP.NET\
    \ 5 codes. Microsoft also released Visual Studio Code and you can download it\
    \ on [https://code.visualstudio.com/](https://code.visualstudio.com/).\n\n## 2\
    \ Deploying ASP.NET 5 on OS X\n\nIn this chapter we will learn how to deploy ASP.NET\
    \ 5 on OS X.\n\n### 2.1 Getting Started\n\nIn this section we start to deploy\
    \ ASP.NET 5 on OS X. In this book I use ASP.NET 5 preview, beta4. Please follow\
    \ installation steps on next section.\n\n### 2.2 Deploying ASP.NET 5\n\nTo install\
    \ ASP.NET on OS X, you can use brew, [http://brew.sh/](http://brew.sh/). Type\
    \ these commands to install ASP.NET 5.\n\n```bash\n$ brew tap aspnet/dnx\n$ brew\
    \ update\n$ brew install dnvm\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_12_0.png)\n\
    \nIf success, you can see a task which you should do. We must add dnvm on our\
    \ profile.\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_13_0.png)\n\nType this\
    \ command.\n\n```bash\n$ nano ~/.bash_profile\n```\n\nThen, you get nano editor.\
    \ You can use another text editor. Add this script on `~/.bash_profile`.\n\n```bash\n\
    source dnvm.sh\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_14_0.png)\n\n\
    If done, save this file. After that, close your Terminal and then open again so\
    \ Terminal will load profile script.\n\nThe next step is to upgrade. Type this\
    \ command.\n\n```bash\n$ dnvm upgrade\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_15_0.png)\n\
    \nNow you already installed dnvm. It will be used to manage ASP.NET 5 runtime\
    \ on OS X. You can verify dnvm by typing this command.\n\n```bash\n$ dnvm help\n\
    ```\n\nSo you see a list of dnvm parameter.\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_16_0.png)\n\
    \nYou can also see a list of your DNX runtime by typing this command.\n\n```bash\n\
    $ dnvm list\n```\n\n```text\ndnvm alias <alias>\n    display value of the specified\
    \ alias\n\ndnvm alias <alias> <semver>|<alias>|<package>\n    <alias>\n      \
    \  <semver>|<alias>|<package>   the name of the alias to set\n        the DNX\
    \ version to set the alias to. Alternatively use the version of the specified\
    \ alias\n\ndnvm unalias <alias>\n    remove the specified alias\n\ndnvm [help|-h|--help|--help]\n\
    \    displays this help text.\n\ndnvm update-self\n    updates dnvm itself.\n\n\
    agusk$ dnvm list\n\nActive Version                Runtime Arch Location      \
    \           Alias\n----- ------                  ---- ---- ----- ---         \
    \        -----\n    *  1.0.0-beta4            mono            ~/.dnx/runtimes\
    \      default\nagusk$\n```\n\n### 2.3 Testing\n\nTo test our ASP.NET 5, we use\
    \ code samples from [https://github.com/aspnet/Home](https://github.com/aspnet/Home).\
    \ We clone this code samples and then restore all required libraries using dnu\
    \ command. Type these commands.\n\n```bash\n$ git clone https://github.com/aspnet/Home\n\
    $ cd Home\n$ dnu restore\n```\n\nIf you don’t have git on your OS X, you can install\
    \ it via brew.\n\n```bash\n$ brew install git\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_18_0.png)\n\
    \nNow you are ready to run code samples.\n\n#### 2.3.1 ASP.NET Console\n\nTo run\
    \ ASP.NET Console, we can use dnx. Firstly, navigate to ConsoleApp project. Type\
    \ these commands.\n\n```bash\n$ cd samples/latest/ConsoleApp/\n$ dnx . run .\n\
    ```\n\nIf success, you can see a message “Hello World” on Terminal.\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_19_0.png)\n\
    \n#### 2.3.2 ASP.NET 5\n\nTo run ASP.NET 5 app, we can use dnx with kestrel. Firstly,\
    \ navigate to HelloWeb project.\nType these commands.\n\n```bash\n$ cd samples/latest/HelloWeb/\n\
    $ dnx . kestrel\n```\n\nNow open a browser and then navigate to http://localhost:5004/.\
    \ You should see\nASP.NET 5 app.\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_20_0.png)\n\
    \nTo stop kestrel, you can type `exit`.\n\n```bash\nexit\n```\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_20_1.png)\n\
    \n#### 2.3.3 ASP.NET MVC\n\nTo run ASP.NET MVC, we can use dnx. Firstly, navigate\
    \ to HelloMvc project. Type these commands.\n\n```bash\n$ cd samples/latest/HelloMvc/\n\
    $ dnx . kestrel\n```\n\nNow open a browser and then navigate to http://localhost:5004/.\
    \ You should see ASP.NET MVC app.\n\n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_21_0.png)\n\
    \nTo stop kestrel, you can type exit.\n\n#### 2.4 Development Tools\n\nThe next\
    \ step is to build program. To write a program, you can use any text editor. Microsoft\
    \ also provides Visual Studio Code. It runs on Windows, Linux and Mac. You can\
    \ download it on [https://code.visualstudio.com/](https://code.visualstudio.com/).\n\
    \n![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_23_0.png)\n"
