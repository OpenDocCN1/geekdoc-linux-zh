    \n            }\n        },\n        \"kestrel\": {\n            \"commandName\"\
    : \"kestrel\",\n            \"launchBrowser\": true,\n            \"launchUrl\"\
    : \"http://localhost:5004\"\n        },\n        \"web\": {\n            \"commandName\"\
    : \"web\",\n            \"launchBrowser\": true,\n            \"launchUrl\": \"\
    http://localhost:5001\"\n        }\n    }\n}\n```\n\n通过执行 **Startup.cs** 文件来启动应用程序。创建此文件并编写此代码。\n\
    \n```csharp\nusing Microsoft.AspNetCore;\nusing Microsoft.Framework.DependencyInjection;\n\
