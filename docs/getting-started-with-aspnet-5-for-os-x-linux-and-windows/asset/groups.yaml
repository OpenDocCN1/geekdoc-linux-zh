    : {\n        \"dnx451\": {},\n        \"dnxcore50\": {}\n    }\n}\n```\n\nWe also\
    \ add **launchSettings.json** to configure how to execute the program. Store it\
    \ on Properties folder. Write this script for **launchSettings.json** file.\n\n\
    ```json\n{\n    \"profiles\": {\n        \"IIS Express\": {\n            \"commandName\"\
    : \"IISExpress\",\n            \"launchBrowser\": true,\n            \"environmentVariables\"\
    : {\n                \"ASPNET_ENV\": \"Development\"\n            }\n        },\n\
    \        \"kestrel\": {\n            \"commandName\": \"kestrel\",\n         \
    \   \"launchBrowser\": true,\n            \"launchUrl\": \"http://localhost:5004\"\
    \n        },\n        \"web\": {\n            \"commandName\": \"web\",\n    \
    \        \"launchBrowser\": true,\n            \"launchUrl\": \"http://localhost:5001\"\
    \n        }\n    }\n}\n```\n\nApp will start by executing **Startup.cs** file.\
    \ Create this file and write this code.\n\n```csharp\nusing Microsoft.AspNetCore;\n\
    using Microsoft.Framework.DependencyInjection;\n\nnamespace WebDemo\n{\n    public\
    \ class Startup\n    {\n        public void ConfigureServices(IServiceCollection\
    \ services)\n        {\n            services.AddMvc();\n        }\n\n        public\
    \ void Configure(IApplicationBuilder app)\n        {\n            // handle error\
    \ page\n            app.UseErrorPage();\n            // handle static file requests\n\
    \            app.UseStaticFiles();\n            // aspNet routing\n          \
    \  app.UseMvc(routes =>\n            {\n                routes.MapRoute(\"default\"\
    , \"{controller=Home}/{action=Index}\");\n            });\n        }\n    }\n\
    }\n```\n\n## 6.3 Writing Program\n\nIn this section, we write our ASP.NET 5 MVC\
    \ program.\n\n### 6.3.1 Creating Model\n\nFirstly, we create a model, called Product.\
    \ The following is code implementation.\n\n```csharp\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace WebDemo.Web.Models\n{\n    public class Product\n    {\n        [Required]\n\
    \        [MinLength(4)]\n        [Display(Name = \"Name\")]\n        public string\
    \ Name { get; set; }\n        [Display(Name = \"Product Code\")]\n        public\
    \ string ProductCode { get; set; }\n        [Display(Name = \"Quantity\")]\n \
    \       public int Quantity { get; set; }\n        [Display(Name = \"Price\")]\n\
    \        public double Price { get; set; }\n    }\n}\n```\n\nSave this code into\
    \ a file, called Product.cs and store it into Models folder.\n\n### 6.3.2 DUMMY\
    \ Database\n\nIn this case, we don't access database directly so we create a dummy\
    \ database which generates product data. Create a file, called DumpDatabase.cs\
    \ and write this code.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \nusing WebDemo.Web.Models;\n\nnamespace WebDemo.Web.Database\n{\n    public class\
    \ DumpDatabase\n    {\n        private DumpDatabase() { }\n\n        public static\
    \ List<Product> GetAllProducts()\n        {\n            // generate data\n  \
    \          List<Product> list = new List<Product>();\n            for (int i =\
    \ 0; i < 10; i++)\n            {\n                var item = new Product();\n\
    \                item.Name = String.Format(\"Product {0}\", i);\n            \
    \    item.ProductCode = String.Format(\"K0{0}\", i);\n                item.Quantity\
    \ = 4 + i;\n                item.Price = 1.43 * (i + 1);\n                list.Add(item);\n\
    \            }\n            return list;\n        }\n    }\n}\n```\n\nSave this\
    \ file into Database folder.\n\n### 6.3.3 Creating Controller\n\nFurthermore,\
    \ we build a controller, called Home by creating a file, called **HomeController.cs**.\
    \ Write this code.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using Microsoft.AspNet.Mvc;\nusing WebDemo.Web.Models;\nusing WebDemo.Web.Database;\n\
    \nnamespace WebDemo.Web.Controllers\n{\n    public class HomeController : Controller\n\
    \    {\n        public IActionResult Index()\n        {\n            return View();\n\
    \        }\n\n        [HttpPost]\n        public JsonResult GetAllProducts()\n\
    \        {\n            List<Product> list = DumpDatabase.GetAllProducts();\n\
    \            return Json(list);\n        }\n    }\n}\n```\n"
