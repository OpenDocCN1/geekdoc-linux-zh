  mdcn: "\n\n## 3 在 Linux 上部署 ASP.NET 5\n\n在本章中，我们将学习如何在 Linux 上部署 ASP.NET 5。\n\n\
    ### 3.1 入门\n\n在本节中，我们将开始在 Linux 上部署 ASP.NET 5。在这本书中，我使用的是 ASP.NET 5 预览版，beta4。作为示例，我使用\
    \ Ubuntu 15.04 作为 Linux 发行版。请按照下一节的安装步骤进行操作。\n\n### 3.2 部署 ASP.NET 5\n\n此安装过程基于此文档：[https://github.com/aspnet/Home/blob/dev/GettingStartedDeb.md](https://github.com/aspnet/Home/blob/dev/GettingStartedDeb.md)。在本节中，我们将手动在\
    \ Linux 上安装 ASP.NET 5（不使用 docker）。首先，请更新你的发行版。\n\n```bash\n$ sudo apt-get update\n\
    ```\n\n通常，要在 Ubuntu 上安装 ASP.NET 5，你可以执行以下步骤：\n\n- 安装 Mono\n- 安装 libuv\n- 安装 DNVM\n\
    - 安装 git（可选）\n\n#### 3.2.1 安装 Mono\n\nMono 是用于 Linux 的 .NET 运行时。你需要最新版本的 Mono\
    \ 运行时。要安装它，你可以输入这些命令。\n\n```bash\n$ sudo apt-key adv --keyserver keyserver.ubuntu.com\
    \ --recv-keys 3FA7E032\n$ echo \"deb http://download.mono-project.com/repo/debian\
    \ wheezy main\" > /etc/apt/sources.list.d/mono.list\n$ sudo apt-get update\n$\
    \ sudo apt-get install mono-complete\n```\n\n完成后，你可以通过检查其版本来验证。\n\n```bash\n$\
    \ mono --version\n```\n\n```bash\nagusk@ubuntu15:~$\nagusk@ubuntu15:~$ mono --version\n\
    Mono JIT compiler version 4.0.1 (tarball Tue May 12 15:39:23 UTC 2015)\nCopyright\
    \ (C) 2002-2014 Novell, Inc, Xamarin Inc and Contributors. www.mono-project.com\n\
    \    TLS:               __thread\n    SIGSEGV:          altstack\n    Notifications:\
    \    epoll\n    Architecture:     amd64\n    Disabled:         none\n    Misc:\
    \             softdebug\n    LLVM:             supported, not enabled.\n    GC:\
    \               sgen\nagusk@ubuntu15:~$\n```\n\n#### 3.2.2 安装 libuv\n\nLibuv 是一个多平台异步\
    \ IO 库，由我们将用于托管 Web 应用程序的 KestrelHttpServer 使用。\n\n输入这些命令来安装 libuv 库。\n\n```bash\n\
    $ sudo apt-get install automake libtool curl\n$ curl -sSL https://github.com/libuv/libuv/archive/v1.4.2.tar.gz\
    \ | sudo tar -xz -C /usr/local/src/\n$ cd /usr/local/src/libuv-1.4.2\n$ sudo sh\
    \ autogen.sh\n$ sudo ./configure\n$ sudo make\n$ sudo make install\n$ sudo rm\
    \ -rf /usr/local/src/libuv-1.4.2 && cd ~/\n$ sudo ldconfig\n```\n\n```bash\nagusk@ubuntu15:~\n\
    in a given directory, LIBDIR, you must either use libtool, and\nspecify the full\
    \ pathname of the library, or use the `-LLIBDIR'\nflag during linking and do at\
    \ least one of the following:\n- add LIBDIR to the 'LD_LIBRARY_PATH' environment\
    \ variable\nduring execution\n- add LIBDIR to the 'LD_RUN_PATH' environment variable\n\
    during linking\n- use the '-Wl,-rpath -Wl,LIBDIR' linker flag\n- have your system\
    \ administrator add LIBDIR to '/etc/ld.so.conf'\n\nSee any operating system documentation\
