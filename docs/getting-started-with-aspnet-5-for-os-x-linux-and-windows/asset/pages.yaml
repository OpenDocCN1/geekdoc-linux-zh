- pgno: 12
  md: '# ### 2.2 Deploying ASP.NET 5


    To install ASP.NET on OS X, you can use brew, [http://brew.sh/](http://brew.sh/).
    Type these commands to install ASP.NET 5.


    ```

    $ brew tap aspnet/dnx

    $ brew update

    $ brew install dnvm

    ```


    ![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_12_0.png)


    If success, you can see a task which you should do. We must add dnvm on our profile.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_13_0.png)


    Type this command.


    ```

    $ nano ~/.bash_profile

    ```


    Then, you get nano editor. You can use another text editor. Add this script on
    `~/.bash_profile`.


    ```

    source dnvm.sh

    ```'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/2b788c7cc1c2fc37b428b6e7f92dcaed_14_0.png)


    If done, save this file. After that, close your Terminal and then open again so
    Terminal will load profile script.


    The next step is to upgrade. Type this command.


    ```

    $ dnvm upgrade

    ```'
  merge: -1
  img_proc: true
