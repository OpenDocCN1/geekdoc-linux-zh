    with running single-page applications. Further information about AngularJS, you
    can visit official website on http://angularjs.org/ .


    To integrate your application with AngularJS, you can download AngularJS on http://code.angularjs.org/.
    Choose AngularJS version you want to use. To use AngularJS on your web application,
    you just put it on your web page:


    ```

    ```html

    <script src="lib/angular.min.js"></script>

    ```

    ```


    This means AngularJS file will be downloaded from your local. You also can put
    AngularJS as follows.


    ```

    ```html

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.15/angular.min.js"></script>

    ```

    ```


    The following is our scenario:


    +   - User click a button

    +   - Program will request data from server via RESTful


