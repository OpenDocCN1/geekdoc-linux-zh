  md: "# ## 6.3 Writing Program\n\nIn this section, we write our ASP.NET 5 MVC program.\n\
    \n# ### 6.3.1 Creating Model\n\nFirstly, we create a model, called Product. The\
    \ following is code implementation.\n\n```\n```\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace WebDemo.Web.Models\n{\n    public class Product\n    {\n        [Required]\n\
    \        [MinLength(4)]\n        [Display( Name = \"Name\" )]\n        public\
    \ string Name { get; set; }\n        [Display( Name = \"Product Code\" )]\n  \
    \      public string ProductCode { get; set; }\n        [Display( Name = \"Quantity\"\
    \ )]\n        public int Quantity { get; set; }\n        [Display( Name = \"Price\"\
    \ )]\n        public double Price { get; set; }\n    }\n}\n```\n```\n\nSave this\
    \ code into a file, called Product.cs and store it into Models folder.\n\n# ###\
    \ 6.3.2 DUMMY Database\n\nIn this case, we don't access database directly so we\
    \ create a dummy database which generates product data. Create a file, called\
    \ DumpDatabase.cs and write this code.\n\n```\n```\nusing System;\nusing System.Collections.Generic;\n\
    \nusing WebDemo.Web.Models;\nnamespace WebDemo.Web.Database\n{\n    public class\
    \ DumpDatabase\n    {\n        private DumpDatabase(){}\n        public static\
    \ List<Product> GetAllProducts()\n```\n```"
  merge: -1
