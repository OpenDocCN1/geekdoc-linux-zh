  \ Boolean Equals(System.Object)\n    MethodInfo: Boolean Equals(System.Object, System.Object)\n\
  \    MethodInfo: Boolean ReferenceEquals(System.Object, System.Object)\n    MethodInfo:\
  \ Int32 GetHashCode()\n    MethodInfo: System.Type GetType()\n    MethodInfo: Void\
  \ Finalize()\n    MethodInfo: System.Object MemberwiseClone()\n    MethodInfo: Void\
  \ FieldSetter(System.String, System.String, System.Object)\n    MethodInfo: Void\
  \ FieldGetter(System.String, System.String, System.Object ByRef)\n    MethodInfo:\
  \ System.Reflection.FieldInfo GetFieldInfo(System.String, System.String)\n  ConstructorInfo:\
  \ Void .ctor()\n  Type: System.Collections.Generic.IComparer`1[T]\n    MethodInfo:\
  \ Int32 Compare(T, T)\n  Type: System.Collections.IEnumerator\n    MethodInfo: Boolean\
  \ MoveNext()\n    MethodInfo: System.Object get_Current()\n    MethodInfo: Void\
  \ Reset()\n    PropertyInfo: System.Object Current\n  Type: System.IDisposable\n\
  \    MethodInfo: Void Dispose()\n  Type: System.Collections.Generic.IEnumerator`1[T]\n\
  \    MethodInfo: T get_Current()\n    PropertyInfo: T Current\n  Type: System.ArraySegment`1[T]\n\
  \    MethodInfo: T[] get_Array()\n    MethodInfo: Int32 get_Offset()\n    MethodInfo:\
  \ Int32 get_Count()\n    MethodInfo: Int32 GetHashCode()\n    MethodInfo: Boolean\
  \ Equals(System.Object)\n    MethodInfo: Boolean Equals(System.ArraySegment`1[T])\n\
  \    MethodInfo: Boolean op_Equality(System.ArraySegment`1[T], System.ArraySegment`1[T])\n\
  \    MethodInfo: Boolean op_Inequality(System.ArraySegment`1[T], System.ArraySegment`1[T])\n\
  \  ConstructorInfo: Void .ctor(T[])\n  ConstructorInfo: Void .ctor(T[], Int32, Int32)\n\
  \  PropertyInfo: T[] Array\n  PropertyInfo: Int32 Offset\n  PropertyInfo: Int32\
  \ Count\n  FieldInfo: T[] _array\n  FieldInfo: Int32 _offset\n```\n\n由于 MemberInfo\
  \ 类是成员层次结构的根，所以有必要更深入地研究一下它。表 23-1 展示了 MemberInfo 类提供的几个只读属性和方法。这些属性和方法是一个类型的所有成员都通用的。不要忘了\
  \ **System.TypeInfo** 从 **MemberInfo** 派生。**TypeInfo** 也提供了表 23-1 列出的所有属性。\n\n表\
  \ 23-1 MemberInfo 的所有派生类型都通用的属性和方法\n\n| 成员名称 | 成员类型 | 说明 |\n|---|---|---|\n| **Name**\
  \ | 一个 **String** 属性 | 返回成员名称 |\n| **DeclaringType** | 一个 **Type** 属性 | 返回声明成员的\
  \ **Type** |\n| **Module** | 一个 **Module** 属性 | 返回声明成员的 **Module** |\n| **CustomAttributes**\
  \ | 该属性返回一个 **IEnumerable<CustomAttributeData>** | 返回一个集合，其中每个元素都标识了应用于该成员的一个定制特性的实例。定制特性可应用于任何成员。虽然\
  \ **Assembly** 不从 **MemberInfo** 派生，但它提供了可用于程序集的相同属性 |\n\n在查询 **DeclaredMembers**\
  \ 属性所返回的集合中，每个元素都是对层次结构中的一个具体类型的引用。虽然 **TypeInfo** 的 **DeclaredMembers** 属性能返回类型的所有成员，但还可利用\
  \ **TypeInfo** 提供的一些方法返回具有指定字符串名称的成员类型。例如，利用 **TypeInfo** 的 **GetDeclaredNestedType**，**GetDeclaredField**，**GetDeclaredMethod**，**GetDeclaredProperty**\
  \ 和 **GetDeclaredEvent** 方法，可分别返回一个 **TypeInfo**、**FieldInfo**、**MethodInfo**、**PropertyInfo**\
  \ 和 **EventInfo** 对象引用。而利用 **GetDeclaredMethods** 方法能返回由 **MethodInfo** 对象构成的集合，这些对象描述了和指定字符串名称匹配的一个(多个)方法。\n\
  \n图 23-2 总结了用于遍历反射对象模型的各种类型。基于 **AppDomain**，可发现其中加载的所有程序集。基于程序集，可发现构成它的所有模块。基于程序集或模块，可发现它定义的所有类型。基于类型，可发现它的嵌套类型、字段、构造器、方法、属性和事件。命名空间不是这个层次结构的一部分，因为它们只是从语法角度将相关类型聚集到一起。CLR\
  \ 不知道什么是命名空间。要列出程序集中定义的所有命名空间，需枚举程序集中的所有类型，并查看其 **Namespace** 属性。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_548_0.png)\n\
  \n图 23-2 应用程序用于遍历反射对象模型的各种类型\n\n基于一个类型，还可发现它实现的接口。基于构造器、方法、属性访问器方法或者事件的添加/删除方法，可调用\
  \ GetParameters 方法来获取由 ParameterInfo 对象构成的数组，从而了解成员的参数的类型。还可查询只读属性 ReturnParameter\
  \ 获得一个 ParameterInfo 对象，它详细描述了成员的返回类型。对于泛型类型或方法，可调用 GetGenericArguments 方法来获得类型参数的集合。最后，针对上述任何一项，都可查询\
  \ CustomAttributes 属性来获得应用于它们的自定义定制特性的集合。\n\n### 23.5.2 调用类型的成员\n\n发现类型定义的成员后可调用它们。“调用”(invoke)的确切含义取决于要调用的成员的种类。表\
  \ 23-2 展示了为了调用(invoke)一种成员而需调用(call)的方法。\n\n表 23-2 如何调用成员\n\n| 成员类型 | 调用(invoke)成员而需调用(call)的方法\
  \ |\n|---|---|\n| FieldInfo | 调用 GetValue 获取字段的值<br>调用 SetValue 设置字段的值 |\n| ConstructorInfo\
  \ | 调用 Invoke 构造类型的实例并调用构造器 |\n| MethodInfo | 调用 Invoke 来调用类型的方法 |\n| PropertyInfo\
  \ | 调用 GetValue 来调用属性的 get 访问器方法<br>调用 SetValue 来调用属性的 set 访问器方法 |\n| EventInfo\
  \ | 调用 AddEventHandler 来调用事件的 add 访问器方法<br>调用 RemoveEventHandler 来调用事件的 remove 访问器方法\
  \ |\n\nPropertyInfo 类型代表与属性有关的元数据信息(参见第 10 章“属性”)；也就是说，PropertyInfo 提供了 CanRead、CanWrite\
  \ 和 PropertyType 只读属性，它们指出属性是否可读和可写，以及属性的数据类型是什么。PropertyInfo 还提供了只读 GetMethod 和\
  \ SetMethod 属性，它们返回代表属性 get 和 set 访问器方法的 MethodInfo 对象。PropertyInfo 的 GetValue 和\
  \ SetValue 方法只是为了提供方便：在内部，它们会自己调用合适的 MethodInfo 对象。为了支持有参属性(C#的索引器)，GetValue 和 SetValue\
  \ 方法提供了一个 Object[] 类型的 index 参数。\n\nEventInfo 类型代表与事件有关的元数据信息(参见第 11 章“事件”)。EventInfo\
  \ 类型提供了只读 EventHandlerType 属性，返回事件的基础委托的 Type。EventInfo 类型还提供了只读 AddMethod 和 RemoveMethod\
  \ 属性，返回为事件增删委托的方法的 MethodInfo 对象。增删委托可调用这些 MethodInfo 对象，也可调用 EventInfo 类型提供的更好用的\
  \ AddEventHandler 和 RemoveEventHandler 方法。\n\n以下示例应用程序演示了用反射来访问类型成员的各种方式。SomeType\
  \ 类包含多种成员：一个私有字段(m_someField)；一个公共构造器(SomeType)，它获取一个传引用的 Int32 实参；一个公共方法(ToString)；一个公共属性(SomeProp)；以及一个公共事件(SomeEvent)。定义好\
  \ SomeType 类型后，我提供了三个不同的方法，它们利用反射来访问 SomeType 的\n\n成员。三个方法用不同的方式做相同的事情。\n\n- **BindToMemberThenInvokeTheMember**\
  \ 方法演示了如何绑定到成员并调用它。\n- **BindToMemberCreateDelegateToMemberThenInvokeTheMember**\
  \ 方法演示了如何绑定到一个对象或成员，然后创建一个委托来引用该对象或成员。通过委托来调用的速度很快。如果需要在相同的对象上多次调用相同的成员，这个技术的性能比上一个好。\n\
  - **UseDynamicToBindAndInvokeTheMember** 方法演示了如何利用 C# 的 **dynamic** 基元类型（参见第 5 章“基元类型、引用类型和值类型”）简化成员访问语法。此外，在相同类型的不同对象上调用相同成员时，这个技术还能提供不错的性能，因为针对每个类型，绑定都只会发生一次。而且可以缓存起来，以后多次调用的速度会非常快。用这个技术也可以调用不同类型的对象的成员。\n\
  \n```csharp\nusing System;\nusing System.Reflection;\nusing Microsoft.CSharp.RuntimeBinder;\n\
  using System.Linq;\n\n// 该类用于演示反射机制，\n// 其中定义了一个字段、构造器、方法、属性和一个事件\ninternal sealed\
  \ class SomeType {\n    private Int32 m_someField;\n    public SomeType(ref Int32\
  \ x) { x *= 2; }\n    public override String ToString() { return m_someField.ToString();\
  \ }\n    public Int32 SomeProp\n    {\n        get { return m_someField; }\n   \
  \     set {\n            if (value < 1)\n                throw new ArgumentOutOfRangeException(\"\
  value\");\n            m_someField = value;\n        }\n    }\n    public event\
  \ EventHandler SomeEvent;\n    private void NoCompilerWarnings() { SomeEvent.ToString();\
  \ }\n}\n\npublic static class Program {\n    public static void Main()\n    {\n\
  \        Type t = typeof(SomeType);\n        BindToMemberThenInvokeTheMember(t);\n\
  \        Console.WriteLine();\n\n        BindToMemberCreateDelegateToMemberThenInvokeTheMember(t);\n\
  \        Console.WriteLine();\n\n        UseDynamicToBindAndInvokeTheMember(t);\n\
  \        Console.WriteLine();\n    }\n\n    private static void BindToMemberThenInvokeTheMember(Type\
  \ t) {\n        Console.WriteLine(\"BindToMemberThenInvokeTheMember\");\n\n    \
  \    // 构造实例\n        Type ctorArgument = Type.GetType(\"System.Int32&\");    //\
  \ 或者 typeof(Int32).MakeByRefType();\n        ConstructorInfo ctor = t.GetTypeInfo().DeclaredConstructors.First(\n\
  \            c => c.GetParameters()[0].ParameterType == ctorArgument);\n       \
  \ Object[] args = new Object[] { 12 }; // 构造器的实参\n        Console.WriteLine(\"x\
  \ before constructor called: \" + args[0]);\n        Object obj = ctor.Invoke(args);\n\
  \        Console.WriteLine(\"Type: \" + obj.GetType());\n        Console.WriteLine(\"\
  x after constructor returns: \" + args[0]);\n\n        // 读写字段\n        FieldInfo\
  \ fi = obj.GetType().GetTypeInfo().GetDeclaredField(\"m_someField\");\n        fi.SetValue(obj,\
  \ 33);\n        Console.WriteLine(\"someField: \" + fi.GetValue(obj));\n\n     \
  \   // 调用方法\n        MethodInfo mi = obj.GetType().GetTypeInfo().GetDeclaredMethod(\"\
  ToString\");\n        String s = (String)mi.Invoke(obj, null);\n        Console.WriteLine(\"\
  ToString: \" + s);\n\n        // 读写属性\n        PropertyInfo pi = obj.GetType().GetTypeInfo().GetDeclaredProperty(\"\
  SomeProp\");\n        try\n        {\n            pi.SetValue(obj, 0, null);\n \
  \       }\n        catch (TargetInvocationException e) {\n            if (e.InnerException.GetType()\
  \ != typeof(ArgumentOutOfRangeException)) throw;\n            Console.WriteLine(\"\
  Property set catch.\");\n        }\n        pi.SetValue(obj, 2, null);\n       \
  \ Console.WriteLine(\"SomeProp: \" + pi.GetValue(obj, null));\n\n        // 为事件添加和删除委托\n\
  \        EventInfo ei = obj.GetType().GetTypeInfo().GetDeclaredEvent(\"SomeEvent\"\
  );\n        EventHandler eh = new EventHandler(EventCallback); // See ei.EventHandlerType\n\
  \        ei.AddEventHandler(obj, eh);\n        ei.RemoveEventHandler(obj, eh);\n\
  \    }\n\n    // 添加到事件的回调方法\n    private static void EventCallback(Object sender,\
  \ EventArgs e) { }\n\n    private static void BindToMemberCreateDelegateToMemberThenInvokeTheMember(Type\
  \ t) {\n        Console.WriteLine(\"BindToMemberCreateDelegateToMemberThenInvokeTheMember\"\
  );\n\n        // 构造实例(不能创建对构造器的委托)\n        Object[] args = new Object[] { 12 };\
  \ // 构造器实参\n        Console.WriteLine(\"x before constructor called: \" + args[0]);\n\
  \        Object obj = Activator.CreateInstance(t, args);\n        Console.WriteLine(\"\
  Type: \" + obj.GetType().ToString());\n        Console.WriteLine(\"x after constructor\
  \ returns: \" + args[0]);\n\n        // 注意: 不能创建对字段的委托\n\n        // 调用方法\n    \
  \    MethodInfo mi = obj.GetType().GetTypeInfo().GetDeclaredMethod(\"ToString\"\
  );\n        var toString = mi.CreateDelegate<Func<String>>(obj);\n        String\
  \ s = toString();\n        Console.WriteLine(\"ToString: \" + s);\n\n        //\
  \ 读写属性\n        PropertyInfo pi = obj.GetType().GetTypeInfo().GetDeclaredProperty(\"\
  SomeProp\");\n        var setSomeProp = pi.SetMethod.CreateDelegate<Action<Int32>>(obj);\n\
  \        try {\n            setSomeProp(0);\n        }\n        catch (ArgumentOutOfRangeException)\
  \ {\n            Console.WriteLine(\"Property set catch.\");\n        }\n      \
  \  setSomeProp(2);\n    }\n```\n\n方法并传递那个 **Type** 对象引用。\n\n- 要将一个 **RuntimeTypeHandle**\
  \ 转换为 **Type** 对象，调用 **Type** 的静态方法 **GetTypeFromHandle**，并传递那个 **RuntimeTypeHandle**。\n\
  - 要将 **FieldInfo** 对象转换为一个 **RuntimeFieldHandle**，查询 **FieldInfo** 的实例只读属性 **FieldHandle**。\n\
  - 要将一个 **RuntimeFieldHandle** 转换为 **FieldInfo** 对象，调用 **FieldInfo** 的静态方法 **GetFieldFromHandle**。\n\
  - 要将 **MethodInfo** 对象转换为一个 **RuntimeMethodHandle**，查询 **MethodInfo** 的实例只读属性 **MethodHandle**。\n\
  - 要将一个 **RuntimeMethodHandle** 转换为 **MethodInfo** 对象，调用 **MethodInfo** 的静态方法 **GetMethodFromHandle**。\n\
  \n以下示例程序获取许多 **MethodInfo** 对象，把它们转换为 **RuntimeMethodHandle** 实例，并演示了转换前后的工作集的差异：\n\
  \n```csharp\nusing System;\nusing System.Reflection;\nusing System.Collections.Generic;\n\
  \npublic sealed class Program {\n    private const BindingFlags c_bf = BindingFlags.FlattenHierarchy\
  \ |\n        BindingFlags.Instance | BindingFlags.Static |\n        BindingFlags.Public\
  \ | BindingFlags.NonPublic;\n\n    public static void Main() {\n        // 显示在任何反射操作之前堆的大小\n\
  \        Show(\"Before doing anything\");\n\n        // 为 MSCorlib.dll 中的所有方法构建\
  \ MethodInfo 对象缓存\n        List<MethodBase> methodInfos = new List<MethodBase>();\n\
  \        foreach (Type t in typeof(Object).Assembly.GetExportedTypes()) {\n    \
  \        // 跳过任何泛型类型\n            if (t.IsGenericTypeDefinition) continue;\n\n \
  \           MethodBase[] mb = t.GetMethods(c_bf);\n            methodInfos.AddRange(mb);\n\
  \        }\n\n        // 显示当绑定所有方法之后，方法的个数和堆的大小\n        Console.WriteLine(\"# of\
  \ methods={0:N0}\", methodInfos.Count);\n        Show(\"After building cache of\
  \ MethodInfo objects\");\n\n        // 为所有 MethodInfo 对象构建 RuntimeMethodHandle 缓存\n\
  \        List<RuntimeMethodHandle> methodHandles =\n            methodInfos.ConvertAll<RuntimeMethodHandle>(mb\
  \ => mb.MethodHandle);\n\n        Show(\"Holding MethodInfo and RuntimeMethodHandle\
  \ cache\");\n        GC.KeepAlive(methodInfos);      // 阻止缓存被过早垃圾回收\n\n        methodInfos\
  \ = null;             // 现在允许缓存垃圾回收\n        Show(\"After freeing MethodInfo objects\"\
  );\n\n        methodInfos = methodHandles.ConvertAll<MethodBase>(\n            rmh\
  \ => MethodBase.GetMethodFromHandle(rmh));\n        Show(\"Size of heap after re-creating\
  \ MethodInfo objects\");\n        GC.KeepAlive(methodHandles);        // 阻止缓存被过早垃圾回收\n\
  \        GC.KeepAlive(methodInfos);          // 阻止缓存被过早垃圾回收\n\n        methodHandles\
  \ = null;               // 现在允许缓存垃圾回收\n        methodInfos = null;             \
  \    // 现在允许缓存垃圾回收\n        Show(\"After freeing MethodInfos and RuntimeMethodHandles\"\
  );\n    }\n\n    private static void Show(String s) {\n        Console.WriteLine(\"\
  Heap size={0,12:N0} - {1}\",\n            GC.GetTotalMemory(true), s);\n    }\n\
  }\n```\n\n编译并运行以上程序，在我的机器上得到以下输出：\n\n```text\nHeap size=      22,060 - Before doing\
  \ anything\n# \nHeap size=   3,996,640 - After building cache of MethodInfo objects\n\
  Heap size=   4,207,656 - Holding MethodInfo and RuntimeMethodHandle cache\nHeap\
  \ size=   3,847,352 - After freeing MethodInfo objects\nHeap size=   4,058,336 -\
  \ Size of heap after re-creating MethodInfo objects\nHeap size=      81,224 - After\
  \ freeing MethodInfos and RuntimeMethodHandles\n```\n"
- "## 第 24 章 运行时序列化\n\n**本章内容：**\n\n- 序列化/反序列化快速入门\n- 使类型可序列化\n- 控制序列化和反序列化\n- 格式化器如何序列化类型实例\n\
  - 控制序列化/反序列化的数据\n- 流上下文\n- 将类型序列化为不同的类型以及将对象反序列化为不同的对象\n- 序列化代理\n- 反序列化对象时重写程序集和/或类型\n\
  \n序列化是将对象或对象图①转换成字节流的过程。反序列化是将字节流转换回对象图的过程。在对象和字节流之间转换是很有用的机制。下面是一些例子。\n\n- 应用程序的状态（对象图）可轻松保存到磁盘文件或数据库中，并在应用程序下次运行时恢复。ASP.NET\
  \ 就是利用序列化和反序列化来保存和还原会话状态的。\n- 一组对象可轻松复制到系统的剪贴板，再粘贴回同一个或另一个应用程序。事实上，Windows 窗体和 Windows\
  \ Presentation Foundation（WPF）就利用了这个功能。\n- 一组对象可克隆并放到一边作为“备份”；与此同时，用户操纵一组“主”对象。\n\
  - 一组对象可轻松地通过网络发送给另一台机器上运行的进程。Microsoft .NET Framework 的 Remoting（远程处理）架构会对按值封送（marshaled\
  \ by value）的对象进行序列化和反序列化。这个技术还可跨 AppDomain 边界发送对象，具体如第 22 章 “CLR”\n\n① 本书将 object\
  \ graph 翻译成“对象图”。对象图是一个抽象的概念，代表的是对象系统在特定时间点的一个视图。另一个常用的术语 object diagram 则是指总体 object\
  \ graph 的一个子集。普通的对象模型（比如 UML 类图）描述的是对象之间的关系，而对象图侧重于它们的实例在特定时间点的状态。在面向对象应用程序中，相互关联的对象构成了一个复杂的网络。一个对象可能拥有或包含另一个对象，或者容纳了对另一个对象的引用。这样一来，不同的对象便相互链接起来了。这个对象网络便是对象图。它是一种比较抽象的结构，可在讨论应用程序的状态时使用它。注意，在\
  \ .NET Framework SDK 中文文档中，由对象相互连接而构成的对象图被称为“连接对象图形”。——译注\n\n\n\n“寄宿和 AppDomain”所述。\n\
  \n除了上述应用，一旦将对象序列化成内存中的字节流，就可方便地以一些更有用的方式处理数据，比如进行加密和压缩。\n\n由于序列化如此有用，所以许多程序员耗费了大量时间写代码执行这些操作。历史上，这种代码很难编写，相当繁琐，还容易出错。开发人员需要克服的难题包括通信协议、客户端/服务器数据类型不匹配（比如低位优先/高位优先①问题）、错误处理、一个对象引用了其他对象、in\
  \ 和 out 参数以及由结构构成的数组等。\n\n① little-endian/big-endian，也译成小端和大端。——译注\n\n让人高兴的是，.NET\
  \ Framework 内建了出色的序列化和反序列化支持。上述所有难题都迎刃而解，而且 .NET Framework 是在后台悄悄帮你解决的。开发者现在只需负责序列化之前和反序列化之后的对象处理，中间过程由\
  \ .NET Framework 负责。\n\n本章解释了 .NET Framework 如何公开它的序列化和反序列化服务。对于几乎所有数据类型，这些服务的默认行为已经足够。也就是说，几乎不需要做任何工作就可以使自己的类型“可序列化”。但对于少量类型，序列化服务的默认行为是不够的。幸好，序列化服务的扩展性极佳，本章将解释如何利用这些扩展性机制，在序列化或反序列化对象时采取一些相当强大的操作。例如，本章演示了如何将对象的“版本\
  \ 1”序列化到磁盘文件，一年后把它反序列化成“版本 2”的对象。\n\n> **注意** 本章重点在于 CLR 的运行时序列化技术。这种技术对 CLR 数据类型有很深刻的理解，能将对象的所有公共、受保护、内部甚至私有字段序列化到压缩的二进制流中，从而获得很好的性能。要把\
  \ CLR 数据类型序列化成 XML 流，请参见 System.Runtime.Serialization.NetDataContractSerializer\
  \ 类。.NET Framework 还提供了其他序列化技术，它们主要是为 CLR 数据类型和非 CLR 数据类型之间的互操作而设计的。这些序列化技术用的是 System.Xml.Serialization.XmlSerializer\
  \ 类和 System.Runtime.Serialization.DataContractSerializer 类。\n\n### 24.1 序列化/反序列化快速入门\n\
  \n下面先来看一些代码：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
  \ System.IO;\nusing System.Runtime.Serialization.Formatters.Binary;\n\ninternal\
  \ static class QuickStart {\n    public static void Main() {\n        // 创建对象图以便把它们序列化到流中\n\
  \        var objectGraph = new List<String> { \"Jeff\", \"Kristin\", \"Aidan\",\
  \ \"Grant\" };\n        Stream stream = SerializeToMemory(objectGraph);\n\n    \
  \    // 为了演示，将一切都重置\n        stream.Position = 0;\n        objectGraph = null;\n\
  \n        // 反序列化对象，证明它能工作\n        objectGraph = (List<String>) DeserializeFromMemory(stream);\n\
  \        foreach (var s in objectGraph) Console.WriteLine(s);\n    }\n\n    private\
  \ static MemoryStream SerializeToMemory(Object objectGraph) {\n        // 构造流来容纳序列化的对象\n\
  \        MemoryStream stream = new MemoryStream();\n\n        // 构造序列化格式化器来执行所有真正的工作\n\
  \        BinaryFormatter formatter = new BinaryFormatter();\n\n        // 告诉格式化器将对象序列化到流中\n\
  \        formatter.Serialize(stream, objectGraph);\n\n        // 将序列化好的对象流返回给调用者\n\
  \        return stream;\n    }\n\n    private static Object DeserializeFromMemory(Stream\
  \ stream) {\n        // 构造序列化格式化器来做所有真正的工作\n        BinaryFormatter formatter =\
  \ new BinaryFormatter();\n\n        // 告诉格式化器从流中反序列化对象\n        return formatter.Deserialize(stream);\n\
  \    }\n}\n```\n\n一切似乎都很简单！**SerializeToMemory** 方法构造一个 **System.IO.MemoryStream**\
  \ 对象。这个对象明显要将序列化好的字节块放到哪里。然后，方法构造一个 **BinaryFormatter** 对象（在 **System.Runtime.Serialization.Formatters.Binary**\
  \ 命名空间中定义）。格式化器是实现了 **System.Runtime.Serialization.IFormatter** 接口的类型，它知道如何序列化和反序列化对象图。FCL\
  \ 提供了两个格式化器：**BinaryFormatter**（本例用的就是它）和 **SoapFormatter**（在 **System.Runtime.Serialization.Formatters.Soap**\
  \ 命名空间中定义，在 **System.Runtime.Serialization.Formatters.Soap.dll** 程序集中实现）。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_559_0.png)\n\
  \n> **注意** 从 .NET Framework 3.5 开始便废弃了 **SoapFormatter** 类，不要在生产代码中使用它。但在调试序列化代码时，它仍有一定用处，因为它能生成便于阅读的\
  \ XML 文本。要在生产代码中使用 XML 序列化和反序列化，请参见 **XmlSerializer** 和 **DataContractSerializer**\
  \ 类。\n\n序列化对象图只需调用格式化器的 **Serialize** 方法，并向它传递两样东西：对流对象的引用，以及对想要序列化的对象图的引用。流对象标识了序列化好的字节应该放到哪里，它可以是从\
  \ **System.IO.Stream** 抽象基类派生的任何类型的对象。也就是说，对象图可序列化成一个 **MemoryStream**、**FileStream**\
  \ 或者 **NetworkStream** 等。\n\n**Serialize** 的第二个参数是一个对象引用。这个对象可以是任何东西，可以是一个 **Int32**、**String**、**DateTime**、**Exception**、**List\\\
  <String\\>** 或者 **Dictionary\\<Int32, DateTime\\>** 等。**objectGraph** 参数引用的对象可引用其他对象。例如，**objectGraph**\
  \ 可引用一个集合，而这个集合引用了一组对象。这些对象还可继续引用其他对象。调用格式化器的 **Serialize** 方法时，对象图中的所有对象都被序列化到流中。\n\
  \n格式化器参考对每个对象的类型进行描述的元数据，从而了解如何序列化完整的对象图。序列化时，**Serialize** 方法利用反射来查看每个对象的类型中都有哪些实例字段。在这些字段中，任何一个引用了其他对象，格式化器的\
  \ **Serialize** 方法就知道那些对象也要进行序列化。\n\n格式化器的算法非常智能。它们知道如何确保对象图中的每个对象都只序列化一次。换言之，如果对象图中的两个对象相互引用，格式化器会检测到这一点，每个对象都只序列化一次，避免发生死循环。\n\
  \n在上述代码的 **SerializeToMemory** 方法中，当格式化器的 **Serialize** 方法返回后，**MemoryStream** 直接返回给调用者。应用程序可以按照自己希望的任何方式利用这个字节数组的内容。例如，可以把它保存到文件中、复制到剪贴板或者通过网络发送等。\n\
  \n**DeserializeFromMemory** 方法将流反序列化为对象图。该方法比用于序列化对象图的方法还要简单。在代码中，我构造了一个 **BinaryFormatter**，然后调用它的\
  \ **Deserialize** 方法。这个方法获取流作为参数，返回对反序列化好的对象图中的根对象的一个引用。\n\n在内部，格式化器的 **Deserialize**\
  \ 方法检查流的内容，构造流中所有对象的实例，并初始化所有这些对象中的字段，使它们具有与当初序列化时相同的值。通常要将 **Deserialize** 方法返回的对象引用转型为应用程序期待的类型。\n\
  \n> **注意** 下面是一个有趣而实用的方法，它利用序列化创建对象的深拷贝（或者说克隆体）：\n\n```csharp\nprivate static Object\
  \ DeepClone(Object original) {\n    // 构造临时内存流\n    using (MemoryStream stream =\
  \ new MemoryStream()) {\n\n        // 构造序列化格式化器来执行所有实际的工作\n        BinaryFormatter\
  \ formatter = new BinaryFormatter();\n\n        // 这一行在本章 24.6 节“流上下文”解释\n     \
  \   formatter.Context = new StreamingContext(StreamingContextStates.Clone);\n\n\
  \        // 将对象图序列化到内存流中\n        formatter.Serialize(stream, original);\n\n   \
  \     // 反序列化前，定位到内存流的起始位置\n        stream.Position = 0;\n\n        // 将对象图反序列化成一组新对象，\n\
  \        // 向调用者返回对象图（深拷贝）的根\n        return formatter.Deserialize(stream);\n  \
  \  }\n}\n```\n\n有几点需要注意。首先，是由你来保证代码为序列化和反序列化使用相同的格式化器。例如，不要写代码用 SoapFormatter 序列化一个对象图，再用\
  \ BinaryFormatter 反序列化。Deserialize 如果解译不了流的内容会抛出 System.Runtime.Serialization.SerializationException\
  \ 异常。\n\n其次，可将多个对象图序列化到一个流中，这是很有用的一个操作。例如，假定有以下两个类定义：\n\n```csharp\n[Serializable]\
  \ internal sealed class Customer    { /* ... */ }\n[Serializable] internal sealed\
  \ class Order       { /* ... */ }\n```\n\n然后，在应用程序的主要类中定义了以下静态字段：\n\n```csharp\n\
  private static List<Customer> s_customers       = new List<Customer>();\nprivate\
  \ static List<Order>    s_pendingOrders   = new List<Order>();\nprivate static List<Order>\
  \    s_processedOrders = new List<Order>();\n```\n\n现在，可利用如下所示的方法将应用程序的状态序列化到单个流中：\n\
  \n```csharp\nprivate static void SaveApplicationState(Stream stream) {\n    // 构造序列化格式化器来执行所有实际的工作\n\
  \    BinaryFormatter formatter = new BinaryFormatter();\n\n    // 序列化我们的应用程序的完整状态\n\
  \    formatter.Serialize(stream, s_customers);\n    formatter.Serialize(stream,\
  \ s_pendingOrders);\n    formatter.Serialize(stream, s_processedOrders);\n}\n```\n\
  \n要重新构建应用程序的状态，可以使用如下所示的一个方法反序列化状态：\n\n```csharp\nprivate static void RestoreApplicationState(Stream\
  \ stream) {\n    // 构造序列化格式化器来执行所有实际的工作\n    BinaryFormatter formatter = new BinaryFormatter();\n\
  \n    // 反序列化应用程序的完整状态（和序列化时的顺序一样）\n    s_customers = (List<Customer>)      formatter.Deserialize(stream);\n\
  \    s_pendingOrders = (List<Order>)     formatter.Deserialize(stream);\n    s_processedOrders\
  \ = (List<Order>)   formatter.Deserialize(stream);\n}\n```\n\n最后一个注意事项与程序集有关。序列化对象时，类型的全名和类型定义程序集的全名会被写入流。BinaryFormatter\
  \ 默认输出程序集的完整标识，其中包括程序集的文件名（无扩展名）、版本号、语言文化以及公钥信息。反序列化对象时，格式化器首先获取程序集标识信息，并通过调用 System.Reflection.Assembly\
  \ 的 Load 方法（参见 23.1 节“程序集加载”），确保程序集已加载到正在执行的 AppDomain 中。\n\n程序集加载好之后，格式化器在程序集中查找与要反序列化的对象匹配的类型。找不到匹配类型就抛出异常，不再对更多的对象进行反序列化。找到匹配的类型，就创建类型的实例，并用流中包含的值对其字段进行初始化。如果类型中的字段与流中读取的字段名不完全匹配，就抛出\
  \ SerializationException 异常，不再对更多的对象进行反序列化。本章以后会讨论一些高级机制，它们允许你覆盖某些行为。\n\n本节讲述了序列化和反序列化对象图的基础知识。之后的小节将讨论如何定义自己的可序列化类型。还讨论了如何利用一些机制对序列化和反序列化进行更好的控制。\n\
  \n> **注意** 序列化对象图时，也许有的对象的类型能序列化，有的不能。考虑到性能，在序列化之前，格式化器不会验证对象图中的所有对象都能序列化。所以，序列化对象图时，在抛出\
  \ SerializationException 异常之前，完全有可能已经有一部分对象序列化到流中。如果发生这种情况，流中就会包含已损坏的数据。序列化对象图时，如果你认为也许有一些对象不可序列化，那么写的代码就应该能得体地从这种情况中恢复。一个方案是先将对象序列化到一个\
  \ MemoryStream 中。然后，如果所有对象都成功序列化，就可以将 MemoryStream 中的字节复制到你真正希望的目标流中（比如文件和网络）。\n\
  \n**SerializableAttribute** 这个定制特性只能应用于引用类型（class）、值类型（struct）、枚举类型（enum）和委托类型（delegate）。注意，枚举和委托类型总是可序列化的，所以不必显式应用\
  \ SerializableAttribute 特性。除此之外，SerializableAttribute 特性不会被派生类型继承。所以，给定以下两个类型定义，那么\
  \ Person 对象可序列化，Employee 对象则不可：\n\n```csharp\n[Serializable]\ninternal class Person\
  \ { ... }\n\ninternal class Employee : Person { ... }\n```\n\n解决方案是也向 Employee 类型应用\
  \ SerializableAttribute 特性：\n\n```csharp\n[Serializable]\ninternal class Person\
  \ { ... }\n\n[Serializable]\ninternal class Employee : Person { ... }\n```\n\n上述问题很容易修正，反之则不然。如果基类型没有应用\
  \ SerializableAttribute 特性，那么很难想象如何从它派生出可序列化的类型。但这样设计是有原因的：如果基类型不允许它的实例序列化，它的字段就不能序列化，因为基对象实际是派生对象的一部分。这正是\
  \ System.Object 已经很体贴地应用了 SerializableAttribute 特性的原因。\n\n> **注意** 一般建议将你定义的大多数类型都设置成可序列化。毕竟，这样能为类型的用户提供很大的灵活性。但必须注意的是，序列化会读取对象的所有字段，不管这些字段声明为\
  \ public、protected、internal 还是 private。如果类型的实例要包含敏感或安全数据（比如密码），或者数据在转移之后便没有含义或者没有值，就不应使类型变得可序列化。\n\
  > \n> 如果使用的类型不是为序列化而设计的，而且手上没有类型的源代码，无法从源头添加序列化支持，也不必气馁。在本章最后的 24.9 节“反序列化对象时重写程序集和/或类型”中，我会解释如何使任何不可序列化的类型变得可序列化。\n\
  \n以下代码演示了如何修改 **Circle** 类型来修正这个问题：\n\n```csharp\n[Serializable]\ninternal class\
  \ Circle {\n    private Double m_radius;   // 半径\n\n    [NonSerialized]\n    private\
  \ Double m_area;     // 面积\n\n    public Circle(Double radius) {\n        m_radius\
  \ = radius;\n        m_area = Math.PI * m_radius * m_radius;\n    }\n\n    [OnDeserialized]\n\
  \    private void OnDeserialized(StreamingContext context) {\n        m_area = Math.PI\
  \ * m_radius * m_radius;\n    }\n}\n```\n\n修改过的 **Circle** 类包含一个标记了 **System.Runtime.Serialization.OnDeserializedAttribute**\
  \ 定制特性的方法①。每次反序列化类型的实例，格式化器都会检查类型中是否定义了应用了该特性的方法。如果是，就调用该方法。调用这个方法时，所有可序列化的字段都会被正确设置。在该方法中，可能需要访问这些字段来执行一些额外的工作，从而确保对象的完全反序列化。\n\
  \n在上述 **Circle** 修改版本中，我调用 **OnDeserialized** 方法，使用 **m_radius** 字段来计算圆的面积，并将结果放到\
  \ **m_area** 字段中。这样 **m_area** 就有了我们希望的值（314.159）。\n\n除了 **OnDeserializedAttribute**\
  \ 这个定制特性，**System.Runtime.Serialization** 命名空间还定义了包括 **OnSerializingAttribute**、**OnSerializedAttribute**\
  \ 和 **OnDeserializingAttribute** 在内的其他定制特性。可将它们应用于类型中定义的方法，对序列化和反序列化过程进行更多的控制。在下面这个类中，这些特性被应用于不同的方法：\n\
  \n```csharp\n[Serializable]\npublic class MyType {\n    Int32 x, y; [NonSerialized]\
  \ Int32 sum;\n\n    public MyType(Int32 x, Int32 y) {\n        this.x = x; this.y\
  \ = y; sum = x + y;\n    }\n\n    [OnDeserializing]\n    private void OnDeserializing(StreamingContext\
  \ context) {\n        // 举例：在这个类型的新版本中，为字段设置默认值\n    }\n\n    [OnDeserialized]\n\
  \    private void OnDeserialized(StreamingContext context) {\n        // 举例：根据字段值初始化瞬时状态（比如\
  \ sum 的值）\n    }\n}\n```\n\n① 要在对象反序列化时调用一个方法，**System.Runtime.Serialization.OnDeserialized**\
  \ 定制特性是首选方案，而不是让类型实现 **System.Runtime.Serialization.IDeserializationCallback** 接口的\
  \ **OnDeserialization** 方法。\n\n\n\n```csharp\nsum = x + y;\n}\n\n[OnSerializing]\n\
  private void OnSerializing(StreamingContext context) {\n    // 举例：在序列化前，修改任何需要修改的状态\n\
  }\n\n[OnSerialized]\nprivate void OnSerialized(StreamingContext context) {\n   \
  \ // 举例：在序列化后，恢复任何需要恢复的状态\n}\n}\n```\n\n使用这 4 个属性中的任何一个时，你定义的方法必须获取一个 StreamingContext\
  \ 参数（在本章后面的 24.6 节“流上下文”中讨论）并返回 void。方法名可以是你希望的任何名称。另外，应将方法声明为 private，以免它被普通的代码调用；格式化器运行时有充足的安全权限，所以能调用私有方法。\n\
  \n> **注意** 序列化一组对象时，格式化器首先调用对象的标记了 OnSerializing 特性的所有方法。接着，它序列化对象的所有字段。最后，调用对象的标记了\
  \ OnSerialized 特性的所有方法。类似地，反序列化一组对象时，格式化器首先调用对象的标记了 OnDeserializing 特性的所有方法。然后，它反序列化对象的所有字段。最后，它调用对象的标记了\
  \ OnDeserialized 特性的所有方法。\n>\n> 还要注意，在反序列化期间，当格式化器看到类型提供的一个方法标记了 OnDeserialized\
  \ 特性时，格式化器会将这个对象的引用添加到一个内部列表中。所有对象都反序列化后，格式化器反向遍历列表，调用每个对象的 OnDeserialized 方法。调用这个方法后，所有可序列化的字段都会被正确设置，可访问这些字段来执行任何必要的、进一步的工作，从而将对象完整地反序列化。之所以要以相反的顺序调用这些方法，因为这样才能使内层对象先于外层对象完成反序列化。\n\
  >\n> 例如，假定一个集合对象（比如 Hashtable 或 Dictionary）内部用一个哈希表维护它的数据项列表。集合对象类型可实现一个标记了 OnDeserialized\
  \ 特性的方法。即使集合对象先反序列化（先于它包含的数据项），它的 OnDeserialized 方法也会最后调用（在调用完它的数据项的所有 OnDeserialized\
  \ 方法之后）。这样一来，所有数据项在反序列化后，它们的所有字段都能得到正确的初始化，以便计算出一个好的哈希码值。然后，集合对象创建它的内部哈希桶，并利用数据项的哈希码将数据项放到桶中。本章稍后的\
  \ 24.5 节“控制序列化/反序列化的数据”会提供一个例子，它展示了 Dictionary 类如何利用这个技术。\n\n如果序列化类型的实例，在类型中添加新字段，然后试图反序列化不包含新字段的对象，格式化器会抛出\
  \ SerializationException 异常，并显示一条消息告诉你流中要反序列化的数据包含错误的成员数目。这非常不利于版本控制，因为我们经常都要在类型的新版本中添加新字段。幸好，这时可以利用\
  \ **System.Runtime.Serialization.OptionalFieldAttribute** 特性。\n\n类型中新增的每个字段都要应用\
  \ **OptionalFieldAttribute** 特性。然后，当格式化器看到该特性应用于一个字段时，就不会因为流中的数据不包含这个字段而抛出 **SerializationException**。\n\
  \n### 24.4 格式化器如何序列化类型实例\n\n本节将深入探讨格式化器如何序列化对象的字段。掌握这些知识后，可以更容易地理解本章后面要解释的一些更高级的序列化和反序列化技术。\n\
  \n为了简化格式化器的操作，FCL 在 **System.Runtime.Serialization** 命名空间提供了一个 **FormatterServices**\
  \ 类型。该类型只包含静态方法，而且该类型不能实例化。以下步骤描述了格式化器如何自动序列化类型应用了 **SerializableAttribute** 特性的对象。\n\
  \n1. 格式化器调用 **FormatterServices** 的 **GetSerializableMembers** 方法：\n\n    ```csharp\n\
  \    public static MemberInfo[] GetSerializableMembers(Type type, StreamingContext\
  \ context);\n    ```\n\n    这个方法利用反射获取类型的 **public** 和 **private** 实例字段(标记了 **NonSerializedAttribute**\
  \ 特性的字段除外)。方法返回由 **MemberInfo** 对象构成的数组，其中每个元素都对应一个可序列化的实例字段。\n\n2. 对象被序列化，**System.Reflection.MemberInfo**\
  \ 对象数组传给 **FormatterServices** 的静态方法 **GetObjectData**：\n\n    ```csharp\n    public\
  \ static Object[] GetObjectData(Object obj, MemberInfo[] members);\n    ```\n\n\
  \    这个方法返回一个 **Object** 数组，其中每个元素都标识了被序列化的那个对象中的一个字段的值。这个 **Object** 数组和 **MemberInfo**\
  \ 数组是并行(parallel)的；换言之，**Object** 数组中的元素 0 是 **MemberInfo** 数组中的元素 0 所标识的那个成员的值。\n\
  \n3. 格式化器将程序集标识和类型的完整名称写入流中。\n\n4. 格式化器然后遍历两个数组中的元素，将每个成员的名称和值写入流中。\n\n以下步骤描述了格式化器如何自动反序列化类型应用了\
  \ **SerializableAttribute** 特性的对象。\n\n1. 格式化器从流中读取程序集标识和完整类型名称。如果程序集当前没有加载到 **AppDomain**\
  \ 中，就加载它(这一点前面已经讲过了)。如果程序集不能加载，就抛出一个 **SerializationException** 异常，对象不能反序列化。如果程序集已加载，格式化器将程序集标识信息和类型全名传给\
  \ **FormatterServices** 的静态方法 **GetTypeFromAssembly**：\n\n    ```csharp\n    public\
  \ static Type GetTypeFromAssembly(Assembly assem, String name);\n    ```\n\n   \
  \ 这个方法返回一个 **System.Type** 对象，它代表要反序列化的那个对象的类型。\n\n> **重要提示** ISerializable 接口和特殊构造器旨在由格式化器使用。但其他代码可能调用\
  \ GetObjectData 来返回敏感数据。另外，其他代码可能构造对象，并传入损坏的数据。因此，建议向 GetObjectData 方法和特殊构造器应用以下特性：\n\
  >\n> ```csharp\n> [SecurityPermissionAttribute(SecurityAction.Demand, SerializationFormatter\
  \ = true)]\n> ```\n\n格式化器序列化对象图时会检查每个对象。如果发现一个对象的类型实现了 **ISerializable** 接口，就会忽略所有定制特性，改为构造新的\
  \ **System.Runtime.Serialization.SerializationInfo** 对象。该对象包含了要为对象序列化的值的集合。\n\n\
  构造 **SerializationInfo** 对象时，格式化器要传递两个参数：**Type** 和 **System.Runtime.Serialization.IFormatterConverter**。**Type**\
  \ 参数标识要序列化的对象。唯一性地标识一个类型需要两个部分的信息：类型的字符串名称及其程序集标识(包括程序集名、版本、语言文化和公钥)。构造好的 **SerializationInfo**\
  \ 对象包含类型的全名(通过在内部查询 **Type** 的 **FullName** 属性)，这个字符串会存储到一个私有字段中。如果你想获取类型的全名，可查询\
  \ **SerializationInfo** 的 **FullTypeName** 属性。类似地，构造器获取类型的定义程序集(通过在内部查询 **Type**\
  \ 的 **Module** 属性，再查询 **Module** 的 **Assembly** 属性，再查询 **Assembly** 的 **FullName**\
  \ 属性)，这个字符串会存储在一个私有字段中。如果你想获取程序集的标识，可查询 **SerializationInfo** 的 **AssemblyName**\
  \ 属性。\n\n> **注意** 虽然可以设置一个 **SerializationInfo** 的 **FullTypeName** 和 **AssemblyName**\
  \ 属性，但不建议这样做。如果想更改被序列化的类型，建议调用 **SerializationInfo** 的 **SetType** 方法，传递对目标 **Type**\
  \ 对象的引用。调用 **SetType** 可确保类型的全名和定义程序集被正确设置。本章后面的 24.7 节“类型序列化为不同类型以及对象反序列化为不同对象”将展示调用\
  \ **SetType** 的一个例子。\n\n构造好并初始化好 **SerializationInfo** 对象后，格式化器调用类型的 **GetObjectData**\
  \ 方法，向它传递对 **SerializationInfo** 对象的引用。**GetObjectData** 方法决定需要哪些信息来序列化对象，并将这些信息添加到\
  \ **SerializationInfo** 对象中。**GetObjectData** 调用 **SerializationInfo** 类型提供的 **AddValue**\
  \ 方法的众多重载版本之一来指定要序列化的信息。针对要添加的每个数据，都要调用一次 **AddValue**。\n\n以下代码展示了 **Dictionary<TKey,\
  \ TValue>** 类型如何实现 **ISerializable** 和 **IDeserializationCallback** 接口来控制其对象的序列化和反序列化。\n\
  \n```csharp\n[Serializable]\npublic class Dictionary<TKey, TValue>: ISerializable,\
  \ IDeserializationCallback {\n    // 私有字段放在这里(未列出)\n\n    private SerializationInfo\
  \ m_siInfo; // 只用于反序列化\n\n    // 用于控制反序列化的特殊构造器（这是 ISerializable 需要的）\n    [SecurityPermissionAttribute(SecurityAction.Demand,\
  \ SerializationFormatter = true)]\n    protected Dictionary(SerializationInfo info,\
  \ StreamingContext context) {\n        // 反序列化期间，为 OnDeserialization 保存 SerializationInfo\n\
  \        m_siInfo = info;\n    }\n\n    // 用于控制序列化的方法\n    [SecurityCritical]\n\
  \    public virtual void GetObjectData(SerializationInfo info, StreamingContext\
  \ context) {\n        info.AddValue(\"Version\", m_version);\n        info.AddValue(\"\
  Comparer\", m_comparer, typeof(IEqualityComparer<TKey>));\n        info.AddValue(\"\
  HashSize\", (m_buckets == null) ? 0 : m_buckets.Length);\n        if (m_buckets\
  \ != null) {\n            KeyValuePair<TKey, TValue>[] array = new KeyValuePair<TKey,\
  \ TValue>[Count];\n            CopyTo(array, 0);\n            info.AddValue(\"KeyValuePairs\"\
  , array, typeof(KeyValuePair<TKey, TValue>[]));\n        }\n    }\n\n    // 所有 key/value\
  \ 对象都反序列化好之后调用的方法\n    void IDeserializationCallback.OnDeserialization(Object sender)\
  \ {\n        if (m_siInfo == null) return; // 从不设置，直接返回\n\n        Int32 num = m_siInfo.GetInt32(\"\
  Version\");\n        Int32 num2 = m_siInfo.GetInt32(\"HashSize\");\n        m_comparer\
  \ = (IEqualityComparer<TKey>)\n            m_siInfo.GetValue(\"Comparer\", typeof(IEqualityComparer<TKey>));\n\
  \        if (num2 != 0) {\n            m_buckets = new Int32[num2];\n          \
  \  for (Int32 i = 0; i < m_buckets.Length; i++) m_buckets[i] = -1;\n           \
  \ m_entries = new Entry<TKey, TValue>[num2];\n            m_freeList = -1;\n   \
  \         KeyValuePair<TKey, TValue>[] pairArray = (KeyValuePair<TKey, TValue>[])\n\
  \                m_siInfo.GetValue(\"KeyValuePairs\", typeof(KeyValuePair<TKey,\
  \ TValue>[]));\n            if (pairArray == null)\n                ThrowHelper.ThrowSerializationException(\n\
  \                    ExceptionResource.Serialization_MissingKeys);\n\n         \
  \   for (Int32 j = 0; j < pairArray.Length; j++) {\n                if (pairArray[j].Key\
  \ == null)\n                    ThrowHelper.ThrowSerializationException(\n     \
  \                   ExceptionResource.Serialization_NullKey);\n\n              \
  \  Insert(pairArray[j].Key, pairArray[j].Value, true);\n            }\n        }\
  \ else { m_buckets = null; }\n        m_version = num;\n        m_siInfo = null;\n\
  \    }\n}\n```\n\n每个 **AddValue** 方法都获取一个 **String** 名称和一些数据。数据一般是简单的值类型，比如 **Boolean、Char、Byte、SByte、Int16、UInt16、Int32、UInt32、Int64、UInt64、Single、Double、Decimal**\
  \ 或者 **DateTime**。然而，还可以在调用 **AddValue** 时向它传递对一个 **Object**（比如一个 **String**）的引用。**GetObjectData**\
  \ 添加好所有必要的序列化信息之后，会返回格式化器。\n\n> **注意** 务必调用 AddValue 方法的某个重载版本为自己的类型添加序列化信息。如果一个字段的类型实现了\
  \ ISerializable 接口，就不要在字段上调用 GetObjectData。相反，调用 AddValue 来添加字段；格式化器会注意到字段的类型实现了\
  \ ISerializable，会帮你调用 GetObjectData。如果自己在字段对象上调用 GetObjectData，格式化器便不知道在对流进行反序列化时创建新对象。\n\
  \n现在，格式化器获取已添加到 SerializationInfo 对象的所有值，并把它们都序列化到流中。注意，我们还向 GetObjectData 方法传递了另一个参数，也就是对一个\
  \ System.Runtime.Serialization.StreamingContext 对象的引用。大多数类型的 GetObjectData 方法都会完全忽略这个参数，所以我现在不准备讨论它。相反，我准备把它放到本章后面的\
  \ 24.6 节“流上下文”讨论。\n\n知道了如何设置序列化所需的全部信息之后，再来看反序列化。格式化器从流中提取一个对象时，会为新对象分配内存(通过调用 System.Runtime.Serialization.FormatterServices\
  \ 类型的静态 GetUninitializedObject 方法)。最初，这个对象的所有字段都设为 0 或 null。然后，格式化器检查类型是否实现了 ISerializable\
  \ 接口。如果存在这个接口，格式化器就尝试调用一个特殊构造器，它的参数和 GetObjectData 方法的完全一致。\n\n如果你的类是密封类，强烈建议将这个特殊构造器声明为\
  \ private。这样可防止任何代码不慎调用它，从而提升安全性。如果不是密封类，应该将这个特殊构造器声明为 protected，确保只有派生类才能调用。注意，无论这个特殊构造器是如何声明的，格式化器都能调用它。\n\
  \n构造器获取一个 SerializationInfo 对象引用。在这个 SerializationInfo 对象中，包含了对象序列化时添加的所有值。特殊构造器可调用\
  \ GetBoolean、GetChar、GetByte、GetSByte、GetInt16、GetUInt16、GetInt32、GetUInt32、GetInt64、GetUInt64、GetSingle、GetDouble、GetDecimal、GetDateTime、GetString\
  \ 和 GetValue 等任何一个方法，向它传递与序列化一个值所用的名称对应的字符串。上述每个方法返回的值再用于初始化新对象的各个字段。\n\n反序列化对象的字段时，应调用和对象序列化时传给\
  \ AddValue 方法的值的类型匹配的 Get 方法。换言之，如果 GetObjectData 方法调用 AddValue 时传递的是一个 Int32 值，那么在反序列化对象时，应该为同一个值调用\
  \ GetInt32 方法。如果值在流中的类型和你试图获取(Get)的类型不符，格式化器会尝试用一个 IFormatterConverter 对象将流中的值转型成你指定的类型。\n\
  \n前面说过，构造 SerializationInfo 对象时，要向它传递类型实现了 IFormatterConverter 接口的一个对象。由于是格式化器负责构造\
  \ SerializationInfo 对象，所以要由它选择它想要的 IFormatterConverter 类型。Microsoft 的 BinaryFormatter\
  \ 和 SoapFormatter 类型总是构造 System.Runtime.Serialization.FormatterConverter 类型的实例。Microsoft\
  \ 的格式化器\n\n没有提供任何方式让你选择不同的 **IFormatterConverter** 类型。\n\n**FormatterConverter**\
  \ 类型调用 **System.Convert** 类的各种静态方法在不同的核心类型之间对值进行转换，比如将一个 **Int32** 转换成一个 **Int64**。然而，为了在其他任意类型之间转换一个值，**FormatterConverter**\
  \ 要调用 **Convert** 的 **ChangeType** 方法将序列化好的(或者原始的)类型转型为一个 **IConvertible** 接口，再调用恰当的接口方法。所以，要允许一个可序列化类型的对象反序列化成一个不同的类型，可考虑让自己的类型实现\
  \ **IConvertible** 接口。注意，只有在反序列化对象时调用一个 **Get** 方法，但发现它的类型和流中的值的类型不符时，才会使用 **FormatterConverter**\
  \ 对象。\n\n特殊构造器也可以不调用上面列出的各个 **Get** 方法，而是调用 **GetEnumerator**。该方法返回一个 **System.Runtime.Serialization.SerializationInfoEnumerator**\
  \ 对象，可用该对象遍历 **SerializationInfo** 对象中包含的所有值。枚举的每个值都是一个 **System.Runtime.Serialization.SerializationEntry**\
  \ 对象。\n\n当然，完全可以定义自己的类型，让它从实现了 **ISerializable** 的类型派生，并实现自己的 **GetObjectData**\
  \ 方法和特殊构造器。如果你的类型也实现了 **ISerializable**，那么在你实现的 **GetObjectData** 方法和特殊构造器中，必须调用基类中的同名方法，确保对象能正确序列化和反序列化。这一点务必牢记，否则对象是不能正确序列化和反序列化的。下一节将解释如何正确定义一个其基类未实现\
  \ **ISerializable** 接口的 **ISerializable** 类型。\n\n如果你的派生类型中没有任何额外的字段，因而没有特殊的序列化/反序列化需求，就完全不必实现\
  \ **ISerializable**。和所有接口成员相似，**GetObjectData** 是 **virtual** 的，调用它可以正确地序列化对象。此外，格式化器将特殊构造器视为“虚拟化”(virtualized)。换言之，反序列化期间，格式化器会检查要实例化的类型。如果那个类型没有提供特殊构造器，格式化器会扫描基类，直到它找到实现了特殊构造器的一个类。\n\
  \n> **重要提示**　特殊构造器中的代码一般从传给它的 **SerializationInfo** 对象中提取字段。提取字段后，不保证对象已完全反序列化，所以特殊构造器中的代码不应尝试操纵它提取的对象。\n\
  > \n> 如果你的类型必须访问提取的对象中的成员(比如调用方法)，建议你的类型提供一个应用了 **OnDeserialized** 特性的方法，或者让类型实现\
  \ **IDeserializationCallback** 接口的 **OnDeserialization** 方法(就像前面的 **Dictionary**\
  \ 示例中那样)。调用该方法时，所有对象的字段都已设置好。然而，对于多个对象来说，它们的 **OnDeserialized** 或 **OnDeserialization**\
  \ 方法的调用顺序是没有保障的。所以，虽然字段可能已初始化，但你仍然不知道被引用的对象是否已完全反序列化好(如果那个被引用的对象也提供了一个 **OnDeserialized**\
  \ 方法或者实现了 **IDeserializationCallback**)。\n\n#### 要实现 ISerializable 但基类型没有实现怎么办？\n\
  \n前面讲过，**ISerializable** 接口的功能非常强大，允许类型完全控制如何对类型的实例进行序列化和反序列化。但这个能力是有代价的：现在，该类型还要负责它的基类型的所有字段的序列化。如果基类型也实现了\
  \ **ISerializable** 接口，那么对基类型的字段进行序列化是很容易的。调用基类型的 **GetObjectData** 方法即可。\n\n总有一天需要定义类型来控制它的序列化，但发现它的基类没有实现\
  \ **ISerializable** 接口。在这种情况下，派生类必须手动序列化基类的字段，具体的做法是获取它们的值，并把这些值添加到 **SerializationInfo**\
  \ 集合中。然后，在你的特殊构造器中，还必须从集合中取出值，并以某种方式设置基类的字段。如果基类的字段是 **public** 或 **protected**\
  \ 的，那么一切都很容易实现。如果是 **private** 字段，就很难或者根本不可能实现。\n\n以下代码演示了如何正确实现 **ISerializable**\
  \ 的 **GetObjectData** 方法和它的特殊构造器，使基类的字段能被序列化：\n\n```csharp\n[Serializable]\ninternal\
  \ class Base {\n    protected String m_name = \"Jeff\";\n    public Base() { /*\
  \ Make the type instantiable */ }\n}\n\n[Serializable]\ninternal class Derived :\
  \ Base, ISerializable {\n    private DateTime m_date = DateTime.Now;\n    public\
  \ Derived() { /* Make the type instantiable*/ }\n\n    // 如果这个构造器不存在，便会引发一个 SerializationException\
  \ 异常。\n    // 如果这个类不是密封类，这个构造器就应该是 protected 的\n    [SecurityPermissionAttribute(SecurityAction.Demand,\
  \ SerializationFormatter = true)]\n    private Derived(SerializationInfo info, StreamingContext\
  \ context) {\n        // 为我们的类和基类获取可序列化的成员集合\n        Type baseType = this.GetType().BaseType;\n\
  \        MemberInfo[] mi = FormatterServices.GetSerializableMembers(baseType, context);\n\
  \n        // 从 info 对象反序列化基类的字段\n        for (Int32 i = 0; i < mi.Length; i++) {\n\
  \            // 获取字段，并把它设为反序列化好的值\n            FieldInfo fi = (FieldInfo)mi[i];\n\
  \            fi.SetValue(this, info.GetValue(baseType.FullName + \"+\" + fi.Name,\
  \ fi.FieldType));\n        }\n\n        // 反序列化这个类序列化的值\n        m_date = info.GetDateTime(\"\
  Date\");\n    }\n\n    [SecurityPermissionAttribute(SecurityAction.Demand, SerializationFormatter\
  \ = true)]\n    public virtual void GetObjectData(SerializationInfo info, StreamingContext\
  \ context) {\n        // 为这个类序列化希望的值\n        info.AddValue(\"Date\", m_date);\n\
  \n        // 获取我们的类和基类的可序列化的成员\n        Type baseType = this.GetType().BaseType;\n\
  \        MemberInfo[] mi = FormatterServices.GetSerializableMembers(baseType, context);\n\
  \n        // 将基类的字段序列化到 info 对象中\n        for (Int32 i = 0; i < mi.Length; i++)\
  \ {\n            // 为字段名附加基类型全名作为前缀\n            info.AddValue(baseType.FullName\
  \ + \"+\" + mi[i].Name,\n                ((FieldInfo)mi[i]).GetValue(this));\n \
  \       }\n    }\n\n    public override String ToString() {\n        return String.Format(\"\
  Name={0}, Date={1}\", m_name, m_date);\n    }\n}\n```\n\n上述代码有一个名为 **Base** 的基类，它只用\
  \ **SerializableAttribute** 定制特性进行了标识。从 **Base** 派生的是 **Derived** 类，它除了也用 **SerializableAttribute**\
  \ 特性进行标识，还实现了 **ISerializable** 接口。为了使局面变得更有趣，两个类都定义了一个名为 **m_name** 的 **String**\
  \ 字段。调用 **SerializationInfo** 的 **AddValue** 方法时不能添加多个同名的值。在上述代码中，解决这个问题的方案是在字段名前附加类名作为前缀，从而对每个字段进行标识。例如，当\
  \ **GetObjectData** 方法调用 **AddValue** 来序列化 **Base** 的 **m_name** 字段时，写入的值的名称是“**Base+m_name**”。\n\
  \n### 24.6 流上下文\n\n前面讲过，一组序列化好的对象可以有许多目的地：同一个进程、同一台机器上的不同进程、不同机器上的不同进程等。在一些比较少见的情况下，一个对象可能想知道它要在什么地方反序列化，从而以不同的方式生成它的状态。例如，如果对象中包装了\
  \ **Windows** 信号量(**semaphore**)对象，如果它知道要反序列化到同一个进程中，就可决定对它的内核句柄(**kernel handle**)进行序列化，这是因为内核句柄在一个进程中有效。但如果要反序列化到同一台计算机的不同进程中，就可决定对信号量的字符串名称进行序列化。最后，如果要反序列化到不同计算机上的进程，就可决定抛出异常，因为信号量只在一台机器内有效。\n\
  \n本章提到的大量方法都接受一个 **StreamingContext**(流上下文)。**StreamingContext** 结构是一个非常简单的值类型，它只提供了两个公共只读属性，如表\
  \ 24-1 所示。\n\n**表 24-1 StreamingContext 的公共只读属性**\n\n| 成员名称 | 成员类型 | 说明 |\n|---|---|---|\n\
  | **State** | **StreamingContextStates** | 一组位标志(bit flag)，指定要序列化/反序列化的对象的来源或目的地\
  \ |\n| **Context** | **Object** | 一个对象引用，对象中包含用户希望的任何上下文信息 |\n\n接受一个 **StreamingContext**\
  \ 结构的方法能检查 **State** 属性的位标志，判断要序列化/反序列化的对象的来源或目的地。表 24-2 展示了可能的位标志值。\n\n**MemberInfo**\
  \ 对象。序列化和反序列化这个数组后，那 5 个元素引用的应该还是一个 **MemberInfo** 对象(而不是分别引用 5 个不同的对象)。除此之外，这些元素引用的\
  \ **MemberInfo** 对象还必须实际对应于 **AppDomain** 中的一个特定成员。序列化数据库连接对象或者其他任何类型的对象时，这个功能也是很好用的。\n\
  \n- 对于远程控制的对象，CLR 序列化与服务器对象有关的信息。在客户端上反序列化时，会造成 CLR 创建一个代理对象。这个代理对象的类型有别于服务器对象的类型，但这对于客户端代码来说是透明的(客户端不需要关心这个问题)。客户端直接在代理对象上调用实例方法。然后，代理代码内部会通过远程调用将请求发送给服务器，由后者实际执行请求的操作。\n\
  \n下面来看看一些示例代码，它们展示了如何正确地序列化和反序列化单实例类型：\n\n```csharp\n    // 每个 AppDomain 应该只有这个类型的一个实例\n\
  \    [Serializable]\n    public sealed class Singleton : ISerializable {\n     \
  \   // 这是该类型的一个实例\n        private static readonly Singleton s_theOneObject = new\
  \ Singleton();\n\n        // 这些是实例字段\n        public String Name = \"Jeff\";\n \
  \       public DateTime Date = DateTime.Now;\n\n        // 私有构造器，允许这个类型构造单实例\n \
  \       private Singleton() { }\n\n        // 该方法返回对单实例的引用\n        public static\
  \ Singleton GetSingleton() { return s_theOneObject; }\n\n        // 序列化一个 Singleton\
  \ 时调用的方法\n        // 我建议在这里使用一个显式接口方法实现(EIMI)\n        [SecurityPermissionAttribute(SecurityAction.Demand,\
  \ SerializationFormatter = true)]\n        void ISerializable.GetObjectData(SerializationInfo\
  \ info, StreamingContext context) {\n            info.SetType(typeof(SingletonSerializationHelper));\n\
  \            // 不需要添加其他值\n        }\n\n        [Serializable]\n        private sealed\
  \ class SingletonSerializationHelper : IObjectReference {\n            // 这个方法在对象(它没有字段)反序列化之后调用\n\
  \            public Object GetRealObject(StreamingContext context) {\n         \
  \       return Singleton.GetSingleton();\n            }\n        }\n\n        //\
  \ 注意：特殊构造器是不必要的，因为它永远不会调用\n    }\n\n    private static void SingletonSerializationTest()\
  \ {\n        // 创建数组，其中多个元素引用一个 Singleton 对象\n        Singleton[] a1 = { Singleton.GetSingleton(),\
  \ Singleton.GetSingleton() };\n        Console.WriteLine(\"Do both elements refer\
  \ to the same object? \"\n            + (a1[0] == a1[1])); // \"True\"\n\n     \
  \   using (var stream = new MemoryStream()) {\n            BinaryFormatter formatter\
  \ = new BinaryFormatter();\n\n            // 先序列化再反序列化数组元素\n            formatter.Serialize(stream,\
  \ a1);\n            stream.Position = 0;\n            Singleton[] a2 = (Singleton[])formatter.Deserialize(stream);\n\
  \n            // 证明它的工作和预期的一样：\n            Console.WriteLine(\"Do both elements\
  \ refer to the same object? \"\n                + (a2[0] == a2[1])); // \"True\"\
  \n            Console.WriteLine(\"Do all elements refer to the same object? \"\n\
  \                + (a1[0] == a2[0])); // \"True\"\n        }\n    }\n```\n\n现在，我们通过分析代码来理解所发生的事情。Singleton\
  \ 类型加载到 AppDomain 中时，CLR 调用它的静态构造器来构造一个 Singleton 对象，并将对它的引用保存到静态字段 s_theOneObject\
  \ 中。Singleton 类没有提供任何公共构造器，这防止了其他任何代码构造该类的其他实例。\n\n在 SingletonSerializationTest\
  \ 中，我们创建包含两个元素的一个数组；每个元素都引用 Singleton 对象。为了初始化两个元素，我们调用 Singleton 的静态 GetSingleton\
  \ 方法。这个方法返回对一个 Singleton 对象的引用。对 Console 的 WriteLine 方法的第一个调用显示“True”，证明两个数组元素引用同一个对象。\n\
  \n现在，SingletonSerializationTest 调用格式化器的 Serialize 方法序列化数组及其元素。序列化第一个 Singleton 时，格式化器检测到\
  \ Singleton 类型实现了 ISerializable 接口，并调用 GetObjectData 方法。这个方法调用 SetType，向它传递 SingletonSerializationHelper\
  \ 类型，告诉格式化器将 Singleton 对象序列化成一个 SingletonSerializationHelper 对象。由于没有调用 AddValue，所以没有额外的字段信息写入流。由于格式化器自动检测出两个数组元素都引用一个对象，所以格式化器只序列化一个对象。\n\
  \n序列化数组之后，SingletonSerializationTest 调用格式化器的 Deserialize 方法。对流进行反序列化时，格式化器尝试反序列化一个\
  \ SingletonSerializationHelper 对象，这是格式化器之前被“欺骗”所序列化的东西。（事实上，这正是为什么 Singleton 类不提供特殊构造器的原因；实现\
  \ ISerializable 接口时通常都要求提供这个特殊构造器。）构造好 SingletonSerializationHelper 对象后，格式化器发现这个类型实现了\
  \ System.Runtime.Serialization.IObjectReference 接口。这个接口在 FCL 中是像下面这样定义的：\n\n```csharp\n\
  public interface IObjectReference {\n    Object GetRealObject(StreamingContext context);\n\
  }\n```\n\n如果类型实现了这个接口，格式化器会调用 GetRealObject 方法。这个方法返回在对象反序列化好之后你真正想引用的对象。在我的例子中，SingletonSerializationHelper\
  \ 类型让 GetRealObject 返回对 AppDomain 中已经存在的 Singleton 对象的一个引用。所以，当格式化器的 Deserialize\
  \ 方法返回时，a2 数组包含两个元素，两者都引用 AppDomain 中的 Singleton 对象。用于帮助进行反序列化的 SingletonSerializationHelper\
  \ 对象立即变得“不可达”了¹。\n\n① 没有谁引用它了。——译注\n\n\n\n将来会被垃圾回收。\n\n对 `WriteLine` 的第二个调用显示“True”，证明\
  \ `a2` 数组的两个元素都引用同一个对象。第三个(也是最后一个)`WriteLine` 调用也显示“True”，证明两个数组中的元素引用的是同一个对象。\n\
  \n### 24.8 序列化代理\n\n前面讨论了如何修改一个类型的实现，控制该类型如何对它本身的实例进行序列化和反序列化。然而，格式化器还允许不是“类型实现的一部分”的代码重写该类型“序列化和反序列化其对象”的方式。应用程序代码之所以要重写(覆盖)类型的行为，主要是出于两方面的考虑。\n\
  \n- 允许开发人员序列化最初没有设计成要序列化的类型。\n- 允许开发人员提供一种方式将类型的一个版本映射到类型的一个不同的版本。\n\n简单地说，为了使这个机制工作起来，首先要定义一个“代理类型”\
  \ (surrogate type)，它接管对现有类型进行序列化和反序列化的行动。然后，向格式化器登记该代理类型的实例，告诉格式化器代理类型要作用于现有的哪个类型。一旦格式化器要对现有类型的实例进行序列化或反序列化，就调用由你的代理对象定义的方法。下面用一个例子演示这一切是如何工作的。\n\
  \n序列化代理类型必须实现 `System.Runtime.Serialization.ISerializationSurrogate` 接口，它在 FCL 中像下面这样定义：\n\
  \n```csharp\npublic interface ISerializationSurrogate {\n    void GetObjectData(Object\
  \ obj, SerializationInfo info, StreamingContext context);\n\n    Object SetObjectData(Object\
  \ obj, SerializationInfo info, StreamingContext context,\n        ISurrogateSelector\
  \ selector);\n}\n```\n\n让我们分析使用了该接口的一个例子。假定程序含有一些 `DateTime` 对象，其中包含用户计算机的本地值。如果想把\
  \ `DateTime` 对象序列化到流中，同时希望值用国际标准时间(世界时)序列化，那么应该如何操作呢？这样一来，就可以将数据通过网络流发送给世界上其他地方的另一台机器，使\
  \ `DateTime` 值保持正确。虽然不能修改 FCL 自带的 `DateTime` 类型，但可以定义自己的序列化代理类，它能控制 `DateTime` 对象的序列化和反序列化方式。下面展示了如何定义代理类：\n\
  \n```csharp\ninternal sealed class UniversalToLocalTimeSerializationSurrogate :\
  \ ISerializationSurrogate {\n    public void GetObjectData(Object obj, SerializationInfo\
  \ info, StreamingContext context) {\n        // 将DateTime从本地时间转换为UTC\n        info.AddValue(\"\
  Date\", ((DateTime)obj).ToUniversalTime().ToString(\"u\"));\n    }\n\n    public\
  \ Object SetObjectData(Object obj, SerializationInfo info, StreamingContext context,\n\
  \        ISurrogateSelector selector) {\n        // 将DateTime从UTC转换成本地时间\n     \
  \   return DateTime.ParseExact(info.GetString(\"Date\"), \"u\", null).ToLocalTime();\n\
  \    }\n}\n```\n\n**GetObjectData** 方法在这里的工作方式与 **ISerializable** 接口的 **GetObjectData**\
  \ 方法差不多。唯一的区别在于，**ISerializationSurrogate** 的 **GetObjectData** 方法要获取一个额外的参数——对要序列化的“真实”对象的引用。在上述\
  \ **GetObjectData** 方法中，这个对象转型为 `DateTime`，值从本地时间转换为世界时，并将一个字符串(使用通用完整日期/时间模式来格式化)添加到\
  \ `SerializationInfo` 集合。\n\n**SetObjectData** 方法用于反序列化一个 `DateTime` 对象。调用这个方法时要向它传递一个\
  \ `SerializationInfo` 对象引用。**SetObjectData** 从这个集合中获取字符串形式的日期，把它解析成通用完整日期/时间模式的字符串，然后将结果\
  \ `DateTime` 对象从世界时转换成计算机的本地时间。\n\n传给 **SetObjectData** 第一个参数的 **Object** 有点儿奇怪。在调用\
  \ **SetObjectData** 之前，格式化器分配(通过 **FormatterServices** 的静态方法 **GetUninitializedObject**)要代理的那个类型的实例。实例的字段全是\
  \ 0/null，而且没有在对象上调用构造器。**SetObjectData** 内部的代码为了初始化这个实例的字段，可以使用传入的 **SerializationInfo**\
  \ 中的值，并让 **SetObjectData** 返回 **null**。另外，**SetObjectData** 可以创建一个完全不同的对象，甚至创建不同类型的对象，并返回对新对象的引用。在这种情况下，格式化器会忽略对传给\
  \ **SetObjectData** 的对象的任何更改。\n\n在我的例子中，`UniversalToLocalTimeSerializationSurrogate`\
  \ 类扮演了 `DateTime` 类型的代理的角色。`DateTime` 是值类型，所以 `obj` 参数引用一个 `DateTime` 的已装箱实例。大多数值类型中的字段都无法更改(值类型本来就设计成“不可变”)，所以我的\
  \ `SetObjectData` 方法会忽略 `obj` 参数，并返回一个新的 `DateTime` 对象，其中已装好了期望的值。\n\n此时，你肯定会问，序列化/反序列化一个\
  \ `DateTime` 对象时，格式化器怎么知道要用这个 `ISerializationSurrogate` 类型呢？以下代码对 `UniversalToLocalTimeSerializationSurrogate`\
  \ 类进行了测试：\n\n```csharp\nprivate static void SerializationSurrogateDemo() {\n   \
  \ using (var stream = new MemoryStream()) {\n        // 1. 构造所需的格式化器\n        IFormatter\
  \ formatter = new SoapFormatter();\n\n        // 2. 构造一个SurrogateSelector(代理选择器)对象\n\
  \        SurrogateSelector ss = new SurrogateSelector();\n\n        // 3. 告诉代理选择器为DateTime对象使用我们的代理\n\
  \        ss.AddSurrogate(typeof(DateTime), formatter.Context,\n            new UniversalToLocalTimeSerializationSurrogate());\n\
  \n        // 注意: AddSurrogate 可多次调用来登记多个代理\n\n        // 4. 告诉格式化器使用代理选择器\n    \
  \    formatter.SurrogateSelector = ss;\n\n        // 创建一个DateTime来代表机器上的本地时间，并序列化它\n\
  \        DateTime localTimeBeforeSerialize = DateTime.Now;\n        formatter.Serialize(stream,\
  \ localTimeBeforeSerialize);\n\n        // stream 将 Universal 时间作为一个字符串显示，证明能正常工作\n\
  \        stream.Position = 0;\n        Console.WriteLine(new StreamReader(stream).ReadToEnd());\n\
  \n        // 反序列化 Universal 时间字符串，并且把它转换成本地 DateTime\n        stream.Position =\
  \ 0;\n        DateTime localTimeAfterDeserialize = (DateTime)formatter.Deserialize(stream);\n\
  \n        // 证明它能正常工作\n        Console.WriteLine(\"LocalTimeBeforeSerialize ={0}\"\
  , localTimeBeforeSerialize);\n        Console.WriteLine(\"LocalTimeAfterDeserialize={0}\"\
  , localTimeAfterDeserialize);\n    }\n}\n```\n\n步骤 1 到步骤 4 执行完毕后，格式化器就准备好使用已登记的代理类型。调用格式化器的\
  \ **Serialize** 方法时，会在 **SurrogateSelector** 维护的集合(一个哈希表)中查找(要序列化的)每个对象的类型。如果发现一个匹配，就调用\
  \ **ISerializationSurrogate** 对象的 **GetObjectData** 方法来获取应该写入流的信息。\n\n格式化器的 **Deserialize**\
  \ 方法在调用时，会在格式化器的 **SurrogateSelector** 中查找要反序列化的对象的类型。如果发现一个匹配，就调用 **ISerializationSurrogate**\
  \ 对象的 **SetObjectData** 方法来设置要反序列化的对象中的字段。\n\n**SurrogateSelector** 对象在内部维护了一个私有哈希表。调用\
  \ **AddSurrogate** 时，**Type** 和 **StreamingContext** 构成了哈希表的键(key)，对应的值(value)就是\
  \ **ISerializationSurrogate** 对象。如果已经存在和要添加的 **Type/StreamingContext** 相同的一个键，**AddSurrogate**\
  \ 会抛出一个 **ArgumentException**。通过在键中包含一个 **StreamingContext**，可以登记一个代理类型对象，它知道如何将\
  \ `DateTime` 对象序列化/反序列化到一个文件中；再登记一个不同的代理对象，它知道如何将 `DateTime` 对象序列化/反序列化到一个不同的进程中。\n\
  \n> **注意** **BinaryFormatter** 类有一个 bug，会造成代理无法序列化循环引用的对象。为了解决这个问题，需要将自己的 **ISerializationSurrogate**\
  \ 对象的引用传给 **FormatterServices** 的静态 **GetSurrogateForCyclicalReference** 方法。该方法返回一个\
  \ **ISerializationSurrogate** 对象。然后，可以将对这个对象的引用传给 **SurrogateSelector** 的 **AddSurrogate**\
  \ 方法。但要注意，使用 **GetSurrogateForCyclicalReference** 方法时，代理的 **SetObjectData** 方法必须修改\
  \ **SetObjectData** 的 **obj** 参数所引用的对象中的值，而且最后要向调用方法返回 **null** 或 **obj**。在本书的配套资源中，有一个例子展示了如何修改\
  \ **UniversalToLocalTimeSerializationSurrogate** 类和 **SerializationSurrogateDemo**\
  \ 方法来支持循环引用。\n\n#### 代理选择器链\n\n多个 **SurrogateSelector** 对象可链接到一起。例如，可以让一个 **SurrogateSelector**\
  \ 对象维护一组序列化代理，这些序列化代理(surrogate)用于将类型序列化成代理(proxy)①，以便通过网络传送，或者跨越不同的 AppDomain 传送。还可以让另一个\
  \ **SurrogateSelector** 对象维护一组序列化代理，这些序列化代理用于将版本 1 的类型转换成版本 2 的类型。\n\n如果有多个希望格式化器使用的\
  \ **SurrogateSelector** 对象，必须把它们链接到一个链表中。**SurrogateSelector** 类型实现了 **ISurrogateSelector**\
  \ 接口，该接口定义了三个方法。这些方法全部跟链接有关。下面展示了 **ISurrogateSelector** 接口是如何定义的：\n\n```csharp\n\
  public interface ISurrogateSelector {\n    void ChainSelector(ISurrogateSelector\
  \ selector);\n    ISurrogateSelector GetNextSelector();\n    ISerializationSurrogate\
  \ GetSurrogate(Type type, StreamingContext context,\n        out ISurrogateSelector\
  \ selector);\n}\n```\n\n**ChainSelector** 方法紧接在当前操作的 **ISurrogateSelector** 对象(**this**\
  \ 对象)之后插入一个 **ISurrogateSelector** 对象。**GetNextSelector** 方法返回对链表中的下一个 **ISurrogateSelector**\
  \ 对象的引用；如果当前操作的对象是链尾，就返回 **null**。\n\n**GetSurrogate** 方法在 **this** 所代表的 **ISurrogateSelector**\
  \ 对象中查找一对 **Type/StreamingContext**。如果没有找到 **Type/StreamingContext** 对，就访问链中的下一个\
  \ **ISurrogateSelector** 对象，以此类推。如果找到一个匹配项，**GetSurrogate** 将返回一个 **ISerializationSurrogate**\
  \ 对象，该对象负责对找到的类型进行序列化/反序列化。除此之外，**GetSurrogate** 还会返回包含匹配项的 **ISurrogateSelector**\
  \ 对象；一般都用不着这个对象，所以一般会将其忽略。如果链中所有 **ISurrogateSelector** 对象都不包含匹配的一对 **Type/StreamingContext**，**GetSurrogate**\
  \ 将返回 **null**。\n\n> **注意** FCL 定义了一个 **ISurrogateSelector** 接口，还定义了一个实现了该接口的 **SurrogateSelector**\
  \ 类型。然而，只有在一些非常罕见的情况下，才需要定义自己的类型来实现 **ISurrogateSelector** 接口。实现 **ISurrogateSelector**\
  \ 接口的唯一原因就是将类型映射到另一个类型时需要更大的灵活性。例如，你可能希望以一种特殊方式序列化从一个特定基类继承的所有类型。**System.Runtime.Remoting.Messaging.RemotingSurrogateSelector**\
  \ 类就是一个很好的例子。出于远程访问(remoting)目的而序列化对象时，CLR 使用 **RemotingSurrogateSelector** 来格式化对象。这个代理选择器\
  \ (surrogate selector) 以一种特殊方式序列化从 **System.MarshalByRefObject** 派生的所有对象，确保反序列化会造成在客户端创建代理对象(proxy\
  \ object)。\n\n### 24.9 反序列化对象时重写程序集/类型\n\n序列化对象时，格式化器输出类型及其定义程序集的全名。反序列化对象时，格式化器根据这个信息确定要为对象构造并初始化什么类型。前面讨论了如何利用\
  \ ISerializationSurrogate 接口来接管特定类型的序列化和反序列化工作。实现了 ISerializationSurrogate 接口的类型与特定程序集中的特定类型关联。\n\
  \n但有的时候，ISerializationSurrogate 机制的灵活性显得有点不足。在下面列举的情形中，有必要将对象反序列化成和序列化时不同的类型。\n\n\
  - 开发人员可能想把一个类型的实现从一个程序集移动到另一个程序集。例如，程序集版本号的变化造成新程序集有别于原始程序集。\n- 服务器对象序列化到发送给客户端的流中。客户端处理流时，可以将对象反序列化成完全不同的类型，该类型的代码知道如何向服务器的对象发出远程方法调用。\n\
  - 开发人员创建了类型的新版本，想把已序列化的对象反序列化成类型的新版本。\n\n利用 System.Runtime.Serialization.SerializationBinder\
  \ 类，可以非常简单地将一个对象反序列化成不同类型。为此，要先定义自己的类型，让它从抽象类 SerializationBinder 派生。在下面的代码中，假定你的版本\
  \ 1.0.0.0 的程序集定义了名为 Ver1 的类，并假定程序集的新版本定义了 Ver1ToVer2SerializationBinder 类，还定义了名为\
  \ Ver2 的类：\n\n```csharp\ninternal sealed class Ver1ToVer2SerializationBinder : SerializationBinder\
  \ {\n    public override Type BindToType(String assemblyName, String typeName) {\n\
  \        // 将任何 Ver1 对象从版本 1.0.0.0 反序列化成一个 Ver2 对象\n\n        // 计算定义 Ver1 类型的程序集名称\n\
  \        AssemblyName assemVer1 = Assembly.GetExecutingAssembly().GetName();\n \
  \       assemVer1.Version = new Version(1, 0, 0, 0);\n\n        // 如果从 v1.0.0.0\
  \ 反序列化 Ver1 对象，就把它转变一个 Ver2 对象\n        if (assemblyName == assemVer1.ToString()\
  \ && typeName == \"Ver1\")\n            return typeof(Ver2);\n\n        // 否则，就只返回请求的同一个类型\n\
  \        return Type.GetType(String.Format(\"{0}, {1}\", typeName, assemblyName));\n\
  \    }\n}\n```\n\n现在，在构造好格式化器之后，构造 Ver1ToVer2SerializationBinder 的实例，并设置格式化器的可读/可写属性\
  \ Binder，让它引用绑定器(binder)对象。设置好 Binder 属性后，调用格式化器的 Deserialize 方法。在反序列化期间，格式化器发现已设置了一个绑定器。每个对象要反序列化时，格式化器都调用绑定器的\
  \ BindToType 方法，向它传递程序集名称以及格式化器想要反序列化的类型。然后，BindToType 判断实际应该构建什么类型，并返回这个类型。\n\n\
  \n"
- "## 第25章 与 WinRT 组件互操作\n\n本章内容：\n\n- CLR 投射与 WinRT 组件类型系统规则\n- 框架投射\n- 用 C# 定义 WinRT\
  \ 组件\n\nWindows 8/8.1 带来了一个新类库，应用程序可通过它访问操作系统功能。类库正式名称是 Windows 运行时（Windows Runtime，WinRT），其组件通过\
  \ WinRT 类型系统访问。首次发布时，WinRT 的许多目标都和 CLR 相同，例如简化应用程序开发，以及允许代码用不同编程语言实现以简化互操作。特别是，Microsoft\
  \ 支持在原生 C/C++、JavaScript（通过 Microsoft 的“Chakra”JavaScript 虚拟机）和 C#/Visual Basic（通过\
  \ CLR）中使用 WinRT 组件。\n\n图 25-1 展示了 Windows 的 WinRT 组件所公开的功能，以及可以访问它们的 Microsoft 语言。对于用原生\
  \ C/C++ 实现的应用程序，开发人员必须为每种 CPU 架构（x86、x64 和 ARM）单独编译代码。相比之下，.NET 开发人员只需编译一次（编译成 IL，CLR\
  \ 自行将其编译成与主机 CPU 对应的本机代码）。JavaScript 应用程序则自带了源代码，“Chakra”虚拟机解析这些源代码，把它编译成与主机 CPU\
  \ 对应的本机代码。其他公司也可制作能与 WinRT 组件互操作的语言和环境。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_585_0.png)\n\
  \n图 25-1 Windows 的 WinRT 组件所公开的功能，以及访问它们的各种语言\n\nWindows Store 应用和桌面应用程序可通过 WinRT\
  \ 组件来利用操作系统的功能。Windows 配套提供的 WinRT 组件数量比 .NET Framework 类库小多了。但设计就是这样的，组件的目的就是公开操作系统最擅长的事情，也就是对硬件和跨应用程序的功能进行抽象。所以，大多数\
  \ WinRT 组件都只是公开了功能，比如存储、联网、图形、媒体、安全性、线程处理等。而其他核心语言服务（比如字符串操作）和较复杂的框架（比如 LINQ）不是由操作系统提供，而是由访问\
  \ WinRT 组件的语言提供。\n\nWinRT 组件内部作为“组件对象模型”（Component Object Model，COM）组件来实现，后者是 Microsoft\
  \ 1993 年推出的技术。COM 当年被认为过于复杂，规则过于难解，是一个很让人头疼的编程模型。但 COM 实际是有许多亮点的。多年来，Microsoft 对其进行了大量修订，显著地进行了简化。Microsoft\
  \ 对 WinRT 组件进行了一个很大的调整，不是使用类库来描述 COM 组件的 API，而是使用元数据。你没有看错，WinRT 组件使用由 ECMA 协会标准化的\
  \ .NET 元数据格式（ECMA-335）来描述其 API。\n\n这个元数据格式正是本书一直在讨论的。元数据比类库更有表现力，而且 CLR 已经对元数据有了全面理解。此外，CLR\
  \ 一开始就通过运行时可调用包装器（Runtime Callable Wrapper，RCW）和 COM 可调用包装器（COM Callable Wrapper，CCW）实现了与\
  \ COM 组件的互操作。这使在 CLR 上运行的语言（如 C#）能无缝地与 WinRT 类型和组件进行互操作。\n\n在 C# 中引用 WinRT 对象，实际获得的是对一个\
  \ RCW 的引用，RCW 内部引用了 WinRT 组件。类似地，将一个 CLR 对象传给 WinRT API，实际传递的是一个 CCW 引用，CCW 内部容纳了对\
  \ CLR 对象的引用。\n\nWinRT 组件将元数据嵌入扩展名为 .winmd 的文件中（winmd 代表 Windows MetaData）。Windows\
  \ 搭载的 WinRT 组件将元数据存储到各种 Windows.*.winmd 文件中，这些文件可在 %WinDir%\\System32\\WinMetadata\
  \ 目录中找到。生成应用时要引用安装到以下目录的 Windows.winmd 文件①：\n\n```text\n%ProgramFiles(x86)%\\Windows\
  \ Kits\\8.1\\References\\CommonConfiguration\\Neutral\\Windows.winmd\n```\n\n> ①\
  \ 针对 Windows 8.1。——译注\n\nWindows Runtime 类型系统的一个主要设计目标是使开发人员能使用他们擅长的技术、工具、实践以及约定写应用。为此，有的\
  \ WinRT 功能被投射²成对应的开发技术。针对 .NET Framework 开发人员主要有两种投射：\n\n- **CLR 投射** CLR 投射由 CLR\
  \ 隐式执行，通常和元数据的重新解释有关。下一节会讨论 WinRT 组件类型系统规则以及 CLR 如何将这些规则投射给 .NET Framework 开发人员。\n\
  - **Framework 投射** Framework 投射由你的代码显式执行，这是通过 FCL 新引入的 API 来执行的。\n\n> ② 本章所说的投射（projection）和映射（mapping）是一回事。——译注\n\
  \n如果会利用继承。这意味着它们也没有利用多态。事实上，只有除 JavaScript 之外的其他语言所用的 WinRT 组件才会利用继承和多态。在随 Windows\
  \ 发布的 WinRT 组件中，只有 XAML 组件（用于创建 UI）才利用了继承和多态。用 JavaScript 写的应用程序使用 HTML 和 CSS 来创建\
  \ UI。\n\n- **结构**：WinRT 支持结构（值类型），它们的实例跨越 COM 互操作边界按值封送。和 CLR 的值类型不同，WinRT 结构只能包含核心数据类型或其他\
  \ WinRT 结构类型的公共字段①。另外，WinRT 结构不能有任何构造器或辅助方法（helper method）。为方便起见，CLR 将某些操作系统 WinRT\
  \ 结构投射成原生 CLR 类型，后者确实提供了构造器和辅助方法。CLR 开发人员会觉得这些投射的类型更亲切。例子包括 Windows.Foundation 命名空间中定义的\
  \ Point、Rect、Size 和 TimeSpan 结构。\n\n> ① 枚举也可以，但枚举本质上是 32 位整数。\n\n- **可空结构**：WinRT\
  \ API 可公开可空结构（值类型）。CLR 将 WinRT 的 `Windows.Foundation.IReference<T>` 接口投射成 CLR 的\
  \ `System.Nullable<T>` 类型。\n- **枚举**：枚举值作为有符号或无符号 32 位整数传递。用 C# 定义枚举类型，基础类型要么是 int，要么是\
  \ uint。另外，有符号 32 位枚举被看成是离散值，而无符号 32 位枚举被看成是可以 OR 到一起的标志值。\n- **接口**：对于 WinRT 接口的成员，其参数和返回类型只能是\
  \ WinRT 兼容的类型。\n- **方法**：WinRT 提供了对方法重载的有限支持。具体地说，由于 JavaScript 使用动态类型，所以它分辨不了仅参数类型有区别的方法。例如，JavaScript\
  \ 允许向原本期待字符串的方法传递数字。但 JavaScript 确实能区分获取一个参数和获取两个参数的方法。此外，WinRT 不支持操作符重载方法和默认参数值。另外，实参只能在封送进入或外出（marshal\
  \ in or out）之间选择一个，永远都不能两者同时进行（marshal in and out）。这意味着不能向方法实参应用 ref，但应用 out 就是可以的。欲知详情，请参考下个列表的“数组”项目。\n\
  - **属性**：WinRT 属性的数据类型只能指定 WinRT 兼容类型。WinRT 不支持有参属性或只写属性。\n- **委托**：WinRT 委托类型只能为参数类型和返回类型指定\
  \ WinRT 组件。向 WinRT 组件传递一个委托时，委托对象会用一个 CCW 包装，在使用它的 WinRT 组件释放 CCW 之前，\n\n| WinRT\
  \ 集合类型 | 投射的 CLR 集合类型 |\n| --- | --- |\n| （Windows.Foundation.Collections 命名空间）\
  \ | （System.Collections.Generic 命名空间） |\n| `IVectorView<T>` | `IReadOnlyList<T>`\
  \ |\n| `IMap<K, V>` | `IDictionary<TKey, TValue>` |\n| `IMapView<K, V>` | `IReadOnlyDictionary<TKey,\
  \ TValue>` |\n| `IKeyValuePair<K, V>` | `KeyValuePair<TKey, TValue>` |\n\n从上述列表可以看出，CLR\
  \ 团队进行了大量工作，尽量保证了 WinRT 类型系统和 CLR 类型系统之间的无缝互操作，使托管代码的开发人员能在代码中更好地利用 WinRT 组件。①\n\
  \n> ① 欲知详情，请访问 http://msdn.microsoft.com/en-us/library/windows/apps/hh995050.aspx\
  \ 并下载 CLRandtheWindowsRuntime.docx 文档。\n\n### 25.2 框架投射\n\n在 CLR 不能将一个 WinRT 类型隐式投射给\
  \ .NET Framework 开发人员的时候，开发人员就必须显式使用框架投射。主要有三种需要进行框架投射的技术：异步编程、WinRT 流和 .NET Framework\
  \ 流之间的互操作以及需要在 CLR 和 WinRT API 之间传输数据块的时候。后续的小节将分别讨论这三种框架投射。由于许多应用程序都要使用这些技术，所以有必要很好地理解和高效地使用它们。\n\
  \n### 25.2.1 从 .NET 代码中调用异步 WinRT API\n\n线程以同步方式执行 I/O 操作时，线程可能阻塞不确定的时间。GUI 线程等待一个同步\
  \ I/O 操作时，应用程序 UI 会停止响应用户的输入，比如触摸、鼠标和手写笔事件，造成用户对应用程序感到厌烦。为了防止应用程序出现不响应的情况，执行 I/O\
  \ 操作的 WinRT 组件通过异步 API 公开其功能。事实上，凡是 CPU 计算时间可能超过 50 毫秒的功能，WinRT 组件都通过异步 API 来公开该功能。本书第\
  \ V 部分“线程处理”将详细讨论如何构建响应灵敏的应用程序。\n\n由于如此多的 WinRT API 都是异步的，所以为了高效地使用它们，你需要理解如何通过\
  \ C# 与它们互操作。例如以下代码：\n\n```csharp\npublic void WinRTAsyncIntro() {\n    IAsyncOperation<StorageFile>\
  \ asyncOp = KnownFolders.MusicLibrary.GetFileAsync(\"Song.mp3\");\n    asyncOp.Completed\
  \ = OpCompleted;\n    // 可选：在以后某个时间调用 asyncOp.Cancel()\n}\n\n// 注意：回调方法通过 GUI 或线程池线程执行\n\
  private void OpCompleted(IAsyncOperation<StorageFile> asyncOp, AsyncStatus status)\
  \ {\n    switch (status) {\n        case AsyncStatus.Completed: // 处理结果\n```\n\n\
  ![](img/6fa065e17c4549db7260fbfaf4fd384e_593_0.png)\n\n图 25-2 和执行异步 I/O 与计算操作有关的\
  \ WinRT 接口\n\n.NET Framework 使用 System.Threading.Tasks 命名空间的类型来简化异步操作。我将在第 27 章“计算限制的异步操作”解释这些类型以及如何用它们执行计算操作，在第\
  \ 28 章“I/O 限制的异步操作”解释如何用它们执行 I/O 操作。除此之外，C# 提供了 async 和 await 关键字，允许使用顺序编程模型来执行异步操作，从而大幅简化了编码。\n\
  \n以下代码重写了之前的 WinRTAsyncIntro 方法。这个版本利用了 .NET Framework 提供的一些扩展方法，将 WinRT 异步编程模型转变成更方便的\
  \ C# 编程模型。\n\n```csharp\nusing System;      // 为了使用 WindowsRuntimeSystemExtensions\
  \ 中的扩展方法，\n                   // 这些扩展方法称为框架投射扩展方法\n.\n.\npublic async void WinRTAsyncIntro()\
  \ {\n    try {\n        StorageFile file = await KnownFolders.MusicLibrary.GetFileAsync(\"\
  Song.mp3\");\n        /* Completed... */\n    }\n    catch (OperationCanceledException)\
  \ { /* Canceled... */ }\n    catch (SomeOtherException ex) { /* Error... */ }\n\
  }\n```\n\nC# 的 await 操作符导致编译器在 GetFileAsync 方法返回的 `IAsyncOperation<StorageFile>`\
  \ 接口上查找 GetAwaiter 方法。该接口没有提供 GetAwaiter 方法，所以编译器查找扩展方法。幸好，.NET Framework 团队在 System.Runtime.WindowsRuntime.dll\
  \ 中提供了能在任何一个 WinRT `IAsyncXxx` 接口上调用的大量扩展方法。\n\n```csharp\nnamespace System {\n\
  \    public static class WindowsRuntimeSystemExtensions {\n        public static\
  \ TaskAwaiter GetAwaiter(\n            this IAsyncAction source);\n        public\
  \ static TaskAwaiter<TProgress> GetAwaiter<TProgress>(\n            this IAsyncActionWithProgress<TProgress>\
  \ source);\n        public static TaskAwaiter<TResult> GetAwaiter<TResult>(\n  \
  \          this IAsyncOperation<TResult> source);\n        public static TaskAwaiter<TResult,\
  \ TProgress> GetAwaiter<TResult, TProgress>(\n            this IAsyncOperationWithProgress<TResult,\
  \ TProgress> source);\n    }\n}\n```\n\n最后，System.IO.WindowsRuntimeStreamExtensions\
  \ 类提供了一些扩展方法能将 WinRT 流接口（例如 IRandomAccessStream，IInputStream 和 IOutputStream）“转型”为\
  \ .NET Framework 的 Stream 类型，或者反向转换。\n\n```csharp\nnamespace System.IO { // 在 System.Runtime.WindowsRuntime.dll\
  \ 中定义\n    public static class WindowsRuntimeStreamExtensions {\n        public\
  \ static Stream AsStream(this IRandomAccessStream winRTStream);\n        public\
  \ static Stream AsStream(this IRandomAccessStream winRTStream, Int32 bufferSize);\n\
  \n        public static Stream AsStreamForRead(this IInputStream winRTStream);\n\
  \        public static Stream AsStreamForRead(this IInputStream winRTStream, Int32\
  \ bufferSize);\n\n        public static Stream AsStreamForWrite(this IOutputStream\
  \ winRTStream);\n        public static Stream AsStreamForWrite(this IOutputStream\
  \ winRTStream, Int32 bufferSize);\n\n        public static IInputStream AsInputStream(this\
  \ Stream clrStream);\n        public static IOutputStream AsOutputStream(this Stream\
  \ clrStream);\n    }\n}\n```\n\n下列代码使用扩展方法将一个 WinRT IInputStream “转型”为 .NET Framework\
  \ Stream 对象。\n\n```csharp\nXElement FromWinRTStreamToXElement(IInputStream winRTStream)\
  \ {\n    Stream netStream = winRTStream.AsStreamForRead();\n    return XElement.Load(netStream);\n\
  }\n```\n\n注意，.NET Framework 提供的“转型”扩展方法幕后不仅仅是执行转型。具体地说，将 WinRT 流转换成 .NET Framework\
  \ 流时，会在托管堆中为 WinRT 流隐式创建一个缓冲区。结果是大多数操作都向这个缓冲区写入，不需要跨越互操作边界，这提升了性能。涉及大量小的 I/O 操作（比如解析\
  \ XML 文档）时，性能的提升尤其明显。\n\n使用 .NET Framework 流投射的好处是，在同一个 WinRT 流实例上多次执行一个 AsStreamXxx\
  \ 方法，不用担心会创建多个相互没有连接的缓冲区，造成向一个缓冲区写入的数据在另一个那里看不见。.NET Framework 的 API 确保每个流对象都有唯一的适配器实例，所有用户共享同一个缓冲区。\n\
  \n虽然默认缓冲区大多数时候都能在性能与内存使用之间获得较好的平衡，但有时还是希望调整缓冲区的大小（而不是默认的 16 KB）。这时可以使用 AsStreamXxx\
  \ 方法的重载版本来达到目的。例如，如果知道要长时间操作一个很大的文件，同时不会使用其他太多的缓冲流，就可为自己的流请求一个很大的缓冲区来获得进一步的性能提升。相反，有的应用程序要求低网络延迟，这时可能希望确保除非应用程序显式请求，否则不要从网络读取更多的字节。这时可考虑完全禁用缓冲区。为\
  \ AsStreamXxx 方法指定零字节的缓冲区，就不会创建缓冲区对象了。\n\n### 25.2.3 在 CLR 和 WinRT 之间传输数据块\n\n要尽量使用上一节讨论的框架投射，因为它们有不错的性能。但有时需要在\
