  \ 类仅一个构造器，没有提供更多的编码控制。所以如果需要 **ASCIIEncoding** 对象，请务必查询 **Encoding** 的 **ASCII**\
  \ 属性来获得。该属性返回的是一个 **ASCIIEncoding** 对象引用。自己构造 **ASCIIEncoding** 对象会在堆上创建更多的对象，无谓地损害应用程序的性能。\n\
  \n一旦获得从 **Encoding** 派生的对象，就可调用 **GetBytes** 方法将字符串或字符数组转换成字节数组(**GetBytes** 有几个重载版本)。要将字节数组转换成字符数组或字符串，需要调用\
  \ **GetChars** 方法或者更有用的 **GetString** 方法(这两个方法都有几个重载版本)。前面的示例代码演示了如何调用 **GetBytes**\
