  ## 14.6.1　字符和字节流的编码和解码\n\n假定现在要通过 System.Net.Sockets.NetworkStream 对象来读取一个 UTF-16\
  \ 编码字符串。字节流通常以数据块（data chunk）的形式传输。换言之，可能是先从流中读取 5 个字节，再读取 7 个字节。UTF-16 的每个字符都由\
  \ 2 个字节构成。所以，调用 Encoding 的 GetString 方法并传递第一个 5 字节数组，返回的字符串只包含 2 个字符。再次调用 GetString\
  \ 并传递接着的 7 个字节，将返回只包含 3 个字符的字符串。显然，所有 code point¹ 都会存储错误的值！\n\n① code point 是一个抽象概念。可将每个字符都想像成一个抽象的\
  \ Unicode code point，可能需要使用多个字节来表示一个 code point。——译注\n\n之所以会造成数据损坏，是由于所有 Encoding\
  \ 派生类都不维护多个方法调用之间的状态。要编码或解码以数据块形式传输的字符/字节，必须进行一些额外的工作来维护方法调用之间的状态，从而防止丢失数据。\n\n\
  字节块解码首先要获取一个 Encoding 派生对象引用（参见上一节），再调用其 GetDecoder 方法。方法返回对一个新构造对象的引用，该对象的类型从 System.Text.Decoder\
  \ 类派生。\n\n和 Encoding 类一样，Decoder 也是抽象基类。查阅文档，会发现找不到任何具体实现了 Decoder 的类。但 FCL 确实定义了一系列\
  \ Decoder 派生类。这些类在 FCL 内部使用。但是，GetDecoder 方法能构造这些类的实例，并将这些实例返回给应用程序代码。\n\nDecoder\
  \ 的所有派生类都提供了两个重要的方法：GetChars 和 GetCharCount。显然，这些方法的作用是对字节数组进行解码，工作方式类似于前面讨论过的 Encoding\
  \ 的 GetChars 和 GetCharCount 方法。调用其中一个方法时，它会尽可能多地解码字节数组。假如字节数组包含的字节不足以完成一个字符，剩余的字节会保存到\
  \ Decoder 对象内部。下次调用其中一个方法时，Decoder 对象会利用之前剩余的字节再加上传给它的新字节数组。这样一来，就可以确保对数据块进行正确解码。从流中读取字节时\
  \ Decoder 对象的作用很大。\n\n从 Encoding 派生的类型可用于无状态（中途不保持状态）编码和解码。而从 Decoder 派生的类型只能用于解码。以成块的方式编码字符串需要调用\
  \ GetEncoder 方法，而不是调用 Encoding 对象的 GetDecoder 方法。GetEncoder 返回一个新构造的对象，它的类型从抽象基类\
  \ System.Text.Encoder 派生。在文档中同样找不到谁具体实现了 Encoder。但 FCL 确实定义了一系列 Encoder 派生类。和从 Decoder\
  \ 派生的类一样，这些类都在 FCL 内部使用，只是 GetEncoder 方法能构造这些类的实例，并将这些实例返回给应用程序代码。\n\n从 Encoder\
  \ 派生的所有类都提供了两个重要方法：GetBytes 和 GetByteCount。每次调用，从 Encoder 派生的对象都会维护余下数据的状态信息，以便以成块的方式对数据进行编码。\n\
  \n## 14.6.2　Base-64 字符串编码和解码\n\n写作本书时，UTF-16 和 UTF-8 编码已相当流行。另一个流行的方案是将字节序列编码成 Base-64\
  \ 字符串。FCL 专门提供了进行 Base-64 编码和解码的方法。你可能以为这是通过一个从 Encoding 派生的类型来完成的。但考虑到某些原因，Base-64\
  \ 编码和解码用 System.Convert 类型提供的一些静态方法来进行。\n\n将 Base-64 字符串编码成字节数组需调用 Convert 的静态 FromBase64String\
  \ 或 FromBase64CharArray 方法。类似地，将字节数组解码成 Base-64 字符串需调用 Convert 的静态 ToBase64String\
  \ 或者 ToBase64CharArray 方法。以下代码演示了如何使用其中的部分方法：\n\n```csharp\nusing System;\n\npublic\
  \ static class Program {\n    public static void Main() {\n        // 获取一组 10 个随机生成的字节\n\
  \        Byte[] bytes = new Byte[10];\n        new Random().NextBytes(bytes);\n\n\
  \        // 显示字节\n        Console.WriteLine(BitConverter.ToString(bytes));\n\n \
  \       // 将字节解码成 Base-64 字符串，并显示字符串\n        String s = Convert.ToBase64String(bytes);\n\
  \        Console.WriteLine(s);\n\n        // 将 Base-64 字符串编码回字节，并显示字节\n        bytes\
  \ = Convert.FromBase64String(s);\n        Console.WriteLine(BitConverter.ToString(bytes));\n\
  \    }\n}\n```\n\n编译并执行上述代码得到以下输出（因为是随机生成的字节，所以你的输出可能不同）：\n\n```text\n3B-B9-27-40-59-35-86-54-5F-F1\n\
  O7knQFk1h1R8Q==\n3B-B9-27-40-59-35-86-54-5F-F1\n```\n\n### 14.7　安全字符串\n\nString\
  \ 对象可能包含敏感数据，比如用户密码或信用卡资料。遗憾的是，String 对象在内存中包含一个字符数组。如果允许执行不安全或者非托管的代码，这些代码就可以扫描进程的地址空间，找到包含敏感数据的字符串，并以非授权的方式加以利用。即使\
  \ String 对象只用一小段时间就进行垃圾回收，CLR 也可能无法立即重用 String 对象的内存，致使 String 的字串长时间保留在进程的内存中（尤其是假如\
  \ String 对象是较老的一代¹），造成机密数据泄露。此外，由于字符串不可变（immutable），所以当你处理它们时，旧的副本会逗留在内存中，最终造成多个不同版本的字符串散布在整个内存空间中。\n\
  \n有的政府部门有严格的安全要求，对各种安全措施进行了非常具体的规定。为了满足这些要求，Microsoft 在 FCL 中增添了一个更安全的字符串类，即 System.Security.SecureString。构造\
  \ SecureString 对象时，会在内部分配一个非托管内存块，其中包含一个字符数组。使用非托管内存是为了避开垃圾回收器的“魔爪”。\n\n这些字符串的字符是经过加密的，能防范任何恶意的非安全/非托管代码获取机密信息。利用以下任何一个方法，即可在安全字符串中附加、插入、删除或者设置一个字符：AppendChar、InsertAt、RemoveAt\
  \ 和 SetAt。调用其中任何一个方法时，方法内部会解密字符，执行指定的操作，再重新加密字符。这意味着字符有一小段时间处于未加密状态。还意味着这些操作的性能会比较一般。所以，应该尽可能少地执行这些操作。\n\
  \nSecureString 类实现了 IDisposable 接口，允许以简单的方式确定性地摧毁字符串中的安全内容。应用程序不再需要敏感的字符串内容时，只需调用\
  \ SecureString 的 Dispose 方法。在内部，Dispose 会对内存缓冲区的内容进行清零，确保恶意代码无法获得敏感信息，然后释放缓冲区。SecureString\
  \ 对象内部的一个字段引用了一个从 SafeBuffer 派生的对象，它负责维护实际的字符串。由于 SafeBuffer 类最终从 CriticalFinalizerObject²\
  \ 类派生，所以字符串在垃圾回收时，它的字节内容保证会被清零，而且缓冲区会得到释放。和 String 对\n\n① CLR 为了改善垃圾回收性能，引入了“代”（generation）的概念。简单地说，越新的对象，生命周期越短。越老的对象，生命周期越长。这些对象按照新老顺序，放入垃圾回收器专门分配的内存空间中（第\
  \ 0 代、第 1 代和第 2 代）。——译注\n\n② 第 21 章“自动内存管理（垃圾回收）”将讨论该抽象基类。\n\n```csharp\n}\n\n//\
  \ 这个方法是不安全的，因为它要访问非托管内存\nprivate unsafe static void DisplaySecureString(SecureString\
  \ ss) {\n    Char* pc = null;\n    try {\n        // 将 SecureString 解密到一个非托管内存缓冲区中\n\
  \        pc = (Char*) Marshal.SecureStringToCoTaskMemUnicode(ss);\n\n        //\
  \ 访问包含已解密 SecureString 的非托管内存缓冲区\n        for (Int32 index = 0; pc[index] != 0;\
  \ index++)\n            Console.Write(pc[index]);\n    }\n    finally {\n      \
  \  // 确定清零并释放包含已解密 SecureString 字符的非托管内存缓冲区\n        if (pc != null)\n         \
  \   Marshal.ZeroFreeCoTaskMemUnicode((IntPtr) pc);\n    }\n}\n\n}\n```\n\nSystem.Runtime.InteropServices.Marshal\
  \ 类提供了 5 个方法来将一个 SecureString 的字符解密到非托管内存缓冲区。所有方法都是静态方法，所有方法都接受一个 SecureString 参数，而且所有方法都返回一个\
  \ IntPtr。每个方法都另有一个配对的方法，必须调用配对方法来清零并释放内部缓冲区。表 14-4 总结了 System.Runtime.InteropServices.Marshal\
  \ 类提供的将 SecureString 解密到内部缓冲区的方法以及对应的清零和释放缓冲区的方法。\n\n### 表 14-4　Marshal 类提供的用于操纵安全字符串的方法\n\
  \n| 将 SecureString 解密到缓冲区的方法 | 清零并释放缓冲区的方法 |\n|---|---|\n| SecureStringToBSTR |\
  \ ZeroFreeBSTR |\n| SecureStringToCoTaskMemAnsi | ZeroFreeCoTaskMemAnsi |\n| SecureStringToCoTaskMemUnicode\
  \ | ZeroFreeCoTaskMemUnicode |\n| SecureStringToGlobalAllocAnsi | ZeroFreeGlobalAllocAnsi\
  \ |\n| SecureStringToGlobalAllocUnicode | ZeroFreeGlobalAllocUnicode |\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_335_0.png)\n"
- "## 第 15 章　枚举类型和位标志\n\n本章内容：\n\n- 枚举类型\n- 位标志\n- 为枚举类型添加方法\n\n本章要讨论枚举类型和位标志。由于 Microsoft\
  \ Windows 和许多编程语言多年来一直在使用这些结构，相信许多人已经知道了如何使用它们。不过，CLR 与 FCL 结合起来之后，枚举类型和位标志才真正成为面向对象的类型。而它们提供的一些非常“酷”的功能，我相信大多数开发人员并不熟悉。让我惊讶的是，这些新功能极大地简化了应用程序开发，个中缘由且听我娓娓道来。\n\
  \n### 15.1　枚举类型\n\n枚举类型(enumerated type)定义了一组“符号名称/值”配对。例如，以下 Color 类型定义了一组符号，每个符号都标识一种颜色：\n\
  \n```csharp\ninternal enum Color {\n    White,          // 赋值 0\n    Red,      \
  \      // 赋值 1\n    Green,          // 赋值 2\n    Blue,           // 赋值 3\n    Orange\
  \          // 赋值 4\n}\n```\n\n当然，也可写程序用 0 表示白色，用 1 表示红色，以此类推。不过，不应将这些数字硬编码到代码中，而应使用枚举类型，理由至少有二：\n\
  \n- 枚举类型使程序更容易编写、阅读和维护。有了枚举类型，符号名称可在代码中随便使用，程序员不需要费心思量每个硬编码值的含义(例如，不用念叨 white 是\
  \ 0，或者 0 是 white)。而且，一旦与符号名称对应的值发生改变，代码也可以简单地重新编译，不需要对源代码进行任何修改。此外，文档工具和其他实用程序(比如调试程序)能向开发人员显示有意义的符号名称。\n\
  - 枚举类型是强类型的。例如，将 Color.Orange 作为参数传给要求 Fruit 枚举类型的方法，编译器会报错。①\n\n① Fruit 枚举类型定义的应该是水果，而\
  \ **Color** 枚举类型定义的是颜色。虽然两个枚举类型中都有一个 **Orange**，但分别代表橙子和橙色。——译注\n\n在 Microsoft.NET\
  \ Framework 中，枚举类型不只是编译器所关注的符号，它还是类型系统中的“一等公民”，能实现很强大的操作。而在其他环境(比如非托管 C++中)，枚举类型是没有这个特点的。\n\
  \n每个枚举类型都直接从 **System.Enum** 派生，后者从 **System.ValueType** 派生，而 **System.ValueType**\
  \ 又从 **System.Object** 派生。所以，枚举类型是值类型(详情参见第 5 章“基元类型、引用类型和值类型”)，可用未装箱和已装箱的形式来表示。但有别于其他值类型，枚举类型不能定义任何方法、属性或事件。不过，可利用\
  \ C# 的“扩展方法”功能模拟向枚举类型添加方法，15.3 节“向枚举类型添加方法”展示了一个例子。\n\n编译枚举类型时，C#编译器把每个符号转换成类型的一个常量字段。例如，编译器将前面的\
  \ **Color** 枚举类型看成是以下代码：\n\n```csharp\ninternal struct Color : System.Enum {\n \
  \   // 以下是一些公共常量，它们定义了Color 的符号和值\n    public const Color White   = (Color) 0;\n\
  \    public const Color Red     = (Color) 1;\n    public const Color Green   = (Color)\
  \ 2;\n    public const Color Blue    = (Color) 3;\n    public const Color Orange\
  \  = (Color) 4;\n\n    // 以下是一个公共实例字段，包含 Color 变量的值，\n    // 不能写代码直接引用该字段\n    public\
  \ Int32 value__;\n}\n```\n\nC#编译器不会实际地编译上述代码，因为它禁止定义从特殊类型 **System.Enum** 派生的类型。不过，可通过上述伪类型定义了解内部的工作方式。简单地说，枚举类型只是一个结构，其中定义了一组常量字段和一个实例字段。常量字段会嵌入程序集的元数据中，并可通过反射来访问。这意味着可以在运行时获得与枚举类型关联的所有符号及其值。这还意味着可以将字符串符号转换成对应的数值。这些操作是通过\
  \ **System.Enum** 基类型来提供的，该类型提供了几个静态和实例方法，可利用它们操作枚举类型的实例，从而避免了必须使用反射的麻烦。下面将讨论其中一些操作。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_336_0.png)\n\n> **重要提示**　枚举类型定义的符号是常量值。所以当编译器发现代码引用了枚举类型的符号时，会在编译时用数值替换符号，代码不再引用定义了符号的枚举类型。这意味着运行时可能并不需要定义了枚举类型的程序集，编译时才需要。假如代码引用了枚举类型（而非仅仅引用类型定义的符号），那么运行时就需要包含了枚举类型定义的程序集。可能会出现一些版本问题，因为枚举类型符号是常量，而非只读的值。7.1\
  \ 节“常量”已解释过这些问题。\n\n例如，System.Enum 类型有一个名为 GetUnderlyingType 的静态方法，而 System.Type\
  \ 类型有一个名为 GetEnumUnderlyingType 的实例方法：\n\n    public static Type GetUnderlyingType(Type\
  \ enumType);       // System.Enum 中定义\n    public Type GetEnumUnderlyingType();\
  \                         // System.Type 中定义\n\n这些方法返回用于容纳一个枚举类型的值的基础类型。每个枚举类型都有一个基础类型，它可以是\
  \ byte、sbyte、short、ushort、int（最常用，也是 C# 默认选择的）、uint、long 或 ulong。虽然这些 C# 基元类型都有对应的\
  \ FCL 类型，但 C# 编译器为了简化本身的实现，要求只能指定基元类型名称。如果使用 FCL 类型名称（比如 Int32），会显示以下错误信息：\n\n**error\
  \ CS1008: 应输入类型 byte、sbyte、short、ushort、int、uint、long 或 ulong。**\n\n以下代码演示了如何声明一个基础类型为\
  \ byte（System.Byte）的枚举类型：\n\n    internal enum Color : byte {\n        White,\n\
  \        Red,\n        Green,\n        Blue,\n        Orange\n    }\n\n基于这个 **Color**\
  \ 枚举类型，以下代码显示了 **GetUnderlyingType** 的返回结果：\n\n    // 以下代码会显示 \"System.Byte\"\n\
  \    Console.WriteLine(Enum.GetUnderlyingType(typeof(Color)));\n\nC# 编译器将枚举类型视为基元类型。所以可用许多熟悉的操作符（=、!=、<、>、<=、>=、+、-、^、&、|、~、++\
  \ 和 --）来操纵枚举类型的实例。所有这些操作符实际作用于每个枚举类型实例内部的 **value__** 实例字段。此外，C# 编译器允许将枚举类型的实例显式转型为不同的枚举类型。也可显式将枚举类型实例转型为数值类型。\n\
  \n给定一个枚举类型的实例，可调用从 **System.Enum** 继承的 **ToString** 方法，把这个值映射为以下几种字符串表示：\n\n   \
  \ Color c = Color.Blue;\n    Console.WriteLine(c);                       // \"Blue\"\
  （常规格式）\n    Console.WriteLine(c.ToString());            // \"Blue\"（常规格式）\n    Console.WriteLine(c.ToString(\"\
  G\"));         // \"Blue\"（常规格式）\n    Console.WriteLine(c.ToString(\"D\"));    \
  \     // \"3\"（十进制格式）\n    Console.WriteLine(c.ToString(\"X\"));         // \"03\"\
  （十六进制格式）\n\n> **注意**　使用十六进制格式时，**ToString** 总是输出大写字母。此外，输出几位数取决于枚举的基础类型：**byte/sbyte**\
  \ 输出 2 位数，**short/ushort** 输出 4 位数，**int/uint** 输出 8 位数，而 **long/ulong** 输出 16 位数。如有必要会添加前导零。\n\
  \n除了 **ToString** 方法，**System.Enum** 类型还提供了静态 **Format** 方法，可调用它格式化枚举类型的值：\n\n \
  \   public static String Format(Type enumType, Object value, String format);\n\n\
  个人倾向于调用 **ToString** 方法，因为它需要的代码更少，而且更容易调用。但 **Format** 有一个 **ToString** 没有的优势：允许为\
  \ **value** 参数传递数值。这样就不一定要有枚举类型的实例。例如，以下代码将显示“Blue”：\n\n    // 以下代码显示\"Blue\"\n\
  \    Console.WriteLine(Enum.Format(typeof(Color), 3, \"G\"));\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_338_0.png)\n\
  \n> **注意**　声明有多个符号的枚举类型时，所有符号都可以有相同的数值。使用常规格式将数值转换为符号时，**Enum** 的方法会返回其中一个符号，但不保证具体返回哪一个符号名称。另外，如果没有为要查找的数值定义符号，会返回包含该数值的字符串。\n\
  \n也可调用 **System.Enum** 的静态方法 **GetValues** 或者 **System.Type** 的实例方法 **GetEnumValues**\
  \ 来返回一个数组，数组中的每个元素都对应枚举类型中的一个符号名称，每个元素都包含符号名称的数值：\n\n    public static Array GetValues(Type\
  \ enumType);    // System.Enum 中定义\n    public Array GetEnumValues();          \
  \           // System.Type 中定义\n\n该方法可以结合 **ToString** 方法使用以显示枚举类型中的所有符号名称及其对应数值，如下所示：\n\
  \n    Color[] colors = (Color[]) Enum.GetValues(typeof(Color));\n    Console.WriteLine(\"\
  Number of symbols defined: \" + colors.Length);\n    Console.WriteLine(\"Value\\\
  tSymbol\\n-----\\t------\");\n    foreach (Color c in colors) {\n        // 以十进制和常规格式显示每个符号\n\
  \        Console.WriteLine(\"{0,5:D}\\t{0:G}\", c);\n    }\n\n以上代码的输出如下：\n\n```text\n\
  Number of symbols defined: 5\nValue  Symbol\n-----  ------\n    0  White\n    1\
  \  Red\n    2  Green\n    3  Blue\n    4  Orange\n```\n\n我个人不喜欢 **GetValues** 和\
  \ **GetEnumValues** 方法，因为两者均返回一个 **Array**，必须转型成恰当的数组类型。所以我总是定义自己的方法：\n\n    public\
  \ static TEnum[] GetEnumValues<TEnum>() where TEnum : struct {\n        return (TEnum[])Enum.GetValues(typeof(TEnum));\n\
  \    }\n\n使用我的泛型 **GetEnumValues** 方法可获得更好的编译时类型安全性，而且上例的第一行代码可简化成以下形式：\n\n    Color[]\
  \ colors = GetEnumValues<Color>();\n\n前面的讨论展示了可以对枚举类型执行的一些很“酷”的操作。在程序的 UI 元素(列表框、组合框等)中显示符号名称时，我认为经常使用的会是\
  \ ToString 方法(常规格式)，前提是字符串不需要本地化(因为枚举类型没有提供本地化支持)。除了 GetValues 方法，System.Enum 和\
  \ System.Type 类型还提供了以下方法来返回枚举类型的符号：\n\n    // 返回数值的字符串表示\n    public static String\
  \ GetName(Type enumType, Object value);        // System.Enum 中定义\n    public String\
  \ GetEnumName(Object value);                          // System.Type 中定义\n\n   \
  \ // 返回一个 String 数组，枚举中每个符号都对应一个 String\n    public static String[] GetNames(Type\
  \ enumType);                   // System.Enum 中定义\n    public String[] GetEnumNames();\
  \                                   // System.Type 中定义\n\n前面讨论了用于查找枚举类型中的符号的多种方法。但还需要一个方法来查找与符号对应的值。例如，可利用这个操作转换用户在文本框中输入的一个符号。利用\
  \ Enum 提供的静态 Parse 和 TryParse 方法，可以很容易地将符号转换为枚举类型的实例：\n\n    public static Object\
  \ Parse(Type enumType, String value);\n    public static Object Parse(Type enumType,\
  \ String value, Boolean ignoreCase);\n    public static Boolean TryParse<TEnum>(String\
  \ value, out TEnum result) where TEnum: struct;\n    public static Boolean TryParse<TEnum>(String\
  \ value, Boolean ignoreCase, out TEnum result)\n        where TEnum : struct;\n\n\
  以下代码演示了如何使用这些方法：\n\n    // 因为 Orange 定义为 4，'c'被初始化为 4\n    Color c = (Color) Enum.Parse(typeof(Color),\
  \ \"orange\", true);\n\n    // 因为没有定义 Brown，所以抛出 ArgumentException 异常\n    Color\
  \ c = (Color) Enum.Parse(typeof(Color), \"Brown\", false);\n\n    // 创建值为1的 Color\
  \ 枚举类型实例\n    Enum.TryParse<Color>(\"1\", false, out c);\n\n    // 创建值为23的 Color\
  \ 枚举类型实例\n    Enum.TryParse<Color>(\"23\", false, out c);\n\n以下是 Enum 的静态 IsDefined\
  \ 方法和 Type 的 IsEnumDefined 方法：\n\n    public static Boolean IsDefined(Type enumType,\
  \ Object value);   // System.Enum 中定义\n    public Boolean IsEnumDefined(Object value);\
  \                      // System.Type 中定义\n\n可利用 IsDefined 方法判断数值对于某枚举类型是否合法：\n\n\
  \    // 显示\"True\"，因为 Color 将 Red 定义为1\n    Console.WriteLine(Enum.IsDefined(typeof(Color),\
  \ 1));\n\n    // 显示\"True\"，因为 Color 将 White 定义为0\n    Console.WriteLine(Enum.IsDefined(typeof(Color),\
  \ \"White\"));\n\n    // 显示\"False\"，因为检查要区分大小写\n    Console.WriteLine(Enum.IsDefined(typeof(Color),\
  \ \"white\"));\n\n    // 显示\"False\"，因为 Color 没有和值10对应的符号\n    Console.WriteLine(Enum.IsDefined(typeof(Color),\
  \ 10));\n\n\n\n**IsDefined** 方法被经常用于参数校验，如下例所示：\n\n```csharp\npublic void SetColor(Color\
  \ c) {\n    if (!Enum.IsDefined(typeof(Color), c)) {\n        throw(new ArgumentOutOfRangeException(\"\
  c\", c, \"无效颜色值。\"));\n    }\n    // 将颜色设置为 White、Red、Green、Blue 或 Orange\n    ...\n\
  }\n```\n\n参数校验是很有用的一个功能，因为其他人可能像下面这样调用 **SetColor**：\n\n```csharp\nSetColor((Color)\
  \ 547);\n```\n\n没有和值 547 对应的符号，所以 **SetColor** 方法抛出 **ArgumentOutOfRangeException**\
  \ 异常，指出哪个参数无效，并解释为什么无效。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_340_0.png)\n\
  \n> **重要提示**　**IsDefined** 方法很方便，但必须谨慎使用。首先，**IsDefined** 总是执行区分大小写的查找，而且完全没有办法让它执行不区分大小写的查找。其次，**IsDefined**\
  \ 相当慢，因为它在内部使用了反射。如果写代码来手动检查每一个可能的值，应用程序的性能极有可能变得更好。最后，只有当枚举类型本身在调用 **IsDefined**\
  \ 的同一个程序集定义时，才可使用 **IsDefined**。原因如下：假定 Color 枚举类型在一个程序集定义、**SetColor** 方法在另一个程序集定义。**SetColor**\
  \ 方法调用 **IsDefined**，假如颜色是 **White、Red、Green、Blue** 或者 **Orange**，那么 **SetColor**\
  \ 能正常执行。然而，假如 Color 枚举将来发生了变化，在其中包含了 **Purple**，那么 **SetColor** 现在就会接受 **Purple**，这是以前没有预料到的。因此，方法现在可能返回无法预料的结果。\n\
  \n最后，**System.Enum** 类型提供了一组静态 **ToObject** 方法。这些方法将 **Byte、SByte、Int16、UInt16、Int32、UInt32、Int64**\
  \ 或 **UInt64** 类型的实例转换为枚举类型的实例。\n\n枚举类型总是要与另外某个类型结合使用，一般作为类型的方法参数或返回类型、属性和字段使用。初学者经常提出的一个问题是：枚举类型是嵌套定义在需要它的类型中，还是和该类型同级？检查\
  \ FCL，会发现枚举类型通常与需要它的类同级。原因很简单，就是减少代码的录入量，使开发人员的工作变得更轻松。所以，除非担心名称冲突，否则你定义的枚举类型应该和需要它的类型同级。\n\
  \n### 15.2 位标志\n\n程序员经常要和位标志（bit flag）集合打交道。调用 **System.IO.File** 类型的 **GetAttributes**\
  \ 方法，会返回 **FileAttributes** 类型的一个实例。**FileAttributes** 类型是基本类型为 **Int32** 的枚举类型，其中每一位都反映了文件的一个特性（attribute）。**FileAttributes**\
  \ 类型在 FCL 中的定义如下：\n\n```csharp\nWrite       = 0x0002,\nReadWrite   = Actions.Read\
  \ | Actions.Write,\nDelete      = 0x0004,\nQuery       = 0x0008,\nSync        =\
  \ 0x0010\n}\n```\n\n由于 **Actions** 是枚举类型，所以在操纵位标志枚举类型时，可以使用上一节描述的所有方法。不过，假如其中一些方法的行为稍有区别，效果会更加理想。例如，假设有以下代码：\n\
  \n```csharp\nActions actions = Actions.Read | Actions.Delete;    // 0x0005\nConsole.WriteLine(actions.ToString());\
  \                // \"Read, Delete\"\n```\n\n调用 **ToString** 时，它会试图将数值转换为对应的符号。现在的数值是\
  \ **0x0005**，没有对应的符号。不过，**ToString** 方法检测到 **Actions** 类型上存在 **[Flags]** 特性，所以 **ToString**\
  \ 方法现在不会将该数值视为单独的值。相反，会把它视为一组位标志。由于 **0x0005** 由 **0x0001** 和 **0x0004** 组合而成，所以\
  \ **ToString** 会生成字符串 \"Read, Delete\"。从 **Actions** 类型中删除 **[Flags]** 特性，**ToString**\
  \ 方法将返回 \"5\"。\n\n上一节已讨论了 **ToString** 方法，指出它允许以 3 种方式格式化输出：\"G\"（常规）、\"D\"（十进制）和\"\
  X\"（十六进制）。使用常规格式来格式化枚举类型的实例时，首先会检查类型，看它是否应用了 **[Flags]** 这个特性。没有应用就查找与该数值匹配的符号并返回符号。如果应用了\
  \ **[Flags]** 特性，**ToString** 方法的工作过程如下所示。\n\n- 1. 获取枚举类型定义的数值集合，降序排列这些数值。\n- 2.\
  \ 每个数值都和枚举实例中的值进行“按位与”计算，假如结果等于数值，与该数值关联的字符串就附加到输出字符串上，对应的位会被认为已经考虑过了，会被关闭（设为 0）。这一步不断重复，直到检查完所有数值，或直到枚举实例的所有位都被关闭。\n\
  - 3. 检查完所有数值后，如果枚举实例仍然不为 0，表明枚举实例中一些处于 on 状态的位不对应任何已定义的符号。在这种情况下，**ToString** 将枚举实例中的原始数值作为字符串返回。\n\
  - 4. 如果枚举实例原始值不为 0，返回符号之间以逗号分隔的字符串。\n- 5. 如果枚举实例原始值为 0，而且枚举类型定义的一个符号对应的是 0 值，就返回这个符号。\n\
  - 6. 如果到达这一步，就返回 “0”。\n\n如果愿意，可以定义没有 **[Flags]** 特性的 **Actions** 类型，并用\"F\"格式获得正确的字符串：\n\
  \n```csharp\n// [Flags]                  // 现在已经被注释掉\ninternal enum Actions {\n\
  \    None       = 0,\n    Read       = 0x0001,\n    Write      = 0x0002,\n    ReadWrite\
  \  = Actions.Read | Actions.Write,\n    Delete     = 0x0004,\n    Query      = 0x0008,\n\
  \    Sync       = 0x0010\n}\n```\n\n```csharp\nActions actions = Actions.Read |\
  \ Actions.Delete;       // 0x0005\nConsole.WriteLine(actions.ToString(\"F\")); \
  \            // \"Read, Delete\"\n```\n\n如果数值有一个位不能映射到一个符号，返回的字符串只包含一个代表原始数值的十进制数；字符串中不会有符号。\n\
  \n注意，枚举类型中定义的符号不一定是 2 的整数次方。例如，**Actions** 类型可定义一个名为 **All** 的符号，它对应的值是 0x001F①。如果\
  \ **Actions** 类型的一个实例的值是 0x001F，格式化该实例就会生成一个含有“**All**”的字符串。其他符号字符串不会出现。\n\n前面讨论的是如何将数值转换成标志字符串（string\
  \ of flag）。还可将以逗号分隔的符号字符串转换成数值，这是通过调用 **Enum** 的静态方法 **Parse** 和 **TryParse** 来实现的。以下代码演示了如何使用这些方法：\n\
  \n```csharp\n// 由于 Query 被定义为 8，所以'a'被初始化为 8\nActions a = (Actions) Enum.Parse(typeof(Actions),\
  \ \"Query\", true);\nConsole.WriteLine(a.ToString()); // \"Query\"\n\n// 由于 Query\
  \ 和 Read 已定义，所以'a'被初始化为 9\nEnum.TryParse<Actions>(\"Query, Read\", false, out a);\n\
  Console.WriteLine(a.ToString()); // \"Read, Query\"\n\n// 创建一个 Actions 枚举类型实例，其值为\
  \ 28\na = (Actions) Enum.Parse(typeof(Actions), \"28\", false);\nConsole.WriteLine(a.ToString());\
  \ // \"Delete, Query, Sync\"\n```\n\n**Parse** 和 **TryParse** 方法在调用时，会在内部执行以下动作。\n\
  \n- 1. 删除字符串头尾的所有空白字符。\n- 2. 如果字符串第一个字符是数字、加号(+)或减号(-)，该字符串会被认为是一个数字，方法返回一个枚举类型实例，其数值等于字符串转换后的数值。\n\
  - 3. 传递的字符串被分解为一组以逗号分隔的 token，每个 token 的空白字符都被删除。\n- 4. 在枚举类型的已定义符号中查找每个 token 字符串。如果没有找到相应的符号，**Parse**\
  \ 会抛出 **System.ArgumentException** 异常；而 **TryParse** 会返回 false。如果找到符号，就将它对应的数值与当前的一个动态结果进行“按位或”计算，再查找下一个符号。\n\
  - 5. 查找并找到了所有标记之后，返回这个动态结果。\n\n永远不要对位标志枚举类型使用 **IsDefined** 方法。以下两方面原因造成该方法无法使用。\n\
  \n- 向 **IsDefined** 方法传递字符串，它不会将这个字符串拆分为单独的 token 来进行查找，而是试图查找整个字符串，把它看成是包含逗号的一个更大的符号。由于不能在枚举类型中定义含有逗号的符号，所以这个符号永远找不到。\n\
  - 向 `IsDefined` 方法传递一个数值，它会检查枚举类型是否定义了其数值和传入数值匹配的一个符号。由于位标志不能这样简单地匹配，所以 `IsDefined`\
  \ 通常会返回 `false`。\n\n① 计算可知，二进制 00000001(Read) | 00000010(Write) | 00000100(Delete)\
  \ | 00001000(Query) | 00010000(Sync) = 00011111(All) = 十六进制 0x001F。——译注\n\n### 15.3\
  \ 向枚举类型添加方法\n\n本章早些时候曾指出，不能将方法定义为枚举类型的一部分。多年以来，我对此一直感到很“郁闷”，因为很多时候都需要为我的枚举类型提供一些方法。幸好，现在可以利用\
  \ C# 的扩展方法功能（参见第 8 章“方法”）模拟向枚举类型添加方法。\n\n要为 FileAttributes 枚举类型添加方法，先定义一个包含了扩展方法的静态类，如下所示：\n\
  \n```csharp\ninternal static class FileAttributesExtensionMethods {\n    public\
  \ static Boolean IsSet(this FileAttributes flags, FileAttributes flagToTest) {\n\
  \        if (flagToTest == 0)\n            throw new ArgumentOutOfRangeException(\"\
  flagToTest\", \"Value must not be 0\");\n        return (flags & flagToTest) ==\
  \ flagToTest;\n    }\n\n    public static Boolean IsClear(this FileAttributes flags,\
  \ FileAttributes flagToTest) {\n        if (flagToTest == 0)\n            throw\
  \ new ArgumentOutOfRangeException(\"flagToTest\", \"Value must not be 0\");\n  \
  \      return !IsSet(flags, flagToTest);\n    }\n\n    public static Boolean AnyFlagsSet(this\
  \ FileAttributes flags, FileAttributes testFlags) {\n        return ((flags & testFlags)\
  \ != 0);\n    }\n\n    public static FileAttributes Set(this FileAttributes flags,\
  \ FileAttributes setFlags) {\n        return flags | setFlags;\n    }\n\n    public\
  \ static FileAttributes Clear(this FileAttributes flags,\n        FileAttributes\
  \ clearFlags) {\n        return flags & ~clearFlags;\n    }\n\n    public static\
  \ void ForEach(this FileAttributes flags,\n        Action<FileAttributes> processFlag)\
  \ {\n        if (processFlag == null) throw new ArgumentNullException(\"processFlag\"\
  );\n        for (UInt32 bit = 1; bit != 0; bit <<= 1)\n            UInt32 temp =\
  \ ((UInt32)flags) & bit;\n            if (temp != 0) processFlag((FileAttributes)temp);\n\
  \    }\n}\n```\n\n以下代码演示了如何调用其中的一些方法。从表面上看，似乎真的是在枚举类型上调用这些方法：\n\n```csharp\nFileAttributes\
  \ fa = FileAttributes.System;\nfa = fa.Set(FileAttributes.ReadOnly);\nfa = fa.Clear(FileAttributes.System);\n\
  fa.ForEach(f => Console.WriteLine(f));\n```\n\n① 因为 bit flag 一般都要组合起来使用。——译注\n"
- "## 第 16 章　数组\n\n- **本章内容：**\n- 初始化数组元素\n- 数组转型\n- 所有数组都隐式派生自 **System.Array**\n\
  - 所有数组都隐式实现 **IEnumerable、ICollection 和 IList**\n- 数组的传递和返回\n- 创建下限非零的数组\n- 数组的内部工作原理\n\
  - 不安全的数组访问和固定大小的数组\n\n数组是允许将多个数据项作为集合来处理的机制。CLR 支持一维、多维和交错数组（即数组构成的数组）。所有数组类型都隐式地从\
  \ **System.Array** 抽象类派生，后者又派生自 **System.Object**。这意味着数组始终是引用类型，是在托管堆上分配的。在应用程序的变量或字段中，包含的是对数组的引用，而不是包含数组本身的元素。下面的代码更清楚地说明了这一点：\n\
  \n```csharp\nInt32[] myIntegers;          // 声明一个数组引用\nmyIntegers = new Int32[100];\
  \  // 创建含有 100 个 Int32 的数组\n```\n\n第一行代码声明 **myIntegers** 变量，它能指向包含 **Int32** 值的一维数组。**myIntegers**\
  \ 刚开始被设为 **null**，因为当时还没有分配数组。第二行代码分配了含有 100 个 **Int32** 值的数组，所有 **Int32** 都被初始化为\
  \ 0。由于数组是引用类型，所以会在托管堆上分配容纳 100 个未装箱 **Int32** 所需的内存块。实际上，除了数组元素，数组对象占据的内存块还包含一个类型对象指针、一个同步块索引和一些额外的成员①。该数组的内存块地址被返回并保存到\
  \ **myIntegers** 变量中。\n\n① 这些额外的成员称为 overhead 字段或者说“开销字段”。——译注\n\n还可创建引用类型的数组：\n\
  \n```csharp\nControl[] myControls;          // 声明一个数组引用\nmyControls = new Control[50];\
  \  // 创建含有 50 个 Control 引用的数组\n```\n\n第一行代码声明 **myControls** 变量，它能指向包含 **Control**\
  \ 引用的一维数组。**myControls** 刚开始被设为 null，因为当时还没有分配数组。第二行代码分配了含有 50 个 Control 引用的数组，这些引用全被初始化为\
  \ null。由于 Control 是引用类型，所以创建数组只是创建了一组引用，此时没有创建实际的对象。这个内存块的地址被返回并保存到 myControls 变量中。\n\
  \n图 16-1 展示了值类型的数组和引用类型的数组在托管堆中的情况。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_346_0.png)\n\
  \n图 16-1  值类型和引用类型的数组在托管堆中的情况\n\n在图 16-1 中，Control 数组显示了执行以下各行代码之后的结果：\n\n```csharp\n\
  myControls[1] = new Button();\nmyControls[2] = new TextBox();\nmyControls[3] = myControls[2];\
  \    // 两个元素引用同一个对象\nmyControls[46] = new DataGrid();\nmyControls[48] = new ComboBox();\n\
  myControls[49] = new Button();\n```\n\n为了符合“公共语言规范”（Common Language Specification，CLS）的要求，所有数组都必须是\
  \ 0 基数组（即最小索引为 0）。这样就可以用 C# 的方法创建数组，并将该数组的引用传给用其他语言（比如 Microsoft Visual Basic .NET）写的代码。此外，由于\
  \ 0 基数组是最常用的数组（至少就目前而言），所以 Microsoft 花了很大力气优化性能。不过，CLR 确实支持非 0 基数组，只是不提倡使用。对于不介意稍许性能下降或者跨语言移植问题的读者，本章后文将介绍如何创建和使用非\
  \ 0 基数组。\n\n注意在图 16-1 中，每个数组都关联了一些额外的开销信息。这些信息包括数组的秩①、数组每一维的下限（几乎总是 0）和每一维的长度。开销信息还包含数组的元素类型。本章后文将介绍查询这种开销信息的方法。\n\
  \n前面已通过几个例子演示了如何创建一维数组。应尽可能使用一维 0 基数组，有时也将这种数组称为 SZ② 数组或向量（vector）。向量的性能是最佳的，因为可以使用一些特殊的\
  \ IL 指令。\n\n① 即 rank，或称数组的维数。——译注\n\n② SZ 是 single-dimension，zero-based（一维 0 基）的简称。——译注\n\
  \n\n\n会（比如 **newarr、ldelem、ldelema、ldlen** 和 **stelem**）来处理。不过，必要时也可使用多维数组。下面展示了几个多维数组的例子：\n\
  \n```csharp\n// 创建一个二维数组，由 Double 值构成\nDouble[,] myDoubles = new Double[10, 20];\n\
  \n// 创建一个三维数组，由 String 引用构成\nString[,,] myStrings = new String[5, 3, 10];\n```\n\
  \nCLR 还支持交错数组（jagged array），即数组构成的数组。交错数组的性能和普通向量一样好。不过，访问交错数组的元素意味着必须进行两次或更多次数组访问。下例演示了如何创建一个多边形数组，每个多边形都由一个包含\
  \ **Point** 实例的数组构成：\n\n```csharp\n// 创建由多个 Point 数组构成的一维数组\nPoint[][] myPolygons\
  \ = new Point[3][];\n\n// myPolygons[0] 引用一个含有 10 个 Point 实例的数组\nmyPolygons[0] =\
  \ new Point[10];\n\n// myPolygons[1] 引用一个含有 20 个 Point 实例的数组\nmyPolygons[1] = new\
  \ Point[20];\n\n// myPolygons[2] 引用一个含有 30 个 Point 实例的数组\nmyPolygons[2] = new Point[30];\n\
  \n// 显示第一个多边形中的 Point\nfor (Int32 x = 0; x < myPolygons[0].Length; x++)\n    Console.WriteLine(myPolygons[0][x]);\n\
  ```\n\n> **注意** CLR 会验证数组索引的有效性。换句话说，不能创建含有 100 个元素的数组（索引编号 0 到 99），然后试图访问索引为 -5\
  \ 或 100 的元素。这样做会导致 **System.IndexOutOfRangeException** 异常。允许访问数组范围之外的内存会破坏类型安全性，而且会造成潜在的安全漏洞，所以\
  \ CLR 不允许可验证的代码这么做。通常，索引范围检查对性能的影响微乎其微，因为 JIT 编译器通常只在循环开始之前检查一次数组边界，而不是每次循环迭代都检查①。不过，如果仍然担心\
  \ CLR 索引检查造成的性能损失，可以在 C# 中使用 unsafe 代码来访问数组。16.7 节“数组的内部工作原理”将演示具体做法。\n\n① 不要混淆“循环”和“循环迭代”。例如以下代码：\n\
  \n```csharp\nInt32[] myArray = new Int32[100];\nfor (Int32 i = 0; i < myArray.Length;\
  \ i++) myArray[i] = i;\n```\n\n“for 循环”总共要“循环迭代 100 次”，有时也简单地说“迭代 100 次”。——译注\n\n\
  ### 16.1 初始化数组元素\n\n前面展示了如何创建数组对象，如何初始化数组中的元素。C# 允许用一个语句做这两件事情。例如：\n\n```csharp\n\
  String[] names = new String[] { \"Aidan\", \"Grant\" };\n```\n\n大括号中以逗号分隔的数据项称为**数组初始化器**(array\
  \ initializer)。每个数据项都可以是一个任意复杂度的表达式；在多维数组的情况下，则可以是一个嵌套的数组初始化器。上例只使用了两个简单的 **String**\
  \ 表达式。\n\n在方法中声明局部变量来引用初始化好的数组时，可利用 C# 的“隐式类型的局部变量”功能来简化一下代码：\n\n```csharp\n// 利用\
  \ C# 的隐式类型的局部变量功能：\nvar names = new String[] { \"Aidan\", \"Grant\" };\n```\n\n\
  编译器推断局部变量 **names** 是 **String[]** 类型，因为那是赋值操作符(=)右侧的表达式的类型。\n\n可利用 C# 的隐式类型的数组功能让编译器推断数组元素的类型。注意，下面这行代码没有在\
  \ **new** 和 **[]** 之间指定类型。\n\n```csharp\n// 利用 C# 的隐式类型的局部变量和隐式类型的数组功能：\nvar names\
  \ = new[] { \"Aidan\", \"Grant\", null };\n```\n\n在上一行中，编译器检查数组中用于初始化数组元素的表达式的类型，并选择所有元素最接近的共同基类来作为数组的类型。在本例中，编译器发现两个\
  \ **String** 和一个 **null**。由于 **null** 可隐式转型为任意引用类型(包括 **String**)，所以编译器推断应该创建和初始化一个由\
  \ **String** 引用构成的数组。但假如写以下代码：\n\n```csharp\n// 使用 C# 的隐式类型的局部变量和隐式类型的数组功能：(错误)\n\
  var names = new[] { \"Aidan\", \"Grant\", 123 };\n```\n\n编译器就会报错：**error CS0826:\
  \ 找不到隐式类型数组的最佳类型。** 这是由于两个 **String** 和一个 **Int32** 的共同基类是 **Object**，意味着编译器不得不创建\
  \ **Object** 引用的一个数组，然后对 **123** 进行装箱，并让最后一个数组元素引用已装箱的、值为 **123** 的一个 **Int32**。C#\
  \ 团队认为，隐式对数组元素进行装箱是一个代价高昂的操作，所以要在编译时报错。\n\n作为初始化数组时的一个额外的语法奖励，还可以像下面这样写：\n\n```csharp\n\
  String[] names = { \"Aidan\", \"Grant\" };\n```\n\n注意，赋值操作符(=)右侧只给出了一个初始化器，没有 **new**，没有类型，没有\
  \ **[]**。这个语法可读性很好，但遗憾的是，C# 编译器不允许在这种语法中使用隐式类型的局部变量：\n\n```csharp\n// 试图使用隐式类型的局部变量(错误)\n\
  var names = { \"Aidan\", \"Grant\" };\n```\n\n试图编译上面这行代码，编译器会报告以下两条消息。\n\n- **error\
  \ CS0820**：无法用数组初始化设定项初始化隐式类型的局部变量。\n- **error CS0622**：只能使用数组初始化设定项表达式为数组类型赋值，请尝试改用\
  \ **new** 表达式。\n\n虽然理论上可以通过编译，但 C# 团队认为编译器在这里会为你做太多的工作。它要推断数组类型，新建数组对象，初始化数组，还要推断局部变量的类型。\n\
  \n最后讲一下“隐式类型的数组”如何与“匿名类型”和“隐式类型的局部变量”组合使用。10.1.4 节“匿名类型”已讨论了匿名类型以及如何保证类型同一性。下面来看看以下代码：\n\
  \n```csharp\n// 使用 C# 的隐式类型的局部变量、隐式类型的数组和匿名类型功能：\nvar kids = new[] { new { Name=\"\
  Aidan\" }, new { Name=\"Grant\" } };\n\n// 示例用法(用了另一个隐式类型的局部变量)：\nforeach (var kid\
  \ in kids)\n    Console.WriteLine(kid.Name);\n```\n\n这个例子在一个数组初始化器中添加了两个用于定义数组元素的表达式。每个表达式都代表一个匿名类型(因为\
  \ new 操作符后没有提供类型名称)。由于两个匿名类型具有一致的结构(有一个 String 类型的 Name 字段)，所以编译器知道这两个对象具有相同的类型(类型的同一性)。然后，我使用了\
  \ C# 的“隐式类型的数组”功能(在 new 和 [] 之间不指定类型)，让编译器推断数组本身的类型，构造这个数组对象，并初始化它内部的两个引用，指向匿名类型的两个实例。最后，将对这个数组对象的引用赋给\
  \ kids 局部变量，该变量的类型通过 C# 的“隐式类型的局部变量”功能来推断。\n\n第二行代码用 foreach 循环演示如何使用刚才创建的、用两个匿名类型实例初始化的数组。注意必须为循环使用隐式类型的局部变量(kid)。运行这段代码将得到以下输出：\n\
  \n```text\nAidan\nGrant\n```\n\n### 16.2 数组转型\n\n对于元素为引用类型的数组，CLR 允许将数组元素从一种类型转型为另一种。成功转型要求数组维数相同，而且必须存在从元素源类型到目标类型的隐式或显式转换。CLR\
  \ 不允许将值类型元素的数组转型为其他任何类型。(不过，可用 Array.Copy 方法创建新数组并在其中填充元素来模拟这种效果。)① 以下代码演示了数组转型：\n\
  \n① 注意，**Array.Copy** 方法执行的是浅拷贝。换言之，如果数组元素是引用类型，新数组将引用现有的对象。——译注\n\n```csharp\n\
  // 创建二维 FileStream 数组\nFileStream[,] fs2dim = new FileStream[5, 10];\n\n// 隐式转型为二维\
  \ Object 数组\nObject[,] o2dim = fs2dim;\n\n// 二维数组不能转型为一维数组，编译器报错：\n// error CS0030:\
  \ 无法将类型\"object[*,*]\"转换为\"System.IO.Stream[]\"\nStream[] s1dim = (Stream[]) o2dim;\n\
  \n// 显式转型为二维 Stream 数组\nStream[,] s2dim = (Stream[,]) o2dim;\n\n// 显式转型为二维 String\
  \ 数组\n// 能通过编译，但在运行时抛出 InvalidCastException 异常\nString[,] st2dim = (String[,]) o2dim;\n\
  \n// 创建一维 Int32 数组（元素是值类型）\nInt32[] i1dim = new Int32[5];\n\n// 不能将值类型的数组转型为其他任何类型，编译器报错：\n\
  // error CS0030: 无法将类型“int[]”转换为“object[]”\nObject[] o1dim = (Object[]) i1dim;\n\
  \n// 创建一个新数组，使用 Array.Copy 将源数组中的每个元素\n// 转型为目标数组中的元素类型，并把它们复制过去。\n// 下面的代码创建元素为引用类型的数组，\n\
  // 每个元素都是对已装箱 Int32 的引用\nObject[] o1dim = new Object[i1dim.Length];\nArray.Copy(i1dim,\
  \ o1dim, i1dim.Length);\n```\n\nArray.Copy 的作用不仅仅是将元素从一个数组复制到另一个数组。Copy 方法还能正确处理内存的重叠区域，就像\
  \ C 的 memmove 函数一样。有趣的是，C 的 memcpy 函数反而不能正确处理重叠的内存区域。Copy 方法还能在复制每个数组元素时进行必要的类型转换，具体如下所述：\n\
  \n- 将值类型的元素装箱为引用类型的元素，比如将一个 **Int32[]** 复制到一个 **Object[]** 中。\n- 将引用类型的元素拆箱为值类型的元素，比如将一个\
  \ **Object[]** 复制到一个 **Int32[]** 中。\n- 加宽 CLR 基元类型，比如将一个 **Int32[]** 的元素复制到一个 **Double[]**\
  \ 中。\n- 在两个数组之间复制时，如果仅从数组类型证明不了两者的兼容性，比如从 **Object[]** 转型为 **IFormattable[]**，就根据需要对元素进行向下类型转换。如果\
  \ **Object[]** 中的每个对象都实现了 **IFormattable**，Copy 方法就能成功执行。\n\n下面演示了 Copy 方法的另一种用法：\n\
  \n```csharp\n// 定义实现了一个接口的值类型\ninternal struct MyValueType : IComparable {\n   \
  \ public Int32 CompareTo(Object obj) {\n        ...\n    }\n}\n\npublic static class\
  \ Program {\n    public static void Main() {\n        // 创建含有 100 个值类型的数组\n    \
  \    MyValueType[] src = new MyValueType[100];\n\n        // 创建 IComparable 引用数组\n\
  \        IComparable[] dest = new IComparable[src.Length];\n\n        // 初始化 IComparable\
  \ 数组中的元素，\n        // 使它们引用源数组元素的已装箱版本\n        Array.Copy(src, dest, src.Length);\n\
  \    }\n}\n```\n\n地球人都能猜得到，FCL 频繁运用了 Array 的 Copy 方法。\n\n有时确实需要将数组从一种类型转换为另一种类型。这种功能称为数组协变性（array\
  \ covariance）。但在利用它时要清楚由此而来的性能损失。假设有以下代码：\n\n```csharp\nString[] sa = new String[100];\n\
  Object[] oa = sa;       // oa 引用一个 String 数组\noa[5] = \"Jeff\";        // 性能损失：CLR\
  \ 检查 oa 的元素类型是不是 String；检查通过\noa[3] = 5;             // 性能损失：CLR 检查 oa 的元素类型是不是\
  \ Int32；发现有错。\n                       // 抛出 ArrayTypeMismatchException 异常\n```\n\
  \n在上述代码中，oa 变量被定义为 Object[] 类型，但实际引用的是一个 String[]。编译器允许代码将 5 放到数组元素中，因为 5 是 Int32，而\
  \ Int32 派生自 Object。虽然编译能通过，但 CLR 必须保证类型安全。对数组元素赋值时，它必须保证赋值的合法性。所以，CLR 必须在运行时检查数组包含的是不是\
  \ Int32 元素。在本例中，答案是否定的，所以不允许赋值；CLR 抛出 ArrayTypeMismatchException 异常。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_351_0.png)\n\
  \n> **注意** 如果只是需要将数组的某些元素复制到另一个数组，可选择 System.Buffer 的 BlockCopy 方法，它比 Array 的 Copy\
  \ 方法快。但 Buffer 的 BlockCopy 方法只支持基元类型，不提供像 Array 的 Copy 方法那样的转型能力。方法的 Int32 参数代表的是数组中的字节偏移量，而非元素索引。设计\
  \ BlockCopy 的目的实际上是将按位兼容（bitwise-compatible）的数据从一个数组类型复制到另一个按位兼容的数据类型，比如将包含 Unicode\
  \ 字符的一个 Byte[]（按字节的正确顺序）复制到一个 Char[] 中。该方法一定程度上弥补了不能将数组当作任意类型的内存块来处理的不足。\n> \n>\
  \ 要将一个数组的元素可靠地复制到另一个数组，应该使用 System.Array 的 ConstrainedCopy 方法。该方法要么完成复制，要么抛出异常，总之不会破坏目标数组中的数据。这就允许\
  \ ConstrainedCopy 在约束执行区域（Constrained Execution Region，CER）中执行。为了提供这种保证，ConstrainedCopy\
  \ 要求源数组的元素类型要么与目标数组的元素类型相同，要么派生自目标数组的元素类型。另外，它不执行任何装箱、拆箱或向下类型转换。\n\n① “按位兼容”因为英文原文是\
  \ bitwise-compatible，所以人们发明了 blittable 一词来表示这种类型。这种类型在托管和非托管内存中具有相同的表示。一部分基元类型是\
  \ blittable 类型。如果一维数组包含的是 blittable 类型，该数组也是 blittable 类型。另外，格式化的值类型如果只包含 blittable\
  \ 类型，该值类型也是 blittable 类型。欲知详情，请在 MSDN 文档中搜索“可直接复制到本机结构中的类型和非直接复制到本机结构中的类型”这一主题。——译注\n\
  \n### 16.3 所有数组都隐式派生自 System.Array\n\n像下面这样声明数组变量：\n\n```csharp\nFileStream[] fsArray;\n\
  ```\n\nCLR 会自动为 AppDomain 创建一个 FileStream[] 类型。该类型隐式派生自 System.Array 类型；因此，System.Array\
  \ 类型定义的所有实例方法和属性都将由 FileStream[] 继承，使这些方法和属性能通过 fsArray 变量调用。这极大方便了数组处理，因为 System.Array\
  \ 定义了许多有用的实例方法和属性，比如 Clone，CopyTo，GetLength，GetLongLength，GetLowerBound，GetUpperBound，Length，Rank\
  \ 等。\n\nSystem.Array 类型还公开了很多有用的、用于数组处理的静态方法。这些方法均获取一个数组引用作为参数。一些有用的静态方法包括：AsReadOnly，BinarySearch，Clear，ConstrainedCopy，ConvertAll，Copy，Exists，Find，FindAll，FindIndex，FindLast，FindLastIndex，ForEach，IndexOf，LastIndexOf，Resize，Reverse，Sort\
  \ 和 TrueForAll。这些方法中，每个都有多个重载版本。事实上，许多方法还提供了泛型重载版本，能保障编译时的类型安全性和良好的性能。鼓励大家查阅文档，体会这些方法究竟多么有用和强大！\n\
  \n### 16.4 所有数组都隐式实现 IEnumerable，ICollection 和 IList\n\n许多方法都能操纵各种各样的集合对象，因为它们声明为接受\
  \ IEnumerable、ICollection 和 IList 等参数。可将数组传给这些方法，因为 System.Array 也实现了这三个接口。System.Array\
  \ 之所以实现这些非泛型接口，是因为这些接口将所有元素都视为 System.Object。然而，最好是让 System.Array 实现这些接口的泛型形式，提供更好的编译时类型安全性和更好的性能。\n\
  \n不过，由于涉及多维数组和非 0 基数组的问题，CLR 团队不希望 System.Array 实现 IEnumerable<T>，ICollection<T>和\
  \ IList<T>。若在 System.Array 上定义这些接口，就会为所有数组类型启用这些接口。所以，CLR 没有这么做，而是耍了一个小花招；创建一维 0\
  \ 基数组类型时，CLR 自动使数组类型实现 IEnumerable<T>，ICollection<T>和 IList<T>（T 是数组元素的类型）。同时，还为数组类型的所有基类型实现这三个接口，只要它们是引用类型。以下层次结构图对此进行了澄清：\n\
  \n```text\nObject\n    Array (非泛型 IEnumerable, ICollection, IList)\n        Object[]\
  \                  (IEnumerable, ICollection, IList of Object)\n            String[]\
  \              (IEnumerable, ICollection, IList of String)\n            Stream[]\
  \              (IEnumerable, ICollection, IList of Stream)\n                FileStream[]\
  \      (IEnumerable, ICollection, IList of FileStream)\n                .\n    \
  \            .             (其他引用类型的数组)\n                .\n```\n\n所以，如果执行以下代码：\n\
  \n```csharp\nFileStream[] fsArray;\n```\n\n那么当 CLR 创建 FileStream[] 类型时，会自动为这个类型实现\
  \ IEnumerable<FileStream>，ICollection<FileStream>和 IList<FileStream>接口。此外，FileStream[]\
  \ 类型还会为基类型实现接口：IEnumerable<Stream>，IEnumerable<Object>，ICollection<Stream>，ICollection<Object>，IList<Stream>和\
  \ IList<Object>。由于所有这些接口都由 CLR 自动\n\n```csharp\nAppointment[] appointments = GetAppointmentsForToday();\n\
  if (appointments != null) {\n    for (Int32 a = 0; a < appointments.Length; a++)\
  \ {\n        // 对 appointments[a] 执行操作\n    }\n}\n```\n\n将方法设计为返回对含有 0 个元素的一个数组的引用，而不是返回\
  \ null，该方法的调用者就能更轻松地使用该方法。顺便提一句，对字段也应如此。如果类型中有一个字段是数组引用，应考虑让这个字段始终引用数组，即使数组中不包含任何元素。\n\
  \n### 16.6 创建下限非零的数组\n\n前面提到过，能创建和操作下限非 0 的数组。可以调用数组的静态 **CreateInstance** 方法来动态创建自己的数组。该方法有若干个重载版本，允许指定数组元素的类型、数组的维数、每一维的下限和每一维的元素数目。**CreateInstance**\
  \ 为数组分配内存，将参数信息保存到数组的内存块的开销(overhead)部分，然后返回对该数组的引用。如果数组维数是 2 或 2 以上，就可以把 **CreateInstance**\
  \ 返回的引用转型为一个 **ElementType[][]** 变量(**ElementType** 要替换为类型名称)，以简化对数组中的元素的访问。如果只有一维，C#要求必须使用该\
  \ **Array** 的 **GetValue** 和 **SetValue** 方法访问数组元素。\n\n以下代码演示了如何动态创建由 **System.Decimal**\
  \ 值构成的二维数组。第一维代表 2005 到 2009(含)年份，第二维代表 1 到 4(含)季度。代码遍历动态数组中的所有元素。我本来可以将数组的上限硬编码到代码中，这样能获得更好的性能。但我最后决定使用\
  \ **System.Array** 的 **GetLowerBound** 和 **GetUpperBound** 方法来演示它们的用法：\n\n```csharp\n\
  using System;\n\npublic sealed class DynamicArrays {\n    public static void Main()\
  \ {\n        // 我想创建一个二维数组 (2005..2009)[1..4]\n        Int32[] lowerBounds = { 2005,\
  \ 1 };\n        Int32[] lengths = { 5, 4 };\n        Decimal[,] quarterlyRevenue\
  \ = (Decimal[,])\n            Array.CreateInstance(typeof(Decimal), lengths, lowerBounds);\n\
  \n        Console.WriteLine(\"{0,4} {1,9} {2,9} {3,9} {4,9}\",\n            \"Year\"\
  , \"Q1\", \"Q2\", \"Q3\", \"Q4\");\n        Int32 firstYear = quarterlyRevenue.GetLowerBound(0);\n\
  \        Int32 lastYear = quarterlyRevenue.GetUpperBound(0);\n        Int32 firstQuarter\
  \ = quarterlyRevenue.GetLowerBound(1);\n        Int32 lastQuarter = quarterlyRevenue.GetUpperBound(1);\n\
  \n        for (Int32 year = firstYear; year <= lastYear; year++) {\n           \
  \ Console.Write(year + \" \");\n            for (Int32 quarter = firstQuarter; quarter\
  \ <= lastQuarter; quarter++) {\n                Console.Write(\"{0,9:C} \", quarterlyRevenue[year,\
  \ quarter]);\n            }\n            Console.WriteLine();\n        }\n    }\n\
  }\n```\n\n编译并运行这段代码将得到以下输出：\n\n| Year | Q1 | Q2 | Q3 | Q4 |\n|---|---|---|---|---|\n\
  | 2005 | $0.00 | $0.00 | $0.00 | $0.00 |\n| 2006 | $0.00 | $0.00 | $0.00 | $0.00\
  \ |\n| 2007 | $0.00 | $0.00 | $0.00 | $0.00 |\n| 2008 | $0.00 | $0.00 | $0.00 |\
  \ $0.00 |\n| 2009 | $0.00 | $0.00 | $0.00 | $0.00 |\n\n### 16.7 数组的内部工作原理\n\nCLR\
  \ 内部实际支持两种不同的数组。\n\n- 下限为 0 的一维数组。这些数组有时称为 SZ(single-dimensional, zero-based（一维\
  \ 0 基）)数组或向量(vector)。\n- 下限未知的一维或多维数组。\n\n可执行以下代码来实际地查看不同种类的数组(注释显示了输出)\n\n```csharp\n\
  using System;\n\npublic sealed class Program {\n    public static void Main() {\n\
  \        Array a;\n\n        // 创建一维的 0 基数组，不包含任何元素\n        a = new String[0];\n\
  \        Console.WriteLine(a.GetType()); // \"System.String[]\"\n\n        // 创建一维\
  \ 0 基数组，不包含任何元素\n        a = Array.CreateInstance(typeof(String),\n            new\
  \ Int32[] { 0 }, new Int32[] { 0 });\n        Console.WriteLine(a.GetType()); //\
  \ \"System.String[]\"\n\n        // 创建一维 1 基数组，其中不包含任何元素\n        a = Array.CreateInstance(typeof(String),\n\
  \            new Int32[] { 0 }, new Int32[] { 1 });\n        Console.WriteLine(a.GetType());\
  \ // \"System.String[*]\" <-- 这个显示很奇怪，不是吗？\n\n        Console.WriteLine();\n\n \
  \       // 创建二维 0 基数组，其中不包含任何元素\n        a = new String[0, 0];\n        Console.WriteLine(a.GetType());\
  \ // \"System.String[,]\"\n\n        // 创建二维 0 基数组，其中不包含任何元素\n        a = Array.CreateInstance(typeof(String),\n\
  \            new Int32[] { 0, 0 }, new Int32[] { 0, 0 });\n        Console.WriteLine(a.GetType());\
  \ // \"System.String[,]\"\n\n        // 创建二维的 1 基数组，其中不包含任何元素\n        a = Array.CreateInstance(typeof(String),\n\
  \            new Int32[] { 0, 0 }, new Int32[] { 1, 1 });\n        Console.WriteLine(a.GetType());\
  \ // \"System.String[,]\"\n    }\n}\n```\n\n每个 **Console.WriteLine** 语句后都有一条指出其输出的注释。对于一维数组，0\
  \ 基数组显示的类型名称是 **System.String[]**，但 1 基数组显示的是 **System.String[*]**。* 符号表明 CLR 知道该数组不是\
  \ 0 基的。注意，C#不允许声明 `String[*]` 类型的变量，因此不能使用 C#语法来访问一维非 0 基数组。尽管可以调用 Array 的 `GetValue`\
  \ 和 `SetValue` 方法来访问这种数组的元素，但速度会比较慢，因为有方法调用的开销。\n\n对于多维数组，0 基和 1 基数组会显示同样的类型名称：**System.String[,]**。在运行时，CLR\
  \ 将所有多维数组都视为非 0 基数组。这自然会让人觉得类型名称应该显示为 **System.String[*,*]**。但是，对于多维数组，CLR 决定不使用\
  \ * 符号。这是由于假如使用 *，那么它们始终都会存在，而大量的 * 会使开发人员产生混淆。\n\n访问一维 0 基数组的元素比访问非 0 基一维或多维数组的元素稍快。这是多方面的原因造成的。首先，有一些特殊\
  \ IL 指令，比如 **newarr、ldelem、ldelema、ldlen** 和 **stelem**，用于处理一维 0 基数组，这些特殊 IL 指令会导致\
  \ JIT 编译器生成优化代码。例如，JIT 编译器生成的代码假定数组是 0 基的，所以在访问元素时不需要从指定索引中减去一个偏移量。其次，一般情况下，JIT\
  \ 编译器能将索引范围检查代码从循环中拿出，导致它只执行一次。以下面这段常见的代码为例：\n\n```csharp\nusing System;\n\npublic\
  \ static class Program {\n    public static void Main() {\n        Int32[] a = new\
  \ Int32[5];\n        for(Int32 index = 0; index < a.Length; index++) {\n       \
  \     // 对 a[index] 执行操作\n        }\n    }\n}\n```\n\n对于以上代码，首先注意在 **for** 循环的测试表达式中对数组的\
  \ **Length** 属性的调用。由于 Length 是属性，所以查询长度实际上是方法调用。但 JIT 编译器知道 Length 是 Array 类的属性，所以在生成的代码中，实际只调用该属性一次，结果存储到一个临时变量中。每次循环迭代检查的都是这个临时变量。这就加快了\
  \ JIT 编译的代码的速度。但有的开发人员低估了 JIT 编译器的“本事”，试图自己写一些“高明”的代码来“帮助”JIT 编译器。任何自作聪明的尝试几乎肯定会对性能造成负面影响，还会使代码更难阅读，妨碍可维护性。在上述代码中，最好保持对数组\
  \ Length 属性的调用，而不要自己用什么局部变量来缓存它的值。\n\n其次要注意，JIT 编译器知道 for 循环要访问 0 到 Length - 1 的数组元素。所以，JIT\
  \ 编译器会生成代码，在运行时测试所有数组元素的访问都在数组有效范围内。具体地说，JIT 编译器会生成代码来检查是否 `(0 >= a.GetLowerBound(0))\
  \ && ((Length - 1) <= a.GetUpperBound(0))`。这个检查在循环之前发生。如果在数组有效范围内，JIT 编译器不会在循环内部生成代码验证每一次数组访问都在有效范围内。这样一来，循环内部的数组访问变得非常快。\n\
  \n遗憾的是，正如前文所述，访问“非 0 基一维数组”或“多维数组”的速度比不上一维 0 基数组。对于这些数组类型，JIT 编译器不会将索引检查从循环中拿出来，所以每次数组访问都要验证指定的索引。此外，JIT\
  \ 编译器还要添加代码从指定索引中减去数组下限，这进一步影响了代码执行速度，即使此时使用的多维数组恰巧是 0 基数组。所以，如果很关心性能，考虑用由数组构成的数组(即交错数组)代替矩形数组。\n\
  \nC#和 CLR 还允许使用 unsafe(不可验证)代码访问数组。这种技术实际能在访问数组时关闭索引上下限检查。这种不安全的数组访问技术适合以下元素类型的数组：**SByte、Byte、Int16、UInt16、Int32、UInt32、Int64、UInt64、Char、Single、Double、Decimal、Boolean**、枚举类型或者字段为上述任何类型的值类型结构。\n\
  \n这个功能很强大，但使用须谨慎，因为它允许直接内存访问。访问越界(超出数组上下限)不会抛出异常，但会损坏内存中的数据，破坏类型安全性，并可能造成安全漏洞！有鉴于此，包含\
  \ unsafe 代码的程序集必须被授予完全信任，或至少启用“跳过验证”安全权限。\n\n以下 C#代码演示了访问二维数组的三种方式(安全、交错和不安全)：\n\
  \n```csharp\nusing System;\nusing System.Diagnostics;\n\npublic static class Program\
  \ {\n    private const Int32 c_numElements = 10000;\n\n    public static void Main()\
  \ {\n        // 声明二维数组\n        Int32[,] a2Dim = new Int32[c_numElements, c_numElements];\n\
  \n        // 将二维数组声明为交错数组(向量构成的向量)\n        Int32[][] aJagged = new Int32[c_numElements][];\n\
  \        for (Int32 x = 0; x < c_numElements; x++)\n            aJagged[x] = new\
  \ Int32[c_numElements];\n\n        // 1: 用普通的安全技术访问数组中的所有元素\n        Safe2DimArrayAccess(a2Dim);\n\
  \n        // 2: 用交错数组技术访问数组中的所有元素\n        SafeJaggedArrayAccess(aJagged);\n\n \
  \       // 3: 用 unsafe 技术访问数组中的所有元素\n        Unsafe2DimArrayAccess(a2Dim);\n   \
  \ }\n\n    private static Int32 Safe2DimArrayAccess(Int32[,] a) {\n        Int32\
  \ sum = 0;\n        for (Int32 x = 0; x < c_numElements; x++) {\n            for\
  \ (Int32 y = 0; y < c_numElements; y++) {\n                sum += a[x, y];\n   \
  \         }\n        }\n        return sum;\n    }\n\n    private static Int32 SafeJaggedArrayAccess(Int32[][]\
  \ a) {\n        Int32 sum = 0;\n        for (Int32 x = 0; x < c_numElements; x++)\
  \ {\n            for (Int32 y = 0; y < c_numElements; y++) {\n                sum\
  \ += a[x][y];\n            }\n        }\n        return sum;\n    }\n\n    private\
  \ static unsafe Int32 Unsafe2DimArrayAccess(Int32[,] a) {\n        Int32 sum = 0;\n\
  \        fixed (Int32* pi = a) {\n            for (Int32 x = 0; x < c_numElements;\
  \ x++) {\n                Int32 baseOfDim = x * c_numElements;\n               \
  \ for (Int32 y = 0; y < c_numElements; y++) {\n                    sum += pi[baseOfDim\
  \ + y];\n                }\n            }\n        }\n        return sum;\n    }\n\
  }\n```\n\n**Unsafe2DimArrayAccess** 方法标记了 **unsafe** 修饰符，这是使用 C# 的 fixed 语句所必须的。编译这段代码要求在运行\
  \ C# 编译器时指定 `/unsafe` 开关，或者在 Microsoft Visual Studio 的项目属性页的“生成”选项卡中勾选“允许不安全代码”。\n\
  \n写代码时，不安全数据访问技术有时或许是你的最佳选择，但要注意该技术的三处不足。\n\n- 相较于其他技术，处理数组元素的代码更复杂，不容易读和写，因为要使用\
  \ C# **fixed** 语句，要执行内存地址计算。\n- 计算过程中出错，可能访问到不属于数组的内存。这会造成计算错误、损坏内存数据，破坏类型安全性，并可能造成安全漏洞。\n\
  - 因为这些潜在的问题，CLR 禁止在降低了安全级别的环境（如 Microsoft Silverlight）中运行不安全代码。\n\n### 16.8 不安全的数组访问和固定大小的数组\n\
  \n不安全的数组访问非常强大，因为它允许访问以下元素。\n\n- 堆上的托管数组对象中的元素（上一节对此进行了演示）。\n- 非托管堆上的数组中的元素。第 14\
  \ 章的 **SecureString** 示例演示了如何调用 **System.Runtime.InteropServices.Marshal** 类的 **SecureStringToCoTaskMemUnicode**\
  \ 方法来返回一个数组，并对这个数组进行不安全的数组访问。\n- 线程栈上的数组中的元素。\n\n如果性能是首要目标，请避免在堆上分配托管的数组对象。相反，在栈上分配数组。这是通过\
