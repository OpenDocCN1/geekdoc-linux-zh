  \ Int64, UInt64, Single, Double, Decimal 和 String。然而，C# 也允许定义非基元类型的常量变量(constant\
  \ variable)，前提是把值设为 null：\n\n```csharp\nusing System;\n\npublic sealed class SomeType\
  \ {\n    // SomeType 不是基元类型，但 C# 允许\n    // 值为 null 的这种类型的常量变量\n    public const\
  \ SomeType Empty = null;\n}\n```\n\n由于常量值从不变化，所以常量总是被视为类型定义的一部分。换言之，常量总是被视为静态成员，而不是实例成员。定义常量将导致创建元数据。\n\
  \n代码引用常量符号时，编译器在定义常量的程序集的元数据中查找该符号，提取常量的值，将值嵌入生成的 IL 代码中。由于常量的值直接嵌入代码，所以在运行时不需要为常量分配任何内存。除此之外，不能获取常量的地址，也不能以传引用的方式传递常量。这些限制意味着常量不能很好地支持跨程序集的版本控制。因此，只有确定一个符号的值从不变化才应定义常量。(将\
  \ MaxInt16 定义为 32767 就是一个很好的例子)。下面来演示我刚才所说的内容。首先，请输入以下代码，并将其编译成一个 DLL 程序集。\n\n```csharp\n\
  using System;\n\npublic sealed class SomeLibraryType {\n    // 注意：C# 不允许为常量指定 static\
  \ 关键字，\n```\n\n```csharp\n    // 因为常量总是隐式为 static\n    public const Int32 MaxEntriesInList\
