  \ 方法，后者将线程切换回默认 AppDomain。线程继续执行默认 AppDomain 中的代码。\n\n> **注意** 一个 AppDomain 中的线程调用另一个\
  \ AppDomain 中的方法时，线程会在这两个 AppDomain 之间切换。这意味着跨 AppDomain 边界的方法调用是同步执行的①。任何时刻一个线程只能在一个\
  \ AppDomain 中，而且要用那个 AppDomain 的安全和配置设置来执行代码。如果希望多个 AppDomain 中的代码并发执行，应创建额外的线程，让这些线程在你希望的\
