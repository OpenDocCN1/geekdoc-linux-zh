  ## 前言


  1999 年 10 月，Microsoft 的一些人首次向我展示了 Microsoft .NET Framework、公共语言运行时（CLR）和 C# 编程语言。看到这一切时，我惊呆了，我知道我写软件的方式要发生非常大的变化了。他们请我为团队做一些顾问工作，我当即同意了。刚开始，我以为.NET
  Framework 是 Win32 API 和 COM 上的一个抽象层。但随着我投入越来越多的时间研究，我意识到它是一个更宏伟的项目。某种程度上，它是自己的操作系统。有自己的内存管理器，自己的安全系统，自己的文件加载器，自己的错误处理机制，自己的应用程序隔离边界（AppDomain）、自己的线程处理模型等。本书解释了所有这些主题，帮你为这个平台高效地设计和实现应用程序和组件。


  我写这本书是 2012 年 10 月，距离首次接触.NET Framework 和 C# 正好 13 年。13 年来，我以 Microsoft 顾问身份开发过各式各样的应用程序，为.NET
  Framework 本身也贡献良多。作为我自己公司 Wintellect（http://Wintellect.com）的合伙人，我还要为大量客户工作，帮他们设计、调试、优化软件以及解决使用.NET
  Framework 时遇到的问题。正是因为有了这些资历，所以我才知道如何用.NET Framework 进行高效率编程。贯穿本书所有主题，你都会看到我的经验之谈。


  ## 本书面向的读者


  本书旨在解释如何为.NET Framework 开发应用程序和可重用的类。具体地说，我要解释 CLR 的工作原理及其提供的功能，还要讨论 Framework Class
  Library（FCL）的各个部分。没有一本书能完整地解释 FCL——其中含有数以千计的类型，而且这个数字正在以惊人速度增长。所以，我准备将重点放在每个开发人员都需要的核心类型上面。另外，虽然不会专门讲
  Windows 窗体、Windows Presentation Foundation（WPF）、Microsoft Silverlight、XML Web 服务、Web
  窗体、Microsoft ASP.NET MVC、Windows Store 应用等，但本书描述的技术适用于所有这些应用程序类型。


  本书围绕 Microsoft Visual Studio 2012/2013，.NET Framework 4.5.x 和 C# 5.0 展开。由于 Microsoft
  在发布这些技术的新版本时，会试图保持很大程度的向后兼容性，所以本书描述的许多内容也适合之前的版本。所有示例代码都用 C# 编程语言写成。但由于 CLR 可由许多编程语言使用，所以本书内容也适合非
  C# 程序员。


