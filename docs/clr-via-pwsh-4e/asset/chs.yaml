  \ **BetterPhone** 的 **EstablishConnection** 方法由 **virtual** 改变为 **override**。以下代码展示了新版本的\
  \ **BetterPhone** 类。\n\n```csharp\nnamespace CompanyB{\n    public class BetterPhone:CompanyA.Phone{\n\
  \n        // 删除 Dial 方法（从基类继承 Dial）\n\n        // 移除关键字 'new'，将关键字 'virtual' 修改为\
  \ 'override',\n        // 指明该方法与基类的 EstablishConnection 方法的关系\n        protected\
  \ override void EstablishConnection(){\n            Console.WriteLine(\"BetterPhone.EstablishConnection\"\
  );\n            // 在这里执行建立连接的操作\n        }\n    }\n}\n```\n\n执行相同的应用程序代码(前面列出的 **Main**\
  \ 方法中的代码)，输出结果如下所示：\n\n```text\nPhone.Dial\nBetterPhone.EstablishConnection\n```\n\
  \n该输出结果表明，在 **Main** 中调用 **Dial** 方法，调用的是由 **Phone** 定义、并由 **BetterPhone** 继承的 **Dial**\
  \ 方法。然后，当 **Phone** 的 **Dial** 方法调用虚方法 **EstablishConnection** 时，实际调用的是 **BetterPhone**\
