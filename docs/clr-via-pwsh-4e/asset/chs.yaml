- '# CLR via C#（第4版）


  ## 作者简介


  **Jeffrey Richter**


  Wintellect 联合创始人、著名畅销书作家。Windows 和.NET 的大师级、设计与实践方面的专家，著有多部经典著作。他长期关注多线程、进程管理与并发等主题，并致力于编写清晰易懂的技术书籍，帮助读者深入理解相关知识。


  Jeffrey 出版过 12 本 Windows、.NET 畅销书，曾经担任过 MSDN Magazine 的特约编辑，并为 Q&A 杂志撰稿。他曾在微软和其他公司担任顾问、讲师和技术作者，广泛参与软件开发与技术交流。


  Jeffrey 对于线程、垃圾回收机制和并发编程等主题有深入研究，并以通俗易懂的方式介绍复杂概念。他与妻子 Kristin 及子女在华盛顿州生活。


  ![](img/6fa065e17c4549db7260fbfaf4fd384e_1_2.png)



  ## 序言


  大家好，我们又见面了。谁预见到了今天啊？哈哈，我就预见到了！一旦步入婚姻的殿堂，就相当于过上了“土拨鼠日”。如果还没有看过那部电影，就去看看吧。看了之后，就会明白为什么自己老是犯同样的错误。当
  Jeff 说他不再写书的时候，我就知道这是一个“瘾君子”开的空头支票。Jeff 不可能停止写书。就在今天，我们还在说起他“绝对”不可能写的另一本书呢（实际情况是，有一章已经在写了）。写书已深入到他骨子里面去了。千里马生来就是要奔跑的，Jeff
  生来就是要写作的。


  Jeff 太有规律了。他就是离不开硬盘里那些小小的 0 和 1。忽视它们是不可能的。凌晨 3 点，我们睡梦正酣的时候，Jeff 的生物钟就在催促他起床了（巧合的是，我们
  4 岁大的小儿子也恰好在这个时候爬到我们的床上。爷儿俩的行为模式我都理解不了啊）。一股神秘的力量促使 Jeff 的大脑自动释放出解决方案、头脑风暴和臭虫之类的东西，迫使他跑到办公室把这些东西从脑袋里倒腾出来。而我们呢，则安心地翻个身继续呼呼大睡，知道
  Jeff 会解决那些问题——就像一个神秘的网络超级英雄，防止线程又成为薄弱环节①。


  但积累这些知识供自己使用，这对 Jeff 来说远远不够。好东西不该独享。所以必须把它们传播开来，必须把它们写下来。知识就像电波，有心人能接收得到。这就是他为你所做的，亲爱的读者，是他热爱微软技术的明证。


  本书还有另一层意义在里面。Jeff 每次绕着太阳“公转”一圈，都会变得更老一些。经过多年的积累，他也学着“向后看”了。由于看事情的方式变得更成熟，所以他重写了讲反射的那一章。或许你也应该跟他一起回顾一下这个主题。可以学到怎样让代码自个儿询问关于代码的事儿，进而更深入地思考为什么反射要那样工作。穿上便服，找一把舒服的皮椅子坐下，花些时间想想自己的代码以及它们生命中更深层次的意义。


  本书还讲了一样有趣的东西，就是异步/等待②。和我老公以前鼓捣过一阵子的 AsyncEnumerator 相比，这个东西显然进步了不少。哎，我还以为今后离不开它了呢！事实上，虽然他跟我讲了好多次
  AsyncEnumerator，但这个东西根本就没有在我的脑子里“阻塞”嘛！于是我琢磨，如果知道什么是 enumerator 的话，也许就能明白他讲的是啥了。于是我查了一下维基百科，发现
  enumerator 是人口普查员的意思。这一章难道是讲人口普查员怎样协调工作的事儿？太浪费纳税人的钱了吧！不过，我相信它在计算机里面的意义比我查到的好。Jeff
  和微软的团队一起工作，将异步/等待打磨得很完美。你现在通过这本书就能舒舒服服地享受他们的成果了。我建议你好好读一下。嗯，要顺着读。①


  本书的另一个重头戏是我感觉最兴奋的。希望你们都来看看关于 WinRT 的内容。这个术语太书呆子气了，我的理解就是“马上为我无敌帅气的平板搞一些很酷的应用出来！”你猜得没错，新的
  Windows Runtime 就是围绕无敌帅气的触摸屏展开的。孩子喜欢小鸟飞向小猪，我则喜欢跟鲜花有关的东西，而你完全可以用平板做其他事情。没有做不到，只有想不到！去折腾出一些“奇思妙想非常牛掰”（Wonderful
  Innovative Nifty Really Touchy, WinRT）的东西出来。就当是为了我，好好看看这一章。否则的话，我对 Jeff 和他无休止的写作事业可能真的会失去耐心，会把他关到一间只有针头线脑②而且没有电的小黑屋里面。你们程序员看着办吧，是用
  WinRT 写一些很酷的应用，还是再也没有 Jeff 的新书看！


  总之，在你们的力挺之下，Jeff 的又一部大作诞生了。我们的家庭貌似又可以回归正常状态了。但真的正常吗？或许他不停写书才是真的正常吧。


  让我们耐心等待下一本书的神秘召唤。


  Kristin Trace（Jeffrey 的妻子）


  2012 年 10 月


