  \ 的代码并发执行。——译注\n\nCh22-1-AppDomains应用程序接着做的事情是调用 AppDomain 类的公共静态 Unload 方法，这会强制\
  \ CLR 卸载指定的 AppDomain(包括加载到其中的所有程序集)，并强制执行一次垃圾回收，以释放由卸载的 AppDomain 中的代码创建的所有对象。这时，默认\
  \ AppDomain 的 mbrt 变量仍然引用一个有效的代理对象。但代理对象已不再引用一个有效的 AppDomain(因为它已经卸载了)。\n\n当默认 AppDomain\
  \ 试图使用代理对象调用 SomeMethod 方法时，调用的是该方法在代理中的实现。代理的实现发现包含真实对象的 **AppDomain** 已卸载。所以，代理的\
  \ **SomeMethod** 方法抛出一个 **AppDomainUnloadedException** 异常，告诉调用者操作无法完成。\n\n显然，Microsoft\
  \ 的 CLR 团队不得不做大量的工作来确保 AppDomain 的正确隔离，但这是他们必须做的。跨 AppDomain 访问对象的功能正在被大量地使用，开发人员对这个功能的依赖性正在日益增加。不过，使用“按引用封送”的语义进行跨\
  \ AppDomain 边界的对象访问，会产生一些性能上的开销。所以，一般应尽量少用这个功能。\n\n前面我承诺会更多地讨论实例字段。从 **MarshalByRefObject**\
  \ 派生的类型可定义实例字段。但这些实例字段不会成为代理类型的一部分，也不会包含在代理对象中。写代码对派生自 **MarshalByRefObject** 的类型的实例字段进行读写时，JIT\
  \ 编译器会自动生成代码，分别调用 **System.Object** 的 **FieldGetter** 方法(用于读)或 **FieldSetter** 方法(用于写)来使用代理对象(以找到真正的\
  \ AppDomain/对象)。这些方法是私有的，而且没有在文档中记录。简单地说，这些方法利用反射机制获取或设置字段值。因此，虽然能访问派生自 **MarshalByRefObject**\
  \ 的一个类型中的字段，但性能很差，因为 CLR 最终要调用方法来执行字段访问。事实上，即使要访问的字段在你自己的 AppDomain 中，性能也好不到哪里去。①\n\
  \n#### 访问实例字段时的性能问题\n\n我用以下代码演示性能损失的程度：\n\n```csharp\nprivate sealed class NonMBRO\
  \ : Object { public Int32 x; }\nprivate sealed class MBRO : MarshalByRefObject {\
  \ public Int32 x; }\n\nprivate static void FieldAccessTiming() {\n    const Int32\
  \ count = 100000000;\n    NonMBRO nonMbro = new NonMBRO();\n    MBRO mbro = new\
  \ MBRO();\n\n    Stopwatch sw = Stopwatch.StartNew();\n    for (Int32 c = 0; c <\
  \ count; c++) nonMbro.x++;\n    Console.WriteLine(\"{0}\", sw.Elapsed); // 00:00:00.4073560\n\
  \n    sw = Stopwatch.StartNew();\n    for (Int32 c = 0; c < count; c++) mbro.x++;\n\
  \    Console.WriteLine(\"{0}\", sw.Elapsed); // 00:00:02.5388665\n}\n```\n\n我运行以上代码，访问从\
  \ Object 派生的 NonMBRO 类的实例字段只花了约 0.4 秒，但访问从 MarshalByRefObject 派生的 MBRO 类的实例字段却花了\
  \ 2.54 秒。也就是说，访问从 MarshalByRefObject 派生的一个类的实例字段要多花约 6 倍的时间！\n\n从好不好用(usability)的角度说，派生自\
  \ **MarshalByRefObject** 的类型真的应该避免定义任何\n\n① 如果 CLR 要求所有字段都必须私有(为了获得好的数据封装，我强烈建议这样做)，那么\
  \ **FieldGetter** 和 **FieldSetter** 方法根本没有存在的必要，从方法中总是能够直接访问字段，避免(因为还要经由中间的 getter\
  \ 或 setter 方法)造成性能损失。\n\n\n\n任何静态成员。这是因为静态成员总是在调用 AppDomain 的上下文中访问。要切换到哪个 AppDomain\
  \ 的信息包含在代理对象中，但调用静态成员时没有代理对象，所以不会发生 AppDomain 的切换。让类型的静态成员在一个 AppDomain 中执行，实例成员却在另一个\
  \ AppDomain 中执行，这样的编程模型未免太“丑”了！\n\n由于第二个 AppDomain 中没有根，所以代理引用的原始对象可以被垃圾回收。这当然不理想。但另一方面，假如将原始对象不确定地(indefinitely)留在内存中，代理可能不再引用它，而原始对象依然存活；这同样不理想。CLR\
  \ 解决这个问题的办法是使用一个“租约管理器”(lease manager)。一个对象的代理创建好之后，CLR 保持对象存活 5 分钟。5 分钟内没有通过代理发出调用，对象就会失效，下次垃圾回收会释放它的内存。每发出一次对对象的调用，“租约管理器”都会续订对象的租期，保证它在接下来的\
  \ 2 分钟内在内存中保持存活。在对象过期后试图通过代理调用它，CLR 会抛出 System.Runtime.Remoting.RemotingException\
  \ 异常。\n\n默认的 5 分钟和 2 分钟租期设定是可以修改的，重写 MarshalByRefObject 的虚方法 InitializeLifetimeService\
  \ 即可。详情参见文档的“生存期租约”主题。\n\n#### 演示 2：使用“按值封送”进行跨 AppDomain 通信\n\n演示 2 与演示 1 很相似。和演示\
  \ 1 一样，演示 2 也创建了新 AppDomain。然后调用 CreateInstanceAndUnwrap 方法将同一个程序集加载到新建 AppDomain\
  \ 中，并在这个新 AppDomain 中创建 MarshalByRefType 类型的实例。CLR 为这个对象创建代理，mbrt 变量(在默认 AppDomain\
  \ 中)被初始化成引用这个代理。接着用代理调用 MethodWithReturn 方法。这个方法是无参的，将在新 AppDomain 中执行以创建 MarshalByValType\
  \ 类型的实例，并将一个对象引用返回给默认 AppDomain。\n\nMarshalByValType 不从 System.MarshalByRefObject\
  \ 派生，所以 CLR 不能定义一个代理类型并创建代理类型的实例；对象不能按引用跨 AppDomain 边界进行封送。\n\n但由于 MarshalByValType\
  \ 标记了自定义特性[Serializable]，所以 MethodWithReturn 方法能按值封送对象。下面具体描述了将一个对象按值从一个 AppDomain(源\
  \ AppDomain)封送到另一个 AppDomain(目标 AppDomain)的含义。欲知 CLR 序列化和反序列化的详情，请参见第 24 章“运行时序列化”。\n\
  \n源 AppDomain 想向目标 AppDomain 发送或返回一个对象引用时，CLR 将对象的实例字段序列化成一个字节数组。字节数组从源 AppDomain\
  \ 复制到目标 AppDomain。然后，CLR 在目标 AppDomain 中反序列化字节数组，这会强制 CLR 将定义了“被反序列化的类型”的程序集加载到目标\
  \ AppDomain 中(如果尚未加载的话)。接着，CLR 创建类型的实例，并利用字节数组中的值初始化对象的字段，使之与源对象中的值相同。换言之，CLR 在目标\
  \ AppDomain 中精确复制了源对象。然后，MethodWithReturn 方法返回对这个副本的引用；这样一来，对象就跨 AppDomain 的边界按值封送了。\n\
  \n- 3. 当第 2 步发现的所有线程都离开 AppDomain 后，CLR 遍历堆，为引用了“由已卸载的 AppDomain 创建的对象”的每个代理对象都设置一个标志(flag)。这些代理对象现在知道它们引用的真实对象已经不在了。现在，任何代码在无效的代理对象上调用方法都会抛出一个\
  \ **AppDomainUnloadedException** 异常。\n- 4. CLR 强制垃圾回收，回收由已卸载的 AppDomain 创建的任何对象的内存。这些对象的\
  \ **Finalize** 方法被调用，使对象有机会正确清理它们占用的资源。\n- 5. CLR 恢复剩余所有线程的执行。调用 **AppDomain.Unload**\
  \ 方法的线程将继续运行；对 **AppDomain.Unload** 的调用是同步进行的。①\n\n① 换言之，一旦调用 Unload，只有在它返回之后，线程才能恢复运行。——译注\n\
  \n在 Ch22-1-AppDomains 应用程序中，所有工作都用一个线程来做。因此，任何时候只要调用 **AppDomain.Unload**，都不可能有另一个线程在要卸载的\
  \ AppDomain 中。因此，CLR 不必抛出任何 **ThreadAbortException** 异常。本章后面将进一步讨论 **ThreadAbortException**。\n\
  \n顺便说一句，当一个线程调用 **AppDomain.Unload** 方法时，针对要卸载的 AppDomain 中的线程，CLR 会给它们 10 秒钟的时间离开。10\
  \ 秒钟后，如果调用 **AppDomain.Unload** 方法的线程还没有返回，CLR 将抛出一个 **CannotUnloadAppDomainException**\
  \ 异常，AppDomain 将来可能会、也可能不会卸载。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_521_0.png)\n\
  \n> **注意**　如果调用 **AppDomain.Unload** 方法的线程不在要卸载的 AppDomain 中，CLR 会创建另一个线程来尝试卸载 AppDomain。第一个线程被强制抛出\
  \ **ThreadAbortException** 并展开 (unwind)。新线程将等待 AppDomain 卸载，然后新线程会终止。如果 AppDomain\
  \ 卸载失败，新线程将抛出 **CannotUnloadAppDomainException** 异常。但是，由于我们没有写由新线程执行的代码，所以无法捕捉这个异常。\n\
  \n### 22.4 监视 AppDomain\n\n宿主应用程序可监视 AppDomain 消耗的资源。有的宿主根据这种信息判断一个 AppDomain 的内存或\
  \ CPU 消耗是否超过了应有的水准，并强制卸载一个 AppDomain。还可利用监视来比较不同算法的资源消耗情况，判断哪一种算法用的资源较少。由于 AppDomain\
  \ 监视本身也会产生开销，所以宿主必须将 AppDomain 的静态 **MonitoringEnabled** 属性设为 **true**，从而显式地打开监视。监视一旦打开便不能关闭，将\
  \ **MonitoringEnabled** 属性设为 **false** 会抛出一个 **ArgumentException** 异常。\n\n监视打开后，代码可查询\
  \ **AppDomain** 类提供的以下 4 个只读属性。\n\n- **MonitoringSurvivedProcessMemorySize**　这个\
  \ **Int64** 静态属性返回由当前 CLR 实例控制的所有 AppDomain 使用的字节数。这个数字只保证在上一次垃圾回收时是准确的。\n- **MonitoringTotalAllocatedMemorySize**\
  \ 这个 **Int64** 实例属性返回特定 **AppDomain** 已分配的字节数。这个数字只保证在上一次垃圾回收时是准确的。\n- **MonitoringSurvivedMemorySize**\
  \ 这个 **Int64** 实例属性返回特定 **AppDomain** 当前正在使用的字节数。这个数字只保证在上一次垃圾回收时是准确的。\n- **MonitoringTotalProcessorTime**\
  \ 这个 **TimeSpan** 实例属性返回特定 **AppDomain** 的 CPU 占用率。\n\n下面这个类演示了如何利用这些属性检查两个时间点之间一个\
  \ AppDomain 发生的变化：\n\n```csharp\nprivate sealed class AppDomainMonitorDelta : IDisposable\
  \ {\n    private AppDomain m_appDomain;\n    private TimeSpan m_thisADCpu;\n   \
  \ private Int64 m_thisADMemoryInUse;\n    private Int64 m_thisADMemoryAllocated;\n\
  \n    static AppDomainMonitorDelta() {\n        // 确定已打开了 AppDomain 监视\n       \
  \ AppDomain.MonitoringIsEnabled = true;\n    }\n\n    public AppDomainMonitorDelta(AppDomain\
  \ ad) {\n        m_appDomain = ad ?? AppDomain.CurrentDomain;\n        m_thisADCpu\
  \ = m_appDomain.MonitoringTotalProcessorTime;\n        m_thisADMemoryInUse = m_appDomain.MonitoringSurvivedMemorySize;\n\
  \        m_thisADMemoryAllocated = m_appDomain.MonitoringTotalAllocatedMemorySize;\n\
  \    }\n\n    public void Dispose() {\n        GC.Collect();\n        Console.WriteLine(\"\
  FriendlyName={0}, CPU={1}ms\", m_appDomain.FriendlyName,\n            (m_appDomain.MonitoringTotalProcessorTime\
  \ - m_thisADCpu).TotalMilliseconds);\n        Console.WriteLine(\"   Allocated {0:N0}\
  \ bytes of which {1:N0} survived GCs\",\n            m_appDomain.MonitoringTotalAllocatedMemorySize\
  \ - m_thisADMemoryAllocated,\n            m_appDomain.MonitoringSurvivedMemorySize\
  \ - m_thisADMemoryInUse);\n    }\n}\n```\n\n以下代码演示了如何使用 **AppDomainMonitorDelta**\
  \ 类：\n\n```csharp\nprivate static void AppDomainResourceMonitoring() {\n    using\
  \ (new AppDomainMonitorDelta(null)) {\n        // 分配在回收时能存活的约 10MB\n        var\
  \ list = new List<Object>();\n        for (Int32 x = 0; x < 1000; x++) list.Add(new\
  \ Byte[10000]);\n\n        // 分配在回收时存活不了的约 20MB\n        for (Int32 x = 0; x < 2000;\
  \ x++) new Byte[10000].GetType();\n\n        // 保持 CPU 工作约 5 秒\n        Int64 stop\
  \ = Environment.TickCount + 5000;\n        while (Environment.TickCount < stop)\
  \ ;\n    }\n}\n```\n\n在我的机器上运行以上代码，得到以下输出：①\n\n```text\nFriendlyName=03-Ch22-1-AppDomains.exe,\
  \ CPU=5031.25ms\n    Allocated 30,159,496 bytes of which 10,085,080 survived GCs\n\
  ```\n\n① 在本书配套代码中，找到C22-1 AppDomains项目，在Main()方法中注释掉Marshalling()和FieldAccessTiming()方法调用，然后解除对\
  \ AppDomainResourceMonitoring()调用的注释。——译注\n\n### 22.5 AppDomain FirstChance 异常通知\n\
  \n每个 **AppDomain** 都可关联一组回调方法；CLR 开始查找 **AppDomain** 中的 **catch** 块时，这些回调方法将得以调用。可用这些方法执行日志记录操作。另外，宿主可利用这个机制监视\
  \ **AppDomain** 中抛出的异常。回调方法不能处理异常，也不能以任何方式“吞噬”异常(装作异常没有发生)；它们只是接收关于异常发生的通知。要登记回调方法，为\
  \ **AppDomain** 的实例事件 **FirstChanceException** 添加一个委托就可以了。\n\n下面描述了 CLR 如何处理异常：异常首次抛出时，CLR\
  \ 调用向抛出异常的 **AppDomain** 登记的所有 **FirstChanceException** 回调方法。然后，CLR 查找栈上在同一个 **AppDomain**\
  \ 中的任何 **catch** 块。有一个 **catch** 块能处理异常，则异常处理完成，将继续正常执行。如果 **AppDomain** 中没有一个 **catch**\
  \ 块能处理异常，则 CLR 沿着栈向上来到调用 **AppDomain**，再次抛出同一个异常对象(序列化和反序列化之后)。这时感觉就像是抛出了一个全新的异常，CLR\
  \ 调用向当前 **AppDomain** 登记的所有 **FirstChanceException** 回调方法。这个过程会一直持续，直到抵达线程栈顶部。届时如果异常还未被任何代码处理，CLR\
  \ 只好终止整个进程。\n\n### 22.6 宿主如何使用 AppDomain\n\n前面已讨论了宿主以及宿主加载 CLR 的方式。同时还讨论了宿主如何告诉\
  \ CLR 创建和卸载 **AppDomain**。为了使这些讨论更加具体，下面将描述一些常见的寄宿和 **AppDomain** 使用情形。我着重解释了不同应用程序类型如何寄宿(容纳)CLR，以及如何管理\
  \ **AppDomain**。\n\n### 22.6.1 可执行应用程序\n\n控制台 UI 应用程序、NT Service 应用程序、Windows 窗体应用程序和\
  \ Windows Presentation Foundation(WPF)应用程序都是自寄宿(self-hosted，即自己容纳 CLR)的应用程序，它们都有托管\
  \ EXE 文件。Windows 用托管 EXE 文件初始化进程时，会加载垫片②。垫片检查应用程序的程序集(EXE 文件)中的 CLR 头信息。头信息指明了生成和测试应用程序时使用的\
  \ CLR 版本。垫片根据这些信息决定将哪个版本的 CLR 加载到进程中，CLR 加载并初始化好之后，会再次检查程序集的 CLR 头，判断哪个方法是应用程序的入口方法(**Main**)。CLR\
  \ 调用该方法。\n\n② 垫片的问题请参见 22.1 节“CLR 寄宿”。——译注\n\n应用程序需要的程序集都会加载到一个单独的 AppDomain 中，以隔离不同\
  \ Web 应用程序的代码和对象。\n\nASP.NET 的一个亮点是允许在不关闭 Web 服务器的前提下动态更改网站代码。网站的文件在硬盘上发生改动时，ASP.NET\
  \ 会检测到这个情况，并卸载包含旧版本文件的 AppDomain(在当前运行的最后一个请求完成之后)，并创建一个新 AppDomain，向其中加载新版本的文件。为了确保这个过程的顺利进行，ASP.NET\
  \ 使用了 AppDomain 的一个名为“影像复制①” (shadow copying)的功能。\n\n### 22.6.4 Microsoft SQL Server\n\
  \nMicrosoft SQL Server 是非托管应用程序，它的大部分代码仍是用非托管 C++写的。SQL Server 允许开发人员使用托管代码创建存储过程。首次请求数据库运行一个用托管代码写的存储过程时，SQL\
  \ Server 会加载 CLR。存储过程在它们自己的安全 AppDomain 中运行，这避免了存储过程对数据库服务器产生负面影响。\n\n这其实是一项非同寻常的功能！它意味着开发人员可以选择自己喜欢的编程语言来编写存储过程。存储过程可以在自己的代码中使用强类型的数据对象。代码还会被\
  \ JIT 编译成本机代码执行，而不是采用解释执行的方式。开发人员可利用 FCL 或任何其他程序集中定义的任何类型。结果是我们的工作变得越来越轻松，但应用程序的表现变得越来越好。作为开发人员，我表示很知足！\n\
  \n### 22.6.5 更多的用法只局限于想象力\n\n生产型应用程序(比如字处理和电子表格软件)也允许用户使用任何编程语言来编写宏。宏可以访问与 CLR 一起运行的所有程序集和类型。宏会被编译，所以执行得更快。最重要的是，宏在一个安全\
  \ AppDomain 中运行，不会骚扰到用户。你自己的应用程序也可利用这个功能。具体怎么用，只局限于你自己的想象力。\n\n### 22.7 高级宿主控制\n\
  \n本节探讨与寄宿 CLR 有关的高级话题。目的是让你有一个初步的认识，帮你更多地理解 CLR 的能力。如果有兴趣，鼓励你参考其他更有针对性的参考书。\n\n\
  ### 22.7.1 使用托管代码管理 CLR\n\n**System.AppDomainManager** 类允许宿主使用托管代码(而不是非托管代码)覆盖 CLR\
  \ 的默认行为。当然，使用托管代码使宿主的实现变得更容易。你唯一要做的就是定义自己的类，让它从 **System.AppDomainManager** 派生，重写想接手控制的任何虚方法。然后，在专用的程序集中生成类，并将程序集安装到\
  \ GAC 中。这是由于该程序集需要被授予完全信任权限，而 GAC 中的所有程序集都总是被授予完全信任权限。\n\n然后要告诉 CLR 使用你的 **AppDomainManager**\
  \ 派生类。在代码中，最佳的方法就是创建一个 **AppDomainSetup** 对象，初始化它的 **AppDomainManagerAssembly**\
  \ 和 **AppDomainManagerType** 属性（均为 **String** 类型）。将前者设为定义了你的 **AppDomainManager**\
  \ 派生类的那个程序集的强名称字符串，后者设为你的 **AppDomainManager** 派生类的全名。还可在应用程序 XML 配置文件中，用 **appDomainManagerAssembly**\
  \ 和 **appDomainManagerType** 元素来设置 **AppDomainManager**。此外，本机宿主可查询 **ICLRControl**\
  \ 接口，调用该接口的 **SetAppDomainManagerType** 函数，向它传递 GAC 安装的程序集的标识和 **AppDomainManager**\
  \ 派生类的名称。\n\n现在看看 **AppDomainManager** 派生类能做什么。**AppDomainManager** 派生类的作用是使宿主保持控制权，即使是在加载项（add-in）试图创建自己的\
  \ AppDomain 时。进程中的代码试图创建新 AppDomain 时，那个 AppDomain 中的 **AppDomainManager** 派生对象可修改安全性和配置设置。它还可决定阻止一次\
  \ AppDomain 创建，或返回对现有 AppDomain 的引用。新 AppDomain 创建好之后，CLR 会在其中创建新的 **AppDomainManager**\
  \ 派生对象。这个对象也能修改配置设置、决定执行上下文如何在线程之间切换，并决定向程序集授予的权限。\n\n### 22.7.2 写健壮的宿主应用程序\n\n\
  托管代码出现错误时，宿主可告诉 CLR 采取什么行动。下面是一些例子（按严重性从低到高排序）。\n\n- 如果线程执行时间过长，CLR 可终止线程并返回一个响应。（下一节会更多地讨论这个问题。）\n\
  - CLR 可卸载 AppDomain。这会终止该 AppDomain 中的所有线程，导致有问题的代码卸载。\n- CLR 可被禁用。这会阻止更多的托管代码在程序中运行，但仍然允许非托管代码运行。\n\
  - CLR 可退出 Windows 进程。首先会终止所有线程，并卸载所有 AppDomain，使资源清理操作得以执行，然后才会终止进程。\n\nCLR 可以得体地（gracefully）或者粗鲁地（rudely）终止线程或\
  \ AppDomain。得体意味着会执行（资源）清理代码。换言之，finally 块中的代码会运行，对象的 Finalize 方法也将被执行。而\n\n① 还可使用环境变量和注册表设置来配置一个\
  \ **AppDomainManager**。但这些机制比正文描述的方法麻烦得多。除非是在一些测试性的场合中，否则应避免使用。\n\n\n\n粗鲁地终止意味着清理代码不会执行。换言之，finally\
  \ 块中的代码可能不会运行，对象的 Finalize 方法也可能不会执行。如果得体地终止，当前正在一个 catch 块或 finally 块中的线程无法终止。但如果粗鲁地终止，就能终止\
  \ catch 块或 finally 块中的线程。遗憾的是，非托管代码或者约束执行区（Constrained Execution Region，CER）中的线程完全无法终止。\n\
  \n宿主可设置所谓的升级策略（escalation policy），从而告诉 CLR 应该如何处理托管代码的错误。例如，SQL Server 就告诉 CLR 在执行托管代码时，假如遇到未处理的异常应该如何处理。线程遇到未经处理的异常时，CLR\
  \ 首先尝试将该异常升级成一次得体的线程终止。如果线程在指定时间内没有终止，CLR 就尝试将得体的终止升级成粗鲁的终止。\n\n刚才描述的是最常见的情况。但如果线程在一个临界区（critical\
  \ region）遇到了未处理的异常，策略就有所不同。位于临界区的线程是指进入线程同步锁的线程，该锁必须由同一个线程释放（例如最初调用 Monitor.Enter\
  \ 方法，调用 Mutex 的 WaitOne 方法，或者调用 ReaderWriterLock 的 AcquireReaderLock 或 AcquireWriteLock\
  \ 方法的那个线程①）。成功等待一个 AutoResetEvent、ManualResetEvent 或者 Semaphore 不会造成线程进入临界区，因为另一个线程可通知这些同步对象。线程在临界区时，CLR\
  \ 认为线程访问的数据是由同一个 AppDomain 中的多个线程共享的。毕竟，这才是导致线程跑去获取一个锁的原因。直接终止正在访问共享数据的线程是不合适的，因为其他线程随后得到的就可能是已损坏的数据，造成\
  \ AppDomain 的运行变得无法预测，甚至可能留下安全隐患。\n\n① 所有这些锁都在内部调用 Thread 的 BeginCriticalRegion\
  \ 和 EndCriticalRegion 方法，指出它们要进入和离开临界区。如有必要，你的代码也可调用这些方法。但一般只有在和非托管代码进行互操作时才有必要。\n\
  \n所以，位于临界区的线程遭遇未处理的异常时，CLR 首先尝试将异常升级成一次得体的 AppDomain 卸载，从而摆脱（清理）当前正在这个 AppDomain\
  \ 中的所有线程以及当前正在使用的数据对象。如果 AppDomain 未能在指定时间内卸载，CLR 就将得体的 AppDomain 卸载升级成粗鲁的 AppDomain\
  \ 卸载。\n\n### 22.7.3 宿主如何拿回它的线程\n\n宿主应用程序一般都想保持对自己的线程的控制。以一个数据库服务器为例。当一个请求抵达数据库服务器时，线程\
  \ A 获得请求，并将该请求派发（dispatch）给线程 B 以执行实际工作。线程 B 可能要执行并不是由数据库服务器的开发团队创建和测试的代码。例如，假定一个请求到达数据库服务器，要执行由运行服务器的公司用托管代码写的存储过程。数据库服务器要求存储过程在自己的\
  \ AppDomain 中运行，这个设计自然是极好的，因为能保障安全，防止存储过程访问其 AppDomain 外部的对象，还能防止代码访问不允许访问的资源（比如磁盘文件或剪贴板）。\n\
  \n但是，如果存储过程的代码进入死循环怎么办？在这种情况下，数据库服务器把它的一个线程派发给存储过程代码，但这个线程一去不复返。这便将数据库服务器置于一个危险的境地；服务器未来的行为变得不可预测了。例如，由于线程进入死循环，所以服务器的性能可能变得很糟。服务器是不是应该创建更多的线程？这样会消耗更多的资源（比如栈空间），而且这些线程本身也可能进入死循环。\n\
  \n为了解决这些问题，宿主可利用线程中止功能。图 22-3 展示了旨在解决失控（runaway）线程问题的宿主应用程序的典型架构。其具体工作方式如下（编号和图的圆圈中的编号对应）：\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_528_0.png)\n\n图 22-3　宿主应用程序如何拿回它的线程\n\
  \n1. 客户端向服务器发送请求。\n2. 服务器线程获得请求，把它派发给一个线程池线程来执行实际工作。\n3. 线程池线程获得客户端的请求，执行由构建并测试宿主应用程序的那个公司写的可信代码（trusted\
  \ code）。\n4. 可信代码进入一个 **try** 块。从这个 **try** 块中，跨越一个 **AppDomain** 的边界进行调用（通过派生自\
  \ **MarshalByRefObject** 的一个类型）。**AppDomain** 中包含的是不可信代码（可能是存储过程），这些代码不是由制作宿主应用程序的那个公司生成和测试的。在这个时候，服务器相当于把它的线程的控制权交给了一些不可信的代码。服务器感到有点儿“紧张”了。\n\
  5. 宿主会记录接收到客户端请求的时间。不可信代码在管理员设定的时间内没有对客户端做出响应，宿主就会调用 **Thread** 的 **Abort** 方法要求\
  \ CLR 中止线程池线程，强制它抛出一个 **ThreadAbortException** 异常。\n6. 这时，线程池线程开始展开（unwind），调用 **finally**\
  \ 块，使清理代码得以执行。最后，线程池线程穿越 **AppDomain** 边界返回。由于宿主的存根代码是从一个 **try** 块中调用不可信代码，所以宿主的存根代码有一个\
  \ **catch** 块捕捉 **ThreadAbortException**。\n7. 为了响应捕捉到的 **ThreadAbortException**\
  \ 异常，宿主调用 **Thread** 的 **ResetAbort** 方法。稍后将介绍该调用的目的。\n8. 现在，宿主的代码已捕捉到 **ThreadAbortException**\
  \ 异常。因此，宿主可向客户端返回\n"
- "## 第23章 程序集加载和反射\n\n- **本章内容：**\n  - 程序集加载\n  - 使用反射构建动态可扩展应用程序\n  - 反射的性能\n  -\
  \ 设计支持加载项的应用程序\n  - 使用反射发现类型的成员\n\n本章讨论了在编译时对一个类型一无所知的情况下，如何在运行时发现类型的信息、创建类型的实例以及访问类型的成员。可利用本章讲述的内容创建动态可扩展应用程序。在这种情况下，一般是由一家公司创建宿主应用程序，其他公司创建加载项（add-in）来扩展宿主应用程序。宿主不能基于一些具体的加载项来构建和测试，因为加载项由不同公司创建，而且极有可能是在宿主应用程序发布之后才创建的。这是宿主为什么要在运行时发现加载项的原因。\n\
  \n动态可扩展应用程序可利用第 22 章讲述的 CLR 寄宿和 AppDomain。宿主可以在一个 AppDomain 中运行加载项代码，这个 AppDomain\
  \ 有它自己的安全性和配置设置。宿主还可通过卸载 AppDomain 来卸载加载项。在本章末尾，将花费一点时间来讨论如何将所有这些功能组合到一起——包括 CLR\
  \ 寄宿、AppDomain、程序集加载、类型发现、类型实例构造和反射——从而构建健壮、安全而且可以动态扩展的应用程序。\n\n> **重要提示** .NET\
  \ Framework 4.5 引入了新的反射 API。旧的 API 缺点太多。例如，它对 LINQ 的支持不好，内建的策略对某些语言来说不正确，有时不必要地强制加载程序集，而且为很少遇到的问题提供了过于复杂的\
  \ API。新 API 解决了所有这些问题。但至少就 .NET 4.5 来说，新的反射 API 还不如旧 API 完整。利用新 API 和 System.Reflection.RuntimeReflectionExtensions\
  \ 类中的扩展方法，现在所有事情都可以做到。希望在 .NET Framework 未来的版本中为新 API 添加更多的方法。当然，对于桌面应用程序，旧 API\
  \ 是仍然存在的，重新编译现有的代码不会出任何问题。但新 API 是未来的发展方向，这正是本章要全面讨论新 API 的原因。Windows Store 应用由于不用考虑向后兼容，所以必须使用新\
  \ API。\n\n### 23.1 程序集加载\n\n我们知道，JIT 编译器将方法的 IL 代码编译成本机代码时，会查看 IL 代码中引用了哪些类型。在运行时，JIT\
  \ 编译器利用程序集的 TypeRef 和 AssemblyRef 元数据表来确定哪一个程序集定义了所引用的类型。在 AssemblyRef 元数据表的记录项中，包含了构成程序集强名称的各个部分。JIT\
  \ 编译器获取所有这些部分——包括名称（无扩展名和路径）、版本、语言文化和公钥标记（public key token）——并把它们连接成一个字符串。然后，JIT\
  \ 编译器尝试将与该标识匹配的程序集加载到 AppDomain 中（如果还没有加载的话）。如果被加载的程序集是弱命名的，那么标识中就只包含程序集的名称（不包含版本、语言文化及公钥标记信息）。①\n\
  \n在内部，CLR 使用 System.Reflection.Assembly 类的静态 Load 方法尝试加载这个程序集。该方法在 .NET Framework\
  \ SDK 文档中是公开的，可调用它显式地将程序集加载到 AppDomain 中。该方法是 CLR 的与 Win32 LoadLibrary 函数等价的方法。Assembly\
  \ 的 Load 方法实际有几个重载版本。以下是最常用的重载的原型：\n\n```csharp\npublic class Assembly {\n    public\
  \ static Assembly Load(AssemblyName assemblyRef);\n    public static Assembly Load(String\
  \ assemblyString);\n    // 未列出不常用的 Load 重载\n}\n```\n\n在内部，Load 导致 CLR 向程序集应用一个版本绑定重定向策略，并在\
  \ GAC（全局程序集缓存）中查找程序集。如果没找到，就接着去应用程序的基目录、私有路径子目录和 codebase②位置查找。如果调用 Load 时传递的是弱命名程序集，Load\
  \ 就不会向程序集应用版本绑定重定向策略，CLR 也不会去 GAC 查找程序集。如果 Load 找到指定的程序集，会返回对代表已加载的那个程序集的一个 Assembly\
  \ 对象的引用。如果 Load 没有找到指定程序集，会抛出一个 System.IO.FileNotFoundException 异常。\n\n> **注意**：一些极罕见的情况可能需要加载为特定\
  \ CPU 架构生成的程序集。这时在指定程序集的标识时，还可包括一个进程架构部分。例如，假定 GAC 中同时包含了一个程序集的 IL 中立版本和 x86 专用版本，CLR\
  \ 会默认选择 x86 专用版本（参见第 3 章“共享程序集和强命名程序集”）。但是，为了强迫 CLR 加载 IL 中立的版本，可以向 Assembly 的 Load\
  \ 方法传递以下字符串：\n>\n> ```text\n> \"SomeAssembly, Version=2.0.0.0, Culture=neutral,\n\
  > PublicKeyToken=01234567890abcde, ProcessorArchitecture=MSIL\"\n> ```\n>\n> CLR\
  \ 目前允许 ProcessorArchitecture 取 5 个值之一：MSIL（Microsoft IL）、X86、IA64、AMD64 以及 Arm。\n\
  \n① 强命名程序集和弱命名程序集的区别请参见 3.1 节“两种程序集，两种部署”。——译注\n② 要了解 codeBase 元素指定的位置，请参见 3.9 节“高级管理控制（配置）”。——译注\n\
  \n**重要提示**：一些开发人员可能注意到 **System.AppDomain** 提供了 **Load** 方法。和 **Assembly** 的静态 **Load**\
  \ 方法不同，**AppDomain** 的 **Load** 是实例方法，它允许将程序集加载到指定的 **AppDomain** 中。该方法设计由非托管代码调用，允许宿主将程序集“注入”特定\
  \ **AppDomain** 中。托管代码的开发人员一般情况下不应调用它，因为调用 **AppDomain** 的 **Load** 方法时需要传递一个标识了程序集的字符串。该方法随后会应用策略，并在一些常规位置搜索程序集。我们知道，AppDomain\
  \ 关联了一些告诉 CLR 如何查找程序集的设置。为了加载这个程序集，CLR 将使用与指定 AppDomain 关联的设置，而非与发出调用之 AppDomain\
  \ 关联的设置。\n\n但 **AppDomain** 的 **Load** 方法会返回对程序集的引用。由于 **System.Reflection.Assembly**\
  \ 类不是从 **System.MarshalByRefObject** 派生的，所以程序集对象必须按值封送回发出调用的那个 **AppDomain**。但是，现在\
  \ CLR 就会用发出调用的那个 **AppDomain** 的设置来定位并加载程序集。如果使用发出调用的那个 **AppDomain** 的策略和搜索位置找不到指定的程序集，就会抛出一个\
  \ **FileNotFoundException**。这个行为一般不是你所期望的，所以应该避免使用 **AppDomain** 的 **Load** 方法。\n\
  \n在大多数动态可扩展应用程序中，**Assembly** 的 **Load** 方法是将程序集加载到 **AppDomain** 的首选方式。但它要求事先掌握构成程序集标识的各个部分。开发人员经常需要写一些工具或实用程序（例如\
  \ ILDasm.exe、PEVerify.exe、CorFlags.exe、GACUtil.exe、SGen.exe、SN.exe 和 XSD.exe 等）来操作程序集，它们都要获取引用了程序集文件路径名（包括文件扩展名）的命令行实参。\n\
  \n调用 **Assembly** 的 **LoadFrom** 方法加载指定了路径名的程序集：\n\n```csharp\npublic class Assembly\
  \ {\n    public static Assembly LoadFrom(String path);\n    // 未列出不常用的 LoadFrom\
  \ 重载\n}\n```\n\n在内部，**LoadFrom** 首先调用 **System.Reflection.AssemblyName** 类的静态 **GetAssemblyName**\
  \ 方法。该方法打开指定的文件，找到 **AssemblyRef** 元数据表的记录项，提取程序集标识信息，然后以一个 **System.Reflection.AssemblyName**\
  \ 对象的形式返回这些信息（文件同时会关闭）。随后，**LoadFrom** 方法在内部调用 **Assembly** 的 **Load** 方法，将 **AssemblyName**\
  \ 对象传给它。然后，CLR 应用版本绑定重定向策略，并在各个位置查找匹配的程序集。**Load** 找到匹配程序集会加载它，并返回代表已加载程序集的 **Assembly**\
  \ 对象；**LoadFrom** 方法将返回这个值。如果 **Load** 没有找到匹配的程序集，**LoadFrom** 会加载通过 **LoadFrom**\
  \ 的实参传递的路径中的程序集。当然，如果已加载了具有相同标识的程序集，**LoadFrom** 方法就会直接返回代表已加载程序集的 **Assembly**\
  \ 对象。\n\n顺便说一句，**LoadFrom** 方法允许传递一个 URL 作为实参，下面是一个例子：\n\n```csharp\nAssembly a\
  \ = Assembly.LoadFrom(@\"http://Wintellect.com/SomeAssembly.dll\");\n```\n\n如果传递的是一个\
  \ Internet 位置，CLR 会下载文件，把它安装到用户的下载缓存中，再从那儿加载文件。注意，当前必须联网，否则会抛出异常。但如果文件之前已下载过，而且\
  \ Microsoft Internet Explorer 被设为脱机工作（在 Internet Explorer 中单击“文件”|“脱机工作”），就会使用以前下载的文件，不会抛出异常。还可以调用\
  \ UnsafeLoadFrom，它能够加载从网上下载的程序集，同时绕过一些安全检查。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_534_0.png)\n\
  \n> **重要提示**：一台机器可能同时存在具有相同标识的多个程序集。由于 **LoadFrom** 会在内部调用 **Load**，所以 CLR 有可能不是加载你指定的文件，而是加载一个不同的文件，从而造成非预期的行为。强烈建议每次生成程序集时都要改版本号，确保每个版本都有自己的唯一性标识，确保\
  \ **LoadFrom** 方法的行为符合预期。\n\nMicrosoft Visual Studio 的 UI 设计人员和其他工具一般用的是 **Assembly**\
  \ 的 **LoadFile** 方法。这个方法可从任意路径加载程序集，而且可以将具有相同标识的程序集多次加载到一个 AppDomain 中。在设计器/工具中对应用程序的\
  \ UI 进行了修改，而且用户重新生成了程序集时，便有可能发生这种情况。通过 **LoadFile** 加载程序集时，CLR 不会自动解析任何依赖性问题；你的代码必须向\
  \ **AppDomain** 的 **AssemblyResolve** 事件登记，并让事件回调方法显式地加载任何依赖的程序集。\n\n如果你构建的一个工具只想通过反射（本章稍后进行讨论）来分析程序集的元数据，并希望确保程序集中的任何代码都不会执行，那么加载程序集的最佳方式就是使用\
  \ **Assembly** 的 **ReflectionOnlyLoadFrom** 方法或者使用 **Assembly** 的 **ReflectionOnlyLoad**\
  \ 方法（后者比较少见）。下面是这两个方法的原型：\n\n```csharp\npublic class Assembly {\n    public static\
  \ Assembly ReflectionOnlyLoadFrom(String assemblyFile);\n    public static Assembly\
  \ ReflectionOnlyLoad(String assemblyString);\n    // 未列出不常用的 ReflectionOnlyLoad\
  \ 重载\n}\n```\n\n**ReflectionOnlyLoadFrom** 方法加载由路径指定的文件；文件的强名称标识不会获取，也不会在 GAC 和其他位置搜索文件。**ReflectionOnlyLoad**\
  \ 方法会在 GAC、应用程序基目录、私有路径和 **codebase** 指定的位置搜索指定的程序集。但和 **Load** 方法不同的是，**ReflectionOnlyLoad**\
  \ 方法不会应用版本控制策略，所以你指定的是哪个版本，获得的就是哪个版本。要自行向程序集标识应用版本控制策略，可将字符串传给 **AppDomain** 的 **ApplyPolicy**\
  \ 方法。\n\n用 **ReflectionOnlyLoadFrom** 或 **ReflectionOnlyLoad** 方法加载程序集时，CLR 禁止程序集中的任何代码执行；试图执行由这两个方法加载的程序集中的代码，会导致\
  \ CLR 抛出一个 **InvalidOperationException** 异常。这两个方法允许工具加载延迟签名的程序集¹，这种程序\n\n¹ 要进一步了解延迟签名的程序集，请参见\
  \ 3.6 节“延迟签名”。——译注\n\n\n\n程序集正常情况下会因为安全权限不够而无法加载。另外，这种程序集也可能是为不同的 CPU 架构而创建的。\n\n\
  利用反射来分析由这两个方法之一加载的程序集时，代码经常需要向 **AppDomain** 的 **ReflectionOnlyAssemblyResolve**\
  \ 事件注册一个回调方法，以便手动加载任何引用的程序集（如有必要，还需要调用 **AppDomain** 的 **ApplyPolicy** 方法）；CLR 不会自动帮你做这个事情。回调方法被调用(invoke)时，它必须调用(call)\
  \ **Assembly** 的 **ReflectionOnlyLoadFrom** 或 **ReflectionOnlyLoad** 方法来显式加载引用的程序集，并返回对该程序集的引用。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_535_0.png)\n\n> **注意**　经常有人问到程序集卸载的问题。遗憾的是，CLR\
  \ 不提供卸载单独程序集的能力。如果 CLR 允许这样做，那么一旦线程从某个方法返回至已卸载的一个程序集中的代码，应用程序就会崩溃。健壮性和安全性是 CLR 最优先考虑的目标，如果允许应用程序以这样的一种方式崩溃，就和它的设计初衷背道而驰了。卸载程序集必须卸载包含它的整个\
  \ AppDomain。这方面的详情已在第 22 章“CLR 寄宿和 AppDomain”进行了讨论。\n>\n> 使用 **ReflectionOnlyLoadFrom**\
  \ 或 **ReflectionOnlyLoad** 方法加载的程序集表面上是可以卸载的。毕竟，这些程序集中的代码是不允许执行的。但 CLR 一样不允许卸载用这两个方法加载的程序集。因为用这两个方法加载了程序集之后，仍然可以利用反射来创建对象，以便引用这些程序集中定义的元数据。如果卸载程序集，就必须通过某种方式使这些对象失效。无论是实现的复杂性，还是执行速度，跟踪这些对象的状态都是得不偿失的。\n\
  \n许多应用程序都由一个要依赖于众多 DLL 文件的 EXE 文件构成。部署应用程序时，所有文件都必须部署。但有一个技术允许只部署一个 EXE 文件。首先标识出\
  \ EXE 文件要依赖的、不是作为 Microsoft .NET Framework 一部分发布的所有 DLL 文件。然后将这些 DLL 添加到 Visual\
  \ Studio 项目中。对于添加的每个 DLL，都显示它的属性，将它的“生成操作”更改为“嵌入的资源”。这会导致 C# 编译器将 DLL 文件嵌入 EXE 文件中，以后就只需部署这个\
  \ EXE。\n\n在运行时，CLR 会找不到依赖的 DLL 程序集。为了解决这个问题，当应用程序初始化时，向 **AppDomain** 的 **AssemblyResolve**\
  \ 事件登记一个回调方法。代码大致如下：\n\n```csharp\nprivate static Assembly ResolveEventHandler(Object\
  \ sender, ResolveEventArgs args) {\n    String dllName = new AssemblyName(args.Name).Name\
  \ + \".dll\";\n\n    var assem = Assembly.GetExecutingAssembly();\n    String resourceName\
  \ = assem.GetManifestResourceNames().FirstOrDefault(rn =>\n        rn.EndsWith(dllName));\n\
  \    if (resourceName == null) return null; // Not found, maybe another handler\
  \ will find it\n    using (var stream = assem.GetManifestResourceStream(resourceName))\
  \ {\n        Byte[] assemblyData = new Byte[stream.Length];\n```\n\n### 23.3 反射的性能\n\
  \n反射是相当强大的机制，允许在运行时发现并使用编译时还不了解的类型及其成员。但是，它也有下面两个缺点。\n\n- 反射造成编译时无法保证类型安全性。由于反射严重依赖字符串，所以会丧失编译时的类型安全性。例如，执行\
  \ `Type.GetType(\"int\");` 要求通过反射在程序集中查找名为 `\"int\"` 的类型，代码会通过编译，但在运行时会返回 `null`，因为\
  \ CLR 只知 `\"System.Int32\"`，不知 `\"int\"`。\n\n- 反射速度慢。使用反射时，类型及其成员的名称在编译时未知；你要用字符串名称标识每个类型及其成员，然后在运行时发现它们。也就是说，使用\
  \ `System.Reflection` 命名空间中的类型扫描程序集的元数据时，反射机制会不停地执行字符串搜索。通常，字符串搜索执行的是不区分大小写的比较，这会进一步影响速度。\n\
  \n使用反射调用成员也会影响性能。用反射调用方法时，首先必须将实参打包(pack)成数组；在内部，反射必须将这些实参解包(unpack)到线程栈上。此外，在调用方法前，CLR\
  \ 必须检查实参具有正确的数据类型。最后，CLR 必须确保调用者有正确的安全权限来访问被调用的成员。\n\n基于上述所有原因，最好避免利用反射来访问字段或调用方法/属性。应该利用以下两种技术之一开发应用程序来动态发现和构造类型实例。\n\
  \n- 让类型从编译时已知的基类型派生。在运行时构造派生类型的实例，将对它的引用放到基类型的变量中(利用转型)，再调用基类型定义的虚方法。\n\n- 让类型实现编译时已知的接口。在运行时构造类型的实例，将对它的引用放到接口类型的变量中(利用转型)，再调用接口定义的方法。\n\
  \n在这两种技术中，我个人更喜欢使用接口技术而非基类技术，因为基类技术不允许开发人员选择特定情况下工作得最好的基类。不过，需要版本控制的时候基类技术更合适，因为可随时向基类添加成员，派生类会直接继承该成员。相反，要向接口添加成员，实现该接口的所有类型都得修改它们的代码并重新编译。\n\
  \n使用这两种技术时，强烈建议接口或基类型在它们自己的程序集中定义，这有助于缓解版本控制问题。欲知详情，请参见稍后的 23.4 节“设计支持加载项的应用程序”。\n\
  \n如前所述，**Type** 对象是轻量级的对象引用。要更多地了解类型本身，必须获取一个 **TypeInfo** 对象，后者才代表类型定义。可调用 **System.Reflection.IntrospectionExtensions**\
  \ 的 **GetTypeInfo** 扩展方法将 **Type** 对象转换成 **TypeInfo** 对象。\n\n```csharp\nType typeReference\
  \ = ...; // 例如：o.GetType() 或者 typeof(Object)\nTypeInfo typeDefinition = typeReference.GetTypeInfo();\n\
  ```\n\n另外，虽然作用不大，但还可调用 **TypeInfo** 的 **AsType** 方法将 **TypeInfo** 对象转换为 **Type**\
  \ 对象。\n\n```csharp\nTypeInfo typeDefinition = ...;\nType typeReference = typeDefinition.AsType();\n\
  ```\n\n获取 **TypeInfo** 对象会强迫 CLR 确保已加载类型的定义程序集，从而对类型进行解析。这个操作可能代价高昂。如果只需要类型引用（**Type**\
  \ 对象），就应避免这个操作。但一旦获得了 **TypeInfo** 对象，就可查询类型的许多属性进一步了解它。大多数属性，比如 **IsPublic**、**IsSealed**、**IsAbstract**、**IsClass**\
  \ 和 **IsValueType** 等，都指明了与类型关联的标志。另一些属性，比如 **Assembly**、**AssemblyQualifiedName**、**FullName**\
  \ 和 **Module** 等，则返回定义该类型的程序集或模块的名称以及类型的全名。还可查询 **BaseType** 属性来获取对类型的基类型的引用。除此之外，还有许多方法能提供关于类型的更多信息。文档描述了\
  \ **TypeInfo** 公开的所有方法和属性。\n\n#### 23.3.3　构建 Exception 派生类型的层次结构\n\n以下代码使用本章讨论的许多概念将一组程序集加载到\
  \ **AppDomain** 中，并显示最终从 **System.Exception** 派生的所有类。顺便说一句，20.4 节“FCL 定义的异常类”展示的\
  \ **Exception** 层次结构就是用这个程序显示的。\n\n```csharp\npublic static void Go() {\n    //\
  \ 显式加载想要反射的程序集\n    LoadAssemblies();\n\n    // 对所有类型进行筛选和排序\n    var allTypes =\n\
  \        (from a in AppDomain.CurrentDomain.GetAssemblies()\n         from t in\
  \ a.ExportedTypes\n         where typeof(Exception).GetTypeInfo().IsAssignableFrom(t.GetTypeInfo())\n\
  \         orderby t.Name\n         select t).ToArray();\n\n    // 生成并显示继承层次结构\n\
  \    Console.WriteLine(WalkInheritanceHierarchy(new StringBuilder(), 0,\n      \
  \                   typeof(Exception), allTypes));\n}\n\nprivate static StringBuilder\
  \ WalkInheritanceHierarchy(\n    StringBuilder sb, Int32 indent, Type baseType,\
  \ IEnumerable<Type> allTypes) {\n    String spaces = new String(' ', indent * 3);\n\
  \    sb.AppendLine(spaces + baseType.FullName);\n    foreach (var t in allTypes)\
  \ {\n        if (t.GetTypeInfo().BaseType != baseType) continue;\n        WalkInheritanceHierarchy(sb,\
  \ indent + 1, t, allTypes);\n    }\n    return sb;\n}\n```\n\n```csharp\nprivate\
  \ static void LoadAssemblies() {\n    String[] assemblies = {\n        \"System,\
  \                     PublicKeyToken={0}\",\n        \"System.Core,            \
  \    PublicKeyToken={0}\",\n        \"System.Data,                PublicKeyToken={0}\"\
  ,\n        \"System.Design,              PublicKeyToken={1}\",\n        \"System.DirectoryServices,\
  \   PublicKeyToken={1}\",\n        \"System.Drawing,             PublicKeyToken={1}\"\
  ,\n        \"System.Drawing.Design,      PublicKeyToken={1}\",\n        \"System.Management,\
  \          PublicKeyToken={1}\",\n        \"System.Messaging,           PublicKeyToken={1}\"\
  ,\n        \"System.Runtime.Remoting,    PublicKeyToken={0}\",\n        \"System.Security,\
  \            PublicKeyToken={1}\",\n        \"System.ServiceProcess,      PublicKeyToken={1}\"\
  ,\n        \"System.Web,                 PublicKeyToken={1}\",\n        \"System.Web.RegularExpressions,\
  \ PublicKeyToken={1}\",\n        \"System.Web.Services,        PublicKeyToken={1}\"\
  ,\n        \"System.Xml,                 PublicKeyToken={0}\",\n    };\n\n    String\
  \ EcmaPublicKeyToken = \"b77a5c561934e089\";\n    String MSPublicKeyToken = \"b03f5f7f11d50a3a\"\
  ;\n\n    // 获取包含 System.Object 的程序集的版本。\n    // 假定其他所有程序集都是相同的版本\n    Version version\
  \ = typeof(System.Object).Assembly.GetName().Version;\n\n    // 显式加载想要反射的程序集\n \
  \   foreach (String a in assemblies) {\n        String AssemblyIdentity =\n    \
  \        String.Format(a, EcmaPublicKeyToken, MSPublicKeyToken) +\n            \"\
  , Culture=neutral, Version=\" + version;\n        Assembly.Load(AssemblyIdentity);\n\
  \    }\n}\n```\n\n#### 23.3.4 构造类型的实例\n\n获得对 **Type** 派生对象的引用之后，就可以构造该类型的实例了。FCL\
  \ 提供了以下几个机制。\n\n- **System.Activator 的 CreateInstance 方法**\n  \n  **Activator**\
  \ 类提供了静态 **CreateInstance** 方法的几个重载版本。调用方法时既可传递一个 **Type** 对象引用，也可传递标识了类型的 **String**。直接获取类型对象的几个版本较为简单。你要为类型的构造器传递一组实参，方法返回对新对象的引用。\n\
  \  \n  用字符串来指定类型的几个版本则稍微复杂一些。首先必须指定另一个字符串来标识定义了类型的程序集。其次，如果正确配置了远程访问(remoting)选项，这些方法还允许构造远程对象。第三，这些版本返回的不是对新对象的引用，而是一个\
  \ **System.Runtime.Remoting.ObjectHandle** 对象(从 **System.MarshalByRefObject** 派生)。**ObjectHandle**\
  \ 类型允许将一个 **AppDomain** 中创建的对象传至其他 **AppDomain**，期间不强迫对象具体化(materialize)。准备好具体化这个对象时，请调用\
  \ **ObjectHandle** 的 **Unwrap** 方法。在一个 **AppDomain** 中调用该方法时，它将定义了要具体化的类型的程序集加载到这个\
  \ **AppDomain** 中。如果对象按引用封送，会创建代理类型和对象。如果对象按值封送，对象的副本会被反序列化。\n\n- **System.Activator\
  \ 的 CreateInstanceFrom 方法**\n  \n  **Activator** 类还提供了一组静态 **CreateInstanceFrom**\
  \ 方法。它们与 **CreateInstance** 的行为相似，只是必须通过字符串参数来指定类型及其程序集。程序集用 **Assembly** 的 **LoadFrom**(而非\
  \ **Load**)方法加载到调用 **AppDomain** 中。由于都不接受 **Type** 参数，所以返回的都是一致 **ObjectHandle**\
  \ 对象引用，必须调用 **ObjectHandle** 的 **Unwrap** 方法进行具体化。\n\n- **System.AppDomain 的方法**\n\
  \  \n  **AppDomain** 类型提供了 4 个用于构造类型实例的实例方法(每个都有几个重载版本)，包括 **CreateInstance**，**CreateInstanceAndUnwrap**，**CreateInstanceFrom**\
  \ 和 **CreateInstanceFromAndUnwrap**。这些方法的行为和 **Activator** 类的方法相似，区别在于它们都是实例方法，允许指定在哪个\
  \ **AppDomain** 中构造对象。另外，带 **Unwrap** 后缀的方法还能简化操作，不必执行额外的方法调用。\n\n- **System.Reflection.ConstructorInfo\
  \ 的 Invoke 实例方法**\n  \n  使用一个 **Type** 对象引用，可以绑定到一个特定的构造器，并获取对构造器的 **ConstructorInfo**\
  \ 对象的引用。然后，可利用 **ConstructorInfo** 对象引用来调用它的 **Invoke** 方法。类型总是在调用 **AppDomain**\
  \ 中创建，返回的是对新对象的引用。本章稍后会详细讨论该方法。\n\n> 注意 CLR 不要求值类型定义任何构造器。但这会造成一个问题，因为上述列表中的所有机制都要求调用构造器来构造对象。然而，**Activator**\
  \ 的 **CreateInstance** 方法允许在不调用构造器的情况下创建值类型的实例。要在不调用构造器的情况下创建值类型的实例，必须调用 **CreateInstance**\
  \ 方法获取单个 **Type** 参数的版本或者获取 **Type** 和 **Boolean** 参数的版本。\n\n利用前面列出的机制，可为除数组 (**System.Array**\
  \ 派生类型) 和委托 (**System.MulticastDelegate** 派生类型)之外的所有类型创建对象。创建数组需要调用 **Array** 的静态\
  \ **CreateInstance** 方法(有几个重载的版本)。所有版本的 **CreateInstance** 方法获取的第一个参数都是对数组元素 **Type**\
  \ 的引用。**CreateInstance** 的其他参数允许指定数组维数和上下限的各种组合。创建委托则要调用 **MethodInfo** 的静态 **CreateDelegate**\
  \ 方法。所有版本的 **CreateDelegate** 方法获取的第一个参数都是对委托 **Type** 的引用。**CreateDelegate** 方法的其他参数允许指定在调用实例方法时应将哪个对象作为\
  \ **this** 参数传递。\n\n构造泛型类型的实例首先要获取对开放类型的引用，然后调用 **Type** 的 **MakeGenericType** 方法并向其传递一个数组(其中包含要作为类型实参使用的类型)①。然后，获取返回的\
  \ **Type** 对象并把它传给上面列出的某个方法。下面是一个例子：\n\n```csharp\nusing System;\n```\n\n① 要想进一步了解开放类型、封闭类型、类型参数和类型实参等术语，请参见第\
  \ 12 章“泛型”。——译注\n\n\n\n```csharp\nusing System.Reflection;\n\ninternal sealed class\
  \ Dictionary<TKey, TValue> { }\n\npublic static class Program {\n    public static\
  \ void Main() {\n        // 获取对泛型类型的类型对象的引用\n        Type openType = typeof(Dictionary<,>);\n\
  \n        // 使用 TKey=String, TValue=Int32 封闭泛型类型①\n        Type closedType = openType.MakeGenericType(typeof(String),\
  \ typeof(Int32));\n\n        // 构造封闭类型的实例\n        Object o = Activator.CreateInstance(closedType);\n\
  \n        // 证实能正常工作\n        Console.WriteLine(o.GetType());\n    }\n}\n```\n\n\
  编译并运行上述代码得到以下输出：\n\n```text\nDictionary`2[System.String,System.Int32]\n```\n\n###\
  \ 23.4 设计支持加载项的应用程序\n\n构建可扩展应用程序时，接口是中心。可用基类代替接口，但接口通常是首选的，因为它允许加载项开发人员选择他们自己的基类。例如，假定要写一个应用程序来无缝地加载和使用别人创建的类型。下面描述了如何设计这种应用程序。\n\
  \n- 创建“宿主 SDK” (Host SDK)程序集，它定义了一个接口，接口的方法作为宿主应用程序与加载项之间的通信机制使用。为接口方法定义参数和返回类型时，请尝试使用\
  \ MSCorLib.dll 中定义的其他接口或类型。要传递并返回自己的数据类型，也在“宿主 SDK”程序集中定义。一旦搞定接口定义，就可为这个程序集赋予强名称(参见第\
  \ 3 章)，然后把它打包并部署到合作伙伴和用户那里。发布后要避免对该程序集中的类型做出任何重大的改变。例如，不要以任何方式更改接口。但如果定义了任何数据类型，在类型中添加新成员是完全允许的。对程序集进行任何修改之后，可能需要使用一个发布者策略文件夹来部署它(也参见第\
  \ 3 章的讨论)。\n\n  > **注意** 之所以能使用 MSCorLib.dll 中定义的类型，是因为 CLR 总是加载与 CLR 本身的版本匹配的那个版本的\
  \ MSCorLib.dll。此外，一个 CLR 实例只会加载一个版本的 MSCorLib.dll。换言之，永远不会出现多个不同版本的 MSCorLib.dll\
  \ 都加载的情况(详见第 3 章)。最后结果就是，绝不会出现类型版本不匹配的情况。这还有助于减少应用程序对内存的需求。\n\n- 当然，加载项开发人员会在加载项程序集中定义自己的类型。这些程序集将引用你的\n\
  \n```csharp\nusing System;\nusing System.IO;\nusing System.Reflection;\nusing System.Collections.Generic;\n\
  using WinTellect.HostSDK;\n\npublic static class Program {\n    public static void\
  \ Main() {\n        // 查找宿主 EXE 文件所在的目录\n        String AddInDir = Path.GetDirectoryName(Assembly.GetEntryAssembly().Location);\n\
  \n        // 假定加载项程序集和宿主 EXE 文件在同一个目录\n        var AddInAssemblies = Directory.EnumerateFiles(AddInDir,\
  \ \"*.dll\");\n\n        // 创建可由宿主使用的所有加载 Type 的一个集合\n        var AddInTypes =\n\
  \            from file in AddInAssemblies\n            let assembly = Assembly.Load(file)\n\
  \            from t in assembly.ExportedTypes // 公开导出的类型\n            // 如果类型实现了\
  \ IAddIn 接口，该类型就可由宿主使用\n            where t.IsClass && typeof(IAddIn).GetTypeInfo().IsAssignableFrom(t.GetTypeInfo())\n\
  \            select t;\n        // 初始化完成：宿主已发现了所有可用的加载项\n\n        // 下面示范宿主如何构造加载项对象并使用它们\n\
  \        foreach (Type t in AddInTypes) {\n            IAddIn ai = (IAddIn) Activator.CreateInstance(t);\n\
  \            Console.WriteLine(ai.DoSomething(5));\n        }\n    }\n}\n```\n\n\
  这个简单的宿主/加载项例子没有用到 AppDomain。但在实际应用中，每个加载项都可能要在自己的 AppDomain 中创建，每个 AppDomain 都有自己的安全性和配置设置。当然，如果希望将加载项从内存中移除，可以卸载相应的\
  \ AppDomain。为了跨 AppDomain 边界通信，可告诉加载项开发人员从 MarshalByRefObject 派生出他们自己的加载类型。但另一个更常见的方法是让宿主应用程序定义自己的、从\
  \ MarshalByRefObject 派生的内部类型。每个 AppDomain 创建好后，宿主要在新 AppDomain 中创建它自己的 MarshalByRefObject\
  \ 派生类型实例。宿主的代码(位于默认 AppDomain 中)将与它自己的类型(位于其他 AppDomain 中)通信，让后者装入加载项程序集，并创建和使用加载的类型的实例。\n\
  \n### 23.5 使用反射发现类型的成员\n\n到目前为止，本章的重点一直都是构建动态可扩展应用程序所需的反射机制，包括程序集加载、类型发现以及对象构造。要获得好的性能和编译时的类型安全性，应尽量避免使用反射。如果是动态可扩展应用程序，构造好对象后，宿主代码一般要将对象转型为编译时已知的接口类型或者基类。这样访问对象的成员就可以获得较好的性能，而且可以确保编译时的类型安全性。\n\
  \n本章剩余部分将从其他角度探讨反射，目的是发现并调用类型的成员。一般利用这个功能创建开发工具和实用程序，查找特定编程模式或者对特定成员的使用，从而对程序集进行分析。例子包括\
  \ ILDasm、FxCopCmd.exe 以及 Visual Studio 的 Windows 窗体/WPF/Web 窗\n\n```csharp\nString\
  \ typeName = String.Empty;\nif (mi is Type) typeName = \"(Nested) Type\";\nif (mi\
  \ is FieldInfo) typeName = \"FieldInfo\";\nif (mi is MethodInfo) typeName = \"MethodInfo\"\
  ;\nif (mi is ConstructorInfo) typeName = \"ConstructorInfo\";\nif (mi is PropertyInfo)\
  \ typeName = \"PropertyInfo\";\nif (mi is EventInfo) typeName = \"EventInfo\";\n\
  Show(2, \"{0}: {1}\", typeName, mi);\n    }\n  }\n}\n\nprivate static void Show(Int32\
  \ indent, String format, params Object[] args) {\n    Console.WriteLine(new String('\
  \ ', 3 * indent) + format, args);\n}\n```\n\n编译并运行上述代码会产生大量输出。下面摘录了其中一小部分：\n\n```text\n\
  Assembly: mscorlib, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089\n\
