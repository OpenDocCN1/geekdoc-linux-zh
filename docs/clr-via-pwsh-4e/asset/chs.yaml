  \ construction: None\n\nAttributes applied to .ctor: None\n```\n\n### 18.7 条件特性类\n\
  \n定义、应用和反射特性能带来许多便利，所以开发人员越来越频繁地使用这些技术。特性简化了对代码的注释，还能实现丰富的功能。近来，开发人员越来越喜欢在设计和调试期间利用特性来辅助开发。例如，Microsoft\
  \ Visual Studio 代码分析工具(FxCopCmd.exe)提供了一个 System.Diagnostics.CodeAnalysis.SuppressMessageAttribute，可将它应用于类型和成员，从而阻止报告特定的静态分析工具规则冲突(rule\
  \ violation)。该特性仅对代码分析工具有用；程序平常运行时不会关注它。没有使用代码分析工具时，将 SuppressMessage 特性留在元数据中会使元数据无谓地膨胀，这会使文件变得更大，增大进程的工作集，损害应用程序的性能。假如有一种简单的方式，使编译器只有在使用代码分析工具时才生成\
  \ SuppressMessage 特性，结果会好很多。幸好，利用条件特性类真的能做到这一点。\n\n应用了 System.Diagnostics.ConditionalAttribute\
  \ 的特性类称为条件特性类。下面是一个例子：\n\n```csharp\n//#define TEST\n#define VERIFY\n\nusing System;\n\
  using System.Diagnostics;\n\n[Conditional(\"TEST\")][Conditional(\"VERIFY\")]\n\
  public sealed class CondAttribute : Attribute {\n}\n\n[Cond]\npublic sealed class\
  \ Program {\n  public static void Main() {\n    Console.WriteLine(\"CondAttribute\
  \ is {0} applied to Program type.\",\n      Attribute.IsDefined(typeof(Program),\n\
  \        typeof(CondAttribute)) ? \"\" : \"not \");\n  }\n}\n```\n\n编译器如果发现向目标元素应用了\
  \ CondAttribute 的实例，那么当含有目标元素的代码编译时，只有在定义 TEST 或 VERIFY 符号的前提下，编译器才会在元数据中生成特性信息。不过，特性类的定义元数据和实现仍存在于程序集内。\n\
  \n\n"
- "## 第 19 章　可空值类型\n\n本章内容：\n\n- C#对可空值类型的支持\n- C#的空接合操作符\n- CLR 对可空值类型的特殊支持\n\n我们知道值类型的变量永远不会为\
  \ null；它总是包含值类型的值本身。事实上，这正是“值类型”一词的由来。遗憾的是，这在某些情况下会成为问题。例如，设计数据库时，可将一个列的数据类型定义成一个\
  \ 32 位整数，并映射到 FCL(Framework Class Library)的 Int32 数据类型。但是，数据库中的一个列可能允许值为空；也就是说，该列在某一行上允许没有任何值。用\
  \ Microsoft .NET Framework 处理数据库数据可能变得很困难，因为在 CLR 中，没有办法将 Int32 值表示成 null。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_405_0.png)\n\
  \n> **注意**　Microsoft ADO.NET 的类型化数据集(typed data sets)确实支持可空类型。遗憾的是，System.Data.SqlTypes\
  \ 命名空间中的类型没有用可空类型替换，部分原因是类型之间没有“一对一”的对应关系。例如，SqlDecimal 类型最大允许 38 位数，而普通的 Decimal\
  \ 类型最大只允许 29 位数。此外，SqlString 类型支持它自己的本地化和比较选项，而普通的 String 类型并不支持这些。\n\n下面是另一个例子：Java\
  \ 的 java.util.Date 类是引用类型，所以该类型的变量能设为 null。但 CLR 的 System.DateTime 是值类型，DateTime\
  \ 变量永远不能设为 null。如果用 Java 写的一个应用程序想和运行 CLR 的 Web 服务交流日期/时间，那么一旦 Java 程序发送 null，就会出问题，因为\
  \ CLR 不知道如何表示 null，也不知道如何操作它。\n\n为了解决这个问题，Microsoft 在 CLR 中引入了可空值类型的概念。为了理解它们是如何工作的，先来看看\
  \ FCL 中定义的 `System.Nullable<T>` 结构。以下是 `System.Nullable<T>` 定义的逻辑表示：\n\n```csharp\n\
  [Serializable, StructLayout(LayoutKind.Sequential)]\npublic struct Nullable<T> where\
  \ T : struct {\n    // 这两个字段表示状态\n    private Boolean hasValue = false;  // 假定 null\n\
  \    internal T value = default(T);     // 假定所有位都为零\n\n    public Nullable(T value)\
  \ {\n        this.value = value;\n        this.hasValue = true;\n    }\n\n    public\
  \ Boolean HasValue { get { return hasValue; } }\n\n    public T Value {\n      \
  \  get {\n            if (!hasValue) {\n                throw new InvalidOperationException(\n\
  \                    \"Nullable object must have a value.\");\n            }\n \
  \           return value;\n        }\n    }\n\n    public T GetValueOrDefault()\
  \ { return value; }\n\n    public T GetValueOrDefault(T defaultValue) {\n      \
  \  if (!HasValue) return defaultValue;\n        return value;\n    }\n\n    public\
  \ override Boolean Equals(Object other) {\n        if (!HasValue) return (other\
  \ == null);\n        if (other == null) return false;\n        return value.Equals(other);\n\
  \    }\n\n    public override int GetHashCode() {\n        if (!HasValue) return\
  \ 0;\n        return value.GetHashCode();\n    }\n\n    public override string ToString()\
  \ {\n        if (!HasValue) return \"\";\n        return value.ToString();\n   \
  \ }\n\n    public static implicit operator Nullable<T>(T value) {\n        return\
  \ new Nullable<T>(value);\n    }\n\n    public static explicit operator T(Nullable<T>\
  \ value) {\n        return value.Value;\n    }\n}\n```\n\n可以看出，该结构能表示可为 null 的值类型。由于\
  \ `Nullable<T>` 本身是值类型，所以它的实例仍然是“轻量级”的。也就是说，实例仍然可以在栈上，而且实例的大小和原始值类型基本一样，只是多了一个 Boolean\
  \ 字段。注意 `Nullable<T>` 的类型参数 `T` 被约束为 `struct`。这是由于引用类型的变量本来就可以为 null，所以没必要再去照顾它。\n\
  \n现在，要在代码中使用一个可空的 `Int32`，就可以像下面这样写：\n\n```csharp\nNullable<Int32> x = 5;\nNullable<Int32>\
  \ y = null;\nConsole.WriteLine(\"x: HasValue={0}, Value={1}\", x.HasValue, x.Value);\n\
  Console.WriteLine(\"y: HasValue={0}, Value={1}\", y.HasValue, y.GetValueOrDefault());\n\
  ```\n\n编译并运行上述代码，将获得以下输出：\n\n```text\nx: HasValue=True, Value=5\ny: HasValue=False,\
  \ Value=0\n```\n\n### 19.1 C#对可空值类型的支持\n\nC#允许使用相当简单的语法初始化上述两个 `Nullable<Int32>`\
  \ 变量 x 和 y。事实上，C#开发团队的目的是将可空值类型集成到 C#语言中，使之成为“一等公民”。为此，C#提供了更清晰的语法来处理可空值类型。C#允许用问号表示法来声明并初始化\
  \ x 和 y 变量：\n\n```csharp\nInt32? x = 5;\nInt32? y = null;\n```\n\n在 C#中，`Int32?`\
  \ 等价于 `Nullable<Int32>`。但 C#在此基础上更进一步，允许开发人员在可空实例上执行转换和转型①。C#还允许向可空实例应用操作符。以下代码对此进行了演示：\n\
  \n> ① 作者在这里区分了转换和转型。例如，从 `Int32` 的可空版本到非空版本(或相反)，称为“转换”。但是，涉及不同基元类型的转换，就称为“转型”或“强制类型转换”。——译注\n\
  \n```csharp\nprivate static void ConversionsAndCasting() {\n    // 从非空 Int32 隐式转换为\
  \ Nullable<Int32>\n    Int32? a = 5;\n\n    // 从'null'隐式转换为 Nullable<Int32>\n  \
  \  Int32? b = null;\n\n    // 从 Nullable<Int32>显式转换为非空 Int32\n    Int32 c = (Int32)\
  \ a;\n\n    // 在可空基元类型之间转型\n    Double? d = 5;    // Int32 转型为 Double? (d is double\
  \ 值 5.0)\n    Double? e = b;    // Int32?转型为 Double? (e is null)\n}\n```\n\nC#还允许向可空实例应用操作符，例如：\n\
  \n```csharp\nprivate static void Operators() {\n    Int32? a = 5;\n    Int32? b\
  \ = null;\n\n    // 一元操作符 (+ ++ - -- ! ~)\n    a++;    // a = 6\n    b = -b;   \
  \ // b = null\n\n    // 二元操作符 (+ - * / % & | ^ << >>)\n    a = a + 3;    // a =\
  \ 9\n    b = b * 3;    // b = null;\n\n    // 相等性操作符 (== !=)\n    if (a == null)\
  \ { /* no */ }  else { /* yes */ }\n    if (b == null) { /* yes */ } else { /* no\
  \ */ }\n    if (a != b) { /* yes */ }    else { /* no */ }\n\n    // 比较操作符 (< >\
  \ <= >=)\n    if (a < b)       { /* no */ } else { /* yes */ }\n}\n```\n\n下面总结了\
  \ C#如何解析操作符。\n\n- 一元操作符(+, ++, -, --, !, ~)：操作数是 null，结果就是 null。\n- 二元操作符(+, -,\
  \ *, /, %, &, |, ^, <<, >>)：两个操作数任何一个是 null，结果就是 null。但有一个例外，它发生在将 & 和 | 操作符应用于\
  \ `Boolean?` 操作数的时候。在这种情况下，两个操作符的行为和 SQL 的三值逻辑一样。对于这两个操作符，如果两个操作数都不是 null，那么操作符和平时一样工作。如果两个操作数都是\
  \ null，结果就是 null。特殊行为仅在其中之一为 null 时发生。下表列出了针对操作数的 true、false 和 null 三个值的各种组合，两个操作符的求值情况。\n\
  \n  | 操作数 1 →<br>操作数 2 ↓ | true | false | null |\n  |---|---|---|---|\n  | true\
  \ | & = true<br>\\| = true | & = false<br>\\| = true | & = null<br>\\| = true |\n\
  \  | false | & = false<br>\\| = true | & = false<br>\\| = false | & = false<br>\\\
  | = null |\n  | null | & = null<br>\\| = true | & = false<br>\\| = null | & = null<br>\\\
  | = null |\n\n- 相等性操作符(==, !=)：两个操作数都是 null，两者相等。一个操作数是 null，两者不相等。两个操作数都不是 null，就比较值来判断是否相等。\n\
  - 关系操作符(<, >, <=, >=)：两个操作数任何一个是 null，结果就是 false。两个操作数都不是 null，就比较值。\n\n注意，操作可空实例会生成大量代码。例如以下方法：\n\
  \n```csharp\nprivate static Int32? NullableCodeSize(Int32? a, Int32? b) {\n    return\
  \ (a + b);\n}\n```\n\n编译这个方法会生成相当多的 IL 代码，而且操作可空类型的速度慢于非可空类型。编译器生成的 IL 代码等价于以下 C#代码：\n\
  \n```csharp\nprivate static Nullable<Int32> NullableCodeSize(\n    Nullable<Int32>\
  \ a, Nullable<Int32> b) {\n\n    Nullable<Int32> nullable1 = a;\n    Nullable<Int32>\
  \ nullable2 = b;\n    if (!(nullable1.HasValue & nullable2.HasValue)) {\n      \
  \  return new Nullable<Int32>();\n    }\n    return new Nullable<Int32>(\n     \
  \   nullable1.GetValueOrDefault() + nullable2.GetValueOrDefault());\n}\n```\n\n\
  最后要说明的是，可定义自己的值类型来重载上述各种操作符。8.4 节“操作符重载方法”已对此进行了讨论。使用自己的值类型的可空实例，编译器能正确识别它并调用你重载的操作符(方法)。以下\
  \ Point 值类型重载了 `==` 和 `!=` 操作符：\n\n```csharp\nusing System;\n\ninternal struct Point\
  \ {\n    private Int32 m_x, m_y;\n    public Point(Int32 x, Int32 y) { m_x = x;\
  \ m_y = y; }\n\n    public static Boolean operator ==(Point p1, Point p2) {\n  \
  \      return (p1.m_x == p2.m_x) && (p1.m_y == p2.m_y);\n    }\n\n    public static\
  \ Boolean operator !=(Point p1, Point p2) {\n        return !(p1 == p2);\n    }\n\
  }\n```\n\n然后可以使用 Point 类型的可空实例，编译器能自动调用你重载的操作符(方法)：\n\n```csharp\ninternal static\
  \ class Program {\n    public static void Main() {\n        Point? p1 = new Point(1,\
  \ 1);\n        Point? p2 = new Point(2, 2);\n\n        Console.WriteLine(\"Are points\
  \ equal? \" + (p1 == p2).ToString());\n        Console.WriteLine(\"Are points not\
  \ equal? \" + (p1 != p2).ToString());\n    }\n}\n```\n\n生成并运行上述代码得到以下输出：\n\n```text\n\
  Are points equal? False\nAre points not equal? True\n```\n\n### 19.2　C#的空接合操作符\n\
  \nC#提供了一个“空接合操作符”(null-coalescing operator)，即 `??` 操作符，它要获取两个操作数。假如左边的操作数不为 null，就返回这个操作数的值。如果左边的操作数为\
  \ null，就返回右边的操作数的值。利用空接合操作符，可以方便地设置变量的默认值。\n\n空接合操作符的一个好处在于，它既能用于引用类型，也能用于可空值类型。以下代码演示了如何使用\
  \ `??` 操作符：\n\n```csharp\nprivate static void NullCoalescingOperator() {\n    Int32?\
  \ b = null;\n\n    // 下面这行等价于：\n    // x = (b.HasValue) ? b.Value : 123\n    Int32\
  \ x = b ?? 123;\n    Console.WriteLine(x); // \"123\"\n\n    // 下面这行等价于：\n    //\
  \ String temp = GetFilename();\n    // filename = (temp != null) ? temp : \"Untitled\"\
  ;\n    String filename = GetFilename() ?? \"Untitled\";\n}\n```\n\n有人争辩说 `??` 操作符不过是\
  \ `?:` 操作符的“语法糖”而已，所以C#编译器团队不应该将这个操作符添加到语言中。实际上，`??` 提供了重大的语法上的改进。第一个改进是 `??` 操作符能更好地支持表达式：\n\
  \n```csharp\nFunc<String> f = () => SomeMethod() ?? \"Untitled\";\n```\n\n相比下一行代码，上述代码更容易阅读和理解。下面这行代码要求进行变量赋值，而且用一个语句还搞不定：\n\
  \n```csharp\nFunc<String> f = () => { var temp = SomeMethod();\n    return temp\
  \ != null ? temp : \"Untitled\"; };\n```\n\n第二个改进是 `??` 在复合情形中更好用。例如，下面这行代码：\n\n\
  ```csharp\nString s = SomeMethod1() ?? SomeMethod2() ?? \"Untitled\";\n```\n\n它比下面这一堆代码更容易阅读和理解：\n\
  \n```csharp\nString s;\nvar sm1 = SomeMethod1();\nif (sm1 != null) s = sm1;\nelse\
  \ {\n    var sm2 = SomeMethod2();\n    if (sm2 != null) s = sm2;\n    else s = \"\
  Untitled\";\n}\n```\n\n### 19.3　CLR 对可空值类型的特殊支持\n\nCLR 内建对可空值类型的支持。这个特殊的支持是针对装箱、拆箱、调用\
  \ GetType 和调用接口方法提供的，它使可空类型能无缝地集成到 CLR 中，而且使它们具有更自然的行为，更符合大多数开发人员的预期。下面深入研究一下 CLR\
  \ 对可空类型的特殊支持。\n\n### 19.3.1　可空值类型的装箱\n\n假定有一个逻辑上设为 null 的 `Nullable<Int32>` 变量。将其传给期待一个\
  \ Object 的方法，就必须对其进行装箱，并将对已装箱 `Nullable<Int32>` 的引用传给方法。但对表面上为 null 的值进行装箱不符合直觉——即使\
  \ `Nullable<Int32>` 变量本身非 null，它只是逻辑上包含了 null。为了解决这个问题，CLR 会在装箱可空变量时执行一些特殊代码，从表面上维持可空类型的“一等公民”地位。\n\
  \n具体地说，当 CLR 对 `Nullable<T>` 实例进行装箱时，会检查它是否为 null。如果是，CLR 不装箱任何东西，直接返回 null。如果可空实例不为\
  \ null，CLR 从可空实例中取出值并进行装箱。也就是说，一个值为 5 的 `Nullable<Int32>` 会装箱成值为 5 的已装箱 Int32。以下代码演示了这一行为：\n\
  \n```csharp\n// 对 Nullable<T>进行装箱，要么返回 null，要么返回一个已装箱的 T\nInt32? n = null;\nObject\
  \ o = n; // o为null\nConsole.WriteLine(\"o is null={0}\", o == null); // \"True\"\
  \n\nn = 5;\no = n; // o引用一个已装箱的 Int32\nConsole.WriteLine(\"o's type={0}\", o.GetType());\
  \ // \"System.Int32\"\n```\n\n### 19.3.2 可空值类型的拆箱\n\nCLR 允许将已装箱的值类型 T 拆箱为一个 T 或者\
  \ `Nullable<T>`。如果对已装箱值类型的引用是 `null`，而且要把它拆箱为一个 `Nullable<T>`，那么 CLR 会将 `Nullable<T>`\
  \ 的值设为 `null`。以下代码演示了这个行为：\n\n```csharp\n// 创建已装箱的 Int32\nObject o = 5;\n\n// 把它拆箱为一个\
  \ Nullable<Int32> 和一个 Int32\nInt32? a = (Int32?) o;  // a = 5\nInt32 b = (Int32)\
  \ o;    // b = 5\n\n// 创建初始化为 null 的一个引用\no = null;\n\n// 把它“拆箱”为一个 Nullable<Int32>\
  \ 和一个 Int32\na = (Int32?) o;  // a = null\nb = (Int32) o;   // NullReferenceException\n\
  ```\n\n### 19.3.3 通过可空值类型调用 GetType\n\n在 `Nullable<T>` 对象上调用 `GetType`，CLR 实际会“撒谎”说类型是\
  \ `T`，而不是 `Nullable<T>`。以下代码演示了这一行为：\n\n```csharp\nInt32? x = 5;\n\n// 下面这行会显示“System.Int32”，而非“System.Nullable<Int32>”\n\
  Console.WriteLine(x.GetType());\n```\n\n### 19.3.4 通过可空值类型调用接口方法\n\n以下代码将 `Nullable<Int32>`\
  \ 类型的变量 n 转型为接口类型 `IComparable`。`Nullable<T>` 不像 `Int32` 那样实现了 `IComparable` 接口，但\
  \ C# 编译器允许这样的代码通过编译，而且 CLR 的校验器也认为这样的代码可验证，从而允许使用更简洁的语法：\n\n```csharp\nInt32? n\
  \ = 5;\nInt32 result = ((IComparable) n).CompareTo(5);  // 能顺利编译和运行\nConsole.WriteLine(result);\
  \                       // 0\n```\n\n假如 CLR 不提供这一特殊支持，要在可空值类型上调用接口方法，就必须写很繁琐的代码。首先要转型为已拆箱的值类型，然后才能转型为接口以发出调用：\n\
  \n```csharp\nInt32 result = ((IComparable) (Int32) n).CompareTo(5); // 很繁琐\n```\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_413_0.png)\n"
- "# 第 IV 部分　核心机制\n\n- 第 20 章　异常和状态管理\n- 第 21 章　托管堆和垃圾回收\n- 第 22 章　CLR 寄宿和 AppDomain\n\
  - 第 23 章　程序集加载和反射\n- 第 24 章　运行时序列化\n- 第 25 章　与 WinRT 组件互操作\n\n## \n\n（下方文字模糊，无法准确辨认）\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_415_0.png)\n"
- "## 第 20 章　异常和状态管理\n\n本章内容：\n\n- 定义“异常”\n- 异常处理机制\n- System.Exception 类\n- FCL 定义的异常类\n\
  - 抛出异常\n- 定义自己的异常类\n- 用可靠性换取开发效率\n- 设计规范和最佳实践\n- 未处理的异常\n- 对异常进行调试\n- 异常处理的性能问题\n\
  - 约束执行区域(CER)\n- 代码协定\n\n本章重点在于错误处理，但并非仅限于此。错误处理要分几个部分。首先要定义到底什么是错误。然后要讨论如何判断代码正在经历一个错误，以及如何从错误中恢复。这个时候，状态就成为一个要考虑的问题，因为错误常常在不恰当的时候发生。代码可能在状态改变的中途发生错误。这时需要将一些状态还原为改变之前的样子。当然，还要讨论代码如何通知调用者有错误发生。\n\
  \n在我看来，异常处理是 CLR 最薄弱的一个环节，造成开发人员在写托管代码时遇到许多问题。经过多年的发展，Microsoft 确实进行了一系列显著的改进来帮助开发人员处理错误。但我认为在获得一个真正良好、可靠的系统之前，Microsoft\
  \ 仍有大量工作要做。针对未处理的异常、约束执行区域(constrained execution region，CER)、代码协定、运行时包装的异常以及未捕捉的异常，本章要讨论处理它们时的改进。\n\
  \n### 20.1　定义“异常”\n\n设计类型时要想好各种使用情况。类型名称通常是名词，例如 FileStream 或者 StringBuilder。然后要为类型定义属性、方法、事件等。这些成员的定义方式（属性的数据类型、方法的参数、返回值等）就是类型的编程接口。这些成员代表类本身或者类型实例能执行的行动。行动成员通常用动词表示，例如\
  \ **Read、Write、Flush、Append、Insert** 和 **Remove** 等。当行动成员不能完成任务时，就应抛出异常。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_416_0.png)\n\
  \n> **重要提示**　异常是指成员没有完成它的名称所宣称的行动。\n\n例如以下类定义：\n\n```csharp\ninternal class Account\
  \ {\n    public static void Transfer(Account from, Account to, Decimal amount) {\n\
  \        from -= amount;\n        to += amount;\n    }\n}\n```\n\n**Transfer** 方法接受两个\
  \ **Account** 对象和一个代表账号之间转账金额的 **Decimal** 值。显然，**Transfer** 方法的作用是从一个账户扣除钱，把钱添加到另一个账户中。**Transfer**\
  \ 方法可能因为多种原因而失败。例如，**from** 或 **to** 实参可能为 **null**；**from** 或 **to** 实参引用的可能不是活动账户；**from**\
  \ 账户可能没有足够的资金；**to** 账户的资金可能过多，以至于增加资金时导致账户溢出；**amount** 实参为 0、负数或者小数超过两位。\n\n**Transfer**\
  \ 方法在调用时，它的代码应检查前面描述的种种可能。检测到其中任何一种可能都不能转账，应抛出异常来通知调用者它不能完成任务。事实上，**Transfer** 方法的返回类型为\
  \ **void**。这是由于 **Transfer** 方法没有什么有意义的值需要返回，这一点很容易想得通：方法正常返回①表明转账成功，失败就抛出一个有意义的异常。\n\
  \n面向对象编程极大提高了开发人员的开发效率，因为可以写这样的代码：\n\n```csharp\nBoolean f = \"Jeff\".Substring(1,\
  \ 1).ToUpper().EndsWith(\"E\");  // true\n```\n\n这行代码将多个操作链接到一起②。我很容易写这行代码，其他人也很容易阅读和维护，因为它的意图很明显：获取字符串，取出一部分，全部大写那个部分，然后检查那个部分是否以\"\
  E\"结尾。出发点不错，但有一个重要的前提：没有操作失败，中途不出错。但错误总是可能发生的，所以需要以一种方式处理错误。事实上，许多面向对象的构造——构造器、获取和设置属性、添加和删除事件、调用操作符重载和调用转换操作符等——都没办法返回错误代码，但它们仍然需要报告错误。Microsoft\
  \ .NET Framework 和所有编程语言通过异常处理来解决这个问题。\n\n① 指返回到调用位置，而不是返回一个值。——译注\n\n② 事实上，利用 C#\
  \ 的“扩展方法”，可以将更多本来不能链接的方法链接到一起。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_417_0.png)\n\
  \n> **重要提示**　许多开发人员都错误地认为异常和某件事情的发生频率有关。例如，一个设计文件 Read 方法的开发人员可能会这样想：“读取文件最终会抵达文件尾。由于抵达文件尾总是会发生，所以我设计这个\
  \ Read 方法返回一个特殊值来报告抵达了文件尾；我不让它抛出异常。”问题在于，这是设计 Read 方法的开发人员的想法，而非调用 Read 方法的开发人员的想法。\n\
  \n设计 Read 方法的开发人员不可能知道这个方法的所有调用情形。所以，开发人员不可能知道 Read 的调用者是不是每次都会一路读取到文件尾。事实上，由于大多数文件包含的都是结构化数据，所以一路读取直至文件尾的情况是很少发生的。\n\
  \n### 20.2　异常处理机制\n\n本节介绍异常处理机制，以及进行异常处理所需的 C# 构造，但不打算罗列过多的细节。本章旨在提供何时以及如何使用异常处理的设计规范。要更多地了解异常处理机制和相关的\
  \ C# 语言构造，请参考文档和 C# 语言规范。另外，.NET Framework 异常处理机制是用 Microsoft Windows 提供的结构化异常处理（Structured\
  \ Exception Handling，SEH）机制构建的。对 SEH 的讨论有很多，包括我自己的《Windows 核心编程（第 5 版）》一书，其中有 3\
  \ 章内容专门讨论 SEH。\n\n以下 C# 代码展示了异常处理机制的标准用法，可通过它对异常处理代码块及其用途产生初步认识。代码后面的各小节将正式描述 try、catch\
  \ 和 finally 块及其用途，并提供关于它们的一些注意事项。\n\n```csharp\nprivate void SomeMethod() {\n  \
  \  try {\n        // 需要可靠地进行恢复和/或清理的代码放在这里\n    }\n    catch (InvalidOperationException)\
  \ {\n        // 从 InvalidOperationException 恢复的代码放在这里\n    }\n    catch (IOException)\
  \ {\n        // 从 IOException 恢复的代码放在这里\n    }\n    catch {\n        // 从除了上述异常之外的其他所有异常恢复的代码放在这里\n\
  \        ...\n        // 如果什么异常都捕捉，通常要重新抛出异常。本章稍后将详细解释\n        throw;\n    }\n\
  \    finally {\n        // 这里的代码对始于 try 块的任何操作进行清理\n        // 这里的代码总是执行，不管是不是抛出了异常\n\
  \    }\n    // 如果 try 块没有抛出异常，或者某个 catch 块捕捉到异常，但没有抛出或\n    // 重新抛出异常，就执行下面的代码\n\
  \    ...\n}\n```\n\n这段代码只是使用各种异常处理块的一种可能的方式。不要被这些代码吓到——大多数方法都只有一个 try 块和一个匹配 finally\
  \ 块，或者一个 try 块和一个匹配的 catch 块。像本例这样有这么多 catch 块是很少见的，这里列出它们仅仅是为了演示。\n\n#### 20.2.1　try\
  \ 块\n\n如果代码需要执行一般性的资源清理操作，需要从异常中恢复，或者两者都需要，就可以放到 try 块中。负责清理的代码应放到一个 finally 块中。try\
  \ 块还可包含也许会抛出异常的代码。负责异常恢复的代码应放到一个或多个 catch 块中。针对应用程序能从中安全恢复的每一种异常，都应该创建一个 catch 块。一个\
  \ try 块至少要有一个关联的 catch 块或 finally 块，单独一个 try 块没有意义，C# 也不允许。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_418_0.png)\n\
  \n> **重要提示**　开发人员有时不知道应该在一个 try 块中放入多少代码，这具体取决于状态管理。如果在一个 try 块中执行多个可能抛出同一个异常类型的操作，但不同的操作有不同的异常恢复措施，就应该将每个操作都放到它自己的\
  \ try 块中，这样才能正确地恢复状态。\n\n#### 20.2.2　catch 块\n\ncatch 块包含的是响应一个异常需要执行的代码。一个 try\
  \ 块可以关联 0 个或多个 catch 块。如果 try 块中的代码没有造成异常的抛出，CLR 永远不会执行它的任何 catch 块。线程将跳过所有 catch\
  \ 块，直接执行 finally 块（如果有的话）。finally 块执行完毕后，从 finally 块后面的语句继续执行。\n\ncatch 关键字后的圆括号中的表达式称为捕捉类型。C#\
  \ 要求捕捉类型必须是 System.Exception 或者它的派生类型。例如，上述代码包含用于处理 InvalidOperationException 异常（或者从它派生的任何异常）和\
  \ IOException 异常（或者从它派生的任何异常）的 catch 块。最后一个 catch 块没有指定捕捉类型，能处理除了前面的 catch 块指定的之外的其他所有异常；这相当于捕捉\
  \ System.Exception（只是 catch 块大括号中的代码访问不了异常信息）。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_418_1.png)\n\
  \n> **注意**　用 Microsoft Visual Studio 调试 catch 块时，可在监视窗口中添加特殊变量名称 $exception 来查看当前抛出的异常对象。\n\
  \nCLR 自上而下搜索匹配的 catch 块，所以应该将较具体的异常放在顶部。也就是说，首先出现的是派生程度最大的异常类型，接着是它们的基类型（如果有的话），最后是\
  \ System.Exception（或者没有指定任何捕捉类型的 catch 块）。事实上，如果弄反了这个顺序，将较具体的 catch 块放在靠近底部的位置，C#\
  \ 编译器会报错，因为这样的 catch 块是不可达的。\n\n在 try 块的代码（或者从 try 块调用的任何方法）中抛出异常，CLR 将搜索捕捉类型与抛出的异常相同（或者是它的基类）的\
  \ catch 块。如果没有任何捕捉类型与抛出的异常匹配，CLR 会去调用栈①更高的一层搜索与异常匹配的捕捉类型。如果都到了调用栈的顶部，还是没有找到匹配的 catch\
  \ 块，就会发生未处理的异常。本章后面将更深入地探讨未处理的异常。\n\n一旦 CLR 找到匹配的 catch 块，就会执行内层所有 finally 块中的代码。所谓“内层\
  \ finally 块”是指从抛出异常的 try 块开始，到匹配异常的 catch 块之间的所有 finally 块。注意，匹配异常的那个 catch 块所关联的\
  \ finally 块尚未执行，该 finally 块中的代码一直要等到这个 catch 块中的代码执行完毕才会执行。\n\n所有内层 finally 块执行完毕之后，匹配异常的那个\
  \ catch 块中的代码才开始执行。catch 块中的代码通常执行一些对异常进行处理的操作。在 catch 块的末尾，我们有以下三个选择。\n\n- 重新抛出相同的异常，向调用栈高一层的代码通知该异常的发生。\n\
  - 抛出一个不同的异常，向调用栈高一层的代码提供更丰富的异常信息。\n- 让线程从 catch 块的底部退出③。\n\n本章稍后将针对每一种技术的使用时机提供一些指导方针。选择前两种技术将抛出异常，CLR\
  \ 的行为和之前说的一样：回溯调用栈，查找捕捉类型与抛出的异常的类型匹配的 catch 块。\n\n选择最后一种技术，当线程从 catch 块的底部退出后，它将立即执行包含在\
  \ finally 块④（如果有的话）中的代码。finally 块的所有代码执行完毕后，线程退出 finally 块，执行紧跟在 finally 块之后的语句。如果不存在\
  \ finally 块，线程将从最后一个 catch 块之后的语句开始执行。\n\nC# 允许在捕捉类型后指定一个变量。捕捉到异常时，该变量将引用抛出的 System.Exception\
  \ 派生对象。catch 块的代码可通过引用该变量来访问异常的具体信息（例如异常发生时的堆栈跟踪⑤）。虽然这个对象可以修改，但最好不要这么做，而应把它当成是只读的。本章稍后将解释\
  \ Exception 类型以及可以在该类型上进行哪些操作。\n\n① 文档翻译成“调用堆栈”，——译注\n\n② 前面说过，异常处理涉及调用栈的知识。内层没有找到合适的\
  \ catch，就跑去上一层。以此类推，直至栈顶。不要产生“finally 块怎么跑到 try 和 catch 之间”的误解。请用“立体”思维来看待寻找合适 catch\
  \ 的过程。——译注\n\n③ 此退出(fall out of the bottom of the catch block)非彼退出。不是说要终止线程，而是说执行正常地“贯穿”\
  \ catch 块的底部，并执行匹配的 finally 块。——译注\n\n④ 这个才是与 catch 关联的 finally 块，也就是常说的 try-catch-finally\
  \ 中的 finally。\n\n⑤ 对方法调用的跟踪称为堆栈跟踪(stack trace)。堆栈跟踪列表提供了一种循着调用序列跟踪到异常发生处的手段。另外要注意，虽然本书大多数时候会将\
  \ stack 翻译成“栈”而不是“堆栈”，但为了保持和文档及习惯说法的一致，偶尔还是不得不将一些 stack 翻译成“堆栈”。——译注\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_420_0.png)\n\
  \n> **注意**　你的代码可向 AppDomain 的 FirstChanceException 事件登记。这样只要 AppDomain 中发生异常，就会收到通知。这个通知是在\
  \ CLR 开始搜索任何 catch 块之前发生的。欲知该事件的详情，请参见第 22 章“CLR 寄宿和 AppDomain”。\n\n#### 20.2.3　finally\
  \ 块\n\nfinally 块包含的是保证会执行的代码。一般在 finally 块中执行 try 块的行动所要求的资源清理操作。\n\n例如，在 try 块中打开了文件，就应该将关闭文件的代码放到\
  \ finally 块中。\n\n```csharp\nprivate void ReadData(String pathname) {\n    FileStream\
  \ fs = null;\n    try {\n        fs = new FileStream(pathname, FileMode.Open);\n\
  \        // 处理文件中的数据...\n    }\n    catch (IOException) {\n        // 在此添加从 IOException\
  \ 恢复的代码\n    }\n    finally {\n        // 确保文件被关闭\n        if (fs != null) fs.Close();\n\
  \    }\n}\n```\n\n在上述代码中，如果 try 块中的代码没有抛出异常，文件保证会被关闭。如果 try 块中的代码抛出异常，文件也保证会被关闭，无论该异常是否被捕捉到。将关闭文件的语句放在\
  \ finally 块之后是不正确的，因为假若异常抛出但未被捕捉到，该语句就执行不到，造成文件一直保持打开状态（直到下一次垃圾回收）。\n\ntry 块并不一定要关联\
  \ finally 块。try 块的代码有时并不需要任何清理工作。但是，只要有 finally 块，它就必须出现在所有 catch 块之后，而且一个 try 块最多只能够关联一个\
  \ finally 块。\n\n线程执行完 finally 块中的代码后，会执行紧跟在 finally 块之后的语句。记住，finally 块中的代码是清理代码，这些代码只需对\
  \ try 块中发起的操作进行清理。catch 和 finally 中的代码应该非常短（通常只有一两行），而且要有非常高的成功率，避免自己又抛出异常。\n\n\
  当然，（catch 中的）异常恢复代码或（finally 中的）清理代码总是有可能失败并抛出异常的。但这个可能性不大。而且如果真的发生，通常意味着某个地方出了很严重的问题。很可能①\n\
  \n① 终止线程或卸载 AppDomain 会造成 CLR 抛出一个 ThreadAbortException，使 finally 块能够执行。如果直接用 Win32\
  \ 函数 TerminateThread 杀死线程，或者用 Win32 函数 TerminateProcess 或 System.Environment 的 FailFast\
  \ 方法杀死进程，finally 块不会执行。当然，进程终止后，Windows 会清理该进程使用的所有资源。\n\n\n\n是某些状态在一个地方发生了损坏。即使\
  \ **catch** 或 **finally** 块内部抛出了异常也不是世界末日——**CLR** 的异常机制仍会正常运转，好像异常是在 **finally**\
  \ 块之后抛出的一样。但是，出现这种情况时，**CLR** 不会记录对应的 **try** 块(如果有的话)中抛出的第一个异常，关于第一个异常的所有信息(例如堆栈跟踪)都将丢失。这个新异常可能(而且极有可能)不会由你的代码处理，最终变成一个未处理的异常。在这种情况下，**CLR**\
  \ 会终止你的进程。这是件好事情，因为损坏的所有状态现在都会被销毁。相较于让应用程序继续运行，造成不可预知的结果以及可能的安全漏洞，这样处理要好得多！\n\n\
  我个人认为，C#团队应该为异常处理机制选择一套不同的语言关键字。程序员想做的是尝试(try)执行一些代码。如果发生错误，要么处理(handle)错误，以便从错误中恢复并继续；要么进行补偿(compensate)来撤销一些状态更改，并向调用者上报错误。程序员还希望确保清理操作(cleanup)无论如何都会发生。左边的代码是目前\
  \ C#编译器所支持的方式，右边的是我推荐的可读性更佳的方式：\n\n```csharp\nvoid Method() {\n    try {\n     \
  \   ...\n    }\n    catch (XxxException) {\n        ...\n    }\n    catch (YyyException)\
  \ {\n        ...\n    }\n    catch {\n        ...; throw;\n    }\n    finally {\n\
  \        ...\n    }\n}\n```\n\n```csharp\nvoid Method() {\n    try {\n        ...\n\
  \    }\n    handle (XxxException) {\n        ...\n    }\n    handle (YyyException)\
  \ {\n        ...\n    }\n    compensate {\n        ...\n    }\n    cleanup {\n \
  \       ...\n    }\n}\n```\n\n### CLS 和非 CLS 异常\n\n> 所有面向 **CLR** 的编程语言都必须支持抛出从\
  \ **Exception** 派生的对象，因为公共语言规范(**Common Language Specification, CLS**)对此进行了硬性规定。但是，**CLR**\
  \ 实际允许抛出任何类型的实例，而且有些编程语言允许代码抛出非 **CLS** 相容的异常对象，比如一个 **String**、**Int32** 和 **DateTime**\
  \ 等。**C#**编译器只允许代码抛出从 **Exception** 派生的对象，而用其他一些语言写的代码不仅允许抛出 **Exception** 派生对象，还允许抛出非\
  \ **Exception** 派生对象。\n>\n> 许多程序员没有意识到 **CLR** 允许抛出任何对象来报告异常。大多数开发人员以为只有派生自 **Exception**\
  \ 的对象才能抛出。在 **CLR** 的 2.0 版本之前，程序员写 **catch** 块来捕捉异常时，只能捕捉 **CLS** 相容的异常。如果一个 **C#**方法调用了用另一种编程语言写的方法，而且那个方法抛出一个非\
  \ **CLS** 相容的异常，那么 **C#**代码根本不能捕捉这个异常，从而造成一些安全隐患。\n>\n> 在 **CLR** 的 2.0 版本中，**Microsoft**\
  \ 引入了新的 **RuntimeWrappedException** 类(在命名空间 **System.Runtime.CompilerServices**\
  \ 中定义)。该类派生自 **Exception**，所以它是一个 **CLS** 相容的异常类型。**RuntimeWrappedException** 类含有一个\
  \ **Object** 类型的私有字段（可通过 **RuntimeWrappedException** 类的只读属性 **WrappedException**\
  \ 来访问）。在 CLR 2.0 中，非 CLS 相容的一个异常被抛出时，CLR 会自动构造 RuntimeWrappedException 类的实例，并初始化该实例的私有字段，使之引用实际抛出的对象。这样\
  \ CLR 就将非 CLS 相容的异常转变成了 CLS 相容的异常。所以，任何能捕捉 Exception 类型的代码，现在都能捕捉非 CLS 相容的异常，从而消除了潜在的安全隐患。\n\
  \n虽然 C# 编译器只允许开发人员抛出派生自 Exception 的对象，但在 C# 的 2.0 版本之前，C# 编译器确实允许开发人员使用以下形式的代码捕捉非\
  \ CLS 相容的异常：\n\n```csharp\nprivate void SomeMethod() {\n    try {\n        // 需要得体地进行恢复和/或清理的代码放在这里\n\
  \    }\n    catch (Exception e) {\n        // C# 2.0 以前，这个块只能捕捉 CLS 相容的异常；\n   \
  \     // 而现在，这个块能捕捉 CLS 相容和不相容的异常\n        throw;  // 重新抛出捕捉到的任何东西\n    }\n    catch\
  \ {\n        // 在所有版本的 C# 中，这个块可以捕捉 CLS 相容和不相容的异常\n        throw;  // 重新抛出捕捉到的任何东西\n\
  \    }\n}\n```\n\n现在，一些开发人员注意到 CLR 同时支持相容和不相容于 CLS 的异常，他们可能像上面展示的那样写两个 catch 块来捕捉这两种异常。为\
  \ CLR 2.0 或更高版本重新编译上述代码，第二个 catch 块永远执行不到，C# 编译器显示以下警告消息：\n\nCS1058：上一个 catch 子句已捕获所有异常。引发的所有非异常①均被包装在\
  \ System.Runtime.CompilerServices.RuntimeWrappedException 中。\n\n开发人员有两个办法迁移 .NET\
  \ Framework 2.0 之前的代码。首先，两个 catch 块中的代码可以合并到一个 catch 块中，并删除其中的一个 catch 块。这是推荐的办法。另外，还可以向\
  \ CLR 说明程序集中的代码想按照旧的规则行事。也就是说，告诉 CLR 你的 catch (Exception) 块不应捕捉新的 RuntimeWrappedException\
  \ 类的一个实例。在这种情况下，CLR 不会将非 CLS 相容的对象包装到一个 RuntimeWrappedException 实例中，而且只有在你提供了一个没有指定任何类型的\
  \ catch 块时才调用你的代码。为了告诉 CLR 需要旧的行为，可向你的程序集应用 RuntimeCompatibilityAttribute 类的实例：\n\
  \n```csharp\nusing System.Runtime.CompilerServices;\n[assembly:RuntimeCompatibility(WrapNonExceptionThrows\
  \ = false)]\n```\n\n注意，该特性影响的是整个程序集。在同一个程序集中，包装和不包装异常这两种处理方式不能同时存在。向包含旧代码的程序集（假如\
  \ CLR 不支持在其中包装异常）添加新代码（希望 CLR 包装异常）时要特别小心。\n\n① “非异常”其实就是“非 System.Exception 派生的异常”。——译注\n\
  \n### 20.3 System.Exception 类\n\nCLR 允许异常抛出任何类型的实例——从 **Int32** 到 **String** 都可以。但是，Microsoft\
  \ 决定不强迫所有编程语言都抛出和捕捉任意类型的异常。因此，他们定义了 **System.Exception** 类型，并规定所有 **CLS** 相容的编程语言都必须能抛出和捕捉派生自该类型的异常。派生自\
  \ **System.Exception** 的异常类型被认为是 **CLS** 相容的。C#和其他许多语言的编译器都只允许抛出 **CLS** 相容的异常。\n\
  \n**System.Exception** 是一个很简单的类型，表 20-1 描述了它包含的属性。但一般不要写任何代码以任何方式查询或访问这些属性。相反，当应用程序因为未处理的异常而终止时，可以在调试器中查看这些属性，或者在\
  \ Windows 应用程序事件日志或崩溃转储(crash dump)中查看。\n\n**表 20-1 System.Exception 类型的公共属性**\n\
  \n| 属性名称 | 访问 | 类型 | 说明 |\n|---|---|---|---|\n| **Message** | 只读 | **String** |\
  \ 包含辅助性文字说明，指出抛出异常的原因。如果抛出的异常未处理，该消息通常被写入日志。由于最终用户一般不看这种消息，所以消息应提供尽可能多的技术细节，方便开发人员在生成新版本程序集时，利用消息所提供的信息来修正代码\
  \ |\n| **Data** | 只读 | **IDictionary** | 引用一个“键/值对”集合。通常，代码在抛出异常前在该集合中添加记录项；捕捉异常的代码可在异常恢复过程中查询记录项并利用其中的信息\
  \ |\n| **Source** | 读/写 | **String** | 包含生成异常的程序集的名称 |\n| **StackTrace** | 只读 |\
  \ **String** | 包含抛出异常之前调用过的所有方法的名称和签名，该属性对调试很有用 |\n| **TargetSite** | 只读 | **MethodBase**\
  \ | 包含抛出异常的方法 |\n| **HelpLink** | 只读 | **String** | 包含帮助用户理解异常的一个文档的 URL(例如 file://C:\\\
  \\MyApp\\\\Help.htm#MyExceptionHelp)。但要注意，健全的编程和安全实践阻止用户查看原始的未处理的异常。因此，除非希望将信息传达给其他程序员，否则不要使用该属性\
  \ |\n| **InnerException** | 只读 | **Exception** | 如果当前异常是在处理一个异常时抛出的，该属性就指出上一个异常是什么。这个只读属性通常为\
  \ null。**Exception** 类型还提供了公共方法 **GetBaseException** 来遍历由内层异常构成的链表，并返回最初抛出的异常 |\n\
  | **HResult** | 读/写 | **Int32** | 跨越托管和本机代码边界时使用的一个 32 位值。例如，当 COM API 返回代表失败的 **HRESULT**\
  \ 值时，CLR 抛出一个 **Exception** 派生对象，并通过该属性来维护 **HRESULT** 值 |\n\n这里有必要讲一下 **System.Exception**\
  \ 类型提供的只读 **StackTrace** 属性。**catch** 块可读取该属性来获取一个堆栈跟踪(stack trace)，它描述了异常发生前调用了哪些方法。检查异常原因并改正代码时，这些信息是很有用的。访问该属性实际会调用\
  \ CLR 中的代码；该属性并不是简单地返回一个字符串。构造 **Exception** 派生类型的新对象时，**StackTrace** 属性被初始化为 **null**。如果此时读取该属性，得到的不是堆栈跟踪，而是一个\
  \ **null**。\n\n一个异常抛出时，CLR 在内部记录 **throw** 指令的位置(抛出位置)。一个 **catch** 块捕捉到该异常时，CLR\
  \ 记录捕捉位置。在 **catch** 块内访问被抛出的异常对象的 **StackTrace** 属性，负责实现该属性的代码会调用 CLR 内部的代码，后者创建一个字符串来指出从异常抛出位置到异常捕捉位置的所有方法。\n\
  \n> **重要提示** 抛出异常时，CLR 会重置异常起点；也就是说，CLR 只记录最新的异常对象的抛出位置。\n\n以下代码抛出它捕捉到的相同的异常对象，导致\
  \ CLR 重置该异常的起点：\n\n```csharp\nprivate void SomeMethod() {\n    try { ... }\n   \
  \ catch (Exception e) {\n        ...\n        throw e;   // CLR 认为这是异常的起点，FxCop\
  \ 报错\n    }\n}\n```\n\n但如果仅仅使用 **throw** 关键字本身(删除后面的 e)来重新抛出异常对象，CLR 就不会重置堆栈的起点。以下代码重新抛出它捕捉到的异常，但不会导致\
  \ CLR 重置起点：\n\n```csharp\nprivate void SomeMethod() {\n    try { ... }\n    catch\
  \ (Exception e) {\n        ...\n        throw;  // 不影响 CLR 对异常起点的认知。FxCop 不再报错\n\
  \    }\n}\n```\n\n实际上，两段代码唯一的区别就是 CLR 对于异常起始抛出位置的认知。遗憾的是，不管抛出还是重新抛出异常，Windows 都会重置栈的起点。因此，如果一个异常成为未处理的异常，那么向\
  \ Windows Error Reporting 报告的栈位置就是最后一次抛出或重新抛出的位置(即使 CLR 知道异常的原始抛出位置)。之所以遗憾，是因为假如应用程序在现场那里失败，会使调试工作变得异常困难。有些开发人员无法忍受这一点，于是选择以一种不同的方式实现代码，确保堆栈跟踪能真正反映异常的原始抛出位置：\n\
  \n```csharp\nprivate void SomeMethod() {\n    Boolean trySucceeds = false;\n   \
  \ try {\n        ...\n        trySucceeds = true;\n    }\n    finally {\n      \
  \  if (!trySucceeds) { /*捕捉代码放到这里*/ }\n    }\n}\n```\n\n**StackTrace** 属性返回的字符串不包含调用栈中比接受异常对象的那个\
  \ **catch** 块高的任何方法<sup>①</sup>。要获得从线程起始处到异常处理程序(**catch** 块)之间的完整堆栈跟踪，需要使用 **System.Diagnostics.StackTrace**\
  \ 类型。该类型定义了一些属性和方法，允许开发人员程序化地处理堆栈跟踪以及构成堆栈跟踪的栈帧<sup>②</sup>。\n\n可用几个不同的构造器来构造一个 **StackTrace**\
  \ 对象。一些构造器构造从线程起始处到 **StackTrace** 对象的构造位置的栈帧。另一些使用作为参数传递的一个 **Exception** 派生对象来初始化栈帧。\n\
  \n如果 CLR 能找到你的程序集的调试符号(存储在.pdb 文件中)，那么在 **System.Exception** 的 **StackTrace** 属性或者\
  \ **System.Diagnostics.StackTrace** 的 **ToString** 方法返回的字符串中，将包括源代码文件路径和代码行号，这些信息对于调试是很有用的。\n\
  \n获得堆栈跟踪后，可能发现实际调用栈中的一些方法没有出现在堆栈跟踪字符串中。这可能有几方面的原因。首先，调用栈记录的是线程的返回位置(而非来源位置)。其次，JIT\
  \ 编译器可能进行了优化，将一些方法内联(inline)，以避免调用单独的方法并从中返回的开销。许多编译器(包括C#编译器)都支持/debug 命令行开关。使用这个开关，编译器会在生成的程序集中嵌入信息，告诉\
  \ JIT 编译器不要内联程序集的任何方法，确保调试人员获得更完整、更有意义的堆栈跟踪。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_425_0.png)\n\
  \n**注意** JIT 编译器会检查应用于程序集的 **System.Diagnostics.DebuggableAttribute** 定制特性。C#编译器会自动应用该特性。如果该特性指定了\
  \ **DisableOptimizations** 标志，JIT 编译器就不会对程序集的方法进行内联。使用 C#编译器的/debug 开关就会设置这个标志。另外，向方法应用定制特性\
  \ **System.Runtime.CompilerServices.MethodImplAttribute** 将禁止 JIT 编译器在调试和发布生成(debug\
  \ and release build)时对该方法进行内联处理，以下方法定义示范了如何禁止方法内联：\n\n```csharp\nusing System;\n\
  using System.Runtime.CompilerServices;\n\ninternal sealed class SomeType {\n\n \
  \   [MethodImpl(MethodImplOptions.NoInlining)]\n    public void SomeMethod() {\n\
  \        ...\n    }\n}\n```\n\n① 栈顶移动即“升高”，向栈底移动即“降低”。——译注\n\n② 栈帧(stack frame)代表当前线程的调用栈中的一个方法调用。执行线程的过程中进行的每个方法调用都会在调用栈中创建并压入一个\
  \ **StackFrame**。——译注\n\n### 20.4 FCL 定义的异常类\n\nFCL 定义了许多异常类型(它们最终都从 System.Exception\
