  \n除了调用 **Encoding** 的某个静态属性或者它的 **GetEncoding** 方法，还可构造以下某个类的实例：**System.Text.UnicodeEncoding**、**System.Text.UTF8Encoding**、**System.Text.UTF32Encoding**、**System.Text.UTF7Encoding**\
  \ 或者 **System.Text.ASCIIEncoding**。但要注意，构造任何这些类的实例都会在托管堆中创建新对象，对性能有损害。\n\n其中 4 个类(**UnicodeEncoding**、**UTF8Encoding**、**UTF32Encoding**\
  \ 和 **UTF7Encoding**)提供了多个构造器，允许对编码和前导码①进行更多的控制(前导码有时也称为“字节顺序标记”，即 Byte Order Mark\
  \ 或者 BOM)。在这 4 个类中，前 3 个类还提供了特殊的构造器，允许在对一个无效的字节序列进行解码的时候抛出异常。如果需要保证应用程序的安全性，防范无效的输入数据，就应当使用这些能抛出异常的类。\n\
