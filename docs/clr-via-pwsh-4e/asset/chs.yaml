- "## 第17章 委托\n\n**本章内容：**\n\n- 初识委托\n- 用委托回调静态方法\n- 用委托回调实例方法\n- 委托揭秘\n- 用委托回调许多方法(委托链)\n\
  - 委托定义不要太多(泛型委托)\n- C#为委托提供的简化语法\n- 委托和反射\n\n本章要讨论回调函数。回调函数是一种非常有用的编程机制，它的存在已经有很多年了。Microsoft\
  \ .NET Framework 通过委托来提供回调函数机制。不同于其他平台(比如非托管 C++)的回调机制，委托的功能要多得多。例如，委托确保回调方法是类型安全的(这是\
  \ CLR 最重要的目标之一)。委托还允许顺序调用多个方法，并支持调用静态方法和实例方法。\n\n### 17.1 初识委托\n\nC 运行时的 qsort 函数获取指向一个回调函数的指针，以便对数组中的元素进行排序。在\
  \ Microsoft Windows 中，窗口过程、钩子过程和异步过程调用等都需要回调函数。在 .NET Framework 中，回调方法的应用更是广泛。例如，可以登记回调方法来获得各种各样的通知，例如未处理的异常、窗口状态变化、菜单项选择、文件系统变化、窗体控件事件和异步操作已完成等。\n\
  \n在非托管 C/C++中，非成员函数的地址只是一个内存地址。这个地址不携带任何额外的信息，比如函数期望收到的参数个数、参数类型、函数返回值类型以及函数的调用协定。简单地说，非托管\
  \ C/C++回调函数不是类型安全的(不过它们确实是一种非常轻量级的机制)。\n\n.NET Framework 的回调函数和非托管 Windows 编程环境的回调函数一样有用，一样普遍。但是，.NET\
  \ Framework 提供了称为委托的类型安全机制。为了理解委托，先来看看如何使用它。以下代码①演示了如何声明、创建和使用委托：\n\n```csharp\n\
  using System;\nusing System.Windows.Forms;\nusing System.IO;\n\n// 声明一个委托类型，它的实例引用一个方法。\n\
  // 该方法获取一个 Int32 参数，返回 void\ninternal delegate void Feedback(Int32 value);\n\npublic\
  \ sealed class Program {\n    public static void Main() {\n        StaticDelegateDemo();\n\
  \        InstanceDelegateDemo();\n        ChainDelegateDemo1(new Program());\n \
  \       ChainDelegateDemo2(new Program());\n    }\n\n    private static void StaticDelegateDemo()\
  \ {\n        Console.WriteLine(\"----- Static Delegate Demo -----\");\n        Counter(1,\
  \ 3, null);\n        Counter(1, 3, new Feedback(Program.FeedbackToConsole));\n \
  \       Counter(1, 3, new Feedback(FeedbackToMsgBox));  // 前缀\"Program.\"可选\n  \
  \      Console.WriteLine();\n    }\n\n    private static void InstanceDelegateDemo()\
  \ {\n        Console.WriteLine(\"----- Instance Delegate Demo -----\");\n      \
  \  Program p = new Program();\n        Counter(1, 3, new Feedback(p.FeedbackToFile));\n\
  \        Console.WriteLine();\n    }\n\n    private static void ChainDelegateDemo1(Program\
  \ p) {\n        Console.WriteLine(\"----- Chain Delegate Demo 1 -----\");\n    \
  \    Feedback fb1 = new Feedback(FeedbackToConsole);\n        Feedback fb2 = new\
  \ Feedback(FeedbackToMsgBox);\n        Feedback fb3 = new Feedback(p.FeedbackToFile);\n\
  \n        Feedback fbChain = null;\n        fbChain = (Feedback) Delegate.Combine(fbChain,\
  \ fb1);\n        fbChain = (Feedback) Delegate.Combine(fbChain, fb2);\n        fbChain\
  \ = (Feedback) Delegate.Combine(fbChain, fb3);\n        Counter(1, 2, fbChain);\n\
  \n        Console.WriteLine();\n        fbChain = (Feedback)\n            Delegate.Remove(fbChain,\
  \ new Feedback(FeedbackToMsgBox));\n        Counter(1, 2, fbChain);\n    }\n\n \
  \   private static void ChainDelegateDemo2(Program p) {\n        Console.WriteLine(\"\
  ----- Chain Delegate Demo 2 -----\");\n        Feedback fb1 = new Feedback(FeedbackToConsole);\n\
  \        Feedback fb2 = new Feedback(FeedbackToMsgBox);\n        Feedback fb3 =\
  \ new Feedback(p.FeedbackToFile);\n\n        Feedback fbChain = null;\n        fbChain\
  \ += fb1;\n        fbChain += fb2;\n        fbChain += fb3;\n        Counter(1,\
  \ 2, fbChain);\n\n        Console.WriteLine();\n        fbChain -= new Feedback(FeedbackToMsgBox);\n\
  \        Counter(1, 2, fbChain);\n    }\n\n    private static void Counter(Int32\
  \ from, Int32 to, Feedback fb) {\n        for (Int32 val = from; val <= to; val++)\
  \ {\n            // 如果指定了任何回调，就调用它们\n            if (fb != null)\n             \
  \   fb(val);\n        }\n    }\n\n    private static void FeedbackToConsole(Int32\
  \ value) {\n        Console.WriteLine(\"Item=\" + value);\n    }\n\n    private\
  \ static void FeedbackToMsgBox(Int32 value) {\n        MessageBox.Show(\"Item=\"\
  \ + value);\n    }\n\n    private void FeedbackToFile(Int32 value) {\n        using\
  \ (StreamWriter sw = new StreamWriter(\"Status\", true)) {\n            sw.WriteLine(\"\
  Item=\" + value);\n        }\n    }\n}\n```\n\n> ① 这个程序最好不要通过在 Visual Studio 中新建“Windows\
  \ 窗体应用程序”项目来生成。用文本编辑器输入代码，另存为 name.cs。启动“VS2013 开发人员命令提示”，输入 csc name.cs 生成，输入 name\
  \ 执行。这样可同时看到控制台和消息框的输出。——译注\n\n下面来看看代码做的事情。在顶部，注意看 **internal** 委托 **Feedback**\
  \ 的声明。委托要指定一个回调方法签名。在本例中，**Feedback** 委托指定的方法要获取一个 **Int32** 参数，返回 **void**。在某种程度上，委托和非托管\
  \ C/C++中代表函数地址的 **typedef** 很相似。\n\n**Program** 类定义了私有静态方法 **Counter**，它从整数 **from**\
  \ 计数到整数 **to**。方法的 **fb** 参数代表 **Feedback** 委托对象引用。方法遍历所有整数。对于每个整数，如果 **fb** 变量不为\
  \ **null**，就调用由 **fb** 变量指定的回调方法。传入这个回调方法的是正在处理的那个数据项的值，也就是数据项的编号。设计和实现回调方法时，可选择任何恰当的方式处理数据项。\n\
  \n### 17.2 用委托回调静态方法\n\n理解 **Counter** 方法的设计及其工作方式之后，再来看看如何利用委托回调静态方法。本节重点是上一节示例代码中的\
  \ **StaticDelegateDemo** 方法。\n\n在 **StaticDelegateDemo** 方法中第一次调用 **Counter** 方法时，为第三个参数(对应于\
  \ **Counter** 的 **fb** 参数)传递的是 **null**。由于 **Counter** 的 **fb** 参数收到的是 **null**，所以处理每个数据项时都不调用回调方法。\n\
  \n**StaticDelegateDemo** 方法再次调用 **Counter**，为第三个参数传递新构造的 **Feedback** 委托对象。委托对象是方法的包装器(wrapper)，使方法能通过包装器来间接回调。在本例中，静态方法的完整名称\
  \ **Program.FeedbackToConsole** 被传给 **Feedback** 委托类型的构造器，这就是要包装的方法。**new** 操作符返回的引用作为\
  \ **Counter** 的第三个参数来传递。现在，当 Counter 执行时，会为序列中的每个数据项调用 Program 类型的静态方法 FeedbackToConsole。FeedbackToConsole\
  \ 方法本身的作用很简单，就是向控制台写一个字符串，显示正在进行处理的数据项。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_364_0.png)\n\
  \n> **注意**　FeedbackToConsole 方法被定义成 Program 类型内部的私有方法，但 Counter 方法能调用 Program 的私有方法。这明显没有问题，因为\
  \ Counter 和 FeedbackToConsole 在同一个类中定义。但即使 Counter 方法在另一个类型中定义，也不会出问题！简单地说，在一个类中通过委托来调用另一个类型的私有成员，只要委托对象是由具有足够安全性/可访问性的代码创建的，便没有问题。\n\
  \n在 StaticDelegateDemo 方法中，对 Counter 方法的第三个调用和第二个调用几乎完全一致。唯一的区别在于 Feedback 委托对象包装的是静态方法\
  \ Program.FeedbackToMsgBox。FeedbackToMsgBox 构造一个字符串来指出正在处理的数据项，然后在消息框中显示该字符串。\n\n\
  这个例子中的所有操作都是类型安全的。例如，在构造 Feedback 委托对象时，编译器确保 Program 的 FeedbackToConsole 和 FeedbackToMsgBox\
  \ 方法的签名兼容于 Feedback 委托定义的签名。具体地说，两个方法都要获取一个参数(一个 Int32)，而且两者都要有相同的返回类型(void)。将 FeedbackToConsole\
  \ 的定义改为下面这样：\n\n```csharp\nprivate static Boolean FeedbackToConsole(String value)\
  \ {\n    ...\n}\n```\n\nC# 编译器将不会编译以上代码，并报告以下错误：error CS0123: \"FeedbackToConsole\"\
  的重载均与委托\"Feedback\"不匹配。\n\n将方法绑定到委托时，C# 和 CLR 都允许引用类型的协变性(covariance)和逆变性(contravariance)。协变性是指方法能返回从委托的返回类型派生的一个类型。逆变性是指方法获取的参数可以是委托的参数类型的基类。例如下面这个委托：\n\
  \n```csharp\ndelegate Object MyCallback(FileStream s);\n```\n\n完全可以构造该委托类型的一个实例并绑定具有以下原型的方法：\n\
  \n```csharp\nString SomeMethod(Stream s);\n```\n\n在这里，SomeMethod 的返回类型(String)派生自委托的返回类型(Object)；这种协变性是允许的。SomeMethod\
  \ 的参数类型(Stream)是委托的参数类型(FileStream)的基类；这种逆变性是允许的。\n\n注意，只有引用类型才支持协变性与逆变性，值类型或 void\
  \ 不支持。所以，不能把下面的方法绑定到 MyCallback 委托：\n\n```csharp\nInt32 SomeOtherMethod(Stream s);\n\
  ```\n\n虽然 SomeOtherMethod 的返回类型(Int32)派生自 MyCallback 的返回类型(Object)，但这种形式的协变性是不允许的，因为\
  \ Int32 是值类型。显然，值类型和 void 之所以不支持，是因为它们的存储结构是变化的，而引用类型的存储结构始终是一个指针。幸好，试图执行不支持的操作，C#\
  \ 编译器会报错。\n\n### 17.3 用委托回调实例方法\n\n委托除了能调用静态方法，还能为具体的对象调用实例方法。为了理解如何回调实例方法，先来看看\
  \ 17.1 节的示例代码中的 InstanceDelegateDemo 方法。\n\n注意 InstanceDelegateDemo 方法构造了名为 p 的\
  \ Program 对象。这个 Program 对象没有定义任何实例字段或属性；创建它纯粹是为了演示。在 Counter 方法调用中构造新的 Feedback\
  \ 委托对象时，向 Feedback 委托类型的构造函数传递的是 p.FeedbackToFile。这导致委托包装对 FeedbackToFile 方法的引用，这是一个实例方法(而不是静态方法)。当\
