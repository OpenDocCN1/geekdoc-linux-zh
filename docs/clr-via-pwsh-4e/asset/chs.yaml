- "## 第4章 类型基础\n\n**本章内容：**\n\n- 所有类型都从 System.Object 派生\n- 类型转换\n- 命名空间和程序集\n- 运行时的相互关系\n\
  \n本章讲述使用类型和 CLR 时需掌握的基础知识。具体地说，要讨论所有类型都具有的一组基本行为。还将讨论类型安全性、命名空间、程序集以及如何将对象从一种类型转换成另一种类型。本章最后会解释类型、对象、线程栈和托管堆在运行时的相互关系。\n\
  \n### 4.1 所有类型都从 System.Object 派生\n\n“运行时”要求每个类型最终都从 **System.Object** 类型派生。也就是说，以下两个类型定义完全一致：\n\
  \n```csharp\n// 隐式派生自 Object\nclass Employee {\n    ...\n}\n\n// 显式派生自 Object\n\
  class Employee : System.Object {\n    ...\n}\n```\n\n由于所有类型最终都从 **System.Object**\
  \ 派生，所以每个类型的每个对象都保证了一组最基本的方法。具体地说，**System.Object** 类提供了如表 4-1 所示的公共实例方法。\n\n表 4-1\
  \ System.Object 的公共方法\n\n| 公共方法 | 说明 |\n| --- | --- |\n| **Equals** | 如果两个对象具有相同的值，就返回\
  \ **true**。欲知该方法的详情，请参见 5.3.2 节“对象相等性和同一性” |\n| **GetHashCode** | 返回对象的值的哈希码。如果某个类型的对象要在哈希表集合(比如\
  \ **Dictionary**)中作为键使用，类型应重写该方法。方法应该为不同对象提供良好分布。将这个方法设计到 **Object** 中并不恰当。大多数类型永远不会在哈希表中作为键使用；该方法本该在接口中定义。欲知该方法的详情，请参见\
  \ 5.4 节“对象哈希码” |\n| ToString | 默认返回类型的完整名称（this.GetType().FullName）。但经常重写该方法来返回包含对象状态表示的\
  \ String 对象。例如，核心类型（如 Boolean 和 Int32）重写该方法来返回它们的值的字符串表示。另外，经常出于调试的目的而重写该方法；调用后获得一个字符串，显示对象各字段的值。事实上，Microsoft\
  \ Visual Studio 的调试器会自动调用该函数来显示对象的字符串表示。注意，ToString 理论上应该与调用线程关联的 CultureInfo 并采取相应行动。第\
  \ 14 章“字符、字符串和文本处理”将更详细地讨论 ToString。 |\n| GetType | 返回从 Type 派生的一个类型的实例，指出调用 GetType\
  \ 的那个对象是什么类型。返回的 Type 对象可以和反射类配合，获取与对象的类型有关的元数据信息。反射将在第 23 章“程序集加载和反射”讨论。GetType\
  \ 是非虚方法，目的是防止类重写该方法，隐瞒其类型，进而破坏类型安全性。 |\n\n① 所谓“良好分布”，是指针对所有输入，GetHashCode 生成的哈希值应该在所有整数中产生一个随机的分布。——译注\n\
  \n此外，从 System.Object 派生的类型能访问如表 4-2 所示的受保护方法。\n\n表 4-2 System.Object 的受保护方法\n\n\
  | 受保护方法 | 说明 |\n| --- | --- |\n| MemberwiseClone | 这个非虚方法创建类型的新实例，并将新对象的实例字段设置与\
  \ this 对象的实例字段完全一致。返回对新实例的引用。 |\n| Finalize | 在垃圾回收器判断对象应该作为垃圾被回收之后，在对象的内存被实际回收之前，会调用这个虚方法。需要在回收内存前执行清理工作的类型应重写该方法。第\
  \ 21 章“托管堆和垃圾回收”会更详细地讨论这个重要的方法。 |\n\nCLR 要求所有对象都用 new 操作符创建。以下代码展示了如何创建一个 Employee\
  \ 对象：\n\n```\nEmployee e = new Employee(\"ConstructorParam1\");\n```\n\n以下是 new\
  \ 操作符所做的事情。\n\n- 1. 计算类型及其所有基类型（一直到 System.Object，虽然它没有定义自己的实例字段）中定义的所有实例字段需要的字节数。堆上每个对象都需要一些额外的成员，包括“类型对象指针”（type\
  \ object pointer）和“同步块索引”（sync block index）。CLR 利用这些成员管理对象。额外成员的字节数要计入对象大小。\n- 2.\
  \ 从托管堆中分配类型要求的字节数，从而分配对象的内存，分配的所有字节都设为零(0)。\n- 3. 初始化对象的“类型对象指针”和“同步块索引”成员。\n- 4.\
  \ 调用类型的实例构造器，传递在 `new` 调用中指定的实参（上例就是字符串 `\"ConstructorParam1\"`）。大多数编译器都在构造器中自动生成代码来调用基类构造器。每个类型的构造器都负责初始化该类型定义的实例字段。最终调用\
  \ `System.Object` 的构造器，该构造器什么都不做，简单地返回。\n\n① 作者在这段话里引用了两种不同的“实例”。一种是类的实例，也就是对象；另一种是类中定义的实例字段。所谓“实例字段”，就是指非静态字段，有时也称为“实例成员”。简单地说，实例成员属于类的对象，静态成员属于类。——译注\n\
  \n② 称为 overhead 成员，或者说“开销成员”。——译注\n\n`new` 执行了所有这些操作之后，返回指向新建对象的一个引用（或指针）。在前面的示例代码中，该引用保存到变量\
  \ `e` 中，后者具有 `Employee` 类型。\n\n顺便说一句，没有和 `new` 操作符对应的 `delete` 操作符；换言之，没有办法显式释放为对象分配的内存。CLR\
  \ 采用了垃圾回收机制（详情在第 21 章讲述），能自动检测到一个对象不再被使用或访问，并自动释放对象的内存。\n\n### 4.2 类型转换\n\nCLR 最重要的特性之一就是类型安全。在运行时，CLR\
  \ 总是知道对象的类型是什么。调用 `GetType` 方法即可知道对象的确切类型。由于它是非虚方法，所以一个类型不可能伪装成另一个类型。例如，`Employee`\
  \ 类型不能重写 `GetType` 方法并返回一个 `SuperHero` 类型。\n\n开发人员经常需要将对象从一种类型转换为另一种类型。CLR 允许将对象转换为它的（实际）类型或者它的任何基类型。每种编程语言都规定了开发人员具体如何进行这种转型操作。例如，C#不要求任何特殊语法即可将对象转换为它的任何基类型，因为向基类型的转换被认为是一种安全的隐式转换。然而，将对象转换为它的某个派生类型时，C#要求开发人员只能进行显式转换，因为这种转换可能在运行时失败。以下代码演示了向基类型和派生类型的转换：\n\
  \n```csharp\n// 该类型隐式派生自 System.Object\ninternal class Employee {\n    ...\n}\n\n\
  public sealed class Program {\n    public static void Main() {\n        // 不需要转型，因为\
  \ new 返回一个 Employee 对象。\n        // 而 Object 是 Employee 的基类型\n        Object o =\
  \ new Employee();\n\n        // 需要转型，因为 Employee 派生自 Object。\n        // 其他语言（比如\
  \ Visual Basic）也许不要求像\n        // 这样进行强制类型转换\n        Employee e = (Employee) o;\n\
  \    }\n}\n```\n\n这个例子展示了你需要做什么，才能让编译器顺利编译这些代码。接着，让我们看看运行时发生的事情。在运行时，CLR 检查转型操作，确定是否转换为对象的实际类型或者它的任何基类型。例如，以下代码虽然能通过编译，但会在运行时抛出\
  \ `InvalidCastException` 异常：\n\n```csharp\ninternal class Employee {\n    ...\n\
  }\ninternal class Manager : Employee {\n    ...\n}\n\npublic sealed class Program\
  \ {\n    public static void Main() {\n        // 构造一个 Manager 对象，把它传给 PromoteEmployee。\n\
  \        // Manager “属于” (IS-A) Employee，所以 PromoteEmployee 能成功运行\n        Manager\
  \ m = new Manager();\n        PromoteEmployee(m);\n\n        // 构造一个 DateTime 对象，把它传给\
  \ PromoteEmployee。\n        // DateTime 不是从 Employee 派生的，所以 PromoteEmployee\n  \
  \      // 抛出 System.InvalidCastException 异常\n        DateTime newYears = new DateTime(2010,\
  \ 1, 1);\n        PromoteEmployee(newYears);\n    }\n\n    public static void PromoteEmployee(Object\
  \ o) {\n        // 编译器在编译时无法准确地获知对象 o\n        // 引用的是什么类型，因此编译器允许代码\n        //\
  \ 通过编译。但在运行时，CLR 知道了 o 引用\n        // 的是什么类型（在每次执行转型的时候），\n        // 所以它会核实对象的类型是不是\
  \ Employee 或者\n        // 从 Employee 派生的任何类型\n        Employee e = (Employee) o;\n\
  \        ...\n    }\n}\n```\n\n**Main** 构造一个 **Manager** 对象并将其传给 **PromoteEmployee**。这些代码能成功编译并运行，因为\
  \ **Manager** 最终从 **Object** 派生，而 **PromoteEmployee** 期待的正是一个 **Object**。进入 **PromoteEmployee**\
  \ 内部之后，CLR 核实对象 **o** 引用的就是一个 **Employee** 对象，或者是从 **Employee** 派生的一个类型的对象。由于 **Manager**\
  \ 从 **Employee** 派生，所以 CLR 执行类型转换，允许 **PromoteEmployee** 继续执行。\n\n**PromoteEmployee**\
  \ 返回后，**Main** 构造一个 **DateTime** 对象，将其传给 **PromoteEmployee**。同样地，**DateTime** 从\
  \ **Object** 派生，所以编译器会顺利编译调用 **PromoteEmployee** 的代码。但进入 **PromoteEmployee** 内部之后，CLR\
  \ 会检查类型转换，发现 **o** 引用一个 **DateTime**，既不是 **Employee**，也不是从 **Employee** 派生的任何类型。此时\
  \ CLR 会禁止转型，并抛出 **System.InvalidCastException** 异常。\n\n如果 CLR 允许这样的转型，就毫无类型安全性可言了，将出现难以预料的结果——包括应用程序崩溃，以及安全漏洞的出现（因为一种类型能轻松地伪装成另一种类型）。类型伪装是许多安全漏洞的根源，它还会破坏应用程序的稳定性和健壮性。因此，类型安全是\
  \ CLR 极其重要的一个特点。\n\n顺便说一句，声明 **PromoteEmployee** 方法的正确方式是将参数类型指定为 **Employee**，而非指定为\
  \ **Object**。如果这样修改，该例编译时就能报错，而非等到运行时才报错。我之所以使用 **Object**，是为了演示 C# 编译器和 CLR 如何处理类型转换和类型安全性。\n\
  \n#### 使用 C# 的 is 和 as 操作符来转型\n\n在 C# 语言中进行类型转换的另一种方式是使用 is 操作符。is 检查对象是否兼容于指定类型，返回\
  \ Boolean 值 true 或 false。注意，is 操作符永远不抛出异常，例如以下代码：\n\n```csharp\nObject o = new Object();\n\
  Boolean b1 = (o is Object);      // b1 为 true.\nBoolean b2 = (o is Employee);  \
  \  // b2 为 false.\n```\n\n如果对对象引用 null，is 操作符总是返回 false，因为没有可检查其类型的对象。\n\n**is**\
  \ 操作符通常像下面这样使用：\n\n```csharp\nif (o is Employee) {\n    Employee e = (Employee)\
  \ o;\n    // 在 if 语句剩余的部分中使用 e\n}\n```\n\n在上述代码中，CLR 实际检查两次对象类型。**is** 操作符首先核实 **o**\
  \ 是否兼容于 **Employee** 类型。如果是，在 **if** 语句内部转型时，CLR 再次核实 **o** 是否引用一个 **Employee**。CLR\
  \ 的类型检查增强了安全性，但无疑会对性能造成一定影响。这是因为 CLR 首先必须判断变量 **(o)** 引用的对象的实际类型。然后，CLR 必须遍历继承层次结构，用每个基类型去核对指定的类型（**Employee**）。由于这是一个相当常用的编程模式，所以\
  \ C# 专门提供了 **as** 操作符，目的就是简化这种代码的写法，同时提升其性能。\n\n```csharp\nEmployee e = o as Employee;\n\
  if (e != null) {\n    // 在 if 语句中使用 e\n}\n```\n\n在这段代码中，CLR 核实 **o** 是否兼容于 **Employee**\
  \ 类型；如果是，**as** 返回对同一个对象的非 **null** 引用。如果 **o** 不兼容于 **Employee** 类型，**as** 返回 **null**。注意，**as**\
  \ 操作符使 CLR 只检验一次对象类型。**if** 语句只检查 **e** 是否为 **null**；这个检查的速度比检验对象的类型快得多。\n\n**as**\
  \ 操作符的工作方式与强制类型转换一样，只是它永远不抛出异常——相反，如果对象不能转型，结果就是 **null**。所以，正确做法是检查最终生成的引用是否为 **null**。企图直接使用最终生成的引用会抛出\
  \ **System.NullReferenceException** 异常。以下代码对此进行了演示：\n\n```csharp\nObject o = new\
  \ Object();       // 新建 Object 对象\nEmployee e = o as Employee;    // 将 o 转型为 Employee\n\
  // 上述转型会失败，不抛出异常，但 e 被设为 null\n\ne.ToString(); // 访问 e 抛出 NullReferenceException\
  \ 异常\n```\n\n为了确定自己理解了上述内容，请完成以下小测验。假定以下两个类定义确实存在：\n\n```csharp\ninternal class\
  \ B {        // 基类(Base class)\n}\n```\n\n```csharp\ninternal class D : B {    //\
  \ 派生类(Derived class)\n}\n```\n\n现在检查表 4-3 列出的 C# 代码。针对每一行代码，都用勾号注明该行代码是将成功编译和执行(OK)，将造成编译时错误(CTE)，还是将造成运行时错误(RTE)。\n\
  \n**表 4-3　类型安全性测验**\n\n| 语句 | OK | CTE(编译时错误) | RTE(运行时错误) |\n| --- | ---: | ---:\
  \ | ---: |\n| `Object o1 = new Object();` | ✓ |  |  |\n| `Object o2 = new B();`\
  \ | ✓ |  |  |\n| `Object o3 = new D();` | ✓ |  |  |\n| `Object o4 = o3;` | ✓ | \
  \ |  |\n| `B b1 = new B();` | ✓ |  |  |\n| `B b2 = new D();` | ✓ |  |  |\n| `D d1\
  \ = new D();` | ✓ |  |  |\n| `B b3 = new Object();` |  | ✓ |  |\n| `D d2 = new Object();`\
  \ |  | ✓ |  |\n| `B b4 = d1;` | ✓ |  |  |\n| `D d3 = b2;` |  | ✓ |  |\n| `D d4 =\
  \ (D) d1;` | ✓ |  |  |\n| `D d5 = (D) b2;` | ✓ |  |  |\n| `D d6 = (D) b1;` |  |\
  \  | ✓ |\n| `B b5 = (B) o1;` |  |  | ✓ |\n| `B b6 = (D) b2;` | ✓ |  |  |\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_102_0.png)\n\
  \n> **注意**　C# 允许类型定义转换操作符方法，详情参见 8.5 节“转换操作符方法”。只有在使用转型表达式时才调用这些方法；使用 C# `as` 或\
  \ `is` 操作符时永远不调用它们。\n\n### 4.3　命名空间和程序集\n\n命名空间对相关的类型进行逻辑分组，开发人员可通过命名空间方便地定位类型。例如，**System.Text**\
  \ 命名空间定义了执行字符串处理的类型，而 **System.IO** 命名空间定义了执行 I/O 操作的类型。以下代码构造一个 **System.IO.FileStream**\
  \ 对象和一个 **System.Text.StringBuilder** 对象：\n\n```csharp\npublic sealed class Program\
  \ {\n    public static void Main() {\n        System.IO.FileStream fs = new System.IO.FileStream(...);\n\
  \        System.Text.StringBuilder sb = new System.Text.StringBuilder();\n    }\n\
  }\n```\n\n像这样写代码很繁琐，应该有一种简单方式直接引用 **FileStream** 和 **StringBuilder** 类型，减少打字量。幸好，许多编译器都提供了某种机制让程序员少打一些字。C#\
  \ 编译器通过 **using** 指令提供这个机制。以下代码和前面的例子完全一致：\n\n```csharp\nusing System.IO;      //\
  \ 尝试附加“System.IO.”前缀\nusing System.Text;    // 尝试附加“System.Text.”前缀\n\npublic sealed\
  \ class Program {\n    public static void Main() {\n        FileStream fs = new\
  \ FileStream(...);\n        StringBuilder sb = new StringBuilder();\n    }\n}\n\
  ```\n\n对于编译器，命名空间的作用就是为类型名称附加以句点分隔的符号，使名称变得更长，更可能具有唯一性。所以在本例中，编译器将对 **FileStream**\
  \ 的引用解析为 **System.IO.FileStream**，将对 **StringBuilder** 的引用解析为 **System.Text.StringBuilder**。\n\
  \nC# 的 **using** 指令是可选的，如果愿意，完全可以输入类型的完全限定名称。C# 的 **using** 指令指示编译器尝试为类型名称附加不同的前缀，直至找到匹配项。\n\
  \n> **重要提示**　CLR 对“命名空间”一无所知。访问类型时，CLR 需要知道类型的完整名称（可能是相当长的、包含句点符号的名称）以及该类型的定义具体在哪个程序集。这样“运行时”才能加载正确程序集，找到目标类型，并对其进行操作。\n\
  \n在前面的示例代码中，编译器需要保证引用的每个类型都确实存在，而且代码以正确方式使用类型——也就是调用确实存在的方法，向方法传递正确数量的实参，保证实参具有正确类型，正确使用方法返回值，等等。如果编译器在源代码文件或者引用的任何程序集找不到具有指定名称的类型，就会在类型名称前附加\
  \ **System.IO.** 前缀，检查这样生成的名称是否与现有类型匹配。如果仍然找不到匹配项，就继续为类型名称附加 **System.Text.** 前缀。在前面例子中的两个\
  \ **using** 指令的帮助下，只需在代码中输入 **FileStream** 和 **StringBuilder** 这两个简化的类型名称，编译器就会自动将引用展开成\
  \ **System.IO.FileStream** 和 **System.Text.StringBuilder**。这样不仅能极大减少打字，还增强了代码可读性。\n\
  \n检查类型定义时，编译器必须知道要在什么程序集中检查。第 2 章和第 3 章讲过，这通过 **/reference** 编译器开关实现。编译器扫描引用的所有程序集，在其中查找类型定义。一旦找到正确的程序集，程序集信息和类型信息就嵌入生成的托管模块的元数据中。为了获取程序集信息，必须将定义了被引用类型的程序集传给编译器。C#\
  \ 编译器自动在 MSCorLib.dll 程序集中查找被引用类型，即使没有显式告诉它这样做。MSCorLib.dll 程序集包含所有核心 Framework\
  \ 类库（FCL）类型（如 **Object、Int32、String** 等）的定义。\n\n编译器对待命名空间的方式存在潜在问题：可能两个（或更多）类型在不同命名空间中同名。Microsoft\
  \ 强烈建议开发人员为类型定义具有唯一性的名称。但有时并非不为也，是不能也。“运行时”鼓励组件重用。例如，应用程序可能同时利用了 Microsoft 和 Wintellect\
  \ 创建的组件。假定两家公司都提供名为 **Widget** 的类型，两个类型做的事情完全不同。由于干涉不了类型命名，所以引用时用完全限定名称区分它们。用 **Microsoft.Widget**\
  \ 引用 Microsoft 的 Widget，用 **Wintellect.Widget** 引用 Wintellect 的 Widget。以下代码对 Widget\
  \ 的引用会产生歧义，C# 编译器报告错误消息：**CS0104：“Widget”是“Microsoft.Widget”和“Wintellect.Widget”之间的不明确的引用。**\n\
  \n```csharp\nusing Microsoft;       // 尝试附加“Microsoft.”前缀\nusing Wintellect;   \
  \   // 尝试附加“Wintellect.”前缀\n\npublic sealed class Program {\n    public static void\
  \ Main() {\n        Widget w = new Widget();  // 不明确的引用\n    }\n}\n```\n\n为了消除歧义，必须像下面这样显式告诉编译器要创建哪个\
  \ Widget。\n\n```csharp\nusing Microsoft;        // 尝试附加“Microsoft.”前缀\nusing Wintellect;\
  \       // 尝试附加“Wintellect.”前缀\n\npublic sealed class Program {\n    public static\
  \ void Main() {\n        Wintellect.Widget w = new Wintellect.Widget(); // 无歧义\n\
  \    }\n}\n```\n\nC# using 指令的另一种形式允许为类型或命名空间创建别名。如果只想使用命名空间中的少量类型，不想它的所有类型都跑出来“污染”全局命名空间，别名就显得十分方便。以下代码演示了如何用另一个办法解决前例的歧义性问题：\n\
  \n```csharp\nusing Microsoft;             // 尝试附加“Microsoft.”前缀\nusing Wintellect;\
  \            // 尝试附加“Wintellect.”前缀\n\n// 将 WintellectWidget 符号定义成 Wintellect.Widget\
  \ 的别名\nusing WintellectWidget = Wintellect.Widget;\n\npublic sealed class Program\
  \ {\n    public static void Main() {\n        WintellectWidget w = new WintellectWidget();\
  \ // 现在没错误了\n    }\n}\n```\n\n这些消除类型歧义性的方法都十分有用，但有时还需要进一步。假定 Australian Boomerang\
  \ Company(澳大利亚回旋镖公司，ABC)和 Alaskan Boat Corporation(阿拉斯加船业公司，ABC)都创建了名为 BuyProduct\
  \ 的类型。该类型随同两家公司的程序集发布。两家公司都创建了名为 ABC 的命名空间，其中都包含名为 BuyProduct 的类型。任何人要开发应用程序来同时购买这两家公司出售的回旋镖和船都会遇到麻烦——除非编程语言提供了某种方式，能通过编程来区分程序集而非仅仅区分命名空间。幸好，C#\
  \ 编译器提供了名为外部别名(extern alias)的功能，它解决了这个虽然极其罕见但仍有可能发生的问题。外部别名还允许从同一个程序集的两个(或更多)不同的版本中访问同一个类型。欲知外部别名的详情，请参见\
  \ C# 语言规范。\n\n要在库中设计由第三方使用的类型，应该在专门的命名空间中定义这些类型。这样编译器就能轻松消除它们的歧义。事实上，为了降低发生冲突的概率，应该使用自己的完整公司名称(而不是首字母缩写或者其他简称)来作为自己的顶级命名空间名称。参考文档，可以看到\
  \ Microsoft 为自己的类型使用了命名空间“Microsoft”，比如 Microsoft.CSharp、Microsoft.VisualBasic 和\
  \ Microsoft.Win32。\n\n创建命名空间很简单，像下面这样写一个命名空间声明就可以了（以 C# 为例）：\n\n```csharp\nnamespace\
  \ CompanyName {\n    public sealed class A {              // TypeDef: CompanyName.A\n\
  \    }\n}\n```\n\n\n\n```csharp\nnamespace X {\n    public sealed class B { ...\
  \ }    // TypeDef: CompanyName.X.B\n}\n```\n\n类定义右侧的注释指出编译器在类型定义元数据表中添加的实际类型名称；这是\
  \ CLR 看到的实际类型名称。\n\n一些编译器根本不支持命名空间，还有一些编译器允许自定义“命名空间”对于语言的含义。在 C# 中，**namespace**\
  \ 指令的作用只是告诉编译器为源代码中出现的每个类型名称附加命名空间名称前缀，让程序员少打一些字。\n\n#### 命名空间和程序集的关系\n\n> 注意，命名空间和程序集（实现类型的文件）不一定相关。特别是，同一个命名空间中的类型可能在不同程序集中实现。例如，**System.IO.FileStream**\
  \ 类型在 MSCorLib.dll 程序集中实现，而 **System.IO.FileSystemWatcher** 类型在 System.dll 程序集中实现。\n\
  >\n> 同一个程序集也可能包含不同命名空间中的类型。例如，**System.Int32** 和 **System.Text.StringBuilder** 类型都在\
  \ MSCorLib.dll 程序集中。\n>\n> 在文档中查找类型时，文档会明确指出类型所属的命名空间，以及实现了该类型的程序集。如图 4-1 所示，可以清楚地看到（在“语法”小节的上方），**ResXFileRef**\
  \ 类型是 **System.Resources** 命名空间的一部分，在 **System.Windows.Forms.dll** 程序集中实现。为了编译引用了\
  \ **ResXFileRef** 类型的代码，需要在代码中添加 `using System.Resources;` 指令，而且要使用 `/r:System.Windows.Forms.dll`\
  \ 编译器开关。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_105_0.png)\n\n图 4-1　文档显示了类型的命名空间和程序集信息\n\
  \n### 4.4 运行时的相互关系\n\n本节将解释类型、对象、线程栈和托管堆在运行时的相互关系。此外，还将解释调用静态方法、实例方法和虚方法的区别。首先从一些计算机基础知识开始。虽然下面讨论的东西不是\
  \ CLR 特有的，但掌握了这些之后，就有了一个良好的理论基础。接着，就可以将我们的讨论转向 CLR 特有的内容。\n\n图 4-2 展示了已加载 CLR 的一个\
  \ Windows 进程。该进程可能有多个线程。线程创建时会分配到 1 MB 的栈。栈空间用于向方法传递实参，方法内部定义的局部变量也在栈上。图 4-2 展示了线程的栈内存（右侧）。栈从高位内存地址向低位内存地址构建。图中线程已执行了一些代码，栈上已经有一些数据了（栈顶部的阴影区域）。现在，假定线程执行的代码要调用\
  \ M1 方法。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_106_0.png)\n\n图 4-2　一个线程的栈，当前准备调用\
  \ M1 方法\n\n最简单的方法包含“序幕”（prologue）代码，在方法开始做工作前对其进行初始化；还包含“尾声”（epilogue）代码，在方法做完工作后对其进行清理，以便返回至调用者。M1\
  \ 方法开始执行时，它的“序幕”代码在线程栈上分配局部变量 name 的内存，如图 4-3 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_106_1.png)\n\
  \n图 4-3　在线程栈上分配 M1 的局部变量\n\n然后，M1 调用 M2 方法，将局部变量 name 作为实参传递。这造成 name 局部变量中的地址被压入栈（参见图\
  \ 4-4）。M2 方法内部使用参数变量 s 标识栈位置（注意，有的 CPU 架构用寄存器传递实参以提升性能，但这个区别对于当前的讨论来说并不重要）。另外，调用方法时还会将“返回地址”压入栈。被调用的方法在结束之后应返回至该位置（同样参见图\
  \ 4-4）。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_107_0.png)\n\nM2 方法开始执行时，它的“序幕”代码在线程栈中为局部变量\
  \ length 和 tally 分配内存，如图 4-5 所示。然后，M2 方法内部的代码开始执行。最终，M2 抵达它的 return 语句，造成 CPU 的指令指针被设置成栈中的返回地址，M2\
  \ 的栈帧①展开（unwind）②，恢复成图 4-3 的样子。之后，M1 继续执行 M2 调用之后的代码，M1 的栈帧将准确反映 M1 需要的状态。\n\n>\
  \ ① 栈帧（stack frame）代表当前线程的调用栈中的一个方法调用。执行线程的过程中，进行的每个方法调用都会在调用栈中创建并压入一个 StackFrame。——译注\n\
  >\n> ② unwind 一般翻译成“展开”，但这并不是一个很好的翻译。wind 和 unwind 源于生活。把线缠到线圈上称为 wind；从线圈上松开称为\
  \ unwind。同样地，调用方法时压入栈帧，称为 wind；方法执行完毕，弹出栈帧，称为 unwind。把这几张图的线程栈看成一个线圈，就很容易理解了。——译注\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_107_1.png)\n\n最终，M1 会返回到它的调用者。这同样通过将\
  \ CPU 的指令指针设置成返回地址来实现（这个返回地址在图中未显示，但它应该刚好在栈中的 **name** 实参上方），M1 的栈帧展开（unwind），恢复成图\
  \ 4-2 的样子。之后，调用 M1 的方法继续执行 M1 调用之后的代码，那个方法的栈帧将准确反映它需要的状态。\n\n现在，让我们围绕 CLR 来调整一下讨论。假定有以下两个类定义：\n\
  \n```csharp\ninternal class Employee {\n    public              Int32          GetYearsEmployed()\
  \  { ... }\n    public virtual      String         GetProgressReport() { ... }\n\
  \    public static       Employee       Lookup(String name) { ... }\n}\n\ninternal\
  \ sealed class Manager : Employee {\n    public override String             GetProgressReport()\
  \ { ... }\n}\n```\n\nWindows 进程已启动，CLR 已加载到其中，托管堆已初始化，而且已创建一个线程（连同它的 1 MB 栈空间）。线程已执行了一些代码，马上就要调用\
  \ M3 方法。图 4-6 展示了目前的状态。M3 方法包含的代码演示了 CLR 是如何工作的。平时不这样写代码，因为它们没有做什么真正有用的事情。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_108_0.png)\n\
  \n图 4-6　CLR 已加载到进程中，堆已初始化，线程栈已创建，马上调用 M3 方法\n\nJIT 编译器将 M3 的 IL 代码转换成本机 CPU 指令时，会注意到\
  \ M3 内部引用的所有类型，包括 **Employee、Int32、Manager** 以及 **String**（因为 “Joe”）。这时 CLR 要确认定义了这些类型的所有程序集都已加载。然后，利用程序集的元数据，CLR\
  \ 提取与这些类型有关的信息，创建一些数据结构来表示类型本身。图 4-7 展示了为 **Employee** 和 **Manager** 类型对象使用的数据结构。由于线程在调用\
  \ M3 前已执行了一些代码，所以不妨假定 **Int32** 和 **String** 类型对象已经创建好了（这是极有可能的，因为它们都是很常用的类型），所以图中没有显示它们。\n\
  \n稍微讨论一下这些类型对象。本章前面讲过，堆上所有对象都包含两个额外成员：类型对象指针（type object pointer）和同步块索引（sync block\
  \ index）。如图所示，**Employee** 和 **Manager** 类型对象都有这两个成员。定义类型时，可在类型内部定义静态数据字段。为这些静态数据字段提供支持的字节在类型对象自身中分配。每个类型对象最后都包含一个方法表。在方法表中，类型定义的每个方法都有对应的记录项。第\
  \ 1 章已讨论过该方法表。由于 **Employee** 类型定义了 3 个方法（**GetYearsEmployed、GetProgressReport**\
  \ 和 **Lookup**），所以 **Employee** 的方法表有 3 个记录项。**Manager** 类型只定义了 1 个方法（**GetProgressReport**\
  \ 的重写版本），所以 **Manager** 的方法表只有 1 个记录项。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_109_0.png)\n\
  \n```csharp\nvoid M3() {\n    Employee e;\n    Int32 year;\n    e = new Manager();\n\
  \    e = Employee.Lookup(\"Joe\");\n    year = e.GetYearsEmployed();\n    e.GetProgressReport();\n\
  }\n```\n\n图 4-7　Employee 和 Manager 类型对象在 M3 被调用时创建\n\n当 CLR 确认方法需要的所有类型对象都已创建，**M3**\
  \ 的代码已经编译之后，就允许线程执行 **M3** 的本机代码。**M3** 的“序幕”代码执行时必须在线程栈中为局部变量分配内存，如图 4-8 所示。顺便说一句，作为方法“序幕”代码的一部分，CLR\
  \ 自动将所有局部变量初始化为 **null** 或 **0（零）**。然而，如果代码试图访问尚未显式初始化的局部变量，C# 会报告错误消息：**使用了未赋值的局部变量。**\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_110_0.png)\n\n```csharp\nvoid M3() {\n\
  \    Employee e;\n    Int32 year;\n    e = new Manager();\n    e = Employee.Lookup(\"\
  Joe\");\n    year = e.GetYearsEmployed();\n    e.GetProgressReport();\n}\n```\n\n\
  图 4-8　在线程栈上分配 M3 的局部变量\n\n然后，**M3** 执行代码构造一个 **Manager** 对象。这造成在托管堆创建 **Manager**\
  \ 类型的一个实例（也就是一个 **Manager** 对象），如图 4-9 所示。可以看出，和所有对象一样，**Manager** 对象也有类型对象指针和同步块索引。该对象还包含必要的字节来容纳\
  \ **Manager** 类型定义的所有实例数据字段，以及容纳由 **Manager** 的任何基类（本例就是 **Employee** 和 **Object**）定义的所有实例字段。任何时候在堆上新建对象，CLR\
  \ 都自动初始化内部的“类型对象指针”成员来引用和对象对应的类型对象（本例就是 **Manager** 类型对象）。此外，在调用类型的构造器（本质上是可能修改某些实例数据字段的方法）之前，CLR\
  \ 会先初始化同步块索引，并将对象的所有实例字段设为 **null** 或 **0（零）**。**new** 操作符返回 **Manager** 对象的内存地址，该地址保存到变量\
  \ e 中（e 在线程栈上）。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_110_1.png)\n\n```csharp\n\
  void M3() {\n    Employee e;\n    Int32 year;\n    e = new Manager();\n    e = Employee.Lookup(\"\
  Joe\");\n    year = e.GetYearsEmployed();\n    e.GetProgressReport();\n}\n```\n\n\
  图 4-9　分配并初始化 Manager 对象\n\nM3 的下一行代码调用 **Employee** 的静态方法 **Lookup**。调用静态方法时，CLR\
  \ 会定位与定义静态方法的类型对应的类型对象。然后，JIT 编译器在类型对象的方法表中查找与被调用方法对应的记录项，对方法进行 JIT 编译（如果需要的话），再调用\
  \ JIT 编译好的代码。本例假定 **Employee** 的 **Lookup** 方法要查询数据库来查找 Joe。再假定数据库指出 Joe 是公司的一名经理，所以在内部，**Lookup**\
  \ 方法在堆上构造一个新的 **Manager** 对象，用 Joe 的信息初始化它，返回该对象的地址。该地址保存到局部变量 e 中。这个操作的结果如图 4-10\
  \ 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_111_0.png)\n\n注意，e 不再引用第一个 Manager\
  \ 对象。事实上，由于没有变量引用该对象，所以它是未来垃圾回收的主要目标。垃圾回收机制将自动回收（释放）该对象占用的内存。\n\nM3 的下一行代码调用 Employee\
  \ 的非虚实例方法 GetYearsEmployed。调用非虚实例方法时，JIT 编译器会找到与“发出调用的那个变量（e）的类型（Employee）”对应的类型对象（Employee\
  \ 类型对象）。这时的变量 e 被定义成一个 Employee。如果 Employee 类型没有定义正在调用的那个方法，JIT 编译器会回溯类层次结构（一直回溯到\
  \ Object），并在沿途的每个类型中查找该方法。之所以能这样回溯，是因为每个类型对象都有一个字段引用了它的基类型，这个信息在图中没有显示。\n\n然后，JIT\
  \ 编译器在类型对象的方法表中查找引用了被调用方法的记录项，对方法进行 JIT 编译（如果需要的话），再调用 JIT 编译好的代码。本例假定 Employee\
  \ 的 GetYearsEmployed 方法返回 5，因为 Joe 已被公司雇用 5 年。这个整数保存到局部变量 year 中。这个操作的结果如图 4-11\
  \ 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_112_0.png)\n\n图 4-11　Employee\
  \ 的非虚实例方法 GetYearsEmployed 调用后返回 5\n\nM3 的下一行代码调用 Employee 的虚实例方法 GetProgressReport。调用虚实例方法时，JIT\
  \ 编译器要在方法中生成一些额外的代码；方法每次调用都会执行这些代码。这些代码首先检查发出调用的变量，并跟随地址来到发出调用的对象。变量 e 当前引用的是代表“Joe”的\
  \ Manager 对象。然后，代码检查对象内部的“类型对象指针”成员，该指针指向对象的实际类型。然后，代码在类型对象的方法表中查找引用了被调用方法的记录项，对方法进行\
  \ JIT 编译（如果需要的话），再调用 JIT 编译好的代码。由于目前 e 引用一个 Manager 对象，所以会调用 Manager 的 GetProgressReport\
  \ 实现。这个操作的结果如图 4-12 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_112_1.png)\n\
  \n图 4-12　调用 Employee 的虚实例方法 GetProgressReport，最终执行 Manager 重写的版本\n\n注意，如果 Employee\
  \ 的 Lookup 方法发现 Joe 是 Employee 而不是 Manager，Lookup 会在内部构造一个 Employee 对象，它的类型对象指针将引用\
  \ Employee 类型对象。这样最终执行的就是 Employee 的 GetProgressReport 实现，而不是 Manager 的。\n\n至此，我们已经讨论了源代码、IL\
  \ 和 JIT 编译的代码之间的关系。还讨论了线程栈、实参、局部变量以及这些实参和变量如何引用托管堆上的对象。还知道对象含有一个指针指向对象的类型对象（类型对象中包含静态字段和方法表）。还讨论了\
  \ JIT 编译器如何决定静态方法、非虚实例方法以及虚实例方法的调用方式。理解这一切之后，可以深刻地认识 CLR 的工作方式。以后在建构、设计和实现类型、组件以及应用程序时，这些知识会带来很大帮助。结束本章之前，让我们深入探讨一下\
  \ CLR 内部发生的事情。\n\n**注意**　**Employee** 和 **Manager** 类型对象都包含“类型对象指针”成员。这是由于类型对象本质上也是对象。CLR\
  \ 创建类型对象时，必须初始化这些成员。初始化成什么呢？你肯定会这样问。CLR 开始在一个进程中运行时，会立即为 MSCorLib.dll 中定义的 **System.Type**\
  \ 类型创建一个特殊的类型对象。**Employee** 和 **Manager** 类型对象都是该类型的“实例”。因此，它们的类型对象指针成员会初始化成对 **System.Type**\
  \ 类型对象的引用，如图 4-13 所示。\n\n当然，**System.Type** 类型对象本身也是对象，内部也有“类型对象指针”成员。这个指针指向什么？它指向它本身，因为\
  \ **System.Type** 类型对象本身是一个类型对象的“实例”。现在，我们总算理解了 CLR 的整个类型系统及其工作方式。顺便说一句，**System.Object**\
  \ 的 **GetType** 方法返回存储在指定对象的“类型对象指针”成员中的地址。也就是说，**GetType** 方法返回指向对象的类型对象的指针。这样就可判断系统中任何对象（包括类型对象本身）的真实类型。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_113_0.png)\n\n图 4-13　Employee 和 Manager\
  \ 类型对象是 System.Type 类型的实例\n"
- "## 第5章　基元类型、引用类型和值类型\n\n### 本章内容\n\n- 编程语言的基元类型\n- 引用类型和值类型\n- 值类型的装箱和拆箱\n- 对象哈希码\n\
  - **dynamic** 基元类型\n\n本章将讨论 Microsoft .NET Framework 开发人员经常要接触的各种类型。所有开发人员都应熟悉这些类型的不同行为。我首次接触\
  \ .NET Framework 时没有完全理解基元类型、引用类型和值类型的区别，造成在代码中不知不觉引入 bug 和性能问题。通过解释类型之间的区别，希望开发人员能避免我经历的麻烦，同时提高编码效率。\n\
  \n### 5.1　编程语言的基元类型\n\n某些数据类型如此常用，以至于许多编译器允许代码以简化语法来操纵它们。例如，可用以下语法分配一个整数：\n\n```csharp\n\
  System.Int32 a = new System.Int32();\n```\n\n但你肯定不愿意用这种语法声明并初始化整数，它实在是太繁琐了。幸好，包括\
  \ C# 在内的许多编译器都允许换用如下所示的语法：\n\n```csharp\nint a = 0;\n```\n\n这种语法不仅增强了代码可读性，生成的 IL\
  \ 代码还与使用 **System.Int32** 生成的 IL 代码完全一致。编译器直接支持的数据类型称为基元类型（primitive type）①。基元类型直接映射到\
  \ Framework 类库（FCL）中存在的类型。例如，C# 的 int 直接映射到 **System.Int32** 类型。因此，以下 4 行代码都能正确编译，并生成完全相同的\
  \ IL：\n\n```csharp\nint a = 0;\nSystem.Int32 a = 0;\nint a = new int();\nSystem.Int32\
  \ a = new System.Int32();\n```\n\n> ① MSDN 文档将 primitive type 翻译成“基元类型”，而不是容易使人混淆的“基本类型”。——译注\n\
  \n\n\n```csharp\nint              a = 0;                  // 最方便的语法\nSystem.Int32\
  \     a = 0;                  // 方便的语法\nint              a = new int();        \
  \  // 不方便的语法\nSystem.Int32     a = new System.Int32(); // 最不方便的语法\n```\n\n表 5-1\
  \ 列出的 FCL 类型在 C# 中都有对应的基元类型。只要是符合公共语言规范(CLS)的类型，其他语言都提供了类似的基元类型。但是，不符合 CLS 的类型，其他语言就不一定要支持了。\n\
  \n### 表 5-1 C# 基元类型与对应的 FCL 类型\n\n| C# 基元类型 | FCL 类型 | 符合 CLS | 说明 |\n| --- | ---\
  \ | --- | --- |\n| sbyte | System.SByte | 否 | 有符号 8 位值 |\n| byte | System.Byte |\
  \ 是 | 无符号 8 位值 |\n| short | System.Int16 | 是 | 有符号 16 位值 |\n| ushort | System.UInt16\
  \ | 否 | 无符号 16 位值 |\n| int | System.Int32 | 是 | 有符号 32 位值 |\n| uint | System.UInt32\
  \ | 否 | 无符号 32 位值 |\n| long | System.Int64 | 是 | 有符号 64 位值 |\n| ulong | System.UInt64\
  \ | 否 | 无符号 64 位值 |\n| char | System.Char | 是 | 16 位 Unicode 字符(char 不像在非托管 C++\
  \ 中那样代表一个 8 位值) |\n| float | System.Single | 是 | IEEE 32 位浮点值 |\n| double | System.Double\
  \ | 是 | IEEE 64 位浮点值 |\n| bool | System.Boolean | 是 | true/false 值 |\n| decimal\
  \ | System.Decimal | 是 | 128 位高精度浮点值，常用于不容许舍入误差的金融计算。128 位中，1 位是符号，96 位是值本身(N)，8\
  \ 位是比例因子(k)。decimal 实际值是±N×10^k，其中 -28 ≤ k ≤ 0。其余位没有使用 |\n| string | System.String\
  \ | 是 | 字符数组 |\n| object | System.Object | 是 | 所有类型的基类型 |\n| dynamic | System.Object\
  \ | 是 | 对于 CLR，dynamic 和 object 完全一致。但 C# 编译器允许使用简单的语法让 dynamic 变量参与动态调度。详情参见本章最后的\
  \ 5.5 节“dynamic 基元类型” |\n\n从另一个角度，可认为 C# 编译器自动假定所有源代码文件都添加了以下 using 指令(参考第 4 章)：\n\
  \n```csharp\nusing sbyte  = System.SByte;\nusing byte   = System.Byte;\nusing short\
  \  = System.Int16;\nusing ushort = System.UInt16;\nusing int    = System.Int32;\n\
  using uint   = System.UInt32;\n...\n```\n\nC# 语言规范称：“从风格上说，最好是使用关键字，而不是使用完整的系统类型名称。”\
  \ 我不同意语言规范；我情愿使用 FCL 类型名称，完全不用基元类型名称。事实上，我希望编译器根本不提供基元类型名称，而是强迫开发人员使用 FCL 类型名称。理由如下。\n\
  \n- 1. 许多开发人员纠结于是用 **string** 还是 **String**。由于 C# 的 **string**(一个关键字)直接映射到 **System.String**(一个\
  \ FCL 类型)，所以两者没有区别，都可使用。类似地，一些开发人员说应用程序在 32 位操作系统上运行，**int** 代表 32 位整数；在 64 位操作系统上运行，**int**\
  \ 代表 64 位整数。这个说法完全错误。C# 的 **int** 始终映射到 **System.Int32**，所以不管在什么操作系统上运行，代表的都是 32\
  \ 位整数。如果程序员习惯在代码中使用 **Int32**，像这样的误解就没有了。\n\n- 2. C# 的 **long** 映射到 **System.Int64**，但在其他编程语言中，**long**\
  \ 可能映射到 **Int16** 或 **Int32**。例如，C++/CLI 就将 **long** 视为 **Int32**。习惯于用一种语言写程序的人在看用另一种语言写的源代码时，很容易错误理解代码意图。事实上，大多数语言甚至不将\
  \ **long** 当作关键字，根本不编译使用了它的代码。\n\n- 3. FCL 的许多方法都将类型名作为方法名的一部分。例如，**BinaryReader**\
  \ 类型的方法包括 **ReadBoolean**、**ReadInt32**、**ReadSingle** 等；而 **System.Convert** 类型的方法包括\
  \ **ToBoolean**、**ToInt32**、**ToSingle** 等。以下代码虽然语法没问题，但包含 float 的那一行显得很别扭，无法一下子判断该行的正确性：\n\
  \n```csharp\nBinaryReader br = new BinaryReader(...);\nfloat val   = br.ReadSingle();\
  \   // 正确，但感觉别扭\nSingle val  = br.ReadSingle();   // 正确，感觉自然\n```\n\n- 4. 平时只用 C#\
  \ 的许多程序员逐渐忘了还可以用其他语言写面向 CLR 的代码，“C# 主义”逐渐入侵类库代码。例如，Microsoft 的 FCL 几乎是完全用 C# 写的，FCL\
  \ 团队向库中引入了像 **Array** 的 **GetLongLength** 这样的方法。该方法返回 **Int64** 值。这种值在 C# 中确实是 **long**，但在其他语言(比如\
  \ C++/CLI)中不是。另一个例子是 **System.Linq.Enumerable** 的 **LongCount** 方法。\n\n考虑到所有这些原因，本书坚持使用\
  \ FCL 类型名称。\n\n在许多编程语言中，以下代码都能正确编译并运行：\n\n```csharp\nInt32 i = 5;    // 32 位值\n\
  Int64 l = i;    // 隐式转型为 64 位值\n```\n\n但根据第 4 章对类型转换的讨论，你或许认为上述代码无法编译。毕竟，**System.Int32**\
  \ 和 **System.Int64** 是不同的类型，相互不存在派生关系。但事实上，你会欣喜地发现 C# 编译器正确编译了上述代码，运行起来也没有问题。这是为什么呢？原因是\
  \ C# 编译器非常熟悉基元类型，会在编译代码时应用自己的特殊规则。也就是说，编译器能识别常见的编程模式，并生成必要的 IL，使写好的代码能像预期的那样工作。具体地说，C#\
  \ 编译器支持与类型转换、字面值以及操作符有关的模式。接着的几个例子将对它们进行演示。\n\n首先，编译器能执行基元类型之间的隐式或显式转型，例如：\n\n```csharp\n\
  Int32 i = 5;             // 从 Int32 隐式转型为 Int32\nInt64 l = i;             // 从 Int32\
  \ 隐式转型为 Int64\nSingle s = i;            // 从 Int32 隐式转型为 Single\nByte b = (Byte)\
  \ i;       // 从 Int32 显式转型为 Byte\nInt16 v = (Int16) s;     // 从 Single 显式转型为 Int16\n\
  ```\n\n① 即 literal，也称为直接量或文字常量。本书将采用“字面值”这一译法。——译注\n\n只有在转换“安全”的时候，C# 才允许隐式转型。所谓“安全”，是指不会发生数据丢失的情况，比如从\
  \ **Int32** 转换为 **Int64**。但如果可能不安全，C# 就要求显式转型。对于数值类型，“不安全”意味着转换后可能丢失精度或数量级。例如，**Int32**\
  \ 转换为 **Byte** 要求显式转型，因为大的 **Int32** 数字可能丢失精度；**Single** 转换为 **Int16** 也要求显式转型，因为\
  \ **Single** 能表示比 **Int16** 更大数量级的数字。\n\n注意，不同编译器可能生成不同代码来处理这些转型。例如，将值为 6.8 的 **Single**\
  \ 转型为 **Int32**，有的编译器可能生成代码对其进行截断(向下取整)，最终将 6 放到一个 **Int32** 中；其他编译器则可能将结果向上取整为\
  \ 7。顺便说一句，C# 总是对结果进行截断，而不进行向上取整。要了解 C# 对其基本类型进行转型时的具体规则，请参见 C# 语言规范的“转换”一节。\n\n\
  除了转型，基本类型还能写成字面值(literal)。字面值可被看成是类型本身的实例，所以可像下面为实例(123 和 456)调用实例方法：\n\n```csharp\n\
  Console.WriteLine(123.ToString() + 456.ToString());    // \"123456\"\n```\n\n另外，如果表达式由字面值构成，编译器在编译时就能完成表达式求值，从而增强应用程序性能：\n\
  \n```csharp\nBoolean found = false;       // 生成的代码将 found 设为 0\nInt32 x = 100 +\
  \ 20 + 3;       // 生成的代码将 x 设为 123\nString s = \"a \" + \"bc\";     // 生成的代码将 s\
  \ 设为 \"a bc\"\n```\n\n最后，编译器知道如何和以什么顺序解析代码中的操作符(比如 +，-，*，/，%，&，^，|，==，!=，>，<，>=，<=，<<，>>，~，!，++，--等)：\n\
  \n```csharp\nInt32 x = 100;                       // 赋值操作符\nInt32 y = x + 23;  \
  \                  // 加和赋值操作符\nBoolean lessThanFifty = (y < 50);    // 小于和赋值操作符\n\
  ```\n\n#### checked 和 unchecked 基元类型操作\n\n对基元类型执行的许多算术运算都可能造成溢出：\n\n```csharp\n\
  Byte b = 100;\nb = (Byte) (b + 200); // b 现在包含 44(或者十六进制值 2C)\n```\n\n> **重要提示**　执行上述算术运算时，第一步要求所有操作数都扩大为\
  \ 32 位值(或者 64 位值，如果任何操作数需要超过 32 位来表示的话)。所以 b 和 200(两个都不超过 32 位)首先转换成 32 位值，然后加到一起。结果是一个\
  \ 32 位值(十进制 300，或十六进制 12C)。该值在存回变量 b 前必须转型为 Byte。C# 不隐式执行这个转型操作，这正是第二行代码需要强制转型 Byte\
  \ 的原因。\n\n溢出大多数时候是我们不希望的。如果没有检测到这种溢出，会导致应用程序行为失常。但极少数时候(比如计算哈希值或者校验和)，这种溢出不仅可以接受，还是我们希望的。\n\
  \n不同语言处理溢出的方式不同。C 和 C++ 不将溢出视为错误，允许值回滚(wrap)¹，应用程序将“若无其事”地运行。相反，Microsoft Visual\
  \ Basic 总是将溢出视为错误，并在检测到溢出时抛出异常。\n\nCLR 提供了一些特殊的 IL 指令，允许编译器选择它认为最恰当的行为。CLR 有一个 **add**\
  \ 指令，作用是将两个值相加，但不执行溢出检查。还有一个 **add.ovf** 指令，作用也是将两个值相加，但会在发生溢出时抛出 **System.OverflowException**\
  \ 异常。除了用于加法运算的 IL 指令，CLR 还为减、乘和数据转换提供了类似的 IL 指令，分别是 **sub/sub.ovf、mul/mul.ovf**\
  \ 和 **conv/conv.ovf**。\n\nC# 允许程序员自己决定如何处理溢出。溢出检查默认关闭。也就是说，编译器生成 IL 代码时，将自动使用加、减、乘以及转换指令的无溢出检查版本。结果是代码能更快地运行——但开发人员必须保证不发生溢出，或者代码能预见到溢出。\n\
  \n让 C# 编译器控制溢出的一个方法是使用 **/checked+** 编译器开关。该开关指示编译器在生成代码时，使用加、减、乘和转换指令的溢出检查版本。这样生成的代码在执行时会稍慢一些，因为\
  \ CLR 会检查这些运算，判断是否发生溢出。如果发生溢出，CLR 抛出 **OverflowException** 异常。\n\n除了全局性地打开或关闭溢出检查，程序员还可在代码的特定区域控制溢出检查。C#\
  \ 通过 **checked** 和 **unchecked** 操作符来提供这种灵活性。下面是使用了 **unchecked** 操作符的例子：\n\n```csharp\n\
  UInt32 invalid = unchecked((UInt32) (-1));   // OK\n```\n\n下例则使用了 **checked** 操作符：\n\
  \n```csharp\nByte b = 100;\nb = checked((Byte) (b + 200));   // 抛出 OverflowException\
  \ 异常\n```\n\n在这个例子中，**b** 和 **200** 首先转换成 32 位值，然后加到一起，结果是 300。然后，因为显式转型的存在，**300**\
  \ 被转换成一个 **Byte**，这造成 **OverflowException** 异常。**Byte** 在 **checked** 操作符外部转型则不会发生异常：\n\
  \n```csharp\nb = (Byte) checked(b + 200);   // b 包含 44；不会抛出 OverflowException 异常\n\
  ```\n\n除了 **checked** 和 **unchecked** 操作符，C# 还支持 **checked** 和 **unchecked** 语句，它们造成一个块中的所有表达式都进行或不进行溢出检查：\n\
  \n```csharp\nchecked {\n    Byte b = 100;              // 开始 checked 块\n    b =\
  \ (Byte) (b + 200);       // 该表达式会进行溢出检查\n}                               // 结束\
  \ checked 块\n```\n\n¹ 所谓“回滚”，是指一个值超过了它的类型所允许的最大值，从而“回滚”到一个非常小的、负的或者未定义的值。wrap 是\
  \ wrap-around 的简称。——译注\n\n事实上，如果使用了 **checked** 语句块，就可将 `+=` 操作符用于 **Byte**，稍微简化一下代码：\n\
  \n```csharp\nchecked {\n    Byte b = 100;\n    b += 200;\n}\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_120_0.png)\n\
  \n> **重要提示** 由于 **checked** 操作符和 **checked** 语句唯一的作用就是决定生成哪个版本的加、减、乘和数据转换 IL 指令，所以在\
  \ **checked** 操作符或语句中调用方法，不会对该方法造成任何影响，如下例所示：\n>\n> ```csharp\n> checked {\n>  \
  \   // 假定 SomeMethod 试图把 400 加载到一个 Byte 中\n>     SomeMethod(400);\n>     // SomeMethod\
  \ 可能会，也可能不会抛出 OverflowException 异常\n>     // 如果 SomeMethod 使用 checked 指令编译，就可能会抛出异常\n\
  >     // 但这和当前的 checked 语句无关\n> }\n> ```\n\n根据我的经验，许多计算都会产生令人吃惊的结果。这一般是由于无效的用户输入，但也可能是由于系统的某个部分返回了程序员没有预料到的值。所以我对程序员有以下建议。\n\
  \n- 1. 尽量使用有符号数值类型(比如 **Int32** 和 **Int64**)而不是无符号数值类型(比如 **UInt32** 和 **UInt64**)。这允许编译器检测更多的上溢/下溢错误。除此之外，类库多个部分(比如\
  \ **Array** 和 **String** 的 **Length** 属性)被硬编码为返回有符号的值。这样在代码中四处移动这些值时，需要进行的强制类型转换就少了。较少的强制类型转换使代码更整洁，更容易维护。除此之外，无符号数值类型不符合\
  \ CLS。\n\n- 2. 写代码时，如果代码可能发生你不希望的溢出(可能是因为无效的输入，比如要求使用最终用户或客户机提供的数据)，就把这些代码放到 **checked**\
  \ 块中。同时捕捉 **OverflowException**，得体地从错误中恢复。\n\n- 3. 写代码时，将允许发生溢出的代码显式放到 **unchecked**\
  \ 块中，比如在计算校验和时。\n\n- 4. 对于没有使用 **checked** 或 **unchecked** 的任何代码，都假定你希望在发生溢出时抛出一个异常，比如在输入已知的前提下计算一些东西(比如质数)，此时的溢出应被计为\
  \ bug。\n\n开发应用程序时，打开编译器的 **/checked+** 开关进行调试性生成。这样系统会对没有显式标记 **checked** 或 **unchecked**\
  \ 的代码进行溢出检查，所以应用程序运行起来会慢一些。此时一旦发生异常，就可以轻松检测到，而且能及时修正代码中的 bug。但是，为了正式发布而生成应用程序时，应使用编译器的\
  \ **/checked-** 开关，确保代码能更快运行，不会产生溢出异常。要在 Microsoft Visual Studio 中更改 Checked 设置，请打开项目的属性页，点击“生成”标签，单击“高级”，再勾选“检查运算上溢/下溢”，如图\
  \ 5-1 所示。\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_121_0.png)\n\n图 5-1　在\
  \ Visual Studio 的“高级生成设置”对话框中指定编译器是否检查溢出\n\n如果应用程序能容忍总是执行 **checked** 运算而带来的轻微性能损失，建议即使是为了发布而生成应用程序，也用\
  \ **/checked** 命令行开关进行编译，这样可防止应用程序在包含已损坏的数据（甚至可能是安全漏洞）的前提下继续运行。例如，通过乘法运算来计算数组索引时，相较于因为数学运算的“回绕”而访问到不正确的数组元素，抛出\
  \ **OverflowException** 异常才是更好的做法。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_121_1.png)\n\
  \n> **重要提示**　**System.Decimal** 是非常特殊的类型。虽然许多编程语言（包括 C# 和 Visual Basic）将 **Decimal**\
  \ 视为基元类型，但 CLR 不然。这意味着 CLR 不知道如何处理 **Decimal** 值的 IL 指令。在文档中查看 **Decimal** 类型，可以看到它提供了一系列\
  \ **public static** 方法，包括 **Add**、**Subtract**、**Multiply**、**Divide** 等。此外，**Decimal**\
  \ 类型还为 +、-、*、/ 等提供了操作符重载方法。\n>\n> 编译使用了 **Decimal** 值的程序时，编译器会生成代码来调用 **Decimal**\
  \ 的成员，并通过这些成员来执行实际运算，这意味着 **Decimal** 值的处理速度慢于 CLR 基元类型的值。另外，由于没有相应的 IL 指令来处理 **Decimal**\
  \ 值，所以 **checked** 和 **unchecked** 操作符、语句以及编译器开关都失去了作用。如果对 **Decimal** 值执行的运算是不安全的，肯定会抛出\
  \ **OverflowException** 异常。\n>\n> 类似地，**System.Numerics.BigInteger** 类型也在内部使用 **UInt32**\
  \ 数组来表示任意大的整数，它的值没有上限和下限。因此，对 **BigInteger** 执行的运算永远不会造成 **OverflowException** 异常。但如果值太大，没有足够多的内存来改变数组大小，对\
  \ **BigInteger** 的运算可能抛出 **OutOfMemoryException** 异常。\n\n①　乘法运算可能产生一个较大的值，超出数组的索引范围。参见上一条关于“wrap”的注释。——译注\n\
  \n### 5.2 引用类型和值类型\n\nCLR 支持两种类型：引用类型和值类型。虽然 FCL 的大多数类型都是引用类型，但程序员用得最多的还是值类型。引用类型总是从托管堆分配，C#\
  \ 的 new 操作符返回对象内存地址——即指向对象数据的内存地址。使用引用类型必须留意性能问题。首先要认清楚以下四个事实。\n\n- 1. 内存必须从托管堆分配。\n\
  - 2. 堆上分配的每个对象都有一些额外成员，这些成员必须初始化。\n- 3. 对象中的其他字节（为字段而设）总是设为零。\n- 4. 从托管堆分配对象时，可能强制执行一次垃圾回收。\n\
  \n如果所有类型都是引用类型，应用程序的性能将显著下降。设想每次使用 Int32 值时都进行一次内存分配，性能会受到多么大的影响！为了提升简单和常用的类型的性能，CLR\
  \ 提供了名为“值类型”的轻量级类型。值类型的实例一般在线程栈上分配（虽然也可作为字段嵌入引用类型的对象中）。在代表值类型实例的变量中不包含指向实例的指针。相反，变量中包含了实例本身的字段。由于变量已包含了实例的字段，所以操作实例中的字段不需要提领指针。值类型的实例不受垃圾回收器的控制。因此，值类型的使用缓解了托管堆的压力，并减少了应用程序生存期内的垃圾回收次数。\n\
  \n文档清楚指出哪些类型是引用类型，哪些是值类型。在文档中查看类型时，任何称为“类”的类型都是引用类型。例如，System.Exception 类、System.IO.FileStream\
  \ 类以及 System.Random 类都是引用类型。相反，所有值类型都称为结构或枚举。例如，System.Int32 结构、System.Boolean 结构、System.Decimal\
  \ 结构、System.TimeSpan 结构、System.DayOfWeek 枚举、System.IO.FileAttributes 枚举以及 System.Drawing.FontStyle\
  \ 枚举都是值类型。\n\n进一步研究文档，会发现所有结构都是抽象类型 System.ValueType 的直接派生类。System.ValueType 本身又直接从\
  \ System.Object 派生。根据定义，所有值类型都必须从 System.ValueType 派生。所有枚举都从 System.Enum 抽象类型派生，后者又从\
  \ System.ValueType 派生。CLR 和所有编程语言都给予枚举特殊待遇①。欲知枚举类型的详情，请参见第 15 章“枚举类型和位标志”。\n\n虽然不能在定义值类型时替它选择基类型，但如果愿意，值类型可实现一个或多个接口。除此之外，所有值类型都隐式密封，目的是防止将值类型用作其他引用类型或值类型的基类型。例如，无法将\
  \ Boolean，Char，Int32，UInt64，Single，Double，Decimal 等作为基类型来定义任何新类型。\n\n①　将其视为“一等公民”，直接支持各种强大的操作。在非托管环境中，枚举就没这么“好命”了。——译注\n\
  \n> **重要提示**　对于许多开发人员（比如非托管 C/C++ 开发人员），最初接触引用类型和值类型时都觉得有些不解。在非托管 C/C++ 中声明类型后，使用该类型的代码会决定是在堆栈上还是在应用程序的堆中分配类型的实例。但在托管代码中，要由定义类型的开发人员决定在什么地方分配类型的实例，使用类型的人对此并无控制权。\n\
  \n以下代码和图 5-2 演示了引用类型和值类型的区别：\n\n```csharp\n// 引用类型（因为'class'）\nclass SomeRef { public\
  \ Int32 x; }\n\n// 值类型（因为'struct'）\nstruct SomeVal { public Int32 x; }\n\nstatic\
  \ void ValueTypeDemo() {\n    SomeRef r1 = new SomeRef();     // 在堆上分配\n    SomeVal\
  \ v1 = new SomeVal();     // 在线程栈上分配\n    r1.x = 5;                       // 提领指针\n\
  \    v1.x = 5;                       // 在线程栈上修改\n    Console.WriteLine(r1.x);  \
  \      // 显示\"5\"\n    Console.WriteLine(v1.x);        // 同样显示\"5\"\n    // 图 5-2\
  \ 的左半部分反映了执行以上代码之后的情况\n\n    SomeRef r2 = r1;                // 只复制引用（指针）\n    SomeVal\
  \ v2 = v1;                // 在线程栈上分配并复制成员\n    r1.x = 8;                       //\
  \ r1.x 和 r2.x 都会更改\n    v1.x = 9;                       // v1.x 会更改，v2.x 不变\n  \
  \  Console.WriteLine(r1.x);        // 显示\"8\"\n    Console.WriteLine(r2.x);    \
  \    // 显示\"8\"\n    Console.WriteLine(v1.x);        // 显示\"9\"\n    Console.WriteLine(v2.x);\
  \        // 显示\"5\"\n    // 图 5-2 的右半部分反映了执行以上所有代码之后的情况\n}\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_123_0.png)\n\
  \n- 类型的实例较小（16 字节或更小）。\n- 类型的实例较大（大于 16 字节），但不作为方法实参传递，也不从方法返回。\n\n值类型的主要优势是不作为对象在托管堆上分配。当然，与引用类型相比，值类型也存在自身的一些局限。下面列出了值类型和引用类型的一些区别。\n\
  \n- 值类型对象有两种表示形式：**未装箱**和**已装箱**，详情参见下一节。相反，引用类型总是处于已装箱形式。\n- 值类型从 **System.ValueType**\
  \ 派生。该类型提供了与 **System.Object** 相同的方法。但 **System.ValueType** 重写了 **Equals** 方法，能在两个对象的字段值完全匹配的前提下返回\
  \ **true**。此外，**System.ValueType** 重写了 **GetHashCode** 方法。生成哈希码时，这个重写方法所用的算法会将对象的实例字段中的值考虑在内。由于这个默认实现存在性能问题，所以定义自己的值类型时应重写\
  \ **Equals** 和 **GetHashCode** 方法，并提供它们的显式实现。本章末尾会讨论 **Equals** 和 **GetHashCode**\
  \ 方法。\n- 由于不能将值类型作为基类型来定义新的值类型或者新的引用类型，所以不应在值类型中引入任何新的虚方法。所有方法都不能是抽象的，所有方法都隐式密封（不可重写）。\n\
  - 引用类型的变量包含堆中对象的地址。引用类型的变量创建时默认初始化为 **null**，表明当前不指向有效对象。试图使用 **null** 引用类型变量会抛出\
  \ **NullReferenceException** 异常。相反，值类型的变量总是包含其基础类型的一个值，而且值类型的所有成员都初始化为 **0**。值类型变量不是指针，访问值类型不可能抛出\
  \ **NullReferenceException** 异常。CLR 确实允许为值类型添加“可空”（nullability）标识。可空类型将在第 19 章“可空值类型”详细讨论。\n\
  - 将值类型变量赋给另一个值类型变量，会执行逐字段的复制。将引用类型的变量赋给另一个引用类型的变量只复制内存地址。\n- 基于上一条，两个或多个引用类型变量能引用堆中同一个对象，所以对一个变量执行的操作可能影响到另一个变量引用的对象。相反，值类型变量自成一体，对值类型变量执行的操作不可能影响另一个值类型变量。\n\
  - 由于未装箱的值类型不在堆上分配，一旦定义了该类型的一个实例的方法不再活动，为它们分配的存储就会被释放，而不是等着进行垃圾回收。\n\n#### CLR 如何控制类型中的字段布局\n\
  \n为了提高性能，CLR 能按照它所选择的任何方式排列类型的字段。例如，CLR 可以在内存中重新安排字段的顺序，将对字段引用分为一组，同时重新排列和填充数据字段。但在定义类型时，针对类型的各个字段，你可以告诉\
  \ CLR 是严格按照自己指定的顺序排列，还是按照 CLR 自己认为合适的方式重新排列。\n\n为了告诉 CLR 应该怎样做，要为自己定义的类或结构应用 System.Runtime.InteropServices.StructLayoutAttribute\
  \ 特性。可向该特性的构造器传递 LayoutKind.Auto，让 CLR 自动排列字段；也可传递 LayoutKind.Sequential，让 CLR 保持你的字段布局；也可传递\
  \ LayoutKind.Explicit，利用偏移量在内存中显式排列字段。如果不为自己定义的类型显式指定 StructLayoutAttribute，编译器会选择它自认为最好的布局。\n\
  \n注意，Microsoft C# 编译器默认为引用类型（类）选择 LayoutKind.Auto，为值类型（结构）选择 LayoutKind.Sequential。显然，C#\
  \ 编译器团队认为和非托管代码互操作时会经常用到结构。为此，字段必须保持程序员定义的顺序。然而，假如创建的值类型不与非托管代码互操作，就应该覆盖 C# 编译器的默认设置。下面是一个例子：\n\
  \n```csharp\nusing System;\nusing System.Runtime.InteropServices;\n\n// 让 CLR 自动排列字段以增强这个值类型的性能\n\
  [StructLayout(LayoutKind.Auto)]\ninternal struct SomeValType {\n    private readonly\
  \ Byte m_b;\n    private readonly Int16 m_x;\n    ...\n}\n```\n\nStructLayoutAttribute\
  \ 还允许显式指定每个字段的偏移量，这要求向其构造器传递 LayoutKind.Explicit。然后向值类型中的每个字段都应用 System.Runtime.InteropServices.FieldOffsetAttribute\
  \ 特性的实例，向该特性的构造器传递 Int32 值来指出字段第一个字节距离实例起始处的偏移量（以字节为单位）。显式布局常用于模拟非托管 C/C++ 中的 union①，因为多个字段可起始于内存的相同偏移位置。下面是一个例子：\n\
  \n```csharp\nusing System;\nusing System.Runtime.InteropServices;\n\n// 开发人员显式排列这个值类型的字段\n\
  [StructLayout(LayoutKind.Explicit)]\ninternal struct SomeValType {\n    [FieldOffset(0)]\n\
  \    private readonly Byte m_b; // m_b 和 m_x 字段在该类型的实例中相互重叠\n\n    [FieldOffset(0)]\n\
  \    private readonly Int16 m_x; // m_b 和 m_x 字段在该类型的实例中相互重叠\n}\n```\n\n注意在类型中，一个引用类型和一个值类型相互重叠是不合法的。虽然允许多个引用类型在同一个起始偏移位置相互重叠，但这无法验证（unverifiable）。定义类型，在其中让多个值类型相互重叠则是合法的。但是，为了使这样的类型能够验证（verifiable），所有重叠字节都必须能通过公共字段访问。\n\
  \n### 5.3 值类型的装箱和拆箱\n\n值类型比引用类型“轻”，原因是它们不作为对象在托管堆中分配，不被垃圾回收，也不通过指针进行引用。但许多时候都需要获取对值类型实例的引用。例如，假定要创建\
  \ **ArrayList**（System.Collections 命名空间中定义的一个类型）对象来容纳一组 **Point** 结构，代码如下：\n\n```csharp\n\
  // 声明值类型\nstruct Point {\n    public Int32 x, y;\n}\n\npublic sealed class Program\
  \ {\n    public static void Main() {\n        ArrayList a = new ArrayList();\n \
  \       Point p;                      // 分配一个 Point（不在堆中分配）\n        for (Int32\
  \ i = 0; i < 10; i++) {\n            p.x = p.y = i;            // 初始化值类型中的成员\n \
  \           a.Add(p);                 // 对值类型装箱，将引用添加到 ArrayList 中\n        }\n\
  \        ...\n    }\n}\n```\n\n每次循环迭代都初始化一个 **Point** 的值类型字段，并将该 **Point** 存储到 **ArrayList**\
  \ 中。但思考一下 **ArrayList** 中究竟存储了什么？是 **Point** 结构，**Point** 结构的地址，还是其他完全不同的东西？要知道正确答案，必须研究\
  \ **ArrayList** 的 **Add** 方法，了解它的参数被定义成什么类型。本例的 **Add** 方法原型如下：\n\n```csharp\npublic\
  \ virtual Int32 Add(Object value);\n```\n\n可以看出 **Add** 获取的是一个 **Object** 参数。也就是说，**Add**\
  \ 获取对托管堆上的一个对象的引用（或指针）来作为参数。但之前的代码传递的是 **p**，也就是一个 **Point**，是值类型。为了使代码正确工作，**Point**\
  \ 值类型必须转换成真正的、在堆中托管的对象，而且必须获取对该对象的引用。\n\n将值类型转换成引用类型要使用装箱机制。下面总结了对值类型的实例进行装箱时所发生的事情。\n\
  \n- 1. 在托管堆中分配内存。分配的内存量是值类型各字段所需的内存量，还要加上托管堆所有对象都有的两个额外成员（类型对象指针和同步块索引）所需的内存量。\n\
  - 2. 值类型的字段复制到新分配的堆内存。\n- 3. 返回对象地址。现在该地址是对象引用；值类型成了引用类型。\n\nC# 编译器自动生成对值类型实例进行装箱所需的\
  \ IL 代码，但仍需理解内部发生的事情，对代码长度和性能心中有数。\n\nC# 编译器自动生成对值类型实例进行装箱所需的 IL 代码，但你仍然需要理解内部的工作机制才能体会到代码的大小和性能问题。\n\
  \nC# 编译器检测到上述代码是向要求引用类型的方法传递值类型，所以自动生成代码对对象进行装箱。所以在运行时，当前存在于 **Point** 值类型实例 p 中的字段复制到新分配的\
  \ **Point** 对象中。已装箱 **Point** 对象（现在是引用类型）的地址返回并传给 **Add** 方法。**Point** 对象一直存在于堆中，直至被垃圾回收。**Point**\
  \ 值类型变量 p 可被重用，因为 **ArrayList** 不知道关于它的任何事情。在这种情况下，已装箱值类型的生存期超过了未装箱值类型的生存期。\n\n\
  ![](img/6fa065e17c4549db7260fbfaf4fd384e_128_0.png)\n\n> **注意**　FCL 现在包含一组新的泛型集合类，非泛型集合类已成为“昨日黄花”。例如，应该使用\
  \ **System.Collections.Generic.List<T>** 类而不是 **System.Collections.ArrayList** 类。泛型集合类对非泛型集合类进行了大量改进。例如，API\
  \ 得到简化和增强，集合类的性能也得到显著提升。\n>\n> 但最大的改进就是泛型集合类允许开发人员在操作值类型的集合时不需要对集合中的项进行装箱/拆箱。单这一项改进，就使性能提升了不少。这是因为托管堆中需要创建的对象减少了，进而减少了应用程序需要执行的垃圾回收的次数。另外，开发人员还获得了编译时的类型安全性，源代码也因为强制类型转换的次数减少而变得更清晰。所有这一切都将在第\
  \ 12 章“泛型”详细解释。\n\n知道装箱如何进行后，接着谈谈拆箱。假定要用以下代码获取 **ArrayList** 的第一个元素：\n\n```csharp\n\
  Point p = (Point) a[0];\n```\n\n它获取 **ArrayList** 的元素 0 包含的引用（或指针），试图将其放到 **Point**\
  \ 值类型的实例 p 中。为此，已装箱 **Point** 对象中的所有字段都必须复制到值类型变量 p 中，后者在线程栈上。CLR 分两步完成复制。第一步获取已装箱\
  \ **Point** 对象中的各个 **Point** 字段的地址。这个过程称为拆箱（unboxing）。第二步将字段包含的值从堆复制到基于栈的值类型实例中。\n\
  \n拆箱不是直接将装箱过程倒过来。拆箱的代价比装箱低得多。拆箱其实就是获取指针的过程，该指针指向包含在一个对象中的原始值类型（数据字段）。其实，指针指向的是已装箱实例中的未装箱部分。所以和装箱不同，拆箱不要求在内存中复制任何字节。知道这个重要区别之后，还应知道的一个重点是，往往紧接着拆箱发生一次字段复制。\n\
  \n装箱和拆箱/复制会对应用程序的速度和内存消耗产生不利影响，所以应留意编译器在什么时候生成代码来自动进行这些操作，并尝试手动编写代码，尽量减少这种情况的发生。\n\
  \n已装箱值类型实例在拆箱时，内部发生下面这些事情。\n\n- 1. 如果包含“对已装箱值类型实例的引用”的变量为 **null**，抛出 **NullReferenceException**\
  \ 异常。\n- 2. 如果引用的对象不是所需值类型的已装箱实例，抛出 **InvalidCastException** 异常。\n\n\n\n第二条意味着以下代码的工作方式和你想的可能不一样：\n\
  \n```csharp\npublic static void Main() {\n    Int32 x = 5;\n    Object o = x;  \
  \      // 对 x 装箱，o 引用已装箱对象\n    Int16 y = (Int16) o; // 抛出 InvalidCastException\
  \ 异常\n}\n```\n\n从逻辑上说，完全能获取 o 引用的已装箱 Int32，将其强制转型为 Int16。但在对对象进行拆箱时，只能转型为最初未装箱的值类型——本例是\
  \ Int32。以下是上述代码的正确写法：\n\n```csharp\npublic static void Main() {\n    Int32 x = 5;\n\
  \    Object o = x;          // 对 x 进行装箱，o 引用已装箱对象\n    Int16 y = (Int16) (Int32)\
  \ o;// 先拆箱为正确类型，再转型\n}\n```\n\n前面说过，一次拆箱操作经常紧接着一次字段复制。以下 C# 代码演示了拆箱和复制：\n\n```csharp\n\
  public static void Main() {\n    Point p;\n    p.x = p.y = 1;\n    Object o = p;\
  \      // 对 p 装箱；o 引用已装箱实例\n\n    p = (Point) o;     // 对 o 拆箱，将字段从已装箱实例复制到栈变量中\n\
  }\n```\n\n最后一行，C# 编译器生成一条 IL 指令对 o 拆箱（获取已装箱实例中的字段的地址），并生成另一条 IL 指令将这些字段从堆复制到基于栈的变量\
  \ p 中。\n\n再来看看以下代码：\n\n```csharp\npublic static void Main() {\n    Point p;\n  \
  \  p.x = p.y = 1;\n    Object o = p;          // 对 p 装箱；o 引用已装箱实例\n\n    // 将 Point\
  \ 的 x 字段变成 2\n    p = (Point) o;         // 对 o 拆箱，将字段从已装箱的实例复制到栈变量中\n    p.x =\
  \ 2;               // 更改栈变量的状态\n    o = p;                 // 对 p 装箱；o 引用新的已装箱实例\n\
  }\n```\n\n最后三行代码唯一的目的就是将 Point 的 x 字段从 1 变成 2。为此，首先要执行一次拆箱，再执行一次字段复制，再更改字段（在栈上），最后执行一次装箱（在托管堆上创建全新的已装箱实例）。想必你已体会到了装箱和拆箱/复制对应用程序性能的影响。\n\
  \n有的语言（比如 C++/CLI）允许在不复制字段的前提下对已装箱的值类型进行拆箱。拆箱返回已装箱对象中的未装箱部分的地址（忽略对象的“类型对象指针”和“同步块索引”这两个额外的成员）。接着可利用这个指针来操纵未装箱实例的字段（这些字段恰好在堆上的已装箱对象中）。例如，上述代码用\
  \ C++/CLI 来写，效率会高很多，因为可直接在已装箱 Point 实例中修改 Point 的 x 字段的值。这就避免了在堆上分配新对象和复制所有字段两次！\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_130_0.png)\n\n> **重要提示**　如果关心应用程序的性能，就应清楚编译器何时生成代码执行这些操作。遗憾的是，许多编译器都隐式生成代码来装箱对象，所以有时并不知道自己的代码会造成装箱。如果关心特定算法的性能，可用\
  \ ILDasm.exe 这样的工具查看方法的 IL 代码，观察 IL 指令 box 都在哪些地方出现。\n\n再来看几个装箱和拆箱的例子：\n\n```csharp\n\
  public static void Main() {\n    Int32 v = 5;        // 创建未装箱值类型变量\n    Object o\
  \ = v;       // o 引用已装箱的、包含值 5 的 Int32\n    v = 123;            // 将未装箱的值修改成 123\n\
  \n    Console.WriteLine(v + \", \" + (Int32) o); // 显示\"123, 5\"\n}\n```\n\n能从上述代码中看出发生了多少次装箱吗？如果说\
  \ 3 次，会不会觉得意外？让我们仔细分析一下代码，理解具体发生的事情。为了帮助理解，下面列出为这个 **Main** 方法生成的 IL 代码。我为这些代码加上了注释，方便你看清楚发生的每个操作：\n\
  \n```il\n.method public hidebysig static void Main() cil managed\n{\n    .entrypoint\n\
  \    // 代码大小       45 (0x2d)\n    .maxstack 3\n    .locals init ([0] int32 v,\n\
  \                  [1] object o)\n\n    // 将 5 加载到 v 中\n    IL_0000: ldc.i4.5\n\
  \    IL_0001: stloc.0\n\n    // 对 o 装箱，将引用指针存储到 o 中\n    IL_0002: ldloc.0\n    IL_0003:\
  \ box       [mscorlib]System.Int32\n    IL_0008: stloc.1\n\n    // 将 123 加载到 v 中\n\
  \    IL_0009: ldc.i4.s 123\n    IL_000b: stloc.0\n\n    // 对 v 装箱，将指针保留在栈上以进行 Concat（连接）操作\n\
  \    IL_000c: ldloc.0\n    IL_000d: box       [mscorlib]System.Int32\n\n    // 将字符串加载到栈上以执行\
  \ Concat 操作\n    IL_0012: ldstr \", \"\n\n    // 对 o 拆箱：获取一个指针，它指向栈上的 Int32 字段\n\
  \    IL_0017: ldloc.1\n    IL_0018: unbox.any [mscorlib]System.Int32\n\n    // 对\
  \ Int32 装箱，将指针保留在栈上以进行 Concat 操作\n    IL_001d: box       [mscorlib]System.Int32\n\
  \n    // 调用 Concat\n    IL_0022: call string [mscorlib]System.String::Concat(object,\n\
  \                                                         object,\n            \
  \                                             object)\n\n    // 将从 Concat 返回的字符串传给\
  \ WriteLine\n    IL_0027: call void [mscorlib]System.Console::WriteLine(string)\n\
  \n    // 从 Main 返回，终止应用程序\n    IL_002c: ret\n} // end of method App::Main\n```\n\
  \n首先在栈上创建一个 **Int32** 未装箱值类型实例（v），将其初始化为 5。再创建 **Object** 类型的变量（o）并初始化，让它指向 v。但由于引用类型的变量始终指向堆中的对象，所以\
  \ C# 生成正确的 IL 代码对 v 进行装箱，将 v 的已装箱拷贝的地址存储到 o 中。接着，值 123 被放到未装箱值类型实例 v 中，但这个操作不会影响已装箱的\
  \ **Int32**，后者的值依然为 5。\n\n接着调用 **WriteLine** 方法，**WriteLine** 要求获取一个 **String**\
  \ 对象，但当前没有 **String** 对象。相反，现在有三个数据项：一个未装箱的 **Int32** 值类型实例（v）、一个 **String**（它是引用类型），以及对已装箱\
  \ **Int32** 值类型实例的引用（o），它要转型为未装箱的 **Int32**。必须以某种方式合并这些数据项来创建一个 **String**。\n\n\
  为了创建一个 **String**，C# 编译器生成代码来调用 **String** 的静态方法 **Concat**。该方法有几个重载版本，所有版本执行的操作都一样，只是参数的数量不同。由于需要连接三个数据项来创建字符串，所以编译器选择\
  \ **Concat** 方法的以下版本：\n\n```csharp\npublic static String Concat(Object arg0, Object\
  \ arg1, Object arg2);\n```\n\n为第一个参数 **arg0** 传递的是 v。但 v 是未装箱的值参数，而 **arg0** 是 **Object**，所以必须对\
  \ v 进行装箱，并将已装箱的 v 的地址传给 **arg0**。对于 **arg1** 参数，字符串“,”作为 **String** 对象引用传递。对于 **arg2**\
  \ 参数，o（一个 **Object** 引用）会转型为 **Int32**。这要求执行拆箱（但不紧接着执行复制），从而获取包含在已装箱 **Int32** 中的未装箱\
  \ **Int32** 的地址。这个未装箱的 **Int32** 实例必须再次装箱，并将新的已装箱实例的内存地址传给 **Concat** 的 **arg2**\
  \ 参数。\n\n**Concat** 方法调用指定的每个对象的 **ToString** 方法，将每个对象的字符串形式连接起来。从 **Concat** 返回的\
  \ **String** 对象传给 **WriteLine** 方法以显示最终结果。\n\n应该指出，如果像下面这样写 **WriteLine** 调用，生成的\
  \ IL 代码将具有更高的执行效率：\n\n```csharp\nConsole.WriteLine(v + \", \" + o);  // 显示“123,\
  \ 5”\n```\n\n这和前面的版本几乎完全一致，只是移除了变量 o 之前的 **(Int32)** 强制转型。之所以效率更高，是因为 o 已经是指向一个\
  \ **Object** 的引用类型，它的地址可直接传给 **Concat** 方法。所以，移除强制转型避免了两次操作：一次拆箱和一次装箱。不妨重新生成应用程序，观察\
  \ IL 代码来体会避免的额外操作：\n\n```il\n.method public hidebysig static void Main() cil managed\n\
  {\n  .entrypoint\n  // 代码大小      35 (0x23)\n  .maxstack 3\n  .locals init ([0] int32\
  \ v,\n                [1] object o)\n\n  // 将 5 加载到 v 中\n  IL_0000: ldc.i4.5\n \
  \ IL_0001: stloc.0\n\n  // 对 v 装箱，并将引用指针存储到 o 中\n  IL_0002: ldloc.0\n  IL_0003:\
  \ box        [mscorlib]System.Int32\n  IL_0008: stloc.1\n\n  // 将 123 加载到栈中\n  IL_0009:\
  \ ldc.i4.s 123\n  IL_000b: stloc.0\n\n  // 对 v 装箱，并将指针保留在栈上以进行 Concat（连接）操作\n  IL_000c:\
  \ ldloc.0\n  IL_000d: box        [mscorlib]System.Int32\n\n  // 将字符串加载到栈上以执行 Concat\
  \ 操作\n  IL_0012: ldstr \", \"\n\n  // 将已装箱 Int32 的地址加载到栈上以进行 Concat 操作\n  IL_0017:\
  \ ldloc.1\n\n  // 调用 Concat\n  IL_0018: call string [mscorlib]System.String::Concat(object,\n\
  \                                               object)\n\n  // 将从 Concat 返回的字符串传给\
  \ WriteLine\n  IL_001d: call void [mscorlib]System.Console::WriteLine(string)\n\n\
  \  // 从 Main 返回，终止这个应用程序\n  IL_0022: ret\n} // end of method App::Main\n```\n\n\
  简单对比一下两个版本的 **Main** 方法的 IL 代码，会发现没有 **(Int32)** 转型的版本比有转型的版本小了 10 字节。第二个版本额外的拆箱/装箱步骤显然会生成更多的代码。更大的问题是，额外的装箱步骤会从托管堆中分配一个额外的对象，将来必须对其进行垃圾回收。这两个版本的结果一样，速度上的差别也并不明显。但是，假如在循环中发生额外的、不必要的装箱操作，就会严重影响应用程序的性能和内存消耗。\n\
  \n甚至可以这样调用 **WriteLine**，进一步提升上述代码的性能：\n\n```csharp\nConsole.WriteLine(v.ToString()\
  \ + \", \" + o);    // 显示\"123, 5\"\n```\n\n这会为未装箱的值类型实例 v 调用 **ToString** 方法，它返回一个\
  \ **String**。**String** 对象已经是引用类型，所以能直接传给 **Concat** 方法，不需要任何装箱操作。\n\n下面是演示装箱和拆箱的另一个例子：\n\
  \n```csharp\npublic static void Main() {\n    Int32 v = 5;                 // 创建未装箱的值类型变量\n\
  \    Object o = v;                // o 引用 v 的已装箱版本\n\n    v = 123;             \
  \        // 将未装箱的值类型修改成 123\n    Console.WriteLine(v);        // 显示\"123\"\n   \
  \ v = (Int32) o;               // 拆箱并将 o 复制到 v\n    Console.WriteLine(v);      \
  \  // 显示\"5\"\n}\n```\n\n上述代码发生了多少次装箱？答案是一次。之所以只发生一次装箱，是因为 **System.Console** 类已定义了获取单个\
  \ **Int32** 参数的 **WriteLine** 方法：\n\n```csharp\npublic static void WriteLine(Int32\
  \ value);\n```\n\n在前面对 **WriteLine** 的两次调用中，变量 v（**Int32** 未装箱值类型实例）以传值方式传给方法。\n\
  \n虽然 **WriteLine** 方法也许会在它自己内部对 **Int32** 装箱，但这已经不在我们的控制范围之内了。最重要的是，我们已尽可能地在自己的代码中减少了装箱。\n\
  \n仔细研究一下 FCL，会发现许多方法都针对不同的值类型参数进行了重载。例如，**System.Console** 类提供了 **WriteLine** 方法的几个重载版本：\n\
  \n```csharp\npublic static void WriteLine(Boolean);\npublic static void WriteLine(Char);\n\
  public static void WriteLine(Char[]);\npublic static void WriteLine(Int32);\npublic\
  \ static void WriteLine(UInt32);\npublic static void WriteLine(Int64);\npublic static\
  \ void WriteLine(UInt64);\npublic static void WriteLine(Single);\npublic static\
  \ void WriteLine(Double);\npublic static void WriteLine(Decimal);\npublic static\
  \ void WriteLine(Object);\npublic static void WriteLine(String);\n```\n\n以下几个方法也有一组类似的重载版本：**System.Console**\
  \ 的 **Write** 方法，**System.IO.BinaryWriter** 的 **Write** 方法，**System.IO.TextWriter**\
  \ 的 **Write** 和 **WriteLine** 方法，**System.Runtime.Serialization.SerializationInfo**\
  \ 的 **AddValue** 方法、**System.Text.StringBuilder** 的 **Append** 和 **Insert** 方法。大多数方法进行重载唯一的目的就是减少常用值类型的装箱次数。\n\
  \n但这些 FCL 类的方法不可能接受你自己定义的值类型。另外，即使是 FCL 中定义好的值类型，这些方法也可能没有提供对应的重载版本。调用方法并传递值类型时，如果不存在与值类型对应的重载版本，那么调用的肯定是获取一个\
  \ **Object** 参数的重载版本。将值类型实例作为 **Object** 传递会造成装箱，从而对性能造成不利影响。定义自己的类时，可将类中的方法定义为泛型（通过类型约束将类型参数限制为值类型）。这样方法就可获取任何值类型而不必装箱。泛型主题将在第\
  \ 12 章讨论。\n\n关于装箱最后注意一点：如果知道自己的代码会造成编译器反复对一个值类型装箱，请改成用手动方式对值类型进行装箱。这样代码会变得更小、更快。下面是一个例子：\n\
  \n```csharp\nusing System;\n\npublic sealed class Program {\n    public static void\
  \ Main() {\n        Int32 v = 5;  // 创建未装箱的值类型变量\n\n#if INEFFICIENT\n    // 编译下面这一行，v\
  \ 被装箱 3 次，浪费时间和内存\n    Console.WriteLine(\"{0}, {1}, {2}\", v, v, v);\n#else\n \
  \   // 下面的代码结果一样，但无论执行速度、\n    // 还是内存利用，都比前面的代码更胜一筹\n    Object o = v;  // 对 v\
  \ 进行手动装箱（仅 1 次）\n\n    // 编译下面这一行不发生装箱\n    Console.WriteLine(\"{0}, {1}, {2}\"\
  , o, o, o);\n#endif\n    }\n}\n```\n\n```csharp\n#endif\n}\n}\n```\n\n在定义了 **INEFFICIENT**\
  \ 符号的前提下编译，编译器会生成代码对 v 装箱 3 次，造成在堆上分配 3 个对象！这太浪费了，因为每个对象都是完全相同的内容：**5**。在没有定义 **INEFFICIENT**\
  \ 符号的前提下编译，v 只装箱一次，所以只在堆上分配一个对象。随后，在对 **Console.WriteLine** 方法的调用中，对同一个已装箱对象的引用被传递\
  \ 3 次。第二个版本执行起来快得多，在堆上分配的内存也要少得多。\n\n通过这些例子，很容易判断在什么时候一个值类型的实例需要装箱。简单地说，要获取对值类型实例的引用，实例就必须装箱。将值类型实例传给需要获取引用类型的方法，就会发生这种情况。但这并不是要对值类型实例装箱的唯一情况。\n\
  \n前面说过，未装箱值类型比引用类型更“轻”。这要归结于以下两个原因。\n\n- 不在托管堆上分配。\n- 没有堆上的每个对象都有的额外成员：“类型对象指针”和“同步块索引”。\n\
  \n由于未装箱值类型没有同步块索引，所以不能使用 **System.Threading.Monitor** 类型的方法（或者 C# lock 语句）让多个线程同步对实例的访问。\n\
  \n虽然未装箱值类型没有类型对象指针，但仍可调用由类型继承或重写的虚方法（比如 **Equals、GetHashCode** 或者 **ToString**）。如果值类型重写了其中任何虚方法，那么\
  \ CLR 可以非虚地调用该方法，因为值类型隐式密封，不可能有类型从它们派生，而且调用虚方法的值类型实例没有装箱。然而，如果重写的虚方法要调用基类中的实现，那么在调用基类的实现时，值类型实例会装箱，以便能够通过\
  \ **this** 指针将对一个堆对象的引用传给基方法。\n\n但在调用非虚的、继承的方法时（比如 **GetType** 或 **MemberwiseClone**），无论如何都要对值类型进行装箱。因为这些方法由\
  \ **System.Object** 定义，要求 **this** 实参是指向堆对象的指针。\n\n此外，将值类型的未装箱实例转型为某个接口类型时，要对实例进行装箱。这是因为接口变量必须包含对堆对象的引用（接口主题将在第\
  \ 13 章“接口”中讨论）。以下代码对此进行了演示：\n\n```csharp\nusing System;\n\ninternal struct Point\
  \ : IComparable {\n    private Int32 m_x, m_y;\n\n    // 构造器负责初始化字段\n    public\
  \ Point(Int32 x, Int32 y)\n    {\n        m_x = x;\n        m_y = y;\n    }\n\n\
  \    // 重写从 System.ValueType 继承的 ToString 方法\n    public override String ToString()\n\
  \    {\n        // 将 point 作为字符串返回。注意，调用 ToString 以避免装箱\n        return String.Format(\"\
  ({0}, {1})\", m_x.ToString(), m_y.ToString());\n    }\n\n    // 实现类型安全的 CompareTo\
  \ 方法\n    public Int32 CompareTo(Point other)\n    {\n        // 利用勾股定理计算哪个 point\
  \ 距离原点(0，0)更远\n        return Math.Sign(Math.Sqrt(m_x * m_x + m_y * m_y)\n     \
  \       - Math.Sqrt(other.m_x * other.m_x + other.m_y * other.m_y));\n    }\n\n\
  \    // 实现 IComparable 的 CompareTo 方法\n    public Int32 CompareTo(Object o)\n  \
  \  {\n        if (GetType() != o.GetType())\n            throw new ArgumentException(\"\
  o is not a Point\");\n        // 调用类型安全的 CompareTo 方法\n        return CompareTo((Point)\
  \ o);\n    }\n}\n\npublic static class Program\n{\n    public static void Main()\n\
  \    {\n        // 在栈上创建两个 Point 实例\n        Point p1 = new Point(10, 10);\n   \
  \     Point p2 = new Point(20, 20);\n\n        // 调用 ToString（虚方法）不装箱 p1\n     \
  \   Console.WriteLine(p1.ToString());    // 显示“(10, 10)”\n\n        // 调用 GetType（非虚方法）时，要对\
  \ p1 进行装箱\n        Console.WriteLine(p1.GetType()); // 显示“Point”\n\n        // 调用\
  \ CompareTo 不装箱 p1\n        // 由于调用的是 CompareTo(Point)，所以 p2 不装箱\n        Console.WriteLine(p1.CompareTo(p2));\
  \ // 显示“-1”\n\n        // p1 要装箱，引用放到 c 中\n        IComparable c = p1;\n       \
  \ Console.WriteLine(c.GetType());    // 显示“Point”\n\n        // 调用 CompareTo 不装箱\
  \ p1\n        // 由于向 CompareTo 传递的不是 Point 变量，\n        // 所以调用的是 CompareTo(Object)，它要求获取对已装箱\
  \ Point 的引用\n        // c 不装箱是因为它本来就引用已装箱 Point\n        Console.WriteLine(p1.CompareTo(c));\
  \  // 显示“0”\n\n        // c 不装箱，因为它本来就引用已装箱 Point\n        // p2 要装箱，因为调用的是 CompareTo(Object)\n\
  \        Console.WriteLine(c.CompareTo(p2));  // 显示“-1”\n\n        // 对 c 拆箱，字段复制到\
  \ p2 中\n        p2 = (Point) c;\n\n        // 证明字段已复制到 p2 中\n        Console.WriteLine(p2.ToString());\
  \    // 显示\"(10, 10)\"\n    }\n}\n```\n\n上述代码演示了涉及装箱和拆箱的几种情形。\n\n- 1. **调用 ToString**：调用\
  \ **ToString** 时 **p1** 不必装箱。表面看 **p1** 似乎必须装箱，因为 **ToString** 是从基类 **System.ValueType**\
  \ 继承的虚方法。通常，为了调用虚方法，CLR 需要判断对象的类型来定位类型的方法表。由于 **p1** 是未装箱的值类型，所以不存在“类型对象指针”。但 JIT\
  \ 编译器发现 **Point** 重写了 **ToString** 方法，所以会生成代码来直接（非虚地）调用 **ToString** 方法，而不必进行任何装箱操作。编译器知道这里不存在多态性问题，因为\
  \ **Point** 是值类型，没有类型能从它派生以提供虚方法的另一个实现。但假如 **Point** 的 **ToString** 方法在内部调用 **base.ToString()**，那么在调用\
  \ **System.ValueType** 的 **ToString** 方法时，值类型的实例会被装箱。\n- 2. **调用 GetType**：调用非虚方法\
  \ **GetType** 时 **p1** 必须装箱。**Point** 的 **GetType** 方法是从 **System.Object** 继承的。所以，为了调用\
  \ **GetType**，CLR 必须使用指向类型对象的指针，而这个指针只能通过装箱 **p1** 来获得。\n- 3. **调用 CompareTo（第一次）**：第一次调用\
  \ **CompareTo** 时 **p1** 不必装箱，因为 **Point** 实现了 **CompareTo** 方法，编译器能直接调用它。注意向 **CompareTo**\
  \ 传递的是一个 **Point** 变量（**p2**），所以编译器调用的是获取一个 **Point** 参数的 **CompareTo** 重载版本。这意味着\
  \ **p2** 以传值方式传给 **CompareTo**，无需装箱。\n- 4. **转型为 IComparable**：**p1** 转型为接口类型的变量\
  \ **c** 时必须装箱，因为接口被定义为引用类型。装箱 **p1** 后，指向已装箱对象的指针存储到变量 **c** 中。后面对 **GetType** 的调用证明\
  \ **c** 确实引用堆上的已装箱 **Point**。\n- 5. **调用 CompareTo（第二次）**：第二次调用 **CompareTo** 时\
  \ **p1** 不必装箱，因为 **Point** 实现了 **CompareTo** 方法，编译器能直接调用。注意向 **CompareTo** 传递的是\
  \ **IComparable** 类型的变量 **c**，所以编译器调用的是获取一个 **Object** 参数的 **CompareTo** 重载版本。这意味着传递的实参必须是指针，必须引用堆上的一个对象。幸好，**c**\
  \ 确实引用一个已装箱 **Point**，所以 **c** 中的内存地址直接传给 **CompareTo**，无需额外装箱。\n- 6. **调用 CompareTo（第三次）**：第三次调用\
  \ **CompareTo** 时，**c** 本来就引用堆上的已装箱 **Point** 对象，所以不装箱。由于 **c** 是 **IComparable**\
  \ 接口类型，所以只能调用接口的获取一个 **Object** 参数的 **CompareTo** 方法。这意味着传递的实参必须是引用了堆上对象的指针。所以 **p2**\
  \ 要装箱，指向这个已装箱对象的指针将传给 **CompareTo**。\n- 7. **转型为 Point**：将 c 转型为 **Point** 时，**c**\
  \ 引用的堆上对象被拆箱，其字段从堆复制到 **p2**。**p2** 是栈上的 **Point** 类型实例。\n\n我知道，对于引用类型、值类型和装箱的所有这些讨论很容易让人产生挫折感。但是，任何\
  \ .NET Framework 开发人员只有在切实理解了这些概念之后，才能保障自己的长期成功。相信我，只有深刻理解了之后，才能更快、更轻松地构建高效率的应用程序。\n\
  \n### 5.3.1 使用接口更改已装箱值类型中的字段（以及为什么不应该这样做）\n\n下面通过一些例子来验证自己对值类型、装箱和拆箱的理解程度。请研究以下代码，判断它会在控制台上显示什么：\n\
  \n```csharp\nusing System;\n\n// Point 是值类型\ninternal struct Point {\n    private\
  \ Int32 m_x, m_y;\n\n    public Point(Int32 x, Int32 y) {\n        m_x = x;\n  \
  \      m_y = y;\n    }\n\n    public void Change(Int32 x, Int32 y) {\n        m_x\
  \ = x; m_y = y;\n    }\n\n    public override String ToString() {\n        return\
  \ String.Format(\"({0}, {1})\", m_x.ToString(), m_y.ToString());\n    }\n}\n\npublic\
  \ sealed class Program {\n    public static void Main() {\n        Point p = new\
  \ Point(1, 1);\n\n        Console.WriteLine(p);\n\n        p.Change(2, 2);\n   \
  \     Console.WriteLine(p);\n\n        Object o = p;\n        Console.WriteLine(o);\n\
  \n        ((Point) o).Change(3, 3);\n        Console.WriteLine(o);\n    }\n}\n```\n\
  \n程序其实很简单。**Main** 在栈上创建 **Point** 值类型的实例（**p**），将它的 **m_x** 和 **m_y** 字段设为 1。然后，第一次调用\
  \ **WriteLine** 之前 **p** 要装箱。**WriteLine** 在已装箱 **Point** 上调用 **ToString**，并像预期的那样显示(1,\
  \ 1)。然后用 **p** 调用 **Change** 方法，该方法将 **p** 在栈上的 **m_x** 和 **m_y** 字段值都更改为 2。第二次调用\
  \ **WriteLine** 时，再次对 **p** 进行装箱，像预料之中的那样显示(2, 2)。现在，p 进行第 3 次装箱，o 引用已装箱的 Point\
  \ 对象。第 3 次调用 WriteLine 再次显示(2, 2)，这同样是预料之中的。最后，我们希望调用 Change 方法来更新已装箱的 Point 对象中的字段。然而，Object（变量\
  \ o 的类型）对 Change 方法一无所知，所以首先必须将 o 转型为 Point。将 o 转型为 Point 要求对 o 进行拆箱，并将已装箱 Point\
  \ 中的字段复制到线程栈上的一个临时 Point 中！这个临时 Point 的 m_x 和 m_y 字段会变成 3 和 3，但已装箱的 Point 不受这个 Change\
  \ 调用的影响。第四次调用 WriteLine 方法，会再次显示(2, 2)。这是许多开发人员预料不到的。\n\n有的语言（比如 C++/CLI）允许更改已装箱值类型中的字段，但\
  \ C# 不允许。不过，可以用接口欺骗 C#，让它允许这个操作。下面是上例的修改版本：\n\n```csharp\nusing System;\n\n// 接口定义了\
  \ Change 方法\ninternal interface IChangeBoxedPoint {\n   void Change(Int32 x, Int32\
  \ y);\n}\n\n// Point 是值类型\ninternal struct Point : IChangeBoxedPoint {\n   private\
  \ Int32 m_x, m_y;\n\n   public Point(Int32 x, Int32 y) {\n      m_x = x;\n     \
  \ m_y = y;\n   }\n\n   public void Change(Int32 x, Int32 y) {\n      m_x = x; m_y\
  \ = y;\n   }\n\n   public override String ToString() {\n      return String.Format(\"\
  ({0}, {1})\", m_x.ToString(), m_y.ToString());\n   }\n}\n\npublic sealed class Program\
  \ {\n   public static void Main() {\n      Point p = new Point(1, 1);\n\n      Console.WriteLine(p);\n\
  \n      p.Change(2, 2);\n      Console.WriteLine(p);\n\n      Object o = p;\n  \
  \    Console.WriteLine(o);\n\n      ((Point) o).Change(3, 3);\n      Console.WriteLine(o);\n\
  \n      // 对 p 进行装箱，更改已装箱的对象，然后丢弃它\n      ((IChangeBoxedPoint) p).Change(4, 4);\n\
  \      Console.WriteLine(p);\n\n      // 更改已装箱的对象，并显示它\n      ((IChangeBoxedPoint)\
  \ o).Change(5, 5);\n      Console.WriteLine(o);\n   }\n}\n```\n\n上述代码和上一个版本几乎完全一致，主要区别是\
  \ Change 方法由 IChangeBoxedPoint 接口定义，Point 类型现在实现了该接口。Main 中的前 4 个 WriteLine 调用和前面的例子相同，生成的结果也一样（这是我们预期的）。然而，Main\
  \ 最后新增了两个例子。\n\n在第一个例子中，未装箱的 Point p 转型为一个 IChangeBoxedPoint。这个转型造成对 p 中的值进行装箱。然后在已装箱值上调用\
  \ Change，这确实会将其 m_x 和 m_y 字段分别变成 4 和 4。但在 Change 返回之后，已装箱对象立即准备好进行垃圾回收。所以，对 WriteLine\
  \ 的第 5 个调用会显示(2, 2)。许多开发人员预期的并不是这个结果。\n\n在最后一个例子中，o 引用的已装箱 Point 转型为一个 IChangeBoxedPoint。这不需要装箱，因为\
  \ o 本来就是已装箱的 Point。然后调用 Change，它能正确修改已装箱 Point 的 m_x 和 m_y 字段。接口方法 Change 使我能够更改已装箱\
  \ Point 对象中的字段！现在调用 WriteLine，会像预期的那样显示(5, 5)。本例旨在演示接口方法如何修改已装箱值类型中的字段。在 C# 中，不用接口方法便无法做到。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_139_0.png)\n\n> **重要提示**　本章前面提到，值类型应该“不可变”（immutable）。也就是说，我们不应该定义任何会修改实例字段的成员。事实上，我建议将值类型的字段都标记为\
  \ readonly。这样，一旦不留神写一个试图更改字段的方法，编译时就会报错。前面的例子清楚揭示了我们为什么应该这样做。假如方法试图修改值类型的实例字段，调用这个方法就会产生非预期的行为。构造好值类型后，如果不调用任何会修改其状态的方法（或者如果根本不存在这样的方法），就用不着操心什么时候发生装箱和拆箱字段复制。如果值类型不可变，简单复制相同的状态就可以了（不用担心有方法会修改这些状态），代码的任何行为都在你的掌控之中。\n\
  >\n> 有许多开发人员审阅了本书内容。在阅读我的部分示例代码之后（比如前面的代码），他们告诉我以后再也不敢使用值类型了。我必须声明，值类型的这些玄妙之处着实花了我好几天功夫进行调试，痛定思痛之余，我必须在这里着重强调，提醒大家注意，希望大家记住我描述的问题。这样，当代码真正出现这些问题的时候，我们就能够做到心中有数。虽然如此，但也不要因噎废食而惧怕值类型。它们很有用，有自己的适用场景。毕竟，程序偶尔还是需要\
  \ Int32 的。只是要注意，值类型和引用类型的行为会因为使用方式的不同而有明显差异。事实上，前例将 Point 声明为 class 而不是 struct，即可获得令人满意的结果。最后还要告诉你一个好消息，FCL\
  \ 的核心值类型(Byte、Int32、UInt32、Int64、UInt64、Single、Double、Decimal、BigInteger、Complex\
  \ 以及所有枚举)都是“不可变”的，所以在使用这些类型时，不会发生任何稀奇古怪的事情。\n\n### 5.3.2 对象相等性和同一性\n\n开发人员经常写代码比较对象。例如，有时要将对象放到集合，写代码对集合中的对象排\n\
  \n排序、搜索或比较。本节将讨论相等性和同一性，还将讨论如何定义正确实现了对象相等性的类型。\n\n**System.Object** 类型提供了名为 **Equals**\
  \ 的虚方法，作用是在两个对象包含相同值的前提下返回 **true**。**Object** 的 **Equals** 方法是像下面这样实现的：\n\n```csharp\n\
  public class Object {\n    public virtual Boolean Equals(Object obj) {\n\n     \
  \   // 如果两个引用指向同一个对象，它们肯定包含相同的值\n        if (this == obj) return true;\n\n     \
  \   // 假定对象不包含相同的值\n        return false;\n    }\n}\n```\n\n乍一看，这似乎就是 **Equals**\
  \ 的合理实现：假如 **this** 和 **obj** 实参引用同一个对象，就返回 **true**。似乎合理是因为 **Equals** 知道对象肯定包含和它自身一样的值。但假如实参引用不同对象，**Equals**\
  \ 就不肯定对象是否包含相同的值，所以返回 **false**。换言之，对于 **Object** 的 **Equals** 方法的默认实现，它实现的实际上是同一性(identity)，而非相等性(equality)。\n\
  \n遗憾的是，**Object** 的 **Equals** 方法的默认实现并不合理，而且永远都不应该像这样实现。研究一下类的继承层次结构，并思考如何正确重写\
  \ **Equals** 方法，马上会发现问题出在哪里。下面展示了 **Equals** 方法应该如何正确地实现。\n\n- 1. 如果 **obj** 实参为\
  \ **null**，就返回 **false**，因为调用非静态 **Equals** 方法时，**this** 所标识的当前对象显然不为 **null**。\n\
  - 2. 如果 **this** 和 **obj** 实参引用同一个对象，就返回 **true**。在比较包含大量字段的对象时，这一步有助于提升性能。\n- 3.\
  \ 如果 **this** 和 **obj** 实参引用不同类型的对象，就返回 **false**。一个 **String** 对象显然不等于一个 **FileStream**\
  \ 对象。\n- 4. 针对类型定义的每个实例字段，将 **this** 对象中的值与 **obj** 对象中的值进行比较。任何字段不相等，就返回 **false**。\n\
  - 5. 调用基类的 **Equals** 方法来比较它定义的任何字段。如果基类的 **Equals** 方法返回 **false**，就返回 **false**；否则返回\
  \ **true**。\n\n所以，Microsoft 本应像下面这样实现 **Object** 的 **Equals** 方法：\n\n```csharp\n\
  public class Object {\n    public virtual Boolean Equals(Object obj) {\n       \
  \ // 要比较的对象不能为 null\n        if (obj == null) return false;\n\n        // 如果对象属于不同的类型，则肯定不相等\n\
  \        if (this.GetType() != obj.GetType()) return false;\n\n        // 如果对象属于相同的类型，那么在它们的所有字段都匹配的前提下返回\
  \ true\n        // 由于 System.Object 没有定义任何字段，所以字段是匹配的\n        return true;\n  \
  \  }\n}\n```\n\n但由于 Microsoft 没有像这样实现 Equals，所以 Equals 的实现规则比想像的复杂。类型重写 Equals 方法时应调用其基类的\
  \ Equals 实现(除非基类就是 Object)。另外，由于类型能重写 Object 的 Equals 方法，所以不能再用它测试同一性。为了解决这个问题，Object\
  \ 提供了静态方法 ReferenceEquals，其原型如下：\n\n```csharp\npublic class Object {\n    public\
  \ static Boolean ReferenceEquals(Object objA, Object objB) {\n        return (objA\
  \ == objB);\n    }\n}\n```\n\n检查同一性(看两个引用是否指向同一个对象)务必调用 ReferenceEquals，不应使用 C#\
  \ 的==操作符(除非先把两个操作数都转型为 Object)，因为某个操作数的类型可能重载了==操作符，为其赋予不同于“同一性”的语义。\n\n可以看出，在涉及对象相等性和同一性的时候，.NET\
  \ Framework 的设计很容易使人混淆。顺便说一下，System.ValueType(所有值类型的基类)就重写了 Object 的 Equals 方法，并进行正确的实现来执行值的相等性检查(而不是同一性检查)。ValueType\
  \ 的 Equals 内部是这样实现。\n\n- 1. 如果 obj 实参为 null，就返回 false。\n- 2. 如果 this 和 obj 实参引用不同类型的对象，就返回\
  \ false。\n- 3. 针对类型定义的每个实例字段，都将 this 对象中的值与 obj 对象中的值进行比较(通过调用字段的 Equals 方法)。任何字段不相等，就返回\
  \ false。\n- 4. 返回 true。ValueType 的 Equals 方法不调用 Object 的 Equals 方法。\n\n在内部，ValueType\
  \ 的 Equals 方法利用反射(详情将在第 23 章“程序集加载和反射”讲述)完成上述步骤 3。由于 CLR 反射机制慢，定义自己的值类型时应重写 Equals\
  \ 方法来提供自己的实现，从而提高用自己类型的实例进行值相等性比较的性能。当然，自己的实现不调用 base.Equals。\n\n定义自己的类型时，你重写的 Equals\
  \ 要符合相等性的 4 个特征。\n\n- Equals 必须自反；x.Equals(x)肯定返回 true。\n- Equals 必须对称；x.Equals(y)和\
  \ y.Equals(x)返回相同的值。\n- Equals 必须可传递：x.Equals(y)返回 true，y.Equals(z)返回 true，则 x.Equals(z)肯定返回\
  \ true。\n- Equals 必须一致。比较的两个值不变，Equals 返回值(true 或 false)也不能变。\n\n如果实现的 **Equals**\
  \ 不符合上述任何特征，应用程序就会行为失常。重写 **Equals** 方法时，可能还需要做下面几件事情。\n\n- **让类型实现 System.IEquatable<T>\
  \ 接口的 Equals 方法**  \n  这个泛型接口允许定义类型安全的 **Equals** 方法。通常，你实现的 **Equals** 方法应获取一个\
  \ **Object** 参数，以便在内部调用类型安全的 **Equals** 方法。\n- **重载==和!=操作符方法**  \n  通常应实现这些操作符方法，在内部调用类型安全的\
  \ **Equals**。\n\n此外，如果以后为了排序目的而比较类型的实例，类型还应实现 **System.IComparable** 的 **CompareTo**\
  \ 方法和 **System.IComparable<T>** 的类型安全的 **CompareTo** 方法。如果实现了这些方法，还可考虑重载各种比较操作符方法（<、<=、>、>=），在这些方法内部调用类型安全的\
  \ **CompareTo** 方法。\n\n### 5.4　对象哈希码\n\nFCL 的设计者认为，如果能将任何对象的任何实例放到哈希表集合中，能带来很多好处。为此，**System.Object**\
  \ 提供了虚方法 **GetHashCode**，它能获取任意对象的 **Int32** 哈希码。\n\n如果你定义的类型重写了 **Equals** 方法，还应重写\
  \ **GetHashCode** 方法。事实上，如果类型重写 **Equals** 的同时没有重写 **GetHashCode**，Microsoft C#编译器会生成一条警告。例如，编译以下类型会显示警告消息：**warning\
  \ CS0659: \"Program\"重写 Object.Equals(object o) 但不重写 Object.GetHashCode()。**\n\n\
  ```csharp\npublic sealed class Program {\n    public override Boolean Equals(Object\
  \ obj) { ... }\n}\n```\n\n类型定义 **Equals** 之所以还要定义 **GetHashCode**，是由于在 **System.Collections.Hashtable**\
  \ 类型、**System.Collections.Generic.Dictionary** 类型以及其他一些集合的实现中，要求两个对象必须具有相同哈希码才被视为相等。所以，重写\
  \ **Equals** 就必须重写 **GetHashCode**，确保相等性算法和对象哈希码算法一致。\n\n简单地说，向集合添加键/值(key/value)对，首先要获取键对象的哈希码。该哈希码指出键/值对要存储到哪个哈希桶(bucket)中。集合需要查找键时，会获取指定键对象的哈希码。该哈希码标识了现在要以顺序方式搜索的哈希桶，将在其中查找与指定键对象相等的键对象。采用这个算法来存储和查找键，意味着一旦修改了集合中的一个键对象，集合就再也找不到该对象。所以，需要修改哈希表中的键对象时，正确做法是移除原来的键/值对，修改键对象，再将新的键/值对添加回哈希表。\n\
  \n自定义 **GetHashCode** 方法或许不是一件难事。但取决于数据类型和数据分布情况，可能并不容易设计出能返回良好分布值的哈希算法。下面是一个简单的哈希算法，它用于\
  \ Point 对象时也许还不错：\n\n```csharp\ninternal sealed class Point {\n    private readonly\
  \ Int32 m_x, m_y;\n    public override Int32 GetHashCode() {\n        return m_x\
  \ ^ m_y; // 返回 m_x 和 m_y 的 XOR 结果\n    }\n    ...\n}\n```\n\n选择算法来计算类型实例的哈希码时，请遵守以下规则。\n\
  \n- 这个算法要提供良好的随机分布，使哈希表获得最佳性能。\n- 可在算法中调用某类的 **GetHashCode** 方法，并包含它的返回值。但一般不要调用\
  \ **Object** 或 **ValueType** 的 **GetHashCode** 方法，因为两者的实现都与高性能哈希算法“不沾边”。\n- 算法至少使用一个实例字段。\n\
  - 理想情况下，算法使用的字段应该不可变(immutable)；也就是说，字段应在对象构造时初始化，在对象生存期“永不言变”。\n- 算法执行速度尽量快。\n\
  - 包含相同值的不同对象应返回相同哈希码。例如，包含相同文本的两个 **String** 对象应返回相同哈希码。\n\n**System.Object** 实现的\
  \ **GetHashCode** 方法对派生类型和其中的字段一无所知，所以返回一个在对象生存期保证不变的编号。\n\n> **重要提示**　假如因为某些原因要实现自己的哈希表集合，或者要在实现的代码中调用\
  \ **GetHashCode**，记住千万不要对哈希码进行持久化，因为哈希码很容易改变。例如，一个类型未来的版本可能使用不同的算法计算对象哈希码。\n> \n\
  > 有个公司没有把这个警告放在心上。在他们的网站上，用户可选择用户名和密码来创建账户。然后，网站获取密码 **String**，调用 **GetHashCode**，将哈希码持久性存储到数据库。用户重新登录网站，输入自己的密码，网站再次调用\
  \ **GetHashCode**，并将哈希码与数据库中存储的值比较，匹配就先允许访问。不幸的是，公司升级到新版本 CLR 后，**String** 的 **GetHashCode**\
  \ 方法发生了改变，现在返回不同的哈希码。结果是所有用户都无法登录！\n\n### 5.5  dynamic 基元类型\n\nC#是类型安全的编程语言。意味着所有表达式都解析成类型的实例，编译器生成的代码只执行对该类型有效的操作。和非类型安全的语言相比，类型安全的语言的优势在于：程序\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_146_0.png)\n\n> **重要提示**　不要混淆 **dynamic**\
  \ 和 **var**。用 **var** 声明局部变量只是一种简化语法，它要求编译器根据表达式推断其类型。**var** 关键字只能在方法内部声明局部变量，而\
  \ **dynamic** 关键字可用于局部变量、字段和参数。表达式不能转型为 **var**，但能转型为 **dynamic**。必须显式初始化用 **var**\
  \ 声明的变量，但无需初始化用 **dynamic** 声明的变量。若知 C# 的 **var** 关键字的详情，请参见 9.2 节“隐式类型的局部变量”。\n\
  \n然而，从 **dynamic** 转换成另一个静态类型时，结果类型当然是静态类型。很类似地，向类型的构造器传递一个或多个 **dynamic** 实参，结果是要构造的对象的类型：\n\
  \n```csharp\ndynamic d = 123;\nvar x = (Int32) d;             // 转换：'var x'等同于'Int32\
  \ x'\nvar dt = new DateTime(d);      // 构造：'var dt'等同于'DateTime dt'\n```\n\n如果 **dynamic**\
  \ 表达式被指定为 **foreach** 语句中的集合，或者被指定为 **using** 语句中的资源，编译器会生成代码，分别将表达式转型为非泛型 **System.IEnumerable**\
  \ 接口或 **System.IDisposable** 接口。转型成功，就使用表达式，代码正常运行。转型失败，就抛出 **Microsoft.CSharp.RuntimeBinder.RuntimeBinderException**\
  \ 异常。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_146_1.png)\n\n> **重要提示**　**dynamic**\
  \ 表达式其实是和 **System.Object** 一样的类型。编译器假定你在表达式上进行的任何操作都是合法的，所以不会生成任何警告或错误。但如果试图在运行时执行无效的操作，就会抛出异常。此外，Visual\
  \ Studio 无法提供任何“智能感知”支持来帮助你写针对 **dynamic** 表达式的代码。虽然能定义对 **Object** 进行扩展的扩展方法（详情参见第\
  \ 8 章“方法”），但不能定义对 **dynamic** 进行扩展的扩展方法。另外，不能将 lambda 表达式或匿名方法（都在第 17 章“委托”中讨论）作为实参传给\
  \ **dynamic** 方法调用，因为编译器推断不了要使用的类型。\n\n以下示例 C# 代码使用 COM **IDispatch** 创建 Microsoft\
  \ Office Excel 工作簿，将一个字符串放到单元格 A1 中：\n\n```csharp\nusing Microsoft.Office.Interop.Excel;\n\
  ...\npublic static void Main() {\n    Application excel = new Application();\n \
  \   excel.Visible = true;\n    excel.Workbooks.Add(Type.Missing);\n    ((Range)excel.Cells[1,\
  \ 1]).Value = \"Text in cell A1\"; // 把这个字符串放到单元格 A1 中\n}\n```\n\n没有 **dynamic**\
  \ 类型，**excel.Cells[1, 1]** 的返回值就是 **Object** 类型，必须先转型为 **Range** 类型才能访问其 **Value**\
  \ 属性。但在为 COM 对象生成可由“运行时”调用的包装(wrapper)程序集时，COM 方法中使用的任何 VARIANT 实际都转换成 **dynamic**；这称为动态化(dynamicification)。所以，由于\
  \ **excel.Cells[1, 1]** 是 **dynamic** 类型，所以不必显式转型为 Range 类型就能访问其 Value 属性。动态化显著简化了与\
  \ COM 对象的互操作。下面是简化后的代码：\n\n```csharp\nusing Microsoft.Office.Interop.Excel;\n...\n\
  public static void Main() {\n    Application excel = new Application();\n    excel.Visible\
  \ = true;\n    excel.Workbooks.Add(Type.Missing);\n    excel.Cells[1, 1].Value =\
  \ \"Text in cell A1\"; // 把这个字符串放到单元格 A1 中\n}\n```\n\n以下代码展示了如何利用反射在 String 目标(\"\
  Jeffrey Richter\")上调用方法(\"Contains\")，向它传递一个 String 实参(\"ff\")，并将 Boolean 结果存储到局部变量\
  \ result 中：\n\n```csharp\nObject target = \"Jeffrey Richter\";\nObject arg = \"\
  ff\";\n\n// 在目标上查找和希望的实参类型匹配的方法\nType[] argTypes = new Type[] { arg.GetType() };\n\
  MethodInfo method = target.GetType().GetMethod(\"Contains\", argTypes);\n\n// 在目标上调用方法，传递希望的实参\n\
  Object[] arguments = new Object[] { arg };\nBoolean result = Convert.ToBoolean(method.Invoke(target,\
  \ arguments));\n```\n\n可利用 C#的 dynamic 类型重写上述代码，并使用获得了显著简化的语法：\n\n```csharp\ndynamic\
  \ target = \"Jeffrey Richter\";\ndynamic arg = \"ff\";\nBoolean result = target.Contains(arg);\n\
  ```\n\n我早先指出 C#编译器会生成 payload 代码，在运行时根据对象实际类型判断要执行什么操作。这些 payload 代码使用了称为运行时绑定器(runtime\
  \ binder)的类。不同编程语言定义了不同的运行时绑定器来封装自己的规则。C#“运行时绑定器”的代码在 Microsoft.CSharp.dll 程序集中，生成使用\
  \ dynamic 关键字的项目必须引用该程序集。编译器的默认响应文件 CSC.rsp 中已引用了该程序集。记住是这个程序集中的代码知道在运行时生成代码，在+操作符应用于两个\
  \ Int32 对象时执行加法，在+操作符应用于两个 String 对象时执行连接。\n\n在运行时，Microsoft.CSharp.dll 程序集必须加载到\
  \ AppDomain 中，这会损害应用程序的性能，增大内存消耗。Microsoft.CSharp.dll 还会加载 System.dll 和 System.Core.dll。如果使用\
  \ dynamic 与 COM 组件互操作，还会加载 System.Dynamic.dll。payload 代码执行时，会在运行时生成动态代码；这些代码进入驻留于内存的程序集，即“匿名寄宿的\
  \ DynamicMethods 程序集”(Anonymously Hosted DynamicMethods Assembly)，作用是当特定 call site①使用具有相同运行时类型的动态实参发出大量调用时增强动态调度性能。\n\
  \nC#内建的动态求值功能所产生的额外开销不容忽视。虽然能用动态功能简化语法，但也要看是否值得。毕竟，加载所有这些程序集以及额外的内存消耗，会对性能造成额外影响。如果程序中只是一、两个地方需要动态行为，传统做法或许更高效。即调用反射方法(如果\n\
  \n是托管对象），或者进行手动类型转换（如果是 COM 对象）。\n\n在运行时，C#的“运行时绑定器”根据对象的运行时类型分析应采取什么动态操作。绑定器首先检查类型是否实现了\
  \ **IDynamicMetaObjectProvider** 接口。如果是，就调用接口的 **GetMetaObject** 方法，它返回 **DynamicMetaObject**\
  \ 的一个派生类型。该类型能处理对象的所有成员、方法和操作符绑定。**IDynamicMetaObjectProvider** 接口和 **DynamicMetaObject**\
  \ 基类都在 **System.Dynamic** 命名空间中定义，都在 System.Core.dll 程序集中。\n\n像 Python 和 Ruby 这样的动态语言，是为它们的类型赋予了从\
  \ **DynamicMetaObject** 派生的类型，以便从其他编程语言（比如 C#）中以恰当方式访问。类似地，访问 COM 组件时，C#的“运行时绑定器”会使用知道如何与\
  \ COM 组件通信的 **DynamicMetaObject** 派生类型。COM **DynamicMetaObject** 派生类型在 System.Dynamic.dll\
  \ 程序集中定义。\n\n如果在动态表达式中使用的一个对象的类型未实现 **IDynamicMetaObjectProvider** 接口，C#编译器会将对象视为用\
  \ C#定义的普通类型的实例，利用反射在对象上执行操作。\n\n**dynamic** 的一个限制是只能访问对象的实例成员，因为 **dynamic** 变量必须引用对象。但有时需要动态调用运行时才能确定的一个类型的静态成员。我为此创建了\
  \ **StaticMemberDynamicWrapper** 类，它从 **System.Dynamic.DynamicObject** 派生。后者实现了\
  \ **IDynamicMetaObjectProvider** 接口。类内部使用了相当多的反射（这个主题将在第 23 章讨论）。以下是我的 **StaticMemberDynamicWrapper**\
  \ 类的完整代码。\n\n```csharp\ninternal sealed class StaticMemberDynamicWrapper : DynamicObject\
  \ {\n    private readonly TypeInfo m_type;\n    public StaticMemberDynamicWrapper(Type\
  \ type) { m_type = type.GetTypeInfo(); }\n\n    public override IEnumerable<String>\
  \ GetDynamicMemberNames() {\n        return m_type.DeclaredMembers.Select(mi =>\
  \ mi.Name);\n    }\n\n    public override Boolean TryGetMember(GetMemberBinder binder,\
  \ out object result) {\n        result = null;\n        var field = FindField(binder.Name);\n\
  \        if (field != null) { result = field.GetValue(null); return true; }\n\n\
  \        var prop = FindProperty(binder.Name, true);\n        if (prop != null)\
  \ { result = prop.GetValue(null, null); return true; }\n        return false;\n\
  \    }\n\n    public override Boolean TrySetMember(SetMemberBinder binder, object\
  \ value) {\n        var field = FindField(binder.Name);\n        if (field != null)\
  \ { field.SetValue(null, value); return true; }\n\n        var prop = FindProperty(binder.Name,\
  \ false);\n        if (prop != null) { prop.SetValue(null, value, null); return\
  \ true; }\n        return false;\n    }\n\n    public override Boolean TryInvokeMember(InvokeMemberBinder\
  \ binder, Object[] args,\n        out Object result) {\n        MethodInfo method\
  \ = FindMethod(binder.Name,\n            args.Select(c=>c.GetType()).ToArray());\n\
  \        if (method == null) { result = null; return false; }\n        result =\
  \ method.Invoke(null, args);\n        return true;\n    }\n}\n```\n"
- "## 第6章 类型和成员基础\n\n本章内容：\n\n- 类型的各种成员\n- 类型的可见性\n- 成员的可访问性\n- 静态类\n- 分部类、结构和接口\n\
  - 组件、多态和版本控制\n\n第 4 章和第 5 章重点介绍了类型以及所有类型的所有实例都支持的一组操作，并指出所有类型都可划分为引用类型或值类型。在本章及本部分后续的章节中，将解释如何在类型中定义各种成员，从而设计出符合需要的类型。第\
  \ 7 章～第 11 章将详细讨论各种成员。\n\n### 6.1 类型的各种成员\n\n类型中可定义 0 个或多个以下种类的成员。\n\n- **常量**　常量是指数据值恒定不变的符号。这种符号使代码更易阅读和维护。常量总与类型关联，不与类型的实例关联。常量逻辑上总是静态成员。相关内容在第\
  \ 7 章“常量和字段”讨论。\n- **字段**　字段表示只读或可读/可写的数据值。字段可以是静态的；这种字段被认为是类型状态的一部分。字段也可以是实例（非静态）；这种字段被认为是对象状态的一部分。强烈建议将字段声明为私有，防止类型或对象的状态被类型外部的代码破坏。相关内容在第\
  \ 7 章讨论。\n- **实例构造器**　实例构造器是将新对象的实例字段初始化为良好初始状态的特殊方法。相关内容在第 8 章“方法”讨论。\n- **类型构造器**　类型构造器是将类型的静态字段初始化为良好初始状态的特殊方法。相关内容在第\
  \ 8 章讨论。\n- **方法**　方法是更改或查询类型或对象状态的函数。作用于类型称为静态方法，作用于对象称为实例方法。方法通常要读写类型或对象的字段。相关内容在第\
  \ 8 章讨论。\n- **操作符重载**　操作符重载实际上是方法，定义了当操作符作用于对象时，应该如何操作该对象。由于不是所有编程语言都支持操作符重载，所以操作符重载方法不是“公共语言规范”（Common\
  \ Language Specification，CLS）的一部分。相关内容在第 8 章讨论。\n- **转换操作符**　转换操作符是定义如何隐式或显式将对象从一种类型转型为另一种类型的方法。和操作符重载方法一样，并不是所有编程语言都支持转换操作符，所以不是\
  \ CLS 的一部分。相关内容在第 8 章讨论。\n- **属性**　属性允许用简单的、字段风格的语法设置或查询类型或对象的逻辑状态，同时保证状态不被破坏。作用于类型称为静态属性，作用于对象称为实例属性。属性可以无参（非常普遍），也可以有多个参数（相当少见，但集合类用得多）。相关内容在第\
  \ 10 章“属性”讨论。\n- **事件**　静态事件允许类型向一个或多个静态或实例方法发送通知。实例（非静态）事件允许对象向一个或多个静态或实例方法发送通知。引发事件通常是为了响应提供事件的类型或对象的状态的改变。事件包含两个方法，允许静态或实例方法登记或注销对该事件的关注。除了这两个方法，事件通常还用一个委托字段来维护已登记的方法集。相关内容在第\
  \ 11 章“事件”讨论。\n- **类型**　类型可定义其他嵌套类型。通常用这个方法将大的、复杂的类型分解成更小的构建单元（building block）以简化实现。\n\
  \n再次声明，本章宗旨并非详细描述各种成员，而是帮你打好基础，阐明这些成员的共性。\n\n无论什么编程语言，编译器都必须能处理源代码，为上述每种成员生成元数据和\
  \ IL 代码。所有编程语言生成的元数据格式完全一致。这是 CLR 成为“公共语言运行时”的原因。元数据是所有语言都生成和使用的公共信息。正是由于有了元数据，用一种语言写的代码才能无缝访问用另一种语言写的代码。\n\
  \nCLR 还利用公共元数据格式决定常量、字段、构造器、方法、属性和事件在运行时的行为。简单地说，元数据是整个 Microsoft .NET Framework\
  \ 开发平台的关键，它实现了编程语言、类型和对象的无缝集成。\n\n以下 C#代码展示了一个类型定义，其中包含所有可能的成员。代码能通过编译（有一些警告），但不能代表你平常创建的类型。大多数方法没有实用价值，仅仅是为了示范编译器如何将类型及其成员转换成元数据。再次说明，后面几章会逐一对这些成员进行讨论。\n\
  \n```csharp\nusing System;\n\npublic sealed class SomeType {                   \
  \      // 1\n\n    // 嵌套类\n    private class SomeNestedType{}                  \
  \  // 2\n\n    // 常量、只读和静态可读/可写字段\n    private const Int32 c_SomeConstant = 1; \
  \          // 3\n    private readonly String m_SomeReadOnlyField = \"2\";    //\
  \ 4\n    private static Int32 s_SomeReadWriteField = 3;         // 5\n\n    // 类型构造器\n\
  \    static SomeType(){}                                      // 6\n\n    // 实例构造器\n\
  \    public SomeType(Int32 x) { }                             // 7\n    public SomeType()\
  \ { }                                    // 8\n\n    // 实例方法和静态方法\n    private String\
  \ InstanceMethod() { return null;}          // 9\n    public static void Main(){}\
  \                              //10\n\n    // 实例属性\n    public Int32 SomeProp{ \
  \                                   //11\n        get{ return 0; }             \
  \                         //12\n        set{ }                                 \
  \                //13\n    }\n\n    // 实例有参属性（索引器）\n    public Int32 this[String\
  \ s] {                             //14\n        get{return 0;}\n        set{}\n\
  \    }\n\n    // 实例事件\n    public event EventHandler SomeEvent;                \
  \      //17\n}\n```\n\n编译这个类型，用 ILDasm.exe 查看元数据，将得到如图 6-1 所示的输出。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_153_0.png)\n\
  \n图 6-1　用 ILDasm.exe 查看 SomeType 的元数据\n\n注意，源代码中定义的所有成员都造成编译器生成元数据。事实上，有的成员还造成编译器生成额外的成员和额外的元数据。例如，事件成员(17)造成编译器生成一个字段、两个方法和一些额外的元数据。目前不理解这些内容没有关系。但在学习后面几章时，希望你能回头看看这个例子，体会成员是如何定义的，它们对编译器生成的元数据有何影响。\n\
  \n### 6.2 类型的可见性\n\n要定义文件范围的类型（而不是将类型定义嵌套到另一个类型中）时，可将类型的可见性指定为 **public** 或 **internal**。**public**\
  \ 类型不仅对定义程序集中的所有代码可见，还对其他程序集中的代码可见。**internal** 类型则仅对定义程序集中的所有代码可见，对其他程序集中的代码不可见。定义类型时不显式指定可见性，C#编译器会帮你指定为\
  \ **internal**（限制比 **public** 大）。下面是几个例子。\n\n```csharp\nusing System;\n\n// 以下类型的可见性为\
  \ public，既可由本程序集中的代码访问，\n// 也可由其他程序集中的代码访问\npublic class ThisIsAPublicType { ...\
  \ }\n\n// 以下类型的可见性为 internal，只可由本程序集中的代码访问\ninternal class ThisIsAnInternalType\
  \ { ... }\n\n// 由于没有显式声明类型的可见性，所以以下类型的可见性为 internal\nclass ThisIsAlsoAnInternalType\
  \ { ... }\n```\n\n#### 友元程序集\n\n假定下述情形：某公司的团队 TeamA 在某个程序集中定义了一组工具类（utility type），并希望公司的另一个团队\
  \ TeamB 的成员使用这些类型。但由于各种原因，比如时间安排、地理位置、不同的成本中心或报表结构，这两个团队不能将他们的所有类型都生成到一个程序集中；相反，每个团队都要生成自己的程序集。\n\
  \n为了使团队 TeamB 的程序集能使用团队 TeamA 的类型，TeamA 必须将他们的所有工具类型定义为 **public**。但这意味着工具类型对所有程序集公开。就连另一家公司的开发人员也能写代码使用它们。这不是公司所希望的。这些工具类型也许做出了一些预设，而\
  \ TeamB 写代码时会确保这些预设成立。我们希望 TeamA 能有一个办法将他们的工具类型定义为 **internal**，同时仍然允许团队 TeamB 访问这些类型。CLR\
  \ 和 C#通过**友元程序集（friend assembly）**提供这方面的支持。用一个程序集中的代码对另一个程序集中的内部类型进行单元测试时，友元程序集功能也能派上用场。\n\
  \n生成程序集时，可用 **System.Runtime.CompilerServices** 命名空间中的 **InternalsVisibleTo** 特性标明它认为是“友元”的其他程序集。该特性获取标识友元程序集名称和公钥的字符串参数（传给该特性的字符串绝不能包含版本、语言文化和处理器架构）。注意当程序集认了“友元”之后，友元程序集就能访问该程序集中的所有\
  \ **internal** 类型，以及这些类型的 **internal** 成员。下面展示一个程序集如何将两个强命名程序集“Wintellect”和“Microsoft”指定为友元程序集：\n\
  \n```csharp\nusing System;\nusing System.Runtime.CompilerServices; // 为了 InternalsVisibleTo\
  \ 特性\n\n// 当前程序集中的 internal 类型可由以下两个程序集访问\n```\n\n**表 6-1　成员的可访问性**\n\n| CLR 术语\
  \ | C#术语 | 描述 |\n|---|---|---|\n| **Private** | **private** | 成员只能由定义类型或任何嵌套类型中的方法访问\
  \ |\n| **Family** | **protected** | 成员只能由定义类型、任何嵌套类型或者不管在什么程序集中的派生类型中的方法访问 |\n|\
  \ **Family and Assembly** | （不支持） | 成员只能由定义类型、任何嵌套类型或者同一程序集中定义的任何派生类型中的方法访问 |\n\
  | **Assembly** | **internal** | 成员只能由定义程序集中的方法访问 |\n| **Family or Assembly** | **protected\
  \ internal** | 成员可由任何嵌套类型、任何派生类型（不管在什么程序集）或者定义程序集中的任何方法访问 |\n| **Public** | **public**\
  \ | 成员可由任何程序集的任何方法访问 |\n\n编译代码时，编程语言的编译器检查代码是不是正确引用了类型和成员。如果代码不正确地引用了类型或成员，编译器会生成一条合适的错误消息。另外，在运行时将\
  \ IL 代码编译成本机 CPU 指令时，JIT 编译器也会确保对字段和方法的引用合法。例如，JIT 编译器如果检测到代码不正确地访问私有字段或方法，将分别抛出\
  \ **FieldAccessException** 或 **MethodAccessException** 异常。\n\n通过对 IL 代码进行验证，可确保被引用成员的可访问性在运行时得到正确兑现——即使语言的编译器忽略了对可访问性的检查。另外极有可能发生的情况是：语言编译器编译的代码会访问另一个程序集中的另一个类型的\
  \ **public** 成员，但到运行时却加载了程序集的不同版本，新版本中的 **public** 成员变成了 **protected** 或 **private**\
  \ 成员。\n\n在 C#中，如果没有显式声明成员的可访问性，编译器通常（但并不总是）默认选择 **private**（限制最大的那个）。CLR 要求接口类型的所有成员都具有\
  \ **public** 可访问性。C#编译器知道这一点，因此禁止开发人员显式指定接口成员的可访问性；编译器自动将所有成员的可访问性设为 **public**。\n\
  \n> **更多信息**　参考 C#语言规范的“Declared Accessibility”（已声明可访问性）一节，完整地了解可在 C#中向类型和成员应用哪些可访问性，以及如何根据声明的上下文来选择默认的可访问性。\n\
  \n你也许注意到了，CLR 提供了称为 **Family and Assembly** 的可访问性。但 C#不支持。C#开发团队认为这种可访问性基本没用，所以决定放弃。\n\
  \n派生类型重写基类型定义的成员时，C#编译器要求原始成员和重写成员具有相同的可访问性。也就是说，如果基类成员是 **protected** 的，派生类中的重写成员也必须是\
  \ **protected** 的。但这是 C#的限制，不是 CLR 的。从基类派生时，CLR 允许放宽但不允许收紧成员的可访问性限制。例如，类可重写基类定义的\
  \ **protected** 方法，将重写方法设为 **public**（放宽限制）。\n\n\n\n但不能重写基类定义的 **protected** 方法，将重写方法设为\
  \ **private**（收紧限制）。之所以不能在派生类中收紧对基类方法的访问，是因为 CLR 承诺派生类总能转型为基类，并获取对基类方法的访问权。如果允许派生类收紧限制，CLR\
  \ 的承诺就无法兑现了。\n\n### 6.4 静态类\n\n有一些永远不需要实例化的类，例如 Console、Math、Environment 和 ThreadPool。这些类只有\
  \ static 成员。事实上，这种类唯一的作用就是组合一组相关的成员。例如，Math 类就定义了一组执行数学运算的方法。在 C# 中，要用 static 关键字定义不可实例化的类。该关键字只能应用于类，不能应用于结构（值类型）。因为\
  \ CLR 总是允许值类型实例化，这是没办法阻止的。\n\nC# 编译器对静态类进行了如下限制。\n\n- 静态类必须直接从基类 System.Object 派生，从其他任何基类派生都没有意义。继承只适用于对象，而你不能创建静态类的实例。\n\
  - 静态类不能实现任何接口，这是因为只有使用类的实例时，才可调用类的接口方法。\n- 静态类只能定义静态成员（字段、方法、属性和事件），任何实例成员都会导致编译器报错。\n\
  - 静态类不能作为字段、方法参数或局部变量使用，因为它们都代表引用了实例的变量，而这是不允许的。编译器检测到任何这样的用法都会报错。\n\n下面是一个定义了静态成员的静态类。代码虽能通过编译（有一个警告），但该类没有做任何有意义的事情。\n\
  \n```csharp\nusing System;\n\npublic static class AStaticClass {\n    public static\
  \ void AStaticMethod() { }\n\n    public static String AStaticProperty {\n     \
  \   get { return s_AStaticField; }\n        set { s_AStaticField = value; }\n  \
  \  }\n\n    private static String s_AStaticField;\n\n    public static event EventHandler\
  \ AStaticEvent;\n}\n```\n\n将上述代码编译成库（DLL）程序集，用 ILDasm.exe 查看会得到如图 6-2 所示的结果。如你所见，使用关键字\
  \ static 定义类，将导致 C# 编译器将该类标记为 abstract 和 sealed。另外，编译器不在类型中生成实例构造器方法，你在图 6-2 中看不到实例构造器（.ctor）方法。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_158_0.png)\n\n图 6-2　ILDasm.exe 表明静态类在元数据中是抽象密封类\n\
  \n### 6.5 分部类、结构和接口\n\n本节要讨论分部类、结构和接口。**partial** 关键字告诉 C# 编译器：类、结构或接口的定义源代码可能要分散到一个或多个源代码文件中。将类型源代码分散到多个文件的原因有三。\n\
  \n- **源代码控制** 假定类型定义包含大量源代码，一个程序员把它从源代码控制系统中签出（check out）以进行修改。没有其他程序员能同时修改这个类型，除非之后执行合并（merge）。使用\
  \ **partial** 关键字可将类型的代码分散到多个源代码文件中，每个文件都可单独签出，多个程序员能同时编辑类型。\n- **在同一个文件中将类或结构分解成不同的逻辑单元**\
  \ 我有时会创建一个类型来提供多个功能，使类型能提供完整解决方案。为简化实现，有时会在一个源代码文件中重复声明同一个分部类型。然后，分部类型的每个部分都实现一个功能，并配以它的全部字段、方法、属性、事件等。这样就可方便地看到组合以提供一个功能的全体成员，从而简化编码。与此同时，可以方便地将分部类型的一部分注释掉，以便从类中删除一个完整的功能，代之以另一个实现（通过分部类型的一个新的部分）。\n\
  - **代码拆分** 在 Microsoft Visual Studio 中创建新项目时，一些源代码文件会作为项目一部分自动创建。这些源代码文件包含模板，能为项目开个好头。使用\
  \ Visual Studio 在设计图面上拖放控件时，Visual Studio 自动生成源代码，并将代码拆分到不同的源代码文件中。这提高了开发效率。很久以前，生成的代码是直接放到当前正在处理的那个源代码文件中的。这样做的问题在于，如果不小心编辑了一下生成的代码，设计器行为就可能失常。从\
  \ Visual Studio 2005 开始，新建窗体、控件等的时候，Visual Studio 自动创建两个源代码文件：一个用于你的代码，另一个用于设计器生成的代码。由于设计器的代码在单独的文件中，所以基本上杜绝了不小心编辑到它的可能。\n\
  \n要将 **partial** 关键字应用于所有文件中的类型。这些文件编译到一起时，编译器会合并代码，在最后的 .exe 或 .dll 程序集文件（或 .netmodule\
  \ 模块文件）中生成单个类型。“分部类型”功能完全由 C# 编译器实现，CLR 对该功能一无所知，这解释了一个类型的所有源代码文件为什么必须使用相同编程语言，而且必须作为一个编译单元编译到一起。\n\
  \n### 6.6 组件、多态和版本控制\n\n面向对象编程（Object-Oriented Programming，OOP）已问世多年。它在上个世纪 70 年代末、80\
  \ 年代初首次投入应用时，应用程序规模还非常小，而且使应用程序运行起来所需的全部代码都由同一家公司编写。当然，那时确实有操作系统，应用程序也确实使用了操作系统的一些功能，但和今天的操作系统相比，那时的操作系统所提供的功能实在是太少了。\n\
  \n如今软件变得相当复杂，而且用户希望应用程序提供更丰富的功能，如 GUI、菜单、鼠标输入、手写板输入、打印输出、网络功能等。正是由于这个原因，操作系统和开发平台在这几年中取得了迅猛发展。另外，应用程序的开发也必须分工。不能再像以前那样，一个或几个开发人员就能写出一个应用程序需要的全部代码。这样做要么不可能，要么效率太低。现在的应用程序一般都包含了由许多不同的公司生成的代码。这些代码通过面向对象编程机制契合到一起。\n\
  \n**组件软件编程（Component Software Programming，CSP）正是 OOP 发展到极致的成果。**下面列举组件的一些特点。\n\n\
  - 组件（.NET Framework 称为程序集）有“已经发布”的意思。\n- 组件有自己的标识（名称、版本、语言文化和公钥）。\n- 组件永远维持自己的标识（程序集中的代码永远不会静态链接到另一个程序集中；.NET\
  \ 总是使用动态链接）。\n- 组件清楚指明它所依赖的组件（引用元数据表）。\n- 组件应编档它的类和成员。C# 语言通过源代码内的 XML 文档和编译器的 /doc\
  \ 命令行开关提供这个功能。\n- 组件必须指定它需要的安全权限。CLR 的代码访问安全性（Code Access Security，CAS）机制提供这个功能。\n\
  - 组件要发布在任何“维护版本”中都不会改变的接口（对象模型）。“维护版本”（servicing version）代表组件的新版本，它向后兼容组件的原始版本。通常，“维护版本”包含\
  \ bug 修复、安全补丁或者一些小的功能增强。但在“维护版本”中，不能要求任何新的依赖关系，也不能要求任何附加的安全权限。\n\n如最后一点所述，CSP 有很大一部分涉及版本控制。组件随着时间而改变，并根据不同的时间表来发布。版本控制使\
  \ CSP 的复杂性上升到了 OOP 无法企及的高度。（在 OOP 中，全部代码都由一家公司编写和测试，并作为一个整体发布。）本节将重点放在组件的版本控制上。\n\
  \n.NET Framework 中的版本号包含 4 个部分：主版本号（major version）、次版本号（minor version）、内部版本号（build\
  \ number）和修订号（revision）。例如，版本号为 1.2.3.4 的程序集，其主版本号为 1，次版本号为 2，内部版本号为 3，修订号为 4。major/minor\
  \ 部分通常代表程序集的一个连续的、稳定的功能集，而 build/revision 部分通常代表对这个功能集的一次维护。\n\n假定某公司发布了版本号为 2.7.0.0\
  \ 的程序集。之后，为了修复该组件的 bug，他们可以生成一个新的程序集，并只改动版本号的 build/revision 部分，比如 2.7.1.34。这表明该程序集是维护版本，向后兼容原始版本（2.7.0.0）。\n\
  \n另一方面，假定该公司想生成程序集的新版本，而且由于发生了重大变化，所以不准备向后兼容程序集的原始版本。在这种情况下，公司实际是要创建全新组件，major/minor\
  \ 版本号（比如 3.0.0.0）应该和原来的组件不同。\n\n> **注意**　此处只是说明应该如何看待版本号。遗憾的是，CLR 不以这种方式看待版本号。现在，CLR\
  \ 将版本号看成是固定值，如果某个程序集依赖版本号为 1.2.3.4 的另一个程序集，CLR 只会尝试加载版本号为 1.2.3.4 的程序集（除非设置了绑定重定向）。\n\
  \n前面讨论了如何使用版本号更新组件的标识，从而反映出组件的新版本。下面要讨论如何利用 CLR 和编程语言（比如 C#）提供的功能来自动适应组件可能发生的变化。\n\
  \n将一个组件（程序集）中定义的类型作为另一个组件（程序集）中的一个类型的基类使用时，便会发生版本控制问题。显然，如果基类的版本（被修改得）低于派生类，派生类的行为也会改变，这可能造成类的行为失常。在多种情形中，由于派生类型会重写基类型定义的虚方法，所以这个问题显得尤其突出。\n\
  \nC# 提供了 5 个能影响组件版本控制的关键字，可将它们应用于类型以及/或者类型成员。这些关键字直接对应 CLR 用于支持组件版本控制的功能。表 6-2 总结了与组件版本控制相关的\
  \ C# 关键字，并描述了每个关键字如何影响类型或者类型成员的定义。\n\n表 6-2　C# 关键字及其对组件版本控制的影响\n\n| C# 关键字 | 类型\
  \ | 方法/属性/事件 | 常量/字段 |\n|---|---|---|---|\n| abstract | 表示不能构造该类型的实例 | 表示为了构造派生类型的实例，派生类型必须重写并实现这个成员\
  \ | （不允许） |\n| virtual | （不允许） | 表示这个成员可由派生类型重写 | （不允许） |\n| override | （不允许） |\
  \ 表示派生类型正在重写基类型的成员 | （不允许） |\n| sealed | 表示该类型不能用作基类型 | 表示这个成员不能被派生类型重写，只能将该关键字应用于重写虚方法的方法\
  \ | （不允许） |\n| new | 应用于嵌套类型、方法、属性、事件、常量或字段时，表示该成员与基类中相似的成员无任何关系 |  |  |\n\n上述代码理论上并无问题。变量\
  \ **p** 确实为 **null**，但在调用非虚方法（**GetFive**）时，CLR 唯一需要知道的就是 **p** 的数据类型（**Program**）。如果真的调用\
  \ **GetFive**，**this** 实参值是 **null**。由于 **GetFive** 方法内部并未使用该实参，所以不会抛出 **NullReferenceException**\
  \ 异常。但由于 C# 编译器生成 **callvirt** 而不是 **call** 指令，因此上述代码抛出了 **NullReferenceException**\
  \ 异常。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_163_0.png)\n\n> **重要提示**　将方法定义为非虚方法后，将来永远都不要把它更改为虚方法。这是因为某些编译器会用\
  \ **call** 而不是 **callvirt** 调用非虚方法。如果方法从非虚变成虚，而引用代码没有重新编译，会以非虚方式调用虚方法，造成应用程序行为无法预料。用\
  \ C# 写的引用代码不会出问题，因为 C# 用 **callvirt** 指令调用所有实例方法。但如果引用代码是用其他语言写的，就可能出问题。\n\n编译器有时用\
  \ **call** 而不是 **callvirt** 调用虚方法。虽然刚开始有点难以理解，但以下代码证明了有时真的需要这样做：\n\n```csharp\n\
  internal class SomeClass {\n    // ToString 是基类 Object 定义的方法\n    public override\
  \ String ToString() {\n\n    // 编译器使用 IL 指令'call',\n    // 以非虚方式调用 Object 的 ToString\
  \ 方法\n\n    // 如果编译器用'callvirt'而不是'call',\n    // 那么该方法将递归调用自身，直至栈溢出\n    return\
  \ base.ToString();\n    }\n}\n```\n\n调用虚方法 **base.ToString** 时，C# 编译器生成 **call**\
  \ 指令来确保以非虚方式调用基类的 **ToString** 方法。这是必要的，因为如果以虚方式调用 **ToString**，调用会递归执行，直至线程溢出，这显然不是你所期望的。\n\
  \n编译器调用值类型定义的方法时倾向于使用 **call** 指令，因为值类型是密封的。这意味着即使值类型含有虚方法也不用考虑多态性，这使调用更快。此外，值类型实例的本质保证它永不为\
  \ **null**，所以永远不抛出 **NullReferenceException** 异常。最后，如果以虚方式调用值类型中的虚方法，CLR 要获取对值类型的类型对象的引用，以便引用（类型对象中的）方法表，这要求对值类型装箱。装箱对堆造成更大压力，迫使进行更频繁的垃圾回收，使性能受到影响。\n\
  \n无论用 **call** 还是 **callvirt** 调用实例方法或虚方法，这些方法通常接收隐藏的 **this** 实参作为方法第一个参数。**this**\
  \ 实参引用要操作的对象。\n\n设计类型时应尽量减少虚方法数量。首先，调用虚方法的速度比调用非虚方法慢。其次，JIT 编译器不能内嵌（inline）虚方法，这进一步影响性能。第三，虚方法使组件版本控制变得更脆弱，详情参见下一节。第四，定义基类型时，经常需要提供一组重载的简便方法（convenience\
  \ method）。如果希望这些方法是多态的，最好的办法就是使最复杂的方法成为虚方法，使所有重载的简便方法成为非虚方法。顺便说一句，遵循这个原则，还可在改善组件版本控制的同时，不至于对派生类型产生负面影响。下面是一个例子：\n\
  \n```csharp\npublic class Set {\n    private Int32 m_length = 0;\n\n    // 这个重载的简便方法是非虚的\n\
  \    public Int32 Find(Object value) {\n        return Find(value, 0, m_length);\n\
  \    }\n\n    // 这个重载的简便方法是非虚的\n    public Int32 Find(Object value, Int32 startIndex)\
  \ {\n        return Find(value, startIndex, m_length - startIndex);\n    }\n\n \
  \   // 功能最丰富的方法是虚方法，可以被重写\n    public virtual Int32 Find(Object value, Int32 startIndex,\
  \ Int32 endIndex)\n    {\n        // 可被重写的实现放在这里...\n    }\n\n    // 其他方法放在这里\n\
  }\n```\n\n#### 6.6.2 合理使用类型的可见性和成员的可访问性\n\n使用 .NET Framework 时，应用程序是由多个公司生产的多个程序集所定义的类型构成的。这意味着开发人员对所用的组件以及其中定义的类型几乎没有什么控制权。开发人员通常无法访问源代码（甚至可能不知道组件用什么编程语言创建），而且不同组件的版本发布一般都基于不同的时间表。除此之外，由于多态和受保护成员，基类开发人员必须信任派生类开发人员所写的代码。当然，派生类的开发人员也必须信任从基类继承的代码。设计组件和类型时，应慎重考虑这些问题。\n\
  \n本节描述了设计类型时应如何思考这些问题，具体就是如何正确设置类型的可见性和成员的可访问性来取得最优结果。\n\n首先，定义新类型时编译器应默认生成密封类，使它不能作为基类使用。但是，包括\
  \ C# 编译器在内的许多编译器都默认生成非密封类，只是允许开发人员使用关键字 `sealed` 将类型显式标记为密封。我认为现在的编译器使用了错误的默认设定。不过，亡羊补牢，为时不晚，希望将来的编译器能改正这一错误。密封类之所以比非密封类更好，有以下三个方面的原因。\n\
  \n- **版本控制**：如果类最初密封，将来可在不破坏兼容性的前提下更改为非密封。但如果最初非密封，将来就不可能更改为密封，因为这将中断派生类。另外，如果非密封类定义了非密封虚方法，必须在新版本的类中保持虚方法调用顺序，否则可能中断派生类。\n\
  - **性能**：如上一节所述，调用虚方法在性能上不及调用非虚方法，因为 CLR 必须在运行时查找对象的类型，判断要调用的方法由哪个类型定义。但是，如果 JIT\
  \ 编译器看到使用密封类型的虚方法调用，就可采用非虚方式调用虚方法，从而生成更高效的代码。之所以能这么做，是因为密封类自然不会有派生类。例如，在下面的代码中，JIT\
  \ 编译器可采用非虚方式调用虚方法 **ToString**：\n\n  ```csharp\n  using System;\n  public sealed\
  \ class Point {\n      private Int32 m_x, m_y;\n\n      public Point(Int32 x, Int32\
  \ y) { m_x = x; m_y = y; }\n\n      public override String ToString() {\n      \
  \    return String.Format(\"({0}, {1})\", m_x, m_y);\n      }\n\n      public static\
  \ void Main() {\n          Point p = new Point(3, 4);\n\n          // C#编译器在此生成\
  \ callvirt 指令，\n          // 但 JIT 编译器将优化这个调用，并生\n          // 成低代价地调用 ToString。这\n\
  \          // 是因为 p 的类型是 Point，而 Point\n          // 是密封类\n          Console.WriteLine(p.ToString());\n\
  \      }\n  }\n  ```\n\n- **安全性和可预测性**：类必须保护自己的状态，不允许被破坏。当类处于非密封状态时，只要它的任何数据字段或者在内部对这些字段进行处理的方法是可以访问的，而且不是私有的，派生类就能访问和更改基类的状态。另外，派生类既可重写基类的虚方法，也可直接调用这个虚方法在基类中的实现。一旦将某个方法、属性或事件设为\
  \ **virtual**，基类就会丧失对它的行为和状态的部分控制权。所以，除非经过了认真考虑，否则这种做法可能导致对象的行为变得不可预测，还可能留下安全隐患。\n\
  \n密封类的问题是可能给类型的用户造成巨大的不便。有时，开发人员希望从现有类型派生出一个类，在其中添加额外字段或状态信息来满足自己应用程序的需要。他们甚至希望在派生类中定义辅助方法（helper\
  \ method）或简便方法（convenience method）来操纵这些额外的字段。虽然 CLR 没有提供机制允许你用辅助方法或字段扩展已生成的类型，但可利用\
  \ C# 的扩展方法（第 8 章）模拟辅助方法，还可利用 **ConditionalWeakTable** 类（第 21 章）模拟跟踪状态。\n\n以下是我自己定义类时遵循的原则。\n\
  \n- 定义类时，除非确定要将其作为基类，并允许派生类对它进行特化①，否则总是显式地指定为 **sealed** 类。如前所述，这与 C# 以及其他许多编译器的默认方式相反。另外，我默认将类指定为\
  \ **internal** 类，除非我希望在程序集外部公开这个类。幸好，如果不显式指定类型的可见性，C# 编译器默认使用的就是 **internal**。如果我真的要定义一个可\n\
  \n① 特化（specialization）是指继承了基类的东西不算，还对这些东西进行特殊处理。——译注\n\n\n\n由其他人继承的类，同时不希望允许特化，那么我会重写并密封继承的所有虚方法。\n\
  \n- 类的内部，我总是毫不犹豫地将数据字段定义为 **private**。幸好，C#默认就将字段标记为 **private**。事实上，我情愿 C#强制所有字段都标记为\
  \ **private**，根本不允许 **protected**、**internal** 和 **public** 等等。状态一旦公开，就极易产生问题，造成对象的行为无法预测，并留下安全隐患。即使只将一些字段声明为\
  \ **internal** 也会如此。即使在单个程序集，也很难跟踪引用了一个字段的所有代码，尤其是假如代码由几个开发人员编写，并编译到同一个程序集中了。\n\
  - 在类的内部，我总是将自己的方法、属性和事件定义为 **private** 和非虚。幸好，C#默认也是这样的。当然，我会将某个方法、属性和事件定义为 **public**，以便公开类型的某些功能。我会尽量避免将上述任何成员定义为\
  \ **protected** 或 **internal**，因为这会使类型面临更大的安全风险。即使迫不得已，我也会尽量选择 **protected** 或 **internal**。**virtual**\
  \ 永远最后才考虑，因为虚成员会放弃许多控制，丧失独立性，变得彻底依赖于派生类的正确行为。\n- OOP 有一条古老的格言，大意是当事情变得过于复杂时，就搞更多的类型出来。当算法的实现开始变得复杂时，我会定义一些辅助类型来封装独立的功能。如果定义的辅助类型只由一个“超类型”使用，我会在“超类型”中嵌套这些辅助类型。这样除了可以限制范围，还允许嵌套的辅助类型中的代码引用“超类型”中定义的私有成员。但是，Visual\
  \ Studio 的代码分析工具(FxCopCmd.exe)强制执行了一条设计规则，即对外公开的嵌套类型必须在文件或程序集范围中定义，不能在另一个类型中定义。之所以会有这个规则，是因为一些开发人员觉得引用嵌套类型时，所用的语法过于繁琐。我赞同该规则，自己绝不会定义公共嵌套类型。\n\
  \n#### 6.6.3 对类型进行版本控制时的虚方法的处理\n\n如前所述，在组件软件编程(Component Software Programming，CSP)环境中，版本控制是非常重要的问题。第\
  \ 3 章已讨论了部分版本控制问题。那一章解释了强命名程序集，并讨论了管理员如何确保应用程序绑定到和生成/测试时一样的程序集。但是，还有其他版本控制问题会造成源代码兼容性问题。例如，如果类型要作为基类型使用，增加或修改它的成员时务必非常小心。下面来看一些例子。\n\
  \n假定 CompanyA 定义了 **Phone** 类型：\n\n```csharp\nnamespace CompanyA {\n    public class\
  \ Phone {\n        public void Dial() {\n            Console.WriteLine(\"Phone.Dial\"\
  );\n            //在这里执行拨号操作\n        }\n    }\n}\n```\n\n再假定 CompanyB 定义了 **BetterPhone**\
  \ 类型，使用 CompanyA 的 **Phone** 类型作为基类型：\n\n```csharp\nnamespace CompanyB {\n    public\
  \ class BetterPhone : CompanyA.Phone {\n        public void Dial() {\n         \
  \   Console.WriteLine(\"BetterPhone.Dial\");\n            EstablishConnection();\n\
  \            base.Dial();\n        }\n\n        protected virtual void EstablishConnection()\
  \ {\n            Console.WriteLine(\"BetterPhone.EstablishConnection\");\n     \
  \       // 在这里执行建立连接的操作\n        }\n    }\n}\n```\n\n**CompanyB** 编译上述代码时，C#编译器生成以下警告消息：\n\
  \n```text\nwarning CS0108: \"CompanyB.BetterPhone.Dial()\"隐藏了继承的成员\n    \"CompanyA.Phone.Dial()\"\
  。如果是有意隐藏，请使用关键字 new\n```\n\n该警告告诉开发人员 **BetterPhone** 类正在定义一个 **Dial** 方法，它会隐藏 **Phone**\
  \ 类定义的 **Dial**。新方法可能改变 **Dial** 的语义(这个语义是 CompanyA 最初创建 **Dial** 方法时定义的)。\n\n编译器就潜在的语言不匹配问题发出警告，这是一个令人欣赏的设计。编译器甚至贴心地告诉你如何消除这条警告，办法是在\
  \ **BetterPhone** 类中定义 **Dial** 时，在前面加一个 **new** 关键字。以下是改正的 **BetterPhone** 类：\n\
  \n```csharp\nnamespace CompanyB {\n    public class BetterPhone : CompanyA.Phone\
  \ {\n\n        // 新的Dial 方法变得与Phone 的Dial 方法无关了\n        public new void Dial()\
  \ {\n            Console.WriteLine(\"BetterPhone.Dial\");\n            EstablishConnection();\n\
  \            base.Dial();\n        }\n\n        protected virtual void EstablishConnection()\
  \ {\n            Console.WriteLine(\"BetterPhone.EstablishConnection\");\n     \
  \       // 在这里执行建立连接的操作\n        }\n    }\n}\n```\n\n现在，**CompanyB** 能在其应用程序中使用\
  \ **BetterPhone.Dial**。以下是 **CompanyB** 可能写的一些示例代码：\n\n```csharp\npublic sealed\
  \ class Program{\n    public static void Main(){\n        CompanyB.BetterPhone phone\
  \ = new CompanyB.BetterPhone();\n        phone.Dial();\n    }\n}\n```\n\n运行上述代码，输出结果如下所示：\n\
  \n```text\nBetterPhone.Dial\nBetterPhone.EstablishConnection\nPhone.Dial\n```\n\n\
  输出符合 **CompanyB** 的预期。调用 **Dial** 方法时，会调用由 **BetterPhone** 类定义的新 **Dial**。在新 **Dial**\
  \ 中，先调用虚方法 **EstablishConnection**，再调用基类型 **Phone** 中的 **Dial** 方法。\n\n现在，假定几家公司计划使用\
  \ CompanyA 的 Phone 类型。再假定这几家公司都认为在 Dial 方法中建立连接的主意非常好。CompanyA 收到这个反馈，决定对 Phone\
  \ 类进行修订：\n\n```csharp\nnamespace CompanyA{\n    public class Phone{\n        public\
  \ void Dial(){\n            Console.WriteLine(\"Phone.Dial\");\n            EstablishConnection();\n\
  \            // 在这里执行拨号操作\n        }\n\n        protected virtual void EstablishConnection(){\n\
  \            Console.WriteLine(\"Phone.EstablishConnection\");\n            // 在这里执行建立连接的操作\n\
  \        }\n    }\n}\n```\n\n现在，一旦 CompanyB 编译它的 BetterPhone 类型(从 CompanyA 的新版本\
