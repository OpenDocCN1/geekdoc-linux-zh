  \n图 14-1  字符串排序结果\n\n> **注意①** 源代码不要用 ANSI 格式保存，否则日语字符会丢失。要在 Microsoft Visual Studio\
  \ 中保存这个文件，请打开“另存文件为”对话框，单击“保存”按钮右侧的下箭头，选择“编码保存”，并选择“Unicode (UTF-8 带签名)-代码页 65001”。Microsoft\
  \ C#编译器用这个代码页就能成功解析源代码文件了。\n\n除了 **Compare**，**CompareInfo** 类还提供了 **IndexOf**，**LastIndexOf**，**IsPrefix**\
  \ 和 **IsSuffix** 方法。由于所有这些方法都提供了接受 **CompareOptions** 枚举值的重载版本，所以能提供比 **String**\
  \ 类定义的 **Compare**，**IndexOf**，**LastIndexOf**，**StartsWith** 和 **EndsWith** 方法更全面的控制。另外，FCL\
  \ 的 **System.StringComparer** 类也能执行字符串比较，它适合对大量不同的字符串反复执行同一种比较。\n\n#### 14.2.4 字符串留用\n\
  \n如上一节所述，检查字符串相等性是应用程序的常见操作，也是一种可能严重损害性能的操作。执行序号(ordinal)相等性检查时，CLR 快速测试两个字符串是否包含相同数量的字符。答案否定，字符串肯定不相等；答案肯定，字符串则可能相等。然后，CLR\
  \ 必须比较每个单独的字符才能最终确认。而执行对语言文化敏感的比较时，CLR 必须比较所有单独的字符，因为两个字符串即使长度不同也可能相等。\n\n此外，在内存中复制同一个字符串的多个实例纯属浪费，因为字符串是“不可变”(immutable)的。在内存中只保留字符串的一个实例将显著提升内存的利用率。需要引用字符串的所有变量只需指向同一个字符串对象。\n\
  \n如果应用程序经常对字符串进行区分大小写的序号比较，或者事先知道许多字符串对象都有相同的值，就可利用 CLR 的字符串留用(string interning)机制来显著提升性能。CLR\
  \ 初始化时会创建一个内部哈希表。在这个表中，键(key)是字符串，而值(value)是对托管堆中的 String 对象的引用。哈希表最开始是空的(理应如此)。String\
  \ 类提供了两个方法，便于你访问这个内部哈希表：\n\n```\npublic static String Intern(String str);\npublic\
  \ static String IsInterned(String str);\n```\n\n第一个方法 Intern 获取一个 String，获得它的哈希码，并在内部哈希表中检查是否有相匹配的。如果存在完全相同的字符串，就返回对现有\
  \ String 对象的引用。如果不存在完全相同的字符串，就创建字符串的副本，将副本添加到内部哈希表中，返回对该副本的引用。如果应用程序不再保持对原始 String\
  \ 对象的引用，垃圾回收器就可释放那个字符串的内存。注意垃圾回收器不能释放内部哈希表引用的字符串，因为哈希表正在容纳对它们的引用。除非卸载 AppDomain\
  \ 或进程终止，否则内部哈希表引用的 String 对象不能被释放。\n\n和 Intern 方法一样，IsInterned 方法也获取一个 String，并在内部哈希表中查找它。如果哈希表中有匹配的字符串，IsInterned\
  \ 就返回对这个留用(interned)字符串对象的引用。但如果没有，IsInterned 会返回 null，不会将字符串添加到哈希表中。\n\n程序集加载时，CLR\
  \ 默认留用程序集的元数据中描述的所有字面值(literal)字符串。Microsoft 知道可能因为额外的哈希表查找而显著影响性能，所以现在能禁用此功能。如果程序集用\
  \ System.Runtime.CompilerServices.CompilationRelaxationsAttribute 进行了标记，并指定了 System.Runtime.CompilerServices.CompilationRelaxations.NoStringInterning\
  \ 标志值，那么根据 ECMA 规范，CLR 可能选择不留用那个程序集的元数据中定义的所有字符串。注意，为了提升应用程序性能，C# 编译器在编译程序集时总是指定上述两个特性和标志。\n\
  \n即使程序集指定了这些特性和标志，CLR 也可能选择对字符串进行留用，但不要依赖 CLR 的这个行为。事实上，除非显式调用 String 的 Intern 方法，否则永远都不要以“字符串已留用”为前提来写代码。以下代码演示了字符串留用：\n\
  \n```\nString s1 = \"Hello\";\nString s2 = \"Hello\";\nConsole.WriteLine(Object.ReferenceEquals(s1,\
  \ s2)); // 显示'False'\n\ns1 = String.Intern(s1);\ns2 = String.Intern(s2);\nConsole.WriteLine(Object.ReferenceEquals(s1,\
  \ s2)); // 显示'True'\n```\n\n在第一个 ReferenceEquals 方法调用中，s1 引用堆中的\"Hello\"字符串对象，而\
  \ s2 引用堆中的另一个\"Hello\"对象。由于引用不同，所以应该显示 **False**。但在 CLR 的 4.5 版本上运行，实际显示的是 **True**。这是由于这个版本的\
  \ CLR 选择忽视 C#编译器插入的特性和标志。程序集加载到 AppDomain 中时，CLR 对字面值(literal)字符串\"Hello\"进行留用，结果是\
  \ **s1** 和 **s2** 引用堆中的同一个\"Hello\"字符串。但如前所述，你的代码永远不要依赖这个行为，因为未来版本的 CLR 有可能会重视这些特性和标志，从而不对\"\
  Hello\"字符串进行留用。事实上，使用 NGen.exe 实用程序编译这个程序集的代码，CLR 的 4.5 版本确实会使用这些特性和标志。\n\n在第二个\
  \ **ReferenceEquals** 方法调用之前，\"Hello\"字符串被显式留用，**s1** 现在引用已留用的\"Hello\"。然后，通过再次调用\
  \ **Intern**，**s2** 引用和 **s1** 一样的\"Hello\"字符串。所以第二个 **ReferenceEquals** 调用保证结果是\
  \ **True**，无论程序集在编译时是否设置了特性和标志。\n\n现在通过一个例子理解如何利用字符串留用来提升性能并减少内存耗用。以下 **NumTimesWordAppearsEquals**\
  \ 方法获取两个参数：一个单词和一个字符串数组。每个数组元素都引用了一个单词。方法统计指定单词在单词列表中出现了多少次并返回计数：\n\n```csharp\n\
  private static Int32 NumTimesWordAppearsEquals(String word, String[] wordlist) {\n\
  \    Int32 count = 0;\n    for (Int32 wordnum = 0; wordnum < wordlist.Length; wordnum++)\
  \ {\n        if (word.Equals(wordlist[wordnum], StringComparison.Ordinal))\n   \
  \         count++;\n    }\n    return count;\n}\n```\n\n这个方法调用了 **String** 的 **Equals**\
  \ 方法，后者在内部比较字符串的各个单独字符，并核实所有字符都匹配。这个比较可能很慢。此外，**wordlist** 数组可能有多个元素引用了含有相同字符内容的不同\
  \ **String** 对象。这意味着堆中可能存在多个内容完全相同的字符串，并会在将来进行垃圾回收时幸存下来。\n\n现在看一下这个方法的另一个版本。新版本利用了字符串留用：\n\
  \n```csharp\nprivate static Int32 NumTimesWordAppearsIntern(String word, String[]\
  \ wordlist) {\n    // 这个方法假定 wordlist 中的所有数组元素都引用已留用的字符串\n    word = String.Intern(word);\n\
  \    Int32 count = 0;\n    for (Int32 wordnum = 0; wordnum < wordlist.Length; wordnum++)\
  \ {\n        if (Object.ReferenceEquals(word, wordlist[wordnum]))\n            count++;\n\
  \    }\n    return count;\n}\n```\n\n这个方法留用了单词，并假定 **wordlist** 包含对已留用字符串的引用。首先，假如一个单词在单词列表中多次出现，这个版本有助于节省内存。因为在这个版本中，**wordlist**\
  \ 会包含对堆中同一个 **String** 对象的多个引用。其次，这个版本更快。因为比较指针就知道指定单词是否在数组中。\n\n虽然 **NumTimesWordAppearsIntern**\
  \ 方法本身比 **NumTimesWordAppearsEquals** 方法快，但在使用 **NumTimesWordAppearsIntern** 方法时，应用程序的总体性能是可能变慢的。这是因为所有字符串在添加到\
  \ **wordlist** 数组时(这里没有列出具体的代码)都要花时间进行留用。\n\n用。但如果应用程序要为同一个 **wordlist** 多次调用 **NumTimesWordAppearsIntern**，这个方法真的能提升应用程序性能和内存利用率。总之，字符串留用虽然有用，但使用须谨慎。事实上，这正是\
  \ C# 编译器默认不想启用字符串留用的原因。①\n\n① 虽然编译器应用了特性并设置了不进行字符串留用的标志，但 CLR 选择忽视这些设置，你也没有办法。——译注\n\
  \n#### 14.2.5　字符串池\n\n编译源代码时，编译器必须处理每个字面值（literal）字符串，并将它嵌入托管模块的元数据中。同一个字符串在源代码中多次出现，把它们都嵌入元数据会使生成的文件无谓地增大。\n\
  \n为了解决这个问题，许多编译器（包括 C# 编译器）只在模块的元数据中将字面值字符串写入一次。引用该字符串的所有代码都被修改成引用元数据中的同一个字符串。编译器将单个字符串的多个实例合并成一个实例，能显著减少模块的大小。但这并不是新技术，C/C++\
  \ 编译器多年来一直在采用这个技术（Microsoft 的 C/C++ 编译器称之为“字符串池”）。尽管如此，字符串池仍是提升字符串性能的另一种行之有效的方式，而你应注意到它的存在。\n\
  \n#### 14.2.6　检查字符串中的字符和文本元素\n\n虽然字符串比较对于排序或测试相等性很有用，但有时只是想检查一下字符串中的字符。**String**\
  \ 类型为此提供了几个属性和方法，包括 **Length**，**Chars**（一个 C# 索引器②），**GetEnumerator**，**ToCharArray**，**Contains**，**IndexOf**，**LastIndexOf**，**IndexOfAny**\
  \ 和 **LastIndexOfAny**。\n\n② 或者说有参属性。——译注\n\n**System.Char** 实际代表一个 16 位 Unicode\
  \ 码值，而且该值不一定就等于一个抽象 Unicode 字符。例如，有的抽象 Unicode 字符是两个码值的组合。U+0625（阿拉伯字母 Alef with\
  \ Hamza below）和 U+0650（Arabic Kasra）字符组合起来就构成了一个抽象字符或者文本元素（text element）。\n\n除此之外，有的\
  \ Unicode 文本元素要求用两个 16 位值表示。第一个称为“高位代理项”（high surrogate），第二个称为“低位代理项”（low surrogate）。其中，高位代理项范围在\
  \ U+D800 到 U+DBFF 之间，低位代理项范围在 U+DC00 到 U+DFFF 之间。有了代理项，Unicode 就能表示 100 万个以上不同的字符。\n\
  \n美国和欧洲很少使用代理项，东亚各国则很常用。为了正确处理文本元素，应当使用 **System.Globalization.StringInfo** 类型。使用这个类型最简单的方式就是构造它的实例，向构造器传递一个字符串。然后可以查询\
  \ **StringInfo** 的 **LengthInTextElements** 属性来了解字符串中有多少个文本元素。接着就可以调用 **StringInfo**\
  \ 的 **SubstringByTextElements** 方法来提取所有文本元素，或者提取指定数量的连续文本元素。\n\n**StringInfo** 类还提供了静态方法\
  \ **GetTextElementEnumerator**，它返回一个 **System.Globalization.TextElementEnumerator**\
  \ 对象，允许枚举字符串中包含的所有抽象 Unicode 字符。最后，可调用 StringInfo 的静态方法 ParseCombiningCharacters\
  \ 来返回一个 Int32 数组。从数组长度就可以知道字符串包含多少个文本元素。每个数组元素都是一个文本元素的起始码值索引。\n\n以下代码演示了使用 StringInfo\
  \ 类来处理字符串中的文本元素的各种方式：\n\n```csharp\nusing System;\nusing System.Text;\nusing System.Globalization;\n\
  using System.Windows.Forms;\n\npublic sealed class Program {\n    public static\
  \ void Main() {\n        // 以下字符串包含组合字符\n        String s = \"a\\u0304\\u0308bc\\\
  u0327\";\n        SubstringByTextElements(s);\n        EnumTextElements(s);\n  \
  \      EnumTextElementIndexes(s);\n    }\n\n    private static void SubstringByTextElements(String\
  \ s) {\n        String output = String.Empty;\n\n        StringInfo si = new StringInfo(s);\n\
  \        for (Int32 element = 0; element < si.LengthInTextElements; element++) {\n\
  \            output += String.Format(\n                \"Text element {0} is '{1}{2}'\"\
  ,\n                element, si.SubstringByTextElements(element, 1),\n          \
  \      Environment.NewLine);\n        }\n        MessageBox.Show(output, \"Result\
  \ of SubstringByTextElements\");\n    }\n\n    private static void EnumTextElements(String\
  \ s) {\n        String output = String.Empty;\n\n        TextElementEnumerator charEnum\
  \ =\n            StringInfo.GetTextElementEnumerator(s);\n        while (charEnum.MoveNext())\
  \ {\n            output += String.Format(\n                \"Character at index\
  \ {0} is '{1}{2}'\",\n                charEnum.ElementIndex, charEnum.GetTextElement(),\n\
  \                Environment.NewLine);\n        }\n        MessageBox.Show(output,\
  \ \"Result of GetTextElementEnumerator\");\n    }\n\n    private static void EnumTextElementIndexes(String\
  \ s) {\n        String output = String.Empty;\n\n        Int32[] textElemIndex =\
  \ StringInfo.ParseCombiningCharacters(s);\n        for (Int32 i = 0; i < textElemIndex.Length;\
  \ i++) {\n            output += String.Format(\n                \"Character {0}\
  \ starts at index {1}{2}\",\n                i, textElemIndex[i], Environment.NewLine);\n\
  \        }\n        MessageBox.Show(output, \"Result of ParseCombiningCharacters\"\
  );\n    }\n}\n```\n\n编译并运行上述代码，会显示如图 14-2、图 14-3 和图 14-4 所示的对话框。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_311_0.png)\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_311_1.png)\n\n图 14-2 SubstringByTextElements\
  \ 的结果\n\n图 14-3 GetTextElementEnumerator 的结果\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_311_2.png)\n\
  \n图 14-4 ParseCombiningCharacters 的结果\n\n#### 14.2.7 其他字符串操作\n\n还可利用 **String**\
  \ 类型提供的一些方法来复制整个字符串或者它的一部分。表 14-1 总结了这些方法。\n\n| 成员名称 | 方法类型 | 说明 |\n|---|---|---|\n\
  | Clone | 实例 | 返回对同一个对象 (this) 的引用。能这样做是因为 **String** 对象不可变（immutable）。该方法实现了 **String**\
  \ 的 **ICloneable** 接口 |\n| Copy | 静态 | 返回指定字符串的新副本。该方法很少用，它的存在只是为了帮助一些需要把字符串当作 token\
  \ 来对待的应用程序。通常，包含相同字符内容的多个字符串会被“留用”(intern)为单个字符串。该方法创建新字符串对象，确保即使字符串包含相同字符内容，引用（指针）也有所不同\
  \ |\n| CopyTo | 实例 | 将字符串中的部分字符复制到一个字符数组中 |\n| Substring | 实例 | 返回代表原始字符串一部分的新字符串\
  \ |\n| ToString | 实例 | 返回对同一个对象 (this) 的引用 |\n\n除了这些方法，**String** 还提供了多个用于处理字符串的静态方法和实例方法，比如\
  \ **Insert、Remove、PadLeft、Replace、Split、Join、ToLower、ToUpper、Trim、Concat、Format**\
  \ 等。使用所有这些方法时都请牢记一点，它们返回的都是新的字符串对象。这是由于字符串是不可变的。一经创建，便不能修改（使用安全代码的话）。\n\n### 14.3\
  \ 高效率构造字符串\n\n由于 String 类型代表不可变字符串，所以 FCL 提供了 System.Text.StringBuilder 类型对字符串和字符进行高效动态处理，并返回处理好的\
  \ String 对象。可将 StringBuilder 想像成创建 String 对象的特殊构造器。你的方法一般应获取 String 参数而非 StringBuilder\
  \ 参数。\n\n从逻辑上说，StringBuilder 对象包含一个字段，该字段引用了由 Char 结构构成的数组。可利用 StringBuilder 的各个成员来操纵该字符数组，高效率地缩短字符串或更改字符串中的字符。如果字符串变大，超过了事先分配的字符数组大小，StringBuilder\
  \ 会自动分配一个新的、更大的数组，复制字符，并开始使用新数组。前一个数组被垃圾回收。\n\n用 StringBuilder 对象构造好字符串后，调用 StringBuilder\
  \ 的 ToString 方法即可将 StringBuilder 的字符数组“转换”成 String。这样会在堆上新建 String 对象，其中包含调用 ToString\
  \ 时存在于 StringBuilder 中的字符串。之后可继续处理 StringBuilder 中的字符串。以后可再次调用 ToString 把它转换成另一个\
  \ String 对象。\n\n#### 14.3.1 构造 StringBuilder 对象\n\n和 String 不同，CLR 不觉得 StringBuilder\
  \ 类有什么特别。此外，大多数语言（包括 C#）都不将 StringBuilder 类视为基元类型。要像构造其他任何非基元类型那样构造 StringBuilder\
  \ 对象：\n\n```csharp\nStringBuilder sb = new StringBuilder();\n```\n\nStringBuilder\
  \ 类型提供了许多构造器。每个构造器的职责是分配和初始化由每个 StringBuilder 对象维护的状态。下面解释了 StringBuilder 类的关键概念。\n\
  \n- **最大容量**：一个 Int32 值，指定了能放到字符串中的最大字符数。默认值是 Int32.MaxValue（约 20 亿）。一般不用更改这个值，但有时需要指定较小的最大容量以确保永远不会创建超出特定长度的字符串。构造好之后，这个\
  \ StringBuilder 的最大容量就固定下来了，不能再变。\n\n- **容量**：一个 Int32 值，指定了由 StringBuilder 维护的字符数组的长度。默认为\
  \ 16。如果事先知道要在这个 StringBuilder 中放入多少字符，那么构造 StringBuilder 对象时应该自己设置容量。\n\n    向字符数组追加字符时，StringBuilder\
  \ 会检测数组会不会超过设定的容量。如果会，StringBuilder 会自动增大容量字段，用新容量来分配新数组，并将原始数组的字符复制到新数组中。随后，原始数组可以被垃圾回收。数组动态扩容会损害性能。要避免就要设置一个合适的初始容量。\n\
  \n- **字符数组**：一个由 Char 结构构成的数组，负责维护“字符串”的字符内容。字符数总是小于或等于“容量”和“最大容量”值。可用 StringBuilder\
  \ 的 Length 属性来获取数组中已经使用的字符数。Length 总是小于或等于 StringBuilder 的“容量”值。可在构造 StringBuilder\
  \ 时传递一个 String 来初始化字符数组。不传递字符串，数组刚开始不包含任何字符——也就是说，Length 属性返回 0。\n\n#### 14.3.2\
  \ StringBuilder 的成员\n\n和 String 不同，StringBuilder 代表可变（mutable）字符串。也就是说，StringBuilder\
  \ 的大多数成员都能更改字符数组的内容，同时不会造成在托管堆上分配新对象。StringBuilder 只有以下两种情况才会分配新对象。\n\n- 动态构造字符串，其长度超过了设置的“容量”。\n\
  - 调用 StringBuilder 的 ToString 方法。\n\n### 表 14-2 StringBuilder 的成员\n\n| 成员名称 | 成员类型\
  \ | 说明 |\n|---|---|---|\n| **MaxCapacity** | 只读属性 | 返回字符串能容纳的最大字符数（最大容量） |\n| **Capacity**\
  \ | 可读/可写属性 | 获取或设置字符数组的长度（容量）。将容量设置为比字符串长度小或者比 MaxCapacity 大，将抛出 ArgumentOutOfRangeException\
  \ 异常 |\n| **EnsureCapacity** | 方法 | 保证字符数组至少具有指定的长度（容量）。如果传给方法的值大于 StringBuilder\
  \ 的当前容量，当前容量会自动增大。如果当前容量已大于传给该属性的值，则不发生任何变化 |\n| **Length** | 可读/可写属性 | 获取或设置“字符串”中的字符数。它可能小于字符数组的当前容量。将这个属性设为\
  \ 0，会将 StringBuilder 的内容重置为空字符串 |\n| **ToString** | 方法 | 这个方法的无参版本返回代表 StringBuilder\
  \ 的字符数组的一个 String |\n| **Chars** | 可读/可写索引器属性 | 获取或设置字符数组指定索引位置的字符。在 C# 中，这是一个索引器（有参属性），要用数组语法（[]）来访问\
  \ |\n| **Clear** | 方法 | 清除 StringBuilder 对象的内容，等同于把它的 Length 属性设为 0 |\n| **Append**\
  \ | 方法 | 在字符数组末尾追加一个对象；如有必要，数组会进行扩充。使用常规格式和与调用线程关联的语言文化将对象转换成字符串 |\n| **Insert**\
  \ | 方法 | 在字符数组中插入一个对象；如有必要，数组会进行扩充。使用常规格式和与调用线程关联的语言文化将对象转换成字符串 |\n| **AppendFormat**\
  \ | 方法 | 在字符数组末尾追加指定的零个或多个对象；如有必要，数组会进行扩充。使用调用者提供的格式化和语言文化信息，将这些对象转换成字符串。AppendFormat\
  \ 是处理 StringBuilder 对象时最常用的方法之一 |\n| AppendLine | 方法 | 在字符数组末尾追加一个行中止符或者一个带行中止符的字符串；如有必要，会增大数组的容量\
  \ |\n| Replace | 方法 | 将字符数组中的一个字符替换成另一个字符，或者将一个字符串替换成另一个字符串 |\n| Remove | 方法 | 从字符数组中删除指定范围的字符\
  \ |\n| Equals | 方法 | 只有两个 StringBuilder 对象具有相同最大容量、字符数组容量和字符内容才返回 true |\n| CopyTo\
  \ | 方法 | 将 StringBuilder 的字符内容的一个子集复制到一个 Char 数组中 |\n\n使用 **StringBuilder** 的方法要注意，大多数方法返回的都是对同一个\
  \ **StringBuilder** 对象的引用，所以几个操作能连接到一起完成：\n\n```csharp\nStringBuilder sb = new StringBuilder();\n\
  String s = sb.AppendFormat(\"{0} {1}\", \"Jeffrey\", \"Richter\").\n    Replace('\
  \ ', '-').\n    Remove(4, 3).ToString();\nConsole.WriteLine(s);    // 显示\"Jeff-Richter\"\
  \n```\n\n**String** 和 **StringBuilder** 类提供的方法并不完全对应。例如，**String** 提供了 **ToLower**、**ToUpper**、**EndsWith**、**PadLeft**、**PadRight**、**Trim**\
  \ 等方法；但 **StringBuilder** 类没有提供任何与之对应的方法。另一方面，**StringBuilder** 类提供了功能更全面的 **Replace**\
  \ 方法，允许替换作为字符串一部分的字符或者子字符串（而不是一定要替换整个字符串）。由于两个类不完全对应，所以有时需要在 **String** 和 **StringBuilder**\
  \ 之间转换以完成特定任务。例如，要构造字符串将所有字符转换成大写，再在其中插入一个子字符串，需要写下面这样的代码：\n\n```csharp\n// 构造一个\
  \ StringBuilder 来执行字符串操作\nStringBuilder sb = new StringBuilder();\n\n// 使用 StringBuilder\
  \ 来执行一些字符串操作\nsb.AppendFormat(\"{0} {1}\", \"Jeffrey\", \"Richter\").Replace(\"\
  \ \", \"-\");\n\n// 将 StringBuilder 转换成 String，以便将所有字符转换成大写\nString s = sb.ToString().ToUpper();\n\
  \n// 清除 StringBuilder(分配新的 Char 数组)\nsb.Length = 0;\n\n// 将全部字符大写的 String 加载到 StringBuilder\
  \ 中，执行其他操作\nsb.Append(s).Insert(8, \"Marc-\");\n\n// 将 StringBuilder 转换回 String\n\
  s = sb.ToString();\n\n// 向用户显示 String\nConsole.WriteLine(s);    // \"JEFFREY-Marc-RICHTER\"\
  \n```\n\n仅仅因为 **StringBuilder** 没有提供 **String** 提供的所有操作就要像这样写代码，显然是不方便的，效率也很低。希望\
  \ **Microsoft** 将来能为 **StringBuilder** 添加更多的字符串操作，进一步完善这个类。\n\n\n\n### 14.4 获取对象的字符串表示：ToString\n\
  \n经常都要获取对象的字符串表示。例如，可能需要向用户显示数值类型(比如 **Byte、Int32** 和 **Single**)或者 **DateTime**\
  \ 对象。由于 .NET Framework 是面向对象的平台，每个类型都有责任提供代码将实例的值转换成字符串表示。FCL 的设计者为此规划了统一的模式。本节将描述这个模式。\n\
  \n可调用 **ToString** 方法获取任何对象的字符串表示。**System.Object** 定义了一个 **public、virtual、无参的 ToString**\
  \ 方法，所以在任何类型的实例上都能调用该方法。在语义上，**ToString** 返回代表对象当前值的字符串，该字符串应根据调用线程当前的语言文化进行格式化。例如，在数字的字符串表示中，应该使用与调用线程的语言文化关联的小数点符号、数字分组符号和其他元素。\n\
  \n**System.Object** 实现的 **ToString** 只是返回对象所属类型的全名。这个值用处不大，但对许多不能提供有意义的字符串的类型来说，这也是一个合理的默认值。例如，一个\
  \ **FileStream** 或 **Hashtable** 对象的字符串表示应该是什么呢？\n\n任何类型要想提供合理的方式获取对象当前值的字符串表示，就应重写\
  \ **ToString** 方法。FCL 内建的许多核心类型(**Byte、Int32、UInt64、Double** 等)都重写了 **ToString**，能返回符合语言文化的字符串。在\
  \ Visual Studio 调试器中，鼠标移到变量上方会出现一条数据提示 (data tip)。提示中的文本正是通过调用对象的 **ToString** 方法来获取的。所以，定义类时应该总是重写\
  \ **ToString** 方法，以提供良好的调试支持。\n\n### 14.4.1 指定具体的格式和语言文化\n\n无参 **ToString** 方法有两个问题。首先，调用者无法控制字符串的格式。例如，应用程序可能需要将数字格式化成货币、十进制、百分比或者十六进制字符串。其次，调用者不能方便地选择一种特定语言文化来格式化字符串。相较于客户端代码，服务器端应用程序在第二个问题上尤其麻烦。极少数时候，应用程序需要使用与调用线程不同的语言文化来格式化字符串。为了对字符串格式进行更多的控制，你重写的\
  \ **ToString** 方法应该允许指定具体的格式和语言文化信息。\n\n为了使调用者能选择格式和语言文化，类型应该实现 **System.IFormattable**\
  \ 接口：\n\n```csharp\npublic interface IFormattable {\n    String ToString(String\
  \ format, IFormatProvider formatProvider);\n}\n```\n\nFCL 的所有基类型(**Byte、SByte、Int16/UInt16、Int32/UInt32、Int64/UInt64、Single、Double、Decimal**\
  \ 和 **DateTime**)都实现了这个接口。此外，还有另一些类型(比如 **Guid**)也实现了它。最后，每个枚举类型定义都会自动实现 **IFormattable**\
  \ 接口，以便从枚举类型的实例获取一个有意义的字符串符号。\n\n**IFormattable** 的 **ToString** 方法获取两个参数。第一个是 **format**，这个特殊字符串告诉方法应该如何格式化对象。第二个是\
  \ **formatProvider**，是实现了 **System.IFormatProvider** 接口的一个类型的实例。该类型为 **ToString**\
  \ 方法提供具体的语言文化信息。稍后还要详细讨论。\n\n实现 **IFormattable** 接口的 **ToString** 方法的类型决定哪些格式字符串能被识别。如果传递的格式字符串无法识别，类型应抛出\
  \ **System.FormatException** 异常。\n\nMicrosoft 在 FCL 中定义的许多类型都能同时识别几种格式。例如，**DateTime**\
  \ 类型支持用“d”表示短日期，用“D”表示长日期，用“g”表示常规(general)，用“M”表示月/日，用“s”表示可排序(sortable)，用“T”表示长时间，用“u”表示\
  \ ISO 8601 格式的协调世界时，用“U”表示长日期格式的协调世界时，用“Y”表示年/月。所有枚举类型都支持用“G”表示常规，用“F”表示标志(flag)，用“D”表示十进制，用“X”表示十六进制。第\
  \ 15 章“枚举类型和位标志”将详细讨论枚举类型的格式化。\n\n此外，所有内建数值类型都支持用“C”表示货币格式，用“D”表示十进制格式，用“E”表示科学记数法(指数)格式，用“F”表示定点(fixed-point)格式，用“G”表示常规格式，用“N”表示数字格式，用“P”表示百分比格式，用“R”表示往返行程(round-trip)格式①，用“X”表示十六进制格式。事实上，数值类型还支持\
  \ picture 格式字符串②，它是考虑到在某些时候，简单的格式字符串可能无法完全满足需求。picture 格式字符串包含一些特殊字符，它们告诉类型的 **ToString**\
  \ 方法具体要显示多少个数值、具体在什么地方放置一个小数分隔符以及具体有多少位小数等。欲知详情，请查阅文档中的“自定义数字格式字符串”主题。\n\n对于大多数类型，调用\
  \ **ToString** 并为格式字符串传递 **null** 值完全等价于调用 **ToString** 并为格式字符串传递“G”。换言之，对象默认使用“常规格式”对自身进行格式化。实现类型时，要选择自己认为最常用的一种格式；这个格式就是“常规格式”。顺便说一句，无参的\
  \ **ToString** 方法假定调用者希望的是“常规格式”。\n\n理解了格式字符串之后，接着研究一下语言文化的问题。字符串默认使用与调用线程关联的语言文化信息进行格式化。无参\
  \ **ToString** 方法就是这么做的；另外，为 **formatProvider** 参数传递 **null** 值，**IFormattable**\
  \ 的 **ToString** 方法也这么做。\n\n格式化数字(货币、整数、浮点数、百分比、日期和时间)适合应用对语言文化敏感的信息。**Guid** 类型的\
  \ **ToString** 方法只返回代表 GUID 值的字符串。生成 Guid 的字符串时不必考虑语言文化。\n\n**Decimal** 类型只请求数字格式信息。但其他类型（如\
  \ **DateTime**）可能像下面这样调用 **GetFormat**：\n\n```csharp\nDateTimeFormatInfo dtfi =\
  \ (DateTimeFormatInfo)\n    formatProvider.GetFormat(typeof(DateTimeFormatInfo));\n\
  ```\n\n实际上，由于 **GetFormat** 的参数能标识任何类型，所以该方法非常灵活，能请求任意类型的格式信息。.NET Framework 中的类型在调用\
  \ **GetFormat** 时，暂时只会请求数字或日期/时间信息，但未来可能会请求其他格式信息。\n\n顺便说一句，如果对象不针对任何具体的语言文化而格式化，那么为了获取它的字符串表示，应调用\
  \ **System.Globalization.CultureInfo** 的静态 **InvariantCulture** 属性，并将返回的对象作为 **ToString**\
  \ 的 **formatProvider** 参数来传递：\n\n```csharp\nDecimal price = 123.54M;\nString s =\
  \ price.ToString(\"C\", CultureInfo.InvariantCulture);\nMessageBox.Show(s);\n```\n\
  \n生成并运行上述代码，会出现如图 14-6 所示的消息框。注意，在生成的字符串中，第一个字符是 ¤，即国际通用货币符号（U+00A4）。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_318_0.png)\n\
  \n**图 14-6　格式化数值来表示语言文化中性的货币值**\n\n用 **InvariantCulture** 格式化的字符串一般都不是向用户显示的。相反，一般将这种字符串保存到数据文件中供将来解析。\n\
  \nFCL 只有 3 个类型实现了 **IFormatProvider** 接口。第一个是前面解释过的 **CultureInfo**。另外两个是 **NumberFormatInfo**\
  \ 和 **DateTimeFormatInfo**。在 **NumberFormatInfo** 对象上调用 **GetFormat**，方法会检查被请求的类型是不是一个\
  \ **NumberFormatInfo**。如果是就返回 this，否则返回 **null**。类似地，在 **DateTimeFormatInfo** 对象上调用\
  \ **GetFormat**，如果请求的是一个 **DateTimeFormatInfo** 就返回 this，否则返回 **null**。这两个类型实现 **IFormatProvider**\
  \ 接口是为了简化编程。试图获取对象的字符串表示时，调用者通常要指定格式，并使用与调用线程关联的语言文化。因此，经常都要调用 **ToString**，为 **format**\
  \ 参数传递一个字符串，并为 **formatProvider** 参数传递 **null**。为简化 **ToString** 调用，许多类型都提供了 **ToString**\
  \ 方法的多个重载版本。例如，**Decimal** 类型提供了 4 个不同的 **ToString** 方法：\n\n```csharp\n// 这个版本调用\
  \ ToString(null, null)\n// 含义：采用常规数值格式，采用线程的语言文化信息\npublic override string ToString();\n\
  \n// 这个版本是 ToString 的真正实现\n// 这个版本实现了 IFormattable 的 ToString 方法\n// 含义：采用由调用者指定的格式和语言文化信息\n\
  public string ToString(String format, IFormatProvider formatProvider);\n\n// 这个版本简单地调用\
  \ ToString(format, null)\n// 含义：采用由调用者指定的格式，采用线程的语言文化信息\npublic String ToString(String\
  \ format);\n\n// 这个版本简单地调用 ToString(null, formatProvider)\n// 这个版本实现了 IConvertible\
  \ 的 ToString 方法\n// 含义：采用常规格式，采用由调用者指定的语言文化信息\npublic String ToString(IFormatProvider\
  \ formatProvider);\n```\n\n### 14.4.2 将多个对象格式化成一个字符串\n\n到目前为止讲的都是一个单独的类型如何格式化它自己的对象。但有时需要构造由多个已格式化对象构成的字符串。例如，以下字符串由一个日期、一个人名和一个年龄构成：\n\
  \n```csharp\nString s = String.Format(\"On {0}, {1} is {2} years old.\",\n    new\
  \ DateTime(2012, 4, 22, 14, 35, 5), \"Aidan\", 9);\nConsole.WriteLine(s);\n```\n\
  \n生成并运行上述代码，而且“en-US”是线程当前的语言文化，就会看到以下输出：\n\n```text\nOn 4/22/2012 2:35:05 PM, Aidan\
  \ is 9 years old.\n```\n\n**String** 的静态 **Format** 方法获取一个格式字符串。在格式字符串中，大括号中的数字指定了可供替换的参数。本例的格式字符串告诉\
  \ **Format** 方法将 **{0}** 替换成格式字符串之后的第一个参数（日期/时间），将 **{1}** 替换成格式字符串之后的第二个参数（**\"\
  Aidan\"**），将 **{2}** 替换成格式字符串之后的第三个参数（9）。\n\n在内部，**Format** 方法会调用每个对象的 **ToString**\
  \ 方法来获取对象的字符串表示。返回的字符串依次连接到一起，并返回最终的完整字符串。看起来不错，但它意味着所有对象都要使用它们的常规格式和调用线程的语言文化信息来格式化。\n\
  \n在大括号内指定格式信息，可以更全面地控制对对象格式化。例如，以下代码和上例几乎完全一致，只是为可替换参数 0 和 2 添加了格式化信息：\n\n```csharp\n\
  String s = String.Format(\"On {0:D}, {1} is {2:E} years old.\",\n    new DateTime(2012,\
  \ 4, 22, 14, 35, 5), \"Aidan\", 9);\nConsole.WriteLine(s);\n```\n\n生成并运行上述代码，同时“en-US”是线程当前的语言文化，会看到以下输出：\n\
  \n```text\nOn Sunday, April 22, 2012, Aidan is 9.000000E+000 years old.\n```\n\n\
  **Format** 方法解析格式字符串时，发现可替换参数 0 应该调用它的 **IFormattable** 接口的 **ToString** 方法，并为该方法的两个参数分别传递\
  \ **\"D\"** 和 **null**。类似地，**Format** 会调用可替换的参数 2 的 **IFormattable** 接口的 **ToString**\
  \ 方法，并传递 **\"E\"** 和 **null**。假如可替换参数 0 和 2 的类型没有实现 **IFormattable** 接口，**Format**\
  \ 会调用从 **Object** 继承（而且有可能重写）的无参 **ToString** 方法，并将默认格式附加到最终生成的字符串中。\n\n**String**\
  \ 类提供了静态 **Format** 方法的几个重载版本。一个版本获取实现了 **IFormatProvider** 接口的对象，允许使用由调用者指定的语言文化来格式化所有可替换参数。显然，这个版本的\
  \ **Format** 会调用每个对象的 **IFormattable.ToString** 方法，并将传给 **Format** 的任何 **IFormatProvider**\
  \ 对象传给它。\n\n如果使用 **StringBuilder** 而不是 **String** 来构造字符串，可以调用 **StringBuilder**\
  \ 的 **AppendFormat** 方法。它的原理与 **String** 的 **Format** 方法相似，只是会格式化字符串并将其附加到 **StringBuilder**\
  \ 的字符数组中。和 **String** 的 **Format** 方法一样，**AppendFormat** 也要获取格式字符串，而且也有获取一个 **IFormatProvider**\
  \ 的版本。\n\n**System.Console** 的 **Write** 和 **WriteLine** 方法也能获取格式字符串和可替换参数。但 **Console**\
  \ 的 **Write** 和 **WriteLine** 方法没有重载版本能获取一个 **IFormatProvider**。要格式化符合特定语言文化的字符串，必须调用\
  \ **String** 的 **Format** 方法，首先传递所需的 **IFormatProvider** 对象，再将结果字符串传给 **Console**\
  \ 的 **Write** 或 **WriteLine** 方法。但这应该不是一个大问题。正如前文所述，客户端代码极少需要使用有别于调用线程的其他语言文化来格式化字符串。\n\
  \n### 14.4.3　提供定制格式化器\n\n现在应该很清楚了，.NET Framework 的格式化功能旨在提供更大的灵活性和更多的控制。但讨论还没有完。可以定义一个方法，在任何对象需要格式化成字符串的时候由\
  \ **StringBuilder** 的 **AppendFormat** 方法调用该方法。也就是说，**AppendFormat** 不是为每个对象调用 **ToString**，而是调用定制的方法，按照我们希望的任何方式格式化部分或全部对象。下面的讨论也适用于\
  \ **String** 的 **Format** 方法。\n\n下面通过一个例子来解释这个机制。假定需要格式化用户在 Internet 浏览器中查看的 HTML\
  \ 文本，希望所有 **Int32** 值都加粗显示。所以，每次将 **Int32** 值格式化成 **String** 时，都要用 **<B>** 和 **</B>**\
  \ 标记将字符串包围起来。以下代码演示了要做到这一点是多么容易：\n\n```csharp\nusing System;\nusing System.Text;\n\
  using System.Threading;\n\npublic static class Program {\n    public static void\
  \ Main() {\n        StringBuilder sb = new StringBuilder();\n        sb.AppendFormat(new\
  \ BoldInt32s(), \"{0} {1} {2:M}\", \"Jeff\", 123, DateTime.Now);\n        Console.WriteLine(sb);\n\
  \    }\n}\n\ninternal sealed class BoldInt32s : IFormatProvider, ICustomFormatter\
  \ {\n    public Object GetFormat(Type formatType) {\n        if (formatType == typeof(ICustomFormatter))\
  \ return this;\n        return Thread.CurrentThread.CurrentCulture.GetFormat(formatType);\n\
  \    }\n\n    public String Format(String format, Object arg, IFormatProvider formatProvider)\
  \ {\n        String s;\n\n        IFormattable formattable = arg as IFormattable;\n\
  \n        if (formattable == null) s = arg.ToString();\n        else s = formattable.ToString(format,\
  \ formatProvider);\n\n        if (arg.GetType() == typeof(Int32))\n            return\
  \ \"<B>\" + s + \"</B>\";\n        return s;\n    }\n}\n```\n\n① 文档中的“标准数字格式字符串”一节对\
  \ R 符号(文档中称为说明符)的解释是：往返行程说明符保证转换为字符串的数值再次被分析为相同的数值。使用此说明符格式化数值时，首先使用常规格式对其进行测试：**Double**\
  \ 使用 15 位精度，**Single** 使用 7 位精度。如果此值被成功地分析回相同的数值，则使用常规格式说明符对其进行格式化。但是，如果此值未被成功地分析为相同数值，则它这样格式化：**Double**\
  \ 使用 17 位精度，**Single** 使用 9 位精度。虽然精度说明符可以附加到往返行程格式说明符，但它将被忽略。使用此说明符时，往返行程优先于精度。此格式仅有浮点型(**Single**\
  \ 和 **Double**)支持。——译注\n\n② picture 确实可以理解成“图片”。例如，使用 picture 数值格式字符串 `###,###`\
  \ 可以显示千分位分隔符。换言之，像画图那样指定确切的显示格式。——译注\n\n\n\n```csharp\n} else {\n    // 否; 使用线程的语言文化信息来获取默认格式\n\
  \    if (argObj != null) argStr = argObj.ToString();\n    else argStr = String.Empty;\n\
  }\n\n// 将 argStr 的字符串附加到“字符串数组”字段成员\n/* .... */\n\n// 检查剩余的参数是否需要格式化\nMoreReplaceableArgumentsToAppend\
  \ = /* .... */;\n}\nreturn this;\n}\n```\n\n当 **Main** 调用 **AppendFormat** 时，**AppendFormat**\
  \ 会调用我的格式提供器（format provider）的 **GetFormat** 方法，向它传递 **ICustomFormatter** 类型。在 **BoldInt32s**\
  \ 类型中定义的 **GetFormat** 方法发现当前请求了 **ICustomFormatter**，所以会返回对它自身的引用，因为它已实现了该接口。调用我的\
  \ **GetFormat** 方法时，如果传递的是其他任何类型，就调用与线程关联的 **CultureInfo** 对象的 **GetFormat** 方法。\n\
  \n**AppendFormat** 需要格式化一个可替换参数时，会调用 **ICustomFormatter** 的 **Format** 方法。在本例中，**AppendFormat**\
  \ 调用由 **BoldInt32s** 类型定义的 **Format** 方法。我的这个 **Format** 方法核实要格式化的对象是否支持通过 **IFormattable**\
  \ 接口来实现的富格式化操作。如果对象不支持，就调用简单的、无参的 **ToString** 方法（从 **Object** 继承）来格式化对象。如果对象支持\
  \ **IFormattable**，就调用支持富格式化的 **ToString**，向它传递格式字符串和格式提供器。\n\n现在已经有了格式化好的字符串。接着要核实对应的对象是不是一个\
  \ **Int32** 类型；如果是，就将格式化好的字符串放到 `<B>` 和 `</B>` 这两个 HTML 标记之间，然后返回新字符串。如果不是，就简单地返回格式化好的字符串，不做进一步处理。\n\
  \n### 14.5　解析字符串来获取对象：Parse\n\n上一节解释了如何获取对象并得到它的字符串表示。本节讨论与之相反的操作，即如何获取字符串并得到它的对象表示。从字符串获得对象，这并不是一个常见的操作，但偶尔你也会用到。Microsoft\
  \ 觉得有必要规划一个正式的机制将字符串解析成对象。\n\n能解析字符串的任何类型都提供了公共静态方法 **Parse**。方法获取一个 **String**\
  \ 并返回类型的实例。从某种意义上说，**Parse** 扮演了一个工厂（factory）的角色。在 FCL 中，所有数值类型、**DateTime**、**TimeSpan**\
  \ 以及其他一些类型（比如各种 SQL 数据类型）均提供了 **Parse** 方法。\n\n来看看如何将字符串解析成数值类型。所有数值类型（**Byte**、**SByte**、**Int16/UInt16**、**Int32/UInt32**、**Int64/UInt64**、**Single**、**Double**\
  \ 和 **Decimal**）都提供了至少一个 **Parse** 方法。以 **Int32** 类型的 **Parse** 方法为例（其他数值类型的 **Parse**\
  \ 方法与此相似）：\n\n```csharp\npublic static Int32 Parse(String s, NumberStyles style,\n\
  \    IFormatProvider provider);\n```\n\n从原型就能猜出方法具体如何工作。**String** 参数 `s` 是希望解析成\
  \ **Int32** 对象的一个数字的字符串表示。**System.Globalization.NumberStyles** 参数 `style` 是位标志(bit\
  \ flag)集合，标识了 **Parse** 应在字符串查找的字符(也就是字符串 `s` 中允许的样式，有不允许的样式会抛出异常)。如本章前面所述，**IFormatProvider**\
  \ 参数 `provider` 标识了一个对象，**Parse** 方法通过该对象获取语言文化特有的信息。\n\n例如，以下代码造成 **Parse** 抛出\
  \ **System.FormatException** 异常，因为要解析的字符串包含前导空白字符：\n\n```csharp\nInt32 x = Int32.Parse(\"\
  \ 123\", NumberStyles.None, null);\n```\n\n要允许 **Parse** 跳过前导的空白字符，要像下面这样修改 `style`\
  \ 参数：\n\n```csharp\nInt32 x = Int32.Parse(\" 123\", NumberStyles.AllowLeadingWhite,\
  \ null);\n```\n\n请参考文档来完整地了解 **NumberStyles** 枚举类型定义的位符号和常见组合。\n\n以下代码段展示了如何解析十六进制数：\n\
  \n```csharp\nInt32 x = Int32.Parse(\"1A\", NumberStyles.HexNumber, null);\nConsole.WriteLine(x);\
  \ // 显示: \"26\"\n```\n\n这个 **Parse** 方法接受 3 个参数。为简化编程，许多类型都提供了额外的 **Parse** 重载版本，所以不需要传递如此多的实参。例如，**Int32**\
  \ 提供了 **Parse** 方法的 4 个重载版本：\n\n```csharp\n// 为 style 参数传递 NumberStyles.Integer，\n\
  // 并传递线程的语言文化提供者信息\npublic static Int32 Parse(String s);\n\n// 传递线程的语言文化提供者信息\n\
  public static Int32 Parse(String s, NumberStyles style);\n\n// 为 style 参数传递 NumberStyles.Integer\n\
  public static Int32 Parse(String s, IFormatProvider provider);\n\n// 以下是刚才展示的版本\n\
  public static Int32 Parse(String s, NumberStyles style,\n    IFormatProvider provider);\n\
  ```\n\n**DateTime** 类型也提供了一个 **Parse** 方法：\n\n```csharp\npublic static DateTime\
  \ Parse(String s,\n    IFormatProvider provider, DateTimeStyles styles);\n```\n\n\
  这个方法与数值类型定义的 **Parse** 方法相似，只是 **DateTime** 的 **Parse** 方法获取的是由 **System.Globalization.DateTimeStyles**\
  \ 枚举类型(而不是 **NumberStyles** 枚举类型)定义的位标志集合。参考文档来全面了解 **DateTimeStyles** 类型定义的位符号和常见组合。\n\
  \n为简化编程，**DateTime** 类型提供了 **Parse** 方法的 3 个重载版本：\n\n```csharp\n// 传递线程的语言文化的提供者信息\n\
  // 并为 style 参数传递 DateTimeStyles.None\npublic static DateTime Parse(String s);\n\n\
  // 为 style 参数传递 DateTimeStyles.None\npublic static DateTime Parse(String s, IFormatProvider\
  \ provider);\n\n// 以下是刚才展示的版本\npublic static DateTime Parse(String s,\n    IFormatProvider\
  \ provider, DateTimeStyles styles);\n```\n\n对日期和时间的解析比较复杂。许多开发人员都感觉 `DateTime` 类型的\
  \ `Parse` 方法过于宽松，有时会解析不含日期或时间的字符串。有鉴于此，`DateTime` 类型还提供了 `ParseExact` 方法，它接受一个 `picture`\
  \ 格式字符串，能准确描述应该如何格式化日期/时间字符串，以及如何对它进行解析。欲知详情，请在文档中查阅 `DateTimeFormatInfo` 类。\n\n\
  > **注意**　一些开发人员向 Microsoft 报告了这样一个问题：如果应用程序频繁调用 `Parse`，而且 `Parse` 频繁抛出异常时(由于无效的用户输入)，应用程序的性能会显著下降。为此，Microsoft\
  \ 在所有数值数据类型、`DateTime` 类型、`TimeSpan` 类型、甚至 `IPAddress` 类型中加入了 `TryParse` 方法。下面是\
  \ `Int32` 的 `TryParse` 方法的两个重载版本之一：\n>\n> ```csharp\n> public static Boolean TryParse(String\
  \ s, NumberStyles style,\n>     IFormatProvider provider, out Int32 result);\n>\
  \ ```\n>\n> 可以看出，方法会返回 `true` 或 `false`，指出传递的字符串是否能解析成 `Int32`。如果返回 `true`，以“传引用”的方式传给\
  \ `result` 参数的变量将包含解析好的数值。`TryXxx` 模式的详情将在第 20 章“异常和状态管理”中讨论。\n\n### 14.6　编码：字符和字节的相互转换\n\
  \nWin32 开发人员经常要写代码将 Unicode 字符和字符串转换成“多字节字符集”(Multi-Byte Character Set, MBCS)格式。我个人就经常写这样的代码，这个过程很繁琐，还容易出错。在\
  \ CLR 中，所有字符都表示成 16 位 Unicode 码值，而所有字符串都由 16 位 Unicode 码值构成，这简化了运行时的字符和字符串处理。\n\n\
  但偶尔也想要将字符串保存到文件中，或者通过网络传输。如果字符串中的大多数字符都是英语用户用的，那么保存或传输一系列 16 位值，效率就显得不那么理想，因为写入的半数字节都只由零构成。相反，更有效的做法是将\
  \ 16 位值编码成压缩的字节数组，以后再将字节数组解码回 16 位的数组。\n\n这种编码技术还使托管应用程序能和非 Unicode 系统创建的字符串进行交互。例如，要生成能由\
  \ Windows 95 日文版上运行的应用程序读取的文件，必须使用 Shift-JIS(代码页 932)保存 Unicode 文本。类似地，要用 Shift-JIS\
  \ 编码将 Windows 95 日文版生成的文本文件读入 CLR。\n\n用 `System.IO.BinaryWriter` 或者 `System.IO.StreamWriter`\
  \ 类型将字符串发送给文件或网络流时，通常要进行编码。对应地，用 `System.IO.BinaryReader` 或者 `System.IO.StreamReader`\
  \ 类型从文件或网络流中读取字符串时，通常要进行解码。不显式指定一种编码方案，所有这些类型都默认使用 UTF-8①。但有时还是需要显式编码或解码字符串。即使不需要显式编码或解码，也能通过本节的学习，对流中的字符串读写有一个更清醒的认识。\n\
  \n幸好，FCL 提供了一些类型来简化字符编码和解码。两种最常用的编码方案是 UTF-16 和 UTF-8，如下所述。\n\n- UTF-16 将每个 16 位字符编码成\
  \ 2 个字节。不对字符产生任何影响，也不发生压缩——性能非常出色。UTF-16 编码也称为“Unicode 编码”。还要注意，UTF-16 可用于从“低位优先”(little-endian)转换成“高位优先”(big-endian)，或者从“高位优先”转换成“低位优先”。\n\
  - UTF-8 将部分字符编码成 1 个字节，部分编码成 2 个字节，部分编码成 3 个字节，再有部分编码成 4 个字节。值在 0x0080 之下的字符压缩成\
  \ 1 个字节，适合表示美国使用的字符。0x0080～0x07FF 的字符转换成 2 个字节，适合欧洲和中东语言。0x0800 以及之上的字符转换成 3 个字节，适合东亚语言。最后，代理项对(surrogate\
  \ pair)表示成 4 个字节。UTF-8 编码方案非常流行，但如果要编码的许多字符都具有 0x0800 或者之上的值，效率反而不如 UTF-16。\n\n\
  UTF-16 和 UTF-8 编码是目前最常用的编码方案。FCL 还支持下面这些不常用的。\n\n- UTF-32 使用 4 个字节来编码所有字符。要写简单算法来遍历所有字符，同时不愿意花额外精力应付字节数可变的字符，就适合采用这种编码。例如，使用\
  \ UTF-32 根本不需要考虑代理项的问题，因为每个字符都是 4 字节。当然，UTF-32 的内存使用并不高效，所以很少用它将字符串保存到文件或者通过网络来传输字符串。这种编码方案通常在程序内部使用。还要注意，UTF-32\
  \ 可用于“低位优先”和“高位优先”之间的相互转换。\n- UTF-7 编码用于旧式系统。在那些系统上，字符可以使用 7 位值来表示。应该避免使用这种编码，因为它最终通常会使数据膨胀，而不是压缩。这种编码方案已被\
  \ Unicode 协会淘汰。\n- ASCII 编码方案将 16 位字符编码成 ASCII 字符；也就是说，值小于 0x0080 的 16 位字符被转换成单字节。值超过\
  \ 0x007F 的任何字符都不能被转换，否则字符的值会丢失。假如字符串完全由 ASCII 范围(0x00～0x7F)内的字符构成，ASCII 编码方案就能将数据压缩到原来的一半，而且速度非常快(高位字节被直接截掉)。但如果一些字符在\
  \ ASCII 范围之外，这种编码方案就不适合了，因为字符的值会丢失。\n\n最后，FCL 还允许将 16 位字符编码到任意代码页。和 ASCII 一样，编码到代码页也是危险的，因为代码页表示不了的任何字符都会丢失。除非必须和使用其他编码方案的遗留文件或应用程序兼容，否则应该总是选择\
  \ UTF-16 或 UTF-8 编码。\n\n① UTF 全称是 Unicode Transformation Format，即“Unicode 转换格式”。——译注\n\
  \n要编码或解码一组字符时，应获取从 **System.Text.Encoding** 派生的一个类的实例。抽象基类 **Encoding** 提供了几个静态只读属性，每个属性都返回从\
  \ **Encoding** 派生的一个类的实例。\n\n下列代码使用 UTF-8 进行字符串编码/解码。\n\n```csharp\nusing System;\n\
  using System.Text;\n\npublic static class Program {\n    public static void Main()\
  \ {\n        // 准备编码的字符串\n        String s = \"Hi there.\";\n\n        // 获取从 Encoding\
  \ 派生的一个对象，\n        // 它知道怎样使用 UTF8 来进行编码/解码\n        Encoding encodingUTF8 = Encoding.UTF8;\n\
  \n        // 将字符串编码成字节数组\n        Byte[] encodedBytes = encodingUTF8.GetBytes(s);\n\
  \n        // 显示编码好的字节值\n        Console.WriteLine(\"Encoded bytes: \" +\n      \
  \      BitConverter.ToString(encodedBytes));\n\n        // 将字节数组解码回字符串\n       \
  \ String decodedString = encodingUTF8.GetString(encodedBytes);\n\n        // 显示解码的字符串\n\
  \        Console.WriteLine(\"Decoded string: \" + decodedString);\n    }\n}\n```\n\
  \n上述代码的输出如下：\n\n```text\nEncoded bytes: 48-69-20-74-68-65-72-65-2E\nDecoded string:\
  \ Hi there.\n```\n\n除了 **UTF8** 静态属性，**Encoding** 类还提供了以下静态属性：**Unicode**、**BigEndianUnicode**、**UTF32**、**UTF7**、**ASCII**\
  \ 和 **Default**。**Default** 属性返回的对象使用用户当前的代码页来进行编码/解码。当前用户的代码页是在控制面板的“区域和语言选项”对话框中，通过“非\
  \ Unicode 程序中所使用的当前语言”区域的选项来指定的（查阅 Win32 函数 **GetACP** 了解详情）。但不鼓励使用 **Default**\
  \ 属性，因为这样一来，应用程序的行为就会随着机器的设置而变。也就是说，一旦更改系统默认代码页，或者应用程序在另一台机器上运行，应用程序的行为就会改变。\n\n\
  除了这些属性，**Encoding** 还提供了静态 **GetEncoding** 方法，允许指定代码页（整数或字符串形式），并返回可以使用指定代码页来编码/解码的对象。例如，可调用\
