  \nMicrosoft 本来是打算将 **System.Exception** 类型作为所有异常的基类型，而另外两个类型 **System.SystemException**\
  \ 和 **System.ApplicationException** 是唯一直接从 **Exception** 派生的类型。另外，CLR 抛出的所有异常都从\
  \ **SystemException** 派生，应用程序抛出的所有异常都从 **ApplicationException** 派生。这样就可以写一个 catch\
  \ 块来捕捉 CLR 抛出的所有异常或者应用程序抛出的所有异常。\n\n但是，正如你看到的那样，规则没有得到严格遵守。有的异常类型直接从 **Exception**\
  \ 派生（**IsolatedStorageException**）；CLR 抛出的一些异常从 **ApplicationException** 派生（**TargetInvocationException**）；而应用程序抛出的一些异常从\
  \ **SystemException** 派生（**FormatException**）。这根本就是一团糟。结果是 **SystemException** 类型和\
  \ **ApplicationException** 类型根本没什么特殊含义。Microsoft 本该及时将它们从异常类的层次结构中移除，但现在已经不能那样做了，因为会破坏现有的代码对这两个类型的引用。\n\
  \n### 20.5 抛出异常\n\n实现自己的方法时，如果方法无法完成方法名所指明的任务，就应抛出一个异常。抛出异常时要考虑两个问题。\n\n第一个问题是抛出什么\
  \ **Exception** 派生类型。应选择一个有意义的类型。要考虑调用栈中位于高处的代码，要知道那些代码如何判断一个方法失败从而执行得体的恢复代码。可直接使用\
  \ FCL 定义好的类型，但在 FCL 中也许找不到和你想表达的意思完全匹配的类型。所以可能需要定义自己的类型，只要它最终从 **System.Exception**\
  \ 派生就好。\n\n强烈建议定义浅而宽的异常类型层次结构①，以创建尽量少的基类。原因是基类的主要作用就是将大量错误当作一个错误，而这通常是危险的。基于同样的考虑，永远都不要抛出一个\
  \ **System.Exception** 对象②，抛出其他任何基类异常类型时也要特别谨慎。\n\n> **重要提示**　还要考虑版本问题。如果定义从现有异常类型派生的一个新异常类型，捕捉现有基类型的所有代码也能捕捉新类型。这有时可能正好是你期望的，但有时也可能不是，具体取决于捕捉基类的代码以什么样的方式响应异常类型及其派生类型。从未预料到会有新异常的代码现在可能出现非预期的行为，并可能留下安全隐患。而定义新异常类型的人一般不知道基异常的所有捕捉位置以及具体处理方式。所以这里事实上不可能做出面面俱到的决定。\n\
  \n第二个问题是向异常类型的构造器传递什么字符串消息。抛出异常时应包含一条字符串消息，详细说明方法为什么无法完成任务。如果异常被捕捉到并进行了处理，用户就看不到该字符串消息。但是，如果成为未处理的异常，消息通常会被写入日志。未处理的异常意味着应用程序存在真正的\
  \ bug，开发人员必须修复该 bug。最终用户没有源代码或能力去修复 bug 并重新编译程序。事实上，这个字符串消息根本不应该向最终用户显示，所以，字符串消息可以包含非常详细的技术细节，以帮助开发人员修正代码。\n\
  \n另外，由于所有开发人员都不得不讲英语（至少要会一点，因为编程语言和 FCL 类/方法都使用英语），所以通常不必本地化异常字符串消息。但如果要构建由非英语开发人员使用的类库，就可能需要本地化字符串消息。Microsoft\
  \ 已本地化了 FCL 抛出的异常消息，因为全世界的开发人员都要用这个类库。\n\n① 浅而宽；深而窄。——译注\n\n② 事实上，Microsoft 本来就应该将\
  \ **System.Exception** 类标记为 **abstract**，在编译时就禁止代码试图抛出它的一个实例。\n\n### 20.6 定义自己的异常类\n\
  \n遗憾的是，设计自己的异常不仅繁琐，还容易出错。主要原因是从 Exception 派生的所有类型都应该是可序列化的（serializable），使它们能够穿越\
  \ AppDomain 边界或者写入日志/数据库。序列化涉及许多问题，详情将在第 24 章“运行时序列化”讲述。所以，为了简化编码，我写了一个自己的泛型 `Exception<TExceptionArgs>`\
  \ 类，它像下面这样定义：\n\n```csharp\n[Serializable]\npublic sealed class Exception<TExceptionArgs>\
  \ : Exception, ISerializable\n    where TExceptionArgs : ExceptionArgs {\n\n   \
  \ private const String c_args = \"Args\"; // 用于(反)序列化\n    private readonly TExceptionArgs\
  \ m_args;\n\n    public TExceptionArgs Args { get { return m_args; } }\n\n    public\
  \ Exception(String message = null, Exception innerException = null)\n        : this(null,\
  \ message, innerException) { }\n\n    public Exception(TExceptionArgs args, String\
  \ message = null,\n        Exception innerException = null) : base(message, innerException)\
  \ { m_args = args; }\n\n    // 这个构造器用于反序列化：由于类是密封的，所以构造器是私有的。\n    // 如果这个类不是密封的，这个构造器就应该是受保护的。\n\
  \    [SecurityPermission(SecurityAction.LinkDemand,\n        Flags=SecurityPermissionFlag.SerializationFormatter)]\n\
  \    private Exception(SerializationInfo info, StreamingContext context)\n     \
  \   : base(info, context) {\n        m_args = (TExceptionArgs)info.GetValue(c_args,\
  \ typeof(TExceptionArgs));\n    }\n\n    // 这个方法用于序列化：由于 ISerializable 接口，所以它是公共的\n\
  \    [SecurityPermission(SecurityAction.LinkDemand,\n        Flags=SecurityPermissionFlag.SerializationFormatter)]\n\
  \    public override void GetObjectData(SerializationInfo info, StreamingContext\
  \ context) {\n        info.AddValue(c_args, m_args);\n        base.GetObjectData(info,\
  \ context);\n    }\n\n    public override String Message {\n        get {\n    \
  \        String baseMsg = base.Message;\n            return (m_args == null) ? baseMsg\
  \ : baseMsg + \" (\" + m_args.Message + \")\";\n        }\n    }\n\n    public override\
  \ Boolean Equals(Object obj) {\n        Exception<TExceptionArgs> other = obj as\
  \ Exception<TExceptionArgs>;\n        if (other == null) return false;\n       \
  \ return Object.Equals(m_args, other.m_args) && base.Equals(obj);\n    }\n    public\
  \ override int GetHashCode() { return base.GetHashCode(); }\n}\n```\n\n**TExceptionArgs**\
  \ 约束为的 `ExceptionArgs` 基类非常简单，它看起来像下面这样：\n\n```csharp\n[Serializable]\npublic abstract\
  \ class ExceptionArgs {\n    public virtual String Message { get { return String.Empty;\
  \ } }\n}\n```\n\n定义好这两个类之后，定义其他异常类就是小事一桩。要定义代表磁盘满的异常类，可以像下面这样写：\n\n```csharp\n[Serializable]\n\
  public sealed class DiskFullExceptionArgs : ExceptionArgs {\n    private readonly\
  \ String m_diskpath; // 在构造时设置的私有字段\n\n    public DiskFullExceptionArgs(String diskpath)\
  \ { m_diskpath = diskpath; }\n\n    // 返回字段的公共只读属性\n    public String DiskPath {\
  \ get { return m_diskpath; } }\n\n    // 重写 Message 属性来包含我们的字段(如果设置了的话)\n    public\
  \ override String Message {\n        get {\n            return (m_diskpath == null)\
  \ ? base.Message : \"DiskPath=\" + m_diskpath;\n        }\n    }\n}\n```\n\n另外，如果没有额外的数据要包含到类中，可以简单地写成：\n\
  \n```csharp\n[Serializable]\npublic sealed class DiskFullExceptionArgs : ExceptionArgs\
  \ { }\n```\n\n现在，可以像下面这样写来抛出并捕捉这样的一个异常：\n\n```csharp\npublic static void TestException()\
  \ {\n    try {\n        throw new Exception<DiskFullExceptionArgs>(\n          \
  \  new DiskFullExceptionArgs(@\"C:\\\"), \"The disk is full\");\n    }\n    catch\
  \ (Exception<DiskFullExceptionArgs> e) {\n        Console.WriteLine(e.Message);\n\
  \    }\n}\n```\n\n> **注意**　我的 `Exception<TExceptionArgs>` 类有两个问题需要注意。第一个问题是，用它定义的任何异常类型都总是派生自\
  \ `System.Exception`。这在大多数时候都不是问题，而且浅而宽的异常类型层次结构还是一件好事。第二个问题是，Visual Studio 的未处理异常对话框不会显示\
  \ `Exception<T>` 类型的泛型类型参数，如下图所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_430_0.png)\n\
  \n### 20.7 用可靠性换取开发效率\n\n我从 1975 年开始写软件。首先是进行大量 BASIC 编程。随着我对硬件的兴趣日增，又转向汇编语言。随着时间的推移，我开始转向\
  \ C 语言，因为它允许我从更高的抽象层访问硬件，使编程变得更容易。我的资历是写操作系统代码和平台/库代码，所以我总是努力使自己的代码尽量小而快。应用程序写得再好，也不会强过它们赖以生存的操作系统和库吧？\n\
  \n除了创建小而快的代码，我还总是关注错误恢复。分配内存时（使用 C++ 的 new 操作符或调用 malloc、HeapAlloc、VirtualAlloc\
  \ 等），我总是检查返回值，确保我请求的内存真的给了我。另外，如果内存请求失败，我总是提供一个备选的代码路径，确保剩余的程序状态不会受影响，而且让我的所有调用者都知道我失败了，使调用代码也能采取正确的补救措施。\n\
  \n由于某些我不好解释的原因，为 .NET Framework 写代码时，我没有做到这种对细节的关注。“内存耗尽”总是可能发生的，但我几乎没看到过任何代码包含从\
  \ OutOfMemoryException 恢复的 catch 块。事实上，甚至有的开发人员告诉我 CLR 不让程序捕捉 OutOfMemoryException。我在此要郑重声明，绝对不是这样的；你可以捕捉这个异常。事实上，执行托管代码时，有太多的错误都可能发生，但我很少看到开发人员写代码尝试从这些潜在的错误中恢复。本节要指出其中的一些潜在的错误，并解释为什么可以合理地忽略它们。我还要指出忽略了这些错误之后，可能造成什么重大的问题，并推荐了有助于缓解这些问题的一些方式。\n\
  \n面向对象编程极大提升了开发人员的开发效率。开发效率的提升有很大一部分来自可组合性（composability），它使代码很容易编写、阅读和维护。例如下面这行代码：\n\
  \n```csharp\nBoolean f = \"Jeff\".Substring(1, 1).ToUpper().EndsWith(\"E\");\n```\n\
  \n但上述代码有一个很重要的前提：没有错误发生。而错误总是可能发生的。所以，我们需要一种方式处理错误。这正是异常处理构造①和机制的目的，我们不能像 Win32\
  \ 和 COM 函数那样返回 true/false 或者一个 HRESULT 来指出成功/失败。\n\n① try-catch-finally 就是 C# 的异常处理“构造”。——译注\n\
  \n除了代码的可组合性，开发效率的提升还来自编译器提供的各种好用的功能。例如，编译器能隐式地做下面这些事情。\n\n- 调用方法时插入可选参数。\n- 对值类型的实例进行装箱。\n\
  - 构造/初始化参数数组。\n\n\n\n- 抛出各种异常，包括 **OutOfMemoryException**、**DivideByZeroException**、**NullReferenceException**、**RuntimeWrappedException**、**TargetInvocationException**、**OverflowException**、**NotFiniteNumberException**、**ArrayTypeMismatchException**、**DataMisalignedException**、**IndexOutOfRangeException**、**InvalidCastException**、**RankException**、**SecurityException**\
  \ 等。\n\n另外，理所当然地，.NET Framework 配套提供了一个包罗万象的类库，其中有无数的类型，每个类型都封装了常用的、可重用的功能。可利用这些类型构建\
  \ Web 窗体应用程序、Web 服务和富 GUI 应用程序，可以处理安全性、图像和语音识别等。所有这些代码都可能抛出代表某个地方出错的异常。另外，未来的版本可能引入从现有异常类型派生的新异常类型，而你的\
  \ catch 块能捕捉未来才会出现的异常类型。\n\n所有这一切——面向对象编程、编译器功能、CLR 功能以及庞大的类库——使 .NET Framework\
  \ 成为颇具吸引力的软件开发平台[^1]。但我的观点是，所有这些东西都会在代码中引入你没什么控制权的“错误点”（point of failure）。如果所有东西都正确无误地运行，那么一切都很好：可以方便地编写代码，写出来的代码也很容易阅读和维护。但一旦某样东西出了问题，就几乎不可能完全理解哪里出错和为什么出错。下面这个例子可以证明我的观点：\n\
  \n```csharp\nprivate static Object OneStatement(Stream stream, char charToFind)\
  \ {\n    return (charToFind + \":\" + stream.GetType() + String.Empty\n        (stream.Position\
  \ + 512M)).Where(c=>c == charToFind).ToArray();\n}\n```\n\n这个不太自然的方法只包含一个 C# 语句，但该语句做了大量工作。下面是\
  \ C# 编译器为这个方法生成的 IL 代码（一些行加粗并倾斜；由于一些隐式的操作，它们成了潜在的“错误点”）：\n\n```text\n.method private\
  \ hidebysig static object OneStatement(\n  class [mscorlib]System.IO.Stream stream,\
  \ char charToFind) cil managed {\n  .maxstack 4\n  .locals init (\n    [0] class\
  \ Program/<>c__DisplayClass1,\n    [1] object[] V_1)\n  IL_0000: newobj instance\
  \ void Program/<>c__DisplayClass1::'.ctor'()\n  IL_0005: stloc.0\n  IL_0006: ldloc.0\n\
  \  IL_0007: ldarg.1\n  IL_0008: stfld char Program/<>c__DisplayClass1::charToFind\n\
  \  IL_000d: ldc.i4.5\n  IL_000e: newarr [mscorlib]System.Object\n  IL_0013: stloc.1\n\
  \  IL_0014: ldloc.1\n  IL_0015: ldc.i4.0\n  IL_0016: ldloc.0\n  IL_0017: ldfld char\
  \ Program/<>c__DisplayClass1::charToFind\n  IL_001c: box [mscorlib]System.Char\n\
  \  IL_0021: stelem.ref\n  IL_0022: ldloc.1\n  IL_0023: ldc.i4.1\n  IL_0024: ldstr\
  \ \": \"\n  IL_0029: stelem.ref\n  IL_002a: ldloc.1\n  IL_002b: ldc.i4.2\n  IL_002c:\
  \ ldarg.0\n  IL_002d: callvirt instance class [mscorlib]System.Type [mscorlib]System.Object::GetType()\n\
  \  IL_0032: stelem.ref\n  IL_0033: ldloc.1\n  IL_0034: ldc.i4.3\n  IL_0035: ldsfld\
  \ string [mscorlib]System.String::Empty\n  IL_003a: stelem.ref\n  IL_003b: ldloc.1\n\
  \  IL_003c: ldc.i4.4\n  IL_003d: ldarg.0\n  IL_003e: callvirt instance int64 [mscorlib]System.IO.Stream::get_Position()\n\
  \  IL_0043: call valuetype [mscorlib]System.Decimal [mscorlib]System.Decimal::op_Implicit(int64)\n\
  \  IL_0048: ldc.i4 0x200\n  IL_004d: newobj instance void [mscorlib]System.Decimal::.ctor(int32)\n\
  \  IL_0052: call valuetype [mscorlib]System.Decimal [mscorlib]System.Decimal::op_Addition(valuetype\
  \ [mscorlib]System.Decimal, valuetype [mscorlib]System.Decimal)\n  IL_0057: box\
  \ [mscorlib]System.Decimal\n  IL_005c: stelem.ref\n  IL_005d: ldloc.1\n  IL_005e:\
  \ call string [mscorlib]System.String::Concat(object[])\n  IL_0063: ldloc.0\n  IL_0064:\
  \ ldftn instance bool Program/<>c__DisplayClass1::<OneStatement>b__0(char)\n  IL_006a:\
  \ newobj instance void [mscorlib]System.Func`2<char, bool>::.ctor(object, native\
  \ int)\n  IL_006f: call class [mscorlib]System.Collections.Generic.IEnumerable`1<!0>\
  \ [System.Core]System.Linq.Enumerable::Where<char>(class [mscorlib]System.Collections.Generic.IEnumerable`1<!0>,\
  \ class [mscorlib]System.Func`2<!0, bool>)\n  IL_0074: call !!0 [System.Core]System.Linq.Enumerable::ToArray<char>(class\
  \ [mscorlib]System.Collections.Generic.IEnumerable`1<!0>)\n  IL_0079: ret\n}\n```\n\
  \n由此可见，构造<>c__DisplayClass1 类(编译器生成的类型)、Object[]数组和 Func 委托，以及对 char 和 Decimal 进行装箱时，可能抛出一个\
  \ OutOfMemoryException。调用 Concat、Where 和 ToArray 时，也会在内部分配内存。构造 Decimal 实例时，可能造成它的类型构造器被调用，并抛出一个\
  \ TypeInitializationException[^2]。还存在对 Decimal 的 op_Implicit 操作符和 op_Addition 操作符方法的隐式调用，这些方法可能抛出一个\
  \ OverflowException。\n\nStream 的 Position 属性比较有趣。首先，它是一个虚属性，所以我的 OneStatement 方法无法知道实际执行的代码，可能抛出任何异常。其次，Stream\
  \ 从 MarshalByRefObject 派生，所以 stream 实参可能引用一个代理对象，后者又引用另一个 AppDomain 中的对象。而另一个 AppDomain\
  \ 可能已经卸载，造成一个 AppDomainUnloadedException。\n\n当然，调用的所有方法都是我个人无法控制的，它们都由 Microsoft\
  \ 创建。Microsoft 将来还可能更改它们的实现，抛出我写 OneStatement 方法时不可能预料到的新异常类型。所以，我怎么可能写这个 OneStatement\
  \ 方法来获得完全的“健壮性”来防范所有可能的错误呢？顺便说一句，反过来也存在问题：catch 块可捕捉指定异常类型的派生类型，所以是在为一种不同的错误执行恢复代码。\n\
  \n对所有可能的错误有了一个基本认识之后，就能理解为何不去追求完全健壮和可靠的代码了：因为不切实际（更极端的说法是根本不可能）。不去追求完全的健壮性和可靠性，另一个原因是错误不经常发生。由于错误（比如\
  \ OutOfMemoryException）极其罕见，所以开发人员决定不去追求完全可靠的代码，牺牲一定的可靠性来换取程序员开发效率的提升。\n\n异常的好处在于，未处理的异常会造成应用程序终止。之所以是好事，是因为可在测试期间提早发现问题。利用由未处理异常提供的信息（错误消息和堆栈跟踪），通常足以完成对代码的修正。当然，许多公司不希望应用程序在测试和部署之后还发生意外终止的情况，所以会插入代码来捕捉\
  \ System.Exception，也就是所有异常类型的基类。但如果捕捉 System.Exception 并允许应用程序继续运行，一个很大的问题是状态可能遭受破坏。\n\
  \n本章早些时候展示了一个 Account 类，它定义了一个 Transfer 方法，用于将钱从一个账户转移到另一个。这个 Transfer 方法调用时，如果成功将钱从\
  \ from 账户扣除，但在将钱添加到 to 账户之前抛出异常，那么会发生什么？如果调用代码（调用这个方法的代码）捕捉 System.Exception 并继续运行，应用程序的状态就会被破坏：from\
  \ 和 to 账户的钱都会错误地变少。由于涉及到金钱，所以这种对状态的破坏不能被视为简单 bug，而应该被看成是一个安全性 bug。应用程序继续运行，会尝试对大量账户执行更多的转账操作，造成状态破坏大量蔓延。\n\
  \n一些人会说，Transfer 方法本身应该捕捉 System.Exception 并将钱还给 from 账户。如果 Transfer 方法很简单，这个方案确实可行。但如果\
  \ Transfer 方法还要生成关于取钱的审计记录，或者其他线程要同时操作同一个账户，那么撤消(undo)操作本身就可能失败，造成抛出其他异常。现在，状态破坏将变得更糟而非更好。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_436_0.png)\n\n> 注意 有人或许会说，知道哪里出错，比如知道出了什么错更有用。例如，更有用的是知道从一个账户转账失败，而不是知道\
  \ Transfer 由于 SecurityException 或 OutOfMemoryException 而失败。事实上，Win32 错误模型就是这么设计的，方法是返回\
  \ true/false 来指明成功/失败，使你知道哪个方法失败。然后，如果程序关心失败的原因，可调用 Win32 函数 GetLastError。System.Exception\
  \ 确实有一个 Source 属性可以告诉你失败的方法。但这个属性是一个你必须进行解析的 String，而且假如两个方法在内部调用同一个方法，那么单凭 Source\
  \ 属性是看不出哪个方法失败的。相反，必须解析从 Exception 的 StackTrace 属性返回的 String 来获取这个信息。这实在是太难了，我从未见过任何人真的写代码这样做。\n\
  \n为了缓解对状态的破坏，可以做下面几件事情。\n\n- 执行 catch 或 finally 块中的代码时，CLR 不允许线程终止。所以，可以像下面这样使 Transfer\
  \ 方法变得更健壮：\n\n  ```csharp\n  public static void Transfer(Account from, Account to,\
  \ Decimal amount) {\n      try { /* 这里什么都不做 */ }\n      finally {\n          from\
  \ -= amount;\n          // 现在，这里不可能因为 Thread.Abort / AppDomain.Unload 而发生线程终止\n\
  \          to += amount;\n      }\n  }\n  ```\n\n  但绝对不建议将所有代码都放到 finally 块中！这个技术只适合修改极其敏感的状态。\n\
  \n- 可以用 System.Diagnostics.Contracts.Contract 类向方法应用代码协定。通过代码协定，在用实参和其他变量对状态进行修改之前，可以先对这些实参/变量进行验证。如果实参/变量遵守协定，状态被破坏的可能性将大幅降低（但不能完全消除）。如果不遵守协定，那么异常会在任何状态被修改之前抛出。本章稍后将讨论代码协定。\n\
  \n- 可以使用约束执行区域（Constrained Execution Region，CER），它能消除 CLR 的某些不确定性。例如，可让 CLR 在进入\
  \ try 块之前加载与这个 try 块关联的任何 catch 和 finally 块需要的程序集。此外，CLR 会编译 catch 和 finally 块中的所有代码，包括从这些块中调用的所有方法。这样在尝试执行\
  \ catch 块中的错误恢复代码或者 finally 块中的（资源）清理代码时，就可以消除众多潜在的异常（包括 FileLoadException、BadImageFormatException、InvalidProgramException、FieldAccessException、MethodAccessException、MissingFieldException\
  \ 和 MissingMethodException）。它还降低了发生 OutOfMemoryException 和其他一些异常的机率。本章稍后会讨论 CER。\n\
  \n- 取决于状态存在于何处，可利用事务（transaction）来确保状态要么都修改，要么都不修改。例如，如果数据在数据库中，事务能很好地工作。Windows\
  \ 现在还支持事务式的注册表和文件操作（仅限 NTFS 卷），所以也许能利用它。但是，.NET Framework 目前没有直接公开这个功能。必须 P/Invoke[^3]本机代码才行。请参见\
  \ **System.Transactions.TransactionScope** 类了解细节。\n\n- 将自己的方法设计得更明确。例如，一般像下面这样使用\
  \ **Monitor** 类来获取/释放线程同步锁：\n\n  ```csharp\n  public static class SomeType {\n \
  \     private static Object s_myLockObject = new Object();\n\n      public static\
  \ void SomeMethod () {\n          Monitor.Enter(s_myLockObject);    // 如果抛出异常，是否获取了锁？\n\
  \                                             // 如果已经获取了锁，它就得不到释放！\n          try\
  \ {\n              // 在这里执行线程安全的操作...\n          }\n          finally {\n      \
  \        Monitor.Exit(s_myLockObject);\n          }\n      }\n      // ...\n  }\n\
  \  ```\n\n  由于存在前面展示的问题，所以这个重载的 **Monitor** 的 **Enter** 方法已经不再鼓励使用。建议像下面这样重写以上代码：\n\
  \n  ```csharp\n  public static class SomeType {\n      private static Object s_myLockObject\
  \ = new Object();\n\n      public static void SomeMethod () {\n          Boolean\
  \ lockTaken = false; // 假定没有获取锁\n          try {\n              // 无论是否抛出异常，以下代码都能正常工作！\n\
  \              Monitor.Enter(s_myLockObject, ref lockTaken);\n\n              //\
  \ 在这里执行线程安全的操作...\n          }\n          finally {\n              // 如果已获取锁，就释放它\n\
  \              if (lockTaken) Monitor.Exit(s_myLockObject);\n          }\n     \
  \ }\n      // ...\n  }\n  ```\n\n  虽然以上代码使方法变得更明确，但在线程同步锁的情况下，现在的建议是根本不要随同异常处理使用它们。详情参见第\
  \ 30 章“混合线程同步构造”。\n\n在你的代码中，如果确定状态已损坏到无法修复的程度，就应销毁所有损坏的状态，防止它造成更多的伤害。然后，重新启动应用程序，将状态初始化到良好状态，并寄希望于状态不再损坏。由于托管的状态泄露不到\
  \ **AppDomain** 的外部，所以为了销毁 **AppDomain** 中所有损坏的状态，可调用 **AppDomain** 的 **Unload**\
  \ 方法来卸载整个 AppDomain，详情参见第\n\n[^1]: 应该补充的是，Visual Studio 的编辑器、智能感知支持、代码段(code snippet)支持、模板、可扩展系统、调试系统以及其他多种工具也增大了平台对于开发人员的吸引力。但之所以把这些放在讨论主线以外，是因为它们对代码运行时的行为没有任何影响。\n\
  \n[^2]: 顺便说一句，System.Char、System.String、System.Type 和 System.IO.Stream 都定义了类构造器，它们全部都有可能造成在这个应用程序的某个位置抛出一个\
  \ TypeInitializationException。\n\n[^3]: 平台调用。——译注\n\n\n\n**重要提示**　如果你是类库开发人员，要设计供其他开发人员使用的类型，那么一定要严格按照这些规范行事。你的责任很重大，要精心设计类库中的类型，使之适用于各种各样的应用程序。记住，你无法做到对要回调的代码（通过委托、虚方法或接口方法）了如指掌，也不知道哪些代码会调用你（的代码）。由于无法预知使用类型的每一种情形，所以不要做出任何策略抉择（预见到具体异常并相应处理）。换言之，你的代码一定不能想当然地决定一些错误情形；应该让调用者自己决定。\n\
  \n此外，要严密监视状态，尽量不要破坏它。使用代码协定（本章稍后讨论）验证传给方法的实参。尝试完全不去修改状态。如果不得不修改状态，就做好出错的准备，并在出错后尝试恢复状态。遵照本章的设计规范行事，应用程序的开发人员就可以顺畅地使用你的类库中的类型。\n\
  \n如果你是应用程序开发人员，可定义自己认为合适的任何策略。按照本章的规范行事，有助于在应用程序发布前发现并修复代码中的问题，使应用程序更健壮。但经深思熟虑之后，也可以不按这些规范行事。你要设置自己的策略。例如，应用程序代码在捕捉异常方面可以比类库代码更激进一些。①\n\
  \n① 例如，由于知道自己的应用程序的情况，所以可以捕捉一些更具体的异常，而不是像类库代码那样“畏首畏尾”。换言之，现在可以“做出策略决策”了。——译注\n\n\
  ### 20.8.1　善用 finally 块\n\n我认为 finally 块非常“厉害”！无论线程抛出什么类型的异常，finally 块中的代码都会执行。应该先用\
  \ finally 块清理那些已成功启动的操作，再返回至调用者或者执行 finally 块之后的代码。另外，还经常利用 finally 块显式释放对象以避免资源泄漏。下例将所有资源清理代码（负责关闭文件）都放到一个\
  \ finally 块中：\n\n```\nusing System;\nusing System.IO;\n\npublic sealed class SomeType\
  \ {\n    private void SomeMethod() {\n        FileStream fs = new FileStream(@\"\
  C:\\Data.bin\", FileMode.Open);\n        try {\n            // 显示用 100 除以文件第一个字节的结果\n\
  \            Console.WriteLine(100 / fs.ReadByte());\n        }\n        finally\
  \ {\n            // 将资源清理代码放到 finally 块中，确保无论是否发生异常\n            //（例如，第一个字节为 0），文件都会关闭\n\
  \            fs.Close();\n        }\n    }\n}\n```\n\n确保清理代码的执行是如此重要，以至于许多编程语言都提供了一些构造来简化这种代码的编写。例如，只要使用了\
  \ **lock**、**using** 和 **foreach** 语句，C# 编译器就会自动生成 **try/finally** 块。另外，重写类的析构器（**Finalize**\
  \ 方法）时，C# 编译器也会自动生成 **try/finally** 块。使用这些构造时，编译器将你写的代码放到 **try** 块内部，并将清理代码放到 **finally**\
  \ 块中。具体如下所示。\n\n- 使用 **lock** 语句时，锁在 **finally** 块中释放。\n- 使用 **using** 语句时，在 **finally**\
  \ 块中调用对象的 **Dispose** 方法。\n- 使用 **foreach** 语句时，在 **finally** 块中调用 **IEnumerator**\
  \ 对象的 **Dispose** 方法。\n- 定义析构器方法时，在 **finally** 块中调用基类的 **Finalize** 方法。\n\n例如，以下\
  \ C# 代码利用了 **using** 语句。比上例精简，但编译后的结果一样。\n\n```\nusing System;\nusing System.IO;\n\
  \ninternal sealed class SomeType {\n    private void SomeMethod() {\n        using\
  \ (FileStream fs = new FileStream(\"C:\\\\Data.bin\", FileMode.Open)) {\n      \
  \      // 显示用100除以文件第一个字节的结果\n            Console.WriteLine(100 / fs.ReadByte());\n\
  \        }\n    }\n}\n```\n\n要详细了解 **using** 语句，请参见第 21 章；要详细了解 **lock** 语句，请参见第\
  \ 30 章。\n\n### 20.8.2　不要什么都捕捉\n\n使用异常时，新手常犯的错误是过于频繁或者不恰当地使用 **catch** 块。捕捉异常表明你预见到该异常，理解它为什么发生，并知道如何处理它。换句话说，是在为应用程序定义一个策略，详情请参考\
  \ 20.7 节“用可靠性换取开发效率”。\n\n但我经常看到下面这样的代码：\n\n```\ntry {\n    // 尝试执行程序员知道可能失败的代码...\n\
  }\ncatch (Exception) {\n    ...\n}\n```\n\n这段代码说它预见到了所有异常类型，并知道如何从所有异常状况恢复。这不是吹牛吗？如果类型是类库的一部分，那么任何情况下都绝对不允许捕捉并“吞噬”所有异常，因为它不可能准确预知应用程序将如何响应一个异常。此外，类型经常通过委托、虚方法或接口\n\
  \n① 即“swallow”，这是本书作者喜欢的说法；也有一些作者喜欢说“bury”。除了“吞噬”，也有人把它翻译为“隐藏”。简单地说，就是自己搞定异常，然后装作异常没有发生。——译注\n\
  \n为了正确回滚已部分完成的操作，代码应捕捉所有异常。是的，这里要捕捉**所有异常**，因为你不关心发生了什么错误，只关心如何将数据结构恢复为一致状态。捕捉并处理好异常后，不要把它“吞噬”（假装它没有发生）。相反，要让调用者知道发生了异常。为此，只需重新抛出相同的异常。事实上，C#和许多其他语言都简化了这项任务，只需像上述代码那样单独使用\
  \ C#的 **throw** 关键字，不在 **throw** 后指定任何东西。\n\n注意，以上示例代码中的 **catch** 块没有指定任何异常类型，因为要捕捉所有异常类型。此外，**catch**\
  \ 块中的代码也不需要准确地知道抛出了什么类型的异常，只需知道有错误发生就可以了。幸好 C#对这个模式进行了简化，我们不需要指定任何异常类型，而且 **throw**\
  \ 语句可以重新抛出捕捉到的任何对象。\n\n### 20.8.5　隐藏实现细节来维系协定\n\n有时需要捕捉一个异常并重新抛出不同的异常。这样做唯一的原因是维系方法的“协定”(contract)。另外，抛出的新异常类型应该是一个具体异常(不能是其他异常类型的基类)。假定\
  \ **PhoneBook** 类型定义了一个方法，它根据姓名来查找电话号码，如以下伪代码所示：\n\n```csharp\ninternal sealed class\
  \ PhoneBook {\n    private String m_pathname;   // 地址簿文件的路径名\n\n    // 其他方法放在这里\n\
  \n    public String GetPhoneNumber(String name) {\n        String phone;\n     \
  \   FileStream fs = null;\n        try {\n            fs = new FileStream(m_pathname,\
  \ FileMode.Open);\n            // 这里的代码从 fs 读取内容，直至找到匹配的 name\n            phone\
  \ = /*已找到的电话号码*/;\n        }\n        catch (FileNotFoundException e) {\n      \
  \      // 抛出一个不同的异常，将 name 包含到其中，\n            // 并将原来的异常设为内部异常\n            throw\
  \ new NameNotFoundException(name, e);\n        }\n        catch (IOException e)\
  \ {\n            // 抛出一个不同的异常，将 name 包含到其中，\n            // 并将原来的异常设为内部异常\n    \
  \        throw new NameNotFoundException(name, e);\n        }\n        finally {\n\
  \            if (fs != null) fs.Close();\n        }\n        return phone;\n   \
  \ }\n}\n```\n\n地址簿数据从一个文件(而非网络连接或数据库)中获得。但 **PhoneBook** 类型的用户并不知道这一点，因为该实现细节将来是可能改变的。所以，文件由于任何原因未找到或者不能读取，调用者将看到一个\
  \ **FileNotFoundException** 或者 **IOException** 异常，但这两个异常都不是(调用者)预期的，因为“文件存在与否”以及“能否读取”不是方法的隐式协定的一部分，调用者根本猜不到①。所以，**GetPhoneNumber**\
  \ 方法会捕捉这两种异常类型，并抛出一个新的 **NameNotFoundException** 异常。\n\n① 猜不到 **PhoneBook** 类的 **GetPhoneNumber**\
  \ 方法要从文件中读取数据。——译注\n\n使用这个技术时，只有充分掌握了抛出异常的原因，才应捕捉这些具体的异常。另外，还应知道哪些异常类型是从你捕捉的这个异常类型派生的。\n\
  \n由于最终还是抛出了一个异常，所以调用者仍然顺利地知道了该方法不能完成任务，而 **NameNotFoundException** 类型为调用者提供了理解其中原因的一个抽象视图。将内部异常设为\
  \ **FileNotFoundException** 或 **IOException** 是非常重要的一个环节，这样才能保证不丢失造成异常的真正原因。此外，知道造成异常的原因，不仅对\
  \ **PhoneBook** 类型的开发人员有用，对使用 **PhoneBook** 类型的开发人员同样有用。\n\n> **重要提示** 使用这个技术时，实际是在两个方面欺骗了调用者。首先，在实际发生的错误上欺骗了调用者。本例是文件未找到，而报告的是没有找到指定的姓名。其次，在错误发生的位置上欺骗了调用者。如果允许\
  \ **FileNotFoundException** 异常在调用栈中向上传递，它的 **StackTrace** 属性显示错误在 **FileStream**\
  \ 的构造器中发生。但由于现在是“吞噬”该异常并重新抛出新的 **NameNotFoundException** 异常，所以堆栈跟踪会显示错误在 **catch**\
  \ 块中发生，离异常实际发生的位置有好几行远。这会使调试变得困难。所以，这个技术务必慎用。\n\n假设 **PhoneBook** 类型的实现和前面稍有不同，它提供了公共属性\
  \ **PhoneBookPathname**，用户可通过它设置或获取存储了电话号码的那个文件的路径名。由于用户现在知道电话数据来自一个文件，所以应该修改 **GetPhoneNumber**\
  \ 方法，使它不捕捉任何异常。相反，应该让抛出的所有异常都沿着方法的调用栈向上传递(而不是把它们“吞噬”了之后抛出一个新的)。注意，我改变的不是 **GetPhoneNumber**\
  \ 方法的任何参数，而是 **PhoneBook** 类型之于用户的抽象。用户现在期待文件路径是 **PhoneBook** 的协定的一部分。\n\n有时，开发人员之所以捕捉一个异常并抛出一个新异常，目的是在异常中添加额外的数据或上下文。然而，如果这是你唯一的目的，那么只需捕捉希望的异常类型，在异常对象的\
  \ **Data** 属性(一个键/值对的集合)中添加数据，然后重新抛出相同的异常对象：\n\n```csharp\nprivate static void SomeMethod(String\
  \ filename) {\n    try {\n        // 这里随便做什么...\n    }\n    catch (IOException e)\
  \ {\n        // 将文件名添加到 IOException 对象中\n        e.Data.Add(\"Filename\", filename);\n\
  \n        throw; // 重新抛出同一个异常对象，只是它现在包含额外的数据\n    }\n}\n```\n\n下面是这个技术的一个很好的应用：如果类型构造器抛出异常，而且该异常未在类型构造器方法中捕捉，CLR\
  \ 就会在内部捕捉该异常，并改为抛出一个新的 **TypeInitializationException**。这样做之所以有用，是因为 CLR 会在你的方法中生成代码来隐式调用类型构造器①。如果类型构造器抛出一个\
  \ **DivideByZeroException**，你的代码可能会尝试捕捉它并从中恢复，而你甚至不知道自己正在调用类型构造器。所以，CLR 将 **DivideByZeroException**\
  \ 转换成一个 **TypeInitializationException**，使你清楚地知道异常是因为类型构造器失败而发生的；问题不出在你的代码。\n\n①\
  \ 详情参见 8.3 节“类型构造器”。\n\n相反，下面是这个技术的一个不好的应用：通过反射调用方法时，CLR 内部捕捉方法抛出的任何异常，并把它转换成一个\
  \ **TargetInvocationException**。这是一个让人十分讨厌的设计，因为现在必须捕捉 **TargetInvocationException**\
  \ 对象，并查看它的 **InnerException** 属性来辨别失败的真正原因。事实上，使用反射时经常看到如下所示的代码：\n\n```\nprivate\
  \ static void Reflection(Object o) {\n    try {\n        // 在这个对象上调用一个 DoSomething\
  \ 方法\n        var mi = o.GetType().GetMethod(\"DoSomething\");\n        mi.Invoke(o,\
  \ null); // DoSomething 方法可能抛出异常\n    }\n    catch (System.Reflection.TargetInvocationException\
  \ e) {\n        // CLR 将反射生成的异常转换成 TargetInvocationException\n        throw e.InnerException;\
  \ // 重新抛出最初抛出的\n    }\n}\n```\n\n好消息是：使用 C# 的 **dynamic** 基元类型（参见 5.5 节“**dynamic\
  \ 基元类型**”）来调用成员，编译器生成的代码就不会捕捉全部异常并抛出一个 **TargetInvocationException** 对象；最初抛出的异常对象会正常地在调用栈中向上传递。对于大多数开发人员，这是使用\
  \ C# 的 **dynamic** 基元类型来替代反射的一个很好的理由。\n\n### 20.9　未处理的异常\n\n异常抛出时，CLR 在调用栈中向上查找与抛出的异常对象的类型匹配的\
  \ **catch** 块。没有任何 **catch** 块匹配抛出的异常类型，就发生一个未处理的异常。CLR 检测到进程中的任何线程有未处理的异常，都会终止进程。未处理异常表明应用程序遇到了未预料到的情况，并认为这是应用程序的真正\
  \ bug。随后，应将 bug 报告给发布该应用程序的公司。这个公司也许会修复 bug，并发布应用程序的新版本。\n\n类库开发人员压根儿用不着去想未处理的异常。只有应用程序的开发人员才需要关心未处理的异常，而且应用程序应建立处理未处理异常的策略。Microsoft\
  \ 建议应用程序开发人员接受 CLR 的默认策略。也就是说，应用程序发生未处理的异常时，Windows 会向事件日志写一条记录。为了查看该记录，可打开“事件查看器”应用程序，然后打开树结构中的“Windows\
  \ 日志”->“应用程序”节点，如图 20-1 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_446_0.png)\n\
  \n图 20-1　Windows 事件日志显示应用程序因为未处理的异常而终止\n\n然而，还可以通过“Windows 操作中心”来获取更有趣的细节。为了启动操作中心，请单击系统托盘中的小旗，选择“打开操作中心”。然后，请展开“维护”，单击“查看可靠性历史记录”链接。随后，会在底部的窗格看到应用程序由于未处理的异常而终止，如图\
  \ 20-2 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_446_1.png)\n\n图 20-2　“可靠性监视程序”显示应用程序由于未处理的异常而终止\n\
  \n要查看已终止的应用程序的更多细节，请在“可靠性监视程序”中双击终止的应用程序。图 20-3 显示了这些细节，各个“问题签名”的含义在表 20-2 中进行了总结。托管应用程序生成的所有未处理的异常都放在\
  \ CLR20r3 这个存储段(bucket)中。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_447_0.png)\n\
  \n图 20-3 “可靠性监视程序”显示了与出错应用程序有关的更多细节\n\n### 表 20-2　问题签名\n\n| 问题签名 | 说明 |\n|---|---|\n\
  | 01 | EXE 文件名(限 32 个字符) |\n| 02 | EXE 文件的程序集版本号 |\n| 03 | EXE 文件的时间戳 |\n| 04 |\
  \ EXE 文件的完整程序集名称(限 64 个字符) |\n| 05 | 出错的程序集的版本 |\n| 06 | 出错的程序集的时间戳 |\n| 07 | 出错的程序集的类型和方法。这个值是一个\
  \ MethodDef 元数据标记(剥离了 0x06 高位字符)，代表抛出异常的方法。有了这个值之后，就可以通过 ILDasm.exe 来确定有问题的类型和方法\
  \ |\n| 08 | 有问题的方法的 IL 指令。这个值是抛出异常的那个方法的 IL 指令中的一个偏移量。有了这个值之后，就可以通过 ILDasm.exe 来确定有问题的指令。\
  \ |\n| 09 | 抛出的异常类型(限 32 个字符) |\n\n- 如果一个字符串超过允许的限制，会执行一些巧妙的截断处理，比如会将“Exception”从异常类型名称中截去，或者将“.dll”从文件名中截去。如果结果字符串仍然太长，CLR\
  \ 会对字符串进行哈希处理或者进行 base-64 编码来创建一个新值\n\n\n\n记录好出错的应用程序有关的信息后，Windows 显示一个消息框，允许用户将与出错的应用程序有关的信息发送给\
  \ Microsoft 的服务器。①这称为“Windows 错误报告”(Windows Error Reporting)，详情请访问 Windows Quality\
  \ 网站(http://WinQual.Microsoft.com)。\n\n① 要想禁止显示这个消息框，可以通过 P/Invoke 来调用 Win32 函数\
  \ SetErrorMode，向函数传递 SEM_NOGPFAULTERRORBOX。\n\n作为公司，可以向 Microsoft 注册查看与它们自己的应用程序和组件有关的信息。注册是免费的，但要求程序集使用\
  \ VeriSign ID(也称为 Software Publisher Digital ID for Authenticode)进行签名。\n\n当然也可以开发自己的系统，将未处理异常的信息传回给你自己，以便修正代码中的\
  \ bug。应用程序初始化时，可告诉 CLR 当应用程序中的任何线程发生一个未处理的异常时，都调用一个方法。\n\n遗憾的是，Microsoft 的每种应用程序模型都有自己的与未处理异常打交道的方式。需要在文档中查阅以下成员的信息。\n\
  \n- 对于任何应用程序，查阅 **System.AppDomain** 的 **UnhandledException** 事件。Windows Store 应用和\
  \ Microsoft Silverlight 应用程序访问不了该事件。\n- 对于 Windows Store 应用，查阅 **Windows.UI.Xaml.Application**\
  \ 的 **UnhandledException** 事件。\n- 对于 Windows 窗体应用程序，查阅 **System.Windows.Forms.NativeWindow**\
  \ 的 **OnThreadException** 虚方法、**System.Windows.Forms.Application** 的 **OnThreadException**\
  \ 虚方法以及 **System.Windows.Forms.Application** 的 **ThreadException** 事件。\n- 对于 Windows\
  \ Presentation Foundation(WPF)应用程序，查阅 **System.Windows.Application** 的 **DispatcherUnhandledException**\
  \ 事件和 **System.Windows.Threading.Dispatcher** 的 **UnhandledException** 和 **UnhandledExceptionFilter**\
  \ 事件。\n- 对于 Silverlight，查阅 **System.Windows.Application** 的 **UnhandledException**\
  \ 事件。\n- 对于 ASP.NET Web 窗体应用程序，查阅 **System.Web.UI.TemplateControl** 的 **Error**\
  \ 事件。**TemplateControl** 是 **System.Web.UI.Page** 类和 **System.Web.UI.UserControl**\
  \ 类的基类。另外，还要查阅 **System.Web.HttpApplication** 的 **Error** 事件。\n- 对于 Windows Communication\
  \ Foundation 应用程序，查阅 **System.ServiceModel.Dispatcher.ChannelDispatcher** 的 **ErrorHandlers**\
  \ 属性。\n\n结束本节的讨论之前，最后讲一下分布式应用程序(例如 Web 站点或 Web 服务)中发生的未处理异常。理想情况下，服务器应用程序发生未处理异常，应该先把它记录到日志中，再向客户端发送通知，表明所请求的操作无法完成，最后终止服务器应用程序。遗憾的是，我们并非生活在理想世界中。因此，也许不可能向客户端发送失败通知。对于某些“有状态的服务器”(比如\
  \ Microsoft SQL Server)，终止服务器并重新启动服务器的新实例是不切实际的。\n\n对于服务器应用程序，与未处理异常有关的信息不应返回客户端，因为客户端对这种信息基本上是束手无策的，尤其是假如客户端由不同的公司实现。另外，服务器应尽量少暴露自己的相关信息，减少自己被“黑”的机率。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_449_0.png)\n\n> **注意** CLR 认为本机代码(native\
  \ code)抛出的一些异常是损坏状态异常(corrupted state exceptions，CSE)，因为它们一般由 CLR 自身的 bug 造成，或者由托管开发人员无法控制的本机代码的\
  \ bug 造成。CLR 默认不让托管代码捕捉这些异常，finally 块也不会执行。以下本机 Win32 异常被认为是 CSE：\n\n```\nEXCEPTION_ACCESS_VIOLATION\n\
  EXCEPTION_STACK_OVERFLOW\nEXCEPTION_ILLEGAL_INSTRUCTION\nEXCEPTION_IN_PAGE_ERROR\n\
  EXCEPTION_INVALID_DISPOSITION\nEXCEPTION_NONCONTINUABLE_EXCEPTION\nEXCEPTION_PRIV_INSTRUCTION\n\
  STATUS_UNWIND_CONSOLIDATE\n```\n\n但是，单独的托管方法可以覆盖默认设置来捕捉这些异常，这需要向方法应用 **System.Runtime.ExceptionServices.HandleProcessCorruptedStateExceptionsAttribute**。方法还要应用\
  \ **System.Security.SecurityCriticalAttribute**。要覆盖整个进程的默认设置，可在应用程序的 XML 配置文件中将\
  \ **legacyCorruptedStateExceptionPolicy** 元素设为 **true**。CLR 将上述大多数异常都转换成一个 **System.Runtime.InteropServices.SEHException**\
  \ 对象，但有两个异常例外：**EXCEPTION_ACCESS_VIOLATION** 被转换成 **System.AccessViolationException**\
  \ 对象，**EXCEPTION_STACK_OVERFLOW** 被转换成 **System.StackOverflowException** 对象。\n\n\
  ![](img/6fa065e17c4549db7260fbfaf4fd384e_449_1.png)\n\n> **注意** 调用方法前，可调用 **RuntimeHelpers**\
  \ 类的 **EnsureSufficientExecutionStack** 检查栈空间是否够用。该方法检查调用线程是否有足够的栈空间来执行一般性的方法(定义得比较随便的方法)。栈空间不够，方法会抛出一个\
  \ **InsufficientExecutionStackException**，你可以捕捉这个异常。**EnsureSufficientExecutionStack**\
  \ 方法不接受任何实参，返回值是 **void**。递归方法特别要用好这个方法。\n\n### 20.10 对异常进行调试\n\nVisual Studio 调试器为异常提供了特殊支持。在当前已打开一个解决方案的前提下，请从“调试”菜单选择“异常”，随后会看到如图\
  \ 20-4 所示的对话框。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_450_0.png)\n\n这个对话框显示了\
  \ Visual Studio 能识别的不同种类的异常。展开 Common Language Runtime Exceptions，会看到 Visual Studio\
  \ 调试器能识别的命名空间集，如图 20-5 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_450_1.png)\n\
  \n展开一个命名空间，会看到在该命名空间中定义的所有 System.Exception 派生类型。例如，图 20-6 展示的是 System 命名空间中的 CLR\
  \ 异常。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_450_2.png)\n\n对于任何异常类型，如果勾选了“引发”选项框，调试器就会在抛出该异常时中断。注意在中断时，CLR\
  \ 还没有尝试去查找任何匹配的 catch 块。要对捕捉和处理一个异常的代码进行调试，这个功能相当有用。另外，如果怀疑一个组件或库“吞噬”了异常或者重新抛出了异常，但不确定在什么位置设置断点来捕捉它，这个功能也很有用。\n\
  \n如果异常类型的“引发”框没有勾选，调试器只有在该异常类型未得到处理时才中断。开发人员一般都保持“引发”选项框的未勾选状态，因为得到处理的异常表明应用程序已预见到了异常，并会对它进行处理；应用程序能继续正常运行。\n\
  \n如果定义了自己的异常类型，可单击“添加”把它们添加到这个对话框中。这会打开如图 20-7 所示的对话框。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_451_0.png)\n\
  \n**图 20-7** 让 Visual Studio 识别你自己的异常类型：“新异常”对话框\n\n在这个对话框中，首先将异常类型设为 Common Language\
  \ Runtime Exceptions，然后输入异常类型的完全限定名称。注意，输入的不一定是从 System.Exception 派生的类型。非 CLS 相容的类型也是完全支持的。没有办法区分两个或多个同名但在不同程序集中的类型。幸亏这种情况很少发生。\n\
  \n如果你的程序集定义了几个异常类型，那么一次只能添加一个。希望在未来的版本中，这个对话框允许单击“浏览”按钮查找程序集，并自动将其中所有从 Exception\
  \ 派生的类型导入 Visual Studio 调试器。然后，每个类型都可以根据程序集来区分。这样就可以解决同名、不同程序集的两个类型不能共存的问题。\n\n\
  ### 20.11 异常处理的性能问题\n\n开发人员社区经常就异常处理的性能问题展开活跃讨论。有人说异常处理的性能是如此之坏，以至于他们根本就不打算使用。但是，我认为在面向对象平台中，异常处理不是一个可有可无的东西，而是必须的！另外，假若不用它，有什么是可以替代的呢？是让方法返回\
  \ true/false 来表示成功/失败，还是使用某种错误代码 enum 类型？真的这么做，两个世界①最坏的情况都会发生：CLR 和类库抛出异常而你的代码返回错误代码。现在你两者都要应付。\n\
  \n① 托管世界和非托管世界。——译注\n\n异常处理和较常规的异常报告方式(HRESULT 和特殊返回码等)相比，很难看出两者在性能上的差异。如果写代码检查每个方法调用的返回值并将返回值“漏”给调用者，应用程序性能将受到严重影响。就算不考虑性能，由于要写代码检查每个方法的返回值，也必须进行大量额外的编程，而且出错机率也会大增。异常处理是优选方案。\n\
  \n但异常处理也是有代价的：非托管 C++编译器必须生成代码来跟踪哪些对象被成功构造。编译器还必须生成代码，以便在一个异常被捕捉到的时候，调用每个已成功构造的对象的析构器。由编译器担负这个责任是很好的，但会在应用程序中生成大量簿记(bookkeeping)代码，对代码的大小和执行时间造成负面影响。\n\
  \n另一方面，托管编译器就要轻松得多，因为托管对象在托管堆中分配，而托管堆受垃圾回收器的监视。如对象成功构造，而且抛出了异常，垃圾回收器最终会释放对象的内存。编译器无需生成任何簿记代码来跟踪成功构造的对象，也无需保证析构器的调用。与非托管C++相比，这意味着编译器生成的代码更少，运行时要执行的代码更少，应用程序的性能更好。\n\
  \n多年来，我在不同的编程语言、不同的操作系统和不同的 CPU 架构中进行过异常处理。每种情况下的异常处理都以不同方式实现，而且在性能方面各有优缺点。一些实现将异常处理构造直接编译到一个方法中。一些实现将与异常处理相关的信息存储到一个与方法关联的数据表中——只有抛出异常时才去访问这个表。一些编译器不能内联含有异常处理程序①的方法，另一些编译器在方法含有异常处理程序的时候无法用寄存器来容纳变量。\n\
  \n① 本书按照约定俗成的译法，将 exception handler 翻译成“异常处理程序”，但在这里请把它理解成“用于异常处理的构造”。——译注\n\n总之，不好判断异常处理到底会使应用程序增大多少额外的开销。在托管世界里更不好说，因为程序集的代码在支持.NET\
  \ Framework 的任何平台上都能运行。所以，当程序集在 x86 处理器上运行时，JIT 编译器生成的用于管理异常处理的代码也会显著有别于程序集在 x64\
  \ 或 ARM 处理器上运行时生成的代码。另外，与其他 CLR 实现(比如 Microsoft 的.NET Compact Framework 或者开源 Mono\
  \ 项目)关联的 JIT 编译器也有可能生成不同的代码。\n\n实际上，我用 Microsoft 内部使用的几个 JIT 编译器对自己的代码进行过一些测试，它们在性能上的差异大得令人吃惊。所以，必须在各种目标平台上测试代码，并相应进行调整。再次声明，我不在意异常处理所造成的额外性能开销，因为它带来的收益远大于对性能的影响。\n\
  \n如果希望了解异常处理对代码性能的影响，可使用 Windows 自带的“性能监视器”。图 20-8 展示了随同.NET Framework 安装的与异常有关的计数器。\n\
  \n个别时候会遇到一个频繁调用但频频失败的方法。这时抛出异常所造成的性能损失可能令人无法接受。例如，Microsoft 从一些客户那里了解到，在调用 Int32\
  \ 的 Parse 方法时，最终用户经常输入无法解析的数据。由于频繁调用 Parse 方法，抛出和捕捉异常所造成的性能损失对应用程序的总体性能造成了很大影响。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_453_0.png)\n\n**图 20-8 性能监视器显示了.NET CLR\
  \ Exceptions 计数器**\n\n为了解决客户反映的问题，并与本章描述的设计规范保持一致，Microsoft 为 **Int32** 类添加了新方法\
  \ **TryParse**，它有两个重载版本：\n\n```csharp\npublic static Boolean TryParse(String s,\
  \ out Int32 result);\npublic static Boolean TryParse(String s, NumberStyles style,\n\
  \    IFormatProvider provider, out Int32 result);\n```\n\n注意，这些方法都返回一个 **Boolean**，指明传给方法的\
  \ **String** 是否包含了能解析成 **Int32** 的字符。它们同时返回一个名为 **result** 的输出参数。如果方法返回 **true**，**result**\
  \ 将包含字符串解析成 32 位整数的结果。返回 **false**，**result** 将包含 **0**，这时自然不应再执行任何代码去检查 **result**。\n\
  \n有一点必须澄清：**TryXxx** 方法的 **Boolean** 返回值如果为 **false**，那么代表的只是一种错误。方法仍要为其他错误抛出异常。例如，如果为\
  \ **style** 参数传递的实参无效，**Int32** 的 **TryParse** 方法会抛出一个 **ArgumentException** 异常。另外，调用\
  \ **TryParse** 方法时仍有可能抛出一个 **OutOfMemoryException** 异常。\n\n另外要澄清的是，面向对象编程提高了程序员的编程效率。为此，它采取的一个措施是不在类型的成员中暴露错误代码。换言之，构造器、方法、属性等都采用了“调用它们不会失败”这一思路。而且，如果正确定义，成员的大多数使用都不会失败。而且由于不抛出异常，所以也没有性能上的损失。\n\
  \n定义类型的成员时，应确保在一般使用情形中不会失败。只有用户以后因为抛出异常而对性能不满意时，才应考虑添加一些 **TryXxx** 方法。换言之，首先应建立一个最佳的对象模型。然后，只有在用户抱怨的时候，才在类型中添加一些\
  \ **TryXxx** 方法，帮助遭遇性能问题的用户改善性能。如果用户没有遇到性能问题，那么应继续使用方法的非 **TryXxx** 版本，因为那是更佳的对象模型。\n\
  \n### 20.12 约束执行区域(CER)\n\n许多应用程序都不需要健壮到能从任何错误中恢复的地步。许多客户端应用程序都是这样设计的，比如 Notepad.exe(记事本)和\
  \ Calc.exe(计算器)。另外，我们中的许多人都经历过 Microsoft Office 应用程序(比如 WinWord.exe，Excel.exe 和\
  \ Outlook.exe)因为未处理的异常而终止的情况。此外，许多服务器端应用程序(比如 Web 服务器)都是无状态的，会在因为未处理的异常而失败时自动重启。当然，某些服务器(比如\
  \ SQL Server)本来就是为状态管理而设计的。这种程序假如因为未处理的异常而发生数据丢失，后果将是灾难性的。\n\n在 CLR 中，我们有包含了状态的\
  \ AppDomain(将在第 22 章讨论)。AppDomain 卸载时，它的所有状态都会卸载。所以，如果 AppDomain 中的一个线程遭遇未处理的异常，可以在不终止整个进程的情况下卸载\
  \ AppDomain(会销毁它的所有状态)①。\n\n根据定义，CER 是必须对错误有适应力的代码块。由于 AppDomain 可能被卸载，造成它的状态被销毁，所以一般用\
  \ CER 处理由多个 AppDomain 或进程共享的状态。如果要在抛出了非预期的异常时维护状态，CER 就非常有用。有时将这些异常称为异步异常。例如，调用方法时，CLR\
  \ 必须加载一个程序集，在 AppDomain 的 Loader 堆中创建类型对象，调用类型的静态构造器，并将 IL 代码 JIT 编译成本机代码。所有这些操作都可能失败，CLR\
  \ 通过抛出异常来报告失败。\n\n如果任何这些操作在一个 catch 或 finally 块中失败，你的错误恢复或资源清理代码就不会完整地执行。下列演示了可能出现的问题：\n\
  \n```csharp\nprivate static void Demo1() {\n    try {\n        Console.WriteLine(\"\
  In try\");\n    }\n    finally {\n        // 隐式调用 Type1 的静态构造器\n        Type1.M();\n\
  \    }\n}\n\nprivate sealed class Type1 {\n    static Type1() {\n        // 如果这里抛出异常，M\
  \ 就得不到调用\n        Console.WriteLine(\"Type1's static ctor called\");\n    }\n\n\
  \    public static void M() { }\n}\n```\n\n运行上述代码得到以下输出：\n\n```\nIn try\nType1's\
  \ static ctor called\n```\n\n① 如果线程的整个生命周期都在一个 AppDomain 的内部(比如 ASP.NET 和托管 SQL\
  \ Server 存储过程)，这个说法是完全成立的。但如果线程在其生存期内跨越了 AppDomain 边界，可能就不得不终止整个进程了。\n\n\n\n我们想要达到的目的是，除非保证(或大致保证)①关联的\
  \ `catch` 和 `finally` 块中的代码得到执行，否则上述 `try` 块中的代码根本不要开始执行。为了达到这个目的，可以像下面这样修改代码：\n\
  \n```csharp\nprivate static void Demo2() {\n    // 强迫 finally 块中的代码提前准备好\n    RuntimeHelpers.PrepareConstrainedRegions();\
  \ // System.Runtime.CompilerServices 命名空间\n    try {\n        Console.WriteLine(\"\
  In try\");\n    }\n    finally {\n        // 隐式调用 Type2 的静态构造函数\n        Type2.M();\n\
  \    }\n}\n\npublic class Type2 {\n    static Type2() {\n        Console.WriteLine(\"\
  Type2's static ctor called\");\n    }\n\n    // 应用在 System.Runtime.ConstrainedExecution\
  \ 命名空间中定义的特性\n    [ReliabilityContract(Consistency.WillNotCorruptState, Cer.Success)]\n\
  \    public static void M() { }\n}\n```\n\n运行这个版本得到以下输入：\n\n```text\nType2's static\
  \ ctor called\nIn try\n```\n\n**PrepareConstrainedRegions** 是一个很特别的方法。JIT 编译器如果发现一个\
  \ `try` 块之前调用了这个方法，就会提前编译与 `try` 关联的 `catch` 和 `finally` 块中的代码。JIT 编译器会加载任何程序集，创建任何类型对象，调用任何静态构造函数，并对任何方法进行\
  \ JIT 编译。如果其中任何操作造成异常，这个异常会在线程进入 `try` 块之前发生。\n\nJIT 编译器提前准备方法时，还会遍历整个调用图，提前准备被调用的方法，前提是这些方法应用了\
  \ **ReliabilityContractAttribute**，而且向这个特性实例的构造器传递的是 **Consistency.WillNotCorruptState**\
  \ 或者 **Consistency.MayCorruptInstance** 枚举成员。这是由于假如方法会损坏 AppDomain 或进程的状态，CLR 便无法对状态一致性做出任何保证。在通过一个\
  \ **PrepareConstrainedRegions** 调用来保护的一个 `catch` 或 `finally` 块中，请确保只调用根据刚才的描述设置了\
  \ **ReliabilityContractAttribute** 的方法。\n\n**ReliabilityContractAttribute** 是像下面这样定义的：\n\
  \n```csharp\npublic sealed class ReliabilityContractAttribute : Attribute {\n  \
  \  public ReliabilityContractAttribute(Consistency consistencyGuarantee, Cer cer);\n\
  \    public Cer Cer { get; }\n    public Consistency ConsistencyGuarantee { get;\
  \ }\n}\n```\n\n① “保证”和“大致保证”分别对应后文所说的 **WillNotCorruptState** 和 **MayCorruptInstance**\
  \ 两个枚举成员。——译注\n\n调用这个方法时，要将 try 块和 finally 块的主体作为回调方法传递，它们的原型分别匹配以下两个委托：\n\n```csharp\n\
  public delegate void TryCode(Object userData);\npublic delegate void CleanupCode(Object\
  \ userData, Boolean exceptionThrown);\n```\n\n最后，另一种保证代码得以执行的方式是使用 CriticalFinalizerObject\
  \ 类，该类将在第 21 章“托管堆和垃圾回收”详细解释。\n\n### 20.13 代码协定\n\n代码协定(code contract)提供了直接在代码中声明代码设计决策的一种方式。这些协定采取以下形式。\n\
  \n- **前条件**：一般用于对实参进行验证。\n- **后条件**：方法因为一次普通的返回或者抛出异常而终止时，对状态进行验证。\n- **对象不变性(Object\
  \ Invariant)**：在对象的整个生命周期内，确保对象的字段的良好状态。\n\n代码协定有利于代码的使用、理解、进化、测试、文档和早期错误检测①。可将前条件、后条件和对象不变性想象为方法签名的一部分。所以，代码新版本的协定可以变得更宽松，但不能变得更严格，否则会破坏向后兼容性。\n\
  \n① 为了帮助进行自动化测试，请参见由 Microsoft Research 创建的 Pex 工具，网址是 http://research.microsoft.com/en-us/projects/pex/。\n\
  \n代码协定的核心是静态类 System.Diagnostics.Contracts.Contract：\n\n```csharp\npublic static\
  \ class Contract {\n    // 前条件方法: [Conditional(\"CONTRACTS_FULL\")]\n    public\
  \ static void Requires(Boolean condition);\n    public static void EndContractBlock();\n\
  \n    // 前条件: Always\n    public static void Requires<TException>(Boolean condition)\
  \ where TException : Exception;\n\n    // 后条件方法: [Conditional(\"CONTRACTS_FULL\"\
  )]\n    public static void Ensures(Boolean condition);\n    public static void EnsuresOnThrow<TException>(Boolean\
  \ condition)\n        where TException : Exception;\n\n    // 特殊后条件方法: Always\n\
  \    public static T Result<T>();\n    public static T OldValue<T>(T value);\n \
  \   public static T ValueAtReturn<T>(out T value);\n\n    // 对象不变性方法: [Conditional(\"\
  CONTRACTS_FULL\")]\n    public static void Invariant(Boolean condition);\n\n   \
  \ // 限定符(Quantifier)方法: Always\n    public static Boolean Exists<T>(IEnumerable<T>\
  \ collection, Predicate<T> predicate);\n    public static Boolean Exists(Int32 fromInclusive,\
  \ Int32 toExclusive,\n        Predicate<Int32> predicate);\n    public static Boolean\
  \ ForAll<T>(IEnumerable<T> collection, Predicate<T> predicate);\n    public static\
  \ Boolean ForAll(Int32 fromInclusive, Int32 toExclusive,\n        Predicate<Int32>\
  \ predicate);\n    // 辅助(Helper)方法: [Conditional(\"CONTRACTS_FULL\")]或[Conditional(\"\
  DEBUG\")]\n    public static void Assert(Boolean condition);\n    public static\
  \ void Assume(Boolean condition);\n\n    // 基础结构(Infrastructure)事件: 你的代码一般不使用这个事件\n\
  \    public static event EventHandler<ContractFailedEventArgs> ContractFailed;\n\
  }\n```\n\n如前所示，许多静态方法都应用了 **[Conditional(\"CONTRACTS_FULL\")]** 特性。有的辅助方法还应用了 **[Conditional(\"\
  DEBUG\")]**，意味着除非定义了恰当的符号，否则编译器会忽略调用这些方法的任何代码。标记“Always”的任何方法意味着编译器总是生成调用方法的代码。另外，**Requires、Requires<TException>、Ensures、EnsuresOnThrow、Invariant、Assert**\
  \ 和 **Assume** 方法有一个额外的重载版本(这里没有列出)，它获取一个 **String** 实参，用于显式指定违反协定时显示的字符串消息。\n\n\
  协定默认只作为文档使用，因为生成项目时没有定义 **CONTRACTS_FULL** 符号。为了发掘协定的附加价值，必须下载额外的工具和一个 Visual Studio\
  \ 属性窗格，网址是 http://msdn.microsoft.com/en-us/devlabs/dd491992.aspx。Visual Studio 之所以不包含所有代码协定工具，是因为该技术相当新，而且正处在迅速发展阶段。Microsoft\
  \ 的 DevLabs 网站提供新版本和增强的速度比 Visual Studio 本身快得多。下载和安装好额外的工具之后，会看到项目有一个新的属性窗格，如图 20-9\
  \ 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_458_0.png)\n\n启用代码协定功能要勾选 Perform\
  \ Runtime Contract Checking，并从旁边的组合框中选择 Full。这样就会在生成项目时定义 CONTRACTS_FULL 符号，并在项目生成之后调用恰当的工具(稍后详述)。然后，运行时违反协定会引发\
  \ Contract 的 ContractFailed 事件。一般情况下，开发人员不向这个事件登记任何方法。但如果登记了方法，你登记的任何方法都会接收到一个 ContractFailedEventArgs\
  \ 对象，它看起来像下面这样：\n\n```csharp\npublic sealed class ContractFailedEventArgs : EventArgs\
  \ {\n    public ContractFailedEventArgs(ContractFailureKind failureKind,\n     \
  \   String message, String condition, Exception originalException);\n\n    public\
  \ ContractFailureKind FailureKind  { get; }\n    public String Message         \
  \          { get; }\n    public String Condition                 { get; }\n    public\
  \ Exception OriginalException      { get; }\n\n    public Boolean Handled { get;\
  \ } // 任何事件处理方法调用了 SetHandled，就为 true\n    public void SetHandled();       // 调用该方法来忽略违反协定的情况；将\
  \ Handled 设为 true\n\n    public Boolean Unwind { get; }  // 任何事件处理方法调用了 SetUnwind\
  \ 或抛出异常，就为 true\n    public void SetUnwind();        // 调用该方法强制抛出 ContractException；将\
  \ Unwind 设为 true\n}\n```\n\n可向该事件注册多个事件处理方法。每个方法都可以按照它选择的任何方式处理违反协定的情况。例如，方法可以记录协定违反，可以忽略协定违反(通过调用\
  \ **SetHandled**)，也可以终止进程。任何方法如果调用了 **SetHandled**，违反协定的情况就会被认为已得到处理，而且在所有处理方法返回之后，允许应用程序代码继续运行——除非任何处理方法调用了\
  \ **SetUnwind**。如果一个处理方法调用了 **SetUnwind**，在所有处理方法结束运行后，会抛出一个 **System.Diagnostics.Contracts.ContractException**。注意，这是\
  \ MSCorLib.dll 的内部类型，所以你不能写一个 `catch` 块来显式捕捉它。还要注意，如果任何处理方法抛出未处理的异常，那么剩余的处理方法会被调用，然后抛出一个\
  \ **ContractException**。\n\n如果没有事件处理方法，或者没有任何事件处理方法调用了 **SetHandled**、**SetUnwind**\
  \ 或者抛出未处理的异常，那么违反协定会采用默认方式进行处理。如果 CLR 已寄宿，会向宿主通知协定失败。如果 CLR 正在非交互式窗口站上运行应用程序(服务应用程序就属于这种情况)，会调用\
  \ **Environment.FailFast** 来立即终止进程。如果编译时勾选了 Assert On Contract Failure 选项(参见图 20-9)，会出现一个断言对话框，允许将一个调试器连接到你的应用程序。如果没有勾选这个选项，就抛出一个\
  \ **ContractException**。\n\n下面是一个使用了代码协定的示例类：\n\n```csharp\npublic sealed class\
  \ Item { /* ... */ }\n\npublic sealed class ShoppingCart {\n    private List<Item>\
  \ m_cart = new List<Item>();\n    private Decimal m_totalCost = 0;\n\n    public\
  \ ShoppingCart() {\n    }\n\n    public void AddItem(Item item) {\n        AddItemHelper(m_cart,\
  \ item, ref m_totalCost);\n    }\n\n    private static void AddItemHelper(List<Item>\
  \ m_cart, Item newItem,\n        ref Decimal totalCost) {\n        // 前条件:\n   \
  \     Contract.Requires(newItem != null);\n        Contract.Requires(Contract.ForAll(m_cart,\
  \ s => s != newItem));\n\n        // 后条件:\n        Contract.Ensures(Contract.Exists(m_cart,\
  \ s => s == newItem));\n        Contract.Ensures(totalCost >= Contract.OldValue(totalCost));\n\
  \        Contract.EnsuresOnThrow<IOException>(totalCost == Contract.OldValue(totalCost));\n\
  \n        // 做一些事情（可能抛出 IOException）...\n        m_cart.Add(newItem);\n        totalCost\
  \ += 1.00M;\n    }\n\n    // 对象不变性\n    [ContractInvariantMethod]\n    private void\
  \ ObjectInvariant() {\n        Contract.Invariant(m_totalCost >= 0);\n    }\n}\n\
  ```\n\n**AddItemHelper** 方法定义了一系列代码协定。其中，前条件指出 **newItem** 不能为 **null**，而且要添加到购物车的商品不能已经在购物车中。后条件指出新商品必须在购物车中，而且总价格至少要与将商品添加到购物车之前一样多。还有一个后条件指出如果\
  \ **AddItemHelper** 因为某个原因抛出 **IOException**，那么 **totalCost** 不会发生变化，和方法开始执行时一样。**ObjectInvariant**\
  \ 方法只是一个私有方法；一旦调用，它会确保对象的 **m_totalCost** 字段永远不包含负值。\n\n> **重要提示** 前条件、后条件或不变性测试中引用的任何成员都一定不能有副作用（改变对象的状态）。这是必须的，因为测试条件不应改变对象本身的状态。除此之外，前条件测试中引用的所有成员的可访问性都至少要和定义前条件的方法一样。这是必须的，因为方法的调用者应该能在调用方法之前验证它们符合所有前条件。另一方面，后条件或不变性测试中引用的成员可具有任何可访问性，只要代码能编译就行。可访问性之所以不重要，是因为后条件和不变性测试不影响调用者正确调用方法的能力。\n\
  \n> **重要提示** 涉及继承时，派生类型不能重写并更改基类型中定义的虚成员的前条件。类似地，实现了接口成员的类型不能更改接口成员定义的前条件。如果一个成员没有定义显式的协定，那么成员将获得一个隐式协定，逻辑上这样表示：\n\
  > \n> ```csharp\n> Contract.Requires(true);\n> ```\n> \n> 由于协定不能在新版本中变得更严格（否则会破坏兼容性），所以在引入新的虚/抽象/接口成员时，应仔细考虑好前条件。对于后条件和对象不变性，协定可以随意添加和删除，因为虚/抽象/接口成员中表示的条件和重写成员中表示的条件会“逻辑\
  \ AND”到一起。\n\n\n\n现在，我们已掌握了如何声明协定。接着研究一下它们在运行时是如何工作的。要在方法的顶部声明所有前条件和后条件协定，这样才容易发现。当然，前条件协定是在方法调用时验证的。但是，我们希望后条件协定在方法返回时才验证。为了获得所需的行为，C#\
  \ 编译器生成的程序集必须用 Code Contract Rewriter 工具进行处理，该工具的路径一般是 C:\\Program Files (x86)\\\
  Microsoft\\Contracts\\Bin，它生成程序集的一个修改版本。为自己的项目勾选 Perform Runtime Contract Checking\
  \ 之后，Visual Studio 会在生成项目时自动调用这个工具。工具分析所有方法中的 IL，并重写这些 IL，使任何后条件协定都在每个方法的末尾执行。如果方法内部有多个返回点，CCRewrite.exe\
  \ 工具会修改方法的 IL，使所有返回点都在方法返回前执行后条件代码。\n\nCCRewrite.exe 工具会在类型中查找标记了 [ContractInvariantMethod]\
  \ 特性的任何方法。这个方法可以取任何名字，但根据约定，一般将方法命名为 ObjectInvariant，并将方法标记为 private（就像前面我所做的那样）。方法不接受任何实参，返回类型是\
  \ void。CCRewrite.exe 一旦看到标记了这个特性的 ObjectInvariant 方法（或者你取的其他名字），就会在每个公共实例方法的末尾插入调用\
  \ ObjectInvariant 方法的 IL 代码。这样一来，方法每次返回，都会检查对象的状态，确保方法没有违反协定。注意，CCRewrite.exe 不会修改\
  \ Finalize 方法或者 IDisposable 的 Dispose 方法来调用 ObjectInvariant 方法。因为既然已决定要摧毁（destroy）或处置（dispose），对象的状态自然是可以改变的。还要注意，一个类型可以定义多个应用了\
  \ [ContractInvariantMethod] 特性的方法。使用分部类型时，这样做就很有用。CCRewrite.exe 修改 IL，在每个公共方法末尾调用所有这些方法（顺序不定）。\n\
  \nAssert 和 Assume 方法比较特殊。首先，不应把它们视为方法签名的一部分，也不必把它们放在方法的起始处。在运行时，这两个方法执行完全一样的操作：验证传给它们的条件是否为\
  \ true；不为 true 就抛出异常。但还可使用另一个名为 Code Contract Checker（CCCheck.exe）的工具。该工具能分析 C#\
  \ 编译器生成的 IL，静态验证方法中没有代码违反协定。该工具会尝试证明传给 Assert 的任何条件都为 true，但假设传给 Assume 的任何条件都已经为\
  \ true，而且工具会将表达式添加到它的已知为 true 的事实列表中。一般要先用 Assert，然后在 CCCheck.exe 不能静态证明表达式为 true\
  \ 的前提下将 Assert 更改为 Assume。\n\n来看一个例子。假定有以下类型定义：\n\n```csharp\ninternal sealed class\
  \ SomeType {\n    private static String s_name = \"Jeffrey\";\n\n    public static\
  \ void ShowFirstLetter() {\n        Console.WriteLine(s_name[0]); // 警告: requires\
  \ unproven: index < this.Length\n    }\n}\n```\n\n在项目属性页中勾选 Perform Static Contract\
  \ Checking 再生成上述代码，CCCheck.exe 工具会生成如注释所示的警告。该警告指出查询 s_name 的第一个字母可能失败并抛出异常，因为无法证明\
  \ s_name 总是引用至少包含了一个字符的字符串。\n\n所以，我们要做的是为 ShowFirstLetter 方法添加一个断言：\n\n```csharp\n\
  public static void ShowFirstLetter() {\n    Contract.Assert(s_name.Length >= 1);\
  \ // warning: assert unproven\n    Console.WriteLine(s_name[0]);\n}\n```\n\n遗憾的是，当\
  \ CCCheck.exe 工具分析上述代码时，仍然无法验证 **s_name** 总是引用包含至少一个字母的字符串。所以，工具会生成类似的警告。有时，会由于工具的限制造成无法验证断言；工具未来的版本也许能执行更全面的分析。\n\
  \n为了避开工具的短处，或者声明工具永远证明不了的一件事情成立，可将 **Assert** 更改为 **Assume**。如果知道没有其他代码会修改 **s_name**，就可以这样修改\
  \ **ShowFirstLetter**：\n\n```csharp\npublic static void ShowFirstLetter() {\n  \
  \  Contract.Assume(s_name.Length >= 1); // 这样就没有警告了！\n    Console.WriteLine(s_name[0]);\n\
  }\n```\n\n针对代码的这个新版本，CCCheck.exe 工具会相信我们的“假设”，断定 **s_name** 总是引用至少含有一个字母的字符串。这个版本的\
  \ **ShowFirstLetter** 方法会顺利通过代码协定静态检查器（CCCheck.exe）的检查，不显示任何警告。\n\n再来讨论一下 Code Contract\
  \ Reference Assembly Generator 工具（CCRefGen.exe）。像前面描述的那样使用 CCRewrite.exe 工具来启用协定检查，确实有助于更快地发现\
  \ bug。但是，协定检查期间生成的所有代码会使程序集变得更大，并有损它的运行时性能。为了对这一点进行改进，可以使用 CCRefGen.exe 工具来创建独立的、包含协定的一个引用程序集。在\
  \ Contract Reference Assembly 组合框中选择 Build，Visual Studio 会自动帮你调用这个工具。协定程序集的名字一般是\
  \ *AssemblyName.Contracts.dll*（例如 MSCorLib.Contracts.dll），而且这些程序集只包含对协定进行描述的元数据和\
  \ IL——别的什么都没有。协定引用程序集的特点是向程序集的定义元数据表应用了 **System.Diagnostics.Contracts.ContractReferenceAssemblyAttribute**。CCRewrite.exe\
  \ 和 CCCheck.exe 工具在执行操作和分析的时候，可将协定引用程序集作为输入。\n\n最后一个工具是 Code Contract Document Generator（CCDocGen.exe），使用\
  \ C# 编译器的 **/doc:file** 开关生成 XML 文档后，可利用该工具在文档中添加协定信息。经 CCDocGen.exe 增强的 XML 文档可由\
  \ Microsoft 的 Sandcastle 工具进行处理，以生成 MSDN 风格的、含有协定信息的文档。\n"
- "## 第21章 托管堆和垃圾回收\n\n本章内容：\n\n- 托管堆基础\n- 代：提升性能\n- 使用需要特殊清理的类型\n- 手动监视和控制对象生存期\n\
  \n本章要讨论托管应用程序如何构造新对象，托管堆如何控制这些对象的生存期，以及如何回收这些对象的内存。简单地说，本章要解释 CLR 中的垃圾回收器是如何工作的，还要解释相关的性能问题。另外，本章讨论了如何设计应用程序来最有效地使用内存。\n\
  \n### 21.1 托管堆基础\n\n每个程序都要使用这样或那样的资源，包括文件、内存缓冲区、屏幕空间、网络连接、数据库资源等。事实上，在面向对象的环境中，每个类型都代表可供程序使用的一种资源。要使用这些资源，必须为代表资源的类型分配内存。以下是访问一个资源所需的步骤。\n\
  \n- 1. 调用 IL 指令 newobj，为代表资源的类型分配内存（一般使用 C# new 操作符来完成）。\n- 2. 初始化内存，设置资源的初始状态并使资源可用。类型的实例构造器负责设置初始状态。\n\
  - 3. 访问类型的成员来使用资源（有必要可以重复）。\n- 4. 摧毁资源的状态以进行清理。\n- 5. 释放内存。垃圾回收器独自负责这一步。\n\n如果需要程序员手动管理内存（例如，原生\
  \ C++ 开发人员就是这样的），这个看似简单的模式就会成为导致大量编程错误的“元凶”之一。想想看，有多少次程序员忘记释放不再需要的内存而造成内存泄漏？又有多少次试图使用已经释放的内存，然后由于内存被破坏而造成程序错误和安全漏洞？而且，这两种\
  \ bug 比其他大多数 bug 都要严重，因为一般无法预测它们的后果或发生的时间①。如果是其他 bug，一旦发现程序行为异常，改正出问题的代码行就可以了。\n\
  \n> ① 例如，访问越界的 bug 可能取回不相干的数据，使程序结果变得不正确。而且错误没有规律，让人捉摸不定。——译注\n\n现在，只要写的是可验证的、类型安全的代码（不要用\
  \ C# unsafe 关键字），应用程序就不可能会出现内存被破坏的情况。内存仍有可能泄漏，但不像以前那样是默认行为。现在内存泄漏一般是因为在集合中存储了对象，但不需要对象的时候一直不去删除。\n\
  \n为了进一步简化编程，开发人员经常使用的大多数类型都不需要步骤 4（摧毁资源的状态以进行清理）。所以，托管堆除了能避免前面提到的 bug，还能为开发人员提供一个简化的编程模型：分配并初始化资源并直接使用。大多数类型都无需资源清理，垃圾回收器会自动释放内存。\n\
  \n使用需要特殊清理的类型时，编程模型还是像刚才描述的那样简单。只是有时需要尽快清理资源，而不是非要等着 GC① 介入。可在这些类中调用一个额外的方法（称为 Dispose），按照自己的节奏清理资源。另一方面，实现这样的类需要考虑到较多的问题（21.4\
  \ 节会详细讨论）。一般只有包装了本机资源（文件、套接字和数据库连接等）的类型才需要特殊清理。\n\n#### 21.1.1 从托管堆分配资源\n\nCLR 要求所有对象都从托管堆分配。进程初始化时，CLR\
  \ 划出一个地址空间区域作为托管堆。CLR 还要维护一个指针，我把它称作 **NextObjPtr**。该指针指向下一个对象在堆中的分配位置。刚开始的时候，**NextObjPtr**\
  \ 设为地址空间区域的基地址。\n\n一个区域被非垃圾对象填满后，CLR 会分配更多的区域。这个过程一直重复，直至整个进程地址空间都被填满。所以，你的应用程序的内存受进程的虚拟地址空间的限制。32\
  \ 位进程最多能分配 1.5 GB，64 位进程最多能分配 8 TB。\n\nC# 的 **new** 操作符导致 CLR 执行以下步骤。\n\n- 1. 计算类型的字段（以及从基类型继承的字段）所需的字节数。\n\
  - 2. 加上对象的开销所需的字节数。每个对象都有两个开销字段：类型对象指针和同步块索引。对于 32 位应用程序，这两个字段各自需要 32 位，所以每个对象要增加\
  \ 8 字节。对于 64 位应用程序，这两个字段各自需要 64 位，所以每个对象要增加 16 字节。\n- 3. CLR 检查区域中是否有分配对象所需的字节数。如果托管堆有足够的可用空间，就在\
  \ **NextObjPtr** 指针指向的地址处放入对象，为对象分配的字节会被清零。接着调用类型的构造器（为 **this** 参数传递 **NextObjPtr**），**new**\
  \ 操作符返回对象引用。就在返回这个引用之前，**NextObjPtr** 指针的值会加上对象占用的字节数来得到一个新值，即下个对象放入托管堆时的地址。\n\n\
  图 21-1 展示了包含三个对象（A、B 和 C）的一个托管堆。如果要分配新对象，它将放在 **NextObjPtr** 指针指向的位置（紧接在对象 C 后）。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_465_0.png)\n\n图 21-1　新初始化的托管堆，其中构造了 3\
  \ 个对象\n\n对于托管堆，分配对象只需在指针上加一个值——速度相当快。在许多应用程序中，差不多同时分配的对象彼此间有较强的联系，而且经常差不多在同一时间访问。例如，经常在分配一个\
  \ **BinaryWriter** 对象之前分配一个 **FileStream** 对象。然后，应用程序使用 **BinaryWriter** 对象，而后者在内部使用\
  \ **FileStream** 对象。由于托管堆在内存中连续分配这些对象，所以会因为引用的“局部化”（locality）而获得性能上的提升。具体地说，这意味着进程的工作集会非常小，应用程序只需使用很少的内存，从而提高了速度。还意味着代码使用的对象可以全部驻留在\
  \ CPU 的缓存中。结果是应用程序能以惊人的速度访问这些对象，因为 CPU 在执行大多数操作时，不会因为“缓存未命中”（cache miss）而被迫访问较慢的\
  \ RAM。\n\n根据前面的描述，似乎托管堆的性能天下无敌。但先别激动，刚才说的有一个大前提——内存无限，CLR 总是能分配新对象。但内存不可能无限，所以 CLR\
  \ 通过称为“垃圾回收”（GC）的技术“删除”堆中你的应用程序不再需要的对象。\n\n#### 21.1.2 垃圾回收算法\n\n应用程序调用 **new**\
  \ 操作符创建对象时，可能没有足够地址空间来分配该对象。发现空间不够，CLR 就执行垃圾回收。\n\n> **重要提示** 前面的描述过于简单。事实上，垃圾回收是在第\
  \ 0 代满的时候发生的。本章后面会解释“代”。在此之前，先假设堆满就发生垃圾回收。\n\n至于对象生存期的管理，有的系统采用的是某种引用计数算法。事实上，Microsoft\
  \ 自己的“组件对象模型”（Component Object Model，COM）用的就是引用计数。在这种系统中，堆上的每个对象都维护着一个内存字段来统计程序中多少个“部分”正在使用对象。随着每一“部分”到达代码中某个不再需要对象的地方，就递减对象的计数字段。计数字段变成\
  \ 0，对象就可以从内存中删除了。许多引用计数系统最大的问题是处理不好循环引用。例如在 GUI 应用程序中，窗口将容纳对子 UI 元素的引用，而子 UI 元素将容纳对父窗口的引用。这种引用会阻止两个对象的计数器达到\
  \ 0，所以两个对象永远不会删除，即使应用程序本身不再需要窗口了。\n\n鉴于引用计数垃圾回收器算法存在的问题，CLR 改为使用一种引用跟踪算法。引用跟踪算法只关心引用类型的变量，因为只有这种变量才能引用堆上的对象；值类型变量直接包含值类型实例。引用类型变量可在许多场合使用，包括类的静态和实例字段，或者方法的参数和局部变量。我们将所有引用类型的变量都称为根。\n\
  \nCLR 开始 GC 时，首先暂停进程中的所有线程。这样可以防止线程在 CLR 检查期间访问对象并更改其状态。然后，CLR 进入 GC 的标记阶段。在这个阶段，CLR\
  \ 遍历堆中的所有对象，将同步块索引字段中的一位设为 0。这表明所有对象都应删除。然后，CLR 检查所有活动根，查看它们引用了哪些对象。这正是 CLR 的 GC\
  \ 称为引用跟踪 GC 的原因。如果一个根包含 null，CLR 忽略这个根并继续检查下个根。\n\n任何根如果引用了堆上的对象，CLR 都会标记那个对象，也就是将该对象的同步块索引中的位设为\
  \ 1。一个对象被标记后，CLR 会检查那个对象中的根，标记它们引用的对象。如果发现对象已经标记，就不重新检查对象的字段。这就避免了因为循环引用而产生死循环。\n\
  \n图 21-2 展示了一个堆，其中包含几个对象。应用程序的根直接引用对象 A、C、D 和 F。所有对象都已标记。标记对象 D 时，垃圾回收器发现这个对象含有一个引用对象\
  \ H 的字段，造成对象 H 也被标记。标记过程会持续，直至应用程序的所有根都检查完毕。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_466_0.png)\n\
  \n检查完毕后，堆中的对象要么已标记，要么未标记。已标记的对象不能被垃圾回收，因为至少有一个根在引用它。我们说这种对象是可达（reachable）的，因为应用程序代码可通过仍在引用它的变量抵达（或访问）它。未标记的对象是不可达（unreachable）的，因为应用程序中不存在使对象能被再次访问的根。\n\
  \nCLR 知道哪些对象可以幸存，哪些可以删除后，就进入 GC 的压缩（compact）①阶段。在这个阶段，CLR 对堆中已标记的对象进行“乾坤大挪移”，压缩所有幸存下来的对象，使它们占用连续的内存空间。这样做有许多好处。首先，所有幸存对象在内存中紧挨在一起，恢复了引用的“局部化”，减小了应用程序的工作集，从而提升了将来访问这些对象时的性能。其次，可用空间也全部是连续的，所以这个地址空间区段得到了解放，允许其他东西进驻。最后，压缩意味着托管堆解决了本机（原生）堆的空间碎片化问题。\n\
  \n> ① 此压缩非彼压缩，这里只是按照约定俗成的方式将 compact 翻译成“压缩”。不要以为“压缩”后内存会增多。相反，这里的“压缩”更接近于“碎片整理”。事实上，compact\
  \ 正确的意思是“变得更紧凑”。但事实上，从上个世纪 80 年开始，人们就把它看成是 compress 的近义词而翻译成“压缩”，以讹传讹至今。——译注\n\n\
  在内存中移动了对象之后有一个问题亟待解决。引用幸存对象的根现在引用的还是对象最初在内存中的位置，而非移动之后的位置。被暂停的线程恢复执行时，将访问旧的内存位置，会造成内存损坏。这显然是无法容忍的，所以作为压缩阶段的一部分，CLR\
  \ 还要从每个根减去所引用的对象在内存中偏移的字节数。这样就能保证每个根还是引用和之前一样的对象；只是对象在内存中变换了位置。\n\n压缩好内存后，托管堆的 **NextObjPtr**\
  \ 指针指向最后一个幸存对象之后的位置。下一个分配的对象将放到这个位置。图 21-3 展示了压缩阶段之后的托管堆。压缩阶段完成后，CLR 恢复应用程序的所有线程。这些线程继续访问对象，就好像\
  \ GC 没有发生过一样。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_467_0.png)\n\n如果 CLR 在一次\
  \ GC 之后回收不了内存，而且进程中没有空间来分配新的 GC 区域，就说明该进程的内存已耗尽。此时，试图分配更多内存的 **new** 操作符会抛出 **OutOfMemoryException**。应用程序可捕捉该异常并从中恢复。但大多数应用程序都不会这么做；相反，异常会成为未处理异常，**Windows**\
  \ 将终止进程并回收进程使用的全部内存。\n\n作为程序员，应注意本章开头描述的两个 **bug** 不复存在了。首先，内存不可能泄漏，因为从应用程序的根②访问不了任何对象，都会在某个时间被垃圾回收。其次，不可能因为访问被释放的内存而造成内存损坏，因为现在只能引用活动对象；非活动的对象是引用不了的。\n\
  \n> **重要提示** 静态字段引用的对象一直存在，直到用于加载类型的 **AppDomain** 卸载为止。内存泄漏的一个常见原因就是让静态字段引用某个集合对象，然后不停歇地向集合添加数据项。静态字段使集合对象一直存活，而集合对象使所有数据项一直存活。因此，应尽量避免使用静态字段。\n\
  \n#### 21.1.3 垃圾回收和调试\n\n一旦根离开作用域，它引用的对象就会变得“不可达”，GC 会回收其内存；不保证对象在\n\n方法的生存期中自始至终地存活。这会对应用程序产生有趣的影响。例如以下代码：\n\
  \n```csharp\nusing System;\nusing System.Threading;\n\npublic static class Program\
  \ {\n    public static void Main() {\n        // 创建每 2000 毫秒就调用一次 TimerCallback\
  \ 方法的 Timer 对象\n        Timer t = new Timer(TimerCallback, null, 0, 2000);\n\n \
  \       // 等待用户按 Enter 键\n        Console.ReadLine();\n    }\n\n    private static\
  \ void TimerCallback(Object o) {\n        // 当调用该方法时，显示日期和时间\n        Console.WriteLine(\"\
  In TimerCallback: \" + DateTime.Now);\n\n        // 出于演示目的，强制执行一次垃圾回收\n        GC.Collect();\n\
  \    }\n}\n```\n\n在命令行上，不用任何特殊编译器开关编译代码。运行可执行文件，会发现 TimerCallback 方法只被调用了一次！\n\n\
  观察代码，可能以为 TimerCallback 方法每隔 2000 毫秒调用一次。毕竟，代码创建了一个 Timer 对象，而且有一个变量 t 引用该对象。只要计时器对象存在，计时器就应该一直触发。但要注意，TimerCallback\
  \ 方法调用 GC.Collect() 强制执行了一次垃圾回收。\n\n回收开始时，垃圾回收器首先假定堆中的所有对象都是不可达的(垃圾)；这自然也包括 Timer\
  \ 对象。然后，垃圾回收器检查应用程序的根，发现在初始化之后，Main 方法再也没有用过变量 t。既然应用程序没有任何变量引用 Timer 对象，垃圾回收自然会回收分配给它的内存；这使计时器停止触发，并解释了为什么\
  \ TimerCallback 方法只被调用了一次。\n\n现在，假定用调试器单步调试 Main，而且在将新 Timer 对象的地址赋给 t 之后，立即发生了一次垃圾回收。然后，用调试器的“监视”窗口查看\
  \ t 引用的对象，会发生什么事情呢？因为对象已被回收，所以调试器无法显示该对象。大多数开发人员都没有料到这个结果，认为不合常理。所以，Microsoft 提出了一个解决方案。\n\
  \n使用 C# 编译器的 /debug 开关编译程序集时，编译器会应用 System.Diagnostics.DebuggableAttribute，并为结果程序集设置\
  \ DebuggingModes 的 DisableOptimizations 标志。运行时编译方法时，JIT 编译器看到这个标志，会将所有根的生存期延长至方法结束。在我的例子中，JIT\
  \ 编译器认为 Main 的 t 变量必须存活至方法结束。所以在垃圾回收时，GC 认为 t 仍然是一个根，t 引用的 Timer 对象仍然“可达”。Timer\
  \ 对象会在回收中存活，TimerCallback 方法会被反复调用，直至 Console.ReadLine 方法返回而且 Main 方法退出。\n\n这很容易验证，只需在命令行中重新编译程序，但这一次指定\
  \ C# 编译器的 /debug 开关。运行可执行文件，会看到 TimerCallback 方法被反复调用。注意，C# 编译器的 /optimize+ 编译器开关会将\
  \ DisableOptimizations 禁止的优化重新恢复，所以实验时不要指定该开关。\n\nJIT 编译器这样做的目的是帮助进行 JIT 调试。现在可以用正常方式启动应用程序(不用调试器），方法一经调用，JIT\
  \ 编译器就会将变量的生存期延长至方法结束。以后，如果决定为进程连接一个调试器，可在先前编译好的方法中添加一个断点，并检查根变量。\n\n你现在知道了如何构建在\
  \ **Debug** 生成中正常工作的应用程序，但它在 **Release** 生成中还是不正常。没人喜欢只有调试时才正常的应用程序，所以应该修改程序，使它在任何时候都能正常工作。\n\
  \n可试着像下面这样修改 **Main** 方法：\n\n```csharp\npublic static void Main() {\n    // 创建每2000毫秒就调用一次TimerCallback方法的Timer对象\n\
  \    Timer t = new Timer(TimerCallback, null, 0, 2000);\n\n    // 等待用户按Enter键\n\
  \    Console.ReadLine();\n\n    // 在ReadLine之后引用t(会被优化掉)\n    t = null;\n}\n```\n\
  \n但编译上述代码(无/debug+开关)，并运行可执行文件，会看到 **TimerCallback** 方法仍然只被调用了一次。问题在于，JIT 编译器是一个优化编译器，将局部变量或参数变量设为\
  \ null，等价于根本不引用该变量。换言之，JIT 编译器会将 t = null;整行代码删除(优化掉)。所以，程序仍然不会按期望的方式工作。下面才是 **Main**\
  \ 方法的正确修改方式：\n\n```csharp\npublic static void Main() {\n    // 创建每2000毫秒就调用一次TimerCallback方法的Timer对象\n\
  \    Timer t = new Timer(TimerCallback, null, 0, 2000);\n\n    // 等待用户按Enter键\n\
  \    Console.ReadLine();\n\n    // 在ReadLine之后引用t(在Dispose方法返回之前，t会在GC中存活)\n   \
  \ t.Dispose();\n}\n```\n\n现在编译代码(无/debug+编译器开关)并运行可执行文件，会发现 **TimerCallback** 方法被正确地重复调用，程序终于得到修正。现在发生的事情是，t\
  \ 引用的对象必须存活，才能在它上面调用 **Dispose** 实例方法(t 中的值要作为 this 实参传给 **Dispose**)。真是讽刺，要显式要求释放计时器，它才能活到被释放的那一刻。\n\
  \n> **注意** 读完本节的内容后，不必担心对象被过早回收这个问题。这里讨论之所以使用 **Timer** 类，是因为它具有其他类不具有的特殊行为。**Timer**\
  \ 类的特点(和问题)在于，堆中存在的一个 **Timer** 对象会造成别的事情的发生：一个线程池线程定期调用一个方法。其他任何类型都不具有这个行为。例如，内存中存在的一个\
  \ **String** 对象不会造成别的事情的发生；字符串就那么“傻傻地呆在那里”。所以，我用 **Timer** 展示根的工作原理以及对象生存期与调试器的关系，讨论的重点并不是如何保持对象的存活。所有非\
  \ **Timer** 的对象都会根据应用程序的需要而自动存活。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_471_0.png)\n\
  \n图 21-6 第 0 代分配了新对象：第 1 代有垃圾产生\n\n现在，假定分配新对象 L 会造成第 0 代超出预算，造成必须启动垃圾回收。开始垃圾回收时，垃圾回收器必须决定检查哪些代。前面说过，CLR\
  \ 初始化时会为第 0 代对象选择预算。事实上，它还必须为第 1 代选择预算。\n\n开始一次垃圾回收时，垃圾回收器还会检查第 1 代占用了多少内存。在本例中，由于第\
  \ 1 代占用的内存远少于预算，所以垃圾回收器只检查第 0 代中的对象。回顾一下基于代的垃圾回收器做出的假设。第一个假设是越新的对象活得越短。因此，第 0 代包含更多垃圾的可能性很大，能回收更多的内存。由于忽略了第\
  \ 1 代中的对象，所以加快了垃圾回收速度。\n\n显然，忽略第 1 代中的对象能提升垃圾回收器的性能。但对性能有更大提振作用的是现在不必遍历托管堆中的每个对象。如果根或对象引用了老一代的某个对象，垃圾回收器就可以忽略老对象内部的所有引用，能在更短的时间内构造好可达对象图(graph\
  \ of reachable object)。当然，老对象的字段也有可能引用新对象。为了确保对老对象的已更新字段进行检查，垃圾回收器利用了 JIT 编译器内部的一个机制。这个机制在对象的引用字段发生变化时，会设置一个对应的位标志。这样，垃圾回收器就知道自上一次垃圾回收以来，哪些老对象(如果有的话)已被写入。只有字段发生变化的老对象才需检查是否引用了第\
  \ 0 代中的任何新对象。①\n\n① 有人想知道更多的细节，这里便满足他们的好奇心。当 JIT 编译器生成本机(native)代码来修改对象中的一个引用字段时，本机代码会生成对一个\
  \ write barrier 方法的调用(译注：write barrier 方法是在有数据向对象写入时执行一些内存管理代码的机制)。这个 write barrier\
  \ 方法检查字段被修改的那个对象是否在第 1 代或第 2 代中。如果在，write barrier 代码就在一个所谓的 card table 中设置一个 bit。card\
  \ table 为堆中的每 128 字节的数据都准备好了一个 bit。GC 下一次启动时会扫描 card table，了解第 1 代和第 2 代中的哪些对象的字段自上次\
  \ GC 以来已被修改。任何被修改的对象引用了第 0 代中的一个对象，被引用的第 0 代对象就会在垃圾回收过程中“存活”。GC 之后，card table 中的所有\
  \ bit 都被重置为 0。向对象的引用字段中写入时，write barrier 代码会造成少量性能损失(对应地，向局部变量或静态字段写入便不会有这个损失)。另外，如果对象在第\
  \ 1 代或第 2 代中，性能会损失得稍微多一些。\n\n> **注意** Microsoft 的性能测试表明，对第 0 代执行一次垃圾回收，所花的时间不超过\
  \ 1 毫秒。Microsoft 的目标是使垃圾回收所花的时间不超过一次普通的内存页面错误(page fault)的时间。\n\n基于代的垃圾回收器还假设越老的对象活得越长。也就是说，第\
  \ 1 代对象在应用程序中很有可能是继续可达的。如果垃圾回收器检查第 1 代中的对象，很有可能找不到多少垃圾，结果是回收不了多少内存。因此，对第 1 代进行垃圾回收很可能是浪费时间。如果真的有垃圾在第\
  \ 1 代中，它将留在那里。此时的堆如图 21-7 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_472_0.png)\n\
  \n图 21-7　经过两次垃圾回收之后，第 0 代的幸存者被提升至第 1 代（第 1 代的大小增加）；第 0 代又空出来了\n\n如你所见，所有幸存下来的第 0\
  \ 代对象都成了第 1 代的一部分。由于垃圾回收器没有检查第 1 代，所以对象 B 的内存并没有被回收，即使它在上一次垃圾回收时已经不可达。同样，在一次垃圾回收后，第\
  \ 0 代不包含任何对象，等着分配新对象。假定应用程序继续运行，并分配对象 L 到对象 O。另外，在运行过程中，应用程序停止使用对象 G、L 和 M，使它们变得不可达。此时的托管堆如图\
  \ 21-8 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_472_1.png)\n\n图 21-8　新对象分配到第\
  \ 0 代中；第 1 代产生了更多的垃圾\n\n假设分配对象 P 导致第 0 代超过预算，垃圾回收发生。由于第 1 代中的所有对象占据的内存仍小于预算，所以垃圾回收器再次决定只回收第\
  \ 0 代，忽略第 1 代中的不可达对象（对象 B 和 G）。回收后，堆的情况如图 21-9 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_472_2.png)\n\
  \n图 21-9　经过三次垃圾回收，第 0 代的幸存者被提升至第 1 代（第 1 代的大小再次增加）；第 0 代空出来了\n\n从图 21-9 可以看到，第 1\
  \ 代正在缓慢增长。假定第 1 代的增长导致它的所有对象占用了全部预算。这时，应用程序继续运行（因为垃圾回收刚刚完成），并分配对象 P 到对象 S，使第 0 代对象达到它的预算容量。这时的堆如图\
  \ 21-10 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_472_3.png)\n\n图 21-10　新对象分配到第\
  \ 0 代；第 1 代有了更多的垃圾\n\n应用程序试图分配对象 T 时，由于第 0 代已满，所以必须开始垃圾回收。但这一次垃圾回收器发现第 1 代占用了太多内存，以至于用完了预算。由于前几次对第\
  \ 0 代进行回收时，第 1 代可能已经有许多对象变得不可达（就像本例这样）。所以这次垃圾回收器决定检查第 1 代和第 0 代中的所有对象。两代都被垃圾回收后，堆的情况如图\
  \ 21-11 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_473_0.png)\n\n图 21-11　经过\
  \ 4 次垃圾回收后，第 1 代的幸存者提升至第 2 代，第 0 代的幸存者提升至第 1 代，第 0 代空出来了\n\n和之前一样，垃圾回收后，第 0 代的幸存者被提升至第\
  \ 1 代，第 1 代的幸存者被提升至第 2 代，第 0 代再次空出来了，准备好迎接新对象的到来。第 2 代中的对象经过了 2 次或更多次检查。虽然到目前为止已发生过多次垃圾回收，但只有在第\
  \ 1 代超出预算时才会检查第 1 代中的对象。而在此之前，一般都已经对第 0 代进行了好几次垃圾回收。\n\n托管堆只支持三代：第 0 代、第 1 代和第 2\
  \ 代。没有第 3 代①。CLR 初始化时，会为每一代选择预算。然而，CLR 的垃圾回收器是自调节的。这意味着垃圾回收器会在执行垃圾回收的过程中了解应用程序的行为。例如，假定应用程序构造了许多对象，但每个对象用的时间都很短。在这种情况下，对第\
  \ 0 代的垃圾回收会回收大量内存。事实上，第 0 代的所有对象都可能被回收。\n\n如果垃圾回收器发现在回收 0 代后存活下来的对象很少，就可能减少第 0 代的预算。已分配空间的减少意味着垃圾回收将更频繁地发生，但垃圾回收器每次做的事情也减少了，这减小了进程的工作集。事实上，如果第\
  \ 0 代中的所有对象都是垃圾，垃圾回收时就不必压缩（移动）任何内存；只需让 NextObjPtr 指针指回第 0 代的起始处即可。这样回收可真快！\n\n>\
  \ **注意**　如果应用程序的一些线程大多数时候都在栈顶闲置，垃圾回收器工作起来就尤其“得心应手”。在这种情况下，线程有事做就会被唤醒，创建一组短期存活的对象，返回，然后继续睡眠。许多应用程序都是这样建构的。例如，GUI\
  \ 应用程序大多数时候都让 GUI 线程处在一个消息循环中。用户偶尔产生一些输入（触摸、鼠标或键盘事件），线程被唤醒，处理输入并回到消息条。然后，为了处理输入而创建的大多数对象都会成为垃圾。\n\
  >\n> 类似地，对于服务器应用程序，线程在池里呆着，等着客户端请求进入。有客户端请求进入后，线程创建新对象，代表客户端执行工作。结果发回客户端后，线程将回到线程池，创建的所有对象现在都成了垃圾。\n\
  \n另一方面，如果垃圾回收器回收了第 0 代，发现还有很多对象存活，没有多少内存被回收，就会增大第 0 代的预算。现在，垃圾回收的次数将减少，但每次进行垃圾回收时，回收的内存要多得多。顺便说一句，如果没有回收到足够的内存，垃圾回收器会执行一次完整回收。如果还不足够，就抛出\
  \ OutOfMemoryException 异常。\n\n① System.GC 类的静态 MaxGeneration 方法返回 2。\n\n到目前为止，只是讨论了每次垃圾回收后如何动态调整第\
  \ 0 代的预算。但垃圾回收器还会用类似的启发式算法调整第 1 代和第 2 代的预算。这些代被垃圾回收时，垃圾回收器会检查有多少内存被回收，以及有多少对象幸存。基于这些结果，垃圾回收器可能增大或减小这些代的预算，从而提升应用程序的总体性能。最终的结果是，垃圾回收器会根据应用程序要求的内存负载来自动优化——这非常“酷”！\n\
  \n以下 GCNotification 类在第 0 代或第 2 代回收时引发一个事件。可以利用该事件在发生一次回收时响铃，计算两次回收的间隔时间，计算两次回收之间分配了多少内存等。可以通过这个类方便地检测应用程序，更好地理解应用程序的内存使用情况。\n\
  \n```csharp\npublic static class GCNotification {\n    private static Action<Int32>\
  \ s_gcDone = null; // 事件的字段\n\n    public static event Action<Int32> GCDone {\n\
  \        add {\n            // 如果之前没有登记的委托，就开始报告通知\n            if (s_gcDone ==\
  \ null) { new GenObject(0); new GenObject(2); }\n            s_gcDone += value;\n\
  \        }\n        remove { s_gcDone -= value; }\n    }\n\n    private sealed class\
  \ GenObject {\n        private Int32 m_generation;\n        public GenObject(Int32\
  \ generation) { m_generation = generation; }\n        ~GenObject() { // 这是 Finalize\
  \ 方法\n            // 如果这个对象在我们希望的(或更高的)代中，\n            // 就通知委托一次 GC 刚刚完成\n   \
  \         if (GC.GetGeneration(this) >= m_generation) {\n                Action<Int32>\
  \ temp = Volatile.Read(ref s_gcDone);\n                if (temp != null) temp(m_generation);\n\
  \            }\n\n            // 如果至少还有一个已登记的委托，而且 AppDomain 并非正在卸载，\n         \
  \   // 而且进程并非正在关闭，就继续报告通知\n            if ((s_gcDone != null)\n                &&\
  \ !AppDomain.CurrentDomain.IsFinalizingForUnload()\n                && !Environment.HasShutdownStarted)\
  \ {\n                // 对于第 0 代，创建一个新对象；对于第 2 代，复活对象，\n                // 使第 2 代在下次回收时，GC\
  \ 会再次调用 Finalize\n                if (m_generation == 0) new GenObject(0);\n   \
  \             else GC.ReRegisterForFinalize(this);\n            } else { /* 放过对象，让其被回收\
  \ */ }\n        }\n    }\n}\n```\n\n#### 21.2.1 垃圾回收触发条件\n\n前面说过，CLR 在检测第 0 代超过预算时触发一次\
  \ GC。这是 GC 最常见的触发条件，下面列出其他条件。\n\n- **代码显式调用 System.GC 的静态 Collect 方法**  \n  代码可显式请求\
  \ CLR 执行回收。虽然 Microsoft 强烈反对这种请求，但有时情势比人\n\n强。详情参见本章稍后的 21.2.4 节“强制垃圾回收”。\n\n- **Windows\
  \ 报告低内存情况**：CLR 内部使用 Win32 函数 **CreateMemoryResourceNotification** 和 **QueryMemoryResourceNotification**\
  \ 监视系统的总体内存使用情况。如果 Windows 报告低内存，CLR 将强制垃圾回收以释放死对象，减小进程工作集。\n- **CLR 正在卸载 AppDomain**：一个\
  \ AppDomain 卸载时，CLR 认为其中一切都不是根，所以执行涵盖所有代的垃圾回收。AppDomain 将在第 22 章讨论。\n- **CLR 正在关闭**：CLR\
  \ 在进程正常终止时关闭。关闭期间，CLR 认为进程中一切都不是根。对象有机会进行资源清理，但 CLR 不会试图压缩或释放内存。整个进程都要终止了，Windows\
  \ 将回收进程的全部内存。\n\n#### 21.2.2 大对象\n\n还有另一个性能提升举措值得注意。CLR 将对象分为大对象和小对象。本章到目前为止说的都是小对象。目前认为\
  \ 85000 字节或更大的对象是大对象。CLR 以不同方式对待大小对象。\n\n- 大对象不是在小对象的地址空间分配，而是在进程地址空间的其他地方分配。\n\
  - 目前版本的 GC 不压缩大对象，因为在内存中移动它们代价过高。但这可能在进程中的大对象之间造成地址空间的碎片化，以至于抛出 **OutOfMemoryException**。CLR\
  \ 将来的版本可能压缩大对象。\n- 大对象总是第 2 代，绝不可能是第 0 代或第 1 代。所以只能为需要长时间存活的资源创建大对象。分配短时间存活的大对象会导致第\
  \ 2 代被更频繁地回收，会损害性能。大对象一般是大字符串（比如 XML 或 JSON）或者用于 I/O 操作的字节数组（比如从文件或网络将字节读入缓冲区以便处理）。\n\
  \n可在很大程度上视大对象若无物。可忽略它们的存在。仅在出现解释不了的情况时（比如地址空间碎片化）才对它们进行特殊处理。\n\n#### 21.2.3 垃圾回收模式\n\
  \nCLR 启动时会选择一个 GC 模式，进程终止前该模式不会改变。有两个基本 GC 模式。\n\n① 与之相反的是从外部终止，比如通过任务管理器。\n\n②\
  \ 未来 CLR 可能更改大对象的标准。85000 不是常数。\n\n- **工作站**：该模式针对客户端应用程序优化 GC。GC 造成的延时很低，应用程序线程挂起时间很短，避免使用户感到焦虑。在该模式中，GC\
  \ 假定机器上运行的其他应用程序都不会消耗太多的 CPU 资源。\n- **服务器**：该模式针对服务器端应用程序优化 GC。被优化的主要是吞吐量和资源利用。GC\
  \ 假定机器上没有运行其他应用程序（无论客户端还是服务器应用程序），并假定机器的所有 CPU 都可用来辅助完成 GC。该模式造成托管堆被拆分成几个区域（section），每个\
  \ CPU 一个。开始垃圾回收时，垃圾回收器在每个 CPU 上都运行一个特殊线程；每个线程都和其他线程并发回收它自己的区域。对于工作者线程（worker thread）行为一致的服务器应用程序，并发回收能很好地进行。这个功能要求应用程序在多\
  \ CPU 计算机上运行，使线程能真正地同时工作，从而获得性能的提升。\n\n应用程序默认以“工作站”GC 模式运行。寄宿①了 CLR 的服务器应用程序（比如\
  \ ASP.NET 或 Microsoft SQL Server）可请求 CLR 加载“服务器”GC。但如果服务器应用程序在单处理器计算机上运行，CLR 将总是使用“工作站”GC\
  \ 模式。\n\n① hosts（动词）。注意，本书将 host 的动词形式统一翻译成“寄宿”，名词形式翻译成“宿主”。但在作动词用时，理解成“容纳”更佳。——译注\n\
  \n独立应用程序可创建一个配置文件②告诉 CLR 使用服务器回收器。配置文件要为应用程序添加一个 **gcServer** 元素。下面是一个示例配置文件：\n\n\
  ② 第 2 章“生成、打包、部署和管理应用程序及类型”和第 3 章“共享程序集和强命名程序集”都有讲到应用程序配置文件的问题。\n\n```xml\n<configuration>\n\
  \    <runtime>\n        <gcServer enabled=\"true\"/>\n    </runtime>\n</configuration>\n\
  ```\n\n应用程序运行时，可查询 **GCSettings** 类的只读 **Boolean** 属性 **IsServerGC** 来询问 CLR 它是否正在“服务器”GC\
  \ 模式中运行：\n\n```csharp\nusing System;\nusing System.Runtime; // 这个命名空间包含了 GCSettings\n\
  \npublic static class Program {\n    public static void Main() {\n        Console.WriteLine(\"\
  Application is running with server GC=\" +\n                          GCSettings.IsServerGC);\n\
  \    }\n}\n```\n\n除了这两种主要模式，GC 还支持两种子模式：并发（默认）或非并发。在并发方式中，垃圾回收器有一个额外的后台线程，它能在应用程序运行时并发标记对象。一个线程因为分配对象造成第\
  \ 0 代超出预算时，GC 首先挂起所有线程，再判断要回收哪些代。如果要回收第 0 代或第 1 代，那么一切如常进行。但是，如果要回收第 2 代，就会增大第 0\
  \ 代的大小（超过其预算），以便在第 0 代中分配新对象。然后，应用程序的线程恢复运行。\n\n应用程序线程运行时，垃圾回收器运行一个普通优先级的后台线程来查找不可达对象。找到之后，垃圾回收器再次挂起所有线程，判断是否要压缩（移动）内存。如决定压缩，内存会被压缩，根引用会被修正，应用程序线程恢复运行。这一次垃圾回收花费的时间比平常少，因为不可达对象集合已构造好了。但垃圾回收器也可能决定不压缩内存：事实上，垃圾回收器更倾向于选择不压缩。可用内存多，垃圾回收器便不会压缩堆；这有利于增强性能，但会增大应用程序的工作集。使用并发垃圾回收器，应用程序消耗的内存通常比使用非并发垃圾回收器多。\n\
  \n为了告诉 CLR 不要使用并发回收器，可创建包含 **gcConcurrent** 元素的应用程序配置文件。下面是配置文件的一个例子：\n\n```xml\n\
  <configuration>\n    <runtime>\n        <gcConcurrent enabled=\"false\"/>\n    </runtime>\n\
  </configuration>\n```\n\nGC 模式是针对进程配置的，进程运行期间不能更改。但是，你的应用程序可以使用 **GCSettings** 类的\
  \ **GCLatencyMode** 属性对垃圾回收进行某种程度的控制。这个读/写属性能设为 **GCLatencyMode** 枚举类型中的任何值，表 21-1\
  \ 对此进行了总结。\n\n表 21-1　GCLatencyMode 枚举类型定义的符号\n\n| 符号名称 | 说明 |\n|---|---|\n| **Batch**（“服务器”GC\
  \ 模式的默认值） | 关闭并发 GC |\n| **Interactive**（“工作站”GC 模式的默认值） | 打开并发 GC |\n| **LowLatency**\
  \ | 在短期的、时间敏感的操作中（比如动画绘制）使用这个延迟模式。这些操作不适合对第 2 代进行回收 |\n| **SustainedLowLatency**\
  \ | 使用这个延迟模式，应用程序的大多数操作都不会发生长的 GC 暂停。只要有足够内存，它将禁止所有会造成阻塞的第 2 代回收动作。事实上，这种应用程序（例如需要迅速响应的股票软件）的用户应考虑安装更多的\
  \ RAM 来防止发生长的 GC 暂停 |\n\n**LowLatency** 模式有必要多说几句。一般用它执行一次短期的、时间敏感的操作，再将模式设回普通的\
  \ **Batch** 或 **Interactive**。在模式设为 **LowLatency** 期间，垃圾回收器会全力避免任何第 2 代回收，因为那样花费的时间较多。当然，调用\
  \ **GC.Collect()** 仍会回收第 2 代。此外，如果 Windows 告诉 CLR 系统内存低，GC 也会回收第 2 代。（参见本章前面的 21.2.1\
  \ 节“垃圾回收触发条件”。）\n\n在 **LowLatency** 模式中，应用程序抛出 **OutOfMemoryException** 的机率会大一些。所以，处于该模式的时间应尽量短，避免分配太多对象，避免分配大对象，并用一个约束执行区域(CER)①将模式设回\
  \ **Batch** 或 **Interactive**。另外注意，延迟模式是进程级的设置，而可能有多个线程并发运行。在一个线程使用该设置期间，其他线程可能试图更改这个设置。所以，假如有多个线程都要操作这个设置，可考虑更新某种计数器(更新计数器要通过\
  \ **Interlocked** 的方法来进行)。以下代码展示了如何正确地使用 **LowLatency** 模式：\n\n```csharp\nprivate\
  \ static void LowLatencyDemo() {\n    GCLatencyMode oldMode = GCSettings.LatencyMode;\n\
  \    System.Runtime.CompilerServices.RuntimeHelpers.PrepareConstrainedRegions();\n\
  \    try {\n        GCSettings.LatencyMode = GCLatencyMode.LowLatency;\n       \
  \ // 在这里运行你的代码...\n    }\n    finally {\n        GCSettings.LatencyMode = oldMode;\n\
  \    }\n}\n```\n\n#### 21.2.4 强制垃圾回收\n\n**System.GC** 类型允许应用程序对垃圾回收器进行一些直接控制。例如，可读取\
  \ **GC.MaxGeneration** 属性来查询托管堆支持的最大代数；该属性总是返回 2。\n\n还可调用 **GC** 类的 **Collect**\
  \ 方法强制垃圾回收。可向方法传递一个代表最多回收几代的整数、一个 **GCCollectionMode** 以及指定阻塞(非并发)或后台(并发)回收的一个 **Boolean**\
  \ 值。以下是最复杂的 **Collect** 重载的签名：\n\n```csharp\nvoid Collect(Int32 generation, GCCollectionMode\
  \ mode, Boolean blocking);\n```\n\n表 21-2　GCCollectionMode 枚举类型定义的符号\n\n| 符号名称 |\
  \ 说明 |\n|---|---|\n| **Default** | 等同于不传递任何符号名称。目前还等同于传递 **Forced**，但 CLR 未来的版本可能对此进行修改\
  \ |\n| **Forced** | 强制回收指定的代(以及低于它的所有代) |\n| **Optimized** | 只有在能释放大量内存或者能减少碎片化的前提下，才执行回收。如果垃圾回收没有什么效率，当前调用就没有任何效果\
  \ |\n\n大多时候都要避免调用任何 **Collect** 方法；最好让垃圾回收器自行斟酌执行，让它根据应用程序的行为调整各个代的预算。但如果写一个 CUI(console\
  \ user interface，控制台用户界面)或 GUI(graphical user interface，图形用户界面)应用程序，应用程序代码将拥有进程和那个进程中的\
  \ CLR。对于这种应用程序，你可能希望建议垃圾回收的时间；为此，请将 GCCollectionMode 设为 Optimized 并调用 Collect。Default\
  \ 和 Forced 模式一般用于调试、测试和查找内存泄漏。\n\n例如，假如刚才发生了某个非重复性的事件，并导致大量旧对象死亡，就可考虑手动调用一次 Collect\
  \ 方法。由于是非重复性事件，垃圾回收器基于历史的预测可能变得不准确。所以，这时调用 Collect 方法是合适的。例如，在应用程序初始化完成之后或者在用户保存了一个数据文件之后，应用程序可强制执行一次对所有代的垃圾回收。由于调用\
  \ Collect 会导致代的预算发生调整，所以调用它不是为了改善应用程序的响应时间，而是为了减小进程工作集。\n\n对于某些应用程序(尤其是喜欢在内存中容纳大量对象的服务器应用程序)，如果对包括第\
  \ 2 代在内的对象执行完全的垃圾回收，花费的时间可能过长。如果一次回收要花很长时间才能完成，客户端请求可能超时。为了满足这种应用程序的需求，GC 类提供了一个\
  \ RegisterForFullGCNotification 方法。利用这个方法和一些额外的辅助方法 (WaitForFullGCApproach，WaitForFullGCComplete\
  \ 和 CancelFullGCNotification)，应用程序会在垃圾回收器将要执行完全回收时收到通知。然后，应用程序可调用 GC.Collect，在更恰当的时间强制回收。也可与另一个服务器通信，对客户端请求进行更好的负载平衡。欲知详情，请在文档中查找这些方法和“垃圾回收通知”主题。注意，WaitForFullGCApproach\
  \ 和 WaitForFullGCComplete 方法必须成对调用，CLR 内部把它们当作一对儿进行处理。\n\n#### 21.2.5 监视应用程序的内存使用\n\
  \n可在进程中调用几个方法来监视垃圾回收器。具体地说，GC 类提供了以下静态方法，可调用它们查看某一代发生了多少次垃圾回收，或者托管堆中的对象当前使用了多少内存。\n\
  \n```csharp\nInt32 CollectionCount(Int32 generation);\nInt64 GetTotalMemory(Boolean\
  \ forceFullCollection);\n```\n\n为了评估(profile)特定代码块的性能，我经常在代码块前后写代码调用这些方法，并计算差异。这使我能很好地把握代码块对进程工作集的影响，并了解执行代码块时发生了多少次垃圾回收。数字太大，就知道应该花更多的时间调整代码块中的算法。\n\
  \n还可以了解单独的 AppDomain(而非整个进程)使用了多少内存。欲知这方面的详情，请参见 22.4 节“监视 AppDomain”。\n\n安装.NET\
  \ Framework 时会自动安装一组性能计数器，为 CLR 的操作提供大量实时统计数据。这些统计数据可通过 Windows 自带的 PerfMon.exe\
  \ 工具或者“系统监视器” ActiveX 控件来查看。访问“系统监视器”最简单的方式就是运行 PerfMon.exe，单击“+”工具栏按钮，随后会显示“添加计数器”对话框，如图\
  \ 21-12 所示。\n\n为了监视 CLR 的垃圾回收器，请选择“.NET CLR Memory”性能对象。然后，从下方的实例列表框中选择一个具体的应用程序。最后，选定想监视的计数器集合，单击“添加”，再单击“确定”。随后，“性能监视器”会图示实时统计数据。要知道特定计数器的含义，请选定该计数器，然后勾选“显示描述”。\n\
  \n还有一个很出色的工具可分析内存和应用程序的性能，它的名字是 **PerfView**。该工具能收集“Windows 事件跟踪”（Event Tracing\
  \ for Windows，ETW）日志并处理它们。获取该工具最好的办法是网上搜索 PerfView。最后还应该考虑一下 SOS Debugging Extension（SOS.dll），它对于内存问题和其他\
  \ CLR 问题的调试颇有帮助。对于内存有关的行动，SOS Debugging Extension 允许检查进程中为托管堆分配了多少内存，显示在终结队列中登记终结的所有对象，显示每个\
  \ AppDomain 或整个进程的 GCHandle 表中的记录项，并显示是什么根保持对象在堆中存活。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_480_0.png)\n\
  \n图 21-12　PerfMon.exe 显示了 .NET CLR Memory 计数器\n\n### 21.3 使用需要特殊清理的类型\n\n你现在基本了解了垃圾回收和托管堆的情况，包括垃圾回收器如何回收对象的内存。幸好，大多数类型有内存就能正常工作。但有的类型除了内存还需要本机资源。\n\
  \n例如，**System.IO.FileStream** 类型需要打开一个文件（本机资源）并保存文件的句柄。然后，类型的 **Read** 和 **Write**\
  \ 方法用句柄操作文件。类似地，**System.Threading.Mutex** 类型要打开一个 Windows 互斥体内核对象（本机资源）并保存其句柄，并在调用\
  \ **Mutex** 的方法时使用该句柄。\n\n包含本机资源的类型被 GC 时，GC 会回收对象在托管堆中使用的内存。但这样会造成本机资源（GC 对它一无所知）的泄漏，这当然是不允许的。所以，CLR\
  \ 提供了称为**终结**（finalization）的机制，允许对象在被判定为垃圾之后，但在对象内存被回收之前执行一些代码。任何包装了本机资源（文件、网络连接、套接字、互斥体）的类型都支持终结。CLR\
  \ 判定一个对象不可达时，对象将终结它自己，释放它包装的本机资源。之后，GC 会从托管堆回收对象。\n\n终极基类 **System.Object** 定义了受保护的虚方法\
  \ **Finalize**。垃圾回收器判定对象是垃圾后，会调用对象的 **Finalize** 方法（如果重写）。Microsoft 的 C# 团队认为 **Finalize**\
  \ 在编程语言中需要特殊语法(类似于 C#要求用特殊语法定义构造器)。因此，C#要求在类名前添加~符号来定义 **Finalize** 方法，如下例所示：\n\n\
  ```csharp\ninternal sealed class SomeType {\n    // 这是一个 Finalize 方法\n    ~SomeType()\
  \ {\n        // 这里的代码会进入 Finalize 方法\n    }\n}\n```\n\n编译上述代码，用 ILDasm.exe 检查得到的程序集，会发现\
  \ C#编译器实际是在模块的元数据中生成了名为 **Finalize** 的 **protected override** 方法。查看 **Finalize**\
  \ 的 IL，会发现方法主体的代码被放到一个 **try** 块中，在 **finally** 块中放入了一个 **base.Finalize** 调用。\n\n\
  > **重要提示**  如果熟悉 C++，会发现 C# **Finalize** 方法的特殊语法非常类似于 C++析构器。事实上，在 C#编程语言规范的早期版本中，真的是将该方法称为析构器。但\
  \ **Finalize** 方法的工作方式和 C++析构器完全不同，这会使从一种语言迁移到另一种语言的开发人员产生混淆。\n>\n> 问题在于，这些开发人员可能错误地以为使用\
  \ C#析构器语法意味着类型的实例会被确定性析构，就像在 C++中那样。但 CLR 不支持确定性析构，而作为面向 CLR 的语言，C#也无法提供这种机制。\n\n\
  被视为垃圾的对象在垃圾回收完毕后才调用 **Finalize** 方法，所以这些对象的内存不是马上被回收的，因为 **Finalize** 方法可能要执行访问字段的代码。可终结对象在回收时必须存活，造成它被提升到另一代，使对象活得比正常时间长。这增大了内存耗用，所以应尽可能避免终结。更糟的是，可终结对象被提升时，其字段引用的所有对象也会被提升，因为它们也必须继续存活。所以，要尽量避免为引用类型的字段定义可终结对象。\n\
  \n另外要注意，**Finalize** 方法的执行时间是控制不了的。应用程序请求更多内存时才可能发生 GC，而只有 GC 完成后才运行 **Finalize**。另外，CLR\
  \ 不保证多个 **Finalize** 方法的调用顺序。所以，在 **Finalize** 方法中不要访问定义了 **Finalize** 方法的其他类型的对象；那些对象可能已经终结了。但可以安全地访问值类型的实例，或者访问没有定义\
  \ **Finalize** 方法的引用类型的对象。调用静态方法也要当心，这些方法可能在内部访问已终结的对象，导致静态方法的行为变得无法预测。\n\nCLR 用一个特殊的、高优先级的专用线程调用\
  \ **Finalize** 方法来避免死锁①。如果 **Finalize** 方法阻塞(例如进入死循环，或等待一个永远不发出信号的对象)，该特殊线程就调用不了任何更多的\
  \ **Finalize** 方法。这是非常坏的情况，因为应用程序永远回收不了可终结对象占用的内存——只要应用程序运行就会一直泄漏内存。如果 **Finalize**\
  \ 方法抛出未处理的异常，则进程终止，没办法捕捉该异常。\n\n① CLR 将来的版本可能用多个终结器线程提升性能。\n\n\n\n综上所述，**Finalize**\
  \ 方法问题较多，使用须谨慎。记住它们是为释放本机资源而设计的。强烈建议不要重写 **Object** 的 **Finalize** 方法。相反，使用 Microsoft\
  \ 在 FCL 中提供的辅助类。这些辅助类重写了 **Finalize** 方法并添加了一些特殊的 CLR “魔法”（以后会慢慢讲述）。你从这些辅助类派生出自己的类，从而继承\
  \ CLR 的“魔法”。\n\n创建封装了本机资源的托管类型时，应该先从 **System.Runtime.InteropServices.SafeHandle**\
  \ 这个特殊基类派生出一个类。该类的形式如下（我在方法中添加了注释，指明它们做的事情）：\n\n```csharp\npublic abstract class\
  \ SafeHandle : CriticalFinalizerObject, IDisposable {\n    // 这是本机资源的句柄\n    protected\
  \ IntPtr handle;\n\n    protected SafeHandle(IntPtr invalidHandleValue, Boolean\
  \ ownsHandle) {\n        this.handle = invalidHandleValue;\n        // 如果 ownsHandle\
  \ 为 true，那么这个从 SafeHandle 派生的对象被回收时，\n        // 本机资源会被关闭\n    }\n\n    protected\
  \ void SetHandle(IntPtr handle) {\n        this.handle = handle;\n    }\n\n    //\
  \ 可调用 Dispose 显式释放资源\n    // 这是 IDisposable 接口的 Dispose 方法\n    public void Dispose()\
  \ { Dispose(true); }\n\n    // 默认的 Dispose 实现 (如下所示) 正是我们希望的。强烈建议不要重写这个方法\n    protected\
  \ virtual void Dispose(Boolean disposing) {\n        // 这个默认实现会忽略 disposing 参数；\n\
  \        // 如果资源已经释放，那么返回；\n        // 如果 ownsHandle 为 false，那么返回；\n        // 设置一个标志来指明该资源已经释放；\n\
  \        // 调用虚方法 ReleaseHandle；\n        // 调用 GC.SuppressFinalize(this) 方法来阻止调用\
  \ Finalize 方法；\n        // 如果 ReleaseHandle 返回 true，那么返回；\n        // 如果走到这一步，就激活\
  \ releaseHandleFailed 托管调试助手(MDA)。\n    }\n\n    // 默认的 Finalize 实现 (如下所示) 正是我们希望的。强烈建议不要重写这个方法\n\
  \    ~SafeHandle() { Dispose(false); }\n\n    // 派生类要重写这个方法以实现释放资源的代码\n    protected\
  \ abstract Boolean ReleaseHandle();\n\n    public void SetHandleAsInvalid() {\n\
  \        // 设置标志来指出这个资源已经释放\n        // 调用 GC.SuppressFinalize(this) 方法来阻止调用 Finalize\
  \ 方法\n    }\n\n    public Boolean IsClosed {\n        get {\n            // 返回指出资源是否释放的一个标志\n\
  \        }\n    }\n\n    public abstract Boolean IsInvalid {\n        // 派生类要重写这个属性\n\
  \        // 如果句柄的值不代表资源 (通常意味着句柄为 0 或 -1)，实现应返回 true\n        get;\n    }\n\n  \
  \  // 以下三个方法涉及安全性和引用计数，本节最后会讨论它们\n    public void   DangerousAddRef(ref Boolean\
  \ success) {...}\n    public IntPtr DangerousGetHandle() {...}\n    public void\
  \   DangerousRelease() {...}\n}\n```\n\n**SafeHandle** 类有两点需要注意。其一，它派生自 **CriticalFinalizerObject**；后者在\
  \ **System.Runtime.ConstrainedExecution** 命名空间定义。CLR 以特殊方式对待这个类及其派生类。具体地说，CLR 赋予这个类以下三个很酷的功能。\n\
  \n- 首次构造任何 **CriticalFinalizerObject** 派生类型的对象时，CLR 立即对继承层次结构中的所有 **Finalize** 方法进行\
  \ JIT 编译。构造对象时就编译这些方法，可确保当对象被确定为垃圾之后，本机资源肯定会得以释放。不对 **Finalize** 方法进行提前编译，那么也许能分配并使用本机资源，但无法保证释放。内存紧张时，CLR\
  \ 可能找不到足够的内存来编译 **Finalize** 方法，这会阻止 **Finalize** 方法的执行，造成本机资源泄漏。另外，如果 **Finalize**\
  \ 方法中的代码引用了另一个程序集中的类型，但 CLR 定位该程序集失败，那么资源将得不到释放。\n- CLR 是在调用了非 **CriticalFinalizerObject**\
  \ 派生类型的 **Finalize** 方法之后，才调用 **CriticalFinalizerObject** 派生类型的 **Finalize** 方法。这样，托管资源类就可以在它们的\
  \ **Finalize** 方法中成功地访问 **CriticalFinalizerObject** 派生类型的对象。例如，**FileStream** 类的\
  \ **Finalize** 方法可以放心地将数据从内存缓冲区 flush①到磁盘，它知道此时磁盘文件还没有关闭。\n- 如果 **AppDomain** 被一个宿主应用程序(例如\
  \ **Microsoft SQL Server** 或者 **Microsoft ASP.NET**)强行中断，CLR 将调用 **CriticalFinalizerObject**\
  \ 派生类型的 **Finalize** 方法。宿主应用程序不再信任它内部运行的托管代码时，也利用这个功能确保本机资源得以释放。\n\n其二，**SafeHandle**\
  \ 是抽象类，必须有另一个类从该类派生并重写受保护的构造器、抽象方法 **ReleaseHandle** 以及抽象属性 **IsInvalid** 的 get\
  \ 访问器方法。\n\n多数本机资源都用句柄(32 位系统是 32 位值，64 位系统是 64 位值)进行操作。所以 **SafeHandle** 类定义了受保护\
  \ **IntPtr** 字段 **handle**。在 Windows 中，大多数值为 0 或 -1 的句柄都是无效的。**Microsoft.Win32.SafeHandles**\
  \ 命名空间包含 **SafeHandleZeroOrMinusOneIsInvalid** 辅助类，如下所示：\n\n```csharp\npublic abstract\
  \ class SafeHandleZeroOrMinusOneIsInvalid : SafeHandle {\n    protected SafeHandleZeroOrMinusOneIsInvalid(Boolean\
  \ ownsHandle)\n        : base(IntPtr.Zero, ownsHandle) {\n    }\n\n    public override\
  \ Boolean IsInvalid {\n```\n\n```csharp\ninternal static class SomeType {\n    [DllImport(\"\
  Kernel32\", CharSet=CharSet.Unicode, EntryPoint=\"CreateEvent\")]\n    // 这个原型不健壮\n\
  \    private static extern IntPtr CreateEventBad(\n        IntPtr pSecurityAttributes,\
  \ Boolean manualReset,\n        Boolean initialState, String name);\n\n    // 这个原型是健壮的\n\
  \    [DllImport(\"Kernel32\", CharSet=CharSet.Unicode, EntryPoint=\"CreateEvent\"\
  )]\n    private static extern SafeWaitHandle CreateEventGood(\n        IntPtr pSecurityAttributes,\
  \ Boolean manualReset,\n        Boolean initialState, String name);\n\n    public\
  \ static void SomeMethod() {\n        IntPtr          handle = CreateEventBad(IntPtr.Zero,\
  \ false, false, null);\n        SafeWaitHandle  swh    = CreateEventGood(IntPtr.Zero,\
  \ false, false, null);\n    }\n}\n```\n\n在上述代码中，**CreateEventBad** 方法的原型是返回一个 **IntPtr**，这会将句柄返回给托管代码。但以这种方式与本机代码交互是不健壮的。调用\
  \ **CreateEventBad**（该方法创建本机事件资源）之后，在将句柄赋给 **handle** 变量之前，可能抛出一个 **ThreadAbortException**。虽然这很少发生，但一旦发生，托管代码将造成本机资源的泄漏。这时只有终止整个进程才能关闭事件。\n\
  \n**SafeHandle** 类修正了这个潜在的资源泄漏问题。注意，**CreateEventGood** 方法的原型是返回一个 **SafeWaitHandle**（而非\
  \ **IntPtr**）。调用 **CreateEventGood** 方法时，CLR 会调用 Win32 **CreateEvent** 函数。**CreateEvent**\
  \ 函数返回至托管代码时，CLR 知道 **SafeWaitHandle** 是从 **SafeHandle** 派生的，所以会自动在托管堆构造 **SafeWaitHandle**\
  \ 的实例，向其传递从 **CreateEvent** 返回的句柄值。新 **SafeWaitHandle** 对象的构造以及句柄的赋值现在是在本机代码中发生的，不可能被一个\
  \ **ThreadAbortException** 打断。托管代码现在不可能泄漏这个本机资源。**SafeWaitHandle** 对象最终会被垃圾回收，其\
  \ **Finalize** 方法会被调用，确保资源得以释放。\n\n**SafeHandle** 派生类最后一个值得注意的功能是防止有人利用潜在的安全漏洞。问题起因是一个线程可能试图使用一个本机资源，而另一个线程试图释放该资源。这可能造成句柄循环使用漏洞。**SafeHandle**\
  \ 类防范这个安全隐患的办法是使用引用计数。**SafeHandle** 类内部定义了私有字段来维护一个计数器。一旦某个 **SafeHandle** 派生对象被设为有效句柄，计数器就被设为\
  \ 1。每次将 **SafeHandle** 派生对象作为实参传给一个本机方法（非托管方法），CLR 就会自动递增计数器。类似地，当本机方法返回到托管代码时，CLR\
  \ 自动递减计数器。例如，Win32 **SetEvent** 函数的原型如下：\n\n```csharp\n[DllImport(\"Kernel32\",\
  \ ExactSpelling=true)]\nprivate static extern Boolean SetEvent(SafeWaitHandle swh);\n\
  ```\n\n现在，调用这个方法并传递一个 **SafeWaitHandle** 对象引用，CLR 会在调用前递增计数器，调用后递减计数器。当然，对计数器的操作是以线程安全的方式进行的。那么安全性如何得以保障？当另一个线程试图释放\
  \ **SafeHandle** 对象包装的本机资源时，CLR 知道它实际上不能释放资源，因为该资源正在由一个本机（非托管）函数使用。本机函数返回后，计数器递减为\
  \ 0，资源才会得以释放。\n\n如果编写或调用代码将句柄作为一个 **IntPtr** 来操作，可以从 **SafeHandle** 对象中访问它，但就要显式操作引用计数器。这是通过\
  \ **SafeHandle** 的 **DangerousAddRef** 和 **DangerousRelease** 方法来完成的。另外，可通过 **DangerousGetHandle**\
  \ 方法访问原始句柄。\n\n**System.Runtime.InteropServices** 命名空间还定义了一个 **CriticalHandle**\
  \ 类。该类除了不提供引用计数器功能，其他方面与 **SafeHandle** 类相同。**CriticalHandle** 类及其派生类通过牺牲安全性来换取更好的性能（因为不用操作计数器）。和\
  \ **SafeHandle** 相似，**CriticalHandle** 类也有自己的几个派生类型，其中包括 **CriticalHandleMinusOneIsInvalid**\
  \ 和 **CriticalHandleZeroOrMinusOneIsInvalid**。由于 Microsoft 倾向于建立更安全而不是更快的系统，所以类库中没有提供从这两个类派生的类型。自己写程序时，建议只有在必须追求性能的时候才使用派生自\
  \ **CriticalHandle** 的类型。如果降低安全性不会有什么严重的后果，就选择从 **CriticalHandle** 派生的一个类型。\n\n\
  ### 21.3.1 使用包装了本机资源的类型\n\n你现在知道了如何定义包装了本机资源的 **SafeHandle** 派生类，接着说说如何使用它。以常用的\
  \ **System.IO.FileStream** 类为例，可利用它打开一个文件，从文件中读取字节，向文件写入字节，然后关闭文件。**FileStream**\
  \ 对象在构造时会调用 Win32 **CreateFile** 函数，函数返回的句柄保存到 **SafeFileHandle** 对象中，然后通过 **FileStream**\
  \ 对象的一个私有字段来维护对该对象的引用。**FileStream** 类还提供了几个额外的属性（例如 **Length，Position，CanRead**）和方法（例如\
  \ **Read，Write，Flush**）。\n\n假定要写代码来创建一个临时文件，向其中写入一些字节，然后删除文件。开始可能会像下面这样写代码：\n\n\
  ```csharp\nusing System;\nusing System.IO;\n\npublic static class Program {\n  \
  \  public static void Main() {\n        // 创建要写入临时文件的字节\n        Byte[] bytesToWrite\
  \ = new Byte[] { 1, 2, 3, 4, 5 };\n\n        // 创建临时文件\n        FileStream fs =\
  \ new FileStream(\"Temp.dat\", FileMode.Create);\n\n        // 将字节写入临时文件\n     \
  \   fs.Write(bytesToWrite, 0, bytesToWrite.Length);\n\n        // 删除临时文件\n     \
  \   File.Delete(\"Temp.dat\"); // 抛出 IOException 异常\n    }\n}\n```\n\n遗憾的是，生成并运行上述代码，它也许能工作，但大多数时候都不能。问题在于\
  \ File 的静态 Delete 方法要求 Windows 删除一个仍然打开的文件。所以 Delete 方法会抛出 System.IO.IOException\
  \ 异常，并显示以下字符串消息：**文件\"Temp.dat\"正由另一进程使用，因此该进程无法访问此文件。**\n\n但某些情况下，文件可能“误打误撞”地被删除！如果另一线程不知怎么造成了一次垃圾回收，而且这次垃圾回收刚好在调用\
  \ Write 之后、调用 Delete 之前发生，那么 FileStream 的 SafeFileHandle 字段的 Finalize 方法就会被调用，这会关闭文件，随后\
  \ Delete 操作也就可以正常运行。但发生这种情况的概率很小，上述代码无法运行的可能性在 99%以上。\n\n类如果想允许使用者控制类所包装的本机资源的生存期，就必须实现如下所示的\
  \ IDisposable 接口。\n\n```csharp\npublic interface IDisposable {\n    void Dispose();\n\
  }\n```\n\n> **重要提示** 如果类定义的一个字段的类型实现了 dispose 模式，那么类本身也应实现 dispose 模式。Dispose 方法应\
  \ dispose 字段引用的对象。这就允许类的使用者在类上调用 Dispose 来释放对象自身使用的资源。\n\n幸好，FileStream 类实现了 IDisposable\
  \ 接口。在实现中，会在 FileStream 对象的私有 SafeFileHandle 字段上调用 Dispose。现在就能修改代码来显式关闭文件，而不是等着未来某个时候\
  \ GC 的发生。下面是修改后的源代码。\n\n```csharp\nusing System;\nusing System.IO;\n\npublic static\
  \ class Program {\n    public static void Main() {\n        // 创建要写入临时文件的字节\n  \
  \      Byte[] bytesToWrite = new Byte[] { 1, 2, 3, 4, 5 };\n\n        // 创建临时文件\n\
  \        FileStream fs = new FileStream(\"Temp.dat\", FileMode.Create);\n\n    \
  \    // 将字节写入临时文件\n        fs.Write(bytesToWrite, 0, bytesToWrite.Length);\n```\n\
  \n- ① 实现了 IDisposable 接口，就实现了 dispose 模式。——译注\n- ② 文档将 disposal 和 dispose 翻译成“释放”。这里解释一下为什么不赞成这个翻译。在英语中，这个词的意思是“摆脱”或“除去”（get\
  \ rid of）一个东西，尤其是在这个东西很难除去的情况下。之所以认为“释放”不恰当，除了和 release 一词冲突，还因为 dispose 强调了“清理”和“处置”，而且在完成（对象中包装的）资源的清理之后，对象占用的内存还暂时不会释放。所以，“dispose\
  \ 一个对象”真正的意思是：清理或处置对象中包装的资源（比如它的字段引用的对象），然后等着在一次垃圾回收之后回收该对象占用的托管堆内存（此时才释放）。为避免误解，本书保留了\
  \ dispose 和 disposal 的原文。——译注\n\n\n\n例如，一个进程可以在执行垃圾回收之前分配数百个位图（它们用的托管内存太少了）。但如果进程操作许多位图，进程的内存消耗将以一个恐怖的速度增长。为了修正这个问题，GC\
  \ 类提供了以下两个静态方法：\n\n```csharp\npublic static void AddMemoryPressure(Int64 bytesAllocated);\n\
  public static void RemoveMemoryPressure(Int64 bytesAllocated);\n```\n\n如果一个类要包装可能很大的本机资源，就应该使用这些方法提示垃圾回收器实际需要消耗多少内存。垃圾回收器内部会监视内存压力，压力变大时，就强制执行垃圾回收。\n\
  \n有的本机资源的数量是固定的。例如，Windows 以前就限制只能创建 5 个设备上下文。应用程序能打开的文件数量也必须有限制。同样地，从 CLR 的角度看，一个进程可以在执行垃圾回收之前分配数百个对象（每个对象都使用极少的内存）。但是，如果这些本机资源的数量有限，那么一旦试图使用超过允许数量的资源，通常会导致抛出异常。为了解决这个问题，命名空间\
  \ **System.Runtime.InteropServices** 提供了 **HandleCollector** 类：\n\n```csharp\npublic\
  \ sealed class HandleCollector {\n    public HandleCollector(String name, Int32\
  \ initialThreshold);\n    public HandleCollector(String name, Int32 initialThreshold,\n\
  \        Int32 maximumThreshold);\n    public void Add();\n    public void Remove();\n\
  \n    public Int32 Count { get; }\n    public Int32 InitialThreshold { get; }\n\
  \    public Int32 MaximumThreshold { get; }\n    public String Name { get; }\n}\n\
  ```\n\n如果一个类要包装数量有限制的本机资源，就应该使用该类的实例来提示垃圾回收器实际要使用资源的多少个实例。该类的对象会在内部监视这个计数，计数太大就强制垃圾回收。\n\
  \n> **注意**　在内部，**GC.AddMemoryPressure** 和 **HandleCollector.Add** 方法会调用 **GC.Collect**，在第\
  \ 0 代超过预算前强制进行 GC。一般都强烈反对强制开始一次垃圾回收，因为它会对应用程序性能造成负面影响。但是，类之所以调用这些方法，是为了保证应用程序能用上有限的本机资源。本机资源用光了，应用程序就会失败。对于大多数应用程序，性能遭受一些损失总胜于完全无法运行。\n\
  \n以下代码演示了内存压力方法及 **HandleCollector** 类的使用和效果：\n\n```csharp\nusing System;\nusing\
  \ System.Runtime.InteropServices;\n\npublic static class Program {\n    public static\
  \ void Main() {\n        MemoryPressureDemo(0);                    // 0 导致不频繁的 GC\n\
  \        MemoryPressureDemo(10 * 1024 * 1024);     // 10MB 导致频繁的 GC\n\n        HandleCollectorDemo();\n\
  \    }\n\n    private static void MemoryPressureDemo(Int32 size) {\n        Console.WriteLine();\n\
  \        Console.WriteLine(\"MemoryPressureDemo, size={0}\", size);\n\n        //\
  \ 创建一组对象，并指定它们的逻辑大小\n        for (Int32 count = 0; count < 15; count++) {\n    \
  \        new BigNativeResource(size);\n        }\n\n        // 出于演示目的，强制一切都被清理\n\
  \        GC.Collect();\n    }\n\n    private sealed class BigNativeResource {\n\
  \        private Int32 m_size;\n\n        public BigNativeResource(Int32 size) {\n\
  \            m_size = size;\n            // 使垃圾回收器认为对象在物理上比较大\n            if (m_size\
  \ > 0) GC.AddMemoryPressure(m_size);\n            Console.WriteLine(\"BigNativeResource\
  \ create.\");\n        }\n\n        ~BigNativeResource() {\n            // 使垃圾回收器认为对象释放了更多的内存\n\
  \            if (m_size > 0) GC.RemoveMemoryPressure(m_size);\n            Console.WriteLine(\"\
  BigNativeResource destroy.\");\n        }\n    }\n\n    private static void HandleCollectorDemo()\
  \ {\n        Console.WriteLine();\n        Console.WriteLine(\"HandleCollectorDemo\"\
  );\n        for (Int32 count = 0; count < 10; count++) {\n            new LimitedResource();\n\
  \        }\n\n        // 出于演示目的，强制一切都被清理\n        GC.Collect();\n    }\n\n    private\
  \ sealed class LimitedResource {\n        // 创建一个 HandleCollector，告诉它当两个或者更多这样的对象\n\
  \        // 存在于堆中时，就执行回收\n        private static readonly HandleCollector s_hc =\n\
  \            new HandleCollector(\"LimitedResource\", 2);\n\n        public LimitedResource()\
  \ {\n            // 告诉 HandleCollector 堆中增加了一个 LimitedResource 对象\n            s_hc.Add();\n\
  \            Console.WriteLine(\"LimitedResource create. Count={0}\", s_hc.Count);\n\
  \        }\n\n        ~LimitedResource() {\n            // 告诉 HandleCollector 堆中移除了一个\
  \ LimitedResource 对象\n            s_hc.Remove();\n            Console.WriteLine(\"\
  LimitedResource destroy. Count={0}\", s_hc.Count);\n        }\n    }\n}\n```\n\n\
  编译并运行上述代码，会得到和下面相似的输出。\n\n```text\nMemoryPressureDemo, size=0\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\n\nMemoryPressureDemo,\
  \ size=10485760\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ create.\nBigNativeResource create.\nBigNativeResource create.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\nBigNativeResource destroy.\nBigNativeResource\
  \ destroy.\nBigNativeResource destroy.\n\nHandleCollectorDemo\nLimitedResource create.\
  \ Count=1\nLimitedResource create. Count=2\nLimitedResource create. Count=3\nLimitedResource\
  \ destroy. Count=3\nLimitedResource destroy. Count=2\nLimitedResource destroy. Count=1\n\
  LimitedResource create. Count=1\nLimitedResource create. Count=2\nLimitedResource\
  \ create. Count=3\n```\n\n垃圾回收开始时，对象 B，E，G，H，I 和 J 被判定为垃圾。垃圾回收器扫描终结列表以查找对这些对象的引用。找到一个引用后，该引用会从终结列表中移除，并附加到\
  \ **freachable** 队列。**freachable** 队列（发音是“F-reachable”）也是垃圾回收器的一种内部数据结构。队列中的每个引用都代表其\
  \ **Finalize** 方法已准备好调用的一个对象。图 21-14 展示了回收完毕后的托管堆。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_496_0.png)\n\
  \n图 21-14 在托管堆中，一些指针从终结列表移至 **freachable** 队列\n\n从图 21-14 可以看出，对象 B，G 和 H 占用的内存已被回收，因为它们没有\
  \ **Finalize** 方法。但对象 E，I 和 J 占用的内存暂时不能回收，因为它们的 **Finalize** 方法还没有调用。\n\n一个特殊的高优先级\
  \ CLR 线程专门调用 **Finalize** 方法。专用线程可避免潜在的线程同步问题。（使用应用程序的普通优先级线程就可能发生这个问题。）**freachable**\
  \ 队列为空时（这很常见），该线程将睡眠。但一旦队列中有记录项出现，线程就会被唤醒，将每一项都从 **freachable** 队列中移除，同时调用每个对象的\
  \ **Finalize** 方法。由于该线程的特殊工作方式，**Finalize** 中的代码不应该对执行代码的线程做出任何假设。例如，不要在 **Finalize**\
  \ 方法中访问线程的本地存储。\n\nCLR 未来可能使用多个终结器线程。所以，代码不应假设 **Finalize** 方法会被连续调用。在只有一个终结器线程的情况下，可能有多个\
  \ CPU 分配可终结的对象，但只有一个线程执行 **Finalize** 方法，这造成该线程可能跟不上分配的速度，从而产生性能和伸缩性方面的问题。\n\n终结列表和\
  \ **freachable** 队列之间的交互很有意思。首先，让我告诉你 **freachable** 队列这个名称的由来。“f”明显代表“终结”（finalization）；**freachable**\
  \ 队列中的每个记录项都是对托管堆中应调用其 **Finalize** 方法的一个对象的引用。“reachable”意味着对象是可达的。换言之，可将 **freachable**\
  \ 队列看成是像静态字段那样的一个根。所以，**freachable** 队列中的引用使它指向的对象保持可达，不是垃圾。\n\n简单地说，当一个对象不可达时，垃圾回收器就把它视为垃圾。但是，当垃圾回收器将对象的引用从终结列表移至\
  \ **freachable** 队列时，对象不再被认为是垃圾，不能回收它的内存。对象被视为垃圾又变得不是垃圾，我们说对象被复活了。\n\n标记 **freachable**\
  \ 对象时，将递归标记对象中的引用类型的字段所引用的对象；所有这些对象也必须复活以便在回收过程中存活。之后，垃圾回收器才结束对垃圾的标识。在这个过程中，一些原本被认为是垃圾的对象复活了。然后，垃圾回收器压缩（移动）可回收的内存，将复活的对象提升到较老的一代（这不理想）。现在，特殊的终结线程清空\
  \ **freachable** 队列，执行每个对象的 **Finalize** 方法。\n\n下次对老一代进行垃圾回收时，会发现已终结的对象成为真正的垃圾，因为没有应用程序的根指向它们，**freachable**\
  \ 队列也不再指向它们。所以，这些对象的内存会直接回收。整个过程中，注意，可终结对象需要执行两次垃圾回收才能释放它们占用的内存。在实际应用中，由于对象可能被提升至另一代，所以可能要求不止进行两次垃圾回收。图\
  \ 21-15 展示了第二次垃圾回收后托管堆的情况。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_497_0.png)\n\
  \n图 21-15　第二次垃圾回收后托管堆的情况\n\n#### 21.3.5 手动监视和控制对象的生存期\n\nCLR 为每个 AppDomain 都提供了一个\
  \ GC 句柄表（GC Handle table），允许应用程序监视或手动控制对象的生存期。这个表在 AppDomain 创建之初是空白的。表中每个记录项都包含以下两种信息：对托管堆中的一个对象的引用，以及指出如何监视或控制对象的标志（flag）。应用程序使用如下所示的\
  \ **System.Runtime.InteropServices.GCHandle** 类型在表中添加或删除记录项。\n\n```csharp\n// 该类型在\
  \ System.Runtime.InteropServices 命名空间中定义\npublic struct GCHandle {\n    // 静态方法，用于在表中创建一个记录项\n\
  \    public static GCHandle Alloc(object value);\n    public static GCHandle Alloc(object\
  \ value, GCHandleType type);\n\n    // 静态方法，用于将一个 GCHandle 转换成一个 IntPtr\n    public\
  \ static explicit operator IntPtr(GCHandle value);\n    public static IntPtr ToIntPtr(GCHandle\
  \ value);\n\n    // 静态方法，用于将一个 IntPtr 转换为一个 GCHandle\n    public static explicit\
  \ operator GCHandle(IntPtr value);\n    public static GCHandle FromIntPtr(IntPtr\
  \ value);\n\n    // 静态方法，用于比较两个 GCHandle\n    public static Boolean operator ==(GCHandle\
  \ a, GCHandle b);\n    public static Boolean operator !=(GCHandle a, GCHandle b);\n\
  \n    // 实例方法，用于释放表中的记录项（索引设为 0）\n```\n\n\n\n垃圾回收器在内存中移动对象。String 对象被移走了，本机代码就会向已经不包含\
  \ String 对象的字符内容的内存进行读写——导致应用程序的行为无法预测。\n\n使用 CLR 的 P/Invoke 机制调用方法时，CLR 会自动帮你固定实参，并在本机方法返回时自动解除固定。所以，大多数时候都不必使用\
  \ GCHandle 类型来显式固定任何托管对象。只有在将托管对象的指针传给本机代码，然后本机函数返回，但本机代码将来仍需要使用该对象时，才需要显式使用 GCHandle\
  \ 类型。最常见的例子就是执行异步 I/O 操作。\n\n假定分配了一个字节数组，并准备在其中填充来自一个套接字的数据。这时应该调用 GCHandle 的 Alloc\
  \ 方法，传递对数组对象的引用以及 Pinned 标志。然后，在返回的 GCHandle 实例上调用 AddrOfPinnedObject 方法。这会返回一个\
  \ IntPtr，它是已固定对象在托管堆中的实际地址。然后，将该地址传给本机函数，该函数立即返回至托管代码。数据从套接字传来时，该字节数组缓冲区在内存中不会移动；阻止移动是\
  \ Pinned 标志的功劳。异步 I/O 操作完毕后调用 GCHandle 的 Free 方法，以后垃圾回收时就可以移动缓冲区了。托管代码应包含一个缓冲区引用，这使你能访问数据。正是由于这个引用的存在，所以才会阻止垃圾回收从内存中彻底释放该缓冲区。\n\
  \n值得注意的是，C#提供了一个 fixed 语句，它能在一个代码块中固定对象。以下代码演示了该语句是如何使用的：\n\n```csharp\nunsafe public\
  \ static void Go() {\n    // 分配一系列立即变成垃圾的对象\n    for (Int32 x = 0; x < 10000; x++)\
  \ new Object();\n\n    IntPtr originalMemoryAddress;\n    Byte[] bytes = new Byte[1000];\
  \ // 在垃圾对象后分配这个数组\n\n    // 获取 Byte[] 在内存中的地址\n    fixed (Byte* pbytes = bytes)\
  \ { originalMemoryAddress = (IntPtr) pbytes; }\n\n    // 强迫进行一次垃圾回收；垃圾对象会被回收，Byte[]\
  \ 可能被压缩\n    GC.Collect();\n\n    // 获取 Byte[] 当前在内存中的地址，把它同第一个地址比较\n    fixed (Byte*\
  \ pbytes = bytes) {\n        Console.WriteLine(\"The Byte[] did{0} move during the\
  \ GC\",\n            (originalMemoryAddress == (IntPtr) pbytes) ? \" not\" : null);\n\
  \    }\n}\n```\n\n使用 C#的 fixed 语句比分配一个固定 GC 句柄高效得多。这里发生的事情是，C#编译器在 pbytes 局部变量上生成一个特殊的“已固定”标志。垃圾回收期间，GC\
  \ 检查这个根的内容，如果根不为 null，就知道在压缩阶段不要移动变量引用的对象。C#编译器生成 IL 将 pbytes 局部变量初始化为 fixed 块起始处的对象的地址。在\
  \ fixed 块的尾部，编译器还会生成 IL 指令将 pbytes 局部变量设回 null，使变量不再引用任何对象。这样一来，下一次垃圾回收发生时，对象就可以移动了。\n\
  \n现在讨论一下另外两个标志，即 Weak 和 WeakTrackResurrection。它们既可用于和本机代码的互操作，也可在只有托管代码的时候使用。Weak\
  \ 标志使你知道在什么时候一个对象被判定为垃圾，但这时对象的内存不一定被回收。WeakTrackResurrection 标志使你知道在什么时候对象的内存已被回收。两个标志中\
  \ Weak 更常用。事实上，我还没有见过任何人在真正的应用程序中用过 WeakTrackResurrection 标志。\n\n假定 Object-A 定时在\
  \ Object-B 上调用一个方法。但由于 Object-A 有一个对 Object-B 的引用，所以阻止了 Object-B 被垃圾回收。在极少数情况下，这可能并不是你希望的；相反，你可能希望只要\
  \ Object-B 仍然存活于托管堆中，Object-A 就调用 Object-B 的方法。为此，Object-A 要调用 GCHandle 的 Alloc\
  \ 方法，向方法传递对 Object-B 的引用和 Weak 标志。Object-A 现在只需保存返回的 GCHandle 实例，而不是保存对 Object-B\
  \ 的引用。\n\n在这种情况下，如果没有其他根引用 Object-B(保持其存活状态)，Object-B 就可以被垃圾回收。Object-A 每次想调用 Object-B\
  \ 的方法时，都必须查询 GCHandle 的只读属性 Target。如果该属性返回非 null 的值，就表明 Object-B 依然存活。然后，Object-A\
  \ 的代码会将返回的引用转型为 Object-B 的类型，并调用方法。如果 Target 属性返回 null，表明 Object-B 已被回收，Object-A\
  \ 不再尝试调用方法。在这个时候，Object-A 的代码也许还要调用 GCHandle 的 Free 方法来释放 GCHandle 实例。\n\n由于使用 GCHandle\
  \ 类型有些繁琐，而且要求提升的安全性才能在内存中保持或固定对象，所以 System 命名空间提供了一个 WeakReference<T>类来帮助你。\n\n\
  ```csharp\npublic sealed class WeakReference<T> : ISerializable where T : class\
  \ {\n    public WeakReference(T target);\n    public WeakReference(T target, Boolean\
  \ trackResurrection);\n    public void SetTarget(T target);\n    public Boolean\
  \ TryGetTarget(out T target);\n}\n```\n\n这个类其实是包装了一个 GCHandle 实例的面向对象包装器(wrapper)：逻辑上说，它的构造器调用\
  \ GCHandle 的 Alloc 方法，TryGetTarget 方法查询 GCHandle 的 Target 属性，SetTarget 方法设置 GCHandle\
  \ 的 Target 属性，而 Finalize 方法(这里未显示，因为是受保护方法)则调用 GCHandle 的 Free 方法。此外，代码无需特殊权限即可使用\
  \ WeakReference<T>类，因为该类只支持弱引用；不支持 GCHandleType 设为 Normal 或 Pinned 的 GCHandle 实例的行为。WeakReference<T>类的缺点在于它的实例必须在堆上分配。所以，WeakReference\
  \ 类比 GCHandle 实例更“重”。\n\n开发人员经常需要将一些数据和另一个实体关联。例如，数据可以和一个线程或 AppDomain 关联。另外，可用\
  \ System.Runtime.CompilerServices.ConditionalWeakTable<TKey,TValue> 类将数据和单独的对象关联，如下所示：\n\
  \n```csharp\npublic sealed class ConditionalWeakTable<TKey, TValue>\n    where TKey\
  \ : class where TValue : class {\n    public ConditionalWeakTable();\n    public\
  \ void Add(TKey key, TValue value);\n    public TValue GetValue(TKey key, CreateValueCallback<TKey,\
  \ TValue>\n        createValueCallback);\n    public Boolean TryGetValue(TKey key,\
  \ out TValue value);\n    public TValue GetOrCreateValue(TKey key);\n    public\
  \ Boolean Remove(TKey key);\n\n    public delegate TValue CreateValueCallback(TKey\
  \ key); // 嵌套的委托定义\n}\n```\n\n> **重要提示**　开发人员刚开始学习弱引用时，会马上想到它们在缓存情形中的用处。例如，他们会想到构造包含大量数据的一组对象，并创建对这些对象的弱引用。程序需要数据时就检查这些弱引用，看看包含这些数据的对象是否依然“健在”。对象还在，程序就直接使用对象；这样程序就会有较好的性能。但如果发生垃圾回收，包含数据的对象就会被销毁。而一旦需要重新创建数据，程序的性能就会受到影响。\n\
  >\n> 这个技术的问题在于：垃圾回收不是在内存满或接近满时才发生的。相反，只要第 0 代满了，垃圾回收就会发生。所以，对象在内存中被回收的频率比预想的高得多，应用程序的性能将大打折扣。\n\
  >\n> 弱引用在缓存情形中确实能得到高效应用。但构建良好的缓存算法来找到内存消耗与速度之间的平衡点十分复杂。简单地说，你希望缓存保持对自己的所有对象的强引用，内存吃紧就开始将强引用转换为弱引用。目前，CLR\
  \ 没有提供一个能告诉应用程序内存吃紧的机制。但已经有人通过定时调用 Win32 `GlobalMemoryStatusEx` 函数并检查返回的 `MEMORYSTATUSEX`\
  \ 结构的 `dwMemoryLoad` 成员成功做到了这一点。如果该成员报告大于 80 的值，内存空间就处于吃紧状态。然后可以开始将强引用转换为弱引用——可依据的算法包括：最近最少使用算法（Least-Recently\
  \ Used algorithm，LRU）、最频繁使用算法（Most-Frequently Used algorithm，MFU）以及某个时基算法（time-base\
  \ algorithm）等。\n\n任意数据要和一个或多个对象关联，首先要创建该类的实例。然后调用 **Add** 方法。为 **key** 参数传递对象引用，为\
  \ **value** 参数传递想和对象关联的数据。试图多次添加对同一个对象的引用，**Add** 方法会抛出 **ArgumentException**；要更改和对象关联的值，必须先删除\
  \ **key**，再用新值把它添加回来。注意这个类是线程安全的，多个线程能同时使用它（虽然这也意味着类的性能并不出众）；应测试好这个类的性能，验证它是否适合你的实际环境。\n\
  \n当然，表对象在内部存储了对作为 **key** 传递的对象的弱引用（一个 **WeakReference** 对象）；这样可保证不会因为表的存在而造成对象“被迫”存活。但是，**ConditionalWeakTable**\
  \ 类最特别的地方在于，它保证了只要 **key** 所标识的对象在内存中，值就肯定在内存中。这使其超越了一个普通的 **WeakReference**，因为如果是普通的\
  \ **WeakReference**，那么即使 **key** 对象保持存活，值也可能被垃圾回收。**ConditionalWeakTable** 类可用于实现\
  \ XAML 的依赖属性（dependency property）机制。动态语言也可在内部利用它将数据和对象动态关联。\n\n以下代码演示了 **ConditionalWeakTable**\
  \ 类的使用。它允许在任何对象上调用 **GCWatch** 扩展方法并传递一些 **String** 标签（在程序中作为通知消息显示）。然后，在特定对象被垃圾回收时，它通过控制台窗口发出通知：\n\
  \n```csharp\ninternal static class ConditionalWeakTableDemo {\n    public static\
  \ void Main() {\n        Object o = new Object();\n        o.GCWatch(\"My Object\
  \ created at \" + DateTime.Now);\n        GC.Collect();       // 此时看不到 GC 通知\n \
  \       GC.KeepAlive(o);    // 确定 o 引用的对象现在还活着\n        o = null;           // o\
  \ 引用的对象现在可以死了\n\n        GC.Collect();       // 此时才会看到 GC 通知\n        Console.ReadLine();\n\
  \    }\n}\n\ninternal static class GCWatcher {\n    // 注意：由于字符串留用(interning) 和 MarshalByRefObject\
  \ 代理对象，所以\n    // 使用 String 要当心\n    private readonly static ConditionalWeakTable<Object,\
  \ NotifyWhenGCd<String>> s_cwt =\n        new ConditionalWeakTable<Object, NotifyWhenGCd<String>>();\n\
  \n    private sealed class NotifyWhenGCd<T> {\n        private readonly T m_value;\n\
  \n        internal NotifyWhenGCd(T value) { m_value = value; }\n        public override\
  \ string ToString() { return m_value.ToString(); }\n        ~NotifyWhenGCd() { Console.WriteLine(\"\
  GC'd: \" + m_value); }\n    }\n\n    public static T GCWatch<T>(this T @object,\
  \ String tag) where T : class {\n        s_cwt.Add(@object, new NotifyWhenGCd<String>(tag));\n\
  \        return @object;\n    }\n}\n```\n"
- "## 第 22 章 CLR 寄宿和 AppDomain\n\n**本章内容：**\n\n- CLR 寄宿\n- AppDomain\n- 卸载 AppDomain\n\
  - 监视 AppDomain\n- AppDomain FirstChance 异常通知\n- 宿主如何使用 AppDomain\n- 高级宿主控制\n\n本章主要讨论两个主题：寄宿和\
  \ AppDomain。这两个主题充分演示了 Microsoft .NET Framework 的巨大价值。寄宿(hosting)使任何应用程序都能利用 CLR\
  \ 的功能。特别要指出的是，它使现有的应用程序至少能部分使用托管代码编写。另外，寄宿还为应用程序提供了通过编程来进行自定义和扩展的能力。\n\n允许可扩展性意味着第三方代码可在你的进程中运行。在\
  \ Windows 中将第三方 DLL 加载到进程中意味着冒险。DLL 中的代码很容易破坏应用程序的数据结构和代码。DLL 还可能企图利用应用程序的安全上下文来访问它本来无权访问的资源。CLR\
  \ 的 AppDomain 功能解决了所有这些问题。AppDomain 允许第三方的、不受信任的代码在现有的进程中运行，而 CLR 保证数据结构、代码和安全上下文不被滥用或破坏。\n\
  \n程序员经常将寄宿和 AppDomain 与程序集的加载和反射一起使用。这 4 种技术一起使用，使 CLR 成为一个功能极其丰富和强大的平台。本章重点在于寄宿和\
  \ AppDomain。下一章则会将重点放在程序集加载和反射上。学习并理解了所有这些技术后，会发现今天在.NET Framework 上面的投资，将来必会获得丰厚回报。\n\
  \n### 22.1 CLR 寄宿\n\n.NET Framework 在 Windows 平台的顶部运行。这意味着.NET Framework 必须用 Windows\
  \ 能理解的技术来构建。首先，所有托管模块和程序集文件都必须使用 Windows PE 文件格式，而且要么是 Windows EXE 文件，要么是 DLL 文件。\n\
  \n开发 CLR 时，Microsoft 实际是把它实现成包含在一个 DLL 中的 COM 服务器。也就是说，利用 **GetInterface** 方法获得\
  \ **ICLRRuntimeHost** 接口。宿主应用程序可调用该接口定义的方法来做下面这些事情。\n\n- 设置宿主管理器。告诉 **CLR** 宿主想参与涉及以下操作的决策：内存分配、线程调度/同步以及程序集加载等。宿主还可声明它想获得有关垃圾回收启动和停止以及特定操作超时的通知。\n\
  - 获取 **CLR** 管理器。告诉 **CLR** 阻止使用某些类/成员。另外，宿主能分辨哪些代码可以调试，哪些不可以，以及当特定事件(例如 AppDomain\
  \ 卸载、CLR 停止或者堆栈溢出异常)发生时宿主应调用哪个方法。\n- 初始化并启动 **CLR**。\n- 加载程序集并执行其中的代码。\n- 停止 **CLR**，阻止任何更多的托管代码在\
  \ **Windows** 进程中运行。\n\n> **注意** Windows 进程完全可以不加载 CLR，只有在进程中执行托管代码时才进行加载。在 .NET\
  \ Framework 4 之前，CLR 只允许它的一个实例寄宿在 Windows 进程中。换言之，在一个进程中，要么不包含任何 CLR，要么只能包含 CLR\
  \ v1.0，CLR v1.1 或者 CLR 2.0 之一。每进程仅一个版本的 CLR 显然过于局限。例如，这样 Microsoft Office Outlook\
  \ 就不能加载为不同版本的 .NET Framework 生成和测试的两个加载项了。\n>\n> 但是，随着 .NET Framework 4 的发布，Microsoft\
  \ 支持在一个 Windows 进程中同时加载 CLR v2.0 和 v4.0，为 .NET Framework 2.0 和 4.0 写的不同组件能同时运行，不会出现任何兼容性问题。这是一个令人激动的功能，因为它极大扩展了\
  \ .NET Framework 组件的应用场合。可利用 ClrVer.exe 工具检查给定的进程加载的是哪个(哪些)版本的 CLR。\n>\n> 一个 CLR\
  \ 加载到 Windows 进程之后，便永远不能卸载；在 **ICLRRuntimeHost** 接口上调用 **AddRef** 和 **Release**\
  \ 方法是没有作用的。CLR 从进程中卸载的唯一途径就是终止进程，这会造成 Windows 清理进程使用的所有资源。\n\n### 22.2 AppDomain\n\
  \nCLR COM 服务器初始化时会创建一个 AppDomain。AppDomain 是一组程序集的逻辑容器。CLR 初始化时创建的第一个 AppDomain\
  \ 称为“默认 AppDomain”，这个默认的 AppDomain 只有在 Windows 进程终止时才会被销毁。\n\n除了默认 AppDomain，正在使用非托管\
  \ COM 接口方法或托管类型方法的宿主还可要求 CLR 创建额外的 AppDomain。AppDomain 是为了提供隔离而设计的。下面总结了\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_509_0.png)\n\
  \n除此之外，每个 AppDomain 都加载了一些程序集。AppDomain #1（默认 AppDomain）有三个程序集：MyApp.exe，TypeLib.dll\
  \ 和 System.dll。AppDomain #2 有两个程序集：Wintellect.dll 和 System.dll。\n\n如图 22-1 所示，两个\
  \ AppDomain 都加载了 System.dll 程序集。如果这两个 AppDomain 都使用了来自 System.dll 的一个类型，那么两个 AppDomain\
  \ 的 Loader 堆会为相同的类型分别分配一个类型对象；类型对象的内存不会由两个 AppDomain 共享。另外，一个 AppDomain 中的代码调用一个类型定义的方法时，方法的\
  \ IL 代码会进行 JIT 编译，生成的本机代码单独与每个 AppDomain 关联，而不是由调用它的所有 AppDomain 共享。\n\n不共享类型对象的内存或本机代码显得有些浪费。但\
  \ AppDomain 的设计宗旨就是提供隔离；CLR 要求在卸载某个 AppDomain 并释放其所有资源时不会影响到其他任何 AppDomain。复制 CLR\
  \ 的数据结构才能保证这一点。另外，还保证多个 AppDomain 使用的类型在每个 AppDomain 中都有一组静态字段。\n\n有的程序集本来就要由多个\
  \ AppDomain 使用。最典型的例子就是 MSCorLib.dll。该程序集包含了 System.Object，System.Int32 以及其他所有与\
  \ .NET Framework 密不可分的类型。CLR 初始化时，该程序集会自动加载，而且所有 AppDomain 都共享该程序集中的类型。为了减少资源消耗，MSCorLib.dll\
  \ 程序集以一种“AppDomain 中立”的方式加载。也就是说，针对以“AppDomain 中立”的方式加载的程序集，CLR 会为它们维护一个特殊的 Loader\
  \ 堆。该 Loader 堆中的所有类型对象，以及为这些类型定义的方法 JIT 编译生成的所有本机代码，都会由进程中的所有 AppDomain 共享。遗憾的是，共享这些资源所获得的收益并不是没有代价的。这个代价就是，以“AppDomain\
  \ 中立”的方式加载的所有程序集永远不能\n\n```csharp\n// mbrt 引用一个有效的代理对象；代理对象引用一个无效的 AppDomain\n\n\
  try {\n    // 在代理类型上调用一个方法。AppDomain 无效，造成抛出异常\n    mbrt.SomeMethod();\n    Console.WriteLine(\"\
  Successful call.\");\n}\ncatch (AppDomainUnloadedException) {\n    Console.WriteLine(\"\
  Failed call.\");\n}\n\n// *** DEMO 2: 使用 Marshal-by-Value 进行跨 AppDomain 通信 ***\n\
  Console.WriteLine(\"{0}Demo #2\", Environment.NewLine);\n\n// 新建一个 AppDomain（从当前\
  \ AppDomain 继承安全性和配置）\nad2 = AppDomain.CreateDomain(\"AD #2\", null, null);\n\n\
  // 将我们的程序集加载到新 AppDomain 中，构造一个对象，把它\n// 封送回我们的 AppDomain（实际得到对一个代理的引用）\nmbrt =\
  \ (MarshalByRefType)\n    ad2.CreateInstanceAndUnwrap(exeAssembly, \"MarshalByRefType\"\
  );\n\n// 对象的方法返回所返回对象的副本；\n// 对象按值（而非按引用）封送\nMarshalByValType mbvt = mbrt.MethodWithReturn();\n\
  \n// 证明得到的不是对一个代理对象的引用\nConsole.WriteLine(\"Is proxy={0}\", RemotingServices.IsTransparentProxy(mbvt));\n\
  \n// 看起来是在 MarshalByValType 上调用一个方法，实际上也是如此\nConsole.WriteLine(\"Returned object\
  \ created \" + mbvt.ToString());\n\n// 卸载新的 AppDomain\nAppDomain.Unload(ad2);\n\
  // mbvt 引用有效的对象；卸载 AppDomain 没有影响\n\ntry {\n    // 我们是在对象上调用一个方法；不会抛出异常\n    Console.WriteLine(\"\
  Returned object created \" + mbvt.ToString());\n    Console.WriteLine(\"Successful\
  \ call.\");\n}\ncatch (AppDomainUnloadedException) {\n    Console.WriteLine(\"Failed\
  \ call.\");\n}\n\n// *** DEMO 3: 使用不可封送的类型进行跨 AppDomain 通信 ***\nConsole.WriteLine(\"\
