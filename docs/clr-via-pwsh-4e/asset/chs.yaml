  \ | |\n| | 第3-4节<br>10:10-11:50 | | 定积分应用<br>教305 | | | 定积分应用<br>教305 |\n| 下午 |\
  \ 第5-6节<br>14:00-15:40 | 大学物理<br>教205 | | 大学物理<br>教205 | | |\n| | 第7-8节<br>16:00-17:40\
  \ | | 工程制图<br>教112 | | | 工程制图<br>教112 |\n\n2024-2025学年 第2学期 班级: 机械2401\n\n```csharp\n\
  t.ContinueWith(task => Console.WriteLine(\"Sum threw: \" + task.Exception.InnerException),\n\
  \    TaskContinuationOptions.OnlyOnFaulted);\n\nt.ContinueWith(task => Console.WriteLine(\"\
  Sum was canceled\"),\n    TaskContinuationOptions.OnlyOnCanceled);\n```\n\n####\
  \ 27.5.4 任务可以启动子任务\n\n最后，任务支持父/子关系，如以下代码所示：\n\n```csharp\nTask<int[]> parent = new\
  \ Task<int[]>(() => {\n    var results = new int[32]; // 创建一个数组来储存结果\n\n    // 这个任务创建并启动\
  \ 3 个子任务\n    new Task(() => results[0] = Sum(10000), TaskCreationOptions.AttachedToParent).Start();\n\
  \    new Task(() => results[1] = Sum(20000), TaskCreationOptions.AttachedToParent).Start();\n\
  \    new Task(() => results[2] = Sum(30000), TaskCreationOptions.AttachedToParent).Start();\n\
  \n    // 返回对数组的引用（即使数组元素可能还没有初始化）\n    return results;\n});\n\n// 父任务及其子任务运行完成后，用一个延续任务显示结果\n\
  var cwt = parent.ContinueWith(\n    parentTask => Array.ForEach(parentTask.Result,\
  \ Console.WriteLine));\n\n// 启动父任务，便于它启动它的子任务\nparent.Start();\n```\n\n在本例中，父任务创建并启动三个\
  \ **Task** 对象。一个任务创建的一个或多个 **Task** 对象默认是顶级任务，它们与创建它们的任务无关。但 **TaskCreationOptions.AttachedToParent**\
  \ 标志将一个 **Task** 和创建它的 **Task** 关联，结果是除非所有子任务（以及子任务的子任务）结束运行，否则创建任务（父任务）不认为已经结束。调用\
  \ **ContinueWith** 方法创建 **Task** 时，可指定 **TaskContinuationOptions.AttachedToParent**\
  \ 标志将延续任务指定成子任务。\n\n#### 27.5.5 任务内部揭秘\n\n每个 **Task** 对象都有一组字段，这些字段构成了任务的状态。其中包括一个\
  \ **Int32** ID（参见 **Task** 的只读 Id 属性）、代表 **Task** 执行状态的一个 **Int32**、对父任务的引用、对 **Task**\
  \ 创建时指定的 **TaskScheduler** 的引用、对回调方法的引用、对要传给回调方法的对象的引用（可通过 **Task** 的只读 **AsyncState**\
  \ 属性查询）、对 **ExecutionContext** 的引用以及对 **ManualResetEventSlim** 对象的引用。另外，每个 **Task**\
  \ 对象都有对根据需要创建的补充状态的引用。补充状态包含一个 **CancellationToken**、一个 **ContinueWithTask** 对象集合、为抛出来处理异常的子任务而准备的一个\
  \ **Task** 对象集合等。说了这么多，重点在于虽然任务很有用，但它并不是没有代价的。必须为所有这些状态分配内存。如果不需要任务的附加功能，那么使用 **ThreadPool.QueueUserWorkItem**\
  \ 能获得更好的资源利用率。\n\n**Task** 和 **Task<TResult>** 类实现了 **IDisposable** 接口，允许在用完 **Task**\
  \ 对象后调用 Dispose。如今，所有 Dispose 方法做的都是关闭 **ManualResetEventSlim** 对象。但可定义从 **Task**\
  \ 和 **Task<TResult>** 派生的类，在这些类中分配它们自己的资源，并在它们重写的 **Dispose**\n\n方法中释放这些资源。我建议不要在代码中为\
  \ Task 对象显式调用 Dispose；相反，应该让垃圾回收器自己清理任何不再需要的资源。\n\n每个 Task 对象都包含代表 Task 唯一 ID 的\
  \ Int32 字段。创建 Task 对象时该字段初始化为零。首次查询 Task 的只读 Id 属性时，属性将一个唯一的 Int32 值分配给该字段，并返回该值。任务\
  \ ID 从 1 开始，每分配一个 ID 都递增 1。在 Microsoft Visual Studio 调试器中查看 Task 对象，会造成调试器显示 Task\
  \ 的 ID，从而造成 Task 分配 ID。\n\n该 ID 的意义在于每个 Task 都可用唯一值进行标识。事实上，Visual Studio 会在“并行任务”和“并行堆栈”窗口中显示这些任务\
  \ ID。但由于不能在自己的代码中分配 ID，所以几乎不可能将 ID 和代码正在做的事情联系起来。运行任务的代码时，可查询 Task 的静态 CurrentId\
  \ 属性来返回一个可空 Int32(Int32?)。调试期间，可在 Visual Studio 的“监视”或“即时”窗口中调用它，获得当前正在调试的代码的 ID。然后，可在“并行任务”或“并行堆栈”窗口中找到自己的任务。如果当前没有任务正在执行，查询\
  \ CurrentId 属性会返回 null。\n\n在一个 Task 对象的存在期间，可查询 Task 的只读 Status 属性了解它在其生存期的什么位置。该属性返回一个\
  \ TaskStatus 值，定义如下：\n\n```csharp\npublic enum TaskStatus {\n    // 这些标志指出一个 Task\
  \ 在其生命周期内的状态\n    Created,              // 任务已显式创建；可以手动 Start() 这个任务\n    WaitingForActivation,\
  \ // 任务已隐式创建；会自动开始\n\n    WaitingToRun,         // 任务已调度，但尚未运行\n    Running,   \
  \           // 任务正在运行\n\n    // 任务正在等待它的子任务完成，子任务完成后它才完成\n    WaitingForChildrenToComplete,\n\
  \n    // 任务的最终状态是以下三个之一：\n    RanToCompletion,\n    Canceled,\n    Faulted\n}\n\
  ```\n\n首次构造 Task 对象时，它的状态是 Created。以后，当任务启动时，它的状态变成 WaitingToRun。Task 实际在一个线程上运行时，它的状态变成\
  \ Running。任务停止运行，并等待它的任何子任务时，状态变成 WaitingForChildrenToComplete。任务完成时进入以下状态之一：RanToCompletion(运行完成)、Canceled(取消)或\
  \ Faulted(出错)。如果运行完成，可通过 `Task<TResult>` 的 `Result` 属性来查询任务结果。`Task` 或 `Task<TResult>`\
  \ 出错时，可查询 `Task` 的 `Exception` 属性来获得任务抛出的未处理异常；该属性总是返回一个 `AggregateException` 对象，对象的\
  \ `InnerExceptions` 集合包含了所有未处理的异常。\n\n为简化编码，`Task` 提供了几个只读 `Boolean` 属性，包括 `IsCanceled`,\
  \ `IsFaulted` 和 `IsCompleted`。注意当 `Task` 处于 `RanToCompletion`, `Canceled` 或 `Faulted`\
  \ 状态时，`IsCompleted` 返回 `true`。判断一个 `Task` 是否成功完成最简单的办法是使用如下所示的代码：\n\n```csharp\n\
  if (task.Status == TaskStatus.RanToCompletion) ...\n```\n\n调用 **ContinueWith**，**ContinueWhenAll**，**ContinueWhenAny**\
  \ 或 **FromAsync** 等方法来创建的 **Task** 对象处于 **WaitingForActivation** 状态。通过构造 **TaskCompletionSource<TResult>**\
  \ 对象来创建的 **Task** 也处于 **WaitingForActivation** 状态。该状态意味着 **Task** 的调度由任务基础结构控制。例如，不可显式启动通过调用\
  \ **ContinueWith** 来创建的对象。该 **Task** 在它的前置任务(antecedent task)执行完毕后自动启动。\n\n####\
  \ 27.5.6 任务工厂\n\n有时需要创建一组共享相同配置的 **Task** 对象。为避免机械地将相同的参数传给每个 **Task** 的构造器，可创建一个任务工厂来封装通用的配置。**System.Threading.Tasks**\
  \ 命名空间定义了一个 **TaskFactory** 类型和一个 **TaskFactory<TResult>** 类型。两个类型都派生自 **System.Object**；也就是说，它们是平级的。\n\
  \n要创建一组返回 **void** 的任务，就构造一个 **TaskFactory**；要创建一组具有特定返回类型的任务，就构造一个 **TaskFactory<TResult>**，并通过泛型\
  \ **TResult** 实参传递任务的返回类型。创建上述任何工厂类时，要向构造器传递工厂创建的所有任务都具有的默认值。具体地说，要向任务工厂传递希望任务具有的\
  \ **CancellationToken**，**TaskScheduler**，**TaskCreationOptions** 和 **TaskContinuationOptions**\
  \ 设置。\n\n以下代码演示了如何使用一个 TaskFactory：\n\n```csharp\nTask parent = new Task(() => {\n\
  \    var cts = new CancellationTokenSource();\n    var tf = new TaskFactory<Int32>(\n\
  \        cts.Token,\n        TaskCreationOptions.AttachedToParent,\n        TaskContinuationOptions.ExecuteSynchronously,\n\
  \        TaskScheduler.Default);\n\n    // 这个任务创建并启动 3 个子任务\n    var childTasks\
  \ = new[] {\n        tf.StartNew(() => Sum(cts.Token, 10000)),\n        tf.StartNew(()\
  \ => Sum(cts.Token, 20000)),\n        tf.StartNew(() => Sum(cts.Token, Int32.MaxValue))\
  \ // 太大，抛出 OverflowException\n    };\n\n    // 任何子任务抛出异常，就取消其余子任务\n    for (Int32\
  \ task = 0; task < childTasks.Length; task++)\n        childTasks[task].ContinueWith(\n\
  \            t => cts.Cancel(), TaskContinuationOptions.OnlyOnFaulted);\n\n    //\
  \ 所有子任务完成后，从未出错/未取消的任务获取返回的最大值。\n    // 然后将最大值传给另一个任务来显示最大结果\n    tf.ContinueWhenAll(\n\
  \        childTasks,\n        completedTasks => completedTasks.Where(\n        \
  \    t => !t.IsFaulted && !t.IsCanceled).Max(t => t.Result),\n        CancellationToken.None)\n\
  \            .ContinueWith(t => Console.WriteLine(\"The maximum is: \" + t.Result),\n\
  \                TaskContinuationOptions.ExecuteSynchronously);\n});\n\n// 子任务完成后，也显示任何未处理的异常\n\
  ```\n\n而要像这样写：\n\n```csharp\n// 线程池的线程并行处理工作\nParallel.ForEach(collection, item\
  \ => DoWork(item));\n```\n\n如果既可以使用 **For**，也可以使用 **ForEach**，那么建议使用 **For**，因为它执行得更快。\n\
  \n最后，如果要执行多个方法，那么既可能像下面这样顺序执行：\n\n```csharp\n// 一个线程顺序执行所有方法\nMethod1();\nMethod2();\n\
  Method3();\n```\n\n也可并行执行，如下所示：\n\n```csharp\n// 线程池的线程并行执行方法\nParallel.Invoke(\n\
  \    () => Method1(),\n    () => Method2(),\n    () => Method3());\n```\n\n**Parallel**\
  \ 的所有方法都让调用线程参与处理。从资源利用的角度说，这是一件好事，因为我们不希望调用线程停下来(阻塞)，等线程池线程做完所有工作才能继续。然而，如果调用线程在线程池线程完成自己的那一部分工作之前完成工作，调用线程会将自己挂起，直到所有工作完成。这也是一件好事，因为这提供了和使用普通\
  \ **for** 或 **foreach** 循环时相同的语义：线程要在所有工作完成后才继续运行。还要注意，如果任何操作抛出未处理的异常，你调用的 **Parallel**\
  \ 方法最后会抛出一个 **AggregateException**。\n\n但这并不是说需要对自己的源代码进行全文替换，将 **for** 循环替换成对 **Parallel.For**\
  \ 的调用，将 **foreach** 循环替换成对 **Parallel.ForEach** 的调用。调用 **Parallel** 的方法时有一个很重要的前提条件：工作项必须能并行执行！所以，如果工作必须顺序执行，就不要使用\
  \ **Parallel** 的方法。另外，要避免会修改任何共享数据的工作项，否则多个线程同时处理可能会损坏数据。解决这个问题一般的办法是围绕数据访问添加线程同步锁。但这样一次就只能有一个线程访问数据，无法享受并行处理多个项所带来的好处。\n\
  \n另外，**Parallel** 的方法本身也有开销；委托对象必须分配，而针对每个工作项都要调用一次这些委托。如果有大量可由多个线程处理的工作项，那么也许能获得性能的提升。另外，如果每一项都涉及大量工作，那么通过委托来调用所产生的性能损失是可以忽略不计的。但如果只为区区几个工作项使用\
  \ **Parallel** 的方法，或者为处理得非常快的工作项使用 **Parallel** 的方法，就会得不偿失，反而降低性能。\n\n注意 **Parallel**\
  \ 的 **For**、**ForEach** 和 **Invoke** 方法都提供了接受一个 **ParallelOptions** 对象的重载版本。这个对象的定义如下：\n\
  \n```csharp\npublic class ParallelOptions {\n    public ParallelOptions();\n\n \
  \   // 允许取消操作\n    public CancellationToken CancellationToken { get; set; } // 默认为CancellationToken.None\n\
  \n    // 允许指定可以并发操作的最大工作项目数目\n    public Int32 MaxDegreeOfParallelism { get; set;\
  \ } // 默认为-1 (可用CPU数)\n    // 允许指定要使用哪个TaskScheduler\n    public TaskScheduler TaskScheduler\
  \ { get; set; } // 默认为TaskScheduler.Default\n}\n```\n\n除此之外，**For** 和 **ForEach**\
  \ 方法有一些重载版本允许传递 3 个委托。\n\n- 任务局部初始化委托(localInit)，为参与工作的每个任务都调用一次该委托。这个委托是在任务被要求处理一个工作项之前调用的。\n\
  - 主体委托(body)，为参与工作的各个线程所处理的每一项都调用一次该委托。\n- 任务局部终结委托(localFinally)，为参与工作的每一个任务都调用一次该委托。这个委托是在任务处理好派发给它的所有工作项之后调用的。即使主体委托代码引发一个未处理的异常，也会调用它。\n\
  \n以下代码演示如何利用这三个委托计算一个目录中的所有文件的字节长度。\n\n```csharp\nprivate static Int64 DirectoryBytes(String\
  \ path, String searchPattern,\n    SearchOption searchOption) {\n    var files =\
  \ Directory.EnumerateFiles(path, searchPattern, searchOption);\n    Int64 masterTotal\
  \ = 0;\n\n    ParallelLoopResult result = Parallel.ForEach<String, Int64>(\n   \
  \     files,\n\n        () => { // localInit: 每个任务开始之前调用一次\n            // 每个任务开始之前，总计值都初始化为0\n\
  \            return 0; // 将 taskLocalTotal 初始值设为0\n        },\n\n        (file,\
  \ loopState, index, taskLocalTotal) => { // body: 每个工作项调用一次\n            // 获得这个文件的大小，把它添加到这个任务的累加值上\n\
  \            Int64 fileLength = 0;\n            FileStream fs = null;\n        \
  \    try {\n                fs = File.OpenRead(file);\n                fileLength\
  \ = fs.Length;\n            }\n            catch (IOException) { /* 忽略拒绝访问的任何文件\
  \ */ }\n            finally { if (fs != null) fs.Dispose(); }\n            return\
  \ taskLocalTotal + fileLength;\n        },\n\n        taskLocalTotal => { // localFinally:\
  \ 每个任务完成时调用一次\n            // 将这个任务的总计值(taskLocalTotal)加到总的总结值(masterTotal)上\n \
  \           Interlocked.Add(ref masterTotal, taskLocalTotal);\n        });\n\n \
  \   return masterTotal;\n}\n```\n\n每个任务都通过 `taskLocalTotal` 变量为分配给它的文件维护它自己的总计值。每个任务在完成工作之后，都通过调用\
  \ `Interlocked.Add` 方法(参见第 29 章“基元线程同步构造”)，以一种线程安全的方式更新总的总结值(master total)。由于每个任务都有自己的总计值，所以在一个工作项处理期间，无需进行线程同步。由于线程同步会造成性能的损失，所以不\n\
  \n### 27.7 并行语言集成查询(PLINQ)\n\nMicrosoft 的语言集成查询(Language Integrated Query, LINQ)功能提供了一个简捷的语法来查询数据集合。可用\
  \ LINQ 轻松对数据项进行筛选、排序、投影等操作。使用 LINQ to Objects 时，只有一个线程顺序处理数据集合中的所有项；我们称之为顺序查询(sequential\
  \ query)。要提高处理性能，可以使用并行 LINQ(Parallel LINQ)，它将顺序查询转换成并行查询，在内部使用任务(排队给默认 TaskScheduler)，将集合中的数据项的处理工作分散到多个\
  \ CPU 上，以便并发处理多个数据项。和 Parallel 的方法相似，要同时处理大量项，或者每一项的处理过程都是一个耗时的计算限制的操作，那么能从并行 LINQ\
  \ 获得最大的收益。\n\n静态 System.Linq.ParallelEnumerable 类(在 System.Core.dll 中定义)实现了 PLINQ\
  \ 的所有功能，所以必须通过 C# 的 using 指令将 System.Linq 命名空间导入你的源代码。尤其是这个类公开了所有标准 LINQ 操作符(Where,\
  \ Select, SelectMany, GroupBy, Join, OrderBy, Skip, Take 等)的并行版本。所有这些方法都是扩展了 System.Linq.ParallelQuery<T>类型的扩展方法。要让自己的\
  \ LINQ to Objects 查询调用这些方法的并行版本，必须将自己的顺序查询(基于 IEnumerable 或者 IEnumerable<T>)转换成并行查询(基于\
  \ ParallelQuery 或者 ParallelQuery<T>)，这是用 ParallelEnumerable 的 AsParallel 扩展方法来实现的①，如下所示：\n\
  \n```csharp\npublic static ParallelQuery<TSource> AsParallel<TSource>(this IEnumerable<TSource>\
  \ source)\npublic static ParallelQuery AsParallel(this IEnumerable source)\n```\n\
  \n下面是将顺序查询转换成并行查询的例子。查询返回的是一个程序集中定义的所有过时 (obsolete)方法：\n\n```csharp\nprivate static\
  \ void ObsoleteMethods(Assembly assembly) {\n    var query =\n        from type\
  \ in assembly.GetExportedTypes().AsParallel()\n\n        from method in type.GetMethods(BindingFlags.Public\
  \ |\n            BindingFlags.Instance | BindingFlags.Static)\n\n        let obsoleteAttrType\
  \ = typeof(ObsoleteAttribute)\n\n        where Attribute.IsDefined(method, obsoleteAttrType)\n\
  \n        orderby type.FullName\n\n        let obsoleteAttrObj = (ObsoleteAttribute)\n\
  \            Attribute.GetCustomAttribute(method, obsoleteAttrType)\n\n        select\
  \ String.Format(\"Type={0}\\nMethod={1}\\nMessage={2}\\n\",\n            type.FullName,\
  \ method.ToString(), obsoleteAttrObj.Message);\n\n    // 显示结果\n    foreach (var\
  \ result in query) Console.WriteLine(result);\n}\n```\n\n① ParallelQuery<T>类派生自\
  \ ParallelQuery 类。\n\n\n\n费更多线程，但可以用更少的时间生成最终结果。同步 I/O 操作在客户端应用程序中没什么问题，但我强烈建议不要在服务器应用程序中执行同步\
  \ I/O 操作。\n\nPLINQ 分析一个查询，然后决定如何最好地处理它。有的时候，顺序处理一个查询可以获得更好的性能，尤其是在使用以下任何操作时：Concat，ElementAt(OrDefault)，First(OrDefault)，Last(OrDefault)，Skip(While)，Take(While)或\
  \ Zip。使用 Select(Many)或 Where 的重载版本，并向你的 selector 或 predicate 委托传递一个位置索引时也是如此。然而，可以调用\
  \ WithExecutionMode，向它传递某个 ParallelExecutionMode 标志，从而强迫查询以并行方式处理：\n\n```csharp\n\
  public enum ParallelExecutionMode {\n    Default = 0,          // 让并行 LINQ 决定处理查询的最佳方式\n\
  \    ForceParallelism = 1  // 强迫查询以并行方式处理\n}\n```\n\n如前所述，并行 LINQ 让多个线程处理数据项，结果必须再合并回去。可调用\
  \ WithMergeOptions，向它传递以下某个 ParallelMergeOptions 标志，从而控制这些结果的缓冲与合并方式：\n\n```csharp\n\
  public enum ParallelMergeOptions {\n    Default       = 0,  // 目前和 AutoBuffered\
  \ 一样(将来可能改变)\n    NotBuffered   = 1,  // 结果一旦就绪就开始处理\n    AutoBuffered  = 2,  //\
  \ 每个线程在处理前缓冲一些结果\n    FullyBuffered = 3   // 每个线程在处理前缓冲所有结果\n}\n```\n\n这些选项使你能在某种程度上平衡执行速度和内存消耗。NotBuffered\
  \ 最省内存，但处理速度慢一些。FullyBuffered 消费较多的内存，但运行得最快。AutoBuffered 介于 NotBuffered 和 FullyBuffered\
  \ 之间。说真的，要想知道应该为一个给定的查询选择哪个并行合并选项，最好的办法就是亲自试验所有选项，并对比其性能。也可以“无脑”地接受默认值，它对于许多查询来说都工作得非常好。请参见以下博客文章，进一步了解\
  \ PLINQ 如何在 CPU 内核之间分配工作：\n\n- http://blogs.msdn.com/pfxteam/archive/2009/05/28/9648672.aspx\n\
  - http://blogs.msdn.com/pfxteam/archive/2009/06/13/9741072.aspx\n\n### 27.8 执行定时计算限制操作\n\
  \nSystem.Threading 命名空间定义了一个 Timer 类，可用它让一个线程池线程定时调用一个方法。构造 Timer 类的实例相当于告诉线程池：在将来某个时间(具体由你指定)回调你的一个方法。Timer\
  \ 类提供了几个相似的构造器：\n\n```csharp\npublic sealed class Timer : MarshalByRefObject, IDisposable\
  \ {\n    public Timer(TimerCallback callback, Object state, Int32 dueTime, Int32\
  \ period);\n    public Timer(TimerCallback callback, Object state, UInt32 dueTime,\
  \ UInt32 period);\n    public Timer(TimerCallback callback, Object state, Int64\
  \ dueTime, Int64 period);\n    public Timer(TimerCallback callback, Object state,\
  \ TimeSpan dueTime, TimeSpan period);\n}\n```\n\n```csharp\npublic static void Main()\
  \ {\n    Console.WriteLine(\"Checking status every 2 seconds\");\n\n    // 创建但不启动计时器。确保\
  \ s_timer 在线程池线程调用 Status 之前引用该计时器\n    s_timer = new Timer(Status, null, Timeout.Infinite,\
  \ Timeout.Infinite);\n\n    // 现在 s_timer 已被赋值，可以启动计时器了，\n    // 现在在 Status 中调用\
  \ Change，保证不会抛出 NullReferenceException\n    s_timer.Change(0, Timeout.Infinite);\n\
  \n    Console.ReadLine(); // 防止进程终止\n}\n\n// 这个方法的签名必须和 TimerCallback 委托匹配\nprivate\
  \ static void Status(object state) {\n    // 这个方法由一个线程池线程执行\n    Console.WriteLine(\"\
  In Status at {0}\", DateTime.Now);\n    Thread.Sleep(1000); // 模拟其他工作(1秒)\n\n  \
  \  // 返回前让 Timer 在 2 秒后再次触发\n    s_timer.Change(2000, Timeout.Infinite);\n\n   \
  \ // 这个方法返回后，线程回到池中，等待下一个工作项\n}\n```\n\n如果有需要定时执行的操作，可利用 **Task** 的静态 **Delay**\
  \ 方法和 C# 的 **async** 和 **await** 关键字（第 28 章讨论）来编码。下面重写了前面的代码。\n\n```csharp\ninternal\
  \ static class DelayDemo {\n    public static void Main() {\n        Console.WriteLine(\"\
  Checking status every 2 seconds\");\n        Status();\n        Console.ReadLine();\
  \ // 防止进程终止\n    }\n\n    // 该方法可获取你想要的任何参数\n    private static async void Status()\
  \ {\n        while (true) {\n            Console.WriteLine(\"Checking status at\
  \ {0}\", DateTime.Now);\n            // 要检查的代码放到这里...\n\n            // 在循环末尾，在不阻塞线程的前提下延迟\
  \ 2 秒\n            await Task.Delay(2000); // await 允许线程返回\n            // 2 秒之后，某个线程会在\
  \ await 之后介入并继续循环\n        }\n    }\n}\n```\n\n### 计时器太多，时间太少\n\n遗憾的是，FCL 事实上提供了几个计时器，大多数程序员都不清楚它们有什么独特之处。让我试着解释一下。\n\
  \n- **System.Threading 的 Timer 类**  \n  这是上一节讨论的计时器。要在一个线程池线程上执行定时的（周期性发生的）后台任务，它是最好的计时器。\n\
  - **System.Windows.Forms 的 Timer 类**  \n  构造这个类的实例，相当于告诉 Windows 将一个计时器和调用线程关联(参见\
  \ Win32 SetTimer 函数)。当这个计时器触发时，Windows 将一条计时器消息(WM_TIMER)注入线程的消息队列。线程必须执行一个消息泵来提取这些消息，并把它们派发给需要的回调方法。注意，所有这些工作都只由一个线程完成——设置计时器的线程保证就是执行回调方法的线程。还意味着计时器方法不会由多个线程并发执行。\n\
  - **System.Windows.Threading 的 DispatcherTimer 类**  \n  这个类是 **System.Windows.Forms\
  \ 的 Timer 类**在 Silverlight 和 WPF 应用程序中的等价物。\n- **Windows.UI.Xaml 的 DispatcherTimer\
  \ 类**  \n  这个类是 **System.Windows.Forms 的 Timer 类**在 Windows Store 应用中的等价物。\n- **System.Timers\
  \ 的 Timer 类**  \n  这个计时器本质上是 **System.Threading 的 Timer 类**的包装类。计时器到期(触发)会导致CLR将事件放到线程池队列中。**System.Timers.Timer\
  \ 类**派生自 **System.ComponentModel 的 Component 类**，允许在 Visual Studio 中将这些计时器对象放到设计平面(design\
  \ surface)上。另外，它还公开了属性和事件，使它在 Visual Studio 的设计器中更容易使用。这个类是在好几年前，Microsoft 还没有理清线程处理和计时器的时候添加到\
  \ FCL 中的。这个类完全应该删除，强迫每个人都改为使用 **System.Threading.Timer 类**。事实上，我个人从来不用 **System.Timers.Timer\
  \ 类**，建议你也不要用它，除非真的想在设计平面上添加一个计时器。\n\n### 27.9 线程池如何管理线程\n\n现在讨论一下线程池代码如何管理工作者线程和\
  \ I/O 线程。但我不打算讲太多细节，因为在这么多年的时间里，随着 CLR 的每个版本的发布，其内部的实现已发生了显著变化。未来的版本还会继续变化。最好是将线程池看成一个黑盒。不要拿单个应用程序去衡量它的性能，因为它不是针对某个单独的应用程序而设计的。相反，作为一个常规用途的线程调度技术，它面向的是大量应用程序；它对某些应用程序的效果要好于对其他应用程序。目前，它的工作情况非常理想，我强烈建议你信任它，因为你很难搞出一个比\
  \ CLR 自带的更好的线程池。另外，随着时间的推移，线程池代码内部会更改它管理线程的方式，所以大多数应用程序的性能会变得越来越好。\n\n### 27.9.1\
  \ 设置线程池限制\n\nCLR 允许开发人员设置线程池要创建的最大线程数。但实践证明，线程池永远都不应该设置线程数上限，因为可能发生饥饿或死锁。假定队列中有\
  \ 1000 个工作项，但这些工作项全都因为一个事件而阻塞，等第 1001 个工作项发出信号才能解除阻塞。如果设置最大 1000 个线程，第 1001 个工作项就不会执行，全部\
  \ 1000 个线程会一直阻塞，用户将被迫终止应\n\n的线程，所以无需同步锁，而且在队列中添加和删除 **Task** 的速度非常快。这个行为的副作用是 **Task**\
  \ 按照和进入队列时相反的顺序执行。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_657_0.png)\n\n图 27-1\
  \ CLR 的线程池\n\n> **重要提示** 线程池从来不保证排队中的工作项的处理顺序。这是合理的，尤其是考虑到多个线程可能同时处理工作项。但上述副作用使这个问题变得恶化了。你必须保证自己的应用程序对于工作项或\
  \ **Task** 的执行顺序不作任何预设。\n\n如果工作者线程发现它的本地队列变空了，会尝试从另一个工作者线程的本地队列“偷”一个 **Task**。这个\
  \ **Task** 是从本地队列的尾部“偷”走的，并要求获取一个线程同步锁，这对性能有少许影响。当然，希望这种“偷盗”行为很少发生，从而很少需要获取锁。如果所有本地队列都变空，那么工作者线程会使用\
  \ **FIFO** 算法，从全局队列提取一个工作项(取得它的锁)。如果全局队列也为空，工作者线程会进入睡眠状态，等待事情的发生。如果睡眠了太长时间，它会自己醒来，并销毁自身，允许系统回收线程使用的资源(内核对象、栈、TEB\
  \ 等)。\n\n线程池会快速创建工作线程，使工作者线程的数量等于传给 **ThreadPool** 的 **SetMinThreads** 方法的值。如果从不调用这个方法(也建议你永远不调用这个方法)，那么默认值等于你的进程允许使用的\
  \ CPU 数量，这是由进程的 **affinity mask**(关联掩码)决定的。通常，你的进程允许使用机器上的所有 CPU，所以线程池创建的工作者线程数量很快就会达到机器的\
  \ CPU 数。创建了这么多(CPU 数量)的线程后，线程池会监视工作项的完成速度。如果工作项完成的时间太长(具体多长没有正式公布)，线程池会创建更多的工作者线程。如果工作项的完成速度开始变快，工作者线程会被销毁。\n"
- "### 第 28 章 I/O 限制的异步操作\n\n**本章内容：**\n\n- Windows 如何执行 I/O 操作\n- C# 的异步函数\n- 编译器如何将异步函数转换成状态机\n\
  - 异步函数扩展性\n- 异步函数和事件处理程序\n- FCL 的异步函数\n- 异步函数和异常处理\n- 异步函数的其他功能\n- 应用程序及其线程处理模型\n\
  - 以异步方式实现服务器\n- 取消 I/O 操作\n- 有的 I/O 操作必须同步进行\n- I/O 请求优先级\n\n第 27 章重点讲述了如何异步执行计算限制的操作，允许线程池在多个\
  \ CPU 内核上调度任务，使多个线程能并发工作，从而高效率地使用系统资源，同时提升应用程序的吞吐能力。本章重点讲述如何异步执行 I/O 限制的操作，允许将任务交由硬件设备处理，期间完全不占用线程和\
  \ CPU 资源。然而，线程池仍然扮演了一个重要的角色，因为如同你马上要看到的那样，各种 I/O 操作的结果还是要由线程池线程来处理的。\n\n### 28.1\
  \ Windows 如何执行 I/O 操作\n\n首先讨论 Windows 如何执行同步 I/O 操作。图 28-1 是连接了几个硬件设备的计算机系统。每个硬件设备都有自己的电路板，每个电路板都集成了一个小型的、特殊用途的计算机，它知道如何控制自己的硬件设备。例如，硬盘驱动器就有一个小的电路板，它知道如何旋转碟片、寻道、在碟片上读写数据以及和计算机内存交换数据。\n\
  \n程序通过构造一个 **FileStream** 对象来打开磁盘文件，然后调用 **Read** 方法从文件中读取数据。调用 **FileStream** 的\
  \ **Read** 方法时，你的线程从托管代码转变为本机/用户模式代码，**Read** 内部调用 Win32 **ReadFile** 函数(①)。**ReadFile**\
  \ 分配一个小的数据结构，称为 I/O 请求包(I/O Request Packet, IRP)(②)。IRP 结构初始化后包含的内容有：文件句柄，文件中的偏移量(从这个位置开始读取字节)，一个\
  \ Byte[] 数组的地址(数组用读取的字节来填充)，要传输的字节数以及其他常规性内容。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_660_0.png)\n\
  \n图 28-1 Windows 如何执行同步 I/O 操作\n\n然后，ReadFile 将你的线程从本机/用户模式代码转变成本机/内核模式代码，向内核传递\
  \ IRP 数据结构，从而调用 Windows 内核(③)。根据 IRP 中的设备句柄，Windows 内核知道 I/O 操作要传送给哪个硬件设备。因此，Windows\
  \ 将 IRP 传送给恰当的设备驱动程序的 IRP 队列(④)。每个设备驱动程序都维护着自己的 IRP 队列，其中包含了机器上运行的所有进程发出的 I/O 请求。IRP\
  \ 数据包到达时，设备驱动程序将 IRP 信息传给物理硬件设备上安装的电路板。现在，硬件设备将执行请求的 I/O 操作(⑤)。\n\n但要注意一个重要问题：在硬件设备执行\
  \ I/O 操作期间，发出了 I/O 请求的线程将无事可做，所以 Windows 将线程变成睡眠状态，防止它浪费 CPU 时间(⑥)。这当然很好。但是，虽然线程不浪费时间，但它仍然浪费了空间(内存)，因为它的用户模式栈、内核模式栈、线程环境块(thread\
  \ environment block, TEB)和其他数据结构都还在内存中，而且完全没有谁去访问这些东西。这当然就不好了。\n\n最终，硬件设备会完成 I/O\
  \ 操作。然后，Windows 会唤醒你的线程，把它调度给一个 CPU，使它从内核模式返回用户模式，再返回至托管代码(⑦、⑧和⑨)。FileStream 的 Read\
  \ 方法现在返回一个 Int32，指明从文件中读取的实际字节数，使你知道在传给 Read 的 Byte[] 中，实际能检索到多少个字节。\n\n假定要实现一个\
  \ Web 应用程序，每个客户端请求抵达服务器时，都需要发出一个数据库请求。客户端请求抵达时，一个线程池线程会调用你的代码。如果以同步方式发出数据库请求，线程会阻塞不确定的时间，等待数据库返回结果。在此期间，如果另一个客户端请求抵达，线程池会创建另一个线程，这个线程在发出另一个数据库请求后，同样会阻塞。随着越来越多的客户端请求抵达，创建的线程也越来越多，所有这些线程都阻塞并等待数据库的响应。结果是\
  \ Web 服务器分配的系统资源(线程及其内存)基本上都浪费了！\n\n更糟的是，当数据库用结果来响应请求时，线程会被解锁，全都开始执行。但由于可能运行了大量线程，同时\
  \ CPU 内核只有区区几个，所以 Windows 被迫执行频繁的上下文切换，这进一步损害了性能。这和实现一个可伸缩应用程序的初衷是完全背道而驰的。\n\n现在讨论一下\
  \ Windows 如何执行异步 I/O 操作。图 28-2 删除了除硬盘之外的所有硬件设备，引入了 CLR 的线程池，稍微修改了代码。打开磁盘文件的方式仍然是通过构造一个\
  \ **FileStream** 对象，但现在传递了一个 **FileOptions.Asynchronous** 标志，告诉 Windows 我希望文件的读/写操作以异步方式执行。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_661_0.png)\n\n图 28-2 Windows 如何执行异步 I/O\
  \ 操作\n\n现在调用 **ReadAsync** 而不是 **Read** 从文件中读取数据。**ReadAsync** 内部分配一个 **Task<Int32>**\
  \ 对象来代表用于完成读取操作的代码。然后，**ReadAsync** 调用 Win32 **ReadFile** 函数(①)。**ReadFile** 分配\
  \ IRP，和前面的同步操作一样初始化它(②)，然后把它传给 Windows 内核(③)。Windows 把 IRP 添加到硬盘驱动程序的 IRP 队列中(④)。但线程不再阻塞，而是允许返回至你的代码。所以，线程能立即从\
  \ **ReadAsync** 调用中返回(⑤，⑥和⑦)。当然，此时 IRP 可能尚未处理好，所以不能够在 **ReadAsync** 之后的代码中访问传递的\
  \ **Byte[]** 中的字节。\n\n那么，什么时候以及用什么方式处理最终读取的数据呢？注意，调用 **ReadAsync** 返回的是一个 **Task<Int32>**\
  \ 对象。可在该对象上调用 **ContinueWith** 来登记任务完成时执行的回调方法，然后在回调方法中处理数据。当然，也可利用 C# 的异步函数功能简化编码，以顺序方式写代码(感觉就像是执行同步\
  \ I/O)。\n\n\n\n如果操作以异步方式完成，**IsCompleted** 将返回 **false**。状态机调用 awaiter 的 **OnCompleted**\
  \ 方法并向它传递一个委托(引用状态机的 **MoveNext** 方法)。现在，状态机允许它的线程回到原地以执行其他代码。将来某个时候，封装了底层任务的 awaiter\
  \ 会在完成时调用委托以执行 **MoveNext**。可根据状态机中的字段知道如何到达代码中的正确位置，使方法能从它当初离开时的位置继续。这时，代码调用 awaiter\
  \ 的 **GetResult** 方法。执行将从这里继续，以便对结果进行处理。\n\n这便是异步函数的工作原理，开发人员可用它轻松地写出不阻塞的代码。\n\n\
  ### 28.4 异步函数扩展性\n\n在扩展性方面，能用 **Task** 对象包装一个将来完成的操作，就可以用 **await** 操作符来等待该操作。用一个类型(**Task**)来表示各种异步操作对编码有利，因为可以实现组合操作(比如\
  \ **Task** 的 **WhenAll** 和 **WhenAny** 方法)和其他有用的操作。本章后面会演示如何用 **Task** 包装一个 **CancellationToken**，在等待异步操作的同时利用超时和取消功能。\n\
  \n我想和你分享另外一个例子。下面是我的 **TaskLogger** 类，可用它显示尚未完成的异步操作。这在调试时特别有用，尤其是当应用程序因为错误的请求或者未响应的服务器而挂起的时候。\n\
  \n```csharp\npublic static class TaskLogger {\n    public enum TaskLogLevel { None,\
  \ Pending }\n    public static TaskLogLevel LogLevel { get; set; }\n\n    public\
  \ sealed class TaskLogEntry {\n        public Task Task { get; internal set; }\n\
  \        public String Tag { get; internal set; }\n        public DateTime LogTime\
  \ { get; internal set; }\n        public String CallerMemberName { get; internal\
  \ set; }\n        public String CallerFilePath { get; internal set; }\n        public\
  \ Int32 CallerLineNumber { get; internal set; }\n        public override string\
  \ ToString() {\n            return String.Format(\"LogTime={0}, Tag={1}, Member={2},\
  \ File={3}({4})\",\n                LogTime, Tag ?? \"(none)\", CallerMemberName,\
  \ CallerFilePath, CallerLineNumber);\n        }\n    }\n\n    private static readonly\
  \ ConcurrentDictionary<Task, TaskLogEntry> s_log =\n        new ConcurrentDictionary<Task,\
  \ TaskLogEntry>();\n    public static IEnumerable<TaskLogEntry> GetLogEntries()\
  \ { return s_log.Values; }\n\n    public static Task<TResult> Log<TResult>(this\
  \ Task<TResult> task, String tag = null,\n        [CallerMemberName] String callerMemberName\
  \ = null,\n        [CallerFilePath] String callerFilePath = null,\n        [CallerLineNumber]\
  \ Int32 callerLineNumber = -1) {\n        return (Task<TResult>)\n            Log((Task)task,\
  \ tag, callerMemberName, callerFilePath, callerLineNumber);\n    }\n\n    public\
  \ static Task Log(this Task task, String tag = null,\n        [CallerMemberName]\
  \ String callerMemberName = null,\n        [CallerFilePath] String callerFilePath\
  \ = null,\n        [CallerLineNumber] Int32 callerLineNumber = -1) {\n        if\
  \ (LogLevel == TaskLogLevel.None) return task;\n        var logEntry = new TaskLogEntry\
  \ {\n            Task = task,\n            LogTime = DateTime.Now,\n           \
  \ Tag = tag,\n            CallerMemberName = callerMemberName,\n            CallerFilePath\
  \ = callerFilePath,\n            CallerLineNumber = callerLineNumber\n        };\n\
  \        s_log[task] = logEntry;\n        task.ContinueWith(t => { TaskLogEntry\
  \ entry; s_log.TryRemove(t, out entry); },\n            TaskContinuationOptions.ExecuteSynchronously);\n\
  \        return task;\n    }\n}\n```\n\n以下代码演示了如何使用该类。\n\n```csharp\npublic static\
  \ async Task Go() {\n#if DEBUG\n    // 使用 TaskLogger 会影响内存和性能，所以只在调试生成中启用它\n   \
  \ TaskLogger.LogLevel = TaskLogger.TaskLogLevel.Pending;\n#endif\n\n    // 初始化为3个任务：为了测试TaskLogger，我们显式控制其持续时间\n\
  \    var tasks = new List<Task> {\n        Task.Delay(2000).Log(\"2s op\"),\n  \
  \      Task.Delay(5000).Log(\"5s op\"),\n        Task.Delay(6000).Log(\"6s op\"\
  )\n    };\n\n    try {\n        // 等待全部任务，但在3秒后取消；只有一个任务能按时完成\n        // 注意：WithCancellation\
  \ 扩展方法将在本章稍后进行描述\n        await Task.WhenAll(tasks).\n            WithCancellation(new\
  \ CancellationTokenSource(3000).Token);\n    }\n    catch (OperationCanceledException)\
  \ { }\n\n    // 查询 logger 哪些任务尚未完成，按照从等待时间最长到最短的顺序排序\n    foreach (var op in TaskLogger.GetLogEntries().OrderBy(tle\
  \ => tle.LogTime))\n        Console.WriteLine(op);\n}\n```\n\n在我的机器上生成并运行上述代码得到以下结果。\n\
  \n```\nLogTime=7/16/2012 6:44:31 AM, Tag=6s op, Member=Go, File=C:\\\\CLR via C#\\\
  \\Code\\\\Ch28-1-IOOps.cs (332)\nLogTime=7/16/2012 6:44:31 AM, Tag=5s op, Member=Go,\
  \ File=C:\\\\CLR via C#\\\\Code\\\\Ch28-1-IOOps.cs (331)\n```\n\n除了增强使用 **Task**\
  \ 时的灵活性，异步函数另一个对扩展性有利的地方在于编译器可以在 **await** 的任何操作数上调用 **GetAwaiter**。所以操作数不一定是 **Task**\
  \ 对象。可以是任意类型，只要提供了一个可以调用的 **GetAwaiter** 方法。下列展示了我自己的 **awaiter**，在异步方法的状态机和被引发的事件之间，它扮演了“粘合剂”的角色。\n\
  \n```csharp\npublic sealed class EventAwaiter<TEventArgs> : INotifyCompletion {\n\
  \    private ConcurrentQueue<TEventArgs> m_events = new ConcurrentQueue<TEventArgs>();\n\
  \    private Action m_continuation;\n\n    #region 状态机调用的成员\n    // 状态机先调用这个来获得\
  \ awaiter：我们自己返回自己\n    public EventAwaiter<TEventArgs> GetAwaiter() { return this;\
  \ }\n\n    // 告诉状态机是否发生了任何事件\n    public Boolean IsCompleted { get { return m_events.Count\
  \ > 0; } }\n}\n```\n\n#### \n\n止盈止损是交易中至关重要的一环，直接关系着交易的成败。今天我们就来聊聊，止盈止损到底怎么设置？\n\
  \n止盈止损的设置方法不是一成不变的，需要根据不同的交易品种、时间周期、市场环境等因素综合考虑。\n\n常见的止盈止损设置方法有以下几种：\n\n- 固定点数法：根据品种的波动特性，设置固定的止盈止损点数。\n\
  - 支撑阻力法：在关键支撑位下方设置止损，在关键阻力位上方设置止盈。\n- 均线法：沿着均线方向设置止损，如跌破20日均线止损。\n- 资金管理法：根据账户资金比例设置止损，如每笔交易亏损不超过账户的2%。\n\
  \n不同的方法适用于不同的场景，关键是要找到适合自己的方法，并在实战中不断优化调整。\n\n> 交易是场马拉松，不是百米冲刺，风险控制才是长跑的基础。\n\n\
  ![](img/6fa065e17c4549db7260fbfaf4fd384e_671_0.png)\n\n中断异步函数。要在状态机运行完毕前对调用方法进行调试，在调用方法中插入断点并运行至断点(F5)即可。\n\
  \n有的异步操作执行速度很快，几乎瞬间就能完成。在这种情况下，挂起状态机并让另一个线程立即恢复状态机就显得不太划算。更有效的做法是让状态机继续执行。幸好，编译器为\
  \ **await** 操作符生成的代码能检测到这个问题。如果异步操作在线程返回前完成，就阻止线程返回，直接由它执行下一行代码。\n\n到目前为止一切都很完美，但有时异步函数需要先执行密集的、计算限制的处理，再发起异步操作。如果通过应用程序的\
  \ **GUI** 线程来调用函数，UI 就会突然失去响应，好长时间才能恢复。另外，如果操作以同步方式完成，那么 UI 失去响应的时间还会变得更长。在这种情况下，可利用\
  \ **Task** 的静态 **Run** 方法从非调用线程的其他线程中执行异步函数。\n\n```csharp\n// Task.Run 在 GUI 线程上调用\n\
  Task.Run(async () => {\n    // 这里的代码在一个线程池线程上运行\n    // TODO: 在这里执行密集的、计算限制的处理...\n\
  \n    await xxxAsync(); // 发起异步操作\n    // 在这里执行更多处理...\n});\n```\n\n上述代码演示了 C# 的异步\
  \ lambda 表达式。可以看出，不能只在普通的 lambda 表达式主体中添加 **await** 操作符完事，因为编译器不知道如何将方法转换成状态机。但同时在\
  \ lambda 表达式前面添加 **async**，编译器就能将 lambda 表达式转换成状态机方法来返回一个 **Task** 或 **Task<TResult>**，并可赋给返回类型为\
  \ **Task** 或 **Task<TResult>** 的任何 **Func** 委托变量。\n\n写代码时，很容易发生调用异步函数但忘记使用 **await**\
  \ 操作符的情况。以下代码进行了演示。\n\n```csharp\nstatic async Task OuterAsyncFunction() {\n   \
  \ InnerAsyncFunction(); // Oops，忘了添加 await 操作符\n\n    // 在 InnerAsyncFunction 继续执行期间，这里的代码也继续执行\n\
  }\nstatic async Task InnerAsyncFunction() { /* 这里的代码不重要 */ }\n```\n\n幸好，C#编译器会针对这种情况显示以下警告：\n\
  \n由于此调用不会等待，因此在此调用完成之前将会继续执行当前方法。请考虑将 “await” 运算符应用于调用结果。\n\n这个警告大多数时候都很有用，但极少数情况下，你确实不关心\
  \ **InnerAsyncFunction** 在什么时候结束，上述代码正是你想要的结果，不希望看到警告。\n\n为了取消警告，只需将 **InnerAsyncFunction**\
  \ 返回的 **Task** 赋给一个变量，然后忽略该变量。①\n\n```csharp\nstatic async Task OuterAsyncFunction()\
  \ {\n    var nowarning = InnerAsyncFunction(); // 故意不添加 await 操作符\n\n    // 在 InnerAsyncFunction\
  \ 继续执行期间，这里的代码也继续执行\n}\n```\n\n① 幸好编译器不会为从不使用的局部变量显示警告。\n\n我个人更喜欢定义如下所示的扩展方法。\n\n\
  ```csharp\n[MethodImpl(MethodImplOptions.AggressiveInlining)] // 造成编译器优化调用\npublic\
  \ static void NoWarning(this Task task) { /* 这里没有代码 */ }\n```\n\n然后像下面这样使用它。\n\n\
  ```csharp\nstatic async Task OuterAsyncFunction()\n{\n    InnerAsyncFunction().NoWarning();\
  \ // 故意不添加 await 操作符\n\n    // 在 InnerAsyncFunction 继续执行期间，这里的代码也继续执行\n}\n```\n\n\
  异步 I/O 操作最好的一个地方是可以同时发起许多这样的操作，让它们并行执行，从而显著提升应用程序的性能。以下代码启动我的命名管道服务器，然后向它发起大量的客户端请求。\n\
  \n```csharp\npublic static async Task Go() {\n    // 启动服务器并立即返回，因为它异步地等待客户端请求\n\
  \    StartServer(); // 返回 void，所以编译器会发出警告\n\n    // 发起大量异步客户端请求：保存每个客户端的 Task<String>\n\
  \    List<Task<String>> requests = new List<Task<String>>(10000);\n    for (Int32\
  \ n = 0; n < requests.Capacity; n++)\n        requests.Add(IssueClientRequestAsync(\"\
  localhost\", \"Request #\" + n));\n\n    // 异步地等待所有客户端请求完成\n    // 注意：如果 1 个以上的任务抛出异常，WhenAll\
  \ 重新抛出最后一个抛出的异常\n    String[] responses = await Task.WhenAll(requests);\n\n    //\
  \ 处理所有响应\n    for (Int32 n = 0; n < responses.Length; n++)\n        Console.WriteLine(responses[n]);\n\
  }\n```\n\n上述代码启动命名管道服务器来监听客户端请求，然后，**for** 循环以最快速度发起 10000 个客户端请求。每个 **IssueClientRequestAsync**\
  \ 调用都返回一个 **Task<String>** 对象，这些对象全部添加到一个集合中。现在，命名管道服务器使用线程池线程以最快的速度处理这些请求，机器上的所有\
  \ CPU 都将保持忙碌状态。每处理完一个请求，该请求的 **Task<String>** 对象都会完成，并从服务器返回字符串响应。\n\n在上述代码中，我希望等待所有客户端请求都获得响应后再处理结果。为此，我调用了\
  \ **Task** 的静态 **WhenAll** 方法。该方法内部创建一个 **Task<String[]>** 对象，它在列表中的所有 **Task**\
  \ 对象都完成后才完成。然后，我等待 **Task<String[]>** 对象，使状态机在所有任务完成后继续执行。所有任务完成后，我遍历所有响应并进行处理（调用\
  \ **Console.WriteLine**）。\n\n如果希望收到一个响应就处理一个，而不是在全部完成后再处理，那么用 **Task** 的静态 **WhenAny**\
  \ 方法可以轻松地实现，下面是修改后的代码。\n\n```csharp\npublic static async Task Go() {\n    // 启动服务器并立即返回，因为它异步地等待客户端请求\n\
  ```\n\n> ① 我观察到的一个有趣的现象。我在一台 8 核电脑上测试代码，所有 CPU 的利用率都达到 100%，这是理所当然的。由于所有 CPU 都非常忙，所以电脑变得更热，风扇变得更吵！处理结束后，CPU\
  \ 利用率下降，风扇重新变得安静了。我感觉可以根据风扇噪声来验证代码是否正常工作。\n\n\n\n```csharp\nStartServer();\n\n//\
  \ 发起大量异步客户端请求；保存每个客户端的 Task<String>\nList<Task<String>> requests = new List<Task<String>>(10000);\n\
  for (Int32 n = 0; n < requests.Capacity; n++)\n    requests.Add(IssueClientRequestAsync(\"\
  localhost\", \"Request #\" + n));\n\n// 每个任务完成都继续\nwhile (requests.Count > 0) {\n\
  \    // 顺序处理每个完成的响应\n    Task<String> response = await Task.WhenAny(requests);\n\
  \    requests.Remove(response); // 从集合中删除完成的任务\n\n    // 处理一个响应\n    Console.WriteLine(response.Result);\n\
  }\n```\n\n上述代码创建 **while** 循环，针对每个客户端请求都迭代一次。循环内部等待 **Task** 的 **WhenAny** 方法，该方法一次返回一个\
  \ **Task<String>** 对象，代表由服务器响应的一个客户端请求。获得这个 **Task<String>** 对象后，就把它从集合中删除，然后查询它的结果以进行处理(把它传给\
  \ **Console.WriteLine**)。\n\n### 28.9 应用程序及其线程处理模型\n\n.NET Framework 支持几种不同的应用程序模型，而每种模型都可能引入了它自己的线程处理模型。控制台应用程序和\
  \ Windows 服务(实际上也是控制台应用程序；只是看不见控制台而已)没有引入任何线程处理模型；换言之，任何线程可在任何时候做它想做的任何事情。\n\n但\
  \ GUI 应用程序(包括 Windows 窗体、WPF、Silverlight 和 Windows Store 应用程序)引入了一个线程处理模型。在这个模型中，UI\
  \ 元素只能由创建它的线程更新。在 GUI 线程中，经常都需要生成一个异步操作，使 GUI 线程不至于阻塞并停止响应用户输入(比如鼠标、按键、手写笔和触控事件)。但当异步操作完成时，是由一个线程池线程完成\
  \ Task 对象并恢复状态机。\n\n对于某些应用程序模型，这样做无可非议，甚至可以说正好符合开发人员的意愿，因为它非常高效。但对于另一些应用程序模型(比如\
  \ GUI 应用程序)，这个做法会造成问题，因为一旦通过线程池线程更新 UI 元素就会抛出异常。线程池线程必须以某种方式告诉 GUI 线程更新 UI 元素。\n\
  \nASP.NET 应用程序允许任何线程做它想做的任何事情。线程池线程开始处理一个客户端的请求时，可以对客户端的语言文化(**System.Globalization.CultureInfo**)做出假定，从而允许\
  \ Web 服务器对返回的数字、日期和时间进行该语言文化特有的格式化处理。此外，Web 服务器还可对客户端的身份标识(**System.Security.Principal.IPrincipal**)做出假定，确保只能\n\
  \n① 欲知详情，请访问 http://msdn.microsoft.com/zh-cn/library/bz9tc508.aspx。注意，帮助文档将 culture\
  \ 翻译成“区域性”。——译注\n\nTask<TResult>类提供了一个 ConfigureAwait 方法，它的签名如下所示。\n\n```csharp\n\
  // 定义这个方法的 Task\npublic ConfiguredTaskAwaitable ConfigureAwait(Boolean continueOnCapturedContext);\n\
  \n// 定义这个方法的 Task<TResult>\npublic ConfiguredTaskAwaitable<TResult> ConfigureAwait(Boolean\
  \ continueOnCapturedContext);\n```\n\n向方法传递 true 相当于根本没有调用方法。但如果传递 false，await 操作符就不查询调用线程的\
  \ SynchronizationContext 对象。当线程池线程结束 Task 时会直接完成它，await 操作符后面的代码通过线程池线程执行。\n\n虽然我的\
  \ GetHttp 方法不是类库代码，但在添加了对 ConfigureAwait 的调用后，死锁问题就不翼而飞。下面是修改过的 GetHttp 方法。\n\n\
  ```csharp\nprivate async Task<String> GetHttp() {\n    // 发出 HTTP 请求，让线程从 GetHttp\
  \ 返回\n    HttpResponseMessage msg = await new\n        HttpClient().GetAsync(\"\
  http://Wintellect.com/\").ConfigureAwait(false);\n    // 这里能执行到了，因为线程池线程可以执行这里的代码，\n\
  \    // 而非被迫由 GUI 线程执行\n\n    return await msg.Content.ReadAsStringAsync().ConfigureAwait(false);\n\
  }\n```\n\n如上述代码所示，必须将 ConfigureAwait(false)应用于等待的每个 Task 对象。这是由于异步操作可能同步完成，而且在发生这个情况时，调用线程直接继续执行，不会返回至它的调用者；你根本不知道哪个操作要求忽略\
  \ SynchronizationContext 对象，所以只能要求所有操作都忽略它。这还意味着类库代码不能依赖于任何特定的应用程序模型。另外，也可以像下面这样重写\
  \ GetHttp 方法，用一个线程池线程执行所有操作。\n\n```csharp\nprivate Task<String> GetHttp() {\n  \
  \  return Task.Run(async () => {\n        // 运行一个无 SynchronizationContext 的线程池线程\n\
  \        HttpResponseMessage msg = await new HttpClient().GetAsync(\"http://Wintellect.com/\"\
  );\n        // 这里的代码真的能执行，因为某个线程池线程能执行这里的代码\n\n        return await msg.Content.ReadAsStringAsync();\n\
  \    });\n}\n```\n\n在这个版本中，注意，GetHttp 不再是异步函数；我从方法签名中删除了 async 关键字，因为方法中没有了 await\
  \ 操作符。但是，传给 Task.Run 的 lambda 表达式是异步函数。\n\n### 28.10　以异步方式实现服务器\n\n根据我多年来和开发人员的交流经验，发现很少有人知道.NET\
  \ Framework 其实内建了对伸缩性很好的—些异步服务器的支持。本书限制篇幅无法一一解释，但可以列出 MSDN 文档中值得参考的地方。\n\n- 要构建异步\
  \ ASP.NET Web 窗体，在.aspx 文件中添加 `Async=\"true\"` 网页指令，并参考 `System.Web.UI.Page` 的 `RegisterAsyncTask`\
  \ 方法。\n- 要构建异步 ASP.NET MVC 控制器，使你的控制器类从 **System.Web.Mvc.AsyncController** 派生，让操作方法返回一个\
  \ **Task<ActionResult>** 即可。\n- 要构建异步 ASP.NET 处理程序，使你的类从 **System.Web.HttpTaskAsyncHandler**\
  \ 派生，重写其抽象 **ProcessRequestAsync** 方法。\n- 要构建异步 WCF 服务，将服务作为异步函数实现，让它返回 Task 或 Task<TResult>。\n\
  \n### 28.11 取消 I/O 操作\n\nWindows 一般没有提供取消未完成 I/O 操作的途径。这是许多开发人员都想要的功能，实现起来却很困难。毕竟，如果向服务器请求了\
  \ 1000 个字节，然后决定不再需要这些字节，那么其实没有办法告诉服务器忘掉你的请求。在这种情况下，只能让字节照常返回，再将它们丢弃。此外，这里还会发生竞态条件——取消请求的请求可能正好在服务器发送响应的时候到来。这时应该怎么办？所以，要在代码中处理这种潜在的竞态条件，决定是丢弃还是使用数据。\n\
  \n为此，我建议实现一个 **WithCancellation** 扩展方法来扩展 **Task<TResult>**（需要类似的重载版本来扩展 **Task**），如下所示：\n\
  \n```csharp\nprivate struct Void { } // 因为没有非泛型的 TaskCompletionSource 类\n\nprivate\
  \ static async Task<TResult> WithCancellation<TResult>(this Task<TResult> originalTask,\n\
  \    CancellationToken ct) {\n\n    // 创建在 CancellationToken 被取消时完成的一个 Task\n  \
  \  var cancelTask = new TaskCompletionSource<Void>();\n\n    // 一旦 CancellationToken\
  \ 被取消，就完成 Task\n    using (ct.Register(\n        t => ((TaskCompletionSource<Void>)t).TrySetResult(new\
  \ Void()), cancelTask)) {\n\n        // 创建在原始 Task 或 CancellationToken Task 完成时都完成的一个\
  \ Task\n        Task any = await Task.WhenAny(originalTask, cancelTask.Task);\n\n\
  \        // 任何 Task 因为 CancellationToken 而完成，就抛出 OperationCanceledException\n  \
  \      if (any == cancelTask.Task) ct.ThrowIfCancellationRequested();\n    }\n\n\
  \    // 等待原始任务（以同步方式），若任务失败，等待它将抛出第一个内部异常，\n    // 而不是 AggregateException\n    return\
  \ await originalTask;\n}\n```\n\n现在可以像下面这样调用该扩展方法。\n\n```csharp\npublic static async\
  \ Task Go() {\n    // 创建一个 CancellationTokenSource，它在5秒后取消自己\n    var cts = new\
  \ CancellationTokenSource(5000); // 更快地取消请调用 cts.Cancel()\n    var ct = cts.Token;\n\
  \n    try {\n        // 我用 Task.Delay 进行测试：把它替换成返回一个 Task 的其他方法\n```\n\n另一方面，可在创建\
  \ **FileStream** 对象时指定 **FileOptions.Asynchronous** 标志。然后，可以调用 **FileStream** 的\
  \ **Read** 方法执行一个同步操作。在内部，**FileStream** 类会开始一个异步操作，然后立即使调用线程进入睡眠状态，直至操作完成才会唤醒，从而模拟同步行为。这同样效率低下。但相较于不指定\
  \ **FileOptions.Asynchronous** 标志来构造一个 **FileStream** 并调用 **ReadAsync**，它的效率还是要高上那么一点点的。\n\
  \n总之，使用 **FileStream** 时必须先想好是同步还是异步执行文件 I/O，并指定（或不指定）**FileOptions.Asynchronous**\
  \ 标志来指明自己的选择。如果指定了该标志，就总是调用 **ReadAsync**。如果没有指定这个标志，就总是调用 **Read**。这样可以获得最佳的性能。如果想先对\
  \ **FileStream** 执行一些同步操作，再执行一些异步操作，那么更高效的做法是使用 **FileOptions.Asynchronous** 标志来构造它。另外，也可针对同一个文件创建两个\
  \ **FileStream** 对象；打开一个 **FileStream** 进行异步 I/O，打开另一个 **FileStream** 进行同步 I/O。注意，**System.IO.File**\
  \ 类提供了辅助方法（**Create**、**Open** 和 **OpenWrite**）来创建并返回 **FileStream** 对象。但所有这些方法都没有在内部指定\
  \ **FileOptions.Asynchronous** 标志，所以为了实现响应灵敏的、可伸缩的应用程序，应避免使用这些方法。\n\n还要注意，NTFS 文件系统设备驱动程序总是以同步方式执行一些操作，不管具体如何打开文件。详情参见\
  \ http://support.microsoft.com/default.aspx?scid=kb%3Ben-us%3B156932。\n\n### 28.13　I/O\
  \ 请求优先级\n\n第 26 章“线程基础”介绍了线程优先级对线程调度方式的影响。然而，线程还要执行 I/O 请求以便从各种硬件设备中读写数据。如果一个低优先级线程获得了\
  \ CPU 时间，它可以在非常短的时间里轻易地将成百上千的 I/O 请求放入队列。由于 I/O 请求一般需要时间来执行，所以一个低优先级线程可能挂起高优先级线程，使后者不能快速完成工作，从而严重影响系统的总体响应能力。正是由于这个原因，当系统执行一些耗时的低优先级服务时（比如磁盘碎片整理程序、病毒扫描程序、内容索引程序等），机器的响应能力可能会变得非常差。①\n\
  \nWindows 允许线程在发出 I/O 请求时指定优先级。欲知 I/O 优先级的详情，请参考以下网址的白皮书：http://www.microsoft.com/whdc/driver/priorityio.mspx。遗憾的是，FCL\
  \ 还没有包含这个功能；但未来的版本有望添加。如果现在就想使用这个功能，可以采取 P/Invoke 本机 Win32 函数的方式。以下是 P/Invoke 代码：\n\
  \n```csharp\ninternal static class ThreadIO {\n    public static BackgroundProcessingDisposer\
  \ BeginBackgroundProcessing(\n        Boolean process = false) {\n\n        ChangeBackgroundProcessing(process,\
  \ true);\n        return new BackgroundProcessingDisposer(process);\n    }\n}\n\
  ```\n\n① Windows SuperFetch 功能就利用了低优先级 I/O 请求。\n\n多个线程同时对共享数据进行只读访问是没有任何问题的。例如，许多应用程序都会在它们初始化期间创建一些数据结构。初始化完成后，应用程序就可以创建它希望的任何数量的线程；如果所有线程都只是查询数据，那么所有线程都能同时查询，无需获取或释放一个锁。**String**\
  \ 类型便是这样的一个例子：一旦创建好 **String** 对象，它就是“不可变”(immutable)的。所以，许多线程能同时访问一个 **String**\
  \ 对象，**String** 对象没有被破坏之虞。\n\n### 29.1 类库和线程安全\n\n现在，我想简单地谈一谈类库和线程同步。Microsoft 的\
  \ Framework Class Library(FCL)保证所有静态方法都是线程安全的。这意味着假如两个线程同时调用一个静态方法，不会发生数据被破坏的情况。FCL\
  \ 必须在内部做到这一点，因为开发不同程序集的多个公司不可能事先协商好使用一个锁来仲裁对资源的访问。Console 类包含了一个静态字段，类的许多方法都要获取和释放这个字段上的锁，确保一次只有一个线程访问控制台。\n\
  \n要郑重声明的是，使一个方法线程安全，并不是说它一定要在内部获取一个线程同步锁。线程安全的方法意味着在两个线程试图同时访问数据时，数据不会被破坏。**System.Math**\
  \ 类有一个静态 **Max** 方法，它像下面这样实现：\n\n```csharp\npublic static Int32 Max(Int32 val1,\
  \ Int32 val2) {\n    return (val1 < val2) ? val2 : val1;\n}\n```\n\n这个方法是线程安全的，即使它没有获取任何锁。由于\
  \ **Int32** 是值类型，所以传给 **Max** 的两个 **Int32** 值会复制到方法内部。多个线程可以同时调用 **Max** 方法，每个线程处理的都是它自己的数据，线程之间互不干扰。\n\
  \n另一方面，FCL 不保证实例方法是线程安全的，因为假如全部添加锁定，会造成性能的巨大损失。另外，假如每个实例方法都需要获取和释放一个锁，事实上会造成最终在任何给定的时刻，你的应用程序只有一个线程在运行，这对性能的影响是显而易见的。如前所述，线程构造对象时，只有这个线程才拥有对象引用，其他线程都不能访问那个对象，所以在调用实例方法时无需线程同步。然而，如果线程随后公开了这个对象引用——把它放到一个静态字段中，把它作为状态类参数传给一个\
  \ **ThreadPool.QueueUserWorkItem** 或 **Task**——那么在多个线程可能同时进行并只读访问的前提下，就需要线程同步。\n\
  \n建议你自己的类库也遵循 FCL 的这个模式；也就是说，使自己的所有静态方法都线程安全，使所有实例方法都非线程安全。这个模式有一点要注意：如果实例方法的目的是协调线程，则实例方法应该是线程安全的。例如，一个线程可能调用\
  \ **CancellationTokenSource** 的 **Cancel** 方法取消一个操作，另一个线程通过查询对应的 **CancellationToken**\
  \ 的 **IsCancellationRequested** 属性，检测到它应该停止正在做的事情。这两个实例成员内部通过一些特殊的线程同步代码来协调两个线程。①\n\
  \n① 具体地说，两个成员访问的字段被标记为 **volatile**，这是本章稍后要讨论的一个概念。\n\n\n\n### 29.2　基元用户模式和内核模式构造\n\
  \n本章将讨论基元线程同步构造。基元(primitive)是指可以在代码中使用的最简单的构造。有两种基元构造：用户模式(user-mode)和内核模式(kernel-mode)。应尽量使用基元用户模式构造，它们的速度要显著快于内核模式的构造。这是因为它们使用了特殊\
  \ CPU 指令来协调线程。这意味着协调是在硬件中发生的(所以才这么快)。但这也意味着 Microsoft Windows 操作系统永远检测不到一个线程在基元用户模式的构造上阻塞了。由于在用户模式的基元构造上阻塞的线程池线程永远不认为已阻塞，所以线程池不会创建新线程来替换这种临时阻塞的线程。此外，这些\
  \ CPU 指令只阻塞线程相当短的时间。\n\n所有这一切听起来真不错，是吧？确实如此，这是我建议尽量使用这些构造的原因。但它们也有一个缺点：只有 Windows\
  \ 操作系统内核才能停止一个线程的运行(防止它浪费 CPU 时间)。在用户模式中运行的线程可能被系统抢占(preempted)，但线程会以最快的速度再次调度。所以，想要取得资源但暂时取不到的线程会一直在用户模式中“自旋”。这可能浪费大量\
  \ CPU 时间，而这些 CPU 时间本可用于执行其他更有用的工作。即便没有其他更有用的工作，更好的做法也是让 CPU 空闲，这至少能省一点电。\n\n这使我们将眼光投向了基元内核模式构造。内核模式的构造是由\
  \ Windows 操作系统自身提供的。所以，它们要求在应用程序的线程中调用由操作系统内核实现的函数。将线程从用户模式切换为内核模式(或相反)会招致巨大的性能损失，这正是为什么要避免使用内核模式构造的原因。①但它们有一个重要的优点：线程通过内核模式的构造获取其他线程拥有的资源时，Windows\
  \ 会阻塞线程以避免它浪费 CPU 时间。当资源变得可用时，Windows 会恢复线程，允许它访问资源。\n\n① 29.4.1 节“Event 构造”最后会通过一个程序来具体测试性能。\n\
  \n对于在一个构造上等待的线程，如果拥有这个构造的线程一直不释放它，前者就可能一直阻塞。如果是用户模式的构造，线程将一直在一个 CPU 上运行，我们称为“活锁”(livelock)。如果是内核模式的构造，线程将一直阻塞，我们称为“死锁”(deadlock)。两种情况都不好。但在两者之间，死锁总是优于活锁，因为活锁既浪费\
  \ CPU 时间，又浪费内存(线程栈等)，而死锁只浪费内存。②\n\n② 之所以说分配给线程的内存被浪费了，是因为在线程没有取得任何进展的前提下，这些内存不会产生任何收益。\n\
  \n我理想中的构造应兼具两者的长处。也就是说，在没有竞争的情况下，这个构造应该快而且不会阻塞(就像用户模式的构造)。但如果存在对构造的竞争，我希望它被操作系统内核阻塞。像这样的构造确实存在；我把它们称为混合构造(hybrid\
  \ construct)，将在第 30 章详细讨论。应用程序使用混合构造是一种很常见的现象，因为在大多数应用程序中，很少会有两个或多个线程同时访问相同的数据。混合构造使你的应用程序在大多数时间都快速运行，偶尔运行得比较慢是为了阻塞线程。但这时慢一些不要紧，因为线程反正都要阻塞。\n\
  \nCLR 的许多线程同步构造实际上只是 “Win32 线程同步构造” 的一些面向对象的类包装器。毕竟，CLR 线程就是 Windows 线程，这意味着要由 Windows\
  \ 调度线程和控制线程同步。Windows 线程同步构造自 1992 年便存在了，人们已就这个主题撰写了大量内容。①所以，本章只是稍微提及了一下它。\n\n①\
  \ 事实上，在 Christophe Nasarre 和我合写的《Windows 核心编程（第 5 版）》中，有几章就是专门讲这个主题的。\n\n### 29.3\
  \ 用户模式构造\n\nCLR 保证对以下数据类型的变量的读写是原子性的：Boolean、Char、(S)Byte、(U)Int16、(U)Int32、(U)IntPtr、Single\
  \ 以及引用类型。这意味着变量中的所有字节都一次性读取或写入。例如，假定有以下类：\n\n```csharp\ninternal static class SomeType\
  \ {\n    public static Int32 x = 0;\n}\n```\n\n然后，如果一个线程执行这一行代码：\n\n```csharp\n\
  SomeType.x = 0x01234567;\n```\n\nx 变量会一次性（原子性）地从 0x00000000 变成 0x01234567。另一个线程不可能看到处于中间状态的值。例如，不可能有别的线程查询\
  \ SomeType.x 并得到值 0x01230000。假定上述 SomeType 类中的 x 字段是一个 Int64，那么当一个线程执行以下代码时：\n\n\
  ```csharp\nSomeType.x = 0x0123456789abcdef;\n```\n\n另一个线程可能查询 x，并得到值 0x0123456700000000\
  \ 或 0x0000000089abcdef 值，因为读取和写入操作不是原子性的。这称为一次 torn read②。\n\n虽然对变量的原子访问可保证读取或写入操作一次性完成，但由于编译器和\
  \ CPU 的优化，不保证操作什么时候发生。本节讨论的基元用户模式构造适用于规划好这些原子性读取/写入操作的时间。此外，这些构造还可强制对 (U)Int64 和\
  \ Double 类型的变量进行原子性的、规划好了时间的访问。\n\n有两种基元用户模式线程同步构造。\n\n- **易变构造③ (volatile construct)**：在特定的时间，它在包含一个简单数据类型的变量上执行原子性的读或写操作。\n\
  - **互锁构造(interlocked construct)**：在特定的时间，它在包含一个简单数据类型的变量上执行原子性的读/写操作。\n\n所有易变和互锁构造都要求传递对包含简单数据类型的一个变量的引用(内存地址)。\n\
  \n### 29.3.1 易变构造\n\n早期软件是用汇编语言写的。汇编语言非常繁琐，程序员要事必躬亲，清楚地指明：将这个 CPU 寄存器用于这个，分支到那里，通过这个来间接调用等。为了简化编程，人们发明了更高级的语言。这些高级语言引入了一系列常规构造，比如\
  \ if/else、switch/case、各种循环、局部变量、实参、虚方法调用、操作符重载等。最终，这些语言的编译器必须将高级构造转换成低级构造，使计算机能真正做你想做的事情。\n\
  \n换言之，C#编译器将你的 C#构造转换成中间语言(IL)。然后，JIT 将 IL 转换成本机 CPU 指令，然后由 CPU 亲自处理这些指令。此外，C#编译器、JIT\
  \ 编译器、甚至 CPU 本身都可能优化你的代码。例如，下面这个荒谬的方法在编译之后会消失得无影无踪：\n\n```csharp\nprivate static\
  \ void OptimizedAway() {\n    // 常量表达式在编译时计算，结果是 0\n    Int32 value = (1 * 100)\
  \ - (50 * 2);\n\n    // 如果 value 是 0，循环永远不执行\n    for (Int32 x = 0; x < value; x++)\
  \ {\n        // 不需要编译循环中的代码，因为永远都执行不到\n        Console.WriteLine(\"Jeff\");\n  \
  \  }\n}\n```\n\n在上述代码中，编译器发现 value 始终是 0；所以循环永远不会执行，没有必要编译循环中的代码。换言之，这个方法在编译后会被“优化掉”。事实上，如果一个方法调用了\
  \ OptimizedAway，在对那个方法进行 JIT 编译时，JIT 编译器会尝试内联(嵌入)OptimizedAway 方法的代码。但由于没有代码，所以\
  \ JIT 编译器会删除调用 OptimizedAway 的代码。我们喜爱编译器的这个功能。作为开发人员，我们应该以最合理的方式写代码。代码应该容易编写、阅读和维护。然后，编译器将我们的意图转换成机器能理解的代码。在这个过程中，我们希望编译器能有最好的表现。\n\
  \nC#编译器、JIT 编译器和 CPU 对代码进行优化时，它们保证我们的意图会得到保留。也就是说，从单线程的角度看，方法会做我们希望它做的事情，虽然做的方式可能有别于我们在源代码中描述的方式。但从多线程的角度看，我们的意图并不一定能得到保留。下例演示了在优化之后，程序的工作方式和我们预想的有出入：\n\
  \n```csharp\ninternal static class StrangeBehavior {\n    // 以后会讲到，将这个字段标记成 volatile\
  \ 可修正问题\n    private static Boolean s_stopWorker = false;\n\n    public static void\
  \ Main() {\n        Console.WriteLine(\"Main: letting worker run for 5 seconds\"\
  );\n        Thread t = new Thread(Worker);\n        t.Start();\n        Thread.Sleep(5000);\n\
  \        s_stopWorker = true;\n        Console.WriteLine(\"Main: waiting for worker\
  \ to stop\");\n        t.Join();\n    }\n\n    private static void Worker(Object\
  \ o) {\n        Int32 x = 0;\n        while (!s_stopWorker) x++;\n        Console.WriteLine(\"\
  Worker: stopped when x={0}\", x);\n    }\n}\n```\n\n在上述代码中，**Main** 方法创建一个新线程来执行\
  \ **Worker** 方法。**Worker** 方法会一直做数，直到被告知停止。**Main** 方法允许 **Worker** 线程运行 5 秒，然后将静态\
  \ **Boolean** 字段设为 **true** 来告诉它停止。在这个时候，**Worker** 线程应显示它数到多少了，然后线程终止。**Main**\
  \ 线程通过调用 **Join** 来等待 **Worker** 线程终止，然后 **Main** 线程返回，造成整个进程终止。\n\n看起来很简单，但要注意，由于会对程序执行各种优化，所以它存在一个潜在的问题。当\
  \ **Worker** 方法编译时，编译器发现 **s_stopWorker** 要么为 **true**，要么为 **false**。它还发现这个值在 **Worker**\
  \ 方法本身中永远都不变化。因此，编译器会生成代码先检查 **s_stopWorker**。如果 **s_stopWorker** 为 **true**，就显示“Worker:\
  \ stopped when x=0”。如果 **s_stopWorker** 为 **false**，编译器就生成代码来进入一个无限循环，并在循环中一直递增\
  \ x。所以，如你所见，优化导致循环很快就完成，因为对 **s_stopWorker** 的检查只有循环前发生一次；不会在循环的每一次迭代时都检查。\n\n要想实际体验这一切，请将上述代码放到一个\
  \ .cs 文件中，再用 C# 编译器 (csc.exe) 的 **/platform:x86** 和 **/optimize+** 开关来编译。运行生成的 EXE\
  \ 程序，会看到程序一直运行。注意，必须针对 x86 平台来编译，确保在运行时使用的是 x86 JIT 编译器。x86 JIT 编译器比 x64 编译器更成熟，所以它在执行优化的时候更大胆。其他\
  \ JIT 编译器不执行这个特定的优化，所以程序会像预期的那样正常运行到结束。这使我们注意另一个有趣的地方：程序是否如预想的那样工作要取决于大量因素，比如使用的是编译器的什么版本和什么开关，使用的是哪个\
  \ JIT 编译器，以及代码在什么 CPU 上运行等。除此之外，要看到上面这个程序进入死循环，一定不能在调试器中运行它，因为调试器会造成 JIT 编译器生成未优化的代码\
  \ (目的是方便你进行单步调试)。\n\n再来看另一个例子。在这个例子中，有两个字段要由两个线程同时访问：\n\n```csharp\ninternal sealed\
  \ class ThreadSharingData {\n    private Int32 m_flag = 0;\n    private Int32 m_value\
  \ = 0;\n\n    // 这个方法由一个线程执行\n    public void Thread1() {\n        // 注意：以下两行代码可以按相反的顺序执行\n\
  \        m_value = 5;\n        m_flag = 1;\n    }\n\n    // 这个方法由另一个线程执行\n    public\
  \ void Thread2() {\n        //注意：m_value 可能先于 m_flag 读取\n        if (m_flag == 1)\n\
  ```\n\n```csharp\nprivate Int32 m_value = 0;\n\n// 这个方法由一个线程执行\npublic void Thread1()\
  \ {\n    // 注意：在将 1 写入 m_flag 之前，必须先将 5 写入 m_value\n    m_value = 5;\n    Volatile.Write(ref\
  \ m_flag, 1);\n}\n\n// 这个方法由另一个线程执行\npublic void Thread2() {\n    // 注意：m_value\
  \ 必然在读取了 m_flag 之后读取\n    if (Volatile.Read(ref m_flag) == 1)\n        Console.WriteLine(m_value);\n\
  }\n```\n\n首先，注意我们遵守了规则。**Thread1** 方法将两个值写入多个线程共享的字段。最后一个值的写入（将 **m_flag** 设为 1）通过调用\
  \ **Volatile.Write** 来进行。**Thread2** 方法从多个线程共享的字段读取两个值，第一个值的读取（读取 **m_flag** 的值）通过调用\
  \ **Volatile.Read** 来进行。\n\n但是，这里真正发生了什么事情？对于 **Thread1** 方法，**Volatile.Write**\
  \ 调用确保在它之前的所有写入操作都在将 1 写入 **m_flag** 之前完成。由于在调用 **Volatile.Write** 之前的写入操作是 **m_value\
  \ = 5**，所以它必须先完成。事实上，如果在调用 **Volatile.Write** 之前要对许多变量进行修改，它们全都必须在将 1 写入 **m_flag**\
  \ 之前完成。注意，**Volatile.Write** 调用之前的写入可能被优化成以任意顺序执行；只是所有这些写入都必须在调用 **Volatile.Write**\
  \ 之前完成。\n\n对于 **Thread2** 方法，**Volatile.Read** 调用确保在它之后的所有变量读取操作都必须在 **m_flag**\
  \ 中的值读取之后开始。由于 **Volatile.Read** 调用之后是对 **m_value** 的读取，所以必须在读取了 **m_flag** 之后，才能读取\
  \ **m_value**。如果在调用 **Volatile.Read** 之后有许多读取，它们都必须在读取了 **m_flag** 的值之后才能开始。注意，**Volatile.Read**\
  \ 调用之后的读取可能被优化成以任何顺序执行；只是所有这些读取都必须在调用了 **Volatile.Read** 之后发生。\n\n### C#对易变字段的支持\n\
  \n如何确保正确调用 **Volatile.Read** 和 **Volatile.Write** 方法，是程序员最为头疼的问题之一。程序员很难记住所有这些方法和规则，并搞清楚其他线程会在后台对共享数据进行什么操作。为了简化编程，C#编译器提供了\
  \ **volatile** 关键字，它可应用于以下任何类型的静态或实例字段：**Boolean**、**(S)Byte**、**(U)Int16**、**(U)Int32**、**(U)IntPtr**、**Single**\
  \ 和 **Char**。还可将 **volatile** 关键字应用于引用类型的字段，以及基础类型为 **(S)Byte**、**(U)Int16** 或 **(U)Int32**\
  \ 的任何枚举字段。JIT 编译器确保对易变字段的所有访问都是以易变读取或写入的方式执行，不必显式调用 **Volatile** 的静态 **Read** 或\
  \ **Write** 方法。另外，**volatile** 关键字告诉 C#和 JIT 编译器不将字段缓存在 CPU 的寄存器中，确保字段的所有读写操作都在\
  \ RAM 中进行。\n\n下面用 **volatile** 关键字重写 **ThreadSharingData** 类。\n\n```csharp\ninternal\
  \ sealed class ThreadSharingData {\n    private volatile Int32 m_flag = 0;\n   \
  \ private        Int32 m_value = 0;\n\n    // 这个方法由一个线程执行\n    public void Thread1()\
  \ {\n        // 注意：将 1 写入 m_flag 之前，必须先将 5 写入 m_value\n        m_value = 5;\n  \
  \      m_flag = 1;\n    }\n\n    // 这个方法由另一个线程执行\n    public void Thread2() {\n\
  \        // 注意：m_value 必须在读取了 m_flag 之后读取\n        if (m_flag == 1)\n          \
  \  Console.WriteLine(m_value);\n    }\n}\n```\n\n一些开发人员(包括我)不喜欢 C# 的 **volatile**\
  \ 关键字，认为 C#语言就不该提供这个关键字。大多数算法都不需要对字段进行易变的读取或写入，大多数字段访问都可以按正常方式进行，这样能提高性能。要求对字段的所有访问都是易变的，这种情况极为少见。例如，很难解释如何将易变读取操作应用于下面这样的算法：\n\
  \n```csharp\nm_amount = m_amount + m_amount; // 假定 m_amount 是类中定义的一个 volatile 字段\n\
  ```\n\n通常，要倍增一个整数，只需将它的所有位都左移 1 位，许多编译器都能检测到上述代码的意图，并执行这个优化。如果 **m_amount** 是 **volatile**\
  \ 字段，就不允许执行这个优化。编译器必须生成代码将 **m_amount** 读入一个寄存器，再把它读入另一个寄存器，将两个寄存器加到一起，再将结果写回 **m_amount**\
  \ 字段。未优化的代码肯定会更大、更慢；如果它包含在一个循环中，更会成为一个大大的桎梏。\n\n另外，C#不支持以传引用的方式将 **volatile** 字段传给方法。例如，如果将\
  \ **m_amount** 定义成一个 **volatile Int32**，那么试图调用 **Int32** 类型的 **TryParse** 方法将导致编译器生成一条如下所示的警告信息：\n\
  \n```csharp\nBoolean success = Int32.TryParse(\"123\", out m_amount);\n// 上一行代码导致\
  \ C# 编译器生成以下警告信息：\n// CS0420：对 volatile 字段的引用不被视为 volatile\n```\n\n### 29.3.2 互锁构造\n\
  \n**Volatile** 的 **Read** 方法执行一次原子性的读取操作，**Write** 方法执行一次原子性的写入操作。也就是说，每个方法执行的是一次原子读取或者原子写入。本节将讨论静态\
  \ **System.Threading.Interlocked** 类提供的方法。**Interlocked** 类中的每个方法都执行一次原子读取以及写入操作。此外，**Interlocked**\
  \ 的所有方法都建立了完整的内存栅栏(memory fence)。换言之，调用某个 **Interlocked** 方法之前的任何变量写入都在这个 **Interlocked**\
  \ 方法调用之前执行；而这个调用之后的任何变量读取都在这个调用之后读取。\n\n对 **Int32** 变量进行操作的静态方法是目前最常用的方法，如下所示：\n\
  \n```csharp\npublic static class Interlocked {\n    // return (++location)\n}\n\
  ```\n\n```csharp\n} else {\n    // 在线程池线程上处理 I/O 完成，\n    // 在此添加自己的计算密集型算法...\n\
  \    result = task.Result.Length; // 本例只是返回长度\n}\n\n// 保存结果(exception/sum)，指出 1\
  \ 个操作完成\nm_servers[server] = result;\nm_ac.JustEnded();\n}\n\n// 调用这个方法指出结果已无关紧要\n\
  public void Cancel() { m_ac.Cancel(); }\n\n// 所有 Web 服务器都响应、调用了 Cancel 或者发生超时，就调用该方法\n\
  private void AllDone(CoordinationStatus status) {\n    switch (status) {\n     \
  \   case CoordinationStatus.Cancel:\n            Console.WriteLine(\"Operation canceled\"\
  );\n            break;\n\n        case CoordinationStatus.Timeout:\n           \
  \ Console.WriteLine(\"Operation timed-out\");\n            break;\n\n        case\
  \ CoordinationStatus.AllDone:\n            Console.WriteLine(\"Operation completed;\
  \ results below:\");\n            foreach (var server in m_servers) {\n        \
  \        Console.Write(\"{0} \", server.Key);\n                Object result = server.Value;\n\
  \                if (result is Exception) {\n                    Console.WriteLine(\"\
  failed due to {0}.\", result.GetType().Name);\n                } else {\n      \
  \              Console.WriteLine(\"returned {0:N0} bytes.\", result);\n        \
  \        }\n            }\n            break;\n    }\n}\n```\n\n可以看出，上述代码并没有直接使用\
  \ Interlocked 的任何方法，因为我将所有协调代码都放到可重用的 AsyncCoordinator 类中。该类会在以后详细解释。我想先说明一下这个类的作用。构造一个\
  \ MultiWebRequests 类时，会先初始化一个 AsyncCoordinator 和包含了一组服务器 URI(及其将来结果)的字典。然后，它以异步方式一个接一个地发出所有\
  \ Web 请求。为此，它首先调用 AsyncCoordinator 的 AboutToBegin 方法，向它传递要发出的请求数量。然后，它调用 HttpClient\
  \ 的 GetByteArrayAsync 来初始化请求。这会返回一个 Task，我随即在这个 Task 上调用 ContinueWith，确保在服务器有了响应之后，我的\
  \ ComputeResult 方法可通过许多线程池线程并发处理结果。对 Web 服务器的所有请求都发出之后，将调用 AsyncCoordinator 的 AllBegun\
  \ 方法，向它传递要在所有操作完成后执行的方法(AllDone)以及一个超时值。每收到一个 Web 服务器响应，线程池线程都会调用 MultiWebRequests\n\
  \n- ① 可改写代码，在 for 循环前调用一次 m_ac.AboutToBegin(m_requests.Count)，而不是每次循环迭代都调用 AboutToBegin。\n\
  \n这个类最重要的字段就是 **m_opCount** 字段，用于跟踪仍在进行的异步操作的数量。每个异步操作开始前都会调用 **AboutToBegin**。该方法调用\
  \ **Interlocked.Add**，以原子方式将传给它的数字加到 **m_opCount** 字段上。**m_opCount** 上的加法运算必须以原子方式进行，因为随着更多的操作开始，可能开始在线程池线程上处理\
  \ Web 服务器的响应。处理好 Web 服务器的响应后会调用 **JustEnded**。该方法调用 **Interlocked.Decrement**，以原子方式从\
  \ **m_opCount** 上减 1。无论哪一个线程恰好将 **m_opCount** 设为 0，都由它调用 **ReportStatus**。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_698_0.png)\n\
  \n> **注意**　**m_opCount** 字段初始化为 1（而非 0），这一点很重要。执行构造器方法的线程在发出 Web 服务请求期间，由于 **m_opCount**\
  \ 字段为 1，所以能保证 **AllDone** 不会被调用。构造器调用 **AllBegun** 之前，**m_opCount** 永远不可能变成 0。构造器调用\
  \ **AllBegun** 时，**AllBegun** 内部调用 **JustEnded** 来递减 **m_opCount**，所以事实上撤消（undo）了把它初始化成\
  \ 1 的效果。现在 **m_opCount** 能变成 0 了，但只能是在发起了所有 Web 服务请求之后。\n\n**ReportStatus** 方法对全部操作结束、发生超时和调用\
  \ **Cancel** 时可能发生的竞态条件进行仲裁。**ReportStatus** 必须确保其中只有一个条件胜出，确保 **m_callback** 方法只被调用一次。为了仲裁赢家，要调用\
  \ **Interlocked.Exchange** 方法，向它传递对 **m_statusReported** 字段的引用。这个字段实际是作为一个 **Boolean**\
  \ 变量使用的；但不能真的把它写成一个 **Boolean** 变量，因为没有任何 **Interlocked** 方法能接受 **Boolean** 变量。因此，我用一个\
  \ **Int32** 变量来代替，0 意味着 **false**，1 意味着 **true**。\n\n在 **ReportStatus** 内部，**Interlocked.Exchange**\
  \ 调用会将 **m_statusReported** 更改为 1。但只有做这个事情的第一个线程才会看到 **Interlocked.Exchange** 返回\
  \ 0，只有这个线程才能调用回调方法。调用 **Interlocked.Exchange** 的其他任何线程都会得到返回值 1，相当于告诉这些线程：回调方法已被调用，你不要再调用了。\n\
  \n#### 29.3.3 实现简单的自旋锁¹\n\n**Interlocked** 的方法很好用，但主要用于操作 **Int32** 值。如果需要原子性地操作类对象中的一组字段，又该怎么办呢？在这种情况下，需要采取一个方法阻止所有线程，只允许其中一个进入对字段进行操作的代码区域。可以使用\
  \ **Interlocked** 的方法构造一个线程同步块：\n\n```csharp\ninternal struct SimpleSpinLock {\n\
  \    private Int32 m_ResourceInUse; // 0=false（默认），1=true\n\n    public void Enter()\
  \ {\n        while (true) {\n            // 总是将资源设为“正在使用”（1），\n            // 只有从“未使用”变成“正在使用”才会返回\n\
  \            if (Interlocked.Exchange(ref m_ResourceInUse, 1) == 0) return;\n  \
  \          // 在这里添加“黑科技”...\n        }\n    }\n\n    public void Leave() {\n   \
  \     // 将资源标记为“未使用”\n        Volatile.Write(ref m_ResourceInUse, 0);\n    }\n}\n\
  ```\n\n下面这个类展示了如何使用 **SimpleSpinLock**：\n\n```csharp\npublic sealed class SomeResource\
  \ {\n    private SimpleSpinLock m_sl = new SimpleSpinLock();\n\n    public void\
  \ AccessResource() {\n        m_sl.Enter();\n        // 一次只有一个线程才能进入这里访问资源...\n\
  \        m_sl.Leave();\n    }\n}\n```\n\nSimpleSpinLock 的实现很简单。如果两个线程同时调用 Enter，那么\
  \ Interlocked.Exchange 会确保一个线程将 m_resourceInUse 从 0 变成 1，并发现 m_resourceInUse 为 0，然后这个线程从\
  \ Enter 返回，使它能继续执行 AccessResource 方法中的代码。另一个线程会将 m_resourceInUse 从 1 变成 1。由于不是从\
  \ 0 变成 1，所以会不停地调用 Exchange 进行“自旋”，直到第一个线程调用 Leave。\n\n第一个线程完成对 SomeResource 对象的字段的处理之后会调用\
  \ Leave。Leave 内部调用 Volatile.Write，将 m_resourceInUse 更改回 0。这造成正在“自旋”的线程能够将 m_resourceInUse\
  \ 从 0 变成 1，所以终于能从 Enter 返回，终于可以开始访问 SomeResource 对象的字段。\n\n这就是线程同步锁的一个简单实现。这种锁最大的问题在于，在存在对锁的竞争的前提下，会造成线程“自旋”。这个“自旋”会浪费宝贵的\
  \ CPU 时间，阻止 CPU 做其他更有用的工作。因此，自旋锁只应该用于保护那些会执行得非常快的代码区域。\n\n自旋锁一般不要在单 CPU 机器上使用，因为在这种机器上，一方面是希望获得锁的线程自旋，一方面是占有锁的线程不能快速释放锁。如果占有锁的线程的优先级低于想要获得锁的线程（自旋线程），局面还会变得更糟，因为占有锁的线程可能根本没机会运行。这会造成“活锁”情形。Windows\
  \ 有时会短时间地动态提升一个线程的优先级。因此，对于正在使用自旋锁的线程，应该禁止像这样的优先级提升：请参考 **System.Diagnostics.Process**\
  \ 和 **System.Diagnostics.ProcessThread** 的 **PriorityBoostEnabled** 属性。超线程机器同样存在自旋锁的问题。为了解决这些问题，许多自旋锁内部都有一些额外的逻辑；我将这些额外的逻辑称为“黑科技”(Black\
  \ Magic)。这里不打算过多讲解其中的细节，因为随着越来越多的人开始研究锁及其性能，这些逻辑也可能发生变化。但我可以告诉你的是：FCL 提供了一个名为 **System.Threading.SpinWait**\
  \ 的结构，它封装了人们关于这种“黑科技”的最新研究成果。\n\n- ① 从 0 变成 1 才返回（结束自旋），从 1 变成 1 不返回（继续自旋）。——译注\n\
  - ② 本节稍后会在正文中描述“黑科技”（Black Magic）。——译注\n- ③ Interlocked.Exchange 方法将一个存储位置设为指定值，并返回该存储位置的原始值。详情请参考文档。——译注\n\
  - ④ 活锁和死锁的区别请参见 29.2 节“基元用户模式和内核模式构造”。——译注\n\nFCL 还包含一个 **System.Threading.SpinLock**\
  \ 结构，它和前面展示的 **SimpleSpinLock** 类相似，只是使用了 **SpinWait** 结构来增强性能。**SpinLock** 结构还提供了超时支持。很有趣的一点是，我的\
  \ **SimpleSpinLock** 和 FCL 的 **SpinLock** 都是值类型。这意味着它们是轻量级的、内存友好的对象。例如，如果需要将一个锁同集合中的每一项关联，**SpinLock**\
  \ 就是很好的选择。但一定不要到处传递 **SpinLock** 实例，否则它们会被复制，而你会失去所有同步。虽然可以定义实例 **SpinLock** 字段，但不要将字段标记为\
  \ **readonly**，因为在操作锁的时候，它的内部状态必须改变。\n\n### 在线程处理中引入延迟\n\n“黑科技”旨在让希望获得资源的线程暂停执行，使当前拥有资源的线程能执行它的代码并让出资源。为此，**SpinWait**\
  \ 结构内部调用 **Thread** 的静态 **Sleep**，**Yield** 和 **SpinWait** 方法。在这里的补充内容中，我想简单解释一下这些方法。\n\
  \n线程可告诉系统它在指定时间内不想被调度。这是调用 **Thread** 的静态 **Sleep** 方法来实现的：\n\n```csharp\npublic\
  \ static void Sleep(Int32 millisecondsTimeout);\npublic static void Sleep(TimeSpan\
  \ timeout);\n```\n\n这个方法导致线程在指定时间内挂起。调用 **Sleep** 允许线程自愿放弃它的时间片的剩余部分。系统会使线程在大致指定的时间里不被调度。没有错——如果告诉系统你希望一个线程睡眠\
  \ 100 毫秒，那么会睡眠大致那么长的时间，但也有可能会多睡眠几秒、甚至几分钟的时间。记住，Windows 不是实时操作系统。你的线程可能在正确的时间唤醒，但具体是否这样，要取决于系统中正在发生的别的事情。\n\
  \n可以调用 **Sleep**，并为 **millisecondsTimeout** 参数传递 **System.Threading.Timeout.Infinite**\
  \ 中的值(定义为-1)。这告诉系统永远不调度线程，但这样做没什么意义。更好的做法是让线程退出，回收它的栈和内核对象。可以向 **Sleep** 传递 **0**，告诉系统调用线程放弃了它当前时间片的剩余部分，强迫系统调度另一个线程。但系统可能重新调度刚才调用了\
  \ **Sleep** 的线程(如果没有相同或更高优先级的其他可调度线程，就会发生这种情况)。\n\n线程可要求 Windows 在当前 CPU 上调度另一个线程，这是通过\
  \ **Thread** 的 **Yield** 方法来实现的：\n\n```csharp\npublic static Boolean Yield();\n\
  ```\n\n如果 **Windows** 发现有另一个线程准备好在当前处理器上运行，**Yield** 就会返回 **true**，调用 **Yield**\
  \ 的线程会提前结束它的时间片①，所选的线程得以运行一个时间片。然后，调用 **Yield** 的线程被再次调度，开始用一个全新的时间片运行。如果 **Windows**\
  \ 发现没有其他线程准备在当前处理器上运行，**Yield** 就会返回 **false**，调用 **Yield** 的线程继续运行它的时间片。\n\n**Yield**\
  \ 方法旨在使“就绪”状态的、具有相等或更低优先级的线程有机会运行。如果一个线程希望获得当前由另一个线程拥有的资源，就调用这个方法。如果运气好，**Windows**\
  \ 会调度当前拥有该资源的线程，而那个线程会让出资源。然后，当调用 **Yield** 的线程再次运行时就会拿到资源。\n\n调用 **Yield** 的效果介于调用\
  \ **Thread.Sleep(0)** 和 **Thread.Sleep(1)** 之间。**Thread.Sleep(0)** 不允许较低优先级的线程运行，而\
  \ **Thread.Sleep(1)** 总是强迫进行上下文切换，而由于内部系统计时器的解析度的问题，**Windows** 总是强迫线程睡眠超过 1 毫秒的时间。\n\
  \n事实上，超线程 CPU 一次只允许一个线程运行。所以，在这些 CPU 上执行“自旋”循环时，需要强迫当前线程暂停，使 CPU 有机会切换到另一个线程并允许它运行。线程可调用\
  \ **Thread** 的 **SpinWait** 方法强迫它自身暂停，允许超线程 CPU 切换到另一个线程。\n\n```csharp\npublic static\
  \ void SpinWait(Int32 iterations);\n```\n\n调用这个方法实际会执行一个特殊的 CPU 指令；它不告诉 **Windows**\
  \ 做任何事情（因为 **Windows** 已经认为它在 CPU 上调度了两个线程）。在非超线程 CPU 上，这个特殊 CPU 指令会被忽略。\n\n要更多地了解这些方法，请参见它们的\
  \ Win32 等价函数：**Sleep**、**SwitchToThread** 和 **YieldProcessor**。另外，要想进一步了解如何调整系统计时器的解析度，请参考\
  \ Win32 **timeBeginPeriod** 和 **timeEndPeriod** 函数。\n\n#### 29.3.4　Interlocked Anything\
  \ 模式\n\n许多人在查看 **Interlocked** 的方法时，都好奇 **Microsoft** 为什么不创建一组更丰富的 **Interlocked**\
  \ 方法，使它们适用于更广泛的情形。例如，如果 **Interlocked** 类能提供 **Multiple**、**Divide**、**Minimum**、**Maximum**、**And**、**Or**、**Xor**\
  \ 等方法，那么不是更好吗？虽然 **Interlocked** 类没有提供这些方法，但一个已知的模式允许使用 **Interlocked.CompareExchange**\
  \ 方法以\n\n- ① 这正是 yield 一词在当前上下文中的含义，即放弃或叫停；而不是文档中翻译的“生成”或“产生”。例如，文档将 “If this method\
  \ succeeds, the rest of the thread's current time slice is yielded.” 这句话翻译成“如果此方法成功，则生成该线程当前时间片的其余部分。”（参见\
  \ MSDN 的 **Thread.Yield** 方法）。我不得不说，“翻译记忆”害死人，因为它不区分上下文。相应地，C# 的 yield 关键字就确实有“生成”的意思。——译注\n\
  \n\n\n原子方式在一个 Int32 上执行任何操作。事实上，由于 **Interlocked.CompareExchange** 提供了其他重载版本，能操作\
  \ Int64、Single、Double、Object 和泛型引用类型，所以该模式适合所有这些类型。\n\n该模式类似于在修改数据库记录时使用的乐观并发模式[^1]。下例使用该模式创建一个原子\
  \ **Maximum** 方法。\n\n```csharp\npublic static Int32 Maximum(ref Int32 target, Int32\
  \ value) {\n    Int32 currentVal = target, startVal, desiredVal;\n\n    // 不要在循环中访问目标(target)，除非是想要改变它时一个线程也在动它\n\
  \    do {\n        // 记录这一次循环迭代的起始值(startVal)\n        startVal = currentVal;\n\n\
  \        // 基于 startVal 和 value 计算 desiredVal\n        desiredVal = Math.Max(startVal,\
  \ value);\n\n        // 注意：线程在这里可能被“抢占”，所以以下代码不是原子性的：\n        // if (target ==\
  \ startVal) target = desiredVal\n\n        // 而应该使用以下原子性的 CompareExchange 方法，它\n\
  \        // 返回 target 在(可能)被方法修改之前的值\n        currentVal = Interlocked.CompareExchange(ref\
  \ target, desiredVal, startVal);\n\n        // 如果 target 的值在这一次循环迭代中被其他线程改变，就重复\n\
  \    } while (startVal != currentVal);\n\n    // 在这个线程尝试设置它之前返回最大值\n    return desiredVal;\n\
  }\n```\n\n现在解释一下实际发生的事情。进入方法后，**currentVal** 被初始化为方法开始执行时的 **target** 值。然后，在循环内部，**startVal**\
  \ 被初始化为同一个值。可用 **startVal** 执行你希望的任何操作。这个操作可以非常复杂，可以包含成千上万行代码。但最终要得到一个结果，并将结果放到\
  \ **desiredVal** 中。本例判断 **startVal** 和 **value** 哪个最大。\n\n现在，当这个操作进行时，其他线程可能更改 **target**。虽然机率很小，但仍是有可能发生的。如果真的发生，**desiredVal**\
  \ 的值就是基于存储在 **startVal** 中的旧值而获得的，而非基于 **target** 的新值。这时就不应更改 **target**。我们用 **Interlocked.CompareExchange**\
  \ 方法确保在没有其他线程更改 **target** 的前提下将 **target** 的值更改为 **desiredVal**。该方法验证 **target**\n\
  \n值和 **startVal** 值匹配(**startVal** 代表操作开始前的 **target** 值)。如果 **target** 值没有改变，**CompareExchange**\
  \ 就把它更改为 **desiredVal** 中的新值。如果 **target** 的值被(另一个线程)改变了，**CompareExchange** 就不更改\
  \ **target**。\n\n**CompareExchange** 在调用的同时会返回 **target** 中的值[^2]，我将该值存储到 **currentVal**\
  \ 中。然后比较 **startVal** 和 **currentVal**。两个值相等，表明没有其他线程更改 **target**，**target** 现在包含\
  \ **desiredVal** 中的值，**while** 循环不再继续，方法返回。相反，如果 **startVal** 不等于 **currentVal**，表明有其他线程更改了\
  \ **target**，**target** 没有变成 **desiredVal** 中的值，所以 **while** 循环继续下一次迭代，再次尝试相同的操作，这一次用\
  \ **currentVal** 中的新值来反映其他线程的更改。\n\n我个人在自己的大量代码中用的都是这个模式。甚至专门写了一个泛型方法 **Morph**\
  \ 来封装这个模式：[^3]\n\n```csharp\ndelegate Int32 Morpher<TResult, TArgument>(Int32 startValue,\
  \ TArgument argument,\n    out TResult morphResult);\n\nstatic TResult Morph<TResult,\
  \ TArgument>(ref Int32 target, TArgument argument,\n    Morpher<TResult, TArgument>\
  \ morpher) {\n\n    TResult morphResult;\n    Int32 currentVal = target, startVal,\
  \ desiredVal;\n    do {\n        startVal = currentVal;\n        desiredVal = morpher(startVal,\
  \ argument, out morphResult);\n        currentVal = Interlocked.CompareExchange(ref\
  \ target, desiredVal, startVal);\n    } while (startVal != currentVal);\n    return\
  \ morphResult;\n}\n```\n\n### 29.4　内核模式构造\n\nWindows 提供了几个内核模式的构造来同步线程。内核模式的构造比用户模式的构造慢得多，一个原因是它们要求\
  \ Windows 操作系统自身的配合，另一个原因是在内核对象上调用的每个方法都造成调用线程从托管代码转换为本机(native)用户模式代码，再转换为本机(native)内核模式代码。然后，还要朝相反的方向一路返回。这些转换需要大量\
  \ CPU 时间；经常执行会对应用程序的总体性能造成负面影响。\n\n但内核模式的构造具备基元用户模式构造所不具备的优点。\n\n- 内核模式的构造检测到在一个资源上的竞争时，Windows\
  \ 会阻塞输掉的线程，使它不占着一个 CPU “自旋”（spinning），无谓地浪费处理器资源。\n- 内核模式的构造可实现本机(native)和托管(managed)线程相互之间的同步。\n\
  - 内核模式的构造可同步在同一台机器的不同进程中运行的线程。\n- 内核模式的构造可应用安全性设置，防止未经授权的帐户访问它们。\n- 线程可一直阻塞，直到集合中的所有内核模式构造都可用，或直到集合中的任何内核模式构造可用。\n\
  - 在内核模式的构造上阻塞的线程可指定超时值；指定时间内访问不到希望的资源，线程就可以解除阻塞并执行其他任务。\n\n事件和信号量是两种基元内核模式线程同步构造。至于其他内核模式构造，比如互斥体，则是在这两个基元构造上构建的。[^4]欲知\
  \ Windows 内核模式构造的详情，请参考我和 Christophe Nasarre 合著的《Windows 核心编程(第 5 版)》。\n\nSystem.Threading\
  \ 命名空间提供了一个名为 WaitHandle 的抽象基类。WaitHandle 类是一个很简单的类，它唯一的作用就是包装一个 Windows 内核对象句柄。FCL\
  \ 提供了几个从 WaitHandle 派生的类。所有类都在 System.Threading 命名空间中定义。类层次结构如下所示：\n\n```text\n\
  WaitHandle\n    EventWaitHandle\n        AutoResetEvent\n        ManualResetEvent\n\
  \    Semaphore\n    Mutex\n```\n\nWaitHandle 基类内部有一个 SafeWaitHandle 字段，它容纳了一个 Win32\
  \ 内核对象句柄。这个字段是在构造一个具体的 WaitHandle 派生类时初始化的。除此之外，WaitHandle 类公开了由所有派生类继承的方法。在一个内核模式的构造上调用的每个方法都代表一个完整的内存栅栏[^5]。下面是\
  \ WaitHandle 的一些有意思的公共方法(未列出某些方法的某些重载版本):\n\n```csharp\npublic abstract class WaitHandle\
  \ : MarshalByRefObject, IDisposable {\n    // WaitOne 内部调用 Win32 WaitForSingleObjectEx\
  \ 函数\n    public virtual Boolean WaitOne();\n    public virtual Boolean WaitOne(Int32\
  \ millisecondsTimeout);\n    public virtual Boolean WaitOne(TimeSpan timeout);\n\
  \n    // WaitAll 内部调用 Win32 WaitForMultipleObjectsEx 函数\n    public static Boolean\
  \ WaitAll(WaitHandle[] waitHandles);\n    public static Boolean WaitAll(WaitHandle[]\
  \ waitHandles, Int32 millisecondsTimeout);\n    public static Boolean WaitAll(WaitHandle[]\
  \ waitHandles, TimeSpan timeout);\n\n    // WaitAny 内部调用 Win32 WaitForMultipleObjectsEx\
  \ 函数\n    public static Int32 WaitAny(WaitHandle[] waitHandles);\n    public static\
  \ Int32 WaitAny(WaitHandle[] waitHandles, Int32 millisecondsTimeout);\n    public\
  \ static Int32 WaitAny(WaitHandle[] waitHandles, TimeSpan timeout);\n    public\
  \ const Int32 WaitTimeout = 258; // 超时就从 WaitAny 返回这个\n\n    // Dispose 内部调用 Win32\
  \ CloseHandle 函数 - 自己不要调用\n    public void Dispose();\n}\n```\n\n这些方法有几点需要注意。\n\n\
  - 可以调用 **WaitHandle** 的 **WaitOne** 方法让调用线程等待底层内核对象收到信号。这个方法在内部调用 Win32 **WaitForSingleObjectEx**\
  \ 函数。如果对象收到信号，返回的 **Boolean** 是 **true**；超时就返回 **false**。\n- 可以调用 **WaitHandle**\
  \ 的静态 **WaitAll** 方法，让调用线程等待 **WaitHandle[]** 中指定的所有内核对象都收到信号。如果所有对象都收到信号，返回的 **Boolean**\
  \ 是 **true**；超时则返回 **false**。这个方法在内部调用 Win32 **WaitForMultipleObjectsEx** 函数，为 **bWaitAll**\
  \ 参数传递 **TRUE**。\n- 可以调用 **WaitHandle** 的静态 **WaitAny** 方法让调用线程等待 **WaitHandle[]**\
  \ 中指定的任何内核对象收到信号。返回的 **Int32** 是与收到信号的内核对象对应的数组元素索引；如果在等待期间没有对象收到信号，则返回 **WaitHandle.WaitTimeout**。这个方法在内部调用\
  \ Win32 **WaitForMultipleObjectsEx** 函数，为 **bWaitAll** 参数传递 **FALSE**。\n- 在传给 **WaitAny**\
  \ 和 **WaitAll** 方法的数组中，包含的元素数不能超过 64 个，否则方法会抛出一个 **System.NotSupportedException**。\n\
  - 可以调用 **WaitHandle** 的 **Dispose** 方法来关闭底层内核对象句柄。这个方法在内部调用 Win32 **CloseHandle**\
  \ 函数。只有确定没有别的线程要使用内核对象才能显式调用 **Dispose**。你需要写代码并进行测试，这是一个巨大的负担。所以我强烈反对显式调用 **Dispose**；相反，让垃圾回收器（GC）去完成清理工作。GC\
  \ 知道什么时候没有线程使用对象，会自动进行清理。从某个角度看，GC 是在帮你进行线程同步！\n\n> **注意**　在某些情况下，当一个 COM 单线程套间[^6]线程阻塞时，线程可能在内部醒来以\
  \ pump 消息。例如，阻塞的线程会醒来处理发自另一个线程的 Windows 消息。这个设计是为了支持 COM 互操作性。对于大多数应用程序，这都不是一个问题——事实上，反而是一件好事。然而，如果你的代码在处理消息期间获得另一个线程同步锁，就可能发生死锁。如第\
  \ 30 章所述，所有混合锁都在内部调用这些方法。所以，使用混合锁存在相同的利与弊。\n\n不接受超时参数的那些版本的 **WaitOne** 和 **WaitAll**\
  \ 方法应返回 **void** 而不是 **Boolean**。原因是隐含的超时时间是无限长(**System.Threading.Timeout.Infinite**)，所以它们只会返回\
  \ **true**。调用任何这些方法时都不需要检查返回值。\n\n如前所述，**AutoResetEvent**、**ManualResetEvent**、**Semaphore**\
  \ 和 **Mutex** 类都派生自 **WaitHandle**，因此它们继承了 **WaitHandle** 的方法和行为。但这些类还引入了一些自己的方法，下面将进行解释。\n\
  \n首先，所有这些类的构造器都在内部调用 Win32 **CreateEvent**（为 **bManualReset** 参数传递 **FALSE** 或 **TRUE**）、**CreateSemaphore**\
  \ 或 **CreateMutex** 函数。从所有这些调用返回的句柄值都保存在 **WaitHandle** 基类内部定义的一个私有 **SafeWaitHandle**\
  \ 字段中。\n\n其次，**EventWaitHandle**、**Semaphore** 和 **Mutex** 类都提供了静态 **OpenExisting**\
  \ 方法，它们在内部调用 Win32 **OpenEvent**、**OpenSemaphore** 或 **OpenMutex** 函数，并传递一个 **String**\
  \ 实参（标识现有的一个具名内核对象）。所有函数返回的句柄值都保存在从 **OpenExisting** 方法返回的一个新构造的对象中。如果指定名称的内核对象不存在，就抛出一个\
  \ **WaitHandleCannotBeOpenedException** 异常。\n\n内核模式构造的一个常见用途是创建在任何时刻只允许它的一个实例运行的应用程序。这种单实例应用程序的例子包括\
  \ Microsoft Office Outlook、Windows Live Messenger、Windows Media Player 和 Windows\
  \ Media Center。下面展示了如何实现一个单实例应用程序：\n\n```csharp\nusing System;\nusing System.Threading;\n\
  \npublic static class Program {\n    public static void Main() {\n        Boolean\
  \ createdNew;\n\n        // 尝试创建一个具有指定名称的内核对象\n        using (new Semaphore(0, 1,\
  \ \"SomeUniqueStringIdentifyingMyApp\", out createdNew)) {\n            if (createdNew)\
  \ {\n                // 这个线程创建了内核对象，所以肯定没有这个应用程序\n                // 的其他实例正在运行。在这里运行应用程序的其余部分...\n\
  \            } else {\n                // 这个线程打开了一个具有相同字符串名称的、现有的内核对象；\n       \
  \         // 表明肯定正在运行这个应用程序的另一个实例。\n                // 这里没什么可以做的事情，所以从 Main 返回，终止应用程序\n\
  \                // 的这个额外的实例。\n            }\n        }\n    }\n}\n```\n\n上述代码使用的是\
  \ **Semaphore**，但换成 **EventWaitHandle** 或 **Mutex** 一样可以，因为我并没有真正使用对象提供的线程同步行为。但我利用了在创建任何种类的内核对象时由\
  \ Windows 内核提供的一些线程同步行为。下面解释一下代码是如何工作的。假定这个进程的两个实例同时启动。每个进程都有自己的线程，两个线程都尝试创建具有相同字符串名称（本例是\
  \ **\"SomeUniqueStringIdentifyingMyApp\"**）的一个 **Semaphore**。Windows 内核确保只有一个线程实际地创建具有指定名称的内核对象；创建对象的线程会将它的\
  \ **createdNew** 变量设为 **true**。\n\n[^1]: 乐观并发控制（又名“乐观锁”，Optimistic Concurrency Control，缩写“OCC”）是一种并发控制的方法。它假设多用户并发的事务在处理时不会彼此相互影响，各事务能够在不产生锁的情况下处理各自影响的部分数据。在提交数据更新之前，每个事务会先检查在该事务读取数据后，有没有其他事务又修改了该数据。如果其他事务有更新的话，正在提交的事务会进行回滚。乐观事务控制最早是由\
  \ H. T. Kung 教授提出。乐观并发控制多用于数据争用不大、冲突较少的环境中，这种环境中，偶尔回滚事务的成本会低于读取数据时锁定数据的成本，因此可以获得比其他并发控制方法更高的吞吐量。——维基百科\n\
  \n[^2]: 更准确地说，是返回 **target**(第 1 个参数)的原始值。**CompareExchange** 方法比较第 1 个和第 3 个参数，相等就将用第\
  \ 2 个参数的值替换第 1 个参数的值。与此同时，方法返回第 1 个参数的原始值。——译注\n\n[^3]: **Morph** 方法由于调用了 **morpher**\
  \ 回调方法，所以肯定会招致一定的性能惩罚。要想获得最佳性能，只能以内联或嵌入(inline)方式执行操作，就像 **Maximum** 的例子一样。\n\n\
  [^4]: 在文档中，semaphores 翻译成“信号量”，mutex 翻译成“互斥体”。本书采用了文档的译法。——译注\n\n[^5]: 之所以用栅栏这个词，是表明调用这个方法之前的任何变量写入都必须在这个方法调用之前发生；而这个调用之后的任何变量读取都必须在这个调用之后发生。——译注\n\
  \n[^6]: 套间(apartment)定义了一组对象的逻辑组合，这些对象共享同一组并发性和重入限制。一个线程要想使用 COM，必须先进入一个套间。COM 规定，只有运行在对象套间中的线程才能访问该对象。COM\
  \ 的两种套间分别是：STA(单线程套间)和 MTA(多线程套间)。——译注\n\n\n\n对于第二个线程，Windows 发现具有指定名称的内核对象已经存在了。因此，不允许第二个线程创建另一个同名的内核对象。不过，如果这个线程继续运行的话，它能访问和第一个进程的线程所访问的一样的内核对象。不同进程中的线程就是这样通过内核对象来通信的。但在本例中，第二个进程的线程看到它的\
  \ `createdNew` 变量设为 `false`，所以知道有进程的另一个实例正在运行，所以进程的第二个实例立即退出。\n\n#### 29.4.1 Event\
  \ 构造\n\n事件(event)其实只是由内核维护的 Boolean 变量。事件为 false，在事件上等待的线程就阻塞；事件为 true，就解除阻塞。有两种事件，即自动重置事件和手动重置事件。当一个自动重置事件为\
  \ true 时，它只唤醒一个阻塞的线程，因为在解除第一个线程的阻塞后，内核将事件自动重置回 false，造成其余线程继续阻塞。而当一个手动重置事件为 true\
  \ 时，它解除正在等待它的所有线程的阻塞，因为内核不将事件自动重置回 false；现在，你的代码必须将事件手动重置回 false。下面是与事件相关的类：\n\n\
  ```csharp\npublic class EventWaitHandle : WaitHandle {\n    public Boolean Set();\
  \       // 将 Boolean 设为 true；总是返回 true\n    public Boolean Reset();     // 将 Boolean\
  \ 设为 false；总是返回 true\n}\n\npublic sealed class AutoResetEvent : EventWaitHandle\
  \ {\n    public AutoResetEvent(Boolean initialState);\n}\n\npublic sealed class\
  \ ManualResetEvent : EventWaitHandle {\n    public ManualResetEvent(Boolean initialState);\n\
  }\n```\n\n可用自动重置事件轻松创建线程同步锁，它的行为和前面展示的 SimpleSpinLock 类似：\n\n```csharp\ninternal\
  \ sealed class SimpleWaitLock : IDisposable {\n    private readonly AutoResetEvent\
  \ m_available;\n\n    public SimpleWaitLock() {\n        m_available = new AutoResetEvent(true);\
  \ // 最开始可自由使用\n    }\n\n    public void Enter() {\n        // 在内核中阻塞①，直到资源可用\n \
  \       m_available.WaitOne();\n    }\n\n    public void Leave() {\n        // 让另一个线程访问资源\n\
  \        m_available.Set();\n    }\n\n    public void Dispose() { m_available.Dispose();\
  \ }\n}\n```\n\n① 正是因为发生竞争时，没有竞争赢的线程会阻塞，所以这种方式能最有效地节省资源。——译注\n\n可采取和使用 SimpleSpinLock\
  \ 时完全一样的方式使用这个 SimpleWaitLock。事实上，外部行为是完全相同的；不过，两个锁的性能截然不同。锁上面没有竞争的时候，SimpleWaitLock\
  \ 比 SimpleSpinLock 慢得多，因为对 SimpleWaitLock 的 Enter 和 Leave 方法的每一个调用都强迫调用线程从托管代码转换为内核代码，再转换回来——这是不好的地方。但在存在竞争的时候，输掉的线程会被内核阻塞，不会在那里“自旋”，从而浪费\
  \ CPU 时间——这是好的地方。还要注意，构造 **AutoResetEvent** 对象并在它上面调用 **Dispose** 也会造成从托管向内核的转换，对性能造成负面影响。这些调用一般很少发生，所以一般不必过于关心它们。\n\
  \n为了更好地理解性能上的差异，我写了一些代码：\n\n```csharp\npublic static void Main() {\n    Int32 x\
  \ = 0;\n    const Int32 iterations = 10000000;  // 1000 万\n\n    // x 递增1000万次，要花多长时间？\n\
  \    Stopwatch sw = Stopwatch.StartNew();\n    for (Int32 i = 0; i < iterations;\
  \ i++) {\n        x++;\n    }\n    Console.WriteLine(\"Incrementing x: {0:N0}\"\
  , sw.ElapsedMilliseconds);\n\n    // x 递增1000万次，加上调用一个什么都不做的方法的开销，要花多长时间？\n    sw.Restart();\n\
  \    for (Int32 i = 0; i < iterations; i++) {\n        M(); x++; M();\n    }\n \
  \   Console.WriteLine(\"Incrementing x in M: {0:N0}\", sw.ElapsedMilliseconds);\n\
  \n    // x 递增1000万次，加上调用一个无竞争的 SpinLock 的开销，要花多长时间？\n    SpinLock sl = new SpinLock(false);\n\
  \    sw.Restart();\n    for (Int32 i = 0; i < iterations; i++) {\n        Boolean\
  \ taken = false; sl.Enter(ref taken); x++; sl.Exit();\n    }\n    Console.WriteLine(\"\
  Incrementing x in SpinLock: {0:N0}\", sw.ElapsedMilliseconds);\n\n    // x 递增1000万次，加上调用一个无竞争的\
  \ SimpleWaitLock 的开销，要花多长时间？\n    using (SimpleWaitLock swl = new SimpleWaitLock())\
  \ {\n        sw.Restart();\n        for (Int32 i = 0; i < iterations; i++) {\n \
  \           swl.Enter(); x++; swl.Leave();\n        }\n        Console.WriteLine(\"\
  Incrementing x in SimpleWaitLock: {0:N0}\", sw.ElapsedMilliseconds);\n    }\n}\n\
  \n[MethodImpl(MethodImplOptions.NoInlining)]\nprivate static void M() { /* 这个方法什么都不做，直接返回\
  \ */ }\n```\n\n在我的机器上运行上述代码，得到以下输出：\n\n```\nIncrementing x: 8                  \
  \            最快\nIncrementing x in M: 69                        约慢 9 倍\nIncrementing\
  \ x in SpinLock: 164                约慢 21 倍\nIncrementing x in SimpleWaitLock: 8854\
  \          约慢 1107 倍\n```\n\n由此可以看到，单纯递增 x 只需 8 毫秒。递增前后多调用一个方法，就要多花约 9 倍的时间。然后，在用户模式的构造中执行递增，代码变慢了\
  \ 21 倍(164 / 8)。最后，如果使用内核模式的构造，程序更是慢得可怕，慢了大约 1107 倍(8854 / 8)！所以，线程同步能避免就尽量避免。如果一定要进行线程同步，就尽量使用用户模式的构造。内核模式的构造要尽量避免。\n\
  \n#### 29.4.2 Semaphore 构造\n\n信号量(semaphore)其实就是由内核维护的 Int32 变量。信号量为 0 时，在信号量上等待的线程会阻塞；信号量大于\
  \ 0 时解除阻塞。在信号量上等待的线程解除阻塞时，内核自动从信号量的计数中减 1。信号量还关联了一个最大 Int32 值，当前计数绝不允许超过最大计数。下面展示了\
  \ Semaphore 类的样子：\n\n```csharp\npublic sealed class Semaphore : WaitHandle {\n \
  \   public Semaphore(Int32 initialCount, Int32 maximumCount);\n    public Int32\
  \ Release(); // 调用 Release()；返回一个计数\n    public Int32 Release(Int32 releaseCount);\
  \ // 返回上一个计数\n}\n```\n\n下面总结一下这三种内核模式基元的行为。\n\n- 多个线程在一个自动重置事件上等待时，设置事件只导致一个线程被解除阻塞。\n\
  - 多个线程在一个手动重置事件上等待时，设置事件导致所有线程被解除阻塞。\n- 多个线程在一个信号量上等待时，释放信号量导致 releaseCount 个线程被解除阻塞（releaseCount\
  \ 是传给 Semaphore 的 Release 方法的实参）。\n\n因此，自动重置事件在行为上和最大计数为 1 的信号量非常相似。两者的区别在于，可以在一个自动重置事件上连续多次调用\
  \ Set，同时仍然只有一个线程解除阻塞。相反，在一个信号量上连续多次调用 Release，会使它的内部计数一直递增，这可能解除大量线程的阻塞。顺便说一句，如果在一个信号量上多次调用\
  \ Release，会导致它的计数超过最大计数，这时 Release 会抛出一个 SemaphoreFullException。\n\n可像下面这样用信号量重新实现\
  \ SimpleWaitLock，允许多个线程并发访问一个资源(如果所有线程以只读方式访问资源，就是安全的)：\n\n```csharp\npublic sealed\
  \ class SimpleWaitLock : IDisposable {\n    private Semaphore m_available;\n\n \
  \   public SimpleWaitLock(Int32 maxConcurrent) {\n        m_available = new Semaphore(maxConcurrent,\
  \ maxConcurrent);\n    }\n\n    public void Enter() {\n        // 在内核中阻塞直到资源可用\n\
  \        m_available.WaitOne();\n    }\n\n    public void Leave() {\n        //\
  \ 让其他线程访问资源\n        m_available.Release(1);\n    }\n\n    public void Dispose()\
  \ { m_available.Close(); }\n}\n```\n\n#### 29.4.3 Mutex 构造\n\n互斥体(mutex)代表一个互斥的锁。它的工作方式和\
  \ **AutoResetEvent**(或者计数为 1 的 **Semaphore**) 相似，三者都是一次只释放一个正在等待的线程。下面展示了 **Mutex**\
  \ 类的样子：\n\n```csharp\npublic sealed class Mutex : WaitHandle {\n    public Mutex();\n\
  \    public void ReleaseMutex();\n}\n```\n\n互斥体有一些额外的逻辑，这造成它们比其他构造更复杂。首先，**Mutex**\
  \ 对象会查询调用线程的 **Int32 ID**，记录是哪个线程获得了它。一个线程调用 **ReleaseMutex** 时，**Mutex** 确保调用线程就是获取\
  \ **Mutex** 的那个线程。如若不然，**Mutex** 对象的状态就不会改变，而 **ReleaseMutex** 会抛出一个 **System.ApplicationException**。另外，拥有\
  \ **Mutex** 的线程因为任何原因而终止，在 **Mutex** 上等待的某个线程会因为抛出 **System.Threading.AbandonedMutexException**\
  \ 异常而被唤醒。该异常通常会成为未处理的异常，从而终止整个进程。这是好事，因为线程在获取了一个 **Mutex** 之后，可能在更新完 **Mutex** 所保护的数据之前终止。如果其他线程捕捉了\
  \ **AbandonedMutexException**，就可能试图访问损坏的数据，造成无法预料的结果和安全隐患。\n\n其次，**Mutex** 对象维护着一个递归计数(recursion\
  \ count)，指出拥有该 **Mutex** 的线程拥有了它多少次。如果一个线程当前拥有一个 **Mutex**，而后该线程再次在 **Mutex** 上等待，计数就会递增，这个线程允许继续运行。线程调用\
  \ **ReleaseMutex** 将导致计数递减。只有计数变成 0，另一个线程才能成为该 **Mutex** 的所有者。\n\n大多数人都不喜欢这个额外的逻辑。这些“功能”是有代价的。**Mutex**\
  \ 对象需要更多的内存来容纳额外的线程 ID 和计数信息。更要紧的是，**Mutex** 代码必须维护这些信息，使锁变得更慢。如果应用程序需要(或希望)这些额外的功能，那么应用程序的代码可以自己实现；代码不一定要放到\
  \ **Mutex** 对象中。因此，许多人都会避免使用 **Mutex** 对象。\n\n通常，当一个方法获取了一个锁，然后调用也需要锁的另一个方法，就需要一个递归锁。如下代码所示：\n\
  \n```csharp\ninternal class SomeClass : IDisposable {\n    private readonly Mutex\
  \ m_lock = new Mutex();\n\n    public void Method1() {\n        m_lock.WaitOne();\n\
  \        // 随便做什么事情...\n        Method2(); // Method2 递归地获取锁\n        m_lock.ReleaseMutex();\n\
  \    }\n\n    public void Method2() {\n        m_lock.WaitOne();\n        // 随便做什么事情...\n\
  \        m_lock.ReleaseMutex();\n    }\n\n    public void Dispose() { m_lock.Dispose();\
  \ }\n}\n```\n\n在上述代码中，使用一个 **SomeClass** 对象的代码可以调用 **Method1**，它获取 **Mutex**，执行一些线程安全的操作，然后调用\
  \ **Method2**，它也执行一些线程安全的操作。由于 **Mutex** 对象支持递归，所以线程会获取两次锁，然后释放它两次。在此之后，另一个线程才能拥有这个\
  \ **Mutex**。如果 **SomeClass** 使用一个 **AutoResetEvent** 而不是 **Mutex**，线程在调用 **Method2**\
  \ 的 **WaitOne** 方法时会阻塞。\n\n如果需要递归锁，可以使用一个 **AutoResetEvent** 来简单地创建一个：\n\n```csharp\n\
  internal sealed class RecursiveAutoResetEvent : IDisposable {\n    private AutoResetEvent\
  \ m_lock = new AutoResetEvent(true);\n    private Int32 m_owningThreadId = 0;\n\
  \    private Int32 m_recursionCount = 0;\n\n    public void Enter() {\n        //\
  \ 获取调用线程的唯一 Int32 ID\n        Int32 currentThreadId = Thread.CurrentThread.ManagedThreadId;\n\
  \n        // 如果调用线程拥有锁，就递增递归计数\n        if (m_owningThreadId == currentThreadId)\
  \ {\n            m_recursionCount++;\n            return;\n        }\n\n       \
  \ // 调用线程不拥有锁，等待它\n        m_lock.WaitOne();\n\n        // 调用线程现在拥有了锁，初始化拥有线程的 ID\
  \ 和递归计数\n        m_owningThreadId = currentThreadId;\n        m_recursionCount =\
  \ 1;\n    }\n\n    public void Leave() {\n        // 如果调用线程不拥有锁，就出错了\n        if\
  \ (m_owningThreadId != Thread.CurrentThread.ManagedThreadId)\n            throw\
  \ new InvalidOperationException();\n\n        // 从递归计数中减1\n        if (--m_recursionCount\
  \ == 0) {\n            // 如果递归计数为 0，表明没有线程拥有锁\n            m_owningThreadId = 0;\n\
  \            m_lock.Set(); // 唤醒一个正在等待的线程(如果有的话)\n        }\n    }\n\n    public\
  \ void Dispose() { m_lock.Dispose(); }\n}\n```\n\n虽然 **RecursiveAutoResetEvent**\
  \ 类的行为和 **Mutex** 类完全一样，但在一个线程试图递归地获取锁时，它的性能会好得多，因为现在跟踪线程所有权和递归的都是托管代码。只有在第一次获取\
  \ **AutoResetEvent**，或者最后把它放弃给其他线程时，线程才需要从托管代码转换为内核代码。\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_713_0.png)\n"
- "## 第 30 章　混合线程同步构造\n\n**本章内容：**\n\n- 一个简单的混合锁\n- 自旋、线程所有权和递归\n- FCL 中的混合构造\n- 著名的双检锁技术\n\
  - 条件变量模式\n- 异步的同步构造\n- 并发集合类\n\n第 29 章“基元线程同步构造”讨论了基元用户模式和内核模式线程同步构造。其他所有线程同步构造都基于它们而构建，而且一般都合并了用户模式和内核模式构造，我们称为混合线程同步构造。没有线程竞争时，混合构造提供了基元用户模式构造所具有的性能优势。多个线程竞争一个构造时，混合构造通过基元内核模式的构造来提供不“自旋”的优势（避免浪费\
  \ CPU 时间）。由于大多数应用程序的线程都很少同时竞争一个构造，所以性能上的增强可以使你的应用程序表现得更出色。\n\n本章首先展示了如何基于各种基元构造来构建混合构造。然后展示了\
  \ FCL 自带的许多混合构造，描述了它们的行为，并介绍了如何正确使用它们。我还提到了一些我自己创建的构造，它们通过 Wintellect 的 Power Threading\
  \ 库免费提供给大家使用，请从 http://wintellect.com/Resource-Power-Collections-Library 下载。\n\n\
  本章末尾展示了如何使用 FCL 的并发集合类来取代混合构造，从而最小化资源使用并提升性能。最后讨论了异步的同步构造，允许以同步方式访问资源，同时不造成任何线程的阻塞，从而减少了资源消耗，并提高了伸缩性。\n\
  \n### 30.1　一个简单的混合锁\n\n言归正传，下面是一个混合线程同步锁的例子：\n\n```csharp\ninternal sealed class\
  \ SimpleHybridLock : IDisposable {\n    // Int32 由基元用户模式构造（Interlocked 的方法）使用\n\
  \    private Int32 m_waiters = 0;\n\n    // AutoResetEvent 是基元内核模式构造\n    private\
  \ AutoResetEvent m_waiterLock = new AutoResetEvent(false);\n\n    public void Enter()\
  \ {\n        // 指出这个线程想要获得锁\n        if (Interlocked.Increment(ref m_waiters) ==\
  \ 1)\n            return; // 锁可自由使用，无竞争，直接返回\n\n        // 另一个线程拥有锁（发生竞争），使这个线程等待\n\
  \        m_waiterLock.WaitOne(); // 这里产生较大的性能影响\n        // WaitOne 返回后，这个线程拿到锁了\n\
  \    }\n\n    public void Leave() {\n        // 这个线程准备释放锁\n        if (Interlocked.Decrement(ref\
  \ m_waiters) == 0)\n            return; // 没有其他线程正在等待，直接返回\n\n        // 有其他线程正在阻塞，唤醒其中一个\n\
  \        m_waiterLock.Set(); // 这里产生较大的性能影响\n    }\n\n    public void Dispose()\
  \ { m_waiterLock.Dispose(); }\n}\n```\n\nSimpleHybridLock 包含两个字段：一个 Int32，由基元用户模式的构造来操作；以及一个\
  \ AutoResetEvent，它是一个基元内核模式的构造。为了获得出色的性能，锁要尽量操作 Int32，尽量少操作 AutoResetEvent。每次构造\
  \ SimpleHybridLock 对象就会创建 AutoResetEvent；和 Int32 字段相比，它对性能的影响大得多。本章以后会展示混合构造 AutoResetEventSlim：多个线程同时访问锁时，只有在第一次检测到竞争时才会创建\
  \ AutoResetEvent，这样就避免了性能损失。Dispose 方法关闭 AutoResetEvent，这也会对性能造成大的影响。\n\nSimpleHybridLock\
  \ 对象在构造和 dispose 时的性能能提升当然很好，但我们应该将更多精力放在它的 Enter 和 Leave 方法的性能上，因为在对象生存期内，这两个方法要被大量地调用。下面让我们重点关注这些方法。\n\
  \n调用 Enter 的第一个线程造成 Interlocked.Increment 在 m_waiters 字段上加 1，使它的值变成 1。这个线程发现以前有零个线程正在等待这个锁，所以线程从它的\
  \ Enter 调用中返回。值得欣赏的是，线程获得锁的速度非常快。现在，如果另一个线程介入并调用 Enter，这个线程将 m_waiters 增加到 2，发现锁在另一个线程那里。所以，这个线程会使用\
  \ AutoResetEvent 对象来调用 WaitOne，从而阻塞自身，调用 WaitOne 造成线程的代码转变成内核模式的代码，这会对性能产生巨大的影响。但线程反正都要停止运行，所以让线程花点时间来完全停止，似乎也不是太坏。好消息是，线程现在会阻塞，不会因为在\
  \ CPU 上“自旋”而浪费 CPU 时间。(29.3.3 节“实现简单的自旋锁”引入的 SimpleSpinLock 的 Enter 方法就会这样“自旋”。)\n\
  \n再来看看 Leave 方法。一个线程调用 Leave 时，会调用 Interlocked.Decrement 从 m_waiters 字段减 1。如果 m_waiters\
  \ 现在是 0，表明没有其他线程在调用 Enter 时发生阻塞，调用 Leave 的线程可以直接返回。同样地，想象一下这有多快：离开一个锁意味着线程从一个 Int32\
  \ 中减 1，执行快速的 if 测试，然后返回！另一方面，如果调用 Leave 的线程发现 m_waiters 不为 0，线程就知道现在存在一个竞争，另外至少有一个线程在内核中阻塞。这个线程必须唤醒一个(而且只能是一个)阻塞的线程。唤醒线程是通过在\
  \ AutoResetEvent 上调用 Set 来实现的。这会造成性能上的损失，因为线程必须转换成内核模式代码，再转换回来。但这个转换只有在发生竞争时才会发生。当然，AutoResetEvent\
  \ 确保只有一个阻塞的线程被唤醒；在 AutoResetEvent 上阻塞的其他所有线程会继续阻塞，直到新的、解除了阻塞的线程最终调用 Leave。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_715_0.png)\n\
  \n> **注意**　在实际应用中，任何线程可以在任何时间调用 Leave，因为 Enter 方法没有记录哪一个线程成功获得了锁。很容易添加字段和代码来维护这种信息，但会增大锁对象自身需要的内存，并损害\
  \ Enter 和 Leave 方法的性能，因为它们现在必须操作这个字段。我情愿有一个性能高超的锁，并确保我的代码以正确方式使用它。你会注意到，事件和信号量都没有维护这种信息，只有互斥体才有维护。\n\
  \n### 30.2 自旋、线程所有权和递归\n\n由于转换为内核模式会造成巨大的性能损失，而且线程占有锁的时间通常都很短，所以为了提升应用程序的总体性能，可以让一个线程在用户模式中“自旋”一小段时间，再让线程转换为内核模式。如果线程正在等待的锁在线程“自旋”期间变得可用，就能避免向内核模式的转换了。\n\
  \n此外，有的锁限制只能由获得锁的线程释放锁。有的锁允许当前拥有它的线程递归地拥有锁(多次拥有)，Mutex 锁就是这样的一个例子。①可通过一些别致的逻辑构建支持自旋、线程所有权和递归的一个混合锁，如下所示：\n\
  \n```csharp\ninternal sealed class AnotherHybridLock : IDisposable {\n    // Int32\
  \ 想基于用户模式构造(Interlocked 的方法)使用\n    private Int32 m_waiters = 0;\n\n    // AutoResetEvent\
  \ 是基元内核模式构造\n    private AutoResetEvent m_waiterLock = new AutoResetEvent(false);\n\
  \n    // 这个字段控制自旋，希望能提升性能\n    private Int32 m_spinCount = 4000; // 随便选择的一个计数\n\n\
  \    // 这些字段指出哪个线程拥有锁，以及拥有了它多少次\n    private Int32 m_owningThreadId = 0, m_recursion\
  \ = 0;\n\n    public void Enter() {\n        // 如果调用线程已经拥有锁，递增递归计数并返回\n        Int32\
  \ threadId = Thread.CurrentThread.ManagedThreadId;\n        if (threadId == m_owningThreadId)\
  \ { m_recursion++; return; }\n\n        // 调用线程不拥有锁，尝试获取它\n        SpinWait spinwait\
  \ = new SpinWait();\n\n        for (Int32 spinCount = 0; spinCount < m_spinCount;\
  \ spinCount++) {\n            // 如果锁可以自由使用了，这个线程就获得它：设置一些状态并返回\n            if (Interlocked.CompareExchange(ref\
  \ m_waiters, 1, 0) == 0) goto GotLock;\n\n            // 黑科技：给其他线程运行的机会，希望锁会被释放\n\
  \            spinWait.SpinOnce();\n        }\n\n        // 自旋结束，锁仍未获得，再试一次\n   \
  \     if (Interlocked.Increment(ref m_waiters) > 1) {\n            // 仍然是竞争条件，这个线程必须阻塞\n\
  \            m_waiterLock.WaitOne(); // 等待锁；性能有损失\n            // 等这个线程醒来时，它拥有锁；设置一些状态并返回\n\
  \        }\n\n    GotLock:\n        // 一个线程获得锁时，我们记录它的 ID，并\n        // 指出线程拥有锁一次\n\
  \        m_owningThreadId = threadId; m_recursion = 1;\n    }\n\n    public void\
  \ Leave() {\n        // 如果调用线程不拥有锁，表明存在 bug\n        Int32 threadId = Thread.CurrentThread.ManagedThreadId;\n\
  \        if (threadId != m_owningThreadId)\n            throw new SynchronizationLockException(\"\
  Lock not owned by calling thread\");\n\n        // 递减递归计数。如果这个线程仍然拥有锁，那么直接返回\n \
  \       if (--m_recursion > 0) return;\n\n        m_owningThreadId = 0; // 现在没有线程拥有锁\n\
  \n        // 如果没有其他线程在等待，直接返回\n        if (Interlocked.Decrement(ref m_waiters)\
  \ == 0)\n            return;\n\n        // 有其他线程正在等待，唤醒其中 1 个\n        m_waiterLock.Set();\
  \ // 这里有较大的性能损失\n    }\n\n    public void Dispose() { m_waiterLock.Dispose(); }\n\
  }\n```\n\n> ① 线程在 Mutex 对象上等待时不会“自旋”，因为 Mutex 的代码在内核中。这意味着线程必须转换成内核模式才能检查 Mutex\
  \ 的状态。\n\n可以看出，为锁添加了额外的行为之后，会增大它拥有的字段数量，进而增大内存消耗。代码还变得更复杂了，而且这些代码必须执行，造成锁的性能的下降。29.4.1\
  \ 节“Event 构造”比较了在各种情况下对一个 Int32 进行递增的性能，这些情况分别是：无任何锁，使用基元用户模式构造，以及使用内核模式构造。这里重复了那些性能测试的结果，并添加了使用\
  \ SimpleHybridLock 和 AnotherHybridLock 的结果。结果从快到慢依次是：\n\n| 测试 | 性能比较 |\n|---|---|\n\
  | Incrementing x: 8 | 最快 |\n| Incrementing x in M: 69 | 约慢 9 倍 |\n| Incrementing\
  \ x in SpinLock: 164 | 约慢 21 倍 |\n| Incrementing x in SimpleHybridLock: 164 | 约慢\
  \ 21 倍（类似于 SpinLock） |\n| Incrementing x in AnotherHybridLock: 230 | 约慢 29 倍（因为所有权/递归）\
  \ |\n| Incrementing x in SimpleWaitLock: 8854 | 约慢 1107 倍 |\n\n注意，AnotherHybridLock\
  \ 的性能不如 SimpleHybridLock。这是因为需要额外的逻辑和错误检查来管理线程所有权和递归行为。如你所见，在锁中添加的每一个行为都会影响它的性能。\n\
  \n### 30.3 FCL 中的混合构造\n\nFCL 自带了许多混合构造，它们通过一些别致的逻辑将你的线程保持在用户模式，从而增强应用程序的性能。有的混合构造直到首次有线程在一个构造上发生竞争时，才会创建内核模式的构造。如果线程一直不在构造上发生竞争，应用程序就可避免因为创建对象而产生的性能损失，同时避免为对象分配内存。许多构造还支持使用一个\
  \ CancellationToken(参见第 27 章“计算限制的异步操作”)，使一个线程强迫解除可能正在构造上等待的其他线程的阻塞。本节将向你介绍这些混合构造。\n\
  \n#### 30.3.1 ManualResetEventSlim 类和 SemaphoreSlim 类\n\n先来看看 System.Threading.ManualResetEventSlim\
  \ 和 System.Threading.SemaphoreSlim 这两个类。①这两个构造的工作方式和对应的内核模式构造完全一致，只是它们都在用户模式中“自旋”，而且都推迟到发生第一次竞争时，才创建内核模式的构造。它们的\
  \ Wait 方法允许传递一个超时值和一个 CancellationToken。下面展示了这些类(未列出部分方法的重载版本):\n\n```csharp\npublic\
  \ class ManualResetEventSlim : IDisposable {\n    public ManualResetEventSlim(Boolean\
  \ initialState, Int32 spinCount);\n    public void Dispose();\n    public void Reset();\n\
  \    public void Set();\n    public Boolean Wait(Int32 millisecondsTimeout, CancellationToken\
  \ cancellationToken);\n\n    public Boolean IsSet { get; }\n    public Int32 SpinCount\
  \ { get; }\n    public WaitHandle WaitHandle { get; }\n}\npublic class SemaphoreSlim\
  \ : IDisposable {\n    public SemaphoreSlim(Int32 initialCount, Int32 maxCount);\n\
  \    public void Dispose();\n    public Int32 Release(Int32 releaseCount);\n   \
  \ public Boolean Wait(Int32 millisecondsTimeout, CancellationToken cancellationToken);\n\
  \n    // 该特殊方法用于 async 和 await(参见第 28 章)\n    public Task<Boolean> WaitAsync(Int32\
  \ millisecondsTimeout, CancellationToken\n        cancellationToken);\n\n    public\
  \ Int32 CurrentCount { get; }\n    public WaitHandle AvailableWaitHandle { get;\
  \ }\n}\n```\n\n#### 30.3.2 Monitor 类和同步块\n\n或许最常用的混合型线程同步构造就是 Monitor 类，它提供了支持自旋、线程所有权和递归的互斥锁。之所以最常用，是因为它资格最老，C#有内建的关键字支持它，JIT\
  \ 编译器对它知之甚详，而且 CLR 自己也在代表你的应用程序使用它。但正如稍后就要讲到的那样，这个构造存在许多问题，用它很容易造成代码中出现 bug。我先解释这个构造，然后指出问题以及解决问题的方式。\n\
  \n堆中的每个对象都可关联一个名为同步块的数据结构。同步块包含字段，这些字段和本章前面展示的 AnotherHybridLock 类的字段相似。具体地说，它为内核对象、拥有线程(owning\
  \ thread)的 ID、递归计数(recursion count)以及等待线程(waiting thread)计数提供了相应的字段。Monitor 是静态类，它的方法接受对任何堆对象的引用。这些方法对指定对象的同步块中的字段进行操作。以下是\
  \ Monitor 类最常用的方法：\n\n```csharp\npublic static class Monitor {\n    public static\
  \ void Enter(Object obj);\n    public static void Exit(Object obj);\n\n    // 还可指定尝试进入锁时的超时值（不常用）：\n\
  \    public static Boolean TryEnter(Object obj, Int32 millisecondsTimeout);\n\n\
  \    // 稍后会讨论 lockTaken 实参\n    public static void Enter(Object obj, ref Boolean\
  \ lockTaken);\n    public static void TryEnter(Object obj, Int32 millisecondsTimeout,\n\
  \        ref Boolean lockTaken);\n}\n```\n\n显然，为堆中每个对象都关联一个同步块数据结构显得很浪费，尤其是考虑到大多数对象的同步块都从不使用。为节省内存，CLR\
  \ 团队采用一种更经济的方式提供刚才描述的功能。它的工作原理是：CLR 初始化时在堆中分配一个同步块数组。本书第 4 章说过，每当一个对象在堆中创建的时候，都有两个额外的开销字段与它关联。第一个是“类型对象指针”，包含类型的“类型对象”的内存地址。第二个是“同步块索引”，包含同步块数组中的一个整数索引。\n\
  \n一个对象在构造时，它的同步块索引初始化为 -1，表明不引用任何同步块。然后，调用 Monitor.Enter 时，CLR 在数组中找到一个空白同步块，并设置对象的同步块索引，让它引用该同步块。换言之，同步块和对象是动态关联的。调用\
  \ Exit 时，会检查是否有其他任何线程正在等待使用对象的同步块。如果没有线程在等待它，同步块就自由了，Exit 将对象的同步块索引设回 -1，自由的同步块将来可以和另一个对象关联。\n\
  \n图 30-1 展示了堆中的对象、它们的同步块索引以及 CLR 的同步块数组元素之间的关系。Object-A、Object-B 和 Object-C 都将它们的类型对象指针成员设为引用\
  \ Type-T（一个类型对象）。这意味着三个对象全都具有相同的类型。如第 4 章所述，类型对象本身也是堆中的一个对象。和其他所有对象一样，类型对象有两个开销成员：同步块索引和类型对象指针。这意味着同步块可以和类型对象关联，而且可以将一个类型对象引用传给\
  \ Monitor 的方法。顺便说一句，如有必要，同步块数组能创建更多的同步块。所以，同时同步大量对象时，不必担心系统会用光同步块。\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_719_0.png)\n\
  \n图 30-1　堆中的对象（包括类型对象）可使其同步块索引引用 CLR 同步块数组中的记录项\n\n以下代码演示了 Monitor 类原本的使用方式：\n\n\
  ```csharp\ninternal sealed class Transaction {\n    private DateTime m_timeOfLastTrans;\n\
  \n    public void PerformTransaction() {\n        Monitor.Enter(this);\n       \
  \ // 以下代码拥有对数据的独占访问权...\n        m_timeOfLastTrans = DateTime.Now;\n        Monitor.Exit(this);\n\
  \    }\n\n    public DateTime LastTransaction {\n        get {\n            Monitor.Enter(this);\n\
  \            // 以下代码拥有对数据的独占访问权...\n            DateTime temp = m_timeOfLastTrans;\n\
  \            Monitor.Exit(this);\n            return temp;\n        }\n    }\n}\n\
  ```\n\n表面看很简单，但实际存在问题。现在的问题是，每个对象的同步块索引都隐式为公共的。以下代码演示了这可能造成的影响。\n\n```csharp\npublic\
  \ static void SomeMethod() {\n    var t = new Transaction();\n    Monitor.Enter(t);\
  \ // 这个线程获取对象的公共锁\n\n    // 让一个线程池线程显示 LastTransaction 时间\n    // 注意：线程池线程会阻塞，直到\
  \ SomeMethod 调用了 Monitor.Exit!\n    ThreadPool.QueueUserWorkItem(o => Console.WriteLine(t.LastTransaction));\n\
  \n    Monitor.Exit(t);\n}\n```\n\n```csharp\nlock (this) {\n    // 这里的代码拥有对数据的独占访问权...\n\
  }\n```\n\n它等价于像下面这样写方法：\n\n```csharp\nprivate void SomeMethod() {\n    Boolean lockTaken\
  \ = false;\n    try {\n        // 这里可能发生异常(比如 ThreadAbortException)...\n       \
  \ Monitor.Enter(this, ref lockTaken);\n        // 这里的代码拥有对数据的独占访问权...\n    }\n \
  \   finally {\n        if (lockTaken) Monitor.Exit(this);\n    }\n}\n```\n\n第一个问题是，C#\
  \ 团队认为他们在 finally 块中调用 Monitor.Exit 是帮了你一个大忙。他们的想法是，这样一来，就可确保锁总是得以释放，无论 try 块中发生了什么。但这只是他们一厢情愿的想法。在\
  \ try 块中，如果在更改状态时发生异常，这个状态就会处于损坏状态。锁在 finally 块中退出时，另一个线程可能开始操作损坏的状态。显然，更好的解决方案是让应用程序挂起，而不是让它带着损坏的状态继续运行。这样不仅结果难以预料，还有可能引发安全隐患。第二个问题是，进入和离开\
  \ try 块会影响方法的性能。有的 JIT 编译器不会内联含有 try 块的方法，造成性能进一步下降。所以最终结果是，不仅代码的速度变慢了，还会造成线程访问损坏的状态。①我的建议是杜绝使用\
  \ C# 的 lock 语句。\n\n现在终于可以开始讨论 Boolean lockTaken 变量了。下面是这个变量试图解决的问题。假定一个线程进入 try\
  \ 块，但在调用 Monitor.Enter 之前退出（参见第 22 章）。现在，finally 块会得到调用，但它的代码不应退出锁。lockTaken 变量就是为了解决这个问题而设计的。它初始化为\
  \ false，假定现在还没有进入锁（还没有获得锁）。然后，如果调用 Monitor.Enter，而且成功获得锁，Enter 方法就会将 lockTaken 设为\
  \ true。finally 块通过检查 lockTaken，便知道到底要不要调用 Monitor.Exit。顺便说一句，SpinLock 结构也支持这个 lockTaken\
  \ 模式。\n\n#### 30.3.3　ReaderWriterLockSlim 类\n\n我们经常都希望让一个线程简单地读取一些数据的内容。如果这些数据被一个互斥锁（比如\
  \ SimpleSpinLock、SimpleWaitLock、SimpleHybridLock、AnotherHybridLock、Mutex 或者 Monitor）保护，那么当多个线程同时试图访问这些数据时，只有一个线程才会运行，其他所有线程都会阻塞。这会造成应用程序伸缩性和吞吐能力的急剧下降。如果所有线程都希望以只读方式访问数据，就根本没有必要阻塞它们；应该允许它们并发地访问数据。另一方面，如果一个线程希望修改数据，这个线程就需要对数据的独占式访问。\n\
  \n① 顺便说一句，虽然仍然会对性能造成影响，但假如 try 块的代码只是对状态执行读取操作，而不是试图修改它，那么在 finally 块中释放锁是安全的。\n\
  \n**ReaderWriterLockSlim** 类封装了解决这个问题的逻辑。具体地说，这个类像下面这样控制线程。\n\n- 一个线程向数据写入时，请求访问的其他所有线程都被阻塞。\n\
  - 一个线程从数据读取时，请求读取的其他线程允许继续执行，但请求写入的线程仍被阻塞。\n- 向数据写入的线程结束后，要么解除一个写入线程（writer）的阻塞，使它能向数据写入，要么解除所有读取线程（reader）的阻塞，使它们能并发读取数据。如果没有线程被阻塞，锁就进入可以自由使用的状态，可供下一个\
  \ reader 或 writer 线程获取。\n- 从数据读取的所有线程结束后，一个 writer 线程被解除阻塞，使它能向数据写入。如果没有线程被阻塞，锁就进入可以自由使用的状态，可供下一个\
  \ reader 或 writer 线程获取。\n\n下面展示了这个类（未列出部分方法的重载版本）：\n\n```csharp\npublic class ReaderWriterLockSlim\
  \ : IDisposable {\n    public ReaderWriterLockSlim(LockRecursionPolicy recursionPolicy);\n\
  \    public void Dispose();\n\n    public void       EnterReadLock();\n    public\
  \ Boolean    TryEnterReadLock(Int32 millisecondsTimeout);\n    public void     \
  \  ExitReadLock();\n\n    public void       EnterWriteLock();\n    public Boolean\
  \    TryEnterWriteLock(Int32 millisecondsTimeout);\n    public void       ExitWriteLock();\n\
  \n    // 大多数应用程序从不查询以下任何属性\n    public Boolean IsReadLockHeld             { get;\
  \ }\n    public Boolean IsWriteLockHeld            { get; }\n    public Int32 CurrentReadCount\
  \             { get; }\n    public Int32 RecursiveReadCount           { get; }\n\
  \    public Int32 RecursiveWriteCount          { get; }\n    public Int32 WaitingReadCount\
  \             { get; }\n    public Int32 WaitingWriteCount            { get; }\n\
  \    public LockRecursionPolicy RecursionPolicy { get; }\n    // 未列出和 reader 升级到\
  \ writer 有关的成员\n}\n```\n\n以下代码演示了这个类的用法：\n\n```csharp\ninternal sealed class Transaction\
  \ : IDisposable {\n    private readonly ReaderWriterLockSlim m_lock =\n        new\
  \ ReaderWriterLockSlim(LockRecursionPolicy.NoRecursion);\n    private DateTime m_timeOfLastTrans;\n\
  \n    public void PerformTransaction() {\n        m_lock.EnterWriteLock();\n   \
  \     // 以下代码拥有对数据的独占访问权...\n        m_timeOfLastTrans = DateTime.Now;\n       \
  \ m_lock.ExitWriteLock();\n    }\n\n    public DateTime LastTransaction {\n    \
  \    get {\n            m_lock.EnterReadLock();\n            // 以下代码拥有对数据的共享访问权...\n\
  \            DateTime temp = m_timeOfLastTrans;\n            m_lock.ExitReadLock();\n\
  \            return temp;\n        }\n    }\n\n    public void Dispose() { m_lock.Dispose();\
  \ }\n}\n```\n\n这个类有几个概念要特别留意。首先，**ReaderWriterLockSlim** 的构造器允许传递一个 **LockRecursionPolicy**\
  \ 标志，它的定义如下：\n\n```csharp\npublic enum LockRecursionPolicy { NoRecursion, SupportsRecursion\
  \ }\n```\n\n如果传递 **SupportsRecursion** 标志，锁就支持线程所有权和递归行为。如同本章早些时候讨论的那样，这些行为对锁的性能有负面影响。所以，建议总是向构造器传递\
  \ **LockRecursionPolicy.NoRecursion**（就像本例）。reader-writer 锁支持线程所有权和递归的代价非常高昂，因为锁必须跟踪曾允许进入锁的所有\
  \ reader 线程，同时为每个线程都单独维护递归计数。事实上，为了以线程安全的方式维护所有这些信息，**ReaderWriterLockSlim** 内部要使用一个互斥的“自旋锁”，我不是在开玩笑！\n\
  \n**ReaderWriterLockSlim** 类提供了一些额外的方法（前面没有列出）允许一个 reader 线程升级为 writer 线程。以后，线程可以把自己降级回\
  \ reader 线程。设计者的思路是，一个线程刚开始的时候可能是读取数据。然后，根据数据的内容，线程可能想对数据进行修改。为此，线程要把它自己从 reader\
  \ 升级为 writer。锁如果支持这个行为，性能会大打折扣。而且我完全不觉得这是一个有用的功能。线程并不是直接从 reader 变成 writer 的。当时可能还有其他线程正在读取，这些线程必须完全退出锁。在此之后，尝试升级的线程才允许成为\
  \ writer。这相当于先让 reader 线程退出锁，再立即获取这个锁以进行写入。\n\n> **注意**　FCL 还提供了一个 **ReaderWriterLock**\
  \ 类，它是在 Microsoft .NET Framework 1.0 中引入的。这个类存在许多问题，所以 Microsoft 在 .NET Framework\
  \ 3.5 中引入了 **ReaderWriterLockSlim** 类。团队没有对原先的 **ReaderWriterLock** 类进行改进，因为他们害怕失去和那些正在使用它的应用程序的兼容性。下面列举了\
  \ **ReaderWriterLock** 存在的几个问题。首先，即使不存在线程竞争，它的速度也非常慢。其次，线程所有权和递归行为是这个类强加的，完全取消不了，这使锁变得更慢。最后，相比\
  \ writer 线程，它更青睐于 reader 线程，所以 writer 线程可能排起好长的队，却很少有机会获得服务，最终造成“拒绝服务”（DoS）问题。\n\
  \n- 如果 WW>0：将状态设为 ReservedForWriter，WW--，释放 1 个阻塞的 writer 线程，返回。\n- 如果 RW==0 &&\
  \ WW == 0：将状态设为 Free，返回。\n\n下面说明了一个线程进入锁进行独占访问时发生的事情。\n\n- 如果锁的状态为 Free：将状态设为 OwnedByWriter，返回。\n\
  - 如果锁的状态为 ReservedForWriter：将状态设为 OwnedByWriter，返回。\n- 如果锁的状态为 OwnedByWriter：WW++，阻塞\
  \ writer 线程。线程醒来时，循环并重试。\n- 否则：将状态设为 OwnedByReadersAndWriterPending，WW++，阻塞 writer\
  \ 线程。线程醒来时，循环并重试。\n\n下面说明了进行独占访问的一个线程离开锁时发生的事情。\n\n- 如果 WW==0 && RW==0：将状态设为 Free，返回。\n\
  - 如果 WW > 0：将状态设为 ReservedForWriter，WW--，释放 1 个阻塞的 writer 线程，返回。\n- 如果 WW==0 &&\
  \ RW>0：将状态设为 Free，RW=0，唤醒所有阻塞的 reader 线程，返回。\n\n假定当前有一个线程（reader）正在锁中进行读取操作，另一个线程（writer）想进入锁进行（独占的）写入操作。writer\
  \ 线程首先检查锁是否为 Free，由于不为 Free，所以线程会继续执行下一项检查。然而，在这个时候，reader 线程可能离开了锁，而且在离开时发现 RW\
  \ 和 WW 都是 0。所以，线程会将锁的状态设为 Free。这便造成了一个问题，因为 writer 线程已经执行过这个测试，并且走开了。简单地说，这里发生的事件是，reader\
  \ 线程背着 writer 线程改变了 writer 线程访问的状态。我需要解决这个问题，使锁能够正确工作。\n\n为了解决这个问题，所有这些位操作都要使用 29.3.4\
  \ 节 “Interlocked Anything 模式” 描述的技术来执行。这个模式允许将任何操作转换成线程安全的原子操作。正是因为这个问题，才使得这个锁的速度是如此之快，而且其中维护的状态比其他\
  \ reader-writer 锁少。比较 **OneManyLock** 类与 FCL 的 **ReaderWriterLockSlim** 和 **ReaderWriterLock**\
  \ 类的性能，我得到以下结果：\n\n| 操作 | 耗时 | 说明 |\n| --- | ---: | --- |\n| Incrementing x in OneManyLock\
  \ | 330 | 最快 |\n| Incrementing x in ReaderWriterLockSlim | 554 | 约慢 1.7 倍 |\n| Incrementing\
  \ x in ReaderWriterLock | 984 | 约慢 3 倍 |\n\n当然，由于所有 reader-writer 锁都执行比互斥锁更多的逻辑，所以它们的性能可能要稍差一些。但在比较时不要忘记这样一个事实：reader-writer\
  \ 锁允许多个 reader 线程同时进入锁。\n\n结束本节的讨论之前，我想指出的是，我的 Power Threading 库提供了这个锁的一个稍微不同的版本。\n\
  \n```csharp\npublic void RemoveParticipants(Int32 participantCount);    // 减去参与者\n\
  public Boolean SignalAndWait(Int32 millisecondsTimeout,\n    CancellationToken cancellationToken);\n\
  \npublic Int64 CurrentPhaseNumber { get; }                  // 指出进行到哪一个阶段（从 0 开始）\n\
  public Int32 ParticipantCount { get; }                    // 参与者数量\npublic Int32\
  \ ParticipantsRemaining { get; }               // 需要调用 SignalAndWait 的线程数\n}\n```\n\
  \n构造 **Barrier** 时要告诉它有多少个线程准备参与工作，还可传递一个 `Action<Barrier>` 委托来引用所有参与者完成一个阶段的工作后要调用的代码。可以调用\
  \ **AddParticipant** 和 **RemoveParticipant** 方法在 **Barrier** 中动态添加和删除参与线程。但在实际应用中，人们很少这样做。每个线程完成它的阶段性工作后，应调用\
  \ **SignalAndWait**，告诉 **Barrier** 线程已经完成一个阶段的工作，而 **Barrier** 会阻塞线程（使用一个 **ManualResetEventSlim**）。所有参与者都调用了\
  \ **SignalAndWait** 后，**Barrier** 将调用指定的委托（由最后一个调用 **SignalAndWait** 的线程调用），然后解除正在等待的所有线程的阻塞，使它们开始下一阶段。\n\
  \n#### 30.3.7　线程同步构造小结\n\n我的建议是，代码尽量不要阻塞任何线程。执行异步计算或 I/O 操作时，将数据从一个线程交给另一个线程时，应避免多个线程同时访问数据。如果不能完全做到这一点，请尽量使用\
  \ **Volatile** 和 **Interlocked** 的方法，因为它们的速度很快，而且绝不阻塞线程。遗憾的是，这些方法只能操作简单类型。但可以像 29.3.4\
  \ 节“**Interlocked Anything** 模式”描述的那样在这些类型上执行丰富的操作。\n\n主要在以下两种情况下阻塞线程。\n\n- **线程模型很简单**：\n\
  \  阻塞线程虽会牺牲一些资源和性能，但可顺序地编写应用程序代码，无需使用回调方法。不过，C# 的异步方法功能现在提供了不阻塞线程的简化编程模型。\n- **线程有专门用途**：\n\
  \  有的线程是特定任务专用的。最好的例子就是应用程序的主线程。如果应用程序的主线程没有阻塞，它最终就会返回，造成整个进程终止。其他例子还有应用程序的 GUI\
  \ 线程。Windows 要求一个窗口或控件总是由创建它的线程操作。因此，我们有时写代码阻塞一个 GUI 线程，直到其他某个操作完成。然后，GUI 线程根据需要对窗口和控件进行更新。当然，阻塞\
  \ GUI 线程会造成应用程序挂起，使用户体验变差。\n\n要避免阻塞线程，就不要刻意地为线程打上标签。例如，不要创建一个拼写检查线程、一个语法检查线程、一个处理特定客户端请求的线程等。为线程打上标签，其实是在告诫自己该线程不能做其他任何事情。但由于线程是如此昂贵，所以不能把它们专门用于某个目的。相反，应通过线程池将线程出租相当短暂的时间。所以正确方式是让一个线程池线程开始拼写检查，再改为语法检查，再代表一个客户端请求执行工作，以此类推。\n\
  \n如果一定要阻塞线程，为了同步在不同 AppDomain 或进程中运行的线程，请使用内核对象。\n\n构造。要在一系列操作中原子性地操纵状态，请使用带有私有字段的\
  \ Monitor 类。①另外，可以使用 reader-writer 锁代替 Monitor。reader-writer 锁通常比 Monitor 慢，但它们允许多个线程并发执行，这提升了总体性能，并将阻塞线程的几率降至最低。\n\
  \n此外，避免使用递归锁(尤其是递归的 reader-writer 锁)，因为它们会损害性能。但 Monitor 是递归的，性能也不错。②另外，不要在 finally\
  \ 块中释放锁，因为进入和离开异常处理块会招致性能损失。如果在更改状态时抛出异常，状态就会损坏，操作这个状态的其他线程会出现不可预料的行为，并可能引入安全隐患。\n\
  \n当然，如果写代码来占用锁，注意时间不要太长，否则会增大线程阻塞的几率。后面的 30.6 节“异步的同步构造”会展示如何利用集合类防止长时间占有锁。\n\n\
  最后，对于计算限制的工作，可以使用任务(参见第 27.5 节“任务”)避免使用大量线程同步构造。我喜欢的一个设计是，每个任务都关联一个或多个延续任务。某个操作完成后，这些任务将通过某个线程池线程继续执行。这比让一个线程阻塞并等待某个操作完成好得多。对于\
  \ I/O 限制的工作，调用各种 XxxAsync 方法将造成你的代码在 I/O 操作完成后继续；这其实类似于任务的延续任务。\n\n### 30.4 著名的双检锁技术\n\
  \n双检锁(Double-Check Locking)是一个非常著名的技术，开发人员用它将单实例(singleton)对象的构造推迟到应用程序首次请求该对象时进行。这有时也称为延迟初始化(lazy\
  \ initialization)。如果应用程序永远不请求对象，对象就永远不会构造，从而节省了时间和内存。但当多个线程同时请求单实例对象时就可能出问题。这个时候必须使用一些线程同步机制确保单实例对象只被构造一次。\n\
  \n该技术之所以有名，不是因为它非常有趣或有用，而是因为它曾经是人们热烈讨论的话题。该技术曾在 Java 中大量使用，后来有一天，一些人发现 Java 不能保证该技术在任何地方都能正确工作。这个使它出名的网页对问题进行了清楚的说明：http://www.cs.umd.edu/~pugh/java/memoryModel/DoubleCheckedLocking.html。\n\
  \n无论如何，一个好消息是，CLR 很好地支持双检锁技术，这应该归功于 CLR 的内存模型以及 volatile 字段访问(参见第 29 章)。以下代码演示了如何用\
  \ C# 实现双检锁技术③：\n\n```csharp\npublic sealed class Singleton {\n    // s_lock 对象是实现线程安全所需要的。定义这个对象时，我们假设创建单实例对象的\n\
  \    // 代价高于创建一个 System.Object 对象，并假设可能根本不需要创建单实例对象。\n    // 否则，更经济、更简单的做法是在一个类构造器中创建单实例对象。\n\
  \    private static Object s_lock = new Object();\n\n    // 这个字段引用一个单实例对象\n    private\
  \ static Singleton s_value = null;\n\n    // 私有构造器阻止这个类外部的任何代码创建实例\n    private\
  \ Singleton() {\n        // 把初始化单实例对象的代码放在这里...\n    }\n\n    // 以下公共静态方法返回单实例对象（如有必要就创建它）\n\
  \    public static Singleton GetSingleton() {\n        // 如果单实例对象已经创建，直接返回它（这样速度很快）\n\
  \        if (s_value != null) return s_value;\n\n        Monitor.Enter(s_lock);\
  \  // 还没有创建，让一个线程创建它\n        if (s_value == null) {\n            // 仍未创建，创建它\n\
  \            Singleton temp = new Singleton();\n\n            // 将引用保存到 s_value\
  \ 中（参见正文的详细讨论）\n            Volatile.Write(ref s_value, temp);\n        }\n    \
  \    Monitor.Exit(s_lock);\n\n        // 返回对单实例对象的引用\n        return s_value;\n\
  \    }\n}\n```\n\n- ① 可用 SpinLock 代替 Monitor，因为 SpinLock 稍快一些。但 SpinLock 比较危险，因为它可能浪费\
  \ CPU 时间。而且在我看来，它还没有快到非用不可的地步。\n- ② 部分是由于 Monitor 用本机代码(而非托管代码)来实现。\n- ③ 两个 if 语句即是两次检查。——译注\n\
  \n双检锁技术背后的思路在于，对 **GetSingleton** 方法的一个调用可以快速地检查 **s_value** 字段，判断对象是否创建。如果是，方法就返回对它的引用。这里的妙处在于，如果对象已经构造好，就不需要线程同步；应用程序会运行得非常快。另一方面，如果调用\
  \ **GetSingleton** 方法的第一个线程发现对象还没有创建，就会获取一个线程同步锁来确保只有一个线程构造单实例对象。这意味着只有线程第一次查询单实例对象时，才会出现性能上的损失。\n\
  \n现在，让我解释一下为什么这个模式在 Java 中出了问题。Java 虚拟机(JVM)在 **GetSingleton** 方法开始的时候将 **s_value**\
  \ 的值读入 CPU 寄存器。然后，对第二个 if 语句求值时，它直接查询寄存器，造成第二个 if 语句总是求值为 **true**，结果就是多个线程都会创建\
  \ **Singleton** 对象。当然，只有多个线程恰好同时调用 **GetSingleton** 才会发生这种情况。在大多数应用程序中，发生这种情况的概率都是极低的。这正是该问题在\
  \ Java 中长时间都没有被发现的原因。\n\n在 CLR 中，对任何锁方法的调用都构成了一个完整的内存栅栏，在栅栏之前写入的任何变量都必须在栅栏之前完成；在栅栏之后的任何变量读取都必须在栅栏之后开始。对于\
  \ **GetSingleton** 方法，这意味着 **s_value** 字段的值必须在调用了 **Monitor.Enter** 之后重新读取；调用前缓存到寄存器中的东西作不了数。\n\
  \n**GetSingleton** 内部有一个 **Volatile.Write** 调用。下面让我解释一下它解决的是什么问题。假定第二个 if 语句中包含的是下面这行代码：\n\
  \n```csharp\ns_value = new Singleton(); // 你极有可能这样写\n```\n\n你的想法是让编译器生成代码为一个 **Singleton**\
  \ 分配内存，调用构造器来初始化字段，再将引用赋给 **s_value** 字段。使一个值对其他线程可见称为发布(publishing)。但那只是你一厢情愿的想法，编译器可能这样做：为\
  \ **Singleton** 分配内存，将引用发布到(赋给)**s_value**，再调用构造器。从单线程的角度出发，像这样改变顺序是无关紧要的。但在将引用发布给\
  \ **s_value** 之后，并在调用构造器之前，如果另一个线程调用了 **GetSingleton** 方法，那么会发生什么？这个线程会发现 **s_value**\
  \ 不为 **null**，所以会开始使用 **Singleton** 对象，但对象的构造器还没有结束执行呢！这是一个很难追踪的 bug，尤其是它完全是由于计时而造成的。\n\
  \n对 **Volatile.Write** 的调用修正了这个问题。它保证 **temp** 中的引用只有在构造器结束执行之后，才发布到 **s_value**\
  \ 中。解决这个问题的另一个办法是使用 C# 的 **volatile** 关键字来标记 **s_value** 字段。这使向 **s_value** 的写入变得具有“易变性”。同样，构造器必须在写入发生前结束运行。但遗憾的是，这同时会使所有读取操作具有“易变性”，这是完全没必要的。因此，使用\
  \ **volatile** 关键字，会使性能无谓地受到损害。\n\n- ① 所以对字段的读取也要同步了。——译注\n\n本节开头指出双检锁技术无关有趣。在我看来，是开发人员把它捧得太高，在许多不该使用它的时候也在用它。大多数时候，这个技术实际上会损害效率。下面是\
  \ **Singleton** 类的一个简单得多的版本，它的行为和上一个版本相同。这个版本没有使用“著名”的双检锁技术：\n\n```csharp\ninternal\
  \ sealed class Singleton {\n    private static Singleton s_value = new Singleton();\n\
  \n    // 私有构造器防止这个类外部的任何代码创建一个实例\n    private Singleton() {\n        // 将初始化单实例对象的代码放在这里...\n\
  \    }\n\n    // 以下公共静态方法返回单实例对象（如有必要就创建它）\n    public static Singleton GetSingleton()\
  \ { return s_value; }\n}\n```\n\n由于代码首次访问类的成员时，CLR 会自动调用类型的类构造器，所以首次有一个线程查询 **Singleton**\
  \ 的 **GetSingleton** 方法时，CLR 就会自动调用类构造器，从而创建一个对象实例。此外，CLR 已保证了对类构造器的调用是线程安全的。我已在\
  \ 8.3 节“类型构造器”对此进行了解释。这种方式的缺点在于，首次访问类的任何成员都会调用类型构造器。所以，如果 **Singleton** 类型定义了其他静态成员，就会在访问其他任何静态成员时创建\
  \ **Singleton** 对象。有人通过定义嵌套类来解决这个问题。\n\n下面展示了生成 **Singleton** 对象的第三种方式：\n\n```csharp\n\
  internal sealed class Singleton {\n    private static Singleton s_value = null;\n\
  \n    // 私有构造器阻止这个类外部的任何代码创建实例\n    private Singleton() {\n        // 把初始化单实例对象的代码放在这里...\n\
  \    }\n\n    // 以下公共静态方法返回单实例对象（如有必要就创建它）\n    public static Singleton GetSingleton()\
  \ {\n        if (s_value != null) return s_value;\n\n        // 创建一个新的单实例对象，并把它固定下来（如果另一个线程还没有固定它的话）\n\
  \        Singleton temp = new Singleton();\n        Interlocked.CompareExchange(ref\
  \ s_value, temp, null);\n\n        // 如果这个线程竞争失败，新建的第二个单实例对象会被垃圾回收\n\n        return\
  \ s_value; // 返回对单实例对象的引用\n    }\n}\n```\n\n如果多个线程同时调用 **GetSingleton**，这个版本可能创建两个（或更多）**Singleton**\
  \ 对象。然而，对 **Interlocked.CompareExchange** 的调用确保只有一个引用才会发布到 s_value 字段中。没有通过这个字段固定下来的任何对象都会在以后被垃圾回收。由于大多数应用程序都很少发生多个线程同时调用\
  \ **GetSingleton** 的情况，所以不太可能同时创建多个 **Singleton** 对象。\n\n虽然可能创建多个 **Singleton**\
  \ 对象，但上述代码有多方面的优势。首先，它的速度非常快。其次，它永不阻塞线程。相反，如果一个线程池线程在一个 **Monitor** 或者其他任何内核模式的线程同步构造上阻塞，线程池就会创建另一个线程来保持\
  \ CPU 的“饱和”。因此，会分配并初始化更多的内存，而且所有 DLL 都会收到一个线程连接通知。使用 **CompareExchange** 则永远不会发生这种情况。当然，只有在构造器没有副作用的时候才能使用这个技术。\n\
  \nFCL 有两个类型封装了本节描述的模式。下面是泛型 **System.Lazy** 类（有的方法没有列出）：\n\n```csharp\npublic class\
  \ Lazy<T> {\n    public Lazy(Func<T> valueFactory, LazyThreadSafetyMode mode);\n\
  \    public Boolean IsValueCreated { get; }\n    public T Value { get; }\n}\n```\n\
  \n以下代码演示了它是如何工作的：\n\n```csharp\npublic static void Main() {\n    // 创建一个“延迟初始化”包装器，它将\
  \ DateTime 的获取包装起来\n    Lazy<String> s = new Lazy<String>(() =>\n        DateTime.Now.ToLongTimeString(),\
  \ true);\n\n    Console.WriteLine(s.IsValueCreated);     // 还没有查询 Value，所以返回 false\n\
  \    Console.WriteLine(s.Value);               // 现在调用委托\n    Console.WriteLine(s.IsValueCreated);\
  \     // 已经查询了 Value，所以返回 true\n    Thread.Sleep(10000);                     //\
  \ 等待 10 秒，再次显示时间\n    Console.WriteLine(s.Value);               // 委托没有调用；显示相同结果\n\
  }\n```\n\n在我的机器上运行，得到以下结果：\n\n```text\nFalse\n2:40:42 PM\nTrue\n2:40:42 PM  ← 注意，10\
  \ 秒之后，时间未发生改变\n```\n\n上述代码构造 Lazy 类的实例，并向它传递某个 **LazyThreadSafetyMode** 标志。下面总结了这些标志：\n\
  \n```csharp\npublic enum LazyThreadSafetyMode {\n    None,                     \
  \    // 完全没有线程安全支持（适合 GUI 应用程序）\n    ExecutionAndPublication,      // 使用双检锁技术\n\
  \    PublicationOnly,              // 使用 Interlocked.CompareExchange 技术\n}\n```\n\
  \n内存有限时可能不想创建 **Lazy** 类的实例。这时可调用 **System.Threading.LazyInitializer** 类的静态方法。下面展示了这个类：\n\
  \n```csharp\npublic static class LazyInitializer {\n    // 这两个方法在内部使用了 Interlocked.CompareExchange:\n\
  \    public static T EnsureInitialized<T>(ref T target) where T: class;\n    public\
  \ static T EnsureInitialized<T>(ref T target, Func<T> valueFactory) where T: class;\n\
  \n    // 这两个方法将同步锁(syncLock)传给 Monitor 的 Enter 和 Exit 方法\n    public static T EnsureInitialized<T>(ref\
  \ T target, ref Boolean initialized,\n        ref Object syncLock);\n    public\
  \ static T EnsureInitialized<T>(ref T target, ref Boolean initialized,\n       \
  \ ref Object syncLock, Func<T> valueFactory);\n}\n```\n\n另外，为 **EnsureInitialized**\
  \ 方法的 syncLock 参数显式指定同步对象，可以用同一个锁保护多个初始化函数和字段。下例展示了如何使用这个类的方法：\n\n```csharp\npublic\
  \ static void Main() {\n    String name = null;\n    // 由于 name 为 null，所以委托执行并初始化\
  \ name\n    LazyInitializer.EnsureInitialized(ref name, () => \"Jeffrey\");\n  \
  \  Console.WriteLine(name);  // 显示\"Jeffrey\"\n\n    // 由于 name 已经不为 null，所以委托不运行；name\
  \ 不改变\n    LazyInitializer.EnsureInitialized(ref name, () => \"Richter\");\n   \
  \ Console.WriteLine(name); // 还是显示\"Jeffrey\"\n}\n```\n\n### 30.5 条件变量模式\n\n假定一个线程希望在一个复合条件为\
  \ **true** 时执行一些代码。一个选项是让线程连续“自旋”，反复测试条件。但这会浪费 CPU 时间，也不可能对构成复合条件的多个变量进行原子性的测试。幸好，有一个模式允许线程根据一个复合条件来同步它们的操作，而且不会浪费资源。这个模式称为条件变量(condition\
  \ variable)模式。我们通过 **Monitor** 类中定义的以下方法来使用该模式：\n\n```csharp\npublic static class\
  \ Monitor {\n    public static Boolean Wait(Object obj);\n    public static Boolean\
  \ Wait(Object obj, Int32 millisecondsTimeout);\n\n    public static void Pulse(Object\
  \ obj);\n    public static void PulseAll(Object obj);\n}\n```\n\n下面展示了这个模式：\n\n\
  ```csharp\ninternal sealed class ConditionVariablePattern {\n   private readonly\
  \ Object m_lock = new Object();\n   private Boolean m_condition = false;\n\n   public\
  \ void Thread1() {\n      Monitor.Enter(m_lock);    // 获取一个互斥锁\n\n      // 在锁中，“原子性”地测试或复合条件\n\
  \      while (!m_condition) {\n         // 条件不满足，就等待另一个线程更改条件\n         Monitor.Wait(m_lock);\
  \    // 临时释放锁，使其他线程能获取它\n      }\n\n      // 条件满足，处理数据...\n\n      Monitor.Exit(m_lock);\
  \        // 永久释放锁\n   }\n\n   public void Thread2() {\n      Monitor.Enter(m_lock);\
  \        // 获取一个互斥锁\n\n      // 处理数据并修改条件...\n      m_condition = true;\n\n    \
  \  // Monitor.Pulse(m_lock);    // 锁释放之后唤醒一个正在等待的线程\n      Monitor.PulseAll(m_lock);\
  \     // 锁释放之后唤醒所有正在等待的线程\n\n      Monitor.Exit(m_lock);         // 释放锁\n   }\n\
  }\n```\n\n在上述代码中，执行 **Thread1** 方法的线程进入一个互斥锁，然后对一个条件进行测试。在这里，我只是检查一个 **Boolean**\
  \ 字段，它可以是任意复合条件。例如，可以检查是不是三月的一个星期二，同时一个特定的集合对象是否包含 10 个元素。如果条件为 **false**，你希望线程在条件上“自旋”。但自旋会浪费\
  \ CPU 时间，所以线程不自旋，而是调用 **Wait**。**Wait** 释放锁，使另一个线程能获得它并阻塞调用线程。\n\n**Thread2** 方法展示了第二个线程执行的代码。它调用\
  \ **Enter** 来获取锁的所有权，处理一些数据，造成一些状态的改变，再调用 **Pulse** 或 **PulseAll**，从而解除一个线程因为调用\
  \ **Wait** 而进入的阻塞状态。注意，**Pulse** 只解除等待最久的线程（如果有的话）的阻塞，而 **PulseAll** 解除所有正在等待的线程（如果有的话）的阻塞。但所有解除阻塞的线程还没有醒来。执行\
  \ **Thread2** 的线程必须调用 **Monitor.Exit**，允许锁由另一个线程拥有。另外，如果调用的是 **PulseAll**，其他线程不会同时解除阻塞。调用\
  \ **Wait** 的线程解除阻塞后，它成为锁的所有者。由于这是一个互斥锁，所以一次只能有一个线程拥有它。其他线程只有在锁的所有者调用了 **Wait** 或\
  \ **Exit** 之后才能得到它。\n\n执行 **Thread1** 的线程醒来时，它进行下一次循环迭代，再次对条件进行测试。如果条件仍为 **false**，它就再次调用\
  \ **Wait**。如果条件为 **true**，它就处理数据，并最终调用 **Exit**。这样就会将锁释放，使其他线程能得到它。这个模式的妙处在于，可以使用简单的同步逻辑（只是一个锁）来测试构成一个复合条件的几个变量，而且多个正在等待的线程可以全部解除阻塞，而不会造成任何逻辑错误。唯一的缺点就是解除线程的阻塞可能浪费一些\
  \ CPU 时间。\n\n下面展示了一个线程安全的队列，它允许多个线程在其中对数据项(item)进行入队和出队操作。注意，除非有了一个可供处理的数据项，否则试图出队一个数据项的线程会一直阻塞。\n\
  \n```csharp\ninternal sealed class SynchronizedQueue<T> {\n    private readonly\
  \ Object m_lock = new Object();\n    private readonly Queue<T> m_queue = new Queue<T>();\n\
  \n    public void Enqueue(T item) {  // 入队\n        Monitor.Enter(m_lock);\n\n \
  \       // 一个数据项入队后，就唤醒任何/所有正在等待的线程\n        m_queue.Enqueue(item);\n        Monitor.PulseAll(m_lock);\n\
  \n        Monitor.Exit(m_lock);\n    }\n\n    public T Dequeue() {  // 出队\n    \
  \    Monitor.Enter(m_lock);\n\n        // 队列为空(这是条件)就一直循环\n        while (m_queue.Count\
  \ == 0)\n            Monitor.Wait(m_lock);\n\n        // 使一个数据项出队，返回它供处理\n     \
  \   T item = m_queue.Dequeue();\n        Monitor.Exit(m_lock);\n        return item;\n\
  \    }\n}\n```\n\n### 30.6 异步的同步构造\n\n任何使用了内核模式基元的线程同步构造，我都不是特别喜欢。因为所有这些基元都会阻塞一个线程的运行。创建线程的代价很大。创建了不用，这于情于理都说不通。下面这个例子能很好地说明这个问题。\n\
  \n假定客户端向网站发出请求。客户端请求到达时，一个线程池线程开始处理客户端请求。假定这个客户端想以线程安全的方式修改服务器中的数据，所以它请求一个 reader-writer\
  \ 锁来进行写入(这使线程成为一个 writer 线程)。假定这个锁被长时间占有。在锁被占有期间，另一个客户端请求到达了，所以线程池为这个请求创建新线程。然后，线程阻塞，尝试获取\
  \ reader-writer 锁来进行读取(这使线程成为一个 reader 线程)。事实上，随着越来越多的客户端请求到达，线程池会创建越来越多的线程，所有这些线程都傻傻地在锁上面阻塞。服务器把它的所有时间都花在创建线程上面，而目的仅仅是让它们停止运行！这样的服务器完全没有伸缩性可言。\n\
  \n更糟的是，当 writer 线程释放锁时，所有 reader 线程都同时解除阻塞并开始执行。现在，又变成了大量线程试图在相对数量很少的 CPU 上运行。所以，Windows\
  \ 开始在线程之间不停地进行上下文切换。由于上下文切换产生了大量开销，所以真正的工作反而没有得到很快的处理。\n\n观察本章介绍的所有构造，你会发现这些构造想要解决的许多问题其实最好都是用第\
  \ 27 章讨论的 **Task** 类来完成。拿 **Barrier** 类来说：可以生成几个 **Task** 对象来处理一个阶段。然后，当所有这些任务完成后，可以用另外一个或多个\
  \ **Task** 对象继续。和本章展示的大量构造相比，任务具有下述许多优势。\n\n- 任务使用的内存比线程少得多，创建和销毁所需的时间也少得多。\n- 线程池根据可用\
  \ CPU 数量自动伸缩任务规模。\n- 每个任务完成一个阶段后，运行任务的线程回到线程池，在那里能接受新任务。\n- 线程池是站在整个进程的高度观察任务。所以，它能更好地调度这些任务，减少进程中的线程数，并减少上下文切换。\n\
  \n锁很流行，但长时间拥有会带来巨大的伸缩性问题。如果代码能通过异步的同步构造指出它想要一个锁，那么会非常有用。在这种情况下，如果线程得不到锁，可直接返回并执行其他工作，而不必在那里傻傻地阻塞。以后当锁可用时，代码可恢复执行并访问锁所保护的资源。我当年在为客户解决一个重大的伸缩性问题时有了这个思路，并于\
  \ 2009 年将专利权卖给了 Microsoft，专利号是 7603502。\n\n**SemaphoreSlim** 类通过 **WaitAsync** 方法实现了这个思路，下面是该方法的最复杂的重载版本的签名。\n\
  \n```\npublic Task<Boolean> WaitAsync(Int32 millisecondsTimeout, CancellationToken\
  \ cancellationToken);\n```\n\n可用它异步地同步对一个资源的访问（不阻塞任何线程）。\n\n```\nprivate static\
  \ async Task AccessResourceViaAsyncSynchronization(SemaphoreSlim asyncLock)\n{\n\
  \    // TODO: 执行你想要的任何代码...\n\n    await asyncLock.WaitAsync(); // 请求获得锁来获得对资源的独占访问\n\
  \    // 执行到这里，表明没有别的线程正在访问资源\n    // TODO: 独占地访问资源...\n\n    // 资源访问完毕就放弃锁，使其他代码能访问资源\n\
  \    asyncLock.Release();\n\n    // TODO: 执行你想要的任何代码...\n}\n```\n\n**SemaphoreSlim**\
  \ 的 **WaitAsync** 方法很有用，但它提供的是信号量语义。一般创建最大计数为 1 的 **SemaphoreSlim**，从而对 **SemaphoreSlim**\
  \ 保护的资源进行互斥访问。所以，这和使用 **Monitor** 时的行为相似，只是 **SemaphoreSlim** 不支持线程所有权和递归语义（这是好事）。\n\
  \n但 reader-writer 语义呢？.NET Framework 提供了 **ConcurrentExclusiveSchedulerPair** 类。\n\
  \n```\npublic class ConcurrentExclusiveSchedulerPair {\n    public ConcurrentExclusiveSchedulerPair();\n\
  \n    public TaskScheduler ExclusiveScheduler { get; }\n    public TaskScheduler\
  \ ConcurrentScheduler { get; }\n\n    // 未列出其他方法...\n}\n```\n\n这个类的实例带有两个 **TaskScheduler**\
  \ 对象，它们在调度任务时负责提供 reader/writer 语义。只要当前没有运行使用 **ConcurrentScheduler** 调度的任务，使用 **ExclusiveScheduler**\
  \ 调度的任何任务将独占式地运行（一次只能运行一个）。另外，只要当前没有运行使用 **ExclusiveScheduler** 调度的任务，使用 **ConcurrentScheduler**\
  \ 调度的任务就可同时运行（一次运行多个）。以下代码演示了该类的使用。\n\n```csharp\nprivate static void ConcurrentExclusiveSchedulerDemo()\
  \ {\n    var cesp = new ConcurrentExclusiveSchedulerPair();\n    var tfExclusive\
  \ = new TaskFactory(cesp.ExclusiveScheduler);\n    var tfConcurrent = new TaskFactory(cesp.ConcurrentScheduler);\n\
  \n    for (Int32 operation = 0; operation < 5; operation++) {\n        var exclusive\
  \ = operation < 2; // 出于演示的目的，我建立了 2 个独占和 3 个并发\n\n        (exclusive ? tfExclusive\
  \ : tfConcurrent).StartNew(() => {\n            Console.WriteLine(\"{0} access\"\
  , exclusive ? \"exclusive\" : \"concurrent\");\n            // TODO: 在这里进行独占写入或并发读取操作...\n\
  \        });\n    }\n}\n```\n\n遗憾的是，.NET Framework 没有提供具有 reader-writer 语义的异步锁。但我构建了这样的一个类，称为\
  \ **AsyncOneManyLock**。它的用法和 **SemaphoreSlim** 一样。下面是一个例子。\n\n```csharp\nprivate\
  \ static async Task AccessResourceViaAsyncSynchronization(AsyncOneManyLock asyncLock)\
  \ {\n    // TODO: 执行你想要的任何代码...\n\n    // 为想要的并发访问传递 OneManyMode.Exclusive 或 OneManyMode.Shared\n\
  \    await asyncLock.AcquireAsync(OneManyMode.Shared); // 要求共享访问\n    // 如果执行到这里，表明没有其他线程在向资源写入；可能有其他线程在读取\n\
  \    // TODO: 从资源读取...\n\n    // 资源访问完毕就放弃锁，使其他代码能访问资源\n    asyncLock.Release();\n\
  \n    // TODO: 执行你想要的任何代码...\n}\n```\n\n下面展示了 **AsyncOneManyLock** 类。\n\n```csharp\n\
  public enum OneManyMode { Exclusive, Shared }\n\npublic sealed class AsyncOneManyLock\
  \ {\n    #region 锁的代码\n    private SpinLock m_lock = new SpinLock(true); // 自旋锁不要用\
  \ readonly\n    private void Lock() { Boolean taken = false; m_lock.Enter(ref taken);\
  \ }\n    private void Unlock() { m_lock.Exit(); }\n    #endregion\n\n    #region\
  \ 锁的状态和辅助方法\n    private Int32 m_state = 0;\n    private Boolean IsFree { get {\
  \ return m_state == 0; } }\n    private Boolean IsOwnedByWriter { get { return m_state\
  \ == -1; } }\n    private Boolean IsOwnedByReaders { get { return m_state > 0; }\
  \ }\n    private Int32 AddReaders(Int32 count) { return m_state += count; }\n  \
  \  private Int32 SubtractReader() { return --m_state; }\n    private void MakeWriter()\
  \ { m_state = -1; }\n    private void MakeFree() { m_state = 0; }\n    #endregion\n\
  \n    // 目的是在非竞态条件时增强性能和减少内存消耗\n    private readonly Task m_noContentionAccessGranter;\n\
  \n    // 每个等待的 writer 都通过它们在这里排队的 TaskCompletionSource 来唤醒\n    private readonly\
  \ Queue<TaskCompletionSource<Object>> m_qWaitingWriters =\n        new Queue<TaskCompletionSource<Object>>();\n\
  \n    // 一个 TaskCompletionSource 收到信号，所有等待的 reader 都唤醒\n    private TaskCompletionSource<Object>\
  \ m_waitingReadersSignal =\n        new TaskCompletionSource<Object>();\n    private\
  \ Int32 m_numWaitingReaders = 0;\n\n    public AsyncOneManyLock() {\n        m_noContentionAccessGranter\
  \ = Task.FromResult<Object>(null);\n    }\n\n    public Task WaitAsync(OneManyMode\
  \ mode) {\n        Task accessGranter = m_noContentionAccessGranter; // 假定无竞争\n\n\
  \        Lock();\n        switch (mode) {\n            case OneManyMode.Exclusive:\n\
  \                if (IsFree) {\n                    MakeWriter(); // 无竞争\n     \
  \           } else {\n                    // 有竞争：新的 writer 任务进入队列，并返回它使 writer 等待\n\
  \                    var tcs = new TaskCompletionSource<Object>();\n           \
  \         m_qWaitingWriters.Enqueue(tcs);\n                    accessGranter = tcs.Task;\n\
  \                }\n                break;\n\n            case OneManyMode.Shared:\n\
  \                if (IsFree || (IsOwnedByReaders && m_qWaitingWriters.Count == 0))\
  \ {\n                    AddReaders(1); // 无竞争\n                } else { // 有竞争\n\
  \                    // 竞争：递增等待的 reader 数量，并返回 reader 任务使 reader 等待\n          \
  \          m_numWaitingReaders++;\n                    accessGranter = m_waitingReadersSignal.Task.ContinueWith(t\
  \ => t.Result);\n                }\n                break;\n        }\n        Unlock();\n\
  \n        return accessGranter;\n    }\n\n    public void Release() {\n        TaskCompletionSource<Object>\
  \ accessGranter = null; // 假定没有代码被释放\n\n        Lock();\n        if (IsOwnedByWriter)\
  \ MakeFree(); // 一个 writer 离开\n        else SubtractReader(); // 一个 reader 离开\n\n\
  \        if (IsFree) {\n            // 如果自由，唤醒 1 个等待的 writer 或所有等待的 readers\n  \
  \          if (m_qWaitingWriters.Count > 0) {\n                MakeWriter();\n \
  \               accessGranter = m_qWaitingWriters.Dequeue();\n            } else\
  \ if (m_numWaitingReaders > 0) {\n                AddReaders(m_numWaitingReaders);\n\
  \                m_numWaitingReaders = 0;\n                accessGranter = m_waitingReadersSignal;\n\
  \n                // 为将来需要等待的 readers 创建一个新的 TCS\n```\n\n```csharp\nm_waitingReadersSignal\
  \ = new TaskCompletionSource<Object>();\n        }\n    }\n    Unlock();\n\n   \
  \ // 唤醒锁外面的 writer/reader，减少竞争几率以提高性能\n    if (accessGranter != null) accessGranter.SetResult(null);\n\
  }\n}\n```\n\n如同我说过的一样，上述代码永远不会阻塞线程。原因是我在内部没有使用任何内核构造。这里确实使用了一个 **SpinLock**，它在内部使用了用户模式的构造。但第\
  \ 29 章讨论自旋锁的时候说过，只有执行时间很短的代码段才可以用自旋锁来保护。查看我的 **WaitAsync** 方法，会发现我用锁保护的只是一些整数计算和比较，以及构造一个\
  \ **TaskCompletionSource** 并把它添加到队列的动作。这花不了多少时间，所以能保证锁只是短时间被占有。\n\n类似地，查看我的 **Release**\
  \ 方法，会发现做的事情不外乎一些整数计算、一个比较以及将一个 **TaskCompletionSource** 出队或者构造一个 **TaskCompletionSource**。这同样花不了多少时间。使用一个\
  \ **SpinLock** 来保护对 **Queue** 的访问，我感觉非常自在。线程在使用这种锁时永远不会阻塞，使我能构建响应灵敏的、可伸缩的软件。\n\n\
  ### 30.7 并发集合类\n\nFCL 自带 4 个线程安全的集合类，全部在 **System.Collections.Concurrent** 命名空间中定义。它们是\
  \ **ConcurrentQueue**、**ConcurrentStack**、**ConcurrentDictionary** 和 **ConcurrentBag**。以下是它们最常用的一些成员。\n\
  \n```csharp\n// 以先入先出（FIFO）的顺序处理数据项\npublic class ConcurrentQueue<T> : IProducerConsumerCollection<T>,\n\
  \    IEnumerable<T>, ICollection, IEnumerable {\n\n    public ConcurrentQueue();\n\
  \    public void Enqueue(T item);\n    public Boolean TryDequeue(out T result);\n\
  \    public Int32 Count { get; }\n    public IEnumerator<T> GetEnumerator();\n}\n\
  ```\n\n```csharp\n// 以后入先出（LIFO）的方式处理数据项\npublic class ConcurrentStack<T> : IProducerConsumerCollection<T>,\n\
  \    IEnumerable<T>, ICollection, IEnumerable {\n\n    public ConcurrentStack();\n\
  \    public void Push(T item);\n    public Boolean TryPop(out T result);\n    public\
  \ Int32 Count { get; }\n    public IEnumerator<T> GetEnumerator();\n}\n```\n\n```csharp\n\
  // 一个无序数据项集合，允许重复\npublic class ConcurrentBag<T> : IProducerConsumerCollection<T>,\n\
  \    IEnumerable<T>, ICollection, IEnumerable {\n\n    public ConcurrentBag();\n\
  \    public void Add(T item);\n    public Boolean TryTake(out T result);\n    public\
  \ Int32 Count { get; }\n    public IEnumerator<T> GetEnumerator();\n}\n```\n\n```csharp\n\
  // 一个无序 key/value 对集合\npublic class ConcurrentDictionary<TKey, TValue> : IDictionary<TKey,\
  \ TValue>,\n    ICollection<KeyValuePair<TKey, TValue>>, IEnumerable<KeyValuePair<TKey,\
  \ TValue>>,\n    IDictionary, ICollection, IEnumerable {\n\n    public ConcurrentDictionary();\n\
  \    public Boolean TryAdd(TKey key, TValue value);\n    public Boolean TryGetValue(TKey\
  \ key, out TValue value);\n    public TValue this[TKey key] { get; set; }\n    public\
  \ Boolean TryUpdate(TKey key, TValue newValue, TValue comparisonValue);\n    public\
  \ Boolean TryRemove(TKey key, out TValue value);\n    public TValue AddOrUpdate(TKey\
  \ key, TValue addValue,\n        Func<TKey, TValue> updateValueFactory);\n    public\
  \ TValue GetOrAdd(TKey key, TValue value);\n    public Int32 Count { get; }\n  \
  \  public IEnumerator<KeyValuePair<TKey, TValue>> GetEnumerator();\n}\n```\n\n所有这些集合类都是“非阻塞”的。换言之，如果一个线程试图提取一个不存在的元素（数据项），线程会立即返回；线程不会阻塞在那里，等着一个元素的出现。正是由于这个原因，所以如果获取了一个数据项，像\
  \ **TryDequeue、TryPop、TryTake** 和 **TryGetValue** 这样的方法全都返回 **true**；否则返回 **false**。\n\
  \n一个集合“非阻塞”，并不意味着它就不需要锁了。**ConcurrentDictionary** 类在内部使用了 **Monitor**。但是，对集合中的项进行操作时，锁只被占有极短的时间。**ConcurrentQueue**\
  \ 和 **ConcurrentStack** 确实不需要锁；它们两个在内部都使用 **Interlocked** 的方法来操纵集合。一个 **ConcurrentBag**\
  \ 对象（一个 bag）由大量迷你集合对象构成，每个线程一个。线程将一个项添加到 bag 中时，就用 **Interlocked** 的方法将这个项添加到调用线程的迷你集合中。一个线程试图从\
  \ bag 中提取一个元素时，bag 就检查调用线程的迷你集合，试图从中取出数据项。如果数据项在那里，就用一个 **Interlocked** 方法提取这个项。如果不在，就在内部获取一个\
  \ **Monitor**，以便从另一个线程的迷你集合提取一个项。这称为一个线程从另一个线程“窃取”一个数据项。\n\n注意，所有并发集合类都提供了 **GetEnumerator**\
  \ 方法，它一般用于 C# 的 **foreach** 语句，但也可用于 LINQ。对于 **ConcurrentStack、ConcurrentQueue**\
  \ 和 **ConcurrentBag** 类，**GetEnumerator** 方法获取集合内容的一个“快照”，并从这个快照中返回元素；实际集合的内容可能在使用快照枚举时发生改变。**ConcurrentDictionary**\
  \ 的 **GetEnumerator** 方法不获取它的内容的快照。因此，在枚举字典期间，字典的内容可能改变；这一点务必注意。还要注意的是，**Count**\
  \ 属性返回的是查询时集合中的元素数量。如果其他线程同时正在集合中增删元素，这个计数可能马上就变得不正确了。\n\n**ConcurrentStack、ConcurrentQueue**\
  \ 和 **ConcurrentBag** 这三个并发集合类都实现了 **IProducerConsumerCollection** 接口。接口定义如下：\n\n\
  ```csharp\npublic interface IProducerConsumerCollection<T> : IEnumerable<T>, ICollection,\
  \ IEnumerable {\n    Boolean TryAdd(T item);\n    Boolean TryTake(out T item);\n\
  \    T[] ToArray();\n    void CopyTo(T[] array, Int32 index);\n}\n```\n\n实现了这个接口的任何类都能转变成一个阻塞集合。如果集合已满，那么负责生产（添加）数据项的线程会阻塞；如果集合已空，那么负责消费（移除）数据项的线程会阻塞。当然，我会尽量不使用这种阻塞集合，因为它们生命的全部意义就是阻塞线程。要将非阻塞的集合转变成阻塞集合，需要构造一个\
  \ **System.Collections.Concurrent.BlockingCollection** 类，向它的构造器传递对非阻塞集合的引用。**BlockingCollection**\
  \ 类看起来像下面这样（有的方法未列出）：\n\n```csharp\npublic class BlockingCollection<T> : IEnumerable<T>,\
  \ ICollection, IEnumerable, IDisposable {\n    public BlockingCollection(IProducerConsumerCollection<T>\
  \ collection,\n        Int32 boundedCapacity);\n\n    public void Add(T item);\n\
  \    public Boolean TryAdd(T item, Int32 msTimeout, CancellationToken cancellationToken);\n\
  \    public void CompleteAdding();\n\n    public T Take();\n    public Boolean TryTake(out\
  \ T item, Int32 msTimeout, CancellationToken cancellationToken);\n\n    public Int32\
  \ BoundedCapacity { get; }\n    public Int32 Count { get; }\n    public Boolean\
  \ IsAddingCompleted { get; } // 如果调用了 CompleteAdding，则为 true\n    public Boolean\
  \ IsCompleted { get; } // 如果 IsAddingCompleted 为 true，而且 Count==0，则返回 true\n\n \
  \   public IEnumerable<T> GetConsumingEnumerable(CancellationToken cancellationToken);\n\
  \n    public void CopyTo(T[] array, int index);\n    public T[] ToArray();\n   \
  \ public void Dispose();\n}\n```\n\n构造一个 **BlockingCollection** 时，**boundedCapacity**\
  \ 参数指出你想在集合中最多容纳多少个数据项。在基础集合已满的时候，如果一个线程调用 **Add**，生产线程就会阻塞。如果愿意，生产线程可调用 **TryAdd**，传递一个超时值（以毫秒为单位）和/或一个\
  \ **CancellationToken**，使线程一直阻塞，直到数据项成功添加、超时到期或者 **CancellationToken** 被取消（对 **CancellationToken**\
  \ 类的讨论请参见第 27 章）。\n\n**BlockingCollection** 类实现了 **IDisposable** 接口。调用 **Dispose**\
  \ 时，这个 **Dispose** 会调用基础集合的 **Dispose**。它还会对类内部用于阻塞生产者和消费者的两个 **SemaphoreSlim**\
  \ 对象进行清理。\n\n生产者不再向集合添加更多的项时，生产者应调用 **CompleteAdding** 方法。这会向消费者发出信号，让它们知道不会再生产更多的项了。具体地说，这会造成正在使用\
  \ **GetConsumingEnumerable** 的一个 **foreach** 循环终止。下例演示了如何设置一个生产者/消费者环境，以及如何在完成数据项的添加之后发出通知：\n\
  \n```csharp\npublic static void Main() {\n    var bl = new BlockingCollection<Int32>(new\
  \ ConcurrentQueue<Int32>());\n\n    // 由一个线程池线程执行“消费”\n    ThreadPool.QueueUserWorkItem(ConsumeItems,\
  \ bl);\n\n    // 在集合中添加 5 个数据项\n    for (Int32 item = 0; item < 5; item++) {\n \
  \       Console.WriteLine(\"Producing: \" + item);\n        bl.Add(item);\n    }\n\
  \n    // 告诉消费线程（可能有多个这样的线程），不会在集合中添加更多的项了\n    bl.CompleteAdding();\n\n    Console.ReadLine();\
  \ // 这一行代码是出于测试的目的（防止 Main 返回）\n}\n\nprivate static void ConsumeItems(Object o)\
  \ {\n    var bl = (BlockingCollection<Int32>)o;\n    // 阻塞，直到出现一个数据项。出现后就处理它\n \
  \   foreach (var item in bl.GetConsumingEnumerable()) {\n        Console.WriteLine(\"\
  Consuming: \" + item);\n    }\n\n    // 集合已空，没有更多的项进入其中\n    Console.WriteLine(\"\
  All items have been consumed\");\n}\n```\n\n在我自己的机器上执行上述代码，得到以下输出：\n\n```text\n\
  Producing: 0\nProducing: 1\nProducing: 2\nProducing: 3\nProducing: 4\nConsuming:\
  \ 0\nConsuming: 1\nConsuming: 2\nConsuming: 3\nConsuming: 4\nAll items have been\
  \ consumed\n```\n\n你自己执行上述代码时，“Producing”和“Consuming”行可能交错出现。但“All items have been\
  \ consumed”这一行必然最后出现。\n\n**BlockingCollection** 类还提供了静态 **AddToAny**、**TryAddToAny**、**TakeFromAny**\
  \ 和 **TryTakeFromAny** 方法。所有这些方法都获取一个 **BlockingCollection<T>[]**，以及一个数据项、一个超时值以及一个\
  \ **CancellationToken**。（Try）AddToAny 方法遍历数组中的所有集合，直到发现因为容量还没有达到（还没有满），而能够接受数据项的一个集合。（Try）TakeFromAny\
  \ 方法则遍历数组中的所有集合，直到发现一个能从中移除一个数据项的集合。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_743_0.png)\n"
