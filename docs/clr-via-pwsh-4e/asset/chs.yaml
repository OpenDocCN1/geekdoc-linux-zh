  将隐藏继承的\n            成员\"CompanyA.Phone.EstablishConnection()\"。若要使当前成员\n       \
  \     重写该实现，请添加关键字 override。否则，添加关键字 new。\n```\n\n编译器警告 Phone 和 BetterPhone 都提供了\
  \ EstablishConnection 方法，而且两者的语义可能不一致。只是简单地重新编译 BetterPhone，可能无法获得和使用第一个版本的 Phone\
  \ 类型时相同的行为。\n\n如果 CompanyB 认定 EstablishConnection 方法在两个类型中的语义不一致，CompanyB 可以告诉编译器使用\
  \ BetterPhone 类中定义的 Dial 和 EstablishConnection 方法，它们与基类型 Phone 中定义的 EstablishConnection\
  \ 方法没有关系。CompanyB 可以为 EstablishConnection 方法添加 new 关键字来告诉编译器这一点。\n\n```csharp\n\
  namespace CompanyB {\n    public class BetterPhone : CompanyA.Phone {\n\n      \
  \  // 保留关键字 new，指明该方法与基类型的\n        // Dial 方法没有关系\n        public new void Dial()\
  \ {\n            Console.WriteLine(\"BetterPhone.Dial\");\n            EstablishConnection();\n\
  \            base.Dial();\n        }\n\n        // 为这个方法添加关键字 new，指明该方法与基类型的\n \
  \       // EstablishConnection 方法没有关系\n        protected new virtual void EstablishConnection()\
  \ {\n            Console.WriteLine(\"BetterPhone.EstablishConnection\");\n     \
  \       // 在这里执行建立连接的操作\n        }\n    }\n}\n```\n\n在这段代码中，关键字 new 告诉编译器生成元数据，让\
  \ CLR 知道 BetterPhone 类型的 EstablishConnection 方法应被视为由 BetterPhone 类型引入的新函数。这样 CLR\
  \ 就知道 Phone 和 BetterPhone 这两个类中的方法无任何关系。\n\n执行相同的应用程序代码（前面列出的 **Main** 方法中的代码），输出结果如下所示：\n\
  \n```text\nBetterPhone.Dial\nBetterPhone.EstablishConnection\nPhone.Dial\nPhone.EstablishConnection\n\
  ```\n\n这个输出表明，在 **Main** 方法中调用 **Dial**，调用的是 **BetterPhone** 类定义的新 **Dial** 方法。后者调用了同样由\
  \ **BetterPhone** 类定义的虚方法 **EstablishConnection**。**BetterPhone** 的 **EstablishConnection**\
  \ 方法返回后，将调用 **Phone** 的 **Dial** 方法。**Phone** 的 **Dial** 方法调用了 **EstablishConnection**，但由于\
  \ **BetterPhone** 的 **EstablishConnection** 使用 **new** 进行了标识，所以不认为 **BetterPhone**\
  \ 的 **EstablishConnection** 是对 **Phone** 的虚方法 **EstablishConnection** 的重写。最终结果是，**Phone**\
  \ 的 **Dial** 方法调用了 **Phone** 的 **EstablishConnection** 方法——这正是我们所期望的。\n\n> **注意**　如果编译器像原生\
  \ C++ 编译器那样默认将方法视为重写，**BetterPhone** 的开发者就不能使用 **Dial** 和 **EstablishConnection**\
  \ 方法名了。这极有可能造成整个源代码 base 的连锁反应，破坏源代码和二进制兼容性。这种波及面太大的改变是我们不希望的，尤其是中大型的项目。但是，如果更改方法名只会造成源代码发生适度更新，就应该更改方法名，避免\
  \ **Dial** 和 **EstablishConnection** 方法的两种不同的含义使开发人员产生混淆。\n\n还有一个办法是，**CompanyB**\
  \ 可以获得 **CompanyA** 的新版本 **Phone** 类型，并确定 **Dial** 和 **EstablishConnection** 在 **Phone**\
  \ 中的语义正好是他们所希望的。这种情况下，**CompanyB** 可通过完全移除 **Dial** 方法来修改他们的 **BetterPhone** 类型。另外，由于\
  \ **CompanyB** 现在希望告诉编译器，**BetterPhone** 的 **EstablishConnection** 方法和 **Phone**\
  \ 的 **EstablishConnection** 方法是相关的，所以必须移除 **new** 关键字。但是，仅仅移除 **new** 关键字还不够，因为编译器目前还无法准确判断\
