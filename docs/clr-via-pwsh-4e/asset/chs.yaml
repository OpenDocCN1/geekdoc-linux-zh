  从事软件开发的人，都是耐得住寂寞的人。Jeffrey 不仅耐得住寂寞，还在自己的专业领域取得了很高的造诣。取得了很高的造诣不说，他还愿意将自己的心得与大家分享。愿意和大家分享不说，他还非常实诚，真心想把自己的全部知识都清楚地交待给读者。字里行间，全是殷殷叮嘱。无浮夸之文字，倾心血而写就，近十年之所悟，尽呈现于本书。


  读完这本书，你的心灵会受到极大的震撼。原因很简单，以前许多似懂非懂的概念，现在变得清晰明了；以前自以为是的做法，现在得到彻底纠正；以前艰苦摸索的编程技巧，现在如同
  1+1 一样简单。


  Jeffrey 最擅长的就是把最基本的东西讲清楚。你以前或许知道 1+1 等于 2，但他会把 1+1 为什么等于 2 讲得明明白白。最终你会有一种顿悟的感觉，然后自动地知道
  1+2 等于几，2+2 等于几。不需要翻阅其他书籍来查询结果。


