  \ 定制特性\n- 第19章 可空值类型\n\n# \n\n- 第14章 字符、字符串和文本处理\n- 第15章 枚举和其他类型\n- 第16章 数组\n- 第17章\
  \ 指针\n- 第18章 结构体\n- 第19章 联合和位段\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_295_0.png)\n"
- "## 第 14 章　字符、字符串和文本处理\n\n本章内容：\n\n- 字符\n- **System.String** 类型\n- 高效率构造字符串\n- 获取对象的字符串表示：**ToString**\n\
  - 解析字符串来获取对象：**Parse**\n- 编码：字符和字节的相互转换\n- 安全字符串\n\n本章将解释在 **Microsoft .NET Framework**\
  \ 中处理字符和字符串的机制。首先讨论 **System.Char** 结构以及处理字符的多种方式。然后讨论更有用的 **System.String** 类，它允许处理不可变(immutable)字符串(一经创建，字符串便不能以任何方式修改)。探讨了字符串之后，将介绍如何使用\
  \ **System.Text.StringBuilder** 类高效率地动态构造字符串。掌握了字符串的基础知识之后，将讨论如何将对象格式化成字符串，以及如何使用各种编码方案高效率地持久化或传输字符串。最后讨论\
  \ **System.Security.SecureString** 类，它保护密码和信用卡资料等敏感字符串。\n\n### 14.1　字符\n\n在.NET\
  \ Framework 中，字符总是表示成 16 位 Unicode 代码值，这简化了国际化应用程序的开发。每个字符都是 **System.Char** 结构(一个值类型)的实例。**System.Char**\
  \ 类型很简单，提供了两个公共只读常量字段：**MinValue**(定义成'\\0') 和 **MaxValue**(定义成'\\uffff')。\n\n为\
  \ **Char** 的实例调用静态 **GetUnicodeCategory** 方法返回 **System.Globalization.UnicodeCategory**\
  \ 枚举类型的一个值，表明该字符是由 Unicode 标准定义的控制字符、货币符号、小写字母、大写字母、标点符号、数学符号还是其他字符。\n\n为了简化开发，**Char**\
  \ 类型还提供了几个静态方法，包括 **IsDigit**、**IsLetter**、**IsUpper**、**IsLower**、**IsPunctuation**、**IsLetterOrDigit**、**IsControl**、**IsNumber**、**IsSeparator**、**IsSurrogate**，\n\
  \n- 转型(强制类型转换)\n\n  将 Char 转换成数值(比如 Int32)最简单的办法就是转型。这是三种技术中效率最高的，因为编译器会生成中间语言(IL)指令来执行转换，而且不必调用方法。此外，有的语言(比如\
  \ C#)允许指定转换时是使用 checked 还是 unchecked 代码(参见 5.1 节“编程语言的基元类型”)。\n\n- 使用 Convert 类型\n\
  \n  **System.Convert** 类型提供了几个静态方法来实现 Char 和数值类型的相互转换。所有这些转换都以 checked 方式执行，发现转换将造成数据丢失就抛出\
  \ **OverflowException** 异常。\n\n- 使用 IConvertible 接口\n\n  Char 类型和 FCL 中的所有数值类型都实现了\
  \ **IConvertible** 接口。该接口定义了像 **ToUInt16** 和 **ToChar** 这样的方法。这种技术效率最差，因为在值类型上调用接口方法要求对实例进行装箱——Char\
  \ 和所有数值类型都是值类型。如果某个类型不能转换(比如 Char 转换成 Boolean)，或者转换将造成数据丢失，IConvertible 的方法会抛出 **System.InvalidCastException**\
  \ 异常。注意，许多类型(包括 FCL 的 Char 和数值类型)都将 IConvertible 的方法实现为显式接口成员。这意味着为了调用接口的任何方法，都必须先将实例显式转型为一个\
  \ IConvertible。IConvertible 的所有方法(GetTypeCode 除外)都接受对实现了 **IFormatProvider** 接口的一个对象的引用。如果转换时需要考虑语言文化信息，该参数就很有用。但大多数时候都可以忽略语言文化，为这个参数传递\
  \ **null** 值。\n\n以下代码演示了如何使用这三种技术。\n\n```csharp\nusing System;\n\npublic static\
  \ class Program {\n  public static void Main() {\n    Char c;\n    Int32 n;\n\n\
  \    // 通过 C#转型(强制类型转换)实现数字与字符的相互转换\n    c = (Char) 65;\n    Console.WriteLine(c);\
  \             // 显示\"A\"\n\n    n = (Int32) c;\n    Console.WriteLine(n);      \
  \       // 显示\"65\"\n\n    c = unchecked((Char) (65536 + 65));\n    Console.WriteLine(c);\
  \             // 显示\"A\"\n\n    // 使用 Convert 实现数字与字符的相互转换\n    c = Convert.ToChar(65);\n\
  \    Console.WriteLine(c);             // 显示\"A\"\n\n    n = Convert.ToInt32(c);\n\
  \    Console.WriteLine(n);             // 显示\"65\"\n```\n\n```csharp\n// 演示 Convert\
  \ 的范围检查\ntry {\n    c = Convert.ToChar(70000);    // 对 16 位来说过大\n    Console.WriteLine(c);\
  \         // 不执行\n}\ncatch (OverflowException) {\n    Console.WriteLine(\"Can't\
  \ convert 70000 to a Char.\");\n}\n\n// 使用 IConvertible 实现数字与字符的相互转换\nc = ((IConvertible)\
  \ 65).ToChar(null);\nConsole.WriteLine(c); // 显示\"A\"\n\nn = ((IConvertible) c).ToInt32(null);\n\
  Console.WriteLine(n); // 显示\"65\"\n}\n}\n```\n\n### 14.2 System.String 类型\n\n在任何应用程序中，**System.String**\
  \ 都是用得最多的类型之一。一个 **String** 代表一个不可变（immutable）的顺序字符集。**String** 类型直接派生自 **Object**，所以是引用类型。因此，**String**\
  \ 对象（它的字符数组）总是存在于堆上，永远不会跑到线程栈。**String** 类型还实现了几个接口（**IComparable/IComparable<String>、ICloneable、IConvertible、IEnumerable/IEnumerable<Char>**\
  \ 和 **IEquatable<String>**）。\n\n### 14.2.1 构造字符串\n\n许多编程语言（包括 C#）都将 **String** 视为基元类型——也就是说，编译器允许在源代码中直接使用字面值（literal）字符串。编译器将这些字符串放到模块的元数据中，并在运行时加载和引用它们。\n\
  \nC#不允许使用 **new** 操作符从字面值字符串构造 **String** 对象：\n\n```csharp\nusing System;\n\npublic\
  \ static class Program {\n    public static void Main() {\n        String s = new\
  \ String(\"Hi there.\"); // 错误\n        Console.WriteLine(s);\n    }\n}\n```\n\n\
  相反，必须使用以下简化语法：\n\n```csharp\nusing System;\n\npublic static class Program {\n  \
  \  public static void Main() {\n        String s = \"Hi there.\";\n        Console.WriteLine(s);\n\
  \    }\n}\n```\n\n① 堆和线程栈的详情请参见 4.4 节“运行时的相互关系”。\n\n```csharp\nString s = \"Hi\"\
  \ + \" \" + \"there.\";\n```\n\n在上述代码中，由于所有字符串都是字面值，所以 C#编译器能在编译时连接它们，最终只将一个字符串(即\"\
  Hi there.\")放到模块的元数据中。对非字面值字符串使用+操作符，连接则在运行时进行。运行时连接不要使用+操作符，因为这样会在堆上创建多个字符串对象，而堆是需要垃圾回收的，对性能有影响。相反，应该使用\
  \ **System.Text.StringBuilder** 类型(本章稍后详细解释)。\n\n最后，C#提供了一种特殊的字符串声明方式。采取这种方式，引号之间的所有字符都会被视作字符串的一部分。这种特殊声明称为“逐字字符串”(verbatim\
  \ string)，通常用于指定文件或目录的路径，或者与正则表达式配合使用。以下代码展示了如何使用和不使用逐字字符串字符(@)来声明同一个字符串：\n\n```csharp\n\
  // 指定应用程序路径\nString file = \"C:\\\\Windows\\\\System32\\\\Notepad.exe\";\n\n// 使用逐字字符串指定应用程序路径\n\
  String file = @\"C:\\Windows\\System32\\Notepad.exe\";\n```\n\n两种写法在程序集的元数据中生成完全一样的字符串，但后者可读性更好。在字符串之前添加@符号使编译器知道这是逐字字符串。编译器会将反斜杠字符视为字面值(literal)而非转义符，使文件路径在源代码中更易读。\n\
  \n了解了如何构造字符串之后，接着探讨可以在 **String** 对象上执行的操作。\n\n### 14.2.2 字符串是不可变的\n\n**String**\
  \ 对象最重要的一点就是不可变(immutable)。也就是说，字符串一经创建便不能更改，不能变长、变短或修改其中的任何字符。使字符串不可变有几方面的好处。首先，它允许在一个字符串上执行各种操作，而不实际地更改字符串：\n\
  \n```csharp\nif (s.ToUpperInvariant().Substring(10, 21).EndsWith(\"EXE\")) {\n \
  \   ...\n}\n```\n\n**ToUpperInvariant** 返回一个新字符串；它没有修改字符串 **s** 的字符。在 **ToUpperInvariant**\
  \ 返回的字符串上执行的 **Substring** 操作也返回新字符串。然后，**EndsWith** 对这个字符串进行检查。代码不会长时间引用由 **ToUpperInvariant**\
  \ 和 **Substring** 创建的两个临时字符串，垃圾回收器会在下次回收时回收它们的内存。如果执行大量字符串操作，会在堆上创建大量 **String**\
  \ 对象，造成更频繁的垃圾回收，从而影响应用程序性能。要高效执行大量字符串操作，建议使用 **StringBuilder** 类。\n\n字符串不可变还意味着在操纵或访问字符串时不会发生线程同步问题。此外，CLR\
  \ 可通过一个 **String** 对象共享多个完全一致的 **String** 内容。这样能减少系统中的字符串数量——从而节省内存——这就是所谓的“字符串留用”(string\
  \ interning)①。\n\n① MSDN 文档将 interning 翻译成“拘留”，专门供字符串留用的表称为“拘留池”。本书采用“留用”这一译法。这个技术的详情将在本章后面详细解释。——译注\n\
  \n出于对性能的考虑，String 类型与 CLR 紧密集成。具体地说，CLR 知道 String 类型中定义的字段如何布局，会直接访问这些字段。但为了获得这种性能和直接访问的好处，String\
  \ 只能是密封类。换言之，不能把它作为自己类型的基类。如果允许 String 作为基类来定义自己的类型，就能添加自己的字段，而这会破坏 CLR 对于 String\
  \ 类型的各种预设。此外，还可能破坏 CLR 团队因为 String 对象“不可变”而做出的各种预设。\n\n### 14.2.3 比较字符串\n\n“比较”或许是最常见的字符串操作。一般因为两个原因要比较字符串：判断相等性或者排序(通常是为了显示给用户看)。\n\
  \n判断字符串相等性或排序时，强烈建议调用 String 类定义的以下方法之一：\n\n```csharp\nBoolean Equals(String value,\
  \ StringComparison comparisonType)\nstatic Boolean Equals(String a, String b, StringComparison\
  \ comparisonType)\n\nstatic Int32 Compare(String strA, String strB, StringComparison\
  \ comparisonType)\nstatic Int32 Compare(string strA, string strB, Boolean ignoreCase,\
  \ CultureInfo culture)\nstatic Int32 Compare(String strA, String strB, CultureInfo\
  \ culture, CompareOptions options)\nstatic Int32 Compare(String strA, Int32 indexA,\
  \ String strB, Int32 indexB, Int32 length,\n    StringComparison comparisonType)\n\
  static Int32 Compare(String strA, Int32 indexA, String strB, Int32 indexB, Int32\
  \ length,\n    CultureInfo culture, CompareOptions options)\nstatic Int32 Compare(String\
  \ strA, Int32 indexA, String strB, Int32 indexB, Int32 length,\n    Boolean ignoreCase,\
  \ CultureInfo culture)\n\nBoolean StartsWith(String value, StringComparison comparisonType)\n\
  Boolean StartsWith(String value,\n    Boolean ignoreCase, CultureInfo culture)\n\
  \nBoolean EndsWith(String value, StringComparison comparisonType)\nBoolean EndsWith(String\
  \ value, Boolean ignoreCase, CultureInfo culture)\n```\n\n排序时应该总是执行区分大小写的比较。原因是假如只是大小写不同的两个字符串被视为相等，那么每次排序都可能按不同顺序排列，用户会感到困惑。\n\
  \n**comparisonType** 参数(上述大多数方法都有)要求获取由 **StringComparison** 枚举类型定义的某个值。该枚举类型的定义如下所示：\n\
  \n```csharp\npublic enum StringComparison {\n    CurrentCulture = 0,\n    CurrentCultureIgnoreCase\
  \ = 1,\n    InvariantCulture = 2,\n    InvariantCultureIgnoreCase = 3,\n    Ordinal\
  \ = 4,\n    OrdinalIgnoreCase = 5\n}\n```\n\n另外，前面有两个方法要求传递一个 **options** 参数，它是\
  \ **CompareOptions** 枚举类型定义的值之一：\n\n```csharp\n[Flags]\npublic enum CompareOptions\
  \ {\n    None = 0,\n    IgnoreCase = 1,\n    IgnoreNonSpace = 2,\n    IgnoreSymbols\
  \ = 4,\n    IgnoreKanaType = 8,\n    IgnoreWidth = 0x00000010,\n    Ordinal = 0x40000000,\n\
  \    OrdinalIgnoreCase = 0x10000000,\n    StringSort = 0x20000000\n}\n```\n\n接受\
  \ **CompareOptions** 实参的方法要求显式传递语言文化，传递 **Ordinal** 或 **OrdinalIgnoreCase** 标志，这些\
  \ **Compare** 方法会忽略指定的语言文化。\n\n许多程序都将字符串用于内部编程目的，比如路径名、文件名、URL、注册表项/值、环境变量、反射、XML\
  \ 标记、XML 特性等。这些字符串通常只在程序内部使用，不向用户显示。出于编程目的而比较字符串时，应该总是使用 **StringComparison.Ordinal**\
  \ 或者 **StringComparison.OrdinalIgnoreCase**。忽略语言文化是字符串比较最快的方式。\n\n另一方面，要以语言文化正确的方式来比较字符串（通常为了向用户显示），就应该使用\
  \ **StringComparison.CurrentCulture** 或者 **StringComparison.CurrentCultureIgnoreCase**。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_302_0.png)\n\n> **重要提示**　**StringComparison.InvariantCulture**\
  \ 和 **StringComparison.InvariantCultureIgnoreCase** 平时最好不要用。虽然这两个值能保证比较时的语言文化正确性，但用来比较内部编程所需的字符串，所花的时间远超出序号比较。此外，如果传递\
  \ **StringComparison.InvariantCulture**（固定语言文化），其实就是不使用任何具体的语言文化。所以在处理要向用户显示的字符串时，选择它并不恰当。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_302_1.png)\n\n> **重要提示**　要在序号比较前更改字符串中的字符的大小写，应该使用\
  \ **String.ToUpperInvariant** 或 **ToLowerInvariant** 方法。强烈建议用 **ToUpperInvariant**\
  \ 方法对字符串进行正规化(normalizing)，而不要用 **ToLowerInvariant**，因为 Microsoft 对执行大写比较的代码进行了优化。事实上，执行不区分大小写的比较之前，FCL\
  \ 会自动将字符串正规化为大写形式。之所以要用 **ToUpperInvariant** 和 **ToLowerInvariant** 方法，是因为 **String**\
  \ 类没有提供 **ToUpperOrdinal** 和 **ToLowerOrdinal** 方法。所以不用 **ToUpper** 和 **ToLower**\
  \ 方法，是因为它们对语言文化敏感。\n\n以语言文化正确的方式比较字符串时，有时需要指定另一种语言文化，而不是使用与调用线程关联的那一种。这时可用前面列出的\
  \ **StartsWith**、**EndsWith** 和 **Compare** 方法的重载版本，它们都接受 **Boolean** 和 **CultureInfo**\
  \ 参数。\n\n① 传递 **StringComparison.Ordinal** 执行的就是序号比较，也就是不考虑语言文化信息，只比较字符串中的每个 **Char**\
  \ 的 Unicode 码位。——译注\n\n> **重要提示**　除了前面列出的之外，String 类型还为 Equals、StartsWith、EndsWith\
  \ 和 Compare 方法定义了其他几个重载版本。但是，Microsoft 建议避免使用这些额外的版本（也就是本书没有列出的版本）。除此之外，String 的其他比较方法——CompareTo（IComparable\
  \ 接口所要求的）、CompareOrdinal 以及 == 和 != 操作符——也应避免使用。之所以要避免使用这些方法和操作符，是因为调用者不显式指出以什么方式执行字符串比较，而你无法从方法名看出默认比较方式。例如，CompareTo\
  \ 默认执行对语言文化敏感的比较，而 Equals 执行普通的序号（ordinal）比较。如果总是显式地指出以什么方式执行字符串比较，代码将更容易阅读和维护。\n\
  \n现在重点讲一下如何执行语言文化正确的比较。.NET Framework 使用 **System.Globalization.CultureInfo** 类型表示一个“语言/国家”对（根据\
  \ RFC 1766 标准）。例如，“en-US”代表美国英语，“en-AU”代表澳大利亚英语，而“de-DE”代表德国德语。在 CLR 中，每个线程都关联了两个特殊属性，每个属性都引用一个\
  \ **CultureInfo** 对象。两个属性的具体描述如下。\n\n- **CurrentUICulture 属性**　该属性获取要向用户显示的资源。它在\
  \ GUI 或 Web 窗体应用程序中特别有用，因为它标识了在显示 UI 元素（比如标签和按钮）时应使用的语言。创建线程时，这个线程属性会被设置成一个默认的 **CultureInfo**\
  \ 对象，该对象标识了正在运行应用程序的 Windows 版本所用的语言。而这个语言是用 Win32 函数 **GetUserDefaultUILanguage**\
  \ 来获取的。如果应用程序在 Windows 的 MUI（多语言用户界面，Multilingual User Interface）版本上运行，可通过控制面板的“区域和语言”对话框来修改语言。在非\
  \ MUI 版本的 Windows 上，语言由安装的操作系统的本地化版本（或者安装的语言包）决定，而且这个语言不可更改。\n\n- **CurrentCulture\
  \ 属性**　不适合使用 **CurrentUICulture** 属性的场合就使用该属性，例如数字和日期格式化、字符串大小写转换以及字符串比较。格式化要同时用到\
  \ **CultureInfo** 对象的“语言”和“国家”部分。创建线程时，这个线程属性被设为一个默认的 **CultureInfo** 对象，其值通过调用\
  \ Win32 函数 **GetUserDefaultLCID** 来获取。可通过 Windows 控制面板的“区域和语言”对话框来修改这个值。\n\n在许多计算机上，线程的\
  \ **CurrentUICulture** 和 **CurrentCulture** 属性都被设为同一个 **CultureInfo** 对象。也就是说，它们使用相同的“语言/国家”信息。但也可把它们设为不同对象。例如，在美国运行的一个应用程序可能要用西班牙语来显示它的所有菜单项以及其他\
  \ GUI 元素，同时仍然要正确显示美国的货币和日期格式。为此，线程的 **CurrentUICulture** 属性要引用一个 **CultureInfo**\
  \ 对象，该对象使用“es”（代表西班牙语）初始化。线程的 **CurrentCulture** 属性要引用另一个 **CultureInfo** 对象，用“en-US”初始化。\n\
  \n**CultureInfo** 对象内部的一个字段引用了一个 **System.Globalization.CompareInfo** 对象，该对象封装了语言文化的字符排序表信息（根据\
  \ Unicode 标准的定义）。以下代码演示了序号比\n\n比较和对语言文化敏感的比较的区别：\n\n```csharp\nusing System;\nusing\
  \ System.Globalization;\n\npublic static class Program {\n    public static void\
  \ Main() {\n        String s1 = \"Strasse\";\n        String s2 = \"Straße\";\n\
  \        Boolean eq;\n\n        // Compare 返回非零值①\n        eq = String.Compare(s1,\
  \ s2, StringComparison.Ordinal) == 0;\n        Console.WriteLine(\"Ordinal comparison:\
  \ '{0}' {2} '{1}'\", s1, s2,\n            eq ? \"==\" : \"!=\");\n\n        // 面向在德国\
  \ (DE) 说德语 (de) 的人群，\n        // 正确地比较字符串\n        CultureInfo ci = new CultureInfo(\"\
  de-DE\");\n\n        // Compare 返回零值\n        eq = String.Compare(s1, s2, true,\
  \ ci) == 0;\n        Console.WriteLine(\"Cultural comparison: '{0}' {2} '{1}'\"\
  , s1, s2,\n            eq ? \"==\" : \"!=\");\n    }\n}\n```\n\n```text\nOrdinal\
  \ comparison: 'Strasse' != 'Straße'\nCultural comparison: 'Strasse' == 'Straße'\n\
  ```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_304_0.png)\n\n> **注意** **Compare**\
  \ 方法如果执行的不是序号比较就会进行“字符展开”(character expansion)，也就是将一个字符展开成忽视语言文化的多个字符。在前例中，德语 Eszett\
  \ 字符“ß”总是展开成“ss”。类似地，“Æ”连字总是展开成“AE”。所以在上述代码中，无论传递什么语言文化，对 **Compare** 的第二个调用始终返回\
  \ 0。\n\n比较字符串以判断相等性或执行排序时，偶尔需要更多的控制。例如，比较日语字符串时就可能有这个需要。额外的控制通过 **CultureInfo**\
  \ 对象的 **CompareInfo** 属性获得。前面说过，**CompareInfo** 对象封装了一种语言文化的字符比较表，每种语言文化只有一个 **CompareInfo**\
  \ 对象。\n\n调用 **String** 的 **Compare** 方法时，如果调用者指定了语言文化，就使用指定的语言文化；如果没有指定，就使用调用线程的\
  \ **CurrentCulture** 属性值。**Compare** 方法内部会获取与特定语言文化匹配的 **CompareInfo** 对象引用，并调用\
  \ **CompareInfo** 对象的 **Compare** 方法，传递恰当的选项(比如不区分大小写)。自然，如果需要额外的控制，可以自己调用一个特定 **CompareInfo**\
  \ 对象的 **Compare** 方法。\n\n① **Compare** 返回 **Int32** 值：非零表示不相等，零表示相等。非零和零分别对应 **true**\
  \ 和 **false**，所以后面的代码将比较结果与 **0(false)** 进行比较，将 **true** 或 **false** 结果赋给 **eq**\
  \ 变量。——译注\n\n**CompareInfo** 类型的 Compare 方法获取来自 CompareOptions 枚举类型①的一个值作为参数。该枚举类型定义的符号代表一组位标志(bit\
  \ flag)，对这些位标志执行 OR 运算就能更全面地控制字符串比较。请参考文档获取这些符号的完整描述。\n\n① 前面已经展示过 **CompareOptions**\
  \ 枚举类型。\n\n以下代码演示了语言文化对于字符串排序的重要性，并展示了执行字符串比较的各种方式：\n\n```csharp\nusing System;\n\
  using System.Text;\nusing System.Windows.Forms;\nusing System.Globalization;\nusing\
  \ System.Threading;\n\npublic static class Program {\n    public static void Main()\
  \ {\n        String output = String.Empty;\n        String[] symbol = new String[]\
  \ { \"<\", \"=\", \">\" };\n        Int32 x;\n        CultureInfo ci;\n\n      \
  \  // 以下代码演示了在不同语言文化中，\n        // 字符串的比较方式也有所不同\n        String s1 = \"cote\";\n\
  \        String s2 = \"coté\";\n\n        // 为法国语言排序字符串\n        ci = new CultureInfo(\"\
  fr-FR\");\n        x = Math.Sign(ci.CompareInfo.Compare(s1, s2));\n        output\
  \ += String.Format(\"{0} Compare: {1} | {3} | {2}\",\n            ci.Name, s1, s2,\
  \ symbol[x + 1]);\n        output += Environment.NewLine;\n\n        // 为日本日语排序字符串\n\
  \        ci = new CultureInfo(\"ja-JP\");\n        x = Math.Sign(ci.CompareInfo.Compare(s1,\
  \ s2));\n        output += String.Format(\"{0} Compare: {1} | {3} | {2}\",\n   \
  \         ci.Name, s1, s2, symbol[x + 1]);\n        output += Environment.NewLine;\n\
  \n        // 为当前线程的当前语言文化排序字符串\n        ci = Thread.CurrentThread.CurrentCulture;\n\
  \        x = Math.Sign(ci.CompareInfo.Compare(s1, s2));\n        output += String.Format(\"\
  {0} Compare: {1} | {3} | {2}\",\n            ci.Name, s1, s2, symbol[x + 1]);\n\
  \        output += Environment.NewLine + Environment.NewLine;\n\n        // 以下代码演示了如何将\
  \ CompareInfo.Compare 的\n        // 高级选项应用于两个日语字符串。\n        // 一个字符串代表采用平假名写成的单词“shinkansen”（新干线）；\n\
  \        // 另一个字符串代表用片假名写成的同一个单词\n        s1 = \"しんかんせん\";  // (\"\\\\u3057\\\\\
  u3093\\\\u304b\\\\u3093\\\\u305b\\\\u3093\")\n        s2 = \"シンカセン\";   // (\"\\\
  \\u30b7\\\\u30f3\\\\u30ab\\\\u30f3\\\\u30bb\\\\u30f3\")\n\n        // 以下是默认比较结果\n\
  \        ci = new CultureInfo(\"ja-JP\");\n        x = Math.Sign(String.Compare(s1,\
  \ s2, true, ci));\n        output += String.Format(\"Simple {0} Compare: {1} {3}\
  \ {2}\",\n            ci.Name, s1, s2, symbol[x + 1]);\n        output += Environment.NewLine;\n\
  \n        // 以下是忽略日语假名的比较结果\n        CompareInfo compareInfo = CompareInfo.GetCompareInfo(\"\
  ja-JP\");\n        x = Math.Sign(compareInfo.Compare(s1, s2, CompareOptions.IgnoreKanaType));\n\
  \        output += String.Format(\"Advanced {0} Compare: {1} {3} {2}\",\n      \
