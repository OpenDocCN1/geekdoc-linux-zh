- "## 第26章 线程基础\n\n本章内容：\n\n- Windows 为什么要支持线程\n- 线程开销\n- 停止疯狂\n- CPU 发展趋势\n- CLR\
  \ 线程和 Windows 线程\n- 使用专用线程执行异步的计算限制操作\n- 使用线程的理由\n- 线程调度和优先级\n- 前台线程和后台线程\n- 继续学习\n\
  \n本章将介绍线程的基本概念，帮助开发人员理解线程及其使用。我将解释 Microsoft Windows 为什么引入线程的概念、CPU 发展趋势、CLR 线程和\
  \ Windows 线程的关系、线程开销、Windows 如何调度线程以及公开了线程属性的 Microsoft .NET Framework 类。\n\n本书第\
  \ V 部分“线程处理”的各个章节将解释 Windows 和 CLR 如何协同提供一个线程处理架构。希望通过这些内容帮你打下一个良好的基础，学会高效使用线程来设计和构建响应灵敏的、可靠的、可伸缩的应用程序和组件。\n\
  \n### 26.1 Windows 为什么要支持线程\n\n在计算机的早期岁月，操作系统没有线程的概念。事实上，整个系统只运行着一个执行线程，其中同时包含操作系统代码和应用程序代码。只用一个执行线程的问题在于，长时间运行的任务会阻止其他任务执行。例如，在\
  \ 16 位 Windows 的那些日子，打印文档的应用程序很容易“冻结”整个机器，造成 OS(操作系统)和其他应用程序停止响应。有些应用程序的 bug 会造成死循环，同样会造成整个机器停止工作。\n\
  \n遇到这个问题，用户只好按 Reset 键或电源开关重启计算机。用户对此深恶痛绝(事实上，他们现在一样会)，因为所有正在运行的应用程序都会终止。更重要的是，这些应用程序正在处理的数据都会无端地丢失。\n\
  \nMicrosoft 明白 16 位 Windows 不是理想的操作系统。随着计算机工业的持续进步，它不足以使 Microsoft 保持领先地位。所以，他们计划构建一个新的\
  \ OS 来满足企业和个人的需要。这个新的 OS 必须健壮、可靠、易于伸缩和安全，而且它必须弥补 16 位 Windows 的许多不足。新的 OS 内核最初通过\
  \ Microsoft Windows NT 发布。经过多年的发展，它已进行了大量改进，增加了大量功能。Microsoft 每次发布客户端和服务器 Windows\
  \ 操作系统的最新版本时，都在其中采用了这个内核的最新版本。\n\nMicrosoft 设计这个 OS 内核时，决定在一个进程中运行应用程序的每个实例。进程实际是应用程序的实例要使用的资源的集合。每个进程都被赋予了一个虚拟地址空间，确保在一个进程中使用的代码和数据无法由另一个进程访问。这就确保了应用程序实例的健壮性，因为一个进程无法破坏另一个进程使用的代码或数据。此外，进程访问不了\
  \ OS 的内核代码和数据；所以，应用程序代码破坏不了操作系统代码或数据。由于应用程序代码破坏不了其他应用程序或者 OS 自身，所以用户的计算体验变得更好了。除此之外，系统变得比以往更安全，因为应用程序代码无法访问另一个应用程序或者\
  \ OS 自身使用的用户名、密码、信用卡资料或其他敏感信息。\n\n听起来不错，但 CPU 本身呢？应用程序发生死循环会发生什么？如果机器只有一个 CPU，它会执行死循环，不能执行其他任何东西。所以，虽然数据无法被破坏，而且更安全，但系统仍然可能停止响应。Microsoft\
  \ 需要修正这个问题，他们拿出的方案就是线程。作为一个 Windows 概念，线程的职责是对 CPU 进行虚拟化。Windows 为每个进程都提供了该进程专用的线程(功能相当于一个\
  \ CPU)。应用程序的代码进入死循环，与那个代码关联的进程会“冻结”，但其他进程(它们有自己的线程)不会冻结，它们会继续执行！\n\n### 26.2 线程开销\n\
  \n线程很强大，因为它们使 Windows 即使在执行长时间运行的任务时也能随时响应。另外，线程允许用户使用一个应用程序(比如“任务管理器”)强制终止似乎已经冻结的应用程序(它也有可能正在执行一个长时间运行的任务)。但和一切虚拟化机制一样，线程有空间(内存耗用)和时间(运行时的执行性能)上的开销。\n\
  \n下面更详细地探讨这种开销。每个线程都有以下要素。\n\n- **线程内核对象(thread kernel object)**\n  OS 为系统中创建的每个线程都分配并初始化这种数据结构之一。数据结构包含一组对线程进行描述的属性(本章后面讨论)。数据结构还包含所谓的线程上下文(thread\
  \ context)。上下文是包含 CPU 寄存器集合的内存块。对于 x86，x64 和 ARM CPU 架构，线程上下文分别使用约 700，1240 和 350\
  \ 字节的内存。\n\n- **线程环境块(thread environment block，TEB)**\n  TEB 是在用户模式(应用程序代码能快速访问的地址空间)中分配和初始化的内存块。TEB\
  \ 耗用 1 个内存页(x86，x64 和 ARM CPU 中是 4 KB)。TEB 包含线程的异常处理链首(head)。线程进入的每个 try 块都在链首插入一个节点(node)；线程退出\
  \ try 块时从链中删除该节点。此外，TEB 还包含线程的“线程本地存储”数据，以及由 GDI(Graphics\n\n- 1. 将 **CPU** 寄存器的值保存到当前正在运行的线程的内核对象内部的一个上下文结构中。\n\
  - 2. 从现有线程集合中选出一个线程供调度。如果该线程由另一个进程拥有，Windows 在开始执行任何代码或者接触任何数据之前，还必须切换 **CPU**“看见”的虚拟地址空间。\n\
  - 3. 将所选上下文结构中的值加载到 **CPU** 的寄存器中。\n\n上下文切换完成后，CPU 执行所选的线程，直到它的时间片到期。然后发生下次上下文切换。Windows\
  \ 大约每 30 毫秒执行一次上下文切换。上下文切换是净开销；也就是说，上下文切换所产生的开销不会换来任何内存或性能上的收益。Windows 执行上下文切换，向用户提供一个健壮的、响应灵敏的操作系统。\n\
  \n现在，假如一个应用程序的线程进入死循环，Windows 会定期抢占(preempt)它，将新线程分配给 CPU，让新线程有机会运行。假定新线程是“任务管理器”的线程，用户就可利用“任务管理器”终止包含了死循环线程的进程。之后，进程会终止，它处理的所有数据会被销毁。但系统中的其他所有进程都继续运行，不会丢失它们的数据，用户当然也不需要重启计算机。所以，上下文切换通过牺牲性能换来了好得多的用户体验。\n\
  \n事实上，上下文切换对性能的影响可能超出你的想象。是的，当 Windows 上下文切换到另一个线程时，会产生一定的性能损失。但是，CPU 现在是要执行一个不同的线程，而之前的线程的代码和数据还在\
  \ CPU 的高速缓存(cache)中，这使 CPU 不必经常访问 RAM(它的速度比 CPU 高速缓存慢得多)。当 Windows 上下文切换到新线程时，这个新线程极有可能要执行不同的代码并访问不同的数据，这些代码和数据不在\
  \ CPU 的高速缓存中。因此，CPU 必须访问 RAM 来填充它的高速缓存，以恢复高速执行状态。但在 30 毫秒之后，一次新的上下文切换又发生了。\n\n>\
  \ **重要提示** 一个时间片结束时，如果 Windows 决定再次调度同一个线程(而不是切换到另一个线程)，那么 Windows 不会执行上下文切换。相反，线程将继续运行。这显著改进了性能。注意，在设计自己的代码时，上下文切换能避免就要尽量避免。\n\
  \n> **重要提示** 线程可自主提前终止其时间片。这经常发生，因为线程经常要等待 I/O 操作(键盘、鼠标、文件、网络等)结束。例如，“记事本”程序的线程经常都会处于空闲状态，什么事情都不做；这个线程是在等待输入。如果用户按键盘上的\
  \ J 键，Windows 会唤醒“记事本”线程，让它处理按键操作。“记事本”线程可能花 5 毫秒处理按键，然后调用一个 Win32 函数，告诉 Windows\
  \ 它准备好处理下一个输入事件。如果没有更多的输入事件，Windows 使“记事本”线程进入等待状态(时间片剩余的部分就放弃了)，使线程在任何 CPU 上都不再调度，直到发生下一次输入事件。这增强了系统的总体性能，因为正在等待\
  \ I/O 操作完成的线程不会在 CPU 上调度，所以不会浪费 CPU 时间，而节省出来的时间则可以供 CPU 调度其他线程。\n\n选择“性能”选项卡，会看到如图\
  \ 26-1 所示的结果。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_612_0.png)\n\n图 26-1 任务管理器的“性能”选项卡\n\
  \n看来我的机器正在运行 48 个进程，所以可认为机器上至少运行着 48 个线程，因为每个进程都至少有一个线程。但“任务管理器”显示我的机器实际有 683 个线程！这意味着仅仅是线程栈就需要分配\
  \ 683 MB 内存，而我的机器总共才 3 GB RAM！另外，这还意味着每个进程平均有大约 14.2 个线程，而我的 4 核电脑理想情况下不应该是每进程 4\
  \ 线程吗？\n\n再来看看 CPU 利用率读数：它显示我的 CPU“忙”的时间是 6%。这意味着在 94%的时间里，这 683 个线程什么事情都没做——它们白白霸占着内存；线程未运行时，这些内存是不会使用的。你肯定会问：这些应用程序真的需要这些在\
  \ 94%的时间里什么事情都不做的线程吗？答案明显是否定的。要知道哪些进程最浪费，请单击“详细信息”标签，添加“线程”列①，再按降序对这个列进行排序，如图 26-2\
  \ 所示。\n\n如你所见，System 创建了 111 个线程，CPU 利用率为 0%。Explorer(资源管理器)创建了 82 个线程，CPU 利用率为\
  \ 0%。Visual Studio(Devenv.exe)创建了 38 个线程，CPU 利用率为 0%。Microsoft Outlook 创建了 17 个线程，CPU\
  \ 利用率为 0%；我可以一直列举下去。到底发生了什么事情？\n\n在 Windows 中，进程是十分“昂贵”的。创建一个进程通常要花几秒钟的时间，必须分配大量内存，这些内存必须初始化，EXE\
  \ 和 DLL 文件必须从磁盘上加载，等等。相反，在 Windows 中创建线程则十分“廉价”。所以，开发人员决定停止创建进程，改为创建线程。这正是我们看到有这么多线程的原因。但是，虽然线程比进程廉价，它们和其他系统资源相比仍然十分昂贵，所以还是应该省着用，而且要用得恰当。\n\
  \n① 右击现有的列，选择“选择列”。\n\n版的著作，比如我和 Christophe Nasarre 合写的 *Windows via C/C++*(Microsoft\
  \ Press, 2007)①。\n\n**注意** 在.NET Framework 的早期岁月，CLR 团队认为有朝一日 CLR 会提供不一定会映射到 Windows\
  \ 线程的逻辑线程。但大约在 2005 年的时候，这个尝试宣告失败，CLR 团队放弃了在这方面的努力。所以，今天的 CLR 线程完全等价于 Windows 线程。但.NET\
  \ Framework 仍然留下了一些能看出当年努力成果的一些东西。例如，**System.Environment** 类公开了 **CurrentManagedThreadId**\
  \ 属性，返回线程的 CLR ID；而 **System.Diagnostics.ProcessThread** 类公开了 **Id** 属性，返回同一个线程的\
  \ Windows ID。**System.Threading.Thread** 类的 **BeginThreadAffinity** 和 **EndThreadAffinity**\
  \ 方法则处理 CLR 线程没有映射到 Windows 线程的情况。\n\n**注意** Microsoft 为 Windows Store 应用移除了和线程处理有关的一些\
  \ API，因为它们鼓励不好的编程实践(就像 26.3 节“停止疯狂”描述的那样)，或者是因为它们不利于达成 Microsoft 为 Windows Store\
  \ 应用设立的目标。例如，整个 **System.Threading.Thread** 类都不开放给 Windows Store 应用，因为其中有许多不好的 API(比如\
  \ **Start**、**IsBackground**、**Sleep**、**Suspend**、**Resume**、**Join**、**Interrupt**、**Abort**、**BeginThreadAffinity**\
  \ 和 **EndThreadAffinity**)。我个人赞成这个做法，而且认为早就该这么做。所以，第 26 章到第 30 章讨论了适合桌面应用但不适合 Windows\
  \ Store 应用的一些 API 和功能。阅读过程中能清楚地认识到为何有一些 API 不适合 Windows Store 应用。\n\n### 26.6 使用专用线程执行异步的计算限制操作\n\
  \n本节展示如何创建线程来执行异步的计算限制(compute-bound)操作。虽然会展示完整过程，但强烈建议避免使用这个技术。而且事实上，由于 **Thread**\
  \ 类不可用，所以构建 Windows Store 应用时根本用不了这个技术。相反，应尽量使用线程池来执行异步的计算限制操作，这方面的详情将在第 27 章“计算限制的异步操作”讨论。\n\
  \n但极少数情况下，你可能想显式创建线程来专门执行一个计算限制的操作。如果执行的代码要求线程处于一种特定状态，而这种状态对于线程池线程来说是非同寻常的，就可考虑创建专用线程。例如，满足以下任何条件，就可显式创建自己的线程。\n\
  \n- 线程需要以非普通线程优先级运行。所有线程池线程都以普通优先级运行；虽然可以更改这个优先级，但不建议那样做。另外，在不同的线程池操作之间，对优先级的更\n\
  \n① 简体中文版是《Windows 核心编程(第 5 版)》，繁体中文版是《Windows 应用程序开发经典》。分别由清华大学出版社和悦知文化出版。我参与了它的翻译。——译注\n\
  \n让 10 台机器以 50%的 CPU 利用率运行，也不愿意让 5 台机器以 100%的利用率运行。这是由于全速运行的 CPU 会变成散热大户，由此带来的散热成本的大幅提升反而不美。虽然数据中心维护多台机器的费用也不算低(每台机器都要定期进行软硬件升级和监视)，但必须把这方面的费用同运行高级散热系统所需的费用比较。\n\
  \n如果你同意我的观点，那么下一步是决定应该让 CPU 做什么。在我给出我自己的想法之前，先来说一些别的东西。过去，开发人员和最终用户总是觉得计算机不够强劲。所以，除非最终用户通过\
  \ UI 元素(比如菜单项、按钮和复选框)给开发人员权限，允许应用程序开始消耗 CPU 资源，否则开发人员绝对不会擅自决定让代码开始执行。\n\n但今非昔比。如今的计算机一般都配备了强大的计算能力。而且可以预见，在不久的将来，计算能力还会大幅提高。本章早些时候，我演示了通过“任务管理器”查看我的\
  \ CPU 的利用率只有 6%。如果我的计算机使用的是八核 CPU，而不是现在的四核，那么“任务管理器”可能只会报告 3%的利用率。等 80 核处理器问世时，我的机器看起来会在几乎所有时间里都什么都不做！对于计算机的购买者来说，这感觉就像是花了更多的钱购买了更强大的\
  \ CPU，但计算机做的工作变得越来越少！\n\n这正是用户升级电脑动力不足的原因：软件没有充分地利用硬件，用户没有从额外的 CPU 中获益。我认为现在的计算能力有很大的富余，而且还会越来越富余，所以开发人员应该大胆消费它。是时候转变思维了——过去，除非最终用户确定想要获得计算结果，否则我们根本不敢提前计算。但现在有了额外的计算能力，所以开发人员完全不必像以前那样畏手畏脚。\n\
  \n举一个例子：在 Visual Studio 的编辑器中停止输入的时候，Visual Studio 会自动运行编译器并编译代码。这极大提高了开发人员的开发效率，因为他们能在输入时看到源代码的警告和错误，并可立即修正问题。事实上，传统的“编辑-生成-调试”模式逐渐变成“编辑-调试”，因为生成(编译)代码的动作一直都在发生。作为最终用户，你是注意不到这一点的，因为有充足的计算资源可供使用，而且编译器的频繁运行一般不会影响你正在做的其他事情。事实上，我希望\
  \ Visual Studio 未来的版本完全移除“生成”菜单，因为这个过程变得完全自动化。这不仅能使应用程序的 UI 变得更简单，还能自动向用户提供“答案”来提高他们使用软件的效率。\n\
  \n移除菜单项这样的 UI 元素后，计算机对最终用户来说变得更简单。他们面临的选项变得更少，需要阅读和理解的概念也变得更少。多核革命使我们能够消除菜单项这样的\
  \ UI 元素，进而使软件变得更简单好用，让我的奶奶有一天也能舒舒服服地用上计算机。对于开发人员，移除 UI 元素之后，所需的测试次数一般会变得更少。另外，向最终用户提供更少的选项简化了代码库。如果需要对\
  \ UI 元素和文档进行本地化(就像 Microsoft 那样)，那么移除 UI 元素意味着需要写的文档变少了，需要本地化的文档也变少了。这一切能为你的公司节省大量时间和金钱。\n\
  \n下面是更多主动消费计算能力的例子：文档拼写检查和语法检查、电子表格重新计算、磁盘文件索引以提高搜索速度以及硬盘碎片整理以提升 I/O 性能。\n\n###\
  \ 表 26-1 “进程优先级类”和“相对线程优先级”如何映射到“优先级”值\n\n| 相对线程优先级 | Idle | Below Normal | Normal\
  \ | Above Normal | High | Realtime |\n|---|---|---|---|---|---|---|\n| Time-Critical\
  \ | 15 | 15 | 15 | 15 | 15 | 31 |\n| Highest | 6 | 8 | 10 | 12 | 15 | 26 |\n| Above\
  \ Normal | 5 | 7 | 9 | 11 | 14 | 25 |\n| Normal | 4 | 6 | 8 | 10 | 13 | 24 |\n|\
  \ Below Normal | 3 | 5 | 7 | 9 | 12 | 23 |\n| Lowest | 2 | 4 | 6 | 8 | 11 | 22 |\n\
  | Idle | 1 | 1 | 1 | 1 | 1 | 16 |\n\n例如，Normal 进程中的一个 Normal 线程的优先级是 8。由于大多数进程都是\
  \ Normal 优先级，大多数线程也是 Normal 优先级，所以系统中大多数线程的优先级都是 8。\n\nHigh 优先级进程中的 Normal 线程的优先级是\
  \ 13。将进程优先级类更改为 Idle，线程的优先级变成 4。记住，线程优先级是相对于进程优先级类的。更改一个进程的优先级类，线程的相对优先级不会改变，但它的绝对优先级值会改变。\n\
  \n注意，表中没有值为 0 的线程优先级。这是因为 0 优先级保留给零页线程了，系统不允许其他线程的优先级为 0。而且，以下优先级也不可获得：17, 18, 19,\
  \ 20, 21, 27, 28, 29 或者 30。以内核模式运行的设备驱动程序才能获得这些优先级；用户模式的应用程序不能。还要注意，Realtime 优先级类中的线程优先级不能低于\
  \ 16。类似地，非 Realtime 的优先级类中的线程优先级不能高于 15。\n\n正常情况下，进程根据启动它的进程来分配优先级。大多数进程都由 Windows\
  \ 资源管理器启动，后者在 Normal 优先级类中生成它的所有子进程。托管应用程序不应该表现为拥有它们自己的进程；相反，它们应该表现为在一个 AppDomain\
  \ 中运行。所以，托管应用程序不应该更改它们的进程的优先级类，因为这会影响进程中运行的所有代码。例如，许多 ASP.NET 应用程序都在单个进程中运行，每个应用程序都在它自己的\
  \ AppDomain 中。类似的还有 Silverlight 应用程序，它在一个 IE 浏览器进程中运行。还有托管的存储过程，它在 Microsoft SQL\
  \ Server 进程中运行。\n\n> **注意** “进程优先级类”的概念容易引起混淆。人们可能以为 Windows 在调度进程。事实上 Windows 永远不会调度进程，它只调度线程。“进程优先级类”是\
  \ Microsoft 提出的抽象概念，旨在帮助你理解自己的应用程序和其他正在运行的应用程序的关系，它没有别的用途。\n\n对于桌面应用(非 Windows Store\
  \ 应用)，我要强调的是 **System.Diagnostics** 命名空间包含 **Process** 类和 **ProcessThread** 类。这两个类分别提供了进程和线程的\
  \ Windows 视图。用托管代码写实用程序(utility)，或者建构代码来帮助自己进行调试时，就可以使用这两个类。事实上，这正是为什么这两个类都在 **System.Diagnostics**\
  \ 命名空间中的原因。应用程序需要以特殊的安全权限运行才能使用这两个类。例如，Silverlight 或 ASP.NET 应用程序便用不了这两个类。\n\n另一方面，应用程序可使用\
  \ **AppDomain** 和 **Thread** 类，它们公开了 AppDomain 和线程的 CLR 视图。一般不需要特殊安全权限就可以使用这两个类，虽然某些操作仍需提升权限才可以使用。\n\
  \n### 26.9 前台线程和后台线程\n\nCLR 将每个线程要么视为前台线程，要么视为后台线程。一个进程的所有前台线程停止运行时，CLR 强制终止仍在运行的任何后台线程。这些后台线程被直接终止；不抛出异常。\n\
  \n所以，应该用前台线程执行确实想完成的任务，比如将数据从内存缓冲区 flush 到磁盘。非关键性任务则使用后台线程，比如重新计算电子表格的单元格，或者为记录建立索引等。这是由于这些工作能在应用程序重启时继续，而且如果用户想终止应用程序，就没必要强迫应用程序保持活动。\n\
  \nCLR 需要提供前台和后台线程的概念来更好地支持 **AppDomain**。我们知道，每个 AppDomain 都可运行一个单独的应用程序，而每个应用程序都有自己的前台线程。如果应用程序退出，造成它的前台线程终止，则\
  \ CLR 仍需保持活动并运行，使其他应用程序能继续运行。所有应用程序都退出，它们的所有前台线程都终止后，整个进程就可以被销毁了。\n\n以下代码演示了前台和后台线程之间的差异：\n\
  \n```\nusing System;\nusing System.Threading;\n\npublic static class Program {\n\
  \    public static void Main() {\n        // 创建新线程(默认为前台线程)\n        Thread t =\
  \ new Thread(Worker);\n\n        // 使线程成为后台线程\n        t.IsBackground = true;\n\n\
  \        t.Start(); // 启动线程\n        // 如果 t 是前台线程，则应用程序大约 10 秒后才终止\n        //\
  \ 如果 t 是后台线程，则应用程序立即终止\n        Console.WriteLine(\"Returning from Main\");\n  \
  \  }\n}\n```\n\n① flush 在文档中翻译成“刷新”，本书保留原文未译。其实 flush 在技术文档中的意思和日常生活中一样，即“冲(到别处)”。例如，我们会说“冲水”，不会说“刷尿”。——译注\n\
  \n\n\n### 27.1 CLR 线程池基础\n\n如第 26 章所述，创建和销毁线程是一个昂贵的操作，要耗费大量时间。另外，太多的线程会浪费内存资源。由于操作系统必须调度可运行的线程并执行上下文切换，所以太多的线程还对性能不利。为了改善这个情况，CLR\
  \ 包含了代码来管理它自己的线程池(thread pool)。线程池是你的应用程序能使用的线程集合。每个 CLR 一个线程池；这个线程池由 CLR 控制的所有\
  \ AppDomain 共享。如果一个进程中加载了多个 CLR，那么每个 CLR 都有它自己的线程池。\n\nCLR 初始化时，线程池中是没有线程的。在内部，线程池维护了一个操作请求队列。应用程序执行一个异步操作时，就调用某个方法，将一个记录项(entry)追加到线程池的队列中。线程池的代码从这个队列中提取记录项，将这个记录项派发(dispatch)给一个线程池线程。如果线程池中没有线程，就创建一个新线程。创建线程会造成一定的性能损失(前面已讨论过了)。然而，当线程池线程完成任务后，线程不会被销毁。相反，线程会返回线程池，在那里进入空闲状态，等待响应另一个请求。由于线程不销毁自身，所以不再产生额外的性能损失。\n\
  \n如果你的应用程序向线程池发出许多请求，线程池会尝试只用这一个线程来服务所有请求。然而，如果你的应用程序发出请求的速度超过了线程池线程处理它们的速度，就会创建额外的线程。最终，你的应用程序的所有请求都能由少量线程处理，所以线程池不必创建大量线程。\n\
  \n如果你的应用程序停止向线程池发出请求，池中会出现大量什么都不做的线程。这是对内存资源的浪费。所以，当一个线程池线程闲着没事儿一段时间之后(不同版本的 CLR\
  \ 对这个时间的定义不同)，线程会自己醒来终止自己以释放资源。线程终止自己会产生一定的性能损失。然而，线程终止自己是因为它闲得慌，表明应用程序本身就没有做太多的事情，所以这个性能损失关系不大。\n\
  \n线程池可以只容纳少量线程，从而避免浪费资源；也可以容纳更多的线程，以利用多处理器、超线程处理器和多核处理器。它能在两种不同的状态之间从容地切换。线程池是启发式的。如果应用程序需要执行许多任务，同时有可用的\
  \ CPU，那么线程池会创建更多的线程。应用程序负载减轻，线程池线程就终止它们自己。\n\n### 27.2 执行简单的计算限制操作\n\n要将一个异步的计算限制操作放到线程池的队列中，通常可以调用\
  \ **ThreadPool** 类定义的以下方法之一：\n\n```csharp\nstatic Boolean QueueUserWorkItem(WaitCallback\
  \ callBack);\nstatic Boolean QueueUserWorkItem(WaitCallback callBack, Object state);\n\
  ```\n\n这些方法向线程池的队列添加一个“工作项”(work item)以及可选的状态数据。然后，所有方法会立即返回。工作项其实就由 callBack 参数标识的一个方法，该方法将由线程池线程调用。可向方法传递一个\
  \ state 实参(状态数据)。无 state 参数的那个版本的 QueueUserWorkItem 则向回调方法传递 null。最终，池中的某个线程会处理工作项，造成你指定的方法被调用。你写的回调方法必须匹配\
  \ System.Threading.WaitCallback 委托类型，后者的定义如下：\n\n```csharp\ndelegate void WaitCallback(Object\
  \ state);\n```\n\n> 注意：WaitCallback 委托、TimerCallback 委托(参见本章 27.8 节“执行定时计算限制操作”的讨论)和\
  \ ParameterizedThreadStart 委托(在第 26 章“线程基础”中讨论)签名完全一致。定义和该签名匹配的方法后，使用 ThreadPool.QueueUserWorkItem、System.Threading.Timer\
  \ 和 System.Threading.Thread 对象都可调用该方法。\n\n以下代码演示了如何让一个线程池线程以异步方式调用一个方法：\n\n```csharp\n\
  using System;\nusing System.Threading;\n\npublic static class Program {\n    public\
  \ static void Main() {\n        Console.WriteLine(\"Main thread: queuing an asynchronous\
  \ operation\");\n        ThreadPool.QueueUserWorkItem(ComputeBoundOp, 5);\n    \
  \    Console.WriteLine(\"Main thread: Doing other work here...\");\n        Thread.Sleep(10000);\
  \  // 模拟其他工作(10 秒)\n        Console.WriteLine(\"Hit <Enter> to end this program...\"\
  );\n        Console.ReadLine();\n    }\n\n    // 这个方法的签名必须匹配 WaitCallback 委托\n \
  \   private static void ComputeBoundOp(Object state) {\n        // 这个方法由一个线程池线程执行\n\
  \n        Console.WriteLine(\"In ComputeBoundOp: state={0}\", state);\n        Thread.Sleep(1000);\
  \ // 模拟其他工作(1 秒)\n\n        // 这个方法返回后，线程回到池中，等待另一个任务\n    }\n}\n```\n\n编译并运行上述代码得到以下输出：\n\
  \n```text\nMain thread: queuing an asynchronous operation\nMain thread: Doing other\
  \ work here...\nIn ComputeBoundOp: state=5\n```\n\n有时也得到以下输出：\n\n```text\nMain thread:\
  \ queuing an asynchronous operation\nIn ComputeBoundOp: state=5\nMain thread: Doing\
  \ other work here...\n```\n\n之所以输出行的顺序会发生变化，是因为两个方法相互之间是异步运行的。Windows 调度器决定先调度哪一个线程。如果应用程序在多核机器上运行，可能同时调度它们。\n\
  \n像下面这样：\n\n```csharp\npublic sealed class CancellationTokenSource : IDisposable\
  \ { // 一个引用类型\n    public CancellationTokenSource();\n    public void Dispose();\
  \ // 释放资源(比如WaitHandle)\n\n    public Boolean IsCancellationRequested { get; }\n\
  \    public CancellationToken Token { get; }\n\n    public void Cancel(); // 内部调用\
  \ Cancel 并传递 false\n    public void Cancel(Boolean throwOnFirstException);\n   \
  \ ...\n}\n```\n\n这个对象包含了和管理取消有关的所有状态。构造好一个 **CancellationTokenSource**(一个引用类型)之后，可从它的\
  \ **Token** 属性获得一个或多个 **CancellationToken**(一个值类型)实例，并传给你的操作，使操作可以取消。以下是 **CancellationToken**\
  \ 值类型最有用的成员：\n\n```csharp\npublic struct CancellationToken { // 一个值类型\n    public\
  \ static CancellationToken None { get; } // 很好用\n\n    public Boolean IsCancellationRequested\
  \ { get; }  // 由非通过 Task 调用的操作调用\n    public void    ThrowIfCancellationRequested();\
  \   // 由通过 Task 调用的操作调用\n\n    // CancellationTokenSource 取消时，WaitHandle 会收到信号\n\
  \    public WaitHandle WaitHandle { get; }\n    // GetHashCode, Equals, operator==\
  \ 和 operator!=成员未列出\n\n    public Boolean CanBeCanceled { get; } // 很少使用\n\n   \
  \ public CancellationTokenRegistration Register(Action<Object> callback, Object\
  \ state,\n        Boolean useSynchronizationContext); // 未列出更简单的重载版本\n}\n```\n\n\
  **CancellationToken** 实例是轻量级值类型，包含单个私有字段，即对其 **CancellationTokenSource** 对象的引用。在计算限制操作的循环中，可定时调用\
  \ **CancellationToken** 的 **IsCancellationRequested** 属性，了解循环是否应该提前终止，从而终止计算限制的操作。提前终止的好处在于，CPU\
  \ 不需要再把时间浪费在你对结果不感兴趣的操作上。以下代码将这些概念全部梳理了一遍：\n\n```csharp\ninternal static class CancellationDemo\
  \ {\n    public static void Go() {\n        CancellationTokenSource cts = new CancellationTokenSource();\n\
  \n        // 将 CancellationToken 和 “要数到的数” (number-to-count-to) 传入操作\n        ThreadPool.QueueUserWorkItem(o\
  \ => Count(cts.Token, 1000));\n\n        Console.WriteLine(\"Press <Enter> to cancel\
  \ the operation.\");\n        Console.ReadLine();\n        cts.Cancel(); // 如果 Count\
  \ 方法已返回，Cancel 没有任何效果\n        // Cancel 立即返回，方法从这里继续运行...\n\n        Console.ReadLine();\n\
  \    }\n\n    private static void Count(CancellationToken token, Int32 countTo)\
  \ {\n        for (Int32 count = 0; count < countTo; count++) {\n            if (token.IsCancellationRequested)\
  \ {\n                Console.WriteLine(\"Count is cancelled\");\n              \
  \  break; // 退出循环以停止操作\n            }\n        }\n    }\n}\n```\n\n会抛出一个 **AggregateException**，该异常实例的\
  \ **InnerExceptions** 属性被设为已抛出的所有异常对象的集合。如果登记的所有回调方法都没有抛出未处理的异常，那么 **Cancel** 直接返回，不抛出任何异常。\n\
  \n> **重要提示** 没有办法将 **AggregateException** 的 **InnerExceptions** 集合中的一个异常对象和特定的操作对应起来；你只知道某个操作出错，并通过异常类型知道出了什么错。要跟踪错误的具体位置，需要检查异常对象的\
  \ **StackTrace** 属性，并手动扫描你的源代码。\n\n**CancellationToken** 的 **Register** 方法返回一个 **CancellationTokenRegistration**，如下所示：\n\
  \n```csharp\npublic struct CancellationTokenRegistration :\n    IEquatable<CancellationTokenRegistration>,\
  \ IDisposable {\n    public void Dispose();\n    // GetHashCode, Equals, operator==和\
  \ operator!=成员未列出\n}\n```\n\n可以调用 **Dispose** 从关联的 **CancellationTokenSource** 中删除已登记的回调；这样一来，在调用\
  \ **Cancel** 时，便不会再调用这个回调。以下代码演示了如何向一个 **CancellationTokenSource** 登记两个回调：\n\n```csharp\n\
  var cts = new CancellationTokenSource();\ncts.Token.Register(() => Console.WriteLine(\"\
  Canceled 1\"));\ncts.Token.Register(() => Console.WriteLine(\"Canceled 2\"));\n\n\
  // 出于测试的目的，让我们取消它，以便执行 2 个回调\ncts.Cancel();\n```\n\n运行上述代码，一旦调用 **Cancel** 方法，就会得到以下输出：\n\
  \n```text\nCanceled 2\nCanceled 1\n```\n\n最后，可以通过链接另一组 **CancellationTokenSource**\
  \ 来新建一个 **CancellationTokenSource** 对象。任何一个链接的 **CancellationTokenSource** 被取消，这个新的\
  \ **CancellationTokenSource** 对象就会被取消。以下代码对此进行了演示：\n\n```csharp\n// 创建一个CancellationTokenSource\n\
  var cts1 = new CancellationTokenSource();\ncts1.Token.Register(() => Console.WriteLine(\"\
  cts1 canceled\"));\n\n// 创建另一个CancellationTokenSource\nvar cts2 = new CancellationTokenSource();\n\
  cts2.Token.Register(() => Console.WriteLine(\"cts2 canceled\"));\n\n// 创建一个新的CancellationTokenSource，它在\
  \ cts1 或 cts2 取消时取消\nvar linkedCts = CancellationTokenSource.CreateLinkedTokenSource(cts1.Token,\
  \ cts2.Token);\nlinkedCts.Token.Register(() => Console.WriteLine(\"linkedCts canceled\"\
  ));\n\n// 取消其中一个CancellationTokenSource对象 (我选择 cts2)\ncts2.Cancel();\n\n// 显示哪个CancellationTokenSource对象被取消了\n\
  Console.WriteLine(\"cts1 canceled={0}, cts2 canceled={1}, linkedCts={2}\",\n   \
  \ cts1.IsCancellationRequested, cts2.IsCancellationRequested,\n    linkedCts.IsCancellationRequested);\n\
  ```\n\n课表\n\n| 节次/时间 | | 星期一 | 星期二 | 星期三 | 星期四 | 星期五 |\n| --- | --- | --- | ---\
