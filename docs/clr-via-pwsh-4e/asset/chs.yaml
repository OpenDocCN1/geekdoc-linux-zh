  \nFeedbackToFile 方法的工作方式类似于 FeedbackToConsole 和 FeedbackToMsgBox，不同的是它会打开一个文件，并将字符串附加到文件末尾。(方法创建的\
  \ Status 文件可在与可执行程序相同的目录中找到。)\n\n再次声明，本例旨在演示委托可以包装对实例方法和静态方法的调用。如果是实例方法，委托要知道方法操作的是具体哪个对象实例。包装实例方法很有用，因为对象内部的代码可以访问对象的实例成员。这意味着对象可以维护一些状态，并在回调方法执行期间利用这些状态信息。\n\
  \n### 17.4 委托揭秘\n\n从表面看，委托似乎很容易使用：用 C# 的 delegate 关键字定义，用熟悉的 new 操作符构造委托实例，用熟悉的方法调用语法来调用回调函数(用引用了委托对象的变量替代方法名)。\n\
  \n但实际情况比前几个例子演示的要复杂一些。编译器和 CLR 在幕后做了大量工作来隐藏复杂性。本节要解释编译器和 CLR 如何协同工作来实现委托。掌握这些知识有助于加深对委托的理解，并学会如何更高效地使用。另外，还要介绍通过委托来实现的一些附加功能。\n\
  \n首先重新审视这一行代码：\n\n```csharp\ninternal delegate void Feedback(Int32 value);\n```\n\
  \n看到这行代码后，编译器实际上会像下面这样定义一个完整的类：\n\n```csharp\ninternal class Feedback : System.MulticastDelegate\
  \ {\n    // 构造器\n    public Feedback(Object @object, IntPtr method);\n}\n```\n\n\
  ```csharp\n// 这个方法的原型和源代码指定的一样\npublic virtual void Invoke(Int32 value);\n\n// 以下方法实现对\
  \ Invoke 方法的异步回调\npublic virtual IAsyncResult BeginInvoke(Int32 value,\n    AsyncCallback\
  \ callback, Object @object);\npublic virtual void EndInvoke(IAsyncResult result);\n\
  }\n```\n\n编译器定义的类有 4 个方法：一个构造器、Invoke、BeginInvoke 和 EndInvoke。本章重点解释构造器和 Invoke。BeginInvoke\
  \ 和 EndInvoke 方法将留到第 27 章讨论。\n\n事实上，可用 ILDasm.exe 查看生成的程序集，验证编译器真的会自动生成这个类，如图 17-1\
  \ 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_366_0.png)\n\n图 17-1　ILDasm.exe\
  \ 显示了编译器为委托生成的元数据\n\n在本例中，编译器定义了 Feedback 类，它派生自 FCL 定义的 System.MulticastDelegate\
  \ 类型（所有委托类型都派生自 MulticastDelegate）。\n\n> **重要提示**　System.MulticastDelegate 派生自 System.Delegate，后者又派生自\
  \ System.Object。是历史原因造成有两个委托类。这实在是令人遗憾——FCL 本该只有一个委托类。没有办法，我们对这两个类都要有所了解。即使创建的所有委托类型都将\
  \ MulticastDelegate 作为基类，个别情况下仍会使用 Delegate 类（而非 MulticastDelegate 类）定义的方法处理自己的委托类型。例如，Delegate\
  \ 类的两个静态方法 Combine 和 Remove（后文将解释其用途）的签名都指出要获取 Delegate 参数。由于你创建的委托类型派生自 MulticastDelegate，后者又派生自\
  \ Delegate，所以你的委托类型的实例是可以传给这两个方法的。\n\n这个类的可访问性是 private，因为委托在源代码中声明为 internal。如果源代码改成使用\
  \ public 可见性，编译器生成的 Feedback 类也会变成公共类。要注意的是，委托类既可嵌套在一个类型中定义，也可在全局范围中定义。简单地说，由于委托是类，所以凡是能够定义类的地方，都能定义委托。\n\
  \n由于所有委托类型都派生自 MulticastDelegate，所以它们继承了 MulticastDelegate 的字段、属性和方法。在所有这些成员中，有三个非公共字段是最重要的。表\
  \ 17-1 总结了这些重要字段。\n\n**表 17-1　MulticastDelegate 的三个重要的非公共字段**\n\n| 字段 | 类型 | 说明\
  \ |\n|---|---|---|\n| `_target` | `System.Object` | 当委托对象包装一个静态方法时，这个字段为 `null`。当委托对象包装一个实例方法时，这个字段引用的是回调方法要操作的对象。换言之，这个字段指出要传给实例方法的隐式参数\
  \ `this` 的值 |\n| `_methodPtr` | `System.IntPtr` | 一个内部的整数值，CLR 用它标识要回调的方法 |\n| `_invocationList`\
  \ | `System.Object` | 该字段通常为 `null`。构造委托链时它引用一个委托数组（详情参见下一节） |\n\n注意，所有委托都有一个构造器，它获取两个参数：一个是对象引用，另一个是引用了回调方法的整数。但如果仔细查看前面的源代码，会发现传递的是\
  \ `Program.FeedbackToConsole` 或 `p.FeedbackToFile` 这样的值。根据迄今为止学到的编程知识，似乎没有可能通过编译！\n\
  \n然而，C# 编译器知道要构造的是委托，所以会分析源代码来确定引用的是哪个对象和方法。对象引用被传给构造器的 `object` 参数，标识了方法的一个特殊 `IntPtr`\
  \ 值（从 `MethodDef` 或 `MemberRef` 元数据 token 获得）被传给构造器的 `method` 参数。对于静态方法，会为 `object`\
  \ 参数传递 `null` 值。在构造器内部，这两个实参分别保存在 `_target` 和 `_methodPtr` 私有字段中。除此以外，构造器还将 `_invocationList`\
  \ 字段设为 `null`，对这个字段的讨论将推迟到 17.5 节“用委托回调多个方法(委托链)”进行。\n\n所以，每个委托对象实际上都是一个包装器，其中包装了一个方法和调用该方法时要操作的对象。例如，在执行以下两行代码之后：\n\
  \n```csharp\nFeedback fbStatic = new Feedback(Program.FeedbackToConsole);\nFeedback\
  \ fbInstance = new Feedback(new Program().FeedbackToFile);\n```\n\n`fbStatic` 和\
  \ `fbInstance` 变量将引用两个独立的、初始化好的 `Feedback` 委托对象，如图 17-2 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_367_0.png)\n\
  \n图 17-2　在两个变量引用的委托中，一个包装静态方法，另一个包装实例方法\n\n知道委托对象如何构造并了解其内部结构之后，再来看看回调方法是如何调用的。为方便讨论，下面重复了\
  \ `Counter` 方法的定义：\n\n```csharp\nprivate static void Counter(Int32 from, Int32 to,\
  \ Feedback fb) {\n    for (Int32 val = from; val <= to; val++) {\n        // 如果指定了任何回调，就调用它们\n\
  \        if (fb != null)\n            fb(val);\n    }\n}\n```\n\n注意 if 语句首先检查 fb\
  \ 是否为 null。不为 null 就调用“回调”方法。null 检查必不可少，因为 fb 只是可能引用了 Feedback 委托对象的变量；它也可能为 null。这段代码看上去像是调用了一个名为\
  \ fb 的函数，并向它传递一个参数(val)。但事实上，这里没有名为 fb 的函数。再次提醒你注意，因为编译器知道 fb 是引用了委托对象的变量，所以会生成代码调用该委托对象的\
  \ Invoke 方法。也就是说，编译器在看到以下代码时：\n\n```csharp\nfb(val);\n```\n\n它将生成以下代码，好像源代码本来就是这么写的一样：\n\
  \n```csharp\nfb.Invoke(val);\n```\n\n为了验证编译器生成代码来调用委托类型的 Invoke 方法，可利用 ILDasm.exe\
  \ 检查为 Counter 方法创建的 IL 代码。下面列出了 Counter 方法的 IL 代码。IL_0009 处的指令就是对 Feedback 的 Invoke\
  \ 方法的调用。\n\n```il\n.method private hidebysig static void Counter( int32 from,\n\
  \                                            int32 'to',\n                     \
  \                       class Feedback fb) cil managed\n{\n    // Code size 23 (0x17)\n\
  \    .maxstack 2\n    .locals init (int32 val)\n    IL_0000: ldarg.0\n    IL_0001:\
  \ stloc.0\n    IL_0002: br.s IL_0012\n    IL_0004: ldarg.2\n    IL_0005: brfalse.s\
  \ IL_000e\n    IL_0007: ldarg.2\n    IL_0008: ldloc.0\n    IL_0009: callvirt instance\
  \ void Feedback::Invoke(int32)\n    IL_000e: ldloc.0\n    IL_000f: ldc.i4.1\n  \
  \  IL_0010: add\n    IL_0011: stloc.0\n    IL_0012: ldloc.0\n    IL_0013: ldarg.1\n\
  \    IL_0014: ble.s IL_0004\n    IL_0016: ret\n} // end of method Program::Counter\n\
  ```\n\n其实，完全可以修改 Counter 方法来显式调用 Invoke 方法，如下所示：\n\n```csharp\nprivate static void\
  \ Counter(Int32 from, Int32 to, Feedback fb) {\n    for (Int32 val = from; val <=\
  \ to; val++) {\n        // 如果指定了任何回调，就调用它们\n        if (fb != null)\n          \
  \  fb.Invoke(val);\n    }\n}\n```\n\n① 这里的“调用”是 invoke，参考 8.6.2 节的译注对 invoke 和 call\
  \ 的解释。——译注\n\n前面说过，编译器是在定义 **Feedback** 类的时候定义 **Invoke** 的。在 **Invoke** 被调用时，它使用私有字段\
  \ **_target** 和 **_methodPtr** 在指定对象上调用包装好的回调方法。注意，**Invoke** 方法的签名和委托的签名匹配。由于 **Feedback**\
  \ 委托要获取一个 **Int32** 参数并返回 **void**，所以编译器生成的 **Invoke** 方法也要获取一个 **Int32** 并返回 **void**。\n\
  \n### 17.5 用委托回调多个方法（委托链）\n\n委托本身就很有用，再加上对委托链的支持，用处就更大了！委托链是委托对象的集合。可利用委托链调用集合中的委托所代表的全部方法。为了理解这一点，请参考\
  \ 17.1 节的示例代码中的 **ChainDelegateDemo1** 方法。在 **Console.WriteLine** 语句之后，我构造了三个委托对象并让变量\
  \ **fb1、fb2** 和 **fb3** 分别引用每个对象，如图 17-3 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_369_0.png)\n\
  \n指向 **Feedback** 委托对象的引用变量 **fbChain** 旨在引用委托链（或者说委托对象集合），这些对象包装了可回调的方法。**fbChain**\
  \ 初始化为 **null**，表明目前没有要回调的方法。使用 **Delegate** 类的公共静态方法 **Combine** 将委托添加到链中：\n\n\
  ```csharp\nfbChain = (Feedback) Delegate.Combine(fbChain, fb1);\n```\n\n执行这行代码时，**Combine**\
  \ 方法发现要合并的是 **null** 和 **fb1**。在内部，**Combine** 直接返回 **fb1** 中的值，所以 **fbChain** 变量现在引用\
  \ **fb1** 变量所引用的委托对象，如图 17-4 所示。\n\n再次调用 **Combine** 方法在链中添加第二个委托：\n\n```csharp\n\
  fbChain = (Feedback) Delegate.Combine(fbChain, fb2);\n```\n\n在内部，**Combine** 方法发现\
  \ **fbChain** 已引用了一个委托对象，所以 **Combine** 会构造一个新的委托对象。新委托对象对它的私有字段 **_target** 和 **_methodPtr**\
  \ 进行初始化，具体的值对于目前的讨论来说并不重要。重要的是，**_invocationList** 字段被初始化为引用一个委托对象数组。数组的第一个元素（索引\
  \ 0）被初始化为引用包装了 **FeedbackToConsole** 方法的委托（也就是 **fbChain** 目前引用的委托）。数组的第二个元素（索引\
  \ 1）被初始化为引用包装了 **FeedbackToMsgBox** 方法的委托（也就是 **fb2** 引用的委托）。最后，**fbChain** 被设为引用新建的委托对象，如图\
  \ 17-5 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_370_0.png)\n\n图 17-4　在委托链中插入第一个委托后委托对象的状态\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_370_1.png)\n\n图 17-5　在委托链中插入第二个委托之后委托对象的状态\n\
  \n为了在链中添加第三个委托，我再次调用 **Combine** 方法。\n\n```csharp\nfbChain = (Feedback) Delegate.Combine(fbChain,\
  \ fb3);\n```\n\n同样地，**Combine** 方法发现 **fbChain** 已引用了一个委托对象，因而又构造一个新的委托对象，如图 17-6\
  \ 所示。和前面一样，新委托对象对私有字段 **_target** 和 **_methodPtr** 进行初始化，具体的值就目前来说并不重要。**_invocationList**\
  \ 字段被初始化为引用一个委托对象数组。该数组的第一个元素和第二个元素（索引 0 和 1）被初始化为引用 **fb1** 和 **fb2** 所引用的委托。数组的第三个元素（索引\
  \ 2）被初始化为引用包装了 **FeedbackToFile** 方法的委托（这是 fb3 所引用的委托）。最后，**fbChain** 被设为引用这个新建的委托对象。注意，之前新建的委托及其\
  \ **_invocationList** 字段引用的数组现在可以进行垃圾回收。\n\n在 **ChainDelegateDemo1** 方法中，用于设置委托链的所有代码执行完毕之后，我将\
  \ **fbChain** 变量传给 **Counter** 方法：\n\n```csharp\nCounter(1, 2, fbChain);\n```\n\n\
  **Counter** 方法内部的代码会在 **Feedback** 委托对象上隐式调用 **Invoke** 方法，具体已在前面讲述过了。在 **fbChain**\
  \ 引用的委托上调用 **Invoke** 时，该委托发现私有字段 **_invocationList** 不为 **null**，所以会执行一个循环来遍历数组中的所有元素，并依次调用每个委托包装的方法。在本例中，**FeedbackToConsole**\
  \ 首先被调用，随后是 **FeedbackToMsgBox**，最后是 **FeedbackToFile**。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_371_0.png)\n\
  \n图 17-6　委托链完成后委托对象的最终状态\n\n以伪代码的形式，**Feedback** 的 **Invoke** 方法基本上是像下面这样实现的：\n\n\
  ```csharp\npublic void Invoke(Int32 value) {\n    Delegate[] delegateSet = _invocationList\
  \ as Delegate[];\n    if (delegateSet != null) {\n        // 这个委托数组指定了应该调用的委托\n\
  \        foreach (Feedback d in delegateSet)\n            d(value); // 调用每个委托\n\
  \    } else { // 否则就不是委托链\n        // 该委托标识了要回调的单个方法，\n        // 在指定的目标对象上调用这个回调方法\n\
  \        _methodPtr.Invoke(_target, value);\n        // 上面这行代码接近实际的代码，\n       \
  \ // 实际发生的事情用 C# 是表示不出来的\n    }\n}\n```\n\n注意，还可调用 **Delegate** 的公共静态方法 **Remove**\
  \ 从链中删除委托。**ChainDelegateDemo1** 方法在结尾处对此进行了演示。\n\n```csharp\nfbChain = (Feedback)\
  \ Delegate.Remove(fbChain, new Feedback(FeedbackToMsgBox));\n```\n\n**Remove** 方法被调用时，它扫描第一个实参(本例是\
  \ **fbChain**)所引用的那个委托对象内部维护的委托数组(从末尾向索引 0 扫描)。**Remove** 查找的是其 **_target** 和 **_methodPtr**\
  \ 字段与第二个实参(本例是新建的 **Feedback** 委托)中的字段匹配的委托。如果找到匹配的委托，并且(在删除之后)数组中只剩余一个数据项，就返回那个数据项。如果找到匹配的委托，并且数组中还剩余多个数据项，就新建一个委托对象——其中创建并初始化的\
  \ **_invocationList** 数组将引用原始数组中的所有数据项，当然被删除的数据项除外——并返回对这个新建委托对象的引用。如果从链中删除了仅有的一个元素，**Remove**\
  \ 会返回 **null**。注意，每次 **Remove** 方法调用只能从链中删除一个委托，它不会删除所有匹配的 **_target** 和 **_methodPtr**\
  \ 字段的所有委托。\n\n前面展示的例子中，委托类型 **Feedback** 的返回值都是 **void**。但完全可以像下面这样定义 **Feedback**\
  \ 委托：\n\n```csharp\npublic delegate Int32 Feedback(Int32 value);\n```\n\n如果是这样定义的，那么该委托的\
  \ **Invoke** 方法就应该像下面这样(又是伪代码形式)：\n\n```csharp\npublic Int32 Invoke(Int32 value)\
  \ {\n    Int32 result;\n    Delegate[] delegateSet = _invocationList as Delegate[];\n\
  \    if (delegateSet != null) {\n        // 这个委托数组指定了应该调用的委托\n        foreach (Feedback\
  \ d in delegateSet)\n            result = d(value); // 调用每个委托\n    } else { // 否则就不是委托链\n\
  \        // 该委托标识了要回调的单个方法，\n        // 在指定的目标对象上调用这个回调方法\n        result = _methodPtr.Invoke(_target,\
  \ value);\n        // 上面这行代码接近实际的代码\n        // 实际发生的事情用 C# 是表示不出来的\n    }\n   \
  \ return result;\n}\n```\n\n数组中的每个委托被调用时，其返回值被保存到 **result** 变量中。循环完成后，**result**\
  \ 变量只包含调用的最后一个委托的结果(前面的返回值会被丢弃)，该值返回给调用 **Invoke** 的代码。\n\n### 17.5.1　C#对委托链的支持\n\
  \n为方便 C# 开发人员，C# 编译器自动为委托类型的实例重载了+=和-=操作符。这些操作符分别调用 **Delegate.Combine** 和 **Delegate.Remove**。可用这些操作符简化委托链的构造。在\
  \ 17.1 节的示例代码中，**ChainDelegateDemo1** 和 **ChainDelegateDemo2** 方法生成的 IL 代码完全一样。唯一的区别是\
  \ **ChainDelegateDemo2** 方法利用 C# 的+=和-=操作符简化了源代码。\n\n要想证明两个方法生成的 IL 代码一样，可利用 ILDasm.exe\
  \ 查看生成的 IL 代码。会看到 C# 编译器用 **Delegate** 类型的 **Combine** 和 **Remove** 公共静态方法调用分别替代了+=和-=操作符。\n\
  \n\n\n#### 17.5.2 取得对委托链调用的更多控制\n\n此时，想必你已理解了如何创建委托对象链，以及如何调用链中的所有对象。链中的所有项都会被调用，因为委托类型的\
  \ Invoke 方法包含了对数组中的所有项进行遍历的代码。这是一个很简单的算法。尽管这个简单的算法足以应付很多情形，但也有它的局限性。例如，除了最后一个返回值，其他所有回调方法的返回值都会被丢弃。但局限并不止于此。如果被调用的委托中有一个抛出了异常或阻塞了相当长一段时间，会出现什么情况呢？由于这个简单的算法是顺序调用链中的每一个委托，所以一个委托对象出现问题，链中后续的所有对象都调用不了。显然，这个算法还不够健壮。①\n\
  \n① 健壮性（鲁棒性）和可靠性是有区别的，两者对应的英文单词分别是 robustness 和 reliability。健壮性主要描述一个系统对于参数变化的不敏感性，而可靠性主要描述一个系统的正确性，也就是在你固定提供一个参数时，它应该产生稳定的、能预测的输出。例如一个程序，它的设计目标是获取一个参数并输出一个值。假如它能正确完成这个设计目标，就说它是可靠的。但在这个程序执行完毕后，假如没有正确释放内存，或者说系统没有自动帮它释放占用的资源，就认为这个程序及其“运行时”不具备健壮性或者鲁棒性。——译注\n\
  \n由于这个算法有的时候不胜其任，所以 MulticastDelegate 类提供了一个实例方法 GetInvocationList，用于显式调用链中的每一个委托，并允许你使用需要的任何算法：\n\
  \n```csharp\npublic abstract class MulticastDelegate : Delegate {\n    // 创建一个委托数组，其中每个元素都引用链中的一个委托\n\
  \    public sealed override Delegate[] GetInvocationList();\n}\n```\n\nGetInvocationList\
  \ 方法操作从 MulticastDelegate 派生的对象，返回包含 Delegate 引用的一个数组，其中每个引用都指向链中的一个委托对象。在内部，GetInvocationList\
  \ 构造并初始化一个数组，让它的每个元素都引用链中的一个委托，然后返回对该数组的引用。如果 _invocationList 字段为 null，返回的数组就只有一个元素，该元素引用链中唯一的委托，即委托实例本身。\n\
  \n可以很容易地写一个算法来显式调用数组中每个对象。以下代码进行了演示：\n\n```csharp\nusing System;\nusing System.Reflection;\n\
  using System.Text;\n\n// 定义一个 Light（灯）组件\ninternal sealed class Light {\n    //\
  \ 该方法返回灯的状态\n    public String SwitchPosition() {\n        return \"The light is\
  \ off\";\n    }\n}\n\n// 定义一个 Fan（风扇）组件\ninternal sealed class Fan {\n    // 该方法返回风扇的状态\n\
  \    public String Speed() {\n        throw new InvalidOperationException(\"The\
  \ fan broke due to overheating\");\n    }\n}\n\n// 定义一个 Speaker（扬声器）组件\ninternal\
  \ sealed class Speaker {\n    // 该方法返回扬声器的状态\n    public String Volume() {\n   \
  \     return \"The volume is loud\";\n    }\n}\n\npublic sealed class Program {\n\
  \n    // 定义委托来查询一个组件的状态\n    private delegate String GetStatus();\n\n    public\
  \ static void Main() {\n        // 声明空委托链\n        GetStatus getStatus = null;\n\
  \n        // 构造 3 个组件，将它们的状态方法添加到委托链中\n        getStatus += new GetStatus(new Light().SwitchPosition);\n\
  \        getStatus += new GetStatus(new Fan().Speed);\n        getStatus += new\
  \ GetStatus(new Speaker().Volume);\n\n        // 显示整理好的状态报告，反映这 3 个组件的状态\n     \
  \   Console.WriteLine(GetComponentStatusReport(getStatus));\n    }\n\n    // 该方法查询几个组件并返回状态报告\n\
  \    private static String GetComponentStatusReport(GetStatus status) {\n\n    \
  \    // 如果委托链为空，就不进行任何操作\n        if (status == null) return null;\n\n        //\
  \ 用下面的变量来创建状态报告\n        StringBuilder report = new StringBuilder();\n\n       \
  \ // 获得一个数组，其中每个元素都是链中的委托\n        Delegate[] arrayOfDelegates = status.GetInvocationList();\n\
  \n        // 遍历数组中的每一个委托\n        foreach (GetStatus getStatus in arrayOfDelegates)\
  \ {\n\n            try {\n                // 获得一个组件的状态字符串，把它附加到报告中\n           \
  \     report.AppendFormat(\"{0}{1}{1}{1}\", getStatus(),\n                    Environment.NewLine);\n\
  \            }\n            catch (InvalidOperationException e) {\n            \
  \    // 在状态报告中为该组件生成一个错误记录\n                Object component = getStatus.Target;\n\
  \                report.AppendFormat(\n                    \"Failed to get status\
  \ from {1}{2}{0}  Error: {3}{0}{0}\",\n                    Environment.NewLine,\n\
  \                    ((component == null) ? \"\" : component.GetType() + \".\"),\n\
  \                    getStatus.Method.Name,\n                    e.Message);\n \
  \           }\n        }\n\n        // 把整理好的报告返回给调用者\n        return report.ToString();\n\
  \    }\n}\n```\n\n生成并运行以上代码，会得到如下所示的输出：\n\n```text\nThe light is off\n\nFailed to\
  \ get status from Fan.Speed\n    Error: The fan broke due to overheating\n\nThe\
  \ volume is loud\n```\n\n### 17.6 委托定义不要太多（泛型委托）\n\n许多年前，Microsoft 在刚开始开发 .NET Framework\
  \ 的时候引入了委托的概念。开发人员在 FCL 中添加类时，凡是有回调方法的地方都定义了新的委托类型。随着时间的推移，他们定义了许多委托。事实上，现在仅仅在 mscorlib.dll\
  \ 中，就有接近 50 个委托类型。下面只列出其中少数几个：\n\n```csharp\npublic delegate void TryCode(Object\
  \ userData);\npublic delegate void WaitCallback(Object state);\npublic delegate\
  \ void TimerCallback(Object state);\npublic delegate void ContextCallback(Object\
  \ state);\npublic delegate void SendOrPostCallback(Object state);\npublic delegate\
  \ void ParameterizedThreadStart(Object obj);\n```\n\n发现这几个委托的共同点了吗？它们其实都是一样的：这些委托类型的变量所引用的方法都是获取一个\
  \ Object，并返回 void。没理由定义这么多委托类型，留一个就可以了！\n\n事实上，.NET Framework 现在支持泛型，所以实际只需几个泛型委托（在\
  \ System 命名空间中定义）就能表示需要获取多达 16 个参数的方法：\n\n```csharp\npublic delegate void Action();\
  \ // OK，这个不是泛型\npublic delegate void Action<T>(T obj);\npublic delegate void Action<T1,\
  \ T2>(T1 arg1, T2 arg2);\npublic delegate void Action<T1, T2, T3>(T1 arg1, T2 arg2,\
  \ T3 arg3);\n...\npublic delegate void Action<T1, ..., T16>(T1 arg1, ..., T16 arg16);\n\
  ```\n\n所以，.NET Framework 现在提供了 17 个 Action 委托，它们从无参数到最多 16 个参数。如需获取 16 个以上的参数，就必须定义自己的委托类型，但这种情况极其罕见。除了\
  \ Action 委托，.NET Framework 还提供了 17 个 Func 委托，允许回调方法返回值：\n\n```csharp\npublic delegate\
  \ TResult Func<TResult>();\npublic delegate TResult Func<T, TResult>(T arg);\npublic\
  \ delegate TResult Func<T1, T2, TResult>(T1 arg1, T2 arg2);\npublic delegate TResult\
  \ Func<T1, T2, T3, TResult>(T1 arg1, T2 arg2, T3 arg3);\n...\npublic delegate TResult\
  \ Func<T1, ..., T16, TResult>(T1 arg1, ..., T16 arg16);\n```\n\n建议尽量使用这些委托类型，而不是在代码中定义更多的委托类型。这样可减少系统中的类型数量，同时简化编码。然而，如需使用\
  \ `ref` 或 `out` 关键字以传引用的方式传递参数，就可能不得不定义自己的委托：\n\n```csharp\ndelegate void Bar(ref\
  \ Int32 z);\n```\n\n如果委托要通过 C# 的 `params` 关键字获取数量可变的参数，要为委托的任何参数指定默认值，或者要对委托的泛型类型参数进行约束，也必须定义自己的委托类型。\n\
  \n获取泛型实参并返回值的委托支持逆变和协变，而且建议总是利用这些功能，因为它们没有副作用，而且使你的委托适用于更多情形。欲知逆变和协变的详情，请参见 12.5\
  \ 节“委托和接口的逆变和协变泛型类型实参”。\n\n### 17.7 C# 为委托提供的简化语法\n\n许多程序员因为语法奇怪而对委托有抗拒感。例如下面这行代码：\n\
  \n```csharp\nbutton1.Click += new EventHandler(button1_Click);\n```\n\n其中的 **button1_Click**\
  \ 是方法，看起来像下面这样：\n\n```csharp\nvoid button1_Click(Object sender, EventArgs e) {\n\
  \    // 按钮单击后要做的事情……\n}\n```\n\n第一行代码的思路是向按钮控件登记 **button1_Click** 方法的地址，以便在按钮被单击时调用方法。许多程序员认为，仅仅为了指定\
  \ **button1_Click** 方法的地址，就构造一个 **EventHandler** 委托对象，这显得有点儿不可思议。然而，构造 **EventHandler**\
  \ 委托对象是 CLR 要求的，因为这个对象提供了一个包装器，可确保（被包装的）方法只能以类型安全的方式调用。这个包装器还支持调用实例方法和委托链。遗憾的是，很多程序员并不想仔细研究这些细节。程序员更喜欢像下面这样写代码：\n\
  \n```csharp\nbutton1.Click += button1_Click;\n```\n\n幸好，Microsoft C# 编译器确实为程序员提供了用于处理委托的一些简化语法。本书将讨论所有这些简化语法。但开始之前我要声明一点，后文描述的基本上只是\
  \ C# 的语法糖①，这些简化语法为程序员提供了一种更简单的方式生成 CLR 和其他编程语言处理委托时所必需的 IL 代码。这些简化语法是 C# 特有的，其他编译器可能还没有提供额外的委托简化语法。\n\
  \n① 一般而言，越是高级的语言，提供的简化语法越多，以方便写程序，这就是所谓的“语法糖”。——译注\n\n### 17.7.1 简化语法 1：不需要构造委托对象\n\
  \n如前所述，C# 允许指定回调方法的名称，不必构造委托对象包装器。例如：\n\n```csharp\ninternal sealed class AClass\
  \ {\n    public static void CallbackWithoutNewingADelegateObject() {\n        ThreadPool.QueueUserWorkItem(SomeAsyncTask,\
  \ 5);\n    }\n\n    private static void SomeAsyncTask(Object o) {\n        Console.WriteLine(o);\n\
  \    }\n}\n```\n\nThreadPool 类的静态 QueueUserWorkItem 方法期待一个 WaitCallback 委托对象引用，委托对象中包装的是对\
  \ SomeAsyncTask 方法的引用。由于 C# 编译器能自己进行推断，所以可以省略构造 WaitCallback 委托对象的代码，使代码的可读性更佳，也更容易理解。当然，当代码编译时，C#\
  \ 编译器还是会生成 IL 代码来新建 WaitCallback 委托对象——只是语法得到了简化而已。\n\n### 17.7.2 简化语法 2：不需要定义回调方法（lambda\
  \ 表达式）\n\n在前面的代码中，回调方法名称 SomeAsyncTask 传给 ThreadPool 的 QueueUserWorkItem 方法。C# 允许以内联（直接嵌入）的方式写回调方法的代码，不必在它自己的方法中写。例如，前面的代码可以这样重写：\n\
  \n```csharp\ninternal sealed class AClass {\n    public static void CallbackWithoutNewingADelegateObject()\
  \ {\n        ThreadPool.QueueUserWorkItem(obj => Console.WriteLine(obj), 5);\n \
  \   }\n}\n```\n\n注意，传给 QueueUserWorkItem 方法的第一个实参是代码（我把它倾斜显示了）！更正式地说，这是一个 C# lambda\
  \ 表达式，可通过 C# lambda 表达式操作符 `=>` 来轻松识别。lambda 表达式可在编译器预先会看到一个委托的地方使用。编译器看到这个 lambda\
  \ 表达式之后，会在类（本例是 AClass）中自动定义一个新的私有方法。这个新方法称为匿名函数，因为方法名称由编译器自动创建，而且你一般不知道这个名称。①但可利用\
  \ ILDasm.exe 这样的工具检查编译器生成的代码。写完前面的代码并编译之后，我通过 ILDasm.exe 看到 C# 编译器将该方法命名为 `<CallbackWithoutNewingADelegateObject>b__0`，它获取一个\
  \ Object，返回 void。\n\n编译器选择的方法名以 `<` 符号开头，这是因为在 C# 中，标识符是不能包含 `<` 符号的；这就确保了你不会碰巧定义一个编译器自动选择的名称。顺便说一句，虽然\
  \ C# 禁止标识符包含 `<` 符号，但 CLR 允许，这是为什么不会出错的原因。还要注意，虽然可将方法名作为字符串来传递，通过反射来访问方法，但 C# 语言规范指出，编译器生成名称的方式是没有任何保证的。例如，每次编译代码，编译器都可能为方法生成一个不同的名称。\n\
  \n① 作者在这里故意区分了匿名函数和匿名方法。一般情况下，两者可以互换着使用。如果非要区分，那么编译器生成的全部都是“匿名函数”，这是最开始的叫法。从 C#\
  \ 2.0 开始引入了“匿名方法”功能，它的作用就是简化生成匿名函数而需要写的代码。在新的 C# 版本中（3.0 和以后），更是建议用 lambda 表达式来进一步简化语法，不再推荐使用\
  \ C# 2.0 引入的“匿名方法”。但归根结底，所有这些语法糖都是为了更简单地生成匿名函数。——译注\n\n注意 C# 编译器向方法应用了 **System.Runtime.CompilerServices.CompilerGeneratedAttribute**\
  \ 特性，指出该方法由编译器生成，而非程序员写的。`=>` 操作符右侧的代码被放入编译器生成的方法中。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_378_0.png)\n\
  \n> **注意**　写 lambda 表达式时没有办法向编译器生成的方法应用定制特性。此外，不能向方法应用任何方法修饰符（比如 **unsafe**）。但这一般不会有什么问题，因为编译器生成的匿名函数总是私有的，而且方法总是静态的，要么是非静态的，具体取决于方法是否访问了任何实例成员。所以，没必要向方法应用\
  \ **public**、**protected**、**internal**、**virtual**、**sealed**、**override** 或 **abstract**\
  \ 之类的修饰符。\n\n最后，如果写前面的代码并编译，C# 编译器会将这些代码改写为下面这样（注释是我自己添加的）：\n\n```csharp\ninternal\
  \ sealed class AClass {\n    // 创建该私有字段是为了缓存委托对象，\n    // 优点：CallbackWithoutNewingADelegateObject\
  \ 不会每次调用都新建一个对象\n    // 缺点：缓存的对象永远不会被垃圾回收\n    [CompilerGenerated]\n    private\
  \ static WaitCallback <>9__CachedAnonymousMethodDelegate1;\n\n    public static\
  \ void CallbackWithoutNewingADelegateObject() {\n        if (<>9__CachedAnonymousMethodDelegate1\
  \ == null) {\n            // 第一次调用时，创建委托对象，并缓存它\n            <>9__CachedAnonymousMethodDelegate1\
  \ =\n                new WaitCallback(<CallbackWithoutNewingADelegateObject>b__0);\n\
  \        }\n        ThreadPool.QueueUserWorkItem(<>9__CachedAnonymousMethodDelegate1,\
  \ 5);\n    }\n\n    [CompilerGenerated]\n    private static void <CallbackWithoutNewingADelegateObject>b__0(Object\
  \ obj) {\n        Console.WriteLine(obj);\n    }\n}\n```\n\n**lambda 表达式必须匹配 WaitCallback\
  \ 委托**：获取一个 **Object** 并返回 **void**。但在指定参数名称时，我简单地将 **obj** 放在 `=>` 操作符的左侧。在 `=>`\
  \ 操作符右侧，**Console.WriteLine** 碰巧本来就返回 **void**。然而，如果在这里放一个返回值不为 **void** 的表达式，编译器生成的代码会直接忽略返回值，因为编译器生成的方法必须用\
  \ **void** 返回类型来满足 **WaitCallback** 委托。\n\n另外还要注意，匿名函数被标记为 **private**，禁止非类型内定义的代码访问（尽管反射能揭示出方法确实存在）。另外，匿名函数被标记为\
  \ **static**，因为代码没有访问任何实例成员（也不能访问，因为 **CallbackWithoutNewingADelegateObject** 本身是静态方法）。不过，代码可以引用类中定义的任何静态字段或静态方法。下面是一个例子：\n\
  \n```csharp\ninternal sealed class AClass {\n    private static String sm_name;\
  \ // 一个静态字段\n\n    public static void CallbackWithoutNewingADelegateObject() {\n\
  ```\n\n```csharp\nThreadPool.QueueUserWorkItem(\n    // 回调代码可引用静态成员\n    obj =>\
  \ Console.WriteLine(s_name + \": \" + obj), 5);\n}\n}\n```\n\n如果 `CallbackWithoutNewingADelegateObject`\
  \ 方法不是静态的，匿名函数的代码就可以包含对实例成员的引用。不包含实例成员引用，编译器仍会生成静态匿名函数，因为它的效率比实例方法高。之所以更高效，是因为不需要额外的\
  \ `this` 参数。但是，如果匿名函数的代码确实引用了实例成员，编译器就会生成非静态匿名函数：\n\n```csharp\ninternal sealed\
  \ class AClass {\n    private String m_name; // 一个实例字段\n\n    // 一个实例方法\n    public\
  \ void CallbackWithoutNewingADelegateObject() {\n        ThreadPool.QueueUserWorkItem(\n\
  \            // 回调代码可以引用实例成员\n            obj => Console.WriteLine(m_name + \":\
  \ \" + obj), 5);\n    }\n}\n```\n\n`=>` 操作符左侧用于指定传给 lambda 表达式的参数的名称。下例总结了一些规则：\n\
  \n```csharp\n// 如果委托不获取任何参数，就使用 ()\nFunc<String> f = () => \"Jeff\";\n\n// 如果委托获取\
  \ 1 个或更多参数，可显式指定类型\nFunc<Int32, String> f2 = (Int32 n) => n.ToString();\nFunc<Int32,\
  \ Int32, String> f3 = (Int32 n1, Int32 n2) => (n1 + n2).ToString();\n\n// 如果委托获取\
  \ 1 个或更多参数，编译器可推断类型\nFunc<Int32, String> f4 = (n) => n.ToString();\nFunc<Int32,\
  \ Int32, String> f5 = (n1, n2) => (n1 + n2).ToString();\n\n// 如果委托获取 1 个参数，可省略 ()\n\
  Func<Int32, String> f6 = n => n.ToString();\n\n// 如果委托有 ref/out 参数，必须显式指定 ref/out\
  \ 和类型\nBar b = (out Int32 n) => n = 5;\n```\n\n对于最后一个例子，假定 `Bar` 的定义如下：\n\n```csharp\n\
  delegate void Bar(out Int32 z);\n```\n\n`=>` 操作符右侧用于指定匿名函数主体。通常，主体包含要么简单、要么复杂的表达式，并最终返回非\
  \ `void` 值。刚才的代码为所有 `Func` 委托变量赋的都是返回 `String` 的 lambda 表达式。匿名函数主体还经常只由一个语句构成。调用\
  \ `ThreadPool.QueueUserWorkItem` 时就是这种情况，我向它传递了调用 `Console.WriteLine`（返回 `void`）的一个\
  \ lambda 表达式。\n\n如果主体由两个或多个语句构成，必须用大括号将语句包围。在用了大括号的情况下，如果委托期待返回值，还必须在主体中添加 `return`\
  \ 语句，例如：\n\n```csharp\nFunc<Int32, Int32, String> f7 = (n1, n2) => { Int32 sum =\
  \ n1 + n2; return sum.ToString(); };\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_380_0.png)\n\
  \n**重要提示**　lambda 表达式的主要优势在于，它从你的源代码中移除一个“间接层”（a level of indirection），或者说避免了迂回。正常情况下，必须写一个单独的方法，命名该方法，再在需要委托的地方传递这个方法名。方法名提供了引用代码主体的一种方式，如果要在多个地方引用同一个代码主体，单独写一个方法并命名确实是理想的方案。但如果只需在代码中引用这个主体一次，那么\
  \ lambda 表达式允许直接内联那些代码，不必为它分配名称，从而提高了编程效率。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_380_1.png)\n\
  \n**注意**　C# 2.0 问世时引入了一个称为匿名方法的功能。和 C# 3.0 引入的 lambda 表达式相似，匿名方法描述的也是创建匿名函数的语法。新规范（C#\
  \ 语言规范 7.14 节）建议开发人员使用新的 lambda 表达式语法，而不要使用旧的匿名方法语法，因为 lambda 表达式语法更简洁，代码更容易写、读和维护。当然，Microsoft\
  \ C# 编译器仍然支持用这两种语法创建匿名函数，以兼容当年为 C# 2.0 写的代码。在本书中，我只解释并使用 lambda 表达式语法。\n\n### 17.7.3\
  \ 简化语法 3：局部变量不需要手动包装到类中即可传给回调方法\n\n前面展示了回调代码如何引用类中定义的其他成员。但有时还希望回调代码引用存在于定义方法中的局部参数或变量。下面是一个有趣的例子：\n\
  \n```csharp\ninternal sealed class AClass {\n   public static void UsingLocalVariablesInTheCallbackCode(Int32\
  \ numToDo){\n      // 一些局部变量\n      Int32[] squares = new Int32[numToDo];\n    \
  \  AutoResetEvent done = new AutoResetEvent(false);\n\n      // 在其他线程上执行一系列任务\n\
  \      for (Int32 n = 0; n < squares.Length; n++) {\n         ThreadPool.QueueUserWorkItem(\n\
  \            obj => {\n               Int32 num = (Int32) obj;\n\n             \
  \  // 该任务通常要耗时\n               squares[num] = num * num;\n\n               // 如果是最后一个任务，就让主线程继续运行\n\
  \               if (Interlocked.Decrement(ref numToDo) == 0)\n                 \
  \ done.Set();\n            }, n);\n      }\n\n      // 等待其他所有线程结束运行\n      done.WaitOne();\n\
  \n      // 显示结果\n      for (Int32 n = 0; n < squares.Length; n++)\n         Console.WriteLine(\"\
  Index {0}, Square={1}\", n, squares[n]);\n   }\n}\n```\n\n这个例子生动地演示了 C# 如何简单地实现一个非常复杂的任务。方法定义了一个参数\
  \ `numToDo` 和两个局部变量 `squares` 和 `done`。而且 lambda 表达式的主体引用了这些变量。\n\n现在，想象 lambda\
  \ 表达式主体中的代码在一个单独的方法中（确实如此，这是 CLR 要求的）。变量的值如何传给这个单独的方法？唯一的办法是定义一个新的辅助类，这个类要为打算传给回调代码的每个值都定义一个字段。此外，回调代码还必须定义成辅助类中的实例方法。然后，`UsingLocalVariablesInTheCallbackCode`\
  \ 方法必须构造辅助类的实例，用方法定义的局部变量的值来初始化该实例中的字段。然后，构造绑定到辅助对象/实例方法的委托对象。\n\n> **注意** 当 lambda\
  \ 表达式造成编译器生成一个类，而且参数/局部变量被转变成该类的字段后，变量引用的对象的生存期被延长了。正常情况下，在方法中最后一次使用参数/局部变量之后，这个参数/局部变量就会“离开作用域”，结束其生命周期。但是，将变量转变成字段后，只要包含字段的那个对象不“死”，字段引用的对象也不会“死”。这在大多数应用程序中不是大问题，但有时要注意一下。\n\
  \n这项工作非常单调乏味，而且容易出错。但理所当然地，它们全部由 C# 自动完成。写前面的代码时，C# 编译器实际是像下面这样重写了代码（注释是我添加的）：\n\
  \n```csharp\ninternal sealed class AClass {\n    public static void UsingLocalVariablesInTheCallbackCode(Int32\
  \ numToDo) {\n\n        // 一些局部变量\n        WaitCallback callback1 = null;\n\n  \
  \      // 构造辅助类的实例\n        <>c__DisplayClass2 class1 = new <>c__DisplayClass2();\n\
  \n        // 初始化辅助类的字段\n        class1.numToDo = numToDo;\n        class1.squares\
  \ = new Int32[class1.numToDo];\n        class1.done = new AutoResetEvent(false);\n\
  \n        // 在其他线程上执行一系列任务\n        for (Int32 n = 0; n < class1.squares.Length;\
  \ n++) {\n            if (callback1 == null) {\n                // 新建的委托对象绑定到辅助对象及其匿名实例方法\n\
  \                callback1 = new WaitCallback(\n                    class1.<UsingLocalVariablesInTheCallbackCode>b__0);\n\
  \            }\n\n            ThreadPool.QueueUserWorkItem(callback1, n);\n    \
  \    }\n\n        // 等待其他所有线程结束运行\n        class1.done.WaitOne();\n\n        //\
  \ 显示结果\n        for (Int32 n = 0; n < class1.squares.Length; n++)\n            Console.WriteLine(\"\
  Index {0}, Square={1}\", n, class1.squares[n]);\n    }\n\n    // 为避免冲突，辅助类被指定了一个奇怪的名称。\n\
  \    // 而且被指定为私有的，禁止从 AClass 类外部访问\n    [CompilerGenerated]\n    private sealed\
  \ class <>c__DisplayClass2 : Object {\n\n        // 回调代码要使用的每个局部变量都有一个对应的公共字段\n\
  \        public Int32[] squares;\n        public Int32 numToDo;\n        public\
  \ AutoResetEvent done;\n\n        // 公共无参构造器\n        public <>c__DisplayClass2()\
  \ { }\n\n        // 包含回调代码的公共实例方法\n        public void <UsingLocalVariablesInTheCallbackCode>b__0(Object\
  \ obj) {\n            Int32 num = (Int32) obj;\n            squares[num] = num *\
  \ num;\n            if (Interlocked.Decrement(ref numToDo) == 0)\n             \
  \   done.Set();\n        }\n    }\n}\n```\n\n#### 重要提示\n\n毫无疑问，C# 的 lambda 表达式功能很容易被程序员滥用。我开始使用\
  \ lambda 表达式时，绝对是花了一些时间来熟悉它的。毕竟，你在一个方法中写的代码实际不在这个方法中。除了有违直觉，还使调试和单步执行变得比较有挑战性。但事实上，Visual\
  \ Studio 调试器还是非常不错的。我对自己源代码中的 lambda 表达式进行单步测试时，它处理得相当好。\n\n我为自己设定了一个规则：如果需要在回调方法中包含\
  \ 3 行以上的代码，就不使用 lambda 表达式。相反，我会手动写一个方法，并为其分配自己的名称。但如果使用得当，匿名方法确实能显著提高开发人员的效率和代码的可维护性。在以下代码中，使用\
  \ lambda 表达式感觉非常自然。没有它们，这样的代码会很难写、读和维护。\n\n```csharp\n// 创建并初始化一个 String 数组\nString[]\
  \ names = { \"Jeff\", \"Kristin\", \"Aidan\", \"Grant\" };\n\n// 只获取含有小写字母'a'的名字\n\
  Char charToFind = 'a';\nnames = Array.FindAll(names, name => name.IndexOf(charToFind)\
  \ >= 0);\n\n// 将每个字符串的字符转换为大写\nnames = Array.ConvertAll(names, name => name.ToUpper());\n\
  \n// 显示结果\nArray.ForEach(names, Console.WriteLine);\n```\n\n### 17.8 委托和反射\n\n本章到目前为止，使用委托都要求开发人员事先知道回调方法的原型。例如，假定\
  \ `fb` 是引用了一个 **Feedback** 委托的变量（参见本章 17.1 节的示例程序），那么为了调用这个委托，代码应该像下面这样写：\n\n```csharp\n\
  fb(item);   // item 被定义为 Int32\n```\n\n可以看出，编码时必须知道回调方法需要多少个参数，以及参数的具体类型。还好，开发人员几乎总是知道这些信息，所以像前面那样写代码是没有问题的。\n\
  \n不过在个别情况下，这些信息在编译时并不知道。第 11 章“事件”讨论 **EventSet** 类型时曾展示了一个例子。这个例子用字典来维护一组不同的委托类型。在运行时，为了引发事件，要在字典中查找并调用一个委托。但编译时不可能准确地知道要调用哪个委托，哪些参数必须传给委托的回调方法。\n\
  \n幸好 **System.Reflection.MethodInfo** 提供了一个 **CreateDelegate** 方法，允许在编译时不知道委托的所有必要信息的前提下创建委托。下面是\
  \ **MethodInfo** 为该方法定义的重载：\n\n```csharp\npublic abstract class MethodInfo : MethodBase\
  \ {\n    // 构造包装了一个静态方法的委托\n    public virtual Delegate CreateDelegate(Type delegateType);\n\
  \n    // 构造包装了一个实例方法的委托：target 引用“this”实参\n    public virtual Delegate CreateDelegate(Type\
  \ delegateType, Object target);\n}\n```\n\n创建好委托后，用 **Delegate** 的 **DynamicInvoke**\
  \ 方法调用它，如下所示：\n\n```csharp\npublic abstract class Delegate {\n    // 调用委托并传递参数\n\
  \    public Object DynamicInvoke(params Object[] args);\n}\n```\n\n使用反射 API（参见第\
  \ 23 章“程序集加载和反射”），首先必须获取引用了回调方法的一个 **MethodInfo** 对象。然后，调用 **CreateDelegate** 方法来构造由第一个参数\
  \ **delegateType** 所标识的 **Delegate** 派生类型的对象。如果委托包装了实例方法，还要向 **CreateDelegate**\
  \ 传递一个 **target** 参数，指定作为 **this** 参数传给实例方法的对象。\n\n**System.Delegate** 的 **DynamicInvoke**\
  \ 方法允许调用委托对象的回调方法，传递一组在运行时确定的参数。调用 **DynamicInvoke** 时，它会在内部保证传递的参数与回调方法期望的参数兼容。如果兼容，就调用回调方法；否则抛出\
  \ **ArgumentException** 异常。**DynamicInvoke** 返回回调方法所返回的对象。\n\n以下代码演示了如何使用 **CreateDelegate**\
  \ 方法和 **DynamicInvoke** 方法：\n\n```csharp\nusing System;\nusing System.Reflection;\n\
  using System.IO;\nusing System.Linq;\n\n// 下面是一些不同的委托定义\ninternal delegate Object\
  \ TwoInt32s(Int32 n1, Int32 n2);\ninternal delegate Object OneString(String s1);\n\
  \npublic static class DelegateReflection {\n   public static void Main(String[]\
  \ args) {\n      if (args.Length < 2) {\n         String usage =\n            \"\
  Usage:\" +\n            \"{0} delType methodName [Arg1] [Arg2]\" +\n           \
  \ \"{0}    where delType must be TwoInt32s or OneString\" +\n            \"{0} \
  \   if delType is TwoInt32s, methodName must be Add or Subtract\" +\n          \
  \  \"{0}    if delType is OneString, methodName must be NumChars or Reverse\"+\n\
  \            \"{0}\" +\n            \"{0}Examples:\" +\n            \"{0}    {1}\
  \ TwoInt32s Add 123 321\" +\n            \"{0}    {1} TwoInt32s Subtract 123 321\"\
  \ +\n            \"{0}    {1} OneString NumChars (\\\"Hello there\\\")\" +\n   \
  \         \"{0}    {1} OneString Reverse (\\\"Hello there\\\")\";\n         Console.WriteLine(usage,\
  \ Environment.NewLine);\n         return;\n      }\n\n      // 将 delType 实参转换为委托类型\n\
  \      Type delType = Type.GetType(args[0]);\n      if (delType == null) {\n   \
  \      Console.WriteLine(\"Invalid delType argument: \" + args[0]);\n         return;\n\
  \      }\n\n      Delegate d;\n      try {\n         // 将 Arg1 实参转换为方法\n       \
  \  MethodInfo mi =\n            typeof(DelegateReflection).GetTypeInfo().GetDeclaredMethod(args[1]);\n\
  \n         // 创建包装了静态方法的委托对象\n         d = mi.CreateDelegate(delType);\n      }\n\
  \      catch (ArgumentException) {\n         Console.WriteLine(\"Invalid methodName\
  \ argument: \" + args[1]);\n         return;\n      }\n\n      // 创建一个数组，其中只包含要通过委托对象传给方法的参数\n\
  \      Object[] callbackArgs = new Object[args.Length - 2];\n\n      if (d.GetType()\
  \ == typeof(TwoInt32s)) {\n         try {\n            // 将 String 类型的参数转换为 Int32\
  \ 类型的参数\n            for (Int32 a = 2; a < args.Length; a++)\n               callbackArgs[a\
  \ - 2] = Int32.Parse(args[a]);\n         }\n         catch (FormatException) {\n\
  \            Console.WriteLine(\"Parameters must be integers.\");\n            return;\n\
  \         }\n      }\n\n      if (d.GetType() == typeof(OneString)) {\n        \
  \ // 只复制 String 参数\n         Array.Copy(args, 2, callbackArgs, 0, callbackArgs.Length);\n\
  \      }\n```\n\n```csharp\ntry {\n    // 调用委托并显示结果\n    Object result = d.DynamicInvoke(callbackArgs);\n\
  \    Console.WriteLine(\"Result = \" + result);\n}\ncatch (TargetParameterCountException)\
  \ {\n    Console.WriteLine(\"Incorrect number of parameters specified.\");\n}\n\n\
  // 这个回调方法获取 2 个 Int32 参数\nprivate static Object Add(Int32 n1, Int32 n2) {\n    return\
  \ n1 + n2;\n}\n\n// 这个回调方法获取 2 个 Int32 参数\nprivate static Object Subtract(Int32\
  \ n1, Int32 n2) {\n    return n1 - n2;\n}\n\n// 这个回调方法获取 1 个 String 参数\nprivate\
  \ static Object NumChars(String s1) {\n    return s1.Length;\n}\n\n// 这个回调方法获取 1\
  \ 个 String 参数\nprivate static Object Reverse(String s1) {\n    return new String(s1.Reverse().ToArray());\n\
  }\n}\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_387_0.png)\n"
- "## 第 18 章　定制特性\n\n本章内容：\n\n- 使用定制特性\n- 定义自己的特性类\n- 特性构造器和字段/属性数据类型\n- 检测定制特性\n\
  - 两个特性实例的相互匹配\n- 检测定制特性时不创建从 Attribute 派生的对象\n- 条件特性类\n\n本章讨论 Microsoft .NET Framework\
  \ 提供的最具创意的功能之一：定制特性(custom attribute)。利用定制特性，可宣告式地为自己的代码构造添加注解来实现特殊功能。定制特性允许为几乎每一个元数据表记录项定义和应用信息。这种可扩展的元数据信息能在运行时查询，从而动态改变代码的执行方式。使用各种\
  \ .NET Framework 技术(Windows 窗体、WPF 和 WCF 等)，会发现它们都利用了定制特性，目的是方便开发者在代码中表达他们的意图。任何\
  \ .NET Framework 开发人员都有必要完全掌握定制特性。\n\n### 18.1　使用定制特性\n\n我们都知道能将 public、private、static\
  \ 这样的特性应用于类型和成员。我们都同意应用特性具有很大的作用。但是，如果能定义自己的特性，会不会更有用？例如，能不能定义一个类型，指出该类型能通过序列化来进行远程处理？能不能将特性应用于方法，指出执行该方法需要授予特定安全权限？\n\
  \n为类型和方法创建和应用用户自定义的特性能带来极大的便利。当然，编译器必须理解这些特性，才能在最终的元数据中生成特性信息。由于编译器厂商一般不会发布其编译器产品的源代码，所以\
  \ Microsoft 采取另一种机制提供对用户自定义特性的支持。这个机制称为定制特性。它的功能很强大，在应用程序的设计时和运行时都能发挥重要作用。任何人都能定义和使用定制特性。另外，面向\
  \ CLR 的所有编译器都必须识别定制特性，并能在最终的元数据中生成特性信息。\n\n关于自定义特性，首先要知道它们只是将一些附加信息与某个目标元素关联起来的方式。编译器在托管模块的元数据中生成（嵌入）这些额外的信息。大多数特性对编译器来说没有意义；编译器只是机械地检测源代码中的特性，并生成对应的元数据。\n\
  \n.NET Framework 类库（FCL）定义了几个定制特性，可将它们应用于自己源代码中的各种元素。下面是一些例子。\n\n- 将 **DllImport**\
  \ 特性应用于方法，告诉 CLR 该方法的实现在于指定 DLL 的非托管代码中。\n- 将 **Serializable** 特性应用于类型，告诉序列化格式化器①一个实例的字段可以序列化和反序列化。\n\
  - 将 **AssemblyVersion** 特性应用于程序集，设置程序集的版本号。\n- 将 **Flags** 特性应用于枚举类型，枚举类型就成了位标志（bit\
  \ flag）集合。\n\n① “格式化器”是本书的译法，文档翻译成“格式化程序”。格式化器是实现了 **System.Runtime.Serialization.IFormatter**\
  \ 接口的类型，它知道如何序列化和反序列化一个对象图。——译注\n\n以下 C# 代码应用了大量特性。在 C# 中，为了将定制特性应用于目标元素，要将特性放置于目标元素前的一对方括号中。代码本身做的事情不重要，重要的是对特性有一个认识。\n\
  \n```csharp\nusing System;\nusing System.Runtime.InteropServices;\n\n[StructLayout(LayoutKind.Sequential,\
  \ CharSet = CharSet.Auto)]\ninternal sealed class OSVERSIONINFO {\n    public OSVERSIONINFO()\
  \ {\n        OSVersionInfoSize = (UInt32) Marshal.SizeOf(this);\n    }\n\n    public\
  \ UInt32 OSVersionInfoSize = 0;\n    public UInt32 MajorVersion = 0;\n    public\
  \ UInt32 MinorVersion = 0;\n    public UInt32 BuildNumber = 0;\n    public UInt32\
  \ PlatformId = 0;\n\n    [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 128)]\n\
  \    public String CSDVersion = null;\n}\n\ninternal sealed class MyClass {\n  \
  \  [DllImport(\"Kernel32\", CharSet = CharSet.Auto, SetLastError = true)]\n    public\
  \ static extern Boolean GetVersionEx([In, Out] OSVERSIONINFO ver);\n}\n```\n\n在这里，**StructLayout**\
  \ 特性应用于 **OSVERSIONINFO** 类，**MarshalAs** 特性应用于 **CSDVersion** 字段，**DllImport**\
  \ 特性应用于 **GetVersionEx** 方法，而 **In** 和 **Out** 特性应用于 **GetVersionEx** 方法的 ver 参数。每种编程语言都定义了将定制特性应用于目标元素所采用的语法。例如，Microsoft\
  \ Visual Basic .NET 要求使用一对尖括号（<>）而不是方括号。\n\nCLR 允许将特性应用于可在文件的元数据中表示的几乎任何东西。不过，最常应用特性的目标元素是类型和方法。\n\
  \n> **注意**　将特性应用于源代码中的目标元素时，C#编译器允许省略 Attribute 后缀以减少字符量，并提升源代码的可读性。本章许多示例代码都利用了\
  \ C#提供的这一便利。例如，许多源代码用的都是 `[DllImport(...)]`，而不是 `[DllImportAttribute(...)]`。\n\n\
  如前所述，特性是类的实例。类必须有公共构造器才能创建它的实例。所以，将特性应用于目标元素时，语法类似于调用类的某个实例构造器。除此之外，语言可能支持一些特殊的语法，允许设置与特性类关联的公共字段或属性。前面的例子将\
  \ DllImport 特性应用于 GetVersionEx 方法：\n\n```csharp\n[DllImport(\"Kernel32\", CharSet\
  \ = CharSet.Auto, SetLastError = true)]\n```\n\n这一行代码的语法表面上看很奇怪，因为调用构造器时永远不会使用这样的语法。查阅\
  \ DllImportAttribute 类的文档，会发现它的构造器要求接受一个 String 参数。在这个例子中，\"Kernel32\" 将传给这个参数。构造器的参数称为定位参数(positional\
  \ parameter)，而且是强制性的；也就是说，应用特性时必须指定参数。\n\n那么，另外两个“参数”是什么呢？这种特殊的语法允许在构造好 DllImportAttribute\
  \ 对象后设置对象的任何公共字段或属性。在这个例子中，将 \"Kernel32\" 传给构造器并构造好 DllImportAttribute 对象之后，对象的公共实例字段\
  \ CharSet 和 SetLastError 分别设为 CharSet.Auto 和 true。用于设置字段或属性的“参数”称为命名参数(named parameter)。这种参数是可选的，因为在应用特性的实例时不一定要指定参数。稍后会解释是什么导致了实际地构造\
  \ DllImportAttribute 类的实例。\n\n还要注意，可将多个特性应用于一个目标元素。例如，在本章的第一个示例程序中，GetVersionEx\
  \ 方法的 ver 参数同时应用了 In 和 Out 这两个特性。将多个特性应用于单个目标元素时，注意特性的顺序无关紧要。另外，在 C#中，既可将每个特性都封闭到一对方括号中，也可在一对方括号中封闭多个以逗号分隔的特性。如果特性类的构造器不获取参数，那么圆括号可以省略。最后，就像前面说到的那样，Attribute\
  \ 后缀也是可选的。下面代码行具有相同的行为，它们演示了应用多个特性时所有可能的方式：\n\n```csharp\n[Serializable][Flags]\n\
  [Serializable, Flags]\n[FlagsAttribute, SerializableAttribute]\n[FlagsAttribute()][Serializable()]\n\
  ```\n\n### 18.2　定义自己的特性类\n\n现在已经知道特性是从 System.Attribute 派生的一个类的实例，也知道了如何应用特性。接着要研究如何定义定制特性类。假定你是\
  \ Microsoft 的员工，负责为枚举类型添加位标志(bit flag)支持，那么要做的第一件事就是定义一个 FlagsAttribute 类：\n\n```csharp\n\
  namespace System {\n    public class FlagsAttribute : System.Attribute {\n     \
  \   public FlagsAttribute() {\n        }\n    }\n}\n```\n\n注意，FlagsAttribute 类从\
  \ Attribute 继承。这使 FlagsAttribute 类成为符合 CLS 规范的定制特性。此外，注意类名有 Attribute 后缀；这是为了保持与标准的兼容性，但这并不是必须的。最后，所有非抽象特性至少要包含一个公共构造器。上述代码中的\
  \ FlagsAttribute 构造器非常简单，不获取任何参数，也不做任何事情。\n\n> **重要提示**　应将特性想象成逻辑状态容器。也就是说，虽然特性类型是一个类，但这个类应该很简单。应该只提供一个公共构造器来接受特性的强制性(或定位性)状态信息，而且这个类可以提供公共字段和属性，以接受特性的可选(或命名)状态信息。类不应提供任何公共方法、事件或其他成员。\n\
  > \n> 我通常不鼓励使用公共字段。特性也不例外，我同样不鼓励在这种类型中使用公共字段。使用属性要好得多。因为在更改特性类的实现方式时，属性能提供更大的灵活性。\n\
  \n现在的情况是 FlagsAttribute 类的实例能应用于任何目标元素。但事实上，这个特性应该只能应用于枚举类型，应用于属性或方法是没有意义的。为了告诉编译器这个特性的合法应用范围，需要向特性类应用\
  \ System.AttributeUsageAttribute 类的实例。下面是新的代码：\n\n```csharp\nnamespace System {\n\
  \    [AttributeUsage(AttributeTargets.Enum, Inherited = false)]\n    public class\
  \ FlagsAttribute : System.Attribute {\n        public FlagsAttribute() {\n     \
  \   }\n    }\n}\n```\n\n新版本将 AttributeUsageAttribute 的实例应用于特性。毕竟，特性类型本质上还是类，而类是可以应用特性的。AttributeUsage\
  \ 特性是一个简单的类，可利用它告诉编译器定制特性的合法应用范围。所有编译器都内建了对该特性的支持，并会在定制特性应用于无效目标时报警。在这个例子中，AttributeUsage\
  \ 特性指出 Flags 特性的实例只能应用于枚举类型的目标。\n\n由于特性不过是类型，所以 AttributeUsageAttribute 类理解起来很容易。以下是该类的\
  \ FCL 源代码：\n\n```csharp\n[Serializable]\n[AttributeUsage(AttributeTargets.Class,\
  \ Inherited=true)]\npublic sealed class AttributeUsageAttribute : Attribute {\n\
  \    internal static AttributeUsageAttribute Default =\n        new AttributeUsageAttribute(AttributeTargets.All);\n\
  \n    internal Boolean m_allowMultiple = false;\n    internal AttributeTargets m_attributeTarget\
  \ = AttributeTargets.All;\n    internal Boolean m_inherited = true;\n\n    // 这是一个公共构造器\n\
  \    public AttributeUsageAttribute(AttributeTargets validOn) {\n        m_attributeTarget\
  \ = validOn;\n    }\n\n    internal AttributeUsageAttribute(AttributeTargets validOn,\n\
  \        Boolean allowMultiple, Boolean inherited) {\n        m_attributeTarget\
  \ = validOn;\n        m_allowMultiple = allowMultiple;\n        m_inherited = inherited;\n\
  \    }\n\n    public Boolean AllowMultiple {\n        get { return m_allowMultiple;\
  \ }\n        set { m_allowMultiple = value; }\n    }\n\n    public Boolean Inherited\
  \ {\n        get { return m_inherited; }\n        set { m_inherited = value; }\n\
  \    }\n\n    public AttributeTargets ValidOn {\n        get { return m_attributeTarget;\
  \ }\n    }\n}\n```\n\n如你所见，**AttributeUsageAttribute** 类有一个公共构造器，它允许传递位标志(bit flag)来指明特性的合法应用范围。**System.AttributeTargets**\
  \ 枚举类型在 FCL 中是像下面这样定义的：\n\n```csharp\n[Flags, Serializable]\npublic enum AttributeTargets\
  \ {\n    Assembly          = 0x0001,\n    Module            = 0x0002,\n    Class\
  \             = 0x0004,\n    Struct            = 0x0008,\n    Enum             \
  \ = 0x0010,\n    Constructor       = 0x0020,\n    Method            = 0x0040,\n\
  \    Property          = 0x0080,\n    Field             = 0x0100,\n    Event   \
  \          = 0x0200,\n    Interface         = 0x0400,\n    Parameter         = 0x0800,\n\
  \    Delegate          = 0x1000,\n    ReturnValue       = 0x2000,\n    GenericParameter\
  \  = 0x4000,\n    All = Assembly    | Module | Class | Struct | Enum |\n       \
  \   Constructor | Method | Property | Field | Event |\n          Interface   | Parameter\
  \ | Delegate | ReturnValue |\n          GenericParameter\n}\n```\n\n**AttributeUsageAttribute**\
  \ 类提供了两个附加的公共属性，即 **AllowMultiple** 和 **Inherited**。可在向特性类应用特性时选择设置这两个属性。\n\n大多数特性多次应用于同一个目标是没有意义的。例如，将\
  \ **Flags** 或 **Serializable** 特性多次应用于同一个目标不会有任何好处。事实上，编译如下所示的代码：\n\n```csharp\n\
  [Flags][Flags]\ninternal enum Color {\n    Red\n}\n```\n\n编译器会报告以下错误：\n\n```text\n\
  error CS0579: 重复的\"Flags\"特性。\n```\n\n但少数几个特性确有必要多次应用于同一个目标。FCL 特性类 ConditionalAttribute\
  \ 允许将它的多个实例应用于同一个目标元素。不将 AllowMultiple 明确设为 true，特性就只能向选定的目标元素应用一次。\n\nAttributeUsageAttribute\
  \ 的另一个属性是 Inherited，它指出特性在应用于基类时，是否同时应用于派生类和重写的方法。以下代码演示了特性的继承：\n\n```csharp\n[AttributeUsage(AttributeTargets.Class\
  \ | AttributeTargets.Method,\n    Inherited=true)]\ninternal class TastyAttribute\
  \ : Attribute\n{\n}\n\n[Tasty][Serializable]\ninternal class BaseType\n{\n    [Tasty]\
  \ protected virtual void DoSomething() { }\n}\n\ninternal class DerivedType : BaseType\n\
  {\n    protected override void DoSomething() { }\n}\n```\n\n在上述代码中，DerivedType 及其\
  \ DoSomething 方法都被视为 Tasty，因为 TastyAttribute 类被标记为可继承。但 DerivedType 不可序列化，因为 FCL\
  \ 的 SerializableAttribute 类被标记为不可继承。\n\n注意，.NET Framework 只认为类、方法、属性、事件、字段、方法返回值和参数等目标元素是可继承的。所以，定义特性类型时，只有在该特性应用于上述某个目标的前提下，才应该将\
  \ Inherited 设为 true。注意，可继承特性不会造成在托管模块中为派生类型生成额外的元数据。18.4 节“检测定制特性”将进一步讨论这方面的问题。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_393_0.png)\n\n> **注意**　定义自己的特性类时，如果忘记向自己的类应用\
  \ AttributeUsage 特性，编译器和 CLR 将假定该特性能应用于所有目标元素，向每个目标元素都只能应用一次，而且可继承。这些假定模仿了 AttributeUsageAttribute\
  \ 类中的默认字段值。\n\n### 18.3　特性构造器和字段/属性数据类型\n\n定制特性类可定义构造器来获取参数。开发人员在应用特性类的实例时必须指定这些参数。还可在类中定义非静态公共字段和属性，使开发人员能为特性类的实例选择恰当的设置。\n\
  \n定义特性类的实例构造器、字段和属性时，可供选择的数据类型并不多。具体地说，只允\n\n允许 Boolean、Char、Byte、SByte、Int16、UInt16、Int32、UInt32、Int64、UInt64、Single、Double、String、Type、Object\
  \ 或枚举类型。此外，可使用上述任意类型的一维 0 基数组。但应尽量避免使用数组，因为对于定制特性，如果它的构造器要获取数组作为参数，就会失去与 CLS 的相容性。\n\
  \n应用特性时必须传递一个编译时常量表达式，它与特性类定义的类型匹配。在特性类定义了一个 Type 参数、Type 字段或者 Type 属性的任何地方，都必须使用\
  \ C# typeof 操作符（如下例所示）。在特性类定义了一个 Object 参数、Object 字段或者 Object 属性的任何地方，都可传递一个 Int32、String\
  \ 或其他任何常量表达式（包括 null）。如果常量表达式代表值类型，那么在运行时构造特性的实例时会对值类型进行装箱。以下是一个示例特性及其用法：\n\n```csharp\n\
  using System;\n\ninternal enum Color { Red }\n\n[AttributeUsage(AttributeTargets.All)]\n\
  internal sealed class SomeAttribute : Attribute {\n    public SomeAttribute(String\
  \ name, Object o, Type[] types) {\n        // 'name'引用一个 String\n        // 'o'引用一个合法的类型(如有必要，就进行装箱)\n\
  \        // 'types'引用一个一维 0 基 Type 数组\n    }\n}\n\n[Some(\"Jeff\", Color.Red, new\
  \ Type[] { typeof(Math), typeof(Console) })]\ninternal sealed class SomeType {\n\
  }\n```\n\n逻辑上，当编译器检测到向目标元素应用了定制特性时，会调用特性类的构造器，向它传递任何指定的参数，从而构造特性类的实例。然后，编译器采用增强型构造器语法所指定的值，对任何公共字段和属性进行初始化。构造并初始化好定制特性类的对象之后，编译器将它的状态序列化到目标元素的元数据表记录项中。\n\
  \n> **重要提示**　为方便理解，可以这样想象定制特性：它是类的实例，被序列化成驻留在元数据中的字节流。运行时可对元数据中的字节流进行反序列化，从而构造出类的实例。实际发生的事情是：编译器在元数据中生成创建特性类的实例所需的信息。每个构造器参数都是\
  \ 1 字节的类型 ID，后跟具体的值。对构造器的参数进行“序列化”时，编译器先写入字段/属性名称，再跟上 1 字节的类型 ID，最后是具体的值。如果是数组，则会先保存数组元素的个数，再跟上每个单独的元素。\n\
  \n### 18.4 检测定制特性\n\n仅仅定义特性类没有用。确实可以定义自己想要的所有特性类，并应用自己想要的所有实例。但这样除了在程序集生成额外的元数据，没有其他任何意义。应用程序代码的行为不会有任何改变。\n\
  \n第 15 章“枚举类型和位标志”描述了如何将 Flags 特性应用于枚举类型，从而改变 System.Enum 的 ToString 和 Format 方法的行为。方法的行为之所以改变，是因为它们会在运行时检查自己操作的枚举类型是否关联了\
  \ Flags 特性元数据。代码利用一种称为反射的技术检测特性的存在。这里只是简单地演示一下反射。第 23 章“程序集加载和反射”会完整地讨论这种技术。\n\n\
  假定你是 Microsoft 的员工，负责实现 Enum 的 ToString 方法，你会像下面这样实现它：\n\n```csharp\npublic override\
  \ String ToString() {\n\n    // 枚举类型是否应用了 FlagsAttribute 类型的实例？\n    if (this.GetType().IsDefined(typeof(FlagsAttribute),\
  \ false)) {\n        // 如果是，就执行代码，将值视为一个位标志枚举类型\n        ...\n    } else {\n   \
  \     // 如果不是，就执行代码，将值视为一个普通枚举类型\n        ...\n    }\n    ...\n}\n```\n\n上述代码调用\
  \ Type 的 IsDefined 方法，要求系统查看枚举类型的元数据，检查是否关联了 FlagsAttribute 类的实例。如果 IsDefined 返回\
  \ true，表明 FlagsAttribute 的一个实例已与枚举类型关联，ToString 方法认为值包含了一个位标志(bit flag)集合。如果 IsDefined\
  \ 返回 false，Format 方法认为值是普通的枚举类型。\n\n因此，在定义定制特性时，也必须实现一些代码来检测某些目标上是否存在该特性类的实例，然后执行一些逻辑分支代码。这样定制特性才能真正发挥作用。\n\
  \nFCL 提供了多种方式来检测特性的存在。如果通过 System.Type 对象来检测特性，可以像前面展示的那样使用 IsDefined 方法。但有时需要检测除了类型之外的其他目标(比如程序集、模块或方法)上的特性。为简化讨论，让我们聚焦于\
  \ System.Reflection.CustomAttributeExtensions 类定义的扩展方法。该类定义了三个静态方法来获取与目标关联的特性：IsDefined、GetCustomAttributes\
  \ 和 GetCustomAttribute。每个方法都有几个重载版本。例如，每个方法都有一个版本能操作类型成员(类、结构、枚举、接口、委托、构造器、方法、属性、字段、事件和返回类型)、参数、模块和程序集。还有一些版本能指示系统遍历继承层次结构，在结果中包含继承的特性。表\
  \ 18-1 简要总结了每个方法的用途，它们在元数据上反射以查找与 CLS 相容的定制特性类型的实例。\n\n如果只想判断目标是否应用了一个特性，那么应该调用\
  \ IsDefined，因为它比另两个方法更高效。但我们知道，将特性应用于目标时，可以为特性的构造器指定参数，并可选择设置字段和属性。使用 IsDefined\
  \ 不会构造特性对象，不会调用构造器，也不会设置字段和属性。\n\n要构造特性对象，必须调用 GetCustomAttributes 或 GetCustomAttribute\
  \ 方法。每次调用这两个方法，都会构造指定特性类型的新实例，并根据源代码中指定的值来设置每个实例的字段和属性。两个方法返回的都是对完全构造好的特性类实例的引用。\n\
  \n### 表 18-1 System.Reflection.CustomAttributeExtensions 定义的三个静态方法\n\n| 方法名称 | 说明\
  \ |\n| --- | --- |\n| **IsDefined** | 如果至少有一个指定的 **Attribute** 派生类的实例与目标关联，就返回 **true**。这个方法效率很高，因为它不构造(反序列化)特性类的任何实例\
  \ |\n| **GetCustomAttributes** | 返回应用于目标的指定特性对象的集合。每个实例都使用编译时指定的参数、字段和属性来构造(反序列化)。如果目标没有应用指定特性类的实例，就返回一个空集合。该方法通常用于已将\
  \ **AllowMultiple** 设为 **true** 的特性，或者用于列出已应用的所有特性 |\n| **GetCustomAttribute** |\
  \ 返回应用于目标的指定特性类的实例。实例使用编译时指定的参数、字段和属性来构造(反序列化)。如果目标没有应用指定特性类的实例，就返回 **null**。如果目标应用了指定特性的多个实例，就抛出\
  \ **System.Reflection.AmbiguousMatchException** 异常。该方法通常用于已将 **AllowMultiple** 设为\
  \ **false** 的特性 |\n\n调用上述任何方法，内部都必须扫描托管模块的元数据，执行字符串比较来定位指定的定制特性类。显然，这些操作会耗费一定时间。假如对性能的要求比较高，可考虑缓存这些方法的调用结果，而不是反复调用来请求相同的信息。\n\
  \n**System.Reflection** 命名空间定义了几个类允许检查模块的元数据。这些类包括 **Assembly**，**Module**，**ParameterInfo**，**MemberInfo**，**Type**，**MethodInfo**，**ConstructorInfo**，**FieldInfo**，**EventInfo**，**PropertyInfo**\
  \ 及其各自的 `*Builder` 类。所有类都提供了 **IsDefined** 和 **GetCustomAttributes** 方法。\n\n反射类提供的\
  \ **GetCustomAttributes** 方法返回的是由 **Object** 实例构成的数组(**Object[]**)，而不是由 **Attribute**\
  \ 实例构成的数组(**Attribute[]**)。这是由于反射类能返回不相容于 CLS 规范的特性类的对象。不过，大可不必关心这种不一致性，因为非 CLS\
  \ 相容的特性是很稀少的。事实上，我与.NET Framework 打交道至今，还没有见过一例。\n\n> 注意 只有 **Attribute**、**Type**\
  \ 和 **MethodInfo** 类才实现了支持 **Boolean inherit** 参数的反射方法。其他能检查特性的所有反射方法都会忽略 **inherit**\
  \ 参数，而且不会检查继承层次结构。要检查事件、属性、字段、构造器或参数是否应用了继承的特性，只能调用 **Attribute** 的某个方法。\n\n还要注意，将一个类传给\
  \ **IsDefined**、**GetCustomAttribute** 或者 **GetCustomAttributes** 方法时，这些方法会检测是否应用了指定的特性类或者它的派生类。如果只是想搜索一个具体的特性类，应针对返回值执行一次额外的检查，确保方法返回的正是想搜索的类。还可考虑将自己的特性类定义成\
  \ **sealed**，减少可能存在的混淆，并避免执行这个额外的检查。\n\n以下示例代码列出了一个类型中定义的所有方法，并显示应用于每个方法的特性。代码仅供演示，平时不会像这样将这些定制特性应用于这些目标元素。\n\
  \n```csharp\nusing System;\nusing System.Diagnostics;\nusing System.Reflection;\n\
  using System.Linq;\n\n[assembly: CLSCompliant(true)]\n\n[Serializable]\n[DefaultMemberAttribute(\"\
  Main\")]\n[DebuggerDisplayAttribute(\"Richter\", Name = \"Jeff\", Target = typeof(Program))]\n\
  public sealed class Program {\n    [Conditional(\"Debug\")]\n    [Conditional(\"\
  Release\")]\n    public void DoSomething() { }\n\n    public Program() {\n    }\n\
  \n    [CLSCompliant(true)]\n    [STAThread]\n    public static void Main()\n   \
  \ {\n        // 显示应用于这个类型的特性集\n        ShowAttributes(typeof(Program));\n\n    \
  \    // 获取与类型关联的方法集\n        var members =\n            from m in typeof(Program).GetTypeInfo().DeclaredMembers.OfType<MethodBase>()\n\
  \            where m.IsPublic\n            select m;\n\n        foreach (MemberInfo\
  \ member in members) {\n            // 显示应用于这个成员的特性集\n            ShowAttributes(member);\n\
  \        }\n    }\n\n    private static void ShowAttributes(MemberInfo attributeTarget)\
  \ {\n        var attributes = attributeTarget.GetCustomAttributes<Attribute>();\n\
  \n        Console.WriteLine(\"Attributes applied to {0}: {1}\",\n            attributeTarget.Name,\
  \ (attributes.Count() == 0 ? \"None\" : String.Empty));\n\n        foreach (Attribute\
  \ attribute in attributes) {\n            // 显示所应用的每个特性的类型\n            Console.WriteLine(\"\
  \ {0}\", attribute.GetType().ToString());\n\n            if (attribute is DefaultMemberAttribute)\n\
  \                Console.WriteLine(\" MemberName={0}\",\n                    ((DefaultMemberAttribute)attribute).MemberName);\n\
  \            if (attribute is ConditionalAttribute)\n                Console.WriteLine(\"\
  \ ConditionString={0}\",\n                    ((ConditionalAttribute)attribute).ConditionString);\n\
  \            if (attribute is CLSCompliantAttribute)\n                Console.WriteLine(\"\
  \ IsCompliant={0}\",\n                    ((CLSCompliantAttribute)attribute).IsCompliant);\n\
  \n            DebuggerDisplayAttribute dda = attribute as DebuggerDisplayAttribute;\n\
  \            if (dda != null) {\n                Console.WriteLine(\" Value={0},\
  \ Name={1}, Target={2}\",\n                    dda.Value, dda.Name, dda.Target);\n\
  \            }\n        }\n        Console.WriteLine();\n    }\n}\n```\n\n编译并运行上述应用程序得到以下输出：\n\
  \n```text\nAttributes applied to Program:\n  System.SerializableAttribute\n  System.Reflection.DefaultMemberAttribute\n\
  MemberName=Main\nSystem.Diagnostics.DebuggerDisplayAttribute\nValue=Richter, Name=Jeff,\
  \ Target=Program\n\nAttributes applied to DoSomething:\nSystem.Diagnostics.ConditionalAttribute\n\
  ConditionString=Debug\nSystem.Diagnostics.ConditionalAttribute\nConditionString=Release\n\
  \nAttributes applied to Main:\nSystem.STAThreadAttribute\nSystem.CLSCompliantAttribute\n\
  IsCompliant=True\n\nAttributes applied to .ctor: None\n```\n\n### 18.5 两个特性实例的相互匹配\n\
  \n除了判断是否向目标应用了一个特性的实例，可能还需要检查特性的字段来确定它们的值。一个办法是老老实实写代码检查特性类的字段值。但 `System.Attribute`\
  \ 重写了 `Object` 的 `Equals` 方法，会在内部比较两个对象的类型。不一致会返回 `false`。如果一致，`Equals` 会利用反射来比较两个特性对象中的字段值(为每个字段都调用\
  \ `Equals`)。所有字段都匹配就返回 `true`；否则返回 `false`。可在自己的定制特性类中重写 `Equals` 来移除反射的使用，从而提升性能。\n\
  \n`System.Attribute` 还公开了虚方法 `Match`，可重写它来提供更丰富的语义。`Match` 的默认实现只是调用 `Equals` 方法并返回它的结果。下例演示了如何重写\
  \ `Equals` 和 `Match`，后者在一个特性代表另一个特性的子集的前提下返回 `true`。另外，还演示了如何使用 `Match`。\n\n```csharp\n\
  using System;\n\n[Flags]\ninternal enum Accounts {\n    Savings   = 0x0001,\n  \
  \  Checking  = 0x0002,\n    Brokerage = 0x0004\n}\n\n[AttributeUsage(AttributeTargets.Class)]\n\
  internal sealed class AccountsAttribute : Attribute {\n    private Accounts m_accounts;\n\
  \n    public AccountsAttribute(Accounts accounts) {\n        m_accounts = accounts;\n\
  \    }\n\n    public override Boolean Match(Object obj)\n    {\n        // 如果基类实现了\
  \ Match，而且基类不是\n        // Attribute，就取消对下面这行代码的注释\n        // if (!base.Match(obj))\
  \ return false;\n\n        // 由于 'this' 不为 null，所以假如 obj 为 null，\n        // 那么对象肯定不匹配\n\
  \        // 注意：如果你确信基类正确实现了 Match，\n        // 那么下面这一行可以删除\n        if (obj == null)\
  \ return false;\n```\n\n```csharp\n// 如果对象属于不同的类型，肯定不匹配\n// 注意：如果你信任基类正确实现了 Match，\n\
  // 那么下面这一行可以删除\nif (this.GetType() != obj.GetType()) return false;\n\n// 将 obj 转型为我们的类型以访问字段\n\
  // 注意：转型不可能失败，因为我们知道\n// 两个对象是相同的类型\nAccountsAttribute other = (AccountsAttribute)obj;\n\
  \n// 比较字段，判断它们是否有相同的值\n// 这个例子判断'this'的帐户是不是\n// other 的帐户的一个子集\nif ((other.m_accounts\
  \ & m_accounts) != m_accounts)\n    return false;\n\nreturn true; // 对象匹配\n}\n\n\
  public override Boolean Equals(Object obj)\n{\n    // 如果基类实现了 Equals，而且基类不是\n  \
  \  // Object，就取消对下面这行代码的注释：\n    // if (!base.Equals(obj)) return false\n\n    //\
  \ 由于'this'不为 null，所以假如 object 为 null，\n    // 那么对象肯定不相等\n    // 注意：如果你信任基类正确实现了\
  \ Equals，\n    // 那么下面这一行可以删除\n    if (obj == null) return false;\n\n    // 如果对象属于不同的类型，肯定不相等\n\
  \    // 注意：如果你信任基类正确实现了 Equals，\n    // 那么下面这一行可以删除\n    if (this.GetType() != obj.GetType())\
  \ return false;\n\n    // 将 obj 转型为我们的类型以访问字段\n    // 注意：转型不可能失败，因为我们知道\n    //\
  \ 两个对象是相同的类型\n    AccountsAttribute other = (AccountsAttribute)obj;\n\n    // 比较字段，判断它们是否有相同的值\n\
  \    // 这个例子判断'this'的帐户是不是\n    // 与 other 的帐户相同\n    if (other.m_accounts != m_accounts)\n\
  \        return false;\n\n    return true; // 对象相等\n}\n\n// 重写 GetHashCode，因为我们重写了\
  \ Equals\npublic override Int32 GetHashCode() {\n    return (Int32)m_accounts;\n\
  }\n}\n\n[Accounts(Accounts.Savings)]\ninternal sealed class ChildAccount { }\n\n\
  [Accounts(Accounts.Savings | Accounts.Checking | Accounts.Brokerage)]\ninternal\
  \ sealed class AdultAccount { }\n\npublic sealed class Program\n{\n    public static\
  \ void Main()\n    {\n        CanWriteCheck(new ChildAccount());\n        CanWriteCheck(new\
  \ AdultAccount());\n\n        // 只是为了演示在一个没有应用 AccountsAttribute 的类型上，\n       \
  \ // 方法也能正确地工作\n        CanWriteCheck(new Program());\n    }\n\n    private static\
  \ void CanWriteCheck(Object obj) {\n        // 构造 attribute 类型的一个实例，并把它初始化成\n  \
  \      // 我们要显式查找的内容\n        Attribute checking = new AccountsAttribute(Accounts.Checking);\n\
  \n        // 构造应用于类型的特性实例\n        Attribute validAccounts = Attribute.GetCustomAttribute(\n\
  \            obj.GetType(), typeof(AccountsAttribute), false);\n\n        // 如果确实应用了特性，而且特性指定了\n\
  \        // \"Checking\"账户，表明该类型可以开支票\n        if ((validAccounts != null) && checking.Match(validAccounts))\
  \ {\n            Console.WriteLine(\"{0} types can write checks.\", obj.GetType());\n\
  \        } else {\n            Console.WriteLine(\"{0} types can NOT write checks.\"\
  , obj.GetType());\n        }\n    }\n}\n```\n\n```text\nChildAccount types can NOT\
  \ write checks.\nAdultAccount types can write checks.\nProgram types can NOT write\
  \ checks.\n```\n\n### 18.6 检测定制特性时不创建从 Attribute 派生的对象\n\n本节将讨论如何利用另一种技术检测应用于元数据记录项的特性。在某些安全性要求严格的场合，这个技术能保证不执行从\
  \ Attribute 派生的类中的代码。毕竟，调用 Attribute 的 GetCustomAttribute 或者 GetCustomAttributes\
  \ 方法时，这些方法会在内部调用特性类的构造器，而且可能调用属性的 set 访问器方法。此外，首次访问类型会造成 CLR 调用类型的类型构造器（如果有的话）。在构造器、set\
  \ 访问器方法以及类型构造器中，可能包含每次查找特性都要执行的代码。这就相当于允许未知代码在 AppDomain 中运行，所以存在安全隐患。\n\n可用 System.Reflection.CustomAttributeData\
  \ 类在查找特性的同时禁止执行特性类中的代码。该类定义了静态方法 GetCustomAttributes 来获取与目标关联的特性。方法有 4 个重载版本，分别获取一个\
  \ Assembly、Module、ParameterInfo 和 MemberInfo。该类在 System.Reflection 命名空间（将在第 23 章“程序集加载和反射”讨论）中定义。通常，先用\
  \ Assembly 的静态方法 ReflectionOnlyLoad（也在第 23 章讨论）加载程序集，再用 CustomAttributeData 类分析这个程序集的元数据中的特性。简单地说，ReflectionOnlyLoad\
  \ 以特殊方式加载程序集，期间会禁止 CLR 执行程序集中的任何代码；其中包括类型构造器。\n\nCustomAttributeData 的 GetCustomAttributes\
  \ 方法是一个工厂 (factory) 方法。也就是说，调用它会返回一个 IList<CustomAttributeData> 类型的对象，其中包含由 CustomAttributeData\
  \ 对象构成的集合。集合中的每个元素都是应用于指定目标的一个定制特性。可查询每个 CustomAttributeData 对象的只读属性，判断特性对象如何构造和初始化。具体地说，Constructor\
  \ 属性指出构造器方法将如何调用。ConstructorArguments 属性以一个 IList<CustomAttributeTypedArgument>\
  \ 实例的形式返回将传给这个构造器的实参。而 NamedArguments 属性以一个 IList<CustomAttributeNamedArgument>\
  \ 实例的形式，返回将设置的字段/属性。注意，之所以说“将”，是因为不会实际地调用构造器和 set 访问器方法。禁止执行特性类的任何方法增强了安全性。\n\n\
  下面是之前例子的修改版本，它利用 CustomAttributeData 类来安全地获取应用于各个目标的特性：\n\n```csharp\nusing System;\n\
  using System.Diagnostics;\nusing System.Reflection;\nusing System.Collections.Generic;\n\
  using System.Linq;\n\n[assembly: CLSCompliant(true)]\n\n[Serializable]\n[DefaultMemberAttribute(\"\
  Main\")]\n[DebuggerDisplayAttribute(\"Richter\", Name = \"Jeff\", Target = typeof(Program))]\n\
  public sealed class Program\n{\n    [Conditional(\"Debug\")]\n    [Conditional(\"\
  Release\")]\n    public void DoSomething() { }\n\n    public Program() {\n    }\n\
