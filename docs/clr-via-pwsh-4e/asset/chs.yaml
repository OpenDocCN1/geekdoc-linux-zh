  ```csharp\npublic sealed class AType {\n    // InvalidChars 总是引用同一个数组对象\n    public\
  \ static readonly Char[] InvalidChars = new Char[] { 'A', 'B', 'C'};\n}\n\npublic\
  \ sealed class AnotherType {\n    public static void M() {\n        // 下面三行代码是合法的，可通过编译，并可成功\n\
  \        // 修改 InvalidChars 数组中的字符\n        AType.InvalidChars[0] = 'X';\n     \
  \   AType.InvalidChars[1] = 'Y';\n        AType.InvalidChars[2] = 'Z';\n\n     \
  \   // 下一行代码是非法的，无法通过编译，\n        // 因为不能让 InvalidChars 引用别的什么东西\n        AType.InvalidChars\
  \ = new Char[] { 'X', 'Y', 'Z' };\n    }\n}\n```\n\n构造 **SomeType** 的对象时，它的 **m_x**\
  \ 字段被初始化为 **5**。这是如何发生的呢？检查一下 **SomeType** 的构造器方法(也称作 **.ctor**)的 IL 代码就明白了，如下所示：\n\
  \n```cil\n.method public hidebysig specialname rtspecialname\n    instance void\
  \ .ctor() cil managed\n{\n    // Code size 14 (0xe)\n    .maxstack 8\n    IL_0000:\
  \ ldarg.0\n    IL_0001: ldc.i4.5\n    IL_0002: stfld int32 SomeType::m_x\n    IL_0007:\
  \ ldarg.0\n    IL_0008: call instance void [mscorlib]System.Object::.ctor()\n  \
  \  IL_000d: ret\n} // end of method SomeType::.ctor\n```\n\n可以看出，**SomeType** 的构造器把值\
  \ **5** 存储到字段 **m_x**，再调用基类的构造器。换句话说，C#编译器提供了一个简化的语法，允许以“内联”(其实就是嵌入)方式初始化实例字段。但在幕后，它会将这种语法转换成构造器方法中的代码来执行初始化。这同时提醒我们注意代码的膨胀效应。如以下类定义所示：\n\
  \n```csharp\ninternal sealed class SomeType {\n    private Int32   m_x = 5;\n  \
  \  private String  m_s = \"Hi there\";\n    private Double  m_d = 3.14159;\n   \
  \ private Byte    m_b;\n\n    // 下面是一些构造器\n    public SomeType()               \
  \   { ... }\n    public SomeType(Int32 x)           { ... }\n    public SomeType(String\
  \ s)          { ...; m_d=10; }\n}\n```\n\n编译器为这三个构造器方法生成代码时，在每个方法的开始位置，都会包含用于初始化\
  \ **m_x**、**m_s** 和 **m_d** 的代码。在这些初始化代码之后，编译器会插入对基类构造器的调用。再然后，会插入构造器自己的代码。例如，对于获取一个\
  \ **String** 参数的构造器，编译器生成的代码首先初始化 **m_x**、**m_s** 和 **m_d**，再调用基类(Object)的构造器，再执行自己的代码(最后是用值\
  \ **10** 覆盖 **m_d** 原先的值)。注意，即使没有代码显式初始化 **m_b**，**m_b** 也保证会被初始化为 **0**。\n\n> **注意**　编译器在调用基类构造器前使用简化语法对所有字段进行初始化，以维持源代码给人留下的“这些字段总是有一个值”的印象。但假如基类构造器调用了虚方法并回调由派生类定义的方法，就可能出问题。在这种情况下，使用简化语法初始化的字段在调用虚方法之前就初始化好了。\n\
  \n由于有三个构造器，所以编译器生成三次初始化 **m_x**、**m_s** 和 **m_d** 的代码——每个构造器一次。如果有几个已初始化的实例字段和许多重载的构造器方法，可考虑不是在定义字段时初始化，而是创建单个构造器来执行这些公共的初始化。然后，让其他构造器都显式调用这个公共初始化构造器。这样能减少生成的代码。下例演示了如何在\
  \ C# 中利用 **this** 关键字显式调用另一个构造器：\n\n```csharp\nusing System;\ninternal sealed class\
  \ SomeType {\n    // 不要显式初始化下面的字段\n    private Int32  m_x;\n    private String m_s;\n\
  \    private Double m_d;\n    private Byte   m_b;\n\n    // 该构造器将所有字段都设为默认值，\n \
  \   // 其他所有构造器都显式调用该构造器\n    public SomeType() {\n        m_x = 5;\n        m_s\
  \ = \"Hi there\";\n        m_d = 3.14159;\n        m_b = 0xff;\n    }\n\n    //\
  \ 该构造器将所有的字段都设为默认值，然后修改 m_x\n    public SomeType(Int32 x) : this() {\n        m_x\
  \ = x;\n    }\n\n    // 该构造器将所有的字段都设为默认值，然后修改 m_s\n    public SomeType(String s)\
  \ : this() {\n        m_s = s;\n    }\n\n    // 该构造器首先将所有字段都设为默认值，然后修改 m_x 和 m_s\n\
  \    public SomeType(Int32 x, String s) : this() {\n        m_x = x;\n        m_s\
  \ = s;\n    }\n}\n```\n\n### 8.2 实例构造器和结构（值类型）\n\n值类型(struct)构造器的工作方式与引用类型(class)的构造器截然不同。CLR\
  \ 总是允许创建值类型的实例，并且没有办法阻止值类型的实例化。所以，值类型其实并不需要定义构造器，C#编译器根本不会为值类型内联(嵌入)默认的无参数构造器。来看下面的代码：\n\
  \n```csharp\ninternal struct Point {\n    public Int32 m_x, m_y;\n}\n\ninternal\
  \ sealed class Rectangle {\n    public Point m_topLeft, m_bottomRight;\n}\n```\n\
  \n为了构造一个 **Rectangle**，必须使用 **new** 操作符，而且必须指定构造器。在这个例子中，调用的是 C#编译器自动生成的默认构造器。为\
  \ **Rectangle** 分配内存时，内存中包含 **Point** 值类型的两个实例。考虑到性能，CLR 不会为包含在引用类型中的每个值类型字段都主动调用构造器。但是，如前所述，值类型的字段会被初始化为\
  \ 0 或 **null**。\n\nCLR 确实允许为值类型定义构造器。但必须显式调用才会执行。下面是一个例子。\n\n```csharp\ninternal\
  \ struct Point {\n    public Int32 m_x, m_y;\n\n    public Point(Int32 x, Int32\
  \ y) {\n        m_x = x;\n        m_y = y;\n    }\n}\n\ninternal sealed class Rectangle\
  \ {\n    public Point m_topLeft, m_bottomRight;\n\n    public Rectangle() {\n  \
  \      // 在 C# 中，向一个值类型应用关键字 new，\n        // 可以调用构造器来初始化值类型的字段\n        m_topLeft\
  \ = new Point(1, 2);\n        m_bottomRight = new Point(100, 200);\n    }\n}\n```\n\
  \n值类型的实例构造器只有显式调用才会执行。因此，如果 Rectangle 的构造器没有使用 new 操作符来调用 Point 的构造器，从而初始化 Rectangle\
  \ 的 m_topLeft 字段和 m_bottomRight 字段，那么两个 Point 字段中的 m_x 和 m_y 字段都将为 0。\n\n前面展示的 Point\
  \ 值类型没有定义默认的无参构造器。现在进行如下改写：\n\n```csharp\ninternal struct Point {\n    public Int32\
  \ m_x, m_y;\n\n    public Point() {\n        m_x = m_y = 5;\n    }\n}\n\ninternal\
  \ sealed class Rectangle {\n    public Point m_topLeft, m_bottomRight;\n\n    public\
  \ Rectangle() {\n    }\n}\n```\n\n现在，构造新的 Rectangle 类时，两个 Point 字段中的 m_x 和 m_y 字段会被初始化成多少？是\
  \ 0 还是 5？（提示：小心上当！）\n\n许多开发人员（尤其是那些有 C++背景的）都觉得 C#编译器会在 Rectangle 的构造器中生成代码，为 Rectangle\
  \ 的两个字段自动调用 Point 的默认无参构造器。但是，为了增强应用程序的运行时性能，C#编译器不会自动生成这样的代码。实际上，即便值类型提供了无参构造器，许多编译器也永远不会生成代码来自动调用它。为了执行值类型的无参构造器，开发人员必须增加显式调用值类型构造器的代码。\n\
  \n基于前面这一段的信息，可以确定在前面示例代码中，Rectangle 类的两个 Point 字段的 m_x 和 m_y 字段会初始化为 0，因为代码中没有在任何地方显式调用了\
  \ Point 的构造器。\n\n但我说过，这是一个容易让人上当的问题。这里的关键在于 C#编译器不允许值类型定义无参数构造器。所以，前面的代码实际上是编译不了的。试图编译上述代码时，C#编译器会显示以下消息：error\
  \ CS0568：结构不能包含显式的无参数构造器。\n\nC#编译器故意不允许值类型定义无参构造器，目的是防止开发人员对这种构造器在什么时候\n\n候调用产生迷惑。由于不能定义无参构造器，所以编译器永远不会生成自动调用它的代码。没有无参构造器，值类型的字段总是被初始化为\
  \ 0 或 null。\n\n> **注意** 严格地说，只有当值类型的字段嵌套到引用类型中时，才保证被初始化为 0 或 null。基于栈的值类型字段则无此保证。但是，为了确保代码的“可验证性”\
  \ (verifiability)，任何基于栈的值类型字段都必须在读取之前写入(赋值)。允许先读再写会造成安全漏洞。对于所有基于栈的值类型中的字段，C#和其他能生成“可验证”代码的编译器可以保证对它们进行“置零”，或至少保证在读取之前赋值，确保不会在运行时因验证失败而抛出异常。所以，你完全可以忽略本“注意”的内容，假定自己的值类型的字段都会被初始化为\
  \ 0 或 null。\n\n注意，虽然 C#不允许值类型带有无参构造器，但 CLR 允许。所以，如果不在乎前面描述的问题，可以使用另一编程语言(比如 IL 汇编语言)定义带有无参构造器的值类型。\n\
  \n由于 C#不允许为值类型定义无参构造器，所以编译以下类型时，C#编译器将显示消息：**error CS0573: \"SomeValType.m_x\":\
  \ 结构中不能有实例字段初始值设定项。**\n\n```csharp\ninternal struct SomeValType {\n    // 不能在值类型中内联实例字段的初始化\n\
  \    private Int32 m_x = 5;\n}\n```\n\n另外，为了生成“可验证”代码，在访问值类型的任何字段之前，都需要对全部字段进行赋值。所以，值类型的任何构造器都必须初始化值类型的全部字段。以下类型为值类型定义了一个构造器，但没有初始化值类型的全部字段：\n\
  \n```csharp\ninternal struct SomeValType {\n    private Int32 m_x, m_y;\n\n    //\
  \ C#允许为值类型定义有参构造器\n    public SomeValType(Int32 x) {\n        m_x = x;\n       \
  \ // 注意 m_y 没有在这里初始化\n    }\n}\n```\n\n编译上述类型，C#编译器会显示消息：**error CS0171: 在控制返回到调用方之前，字段\
  \ \"SomeValType.m_y\" 必须完全赋值。** 为了修正这个问题，需要在构造器中为 m_y 赋一个值(通常是 0)。下面是对值类型的全部字段进行赋值的一个替代方案：\n\
  \n```csharp\n// C#允许为值类型定义有参构造器\npublic SomeValType(Int32 x) {\n    // 看起来很奇怪，但编译没问题，会将所有字段初始化为\
  \ 0/null\n    this = new SomeValType();\n\n    m_x = x;  // 用 x 覆盖 m_x 的 0\n   \
  \ // 注意 m_y 已初始化为 0\n}\n```\n\n在值类型的构造器中，this 代表值类型本身的一个实例，用 new 创建的值类型的一个实例可以赋给\
  \ **this**。在 **new** 的过程中，会将所有字段置为零。而在引用类型的构造器中，**this** 被认为是只读的，所以不能对它进行赋值。\n\n\
  ### 8.3 类构造器\n\n除了实例构造器，CLR 还支持类型构造器(type constructor)，也称为静态构造器(static constructor)、类构造器(class\
  \ constructor)或者类型初始化器(type initializer)。类型构造器可应用于接口(虽然 C#编译器不允许)、引用类型和值类型。实例构造器的作用是设置类型的实例的初始状态。对应地，类型构造器的作用是设置类型的初始状态。类型默认没有定义类型构造器。如果定义，也只能定义一个。此外，类型构造器永远没有参数。以下代码演示了如何在\
  \ C#中为引用类型和值类型定义一个类型构造器：\n\n```csharp\ninternal sealed class SomeRefType {\n   \
  \ static SomeRefType() {\n        // SomeRefType 被首次访问时，执行这里的代码\n    }\n}\n\ninternal\
  \ struct SomeValType {\n    // C#允许值类型定义无参的类型构造器\n    static SomeValType() {\n \
  \       // SomeValType 被首次访问时，执行这里的代码\n    }\n}\n```\n\n可以看出，定义类型构造器类似于定义无参实例构造器，区别在于必须标记为\
  \ **static**。此外，类型构造器总是私有；C#自动把它们标记为 **private**。事实上，如果在源代码中显式将类型构造器标记为 **private**(或其他访问修饰符)，C#编译器会显示以下消息：**error\
  \ CS0515：静态构造函数中不允许出现访问修饰符**。之所以必须私有，是为了防止任何由开发人员写的代码调用它，对它的调用总是由 CLR 负责。\n\n类型构造器的调用比较麻烦。JIT\
  \ 编译器在编译一个方法时，会查看代码中都引用了哪些类型。任何一个类型定义了类型构造器，JIT 编译器都会检查针对当前 AppDomain，是否已经执行了这个类型构造器。如果构造器从未执行，JIT\
  \ 编译器会在它生成的本机(native)代码中添加对类型构造器的调用。如果类型构造器已经执行，JIT 编译器就不添加对它的调用，因为它知道类型已经初始化好了。\n\
  \n现在，当方法被 JIT 编译完毕之后，线程开始执行它，最终会执行到调用类型构造器的代码。事实上，多个线程可能同时执行相同的方法。CLR 希望确保在每个 AppDomain\
  \ 中，一个类型构造器只执行一次。为了保证这一点，在调用类型构造器时，调用线程要获取一个互斥线程同步锁。这样一来，如果多个线程试图同时调用某个类型的静态构造器，只有一个线程才可以获得锁，其他线程会被阻塞(blocked)。第一个线程会执行静态构造器中的代码。当第一个线程离开构造器后，正在等待的线程将被唤醒，然后发现构造器的代码已被执行过。因此，这些线程不会再次执行代码，将直接从构造器方法返回。除此之外，如果再次调用这样的一个方法，CLR\
  \ 知道类型构造器已被执行过，从而确保构造器不被再次调用。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_184_0.png)\n\
  \n**重要提示** 虽然能在值类型中定义类型构造器，但永远都不要真的那么做，因为 CLR 有时不会调用值类型的静态类型构造器。下面是一个例子：\n\n```csharp\n\
  internal struct SomeValType {\n    static SomeValType() {\n        Console.WriteLine(\"\
  这句话永远不会显示\");\n    }\n    public Int32 m_x;\n}\n\npublic sealed class Program {\n\
  \    public static void Main() {\n        SomeValType[] a = new SomeValType[10];\n\
  \        a[0].m_x = 123;\n        Console.WriteLine(a[0].m_x); // 显示 123\n    }\n\
  }\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_184_1.png)\n\n> **注意** 由于 CLR\
  \ 保证一个类型构造器在每个 AppDomain 中只执行一次，而且(这种执行)是线程安全的，所以非常适合在类型构造器中初始化类型需要的任何单实例(Singleton)对象。\n\
  \n单个线程中的两个类型构造器包含相互引用的代码可能出问题。例如，假定 ClassA 的类型构造器包含了引用 ClassB 的代码，ClassB 的类型构造器包含了引用\
  \ ClassA 的代码。在这种情况下，CLR 仍然保证每个类型构造器的代码只被执行一次；但是，完全有可能在 ClassA 的类型构造器还没有执行完毕的前提下，就开始执行\
  \ ClassB 的类型构造器。因此，应尽量避免写会造成这种情况的代码。事实上，由于是 CLR 负责类型构造器的调用，所以任何代码都不应要求以特定的顺序调用类型构造器。\n\
  \n最后，如果类型构造器抛出未处理的异常，CLR 会认为类型不可用。试图访问该类型的任何字段或方法都会抛出 System.TypeInitializationException\
  \ 异常。\n\n类型构造器中的代码只能访问类型的静态字段，并且它的常规用途就是初始化这些字段。和实例字段一样，C# 提供了一个简单的语法来初始化类型的静态字段：\n\
  \n```csharp\ninternal sealed class SomeType {\n    private static Int32 s_x = 5;\n\
  }\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_184_2.png)\n\n> **注意** 虽然 C#\
  \ 不允许值类型为它的实例字段使用内联字段初始化语法，但可以为静态字段使用。换句话说，如果将前面定义的 SomeType 类型从 class 改为 struct，那么代码也能通过编译，而且会像你预期的那样工作。\n\
  \n① 每个 AppDomain 只能有一个实例，这种类型就是单实例类型。——译注\n\n生成上述代码时，编译器自动为 SomeType 生成一个类型构造器，好像源代码本来是这样写的：\n\
  \n```csharp\ninternal sealed class SomeType {\n    private static Int32 s_x;\n \
  \   static SomeType() { s_x = 5; }\n}\n```\n\n使用 ILDasm.exe 查看类型构造器的 IL，很容易验证编译器实际生成的东西。类型构造器方法总是叫\
  \ .cctor（代表 class constructor）。\n\n在以下代码中，可以看到 .cctor 方法是 private 和 static 的。另外，注意方法中的代码确实将值\
  \ 5 加载到静态字段 s_x 中。\n\n```il\n.method private hidebysig specialname rtspecialname\
  \ static\n        void .cctor() cil managed\n{\n    // Code size 7 (0x7)\n    .maxstack\
  \ 8\n    IL_0000: ldc.i4.5\n    IL_0001: stsfld int32 SomeType::s_x\n    IL_0006:\
  \ ret\n} // end of method SomeType::.cctor\n```\n\n类型构造器不应调用基类型的类型构造器。这种调用之所以没必要，是因为类型不可能有静态字段是从基类型分享或继承的。\n\
  \n> **注意** 有的语言（比如 Java）希望在访问类型时自动调用它的类型构造器，并调用它的所有基类型的类型构造器。此外，类型实现的接口也必须调用接口的类型构造器。CLR\
  \ 不支持这种行为。但是，使用由 **System.Runtime.CompilerServices.RuntimeHelpers** 提供的 **RunClassConstructor**\
  \ 方法，编译器和开发人员可以实现这种行为。任何语言想要实现这种行为，可以告诉它的编译器在一个类型的类型构造器中生成代码，为所有基类型都调用这个方法。用 **RunClassConstructor**\
  \ 方法调用一个类型构造器，CLR 就知道类型构造器之前是否执行过。如果是，CLR 不会再次调用它。\n\n最后，假定有以下代码：\n\n```csharp\n\
  internal sealed class SomeType {\n    private static Int32 s_x = 5;\n\n    static\
  \ SomeType() {\n        s_x = 10;\n    }\n}\n```\n\n在这个例子中，C#编译器只生成一个类型构造器方法。它首先将\
  \ s_x 初始化为 5，再把它修改成 10。换言之，当 C#编译器为类型构造器生成 IL 代码时，它首先生成的是初始化静态字段所需的代码，然后才会添加你的类型构造器方法中显式包含的代码。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_186_0.png)\n\n> **重要提示** 偶尔有开发人员问我，是否可以在卸载类型时执行一些代码。首先要搞清楚的是，类型只有在\
  \ AppDomain 卸载时才会卸载。AppDomain 卸载时，用于标识类型的对象（类型对象）将成为“不可达”的对象（不存在对它的引用），垃圾回收器会回收类型对象的内存。这个行为导致许多开发人员认为可以为类型添加一个静态\
  \ **Finalize** 方法。当类型卸载时，就自动地调用这个方法。遗憾的是，CLR 并不支持静态 **Finalize** 方法。但也不是完全没有办法，要在\
  \ AppDomain 卸载时执行一些代码，可向 **System.AppDomain** 类型的 **DomainUnload** 事件登记一个回调方法。\n\
  \n### 8.4 操作符重载方法\n\n有的语言允许类型定义操作符应该如何操作类型的实例。例如，许多类型（比如 **System.String**）都重载了相等（==）和不等（!=）操作符。CLR\
  \ 对操作符重载一无所知，它甚至不知道什么是操作符。是编程语言定义了每个操作符的含义，以及当这些特殊符号出现时，应该生成什么样的代码。\n\n例如在 C# 中，向基元类型的数字应用\
  \ + 符号，编译器生成将两个数加到一起的代码。将 + 符号应用于 **String** 对象，C# 编译器生成将两个字符串连接到一起的代码。测试不等性时，C#\
  \ 使用 != 符号，而 Microsoft Visual Basic 使用 <>。最后，^ 在 C# 中的含义为异或（XOR），在 Visual Basic\
  \ 中则为求幂。\n\n虽然 CLR 对操作符一无所知，但它确实规定了语言应该如何公开操作符重载，以便由另一种语言的代码使用。每种编程语言都要自行决定是否支持操作符重载，如果决定支持，还要决定用什么语法来表示和使用它们。至于\
  \ CLR，操作符重载只是方法而已。\n\n对编程语言的选择决定了你是否获得对操作符重载的支持，以及具体的语法是什么。编译源代码时，编译器会生成一个标识操作符行为的方法。CLR\
  \ 规范要求操作符重载方法必须是 **public** 和 **static** 方法。另外，C#（以及其他许多语言）要求操作符重载方法至少有一个参数的类型与当前定义这个方法的类型相同。之所以要进行这样的限制，是为了使\
  \ C# 编译器能在合理的时间内找到要绑定的操作符方法。\n\n以下 C# 代码展示了在一个类中定义的操作符重载方法：\n\n```csharp\npublic\
  \ sealed class Complex {\n    public static Complex operator+(Complex c1, Complex\
  \ c2) {...}\n}\n```\n\n编译器为名为 **op_Addition** 的方法生成元数据方法定义项；这个方法定义项还设置了 **specialname**\
  \ 标志，表明这是一个“特殊”方法。编程语言的编译器（包括 C# 编译器）看到源代码中出现一个 + 操作符时，会检查是否有一个操作数的类型定义了名为 **op_Addition**\
  \ 的 **specialname** 方法，而且该方法的参数兼容于操作数的类型。如果存在这样的方法，编译器就生成调用它的代码。不存在这样的方法就报告编译错误。\n\
  \n表 8-1 和表 8-2 总结了 C# 允许重载的一元和二元操作符，以及由编译器生成的对应的 CLS(Common Language Specification，公共语言规范)方法名。下一节会解释表的第\
  \ 3 列。\n\n表 8-1　C#的一元操作符及其相容于 CLS 的方法名\n\n| C#操作符 | 特殊方法名 | 推荐的相容于 CLS 的方法名 |\n\
  |---|---|---|\n| `+` | `op_UnaryPlus` | `Plus` |\n| `-` | `op_UnaryNegation` | `Negate`\
  \ |\n| `!` | `op_LogicalNot` | `Not` |\n| `~` | `op_OnesComplement` | `OnesComplement`\
  \ |\n| `++` | `op_Increment` | `Increment` |\n| `--` | `op_Decrement` | `Decrement`\
  \ |\n| （无） | `op_True` | `IsTrue { get; }` |\n| （无） | `op_False` | `IsFalse { get;\
  \ }` |\n\n表 8-2　C#的二元操作符及其相容于 CLS 的方法名\n\n| C#操作符 | 特殊方法名 | 推荐的相容于 CLS 的方法名 |\n\
  |---|---|---|\n| `+` | `op_Addition` | `Add` |\n| `-` | `op_Subtraction` | `Subtract`\
  \ |\n| `*` | `op_Multiply` | `Multiply` |\n| `/` | `op_Division` | `Divide` |\n\
  | `%` | `op_Modulus` | `Mod` |\n| `&` | `op_BitwiseAnd` | `BitwiseAnd` |\n| \\|\
  \ | `op_BitwiseOr` | `BitwiseOr` |\n| `^` | `op_ExclusiveOr` | `Xor` |\n| `<<` |\
  \ `op_LeftShift` | `LeftShift` |\n| `>>` | `op_RightShift` | `RightShift` |\n| `==`\
  \ | `op_Equality` | `Equals` |\n| `!=` | `op_Inequality` | `Equals` |\n| `<` | `op_LessThan`\
  \ | `Compare` |\n| `>` | `op_GreaterThan` | `Compare` |\n| `<=` | `op_LessThanOrEqual`\
  \ | `Compare` |\n| `>=` | `op_GreaterThanOrEqual` | `Compare` |\n\n\n\nCLR 规范定义了许多额外的可重载的操作符，但\
  \ C# 不支持这些额外的操作符。由于是非主流，所以此处不列出它们。如果对完整的列表感兴趣，请访问 CLI 的 ECMA 规范 (www.ecma-international.org/publications/standards/Ecma-335.htm)\
  \ 并阅读 Partition 1: Concepts and Architecture 的 Section 10.3.1(一元操作符)和 Section 10.3.2(二元操作符)。\n\
  \n**注意** 检查 Framework 类库(FCL)的核心数值类型(Int32，Int64 和 UInt32 等)，会发现它们没有定义任何操作符重载方法。之所以不定义，是因为编译器会(在代码中)专门查找针对这些基元类型执行的操作(运算)，并生成直接操作这些类型的实例的\
  \ IL 指令。如果类型要提供方法，而且编译器要生成代码来调用这些方法，方法调用就会产生额外的运行时开销。另外，方法最终都要执行一些 IL 指令来完成你希望的操作。这正是核心\
  \ FCL 类型没有定义任何操作符重载方法的原因。对于开发人员，这意味着假如选择的编程语言不支持其中的某个 FCL 类型，便不能对该类型的实例执行任何操作。\n\
  \n#### 操作符和编程语言互操作性\n\n操作符重载是很有用的工具，允许开发人员用简洁的代码表达自己的想法。但并不是所有编程语言都支持操作符重载。使用不支持操作符重载的语言时，语言不知道如何解释\
  \ + 操作符(除非类型是该语言的基元类型)，编译器会报错。使用不支持操作符重载的编程语言时，语言应该允许你直接调用希望的 op_* 方法(例如 op_Addition)。\n\
  \n如果语言不支持在类型中定义 + 操作符重载，这个类型仍然可能提供了一个 op_Addition 方法。在这种情况下，可不可以在 C# 中使用 + 操作符来调用这个\
  \ op_Addition 方法呢？答案是否定的。C# 编译器检测到操作符 + 时，会查找关联了 specialname 元数据标志的 op_Addition\
  \ 方法，以确定 op_Addition 方法是要作为操作符重载方法使用。但由于现在这个 op_Addition 方法是由不支持操作符重载的编程语言生成的，所以方法没有关联\
  \ specialname 标记。因此，C# 编译器会报告编译错误。当然，用任何编程语言写的代码都可以显式调用碰巧命名为 op_Addition 的方法，但编译器不会将一个\
  \ + 号的使用翻译成对这个方法的调用。\n\n**注意** FCL 的 System.Decimal 类型很好地演示了如何重载操作符并根据 Microsoft\
  \ 的设计规范定义友好方法名。\n\n##### Microsoft 操作符方法的命名规则之我见\n\n操作符重载方法什么时候能调用，什么时候不能调用，这些规则会使人感觉非常迷惑。如果支持操作符重载的编译器不生成\
  \ specialname 元数据标记，规则会简单得多，而且开发人员使用提供了操作符重载方法的类型也会更轻松。支持操作符重载的语言都支持操作符符号语法，而且所有语言都支持显式调用各种\
  \ op_ 方法。我不理解为什么 Microsoft 非要把它搞得这么复杂。希望 Microsoft 在编译器未来的版本中放宽这些限制。\n\n如果一个类型定义了操作符重载方法，Microsoft\
  \ 还建议类型定义更友好的公共静态方法，并在这种方法的内部调用操作符重载方法。例如，根据 Microsoft 的设计规范，重载了 op_Addition 方法的类型应定义一个公共的、名字更友好的\
  \ Add 方法。表 8-1 和表 8-2 中的第 3 列展示了每个操作符推荐使用的友好名称。因此，前面的示例类型 Complex 应该像下面这样定义：\n\n\
  ```csharp\npublic sealed class Complex {\n    public static Complex operator+(Complex\
  \ c1, Complex c2) { ... }\n    public static Complex Add(Complex c1, Complex c2)\
  \ { return(c1+c2); }\n}\n```\n\n用任何语言写的代码都能调用 Add 这样的友好操作符方法，这一点毋庸置疑。Microsoft 要求类型提供友好方法名的设计规范使局面进一步复杂化。在我看来，这种额外的复杂性完全没必要。而且，除非\
  \ JIT 编译器能内联(直接嵌入)友好方法的代码，否则调用它们将导致额外的性能损失。内联代码可使 JIT 编译器优化代码，移除额外的方法调用，并提升运行时性能。\n\
  \n### 8.5 转换操作符方法\n\n有时需要将对象从一种类型转换为另一种类型(例如将 Byte 转换为 Int32)。当源类型和目标类型都是编译器识别的基元类型时，编译器自己就知道如何生成转换对象所需的代码。\n\
  \n如果源类型或目标类型不是基元类型，编译器会生成代码，要求 CLR 执行转换(强制转型)。这种情况下，CLR 只是检查源对象的类型和目标类型(或者从目标类型派生的其他类型)是不是相同。但有时需要将对象从一种类型转换成全然不同的其他类型。例如，System.Xml.Linq.XElement\
  \ 类允许将 XML 元素转换成 Boolean, (U)Int32, (U)Int64, Single, Double, Decimal, String, DateTime,\
  \ DateTimeOffset, TimeSpan, Guid 或者所有这些类型(String 除外)的可空版本。另外，假设 FCL 包含了一个 Rational(有理数)类型，那么如果能将\
  \ Int32 或 Single 转换成 Rational 会显得很方便；反之亦然。\n\n为了进行这样的转换，Rational 类型应该定义只有一个参数的公共构造器，该参数要求是源类型的实例。还应该定义无参的公共实例方法\
  \ ToXxx(类似于你熟悉的 ToString 方法)，每个方法都将定义类型①的实例转换成 **Xxx** 类型。以下代码展示了如何为 Rational 类型正确定义转换构造器和方法。\n\
  \n```csharp\npublic sealed class Rational {\n   // 由一个 Int32 构造一个 Rational\n   public\
  \ Rational(Int32 num){ ... }\n\n   // 由一个 Single 构造一个 Rational\n   public Rational(Single\
  \ num){ ... }\n\n   // 将一个 Rational 转换成一个 Int32\n   public Int32 ToInt32(){ ...\
  \ }\n\n   // 将一个 Rational 转换成一个 Single\n   public Single ToSingle(){ ... }\n}\n\
  ```\n\n调用这些构造器和方法，使用任何编程语言的开发人员都能将 Int32 或 Single 对象转换成 Rational 对象，反之亦然。这些转换能给编程带来很多方便。设计类型时，应认真考虑类型需要支持的转换构造器和方法。\n\
  \n上一节讨论了某些编程语言如何提供操作符重载。事实上，有些编程语言(比如 C#)还提供了转换操作符重载。**转换操作符**是将对象从一种类型转换成另一种类型的方法。可以使用特殊的语法来定义转换操作符方法。CLR\
  \ 规范要求转换操作符重载方法必须是 **public** 和 **static** 方法。此外，C#(以及其他许多语言)要求参数类型和返回类型二者必有其一与定义转换方法的类型相同。之所以要进行这个限制，是为了使\
  \ C# 编译器能在一个合理的时间内找到要绑定的操作符方法。以下代码为 Rational 类型添加了 4 个转换操作符方法：\n\n```csharp\npublic\
  \ sealed class Rational {\n   // 由一个 Int32 构造一个 Rational\n   public Rational(Int32\
  \ num){ ... }\n\n   // 由一个 Single 构造一个 Rational\n   public Rational(Single num){\
  \ ... }\n\n   // 将一个 Rational 转换成一个 Int32\n   public Int32 ToInt32(){ ... }\n\n\
  \   // 将一个 Rational 转换成一个 Single\n   public Single ToSingle(){ ... }\n\n   // 由一个\
  \ Int32 隐式构造并返回一个 Rational\n   public static implicit operator Rational(Int32 num)\
  \ {\n      return new Rational(num);\n   }\n\n   // 由一个 Single 隐式构造并返回一个 Rational\n\
  \   public static implicit operator Rational(Single num) {\n      return new Rational(num);\n\
  \   }\n}\n```\n\n① 定义该方法的类型。——译注\n\n```csharp\n}\n}\n```\n\n定义好这个方法后，可以在代码中使用它，如下所示：\n\
  \n```csharp\nStringBuilder sb=new StringBuilder(\"Hello. My name is Jeff.\"); //初始字符串\n\
  \n// 将句点更改为感叹号，获取!字符的索引(5)\nInt32 index = StringBuilderExtensions.IndexOf(sb.Replace('.',\
  \ '!'), '!');\n```\n\n上述代码工作起来没问题，但从程序员的角度看不理想。第一个问题是，要获取一个 StringBuilder 中的某个字符的索引，必须先知道\
  \ StringBuilderExtensions 类的存在。第二个问题是，代码没有反映出在 StringBuilder 对象上执行的操作的顺序，使代码很难写、读和维护。程序员希望先调用\
  \ Replace，再调用 IndexOf。但从左向右读最后一行代码，先看到的是 IndexOf，然后才看到 Replace。当然，可以像下面这样重写，使代码的行为看起来更容易理解：\n\
  \n```csharp\n// 首先，将句点更改成感叹号\nsb.Replace('.', '!');\n\n// 接着，获取!字符的索引(5)\nInt32\
  \ index = StringBuilderExtensions.IndexOf(sb, '!');\n```\n\n但这两个版本都存在另一个不容忽视的问题，它影响了我们对代码行为的理解。使用\
  \ StringBuilderExtensions 显得“小题大做”，造成程序员无法专注于当前要执行的操作：IndexOf。如果 StringBuilder 类定义了自己的\
  \ IndexOf 方法，上述代码就可以重写为：\n\n```csharp\n// 把句点更改为感叹号，获取!字符的索引(5)\nInt32 index = sb.Replace('.',\
  \ '!').IndexOf('!');\n```\n\n哇，是不是立刻就显得高端大气上档次了？一眼就能看出在 StringBuilder 对象中，是先将句点更改为感叹号，再获取感叹号的索引。\n\
  \n有了这个例子作为铺垫，就很容易理解 C# 扩展方法的意义了。它允许定义一个静态方法，并用实例方法的语法来调用。换言之，现在既能定义自己的 IndexOf 方法，又能避免上述三个问题。要将\
  \ IndexOf 方法转变成扩展方法，只需在第一个参数前添加 this 关键字：\n\n```csharp\npublic static class StringBuilderExtensions\
  \ {\n    public static Int32 IndexOf(this StringBuilder sb, Char value) {\n    \
  \    for (Int32 index = 0; index < sb.Length; index++)\n            if (sb[index]\
  \ == value) return index;\n        return -1;\n    }\n}\n```\n\n现在，当编译器看到以下代码：\n\
  \n```csharp\nInt32 index = sb.IndexOf('X');\n```\n\n就首先检查 StringBuilder 类或者它的任何基类是否提供了获取单个\
  \ Char 参数、名为 IndexOf 的一个实例方法。如果是，就生成 IL 代码来调用它。如果没有找到匹配的实例方法，就继续检查是否有任何静态类定义了名为\
  \ IndexOf 的静态方法，方法的第一个参数的类型和当前用于调用方法的那个表达式的类型匹配，而且该类型必须用 this 关键字标识。在本例中，表达式是 sb，类型是\
  \ StringBuilder。所以编译器会查找一个 IndexOf 方法，它有两个参数：一个 StringBuilder(用 this 关键字标记)，以及一个\
  \ Char。编译器找到了这个 IndexOf 方法，所以生成相应的 IL 代码来调用这个静态方法。\n\nOK——这解释了编译器如何解决前面提到的、会影响代码理解的最后两个问题。但是，还没有说第一个问题是如何解决的：程序员怎么知道有这样的一个\
  \ IndexOf 方法，可以用它操作 StringBuilder 对象呢？这个问题是通过 Microsoft Visual Studio 的“智能感知”功能来解决的。在编辑器中输入句点符号，会弹出\
  \ Visual Studio 的“智能感知”窗口，列出当前可用的实例方法。现在，这个窗口还会列出可作用于句点左侧表达式类型的扩展方法。图 8-1 展示了 Visual\
  \ Studio 的“智能感知”窗口；扩展方法的图标中有一个下箭头，方法旁边的“工具提示”表明该方法实际是一个扩展方法。这是相当实用的一个功能，因为现在可以轻松定义自己的方法来操作各种类型，其他程序员在使用这些类型的对象时，也能轻松地发现你的方法。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_194_0.png)\n\n图 8-1 Visual Studio 的“智能感知”窗口能列出扩展方法\n\
  \n#### 8.6.1 规则和原则\n\n关于扩展方法，有一些附加的规则和原则需要注意。\n\n- C# 只支持扩展方法，不支持扩展属性、扩展事件、扩展操作符等。\n\
  - 扩展方法(第一个参数前面有 this 的方法)必须在非泛型的静态类中声明。然而，类名没有限制，可以随便叫什么名字。当然，扩展方法至少要有一个参数，而且只有第一个参数能用\
  \ this 关键字标记。\n\n```csharp\n// 并向它传递对字符串 \"Jeff\" 的引用\na();\n}\n```\n\n在上述代码中，C#\
  \ 编译器生成 IL 代码来构造一个 Action 委托。创建委托时，会向构造器传递应调用的方法，同时传递一个对象引用，这个引用应传给方法的隐藏 this 参数。正常情况下，创建引用静态方法的委托时，对象引用是\
  \ null，因为静态方法没有 this 参数。但在这个例子中，C# 编译器生成特殊代码创建一个委托来引用静态方法（ShowItems），而静态方法的目标对象是对\
  \ \"Jeff\" 字符串的引用。稍后，当这个委托被调用（invoke）时，CLR 会调用（call）静态方法，并向其传递对 \"Jeff\" 字符串的引用。这是编译器耍的小“花招”，但效果不错，而且只要你不去想内部发生的事情，整个过程还是感觉非常自然的。\n\
  \n#### 8.6.3 ExtensionAttribute 类\n\n扩展方法的概念要不是 C# 特有的就好了！具体地说，我们希望程序员能用一种编程语言定义一组扩展方法，并让其他语言的程序员利用它们。要实现这一点，选择的编译器必须能够搜索静态类型和方法来寻找匹配的扩展方法。另外，速度慢了还不行。编译器必须快速完成上述搜索，将编译时间控制在合理范围内。\n\
  \n在 C# 中，一旦用 this 关键字标记了某个静态方法的第一个参数，编译器就会在内部向该方法应用一个定制特性。该特性会在最终生成的文件的元数据中持久性地存储下来。该特性在\
  \ System.Core.dll 程序集中定义，它看起来像下面这样：\n\n```csharp\n// 在 System.Runtime.CompilerServices\
  \ 命名空间中定义\n[AttributeUsage(AttributeTargets.Method | AttributeTargets.Class |\n\
  \               AttributeTargets.Assembly)]\npublic sealed class ExtensionAttribute\
  \ : Attribute {\n}\n```\n\n除此之外，任何静态类只要包含至少一个扩展方法，它的元数据中也会应用这个特性。类似地，任何程序集只要包含了至少一个符合上述特点的静态类，它的元数据中也会应用这个特性。这样一来，如果代码调用了一个不存在的实例方法，编译器就能快速扫描引用的所有程序集，判断它们哪些包含了扩展方法。然后，在这些程序集中，可以只扫描包含了扩展方法的静态类。在每个这样的静态类中，可以只扫描扩展方法来查找匹配。利用这个技术，代码能以最快速度编译完毕。\n\
  \n### 8.7 分部方法\n\n假定用某个工具生成了包含类型定义的 C# 源代码文件，工具知道你想在代码的某些位置定制类型的行为。正常情况下，是让工具生成的代码调用虚方法来进行定制。工具生成的代码还必须包含虚方法的定义。另外，这些方法的实现是什么事情都不做，直接返回了事。现在，如果想定制类的行为，就必须从基类派生并定义自己的类，重写虚方法来实现自己想要的行为。下面是一个例子：\n\
  \n```csharp\n// 工具生成的代码，存储在某个源代码文件中:\ninternal class Base {\n    private String\
  \ m_name;\n\n    // 在更改 m_name 字段前调用\n    protected virtual void OnNameChanging(String\
  \ value) {\n    }\n\n    public String Name {\n        get { return m_name; }\n\
  \        set {\n            OnNameChanging(value.ToUpper());  // 告诉类要进行更改了\n   \
  \         m_name = value;                   // 更改字段\n        }\n    }\n}\n\n// 开发人员生成的代码，存储在另一个源代码文件中:\n\
  internal class Derived : Base {\n    protected override void OnNameChanging(string\
  \ value) {\n        if (String.IsNullOrEmpty(value))\n            throw new ArgumentNullException(\"\
  value\");\n    }\n}\n```\n\n遗憾的是，上述代码存在两个问题。\n\n- 类型必须是非密封的类。这个技术不能用于密封类，也不能用于值类型(值类型隐式密封)。此外，这个技术不能用于静态方法，因为静态方法不能重写。\n\
  - 效率问题。定义一个类型只是为了重写一个方法，这会浪费少量系统资源。另外，即使不想重写 OnNameChanging 的行为，基类代码仍需调用一个什么都不做、直接返回的虚方法。另外，无论\
  \ OnNameChanging 是否访问传给它的实参，编译器都会生成对 ToUpper 进行调用的 IL 代码。\n\n利用 C# 的分部方法功能，可以在解决上述问题的同时覆盖类的行为。以下代码使用分部方法实现和上述代码完全一样的语义：\n\
  \n```csharp\n// 工具生成的代码，存储在某个源代码文件中:\ninternal sealed partial class Base {\n   \
  \ private String m_name;\n\n    // 这是分部方法的声明\n    partial void OnNameChanging(String\
  \ value);\n\n    public String Name {\n        get { return m_name; }\n        set\
  \ {\n            OnNameChanging(value.ToUpper());  // 通知类要进行更改了\n            m_name\
  \ = value;                   // 更改字段\n        }\n    }\n}\n```\n\n```csharp\n//\
  \ 开发人员生成的代码，存储在另一个源代码文件中:\ninternal sealed partial class Base {\n\n    // 这是分部方法的实现，会在\
  \ m_name 更改前调用\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_200_0.png)\n\n>\
  \ **注意**　分部方法的工作方式类似于 `System.Diagnostics.ConditionalAttribute` 特性。然而，分部方法只能在单个类型中使用，而\
  \ `ConditionalAttribute` 能用于对另一个类型中定义的方法进行有选择的调用。\n\n#### 规则和原则\n\n关于分部方法，有一些附加的规则和原则需要注意。\n\
  \n- 它们只能在分部类或结构中声明。\n- 分部方法的返回类型始终是 `void`，任何参数都不能用 `out` 修饰符来标记。之所以有这两个限制，是因为方法在运行时可能不存在，所以不能将变量初始化为方法也许会返回的东西。类似地，不允许\
  \ `out` 参数是因为方法必须初始化它，而方法可能不存在。分部方法可以有 `ref` 参数，可以是泛型方法，可以是实例或静态方法，而且可标记为 `unsafe`。\n\
  - 当然，分部方法的声明和实现必须具有完全一致的签名。如果两者都应用了定制特性，编译器会合并两个方法的特性。应用于参数的任何特性也会合并。\n- 如果没有对应的实现部分，便不能在代码中创建一个委托来引用这个分部方法。这同样是由于方法在运行时不存在。编译器报告以下消息：`error\
  \ CS0762: 无法通过方法 \"Base.OnNameChanging(string)\" 创建委托，因为该方法是没有实现声明的分部方法。`\n- 分部方法总是被视为\
  \ `private` 方法，但 C# 编译器禁止在分部方法声明之前添加 `private` 关键字。\n"
- "## 第 9 章　参数\n\n**本章内容：**\n\n- 可选参数和命名参数\n- 隐式类型的局部变量\n- 以传引用的方式向方法传递参数\n- 向方法传递可变数量的参数\n\
  - 参数和返回类型的设计规范\n- 常量性\n\n本章重点在于向方法传递参数的各种方式，包括如何可选地指定参数，按名称指定参数，按引用传递参数，以及如何定义方法来接受可变数量的参数。\n\
  \n### 9.1　可选参数和命名参数\n\n设计方法的参数时，可为部分或全部参数分配默认值。然后，调用这些方法的代码可以选择不提供部分实参，使用其默认值。此外，调用方法时可通过指定参数名称来传递实参。以下代码演示了可选参数和命名参数的用法：\n\
  \n```csharp\nusing System;\n\npublic static class Program {\n    private static\
  \ Int32 s_n = 0;\n\n    private static void M(Int32 x = 9, String s = \"A\",\n \
  \       DateTime dt = default(DateTime), Guid guid = new Guid()) {\n\n        Console.WriteLine(\"\
  x={0}, s={1}, dt={2}, guid={3}\", x, s, dt, guid);\n    }\n\n    public static void\
  \ Main() {\n        // 1. 等同于 M(9, \"A\", default(DateTime), new Guid());\n    \
  \    M();\n\n        // 2. 等同于 M(8, \"x\", default(DateTime), new Guid());\n   \
  \     M(8, \"x\");\n\n        // 3. 等同于 M(5, \"A\", DateTime.Now, Guid.NewGuid());\n\
  \        M(5, guid: Guid.NewGuid(), dt: DateTime.Now);\n\n        // 4. 等同于 M(0,\
  \ \"1\", default(DateTime), new Guid());\n        M(s_n++, s_n++.ToString());\n\n\
  \        // 5. 等同于以下两行代码：\n        // String t1 = \"2\"; Int32 t2 = 3;\n       \
  \ // M(t2, t1, default(DateTime), new Guid());\n        M(s: (s_n++).ToString(),\
  \ x: s_n++);\n    }\n}\n```\n\n运行程序得到以下输出：\n\n```text\nx=9, s=A, dt=1/1/0001 12:00:00\
  \ AM, guid=00000000-0000-0000-0000-000000000000\nx=8, s=x, dt=1/1/0001 12:00:00\
  \ AM, guid=00000000-0000-0000-0000-000000000000\nx=5, s=A, dt=8/16/2012 10:14:25\
  \ PM, guid=d24a59da-6009-4aae-9295-839155811309\nx=0, s=1, dt=1/1/0001 12:00:00\
  \ AM, guid=00000000-0000-0000-0000-000000000000\nx=3, s=2, dt=1/1/0001 12:00:00\
  \ AM, guid=00000000-0000-0000-0000-000000000000\n```\n\n如你所见，如果调用时省略了一个实参，C# 编译器会自动嵌入参数的默认值。对\
  \ M 的第 3 个和第 5 个调用使用了 C# 的命名参数功能。在这两个调用中，我为 x 显式传递了值，并指出要为名为 guid 和 dt 的参数传递实参。\n\
  \n向方法传递实参时，编译器按从左到右的顺序对实参进行求值。在对 M 的第 4 个调用中，s_n 的当前值(0)传给 x，然后 s_n 递增。随后，s_n 的当前值(1)作为字符串传给\
  \ s，然后继续递增到 2。使用命名参数传递实参时，编译器仍然按从左到右的顺序对实参进行求值。在对 M 的第 5 个调用中，s_n 中的当前值(2)被转换成字符串，并保存到编译器创建的临时变量(t1)中。接着，s_n\
  \ 递增到 3，这个值保存到编译器创建的另一个临时变量(t2)中。然后，s_n 继续递增到 4。最后在调用 M 时，向它传递的实参依次是 t2，t1，一个默认\
  \ DateTime 和一个新建的 Guid。\n\n### 9.1.1　规则和原则\n\n如果在方法中为部分参数指定了默认值，请注意以下附加的规则和原则。\n\
  \n- 可为方法、构造器方法和有参属性(C# 索引器)的参数指定默认值。还可为属于委托定义一部分的参数指定默认值。以后调用该委托类型的变量时可省略实参来接受默认值。\n\
  - 有默认值的参数必须放在没有默认值的所有参数之后。换言之，一旦定义了有默认值的参数，它右边的所有参数也必须有默认值。例如在前面的 M 方法定义中，如果删除 s\
  \ 的默认值(\"A\")，就会出现编译错误。但这个规则有一个例外：“参数数组”①这种参数必须放在所有参数(包括有默认值的这些)之后，而且数组本身不能有一个默认值。\n\
  \n  ① 在本章后面 9.4 节“向方法传递可变数量的参数”详细讨论。\n\n- 默认值必须是编译时能确定的常量值。那么，哪些参数能设置默认值？这些参数的类型可以是\
  \ C# 认定的基元类型(参见第 5 章的表 5-1)。还包括枚举类型，以及能设为 null 的任何引用类型。值类型的参数可将默认值设为值类型的实例，并让它的所有字段都包含零值。可以用\
  \ default 关键字或者 new 关键字来表达这个意思；两种语法将生成完全一致的 IL 代码。在 M 方法中设置 dt 参数和 guid 参数的默认值时，分别使用的就是这两种语法。\n\
  - 不要重命名参数变量，否则任何调用者以传参数名的方式传递实参，它们的代码也必须修改。例如，在前面的 M 方法声明中，如果将 dt 变量重命名为 dateTime，对\
  \ M 的第三个调用就会造成编译器显示以下消息：`error CS1739: \"M\" 的最佳重载没有名为 \"dt\" 的参数。`\n- 如果方法从模块外部调用，更改参数的默认值具有潜在的危险性。call\
  \ site①在它的调用中嵌入默认值。如果以后更改了参数的默认值，但没有重新编译包含 call site 的代码，它在调用你的方法时就会传递旧的默认值。可考虑将默认值\
  \ `0/null` 作为哨兵值使用，从而指出默认为空。这样一来，即使更改了默认值，也不必重新编译包含了 call site 的全部代码。下面是一个例子：\n\n\
  \  ① call site 是发出调用的地方，可理解成调用了一个目标方法的表达式或代码行。——译注\n\n```csharp\n// 不要这样做:\nprivate\
  \ static String MakePath(String filename = \"Untitled\") {\n    return String.Format(@\"\
  C:\\{0}.txt\", filename);\n}\n\n// 而要这样做:\nprivate static String MakePath(String\
  \ filename = null) {\n    // 这里使用了空值合并操作符(??)：详情参见第 19 章\n    return String.Format(@\"\
  C:\\{0}.txt\", filename ?? \"Untitled\");\n}\n```\n\n- 如果参数用 `ref` 或 `out` 关键字进行了标识，就不能设置默认值。因为没有办法为这些参数传递有意义的默认值。\n\
  \n使用可选或命名参数调用方法时，还要注意以下附加的规则和原则。\n\n- 实参可按任意顺序传递，但命名实参只能出现在实参列表的尾部。\n- 可按名称将实参传给没有默认值的参数，但所有必须的实参都必须传递（无论按位置还是按名称），编译器才能编译代码。\n\
  - C# 不允许省略逗号之间的实参，比如 `M(1, ,DateTime.Now)`。因为这会造成对可读性的影响，程序员将被迫去数逗号。对于有默认值的参数，如果想省略它的实参，以传参数名的方式传递实参即可。\n\
  - 如果参数要求 `ref/out`，为了以传参数名的方式传递实参，请使用下面这样的语法：\n\n```csharp\n// 方法声明:\nprivate static\
  \ void M(ref Int32 x) { ... }\n\n// 方法调用:\nInt32 a = 5;\nM(x: ref a);\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_204_0.png)\n\
  \n> **注意**　写 C# 代码和 Microsoft Office 的 COM 对象模型进行互操作时，C# 的可选参数和命名参数功能非常好用。另外，调用\
  \ COM 组件时，如果是以传引用的方式传递实参，C# 还允许省略 `ref/out`，进一步简化编码。但如果调用的不是 COM 组件，C# 就要求必须向实参应用\
  \ `ref/out` 关键字。\n\n### 9.1.2　DefaultParameterValueAttribute 和 OptionalAttribute\n\
  \n默认和可选参数的概念要不是 C# 特有的就好了！具体地说，我们希望程序员能用一种编程语言定义一个方法，指出哪些参数是可选的，以及它们的默认值是什么。然后，另一种语言的程序员可以调用该方法。要实现这一点，所选的编译器必须允许调用者忽略一些实参，还必须能确定这些实参的默认值。\n\
  \n在 C# 中，一旦为参数分配了默认值，编译器就会在内部向该参数应用定制特性 `System.Runtime.InteropServices.OptionalAttribute`。该特性会在最终生成的文件的元数据中持久性地存储下来。此外，编译器向参数应用\
  \ `System.Runtime.InteropServices.DefaultParameterValueAttribute` 特性，并将该特性持久性存储到生成的文件的元数据中。然后，会向\
  \ `DefaultParameterValueAttribute` 的构造器传递在源代码中指定的常量值。\n\n之后，一旦编译器发现某个方法调用缺失了部分实参，就可以确定省略的是可选的实参，并从元数据中提取默认值，将值自动嵌入调用中。\n\
  \n### 9.2　隐式类型的局部变量\n\nC# 能根据初始化表达式的类型推断方法中的局部变量的类型，如下所示：\n\n```csharp\nprivate\
  \ static void ImplicitlyTypedLocalVariables() {\n    var name = \"Jeff\";\n    ShowVariableType(name);\
  \       // 显示：System.String\n\n    // var n = null;               // 错误，不能将 null\
  \ 赋给隐式类型的局部变量\n    var x = (String)null;          // 可以这样写，但意义不大\n    ShowVariableType(x);\
  \           // 显示：System.String\n\n    var numbers = new Int32[] { 1, 2, 3, 4 };\n\
  \    ShowVariableType(numbers);     // 显示：System.Int32[]\n\n    // 复杂类型能少打一些字\n\
  \    var collection = new Dictionary<String, Single>() { { \"Grant\", 4.0f } };\n\
  \n    // 显示：System.Collections.Generic.Dictionary`2[System.String,System.Single]\n\
  \    ShowVariableType(collection);\n\n    foreach (var item in collection) {\n \
  \       // 显示：System.Collections.Generic.KeyValuePair`2[System.String,System.Single]\n\
  \        ShowVariableType(item);\n    }\n}\n\nprivate static void ShowVariableType<T>(T\
  \ t) {\n    Console.WriteLine(typeof(T));\n}\n```\n\n`ImplicitlyTypedLocalVariables`\
  \ 方法中的第一行代码使用 C# 的 `var` 关键字引入了一个新的局部变量。为了确定 `name` 变量的类型，编译器要检查赋值操作符(=)右侧的表达式的类型。由于\
  \ \"Jeff\" 是字符串，所以编译器推断 `name` 的类型是 `String`。为了证明编译器正确推断出类型，我写了 `ShowVariableType`\
  \ 方法。这个泛型方法推断它的实参的类型并在控制台上显示。为方便阅读，我在 `ImplicitlyTypedLocalVariables` 方法内部以注释形式列出了每次调用\
  \ `ShowVariableType` 方法的显示结果。\n\n`ImplicitlyTypedLocalVariables` 方法内部的第二个赋值(被注释掉了)会产生编译错误：**error\
  \ CS0815: 无法将 \"<null>\" 赋予隐式类型的局部变量**。这是由于 `null` 能隐式转型为任何引用类型或可空值类型。因此，编译器不能推断它的确切类型。但在第三个赋值语句中，我证明只要显式指定了类型(本例是\
  \ `String`)，就可以将隐式类型的局部变量初始化为 `null`。这样做虽然可行，但意义不大，因为可以写 `String x = null;` 来获得同样效果。\n\
  \n第 4 个赋值语句反映了 C# “隐式类型局部变量”功能的真正价值。没有这个功能，就不得不在赋值操作符的左右两侧指定 `Dictionary<String,\
  \ Single>`。这不仅需要打更多的字，而且以后修改了集合类型或者任何泛型参数类型，赋值操作符两侧的代码也要修改。\n\n在 `foreach` 循环中，我用\
  \ `var` 让编译器自动推断集合中的元素的类型。这证明了 `var` 能很好地用于 `foreach`、`using` 和 `for` 语句。还可在试验代码时利用它。例如，可以用方法的返回值初始化隐式类型的局部变量。开发方法时可以灵活更改返回类型。编译器能察觉到返回类型的变化，并自动更改变量的类型！当然，如果使用变量的代码没有相应地进行修改，还是像使用旧类型那样使用它，就可能无法编译。\n\
  \n在 Microsoft Visual Studio 中，鼠标放到 `var` 上将显示一条“工具提示”，指出编译器根据表达式推断出来的类型。在方法中使用匿名类型时必须用到\
  \ C# 的隐式类型局部变量，详情参见第 10 章“属性”。\n\n不能用 `var` 声明方法的参数类型。原因显而易见，因为编译器必须根据在 `call site`\
  \ 传递的实参来推断参数类型，但 `call site` 可能一个都没有，也可能有好多个①。除此之外，不能用 `var` 声明类型中的字段。C# 的这个限制是出于多方面的考虑。一个原因是字段可以被多个方法访问，而\
  \ C# 团队认为这个协定(变量的类型)应该显式陈述。另一个原因是一旦允许，匿名类型(第 10 章)就会泄露到方法的外部。\n\n① 要么一个类型都推断不出来，要么多个推断发生冲突。——译注\n\
  \n> **重要提示**　不要混淆 dynamic 和 var。用 var 声明局部变量只是一种简化语法，它要求编译器根据表达式推断具体数据类型。var 关键字只能声明方法内部的局部变量，而\
  \ dynamic 关键字适用于局部变量、字段和参数。表达式不能转型为 var，但能转型为 dynamic。必须显式初始化用 var 声明的变量，但无需初始化用\
  \ dynamic 声明的变量。欲知 C# 的 dynamic 类型的详情，请参见 5.5 节“dynamic 基元类型”。\n\n### 9.3　以传引用的方式向方法传递参数\n\
  \nCLR 默认所有方法参数都传值。传递引用类型的对象时，对象引用（或者说指向对象的指针）被传给方法。注意引用（或指针）本身是传值的，意味着方法能修改对象，而调用者能看到这些修改。对于值类型的实例，传给方法的是实例的一个副本，意味着方法将获得它专用的一个值类型实例副本，调用者中的实例不受影响。\n\
  \n> **重要提示**　在方法中，必须知道传递的每个参数是引用类型还是值类型，处理参数的代码显著有别。\n\nCLR 允许以传引用而非传值的方式传递参数。C#\
  \ 用关键字 out 或 ref 支持这个功能。两个关键字都告诉 C# 编译器生成元数据来指明该参数是传引用的。编译器将生成代码来传递参数的地址，而非传递参数本身。\n\
  \nCLR 不区分 out 和 ref，意味着无论用哪个关键字，都会生成相同的 IL 代码。另外，元数据也几乎完全一致，只有一个 bit 除外，它用于记录声明方法时指定的是\
  \ out 还是 ref。但 C# 编译器是将这两个关键字区别对待的，而且这个区别决定了由哪个方法负责初始化所引用的对象。如果方法的参数用 out 来标记，表明不指望调用者在调用方法之前初始化好了对象。被调用的方法不能读取参数的值，而且在返回前必须向这个值写入。相反，如果方法的参数用\
  \ ref 来标记，调用者就必须在调用该方法前初始化参数的值，被调用的方法可以读取值以及/或者向值写入。\n\n对于 out 和 ref，引用类型和值类型的行为迥然有异。先看一看为值类型使用\
  \ out 和 ref：\n\n```csharp\npublic sealed class Program {\n    public static void\
  \ Main() {\n        Int32 x;                 // x 没有初始化\n        GetVal(out x);\
  \           // x 不必初始化\n        Console.WriteLine(x);    // 显示 \"10\"\n    }\n\n\
  \    private static void GetVal(out Int32 v) {\n        v = 10; // 该方法必须初始化 v\n\
  \    }\n}\n```\n\n\n\n在上述代码中，x 在 Main 的栈帧中声明。然后，x 的地址传递给 GetVal。GetVal 的 v 是一个指针，指向\
  \ Main 栈帧中的 Int32 值。在 GetVal 内部，v 指向的那个 Int32 被更改为 10。GetVal 返回时，Main 的 x 就有了一个为\
  \ 10 的值，控制台上会显示 10。为大的值类型使用 out，可提升代码的执行效率，因为它避免了在进行方法调用时复制值类型实例的字段。\n\n下例用 ref\
  \ 代替了 out:\n\n```csharp\npublic sealed class Program {\n    public static void Main(){\n\
  \        Int32 x = 5;              // x 已经初始化\n        AddVal(ref x);          \
  \  // x 必须初始化\n        Console.WriteLine(x);     // 显示\"15\"\n    }\n\n    private\
  \ static void AddVal(ref Int32 v) {\n        v += 10;                  // 该方法可使用\
  \ v 的已初始化的值\n    }\n}\n```\n\n在上述代码中，x 也在 Main 的栈帧中声明，并初始化为 5。然后，x 的地址传给 AddVal。AddVal\
  \ 的 v 是一个指针，指向 Main 栈帧中的 Int32 值。在 AddVal 内部，v 指向的那个 Int32 要求必须是已经初始化的。因此，AddVal\
  \ 可在任何表达式中使用该初始值。AddVal 还可更改这个值，新值会“返回”调用者。在本例中，AddVal 将 10 加到初始值上。AddVal 返回时，Main\
  \ 的 x 将包含 15，这个值会在控制台上显示出来。\n\n综上所述，从 IL 和 CLR 的角度看，out 和 ref 是同一码事：都是传递指向实例的指针。但从编译器的角度看，两者是有区别的。根据是\
  \ out 还是 ref，编译器会按照不同的标准来验证你的代码是否正确。以下代码试图向要求 ref 参数的方法传递未初始化的值，结果是编译器报告以下错误：error\
  \ CS0165：使用了未赋值的局部变量“x”。\n\n```csharp\npublic sealed class Program {\n    public\
  \ static void Main() {\n        Int32 x;                 // x 没有初始化\n\n        //\
  \ 下一行代码无法通过编译，编译器将报告：\n        // error CS0165: 使用了未赋值的局部变量\"x\"\n        AddVal(ref\
  \ x);\n\n        Console.WriteLine(x);\n    }\n\n    private static void AddVal(ref\
  \ Int32 v) {\n        v += 10; // 该方法可使用 v 的已初始化的值\n    }\n}\n```\n\n① 栈帧(stack\
  \ frame)代表当前线程的调用栈中的一个方法调用。在执行线程的过程中进行的每个方法调用都会在调用栈中创建并压入一个 StackFrame。——译注\n\n\
  > **重要提示** 经常有人问我，为什么 C# 要求必须在调用方法时指定 `out` 或 `ref`？毕竟，编译器知道被调用的方法需要的是 `out` 还是\
  \ `ref`，所以应该能正确编译代码。事实上，C# 编译器确实能自动采取正确的操作。但 C# 语言的设计者认为调用者应显式表明意图。只有这样，在 call site(调用位置)那里，才能清楚地知道被调用的方法是否需要对传递的变量值进行更改。\n\
  \n```csharp\npublic sealed class Point {\n    static void Add(Point p) { ... }\n\
  \    static void Add(ref Point p) { ... }\n}\n```\n\n两个重载方法如果只有 `out` 和 `ref` 的区别，则不合法，因为两个签名的元数据形式完全相同。所以，不能在上述\
  \ `Point` 类型中再定义以下方法：\n\n```csharp\nstatic void Add(out Point p) { ... }\n```\n\n\
  试图在 `Point` 类型中添加这个 `Add` 方法，C# 编译器会显示以下消息：\n\n**CS0663: \"Add\" 不能定义仅在 `ref` 和\
  \ `out` 上有差别的重载方法。**\n\n为值类型使用 `out` 和 `ref`，效果等同于以传值的方式传递引用类型。对于值类型，`out` 和 `ref`\
  \ 允许方法操纵单一的值类型实例。调用者必须为实例分配内存，被调用者则操纵该内存(中的内容)。对于引用类型，调用代码为一个指针分配内存(该指针指向一个引用类型的对象)，被调用者则操纵这个指针。正因为如此，仅当方法“返回”对“方法知道的一个对象”的引用时，为引用类型使用\
  \ `out` 和 `ref` 才有意义。以下代码对此进行了演示。\n\n```csharp\nusing System;\nusing System.IO;\n\
  \npublic sealed class Program {\n    public static void Main() {\n        FileStream\
  \ fs;   // fs 没初始化\n\n        // 打开第一个待处理的文件\n        StartProcessingFiles(out fs);\n\
  \n        // 如果有更多需要处理的文件，就继续\n        for (; fs != null; ContinueProcessingFiles(ref\
  \ fs)) {\n\n            // 处理一个文件\n            fs.Read(...);\n        }\n    }\n\
  \n    private static void StartProcessingFiles(out FileStream fs) {\n        fs\
  \ = new FileStream(...);   // fs 必须在这个方法中初始化\n    }\n\n    private static void ContinueProcessingFiles(ref\
  \ FileStream fs) {\n        fs.Close();        // 关闭最后一个操作的文件\n\n        // 打开下一个文件：如果没有更多的文件，就“返回”\
  \ null\n        if (noMoreFilesToProcess) fs = null;\n        else fs = new FileStream\
  \ (...);\n    }\n}\n```\n\n可以看出，上述代码最大的不同就是定义了一些使用了 **out** 或 **ref** 引用类型参数的方法，并用这些方法构造对象。新对象的指针将“返回”给调用者。还要注意，**ContinueProcessingFiles**\
  \ 方法可对传给它的对象进行处理，再“返回”一个新对象。之所以能这样做，是因为参数标记了 **ref**。上述代码可简化为以下形式：\n\n```csharp\n\
  using System;\nusing System.IO;\n\npublic sealed class Program {\n    public static\
  \ void Main() {\n        FileStream fs = null;  // 初始化为 null（必要的操作）\n\n        //\
  \ 打开第一个待处理的文件\n        ProcessFiles(ref fs);\n\n        // 如果有更多需要处理的文件，就继续\n  \
  \      for (; fs != null; ProcessFiles(ref fs)) {\n\n            // 处理文件\n     \
  \       fs.Read(...);\n        }\n    }\n\n    private static void ProcessFiles(ref\
  \ FileStream fs) {\n        // 如果先前的文件是打开的，就将其关闭\n        if (fs != null) fs.Close();\
  \  // 关闭最后一个操作的文件\n\n        // 打开下一个文件：如果没有更多的文件，就“返回” null\n        if (noMoreFilesToProcess)\
  \ fs = null;\n        else fs = new FileStream (...);\n    }\n}\n```\n\n下例演示了如何用\
  \ **ref** 关键字实现一个用于交换两个引用类型的方法：\n\n```csharp\npublic static void Swap(ref Object\
  \ a, ref Object b) {\n    Object t = b;\n    b = a;\n    a = t;\n}\n```\n\n为了交换对两个\
  \ **String** 对象的引用，你或许会以为代码能像下面这样写：\n\n```csharp\npublic static void SomeMethod()\
  \ {\n    String s1=\"Jeffrey\";\n    String s2=\"Richter\";\n\n    Swap(ref s1,\
  \ ref s2);\n```\n\n```csharp\npublic static void Swap<T>(ref T a, ref T b) {\n \
  \   T t = b;\n    b = a;\n    a = t;\n}\n```\n\n重写了 **Swap** 后，以下代码(和以前展示过的完全相同)就能通过编译了，而且能完美运行：\n\
  \n```csharp\npublic static void SomeMethod() {\n    String s1=\"Jeffrey\";\n   \
  \ String s2=\"Richter\";\n\n    Swap(ref s1, ref s2);\n    Console.WriteLine(s1);\
  \ // 显示\"Richter\"\n    Console.WriteLine(s2); // 显示\"Jeffrey\"\n}\n```\n\n要查看用泛型来解决这个问题的其他例子，请参见\
  \ **System.Threading** 命名空间中的 **Interlocked** 类的 **CompareExchange** 和 **Exchange**\
  \ 方法。\n\n### 9.4 向方法传递可变数量的参数\n\n方法有时需要获取可变数量的参数。例如，**System.String** 类型的一些方法允许连接任意数量的字符串，还有一些方法允许指定一组要统一格式化的字符串。\n\
  \n为了接受可变数量的参数，方法要像下面这样声明：\n\n```csharp\nstatic Int32 Add(params Int32[] values)\
  \ {\n    // 注意: 如果愿意，可将 values 数组传给其他方法\n\n    Int32 sum = 0;\n    if (values !=\
  \ null) {\n        for (Int32 x = 0; x < values.Length; x++)\n            sum +=\
  \ values[x];\n    }\n    return sum;\n}\n```\n\n除了 **params** 关键字，这个方法的一切对你来说都应该是非常熟悉的。**params**\
  \ 只能应用于方法签名中的最后一个参数。暂时忽略 **params** 关键字，可以明显地看出 **Add** 方法接受一个 **Int32** 类型的数组，然后遍历数组，将其中的\
  \ **Int32** 值加到一起，结果 **sum** 返回给调用者。\n\n显然，可以像下面这样调用该方法：\n\n```csharp\npublic static\
  \ void Main() {\n    // 显示 \"15\"\n    Console.WriteLine(Add(new Int32[] { 1, 2,\
  \ 3, 4, 5 }));\n}\n```\n\n数组能用任意数量的一组元素来初始化，再传给 **Add** 方法进行处理。尽管上述代码可以通过编译并能正确运行，但并不好看。我们当然希望能像下面这样调用\
  \ **Add** 方法：\n\n```csharp\npublic static void Main() {\n    // 显示 \"15\"\n```\n\
  \n> **重要提示** 注意，调用参数数量可变的方法对性能有所影响(除非显式传递 `null`)。毕竟，数组对象必须在堆上分配，数组元素必须初始化，而且数组的内存最终需要垃圾回收。要减少对性能的影响，可考虑定义几个没有使用\
  \ `params` 关键字的重载版本。关于这方面的范例，请参考 `System.String` 类的 `Concat` 方法，该方法定义了以下重载版本：\n\n\
  ```csharp\npublic sealed class String : Object, ... {\n    public static string\
  \ Concat(object arg0);\n    public static string Concat(object arg0, object arg1);\n\
  \    public static string Concat(object arg0, object arg1, object arg2);\n    public\
  \ static string Concat(params object[] args);\n    public static string Concat(string\
  \ str0, string str1);\n    public static string Concat(string str0, string str1,\
  \ string str2);\n    public static string Concat(string str0, string str1, string\
  \ str2,\n                                string str3);\n    public static string\
  \ Concat(params string[] values);\n}\n```\n\n如你所见，`Concat` 方法定义了几个没有使用 `params`\
  \ 关键字的重载版本。这是为了改善常规情形下的性能。使用了 `params` 关键字的重载则用于不太常见的情形；在这些情形下，性能有一定的损失。但幸运的是，这些情形本来就不常见。\n\
  \n### 9.5 参数和返回类型的设计规范\n\n声明方法的参数类型时，应尽量指定最弱的类型，宁愿要接口也不要基类。例如，如果要写方法来处理一组数据项，最好是使用接口(比如\
  \ `IEnumerable<T>`)声明参数，而不要用强数据类型(比如 `List<T>`)或者更强的接口类型(比如 `ICollection<T>` 或 `IList<T>`):\n\
  \n```csharp\n// 好：方法使用弱参数类型\npublic void ManipulateItems<T>(IEnumerable<T> collection)\
  \ { ... }\n```\n\n```csharp\n// 不好：方法使用强参数类型\npublic void ManipulateItems<T>(List<T>\
  \ collection) { ... }\n```\n\n原因是调用第一个方法时可传递数组对象、`List<T>` 对象、`String` 对象或者其他对象——只要对象的类型实现了\
  \ `IEnumerable<T>` 接口。相反，第二个方法只允许传递 `List<T>` 对象，不接受数组或 `String` 对象。显然，第一个方法更好，它更灵活，适合更广泛的情形。\n\
  \n当然，如果方法需要的是列表(而非任何可枚举的对象)，就应该将参数类型声明为 `IList<T>`。但仍然要避免将参数类型声明为 `List<T>`。声明为\
  \ `IList<T>`，调用者可向方法传递数组和实现了 `IList<T>` 的其他类型的对象。\n\n注意，这里的例子讨论的是集合，是用接口体系结构来设计的。讨论使用基类体系结构设计的类时，概念同样适用。例如，要实现对流中的字节进行处理的方法，可定义以下方法：\n\
  \n```csharp\n// 好：方法使用弱参数类型\npublic void ProcessBytes(Stream someStream) { ... }\n\
  \n// 不好：方法使用强参数类型\npublic void ProcessBytes(FileStream fileStream) { ... }\n```\n\
  \n第一个方法能处理任何流，包括 **FileStream**、**NetworkStream** 和 **MemoryStream** 等。第二个只能处理 **FileStream**\
  \ 流，这限制了它的应用。\n\n相反，一般最好是将方法的返回类型声明为最强的类型（防止受限于特定类型）。例如，方法最好返回 **FileStream** 而不是\
  \ **Stream** 对象：\n\n```csharp\n// 好：方法使用强返回类型\npublic FileStream OpenFile() { ...\
  \ }\n\n// 不好：方法使用弱返回类型\npublic Stream OpenFile() { ... }\n```\n\n第一个方法是首选的，它允许方法的调用者将返回对象视为\
  \ **FileStream** 对象或者 **Stream** 对象。但第二个方法要求调用者只能将返回对象视为 **Stream** 对象。总之，要确保调用者在调用方法时有尽量大的灵活性，使方法的适用范围更大。\n\
  \n有时需要在不影响调用者的前提下修改方法的内部实现。在刚才的例子中，**OpenFile** 方法不太可能更改内部实现来返回除 **FileStream**（或\
  \ **FileStream** 的派生类型）之外的其他对象。但如果方法返回 **List<String>** 对象，就可能想在未来的某个时候修改它的内部实现来返回一个\
  \ **String[]**。如果想保持一定的灵活性，在将来更改方法返回的东西，请选择一个较弱的返回类型。例如：\n\n```csharp\n// 灵活：方法使用较弱的返回类型\n\
  public IList<String> GetStringCollection() { ... }\n\n// 不灵活：方法使用较强的返回类型\npublic\
  \ List<String> GetStringCollection() { ... }\n```\n\n在这个例子中，即使 **GetStringCollection**\
  \ 方法在内部使用一个 **List<String>** 对象并返回它，但最好还是修改方法的原型，使它返回一个 **IList<String>**。将来，**GetStringCollection**\
  \ 方法可更改它的内部集合来使用一个 **String[]**。与此同时，不需要修改调用者的源代码。事实上，调用者甚至不需要重新编译。注意，这个例子在较弱的类型中选择的是最强的那一个。例如，它没有使用最弱的\
  \ **IEnumerable<String>**，也没有使用较强的 **ICollection<String>**。\n\n### 9.6 常量性\n\n有的语言（比如非托管\
  \ C++）允许将方法或参数声明为常量，从而禁止实例方法中的代码更改对象的任何字段，或者更改传给方法的任何对象。CLR 没有提供这个功能，许多程序员因此觉得很遗憾。既然\
  \ CLR 都不提供，面向它的任何编程语言（包括 C#）自然也无法提供。\n\n① IList 继承自 ICollection，ICollection 继承自\
  \ IEnumerable。作者的意思是说，在这三个比 List<String> 都弱的类型中，选择的是最强的 IList。——译注\n\n\n\n首先要注意，非托管\
  \ C++ 将实例方法或参数声明为 **const**，只能防止程序员用一般的代码来更改对象或参数。方法内部总是可以更改对象或实参的。这要么是通过强制类型转换来去掉“常量性”，要么是通过获取对象或实参的地址，再声明一个指针并写入。从某种意义上说，非托管\
  \ C++ 向程序员撒了一个谎，使他们以为常量对象或实参不能写入（事实上可以）。\n\n实现类型时，开发人员可以避免编写操纵对象或实参的代码。例如，**String**\
  \ 类就没有提供任何能更改 **String** 对象的方法，所以字符串是不可变（immutable）的。\n\n此外，Microsoft 很难为 CLR 赋予验证常量对象或实参未被更改的能力。CLR\
  \ 将不得不对每个写入操作进行验证，确定该写入针对的不是常量对象。这对性能影响很大。当然，如果检测到有违反常量性的地方，会造成 CLR 抛出异常。此外，如果支持常量性，还会给开发人员带来大量复杂性。例如，如果类型是不可变的，它的所有派生类型都不得不遵守这个约定。除此之外，在不可变的类型中，字段也必须不可变。\n\
  \n考虑到这些原因以及其他许多原因，CLR 没有提供对常量对象或实参的支持。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_217_0.png)\n"
- "## 第 10 章　属性\n\n**本章内容：**\n\n- 无参属性\n- 有参属性\n- 调用属性访问器方法时的性能\n- 属性访问器的可访问性\n- 泛型属性访问器方法\n\
  \n本章讨论属性，它允许源代码用简化语法来调用方法。CLR 支持两种属性：**无参属性**，平时说的属性就是指它；**有参属性**，它在不同的编程语言中有不同的称呼。例如，C#\
  \ 将有参属性称为**索引器**，Microsoft Visual Basic 将有参属性称为**默认属性**。还要讨论如何使用“对象和集合初始化器”来初始化属性，以及如何用\
  \ C# 的匿名类型和 **System.Tuple** 类型将多个属性打包到一起。\n\n### 10.1　无参属性\n\n许多类型都定义了能被获取或更改的状态信息。这种状态信息一般作为类型的字段成员实现。例如，以下类型定义包含两个字段：\n\
  \n```csharp\npublic sealed class Employee {\n    public String Name;        // 员工姓名\n\
  \    public Int32 Age;         // 员工年龄\n}\n```\n\n创建该类型的实例后，可以使用以下形式的代码轻松获取（get）或设置（set）它的状态信息：\n\
  \n```csharp\nEmployee e = new Employee();\ne.Name = \"Jeffrey Richter\";    // 设置员工姓名\n\
  e.Age = 45;                   // 设置员工年龄\n\nConsole.WriteLine(e.Name);     // 显示\
  \ \"Jeffrey Richter\"\n```\n\n这种查询和设置对象状态信息的做法十分常见。但我必须争辩的是，永远都不应该像这样实现。面向对象设计和编程的重要原则之一就是**数据封装**，意味着类型的字段永远不应该公开，否则很容易因为不恰当使用字段而破坏对象的状态。例如，以下代码可以很容易地破坏一个\
  \ **Employee** 对象：\n\n- 托管程序元数据中的属性定义。这一项必然生成。\n\n以前面的 **Employee** 类型为例。编译器编译该类型时发现其中的\
  \ **Name** 和 **Age** 属性。由于两者都有 **get** 和 **set** 访问器方法，所以编译器在 **Employee** 类型中生成\
  \ 4 个方法定义，这造成原始代码似乎是像下面这样写的：\n\n```csharp\npublic sealed class Employee {\n    private\
  \ String m_Name;\n    private Int32 m_Age;\n\n    public String get_Name() {\n \
  \       return m_Name;\n    }\n\n    public void set_Name(String value) {\n    \
  \    m_Name = value; // 实参 value 总是代表新设的值\n    }\n\n    public Int32 get_Age() {\n\
  \        return m_Age;\n    }\n\n    public void set_Age(Int32 value) {\n      \
  \  if (value < 0) // value 总是代表新值\n            throw new ArgumentOutOfRangeException(\"\
  value\",\n                value.ToString(),\n                \"The value must be\
  \ greater than or equal to 0\");\n        m_Age = value;\n    }\n}\n```\n\n编译器在你指定的属性名之前自动附加\
  \ get_ 或 set_ 前缀来生成方法名。C# 内建了对属性的支持。C# 编译器发现代码试图获取或设置属性时，实际会生成对上述某个方法的调用。即使编程语言不直接支持属性，也可调用需要的访问器方法来访问属性。效果一样，只是代码看起来没那么优雅。\n\
  \n除了生成访问器方法，针对源代码中定义的每一个属性，编译器还会在托管程序集的元数据中生成一个属性定义项。在这个记录项中，包含了一些标志（flags）以及属性的类型。另外，它还引用了\
  \ **get** 和 **set** 访问器方法。这些信息唯一的作用就是在“属性”这种抽象概念与它的访问器方法之间建立起一个联系。编译器和其他工具可利用这种元数据信息（使用\
  \ **System.Reflection.PropertyInfo** 类来获得）。CLR 不使用这种元数据信息，在运行时只需要访问器方法。\n\n### 10.1.1\
  \ 自动实现的属性\n\n如果只是为了封装一个支持字段而创建属性，C# 还提供了一种更简洁的语法，称为**自动实现的属性**（Automatically Implemented\
  \ Property，后文简称为 AIP），例如下面的 **Name** 属性：\n\n```csharp\npublic sealed class Employee\
  \ {\n    // 自动实现的属性\n    public String Name { get; set; }\n\n    private Int32 m_Age;\n\
  \n    public Int32 Age {\n        get { return(m_Age); }\n        set {\n      \
  \      if (value < 0) // value 关键字总是代表新值\n                throw new ArgumentOutOfRangeException(\"\
  value\",\n                    value.ToString(),\n                    \"The value\
  \ must be greater than or equal to 0\");\n            m_Age = value;\n        }\n\
  \    }\n}\n```\n\n声明属性而不提供 get/set 方法的实现，C# 会自动为你声明一个私有字段。在本例中，字段的类型是 String，也就是属性的类型。另外，编译器会自动实现\
  \ get_Name 和 set_Name 方法，分别返回和设置字段中的值。\n\n和直接声明名为 Name 的 public String 字段相比，AIP\
  \ 的优势在哪里？事实上，两者存在一处重要的区别。使用 AIP，意味着你已经创建了一个属性。访问该属性的任何代码实际都会调用 get 和 set 方法。如果以后决定自己实现\
  \ get 和/或 set 方法，而不是接受编译器的默认实现，访问属性的任何代码都不必重新编译。然而，如果将 Name 声明为字段，以后又想把它更改为属性，那么访问字段的所有代码都必须重新编译才能访问属性方法。\n\
  \n- 我个人不喜欢编译器的 AIP 功能，所以一般会避免使用它。理由是：字段声明语法可能包含初始化部分，所以要在一行代码中声明并初始化字段。但没有简单的语法初始化\
  \ AIP。所以，必须在每个构造器方法中显式初始化每个 AIP。\n- 运行时序列化引擎将字段名持久存储到序列化的流中。AIP 的支持字段名称由编译器决定，每次重新编译代码都可能更改这个名称。因此，任何类型只要含有一个\
  \ AIP，就没法对该类型的实例进行反序列化。在任何想要序列化或反序列化的类型中，都不要使用 AIP 功能。\n- 调试时不能在 AIP 的 get 或 set\
  \ 方法上添加断点，所以不好检测应用程序在什么时候获取或设置这个属性。相反，手动实现的属性可设置断点，查错更方便。\n\n还要注意，如果使用 AIP，属性必然是只读和可写的。换言之，编译器肯定同时生成\
  \ get 和 set 方法。这个设计的道理在于，只写字段不能读取值有什么用呢？类似地，只读字段肯定是有默认值的。另外，由于不知道编译器生成的支持字段到底是什么名字，所以代码只能用属性名访问属性。另外，任何访问器方法（get\
  \ 或 set）要显式实现，两个访问器方法都必须显式实现，就不能使用 AIP 功能了。换言之，AIP 是作用于整个属性的；要么都用，要么都不用。不能显式实现一个访问器方法，而让另一个自动实现。\n\
  \n### 10.1.2 合理定义属性\n\n我个人不喜欢属性，我还希望 Microsoft .NET Framework 及其编程语言不要提供对属性的支持。理由是属性看起来和字段相似，但本质是方法。这造成了大量误解。程序员在看到貌似访问字段的代码时，会做出一些对属性来说不成立的假定，具体如下所示。\n\
  \n- 属性可以只读或只写，而字段访问总是可读和可写的（一个例外是 readonly 字段仅在构造器中可写）。如果定义属性，最好同时为它提供 **get** 和\
  \ **set** 访问器方法。\n- 属性方法可能抛出异常；字段访问永远不会。\n- 属性不能作为 **out** 或 **ref** 参数传给方法，而字段可以。例如以下代码是编译不了的：\n\
  \n```csharp\nusing System;\n\npublic sealed class SomeType {\n    private static\
  \ String Name {\n        get { return null; }\n        set {}\n    }\n\n    static\
  \ void MethodWithOutParam(out String n) { n = null; }\n\n    public static void\
  \ Main() {\n        // 对于下一行代码，C# 编译器将报告以下错误消息：\n        // error CS0206: 属性或索引器不得作为\
  \ out 或 ref 参数传递\n        MethodWithOutParam(out Name);\n    }\n}\n```\n\n- 属性方法可能花较长时间执行，字段访问则总是立即完成。许多人使用属性是为了线程同步，这就可能造成线程永远终止。所以，要线程同步就不要使用属性，而要使用方法。此外，如果你的类可以被远程访问（例如从\
  \ **System.MarshalByRefObject** 派生），调用属性方法会非常慢。在这种情况下应该优先使用方法而不是属性。我个人认为从 **MarshalByRefObject**\
  \ 派生的类永远都不应该使用属性。\n- 连续多次调用，属性方法每次都可用返回不同的值，字段则每次都返回相同的值。**System.DateTime** 类的只读属性\
  \ **Now** 返回当前日期和时间。每次查询这个属性都返回不同的值。这是一个错误，Microsoft 现在很想修正这个错误，将 **Now** 改成方法而不是属性。**Environment**\
  \ 的 **TickCount** 属性是 Microsoft 犯错的另一个例子。\n- 属性方法可能造成明显的副作用①，字段访问则永远不会。类型的使用者应该能按照他/她选择的任何顺序设置类型定义的各个属性，而不会造成类型中（因为设置顺序的不同）出现不同的行为。\n\
  - 属性方法可能需要额外的内存，或者返回的引用并非指向对象状态一部分，造成对返回对象的修改作用不到原始对象身上。而查询字段返回的引用总是指向原始对象状态的一部分。使用会返回一个拷贝的属性很容易引起混淆，文档也经常没有专门说明。②\n\
  \n> ① 这里的副作用（side effect）是指，访问属性时，除了单纯设置或获取属性，还会造成对象状态的改变。如果存在多个副作用，程序的行为就要依赖于历史；或者要依赖于求值顺序。如果以不同的顺序设置属性，类型每一次的行为都不同，那么显然是不合理的。——译注\
  \  \n> ② 指开发人员在文档中没有清楚地说明这是属性，而且返回的是一个 copy，造成别人在使用这个类时产生混淆。——译注\n\n#### 属性和 Visual\
  \ Studio 调试器\n\nMicrosoft Visual Studio 允许在调试器的监视窗口中输入一个对象的属性。这样一来，每次遇到一个断点，调试器都会调用属性的\
  \ get 访问器方法，并显示返回值。这个技术在查错时很有用，但也有可能造成 bug，并损害调试性能。例如，假定为网络共享中的文件创建了一个 FileStream，然后将\
  \ FileStream 的 Length 属性添加到调试器的监视窗口中。现在，每次遇到一个断点，调试器都会调用 Length 的 get 访问器方法，该方法内部向服务器发出一个网络请求来获取文件的当前长度！\n\
  \n类似地，如果属性的 get 访问器方法有一个 side effect，那么每次抵达断点，都会执行这个 side effect。例如，假定属性的 get 访问器方法每次调用时都递增一个计数器，这个计数器每次抵达断点时也会递增。考虑到可能有这些问题，Visual\
  \ Studio 允许为监视窗口中显示的属性关闭属性求值。要在 Visual Studio 中关闭属性求值，请选择“工具”|“选项”|“调试”|“常规”。然后，在如图\
  \ 10-1 所示的列表框中，清除勾选“启用属性求值和其他隐式函数调用”。注意，即使清除了这个选项，仍可将属性添加到监视窗口，然后手动强制 Visual Studio\
  \ 对它进行求值。为此，单击监视窗口“值”列中的强制求值圆圈即可。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_223_0.png)\n\
  \n图 10-1　Visual Studio 的常规调试设置\n\n我发现现在的人对属性的依赖有过之而无不及，经常是不管有没有必要都使用属性。仔细研究一下上面这个属性和字段差别列表，你会发现只有在极个别的情况下，定义属性才真正有用，同时不会造成开发人员的混淆。属性唯一的好处就是提供了简化的语法。和调用普通方法（非属性中的方法）相比，属性不仅不会提升代码的性能，还会妨碍对代码的理解。要是我参与\
  \ .NET Framework 以及编译器的设计，根本就不会提供属性；相反，我会让程序员老老实实地实现 GetXxx 和 SetXxx 方法。然后，编译器可以提供一些特殊的、简化的语法来调用这些方法。但是，我希望编译器使用有别于字段访问的语法，使程序员能真正理解他们正在做什么——是在调用一个方法！\n\
  \n### 10.1.3 对象和集合初始化器\n\n经常要构造一个对象并设置对象的一些公共属性（或字段）。为了简化这个常见的编程模式，C# 语言支持一种特殊的对象初始化语法。下面是一个例子：\n\
  \n```csharp\nEmployee e = new Employee() { Name = \"Jeff\", Age = 45 };\n```\n\n\
  这个语句做了好几件事情，包括构造一个 **Employee** 对象，调用它的无参构造器，将它的公共 **Name** 属性设为 \"Jeff\"，并将公共 **Age**\
  \ 属性设为 45。事实上，这一行代码等价于以下几行代码。可以检查两者的 IL 代码来加以验证。\n\n```csharp\nEmployee e = new\
  \ Employee();\ne.Name = \"Jeff\";\ne.Age = 45;\n```\n\n对象初始化器语法真正的好处在于，它允许在表达式的上下文（相对于语句的上下文）中编码，允许组合多个函数，进而增强了代码的可读性。例如，现在可以写这样的代码：\n\
  \n```csharp\nString s = new Employee() { Name = \"Jeff\", Age = 45 }.ToString().ToUpper();\n\
  ```\n\n这个语句做的事情更多，首先还是构造一个 **Employee** 对象，调用它的构造器，再初始化两个公共属性。然后，在结果表达式上，先调用 **ToString**，再调用\
  \ **ToUpper**。要深入了解函数的组合使用，请参见 8.6 节“扩展方法”。\n\n作为一个小的补充，如果想调用的本来就是一个无参构造器，C# 还允许省略起始大括号之前的圆括号。下面这行代码生成与上一行相同的\
  \ IL：\n\n```csharp\nString s = new Employee { Name = \"Jeff\", Age = 45 }.ToString().ToUpper();\n\
  ```\n\n如果属性的类型实现了 **IEnumerable** 或 **IEnumerable<T>** 接口，属性就被认为是集合，而集合的初始化是一种相加（additive）操作，而非替换（replacement）操作。例如，假定有下面这个类定义：\n\
  \n```csharp\npublic sealed class Classroom {\n    private List<String> m_students\
  \ = new List<String>();\n    public List<String> Students { get { return m_students;\
  \ } }\n\n    public Classroom() {}\n}\n```\n\n现在可以写代码来构造一个 **Classroom** 对象，并像下面这样初始化\
  \ **Students** 集合：\n\n```csharp\npublic static void M() {\n    Classroom classroom\
  \ = new Classroom {\n        Students = { \"Jeff\", \"Kristin\", \"Aidan\", \"Grant\"\
  \ }\n    };\n\n    // 显示教室中的 4 个学生\n    foreach (var student in classroom.Students)\n\
  \        Console.WriteLine(student);\n}\n```\n\n\n\n编译上述代码时，编译器发现 **Students** 属性的类型是\
  \ **List<String>**，而且这个类型实现了 **IEnumerable<String>** 接口。现在，编译器假定 **List<String>**\
  \ 类型提供了一个名为 **Add** 的方法（因为大多数集合类都提供了 **Add** 方法将数据项添加到集合），然后，编译器生成代码来调用集合的 **Add**\
  \ 方法。所以，上述代码会被编译器转换成这样：\n\n```csharp\npublic static void M()\n{\n    Classroom classroom\
  \ = new Classroom();\n    classroom.Students.Add(\"Jeff\");\n    classroom.Students.Add(\"\
  Kristin\");\n    classroom.Students.Add(\"Aidan\");\n    classroom.Students.Add(\"\
  Grant\");\n\n    // 显示教室中的 4 个学生\n    foreach (var student in classroom.Students)\n\
  \        Console.WriteLine(student);\n}\n```\n\n如果属性的类型实现了 **IEnumerable** 或 **IEnumerable<T>**，但未提供\
  \ **Add** 方法，编译器就不允许使用集合初始化语法向集合中添加数据项；相反，编译器报告以下消息：**error CS0117: \"System.Collections.Generic.IEnumerable<string>\"\
  \ 不包含 \"Add\" 的定义。**\n\n有的集合的 **Add** 方法要获取多个实参，比如 **Dictionary** 的 **Add** 方法：\n\
  \n```csharp\npublic void Add(TKey key, TValue value);\n```\n\n通过在集合初始化器中嵌套大括号的方式，可向\
  \ **Add** 方法传递多个实参，如下所示：\n\n```csharp\nvar table = new Dictionary<String, Int32>\
  \ {\n    { \"Jeffrey\", 1 }, { \"Kristin\", 2 }, { \"Aidan\", 3 }, { \"Grant\",\
  \ 4 }\n};\n```\n\n它等价于以下代码：\n\n```csharp\nvar table = new Dictionary<String, Int32>();\n\
  table.Add(\"Jeffrey\", 1);\ntable.Add(\"Kristin\", 2);\ntable.Add(\"Aidan\", 3);\n\
  table.Add(\"Grant\", 4);\n```\n\n#### 10.1.4 匿名类型\n\n利用 C# 的匿名类型功能，可以用很简洁的语法来自动声明不可变（immutable）的元组类型。元组①类型是含有一组属性的类型，这些属性通常以某种方式相互关联。在以下代码的第一行中，我定义了含有两个属性（**String**\
  \ 类型的 **Name** 和 **Int32** 类型的 **Year**）的类，构造了该类型的实例，将 **Name** 属性设为 \"Jeff\"，将\
  \ **Year** 属性设为 **1964**。\n\n```csharp\n// 定义类型，构造实例，并初始化属性\nvar o1 = new { Name\
  \ = \"Jeff\", Year = 1964 };\n\n// 在控制台上显示属性：Name=Jeff, Year=1964\nConsole.WriteLine(\"\
  Name={0}, Year={1}\", o1.Name, o1.Year);\n```\n\n① 元组（tuple）一词来源于对顺序的抽象：single、double、triple、quadruple、quintuple、*n*-tuple。\n\
  \n第一行代码创建了匿名类型，我没有在 new 关键字后指定类型名称，所以编译器会自动创建类型名称，而且不会告诉我这个名称具体是什么（这正是匿名的含义）。这行代码使用上一节讨论的“对象初始化器”语法来声明属性，同时初始化这些属性。另外，由于我（开发人员）不知道编译时的类型名称，也就不知道变量\
  \ o1 声明为什么类型。但这不是问题，因为可以像第 9 章讨论的那样使用 C# 的“隐式类型局部变量”功能（var）。它的作用是告诉编译器根据赋值操作符（=）右侧的表达式推断类型。\n\
  \n现在，让我们将注意力放在编译器实际做的事情上。遇到下面这样的一行代码时：\n\n```csharp\nvar o = new { property1 = expression1,\
  \ ..., propertyN = expressionN };\n```\n\n编译器会推断每个表达式的类型，创建推断类型的私有字段，为每个字段创建公共只读属性，并创建一个构造器来接受所有这些表达式。在构造器的代码中，会用传给它的表达式的求值结果来初始化私有只读字段。除此之外，编译器还会重写\
  \ Object 的 Equals、GetHashCode 和 ToString 方法，并生成所有这些方法中的代码。最终，编译器生成的类看起来像这样：\n\n\
  ```csharp\n[CompilerGenerated]\ninternal sealed class <>f__AnonymousType0<...> :\
  \ Object {\n    private readonly t1 f1;\n    public t1 p1 { get { return f1; } }\n\
  \n    ...\n\n    private readonly tn fn;\n    public tn pn { get { return fn; }\
  \ }\n\n    public <>f__AnonymousType0<...>(t1 a1, ..., tn an) {\n        f1 = a1;\
  \ ...; fn = an; // 设置所有字段\n    }\n\n    public override Boolean Equals(Object value)\
  \ {\n        // 任何字段不匹配就返回 false，否则返回 true\n    }\n\n    public override Int32 GetHashCode()\
  \ {\n        // 返回根据每个字段的哈希码生成的一个哈希码\n    }\n\n    public override String ToString()\
  \ {\n        // 返回“属性名=值”对的以逗号分隔的列表\n    }\n}\n```\n\n编译器会生成 Equals 和 GetHashCode\
  \ 方法，因此匿名类型的实例能放到哈希表集合中。属性是只读的，而非可读可写，目的是防止对象的哈希码发生改变。如果对象在哈希表中作为键使用，更改它的哈希码会造成再也找不到它。编译器会生成\
  \ ToString 方法来帮助进行调试。在 Visual Studio 调试器中，可将鼠标指针放在引用了匿名类型实例的一个变量上方。随后，Visual Studio\
  \ 会调用 ToString 方法，并在一个提示窗口中显示结果字符串。顺便说一句，在编辑器中写代码时，Visual Studio 的“智能感知”功能会提示属性名，这是非常好用的一个功能。\n\
  \n编译器支持用另外两种语法声明匿名类型中的属性，能根据变量推断属性名和类型：\n\n```csharp\nString Name = \"Grant\";\n\
  DateTime dt = DateTime.Now;\n```\n\n```csharp\n// 有两个属性的一个匿名类型\n// 1. String Name\
  \ 属性设为\"Grant\"\n// 2. Int32 Year 属性设为 dt 中的年份\nvar o2 = new { Name, dt.Year };\n\
  ```\n\n在这个例子中，编译器判断第一个属性应该叫 **Name**。由于 **Name** 是局部变量的名称，所以编译器将属性类型设为与局部变量相同的类型：**String**。对于第二个属性，编译器使用字段/属性的名称：**Year**。**Year**\
  \ 是 **DateTime** 类的一个 **Int32** 属性，所以匿名类型中的 **Year** 属性也是一个 **Int32**。现在，当编译器构造这个匿名类型的一个实例时，会将实例的\
  \ **Name** 属性设为 **Name** 局部变量中的值，使 **Name** 属性引用同一个 \"Grant\" 字符串。编译器还要将实例的 **Year**\
  \ 属性设为与 **dt** 的 **Year** 属性返回的值相同。\n\n编译器在定义匿名类型时是非常“善解人意”的。如果它看到你在源代码中定义了多个匿名类型，而且这些类型具有相同的结构，那么它只会创建一个匿名类型定义，但创建该类型的多个实例。所谓“相同的结构”，是指在这些匿名类型中，每个属性都有相同的类型和名称，而且这些属性的指定顺序相同。在前面的几个例子中，变量\
  \ **o1** 和 **o2** 就是同类型的，因为在定义匿名类型的两行代码中，都是先一个 **String** 类型的 **Name** 属性，再一个 **Int32**\
  \ 类型的 **Year** 属性。\n\n由于两个变量（o1 和 o2）的类型相同，所以可以做一些非常“酷”的事情，比如检查两个对象是否包含相等的值，并将对一个对象的引用赋给正在指向另一个对象的变量，如下所示：\n\
  \n```csharp\n// 一个类型允许相等测试和赋值操作\nConsole.WriteLine(\"Objects are equal: \" + o1.Equals(o2));\n\
  o1 = o2; // 赋值\n```\n\n另外，由于这种类型的同一性，所以可以创建一个隐式类型的数组（详情参见 16.1 节“初始化数组元素”），在其中包含一组匿名类型的对象。\n\
  \n```csharp\n// 之所以能这样写，是因为所有对象都是相同的匿名类型\nvar people = new[] {\n    o1, // o1 的定义参见本节开头\n\
  \    new { Name = \"Kristin\", Year = 1970 },\n    new { Name = \"Aidan\", Year\
  \ = 2003 },\n    new { Name = \"Grant\", Year = 2008 }\n};\n```\n\n```csharp\n//\
  \ 下面展示如何遍历匿名类型的对象构成的数组 (var 是必须的)\nforeach (var person in people)\n    Console.WriteLine(\"\
  Person={0}, Year={1}\", person.Name, person.Year);\n```\n\n匿名类型经常与 LINQ（Language\
  \ Integrated Query，语言集成查询）配合使用。可用 LINQ 执行查询，从而生成由一组对象构成的集合，这些对象都是相同的匿名类型。然后，可以对结果集合中的对象进行处理。所有这些都是在同一个方法中发生的。下例展示了如何返回“我的文档”文件夹中过去\
  \ 7 天修改过的所有文件：\n\n```csharp\nString myDocuments = Environment.GetFolderPath(Environment.SpecialFolder.MyDocuments);\n\
  var query =\n        from pathname in Directory.GetFiles(myDocuments)\n        let\
  \ lastWriteTime = File.GetLastWriteTime(pathname)\n        where lastWriteTime >\
  \ (DateTime.Now - TimeSpan.FromDays(7))\n        orderby lastWriteTime\n       \
  \ select new { Path = pathname, LastWriteTime = lastWriteTime }; // 匿名类型的对象构成的集合\n\
  \nforeach (var file in query)\n    Console.WriteLine(\"LastWriteTime={0}, Path={1}\"\
  , file.LastWriteTime, file.Path);\n```\n\n匿名类型的实例不能泄露到方法外部。方法原型不能接受匿名类型的参数，因为无法指定匿名类型。类似地，方法也不能返回对匿名类型的引用。虽然可以将匿名类型的实例视为一个\
  \ Object（所有匿名类型都从 Object 派生），但无法设法将 Object 类型的变量转型回匿名类型，因为不存在匿名类型在编译时的名称。要传递元组，应该考虑使用下一节讨论的\
  \ System.Tuple 类型。\n\n#### 10.1.5 System.Tuple 类型\n\n在 System 命名空间，Microsoft 定义了几个泛型\
  \ Tuple 类型，它们全部从 Object 派生，区别只在于元数（泛型参数的个数）。下面演示了最简单和最复杂的 Tuple 类型：\n\n```csharp\n\
  // 这是最简单的：\n[Serializable]\npublic class Tuple<T1> {\n    private T1 m_Item1;\n\
  \    public Tuple(T1 item1) { m_Item1 = item1; }\n    public T1 Item1 { get { return\
  \ m_Item1; } }\n}\n```\n\n```csharp\n// 这是最复杂的：\n[Serializable]\npublic class Tuple<T1,\
  \ T2, T3, T4, T5, T6, T7, TRest> {\n    private T1 m_Item1; private T2 m_Item2;\
  \ private T3 m_Item3; private T4 m_Item4;\n    private T5 m_Item5; private T6 m_Item6;\
  \ private T7 m_Item7; private TRest m_Rest;\n    public Tuple(T1 item1, T2 item2,\
  \ T3 item3, T4 item4, T5 item5, T6 item6, T7 item7,\n        TRest rest) {\n   \
  \     m_Item1 = item1; m_Item2 = item2; m_Item3 = item3; m_Item4 = item4;\n    \
  \    m_Item5 = item5; m_Item6 = item6; m_Item7 = item7; m_Rest = rest;\n    }\n\n\
  \    public T1 Item1 { get { return m_Item1; } }\n    public T2 Item2 { get { return\
  \ m_Item2; } }\n    public T3 Item3 { get { return m_Item3; } }\n    public T4 Item4\
  \ { get { return m_Item4; } }\n    public T5 Item5 { get { return m_Item5; } }\n\
  \    public T6 Item6 { get { return m_Item6; } }\n    public T7 Item7 { get { return\
  \ m_Item7; } }\n    public TRest Rest { get { return m_Rest; } }\n}\n```\n\n① 元数的英文是\
  \ arity。在计算机编程中，一个函数或运算（操作）的元数是指函数获取的实参或操作数的个数。它源于像 unary（arity=1）、binary（arity=2）、ternary（arity=3）这样的单词。——译注\n\
  \n和匿名类型类似，**Tuple** 创建好之后就不可变了（所有属性都只读）。虽然这里没有显示，但 **Tuple** 类还提供了 **CompareTo、Equals、GetHashCode**\
  \ 和 **ToString** 方法以及 **Size** 属性。此外，所有 **Tuple** 类型都实现了 **IStructuralEquatable、IStructuralComparable**\
  \ 和 **IComparable** 接口，所以可以比较两个 **Tuple** 对象，对它们的字段进行比对。请参考文档更多地了解这些方法和接口。\n\n下面的示例泛型方法\
  \ **MinMax** 用一个 **Tuple** 类型向调用者返回两样信息：\n\n```csharp\n// 用 Item1 返回最小值 & 用 Item2\
  \ 返回最大值\nprivate static Tuple<Int32, Int32> MinMax(Int32 a, Int32 b)\n{\n    return\
  \ new Tuple<Int32, Int32>(Math.Min(a, b), Math.Max(a, b));\n}\n```\n\n```csharp\n\
  // 下面展示了如何调用方法，以及如何使用返回的 Tuple\nprivate static void TupleTypes()\n{\n    var minmax\
  \ = MinMax(6, 2);\n\n    // Min=2, Max=6\n    Console.WriteLine(\"Min={0}, Max={1}\"\
  , minmax.Item1, minmax.Item2);\n}\n```\n\n当然，很重要的一点是 **Tuple** 的生产者（写它的人）和消费者（用它的人）必须对\
  \ **Item#** 属性返回的内容有一个清楚的理解。对于匿名类型，属性的实际名称是根据定义匿名类型的源代码来确定的。对于 **Tuple** 类型，属性一律被\
  \ Microsoft 称为 **Item#**，我们无法对此进行任何改变。遗憾的是，这种名字没有任何实际的含义或意义，所以要由生产者和消费者为它们分配具体含义。这还影响了代码的可读性和可维护性。所以，应该在自己的代码中添加详细的注释，说明每个\
  \ **Item#** 代表着什么。\n\n编译器只能在调用泛型方法时推断泛型类型，调用构造器时不能。因此，**System** 命名空间还包含了一个非泛型静态\
  \ **Tuple** 类，其中包含一组静态 **Create** 方法，能根据实参推断泛型类型。这个类扮演了创建 **Tuple** 对象的一个工厂的角色，它存在的唯一意义便是简化你的代码。下面用静态\
  \ **Tuple** 类重写了刚才的 **MinMax** 方法：\n\n```csharp\n// 用 Item1 返回最小值 & 用 Item2 返回最大值\n\
  private static Tuple<Int32, Int32> MinMax(Int32 a, Int32 b)\n{\n    return Tuple.Create(Math.Min(a,\
  \ b), Math.Max(a, b)); // 更简单的语法\n}\n```\n\n要创建多于 8 个元素的 **Tuple**，可为 **Rest** 参数传递另一个\
  \ **Tuple**，如下所示：\n\n```csharp\nvar t = Tuple.Create(0, 1, 2, 3, 4, 5, 6, Tuple.Create(7,\
  \ 8));\nConsole.WriteLine(\"{0}, {1}, {2}, {3}, {4}, {5}, {6}, {7}, {8}\",\n   \
  \ t.Item1, t.Item2, t.Item3, t.Item4, t.Item5, t.Item6, t.Item7,\n    t.Rest.Item1.Item1,\
  \ t.Rest.Item1.Item2);\n```\n\n\n\n> **注意** 除了匿名类型和 **Tuple** 类型，还可研究一下 **System.Dynamic.ExpandoObject**\
  \ 类（在 **System.Core.dll** 程序集中定义）。这个类和 C# 的 **dynamic** 类型（参见 5.5 节“**dynamic**\
  \ 基元类型”）配合使用，就可用另一种方式将一系列属性（键/值对）组合到一起。虽然实现不了编译时的类型安全性，但语法看起来不错（虽然得不到“智能感知”支持），而且还可以在\
  \ C# 和 Python 这样的动态语言之间传递 **ExpandoObject** 对象。以下是使用了一个 **ExpandoObject** 的示例代码：\n\
  \n```csharp\ndynamic e = new System.Dynamic.ExpandoObject();\ne.x = 6;         \
  \  // 添加一个 Int32 'x'属性，其值为 6\ne.y = \"Jeff\";      // 添加一个 String 'y'属性，其值为\"Jeff\"\
  \ne.z = null;        // 添加一个 Object 'z'属性，其值为null\n\n// 查看所有属性及其值:\nforeach (var\
  \ v in (IDictionary<String, Object>)e)\n    Console.WriteLine(\"Key={0}, Value={1}\"\
  , v.Key, v.Value);\n\n// 删除'x'属性及其值:\nvar d = (IDictionary<String, Object>)e;\n\
  d.Remove(\"x\");\n```\n\n### 10.2 有参属性\n\n在上一节中，属性的 **get** 访问器方法不接受参数，因此称为无参属性。由于用起来就像访问字段，所以很容易理解。除了这些与字段相似的属性，编程语言还支持有参属性，它的\
  \ **get** 访问器方法接受一个或多个参数，**set** 访问器方法接受两个或多个参数。不同编程语言以不同方式公开有参属性。另外，不同编程语言对有参属性的称呼也不同。C#\
  \ 称为索引器，Visual Basic 则称为默认属性。本节主要讨论 C# 如何使用有参属性来公开索引器。\n\nC# 使用数组风格的语法来公开有参属性（索引器）。换句话说，可将索引器看成是\
  \ C# 开发人员对 [] 操作符的重载。下面是一个示例 **BitArray** 类，它允许用数组风格的语法来索引由该类的实例维护的一组二进制位。\n\n```csharp\n\
  using System;\n\npublic sealed class BitArray {\n    // 容纳了二进制位的私有字节数组\n    private\
  \ Byte[] m_byteArray;\n    private Int32 m_numBits;\n\n    // 下面的构造器用于分配字节数组，并将所有位设为0\n\
  \    public BitArray(Int32 numBits) {\n        // 先验证实参\n        if (numBits <=\
  \ 0)\n            throw new ArgumentOutOfRangeException(\"numBits must be > 0\"\
  );\n\n        // 保存位的个数\n        m_numBits = numBits;\n        // 为位数组分配字节\n   \
  \     m_byteArray = new Byte[(numBits + 7) / 8];\n    }\n\n    // 下面是索引器（有参属性）\n\
  \    public Boolean this[Int32 bitPos] {\n\n        // 下面是索引器的 get 访问器方法\n     \
  \   get {\n            // 先验证实参\n            if ((bitPos < 0) || (bitPos >= m_numBits))\n\
  \                throw new ArgumentOutOfRangeException(\"bitPos\");\n\n        \
  \    // 返回指定索引处的位的状态\n            return (m_byteArray[bitPos / 8] & (1 << (bitPos\
  \ % 8))) != 0;\n        }\n\n        // 下面是索引器的 set 访问器方法\n        set {\n     \
  \       if ((bitPos < 0) || (bitPos >= m_numBits))\n                throw new ArgumentOutOfRangeException(\"\
  bitPos\",\n                                                      bitPos.ToString());\n\
  \            if (value) {\n                // 将指定索引处的位设为 true\n                m_byteArray[bitPos\
  \ / 8] = (Byte)\n                    (m_byteArray[bitPos / 8] | (1 << (bitPos %\
  \ 8)));\n            } else {\n                // 将指定索引处的位设为 false\n           \
  \     m_byteArray[bitPos / 8] = (Byte)\n                    (m_byteArray[bitPos\
  \ / 8] & ~(1 << (bitPos % 8)));\n            }\n        }\n    }\n}\n```\n\n**BitArray**\
  \ 类的索引器用起来很简单：\n\n```csharp\n// 分配含 14 个位的 BitArray 数组\nBitArray ba = new BitArray(14);\n\
  \n// 调用 set 访问器方法，将编号为偶数的所有位都设为 true\nfor (Int32 x = 0; x < 14; x++) {\n    ba[x]\
  \ = (x % 2 == 0);\n}\n\n// 调用 get 访问器方法显示所有位的状态\nfor (Int32 x = 0; x < 14; x++)\
  \ {\n    Console.WriteLine(\"Bit \" + x + \" is \" + (ba[x] ? \"On\" : \"Off\"));\n\
  }\n```\n\n在这个示例 **BitArray** 类中，索引器获取 **Int32** 类型的参数 bitPos。所有索引器至少要有一个参数，但可以有更多。这些参数（和返回类型）可以是除了\
  \ void 之外的任意类型。在 **System.Drawing.dll** 程序集的 **System.Drawing.Imaging.ColorMatrix**\
  \ 类中，提供了一个有多个参数的索引器的例子。\n\n经常要创建索引器来查询关联数组①中的值。**System.Collections.Generic.Dictionary**\
  \ 类型就提供了这样的一个索引器，它获取一个键，并返回与该键关联的值。和无参属性不同，类型可提供多个重载的索引器，只要这些索引器的签名不同。\n\n① 关联数组（associative\
  \ array）使用字符串索引（称为键）来访问存储在数组中的值（称为值）。——译注\n\n和无参属性的 **set** 访问器方法相似，索引器的 **set**\
  \ 访问器方法同样包含了一个隐藏参数，在 C# 中称为 **value**。该参数代表想赋给“被索引元素”的新值。\n\nCLR 本身不区分无参属性和有参属性。对\
  \ CLR 来说，每个属性都只是类型中定义的一对方法和一些元数据。如前所述，不同的编程语言要求用不同语法来创建和使用有参属性。将 **this[...]** 作为表达索引器的语法，这纯粹是\
  \ C# 团队自己的选择。也正是因为这个选择，所以 C# 只允许在对象的实例上定义索引器。C# 不支持定义静态索引器属性，虽然 CLR 支持静态有参属性。\n\n\
  由于 CLR 以相同的方式对待有参和无参属性，所以编译器会在托管程序集中生成以下两项或三项。\n\n- 代表有参属性 **get** 访问器的方法。仅在属性定义了\
  \ **get** 访问器方法时生成。\n- 代表有参属性 **set** 访问器的方法。仅在属性定义了 **set** 访问器方法时生成。\n- 托管程序集元数据中的属性定义。这一项必然生成。没有专门的有参属性元数据定义表，因为对于\
  \ CLR 来说，有参属性不过就是属性。\n\n对于前面的 **BitArray** 类，编译器在编译索引器时，原始代码似乎是像下面这样写的：\n\n```csharp\n\
  public sealed class BitArray {\n\n    // 下面是索引器的 get 访问器方法\n    public Boolean get_Item(Int32\
  \ bitPos) { /* ... */ }\n\n    // 下面是索引器的 set 访问器方法\n    public void set_Item(Int32\
  \ bitPos, Boolean value) { /* ... */ }\n}\n```\n\n编译器在索引器名称之前附加 **get_** 或者 **set_**\
  \ 前缀，从而自动生成这些方法的名称。由于 C# 的索引器语法不允许开发人员指定索引器名称，所以 C# 编译器团队不得不为访问器方法选择一个默认名称；他们最后选择了\
  \ **Item**。因此，编译器生成的方法名就是 **get_Item** 和 **set_Item**。\n\n查看文档时，留意类型是否提供了名为 **Item**\
  \ 的属性，从而判断该类型是否提供了索引器。例如，**System.Collections.Generic.List** 类型提供了名为 **Item** 的公共实例属性，它就是\
  \ **List** 的索引器。\n\n用 C# 编程永远看不到 **Item** 这个名称，所以一般无需关心编译器选择的是什么名称。但如果为类型设计的索引器要由其他语言的代码访问，就可能需要更改索引器的\
  \ **get** 和 **set** 访问器方法所用的默认名称 **Item**。C# 允许向索引器应用定制特性 **System.Runtime.CompilerServices.IndexerNameAttribute**\
  \ 来重命名这些方法，如下所示：\n\n```csharp\nusing System;\nusing System.Runtime.CompilerServices;\n\
  \npublic sealed class BitArray {\n    [IndexerName(\"Bit\")]\n    public Boolean\
  \ this[Int32 bitPos] {\n        // 这里至少要定义一个访问器方法\n    }\n}\n```\n\n现在，编译器将生成名为\
  \ **get_Bit** 和 **set_Bit** 的方法，而不是 **get_Item** 和 **set_Item**。编译时，C# 编译器会注意到 **IndexerName**\
  \ 特性，它告诉编译器如何对方法和属性的元数据进行命名。特性本身不会进入程序集的元数据。\n\n以下 Visual Basic 代码演示了如何访问这个 C# 索引器：\n\
  \n- 构造 **BitArray** 类型的实例  \n  `Dim ba as New BitArray(10)`\n- Visual Basic 用 `()`\
  \ 而不是 `[]` 指定数组元素  \n  `Console.WriteLine(ba(2))`  ' 显示 True 或 False\n- Visual Basic\
  \ 还允许通过索引器的名称来访问它  \n  `Console.WriteLine(ba.Bit(2))`  ' 显示的内容和上一行代码相同\n\nC# 允许一个类型定义多个索引器，只要索引器的参数集不同。在其他语言中，**IndexerName**\
  \ 特性允许定义多个相同签名的索引器，因为索引器各自可以有不同的名称。C# 不允许这样做，是因为它的语法不是通过名称来引用索引器，编译器不知道你引用的是哪一个索引器。编译以下\
  \ C# 代码将导致编译器报错：**error CS0111: 类型“SomeType”已定义了一个名为“this”的具有相同参数类型的成员。**\n\n```csharp\n\
  using System;\nusing System.Runtime.CompilerServices;\n\npublic sealed class SomeType\
  \ {\n    // 定义 get_Item 访问器方法\n    public Int32 this[Boolean b] {\n        get {\
  \ return 0; }\n    }\n\n    // 定义 get_Jeff 访问器方法\n    [IndexerName(\"Jeff\")]\n\
  \    public String this[Boolean b] {\n        get { return null; }\n    }\n}\n```\n\
  \n显然，C# 将索引器看成是对 [] 操作符的重载，而 [] 操作符不能用来消除具有不同方法名和相同参数集的有歧义性。\n\n顺便说一句，**System.String**\
  \ 类型是改变了索引器名称的一个例子。**String** 的索引器的名称是 **Chars**，而不是 **Item**。这个只读属性允许从字符串中获得一个单独的字符。对于不用\
  \ `[]` 操作符语法来访问这个属性的编程语言，**Chars** 是更有意义的名称。\n\n① 这个原因造成 **IndexerNameAttribute**\
  \ 类不是 CLI 和 C# 语言的 ECMA 标准的一部分。\n\n#### 选择主要的有参属性\n\nC# 对索引器的限制引起以下两个问题。\n\n- 如果定义类型的语言允许多个有参属性应该怎么办？\n\
  - 从 C# 中如何使用这个类型？\n\n这两个问题的答案是：类型必须选择其中一个有参属性来作为默认（主要）属性，这要求向类本身应用 **System.Reflection.DefaultMemberAttribute**\
  \ 的一个实例。要说明的是，该特性可应用于类、结构或接口。在 C# 中编译定义了有参属性的类型时，编译器会自动向类型应用该特性的实例，同时会考虑到你可能应用了\
  \ **IndexerName** 特性的情况。在 **DefaultMemberAttribute** 特性的构造器中，指定了要作为类型的默认有参属性使用的名称。\n\
  \n因此，如果在 C# 中定义包含有参属性的类型，但没有指定 **IndexerName** 特性，那么在向该类型应用的 **DefaultMember** 特性中，会将默认成员的名称指定为\
  \ **Item**。如果向有参属性应用了 **IndexerName** 特性，那么在向该类型应用的 **DefaultMember** 特性中，会将默认成员的名称指定为由\
  \ **IndexerName** 特性指定的字符串名称。记住，如果代码中含有多个名称不一样的有参属性，C# 将无法编译。对于支持多个有参属性的编程语言，必须从中选择一个属性方法名，并用\
  \ **DefaultMember** 特性来标识。这是 C# 代码唯一能访问的有参属性。\n\nC# 编译器发现代码试图获取或设置索引器时，会生成对其中一个方法的调用。有的语言不支持有参属性。要从这种语言中访问有参属性，必须显式调用需要的索引器方法。对于\
  \ CLR，无参和有参属性没有区别，所以可用相同的 **System.Reflection.PropertyInfo** 类来发现有参属性和它的访问器方法之间的关联。\n\
  \n### 10.3 调用属性访问器方法时的性能\n\n对于简单的 get 和 set 访问器方法，JIT 编译器会将代码内联（inline，或者说嵌入）。这样一来，使用属性（而不是使用字段）就没有性能上的损失。内联是指将方法（目前说的是访问器方法）的代码直接编译到调用它的方法中。这就避免了在运行时发出调用所产生的开销，代价是编译好的方法变得更大。由于属性访问器方法包含的代码一般很少，所以内联会使生成的本机代码变得更小，而且执行得更快。\n\
  \n> **注意** JIT 编译器在调试代码时不会内联属性方法，因为内联的代码会变得难以调试。这意味着在程序的发行版本中，访问属性时的性能可能比较快；在程序的调试版本中，可能比较慢。字段访问在调试和发布版本中，速度都很快。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_235_0.png)\n\n### 10.4 属性访问器的可访问性\n\n\
  有时希望为 get 访问器方法指定一种可访问性，为 set 访问器方法指定另一种可访问性。最常见的情形是提供公共 get 访问器和受保护 set 访问器。\n\n\
  ```csharp\npublic class SomeType {\n    private String m_name;\n    public String\
  \ Name\n    {\n        get { return m_name; }\n        protected set { m_name =\
  \ value;}\n    }\n}\n```\n\n如上述代码所示，Name 属性本身声明为 **public** 属性，意味着 **get** 访问器方法是公共的，所有代码都能调用。而\
  \ **set** 访问器方法声明为 **protected**，只能从 SomeType 内部定义的代码中调用，或者从 SomeType 的派生类的代码中调用。\n\
  \n定义属性时，如果两个访问器方法需要不同的可访问性，C# 要求必须为属性本身指定限制最小的可访问性。然后，两个访问器只能选择一个来使用限制较大的。在前面的例子中，属性本身声明为\
  \ **public**，而 **set** 访问器方法声明为 **protected**（限制较 **public** 大）。\n\n### 10.5 泛型属性访问器方法\n\
  \n既然属性本质上是方法，而 C# 和 CLR 允许泛型方法，所以有时可能想在定义属性时引入它自己的泛型类型参数（而非使用包含类型的泛型类型参数），但 C# 不允许。之所以属性不能引入它自己的泛型类型参数，最主要的原因是概念上说不通。属性本来应该表示可供查询或设置的某个对象特征。一旦引入泛型类型参数，就意味着有可能改变查询/设置行为。但属性不应该和行为沾边。公开对象的行为——无论是不是泛型——都应该定义为方法而非属性。\n\
  \n# \n\n- 1. ...\n- 2. ...\n- 3. ...\n\n# \n\n- 1. ...\n- 2. ...\n- 3. ...\n\n\n"
- "## 第11章　事件\n\n**本章内容：**\n\n- 设计公开事件的类型\n- 编译器如何实现事件\n- 设计侦听事件的类型\n- 显式实现事件\n\n\
  本章讨论可以在类型中定义的最后一种成员：事件。定义了事件成员的类型允许类型（或类型的实例）通知其他对象发生了特定的事情。例如，**Button** 类提供了 **Click**\
  \ 事件。应用程序中的一个或多个对象可接收关于该事件的通知，以便在 **Button** 被单击之后采取特定操作。我们用事件这种类型成员来实现这种交互。具体地说，定义了事件成员的类型能提供以下功能。\n\
  \n- 方法能登记它对事件的关注。\n- 方法能注销它对事件的关注。\n- 事件发生时，登记了的方法将收到通知。\n\n类型之所以能提供事件通知功能，是因为类型维护了一个已登记方法的列表。事件发生后，类型将通知列表中所有已登记的方法。\n\
  \nCLR 事件模型以**委托**为基础。委托是调用回调方法的一种类型安全的方式。对象凭借回调方法接收它们订阅的通知。本章会开始使用委托，但委托的完整细节是在第\
  \ 17 章“委托”中讲述的。\n\n为了帮你完整地理解事件在 CLR 中的工作机制，先来描述事件很有用的一个场景。假设要设计一个电子邮件应用程序。电子邮件到达时，用户可能希望将该邮件转发给传真机或寻呼机。先设计名为\
  \ **MailManager** 的类型来接收传入的电子邮件，它公开 **NewMail** 事件。\n\n① 这个“调用”（invoke）理解为“唤出”更恰当。它和普通的“调用”（call）稍有不同。在英语的语境中，invoke\
  \ 和 call 的区别在于，在执行一个所有信息都已知的方法时，用 call 比较恰当。这些信息包括要引用的类型、方法的签名以及方法名。但是，在需要先“唤出”某个东西来帮你调用一个信息不明的方法时，用\
  \ invoke 就比较恰当。但是，由于两者均翻译为“调用”不会对读者的理解造成太大的困扰，所以本书仍然采用约定俗成的方式来进行翻译，只是在必要的时候附加英文原文提醒你区分。——译注\n\
  \n其他类型（如 **Fax** 和 **Pager**）的对象登记对于该事件的关注。**MailManager** 收到新电子邮件会引发该事件，造成邮件分发给每一个已登记的对象。每个对象都用它们自己的方式处理邮件。\n\
  \n应用程序初始化时只实例化一个 **MailManager** 实例，然后可以实例化任意数量的 **Fax** 和 **Pager** 对象。图 11-1 展示了应用程序如何初始化，以及新电子邮件到达时发生的事情。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_238_0.png)\n\n- 1. **Fax** 对象中的一个方法登记对\
  \ **MailManager** 的 **NewMail** 事件的关注。\n- 2. **Pager** 对象中的一个方法登记对 **MailManager**\
  \ 的 **NewMail** 事件的关注。\n- 3. 一封新邮件到达 **MailManager**。\n- 4. **MailManager** 对象将事件通知发送给所有已登记的方法，这些方法以自己的方式处理邮件。\n\
  \n图 11-1 设计使用了事件的应用程序\n\n图 11-1 的应用程序首先构造 **MailManager** 的一个实例。**MailManager**\
  \ 提供了 **NewMail** 事件。构造 **Fax** 和 **Pager** 对象时，它们向 **MailManager** 的 **NewMail**\
  \ 事件登记自己的一个实例方法。这样当新邮件到达时，**MailManager** 就知道通知 **Fax** 和 **Pager** 对象。**MailManager**\
  \ 将来收到新邮件时会引发 **NewMail** 事件，使所有已登记的方法都有机会以自己的方式处理邮件。\n\n### 11.1　设计要公开事件的类型\n\n\
  开发人员通过连续几个步骤定义公开了一个或多个事件成员的类型。本节详细描述了每个必要的步骤。**MailManager** 示例应用程序（可从 http://wintellect.com\
  \ 下载）展示了 **MailManager** 类型、**Fax** 类型和 **Pager** 类型的所有源代码。注意，**Pager** 类型和 **Fax**\
  \ 类型几乎完全相同。\n\n#### 11.1.1　第一步：定义类型来容纳所有需要发送给事件通知接收者的附加信息\n\n事件引发时，引发事件的对象可能希望向接收事件通知的对象传递一些附加信息。这些附加信息需要封装到它自己的类中，该类通常包含一组私有字段，以及一些用于公开这些字段的只读公共属性。根据约定，这种类应该从\
  \ **System.EventArgs** 派生，而且类名以 **EventArgs** 结束。本例将该类命名为 **NewMailEventArgs** 类，它的各个字段分别标识了发件人（**m_from**）、收件人（**m_to**）和主题（**m_subject**）。\n\
  \n```csharp\n// 第一步：定义一个类型来容纳所有需要发送给事件通知接收者的附加信息\ninternal class NewMailEventArgs\
  \ : EventArgs\n{\n    private readonly String m_from, m_to, m_subject;\n\n    public\
  \ NewMailEventArgs(String from, String to, String subject)\n    {\n        m_from\
  \ = from; m_to = to; m_subject = subject;\n    }\n\n    public String From { get\
  \ { return m_from; } }\n    public String To { get { return m_to; } }\n    public\
  \ String Subject { get { return m_subject; } }\n}\n```\n\n**注意**　**EventArgs** 类在\
  \ Microsoft .NET Framework 类库（FCL）中定义，其实现如下：\n\n```csharp\n[ComVisible(true), Serializable]\n\
  public class EventArgs {\n    public static readonly EventArgs Empty = new EventArgs();\n\
  \    public EventArgs() { }\n}\n```\n\n可以看出，该类的实现非常简单，就是一个让其他类型继承的基类型。许多事件都没有附加信息需要传递。例如，当一个\
  \ **Button** 向已经登记的接收者通知自己被单击时，调用回调方法就可以了，定义不需要传递附加数据的事件时，可直接使用 **EventArgs.Empty**，不用构造新的\
  \ **EventArgs** 对象。\n\n#### 11.1.2　第二步：定义事件成员\n\n事件成员使用 C# 关键字 **event** 定义。每个事件成员都要指定以下内容：可访问性标识符（几乎肯定是\
  \ **public**，这样其他代码才能访问该事件成员）；委托类型，指出要调用的方法的原型；以及名称（可以是任何有效的标识符）。以下是我们的 **MailManager**\
  \ 类中的事件成员：\n\n```csharp\ninternal class MailManager\n{\n    // 第二步：定义事件成员\n    public\
  \ event EventHandler<NewMailEventArgs> NewMail;\n    ...\n}\n```\n\n**NewMail**\
  \ 是事件名称。事件成员的类型是 **EventHandler<NewMailEventArgs>**，意味着“事件通知”的所有接收者都必须提供一个原型和 **EventHandler<NewMailEventArgs>**\
  \ 委托类型匹配的回调方法。由于泛型 **System.EventHandler** 委托类型的定义如下：\n\n```csharp\npublic delegate\
  \ void EventHandler<TEventArgs>(Object sender, TEventArgs e);\n```\n\n所以方法原型必须具有以下形式：\n\
  \n```csharp\nvoid MethodName(Object sender, NewMailEventArgs e);\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_240_0.png)\n\
  \n**注意** 许多人奇怪事件模式为什么要求 `sender` 参数是 `Object` 类型。毕竟，只有 `MailManager` 才会引发传递了 `NewMailEventArgs`\
  \ 对象的事件，所以回调方法更合适的原型似乎是下面这个：\n\n```csharp\nvoid MethodName(MailManager sender, NewMailEventArgs\
  \ e);\n```\n\n要求 `sender` 是 `Object` 主要是因为继承。例如，假定 `MailManager` 成为 `SmtpMailManager`\
  \ 的基类，那么回调方法的 `sender` 参数应该是 `SmtpMailManager` 类型而不是 `MailManager` 类型。但这不可能发生，因为\
  \ `SmtpMailManager` 继承了 `NewMail` 事件。所以，如果代码需要由 `SmtpMailManager` 引发事件，还是要将 `sender`\
  \ 实参转型为 `SmtpMailManager`。反正都要进行类型转换，这和将 `sender` 定为 `Object` 类型没什么两样。\n\n将 `sender`\
  \ 参数的类型定为 `Object` 的另一个原因是灵活性。它使委托能由多个类型使用，只要类型提供了一个会传递 `NewMailEventArgs` 对象的事件。例如，即使\
  \ `PopMailManager` 类不是从 `MailManager` 类派生的，也能使用这个委托。\n\n此外，事件模式要求委托定义和回调方法将派生自 `EventArgs`\
  \ 的参数命名为 `e`。这个要求唯一的作用就是加强事件模式的一致性，使开发人员更容易学习和实现这个模式。注意，能自动生成源代码的工具（比如 Microsoft\
  \ Visual Studio）也知道将参数命名为 `e`。\n\n最后，事件模式要求所有事件处理程序①的返回类型都是 `void`。这很有必要，因为引发事件后可能要调用好几个回调方法，但没办法获得所有方法的返回值。将返回类型定为\
  \ `void`，就不允许回调（方法）返回值。遗憾的是，FCL 中的一些事件处理程序（比如 `ResolveEventHandler`）没有遵循 Microsoft\
  \ 制定的惯例，例如，`ResolveEventHandler` 事件处理程序会返回 `Assembly` 类型的对象。\n\n#### 11.1.3　第三步：定义负责引发事件的方法来通知事件的登记对象\n\
  \n按照约定，类要定义一个受保护的虚方法。引发事件时，类及其派生类中的代码会调用该方法。方法只获取一个参数，即一个 `NewMailEventArgs` 对象，其中包含了传给接收通知的对象的信息。方法的默认实现只是检查一下是否有对象登记了对事件的关注。如果有，就引发事件来通知事件的登记对象。该方法在\
  \ `MailManager` 类中看起来像下面这样：\n\n```csharp\ninternal class MailManager {\n    // 第三步：定义负责引发事件的方法来通知已登记的对象。\n\
  \    // 如果类是封闭的，该方法要声明为私有和非静态的。\n    protected virtual void OnNewMail(NewMailEventArgs\
  \ e) {\n        // 出于线程安全的考虑，现在将委托字段的引用复制到一个临时变量中\n        EventHandler<NewMailEventArgs>\
  \ temp = Volatile.Read(ref NewMail);\n        // 任何方法登记了对事件的关注，就通知它们\n        if\
  \ (temp != null) temp(this, e);\n    }\n    ...\n}\n```\n\n① 本书按约定俗成的译法将 event handler\
  \ 翻译成“事件处理程序”，但请把它理解成“事件处理方法”（在 VB 中，则理解成“事件处理 Sub 过程”）。——译注\n\n#### 以线程安全的方式引发事件\n\
  \n.NET Framework 刚发布时建议开发者用以下方式引发事件：\n\n```csharp\n// 版本1\nprotected virtual void\
  \ OnNewMail(NewMailEventArgs e) {\n    if (NewMail != null) NewMail(this, e);\n\
  }\n```\n\n**OnNewMail** 方法的问题在于，虽然线程检查出 **NewMail** 不为 **null**，但就在调用 **NewMail**\
  \ 之前，另一个线程可能从委托链中移除一个委托，使 **NewMail** 成了 **null**。这会抛出 **NullReferenceException**\
  \ 异常。为了修正这个竞态问题，许多开发者都像下面这样写 **OnNewMail** 方法。\n\n```csharp\n// 版本2\nprotected virtual\
  \ void OnNewMail(NewMailEventArgs e) {\n    EventHandler<NewMailEventArgs> temp\
  \ = NewMail;\n    if (temp != null) temp(this, e);\n}\n```\n\n它的思路是，将对 **NewMail**\
  \ 的引用复制到临时变量 **temp** 中，后者引用赋值发生时的委托链。然后，方法比较 **temp** 和 **null**，并调用（invoke）**temp**；所以，向\
  \ **temp** 赋值后，即使另一个线程更改了 **NewMail** 也没有关系。委托是不可变的（immutable），所以这个技术理论上行得通。但许多开发者没有意识到的是，编译器可能“擅作主张”，通过完全移除局部变量\
  \ **temp** 的方式对上述代码进行优化。如果发生这种情况，版本 2 就和版本 1 没有任何区别。所以，仍有可能抛出 **NullReferenceException**\
  \ 异常。\n\n要想彻底修正这个问题，应该像下面这样重写 **OnNewMail**：\n\n```csharp\n// 版本3\nprotected virtual\
  \ void OnNewMail(NewMailEventArgs e) {\n    EventHandler<NewMailEventArgs> temp\
  \ = Volatile.Read(ref NewMail);\n    if (temp != null) temp(this, e);\n}\n```\n\n\
  对 **Volatile.Read** 的调用强迫 **NewMail** 在这个调用发生时读取，引用真的必须复制到 **temp** 变量中（编译器别想走捷径）。然后，**temp**\
  \ 变量只有在不为 **null** 时才会被调用（invoke）。第 29 章“基元线程同步构造”将详细讨论 **Volatile.Read** 方法。\n\n\
  虽然最后一个版本很完美，是技术正确的版本，但版本 2 实际也是可以使用的，因为 JIT 编译器理解这个模式，知道自己不该将局部变量 **temp** “优化”掉。具体地说，Microsoft\
  \ 的所有 JIT 编译器都“尊重”那些不会造成对堆内存的新的读取动作的不变量（invariant）。所以，在局部变量中缓存一个引用，可确保堆引用只被访问一次。这一点并未在文档中反映，理论上说将来可能改变，这正是为什么应该使用最后一个版本的原因。但实际上，Microsoft\
  \ 的 JIT 编译器永远没有可能真的进行修改来破坏这个模式，否则太多的应用程序都会“遭殃”①。此外，事件主要在单线程的情形（WPF 和 Windows Store\
  \ 应用）中使用，所以线程安全不是问题。\n\n还要注意，考虑到线程竞态条件①，方法有可能在从事件的委托链中移除之后得到调用。\n\n为方便起见，可定义扩展方法（参见第\
  \ 8 章“方法”）来封装这个线程安全逻辑。如下所示：\n\n```csharp\npublic static class EventArgExtensions\
  \ {\n    public static void Raise<TEventArgs>(this TEventArgs e,\n        Object\
  \ sender, ref EventHandler<TEventArgs> eventDelegate) {\n\n        // 出于线程安全的考虑，现在将对委托字段的引用复制到临时字段\n\
  \        EventHandler<TEventArgs> temp = Volatile.Read(ref eventDelegate);\n\n \
  \       // 任何方法登记了对事件的关注，就通知它们\n        if (temp != null) temp(sender, e);\n   \
  \ }\n}\n```\n\n现在可以像下面这样重写 **OnNewMail** 方法：\n\n```csharp\nprotected virtual void\
  \ OnNewMail(NewMailEventArgs e) {\n    e.Raise(this, ref m_NewMail);\n}\n```\n\n\
  以 **MailManager** 作为基类的类可自由重写 **OnNewMail** 方法。这使派生类能控制事件的引发，以自己的方式处理新邮件。一般情况下，派生类会调用基类的\
  \ **OnNewMail** 方法，使登记过的方法能收到通知。但是，派生类也可以不允许事件转发。\n\n#### 11.1.4　第四步：定义方法将输入转化为期望事件\n\
  \n类还必须有一个方法获取输入并转化为事件的引发。在 **MailManager** 的例子中，是调用 **SimulateNewMail** 方法来指出一封新的电子邮件已到达\
  \ **MailManager**：\n\n```csharp\ninternal class MailManager {\n\n    // 第四步：定义方法将输入转化为期望事件\n\
  \    public void SimulateNewMail(String from, String to, String subject) {\n\n \
  \       // 构造一个对象来容纳想传给通知接收者的信息\n        NewMailEventArgs e = new NewMailEventArgs(from,\
  \ to, subject);\n\n        // 调用虚方法通知对象事件已发生，\n        // 如果没有类型重写该方法，我们的对象将通知事件的所有登记对象\n\
  \        OnNewMail(e);\n    }\n}\n```\n\n**SimulateNewMail** 接收关于邮件的信息并构造 **NewMailEventArgs**\
  \ 对象，将邮件信息传给它的构造器。然后调用 **MailManager** 自己的虚方法 **OnNewMail** 来正式通知 **MailManager**\
  \ 对象收到了新的电子邮件。这通常会导致事件的引发，从而通知所有已登记的方法。（如前所述，以 **MailManager** 为基类的类可能重写这个行为。）\n\
  \n### 11.2　编译器如何实现事件\n\n知道如何定义提供了事件成员的类之后，接着研究一下事件是什么，以及它是如何工作的。**MailManager**\
  \ 类用一行代码定义了事件成员本身：\n\n\n```csharp\npublic event EventHandler<NewMailEventArgs> NewMail;\n\
  ```\n\nC#编译器编译时把它转换为以下 3 个构造：\n\n```csharp\n// 1. 一个被初始化为 null 的私有委托字段\nprivate\
  \ EventHandler<NewMailEventArgs> NewMail = null;\n\n// 2. 一个公共 add_Xxx 方法(其中 Xxx\
  \ 是事件名)\n// 允许方法登记对事件的关注\npublic void add_NewMail(EventHandler<NewMailEventArgs>\
  \ value) {\n    // 通过循环和对 CompareExchange 的调用，可以\n    // 以一种线程安全的方式向事件添加委托\n   \
  \ EventHandler<NewMailEventArgs> prevHandler;\n    EventHandler<NewMailEventArgs>\
  \ newMail = this.NewMail;\n    do {\n        prevHandler = newMail;\n        EventHandler<NewMailEventArgs>\
  \ newHandler =\n            (EventHandler<NewMailEventArgs>) Delegate.Combine(prevHandler,\
  \ value);\n        newMail = Interlocked.CompareExchange<EventHandler<NewMailEventArgs>>(\n\
  \            ref this.NewMail, newHandler, prevHandler);\n    } while (newMail !=\
  \ prevHandler);\n}\n\n// 3. 一个公共 remove_Xxx 方法(其中 Xxx 是事件名)\n// 允许方法注销对事件的关注\npublic\
  \ void remove_NewMail(EventHandler<NewMailEventArgs> value) {\n    // 通过循环和对 CompareExchange\
  \ 的调用，可以\n    // 以一种线程安全的方式从事件中移除一个委托\n    EventHandler<NewMailEventArgs> prevHandler;\n\
  \    EventHandler<NewMailEventArgs> newMail = this.NewMail;\n    do {\n        prevHandler\
  \ = newMail;\n        EventHandler<NewMailEventArgs> newHandler =\n            (EventHandler<NewMailEventArgs>)\
  \ Delegate.Remove(prevHandler, value);\n        newMail = Interlocked.CompareExchange<EventHandler<NewMailEventArgs>>(\n\
  \            ref this.NewMail, newHandler, prevHandler);\n    } while (newMail !=\
  \ prevHandler);\n}\n```\n\n第一个构造是具有恰当委托类型的字段。该字段是对一个委托列表的头部的引用。事件发生时会通知这个列表中的委托。字段初始化为\
  \ null，表明无侦听者(listener)登记对该事件的关注。一个方法登记对事件的关注时，该字段会引用 EventHandler<NewMailEventArgs>\
  \ 委托的实例，后者可能引用更多的 EventHandler<NewMailEventArgs> 委托。侦听者登记对事件的关注时，只需将委托类型的一个实例添加到列表中。显然，注销(对事件的关注)意味着从列表中移除委托。\n\
  \n注意，即使原始代码行将事件定义为 public，委托字段(本例是 NewMail)也始终是 private。将委托字段定义为 private，目的是防止此类外部的代码不正确地操纵它。如果字段是\
  \ public，任何代码都能更改字段中的值，并可能删除已经登记了对事件的关注的委托。\n\nC#编译器生成的第二个构造是一个方法，允许其他对象登记对事件的关注。C#编译器在事件名(NewMail)之前附加\
  \ add_ 前缀，从而自动命名该方法。C#编译器还自动为方法生成代码。生成的代码总是调用 System.Delegate 的静态 Combine 方法，它将委托实例添加到委托列表中，返回新的列表头(地址)，并将这个地址存回字段。\n\
  \nC#编译器生成的第三个构造是一个方法，允许对象注销对事件的关注。同样地，C#编译器在事件名(NewMail)之前附加 **remove_** 前缀，从而自动命名该方法。方法中的代码总是调用\
  \ **Delegate** 的静态 **Remove** 方法，将委托实例从委托列表中删除，返回新的列表头(地址)，并将这个地址存回字段。\n\n> **警告**\
  \ 试图删除从未添加过的方法，**Delegate** 的 **Remove** 方法在内部不做任何事情。也就是说，不会抛出任何异常，也不会显示任何警告；事件的方法集合保持不变。\n\
  \n> **注意** **add** 和 **remove** 方法以线程安全的一种模式更新值。该模式的详情将在 29.3.4 节“Interlocked Anything\
  \ 模式”讨论。\n\n在本例中，**add** 和 **remove** 方法的可访问性都是 **public**。这是因为源代码将事件声明为 **public**。如果事件声明为\
  \ **protected**，编译器生成的 **add** 和 **remove** 方法也会被声明为 **protected**。因此，在类型中定义事件时，事件的可访问性决定了什么代码能登记和注销对事件的关注。但无论如何，只有类型本身才能直接访问委托字段。事件成员也可声明为\
  \ **static** 或 **virtual**。在这种情况下，编译器生成的 **add** 和 **remove** 方法分别标记为 **static**\
  \ 或 **virtual**。\n\n除了生成上述 3 个构造，编译器还会在托管程序集的元数据中生成一个事件定义记录项。这个记录项包含了一些标志(flag)和基础委托类型(underlying\
  \ delegate type)，还引用了 **add** 和 **remove** 访问器方法。这些信息的作用很简单，就是建立“事件”的抽象概念和它的访问器方法之间的联系。编译器和其它工具可利用这些元数据信息，并可通过\
  \ **System.Reflection.EventInfo** 类获取这些信息。但是，**CLR** 本身并不使用这些元数据信息，它在运行时只需要访问器方法。\n\
  \n### 11.3 设计侦听事件的类型\n\n最难的部分已经完成了，接下来是一些较为简单的事情。本节将演示如何定义一个类型来使用另一个类型提供的事件。先来看看\
  \ **Fax** 类型的代码：\n\n```csharp\ninternal sealed class Fax {\n    // 将 MailManager\
  \ 对象传给构造器\n    public Fax(MailManager mm) {\n\n        // 构造 EventHandler<NewMailEventArgs>委托的一个实例，\n\
  \        // 使它引用我们的 FaxMsg 回调方法\n        // 向 MailManager 的 NewMail 事件登记我们的回调方法\n\
  \        mm.NewMail += FaxMsg;\n    }\n\n    // 新电子邮件到达时，MailManager 将调用这个方法\n \
  \   private void FaxMsg(Object sender, NewMailEventArgs e) {\n\n        // 'sender'表示\
  \ MailManager 对象，便于将信息传回给它\n\n        // 'e'表示 MailManager 对象想传给我们的附加事件信息\n    \
  \    // 这里的代码正常情况下应该传真电子邮件，\n        // 但这个测试性的实现只是在控制台上显示邮件\n        Console.WriteLine(\"\
  Faxing mail message:\");\n        Console.WriteLine(\" From={0}, To={1}, Subject={2}\"\
  ,\n            e.From, e.To, e.Subject);\n    }\n\n    // 执行这个方法，Fax 对象将向 NewMail\
  \ 事件注销自己对它的关注。\n    // 以后不再接收通知\n    public void Unregister(MailManager mm) {\n\n\
  \        // 向 MailManager 的 NewMail 事件注销自己对这个事件的关注\n        mm.NewMail -= FaxMsg;\n\
  \    }\n}\n```\n\n电子邮件应用程序初始化时首先构造 **MailManager** 对象，并将对该对象的引用保存到变量中。然后构造 **Fax**\
  \ 对象，并将 **MailManager** 对象引用作为实参传递。在 **Fax** 构造器中，**Fax** 对象使用 C#的+=操作符登记它对 **MailManager**\
  \ 的 **NewMail** 事件的关注：\n\n```csharp\nmm.NewMail += FaxMsg;\n```\n\nC#编译器内建了对事件的支持，会将+=操作符翻译成以下代码来添加对象对事件的关注：\n\
  \n```csharp\nmm.add_NewMail(new EventHandler<NewMailEventArgs>(this.FaxMsg));\n\
  ```\n\nC#编译器生成的代码构造一个 **EventHandler<NewMailEventArgs>** 委托对象，其中包装了 **Fax** 类的 **FaxMsg**\
  \ 方法。接着，C#编译器调用 **MailManager** 类的 **add_NewMail** 方法，向它传递新的委托对象。为了对此进行验证，可编译代码并用\
  \ ILDasm.exe 这样的工具查看 IL 代码。\n\n即使使用的编程语言不直接支持事件，也可显式调用 **add** 访问器方法向事件登记委托。两者效果一样，只是后者的源代码看起来没那么优雅。两者最终都是用\
  \ **add** 访问器将委托添加到事件的委托列表中，从而完成委托向事件的登记。\n\n**MailManager** 对象引发事件时，**Fax** 对象的\
  \ **FaxMsg** 方法会被调用。调用这个方法时，会传递 **MailManager** 对象引用作为它的第一个参数，即 **sender**。该参数大多数时候会被忽略。但如果\
  \ **Fax** 对象希望在响应事件时访问 **MailManager** 对象的成员，它就能派上用场了。第二个参数是 **NewMailEventArgs**\
  \ 对象引用。对象中包含 **MailManager** 和 **NewMailEventArgs** 的设计者认为对事件接收者来说有用的附加信息。\n\n**FaxMsg**\
  \ 方法可从 **NewMailEventArgs** 对象中轻松访问邮件的发件人、收件人以及主题。真实的 **Fax** 对象应将这些信息传真到某处。本例只是在控制台窗口显示。\n\
  \n对象不再希望接收事件通知时，应注销对事件的关注。例如，如果不再希望将电子邮件转发到一台传真机，**Fax** 对象就应该注销它对 **NewMail** 事件的关注。对象只要向事件登记了它的一个方法，便不能被垃圾回收。所以，如果你的类型要实现\
  \ **IDisposable** 的 **Dispose** 方法，就应该在实现中注销所有事件的关注。**IDisposable** 的详情参见第 21 章“托管堆和垃圾回收”。\n\
  \n**Fax** 的 **Unregister** 方法示范了如何注销对事件的关注。该方法和 **Fax** 构造器中的代码十分相似。唯一区别是使用 `-=`\
  \ 而不是 `+=`。C#编译器看到代码使用 `-=` 操作符向事件注销委托时，会生成对事件的 `remove` 方法的调用：\n\n```csharp\nmm.remove_NewMail(new\
  \ EventHandler<NewMailEventArgs>(FaxMsg));\n```\n\n和 `+=` 操作符一样，即使编程语言不直接支持事件，也可显式调用\
  \ `remove` 访问器方法向事件注销委托。`remove` 方法为了向事件注销委托，需要扫描委托列表来寻找一个恰当的委托（其中包装的方法和传递的方法相同）。找到匹配，现有委托会从事件的委托列表中删除。没有找到也不会报错，列表不发生任何变动。\n\
  \n顺便说一下，C#要求代码使用 `+=` 和 `-=` 操作符在列表中增删委托。如果显式调用 `add` 和 `remove` 方法，C#编译器会报告以下错误消息：**CS0571：无法显式调用运算符或访问器。**\n\
  \n### 11.4 显式实现事件\n\n**System.Windows.Forms.Control** 类型定义了大约 70 个事件。假如 Control\
  \ 类型在实现事件时，允许编译器隐式生成 `add` 和 `remove` 访问器方法以及委托字段，那么每个 Control 对象仅为事件就要准备 70 个委托字段！由于大多数程序员只关心少数几个事件，所以每个从\
  \ Control 派生类型创建的对象都要浪费大量内存。顺便说一下，ASP.NET 的 **System.Web.UI.Control** 类型和 WPF 的\
  \ **System.Windows.UIElement** 类型也提供了大多数程序员都用不上的大量事件。\n\n本节将讨论 C#编译器如何允许类的开发人员显式实现一个事件，使开发人员能够控制\
  \ `add` 和 `remove` 方法处理回调委托的方式。我要演示如何通过显式实现事件来高效率地实现提供了大量事件的类，但肯定还有其他情形也需要显式实现事件。\n\
  \n为了高效率存储事件委托，公开了事件的每个对象都要维护一个集合（通常是字典）。集合将某种形式的事件标识符作为键(key)，将委托列表作为值(value)。新对象构造时，这个集合是空白的。登记对一个事件的关注时，会在集合中查找事件的标识符。如果事件标识符已在其中，新委托就和这个事件的委托列表合并。如果事件标识符不在集合中，就添加事件标识符和委托。\n\
  \n对象需要引发事件时，会在集合中查找事件标识符。如果集合中没有找到事件标识符，表明还没有任何对象登记对这个事件的关注，所以没有任何委托需要回调。如果事件标识符在集合中，就调用与它关联的委托列表。具体怎么实现这个设计模式，是定义事件的那个类型的开发人员的责任；使用类型的开发人员不知道事件在内部如何实现。\n\
  \n下例展示了如何完成这个模式。首先实现一个 **EventSet** 类，它代表一个集合，其中包含事件以及每个事件的委托列表。\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Threading;\n\n//\
  \ 这个类的目的是在使用 EventSet 时，提供\n// 多一点的类型安全性和代码可维护性\npublic sealed class EventKey {\
  \ }\n\npublic sealed class EventSet {\n    // 该私有字段用于维护 EventKey -> Delegate 映射\n\
  \    private readonly Dictionary<EventKey, Delegate> m_events =\n        new Dictionary<EventKey,\
  \ Delegate>();\n\n    // 添加 EventKey -> Delegate 映射（如果 EventKey 不存在），\n    // 或者将委托和现有的\
  \ EventKey 合并\n    public void Add(EventKey eventKey, Delegate handler) {\n    \
  \    Monitor.Enter(m_events);\n        Delegate d;\n        m_events.TryGetValue(eventKey,\
  \ out d);\n        m_events[eventKey] = Delegate.Combine(d, handler);\n        Monitor.Exit(m_events);\n\
  \    }\n\n    // 从 EventKey（如果它存在）删除委托，并且\n    // 在删除最后一个委托时删除 EventKey -> Delegate\
  \ 映射\n    public void Remove(EventKey eventKey, Delegate handler) {\n        Monitor.Enter(m_events);\n\
  \        // 调用 TryGetValue，确保在尝试从集合中删除不存在的 EventKey 时不会抛出异常\n        Delegate d;\n\
  \        if (m_events.TryGetValue(eventKey, out d)) {\n            d = Delegate.Remove(d,\
  \ handler);\n\n            // 如果还有委托，就设置新的头部（地址），否则删除 EventKey\n            if (d\
  \ != null) m_events[eventKey] = d;\n            else m_events.Remove(eventKey);\n\
  \        }\n        Monitor.Exit(m_events);\n    }\n\n    // 为指定的 EventKey 引发事件\n\
  \    public void Raise(EventKey eventKey, Object sender, EventArgs e) {\n      \
  \  // 如果 EventKey 不在集合中，不抛出异常\n        Delegate d;\n        Monitor.Enter(m_events);\n\
  \        m_events.TryGetValue(eventKey, out d);\n        Monitor.Exit(m_events);\n\
  \n        if (d != null) {\n            // 由于字典可能包含几个不同的委托类型，\n            // 所以无法在编译时构造一个类型安全的委托调用\n\
  \            // 因此，我调用 System.Delegate 类型的 DynamicInvoke\n            // 方法，以一个对象数组的形式向它传递回调方法的参数\n\
  \            // 在内部，DynamicInvoke 会向调用的回调方法查证参数的\n            // 类型安全性，并调用方法\n \
  \           // 如果存在类型不匹配的情况，DynamicInvoke 会抛出异常\n            d.DynamicInvoke(new\
  \ Object[] { sender, e });\n        }\n    }\n}\n```\n\n接着定义一个类来使用 **EventSet**\
  \ 类。在这个类中，一个字段引用了一个 **EventSet** 对象，而且这个类的每个事件都是显式实现的，使每个事件的 **add** 方法都将指定的回调委托存储到\
  \ **EventSet** 对象中，而且每个事件的 **remove** 方法都删除指定的回调委托（如果找得到的话）。\n\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_249_0.png)\n"
- "## 第 12 章 泛型\n\n**本章内容：**\n\n- FCL 中的泛型\n- 泛型基础结构\n- 泛型接口\n- 泛型委托\n- 委托和接口的逆变和协变泛型类型实参\n\
  - 泛型方法\n- 泛型和其他成员\n- 可验证性和约束\n\n熟悉面向对象编程的开发人员都深谙这种编程方式的好处。其中一个好处是“代码重用”，它极大提高了开发效率。也就是说，可以派生出一个类，让它继承基类的所有能力。派生类只需重写虚方法，或添加一些新方法，就可定制派生类的行为，使之满足开发人员的需求。泛型（generic）是\
  \ CLR 和编程语言提供的一种特殊机制，它支持另一种形式的代码重用，即“算法重用”。\n\n简单地说，开发人员先定义好算法，比如排序、搜索、交换、比较或者转换等。但是，定义算法的开发人员并不设定该算法要操作什么数据类型；该算法可广泛地应用于不同类型的对象。然后，另一个开发人员只要指定了算法要操作的具体数据类型，就可以开始使用这个算法了。例如，一个排序算法可操作\
  \ **Int32** 和 **String** 等类型的对象，而一个比较算法可操作 **DateTime** 和 **Version** 等类型的对象。\n\n\
  大多数算法都封装在一个类型中，CLR 允许创建泛型引用类型和泛型值类型，但不允许创建泛型枚举类型。此外，CLR 还允许创建泛型接口和泛型委托。方法偶尔也封装有用的算法，所以\
  \ CLR 允许在引用类型、值类型或接口中定义泛型方法。\n\n先来看一个简单的例子。**Framework** 类库（Framework Class Library，FCL）定义了一个泛型列表算法，它知道如何管理对象集合。泛型算法没有设定对象的数据类型。要使用这个泛型列表算法时，必须指定具体数据类型。\n\
  \n封装了泛型列表算法的 FCL 类称为 **List\\<T\\>**（读作 List of Tee）。这个类是在 **System.Collections.Generic**\
  \ 命名空间中定义的。下面展示了类定义（代码被大幅简化）：\n\n```csharp\n[Serializable]\npublic class List<T>\
  \ : IList<T>, ICollection<T>, IEnumerable<T>,\n    IList, ICollection, IEnumerable\
  \ {\n\n    public List();\n    public void Add(T item);\n    public Int32 BinarySearch(T\
  \ item);\n    public void Clear();\n    public Boolean Contains(T item);\n    public\
  \ Int32 IndexOf(T item);\n    public Boolean Remove(T item);\n    public void Sort();\n\
  \    public void Sort(IComparer<T> comparer);\n    public void Sort(Comparison<T>\
  \ comparison);\n    public T[] ToArray();\n\n    public Int32 Count { get; }\n \
  \   public T this[Int32 index] { get; set; }\n}\n```\n\n泛型 List 类的设计者紧接在类名后添加了一个\
  \ \\<T\\>，表明它操作的是一个未指定的数据类型。定义泛型类型或方法时，为类型指定的任何变量（比如 T）都称为类型参数（type parameter）。T\
  \ 是变量名，源代码能使用数据类型的任何地方都能使用 T。例如，在 List 类定义中，T 被用于方法参数（Add 方法接受一个 T 类型的参数）和返回值（ToArray\
  \ 方法返回 T 类型的一维数组）。另一个例子是索引器方法（在 C# 中称为 this）。索引器有一个 get 访问器方法，它返回 T 类型的值；一个 set\
  \ 访问器方法，它接受 T 类型的参数。由于凡是能指定一个数据类型的地方都能使用 T 变量，所以在方法内部定义一个局部变量时，或者在类中定义字段时，也可以使用\
  \ T。\n\n> **注意**　根据 Microsoft 的设计原则，泛型参数变量要么称为 T，要么至少以大写 T 开头（如 TKey 和 TValue）。大写\
  \ T 代表类型（Type），就像大写 I 代表接口（Interface）一样，比如 IComparable。\n\n定义好泛型 List\\<T\\> 类型之后，其他开发人员为了使用这个泛型算法，要指定由算法操作的具体数据类型。使用泛型类型或方法时指定的具体数据类型称为类型实参（type\
  \ argument）。例如，开发人员可指定一个 DateTime 类型实参来使用 List 算法。以下代码对此进行了演示：\n\n```csharp\nprivate\
  \ static void SomeMethod() {\n    // 构造一个 List 来操作 DateTime 对象\n    List<DateTime>\
  \ dtList = new List<DateTime>();\n\n    // 向列表添加一个 DateTime 对象\n    dtList.Add(DateTime.Now);\
  \                  // 不进行装箱\n\n    // 向列表添加另一个 DateTime 对象\n    dtList.Add(DateTime.MinValue);\
  \             // 不进行装箱\n\n    // 尝试向列表中添加一个 String 对象\n    dtList.Add(\"1/1/2004\"\
  );                    // 编译时错误\n\n    // 从列表提取一个 DateTime 对象\n    DateTime dt =\
  \ dtList[0];                   // 不需要转型\n}\n```\n\n```csharp\nl = null; //确保进行垃圾回收\n\
  }\n\nusing (new OperationTimer(\"ArrayList of Int32\")) {\n    ArrayList a = new\
  \ ArrayList();\n    for (Int32 n = 0; n < count; n++) {\n        a.Add(n);     \
  \               // 发生装箱\n        Int32 x = (Int32) a[n];      // 发生拆箱\n    }\n \
  \   a = null;                        // 确保进行垃圾回收\n}\n\nprivate static void ReferenceTypePerfTest()\
  \ {\n    const Int32 count = 100000000;\n\n    using (new OperationTimer(\"List<String>\"\
  )) {\n        List<String> l = new List<String>();\n        for (Int32 n = 0; n\
  \ < count; n++) {\n            l.Add(\"x\");                  // 复制引用\n        \
  \    String x = l[n];             // 复制引用\n        }\n        l = null;        \
  \                // 确保进行垃圾回收\n    }\n\n    using (new OperationTimer(\"ArrayList\
  \ of String\")) {\n        ArrayList a = new ArrayList();\n        for (Int32 n\
  \ = 0; n < count; n++) {\n            a.Add(\"x\");                  // 复制引用\n \
  \           String x = (String) a[n];    // 检查强制类型转换 & 复制引用\n        }\n       \
  \ a = null; // 确保进行垃圾回收\n    }\n}\n\n// 这个类用于进行运算性能计时\ninternal sealed class OperationTimer\
  \ : IDisposable {\n    private Stopwatch m_stopwatch;\n    private String m_text;\n\
  \    private Int32 m_collectionCount;\n\n    public OperationTimer(String text)\
  \ {\n        PrepareForOperation();\n\n        m_text = text;\n        m_collectionCount\
  \ = GC.CollectionCount(0);\n\n        // 这应该是方法的最后一个语句，从而最大程度保证计时的准确性\n        m_stopwatch\
  \ = Stopwatch.StartNew();\n    }\n\n    public void Dispose() {\n        Console.WriteLine(\"\
  {0} (GCs={1,3}) {2}\", (m_stopwatch.Elapsed),\n            GC.CollectionCount(0)\
  \ - m_collectionCount, m_text);\n    }\n\n    private static void PrepareForOperation()\
  \ {\n        GC.Collect();\n        GC.WaitForPendingFinalizers();\n        GC.Collect();\n\
  \    }\n}\n```\n\n在我的机器上编译并运行这个程序（打开优化开关），得到以下输出：\n\n```text\n    00:00:01.6246959\
  \ (GCs= 6) List<Int32>\n    00:00:10.8555008 (GCs=390) ArrayList of Int32\n    00:00:02.5427847\
  \ (GCs= 4) List<String>\n    00:00:02.7944831 (GCs= 7) ArrayList of String\n```\n\
  \n这证明在操作 **Int32** 类型时，泛型 **List** 算法比非泛型 **ArrayList** 算法快得多。1.6 秒和 11 秒，约 7 倍的差异！此外，用\
  \ **ArrayList** 操作值类型（**Int32**）会造成大量装箱，最终要进行 390 次垃圾回收。对应地，**List** 算法只需进行 6 次。\n\
  \n不过，用引用类型来测试，差异就没那么明显了，时间和垃圾回收次数基本相同。所以，泛型 **List** 算法在这里表面上没什么优势。但要注意的是，泛型算法的优势还包括更清晰的代码和编译时的类型安全。所以，虽然性能提升不是很明显，但泛型算法的其他优势也不容忽视。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_253_0.png)\n\n> **注意**　应该意识到，首次为特定数据类型调用方法时，CLR\
  \ 都会为这个方法生成本机代码。这会增大应用程序的工作集（working set）大小，从而损害性能。12.2 节“泛型基础结构”将进一步探讨这个问题。\n\n\
  ### 12.1 FCL 中的泛型\n\n泛型最明显的应用就是集合类。FCL 在 **System.Collections.Generic** 和 **System.Collections.ObjectModel**\
  \ 命名空间中提供了多个泛型集合类。**System.Collections.Concurrent** 命名空间则提供了线程安全的泛型集合类。Microsoft\
  \ 建议使用泛型集合类，不建议使用非泛型集合类。这是出于几方面的考虑。首先，使用非泛型集合类，无法像使用泛型集合类那样获得类型安全性、更清晰的代码以及更佳的性能。其次，泛型类具有比非泛型类更好的对象模型。例如，虚方法数量显著变少，性能更好。另外，泛型集合类增添了一些新成员，为开发人员提供了新的功能。\n\
  \n集合类实现了许多接口，放入集合中的对象可实现接口来执行排序和搜索等操作。FCL 包含许多泛型接口定义，所以使用接口时也能享受到泛型带来的好处。常用接口在 **System.Collections.Generic**\
  \ 命名空间中提供。\n\n新的泛型接口不是为了替代旧的非泛型接口。许多时候两者都要使用（为了向后兼容）。例如，如果 **List\\<T\\>** 类只实现了\
  \ **IList\\<T\\>** 接口，代码就不能将一个 **List\\<DateTime\\>** 对象当作一个 **IList** 来处理。\n\n\
  还要注意，**System.Array** 类（所有数组类型的基类）提供了大量静态泛型方法，比如 **AsReadOnly、BinarySearch、ConvertAll、Exists、Find、FindAll、FindIndex、FindLast、FindLastIndex、ForEach、IndexOf、LastIndexOf、Resize、Sort**\
  \ 和 **TrueForAll** 等。下面展示了部分方法：\n\n```csharp\npublic abstract class Array : ICloneable,\
  \ IList, ICollection, IEnumerable,\n    IStructuralComparable, IStructuralEquatable\
  \ {\n\n    public static void Sort<T>(T[] array);\n    public static void Sort<T>(T[]\
  \ array, IComparer<T> comparer);\n\n    public static Int32 BinarySearch<T>(T[]\
  \ array, T value);\n    public static Int32 BinarySearch<T>(T[] array, T value,\n\
  \        IComparer<T> comparer);\n    ...\n}\n```\n\n以下代码展示了如何使用其中一些方法：\n\n```csharp\n\
  public static void Main() {\n    // 创建并初始化字节数组\n    Byte[] byteArray = new Byte[]\
  \ { 5, 1, 4, 2, 3 };\n\n    // 调用 Byte[] 排序算法\n    Array.Sort<Byte>(byteArray);\n\
  \n    // 调用 Byte[] 二分搜索算法\n    Int32 i = Array.BinarySearch<Byte>(byteArray, 1);\n\
  \    Console.WriteLine(i); // 显示“0”\n}\n```\n\n### 12.2 泛型基础结构\n\n泛型在 CLR 2.0 中加入。为了在\
  \ CLR 中加入泛型，许多人花费了大量时间来完成这个大型任务。具体地说，为了使泛型能够工作，Microsoft 必须完成以下工作。\n\n- 创建新的 IL\
  \ 指令，使之能够识别类型实参。\n- 修改现有元数据表的格式，以便表示具有泛型参数的类型名称和方法。\n- 修改各种编程语言（C#、Microsoft Visual\
  \ Basic .NET 等）来支持新语法，允许开发人员定义和引用泛型类型和方法。\n- 修改编译器，使之能生成新的 IL 指令和修改的元数据格式。\n- 修改\
  \ JIT 编译器，以便处理新的支持类型实参的 IL 指令来生成正确的本机代码。\n- 创建新的反射成员，使开发人员能查询类型和成员，以判断它们是否具有泛型参数。另外，还必须定义新的反射成员，使开发人员能在运行时创建泛型类型和方法定义。\n\
  - 修改调试器以显示和操纵泛型类型、成员、字段以及局部变量。\n- 修改 Microsoft Visual Studio 的“智能感知”（IntelliSense）功能。将泛型类型或方法应用于特定数据类型时能显示成员的原型。\n\
  \n现在让我们花些时间讨论 CLR 内部如何处理泛型。这一部分的知识可能影响你构建和设计泛型算法的方式。另外，还可能影响你是否使用一个现有泛型算法的决策。\n\n\
  #### 12.2.1 开放类型和封闭类型\n\n贯穿全书，我讨论了 CLR 如何为应用程序使用的各种类型创建称为类型对象（type object）的内部数据结构。具有泛型类型参数的类型仍然是类型，CLR\
  \ 同样会为它创建内部的类型对象。这一点适用于引用类型（类）、值类型（结构）、接口类型和委托类型。然而，具有泛型类型参数的类型称为开放类型，CLR 禁止构造开放类型的任何实例。这类似于\
  \ CLR 禁止构造接口类型的实例。\n\n代码引用泛型类型时可指定一组泛型类型实参。为所有类型参数都传递了实际的数据类型，类型就成为封闭类型。CLR 允许构造封闭类型的实例。然而，代码引用泛型类型的时候，可能留下一些泛型类型实参未指定。这会在\
  \ CLR 中创建新的开放类型对象，而且不能创建该类型的实例。以下代码更清楚地说明了这一点：\n\n```csharp\nusing System;\nusing\
  \ System.Collections.Generic;\n\n// 一个部分指定的开放类型\ninternal sealed class DictionaryStringKey<TValue>\
  \ :\n    Dictionary<String, TValue>\n{\n}\n\npublic static class Program {\n   \
  \ public static void Main() {\n        Object o = null;\n\n        // Dictionary<,>是开放类型，有\
  \ 2 个类型参数\n        Type t = typeof(Dictionary<,>);\n\n        // 尝试创建该类型的实例（失败）\n\
  \        o = CreateInstance(t);\n        Console.WriteLine();\n\n        // DictionaryStringKey<>是开放类型，有\
  \ 1 个类型参数\n        t = typeof(DictionaryStringKey<>);\n\n        // 尝试创建该类型的实例（失败）\n\
  \        o = CreateInstance(t);\n        Console.WriteLine();\n\n        // DictionaryStringKey<Guid>是封闭类型\n\
  \        t = typeof(DictionaryStringKey<Guid>);\n\n        // 尝试创建该类型的一个实例（成功）\n\
  \        o = CreateInstance(t);\n\n        // 证明它确实能够工作\n        Console.WriteLine(\"\
  \ 对象类型 = \" + o.GetType());\n    }\n\n    private static Object CreateInstance(Type\
  \ t) {\n        Object o = null;\n        try {\n            o = Activator.CreateInstance(t);\n\
  \            Console.Write(\"{0} 的实例\", t.ToString());\n        }\n        catch\
  \ (ArgumentException e) {\n            Console.WriteLine(e.Message);\n        }\n\
  \    }\n}\n```\n\n\n\n```\n}\nreturn o;\n}\n}\n```\n\n编译并运行上述代码得到以下输出：\n\n```\n\
  无法创建 System.Collections.Generic.Dictionary`2[TKey,TValue] 的实例，\n因为 Type.ContainsGenericParameters\
  \ 为 True\n\n无法创建 DictionaryStringKey`1[TValue] 的实例，\n因为 Type.ContainsGenericParameters\
  \ 为 True\n\n已创建 DictionaryStringKey`1[System.Guid] 的实例。\n对象类型 = DictionaryStringKey`1[System.Guid]\n\
  ```\n\n可以看出，**Activator** 的 **CreateInstance** 方法会在试图构造开放类型的实例时抛出 **ArgumentException**\
  \ 异常。注意，异常的字符串消息指明类型中仍然含有一些泛型参数。\n\n从输出可以看出，类型名以“\\`”字符和一个数字结尾。数字代表类型的元数，也就是类型要求的类型参数个数。例如，**Dictionary**\
  \ 类的元数为 2，要求为 **TKey** 和 **TValue** 这两个类型参数指定具体类型。**DictionaryStringKey** 类的元数为\
  \ 1，只要求为 **TValue** 指定具体类型。\n\n还要注意，CLR 会在类型对象内部分配类型的静态字段（本书第 4 章“类型基础”对此进行了讨论）。因此，每个封闭类型都有自己的静态字段。换言之，假如\
  \ `List<T>` 定义了任何静态字段，这些字段不会在一个 `List<DateTime>` 和一个 `List<String>` 之间共享；每个封闭类型对象都有自己的静态字段。另外，假如泛型类型定义了静态构造器（参见第\
  \ 8 章“方法”），那么针对每个封闭类型，这个构造器都会执行一次。泛型类型定义静态构造器的目的是保证传递的类型实参满足特定条件。例如，我们可以像下面这样定义只能处理枚举类型的泛型类型：\n\
  \n```csharp\ninternal sealed class GenericTypeThatRequiresAnEnum<T> {\n    static\
  \ GenericTypeThatRequiresAnEnum() {\n        if (!typeof(T).IsEnum) {\n        \
  \    throw new ArgumentException(\"T must be an enumerated type\");\n        }\n\
  \    }\n}\n```\n\nCLR 提供了名为**约束**的功能，可以更好地指定有效的类型实参。本章稍后会详细讨论。遗憾的是，约束无法将类型实参限制为“仅枚举类型”。正是因为这个原因，所以上例需要用静态构造器来保证类型是一个枚举类型。\n\
  \n#### 12.2.2 泛型类型和继承\n\n泛型类型仍然是类型，所以能从其他任何类型派生。使用泛型类型并指定类型实参时，实际是在 CLR 中定义一个新的类型对象，新的类型对象从泛型类型派生自的那个类型派生。换言之，由于\
  \ `List<T>` 从 `Object` 派生，所以 `List<String>` 和 `List<Guid>` 也从 `Object` 派生。类似地，由于\
  \ `DictionaryStringKey<TValue>` 从 `Dictionary<String, TValue>` 派生，所以 `DictionaryStringKey<Guid>`\
  \ 也从 `Dictionary<String, Guid>` 派生。指定类型实参不影响继承层次结构——理解这一点，有助于你判断哪些强制类型转换是允许的，哪些不允许。\n\
  \n假定像下面这样定义一个链表节点类：\n\n```csharp\ninternal sealed class Node<T> {\n    public T\
  \ m_data;\n    public Node<T> m_next;\n\n    public Node(T data) : this(data, null)\
  \ {\n    }\n\n    public Node(T data, Node<T> next) {\n        m_data = data; m_next\
  \ = next;\n    }\n\n    public override String ToString() {\n        return m_data.ToString()\
  \ +\n            ((m_next != null) ? m_next.ToString() : String.Empty);\n    }\n\
  }\n```\n\n那么可以写代码来构造链表，例如：\n\n```csharp\nprivate static void SameDataLinkedList()\
  \ {\n    Node<Char> head = new Node<Char>('C');\n    head = new Node<Char>('B',\
  \ head);\n    head = new Node<Char>('A', head);\n    Console.WriteLine(head.ToString());\
  \  // 显示\"ABC\"\n}\n```\n\n在这个 **Node** 类中，对于 **m_next** 字段引用的另一个节点来说，它的 **m_data**\
  \ 字段必须包含相同的数据类型。这意味着在链表包含的节点中，所有数据项都必须具有相同的类型（或派生类型）。例如，不能使用 **Node** 类来创建这样一个链表：其中一个元素包含\
  \ **Char** 值，另一个包含 **DateTime** 值，另一个元素则包含 **String** 值。当然，如果到处都用 `Node<Object>`，那么确实可以做到，但会丧失编译时类型安全性，而且值类型会被装箱。\n\
  \n所以，更好的办法是定义非泛型 **Node** 基类，再定义泛型 **TypedNode** 类（用 **Node** 类作为基类）。这样就可以创建一个链表，其中每个节点都可以是一种具体的数据类型（不能是\
  \ **Object**），同时获得编译时的类型安全性，并防止值类型装箱。下面是新的类型定义：\n\n```csharp\ninternal class Node\
  \ {\n    protected Node m_next;\n\n    public Node(Node next) {\n        m_next\
  \ = next;\n    }\n}\n```\n\n```csharp\ninternal sealed class TypedNode<T> : Node\
  \ {\n    public T m_data;\n\n    public TypedNode(T data) : this(data, null) {\n\
  \    }\n\n    public TypedNode(T data, Node next) : base(next) {\n        m_data\
  \ = data;\n    }\n\n    public override String ToString() {\n        return m_data.ToString()\
  \ +\n            ((m_next != null) ? m_next.ToString() : String.Empty);\n    }\n\
  }\n```\n\n现在可以写代码来创建一个链表，其中每个节点都是不同的数据类型。例如：\n\n```csharp\nprivate static void DifferentDataLinkedList()\
  \ {\n    Node head = new TypedNode<Char>('.');\n    head = new TypedNode<DateTime>(DateTime.Now,\
  \ head);\n    head = new TypedNode<String>(\"Today is \", head);\n    Console.WriteLine(head.ToString());\n\
  }\n```\n\n#### 12.2.3 泛型类型同一性\n\n泛型语法有时会将开发人员弄糊涂，因为源代码中可能散布着大量“<”和“>”符号，这有损可读性。为了对语法进行增强，有的开发人员定义了一个新的非泛型类类型，它从一个泛型类型派生，并指定了所有类型实参。例如，为了简化下面这样的代码：\n\
  \n```csharp\nList<DateTime> dt1 = new List<DateTime>();\n```\n\n一些开发人员可能首先定义下面这样的类：\n\
  \n```csharp\ninternal sealed class DateTimeList : List<DateTime> {\n    // 这里无需放入任何代码!\n\
  }\n```\n\n然后就可以简化创建列表的代码（没有了“<”和“>”符号）：\n\n```csharp\nDateTimeList dt1 = new DateTimeList();\n\
  ```\n\n这样做表面上是方便了（尤其是要为参数、局部变量和字段使用新类型的时候），但是，绝对不要单纯出于增强源码可读性的目的来定义一个新类。这样会丧失类型同一性（identity）和相等性（equivalence），如以下代码所示：\n\
  \n```csharp\nBoolean sameType = (typeof(List<DateTime>) == typeof(DateTimeList));\n\
  ```\n\n上述代码运行时，**sameType** 会被初始化为 **false**，因为比较的是两个不同类型的对象。这也意味着如果方法的原型接受一个 **DateTimeList**，那么不可以将一个\
  \ `List<DateTime>` 传给它。然而，如果方法的原型接受一个 `List<DateTime>`，那么可以将一个 **DateTimeList**\
  \ 传给它，因为 **DateTimeList** 从 `List<DateTime>` 派生。开发人员很容易被所有这一切搞糊涂。\n\n幸好，C# 允许使用简化的语法来引用泛型封闭类型，同时不会影响类型的相等性。这个语法要求在源文件顶部使用传统的\
  \ using 指令，例如：\n\n```csharp\nusing DateTimeList = System.Collections.Generic.List<System.DateTime>;\n\
  ```\n\n**using** 指令实际定义的是名为 **DateTimeList** 的符号。代码编译时，编译器将代码中出现的所有 **DateTimeList**\
  \ 替换成 `System.Collections.Generic.List<System.DateTime>`。这样就允许开发人员使用简化的语法，同时不影响代码的实际含义。所以，类型的同一性和相等性得到了维持。现在，执行下面这行代码时，**sameType**\
  \ 会被初始化为 **true**：\n\n```csharp\nBoolean sameType = (typeof(List<DateTime>) == typeof(DateTimeList));\n\
  ```\n\n另外，可以利用 C# 的“隐式类型局部变量”功能，让编译器根据表达式的类型来推断方法的局部变量的类型：\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\n...\ninternal sealed class SomeType {\n    private\
  \ static void SomeMethod () {\n\n        // 编译器推断出 dt1 的类型\n        // 是 System.Collections.Generic.List<System.DateTime>\n\
  \        var dt1 = new List<DateTime>();\n        ...\n    }\n}\n```\n\n#### 12.2.4\
  \ 代码爆炸\n\n使用泛型类型参数的方法在进行 JIT 编译时，CLR 获取方法的 IL，用指定的类型实参替换，然后创建恰当的本机代码（这些代码为操作指定数据类型“量身定制”）。这正是你希望的，也是泛型的重要特点。但这样做有一个缺点：CLR\
  \ 要为每种不同的方法/类型组合生成本机代码。我们将这个现象称为**代码爆炸**。它可能造成应用程序的工作集显著增大，从而损害性能。\n\n幸好，CLR 内建了一些优化措施能缓解代码爆炸。首先，假如为特定的类型实参调用了一个方法，以后再用相同的类型实参调用这个方法，CLR\
  \ 只会为这个方法/类型组合编译一次代码。所以，如果一个程序集使用 `List<DateTime>`，一个完全不同的程序集（加载到同一个 AppDomain 中）也使用\
  \ `List<DateTime>`，CLR 只为 `List<DateTime>` 编译一次方法。这样就显著缓解了代码爆炸。\n\nCLR 还有另一个优化，它认为所有引用类型实参都完全相同，所以代码能够共享。例如，CLR\
  \ 为 `List<String>` 的方法编译的代码可直接用于 `List<Stream>` 的方法，因为 **String** 和 **Stream** 均为引用类型。事实上，对于任何引用类型，都会使用相同的代码。CLR\
  \ 之所以能执行这个优化，是因为所有引用类型的实参或变量实际只是指向堆上对象的指针（32 位 Windows 系统上是 32 位指针；64 位 Windows\
  \ 系统上是 64 位指针），而所有对象指针都以相同方式操纵。\n\n但是，假如某个类型实参是值类型，CLR 就必须专门为那个值类型生成本机代码。这是因为值类型的大小不定。即使两个值类型大小一样（比如\
  \ **Int32** 和 **UInt32**，两者都是 32 位），CLR 仍然无法共享代码，因为可能要用不同的本机 CPU 指令来操纵这些值。\n\n###\
  \ 12.3 泛型接口\n\n显然，泛型的主要作用就是定义泛型的引用类型和值类型。然而，对泛型接口的支持对 CLR 来说也很重要。没有泛型接口，每次用非泛型接口（如\
  \ **IComparable**）来操纵值类型都会发生装箱，而且会失去编译时的类型安全性。这将严重制约泛型类型的应用范围。因此，CLR 提供了对泛型接口的支持。引用类型或值类型可指定类型实参实现泛型接口。也可保持类型实参的未指定状态来实现泛型接口。下面来看一些例子。\n\
  \n以下泛型接口定义是 FCL 的一部分（在 System.Collections.Generic 命名空间中）：\n\n```csharp\npublic interface\
  \ IEnumerator<T> : IDisposable, IEnumerator {\n    T Current { get; }\n}\n```\n\n\
  下面的示例类型实现了上述泛型接口，而且指定了类型实参。注意，**Triangle** 对象可枚举一组 **Point** 对象。还要注意，**Current**\
  \ 属性具有 **Point** 数据类型：\n\n```csharp\ninternal sealed class Triangle : IEnumerator<Point>\
  \ {\n    private Point[] m_vertices;\n\n    // IEnumerator<Point>的 Current 属性是 Point\
  \ 类型\n    public Point Current { get { ... } }\n\n    ...\n}\n```\n\n下例实现了相同的泛型接口，但保持类型实参的未指定状态：\n\
  \n```csharp\ninternal sealed class ArrayEnumerator<T> : IEnumerator<T> {\n    private\
  \ T[] m_array;\n\n    // IEnumerator<T>的 Current 属性是 T 类型\n    public T Current\
  \ { get { ... } }\n\n    ...\n}\n```\n\n注意，**ArrayEnumerator** 对象可枚举一组 T 对象（T 未指定，允许代码使用泛型\
  \ **ArrayEnumerator** 类型在以后为 T 指定具体类型）。还要注意，**Current** 属性现在具有未指定的数据类型 T。第 13 章“接口”将更深入地讨论泛型接口。\n\
  \n### 12.4 泛型委托\n\nCLR 支持泛型委托，目的是保证任何类型的对象都能以类型安全的方式传给回调方法。此外，泛型委托允许值类型实例在传给回调方法时不进行任何装箱。第\
  \ 17 章“委托”会讲到，委托实际只是提供了 4 个方法的一个类定义。4 个方法包括一个构造器、一个 **Invoke** 方法、一个 **BeginInvoke**\
  \ 方法和一个 **EndInvoke** 方法。如果定义的委托类型指定了类型参数，编译器会定义委托类的方法，用指定的类型参数替换方法的参数类型和返回值类型。\n\
  \n例如，假定像下面这样定义泛型委托：\n\n```csharp\npublic delegate TReturn CallMe<TReturn, TKey,\
  \ TValue>(TKey key, TValue value);\n```\n\n编译器会将它转换成如下所示的类：\n\n```csharp\npublic\
  \ sealed class CallMe<TReturn, TKey, TValue> : MulticastDelegate {\n    public CallMe(Object\
  \ object, IntPtr method);\n    public virtual TReturn Invoke(TKey key, TValue value);\n\
  \    public virtual IAsyncResult BeginInvoke(TKey key, TValue value,\n        AsyncCallback\
  \ callback, Object object);\n    public virtual TReturn EndInvoke(IAsyncResult result);\n\
  }\n```\n\n> 注意 建议尽量使用 FCL 预定义的泛型 **Action** 和 **Func** 委托。这些委托的详情将在 17.6 节“委托定义不要太多（泛型委托）”讲述。\n\
  \n### 12.5 委托和接口的逆变和协变泛型类型实参\n\n委托的每个泛型类型参数都可标记为协变量或逆变量①。利用这个功能，可将泛型委托类型的变量转换为相同的委托类型（但泛型参数类型不同）。泛型类型参数可以是以下任何一种形式。\n\
  \n- **不变量（invariant）** 意味着泛型类型参数不能更改。到目前为止，你在本章看到的全是不变量形式的泛型类型参数。\n- **逆变量（contravariant）**\
  \ 意味着泛型类型参数可以从一个类更改为它的某个派生类。在 C# 中是用 **in** 关键字标记逆变量形式的泛型类型参数。逆变量泛型类型参数只出现在输入位置，比如作为方法的参数。\n\
  - **协变量（covariant）** 意味着泛型类型参数可以从一个类更改为它的某个基类。C# 用 **out** 关键字标记协变量形式的泛型类型参数。协变量泛型类型参数只能出现在输出位置，比如作为方法的返回类型。\n\
  \n例如，假定存在以下委托类型定义（顺便说一下，它真的存在）：\n\n```csharp\npublic delegate TResult Func<in T,\
  \ out TResult>(T arg);\n```\n\n其中，泛型类型参数 **T** 用 **in** 关键字标记，这使它成为逆变量；泛型类型参数 **TResult**\
  \ 用 **out** 关键字标记，这使它成为协变量。\n\n所以，如果像下面这样声明一个变量：\n\n```csharp\nFunc<Object, ArgumentException>\
  \ fn1 = null;\n```\n\n就可将它转型为另一个泛型类型参数不同的 **Func** 类型：\n\n```csharp\nFunc<String,\
  \ Exception> fn2 = fn1; // 不需要显式转型\nException e = fn2(\"\");\n```\n\n上述代码的意思是：**fn1**\
  \ 变量引用一个方法，获取一个 **Object**，返回一个 **ArgumentException**。而 **fn2** 变量引用另一个方法，获取一个 **String**，返回一个\
  \ **Exception**。由于可将一个 **String** 传给期待 **Object** 的方法（因为 **String** 从 **Object**\
  \ 派生），而且由于可以\n\n① 本书采用目前约定俗成的译法：covariant=协变量，contravariant=逆变量；covariance=协变性，contravariance=逆变性。另外，variance=可变性。至于两者更详细的区别，推荐阅读\
  \ Eric Lippert 的 Covariance and Contravariance in C# 系列博客文章。简而言之，协变性指定返回类型的兼容性，而逆变性指定参数的兼容性。——译注\n\
  \n\n\n获取返回 **ArgumentException** 的一个方法的结果，并将这个结果当成一个 **Exception**（因为 **Exception**\
  \ 是 **ArgumentException** 的基类），所以上述代码能正常编译，而且编译时能维持类型安全性。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_262_0.png)\n\
  \n> 注意　只有编译器能验证类型之间存在引用转换，这些可变性才有用。换言之，由于需要装箱，所以值类型不具有这种可变性。我个人认为正是因为存在这个限制，这些可变性的用处不是特别大。例如，假定定义以下方法：\n\
  \n```csharp\nvoid ProcessCollection(IEnumerable<Object> collection) { ... }\n```\n\
  \n> 我不能在调用它时传递一个 **List&lt;DateTime&gt;** 对象引用，因为 **DateTime** 值类型和 **Object** 之间不存在引用转换——虽然\
  \ **DateTime** 是从 **Object** 派生的。为了解决这个问题，可像下面这样声明 **ProcessCollection**：\n\n```csharp\n\
  void ProcessCollection<T>(IEnumerable<T> collection) { ... }\n```\n\n> 另外，**ProcessCollection(IEnumerable&lt;Object&gt;\
  \ collection)** 最大的好处是 JIT 编译得到的代码只有一个版本。但如果使用 **ProcessCollection&lt;T&gt;(IEnumerable&lt;T&gt;\
  \ collection)**，那么只有在 T 是引用类型的前提下，才可共享同一个版本的 JIT 编译代码。对于 T 是值类型的情况，每个值类型都有一份不同的\
  \ JIT 编译代码；不过，起码能在调用方法时传递一个值类型集合了。\n\n> 另外，对于泛型类型参数，如果要将该类型的实参传给使用 **out** 或 **ref**\
  \ 关键字的方法，便不允许可变性。例如，以下代码会造成编译器报告错误消息：**无效的可变性：类型参数“T”在“SomeDelegate&lt;T&gt;.Invoke(ref\
  \ T)”中必须是不变量。现在的“T”是逆变。**①（Visual Studio 2012/2013 实际显示的消息有点让人摸不着头脑：变体无效：类型参数“**T**”必须为对于“**SomeDelegate&lt;T&gt;.Invoke(ref\
  \ T)**”有效的固定式。“**T**”为逆变。——译注）\n\n```csharp\ndelegate void SomeDelegate<in T>(ref\
  \ T t);\n```\n\n使用要获取泛型参数和返回值的委托时，建议尽量为逆变性和协变性指定 **in** 和 **out** 关键字。这样做不会有不良反应，并使你的委托能在更多的情形中使用。\n\
  \n和委托相似，具有泛型类型参数的接口也可将类型参数标记为逆变量和协变量。下面的示例接口只有一个逆变泛型类型参数：\n\n```csharp\npublic interface\
  \ IEnumerator<in T> : IEnumerator {\n    Boolean MoveNext();\n    T Current { get;\
  \ }\n}\n```\n\n由于 T 是逆变型，所以以下代码可顺利编译和运行：\n\n```csharp\n// 这个方法接受任意引用类型的一个 IEnumerable\n\
  Int32 Count(IEnumerable<Object> collection) { ... }\n\n...\n// 以下调用向 Count 传递一个\
  \ IEnumerable<String>\nInt32 c = Count(new[] { \"Grant\" });\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_263_0.png)\n\
  \n> **重要提示**　开发人员有时会问：“为什么必须显式用 in 或 out 标记泛型类型参数？”他们认为编译器应该能检查委托或接口声明，并自动检测哪些泛型类型参数能够逆变和协变。虽然编译器确实能，但\
  \ C# 团队认为必须由你订立协定(contract)，明确说明想允许什么。例如，假定编译器判断一个泛型类型参数是逆变量(用在输入位置)，但你将来向某个接口添加了成员，并将类型参数用在了输出位置。下次编译时，编译器将认为该类型参数是不变。但在引用了其他成员的所有地方，只要还认为“类型参数是逆变量”就可能出错。\n\
  >\n> 因此，编译器团队决定，在声明泛型类型参数时，必须由你显式使用 in 或 out 来标记可变性。以后使用这个类型参数时，假如用法与声明时指定的不符，编译器就会报错，提醒你违反了自己订立的协定。如果为泛型类型参数添加\
  \ in 或 out 来打破原来的协定，就必须修改使用旧协定的代码。\n\n### 12.6 泛型方法\n\n定义泛型类、结构或接口时，类型中定义的任何方法都可引用类型指定的类型参数。类型参数可作为方法参数、方法返回值或方法内部定义的局部变量的类型使用。然而，CLR\
  \ 还允许方法指定它自己的类型参数。这些类型参数也可作为参数、返回值或局部变量的类型使用。\n\n在下例中，类型定义了一个类型参数，方法也定义了自己的：\n\n\
  ```csharp\ninternal sealed class GenericType<T> {\n    private T m_value;\n\n  \
  \  public GenericType(T value) { m_value = value; }\n\n    public TOutput Convert<TOutput>()\
  \ {\n        TOutput result = (TOutput)Convert.ChangeType(m_value, typeof(TOutput));\n\
  \        return result;    // 返回类型转换之后的结果\n    }\n}\n```\n\n在这个例子中，**GenericType**\
  \ 类定义了类型参数(T)，**Convert** 方法也定义了自己的类型参数(**TOutput**)。这样的 **GenericType** 可以处理任意类型。**Convert**\
  \ 方法能够将 m_value 字段引用的对象转换成任意类型——具体取决于调用时传递的类型实参是什么。泛型方法的存在，为开发人员提供了极大的灵活性。\n\n泛型方法的一个很好的例子是\
  \ **Swap** 方法：\n\n```csharp\nprivate static void Swap<T>(ref T o1, ref T o2) {\n\
  \    T temp = o1;\n    o1 = o2;\n    o2 = temp;\n}\n```\n\n现在可以这样调用 **Swap**：\n\n\
  ```csharp\nprivate static void CallingSwap() {\n    Int32 n1 = 1, n2 = 2;\n    Console.WriteLine(\"\
  n1={0}, n2={1}\", n1, n2);\n    Swap<Int32>(ref n1, ref n2);\n    Console.WriteLine(\"\
  n1={0}, n2={1}\", n1, n2);\n\n    String s1 = \"Aidan\", s2 = \"Grant\";\n    Console.WriteLine(\"\
  s1={0}, s2={1}\", s1, s2);\n    Swap<String>(ref s1, ref s2);\n    Console.WriteLine(\"\
  s1={0}, s2={1}\", s1, s2);\n}\n```\n\n为获取 **out** 和 **ref** 参数的方法使用泛型类型很有意思，因为作为\
  \ **out/ref** 实参传递的变量必须具有与方法参数相同的类型，以防止损害类型安全性。涉及 **out/ref** 参数的这个问题已在 9.3 节“以传引用的方式向方法传递参数”讨论。事实上，**Interlocked**\
  \ 类的 **Exchange** 和 **CompareExchange** 方法就是因为这个原因才提供泛型重载的①（where 子句将在本章稍后的 12.8\
  \ 节“可验证性和约束”讨论）。\n\n```csharp\npublic static class Interlocked {\n    public static\
  \ T Exchange<T>(ref T location1, T value) where T: class;\n    public static T CompareExchange<T>(\n\
  \        ref T location1, T value, T comparand) where T: class;\n}\n```\n\n####\
  \ 泛型方法和类型推断\n\nC#泛型语法因为涉及大量“&lt;”和“&gt;”符号，所以开发人员很容易被弄得晕头转向。为了改进代码的创建，增强可读性和可维护性，C#编译器支持在调用泛型方法时进行类型推断。这意味着编译器会在调用泛型方法时自动判断(或者说推断)要使用的类型。以下代码对类型推断进行了演示：\n\
  \n```csharp\nprivate static void CallingSwapUsingInference() {\n    Int32 n1 = 1,\
  \ n2 = 2;\n    Swap(ref n1, ref n2);    // 调用 Swap<Int32>\n\n    String s1 = \"\
  Aidan\";\n    Object s2 = \"Grant\";\n    Swap(ref s1, ref s2);    // 错误，不能推断类型\n\
  }\n```\n\n在上述代码中，对 **Swap** 的调用没有在一对“&lt;”和“&gt;”中指定类型实参。在第一个 **Swap** 调用中，C#编译器推断\
  \ n1 和 n2 都是 **Int32**，所以应该使用 **Int32** 类型实参来调用 **Swap**。\n\n推断类型时，C#使用变量的数据类型，而不是变量引用的对象的实际类型。所以在第二个\
  \ Swap 调用中，C#发现 s1 是 String，而 s2 是 Object(即使它恰好引用一个 String)。由于 s1 和 s2 是不同数据类型的变量，编译器拿不准要为\
  \ Swap 传递什么类型实参，所以会报告以下消息：**error CS0411: 无法从用法推断出方法\"Program.Swap&lt;T&gt;(ref\
  \ T, ref T)\"的类型参数。请尝试显式指定类型参数。**\n\n类型可定义多个方法，让其中一个方法接受具体数据类型，让另一个接受泛型类型参数，如下例所示：\n\
  \n```csharp\nprivate static void Display(String s) {\n    Console.WriteLine(s);\n\
  }\n\nprivate static void Display<T>(T o) {\n    Display(o.ToString());    // 调用\
  \ Display(String)\n}\n```\n\n下面展示了 **Display 方法**的一些调用方式：\n\n```csharp\nDisplay(\"\
  Jeff\");                 // 调用 Display(String)\nDisplay(123);                  \
  \  // 调用 Display<T>(T)\nDisplay<String>(\"Aidan\");       // 调用 Display<T>(T)\n\
  ```\n\n在第一个调用中，编译器可调用接受一个 String 参数的 Display 方法，也可调用泛型 Display 方法(将 T 替换成 String)。但\
  \ C#编译器的策略是先考虑较明确的匹配，再考虑泛型匹配。所以，它会生成对非泛型 Display 方法的调用，也就是接受一个 String 参数的版本。对于第二个调用，编译器不能调用接受\
  \ String 参数的非泛型 Display 方法，所以必须调用泛型 Display 方法。顺便说一句，编译器优先选择较明确的匹配，开发人员应对此感到庆幸。假如编译器优先选择泛型方法，那么由于泛型\
  \ Display 方法会再次调用 Display(但传递由 ToString 返回的一个 String)，所以会造成无限递归。\n\n对 Display 的第三个调用明确指定了泛型类型实参\
  \ String。这告诉编译器不要尝试推断类型实参。相反，应使用显式指定的类型实参。在本例中，编译器还假定我肯定是想调用泛型 Display 方法，所以会毫不犹豫地调用泛型\
  \ Display 方法。在内部，泛型 Display 方法会为传入的字符串调用 ToString 方法，然后将转换所得的字符串传给非泛型 Display 方法。\n\
  \n### 12.7 泛型和其他成员\n\n在 C#中，属性、索引器、事件、操作符方法、构造器和终结器本身不能有类型参数。但它们能在泛型类型中定义，而且这些成员中的代码能使用类型的类型参数。\n\
  \nC#之所以不允许这些成员指定自己的泛型类型参数，是因为 Microsoft C#团队认为开发人员很少需要将这些成员作为泛型使用。除此之外，为这些成员添加泛型支持的代价是相当高的，因为必须为语言设计足够的语法。例如，在代码中使用一个+操作符时，编译器可能要调用一个操作符重载方法。而在代码中，没有任何方法能伴随+操作符指定类型实参。\n\
  \n### 12.8 可验证性和约束\n\n编译泛型代码时，C#编译器会进行分析，确保代码适用于当前已有或将来可能定义的任何类型。看看下面这个方法：\n\n```csharp\n\
  private static Boolean MethodTakingAnyType<T>(T o) {\n    T temp = o;\n    Console.WriteLine(o.ToString());\n\
  \    Boolean b = temp.Equals(o);\n    return b;\n}\n```\n\n这个方法声明了 **T** 类型的临时变量(**temp**)。然后，方法执行两次变量赋值和几次方法调用。这个方法适用于任何类型。无论\
  \ **T** 是引用类型，是值类型或枚举类型，还是接口或委托类型，它都能工作。这个方法适用于当前存在的所有类型，也适用于将来可能定义的任何类型，因为所有类型都支持对\
  \ **Object** 类型的变量的赋值，也支持对 **Object** 类型定义的方法的调用(比如 **ToString** 和 **Equals**)。\n\
  \n再来看看下面这个方法：\n\n```csharp\nprivate static T Min<T>(T o1, T o2) {\n    if (o1.CompareTo(o2)\
  \ < 0) return o1;\n    return o2;\n}\n```\n\n**Min** 方法试图使用 **o1** 变量来调用 **CompareTo**\
  \ 方法。但是，许多类型都没有提供 **CompareTo** 方法，所以 C#编译器不能编译上述代码，它不能保证这个方法适用于所有类型。强行编译上述代码会报告消息：\n\
  \n**error CS0117: “T”不包含“CompareTo”的定义，并且找不到可接受类型为“T”的第一个参数的扩展方法“CompareTo”(是否缺少\
  \ using 指令或程序集引用?)。**\n\n所以从表面看，使用泛型似乎做不了太多事情。只能声明泛型类型的变量，执行变量赋值，再调用 **Object**\
  \ 定义的方法，如此而已！显然，假如泛型只能这么用，可以说它几乎没有任何用。幸好，编译器和 CLR 支持称为约束的机制，可通过它使泛型变得真正有用！\n\n约束的作用是限制能指定成泛型实参的类型数量。通过限制类型的数量，可以对那些类型执行更多操作。以下是新版本的\
  \ **Min** 方法，它指定了一个约束(加粗显示)：\n\n```csharp\npublic static T Min<T>(T o1, T o2) where\
  \ T : IComparable<T> {\n    if (o1.CompareTo(o2) < 0) return o1;\n    return o2;\n\
  }\n```\n\nC#的 **where** 关键字告诉编译器，为 **T** 指定的任何类型都必须实现同类型(T)的泛型 **IComparable** 接口。有了这个约束，就可以在方法中调用\
  \ **CompareTo**，因为已知 **IComparable&lt;T&gt;** 接口定义了 **CompareTo**。\n\n现在，当代码引用泛型类型或方法时，编译器要负责保证类型实参符合指定的约束。例如，假如编译以下代码：\n\
  \n```csharp\nprivate static void CallMin() {\n    Object o1 = \"Jeff\", o2 = \"\
  Richter\";\n    Object oMin = Min<Object>(o1, o2); // Error CS0311\n}\n```\n\n编译器会报告以下消息：\n\
  \n**error CS0311:** 不能将类型“object”用作泛型类型或方法“SomeType.Min&lt;T&gt;(T,T)”中的类型参数“T”。没有从“object”到“System.IComparable&lt;object&gt;”的隐式引用转换。\n\
  \n编译器报错是因为 **System.Object** 没有实现 **IComparable&lt;Object&gt;** 接口。事实上，**System.Object**\
  \ 没有实现任何接口。\n\n对约束及其工作方式有了一个基本的认识后，让我们更深入地研究一下它。约束可应用于泛型类型的类型参数，也可应用于泛型方法的类型参数(如\
  \ **Min** 方法所示)。CLR 不允许基于类型参数名称或约束来进行重载；只能基于元数(类型参数个数)对类型或方法进行重载。下例对此进行了演示：\n\n\
  ```csharp\n// 可定义以下类型\ninternal sealed class AType {}\ninternal sealed class AType<T>\
  \ {}\ninternal sealed class AType<T1, T2> {}\n\n// 错误：与没有约束的AType<T>冲突\ninternal\
  \ sealed class AType<T> where T : IComparable<T> {}\n\n// 错误：与AType<T1, T2>冲突\n\
  internal sealed class AType<T3, T4> {}\n\ninternal sealed class AnotherType {\n\
  \    // 可定义以下方法，参数个数不同：\n    private static void M() {}\n    private static void\
  \ M<T>() {}\n    private static void M<T1, T2>() {}\n\n    // 错误：与没有约束的M<T>冲突\n\
  \    private static void M<T>() where T : IComparable<T> {}\n\n    // 错误：与M<T1,\
  \ T2>冲突\n    private static void M<T3, T4>() {}\n}\n```\n\n重写虚泛型方法时，重写的方法必须指定相同数量的类型参数，而且这些类型参数会继承在基类方法上指定的约束。事实上，根本不允许为重写方法的类型参数指定任何约束。但类型参数的名称是可以改变的。类似地，实现接口方法时，方法必须指定与接口方法等量的类型参数，这些类型参数将继承由接口方法指定的约束。下例使用虚方法演示了这一规则：\n\
  \n```csharp\ninternal class Base {\n    public virtual void M<T1, T2>()\n      \
  \  where T1 : struct\n        where T2 : class {\n    }\n}\n\ninternal sealed class\
  \ Derived : Base {\n    public override void M<T3, T4>()\n        where T3 : EventArgs\
  \      // 错误\n        where T4 : class          // 错误\n}\n```\n\n```csharp\n   \
  \ { }\n}\n```\n\n试图编译上述代码，编译器会报告以下错误：\n\n`error CS0460：重写和显式接口实现方法的约束是从基方法继承的，因此不能直接指定这些约束。`\n\
  \n从 **Derived** 类的 **M<T3, T4>** 方法中移除两个 **where** 子句，代码就能正常编译了。注意，类型参数的名称可以更改，比如将\
  \ **T1** 改成 **T3**，将 **T2** 改成 **T4**；但约束不能更改（甚至不能指定）。\n\n下面讨论编译器/CLR 允许向类型参数应用的各种约束。可用一个主要约束、一个次要约束以及/或者一个构造器约束来约束类型参数。接下来的三个小节分别讨论这些约束。\n\
  \n#### 12.8.1 主要约束\n\n类型参数可以指定零个或者一个主要约束。主要约束可以是代表非密封类的一个引用类型。不能指定以下特殊引用类型：**System.Object**、**System.Array**、**System.Delegate**、**System.MulticastDelegate**、**System.ValueType**、**System.Enum**\
  \ 或者 **System.Void**。\n\n指定引用类型约束时，相当于向编译器承诺：一个指定的类型实参要么是与约束类型相同的类型，要么是从约束类型派生的类型。例如以下泛型类：\n\
  \n```csharp\ninternal sealed class PrimaryConstraintOfStream<T> where T : Stream\
  \ {\n    public void M(T stream) {\n        stream.Close();    //正确\n    }\n}\n\
  ```\n\n在这个类定义中，类型参数 T 设置了主要约束 **Stream**（在 **System.IO** 命名空间中定义）。这就告诉编译器，使用 **PrimaryConstraintOfStream**\
  \ 的代码在指定类型实参时，必须指定 **Stream** 或者从 **Stream** 派生的类型（比如 **FileStream**）。如果类型参数没有指定主要约束，就默认认为是\
  \ **System.Object**。但如果在源代码中显式指定 **System.Object**，C# 会报错：`error CS0702：约束不能是特殊类\"\
  object\"。`\n\n有两个特殊的主要约束：**class** 和 **struct**。其中，**class** 约束向编译器承诺类型实参是引用类型。任何类类型、接口类型、委托类型或者数组类型都满足这个约束。例如以下泛型类：\n\
  \n```csharp\ninternal sealed class PrimaryConstraintOfClass<T> where T : class {\n\
  \    public void M() {\n        T temp = null;    // 允许，因为 T 肯定是引用类型\n    }\n}\n\
  ```\n\n在这个例子中，将 **temp** 设为 **null** 是合法的，因为 T 已知是引用类型，而所有引用类型的变量都能设为 **null**。不对\
  \ T 进行约束，上述代码就通不过编译，因为 T 可能是值类型，而值类型的变量不能设为 **null**。\n\n**struct** 约束向编译器承诺类型实参是值类型。包括枚举在内的任何值类型都满足这个约束。但编译器和\
  \ CLR 将任何 **System.Nullable<T>** 值类型视为特殊类型，不满足这个 **struct** 约束。\n\n原因是 Nullable<T>\
  \ 类型将它的类型参数约束为 struct，而 CLR 希望禁止像 Nullable<Nullable<T>>这样的递归类型。可空类型将在第 19 章“可空值类型”讨论。\n\
  \n以下示例类使用 struct 约束来约束它的类型参数：\n\n```csharp\ninternal sealed class PrimaryConstraintOfStruct<T>\
  \ where T : struct {\n    public static T Factory() {\n        // 允许。因为所有值类型都隐式有一个公共无参构造器\n\
  \        return new T();\n    }\n}\n```\n\n这个例子中的 new T()是合法的，因为 T 已知是值类型，而所有值类型都隐式地有一个公共无参构造器。如果\
  \ T 不约束，约束为引用类型，或者约束为 class，上述代码将无法通过编译，因为有的引用类型没有公共无参构造器。\n\n#### 12.8.2 次要约束\n\
  \n类型参数可以指定零个或者多个次要约束，次要约束代表接口类型。这种约束向编译器承诺类型实参实现了接口。由于能指定多个接口约束，所以类型实参必须实现了所有接口约束(以及主要约束，如果有的话)。第\
  \ 13 章“接口”将详细讨论接口约束。\n\n还有一种次要约束称为类型参数约束，有时也称为裸类型约束。这种约束用得比接口约束少得多。它允许一个泛型类型或方法规定：指定的类型实参要么就是约束的类型，要么是约束的类型的派生类。一个类型参数可以指定零个或者多个类型参数约束。下面这个泛型方法演示了如何使用类型参数约束：\n\
  \n```csharp\nprivate static List<TBase> ConvertIList<T, TBase>(IList<T> list)\n\
  \    where T : TBase {\n    List<TBase> baseList = new List<TBase>(list.Count);\n\
  \    for (Int32 index = 0; index < list.Count; index++) {\n        baseList.Add(list[index]);\n\
  \    }\n    return baseList;\n}\n```\n\n**ConvertIList 方法**指定了两个类型参数，其中 **T** 参数由\
  \ **TBase** 类型参数约束。意味着不管为 **T** 指定什么类型实参，都必须兼容于为 **TBase** 指定的类型实参。下面这个方法演示了对 **ConvertIList**\
  \ 的合法调用和非法调用：\n\n```csharp\nprivate static void CallingConvertIList() {\n    //\
  \ 构造并初始化一个 List<String>(它实现了 IList<String>)\n    IList<String> ls = new List<String>();\n\
  \    ls.Add(\"A String\");\n\n    // 1. 将 IList<String>转换成一个 IList<Object>\n   \
  \ IList<Object> lo = ConvertIList<String, Object>(ls);\n\n    // 2. 将 IList<String>转换成一个\
  \ IList<IComparable>\n    IList<IComparable> lc = ConvertIList<String, IComparable>(ls);\n\
  \n    // 3. 将 IList<String>转换成一个 IList<IComparable<String>>\n    IList<IComparable<String>>\
  \ lcs =\n        ConvertIList<String, IComparable<String>>(ls);\n\n    // 4. 将 IList<String>\
  \ 转换成一个 IList<String>\n    IList<String> ls2 = ConvertIList<String, String>(ls);\n\
  \n    // 5. 将 IList<String> 转换成一个 IList<Exception>\n    IList<Exception> le = ConvertIList<String,\
  \ Exception>(ls); // 错误\n}\n```\n\n在对 ConvertIList 的第一个调用中，编译器检查 String 是否兼容于 Object。由于\
  \ String 从 Object 派生，所以第一个调用满足类型参数约束。在对 ConvertIList 的第二个调用中，编译器检查 String 是否兼容于\
  \ IComparable。由于 String 实现了 IComparable 接口，所以第二个调用满足类型参数约束。在对 ConvertIList 的第三个调用中，编译器检查\
  \ String 是否兼容于 IComparable<String>。由于 String 实现了 IComparable<String> 接口，所以第三个调用满足类型参数约束。在对\
  \ ConvertIList 的第 4 个调用中，编译器知道 String 兼容于它自己。在对 ConvertIList 的第 5 个调用中，编译器检查 String\
  \ 是否兼容于 Exception。由于 String 不兼容于 Exception，所以第 5 个调用不满足类型参数约束，编译器报告以下消息：\n\n```\n\
  error CS0311: 不能将类型“string”用作这里类型或方法“Program.ConvertIList<T, TBase>(System.Collections.Generic.IList<T>)”中的类型参数“T”。没有从“string”到“System.Exception”的隐式引用转换。\n\
  ```\n\n#### 12.8.3 构造器约束\n\n类型参数可指定零个或一个构造器约束，它向编译器承诺类型实参是实现了公共无参构造器的非抽象类型。注意，如果同时使用构造器约束和\
  \ struct 约束，C# 编译器会认为这是一个错误，因为这是多余的；所有值类型都隐式提供了公共无参构造器。以下示例使用构造器约束来约束它的类型参数：\n\n\
  ```csharp\ninternal sealed class ConstructorConstraint<T> where T : new() {\n  \
  \  public static T Factory()\n    {\n        // 允许，因为所有值类型都隐式有一个公共无参构造器。\n     \
  \   // 而如果指定的是引用类型，约束也要求它提供公共无参构造器\n        return new T();\n    }\n}\n```\n\n这个例子中的\
  \ new T() 是合法的，因为已知 T 是拥有公共无参构造器的类型。对所有值类型来说，这一点（拥有公共无参构造器）肯定成立。对于作为类型实参指定的任何引用类型，这一点也成立，因为构造器约束要求它必须成立。\n\
  \n开发人员有时想为类型参数指定一个构造器约束，并指定构造器要获取多个参数。目前，CLR（以及 C# 编译器）只支持无参构造器。Microsoft 认为这已经能满足几乎所有情况，我对此也表示同意。\n\
  \n#### 12.8.4 其他可验证性问题\n\n本节剩下的部分将讨论另外几个特殊的代码构造。由于可验证性问题，这些代码构造在和泛型共同使用时，可能产生不可预期的行为。另外，还讨论了如何利用约束使代码重新变得可以验证。\n\
  \n**1. 泛型类型变量的转型**\n\n将泛型类型的变量转型为其他类型是非法的，除非转型为与约束兼容的类型。\n\n```csharp\nprivate static\
  \ void CastingAGenericTypeVariable1<T>(T obj) {\n    Int32 x = (Int32) obj;    \
  \   //错误\n    String s = (String) obj;     //错误\n}\n```\n\n上述两行会造成编译器报错，因为 T 可能是任意类型，无法保证成功转型。为了修改上述代码使其能通过编译，可以先转型为\
  \ Object：\n\n```csharp\nprivate static void CastingAGenericTypeVariable2<T>(T obj)\
  \ {\n    Int32 x = (Int32) (Object) obj;     //无错误\n    String s = (String) (Object)\
  \ obj;   //无错误\n}\n```\n\n虽然代码现在能编译，但 CLR 仍有可能在运行时抛出 InvalidCastException 异常。\n\n\
  转型为引用类型时还可使用 C# as 操作符。下面对代码进行了修改，为 String 使用了 as 操作符（Int32 是值类型不能用）：\n\n```csharp\n\
  private static void CastingAGenericTypeVariable3<T>(T obj) {\n    String s = obj\
  \ as String; // 无错误\n}\n```\n\n**2. 将泛型类型变量设为默认值**\n\n将泛型类型变量设为 null 是非法的，除非将泛型类型约束成引用类型。\n\
  \n```csharp\nprivate static void SettingAGenericTypeVariableToNull<T>() {\n    T\
  \ temp = null;  // error CS0403 - 无法将 null 转换为类型参数\"T\",\n                    //\
  \ 因为它可能是不可为 null 的值类型。请考虑改用 default(T)\n}\n```\n\n由于未对 T 进行约束，所以它可能是值类型，而将值类型的变量设为\
  \ null 是不可能的。如果 T 被约束成引用类型，将 temp 设为 null 就是合法的，代码能顺利编译并运行。\n\nMicrosoft 的 C#团队认为有必要允许开发人员将变量设为它的默认值，并专门为此提供了\
  \ default 关键字：\n\n```csharp\nprivate static void SettingAGenericTypeVariableToDefaultValue<T>()\
  \ {\n    T temp = default(T); // 正确\n}\n```\n\n以上代码中的 default 关键字告诉 C#编译器和 CLR 的\
  \ JIT 编译器，如果 T 是引用类型，就将 temp 设为 null；如果是值类型，就将 temp 的所有位设为 0。\n\n**3. 将泛型类型变量与 null\
  \ 进行比较**\n\n无论泛型类型是否被约束，使用==或!=操作符将泛型类型变量与 null 进行比较都是合法的：\n\n```csharp\nprivate\
  \ static void ComparingAGenericTypeVariableWithNull<T>(T obj) {\n    if (obj ==\
  \ null) { /* 对于值类型，永远都不会执行 */ }\n}\n```\n\n由于 T 未进行约束，所以可能是引用类型或值类型。如果 T 是值类型，obj\
  \ 永远都不会为 null。你或许以为 C#编译器会报错。但 C#编译器并不报错；相反，它能顺利地编译代码。调用这个方法时，如果为类型参数传递值类型，那么 JIT\
  \ 编译器知道它永远都不会为 true，所以不会为 if 测试或者大括号内的代码生成本机代码。如果换用!=操作符，JIT 编译器不会为 if 测试生成代码(因为它肯定为\
  \ true)，但会为 if 大括号内的代码生成本机代码。\n\n顺便说一句，如果 T 被约束成 struct，C#编译器会报错。值类型的变量不能与 null\
  \ 进行比较，因为结果始终一样。\n\n**4. 两个泛型类型变量相互比较**\n\n如果泛型类型参数不能肯定是引用类型，对同一个泛型类型的两个变量进行比较是非法的：\n\
  \n```csharp\nprivate static void ComparingTwoGenericTypeVariables<T>(T o1, T o2)\
  \ {\n    if (o1 == o2) { } //错误\n}\n```\n\n在这个例子中，T 未进行约束。虽然两个引用类型的变量相互比较是合法的，但两个值类型的变量相互比较是非法的，除非值类型重载了==操作符。如果\
  \ T 被约束成 class，上述代码能通过编译。如果变量引用同一个对象，==操作符会返回 true。注意，如果 T 被约束成引用类型，而且该引用类型重载了 operator\
  \ 方法，那么编译器会在看到==操作符时生成对这个方法的调用。显然，所有这些讨论也适合!=操作符。\n\n写代码来比较基元值类型(Byte、Int32、Single、Decimal\
  \ 等)时，C#编译器知道如何生成正确的代码。然而，对于非基元值类型，C#编译器不知道如何生成代码来进行比较。所以，如果 ComparingTwoGenericTypeVariables\
  \ 方法的 T 被约束成 struct，编译器会报错。\n\n不允许将类型参数约束成具体的值类型，因为值类型隐式密封，不可能存在从值类型派生的类型。如果允许将类型参数约束成具体的值类型，那么泛型方法会被约束为只支持该具体类型，这还不如不要泛型呢！\n\
  \n**5. 泛型类型变量作为操作数使用**\n\n最后要注意，将操作符应用于泛型类型的操作数会出现大量问题。第 5 章讨论了 C#如何处理它的基元类型：Byte、Int16、Int32、Int64、Decimal\
  \ 等。我特别指出 C#知道如何解释应用于基元类型的操作符(比如+、-、*和/)。但不能将这些操作符应用于泛型类型的变量。编译器在编译时确定不了类型，所以不能向泛型类型的变量应用任何操作符。所以，不可能编写一个能处理任何数值数据类型的算法。下面是我想写的一个示例泛型方法：\n\
  \n```csharp\nprivate static T Sum<T>(T num) where T : struct {\n    T sum = default(T);\n\
  \    for (T n = default(T); n < num; n++)\n        sum += n;\n    return sum;\n\
  }\n```\n\n我千方百计想让这个方法通过编译。我将 T 约束成一个 struct，而且使用 default(T)将 sum 和 n 初始化为 0。但编译时得到以下错误：\n\
  \n- **error CS0019**：运算符 `\"<\"` 无法应用于 `\"T\"` 和 `\"T\"` 类型的操作数\n- **error CS0023**：运算符\
  \ `\"++\"` 无法应用于 `\"T\"` 类型的操作数\n- **error CS0019**：运算符 `\"+=\"` 无法应用于 `\"T\"` 和\
  \ `\"T\"` 类型的操作数\n\n这是 CLR 的泛型支持体系的一个严重限制，许多开发人员（尤其是科学、金融和数学领域的开发人员）对这个限制感到很失望。许多人尝试用各种技术来避开这一限制，其中包括反射（参见第\
  \ 23 章“程序集加载和反射”）、dynamic 基元类型（5.5 节）和操作符重载等。但所有这些技术都会严重损害性能或者影响代码的可读性。希望 Microsoft\
  \ 在 CLR 和编译器未来的版本中解决这个问题。\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_275_0.png)\n"
- "## 第13章 接口\n\n**本章内容：**\n\n- 类和接口继承\n- 定义接口\n- 继承接口\n- 关于调用接口方法的更多探讨\n- 隐式和显式接口方法实现（幕后发生的事情）\n\
  - 泛型接口\n- 泛型和接口约束\n- 实现多个具有相同方法名和签名的接口\n- 用显式接口方法实现来增强编译时类型安全性\n- 谨慎使用显式接口方法实现\n\
  - 设计：基类还是接口？\n\n对于多继承（multiple inheritance）的概念，许多程序员并不陌生，它是指一个类从两个或多个基类派生的能力。例如，假定\
  \ TransmitData 类的作用是发送数据，ReceiveData 类的作用是接收数据。现在要创建 SocketPort 类，作用是发送和接收数据。在这种情况下，你会希望\
  \ SocketPort 从 TransmitData 和 ReceiveData 这两个类继承。\n\n有的编程语言允许多继承，所以能从 TransmitData\
  \ 和 ReceiveData 这两个基类派生出 SocketPort。但 CLR 不支持多继承（因此所有托管编程语言也支持不了）。CLR 只是通过接口提供了“缩水版”的多继承。本章将讨论如何定义和使用接口，还要提供一些指导性原则，以便你判断何时应该使用接口而不是基类。\n\
  \n### 13.1 类和接口继承\n\nMicrosoft .NET Framework 提供了 System.Object 类，它定义了 4 个公共实例方法：ToString、Equals、GetHashCode\
  \ 和 GetType。该类是其他所有类的根或者说终极基类。换言之，所有类都继承了 Object 的 4 个实例方法。这还意味着只要代码能操作 Object 类的实例，就能操作任何类的实例。\n\
  \n由于 Microsoft 的开发团队已实现了 Object 的方法，所以从 Object 派生的任何类实际上都继承了这些方法。\n\n继承了以下内容。\n\n\
  - **方法签名**  \n  使代码认为自己是在操作 **Object** 类的实例，但实际操作的可能是其他类的实例。\n- **方法实现**  \n  使开发人员定义\
  \ **Object** 的派生类时不必手动实现 **Object** 的方法。\n\n在 CLR 中，任何类都肯定从一个（而且只能是一个）类派生，后者最终从\
  \ Object 派生。这个类称为基类。基类提供了一组方法签名和这些方法的实现。你定义的新类可在将来由其他开发人员用作基类——所有方法签名和方法实现都会由新的派生类继承。\n\
  \nCLR 还允许开发人员定义接口，它实际上是对一组方法签名进行了统一命名。这些方法不提供任何实现。类通过指定接口名称来继承接口，而且必须显式实现接口方法，否则\
  \ CLR 会认为此类型定义无效。当然，实现接口方法的过程可能比较烦琐，所以我在前面说接口继承是实现多继承的一种“缩水版”机制。C#编译器和 CLR 允许一个类继承多个接口。当然，继承的所有接口方法都必须实现。\n\
  \n我们知道，类继承的一个重要特点是，凡是能使用基类型实例的地方，都能使用派生类型的实例。类似地，接口继承的一个重点特点是，凡是能使用具名接口类型的实例的地方，都能使用实现了接口的一个类型的实例。下面先看看如何定义接口。\n\
  \n### 13.2 定义接口\n\n如前所述，接口对一组方法签名进行了统一命名。注意，接口还能定义事件、无参属性和有参属性（C#的索引器）。如前所述，所有这些东西本质上都是方法，它们只是语法上的简化。不过，接口不能定义任何构造器方法，也不能定义任何实例字段。\n\
  \n虽然 CLR 允许接口定义静态方法、静态字段、常量和静态构造器，但符合 CLS 标准的接口绝不允许，因为有的编程语言不能定义或访问它们。事实上，C#禁止接口定义任何一种这样的静态成员。\n\
  \nC#用 **interface** 关键字定义接口。要为接口指定名称和一组实例方法签名。下面是 FCL 中的几个接口的定义：\n\n```csharp\n\
  public interface IDisposable {\n    void Dispose();\n}\n\npublic interface IEnumerable\
  \ {\n    IEnumerator GetEnumerator();\n}\n\npublic interface IEnumerable<T> : IEnumerable\
  \ {\n    new IEnumerator<T> GetEnumerator();\n}\n\npublic interface ICollection<T>\
  \ : IEnumerable<T>, IEnumerable {\n    void Add(T item);\n    void Clear();\n  \
  \  Boolean Contains(T item);\n    void CopyTo(T[] array, Int32 arrayIndex);\n  \
  \  Boolean Remove(T item);\n    Int32 Count        { get; } // 只读属性\n    Boolean\
  \ IsReadOnly   { get; } // 只读属性\n}\n```\n\n在 CLR 看来，接口定义就是类型定义。也就是说，CLR 会为接口类型对象定义内部数据结构，同时可通过反射机制来查询接口类型的功能。和类型一样，接口可在文件范围中定义，也可嵌套在另一个类型中。定义接口类型时，可指定你希望的任何可见性/可访问性（**public、protected、internal**\
  \ 等）。\n\n根据约定，接口类型名称以大写字母 I 开头，目的是方便在源代码中辨认接口类型。CLR 支持泛型接口（前面几个例子已进行了演示）和接口中的泛型方法。本章稍后会讨论泛型接口的许多主功能。另外，第\
  \ 12 章“泛型”已全面讨论了泛型。\n\n接口定义可从另一个或多个接口“继承”。但“继承”应打上引号，因为它并不是严格的继承。接口继承的工作方式并不完全和类继承一样。我个人倾向于将接口继承看成是将其他接口的协定（contract）包括到新接口中。例如，**ICollection<T>**\
  \ 接口定义就包含了 **IEnumerable<T>** 和 **IEnumerable** 两个接口的协定。这有下面两层含义。\n\n- 继承 **ICollection<T>**\
  \ 接口的任何类型必须实现 **ICollection<T>**、**IEnumerable<T>** 和 **IEnumerable** 这三个接口所定义的方法。\n\
  - 任何代码在引用对象时，如果预计该对象的类型实现了 **ICollection<T>** 接口，可以认为该类型还实现了 **IEnumerable<T>**\
  \ 和 **IEnumerable** 接口。\n\n### 13.3 继承接口\n\n本节介绍如何定义实现了接口的类型，然后介绍如何创建该类型的实例，并用这个对象调用接口的方法。C#将这个过程变得很简单，但幕后发生的事情还是有点复杂。本章稍后会详细解释。\n\
  \n下面是在 MSCorLib.dll 中定义的 **System.IComparable<T>** 接口：\n\n```csharp\npublic interface\
  \ IComparable<in T> {\n    Int32 CompareTo(T other);\n}\n```\n\n以下代码展示了如何定义实现了该接口的类型，同时还展示了对两个\
  \ **Point** 对象进行比较的代码：\n\n```csharp\nusing System;\n\n// Point 从 System.Object 派生，并实现了\
  \ IComparable<T>\npublic sealed class Point : IComparable<Point> {\n    private\
  \ Int32 m_x, m_y;\n\n    public Point(Int32 x, Int32 y) {\n        m_x = x;\n```\n\
  \n```csharp\nm_y = y;\n}\n\n// 该方法为 Point 实现 IComparable<T>.CompareTo()\npublic\
  \ Int32 CompareTo(Point other) {\n    return Math.Sign(Math.Sqrt(m_x * m_x + m_y\
  \ * m_y)\n        - Math.Sqrt(other.m_x * other.m_x + other.m_y * other.m_y));\n\
  }\n\npublic override String ToString() {\n    return String.Format(\"({0}, {1})\"\
  , m_x, m_y);\n}\n}\n\npublic static class Program {\n    public static void Main()\
  \ {\n        Point[] points = new Point[] {\n            new Point(3, 3),\n    \
  \        new Point(1, 2),\n        };\n\n        // 下面调用由 Point 实现的 IComparable<T>\
  \ 的 CompareTo 方法\n        if (points[0].CompareTo(points[1]) > 0) {\n          \
  \  Point tempPoint = points[0];\n            points[0] = points[1];\n          \
  \  points[1] = tempPoint;\n        }\n        Console.WriteLine(\"Points from closest\
  \ to (0, 0) to farthest:\");\n        foreach (Point p in points)\n            Console.WriteLine(p);\n\
  \    }\n}\n```\n\nC#编译器要求将实现接口的方法（后文简称为“接口方法”）标记为 public。CLR 要求将接口方法标记为 virtual。不将方法显式标记为\
  \ virtual，编译器会将它们标记为 virtual 和 sealed；这会阻止派生类重写接口方法。将方法显式标记为 virtual，编译器就会将该方法标记为\
  \ virtual（并保持它的非密封状态），使派生类能重写它。\n\n派生类不能重写 sealed 的接口方法。但派生类可重新继承同一个接口，并为接口方法提供自己的实现。在对象上调用接口方法时，调用的是该方法在该对象的类型中的实现。下例对此进行了演示：\n\
  \n```csharp\nusing System;\n\npublic static class Program {\n    public static void\
  \ Main() {\n        /************************ 第一个例子 ************************/\n\
  \        Base b = new Base();\n\n        // 用 b 的类型来调用 Dispose，显示：\"Base's Dispose\"\
  \n        b.Dispose();\n\n        // 用 b 的对象的类型来调用 Dispose，显示：\"Base's Dispose\"\
  \n        ((IDisposable)b).Dispose();\n\n        /************************ 第二个例子\
  \ ************************/\n        Derived d = new Derived();\n\n        // 用\
  \ d 的类型来调用 Dispose，显示：\"Derived's Dispose\"\n        d.Dispose();\n```\n\n```csharp\n\
  \    // 用 d 的对象类型来调用 Dispose，显示：\"Derived's Dispose\"\n    ((IDisposable)d).Dispose();\n\
  \n    /*********************** 第三个例子 ***********************/\n    b = new Derived();\n\
  \n    // 用 b 的类型来调用 Dispose，显示：\"Base's Dispose\"\n    b.Dispose();\n\n    // 用\
  \ b 的对象的类型来调用 Dispose，显示：\"Derived's Dispose\"\n    ((IDisposable)b).Dispose();\n\
  \    }\n    }\n\n    // 这个类派生自 Object，它实现了 IDisposable\n    internal class Base\
  \ : IDisposable {\n        // 这个方法隐式密封，不能被重写\n        public void Dispose() {\n\
  \            Console.WriteLine(\"Base's Dispose\");\n        }\n    }\n\n    //\
  \ 这个类派生自 Base，它重新实现了 IDisposable\n    internal class Derived : Base, IDisposable\
  \ {\n        // 这个方法不能重写 Base 的 Dispose,\n        // 'new' 表明该方法重新实现了 IDisposable\
  \ 的 Dispose 方法\n        new public void Dispose() {\n            Console.WriteLine(\"\
  Derived's Dispose\");\n\n            // 注意，下面这行代码展示了如何调用基类的实现(如果需要的话)\n        \
  \    // base.Dispose();\n        }\n    }\n```\n\n### 13.4 关于调用接口方法的更多探讨\n\nFCL\
  \ 的 **System.String** 类型继承了 **System.Object** 的方法签名及其实现。此外，**String** 类型还实现了几个接口：**IComparable**、**ICloneable**、**IConvertible**、**IEnumerable**、**IComparable<String>**、**IEnumerable<Char>**\
  \ 和 **IEquatable<String>**。这意味着 **String** 类型不需要实现（或重写）其 **Object** 基类型提供的方法，但必须实现所有接口声明的方法。\n\
  \nCLR 允许定义接口类型的字段、参数或局部变量。使用接口类型的变量可以调用该接口定义的方法。此外，CLR 允许调用 **Object** 定义的方法，因为所有类都继承了\
  \ **Object** 的方法。以下代码对此进行了演示：\n\n```csharp\n// s 变量引用一个 String 对象\nString s = \"\
  Jeffrey\";\n// 可以使用 s 调用在 String、Object、IComparable、ICloneable、\n// IConvertible、IEnumerable\
  \ 中定义的任何方法\n\n// cloneable 变量引用同一个 String 对象\nICloneable cloneable = s;\n// 使用 cloneable\
  \ 只能调用 ICloneable 接口声明的\n// 任何方法（或 Object 定义的任何方法）\n```\n\n```csharp\n// comparable\
  \ 变量引用同一个 String 对象\nIComparable comparable = s;\n// 使用 comparable 只能调用 IComparable\
  \ 接口声明的\n// 任何方法（或 Object 定义的任何方法）\n\n// enumerable 变量引用同一个 String 对象\n// 可在运行时将变量从一个接口转换成另一个，只要\n\
  // 对象的类型实现了这两个接口\nIEnumerable enumerable = (IEnumerable) comparable;\n// 使用 enumerable\
  \ 只能调用 IEnumerable 接口声明的\n// 任何方法（或 Object 定义的任何方法）\n```\n\n在这段代码中，所有变量都引用同一个“Jeffrey”String\
  \ 对象。该对象在托管堆中；所以，使用其中任何变量时，调用的任何方法都会影响这个“Jeffrey”String 对象。不过，变量的类型规定了能对这个对象执行的操作。s\
  \ 变量是 String 类型，所以可以用 s 调用 String 类型定义的任何成员（比如 Length 属性）。还可用变量 s 调用从 Object 继承的任何方法（比如\
  \ GetType）。\n\ncloneable 变量是 ICloneable 接口类型。所以，使用 cloneable 变量可以调用该接口定义的 Clone\
  \ 方法。此外，可以调用 Object 定义的任何方法（比如 GetType），因为 CLR 知道所有类型都继承自 Object。不过，不能用 cloneable\
  \ 变量调用 String 本身定义的公共方法，也不能调用由 String 实现的其他任何接口的方法。类似地，使用 comparable 变量可以调用 CompareTo\
  \ 方法或 Object 定义的任何方法，但不能调用其他方法。\n\n> **重要提示** 和引用类型相似，值类型可实现零个或多个接口。但值类型的实例在转换为接口类型时必须装箱。这是由于接口变量是引用，必须指向堆上的对象，使\
  \ CLR 能检查对象的类型对象指针，从而判断对象的确切类型。调用已装箱值类型的接口方法时，CLR 会跟随对象的类型对象指针找到类型对象的方法表，从而调用正确的方法。\n\
  \n### 13.5 隐式和显式接口方法实现（幕后发生的事情）\n\n类型加载到 CLR 中时，会为该类型创建并初始化一个方法表（参见第 1 章“CLR 的执行模型”）。在这个方法表中，类型引入的每个新方法都有对应的记录项；另外，还为该类型继承的所有虚方法添加了记录项。继承的虚方法既有继承层次结构中的各个基类类型定义的，也有接口类型定义的。所以，对于下面这个简单的类型定义：\n\
  \n```csharp\ninternal sealed class SimpleType : IDisposable {\n    public void Dispose()\
  \ { Console.WriteLine(\"Dispose\"); }\n}\n```\n\n类型的方法表将包含以下方法的记录项。\n\n- **Object**（隐式继承的基类）定义的所有虚实例方法。\n\
  \n\n\n- **SimpleType** 实现了 **IDisposable**（继承的接口）定义的所有接口方法。本例只有一个方法，即 **Dispose**，因为\
  \ **IDisposable** 接口只定义了这个方法。\n- **SimpleType** 引入的新方法 **Dispose**。\n\n为简化编程，C#\
  \ 编译器假定 **SimpleType** 引入的 **Dispose** 方法是对 **IDisposable** 的 **Dispose** 方法的实现。之所以这样假定，是由于\
  \ **Dispose** 方法的可访问性是 **public**，而接口方法的签名和新引入的方法完全一致。也就是说，两个方法具有相同的参数和返回类型。顺便说一句，如果新的\
  \ **Dispose** 方法被标记为 **virtual**，C# 编译器仍然认为该方法匹配接口方法。\n\nC# 编译器将新方法和接口方法匹配起来之后，会生成元数据，指明\
  \ **SimpleType** 类型的方法表中的两个记录项应引用同一个实现。为了更清楚地理解这一点，下面的代码演示了如何调用类的公共 **Dispose**\
  \ 方法以及如何调用 **IDisposable** 的 **Dispose** 方法在类中的实现：\n\n```csharp\npublic sealed class\
  \ Program {\n    public static void Main() {\n        SimpleType st = new SimpleType();\n\
  \n        // 调用公共 Dispose 方法实现\n        st.Dispose();\n\n        // 调用 IDisposable\
  \ 的 Dispose 方法的实现\n        IDisposable d = st;\n        d.Dispose();\n    }\n}\n\
  ```\n\n在第一个 **Dispose** 方法调用中，调用的是 **SimpleType** 定义的 **Dispose** 方法。然后定义 **IDisposable**\
  \ 接口类型的变量 d，它引用 **SimpleType** 对象 st。调用 d.Dispose() 时，调用的是 **IDisposable** 接口的 **Dispose**\
  \ 方法。由于 C# 要求公共 **Dispose** 方法同时是 **IDisposable** 的 **Dispose** 方法的实现，所以会执行相同的代码。在这个例子中，两个调用你看不出任何区别。输出结果如下所示：\n\
  \n```text\nDispose\nDispose\n```\n\n现在重写 **SimpleType**，以便于看出区别：\n\n```csharp\n\
  internal sealed class SimpleType : IDisposable {\n    public void Dispose() { Console.WriteLine(\"\
  public Dispose\"); }\n    void IDisposable.Dispose() { Console.WriteLine(\"IDisposable\
  \ Dispose\"); }\n}\n```\n\n在不改动前面的 **Main** 方法的前提下，重新编译并再次运行程序，输出结果如下所示：\n\n```text\n\
  public Dispose\nIDisposable Dispose\n```\n\n在 C# 中，将定义方法的那个接口的名称作为方法名前缀（例如 **IDisposable.Dispose**），就会创建显式接口方法实现（Explicit\
  \ Interface Method Implementation，EIM①）。注意，C# 中不允许定义显式接口方法时指定可访问性（比如 **public**\
  \ 或 **private**）。但是，编译器生成方法的元数据时，可访问性会自动设为 **private**，防止其他代码在使用类的实例时直接调用接口方法。只有通过接口类型的变量才能调用接口方法。\n\
  \n① 请记住 EIM 的意思，本书后面会大量使用这个缩写词。——译注\n\n还要注意，EIM 方法不能标记为 **virtual**，所以不能被重写。这是由于\
  \ EIM 方法并非真的是类型的对象模型的一部分，它只是将接口（一组行为或方法）和类型连接起来，同时避免公开行为/方法。如果觉得这一点不好理解，那么你的感觉没有错！它就是不太好理解。本章稍后会介绍\
  \ EIM 有用的一些场合。\n\n### 13.6 泛型接口\n\nC# 和 CLR 所支持的泛型接口为开发人员提供了许多非常出色的功能。本节要讨论泛型接口提供的一些好处。\n\
  \n首先，泛型接口提供了出色的编译时类型安全性。有的接口（比如非泛型 **IComparable** 接口）定义的方法使用了 **Object** 参数或 **Object**\
  \ 返回类型。在代码中调用这些接口方法时，可传递对任何类型的实例的引用。但这通常不是我们期望的。下面的代码对此进行了演示：\n\n```csharp\nprivate\
  \ void SomeMethod1() {\n    Int32 x = 1, y = 2;\n    IComparable c = x;\n\n    //\
  \ CompareTo 期待 Object；传递 y(一个 Int32)没有问题\n    c.CompareTo(y);  // y 在这里装箱\n\n  \
  \  // CompareTo 期待 Object，传递\"2\" (一个 String)可以编译，\n    // 但在运行时抛出 ArgumentException\
  \ 异常\n    c.CompareTo(\"2\");\n}\n```\n\n接口方法理想情况下应该使用强类型。这正是 FCL 为什么包含泛型 **IComparable<in\
  \ T>** 接口的原因。下面修改代码来使用泛型接口：\n\n```csharp\nprivate void SomeMethod2() {\n    Int32\
  \ x = 1, y = 2;\n    IComparable<Int32> c = x;\n\n    // CompareTo 期待 Int32，传递 y(一个\
  \ Int32)没有问题\n    c.CompareTo(y);   // y 在这里不装箱\n\n    // CompareTo 期待 Int32，传递\"\
  2\"(一个 String)造成编译错误，\n    // 指出 String 不能被转换为 Int32\n    c.CompareTo(\"2\"); //\
  \ 错误\n}\n```\n\n泛型接口的第二个好处在于，处理值类型时装箱次数会少很多。在 **SomeMethod1** 中，非泛型 **IComparable**\
  \ 接口的 **CompareTo** 方法期待获取一个 **Object**；传递 y(Int32 值类型)会造成 y 中的值装箱。但在 **SomeMethod2**\
  \ 中，泛型 **IComparable<in T>** 接口的 **CompareTo** 方法本来期待的就是 **Int32**；y 以传值的方式传递，无需装箱。\n\
  \n> 注意　FCL 定义了 IComparable、ICollection、IList 和 IDictionary 等接口的泛型和非泛型版本。定义类型时要实现其中任何接口，一般应实现泛型版本。FCL\
  \ 保留非泛型版本是为了向后兼容，照顾在 .NET Framework 支持泛型之前写的代码。非泛型版本还允许用户以较常规的、类型较不安全（more general,\
  \ less type-safe）的方式处理数据。\n>\n> 有的泛型接口继承了非泛型版本，所以必须同时实现接口的泛型和非泛型版本。例如，泛型 IEnumerable<out\
  \ T> 接口继承了非泛型 IEnumerable 接口，所以实现 IEnumerable<out T> 就必须实现 IEnumerable。\n>\n> 和其他代码集成时，有时必须实现非泛型接口，因为接口的泛型版本并不存在。这时，如果接口的任何方法获取或返回\
  \ Object，就会失去编译时的类型安全性，而且值类型将发生装箱。可利用本章 13.9 节“用显式接口方法实现来增强编译时类型安全性”介绍的技术来缓解该问题。\n\
  \n泛型接口的第三个好处在于，类可以实现同一个接口若干次，只要每次使用不同的类型参数。以下代码对这个好处进行了演示：\n\n```csharp\nusing System;\n\
  \n// 该类实现泛型 IComparable<T> 接口两次\npublic sealed class Number : IComparable<Int32>,\
  \ IComparable<String> {\n    private Int32 m_val = 5;\n\n    // 该方法实现 IComparable<Int32>\
  \ 的 CompareTo 方法\n    public Int32 CompareTo(Int32 n) {\n        return m_val.CompareTo(n);\n\
  \    }\n\n    // 该方法实现 IComparable<String> 的 CompareTo 方法\n    public Int32 CompareTo(String\
  \ s) {\n        return m_val.CompareTo(Int32.Parse(s));\n    }\n}\n\npublic static\
  \ class Program {\n    public static void Main() {\n        Number n = new Number();\n\
  \n        // 将 n 中的值和一个 Int32(5) 比较\n        IComparable<Int32> cInt32 = n;\n  \
  \      Int32 result = cInt32.CompareTo(5);\n\n        // 将 n 中的值和一个 String(\"5\"\
  ) 比较\n        IComparable<String> cString = n;\n        result = cString.CompareTo(\"\
  5\");\n    }\n}\n```\n\n接口的泛型类型参数可标记为逆变和协变，为泛型接口的使用提供更大的灵活性。欲知协变和逆变的详情，请参见 12.5\
  \ 节“委托和接口的逆变和协变泛型实参”。\n\n### 13.7 泛型和接口约束\n\n上一节讨论了泛型接口的好处。本节要讨论将泛型类型参数约束为接口的好处。\n\
  \n第一个好处在于，可将泛型类型参数约束为多个接口。这样一来，传递的参数的类型必须实现全部接口约束。例如：\n\n```csharp\npublic static\
  \ class SomeType {\n    private static void Test() {\n        Int32 x = 5;\n   \
  \     Guid g = new Guid();\n\n        // 对 M 的调用能通过编译，因为 Int32 实现了\n        // IComparable\
  \ 和 IConvertible\n        M(x);\n\n        // 这个 M 调用导致编译错误，因为 Guid 虽然\n       \
  \ // 实现了 IComparable，但没有实现 IConvertible\n        M(g);\n    }\n\n    // M 的类型参数\
  \ T 被约束为只支持同时实现了\n    // IComparable 和 IConvertible 接口的类型\n    private static Int32\
  \ M<T>(T t) where T : IComparable, IConvertible {\n        ...\n    }\n}\n```\n\n\
  这真的很“酷”！定义方法参数时，参数的类型规定了传递的实参必须是该类型或者它的派生类型。如果参数的类型是接口，那么实参可以是任意类类型，只要该类实现了接口。使用多个接口约束，实际是表示向方法传递的实参必须实现多个接口。\n\
  \n实际上，如果将 T 约束为一个类和两个接口，就表示传递的实参类型必须是指定的基类（或者它的派生类），而且必须实现两个接口。这种灵活性使方法能细致地约束调用者能传递的内容。调用者不满足这些约束，就会产生编译错误。\n\
  \n接口约束的第二个好处是传递值类型的实例时减少装箱。上述代码向 M 方法传递了 x（值类型 Int32 的实例）。x 传给 M 方法时不会发生装箱。如果 M\
  \ 方法内部的代码调用 t.CompareTo(⋯)，这个调用本身也不会引发装箱（但传给 CompareTo 的实参可能发生装箱）。\n\n另一方面，如果 M\
  \ 方法像下面这样声明：\n\n```csharp\nprivate static Int32 M(IComparable t) {\n    ...\n}\n\
  ```\n\n那么 x 要传给 M 就必须装箱。\n\nC# 编译器为接口约束生成特殊 IL 指令，导致直接在值类型上调用接口方法而不装箱。不用接口约束便没有其他办法让\
  \ C# 编译器生成这些 IL 指令，如此一来，在值类型上调用接口方法总是发生装箱。一个例外是如果值类型实现了一个接口方法，在值类型的实例上调用这个方法不会造成值类型的实例装箱。\n\
  \n### 13.8 实现多个具有相同方法名和签名的接口\n\n定义实现多个接口的类型时，这些接口可能定义了具有相同名称和签名的方法。例如，假定有以下两个接口：\n\
  \n```csharp\npublic interface IWindow {\n    Object GetMenu();\n}\n\npublic interface\
  \ IRestaurant {\n    Object GetMenu();\n}\n```\n\n要定义实现这两个接口的类型，必须使用“显式接口方法实现”来实现这个类型的成员，如下所示：\n\
  \n```csharp\n// 这个类型派生自 System.Object，\n// 并实现了 IWindow 和 IRestaurant 接口\npublic\
  \ sealed class MarioPizzeria : IWindow, IRestaurant {\n\n    // 这是 IWindow 的 GetMenu\
  \ 方法的实现\n    Object IWindow.GetMenu() { ... }\n\n    // 这是 IRestaurant 的 GetMenu\
  \ 方法的实现\n    Object IRestaurant.GetMenu() { ... }\n\n    // 这个 GetMenu 方法是可选的，与接口无关\n\
  \    public Object GetMenu() { ... }\n}\n```\n\n由于这个类型必须实现多个接口的 **GetMenu** 方法，所以要告诉\
  \ C# 编译器每个 **GetMenu** 方法对应的是哪个接口的实现。\n\n代码在使用 **MarioPizzeria** 对象时必须将其转换为具体的接口才能调用所需的方法。例如：\n\
  \n```csharp\nMarioPizzeria mp = new MarioPizzeria();\n\n// 这行代码调用 MarioPizzeria\
  \ 的公共 GetMenu 方法\nmp.GetMenu();\n\n// 以下代码调用 MarioPizzeria 的 IWindow.GetMenu 方法\n\
  IWindow window = mp;\nwindow.GetMenu();\n\n// 以下代码调用 MarioPizzeria 的 IRestaurant.GetMenu\
  \ 方法\nIRestaurant restaurant = mp;\nrestaurant.GetMenu();\n```\n\n### 13.9 用显式接口方法实现来增强编译时类型安全性\n\
  \n接口很好用，它们定义了在类型之间进行沟通的标准方式。前面曾讨论了泛型接口，讨论了它们如何增强编译时的类型安全性和减少装箱操作。遗憾的是，有时由于不存在泛型版本，所以仍需实现非泛型接口。接口的任何方法接受\
  \ System.Object 类型的参数或返回 System.Object 类型的值，就会失去编译时的类型安全性，装箱也会发生。本节将介绍如何用“显式接口方法实现”（EIM）在某种程度上改善这个局面。\n\
  \n下面是极其常用的 IComparable 接口：\n\n```csharp\npublic interface IComparable {\n    Int32\
  \ CompareTo(Object other);\n}\n```\n\n该接口定义了接受一个 System.Object 参数的方法。可以像下面这样定义实现了该接口的类型：\n\
  \n```csharp\ninternal struct SomeValueType : IComparable {\n    private Int32 m_x;\n\
  \    public SomeValueType(Int32 x) { m_x = x; }\n    public Int32 CompareTo(Object\
  \ other) {\n        return(m_x - ((SomeValueType) other).m_x);\n    }\n}\n```\n\n\
  可用 SomeValueType 写下面这样的代码：\n\n```csharp\npublic static void Main() {\n    SomeValueType\
  \ v = new SomeValueType(0);\n    Object o = new Object();\n    Int32 n = v.CompareTo(v);\
  \   // 不希望的装箱操作\n    n = v.CompareTo(o);         // InvalidCastException 异常\n}\n\
  ```\n\n上述代码存在两个问题。\n\n- 不希望的装箱操作\n  v 作为实参传给 CompareTo 方法时必须装箱，因为 CompareTo 期待的是一个\
  \ Object。\n- 缺乏类型安全性\n  代码能通过编译，但 CompareTo 方法内部试图将 o 转换为 SomeValueType 时抛出 InvalidCastException\
  \ 异常。\n\n这两个问题都可以用 EIM 解决。下面是 SomeValueType 的修改版本，这次添加了一个 EIM：\n\n```csharp\ninternal\
  \ struct SomeValueType : IComparable {\n    private Int32 m_x;\n    public SomeValueType(Int32\
  \ x) { m_x = x; }\n\n    public Int32 CompareTo(SomeValueType other) {\n       \
  \ return(m_x - other.m_x);\n    }\n}\n```\n\n```csharp\n// 注意以下代码没有指定 public/private\
  \ 可访问性\nInt32 IComparable.CompareTo(Object other) {\n    return CompareTo((SomeValueType)\
  \ other);\n}\n```\n\n注意新版本的几处改动。现在有两个 **CompareTo** 方法。第一个 **CompareTo** 方法不是获取一个\
  \ **Object** 作为参数，而是获取一个 **SomeValueType**。这样就不必将 **other** 类型转换为 **SomeValueType**\
  \ 了，所以用于强制类型转换的代码被去掉了。修改了第一个 **CompareTo** 方法使其变得类型安全之后，**SomeValueType** 还必须实现一个\
  \ **CompareTo** 方法来满足 **IComparable** 的协定。这正是第二个 **IComparable.CompareTo** 方法的作用，它是一个\
  \ EIMI。\n\n经过这两处改动之后，就获得了编译时的类型安全性，而且不会发生装箱：\n\n```csharp\npublic static void Main()\
  \ {\n    SomeValueType v = new SomeValueType(0);\n    Object o = new Object();\n\
  \    Int32 n = v.CompareTo(v);    // 不发生装箱\n    n = v.CompareTo(o);          //\
  \ 编译时错误\n}\n```\n\n不过，定义接口类型的变量会再次失去编译时的类型安全性，而且会再次发生装箱：\n\n```csharp\npublic static\
  \ void Main() {\n    SomeValueType v = new SomeValueType(0);\n    IComparable c\
  \ = v;          // 装箱!\n\n    Object o = new Object();\n    Int32 n = c.CompareTo(v);\
  \    // 不希望的装箱操作\n    n = c.CompareTo(o);          // InvalidCastException 异常\n\
  }\n```\n\n事实上，如本章前面所述，将值类型的实例转换为接口类型时，CLR 必须对值类型的实例进行装箱。因此，前面的 **Main** 方法中会发生两次装箱。\n\
  \n实现 **IConvertible**、**ICollection**、**IList** 和 **IDictionary** 等接口的 EIMI 很有用。可利用它为这些接口的方法创建类型安全的版本，并减少值类型的装箱。\n\
  \n### 13.10 谨慎使用显式接口方法实现\n\n使用 EIMI 也可能造成一些严重后果，所以应该尽量避免使用 EIMI。幸好，泛型接口可帮助我们在大多数时候避免使用\
  \ EIMI。但有时（比如实现具有相同名称和签名的两个接口方法时）仍然需要它们。EIMI 最主要的问题如下。\n\n- 没有文档解释类型具体如何实现一个 **EIMI**\
  \ 方法，也没有 **Microsoft Visual Studio** “智能感知”支持。\n- 值类型的实例在转换成接口时装箱。\n- **EIMI** 不能由派生类型调用。\n\
  \n下面详细讨论这些问题。\n\n文档在列出一个类型的方法时，会列出显式接口方法实现(EIMI)，但没有提供类型特有的帮助，只有接口方法的常规性帮助。例如，Int32\
  \ 类型的文档只是说它实现了 IConvertible 接口的所有方法。能做到这一步已经不错，它使开发人员知道存在这些方法。但也使开发人员感到困惑，因为不能直接在一个\
  \ Int32 上调用一个 IConvertible 方法。例如，下面的代码无法编译：\n\n```csharp\npublic static void Main()\
  \ {\n    Int32 x = 5;\n    Single s = x.ToSingle(null);   // 试图调用一个 IConvertible\
  \ 方法\n}\n```\n\n编译这个方法时，C#编译器会报告以下消息：error CS0117: \"int\"不包含\"ToSingle\"的定义。这个错误信息使开发人员感到困惑，因为它明显是在说\
  \ Int32 类型没有定义 ToSingle 方法，但实际上它定义了。\n\n要在一个 Int32 上调用 ToSingle，首先必须将其转换为 IConvertible，如下所示：\n\
  \n```csharp\npublic static void Main() {\n    Int32 x = 5;\n    Single s = ((IConvertible)\
  \ x).ToSingle(null);\n}\n```\n\n对类型转换的要求不明确，而许多开发人员自己看不出来问题出在哪里。还有一个更让人烦恼的问题：Int32\
  \ 值类型转换为 IConvertible 会发生装箱，既浪费内存，又损害性能。这是本书开头提到的 EIMI 存在的第二个问题。\n\nEIMI 的第三个也可能是最大的问题是，它们不能被派生类调用。下面是一个例子：\n\
  \n```csharp\ninternal class Base : IComparable {\n\n    // 显式接口方法实现\n    Int32 IComparable.CompareTo(Object\
  \ o) {\n        Console.WriteLine(\"Base's CompareTo\");\n        return 0;\n  \
  \  }\n}\n\ninternal sealed class Derived : Base, IComparable {\n\n    // 一个公共方法，也是接口的实现\n\
  \    public Int32 CompareTo(Object o) {\n        Console.WriteLine(\"Derived's CompareTo\"\
  );\n\n        // 试图调用基类的 EIMI 导致编译错误：\n        // error CS0117: \"Base\" 不包含 \"\
  CompareTo\" 的定义\n        base.CompareTo(o);\n        return 0;\n    }\n}\n```\n\n\
  在 Derived 的 CompareTo 方法中调用 base.CompareTo 导致 C#编译器报错。现在的问题是，Base 类没有提供一个可供调用的公共或受保护\
  \ CompareTo 方法，它提供的是一个只能用 IComparable 类型的变量来调用的 CompareTo 方法。可将 Derived 的 CompareTo\
  \ 方\n\n### 13.11 设计：基类还是接口\n\n经常有人问：“应该设计基类还是接口？”这个问题不能一概而论，以下设计规范或许能帮你理清思路。\n\n\
  - **IS-A 对比 CAN-DO 关系①**\n  类型只能继承一个实现。如果派生类型和基类型建立不起 IS-A 关系，就不用基类而用接口。接口意味着 CAN-DO\
  \ 关系。如果多种对象类型都“能”做某事，就为它们创建接口。例如，一个类型能将自己的实例转换为另一个类型(**IConvertible**)，一个类型能序列化自己的实例(**ISerializable**)。注意，值类型必须从\
  \ **System.ValueType** 派生，所以不能从一个任意的基类派生。这时必须使用 CAN-DO 关系并定义接口。\n\n  ① IS-A 是指“属于”，例如，汽车属于交通工具；CAN-DO\
  \ 是指“能做某事”，例如，一个类型能将自己的实例转换为另一个类型。——译注\n\n- **易用性**\n  对于开发人员，定义从基类派生的新类型通常比实现接口的所有方法容易得多。基类型可提供大量功能，所以派生类型可能只需稍做改动。而提供接口的话，新类型必须实现所有成员。\n\
  \n- **一致性实现**\n  无论接口协定(contract)订立得有多好，都无法保证所有人百分之百正确实现它。事实上，COM 颇受该问题之累，导致有的 COM\
  \ 对象只能正常用于 Microsoft Office Word 或 Microsoft Internet Explorer。而如果为基类型提供良好的默认实现，那么一开始得到的就是能正常工作并经过良好测试的类型。以后根据需要修改就可以了。\n\
  \n- **版本控制**\n  向基类型添加一个方法，派生类型将继承新方法。一开始使用的就是一个能正常工作的类型，用户的源代码甚至不需要重新编译。而向接口添加新成员，会强迫接口的继承者更改其源代码并重新编译。\n\
  \nFCL 中涉及数据流处理(streaming data)的类采用的是实现继承方案②。**System.IO.Stream** 是抽象基类，提供了包括 **Read**\
  \ 和 **Write** 在内的一组方法。其他类(**System.IO.FileStream**, **System.IO.MemoryStream** 和\
  \ **System.Net.Sockets.NetworkStream**)都从 **Stream** 派生。在这三个类中，每一个和 **Stream** 类都是\
  \ IS-A 关系，这使具体类③的实现变得更容易。例如，派生类只需实现同步 I/O 操作，异步 I/O 操作已经从 **Stream** 基类继承了。\n\n\
  必须承认，为流类(XXXStream)选择继承的理由不是特别充分，因为 **Stream** 基类实际只提供了很少的实现。那么就以 Microsoft Windows\
  \ 窗体控件类为例好了。**Button**，**CheckBox**，**ListBox** 和其他所有窗体控件都从 **System.Windows.Forms.Control**\
  \ 派生。**Control** 实现了大量代码，各种控件类简单继承一下即可正常工作。这时选择继承应该没有疑问了吧？\n\n相反，Microsoft 采用基于接口的方式来设计\
  \ FCL 中的集合。**System.Collections.Generic** 命名空间定义了几个与集合有关的接口：**IEnumerable<out T>**，**ICollection<T>**，**IList<T>**和\
  \ **IDictionary<TKey, TValue>**。然后，Microsoft 提供了大量类来实现这些接口组合，包括 **List<T>**，**Dictionary<TKey,\
  \ TValue>**，**Queue<T>**和 **Stack<T>**等等。设计者在类和接口之间选择 CAN-DO 关系，因为不同集合类的实现迥然有异。换句话说，**List<T>**，**Dictionary<TKey,\
  \ TValue>**和 **Queue<T>**之间没有多少能共享的代码。\n\n不过，这些集合类提供的操作相当一致。例如，都维护了一组可枚举的元素，而且都允许添加和删除元素。假定有一个对象引用，对象的类型实现了\
  \ **IList<T>**接口，就可在不需要知道集合准确类型的前提下插入、删除和搜索元素。这个机制太强大了！\n\n最后要说的是，两件事情实际能同时做：定义接口，同时提供实现该接口的基类。例如，FCL\
  \ 定义了 **IComparer<in T>**接口，任何类型都可选择实现该接口。此外，FCL 提供了抽象基类 **Comparer<T>**，它实现了该接口，同时为非泛型\
  \ **IComparer** 的 **Compare** 方法提供了默认实现。接口定义和基类同时存在带来了很大的灵活性，开发人员可根据需要选择其中一个。\n\n\
  ② 即继承基类的实现。——译注\n③ 对应于“抽象类”。——译注\n"
