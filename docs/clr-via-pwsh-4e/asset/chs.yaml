  ```\n\n幸好 ILDasm 处理了元数据表，恰当合并了信息，避免我们分析原始表。例如，可以看到当 ILDasm 显示一个 TypeDef 记录项时，会在第一个\
  \ TypeRef 项之前显示对应的成员定义信息。\n\n不用完全理解上面显示的一切。重点是 Program.exe 包含名为 Program 的 TypeDef。Program\
  \ 是公共密封类，从 System.Object 派生（System.Object 是引用的另一个程序集中的类型）。Program 类型还定义了两个方法：Main\
  \ 和 .ctor（构造器）。\n\nMain 是公共静态方法，用 IL 代码实现（有的方法可能用本机 CPU 代码实现，比如 x86 代码）。Main 返回类型是\
  \ void，无参。构造器（名称始终是 .ctor）是公共方法，也用 IL 代码实现。构造器返回类型是 void，无参，有一个 this 指针（指向调用方法时构造对象的内存）。\n\
  \n强烈建议多试验一下 ILDasm。它提供了丰富的信息。你对自己看到的东西理解得越多，对 CLR 及其功能的理解就越好。本书后面会大量地用到 ILDasm。\n\
  \n为增加趣味性，来看看 Program.exe 程序集的统计信息。在 ILDasm 中选择“视图”|“统计”，会显示以下信息：\n\n```text\nFile\
  \ size : 3584\n  PE header size : 512 (496 used) (14.29%)\n  PE additional info\
  \ : 1411 (39.37%)\n  Num.of PE sections : 3\n  CLR header size : 72 ( 2.01%)\n \
  \ CLR meta-data size : 612 (17.08%)\n  CLR additional info : 0 ( 0.00%)\n  CLR method\
  \ headers : 2 ( 0.06%)\n  Managed code : 20 ( 0.56%)\n  Data : 2048 (57.14%)\n \
  \ Unaccounted : -1093 (-30.50%)\n\nNum.of PE sections : 3\n  .text - 1024\n  .rsrc\
  \ - 1536\n  .reloc - 512\n\nCLR meta-data size : 612\n  Module - 1 (10 bytes)\n\
  \  TypeDef - 2 (28 bytes) 0 interfaces, 0 explicit layout\n  TypeRef - 4 (24 bytes)\n\
  \  MethodDef - 2 (28 bytes) 0 abstract, 0 native, 2 bodies\n  MemberRef - 4 (24\
  \ bytes)\n  CustomAttribute- 2 (12 bytes)\n  Assembly - 1 (22 bytes)\n  AssemblyRef\
  \ - 1 (20 bytes)\n  Strings - 184 bytes\n  Blobs - 68 bytes\n  UserStrings - 8 bytes\n\
  \  Guids - 16 bytes\n  Uncategorized - 168 bytes\n\nCLR method headers : 2\n  Num.of\
  \ method bodies - 2\n  Num.of fat headers - 0\n  Num.of tiny headers - 2\n\nManaged\
  \ code : 20\n  Ave method size - 10\n```\n\n从中可以看出文件大小（字节数）以及文件各部分大小（字节数和百分比）。对于这个如此小的\
  \ Program.exe 应用程序，PE 头和元数据占了相当大的比重。事实上，IL 代码只有区区 20 个字节。当然，随着应用程序规模的增大，它会重用大多数类型以及对其他类型和程序集的引用，元数据和头信息在整个文件中的比重越来越小。\n\
  \n> **注意** 顺便说一下，ILDasm.exe 的一个 bug 会影响显示的文件长度。尤其不要相信 Unaccounted 信息。\n\n## 2.4\
  \ 将模块合并成程序集\n\n上一节讨论的 Program.exe 并非只是含有元数据的 PE 文件，它还是程序集（assembly）。程序集是一个或多个类型定义文件及资源文件的集合。在程序集的所有文件中，有一个文件容纳了清单（manifest）。清单也是一个元数据表集合，表中主要包含作为程序集组成部分的那些文件的名称。此外，还描述了程序集的版本、语言文化、发布者、公开导出的类型以及构成程序集的所有文件。\n\
  \nCLR 操作的是程序集。换言之，CLR 总是首先加载包含“清单”元数据表的文件，再根据“清单”来获取程序集中的其他文件的名称。下面列出了程序集的重要特点。\n\
  \n- 程序集定义了可重用的类型。\n- 程序集用一个版本号标记。\n- 程序集可以关联安全信息。\n\n除了包含清单元数据表的文件，程序集其他单独的文件并不具备上述特点。\n\
  \n类型为了顺利地进行打包、版本控制、安全保护以及使用，必须放在作为程序集一部分的模块中。程序集大多数时候只有一个文件，就像前面的 Program.exe 那样。然而，程序集还可以由多个文件构成：一些是含有元数据的\
  \ PE 文件，另一些是 .gif 或 .jpg 这样的资源文件。为便于理解，可将程序集视为一个逻辑 EXE 或 DLL。\n\nMicrosoft 为什么引入“程序集”的概念？这是因为使用程序集，可重用类型的逻辑表示与物理表示就可以分开。例如，程序集可能包含多个类型。可以将常用类型放到一个文件中，不常用类型放到另一个文件中。如果程序集要从\
  \ Internet 下载并部署，那么对于含有不常用类型的文件，假如客户端永远不使用那些类型，该文件就永远不会下载到客户端。例如，擅长制作 UI 控件的一家独立软件开发商（Independent\
  \ Software Vendor，ISV）可选择在单独的模块中实现 Active Accessibility 类型（以满足 Microsoft 徽标认证授权要求）①。这样一来，只有需要额外“无障碍访问”功能的用户才需要下载该模块。\n\
  \n为了配置应用程序去下载程序集文件，可在应用程序配置文件中指定 `codeBase` 元素（详见第 3 章）。在 `codeBase` 元素定义的 URL 所指向的位置，可找到程序集的所有文件。试图加载程序集的一个文件时，CLR\
  \ 获取 `codeBase` 元素的 URL，检查机器的下载缓存，判断文件是否存在。如果是，直接加载文件。如果不是，CLR 去 URL 指向的位置将文件下载到缓存。如果还是找不到文件，CLR\
  \ 在运行时抛出 `FileNotFoundException` 异常。\n\n我想指出使用多文件程序集的三点理由。\n\n- 不同的类型用不同的文件，使文件能以“增量”方式下载（就像前面在\
  \ Internet 下载的例子中描述的那样）。另外，将类型划分到不同的文件中，可以对购买和安装的应用程序进行部分或分批打包/部署。\n- 可在程序集添加资源或数据文件。例如，假定一个类型的作用是计算保险信息，需要访问精算表才能完成计算。在这种情况下，不必在自己的源代码中嵌入精算表。相反，可以使用一个工具（比如稍后要讨论的程序集链接器\
  \ AL.exe），使数据文件成为程序集的一部分。顺便说一句，数据文件可为任意格式——包括文本文件、Microsoft Office Excel 电子表格文件以及\
  \ Microsoft Office Word 表格等——只要应用程序知道如何解析。\n- 程序集包含的各个类型可以用不同的编程语言来实现。例如，一些类型可以用\
  \ C# 实现，一些用 Visual Basic 实现，其他则用其他语言实现。编译用 C# 写的类型时，编译器会生成一个模块。编译用 Visual Basic\
  \ 写的类型时，编译器会生成另一个模块。然后可以用工具将所有模块合并成单个程序集。其他开发人员在使用这个程序集时，只知道这个程序集包含了一系列类型，根本不知道、也不用知道这些类型分别是用什么语言写的。顺便说一句，如果愿意，可以对每个模块都运行\
  \ ILDasm.exe，获得相应的 IL 源代码文件。然后运行 ILAsm.exe，将所有 IL 源代码文件都传给它。随后，ILAsm.exe 会生成包含全部类型的单个文件。该技术的前提是源代码编译器能生成纯\
  \ IL 代码。\n\n> **重要提示**　总之，程序集是进行重用、版本控制和应用安全性设置的基本单元。它允许将类型和资源文件划分到单独的文件中。这样一来，无论你自己，还是你的程序集的用户，都可以决定打包和部署哪些文件。一旦\
  \ CLR 加载含有清单的文件，就可确定在程序集的其他文件中，具体是哪些文件包含应用程序引用的类型和资源。程序集的用户（其他开发人员）只需知道含有清单的那个文件的名称。这样一来，文件的具体划分方式在程序集的用户那里就是完全透明的。你以后可以自由更改，不会干扰应用程序的行为。\n\
  >\n> 如果多个类型能共享相同的版本号和安全性设置，建议将所有这些类型放到同一个文件中，而不是分散到多个文件中，更不要分散到多个程序集。这是出于对性能的考虑。每次加载文件或程序集，CLR\
  \ 和 Windows 都要花费一定的时间来查找、加载并初始化程序集。需要加载的文件/程序集的数量越少，性能越好，因为加载较少的程序集有助于减少工作集（working\
  \ set），并缓解进程地址空间的碎片化。最后，nGen.exe 处理较大的文件时可以进行更好的优化。\n\n生成程序集要么选择现有的 PE 文件作为“清单”的宿主，要么创建单独的\
  \ PE 文件并只在其中包含清单。表 2-3 展示了将托管模块转换成程序集的清单元数据表。\n\n**表 2-3　清单元数据表**\n\n| 清单元数据表名称\
  \ | 说明 |\n|---|---|\n| AssemblyDef | 如果模块标识的是程序集，这个元数据表就包含单一记录项来列出程序集名称（不含路径和扩展名）、版本（major、minor、build\
  \ 和 revision）、语言文化（culture）、一些标志（flag）、哈希算法以及发布者公钥（可为 null）。 |\n| FileDef | 作为程序集一部分的每个\
  \ PE 文件和资源文件在这个表中都有一个记录项（清单本身所在的文件除外，该文件在 AssemblyDef 表的单一记录项中列出）。在每个记录项中，都包含文件名和扩展名（不含路径）、哈希值和一些标志（flags）。如果程序集只包含它自己的文件，FileDef\
  \ 表将无记录。 |\n| ManifestResourceDef | 作为程序集一部分的每个资源在这个表中都有一个记录项。记录项中包含资源名称、一些标志（如果在程序集外部可见，就为\
  \ public；否则为 private）以及 FileDef 表的一个索引（指出资源或流包含在哪个文件中）。如果资源不是独立文件（比如 .jpg 或者 .gif\
  \ 文件），那么资源就是包含在 PE 文件中的流。对于嵌入资源，记录项还包含一个偏移量，指出资源流在 PE 文件中的起始位置。 |\n| ExportedTypesDef\
  \ | 从程序集的所有 PE 模块中导出的每个 public 类型在这个表中都有一个记录项。记录项中包含类型名称、FileDef 表的一个索引（指出类型由程序集的哪个文件实现）以及\
  \ TypeDef 表的一个索引。注意，为节省空间，从清单所在文件导出的类型不再重复，因为可通过元数据的 TypeDef 表获取类型信息。 |\n\n由于有了清单的存在，程序集的用户不必关心程序集的划分细节。另外，清单也使程序集具有了自描述性（self-describing）。另外，在包含清单的文件中，一些元数据信息描述了哪些文件是程序集的一部分。但是，那些文件本身并不包含元数据来指出它们是程序集的一部分。\n\
  \n> 注意：包含清单的程序集文件还有一个 AssemblyRef 表。程序集全部文件引用的每个程序集在这个表中都有一个记录项。这样一来，工具只需打开程序集的清单，就可知道它引用的全部程序集，而不必打开程序集的其他文件。同样地，AssemblyRef\
  \ 表的存在加强了程序集的自描述性。\n\n指定以下任何命令行开关，C# 编译器都会生成程序集：/t[arg]:exe、/t[arg]:winexe、/t[arg]:appcontainerexe、/t[arg]:library\
  \ 或者 /t[arg]:winmdobj。所有这些开关都会造成编译器生成含有清单元数据表的 PE 文件。这些开关分别生成 CUI 执行体、GUI 执行体、Windows\
  \ Store 执行体、类库或者 WINMD 库。\n\n① 所谓“如果程序集只包含它自己的文件”，是指程序集只包含它的主模块，不包含其他非主模块和资源文件。1.2\
  \ 节已经说过，程序集是一个抽象概念，是一个或者多个模块文件和资源文件组成的逻辑单元，其中必定含有且只有一个后缀为 .exe 或者 .dll 的主模块文件。——译注\n\
  \n② 若使用 /t[arg]:winmdobj，生成的 .winmdobj 文件必须传给 WinMDExp.exe 工具进行处理，以便将程序集的公共 CLR\
  \ 类型作为 Windows Runtime 类型公开。WinMDExp.exe 工具根本不会碰 IL 代码。\n\n除了这些开关，C# 编译器还支持 **/target:module**\
  \ 开关。这个开关指示编译器生成一个不包含清单元数据表的 PE 文件。这样生成的肯定是一个 DLL PE 文件。CLR 要想访问其中的任何类型，必须先将该文件添加到一个程序集。使用\
  \ **/t:module** 开关时，C# 编译器默认为输出文件使用 .netmodule 扩展名。\n\n> **重要提示**　遗憾的是，不能直接从 Microsoft\
  \ Visual Studio 集成开发环境（IDE）中创建多文件程序集。只能用命令行工具创建多文件程序集。\n\n可通过许多方式将模块添加到程序集。如果用 C#\
  \ 编译器生成含清单的 PE 文件，可以使用 **/addmodule** 开关。为了理解如何生成多文件程序集，假定有两个源代码文件。\n\n- RUT.cs，其中包含不常用类型。\n\
  - FUT.cs，其中包含常用类型。\n\n下面将不常用类型编译到一个单独的模块。这样一来，如果程序集的用户永远不使用不常用类型，就不需要部署这个模块。\n\n\
  ```text\ncsc /t:module RUT.cs\n```\n\n上述命令行造成 C# 编译器创建名为 RUT.netmodule 的文件。这是一个标准的\
  \ DLL PE 文件，但是，CLR 不能单独加载它。\n\n接着将常用类型编译到另一个模块。该模块将成为程序集清单的宿主，因为这些类型会经常用到。事实上，由于该模块现在代表整个程序集，所以我将输出文件的名称改为\
  \ MultiFileLibrary.dll，而不是默认的 FUT.dll。\n\n```text\ncsc /out:MultiFileLibrary.dll\
  \ /t:library /addmodule:RUT.netmodule FUT.cs\n```\n\n上述命令行指示 C# 编译器编译 FUT.cs 来生成\
  \ MultiFileLibrary.dll。由于指定了 **/t:library** 开关，所以生成的是含有清单元数据表的 DLL PE 文件。**/addmodule:RUT.netmodule**\
  \ 开关告诉编译器 RUT.netmodule 文件是程序集的一部分。具体地说，/addmodule 开关告诉编译器将文件添加到 FileDef 清单元数据表，并将\
  \ RUT.netmodule 的公开导出类型添加到 ExportedTypesDef 清单元数据表。\n\n编译器最终创建图 2-1 所示的两个文件。清单在右边的模块中。\n\
  \nRUT.netmodule 文件包含编译 RUT.cs 所生成的 IL 代码。该文件还包含一些定义元数据表，描述了 RUT.cs 定义的类型、方法、字段、属性、事件等。还包含一些引用元数据表，描述了\
  \ RUT.cs 引用的类型、方法等。MultiFileLibrary.dll 是一个单独的文件。与 RUT.netmodule 相似，MultiFileLibrary.dll\
  \ 包含编译 FUT.cs 所生成的 IL 代码以及类似的定义与引用元数据表。然而，MultiFileLibrary.dll 还包含额外的清单元数据表，这使 MultiFileLibrary.dll\
  \ 成为了程序集。清单元数据表描述了程序集的所有文件（MultiFileLibrary.dll 本身和 RUT.netmodule）。清单元数据表还包含从 MultiFileLibrary.dll\
  \ 和 RUT.netmodule 导出的所有公共类型。\n\n\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_59_0.png)\n\
  \n图 2-1 含有两个托管模块的多文件程序集，清单在其中一个模块中\n\n> **注意**　清单元数据表实际上并不包含从清单所在的 PE 文件导出的类型。这是一项优化措施，旨在减少\
  \ PE 文件中的清单信息量。因此，上述说法“清单元数据表还包含从 MultiFileLibrary.dll 和 RUT.netmodule 导出的所有公共类型”并非百分之百准确。不过，这种说法确实精准地反映了清单在逻辑意义上公开的内容。\n\
  \n生成 MultiFileLibrary.dll 程序集之后，接着可用 ILDasm.exe 检查元数据的清单表，验证程序集文件确实包含了对 RUT.netmodule\
  \ 文件的类型的引用。FileDef 和 ExportedTypesDef 元数据表的内容如下所示。\n\n```text\nFile #1 (26000001)\n\
  ------------------------------------------------------------\n    Token: 0x26000001\n\
  \    Name : RUT.netmodule\n    HashValue Blob : e6 e6 df 62 2c a1 2c 59 97 65 0f\
  \ 21 44 10 15 96 f2 7e db c2\n    Flags : [ContainsMetaData] (00000000)\n\nExportedType\
  \ #1 (27000001)\n------------------------------------------------------------\n\
  \    Token: 0x27000001\n    Name: AReallyUsedType\n    Implementation token: 0x26000001\n\
  \    TypeDef token: 0x02000002\n    Flags : [Public] [AutoLayout] [Class] [Sealed]\
  \ [AnsiClass]\n             [BeforeFieldInit] (00100101)\n```\n\n可以看出，RUT.netmodule\
  \ 文件已被视为程序集的一部分，它的 token 是 0x26000001。在 ExportedTypesDef 表中可以看到一个公开导出的类型，名为 **AReallyUsedType**。该类型的实现\
  \ token 是 0x26000001，表明类型的 IL 代码包含在 RUT.netmodule 文件中。\n\n客户端代码必须使用 **/r[reference]:MultiFileLibrary.dll**\
  \ 编译器开关生成，才能使用 MultiFileLibrary.dll 程序集的类型。该开关指示编译器在搜索外部类型时加载 MultiFileLibrary.dll\
  \ 程序集以及 FileDef 表中列出的所有文件。要求程序集的所有文件都已安装，而且能够访问。删除 RUT.netmodule 文件导致 C# 编译器会报告以下错误：**fatal\
  \ error** CS0009: 未能打开元数据文件“c:\\MultiFileLibrary.dll”——“导入程序集“c:\\MultiFileLibrary.dll”的模块“RUT.netmodule”时出错——系统找不到指定的文件。”\n\
  \n> 注意 以下内容供技术宅参考。元数据 token 是一个 4 字节的值。其中，高位字节指明 token 的类型（0x01=TypeRef，0x02=TypeDef，0x23=AssemblyRef，0x26=File（文件定义），0x27=ExportedType）。要获取完整列表，请参见\
  \ .NET Framework SDK 包含的 CorHdr.h 文件中的 CorTokenType 枚举类型。token 的三个低位字节指明对应的元数据表中的行。例如，0x26000001\
  \ 这个实现 token 引用的是 File 表的第一行。大多数表的行从 1 而不是 0 开始编号。TypeDef 表的行号实际上从 2 开始。\n\n这意味着为了生成新程序集，所引用的程序集中的所有文件都必须存在。\n\
  \n客户端代码执行时会调用方法。一个方法首次调用时，CLR 检测作为参数、返回值或者局部变量而被方法引用的类型。然后，CLR 尝试加载所引用程序集中的含有清单的文件。如果要访问的类型恰好在这个文件中，CLR\
  \ 会执行其内部登记工作，允许使用该类型。如果清单指出被引用的类型在不同的文件中，CLR 会尝试加载需要的文件，同样执行内部登记，并允许使用该类型。注意，CLR\
  \ 并非一上来就加载所有可能用到的程序集。只有在调用的方法确实引用了未加载程序集中的类型时，才会加载程序集。换言之，为了让应用程序运行起来，并不要求被引用程序集中的所有文件都存在。\n\
  \n### 2.4.1 使用 Visual Studio IDE 将程序集添加到项目中\n\n用 Visual Studio IDE 创建项目时，想引用的所有程序集都必须添加到项目中。为此，请打开解决方案资源管理器，右击想添加引用的项目，选择“添加引用”来打开“引用管理器”对话框，如图\
  \ 2-2 所示。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_60_0.png)\n\n图 2-2 Visual\
  \ Studio 的引用管理器\n\n从列表中选择想让项目引用的程序集。如果程序集不在列表中，就单击“浏览”按钮，选择目标程序集(含清单的文件)并添加程序集引用。利用“解决方案”选项，当前项目可以引用同一个解决方案中的另一个项目创建的程序集。“COM”选项允许从托管源代码中访问一个非托管\
  \ COM 服务器，这是通过 Visual Studio 自动生成的一个托管代理类实现的。利用“项目”选项，可以选择最近添加到其他项目的程序集。\n\n按照 http://msdn.microsoft.com/en-us/library/wkze6zky(v=vs.110).aspx\
  \ 的指令进行操作，可以使自己的程序集出现在“引用管理器”中。\n\n### 2.4.2 使用程序集链接器\n\n除了使用 C#编译器，还可以使用“程序集链接器”实用程序\
  \ AL.exe 来创建程序集。如果程序集要包含由不同编译器生成的模块(而且这些编译器不支持与 C#编译器的/addmodule 开关等价的机制)，或者在生成时不清楚程序集的打包要求，程序集链接器就显得相当有用。还可用\
  \ AL.exe 生成只含资源的程序集，也就是所谓的附属程序集(satellite assembly)，它们通常用于本地化。本章稍后会讨论附属程序集的问题。\n\
  \nAL.exe 实用程序能生成 EXE 文件，或者生成只包含清单(对其他模块中的类型进行描述)的 DLL PE 文件。为了理解 AL.exe 的工作原理，让我们改变一下\
  \ MultiFileLibrary.dll 程序集的生成方式：\n\n```text\ncsc /t:module RUT.cs\ncsc /t:module\
  \ FUT.cs\nal /out:MultiFileLibrary.dll /t:library FUT.netmodule RUT.netmodule\n\
  ```\n\n图 2-3 展示了执行这些命令后生成的文件。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_61_0.png)\n\
  \n图 2-3 由三个托管模块构成的多文件程序集，其中一个含有清单\n\n这个例子首先创建两个单独的模块，即 RUT.netmodule 和 FUT.netmodule。两个模块都不是程序集，因为都不包含清单元数据表。然后生成第三个文件\
  \ MultiFileLibrary.dll，它是 DLL PE 文件（因为使用了 /t[arget]:library 开关），其中不包含 IL 代码，但包含清单元数据表。清单元数据表指出\
  \ RUT.netmodule 和 FUT.netmodule 是程序集的一部分。最终的程序集由三个文件构成：MultiFileLibrary.dll、RUT.netmodule\
  \ 和 FUT.netmodule。程序集链接器不能将多个文件合并成一个文件。\n\n使用 /t[arget]:exe、/t[arget]:winexe 或者\
  \ /t[arget]:appcontainerexe 命令行开关，AL.exe 实用程序还可生成 CUI、GUI 或者 Windows Store 应用 PE\
  \ 文件。但很少需要这样做，因为这意味着在得到的 EXE PE 文件中，IL 代码唯一做的事情就是调用另一个模块中的方法。调用 AL.exe 时添加 /main\
  \ 命令行开关，可指定模块的哪个方法是入口。例如：\n\n```text\ncsc /t:module /r:MultiFileLibrary.dll Program.cs\n\
  al /out:Program.exe /t:exe /main:Program.Main Program.netmodule\n```\n\n第一行将 Program.cs\
  \ 文件生成为 Program.netmodule 文件。第二行生成包含清单元数据表的 Program.exe PE 文件。此外，由于使用了 /main:Program.Main\
  \ 命令行开关，AL.exe 还会生成一个小的全局函数，名为 __EntryPoint，其中包含以下 IL 代码：\n\n```text\n.method privatescope\
  \ static void __EntryPoint$PST06000001() cil managed\n{\n    .entrypoint\n    //\
  \ Code size       8 (0x8)\n    .maxstack 8\n    IL_0000: tail.\n    IL_0002: call\
  \       void [ .module 'Program.netmodule']Program::Main()\n    IL_0007: ret\n}\
  \ // end of method 'Global Functions'::__EntryPoint\n```\n\n可以看出，上述代码只是调用了一个在 Program.netmodule\
  \ 文件定义的 Program 类中包含的 Main 方法。AL.exe 的 /main 开关实际没有多大用处，因为假如一个应用程序的入口不在清单元数据表所在的\
  \ PE 文件中，为它创建程序集有什么意义呢？开发人员只需知道有这个开关就可以了。\n\n本书配套代码有一个 Ch02-3-BuildMultiFileLibrary.bat\
  \ 文件，它封装了生成多文件程序集所需的全部步骤。作为生成前的命令行步骤，Ch02-4-AppUsingMultiFileLibrary 项目会调用该批处理文件。可参考这个项目来体会如何在\
  \ Visual Studio 中生成和引用多文件程序集。\n\n### 2.4.3 为程序集添加资源文件\n\n用 AL.exe 创建程序集时，可用 /embed[resource]\
  \ 开关将文件作为资源添加到程序集。该开关获取任意文件，并将文件内容嵌入最终的 PE 文件。清单的 ManifestResourceDef 表会更新以反映新资源的存在。\n\
  \nAL.exe 还支持 /link[resource] 开关，它同样获取包含资源的文件，但只是更新清单的 ManifestResourceDef 和 FileDef\
  \ 表以反映资源的存在。指出资源包含在程序集的哪个文件中。资源文件不会嵌入程序集 PE 文件中；相反，它保持独立，而且必须和其他程序集文件一起打包和部署。\n\n\
  与 AL.exe 相似，C#编译器 CSC.exe 也允许将资源合并到编译器生成的程序集中。/resource 开关将指定的资源文件嵌入最终生成的程序集 PE\
  \ 文件中，并更新 ManifestResourceDef 表。/linkresource 开关在 ManifestResourceDef 和 FileDef\
  \ 清单表中添加记录项来引用独立存在的资源文件。\n\n关于资源，最后注意可在程序集中嵌入标准的 Win32 资源。为此，只需在使用 AL.exe 或者 CSC.exe\
  \ 时使用/win32res 开关指定一个.res 文件的路径名。还可在使用 AL.exe 或者 CSC.exe 时使用/win32icon 开关指定一个.ico\
  \ 文件的路径名，从而在程序集中快速、简单地嵌入标准的 Win32 图标资源。要在 Visual Studio 中将资源文件添加到程序集中，可以显示项目的属性，在“应用程序”选项卡中添加资源文件。嵌入图标的目的一般是在\
  \ Windows 资源管理器中为托管的可执行文件显示特色图标。\n\n> 注意 托管的程序集文件还包含 Win32 清单资源信息。C#编译器默认生成这种清单信息，但可用/nowin32manifest\
  \ 开关告诉它不生成。C#编译器生成的默认清单是下面这样的：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  \ standalone=\"yes\"?>\n<assembly xmlns=\"urn:schemas-microsoft-com:asm.v1\" manifestVersion=\"\
  1.0\">\n    <assemblyIdentity version=\"1.0.0.0\" name=\"MyApplication.app\" />\n\
  \    <trustInfo xmlns=\"urn:schemas-microsoft-com:asm.v2\">\n        <security>\n\
  \            <requestedPrivileges xmlns=\"urn:schemas-microsoft-com:asm.v3\">\n\
  \                <requestedExecutionLevel level=\"asInvoker\" uiAccess=\"false\"\
  />\n            </requestedPrivileges>\n        </security>\n    </trustInfo>\n\
  </assembly>\n```\n\n## 2.5 程序集版本资源信息\n\nAL.exe 或 CSC.exe 生成 PE 文件程序集时，还会在 PE 文件中嵌入标准的\
  \ Win32 版本资源。可查看文件属性来检查该资源。在应用程序代码中调用 System.Diagnostics.FileVersionInfo 的静态方法 GetVersionInfo，并传递程序集的路径作为参数，就可以获取并检查这些信息。图\
  \ 2-4 显示的是 Ch02-3-MultiFileLibrary.dll 属性对话框的“详细信息”选项卡。\n\n生成程序集时，应该使用定制特性设置各种版本资源字段，这些特性在源代码中应用于\
  \ assembly 级别。图 2-4 的版本信息用以下代码生成：\n\n```csharp\nusing System.Reflection;\n\n// FileDescription\
  \ 版本信息\n[assembly: AssemblyTitle(\"MultiFileLibrary.dll\")]\n\n// Comments 版本信息\n\
  [assembly: AssemblyDescription(\"This assembly contains MultiFileLibrary's types\"\
  )]\n\n// CompanyName 版本信息\n[assembly: AssemblyCompany(\"Wintellect\")]\n\n// ProductName\
  \ 版本信息\n[assembly: AssemblyProduct(\"Wintellect (R) MultiFileLibrary's Type Library\"\
  )]\n\n// LegalCopyright 版本信息\n[assembly: AssemblyCopyright(\"Copyright (c) Wintellect\
  \ 2013\")]\n\n// LegalTrademarks 版本信息\n[assembly:AssemblyTrademark(\"MultiFileLibrary\
  \ is a registered trademark of Wintellect\")]\n\n// AssemblyVersion 版本信息\n[assembly:\
  \ AssemblyVersion(\"3.0.0.0\")]\n\n// FILEVERSION/FileVersion 版本信息\n[assembly: AssemblyFileVersion(\"\
  1.0.0.0\")]\n\n// PRODUCTVERSION/ProductVersion 版本信息\n[assembly: AssemblyInformationalVersion(\"\
  2.0.0.0\")]\n\n// 设置 Language 字段(参见 2.6 节“语言文化”)\n[assembly:AssemblyCulture(\"\"\
  )]\n```\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_64_0.png)\n\n图 2-4 “Ch02-3-MultiFileLibrary.dll\
  \ 属性”对话框的“详细信息”选项卡\n\n> > **重要提示** Windows 资源管理器的属性对话框明显遗漏了一些特性值。最遗憾的是没有显示 AssemblyVersion\
  \ 这个特性的值，因为 CLR 加载程序集时会使用这个值，详情将在第 3 章讨论。\n\n表 2-4 总结了版本资源字段和对应的定制特性。如果用 AL.exe\
  \ 生成程序集，可以用命令行开关设置这些信息，而不必使用定制特性。表 2-4 的第二列显示了与每个版本资源字段对应的 AL.exe 命令行开关。注意，C# 编译器没有提供这些命令行开关。在这种情况下，最好是用定制特性设置这些信息。\n\
  \n**表 2-4　版本资源字段和对应的 AL.exe 开关/定制特性**\n\n| 版本资源 | AL.exe 开关 | 定制特性/说明 |\n|---|---|---|\n\
  | FILEVERSION | /fileversion | System.Reflection.AssemblyFileVersionAttribute |\n\
  | PRODUCTVERSION | /productversion | System.Reflection.AssemblyInformationalVersionAttribute\
  \ |\n| FILEFLAGSMASK | （无） | 总是设为 VS_FFI_FILEFLAGSMASK（在 WinVer.h 中定义为 0x0000003F）\
  \ |\n| FILEFLAGS | （无） | 总是 0 |\n| FILEOS | （无） | 目前总是 VOS__WINDOWS32 |\n| FILETYPE\
  \ | /target | 如果指定了 /target:exe 或 /target:winexe，就设为 VFT_APP；如果指定了 /target:library，就设为\
  \ VFT_DLL |\n| FILESUBTYPE | （无） | 总是设为 VFT2_UNKNOWN（该字段对于 VFT_APP 和 VFT_DLL 无意义）\
  \ |\n| AssemblyVersion | /version | System.Reflection.AssemblyVersionAttribute |\n\
  | Comments | /description | System.Reflection.AssemblyDescriptionAttribute |\n|\
  \ CompanyName | /company | System.Reflection.AssemblyCompanyAttribute |\n| FileDescription\
  \ | /title | System.Reflection.AssemblyTitleAttribute |\n| FileVersion | /version\
  \ | System.Reflection.AssemblyFileVersionAttribute |\n| InternalName | /out | 设为指定的输出文件的名称（无扩展名）\
  \ |\n| LegalCopyright | /copyright | System.Reflection.AssemblyCopyrightAttribute\
  \ |\n| LegalTrademarks | /trademark | System.Reflection.AssemblyTrademarkAttribute\
  \ |\n| OriginalFilename | /out | 设为输出文件的名称（无路径） |\n| PrivateBuild | （无） | 总是空白 |\n\
  | ProductName | /product | System.Reflection.AssemblyProductAttribute |\n| ProductVersion\
  \ | /productversion | System.Reflection.AssemblyInformationalVersionAttribute |\n\
  | SpecialBuild | （无） | 总是空白 |\n\n**重要提示**　Visual Studio 新建 C# 项目时会在一个 Properties\
  \ 文件夹中自动创建 AssemblyInfo.cs 文件。该文件除包含本节描述的所有程序集版本特性外，还包含在第 3 章讨论的几个特性。可直接打开 AssemblyInfo.cs\
  \ 文件并修改自己的程序集特有信息。Visual Studio 还提供了对话框来帮你编辑该文件。要打开这个对话框，请打开项目的属性页，在“应用程序”选项卡中单击“程序集信息”。随后会看到如图\
  \ 2-5 所示的对话框。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_65_0.png)\n\n图 2-5　Visual\
  \ Studio 的“程序集信息”对话框\n\n\n\n### 版本号\n\n上一节指出可向程序集应用几个版本号。所有这些版本号都具有相同的格式，每个都包含 4\
  \ 个以句点分隔的部分，如表 2-5 所示。\n\n**表 2-5　版本号格式**\n\n|  | major（主版本号） | minor（次版本号） | build（内部版本号）\
  \ | revision（修订号） |\n|---|---|---|---|---|\n| 示例 | 2 | 5 | 719 | 2 |\n\n表 2-5 展示了一个示例版本号：2.5.719.2。前两个编号构成了公众对版本的理解。公众会将这个例子看成是程序集的\
  \ 2.5 版本。第三个编号 719 是程序集的 build 号。如果公司每天都生成程序集，那么每天都应该递增这个 build 号。最后一个编号 2 指出当前\
  \ build 的修订次数。如果因为某个原因，公司某一天必须生成两次程序集（可能是为了修复一个造成其他什么事情都干不了的 hot bug），revision 号就应该递增。Microsoft\
  \ 采用的就是这个版本编号方案，强烈建议你也采用。\n\n注意：程序集有三个版本号，这使局面复杂化，并造成大量混淆。所以，有必要解释一下每个版本号的用途以及它们的正确用法。\n\
  \n- **AssemblyFileVersion**\n\n  这个版本号存储在 Win32 版本资源中。它仅供参考，CLR 既不检查，也不关心这个版本号。通常，可以先设置好版本号的\
  \ major/minor 部分，这是希望公众看到的版本号。然后，每生成一次就递增 build 和 revision 部分。理想情况是 Microsoft 的工具（比如\
  \ CSC.exe 或者 AL.exe）能自动更新 build 和 revision 号（根据生成时的日期和时间）。但实际情况并非如此。在 Windows 资源管理器中能看到这个版本号。对客户系统进行故障诊断时，可根据它识别程序集的版本是多少。\n\
  \n- **AssemblyInformationalVersion**\n\n  这个版本号也存储在 Win32 版本资源中，同样仅供参考。CLR 既不检查，也不关心它。这个版本号的作用是指出包含该程序集的产品的版本。例如，产品的\
  \ 2.0 版本可能包含几个程序集，其中一个程序集标记为版本 1.0，因为它是新开发的，在产品的 1.0 版本中不存在。通常，可以设置这个版本号的 major\
  \ 和 minor 部分来代表产品的公开版本号。以后每次打包所有程序集来生成完整产品，就递增 build 和 revision 部分。\n\n- **AssemblyVersion**\n\
  \n  这个版本号存储在 AssemblyDef 清单元数据表中。CLR 在绑定到强命名程序集（第 3 章讨论）时会用到它。这个版本号很重要，它唯一性地标识了程序集。开始开发程序集时，应该设置好\
  \ major/minor/build/revision 部分。而且除非要开发程序集的下一个可部署版本，否则不应变动。\n\n① 根据习惯，本书保留了版本号 4\
  \ 个组成部分的英文原文，即 major、minor、build、revision。——译注\n\n如果程序集 A 引用了强命名的程序集 B，程序集 B 的版本会嵌入程序集\
  \ A 的 AssemblyRef 表。这样一来，当 CLR 需要加载程序集 B 时，就准确地知道当初生成和测试的是程序集 B 的哪个版本。利用第 3 章将要讨论的绑定重定向（binding\
  \ redirect）技术，可以让 CLR 加载一个不同的版本。\n\n## 2.6 语言文化\n\n除了版本号，程序集还将语言文化（culture）作为其身份标识的一部分。例如，可能有一个程序集面向德语用户，第二个面向瑞士德语用户，第三个面向美国英语用户，以此类推。语言文化用包含主副标记的字符串进行标识（依据\
  \ RFC1766）。表 2-6 展示了一些例子。\n\n**表 2-6　程序集语言文化标记的例子**\n\n| 主标记 | 副标记 | 语言文化 |\n|---|---|---|\n\
  | de | （无） | 德语 |\n| de | AT | 奥地利德语 |\n| de | CH | 瑞士德语 |\n| en | （无） | 英语 |\n\
  | en | GB | 英国英语 |\n| en | US | 美国英语 |\n\n创建含代码的程序集时一般不指定具体的语言文化。这是因为代码只讲“逻辑”，不涉及具体的语言文化。未指定具体语言文化的程序集称为语言文化中性（culture\
  \ neutral）。\n\n如果应用程序包含语言文化特有的资源，Microsoft 强烈建议专门创建一个程序集来包含代码和应用程序的默认（或备用）资源。生成该程序集时不要指定具体的语言文化。其他程序集通过引用该程序集来创建和操纵它公开的类型。\n\
  \n然后，创建一个或多个单独的程序集，只在其中包含语言文化特有的资源——不要包含任何代码。标记了语言文化的程序集称为附属程序集（satellite assembly）。为附属程序集指定的语言文化应准确反映程序集中的资源的语言文化。针对想要支持的每种语言文化都要创建单独的附属程序集。\n\
  \n通常用 AL.exe 生成附属程序集。不用编译器是因为附属程序集本来就不该含有代码。使用 AL.exe 的 `/c[culture]:text` 开关指定语言文化。其中\
  \ text 是语言文化字符串，例如“en-US”代表美国英语。部署附属程序集时，应该把它保存到专门的子目录中，子目录名称和语言文化的文本匹配。例如，假定应用程序的基目录是\
  \ `C:\\MyApp`，与美国英语对应的附属程序集就应该放到 `C:\\MyApp\\en-US` 子目录。在运行时，使用 `System.Resources.ResourceManager`\
  \ 类访问附属程序集的资源。\n\n① 文档翻译为“区域性”。——译注\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_68_0.png)\n\
  \n> **注意** 虽然不建议，但创建包含代码的附属程序集也是可以的。如果愿意，可以使用定制特性 `System.Reflection.AssemblyCultureAttribute`\
  \ 代替 `AL.exe` 的 `/culture` 开关指定语言文化。例如：\n\n```csharp\n// 将程序集的语言文化设为瑞士德语\n[assembly:AssemblyCulture(\"\
  de-CH\")]\n```\n\n一般不要生成引用了附属程序集的程序集。换言之，程序集的 `AssemblyRef` 记录项只应引用语言文化中性的程序集。要访问附属程序集中的类型或成员，应使用第\
  \ 23 章“程序集加载和反射”介绍的反射技术。\n\n## 2.7 简单应用程序部署（私有部署的程序集）\n\n前面解释了如何生成模块，如何将模块合并为程序集。接着要解释如何打包和部署程序集，使用户能运行应用程序。\n\
  \n`Windows Store` 应用对程序集的打包有一套很严格的规则，`Visual Studio` 会将应用程序所有必要的程序集打包成一个 `.appx`\
  \ 文件。该文件要么上传到 `Windows Store`，要么 side-load① 到机器。用户安装 `.appx` 文件时，其中包含的所有程序集都进入一个目录。CLR\
  \ 从该目录加载程序集，`Windows` 则在用户的“开始”屏幕添加应用程序磁贴。如果其他用户安装相同的 `.appx` 文件，程序集会使用之前安装好的，新用户只是在“开始”屏幕添加了一个磁贴。用户卸载\
  \ `Windows Store` 应用时，系统从“开始”屏幕删除磁贴。如果没有其他用户安装该应用，`Windows` 删除目录和其中的所有程序集。注意，不同用户可以安装同一个\
  \ `Windows Store` 应用的不同版本。为此，`Windows` 将程序集安装到不同的目录，使一个应用可以多版本并存。\n\n对于非 `Windows\
  \ Store` 的桌面应用，程序集的打包方式没有任何特殊要求。打包一组程序集最简单的方式就是直接复制所有文件。例如，可将所有程序集文件放到一张光盘上，将光盘分发给用户，执行上面的一个批处理程序，将光盘上的文件复制到用户硬盘上的一个目录。由于已经包含了所有依赖的程序集和类型，所以用户能直接运行应用程序，“运行时”会在应用程序目录查找引用的程序集。不需要对注册表进行任何修改就能运行程序。要卸载应用程序，删除所有文件就可以了——就是这么简单！\n\
  \n也可使用其他机制打包和安装程序集文件，比如使用 `.cab` 文件（从 `Internet` 下载时使用，旨在压缩文件并缩短下载时间）。还可将程序集文件打包成一个\
  \ `MSI` 文件，以便由 `Windows Installer` 服务（`MSIExec.exe`）使用。使用 `MSI` 文件可实现程序集的“按需安装”——CLR\
  \ 首次尝试加载一个程序集时才安装它。这不是 `MSI` 的新功能；非托管 `EXE` 和 `DLL` 文件也能这么加载。\n\n① 不经应用商店而将软件拷贝到设备上，就称为\
  \ side-load。——译注\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_69_0.png)\n\n> **注意**\
  \ 使用批处理程序或其他简单的“安装软件”，足以将应用程序“弄”到用户的机器上。但要在用户桌面和“开始”菜单上创建快捷方式，仍需使用一款较高级的安装软件。此外，可以方便地备份和还原应用程序，或者在机器之间移动，但快捷方式仍需特殊处理。\n\
  \n当然，也可使用 Visual Studio 内建的机制发布应用程序。具体做法是打开项目属性页并点击“发布”标签。利用其中的选项，可以让 Visual Studio\
  \ 生成 MSI 文件并将它复制到网站、FTP 服务器或者文件路径。这个 MSI 文件还能安装必备组件，比如 .NET Framework 或 Microsoft\
  \ SQL Server Express Edition。最后，利用 ClickOnce 技术，应用程序还能自动检查更新，并在用户的机器上安装更新。\n\n在应用程序基目录或者子目录部署的程序集称为**私有部署的程序集**（privately\
  \ deployed assembly），这是因为程序集文件不和其他任何应用程序共享（除非其他应用程序也部署到该目录）。私有部署的程序集为开发人员、最终用户和管理员带来了许多便利，因为只需把它们复制到一个应用程序的基目录，CLR\
  \ 便会加载它们并执行其中的代码。除此之外，要卸载应用程序，从目录中删除程序集即可。这使备份和还原也变得简单了。\n\n之所以能实现这种简单的安装、移动和卸载，是因为每个程序集都用元数据注明了自己引用的程序集，不需要注册表设置。另外，引用别的程序集的程序集限定了每个类型的作用域。也就是说，一个应用程序总是和它生成和测试时的类型绑定。即便另一个程序集恰好提供了同名类型，CLR\
  \ 也不可能加载那个程序集。这一点有别于 COM。在 COM 中，类型是在注册表中登记的，造成机器上运行的任何应用程序都能使用那些类型。\n\n第 3 章将讨论如何部署可由多个应用程序访问的共享程序集。\n\
  \n## 2.8　简单管理控制（配置）\n\n用户或管理员经常需要控制应用程序的执行。例如，管理员可能决定移动用户硬盘上的程序集文件，或者覆写程序集清单中的信息。还有一些情形涉及版本控制，第\
  \ 3 章将进一步讨论。\n\n为了实现对应用程序的管理控制，可在应用程序目录放入一个配置文件。应用程序的发布者可创建并打包该文件。安装程序会将配置文件安装到应用程序的基目录。另外，计算机管理员或最终用户也能创建或修改该文件。CLR\
  \ 会解析文件内容来更改程序集文件的定位和加载策略。\n\n配置文件包含 XML 代码，它既能和应用程序关联，也能和机器关联。由于使用的是一个单独的文件（而不是注册表设置），用户可以方便地备份文件，管理员也能将应用程序方便地复制到其他机器——只要把必要的文件复制过去，管理策略就会被复制过去。\n\
  \n### 探测程序集文件\n\nCLR 定位程序集时会扫描几个子目录。以下是加载一个语言文化中性的程序集时的目录探测顺序（其中，firstPrivatePath\
  \ 和 secondPrivatePath 通过配置文件的 privatePath 特性指定）：\n\n```text\nAppDir\\\\AsmName.dll\n\
  AppDir\\\\AsmName\\\\AsmName.dll\nAppDir\\\\firstPrivatePath\\\\AsmName.dll\nAppDir\\\
  \\firstPrivatePath\\\\AsmName\\\\AsmName.dll\nAppDir\\\\secondPrivatePath\\\\AsmName.dll\n\
  AppDir\\\\secondPrivatePath\\\\AsmName\\\\AsmName.dll\n...\n```\n\n在这个例子中，如果 MultiFileLibrary\
  \ 程序集的文件部署到 MultiFileLibrary 子目录，就不需要配置文件，因为 CLR 能自动扫描与目标程序集名称相符的子目录。\n\n如果在上述任何子目录都找不到目标程序集，CLR\
  \ 会从头再来，用 `.exe` 扩展名替换 `.dll` 扩展名。再找不到就抛出 `FileNotFoundException` 异常。\n\n附属程序集（satellite\
  \ assembly）遵循类似的规则，只是 CLR 会在应用程序目录下的一个子目录中查找，子目录名称与语言文化相符。例如，假定向 AsmName.dll 应用了“en-US”语言文化，那么会探测以下子目录：\n\
  \n```text\nC:\\\\AppDir\\\\en-US\\\\AsmName.dll\nC:\\\\AppDir\\\\en-US\\\\AsmName\\\
  \\AsmName.dll\nC:\\\\AppDir\\\\firstPrivatePath\\\\en-US\\\\AsmName.dll\nC:\\\\\
  AppDir\\\\firstPrivatePath\\\\en-US\\\\AsmName\\\\AsmName.dll\nC:\\\\AppDir\\\\\
  secondPrivatePath\\\\en-US\\\\AsmName.dll\nC:\\\\AppDir\\\\secondPrivatePath\\\\\
  en-US\\\\AsmName\\\\AsmName.dll\n\nC:\\\\AppDir\\\\en-US\\\\AsmName.exe\nC:\\\\\
  AppDir\\\\en-US\\\\AsmName\\\\AsmName.exe\nC:\\\\AppDir\\\\firstPrivatePath\\\\\
  en-US\\\\AsmName.exe\nC:\\\\AppDir\\\\firstPrivatePath\\\\en-US\\\\AsmName\\\\AsmName.exe\n\
  C:\\\\AppDir\\\\secondPrivatePath\\\\en-US\\\\AsmName.exe\nC:\\\\AppDir\\\\secondPrivatePath\\\
  \\en-US\\\\AsmName\\\\AsmName.exe\n\nC:\\\\AppDir\\\\en\\\\AsmName.dll\nC:\\\\AppDir\\\
  \\en\\\\AsmName\\\\AsmName.dll\nC:\\\\AppDir\\\\firstPrivatePath\\\\en\\\\AsmName.dll\n\
  C:\\\\AppDir\\\\firstPrivatePath\\\\en\\\\AsmName\\\\AsmName.dll\nC:\\\\AppDir\\\
  \\secondPrivatePath\\\\en\\\\AsmName.dll\nC:\\\\AppDir\\\\secondPrivatePath\\\\\
  en\\\\AsmName\\\\AsmName.dll\n\nC:\\\\AppDir\\\\en\\\\AsmName.exe\nC:\\\\AppDir\\\
  \\en\\\\AsmName\\\\AsmName.exe\nC:\\\\AppDir\\\\firstPrivatePath\\\\en\\\\AsmName.exe\n\
  C:\\\\AppDir\\\\firstPrivatePath\\\\en\\\\AsmName\\\\AsmName.exe\nC:\\\\AppDir\\\
  \\secondPrivatePath\\\\en\\\\AsmName.exe\nC:\\\\AppDir\\\\secondPrivatePath\\\\\
  en\\\\AsmName\\\\AsmName.exe\n```\n\n如你所见，CLR 会探测具有 `.exe` 或 `.dll` 扩展名的文件。由于探测可能很耗时（尤其是\
  \ CLR 需要通过网络查找文件的时候），所以最好在 XML 配置文件中指定一个或多个 culture 元素，限制 CLR 查找附属程序集时的探测动作。Microsoft\
  \ 提供了 FusLogVw.exe 工具来帮助你了解 CLR 在运行时与程序集的绑定。访问 http://msdn.microsoft.com/en-us/library/e74a18c4(v=vs.110).aspx\
  \ 了解详情。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_73_0.png)\n"
- "## 第 3 章　共享程序集和强命名程序集\n\n本章内容：\n\n- 两种程序集，两种部署\n- 为程序集分配强名称\n- 全局程序集缓存\n- 在生成的程序集中的引用强命名程序集\n\
  - 强命名程序集能防篡改\n- 延迟签名\n- 私有部署强命名程序集\n- “运行时”如何解析类型引用\n- 高级管理控制（配置）\n\n第 2 章讲述了生成、打包和部署程序集的步骤。我将重点放在所谓的私有部署（private\
  \ deployment）上。进行私有部署，程序集放在应用程序的基目录（或子目录），由这个应用程序独享。以私有方式部署程序集，可以对程序集的命名、版本和行为进行最全面的控制。\n\
  \n本章重点是如何创建可由多个应用程序共享的程序集。Microsoft .NET Framework 随带的程序集就是典型的全局部署程序集，因为所有托管应用程序都要使用\
  \ Microsoft 在 .NET Framework Class Library（FCL）中定义的类型。\n\n第 2 章讲过，Windows 以前在稳定性上的口碑很差，主要原因是应用程序要用别人实现的代码进行生成和测试。（想想看，你开发的\
  \ Windows 应用程序是不是要调用由 Microsoft 开发人员写好的代码？）另外，许多公司都开发了供别人嵌入的控件。事实上，.NET Framework\
  \ 鼓励这样做，以后的控件开发商会越来越多。\n\n随着时间的推移，Microsoft 开发人员和控件开发人员会修改代码，这或许是为了修复 bug、进行安全更新、添加功能等。最终，新代码会进入用户机器。以前安装好的、正常工作的应用程序突然要面对“陌生”的代码，不再是应用程序最初生成和测试时的代码。因此，应用程序的行为不再是可以预测的，这是造成\
  \ Windows 不稳定的根源。\n\n文件的版本控制是个难题。取得其他代码文件正在使用的一个文件，即使只修改其中一位（将 0 变成 1，或者将 1 变成 0），就无法保证使用该文件的代码还能正常工作。使用文件的新版时，道理是一样的。之所以这样说，是因为许多应用程序都有意或无意地利用了\
  \ bug。如果文件的新版本修复了 bug，应用程序就不能像预期的那样运行了。\n\n所以现在的问题是：如何在修复 bug 并添加新功能的同时，保证不会中断应用程序的正常运行？我对这个问题进行过大量思考，最后结论是完全不可能！但是，这个答案明显不够好。分发的文件总是有\
  \ bug，公司总是希望推陈出新。必须有一种方式在分发新文件的同时，尽量保证应用程序良好工作。如果应用程序不能良好工作，必须有一种简单的方式将应用程序恢复到上一次已知良好的状态。\n\
  \n本章将解释 .NET Framework 为了解决版本控制问题而建立的基础结构。事先说一句：要讲述的内容比较复杂。将讨论 CLR 集成的大量算法、规则和策略。还要提到应用程序开发人员必须熟练使用的大量工具和实用程序。之所以复杂，是因为如前所述，版本控制本来就是一个复杂的问题。\n\
  \n## 3.1 两种程序集，两种部署\n\nCLR 支持两种程序集：弱命名程序集（weakly named assembly）和强命名程序集（strongly\
  \ named assembly）。\n\n> **重要提示** 任何文档都找不到“弱命名程序集”这个术语，这是我自创的。事实上，文档中没有对应的术语来表示弱命名的程序集。通过自造术语，我在提到不同种类的程序集时可以避免歧义。\n\
  \n弱命名和强命名程序集结构完全相同。也就是说，它们都使用第 1 章和第 2 章讨论的 PE 文件格式、PE32（+）头、CLR 头、元数据、清单表以及 IL。生成工具也相同，都是\
  \ C# 编译器或者 AL.exe。两者真正的区别在于，强命名程序集使用发布者的公钥/私钥进行了签名。这一对密钥允许对程序集进行唯一性的标识、保护和版本控制，并允许程序集部署到用户机器的任何地方，甚至可以部署到\
  \ Internet 上。由于程序集被唯一性地标识，所以当应用程序绑定到强命名程序集时，CLR 可以应用一些已知安全的策略。本章将解释什么是强命名程序集，以及\
  \ CLR 向其应用的策略。\n\n程序集可采用两种方式部署：私有或全局。私有部署的程序集是指部署到应用程序基目录或者某个子目录的程序集。弱命名程序集只能以私有方式部署。第\
  \ 2 章已讨论了私有部署的程序集。全局部署的程序集是指部署到一些公认位置的程序集。CLR 在查找程序集时，会检查这些位置。强命名程序集既可私有部署，也可全局部署。本章将解释如何创建和部署强命名程序集。表\
  \ 3-1 总结了程序集的种类及其部署方式。\n\n\n\n**表 3-1　弱命名和强命名程序集的部署方式**\n\n| 程序集种类 | 可以私有部署 | 可以全局部署\
  \ |\n|---|---|---|\n| 弱命名 | 是 | 否 |\n| 强命名 | 是 | 是 |\n\n## 3.2 为程序集分配强名称\n\n要由多个应用程序访问的程序集必须放到公认的目录。另外，检测到对程序集的引用时，CLR\
  \ 必须能自动检查该目录。但现在的问题是：两个(或更多)公司可能生成具有相同文件名的程序集。所以，假如两个程序集都复制到相同的公认目录，最后一个安装的就是“老大”，造成正在使用旧程序集的所有应用程序都无法正常工作(这正是\
  \ Windows “DLL hell”的由来，因为共享 DLL 全都复制到 System32 目录)。\n\n只根据文件名来区分程序集明显不够。CLR 必须支持对程序集进行唯一性标识的机制。这就是所谓的“强命名程序集”。强命名程序集具有\
  \ 4 个重要特性，它们共同对程序集进行唯一性标识：文件名(不计扩展名)、版本号、语言文化和公钥。由于公钥数字很大，所以经常使用从公钥派生的小哈希值，称为公钥标记(public\
  \ key token)。以下程序集标识字符串(有时称为程序集显示名称)标识了 4 个完全不同的程序集文件：\n\n```text\n\"MyTypes, Version=1.0.8123.0,\
  \ Culture=neutral, PublicKeyToken=b77a5c561934e089\"\n\n\"MyTypes, Version=1.0.8123.0,\
  \ Culture=\"en-US\", PublicKeyToken=b77a5c561934e089\"\n\n\"MyTypes, Version=2.0.1234.0,\
  \ Culture=neutral, PublicKeyToken=b77a5c561934e089\"\n\n\"MyTypes, Version=1.0.8123.0,\
  \ Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a\"\n```\n\n第一个标识的是程序集文件 MyTypes.exe\
  \ 或 MyTypes.dll (无法根据“程序集标识字符串”判断文件扩展名)。生成该程序集的公司为其分配的版本号是 1.0.8123.0，而且程序集内没有任何内容与一种特定语言文化关联，因为\
  \ Culture 设为 neutral。当然，任何公司都可以生成 MyTypes.dll(或 MyTypes.exe)程序集文件，为其分配相同的版本号 1.0.8123.0，并将语言文化设为中性。\n\
  \n所以，必须有一种方式区分恰好具有相同特性的两个公司的程序集。出于几方面的考虑，Microsoft 选择的是标准的公钥/私钥加密技术，而没有选择其他唯一性标识技术，如\
  \ GUID(Globally Unique Identifier，全局唯一标识符)、URL(Uniform Resource Locator，统一资源定位符)和\
  \ URN(Uniform Resource Name，统一资源名称)。具体地说，使用加密技术，不仅能在程序集安装到一台机器上时检查其二进制数据的完整性，还允许每个发布者授予一套不同的权限。本章稍后会讨论这些技术。所以，一个公司要想唯一性地标识自己的程序集，必须创建一对公钥/私钥。然后，公钥可以和程序集关联。没有任何两家公司有相同的公钥/私钥对。这样一来，两家公司可以创建具有相同名称、版本和语言文化的程序集，同时不会产生任何冲突。\n\
  \n注意，SN.exe 实用程序未提供任何显示私钥的途径。\n\n公钥太大，难以使用。为了简化开发人员的工作（也为了方便最终用户），人们设计了公钥标记（public\
  \ key token）。公钥标记是公钥的 64 位哈希值。SN.exe 的 -tp 开关在输出结果的末尾显示了与完整公钥对应的公钥标记。\n\n知道了如何创建公钥/私钥对，创建强命名程序集就简单了。编译程序集时使用\
  \ /keyfile:<file> 编译器开关：\n\n```\ncsc /keyfile:MyCompany.snk Program.cs\n```\n\n\
  C#编译器看到这个开关会打开指定文件(MyCompany.snk)，用私钥对程序集进行签名，并将公钥嵌入清单。注意只能对含清单的程序集文件进行签名；程序集其他文件不能被显式签名。\n\
  \n要在 Visual Studio 中新建公钥/私钥文件，可显示项目属性，点击“签名”标签，勾选“为程序集签名”，然后从“选择强名称密钥文件”选择框中选择“<新建…>”。\n\
  \n“对文件进行签名”的准确含义是：生成强命名程序集时，程序集的 FileDef 清单元数据表列出构成程序集的所有文件。每将一个文件名添加到清单，都对文件内容进行哈希处理。哈希值和文件名一道存储到\
  \ FileDef 表中。要覆盖默认哈希算法，可使用 AL.exe 的 /algid 开关，或者在程序集的某个源代码文件中，在 assembly 这一级上应用定制特性\
  \ System.Reflection.AssemblyAlgorithmIdAttribute。默认使用 SHA-1 算法。\n\n生成包含清单的 PE 文件后，会对\
  \ PE 文件的完整内容(除去 Authenticode Signature、程序集强名称数据以及 PE 头校验和)进行哈希处理，如图 3-1 所示。哈希值用发布者的私钥进行签名，得到的\
  \ RSA 数字签名存储到 PE 文件的一个保留区域(进行哈希处理时，会忽略这个区域)。PE 文件的 CLR 头进行更新，反映数字签名在文件中的嵌入位置。\n\n\
  ![](img/6fa065e17c4549db7260fbfaf4fd384e_77_0.png)\n\n图 3-1　对程序集进行签名\n\n发布者公钥也嵌入\
  \ PE 文件的 AssemblyDef 清单元数据表。文件名、程序集版本号、语言文化和公钥的组合为这个程序集赋予了一个强名称，它保证是唯一的。两家公司除非共享密钥对，否则即使都生成了名为\
  \ OurLibrary 的程序集，公钥/私钥也不可能相同。\n\n到此为止，程序集及其所有文件就可以打包和分发了。\n\n如第 2 章所述，编译器在编译源代码时会检测引用的类型和成员，必须向编译器指定要引用的程序集——C#编译器是使用\
  \ /reference 编译器开关。编译器的一项工作是在最终的托管模块中生成 AssemblyRef 元数据表，其中每个记录项都指明被引用程序集的名称(无路径和扩展名)、版本号、语言文化和公钥信息。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_78_0.png)\n\n> **重要提示**　由于公钥是很大的数字，而一个程序集可能引用其他大量程序集，所以在最终生成的文件中，相当大一部分会被公钥信息占据。为了节省存储空间，Microsoft\
  \ 对公钥进行哈希处理，并获取哈希值的最后 8 个字节。AssemblyRef 表实际存储的是这种简化的公钥值(称为“公钥标记”)。开发人员和最终用户一般看到的都是公钥标记，而不是完整公钥。\n\
  >\n> 但要注意，CLR 在做出安全或信任决策时，永远都不会使用公钥标记，因为几个公钥可能在哈希处理之后得到同一个公钥标记。\n\n下面是一个简单类库 DLL\
  \ 文件的 AssemblyRef 元数据信息(使用 ILDasm.exe 获得):\n\n```text\nAssemblyRef #1 (23000001)\n\
  ------------------------------------------------------------\nToken: 0x23000001\n\
  Public Key or Token: b7 7a 5c 56 19 34 e0 89\nName: mscorlib\nVersion: 4.0.0.0\n\
  Major Version: 0x00000004\nMinor Version: 0x00000000\nBuild Number: 0x00000000\n\
  Revision Number: 0x00000000\nLocale: <null>\nHashValue Blob:\nFlags: [none] (00000000)\n\
  ```\n\n可以看出，这个 DLL 程序集引用了具有以下特性的一个程序集中的类型:\n\n`\"MSCorLib, Version=2.0.0.0, Culture=neutral,\
  \ PublicKeyToken=b77a5c561934e089\"`\n\n遗憾的是，ILDasm.exe 在本该使用术语“Culture”的地方使用了“Locale”。检查\
  \ DLL 程序集的 AssemblyDef 元数据表看到以下内容:\n\n```text\nAssembly\n------------------------------------------------------------\n\
  Token: 0x20000001\nName : SomeClassLibrary\nPublic Key :\nHash Algorithm : 0x00008004\n\
  Version: 3.0.0.0\nMajor Version: 0x00000003\nMinor Version: 0x00000000\nBuild Number:\
  \ 0x00000000\nRevision Number: 0x00000000\nLocale: <null>\nFlags : [none] (00000000)\n\
  ```\n\n它等价于：\n\n`\"SomeClassLibrary, Version=3.0.0.0, Culture=neutral, PublicKeyToken=null\"\
  `\n\n之所以没有公钥标记，是由于 DLL 程序集没有用公钥/私钥对进行签名，这使它成为弱命名程序集。如果用 SN.exe 创建密钥文件，再用 **/keyfile**\
  \ 编译器开关进行编译，最终的程序集就是经过签名的。使用 ILDasm.exe 查看新程序集的元数据，AssemblyDef 记录项就会在 Public Key\
  \ 字段之后显示相应的字节，表明它是强命名程序集。顺便说一句，AssemblyDef 的记录项总是存储完整公钥，而不是公钥标记，这是为了保证文件没有被篡改。本章后面将解释强命名程序集如何防篡改。\n\
  \n## 3.3　全局程序集缓存\n\n知道如何创建强命名程序集之后，接着学习如何部署它，以及 CLR 如何利用信息来定位并加载程序集。\n\n由多个应用程序访问的程序集必须放到公认的目录，而且\
  \ CLR 在检测到对该程序集的引用时，必须知道检查该目录。这个公认位置就是全局程序集缓存（Global Assembly Cache，GAC）。GAC 的具体位置是一种实现细节，不同版本会有所变化。但是，一般能在以下目录发现它：\n\
  \n```\n%SystemRoot%\\Microsoft.NET\\Assembly\n```\n\nGAC 目录是结构化的：其中包含许多子目录，子目录名称用算法生成。永远不要将程序集文件手动复制到\
  \ GAC 目录；相反，要用工具完成这项任务。工具知道 GAC 的内部结构，并知道如何生成正确的子目录名。\n\n开发和测试时在 GAC 中安装强命名程序集最常用的工具是\
  \ GACUtil.exe。如果直接运行，不添加任何命令行参数，就会自动显示用法：\n\n```text\nMicrosoft (R) .NET Global\
  \ Assembly Cache Utility. Version 4.0.30319.17929\n版权所有 (C) Microsoft Corporation。保留所有权利\n\
  \n用法: Gacutil <命令> [ <选项> ]\n命令:\n    /i <assembly_path> [ /r <...> ] [ /f ]\n \
  \       将某个程序集安装到全局程序集缓存中\n\n    /il <assembly_path_list_file> [ /r <...> ] [ /f\
  \ ]\n        将一个或多个程序集安装到全局程序集缓存中\n\n    /u <assembly_display_name> [ /r <...> ]\n\
  \        将某个程序集从全局程序集缓存卸载\n\n    /ul <assembly_display_name_list_file> [ /r <...>\
  \ ]\n        将一个或多个程序集从全局程序集缓存卸载\n\n    /l [ <assembly_name> ]\n        列出通过 <assembly_name>\
  \ 筛选出的全局程序集缓存\n\n    /lr [ <assembly_name> ]\n        列出全局程序集缓存以及所有跟踪引用\n\n/cdl\n\
  \    删除下载缓存的内容\n\n/ldl\n    列出下载缓存的内容\n\n/?\n    显示详细帮助屏幕\n\n选项：\n/r <reference_scheme>\
  \ <reference_id> <description>\n    指定要安装（/i、/il）卸载（/u、/ul）的跟踪引用\n\n/f\n    强制重新安装程序集\n\
  \n/nologo\n    取消显示徽标版权标志\n\n/silent\n    取消显示所有输出\n```\n\n使用 GACUtil.exe 的 /i 开关将程序集安装到\
  \ GAC、/u 开关从 GAC 卸载程序集。注意不能将弱命名程序集放到 GAC。向 GACUtil.exe 传递弱命名程序集的文件名会报错：“将程序集添加到缓存失败：尝试安装没有强名称的程序集。”\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_80_0.png)\n\n> **注意**　GAC 默认只能由 Windows\
  \ Administrators 用户组的成员操作。如果执行 GACUtil.exe 的用户不是该组的成员，GACUtil.exe 将无法安装或卸载程序集。\n\
  \nGACUtil.exe 的 /i 开关方便开发人员在测试时使用。但如果是在生产环境中部署，建议安装或卸载程序集时除了指定 /i 或 /u 开关，还要指定 /r\
  \ 开关。/r 开关将程序集与 Windows 的安装与卸载引擎集成。简单地说，它告诉系统哪个应用程序需要程序集，并将应用程序与程序集绑定。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_80_1.png)\n\
  \n> **注意**　如果将强命名程序集打包到 .cab 文件中，或者以其他方式进行压缩，程序集的文件首先必须解压成临时文件，然后才能使用 GACUtil.exe\
  \ 将程序集文件安装到 GAC 中。安装好程序集的文件之后，临时文件可以删除。\n\n.NET Framework 重新分发包不随带提供 GACUtil.exe\
  \ 工具。如果应用程序含有需要部署到 GAC 的程序集，应该使用 Windows Installer (MSI)，因为 MSI 是用户机器上肯定会安装，又能将程序集安装到\
  \ GAC 的工具。\n\n> **重要提示** 在 GAC 中全局部署是对程序集进行注册的一种形式，虽然这个过程对 Windows 注册表没有半点影响。将程序集安装到\
  \ GAC 破坏了我们要想达到的一个基本目标，即：简单地安装、备份、还原、移动和卸载应用程序。所以，建议尽量进行私有而不是全局部署。\n\n为什么要在 GAC\
  \ 中“注册”程序集？假定两家公司都生成了名为 OurLibrary 的程序集，两个程序集都由一个 OurLibrary.dll 文件构成。这两个文件显然不能存储到同一个目录，否则最后一个安装的会覆盖第一个，造成应用程序被破坏。相反，将程序集安装到\
  \ GAC，就会在%SystemRoot%\\Microsoft.NET\\Assembly 目录下创建专门的子目录，程序集文件会复制到其中一个子目录。\n\n\
  一般没人去检查 GAC 的子目录，所以 GAC 的结构对你来说并不重要。只要使用的工具和 CLR 知道这个结构就可以了。\n\n## 3.4 在生成的程序集中引用强命名程序集\n\
  \n你生成的任何程序集都包含对其他强命名程序集的引用，这是因为 System.Object 在 MSCorLib.dll 中定义，后者就是强命名程序集。此外，程序集中还可引用由\
  \ Microsoft、第三方厂商或者你自己公司发布的其它强命名程序集。第 2 章介绍了如何使用 CSC.exe 的 /reference 编译器开关指定想引用的程序集文件名。如果文件名是完整路径，CSC.exe\
  \ 会加载指定文件，并根据它的元数据生成程序集。如第 2 章所述，如果指定不含路径的文件名，CSC.exe 会尝试在以下目录查找程序集(按所列顺序)。\n\n\
  - 1. 工作目录。\n- 2. CSC.exe 所在的目录，目录中还包含 CLR 的各种 DLL 文件。\n- 3. 使用 /lib 编译器开关指定的任何目录。\n\
  - 4. 使用 LIB 环境变量指定的任何目录。\n\n所以，如果生成的程序集引用了 Microsoft 的 System.Drawing.dll，可在执行 CSC.exe\
  \ 时使用 /reference:System.Drawing.dll 开关。编译器会依次检查上述目录，并在 CSC.exe 自己所在的目录找到 System.Drawing.dll\
  \ 文件(该目录还存储了与编译器对应的那个版本的 CLR 的各种支持 DLL)。虽然编译时会在这里寻找程序集，但运行时不会从这里加载程序集。\n\n安装.NET\
  \ Framework 时，实际会安装 Microsoft 的程序集文件的两套拷贝。一套安装到编译器/CLR 目录，另一套安装到 GAC 的子目录。编译器/CLR\
  \ 目录中的文件方便你生成程序集，而 GAC 中的拷贝则方便在运行时加载。\n\nCSC.exe 编译器之所以不在 GAC 中查找引用的程序集，是因为你必须知道程序集路径，而\
  \ GAC 的结构又没有正式公开。第二个方案是让 CSC.exe 允许你指定一个依然很长但相对比较容易阅读的字符串，比如 \"System.Drawing, Version=v4.0.0.0,\
  \ Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a\"。但这两个方案都不如在用户硬盘上安装两套一样的程序集文件。\n\
  \n除此之外，编译器/CLR 目录中的程序集不依赖机器。也就是说，这些程序集只包含元数据。由于编译时不需要 IL 代码，所以该目录不必同时包含程序集的 x86、x64\
  \ 和 ARM 版本。GAC 中的程序集同时包含元数据和 IL 代码，因为仅在运行时才需要代码。另外，由于代码可针对特定 CPU 架构进行优化，所以 GAC 允许存在一个程序集的多个拷贝。每个\
  \ CPU 架构都有一个专门的子目录来容纳这些拷贝。\n\n## 3.5 强命名程序集能防篡改\n\n用私钥对程序集进行签名，并将公钥和签名嵌入程序集，CLR\
  \ 就可验证程序集未被修改或破坏。程序集安装到 GAC 时，系统对包含清单的那个文件的内容进行哈希处理，将哈希值与 PE 文件中嵌入的 RSA 数字签名进行比较(在用公钥解除签名之后)。如果两个值完全一致，表明文件内容未被篡改。此外，系统还对程序集的其他文件的内容进行哈希处理，并将哈希值与清单文件的\
  \ FileDef 表中存储的哈希值进行比较。任何一个哈希值不匹配，表明程序集至少有一个文件被篡改，程序集将无法安装到 GAC。\n\n应用程序需要绑定到程序集时，CLR\
  \ 根据被引用程序集的属性(名称、版本、语言文化和公钥)在 GAC 中定位该程序集。找到被引用程序集，就返回包含它的子目录，并加载清单所在的文件。以这种方式查找程序集，可保证运行时加载的程序集和最初编译时生成的程序集来自同一个发布者，因为进行引用的程序集的\
  \ AssemblyRef 表中的公钥标记与被引用程序集的 AssemblyRef 表中的公钥匹配。如果被引用程序集不在 GAC 中，CLR 会查找应用程序的基目录，然后查找应用程序配置文件中标注的任何私有路径。然后，如果应用程序由\
  \ MSI 安装，CLR 要求 MSI 定位程序集。如果在任何位置都找不到程序集，那么绑定失败，抛出 System.IO.FileNotFoundException\
  \ 异常。\n\n如果强命名程序集文件从 GAC 之外的位置加载(通过应用程序的基目录，或者通过配置文件中的 codeBase 元素)，CLR 会在程序集加载后比较哈希值。也就是说，每次应用程序执行并加载程序集时，都会对文件进行哈希处理，以牺牲性能为代价，保证程序集文件内容没有被篡改。CLR\
  \ 在运行时检测到不匹配的哈希值会抛出 System.IO.FileLoadException 异常。\n\n> **注意**　将强命名程序集安装到 GAC 时，系统会执行检查，确保包含清单的文件没有被篡改。这个检查仅在安装时执行一次。除此之外，为了增强性能，如果强命名程序集被完全信任，并加载到完全信任的\
  \ AppDomain 中，CLR 将不检查该程序集是否被篡改。相反，从非 GAC 的目录加载强命名程序集时，CLR 会校验程序集的清单文件，确保文件内容未被篡改，导致该文件每次加载都要付出额外的性能开销。\n\
  \n\n\n## 3.6　延迟签名\n\n本章前面讲过如何使用 SN.exe 工具生成公钥/私钥对。该工具生成密钥时会调用 Windows 提供的 Crypto\
  \ API。密钥可存储到文件或其他存储设备中。例如，大公司（比如 Microsoft）会将自己的私钥保存到一个硬件设备中，再将硬件锁进保险库。公司只有少数人才能访问私钥。这项措施可防止私钥泄露，并保证了密钥的完整性。当然，公钥是完全公开的，可以自由分发。\n\
  \n准备打包自己的强命名程序集时，必须使用受严密保护的私钥对它进行签名。然而，在开发和测试程序集时，访问这些受严密保护的私钥可能有点碍事。有鉴于此，.NET Framework\
  \ 提供了对延迟签名（delayed signing）的支持，该技术也称为部分签名（partial signing）。延迟签名允许只用公司的公钥生成程序集，暂时不用私钥。由于使用了公钥，引用了程序集的其他程序集会在它们的\
  \ AssemblyRef 元数据表的记录项中嵌入正确的公钥值。另外，它还使程序集能正确存储到 GAC 的内部结构中。当然，不用公司的私钥对文件进行签名，便无法实现防篡改保护。这是由于无法对程序集的文件进行哈希处理，无法在文件中嵌入数字签名。然而，失去这种保护不是一个大问题，因为只是在开发阶段才延迟签名。打包和部署程序集肯定会签名。\n\
  \n为了实现延迟签名，需要获取存储在文件中的公钥值，将文件名传给用于生成程序集的实用程序。（如本章前面所述，可用 SN.exe 的 `-p` 开关从包含公钥/私钥对的文件中提取公钥。）另外，还必须让工具知道你想延迟对程序集的签名，暂不提供私钥。如果是\
  \ C# 编译器，就指定 `/delaysign` 编译器开关。如果是 Visual Studio，就打开项目属性页，在“签名”选项卡中勾选“仅延迟签名”。如果使用\
  \ AL.exe，就指定 `/delay[sign]` 命令行开关。\n\n编译器或 AL.exe 一旦检测到要对程序集进行延迟签名，就会生成程序集的 AssemblyDef\
  \ 清单记录项，其中将包含程序集的公钥。公钥使程序集能正确存储到 GAC。另外，这也不妨碍引用了该程序集的其他程序集的正确生成。在进行引用的程序集的 AssemblyRef\
  \ 元数据表记录项中，会包含（被引用程序集的）正确公钥。创建程序集时，会在生成的 PE 文件中为 RSA 数字签名预留空间（实用程序根据公钥大小判断需预留多大空间）。要注意的是，文件内容不会在这个时候进行哈希处理。\n\
  \n目前生成的程序集没有有效签名。安装到 GAC 会失败，因为尚未对文件内容执行哈希处理——文件表面上已被篡改了。在需要安装到 GAC 的每台机器上，都必须禁止系统验证程序集文件的完整性。这要求使用\
  \ SN.exe 实用程序并指定 `-Vr` 命令行开关。用这个开关执行 SN.exe，程序集的任何文件在运行时加载时，CLR 都会跳过对其哈希值的检查。在内部，SN\
  \ 的 `-Vr` 开关会将程序集的身份添加到以下注册表子项中：\n\n```text\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\\
  StrongName\\Verification\n```\n\n> **重要提示**　使用会修改注册表的任何实用程序时，请确保在 64 位操作系统中运行的是实用程序的\
  \ 64 位版本。32 位 x86 实用程序默认安装到 `C:\\Program Files (x86)\\Microsoft SDKs\\Windows\\\
  v8.0A\\bin\\NETFX 4.0 Tools` 目录，64 位 x64 实用程序安装到 `C:\\Program Files (x86)\\Microsoft\
  \ SDKs\\Windows\\v8.0A\\bin\\NETFX 4.0 Tools\\x64` 目录。\n\n结束程序集的开发和测试之后，要正式对其进行签名，以便打包和部署它。为了对程序集进行签名，要再次使用\
  \ SN.exe 实用程序，但这次换用 **-R** 开关，并指定包含了私钥的文件的名称。**-R** 开关指示 SN.exe 对文件内容进行哈希处理，用私钥对其进行签名，并将\
  \ RSA 数字签名嵌入文件中之前预留的空间。经过这一步之后，就可以部署完全签好的程序集。在开发和测试机器上，不要忘记使用 SN.exe 的 **-Vu** 或\
  \ **-Vx** 命令行开关来重新启用对这个程序集的验证。下面总结了使用延迟签名技术开发程序集的步骤。\n\n1. 开发期间，获取只包含公司公钥的文件，使用\
  \ `/keyfile` 和 `/delaysign` 编译器开关编译程序集：\n\n   ```text\n   csc /keyfile:MyCompany.PublicKey\
  \ /delaysign MyAssembly.cs\n   ```\n\n2. 生成程序集后执行以下命令，使 CLR 暂时信任程序集的内容，不对它进行哈希处理，也不对哈希值进行比较。该程序集能顺利安装到\
  \ GAC（如果有必要的话）。现在，可以生成引用了这个程序集的其他程序集，并可随意测试程序集。注意，在每台开发用的机器上，以下命令都只需执行一次，不必每次生成程序集都重复这一步：\n\
  \n   ```text\n   SN.exe -Vr MyAssembly.dll\n   ```\n\n3. 准备好打包和部署程序集时，获取公司的私钥并执行以下命令。如果愿意，可以将这个新版本安装到\
  \ GAC 中。但只有先完成步骤 4，才能把它安装到 GAC 中。\n\n   ```text\n   SN.exe -Ra MyAssembly.dll MyCompany.PrivateKey\n\
  \   ```\n\n4. 为了在实际环境中测试，请执行以下命令，重新启用对这个程序集的验证：\n\n   ```text\n   SN -Vu MyAssembly.dll\n\
  \   ```\n\n本节开头就指出，大公司会将自己的密钥存储到硬件设备（比如智能卡）中。为了确保密钥的安全性，密钥值绝对不能固定存储在磁盘文件中。“加密服务提供程序”（Cryptographic\
  \ Service Provider，CSP）提供了对这些密钥的位置进行抽象的容器。以 Microsoft 使用的 CSP 为例，一旦访问它提供的容器，就自动从一个硬件设备获取私钥。\n\
  \n如果公钥/私钥对在 CSP 容器中，必须为 CSC.exe、AL.exe 和 SN.exe 程序指定不同的开关。编译时（CSC.exe）指定 `/keycontainer`\
  \ 开关而不是 `/keyfile` 开关；链接时（AL.exe）指定 `/keyname` 开关而不是 `/keyfile` 开关；使用强名称程序（SN.exe）对延迟签名的程序集进行重新签名时，指定\
  \ **-Rc** 开关而不是 **-R** 开关。SN.exe 提供了另外几个开关让开发人员与 CSP 互动。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_85_0.png)\n\
  \n> **重要提示**　打包程序集前，如果想对它执行其他任何操作，延迟签名也非常有用。例如，可能想对程序集运行混淆器（obfuscator）程序。程序集完全签名后就不能运行混淆器了，否则哈希值就不正确了。所以，要混淆程序集文件，或者进行其他形式的“生成后”（post-build）操作，就利用延迟签名技术，先完成“生成后”操作，再用\
  \ -R 或 -Rc 开关运行 SN.exe 对程序集进行完全签名。\n\n## 3.7　私有部署强命名程序集\n\n在 GAC 中安装程序集有几方面的优势。GAC\
  \ 使程序集能被多个应用程序共享，减少了总体物理内存消耗。另外，很容易将程序集的新版本部署到 GAC，让所有应用程序都通过发布者策略（本章稍后讲述）使用新版本。GAC\
  \ 还实现了对程序集多个版本的并行管理。但 GAC 通常受到严密保护，只有管理员才能在其中安装程序集。另外，一旦安装到 GAC，就违反了“简单复制部署”①这一基本目标。\n\
  \n虽然强命名程序集能安装到 GAC，但绝非必须。事实上，只有由多个应用程序共享的程序集才应部署到 GAC。不用共享的应该私有部署。私有部署达成了“简单复制部署”目标，而且能更好地隔离应用程序及其程序集。另外，不要将\
  \ GAC 想象成新的 `C:\\Windows\\System32` 垃圾堆场。这是因为新版本程序集不会相互覆盖，它们并行安装，每个安装都占用磁盘空间。\n\n\
  强命名程序集除了部署到 GAC 或者进行私有部署，还可部署到只有少数应用程序知道的目录。例如，假定强命名程序集由三个应用程序共享。安装时可创建三个目录，每个程序一个目录。再创建第四个目录，专门存储要共享的程序集。每个应用程序安装到自己的目录时都同时安装一个\
  \ XML 配置文件，用 **codeBase** 元素指出共享程序集路径。这样在运行时，CLR 就知道去那里查找共享程序集。但要注意，这个技术很少使用，也不太推荐使用，因为所有应用程序都不能独立决定何时卸载程序集的文件。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_85_1.png)\n\n> **注意**　配置文件的 **codeBase**\
  \ 元素实际标记了一个 URL。这个 URL 可引用用户机器上的任何目录，也可引用 Web 地址。如果引用 Web 地址，CLR 会自动下载文件，并把它存储到用户的下载缓存（`%UserProfile%\\\
  Local Settings\\Application Data\\Assembly` 下的子目录）。将来引用时，CLR 将下载文件的时间戳与 URL 处的文件的时间戳进行对比。如果\
  \ URL 处的文件具有较新的时间戳，CLR 下载新版本并加载。否则，CLR 加载现有文件，不重复下载（从而增强性能）。本章稍后会展示包含 **codeBase**\
  \ 元素的示例配置文件。\n\n① 本来，简单复制一下程序集的文件就可以完成部署。但安装到 GAC 之后，就没有这么简单了。——译注\n\n## 3.8 “运行时”如何解析类型引用\n\
  \n第 2 章开头展示了以下代码：\n\n```csharp\npublic sealed class Program {\n    public static\
  \ void Main() {\n        System.Console.WriteLine(\"Hi\");\n    }\n}\n```\n\n编译这些代码并生成程序集（假定名为\
  \ Program.exe）。运行应用程序，CLR 会加载并初始化自身，读取程序集的 CLR 头，查找标识了应用程序入口方法（Main）的 MethodDefToken，检索\
  \ MethodDef 元数据表找到方法的 IL 代码在文件中的偏移量，将 IL 代码 JIT 编译成本机代码（编译时会对代码进行验证以确保类型安全），最后执行本机代码。下面就是\
  \ Main 方法的 IL 代码。要查看代码，请对程序集运行 ILDasm.exe 并选择“视图”|“显示字节”，双击树形视图中的 Main 方法。\n\n```text\n\
  .method public hidebysig static void Main() cil managed\n// SIG: 00 00 01\n{\n \
  \ .entrypoint\n  // Method begins at RVA 0x2050\n  // Code size 11 (0xb)\n  .maxstack\
  \ 8\n  IL_0000: /* 72 | (70)000001 */\n      ldstr \"Hi\"\n  IL_0005: /* 28 | (0A)000003\
  \ */\n      call void [mscorlib]System.Console::WriteLine(string)\n  IL_000a: /*\
  \ 2A | 1 */\n      ret\n} // end of method Program::Main\n```\n\n对这些代码进行 JIT 编译，CLR\
  \ 会检测所有类型和成员引用，加载它们的定义程序集（如果尚未加载）。上述 IL 代码包含对 **System.Console.WriteLine** 的引用。具体地说，IL\
  \ call 指令引用了元数据 token ① 0A000003。该 token 标识 MemberRef 元数据表（表 0A）中的记录项 3。CLR 检查该\
  \ MemberRef 记录项，发现它的字段引用了 TypeRef 表中的记录项（**System.Console** 类型）。按照 TypeRef 记录项，CLR\
  \ 被引导至一个 AssemblyRef 记录项：“mscorlib, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089”。这时\
  \ CLR 就知道了它需要的是哪个程序集。接着，CLR 必须定位并加载该程序集。\n\n解析引用的类型时，CLR 可能在以下三个地方找到类型。\n\n- **相同文件**\n\
  \n  编译时便能发现对相同文件中的类型的访问，这称为**早期绑定（early binding）**②。类型直接从文件中加载，执行继续。\n\n① 元数据 token\
  \ 的详情请参见 2.4 节。——译注\n\n② 对应地，在运行时通过反射机制绑定到类型并调用方法，就称为**晚期绑定（late binding）**。——译注\n\
  \n- **不同文件，相同程序集**\n\n  “运行时”确保被引用的文件在当前程序集元数据的 FileDef 表中，检查加载程序集清单文件的目录、加载被引用的文件，检查哈希值以确保文件完整性。发现类型的成员，执行继续。\n\
  \n- **不同文件，不同程序集**\n\n  如果引用的类型在其他程序集的文件中，“运行时”会加载被引用程序集的清单文件。如果需要的类型不在该文件中，就继续加载包含了类型的文件。发现类型的成员，执行继续。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_87_0.png)\n\n> **注意**　ModuleDef、ModuleRef\
  \ 和 FileDef 元数据表在引用文件时使用了文件名和扩展名。但 AssemblyRef 元数据表只使用文件名，无扩展名。和程序集绑定时，系统通过探测目录来尝试定位文件，自动附加\
  \ `.dll` 和 `.exe` 扩展名，详见 2.8 节“简单管理控制（配置）”。\n\n解析类型引用时有任何错误（找不到文件、文件无法加载、哈希值不匹配等）都会抛出相应异常。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_87_1.png)\n\n> **注意**　可以向 **System.AppDomain**\
  \ 的 **AssemblyResolve**、**ReflectionOnlyAssemblyResolve** 和 **TypeResolve** 事件注册回调方法。在回调方法中执行解决绑定问题的代码，使应用程序不抛出异常而继续运行。\n\
  \n在上例中，CLR 发现 **System.Console** 在和调用者不同的程序集中央实现。所以，CLR 必须查找那个程序集，加载包含程序集清单的 PE\
  \ 文件。然后扫描清单，判断是哪个 PE 文件实现了类型。如果被引用的类型就在清单文件中，一切都很简单。如果类型在程序集的另一个文件中，CLR 必须加载那个文件，并扫描其元数据来定位类型。然后，CLR\
  \ 创建它的内部数据结构来表示类型，JIT 编译器完成 **Main** 方法的编译。最后，**Main** 方法开始执行。图 3-2 演示了类型绑定过程。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_87_2.png)\n\n> **重要提示**　严格意义上，刚才的例子并非百分之百正确。如果引用的不是\
  \ .NET Framework 程序集定义的方法和类型，刚才的讨论没有任何问题。但是，.NET Framework 程序集（MSCorLib.dll 就是其中之一）和当前运行的\
  \ CLR 版本紧密绑定。引用 .NET Framework 程序集的任何程序集总是绑定到与 CLR 版本对应的那个版本的 .NET Framework 程序集。这就是所谓的“统一”（Unification）。之所以要“统一”，是因为所有\
  \ .NET Framework 程序集都是针对一个特定版本的 CLR 来完成测试的。因此，“统一”代码结构（code stack）可确保应用程序正确工作。\n\
  >\n> 所以前面的例子中，对 **System.Console** 的 **WriteLine** 方法的引用必然绑定到与当前 CLR 版本对应的 MSCorLib.dll\
  \ 版本——无论程序集 AssemblyRef 元数据表引用哪个版本的 MSCorLib.dll。\n\n> **注意**　CLR 提供了将类型（类、结构、枚举、接口或委托）从一个程序集移动到另一个程序集的功能。例如，.NET\
  \ 3.5 的 System.TimeZoneInfo 类在 System.Core.dll 程序集中定义。但在 .NET 4.0 中，Microsoft 将这个类移动到了\
  \ MSCorLib.dll 程序集。将类型从一个程序集移动到另一个程序集，一般情况下会造成应用程序“中断”。但 CLR 提供了名为 System.Runtime.CompilerServices.TypeForwardedToAttribute\
  \ 的特性，可将它应用于原始程序集（比如 System.Core.dll）。要向该特性的构造器传递一个 System.Type 类型的参数，指出应用程序要使用的新类型（现在是在\
  \ MSCorLib.dll 中定义）。CLR 的绑定器（binder）会利用到这个信息。由于 TypeForwardedToAttribute 的构造器获取的是\
  \ Type，所以包含该特性的程序集要依赖于现在定义类型的程序集。\n>\n> 为了使用这个功能，还要向新程序集中的类型应用名为 System.Runtime.CompilerServices.TypeForwardedFromAttribute\
  \ 的特性，向该特性的构造器传递一个字符串来指出定义类型的旧程序集的全名。该特性一般由工具、实用程序和序列化使用。由于 TypeForwardedFromAttribute\
  \ 的构造器获取的是 String，所以包含该特性的程序集不依赖于过去定义类型的程序集。\n\n## 3.9 高级管理控制（配置）\n\n2.8 节“简单管理控制（配置）”简要讨论了管理员如何影响\
  \ CLR 搜索和绑定程序集的方式。那一节演示了如何将被引用程序集的文件移动到应用程序基目录下的一个子目录，以及 CLR 如何通过应用程序的 XML 配置文件来定位发生移动的文件。\n\
  \n第 2 章只讨论了 probing 元素的 privatePath 属性，本节要讨论 XML 配置文件的其他元素。以下是一个示例 XML 配置文件：\n\n\
  ```xml\n<?xml version=\"1.0\"?>\n<configuration>\n    <runtime>\n        <assemblyBinding\
  \ xmlns=\"urn:schemas-microsoft-com:asm.v1\">\n            <probing privatePath=\"\
  AuxFiles;bin\\subdir\" />\n\n            <dependentAssembly>\n\n               \
  \ <assemblyIdentity name=\"SomeClassLibrary\"\n                    publicKeyToken=\"\
  32ab4ba45e0a69a1\" culture=\"neutral\"/>\n\n                <bindingRedirect\n \
  \                   oldVersion=\"1.0.0.0\" newVersion=\"2.0.0.0\" />\n\n       \
  \         <codeBase version=\"2.0.0.0\"\n                    href=\"http://www.Wintellect.com/SomeClassLibrary.dll\"\
  \ />\n\n            </dependentAssembly>\n\n            <dependentAssembly>\n```\n\
  \n```xml\n<assemblyIdentity name=\"TypeLib\"\n  publicKeyToken=\"1f2e74e897abbcfe\"\
  \ culture=\"neutral\"/>\n\n<bindingRedirect\n  oldVersion=\"3.0.0.0-3.5.0.0\" newVersion=\"\
  4.0.0.0\" />\n\n<publisherPolicy apply=\"no\" />\n\n</dependentAssembly>\n\n  </assemblyBinding>\n\
  </runtime>\n</configuration>\n```\n\n这个 XML 文件为 CLR 提供了丰富的信息。具体如下所示。\n\n- **probing\
  \ 元素**  \n  查找弱命名程序集时，检查应用程序基目录下的 AuxFiles 和 bin\\subdir 子目录。对于强命名程序集，CLR 检查 GAC\
  \ 或者由 **codeBase** 元素指定的 URL。只有在未指定 **codeBase** 元素时，CLR 才会在应用程序的私有路径中检查强命名程序集。\n\
  - **第一个 dependentAssembly、assemblyIdentity 和 bindingRedirect 元素**  \n  查找由控制着公钥标记\
  \ 32ab4ba45e0a69a1 的组织发布的、语言文化为中性的 SomeClassLibrary 程序集的 1.0.0.0 版本时，改为定位同一个程序集的\
  \ 2.0.0.0 版本。\n- **codeBase 元素**  \n  查找由控制着公钥标记 32ab4ba45e0a69a1 的组织发布的、语言文化为中性的\
  \ SomeClassLibrary 程序集的 2.0.0.0 版本时，尝试在以下 URL 处发现它：www.Wintellect.com/SomeClassLibrary.dll。虽然第\
  \ 2 章没有特别指出，但 **codeBase** 元素也能用于弱命名程序集。如果是这样，程序集版本号会被忽略，而且根本就不应该在 XML **codeBase**\
  \ 元素中写这个版本号。另外，**codeBase** 定义的 URL 必须指向应用程序基目录下的一个子目录。\n- **第二个 dependentAssembly、assemblyIdentity\
  \ 和 bindingRedirect 元素**  \n  查找由控制着公钥标记 1f2e74e897abbcfe 的组织发布的、语言文化为中性的 TypeLib\
  \ 程序集的 3.0.0.0 到 3.5.0.0 版本时(包括 3.0.0.0 和 3.5.0.0 在内)，改为定位同一个程序集的 4.0.0.0 版本。\n\
  - **publisherPolicy 元素**  \n  如果生成 TypeLib 程序集的组织部署了发布者策略文件(详情在下一节讲述)，CLR 应忽略该文件。\n\
  \n编译方法时，CLR 判断它引用了哪些类型和成员。根据这些信息，“运行时”检查进行引用的程序集的 AssemblyRef 表，判断程序集生成时引用了哪些程序集。然后，CLR\
  \ 在应用程序配置文件中检查程序集/版本，进行指定的版本号重定向操作。随后，CLR 查找新的、重定向的程序集/版本。\n\n如果 **publisherPolicy**\
  \ 元素的 **apply** 特性设为 **yes**，或者该元素被省略，CLR 会在 GAC 中检查新的程序集/版本，并进行程序集发布者认为有必要的任何版本号重定向操作。随后，CLR\
  \ 查找新的、重定向的程序集/版本。(下一节将更详细讨论发布者策略。)最后，CLR 在机器的 Machine.config 文件中检查新的程序集/版本并进行指定的版本号重定向操作。\n\
  \n到此为止，CLR 已知道了它应加载的程序集版本，并尝试从 GAC 中加载。如果程序集不在 GAC 中，也没有 codeBase 元素，CLR 会像第 2 章描述的那样探测程序集。如果执行最后一次重定向操作的配置文件同时包含\
  \ codeBase 元素，CLR 会尝试从 codeBase 元素指定的 URL 处加载程序集。\n\n利用这些配置文件，管理员可以实际地控制 CLR 加载的程序集。如果应用程序出现\
  \ bug，管理员可以和/或出现问题的程序集的发布者取得联系。发布者将新程序集发送给管理员，让管理员安装。CLR 默认不加载新程序集，因为已生成的程序集并没有引用新版本。不过，管理员可以修改应用程序的\
  \ XML 配置文件，指示 CLR 加载新程序集。\n\n如果管理员希望机器上的所有应用程序都使用新程序集，可以修改机器的 Machine.config 文件。这样每当应用程序引用旧程序集时，CLR\
  \ 都自动加载新程序集。\n\n如果发现新程序集没有修复 bug，管理员可以从配置文件中删除 bindingRedirect 设置，应用程序会恢复如初。说了这么多，其实重点只有一个：系统允许使用和元数据所记录的不完全匹配的程序集版本。这种额外的灵活性非常有用。\n\
  \n## 发布者策略控制\n\n在上一节的例子中，是由程序集发布者将程序集的新版本发送给管理员，后者安装程序集，并手动编辑应用程序或机器的 XML 配置文件。通常，发布者希望在修复了程序集的\
  \ bug 之后，采用一种容易的方式将新程序集打包并分发给所有用户。但是，发布者还需要一种方式告诉每个用户的 CLR 使用程序集新版本，而不是继续使用旧版本。当然，可以指示每个用户手动修改应用程序或机器的\
  \ XML 配置文件，但这相当不便，而且容易出错。因此，发布者需要一种方式创建策略信息。新程序集安装到用户机器上时，会安装这种策略信息。本节将描述程序集的发布者如何创建这种策略信息。\n\
  \n假定你是程序集的发布者，刚刚修复了几个 bug，创建了程序集的新版本。打包要发送给所有用户的新程序集时，应同时创建一个 XML 配置文件。这个配置文件和以前讨论过的配置文件差不多。下面是用于\
  \ SomeClassLibrary.dll 程序集的示例文件(名为 SomeClassLibrary.config):\n\n```xml\n<configuration>\n\
  \  <runtime>\n    <assemblyBinding xmlns=\"urn:schemas-microsoft-com:asm.v1\">\n\
  \      <dependentAssembly>\n\n        <assemblyIdentity name=\"SomeClassLibrary\"\
  \n          publicKeyToken=\"32ab4ba45e0a69a1\" culture=\"neutral\"/>\n\n      \
  \  <bindingRedirect\n          oldVersion=\"1.0.0.0\" newVersion=\"2.0.0.0\" />\n\
  \n        <codeBase version=\"2.0.0.0\"\n          href=\"http://www.Wintellect.com/SomeClassLibrary.dll\"\
  />\n\n      </dependentAssembly>\n    </assemblyBinding>\n  </runtime>\n</configuration>\n\
  ```\n\n当然，发布者只能为自己创建的程序集设置策略。另外，发布者策略配置文件只能使用列出的这些元素；例如，**probing** 或 **publisherPolicy**\
  \ 元素是不能使用的。\n\n该配置文件告诉 CLR 一旦发现对 SomeClassLibrary 程序集的 1.0.0.0 版本的引用，就自动加载 2.0.0.0\
  \ 版本。现在，发布者就可以创建包含该发布者策略配置文件的程序集，像下面这样运行 AL.exe：\n\n```text\nAL.exe /out:Policy.1.0.SomeClassLibrary.dll\n\
  \       /version:1.0.0.0\n       /keyfile:MyCompany.snk\n       /linkresource:SomeClassLibrary.config\n\
  ```\n\n下面是对 AL.exe 的命令行开关的解释。\n\n- **/out**  \n  告诉 AL.exe 创建新 PE 文件，本例是 Policy.1.0.SomeClassLibrary.dll，其中除了一个清单什么都没有。程序集名称很重要。名称第一部分(Policy)告诉\
  \ CLR 该程序集包含发布者策略信息。第二部分和第三部分(1.0)告诉 CLR 这个发布者策略程序集适用于 major 和 minor 版本为 1.0 的任何版本的\
  \ SomeClassLibrary 程序集。发布者策略只能和程序集的 major 和 minor 版本号关联；不能和 build 或 revision 号关联。名称第四部分(SomeClassLibrary)指出与发布者策略对应的程序集名称。名称第五部分(dll)是现在要生成的发布者策略程序集文件的扩展名。\n\
  - **/version**  \n  标识发布者策略程序集的版本：这个版本号与 SomeClassLibrary 程序集本身没有任何关系。看得出来，发布者策略程序集本身也有一套版本机制。例如，发布者今天创建一个发布者策略，将\
  \ SomeClassLibrary 的版本 1.0.0.0 重定向到版本 2.0.0.0。未来，发布者可能将 SomeClassLibrary 的版本 1.0.0.0\
  \ 重定向到版本 2.5.0.0。CLR 根据 **/version** 开关指定的版本号来选择最新版本的发布者策略程序集。\n- **/keyfile** \
  \ \n  告诉 AL.exe 使用发布者的“公钥/私钥对”对发布者策略程序集进行签名。这一对密钥还必须匹配所有版本的 SomeClassLibrary 程序集使用的密钥对。毕竟，只有这样，CLR\
  \ 才知道 SomeClassLibrary 程序集和发布者策略文件由同一个发布者创建。\n- **/linkresource**  \n  告诉 AL.exe\
  \ 将 XML 配置文件作为程序集的一个单独的文件。最后的程序集由两个文件构成，两者必须随同新版本 SomeClassLibrary 程序集打包并部署到用户机器。顺便说一句，不能使用\
  \ AL.exe 的 **/embedresource** 开关将 XML 配置文件嵌入程序集文件，从而获得一个单文件程序集。因为 CLR 要求 XML 文件独立。\n\
  \n一旦生成这个发布者策略程序集，就可随同新的 SomeClassLibrary.dll 程序集打包并部署到用户机器。发布者策略程序集必须安装到 GAC。虽然\
  \ SomeClassLibrary 程序集也能安装到 GAC，但并不是必须的——它可以部署到应用程序基目录，也可部署到由 **codeBase** URL 标识的其他目录。\n\
  \n![](img/6fa065e17c4549db7260fbfaf4fd384e_93_0.png)\n\n> **重要提示** 只有部署程序集更新或 Service\
  \ Pack 时才应创建发布者策略程序集。执行应用程序的全新安装不应安装发布者策略程序集。\n\n关于发布者策略最后注意一点。假定发布者推出发布者策略程序集时，因为某种原因，新程序集引入的\
  \ bug 比它能修复的 bug 还要多，那么管理员可指示 CLR 忽略发布者策略程序集。这要求编辑应用程序的配置文件并添加以下 **publisherPolicy**\
  \ 元素：\n\n```xml\n<publisherPolicy apply=\"no\"/>\n```\n\n该元素可作为应用程序配置文件的 **<assemblyBinding>**\
  \ 元素的子元素使用，使其应用于所有程序集；也可作为应用程序配置文件的 **<dependentAssembly>** 元素的子元素使用，使其应用于特定程序集。当\
  \ CLR 处理应用程序配置文件时，就知道自己不应在 GAC 中检查发布者策略程序集。CLR 会沿用旧版本程序集。但要注意，CLR 仍会检查并应用 Machine.config\
  \ 文件中指定的任何策略。\n\n![](img/6fa065e17c4549db7260fbfaf4fd384e_93_1.png)\n\n> **重要提示**\
  \ 创建发布者策略程序集，发布者相当于肯定了程序集不同版本的兼容性。如果新版本程序集不兼容某个老版本，就不应创建发布者策略程序集。通常，如果需要生成程序集的 bug\
  \ 修复版本，就应该提供发布者策略程序集。作为发布者，应主动测试新版本程序集的向后兼容性。相反，如果要在程序集增加新功能，就应该把它视为与之前版本没有关联的程序集，不要随带发布者策略程序集。另外，也不必测试这类程序集的向后兼容性。\n"
- '# 第 II 部分 设计类型


  - 第 4 章 类型基础

  - 第 5 章 基元类型、引用类型和值类型

  - 第 6 章 类型和成员基础

  - 第 7 章 常量和字段

  - 第 8 章 方法

  - 第 9 章 参数

  - 第 10 章 属性

