  md: '# ## Chapter 7: Controlling Processes


    # ### Terms you’ 11 need to understand:


    +   * Process attributes

    * The ps, prstat, and pgrep commands

    * Signals

    * The kill and pkill commands

    * The cron and crontab commands

    * Crontab files


    # ### Techniques you’ 11 need to master:


    +   * Viewing process attributes using the ps, prstat, and pgrep commands

    * Terminating processes using the kill and pkill commands

    * Scheduling processes using the cron and at commands

    * Controlling use of the cron and at commands


    This chapter covers programs or processes running on the system. This control
    consists of viewing the status of processes, killing processes as needed, and
    scheduling the automatic starting of processes. The Process Control test objectives
    are covered in this chapter.


    # ## Viewing and Terminating Processes


    The ps(1), prstat(1M), and pgrep(1) commands are used to view attributes of processes,
    whereas the kill(1) and pkill(1) commands are used to terminate processes.


    # ### The ps Command


    The ps command is used to display information about active processes. Without
    any command-line arguments, the ps command displays processes that have the same
    effective user ID (UID) of the user account that executed the command. Table 7.1
    lists the command-line arguments supported by the ps command.


    | Table 7.1: The ps command-line arguments.

    | Argument | Description |

    |---|---|'
  merge: -1
  pgno: 148
- img_proc: true
  md: '| Table 7.1: The ps command-line arguments.

    | Argument | Description |

    | --- | --- |

    | -a | Displays all processes except process group leaders and processes not associated
    with terminals |

    | -A | Displays all processes (identical to -e) |

    | -c | Displays alternate columns |

    | -d | Displays all processes except process session leaders |

    | -e | Displays all processes |

    | -f | Uses the full listing display format |

    | -g Process Group ID | Displays processes with the specified process group ID
    |

    | -G Group ID | Displays processes with the specified group ID (GID) |

    | -J | Displays the session and process group ID |

    | -l | Uses the long listing display format |

    | -L | Displays information about each lightweight process (LWP) |

    | -n Name | Uses an alternate name list file (ignored) |

    | -o Format | Uses an alternate display format |

    | -p Process ID | Displays the process with the specified process ID (PID) |

    | -P | Displays the number of the processor executing the process (only meaningful
    on a multiprocessor system) |

    | -s Process Session ID | Displays processes with the specified process session
    ID |

    | -t Terminal Device Path | Displays processes associated with the specified terminal
    device path |

    | -u Effective User ID | Displays processes with the specified effective user
    ID |

    | -U Real User ID | Displays processes with the specified real user ID |

    | -Y | Displays alternate columns in long listing |


    A considerable amount of information on processes is available through the ps
    command and its several display formats.'
  merge: -1
