    # Techniques you’ 11 need to master:


    +   - Configuring the syslog facility

    - Enabling syslog messages to track the use of the root login account

    - Using the who, whodo, and last commands to audit login account usage


    The first part of this chapter covers the Solaris 8 syslog facility. This mechanism
    provides the ability to log user messages in one or more files on either the local
    or a remote system. This chapter covers the Solaris Syslog test objectives.


    The second part of this chapter describes three commands (who, whodo, and last)
    that are used to audit the usage of the login accounts.


    # The syslog Facility


    The syslog(1M) command accepts messages sent to it from system (kernel and device
    driver) and user programs and handles them based on the entries in the /etc/syslog.conf
    file. These messages can be reporting anything from emergency situations to debugging
    details. Common uses include monitoring logins and recording hacking attempts.
    Typically, the syslog command writes these messages to the specified log file,
    but other processing options are supported. A syslog message is categorized by
    its source, a source facility, and a priority, or severity level.


    # Source Facilities


    To provide better control over the handling of log messages, the facilities generating
    the messages can be used to determine where the messages are sent or stored. Thus
    you can'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'maintain separate log files for different types of messages based on the source.
    Table 14.1 lists the keywords used in the /etc/syslog.conf file to identify the
    source of messages and control handling.


    Table 14.1: The syslog source facilities.

    | Keyword | Description |

    | auth | Login authentication |

    | cron | The at (1) and cron (1M) commands |

    | daemon | System daemons |

    | kern | The kernel |

    | lpr | The line printer spooling system |

    | local0 through local7 | As defined locally |

    | mail | System mail |

    | mark | Timestamp produced by syslogd(1M) |

    | news | The USENET network news system |

    | user | User programs |

    | uucp | The UUCP system |

    | * | All facilities except mark |


    The user facility is the default and is used if the source does not specify a
    facility keyword in the syslog message.


    # Priority (Severity) Levels


    Along with the source, a syslog message can be identified by priority or severity.
    This identification provides a second mechanism (with finer granularity) for handling
    messages based on importance. Table 14.2 lists the keywords used in the /etc/syslog.conf
    file to identify the source of messages and control handling. These keywords are
    ordered on the basis of severity (from most severe to least severe).


    Table 14.2: The syslog severity levels.

    | Keyword | Description |

    | emerg | Panic conditions |

    | alert | Conditions that need immediate attention |

    | crit | Critical conditions |

    | err | Other errors |'
