  md: '# Chapter 11: Sample Test I


    This chapter provides pointers to help you develop a successful test-taking strategy,
    including how to choose proper answers, how to decode ambiguity, how to work within
    the Solaris testing framework, how to decide what you need to memorize, and how
    to prepare for the test. At the end of the chapter are 57 questions on the topics
    that pertain to Exam 310-011, "Sun Certified System Administrator for Solaris
    8, Part I."


    Keep in mind that to become certified, you must pass this exam and a second exam
    (310-012). The sample test for the second exam is in Chapter 22.


    # Questions, Questions, Questions


    There should be no doubt in your mind that you are facing a test full of specific
    and pointed questions. The Part I exam is a fixed-length; will include 57 questions,
    and you''ll be allotted 90 minutes to complete it. You''ll be required to achieve
    a score of 66 percent or better to pass the exam.


    For this exam, questions belong to one of four types:


    +   * Multiple choice (with a single answer)

    * Multiple choice (with multiple answers)

    * Multiple match (drag and drop)

    * Fill in the blank (free choice)


    Always take the time to read a question at least twice before selecting an answer,
    and always look for an Exhibit button as you examine each question. Exhibits include
    graphics related to a question. An exhibit is a screen capture of program output
    or GUI information that you must analyze to analyze the question''s contents and
    to formulate an answer. The Exhibit button brings graphics and charts used to
    help explain a question, provide additional data, or illustrate program behavior.


    Not every question has only one answer; many questions require multiple answers.
    If you don''t select all the correct answers, you will not get credit for answering
    the question correctly. Therefore you need to read each question carefully to
    determine how many answers are necessary or possible and to look for additional
    hints or instructions when selecting answers. Such instructions often occur in
    brackets immediately following the question itself (as they do for all multiple-choice,
    multiple-answer questions). Unfortunately, some questions do not have straightforward
    correct answers and you''re forced to find the "most correct" choice.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'The multiple-match (drag and drop) questions are new to the Solaris exams and
    require you to match, for example, terms with definitions. On the real exam, you
    will use the mouse to drag and drop one part (such as the term) so that it is
    in front of its definition. These questions will be easy to know or all but one
    of the matches. If you don''t know two or more, this type of question could be
    a problem. We''ve included several multiple-match questions (more than you''ll
    see on the exam). Because you can''t use a mouse on the questions in this book,
    you''ll need to match the a, b, c, ... items with the 1, 2, 3, ... items.


    # Picking Proper Answers


    Obviously, the only way to pass any exam is to select enough of the correct answers
    to obtain a passing score. However, the exams are not standardized like the SAT
    and GRE exams; in some cases, questions are strangely worded, and deciphering
    them can be a real challenge. In those cases, you might need to rely on answer-elimination
    skills. You can almost always immediately eliminate at least one answer of the
    possible choices for a question because it matches one of these conditions:


    +   - The answer not apply to the situation.

    - The answer describes a nonexistent issue, an invalid option, or an imaginary
    state.

    - The answer can be eliminated of the question itself.


    After you eliminate all answers that are obviously incorrect, you can apply your
    retained knowledge to eliminate further answers. Look for items that sound correct
    but refer to actions, commands, or features that are not present or not available
    in the situation that the question describes.


    If you''re faced with a blind guess among two or more potentially correct answers,
    reread the question. Try to picture how each of the remaining answers would alter
    the situation. Be sensitive to terminology; sometimes the choice of words (print
    instead of display) can make the difference between a right answer and a wrong
    one.


    Only when you''ve exhausted your ability to eliminate answers, remain unclear
    about which of the remaining possibilities is correct, you guess at an answer.
    An unanswered question offers you points, but guessing gives you at least some
    chance of getting a question right; just don''t be too hasty when making a blind
    guess.


    # Exam Alert


    Because you''re taking a fixed-length test, you can wait until the last round
    of reviewing marked questions (just as you''re to run out of time or of unanswered
    questions) before you making guesses. Guessing should be your technique of last
    resort!'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# # Decoding Ambiguity


    You''ll discover that many exam questions test your knowledge of things that are
    not directly related to the issue that a question raises. This means that the
    answers you must choose from even incorrect ones are just as much part of the
    skill assessment as the question itself. If you don''t know something about a
    variety of system administration topics, you might not be able to eliminate obviously
    wrong answers because they relate to a different area of system administration
    than the area the question at hand is addressing. In other words, the more you
    know about Solaris administration, the easier it will be for you to tell a right
    answer from a wrong one.


    Questions often give away their answers, but you have to be alert to see the clues.
    Often, subtle hints appear in the question in such a way that they seem almost
    irrelevant to the situation. You must realize that each question is test unto
    and that you need to inspect and successfully navigate each question to pass the
    exam. For small clues, as a reference to raw as opposed to block devices and invalid
    commands. Little things like these can point to the right answer if you properly
    understand the question; if missed, they leave you a blind guess.


    Another difficulty with certification exams is vocabulary. Be sure to brush up
    on the key terms presented at the beginning of each chapter.


    # # Working within the Framework


    The test questions appear in random order, and many elements or issues mentioned
    in one question might also crop up in other questions. It''s not uncommon to find
    that an answer to one question is the correct answer to another question and vice
    versa. Take the time to read every answer to each question, if you recognize the
    correct answer to a question immediately. Extra reading might spark a memory or
    remind you about a function or command that helps you on another question elsewhere
    in the exam.


    Because you''re taking a fixed-length test, you can revisit any question as many
    times as you like. If you''re uncertain of the answer to a question, check the
    book that''s provided to mark it for easy return later on. You should also mark
    questions that you think offer information that you can use to answer other questions.
    The testing software is designed to let you mark every question if you choose;
    use this framework to your advantage. Everything''ll want to see again should
    be marked; the testing software can then help you return to marked questions quickly
    and easily.


    # # Deciding What to Memorize'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'The amount of memorization that you must undertake for an exam depends on how
    well you remember what you''ve read and how well you know Solaris system administration
    by heart. The tests will stretch your recollection of system administration commands
    and functions.


    At a minimum, you''ll need to memorize the following kinds of information for
    Part 1:


    +   - File system administration and maintenance (creating, backing, up, and restoring)

    - Commands related to file Access Control Lists (ACLs) and standard access permissions

    - Commands related to user administration (creating, modifying, and deleting user/accounts)

    - The basic command syntax and use of metacharacters.


    For the Part II exam, be sure to memorize information about:


    +   - NFS

    - NIS

    - JumpStart


    If you work your way through this book while logged in as root to a Solaris 8
    system and try to manipulate this environment''s features and functions as they''re
    discussed, you should have little or no difficulty mastering this material. In
    addition, don''t forget that the Cram Sheet at the front of the book is designed
    to capture the material that''s most important to memorize; use this guide to
    answer your studies well.


    # Preparing for the Test


    The best way to prepare for the test—after you''ve studied—is to take at least
    one practice exam. One is included in this chapter for that reason; the test questions
    are located in the pages that follow (and, unlike the preceding chapters in this
    book, the answers don''t follow the questions immediately; you''ll have to flip
    to Chapter 12 to review the answers separately).


    Give yourself 90 minutes to take the exam, keep yourself on the honor system,
    and don''t look back at the text in the book or jump ahead to the answer key.
    When your time is up or you finished the questions, you can check your work in
    Chapter 12. Pay special attention to the explanations for the incorrect answers;
    they also help reinforce your knowledge of the material. Knowing how to recognize
    correct answers is good, but understanding why incorrect answers are wrong can
    be equally valuable.


    Also, review all the questions at the end of each chapter. They cover the topics
    from a different point of view in the questions in this sample test. This review
    should help you better understand the similarities and differences between related
    topics.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Taking the Test


    Relax. Once you''re sitting in front of the testing computer, there''s nothing
    more you can do to increase your knowledge or preparation. Take a deep breath,
    stretch, and start reading that first question.


    There''s no need to rush; you have plenty of time to complete each question and
    return to those questions that you skip or mark for return. If you read a question
    twice and remain clueless, you can mark it. Both easy and difficult questions
    are intermixed throughout the test in random order. Don''t cheat yourself by spending
    too much time on a difficult question early on in the test, thereby depriving
    yourself of the time you need to answer the questions at the end of the test.


    On a fixed-length test, you can read through the entire test, and before returning
    to marked questions for a second visit, figure out how much time you have to answer
    each question. As you answer each question, remove its mark. Continue to review
    the remaining marked questions until you run out of time or you complete the test.


