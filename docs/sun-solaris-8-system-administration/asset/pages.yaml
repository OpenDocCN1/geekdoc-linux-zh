  md: 'File permissions determine the operations that can be performed on files and
    directories along with who can perform these operations. Solaris 8 provides two
    types of file permissions: standard, which provides basic security; and extended,
    which expands the standard permissions.


    # Standard File Permissions


    Files and directories can have read, write, and execution permissions. You can
    assign permissions to three classes of system accounts: the user account that
    owns the file, the group account that has group permissions, and everyone else.
    These are referred to as *user*, *group*, and *other* permissions. The read, write,
    and execution permissions for user, group, and other can be set independently
    of one another.


    You use two types of notation to specify file permissions (also known as the *file
    access mode*): absolute mode and symbolic mode. *Absolute mode* (also referred
    to as *octal*) is a numeric value assigned to each permission per account. Table
    5.4 lists the absolute modes.


    | Absolute Mode | Description |

    |---|---|n| 001 | Other execution |

    | 002 | Other write |

    | 004 | Other read |

    | 010 | Group execution |

    | 020 | Group write |

    | 040 | Group read |

    | 100 | User execution |

    | 200 | User write |

    | 400 | User read |


    The access mode of a file is determined by adding these absolute modes (user permissions
    + group permissions + other permissions). For example, a file that has user read
    (400) and user write (200) but no other permissions for group or other will have
    an access mode of 400 + 200, or 600. Adding group read (040) and group write (020)
    to this file results in an access mode of 600 + 60, or 660. Adding other read
    (004) and other write (002) results in 666. Adding user execution (100) results
    in a file access mode of 766.


    The other type of symbolic mode. Using this mode, read access is represented by
    the letter *r*, write by the letter *w*, and execution by the letter *x*. The
    letters *u*, *g*, and *o* are used to represent user, group, and other permissions,
    respectively. Symbolic mode supports adding permissions (+), removing permissions
    (-), and setting only the specified permissions (=).'
  merge: -1
  pgno: 102
