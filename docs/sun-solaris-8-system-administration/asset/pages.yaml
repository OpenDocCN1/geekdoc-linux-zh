  md: '# The Superuser (Root) Account


    The root, or superuser, account is a special administrative account that provides
    the ultimate access to data and services, because it can override any file permissions
    on the system. To enforce good system security, you must restrict access to the
    superuser account and monitor it as closely as possible. Solaris 8 provides several
    ways to restrict and monitor the superuser account, as discussed in the following
    sections.


    # Restricting and Monitoring the Superuser Account


    You can restrict the root account so that it cannot log in to the system remotely;
    instead, it must log in from the system console. This restriction can be enforced
    by the following entry in the /etc/default/login:


    ```

    CONSOLE=/dev/console

    ```


    By default, the root account is restricted. To disable this feature, edit the
    /etc/default/login file and put the shell comment character (#) at the beginning
    of the entry.


    Restricting the root login to the console forces accessing the superuser account
    remotely to log in with a regular system account and use the su(M) command to
    become the superuser. You can monitor and the use of the su command in several
    ways. The /etc/default/su file controls monitoring and logging.


    To display use of the su command on the system console, add the following entry
    to the /etc/default/su file:


    ```

    CONSOLE=/dev/console

    ```


    Both failed and successful attempts to use the su command are displayed on the
    console. By default, the use of the su command is not displayed on the console.
    To enable this feature, edit the /etc/default/su file and remove the shell comment
    character (#) at the beginning of the entry. Note that this entry is identical
    to the entry used in the /etc/default/login file to restrict root login to the
    system console.


    The following examples show the messages displayed on the console for two uses
    of the su command. The first shows an unsuccessful attempt to become root on the
    system solaris8 from the login dia. The second shows a successful attempt to become
    the root. The messages begin with a date regardless of the CONSOLE entry in the
    /etc/default/su file. The message beginning with SU is displayed because the CONSOLE
    entry in the /etc/default/su file is uncommented:


    ```

    Mar 29 02:46:01 solaris8 su: ''root'' failed for dla

    on /dev/pts/5

    ```'
