  md: '# # Chapter 13: The Solaris Network Environment


    Terms you’ 11 need to understand:


    +   * OSI network model

    * TCP/IP network model

    * Ethernet address

    * Network class

    * TCP/IP configuration files

    * Server and client

    * Standalone workstation

    * File server

    * Diskless client

    * AutoClient


    Techniques you’ 11 need to master:


    +   * Configuring TCP/IP on a Solaris 8 system

    * Checking the status of a remote system

    * Checking the status of the network interface

    * Distinguishing between standalone, diskless, and AutoClient configurations


    The first part of this chapter covers basic network concepts such as the OSI and
    TCP/IP network models along details on the TCP/IP implementation. The Solaris
    Network Environment test objectives are covered by this part of the chapter.


    The second part of this chapter covers the concepts and components of the different
    types of Solaris 8 configurations, including standalone systems, diskless clients,
    and AutoClients. This part of the chapter covers the Client Server Relationship
    test objectives.


    # # Networking Models


    Although a variety of networking models have been developed over the years, most
    of the commercially available networks use one of the following models:'
  merge: -1
  pgno: 268
- img_proc: true
  md: '+   - The Open System Interconnection (OSI) model

    - The Transmission Control Protocol/Internet Protocol (TCP/IP) model


    Of these two, the TCP/IP model predominates.


    # # The Open System Interconnection Model


    The OSI network model developed by the International Standards Organization (ISO)
    consists of seven layers of services. Each layer is responsible for handling a
    different aspect of network communication.


    When sending data, each layer performs its processing on the data and passes it
    to the next layer. When receiving data, each layer performs its processing on
    the data and passes it to the next higher layer.


    This layered approach allows different types of processing (services) to be developed
    without having to develop all layers of the model. The new service is linked to
    the stack of layers or protocol stack at the appropriate layer.


    The seven ISO/OSI layers (from lowest to the highest):


    +   - *Physical*—The first layer is concerned with the physical interface between
    devices. It controls the transmission of a bit stream over the physical medium
    and has to deal with the mechanical and electrical characteristics of the physical
    medium.

    - *Data Link*—The second layer provides error detection and control. It adds reliability
    to the Physical Layer by grouping bits into frames and providing synchronization,
    error control, and flow control over the frames. Basically, it controls the transfer
    of data across a network media.

    - *Network*—The third layer is responsible for determining a path through the
    network between systems that wish to communicate. It understands the data communication
    and switching technologies used to interconnect systems.

    - *Transport*—The fourth layer provides end-to-end error recovery and flow control.
    These services provide reliability to the layer and ensure that the data is delivered
    without errors and in sequence duplication.

    - *Session*—The fifth layer provides a control structure for communication between
    applications. It is responsible for establishing, maintaining, and terminating
    connections.

    - *Presentation*—The sixth layer handles the differences in data representation
    or syntax. This layer maps data between formats so that the application can understand
    the data.

    - *Application*—The seventh layer provides user utilities such as remote login,
    file transfers, and so on.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# The Transmission Control Protocol/Internet Protocol (TCP/IP) Model


    Like the OSI network model, the TCP/IP network model consists of a stack of service
    layers. Unlike the OSI model, it provides the same functionality using five layers
    instead of seven. For the most part, the four lowest layers of the OSI and TCP/IP
    networks provide similar functionality; the top three OSI layers (Session, Presentation,
    and Application) are grouped into the TCP/IP Application Layer.


    The five TCP/IP layers (from lowest to the highest) are:


    +   * Physical—The first layer is concerned with the physical interface between
    devices. It controls the transmission of a bit stream over the physical medium
    and deals with the mechanical and electrical characteristics of the physical medium.

    * Data Link—The second layer provides error detection and control. It adds reliability
    to the Physical Layer by grouping bits into frames and providing synchronization,
    error control, and flow control over the frames. This layer provides delivery
    of data between systems using a media or hardware address, such as the Ethernet
    or Media Access Control (MAC) address.

    * Network—The third layer is responsible for determining a path across the Internet
    between systems that communicate. It understands the data communication and switching
    technologies used to interconnect systems. This layer manages the network addressing
    and routing of data, locates the remote host based on its assigned Internet Protocol
    (IP) address, and determines the path through the network (route) to deliver data.
    Data at this layer is typically referred to as datagrams.

    * Transport—The fourth layer provides end-to-end error recovery and flow control.
    These services provide reliability to the layer and ensure that the data is delivered
    without errors and in sequence without duplication. This layer controls the exchange
    and flow of data. Data at this layer typically referred to as packets.

    * Application—The fifth layer provides user utilities such as remote login, file
    transfers, and so on. Data at this layer typically referred to as messages or
    streams.


    Figure 13.1 provides a side-by-side comparison of the OSI and TCP/IP networking
    models.


    | ISO/OSI Network Model | TCP/IP network models |

    |---|---||

    | 7 Application | |

    | 6 Presentation | Application |

    | 5 Session | |

    | 4 Transport | Transport |

    | 3 Network | Network |

    | 2 Data Link | Data Link |

    | 1 Physical | Physical |


    Figure 13.1: OSI and TCP/IP networking models.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# TCP/IP Networking


    The Solaris operating system supports the TCP/IP networking model. Although Solaris
    can use several types of networking hardware architectures such as Ethernet, Token
    Ring, and Fiber Distributed Data Interface (FDDI) to communicate with other systems,
    Ethernet is the de facto networking architecture.


    # Features and Functions of Ethernet


    The Data Link Layer of the TCP/IP model controls the transfer of data across a
    network media. In an Ethernet Local Area Network (LAN), the Ethernet frame is
    used at the Data Link Layer to package and transmit the data.


    The hosts on an Ethernet LAN are assigned unique addresses that are associated
    with the Data Link Layer. These addresses are referred to as *Ethernet addresses,
    hardware addresses, physical addresses*, or MAC addresses.


    Typically, the corporation that manufactures the Network Interface Card (NIC)
    assigns these addresses, and a unique address is associate with each NIC. The
    Ethernet address is associated with the NIC, not with a system. A system with
    two NICs (such as a router connected to two networks) will have two Ethernet addresses.


    The Ethernet address consists of 48 bits (6 bytes of data). Typically, an Ethernet
    address is shown as six two-digit hexadecimal numbers separated by colons. For
    example, `00:40:05:37:9d:db` is the Ethernet address for the system used to generate
    most of the listings in this book.


    The Ethernet frame transmitted on the LAN contains the Ethernet address of the
    NIC that should receive and respond to the frame. All hosts on a LAN receive all
    transmitted frames. Any received frames with an Ethernet address that matches
    the address of the NIC are read and processed.


    The Ethernet addresses are used only on the LAN and do not pass through routers.
    Thus, an Ethernet frame sent to a host that is not on the current LAN will use
    the Ethernet address of the router as its destination. Likewise, an Ethernet frame
    sent from a router to a host will have the Ethernet address of the router as its
    source.


    However, most TCP/IP applications use hosting IP addresses. Typically, the IP
    address needs to be converted to an Ethernet address. Because each host has a
    unique IP address and a unique Ethernet address, a process is needed to map between
    these two addresses.


    # The Address Resolution Protocol and the Reverse ARP'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'This process to map between Ethernet and IP addresses is referred to as *address
    resolution*. The protocol used to map from an IP address to an Ethernet address
    is referred to as the Address Resolution Protocol (ARP). The details of this process
    are specified in Request for Comment (RFC) 826, "An Ethernet Address Resolution
    Protocol."


    In some cases, an Ethernet address is known, the IP address needs to be determined.
    This process is known as the Reverse Address Resolution Protocol (RARP). The details
    of this process are specified in RFC 903, "A Reverse Address Resolution Protocol."


    A host that needs to resolve an Ethernet address request basically asks, *What
    is the Ethernet address of the host with this IP address?* Note that the ARP request
    is an Ethernet broadcast; that is, the destination Ethernet address of the frame
    is all ones (*FF:FF:FF:FF:FF:FF*). The host that matches the specified IP address
    responds with an ARP reply that contains its Ethernet address. This is part of
    the Data frame.


    The same process is used to resolve an IP address when the Ethernet address is
    known. An RARP request is broadcast (destination Ethernet address of *FF:FF:FF:FF:FF:FF*)
    that contains an Ethernet address in the Data. The appropriate host responds with
    a RARP reply that contains the requested IP address.


    Sometimes it may be necessary for a system to respond to an ARP or RARP request
    on behalf of another system. This process is referred to as *proxy ARP*; some
    protocol stacks (typically routers) are designed with this capability.


    # Classes of IP Networks


    In the TCP/IP network model, the IP at the Transport Layer is used to segregate
    networks into classes. The three most commonly used IP classes are A, B, and C.
    Table 13.1 provides a summary of the characteristics of these different IP classes.


    Table 13.1: IP address classes.


    | Class | First Octet | Default Subnet Mask | Maximum Theoretical Hosts |

    |---|---|---|--|

    | A | 1 through 126 | 255.0.0.0 | 16, 777, 216 |

    | B | 128 through 191 | 255.255.0.0 | 65, 536 |

    | C | 192 through 223 | 255.255.255.0 | 256 |


    Addresses with a first octet of 127 are not considered as part of either Class
    A or Class B. It is dedicated for a special use referred to as "loopback." The
    subnet mask is used to separate the network portion of an IP address from the
    host port.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# TCP/IP Configuration Files


    Solar 8 uses several files to configure the TCP/IP environment. These files are
    used to identify both the hostname and the IP address of the system. The following
    three files are used to configure TCP/IP:


    +   - /etc/inet/hosts

    - /etc/nodename

    - /etc/hostname.interface


    The next sections show these files in depth.


    # The /etc/inet/hosts File


    The /etc/inet/hosts file (which is a symbolic link to /etc/inet/hosts) contains
    a listing of hostnames and their associated IP addresses. This file is used to
    convert hostnames to IP addresses. Table 13.2 summarizes the format of the /etc/inet/hosts
    file.


    | Table 13.2: /etc/inet/hosts file format |

    |---||

    | Column | Description |

    | IP Address | IP address in dotted decimal notation |

    | Host Name | Hostname or node name of the system |

    | Alias | Alternate hostname(s) for the system |


    The columns are separated by one or more tab or space characters. If more than
    one alias is defined, you should separate them using either spaces or tabs.


    > At a minimum, the /etc/inet/hosts file should contain an entry for the localhost
    (IP address 127.0.0.1) and an entry for each network interface installed on the
    system.


    Additional entries can be added to the /etc/inet/hosts file for other systems.
    If a name service is not being used, doing so allows access to the remote systems
    using hostnames instead of IP addresses.


    # The /etc/nodename File


    The /etc/nodename file contains only one entry: the default hostname of the local
    system. You should assign the hostname or node name in accordance with RFC 952,
    "DOD Internet Host Table Specification."


    # The /etc/hostname. interface File'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'One /etc/hostname.interface file exists for each network interface installed
    on the system. The interface portion of the file reflects the manufacturer and
    type of network interface. For example, if an Intel x86–based system has a single
    3COM Etherlink III network interface installed, the file name is /etc/hostname.lex0.
    For a SPARC 5 platform with two network interfaces, the file names are /etc/hostname.le00
    and /etc/hostname.le1.


    The /etc/hostname.interface file(s) should contain only one entry: the hostname
    or the IP address assigned to that interface.


    +   Exam Alert If a hostname is used, that must also be listed in the /etc/inet/hosts
    file. Note that if more than one network interface is installed on the system,
    the /etc/hostname.interface files will contain different hostnames. Only the hostname
    (or IP address) that matches the hostname defined in the /etc/nodename file is
    considered the default hostname for the system.


    # Checking Network Connectivity


    Solaris 8 provides two commands for checking network connectivity between systems
    and the proper operation of the network interfaces on both systems: the **ping**(1M)
    command and the **spray**(1M) command.


    # The ping Command


    The /usr/bin/ping command uses the Internet Control Message Protocol (ICMP) to
    send ECHO_REQUEST datagrams to another host. When a host receives an ECHO_REQUEST
    datagram, it responds with an ECHO_REPLY datagram. This basic echo mechanism is
    used to verify the connectivity between two hosts and the proper operation of
    the network interfaces and protocol stacks up to Internet layer where the IP resides.
    The following listing shows one ICMP ECHO_REQUEST datagram using the **ping**
    command:


    ```

    $ /usr/bin/ping

    solaris8 is alive

    $

    ```


    Table 13.3 lists some of the most frequently used command-line arguments supported
    by the **ping** command. See the **ping**(1M) manual page for more details.


    | Table 13.3: The ping command |

    | Argument | Description |

    | -i interface | Uses the specified interface address |

    | -I interval | Specifies an interval between transmissions (default of 1 second)
    |


    274'
  merge: -1
  pgno: 274
