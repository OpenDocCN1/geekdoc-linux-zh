  md: '# Using the man Command


    Even though both printed Reference Manual and AnswerBook2 are available, the test
    objectives for Part I include the online man pages as a requirement. The man(1)
    command is used to display one or more man pages specified as command-line arguments.
    Table 2.3 lists the command-line arguments available with the man command.


    Table 2.3: Command-line arguments for the man command.


    | Argument | Description |

    | - | - |

    | name | The name of a Solaris command, file, and so on, that is described by
    a man page of the same name. At least one name is required by all arguments except
    the -f, -k, and -M arguments. More than one name (separated by spaces) can be
    specified. |

    | - | Don''t automatically send output through the man(1) command (which provides
    pagination, underlining, and so on). |

    | -a | Display all pages that match the specified name (regardless of section).
    |

    | -d | Display debug information (search methods used, sections searched, and
    so on) used to locate the man page. |

    | -f file | List man pages that reference the specified file (requires pre-formatted
    man pages). More than one file can be specified (separated by spaces). Note that
    this argument is used to locate a file referenced in the man, not a man page (therefore,
    it does not require a man page argument). |

    | -F | Force a search of all man sections for the name instead of using the windex
    database to locate man pages (windex is associated with preformatted man pages).
    |

    | -k keyword | Print a summary of all windex entries that contain the specified
    keyword (preformatted man pages only). More than one keyword can be specified
    (separated by spaces). Note that this argument is used to locate keywords in a
    database, not a man page (therefore, it does not require a man page argument).
    |'
