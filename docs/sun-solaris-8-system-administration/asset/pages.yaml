    # Mounting NFS Resources


    NFS resources that have been shared by an NFS server can be mounted by an NFS
    client using the mount(1M) command and unmounted using the unmount(1M) command.
    In addition, any NFS resources identified in the /etc/vfstab file are automatically
    mounted at system boot or when the mountall(1M) command is used. Likewise, the
    NFS resources listed in the /etc/mnttab file are unmounted by using the unmount(1M)
    command.


    # The mount Command


    The **mount** command is used to mount NFS resources like any other standard Solaris
    system so that NFS clients can mount and access them. For NFS, you specify the
    hostname (or Internet Protocol [IP] address) and pathname of the shared directory
    as a command-line argument followed by a point (:).


    The generic mount command-line arguments are listed in Table 18.2. A few of the
    more significant NFS-specific options used with the -o command-argument are listed
    in Table 18.3 (multiple NFS-specific options are separated by commas). For additional
    information, see the **mount_nfs**(1M) page in the *System Reference Manual*.


    Table 18.2: The mount command-line arguments.

    | Argument | Description |

    | --- | --- |

    | **-F** *fst* | Specifies the file system type |

    | **-m** |s the file system without creating an /etc/mnttab entry |

    | **-o** | Specifies NFS-specific options (see Table 18.3) |

    | **-O** | Overlays an existing mount point |

    | **-r** |s the file system read-only |


    Table 18.3: The mount command''s NFS-specific options.

    | Option | Description |

    | --- | --- |

    | | |'
