    # # Open Network Computing (ONC) and the Remote Procedure Call Mechanism


    Sun Microsystems has developed an environment for supporting distributed services.
    This environment is referred to as Sun’s Open Network Computing Plus (ONC+) Technologies.
    ONCT is a family of technologies, services, and tools. The main components are:


    +   * Network File System (NFS) and Network Information Service Plus (NIS+) services.
    They use RPCs to accomplish the client-server interaction.

    * Remote Procedure Call (RPC)—A mechanism that allows a client to request a remote
    server to execute a procedure.

    * External Data Representation (XDR)—A machine-independent data representation.
    Both clients and servers translate data into out of the XDR format. This mechanism
    provides a standardized format for all data to overcome differences in data byte
    ordering, data type size, and byte alignment between different hardware architectures.

    * Transport Layer Interface (TLI)—An interface to TCP/IP that allows the RPC mechanism
    to be protocol independent. You can select a connection-oriented protocol (such
    as TCP) or a connectionless protocol (such as UDP) without making changes to the
    client or server code.

    * Sockets—Another mechanism that can be used to interface with TCP/IP that supports
    protocol-independent client and server programming.


    In the TCP/IP model, all the ONC components reside in the Application Layer. In
    the OSI model, these components are distributed among the Session Layer (RPC),
    Presentation Layer (XDR), and Application Layer (NFS and NIS+). Note that the
    applications call XDR routines to translate the data. Once translated, the data
    is either processed locally or passed to RPC routines to send the data to a remote
    system.


    # # Registering RPC Services'
