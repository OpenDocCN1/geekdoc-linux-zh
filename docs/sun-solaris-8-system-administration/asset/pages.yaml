  md: 'In order for systems to use distributed services built on RPC, the programs
    that provide services must be identified (registered). The rpcbind(1M) daemon
    manages RPC services on a system. Each RPC program is assigned a unique number.
    When a RPC program starts, it contacts the local rpcbind daemon and provides its
    RPC program version, and so on. When a remote client attempts to use a local RPC
    service, it contacts the local rpcbind daemon to obtain information (based on
    RPC program number) about the service and requests a connection to it. Thus the
    rpcbind daemon provides a method for local services to register their availability
    and remote clients to identify the services and establish a connection to them.


    You can use the rpcinfo(1) command to contact the local or remote rpcbind daemon
    and request it to list the currently registered rpc services. The following listing
