    # Techniques you'' 11 need to master:


    +   * Assessing your exam-readiness

    * Preparing to take a certification exam

    * Practicing (to make perfect)

    * Making the best use of the testing software

    * Budgeting your time

    * Saving the hardest questions until last

    * Guessing (as a last resort)


    As experiences, test-taking is not something that most people anticipate eagerly,
    no matter how well they''re prepared. In most cases, familiarity helps amelior
    test anxiety. In plain English, this means you probably won''t be nervous when
    you take your fourth or fifth certification exam as you will be when you take
    your first one.


    Whether it''s your first test or your tenth, understanding the exam-taking particulars
    (how much time to spend on questions, the setting you''ll be in, and so on) and
    the testing software will help you concentrate on the material rather than on
    the environment. Likewise, mastering a few basic test-taking skills should help
    you recognize—and perhaps even outfox—the tricks and gotchas you''re bound to
    find in some of the test questions.


    In this chapter, I''ll explain the testing environment and software, as well as
    describe some test-taking strategies that you should be able to use to your advantage.


    # Assessing Exam-Readiness'
