    # Directories


    Several commands let you create, move, and delete directories:


    +   * mkdir(1)—Creates a directory.

    * mv(1)—Moves a file or directory.

    * rmd(1) or rm(1)—Removes a directory.


    # Creating Directories Using the mkdir Command


    **The mkdir(1)** command creates the directory specified as a command-line argument.
    The command-line argument can be an absolute (/) path name or a path name relative
    to the current directory. The directory will be owned by the user account used
    to create the directory and by the owner''s group. It will be created with access
    permissions based on the current **umask** or the access permissions specified
    by the **-m mode** command-line argument, where **mode** is a set of permissions
    defined using absolute mode format. To create multiple directories, specify them
    as command-line arguments (separated by spaces).


    Normally, the directory in which the new directory is to be created must already
    exist. However, if you specify the -p command-line argument, any necessary parent
    directories are created. The following examples show several uses of the **mkdir**
    command. The first creates a directory using the **umask** permissions. The second
    creates a directory with specified permissions. The third fails, because a necessary
    parent directory does not exist. The fourth **mkdir** command uses the **-p**
    argument to create the parent directory:


    ```

    # mkdir exam

    # ls -l exam

    total 0


    # ls -ld exam

    drwxr-xr-x 2 root  other  512 Apr 13 17:32 exam


    # mkdir -m 777 test2

    ```'
