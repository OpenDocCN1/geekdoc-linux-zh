    This chapter covers system basics, including navigating the Unix directory tree,
    using the vi editor and accessing remote systems. This chapter covers the Basic
    Command Syntax, Editor, and Remote Connection test objectives.


    # The Unix Directory Tree


    The Unix data storage facility is a collection of directories that contain files
    and other directories. These files and directories are organized in a hierarchical
    structure with the root (/) directory as the starting point. Thus the Unix data
    storage is organized in the form of an inverted tree with branches and files as
    leaves.


    # Metacharacters


    Metacharacters are characters or combinations of characters that can be used to
    represent all or portions of directory or file names. Metacharacters allow a short
    phrase to represent a longer directory/file name or even a series of directory/file
    names. The three standard shells (Bourne, C, and Korn) support the metacharacters
    listed in Table 10.1.


    | Table 10.1: Directory/File name metacharacters |'
  merge: -1
  pgno: 215
- img_proc: true
  md: '| Metacharacter | Description |

    | --- | --- |

    | ? | Matches any single character. |

    | * | Matches zero or more occurrences of any character. |

    | [...] | Represents a set of characters of which any one character can match.
    Commonly used character sets can be represented as ranges. For example, lowercase
    letters [a-z], uppercase letters [A-Z], and numbers ([0-9]) are frequently used.
    |


    An example will best illustrate the use of metacharacters. Given a set of files,
    file, through representing the following metacharacters as an argument to the
    `ls` command to represent all 26 of these files:

    ls file[abcdefghijklmnopqrstuvwxyz]

    ls file[a-ef-jk-op-tu-z]

    ls file[a-mn-z]

    ls file[a-z]

    ls file*

    ls file?


    Thus metacharacters can be used to reference files that have a common prefix or
    a common suffix. For example, given a C source code files that all end with the
    .c extension, you can reference all these files using the *.c metacharacter expression.


    #  Tree Navigation


    When a user logs in to the system, the user is positioned somewhere in the Unix
    directory tree—typically in the home directory of the user account. The current
    directory, referred to as the current working directory, can be displayed using
    the `pwd(1)` command.


    The user can move around the directory tree using the `cd(1)` command. When used
    without command-line arguments, cd relocates the user to the directory specified
    by the HOME environmental parameter (typically the home directory of the user
    account). A new directory can be specified as a command-line argument. If the
    directory exists and has execution permission for that directory, then the user
    is relocated to that directory. The new directory can be specified using a complete
    directory name, a partial directory name and metacharacters, or (in a few cases)
    all metacharacters.


    The new directory can also be specified as a `full` or `absolute path name` starting
    with the root (/) directory, or a `partial` or `relative path name` starting at
    the current working directory. You can'
