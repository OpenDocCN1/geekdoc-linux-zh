    # # The Testing Situation


    When you arrive at the Sylvan Prometric Testing Center where you scheduled your
    test, you''ll need to sign in with a test coordinator. He or she will ask you
    to produce two forms of identification, one of which must be a photo ID. Once
    you''ve signed in and your time slot arrives, you''ll be asked to leave any books,
    bags, or other items you brought with you, and you''ll be escorted into a console
    room. Typically, that room will be furnished with anywhere from one to half dozen
    computers, and each workstation will be separated from the others by dividers
    to keep you from seeing what''s happening on someone else''s computer.


    You''ll be furnished with a pen or pencil and a blank sheet of paper, or in some
    cases, an erasable plastic sheet and an eras-tip pen. You''re allowed to write
    down any information you want on this sheet, and you can write on both sides of
    the page. I suggest that you memorize as much as possible of the material that
    appears on the Cram Sheet (inside the front of this book) and then write that
    information on the blank sheet as soon as you sit down in front of the test machine.
    You can refer to the test any time you like during the test, but you''ll have
    to surrender it when you leave the room.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Most test rooms feature a wall with a large window. This allows the test coordinator
    to monitor the room, to prevent test-takers from talking to one another, and to
    observe anything out of the ordinary that might be going on. The test coordinator
    will preloaded the Solaris certification exam that you''ve signed up for, and
    you''ll be permitted to start as soon as you''re seated in front of the machine.


    Each Solaris certification exam permits you to take up to 90 minutes to complete
    the test (the test itself will tell you, and it maintains an on-screen counter/clock
    so that you can check the time remaining whenever you like). Part I consists of
    57 questions and Part II consists of 61 questions, randomly selected from a pool
    of questions.


    Tip


    The passing score varies per exam. For Exam 310-011, the passing score is 66 percent,
    and for Exam 310-012, the passing score is 70 percent.


    All Solaris certification exams are computer - generated and use a multiple-choice,
    drag-and-drop or fill-in-the-blank format. Although this might sound easy, the
    questions are constructed not just to check your mastery of basic Solaris system
    administration, but also require you to evaluate one or more sets of circumstances
    or requirements. Often, you''ll be asked to give more than one answer to a question;
    likewise, you might be asked to select the best or most effective solution to
    a problem from a range of choices, all of which are technically correct. The tests
    are quite an adventure, and they involve real thinking. This book will show you
    what to expect and how to deal with the problems, puzzles, and predicaments you''re
    likely to find on the exams.


    # Test Layout and Design


    A typical test question is depicted in Question 1. It''s a multiple-choice question
    that requires you to select a single correct answer. Following the question is
    a brief summary of each potential answer and why it was right or wrong.


    # Question 1


    Which of the following is the last phase in the Solaris boot process?


    +   a. init

    b. Boot PROM

    sc. BIOS

    d. Kernel initialization

    e. Boot programs


    Answer is correct. All of these are phases of either the SPARC or the Intel boot
    process. The boot PROM and BIOS test hardware. Therefore, answers b and c are
    incorrect.'
