  md: '# #


    To list the file systems mounted in the cache and the cache status, use the -l
    command-line argument. Additional command-line arguments include -s to perform
    a consistency check, -u to update cache parameters, and -d to delete a cache.
    All of these command-line arguments should be followed by the full pathname of
    the cache directory.


    Mounting a NFS resource in the cache using the mount command requires specifying
    the remote file system, the local cache, and a local mount point.


    The -F command-line argument should be used to identify the file system type as
    CacheFS. In addition, at least two cache-specific options must be specified using
    the -o command-line argument: backftype, which is used to identify the type of
    file being mounted (typically NFS) and cachedir, which is used to identify the
    cache directory. The following listing uses the mount command to manage the /export/home
    file system from the host spar20 on the /home mount point (referred to as the
