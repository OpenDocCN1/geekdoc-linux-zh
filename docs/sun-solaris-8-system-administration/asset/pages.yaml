  md: '# Sef-Assessment


    I included a Self-Assessment in this Exam Cram to help you evaluate your readiness
    to tackle Sun Certified System Administrator for Solaris 8 certification. It should
    also help you understand what you need to master the topic of this book—namely,
    Exam 310-011, “Sun Certified System Administrator for Solaris 8 Operating Environment,
    Part 1” and Exam 310-012, “Sun Certified System Administrator for Solaris 8 Operating
    Environment, Part 2”. Before you tackle this Self-Assessment, let''s talk about
    the concerns you may face when pursuing a Solaris 8 System Administrator certification,
    and what an ideal candidate might look like.


    # Solaris 8 System Administrators in the Real World


    In the next section, I describe an ideal Solaris 8 System Administrator candidate,
    knowing that only a few actual meet this ideal. My description of that ideal candidate
    might seem downright scary. But because, although the requirements to obtain a
    Solaris 8 System Administrator certification may seem formidable, they are by
    no means impossible to master. You should be keenly aware that it takes time,
    requires some deat expense, and consumes a substantial effort.


    You can get all the real-world motivation you need from knowing that many others
    have gone before you. You can follow in their footsteps. If you''re willing to
    tackle the process seriously and do what it takes to obtain the necessary experience
    and knowledge, you can take—and pass—the certification tests. In fact, the Exam
    Crams and the companion Exam Preps are designed to make it as easy as possible
    for you to prepare for these exams. But prepare you must!


    The same of, is true for all certifications, including:


    +   - Solaris 8 Network Administrator, which concentrates on the networking aspects
    but requires only one exam.

    - Solaris 7 System Administrator, which is similar to the Solaris 8, but addresses
    the previous version of Solaris and requires two exams.

    - Solaris 7 Network Administrator, which concentrates on the networking aspects
    of the Solaris 7 environment and requires only one exam.


    # The Ideal Solaris 8 System Administrator Candidate


    Just to give you some idea of what an ideal Solaris 8 System Administrator candidate
    is like, here are some relevant statistics about the background and experience
    such an individual might have. Don''t worry if you don''t meet these qualifications
    (or, indeed, if you don''t even come close),'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'because this world is far from ideal, and where you fall short is simply where
    you''ll have more work

    to do. The ideal candidate will have:


    +   * Academic or professional training in Unix operating systems and more specifically
    the AT&T

    System V Release 4 (SVR4) Unix operating system on which Solaris is based.

    * Threeplus years of professional system administration experience, including
    experience

    install and upgrading operating systems, performance tuning, troubleshooting problems,

    creating users, and managing backup and recovery scenarios.


    I believe that under half of all certification candidates meet these requirements.
    In fact, most

    probably meet less than half of these requirements (that is, least when they begin
    the

    certification process). But, because all those who have their certifications already
    survived the\ ordeal, you can survive it, too—especially if you need this Self-Assessment
    can tell you

    about what you really know and what you need to learn.


    # # Put Yourself to the Test


    The following series of questions and observations is designed to help you figure
    out how much

    work you''ll place in Solaris certification and what kinds of resources you may
    consult on

    y quest. Be absolutely honest in your answers, or you''ll end up wasting money
    on exams

    you''re not ready to take. There are no right or wrong answers, only steps along
    the path to

    certification. You can only decide where you belong in the broad spectrum of aspiring

    candidates.


    Two things should be clear from the outset, however:


    +   * Even a modest background in computer science will be helpful,

    * Hands-on experience with Solaris operating system and technologies is an essential
    ingredient

    to certification success.


    # # Educational Background


    +   1. Have you ever taken any computer-related classes? [Yes or No]


    If yes, proceed to Question 2; if no, proceed to Question 4.

    2. Have you taken any classes on the Unix operating system? [Yes or No]


    If yes, you will probably be able to handle the discussions that relate to the
    Solaris

    operating system and system administration. If you''re rusty, brush up on the
    basic Unix

    concepts and networking. If the answer is no, consider some basic reading in this
    area.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'strongly recommend a good Solaris system administration book such as A Practical
    Guide to Solaris by Mark Sobell (1999). Or, if this title doesn''t appeal to you,
    check out reviews for other, similar titles at your favorite bookstore. However,
    don''t expect a long list. Solaris 8 is still new in terms of available titles.


    +   3. Have you taken any networking concepts or technologies classes? [Yes or
    No]


    If yes, you will probably be able to handle the networking terminology, concepts,
    and technologies (but brace yourself for frequent departures from normal usage).
