  md: '# Chapter 18: Network File System


    Terms you’ 11 need to understand:


    +   * Network File System (NFS)

    * Resource sharing and mounting

    * WebNFS

    * Auto File System (AutoFS) service

    * Cache File System (CacheFS) service


    # Techniques you’ 11 need to master:


    +   * Sharing and unsharing NFS resources

    * Mounting and unmounting NFS resources

    * Determining NFS resources, shared or merged

    * Configuring AutoFS maps

    * Managing a CacheFS cache


    This chapter covers some topics relating to file systems. The first part covers
    the Network File System (NFS) and the commands used to administer NFS. The next
    part describes the AutoFS and CacheFS services that support NFS. This chapter
    covers the NFS, AutoFS, and CacheFS test objectives.


    # The NFS Environment


    The NFS service uses the server/client model to allow systems to remotely access
    the storage of other systems. The NFS protocol is defined by Request For Comment
    (RFC) 1813, "NFS Version 3 Protocol Specification."


    An NFS server allows computers of different architectures running different operating
    systems to access its storage space across a network. The NFS service also allows
    multiple systems to access the same information, thereby eliminating redundancy,
    improving consistency, and reducing administration.


    An NFS client accesses this information in a somewhat transparent mode. That is,
    the remote resource appears and can be treated as local storage space for most
    operations and applications.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# NFS Administration


    Before file systems or directories can be accessed (that is, *mounted*) by a client
    through NFS, they must be *shared* or, in older terminology, *advertised*. Once
    the resources are shared, authorized NFS clients can mount them.


    Exam Alert


    Another term used for sharing NFS resources is *exporting*. This term appears
    occasionally in Solaris documentation, but is most often seen as a directory name
    for NFS resources as `/export/home` or `/export/swap`.


    # Sharing NFS Resources


    NFS resources can be shared using the **share**(1M) command and unshared using
    the **unshare**(1M) command. In addition, any resources identified in the /etc/dfs/stab
    file are automatically shared at system boot or when the **shareall**(1M) command
    is used. Shared resources are automatically recorded in the /etc/dfs/sharetab
    file. The **unshare**(1M) command is used, and all resources listed in the /etc/dfs/sharetab
    file are automatically unshared.


    Exam Alert


    Actually, the NFS server is started and the identified resources are shared when
    the system enters run level 3 as a result of system boot or administrator actions.
    The resources are unshared and the NFS server is stopped when the system level
    changes to any level other than 3. Remember the NFS client is started at level
    2.


    # The **share** Command


    The **share** command shares NFS resources so that NFS clients can mount and access
    them. At a minimum, you must specify the full pathname of the directory (or mount
    point of the file system) to be shared as a command-line argument.


    In addition


    Table 18.1: The share command''s NFS-specific options.

    | Option | Description |

    |---|---|

    | aclok | Allows access control for NFS Version 2 clients |'
  merge: -1
  pgno: 340
- img_proc: true
  md: '| Table 18.1: The share command''s NFS-specific options. |

    | Option | Description |

    |---|---||

    | anon=uid | Assigns anonymous users the specified uid |

    | index=file | Displays the contents of file instead of listing the directory
    for WebNFS clients |

    | nosub | Prevents clients from mounting subdirectories of shared resources |

    | nosuid | Prevents clients from setting setuid or setgid access modes on files
    |

    | public | Specifies a public file handle |

    | ro | Allows read-only access |

    | ro=list | Allows read-only access to those clients specified by list |

    | root=list | Allows root access to root users on clients specified by list |

    | rw | Allows read/write access |

    | rw=list | Allows only read/write access to those clients specified by list |

    | sec=mode | Uses one or more of the security modes specified by mode to authenticate
    clients |

    | window=value | Sets the maximum lifetime for a client''s s credentials to value
    seconds |


