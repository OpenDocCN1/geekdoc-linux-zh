- img_proc: true
  md: '/- nfssserver:usr/data does not provide a valid mount point. Therefore, answer
    d is incorrect. The format for a direct map entry is mount point, options, and
    then resource. The format of answer e is mount point, resource, and then options.
    Therefore, answer e is incorrect.


    # Question 13


    Answers a, b, c, and d are correct. Virtual disk management systems provide all
    these features.


    # Question 14


    Answers a, b, c, d, and e are correct. A rules entry consists of one or more rule
    keywords and values followed by the name of a begin script and then a profile
    script and an end script. The begin and end scripts are optional. If either is
    not specified, a hyphen (-) is used in place of the script name.


    # Question 15


    Answer c is correct. The AdminSuite Host Manager can add support for a network
    client. The Host Manager cannot be used to mount a disk. Therefore, answer a is
    incorrect. It also cannot edit any NIS table or boot a network client. Therefore,
    answers b and d are incorrect.


    # Question 16


    Answers c and f are correct. Changes to indirect maps do not require running the
    automount command. Changes to the auto_master and direct maps require that the
    automount command be executed manually. Therefore, answers a, b, d, and e are
    incorrect.


    # Question 17


    Answers a, b, and d are correct. The host name, IP address, and Ethernet address
    of the client need to be added to NIS/NIS+ to support JumpStart installation.
    The system locale is not required to install a client. Therefore, answer c is
    incorrect. Because the client information is added to the appropriate name service,
    you don''t need to identify the name service. Therefore, answer e is incorrect.


    # Question 18'
  merge: -1
