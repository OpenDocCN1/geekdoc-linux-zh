  md: '# Deleting a Device Alias


    An Alias defined by the nalias command is stored in the script and remains until
    you remove it using the nvunalias command, or until you restore the system configuration
    to its original defaults using the set-defaults command. Keep in mind that an
    alias defined using the devalias command is not stored in the script and is lost
    when the system reboots.


    To delete the nonvolatile device alias (an alias stored in the script) disk2,
    enter the following command at the OpenBoot prompt:


    ```

    ok nvunalias disk2

    ```


    Tip


    When you''re deleting an alias, be certain that the alias is not used anywhere;
    otherwise, possibly critical system parameter might become undefined.


    # Viewing and Modifying NVRAM Parameters from Solaris


    Typically, you view and modify the NVRAM parameters using OpenBoot commands. It
    is possible to view and modify the NVRAM parameters from the Solaris 8 environment
    using the eeprom(1M) command. However, the superuser can modify NVRAM parameters
    using the eeprom command.


    To view the value of the auto-boot? NVRAM parameter, enter the following eeprom
    command at the system prompt:


    ```

    $ /usr/bin/eeprom auto-boot?

    auto-boot?=true

    $

    ```


    To view all NVRAM parameters, enter the eeprom command without any command-line
    arguments.


    You can also use the eeprom command to modify a NVRAM parameter. To set the value
    of auto-boot?= false, enter the following command at the system prompt:


    ```

    # eeprom auto-boot?=false

    #

    ```


    # Troubleshooting Boot Problems


    When reset or powered on, a SPARC system typically runs the POST. After this,
    the system boots automatically (if auto-boot? is true) or enters the Forth Monitor.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'The boot process or OpenBoot initialization sequence performs various checks
    and loads the appropriate modules. You can view status messages regarding this
    initialization sequence in the /var/adm/messages after the system has successfully
    loaded and started the system.


    However, if a boot problem occurs, the Solaris 8 system will not be started, and
    you can''t view the messages. To get around this situation, OpenBoot has the ability
    to send the initialization messages to serial port (aTTY). You accomplish this
    by setting the `diag-switch?` OpenBoot parameter to `true` and using the `setenv`
    command before starting the system boot, as in the following example:


    ```

    ok setenv diag-switch? true

    ok

    ```


    By attaching a terminal to PC or TTY, you can observe the messages generated by
    the OpenBoot initialization sequence and identify the boot problem.


    # Emergency Commands (SPARC Only)


    Sometimes you need to take control over a system, regardless of its state. From
    the keyboard of a SPARC system, you can immediately enter the Forth Monitor. Table
    4.4 lists the emergency keyboard commands supported by OpenBoot. Make all use
    of the stop function key on the SPARC keyboard.


    Table 4.4: Emergency keyboard commands (SPARC only).


    | Sequence | System Response |

    |---|---|

    | stop | Bypasses the POST |

    | stop+a | Aborts the operating system or boot process (returns to the OpenBoot
    ok prompt) |

    | stop+d | Enters diagnostic mode |

    | stop+f | Enters the Forth Monitor on TTY (instead of the system console) |

    | stop+n | Resets the NVRAM contents to default values |


    Exam Alert


    When you need to recover a system that has stopped responding, after the stop+a
    sequence, be sure to enter the OpenBoot sync command to synchronize the system
    system disks and write a crash dump before issuing the appropriate boot command.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'The stop+a sequence can be enabled or disabled using the kbd(1) command. You
    can also set the keyboard characteristics by modifying the /etc/default/kbd file
    and executing the kbd -i command. For example, the following kbd command will
    disable the keyboard abort sequence:


    ```

    # kbd -a disable

    ```


    To accomplish the same task, place the KEYBOARD_ABORT=disable entry in /etc/default/kbd
    and execute

    # kbd -i


    # The Boot Process


    The boot PROM stores firmware that is responsible for booting the operating system.
    Because the SPARC boot process is somewhat different than the Intel x86 boot process,
    they are covered separately.


    # The SPARC Boot Process


    The SPARC boot process consists of the following phases:


    +   1. Boot PROM—This phase displays system information and runs the POST diagnostics.
    After the diagnostics are complete, the boot program, bootbk, is loaded. Its function
    is to locate the secondary boot program, usboot, on the boot device.

    2. Boot Programs—In this phase, bootbk loads the usboot program into memory and
    executes it.

    3. Kernel Initialization—In this phase, the usboot program loads the kernel into
    memory and causes it to execute. The kernel initializes its data structures and
    begins loading other kernel modules on the basis of the /etc/system file using
    the usboot program. After all the necessary modules are loaded and initialized,
    the kernel starts the /sbin/init program.

    4. init—In the it phase, the init program starts other processes on the basis
    of the information contained in the /etc/initab file. These processes include
    a program that calls the run control (rc) scripts set up system services.


    # Intel x86 Boot Process


    The Intel x86 boot process consists of the following phases:


    +   1. BIOS—During this phase, the POST diagnostics are executed. Then, the master
    boot record, mboot, is read from disk to locate the active partition that contains
    the pboot program.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '2. Boot Programs—In this phase, the pboot program is loaded and in turn locates
    and loads the primary boot program, bootblk. Then, the secondary boot program,
    either boot.bin or ufsboot, is located in the root file system and loaded.


    3. Kernel Initialization—In this phase, the boot.bin or ufsboot loads the kernel
    into memory and executes it. The kernel initializes its data structures and begins
    loading other kernel modules. After all the necessary modules are loaded and initialized,
    the kernel starts at `/sbin/init


    4. init—In the init phase, init starts other processes on the basis of the information
    contained in the `/etc/initab` file. These processes include a program that the
    rc scripts set up your various system services.


    # Kernel Modules


    Kernel software is divided into groups of related functions called modules. Some
    modules are part of a small, common core of the operating system. Some modules
    provide platform-specific operations, whereas others are device drivers. This
    architecture allows portions of the kernel to be included or excluded on the basis
    of the desired functionality or allows portions of the kernel to be updated without
    replacing the entire kernel. Device drivers are dynamic modules that are loaded
    when the device is accessed.


    The kernel modules are stored in three directories—two under the root file system
    and one under the /usr file system:


    +   * /platform/sparc/kernel for SPARC platforms or /platform/i86pc/kernel for
    x86

    * platforms—Modules that are specific to the platform

    * /kernel—Common kernel modules required for booting

    * /usr/kernel—Common kernel modules used by platforms with a particular instruction
    set


    The /etc/system file is this file used to determine which kernel modules are loaded
    and to define various kernel parameters. The supported keywords are:


    +   * exclude—Prevents modules from loading

    * forceload—Forces a module to load

    * moddir—Changes the common kernel module directories

    * rootdev—Sets the physical pathname to the root device

    * rootfs—Defines the type of root file system

    * set—Sets kernel or module variables


    # The init Program'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'The last phase of the boot process is the init program. The init program is
    used to create or stop processes on the basis of the current state of the system.
    The system state is referred to as a system run level. Several run levels are
    defined on the basis of the type of activities the system should be supporting
    while at a particular run level, such as maintenance, a single user, multiple
    users, and so on. Information regarding which processes and services should be
    running at a particular run level is stored in the /etc/initab.


    The default run level is defined in /etc/initab as the default entry. The following
    example shows run level 3 as the default run level:

    is:3:initdefault


    Every run level (except 4) has an entry in the /etc/initab file that identifies
    an rc process to execute. In addition, each run level has a directory associated
    with, which contains rc scripts that should be executed by the rc program to start
    or stop processes and services when that run level becomes the run level.


    The init program also sets the default environment variables as defined in /etc/default/init.
    These include local variables and system parameters based on location, such as
    the time zone.


    # System Run Levels


    To provide a convenient way for the system administrator to shut down or reboot
    the system and control system services and resources, eight system run levels
    (also referred to as init states) are defined and assigned specific functionality.
    Table 4.5 describes the run levels.


    Table 4.5: The eight system run levels.


    | Run Level | init State | Functionality |

    |---|---||

    | 0 | Power Down | The system is being shut down. All users are forced off the
    system. All operating system services are stopped in an orderly manner. When this
    process is complete, the system is at firmware mode. For SPARC platforms, firmware
    mode is the ok OpenBoot prompt. It is safe to turn off the power to the system
    and peripherals. |

    | s or S | Single User | The system is prepared for maintenance. Any users are
    logged off the system. Any services except the most basic operating system services
    are stopped in an orderly manner. Any mounted file systems remain mounted. A command-line
    interface (with superuser privileges) is started and associated |'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Table 4.5: The eight system run levels.


    | Run Level | init State | Functionality |

    |---|---|---|

    | | with the system console, so the system administrator can perform maintenance
    (such as system backup) without interference from users or applications. |

    | 1 | Administrative | Any logged-on users are not affected. Multiple users can
    log on and use available system resources. All services except the most basic
    operating system services are stopped in an orderly manner. Any mounted file systems
    remain mounted. A command-line interface (with superuser privileges) is started
    and associated with the system console, so the system administrator can perform
    maintenance while allowing users to access the system. |

    | 2 | Multiuser | The system is set up for normal operations. Multiple users can
    log on and use system resources. All services, except the Network File System
    (NFS) server, are started. All default file systems are mounted. |

    | 3 | Multiuser with NFS | The system is set up for normal operations. This is
    typically the default system state. Multiple users can access and use the system
    resources. All services, including resource sharing (the NFS server), are started.
    All default file systems are mounted. |

    | 4 | Alternative Multiuser | Currently, this state is not used and is unavailable.
    |

    | 5 | Power Down | The system is shut down. All users are logged off the system.
    All operating system services are stopped in an orderly manner. When this process
    is complete, it is safe to turn off the power to the system and peripherals. If
    supported by the system hardware, the power to the system is automatically turned
    off. |

    | 6 | Reboot | The system is shut down (run level 0) and then restarted and brought
    back up to the default run'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Table 4.5: The eight system run levels.


    | Run Level | init State | Functionality |

    |---|---|---|

    | Exam Alert | | level (as defined in the /etc/initab file, typically 3). |


    Solaris has eight run levels, of which seven are used. Even though no functionality
    is defined for run level 4, it is still considered a valid run level. Also note
    that the NFS client is started at run level 2, whereas the NFS server is started
    at run level 3.


    # Changing the System Run Level


    Occasionally, you''ll need to change the system run level—for example, when you
    shut down the system to add or remove hardware, perform backups, prepare for an
    expected power outage, or physically move the system to another location. Table
    4.6 lists the commands you use to change the system run level from the command
    line.


    # Table 4.6: Commands used to change the system run level.


    | Command | Path | Run Level(s) | Description |

    |---|---|---|---|

    | halt | /usr/sbin | 0 | Stops the processor(s) |

    | init | /sbin | 0, 1, 2, 3, 4, 5, 6, s | Processes control initialization |

    | poweroff | /usr/sbin | 5 | Stops the processor(s) and powers off the system
    (if possible) |

    | reboot | /usr/sbin | 6 | Reboots the system |

    | shutdown | /etc | 0, 1, 5, 6, s | Used for compatibility (symbolically linked
    to /usr/sbin/shutdown) |

    | shutdown | /usr/sbin | 0, 1, 5, 6, s | Changes the system run level |

    | telinit | /etc | 0, 1, 2, 3, 4, 5, 6, s | Used for compatibility (symbolically
    linked to | |'
  merge: -1
  pgno: 87
- img_proc: true
  md: '| Table 4.6: Commands used to change the system level.

    | Command | Path | Run Level (s) | Description |

    | --- | --- | --- | --- |

    | uadmin | /sbin | 0, 5, 6 | /usr/sbin/init Used for administrative control |


    The **halt**(1M) command normally logs the shutdown to the system log, writes
    a shutdown record to the system accounting file, performs a call to the **sync**(1M)
    to write any pending information to the disks, and halts the processor). You can
    prevent the system and account logging, along with disk syncing, by using command-line
    arguments. The **halt change** to run level 0 does not execute the rc scripts
    associated with run level 0 as the **shutdown**(1M) and **init**(1M) commands
    do.


    You can use the **init**(1M) and **telinit**(1M) commands to change to any of
    the eight run levels. The commands identified in the /etc/initab file for each
    run are executed, and any running process not in /etc/initab gets a SIGTERM signal
    or possibly a SIGKILL signal (Chapter 7) For each run level, an entry in /etc/initab
    runs the appropriate rc scripts to start and stop processes.


    Exam Alert

    The **init** command is unique in that it is the only command that can be used
    to change to any run level. Although all the commands listed in Table 4.6 can
    shut down/reboot the system (run levels 0, 1, 5, 6, s), only the **init** command
    can bring a system up from run level s or 1 to run level 2 or 3.


    The **poweroff**(1M) command changes the system to run level 5. Normally, it logs
    the shutdown to the system log, writes a shutdown record to the system accounting
    file, performs a call to **sync**(1M) to write any pending information to the
    disks, halts the processor(s), and, if possible, shuts off the power. The **poweroff**
    command is equivalent to the **init 5** command.


    The **reboot**(1M) command changes the system to run level 6. Normally, it logs
    the reboot to the system log, writes a shutdown record to the system accounting
    file, performs a call to **sync** to write any pending information to the disks,
    and initiates a multiuser reboot.


    Exam Alert

    The **reboot** command is unique in that it can pass arguments to the OpenBoot
    **boot** command using the -- argument. For example, the command **reboot --rv**
    passes the -rv command-line arguments to the OpenBoot **boot** command; they are
    then passed to the kernel. In this case, the **r** causes a reconfigure (probes
