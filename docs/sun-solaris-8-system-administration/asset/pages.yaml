  md: 'To verify cache logging, use the cachefslog command and specify only the mount
    point of the cached file system as a command-line argument:


    ```

    # cachefslog /home

    /var/tmp/home_log: /home

    #

    ```


    To halt logging, use the cachefslog command with the -h command-line argument
    followed by the mount point of the cached file system:


    ```

    # cachefslog -h /home

    not logged: /home

    #

    ```


    To determine the appropriate size for the cache, set up CacheFS logging and allow
    it to run for an appropriate time period (such as a day or week) to provide a
    snapshot of the representative workload. Then, stop logging and use the cachefsssize
    with the file name of the log as a command-line argument:


    ```

    # cachefsssize /var/tmp/home_log


    /home

    end size: 72k

    high water size: 72k

    total for cache

    initial size: 53888k

    end size: 72k

    high water size: 72k

    #

    ```


    The end size (cache working set when logging was halted) and high water size (largest
    working set size) are displayed for each file system mounted in the cache. In
    this example, only one file system (/home) is mounted.


    The total cache includes the initial size of the cache. If the high water size
    is the same as the initial size, then the cache is too small. If the high water
    size is much smaller than the initial size, then the cache is probably too large.


