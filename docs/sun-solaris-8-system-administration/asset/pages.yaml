    d. No password — setuid only

    e. One-time Password


    Answers a, b, c, and d are correct. Normal Password, Account is locked, Cleared
    until first login, and No password — setuid only are valid settings for the admintool
    command''s Password field. Solaris 8 does not provide a one-time password capability.
