    with being a system administrator, as implemented on Solaris 8.


    Given all the book''s elements and its specialized focus, I''ve tried to create
    a tool that you can use to prepare for—and pass—both of the Solaris 8 System Administrator
    examinations. Please share your feedback on the book with me, especially if you
