  md: '+   - Logical device name

    - Instance name


    # # Physical Device Names


    When the system is booted, the kernel builds a device hierarchy, referred to as
    the *device tree*, to represent the devices attached to the system. This tree
    is a hierarchy of interconnected buses; the devices attached to the buses are
    nodes. The root node is the main physical address.


    Each device node can have attributes as properties, methods, and data. In addition,
    each node typically has a parent node and might have children nodes. A node with
    children is typically another bus, whereas a node without children is a device
    attached to a bus.


    The full device pathname identifies a device in its location in the device tree
    by listing a series of node names separated by slashes; the root is indicated
    by a leading slash. Each node name in the full device pathname has the following
    form:


    ```

    driver-name@unit-address: device arguments

    ```


    **driver-name** identifies the device name, **@unit-address** is the physical
    address of the device in the address space of the parent, and **:device arguments**
    defines additional information regarding the device software. For example, the
    following full device address represents a slice (or partition) of a small computer
    system interface (SCSI) disk drive on a SPARC system:


    ```

    /sbus@1f,0/esp0,4000/sd3,0:a

    ```


    This identifies a device attached to the sbus with a main bus address of 1f,0;
    offset 4000; and an sd device (SCSI disk) with a SCSI bus target of 3, a logical
    unit of 0, and an argument of a, which represents a slice of a disk.


    Devices can also be referenced using physical device names. These names are located
    under the /devices directory. Although these physical names define the exact location
    of devices within the system, they are difficult to remember and use.


    # # Logical Device Names


    Logical device names are easier to use. They identify disk, tape, and CD-ROM devices
    and provide either *raw* (character) access (one character at a time) or *block*
    access (via a buffer for accessing large blocks of data).'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'The logical name of a SCSI disk device on a SPARC system identifies the SCSI
    controller (bus), SCSI target (location on the bus), drive (almost always 0),
    and slice (partition), as in the following logical device name:

    /dev/dsk/c0t3d0sa


    All devices reside under the /dev directory, and the dsk subdirectory identifies
    the device as a block disk device (rdsk subdirectory indicates a raw disk device).
    This block device is addressed as SCSI controller 0, SCSI target 3, drive 0, and
    slice (partition) a. Note the similarities (differences) between this logical
    device name and its physical device name are described in the previous section.
    Devices that have direct controllers as bus-oriented controllers (such as IDE
    drives) do not include the t# (bus target) portion of the logical name.


    Some commands, such as the format(1M) command used to format a disk, and the fsck(1M)
    command used to create a file system, expect raw (character) device names (dev/rdsk).
    Other commands, such as the mount(1M) command used to make a file system available
    for use and the df(1M) command used to display free file space, expect block device
    names (dev/dsk). A few commands, such as prvtoc(1M), accept either raw or logical
    device names.


    Of the three types of disk device names used in the Solaris environment, logical
    device names are used most frequently.


    Exam Alert


    # Instance Names


    Instance names are abbreviated names that are mapped to or associated with the
    physical device names of devices. These names allow devices to be quickly and
    easily identified without requiring the use of long and typically complicated
    physical device names. An instance name typically consists of a short driver binding
    name, such as sd, and an instance number. For example, sd0 could be the instance
    of the first SCSI disk or fd0 could be the instance of the first diskette drive.


    You may map device names (also known as full device pathnames) with instance names
    using the /etc/path_to_inst file. This is rebuilt automatically when you reconfigure
    the system using the touch /reconfigure command or the boot -r command. The format
    of the /etc/path_to_inst consists of three fields separated by tab characters.
    The fields are described in Table 8.1.


