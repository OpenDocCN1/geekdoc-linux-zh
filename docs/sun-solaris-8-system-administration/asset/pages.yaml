- img_proc: true
  md: 'Answer c is correct. The ypstart command is used to start the ypbind program.
    ypinit is used to initialize NIS servers and clients. Therefore, answer a is incorrect.
    ypstop is used to stop the ypbind program. Therefore, answer b is incorrect. ypcrank
    does not exist. Therefore, answer d is incorrect. ypwhich is used to identify
    the NIS server. Therefore, answer e is incorrect.


    # Question 19


    Answer c is correct. The user source facility is used for messages from user programs.
    If a source is not specified, user is assumed. The mail source is used for messages
    related to mail. Therefore, answer a is incorrect. The auth source is used for
    messages related to login authentication. Therefore, answer b is incorrect. The
    kern source is used for messages related to the kernel. Therefore, answer d is
    incorrect.


    # Question 20


    The correct answer is tables.


    # Question 21


    Answers b and d are correct. The -c command-line argument and the full pathname
    of cache directory are required to create a CacheFS configuration. The NFS server
    name and resource, along with the name of the local host, cannot be specified
    using command-line arguments. Therefore, answers a and e are correct. The -o command-line
    argument can be used to specify options but is not required. Therefore, answer
    c is incorrect.


    # Question 22


    Answer d is correct. The Ethernet address is six 8-bit or 48 bits long. It can
    be displayed using the ifconfig command. The Ethernet address is six, not five
    8-bit bytes, and the ping command cannot be used to display the Ethernet address
    of a network interface. Therefore, answers a, b, and c are incorrect.


    # Question 23


    Answers a and c are correct. SunInstall and Web Start are interactive installation
    methods. Custom JumpStart and JumpStart are automatic installation methods. Therefore,
    answers b and d are incorrect.'
