  md: 'to as sh. The Bourne shell is the default shell for the Solaris operating system.


    # C shell


    A version of the Unix shell developed at the University of California at Berkeley.
    It is referred to as csh.


    # CacheFS


    A storage service and a type of file system. CacheFS is used to store a copy of
    a remote NFS resource locally. Doing so allows faster access and less network
    traffic.


    # client


    A networked computer system that uses services provided by a server.


    # client/server


    An operation model used by computer systems in which services are centralized
    on a server and accessed by one or more clients via a network.


    # client-side-failover


    Automatic switch to NFS server that provides a "replicated" copy of a resource
    when the original NFS server becomes unavailable.


    # Common Desktop Environment (CDE)


    A graphical user interface.


    # concatenated striped virtual device


    A striped virtual device that has been expanded by concatenating additional slices
    to the end of the device.


    concatenated virtual device


    A device consisting of two or more slices. The slices can be on the same physical
    disk or on several disks. The slices also can be of different sizes. The slices
    are addressed in a sequential manner; that is, as space is needed, it is allocated
    from the first slice in the concatenation. Once this space is used completely,
    space is allocated from the second slice, and so on.


    # csh


    See C shell.


    # Custom JumpStart


    An installation method that uses a predefined rules file and one or more profile
    files to determine the system configuration to install, depending on architecture,
    equipped hardware, or other defined characteristics. These files are located in
    the JumpStart configuration directory.


    # daemon


    A task or process that appears to be executing all the time (and typically provides
    a service on demand).


    # dataleless client


    A type of network client that uses a small local disk for swap space and a root
    file system. Other file systems are accessed remotely.


    # device aliases


    An OpenBoot feature that lets you assign a short, easy-to-use name to a full physical
    device'
