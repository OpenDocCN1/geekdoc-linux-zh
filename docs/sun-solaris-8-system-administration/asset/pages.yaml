- img_proc: true
  md: 'devfsadmd program is started during the later stages of the system boot and
    handles any

    /devices and /dev modifications required to support reconfigurations and hot-plugging
    (dynamic

    reconfiguration) activities. devfsadmd also maintains the path_to_inst file. The
    devfsadmd

    command can be used to manually manage the /dev and devices files as required.


    # Determining Disk Device Names


