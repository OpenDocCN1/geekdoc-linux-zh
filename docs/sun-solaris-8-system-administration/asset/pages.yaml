  md: '# # Chapter 23: Answer Key II


    # ## Question 1


    The correct answer is **add_to_install_server**.


    # ## Question 2


    Answers a, b, c, and d are correct. The DiskSuite supports concatenated virtual
    devices and RAID levels 0, 1, and DiskSuite does not support RAID level 10. Therefore,
    answer e is incorrect.


    # ## Question 3


    Answer c is correct. The **add_install_client** command is used to set up a system
    to be installed over the network. The commands in the other answers do not exist.


    # ## Question 4


    Answer a is correct. The hosts: *dns nisplus files* entry will cause DNS, NIS+,
    and then /etc files to be searched when trying to resolve a hostname. The *hosts
    files nisplus dns* has all the name services, but in the incorrect order; the
    search order is from left to right. Therefore, answer b is incorrect. Answers
    c and d use an invalid keyword (ipaddress) and therefore are incorrect.


    # ## Question 5


    Answers a, b, c, and d are correct. The system sharing of NFS resource can be
    identified by either hostname or IP address. If the file system type is not specified
    using the **-F** command-line argument, NFS is assumed. NFS-specific options can
    be specified using the **-o** command-line argument.


    # ## Question 6


    Answer b is correct. A boot server can reside on an install server. Therefore,
    answer a is incorrect. The location of clients in relation to other clients does
    not determine the need for boot servers. It is the location of the clients in
    relation to the install server that determines the need for a separate'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'boot server. Therefore, answer c is incorrect. NIS and NIS+ do not locate things,
    but serve only as a database of information. Therefore, answer d is incorrect.


    # Question 7


    Answers a and c are correct. `ptree` and `ptime` are proc tools. `pwd` is used
    to display the current working directory. The proc tool correct is the `pwdx`
    command. Therefore, answer b is incorrect. The proc tool command to list signal
    actions is `psig`, not `psignal`. Therefore, answer d is incorrect.


    # Question 8


    Answer a is correct. `yppush` is used to propagate an updated NIS map to NIS slave
    servers. `ypfr` is used to propagate a new map. Therefore, answer d is incorrect.
    The commands in answers b, c, and e do not exist.


    # Question 9


    The correct answer is the NFS client.


    # Question 10


    Answers a-7, b-4, c-2, d-5, e-1, f-6, and g-3 are correct. The layers of the OSI
    Network Model from highest to lowest are: Application, Presentation, Session,
    Transport, Network, Data Link, and Physical.


    # Question 11


    Answers b and d are correct. The `make` command is used when updating a default
    map. The `yppush` command is used for propagating an updated nondefault map. The
    text file is used to add a new map. Therefore, answer a is incorrect. Likewise,
    the `makedbm` command is used for new maps. Therefore, answer c is correct.


    # Question 12


    Answers a, b, and c are correct. If more than one NFS server provides the same
    resource, as in answer c, multiple servers can be listed (separated by spaces).
    The first available resource is used.'
  merge: -1
