    c. The .startup file

    d. The .profile file

    e. The .login file


    Answer is correct. The .login file is the login initialization file for the C
    shell. The .cshrc file is the shell startup file for the C shell. Therefore, answer
    a is incorrect. Answer b is similar to the name of the Bourne and Korn login initialization
    file, but the correct file uses a lowercase p. In Unix, file names are case sensitive.
    Therefore, answer c is incorrect. Answer d would be correct if it began with a
    period.


