  md: '# Chapter 3: Installing and Maintaining Solaris 8


    Terms you’ 11 need to understand:


    +   - Software clusters

    - Software groups

    - Packages

    - Patches


    # Techniques you’ 11 need to master:


    +   - Installing Solaris 8

    - Adding and removing packages

    - Listing installed packages

    - Adding and removing patches

    - Listing installed patches


    The first section of this chapter covers the Solaris 8 distribution. Next, we
    cover installing the operating system in detail. The last two sections summarize
    the commands used to perform software package administration and patch administration.
    The Installation test objectives are covered in this chapter.


    # The Solaris 8 Distribution


    Solaris 8 system and application software is delivered as collections of files
    and directories, referred to as packages. You can copy these packages onto the
    system from CD-ROM or magnetic tape as a single compressed file and uncompress
    for installation.


    Included with the package is information regarding the package, such as its title,
    storage requirements, and version. Also included are any custom scripts to properly
    install the software.


    Sometimes system software is distributed in more than one package, but you need
    to distribute and install the packages as a unit. A collection of two or more
    related packages is referred to as a software cluster. A software cluster is a
    logical grouping of packages.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'The Solaris 8 operating system is preconfigured into software groups that consist
    of different collections of software clusters and packages. The five software
    groups are shown in Table 3.1.


    Table 3.1: Solaris 8 software groups.


    | Software Group | Contents |

    |---|---|

    | Core | Required operating system files |

    | End-User System Support | Core plus windowing environments |

    | Developer System Support | End-User plus development environment |

    | Entire Distribution | Developer System plus enhanced features |

    | Entire Distribution Plus OEM | Entire Distribution plus third-party hardware
    drivers |


    Note

    Some Solaris 8 documents refer to the operating system''s preconfigured software
    groups as software configuration clusters or simply clusters. The term software
    cluster is also used to refer to a collection of packages, so this reference can
    create confusion. In this book, we''ll use the term software groups, because this
    is the term used in the Solaris 8 Advanced Installation Guide.


    The Entire Distribution Plus OEM group is available only for SPARC platforms.


    # Installing Solaris 8


    Solaris 8 can be installed in four ways. Two of the methods are interactive: the
    Solaris Interactive Installation program (SunInstall) and Solaris Web Start are
    covered in this chapter. The other two methods are automatic: JumpStart and Custom
    JumpStart. These are objectives for Exam 310-012 and are covered in Chapter 21.


    SunInstall is an interactive Open Windows program can be used to install the Solaris
    8 software that does not support installation of copackaged software. You can
    install any copackaged software using the installation programs with the copackaged
    software after you finishing the Solaris 8 software.


    Web Start lets you install Solaris 8 using a Browser–like interface instead of
    the Open Windows interface used by SunInstall. By default, all Solaris and copackaged
    software is installed; however, this default can be changed to you select specific
    software.


    By default, Web Start sets up the system disks, including the root and swap partitions.
    It also lets you change the size of the system partitions and provides access
    to the Layout File Systems utility to set up other disks. The /opt partition is
    created automatically for copackaged software. Web Start also lets you create
    additional partitions and file systems.'
  merge: -1
  pgno: 50
