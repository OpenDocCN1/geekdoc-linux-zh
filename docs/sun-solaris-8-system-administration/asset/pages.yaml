    # The mountall and umount Commands


    The mountall command is used to mount one or more local file systems/or remote
    (NFS) shared file directories. If the name of a file (containing information on
    one or more resources) is not specified as a command-line argument, the /etc/fstab
    is used by default. The mountall command will only mount resources in the file
    system table (or specified file) that have the Mount At Boot set to yes.


    If a file system type is specified using the -F command-line option, only local
    file systems or directories are mounted. If the -l command-line argument is specified,
    or -r command-line argument is specified, only remote file systems or directories
    are mounted.


    The umount command is used to unmount all currently mounted resources. It also
    supports the -F, -l, and -r command-line arguments supported by the mountall command.
    In addition, the -h host command-line argument is used to specify that only the
    resources mounted from that host should be unmounted. The -k command-line argument
    can be used to kill processes using the fuser(1M) command to allow unmounting.
    Also the -s command-line argument prevents un operations from being performed
    in parallel. Currently mounted file resources are typically listed in the /etc/mttab
    file.


    # The dfounts Command


    The dfounts(1M) command lists mounted resources on either the local or a remote
    system (and its clients). If you specify the hostname (or IP address) of a remote
    system as a command-line argument, the resources mounted on that system (and its
    clients) are listed.


    ```

    # dfounts

    ```


    | RESOURCE PATHNAME CLIENTS |

    | solaris /export/home sunsys2. ambro.org |'
