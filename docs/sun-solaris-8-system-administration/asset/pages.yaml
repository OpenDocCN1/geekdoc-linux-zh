- img_proc: true
  md: 'drag the term to the appropriate location. Release the mouse button to drop
    the term in front of its definition.


    The remaining questions are fill the blank. This involves entering the name of
    a command, file name, command-line argument, or Solaris-related terminology. A
    typical fill-in-the-blank question is shown in Question 3. This question provides
    a box in which to enter the answer.


    # Question 3


    Enter the full pathname to the file to modify the configuration of the kernel.


    The correct answer is /etc/system.


    Be sure to read this question very carefully. Without having any answers in front
    of you, there is nothing to jog your memory and it makes guessing almost impossible.
    Because this question specifically asked for the full pathname, an answer as system,
    which might be considered technically correct, will be marked as wrong. Try to
    be as specific as possible.


    # Using the Test Software Effectively


    A well-known test-taking principle is to read over the entire test from start
    to finish, but to answer only those questions you feel absolutely sure of the
    first pass. On subsequent passes, you can dive into more complex questions, knowing
    how many such questions you have to deal with.


    Fortunately, the test software makes this approach easy to Implement. At the bottom
    of each question, you''ll find a checkbox that permits you to mark question for
    a later visit. (Note that marking questions makes review easier, but you can return
    to any question by clicking the Forward and Back buttons repeatedly until you
    get to the question.) As you read each question, you only answer those you''re
    sure of and mark for review that you''re not, you can keep going through a decreasing
    list of open questions as you knock the trickier ones off.


    +   * There''s at least one potential benefit to reading the test completely before
    answering the trickier questions: Sometimes, you find information in later questions
    that sheds light on earlier ones. Other times, information you read in later questions
    might jog your memory about facts, figures, or behavior that also help with earlier
    questions. Either way, you''ll out ahead if you do those questions about which
    you''re not absolutely sure of the answer(s).


    Keep working on the questions until you''re absolutely sure of all your answers
    or until you know you''ll run out of time. If unanswered questions remain, you''ll
    want to zip through them and guess.'
