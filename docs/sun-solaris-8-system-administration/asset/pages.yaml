- img_proc: true
  md: 'The Solaris operating system provides two TMPFS instances. The first is /tmp,
    which can be used by any user account or process that needs to use temporary files.
    The /tmp directory is owned by the root account and has an access mode of 1777
    (read/write/execute for owner/group/other with the sticky bit set); see Chapter
    5. The other TMPFS is /var/run directory, which is used for temporary system files
    that are not needed across system reboots. This directory is owned by the root
    account and has an access mode of 755 (read/write/execute for owner and read/execute
    for group/other).


    Be you understand TMPFS and its use. Also be familiar with the two instances automatically
    provided by the Solaris 8 operating system.


    # Loopback File System (LOFS)


    The Loopback File System is a memory-based file system used to provide alternate
    path names to existing data. That is, the same copy of the data can be accessed
    using two different path names. Any file systems subsequently mounted in the original
    file system also appears in the LOFS. However, any subsequent file systems mounted
    in the LOFS do not appear in the original file system.


    # Cache File System (CacheFS)


    The Cache File System is a memory-based file system used to improve the performance
    of remote file systems and slow devices such as CD-ROM drives. It stores data
    previously read from the remote file system or slow device in the CacheFS on the
    local system. When data is read again, the copy in the local CacheFS is used instead
    of the data on the remote file system or slow device.


    The CacheFS is frequently used with the Network File System (NFS). It is described
    in more detail in Chapter 17.


    # Swap Space


    Solaris 8 supports the concept of virtual memory by using space on a hard disk
    to temporarily store the contents of memory that is currently not being used.
    When the contents are needed, the system swaps out some other area of memory to
    the swap file, and swaps in the requested contents.


    As long as sufficient memory is available, swap space is not used. When the load
    on the system increases and resources (mainly memory) are in high demand, swapping
    may begin to occur.'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'Keep in mind that pseudo file systems (such as the /tmp TMPFS instance) use
    memory. As more /tmp space is used, the system will be forced to make more use
    of the swap space. Heavy use of the /tmp TMPFS instance may cause the system to
    run of swap space.


    # # Default Swap Space


    When Solaris is initially installed, a partition on a hard disk is defined as
    the default swap space. Its size is based on the amount of physical memory. Table
    16.3 lists the recommended swap space sizes. The Solaris installation programs
    use these recommendations to determine the default size of the swap space.


    | Table 16.3: Recommended swap space sizes.

    | Equipped Memory | Recommended Swap Space Size |

    |---|---|

    | Less than 64MB | 32MB |

    | 64 to 127MB | 64MB |

    | 128 to 511MB | 128MB |

    | 512MB or greater | 256MB |


    If a system needs more swap space additional memory is added or the system is
    heavily loaded, the size of the swap space partition cannot be increased without
    reinstalling Solaris 8 and resizing the swap space partition. However you can
    use available space from other file system partitions to add swap space.


    # # Adding More Swap Space


    The **mkfile**(1M) command can configure additional swap space using available
    space from mounted partitions. This command creates a file of specified size that
    internally has the appropriate layout. You can then use **swap**(1M) command to
    add the file to the system swap space.


    The **mkfile** command expects at least two command-line arguments. This first
    is the size of the file. The size should be by **k** for kilobyte, **b** or **B**
    for blocks, **m** or **M** for megabyte, to identify the appropriate scale for
    the size. Be sure you do not place a space between the size and the scale. If
    a scale is not specified, then the size is assumed to be in bytes. The second
    command-line argument is the name of the file. You can create more than one file
    of the specified size by listing multiple file names as command-line arguments,
    separated by spaces. Two other command-line arguments are supported: **-n**, which
    indicates that the disk space should be allocated as needed up to the specified
    size (instead of all being allocated when when'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'the file is created), and -v, which specifies verbose reporting mode (file
    names and sizes are listed.


    A swap space file (or swap file) can be added to the system swap space using the
    **swap -a** command. At a minimum, the name of the file must be a command-line
    argument. To ensure the full (absolute) path name for the file. To activate swap
    space files when the system is rebooted, list them in the /etc/fstab file. The
    /etc/fstab entry should contain the full path name to the swap file and be identified
    as a swap file system. The /sbin/swapped script is executed for each swap file
    listed in the /etc/fstab file during system reboot.


    Exam Alert


    Understand the procedure and commands used to add, delete, and list swap space.


    # Administering Swap Space


    In addition to using add swap, the **swap** command also supports command-line
    arguments to list swap space (-l), list swap space statistics (-s), and delete
    swap files (-d).


