    chapter). This will help you compare your knowledge base to the requirements for
    obtaining the Solaris 8 System Administrator certification and will help you identify
    parts of your background or experience that might be in need of improvement, enhancement,
    or further learning. If you get the right set of basics under your belt, Solaris
    certification will be much easier.


    Once you''ve gone through the Self-Assessment, you can remedy those topical areas
    where your background or experience might not measure up to that of an ideal certification
    candidate. But you can also tackle subject matter for individual tests at the
    same time, so you can continue progress while you''re catching up in.


    Once you''ve worked through this Exam Cram, have read the supplementary materials,
