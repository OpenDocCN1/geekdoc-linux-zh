    | Socket | s | A network (AF_UNIX) socket data structure used to communicate via
    a network interface |


    Exam Alert Be familiar with the types of files supported in the Solaris environment
    and the character IDs used by the ls command to identify the types of files.


    # Types of Links


    As previously mentioned, files and directories are linked into a directory. This
    link is stored as an entry in the directory and provides a reference by which
    the file or directory can be located and accessed.


    The directory entry is actually a pointer to the location of the file or directory
    within the file system and is referred to as a hard link. Because links point
    to files or directories based on their location in the file system, links cannot
    be used to point to files or directories in a different file system. Thus a hard
    link implies the file or directory is located in the current file system.'
