    # Displaying Cache Statistics


    To display statistical information about the performance of the cached file system,
    use the cachefsstat(1M) command and specify the mount point of the cached file
    system.

    The following statistics about the cached file are displayed:


    +   - cache hit rate—Percentage of attempts to locate files or directories in
