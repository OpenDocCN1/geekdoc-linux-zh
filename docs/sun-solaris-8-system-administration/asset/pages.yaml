    # Displaying File Permissions and Ownership


    The ls(1) command displays file permissions and ownership. The ls command supports
    the command-line arguments described in Table 5.5.


    Table 5.5: Command-line arguments for the ls command.

    | Argument | Description |

    | --- | --- |

    | name | The name of a directory or file to display information about. To specify
    more than one name, separate them with spaces and/or metacharacters (see Chapter
    10). If one or more names are directories, then the contents of those directories
    are listed. If no names are specified, then all directories/files in the current
    directory are listed. |

    | -a | Lists all directories and files, including those that begin with a dot
    (which are normally not displayed). |

    | -A | Lists all directories and files, including those that begin with a dot
    (except the current directory (.) and the parent directory (..). |

    | -b | Displays non-printable characters in file/directory names using octal \ddd
    notation. |

    | -c | Uses the time of the last i-node modification for sorting or listing. |

    | -C | Generates multicolumn output sorted down columns (default). |

    | -d | Lists the names of directories instead of the directory contents. |

    | -f | Interprets all names as directories. |

    | -F | Indicates the type of files by marking them with a trailing character.
    Marks directories with a forward slash (/), doors with a greater-than sign (>),
    executable files with an asterisk (*), FIFOs with a vertical bar (|), symbolic
    links with an ampersand (@), and sockets with an equals sign (=).'
