    # The vi editor


    The vi(1) command is a screen-oriented text editor. In this section, we will cover
    the three modes of operation, controlling the cursor position, manipulating text
    (add, delete, copy, move), and search/replace functions.


    Note


    In this description of the vi editor, we use the symbols < and > to define a key
    that you should press on the keyboard. For example, <a> indicates that you should
    press the key labeled “a”, and <Enter> indicates that you should press the key
    labeled “Enter” or “Return”.


    # Modes of Operation


    The vi editor has three modes of operation:


    +   - Command

    - Input

    - Last Line


    Command mode is the initial and default mode of operation. In this mode, file
    navigation is supported so that you can view different parts of the file. You
    control the view by using commands to scroll the file forward or backward (vertically
    on the screen) and to move between the left and right side of the display. Character,
    word, and line deletion is also supported in Command mode.


    Input mode allows text to be added, deleted or modified. This mode provides a
    variety of commands to manipulate the text contents of a file.'
