- img_proc: true
  md: '# Exam Alert


    The default information displayed for a process consists of its process ID (PID),
    the terminal device it is associated with (TTY), its accumulated execution time
    (TIME), and the program or command name (CMD). This information is included in
    all formats unless specifically omitted.


    The command-line arguments used to specify an ID—such as process group ID, real
    group ID, PID, session ID, effective UID, and real UID—accept multiple IDs (separated
    by commas). For the real and effective user IDs and the real group ID, you can
    specify either the numeric IDs or the account names.


    The following listing uses the ps command with several different command-line
    arguments:


    ```

    $ ps -udla

    PID TTY TIME CMD

    781 ? 0:19 xterm

    782 pts/5 0:00 sh

    910 pts/5 0:10 telnet

    913 pts/6 0:01

    $ ps -tpts/5

    PID TTY TIME CMD

    782 pts/5 0:00 sh

    910 pts/5 0:10 telnet

    $ ps -f -udla

    UID PID PPID STIME TIME CMD

    dla 781 1 0 Aug 28 ? 0:19 xterm -display

    dla 782 781 0 Aug 28 pts/5 0:00 sh

    dla 910 782 0 Aug 28 pts/5 0:10 telnet solaris

    dla 913 911 0 Aug 28 pts/6 0:01 -sh

    $

    ```


    The PPID column lists the parent ID of the process, the C column lists processor
    utilization (obsolete), and the STIME shows the start date.


    # The prstat Command


    The prstat(1M) command generates a statistics report on active processes. If you
    use it with no command-line arguments, information on all active processes is
    displayed, sorted by CPU usage. The report is updated approximately every three
    seconds until it is killed. The following listing shows the use of the prstat
    command:


    ```

    $ prstat

    PID USER SIZE RSS STATE PRI NICE TIME CPU PROCESS/NLWP

    ```'
