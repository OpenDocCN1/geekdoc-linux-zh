  md: '| Table 14.2: The syslog severity levels. |

    | Keyword | Description |

    | warning | Warning messages |

    | notice | Conditions that might require special handling |

    | info | Nonurgent information |

    | debug | Typically generated by debug messages in programs |

    | none | Special keyword used to prevent logging of messages generated by specified
    sources |


    # # Customizing System Message Handling


    To control the handling of syslog messages, you add entries to the /etc/syslog.conf
    file. These entries take the form of one or more facility/severity keyword combinations
    followed by a tab character and an action. The facility and severity identify
    a particular source facility and message severity, whereas the action determines
    how the messages are handled. Facility/keywords and/or actions can be optionally
    defined using ma(1) macro that can be used to determine if the current system
    is configured as a syslog host.


    # # Facility/Severity Keywords Combinations


    The facility and severity keywords are separated by a period (.) and identify
    a particular source facility and severity of messages. For example, kern.emerg
    identifies emergency error messages from the kernel.


    Three special cases exist:


    +   * A facility is specified without being followed by a period and a severity
    keyword. This keyword is used to identify all levels of severity. For example,
    if the facility keyword mail is specified by itself, all levels of mail are processed.

    * A facility is followed by a period and the none severity keyword. This combination
    specifies that no messages from the specified facility should be processed. For
    example, mail.none indicates that no messages should be processed.

    * The asterisk (*) facility is used. This facility specifies that all source facilities
    (except the mark facility) should be processed. For example, *.notice indicates
    that all messages of the notice level sent to syslog (from all sources except
    mark) should be processed.


    You can specify more than one facility/severity combination in an /etc/syslog.conf
    entry by separating them with the semicolon (;) character.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Actions


    Each entry has an action associated with it. Table 14.3 lists the four forms of
    actions.


    | Action | Description |

    | --- | --- |

    | /filename | The identified syslog messages are appended to the specified file
    (must begin with a slash (/)) |

    | @host | The identified syslog messages are forwarded to the syslog daemon (must
    begin with the at @ character). |

    | login account | The identified syslog messages are written to the standard out
    (typically the monitor) associated with the specified login account if the account
    is currently logged on to the system. Multiple accounts can be specified (separated
    by commas). |

    | * | The identified syslog messages are written to the standard out of all login
    accounts currently logged on the system. |


    # Optional Entries Controlled by m4 Macros


    You can define optional entries in the /etc/syslog.conf file using the m4 macro
    ifdef(condition, define_if_true, define_if_false)


    specified in either the facility/keyword column or the action column.


    The ifdef() provides a conditional control statement. If condition is true, then
    the define_if_true expression is in effect. If not, the define_if_false expression
    is in effect.


    The only relevant condition for the /etc/syslog.conf file is ''LOGHOST''. This
    keyword is used to determine whether the local system has an alias of localhost
    in the /etc/hosts file. This alias indicates that the associated host is configured
    to store local syslog messages and possibly syslog message from remote hosts.
    The following /etc/hosts entries the solaris8 system as identified


    192.168.99.8 solaris8 localhost


    The following line shows a typical example of using an m4 ifdef macro in the action
    column of the /etc/syslog.conf file:

    auth. notice ifdef(`LOGHOST'', /var/log/authlog,@localhost)'
