  md: 'For example, the standard Unix utility to execute maintenance commands automatically
    is the cron program. It is usually started at run level 2 and stopped at run levels
    0, 1, 5, 6, and s. To start cron at run level 2, you can copy (or link) the cron
    rc script into /etc/rc2 and name it S7cron. The S at the beginning of an rc script
    causes the rc program to start the service at the particular run level (level
    2) by calling the rc script with the start argument.


    Likewise, you can copy (or link) the same cron rc script into /etc/rc0.d, /etc/rc1.d,
    and /etc/rcS.d directories and name it K400cron. The K at the beginning of an
    rc script causes the rc program to stop the service at the particular run level
    by calling the rc script with the stop argument.


    Note the numbers included in the names of the rc script files are different. The
    numbers provide a method for the rc program to start or stop services in a particular,
    consistent order. The rc scripts with lower numbers are executed before the rc
    scripts with higher numbers. This order is necessary, because some services require
    the presence of other services to operate properly.


    For example, a networking application requires that the networking services be
    available. So, the rc script to start the application should have a higher number
    than the rc script to start the networking. In addition, services should be stopped
    in reverse order. In the case of a networking application, the rc script to stop
    the application should have a lower number than the rc script to stop the networking.


    Copies of all rc scripts are placed in the /etc/init.d directory. To start or
    stop a particular service, the system administrator has only to locate the appropriate
    rc script in a single directory.


