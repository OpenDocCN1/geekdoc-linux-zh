    # Question 1


    Which of the following can be used as a file server?


    +   a. AutoClient

    b. Diskless client

    c. Non-networked standalone system

    d. Networked standalone system


    Answer d is correct. A networked standalone system meets both of the basic requirements
    of a file server: it is networked, and it has storage space. An AutoClient has
    only a minimum amount of local storage space. Therefore, answer a is incorrect.
    A diskless client does not have any local storage space. Therefore, answer b is
    incorrect. A non-networked standalone system is not and cannot make its storage
    space available to other systems. Therefore, answer c is incorrect.


    # Question 2


    How many layers are in the TCP/IP network model?


    +   a. 4

    b. 5

    c. 6

    d. 7


    Answer b is correct. The TCP/IP network model has five layers. The layers (bottom
    to top) are Physical, Data Link, Network, Transport, and Application. The OSI
    network model has seven layers.


