    782 sh

    910 telnet

    913

    $

    ```


    The **pkill** command is similar to the **pgrep** command, but instead of displaying
    information on matched processes, the matched processes are terminated using the
    SIGTERM (15) signal.


    All the command-line arguments listed in Table 7.4 are supported, allowing processes
    to be selected on the basis of regular expression pattern matching and/or various
    IDs. In addition, the **pkill** supports a command-line argument to specify a
    signal to be used instead of SIGTERM. This command-line argument is the minus
    followed by a symbolic name (not including the **SIG** prefix) or signal number.
