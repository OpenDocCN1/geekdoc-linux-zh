    |

    | Sequence | Description |

    |---|---|

    | <x> | Deletes the current character. |

    | <d><w> | Deletes the current word. |

    | <d><d> | Deletes the current line. |


    As with the cursor-positioning commands, you can enter a number before each of
    these text-deletion commands to delete characters, words, or lines at a time.
