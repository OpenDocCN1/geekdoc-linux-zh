  md: '# # The /etc/vfstab File


    The /etc/vfstab file, referred to as the **file system table**, specifies resources
    that should be automatically mounted when the system is booted or when the **mountall**
    command is used.


    You can modify this file using any text editor. To automatically mount an NFS
    resource, add a line to the /etc/vfstab file that contains the appropriate options
    that have been entered manually with a **mount -F nfs** command. To remove automatic
    mounting of an NFS resource, delete the appropriate line from the /etc/vfstab
    file.


    Table 18.4 lists the (tab-separated) fields and the appropriate values of an entry
    in the /etc/vfstab file as they pertain to mounting an NFS resource. A hyphen
    (-) indicates no entry.


    | Field | Description |

    | --- | --- |

    | Device To Mount | Uses the *system:resource* format, where system is a hostname
    or IP address and resource is the full path name of the shared NFS resource |

    | Device To fsck | Uses a hyphen (--) to indicate no entry, because NFS clients
    should not check remote NFS resources with the **fsck** command |

    | Mount Point | Specifies the subdirectory where the NFS resource should be mounted
    |

    | FS Type | Uses **nfs** to indicate an NFS resource |

    | fsck Pass | Uses a hyphen (--) to indicate no entry |

    | Mount At Boot | Uses **yes** to indicate that the resource should be mounted
    at boot or when the **mountall** command is executed; otherwise, **no** |

    | Mount Options | Specifies any desired NFS options; see Table 18.3 or the manual
    page for the **mount** command |


    NFS supports client-side failover. If an NFS resource becomes unavailable, the
    client can switch to another NFS server that provides a “replicated” copy of the
    resource. You enable this failover capability by adding an entry in the /etc/vfstab
    file for the resource. In the **Device To** field, list the systems that provide
    the replicated resource, separated by commas. You should also specify the read-only
    option (-o ro) in the **Mount Options** field. For example, to provide client-side
    failover for the /export/local resource that is available from either the **alpha**
    or the **beta** NFS server and mounted at /usr/local, add the following entry
    to the /etc/vfstab file:'
  merge: -1
