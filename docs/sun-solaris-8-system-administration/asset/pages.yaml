    # Practice Questions


    # Question 1


    What are the three parts of the Solaris 8 operating system? [Select all that apply]


    +   a. Disk drive

    b. Kernel

    sc. File system

    d. System console

    e. Memory management

    f. Process control


    Answers b, c, and fare are correct. The three parts of the Solaris 8 operating
    system are the kernel, the file system, and the shell. The disk drive and console
    are hardware devices. Therefore, answers a and d are incorrect. Memory management
    and process control are functions of the kernel. Therefore, answers e and g are
    incorrect.


    # Question 2


    What is the commonly used shell provided by the Solaris 8 system?


    +   a. Corn shell

    b. Sea shell

    c. Bourne shell

    d. Berkeley shell


    Answer c is correct. Solaris 8 provides the Bourne shell. Answers a and b are
    incorrect because they sound similar to the Korn and C shells, but are spelled
    differently. Answer d, the Berkeley shell, does not exist.'
