    # Backing Up and Restoring


    Solaris 8 provides utilities to back up and restore not entire file systems but
    also directories and even selected files. A magnetic tape is typically used to
    back up data, but other media, such as hard disks, writable CDs, and even diskettes,
    can be used.


    A magnetic tape can contain more than one grouping of data, or *data set*. In
    some cases a data set might be a single file. Usually, the data set is a collection
    of files written to a tape as a single unit. The data sets are separated by an
    End Of File (EOF) mark and are composed of any number of records or blocks. The
    size of the block is determined by the command used to store the data on the tape.


    # The mt Command


    The *mt*(1) command is used to control magnetic tape operations, positioning the
    tape to the beginning of a data set, rewinding the tape, and even erasing the
    tape. Table 9.6 lists the mt operations you can specify as command-line arguments.
    Most operations expect a value as another command-line argument that specifies
    the number of times the operation should be repeated (shown in the table as *count*).
    If *count* is not specified, the operation is performed once.


    Table 9.6: The mt operations.


    | Command | Description |

    | asf count* | Positions the tape after the *count* - 1 EOF mark |

    | bsf count* | Skips backward over *count* EOF marks |

    | bsr count* | Skips backward over *count* records |

    | eof count* | Writes *count* EOF marks |

    | eom | Skips forward to a position after the last data set |

    | erase | Erases the entire tape |

    | fsf count* | Skips forward over *count* EOF marks |

    | fsr count* | Skips forward over *count* records |

    | rewind | Rewinds the tape |

    | status | Displays status of tape drive |'
