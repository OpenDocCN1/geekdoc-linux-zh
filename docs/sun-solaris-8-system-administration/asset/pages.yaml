    exams is essential. At $150 a try, pass or fail, you want to do everything you
    can to pass on your first try. That''s where studying comes in.


    I have included in this book several practice exam questions for each chapter
    and a sample test, if you don''t score on the chapter questions, you can study
    more and tackle the sample tests at the end if you don''t earn a score of 66 percent
