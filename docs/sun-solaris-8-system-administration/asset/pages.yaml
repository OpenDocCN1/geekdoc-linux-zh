  md: '# Chapter 20: Solaris Management Console and Solstice AdminSuite


    Terms you’ 11 need to understand:


    +   * Solaris Management Console

    * Solstice AdminSuite

    * Host Manager

    * Storage Manager

    * Database Manager

    * Serial Port Manager

