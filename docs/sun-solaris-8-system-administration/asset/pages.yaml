  md: '# Hardware Requirements


    Solaris 8 can be installed on both Sun SPARC platforms and Intel x86 or compatible
    platforms.

    The hardware requirements for both are similar.


    # Solaris 8 on SPARC Hardware


    Solaris 8 can be installed on most sun4c, sun4u, and sun4m platform groups. The
    Solaris

    8 Sun Hardware Platform Guide to determine whether a particular platform is supported
    along with

    other devices and peripherals, such as disk drives, CD-ROM drives, tape drives,
    diskette drives,

    SCI/PCI host adapters, graphic accelerators, network interfaces, and keyboard/mouse

    components.


    You can use the Solaris installation programs to install either the 32-bit or
    64-bit

    version of the Solaris operating system. The 64-bit version is selected by default

    when you install on Sun UltraSPARC systems, but you can choose the 32-bit

    version instead. However, you may need to upgrade the Flash PROM on

    UltraSPARC sun4u platforms to provide 64-bit support. The Solaris 8

    Hardware Platform Guide provides information on determining whether the Flash

    PROM for a particular system must be upgraded and also provides a procedure for

    uupgrading the Flash PROM.


    Solaris 8 requires a minimum of 64MB of memory. The recommended space for the
    smallest

    Solaris 8 software group (End-User System) is 1.6GB of hard disk space. For the
    largest software

    group (Entire Distribution Plus OEM with 64-bit support), 2.4GB of hard disk space
    is required.

    Either a CD-ROM drive or the appropriate environment for a network installation
    is required.


    # Solaris 8 on Intel Hardware


    Solaris 8 can be installed on most Pentium or better Intel-compatible CPUs, including
    AMD and

