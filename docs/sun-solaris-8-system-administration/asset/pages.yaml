    # Techniques you’ 11 need to master:


    +   * Restricting and monitoring the superuser account

    * Changing default and existing file permissions

    * Setting and displaying Access Control Lists

    * Changing file ownership


    This chapter covers system security and file permissions. System security involves
    controlling access to the system by use of passwords and restricting/monitoring
    the use of the administrative user accounts. The file permissions portion of the
    chapter addresses controlling access to the data in files by using both basic
    and extended access controls. Most of the Security test objectives are covered
    in this chapter.


    # System Security


    Unix system security is based on controlling access to files (programs and data).
    You control access by defining user and group accounts and granting these accounts
    different levels of file access. The user accounts are protected by passwords.


    Administrative accounts are given access to system data and tools that allow them
    to perform system maintenance. These accounts include root, sys, bin, and adm.


    Several account administration files are used to store the information associated
    with user and group accounts, such as account names and passwords.'
