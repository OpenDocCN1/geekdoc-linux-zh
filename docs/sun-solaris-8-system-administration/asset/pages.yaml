  md: 'Upgrading a system allows you to merge the existing system configuration with
    the new Solaris 8 operating system. However, planning and occasional manual intervention
    are required to accomplish the upgrade successfully.


    # Exam Alert


    SunInstall and custom JumpStart (see Chapter 21) can be used to upgrade a system.
    Web Start and the standard JumpStart cannot be used to upgrade an existing system
    with an earlier version of Solaris (Solaris 7 or earlier).


    # Before the Upgrade


    You should complete a number of tasks before you upgrade your system:


    +   1. Check the latest Solaris 8 Release Notes to determine whether any Solaris
    8 changes or enhancements affect the current operation. This information includes
    that is no longer provided with Solaris or patches that you need to install.

    2. Verify that the hardware is supported as described in the preparation phase
    of the Web Start installation.

    3. Install Solaris either using CD-ROM or via the network. Depending on the method,
    verify either proper operation of the CD-ROM drive or network connectivity.

    4. Some applications, such as DiskSuite, cannot be upgraded automatically. Manual
    configuration changes are required before the software can be used. Check the
    documentation provided with the applications.

    5. If any third-party software is installed on the system, check with the software
    manufacturer to verify that the software will run on Solaris 8. You may need to
    purchase new versions of third-party software.

    6. Back up the existing system. If the upgrade fails, you may need to restore
    to the existing system until the reason for failure can be determined and resolved.

    7. Collect any information that might be prompted during the upgrade, such as
    hostname, network interface, IP address, subnet mask, and domain name. You can
    avoid having to prompts during installation by preconfiguring system information
    (as explained in this chapter).

    8. Set up a backup medium for possible use during the upgrade. If the disk space
    needs to be reallocated, you will need to copy file systems to a backup medium
    and reload them after the space on the system disk(s) has been adjusted. Local
    devices, such as unused system disks, tape, or diskettes, along with remote file
    systems, can be used for the backup medium.

    9. If you''re using the Solaris 8 distribution, insert it into the system CD-ROM
    drive. For x86 platforms that cannot be booted from the CD-ROM drive, insert the
    Device Configuration Assistant diskette into the A: drive. If you''re installing
    over the network, set up an install server and possibly a boot server.

    10. Reboot the system.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# During the Upgrade


    If the current layout of the system disks does not provide enough space for the
    upgrade, SunInstall will use the auto-layout feature to reallocate disk space
    as required. If the auto-layout fails or you want to use a different layout, you
    must manually specify the disk layout.


    If the system configuration information was not preconfigured, you will need to
    provide the appropriate information when prompted.


    # After the Upgrade


    Merging the existing system configuration with the Solaris 8 operating system
    may not be completely successful, and you may need to perform some manual cleanup.
    Check the /a/var/system/data/upgrade_clean file to determine any configuration
    problems that need to be reviewed and possibly modified before the system can
    be rebooted.


    After resolving any cleanup issues, restart the system.


    # Preconfiguring System Configuration Information


    You can preconfigure the system configuration required for installation in two
    ways: the name service method or the syscfg file method:


    +   * Name service method—This method adds system information to an available
    name service (NIS or NIS+). During installation, the information is retrieved
    from the name service and used to configure the system. This is the recommended
    method for SPARC installations.

    * Syscfg method—This creates a file named syscfg that contains configuration information.
    The file must conform to a defined format (keywords and syntax). The file must
    be available on a local drive, and the local diskette on the remote drive must
    be accessible via the network.


    # Over–the-Network Installation


    Typically, a system is installed with the Solaris 8 distribution CD using a local
    CD-ROM drive. However, software can be installed over the network if the appropriate
    systems are set up. These systems are:


    +   * Install server—A server created by copying the contents of the Solaris 8
    distribution CD to its disk drive or that has the distribution CD available in
    its CD-ROM drive.

    * Boot server—A server used for booting clients that are located on a different
    subnet than the install server. The boot server should be located on the same
    subnet as the clients.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'You set up systems to be installed over the network either by using Solstice
    Host Manager to add (preconfigure) information about the systems to NIS/NIS+ or
    by adding the information to configuration files of an install server or boot
    server.


    # Software Package Administration


    Both Sun Microsystems and third-party vendors deliver software as easily manipulated
    collections of files and executable installation/removal referred to as *packages.


    Software packages can be installed on or removed from standalone systems or servers
    in a fairly straightforward manner, because the root and /usr file systems are
    local.


    # Package Tools


    Solaris 8 package tools provide a convenient mechanism for installing and removing
    packaged software. These are standard Unix commands and are accessible through
    the shell command-line interface. In addition, the system administration tool,
    **admintool**(1M), provides a graphical user interface (GUI) for installing and
    removing packages.


    The most commonly used command-line package tools are:


    +   * **pkgadd**(1)—Installs packages

    * **pkginfo**(1) and **pkgparam**(1)—Displays information about packages

    * **pkgrm**(1M)—Removes a package

    * **pkgchk**(1M)—Checks the proper installation of a package


    # Installing a Package Using the **pkgadd** Command


    The **pkgadd** command can install a package from disk or CD-ROM. Typically, software
    obtained through the network or from magnetic tape or disk is copied into a spool
    directory on the system before installation. The default package directory is
    `/var/spool/pkg`, but you can use any location with adequate space.


    To install one or more packages located in the default spool directory using the
    **pkgadd** command, only the package names need to be specified as command-line
    arguments. For example, to install the SUNWast package, use the following command:


    ```

    # pkgadd SUNWast

    ```


