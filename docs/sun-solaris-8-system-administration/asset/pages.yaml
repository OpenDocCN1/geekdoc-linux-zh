    # The /etc/dfs/dfstab File


    The /etc/dfs/dfstab file resources that should be shared automatically when the
    system is changed to level 3 or when the **shareall** command is used.


    This file can be modified using any text editor. To automatically share a resource,
    add a line to the /etc/dfs/dfstab file that contains the **shareall** command
    with the desired command-line arguments and options that have been entered manually.
    To remove automatic sharing of a resource, delete the appropriate **share** command
    from /etc/dfs/dfstab. See the previously described **share** commands for examples.


    Note


    > You might wonder why some of the directories, files, and even commands associated
    with NFS use the phrase *dfs or df *. This usage comes from the System V (5) version
    of the Unix operating system. Originally, Distributed File Systems (DFS) had two
    variations: NFS and the Remote File System (RFS). Directories, files, and commands
    that contained the *dfs* phrase were used to manage and configure both types of
    file systems. Since then, RFS has disappeared, leaving behind the DFS legacy.


    # The shareall and unshare Commands


    The **shareall** command shares one or more resources. If the **-F nfs** command-line
    argument is not specified, the default file system type (NFS) is assumed. If a
    name of a file (that contains one or more **share** commands) is not specified
    as a command-line argument, the /etc/dfs/dfstab file is used by default.


    The **unshare** command currently clears shared resources. If the **-F nfs** command-line
    argument is not specified, the default file system type (NFS) is assumed.


    # The dfshares Command


    The **dfshares** (1M) command lists shared resources on either the local or a
    remote system. If the hostname (or IP address) of a remote system is specified
    as a command-line argument, the resources shared on that system are listed.'
