  md: '# Over-the-Network Installation


    Typically, Solaris is installed directly from the Solaris distribution CD. Doing
    so requires that each system be equipped with a CD-ROM drive. However, another
    approach is available: Solaris can be installed over the network using a remote
    server that has either the Solaris distribution CD or a copy of the files from
    the Solaris distribution CD on its hard disk.


    The over-the-network installation can be used with the two interactive installation
    methods (Solaris interactive installation or Web Start, covered in Chapter 3)
    or the two automatic installation methods (JumpStart and custom JumpStart).


    To perform the over-the-network installation, you must set up one or more network
    servers, consisting of an install server and possibly a boot server. In addition,
    you must add information about the install clients in the local NIS or NIS+ service
    or in the /etc files of the appropriate install servers.


    # Install Server


    An install server is a system that provides the distribution files necessary for
    the installation of the Solaris operating system on an install client during an
    over-the-network installation. The files can be provided directly from the Solaris
    distribution CD mounted in a local CD-ROM drive or from a local hard disk.


    If you copy the distribution files to a local hard disk, a single install server
    can be used to provide the files for multiple releases (Solaris 8, Solaris 7,
    Solaris 2.6, and so on) and/or for multiple platforms (SPARC and Intel x86). In
    addition, a local hard disk typically provides faster access to the distribution
    files than a local CD-ROM drive.


    To set up a system as an install server, mount the Solaris 8 Software (1 of 2)
    distribution CD in the local CD-ROM drive. Then use the setup_install_server command,
    under the Solaris 8/Tools distribution on the Solaris distribution CD, copy the
    distribution files to the local hard disk of the install server. One command-line
    argument is required: the full path to a directory to which the distribution files
    will be copied. Although you can use any directory, by convention the directory
    is named /export/install. The following line executes the setup_install_server
    command from the Solaris 8/Tools distribution to set up an install server.


    ```

    # ./setup_install_server /export/install

    ```


    The setup_install_server command copies the CD image of the software to the specified
    directory. Both the Product and Tools directories are copied. In addition, a netmask(4)
    file that contains the network subnet mask for the server is created in the Tools
    directory.'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'Once an install server is set up, you can add products from the other Solaris
    distribution CDs, such as Solaris 8 Software (2 of 2) or Solaris 8 Languages,
    to the install server. The directory used for the files associated with the install
    server must be specified as a command-line argument. To add to the install server,
    insert the supplemental CD into the local CD-ROM drive and execute the `add_to_install_server_add_install_server(1M)`
    command on the CD. The following line executes

    `add_to_install_server` command from the Solaris/8/Tools directory of the distribution
    CD to add to the install server:


    ```

    # ./add_to_install_server /export/install

    ```


    The `add_to_install_server` command supports two command-line arguments. The first
    is -s, which allows selection of products to install. By default, all products
    are installed. The second is -p product_path, where `product_path` is an alternate
    directory for products to be installed.


    By default, the install server supports the SunInstallation program (Chapter 3).
    However, the install server can be modified to use the Solaris Web start program
    instead. The `modify_install_server(1M)` command (located on the Solaris 8 Installation
    CD) can be used to copy the Web Start-enabled miniroot from the CD to the install
    server configuration.


    To modify the install server, insert the Solaris 8 Installation CD into the local
    CD-ROM drive and execute the `modify_install_server` command from the mount point
    of the distribution CD to modify the install server:


    ```

    # ./modify_install_server /export/install

    ```


    The `modify_install_server` command supports the -p command-line argument, which
    preserves the existing miniroot by copying it to the /Solaris_8/Tools/Boot origin
    location under the install server configuration before the CD miniroot is installed.


    # Boot Server


    A boot server is a system that contains the files necessary to boot a SPARC install
    client over the network during an over-the-network installation. After an install
    client has booted, the boot server has completed its function. The remainder of
    the installation is supported by an install server. Because Intel-compatible clients
    boot from local diskette or local CD-ROM, they do not use a boot server for installation.


    Typically, an install server and a boot server reside on the same system. In fact,
    when a system is set up as an install server, it is also set up as a boot server.
    However, if install clients are on a'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'different subnet than an install server, a boot server must be set up on the
    same subnet as the install clients.


    A boot server is required to be on the same subnet as SPARC install clients because
    the clients obtain booting information from the boot server using the Boot Protocol
    (BOOTP). Typically, this protocol is not passed by routers (which interconnect
    subnets).


    To set up a system as a boot server, the system must have access to the Solaris
    software distribution CD through a local CD-ROM drive or a remotely shared CD-ROM
    drive.


    The setup_install_server command, under the Solaris_8/Tools directory of the software
    distribution CD, copies the boot software to the boot server. Two command-line
    arguments are required: -b, specifies that a boot server is being set up; and
    the full dirname to an empty directory where the boot files will be copied. Although
    any directory, by convention the directory is named boot and is located at the
    /export/install directory. The following line executes the setup_install_server
    command from the Solaris_8/Tools directory of the distribution CD to set up a
    boot server:


    ```

    ./setup_install_server -b /export/install/boot

    ```


    # Adding Install Clients


    When a system or install client is installed over the network, basic information
    about the install clients needs to be available through a name service (NIS/NIS+)
    or in the files under the /etc directory on the install server or boot server.


    You can use the Solstice Host Manager program to add this information or, if Host
    Manager is not available, the add_install_client command.


    The add_install_client command can only be used to update the /etc files on an
    install server or boot server. Use the appropriate NIS or NIS+ procedures to add
    client information to these name services. At minimum, you must add the hostname,
    IP address, and Ethernet address of the client.


    Depending on the environment, you can modify the following /etc files to support
    over the network installation:


    +   * /etc/bootparams(4)—An entry for each client, to define various pathnames
    and parameters required to boot client

    * /etc/dfs/dfstab(4)—Entries for any NIS resources that should be shared

    * /etc/ethers(4)—An entry mapping the Ethernet address to the system hostname'
  merge: -1
  pgno: 394
- img_proc: true
  md: '+   - /etc/exports(4)—Entries for any NFS resources that should be shared

    - /etc/hosts(4)—An entry mapping the hostname to an IP address

    - /etc/inetd.conf(4)—An entry to enable the Trivial File Transfer Protocol (FTP)
    daemon


    The following lines use the add_install_client command to set up a system for
    over-the-network installation. This command is executed from the Solaris_8Tools
    distribution CD (2 of 2) distribution CD or from the mount point of the Solaris
    8 Installation CD. The name of the system to be installed is identified by the
    host command-argument allowed by the platform group of the system.


    In this case, the command-argument sun4m is used to identify the system to be
    installed as a SPARC5 platform:


    ```

    # add_install_client host sun4m

    ```


    Table 21.2 lists the command-line arguments for the add_install_client command.


    Table 21.2: Command-line arguments for the add_install_client command.

    | Argument | Description |

    | --- | --- |

    | -c server:path | Specifies the profile server and path of the JumpStart directory.
    |

    | -d | Defines the client as a DHCP client. |

    | -e address | Specifies an Ethernet address. |

    | -i address | Specifies an IP address. |

    | -n server:service netmask | Specifies the name service and the name service
    server. The netmask also can be defined. |

    | -p server:path | Specifies the server on which the syscfg file is located and
    the absolute path to the syscfg file. |

    | -s server:path | Specifies the install server and path to the CD image (needed
    only when you''re adding a client to the boot server). |


    # Install/Boot Server Daemons


    Several network daemons are used by the install and boot servers to support over-the-network
    installation.


    +   - in.arpd(1M)—The Reverse Address Resolution Protocol (RARP) daemon provides
    Ethernet-address-to-IP-address resolution. Clients use this service to determine
    their IP address based on their assigned Ethernet address.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '+   - in.tftpd(1M)—The Trivial File Transfer Protocol (TFTP) daemon provides
    a method for SPARC install clients to obtain bootable images from a server without
    logging in to the server.


    +   - nfd(1M)—The Nfs daemon provides remote access to file systems over the network.


    +   - rpc.bootparam(1M)—The Boot Protocol (BOOTP) daemon provides clients with
    boot information from the /etc/bootparams


    # The RARP Daemon (in. rarpd)


    The /etc/sbin/rarpd daemon provides Ethernet-address-to-IP address resolution.
    When a RARP request is received, the in.arp program attempts to determine the
    IP address assigned to the specified Ethernet address. The look-up procedure consists
    of first looking up the Ethernet address to obtain the hostname of the system,
    and looking up the hostname to determine its IP address.


    The procedure to look up the hostname (based on the Ethernet address) is determined
    by the configuration of the *ethers* keyword in the name service switch (/etc/nsswitch.conf)
    file. It may be obtained from NIS (ethers.byaddr map), NIS+ (ethers table), or
    the /etc/ethers file. See *ethers(4)* for the format of the /etc/ethers files.


    The procedure to look up the IP address (based on the obtained hostname) is determined
    by the configuration of the *hosts* keyword in the name service switch (/etc/nsswitch.conf)
    file. It may be obtained from DNS, NIS (hosts.byname), NIS+ (hosts table), or
    the /etc/hosts file. See *hosts(4)* for the format of the /etc/hosts files.


    # The TFTP Daemon (in. tftpd)


    The /usr/sbin/tftpd daemon provides a simple method for SPARC install clients
    to obtain the boot image from the install/boot server using the Trivial File Transfer
    Protocol (TFTP). Unlike the standard File Transfer Protocol (FTP), TFTP does not
    require user authentication (account name and password) to access files. The boot
    images are typically stored under /tftpboot directory.


    # The NFS Server Daemon (nfd)


    The /usr/lib/nfs/nfd daemon provides network access to the Solaris 8 distribution
    files via NFS. These files are identified by the boot parameters provided by the
    *rpc.bootparam* daemon.


    # The Boot Parameter Service Daemon (rpc. bootparam)


    The /user/sbin/rpc.bootparam daemon provides share names and other information
    necessary to boot install clients. The source of the information is determined
    by the configuration of the *bootparams* keyword in the name service switch (/etc/nsswitch.conf)
    file. It may be obtained'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'from NIS (bootparams map), NIS+ (bootparams table), or the /etc/bootparams
    file. See bootparams(4) for the format of the /etc/bootparams file.


    Exam Alert: Because these four daemons are required to support over-the-network
    installation (with or without JumpStart), the add_install_client command will
    configure and start them (on the install/boot server) if required when a network
    install client is configured.


    # # Automating Installation with JumpStart


    JumpStart feature provides a mechanism to automatically install the Solaris operating
    system. The two JumpStart methods are JumpStart and custom JumpStart.


    Exam Alert: Not only does JumpStart automate, it can be used to automate the installation
    of large numbers of systems that are identically configured. If you need to install
    100 servers using the same configuration, JumpStart provides a way to simplify
    this task.


    JumpStart lets you install the Solaris operating system on new SPARC platforms
    by inserting the Solaris distribution CD into the local CD-ROM drive and powering
    on the system or booting by the network. The software that is installed is determined
    by a profile. The default profile is selected based on the hardware model and
    the size of the hard disks. The software installed cannot be manually selected.


    All new SPARC platforms have a preinstalled JumpStart boot image. This boot image
    can be copied to any SPARC platform by using the re-install(1M) command.


    Custom JumpStart lets you install the Solaris operating system on new SPARC or
    Intel x86 platforms inserting the Solaris distribution CD into the local CD-ROM
    drive and powering on the system or booting by the network. The software that
    is installed is determined by a custom profile. Using this method, you can automatically
    install groups of systems in an identical manner. The custom profile, with other
    JumpStart configuration files, is located in the JumpStart directory.


    # # JumpStart Configuration Directory


    The JumpStart configuration directory contains the files used to customize a JumpStart
    installation. It provides a means to automate the system configuration phase of
    an installation for groups of similar systems. This directory can reside either
    on a floppy diskette, referred to as a profile diskette, or on a network server,
    referred to as a profile server. The profile server provides access to the custom
    JumpStart configuration files over the network and eliminates the need to create'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'distribute multiple profile diskettes during installation of a large number
    of systems. The two basic types of files in the JumpStart directory are rules
    file and one or more profile files.


    The Part II Exam (310-012) continues to refer to the profile file as the class
    file, even though it was renamed way back in the Solaris 2.6 system documentation.
    Keep this in mind when you see JumpStart questions that refer to the class file.


    # The Rules File


    The rules file is a text file that contains an entry or rule for each group or
    group of systems that are to be automatically installed. Each rule identifies
    the system (or group of systems) based on one or more attributes and identifies
    a unique profile file that provides the configuration details for that system
    or group of systems.


    Each rule consists of one or more keywords and values followed by the name of
    a begin script, the profile file, and then the finish script (all separated by
    tabs or spaces). Keywords (and associated values) include the following:


    +   * any

    * arch (followed by a processor-type value)

    * disksize (followed by a disk name value)

    * hostaddress (followed by an IP address value)

    * hostname (followed by a hostname value)

    * mensize (followed by a physical memory value)

    * model (followed by a platform name value)


    One or more of these keywords and associated values are specified per rule to
    uniquely identify a system or group of systems.


    The keywords and values are the name of a begin script. This is a Bourne shell
    script that executes before installation begins. If a begin script is not required,
    a hyphen (-) should be specified. Following the begin script is the name of a
    profile file in the JumpStart configuration directory that provides the configuration
    details for that system or group of systems. Following the profile file is the
    name of the finish script. The finish script is a Bourne shell script that is
    executed after installation is complete. If a finish script is not required, a
    hyphen (-) should be specified.


    The following listing is an example of several entries from a rules file:


    | hostname sample_host | host_class set_root_pw |

    | network 924. 222. 43.0 && && | net924_sun4c |

    | karch sun4c | |

    | arch i386 x86-begin x86-class |

    | any - | any_machine |'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'The first entry lists the JumpStart installation for the host named sample_host.
    No begin script is specified, the host_class file is used as the profile or class
    file, and the finish script set_root_pw is called after installation to set the
    password of the root account.


    The second entry is actually listed on two lines. The backslash (\ character at
    the end of the first line continues to the next line. For systems connected on
    network 924.222.43.0 and are SPARC sun4c platforms, the net924_sun4c profile or
    class file is used. No begin or finish script is specified.


    The third entry is for all i86 or Intel-compatible platforms. The x86-begin script
    is executed first, and then the x86-class profile or class file is used to direct
    the installation. No finish script is specified.


    The fourth provides a default. Any systems not covered by the other rules are
    installed using the any_machine profile file. No begin or finish script is specified.


    # # The Profile Files


    A profile (or class) file is a text file that defines how to install the Solaris
    8 software on a system. Like the rules, a profile file contains keywords and associated
    values that guide the installation. Keywords and associated values include the
    following:


    +   * **boot_device** (followed by the partition to use as a boot device)

    * **cluster** (followed by the name of the software group to install, add, or
    delete)

    * **filesystem** (followed by pathname and mount point of a remote file system
    to mount)

    * **install_type** (followed by the type of install: initial_install or upgrade)

    * **package** (followed by the name of a software package to add or delete)

    * **partitioning** (followed by the type of the disk partitioning: default, existing,
    or explicit)

    * **root_device** (followed by the partition to use as the root device)

    * **system_type** (followed by the system type: standalone or server)


    The following lists the contents of the any_machine profile provided as a JumpStart
    sample on the Solaris 8 distribution CD:


    ```

    install_type      initial_install

    system_type      standalone

    partitioning      default

    cluster            SUNWCuser

    cluster            SUNWCxl delete

    package           SUNWaudmo add

    filesystem        any 40 swap

    filesystem        any 50 /opt

    ```'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'The install_type entry must be specified as the first entry in a profile. This
    example identifies the installation as an initial stead instead of an upgrade.
    The system type is standalone with default disk partitioning. The End User Support
    software group or cluster will be installed, but the xgl cluster will be deleted
    and the audmo package will be added. For the file layout, any partition will be
    used for swap (40MB in size), and any partition will be used for the /opt file
    system (50MB in size).


    # Validation


    Before you can use the rules file and profile files, you must validate them by
    using the check(1M) command (located on the Solaris 8 distribution CD under the
    Tools directory). If the rules file and all profile files are set up correctly,
    a rules.ok file is created in the JumpStart configuration directory.


    # Booting the JumpStart Client


    When booted, the JumpStart client attempts to locate the rules and profile files
    associated with the system. If a diskette is mounted in the disk drive that contains
    the JumpStart configuration directory, the client will use.


    Otherwise, the client will contact the in.rapid daemon running on an install/boot
    server using a RARP broadcast and its client name or IP address based on its Ethernet
    address. Then the client will contact the in.bootparam daemon running on an install/boot
    server using BOOTP. The request includes the name of the client or IP address.
    Based on this information, the in.bootparam daemon provides the boot parameters
    from /etc/bootparam, NIS, or NIS+. One of these parameters is install_config,
    which defines the profile server and path to the JumpStart configuration directory.
    Other parameters include the name of TFTP server that will provide the boot image
    (SPARC only) and NFS server that will provide the distribution of the Solaris
    8 software over the network are obtained using this same procedure. Once the JumpStart
    Directory is located, the rules files determine the appropriate profile or class
    to use. The details in the profile file are used to direct the installation.


    The install files will be obtained from the distribution CD mounted in a local
    CD-ROM drive or from an install server and path identified by the install boot
    parameter.


