    the other practice test resources available via the Web (locate using your search
    engine).


    For any given subject, taking a class if you''ve tackled self-study materials,
    taken the test, and failed anyway. If you can afford the price, the opportunity
    to interact with an instructor and fellow students can make all the difference
    in the world. For about Sun classes, visit the Certification Program page at http://suned.sun.com.


    If you can''t afford to take a class, visit the Certification Program anyway,
    because it also includes free sample questions. Even if you can''t afford much
    at all, you should still invest in low-cost practice exams from commercial vendors,
    because they can help you assess your readiness to pass a test better than any
    other tool. Check with the www.unixcert.net Web site for other available resources.


    +   6. Have you taken a practice exam on your chosen test? [Yes or No]


    If—and you scored 66 percent or better on Part I and 70 percent or better on Part
    II—you''re probably ready to tackle the real thing. If your score isn''t above
    that crucial threshold, keep at it until you break that barrier. If you answered
    no, obtain all the free and low-budget practice tests you can find (or) and get
    to work. Keep at it until you comfortably break the passing threshold.


    Tip


    There is no better way to assess your readiness than to take a good-quality practice
    exam and pass with a score of 66 percent or better on Part I and 70 percent or
    better on Part II. When I''m preparing, I shoot for 80 percent, just to leave
    room for the “weirdness factor” that sometimes shows up on Solaris exams.'
