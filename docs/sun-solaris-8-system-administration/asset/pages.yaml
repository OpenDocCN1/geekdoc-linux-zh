    # ## Terms’ 11 need to understand:


    +   * Kernel

    * Shell

    * File system

    * Daemon

    * The Solaris 8 Reference Manual


    # ## Techniques you’ 11 need to master:


    +   * Distinguishing between the parts of the operating system

    * Distinguishing between the three shells

    * Using the `command` to view online manual pages


    This chapter covers some basic concepts of the Solaris 8 operating system. The
    first section briefly summarizes the new features of Solaris 8. The second section
    addresses the structure and components of the operating system. The next section
    summarizes the three shells, and the last section provides an overview of the
    reference manual. This chapter covers the System Concepts test objectives.


    # ## New Features of Solaris 8


    The following enhancements have been added to the latest release of Solaris:


    +   * Internet Protocol version 6 (IPv6)—The next generation of IP, which overcomes
    many of the limitations associated with the current version of IP (version 4).
    The main advantages are a larger address space and the autoconfiguration of addresses.
    In Solaris 8, interfaces can be configured simultaneously for IPv4 and IPv6.

    * Java 2 Software Development Kit (SDK)—The latest version of the Java SDK makes
    Solaris a powerful platform for machine-independent development.

    * Universal Disk Format (UDF)—Allows any exchange of data stored on CD-ROMs, DVDs,
    hard disks, and disettes.

    * Graphical wizards—A new couple graphical wizards have been added to improve
    system usability. Most notable are the Installation Wizard and the DCHP Manager.
    In addition, the X Server that supports X applications has been upgraded to X11R6.4
    industry standard.'
