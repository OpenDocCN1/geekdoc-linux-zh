  md: '# The rsh Command


    The **rsh** command executes a command on a remote system. At a minimum, two command-line
    arguments are required: the name of the remote host and the command to be executed.
    As with the other commands, the remote authentication database is used. If the
    desired remote user account is not the same as the local user account, then it
    is identified using the -l command-line argument. In the following examples, ls
    is executed for the /tmp directory on the remote system solaris8:


    ```

    $ solaris8 "ls /tmp"

    ab2. socat.cache

    dtdcache_:0

    file.txt

    mp5caaNc

    mpfa0Fc

    mpJaAWMc

    mpqvaData

    ps_data

    sdtvolcheck388

    $

    ```


    # The Remote Authentication Database


    The remote authentication database is used to determine which remote hosts and
    users are considered "trusted". The **rlog**, **rsh**, and **rpc** commands (collectively
    known as the "r commands") use the remote authentication database. This database
    consists of two types of files: the /etc/hosts.equiv file, which applies to the
    entire system, and the .hosts files, which apply to individual user accounts and
    are located in the home directories of user accounts.


    You use the remote authentication database to determine whether a user on a remote
    system can access the local system using the same user account. For example, if
    the "guest" account on a remote system is authorized to access the local system
    and then so using the **login** command, the user is automatically logged in to
    the local system as "guest" without providing a user account and a password.


    The remote authentication procedure first checks to determine whether the hostname
    of the remote system is listed in the /etc/hosts.equiv file. If it is listed,
    remote authentication succeeds and the user is granted access.


    If the hostname of the remote system is not listed, the remote authentication
    continues. The home directory of the local user account name (which matches the
    user account of the remote user) is checked to determine whether the hostname
    of the remote system is listed in the .hosts file. If it'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'is listed, remote authentication succeeds and the user is granted access to
    the local system. If it is not listed, remote authentication fails and the user
    is prompted for a local user account name and password.


    Both files consist of a list of hostnames (one per line). A hostname by itself
    or preceded by a plus sign (+) is considered a trusted host and allowed access.
    If a hostname is preceded by a minus sign (-), the host is considered untrusted
    and denied access.


    Optionally, a hostname can be followed by a user account name. If this form is
    used in the /etc/hosts.equiv file and the user account matches the specified user
    name, the user is given access as any user. If the user is allowed to access the
    system use any user account, then the user either provides the user account as
    a command-line option to the login command or is prompted for it. If the optional
    form is used in the .hosts file, the remote user is given access as the specified
    user account.


