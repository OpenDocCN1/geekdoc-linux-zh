    +   7. Restart the ypbind command using the following command:


    ```

    /usr/lib/netsevc/yp/ypstart

    ```


    +   8. Run the ypinit command from the /var/yp directory, as shown here (where
    master is the hostname of the NIS master server):


    +   9. # cd /var/yp

    10. # ypinit -s master'
