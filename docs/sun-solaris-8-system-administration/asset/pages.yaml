    > Alert

    The commands used to create file systems, the **fsck** command expects raw logical
    device names. You can use the **fsck** command to check and repair CacheFS, UDF,
    and UFS file system. Remember to unmount the file system first.


    # Monitoring and Unmounting File Systems


    File systems are made accessible using the **mount(1M)** command. This command
    associates the file system with a subdirectory of a currently mounted file system.


    The **mount** command is typically called with two command-line arguments: a logical
    block device (partition) associated with a file system and a mount point where
    the file system should be mounted. If only one command-line argument is specified
    (either device name or mount point), the /etc/fstab file is searched for an entry
    that matches, and if found mount the file system using the information from the
    /etc/fstab entry. In addition, the **-F** command-line can be specified to identify
    the type of file system being mounted. Mounted file systems are listed in the
    /etc/mntab file (unless the **-m** command-line argument is specified). If the
    **mount** command is used with no command-line arguments, all mounted file systems
    listed in the /etc/mntab are displayed.


    The **mount** command supports several options specified as command-line arguments.
    One significant option is UFS large file support. By default, UFS file systems
    support large files (greater than 2GB in size). This default is the same as specifying
    **-o largefiles** as a command-line argument. To disable large file support, specify
    **-o nlargefiles** as a command-line argument to the **mount** command. If this
    option is specified and a large file exists on the file system, the mount will
    fail.'
