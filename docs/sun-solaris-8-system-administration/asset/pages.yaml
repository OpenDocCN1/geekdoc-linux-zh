- img_proc: true
  md: '# # Chapter 4: Booting and Shutting Down the System


    Terms you’ 11 need to understand:


    +   * OpenBoot

    * Nonvolatile RAM (NVRAM)

    * Device aliases

    * The boot process

    * Kernel modules

    * init program

    * System run levels

    * rc scripts


    # ## Techniques you’ 11 need to master:


    +   * Creating and deleting a device alias

    * Troubleshooting boot problems

    * Changing system run levels

    * Adding system services using rc scripts


    This chapter addresses topics related to booting and shutting down the system.
    The first section covers aspects of the system firmware on Sun SPARC platforms,
    including the Boot PROM objectives. The second section summarizes the boot process
    for both SPARC and Intel x86 platforms. This section covers the Boot Process test
    objectives. The third section describes system run levels, the services available
    at the different run levels, and how to change between the run levels. Also included
    a description of how to add custom services at a selected run level. This section
    includes the Initialization and Shutdown test objectives.


    # ## Boot PROM Firmware (OpenBoot)


    The boot Programmable Read-Only Memory (PROM) of a system is used to store the
    firmware that executed immediately immediately after system hardware finishes
    the Power On Self Test (POST). This firmware is called OpenBoot, and it’s the
    standard firmware for Sun Systems. OpenBoot firmware pertains only to SPARC platforms,
    but some limited functionality is available on Intel x86 platforms.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'OpenBoot is used to boot the operating system, run diagnostics, modify boot-related
    parameters stored in nonvolatile RAM (NVRAM), and provide a Forth interpreter.


    Currently, two versions of OpenBoot are available: version 2.x and version 3.x.
    OpenBoot 2.x was introduced with SPARCstation 2 and SPARCstation IPX systems.
    OpenBoot 3.x is an enhanced version of OpenBoot 2.x; it’s based on Institute of
    Electrical and Electronics Engineers (IEEE) Standard 1275-1994, "Standard for
    Boot Firmware." OpenBoot 3.x is used on Sun series and new SPARC platforms.


    OpenBoot provides a command-line interface for the system console. The command-line
    interface has two modes:


    +   - Restricted Monitor—Allows the administrator to boot the operating system,
    continue a suspended operation, or start the Forth Monitor. The prompt for the
    Restricted Monitor is the symbol.


    +   - Forth Monitor—Allows the administrator to boot the operating system, run
    diagnostics, and modify system configuration parameters. The prompt for the Forth
    Monitor is the word *ok*, which is typically referred to as the OpenBoot prompt.


    System configuration parameters are stored in the system NVRAM. These parameters
    determine the initial configuration and related communication characteristics
    of the system and retain their value if the power to the system is shut off.


    You can view the value of these parameters using the OpenBoot **printenv** command.
    To modify them, use the OpenBoot **setenv** command.


    # Important OpenBoot Commands


    Some of the most important OpenBoot commands are used to display system configuration
    information, perform hardware testing, and control system booting. All these commands
    are entered at the Forth Monitor or OpenBoot **ok** prompt.


    Table 4.1 lists the OpenBoot commands that display system configuration data,
    and Table 4.2 lists the OpenBoot commands that you use to perform basic hardware
    testing. Table 4.3 lists the variations of the OpenBoot **boot** command that
    you can use to select different devices.


    | Command | Description |

    |---|---|

    | banner | Displays the power-on banner |

    | dealias | Lists all device aliases |

    | .enet-addr | Displays an Ethernet address |'
  merge: -1
  pgno: 77
