  md: '# # Chapter 6: The User Environment


    Terms you’ 11 need to understand:


    +   * User and group accounts

    * admintool command

    * Password aging

    * Initialization files and templates

    * System profile


    # ## Techniques you’ 11 need to master:


    +   * Creating and deleting user accounts

    * Administering passwords

    * Creating and deleting group accounts

    * Using the admintool command

    * Customizing initialization files and templates

    * Logging in and out of the system

    * Identifying monitoring users


    This chapter covers the Part 1 exam objectives that address User Administration.
    We’ll discuss administering user and group accounts, the initialization files
    associated with user accounts, logging in and out of a system, and identifying
    the users currently logged in the system.


    # ## Account Administration


    The Solaris 8 system controls access to data and resources by means of user and
    group accounts. The administration of user accounts and group accounts, along
    with the passwords associated with these accounts, is a key system administration
    activity.


    # ## User Accounts


    You can add, modify, or delete user accounts using command-line utilities or the
    admintool(1M) command. Using the admintool command reduces or eliminates the possible
    introduction of typos and other errors that might affect all the user accounts.'
