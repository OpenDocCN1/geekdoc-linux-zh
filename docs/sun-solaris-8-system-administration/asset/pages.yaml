    Exam Alert


    You can use the mount command to mount CacheFS, HSFS, NFS, TMPFS, UDF, and UFS
    file systems. Unlike the other file system commands, the mount command expects
    a local block device name of a partition in which the file system resides.


    The unmount(1M) command is used to unmount a file system. The file system cannot
    be unmounted if it is busy (a program that runs on the file system is being executed
    or the current directory of a logged-in user is within the file system). Either
    the block device name or the mount point can be specified as a command-line argument.


    The mount(1M) command mounts all file systems listed in the /etc/vfstab file.
    This file is also used to determine the file systems to automatically mount during
    system boot. You can add or remove file systems in the /etc/vfstab file with any
    standard editor. Table 9.4 lists the (tab-separated) fields of an entry in the
    /etc/vfstab file. A hyphen (- ) is used to indicate no entry in a field.


    | Table 9.4: Fields of the /etc/vfstab file |

    | Field | Description |

    | Device To mount | Logical block device name of the file system partition to
    mount |

    | Device To fsck | Logical raw device name used for the fsck command |

    | Mount Point | Subdirectory where the file system should be mounted |

    | FS Type | File system type |

    | fsck Pass | Flag used to indicate whether the fsck command should be executed
    automatically (a nonzero numeric value indicates yes) |

    | Mount At Boot | A "yes" indicates that the file system should be mounted at
    boot or when the mountall command is executed; otherwise, "no" |

    | Mount Options | Any mount options that are desired and appropriate for the file
    system |


    The ummount(1M) command unmounts all the file systems listed in the /etc/mnttab
    file, except root, /proc, /var, and /usr.


