    ```

    # mt - f /dev/rmt/0n fsf 4

    #

    ```


    # The ufsdump and ufsrestore Commands


    The ufsdump(1M) and ufsrestore(1M) commands are used to back up and restore UFS
    file systems or specified files/directories. These commands can perform incremental
    backup and restore using the file modification date as the selection criterion.


    # Dumping a File System Using the ufsdump Command


    The ufsdump command provides several command-line arguments. Most of them relate
    to changing the default characteristics of the backup media. Table 9.7 lists the
    most significant command-line arguments of the ufsdump command.


    Table 9.7: The ufsdump command-line arguments.

    | Argument | Description |

    | 0 through 9 | Dump level (0 is the entire file system) |

    | a archive_file | Uses archive_file to store a dump table of the contents |

    | c | Uses cartridge tape instead of standard half-inch reel tape |

    | f dump_file | Uses dump_file instead of /dev/rmt/0 |

    | u | Records the dump level and date in /etc/dumpdates |

    | v | Verifies the dump media after backup |


    You specify these single-character arguments together as a group followed by the
    (archive_file, dump_file, and so on) in the same order as the single-character
    arguments. Along with the appropriate command-line arguments, you must specify
    the files to dump (typically a logical raw device name of a file system).


    > To ensure a usable backup, the file system should be unmounted or the system
    should be in the single-user run level before the backup is performed.


    If no command-line arguments other than the files are specified to dump, the default
    is 9f /dev/rmt/0. This creates a dump level 9 backup using /dev/rmt/0 as the dump
    file and records the backup in the /etc/dumpdates file.'
