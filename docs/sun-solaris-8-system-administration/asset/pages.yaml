    # ## Techniques you’ 11 need to master:


    +   - Identifying pseudo file systems

    - Using the proc tools to monitor process status

    - Creating, adding, and deleting swap space


    This chapter covers the *Pseudo File Systems and Swap Space* test objectives.
    The first section describes the Solaris pseudo file systems and provides information
    on the more important pseudo file systems. The second section covers managing
    swap space.


    # ## Solaris Pseudo File Systems


    Solaris supports several types of memory-based file systems. These are referred
    to as *pseudo file systems*. Because they are memory-based, these file systems
    provide faster access to data stored in them. However, they are not permanent.
    In addition, any directories or files in pseudo file systems are lost when the
    file system is unmounted or the system is rebooted/shut down. Table 16.1 describes
    the pseudo file systems supported by Solaris 8.


    | Name | Abbreviation | Use |

    |---|---||

    | Cache File System | CacheFS | Local caching for remote file systems |

    | File Descriptors File System | FDFS | Opening file using file descriptors with
    explicit names |

    | First-In First-Out File | FIFOFS | Accessing data (named |'
  merge: -1
  pgno: 312
- img_proc: true
  md: '| Name | Abbreviation | Use |

    | --- | --- | --- |

    | System | | pipes) |

    | Loopback File System | LOFS | Providing alternate paths to existing data |

    | Name File System | NAMEFS | Dynamic mounting of file descriptors by STREAMS
    modules |

    | Process File System | PROFS | Accessing process status and information |

    | Special Device File System | SPECS | Accessing special character or block devices
    |

    | Swap File System | SWAPFS | Accessing system swap space |

    | Temporary File System | TMPFS | Providing fast access to temporary files |


    Of these pseudo file systems, the following five file systems do not require any
    administration: FDFS, FIFFS, NAMEFS, SPECS, and SWAPFS. The other four pseudo
    file systems—CacheFs, LOFS, PROFS, and TMPFS—are described in the following sections
    or in Chapter 17.


    > Note In some Solaris documentation, पतला or memory-based file systems are referred
    to as "virtual file systems." However, this term is also used for file systems
    created and managed by virtual disk management systems (covered in Chapter 15).
    To avoid confusion, we refer to memory-based file systems only as pseudo file
    systems.


    # Process File System (PROFS)


    The Process File System is a memory-based file system used to provide process
    status and information. One instance of PROFS exists on a system by default; it
    is accessible as the /proc directory. This directory contains one directory for
    each process on the system. The directory name is the process ID (PID) of the
    process. Files under each PID directory provide various status and other information
    about the process. The /proc directory is owned by the root account and has an
    access mode of 555 (read/execute for owner/group/other), because no user account
    (not even root) should attempt to modify the files. These files are managed directly
    by the kernel.'
  merge: -1
