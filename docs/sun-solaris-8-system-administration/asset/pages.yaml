  md: 'Last Line mode supports the input of commands to save changes, perform searches,
    and execute other ex(1) and ed(1) commands.


    # Command Mode


    The main functions of Command mode are navigation and deletion. Navigation allows
    you to position the cursor at a desired location within the file. You can then
    perform deletion or Input mode operations (add or modify) of the file contents.


    # Cursor Positioning


    Table 10.2 lists the commonly used cursor-positioning keyboard sequences. See
    the vi(1) manual for additional details.


    Table 10.2: Cursor-positioning (Command mode) sequences for the vi editor.

    | Sequence | Description |

    | --- | --- |

    | <up arrow> | Moves the cursor up one line. |

    | <down arrow> | Moves the cursor down one line. |

    | <left arrow> | Moves the cursor left one character. |

    | <right arrow> | Moves the cursor right one character. |

    | <h> | Moves the cursor left one character. |

    | <j> | Moves the cursor down one line. |

    | <k> | Moves the cursor up one line. |

    | <l> | Moves the cursor right one character. |

    | <Ctrl><f> | Moves forward an entire screen. |

    | <Ctrl><b> | Moves backward an entire screen. |

    | <Ctrl><d> | Moves forward half a screen. |

    | <Ctrl><u> | Moves backward half a screen. |


    Note that there are two sets of character/line cursor positioning commands. One
    set uses the dedicated cursor (arrow) keys and the other uses the lowercase alphabet
    keys. These dual commands allow the vi text editor to be used with keyboards that
    do not have the cursor keys or that for some reason the cursor keys are not recognized
    by the vi text editor. Also note that you can enter a number before each of these
    cursor-positioning commands to position the cursor by multiple lines or characters
    at a time. For example, 20j moves the cursor down 20 lines and 10<right arrow>
    moves the cursor 10 characters to the right.


    # Text Deletion'
