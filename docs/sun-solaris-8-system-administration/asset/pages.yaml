    # Techniques you’ 11 need to master:


    +   * Identifying the functionality and features of the Management Console

    * Identifying the functionality and capabilities of AdminSuite

    * Identifying the types of systems supported by the Host Manager

    * Identifying the functionality of two tools of the Storage Manager

    * Identifying the data managed by the Database Manager


    This chapter covers the Solaris Management Console and the Solstice AdminSuite
    objectives by briefly describing the functionality and features of these tools.


    # Solaris Management Console


    The Solaris Management Console is an administrative tool to remotely manage multiple
    domains consisting of Solaris systems. A set of graphical user interface (GUI)
    administrative tools is integrated into a single interface framework. The Solaris
    systems registered with the Management Console are viewed as a tree of icons representing
    hosts and services. These tools include:


    +   * User Manager—User account administration

    * Process Manager—Active process management'
  merge: -1
  pgno: 378
- img_proc: true
  md: '+   - Log Viewer—View content Console log

    - Job Scheduler—View and manage scheduling of tasks

    - Mounts and Shares Manager—View and modify Network File Systems (NFS) mounts
    and shares

    - Disk/Partition Manager—View and modify partition configurations

    - Serial Port Manager—View and modify serial port configuration


    # Other Features


    The Management Console provides a single login capability. By logging in to the
    Management Console, you can access all hosts and services managed by the Console.
    This single login eliminates the need to log in each host separately.


    The new Role-Based Access Control (RBAC) feature can be managed using the Management
    Console, allowing you to delegate specific rights to multiple administrators while
    maintaining centralized control.


    The Management Console enables applications to be executed on remote hosts and
    monitored using local GUIs. It eliminates the need to install the applications
    on the local system.


    # The Solstice AdminSuite


    The graphical management tool AdminSuite is a collection of the following tools:


    +   - Host Manager—Manages own clients, standalone servers, and diskless clients

    - Storage Manager—Manages partitions and file systems

    - Database Manager—Manages network-related data

    - Serial Port Manager—Manages the configuration of serial ports

    - User Manager—Manages user accounts

    - Group Manager—Manages group accounts

    - Printer Manager—Manages printers and print servers


    Many of the functions performed by AdminSuite can also be performed by the admintool
    command. These include serial port management, user and group account management,
    and printer management. For these cases, the AdminSuite GUIs (windows) look very
    similar to the windows provided by the admintool command.


    # Exam Alert


    > The Solstice AdminSuite is not covered in detail in Part II of the exam. However,
    you should be familiar with the capabilities of the seven AdminSuite manager tools
    and the two tools that compose the Storage Manager.'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Host Manager


    The Host Manager provides the ability to add and maintain server and client support.
    You can use it to perform tasks including the following:


    +   - Adding and modifying system support for all types of system configurations
    (AutoClients, diskless clients, operating system [OS] servers, standalone systems),
    including converting system types

    - Setting root passwords for AutoClients or diskless clients


    System support includes providing software services as boot and install services
    for installation and OS services for systems with limited disk space. The Host
    Manager provides the ability to convert a standalone system to an AutoClient to
    a standalone system, and so on. In addition, you use the Host Manager to add OS
    services to an OS server (for example, to add support for another type of operating
    system) or to remove OS services that are no longer needed. Another function of
    the Host Manager is to set up, boot, and profile servers that are used to perform
    over-the-network installation.


    AdminSuite command-line equivalents for the following operations of the Host Manager:


    +   - **adhostadd**—Adds support for a new system or OS server

    - **adhostdel**—Deletes support for an existing system or OS server

    - **adhostmod**—Modifies an existing system

    - **adhostls**—Lists existing hosts


    # Storage Manager


    The Storage Manager consists of two tools: the Disk Manager and the File System
    Manager. The Disk Manager allows viewing and editing of partition-related information.
    You can use it for the following:


    +   - Viewing and modifying x86 and SPARC slice parameters (that is, changing
    the starting and ending addresses of the slices)

    - Specifying a disk label

    - Viewing and modifying x86 fdisk partitions

    - Copying the characteristics of a disk to one or more similar disks


    The File System Manager supports creating and modifying file systems. You can
    use it for the following:'
  merge: -1
  pgno: 380
- img_proc: true
  md: '+   * Creating file systems

    * Creating mount points

    * Mounting and unmounting network file systems

    * Sharing and unsharing Network File System (NFS) resources

    * Modifying the /etc/fstab file on one or more systems

    * Adding entries to existing Auto File System (AutoFS) maps


    The File Manager also provides the ability to select mount and share options,
    such as the NFS-specific mount options.


    AdminSuite does not provide any command-line equivalents for the Storage Manager,
    because you can use standard Solaris commands to perform disk and file system
    tasks.


    # Database Manager


    The Database Manager is used to view and modify network-related system information.
    This information can be stored on a selected host (in /etc files), in Network
    Information Service (NIS), or in Network Information Service Plus (NIS+). You
    can use the Database Manager to view and modify the files, maps, or tables (depending
    on name service) that contain the following types of information:


    +   * System aliases

    * AutoFS map contents

    * Boot parameters

    * Ethernet addresses

    * Groups

    * Host names and IP addresses

    * Local information

    * Network groups

    * Network masks

    * Network names

    * User account information

    * Network protocols

    * RPC configuration

    * Network services

    * Timezone information


    AdminSuite does not provide any command-line equivalents for the Database Manager.
    For the /etc files name service, you can use any text editor to modify the information.
    For NIS and NIS+, use the appropriate procedures to modify the maps and tables
    as necessary.'
