    # The kill Command


    The kill(1) command terminates a process by sending a signal to it that will cause
    it to exit. Many different types of signals. The signals that are typically used
    to terminate a process are listed in Table 7.3, and a complete listing of signals
    can be found in signal(3HEAD).


    # Table 7.3: Signals used to terminate processes.


    | Symbolic Name | Value | Description |

    | --- | --- | --- |

    | SIGHUP | 1 | Hangup |

    | SIGINT | 2 | Interrupt |

    | SIGKILL | 9 | Kill |

    | SIGTERM | 15 | Terminate (default) |'
