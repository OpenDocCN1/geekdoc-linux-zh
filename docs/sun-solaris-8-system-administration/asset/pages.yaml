    -r--r--r-- 1 root other 636 Feb 28 07:39:39 list

    # chown guest junk

    # ls -l

    total 18

    --rw-rw-- 1 root other 120 Feb 28 07:38:33 data

    --rw-rw-- 1 guest other 6528 Feb 28 07:38:33 junk

    ```'
