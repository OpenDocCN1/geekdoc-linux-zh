  md: "The sysdef command displays the system configuration or definition that lists\
    \ all hardware devices, including pseudo and system devices, loadable modules,\
    \ and tunable kernel parameters. Like the prtcconf command, sysdef identifies\
    \ devices using the driver binding name and instance number, which compose the\
    \ instance name. The following listing shows the partial output of the sysdef\
    \ command:\n\n```\n# sysdef\n*\n* Hostid\n*\n* 3093740b\n*\n* i86pc Configuration\n\
    *\n* Devices\n*\n+boot (driver not attached)\n  memory (driver not attached)\n\
    aliases (driver not attached)\nchosen (driver not attached)\ni86pc-memory (driver\
    \ not attached)\ni86pc-mmu (driver not attached)\nopenprom (driver not attached)\n\
    options, instance #0\npackages (driver not attached)\ndelayed-writes (driver not\
    \ attached)\nitu-props (driver not attached)\nisa, instance #0\n```\n\n# Hot-Plugging\
    \ and Dynamic Reconfiguration\n\nTypically, adding, removing, or replacing system\
    \ components as SCSI drives and PCI adapter cards requires that the system be\
    \ shut down, the components changed, and then the system reconfigured during the\
    \ next system boot. Hot-plugging lets you change these types of hardware system\
    \ components without shutting down the system. Dynamic reconfiguration supports\
    \ hot-plugging by allowing the system to recognize the new hardware (or even software)\
    \ configuration.\n\nNot all SCSI and PCI devices are hot-plugging capable. It\
    \ is a feature of the latest generation of system components and associated device\
    \ drivers that support high availability computer configurations. Also keep in\
    \ mind that not all devices that are hot-plugging capable are supported"
  merge: -1
  pgno: 171
- img_proc: true
  md: 'in the Solaris environment. Check the Solaris 8 Sun Platform Guide or the Solaris
    8 (Intel Platform Edition) Hardware Compatibility List for a list of hot-plugging
    devices supported by the Solaris 8 Operating System.


    The **cfgadm**(1M) command provides the dynamic reconfiguration capability in
    the Solaris 8 environment. You can use this command to change system component
    configurations, test system components, and display system component status. The
    **cfgadm** command supports hot-plugging SCSI devices on SPARC and Intel-compatible
    platforms and PCI adapter cards on Intel-compatible platforms.


    The components in the system that support hot-plugging and require dynamic reconfiguration
    are referred to as *attachment points*. An attachment point consists of an *occupant*
    (a device that can be added to or removed from the system) and a *receptacle*
    (a location such as a disk or connector that accepts the occupant). Receptacles
    have three states:


    +   * *Empty*-No occupant.

    * *Disconnected*-The occupant is isolated from the system (typically used for
    testing the occupant or when the occupant is unconfigured).

    * *Connected*-The occupant is configured and accessible by the system (this is
    the normal state).


    Occupants are in the unconfigured state or in the configured state. Configured
    is the normal operational state.


    The overall status condition of the attachment point (receptacle and occupant)
    can be of, failing, failed, unusable, or unknown. The status condition of an attachment
    point is the result of errors that occur during operation or diagnostic tests
    run to isolate faulty components.


    # Hot-Plugging SCSI Controllers and Devices


    The **cfgadm** command displays information about hot-plugging configurations,
    connects and disconnects SCSI controllers, and configures or unconfigures SCSI
    devices.


    Attachment points are represented using *attachment point IDs* (AP_IDs). For example,
    SCSI controllers are represented using IDs such as c0 and c1. A SCSI device such
    as disk /dev/dsk/c1t3d0 that is attached to controller c1 has an AP_id of c1::dsk/c1t3d0,
    whereas a tape drive as /dev/rmt/0 attached to controller c0 has an AP_id of c0::rmt/0.
    Refer to the **cfgadm**(1M) manual page for more information on attachment point
    IDs.


    You can use the `-al` command-line argument to display information about SCSI
    controllers and devices. The following **cfgadm** command displays this information:


    ```

    # cfgadm -al

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: '| AP_Id | Type | Receptacle | Occupant | Condition |

    |---|---|---|---|---|

    | c0 | scsi-bus | connected | configured | unknown |

    | c0::rmt/ | tape | connected | configured | unknown |

    | c1 | scsi-bus | connected | configured | unknown |

    | c1::dsk/clt3d0 | disk | connected | configured | unknown |


    You can connect to a SCSI controller using the cfgadm -c disconnect AP_Id command.
    For example, to disconnect the c1 controller, use the following command:


    +   # cfgadm -c disconnect cl

    #


    Likewise, to connect the c1 controller, use the following command:


    +   # cfgadm -c connect cl

    #


    Adding a SCSI device (such as a disk) requires the cfgadm -x insert_device AP_Id
    command. For example, to add a disk to the c0 controller on a SPARC system, use
    this following command:


    +   # cfgadm -x insert_device c0

    Adding device to SCSI HBA: /devices/sbus@if0/SUN:fas@0,8800000

    This operation will suspend activity on SCSI bus: c0

    Continue (yes/no)?

    SCSI bus quiesced successfully.

    It is now safe to proceed with hotplug operation.

    Enter y if operation is complete or n to abort (yes/no)?

    #


    You can use cfgadm commands to replace (cfgadm -x replace_device AP_Id), remove
    (cfgadm - remove_device AP_Id), configure (cfgadm - configure AP_Id), or unconfigure
    (cfgadm - unconfigure AP_Id) SCSI devices as needed. In addition, diagnostic tests
    can be performed on an attachment point using the cfgadm -t AP_Id command.


    # Hot-Plugging PCI Adapter Cards


    The cfgadm command displays information about hot-plugging configurations, connects,
    disconnects, configures, and unconfigures PCI adapter cards.


    Attachment point IDs (AP_ids) for PCI devices are based on the PCI bus and slot.
    For example, slot 0 of PCI bus 1 has an AP_Id of pci1:hpc0_slot0. Refer to the
    cfgadm(1M) manual page for more information on attachment point IDs.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'The cfggadm (without any command-line arguments) displays information about
    PCI devices. You can use the following cfggadm command to display this information:


    # # cfggadm


    | AP_ID | Type | Receptacle | Occupant | Condition |

    | :--- | :--- | :--- | :--- | :--- |

    | pciil:hpc0_slot0 | unknown | empty | unconfigured | unknown |

    | pciil:hpc0_slot1 | ethernet | connected | configured | ok |

    | pciil:hpc0_slot2 | unknown | empty | unconfigured | unknown |

    | pciil:hpc0_slot3 | unknown | empty | unconfigured | unknown |


    A PCI device can be disconnected (**cfggadm - disconnect AP_ID**), connected (**cfggadm
    - connect AP_ID**), configured (**cfggadm - configure AP_ID**) or unconfigured
    (**cfggadm - unconfigure AP_ID**) as needed. In addition, you can perform diagnostic
    tests on an attachment point using the cfggadm -t AP_ID command.


    # # Partitioning Disks


    The Solaris 8 operating system requires that disks support a logical structure
    in order to use its storage space. The logical structure consists of a small **disk
    label**, also called a **volume table of contents** (VTOC), with the remainder
    of the disk being divided into *slices* or *partitions*. Once a partition is defined,
    a file system can be created within the partition. The physical and logical device
    associated with a file system is actually the name of the partition in which it
    resides.


    # The Disk Label, or VTOC


    The disk label, or VTOC, contains various geometry data about the disk, such as
    sectors per track, tracks per cylinder, available cylinders, and so on. In addition,
    the disk label contains the *partition table*.


    # Partitions


    A partition, or disk slice, is a contiguous collection of disk sectors defined
    by the partition table. Once a partition is defined in the partition table, a
    file system can be created within the partition. The partition table contains
    an entry for each partition on the disk. Table 8.2 describes the fields of the
    partition table.


    Table 8.2: Fields of the partition table.


    | Field | Description |

    | :--- | :--- |

    | Partition Name | A single hexadecimal character used as a name for the partition
    (0 through f). |'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Table 8.2: Fields of the partition table.


    | Field | Description |

    |---|---|

    | Tag | The intended use of the partition (obsolete; see Table 8, 3). |

    | Flags | 1 if the partition is not mountable; 10 if the partition is read-only
    (obsolete). |

    | First Sector | The number of the first sector in the partition. |

    | Sector Count | The number of sectors in the partition. |

    | Last Sector | The number of the last sector assigned to the partition. |

    | Mount Directory | The directory where the partition (actually file system) was
    mounted. |


    When you define partitions, you can assign them a hexadecimal tag that identifies
    the intended use of the partition. These tags can be used during system maintenance
    to quickly identify and select partitions. The tags are stored in the tag field
    of the partition table. Table 8.3 provides a list of partition tags.


    # Table 8.3: Partition tags.


    | Partition Type | Tag Value |

    |---|---|

    | unassigned | 0 |

    | boot | 1 |

    | root | 2 |

    | swap | 3 |

    | usr | 4 |

    | backup | 5 |

    | stand | 6 |

    | var | 7 |

    | home | 8 |

    | altsctr | 9 |

    | cache | a |


    You can create the partition table using either the **format** command or the
    **fmthard**(1M) command. To display it, use the **format** command or the **prtvoc**(1M)
    command.


    Once the partition table has been populated with the appropriate information (the
    disk partitions have been defined), you can create file systems within the partitions;
    however, not all partitions are intended to hold a file system.'
