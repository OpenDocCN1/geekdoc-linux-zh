  md: '# Installing Solaris 8 on a New System Using Web Start


    if you''re installing Solaris 8 on a single new system, the preferred installation
    method is to install from a local CD-ROM drive using Web Start. (Over-the-network
    installation is described briefly later in this chapter and in more detail in
    Chapter 21.) Solaris Web Start can be accessed either a command-line interface
    or a graphical interface.


    The installation is divided logically into three phases:


    +   * Preparation

    * Configuration

    * Software installation


    # Preparation


    The following list summarizes the steps necessary to install Solaris 8 on a SPARC
    or Intel-compatible platform from a local CD-ROM drive:


    +   1. Verify that the hardware is supported. For SPARC system, see the Solaris
    8 Sun Platform Guide. For Intel-compatible system, see the Solaris 8 (Intel Platform
    Edition) Hardware Compatibility List.

    2. If the system is networked (will be attached to a network), decide if Dynamic
    Host Configuration Protocol (DHCP) will be used. If not, determine the host name,
    IP address, and submit subnet information.

    3. Determine the domain name. If a name service is used, determine the server
    host address. The choice of names serves Domain Name System (DNS), Network Information
    Service (NIS), or NIS+.

    4. Determine the disk space required by selecting a software group (End-User,
    Developer, Entire Distribution, or Entire Distribution Plus OEM) and identifying
    additional software and space for home directories.

    5. Determine the language used to install Solaris.

    6. Insert the appropriate Solaris 8 Installation CD-ROM (English or Multilingual)
    into the CD-ROM drive. For Intelcompatibles that cannot boot from the CD-ROM drive,
    insert the Solaris 8 Device Configuration Assistant diskette in the floppy disk.

    7. Boot the system by turning the power on.

    8. For Intel-compatible systems, the Device Configuration Assistant runs to identify
    the hardware configuration.

    9. If you''re using the Multilingual CD-ROM, the Web Start Installer prompts you
    for the language to use during the install. Select the appropriate language.

    10. For SPARC platforms, the Installer prompts you to select Initial Install or
    Upgrade. Select Initial Install.'
