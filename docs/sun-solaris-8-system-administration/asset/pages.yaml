    # Restoring a File System Using the ufsrestore Command


    The ufsrestore command restores a file system backed up using the fsdump command.
    Like the fsdump command, ufsrestore supports an f dump_file argument for identifying
    the media that contains the backup. If this argument is not specified, /dev/rmt0
    device is used by default. The following line uses the ufsrestore command to restore
    a file backup from the /dev/rmt/1 device to the current directory:


    ```

    # ufsrestore f /dev/rmt/1

    ```


    # Restoring Selected Files Using the ufsrestore Command


    You can use the ufsrestore command''s extract (x) command-line argument to restore
    selected files from a backup instead of the entire file system. The files or directories
    to be restored from the backup are also listed as command-line arguments on the
    ufsrestore command. The following line extracts the /etc/passwd file and the /etc/default
    directory (and its contents) from a backup of the root file system on the /dev/rmt/1
    device and restores them to the /etc directory:


    ```

    # ufsrestore xf /dev/rmt/1 /etc/passwd /etc/default

    ```


    # The tar Command


    The tar(1) command creates a tape archive and adds or extracts files from the
    archive. Table 9.8 lists the basic functions of the tar command.


    | Table 9.8: The tar functions |

    | Function | Description |

    |---|---|n| c | Creates (overwrites) a tape archive |

    | r | Replaces the named files in a tape archive |

    | t | Lists the files in a tape archive |

    | u | Updates the named files in a tape |'
