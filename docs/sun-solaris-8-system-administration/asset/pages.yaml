  md: '# # Chapter 9: File System Administration


    # ## Terms you’ 11 need to understand:


    +   - File system

    - Types of file systems

    - Default Solaris 8 file systems

    - mkfs, mkfs_ufs, and newfs** commands

    - fsck command

    - /etc/mntab and /etc/vstab files

    - mount and unmount commands

    - df, du, and quot commands

    - Types of files (regular, directory, and special)

    - Types of links (symbolic and hard)

    - compress, gzip, and zip commands

    - mt command

    - ufsdump and ufsrestore commands

    - tar, cpio, and find commands


    # ## Techniques you’ 11 need to master:


    +   - Creating (making) file systems

    - Checking and repairing file systems

    - Mounting and unmounting file systems

    - Monitoring file system usage

    - Backing up and restoring file systems, directories, and files

    - Recovering the root or / usr system

    - Identifying different types of files and links

    - Compressing files and directories


    The first part of this chapter reviews some basic information about file systems,
    including creating, checking, repairing, monitoring, unmounting, and monitoring
    usage. The second part provides an overview of some file and directory concepts
    and commands that you can use to save storage space. The third portion describes
    the commands used to back up and restore files, directories, and file systems.
    This chapter covers the File Systems, Files and Directories, and Backup and Recovery
    test objectives.'
