    on another file system. Instead of pointing to a location in the file system,
    the directory entry contains the full path name of another file or directory.
    Using symbolic links lets you create multiple pathways and filenames on different
    file systems that all point to the same file or directory.


    You can use the link(1M) and ln(1) command to create hard links. However, the
    In command can be used to create symbolic links using the -s command-line argument.
    unlink(1M) command deletes hard or soft links. When all hard links to a file or
    directory are deleted, the file or directory is removed. You can also use the
    rm(1) and rmdir(1) commands to delete hard or soft links.


    # File and Directory Compression


    Directories and files can be compressed to use less space on disk drives and,
    more importantly, on backup devices such as magnetic tape and optical media. Solaris
    supports three types of utilities to compress and uncompress (that is, expand):


    +   * compress(1) and uncompress(1)

    * gzip(1) and gunzip(1)

    * zip(1) and unzip(1)


    The compress and uncompress Commands


    The compress command uses the adaptive Lempel-Ziv coding algorithm to compress
    one or more files specified as command-line arguments (separated by spaces). Files
    compressed using the compress command are given aZ extension. You can uncompress
    files using the uncompress command, specifying the file names as command-line
    arguments (separated by spaces). Note that the compress command can only be used
    on regular files, and each file is compressed separately. The following listing
    shows the use of these commands:


    ```

    # ls -1

    total 3

    -rw-r--r-- 1 root      other      103306 Apr 6 02:27 file4

    ```


    ```

    # compress file4


    # ls -1

    total 3

    -rw-r--r-- 1 root      other      41280 Apr 6 02:27 file4.Z

    ```


    ```

    # uncompress file4

    ```'
