    # Exam Alert


    The default name for the initial direct map is auto_home.


    # Running the autount Command


    When changes are made to the AutoFS maps, you may need to execute the autount
    command manually. Any changes to the /etc/auto_master file require that the autount
    command be executed to put the changes into effect. The command must also be executed
    when an addition or a deletion is made to a direct map.


    # The Cache File System Service


    The Cache File System (CacheFS) is a client-side service that provides the ability
    to cache a remotely accessed NFS resource on the NFS client. Doing not only speeds
    up access to the data but also decreases network traffic and load on the NFS server.


    After you create a cache, a remote NFS resource can be mounted "in" the cache.
    The first time the NFS resource is accessed, data is copied from the remote NFS
    server into the local cache. Subsequent accesses are cached from the local cache
    instead of the remote NFS server. Other types of file systems, the remote NFS
    resource can be mounted manually using the mount command, at system boot, by adding
    it to the /etc/fstab file, or as needed using the AutoFS mechanism (described
    in the previous section).


    Note


    The root (/) and /usr file systems cannot be cached by the CacheFS mechanism.
    However, these two files can be cached by the AutoClient configuration, which
    is described in Chapter 13.


    # Configuring a Cache


    The fsadmin(1M) command is used to create, check, tune, and delete caches. The
    cachefsstat(1M) command can also be used to display cache statistics.


    You specify the -c command-line argument to create a cache, followed by the full
    pathname of a directory to be used for the cache. In addition, multiple options
    (separated by commas) can be specified using the -o command-line argument. The
    following uses fsadmin command to create a cache under the /cache directory. The
    size of the largest file that can be cached is set to 10MB:


    ```

    # fsadmin -c -o maxfilesize=10 /cache

    ```'
