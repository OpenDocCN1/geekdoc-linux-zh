    The delimiter command-line argument allows the output of the **pgrep** command
    to be used as the input to other commands or shell scripts.


    The other command-line argument is `-l`, which includes the name of the program
    with the PIDs of matched processes. The following listing shows the use of the
    `-l` command-line argument:


    ```

    $ pgrep -l -u dla

