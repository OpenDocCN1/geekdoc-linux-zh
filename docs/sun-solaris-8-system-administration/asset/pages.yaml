    # Special Permissions


    Special permissions can be set on files and devices. These are as follows:


    +   - Set User ID (setuid)—Sets the effective UID to owner on execution

    - Set Group ID (setgid)—Sets the effective GID to group execution

    - Mandatory locking—Prevents reading or writing a file while a program has the
    file open

    - Sticky bit—Allows only the owner to remove files or directories under a specific
    directory


    The setuid and setgid permissions impact security and allow a user account or
    group account to temporarily become another user or group account during the execution
    of a program. You control these permissions using the chmod command like the read,
    write, and execute file permissions.


    The setuid permission has an absolute mode of 4000 and a symbolic mode of s when
    used with the chmod command.


    > Exam Alert The user execution permission must be set in order for setuid to
    be effective. This permission is shown as s in the user account execution permission
    field in the output of an ls command. If setuid is added to a file without execution
    permission, it is an undefined state. This state is shown as S in the user execution
    permission field of an ls command.


    The following list shows the chmod command using absolute mode to add the setuid
    permission to a file and then using symbolic mode to remove the setuid permission
    from the file:


    ```

    # ls -l file

    -rwxr-xr-x 1 dla other 636 Jan 24 12:41 file

    # chmod 4744 file

    # ls -l1 file

    -rwssr--r-- 1 dla other 636 Jan 24 12:41 file

    # chmod u-s file

    # ls -l1 file

    -rw-xr--r-- 1 dla other 636 Jan 24 12:41 file

    #

    ```'
