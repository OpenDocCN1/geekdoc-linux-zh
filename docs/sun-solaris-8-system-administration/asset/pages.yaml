- img_proc: true
  md: 'A patch is a collection of files intended to update or fix problems with installed
    software. For example, a patch might be required to fix a problem with a system
    command or address a security issue. Because most system and application software
    is installed as packages, patches are applied against one or more packages. Actually,
    patches are special packages that are used to update other packages. Like packages,
    a collection of patches can be grouped together into a patch cluster.


    The ability to install patches, keep track of installed patches, and occasionally
    remove patches are key skills of a competent system administrator.


    # # Obtaining Patches and Patch Information


    You can obtain patches from Sun Microsystems in several ways. The two most common
    methods are purchasing a service contract from Sun or downloading the patches
    yourself from Sun''s Web or FTP site.


    Sun Service customers have access to an online patch database and an extended
    set of patches. The patches can be downloaded from Sun''s Web site or FTP site.
    In addition, Sun Service customers receive a CD-ROM of patches every six weeks.


    Everyone can also obtain recommended and security patches for supported systems
    on the Web at sunsolve.sun.com or through anonymous FTP from sunsolve1.sun.com/punches/patches.
    An alternate site to obtain Solaris patches is www.ibilio.org/pub/sun-info/sun-patches.


    +   - Tip

    Sun provides a bimonthly report that summarizes recommended and security patches
    for each supported system. Like patches, the information is available at sunsolve.sun.com
    along other system support information.


    Patches are identified with an eight-digit number. The first six digits identify
    the base patch, and the last two digits identify the revision. For example, patch
    number 110906-01 is the update for the x86 version of Solaris 8 find(1) command.


    # # Installing a Patch


    You install patches using the patchcommand command. The appropriate type of system
    configuration must be specified using a patchcommand command-line argument. You
    may also need to specify a target directory. In addition, you can use a single
    patchcommand command to install more than one patch.


    Regardless of the type of system configuration being patched, the patchcommand
    is typically executed locally on the system where the software is being patched
    resides (the target directory).'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'However, you can install patches over the network if the target directory can
    be accessed through Network File System (NFS) services.


    If the patch is on the CD-ROM, you can install it directly from the CD-ROM. A
    patch downloaded from the Sun Web or FTP site must reside on a system hard disk.
    The area where patches are stored before they are installed is referred to as
    the `spool directory`.


    Tip


    Although patches have no required special directory, the most commonly used location
    is `/var/spool/patch directory`. You can use any location on the system that has
    adequate free space.


    If a patch was downloaded down, chances are good that it is `zipped` (compressed)
    to make it easier and quicker to download. Some patches (namely for SPARC platforms)
    are compressed using the `gzip(1)` command and have file names that end with `.gz`
    suffix. Others are compressed using the `zip(1)` command and have file names that
    end with `.zip` suffix. The `zip` command is used for both SPARC and Intel x86
    platforms. To uncompress the x86 find patch (110906-01), which is located in the
    current directory, use `unzip(1)` command as shown in the following listing:


    ```

    # unzip 110906-01.zip

    Archive: 110906-01.zip

    creating: 110906-01/

    inflating: 110906-01/.Dispatch

    creating: 110906-01/SUNWcu/

    inflating: 110906-01/SUNWcu/pkgmap

    inflating: 110906-01/SUNWcu/pkginfo

    creating: 110906-01/SUNWcu/install/

    inflating: 110906-01/SUNWcu/install/checkinstall

    inflating: 110906-01/SUNWcu/install/checkinstall

    inflating: 110906-01/SUNWcu/install/copyright

    inflating: 110906-01/SUNWcu/install/i.none

    inflating: 110906-01/SUNWcu/install/patch_checkinstall

    inflating: 110906-01/SUNWcu/install/patch_postinstall

    inflating: 110906-01/SUNWcu/install/postinstall

    inflating: 110906-01/SUNWcu/install/preinstall

    creating: 110906-01/SUNWcu/reloc/

    creating: 110906-01/SUNWcu/usr/

    inflating: 110906-01/SUNWcu/usr/bin/find

    inflating: 110906-01/SUNWcu/usr/bin/find

    inflating: 110906-01/README. 110906-01

    #

    ```


    A subdirectory with the same name as the patch will be created under the current
    directory, and the unzipped files will be placed in this subdirectory.'
