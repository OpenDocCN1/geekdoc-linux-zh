  md: '# Chapter 17: Role-Based Access Control (RBAC)


    Terms you’ 11 need to understand:


    +   - Roles

    - Profiles

    - Authorizations

    - Privileged operations


    # Techniques you’ 11 need to master:


    +   - Creating and assigning roles

    - Displaying RBAC assignments


    This chapter covers the *Role-Based Access Control* test objectives. The first
    section describes the purpose of role-based access. The second section provides
    details on the configuration files used to implement role-based access control.
    The last section summarizes the commands that you can use to manage the RBAC.


    # Purpose of Role-Based Access Control


    In the Solaris, system administration has been performed by the root superuser
    account or a user account granted superuser privileges. Even if a user account
    needed to access a few privileged operations or commands to perform a task, the
    account was granted complete control over the system. This all-or-nothing approach
    to system administration has been a security issue. A new feature in Solaris 8,
    Role-Based Access Control (RBAC), addresses this issue.


    The RBAC system supports the concept of a special type of user account a *role*.
    Roles are granted a set of superuser privileges to select administrative tasks,
    such as printer management. Even though roles are a type of user account, they
    can only be accessed using the **su**(1) command. That is, a role cannot be used
    as a regular user account accessed directly with a normal login procedure as **login**(1)
    or **telnet**(1). You grant superuser privileges to roles (and regular user accounts)
    by assigning them profiles and/or authorizations.


    *Profiles* are sets of authorizations and privileged operations. You can think
    of a profile as a grouping mechanism used to simplify assignments of related superuser
    privileges. For example,'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'the Device Management profile includes all the necessary authorizations to
    manage system devices.


    **Authorizations** are rights to perform restricted functions, such as shutting
    down the system. An authorization may not correspond to a single Solaris command.
    For example, several commands can be used to shut down the system. If a user account
    has been assigned the authorization solaris.system.shutdown then the user account
    can use any of the appropriate commands to perform the shutdown. The set of authorizations
    associated with the Solaris system have been defined by Sun Microsystems and cannot
    be modified.


    On the other hand, *privileged operations* are Solaris commands that are executed
    with the UID and/or GID set to the appropriate value(s) to allow proper operation.


    In summary, authorizations and privileged operations can be assigned to regular
    user accounts and roles to allow controlled delegation of superuser privileges.
    Profiles can be used to assign sets of authorizations and privileged operations.


    # The RBAC Database


    The RBAC database consists of four attribute databases or files. Collectively,
    these files define the attributes of the RBAC (roles, profiles, authorizations,
    and privileged operations). The RBAC database also provides a mechanism to associate
    profiles, authorizations, and privileged operations to regular user accounts and
    roles.


    The four RBAC database files are:


    +   * *User Attributes Database (user_attr)*—Defines roles and assigns authorizations
    to roles and regular user accounts. Also referred to as the Extended User Attributes
    Database.

    * *Profile Attributes Database (prof_attr)*—Defines profiles.

    * *Authorization Attributes Database (auth_attr)*—Defines the authorizations.

    * *Execution Attributes Database (exec_attr)*—Defines privileged operations. Also
    referred to as the Profile Execution Attributes Database.


    Exam Alert


    > The User Attributes Database (user_attr) is located under the /etc directory.
    The other three databases are under the /etc/security directory.


    Figure 17.1 shows the relationships between the four database files. The User
    Attributes Database assigns profiles to user accounts and roles by referencing
    entries in the Profile Attributes Database. Likewise, the User Attributes Database
    assigns authorizations to user accounts and roles by referencing entries in the
    Authorization Attributes Database.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '![](img/3fac31c61ee62a0f0781138d75883f36_325_0.png)


    Figure 17.1: Relationships among the RBAC database files.


    The Profile Attributes Database assigns authorizations to profiles by referencing
    entries in the Authorization Attributes Database. The privileged operations defined
    in the Execution Attributes Database are associated with a profile by including
    the name of the profile in the Execution Attributes Database.


    # # The User Attributes Database (user_attr)


    The /etc/user_attr file is the key database of the RBAC. It assigns profiles and/or
    authorizations to user accounts. It also defines rules (one or more authorizations
    and/ profiles). Table 17.1 lists the colon-delimited fields of the user_attr file.


    Table 17.1: Fields of the User Attributes Database.


    | Field | Use |

    | --- | --- |

    | Name | Name of a user account (defined in the /etc/passwd file) or a role. |

    | Qualifier | Reserved for future use (empty field). |

    | Res1 | Reserved for future use (empty field). |

    | Res2 | Reserved for future use (empty field). |

    | Attributes | List of key=value pairs separated by semicolons that determines
    the attributes assigned to the user account or role. Valid keys are **auths**
    (one or more authorization names, separated by commas), **profiles** (one or more
    profile names, separated by commas), **roles** (one or more roles, separated by
    commas), and **type** (to **normal** if the **name** field is a regular user account
    or **role** if **name** is a role).


    The following listing shows several sample | entries from the /etc/user_attr file
    (wrapped lines are indented to improve readability):


    prt_adm:::type=role;profiles=Printer Management;'
