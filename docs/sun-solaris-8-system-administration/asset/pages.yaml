    # ### The rpc Command


    You can use the rcp(1) command to copy a specified file from the local system
    to the remote system. The destination is specified as host:path where host is
    the name of the remote system and path is the full path to either a directory
    or file. If a different user account is being used on the remote system, then
    it is specified before the host separated by a @ symbol. The rpc command uses
    the remote authentication database.


    The following listings show the dia account on the local system attempting to
    copy a file to the home directories of two different user accounts on the remote
    system because the remote authentication database on the remote system does not
    allow the local dia user access to the remote sarah user account:


    ```

    $ rcp /tmp/file.txt solaris8:export/home/dia/file.txt

    $ rcp /tmp/file.txt sarah@solaris8:export/home/sarah/file.txt

    $

    ```


    # ### Remote Shell Execution


    The rsh(1) command can be used to execute a command on a remote system. The remsh
    command is a symbolic link to the rsh command.'
