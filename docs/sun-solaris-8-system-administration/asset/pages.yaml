  md: '# Chapter 19: Name Services


    # Terms you’ 11 need to understand:


    +   - Name services

    - The /etc files configuration

    - Domain Name System (DNS)

    - Network Information Service (NIS)

    - Network Information Service Plus (NIS+)

    - Lightweight Directory Access Protocol (LDAP)

    - Authentication and authorization

    - The name service switch


    # Techniques you’ 11 need to master:


    +   - Configuring the name service switch

    - Configuring NIS master and slave servers

    - Configuring NIS clients

    - Updating and adding NIS maps


    This chapter describes the name services supported by the Solaris 8 operating
    system. The first part provides an overview. The second part covers the Network
    Information Service (NIS) in more detail. The third part summarizes the Network
    Information Service Plus (NIS+). This chapter covers the Name Services and NIS
    test objectives.


    # Solaris Name Services


    A name service or naming service provides a centralized location for information
    used by users and systems to communicate with each other across the network. The
    name service not only stores the information but also provides mechanisms to manage
    and access that information.


    The information is referred to as a namespace and typically includes the following:


    +   - Hostnames and their IP addresses

    - User accounts and their passwords

    - Access permissions'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'Without a centralized name service, each system would have to maintain its
    own copy of the information. For example, by default the Solaris system uses the
    /etc/hosts file to resolve hostnames to IP addresses. This approach is fine for
    a small number of systems, but for a large number of systems it becomes a maintenance
    nightmare. A centralized name service eliminates redundancy, improves consistency,
    and reduces administration.


    # Supported Name Services


    The Solaris 8 operating system supports five naming services:


    +   * The Original Unix name configuration, referred to as the /etc files

    * The Domain Name Service (DNS)

    * The Network Information Service (NIS)

    * The Network Information Plus (NIS+)

    * The Federated N Service (FNS), which conforms to the X/Open Federated Naming
    Specification (XFN)


    The /etc files, NIS, and NIS+ are considered enterprise-level naming services.
    That, they work adequately within an intranet environment, but are not scalable
    to the global level (Internet environment). To address this issue, FNS can be
    used to federate or link NIS or NIS+ with a global-level naming service as X.500
    via the Lightweight Directory Access Protocol (LDAP) or DNS. By linking these
    naming services, the information managed by the enterprise-level service is accessible
    globally.


    Currently, Sun Microsystems does not fully embrace X.500/LDAP as a naming service
    or provide an LDAP server as part of the Solaris 8 distribution. However, it provide
    an LDAP client and an LDAP data caching mechanism.


    > Of these naming services, NIS and NIS+ are covered in the most detail on the
    exam. The /etc files and DNS are covered briefly. FNS will probably not be mentioned,
    but be sure to understand the significance of enterprise-level (NIS and NIS+)
    versus global-level (DNS and LDAP) naming services.


    Exam Alert


    # Domain Name System


    DNS is part of TCP/IP protocol suite and is the name service used by the Internet.
    It provides hostname-to-IP-address resolution as well as IP-address-to-hostname
    resolution. The DNS namespace is divided into domains that in turn are divided
    into subdomains (or zones). One or more DNS servers can be responsible (authoritative)
    for a zone. All the DNS servers work to provide name resolution services across
    the entire namespace.'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'The DNS server provided with Solaris is version 8.1.2 of the Berkeley Internet
    Name Domain (BIND) program that is referred to as the Internet name daemon (in.named).


    Information on the namespace is stored in text files using a predefined syntax
    known as records. The in.named program uses the following data files:


    +   - /etc/named.conf—The BIND configuration file that identifies zones over which
    the DNS server is authoritative and the associated data files

    - /etc/resolv.conf—When configured as a DNS client, a file that identifies the
    DNS server that should be used for name resolution

    - named.ca—The names and IP addresses of the Internet root DNS servers

    - hosts—The DNS address (A type) records used for resolving hostnames to IP addresses
    (not to be confused with /etc/hosts file)

    - hosts.rev—The DNS pointer (PTR type) records used for resolving IP addresses
    to hostnames

    - named.local—The records for the localhost or the loopback interface


    The named.ca, hosts, hosts.rev, and named.local files are typically located in
    the /var/named directory can be in any directory specified by the /etc/named.conf
    file.


    # Network Information Service (NIS)


    NIS is a distributed service. It is a mechanism for identifying and locating network
    objects and resources. It provides a uniform storage and retrieval method for
    networkinformation in a platform-independent manner. The data files (called maps)
    can be distributed among NIS servers to improve availability but can still be
    managed and updated from a central location. The second part of this chapter provides
    additional details regarding NIS.


    # Network Information Service Plus (NIS+)


    NIS+ is very similar to NIS but includes many more features. Unlike NIS, the NIS+
    namespace is dynamic because updates can take effect at any time by any authorized
    user.


    The NIS+ namespace is hierarchical and is similar to a Unix file system. This
    structure allows the namespace to conform to the hierarchy of an organization
    and can be divided into multiple domains that can be administered separately.


    Whereas NIS lacks security, NIS+ includes a system that uses both authentication
    and authorization to maintain the integrity of its namespace. Authentication is
    a method to restrict access to specific users when accessing a remote system.
    Authentication can be set up at the system level and the network level. Credentials
    are used to verify the identity of a user. For NIS+, every request for access
    is authenticated by checking the credentials of the user.'
  merge: -1
  pgno: 362
- img_proc: true
  md: "Authorization is a method to restrict the operations that a user can perform\
    \ on the remote system once the user has gained access (been authenticated). For\
    \ NIS+, every component in the namespace specifies the type of operations that\
    \ it will accept from each user.\n\n# # The Name Service Switch\n\nBecause Solaris\
    \ B supports five different naming services, we need a method to select which\
    \ name services should be used and in which order. This capability is provided\
    \ by the /etc/nsswitch.conf file and templates that can be used to simplify the\
    \ setup of the /etc/nsswitch.conf file.\n\nApplications use standardized routines\
    \ to obtain name resolution and other system and network information. These routines\
    \ consult the /etc/nsswitch.conf file to determine which name service(s) should\
    \ be queried.\n\nThe /etc/nsswitch.conf file contains entries for each type of\
    \ data supported by the name services. An entry consists of a keyword that identifies\
    \ the type of information, followed by one or more information sources. The source\
    \ keys are separated from the information keyword and other source keys by one\
    \ or more space characters. Table 19.1 lists the 17 types of information keywords.\
    \ In addition to the five name services supported by Solaris, three additional\
    \ resolution methods are supported via the information source field of name service\
    \ switch: *compat*, which is used for passwords and group information; *ldap*\
    \ for using an external LDAP service; and *users*, which are used for printers.\
    \ Table 19.2 lists the 8 information source keywords.\n\n> Table 19.1: The /etc/nsswitch.conf\
    \ information keywords.\n\n| Information Keyword | Description |\n| aliases |\
    \ Mail aliases |\n| automount | Information on the Auto File System (AutoFS) configuration\
    \ |\n| bootparams | Location of root, swap, and dump partitions for diskless workstations\
    \ |\n| ethers | Ethernet addresses of systems |\n| group | Group name and member\
    \ information |\n| hosts | Hostnames and network (IP version 4) addresses |\n\
    | ipnodes | Hostnames and network (IP version 6) addresses |\n| netgroup | Network\
    \ groups and members defined in the domain |\n netmasks | Netmasks associated\
    \ with known networks |\n| networks | Networks and their associated names |"
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Table 19.1: The /etc/nsswitch.conf information keywords.


    | Information Keyword | Description |

    |---|---|

    | passwd | Password information for user accounts |

    | printers | Printer alias database |

    | protocols | IP protocols used within the domain |

    | publickey | Public keys used for authentication |

    | rpc | Remote Procedure Call (RPC) program numbers for RPC services used within
    the domain |

    | sendmailvars | Variables used by the sendmail (IM) program |

    | services | Names of IP services and their port numbers |


    # Table 19.2: The /etc/nsswitch.conf source keywords.


    | Source Keyword | Description |

    |---|---|

    | compat | Uses old-style syntax for password and group information |

    | dns | Uses DNS to resolve queries |

    | files | Uses /etc/ files to resolve queries |

    | ldap | Uses LDAP to resolve queries |

    | nis | Uses NIS to resolve queries |

    | nisplus | Uses NIS+ to resolve queries |

    | users | Valid only for printers |

    | xfn | Valid only for printers |


    When these service names (DNS, files, LDAP, and NIS or NIS+) are queried or searched,
    they will return one of four status messages:


    +   * SUCCESS—The requested information was located.

    * UNAVAIL—The service is not responding.

    * NOTFOUND—The requested data does not exist.

    * TRYAGAIN—The service is busy; try again later.


    For each of these four status messages, an action can be associated with each
    source. The action is either return (stop looking) or continue (the next source).
    For example, the following list shows a entry in the /etc/nsswitch.conf file:


    ```

    hosts: nisplus dns files

    ```'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'The default action for a SUCCESS status message is to return the information.
    The default action for the other status messages (NOTFOUND, TRYAGAIN, and UNAVAIL)
    is to continue to the next source if one exists or to return if one does not exist.


    When an application attempts to resolve a hostname to an IP address, first NIS+
    is searched. If the information is found, it is returned to the application. If
    it is not found, DNS is searched. If the information is found, it is returned
    to the application. If it is not found, the /etc hosts configuration (/etc/hosts
    file) is searched. If the information is found, it is returned to the application;
    otherwise, an error is returned.


    # Exam Alert


    > Note that the name service order proceeds from left to right. That is, the search
    will start with the leftmost service and, if necessary, continue until the rightmost
    service is queried.


    Five templates are included with the Solaris 8 distribution to simplify setting
    up the /etc/nswitch.conf file. These templates provide a standardized setup for
    the most commonly used services in the Solaris 8 environment. They are:


    +   - DNS (/etc/nswitch.dns)

    - LDAP (/etc/nswitch.ldap)

    - NIS (/etc/nswitch.nis)

    - NIS+ (/etc/nswitch.nisplus)

    - Original Unix /etc files configuration (/etc/nswitch.conf)


    During system installation, the contents of these files are copied to the /etc/nswitch.conf
