    # Accessing Data on CD-ROMs and Diskettes


    Properly formatted diskettes and CD-ROMs can be mounted using the **mount** command
    and

    accessed like any other file system. The **umount** command is also used to unmount
    a diskette or

    CD-ROM. However, in the Solaris environment, mounting these types of media has
    been made

    easier by use of Volume Management. Volume Management provides automatic mounting
    of

    removable volumes (diskettes and CD-ROMs). This service is provided by the Volume

    Management daemon, **veld(1)**. By default, **void** is enabled.


    # Using CD-ROMs


    When a CD-ROM is inserted into a CD-ROM drive, the **veld** program recognizes
    a properly

    formatted CD-ROM and automatically mounts it under the /cdrom directory. The first
    CD-ROM is

    mount at /cdrom/cdrom0, the second at /cdrom/cdrom1, and so on. If the CD-ROM
    is partitioned

    (which it probably is), each slice or partition is mounted. For example, if the
    CD-ROM volume

    contains six slices (s0 through s5), then each is mounted (/cdrom/cdrom0/s0 through

    /cdrom/cdrom0/s5). Once mounted, the partitions can be used like any other read-only
    disk.


    When the CD-ROM is no longer needed, all the partitions associated with it can
    be automatically

    unmounted and the CD-ROM ejected from the CD-ROM drive using the **eject cdrom**
    command. If

    more than one CD-ROM is mounted, you specify the mount point: for example, **eject
    cdrom0**. See

    the **eject(1)** manual page for more details.


    # Using Diskettes


    Unlike CD-ROMs, diskettes are not automatically mounted by the **veld** program.
    Instead, you can

    use the **checkout(1)** command to install **veld** to scan all floppy disk drives
    and mount any

    diskettes found. The diskettes are mounted under the /floppy directory. The first
    diskette is

    mount /floppy/floppy0, the second at /floppy/floppy1, and so on. Once mounted,
    the diskette

    can be used like any (small) read write disk drive.


    When the diskette is longer needed, it can be unmounted using the **eject** command
    without any

    command-line arguments. Or, if more than one is mounted, you provide the name
    of the

    mount point as a command-line argument: for example, **eject floppy0**.


    # Monitoring File System Usage'
