    e. -rswrwrxwt


    Answer b is correct. The file access mode of -rswrwrxwx shows the file has setuid
    enabled. swrxrxrwx and -rxrxrws are not valid file access modes. Therefore, answers
    a and d are incorrect. -rswrwrxwx shows setgid, -rswrwrxwt the sticky bit set.
    Therefore, answers c and e are incorrect.


    # Question 9


    The file currently has the access mode 644. Which of the following will add write
    access for the group owner? [Select all that apply]


    +   a. chmod test 664

    b. chmod test 664

    c. chmod test g+w

    d. chmod g+w test

    e. setfacl -s u::rw-,g::rw-,o::-- test


    Answers b, d, and e are correct. Each of these command will add write access for
    the group owner. Even though the setfacl -s replaces the existing ACLs, the original
    access access mode is reinstated with the added group write access. Using setfacl
    -m would also have worked, but was not specified as an answer. The commands chmod
    test 664 and chmod test g+w do not follow the correct syntax. Therefore, answers
    a and c are incorrect.


    # Question 10


    Match each of the following ls command-line arguments with its function.


    +   a. -R 1. Displays directory names instead of directory contents

    b. -l 2. Identifies file types using /, *, and other characters

    c. -a 3. Recursively lists the contents of subdirectories

    d. -F 4. Lists file permissions, owner, group, size, and so on

    c. -d 5. Lists directory/file names that begin with a dot (


    Answers a-3, b-4, c-5, d-2, and e-1 are correct. -R recursively lists directory
    contents; -l lists permissions, owner, and so on; -a lists names beginning with
    a dot;

    -F identifies file types; and -d lists directory names.'
