    # Run Control (rc) Scripts


    As previously stated, every run level (except 4) has an entry in the /etc/initab
    that identifies an rc program to execute. In addition, each run level has a directory
    associated with it.


    The directory contains rc scripts that should be executed by the rc program to
    start or stop processes and services when the run level becomes the current run
    level. These rc programs script directories use a standard naming convention based
    on the run level.


    For run level 0, the rc program is /etc/rc0, and /etc/rc0.d is the rc script directory.
    Likewise, for run level 1, the rc program is /etc/rc1, and /etc/rc1.d is the rc
    script directory. The naming convention is applied for run levels 2, 3, and s.
    Run levels 5 and 6 do not have separate rc directories but use the run rc directory.


    Typically, both the rc program and the scripts under the rc script directories
    are referred to as rc scripts. Referring to the script called directly from the
    /etc/initab as the rc program helps avoid confusion.


    The rc scripts are shell scripts (typically Bourne) written to start and stop
    various processes and services. An rc script is usually written in two portions:
    a start portion and a stop portion. As the names imply, the start portion is to
    execute a service, whereas the stop portion is called to stop a service. Thus,
    a single script can control the service. When the rc program calls the rc script,
    the program provides either a start or a stop command-line argument to the rc
    script, depending on whether the service should be started or stopped at a particular
    run level. The decision to start or stop a particular service is based on the
    name of the rc script in the appropriate directory.'
