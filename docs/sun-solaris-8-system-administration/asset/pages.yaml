    # # File and Directory Concepts


    Data stored on file systems contains directories and files. Directories serve
    as folders to arrange the files into some organized, user-defined structure. In
    reality, all the files and directories are stored or less randomly on the disk.
    The files and (other) directories are then referenced or linked to directories
    to provide the organization. In addition, several types of special files are used.


    Sometimes files and directories are not needed frequently or use more space than
    desired. To address this issue, Solaris 8 provides several utilities to compress
    files and directories so they take less space; they can be uncompressed as needed.


    This portion of the chapter provides an overview of these file/directory concepts
    and file/directory compression.


    # # Types of Files


    The allocated space on file systems is in the form of either directories or files.
    Only one type of directory exists. However, there are several types of files.
    The files used to store data or executables are referred to as regular or ordinary
    files. Other files are used for special purposes. Table 9.5 lists all supported
    types. You can identify a file''s type by a single character ID produced by the
    ls -l command.


    | Table 9.5: File types |

    | Type | ls -l ID | Description |

    | --- | --- | --- |

    | Regular | | An ordinary or regular file. Used for data and executables. |

    | Directory | d | A directory. Used to organize files and other directories. |


    197'
