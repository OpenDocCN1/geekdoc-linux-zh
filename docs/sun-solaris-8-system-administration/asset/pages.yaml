    # Question 2


    Which of the following commands can be used to list all installed patches? [Select
    all that apply]


    +   a. showrev -p

    b. patchinfo

    c. patchlist

    d. patchadd -p


    Answers a and d are correct. Answers b and c do not exist.


    For this type of question, one or more answers must be selected to answer the
    question correctly. For Question 2, you would have to position the cursor over
    the checkboxes next to items a and d and click on both to obtain a correct answer.


    These types of questions can appear in many forms and constitute the foundation
    on which most of the Solaris certification exam questions rest. More complex questions
    might include so-called exhibits, which are usually tables or data-content layouts
    of one or another. You''ll be expected to use the information displayed in the
    guide to answer the question.


    Other questions involving exhibits may use charts or diagrams to help document
    a workplace scenario that you''ll be asked to troubleshoot or configure. Paying
    careful attention to such exhibits is the key to success—be prepared to toggle
    the picture and the question as you work. Often, both are complex enough that
    you might not be to remember all of either.


    The drag-and-drop questions are new to the Solaris exams. They provide a table
    consisting of two columns of data, such as technical terms and their definitions.
    All of the terms have to be positioned (using the mouse) in front of their respective
    definition to be correct. To drag a term, position the mouse over the term and
    depress the mouse button. Then move the mouse to'
  merge: -1
