    You can also log use of the su command using the system logging (syslog) facility.
    To enable it, add the following entry to the /etc/default/su file:

    nSYSLOG=YES


    The syslog facility must be properly configured to capture and log these messages.
    The syslog facility is an objective for Part II (Exam 310-012) and is covered
    in Chapter 14.


    By default, use of the su command is logged to the syslog facility. To disable
    this, edit the /etc/default/su file and add the shell character (#) at the beginning
    of the SYSLOG entry.


    # The sysadmin Group


    A user account that is a member of the sysadmin group (numerical group 14) can
    perform selected system administration activities using **admintool** (IM) without
    being granted full superuser privileges. As a result, more than one person can
    perform basic system administration (and deleting users, printers, software, and
    so on) without compromising system security. To enable this ability, configure
    the setuid bit to root permission for **admintool** and specify membership in
    the sysadmin group as a requirement for using **admintool**. Additional information
    about groups and the setuid permission is provided later in this chapter.'
