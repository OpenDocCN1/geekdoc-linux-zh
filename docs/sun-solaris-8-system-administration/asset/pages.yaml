    # Password Aging


    The parameters of the /etc/shadow file, which you set through the Account Security
    fields of the admintool command''s Add or Modify User Account window, determine
    the password aging policy. These parameters include how long a password is valid
    (Max Change), how often it can be changed (Min Change), and how long an account
    can be inactive before the password must be changed (Max Inactive). They enforce
    a policy for protecting the integrity of passwords.


    Note that of these three password-aging parameters, only Max Inactive can be specified
    using the useradd and usermod command.


    # Password Requirements


    Unless specified by a superuser account as root, passwords must meet the following
    requirements:


    +   * A password must contain at least the number of characters specified by the
    PASSLENGTH parameter contained in the /etc/default/passwd file. The default is
    six.

    * A password must contain at least two alphabetic characters and at least one
    numeric character (within the first PASSLENGTH characters).

    * A password cannot be the same as the user account name, the reverse of the user
    account name, or a circular shift of the user account name. Any uppercase letters
    are mapped to lowercase letters for requirement checking. As a result, the password
    for the guest account cannot be guest, tuesg, westg, estug, guest, and so on.

    * A new password must differ by at least three characters from the old password.
    Once again, uppercase and lowercase letters are equivalent for requirement checking.


    # Exam Alert


    Passwords can be any length, but only the first eight characters are significant.
    For example, if a password is defined as 25administration, the characters 25admin
    can be used to log into the system.


    Keep in mind that these requirements do not apply when root or some other superuser
    account defines its own password or the password of another user account.


    # Changing Passwords Using the admintool Command


    To change the password of a user account, start the admintool command if it is
    not already active. Display the Users window by selecting Users from the Browse
    pull-down menu.'
