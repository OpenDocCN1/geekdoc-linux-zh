    # # Taking Testing Seriously


    The most important advice I can give you about taking any test is this: Read each
    question carefully. Some questions are deliberately ambiguous, some use double
    negatives, and others use terminology in incredibly precise ways. I''ve taken
    numerous practice tests and real tests myself, and in nearly every test I''ve
    missed at least one question because I didn''t read it carefully or enough.


    Here are some suggestions on how to deal with the jump to an answer so quickly:


    +   - Make sure you read every word in the test. If you find yourself jumping
    ahead impatiently, go back and start over.

    - As you read, try to restate the question in your own terms. If you can do this,
    you should be able to pick the correct answer(s) much easily.

    - When returning to a question after your initial read-through, read every word
    again—otherwise, your mind can fall quickly into a rut. Sometimes, seeing a question
    afresh after turning your attention elsewhere lets you see something you might,
    but the stress tendency is to see what you''ve seen before. Try to avoid that
    tendency at all costs.

    - If you return to a question more than twice, try to articulate to yourself what
    you don''t understand the question, why the answers don''t appear to make sense,
    or what appears to be missing. If you chew on the subject for a while, your subconscious
    might provide the details that are lacking or you notice a “trick” that will point
    to the right answer.


    Above all, try to deal with each question by thinking through what you know about
    a Solaris system administrator—commands, characteristics, behaviors, facts, and
    figures involved. By reviewing what you know (and what you''ve written down on
    your information sheet), you''ll often recall or understand things sufficiently
    to determine the answer to the question.


