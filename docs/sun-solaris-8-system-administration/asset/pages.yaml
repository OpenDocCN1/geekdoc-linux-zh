  md: '# Role Management


    The **roleadd, rolemod, and roledel** commands are used to manage the RBAC roles.


    # Creating a Role Using the roleadd Command


    The **roleadd(1M)** command provides a quick method to add a new role. At a minimum,
    the name of the role must be specified as a command-line argument. Table 17.8
    lists the command-line arguments supported by the **roleadd**.


    Table 17.8: Command-line arguments for the roleadd.


    | Argument | Description |

    | --- | --- |

    | *role* | Specifies the name of the new role (required). |

    | *-A authorizations* | Specifies one or more authorizations (separated by commas).
    |

    | *-b base* | Defines a base directory. If a home directory (**-d** ) is not specified,
    the role name is added to **base** and used as the home directory. |

    | *-c comment* | Specifies a comment that is placed in the comment (**gcos**)
    field of the /etc/passwd file. |

    | *-d directory* | Defines the home directory of the role. |

    | *-e date* | Specifies an expiration date for the role. After the specified date,
    the role is disabled. |

    | *-f days* | Specifies the maximum number of days the role can be inactive before
    it is disabled. |

    | *-g group* | Defines the GID or name of an existing group that will be the primary
    group for the role. |

    | *-G group* | Defines the GID or name of an existing group that will be a secondary
    group for the role. |

    | *-k template_dir* | Specifies the directory that contains a template (default)
    .profile used for the user profile. |

    | *-m* | Creates the home directory if it doesn'' exist. The home directory is
    defined by **-b** and the role name or **-d**. |

    | *-o* | Allows an existing UID to be specified. That is, allows a role to be
    created with a duplicate UID (see **-u**). |'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Table 17.8: Command-line arguments for the roleadd command.


    | Argument | Description |

    | --- | --- |

    | -p profiles | Specifies one or more execution profiles (separated by commas).
    |

    | -s shell | Specifies the login shell; the default is the Bourne shell (/bin/sh).
    |

    | -u uid | Specifies the UID of the role. It must be a decimal integer. If not
    specified, the next highest available UID is assigned. |


    Exam Alert


    The roleadd supports command-line arguments that are identical to those of the
    useradd, except roleadd does not support the -R command-line argument because
    a role cannot contain other roles.


    The following example creates a role using the roleadd command:


    ```

    # roleadd -A solaris.system -d P“Printer Management” prt_admin

    #

    ```


    This command creates the prt_adm role. It assigns the solaris.system authorization
    and the Printer Management profile to the role.


    To make a little easier, the roleadd command also supports the -D command-line
    argument, which allows default values to be assigned to authorizations (-A), base
    directory (-b), group (-g), expiration date (-e), maximum inactivity (-f), and
    execution profile (-P). Subsequent uses of the roleadd command will use these
    default values if they are not specified.


    Exam Alert


    +   - Roles created with the roleadd command do not have a password. These roles
    are locked and cannot be used until a password is defined for the role using the
    password(1) command.


    # Modifying a Role Using themod Command


    The rolemod(1M) modifies an existing role. The command-line arguments are identical
    to those of the roleadd command, with the following exceptions:


    +   - The base directory (-b) is not available. Use -d to specify a new directory.
    Don''t forget to include -m if the home directory doesn''t exist.

    - Set defaults (-D) is not available.

    - The template directory (-k) is not available.

    - A new role name is specified using -l if the role name is being modified.'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'Keep in mind that if the role is changed, the name of the home directory does
    not change unless the -d and -m command-line arguments are used.


    # Deleting a Role Using the rodeled Command


    The rodeled(1M) command deletes a role. Not only is the role definition deleted
    from the user_attr file, all role assignments in other user_attr entries are modified.
    The role is specified as a command-line argument. Only one other command-line
    argument is supported: -r removes the home directory associated with the role.


    # Practice Questions


    # Question 1


    Which of the following RBAC data files is not under /etc/security?


    +   a. auth_attr

    b. exec_attr

    c. prof_attr

    d. user_attr


    # Question 2


    Which of the following cannot be assigned to a role?


    +   a. A profile

    b. An authorization

    c. Another role

    d. More than one profile


    Answer c is correct. A role cannot be assigned to another role. One or more authorizations
    and/or one or more profiles can be assigned to roles. Therefore, answers a, b,
    and d are incorrect.


    # Question 3'
