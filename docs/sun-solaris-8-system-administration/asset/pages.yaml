    # The find Command


    You can use the find(1) command to generate a list of files (that is, their names)
    under a particular directory or a list of file names that met specified criteria.
    The find command is especially useful when combined with the cpio command.


    At a minimum, one command-line argument is required: the name of the directory.
    By default, the directory and all files under it are also listed. The find command
    provides a variety of command-line arguments. Table 9.10 lists some of the most
    useful ones.


    Table 9.10: Selected find-command arguments.


    | Argument | Description |

    | -atime n | List only files accessed -n (less than n days ago) or +n (more than
    n days ago). |

    | -ctime n | List only files whose status changed -n (less than n days ago) or
    +n (more than n days ago). |

    | -exec cmd | Execute cmd for each listed file. |

    | -group grp | List only files that belong to the group name of GID grp. |

    | -mtime n | List only files modified -n (less than n days ago) or +n (more than
    n days ago). |

    | -name pattern | List only files whose name matches pattern. |

    | -newer file | List only files that are newer than file. |

    | -print | Print the selected files (always true even if not specified). |'
