  md: '# WebNFS


    WebNFS extends the NFS protocol to allow Web browsers or Java applets to access
    NFS shared resources. It allows client systems to access NFS resources without
    requiring them to be NFS clients. Browsers can access NFS resources using an NFS
    Uniform Resource Locator (URL) that takes the form nfs:/server/path. The WebNFS
    server and client specifications are defined by RFCs 2054 and 2055.


    The share command supports NFS-specific options that pertain to WebNFS access.
    The first is the public option. Each server has one public file handle that is
    associated with the root file system of the server. NFS URLs are relative to the
    public file handle. For example, accessing the target directory under the /usr/data
    shared resource on the host server using the nfs:/server/target NFS, if the public
    option is specified when the /usr/data directory is shared, the public file handle
    is associated with the /usr/data directory; this association using the nfs://server/target
    NFS URL to access the same data.


    The second option is index, which is used to specify a file that contains information
    that should be displayed inside a listing of the directory. The following listing
    uses the share command to read/write NFS and WebNFS access to the /export/home
    directory:


    ```

    # share -F nfs -o rw, public, index-index.html /export/home

    #

    ```


    # The Auto File System Service


    The Auto File System (AutoFS) service is a client-side service that is used to
    automatically mount and unmount NFS resources on demand. This simplifies keeping
    track of resources manually and reduce network traffic. In addition, AutoFS eliminates
    the need to add NFS mounts in the /etc-/fstab file. It allows faster booting and
    shutdown, and users need not know the root password to mount/unmount NFS resources.


    The automount(1M) command runs when the system is booted (system run level 2)
    and initializes the AutoFS service. In addition, the automount(1M) is started
    at this time. The automount command is a daemon process that runs continuously
    and performs the automatic mounting and unmounting.


    By default, a resource is unmounted if it is not accessed for 10 minutes. You
    can modify this default time by using the automount command and including the
    -t command-argument followed by a number representing a time (in seconds).'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'The configuration of the AutoFS service is controlled by AutoFS maps that define
    local mount points and associate remote NFS resources with the mount points. These
    maps are read by the automount command during initialization.


    # AutoFS Maps


    The three types of AutoFS (or automount) maps are auto_master, direct, and indirect.
    These maps are found under the /etc directory.


    # The /etc/auto_master File


    The auto_master file associates directories with indirect maps. In addition, the
    auto_master file references one or more direct maps.


    Entries in the auto_master file consist of three fields:


    +   * Mount point—The initial portion of a full path to a local directory where
    an NFS resource should be mounted.


    +   * Map name—The file name of a map (direct or indirect) or a special built-in
    map. You can identify a built-in map by the first character in its name, which
    is a hyphen (-).


    +   * Map options—Zero or more (comma-separated) NFS-specific mount options, as
    described earlier in Table 18.3.


    A special mount point that uses the /- indicates that the map listed in the map
    name field is a direct map that actually contains the mount points. In addition,
    a special entry that consists of only the keyword +auto_master is used to include
    AutoFS maps that are part of Network Information Service (NIS) or NIS+.


    The following list shows the contents of the /etc/auto_master file:


    ```

    # Map map for automounter

    #

    +auto_master

    /net            -hosts -nosuid,nobrowse

    /home           auto_home -nobrowse

    /xfn            -xfn

    /-              auto_direct

    ```


    As previously described, the /net and /xfn entries reference built-in maps. The
    /home entries reference the indirect map /etc/auto_home, and the /entry entry
    references the direct map /etc/auto_direct.'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'The **hosts** built-in map uses the hosts database. The **-xfn** built-in map
    uses resources shared through the Federated Naming Service (FNS).


    # Direct Maps


    A direct map provides both mount point and NFS resources. Entries in a direct
    map consist of three fields:


    +   - **Key**—Typically a full pathname that is be used as a mount point.

    - **Mount options**—Zero or more (comma-separated) NFS-specific mount options,
    as described earlier in Table 18.3.

    - **NFS resource**—Files that take the form *server:file system*, which identifies
    a file system shared by the system server. More than one NFS server might be providing
    the same resource, multiple resources can be specified (separated by spaces).
    The first available resource is used.


    The following listing shows the contents of the `/etc/auto_direct` file that is
    referenced in the `/etc/auto_master` file:


    ```

    /usr/local/bin    nsserver:/usr/local/bin

    /usr/games      ro  nsserver:/usr/games

    ```


    In this example, `/usr/local/bin` and `/usr/games` directories shared by the host
    named **nsserver** are mounted on the local system under mount points using the
    same names.


    The default name for the initial direct map is `auto_direct`.


    # Indirect Maps


    An indirect map provides the remainder of the `/etc/auto_master` mount point and
    identifies the NFS resource that should be mounted on the client. Entries in an
    indirect map consist of three fields:


    +   - **Key**—Typically a directory that provides the remainder of the mount point.

    - **Mount options**—Zero or more (comma-separated) NFS-specific mount options,
    as described earlier in Table 18.3.

    - **NFS resource**—Files that take the form *server:file system*, which identifies
    a file system shared by the system server.


    The following listing shows the contents of the `/etc/auto_home` file:


    ```

    dla          solaris:export/home/dla

    guest      -rw, nousid

    nsserver:/export/home/guest

    ```


    In this example, the indirect map is referenced by the `/home` entry in the `auto_master`
    file. It contains two entries. The first entry identifies the `/home/dla` mount
    point, which is used to mount'
