  md: '# # User and Group Account Administration Files


    Three administrative files are used to define and manage user and group accounts:


    +   - /etc/passwd

    - /etc/shadow

    - /etc/group


    ```

    /etc/passwd

    ```


    The /etc/passwd file is an ASCII file that defines user accounts on the local
    system. Each line in the file represents a user account and consists of seven
    colon-delimited fields. Table 5.1 lists the fields of the /etc/passwd file.


    Table 5.1: /etc/passwd fields.


    | Field | Purpose |

    | --- | --- |

    | User name | The unique name assigned to the user account. |

    | Password | In earlier versions of Unix, the password field contained the encrypted
    account password. For security reasons, the passwords have been moved to the /etc/shadow
    file. The letter x is typically placed in this field to indicate that the password
    is in /etc/shadow. |

    | UID | A unique numeric identification assigned to the user account. Any processes
    or files created by the user account will be owned by this UID. The system administrator
    account, root, is assigned a UID of 0. This is the UID of a superuser account.
    System maintenance accounts are usually assigned a UID of less than 100, whereas
    user accounts typically start at 1001. |

    | GID | The numeric identification of the default group that the user account
    has been assigned as a member. Groups are defined in the /etc/group file. |

    | Comment | Information about the owner of the user account, such as name, phone,
    mailing address, and so on. An ampersand (&) in this field is interpreted as the
    contents of the user name field. |

    | Home directory | The full path to the directory where the user is initially
    located after logging in. |

    | Login shell | The full pathname of the initial shell used as a command interpreter.
    If this field is empty, the default is /usr/bin/sh. |'
