  md: 'You then use the patchadd command to install the patch. Because patches have
    no default spool directory, you must specify the full pathname to the patch as
    a command-line argument. The following example shows the installation of the x86
    find command patch on a standalone system:


    ```

    # patchadd 110906-01

    ```


    +   Checking installed patches...

    Verifying sufficient filesystem capacity (dry run method)...

    Installing patch packages...


    Patch number 110906-01 has been successfully installed.

    See /var/sadm/patch/110906-01/log for details

    Patch packages installed:

    SUNWcu


    Note that the patch modified the SUNWcu package (core Solaris software). The patchadd
    command is actually a shell script that calls the pkgadd command to install the
    patch.


    To apply to the bootable root image of a diskless client or AutoClient, use the
    -R command-line argument and specify the pathname to the client''s root image.
    For example, applying the Solaris 8 x86 find command to a diskless client uses
    a root image stored under the /export/root/client directory on the current system
    requires the following command:


    ```

    patchadd -R /export/root/client /var/spool/patch/110906-01

    ```


    To apply to an on operating system (OS), use the -S command-line argument and
    specify the service (see Chapter 13 for information about OS servers). For example,
    applying the Solaris 8 find command to an x86 Solaris 8 OS server named Solaris_8x86
    on the OS requires the following command:


    ```

    patchadd -S Solaris_8x86 /var/spool/patch/110906-01

    ```


    To apply to the root of a net install image (the image used to install a system
    over the network), use the -C command-line argument and specify the pathname to
    the net image. For example, applying the Solaris 8 find command to an x86 Solaris
    8 image on a net install server named Solaris_8x86 on an install server requires
    the following command:


    ```

    patchadd -C /export/Solaris_8x86/Tools/Boot

    var/spool/patch/110906-01

    ```


    Multiple patches can be installed using the patchadd command with the -M command-line
    argument and by specifying a directory where all the patches are located along
    with a list of the patch numbers. For example, to install patches 108529-05, 108653-23,
    and 108876-07, which are all located in the /var/spool/patch directory, you can
    use the following command:


    ```

    patchadd -M /var/spool/patch 108529-05 108653-23 108876-07

    ```'
