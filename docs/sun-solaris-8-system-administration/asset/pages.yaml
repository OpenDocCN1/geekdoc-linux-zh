    # ## The devfsadm and devfsadmd Commands


    The **devfsadm(1M)** command and its daemon **devfsadmd(1M)** are used to maintain
    the /dev/devices directories. As device drivers are loaded into the kernel, the
    **devfsadm** program creates the appropriate /devices special files and dev links
    to provide access to the devices.'
