    * Displaying the partition table

    * Using raw and block logical device names

    * Managing hot-plugging devices

    * Using the format command


    The first part of this chapter describes the three naming conventions used to
    identify system devices. It focuses on the device names associated with disks
    and the commands used to display these names. The second part of the chapter provides
    a brief introduction to hot-plugging devices and their management. The third part
    defines the logical structure of a disk, referred to as a partition, and describes
    how to create and display partition-related data. The last section describes the
    use of the format command. This chapter covers the Disk Configuration and Format
    test objectives.


    # Disk Device Names


    Disks, like other devices of the Solaris 8 operating system, can be referenced
    using three naming conventions:


    +   * Physical device name'
