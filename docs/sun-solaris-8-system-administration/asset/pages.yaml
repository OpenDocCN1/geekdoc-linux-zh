    # # Solaris Reference Manual


    The Solaris 8 Reference Manual (in printed form) is a multvolume set of manuals
    that document the commands, system calls, library functions, special files, and
    so on, that are available with the Solaris 8 operating system. This format originated
    with the initial version of the Unix operating system developed by AT&T Bell Labs
    and has been adopted as the definitive documentation for almost every version
    of the Unix operating system.


    For convenience, an online version of the Reference Manual is provided with the
    Solaris 8 system and most versions of the Unix operating system. The pages or
    topics of the online Reference Manual can be viewed on the terminal/monitor screen
    using the man(1) command. The Reference Manual is also included in the Solaris
    8 AnswerBook2 online documentation, which lets you search, display, and print
    Reference pages using an HTML web browser as Net Navigator. The pages of the Reference
    Manual are referred to as man pages.


    The Reference Manual is divided into sections. Each section addresses a related
    set of commands or different aspects of the operating system. Table 2.2 describes
    the Reference Manual sections.


    # Table 2.2: Sections of the Solaris 8 Reference Manual.


    | Section | Description |

    |---|---|'
