  md: '# Glossary


    Access Control List (ACL)

    Solaris 8 extends the standard Unix file permissions by adding an Access Control
    List capability. ACLs provide the ability to add permissions for specific users
    and groups along with a default permission (mask). In addition to supporting the
    standard read/write/execute permissions for owner, group, and other, ACLs can
    be used to set read/write/execute permissions for additional user accounts and
    group accounts and define a mask capacity that controls the maximum allowed permissions
    given to user and group accounts. The ACL for a directory defines entries that
    the permissions assigned to files and subdirectories created under the directory.
    The setfac(1M) command is used to set ACLs, and


    Address Resolution Protocol (ARP)

    A protocol used to map from an IP address to an Ethernet address.


    architecture

    The variation of the platform. For SPARC platforms, types of architecture include
    sun4c and sun4m.


    authorization(role-based access control)

    The right to perform restricted administrative functions such as shutting down
    the system.


    AutoClient

    A type of network client that uses a local disk for swap space and a cached copy
    of the root and user file systems.


    AutoFS

    A network service and type of file system. AutoFS resources are mounted automatically
    when an attempt is made to access them and are unmounted automatically after a
    period of being idle.


    AutoFS map

    A file used to configure the AutoFS service. The three types of AutoFS maps are
    the /etc/auto_master file identifies other maps, direct maps that identify pathnames
    to mount points and associated NFS resources, and indirect maps that identify
    partial pathnames to mount points and associated NFS resources.


    boot server

    A network server that provides the files necessary to boot an install client over
    the network during an over-the-network installation. After an install client has
    booted, the boot server has completed its function. The remainder of the installation
    is supported by an install server. Typically, an install server and a boot server
    reside on the same system. However, if clients are on a different subnet than
    an install server, a boot server must be set up on the install clients.


    Bourne shell

    A version of the Unix shell developed by Steven Bourne from AT&T Bell Labs. It
    is referred'
