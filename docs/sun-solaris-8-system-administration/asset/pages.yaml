- img_proc: true
  md: 'Instead of listing a large number of patches on the command line, you can create
    a text file that contains a list of patches. Then, specify the name of the text
    file on the command line in place of all the individual patch names.


    For example, to install the 108529-05, 108653-23, and 108876-07 patches located
    in /var/spool/patch directory, create a text file with the name /var/spool/patch/
    contains the name of the three patches (separated by spaces or returns). Then,
    use the following command to install the patches:


    ```

    patchadd -M /var/spool/patch /var/spool/patch/patchlist

    ```


    **The -M command-line argument** can be used to install multiple patches for client,
    services, or install servers by specifying the described -R, -S, or -C command-line
    argument. This argument should be specified after the -M patch directory and patch
    list command-line arguments. See the previous examples of the **patchadd** command
    for use of all these arguments.


    By default, any files that will be changed as a result of the patch''s installation
    are copied to one or more backup directories. If necessary, you can remove the
    patch and return the system to its state before the patch was installed. However,
    if you specify the -d command-line argument on the **patchadd** command, the files
    are not backed up, and the patch cannot be removed.


    The default backup directories are located under /var/sadm/pkg and are based on
    the installed package or packages being modified by the patch and patch name.
    For example, the x86 **find** command patch (110906-01) modified the SUNWcu package.
    Any files changed by installing this patch will be saved under the /var/sadm/pkg/SUNcu/110906-01
    directory. You can specify a different backup directory by using the -B command-line
    argument.


    The **patchadd** command will fail if any of the following occur:


    +   * A package being patched is not installed or is only partially installed.

    "* The patch requires another patch that is not installed.

    "* The patch is incompatible with another patch already installed.

    "* The current version or a higher version of the patch is already installed.

    "* The architecture of the patch and the system do not match.


    Tip


    After you unzip a patch, you can delete the zip file to save space. Likewise,
    after you install a patch, you can delete the files associated with the patch
    in the patch spool directory to save space.


    # Determining Which Patches Are Installed'
