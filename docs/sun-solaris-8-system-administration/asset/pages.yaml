- img_proc: true
  md: '# Question 24


    Answers a, c, and d are correct. **-c, -d, and -o** are valid command-line arguments
    for **cfsadmin.

    The **-s** command-line argument is used to perform a consistency check, not **-C**.
    Therefore answer b is incorrect.


    # Question 25


    Answer c is correct. Although some of the name services use ASCII files and/or
    provide both hostname and IP address resolution, DNS is the only one used on the
    Internet. Therefore, answers a, b, and d are incorrect.


    # Question 26


    Answer b is correct. A striped file system is composed of several partitions that
    are allocated and used in an interleaved fashion. RAID 1 is a configuration that
    uses mirroring in an identical (not interleaved) fashion. Therefore, answer a
    is incorrect. A concatenated virtual file system uses one partition at a time.
    Therefore, answer c is incorrect. Hot spare is not a type of virtual file system.
    Therefore, answer d is incorrect.


    # Question 27


    Answers a, c, and d are correct. If a file name is specified, the message is appended
    to the file. If a hostname is specified, the message is sent to the host. If a
    user account name is specified, the message is displayed on the standard output
    of the logged-in user. The only other valid action is an asterisk (*), which causes
    the message to be displayed on the standard output device of all logged-in accounts.
    Therefore, answer b is incorrect.


    # Question 28


    Answers a, c, and d are correct. The **share** command, used without arguments,
    lists all locally shared NFS resources. The **dfshares** command can be used to
    list locally or remotely shared resources. The **dfounts** command is used to
    list locally or remotely mounted resources. Therefore, answer d is incorrect.
    The **mountall** command is used to mount local file systems. The **mount** command
    is used to mount or list currently local file systems and NFS resources. Therefore,
    answer e is incorrect.'
