  md: '+   - **m**—Adds/changes the specified ACL entries

    - **s**—Replaces the ACL with the specified entries


    ACL entries for the standard user and group permissions are specified using the
    format entry::permissions (note the two colons), where **entry** is the keyword
    **user** or **group** (the single-letter abbreviation **u** or **g**), and **permissions**
    is the appropriate combination of **r**, **w**, **x**, and -needed to define the
    permission.


    ACL entries for the standard object and the mask used for maximum permissions
    are used slightly different. The format is entry::mask (note the single colon),
    where **entry** is the keyword **object** or **mask** (the single-letter abbreviation
    **o** or **m**), and **permissions** is the appropriate combination of **r**,
    **w**, **x**, and -needed to define the permission.


    The following line shows the **setfacl** command used to set the user permission
    to read/write, and set the group and others to read-only:


    ```

    # setfacl -s u::rw:g::r:o::r file

    ```


    ACL entries for other users and groups are specified using the format entry::id:permissions,
    where **entry** is the keyword **user** or **group** (the single-letter abbreviation
    **u** or **g**); id is a user name, UID, group name, or GID; and **permissions**
    is the appropriate combination of **r**, **w**, **x**, and -needed to define the
    permission.


    The following line shows the **setfacl** command used to add read/write permission
    for user account guest and read-only permission for group account staff:


    ```

    # setfacl -m u:guest:rw-g:staff:r-- file

    ```


    In addition to the previously described ACL entries, you can define additional
    entries for directories. These entries specify the default ACL entries for files
    and subdirectories created under the directory. To establish defaults, use the
    previously described formats and add **d:** at the beginning of the **entry**
    field. All the standard user, group, and other defaults, along with the default
    mask, must be initially at the time.


    For example, to define the default ACL entries for the directory shlog, you can
    use the following **setfacl** command:


    ```

    # setfacl -m d:u::rw-,d:g::rw-,d:o::r-- shlog

    ```


    The **-d** command-line argument is used to delete ACL entries. The remainder
    of the mask and command-line arguments are identical to those used with the **-s**
    and **-m** command-line arguments.


