    # Controlling Network Services


    Most of the Internet and RPC services are managed automatically by the inetd(1M)
    Internet Services daemon. These services are specified as entries in the /etc/inet/inetd.conf
    file (or /etc/inetd.conf, which is symbolically linked to /etc/inet/inetd.conf).


    All Internet and RPC services controlled by the inetd daemon are started automatically
    at system boot, or you can start them manually by executing the /etc/init.d/inetd
    daemon. Likewise, all Internet and RPC services controlled by inetd are stopped
    automatically when the system is shut down, or you can stop them manually by executing
    the /etc/init.d/inetd stop command.


    You can stop individual Internet and RPC services using the kill command to send
    a signal to the process that provides the service. However, the inetd daemon should
    be reconfigured so it will not retry to restart the service.


    To reconfigure the inetd daemon, edit the /etc/inet/inetd.conf file and delete
    the entry for the service. Then, use the kill command to send the Hang Up signal
    (SIGHUP) to the inetd daemon. This signal will cause the inetd daemon to reread
    the /etc/inet/inetd.conf file. You can also use the /etc/init.d/inetd script (as
    previously described) to stop and restart the inetd daemon, or you can reboot
    the system.


    # The Solaris Network Environment


    The Solaris 8 network environment supports several different types of system configurations,
    including standalone, diskless, and AutoClient. These configurations provide different
    capabilities and impact deployment and support costs.


    # Standalone Configuration


    A standalone system has local disk space that is used to store all operating system
    files, applications, and user data. This data includes the root (/), /usr, /export/home,
    and /var file systems. Likewise, it provides local swap space for the system''s
    virtual memory. A standalone system can function autonomously and be either networked
    or non-networked. You can use a'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'networked standalone system as a server, such as a file server, to provide
    remote access to shared or common data.


    # File Server Concepts


    A server is a standalone system that functions as a server and allows clients
    to access files via the network. There are several kinds of file servers.


    One important type of file server in the Solaris environment is the operating
    system (OS) server. The OS server provides access to client systems that do not
    have all or some of the operating system files available through local file systems
    on local hard disks.


    An OS server can support more than one version of an operating system at time.
    This support includes not only different releases of an operating system, such
    as Solaris 8, Solaris 7, and SunOS 2.5, but also different hardware platforms,
    such as SPARC and Intel x86 compatibles.


    # Diskless Configuration


    A diskless client, as the name implies, does not have a hard disk on to store
    the operating system or applications locally. Storage is provided by a diskless
    client server that is accessible via the network. For a diskless client to boot
    and operate, it must remotely mount its root (/) and /usr file systems from an
    OS server.


    In addition to providing a common set of operating files for all the diskless
    clients (of the same version) through the network, the OS server provides hard
    disk space assigned for use by each client. This disk space is used for swap space
    for the diskless client''s virtual memory system, and for the home file system
    for user accounts that are unique to each diskless client.


    Compared to the standalone configuration, the diskless configuration is cheaper
    and easier to maintain, because only a very small number of systems (the OS servers)
    require hard disks. In addition, only one copy of system files is required, and
    this is shared among many clients. All data unique to each client is stored on
    an OS server, simplifying backup and restore procedures. Because no data is stored
    on the client, diskless hardware can be easily replaced or upgraded.


    The main disadvantages of the diskless configuration are its dependence on the
    network and the load that it places on the network. If a diskless client cannot
    access the OS server via the network, it cannot operate at all. In addition, because
    all data (including in swap space) is accessed remotely, the network is extremely
    loaded even under normal operating conditions.


    # AutoClient Configuration'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'AutoClient is similar to a diskless client, except that it has a limited amount
    of local storage space (minimum of 100MB) that is used for a specific purpose.
    Like the diskless client, the AutoClient must remotely access its root (/) and
    /usr file systems from an OS server configured as an AutoClient server. Unlike
    the diskless client, the AutoClient uses local disk space to store or cache the
    root (/) and /usr file systems.


    In addition, the hard disk is used for swap space. Like the diskless configuration,
    the OS server provides hard disk space for the /home and /var file systems that
    are unique to each diskless client.


    Compared to the diskless configuration, the AutoClient configuration is somewhat
    more expensive, because its client requires a hard disk; but, the hard disk is
    small. Like the diskless configuration, only one copy of common files is required,
    and this copy is shared among the clients. In addition, all data unique to each
    client is stored on an OS server, simplifying backup and restore procedures. Thus,
    in terms of client hardware, AutoClients, like diskless clients, can be replaced
    or upgraded easily.


    The disadvantages of diskless configuration are reduced or, in some cases, eliminated
    by AutoClient configuration. After the AutoClient has cached the operating system,
    it no longer requires access to the OS server for those files. In addition, the
    local swap space eliminates a significant portion of the network load.


    # Comparison of Configurations


    Table 13.6 provides a comparison of the significant differences among the various
    system configurations supported in the Solaris 8 network environment.


    | Table 13.6: A comparison of system configurations.

    | System Type | Local Swap Systems | Local File Systems | Remote File |

    | --- | --- | --- | --- |

    | Standalone | Yes | root, /usr, /var, /export/home | None |

    | Diskless client | No | None | root, /usr, /var, /home |

    | AutoClient | Yes | root, /usr | /var, /home |


    Standalone systems that function as servers typically provide file systems—such
    as /export/root, /export/home, and /export/swap—that store files remotely accessed
    by diskless clients and AutoClients. In addition, servers and standalone systems
    provide the /opt file system for storing application software.'
