    # Checking and Repairing File Systems


    File systems are damaged when the data that defines the file systems is corrupted.
    This corruption

    can be caused by either software errors or by failures of the underlying physical
    disk hardware.

    The fsck (1M) command checks (audits) the logical consistency of a file system
    and attempts to

    make the repairs necessary to eliminate any inconsistency. The fsck command checks
    the

    superblock, inodes, indirect blocks, and directory data block.


    The fsck command is typically executed when a file system is mounted automatically
    or as part

    system boot. It can also be executed manually on one or more file systems. Only
    unmounted file

    systems should be checked and repaired, because changes can affect programs accessing
    the

    file system and in turn cause even more damage. One or more logical device names

    (partitions) can be specified as command-line arguments. With the mkfs command,
    you should'
