- img_proc: true
  md: 'The boot command supports a couple of options that you may find useful. The
    -a option requests an interactive boot so that OpenBoot will prompt for information
    when needed. In addition, the -s option causes OpenBoot to single-user mode instead
    of the default system run level. When you''re booting from the hard disk, the
    default device is specified by the boot-device NVRAM configuration parameter.
    From the OpenBoot ok prompt, use the following command to display the default
    device:


    ```

    ok printenv boot-device

    boot-device = disk

    ok

    ```


    The default device can be changed as required. For example, to change the default
    boot device to a device with the alias disk2, use the following command. Then,
    use reset to save the new value and reboot:


    ```

    ok setenv boot-device disk2

    ok reset

    ```


    # Device Aliases


    OpenBoot identifies hardware using a full device pathname that represents the
    type of device and its location in the system. A device pathname consists of system
    buses, addresses, and possibly driver names. The following is an example of a
    full device name for a partition of a SCSI disk drive:


    ```

    /sbus1f,0/SUN,fas@e,8800000/sd@3,0:a

    ```


    For more details on device names, see Chapter 8. Because device names are typically
    long, complex, and awkward to enter, OpenBoot lets you assign a device alias to
    a full device name; this alias is a name that''s short and easy to remember


    # Creating a Device Alias


    You can create an alias two ways. The first method uses the dealias command. Aliases
    created with this command are lost when the system is rebooted. The second method
    uses nalias command. Aliases created with this command are stored in nonvolatile
    memory and remain until you remove them using other OpenBoot commands. Both commands
    use the same syntax.


    For example, both of the following commands, entered at the OpenBoot ok prompt,
    will assign the alias disk2 to the device named /sbus/esp/sd@2,0 (a SCSI disk):


    ```

    ok dealias disk2 /sbus/esp/sd@2, 0

    ok nalias disk2 /sbus/esp/sd@2, 0

    ok

    ```'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'Whenever the device name is required in the OpenBoot environment, you can use
    the alias instead. When you enter the nvalias command, it''s stored in nonvolatile
    memory. This portion of memory is treated as an OpenBoot parameter called the
    nvramc parameter. The contents of the nvramc parameter are called the script.
    In addition to storing user-defined commands, the parameter is used by device
    drivers to startup configuration variables, to partition device code, and to store
    patches or installation-specific device configuration information.


    If the OpenBoot use-nvramc parameter is set to true, the script is executed during
    system boot. Any aliases defined in nvramc using the nvalias command will be set,
    and then the aliases can be used in a later part of the script or as the value
    of one or more other OpenBoot parameters.


    # Displaying Device Aliases


    You can also use the devalias command to display device aliases. If you enter
    the command without any command-line arguments, defined device aliases are listed.
    If you list a device alias as a command-line argument, the devalias command will
    display only the named device alias. The following example shows using the devalias
    command from the OpenBoot ok of a SPARC 2020:


    ```

    ok devalias

    screen /iommu@f, e000000/sbuf@f, e001000/csix@2, 0

    tty /iobio/zs0, 100000:b

    tty /iobio/zs0, 100000:a

    keyboard /iobio/zs0, 0

