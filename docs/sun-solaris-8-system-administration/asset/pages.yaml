- img_proc: true
  md: 'Table 9.3 lists the commonly used command-line arguments for the mount command.


    | Table 9.3: Selected mount command-line arguments. |

    | Argument | Use |

    |---|--- |

    | -F type | Specify the type of file system (NFS, UFS, and so on) |

    | -m | Mount the file system without making an entry in /etc/mttab |

    | -o | Specify file-system-specific options |

    | -p | List the mounted file systems (abbreviated listing) |

    | -r | Mount the file system as read-only |

    | -v | List the mounted file systems (verbose listing) |


    Multiple file-system-specific options (-o) can be separated by commas. Some of
    the frequently used options:


    +   - atime—Use normal access recording (default).

    - intr—Allow keyboard interrupts to kill processes waiting on file system I/O
    (default).

    - largfiles—Allow files larger than 2GB (default).

    - noatime—Reduce activity by not updating file times.

    - nointr—Do not allow interrupts to kill processes waiting on file system I/O.

    - nolargfiles—Do not allow files larger than 2GB. If any exist in the file system,
    the mount will fail.

    - nosuid—Disallow setuid execution on files.

    - suid—Allow setuid execution on files (default).


    The following (abbreviated) listing shows the use of the mount command:


    ```

    # mount

