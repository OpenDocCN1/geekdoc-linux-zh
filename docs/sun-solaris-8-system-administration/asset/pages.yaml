  pgno: 22
- img_proc: true
  md: 'programs phase locates and loads boot programs, and then the kernel initialization
    phase loads the kernel. Answers d and e are incorrect. Only then can the init
    phase occur to initialize the operating system services.


    This sample question corresponds closely to you''ll see on Solaris certification
    exams. To select the correct answer during the test, you would position the cursor
    over the radio button next to answer an and click the mouse to select that particular
    choice. The only difference between the questions on the certification exams and
    questions such as this one is that the real questions are not immediately followed
    by the answers.


    The following is a question for which one or more answers are possible. This type
