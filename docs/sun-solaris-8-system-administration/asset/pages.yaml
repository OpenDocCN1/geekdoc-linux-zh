    # Changing Passwords Using the passwd Command


    Other than the admittool command, the passwd(1) command is the only way to change
    the password for a user account. When without any command-line arguments, the
    passwd command changes the password of the current user account. For example:


    ```

    $ passwd

    ppasswd: Changing password for dla

    Enter login password:

    New password:

    Re-enter new password:

    passwd (SYSTEM): passwd successfully changed for dla

    $

    ```


    Note that the current password must be entered before a new password can be specified.
    When a superuser account, such as root, uses the passwd command, the current password
    is not required.


    A variety of command-line arguments are provided to support changing passwords.
    Table 6.4 lists the more significant command-line arguments.


    Table 6.4: Selected command-line arguments for the passwd command.


    | Argument | Description |

    | --- | --- |

    | account | Specifies the name of the user account for which the password will
    be changed |

    | -as | Lists password attributes for all user accounts (displays LK for locked,
    PS for password, and so on) |

    | -d | Deletes the password for the specified account |

    | -1 | Locks the specified account so it cannot be accessed |


    A superuser account can change the password for another user account. The user
    account is specified as a command-line argument. For example:


    ```

    # passwd dla

    New password:

    Re-enter new password:

    passwd (SYSTEM): passwd successfully changed for dla

    #

    ```'
