- img_proc: true
  md: '# File System Basics


    A file system is a logical collection of files and directories contained in a
    partition. It can be treated as a single entity when you''re making it available
    for use (mounting), checking it, and repairing it.


    The three types of file systems supported by the Solaris 8 environment are disk
    based, memory based (pseudo), and network based. The Part I exam concentrates
    on disk-based file systems. The Part II covers pseudo file systems (Chapter 16)
    and network-based file systems (Chapter 18).


    Disk-based file systems are stored on physical disks, CD-ROMs, and diskettes on
    the local system. Table 9.1 lists the disk-based file formats.


    | Format | Description |

    | High Sierra File System (HSFS) | The default format for CD-ROM file systems
    |

    | PC File System (PCFS) | The default format for disk file systems; same as the
    DOS disk format |

    | Universal Disk Format (UDF) | Format for optical media referred to as Digital
    Versatile Disc (DVD) |

    | Unix File System (UFS) | The default format for hard disk file systems |


    Pseudo file systems are memory based and provide access to special system information,
    such as processes. Several pseudo file system formats are used, including CacheFS
    for system cache, Lookback File System (LOFS) to provide alternate path names,
    the Temporary File System (TMPFS), and the Process File System (PROCFCS).


    # Default Solaris 8 File Systems


    The disk space available for use with a Solaris 8 operating system is a collection
    of mounted file systems. The top directory is the location where the root file
    system is mounted. The locations where other file systems are mounted, called
    mount points, are typically subdirectories of the root file system, and normally
    are used to refer to the file systems themselves. For example, the file system
    mounted at usr is referred to as the usr file system. Table 9.2 lists the default
    file systems of a Solaris 8 operating system.


    | File System | Use |'
  merge: -1
  pgno: 189
- img_proc: true
  md: '| Table 9.2: Default file systems. |

    | File System | Use |

    | root (/) | The top of the hierarchical file system tree. Contains critical system
    files, such as the kernel and device drivers. |

    | /usr | System files, such as commands and programs, used to administer and use
    the system. |

    | /home | User home directories. On some systems, it might be /export/home or
    a network-based file system. |

    | /var | System files that change or grow, such as logs, queues, and spooling
    areas. |

    | /opt | Third-party software and applications. |

    | /tmp | Temporary files cleared each time boots. |

    | /proc | Information on active processes. |


    All the disk-based file systems are UFS. The two memory-based file systems (/tmp
    and /proc) are type TMPFS and PROCFS, respectively.


    > kernel files reside in the root file system and system reside in the /usr file
    system, these two file systems are required to boot a usable system.


    # Creating UFS Systems


    You can use the mkfs(1M), mkfs_ufs(1M) and newfs(1M) commands to create a UFS
    file system. The mkfs_ufs command is typically not used directly. It is called
    by the mkfs command when mkfs is used to create a UFS file system. The newfs command
    is the preferred method for creating a UFS file system, because it provides a
    user-friendly interface to the mkfs command.


    The newfs command calculates the appropriate parameters and calls the mkfs command
    to create the file system. You can specify command-line arguments to override
    the calculated parameters. The only required command-line argument is the raw
    device name of the partition in which the file system should be created. The following
    listing uses newfs command to create a UFS in a 1GB partition. The -v command-line
    argument specifies verbose mode, which causes the newfs command to display its
    actions:


    ```

    # newfs -v /dev/rdsk/c0ds1

    newfs: construct a new file system /dev/rdsk/c0ds1? (y/n)? y

    mkfs -F uds /dev/rdsk/c0ds1 2104515 63 240 8192 1024 ... 8 7

    Warning: 12286 sector(s) in last cylinder unallocated

    /dev/rdsk/c0ds1: 2104515 sectors in 140 cylinders of 24 tracks,

    ```'
