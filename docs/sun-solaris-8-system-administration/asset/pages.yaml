- img_proc: true
  md: 'the login(1) command is used to log in (or into or on) a system. When connection
    is made to the system via the network or tty device, the login command typically
    is used to interact with the user to prompt for and obtain a user account name
    and password. These are then compared to the entries in the /etc/passwd and /etc/shadow
    files to determine if the user should be given access to the system. If the shell
    specified in /etc/passwd fails to provide the user an interface to the system.
    If not, the login command tries several times to obtain a valid user account and
    password. If all these attempts fail, the connection to the system is dropped.


    # Failed Login Attempts


    Failed login attempts are saved in the /var/admin/loginfile after five unsuccessful
    attempts. Logging is enabled by creating the loginfile and disabled by deleting
    it. The file should be created with read/write permissions for root only.


    # Logging Out of Solaris 8 System


    In most situations, you can use the exit(1) command to log out of (or, in some
    circles, off of) a system. All three shells recognize this command. For csh, the
    logout(1) command can also be used to log off a system.


    # Identifying and Monitoring Users


    You can use several commands to identify and monitor users:


    +   - id(1)—Displays the real and effective UID and GID

    - finger(1)—Displays information about local and remote users

    - last(1)—Displays login and logout information

    - who(1)—Displays the users currently logged in to the system

    - whoami(1)—Displays who is doing what


    # The id Command


    The id command displays the real and effective UID and GID for the invoking process
    or specified user account. If you invoke id with -a as an option, all groups in
    which the user ID is a member will be returned. The following lines show the results
