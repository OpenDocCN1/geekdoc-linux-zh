  md: 'Note that the cfsadmin -l command reports on the configuration status (tunable
    parameters) of the cache, whereas the cachefsstat reports on the contents of the
    cache (cached file system statistics).


    # Checking the Consistency of a Cache


    To be certain that information in a cache is up to date, periodic consistency
    checks are performed automatically. These checks may create a large amount of
    network activity. To reduce the amount of network traffic, you can disable the
    automatic consistency checking and check the consistency manually (on demand).


    To disable automatic consistency checking (that is, to request on-demand consistency
    checking), specify the demandcost when the file system is mounted. The line is
    wrapped to improve readability.


    ```

    # mount -F cachefs -backtype=nfs, cachedir=/cache, demandconst

    sparc20:/export/home /home

    #

    ```


    To perform a consistency check on demand, use cfsadmin -s followed by a mount
    point of the cached file system as a command-line argument:


    ```

    # cfsadmin -s /home

    #

    ```


    # Managing a Cache Log


    The cachelog(1M) command is used to set up, verify, and halt CacheFS logging.
    The cachefwssize command is used to analyze the log to determine a recommended
    working set size for cache. A cache that''s too small will cause access delays
    and higher network traffic (a low hit rate). A cache that''s too large will waste
    file system space.


    To set up a CacheFS log, use the cachelog command with the -f command-line argument
    followed by the file name for the log and name of directory where the cached file
    system is mounted (the name of the cache itself). For example, to setup a log
    named var/tmp/home_log on a cached file system mounted at /home, use the following
    cachelog command:


    ```

    # cachelog -f /var/tmp/home_log /home

    /var/tmp/home_log:/home

    #

    ```'
