    # The Spray Command


    The /usr/bin/spray command sends a stream of User Datagram Protocol (UDP) to a
    host using the Remote Procedure Call (RPC) mechanism. On the remote end, the spray
    daemon, **sprayd**(1M), accepts these packets and acknowledges receiving them.
    The **spray** command, along with the sprayd program, is used to verify both the
    connectivity between two hosts and the proper operation of the **sprayd** network
    interfaces and protocol stacks (both hosts) up to the Application Layer.'
  merge: -1
