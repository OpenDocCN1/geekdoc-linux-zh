    # #


    # ## Checking the Status of a Cache


    To display the status of a cached file system, use the cfsadmin command and specify
    the -l command-line argument followed by the name of the cache.


    The following information about cache is displayed:


    +   * maxblocks—The maximum amount of storage space the cache can use (expressed
    as a percentage of blocks in the front file system).

    * minblocks—The minimum amount of storage space the cache can use (expressed as
    a percentage of blocks in the front file system).

    * threshblocks—The threshold at which additional resources cannot be claimed after
    minblocks is reached (expressed as a percentage of blocks in the front file system).

    * maxfiles—The maximum number of files the cache can use (expressed as a percentage
    of blocks in the front file system).

    * minfiles—The minimum number of files the cache can use (expressed as a percentage
    of blocks in the front file system).

    * threshfiles—The threshold at which additional inodes cannot be claimed after
    minfiles is reached (expressed as a percentage of inodes in the front file system).

    * maxfilesize—Size of the largest file allowed in the cache.


    351'
