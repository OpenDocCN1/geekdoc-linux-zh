- img_proc: true
  md: '# Using the Command to Partition a Disk


    You can use the **format** command to create or modify a partition table. After
    you select a disk, the Format Menu is displayed. From this menu, select Partition
    to display the Partition Menu, as shown in the following list:


    PARTITION MENU:


    +   - 0 - change ''0'' partition

    - 1 - change ''1'' partition

    - 2 - change ''2'' partition

    - 3 - change ''3'' partition

    - 4 - change ''4'' partition

    - 5 - change ''5'' partition

    - 6 - change ''6'' partition

    - 7 - change ''7'' partition

    - select - select a predefined table

    - modify - modify a predefined partition table

    - name - name the current table

    - print - display the current table

    - label - write partition map and label to the disk

    - !<cmd> - execute <cmd>, then return

    quit


    To modify partitions, select the partition number (0 through 7) and then enter
    the tag, flags, starting cylinder, and partition size in bytes or cylinders. A
    predefined table can be selected and used. Alternatively, you can use an existing
    partition table as a starting point to create a custom table. To save custom tables,
    choose the Save item of the Format Menu.


    # Using the prvtoc Command to Display the VTOC


