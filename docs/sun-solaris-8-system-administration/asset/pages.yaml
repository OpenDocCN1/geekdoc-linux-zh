  md: 'The Execution Attributes Database file is associated with what other RBAC attributes
    database file?


    +   a. Authorization Attributes Database file

    b. Profile Attributes Database file

    c. User Attributes Database file


    Answer b is correct. Privileged operations listed in the Execution Attributes
    Database file are associated with profiles listed in the Profile Attributes Database
    file. The Authorization Attributes Database defines privileged operations associated
    with a profile and does not relate directly to command execution. Therefore answer
    a is incorrect. The User Attributes Database associates users and roles with authorizations
    and profiles. These also do not relate directly to command execution. Therefore
    answer c id incorrect.


    # Question 4


    Which of the following keys are allowed in the attribute field of the User Attributes
    Database file? [Select all apply]


    +   a. auths

    b. help

    c. profile

    d. roles

    c. type


    Answers a, c, d, and e are correct. The attribute field of the User Attributes
    Database file can be used to assign authorizations, profiles, and roles. The type
    key identifies entries as either normal user accounts or roles. The help key is
    supported only in the Authorization and Profile Attributes Database files. Therefore
    answer b is incorrect.


    # Question 5


    Which of the following is the definition of a role?


    +   a. A special user account to which authorizations and profiles are assigned.

    b. A right used to grant access to a restriction function.

    c. A mechanism used to group authorizations and profile assignments.

    d. A user account that does not require a password.

    e. A user account that can be accessed via the login command.'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'Answer a is correct. A right used to grant access to a restriction function
    is the definition of an authorization. Therefore, answer b is incorrect. A mechanism
    used to group authorizations and profile assignments is the definition of a profile.
    Therefore, answer c is incorrect. Roles, like other user accounts, require a password
    and can only be accessed using the su(1) command. Therefore, answers d and e are
    correct.


    # Question 6


    Which of the following keys can be used in the attribute field of the RBAC Execution
    Attributes Database file? [Select all that apply]


    +   a. auths

    b. gid

    c. help

    d. profiles

    e. uid


    Answers b and e are correct. The only valid keys for the attribute field of the
    Execution Attributes Database file are eid, gid, euid, and uid. The keys can only
    be specified in the User and Profile Attributes Database files. Therefore, answer
    a incorrect. The help key is only supported in the Authorization and Profile Attributes
    Database files. Therefore, answer c is incorrect. The profiles key can only be
    specified in the User Attributes Database file. Therefore, answer d incorrect.


    # Question 7


    Which of the following describes the format of the RBAC User Attributes Database
    file?


    +   a. name:qualifier:res1:res2:attributes

    b. name:res1:res2:description:attributes

    c. name:res1:res2:short description:long description:attributes

    d. name:policy:type:res1:res2:ID:attributes


    Answer a is correct. The RBAC User Attributes Database file uses the format name:qualifier:res1:res2:attributes.
    name:res1:res2:description:attributes is the format of the Profile Attributes
    Database file. Therefore, answer b is incorrect. name:res1:res2:short description:long
    description:attributes is the format of the Authorization Attributes Database
    file. Therefore, answer c is incorrect. name:policy:type:res1:res2:ID:attributes
    is the format of the Execution Attributes Database file. Therefore, answer d is
    incorrect.'
