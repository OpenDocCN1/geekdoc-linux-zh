    - chgrp(1M)—Changes file group ownership


    # Changing the File User Account


    The chown command is used to change the file user account along with the owner
    of a file or more directory. You specify the user account name or associated UID
    with the name of one or more files that should be owned by the specified user
    account. The following lists use the chown command to change the ownership of
