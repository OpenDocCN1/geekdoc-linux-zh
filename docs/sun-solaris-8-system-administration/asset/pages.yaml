    | -P cpus | Reports only processes executing on the CPUs listed by **cpus**. |

    | -R | Executes **prstat** in realtime mode. |

    | -s key | Sorts the report in descending order based on key (cpu, time, size,
    rss, or pri). |

    | -S key | Sorts the report in ascending order based on key |'
