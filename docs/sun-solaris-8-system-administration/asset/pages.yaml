  md: '# The Three Parts of the Operating System


    Solaris 8, like all variations of the Unix operating system, consists of three
    parts: the kernel, the shell, and the file system. Each of these will be discussed
    in the next sections.


    # The Kernel


    The kernel is a collection of software that manages the physical and logical resources
    of the computer. These management services include controlling the allocation
    of memory and other storage devices, controlling access to peripheral devices
    (input/output), and controlling the scheduling and execution of processes or tasks.
    For the most part, these services are transparent to the user. The user requests
    a task, and the kernel deals with the complexity of the underlying hardware and
    allocating logical resources to accomplish the task.


    The physical resources are controlled by means of software modules, referred to
    as device drivers, which understand how to communicate with hardware devices and
    control their operation. Typically, each device has a unique driver that is provided
    with the hardware and is identified by hardware manufacturer, model, and sometimes
    hardware version.


    The logical resources include processes and memory. A process is a task or program.
    The kernel maintains internal data structures that define and control the processes;
    it also controls the scheduling, execution, and termination of processes. Other
    important kernel services are memory management, allocating it to processes as
    needed, and reclaiming it as processes release it or terminate. Interprocess communication
    involves handling the cooperative communication between processes.


    The Solaris 8 kernel supports multiple users, each of which can be executing one
    or more processes or tasks. Thus, Solaris 8 is both a multiseruser and a multitasking
    system. The Solaris 8 kernel achieves this support by allowing a task to access
    system resources for a small slice of time. A task is allowed to execute for one
    or more time slices and is suspended to allow another task to execute. This approach
    provides time-sharing among all tasks and gives the appearance that all tasks
    are running simultaneously. A task that appears to be executing all the time (and
    typically provides a service on demand) is referred to as a daemon.


    # The Shell


    The shell is a software module that provides the interface between users and the
    kernel. It accepts user requests and submits them to the kernel. It also accepts
    status information and data from the kernel and presents them to the user. Typically,
    the shell accepts user input from a terminal or'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'network connection; however, input can be taken from a file, a device, or even
    another process. In addition, output from the kernel is typically sent to the
    user''s terminal or network connection. Likewise, this output can be redirected
    to a file, a device, or another process.


    The shell also provides a built-in programming language that can be used to automate
    repetitive tasks. This automation includes flow control with the ability to manipulate
    numeric and string data.


    Solaris 8 provides several different shells, each with unique strengths. Some
    shells provide a history/recall mechanism that allows the user to reexecute a
    previous command by entering a few control sequences instead of reentering the
    command. Other shells provide built-in math manipulation.


    # The File System


    A file is a group of bytes used as a unit for storage, retrieval, and manipulation.
    The file system is a collection of files stored on a disk drive in a hierarchical
    structure. A special type of file, called a directory, serves as a folder and
    is used to organize files. A file system can be thought of as an inverted tree,
    with the directories being the branches and the files being the leaves. The name
    for the top-level directory of a Unix system is root, comes from this analogy.


    The Unix operating system supports the file system concept by providing utilities
    to create, mount (make accessible), check, repair, duplicate, and back up file
    systems. The storage space that is accessible on a Unix system is usually divided
    into multiple file systems. This division allows easier maintenance and improves
    performance.


    # The Three Most Common Shells


    The Solaris 8 environment provides several shells. The three most common shells
    are the Bourne shell (sh), the C shell (csh), and the Korn shell (ksh).


    The Bourne shell was developed by Steven Bourne at AT&T Bell Laboratories and
    was provided with the original Unix operating system. The operating system was
    designed and developed by Ken Thompson and Dennis Ritchie at Bell Labs during
    the 1970s. The most popular version was Unix System V.


    The Bourne shell is the default shell for the Solaris 8 operating system.


    The C shell was developed by Bill Joy of the University of California, Berkeley
    and was provided with a version of the Unix operating system that was developed
    at the university and referred to as Berkeley Software Distribution (BSD) Unix.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'The Korn shell was designed and developed by David G. Korn at AT&T Bell Laboratories.
    The Korn shell was derived from the Bourne shell by adding many features from
    the C shell along with new features of its own. Table 2.1 compares the features
    of the three shells.


    # Table 2.1: Features of Solaris 8 shells.


    | Feature | sh | csh | ksh | Function |

    | --- | --- | --- | --- | --- |

    | Aliasing | No | Yes | Yes | Lets you assign a shell, simple name to a complex
    string and then use the name in place of the string in commands. Doing so gives
    the appearance of being able to add custom commands to the shell. |

    | Bourne shell compatible syntax | Yes | No | Yes | Because the Korn shell is
    an enhanced version of the Bourne shell, they use the same syntax. The C shell
    was developed separately, and its syntax is based on the C programming language.
    |

    | Default prompt | $ | % | $ | The default prompt for both the Bourne and the
    Korn shells is the dollar sign ($) character, whereas the default prompt for the
    C shell is the system hostname followed by the percent (%) character. |

    | History capability | No | Yes | Yes | The history capability of the C and the
    Korn shells keeps track of a user-defined number of previous commands. Instead
    of reentering a command, you can copy it from the history and then execute it.
    |

    | History editing | No | Yes | No | Lets you modify and reuse previous commands.
    |

    | History execution | No | !n | fc | Repeats the previous command with few keystrokes.
    For csh, n is the number of the command in the history list. |'
