- img_proc: true
  md: '# # Scheduling Processes


    Two commands are available for scheduling automatic execution of processes: cron(1M)
    and at(1).


    # ## The cron Command


    The **cron** is a daemon started during system boot. It is responsible for executing
    commands at a future time and perhaps periodically on a scheduled basis. The commands
    to be executed are specified in a standardized tabular format and stored in files
    referred to as *crontab files*. These files are located under `/var/spool/cron/crontabs`
    directory.


    Commands that are executed automatically by being placed in a crontab file are
    referred to as **cron jobs**. Commands to be executed only once at a future time
    can be submitted using the **at** command instead of modifying crontab. The at
    command command is described in the next section.


    The two general classes of crontabs are system crontabs, which are owned by system
    accounts as root, lp, and so on, and user crontabs, which are created and maintained
    by nonadministrative user accounts.


    # ## Default cron Settings


    As with other system utilities, you can set parameters to control the behavior
    of the **cron** command. These settings are listed in the `/etc/default/cron`
    file.


    The **cron** command will log its activities in the `/var/cron/log` file if the
    following entry is contained in the `/etc/default/cron` file:

    CRLOG=YES


    This is default. To disable logging, change **YES** to **NO** and reboot the system
    or restart cron using the `/etc/init.d/cron run control (rc)` script.


    You can add two other entries to `/etc/default/cron`: **PATH**, which sets the
    **PATH** shell environment variable for cron jobs, and **SUPATH**, which sets
    the **PATH** shell environment variable for root cron jobs. The following lines
    shows the **PATH** and **SUPATH** settings:

    PATH=/usr/bin:/usr/ucb:

    ATH=/usr/sbin:/usr/bin:


    # ## Crontab Files'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'The /var/spool/cron/crontab directory contains both the system and the user
    crontab files. These files have the same name as the account name of the owner.
    For example, the crontab for the guest user account is named guest.


    The crontab file contains entries that specify a command to execute along with
    a time and frequency of execution. Commands can be executed daily, weekly, or
    monthly at any time of the day.


    A crontab entry consists of six fields separated by spaces or tabs. An asterisk
    (*) is used as a placeholder in a field that is not used. Table 7.5 lists the
    fields of a crontab entry.


    Table 7.5: The fields of a crontab entry.


    | Field | Values | Description |

    | --- | --- | --- |

    | minute | 0 through 59 | Minute of the hour |

    | hour | 0 through 23 | Hour of the day |

    | day | 1 through 31 | Day of the month |

    | month | 1 through 12 | Month of the year |

    | weekday | 0 through 6 | Day of the week (0 = Sunday) |

    | command | N/A | The command to execute |


    The following list shows the contents of a typical root crontab file:

    10 3 * * 4 /etc/cron.d/logchecker

    10 3 * * 0 /usr/lib/newsyslog

    15 3 * * 0 /usr/lib/fs/nfs/nfsfind

    1 2 * * * [ -x /usr/sbin/rtc ] && /usr/sbin/rtc -c

    30 3 * * * [ -x /usr/lib/clean ] && /usr/lib/clean


    Note that you can specify multiple values for a field by separating them with
    a comma, as shown in the weekday field in the crontab entry for logchecker. In
    this example, logchecker will be executed at 3:10 a.m. every Sunday and Thursday
    morning.


    # Exam Alert


    A critical skill for system administrators is the ability to understand and use
    crontabs to schedule log maintenance, system backups, and other routine maintenance.


    # Manipulating Crontabs


    You can use the crontab(1) command to create, list, edit, and delete crontabs.
    One capability of the crontab command (the ability to edit crontab of other users)
    is available only to the superuser.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'When crontab is executed without command-line arguments, it reads the standard
    input (typically the keyboard). When the command is terminated with Ctrl+D, the
    entered data is used to create the crontab (or overwrite an existing crontab)
    for the user account that executed the crontab. When a file name is specified
    as a command-line argument, the contents of the specified file are used to create/overwrite
    the user crontab.


    When you execute crontab with a -e command-line argument, the editor specified
    by the environment parameter EDITOR is invoked on the user crontab. If the EDITOR
    parameter is not set, the ed(1) text editor is used. This mechanism allows editing
    of the crontab associated with the invoking user account.


    The crontab -l command displays the contents of the user''s crontab, and the crontab
    -r deletes the user''s crontab.


    Exam Alert


    > When the cron daemon starts, it reads all existing crontabs. Because it does
    not read the crontab, it will not be aware of any changes unless they are made
    using the crontab command. The crontab command notifies the cron daemon that a
    crontab has changed or been added. The cron daemon then updates its information.


    The superuser can specify a user account name to control the crontab of another
    user account. This account name can be used with the -l or -r command-line argument
    to list or delete the crontab of another user account; however, do not specify
    a user account name with the -e command-line argument.


    Exam Alert


    > If the superuser attempts to modify the crontab of another user account by using
    the crontab -e command and specifying the user account name as a command-line
    argument, the results will be unpredictable. Instead, use the su(1) command to
    become the other user account and then use the crontab -e.


    # Access Control


    Access to the crontab is controlled by two files, cron.allow and cron.deny, both
    of which reside under the /etc/cron.d directory. These text files contain list
    of user account names (one per line) that are allowed or denied access to the
    command.


    Users are allowed access to the crontab if their user account name is listed in
    the /etc/cron.d/cron.allow file. If the cron.allow file does not exist, users
    will be allowed access if their user account name is not listed in the /etc/cron.d/cron.deny
    file. In addition, users will be denied access if neither file exists.'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'These rules also access apply to the root account if either the cron.allow
    or the cron.deny file exists. By default, the /etc/cron.d/cron.deny file is created
    and contains all inline nonadministrative user accounts. If neither file exists,
    only the superuser can submit jobs.


    Note that the usr/lib/cron directory is symbolically linked to the /etc/cron.d
    directory. Therefore, the crontab control file can be accessed using either path
    name. That is, /etc/cron.d/cron.allow or /usr/lib/cron/cron.allow and /etc/cron.d/cron.deny
    or /usr/lib/cron/cron.deny.


    # The at Command


    A simple way to execute one or more commands without modifying a crontab is to
    use the at(1) command. Commands submitted for later execution are grouped together
    as an at-job and are assigned an at-job


    The basic format of the at command is at time, time specifies the time at which
    the command(s) should be executed. You can specify the time using any combination
    of a.m./p.m. or 24-hour format, plus month and day in conjunction with the keywords
    now, today, tomorrow, and so on. The following listing shows several types of
    time specifications:


    ```

    at now

    at 10am

    at 2pm

    at noon

    at 3pm + 1 week

    at 3pm next week

    at 2am jan 24

    at 1400 tomorrow

    ```


    You can enter the command(s) to be executed from the standard input and end them
    with Ctrl+D, or you can use the -f command-line argument to specify a file they
    should be read from. The at-jobs are stored in the /var/spool/cron/at directories.


    The at command supports other command-line arguments to specify that the commands
    should be executed using the Bourne shell (-b), the C shell (-c), or the shell
    (-k) and whether the user should be notified by mail when the command is executed
    (-m). The crontab command, the at command supports the -l and -r command-line
    arguments and allows at-jobs to be listed and removed by at-job ID.


    The batch(1) command is equivalent to at -m now and allows a batch job to be entered
    by means of the standard input.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'Use of the at and batch commands is controlled by the /etc/cron.d/at.allow
