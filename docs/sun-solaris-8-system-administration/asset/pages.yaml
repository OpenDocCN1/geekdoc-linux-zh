    # # Network Information Service (NIS)


    NIS, like other network applications, follows the client/server architecture model.
    This section of the chapter describes the components of NIS, how to configure
    these components, and how to add and update NIS maps.


    # ## Components


    NIS consists of a master server, possibly slave servers, and one or more clients.
    The servers store maps and make the information contained in the maps available
    to clients on request.


    # ## Maps


    NIS stores information in a set of files called *maps*, which are two-column tables.
    The first column is used as a key, and the second column is the information associated
    with that key. Because the maps are organized by key, the same information might
    appear in more than one map. For example, host and associated IP addresses appear
    in two maps: hosts.byaddr (where the hostname is the key and the IP address is
    the information). Table 19.3 lists the NIS maps. The maps are physically located
    under `/var/yp/` directory with several other NIS files.


    | Keyword | Maps | Description |

    |---|---||

    | aliases | mail.aliases, mail.byaddr | Mail addresses and aliases |

    | bootparams | bootparams | Location of root, swap, and dump partitions for diskless
    workstations |

    | ethers | ethers.byaddr, ethers.byname | Ethernet addresses of systems |

    | group | group.bigid, group.byname | Group name, group ID (GID), and member information
    |

    | hosts | hosts.byaddr, | Hostnames and network |'
  merge: -1
  pgno: 367
