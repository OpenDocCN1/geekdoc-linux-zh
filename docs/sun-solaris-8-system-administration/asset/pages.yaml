    ```


    # The dmesg Command


    The dmesg command collects and displays diagnostic messages from the syslog (typically

    /var/adm/messages). These messages are generated during system boot and instance

    names (and physical names) to identify devices. The following listing shows a
    partial output from

    thedmesg command:


    ```

