    # Modifying a Group Using the groupmod Command


    The groupmod(1M) command is used to modify an existing group account. The command-line
    arguments are identical to the groupadd command-line arguments, except that you
    specify the new group account name using -n name if the group account name is
    being modified. The following example uses groupmod to change the group newgroup
    to ngroup:


