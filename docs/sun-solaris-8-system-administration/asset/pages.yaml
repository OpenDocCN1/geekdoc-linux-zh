    | Option | Description |

    | --- | --- |

    | hard | If the server does not respond, continues to try to mount the resource
    |

    | intr | Allows keyboard interrupts to kill the process while waiting on a **hard**
    mount |

    | nointr | Does not allow keyboard interrupts to kill the process while waiting
    on a **hard** mount |

    | public | Specifies a public file handle |

    | retrans=n | Retransmits NFS requests **n** times |

    | retry=n | Retries the mount operation **n** times |

    | ro | Mounts resource read-only |

    | rw | Mounts resource read/write |

    | soft | If the server does not respond, returns an error and exits |

    | timeout=n | Sets the NFS time-out to **n** tenths of a second |


    The following listings use the **mount** command to mount the /export/home file
    from the sun system on the /sun_home mount point. The resource is soft (1,000
    attempts) with read-only access:


    ```

    # mount -F nfs -soft, retry=1000, run sun:/export/home /sun_home #

    ```


    If you use the mount command without any command-line arguments, all mounted file
    systems (standard Solaris systems and NFS resources) are displayed.


    # **The mount Command**


    The unmount command is used to unmount local file systems and remote NFS resources
    so that local users can no longer access them. For NFS, you specify one or more
    *system.pathname* pairs (or file system points) that are currently mounted as
    command-line arguments.


    Two other command-line arguments are supported. The first is **-V**, which displays
    instead of executes the command line used to perform the mount (used to verify
    the command line). The second is the **-a**, which performs parallel unmount operations
    if possible.


    The following listings use the **unmount** command to unmount /export/home file
    system being shared by the **solaris** host:


    ```

    # unmount solaris:/export/home

    ```'
