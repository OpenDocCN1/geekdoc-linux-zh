    # Removing a Patch


    The patchrm command is used to remove or back out a patch by specifying the patch
    number as a commandline argument. The system configurations supported by the patchadd
    command are also supported by the patchrm command. You also use the -C, -R, and
    -S command-line arguments, as previously described. For example, to remove patch
    110906-01 from the bootable root image of a diskless client named client5, you
    can use the following patchrm command:

    patchrm -R /export/root/client5 110906-01


    Because the backup directory could have been changed during installation using
    the -B command-line argument to the patchadd command, the patchrm command also
    supports the -B argument.


    In addition, you can force the patchrm command to remove a patch that has been
    superseded by another patch using the -f command-line argument.


    You can reinstall installed patches and return the system to the state it was
    in before the patch was installed as long as the following conditions are met:


