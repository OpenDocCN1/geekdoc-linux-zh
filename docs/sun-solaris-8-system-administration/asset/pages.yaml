    host

    adters, graphic accelerators, network interfaces, and keyboard/mouse components.
    If the

    system does not have a CD-ROM drive or cannot be booted from the CD-ROM drive,
    a floppy disk

    drive is required.


    Solaris 8 requires a minimum of 64MB of memory. The recommended space for the
    smallest

    Solaris 8 software group (End-User System with 32-bit support) is 1.6GB of hard
    disk space. For

    the largest software group (Entire Distribution), 2.4GB of hard disk space is
    recommended. Either

    a CD-ROM drive or the appropriate environment for a network installation is required.'
