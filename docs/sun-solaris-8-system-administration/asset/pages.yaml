  md: '# Removing Directories Using the rmdir or rm Command


    Either the rmdir(1) or rm(1) command can be used to remove directories. The rmdir
    command removes the directories specified as one or more command-line arguments
    (separated by spaces). If a directory contains files or other directories, then
    the remove will fail. If the -p command-line argument is specified, then all parent
    directories that are empty also be removed. The -s command-line argument is used
    to suppress error messages. For example:


    ```

    # rmdir /test/Solaris/8

    # ls -IR /test

    #test:

    total 2

    drwxr-xr-x 2 root other 512 Apr 13 19:15 Solaris

    ```


    ```

    /test/Solaris:

    total 0

    ```


    ```

    # rmdir -p /test/Solaris

    # ls -lr /test

    /test: No such file or directory

    ```


    The rm(1) command also removes one or more directories specified as command-line
    arguments (separated by spaces). Directories can be removed only if the -R or
    -r command-line argument is specified. Either of these command-line arguments
    will recursively remove all files and directories under the directory being removed.
    Note that you can use the rmdir command to remove parent directories (directories
    above the directory being removed). For example:


    ```

    # mkdir /test/Solaris/8

    # rm /test

    rm: /test is a directory

    ```


    ```

    # rm -lr /test

    /test: No such file or directory

    ```


    The -i command-line argument provides interactive control over the remove command:


    ```

    # mkdir -p /test/Solaris/8

    ```


    ```

    # rm -r -i /test

    rm: examine files in directory /test (yes/no)? y

    ```'
