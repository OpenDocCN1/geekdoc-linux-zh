    # Extended File Permissions: Access Control Lists


    Solaris 8 extends the Unix file permissions by adding an Access Control List (ACL)
    capability. ACLs let you add permissions for specific users and groups along a
    default permission (mask).


    In addition to supporting the standard read/write/execute permissions for the
    standard file user account (owner), ACLs can be used to read/write/execute permissions
    for additional user accounts. Likewise, ACLs support read/write/execute permissions
    for the standard file group account and allow read/write/execution permissions
    for additional group accounts. ACLs support read/write/execution permissions for
    the standard others (everyone else).


    ACLs also include a mask capability that controls the maximum allowed permissions
    given to user and groups other than the standard file user account and the standard
    file group account.


    For example, suppose root owns a file and sets its ACL mask to read/execute. Later,
    root adds read/write/execute permission to the file ACL for the guest user account.
    Because of the mask, the write permission is overridden, and the effective permissions
    for the guest account are read/execute.


    The ACL for a directory includes default entries that determine the permissions
    assigned to files and subdirectories created under the directory. Default permissions
    can be defined for the standard Unix user, group, and other along with a default
    mask and default permissions for specific users or groups.


    Two commands are used to manage ACLs: The setfacl command sets ACLs, and the getfacl
    command displays ACLs.


    Exam Alert


    Use of the setfacl command to add, modify, and delete ACLs on files and directories
    is a capability that is test objective.


    # Setting ACLs Using setfacl


    You use the setfacl(1) command to set and modify ACLs. It supports three command-line
    arguments:


    +   - -d—Deletes the specified ACL entry


    107'
