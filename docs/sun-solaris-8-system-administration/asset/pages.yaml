    # Remote Login


    Two commands provide the ability to log in to a remote system as a local user
    over the network. These are the telnet command and the login command.


    # The telnet Command


    The telnet command is used to log remotely to a system over the network. The user
    must provide a valid user account name and password on the remote system, because
    the telnet command uses standard Unix login/password authentication.


    The hostname or IP address of the remote system is typically specified as a command-line
    argument. If this is not specified, the telnet command is placed in an interactive
    mode. The remote system prompts for a user account name and password. The following
    example uses the telnet command to log in to the remote system solaris8 using
    the dia user account name:


    ```

    $ solaris8

    Trying 192.168.99.8...

    Connected to solaris8.

    Escape character is '' ''

    ```


