    +   4. The ypinit command will prompt for one or more NIS servers. Enter the hostnames
    of the closest NIS servers. This step completes the client setup.

    5. Add an entry for the NIS master server to the /etc/hosts file.

    6. If the ypbind(1M) command is running, stop it by using the following command:


