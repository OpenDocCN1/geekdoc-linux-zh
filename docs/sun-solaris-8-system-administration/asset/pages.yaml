  md: '# # Chapter 21: Over-the-Network Installation and JumpStart


    Terms you’ 11 need to understand:


    +   - Installation phase

    - Installation method

    - Software packages, clusters, and groups

    - Over-the-network installation

    - Install server

    - Boot server

    - Custom JumpStart

    - JumpStart rules file and profile files


    # # Techniques you’ 11 need to master:


    +   - Installing systems

    - Preconfiguring system installation information

    - Setting up and using over-the-network installation

    - Setting up a JumpStart configuration directory


    The first part of this chapter covers concepts and terms related to system installation,
    specifically over-the-network installation. Some of this information was covered
    in Chapter 3 as it pertain to the exam objectives for Part I exam. Some of the
    information in Chapter 3 is repeated here with a slightly different emphasis.


    The second part of this chapter covers automating over the network installation
    using the JumpStart feature. The JumpStart - Automatic Installation test objectives
    are covered by this chapter.


    # # Server Installation


    This section includes the phases of an installation, the software configurations
    that can be installed on a system, and over-the-network installation.


    # # Installation Phases'
  merge: -1
  pgno: 387
- img_proc: true
  md: 'Installation consists of three phases: The system configuration phase identifies
    the necessary system information, the system installation phase copies the software
    onto the system, and the post-installation phase updates system software as required.


    # System Configuration Phase


    During the system configuration phase, basic information about the system, such
    as hostname and domain, is identified. Optionally, this information can be set
    ahead of time, or preconfigured. You can use two methods to preconfigure system
    information. The first uses sysidcfg file, and the second uses a name service.


    Exam Alert


    > If a system is not preconfigured, the sysidtool(1M) is executed during installation
    to prompt for the information. The sysidtool consists of five programs: sysidnet,
    sysidnis, sysidys, sysroot, and sysidpm.


    # System Installation Phase


    During the system installation phase, the selected Solaris 8 software group (covered
    later in this chapter) is installed using one of the four methods:


    +   - SunInstall (standard interactive installation)

    - Web Start

    - JumpStart

    - Custom JumpStart


    The two interaction methods (SunInstall and Web Start) are Part I exam objectives
    and were discussed in Chapter 3. The two automatic installation methods (JumpStart
    and custom JumpStart) are Part II exam objectives and are described later in this
    chapter.


    Exam Alert


    > All four of these installation methods can use over-the-network installation
    as described later in this chapter. However, exam 310-012 only addresses over-the-network
    installation in terms of its with JumpStart.


    # Post-Installation Phase


    During the post-installation phase, any appropriate patches are installed, along
    with any separately purchased applications. In addition, any custom configurations,
    such as user accounts and environments, are applied to the system. Typically,
    security hardening is also performed during the post-installation phase.


    # Preconfiguring System Information'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'As previously described, during the system configuration phase, basic information
    about the system (such as hostname and domain) is identified. This information
    can be defined in the sysidcfg file, in the service name being used (NIS or NIS+),
    or manually during an interactive dialog.


    # Using the sysidcfg File


    To use the sysidcfg file method, you create a file for each system containing
    a set of lines in the form `keyword=value`, such as `timezone=US-CENTRAL`. The
    file can be enabled over the network via Network File System (NFS) or on disk
    mounted in the local diskette drive.


    The following information can be defined in the sysidcfg file:


    +   * Name service (NIS, NIS+, DNS, or none), along with the hostname and Internet
    Protocol (IP) address of the server

    * Domain name

    * Network interface (enable use of DHCP or specify IP address and mask; enable
    IPv6)

    * Root password

    * System locale

    * Terminal (keyboard, mouse, monitor, and graphics card type)

    * Timezone (timezone and timeserver)


    # NIS


    For the name service method, entries for each system are added to the Network
    Information Service (NIS) or Network Information Service Plus (NIS+) database.
    Name services are described in Chapter 19.


    The following system definition information can be defined using NIS/NIS+:


    +   * Name service (implied)

    * Hostname and IP address

    * System locale

    * Timezone (timezone and timeserver)


    Exam Alert


    A lot of information can be defined in the sysidcfg file that cannot be defined
    in a name service, including the domain name, most of the network interface parameters
    (netmask, DCHP usage, and IPv6 usage), the root password, and terminal information
    (monitor, keyboard, mouse, and so on).


    The system locale (specific language and region) is stored in the /etc/locale
