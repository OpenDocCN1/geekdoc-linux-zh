  md: 'To start the NIS slave server, either reboot the system or repeat Steps 6 and
    7.


    Only the maps generated on the master server are copied to the slave server. The
    original files used to generate the maps reside only on the master server.


    # NIS Client


    You can configure a system as an NIS client using the following procedure:


    +   1. If necessary, use the **domainname** command to set the domain name.

    2. Update the /etc/nsswitch.conf file to use NIS by copying the /etc/nsswitch.template
    file to it or by manually editing the appropriate configuration.

    3. Log in the system as the root account and run the **ypinit** command as shown
    here:


    ```

    ypinit -c

    ```


    The **ypinit** command will prompt for one or more NIS servers. Enter the hostnames
    of the closest NIS servers.


    # Updating and Adding NIS Maps


    Updating one of the default maps (one automatically generated when the master
    server is configured) is fairly straightforward. Edit the source file, and then
    execute the **make**(1) command from the /var/yp directory. The name of the map
    being updated must be specified as a command-line argument to the **make** command.
    The **make** command updates the map and automatically updates the map to any
    slave servers. The following list shows the commands used to update the maps and
    propagate them to slaves:


    ```

    # cd /var/yp

    # make hosts

    ```


    To add a new map (referred to as a **nonfault map**), create a file in the /var/yp
    directory on the master server with the appropriate information. Then, run the
    **makeddb**(1M) command to add the map. The **makeddb** expects two command-line
    arguments: the name of the source file and the name of the map that should be
    created. The **ypxfr**(1M) command is used to distribute a new map that does not
    currently exist on the slave servers. The name of the new map is specified as
    a command-line argument. Create the new map, apps, from the apps.txt file:


    ```

    # cd /var/yp

    # makeddb apps. txt apps

    # /usr/lib/nssvc/yp/ypxfr

    ```'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'To update and propagate a nondefault map, edit the source file, and then run
    the makedbm command to rebuild the map. To propagate the updated map, use the
    yppush(1M) command and specify the map name as a command-line argument. The following
    lines rebuild the apps from the apps./var/yp source file and propagate it to the
    slave servers:


    ```

    # cd /var/yp

    # makedbm apps.txt apps

    # /usr/lib/netsvvc/yp/yppush apps

    ```


    # Verifying the NIS Configuration


    Several commands provide access to NIS information. You can use these commands
    to verify a client configuration and check the contents of the maps. Consult the
    System Reference Manual for additional details:


    +   - ypcat(1)—Lists the contents of the specified map.

    - ypmatch(1)—Returns data that matches the specified key from the specified map.

    - ypwich(1)—Returns the name of the NIS server or map master. When used with the
    -m command-line argument, the ypwich command returns a list of all available maps.


    # Network Information Service Plus (NIS+)


    NIS+ is similar to NIS but provides additional features. In addition to providing
    centralized administration and access to domain data, it also supports a hierarchical
    domain that can be configured to reflect the structure of an organization. NIS
    provides no authentication, NIS+ provides Data Encryption Standard (DES) authentication.
    Whereas NIS deiras propagates updated information in a batch mode, NIS+ propagates
    incremental updates immediately. Like NIS, NIS+ supports the option of redundant
    servers (referred to as replicas). These replicas provide load balancing and alternate
    servers in case the master NIS server fails.


    Whereas NIS stores its data in files referred to as maps, NIS+ stores its data
    in files referred to as tables. NIS+ provides tables for all the data stored in
    NIS maps, plus additional tables for credential, time, and automount information.
    Table 19.4 lists


    Table 19.4: NIS+ tables.


    | Table | Description |

    | auto_home | Location of users'' home directories |

    | auto_master | AutoFS map information |

    | bootparams | Location of root, swap, and dump |'
