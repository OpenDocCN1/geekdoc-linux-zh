    When a removable drive connects, Linux creates a “mount point” for that drive.
    A mount point is a virtual directory created in the filesystem for a removable
    drive. That directory usually receives the name of the drive''s volume label.
    So if you plug a flash drive with a volume label of `USBDRIVE` into your computer,
    Linux will create a directory named `USBDRIVE` for it. The `USBDRIVE` directory
    will correspond to the top directory on the flash drive, and you can move files
    to and copy files from it just like any other directory.


    Where do these mount points end up in the filesystem? Most Linux distributions
    have a `/media` directory to store mounted external drives. To return to our previous
    example, the `USBDRIVE` flash drive would show up in the filesystem as `/media/USBDRIVE`.
    For GUI interfaces, an icon representing the removable drive will show up on the
    desktop, but that icon will lead to the removable drive''s mount point in `/media`.


    Some Linux distributions use the `/mnt` directory, and a few even use `/Volumes`,
    but most distributions use the `/media` directory for mount points.


    ## DIFFERENT KINDS OF FILESYSTEMS


    Whether or not you can read or write to removable media depends upon the kind
    of filesystem installed on the drive.


    We''ve already described a filesystem as means of organizing information on a
    disk, and noted that “the filesystem” is often a shorthand term of describing
    the hard drives in a Linux system. While a filesystem may be a method of organizing
    information on a disk, there are nonetheless different kinds of filesystems. We''ll
    take a look at a few of them in this section.


    Hard drives in a Linux system are most commonly formatted with the `ext3` or `ext4`
    filesystems. Both `ext3` and `ext4` are journaled filesystems, which mean they
    keep track of changes before writing them to disk, which helps prevent errors.
    The `ext3` filesystem supports volumes up to 32 terabytes in size, with a maximum
    size limit of two terabytes for individual files. The `ext4` filesystem supports
    volumes up to one exibyte in size and files of up to 16 tebibytes in size.


    If you plug an external hard drive into your Linux system, it might come formatted
    with the `NTFS` file system. `NTFS` is the default file system used with Windows
    computers. Most Linux distributions have the ability to read files on an `NTFS`
    volume, but not to write to them. If you plug an `NTFS` volume into your Linux
    computer, you''ll probably be able to copy files from it, but you won''t be able
    to write files to it.


    The other major filesystem you are likely to encounter is the `FAT` file system.
    An older filesystem, `FAT` is generally not used on internal hard drives any longer,
    since its maximum possible size is four terabytes, and it does not support any
    files larger than four gigabytes. However, both Linux and Windows can read from
    and write to `FAT` disks. So it is common for smaller external hard drives and
    USB flash drives to be formatted with `FAT`.


    ## DIFFERENT KINDS OF REMOVABLE MEDIA


    You will encounter a few different kinds of removable media.


    At the start of the 2000s, floppy disks were still quite common. Most floppy disks
    were the hard plastic 3 ½ inch disks, and could store 1.44 megabytes of data.
    This is not a lot of data by modern standards, and floppy disks were comparatively
    fragile and small. They have since been superseded and made obsolete by external
    hard drives, USB flash drives, and Internet-based storage systems, and are no
    longer manufactured.


    External hard drives have become commonly and comparatively cheap. They usually
    connect to your computer via a USB cable. They come formatted with `NTFS` or the
    `FAT` file system. You can reformat an `NTFS` hard drive to `FAT`, or to `ext3`
    or `ext4`, though this means a Windows system will not be able to recognize the
    drive.


    USB flash drives are the most common type of removable media – they''re cheap,
    easy to transport, and can hold a large amount of document files (though not very
    many music or video files). They''re almost always formatted with `FAT`, so you''ll
    have no trouble reading and writing files to them from a Linux system.


    ## Chapter 21 - Commands For Working With Removable Media


    The primary purpose of removable media is to move files on and off your computer.
    Most of the commands you''ll actually want to use with removable media – `cp`,
    `rm`, `mkdir`, and so forth – we''ve already covered in this book. There are a
    few commands specific to analyzing disks and space usage that will prove useful
    when dealing with removable media. In this chapter, we''ll show you how to use
    those commands.


    ### FIND DISK SPACE USAGE


    You will often have to calculate how much empty space remains on your disks, whether
    your removable media or your system''s main hard drive. Granted, for a home computer,
    monitoring hard drive space usage isn''t as critical as it used to be. Modern
    hard drives are enormous, and getting larger all the time. That said, certain
    kinds of multimedia files, such as video files, can quickly fill up a hard disk,
    and USB flash drives often will possess only a few gigabytes of space.


    Fortunately, there''s a quick and easy way to calculate just how much space you
    have left on your disks with the `df` command. To use it, simply type `df` at
    the prompt:


    ```bash

    df

    ```


    The output will look something like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_2912120f.jpg)


    As you can see, the `df` command displays the space usage for every single filesystem
    attached to your system. The main hard drive on your computer will show up as
    `/dev/sda1`. Any partitions on the drive (whether hard drives or USB disks) showing
    up as `/dev/sdb1`, `/dev/sdc1`.


    By default, `df` displays the usage in bytes. Unless you''re quite good at mental
    math, this is a difficult way to figure out how much space is using. To get an
    easier display to read, use `df` with the `-h` option:


    ```bash

    df -h

    ```


    The output will now look like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_535272e1.jpg)


    With the `-h` option, `df` displays the output in gigabytes or megabytes, depending
    upon how large the disk is.


    You can also use the `df` command to find out what type of filesystem you have
    on your disks. To do so, use `df -h` with the addition of the `-T` option:


    ```bash

    df -th

    ```


    This will include the type of filesystem in the output:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6Dmx_html_3327e240.jpg)


    You can see that `df` now indicates the type of filesystem underneath the “type”
    column.


    ### FINDING THE SIZE OF FILES AND FOLDERS


    Now that you know how to find the space usage on your system''s drives, you might
    want to know what, exactly, is taking up all that space on your hard disk. You''ll
    remember that the `ls -l` command lists the sizes of files in the current directory,
    and `ls -lh` displays the file sizes in megabytes and gigabytes. However, `ls
    -l` or `ls -lh` does not display the size of directories (and all the files contained
    in the directory). Because directories are technically also files in the Linux
    filesystem, the `ls -l` command only displays the size of the file marking the
    directory''s existence, which is always four kilobytes.


    To find the exact size of a directory, and all its subdirectories, use the `du`
    command. In its default state, the `du` command displays the size of all the files
    in the current working directory. However, combined with the `-s` and `-h` options,
    `du` will display the entire size of the targeted directory. For instance, to
    calculate the size of the `/var` directory and all its subdirectories, you would
    use `du` with these options:


    ```bash

    du -sh /var

    ```

