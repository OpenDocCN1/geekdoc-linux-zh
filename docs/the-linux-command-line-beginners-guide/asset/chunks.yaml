    （注意，你需要 root 权限才能向系统添加用户账户，我们将在第 6 章和第 7 章详细讨论使用 root 权限。）


    此命令将添加 `camalas` 用户账户。然而，不带任何选项的 `useradd` 命令并没有大用。该命令创建了 `camalas` 用户账户，但它没有为其分配显示名称，没有为
    `camalas` 创建家目录，也没有设置其他重要选项——例如，它忽略了为该账户分配默认 shell。


    我们需要添加一些选项使 `useradd` 更加有效。首先，使用 `-m` 选项为 `camalas` 账户创建一个家目录：


    ```

    useradd -m camalas

    ```


    `-m` 选项将在 `/home` 目录下为 `camalas` 添加一个家目录。接下来，你可能想使用 `-s` 选项为该账户设置默认 shell：


    ```bashuseradd -m -s “/bin/bash” camalas

    ```


    这将 `bash` shell 设置为 `camalas` 账户的默认 shell。`useradd` 账户还有一个最后一个开关——`-c` 选项，用于将账户的显示名称设置为“Caina
    Amalas”。


    ```bashuseradd -c “Caina Amalas” -m -s “/bin/bash” camalas

    ```


    通过这三个选项，`useradd` 命令创建了一个名为 `camalas` 的新账户，将账户的显示名称设置为 Caina Amalas，在 `/home`
    中为该账户创建了家目录，并将 `bash` 设置为账户的默认 shell。最后，你只需要使用 `passwd` 命令为账户设置密码：


    ```bash

    passwd camalas

    ```


    （那不是拼写错误——正确的命令实际上是 `passwd`，而不是 `password.`。）


    `camalas` 账户现在准备好使用了。请注意，要更改另一个用户的密码，你需要以 root 身份或具有 root 级权限运行 `passwd`。


    # 修改用户账户


    一旦你创建了用户账户，你可能需要对其进行修改。在本节中，我们将首先描述如何更改用户账户密码，以及如何修改、锁定和其他更改现有的用户账户。


    ## 修改密码


    更改你自己的用户账户密码非常简单。只需输入 `passwd` 命令即可：


    ```bash

    passwd

    ```


    你将收到一个提示，要求输入当前密码。输入密码后，命令将提示你输入新密码，然后再次提示确认。你的新密码将被设置。


    要重置另一个用户的密码，你仍然使用 `passwd` 命令。请注意，为了更改另一个用户的密码，你必须是 root 用户或以 root 级权限运行程序。正如我们在上一节中提到的，要更改
    `camalas` 账户的密码，你会使用此命令：


    ```bash

    passwd camalas

    ```


    你不需要知道 `camalas` 的当前密码。只需在提示时输入两次新密码，命令就会更改 `camalas` 账户的密码。


    ## 锁定和解锁账户


    有时你可能会发现有必要锁定账户以防止用户登录。这在用户行为不当或滥用其计算机权限时经常发生。从不那么负面的角度来说，如果你的一位合同工合同到期，但公司计划在几个月后重新雇用，也会发生这种情况。要这样做，你将使用
    `usermod` 命令，它就像用户账户管理中的瑞士军刀。要锁定 `camalas` 用户账户，请使用带有 `-L` 开关的 `usermod`：


    ```bash

    usermod -L camalas

    ```


    （再次提醒，要使用 `usermod` 命令的任何功能，你都需要 root 权限。另请注意 `-L` 开关必须大写——记住 Linux 命令行是区分大小写的。）


    这将锁定账户，使 `camalas` 无法登录。要解锁账户，请使用带有 `-U` 开关的 `usermod`。（注意 `-U` 必须大写。）


    ```bash

    usermod -U camalas

    ```


    `camalas` 账户将被解锁。


    ## 修改用户名


    对个人用户账户需要进行的另一个常见更改（除了更改其组组成外，我们将在第 9 章和第 10 章中讨论）是更改用户账户名称。最常见的原因是女性结婚后更改姓氏。继续我们之前的例子，假设
    Caina Amalas 嫁给了一个姓 Maraeus 的男人，并将名字改为 Caina Maraeus。她现在想将用户名更改为 `cmaraeus`，并将显示名称更改为
    Caina Maraeus。


    你可以通过 `usermod` 命令完成这两项任务。


    要将账户用户名从 `camalas` 更改为 `cmaraeus`，请使用带有以下选项的 `usermod`：


    ```bash

    usermod -l cmaraeus camalas

    ```


    这将账户的用户名从 `camalas` 更改为 `cmaraeus`。将 `cmaraeus` 放在 `camalas` 之前似乎很奇怪，但否则命令将不起。


    要更改 `camalas` 账户的显示名称，使用带有 `-c` 开关的 `usermod` 命令：


    ```bash

    usermod -c “Caina Maraeus” camalas

    ```


    （注意，如果你已经将账户更改为 `cmaraeus`，请确保使用该名称。）


    账户的显示名称将变为 Caina Maraeus。


    # 删除用户账户


    最后，有时你可能会发现有必要删除用户账户。也许某个员工永久地离开了公司，或者某个员工不再需要访问系统。大多数情况下，锁定用户账户比完全删除它是更好的主意，毕竟也许该员工未来还会回来。但如果你必须删除用户账户，可以使用
    `userdel` 命令。如果你想删除 `camalas` 账户，命令如下：


    ```bash

    userdel camalas

    ```


    （注意你必须以 root 登录才能删除账户。）


    这将删除 `camalas` 账户，但不会删除家目录。如果你确定不再需要该账户或其文件，可以使用此命令删除账户及其文件夹：


    ```bash

    userdel -r camalas

    ```


    ***


    ## 第 7 章 - 概念：root 用户


    我们已经多次提到 root 用户。在本章中，我们将仔细查看 root 用户及其功能。在接下来的章节中，我们将展示如何安全地使用 root 而损坏系统。


    ### 什么是 root 账户？


    root 账户被称为超级用户账户，是 Linux 系统中权限账户。root 权限访问、修改和删除任何文件。root 用户还可以安装和卸载程序、修改系统设置并更改文件的所有权（我们将在第
    11 章和第 12 章详细讨论所有权）。


    这个名字源于早期 UNIX——root 用户是唯一可以更改根目录的用户，因此这个术语沿到了超级用户。


    root 用户在 `/etc/passwd` 中的项通常如下：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m780819d.jpg)


    root 账户的 `UID` 始终为 0，组 ID 为 0。root 的直接目录通常是 `/root`。


    ### 安全使用 root 账户


    如果你是 Linux 系统的管理员，将 root 账户作为日常账户可能很有诱惑。毕竟，如果你在执行系统任务，迟早会需要 root，那么为什么不把它作为主账户呢？不要屈服这种诱惑。超级用户账户对系统的每个方面都有控制权，即使是
    root 发出的命令中一个简单的拼写错误可能是毁灭性的。最好的做法是创建一个标准用户账户，仅在需要时使用 root。


