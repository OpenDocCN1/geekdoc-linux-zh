    The bash shell''s behavior is governed by a number of hidden files located in
    your home directory. (In Linux, files are “hidden” when their names are prefixed
    with a period character. While this does not protect them from deletion or modification,
    they don''t show up in regular directory listings.) For a new user, it''s generally
    best to avoid modifying these files. Once you have more experience, you might
    want to experiment with modifying them.


    The first file is `~/.bash_history`. This is where bash stores the information
    used in the command history feature. It is a plain text file, so you can view
    it with a number of commands we''ll discuss in Chapter 16.


    The second file is `~/.bash_profile`. This stores the individual settings for
    your bash settings, including the configuration of the prompt text itself. If
    you want to customize your bash prompt, you can do so here.


    # OUTPUT PIPING AND REDIRECTS


    The bash shell also offers two features called “output piping” and “output redirects.”
    Basically, this lets you take the output from a command and either hand it over
    to another command for processing, or to store it in a text file. This can become
    quite complicated, but we''ll look at a few common uses.


    ## Piping


    Piping allows you to take the output from one command and move it to a second
    command for processing. For example, let''s say you wanted to use the `ls` command
    to view the contents of the current working directory. Furthermore, you want to
    use the `grep` text-sorting command to find every file named “cheese” in the directory.
    To use command piping, you would use the pipe character (`|`) to pipe the output
    from the `ls` command to the `grep` command:


    ```

    ls | grep cheese

    ```


    ## Output Redirection


    Output redirection allows you to use the greater than sign (`>`) to redirect the
    output from a command to a different location, usually a text file. For example,
    let''s say you wanted to use the `ls` command to look through the contents of
    the working directory, but you wanted to save the command''s output to peruse
    later. You can do that by using the `ls` command with a greater than sign to redirect
    the output:


    ```

    ls > list

    ```


    This will redirect the command''s output to a plain text file named `list`. If
    the file doesn''t exist, the command will create it on the spot in the current
    working directory. However, if the file does exist, the command will overwrite
    it completely with the new information. If you''re not careful, this can result
    in data loss.


    This data loss is easy to avoid. If you use a double greater than sign (`>>`),
    then the output from the command will be appended to the existing file without
    overwriting it. To expand on our previous example:


    ```

    ls >> list

    ```


    This version of the command will append the output from the `ls` command to the
    `list` file, keeping any data from getting overwritten.


    # FILE NAMES WITH SPACES


    The command line does not handle spaces in file names gracefully – let''s say
    you tried to use the `rm` command to delete a file named “Joe''s Term Paper.”


    ```

    rm Joe''s Term Paper

    ```


    This command would fail because the command line would interpret each word in
    the command as a separate file. To force the command line to view the file properly,
    enclose any filename with spaces within quotation marks:


    ```

    rm “Joe''s Term Paper”

    ```


    This time `rm` will delete the file.


    # CASE SENSITIVITY


    We will close this chapter with an important reminder: always remember that the
    Linux command line interface is case sensitive. That means the bash shell distinguishes
    between uppercase and lowercase characters. It will see three files named `Caina.doc`,
    `caina.doc`, and `CAINA.doc` as three different files. In addition, almost all
    Linux commands are in lowercase. If you intend to type `ls` to view the contents
    of the current directory, but accidentally type `Ls` instead, then the shell will
    not recognize the command and return an error message.


    This often confuses new Linux users, especially ones with backgrounds in DOS or
    Microsoft Windows. Neither DOS nor the Command Prompt application in Windows are
    case sensitive – unlike Linux, the Windows Command Prompt application would see
    `Caina.doc`, `caina.doc`, and `CAINA.doc` as the same file, and you can also type
    Windows commands in either uppercase or lowercase.


    This is not true with Linux. Always remember that the Linux command line interface
    is case sensitive.


    ***


    ## Chapter 3 - Concept: The Linux Filesystem


    To effectively use the Linux command line, you must first have a strong grasp
    of the underlying Linux file system. Without knowing how to copy, move, delete,
    and create files and directories from the command line, the Linux command line
    interface won''t be very useful. In this chapter, we''ll explain how the Linux
    filesystem works. In the chapter after that, we''ll demonstrate the commands you
    need to manage files and directories.


    # WHAT IS THE LINUX FILESYSTEM?


    If you''re old enough, you might remember when the term “filesystem” meant how
    an office organized its collection of manilla paper folders. For computers, a
    “filesystem” refers to how the information stored on a disk is organized, whether
    on a hard disk, a USB flash drive, or an optical disk like a CD-ROM or a DVD-ROM.
    (Or a floppy disk, if you''re unfortunate enough to have a computer that old.)
    In Linux, when people talk about the “filesystem”, they generally mean the file
    and directory structure on the main hard disk of the Linux system. In fact, in
    the most recent versions of Ubuntu Linux, clicking on the “File System” icon in
    the Nautilus file explorer shell will take you to the top directory of the main
    hard drive.


    The Linux filesystem is divided into files and directories, which we will discuss
    in the next section.


    # FILES AND DIRECTORIES


    If you''ve used a computer for any length of time, you''re already familiar with
    the term “file.” A computer file is, basically, a piece of information saved to
    long-term storage in a disk. Your documents, pictures, and music tracks are all
    files, and so are all the programs and applications you run on your computer (an
    elaborate application can sometimes consist of hundreds even thousands of files).
    Interestingly, in the Linux filesystem, various hardware devices are also represented
    as files, all stored in the `/dev` directory.


    A modern Linux system contain of thousands of files, and keeping those files organized
    can prove quite a challenge. Fifty thousand files in a single location would make
    it extremely difficult for either the operating system or the user to find anything.
    This is where the concept of a directory comes in handy. Directories allow you
    to separate files into separate virtual containers. Just as paper folders once
    allowed office workers to sort a single enormous pile of paper into a neatly organized
    system, so do directories allow you (and the operating system) to keep track of
    files.


    (Incidentally, the term “directory” and “folder” mean the same thing. So when
    you hear someone talk about accessing their Documents folder, they''re talking
    about the same thing as their Documents directory. Since most modern GUIs use
    a folder icon to represent directories, using the word folder to refer to a directory
    has become common practice.)


    You can, of course, put directories within other directories. These directories-in-directories
    are generally called subdirectories, and they too can have subdirectories of their
    own.


    You can best visualize the structure of the filesystem by using the `tree` command:


    ```

    tree

    ```


    This will display the filesystem as a tree, starting with the topmost directory,
    and working its way down the various subdirectories.


    Linux''s standard subdirectories have been pretty well defined for many years,
    but we''ll start by discussing the most important directory in the filesystem.


    # THE ROOT DIRECTORY

