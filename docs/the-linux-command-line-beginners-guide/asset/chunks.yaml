    menu and clicking on “New Tab.”


    Obviously a graphical terminal application will not work in the command-line environment.
    It is nonetheless possible to run multiple terminal windows from the command line
    using “virtual consoles”, which we will discuss in the next session.


    VIRTUAL CONSOLES


    A virtual console is, essentially, a second connection to the same computer. Remember
    that Linux was based upon UNIX, and most early UNIX machines were massive mainframe
    computers. To connect to those mainframes, users employed remote consoles or dumb
    terminals. Because UNIX was a multi-user operating system, multiple users could
