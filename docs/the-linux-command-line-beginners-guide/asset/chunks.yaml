    上一章解释了 Linux 文件权限的概念。在本章中，你将学习如何使用命令行来查看和修改文件权限。我们将向你展示如何查找文件的权限以及如何更改它们。


    # 确定文件的权限


    与确定文件的所有者和组所有权一样，你可以使用 `ls` 命令来查找文件的权限。在不带任何选项的情况下，`ls` 命令不会提供很多有用的信息。但通过 `-l`
    选项，该命令可以让你看到文件的权限。输出结果看起来像这样：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2e751004.jpg)


    各种文件和目录的权限位于命令输出的左侧——那些看起来是随机的 `r`、`w` 和 `x` 字符字符串。然而，一旦你知道了这些字符的含义，你就能一眼看出文件的权限。


    列表开头的 `-` 字符表示该项属于一个文件；如果那里是 `d`，则它属于一个目录。至于其他字符，`r` 代表读取（Read），`w` 代表写入（Write），`x`
    代表执行（Execute）。权限被重复三次可能看起来很奇怪，但并非如此——请记住，每个文件都为三类用户分配了权限。例如，如下所示权限字符串：


    `rwxrwxrwx camalas users`


    第一组 `rwx` 意味着文件的所有者（在此例下为 `camalas`）拥有读取、写入和执行权限。第二组 `rwx` 意味着所属组（`users` 组）拥有读取、写入和执行权限，而第三组则意味着其他人也获得了读取、写入和执行权限。简而言之，Linux
    系统上的每个人都可以读取、写入和执行该文件。


    让我们来看另一个例子：


    `-rwxrw-r-- 6 camalas users 4096 Dec 9 14:56 test.txt`


    在这个例子中，我们看到 `test.txt` 的所有者（用户账户 `camalas`）获得了读取、写入和执行权限。组获得了读取和写入权限，而其他人则只获得读取权限。


    如果权限冲突了怎么办？例如，如果 `camalas` 对某个文件只有读取权限，而其他人都有读取、写入和执行权限呢？在这种情况下，`camalas` 将获得该文件的全部读取、写入和执行权限。权限是“累加”的——这意味着你对文件的权限是由所有者权限、组权限以及其他其他账户权限“相加”而成的。即使你不是文件的所有者，也不是所属组的成员，只要最终权限类别具有读取和写入权限，你仍然可以查看和更改文件。


    # 修改权限


    那么，如何更改文件的权限呢？这是通过 `chmod` 命令完成的。（在 Linux 中，一个文件的总权限被称为“模式”，因此 `chmod` 的意思是“更改模式”。）一如往常一样，如果你想更改文件的权限，你需要是
    root 用户或使用 `sudo` 来借用 root 权限。`chmod` 命令同时使用字母和数字简写来表示各种权限。


    如果你想为文件的所有者添加执行权限，你可以像这样使用 `chmod`（注意在 `chmod` 中，`u` 代表所有者，`x` 代表执行权限）：


    ```

    chmod u+x test.txt

    ```


    如果你想为所属组添加执行权限，在 `chmod` 中用 `g` 表示：


    ```bash

    chmod g+x test.txt

    ```


    最后，如果你想为系统上的所有用户添加执行权限：


    ```bash

    chmod o+x test.txt

    ```


    （在 `chmod` 中，`o` 代表其他人（Others），即系统上的所有其他账户。）


    同时执行这三操作：


    ```bash

    chmod u+x,g+x,o+x test.txt

    ```


    或者，要移除权限，请将 `+` 替换为 `-` 符号：


    ```bash

    chmod u-x,g-x,o-x test.txt

    ```


    所有这些输入相当繁琐，不是吗？幸运的是，Linux 中的文件权限有数字代码——如果说是数学简写吧。读取权限分配数字 `4`，写入权限分配数字 `2`，执行权限分配数字
    `1`。没有权限用零表示。然后你通过加这些数字来计算权限。看这个例子：


    `-rwxrw-r-- 6 camalas users 4096 Dec 9 14:56 test.txt`


    文件的所有者（`camalas`）获得读取、写入和执行权限，所属组获得读取和写入权限，其他人获得读取权限。由于读取是 `4`，写入是 `2`，执行是 `1`，`camalas`
    获得的权限为 `7`。所属组 `users` 获得总计 `6`，其他人获得 `4`。权限随后可以用数字形式表示为：


    `764`


    要将权限设置为 `764`，你将使用 `chmod` 命令：


    ```bash

    chmod 764 test.txt

    ```


    这比输入 `764` 要简单得多，不是吗？


    或者要给所有者完全权限，同时拒绝组和所有人的权限，使用此命令：


    ```bash

    chmod 700 test.txt

    ```


    无需多说，这使得 `chmod` 命令的使用变得简单。让所有者读取、写入但不执行。


    ***


    ## 第 15 章 概念：文本文件


    在任何 Linux 系统上，你遇到的很多文件文本文件。在本章中，我们将解释什么是文本文件，以及为什么了解它们很重要。


    ### 什么是文本文件？


    文本文件正如其名，是一个包含纯文本且不再包含其他内容的文件。如果你从命令行查看该文件，你将能够读取它。


    系统上的许多文件要复杂得多。例如，`.doc` 文件是微软文档格式。它包含了数字形式的 Word 文。如果不使用 Word（或 LibreOffice 或可以读取
    Word 格式的程序）来打开 Word 文件，你只会看到垃圾。


    其他类型的文件也包含可读文本，但也包含大量的其他代码和格式。HTML 文件（网页文件）是这种文件的很好的例子。如果你从命令行查看 HTML 文件，你将能够读取它，但实际文本会包含大量的
    HTML 代码。毕竟，该文件设计用于在网络浏览器中显示，HTML 代码告诉浏览器文件应该长什么样。


    相比之下，纯文本文件不包含任何额外的格式或代码。只有纯的、未装饰的文本。


    ### 配置文件


    文本文件之所以重要，是因为几乎所有的配置文件（控制 Linux 操作系统及其系统服务行为的文件）都是纯文本文件。


    我们已经讨论过 `/etc/passwd` 和 `/etc/group` 文件，这两个控制 Linux 用户账户和组的组。这两个文件都是纯文本文件。使用某些命令，你可以从命令行查看它们。你甚至可以编辑它们，尽管编辑这些特定文件并不是好主意。

    '
- fmt: '

    However, despite the restrictions on `/etc/passwd` and `/etc/group`, you change
    most of the other system settings on Linux by editing text files. If you''re running
    a GUI interface, you can change system settings via a graphical interface, and
    very often server systems offer web interfaces for their programs. In the end,
    those programs are only graphical tools that edit the text files for you – you
    could just as easily edit those text files yourself.


    We''ve already mentioned the hidden bash shell configuration files in your home
    directory. If you use the `ls -a` command in your home directory, you will see
    several hidden files and folders. These are (almost) all text-based configuration
    files that govern your command-line session.


    Most system-wide configuration files are found in the `/etc` directory. We''ve
    already mentioned the `/etc/passwd`, `/etc/shadow`, `/etc/group`, and `/etc/gshadow`
    files, all of which control user accounts and groups, and all of which are located
    in `/etc`. You can find the configuration files for the vast majority of your
    system''s services and applications stored in `/etc` – either the files will be
    in `/etc` itself, or in a subdirectory within `/etc`.


    User applications generally do not store their configuration files in `/etc` –
    they tend to wind up in `/usr/lib`. However, the majority of system configuration
    files and system service configuration files are plain text files stored in `/etc`.
    This makes knowing how to view plain text files, and how to edit them, important.


    In the next to chapters, we''ll show you how to do just that.


    # Chapter 16 - Commands For Viewing Text Files


    In this chapter, we''ll show you how to view text files from the command line.
    Linux comes with numerous commands for viewing text files. All of them display
    text, but they each work a little differently, and some work better in certain
    situations than others. By the end of this chapter, you''ll be familiar with the
    most common ones.


    ## CREATING A BLANK FILE


    You may need from time to time to create a blank file into which you will later
    dump some text. It''s common to do this if you need to analyze the output from
    a command or a utility in greater detail, or to save it for later reference. Using
    the special output redirection greater than sign character (`>`) you can move
    the output from a command into a file. For instance, to redirect the output from
    the `ls -l` command to a file named `data`, the command would look like this:


    ```

    ls -l >> data

    ```


    You might want to first create the file, though. To create a completely blank
    file at the command line, use the `touch` command:


    ```bash

    touch data

    ```


    This will create a file named `data` in the current working directory.


    ## VIEWING TEXT FILES WITH THE CAT COMMAND


    The basic command for viewing a text file is the `cat` command – it displays the
    contents of the file on the screen, and if it''s too long to fit on the screen,
    the command simply scrolls down until it reaches the end of the file. To view
    a text file named `document.txt` in the current working directory, simply use
    the `cat` command like this:


    ```bash

    cat document.txt

    ```


    The output will display the contents of `document.txt`.


    You can also use the `cat` command with absolute, rather than relative, file paths.
    If the current working directory is your home folder, and you want to view the
    `config.txt` file in the `/etc` directory, you would use this command:


    ```bash

    cat /etc/config.txt

    ```


    This will display the contents of the `config.txt` file.


    Very often the contents of a text file are too large to fit on a single screen,
    and will go scrolling off the top before you can read it all. This is where the
    `more` command comes in handy. You can pipe the output from the `cat` command
    to the `more` command, which will then let you view the information one screen
    at a time. For example, if you wanted to view the contents of `document.txt` one
    screen at a time:


    ```bash

    cat document.txt | more

    ```


    This will display `document.txt`, pausing with every screen of information (you
    can press any key to continue).


    You can also search the output of `cat` for any specific term by piping it to
    the `grep` command. The `grep` command lets you search a stream of text output
    for specific terms. Let’s say you wanted to search `document.txt` for any instance
    of the word ‘cheese.’ To do so, you would pipe the output from `cat` to `grep`:


    ```bash

    cat document.txt | grep cheese

    ```


    This will list every instance of the word ‘cheese’ in the `document.txt` file.


    The `cat` command also has a few useful switches. If you want the output from
    `cat` to appear in numbered lines, you would use the `--b` switch:


    ```bash

    cat –b document.txt

    ```


    The `cat` command, combined with the `more` and `grep` commands, lets you quickly
    view files from the command line, and find desired search terms within the file.


    ## VIEW THE BEGINNING OF A TEXT FILE


    The `cat` file displays the entire contents of a text file, but sometimes you
    might want to see only the beginning of the file. To do so, you can use the `head`
    command, which by default only displays the first five lines of a text file. For
    instance, to view the first five lines of a text file named `test.txt` in the
    current working directory, you would use this command:


    ```bash

    head test.txt

    ```


    The output will display the first five lines of the file.


    The `head` command also works with absolute file paths. To view the first five
    lines of the `test.txt` file located at `/backup/test.txt`, use this command:


    ```bash

    head /backup/test.txt

    ```


    The `head` command also allows you to choose how many lines you want displayed.
    Let us say you wanted to only view the first three lines of the `test.txt` file:


    ```bash

    head -3 test.txt

    ```


    With that option, you can use `head` to view as many or as few lines from the
    beginning of a text file.


    ## VIEW THE END OF A TEXT FILE


    If the `head` command lets you view the beginning of a file, the `tail` command
    does the exact opposite – it displays the final five lines of a file. For instance,
    to view the final five lines of a text file named `test.txt` in the current working
    directory, you would use this command:


    ```bash

    tail test.txt

    ```


    The output will display the final five lines of the file.


    The `tail` command also works with absolute file paths. To view the final five
    lines of the `test.txt` file located at `/backup/test.txt`, use this command:


    ```bash

    tail /backup/test.txt

    ```


    The `tail` command also allows you to choose how many lines you want displayed.
    Let us say you wanted to only view the final three lines of the `test.txt` file:


    ```bash

    tail -3 test.txt

    ```


    With that option, you can use `tail` to view as many or as few lines from the
    end of a text file.


    ## SCROLLING THROUGH A TEXT FILE


    The `cat`, `head`, and `less` commands all have one thing in common – they display
    the contents of a text file, and then quit. Even if you pipe the output of `cat`
    to the `more` command, you can scroll down one screen at a time – but you can''t
    jump back to view a screen of previously shown text. If you''re using a terminal
    emulator application, you can scroll back up, but if you''re at the CLI interface,
    the text is gone.


    This where the `less` command comes in handy. To turn to our example file from
    earlier, `test.txt`, this is the command you would use to view it with `less`:


    ```bash

    less test.txt

    ```


    Upon displaying the file, `less` pauses after the first full screen. By pressing
    the down arrow key, you can scroll down one line at a time. You can move down
    an entire screen at a time by pressing the Page Down key.


    Unlike the other commands to view text files, `less` allows you to move back up
    and return to text that has already been displayed. Pressing the up arrow key
    allows you to move back one line at a time. Pressing the Page Up key moves up
    one screen.


    You can search for terms within `less` by hitting the forward slash (`/`) key.
    After you hit the forward slash key, a prompt will appear at the bottom of the
    screen. Type your search term, and hit Enter. The `less` command will highlight
    each instance of the term within the output, and you can jump from instance to
    instance by hitting the `n` key.

