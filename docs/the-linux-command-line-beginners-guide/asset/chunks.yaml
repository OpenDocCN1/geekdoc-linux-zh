    # 引言


    目录可以包含子目录，而这些子目录还可以包含更多的子目录。这些目录形成了一个复杂的层级结构，而该结构的起点就是根目录。根目录是该结构中的顶层目录，是整个文件系统的第一个目录。系统中的任何其他目录在技术上都是根目录的子目录，无论你需要深入到多少层（在复杂的
    Linux 安装中，你的子目录可能嵌套了十层甚至更多）。


    在命令行中，根目录用正斜杠（`/`）符号表示。因此，如果你在文件系统中看到一个位置，例如 `/home/jmoeller`，那么左侧的正斜杠就代表根目录。这意味着主目录位于根目录之中，而
    `jmoeller` 目录又存储在主目录之中。


    通常情况下，保持根目录尽可能整洁是一个好主意。这使得在文件系统中定位文件变得更加容易，同时也防止由于未经授权的软件在根目录中运行而导致潜在的安全漏洞。（在
    Windows 早期，懒惰的用户习惯于将所有内容都存储在硬盘的根目录下，这往往会导致各种问题。）


    无论你使用的是哪种 Linux 发行版，你可能会在文件系统的根目录中看到相同的子目录。Linux 目录结构多年来一直保持标准，在下一节中，我们将查看一些常见的子目录。


    ## 常见子目录


    如果你查看根目录下的子目录列表，它看起来可能像这样![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m35520ce0.jpg)


    让我们在这里讨论一些更重要的目录。由于 Linux 发行版可以随心所欲修改修改 Linux 请注意某些目录的用途可能会在 Linux 版本之间发生变化。


    - `/bin` 目录的名字代表系统二进制文件（system binaries），包含了许多 Linux 的系统文件。我们在书中讨论的许多命令实际上都存储在这里。

    - `/boot` 目录存储 Linux 启动所需的的文件。名为 `vmlinuz-VERSION NUMBER` 的 Linux 内核文件位于这里。

    - `/dev` 目录包含代表系统上各种硬件设备的文件。

    - `/etc` 目录存放了 Linux 上运行的各种服务和程序的大部分配置文件。如果你管理 Linux 系统，你将花费大量时间在 `/etc` 目录中工作。

    - `/home` 目录包含系统中所有用户的主目录。每个登录系统的用户都会在这里有一个主目录。通常，主目录包含一组标准文件夹——桌面、文档、图片等，以及用户可能可能创建的任何其他个人文件夹。

    - `/media` 和 `/mnt` 文件夹都用于存储可移动介质。我们将在第 20 和第 21 章详细讨论，但当你将可移动磁盘插入电脑时，Linux 会将其挂载为文件系统中的文件夹。（这与
    DOS 和 Windows 不同，后者使用字母来表示连接到系统的不同驱动器。）取决于发行版，挂载的驱动器可能会出现在 `/media` 或 `/mnt` 中。偶尔某些发行版会使用
    `/Volumes` 目录，但这很罕见。

    - `/root` 子目录包含根用户的家目录。注意，根用户不等同于根目录！我们将在第 7 章和第 8 章详细讨论根用户，但总结来说，根用户是 Linux 系统上最强大的用户，拥有运行任何程序以及删除或修改任何文件的权限。因此，`/root`
    子目录是根用户的家目录，与 `/home` 目录中的主目录分开。

    - `/sbin` 目录与 `/bin` 目录一样持有系统命令。然而，`/sbin` 目录通常存储只有根用户才能运行的命令，因为这些命令会影响整个系统。

    - `/tmp` 目录存储临时文件，无论是来自应用程序还是用户。注意，在 `/tmp` 中存储重要数据是一个坏主意，因为某些发行版在关机或注销用户时会定期删除
    `/tmp` 目录的内容。

    - `/usr` 目录存储多用户应用程序。虽然 `/sbin` 中的工具往往仅限于根用户，但任何人都可以使用的应用程序通常位于 `/usr` 目录及其子目录中。因此，安装在
    Linux 系统上的大多数用户应用程序（Firefox 浏览器、LibreOffice 办公套件等都存储在这里。

    - 最后，`/var` 目录代表“变量”（variable），用于存储系统运行期间更改的数据。你电脑的所有日志文件都存储在这里，还有如打印缓存程序、用户邮箱（如果你的
    Linux 系统上有邮件服务器的话）和临时文件等项目。在某些发行版上，如果你的 Linux 系统正在运行 Web 服务器，网站文件也存储在这里。


    ## 绝对路径与相对路径


    关于文件系统的最后一点需要了解的是相对路径和绝对路径之间的区别。


    “文件路径”指的是文件在文件系统中的位置，具体来说是在目录层次结构中的位置。如果 `jmoeller` 用户在他的文档文件夹中有一个名为 `Caina1.doc`
    的文件，那么该文件的绝对路径就是 `/home/jmoeller/Documents/Caina1.doc`。因此，如果你想删除该文件，`rm /home/jmoeller/Documents/Caina1.doc`
    命令就会为你删除该文件。


    相对路径与当前工作目录有关。当你使用文件名启动命令时，命令首先会在你的工作目录中查找。如果你在 `/home/jmoeller/Documents` 为你的工作目录时使用了
    `rm Caina1.doc` 命令，该命令将在工作目录查找，找到文件并将其删除。如果你的工作目录是根目录，命令将无法找到该文件并导致失败。


    记住，如果你打算操作的文件或目录在你的当前工作目录中，你可以使用相对路径。如果不是，你应该使用绝对路径。


    # 第 4 章 - 用于处理文件和目录的命令


    在上一章中，我们解释了 Linux 文件系统的底层概念。在本章中，我们将查看让你处理文件和目录的命令。你将学习如何从命令行创建和修改目录以及文件。你还将学习如何删除文件和移除目录。


    ### 查找工作目录


    正如我们在第 2 章提到的，bash shell 通常配置为在提示符中显示当前工作目录。这并不总是如此，如果提示符没有配置为显示工作目录，很容易对当前位置感到困惑。你可以通过
    `pwd` 命令避免这种情况。输入此命令：


    ```

    pwd

    ```


    bash shell 将返回你的当前工作目录。


    ### 更改工作目录


    我们讨论了许多关于工作目录的内容，还没有提到如何更改工作目录。要做到这一点，你需要使用 `cd` 命令。（“cd”代表“change directory”）`cd`
    命令使用绝对文件路径工作。如果你在根目录下，并想切换到 `/var/www` 目录，可以使用此命令：


    ```

    cd /var/www

    ```


    工作目录将从 `/` 变为 `/var/www`。


