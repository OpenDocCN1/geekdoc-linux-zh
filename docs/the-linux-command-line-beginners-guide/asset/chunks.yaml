  raw: 'Of course, logging out and logging back in every time you need to perform
    an administrative task will quickly prove cumbersome. To counter that, a command
    called su lets you log in as root from within your own account. Once you are finished
    in your root session, you need only type exit to return to your own user account.


    What happens if you work on a system where multiple people need access to the
    user account? Sharing the root password with multiple people is a security risk
    (since those people might, in turn, share the password with others). It also makes
    auditing and tracking system changes more difficult. If the root user makes a
    change to the system, it''s hard to figure out who is responsible if five different
    people know the root password.


    To get around this problem, Linux offers the use of the sudo command. The sudo
    command lets you temporarily “borrow” the powers of the root user to perform a
    task. Only users belonging to a specific group (usually the admin group) can use
    the sudo command, and their actions are recorded in a log file.


    In fact, with the sudo command, you can even keep the root account disabled and
    still use root-level powers. Keeping the root account activated is something of
    a security risk, since if an attacker guesses your root password, he has complete
    control over your entire system. Some distributions (like Ubuntu) disable the
    root account by default, and recommended that administrators use the sudo command
    to perform administrative tasks.


    In the next chapter, we''ll take a closer look at using the su and sudo commands.


    ***


    ## Chapter 8 - Commands For Using The Root Account


    In this chapter, we will explain how to use root''s powers safely via the su and
    the sudo commands.


    THE SU COMMAND


    The “su” command stands for “switch user.” In its default state, it prompts you
    to log into the root account. However, you can actually use su to switch to any
    account on the system for which you know the password.


    First, though, we''ll discuss root. To switch to the root account, simply type
    su without any switches:


    su


    Enter the root password, and su will switch you to the root account without terminating
    your session under your own account. Once you''ve finished using the root account,
    type the exit command. You''ll log out of root, and return to your own session.


    You can also use su to log in as any other user in the system (assuming you know
    their password – if you don''t, you must first use the passwd command to change
    their password). For example, if you want to log in using the camalas account
    from the previous chapter, use this command:


    su camalas


    Enter the password for camalas, and you''ll log in using that account. Once you
    are finished, you can close camalas''s session by using the exit command.


    THE SUDO COMMAND


    The sudo command offers a more sophisticated way to deal with root powers. The
    “sudo” command stands for “switch user do” - though because it''s so often used
    for administrative tasks, it''s often called the “superuser do” command. With
    su, you have to log in completely as root. The sudo command only “borrows” the
    powers of root for a brief time to complete a specific task, and then completes.
    This means you can perform administrative tasks from your regular user account,
    so long as your account has permission to use sudo.


    For example, let''s say you wanted to use the usermod command to lock the camalas
    account from the session of a standard account. Type this command:


    usermod -L camalas


    You will receive an access denied error message.


    However, if you preface the command with sudo, you will get better results:


    sudo usermod -L camalas


    Before executing the command, sudo will ask for your password. Enter your password,
    and sudo will check to see if your password is on the list of accounts allowed
    to use sudo. If it is, sudo will execute the command as root.


    We mentioned the “admin” group earlier in this book. In most Linux distributions,
    the admin group is the one that has the right to use sudo to employ root powers.
    The list of accepted sudo users is defined in the /etc/sudoers file. (Appropriately
    enough, you need root rights to view the /etc/sudoers file.) In most distributions,
    the list of sudoers consists of the admin group and nothing else.


    The use of sudo is also recorded in a log file. In most distributions, sudo use
    is record in the /var/log/auth.log file. Scanning this file will let you see who
    is using sudo and for what tasks.


    This is a book about the command line, but sometimes you might need to run a graphical
    application as root. You can do this using the gksudo command – use the gksudo
    command in a terminal emulator application, and the application you''ve launched
    with gksudo will appear in a window in the GUI.


    ***


    ## Chapter 9 - Concept: Groups


    The last four chapters should have given you a solid grasp of working with user
    accounts from the Linux command line. But user accounts are only aspect of managing
    user accounts. When you sort your various user accounts into groups, you can far
    more easily assign the appropriate permissions. In this chapter, we will explain
    the underlying principles of Linux groups.


    WHAT ARE GROUPS?


    In Linux (and many other operating systems), a “group” generally refers to a group
    of user accounts. The basic purpose of groups is to simplify the management of
    permissions to files and folders. For example, let’s say you have a file named
    BUDGET.DOC that every member of the accounting department needs to access. You
    could assign permissions to every single member of the accounting department,
    but that could quickly become cumbersome, and for larger organizations (where
    the accounting department might have a hundred people) such a manual method would
    quickly become unmanageable.


    Groups offer a way to simplify this mess. You need only create a group called
    “accounting”, and assign all members of the department to it. Then if you assign
    permissions to BUDGET.DOC to the accounting group, every single user in the accounting
    group gets permission to access the file, no matter how many users are in the
    group. So if a hundred different people all need access to a file, it''s much
    easier to assign the permission to their group just once rather than a hundred
    different times to a hundred different users.


    PRIMARY GROUPS


    As you add accounts to your system, you will quickly realize that every time you
    create an account, a group with the same name is also created. Furthermore, the
    new user account is always added to the new group of the same name, and is usually
    the only member in the group. These are generally called “primary groups”, and
    are created because every Linux user must be a member of at least one group, but
    they are used for reasons of security. We will discuss ownership and permissions
    in more detail in the next four chapters, but every file and directory in Linux
    is assigned an “owning” user and and an owning group. (“Ownership” is Linux simply
    means that the owner of the file or the directory has full control over it.) Often
    you will have files that you want only a single user to control and modify. If
    the file''s ownership is set to the user''s account and the “users” group containing
    every group on the system, security quickly becomes a problem. But by assigning
    ownership to the user''s account and the user''s primary group, only that user
    (and root, of course) will have access to that file or directory.


    USERS AND ADMIN GROUPS


    Most Linux distributions will have two default groups for user accounts – the
    users group, and the admin group. The users group will contain all the standard
    users accounts on the system. If you want every user on the system to have access
    to a file or a directory, you would assign the group ownership to the users group.
    (We''ll discuss how to do that in Chapter 12.)'
