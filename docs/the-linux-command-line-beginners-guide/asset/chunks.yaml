    当连接可移动驱动器时，Linux 会为该驱动器创建一个“挂载点”（mount point）。挂载点是在文件系统中为可移动驱动器创建的虚拟目录。该目录通常以驱动器卷标标签的命名。因此，如果你向电脑插入一个卷标标签为
    `USBDRIVE` 的闪盘，Linux 将为它创建一个名为 `USBDRIVE` 的目录。`USBDRIVE` 目录将对应闪盘上的根目录，你可以像对待其他其他目录一样向其中移动文件或从那里复制文件。


    这些挂载点位于文件系统中的什么位置？大多数 Linux 发行版都有一个 `/media` 目录来存储挂载的外部驱动器。回到之前的例子，`USBDRIVE`
    闪盘将在文件系统中显示为 `/media/USBDRIVE`。对于图形用户界面（GUI），桌面上会出现一个代表可移动驱动器的图标，但该图标将引导你进入 `/media`
    中的可移动驱动器挂载点。


    某些 Linux 发行版使用 `/mnt` 目录，少数甚至使用 `/Volumes`，但大多数发行版都使用 `/media` 目录作为挂载点。


    ## 不同类型的文件系统


    你是否可以读取或写入可移动介质取决于驱动器上安装的文件系统类型。


    我们已经描述过文件系统是组织磁盘上信息的一种手段，并注意到“文件系统”通常是描述 Linux 系统中硬盘的简称为法。虽然文件系统可能是组织磁盘上信息的方法，但仍然存在不同类型的文件系统。我们将在本节中查看其中几种。


    Linux 系统中的硬盘最常用的格式是 `ext3` 或 `ext4` 文件系统。`ext3` 和 `ext4` 都是日志文件系统，这意味着它们在将更改写入磁盘之前会跟踪这些更改，这有助于防止错误。`ext3`
    文件系统支持最大容量为 32 TB 的卷，单个文件的最大大小限制为 2 TB。`ext4` 文件系统支持最大可达 1 EB（艾字节）的卷和最大可达 16 TiB（二进制太字节）的文件。


    如果你向 Linux 系统插入一个外部硬盘，它可能是以 `NTFS` 文件系统格式化的。`NTFS` 是 Windows 电脑默认的文件系统。大多数 Linux
    发行版都有读取 `NTFS` 卷上文件的能力，但无法向其写入。如果你向 Linux 电脑插入一个 `NTFS` 卷，你可能能够从中复制文件，但无法向其写入文件。


    你可能遇到的另一个主要文件系统是 `FAT` 文件系统。`FAT` 是一种旧的文件系统，通常不再用于内部硬盘，因为它的最大可能只有 4 TB，并且不支持任何大于
    4 GB 的文件。然而，Linux 和 Windows 都可以读取和写入 `FAT` 磁盘。因此，较小的外部硬盘和 USB 闪盘格式化为 `FAT` 是常见的。


    ## 不同类型的可移动介质


    你会遇到几种不同的可移动介质。


    在 21 世纪初，软盘仍然相当常见。大多数软盘是 3 ½ 英寸硬塑料磁盘，可以存储 1.44 MB 的数据。按现代标准来说，这些数据并不多，而且软盘相对脆弱且细小。从那以后它们被外部硬盘、USB
    闪盘和基于互联网的存储系统取代并过时，不再生产。


    外部硬盘已变得非常普遍且相对廉价。它们通常通过 USB 线连接到你的电脑。它们带有 `NTFS` 或 `FAT` 文件系统格式化。你可以将 `NTFS` 硬盘重新格式化为
    `FAT`、`ext3` 或 `ext4`，尽管这意味着 Windows 系统将无法识别该驱动器。


    USB 闪盘是最常见的可移动介质——它们廉价、易于携带，并且可以存放大量的文档（尽管包含的音乐或视频文件不多）。它们几乎总是格式化为 `FAT`，因此你在
    Linux 系统中读写这些文件时不会遇到困难。


    ## 第 21 章 - 用于处理可移动介质的命令


    可移动介质的主要用途是在你的电脑上移动文件。大多数你实际上想与可移动介质一起使用的的命令——`cp`、`rm`、`mkdir` 等——我们已经在书中涵盖了。有少数命令专门用于分析磁盘和空间使用，这些命令在处理可移动介质时会被证明非常有用。在本章中，我们将向你如何使用这些命令。


    ### 查找磁盘空间使用


    你经常需要计算磁盘上剩余多少空空间，无论是你的可移动介质还是系统的主硬盘。诚然，对于家用电脑来说，监控硬盘空间使用情况并不像以前那样关键了。现代硬盘非常巨大，并且不断变大。尽管如此，某些类型的多媒体文件（如视频文件）可以迅速填满硬盘，而
    USB 闪盘通常只有几 GB 的空间。


    幸运的是，通过 `df` 命令有一种快速简单的方法可以计算你的磁盘上还剩多少空间。要使用它，只需在提示符处输入 `df` 即可：


    ```bash

    df

    ```


    输出看起来类似于这样：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_2912120f.jpg)


    正如你所见，`df` 命令显示了挂载到系统的每个文件系统的使用情况。主硬盘将显示为 `/dev/sda1`。任何分区（无论是硬盘还是 USB 磁盘）显示为
    `/dev/sdb1`、`/dev/sdc1`。


    默认情况下，`df` 以字节显示。除非你非常擅长心算，否则这种计算空间的方法非常困难。为了获得更易读的显示，请使用 `-h` 参数使用 `df`：


    ```bash

    df -h

    ```


    输出现在像这样：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6Dmx_html_535272e1.jpg)


    通过 `-h` 参数，`df` 以 GB 或 MB 显示输出，取决于磁盘的大小。


    你还可以使用 `df` 命令找出磁盘上的文件系统类型。要这样做，请使用 `df -h` 并加上 `-T` 参数：


    ```bash

    df -th

    ```


    这将在输出中包含文件系统的类型：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6Dmx_html_3327e240.jpg)


    你可以看到 `df` 现在位于“类型”列下方。


    ### 查找文件和文件夹的大小


    现在你已经知道如何查找系统磁盘的使用情况，你可能想知道具体是什么占据了硬盘上的所有空间。你可能记得 `ls -l` 命令列出当前目录的文件大小，而 `ls
    -lh` 以 MB 和 GB 显示文件大小。然而，`ls -l` 或 `ls -lh` 并不显示目录的大小（以及其中包含的文件）。因为目录在 Linux 文件系统中也是文件，`ls
    -l` 命令只显示标记目录的存在的文件大小，这始终是四 KB。


    要找到目录及其所有子目录的精确大小，请使用 `du` 命令。在默认状态，`du` 命令显示当前工作目录下所有文件的大小。然而，结合 `-s` 和 `-h`
    参数，`du` 将显示整个目录的大小。例如，要计算 `/var` 目录及其所有子目录的大小，你将使用以下参数使用 `du`：


    ```bash

    du -sh /var

    ```

