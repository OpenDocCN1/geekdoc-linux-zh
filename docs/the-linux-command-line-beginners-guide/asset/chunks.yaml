    dependency the piece of software needs, the installation will fail.


    INSTALLING SOFTWARE USING THE ADVANCED PACKAGING TOOL


    Most Debian-derived distributions used the Advanced Packaging Tool for software
    management. The Advanced Packaging Tool has a number of graphical front ends –
    the Synaptic Package Manager, or the Ubuntu Software Center in Ubuntu. However,
    to install software from the command line with the Advancing Packaging Tool, you''ll
    use its command-line utility, the apt command. The apt command works closely with
    the software repositories, and downloads its installed software from the repository.


    For instance, to install the remote desktop connection application Remmina, you
    would use this command:


    apt-get install remmina


    Usually on a Debian-derived system you''ll use apt with sudo to gain root powers
    for the installation. You''ll also need to know the name of the package you want
    to install. After you enter the command, apt will check the repositories, list
    any dependencies Remmina might need, and list the total amount of disk space required.
    Press Y to continue, and apt will download and install Remmina for you.


    To remove Remmina with apt, you can use this command:


    apt-get remove remmina


    Again follow the prompts, and apt will remove Remmina and all its dependencies
    from your system. Note that if one of Remmina''s dependencies is needed by another
    application, apt will not remove it.


    INSTALLING PREPACKAGED SOFTWARE USING THE RPM PACKAGE MANAGER


    Like Debian, Red Hat Linux (and its free version, Fedora) is one of the oldest
    and most respected Linux distributions, and numerous other distributions are based
    upon Fedora. Software packaged for Fedora-based distributions usually comes in
    the form of a .rpm file, since Red Hat, Fedora, and its derivatives all use the
    RPM Package Manager instead of the Advanced Packaging Tool. You can install the
    package in the GUI environment by double-clicking on it, but you can also install
    it from the command line.


    To install .rpm packages from the command line, you will use the rpm command.
    If you have a prepackaged installer file called installer.rpm, you can install
    it with this command:


    rpm -i installer.rpm


    Depending on the program, you may or may not have to follow an install wizard
    or enter additional information. Follow the prompts, and rpm will install the
    software for you.


    Likewise, you can also use rpm to uninstall software with the -e option:


    rpm -e installer.rpm


    Note that in order to uninstall software via rpm, you need to keep the original
    installer file, since that contains the instructions for uninstallation. Also,
    the rpm command does not calculate any dependencies, and if you''re missing a
    dependency the piece of software needs, the installation will fail.


    INSTALLING SOFTWARE WITH YELLOW DOG UPDATER


    Most Fedora-derived distributions used the Yellowdog Updater Modified (yum) for
    software management. Yellowdog has a number of advantages over the rpm command
    – it works closely with the repositories, and automatically calculates and downloads
    dependencies. Yellowdog uses the yum command-line utility to install software.


    For instance, to install the remote desktop connection application Remmina, you
    would use this command:


    yum install remmina


    Usually on a Fedora-derived system you''ll use yum as root to gain the necessary
    permissions for installation. You''ll also need to know the name of the package
    you want to install. After you enter the command, yum will check the repositories,
    list any dependencies Remmina might need, and list the total amount of disk space
    required. Press Y to continue, and yum will download and install Remmina for you.


    To remove Remmina with yum, you can use this command:


    yum remove remmina


    Again follow the prompts, and yum will remove Remmina and all its dependencies
    from your system. Note that if one of Remmina''s dependencies is needed by another
    application, yum will not remove it.


    ***


