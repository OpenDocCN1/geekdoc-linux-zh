    ## Chapter 19 - Networking Commands


    The last chapter explained the basics of networking. In this chapter, we''ll show
    you the commands that deal with networking.


    ### FINDING YOUR IP ADDRESS


    It''s actually a lot easier to find your IP address from the command line than
    from the GUI in most Linux distributions. Simply type this command at the prompt:


    ```

    ifconfig

    ```


    The `ifconfig` command will generate an output that looks something like: There''s
    quite a bit of information here, but most of it is useful. The `eth0` refers to
    the first Ethernet connection on your system. The `inet addr` displays your system''s
    IP address, while `Mask` shows the subnet mask. `HWaddr` shows your Ethernet adapter''s
    MAC (Media Access Control) address, which is theoretically unique to each adapter.
    (Some wireless networks require you to supply your MAC address before allowing
    your system to connect.)


    You can pipe the output from the `ifconfig` command to `grep` to quickly find
    the specific item you want. Let''s say you just want to find the IP address:


    ```

    ifconfig | grep inet

    ```


    This time, the output will look like this, and you can quickly pick your IP address
    from the mix. Likewise, you can quickly find your computer''s MAC address with
    `ifconfig` and `grep`. (A MAC address stands for Media Access Control, and is
    a hard-wired address that is theoretically unique to each network adapter.)


    ```

    ifconfig | grep HWaddr

    ```


    ### FINDING YOUR DEFAULT GATEWAY


    The `ifconfig` command generates lots of useful output, but it does not include
    the address of your default gateway. To do so, you can use the `ip` command with
    the `route` option:


    ```

    ip route

    ```

