    `cd` 命令也可以用于工作目录中的相对文件名。在我们之前的示例中，你是从根目录开始的。你可以切换到根目录的任何一个子目录，而无需使用绝对文件路径。要切换到
    `/etc` 目录，你只需要输入此命令：


    ```bash

    cd /etc

    ```


    `cd` 命令还支持另一个实用的快捷方式。在 `bash` shell 中，两个点字符（`..`）代表当前目录的上级目录——换句话说，就是当前工作子目录的父目录。所以，如果你使用
    `cd /etc` 从根目录移动到 `/etc`，你可以使用此命令直接返回：


    ```bash

    cd ..

    ```


    最后，还有另一个可以在 `cd` 命令中使用的实用技巧。还记得波浪字符（`~`）代表当前用户的家目录吗？无论你在文件系统的哪个位置，都始终可以使用这个短命令返回你的家目录：


    ```bash

    cd ~

    ```


    # 创建新目录


    在某个时刻，你将创建新目录，无论是为了更好地组织文件，还是作为安装应用程序的一部分。要创建一个新目录，你将使用 `mkdir` 命令。此示例命令将在工作目录中创建一个名为“ghosts”的新目录：


    ```bash

    mkdir ghosts

    ```


    在默认情况下，`mkdir` 在当前工作目录中创建新目录。要在不同的位置创建目录，可以将工作目录更改到目标位置，或者配合绝对文件路径使用 `mkdir`。如果你想在用户
    `jmoeller` 的 `Documents` 目录中创建“ghosts”目录，你将使用此命令：


    ```bash

    mkdir /home/jmoeller/Documents/ghosts

    ```


    # 删除目录


    你偶尔需要删除一个未使用的目录。你可以通过 `rmdir` 命令来实现。删除我们上面创建的“ghosts”目录：


    ```bash

    rmdir ghosts

    ```


    与 `mkdir` 一样，`rmdir` 默认在当前工作目录查找要删除的目录。与 `mkdir` 一样，你可以配合绝对文件路径使用 `rmdir`：


    ```bash

    rmdir /home/jmoeller/Documents/ghosts

    ```


    一个注意事项——`rmdir` 仅在目标目录没有任何文件或子目录时才起作用。如果你想使用 `rmdir` 删除目录，必须先删除该目录的内容。要删除包含文件或额外目录的目录，你需要使用
    `rm` 命令，我们将在本章稍后部分讨论它。


    # 列出目录内容


    目录的目的是存储文件，但如果你看不到这些目录的内容，那么它们对你没太大帮助。`ls` 命令让你查看当前工作目录的内容。只需在提示符处使用 `ls` 命令且不带任何选项即可：


    ```bash

    ls

    ```


    输出可能看起来像：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m14f57c9.jpg)


    默认情况下，`ls` 列出工作目录的内容。你也可以配合绝对文件路径使用 `ls`。例如，如果你想查看 `/etc` 目录的内容：


    ```bash

    ls /etc

    ```


    在默认模式下，`ls` 显示的信息并不多，只有工作目录中文件和目录的名字。目录的名字通常用蓝色编码显示，但并非所有的发行版都这样做。那么，你如何通过 `ls`
    命令获取更多信息呢？


    你可以通过配合 `-l` 选项使用 `ls` 来做到。“选项”是改变命令行为的修饰符。它们通常（但并非总是）是添加连字符后面的单个字母。要配合 `-l` 选项使用
    `ls`，输入此命令：


    ```bash

    ls -l

    ```


    结果输出可能看起来如下：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2e751004.jpg)


    `-l` 选项代表“长列表”，它显示的信息比基础 `ls` 命令多得是。在输出中，你可以看到文件的权限和所有权（我们将在第 11 到 14 章讨论权限和所有权），以及它们的字节大小、最后修改的日期和时间。


    `ls -l` 命令在配合 `-h` 选项时更加有用：


    ```bash

    ls -lh

    ```


    该命令将产生类似这样的输出：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_1fe36ac2.jpg)


    这与 `ls -l` 的输出相同，不同之处文件大小现在以 KB 和 MB 为单位而不是字节，这使得输出更易读。


    在第 3 章中，我们提到了隐藏文件。在 Linux 中，隐藏文件通过在文件开头加上一个点字符（`.`）创建。通过配合 `-a` 开关使用 `ls`，你可以查看隐藏文件：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_1fe3ac2.jpg)


    # 复制文件


    现在你已经知道如何创建目录，可能想将文件放入这些目录中。有很多命令可以移动文件，我们将从 `cp` 命令开始。`cp` 是“copy”的缩写，允许你将文件从一个位置复制到另一个位置。当你选择想要复制的文件时，可以使用相对文件路径。

