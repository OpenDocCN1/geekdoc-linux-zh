    \n正如我们所提到的，Linux 支持七个虚拟控制台。要在虚拟控制台之间切换，请同时按下 `CTRL-ALT-FUNCTION#` 键。因此，要切换到虚拟控制台\
    \ 1，按下 `CTRL-ALT-F1`；切换到虚拟控制台 2，按下 `CTRL-ALT-F2`，以此此类推。当你切换到一个新的虚拟控制台时，你会看到一个标准的登录提示。你（或另一个用户）可以登录该虚拟控制台而不会影响你的原始会话。\n\
    \n如果你运行带有 GUI 的 Linux 版本，也可以使用虚拟控制台。默认情况下，GUI 运行在虚拟控制台 7 上（`CTRL-ALT-F7`）。你可以切换到其他六个虚拟控制台中的任何一个。完成后，你可以按下\
    \ `CTRL-ALT-F7` 返回 GUI。\n\n***\n\n## 第 2 章 - 概念：bash shell \n\n当你使用 Linux 命令行时，你几乎肯定正在使用一个名为\
