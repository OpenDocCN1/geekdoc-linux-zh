- fmt: '

    We''ve already mentioned the admin group in connection with the `sudo` command
    and the superuser account. On Linux distributions that use `sudo`, the `admin`
    group is the group that gets the right to use `sudo`. Usually, the `admin` group
    is added to the `/etc/sudoers` file. (This is an example of using groups to simply
    administration – rather than manually add users to the `/etc/sudoers` file, you
    need only add them to the `admin` group.)


    Most Linux systems will have a variety of other groups related to system functions.
    There''s a `cdrom` group, for example, that specifies who has the right to use
    the optical drive on the system. There are also a number of groups related to
    system services and background programs. Generally, if you''re new to the Linux
    command line, it''s best to avoid tampering with these groups unless you know
    what you''re doing.


    # GROUP ID AND CONFIGURATION FILES


    User accounts get a user ID (`UID`) number, and groups, likewise, receive a `GID`
    – a group ID number. Like `UIDs`, `GIDs` follow some standard conventions.


    The user group for root usually receives a `GID` of `0`. The standard users group
    will receive a `GID` of `100`. The `GIDs` for primary groups, like the `UIDs`
    for user accounts, starts at `1000` and works its way up – the first primary group
    on the system will have a `GID` of `1000`, the second a `GID` of `1001`, and so
    forth. `GIDs` of below `1000` are reserved for various system groups.


    Just as user accounts are defined in the `/etc/passwd` file, groups are defined
    in the `/etc/group` file. A typical entry in the `/etc/group` file will look like
    this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_51969f46.jpg)


    Like `/etc/passwd`, the individual fields in `/etc/group` are separated by colons.
    The first field denotes the name of the group. The second field stores the group
    password – similar to `/etc/passwd`, group passwords are actually stored in encrypted
    form in the `/etc/gshadow` file. The third field shows the `GUID`. The fourth
    and final field displays the members of the group. Depending on how many users
    are assigned to the group, this field can become rather long.


    As with `/etc/passwd`, editing the `/etc/group` file by hand is a bad idea and
    can mess up your system. Instead, it is better to use command line utilities to
    add groups, add users to groups, remove users from groups, and delete groups.
    We''ll show you how to do just that in the next chapter.


    ## Chapter 10 - Group Management Commands


    After the last chapter, you should understand the underlying mechanics of Linux
    groups. In this chapter, we''ll show you the commands to create groups and add
    users to groups. We''ll also explain how to remove users from groups and delete
    unnecessary groups. Note that all group-related commands need to be run with root
    powers, whether directly logged in as root or by using `sudo`.


    You''ll find that the commands for working with groups are fairly simple. While
    groups can simplify complex permissions management, managing groups themselves
    is a straightforward task.


    ### CREATING A NEW GROUP


    To create a new group, you will use the `groupadd` command. If you wanted to create
    a new group called `ghosts`, the command would look like this:


    ```

    groupadd ghosts

    ```


    And that''s it! The command will add the `ghosts` group to your system. There
    are a number of different options available for `groupadd`. If you wished, you
    could use the `-g` switch to specify a `GID`. For the most part, the default options
    will work fine.


    ### ADDING A USER TO A GROUP


    Now that you''ve created a new group, you probably want to add one or more accounts
    to it. You can do this using the Swiss Army knife of user account commands, the
    `usermod` command. With the `-G` switch, `usermod` will add the user account of
    your choice to the specified group. If you wanted to add the `camalas` user account
    to the `ghosts` group we created in the previous section, you will use this command:


    ```bash

    usermod -G ghosts camalas

    ```


    This will add the `camalas` account to the `ghosts` group.


    ### REMOVING A USER FROM A GROUP


    Removing a user from a group is likewise a easy task. To remove a user from a
    group, you will use the `gpasswd` command. The following command would remove
    the `camalas` account from the `ghosts` group:


    ```bash

    gpasswd -d camalas ghosts

    ```


    Once the command finishes, `camalas` will not longer be a member of the `ghosts`
    group.


    ### DELETING A GROUP


    To delete a group, you will use the `groupdel` command. For example, to delete
    the `ghosts` group we created in the earlier section, use this command:


    ```bash

    groupdel ghosts

    ```


    You might recall that the `rmdir` command requires that a directory be empty before
    you delete it. The `groupdel` command does not work the same way – you can delete
    a group that still contains user accounts. It is important to note, however, that
    deleting a group does not delete the user accounts contained within a group. (This
    is a useful feature, since accidentally deleting the wrong group on a large system
    could inadvertently wipe out hundreds of user accounts.) So you can safely delete
    a group that still has members without worrying about deleting anyone''s user
    accounts.


    There is one exception to this rule – the primary group of an individual user
    account. Remember that Linux requires a user account to be a member of at least
    one group. So to delete a primary group, you must first delete its associated
    user account.


    ***


    ## Chapter 11 - Concept: Ownership


    In the previous chapters, we''ve touched a little on the concept of file and directory
    ownership. In this chapter, we''ll explain the ideas behind ownership, and explain
    how they apply to file permissions. Ownership might seem complex, but combined
    with file permissions, it makes for an elegant way to manage security.


    ### WHAT IS OWNERSHIP?


    What is file folder ownership? We are not talking about the person who owns the
    computer, in the sense of the person or organization that paid for the computer
    hardware. Instead, when we talk about who owns the file in Linux, we are describing
    the user that has full control over the file. Basically, the user “owns” the file,
    and has the right to change its permissions as he or pleases. Users own the files
    in their home directories. System files and configuration files are generally
    owned by the `root` user, which is why you need root powers to change many system
    settings. Sometimes ownership will be assigned to the user accounts of various
    system services, if they need to regularly access the files or directories in
    question.


    Ownership comes into play with file permissions. Basically, every file or folder
    on a Linux system can be accessed by three different divisions of users – the
    owning user, the group associated with the owning user, and all other users on
    the system. Access permissions to the file are assigned on that basis – you can
    give the owning user full control over a file, for example, but only give read
    access to the associated group, and deny access to all other accounts on the system.


    Understanding ownership is key to assigning correct permissions to a file. Because
    each file has three sets of permissions – the permissions assigned to the owning
    user, the permissions assigned to the group, and the permissions assigned to all
    other accounts on the system – you can quickly change a file''s permissions by
    changing its owner or its owning group.


    We will describe permissions in greater detail in Chapters 13 and 14. In the next
    chapter, we will describe the commands to change and modify ownership of files
    and folders.


    ***


    ## Chapter 12 - Commands For Changing Ownership Of Files And Directories


    In the previous chapter, we discussed the principles and concepts behind the ownership
    of files and directories. In this chapter we''ll show you how to manage ownership
    from the command line. You''ll learn how to determine the ownership of files,
    and how to change both the owning user and the associated group.


    ### DETERMINE THE OWNER OF FILES

