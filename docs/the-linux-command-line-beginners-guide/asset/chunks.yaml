    bash shell 的行为由位于你主目录下的若干隐藏文件控制。（在 Linux 中，当文件名称以点字符开头时，它们就是“隐藏”的。虽然这并不能保护它们免受删除或修改，但它们不会出现在常规目录列表中。）对于新用户来说，通常最好的做法是避免修改这些文件。一旦你有了更多经验，你可能想要尝试修改它们。


    第一个文件是 `~/.bash_history`。这是 bash 存储用于命令历史功能中所用信息的地方。它是一个纯文本文件，因此你可以使用第 16 章中将讨论的许多命令来查看它。


    第二个文件是 `~/.bash_profile`。它存储了你 bash 设置的个人配置，包括提示符文本本身的配置。如果你想自定义你的 bash 提示符，可以在这里进行。


    # 输出管道与重定向


    bash shell 还提供了两个名为“输出管道”（output piping）和“输出重定向”（output redirects）的功能。基本上，这允许你获取命令的输出，并将其交交给另一个命令进行处理，或者将其存储在文本文件中。这可能会变得相当复杂，但我们将查看一些常见的用法。


    ## 管道 (Piping)


    管道允许你获取一个命令的输出并将其移动到第二个命令中处理。例如，假设你想使用 `ls` 命令来查看当前工作目录的内容。此外，你想使用 `grep` 文本排序命令来查找目录中每个名为“cheese”的文件。要使用命令管道，你会使用管道字符（`|`）将
    `ls` 命令的输出管道到 `grep` 命令：


    ```

    ls | grep cheese

    ```


    ## 输出重定向 (Output Redirection)


    输出重定向允许你使用大于号（`>`）将命令的输出重定向到不同的位置，通常是一个文本文件。例如，假设你想使用 `ls` 命令查看工作目录的内容，但你想将命令的输出保存起来，以备日后查看。你可以通过使用
    `ls` 命令配合大于号来重定向输出来实现这一点：


    ```

    ls > list

    ```


    这将把命令的输出重定向到名为 `list` 的纯文本文件中。如果该文件不存在，命令将在当前工作目录下即时创建它。然而，如果文件已存在，命令将用新信息完全覆盖它。如果你不小心，可能会导致数据丢失。


    这种数据丢失很容易避免。如果你使用双大于号（`>>`），则命令的输出将追加到现有文件中，而不会覆盖它。扩展我们之前的例子：


    ```

    ls >> list

    ```


    此版本的命令会将 `ls` 命令的输出追加到 `list` 文件中，保持任何数据不被覆盖。


    # 带有空格的文件名 (FILE NAMES WITH SPACES)


    命令行处理文件名中的空格的能力并不理想——假设你 尝试使用 `rm` 命令删除一个名为“Joe''s Term Paper”的文件。


    ```

    rm Joe''s Term Paper

    ```


    此命令将失败，因为命令行会将命令中的每个单词解释为一个单独的文件。要强制命令行正确地查看文件，请将任何带有空格的文件名包含在引号内：


    ```

    rm “Joe''s Term Paper”

    ```


    这一次 `rm` 将删除该文件。


    # 大小写敏感 (CASE SENSITIVITY)


    我们将用一个重要的提醒结束本章：始终记住，Linux 命令行界面是区分大小写的。这意味着 bash shell 能够区分大写字母和小写写字母。它会将名为 `Caina.doc`、`caina.doc`
    和 `CAINA.doc` 的三个文件视为三个不同的文件。此外，几乎所有的 Linux 命令都是小写的。如果你打算输入 `ls` 来查看当前目录的内容，但不小心输入了
    `Ls`，那么 shell 将无法识别该命令并返回错误消息。


    这通常会让新的 Linux 用户困惑，尤其是那些有 DOS 或 Microsoft Windows 背景的用户。DOS 和 Windows 中的 Command
    Prompt 都不区分大小写——与 Linux 不同，Windows Command Prompt 应用程序会将 `Caina.doc`、`caina.doc`
    和 `CAINA.doc` 视为同一个文件，你也可以用大写或小写输入 Windows 命令。


    在 Linux 中并非如此。始终记住 Linux 命令行界面是区分大小写的。


    ***


    ## 第 3 章 -概念：Linux 文件系统 (The Linux Filesystem)


    要有效使用 Linux 命令行，你必须首先掌握底层的 Linux 文件系统。不知道如何从命令行复制、移动、删除和创建文件及目录，Linux 命令行界面将毫无用处。在本章中，我们将解释
    Linux 文件系统的工作原理。在之后的章节中，我们将演示管理文件和目录所需的命令。


    # 什么是 Linux 文件系统？ (WHAT IS THE LINUX FILESYSTEM?)


    如果你足够老，可能还记得“文件系统”一词是指办公室如何组织它的牛皮纸文件夹集合。对于计算机而言，“文件系统”指的是存储在磁盘上的信息组织方式，无论是在硬盘、USB
    闪盘还是像 CD-ROM 或 DVD-ROM 这样的光盘上。（如果你不幸地有一台那么老的电脑，也可能是软盘。）在 Linux 中，当人们谈论“文件系统”时，通常指的是
    Linux 系统主硬盘上的文件和目录结构。事实上，在最新版本的 Ubuntu Linux 中，点击 Nautilus 文件管理器外壳中的“文件系统”图标将带你进入主驱动器的根顶层目录。


    Linux 文件系统分为文件和目录，我们将在下一节中讨论。


    # 文件和目录 (FILES AND DIRECTORIES)


    如果你使用计算机有一段时间了，你已经熟悉“文件”这个词了。计算机文件基本上是保存到磁盘长期存储中的信息。你的文档、图片和音乐轨道都是文件，你运行运行的所有程序和应用程序也是如此（一个复杂的应用程序有时由成百上千的文件组成）。有趣的是，在
    Linux 文件系统中，各种硬件设备也被表示为文件，全部存储在 `/dev` 目录。


    现代 Linux 系统包含成千上万个文件，保持这些文件的有序被证明是一个巨大的挑战。这就是目录概念派上用场的地方。目录允许将文件分离到不同的虚拟容器中。就像纸质文件夹曾允许办公室人员将一大堆纸整理成整齐的系统一样，目录允许你（以及操作系统）跟踪文件。


    （顺便说一下，目录（directory）和文件夹（folder）的意思相同。所以当你听某人谈论访问他们的 Documents 文件夹时，他们指的是 Documents
    目录。由于大多数现代 GUI 使用文件夹图标来表示目录，使用文件夹来指代目录已成为常见做法。）


    当然，你可以将目录放在其他目录中。这些嵌套的目录通常被称为子目录，它们也可以拥有自己的子目录。


    你可以通过使用 `tree` 命令来更好地可视化文件系统的结构：


    ```

    tree

    ```


    这将以树的形式显示文件系统，从顶层目录开始，一直向下延伸各个子目录。


    Linux 的标准子目录多年来定义得相当完善，但我们将首先讨论文件系统中最重要的目录。


    # 根目录 (THE ROOT DIRECTORY)

