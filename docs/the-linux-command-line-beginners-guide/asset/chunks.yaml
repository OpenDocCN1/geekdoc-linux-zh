- fmt: '

    Note that for `du` to work, you''ll need permissions to the target files and directories,
    which might mean you need to run `du` as `root` or with root powers.


    # UNMOUNTING REMOVABLE DISKS


    Usually, on modern Linux systems, you don''t have to worry about mounting USB
    drives. If you plug in a USB drive, the system will usually detect it (even on
    a CLI-based system) and mount it automatically. Unmounting a drive isn''t quite
    so simple. In the GUI, you can just right-click on the drive''s icon and click
    Remove Safely, but that doesn''t work in the command-line interface. Simply yanking
    the drive out of its USB port isn''t an option, since that might result in data
    corruption.


    The answer is the `umount` command. Note that the command is actually spelled
    “umount”, not “unmount”. (Mistaking the two is a common typographical mistake
    at the Linux command line.) To return to our example from the previous chapter,
    if you wanted to unmount the `/media/USBDRIVE` flash drive, you would use this
    command at the prompt:


    ```

    umount /media/USBDRIVE

    ```


    Note that you need root powers to unmount mounted filesystems.


    The `umount` command can fail. If you have a file open on the USB drive, the `umount`
    command fill refuse to unmount the filesystem. Or if you have another terminal
    session open, and your working directory on that session is on the drive to be
    unmounted, the `umount` command will fail. Basically, if any files on the drive
    are open, you cannot unmount it. However, you can attempt to forcibly unmount
    it with the `-f` option:


    ```

    umount -f /media/USBDRIVE

    ```


    Note that if you do have files open on the drive, this might result in data loss.


    ***


    ## Chapter 22 - Concept: Processes and Daemons


    As you''ve read about Linux, you might have come across people discussing “processes”
    and “daemons.” In the next few chapters, we''ll discuss both. In this chapter,
    we''ll describe what processes and daemons actually are, and then in the following
    chapter, we''ll show you a few commands for monitoring and controlling processes.


    ### WHAT IS A PROCESS?


    In Linux, a “process” doesn''t refer to the specific procedure you use to do something,
    or a standardized method for carrying out a task. Rather, a process is defined
    as the active instance of a computer program. For example, if you ran the Firefox
    web browser, Firefox would be a running process. Once you exit Firefox and close
    your browsing sessions, the process would exit and disappear.


    Every program running on your computer, therefore, is technically a process. If
    you have a GUI, the various programs that make up the graphical user interface
    are processes. If you run a terminal emulator application, that too is a process.
    The commands you execute from the command line, whether in the pure CLI environment
    or from a terminal emulator application, are also processes. Even a command like
    `ls`, which quickly displays its output and then ends, is a process, albeit a
    short-lived one.


    However, there are more programs on your Linux system than you you personally
    execute, and we will discuss those next.


    ### DAEMONS


    People sometimes refer to processes as “daemons”, but the two terms are not interchangeable.
    While all daemons are indeed processes, daemons are something else. The term “daemon”
    means a system process running in the background. A system process is a process
    controlled and launched by the operating system without any intervention from
    the person actually using the computer. The program that controls a Linux laptop''s
    power settings, for example, is a daemon, as are server applications like a Web
    server or MySQL.


    (The term “daemon” originated not with the demons of Christianity or Islam, but
    with Greek myth. In ancient Greek religion, the “daemons” were lesser spirits
    who carried out tasks the Greek gods did want to bother themselves with. In the
    early days of UNIX, the programmers adapted the term “daemon” for processes that
    the system would carry out and not bother the user about.)


    Generally, command-line beginners tend not to use daemons too often. Once your
    skills are more advanced, and you start installing server applications, you''ll
    start using and controlling daemons more.


    ### PROCESS ID NUMBERS


    You''ll recall from the chapters on users and groups that every user has its own
    user ID (UID) number and that ever group has its own group ID (GID) number. Processes
    are no different. Every process that launches on a Linux system receives its own
    process ID (PID) number. Even a short-lived process like the `ls` command gets
    its own PID when it runs.


    After a process runs, it (in theory) releases its process ID number back into
    the pool of available processes. The number is then available to be reassigned
    to any new process.


    It is important to understand how PIDs work, since many of the commands that control
    processes use PIDs to identify the target of the command.


    ### PARENT PROCESS ID NUMBERS


    Every process also has a PPID – a parent process ID number.


    What is a parent process? Every process on a Linux system is launched by another
    process. If you run a terminal emulator and launch a command from the application,
    the terminal emulator process launches the process for the command. Or if you
    launch a web browser application, and you open a PDF file through the browser,
    the browser process will launch the PDF reader application.


    This relationship is called the parent process and the child process, similar
    to the relationship between a directory and a child directory. The parent process
    is the first process, and it launches the child process. Every process, therefore,
    has a PPID – the PID number of the process that launched it.


    ### THE INIT PROCESS


    Of course, if every process is launched either by a user or another process, then
    what is the first process?


    The init process runs during the boot sequence, and launches all processes on
    the system. It has a PID of 1, and is the first process launched during boot.
    Every system process is ultimately launched by init.


    In the next chapter we''ll show you a few commands for managing processes.


    ***


    ## Chapter 23 - Commands For Managing Processes


    In this chapter, we''ll show you how to view running processes from the command
    line. We''ll also show you how to shut down hung or frozen processes.


    ### VIEWING RUNNING PROCESSES


    One of the simplest methods of viewing the processes running on system is the
    venerable `ps` command. To use the `ps` command, simply type it at the command
    prompt:


    ```

    ps

    ```


    However, without any options, `ps` is not terribly useful. The default output
    looks like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_5442f77)


    In its default state, `ps` only shows the currently running process – itself –
    and the shell you are currently using. Fortunately, you can make `ps` much more
    useful with the `-e` switch:


    ```

    ps -e

    ```


    The `-e` stands for Extended, and generates a listing of every process currently
    running on the system:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_m6e56b94)


    However, this still only displays a limited amount of information, especially
    when compared to the `top` command (which we will discuss later in this chapter).
    You can tell the `ps` command to display more information with the `-l` switch:


    ```

    ps -el

    ```


    The output will look like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_m41ce2dc)


    As with the `ls` command, the `-l` switch stands for Long Listing, and generates
    quite a bit more information. Specifically, you can see the UID (user ID) of the
    user who launched the process, the PPID (parent PID) of the parent process of
    a child process, the process’s priority, and numerous other useful pieces of information.
    For even more information, use `ps` with the `-f` switch:


    ```

    ps -elf

    ```


    With these options, the output from `ps` will look like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_m5826ea7)

