    file but not write or execute. You would use this chmod command:


    chmod 754 test.txt


    The chmod command, like chown and the file manipulation commands, also works with
    wildcards and the recursive -R switch. If, for example, you wanted to set permissions
    of 745 for the /test directory, you would use this command:


    chmod -R 754 /test


    With the chmod command, you can quickly and easily manage permissions from the
    command line on your Linux system.


    ***


    ## Chapter 15 - Concept: Text Files


    A great many of the files you will encounter on any Linux system are text files.
    In this chapter we''ll explain what text files are and why it is important that
    you know how to use them.


    WHAT IS A TEXT FILE?


    A text file is, as the name suggests, a file that contains plain text and nothing
    more. If you view the file from the command line, you will be able to read the
    text.


    Many files on your Linux system are a bit more complex. A .doc file, for instance,
    is the Microsoft Word document format. It contains a Word document formatted in
    digital form. The Word program takes that digital information and converts it
    into a text-based form for the end user. If you tried to open a Word file without
    using Word (or LibreOffice or another program that can read Word formats) you
    would only see gibberish.


    There are other kinds of files that contain readable text, but also a great deal
    of other codes and formatting. An HTML file, a file for a web page, is a good
    example of this kind of file. If you view an HTML file from a command line, you''ll
    be able to read it, but the actual text will include a great deal of HTML code.
    The file is, after all, designed to be displayed in a web browser, with the HTML
    code telling the web browser exactly how the file should look.


    A plain text file, by contrast, contains no additional formatting and no code.
    Just plain, unadorned text. In a world of intricately formatted documents and
    feature-rich websites, a plain text file might seem useless, but text files are
    an important part of any Linux system.


    CONFIGURATION FILES


    Text files are significant because almost all of the configuration files, the
    files that control how the Linux operating system and its system services behave,
    are plain text files.


    We''ve already discussed the /etc/passwd and /etc/group files, the two files that
    that control user accounts and groups in Linux. Both of those files are plain
    text files. Using certain commands, you could view them from the command line.
    You could even edit them, though editing those particular files is a bad idea
    (which is why we have the useradd, usermodd, and groupadd commands).'
