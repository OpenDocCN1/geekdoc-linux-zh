    Linux 命令行是一个复杂的环境。我们已经尽力向你展示基础知识，但无法在这里涵盖每一个选项和场景。随着你经验和知识的增长，你将希望执行比本书所涵盖的更高级的任务。幸运的是，Linux
    自带了一套全面的内置帮助系统，我们将在本章向你展示如何使用它。


    ### APROPOS


    使用帮助系统的第一步是使用 `apropos` 命令。


    有时你知道想在命令行中执行什么任务，但不知道应该使用什么命令。这时，`apropos` 命令就派上用场了，因为它允许你通过主题或关键词进行搜索。例如，假设你想执行一项涉及
    `ext3` 文件系统的任务，但无法想起精确的命令。你可以使用 `apropos` 命令进行搜索：


    ```bash

    apropos ext3

    ```


    该命令将生成如下所示输出：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m7546cf3e.jpg)


    输出将列出所有描述中包含“ext3”的命令，帮助你唤起记忆。


    `apropos` 从哪里获取信息？该命令的输出来源于 Linux 的内置手册页（manual pages），我们将在下一节中描述它们。


    ### MAN PAGES（手册页）


    Linux 中的每个命令（至少在理论上）都有一个相应的“手册页”，通常简称为“man page”。手册页是一个描述该命令的文本文档，详细列出其选项并提供使用示例。手册页最早于
    20 世纪 70 年代包含在 UNIX 中，出现在几乎每个 Linux 发行版中。


    如何访问特定命令的手页？你通过 `man` 命令，后跟想要查看手册页的命令名称来实现。例如，如果你想查看 `nslookup` 命令的手页，可以使用以下命令：


    ```bash

    man nslookup

    ```


    这将打开 `nslookup` 命令的手页。


    一旦打开手册页，它的运行方式非常像 `less` 命令。你可以使用向上和向下方向键逐行滚动文本，并配合 `PAGE UP` 和 `PAGE DOWN` 键一次翻一页。与
    `less` 命令一样，`man` 工具支持搜索。按下正斜杠（`/`）键输入搜索术语，`man` 工具将跳转到文本中该术语首次出现的地方。然后你可以按 `N`
    键在实例之间跳转。


    读完手册页后，可以按 `Q` 键退出并返回提示符。


    在手册页中可以哪些信息？手册页的实际布局会因发行版而异，但通常有几个标准部分：


    - 第一部分是标题（title），将列出命令名称。

    - 第二部分是名称（name），将再次显示命令名称，并提供其功能的简要总结。

    - 第三部分是提纲（synopsis），提供命令语法的简要描述。

    - 第四部分是描述（description），这是手册页的核心内容。在描述中，你将详细列出命令的选项和功能。这里通常还有命令使用的示例。

    - 手册页的最后几个部分显示命令本身的编写者、报告 Bug 的地址、版权信息以及可能相关的其他手册页。


    通过 `man` 工具，你可以获取你 Linux 系统上任何命令的有用信息。


    ***


    ## 作者的其他书籍


    ### Ubuntu 初学者指南 (The Ubuntu Beginner’s Guide)


    《Ubuntu 初学者指南》为 Ubuntu Linux 的新用户提供了操作系统的概览，从简单的命令行任务到高级服务器配置。在指南中，你将学习如何从命令行工作、编辑系统配置、管理网络设置、安装和使用强大的应用程序，以及使用
    Ubuntu 托管健壮的服务器应用程序。


    点击此链接阅读 [Ubuntu 学者指南](http://computerbeginnersguides.com/blog/books/the-ubuntu-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-ubuntu-beginners-guide/)


    #### Windows 命令行初学者指南 (The Windows Command Line Beginner’s Guide)


    《Windows 命令行初学者指南》为 Windows 命令行的新用户提供了命令提示符（Command Prompt）的概述，从简单任务到网络配置。在指南中，你将学习如何管理命令提示符、控制文件和目录、分配权限、管理文件共享、管理磁盘设置、创建批处理以及许多其他主题。


    点击此链接阅读 [Windows 命令行初学者指南](http://computerbeginnersguides.com/blog/books/the-windows-command-line-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-windows-command-line-beginners-guide/)


    #### Linux 命令行初学者指南 (The Linux Command Line Beginner’s Guide)


    《Linux 命令行初学者指南》为 Linux 新用户提供了命令行环境的介绍。在指南中，你将学习如何使用 `bash` shell、管理 Linux 文件系统、创建和删除用户及组、获取和分配文件所有权、妥善使用
    `root` 账户、编辑文本文件、诊断网络问题以及许多其他任务。


    点击此链接阅读 [Linux 命令行初学者指南](http://computerbeginnersguides.com/blog/books/the-linux-command-line-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-linux-command-line-beginners-guide/)


    ### Ubuntu 桌面新手指南 (The Ubuntu Desktop Beginner’s Guide)


    想在不学习命令行的情况下使用 Ubuntu 吗？那么这本书适合你！《Ubuntu 新手指南》将教你如何使用桌面界面。在指南中，你将学习如何安装和更新 Ubuntu、配置和使用桌面环境、管理文件系统、连接网络、安装应用程序以及许多其他任务。


    点击此链接阅读 [Ubuntu 桌面指南](http://computerbeginnersguides.com/blog/books/the-ubuntu-beginners-guide/)
    (the-beginners-guide/).


    ### Linux Mint 初学者指南 (The Linux Mint Beginner’s Guide)


    《Linux Mint 初学者指南》将教你如何充分利用 Linux Mint，从使用 `Cinnamon` 桌面环境到高级命令行任务。在指南中，你将学习如何安装
    Linux Mint、使用桌面环境、从命令行工作、编辑系统配置、管理网络设置、安装和使用强大的应用程序，以及使用 Linux Mint 托管健壮的服务器应用程序。


    点击此链接阅读 [Linux Mint 初学者指南](http://computerbeginnersguides.com/blog/books/the-linux-mint-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-linux-mint-beginners-guide/)


    ### Windows 8 初学者指南 (The Windows 8 Beginner’s Guide)


    这本书为 Windows 8 新用户提供了微软新款平板操作系统的概述。书中配插了 200 多张截图，将解释 Windows 8 不同版本的区别、如何充分利用开始屏幕、如何使用
    Windows 8 桌面、从商店安装应用的最佳方法以及许多其他有用项目。


    点击此链接阅读 [Windows 8 初学者指南](http://computerbeginnersguides.com/blog/books/the-windows-8-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-windows-8-beginners-guide/)


