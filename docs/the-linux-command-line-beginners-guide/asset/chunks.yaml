    ***


    ## Introduction


    Welcome to THE LINUX COMMAND LINE BEGINNER''S GUIDE! If you''re reading this book,
    you''re curious about learning to use the command line interface in the Linux
    operating system. Fortunately, you''ve come to the right place. THE LINUX COMMAND
    LINE BEGINNER''S GUIDE will teach you the underlying concepts and principles of
    the Linux command line, and show you powerful commands to make the full use of
    Linux.


    ### WHAT IS LINUX?


    What exactly is “Linux”, though? Undoubtedly you''ve used or heard of numerous
    versions of Linux – Ubuntu Linux, or Linux Mint, or Red Hat Linux. There is a
    bewildering array of operating systems that call themselves “Linux” - Distrowatch.org,
    a popular Linux website, tracks the popularity of a hundred different Linux versions
    on its front page, and there are many hundreds more. With so many different varieties,
    what exactly constitutes a “Linux” operating system?


    “Linux” generally refers to a family of free operating systems based on the Linux
    kernel (a kernel is the core component of a computer operating system). The Linux
    kernel is freely available, both to download and modify, and any operating system
    that runs off the Linux kernel can call itself a Linux operating system. Because
    it is free, and users have the right to modify it however they please, Linux has
    been used for a vast array of practical applications.


    The history of Linux is long and complex, but we can provide a quick overview
    here. During the late 1960s and 1970s, AT&T''s Bell Labs developed the UNIX operating
    system. UNIX was a powerful operating system, and universities across the United
    States soon used it in their computer labs.


    However, universities could not modify UNIX to suit their individual needs. AT&T
    retained rights to the source code, which prohibited any alteration of UNIX. In
    response to this, computer programmer Richard Stallman launched the GNU Project
    in 1983. (GNU stands for “GNU''s Not UNIX.”) Stallman hoped to use the GNU Project
    to create an operating system similar to UNIX that was nonetheless free to alter
    and distribute under the principle of “Free Software”, a philosophical position
    which argued that all software should be free to distribute and alter without
    legal restrictions. The GNU Project and Stallman himself produced a large number
    of software programs. Unfortunately, the GNU Project lacked a viable kernel, the
    necessary core of any operating system.


    This changed in 1991 when a Finnish university student named Linux Torvald grew
    frustrated with the academic licensing for Minix, a UNIX-like operating system
    restricted to educational use only. Torvalds wrote his own kernel, named it Linux,
    and released it under the GNU free license. Combined with the GNU project, the
    Linux kernel provided a freely available operating system – an operating system
    that people could modify, use, and distribute however they saw fit.


    Linux had been born.


    (Many people argue that the proper name of Linux should in fact be GNULinux, in
    recognition of GNU''s vital role, and many GNU programs are used in Linux to this
    day.)


    Because anyone can use or distribute Linux, today Linux and Linux variants run
    on every conceivable computer platform, from smartphones to desktop computers
    to high-end server systems. You can run Linux on your personal desktop or laptop
    computer. It can also power a high-end server farm or a device as small as a smartphone
    or an MP3 player. Even devices like ereaders, such as Amazon''s Kindle or Barnes
    & Noble''s Nook, run using customized versions of Linux.


    These different kinds of Linux are generally called Linux “distributions.” Anyone,
    whether an individual or an organization, can create a Linux distribution. Some
    distributions are commercially supported endeavors, like Red Hat Linux or SuSE
    Linux. Others, like Knoppix or Fedora, are free and community-supported. Some,
    like Ubuntu, fall in the middle, and are offered free to the public while supported
    by an organization.


    If you need to accomplish a computing task, odds are that there is a distribution
    of Linux that will achieve that task.


    ### WHAT IS THE COMMAND LINE?


    This is a book about the Linux command line. But what, exactly, is the command
    line?


    The term “command line” is generally used as shorthand for more accurate term,
    the “command-line interface” (commonly abbreviated as the CLI). Most modern computer
    systems use what is called a graphical user interface (GUI), whether it is a computer
    with icons and a mouse, or the touch-based interface of a tablet computer like
    the iPad. A command-line interface, on the other hands, eschews graphical elements
    entirely. With a command-line interface, instead of graphical icons and windows,
    the user only sees a text prompt at which he can enter commands. To launch programs,
    the user must type the appropriate commands into the prompt and hit the ENTER
    key.


    Most Linux distributions intended for end users to run on home computers use some
    sort of GUI, typically the GNOME or KDE desktop environments. Linux distributions
    intended for server use or as network appliances almost always boot to the command
    line interface. Yet even in graphical Linux environments, you can easily get to
    the command-line interface via a terminal emulator, by a virtual console, or by
    simply booting the computer to the command-line interface. (And if the GUI happens
    to break, a familiarity with the command line will come in handy!)


    Knowledge of the Linux command line, therefore, will be valuable no matter what
    version of Linux you use.


    ### THE PURPOSE OF THIS BOOK


    This book is intended to give the reader a thorough grasp of the basics of the
    Linux command line. It''s not designed as an all-inclusive study, but offers enough
    information to get you started with the basics, and hopefully enough confidence
    for you to start experimenting on your own. Initially, I envisioned this book
    as a reference guide, with common Linux commands sorted alphabetically, but I
    quickly realized this approach would not work. For example, there are numerous
    commands that deal with user accounts, and for every single command, I would have
    to explain the underlying concepts of Linux user accounts over and over again.

    '
