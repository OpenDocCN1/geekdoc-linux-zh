    The first step to working with the ownership of files is to determine who currently
    owns those files. You can do this with the `ls` command. Recall that the `ls`
    command without any options does not display very much information, but that if
    you use the `ls` command with the `-l` option, much more information is displayed:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2e751004.jpg)


    Specifically, the `ls -l` command displays the permissions, the owning user, the
    associated group, the file''s size, the time it was last altered, and the file''s
    name. The owning user is listed first (in this case, “jmoeller”) and the associated
    group is listed next (in this example, the primary group for the `jmoeller` user
    account).


    So long as you have the read permission for a file or a directory, you can use
    the `ls -l` command to view the owners. If you do not have any permissions to
    a file or a directory, you will receive an access denied error message if you
    try to use `ls -l`.


    ## CHANGING OWNERS


    Sometimes you may need to take ownership of files, or to assign them to different
    owners. To use our previous example, if an employee leaves the company, you will
    need to assign ownership of his files to a different user (and probably move those
    files to a new home folder, as well). Or an employee might transfer to a different
    department within the organization, and you will need to change the ownership
    of the files related to his old job.


    To change file ownership, you use the `chown` command – the “chown” stands for
    change owner. Note that to change the owner of a file or a directory, you will
    need to log in as the root user or to posses root-level powers through the `sudo`
    command. If, for instance, you wanted to assign the ownership of a file named
    `test.txt` in the current working directory to the `camalas` account, you would
    use this command:


    ```

    chown camalas test.txt

    ```


    Like many other commands, `chown` works with both relative and absolute file paths.
    If the file you wish to modify is in the current working directory, you can use
    a relative path. If you wanted to use `chown` with an absolute file path, you
    could also do so:


    ```

    chown camalas /home/camalas/test.txt

    ```


    You will notice that `chown` only affects one file or directory at once. How do
    you change the ownership of a large number of files at once? Like the `rm` or
    `cp` commands, all the commands for managing permissions and ownership work with
    both the recursive `-R` option and with wildcards. For instance, to assign ownership
    of every `.doc` file in the `/test` directory to `camalas`:


    ```

    chown camalas /test/*.doc

    ```


    More often than not, you''ll want to assign ownership of entire directories and
    their subdirectories at once. To assign ownership of the `/test` directory, and
    all its files and subdirectories, to `camalas`:


    ```

    sudo chown -R camalas /test

    ```


    Using `chown`, you can quickly manage ownership on your Linux system.


    ## CHANGING GROUP OWNERSHIP


    As we mentioned, every file and directory is assigned an owning group, and permissions
    are assigned to that group. You might find yourself having to change the owning
    group more often than the owning user. You''ll recall from the chapter on groups
    that it is a lot easier to join user accounts to a group and then assign permissions
    based on the group, rather than individually giving permissions to each user account.


    To change the group ownership of a file, use the `chgrp` command. For example,
    if you wanted to change the group ownership of the `test.txt` file to the `ghosts`
    group:


    ```

    chgrp ghosts test.txt

    ```


    Like `chown`, `chgrp` works with either absolute or relative file paths. If the
    file is in the current working directory, `chgrp` can find it, otherwise you will
    need to use an absolute file path:


    ```

    chgrp ghosts /home/camalas/test.txt

    ```


    And like `chown`, `chgrp` also works with wildcards and the recursive `-R` switch.
    To change the group ownership of the `/test` directory and all its files and subdirectories,
    use this command:


    ```

    sudo chgrp -R ghosts /test

    ```


    Using `chown` and `chgrp` lets you easily change the user and group ownership
    of files and directories from the Linux command line. However, once you''ve set
    the ownership, you will need to assign permissions to the owner and to the group.
    We''ll explain those concepts more in the next chapter.


    ***


    ## Chapter 13 - Concept: File And Directory Permissions


    We''ve mentioned the concept of permissions frequently in the last few chapters.
    In the next two chapters, we''ll first explain the concept of permissions in the
    Linux filesystem. You''ll learn about the three major permissions every file and
    directory can be assigned – read, write, and execute. You''ll also learn about
    the numeric codes for those permissions, and the commands necessary to modify
    permissions.


    ### WHAT ARE PERMISSIONS?


    “Permissions”, also known as “access control”, are rules that define which users
    get to access which files, and what those users can do if they have access to
    those files. Permissions are absolutely necessary to secure your Linux system,
    especially if you have multiple users logging into the same machine. In conjunction
    with user and group ownership, properly assigned permissions prevent regular users
    from tampering with important system files and directories, and block regular
    users from viewing each other''s documents.


    ### HOW ARE PERMISSIONS ASSIGNED?


    For purposes of assigning permissions, Linux users are divided into three separate
    classes – the owning user, the owning group, and all other accounts on the system.
    That means you can set different levels of permissions for the three different
    classes – you could allow the owning user to modify the file, you could allow
    the accounts in the owning group to only read it, and you could block all accounts
    from viewing it entirely. This is why it''s important to have an understanding
    of ownership and groups – it does no good to assign permissions if you don''t
    know to whom you are assigning them.


    In the next section we will examine the three permissions you can assign to a
    file.


    ### THE THREE PERMISSIONS


    The are three permissions that can be assigned to each of the classes of users
    – the Read permission, the Write permission, and the Execute permission.


    The Read permission allows you to access the file, but not to delete it or alter
    it. For example, you could open a document with the Read permission, but you could
    not edit it, and you could not delete it. If the Read permission is assigned to
    a directory, you can list the files within the directory (but unless you also
    have the Read permission to the files themselves, you won''t be able to read them).
    Note that having the Read permission for a directory allows you to view the file
    names, but no other information about them.


    The Write permission allows you alter or delete a file. To return to our example
    document, if you have the Write permission, you could delete it or make changes
    to it. If you have the Write permission to a directory, you can create files within
    it. (Ironically, if you don''t have the Read permission to a directory while you
    have the Write permission, you can create files within the directory, but cannot
    read them).


    The Execute permission allows you to run a file as a program. Any application
    or program files need to have this permission, otherwise they won''t work. If
    you have the Execute permission for a directory, you can cross it to view the
    contents of its subdirectories.


    These permissions are combined to make up a file or directory''s total permissions.
    Remember that each file or directory gets three sets of permissions – the permissions
    for the owning user, the permissions for the owning group, and the permissions
    for all other accounts on the system.


    In the next chapter, we''ll show you how to both view and change the permissions
    for files and folders.

