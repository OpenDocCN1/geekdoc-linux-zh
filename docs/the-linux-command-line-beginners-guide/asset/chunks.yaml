- fmt: "\nOf course, logging out and logging back in every time you need to perform\
    \ an administrative task will quickly prove cumbersome. To counter that, a command\
    \ called `su` lets you log in as `root` from within your own account. Once you\
    \ are finished in your root session, you need only type `exit` to return to your\
    \ own user account.\n\nWhat happens if you work on a system where multiple people\
    \ need access to the user account? Sharing the `root` password with multiple people\
    \ is a security risk (since those people might, in turn, share the password with\
    \ others). It also makes auditing and tracking system changes more difficult.\
    \ If the `root` user makes a change to the system, it's hard to figure out who\
    \ is responsible if five different people know the root password. \n\nTo get around\
    \ this problem, Linux offers the use of the `sudo` command. The `sudo` command\
    \ lets you temporarily “borrow” the powers of the `root` user to perform a task.\
    \ Only users belonging to a specific group (usually the admin group) can use the\
    \ `sudo` command, and their actions are recorded in a log file.\n\nIn fact, with\
    \ the `sudo` command, you can even keep the root account disabled and still use\
    \ root-level powers. Keeping the root account activated is something of a security\
    \ risk, since if an attacker guesses your root password, he has complete control\
    \ over your entire system. Some distributions (like Ubuntu) disable the root account\
    \ by default, and recommended that administrators use the `sudo` command to perform\
    \ administrative tasks.\n\nIn the next chapter, we'll take a closer look at using\
    \ the `su` and `sudo` commands.\n\n## Chapter 8 - Commands For Using The Root\
    \ Account\n\nIn this chapter, we will explain how to use root's powers safely\
    \ via the `su` and the `sudo` commands.\n\n### THE SU COMMAND\n\nThe `su` command\
    \ stands for “switch user.” In its default state, it prompts you to log into the\
    \ root account. However, you can actually use `su` to switch to any account on\
    \ the system for which you know the password.\n\nFirst, though, we'll discuss\
    \ root. To switch to the root account, simply type `su` without any switches:\n\
    \n```\nsu\n```\n\nEnter the root password, and `su` will switch you to the root\
    \ account without terminating your session under your own account. Once you've\
    \ finished using the root account, type the `exit` command. You'll log out of\
    \ root, and return to your own session.\n\nYou can also use `su` to log in as\
    \ any other user in the system (assuming you know their password – if you don't,\
    \ you must first use the `passwd` command to change their password). For example,\
    \ if you want to log in using the `camalas` account from the previous chapter,\
    \ use this command:\n\n```\nsu camalas\n```\n\nEnter the password for `camalas`,\
    \ and you'll log in using that account. Once you are finished, you can close camalas's\
    \ session by using the `exit` command.\n\n### THE SUDO COMMAND\n\nThe `sudo` command\
    \ offers a more sophisticated way to deal with root powers. The `sudo` command\
    \ stands for “switch user do” - though because it's so often used for administrative\
    \ tasks, it's often called the “superuser do” command. With `su`, you have to\
    \ log in completely as root. The `sudo` command only “borrows” the powers of root\
    \ for a brief time to complete a specific task, and then completes. This means\
    \ you can perform administrative tasks from your regular user account, so long\
    \ as your account has permission to use `sudo`.\n\nFor example, let's say you\
    \ wanted to use the `usermod` command to lock the `camalas` account from the session\
    \ of a standard account. Type this command:\n\n```\nusermod -L camalas\n```\n\n\
    You will receive an access denied error message.\n\nHowever, if you preface the\
    \ command with `sudo`, you will get better results:\n\n```\nsudo usermod -L camalas\n\
    ```\n\nBefore executing the command, `sudo` will ask for your password. Enter\
    \ your password, and `sudo` will check to see if your password is on the list\
    \ of accounts allowed to use `sudo`. If it is, `sudo` will execute the command\
    \ as root.\n\nWe mentioned the “admin” group earlier in this book. In most Linux\
    \ distributions, the admin group is the one that has the right to use `sudo` to\
    \ employ root powers. The list of accepted sudo users is defined in the `/etc/sudoers`\
    \ file. (Appropriately enough, you need root rights to view the `/etc/sudoers`\
    \ file.) In most distributions, the list of sudoers consists of the admin group\
    \ and nothing else.\n\nThe use of `sudo` is also recorded in a log file. In most\
    \ distributions, `sudo` use is record in the `/var/log/auth.log` file. Scanning\
    \ this file will let you see who is using `sudo` and for what tasks.\n\nThis is\
    \ a book about the command line, but sometimes you might need to run a graphical\
    \ application as root. You can do this using the `gksudo` command – use the `gksudo`\
    \ command in a terminal emulator application, and the application you've launched\
    \ with `gksudo` will appear in a window in the GUI.\n\n## Chapter 9 - Concept:\
    \ Groups\n\nThe last four chapters should have given you a solid grasp of working\
