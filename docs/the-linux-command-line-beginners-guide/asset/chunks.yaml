    ![](img/cover.jpg)

    ![封面](img/cover.jpg)


    # Linux 命令行入门指南


    Jonathan Moeller


    ## 描述


    《Linux 命令行入门指南》为 Linux 新手介绍了命令行环境。


    在本指南中，你将学习如何：


    - 复制、移动和删除文件及目录。

    - 创建、删除和管理用户。

    - 创建、删除和管理组。

    - 使用虚拟终端。

    - 使用 `bash` 壳。

    - 使用 `su` 和 `sudo` 安全地使用 root 账户。

    - 修改文件和目录的权限和所有权。

    - 从命令行创建并编辑文本文件，而无需使用图形化编辑器。

    - 诊断网络连接问题。

    - 以及许多其他主题。


    ***


    Linux 命令行入门指南


    Jonathan Moeller


    版权所有 2012 Jonathan Moeller。


    最初于 2012 年 2 月以电子书格式出版。

    Smashwords 版


    封面图片版权所有 Yanni Raftakis | Dreamstime.com


    保留所有权利。


    书中可能出现注册商标名称。我们并非在每次出现商标名称时都使用商标符号，而是仅以编辑方式使用并为了商标所有者的利益，无侵犯商标的意图。


    书中的信息按“现状”分发，不提供任何保证。尽管在准备本作品时已采取一切预防措施，但作者或出版者对于因书中包含的信息直接或间接引起或据称引起的任何损失或损害对任何个人或实体不承担任何责任。


    ***


    ## 引言


    欢迎阅读《Linux 命令行入门指南》！如果你正在阅读这本书，说明你对学习使用 Linux 操作系统中的命令行界面感兴趣。幸运的是，你来对地方了。《Linux
    命令行入门指南》将教你 Linux 命令行的底层概念和原理，并向你展示强大的命令，以充分利用 Linux。


    ### 什么是 Linux？


    然而，“Linux”究竟是什么？无疑，你用过或听过许多版本的 Linux —— Ubuntu Linux、Linux Mint，亦或是红帽 Linux（Red
    Hat Linux）。自称为“Linux”的操作系统多到令人眼花缭——Distrowatch.org 是一个流行的 Linux 网站，在其首页跟踪一百个不同
    Linux 版本的流行程度，此外还有成百上千个。有了这么多不同的种类，究竟什么构成了“Linux”操作系统？


    “Linux”通常指的是一组基于 Linux 内核的自由操作系统（内核是计算机操作系统的核心组件）。Linux 内核是免费供下载和修改的，任何运行在 Linux
    内核上的操作系统都可以称自己为 Linux 操作系统。因为它是免费的，而且用户有权按照自己的意愿对其进行修改，Linux 已被广泛应用于各种实际领域。


    Linux 的历史悠久而复杂，但我们在这里提供一个快速概览。在 20 世纪 60 年代后期和 70 年代，AT&T 实验室开发了 UNIX 操作系统。UNIX
    是一个强大的操作系统，美国各地的大学很快在他们的计算机实验室使用了它。


    然而，大学无法修改 UNIX 来满足他们各自的需求。AT&T 保留了源代码的权利，这禁止对 UNIX 进行任何更改。作为回应，计算机程序员理查·斯尔曼（Richard
    Stallman）于 1983 年启动了 GNU 项目。（GNU 代表“GNU Is Not UNIX”）。斯尔曼希望通过 GNU 项目创建一个与 UNIX
    相似的操作系统，但根据“自由软件”原则可以自由修改和分发，这种哲学立场主张所有软件都应该在没有法律限制的情况下自由分发和修改。GNU 项目和斯尔曼本人产生了大量的软件程序。遗憾的是，GNU
    项目缺乏一个可行的内核，这是任何操作系统所必需的核心。


    这种情况在 1991 年发生了变化，当时一位名为 Linux Torvald（林纳·托瓦尔斯）的芬兰大学生对 Minix（一种仅限于教育使用的类 UNIX
    操作系统）的学术许可感到沮丧。托瓦尔斯编写了自己的内核，将其命名为 Linux，并在 GNU 自由许可下发布了它。与 GNU 项目结合，Linux 内核提供了一个免费的操作系统
    —— 一个人们可以根据喜意修改、使用和分发的操作系统。


    Linux 出生了。


    （许多人认为 Linux 的正式名称实际上应该是 GNULinux，以承认 GNU 的关键作用，而且至今仍有许多 GNU 程序在 Linux 中使用。）由于任何人都可以使用或分发
    Linux，如今 Linux 和 Linux 变体运行在各种想象得到的计算机平台上，从智能手机到桌面电脑再到高端服务器系统。你可以在你的个人桌面电脑或笔记本电脑上运行
    Linux。它还可以驱动高端服务器集群，或像手机或 MP3 播放器一样小的设备。即使是电子阅读器，如亚马逊的 Kindle 或巴恩斯与利的 Nook，也是使用自定义版本的
    Linux 运行的。


    这些不同类型的 Linux 通常被称为 Linux “发行版”（distributions）。无论个人还是组织，任何人都可以创建 Linux 发行版。某些发行版是商业支持的项目，如红帽
    Linux（Red Hat Linux）或 SuSE。另一些如 Knoppix 或 Fedora 是免费且受社区支持的。有些如 Ubuntu 则介于之间，向公众免费提供并由组织支持。


    如果你需要完成一项计算任务，很可能有一个 Linux 发行版可以实现该任务。


    ### 什么是命令行？


    这是一本关于 Linux 命令行的书。但命令行究竟是什么呢？


    “命令行”（command line）一词通常作为更准确的术语“命令行界面”（command-line interface，简称 CLI）的缩写。大多数现代计算机系统使用所谓的图形用户界面（GUI），无论是带有图标和鼠标的电脑，还是像
    iPad 这样的平板电脑的触摸界面。另一方面，命令行界面完全摒弃了图形元素。在命令行界面中，用户看到的不是图形图标和窗口，而是一个文本提示符，可以在其中输入命令。要启动程序，用户必须在提示符中输入相应的命令并按下回
    键。


    大多数供终端用户在家庭电脑使用的 Linux 发行版使用某种 GUI，通常是 GNOME 或 KDE 桌面环境。用于服务器或作为网络设备的 Linux 发行版几乎总是启动到命令行界面。然而，即使在图形
    Linux 环境中，你也可以终端模拟器、虚拟控制台或只需将计算机启动到命令行界面来轻松进入命令行界面。（如果 GUI 恰好坏了，熟悉命令行将大有用武！）


    因此，无论你使用哪个版本的 Linux，Linux 命令行的知识都是价值的。


    ### 本书的目的


    这本书旨在让读者彻底掌握 Linux 命令行的基础知识。它并非设计为无完备的研究，而是提供了足够的信息让你开始基础学习，并希望给你足够的信心让你开始自己尝试。


