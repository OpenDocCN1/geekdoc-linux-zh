  raw: 'In addition to the information offered by the –l switch, the addition of the
    –f switch also causes the ps command to display the date the process was launched
    and the location of its executable on the file system.


    Even ps –elf is only a static snapshot of the processes currently running on the
    system. The running processes can change very quickly on a Linux system, and you
    might want to monitor them in real-time. That’s where the top command comes in
    handy.


    MONITOR PROCESSES WITH THE TOP COMMAND


    The top command has been around forever, and is included in practically every
    variant of Linux. It displays a variety of useful statistics, including the “top”
    users of CPU time (hence the command’s name), the amount of memory running processes
    are using, the amount of virtual memory they are using, the process’s priority,
    the process’s owning user, and numerous other useful pieces of information. To
    launch top, simply type the command at the command prompt:


    top


    The command''s output will look like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_2346a4b5.jpg)


    Once launched, top stays running, displaying statistics in real time. Processes
    are listed by their process ID number, along the name of the command that started
    the process.


    There’s a lot of information listed in top, so let’s take a look at the available
    statistics:


    PID: A process’s process ID number.


    USER: The process’s owner. Processes owned by root are usually system processes,
    and should be left alone unless they cause problems.


    PR: The process’s priority, which determines how much attention the CPU will give
    this process over other processes. The lower the number, the higher the priority.


    NI: The nice value of the process, which affects its priority.


    VIRT: How much virtual memory the process is using.


    RES: How much physical RAM the process is using, measured in kilobytes.


    SHR: How much shared memory the process is using.


    S: The current status of the process (zombied, sleeping, running, uninterruptedly
    sleeping, or traced).


    %CPU: The percentage of the processor time used by the process.


    %MEM: The percentage of physical RAM used by the process.


    TIME+: How much processor time the process has used.


    COMMAND: The name of the command that started the process.


    Of course, you may want to sort the top display by a certain category from least
    to greatest. This is especially useful when you want to figure out what process
    is hogging the most CPU time or memory. Hitting the ‘t’ key will sort the processes
    by CPU time. Hitting ‘l‘ will sort by load average, and ‘m‘ by memory info.


    You can also use top to kill uncooperative processes. To do this, you’ll need
    to make note of the process ID you want to kill. Hit the “k” key while top is
    running, and the utility will ask you to input a process ID number. Input the
    number, hit Enter, and then hit Enter again when it asks if you want to kill the
    process (top assumes you mean “yes” when you hit enter). The top utility will
    then kill the process.


    Once you’ve finished with top, hit the q key to exit and return to the command
    line.


    Most often, you’ll use the top and ps commands to track down a process that’s
    causing trouble. In the next section, we’ll discuss how to terminate troublesome
    processes with the (appropriately named) kill command.


    STOPPING PROCESSES


    The kill command, as you might guess from the name, lets you kill running processes.


    Technically, the kill command sends signals to running processes. However, this
    command is most commonly used to send the kill a running process. In most cases,
    you will use this command to terminate a process that has frozen up, refuses to
    quit gracefully, or is otherwise misbehaving.


    Note that to use kill, you need to know the PID (process identification number)
    of the process you wish to terminate. You can find out the PID using either the
    ps or the top commands (detailed previously in this chapter). Also, unless you
    launched a specific process, you will need root powers to kill it.


    To use kill, simply type the command with the PID of the targeted process. For
    instance, to terminate a process with the PID of 2589:


    kill 2589


    Like other commands, kill can be modified with a number of options. Remember that
    kill operates by sending signals to the designated process. The kill command uses
    64 separate signals, which you can list with the –l switch:


    kill –l


    Of those 64 signals, four of them are commonly used. You tell kill which signal
    to send by using the signal’s number as a command option – for instance, kill-
    9 2589.


    The 15 signal is the default kill signal. 15 tells the targeted process to cease
    immediately, but only after shutting down gracefully. Since 15 is the default
    kill signal, you don’t usually have explicity specify it, but if you did, the
    command to send the 15 signal to PID 2589 would look like this:


    kill -15 2589


    Signal number 1 less drastic. It merely tells the process to restart, while keeping
    the same PID. To use signal number 1:


    kill -1 2589


    Signal number 2 sends the CTRL+C character combination to a process, which is
    commonly used to break out of a running process (the ping command, for instance).
    To send signal number 2 to a process:


    kill -2 2589


    Finally, the most drastic signal is number 9\. Signal number 9 immediately kills
    a process, and does not give it the option to close gracefully or clean up after
    itself first. Generally, you should only use signal number 9 to terminate a process
    if nothing else has worked first:


    kill -9 2589


    Using ps, top, and kill, you can manage the running processes on your Linux system
    from the command line, and quickly respond to any problems.


    ***


    ## Chapter 24 - Concept: Installing Software


    Linux''s built-in suite of commands and utilities are quite useful, and many Linux
    distributions come with an array of powerful applications. However, no single
    distribution will come with every application you will conceivably need. At some
    point you''ll have to install software on your Linux system. In this chapter we''ll
    explain how install software on a Linux system works, and the next chapter will
    show you some commands for doing just that.


    DIFFERENCES FROM WINDOWS


    For people used to Microsoft Windows, it can be difficult to figure out how to
    install software on a Linux system. Usually, on a Windows machine, you download
    the installer file from the website, double-click on it, and follow the steps
    offered by the install wizard. Or you insert the CD or DVD into your optical drive
    and follow the AutoPlay prompt, or navigate to the DVD''s root menu through Windows
    Explorer and double-click on the SETUP.EXE file. One of the strengths of Microsoft
    Windows is the relative ease of installing software. (In fact, this ease of installing
    software on Windows is something of a weakness – consider how easy it is to get
    a virus on a Windows computer!)


    Installing software on a Linux system used to be much harder than it is now, and
    the graphical installation tools have progressed greatly in the last few years.
    That said, it is still quite different than installing software on a Microsoft
    Windows system.


    SOFTWARE PACKAGES


    Most software for Linux system comes in the form of a software “package”. A software
    package is an installer that has been prepared to work with a specific Linux distribution.
    On any Linux distribution, it is in fact possible to compile your own executable
    files from the source code. (This is why when a software developer publicly posts
    his code, his application is known as “open source” - the source code is open.)
    Compiling your own software from source, however, doesn''t always work if you
    don''t know what you''re doing. There''s also the problem of “dependencies” -
    other applications or services the software needs to install properly. Early Linux
    systems could encounter a condition known as “dependency hell”, where you have
    to install dependency after dependency in order to get the original application
    you wanted up and running.'
