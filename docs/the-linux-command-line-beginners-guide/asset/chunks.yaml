    even thousands of files at the same time.


    What are wildcards? “Wildcards” are special characters that represent multiple
    other characters, or even all other possible characters. The first wild card character,
    the question mark (?), represents one potential character. For example, let''s
    say you had seven files in your current working directory named Caina1.doc, Caina2.doc,
    and so forth. If you wanted to delete them, you could use the rm command to remove
    them one at a time. Or, you could use rm in conjunction with a wildcard:


    rm Caina?.doc


    This will delete every file in the working directory that begins with “Caina”,
