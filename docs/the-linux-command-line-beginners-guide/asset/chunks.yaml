    If 10.10.11.254 is up, the ping command will generate an output like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2ef51a2a.jpg)


    The ping command will continuing pinging the target until you hit CTRL-C to cancel
