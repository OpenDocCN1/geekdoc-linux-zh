    path are not responding, and then hopefully determine a solution. For instance,
    to trace the path to 10.10.11.254, you would use traceroute like this:


    traceroute 10.10.11.254


    The output will look something like this, with one line for each “hop” (another
    device in the chain) to the destination:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m7e4bdb18.jpg)


    The traceroute command by default runs up to thirty hops.


    ***


    ## Chapter 20 - Concept: Disks and Removable Media


    Most of our commands so far have focused on working with the main hard drive in
    your Linux system. However, there are different kind of disks you can use with
    your Linux system – removable media, like external hard drives, USB flash drives,
    optical disks, and others. In this chapter we''ll explain how the Linux operating
    system interacts with removable media, and in the following chapter we''ll show
    you some commands for working with removable media.


    NO DRIVE LETTERS


    If you''re used to working in a Windows environment, there is one important fact
    to keep in mind when working with disks on a Linux system – Linux does not use
    letters to represent separate drives!


    In Windows, every disk or drive connected to the computer is assigned a drive
    letter. The computer''s main hard drive usually gets the letter C. In the old
    days of floppy disks, the floppy drive got the letter A. The first optical drive
    on the system gets the letter D or E, generally. As you plug additional drives
    into a Windows computer, the Windows operating system assigns them the next available
    letter in the alphabet.


    Linux uses a different system called mount points, which we''ll describe in the
    next section.


    MOUNTED DRIVES


    Earlier in this book, we compared the Linux filesystem to a tree, with the root
    directory as the trunk, and the various subdirectories as branches shooting off
    from that main trunk. With Windows, each drive letter is in essence its own tree
    – the C drive gets its own root directory, as does the D drive and so on. When
    you plug a USB drive or insert an optical disk into a Linux system, the computer
    does not create a new filesystem tree. Instead, what Linux does is essentially
    graft a new branch onto the filesystem tree for the removable drive.'
