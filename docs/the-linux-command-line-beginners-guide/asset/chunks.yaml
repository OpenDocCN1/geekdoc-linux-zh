    As mentioned above, there are numerous different Linux distributions. Most of
    the commands described in this book will work on the majority of different Linux
    distributions. That said, sometimes individual Linux distributions will configure
    the commands in a specific way, so sometimes a command or option that works on
    one Linux distribution will not work on a different distribution. This tends to
    happen only with the more exotic or esoteric commands and utilities, but it does
    happen. It is always a good idea to check a distribution''s documentation and
    man pages for precise information (and we''ll show you how to do just that in
    the final chapter of this book).


    The screenshots for this book were taken on Ubuntu 11.10, Linux Mint 12 and Fedora
    16.


