    The previous chapter explained the concept of Linux file permissions. In this
    chapter you will learn how to use the command line to view and modify file permissions.
    We''ll show you how to find a file''s permissions, and how to change them.


    # DETERMINE A FILE''S PERMISSIONS


    As with determining a file''s ownership and group ownership, you can use the `ls`
    command to find out a file''s permissions. The `ls` command, without any options,
    does not present very much useful information. But with the `-l` option, the command
    lets you see the permissions of a file. The output will look something like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2e751004.jpg)


    The permissions for the various files and directories are on the left side of
    the command''s output – the seemingly random strings of `r`, `w`, and `x` characters.
    However, once you know what these characters mean, you can determine the permissions
    of a file at a glance.


    The `-` character at the start of the listing indicates that the entrie belongs
    to a file; if there''s a `d` there instead, it belongs to a directory. As for
    the rest of the characters, `r` stands for Read, `w` stands for Write, and `x`
    stands for Execute. It might seem strange that the permissions are repeated three
    times, but it''s not – remember that permissions are assigned to three different
    classes of user for each file. Take, for example, a permissions string that looks
    like this:


    `rwxrwxrwx camalas users`


    The first `rwx` group means that the file''s owner (in this case, `camalas`) has
    the Read, Write, and Execute permissions. The second `rwx` means that the owning
    group (the `users` group) has the Read, Write, and Execute permissions, while
    the third means that everyone else also gets the Read, Write, and Execute permissions.
    To put it succinctly, everyone on the Linux system can Read, Write, and Execute
    that file.


    Let''s look at a different example:


    `-rwxrw-r-- 6 camalas users 4096 Dec 9 14:56 test.txt`


    In this example, we see that the owner of `test.txt`, the user account for `camalas`,
    gets the Read, Write, and Execute permissions. The group gets Read and Write,
    while everyone else only gets the Read permission.


    What if the permissions conflict? Like, what if `camalas` has only Read permission
    to a file, but everyone else gets Read, Write, and Execute? In that case, `camalas`
    gets the entire set of Read, Write, and Execute permissions to the file. Permissions
    are "additive" - that means your permissions to a file are "added up" from the
    owner''s permissions, the group permissions, and everyone other account''s permissions.
    Even if you''re not the owner of a file, or a member of the owning group, you
    can still view and alter a file if the final class of permissions has the Read
    and Write permissions.


    # CHANGING PERMISSIONS


    So, how to change a file''s permissions? This is done using the `chmod` command.
    (In Linux, a file''s total permissions are called the "mode", so `chmod` stands
    for "change mode.") As usual, if you want to change a file''s permissions, you
    need to be root or using `sudo` to borrow root''s powers. The `chmod` command
    uses both alphabetical and numerical shorthand to represent the various permissions.


    If you want to add the Execute permission to the owning user of a file, you would
    use `chmod` like this (note that in `chmod`, `u` stands for the owning user, and
    `x` stands for the Execute permissions):


    ```

    chmod u+x test.txt

    ```


    If you wanted to add the Execute permission to the owning group, which is represented
    with a `g` in `chmod`:


    ```bash

    chmod g+x test.txt

    ```


    Finally, if you wanted to add the execute permission for everyone on the system:


    ```bash

    chmod o+x test.txt

    ```


    (In `chmod`, `o` stands for Others, or all other accounts on the system.)


    And to do all three at once:


    ```bash

    chmod u+x,g+x,o+x test.txt

    ```


    Alternately, to remove permissions, replace the `+` sign with the `-` symbol:


    ```bash

    chmod u-x,g-x,o-x test.txt

    ```


    All this typing is rather cumbersome, isn''t it? Fortunately, file permissions
    in Linux have numeric codes - mathematical shorthand, if you will. The Read permission
    is assigned the number `4`, Write the number `2`, and Execute the number `1`.
    Having no permissions is represented by a zero. You then calculate the permissions
    by adding up the numbers. Take this example:


    `-rwxrw-r-- 6 camalas users 4096 Dec 9 14:56 test.txt`


    The file''s owner (`camalas`) receives the Read, Write, and Execute permissions,
    the owning group gets Read and Write, and everyone else gets Read. Since Read
    is `4`, Write is `2`, and Execute is `1`, `camalas` gets a permission of `7`.
    The owning group of `users` gets a total of `6`, and everyone else gets `4`. The
    permissions can then be expression numerically as this:


    `764`


    And so to set the permissions as `764`, you would use the `chmod` command:


    ```bash

    chmod 764 test.txt

    ```


    Much easier to simply type `764`, isn''t it?


    Or to give the owning user full permissions, while denying permissions to both
    the owning group and everyone else, use this command:


    ```bash

    chmod 700 test.txt

    ```


    Needless to say, this makes using the `chmod` command far less cumbersome. As
    another example, let us say you wanted to change the permissions of `test.txt`
    so that the owner can read, write, but not execute.


    ***


    ## Chapter 15 - Concept: Text Files


    A great many of the files you will encounter on any Linux system are text files.
    In this chapter we''ll explain what text files are and why it is important that
    you know how to use them.


    ### WHAT IS A TEXT FILE?


    A text file is, as the name suggests, a file that contains plain text and nothing
    more. If you view the file from the command line, you will be able to read it.


    Many files on your system are a bit more complex. A `.doc` file, for instance,
    is the Microsoft document format. It contains a Word document in digital form.
    The Word program takes that digital information and converts it into a text-based
    form for the end user. If you tried to open a Word file without using Word (or
    LibreOffice or another program that can read Word formats) you would only see
    gibish.


    There are other kinds of files that contain readable text, but also a great deal
    of other codes and formatting. An HTML file, a file for a web page, is a good
    example of this kind of file. If you view an HTML file from a command line, you''ll
    be able to read it, but the actual text will include a great deal of HTML code.
    The file is, after all, designed to be displayed in a web browser, with the HTML
    code telling the web browser exactly how the file should look.


    A plain text file, by contrast, contains no additional formatting and no code.
    Just plain, unorned text. In a world of intricately formatted documents and feature-rich
    websites, a plain text file might seem useless, but text files are an important
    part of any Linux system.


    ### CONFIGURATION FILES


    Text files are significant because almost all of the configuration files, the
    files that control how the Linux operating system and its system services behave,
    are plain text files.


    We''ve already discussed the `/etc/passwd` and `/etc/group` files, the two files
    that control user accounts and groups in Linux. Both of those files are plain
    text files. Using certain commands, you could view them from the command line.
    You could even edit them, though editing those particular files is a bad idea.

