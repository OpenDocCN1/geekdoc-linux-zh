    然而，尽管 `/etc/passwd` 和 `/etc/group` 有限制，但在 Linux 上你仍然可以通过编辑文本文件来更改大多数其他系统设置。如果你正在运行
    GUI 界面，可以通过图形化界面更改系统设置，而且服务器系统通常会为其程序提供 Web 界面。根结底，这些程序只是为你编辑文本文件的图形化工具——你完全可以自己去编辑这些文本文件。


    我们已经提到过主目录下的隐藏 bash shell 配置文件。如果你在主目录下运行 `ls -a` 命令，你将看到几个隐藏文件和文件夹。这些（几乎）都是控制你命令行会话的基于文本的配置文件。


    大多数系统级配置文件都位于 `/etc` 目录。我们已经提到过 `/etc/passwd`、`/etc/shadow`、`/etc/group` 和 `/etc/gshadow`
    文件，它们都控制用户账户和组，并且都位于 `/etc`。你可以在 `/etc` 中找到绝大多数系统服务和应用程序的配置文件——这些文件要么在 `/etc`
    本，要么在 `/etc` 的子目录中。


    用户应用程序通常不会将配置文件存储在 `/etc` 中——它们倾向于存放在 `/usr/lib` 中。然而，大多数系统配置文件和服务系统配置文件都是存储在
    `/etc` 中的纯文本文件。这使得了解如何查看以及如何编辑纯文本文件变得非常重要。


    在接下来的章节中，我们将向你展示如何操作。


    # 第 16 章 - 查看文本文件的命令


    在本章中，我们将向你展示如何从命令行查看文本文件。Linux 带有许多用于查看文本文件的命令。它们都能显示文本，但每个命令的工作方式略有不同，某些在特定情况下比其他的效果更好。在本章结束时，你将熟悉最常用的几个命令。


    ## 创建空文件


    你可能偶尔需要创建一个空文件，稍后向其中写入某些文本。如果你需要更详细地分析某个命令或工具的输出，或者为了将其保存以备后后参考，这样做很常见。使用特殊的输出重定向符号——大于号字符（`>`），你可以将命令的输出移动到文件中。例如，要将
    `ls -l` 命令的输出重定向到名为 `data` 的文件，命令看起来如下：


    ```

    ls -l >> data

    ```


    不过，你可能想先创建该文件。要在命令行中创建一个完全空的文件，请使用 `touch` 命令：


    ```bash

    touch data

    ```


    这将在当前工作目录下创建一个名为 `data` 的文件。


    ## 使用 cat 命令查看文本文件


    查看文本文件的基本命令是 `cat` 命令——它将文件内容显示在屏幕上，如果内容太长无法在一个屏幕内显示，命令将向下滚动直到到达文件末尾。要查看当前工作目录下名为
    `document.txt` 的文本文件，只需像这样使用 `cat` 命令：


    ```bash

    cat document.txt

    ```


    输出将显示 `document.txt` 的内容。


    你也可以使用绝对路径而非相对路径配合 `cat` 命令。如果当前工作目录是你的家目录，而你想查看位于 `/etc` 目录下的 `config.txt` 文件，你将使用此命令：


    ```bash

    cat /etc/config.txt

    ```


    这将显示 `config.txt` 文件的内容。


    很多时候，文本文件的内容太大，无法显示在一个屏幕内，并且在你读完所有内容之前它就会滚出顶部。这时 `more` 命令就派上用场了。你可以将 `cat` 命令的输出通过到
    `more` 命令，这将让你一次查看一个屏幕的信息。例如，如果你想一次一个屏幕查看 `document.txt` 的内容：


    ```bash

    cat document.txt | more

    ```


    这将显示 `document.txt`，并在每页信息处暂停（你可以按任意键继续）。


    你还可以通过将 `cat` 的输出通过到 `grep` 命令来搜索输出中的任何特定术语。`grep` 命令允许你在文本流输出中搜索特定术语。假设你想在 `document.txt`
    中搜索任何出现的“cheese”单词的实例。要这样做，你将 `cat` 的输出通过到 `grep`：


    ```bash

    cat document.txt | grep cheese

    ```


    这将列出 `document.txt` 文件中每一个出现的“cheese”单词。


    `cat` 命令还有几个实用的开关。如果你想让 `cat` 的输出按行编号显示，你将使用 `--b` 开关：


    ```bash

    cat –b document.txt

    ```


    `cat` 命令结合 `more` 和 `grep` 命令，可以让你快速从命令行查看文件，并在文件中找到所需的搜索术语。


    ## 查看文本文件的开头


    `cat` 命令显示文本文件的全部内容，但有时你只想看到文件的开头。要这样做，你可以使用 `head` 命令，它默认只显示文本文件的前五行。例如，要查看当前工作目录下名为
    `test.txt` 的文本文件的前五行，你将使用此命令：


    ```bash

    head test.txt

    ```


    输出将显示文件的前五行。


    `head` 命令也支持绝对路径。要查看位于 `/etc` 的 `test.txt` 文件的前五行，你将使用此命令：


    ```bash

    head /etc/test.txt

    ```


    `head` 命令还允许你选择显示的行数。假设你只想查看 `test.txt` 的前三行：


    ```bash

    head -3 test.txt

    ```


    通过该选项，你可以使用 `head` 查看文本文件的开头。


    ## 查看文本文件的结尾


    如果 `head` 命令让你查看文件的开头，那么有时你可能只想查看文件的结尾。`tail` 命令的作用恰好相反——它显示文件的最后五行。例如，要查看当前工作目录下名为
    `test.txt` 的文本文件的最后五行，你将使用此命令：


    ```

    tail test.txt

    ```


    输出将显示文件的最后五行。


    `tail` 命令也支持绝对路径。要查看位于 `/etc` 的 `test.txt` 文件的最后五行，你将使用此命令：


    ```bash

    tail /etc/test.txt

    ```


    `tail` 命令还允许你选择显示的行数。假设你只想查看 `test.txt` 的最后三行：


    ```bash

    tail -3 test.txt

    ```


    通过该选项，你可以使用 `tail` 查看文本文件的结尾。


    ## 滚动查看文件


    `cat`、`head` 和 `less` 命令都有一个共同点——它们显示文本文件的内容，然后退出。即使你将 `cat` 的输出通过到 `more` 命令，你可以一次一个屏幕地向下滚动——但你无法跳回查看之前过的屏幕。如果你正在使用终端模拟器应用程序，你可以向上滚动，但如果你在
    CLI 界面下，文本就消失了。


    这时 `less` 命令就派上用场了。要回到之前的示例文件 `test.txt`，这是你使用 `less` 查看它的命令：


    ```bash

    less test.txt

    ```


    在显示文件时，`less` 在第一个完整屏幕处暂停。通过按下向下箭头键，你可以一次向下滚动一行。按下 Page Down 键可以向下移动整个屏幕。


    与其他查看文本文件的命令不同，`less` 允许你向上移动并返回已显示的文本。按下向上箭头键可以一次向后移动。按下 Page Up 键可以向上一个屏幕。


    你可以通过按下斜杠（`/`）键在 `less` 中搜索术。按下斜杠键后，屏幕底部会出现提示。输入你的搜索术语并按回车。`less` 命令将高亮输出中的每个术语实例，你可以通过按下
    `n` 键在实例之间跳转。

