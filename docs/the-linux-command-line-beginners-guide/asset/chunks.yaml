    You can also use them with the file permission and ownership commands, which we
    will discuss in Chapters 11 through 14.


    ***


    ## Chapter 5 - Concept: Users and User Accounts


    To use your Linux system, you have to enter a username and a password. This is
    your user account, and user accounts are an important part of the Linux command
    line. In this chapter, we''ll examine the underlying concepts of user accounts
    on Linux.


    WHAT IS A USER ACCOUNT?


    To put it simply, a user account is the method an operating system uses to determine
    which users have access to which files and programs. In Linux, files and programs
    are configured to be secure – users cannot view other users'' home directories,
    for instance, and only the root user can delete and alter important system files
    and programs. How does the operating system know to let the current user of the
    computer have access to the appropriate files and programs? User accounts are
    the method used to grant access. A user presents his username, and then a password
    to confirm that he is indeed the user in question. (Technically, this is called
    single-factor authentication, since you only need a single piece of information,
    the password, to prove that you are a specific user. A complex kind of authentication,
    where you need a password and a PIN number to log in, is called two-factor authentication.)


    To properly secure a Linux system, you need to have the user accounts configured
    correctly.


    TWO KINDS OF USERS'
