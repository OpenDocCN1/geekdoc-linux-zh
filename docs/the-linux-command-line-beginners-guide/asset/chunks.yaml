    \ shell 发出命令，然后由 shell 将指令传递给操作系统进行处理。\n\n图形用户界面和命令行界面都算作 shell 的范畴。Linux 有许多不同的命令行\
    \ shell 可用——`sh` shell、`zsh` shell、`c` shell 等。到目前最常见的 shell 绝对是 `bash` shell，我们将在下一节中讨论它。\n\
    \n### BASH shell\n\n程序员 Brian Fox 在 20 世纪 80 年代后期作为 GNU 项目的一部分编写了 `bash` shell\
    \ 的第一个版本。“bash”这个名字是一个双关——它代表 Bourne-again shell（再次出生的 Bourne shell）。Bourne shell\
    \ 是最受欢迎的 UNIX shell 之一，但因为它不是免费软件，用户无法合法地修改和分发它。GNU 项目和自由软件基金会都想创建一个 Bourne shell\
    \ 的免费替代品——因此有了“Bourne-again shell”，即 `bash` shell。\n\n`bash` shell 是远胜于其他的最常见的\
    \ Linux shell。大多数 Linux 发行版都使用 `bash` shell 作为它们的默认命令行 shell，甚至 Mac OS X（技术上是\
    \ UNIX 的一个版本）也使用 `bash` shell 作为其默认的终端模拟器。熟悉 `bash` shell 将证明在各种不同的 Linux 发行版中甚至在\
    \ Mac 上都是非常有用的。\n\n在接下来的几节中，我们将介绍 `bash` shell 的一些实用功能。\n\n### 命令行提示符\n\n首先，我们将检查命令提示符本身。如果你启动到\
    \ CLI 环境，或者启动终端模拟器应用程序，你看到的第一个东西就是提示符。（这个名字是因为它在“提示”你输入命令。）提示符本身看起来可能是一串无意义的单词和符号，但它传达了很多有用信息。\n\
    \n通常，提示符看起来像这样：\n\n```bash\njmoeller@yourlinuxmachine:~$\n```\n\n让我们检查提示符每个部分的含义。\n\
    \n提示符中 `@` 符号之前的部分（在本例中为“jmoeller”）是当前登录用户的用户名。很自然地，这会根据登录到终端会话的用户不同而改变。`@` 符号之后但冒号之前的部分（在本例中为“yourlinuxmachine”）是你正在使用的机器的名称。从这个提示符中，你可以看到你正在名为“yourlinuxmachine”的机器上使用账户“jmoeller”。\n\
    \n提示符的下一部分，在冒号标记之后但美元符号之前，显示的是工作目录。在 `bash` shell 中，“工作目录”是当前选定的目录。波浪号符号（`~`）看起来可能没什么信息量，但在\
    \ `bash` shell 中，它是当前登录用户主目录的简写字符。在我们示例的提示符中，波浪字符代表 jmoeller 的主目录 `/home/jmoeller`。当你更改工作目录时，提示符会随之变化以反映这一点。如果你将当前目录更改为\
    \ `/etc`，提示符看起来像这样：\n\n```bash\njmoeller@yourlinuxmachine:/etc$\n```\n\n美元符号表示提示符的结束。你的命令将出现在美元符号之后。\n\
    \n### 命令/文件名补全\n\n虽然你从命令行执行某些任务比从 GUI 执行更高效、更快速，但这确实涉及大量的输入，这可能会变得乏味。但使用一种称为“命令/文件名补全”的功能可以减少大量的重复输入。命令补全的工作原理是：你输入文件名的一部分，然后按下\
    \ `TAB` 键。然后 `bash` shell 将根据其最佳猜测进行填充。\n\n"
