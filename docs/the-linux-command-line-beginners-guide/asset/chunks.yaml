    The second wild card character, the asterisk (*), is even more powerful. The question
    mark wildcard character only represents a single character. The asterisk represents
    any number of characters in any combination. For example, if you wanted to delete
    every single .doc file in your current working directory, you could delete them
    one by one. Or, you could use the asterisk wildcard character with rm:


