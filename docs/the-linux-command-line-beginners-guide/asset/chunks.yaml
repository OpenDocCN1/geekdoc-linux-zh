    The command will generate an output that looks something like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m44ce4bfb.jpg)


    Look for the line that begins “default via.” Your system''s default gateway will
    be the IP address after those two words. In this example screenshot, the default
    gateway would be `192.168.2.1`.


    ### OBTAINING AN IP ADDRESS


    Most of the time, your Linux system will receive an IP address from a `DHCP` server.


    `DHCP` stands for “Dynamic Host Configuration Protocol”, and is a kind of server
    that assigns an IP address to a client computer when it connects to the `DHCP`
    server''s network. Configuring each individual computer with an IP address by
    hand is time-consuming and error prone; if one or more computers receive the same
    IP address, they won''t be able to connect due to the address conflict. `DHCP`
    takes the guesswork out of the process. When a computer plugs into a Ethernet
    network (or connects to a wireless network), it sends out a request for a `DHCP`
    server. If there''s a `DHCP` server on the network, it supplies the computer with
    an IP address, and the `DHCP` server ensures that no two computers receive the
    same IP address.


    Most of the time, when you plug into a new network, you''ll receive a `DHCP` address
    automatically. If you don''t, however, try this command:


    ```bash

    dhclient

    ```


    Note that you will need to run `dhclient` as root, whether logged in as root or
    borrowing root powers via `sudo`.


    This will manually tell your system to search for a `DHCP` server and accept an
    address. If this command doesn''t work, that means either the network you''re
    using doesn''t have a functioning `DHCP` server, or that something is blocking
    the `DHCP` server from communicating with your computer.


    ### RELEASING AN IP ADDRESS


    `DHCP` addresses come with a "lease", which means the amount of time your computer
    is allowed to keep the address. Usually, your computer will contact the `DHCP`
    server at the halfway point before the lease expires, and ask for permission to
    keep it, which the `DHCP` server almost always grants.


    Sometimes you want to release a leased IP address early - like if your network''s
    `DHCP` server changes, or if your computer refuses to release its IP address.
    You can do this with the `dhclient` command and the `-r` option:


    ```bash

    dhclient -r

    ```


    This releases your IP address, and you can then use `dhclient` to contact a `DHCP`
    server to receive a new one.


    ### TESTING YOUR DNS SERVER


    As we mentioned above, if your `DNS` server stops responding, you can have all
    sorts of network problems. When it''s working right, you will forget that it''s
    there. But it goes bad, everything grinds to a halt. Without it, you can''t type
    addresses into the address bar of your web browser, or use any network resources
    that depend upon `DNS`.


    To diagnose your `DNS` server, you can use a command called `nslookup`. The `nslookup`
    command provides the IP address of your current `DNS` server, and also runs a
    test lookup against the server to see if it is functioning. For example, if you
    wanted to determine if your `DNS` server was operational, you would do so with
    this command:


    ```bash

    nslookup distrowatch.org

    ```


    The output would look something like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m3e167586.jpg)


    The first two lines list the `DNS` server your computer is using. In this case,
    we are using a `DNS` server with an IP address of `192.168.2.1`. The second group
    of lines shows the result of the lookup we preformed – the IP address of `distrowatch.org`.
    In this case, you can see that `distrowatch.org` has an IP address of `66.180.174.35`.
    Since `nslookup` successfully returned an IP address for `distrowatch.org`, you
    know that your `DNS` server is functioning correctly.


    ### TESTING CONNECTIVITY


    If you’ve ever had to repair a computer (or even used one, for that matter), you
    know that network and Internet connection problems are a depressingly common occurrence.
    Fortunately, the command line’s tools are useful for obtaining valuable information
    about any network problems.


    The first and most commonly used network-diagnostic command is the `ping` command.
    The “ping” command stands for “Packet Internet Groper”, and it relies upon the
    `ICMP` protocol, the Internet Control Message Protocol. Basically, the `PING`
    command sends a packet to a network destination, such as a server or another PC,
    and if the destination is active, it sends back an acknowledgment packet. For
    instance, if you wanted to `ping` the PC at the IP address of `192.168.1.2`, you
    would use this command:


    ```bash

    ping 10.10.11.254

    ```


    If `10.10.11.254` is up, the `ping` command will generate an output like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2ef51a2a.jpg)


    The `ping` command will continuing pinging the target until you hit `CTRL-C` to
    cancel the command.


    The command also has a few command options you can use to alter its performance.
    The `-c` option tells `ping` to send a set number of packets and then stop. For
    example, if you only wanted to `ping` `192.168.1.2` six times, you would use this:


    ```bash

    ping -c 6 192.168.1.2

    ```


    ### TRACING PATHS


    Sometimes network connection is active, but you can’t access a destination. In
    this case, `traceroute` becomes useful. The `traceroute` command maps the path
    to the destination, and sends every device ICMP packet. For instance, to trace
    `google.com`, you would use traceroute like this:


    ```bash

    traceroute google.com

    ```


    The output will look something like this, with one line for each “hop” (another
    device in the chain):


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m7e4bdb18.jpg)


    The `traceroute` command by default runs up to thirty hops.

