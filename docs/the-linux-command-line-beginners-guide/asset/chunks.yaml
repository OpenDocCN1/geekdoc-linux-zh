- fmt: '

    On most kinds of Linux systems, you will see two kinds of users – standard users,
    and admin users.


    Standard users are the normal users on the system. They have full access to their
    individual home folders, and can run the programs designated for normal users.
    They cannot view the home folders of other users, and cannot alter or change system
    settings or installed programs. The employees of an accounting department, for
    instance, would usually be standard users – they have access to their files and
    the programs they need to do their work, but cannot change the system.


    Admin users are just like normal users, but with one exception. They have the
    right to either use or borrow the powers of the root user (suing a command called
    `sudo`, which we will describe in Chapter 8) to make changes to the system''s
    settings and programs. The IT professionals supporting the accounting department,
    to continue our example, would generally be admin users.


    # FILES CONTROLLING USER ACCOUNTS


    In Linux, user accounts are stored in one file, and passwords in another.


    The user accounts in your system are defined in the `/etc/passwd` file. Despite
    the name, the passwords are not actually stored in the `/etc/passwd` file. Older
    versions of Linux used to store the passwords there, but that presented a security
    risk, so the passwords were encrypted and moved to a different file. There is
    still quite a bit of useful information in the file. If you view it from the command
    line (we''ll show you how to do that in Chapter 16), the entries will look something
    like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_45e08829.jpg)


    Colons separate the specific fields in the entry.


    The first piece of information is the username (in this case, `jmoeller`). The
    second field has only an `x`. In older versions of Linux, the password would go
    here, but passwords are no longer stored in `/etc/passwd`. The third field holds
    the user account''s numerical user ID number (commonly shortened to `UID`). In
    this case, the `UID` is `1000`. Most Linux distributions give the first new account
    on the system a `UID` of `1000`, and then count up from there.


    The fourth field contains the account''s group ID number (commonly shorted to
    `GID`). Generally, each new account receives its own group (called a primary group)
    for reasons of security. We''ll discuss groups more in Chapters 9 and 10.


    The fifth field holds the user''s full name (in this case, `Jonathan Moeller`),
    the sixthth holds the location of the user''s home directory, and the seventh
    stores the location of the user''s default shell. Most Linux distributions use
    the `bash` shell as the default shell, so this final entry will almost always
    be `/bin/bash`.


    You might be tempted to add accounts to your system by manually editing `/etc/passwd`.
    Do not do this! Misconfiguring `/etc/passwd` can cause serious problems for your
    system. Always use the appropriate command line utilities to add user accounts
    to your system, which we shall discuss in the next chapter.


    If user accounts are stored in `/etc/passwd`, user passwords are actually stored
    in the `/etc/shadow` file. You need root permissions to view the `/etc/shadow`
    file, but if you view it, each of the entries will look something like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_7e2c0aad.jpg)


    Like with the `/etc/passwd` file, each of the entries in `/etc/shadow` are divided
    by colons into separate fields. The first field contains the username (in this
    case, `camalas`).


    The second field contains the password in encrypted hash form, hence the long
    string of numbers and letters. If there''s only an asterisk in the second field,
    that means the account in question is not actually allowed to log into the system.
    You''ll usually see this for system user accounts (accounts that system services
    use to access the system) or regular user accounts that have been locked.


    The third field contains the number of days since January 1st, 1970, since the
    password was last changed. In this example, the number of days is `15,383`, which
    means it has been about 42 years since the password was last changed. If you do
    the math, the password in this example was last set on February 12th, 2012. This
    is a cumbersome way to go about it, but remember that Linux was derived from UNIX,
    and Linux has carried over UNIX''s password system.


    The fourth field is the minimum number of days before a password can be changed.
    This is to enhance password security policies – if users are forced to change
    their passwords, this prevents them from changing their passwords right back.
    If there''s a `0` in the field, as in this example, that functionality is disabled.


    The fifth field sets the maximum number of days before a password expires and
    must be changed. Setting it to `99,999`, as in this example, disables this feature.
    (Since 99,999 days is about 273 years, the issue is moot!) So the password of
    the `camalas` user account will never expire.


    The sixth field specifies the number of days before the password expires that
    a warning will be issued. The default setting is seven days, so if a password
    is set to expire, the user will receive a warning while logging in for seven days.


    The seventh field specifies the number of days after January 1st, 1970, to wait
    until locking the account after the password has expired. So if a password expires,
    this field specifies the number of days to wait until locking the account. If
    you see a value of `-1` in the field, as in this example, that functionality has
    been disabled. If the field is blank, as in this example, that means the account
    is set to never.


    The root user on a Linux system has access to any file and can delete any directory.
    Needless to say, logging in as the root user should be done with caution, as you
    can accidentally damage your system. We will discuss how to use the root account
    safely in Chapters 7 and 8.


    ***


    ## Chapter 6 - Commands For Working With User Accounts


    Now that you understand the principles behind user accounts, we''ll explain how
    to use command line utilities to control them. In this chapter, you''ll learn
    how to create, modify, and delete user accounts. You'' also learn how to reset
    passwords and lock accounts.


    ### Creating User Accounts


    As we mentioned in the previous chapter, adding user accounts by manually editing
    the `/etc/passwd` and `/etc/shadow` files is a bad idea. Fortunately, you can
    use the `useradd` command to add accounts to your system from the command line.
    Let us say you wanted to add an account for a woman named Caina Amalas to your
    system, and have decided to assign her a username of `camalas`.


    (Shameless authorial plug: Caina Amalas is the name of the protagonist from my
    THE GHOSTS series of fantasy novels and short stories.)


    To begin, it''s best to choose a naming convention for your user accounts. A “naming
    convention” sounds fancy, but it just means that you stick to a consistent way
    of naming the accounts. Usually, something like the first initial and the last
    name is best – like `camalas` for Caina Amalas. Letting users pick their own usernames
    in a business setting is a bad idea, since users will very often choose inappropriate
    or even obscene usernames. (To cite an actual example I have encountered, letting
    a user in the sales department give herself a username of `partygrrl19` does not
    reflect well on the business.)


    To add thecamalas` account to your system, you would use this command:


    ```

    useradd camalas

    ```

