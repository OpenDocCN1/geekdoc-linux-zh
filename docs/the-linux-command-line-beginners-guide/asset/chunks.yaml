    预装软件极大减少了在 Linux 系统上安装软件的猜测性。通常，包好的软件已经为针对特定的 Linux 发行版准备就绪，如果你使用包管理器来安装它，该程序知道自己需要哪些依赖项。


    “包管理器”是一种专门设计用于安装软件包的应用程序。Linux 中有两种主要的软件包管理工具，这取决于你的发行版是源自 Debian 还是 Red Hat/Fedora（这是两个最有影响力的
    Linux 发行版）。源自 Red Hat/Fedora 的发行版倾向于使用 RPM 包管理器，通常简称为 `RPM`。源自 Debian 的发行版经常使用高级软件包工具，通常缩写为
    `apt`。包管理器之所以有用，是因为它们知道已安装软件需要哪些依赖项，并会在安装所选应用程序的同时自动安装这些依赖。


    # 软件仓库


    包管理器通常与软件仓库紧密配合。


    基本上，软件仓库是互联网上的一个服务器，用于存储特定发行版的包好的软件。仓库通常由特定发行版的制作者维护。例如，Ubuntu 背后的公司 Canonical
    维护着 Ubuntu 使用的软件仓库。创建 Red Hat Linux 和 Fedora Linux 的公司 Red Hat 则运行着这两个发行版的仓库。


    软件仓库提供了许多优势。由于由发行版背后的公司维护，你可以找到专门测试并批准可在你的发行版上运行的软件。这意味着获取已安装软件的更新也变得容易，因为更新在测试通过与发行版兼容后就会被添加到仓库中。仓库的缺点是使用它时需要访问互联网。


    在下一章中，我们将展示如何从命令行安装软件。


    ***


    ## 第 25 章 - 安装软件的命令


    在本章中，我们将解释如何从命令行安装软件。我们将重点介绍两个主要的包管理器——高级软件包工具和 `RPM`。我们还将向你展示如何在不使用软件仓库的情况下安装预装软件。


    在 在 Debian 的系统上安装预装软件


    Debian 是最老且最受尊敬的 Linux 发行版之一，许多其他发行版也基于它——Ubuntu、Kubuntu、Xubuntu、Linux Mint、Knoppix
    和 Xandros 仅仅是基于 Debian 的 Linux 发行版的一部分。为基于 Debian 的发行版封装的软件通常以 `.deb` 文件的形式出现。你可以在
    GUI 环境下通过双击来安装软件包，也可以从命令行安装。


    请注意，要安装或卸载任何软件（无论通过 GUI 还是 CLI），你都需要 root 权限。


    要从命令行安装 `.deb` 包，你将使用 `dpkg` 命令。如果你有一个名为 `installer.deb` 的预装安装文件，可以使用此命令进行安装：


    ```

    dpkg -i installer.deb

    ```


    根据程序的不同，你可能需要或不需要遵循安装向导或输入额外信息。按照提示操作，`dpkg` 将会为你安装软件。


    同样，你也可以使用 `dpkg` 配合 `-r` 选项来卸载软件：


    ```

    dpkg -r installer.deb

    ```


    请注意，为了通过 `dpkg` 卸载软件，你需要保留原始安装文件，因为其中包含了卸载指令。此外，`dpkg` 命令不会计算任何依赖关系，如果你缺少该软件所需的依赖项，安装将失败。


    ### 使用高级软件包工具安装软件


    大多数基于 Debian 的发行版都使用高级软件包工具进行软件管理。高级软件包工具具有多个图形前端——Synaptic 包管理器，或者 Ubuntu 中的
    Ubuntu 软件中心。然而，要使用高级软件包工具从命令行安装软件，你将使用它的命令行实用 `apt` 命令。`apt` 命令与软件仓库紧密配合，并从仓库下载已安装软件。


    例如，要安装远程桌面连接应用 `Remmina`，你可以使用此命令：


    ```

    apt-get install remmina

    ```


    通常在基于 Debian 的系统上，你会使用 `sudo` 配合 `apt` 来获取安装所需的 root 权限。你还需要知道想要安装的包名。输入命令后，`apt`
    将检查仓库，列出 `Remmina` 可能需要的任何依赖项，并列出所需的总磁盘空间。按 `Y` 继续，`apt` 将为你下载并安装 `Remmina`。


    使用 `apt` 移除 `Remmina`，可以使用此命令：


    ```

    apt-get remove remmina

    ```


    同样按照提示操作，`apt` 将从你的系统中移除 `Remmina` 及其所有依赖项。注意，如果另一个应用程序需要 `Remmina` 的某个依赖项，`apt`
    将其移除


    ### 使用 RPM 包管理器安装预装软件


    与 Debian 类似，Red Hat Linux（及其免费版本 Fedora）是最老且最受尊敬的 Linux 发行版之一，许多其他发行版也基于 Fedora。为基于
    Fedora 的发行版封装的软件通常以 `.rpm` 文件的形式出现，因为 Red Hat、Fedora 及其衍生品都使用 `RPM` 包管理器而不是高级软件包工具。你可以在
    GUI 环境下通过双击来安装软件包，也可以从命令行安装。


    要从命令行安装 `.rpm` 包，你将使用 `rpm` 命令。如果你有一个名为 `installer.rpm` 的预装安装文件，可以使用此命令进行安装：


    ```

    rpm -i installer.rpm

    ```


    根据程序的不同，你可能需要或不需要遵循安装向导或输入额外信息。按照提示操作，`rpm` 将为你安装软件。


    同样，你也可以使用 `rpm` 配合 `-e` 选项来卸载软件：


    ```

    rpm -e installer.rpm

    ```


    请注意，为了通过 `rpm` 卸载软件，你需要保留原始安装文件，因为其中包含了卸载指令。此外，`rpm` 命令不会计算任何依赖关系，如果你缺少该软件所需的依赖项，安装将失败。


    ### 使用 YELLOW DOG UPDATER 安装软件


    大多数基于 Fedora 的发行版使用 Yellowdog Updater Modified (`yum`) 进行软件管理。相比 `rpm` 命令，Yellowdog
    具有许多优势——它与仓库紧密配合，并自动计算和下载依赖项。Yellowdog 使用 `yum` 命令行工具安装软件。


    例如，要安装远程桌面连接应用 `Remmina`，你可以使用此命令：


    ```

    yum install remmina

    ```


