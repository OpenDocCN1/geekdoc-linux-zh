    注意，要让 `du` 正常工作，你需要拥有目标文件和目录的权限，这可能意味着你需要以 `root` 用户或具有 root 权限运行 `du`。


    # 卸载可移动磁盘


    通常，在现代 Linux 系统上，你不需要担心挂载 USB 驱动器。如果你插入一个 USB 驱动器，系统通常会检测到（即使在基于 CLI 的系统中）并自动挂载。卸载驱动器并没有那么简单。在图形界面（GUI）中，你只需要右键点击驱动器图标并点击“安全删除”，但在命令行界面中这种方法是不行的。直接从
    USB 端口拔出驱动器并不是一个选择，因为这可能会导致数据损坏。


    答案是 `umount` 命令。注意，该命令的拼写实际上是“umount”，而不是“unmount”（在 Linux 命令行中，混淆这两者是一个常见的拼写错误）。回到我们上一章的示例，如果你想卸载
    `/media/USBDRIVE` 闪存驱动，可以在提示符处使用此命令：


    ```

    umount /media/USBDRIVE

    ```


    注意，你需要 root 权限才能卸载已挂载的文件系统。


    `umount` 命令可能会失败。如果你在 USB 驱动器上打开了一个文件，`umount` 命令将拒绝卸载文件系统。或者如果你开了另一个终端会话，并且该会话的工作目录位于要卸载的驱动器上，`umount`
    命令将失败。基本上，如果驱动器上有任何文件处于打开状态，你就无法卸载它。不过，你可以尝试使用 `-f` 选项强制卸载：


    ```

    umount -f /media/USBDRIVE

    ```


    注意，如果你确实在驱动器上打开了文件，这可能会导致数据丢失。


    ***


    ## 第 22 章 - 概念：进程与守护进程


    在你阅读了关于 Linux 的内容后，你可能遇到过人们讨论“进程（processes）”和“守护进程（daemons）”。在接下来的几章中，我们将讨论这两者。在本章中，我们将描述进程和守护进程究竟是什么，然后在接下来的章节中，我们将向你展示一些监控和控制进程的命令。


    ### 什么是进程？


    在 Linux 中，“进程”并不是指你执行某操作时使用的特定程序，也不是执行任务的标准方法。相反，进程被定义为计算机程序的活动实例。例如，如果你运行了 Firefox
    浏览器，Firefox 就是一个正在运行的进程。一旦你退出 Firefox 并关闭浏览会话，该进程就会退出并消失。


    因此，运行在你的计算机上的每个程序在技术上都是一个进程。如果你有 GUI，构成图形用户界面的各种程序都是进程。如果你运行一个终端模拟器应用程序，那也是一个进程。你从命令行执行的命令（无论是在纯
    CLI 环境中还是从终端模拟器应用程序中）也是进程。即使是像 `ls` 这样快速显示输出后就结束的命令，也是一个进程，尽管它是短命的。


    然而，你 Linux 系统上的程序比你个人亲自执行的要多得多，我们接下来将讨论这些。


    ### 守护进程 (DAEMONS)


    人们有时会将进程称为“守护进程”，但这两个术并不是可以互换的。虽然所有的守护进程确实都是进程，但守护进程是其他东西。“守护进程”一词意味着在后台运行的系统进程。系统进程是由操作系统控制并启动的进程，不需要实际使用电脑的人员干预。例如，控制
    Linux 笔记本电脑电源设置的程序就是一个守护进程，像 Web 服务器或 MySQL 这样的服务器应用也是如此。


    （“daemon”一词并非源于基督教或伊斯兰教的恶魔，而是源于希腊神话。在古希腊宗教中，“daemons”是执行希腊众神不愿亲自动处理的任务的小灵。在 UNIX
    早期，程序员们将“daemon”一词用于系统将执行且不会打扰用户的进程。）


    通常，命令行初学者倾向于不频繁使用守护进程。一旦你的技能更加，并且开始安装服务器应用程序，你就会开始更多地使用和控制守护进程。


    ### 进程 ID 数字 (PID)


    你可能记得在用户和组的章节中，每个用户都有自己的用户 ID (UID) 数字，每个组都有自己的组 ID (GID) 数字。进程也不一样。在 Linux 系统上启动的每个进程都会获得自己的进程
    ID (PID) 数字。即使是像 `ls` 命令这样短命的进程在运行时也会获得自己的 PID。


    进程运行后，它（在理论上）会将进程 ID 数字释放回可用进程池中。该数字随后就可以重新分配给任何新进程。


    理解 PID 如何工作非常重要，因为许多控制进程的命令都使用 PID 来标识命令的目标。


    ### 父进程 ID 数字 (PPID)


    每个进程也有一个 PPID —— 即父进程 ID 数字。


    什么是父进程？Linux 系统上的每个进程都由另一个进程启动。如果你运行一个终端模拟器并从该应用程序启动一个命令，终端模拟器进程就会启动该命令的进程。或者，如果你启动一个
    Web 浏览器应用程序，并通过浏览器打开一个 PDF 文件，浏览器进程就会启动 PDF 阅读器应用程序。


    这种关系被称为父进程和子进程，类似于目录和子目录之间的关系。父进程是第一个进程，它启动了子进程。因此，每个进程都有一个 PPID —— 即启动它的进程的 PID
    数字。


    ### INIT 进程


    当然，如果每个进程都是由用户或另一个进程启动的，那么第一个进程是什么呢？


    init 进程在启动序列期间运行，并启动所有系统进程。它的 PID 为 1，是第一个进程。所有系统进程最终由 init 启动。


    在下一章中我们将为你展示一些管理进程的命令。


    ***


    ## 第 23 章 - 管理进程命令


    在本章中，我们将展示如何从命令行查看进程。我们还将展示如何关闭挂起或冻结的进程。


    ### 查看运行进程


    查看系统中运行进程的最简单方法之一是经典的 `ps` 命令。要使用 `ps` 命令，只需在提示符处输入：


    ```

    ps

    ```


    然而，在没有任何选项的情况下，`ps` 并不十分有用。默认输出如下：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_5)


    在默认状态下，`ps` 只显示当前运行的进程 —— 也就是你正在使用的 shell。幸运的是，你可以通过 `-e` 让 `ps` 变得有用得多：


    ```

    ps -e

    ```


    `-e` 代表扩展（Extended），并生成系统上运行的所有进程的列表：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_m694)


    但是，这显示的信息仍然有限，特别是与 `top` 命令（我们将在本章晚些时候讨论）相比。你可以通过 `-l` 告诉 `ps` 命令显示更多信息：


    ```

    ps -el

    ```


    输出如下：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_m41)


    就像 `ls` 命令一样，`-l` 选项代表长列表（Long Listing），并产生相当多的信息。具体来说，你可以看到启动进程的用户 UID（用户 ID）、子进程的父进程的
    PPID（父进程 PID）、进程的优先级以及许多其他有用信息。要获取更多信息，配合 `-f` 选项使用 `ps`：


    ```

    ps -elf

    ```


    使用这些选项后，`ps` 的输出如下：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dmx_html_m58)


