    # Introduction


    Directories can contain subdirectories, and those subdirectories can hold additional
    subdirectories. These directories form an elaborate, hierarchical structure, and
    the starting point of the that structure is the root directory. The root directory
    is the topmost directory in the structure, the first directory in the entire file
    system. Every other directory in the system is technically a subdirectory of the
    root directory, no matter how many levels deep you have to go (and in complex
    Linux installations, you can have subdirectories nested a dozen levels deep or
    more).


    In the command line, the root directory is represented with the forward slash
    (`/`) symbol. So if you see a location in the file system, like `/home/jmoeller`,
    the root directory is represented by the forward slash on the left. That means
    the home directory is located within the root directory, and the `jmoeller` directory
    is in turn stored within the home directory.


    It''s usually a good idea to keep your root directory as uncluttered as possible.
    This makes it easier to locate files in the filesystem, and also prevents potential
    security breaches from unauthorized software running in the root directory. (In
    the early days of Windows, lazy users had a habit of storing everything in the
    root directory of their hard drive, which often caused all kinds of problems.)


    Regardless of the Linux distribution you use, you will probably see the same subdirectories
    in the root directory of your filesystem. The Linux directory structure has been
    standardized for years, and in the next section, we''ll take a look at a few of
    the more common subdirectories.


    ## Common Subdirectories


    If you examine a listing of the subdirectories in your root directory, it will
    probably look something like this:![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m35520ce0.jpg)


    Let''s discuss some of the more important directories here. Since Linux distributions
    are free to modify Linux however they like, note that some of the purposes of
    the directories may change between versions of Linux.


    - The name of the `/bin` directory stands for system binaries, and contains numerous
    system files for Linux. Many of the commands we''ll discuss in this book are actually
    stored here.

    - The `/boot` directory stores the files necessary for Linux to boot. The Linux
    kernel file, named `vmlinuz-VERSION NUMBER`, is located here.

    - The `/dev` directory contains the files that represent the various hardware
    devices on your system.

    - The `/etc` directory holds most of the configuration files for the various services
    and programs that run on Linux. If you administer a Linux system, you''ll spend
    a great deal of time working in the `/etc` directory.

    - The `/home` directory contains the home folders for all of the users on the
    system. Every user that has logged into the system will have a home folder here.
    Usually, the home folders contain a standard set of folders – Desktop, Documents,
    Pictures, and so forth, along with any other individual folders the users might
    have created.

    - Both the `/media` and the `/mnt` folders are used to store removable media.
    We''ll discuss this more in Chapters 20 and 21, but when you plug a removable
    disk into your computer, Linux mounts it as a folder within the filesystem. (This
    is different from DOS and Windows, which use letters to represent the different
    drives attached to a system.) Depending on the distribution, the mounted drives
    can show up either in `/media` or `/mnt`. Occasionally a distribution will use
    a `/Volumes` directory, but this is rare.

    - The `/root` subdirectory contains the home folder of the root user. Note that
    the root user is not the same thing as the root directory! We''ll discuss the
    root user more in Chapters 7 and 8, but to summarize, the root user is the most
    powerful user on a Linux system, with the rights to run any program and delete
    or modify any file. The `/root` subdirectory, therefore, is the home folder of
    the root user, separate from the home folders in the `/home` directory.

    - The `/sbin` directory, like the `/bin` directory, holds system commands. However,
    the `/sbin` directory usually stores commands that only the root user can run,
    since these commands affect the entire system.

    - The `/tmp` directory stores temporary files, whether from applications or users.
    Note that it''s a poor idea to store important data in `/tmp`, since some distributions
    regularly delete the contents of the `/tmp` directory when shutting down or logging
    off a user.

    - The `/usr` directory stores multi-user applications. While the utilities in
    `/sbin` tend to be restricted to root, applications that anyone can use often
    wind up in the `/usr` directory and its subdirectories. So most of the user applications
    installed on a Linux system (the Firefox web browser, the LibreOffice office suite,
    and so forth) are stored here.

    - Finally, the `/var` directory stands for “variable”, and is used to store data
    that changes during the operation of the system. All of your computer''s log files
    are stored here, along with other items like the print spooler, user mailboxes
    (if you have a mail server on your Linux system), and temporary files. On some
    distributions, if your Linux system is running a web server, the website files
    are stored here.


    ## Absolute and Relative Paths


    A final point to know about the filesystem is the difference between relative
    and absolute paths.


    A “file path” refers to the location of a file within the filesystem, specifically
    its position in the directory hierarchy. If the `jmoeller` user has a file named
    `Caina1.doc` in his Documents folder, then the absolute path to the file is `/home/jmoeller/Documents/Caina1.doc`.
    So if you wanted to delete the file, then the `rm /home/jmoeller/Documents/Caina1.doc`
    command would delete the file for you.


    A relative path has to do with the current working directory. When you launch
    a command with a filename, the command first looks in your working directory.
    If you used the `rm Caina1.doc` command while `/home/jmoeller/Documents` was your
    working directory, the command would look in the working directory, find the file,
    and delete it. If your working directory was the root directory, the command would
    not be able to find the file, and would then fail.


    Remember that you can use relative paths if the file or directory you intend to
    work with is in your current working directory. If not, you should use the absolute
    path.


    # Chapter 4 - Commands For Working With Files And Directories


    In the last chapter, we explained the underlying concepts of the Linux filesystem.
    In this chapter, we''ll take a look at the commands that let you work with both
    files and directories. You will learn how to create and modify both directories
    and files from the command line. And you''ll also learn how to delete files and
    remove directories.


    ### Finding the Working Directory


    As we mentioned in Chapter 2, the bash shell is usually configured to show the
    current working directory in the prompt. This isn''t always the case, and if the
    prompt isn''t configured to show the working directory, it is easy to become confused
    as to your current location. You can avoid this with the `pwd` command. Type this
    command:


    ```

    pwd

    ```


    The bash shell will respond with your current working directory.


    ### Changing the Working Directory


    We''ve talked a great deal about the working directory, but we haven''t yet mentioned
    how to change the working directory. To do that, you need to use the `cd` command.
    (The “cd” stands for “change directory.”) The `cd` command works with absolute
    file paths. If you are in the root directory, and you want to change to the `/var/www`
    directory, you would use this command:


    ```

    cd /var/www

    ```


    The working directory will change from `/` to `/var/www`.

    '
