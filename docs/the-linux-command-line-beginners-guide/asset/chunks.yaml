    当然，每次需要执行管理任务时注销并重新登录会很快变得非常繁琐。为了解决这个问题，一个名为 `su` 的命令允许你从自己的账户内部以 `root` 身份登录。一旦你完成了
    root 会话的操作，只需要输入 `exit` 即可返回你自己的用户账户。


    如果你在一个有多个用户需要访问该用户账户的系统上工作，会发生什么呢？将 `root` 密码共享给多个人是一个安全风险（因为这些人可能反过来又将密码分享给其他人）。这也会让审计和跟踪系统更改变得更加困难。如果
    `root` 用户对系统进行了更改，而有五个不同的人知道 root 密码，那么很难确定该由谁负责。


    为了解决这个问题，Linux 提供了 `sudo` 命令的使用。`sudo` 命令允许你临时“借用” `root` 用户的权限来执行任务。只有属于特定组（通常是
    admin 组）的用户才能使用 `sudo` 命令，他们的操作会被记录在日志文件中。


    事实上，通过 `sudo` 命令，你甚至可以保持 root 账户禁用状态而仍使用 root 级权限。保持 root 账户激活状态具有某种安全风险，因为如果攻击者猜中了你的
    root 密码，他就对你的整个系统的完全控制。某些发行版（如 Ubuntu）默认禁用 root 账户，并建议管理员使用 `sudo` 命令执行管理任务。


    在下一章中，我们将仔细查看 `su` 和 `sudo` 命令的使用。


    ## 第 8 章 - 使用 Root 账户的命令


    在本章中，我们将解释如何通过 `su` 和 `sudo` 命令安全地使用 root 权限。


    ### SU 命令


    `su` 命令代表“切换用户”（switch user）。在默认状态下，它提示你登录 root 账户。然而，你实际上可以使用 `su` 切换到系统中任何你知道密码的账户。


    不过首先，我们将讨论 root。要切换到 root 账户，只需输入不带任何参数的 `su`：


    ```

    su

    ```


    输入 root 密码，`su` 将将你切换到 root 账户，而不会终止你在原有账户下的会话。一旦你完成了 root 账户的使用，输入 `exit` 命令。你将注销
    root 并返回你自己的会话。


    你也可以使用 `su` 登录系统中的任何其他用户（假设你知道他们的密码——如果你不知道，则必须先使用 `passwd` 命令更改他们的密码）。例如，如果你想使用上一章中的
    `camalas` 账户登录，请使用此命令：


    ```

    su camalas

    ```


    输入 `camalas` 的密码，你将使用该账户登录。完成后，你可以使用 `exit` 命令关闭 camalas 的会话。


    ### SUDO 命令


    `sudo` 命令提供了一种更高级的 root 权限的方式。`sudo` 命令代表“切换用户执行”（switch user do）——尽管因为它经常用于管理任务，它通常被称为“超级用户执行”（superuser
    do）命令。使用 `su` 时，你必须完全登录 root。`sudo` 命令只短时间“借用” root 的权限来完成特定任务，然后结束。这意味着只要你的账户有使用
    `sudo` 的权限，就可以从你的普通用户账户执行管理任务。


    例如，假设你想从标准账户的会话中使用 `usermod` 命令锁定 `camalas` 账户。输入此命令：


    ```

    usermod -L camalas

    ```


    你将收到拒绝访问的错误消息。


    然而，如果你在命令前加上 `sudo`，你将获得更好的结果：


    ```

    sudo usermod -L camalas

    ```


    在执行命令之前，`sudo` 会要求输入你的密码。输入密码后，`sudo` 将检查你的密码是否在允许使用 `sudo` 的账户列表中。如果是`sudo` 将以
    root 身份执行命令。


    我们在本书前面提到过“admin”组。在大多数 Linux 发行版中，admin 组是拥有权使用 `sudo` 调用 root 权限的组。接受的 sudo
    用户列表定义在 `/etc/sudoers` 文件中。（恰好，你需要 root 权限才能查看 `/etc/sudoers` 文件）。在大多数发行版中，sudoers
    列表由 admin 组组成，没有别的。）


    使用 `sudo`也会记录在日志文件中。在大多数发行版中，sudo 的使用记录在 `/var/log/auth.log` 文件中。扫描此文件将让你看到谁在使用
    `sudo` 以及用于执行什么任务。


    这是一本关于命令行的书，但有时你可能需要以 root 身份运行图形化应用程序。你可以使用 `gksudo` 命令来实现——在终端模拟器应用程序中使用 `gksudo`
    命令，你用 `gksudo` 启动的应用程序将出现在 GUI 窗口中。


    ## 第 9 章 - 概念：组


    最后四章应该让你牢练掌握了从 Linux 命令行操作用户账户的知识。但用户账户只是管理用户账户的一个方面。当你将各种用户账户分类为组时，可以更容易地分配相应的权限。在本章中，我们将解释
    Linux 组的底层原理。


    ### 什么是组？


    在 Linux（以及许多其他操作系统）中，“组”通常指的是一组用户账户。组的基本目的是简化对文件和文件夹的权限管理。例如，假设你有一个名为 `BUDGET.DOC`
    的文件，财务部门的每个成员都需要访问。你可以为财务部门的每个成员都分配权限，但这很快就会变得繁琐，而且对于大型机构（财务部门可能有数百人），这种手动方法很快就会变得无法管理。


    组提供了一种简化这种混乱的方法。你只需要创建一个名为“accounting”的组，并将部门的所有成员分配其中。然后如果你将 `BUDGET.DOC` 的权限分配给财务组，那么财务组里有多少用户，都可以访问该文件。因此，如果有百个不同的人都需要访问某个文件，与其分配百次权限，不如一次分配给他们的组简单得多。


    ### 主组


    当你向系统添加账户时，你很快会发现，每当你创建一个账户时，系统也会创建一个同名的组。此外，新用户账户总是被添加到同名的组中，并且通常是该组的唯一成员。这些组通常被称为“主组”，因为每个
    Linux 用户必须至少属于一个组，但这样做是为了安全考虑。我们将在接下来的四章中详细讨论所有权和权限，但 Linux 中的每个文件和目录都分配有一个“所有者”用户和一个“所有者”组。（“所有权”在
    Linux 中意味着文件或目录的所有者对其拥有完全控制权。）你通常会有只想让单个用户控制和修改的文件。如果文件的所有权设置为该用户账户和包含系统中所有组的“users”组，安全性就会变成问题。但通过将所有权分配给用户账户和用户的主组，只有该用户（当然还有
    root）才能访问该文件或目录。


    ### 用户组和管理员组


    大多数 Linux 发行版对用户账户有两个默认组——users 组和 admin 组。users 组将包含系统中所有的标准用户账户。如果你想让系统上的每个用户都能访问某个文件或目录，你就会组所有权分配给
    users 组。（我们将在第 12 章讨论如何操作。）


