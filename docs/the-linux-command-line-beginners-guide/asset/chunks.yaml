- fmt: '

    Instead, I decided to divide this book up into “concept” and “commands” chapters.
    The “concept” chapters explain some of the underlying concepts of the Linux command
    line – the file system, for instance, or the way user accounts work. Immediately
    after each “concept” chapter comes one or more “commands” chapter, describing
    the commands dealing with that concept. The chapter on the filesystem is followed
    by a chapter describing the commands to move, copy, and delete files and folders.
    Hopefully, this approach will give the reader an understanding of the underlying
    concepts of the command line, as well as a practical knowledge of the related
    Linux commands.


    # WHY I WROTE THIS BOOK


    I began writing about computers and technology almost by accident. I started my
    writing career as a writer of fantasy fiction, specifically of sword-and-sorcery
    novels. (All my books are now available in all major ebook formats; see the “Other
    Books By The Author” section for links.) Like every good fantasy writer, I had
    a blog where I attempted to promote my books, and as you might expect, the blog
    managed to pull down only thirty or forty hits a month.


    One day I happened to write a post about I problem I had with the Samba file-sharing
    server on Ubuntu Linux 8.04. To my very great surprise, the next day I saw that
    post had received nearly sixty hits via people doing Google searches for Samba
    problems on Ubuntu. From there it was a short step to blogging regularly about
    technology (and turning a profit via web ads), and then when I began using a Kindle
    in 2010, to writing short ebooks on technical topics.


    I decided to write this book because I have seen many people attempt to learn
    Linux, only to give up in frustration with the command line. In one of my previous
    books, THE UBUNTU BEGINNER''S GUIDE, I devoted several chapters to the command
    line, but that book focused mainly on setting up Ubuntu as a server. With this
    book, I hope to help the new user to learn the Linux command-line interface, whether
    a home user experimenting with Linux or a-IT professional seeking to learn new
    skills.


    # A NOTE ON LINUX VERSIONS


    As mentioned above, there are numerous different Linux distributions. Most of
    the commands described in this book will work on the majority of different Linux
    distributions. That said, sometimes individual Linux distributions will configure
    the commands in a specific way, so sometimes a command or option that works on
    one Linux distribution will not work on a different distribution. This tends to
    happen only with the more exotic or esoteric commands and utilities, but it does
    happen. It is always a good idea to check a distribution''s documentation and
    man pages for precise information (and we''ll show you how to do just that in
    the final chapter of this book).


    The screenshots for this book were taken on Ubuntu 11.10, Linux Mint 12 and Fedora
    16.


    ## Chapter 1 - Concept: Terminals And Virtual Consoles


    Before you do anything from the command line, you have to first actually access
    the command line interface. When you boot up Ubuntu or Linux Mint or another Linux
    distribution with a graphical interface, you might wonder how to even get to the
    command line. In this chapter, we''ll discuss how to reach the command-line interface
    both from a GUI-based Linux distribution and a CLI-based one. We''ll also show
    you how to have multiple command-line windows open at once, whether in the GUI
    or in a pure CLI environment.


    ## ACCESSING THE COMMAND LINE FROM A CLI-BASED DISTRIBUTION


    Some Linux distributions, such as Ubuntu Server, do not include a GUI. For such
    distributions, getting to the command line isn''t hard. You simply boot up the
    computer or server, and the system goes to the logon prompt. Enter your username
    and password, and you will log into the system and arrive at the command line
    prompt, also known as a terminal session. The term “terminal” dates back to the
    days when UNIX ran on large mainframes accessed via remote terminals.


    Sometimes you might see a blank screen on a CLI Linux machine that''s powered
    up. This is no cause for panic – to save power, the system is usually configured
    to power off the screen after a set interval of inactivity. Simply tap the space
    bar to awaken the display once more.


    ## ACCESSING THE COMMAND LINE FROM A GUI-BASED DISTRIBUTION


    Accessing the command line from a GUI-based Linux distribution is a little trickier.
    By default, a GUI-based distribution boots into the graphical interface. Even
    within the GUI, it’s simple to access a command prompt. There are two common ways
    of doing so.


    The first and most common is an application called a “terminal emulator.” As the
    name implies, a terminal emulator recreates the command line environment, but
    within a window of your GUI. You can access the full range of Linux commands from
    the terminal emulator application, but you can still use the benefits of the GUI
    - the mouse, the menu bar, and copying & pasting. (Copy & paste is particularly
    useful, since you can copy and paste complex and lengthy commands into the terminal
    emulator without the hassle of typing them.)


    Almost all desktop Linux distributions include a terminal emulator application.
    You can usually launch it by going to the Applications menu, then to the Accessories
    category, and finally by clicking on the Terminal icon. If your distribution comes
    with a quick-launch bar (like Ubuntu’s Unity Launcher), very often the icon for
    the terminal emulator is pinned to the launcher.


    The second way to access the command line in a Linux GUI is through what’s called
    a “virtual console.” We’ll discuss virtual consoles in this chapter, but first
    we’ll describe how to open multiple terminal windows.


    ## OPENING MULTIPLE TERMINAL WINDOWS IN THE GUI


    One nice feature of working with the terminal emulator application in the GUI
    is the ability to open multiple terminal windows. There are several advantages
    to running multiple terminal windows – if you run a command that displays real-time
    output (like the `top` monitoring command), you can open a new window to execute
    additional commands. Or if you''re running a command that take a long time to
    process, like copying several gigabytes of files, you can open a new window and
    run another command while the first one finishes working.


    Most terminal emulator applications support opening a new terminal window. To
    do so, you usually go to the File menu and select `New Window` or `New Terminal`.
    A new terminal window will open up.


    If you don''t want to clutter up your desktop with a bunch of windows, most terminal
    applications now offer tabs, much as the Mozilla Firefox and Google Chrome web
    browsers allow you to open new tabs for different web pages. If you open new tabs
    in the terminal emulator, a row of tabs will appear below the menu bar, each containing
    a separate terminal session. Usually, you can open new tabs by going to the File
    menu and clicking on `New Tab`.


    Obviously a graphical terminal application will not work in the command-line environment.
    It is nonetheless possible to run multiple terminal windows from the command line
    using “virtual consoles”, which we will discuss in the next session.


    ## VIRTUAL CONSOLES


    A virtual console is, essentially, a second connection to the same computer. Remember
    that Linux was based upon UNIX, and most early UNIX machines were massive mainframe
    computers. To connect to those mainframes, users employed remote consoles or dumb
    terminals. Because UNIX was a multi-user operating system, multiple users could
    log into the mainframe at the same time from different consoles.

