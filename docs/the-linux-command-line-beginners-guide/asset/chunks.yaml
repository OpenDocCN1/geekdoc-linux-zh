    Prepackaged software takes a lot of the guesswork out of installing software on
    a Linux system. Usually, packaged software has been prepared to work with a specific
    distribution of Linux, and if you use a packager manager to install it, the application
    knows which dependencies it needs.


    A “package manager” is an application designed specifically to install packaged
    software. There are two major packaging tools in Linux, depending on whether or
    not your distribution is derived from Debian or Red Hat/Fedora, two of the most
    influential Linux distributions. Distributions derived from Red Hat/Fedora tend
    to use the RPM Package Manager, which is usually referred to as `RPM`. Distributions
    derived from Debian often used the Advanced Packaging Tool, usually abbreviated
    down to `apt`. Package managers are useful because they know what dependencies
    installed software needs, and will automatically install the dependencies with
    the chosen application.


    # SOFTWARE REPOSITORIES


    Package managers usually work closely with a software repository.


    Basically, a software repository is a server on the Internet where the packaged
    software for a specific distribution is stored. Repositories are usually maintained
    by the maker of a specific distribution. For instance, Canonical, the company
    behind Ubuntu, maintains the software repositories that Ubuntu uses. Red Hat,
    the company that creates Red Hat Linux and Fedora Linux, runs the repositories
    for both of those distributions.


    Software repositories offer many advantages. Since the company behind the distribution
    maintains it, you can find software specifically tested and approved to work with
    your distribution. This means it''s also easy to get updates for your installed
    software, since updates are added to repository after they are tested to work
    with a distribution. The downside to a repository is that you need Internet access
    in order to use it.


    In the next chapter, we''ll show how to install software from the command line.


    ***


    ## Chapter 25 - Commands For Installing Software


    In this chapter, we''ll explain how to install software from the command line.
    We will focus on the two major package managers – the Advanced Packaging Tool
    and `RPM`. We''ll also show you how to install prepackaged software without using
    a software repository.


    ### INSTALLING PREPACKAGED SOFTWARE ON A DEBIAN-BASED SYSTEM


    Debian is one of the oldest and most respected Linux distributions, and numerous
    other distributions are based upon it – Ubuntu, Kubuntu, Xubuntu, Linux Mint,
    Knoppix, and Xandros are just a few of the Linux distributions derived from Debian.
    Software packaged for Debian-based distributions usually comes in the form of
    a `.deb` file. You can install the package in the GUI environment by double-clicking
    on it, but you can also install it from the command line.


    Note that to install or uninstall any software, whether from the GUI or from the
    CLI, you will need root-level powers.


    To install `.deb` packages from the command line, you will use the `dpkg` command.
    If you have a prepackaged installer file called `installer.deb`, you can install
    it with this command:


    ```

    dpkg -i installer.deb

    ```


    Depending on the program, you may or may not have to follow an install wizard
    or enter additional information. Follow the prompts, and `dpkg` will install the
    software for you.


    Likewise, you can also use `dpkg` to uninstall software with the `-r` option:


    ```

    dpkg -r installer.deb

    ```


    Note that in order to uninstall software via `dpkg`, you need to keep the original
    installer file, since that contains the instructions for uninstallation. Also,
    the `dpkg` command does not calculate any dependencies, and if you''re missing
    a dependency the piece of software needs, the installation will fail.


    ### INSTALLING SOFTWARE USING THE ADVANCED PACKAGING TOOL


    Most Debian-derived distributions used the Advanced Packaging Tool for software
    management. The Advanced Packaging Tool has a number of graphical front ends –
    the Synaptic Package Manager, or the Ubuntu Software Center in Ubuntu. However,
    to install software from the command line with the Advancing Packaging Tool, you''ll
    use its command-line utility, the `apt` command. The `apt` command works closely
    with the software repositories, and downloads its installed software from the
    repository.


    For instance, to install the remote desktop connection application `Remmina`,
    you would use this command:


    ```

    apt-get install remmina

    ```


    Usually on a Debian-derived system you''ll use `apt` with `sudo` to gain root
    powers for the installation. You''ll also need to know the name of the package
    you want to install. After you enter the command, `apt` will check the repositories,
    list any dependencies `Remmina` might need, and list the total amount of disk
    space required. Press `Y` to continue, and `apt` will download and install `Remmina`
    for you.


    To remove `Remmina` with `apt`, you can use this command:


    ```

    apt-get remove remmina

    ```


    Again follow the prompts, and `apt` will remove `Remmina` and all its dependencies
    from your system. Note that if one of `Remmina`''s dependencies is needed by another
    application, `apt` will not remove it.


    ### INSTALLING PREPACKAGED SOFTWARE USING THE RPM PACKAGE MANAGER


    Like Debian, Red Hat Linux (and its free version, Fedora) is one of the oldest
    and most respected Linux distributions, and numerous other distributions are based
    upon Fedora. Software packaged for Fedora-based distributions usually comes in
    the form of a `.rpm` file, since Red Hat, Fedora, and its derivatives all use
    the `RPM` Package Manager instead of the Advanced Packaging Tool. You can install
    the package in the GUI environment by double-clicking on it, but you can also
    install it from the command line.


    To install `.rpm` packages from the command line, you will use the `rpm` command.
    If you have a prepackaged installer file called `installer.rpm`, you can install
    it with this command:


    ```

    rpm -i installer.rpm

    ```


    Depending on the program, you may or may not have to follow an install wizard
    or enter additional information. Follow the prompts, and `rpm` will install the
    software for you.


    Likewise, you can also use `rpm` to uninstall software with the `-e` option:


    ```

    rpm -e installer.rpm

    ```


    Note that in order to uninstall software via `rpm`, you need to keep the original
    installer file, since that contains the instructions for uninstallation. Also,
    the `rpm` command does not calculate any dependencies, and if you''re missing
    a dependency the piece of software needs, the installation will fail.


    ### INSTALLING SOFTWARE WITH YELLOW DOG UPDATER


    Most Fedora-derived distributions used the Yellowdog Updater Modified (`yum`)
    for software management. Yellowdog has a number of advantages over the `rpm` command
    – it works closely with the repositories, and automatically calculates and downloads
    dependencies. Yellowdog uses the `yum` command-line utility to install software.


    For instance, to install the remote desktop connection application `Remmina`,
    you would use this command:


    ```

    yum install remmina

    ```

