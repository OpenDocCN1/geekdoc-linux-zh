    该命令将生成类似下面的输出：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m44ce4bfb.jpg)


    寻找以“default via”开头的行。你系统的默认网关就是这两个单词后面的 IP 地址。在示例截图中，默认网关为 `192.168.2.1`。


    ### 获取 IP 地址


    大多数情况下，你的 Linux 系统将从 `DHCP` 服务器接收 IP 地址。


    `DHCP` 代表“动态主机配置协议”（Dynamic Host Configuration Protocol），它是一种服务器，当客户端计算机连接到 `DHCP`
    服务器的网络时，它会为计算机分配 IP 地址。手动为每台计算机配置 IP 地址 既耗时又容易出错；如果一台或多台计算机接收到相同的 IP 地址，将由于地址冲突而无法连接。`DHCP`
    消除了这一过程中的猜测。当计算机插到以太网网络（或连接到无线网络）时，它会向 `DHCP` 服务器发送请求。如果网络上有 `DHCP` 服务器，它将为计算机提供
    IP 地址，并且 `DHCP` 服务器会确保没有两台计算机接收到相同的 IP 地址。


    大多数情况下，当你接入一个新网络时，会自动获得一个 `DHCP` 地址。但是，如果没有获得，请尝试此命令：


    ```bash

    dhclient

    ```


    注意，你需要以 root 权限运行 `dhclient`，无论是以 root 身份登录还是通过 `sudo` 借 root 权限。


    这将手动告诉你的系统搜索 `DHCP` 服务器并接受地址。如果此命令不起作用，说明要么你使用的网络没有运行正常的 `DHCP` 服务器，要么是某些阻止了 `DHCP`
    服务器与你的计算机通信。


    ### 释放 IP 地址


    `DHCP` 地址带有“租期”，这意味着你的计算机允许保留该地址的时间。通常，你的计算机会在租期过期前一半时联系 `DHCP` 服务器，并请求保留该地址，`DHCP`
    服务器几乎总是授予该许可。


    有时你想提前释放已租约的 IP 地址——例如你的网络 `DHCP` 服务器发生了变化，或者你的计算机拒绝释放其 IP 地址。你可以使用 `dhclient`
    命令和 `-r` 选项来实现：


    ```bash

    dhclient -r

    ```


    这会释放你的 IP 地址，然后你可以使用 `dhclient` 联系 `DHCP` 服务器以接收新地址。


    ### 测试你的 DNS 服务器


    如我们上面所述，如果你的 `DNS` 服务器停止响应，你可能会遇到各种网络问题。当它正常工作时，你会完全忘记它的存在。但一旦它故障，一切都会停滞。没有它，你无法在网络浏览器的地址栏中输入地址，也无法使用任何依赖
    `DNS` 的网络资源。


    要诊断你的 `DNS` 服务器，你可以使用名为 `nslookup` 的命令。`nslookup` 命令提供你当前 `DNS` 服务器的 IP 地址，并对该服务器进行测试查询以检查其运行情况。例如，如果你想确定你的
    `DNS` 服务器是否运行正常，可以使用此命令：


    ```bash

    nslookup distrowatch.org

    ```


    输出将类似所示：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m3e167586.jpg)


    前两行列出了你的计算机正在使用的 `DNS` 服务器。在这种情况下，我们使用的是 IP 地址为 `192.168.2.1` 的 `DNS` 服务器。第二组行显示了我们执行的查询结果——`distrowatch.org`
    的 IP 地址。在这种情况下，你可以看到 `distrowatch.org` 的 IP 地址为 `66.180.174.35`。由于 `nslookup`
    成功返回了 `distrowatch.org` 的 IP 地址，你知道你的 `DNS` 服务器运行正常。


    ### 测试连接性


    如果你曾经修理过电脑（甚至用过电脑），你就知道网络和互联网连接问题是令人沮丧的常见现象。幸运的是，命令行工具对于获取有关任何网络问题的价值信息有用。


    第一个且最常用的网络诊断命令是 `ping` 命令。“ping”代表“数据包互联网探测者”（Packet Internet Groper），它依赖于 `ICMP`
    协议，即互联网控制消息协议。基本上，`PING` 命令向网络目标（如服务器或其他 PC）发送一个数据包，如果目标处于激活状态，它会回一个确认包。例如，如果你想
    `ping` IP 地址为 `192.168.1.2` 的 PC，将使用此命令：


    ```bash

    ping 10.10.11.254

    ```


    如果 `10.10.11.254` 正常，`ping` 命令将生成类似下面的输出：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m2ef51a2a.jpg)


    `ping` 命令会持续 ping 目标直到你按下 `CTRL-C` 取消命令。


    该命令还有一些可以更改性能的选项。`-c` 告诉 `ping` 发送指定的数据包然后停止。例如，如果你只想 `ping` `192.168.1.2` 六次，请使用：


    ```bash

    ping -c 6 192.168.1.2

    ```


    ### 追踪路径


    有时网络是通的，但你无法访问目标。在这种情况下，`traceroute` 变得很有用。`traceroute` 命令映射到目的地的路径，并向每个设备发送 ICMP
    数据包。例如，要追踪 `google.com`，你可以这样使用 traceroute：


    ```bash

    traceroute google.com

    ```


    输出将类似所示，每行代表一个“跳数”（链中的另一个设备）：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m7e4bdb18.jpg)


    `traceroute` 命令默认运行到三十跳。


