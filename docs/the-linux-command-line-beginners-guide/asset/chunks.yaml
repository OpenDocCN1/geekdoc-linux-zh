    正如我们在 `rmdir` 命令章节中提到的，你可以使用 `rm` 命令来删除仍然包含文件和子目录的目录。你可以通过为 `rm` 加上 `-R` 选项来实现。如果你想删除一个名为
    `/home/jmoeller/storage` 且仍含有文件的目录，可以使用此命令：


    ```

    rm -R /home/jmoeller/storage

    ```


    `rm` 命令将删除 `/home/jmoeller/storage` 及其包含的任何文件。该命令还会删除 `/home/jmoeller/storage`
    包含的所有子目录，以及这些子目录中的任何子目录。不需说，在使用带有 `-R` 选项的 `rm` 时一定要小心！如果不小心，你可能会抹掉文件系统的整个分支并丢失重要数据。


    （注意，`-R` 选项也适用于 `cp` 命令，因此你同样可以一次性复制文件系统的大部分。）


    `rm` 命令还可以配合通配符，我们将在本章末尾讨论这一点。


    # 文件归档与压缩


    管理大量的文件和目录可能会非常棘手，特别是当它们分散在几个目录中时。将这些文件收集并创建一个单一归档要简单得多——归档是由许多小文件创建的一个大文件，你之后可以将其解压回各个文件。压缩文件也很有用——压缩文件以这种方式打包，使其在硬盘上占用的空间更小。现代硬盘容量巨大，因此压缩文件可能没有以前那么关键了。然而，你从网上下载的许多文件都是压缩过的，所以你需要知道如何解压缩它们。当你将文件上传到互联网或将其作为邮件正文发送时，你可能需要压缩它们以节省空间。


    你可以使用 `tar` 命令从命令行创建归档。使用 `tar` 工具创建的归档通常具有 `.tar` 扩展名，通常被称为“tar 包”（tarballs）。要使用
    `tar` 创建归档，你需要同时使用 `-c` 选项（创建归档）和 `-f` 选项（指定归档名称）。以下命令将在当前工作目录下为你的 `~/Documents`
    文件夹创建一个名为 `storage.tar` 的归档：


    ```

    tar -cf storage.tar ~/Documents

    ```


    （使用包含文件的目录而不是许多单独的文件来创建 tar 归档被认为是一个习惯。这样归档解压后会形成单一目录，而不是许多单独的文件。）


    这将在当前目录下创建 `storage.tar` 文件。在使用 `tar` 时，务必记住为你创建的归档指定 `.tar` 扩展名，因为 `tar` 不会自动这样做。（注意，`tar`
    不会任何方式更改原始文件——它只是创建了文件的归档副本。）


    然而，这个新的归档文件并没有压缩，占用的空间与你的 `~/Documents` 文件夹完全相同。要对其压缩，你需要使用带有 `-z` 选项的 `tar`，它使用
    `gzip` 压缩进行归档。以下命令将创建一个压缩归档：


    ```

    tar -czf storage.tar.gz ~/Documents

    ```


    你可能还想添加 `-v` 选项，用于“详细”输出，这意味着 `tar` 会告诉你是它正在做什么，并在出错时通知你：


    ```

    tar -czvf storage.tar.gz ~/Documents

    ```


    现在你已经将文件整齐地打包进归档中，你可能想要解压它们。要从 `tar` 归档解压文件，你使用 `-x` 选项进行提取（eXtract），而不是使用 `-c`
    选项进行压缩：


    ```

    tar -xvf storage.tar

    ```


    如果 `tar` 归档是用 `gzip` 压缩过的，当你想要解压缩时，确保在命令中添加 `-z` 选项：


    ```

    tar -xzvf storage.tar.gz

    ```


    `tar` 命令在各种情况下都用，但它相当复杂。归档和压缩文件的更简单方法是使用 `zip` 和 `unzip` 命令。参考我们之前的示例，如果你想为你的
    `~/Documents` 目录创建一个 zip 文件，可以使用此命令：


    ```

    zip -r backup.zip ~/Documents

    ```


    这将在当前工作目录下创建 `backup.zip` 文件。


    要解压缩 zip 归档，你将使用 `unzip` 命令：


    ```

    unzip backup.zip

    ```


    注意，文件解压在工作目录。或者，如果你配合绝对文件路径使用 `unzip`，文件将解压在源 zip 文件所在的目录中。


    # 通配符


    我们讨论了复制文件、移动文件、重命名文件和删除文件，现在我们将描述 shell 的一项功能，它能让你的文件操作命令变得强大得多。通常，当你使用 `cp` 或
    `rm` 命令时，它们一次只影响一个文件。但如果你在文件操作命令中使用通配符，你就可以同时影响成百甚至数千个文件。


    什么是通配符？“通配符”是代表多个其他字符、甚至是所有其他可能字符的特殊字符。第一个通配符字符问号（`?`）代表一个潜在的字符。例如，假设你的当前工作目录下有七个名为
    `Caina1.doc`、`Caina2.doc` 等的文件。如果你想删除它们，可以使用 `rm` 命令一个一个删除。或者，你可以配合通配符使用 `rm`：


    ```

    rm Caina?.doc

    ```


    这将删除工作目录下所有以 “Caina” 开头、以 `.doc` 为扩展名且在 “Caina” 之后跟有单个字符的文件。你也可以将该字符用于 `cp`、`mv`、`ls`
    和其他命令——你可以复制 `Caina?.doc` 文件，或移动它们，或者配合 `ls` 使用来仅查看这些文件。


    第二个通配符字符星号（`*`）更加强大。问号通配符只代表单个字符。星号代表任意数量的字符。例如，如果你想删除当前目录下所有的 `.doc` 文件，你可以一个一个删除。或者，你可以配合星号通配符使用
    `rm`：


    ```

    rm *.doc

    ```


    这将删除工作目录下所有扩展名为 `.doc` 的文件。不需说，在使用 `rm` 命令配合通配符时一定要小心！


