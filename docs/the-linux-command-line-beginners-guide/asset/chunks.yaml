    ## 关于作者


    Jonathan Moeller 身高六英尺以上，拥有西米利亚柯南般深邃的蓝色眼睛、如日西哥特战士王般的铜色头发，以及如人类指挥官般严严的面容，可惜的是，这些对他作为电脑维修员的职业来说毫无用处。

