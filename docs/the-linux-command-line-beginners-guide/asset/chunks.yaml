    # THE LINUX COMMAND LINE BEGINNER''S GUIDE


    Jonathan Moeller


    ## Description


    The Linux Command Line Beginner''s Guide gives users new to Linux an introduction
    to the command line environment.


    In the Guide, you''ll learn how to:


    - Copy, move, and delete files and directories.

    - Create, delete, and manage users.

    - Create, delete, and manage groups.

    - Use virtual terminals.

    - Use the `bash` shell.

    - Safely use the root account with `su` and `sudo`.

    - Change permissions and ownership of files and directories.

    - Create and edit text files from the command line, without using a graphical
    editor.

    - Diagnose network connectivity problems.

    - And many other topics.


    ***


    The Linux Command Line Beginner''s Guide


    Jonathan Moeller


