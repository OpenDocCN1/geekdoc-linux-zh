    相反，我决定将这本书分为“概念”章节和“命令”章节。“概念”章节将解释 Linux 命令行的一些底层概念——例如，文件系统，或者用户账户的工作原理。在每个“概念”章节之后，会紧跟一个或多个“命令”章节，描述处理该概念的各个命令。关于文件系统的章节之后，是一个描述移动、复制和删除文件及文件夹的命令的章节。希望这种方法能让读者理解命令行的底层概念，并掌握相关
    Linux 命令的实操知识。


    # 我为什么要写这本书


    我开始写关于计算机和技术的内容几乎完全是个偶然。我的写作生涯始于成为一名奇幻小说作家，具体来说是写剑与与魔法小说。（现在我所有的书籍都提供所有主流的电子书格式；请参阅“作者的其他书籍”部分查看链接。）像每一个优秀的奇幻作家一样，我有一个博客，试图在其中推销我的书籍，正如你所预料的，那个博客每月只能吸引三十或四十次访问。


    有一天，我碰巧写了一篇文章，关于我在 Ubuntu Linux 8.04 上使用 Samba 文件共享服务器的一个问题。让我非常惊讶的是，第二天我看到那篇文章通过人们在
    Google 上搜索 Ubuntu 的 Samba 问题收到了近六十次访问。从那里开始，转向定期写技术博客（并通过网络广告获利）只有一步之遥，接着当我 2010
    年开始使用 Kindle 时，我开始编写技术主题的短篇电子书。


    我决定写这本书是因为我看到许多人尝试学习 Linux，却因为对命令行感到沮丧而放弃了。在我之前的一一书《Ubuntu 初学者指南》（THE UBUNTU BEGINNER''S
    GUIDE）中，我专门用了几个章节讲解命令行，但那本书主要侧重于将 Ubuntu 配置为服务器。通过这本书，我希望帮助新用户学习 Linux 命令行界面，无论是尝试
    Linux 的家庭用户，还是寻求新技能的 IT 专业人员。


    # 关于 Linux 版本的说明


    如上所述，有许多不同的 Linux 发行版。书中描述的大多数命令在大多数不同的 Linux 发行版都可以运行。尽管如此，有时特定的 Linux 发行版会以特定的方式配置命令，因此有时在一个
    Linux 发行版上有效的命令或选项在另一个发行版上可能无法运行。这种情况通常只发生在那些更奇特或冷门的命令和工具上，但确实会发生。查看发行版的文档和帮助手册（man
    pages）以获取精确信息始终是一个好主意（我们将在书的最后一章向你展示如何这样做）。


    本书截图是在 Ubuntu 11.10、Linux Mint 12 和 Fedora 16 上截取的。


    ## 第 1 章 - 概念：终端与虚拟控制


    在从命令行执行任何操作之前，你必须先实际访问命令行界面。当你启动 Ubuntu、Linux Mint 或另一个带有图形界面的 Linux 发行版时，你可能会好奇如何进入命令行。在本章中，我们将讨论如何从基于
    GUI 的 Linux 发行版和基于 CLI 的发行版进入命令行界面。我们还将向你展示如何在 GUI 或纯 CLI 环境中同时打开多个命令行窗口。


    ## 从从基于 CLI 的发行版中访问命令行


    某些 Linux 发行版（如 Ubuntu Server）不包含 GUI。对于此类发行版，进入命令行并不困难。你只需要启动计算机或服务器，系统就会进入登录提示符。输入你的用户名和密码，你就会登录系统并到达命令行提示符，也称为终端会话（terminal
    session）。“终端”一词可以追溯到 UNIX 运行在大型主机机上的时代，当时通过远程终端进行访问。


    有时，你可能会在已开启的 CLI Linux 机器上看到空白屏幕。这不需要恐慌——为了节省电源，系统通常被配置为在活动一段时间后关闭显示器。只需按下空格键即可再次唤醒显示器。


    ## 从基于 GUI 的发行版中访问命令行


    从基于 GUI 的 Linux 发行版访问命令行稍微复杂一点。默认情况下，基于 GUI 的发行版会进入图形界面。即使在 GUI 内部，访问命令行提示符也很简单。有两种常用方法。


    第一种最常见的方法是名为“终端模拟器”（terminal emulator）的应用程序。顾其名，终端模拟器会在你的 GUI 窗口内重建命令行环境。你可以从终端模拟器应用程序访问全范围的
    Linux 命令，但你仍然可以使用 GUI 的益处——鼠标、菜单栏以及复制与粘贴。（复制与粘贴特别有用，因为你可以将复杂且长篇大论的命令复制并粘贴到终端模拟器中，而无需费力输入它们。）


    几乎所有的桌面 Linux 发行版都包含一个终端模拟器应用程序。你通常可以通过进入“应用程序”菜单，然后进入“附件”类别，最后点击“终端”图标来启动它。如果你的发行版带有快速启动栏（如
    Ubuntu 的 Unity 启动器），终端模拟器的图标经常被固定在启动器上。


    在 Linux GUI 中访问命令的第二种方法是通过“虚拟控制台”（virtual console）。我们将在本章讨论虚拟控制台，但首先我们先描述如何打开多个终端窗口。


    ## 在 GUI 中打开多个终端窗口


    在 GUI 中使用终端模拟器应用程序的一个很棒的功能是能够打开多个终端窗口。运行多个终端窗口有几个优势——如果你运行一个显示实时输出的命令（如 `top`
    监控命令），你可以打开一个新窗口来执行额外的命令。或者如果你正在运行一个处理时间很长的命令（例如复制几个 GB 的文件），你可以打开一个新窗口，并在第一个命令完成运行时运行另一个命令。


    大多数终端模拟器应用程序都支持打开新的终端窗口。为此，你通常进入“文件”菜单并选择“新窗口”（New Window）或“新终端”（New Terminal）。一个新的终端窗口就会弹出。


    如果你不想让桌面堆满许多窗口，大多数终端应用程序现在都提供了标签页（tabs），就像 Mozilla Firefox 和 Google Chrome 浏览器允许你为不同的网页打开新标签页一样。如果你在终端模拟器中打开新标签页，菜单栏下方会出现一排标签页，每个标签包含一个独立的终端会话。通常，你可以通过进入“文件”菜单并点击“新标签页”（New
    Tab）来打开。


    显然，图形终端应用程序无法在命令行环境中运行。尽管如此，仍然可以使用“虚拟控制台”从命令行运行多个终端窗口，我们将在下一节讨论这一点。


    ## 虚拟控制台


    虚拟控制台本质上是对同一台计算机的第二次连接。记住 Linux 是基于 UNIX 的，而早期的 UNIX 机器大多数是大型主机。为了连接到这些主机，用户使用远程控制台或哑终端。由于
    UNIX 是一个多用户操作系统，多个用户可以从不同的控制台同时登录到主机。


