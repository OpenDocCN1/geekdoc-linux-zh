    ## Chapter 18 - Concept: Networking


    The days of the stand-alone home computer are long gone. Modern servers and workstations
    are almost always connected to the Internet, or at least a local area network.
    To effectively use a Linux system from the command line, you''ll need at least
    a basic knowledge of TCP/IP computer networking, along with the network commands
    available from the prompt. In this chapter, we''ll give you a basic overview of
    networking.


    ### WHAT IS AN IP ADDRESS?


    First, however, we should discuss IP addresses. Before we explain the Linux command
    prompt''s networking commands, it’s a good idea to have a firm grasp of the basics
    of IP addressing.


    The letters "IP" stand for Internet Protocol, and the Internet Protocol is part
    of the `TCP/IP` (Transmission Control Protocol/Internet Protocol) suite, a group
    of related protocols that lay down the rules for how computers communicate over
    networks, both over LANs and the larger Internet. An IP address, therefore, is
    a (theoretically) unique address assigned to a computer. It''s a bit like a street
    address - it lets other computers send traffic to and receive traffic from your
    system. An IP address consists of four groups of numbers separated by dots:


    `192.168.1.1`


    These numbers are actually the numerical form of a binary number. None of these
    numbers can be higher than `255`. (While watching a detective TV show, it’s occasionally
    hilarious to see the police track a criminal using a ludicrously implausible IP
    address, like `689.34.385.339`.)


    The dominant version of the IP protocol is Version 4, commonly referred to as
    `IPv4`. Under `IPv4`, there are only 4.6 billion IP addresses available, and the
    available IP addresses ran out in late 2011. (`IPv6`, which has many more available
    addresses, will eventually replace `IPv4`, but for now, `IPv4` remains dominant.)
    There are obviously far more computers, phones, routers, switches, and other networked
    devices in the world than 4.6 billion, so how do all these devices receive IP
    addresses?


    The answer is a "private IP address." Certain blocks of IP addresses have been
    reserved for use in private networks. These blocks, using a technology called
    Network Address Translation (`NAT`), are then "translated" to public IP addresses.
    This has extended the lifetime of the available `IPv4` address space for decades.
    The ranges of the reserved private addresses are:


    `10.0.0.0 - 10.255.255.255`

    `172.16.0.0 - 172.31.255.255`

    `192.168.0.0 - 192.168.255.255`


    Odds are, your computer has an IP address in one of those ranges as part of a
    private network (even if it''s just a private network generated by your wireless
    router).


    ### SUBNET MASKS


    IP address also have a "subnet mask". A subnet mask defines which parts of the
    IP address designate the network, and which part designates the individual computer.
    Let''s say the IP address of `192.168.1.1` from above has a subnet mask like this:


    `255.255.255.0`


    That means the `192.168.1` part of the address indicates the network, while the
    final `1` indicates the computer.


    IP addresses usually include a “broadcast” address. Any traffic sent to the broadcast
    address is directed to every single computer in the local network. A broadcast
    address has a “255” as its final number, so a computer with a `192.168.1.1` address
    will have a broadcast address of `192.168.1.255`.


    ### DEFAULT GATEWAY


    Lastly, IP addresses usually (but not always) come with a "default gateway". The
    default gateway is the address you computer sends traffic destined for anywhere
    outside the local network segment. Like, say you want to visit Google with your
    web browser. Your computer recognizes that Google isn''t on the `192.168.1.*`
    network, and so forwards the request to the default gateway, which then sends
    the traffic on to Google. (This is a simplification, but adequate for our purposes.)


    ### DNS


    The final important piece of basic networking is the Domain Name System, or `DNS`.


    As we mentioned above, every website on the Internet has, in theory, its own unique
    web address. Remembering all of those IP addresses can prove impractical. A few
    people might have keen enough memories to remember that `microsoft.com` has an
    IP address of `206.46.232.182` (at least at the time of this writing). `DNS` maps
    each address to a domain name. `DNS` provides an easier way to find websites.
    When you type a web address, such as `microsoft.com`, your request goes to the
    `DNS` server. `DNS` server is integral to the smooth functioning of most networks.


