  raw: 'Once you''re done viewing the file, you can return to the command line by
    hitting the q key.


    The cat, head, tail, and less commands will let you view text files, but they
    won''t let you make any changes to those files. We''ll show you how to edit text
    files in the next chapter.


    ***


    ## Chapter 17 - Editing Text Files


    The previous chapter showed you how to view text files from the command line.
    This chapter will explain how to edit text files from the command line. To do
    so, you use a program called a “text editor” that operates from the CLI. Usually,
    when you think of a text editor, a word processor like Microsoft Word or LibreOffice
    Writer comes to mind. An actual “text editor” is far more bare-bones, and devoted
    exclusively to editing text files.


    There are a number of different text editors available, all with their own pros
    and cons. In this chapter, we will focus on a text editor called vi, which is
    included in almost all Linux distributions. The vi editor is also fairly easy
    for new users to learn, which is why we will discuss it here.


    WHAT IS VI?


    The vi editor has been around for a long time. It grew out of a series of early
    UNIX text editors in the 1960s and the 1970s, with the first version developed
    by programmer Bill Joy in the late 1970s. Later, vi was praised for its small
    memory footprint, which meant it could be used on systems with low amounts of
    available memory.


    The variant of vi included with most versions of Linux is actually vim, which
    stands for "vi Improved." Vim was developed by a programmer named Bram Moolenaar
    in the early 1990s. Today, vim is generally the most popular variant of vi.


    However, the vi command is still symbolically linked to vim, so typing vi into
    a Linux command line will launch vim.


    LAUNCHING VI


    Launching vi is simply a matter of typing the command:


    vi


    This will take you to an empty file, and you can create text files from here.


    However, you''ll often use vi to view or edit an existing text file. If you wanted
    to use vi to open a file named test.txt:


    vi test.txt


    The vi editor will then launch with the test.txt file open.


    You can also use vi to create new files. For instance, if you wanted to use vi
    to create a text file named newfile.txt:


    vi newfile.txt


    However, note that the file isn''t actually written to disk (and therefore doesn''t
    exist permanently) until you save it. We''ll discuss how to do that in the next
    section.


    VI MODES


    Vi is not like a graphical word processor, in that you can''t simply sit down,
    fire it up, and start typing. Vi has different modes of operation, each of which
    has a different function. If you think of vi as a Swiss army knife, then the modes
    are the different kinds of blades and attachments within the knife.


    Vi has four modes:


    -Normal mode. Vi starts in default mode, and you can delete text from within normal
    mode.


    -Command mode. This lets you save your text file.


    -Insert mode. This lets you type fresh text into your file.


    -Replace mode. This is similar to Insert mode, but you can overtype text, which
    you can''t do in Insert mode.


    Let''s take a closer look at each of the modes.


    NORMAL MODE


    Vi starts in Normal mode. Normal mode lets you navigate around the text file by
    moving the cursor with the up and down arrow keys, along with the Page Up and
    Page Down keys. Pressing the HOME key takes you to the beginning of the file,
    and pressing END moves you to the end. You can also use Normal mode to delete
    text within the file, from single characters all the way up to entire lines. Normal
    mode also offers a search feature, allowing you to quickly locate specific search
    terms within the file.


    First, let''s take a look at the commands to delete text within Normal mode.


    -Pressing dw deletes the word immediately after the cursor. This command also
    deletes the space following the word.


    -Pressing de also deletes the word immediately following the cursor. Unlike dw,
    however, it does not delete the space following the word.


    -Pressing d$ deletes from the cursor to the end of the current line.


    -Pressing dd deletes the entire current line.


    -Pressing p inserts the text from the last deletion after the current location
    of cursor. Essentially, in conjunction with the deletion commands, this lets you
    cut and paste within vi.


    -Pressing u undoes the last action. Trust me, if you''ve made a mistake while
    editing a text file with vi, this can definitely come in handy.


    -Pressing CTRL-G (the CTRL and the G keys at the same time) displays a status
    bar at the bottom of the screen. The status bar will display the name of the file,
    whether or not it has been modified since the last time it was saved, which line
    and column the cursor currently occupies, and how far into the file you are as
    a percentage.


    -Pressing / (forward slash) activates the search function. Type a search term
    and hit enter, and vi will take you to the first instance of the search term.
    You can then hit the N key to jump to the next instance of the term.


    Once you''ve deleted items from your text file, you may want to save the changes.
    We''ll show you how to do that next in Command mode.


    COMMAND MODE


    Normal mode lets you navigate around a text file and delete parts of it, but Command
    mode lets you save your file. Command mode also lets you quit vi, with or without
    saving your text file first.


    To access Command mode, you must first be in Normal mode. Press the colon key
    (the : key), and you’ll be moved to Command mode. You’ll know you’re in Command
    mode when you see a : prompt at the bottom of your screen.


    Let’s look at the commands you can use while in Command mode (note that you must
    hit the Enter key after typing these commands):


    -Pressing the w key writes the current text file to disk. This basically means
    that the file is saved. If you used vi to create a new file, it is written to
    disk. If you’re editing a file, any changes you made to the file are written to
    the disk. So only use the w command if you’re absolutely sure you want to save
    your changes.


    -Pressing the q key quits vi and returns you to the command prompt. Note that
    the q command will only work if you haven’t made any changes to the text file,
    or if you’ve made changes but haven’t yet saved them to disk.


    -Pressing the q! keys forces vi to quit, even if you haven’t yet written your
    current text file to disk. This generally gets used when you''ve made serious
    mistakes editing a text file and want to start over from scratch. Remember, any
    changes you made to the text file are discarded, so only use q! if you don’t want
    to save your changes.


    -Pressing wq, as you might expect, combines the w and q commands. This command
    writes your file to disk, and then exits vi.


    -Typing exit and then hitting the Enter key does the same thing as wq.


    INSERT MODE


    Insert mode, as the name suggests, lets you insert text into the text file. Access
    Insert mode by pressing the INSERT key while in Normal mode. You can also enter
    Insert mode by pressing the I key or the S key while in Normal mode.


    Insert mode works much like most people expect a word processor to work – you
    type, and the text appears on the screen. You can also use the arrow keys and
    Page Up and Page Down to navigate around the file, even while in Insert mode.


    Text is inserted to the right of the cursor. Note that Insert mode doesn’t overwrite
    text when you type. Any text that already exists is pushed to the right as you
    add new text.


    To return to Normal mode from Insert mode, press the ESC key.


    Note that you can’t enter Command mode from within Insert mode, since Insert mode
    interprets the colon character (:) as simply another text character and adds it
    to the file.


    REPLACE MODE


    The final mode of vi, Replace mode, works almost exactly like Insert mode, but
    with one key difference. Replace mode overwrites existing text as you type.'
