    a neatly organized system, so to do directories allow you (and the operating system)
    to keep track of files.


    (Incidentally, the term “directory” and “folder” mean the same thing. So when
    you hear someone talk about accessing their Documents folder, they''re talking
    about the same thing as their Documents directory. Since most modern GUIs use
    a folder icon to represent directories, using the word folder to refer to a directory
    has become common practice.)


    You can, of course, put directories within other directories. These directories-in-directories
    are generally called subdirectories, and they too can have subdirectories of their
    own.


    You can best visualize the structure of the filesystem by using the tree command:


    tree


    This will display the filesystem as a tree, starting with the topmost directory,
    and working its way down the various subdirectories.


    Linux''s standard subdirectories have been pretty well defined for many years,
    but we''ll start by discussing the most important directory in the filesystem.


    THE ROOT DIRECTORY'
