    # WHY LEARN VI?


    Compared to graphical word processors like LibreOffice or AbiWord, `vi` seems
    hideously complicated. Why learn it?


    Because, as we mentioned above, you’ll need it when working from the command line
    in an environment with no GUI. If you want to use Linux from the command line,
    you’ll need to learn `vi` (or another command line editor). Besides, `vi` is actually
    pretty easy to learn. After some practice, you’ll be editing text files with ease.


