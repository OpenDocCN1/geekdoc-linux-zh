    ## 第 18 章 - 概念：网络


    单机家用电脑的时代早已远去。现代服务器和工作站几乎总是连接到互联网，或者至少连接到局域网。为了从命令行有效地使用 Linux 系统，你至少需要具备 TCP/IP
    计算机网络的基础知识，以及提示符可用的网络命令。在本章中，我们将为你提供有关网络的基本概述。


    ### 什么是 IP 地址？


    首先，我们应该讨论一下 IP 地址。在解释 Linux 命令行提示符的网络命令之前，牢固掌握 IP 地址的基础知识是一个好主意。


    字母“IP”代表互联网协议（Internet Protocol），而互联网协议是 `TCP/IP`（传输控制协议/互联网协议）套件的一部分，这是一组相关的协议，它们规定了计算机在网络（包括局域网
    LAN 和更广泛的互联网）上进行通信的规则。因此，IP 地址是（理论上）分配给计算机的唯一地址。它有点像街道地址——它允许其他计算机向你的系统发送流量并从你的系统接收流量。IP
    地址由四组用点分隔的数字组成：


    `192.168.1.1`


    这些数字实际上是二进制数字的数值形式。这些数字中的任何一个都不超过 `255`。（看侦探剧时，偶尔看到警察使用一个荒谬且不可信的 IP 地址，如 `689.34.385.339`
    来追踪罪犯会觉得搞笑。）


    IP 协议的主导版本是第 4 版，通常被称为 `IPv4`。在 `IPv4` 下，只有 46 亿个 IP 地址可用，而可用 IP 地址在 2011 年底已经耗尽。（`IPv6`
    拥有更多的可用地址，最终将取代 `IPv4`，但目前 `IPv4` 仍然占据主导）。世界上计算机、手机、路由器、交换机和其他网络设备显然远于 46 亿，那么所有设备是如何获取
    IP 地址的呢？


    答案是“私有 IP 地址”。某些 IP 地址块被预留用于私有网络。这些地址块使用名为网络地址转换（`NAT`）的技术被“翻译”为公网 IP 地址。这使得可用的
    `IPv4` 地址空间寿命延长了几十年。预留私有地址的范围是：


    `10.0.0.0 - 10.255.255.255`

    `172.16.0.0 - 172.31.255.255`

    `192.168.0.0 - 192.168.255.255`


    很有可能，你的计算机在私有网络中拥有这些范围内的一个 IP 地址（即使它只是由无线路由器生成的私有网络）。


    ### 子网掩码


    IP 地址还有一个“子网掩码”（subnet mask）。子网掩码定义了 IP 地址的哪部分指定网络，哪部分指定单台计算机。假设上述 `192.168.1.1`
    IP 地址的子网掩码如下：


    `255.255.255.0`


    这意味着地址的 `192.168.1` 部分表示网络，而最后的 `1` 表示计算机。


    IP 地址通常（但并不总是）包含一个“广播”地址。任何发送到广播地址的流量都会定向到局域网中的每一台计算机。广播地址的最后一个数字是“255”，因此具有 `192.168.1.1`
    地址的计算机其广播地址为 `192.168.1.255`。


    ### 默认网关


    最后，IP 地址通常（但并不总是）带有一个“默认网关”。默认网关是你的计算机发送往局域网段之外任何地方流量的地址。例如，假设你想用浏览器访问 Google。你的计算机识别出
    Google 不在 `192.168.1.*` 网络上，因此将请求转发到默认网关，然后由网关将流量发送到 Google。（这是一种简化，但对于我们的目的已经足够。）


    ### DNS


    基础网络的最后一个重要部分是域名系统（Domain Name System），即 `DNS`。


    正如我们上面提到的，互联网上的每个网站在理论上都有自己唯一的网页地址。记住所有这些 IP 地址可能是不切实际的。有些人的记忆力非常好，能记住 `microsoft.com`
    的 IP 地址是 `206.46.232.182`（至少在写作时如此）。`DNS` 将每个地址映射到域名。`DNS` 为查找网站提供了更方便的方法。


    ***


    ## 第 19 章 网络命令


    上一章解释了网络基础。在本章中，我们将向你展示处理网络的命令。


    ### 查找你的 IP 地址


    在大多数 Linux 发行版中，从命令行查找 IP 地址实际上比从 GUI 简单得多。只需在提示符输入此命令：


    ```

    ifconfig

    ```


    `ifconfig` 命令将生成类似下面的输出：这里有很多信息，但大部分都是有用的。`eth0` 指系统上的第一个以太网连接。`inet addr` 显示系统的
    IP 地址，而 `Mask` 显示子网掩码。`HWaddr` 显示以太网适配器的 MAC（介质访问控制）地址，该地址理论上是唯一的。（某些无线网络在允许系统连接之前要求提供
    MAC 地址。）


    你可以将 `ifconfig` 命令的输出通过给 `grep` 来快速找到你需要的特定项目。假设你只想查找 IP 地址：


    ```

    ifconfig | grep inet

    ```


    这次输出将看起来像这样，你可以从中从中快速选出你的 IP 地址。同样，你可以通过 `ifconfig` 和 `grep` 快速找到计算机的 MAC 地址。（MAC
    地址代表介质访问控制，理论上对每个网络适配器都是唯一的。）


    ```

    ifconfig | grep HWaddr

    ```


    ### 查找你的默认网关


    `ifconfig` 命令生成了大量有用的输出，但它不包含默认网关的地址。要做到这一点，你可以使用 `ip` 命令配合 `route` 选项：


    ```

    ip route

    ```


