    The Linux command line is a complex environment. We''ve done our best to show
    you the basics, but we can''t cover every single option and scenario here. And
    as you grow in experience and knowledge, you will want to perform more advanced
    tasks than covered in this book. Fortunately, Linux comes with a comprehensive
    built-in help system, and we''ll show you how to use it in this chapter.


    ### APROPOS


    The first step in using the help system is the `apropos` command.


    Sometimes you know what task you want to perform from the command line, but you
    don''t know what command you want to use. This is when the `apropos` command comes
    in handy, since it lets you search by topic or keyword. For example, let''s say
    you want to perform a task involving the `ext3` filesystem, but you can''t quite
    recall the precise command. You can do a search with the `apropos` command:


    ```bash

    apropos ext3

    ```


    The command will generate an output that looks like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m7546cf3e.jpg)


    The output will list every command that has “ext3” in its description, allowing
    you to jog your memory.


    Where does `apropos` get its information? The command draws its output from Linux''s
    built-in manual pages, which we''ll describe in the next section.


    ### MAN PAGES


    Every command in Linux has (at least in theory) an accompanying “manual page”,
    commonly shortened to “man page.” The man page is a text document describing the
    command, detailing its options, and providing examples for its use. Man pages
    were first included in UNIX in the early 1970s, and appear in almost every distribution
    of Linux.


    How do you access the man page for a particular command? You do this using the
    `man` command, followed by the name of the command for which you wish to view
    the manual page. For instance, if you wanted to view the man page for the `nslookup`
    command, you would use this command:


    ```bash

    man nslookup

    ```


    This will open the man page for the `nslookup` command.


    Once the man page is open, it acts quite a bit like the `less` command. You can
    use the up and down arrow keys to scroll through the text line by line, along
    with the `PAGE UP` and `PAGE DOWN` keys to move through a page at a time. Like
    the `less` command, the `man` utility supports searches. Hit the forward slash
    (`/`) key to type a search term, and the `man` utility will jump to the first
    instance of the term in the text. You can then hit the `N` key to jump from instance
    to instance.


    Once you''ve finished reading the man page, you can exit by hitting the `Q` key
    to return to the prompt.


    What information can you expect to find in a man page? The actual layout of a
    man page will vary from distribution to distribution, but there are usual several
    standard sections.


    - The first section is the title, which will list the name of the command.

    - The second section is the name, which will again display the name of command,
    and provide a short summary of its function.

    - The third section is the synopsis, which provides a brief description of the
    command''s syntax.

    - The fourth is the description, which is the actual meat of the man page. In
    the description, you''ll find the options and functions of the command listed
    in detail. There are usually examples of the command''s usage here as well.

    - The final sections of the man page display the programmer of the command itself,
    an address for reporting bugs, copyright information, and other man pages that
    might be relevant.


    Using the `man` utility, you can obtain useful information on any command on your
    Linux system.


    ***


    ## Other books by the author


    ### The Ubuntu Beginner’s Guide


    The `Ubuntu Beginner''s Guide` gives users new to Ubuntu Linux an overview of
    the operating system, from simple command-line tasks to advanced server configuration.
    In the Guide, you’ll learn how to work from the command line, edit the system
    configuration, manage network settings, install and use powerful applications,
    and use Ubuntu to host robust server applications.


    Follow this link to read [The Ubuntu Beginner''s Guide](http://computerbeginnersguides.com/blog/books/the-ubuntu-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-ubuntu-beginners-guide/)


    #### The Windows Command Line Beginner’s Guide


    The `Windows Command Line Beginner''s Guide` gives users new to the Windows command
    line an overview of the Command Prompt, from simple tasks to network configuration.
    In the Guide, you’ll learn how to manage the Command Prompt, control files and
    directories, assign permissions, manage file shares, manage disk settings, create
    batch files, and many other topics.


    Follow this link to read [The Windows Command Line Beginner''s Guide](http://computerbeginnersguides.com/blog/books/the-windows-command-line-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-windows-command-line-beginners-guide/)


    #### The Linux Command Line Beginner’s Guide


    The `Linux Command Line Beginner''s Guide` gives users new to Linux an introduction
    to the command line environment. In the Guide, you’ll learn how to use the `bash`
    shell, manage the Linux filesystem, create and delete users and groups, take and
    assign ownership of files, properly use the `root` account, edit text files, diagnose
    network problems, and many other tasks.


    Follow this link to read [The Linux Command Line Beginner''s Guide](http://computerbeginnersguides.com/blog/books/the-linux-command-line-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-linux-command-line-beginners-guide/)


    ### The Ubuntu Desktop Beginner’s Guide


    Want to use Ubuntu without having to learn the command line? Then this is the
    book for you! `UBUNTU DESKTOP BEGINNER''S GUIDE` will show you how to use the
    desktop interface. In the Guide, you''ll learn how to install and update Ubuntu,
    configure and use the desktop environment, manage the filesystem, connect to networks,
    install applications, and many other tasks.


    Follow this link to read [The Ubuntu Desktop''s Guide](http://computerbeginnersguides.com/blog/books/the-ubuntu-beginners-guide/)
    (the-beginners-guide/).


    ### The Linux Mint Beginner’s Guide


    The `Linux Mint Beginner''s Guide` will show you how to get the most out of Linux
    Mint, from using the `Cinnamon` desktop environment to advanced command-line tasks.
    In the Guide, you will learn how to install Linux Mint, use the desktop environment,
    work from the command line, edit the system configuration, manage network settings,
    install and use powerful applications, and use Linux Mint to host robust server
    applications.


    Follow this link to read [The Linux Mint Beginner''s Guide](http://computerbeginnersguides.com/blog/books/the-linux-mint-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-linux-mint-beginners-guide/)


    ### The Windows 8 Beginner’s Guide


    Intended for users new to Windows 8, this book gives you an overview of Microsoft''s
    new tablet operating system. Lavishly illustrated with over 200 screenshots, this
    book will explain the differences between the editions of Windows 8, how to get
    the most of the Start Screen, how to use the Windows 8 Desktop, the best methods
    for installing apps from the Windows Store, and many other useful items.


    Click on this link to read [The Windows 8 Beginner''s Guide](http://computerbeginnersguides.com/blog/books/the-windows-8-beginners-guide/)
    (http://computerbeginnersguides.com/blog/books/the-windows-8-beginners-guide/)


