    Virtual consoles are a legacy of those mainframes. Most Linux versions support
    a maximum of seven “virtual” consoles, software consoles built into the operating
    system that mimic the function of those old dumb terminals. Basically, a user
    can log into the operating system using one of those virtual consoles, and then
    a second user could switch to a different virtual console and log in, leaving
    the first user''s session unaffected (though they would, of course, have to share
    the keyboard and mouse).


    As we mentioned, Linux supports seven virtual consoles. To switch between virtual
    consoles, press the `CTRL-ALT-FUNCTION#` keys simultaneously. So to switch to
    virtual console one, you would hit `CTRL-ALT-F1`, to switch to virtual console
    2, `CTRL-ALT-F2`, and so forth. When you switch to a new virtual console, you''ll
    see a standard prompt to log in. You (or another user) can then log into the virtual
    console without affecting your original session.


    If you have a version of Linux running a GUI, you can also use virtual consoles.
    By default, the GUI runs in virtual console seven (`CTRL-ALT-F7`). You can switch
    to any of the other six virtual consoles. When you are finished, you can return
    to the GUI by hitting `CTRL-ALT-F7`.


    ***


    ## Chapter 2 - Concept: The bash shell


    When you use the Linux command line, you are almost certainly using a program
    called the `bash` shell. After you''ve finished reading this chapter, you''ll
    understand what a shell is, and how it relates to the Linux command line. You''ll
    also knew some tips and tricks to wring maximum functionality out of the `bash`
    shell.


    ### WHAT IS A SHELL?


    In computing, a “shell” doesn''t refer to the hard covering of a mollusk, a kind
    of pasta, or a type of artillery ammunition. Instead, the term “shell” generally
    refers to the program that serves as the interface between the user and the computer''s
    operating system. When you use a computer, you are not communicating directly
    with the operating system. Instead, you are issuing commands through a shell,
    which then passes the instructions on to the operating system for you.


    Both a graphical user interface and a command line interface qualify as a shell.
    There are numerous different command-line shells available for Linux – the `sh`
    shell, the `zsh` shell, the `c` shell, and others. The most common shell by far
    is the `bash` shell, which we will discuss in the next section.


    ### THE BASH SHELL


    Programmer Brian Fox wrote the first version of the `bash` shell in the later
    1980s as part of the GNU Project. The “bash” name is a pun – it stands for Bourne-again
    shell. The Bourne shell was one of the most popular UNIX shells, but as it was
    not free software, users could not modify and distribute it legally. The GNU Project
    and the Free Software Foundation both wanted to create a free alternative to the
    Bourne shell – hence, the “Bourne-again shell”, the `bash` shell.


    The `bash` shell is far and away the most common Linux shell. Most Linux distributions
    use the `bash` shell as their default command shell, and even Mac OS X (which
    is technically a version of UNIX) uses the `bash` shell as its default terminal
    emulator. Familiarizing yourself with the `bash` shell will prove useful across
    a wide variety of Linux distributions, and even on Macs.


    In the next sections, we''ll go over some of the `bash` shell''s useful features.


    ### THE COMMAND PROMPT


    First, we will examine the command prompt itself. If you boot into a CLI environment,
    or you launch a terminal emulator application, the first thing you see if the
    prompt. (The name comes because it is “prompting” you to enter a command.) The
    prompt itself might seem like a string on nonsensical words and symbols, but it
    conveys quite a lot of useful information.


    Usually, the prompt looks like this:


    ```bash

    jmoeller@yourlinuxmachine:~$

    ```


    Let''s examine what each part of the prompt means.


    The portion of the prompt before the `@` symbol (in this case, “jmoeller”), is
    the username of the currently logged-in user. Naturally, this will change based
    upon which user is logged in to the terminal session. The portion after the `@`
    symbol but before the colon (in this case, “yourlinuxmachine”) is the name of
    the machine you are using. From this prompt, you can see that you are using the
    account “jmoeller” on the machine named “yourlinuxmachine.”


    The next part of the prompt, after the colon mark but before the dollar sign,
    shows the working directory. In the `bash` shell, the “working directory” is the
    currently selected directory. The tilde symbol (`~`) might not seem informative,
    but in the `bash` shell, it is a shorthand character for the home directory of
    the currently logged in user. In the prompt in our example, the tilde character
    would represent the home directory of jmoeller, `/home/jmoeller`. As you change
    the working directory, the prompt changes to reflect that. If you changed the
    current directory to `/etc`, the prompt would look like this:


    ```bash

    jmoeller@yourlinuxmachine:/etc$

    ```


    The dollar sign indicates the end of the prompt. Your commands will appear after
    the dollar sign character.


    ### COMMAND/FILENAME COMPLETION


    While you can perform certain tasks more efficiently and quickly from the command
    line than from the GUI, it does involve a lot of typing, which can become tedious.
    But using a feature called command/filename completion can cut down on quite a
    bit of that repetitive typing. The way command completion works, you type out
    part of the file name and then hit the `TAB` key. The `bash` shell then takes
    it best guess at filling out the rest of the filename for you. Usually, it''s
    fairly accurate.


    For example, let''s say you wanted to use the `rm` command to delete a file name
    `Caina1.doc`. Type out the command and the first part of the filename:


    ```bash

    rm Ca

    ```


    Hit the `TAB` key, and the `bash` shell will finish out the filename for you:


    ```bash

    rm Caina1.doc

    ```


    What happens if multiple files in the same directory have similar names, like
    `Caina1.doc` and `Caina2.doc`? In that case, command/filename completion will
    sort through the files in alphabetical order. Say you typed this command and then
    hit the `TAB` key:


    ```bash

    rm Caina

    ```


    The `bash` shell would first produce this:


    ```bash

    rm Caina1.doc

    ```


    But if you hit the `TAB` key for a second time, you would see this:


    ```bash

    rm Caina2.doc

    ```


    You can also use command/filename completion to fill out long directory names.
    Say you wanted to delete a file called `/var/www/storage/documents/Caina1.doc`.
    Typing that out would prove cumbersome. But if you start out by typing this:


    ```bash

    rm /var/www/s

    ```


    Then hit `TAB`, and you''ll see this:


    ```bash

    rm /var/www/storage/

    ```


    Append a “d” to the end of the command:


    ```bash

    rm /var/www/storage/d

    ```


    Hit `TAB` again, and the `bash` shell should figure out the directory:


    ```bash

    rm /var/www/storage/documents

    ```


    Finally, add the first letter of the file name:


    ```bash

    rm /var/www/storage/documents/C

    ```


    And one more hit of the `TAB` key should finish it off:


    ```bash

    rm /var/www/storage/documents/Caina1.doc

    ```


    With command/filename completion, you can type long filenames far quicker than
    you could otherwise.


    ### COMMAND HISTORY


    As you work on the Linux command line, you might find yourself reusing the same
    commands or similar commands over over again. You could of course retype them,
    but the `bash` shell has a feature called “command history” that makes the retyping
    unnecessary. Command history recalls the commands you type – usually, it can recall
    the last two thousand commands. You can recall them to the prompt by pressing
    the `UP` arrow key on your keyboard. Keep pressing `UP` to scroll through the
    list of commands until you find the one you need. If you go too far into the list,
    you can use the `DOWN` arrow key to scroll backward through the commands.


    You can also view your entire command history with the `history` command at the
    prompt:


    ```bash

    history

    ```


    The actual command history is stored in a configuration file in your home directory,
    and we will discuss those configuration files in the next section.


    ### THE BASH CONFIGURATION FILES

