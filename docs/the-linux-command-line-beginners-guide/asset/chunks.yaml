    As we mentioned in the section on the `rmdir` command, you can use the `rm` command
    to delete directories that still contain files and subdirectories. You can do
    this by modifying `rm` with the `-R` option. If you wanted to delete a directory
    called `/home/jmoeller/storage` that still held files, you would use this command:


    ```

    rm -R /home/jmoeller/storage

    ```


    The `rm` command will then delete `/home/jmoeller/storage` and any files it still
    contains. The command will also delete any subdirectories `/home/jmoeller/storage`
    contains, along with any child directories within those subdirectories. Needless
    to say, you should be careful when using `rm` with the `-R` option! You can wipe
    out entire branches of the filesystem and lose important data if you''re not careful.


    (Note that the `-R` option also works with the `cp` command, so you can likewise
    copy large chunks of the filesystem as once.)


    The `rm` command also works with wildcards, which we''ll discuss at the end of
    this chapter.


    # ARCHIVING AND COMPRESSING FILES


    Managing a large number of files and directories can prove tricky, especially
    if they''re spread across several directories. It''s much easy to take those files
    and create a single archive – a single large file created out of numerous small
    files, which you can later unpack back into the individual files. It''s also useful
    to compress files – compressed files are packaged in such a way that they take
    up less space on the hard drive. Modern hard drives are enormous, so compressing
    files may not seem as critical as it once did. However, many files you download
    over the Internet are compressed, so you''ll need to know how to uncompress them.
    And when you upload files to the Internet or attach them to an email message,
    you may need to compress them to save space.


    You can use the `tar` command to create archives from the command line. Archives
    created with the `tar` utility generally have a `.tar` extension, and are often
    nicknamed “tarballs.” To create an archive with `tar`, you''ll need to use both
    the `-c` option, to create an archive, and the `-f` option, to specify the name
    of the archive. The following command will create an archive named `storage.tar`
    of your `~/Documents` folder in the current working directory:


    ```

    tar -cf storage.tar ~/Documents

    ```


    (It''s considered good form to create tar archives using a directory that contains
    files, rather than a number of individual files. That way the archive unpacks
    into a single directory, rather than many individual files.)


    This will create the `storage.tar` file in the current directory. When working
    with `tar`, always remember to specify the `.tar` extension for the archives you
    create, since `tar` will not do so automatically. (Note that `tar` does not alter
    the original files in anyway – it merely creates an archived copy of them.)


    However, this new archive file is not compressed, and takes up the exact same
    amount of space as your `~/Documents` folder. To compress it, you need to use
    `tar` with the `-z` option, which compresses the archive with `gzip` compression.
    The following command will create a compressed archive:


    ```

    tar -czf storage.tar.gz ~/Documents

    ```


    You might also want to add the `-v` option as well, for “verbose” output, which
    means `tar` tells you exactly what it is doing and lets you know if something
    goes wrong:


    ```

    tar -czvf storage.tar.gz ~/Documents

    ```


    Now that you have files neatly packed up into an archive, you might want to unpack
    them. To unpack files from a `tar` archive, you use the `-x` option to eXtract
    them, rather than the `-c` option to compress:


    ```

    tar -xvf storage.tar

    ```


    If a `tar` archive has been compressed with `gzip` compress, make sure to add
    the `-z` option to the command when you wish to uncompress it:


    ```

    tar -xzvf storage.tar.gz

    ```


    The `tar` command is useful in a variety of situations, but it is rather complex.
    A simpler way of archiving and compressing your files is with the `zip` and `unzip`
    commands. To cite our previous examples, if you wanted to create a zip file of
    your `~/Documents` directory, you would use this command:


    ```

    zip -r backup.zip ~/Documents

    ```


    This will create the `backup.zip` file in the current working directory.


    To uncompress the zipped archive, you will use the `unzip` command:


    ```

    unzip backup.zip

    ```


    Note that the files are uncompressed in the working directory. Alternatively,
    if you use `unzip` with a absolute file path, the files are uncompressed in the
    same directory as the source zip file.


    # WILDCARDS


    We''ve discussed copying files, moving files, renaming files, and deleting files,
    but now we''ll describe a feature of the shell that allows you to make your file
    manipulation commands vastly more powerful. Usually, when you employ the `cp`
    or the `rm` commands, they only affect one file at a time. But if you use wildcards
    in conjunction with the file manipulation commands, you can affect hundreds or
    even thousands of files at the same time.


    What are wildcards? “Wildcards” are special characters that represent multiple
    other characters, or even all other possible characters. The first wild card character,
    the question mark (`?`), represents one potential character. For example, let''s
    say you had seven files in your current working directory named `Caina1.doc`,
    `Caina2.doc`, and so forth. If you wanted to delete them, you could use the `rm`
    command to remove them one at a time. Or, you could use `rm` in conjunction with
    a wildcard:


    ```

    rm Caina?.doc

    ```


    This will delete every file in the working directory that begins with “Caina”,
    has an extension of `.doc`, and has a single character after “Caina.” You can
    use this character with `cp`, `mv`, `ls`, and other commands as well – you could
    copy the `Caina?.doc` files, or move them, or use it with `ls` to only view those
    files.


    The second wild card character, the asterisk (`*`), is even more powerful. The
    question mark wildcard only represents a single character. The asterisk represents
    any number of characters. For example, if you wanted to delete every single `.doc`
    file in your current directory, you could delete them one by one. Or, you could
    use the asterisk wildcard with `rm`:


    ```

    rm *.doc

    ```


    This will delete every file with the extension of `.doc` in the working directory.
    Needless to say, you should exercise caution when using wildcards with the `rm`
    command!

