  trans: '


    在大多数类型的 Linux 系统中，你会看到两种用户：标准用户和管理员用户（admin）。


    标准用户是系统上的普通用户。他们对自己的家主目录拥有完全访问权限，并可以运行指定的普通用户程序。他们不能查看其他用户的家主目录，也不能修改或更改系统设置或已安装的程序。例如，会计部门的员工通常就是标准用户——他们可以访问工作所需的文件和程序，但不能更改系统。


    管理员用户和普通用户一样，但有一个例外。他们有权使用或借用 root 用户（超级用户）的权限（通过名为 `sudo` 的命令，我们将在第 8 章中描述）来对系统设置和程序进行更改。继续我们之前的例子，支持会计部门的
    IT 专业人员通常就是管理员用户。


    # 控制用户账户的文件


    在 Linux 中，用户账户存储在一个文件中，而密码存储在另一个文件中。


    你系统中的用户账户定义在 `/etc/passwd` 文件中。尽管名称如此，但密码实际上并没有实际存储在 `/etc/passwd` 文件中。旧版本的 Linux
    曾经将密码存储在那里，但这带来了安全风险，因此密码被加密并移动到了另一个文件中。该文件中仍然包含很多有用信息。如果你从命令行查看它（我们将在第 16 章教你如何操作），条目看起来像这样：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_45e08829.jpg)


    冒号分隔条目中的特定字段。


    第一部分信息是用户名（在这种情况下为 `jmoeller`）。第二个字段仅有一个 `x`。在旧版本的 Linux 中，密码会放在这里，但密码不再存储在 `/etc/passwd`
    中。第三字段是用户账户的数值用户 ID（通常简写为 `UID`）。在这种情况下，`UID` 是 `1000`。大多数 Linux 发行版为系统上的第一个新账户分配
    `1000` 的 `UID`，然后从那里递增。


    第四字段包含账户的组 ID 数字（通常简写为 `GID`）。通常，出于安全考虑，每个新账户都会获得自己的组（称为主组）。我们将在第 9 章和第 10 章详细讨论组。


    第五字段持有用户的全名（在这种情况下为 `Jonathan Moeller`），第六个字段持有用户家主目录的位置，第七个字段存储用户默认 shell 的位置。大多数
    Linux 发行版使用 `bash` shell 作为默认 shell，因此这个最后的条目几乎总是 `/bin/bash`。


    你可能想通过手动编辑 `/etc/passwd` 来向你的系统添加账户。千万不要这样做！错误配置 `/etc/passwd` 可能会给你的系统带来严重问题。请始终使用适当的命令行工具向系统添加用户账户，我们将在下一章讨论这些。


    如果用户账户存储在 `/etc/passwd` 中，那么用户密码实际上存储在 `/etc/shadow` 文件。你需要 root 权限才能查看 `/etc/shadow`
    文件，但如果你查看它，每个条目看起来都会像这样：


    ![](img/tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_7e2c0aad.jpg)


    与 `/etc/passwd` 文件一样，`/etc/shadow` 中的每个条目都通过冒号分成单独字段。第一个字段包含用户名（在这种情况下为 `camalas`）。


    第二个字段包含加密哈形式的密码，因此有一长串数字和字母。如果第二个字段中只有一个星号 `*`，这意味着该账户实际上不被允许登录系统。你通常会在系统用户账户（系统服务访问系统的账户）或被锁定的普通用户账户看到这种情况。


    第三字段包含自 1970 年 1 月 1 日以来上次更改密码所需的天数。在这个例子中，天数是 `15,383`，这意味着距离上次更改密码已经过了大约 42
    年。如果你算一下，这个例子中的密码最后设置在 2012 年 2 月 12 日。这种处理方式非常繁琐，但请记住 Linux 是源自 UNIX，且 Linux
    继承了 UNIX 的密码系统。


    第四字段是更改密码前的最少天数。这是为了增强密码安全策略——如果强制用户更改密码，这可以防止他们立即又改回来。如果该字段中有 `0`（如本例所示），则该功能被禁用。


    第五字段设置了密码过期必须更改的最大天数。将其设置为 `99,999`（如本例所示）会禁用此功能。（因为 99,999 天大约是 273 年，这个问题就没意义了！）因此，`camalas`
    用户账户的密码永远不会过期。


    第六个字段指定了密码过期前发出警告的天数。默认设置为七天，所以如果密码被设置为过期，用户在登录时会在七天内都会收到警告。


    第七个字段指定了自 1970 年 1 月 1 日以来等待多少天，在密码过期后锁定账户。如果该字段值为 `-1`（如本例所示），则该功能已禁用。如果该字段为空（如本例所示），意味着设置为永不锁定。


    Linux 中的 root 用户可以访问任何文件并删除任何目录。不言而喻，以 root 身份登录应该谨慎，因为你可能会损坏系统。我们将在第 7 章和第 8
    章讨论如何安全地使用 root 账户。


    ***


    ## 第 6 章 - 用户账户操作命令


    现在你理解了用户账户的原理，我们将解释如何使用命令行工具来管理它们。在本章中，你将学习如何创建、修改和删除用户账户。你还将学习如何重置密码和锁定账户。


    ### 创建用户账户


    正如我们在上一章提到的，通过手动编辑 `/etc/passwd` 和 `/etc/shadow` 文件来添加用户账户是一个坏主意。幸运的是，你可以使用 `useradd`
    命令从命令行向系统添加账户。假设你想为系统一个名为 Caina Amalas 的女性添加一个账户，并决定为她分配用户名 `camalas`。


    （毫无羞耻的作者推销：Caina Amalas 是我的 GHOSTS 系列幻想小说和短故事中主角的名字。）


    要向你的系统添加 `camalas` 账户，你可以使用以下命令：


    ```

    useradd camalas

    ```


    '
- fmt: '

    (Note that you need to root-level permissions to add user accounts to your system,
    and we will discuss using root powers more in Chapters 6 and 7.)


    This command will add the `camalas` user account. However, `useradd` without any
    options is not terribly useful. The command creates the `camalas` user account,
    but it doesn''t assign a display name for it, it doesn''t create a home directory
    for `camalas`, and it doesn''t set other important options – it neglects to assign
    a default shell for the account, for instance.


    We''ll have to add some options to make `useradd` more effective. First, use the
    `-m` option create a home directory for the `camalas` account:


    ```

    useradd -m camalas

    ```


    The `-m` option will add a home directory for `camalas` in the `/home` directory.
    Next, you''ll want to use the `-s` option to set a default shell from the account:


    ```bashuseradd -m -s “/bin/bash” camalas

    ```


    This sets the `bash` shell as the default shell for the `camalas` account. There''s
    one final switch to add to the `useradd` account – the `-c` option to set the
    account''s display name as “Caina Amalas.”


    ```bashuseradd -c “Caina Amalas” -m -s “/bin/bash” camalas

    ```


    With these three options, the `useradd` command creates a new account called `camalas`,
    sets the account''s display name as Caina Amalas, creates a home directory for
    the account in `/home`, and sets `bash` as the account''s default shell. Finally,
    you need only set the password for the account with the `passwd` command:


    ```bash

    passwd camalas

    ```


    (That isn''t a typo – the proper command is in fact `passwd`, not `password.`)


    The `camalas` account is now ready for use. Note that to change another user''s
    password, you need to run `passwd` as root or with root-level permissions.


    # MODIFYING USER ACCOUNTS


    Once you''ve created a user account, you may need to modify it. In this section
    we''ll first describe how to change user account passwords, and how to modify,
    lock, and otherwise alter existing user accounts.


    ## Changing the password


    Changing the password for your own user account is simple enough. Simply type
    the `passwd` command:


    ```bash

    passwd

    ```


    You''ll receive a prompt asking for your current password. After you enter it,
    the command will then prompt you for your new password, and then prompt you again
    for confirmation. Your new password will be set.


    To reset the password of a different user, you still use the `passwd` command.
    Note that in order to change another user''s password, you need to either be root
    or running with root-level permissions. As we mentioned in the previous section,
    to change the password for the `camalas` account, you would use this command:


    ```bash

    passwd camalas

    ```


    You will not need to know `camalas`''s current password. Simply enter the new
    password twice when prompted, and the command will change the password for the
    `camalas` account.


    ## Locking and unlocking accounts


    From time to time you may find it necessary to lock out an account, preventing
    the user from logging in. This very often happens is a user is misbehaving or
    abusing his or her computer privileges. On a less negative note, this can happen
    if you have a contract employee whose contract expires, but the company plans
    to rehire in a few months. To do so, you will use the `usermod` command, which
    is like the Swiss Army knife of user account management. To lock out the `camalas`
    user account, use `usermod` with the `-L` switch.


    ```bash

    usermod -L camalas

    ```


    (Once again, to use any of the `usermod` command''s functions, you''ll need root-permissions.
    Note also that the `-L` switch must be uppercase – remember that the Linux command
    line is case sensitive.)


    This will lock the account, leaving `camalas` unable to log in. To unlock the
    account, use `usermod` with the `-U` switch. (Note that the `-U` must be capitalized.)


    ```bash

    usermod -U camalas

    ```


    The `camalas` account will be unlocked.


    ## Changing user names


    The most common other change you''ll need to make to individual user accounts
    (other than changing their group membership, which we will discuss in Chapters
    9 and 10) is to change the name of a user account. The most common reason for
    this is when a woman gets married and changes her name. To continue our previous
    example, let''s say Caina Amalas marries a man with the last name of Maraeus and
    changes her name to Caina Maraeus. She then wants to change her username to `cmaraeus`
    and her display name to Caina Maraeus.


    You can accomplish both these tasks with the `usermod` command.


    To change the username of the account from `camalas` to `cmaraeus`, use `usermod`
    with the following options:


    ```bash

    usermod -l cmaraeus camalas

    ```


    This will change the account''s username from `camalas` to `cmaraeus`. It might
    seem strange to have `cmaraeus` before `camalas`, but the command will not work
    otherwise.


    To change the display name of the `camalas` account, use the `usermod` command
    with the `-c` switch:


    ```bash

    usermod -c “Caina Maraeus” camalas

    ```


    (Note that if you''ve already changed the account name to `cmaraeus`, make sure
    to use that instead.)


    The account''s display name will change to Caina Maraeus instead of Caina Amalas.


    # DELETING USER ACCOUNTS


    Finally, from time to time you might find it necessary to delete user accounts.
    Perhaps an employee leaves your organization permanently, or perhaps an employee
    no longer needs access to a particular system. Most of the time, it''s a better
    idea to simply lock a user account than to delete it entirely. Just because an
    employee leaves an organization doesn''t meant that he or she will not return
    in the future, after all. And if the employee does return, it''s a lot easier
    to unlock a locked account than to recreate it from scratch.


    But if you must delete a user account, you can do so with the `userdel` command.
    If you wanted to delete the `camalas` account, the command would look like this:


    ```bash

    userdel camalas

    ```


    (Note that you must be logged in as root to delete accounts.)


    This will delete the `camalas` account, but it will not delete the `/home` directory.
    If you''re absolutely sure that you need neither the account nor the user''s files
    again, you can delete both the account and the home folder with this command:


    ```bash

    userdel -r camalas

    ```


    ***


    ## Chapter 7 - Concept: The Root User


    We''ve already mentioned the root user several times. In this chapter, we''ll
    take a closer look at the root user and its capabilities. In the following chapter
    we''ll show you how to use root safely, without damaging your system.


    ### WHAT IS THE ROOT ACCOUNT?


    The root account, also known as the superuser account, is the most powerful account
    in a Linux system. The root account has permission to access, modify, and delete
    any file. The root user can also install and uninstall programs, modify system-wide
    settings, and change the ownership of files (we''ll discuss ownership more in
    Chapters 11 and 12).


    The name comes from the early days of UNIX – the root user was the only user with
    the ability to change the root directory, and so the term carried over to the
    superuser account.


    The root user''s entry in `/etc/passwd` will usually look something like this:


    ![](tmp_eb0fc19740aa2cab292c210f5d425738_v6dDmx_html_m780819d.jpg)


    The root account will always have a `UID` of 0, and a group ID of 0. The home
    directly for root is usually `/root`.


    ### USING THE ROOT ACCOUNT SAFELY


    If you are the administrator of a Linux system, it might be temping to use the
    root account as your day-to-day account. After all, if you are performing system
    tasks, sooner or later you will need to use root, so why not use it as your main
    account? Do not give in to this temptation. The superuser account has control
    over every aspect of the system, and even a simple typographical error in a command
    issued by root can be devastating. It is a good idea to make yourself a standard
    user account, and use root only when necessary.

