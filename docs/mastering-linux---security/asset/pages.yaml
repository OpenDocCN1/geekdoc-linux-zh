    [root@RHEL5 ~] ls -1 /selinux/enforce

    -rw-r--r. 1 root root 0 Apr 29 08:21 /selinux/enforce

    [root@RHEL5 ~] echo cat /selinux/enforce

    1

    ```


    # 12.13. identity


    The SELinux identity of a user is distinct from the user ID. Identity is a part
    of security context, and via domains determines what you can do. The screenshot
    shows **root having identity user_u**.


    ```

    [root@rhel5 ~] id -z

    user_u:system_r:unconfined_t

    ```


    # 12.14. role


    The selinux role defines the domains that can be used. A **role** is denied to
    a domain, unless the role is explicitly authorized to do so.'
