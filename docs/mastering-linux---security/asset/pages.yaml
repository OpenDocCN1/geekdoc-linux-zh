- img_proc: true
  md: "# 11.1. iptables tables\n\nBy default there are three tables in the kernel\
    \ that contain sets of rules.\n\nThe filter table is used for packet filtering.\n\
    \n```\nroot@debian6~# iptables -t filter -L\nChain INPUT (policy ACCEPT)\n  target\
    \               prot opt source       destination\nChain FORWARD (policy ACCEPT)\n\
    \  target               prot opt source       destination\nChain OUTPUT (policy\
    \ ACCEPT)\n  target               prot opt source       destination\n```\n\nThe\
    \ nat table is used for address translation.\n\n```\nroot@debian6~# iptables -t\
    \ nat -L\nChain PREROUTING (policy ACCEPT)\n  target               prot opt source\
    \       destination\nChain POSTROUTING (policy ACCEPT)\n  target             \
    \  prot opt source       destination\nChain OUTPUT (policy ACCEPT)\n  target \
    \              prot opt source       destination\n```\n\nThe mangle table is used\
    \ for special-purpose processing of packets.\n\nSeries of rules in each table\
    \ are called a chain. We will discuss chains and the nat table later in this chapter.\n\
    \n# 11.2. starting and stopping iptables\n\nThe following screenshot shows how\
    \ to stop and start iptables on Red Hat/Fedora/CentOS and compatible distributions.\n\
    \n```\nroot@centos6 ~# service iptables stop\nroot@centos6 ~# service iptables\
    \ start\niptables: Applying firewall rules      [ ok ]\nroot@centos6 ~#\n```\n\
    \nDebian and *ubuntu distributions do not have this script, but allow for an uninstall.\n\
    \n```\nroot@debian6~# aptitude purge iptables\n```"
  merge: -1
  pgno: 91
- img_proc: true
  md: "# 11.3. the filter table\n\n# 11.3.1. about packet filtering\n\nPacket filtering\
    \ is a bit more than packet forwarding. While packet forwarding uses only a routing\
    \ table to make decisions, packet filtering also uses a list of rules. The kernel\
    \ will inspect packets and decide based on these rules what to do with each packet.\n\
    \n# 11.3.2. filter table\n\nThe filter table in iptables has three chains (sets\
    \ of rules). The INPUT chain is used for any packet coming into the system. The\
    \ OUTPUT chain is for any packet leaving the system. And the FORWARD chain is\
    \ for packets that are forwarded (routed) through the system.\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_92_0.png)\n\
    \nThe screenshot below shows how to list the filter table and all its rules.\n\
    \n```\n[root@RHEL5 ~]# iptables -t filter -nL\nChain INPUT (policy ACCEPT)\n \
    \ target      prot opt source      destination\nChain FORWARD (policy ACCEPT)\n\
    \  target      prot opt source      destination\nChain OUTPUT (policy ACCEPT)\n\
    \  target      prot opt source      destination\n[root@RHEL5 ~]#\n```\n\nAs you\
    \ can see, all three chains in the filter table are set to ACCEPT everything.\
    \ ACCEPT is the default behaviour."
  merge: -1
  pgno: 92
- img_proc: true
  md: "# 11.3.3. setting default rules\n\nThe default for rule default is indeed to\
    \ ACCEPT everything. This is not the most secure firewall.\n\nA more secure setup\
    \ is to DROP everything. A package that is **dropped will not continue in any\
    \ chain, and no warning or error will be sent anywhere.\n\nThe below commands\
    \ lock down a computer. Do not execute these commands inside a remote ssh shell.\n\
    \n```\nroot@debianpaul:~# iptables -P INPUT DROP\nroot@debianpaul:~# iptables\
    \ -P OUTPUT DROP\nroot@debianpaul:~# iptables -P FORWARD DROP\nroot@debianpaul:~#\
    \ iptables -L\nChain INPUT (policy DROP)\n  target      prot opt source      \
    \         destination\nChain FORWARD (policy DROP)\n  target      prot opt source\
    \               destination\nChain OUTPUT (policy DROP)\n  target      prot opt\
    \ source               destination\n```\n\n# 11.3.4. changing policy rules\n\n\
    To start, let's set the default policy for all three chains to drop everything.\
    \ Note that you might lose your connection when typing over ssh -).\n\n```\n[root@RHEL5\
    \ ~] iptables -P INPUT DROP\n[root@RHEL5 ~] iptables -P FORWARD DROP\n[root@RHEL5\
    \ ~] iptables -P OUTPUT DROP\n```\n\nNext, we allow the server to use its own\
    \ loopback device (this allows the chain to access to its services running on\
    \ localhost). (ACCEPT) traffic from the lo (loopback) interface, then we do the\
    \ same to allow packets to leave the system through the loopback interface.\n\n\
    ```\n[root@RHEL5 ~] iptables -A INPUT -i lo -j ACCEPT\n[root@RHEL5 ~] iptables\
    \ -A OUTPUT -o lo -j ACCEPT\n```\n\nLooking at the filter table (omitting -f filter\
    \ it is the default table):\n\n```\n[root@RHEL5 ~] iptables -nL\nChain INPUT (policy\
    \ DROP)\n  target      prot opt source               destination\n  ACCEPT   \
    \   all             0.0.0.0/0.0.0.0/\nChain FORWARD (policy DROP)\n  target  \
    \    prot opt source               destination\nChain OUTPUT (policy DROP)\n \
    \ target      prot opt source               destination\n  ACCEPT      all   \
    \          0.0.0.0/0.0.0.0/\n```"
