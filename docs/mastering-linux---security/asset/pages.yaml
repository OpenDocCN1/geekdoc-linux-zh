- img_proc: true
  md: '# # user management


    User management on Linux is done in three complementary ways. You can use the
    graphical tools provided by your distribution. These tools have a look and feel
    that depends on the distribution. If you are a novice Linux user on your home
    system, then use the graphical tool that provided by your distribution. This will
    make sure that you do not run into problems.


    Another option is to use command line tools like useradd, usermod, gpasswd, passwd
    and others. Server administrators are likely to use these tools, since they are
    familiar and similar across many different distributions. This chapter will focus
    on these command line tools.


    A third rather extremist way is to edit the local configuration files directly
    using vi (or vipw/vim). Do not attempt this as a novice on production systems!


    # # 2. /etc/passwd


    The local database (Linux and on Unix systems) is /etc/passwd.


    ```

    [root@RHEL5 ~]$# tail /etc/passwd

    ing:518:524:art dealer:/home/inge:/bin/bash

    ann:519:525:flux player:/home/ann:/bin/bash

    derick:520:526:rubius:/home/frederik:/bin/bash

    steven:521:527:roman peter:/home/steven:/bin/bash

    pascale:522:528:artist:/home/pascale:/bin/bash

    geert:524:530:kernel developer:/home/geert:/bin/bash

    win:525:531:master daemon:/home/win:/bin/bash

    sandra:526:532:radish stresser:/home/sandra:/bin/bash

    annelies:527:533:sword fighter:/home/annelies:/bin/bash

    laura:528:534:art dealer:/home/laura:/bin/bash

    ```


    As you can see, this file contains columns separated by a colon. The columns contain
    the username, an x, the user id, the primary group id, a description, the name
    of the home directory, and the login.


    More information can be found by typing man 5 passwd.


    ```

    [root@RHEL5 ~]$# man 5 passwd

    ```


    # # 2.3. root


    The root user is also the superuser is the most powerful account on your Linux
    system. This user can do almost anything, including the creation of other users.
    The root user always has userid 0 (regardless of the name of the account).


    ```

    [root@RHEL5 ~]$# head -1 /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    ```'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 2.4. useradd


    You can add users with the useradd command. The example below shows how to add
    a user named yanina (last parameter) and at the same time forcing the creation
    of the home directory (-m), setting the name of the home directory (-d), and setting
    a description (-c).


    ```

    [root@RHEL5 ~]# useradd -m /home/yanina -c yanina wickmayer yanina

    [root@RHEL5 ~]# tail -1 /etc/passwd

    yina:x:529:529:yanina:wickmayer:/home/yanina:/bin/bash

    ```


    The user named yanina received 529 and primary group id 529.


    # 2.5. /etc/default/useradd


    Red Hat Enterprise Linux and Debian/Ubuntu have a file called /etc/default/useradd
    that contains default user options. Besides using cat to display this file, you
    can also use useradd -D.


    ```

    [root@RHEL4 ~]# useradd -D

    GROUP=100

    HOME=/home

    ACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    ```


    # 2.6. userdel


    You can delete the user yanina with userdel. The -r option of userdel will also
    remove the home directory.


    ```

    [root@RHEL5 ~]# userdel -r yanina

    ```


    # 2.7. usermod


    You can modify the properties of a user with the usermod command. This example
    uses usermod to change the description of the user harry.


    ```

    [root@RHEL4 ~]# tail -1 /etc/passwd

    harry:x:516:520:harry potter:/home/harry:/bin/bash

    [root@RHEL4 ~]# usermod -c ''wizard'' harry

    [root@RHEL4 ~]# tail -1 /etc/passwd

    harry:x:516:520:wizard:/home/harry:/bin/bash

    ```'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 2.8. creating home directories


    The easiest way to create a home directory is to supply the **-m** option with
    `useradd` (it is likely as easy as a default option on Linux).


    A less easy is to create a home directory manually with `mkdir` which also requires
    setting the owner and the permissions on the directory with `chmod` and `chown`
    (both commands are discussed in detail in another chapter).


    ```

    [root@RHEL5 ~]# # mkdir /home/laura

    [root@RHEL5 ~]# # chown laura:home/laura

    [root@RHEL5 ~]# # chmod 700 /home/laura

    [root@RHEL5 ~]# # ls -ld /home/laura/

    drwx------ 2 laura 4096 Jun 24 15:17 /home/laura/

    ```


    # 2.9. /etc/skel/


    When using the **-m** option, the `/etc/skel/` directory is copied to the newly
    created home directory. The `/etc/skel/` directory contains some (usually hidden)
    files that contain profile settings and default values for applications. In this
    way /etc/skel/ serves as a default home directory and as a default user profile.


    ```

    [root@RHEL5 ~]# ls -la /etc/skel/

    total 48

    drwxr-xr-x 2 root 4096 Apr 1 00:11 .

    drwxr-xr-x 9 root 12288 Jun 24 15:36 .

    -rw-r--r-- 1 root 24 Jul 12 2006 .bash_logout

    -rw-r--r-- 1 root 176 Jul 12 2006 .bash_profile

    -rw-r--r-- 1 root 124 Jul 12 2006 .bashrc

    ```


    # 2.10. deleting home directories


    The **-r** option of `userdel` will make that the home directory is deleted together
    with the user account.


    ```

    [root@RHEL5 ~]# ls -ld /home/wim/

    drwx------ 2 wim 4096 Jun 24 15:19 /home/wim/

    [root@RHEL5 ~]# # userdel -r wim

    [root@RHEL5 ~]# ls -ld /home/wim/

    ls: /home/wim/: No such file or directory

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 2.11. login shell


    The /etc/passwd file specifies the login shell for the user. In the screenshot
    below you can see user annelie will log in with the /bin/bash shell, and user
    laura with the /bin/ksh shell.


    ```

    [root@RHEL5 ~]# tail -2 /etc/passwd

    annelies:x:527:533:word fighter:/home/annelies:/bin/bash

    laura:x:528:534:art dealer:/home/laura:/bin/ksh

    ```


    You can use the usermod command to change the shell for a user.


    ```

    [root@RHEL5 ~]# usermod -s /bin/bash laura

    [root@RHEL5 ~]# tail -1 /etc/passwd

    laura:x:528:534:art dealer:/home/laura:/bin/bash

    ```


    # 2.12. chsh


    Users can change their login shell with the chsh command. First, user harry obtains
    a list of available shells (he could also have done a cat /etc/shells) and then
    changes his login shell to the Korn shell (/bin/ksh). At the next login, harry
    will default to ksh instead of bash.


    ```

    [laura@centos7 ~]$ chsh -l

    /bin/sh

    /bin/bash

    /bin/nologin

    /usr/bin/sh

    /usr/bin/bash

    /usr/sbin/nologin

    /bin/ksh

    /bin/tcsh

    /bin/csh

    [laura@centos7 ~]$

    ```


    Note that the -l option does not exist on Debian and that the above screenshot
    assumes that ksh and csh shells are installed.


    The screenshot below shows how laura can change her default shell (active on next
    login).


    ```

    [laura@centos7 ~]$ chsh -s /bin/ksh

    Changing shell for laura.

    Password:

    Shell changed.

    ```'
  merge: -1
