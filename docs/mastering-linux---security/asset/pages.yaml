  md: '# # Chapter 3. user passwords


    This will tell you more about passwords for local users.


    Three methods for setting passwords are explained; using the **passwd** command,
    using **openssl passwd**, and using the **crypt** function in a C program.


    The chapter will also discuss password settings and disabling, suspending or locking
    accounts.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 3.1. passwd


    Passwords of users can be set with the passwd command. Users will have to provide
    the old password before twice entering the new one.


    ```

    [tania@centos ~]$ password

    Changing password for user tania.

    Changing password for tania.

    (current) UNIX password:

    New password:

    BAD PASSWORD: The password is shorter than 8 characters

    New password:

    BAD PASSWORD: The password is a palindrome

    New password:

    BAD PASSWORD: The password is too similar to the old one

    passwd: Have exhausted maximum number of retries for service

    ```


    As you can see, the passwd tool will use some basic verification to prevent users
    from using too simple passwords. The root user does not have to follow these rules
    (there will be a warning though). The root user also does not have to provide
    the old password before entering the new password.


    ```

    root@debian:-# passwd tania

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: updated successfully

    ```


    # 3.2. shadow file


    User passwords are encrypted in /etc/shadow. The /etc/shadow file is read only
    and can only be read by root. We will see in the file permissions section how
    it is possible for users to change their password. For now, you will have to know
    that users can change their password with the /usr/bin/passwd command.


    ```

    [root@centos ~]# tail -4 /etc/shadow

    laura:$61k2XptaS5.Tml._p2S3J7Y/NOYqGMKwLJqoGJbVsZsG5/Pti8ovBRD.VbRbiDS17TEQ/

    IASMH.TEKBnt/S31ruw89fgfCOJ98.BNWqMKJKJ3F8S9:99999:7:

    sasha:$6B8Z2YqJ1v9q0789g8IK8ml.K2EAWAY5z5ZynN5vyYJaa9L5XqVu.Z4d1pMREH/

    eQqZ5VqFnRKMKJ1Y7H77S.c790ZD6:15630:99999:7:

    aura:$6a4qG5fR699X673695HA64XXocCFVJKJnb98bThPfwXQGk

    Syh1Wc676395H6.w24rY3A0BZM:15630:99999:7:

    valina:$6Y3zRA6GP51Vq689m66BKJFR58R4c6F6Lrhhh.vi4qUvRevuill71

    6XROUDAK552NHbaE2Outnv:15630:99999:7:

    [root@centos ~]#

    ```


    The /etc/shadow file contains colon separated columns. The fields from left to
    right are: username (note that only ia and Laura have an encrypted password),
    the day password was last changed (day is January 1, 1970), number of days the
    password must be left unchanged, password expiry date, warning number of days
    before password expiry, number of days after expiry disabling the account, and
    the day the account was disabled (again, since 1970). The last field has no meaning
    yet.


    All the passwords in the screenshot are hashes of hunter2.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 3.3. encryption with passwd


    Passwords are stored in an encrypted format. This encryption is done by the crypt
    function. The easiest (and recommended) way to add a user with a password to the
    system is to add the user with the -add user command, and then set the user''s
    password with passwd.


    ```

    [root@RHEL4 ~]# usadd -m xavier

    [root@RHEL4 ~]# passwd xavier

    Changing password for user xavier.

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully.

    [root@RHEL4 ~]#

    ```


    # 3.4. encryption with openssl


    Another way to create users with a password is to use the -p option of usadd,
    but that option requires an encrypted password. You can generate this encrypted
    password with the openssl password


    The openssl passwd command will generate several distinct hashes for the same
    password, for this it uses a salt.


    ```

    paul@rhel65:-$ openssl passwd hunter 2

    86cjUN1GDfPY

    paul@rhel65:-$ openssl passwd hunter 2

    YjF3mGoDbvG

    paul@rhel65:-$ openssl passwd hunter 2

    YqDcJceGoDbzKA

    paul@rhel65:-$

    ```


    This salt can be chosen and is visible as the first two characters of the hash.


    This example shows how to create a user with password.


    ```

    root@rhel65:-# usadd -m -p $(openssl passwd hunter 2) mohamed

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: "# 3.5. encryption with crypt\n\nA third option is to create your own C program\
    \ using the crypt function, and compile this into a command.\n\n```\npaul@rhel65:$\
    \ cat MyCrypt.c\n#include <stdio.h>\n#define USE_KOPEN\n#include <unistd.h>\n\n\
    int main(int argc, char **argv) {\n    if(argc==3) {\n        printf(\"%s\\n\"\
    , crypt(argv[1],argv[2]));\n    } else {\n        printf(\"Usage: MyCrypt $password\
    \ $salt\\n\");\n    }\n    return 0;\n}\n```\n\nThis little program can be compiled\
    \ with gcc -o MyCrypt like this.\n\n```\npaul@rhel65:$ gcc MyCrypt.c -o MyCrypt\
    \ -lcrypt\n```\n\nTo use it, we provide two parameters to MyCrypt. The first is\
    \ the unencrypted password, the second is the salt. The salt is used to perturb\
    \ the encryption algorithm in one of 4096 different ways. This variation prevents\
    \ two users with the same password from having the same entry in /etc/shadow.\n\
    \n```\npaul@rhel65:$ ./MyCrypt hunter2 42\n42zrtPIze8g.\npaul@rhel65:$ ./MyCrypt\
    \ hunter2 33\n33dctaYSIEUXI\n```\n\nDid you notice the first two characters of\
    \ the password are the salt?\n\nThe standard output of the crypt function is the\
    \ DES algorithm which is old and can be created in minutes. A better method is\
    \ to use md5 passwords which can be recognized by a salt starting with $15.\n\n\
    ```\npaul@rhel65:$ ./MyCrypt hunter2 '$14'\n$14S2716Y3TS528XmrtDof9f0\npaul@rhel65:$\
    \ ./MyCrypt hunter2 '$62'\n$62S40qGFFAn13TSGOY1WTX9qcZwop78hwGILLLESNBMi4r60vLX1Kda./UpwXfrFKli...\n\
    ```\n\nThe md5 salt can be up to eight characters. The salt is displayed in /etc/shadow\
    \ between the second and third $, so never use the password as the salt!\n\n```\n\
    paul@rhel65:$ ./MyCrypt hunter2 '$1hunter2'\n$1hunter2$YVXxrDmidqXf8Gdt6M2.\n\
    ```"
  merge: -1
