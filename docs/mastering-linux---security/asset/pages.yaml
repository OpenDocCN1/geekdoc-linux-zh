  md: '# Chapter 1. introduction to users


    This little chapter will teach you how to identify your user account on a Unix
    computer using commands like **who am i, id**, and more.


    In a second part you will learn how to become another user with the **su** command.


    And you will learn how to run a program as another user with **sudo**.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# 1.1. whoami


    The whoami command tells you your username.


    ```

    $ paul@centos7 ~ whoami

    paul

    $ paul@centos7 ~$

    ```


    # 1.2. who


    The who command will give you information about who is logged on the system.


    ```

    $ paul@centos7 ~ who

    root pts/0 2014-10-10 23:07 (10.104.33.101)

    paul pts/1 2014-10-10 23:30 (10.104.33.101)

    lura pts/2 2014-10-10 23:34 (10.104.33.996)

    tania pts/3 2014-10-10 23:39 (10.104.33.991)

    $ paul@centos7 ~$

    ```


    # 1.3. who am i


    With who am i the command will display only the line pointing to your current
    session.


    ```

    $ paul@centos7 ~ who am i

    paul pts/1 2014-10-10 23:30 (10.104.33.101)

    $ paul@centos7 ~$

    ```


    # 1.4. w


    The w command shows who is logged on and what they are doing.


    ```

    $ paul@centos7 ~ w

    23:44:07 up 31 min, 2 users, load average: 0.00, 0.01, 0.02

    USER TTY LOGIN IDLE JCPU PCPU WHAT

    root pts/0 23:07 15.00s 0.01s top

    paul pts/1 23:30 7.00s 0.00s w

    $ paul@centos7 ~$

    ```


    # 1.5. id


    The id command will give you user id, primary group id, and a list of the groups
    that you belong to.


    ```

    $ paul@debian7:-$ id

    uid=1000(paul) gid=1000(paul) groups=1000(paul)

    ```


    On RHEL/CentOS you will also get SELinux context information with this command.


    ```

    $ root@centos7 ~$ id

    uid=0(root) gid=0(root) groups=0(root) context=unconfined_u:unconfined_r\nunconfined_t:s0-s0:c0.c1023

    ```'
  merge: -1
  pgno: 10
- img_proc: true
  md: "# 1.6. su to another user\n\nThe su command allows a user to run a shell as\
    \ another user.\n\n```\nlaura@debian7:~~$ su tania\nPassword:\ntania@debian7:/home/laura$\n\
    ```\n\n# 1.7. su to root\n\nYou can idea also su to become root, when you know\
    \ the root password.\n\n```\nlaura@debian7:~~$ su root\nPassword:\nroot@debian7:/home/laura$\n\
    ```\n\n# 1.8. su as root\n\nYou need to know the password of the user you want\
    \ to substitute, unless you are logged as root. The root user can become any existing\
    \ user without knowing that user's password.\n\n```\nroot@debian7:~~$ id\nuid=0(root)\
    \ gid=0(root) groups=0(root)\nroot@debian7:~# su - valentina\nvalentina@debian7:~-$\n\
    ```\n\n# 1.9. su - $username\n\nBy default, the su command maintains the same\
    \ shell environment. To become another user and also get the target user's environment,\
    \ issue the su - command followed by the target username.\n\n```\nroot@debian7:~#\
    \ su laura\nlaura@debian7:/root$ exit\nexit\nroot@debian7:~# su - laura\nlaura@debian7:~$\
    \ pwd\n/home/laura\n```\n\n# 1.10. su -\n\nWhen username is provided to su or\
    \ su - , the command will assume root is the target.\n\n```\ntania@debian7:~~$\
    \ su - \nPassword:\nroot@debian7:~#\n```"
  merge: -1
  pgno: 11
- img_proc: true
  md: "# 1.11. run a program as another user\n\nThe sudo program allows a user to\
    \ start a program with the credentials of another user. Before this works, the\
    \ system administrator has to set up the /etc/sudoers file. This can be useful\
    \ to delegate administrative tasks to another user (without giving the root password).\n\
    \nThe screenshot below shows the usage of sudo. User paul received the right to\
    \ run useradd with the credentials of root. This allows paul to create new users\
    \ on the system without becoming root and without knowing the root password.\n\
    \nThe first command fails for paul.\n\n```\npaul@debian:~-$ /usr/sbin/useradd\
    \ -m valentina\nuseradd: Permission denied.\nuseradd: cannot lock /etc/passwd;\
    \ try again later.\n```\n\nBut with sudo it works.\n\n```\npaul@debian?:-$ sudo\
    \ /usr/sbin/useradd -m valentina\n[sudo] password for paul:\npaul@debian?:-$\n\
    ```\n\n# 1.12. visudo\n\nCheck the man page of visudo before playing with the\
    \ /etc/sudoers file. Editing the sudoers out of scope for this fundamentals book.\n\
    \n```\npaul@rhel65:-$ apropos visudo\nvisudo\n\t(8) \t- edit the sudoers file\n\
    paul@rhel65:-$\n```"
  merge: -1
  pgno: 12
- img_proc: true
  md: "# 1.13. sudo su -\n\nOn some Linux systems like Ubuntu and Xubuntu, the root\
    \ user does not have a password set. This means that it is not possible to log\
    \ in as root (extra security). To perform tasks as root, the user is given all\
    \ sudo rights via the /etc/sudoers. In fact all users that are members of the\
    \ admin group use sudo to run all commands as root.\n\n```\nroot@lika:-# grep\
    \ admin /etc/sudoers\n# Members of the admin group may gain root privileges\n\
    %admin ALL=(ALL) ALL\n```\n\nThe result of this is that the user can type sudo\
    \ su - and become root without having to enter the root password. The sudo command\
    \ requires you to enter your own password. Thus the password prompt in the screenshot\
    \ is for sudo, not for su.\n\n```\npaullika:-$ sudo su -\nPassword:\nroot@lika:-#\n\
    ```\n\n# 1.14. sudo logging\n\nUsing sudo without authorization will result in\
    \ a severe warning:\n\n```\npaul@rhel65:-$ sudo su -\n```\n\nWe trust you have\
    \ received the usual lecture from the local System Administrator. It usually boils\
    \ down to these three things:\n\n+   # #1) Respect the privacy of others.\n# #2)\
    \ Think before you type.\n# #3) With great power comes great responsibility.\n\
    \n```\n[sudo] password for paul:\npaul is not in the sudoers file. This incident\
    \ will be reported.\npaul@rhel65:-$\n```\n\nThe root user can see this in the\
    \ /var/log/secure on Red Hat and in /var/log/auth.log on Debian.\n\n```\nroot@rhel65:-#\
    \ tail /var/log/secure | grep sudo | tr -s ' ' \nApr 16:03:42 rhel65 sudo: paul\
    \ USER NOT in sudoers ; TTY=pts/0 ; PWD=\n/home/paul ; USER=root ; COMMAND=/bin/su\
    \ - \nroot@rhel65:-#\n```"
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 1.15. practice: introduction to users


    +   1. Run a command that displays only your currently logged on user name.


    +   2. Display a list of all logged on users.


    +   3. Display a list of all logged on users including the command they are running
    at this very moment.


    +   4. Display your user name and your unique user identification (userid).


    +   5. Use su to switch to another user account (unless you are root, you will
    need the password of the other account). And get back to the previous account.


    +   6. Now use su - switch to another user and notice the difference.


    Note that su - gets you into the home directory of Tania.


    +   7. Try to create a new user account (when using your normal user account).
    this should fail. (Details on adding user accounts are explained in the next chapter.)


    +   8. Now try the same, but with sudo before your command.'
  merge: -1
  pgno: 14
