  md: '# 11.5. solution: packet filtering


    A possible solution, where leftnet is the internal and rightnet is the external
    network.


    ```

    #!/bin/bash


    # first cleanup everything

    iables -t filter -F

    iables -t filter -X

    iables -t nat -F

    iables -t nat -X


    # default drop

    iables -P INPUT DROP

    iables -P FORWARD DROP

    iables -P OUTPUT DROP


    # allow loopback device

    iables -A INPUT -i lo -j ACCEPT

    iables -A OUTPUT -o lo -j ACCEPT


    # question 1: allow ssh from eth0

    iables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT

    iables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT


    # question 2: allow icmp(ping) anywhere

    iables -A INPUT -p icmp --icmp-type any -j ACCEPT

    iables -A FORWARD -p icmp --icmp-type any -j ACCEPT

    iables -A OUTPUT -p icmp --icmp-type any -j ACCEPT


    # question 3: allow http from internal(leftnet) to external(rightnet)

    iables -A FORWARD -i eth1 -o eth2 -p tcp --dport 80 -j ACCEPT

    iables -A FORWARD -i eth2 -o eth1 -p tcp --sport 80 -j ACCEPT


    # question 4: allow ssh from internal(leftnet) to external(rightnet)

    iables -A FORWARD -i eth1 -o eth2 -p tcp --dport 22 -j ACCEPT

    iables -A FORWARD -i eth2 -o eth1 -p tcp --sport 22 -j ACCEPT


    # allow http from external(rightnet) to internal(leftnet)

    iables -A FORWARD -i eth2 -o eth1 -p tcp --dport 80 -j ACCEPT

    iables -A FORWARD -i eth1 -o eth2 -p tcp --sport 80 -j ACCEPT


    # allow rpcinfo over eth0 from outside to system

    iables -A INPUT -i eth2 -p tcp --dport 111 -j ACCEPT

    iables -A OUTPUT -o eth2 -p tcp --sport 111 -j ACCEPT

    ```'
