- img_proc: true
  md: '# # 9.1. inodes


    # ## 9.1.1. inode contents


    **inode** is a data structure that contains metadata about a file. When the file
    system stores a new file on the hard disk, it stores not only the contents (data)
    of the file, but also properties like the name of the file, the creation date,
    its permissions, the owner of the file, and more. All this information (except
    the name of the file and the contents of the file) is stored in the **inode**
    of the file.


    The **ls -i** command will display some of the inode contents, as seen in screenshot.


    ```

    root@hel53 $ # ls -ld /home/project42/

    ndwxr-xr-x 4 root pro42 4.0K Mar 27 14:29 /home/project42/

    ```


    # ## 9.1.2. inode table


    The **inode table** contains all of the **inodes** and is created when you create
    the file system (with **mkfs**). You can use the **df -i** command to see how
    many **inodes** are used and free on mounted file systems.


    | Filesystem | Inodes | Used | Free | Use% | Mounted on |

    | /dev/mapper/VolGroup0-lvroot100 | 4947968 | 115326 | 4832642 | 3% | / |

    | /dev/sda | 26104 | 45 | 26059 | 1% | /boot |

    | tmpfs | 64417 | 1 | 64416 | 1% | /dev/sh |

    | /dev/sda1 | 262144 | 2207 | 259937 | 1% | /home/project42 |

    | /dev/sdb1 | 74400 | 5519 | 68881 | 8% | /home/project33 |

    | /dev/sdb5 | 0 | 0 | 0 | | /home/sales |

    | /dev/sdb6 | 100744 | 11 | 100733 | 1% | /home/research |


    In the df -i screenshot above you can see the **inode** usage for several mounted
    file systems. You don''t see for /dev/sdb5 because it is a **fat** file system.


    # ## 9.1.3. inode number


    Each **inode** has a unique number (the inode number). You can use the **inode**
    numbers with the **ls -li** command.


    ```

    paul@RHEL6u4~$# touch file1

    paul@RHEL6u4~$# touch file2

    paul@RHEL6u4~$# touch file3

    paul@RHEL6u4~$# touch file5 -li

    total 12

    817266 -rw-rw-- 1 paul 0 Feb 15:18 file1

    817267 -rw-rw-- 1 paul 0 Feb 15:18 file2

    817268 -rw-rw-- 1 paul 0 Feb 15:18 file3

    paul@RHEL6u4~$# /test

    ```


    These three files were created after the other and got three different **inodes**
    (the first column). All of them are used with this to see what resides in the
    **inode**, except for the filename (which is contained in the directory).'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# 9.1.4. inode and file contents


    Let''s put some data in one of the files.


    ```

    paul@RHELv4u:~/test$ ls -li

    total 16

    817262 -drwxr-xr-x 1 paul 4096 Feb 15:38 ..

    817270 -rw-rw-r-- 1 paul 4096 Feb 15:42 file2

    817268 -rw-rw-r-- 1 paul 0 Feb 15:38 file3

    paul@RHELv4u:~/test$ cat file2

    ```


    It is winter now and it is very cold.

    We do not like the cold, we prefer hot summer nights.

    paul@RHELv4u:~/test$


    The data that is displayed by the cat command is not in the inode, but somewhere
    else on the disk. The inode contains a pointer to that data.


    # 9.2. about directories


    # 9.2.1. a directory is a table


    A directory is a special kind of file that contains a table which maps filenames
    to inodes.

    Listing our current directory with ls -ali will display the contents of the directory
    file.


    ```

    paul@RHELv4u:~/test$ ls -ali

    total 32

    817262 drwxr-xr-x 2 paul 4096 Feb 15:42 ..

    800768 -rw-rw-r-- 1 paul 4096 Feb 15:42 .

    817266 -rw-rw-r-- 1 paul 0 Feb 15:38 file1

    817270 -rw-rw-r-- 1 paul 92 Feb 15:42 file2

    817268 -rw-rw-r-- 1 paul 0 Feb 15:38 file3

    paul@RHELv4u:~/test$

    ```


    # 9.2.2. . and ..


    You can see five names, and the mapping to their five inodes. The . is a mapping
    to itself, and the dotdot .. is a mapping to the parent directory. The three other
    names are mappings to different inodes.'
