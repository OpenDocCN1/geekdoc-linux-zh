- img_proc: true
  md: '# ## 9.3. hard links


    # ### 9.3.1. creating hard links


    When we create a hard link to a file with ln, an extra entry is added in the directory.
    A new file is mapped to an existing index.


    ```

    paul@RHELv4:~/test$ ln file2 hardlink_to_file2

    p@RHELv4:~/test$ ln -li

    total 24

    817266 -rw-r-- 1 paul 0 Feb 5 15:53 file1

    817270 -rw-r-- 2 paul 92 Feb 5 15:42 file2

    817266 -rw-r-- 1 paul 0 Feb 5 15:38 file3

    817270 -rw-r-- 2 paul 92 Feb 5 15:42 hardlink_to_file2

    ```


    Both files have the same inode, so they will have the same permissions and the
    same owner. Both files will have the same content. Actually, both files are equal
    now, meaning you can safely remove the original file, the hardlinked file will
    remain. The inode contains a counter, counting the number of hard links to itself.
    When the counter drops to zero, then the inode is emptied.


    # ### 9.3.2. finding hard links


    You can use the find command to look for files with a certain inode. The screenshot
    below shows how to search for all filenames that point to inode 817270. Remember
    that an inode number is unique to its partition.


    ```

    paul@RHELv4:~/test$ find -inum 817270 2> /dev/null

    /home/paul/test/file2

    /home/paul/test/hardlink_to_file2

    ```'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# 9.4. symbolic links


    Symbolic links (sometimes called soft links) do not link to inodes, but create
    a name to name mapping. Symbolic links are created with ln -s. As you can see
    below, the symbolic link gets an inode of its own.


    ```

    paul@RHEL6u4:~/test ln -s file2 symlink_to_file2

    paul@RHEL6u4:~/test ls -li

    total 32

    817273 -rw-r-- 1 paul paul 13 Feb 17:06 file1

    817270 -rw-r-- 2 paul paul 106 Feb 5 17:04 file2

    817270 -rw-r-- 1 paul paul 0 Feb 15:38 file3

    817270 -rw-r-- 2 paul paul 106 Feb 5 17:04 hardlink_to_file2

    817267 lrwxrwxrwx 1 paul paul 5 Feb 5 16:55 symlink_to_file2 -> file2

    paul@laika:~$

    ```


    Permissions on a symbolic link have no meaning, since the permissions of the target
    apply. Hard links are limited to their partition (because they point to an inode),
    symbolic links can link anywhere (other file systems, even networked).


    # 9.5. removing links


    Links can be removed with rm.


    ```

    paul@laika:~$ touch data.txt

    paul@laika:~$ ln -s data.txt sl_data.txt

    paul@laika:~$ ln data.txt hl_data.txt

    paul@laika:~$ rm sl_data.txt

    paul@laika:~$ rm data.txt

    ```'
  merge: -1
