  md: '# 12.23. booleans


    Booleans are on/off switches


    ```

    [root@centos65 ~]# getsebool -a | head

    abrt_anon_write --> off

    abrt_handle_event --> off

    allow_console_login --> on

    allow_cvs_read_shadow --> off

    allow_daemon_dmp_core --> on

    allow_daemons_use_tcp_wrapper --> off

    allow_daemons_use_tty --> on

    allow_domain_fd_use --> on

    allow_execheap --> off

    allow_execccm --> on

    ```


    You can set and read individual booleans.


    ```

    [root@centos65 ~]# setbool httpd_read_user_content=1

    [root@centos65 ~]# getsebool httpd_read_user_content

    ttpd_read_user_content --> on

    [root@centos65 ~]# setbool httpd_enable_homedirs=1

    [root@centos65 ~]# getsebool httpd_enable_homedirs

    ttpd_enable_homedirs --> on

    ```


    You can set these booleans permanent.


    ```

    [root@centos65 ~]# setbool -P httpd_read_homedirs=1

    [root@centos65 ~]# setbool -P httpd_read_user_content=1

    ```


    The above commands regenerate the complete /etc/selinux/targeted/targeted directory!


    ```

    [root@centos65 ~]# cat /etc/selinux/targeted/modules/active/booleans.local

    # This file is auto-generated by libsemagement

    # Do not edit directly.

    ```


    httpd_enable_homedirs=1

    tttpd_read_user_content=1'
