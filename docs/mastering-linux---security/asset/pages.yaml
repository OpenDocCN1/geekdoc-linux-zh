  md: '# 12.16. security context


    The combination of identity, role and domain or type make the selinux security
    context. The **id** will show you the security context in the form identity:role:domain.


    ```

    paul@RHEL5 ~$ id | cut -d'' '' -f4

    context=user_u:system_r:unconfined_t

    ```


    The **ls -Z** command shows the security context for a file in the form identity:role:type.


    ```

    paul@RHEL5 ~$ ls -Z test

    --rw-r--r-- paul paul user_uobject_r:user_home_t test

    ```


    The init process runs in domain **init_t.**


    ```

    root@RHEL5 ~# ps -ZC init

    LABEL PID TTY TIME CMD

    sysystem_u:system_r:init_t 1 00:00:01 init

    ```


    The **/proc/1/** directory, which identifies the **init** process and has type
    **init_t.**


    ```

    root@RHEL5 ~# ls -Zd /proc/1/

    dr-xr-xr-x root root system_u:system_r:init_t /proc/1/

    ```


    It is not a coincidence that the domain of the **init** process and the type of
    **/proc/1/** are both **init_t.**


    Don''t try to use chchon on /proc/!. It will not work.


    # 12.17. transition


    An selinux transition (aka as selinux labelling) determines the security context
    that will be assigned. A transition of process domains is used when you execute
    a process. A transition of file type happens when you create a file.


    An example of file type transition.


    ```

    pol@centos65 ~$ touch /tmp/test

    pol@centos65 ~$ ls -Z test

    --rw-r--r-- pol pol unconfined_u:object_r:user_home_t:s0 test

    pol@centos65 ~$ ls -Z /tmp/test

    --rw-r--r-- pol pol unconfined_u:object_r:user_tmp_t:s0 /tmp/test

    ```'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# 12.18. extended attributes


    Extended attributes are used by selinux to store security contexts. These attributes
    can be viewed by ls when selinux is running.


    ```

    [root@RHEL5 home]# ls --context

    drwx------ paul paul system_u:object_r:user_home_dir_t paul

    drwx-xr-x root root user_object_r:user_home_dir_t project42

    drwx-xr-x root root user_object_r:user_home_dir_t project55

    [root@RHEL5 home]# ls -d

    drwx------ paul paul system_u:object_r:user_home_dir_t paul

    drwx-xr-x root root user_object_r:user_home_dir_t project42

    drwx-xr-x root root user_object_r:user_home_dir_t project55

    [root@RHEL5 home]#

    ```


    When selinux is not running, getattr is the tool to use.


    ```

    [root@RHEL5 etc]# getattr -m -d hosts

    # file: hosts

    security.selinux="system_u:object_r:etc_t:s00"

    ```


    # 12.19. process security context


    A option is added to ps to see the selinux security context of processes.


    ```

    [root@RHEL5 etc]# ps -Z minttty

    LABEL PID TTY TIME CMD

    sysystem_u:system_r:getty_t 2941 tty1 00:00:00 mintty

    system_u:system_r:getty_t 2942 tty2 00:00:00 mintty

    ```


    # 12.20. chchon


    Use chchon to change the selinux context.


    This example shows how to use chchon to change the type of a file.


    ```

    [root@RHEL55]# ls -z /var/www/html/test42.txt

    -rw-r--r root root user_u:object_r:httpd_sys_content_t /var/www/html/test4.txt

    [root@RHEL55]# chchon -t samba_share_t /var/www/html/test42.txt

    [root@RHEL55]# ls -z /var/www/html/test42.txt

    -rw-r--r root root user_u:object_r:samba_share_t /var/www/html/test42.txt

    ```


    Be sure to read man chon.'
