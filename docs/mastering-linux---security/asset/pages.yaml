  md: '# Chapter 8. access control lists


    Standard Unix permissions might not be enough for some organisations. This chapter
    introduces **access control lists** or **acl**s to further protect files and directories.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 8.1. acl in /etc/fstab


    File systems that support access control lists, or acls, have to be mounted with
    the acl option in /etc/fstab. In the example below, you can see that the root
    file system has acl support, whereas /home/data does not.


    ```

    root@laika:~# tail -4 /etc/fstab

    /dev/sda             ext3    acl,relimeime0 1

    /dev/sdb             /home/data auto    noacl,defaults 0 0

    pasha:/home/r        /home/pasha  nfs     defaults 0 0

    wolf~/srv/data       /home/wolf  nfs     defaults 0 0

    ```


    # 8.2. getfacl


    Reading acls can be done with /usr/bin/getfacl. This screenshot shows how to read
    the acl file33 with getfacl.


    ```

    paul@laika:~/test$ getfacl file33

    # file: file33

    # owner: paul

    # group: paul

    user::rw-

    group::-

    mask:rwx

    other::--

    ```


    # 8.3. setfacl


    Writing or changing acls can be done with /usr/bin/setfacl. These screenshots
    show how to change the acl of file33 with setfacl.


    First we add user sandra with oct permission 7 to the acl.


    Then we add the group tennis with oct permission 6 to the acl of the same file.


    ```

    paul@laika:~/test$ setfacl -m u:sandra:7 file33

    paul@laika:~/test$ setfacl -m g:tennis:6 file33

    ```


    The result is visible with getfacl.


    ```

    paul@laika:~/test$ getfacl file33

    # file: file33

    # owner: paul

    # group: paul

    user::rw-

    user:sandra:rwx

    group::-

    group:tennis:rw-

    mask:rwx

    other::--

    ```'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# 8.4. remove an acl entry


    The **-x** option of the setfac command will remove an **acl** entry from the
    targeted file.


    ```

    paul@laika:~/test$ setfac -m u:sandra:7 file33

    paul@laika:~/test$ getfac file33 | grep sandra

    user:rwx

    paul@laika:~/test$ setfac -x sandra file33

    paul@laika:~/test$ getfac file33 | grep sandra

    ```


    Note omitting the **u** or **g** when defining the **acl** for an account will
    default it to a user account.


    # 8.5. remove the complete acl


    The **-b** option of the setfac command will remove the acl from the targeted
    file.


    ```

    paul@laika:~/test$ setfac -b file33

    paul@laika:~/test$ getfac file33

    # file:file33

    # owner: paul

    # group: paul

    user:rw-

    group:r--

    other:r--

    ```


    # 8.6. the acl mask


    The **acl** defines the maximum effective permissions for any entry in the acl.
    This **mask** is calculated every time you execute the **setfac** or **chmod**
    commands.


    You can prevent the calculation by using the **--no-mask** switch.


    ```

    paullaika:~/test$ setfac --no-mask -m u:sandra:7 file33

    paul@laika:~/test$ getfac file33

    # file:file33

    # owner: paul

    # group: paul

    user:rw-

    user:sandra:rwx #effective:rw-

    group:r--

    mask:rw--

    other:r--

    ```'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# 8.7. eiciel


    Desktop users might want to use **eiciel** to manage **acls** with a graphical
    tool.


    | Basic | Emblems | Permissions | Open With | Notes | Access Control List |

    | --- | --- | --- | --- | --- | --- |

    | Access Control List | | | | | |

    | Entry | Read | Write | Execution | | |

    | 👤 paul | [x] | [x] | | | |

    | 👤 sandra | [x] | | [x] | | |

    | 👤 paul | [x] | | | [x] | | |

    | 👤 Mask | [x] | [x] | | [x] | | |

    | 👤 Other | [x] | | | | |


    You will need to install **eiciel** and **nautilus-actions** to have an extra
    tab in **nautilus** to manage **acls**.


    ```

    paul@laika:~$ sudo aptitude install eiciel nautilus-actions

    ```'
