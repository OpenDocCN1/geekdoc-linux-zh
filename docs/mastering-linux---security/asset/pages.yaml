  md: '7. Try to create a new user account (when using your normal user account).
    this should fail.

    (Details on adding debian accounts are explained in the next chapter.)


    ```

    laura@debian7:~$ useradd valentina

    -su: useradd: command not found

    laura@debian7:~$ /usr/sbin/useradd valentina

    userid: Permission denied.

    userid: cannot lock /etc/passwd; try again later.

    ```


    It is possible that userid is located in /sbin/useradd on your computer.


