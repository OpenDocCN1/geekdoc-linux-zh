  mdcn: "\n\n## 11.3.9. 允许 ICMP(ping)\n\n当你启用 iptables 时，在尝试 ping 其他主机时，会收到“Operation\
    \ not permitted（操作不允许）”的消息。\n\n```\n[root@RHEL5 ~]# ping 192.168.187.130\nPING\
    \ 192.168.187.130 (192.168.187.130) 56(84) bytes of data.\nping: sendmsg: Operation\
    \ not permitted\nping: sendmsg: Operation not permitted\n```\n\n下面的截图显示了如何设置 iptables\
    \ 以允许从你的机器或向你的机器 ping。\n\n```\n[root@RHEL5 ~]# iptables -A INPUT -p icmp --icmp-type\
    \ any -j ACCEPT\n[root@RHEL5 ~]# iptables -A OUTPUT -p icmp --icmp-type any -j\
    \ ACCEPT\n```\n\n前两行并没有允许其他计算机通过你的路由器路由 ping 消息，因为它们只处理了 INPUT 和 OUTPUT。对于 ping\
    \ 的路由，你需要在 FORWARD 链上启用它。以下命令允许网络之间的 icmp 消息路由。\n\n```\n[root@RHEL5 ~]# iptables\
    \ -A FORWARD -p icmp --icmp-type any -j ACCEPT\n```\n\n## 11.4. 练习：包过滤\n\n- 1.\
    \ 确保在 iptables 激活时，你可以 ssh 到你的路由器系统。\n- 2. 确保在 iptables 激活时，你可以 ping 你的路由器系统。\n\
    - 3. 将其中一个网络定义为“内部(internal)”，另一个定义为“外部(external)”。配置路由器允许访问网站（http）从内部网络到外部网络（但反向不行）。\n\
    - 4. 确保内部网络可以 ssh 到外部网络，但反之则不行。\n\n## 11.5. 解决方案：包过滤\n\n可能的解决方案，其中 leftnet 是内部网络，rightnet\
    \ 是外部网络。\n\n```bash\n#!/bin/bash\n\n# 首先清理所有规则\niptables -t filter -F\niptables\
    \ -t filter -X\niptables -t nat -F\niptables -t nat -X\n\n# 默认丢弃\niptables -P\
    \ INPUT DROP\niptables -P FORWARD DROP\niptables -P OUTPUT DROP\n\n# 允许回环设备\n\
    iptables -A INPUT -i lo -j ACCEPT\niptables -A OUTPUT -o lo -j ACCEPT\n\n# 问题\
    \ 1：允许从 eth0  ssh\niptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT\niptables\
    \ -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT\n\n# 问题 2：允许任何地方 icmp(ping)\n\
    iptables -A INPUT -p icmp --icmp-type any -j ACCEPT\niptables -A FORWARD -p icmp\
    \ --icmp-type any -j ACCEPT\niptables -A OUTPUT -p icmp --icmp-type any -j ACCEPT\n\
    \n# 问题 3：允许 http 从内部(leftnet) 到 外部(rightnet)\niptables -A FORWARD -i eth1 -o eth2\
    \ -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -i eth2 -o eth1 -p tcp --sport\
    \ 80 -j ACCEPT\n\n# 问题 4：允许 ssh 从内部(leftnet) 到 外部(rightnet)\niptables -A FORWARD\
    \ -i eth1 -o eth2 -p tcp --dport 22 -j ACCEPT\niptables -A FORWARD -i eth2 -o\
    \ eth1 -p tcp --sport 22 -j ACCEPT\n\n# 允许 http 从外部(rightnet) 到 内部(leftnet)\n\
    iptables -A FORWARD -i eth2 -o eth1 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD\
    \ -i eth1 -o eth2 -p tcp --sport 80 -j ACCEPT\n\n# 允许 rpcinfo 从外部通过 eth0 访问系统\n\
    iptables -A INPUT -i eth2 -p tcp --dport 111 -j ACCEPT\niptables -A OUTPUT -o\
    \ eth2 -p tcp --sport 111 -j ACCEPT\n```\n\n## 11.6. 网络地址转换\n\n### 11.6.1. 关于\
    \ NAT\n\nNAT 设备是一种路由器，同时会更改数据包中的源/或目标 IP 地址。它通常用于将私有地址范围内的多台计算机连接到（公共）互联网。NAT\
    \ 可以从互联网隐藏私有地址。\n\n开发 NAT 是为了减少真实 IP 地址的使用，允许私有地址范围访问内部后端，并且不向互联网公开内部网络。\n\niptables\
    \ 中的 nat 表增加了两个链。PREROUTING 允许在数据包到达 INPUT 链之前对其修改。POSTROUTING 允许在数据包离开 OUTPUT\
    \ 链之后对其修改。\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_99_0.png)\n\n使用 `iptables\
    \ -t nat -nL` 查看 NAT 表。下面的截图显示了一个空的 NAT 表。\n\n```\n[root@RHEL5 ~]# iptables -t\
    \ nat -nL\nChain PREROUTING (policy ACCEPT)\n  target      prot opt source   \
    \            destination\nChain POSTROUTING (policy ACCEPT)\n  target      prot\
    \ opt source               destination\nChain OUTPUT (policy ACCEPT)\n  target\
    \      prot opt source               destination\n[root@RHEL5 ~]#\n```\n\n###\
    \ 11.6.2. SNAT (源地址转换)\n\nsnat 的目标是在数据包离开系统（例如发送到互联网）之前更改其源地址。目标会将数据包返回给 NAT 设备。这意味着我们的\
    \ NAT 设备需要保留所有更改的数据包以便交付到原始源（例如私有网络）。由于 SNAT 是关于离开系统的数据，使用的是 POSTROUTING 链。这里有一条\
    \ SNAT 规则：来自 10.1.0/24 离开 eth1 的包将源地址设置为 10.1.23.14（注意这是一个命令）：\n\n```\niptables\
    \ -t nat -A POSTROUTING -o eth1 -s 10.1.0/24 -j SNAT --to-source 10.1.23.14\n\
    ```\n\n必须存在正确的 iptables 设置来允许数据包从一个网络穿越到另一个。这个示例使用了典型的 nat 设置。内部网络 (eth0) 通过外部\
    \ (eth1) 访问 Web 服务器（80端口）。\n\n```bash\n#!/bin/bash\n# 简单的 iptables 脚本\n# eth0\
    \ 是内部网络，eth1 是互联网\necho 0 > /proc/sys/net/ipv4/ip_forward\niptables -P INPUT ACCEPT\n\
    iptables -P OUTPUT ACCEPT\niptables -P FORWARD DROP\niptables -A FORWARD -i eth0\
    \ -o eth1 -s 10.1.0/24 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -i eth1\
    \ -o eth0 -d 10.1.0/24 -p tcp --dport 80 -j ACCEPT\niptables -t nat -A POSTROUTING\
    \ -o eth1 -s 10.1.0/24 -j SNAT --to-source 10.1.23.14\n```\n\n### 11.6.3. IP 伪装\
    \ (Masquerading)\n\nIP 伪装与 SNAT 非常相似，但用于动态接口。典型的示例是连接到互联网的宽带调制解调器每次启动都会接收不同的 IP\
    \ 地址。将 SNAT 脚本转换为伪装只需要一行：\n\n```\niptables -t nat -A POSTROUTING -o eth1 -s 10.1.0/24\
    \ -j MASQUERADE\n```\n\n### 11.6.4. DNAT (目标地址转换)\n\nDNAT 通常用于将来自互联网的数据包重定向到内部服务器（DMZ\
    \ 中）以及互联网无法直接访问的私有地址范围。此示例允许互联网用户通过 ssh（22端口）访问内部服务器（192.168.1.99）。\n\n```bash\n\
    #!/bin/bash\n# DNAT 的 iptables 脚本\n# eth0 是内部网络，eth1 是互联网\necho 0 > /proc/sys/net/ipv4/ip_forward\n\
    iptables -P INPUT ACCEPT\niptables -P OUTPUT ACCEPT\niptables -P FORWARD DROP\n\
    iptables -A FORWARD -i eth0 -o eth1 -s 10.1.0/24 -j ACCEPT\niptables -A FORWARD\
    \ -i eth1 -o eth0 -p tcp --dport 22 -j ACCEPT\niptables -t nat -A PREROUTING -i\
    \ eth1 -p tcp --dport 22 -j DNAT --to-destination 192.168.1.99\necho 1 > /proc/sys/net/ipv4/ip_forward\n\
    ```\n\n# 第 IV 部分. selinux\n\n# 目录\n\n- 12. SELinux 简介 ................................................\
    \ 99\n- 12.1. selinux 模式 .......................................................\
    \ 100\n- 12.2. 日志 ............................................................\
