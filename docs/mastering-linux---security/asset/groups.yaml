    from those two machines to the router. Use arp -a to make sure you are connected
    with the correct mac addresses.


    4. Ping from the leftnet computer to the rightnet computer. Enable and/or disable
    packet forwarding on the router and verify what happens to the ping between the
    two networks. If you do not succeed in pinging between the two networks (on different
    subnets), then use a sniffer like wireshark or tcpdump to discover the problem.


    5. Use wireshark or tcpdump -xx to answer the following questions. Does the source
    MAC change when a packet passes through the filter ? And the destination MAC ?
    What about source and destination IP-addresses?


    6. Both MAC addresses are changed when passing the router. Use tcpdump -xx like
    this:


    ```

    root@router-# tcpdump -xx -i eth1

    root@router-# tcpdump -xx -i eth2

    ```


    ![](img/93b29716e9fc0b0730b4dac1126847e3_86_0.png)


    ## 10.15. solution: packet forwarding


    ![](93b29716e9fc0b0730b4dac1126847e3_87_0)


    1. Set up two Linux machines, on leftnet, the other on rightnet. Make sure they
    both get an ip-address in the correct subnet. These two machines will be ''left''
    and ''right'' from the ''router''.


    ![](img/93b29716e9fc0b0730b4dac1126847e3_87_1)


    This can be done with `grep ip_forward /etc/sysctl.conf` (1 is enabled, 0 is disabled)
    or `sysctl -a | grep ip_forward`.


    2. Set up a third Linux computer with three network cards, one on leftnet, the
    other on rightnet. This computer will be the ''router''. Complete the table below
    with the relevant names, ip-addresses and mac-addresses.


    Table 10.2. Packet Forwarding


    | leftnet computer | the router | rightnet computer |

    |---|---|---|

    | 08:00:27:f6:ab:b9 | 08:00:23:1f:5a | 08:00:27:be:4a |

    | 192.168.60.8 | 192.168.60.1 | 192.168.70.9 |


    3. How can you verify whether the router will allow packet forwarding by default
    or not ? Test that you can ping from the router to the two other machines, and
    from those two machines to the router. Use arp -a to make sure you are connected
    with the correct mac addresses.


    Your setup may differ in ip addresses than the ones in the table.


    4. Ping from the left computer to the right computer. Enable and/or disable packet
    forwarding on the router and verify what happens to the ping between the two networks.
    If you do not succeed in pinging between the two networks (on different subnets),
    then use a sniffer like wireshark or tcpdump to discover the problem.


    Did you forget to add a default gateway to the LAN machines ? Use `route default
    gw ''ip-address''`


    ```

    root@left-# route add default gw 192.168.60.1

    root@right-# route add default gw 192.168.70.1

    ```


    You should be able to ping when packet forwarding is enabled (and both default
    gateways are properly configured). The ping will not work when packet forwarding
    is disabled or when gateways are not configured correctly.

