    ## Part I. local user management


    ## Chapter 1. introduction to users


    This little chapter will teach you how to identify your user account on a Unix
    computer using commands like **who am i, id**, and more.


    In a second part you will learn how to become another user with the **su** command.


    And you will learn how to run a program as another user with **sudo**.


    ### 1.1. whoami


    The whoami command tells you your username.


    ```bash

    $ paul@centos7 ~ whoami

    paul

    $ paul@centos7 ~$

    ```


    ### 1.2. who


    The who command will give you information about who is logged on the system.


    ```bash

    $ paul@centos7 ~ who

    root pts/0 2014-10-00 23:07 (104.33.101)

    paul pts/1 2014-10-00 23:30 (104.33.101)

    lura pts/2 2014-10-00 23:34 (104.33.996)

    tania pts/3 2014-10-00 23:39 (104.33.991)

    $ paul@centos7 ~$

    ```


    ### 1.3. who am i


    With who am i the command will display only the line pointing to your current
    session.


    ```bash

    $ paul@centos7 ~ who am i

    paul pts/1 2014-10-00 23:30 (104.33.101)

    $ paul@centos7 ~$

    ```


    ### 1.4. w


    The w command shows who is logged on and what they are doing.


    ```bash

    $ paul@centos7 ~ w

    23:44:07 up 31 min, 2 users, load average: 0.00, 0.01, 0.02

    USER TTY LOGIN IDLE JCPU PCPU WHAT

    root pts/0 23:07 15.00s 0.01s top

    paul pts/1 23:30 7.00s 0.00s w

    $ paul@centos7 ~$

    ```


    ### 1.5. id


    The id command will give you user id, primary group id, and a list of the groups
    that you belong to.


    ```bash

    $ paul@debian7:-$ id

    uid=1000(paul) gid=1000(paul) groups=1000(paul)

    ```


    On RHEL/CentOS you will also get SELinux context information with this command.


    ```bash

    $ root@centos7 ~$ id

    uid=0(root) gid=0(root) groups=0(root) context=unconfined_u:unconfined_r\nunconfined_t:s0-s0:c0.c1023

    ```

    '
