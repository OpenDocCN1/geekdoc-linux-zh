    # 11.3.8. scripting example


    You can write a simple script for these rules. Below is an example script that
    implements the firewall rules that you saw before in this chapter.


    ```

    #!/bin/bash

    # cleanup everything

    # first filter -F

    iptables -t filter -X

    iptables -t filter -X

    iptables -t nat -F

    iptables -t nat -X


    # default drop

    iptables -P INPUT DROP

    iptables -P FORWARD DROP

    iptables -P OUTPUT DROP


    # allow loopback device

    iptables -A INPUT -i lo -j ACCEPT

    iptables -A OUTPUT -o lo -j ACCEPT


    # allow ssh over eth0 from outside to system

    iptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT

    iptables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT


    # allow any traffic from 10.1.1.0/24 to system

    iptables -A INPUT -i eth1 -s 10.1.1.0/24 -p tcp -j ACCEPT

    iptables -A OUTPUT -o eth1 -d 10.1.1.0/24 -p tcp -j ACCEPT

    ```'
- md: "\n## 11.3.9. Allowing ICMP(ping)\n\nWhen you enable iptables, you will get\
    \ an 'Operation not permitted' message when trying to ping other hosts.\n\n```\n\
    [root@RHEL5 ~]# ping 192.168.187.130\nPING 192.168.187.130 (192.168.187.130) 56(84)\
    \ bytes of data.\nping: sendmsg: Operation not permitted\nping: sendmsg: Operation\
    \ not permitted\n```\n\nThe screenshot below shows how to setup iptables to allow\
    \ a ping from or to your machine.\n\n```\n[root@RHEL5 ~]# iptables -A INPUT -p\
    \ icmp --icmp-type any -j ACCEPT\n[root@RHEL5 ~]# iptables -A OUTPUT -p icmp --icmp-type\
    \ any -j ACCEPT\n```\n\nThe previous two lines do not allow other computers to\
    \ route ping messages through your router, because it only handles INPUT and OUTPUT.\
    \ For routing of ping, you will need to enable it on the FORWARD chain. The following\
    \ command enables routing of icmp messages between networks.\n\n```\n[root@RHEL5\
    \ ~]# iptables -A FORWARD -p icmp --icmp-type any -j ACCEPT\n```\n\n## 11.4. practice:\
    \ packet filtering\n\n- 1. Make sure you can ssh to your router-system when iptables\
    \ is active.\n- 2. Make sure you can ping to your router-system when iptables\
    \ is active.\n- 3. Define one of your networks as 'internal' and the other as\
    \ 'external'. Configure the router to allow visits to a website (http) to go from\
    \ the internal network to the external network (but not in the other direction).\n\
    - 4. Make sure the internal network can ssh to the external, but not the other\
    \ way around.\n\n## 11.5. solution: packet filtering\n\nA possible solution, where\
    \ leftnet is the internal and rightnet is the external network.\n\n```bash\n#!/bin/bash\n\
    \n# first cleanup everything\niptables -t filter -F\niptables -t filter -X\niptables\
    \ -t nat -F\niptables -t nat -X\n\n# default drop\niptables -P INPUT DROP\niptables\
    \ -P FORWARD DROP\niptables -P OUTPUT DROP\n\n# allow loopback device\niptables\
    \ -A INPUT -i lo -j ACCEPT\niptables -A OUTPUT -o lo -j ACCEPT\n\n# question 1:\
    \ allow ssh from eth0\niptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT\n\
    iptables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT\n\n# question 2: allow\
    \ icmp(ping) anywhere\niptables -A INPUT -p icmp --icmp-type any -j ACCEPT\niptables\
    \ -A FORWARD -p icmp --icmp-type any -j ACCEPT\niptables -A OUTPUT -p icmp --icmp-type\
    \ any -j ACCEPT\n\n# question 3: allow http from internal(leftnet) to external(rightnet)\n\
    iptables -A FORWARD -i eth1 -o eth2 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD\
    \ -i eth2 -o eth1 -p tcp --sport 80 -j ACCEPT\n\n# question 4: allow ssh from\
    \ internal(leftnet) to external(rightnet)\niptables -A FORWARD -i eth1 -o eth2\
    \ -p tcp --dport 22 -j ACCEPT\niptables -A FORWARD -i eth2 -o eth1 -p tcp --sport\
    \ 22 -j ACCEPT\n\n# allow http from external(rightnet) to internal(leftnet)\n\
    iptables -A FORWARD -i eth2 -o eth1 -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD\
    \ -i eth1 -o eth2 -p tcp --sport 80 -j ACCEPT\n\n# allow rpcinfo over eth0 from\
    \ outside to system\niptables -A INPUT -i eth2 -p tcp --dport 111 -j ACCEPT\n\
    iptables -A OUTPUT -o eth2 -p tcp --sport 111 -j ACCEPT\n```\n\n## 11.6. network\
    \ address translation\n\n### 11.6.1. about NAT\n\nA NAT device is a router that\
    \ is also changing the source/or target ip-address in packets. It is typically\
    \ used to connect multiple computers in a private address range with the (public)\
    \ internet. A NAT can hide private addresses from the internet.\n\nNAT was developed\
    \ to mitigate the use of real ip addresses, to allow private address ranges to\
    \ reach the inner back, and not to disclose internal networks to the internet.\n\
    \nThe nat table in iptables adds two chains. PREROUTING allows altering of packets\
    \ before they reach the INPUT chain. POSTROUTING allows altering packets after\
    \ they exit the OUTPUT chain.\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_99_0.png)\n\
    \nUse iptables -t nat -nL to look at the NAT table. The screenshot below shows\
    \ an empty NAT table.\n\n```\n[root@RHEL5 ~]# iptables -t nat -nL\nChain PREROUTING\
    \ (policy ACCEPT)\n  target      prot opt source               destination\nChain\
    \ POSTROUTING (policy ACCEPT)\n  target      prot opt source               destination\n\
    Chain OUTPUT (policy ACCEPT)\n  target      prot opt source               destination\n\
    [root@RHEL5 ~]#\n```\n\n### 11.6.2. SNAT (Source NAT)\n\nThe goal of snat is to\
    \ change the source address inside a packet before it leaves the system (e.g.\
    \ to the internet). The destination will return the packet to the NAT-device.\
    \ This means our NAT-device will need to keep a table of all the packets changed\
    \ so it can deliver the packet to the original source (e.g. in the private network).\
    \ Because SNAT is about packets leaving the system, the POSTROUTING chain. Here\
    \ is an SNAT rule. The rule says that packets coming from 10.1.0/24 and exiting\
    \ eth1 will get the source-address set to 10.1.23.14 (Note that this is one command):\n\
    \n```\niptables -t nat -A POSTROUTING -o eth1 -s 10.1.0/24 -j SNAT --to-source\
    \ 10.1.23.14\n```\n\nOf course there must exist a proper iptables setup to allow\
    \ the packet to traverse from one network to the other.\n\n### 11.6.3. SNAT example\n\
    \nThis example uses a typical nat setup. The internal (eth0) network has access\
    \ via external (eth1) webservers (port 80).\n\n```bash\n#!/bin/bash\n# iptables\
    \ script for simple nat\n# eth0 is internal network, eth1 is internet\necho 0\
    \ > /proc/sys/net/ipv4/ip_forward\niptables -P INPUT ACCEPT\niptables -P OUTPUT\
    \ ACCEPT\niptables -P FORWARD DROP\niptables -A FORWARD -i eth0 -o eth1 -s 10.1.0/24\
    \ -p tcp --dport 80 -j ACCEPT\niptables -A FORWARD -i eth1 -o eth0 -d 10.1.0/24\
    \ -p tcp --dport 80 -j ACCEPT\niptables -t nat -A POSTROUTING -o eth1 -s 10.1.0/24\
    \ -j SNAT --to-source 10.1.23.14\n```\n\n### 11.6.4. IP masquerading\n\nIP masquerading\
    \ is very similar to SNAT, but is meant for dynamic interfaces. Typical example\
    \ is broadband router/modems connected to the internet and receiving a different\
    \ ip-address from the isp, each time they are cold-booted. The only change needed\
    \ to convert the SNAT script to masquerading is one line:\n\n```\niptables -t\
    \ nat -A POSTROUTING -o eth1 -s 10.1.0/24 -j MASQUERADE\n```\n\n### 11.6.5. DNAT\
    \ (Destination NAT)\n\nDNAT is typically used to allow packets from the internet\
    \ to be redirected to an internal server (in your DMZ) and a private address range\
    \ that is inaccessible directly from the internet. This example script allows\
    \ internet users to reach your internal (192.168.1.99) server via ssh (port 22).\n\
    \n```bash\n#!/bin/bash\n# iptables script for DNAT\n# eth0 is internal network,\
    \ eth1 is internet\necho 0 > /proc/sys/net/ipv4/ip_forward\niptables -P INPUT\
    \ ACCEPT\niptables -P OUTPUT ACCEPT\niptables -P FORWARD DROP\niptables -A FORWARD\
    \ -i eth0 -o eth1 -s 10.1.0/24 -j ACCEPT\niptables -A FORWARD -i eth1 -o eth0\
    \ -p tcp --dport 22 -j ACCEPT\niptables -t nat -A PREROUTING -i eth1 -p tcp --dport\
    \ 22 -j DNAT --to-destination 192.168.1.99\necho 1 > /proc/sys/net/ipv4/ip_forward\n\
    ```\n\n# Part IV. selinux\n\n# Table of Contents\n\n- 12. introduction to SELinux\
    \ ................................................................ 99\n- 12.1.\
    \ selinux modes .......................................................................\
    \ 100\n- 12.2. logging ............................................................................\
    \ 100\n- 12.3. activating selinux .................................................................\
    \ 100\n- 12.4. getenforce ........................................................................\
    \ 101\n- 12.5. setenforce .......................................................................\
    \ 101\n- 12.6. sestatus ................................................................................\
    \ 102\n- 12.7. policy .......................................................................\
    \ 102\n- 12.8. /etc/selinux/config ................................................................\
