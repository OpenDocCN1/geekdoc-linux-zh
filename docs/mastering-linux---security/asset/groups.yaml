    ## 2.4. useradd


    You can add users with the useradd command. The example below shows how to add
    a user named yanina (last parameter) and at the same time forcing the creation
    of the home directory (-m), setting the name of the home directory (-d), and setting
    a description (-c).


    ```

    [root@RHEL5 ~]# useradd -m /home/yanina -c yanina wickmayer yanina

    [root@RHEL5 ~]# tail -1 /etc/passwd

    yanina:x:529:529:yanina:wickmayer:/home/yanina:/bin/bash

    ```


    The user named yanina received 529 and primary group id 529.


    ## 2.5. /etc/default/useradd


    Red Hat Enterprise Linux and Debian/Ubuntu have a file called /etc/default/useradd
    that contains default user options. Besides using cat to display this file, you
    can also use useradd -D.


    ```

    [root@RHEL4 ~]# useradd -D

    GROUP=100

    HOME=/home

    ACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    ```


    ## 2.6. userdel


    You can delete the user yanina with userdel. The -r option of userdel will also
    remove the home directory.


    ```

    [root@RHEL5 ~]# userdel -r yanina

    ```


    ## 2.7. usermod


    You can modify the properties of a user with the usermod command. This example
    uses usermod to change the description of the user harry.


    ```

    [root@RHEL4 ~]# tail -1 /etc/passwd

    harry:x:516:520:harry potter:/home/harry:/bin/bash

    [root@RHEL4 ~]# usermod -c ''wizard'' harry

    [root@RHEL4 ~]# tail -1 /etc/passwd

    harry:x:516:520:wizard:/home/harry:/bin/bash

    ```


    ## 2.8. creating home directories


    The easiest way to create a home directory is to supply the **-m** option with
    `useradd` (it is likely as easy as a default option on Linux).


    A less easy is to create a home directory manually with `mkdir` which also requires
    setting the owner and the permissions on the directory with `chmod` and `chown`
    (both commands are discussed in detail in another chapter).


    ```

    [root@RHEL5 ~]# # mkdir /home/laura

    [root@RHEL5 ~]# # chown laura:home/laura

    [root@RHEL5 ~]# # chmod 700 /home/laura

    [root@RHEL5 ~]# # ls -ld /home/laura/

    drwx------ 2 laura 4096 Jun 24 15:17 /home/laura/

    ```


    ## 2.9. /etc/skel/


    When using the **-m** option, the `/etc/skel/` directory is copied to the newly
    created home directory. The `/etc/skel/` directory contains some (usually hidden)
    files that contain profile settings and default values for applications. In this
    way /etc/skel/ serves as a default home directory and as a default user profile.


    ```

    [root@RHEL5 ~]# ls -la /etc/skel/

    total 48

    drwxr-xr-x 2 root 4096 Apr 1 00:11 .

    drwxr-xr-x 9 root 12288 Jun 24 15:36 .

    -rw-r--r-- 1 root 24 Jul 12 2006 .bash_logout

    -rw-r--r-- 1 root 176 Jul 12 2006 .bash_profile

    -rw-r--r-- 1 root 124 Jul 12 2006 .bashrc

    ```


    ## 2.10. deleting home directories


    The **-r** option of `userdel` will make that the home directory is deleted together
    with the user account.


    ```

    [root@RHEL5 ~]# ls -ld /home/wim/

    drwx------ 2 wim 4096 Jun 24 15:19 /home/wim/

    [root@RHEL5 ~]# # userdel -r wim

    [root@RHEL5 ~]# ls -ld /home/wim/

    ls: /home/wim/: No such file or directory

    ```


    ## 2.11. login shell


    The /etc/passwd file specifies the login shell for the user. In the screenshot
    below you can see user annelie will log in with the /bin/bash shell, and user
    laura with the /bin/ksh shell.


    ```

    [root@RHEL5 ~]# tail -2 /etc/passwd

    annelies:x:527:533:word fighter:/home/annelies:/bin/bash

    laura:x:528:534:art dealer:/home/laura:/bin/ksh

    ```


    You can use the usermod command to change the shell for a user.


    ```

    [root@RHEL5 ~]# usermod -s /bin/bash laura

    [root@RHEL5 ~]# tail -1 /etc/passwd

    laura:x:528:534:art dealer:/home/laura:/bin/bash

    ```


    ## 2.12. chsh


    Users can change their login shell with chsh. First, user obtains a list of available
    shells (he could also have done `cat /etc/shells`) and then changes his login
    shell to Korn shell (/bin/ksh). At the next login, harry will default to ksh instead
    of bash.


    ```

    [laura@centos7 ~]$ chsh -l

    /bin/sh

    /bin/bash

    /bin/nologin

    /usr/bin/bash

    /sbin/nologin

    /bin/ksh

    /bin/csh

    /tcsh

    ```

    Note that the -l option does not exist on Debian and the above screenshot assumes
    that ksh and csh shells are installed. The screenshot below shows how laura can
    change her default shell (active login).


    ```

    [laura@centos7 ~]$ chsh -s /bin/ksh

    Changing shell for laura.

    Password:

    Shell changed.

    ```


    ## 2.13. practice: user management


    - 1. Create a user named serena, including a home directory and a description
    (comment) that reads Serena Williams. Do this in one single command.

    - 2. Create a user named venus, including home directory, bash, and a description
    that reads Venus in one single command.

    - 3. Verify that both users have correct entries in /etc/passwd, /etc/shadow and
    /etc/group.

    - 4. Verify that the home directory was created.

    - 5. Create a user named erstwhile with /bin/date as his default shell.

    - 7. What happens when you log on with the erstwhile user? Can you think of a
    useful world example for changing a user''s login shell to an application?

    - 8. Create a file named welcome.txt and make sure every new user will see this
    file in their home directory.

    - 9. Verify this setup by creating (and deleting) a test user.

    - 10. Change the default login shell for the serena user to /bin/bash. Verify
    before and after you make this.


    ## 2.14. solution: user management


    1. Create a user named serena, including a home directory and a description (or
    comment) that reads Serena Williams. Do this in one single command.


    ```

    root@debian:~]# useradd -c ''Serena Williams'' serena

    ```


    2. Create a user named venus, including home directory, bash, and a description
    that reads Venus in all single command.


    ```

    root@debian:~]# useradd -m -c "Venus Williams" -s /bin/bash venus

    ```


    3. Verify that users have correct entries in /etc/passwd, /etc/shadow and /etc/group.


    ```

    root@debian:~]# tail -2 /etc/passwd

    serena:x:1001:1001:Serena Williams:/home/serena:/bin/sh

    venus:x:1002:1002:Venus:/home/venus:/bin/bash

    root@debian:~]# tail -2 /etc/shadow

    serena:x:1001:99999:::

    venus:x:1002:99999:::

    root@debian:~]# tail -2 /etc/group

    serena:1010:

    venus:1011:

    ```


    4. Verify that the home directory was created.


    ```

    root@debian:~]# ls -lrt /home | tail -2

    drwxr-xr-x 2 serena serena 4096 Oct 15 10:50 serena

    drwxr-xr-x 2 venus venus 4096 Oct 15 10:59 venus

    root@debian:~#

    ```


    5. Create a user named erstwhile with /bin/date as his default shell.


    ```

    root@debian:~]# useradd -s /bin/date einstime

    ```


    Or even better:


    ```

    root@debian:~]# useradd -s $(date) einstime

    ```


    7. What happens when you log in on the erstwhile user? Can you think of a useful
    world example for changing a user''s login shell to an application?


    ```

    root@debian:~]# su einstime

    Wed Oct 15 11:05:56 UTC 2014 # You get the output of the date command

    root@debian:~#

    ```


    It can be useful when users need to access only one application on the server.
    Just logging in opens the application for them, and closing the application automatically
    logs them out.


    8. Create a file named welcome.txt and make sure every new user will see this
    file in their home directory.


    ```

    root@debian7:~# echo Hello > /etc/skel/welcome.txt

    ```


    9. Verify this setup by creating (and deleting) a test user account.


    ```

    root@debian7:~]# useradd -m test

    root@debian7:~]# ls -l /home/test

    total 4

    -rw-r--r-- 1 test 6 Oct 15 11:16 welcome.txt

    root@debian7:~]# userdel -r test

    root@debian7:~#

    ```


    10. Change the default login shell for the serena user to /bin/bash. Verify before
    and after you make this change.


    ```

    root@debian7:~]# grep serena /etc/passwd

    serena:x:1008:1010:Serena Williams:/home/serena:/bin/sh

    root@debian7:~]# usermod -s /bin/bash serena

    root@debian7:~]# grep serena /etc/passwd

    serena:x:1008:1010:Serena Williams:/home/serena:/bin/bash

    root@debian7:~#

    ```

