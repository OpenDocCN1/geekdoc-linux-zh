    # Chapter 6. standard file permissions


    This chapter contains details about basic file security through file ownership
    and file permissions.


    ## 6.1. file ownership


    ### 6.1.1. user owner and group owner


    The **users** and **groups** of a system can be locally managed in `/etc/passwd`
    and `/etc/group`, or they can be in a NIS, LDAP, or Samba domain. These users
    and groups can *own files*. Actually, every file has a **user owner** and a **group
    owner**, as can be seen in the following screenshot.


    ```

    paul@local65:~/$ ls -lh

    total 636K

    -rw-r--r-- 1 paul snooker  1.1K Apr 8 18:47 data.out

    -rw-r--r-- 1 root paul      626K Apr 8 18:46 file1

    -rw-r--r-- 1 root tennis    185 Apr 8 18:46 file2

    -rw-r--r-- 1 root root        0 Apr 8 18:47 stuff.txt

    paul@local65:~/$

    ```


    User paul owns three files; file1 as **user owner** and has as **group owner**,
    **data.out** is **group owner** by the group snooker, file2 by the group tennis.


    The last file is called stuff and is owned by the root user and the root group.


    ### 6.1.2. listing user accounts


    You can use the following command to list all user accounts.


    ```

    paul8@debian7~$ cat -d -f1 /etc/passwd | column

    root | sam | naomi

    daemon | mysql | wouter | rino | matthis2

    bin | | tom | antonio | bram

    parten | robrecht | simon | fabrice

    sync | kevin | bilal | chimene

    games | yuri | dimitri | wouter2 | messagebus

    man | william | ah | tarik | roger

    mail | yves | dylan | jan | toon

    news | hamid | matthias | ivan | rinus

    uucp | vladimir | ben | azzedine | eddy

    www-data | david | emikel | bram

    backup | chahid | kenzo | ischa | jesse

    list | stef | aaron | bart | frederick

    iro | joeri | omer | hans

    gnats | glens | ruben | kurt | dries

    nobody | yannick | steve | steve2

    libuud | christof | jelle | constantin | tomas

    Debian-exim | george | stefan | sam2 | johan

    statd | joost | marc | bjorn | tom2

    sshd | arno | Thomas | ronald

    ```


    ### 6.1.3. chgrp


    You can change the group owner of a file using the chgrp command.


    ```

    root@rhel65:/home/paul/owners# ls -l file2

    -rw-r--r-- 1 root tennis 185 Apr 8 18:46 file2

    root@rhel65:/home/paul/owners# chgrp snooker file2

    root@rhel65:/home/paul/owners# ls -l file2

    -rw-r--r-- 1 root snooker 185 Apr 8 18:46 file2

    root@rhel65:/home/paul/owners#

    ```


    ### 6.1.4. chown


    The user owner of a file can be changed by chown command.


    ```

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 root paul 2008-08-06 14:11 FileForPaul

    root@laika:/home/paul# chown paul FileForPaul

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 paul paul 2008-08-06 14:11 FileForPaul

    ```


    You can also use chown to change both the user owner and the group owner.


    ```

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 paul paul 2008-08-06 14:11 FileForPaul

    root@laika:/home/paul# chown root:project42 FileForPaul

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 root project42 0 2008-08-06 14:11 FileForPaul

    ```


    ## 6.2. list of special files


    When you use ls -l for each file you can see ten characters before the user and
    group owner. The first character tells us the type of file. Regular files get
    a - , directories get a d, symbolic links are shown with an l, pipes get a p,
    character devices a c, block devices a b, and sockets s.


    Table 6.1. Unix special files


    | first character | file type |

    |---|---|

    | d | normal file |

    | l | symbolic link |

    | p | named pipe |

    | b | block device |

    | c | character device |

    | s | socket |


    Below a screenshot of a character device (the console) and a block device (the
    hard disk).


    ```

    paul@debian~$ ls -ld /dev/console

    crww------ 1 root 5 Mar 15 12:45 /dev/console

    brww---- 1 root 8 Mar 15 12:45 /dev/sda

    ```


    And here you can see a directory, a regular file and a symbolic link.


    ```

    paul@debian~$ ls -ld /etc/hosts /etc/motd

    drwxr-xr-x 2 root 2288 Mar 15 18:34 /etc/hosts

    drwxr-r--x 1 root 372 Dec 10 17:36 /etc/motd

    lrwxrwxrwx 1 root root 5 Dec 10:36 /etc/motd -> /var/run/motd

    ```


    ## 6.3. permissions


    ### 6.3.1. rwx


    The nine characters following the file type denote the permissions in triplets.
    A permission can be r for read, w for write, and x for execute. You need the r
    permission (ls) to list the contents of a directory. You need the x permission
    (cd) to enter a directory. You need the w permission to create or remove files
    from a directory.


    Table 6.2. standard Unix permissions


    | permission | on a file | on a directory |

    |---|---|---|

    | r (read) | read file (cat) | read contents (ls) |

    | w (write) | change file (vi) | create files (touch) |

    | x (execute) | execute the file | enter the directory (cd) |


    ### 6.3.2. three sets of rwx


    We already know that the permissions of ls -l starts with ten characters for each
    file because the first character is a -.


    ```

    paul@RHEL~$ ls -l .bash

    -rwxr-xr-- 1 paul 984 Feb 6 12:01 .bash

    ```


    Below is a table describing the function of all ten characters.


    Table 6.3. Unix file permissions


    | position | characters | function |

    |---|---|---|

    | 1 | - | this is a regular file |

    | 2-4 | rwx | permissions for the user owner |

    | 5-7 | r-x | permissions for the group owner |

    | 8-10 | r-- | permissions for others |


    When you are the user owner of a file, then the user owner permissions apply to
    you. The rest of the permissions have no influence on your access to the file.


    When you belong to the group that is the group owner of a file, then the group
    owner permissions apply to you. The rest of the permissions have no influence
    on your access to the file.


    When you are not the user owner of a file and you do not belong to the group owner,
    then others permissions apply to you. The rest of the permissions have no influence
    on your access to the file.


    ### 6.3.3. permission examples


    Some combinations on files and directories are seen in this screenshot. The name
    of the file explains the permissions.


    ```

    paul@laika:~/perms$ ls -lh

    total 12K

    dr-xr-x 2 paul 4.0K 2007-02-07 22:26 All_UserDelete

    -rw-rw-rw 1 paul 0 2007-02-07 22:21 EveryoneFullControl.txt

    -r--r---- 1 paul 0 2007-02-07 22:21 OnlyOwnersRead.txt

    -rwxrwx--- 1 paul 0 2007-02-07 22:21 OwnersAll_RestNothing.txt

    dr-xr-x 2 paul 4.0K 2007-02-07 22:25 UserAndGroupEnter

    dr-x---- 2 paul 4.0K 2007-02-07 22:25 OnlyUserEnter

    paul@laika~$

    ```


    To summarise, the first **rwx** triplet represents the permissions for the **user
    owner**. The second triplet corresponds to the **group owner**; it specifies permissions
    for all members of that group. The third triplet defines permissions for all **other**
    users that are not the user owner and are not a member of the group owner.


    ### 6.3.4. setting permissions (chmod)


    Permissions can be changed with chmod. The first example gives the user owner
    execute permissions.


    ```

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-r--r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    paul@laika:~/perms$ chmod +x permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwxr-xr-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example removes the group owners read.


    ```

    paul@laika:~/perms$ chmod g-r permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwx--r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example removes the other read.


    ```

    paul@laika:~/perms$ chmod +w permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwx-rw-w 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example gives all of them write permission.


    You don''t even have to type the a.


    ```

    paul@laika:~/perms$ chmod +x permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwx-wx-x 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    You can also set permissions.


    ```

    paul@laika:~/perms$ chmod u+rw permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-rw-r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    Feel free to make any kind of combination.


    ```

    paul@laika:~/perms$ chmod u+rw,go=r permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-rw-r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    Even fishy combinations are accepted by chmod.


    ```

    paul@laika:~/perms$ chmod u+rw,ug+rw,o=r permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwxr-xr-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```

