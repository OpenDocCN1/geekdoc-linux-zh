    ## Chapter 8. access control lists


    Standard Unix permissions might not be enough for some organisations. This chapter
    introduces access control lists (acls) to further protect files and directories.


    ### 8.1. acl in /etc/fstab


    File systems that support access control lists (acl) have to be mounted with the
    acl option in /etc/fstab. In the example below, you can see that the root system
    has acl, whereas /home/data does not.


    ```

    root@laika:~# tail /etc/fstab

    /dev/sda             ext4    acl,relime 1

    /dev/sdb             ext4    auto,defaults 0

    /home/asha          nfs     defaults 0

    /home/wolf           nfs     defaults 0

    ```


    ### 8.2. getfacl


    Reading acls can be done with /usr/bin/getfacl. This screenshot shows how to read
    the acl with getfacl.


    ```

    paul@laika:~/test$ getfacl

    # file: test

    owner: paul

    group: paul

    user::rw-

    group::

    other::--

    ```


    ### 8.3. setfacl


    Writing or changing acls can be done with /usr/bin/setfacl. These screenshots
    show how to change the acl with setfacl. First we add user sandra with permission
    7 to the acl. Then we add group tennis with permission 6 to the same file.


    ```

    paul@laika:~/test$ setfacl -m u:sandra:7 test

    paul@laika:~/test$ setfacl -m g:tennis:6 test

    ```


    The result is visible with getfacl.


    ```

    paul@laika:~/test$ getfacl

    # file: test

    owner: paul

    group: paul

    user::rw-

    user:sandra:rwx

    group::

    group:tennis:rw-

    other::--

    ```


    ### 8.4. remove an acl


    The -x option of the setfacl command will remove an acl entry from the targeted
    file.


    ```

    paul@laika:~/test$ setfacl -m u:sandra:7 test

    paul@laika:~/test$ getfacl | grep sandra

    user:rwx

    paul@laika:~/test$ setfacl -x sandra test

    paul@laika:~/test$ getfacl | grep sandra

    ```


    Note omitting u or g when defining the acl for an account will default it to a
    user.


    ### 8.5. remove the complete acl


    The -b option of the setfacl command will remove the acl from the targeted file.


    ```

    paul@laika:~/test$ setfacl -b test

    paul@laika:~/test$ getfacl test

    # file: test

    owner: paul

    group: paul

    user::rw-

    group::

    other::--

    ```


    ### 8.6. the acl mask


    The acl defines the maximum effective permissions for any entry in the acl. This
    mask is calculated every time you execute the setfacl or chmod commands. You can
    prevent the calculation by using the --no-mask switch.


    ```

    paul@laika:~/test$ setfacl --no-mask -m u:sandra:7 test

    paul@laika:~/test$ getfacl test

    # file: test

    owner: paul

    group: paul

    user::rw-

    user:sandra:rwx #effective:rw-

    group::

    mask:rw--

    other::--

    ```


    ### 8.7. efacl


    Desktop users might want to use efacl to manage acls with a graphical tool.


    | Basic | Emblems | Permissions | Open With | Notes | Access Control List |

    | --- | --- | --- | --- | --- | --- |

    | Access Control List | | | | | |

    | Entry | Read | Write | Execution | | |

    | 👤 paul | [x] | [x] | | | |

    | 👤 sandra | [x] | | [x] | | |

    | 👤 paul | [x] | | | [x] | | |

    | 👤 Mask | [x] | [x] | | [x] | | |

    | 👤 Other | [x] | | | | |


    You will need to install efacl and nautilus-actions to have an extra tab in nautilus
    to manage acls.


    ```

    paul@laika:~$ sudo aptitude install acl nautilus-actions

    ```


    ## Chapter 9. file links


    An average computer using Linux has a file system with many hard links and symbolic
    links. To understand links in a file system, you first have to understand what
    an inode is.


    ## 9.1. inodes


    ### 9.1.1. inode contents


    inode is a data structure that contains metadata about a file. When the file system
    stores a new file on the hard disk, it stores not only the contents of the file
    but also properties like the name, the creation date, permissions, the owner,
    and more. All this information (except the name) is stored in the inode.


    The inode table is a list of inodes on the file system. Each file has exactly
    one inode.


    ### 9.1.2. inode table


    The inode table contains the metadata for all files on the file system. Each entry
    in the table is identified by an inode number.


    | Inode Number | Permissions | Owner | Group | Size | Links | Name |

    | --- | --- | --- | --- | --- | --- | --- |

    | 1 | drwxr-xr-x | root | root | 4096 | 12 | /dev |

    | 2 | drwxr-xr-x | root | root | 4096 | 1 | / |

    | 3 | drwxr-xr-x | root | root | 4096 | 1 | /bin |

    | 4 | drwxr-xr-x | root | root | 4096 | 1 | /etc |

    | 5 | drwxr-xr-x | root | root | 4096 | 2 | /home |

    | 6 | -rw-r--r-- | root | root | 1260 | 1 | /etc/shadow |

    | 7 | -rws--xr-x | root | root | 21200 | 1 | /usr/bin/passwd |


    The inode number is internal. You can use the ls -i command to see the inode number
    of a file.


    ```

    paul@laika:~$ ls -i /etc/shadow

    123456 -rw-r--r-- 1 root root 1260 Jan 21 07:49 /etc/shadow

    paul@laika:~$ ls -i /usr/bin/passwd

    654321 -rws--xr-x 1 root root 21200 Jun 17 2005 /usr/bin/passwd

    ```


    A hard link is simply a directory entry that points to an existing inode. file
    systems like ext4 allow multiple directory entries to point to the same inode.
    This means that multiple filenames can have the same inode.


    ```

    paul@laika:~$ touch file1

    paul@laika:~$ ls -i file1

    111111 -rw-r--r-- 1 paul paul 0 Oct 27 10:00 file1

    paul@laika:~$ ln file1 file2

    paul@laika:~$ ls -i file1

    111111 -rw-r--r-- 2 paul paul 0 Oct 27 10:00 file1

    paul@laika:~$ ls -i file2

    111111 -rw-r--r-- 2 paul paul 0 Oct 27 10:00 file2

    ```


    The link count is the number of directory entries pointing to the inode. When
    you delete one link, the inode is deleted when the link count reaches zero.


    ```

    paul@laika:~$ rm file1

    paul@laika:~$ ls -i file2

    111111 -rw-r--r-- 1 paul paul 0 Oct 27 10:00 file2

    ```


    A symbolic link is a special type of file that contains the path to another file.
    If the target file is deleted, the symbolic link becomes "broken".


    ```

    paul@laika:~$ touch file1

    paul@laika:~$ ln -s file1 link2

    paul@laika:~$ ls -ld link2

    222222 -lrwxrwxrwx 1 paul paul 0 Oct 27 10:05 link2 -> file1

    paul@laika:~$ rm file1

    paul@laika:~$ ls -ld link2

    ls: cannot access ''link2'': No such file or directory

    paul@laika:~$ touch file1-new

    paul@laika:~$ ls -ld link2

    222222 -lrwxrwxrwx 1 paul paul 0 Oct 27 10:05 link2 -> file1

    ```

