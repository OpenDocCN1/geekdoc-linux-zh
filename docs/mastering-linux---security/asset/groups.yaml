- md: "\n# introduction to routers\n\n6. Remember the third network card on the router?\
    \ Connect this card to a LAN with internet connection. On many LANs, the command\
    \ dhclient eth0 just works (replace eth0 with the correct interface).\n\n```\n\
    root@router~# dhclient eth0\n```\n\nYou now have a setup similar to this picture.\
    \ What needs to be done to give internet access to leftnet and rightnet?\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_89_0.png)\n\
    \nThe clients on leftnet and rightnet need a working dns server. We use one of\
    \ Google's dns servers here.\n\n```\necho nameserver 8.8.8.8 > /etc/resolv.conf\n\
    ```\n\n# Chapter 11. iptables firewall\n\nThis chapter introduces some simple\
    \ firewall rules and how to configure them with iptables.\n\niptables is an application\
    \ that allows a user to configure the firewall functionality built into the Linux\
    \ kernel.\n\n## 11.1. iptables tables\n\nBy default there are three tables in\
    \ the kernel that contain sets of rules.\n\nThe filter table is used for packet\
    \ filtering.\n\n```\nroot@debian6~# iptables -t filter -L\nChain INPUT (policy\
    \ ACCEPT)\n  target               prot opt source       destination\nChain FORWARD\
    \ (policy ACCEPT)\n  target               prot opt source       destination\n\
    Chain OUTPUT (policy ACCEPT)\n  target               prot opt source       destination\n\
    ```\n\nThe nat table is used for address translation.\n\n```\nroot@debian6~# iptables\
    \ -t nat -L\nChain PREROUTING (policy ACCEPT)\n  target               prot opt\
    \ source       destination\nChain POSTROUTING (policy ACCEPT)\n  target      \
    \         prot opt source       destination\nChain OUTPUT (policy ACCEPT)\n  target\
    \               prot opt source       destination\n```\n\nThe mangle table is\
    \ used for special-purpose processing of packets.\n\nSeries of rules in each table\
    \ are called a chain. We will discuss chains and the nat table later in this chapter.\n\
    \n## 11.2. starting and stopping iptables\n\nThe following screenshot shows how\
    \ to stop and start iptables on Red Hat/Fedora/CentOS and compatible distributions.\n\
    \n```\nroot@centos6 ~# service iptables stop\nroot@centos6 ~# service iptables\
    \ start\niptables: Applying firewall rules      [ ok ]\nroot@centos6 ~#\n```\n\
    \nDebian and ubuntu distributions do not have this script, but allow for an uninstall.\n\
    \n```\nroot@debian6~# aptitude purge iptables\n```\n\n## 11.3. the filter table\n\
    \n### 11.3.1. about packet filtering\n\nPacket filtering is a bit more than packet\
    \ forwarding. While packet forwarding uses only a routing table to make decisions,\
    \ packet filtering also uses a list of rules. The kernel will inspect packets\
    \ and decide based on these rules what to do with each packet.\n\n### 11.3.2.\
    \ filter table\n\nThe filter table in iptables has three chains (sets of rules).\
    \ The INPUT chain is used for any packet coming into the system. The OUTPUT chain\
    \ is for any packet leaving the system. And the FORWARD chain is for packets that\
    \ are forwarded (routed) through the system.\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_92_0.png)\n\
    \nThe screenshot below shows how to list the filter table and all its rules.\n\
    \n```\n[root@RHEL5 ~]# iptables -t filter -nL\nChain INPUT (policy ACCEPT)\n \
    \ target      prot opt source      destination\nChain FORWARD (policy ACCEPT)\n\
    \  target      prot opt source      destination\nChain OUTPUT (policy ACCEPT)\n\
    \  target      prot opt source      destination\n[root@RHEL5 ~]#\n```\n\nAs you\
    \ can see, all three chains in the filter table are set to ACCEPT everything.\
    \ ACCEPT is the default behaviour.\n\n### 11.3.3. setting default rules\n\nThe\
    \ default for rule default is indeed to ACCEPT everything. This is not the most\
    \ secure firewall.\n\nA more secure setup is to DROP everything. A package that\
    \ is **dropped** will not continue in any chain, and no warning or error will\
    \ be sent anywhere.\n\nThe below commands lock down a computer. Do not execute\
    \ these commands inside a remote ssh shell.\n\n```\nroot@debianpaul:~# iptables\
    \ -P INPUT DROP\nroot@debianpaul:~# iptables -P OUTPUT DROP\nroot@debianpaul:~#\
    \ iptables -P FORWARD DROP\nroot@debianpaul:~# iptables -L\nChain INPUT (policy\
    \ DROP)\n  target      prot opt source               destination\nChain FORWARD\
    \ (policy DROP)\n  target      prot opt source               destination\nChain\
    \ OUTPUT (policy DROP)\n  target      prot opt source               destination\n\
    ```\n\n### 11.3.4. changing policy rules\n\nTo start, let's set the default policy\
    \ for all three chains to drop everything. Note that you might lose your connection\
    \ when typing over ssh -.\n\n```\n[root@RHEL5 ~] iptables -P INPUT DROP\n[root@RHEL5\
    \ ~] iptables -P FORWARD DROP\n[root@RHEL5 ~] iptables -P OUTPUT DROP\n```\n\n\
    Next, we allow the server to use its own loopback device (this allows the chain\
    \ to access to its services running on localhost). (ACCEPT) traffic from the lo\
    \ (loopback) interface, then we do the same to allow packets to leave the system\
    \ through the loopback interface.\n\n```\n[root@RHEL5 ~] iptables -A INPUT -i\
    \ lo -j ACCEPT\n[root@RHEL5 ~] iptables -A OUTPUT -o lo -j ACCEPT\n```\n\nLooking\
    \ at the filter table (omitting -f filter it is the default table):\n\n```\n[root@RHEL5\
    \ ~] iptables -nL\nChain INPUT (policy DROP)\n  target      prot opt source  \
    \             destination\n  ACCEPT      all             0.0.0.0/0.0.0.0/\nChain\
    \ FORWARD (policy DROP)\n  target      prot opt source               destination\n\
    Chain OUTPUT (policy DROP)\n  target      prot opt source               destination\n\
    \  ACCEPT      all             0.0.0.0/0.0.0.0/\n```\n\n### 11.3.5. Allowing ssh\
    \ access eth0\n\nThis example show how to add two rules to allow ssh access to\
    \ your system from outside.\n\n```\nroot@RHEL5 ~# iptables -A INPUT -i eth0 -p\
    \ tcp --dport 22 -j ACCEPT\nroot@RHEL5 ~# iptables -A OUTPUT -o eth0 -p tcp -j\
    \ ACCEPT\n```\n\nThe filter table will look something like this (note that -v\
    \ is added).\n\n```\nroot@RHEL5 ~# iptables -nL\nChain INPUT (policy DROP)\n \
    \ target      prot opt source               destination\n  ACCEPT      all   \
    \          0.0.0.0/0.0.0.0/\nChain FORWARD (policy DROP)\n  target      prot opt\
    \ source               destination\nChain OUTPUT (policy DROP)\n  target     \
    \ prot opt source               destination\n  ACCEPT      all             0.0.0.0/0.0.0.0/\n\
    ```\n\n### 11.3.6. Allowing access from a subnet\n\nThis example shows how to\
    \ allow access from a subnet to the system, but only through eth1.\n\n```\nroot@RHEL5\
    \ ~# iptables -A INPUT -i eth1 -s 10.1.1.0/24 -p tcp -j ACCEPT\nroot@RHEL5 ~#\
    \ iptables -A OUTPUT -o eth1 -d 10.1.1.0/24 -p tcp -j ACCEPT\n```\n\nWith the\
    \ previous examples, the policy is:\n\n```\nroot@router~# iptables -nL\nChain\
    \ INPUT (policy DROP)\n  target      prot opt source               destination\n\
    \  ACCEPT      all             0.0.0.0/0.0.0.0/\nChain FORWARD (policy DROP)\n\
    \  target      prot opt source               destination\nChain OUTPUT (policy\
    \ DROP)\n  target      prot opt source               destination\n  ACCEPT   \
    \   all             0.0.0.0/0.0.0.0/\n```\n\n### 11.3.7. iptables save\n\nUse\
    \ iptables save to automatically implement these rules when the firewall is (re)started.\n\
    \n```\n[root@HEL5 ~]# /etc/init.d/iptables save\nSaving firewall rules to /etc/sysconfig/iptables:\
    \      [ OK ]\n[root@HEL5 ~]#\n```\n\n### 11.3.8. scripting example\n\nYou can\
    \ write a simple script for these rules. Below is an example script that implements\
    \ the firewall rules that you saw before in this chapter.\n\n```bash\n#!/bin/bash\n\
    # cleanup everything\n# first filter -F\niptables -t filter -X\niptables -t filter\
    \ -X\niptables -t nat -F\niptables -t nat -X\n\n# default drop\niptables -P INPUT\
    \ DROP\niptables -P FORWARD DROP\niptables -P OUTPUT DROP\n\n# allow loopback\
    \ device\niptables -A INPUT -i lo -j ACCEPT\niptables -A OUTPUT -o lo -j ACCEPT\n\
    \n# allow ssh over eth0 from outside to system\niptables -A INPUT -i eth0 -p tcp\
    \ --dport 22 -j ACCEPT\niptables -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT\n\
    \n# allow any traffic from 10.1.1.0/24 to system\niptables -A INPUT -i eth1 -s\
    \ 10.1.1.0/24 -p tcp -j ACCEPT\niptables -A OUTPUT -o eth1 -d 10.1.1.0/24 -p tcp\
    \ -j ACCEPT\n```\n"
  mdcn: "\n\n# 路由器介绍\n\n6. 还记得路由器上的第三块网卡吗？将此网卡连接到有互联网的局域网（LAN）。在许多局域网上，执行 `dhclient\
    \ eth0` 命令即可生效（将 eth0 替换为正确的接口名称）。\n\n```\nroot@router~# dhclient eth0\n```\n\n\
    你现在的设置与此图类似。需要做哪些操作才能让 leftnet 和 rightnet 访问互联网？\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_89_0.png)\n\
    \nleftnet 和 rightnet 上的客户端需要一个工作的 dns 服务器。我们在这里使用 Google 的其中一个 dns 服务器。\n\n```\n\
    echo nameserver 8.8.8.8 > /etc/resolv.conf\n```\n\n# 第 11 章 iptables 防火墙\n\n本章介绍了一些简单的防火墙规则以及如何使用\
    \ iptables 配置它们。\n\niptables 是一个允许用户配置 Linux 内核内置防火墙功能的应用程序。\n\n## 11.1. iptables\
    \ 表（tables）\n\n默认情况下，内核中有三个表，其中包含一组规则。\n\nfilter 表（过滤表）用于数据包过滤。\n\n```\nroot@debian6~#\
    \ iptables -t filter -L\nChain INPUT (policy ACCEPT)\n  target               prot\
    \ opt source       destination\nChain FORWARD (policy ACCEPT)\n  target      \
    \         prot opt source       destination\nChain OUTPUT (policy ACCEPT)\n  target\
    \               prot opt source       destination\n```\n\nnat 表（转换表）用于地址翻译。\n\n\
    ```\nroot@debian6~# iptables -t nat -L\nChain PREROUTING (policy ACCEPT)\n  target\
    \               prot opt source       destination\nChain POSTROUTING (policy ACCEPT)\n\
    \  target               prot opt source       destination\nChain OUTPUT (policy\
    \ ACCEPT)\n  target               prot opt source       destination\n```\n\nmangle\
    \ 表（修改表）用于数据包的特殊处理。\n\n每个表中的系列规则被称为链（chain）。我们将在本章稍后讨论链和 nat 表。\n\n## 11.2. 启动和停止\
    \ iptables\n\n下面的截图显示了如何在 Red Hat/Fedora/CentOS 及兼容发行版上停止和启动 iptables。\n\n```\n\
    root@centos6 ~# service iptables stop\nroot@centos6 ~# service iptables start\n\
    iptables: Applying firewall rules      [ ok ]\nroot@centos6 ~#\n```\n\nDebian\
    \ 和 ubuntu 发行版没有这个脚本，但允许卸载。\n\n```\nroot@debian6~# aptitude purge iptables\n```\n\
    \n## 11.3. filter 表\n\n### 11.3.1 关于数据包过滤\n\n数据包过滤不仅仅是数据包转发。数据包转发只使用路由表来做决策，而数据包过滤还使用规则列表。内核将检查数据包，并根据这些规则决定对每个数据包进行什么操作。\n\
    \n### 11.3.2 filter 表\n\niptables 中的 filter 表有三个链（规则集）。INPUT 链用于任何进入系统的数据包。OUTPUT\
    \ 链用于任何离开系统的数据包。FORWARD 链用于通过系统转发（路由）的数据包。\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_92_0.png)\n\
    \n下方的截图显示了如何列出 filter 表及其所有规则。\n\n```\n[root@RHEL5 ~]# iptables -t filter -nL\n\
    Chain INPUT (policy ACCEPT)\n  target      prot opt source      destination\n\
    Chain FORWARD (policy ACCEPT)\n  target      prot opt source      destination\n\
    Chain OUTPUT (policy ACCEPT)\n  target      prot opt source      destination\n\
    [root@RHEL5 ~]#\n```\n\n你可以看到，filter 表中的所有三个链都设置为 ACCEPT（接受）所有内容。ACCEPT 是默认行为。\n\
    \n### 11.3.3 设置默认规则\n\n规则的默认值确实是 ACCEPT 所有内容。这并不是最安全的防火墙。\n\n更安全的设置是 DROP（丢弃）所有内容。被**丢**的包将不会在任何链中继续执行，且不会向任何地方发送警告或错误。\n\
    \n下面的命令会锁定计算机。请勿在远程 ssh 终端中执行这些命令。\n\n```\nroot@debianpaul:~# iptables -P INPUT\
    \ DROP\nroot@debianpaul:~# iptables -P OUTPUT DROP\nroot@debianpaul:~# iptables\
    \ -P FORWARD DROP\nroot@debianpaul:~# iptables -L\nChain INPUT (policy DROP)\n\
    \  target      prot opt source               destination\nChain FORWARD (policy\
    \ DROP)\n  target      prot opt source               destination\nChain OUTPUT\
    \ (policy DROP)\n  target      prot opt source               destination\n```\n\
    \n### 11.3.4 更改策略规则\n\n首先，让我们将三个链的默认策略设置为丢弃所有内容。注意，当你通过 ssh 输入命令时，可能会丢失连接。\n\n\
    ```\n[root@RHEL5 ~] iptables -P INPUT DROP\n[root@RHEL5 ~] iptables -P FORWARD\
    \ DROP\n[root@RHEL5 ~] iptables -P OUTPUT DROP\n```\n\n接下来，我们允许服务器使用自己的回环设备（这允许链访问运行在\
    \ localhost 上的服务）。允许来自 lo（回环）接口的（ACCEPT）流量，然后我们对其执行同样的操作，允许数据包通过回环接口离开系统。\n\n\
    ```\n[root@RHEL5 ~] iptables -A INPUT -i lo -j ACCEPT\n[root@RHEL5 ~] iptables\
    \ -A OUTPUT -o lo -j ACCEPT\n```\n\n查看 filter 表（注意 -f 是默认）：\n\n```\n[root@RHEL5\
    \ ~] iptables -A INPUT -i lo -j ACCEPT\n[root@RHEL5 ~] iptables -A OUTPUT -o lo\
    \ -j ACCEPT\n\n[root@RHEL5 ~] iptables -nL\nChain INPUT (policy DROP)\n  target\
    \      prot opt source      destination\n  ACCEPT       all             0.0.0/0\n\
    Chain FORWARD (policy DROP)\n  target      prot opt source      destination\n\
    Chain OUTPUT (policy DROP)\n  target      prot opt source      destination\n \
    \ ACCEPT       all             0.0.0/0\n```\n\n### 11.3.5. 允许 ssh 访问\n\n此示例显示了如何添加规则以从外部通过\
    \ eth0 允许 ssh。\n\n```\nroot@RHEL5 ~# iptables -A INPUT -i eth0 -j ACCEPT\nroot@RHEL5\
    \ ~# iptables -A OUTPUT -o eth0 -j ACCEPT\n```\n\nfilter 表看起来像这样（注意 -v 是添加的）：\n\
    \n```\nroot@RHEL5 ~# iptables -nL\nChain INPUT (policy DROP)\n  target      prot\
    \ opt source      destination\n  ACCEPT       all             0.0.0/0\nChain FORWARD\
    \ (policy DROP)\n  target      prot opt source      destination\nChain OUTPUT\
    \ (policy DROP)\n  target      prot opt source      destination\n  ACCEPT    \
    \   all             0.0.0/0\n```\n\n### 11.3.6. 允许来自子网访问\n\n此示例显示了如何允许子网访问系统，但仅通过\
    \ eth1。\n\n```\nroot@RHEL5 ~# iptables -A INPUT -i eth1 -s 10.1.1.0/24 -p tcp\
    \ -j ACCEPT\nroot@RHEL5 ~# iptables -A OUTPUT -o eth1 -d 10.1.1.0/24 -p tcp -j\
    \ ACCEPT\n```\n\n通过之前的示例，策略是：\n\n```\nroot@router~# iptables -nL\nChain INPUT\
    \ (policy DROP)\n  target      prot opt source      destination\nChain FORWARD\
    \ (policy DROP)\n  target      prot opt source      destination\nChain OUTPUT\
    \ (policy DROP)\n  target      prot opt source      destination\n```\n\n### 11.3.7.\
    \ iptables save\n\n使用 iptables save 在防火墙（重）启动时自动实现这些规则。\n\n```\n[root@HEL5 ~]#\
    \ /etc/init.d/iptables save\nSaving firewall rules to /etc/sysconfig/iptables:\
    \      [ OK ]\n[root@HEL5 ~]#\n```\n\n### 11.3.8. 脚本示例\n\n你可以为这些规则编写一个简单的脚本。下面是一个在本章之前看到的防火墙规则的示例脚本。\n\
    \n```bash\n#!/bin/bash\n# 清理所有内容\n# 首先是 filter\niptables -t filter -F\niptables\
    \ -t filter -X\niptables -t nat -F\niptables -t nat -X\n\n# 默认丢弃\niptables -P\
    \ INPUT DROP\niptables -P FORWARD DROP\niptables -P OUTPUT DROP\n\n# 允许回环设备\n\
    iptables -A INPUT -i lo -j ACCEPT\niptables -A OUTPUT -o lo -j ACCEPT\n\n# 允许从外部通过\
    \ eth0 访问 ssh\niptables -A INPUT -i eth0 -p tcp --dport 22 -j ACCEPT\niptables\
    \ -A OUTPUT -o eth0 -p tcp --sport 22 -j ACCEPT\n\n# 允许来自 10.1.1.0/24 的任何流量访问系统\n\
    iptables -A INPUT -i eth1 -s 10.1.1.0/24 -p tcp -j ACCEPT\niptables -A OUTPUT\
    \ -o eth1 -d 10.1.1.0/24 -p tcp -j ACCEPT\n```\n\n"
