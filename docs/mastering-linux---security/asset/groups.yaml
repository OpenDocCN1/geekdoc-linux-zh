    # # 3.6 /etc/login.defs


    The /etc/login.defs file contains some default settings for user passwords like
    password aging and length settings. (You will also find the numerical limits of
    user ids and group ids and whether or not a home directory should be created by
    default).


    ```

    root@rhel65:~# grep "PASS /etc/login.defs"

    PASS_MAX_DAYS      99999

    PASS_MIN_DAYS      0

    PASS_MIN_LEN       5

    PASS_WARN_AGE      7

    ```


    Debian also has


    ```

    root@debian7:~# grep PASS /etc/login.defs

    # PASS_MAX_DAYS      Maximum number of days a password may be used.

    # PASS_MIN_DAYS      Minimum number of days allowed between password changes.

    # PASS_WARN_AGE      Number of days warning given before a password expires.

    PASS_MAX_DAYS      99999

    PASS_MIN_DAYS      0

    PASS_WARN_AGE      7

    #PASS_CHANGE_TRIES

    #PASS_ALWAYS_WARN

    #PASS_MIN_LEN

    #PASS_MAX_LEN

    # NO_PASSWORD_CONSOLE

    root@debian7:~#

    ```


    # # 3.7. charge


    The change command can be used to set an expiration date for a user account (-E),
    set a minimum (-m) and maximum (-M) password age, a password expiration date,
    and set the number of warning days before the password expiration date. Much of
    this functionality is also available from the passwd command. The -l option of
    charge will list these settings for a user.


    ```

    root@rhel65:~# charge -l paul

    Last password change               : Mar 27, 2014

    Password expires                   : never

    Password inactive                  : never

    Account expires                    : never

    Minimum number of days between password change : 0

    Maximum number of days between password change : 99999

    Number of days of warning before password expires : 7

    root@rhel65:~#

    ```'
  - '[PAGE 30]


    # 3.8. disabling a password


    Passwords in /etc/shadow cannot begin with an exclamation mark. When the second
    field in /etc/passwd starts with an an exclamation mark, then the password can
    not be used.


    Using this feature is often called locking, disabling, or suspending a user account.
    Besides vi (or vip) you can also accomplish this with usermod.


    The first command in the next screenshot will show the password field of laura.
    The next command disables the password of laura, making it impossible for Laura
    to authenticate using this password.


    ```

    root@debian:-# grep laura /etc/shadow | cut -c1-70

    laura:$6JY4J2gp$stwWAc30tEI2R2auE87j.nbW.dpKNUYVK7mChFCVMa3CoDUJV

    root@debian:-# usermod -l laura

    ```


    As you can see, the password hash is simply preceded with an exclamation mark.


    ```

    root@debian:-# grep laura /etc/shadow | cut -c1-70

    laura:$66JY4J2gp$stwWAc30tEI2R2auE87j.nbW.dpKNUYVK7mChFCVMa3CoDUJV

    root@debian:-#

    ```


    The user (and users with sudo rights on) will still be able to su into the laura
    account (because the password is not set here!). Note that laura will still be
    able to login if she has set up password ssh!


    ```

    root@debian:-# su - laura

    laura@debian:-$

    ```


    You can unlock the account again with usermod -U.


    ```

    root@debian:-# usermod -U laura

    root@debian:-# grep laura /etc/shadow | cut -c1-70

    laura:$6JY4J2gp$stwWAc30tEI2R2auE87j.nbW.dpKNUYVK7mChFCVMa3CoDUJV

    ```


    Watch out for differences in the command line of password, usermod and usermadd
    on Linux distributions. Verify the local files when using features like "disabling,
    suspending, or locking" on user accounts and their passwords.


    # 3.9. editing local files


    If you want to manually edit the /etc/passwd or /etc/shadow, after knowing these
    commands for password management, use vip instead of vi(m) directly. The vip tool
    will do proper locking of the file.


    ```

    [root@RHEL5 ~]# vip /etc/passwd

    vip: the password file is busy (/etc/ptmp present)

    ```'
