    LISTEN 1166/rpcd system_u:system_r:rpcbind_t:s0

    LISTEN 1096/rpcbind system_u:system_r:rpcbind_t:s0

    LISTEN 1666/httpd unconfined system_u:system_r:httpd_t:s0

