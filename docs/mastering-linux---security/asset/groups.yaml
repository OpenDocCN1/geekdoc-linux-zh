    \ NAT device is a router that is also changing the source/or target ip-address\
    \ in packets. It is typically used to connect multiple computers in a private\
    \ address range with the (public) internet. A NAT can hide private addresses from\
    \ the internet.\n\nNAT was developed to mitigate the use of real ip addresses,\
    \ to allow private address ranges to reach the inner back, and not to disclose\
    \ internal networks to the internet.\n\nThe nat table in iptables adds two chains.\
    \ PREROUTING allows altering of packets before they reach the INPUT chain. POSTROUTING\
    \ allows altering packets after they exit the OUTPUT chain.\n\n![](img/93b29716e9fc0b0730b4dac1126847e3_99_0.png)\n\
    \nUse iptables -t nat -nL to look at the NAT table. The screenshot below shows\
    \ an empty NAT table.\n\n```\n[root@RHEL5 ~]# iptables -t nat -nL\nChain PREROUTING\
    \ (policy ACCEPT)\n  target      prot opt source               destination\nChain\
    \ POSTROUTING (policy ACCEPT)\n  target      prot opt source               destination\n\
    Chain OUTPUT (policy ACCEPT)\n  target      prot opt source               destination\n\
    [root@RHEL5 ~]#\n```"
  - '[PAGE 100]


    # 11.6.2. SNAT (Source NAT)


    The goal of snat is to change the source address inside a packet before it leaves
    the system (e.g. to the internet). The destination will return the packet to the
    NAT-device. This means our NAT-device will need to keep a table in memory of all
    the packets changed, so it can deliver the packet to the original source (e.g.
    in the private network).


    Because SNAT is about packets leaving the system, the POSTROUTING chain.


    Here is an SNAT rule. The rule says that packets coming from 10.1.1.0/24 network
    and exiting eth1 will get the source ip-address set to 11.12.13.14.(Note that
    this is a line command);


    ```

    iptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j SNAT \\n--to-source 11.12.13.14

    ```


    Of course there must exist a proper iptables filter setup to allow the packet
    to traverse from one network to the other.


    # 11.6.3. SNAT example setup


    This example uses a typical nat setup. The internal (eth0) network has access
    via external (eth1) webservers (port 80).


    ```

    #!/bin/bash

    # iptables script for simple classic nat webserving

    # eth0 is internal network, eth1 is internet

    #necho 0 > /proc/sys/net/ipv4/ip_forward

    iptables -P INPUT ACCEPT

    iptables -P OUTPUT ACCEPT

    iptables -P FORWARD DROP

    iptables -A FORWARD -i eth0 -o eth1 -s 10.1.1.0/24 -p tcp \\

    --dport 80 -j ACCEPT

    iptables -A FORWARD -i eth1 -o eth0 -d 10.1.1.0/24 -p tcp \\

    --dport 80 -j ACCEPT

    iptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j SNAT \\

    --to-source 11.12.13.14

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
  - '[PAGE 101]


    # 11.6.4. IP masquerading


    IP masquerading is very similar to SNAT, but is meant for dynamic interfaces.
    Typical example is broadband ''router/modems'' connected to the internet and receiving
    a different ip-address from the isp, each time they are cold-booted.


    The only change needed to convert the SNAT script to a masquerading is one line.


    ```

    iptables -t nat -A POSTROUTING -o eth1 -s 10.1.1.0/24 -j MASQUERADE

    ```


    # 11.6.5. DNAT (Destination NAT)


    DNAT is typically used to allow packets from the internet to be redirected to
    an internal server (in your DMZ) and in a private address range that is inaccessible
    directly form the internet.


    This example script allows internet users to reach your internal (192.168.1.99)
    server via ssh (port 22).


    ```

    #!/bin/bash

    # iptables script for DNAT

    # eth0 is internal network, eth1 is internet

    # echo 0 > /proc/sys/net/ipv4/ip_forward

    iptables -P INPUT ACCEPT

    iptables -P OUTPUT ACCEPT

    iptables -P FORWARD DROP

    iptables -A FORWARD -i eth0 -o eth1 -s 10.1.1.0/24 -j ACCEPT

    iptables -A FORWARD -i eth1 -o eth0 -p tcp --dport 22 -j ACCEPT

    iptables -t nat -A PRERUTING -i eth1 -p tcp --dport 22 \

    -j DNAT --to-destination 10.1.1.99

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
