    \n如你所见，`passwd` 工具将使用一些基础验证来防止用户使用过于简单的密码。root 用户不需要遵循这些规则（尽管会收到警告）。root 用户在输入新密码之前不需要提供旧密码。\n\
    \n```\nroot@debian:-# passwd tania\nEnter new UNIX password:\nRetype new UNIX\
