    # ## 9.3. hard links


    # ### 9.3.1. creating hard links


    When we create a hard link to a file with ln, an extra entry is added in the directory.
    A new file is mapped to an existing index.


    ```

    paul@RHELv4:~/test$ ln file2 hardlink_to_file2

    p@RHELv4:~/test$ ln -li

    total 24

    817266 -rw-r-- 1 paul 0 Feb 5 15:53 file1

    817270 -rw-r-- 2 paul 92 Feb 5 15:42 file2

    817266 -rw-r-- 1 paul 0 Feb 5 15:38 file3

    817270 -rw-r-- 2 paul 92 Feb 5 15:42 hardlink_to_file2

    ```


    Both files have the same inode, so they will have the same permissions and the
    same owner. Both files will have the same content. Actually, both files are equal
    now, meaning you can safely remove the original file, the hardlinked file will
    remain. The inode contains a counter, counting the number of hard links to itself.
    When the counter drops to zero, then the inode is emptied.


    # ### 9.3.2. finding hard links


    You can use the find command to look for files with a certain inode. The screenshot
    below shows how to search for all filenames that point to inode 817270. Remember
    that an inode number is unique to its partition.


    ```

    paul@RHELv4:~/test$ find -inum 817270 2> /dev/null

    /home/paul/test/file2

    /home/paul/test/hardlink_to_file2

    ```'
