    # # user management


    User management on Linux is done in three complementary ways. You can use the
    graphical tools provided by your distribution. These tools have a look and feel
    that depends on the distribution. If you are a novice Linux user on your home
    system, then use the graphical tool that provided by your distribution. This will
    make sure that you do not run into problems.


    Another option is to use command line tools like useradd, usermod, gpasswd, passwd
    and others. Server administrators are likely to use these tools, since they are
    familiar and similar across many different distributions. This chapter will focus
    on these command line tools.


    A third rather extremist way is to edit the local configuration files directly
    using vi (or vipw/vim). Do not attempt this as a novice on production systems!


    # # 2. /etc/passwd


    The local database (Linux and on Unix systems) is /etc/passwd.


    ```

    [root@RHEL5 ~]$# tail /etc/passwd

    ing:518:524:art dealer:/home/inge:/bin/bash

    ann:519:525:flux player:/home/ann:/bin/bash

    derick:520:526:rubius:/home/frederik:/bin/bash

    steven:521:527:roman peter:/home/steven:/bin/bash

    pascale:522:528:artist:/home/pascale:/bin/bash

    geert:524:530:kernel developer:/home/geert:/bin/bash

    win:525:531:master daemon:/home/win:/bin/bash

    sandra:526:532:radish stresser:/home/sandra:/bin/bash

    annelies:527:533:sword fighter:/home/annelies:/bin/bash

    laura:528:534:art dealer:/home/laura:/bin/bash

    ```


    As you can see, this file contains columns separated by a colon. The columns contain
    the username, an x, the user id, the primary group id, a description, the name
    of the home directory, and the login.


    More information can be found by typing man 5 passwd.


    ```

    [root@RHEL5 ~]$# man 5 passwd

    ```


    # # 2.3. root


    The root user is also the superuser is the most powerful account on your Linux
    system. This user can do almost anything, including the creation of other users.
    The root user always has userid 0 (regardless of the name of the account).


    ```

    [root@RHEL5 ~]$# head -1 /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    ```'
