    paul@laika:~/perms$ chmod +w permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwx-rw-w 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    This example gives all of them write permission.


    You don''t even have to type the a.


    ```

    paul@laika:~/perms$ chmod +x permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwx-wx-x 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    You can also set permissions.


    ```

    paul@laika:~/perms$ chmod u+rw permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-rw-r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    Feel free to make any kind of combination.


    ```

    paul@laika:~/perms$ chmod u+rw,go=r permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-rw-r-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```


    Even fishy combinations are accepted by chmod.


    ```

    paul@laika:~/perms$ chmod u+rw,ug+rw,o=r permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwxr-xr-- 1 paul paul 2007-02-07 22:34 permissions.txt

    ```'
- md: '

    ## 6.3.5. setting octal permissions


    Most Unix administrators will use the old school octal system to talk about and
    set permissions. Look at the tripletwise, equating r to 4, w to 2, and x to 1.


    | binary | octal | permission |

    | --- | --- | --- |

    | 000 | 0 | --- |

    | 001 | 1 | --x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | rw- |

    | 111 | 7 | rwx |


    This makes 777 equal to rwxrxrwx and by the same logic, 654 mean rw-r--x--. The
    chmod command will accept these notes.


    ```

    paul@laika:/perms$ chmod 777 permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rw-xr-x 1 paul 0 2007-02-07 22:34 permissions.txt

    paul@laika:/perms$ chmod 664 permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rw-r-- 1 paul 0 2007-02-07 22:34 permissions.txt

    paul@laika:/perms$ chmod 750 permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwxr-x-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    ## 6.3.6. umask


    When creating a file or directory, a set of default permissions are applied. These
    default permissions are determined by the **umask**. The umask specifies permissions
    that you do not want set on default. You can display the umask with the umask
    command.


    ```

    [Harry@RHEL4b ~]$ umask

    0002

    [Harry@RHEL4b ~]$ touch test

    [Harry@RHEL4b ~]$ ls -l test

    -rw-rw--r-- 3 Harry 0 Jul 24 06:03 test

    [Harry@RHEL4b ~]$

    ```


    As you can also see, the file is not executable by default. This is a general
    security feature among Unix: newly created files are never executable by default.
    You have to explicitly do `chmod +x` to make a file executable. This also means
    that the 1 bit in the **umask** has no meaning--a umask of 0022 is the same as
    0033.


    ## 6.3.7. mkdir -m


    When creating directories with **mkdir** you can use the **-m** option to set
    the **mode**. This screenshot explains.


    ```

    paul@debian5-$ mkdir -m 700 MyDir

    paul@debian5-$ mkdir -m 777 Public/

    paul@debian5-$ ls -ld MyDir/ Public/

    dr-xr-x-- 1 paul 4096 2011-10-16 19:16 MyDir/

    dr-rwxr-wx 2 paul 4096 2011-10-16 19:16 Public/

    ```


    ## 6.3.8. cp -p


    To preserve permissions and timestamps from source file, use **cp -p**.


    ```

    paul@laika:~/perms$ cp file* cp

    paul@laika:~/perms$ cp -p file* cpp

    -rw-r--r-- 1 paul 0 2008-08-25 13:26 file33

    -rwxr-x-- 1 paul 0 2008-08-25 13:26 file42


    cp:

    total 0

    -rw-r--r-- 1 paul 0 2008-08-25 13:34 file33

    -rwxr-x-- 1 paul 0 2008-08-25 13:34 file42


    cpp:

    total 0

    -rw-r--r-- 1 paul 0 2008-08-25 13:26 file33

    -rwxr-x-- 1 paul 0 2008-08-25 13:26 file42

    ```


    ## 6.4. practice: standard file permissions


    - 1. As normal user, create a directory ~/permissions. Create a file owned by
    yourself in there.

    - 2. Copy a file owned by root /etc/ to your permissions dir, who owns this file
    now ?

    - 3. As root, create a file in the users ~/permissions directory.

    - 4. As normal user, look at who owns this file created by root.

    - 5. Change the ownership of all files in ~/permissions to yourself.

    - 6. Make sure you have all rights to these files, and others can only read.

    - 7. With chmod, is 770 the same as rwxrwx--- ?

    - 8. With chmod, is 664 the same as r-xr-xr-- ?

    - 9. With chmod, is 400 the same as r------- ?

    - 10. With chmod, is 734 the same as rwx-xr-- ?

    - 11a. Display the umask in octal and in symbolic format to set it.

    - 11b. Set the umask to 077, but use the symbolic format to set it. Verify this
    works.

    - 12. Create a file as root, give only read to others. Can a normal user read
    this file ? Test writing to this file with vi.

    - 13a. Create a file as normal user, give only read to others. Can another normal
    user read this file ? Test writing to this file with vi.

    - 13b. Can root read this file ? Can root write to this file with vi ?

    - 14. Create a directory that belongs to a group, where every member of that group
    can read and write to files, and create files. Make sure that people only delete
    their own files.


    ## 6.5. solution: standard file permissions


    - 1. As normal user, create a directory ~/permissions. Create a file owned by
    yourself in there. mkdir ~/permissions ; touch ~/permissions/myfile.txt

    - 2. Copy a file owned by root from /etc/ to your permissions dir, who owns this
    file now? cp /etc/* ~/permissions/ The copy is owned by you.

    - 3. Create a file in the users ~/permissions directory. (become root)$ touch
    /home/permissions/root

    - 4. As normal user, look at who owns this file created by root. ls -l ~/permissions
    The file created by root is owned by root.

    - 5. Change the ownership of all files in ~/permissions to yourself. chown user
    ~/permissions/* You cannot become owner of the file that belongs to root.

    - 6. Make sure you have all rights to these files, and others can only read. chmod
    644 (on files) chmod 755 (on directories)

    - 7. With chmod, 770 is the same as rwx--- ?

    - 8. With chmod, 664 is the same as r-xr-xr-- ?

    - 9. With chmod, 400 is the same as r------- ?

    - 10. With chmod, 734 is the same as rwxr-xr-- ?

    - 11a. Display the umask in octal and symbolic format.

    - 11b. Set the umask to 077, but use the symbolic format to set it. Verify this
    works. umask -S u=rwx,go=

    - 12. Create a file as root, give only read to others. Can a normal user read
    this file ? Writing to this file with vi. (become root) echo hello > /home/username/root.txt
    chmod 744 /home/username/root.txt (become user) vi ~/root.txt

    - 13a. Create a file as normal user, give only read to others. Can another normal
    user read this file ? Test writing to this file with vi. echo hello > file ; chmod
    744 file Yes, others can read this file

    - 13b. Can root read this file ? Can root write to this file with vi ? Yes, root
    can read and write to this file. Permissions do not apply to root.

    - 14. Create a directory that belongs to a group, where every member of that group
    can read and write to files, and create files. Make sure that people only delete
    their own files. mkdir /home/project42 ; groupadd project42 chgrp project42 /home/project42
    ; chmod 775 /home/project42 You can not yet do the last part of this exercise...


    ## Chapter 7. advanced file permissions


    ## 7.1. sticky bit on directory


    You can set the sticky bit on a directory to prevent users from removing files
    that they do not own as a user owner. The sticky bit is displayed at the same
    location as the x permission is represented by a t (meaning x is also there) or
    a T (when there is no x for others).


    ```

    root@RHELua4:~# mkdir /project55

    root@RHELua4:~# ls -ld /project55

    drwxr-xr-x 2 root root 4096 Feb 7 17:38 /project55

    root@RHELua4:~# chmod +t /project55/

    root@RHELua4:~# ls -ld /project55

    drwxrxr-t 2 root root 4096 Feb 7 17:38 /project55

    root@RHELua4:~#

    ```


    The sticky bit can also be set with octal permissions, it is binary 1 in the first
    of triplets.


    ```

    root@RHELua4:~# chmod 1775 /project55/

    root@RHELua4:~# ls -ld /project55

    drwxr-xr-t 2 root root 4096 Feb 7 17:38 /project55

    root@RHELua4:~#

    ```


    You will typically find the sticky bit in the /tmp directory.


    ```

    root@barry1:~# ls -ld /tmp

    drwxrwxrwt 6 root root 4096 2009-06-04 19:02 /tmp

    ```


    ## 7.2. setgid bit on directory


    setgid can be used on directories to make sure that all files inside the directory
    are owned by the group owner of the directory. The setgid bit is displayed at
    the same location as the x permission for group owner. The setgid bit is represented
    by an s (meaning x is also there) or a S (when there is no x for the group owner).
    As this example, when root does not belong to the group proj55, the files created
    by root in /project55 will belong to proj55.


    ```

    root@RHELua4:~# groupadd proj55

    root@RHELua4:~# chown root:project55 /project55/

    root@RHELua4:~# chmod 2775 /project55/

    root@RHELua4:~# touch /project55/fromroot.txt

    root@RHELua4:~# ls -ld /project55/

    drwsr-s 2 root proj55 4096 Feb 7 17:45 /project55/

    root@RHELua4:~# ls -l /project55/

    total 4

    -rw-r--r-- 1 root proj55 0 Feb 7 17:45 fromroot.txt

    root@RHELua4:~#

    ```


    You can use the find command to find all setgid directories.


    ```

    paul@laika:~$ find / -type d -perm -2000 2>/dev/null

    /var/log/mysql

    /var/log/news

    /var/local

    ```

