    [root@RHEL4 ~]#\n```\n\n## 3.4. encryption with openssl\n\n创建带密码用户的另一种方法是使用 `useradd`\
    \ 的 `-p` 选项，但该选项需要加密密码。你可以使用 `openssl password` 生成此加密密码。\n\n`openssl passwd` 命令会对同一个密码生成多个不同的哈希值，为此它使用了盐（salt）。\n\
    \n```\npaul@rhel65:-$ openssl passwd hunter 2\n86cjUN1GDfPY\npaul@rhel65:-$ openssl\
    \ passwd hunter 2\nYjF3mGoDbvG\npaul@rhel65:-$ openssl passwd hunter 2\nYqDcJceGoDbzKA\n\
    paul@rhel65:-$\n```\n\n这个盐是可以选择的，并显示为哈希值的前两个字符。\n\n此示例展示了如何创建一个带密码的用户。\n\n```\n\
    root@rhel65:-# useradd -m -p $(openssl passwd hunter 2) mohamed\n```\n\n## 3.5.\
    \ encryption with crypt\n\n第三种选择是使用 `crypt` 函数编写自己的 C 语言程序，并将其编译为命令。\n\n```\n\
    paul@rhel65:$ cat MyCrypt.c\n#include <stdio.h>\n#define _DEFAULT_SOURCE\n#include\
    \ <unistd.h>\n\nint main(int argc, char **argv) {\n    if(argc==3) {\n       \
    \ printf(\"%s\\n\", crypt(argv[1],argv[2]));\n    } else {\n        printf(\"\
    Usage: MyCrypt password $salt\\n\");\n    }\n    return 0;\n}\n```\n\n这个小程序可以用\
    \ `gcc -o MyCrypt` 编译。\n\n```\npaul@rhel65:$ gcc MyCrypt.c -o MyCrypt -lc\n```\n\
    \n要使用它，我们为 `MyCrypt` 提供两个参数。第一个是未加密的密码，第二个是盐。盐用于扰动 4096 种加密算法。这种变化防止了具有相同密码的用户在\
    \ `/etc/shadow` 中具有相同的条目。\n\n```\npaul@rhel65:$ ./MyCrypt hunter2 42\n$42...\n\
    ```\n（注：此处对应原文输出示例）\n\n你注意到盐了吗？`crypt` 函数的标准输出是 DES 算法，很容易被破解。更好的方法是使用 md5 密码，它可以由\
    \ `$` 开头的盐来识别。\n\n```\npaul@rhel65:$ ./MyCrypt hunter2 '$14'\n$14...\npaul@rhel65:$\
    \ ./MyCrypt hunter2 '$62'\n$62...\n```\n\n`md5` 盐可以长达 8 个字符。盐显示在 `/etc/shadow`\
    \ 中第二个和第三个 `$` 之间，所以不要使用密码作为盐！\n\n```\npaul@rhel65:$ ./MyCrypt hunter2 '$hunter2'\n\
    $hunter2...\n```\n\n## 3.6 /etc/login.defs\n\n`/etc/login.defs` 文件包含一些用户密码的默认设置，如密码有效期（你还会发现用户\
    \ ID 和组 ID 的限制以及是否创建家目录）。\n\n```\nroot@rhel65:~# grep /etc/login.defs\nPASS_MAX_DAYS\
    \      99999\nPASS_MIN_DAYS      0\nPASS_MIN_LEN       5\nPASS_WARN_AGE      7\n\
    ```\n\nDebian 也有：\n\n```\nroot@debian7:~# grep /etc/login.defs\n# PASS_MAX_DAYS\
    \      密码可以使用的天数。\n# PASS_MIN_DAYS      更改之间的最小天数。\n# PASS_WARN_AGE      密码过期前的天数。\n\
    PASS_MAX_DAYS      99999\nPASS_MIN_DAYS      0\nPASS_WARN_AGE      7\n# PASS_CHANGE_TRIES\n\
    # PASS_ALWAYS_WARN\n# PASS_MIN_LEN\n# PASS_MAX_LEN\n# NO_PASSWORD_CONSOLE\n```\n\
    \n## 3.7. charge\n\n`change` 命令可设置用户账户的过期日期 (-E)、设置最小 (-m) 和最大 (-M) 密码有效期、密码过期日期以及密码过期前的警告天数。许多功能也可以通过\
    \ `passwd` 命令实现。`charge` 的 `-l` 选项会列出用户的这些设置。\n\n```\nroot@rhel65:~# charge -l\
    \ paul\nLast password change               : Mar 27, 2014\nPassword expires  \
    \                 : never\nPassword inactive                  : never\nAccount\
    \ expires                    : never\nMinimum number of days between password\
    \ change : 0\nMaximum number of days between password change : 99999\nNumber of\
    \ days of warning before password expires : 7\nroot@rhel65:~#\n```\n\n## 3.8.\
    \ disabling a password\n\n`/etc/shadow` 中的密码不能以叹号开头。当 `/etc/passwd` 中的第二个字段以叹号开头时，该密码无法使用。\n\
    \n此功能通常被称为锁定、禁用或暂停用户账户。除了 `vi`（或 `vip`），你还可以使用 `usermod` 完成此。\n\n下一张截图中的第一个命令将显示\
    \ Laura 的密码字段。下一个命令将禁用 Laura 的密码，使 Laura 无法使用该密码进行验证。\n\n```\nroot@debian:-# grep\
    \ laura /etc/shadow | cut -c1-70\nlaura:$64J2gp$stwWAc30tEI2R2au7j.nbW.dpKNUVK7mChFCVMaDUJV\n\
    root@debian:-# usermod -L laura\n```\n\n如你所见，密码哈值前面仅有一个叹号。\n\n```\nroot@debian:-#\
    \ grep laura /etc/shadow | cut -c1-70\nlaura:$66JYJ2gp$stwWAc30tEI2R2au7j.nbW.dpKNUVK7mChFCVMaDUJV\n\
    root@debian:-#\n```\n\n用户（以及拥有 sudo 权限的用户）仍然能够 su 进入 Laura 账户（因为这里没有设置密码！）。注意，如果\
    \ Laura 设置了 SSH 密码，她仍然能够登录！\n\n```\nroot@debian:-# su - laura\nlaura@debian:-$\n\
    ```\n\n你可以用 `usermod -U` 再次解锁账户。\n\n```\nroot@debian:-# usermod -U laura\nroot@debian:-#\
    \ grep laura /etc/shadow | cut -c1-70\nlaura:$64J2gp$stwWAc30tEI2R2au7j.nbW.dpKNUVK7mChFCVMaDUJV\n\
    ```\n\n## 3.9. editing local files\n\n如果你想手动编辑 `/etc/passwd` 或 `/etc/shadow`，在了解这些密码管理命令后，请使用\
    \ `vip` 而不是直接使用 `vi(m)`。`vip` 工具会对文件进行正确的锁定。\n\n```\n[root@RHEL5 ~]# vip /etc/passwd\n\
    vip: the password file is busy (/etc/ptmp present)\n```\n\n"
