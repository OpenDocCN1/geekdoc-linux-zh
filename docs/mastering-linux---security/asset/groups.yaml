    ## 12.16. security context


    The combination of identity, role and domain or type make the selinux security
    context. The **id** will show you the security context in the form identity:role:domain.


    ```

    paul@RHEL5 ~$ id | cut -d'' '' -f4

    context=user_u:system_r:unconfined_t

    ```


    The **ls -Z** command shows the security context for a file in the form identity:role:type.


    ```

    paul@RHEL5 ~$ ls -Z test

    --rw-r--r-- paul paul user_uobject_r:user_home_t test

    ```


    The init process runs in domain init_t.


    ```

    root@RHEL5 ~# ps -ZC

    LABEL PID TTY CMD

    system_u:system_r:init_t 1 00:00 init

    ```


    The /proc/1 directory identifies the init process and has type init_t.


    ```

    root@RHEL5 ~# ls -Zd /proc/1/

    dr-xr-xr-x root system_u:system_r:init_t /proc/1/

    ```


    It is not a coincidence that the domain of the init process and the type of /proc/1
    are both init_t. Don''t try to use chown /proc/. It will not work.


    ## 12.17. transition


    An selinux transition (aka selinux labelling) determines the security context
    that will be assigned. Transition of process domains is used when you execute
    a process. Transition of file type happens when you create a file. An example
    of file transition.


    ```

    pol@centos65 ~$ touch /tmp/test

    pol@centos65 ~$ ls -Z test

    --rw-r--r-- unconfined_u:object_r:user_home_t:s0 test

    pol@centos65 ~$ ls -Z /tmp/test

    --rw-r--r-- unconfined_u:object_r:user_home_t:s0 /tmp/test

    ```


    ## 12.18. extended attributes


    Extended attributes are used by selinux to store security contexts. These attributes
    can be viewed by ls when selinux is running.


    ```

    root@RHEL5 home]# ls --context

    drwx------ paul system_u:object_r:user_home_dir_t:s0 home

    drwx-xr-x root system_u:object_r:user_home_dir_t:s0 project42

    drwx-xr-x root system_u:object_r:user_home_dir_t:s0 project55

    root@RHEL5 home]# ls -d

    drwx------ paul system_u:object_r:user_home_dir_t:s0 home

    drwx-xr-x root system_u:object_r:user_home_dir_t:s0 project42

    drwx-xr-x root system_u:object_r:user_home_dir_t:s0 project55

    root@RHEL5 home]#

    ```


    When selinux is not running, getattr is the tool to use.


    ```

    root@RHEL5 etc]# getattr -m -d hosts

    file: hosts security.selinux="system_u:object_r:etc_t:s0"

    ```


    ## 12.19. process security context


    A option is added to ps to see the security context of processes.


    ```

    root@RHEL5 etc]# ps -Z

    LABEL PID TTY TIME CMD

    system_u:system_r:getty_t 2941 tty1 00:00:00 getty

    system_u:system_r:getty_t 2942 tty2 00:00:00 getty

    ```


    ## 12.20. chown


    Use chown to change the selinux context. This example shows how to use chown to
    change the type of a file.


    ```

    root@RHEL55]# ls -z /var/www/html/test42.txt

    -rw-r--r-- root user_u:object_r:httpd_sys_content_t /var/www/html/test4.txt

    root@RHEL55]# chown -t samba_share_t /var/www/html/test42.txt

    root@RHEL55]# ls -z /var/www/html/test42.txt

    -rw-r--r-- root user_u:object_r:samba_share_t /var/www/html/test42.txt

    ```


    Be sure to read man chown.


    ## 12.21. an example


    The Apache2 webserver by default targeted with SELinux. The next screenshot shows
    any file created in /var/www/html will by default the httpd_sys_content_t type.


    ```

    [root@centos65 ~]# touch /var/www/html/test42.txt

    [root@centos65 ~]# ls -Z /var/www/html/test42.txt

    -rw-r--r-- root root unconfined_u:object_r:httpd_sys_content_t:s0 /var/www/html/test42.txt

    ```


    Files created elsewhere do not get this.


    ```

    [root@centos65 ~]# touch /root/test42.txt

    [root@centos65 ~]# ls -Z /root/test42.txt

    -rw-r--r-- root root unconfined_u:object_r:admin_home_t:s0 /root/test42.txt

    ```


    Make sure Apache2 runs.


    ```

    [root@centos65 ~]# service httpd restart

    Stopping httpd: [ OK ]

    Starting httpd: [ OK ]

    ```


    Will this work? Yes it does.


    ```

    [root@centos65 ~]# wget http://localhost/test42.txt

    --2014-04-12 20:56:47- http://localhost/test42.txt

    Resolving localhost... Connected to 127.0.0.1...

    GET /test42.txt HTTP/1.1

    200 OK

    ```


    Why does this work? Because Apache2 runs in its own domain.


    ```

    [root@centos65 ~]# ps -Z

    LABEL PID TTY TIME CMD

    system_u:system_r:getty_t 2941 tty1 00:00:00 getty

    system_u:system_r:getty_t 2942 tty2 00:00:00 getty

    ```


    There are two possibilities: either it works or it fails. selinux is in permissive
    mode, that works when selinux is enforcing.

