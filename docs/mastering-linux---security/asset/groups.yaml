    # 12.9. DAC or MAC


    Standard Unix permissions use Discretionary Access Control to set permissions
    on files. This means that a user owns a file, can make it world readable by typing
    chmod 777 $file.


    With selinux the kernel will enforce Mandatory Access Control which strictly controls
    what processes or threads can do with files (superseding DAC). Processes are confined
    by the kernel to the minimum access they require.


    SELinux MAC is about labeling and type enforcing! Files, processes, etc are all
    labeled with an SELinux context. For files, these are extended attributes, and
    for processes this is managed by the kernel.


    The format of the labels is as follows:


    ```

    user:role:type:(level)

    ```


    We use only the type label in the targeted policy.


    # 12.10. Is -Z


    To see the DAC permissions on a file, use ls -l to display user and group owner
    – permissions.


    For MAC permissions there is new -Z option added to ls. The output shows that
    file in /root have a XXtype of admin_home_t.


    ```

    [root@centos65 ~]# ls -Z

    -rw------- root root system_u:object_radmin_home_t:s0 anaconda-ks.cfg

    -rw-r--r-- root root system_u:object_radmin_home_t:s0 install.log

    -rw-r--r-- root root system_u:object_radmin_home_t:s0 install.log.syslog

    [root@centos65 ~]# useradd -m s /bin/bash pol

    [root@centos65 ~]# ls -Z /home/pol/.bashrc

    -rw-r--r-- unconfined_u:object_user_home_t:s0 /home/pol/.bashrc

    ```


    # 12.11. -Z


    There are also some other tools with the -Z switch:


    ```

    mkdir -Z

    cp -Z

    ps -Z

    netstat -Z

    ...

    ```'
