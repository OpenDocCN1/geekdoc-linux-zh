    # 8.4. remove an acl entry


    The **-x** option of the setfac command will remove an **acl** entry from the
    targeted file.


    ```

    paul@laika:~/test$ setfac -m u:sandra:7 file33

    paul@laika:~/test$ getfac file33 | grep sandra

    user:rwx

    paul@laika:~/test$ setfac -x sandra file33

    paul@laika:~/test$ getfac file33 | grep sandra

    ```


    Note omitting the **u** or **g** when defining the **acl** for an account will
    default it to a user account.


    # 8.5. remove the complete acl


    The **-b** option of the setfac command will remove the acl from the targeted
    file.


    ```

    paul@laika:~/test$ setfac -b file33

    paul@laika:~/test$ getfac file33

    # file:file33

    # owner: paul

    # group: paul

    user:rw-

    group:r--

    other:r--

    ```


    # 8.6. the acl mask


    The **acl** defines the maximum effective permissions for any entry in the acl.
    This **mask** is calculated every time you execute the **setfac** or **chmod**
    commands.


    You can prevent the calculation by using the **--no-mask** switch.


    ```

    paullaika:~/test$ setfac --no-mask -m u:sandra:7 file33

    paul@laika:~/test$ getfac file33

    # file:file33

    # owner: paul

    # group: paul

    user:rw-

    user:sandra:rwx #effective:rw-

    group:r--

    mask:rw--

    other:r--

    ```'
