    # # Chapter 4. user profiles


    Logged on users have a number of preset (and customized) aliases, variables, and
    functions, but where do they come from ? The **shell** uses a number of startup
    files that are executed (or rather **sourced**) whenever the shell is invoked.
    What follows is an overview of startup scripts.'
  - "[PAGE 35]\n\n# 1. system profile\n\nBoth the **bash** and the **ksh** shell will\
    \ verify the existence of `/etc/profile` and **source** if it exists.\n\nWhen\
    \ reading this script, you will notice (both on Debian and on Red Hat Enterprise\
    \ Linux) that it builds the PATH environment variable (among others). The script\
    \ might also change the PS1 variable, set the HOSTNAME and execute more scripts\
    \ like /etc/inputrc\n\nThis screenshot uses grep to show PATH manipulation in\
    \ `/etc/profile` on Debian.\n\n```\nroot@debian7:~# grep PATH /etc/profile\nPATH=$/usr/local/bin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:/sbin:/bin\"\
    \nPATH=$/usr/local/bin:/usr/bin:bin:/usr/local/games:/usr/games\"\nexport PATH\n\
    root@debian7:~#\n```\n\nThis screenshot uses grep to show PATH manipulation in\
    \ `/etc/profile` on RHEL/CentOS 7.\n\n```\n[root@centos7 ~#] grep PATH /etc/profile\n\
    case ${PATH} in\n  PATH=$1\n  PATH=$1:$PATH\nexport PATH USER LOGNAME MAIL HOSTNAME\
    \ HSIZE HISTORY\n[root@centos7 ~]#\n```\n\nThe **root user** can use this script\
    \ to set aliases, functions, and variables for every user on the system.\n\n#\
    \ 4.2. ~/.bash_profile\n\nWhen this file exists in the home directory, then **bash**\
    \ will source it. On Debian Linux 5/6/7 this file does not exist by default.\n\
    \nRHEL/CentOS uses a small ~/.bash_profile where it checks for the existence of\
    \ ~/.bashrc and then sources it. It adds $HOME to the $PATH variable.\n\n```\n\
    [root@rhel7 ~#] cat /home/paul/.bash_profile\n# .bash_profile\n\n# Get the aliases\
    \ and functions\nif [ -f ~/.bashrc ]; then\n  ~/.bashrc\nfi\n\n# User specific\
    \ environment and startup programs\n\nPATH=$PATH:$HOME/.local/bin:/bin\n\nexport\
    \ PATH\n[root@rhel7 ~]#\n```"
  - "[PAGE 36]\n\n# 4.3. ~/.bash_login\n\nWhen .bash_profile does not exist, then\
    \ bash will check for ~/.bash_login and source it.\n\nNeither Debian Red Hat have\
    \ this file by default.\n\n# 4.4. ~/.profile\n\nWhen neither ~/.bash_profile and\
    \ ~/.bash_login exist, then bash will verify the existence of ~/.profile and execute\
    \ it. This file does not exist by default by Red Hat.\n\nOn Debian this script\
    \ can execute ~/.bashrc and add $HOME/bin to the PATH variable.\n\n```\nroot@debian7:~#\
    \ tail -11 /home/paul/.profile\nif [ -n \"$BASH_VERSION\" ]; then\n    include\
    \ .bashrc if it exists\n    if [ -f \"$HOME/.bashrc\" ]; then\n        \"$HOME/.bashrc\"\
    \n    fi\nfi\n```\n\n```\n# set PATH so it includes your private bin path if it\
    \ exists\nif [ -d \"$HOME/bin\" ]; then\n    PATH=$HOME/bin:$PATH\nfi\n```\n\n\
    RHEL/CentOS does not have this file by default.\n\n# 4.5. ~/.bashrc\n\nThe ~/.bashrc\
    \ script is often sourced by other scripts. Let us take a look at what it does\
    \ by default.\n\nRed Hat has a very simple ~/.bashrc, checking for /etc/bashrc\
    \ and sourcing it. It also leaves room for custom aliases and functions.\n\n```\n\
    [root@hel7 ~]# cat /home/paul/.bashrc\n# .bashrc\n\n# Source global definitions\n\
    if [ -f /etc/bashrc ]; then\n    /etc/bashrc\nfi\n\n# Uncomment the following\
    \ line if you don't like systemctl's auto-paging feature:\n# export SYSTEMD_PAGER=\n\
    \n# User specific aliases and functions\n```\n\nOn Debian this script is a bit\
    \ longer and configures $PS1, some history variables and a number of active and\
    \ inactive aliases.\n\n```\nroot@debian7:~# wc -l /home/paul/.bashrc\n110 /home/paul/.bashrc\n\
    ```"
  - "[PAGE 37]\n\n# 4.6. ~/.bash_logout\n\nWhen exiting bash, it can execute ~/.bash_logout.\n\
    \nDebian use this opportunity to clear the console screen.\n\n```\nserena@deb503:~$\
    \ cat .bash_logout\n# ~/.bash_logout: executed by bash(1) when login shell exits.\n\
    # when leaving the console clear the screen to increase privacy\n\nif [ \"$SHLV\"\
    \ = 1 ]; then\n  [ -x /usr/bin/clear_console ] && /usr/bin/clear_console -q\n\
    fi\n```\n\nRed Enterprise Linux 5 will simply call the /usr/bin/clear command\
    \ in this script.\n\n```\nserena@rhel53 ~$ cat .bash_logout\n# ~/.bash_logout\n\
    /usr/bin/clear\n```\n\nRed Hat Enterprise Linux 6 and 7 create this file, but\
    \ leave it empty (except for a comment).\n\n```\npaul@rhel65:~$ cat .bash_logout\n\
    # ~/.bash_logout\n```"
