    -rwxr-xr-x root root root system_u:object_r:usradd_t:s0 userdel

    -rwx------ root root root system_u:object_r:usradd_exec_t:s0 userdel

    -rwx------ root root root system_u:object_r:usadd_exec_t:s0 usermod

    ```


