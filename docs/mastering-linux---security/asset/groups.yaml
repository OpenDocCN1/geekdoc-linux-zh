    \ see whether the password of user serena is locked or unlocked ? Give a solution\
    \ with grep and a solution with passwd.\n\n```\ngrep serena /etc/shadow\npasswd\
    \ -S serena\n```\n\n## Chapter 4. user profiles\n\nLogged on users have a number\
