    root@laika:-#\n```\n\n第一个字段是组名。第二个字段是组的（加密）密码（可以为空）。第三个字段是组标识或 GID。第四个字段是成员列表，这些组没有成员。\n\
    \n## 5.3. groups\n\n用户可以输入 `groups` 命令来查看用户所属的组列表。\n\n```\n[harry@RHEL4b ~]$ groups\n\
