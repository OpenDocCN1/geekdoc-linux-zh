    formal:x:1009:annelies\nsalsa:x:1010:katrien\nroot@laika:~#\n```\n\n使用 **usermod**\
    \ 将用户添加到组时要小心。默认情况下，如果命令中没有列出某个组，usermod 命令**将把**该用户从其所属的每个组中移除！使用 **-a (append)**\
