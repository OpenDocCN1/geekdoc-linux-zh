    ## 9.1.4. inode and file contents


    Let''s put some data in one of the files.


    ```

    paul@RHELv4u:~/test$ ls -li

    total 16

    817262 -drwxr-xr-x 1 paul 4096 Feb 15:38 ..

    817270 -rw-rw-r-- 1 paul 4096 Feb 15:42 file2

    817268 -rw-rw-r-- 1 paul 0 Feb 15:38 file3

    paul@RHELv4u:~/test$ cat file2

    ```


    It is winter now and it is very cold.

    We do not like the cold, we prefer hot summer nights.

    paul@RHELv4u:~/test$

    ```


    The data that is displayed by the cat command is not in the inode, but somewhere
    else on the disk. The inode contains a pointer to that data.


    ## 9.2. about directories


    ### 9.2.1. a directory is a table


    A directory is a special kind of file that contains a table which maps filenames
    to inodes.

    Listing our current directory with ls -ali will display the contents of the directory
    file.


    ```

    paul@RHELv4u:~/test$ ls -ali

    total 32

    817262 drwxr-xr-x 2 paul 4096 Feb 15:42 ..

    800768 -rw-rw-r-- 1 paul 4096 Feb 15:42 .

    817266 -rw-rw-r-- 1 paul 0 Feb 15:38 file1

    817270 -rw-rw-r-- 1 paul 92 Feb 15:42 file2

    817268 -rw-rw-r-- 1 paul 0 Feb 15:38 file3

    paul@RHELv4u:~/test$

    ```


    ### 9.2.2. . and ..


    You can see five names, and the mapping to their five inodes. The . is a mapping
    to itself, and the dotdot .. is a mapping to the parent directory. The three other
    names are mappings to different inodes.


    ## 9.3. hard links


    ### 9.3.1. creating hard links


    When we create a hard link to a file with ln, an extra entry is added in the directory.
    A new file is mapped to an existing index.


    ```

    paul@RHELv4:~/test$ ln file2 hardlink_to_file2

    paul@RHELv4:~/test$ ln -li

    total 24

    817266 -rw-r-- 1 paul 0 Feb 5 15:53 file1

    817270 -rw-r-- 2 paul 92 Feb 5 15:42 file2

    817266 -rw-r-- 1 paul 0 Feb 5 15:38 file3

    817270 -rw-r-- 2 paul 92 Feb 5 15:42 hardlink_to_file2

    ```


    Both files have the same inode, so they will have the same permissions and the
    same owner. Both files will have the same content. Actually, both files are equal
    now, meaning you can safely remove the original file, the hardlinked file will
    remain. The inode contains a counter, counting the number of hard links to itself.
    When the counter drops to zero, then the inode is emptied.


    ### 9.3.2. finding hard links


    You can use the find command to look for files with a certain inode. The screenshot
    below shows how to search for all filenames that point to inode 817270. Remember
    that an inode number is unique to its partition.


    ```

    paul@RHELv4:~/test$ find -inum 817270 2> /dev/null

    /home/paul/test/file2

    /home/paul/test/hardlink_to_file2

    ```


    ## 9.4. symbolic links


    Symbolic links (sometimes called soft links) do not link to inodes, but create
    a name to name mapping. Symbolic links are created with ln -s. As you can see
    below, the symbolic link gets an inode of its own.


    ```

    paul@RHELv64:~/test ln -s file2 symlink_to_file2

    paul@RHELv64:~/test ls -li

    total 32

    817273 -rw-r-- 1 paul paul 13 Feb 17:06 file1

    817270 -rw-r-- 2 paul paul 106 Feb 5 17:04 file2

    817270 -rw-r-- 1 paul paul 0 Feb 15:38 file3

    817270 -rw-r-- 2 paul paul 106 Feb 5 17:04 hardlink_to_file2

    817267 lrwxrwxrwx 1 paul paul 5 Feb 5 16:55 symlink_to_file2 -> file2

    paul@laika:~$

    ```


    Permissions on a symbolic link have no meaning, since the permissions of the target
    apply. Hard links are limited to their partition (because they point to an inode),
    symbolic links can link anywhere (other file systems, networked).


    ## 9.5. removing links


    Links can be removed with rm.


    ```

    paul@laika:~$ touch data.txt

    paul@laika:~$ ln -s data.txt sl_data.txt

    paul@laika:~$ ln data.txt hl_data.txt

    paul@laika:~$ rm sl_data.txt

    paul@laika:~$ rm data.txt

    ```


    ## 9.6. practice


    1. Create two files named winter.txt and summer.txt, put some text in them.

    2. Create a hard link to winter.txt named hwinter.txt.

    3. Display the inode numbers of these three files, the hard links have the same
    inode.

    4. Use the find command to list the two hardlinked files

    5. Everything about a file is in the inode, except two things: name them!

    6. Create a symbolic link to summer.txt called slummer.txt.

    7. Find all files with inode number 2. What does this information tell you

    8. Look at the directories /etc/init.d/ /etc/rc2.d/ /etc/rc3.d/ ... do you see
    the links?

    9. Look in /lib with ls -l...

    10. Use find to look in your home directory for regular files that do not have
    one hard link.


    ## 9.7. solution


    1. Create two files named winter.txt and summer.txt, put some text in them.


    ```

    echo > winter.txt ; echo > summer.txt

    ```


    2. Create a hard link to winter.txt named hwinter.txt.


    ```

    ln winter.txt hwinter.txt

    ```


    3. Display the inode numbers of these three files, the hard links have the same
    inode.


    ```

    ls -li winter.txt summer.txt hwinter.txt

    ```


    4. Use the find command to list the two hardlinked files

    ```

    find . -inum xyz

    ```


    5. Everything about a file is in the inode, except two things: name them! The
    name of the file is in a directory, and the contents are somewhere on the disk.

    6. Create a symbolic link to summer.txt called slummer.txt.


    ```

    ln -s summer.txt slummer.txt

    ```


    7. Find all files with inode number 2. What does this information tell you It
    tells you there is more than one inode (one for every formatted partition + virtual
    file systems)

    8. Look at the directories /etc/init.d/ /etc/rc.d/ /etc/rc3.d/ ... do you see
    the links?


    ```

    ls -l /etc/init.d

    ls -l /etc/rc2.d

    ls -l /etc/rc3.d

    ```


    9. Look in /lib with ls -l...

    ```

    ls -l /lib

    ```


    10. Use find to look in your home directory for regular files that do not have
    one hard link.


    ```

    find . -links 1 -type f

    ```


