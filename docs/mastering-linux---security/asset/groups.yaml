    # 4.7. Debian overview


    Below is a table overview of when Debian is running any of these bash startup
    scripts.


    Table 4.1. Debian User Environment


    | script | su | su - | ssh | gdm |

    | --- | --- | --- | --- | --- |

    | ~/.bashrc | no | yes | yes | yes |

    | ~/.profile | no | yes | yes | yes |

    | /etc/profile | no | yes | yes | yes |

    | /etc/bashrc | yes | no | no | yes |


    # 4.8. RHEL5 overview


    Below is a table overview of when Red Hat Enterprise Linux 5 is running any of
    these bash startup scripts.


    Table 4.2. Red Hat User Environment


    | script | su | su - | ssh | gdm |

    | --- | --- | --- | --- | --- |

    | ~/.bashrc | yes | yes | yes | yes |

    | ~/.bash_profile | no | yes | yes | yes |

    | /etc/profile | no | yes | yes | yes |

    | /etc/bashrc | yes | yes | yes | yes |'
- md: "\n## 4.9. practice: user profiles\n\n- 1. Make a list of all the profile files\
    \ on your system.\n2. Read the contents of each of these, often they source extra\
    \ scripts.\n3. Put a unique variable, alias and function in each of those files.\n\
    4. Try several different ways to obtain a shell (su, su -, ssh, tmux, gnome-terminal,\
    \ Ctrl-alt-F1, ...) and verify which of your custom variables, aliases and function\
    \ are present in your environment.\n5. Do you also know the order in which they\
    \ are executed?\n6. When an application depends on a setting in $HOME/.profile,\
    \ does it matter whether $HOME/.bash_profile exists or not?\n\n## 4.10. solution:\
    \ user profiles\n\n- 1. Make a list of all the profile files on your system.\n\
    \n```\nls -a ~ ; ls -l /etc/pro* /etc/bash*\n```\n\n- 2. Read the contents of\
    \ each of these, often they source extra scripts.\n\n- 3. Put a unique variable,\
    \ alias and function in each of those files.\n\n- 4. Try several different ways\
    \ to obtain a shell (su, su -, ssh, tmux, gnome-terminal, Ctrl-alt-F1, ...) and\
    \ verify which of your custom variables, aliases and function are present in your\
    \ environment.\n\n- 5. Do you also know the order in which they are executed?\n\
    \n```\nsame name aliases, functions and variables will overwrite each other\n\
    ```\n\n- 6. When an application depends on a setting in $HOME/.profile, does it\
    \ matter whether $HOME/.bash_profile exists or not?\n\n```\nYes it does matter.\
    \ (man bash /INVOCATION) \n```\n\n## Chapter 5. groups\n\nUsers can be listed\
    \ in **groups**. Groups allow you to set permissions on the group level instead\
    \ of having to set permissions for every individual user.\n\nEvery Unix or Linux\
    \ distribution will have a graphical tool to manage groups. Novice users are advised\
    \ to use this graphical tool. More experienced users can use command line tools\
    \ to manage groups, Some distributions do not allow the mixed use of GUI and CLI\
    \ tools to manage groups (YaST in Novell Suse). Senior administrators can edit\
    \ the relevant files directly with **vi** or **vigr**.\n\n## 5.1. groupadd\n\n\
    Groups can be created with the groupadd command. The example below shows the creation\
    \ of five (empty) groups.\n\n```\nroot@laika:-# groupadd tennis\nroot@laika:-#\
    \ groupadd football\nroot@laika:-# groupadd snooker\nroot@laika:-# groupadd formal\n\
    root@laika:-# groupadd salsa\n```\n\n## 5.2. group file\n\nUsers can be a member\
    \ of several groups. Group membership is defined by the /etc/group file.\n\n```\n\
    root@laika:-# tail -5 /etc/group\ntennis:x:1006:\nfootball:x:1007:\nsnooker:x:1008:\n\
    formal:x:1009:\nsalsa:x:1010:\nroot@laika:-#\n```\n\nThe first field is the group's\
    \ name. The second field is the group's (encrypted) password (can be empty). The\
    \ third field is the group identification or GID. The fourth field is the list\
    \ of members, these groups have no members.\n\n## 5.3. groups\n\nA user can type\
    \ the groups command to see a list of groups where the user belongs to.\n\n```\n\
    [harry@RHEL4b ~]$ groups\nharry sports\n[harry@RHEL4b ~]$\n```\n\n## 5.4. usermod\n\
    \nGroup membership can be modified with the useradd or usermod command.\n\n```\n\
    root@laika:~ usermod -a -G tennis inge\nroot@laika:~ usermod -a -G tennis katrien\n\
    root@laika:~ usermod -a -G salsa katrien\nroot@laika:~ usermod -a -G snooker sandra\n\
    root@laika:~ usermod -a -G formal annies\nroot@laika:~ tail -a /etc/group\ntennis:x:1006:inge,katrien\n\
    football:x:1007:\nsnooker:x:1008:sandra\nformal:x:1009:annelies\nsalsa:x:1010:katrien\n\
    root@laika:~#\n```\n\nBe careful when using **usermod** to add users to groups.\
    \ By default, the usermod command **will remove** the user from every group of\
    \ which he is a member if the group is not listed in the command! Using the **-a\
    \ (append)** switch prevents this behaviour.\n\n## 5.5. groupmod\n\nYou can change\
    \ the group name with the **groupmod** command.\n\n```\nroot@laika:~# groupmod\
    \ -n darts snooker\nroot@laika:~# tail -S /etc/group\ntennis:x:1006:inge,katrien\n\
    football:x:1007:\nformal:x:1009:annelies\nsalsa:x:1010:katrien\ndarts:x:1008:sandra\n\
    ```\n\n## 5.6. groupdel\n\nYou can permanently remove a group with the **groupdel**\
    \ command.\n\n```\nroot@laika:~# groupdel tennis\nroot@laika:~#\n```\n\n## 5.7.\
    \ gpasswd\n\nYou can delegate control of group membership to another user with\
    \ the gpasswd command. In the example we delegate permissions to add and remove\
    \ members to serena for the sports group. Then we su serena and add harry to the\
    \ sports group.\n\n```\n[root@RHEL4b]# gpasswd -A serena sports\n[root@RHEL4b]#\
    \ su serena\n[serena@RHEL4b]# id harry\nuid=516(harry) gid=520(harry) groups=520(harry)\n\
    [serena@RHEL4b]# gpasswd -A harry sports\nAdding user harry to group\n[serena@RHEL4b]#\
    \ id harry\nuid=516(harry) gid=520(harry) groups=522(sports)\n[serena@RHEL4b]#\
    \ tail /etc/group\nsports:522:serena,harry\n[serena@RHEL4b]#\n```\n\nGroup administrators\
    \ do not have to be member of the group. They can remove themselves from a group,\
    \ but this does not influence their ability to add or remove members.\n\n```\n\
    [serena@RHEL4b]# gpasswd -d serena\nRemoving user serena from sports\n[serena@RHEL4b]#\
    \ exit\n```\n\nInformation about group administrators is kept in the /etc/shadow\
    \ file.\n\n```\n[root@RHEL4b]# tail /etc/shadow\nsports::522:serena,harry\n[root@RHEL4b]#\n\
    ```\n\nTo remove all administrators from a group, use the gpasswd command to set\
    \ an empty list.\n\n```\n[root@RHEL4b]# gpasswd -A sports\n```\n\n## 5.8. newgrp\n\
    \nYou can start a child shell with a temporary primary group using the newgrp\
    \ command.\n\n```\nroot@rhel:~# mkdir group\nroot@rhel:~# cd group\nroot@group##\
    \ touch standard.txt\nroot@group## ls -l\ntotal 0\n-rw-r--r-- 1 root 0 Apr 13\
    \ 17 standard.txt\nroot@group## echo 1\nroot@group## newgrp tennis\nroot@group##\
    \ echo 2\nroot@group## touch standard.txt\nroot@group## ls -l\ntotal 0\n-rw-r--r--\
    \ 1 root 0 Apr 13 17 standard.txt\n-rw-r--r-- 1 root 0 Apr 13 17 standard.txt\n\
    root@group## exit\nroot@group##\n```\n\n## 5.9. vigr\n\nSimilar to vipw, the vigr\
    \ command can be used to manually edit the /etc/group file, it will do proper\
    \ locking of the file. Only experienced senior administrators should use vi or\
    \ vigr to manage groups.\n\n## 5.10. practice: groups\n\n- 1. Create the groups\
    \ tennis, football and sports.\n2. In one command, make venus a member of tennis\
    \ and sports.\n3. Rename the football group to foot.\n4. Use vi to add serena\
    \ to the tennis group.\n5. Use the id command to verify that serena is a member\
    \ of tennis.\n6. Make someone responsible for managing group membership of foot\
    \ and sports. Test that it works.\n\n## 5.11. solution: groups\n\n- 1. Create\
    \ the groups tennis, football and sports.\ngroupadd tennis ; groupadd football\
    \ ; groupadd sports\n\n- 2. In one command, make venus a member of tennis and\
    \ sports.\nusermod -a -G tennis,sports venus\n\n- 3. Rename the football group\
    \ to foot.\ngroupmod -n foot football\n\n- 4. Use vi to add serena to the tennis\
    \ group.\nvi /etc/group\n\n- 5. Use the id command to verify that serena is a\
    \ member of tennis.\nid (and after logoff logon serena should be member)\n\n-\
    \ 6. Make someone responsible for managing group membership of foot and sports.\
    \ Test that it works.\ngpasswd -A (to make manager)\ngpasswd -a (to add member)\n\
    \n## Part II. file security\n\n## Table of Contents\n\n- 6. standard file permissions\
    \ ............................................................ 45\n6.1. file ownership\
    \ .................................................................................\
    \ 46\n6.2. list of special files ........................................................\
    \ 48\n6.3. permissions .......................................................................\
    \ 49\n6.4. practice: standard file permissions ................................................\
