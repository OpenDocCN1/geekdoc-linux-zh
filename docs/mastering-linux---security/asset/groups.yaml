    \ of rules. The kernel will inspect packets and decide based on these rules what\
    \ to do with each packet.\n\n# 11.3.2. filter table\n\nThe filter table in iptables\
    \ has three chains (sets of rules). The INPUT chain is used for any packet coming\
    \ into the system. The OUTPUT chain is for any packet leaving the system. And\
    \ the FORWARD chain is for packets that are forwarded (routed) through the system.\n\
    \n![](img/93b29716e9fc0b0730b4dac1126847e3_92_0.png)\n\nThe screenshot below shows\
    \ how to list the filter table and all its rules.\n\n```\n[root@RHEL5 ~]# iptables\
