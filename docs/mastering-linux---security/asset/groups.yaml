    \        \"$HOME/.bashrc\"\n    fi\nfi\n```\n```\nif [ -d \"$HOME/bin\" ]; then\n\
    \    PATH=$HOME/bin:$PATH\nfi\n```\nRHEL/CentOS does not have this file by default.\n\
    \n### 5. ~/.bashrc\n\nThe ~/.bashrc script is often sourced by other scripts.\
    \ Let us take a look at what it does. Red Hat has a very simple ~/.bashrc, checking\
    \ for /etc/bashrc and sourcing it. It also leaves room for custom aliases and\
    \ functions.\n\n```\nroot@hel:~# cat /home/.bashrc\n#bashrc\n\n# Source global\
