    \ PATH=$1\n```\nThe **root user** can use this script to set aliases, functions,\
    \ and variables for every user.\n\n### 2. ~/.bash_profile\n\nWhen this file exists,\
    \ then **bash** will source it. On Debian 5/6 this file does not exist. RHEL/CentOS\
    \ uses a small ~/.bash_profile where it checks for the existence of ~/.bashrc\
    \ and then sources it. It adds $HOME to the $PATH variable.\n\n```\nroot@hel:~#\
    \ cat /home/.bash_profile\n#bash_profile\nif [ -f ~/.bashrc ]; then\n  ~/.bashrc\n\
    fi\nPATH=$PATH:$HOME/.local/bin\n```\n\n### 3. ~/.bash_login\n\nWhen ~/.bash_profile\
    \ does not exist, then bash will check for ~/.bash_login and source it. Neither\
    \ Debian Red Hat have this file by default.\n\n### 4. ~/.profile\n\nWhen ~/.bash_profile\
    \ and ~/.bash_login exist, then bash will verify the existence of ~/.profile and\
    \ execute it. On Debian this script can execute ~/.bashrc and add $HOME/bin to\
    \ the PATH variable.\n\n```\nroot@debian:~# tail -1 /home/.profile\nif [ -n \"\
