    \ 操作。在读取此脚本时，你会发现（在 Debian 和 Hat Enterprise Linux 上都是如此）构建了 PATH 变量（以及其他变量）。脚本还可能更改\
    \ PSNAME 变量，设置 HOSTNAME 并执行更多脚本，如 `/etc/inputrc`。截图使用 `grep` 显示了 Debian 上 `/etc/profile`\
    \ 中的 PATH 操作。\n\n```\nroot@debian:~# grep /etc/profile\nPATH=/usr/local/bin:/usr/bin:/usr/sbin:/bin\n\
    PATH=/usr/local/bin:bin:/sbin:/games\nexport PATH\nroot@debian:~#\n```````\n在\
    \ RHEL/CentOS 7 上。\n\n```\nroot@centos:~# grep /etc/profile\ncase ${PATH} in\n\
    \  PATH=$1\n```\n**root 用户** 可以使用此脚本为每个用户设置别名、函数和变量。\n\n### 2. ~/.bash_profile\n\
    \n当此文件存在时，**bash** 会对其进行源化。在 Debian 5/6 上此文件不存在。RHEL/Centos 使用一个较小的 `~/.bash_profile`，在其中它检查\
    \ `~/.bashrc` 是否存在并对其进行源化。它将 `$HOME` 添加到 `$PATH` 变量。\n\n```\nroot@hel:~# cat /home/.bash_profile\n\
    #bash_profile\nif [ -f ~/.bashrc\n```\n\n### 3. ~/.bashrc\n\n（注：原文此处内容存在混乱和重复，已根据核心意图进行对齐翻译）\n\
