    # # Chapter 3. user passwords


    This will tell you more about passwords for local users.


    Three methods for setting passwords are explained; using the **passwd** command,
    using **openssl passwd**, and using the **crypt** function in a C program.


    The chapter will also discuss password settings and disabling, suspending or locking
    accounts.'
- md: "\n## 3.1. passwd\n\nPasswords of users can be set with the passwd command.\
    \ Users will have to provide the old password before twice entering the new one.\n\
    \n```\n[tania@centos ~]$ password\nChanging password for user tania.\nChanging\
    \ password for tania.\n(current) UNIX password:\nNew password:\nBAD PASSWORD:\
    \ The password is shorter than 8 characters\nNew password:\nBAD PASSWORD: The\
    \ password is a palindrome\nNew password:\nBAD PASSWORD: The password is too similar\
    \ to the old one\npasswd: Have exhausted maximum number of retries for service\n\
    ```\n\nAs you can see, the passwd tool will use some basic verification to prevent\
    \ users from using too simple passwords. The root user does not have to follow\
    \ these rules (there will be a warning though). The root user also does not have\
    \ to provide the old password before entering the new password.\n\n```\nroot@debian:-#\
    \ passwd tania\nEnter new UNIX password:\nRetype new UNIX password:\npasswd: updated\
    \ successfully\n```\n\n## 3.2. shadow file\n\nUser passwords are encrypted in\
    \ /etc/shadow. The /etc/shadow file is read only and can only be read by root.\
    \ We will see in the file permissions section how it is possible for users to\
    \ change their password. For now, you will have to know that users can change\
    \ their password with the /usr/bin/passwd command.\n\n```\n[root@centos ~]# tail\
    \ -4 /etc/shadow\nlaura:$61k2XptaS5.Tml._p2S3J7Y/NOYqGMKwLJqoGJbVsZsG5/Pti8ovBRD.VbRbiDS17TEQ/\n\
    IASMH.TEKBnt/S31ruw89fgfCOJ98.BNWqMKJKJ3F8S9:99999:7:\nsasha:$6B8Z2YqJ1v9q0789g8IK8ml.K2EAWAY5z5ZynN5vyYJaa9L5XqVu.Z4d1pMREH/\n\
    eQqZ5VqFnRKMKJ1Y7H77S.c790ZD6:15630:99999:7:\naura:$6a4qG5fR699X673695HA64XXocCFVJKJnb98bThPfwXQGk\n\
    Syh1Wc676395H6.w24rY3A0BZM:15630:99999:7:\nvalina:$6Y3zRA6GP51Vq689m66BKJFR58R4c6F6Lrhhh.vi4qUvRevuill71\n\
    6XROUDAK552NHbaE2Outnv:15630:99999:7:\n[root@centos ~]#\n```\n\nThe /etc/shadow\
    \ file contains colon separated columns. The fields from left to right are: username\
    \ (note that only Laura and Laura have an encrypted password), the day password\
    \ was last changed (day is January 1, 1970), number of days the password must\
    \ be left unchanged, password expiry date, warning number of days before password\
    \ expiry, number of days after expiry disabling the account, and the day the account\
    \ was disabled (again, since 1970). The last field has no meaning yet.\n\nAll\
    \ the passwords in the screenshot are hashes of hunter2.\n\n## 3.3. encryption\
    \ with passwd\n\nPasswords are stored in an encrypted format. This encryption\
    \ is done by the crypt function. The easiest (and recommended) way to add a user\
    \ with a password to the system is to add the user with the -add user command,\
    \ and then set the user's password with passwd.\n\n```\n[root@RHEL4 ~]# useradd\
    \ -m xavier\n[root@RHEL4 ~]# passwd xavier\nChanging password for user xavier.\n\
    New UNIX password:\nRetype new UNIX password:\npasswd: all authentication tokens\
    \ updated successfully.\n[root@RHEL4 ~]#\n```\n\n## 3.4. encryption with openssl\n\
    \nAnother way to create users with a password is to use the -p option of useradd,\
    \ but that option requires an encrypted password. You can generate this encrypted\
    \ password with the openssl password\n\nThe openssl passwd command will generate\
    \ several distinct hashes for the same password, for this it uses a salt.\n\n\
    ```\npaul@rhel65:-$ openssl passwd hunter 2\n86cjUN1GDfPY\npaul@rhel65:-$ openssl\
    \ passwd hunter 2\nYjF3mGoDbvG\npaul@rhel65:-$ openssl passwd hunter 2\nYqDcJceGoDbzKA\n\
    paul@rhel65:-$\n```\n\nThis salt can be chosen and is visible as the first two\
    \ characters of the hash.\n\nThis example shows how to create a user with password.\n\
    \n```\nroot@rhel65:-# useradd -m -p $(openssl passwd hunter 2) mohamed\n```\n\n\
    ## 3.5. encryption with crypt\n\nA third option is to create your own C program\
    \ using the crypt function, and compile this into a command.\n\n```\npaul@rhel65:$\
    \ cat MyCrypt.c\n#include <stdio.h>\n#define _DEFAULT_SOURCE\n#include <unistd.h>\n\
    \nint main(int argc, char **argv) {\n    if(argc==3) {\n        printf(\"%s\\\
    n\", crypt(argv[1],argv[2]));\n    } else {\n        printf(\"Usage: MyCrypt password\
    \ $salt\\n\");\n    }\n    return 0;\n}\n```\n\nThis little program can be compiled\
    \ with gcc -o MyCrypt.\n\n```\npaul@rhel65:$ gcc MyCrypt.c -o MyCrypt -lc\n```\n\
    \nTo use it, we provide two parameters to MyCrypt. The first is the unencrypted\
    \ password, the second is the salt. The salt is used to perturb the encryption\
    \ algorithm in one of 4096 ways. This variation prevents two users with the same\
    \ password from having the same entry in /etc/shadow.\n\n```\npaul@rhel65:$ ./MyCrypt\
    \ hunter2 42\n42zrtPIzeg\npaul@rhel65:$ ./MyCrypt hunter2 33\n33dctaYSI\n```\n\
    \nDid you notice the salt? The standard output of crypt function is DES algorithm\
    \ which is old and can be cracked in minutes. A better method is to use md5 passwords\
    \ which can be recognized by salt starting with $.\n\n```\npaul@rhel65:$ ./MyCrypt\
    \ hunter2 '$14'\n$14S2716Y3TS2X8rtDoff\npaul@rhel65:$ ./MyCrypt hunter2 '$62'\n\
    $62S40qGFFAn13TSGOY9WTqcZwop78hwGILESNBMi4r\n```\n\nThe md5 salt can be up to\
    \ eight characters. The salt is displayed in /etc/shadow between the second and\
    \ third $, so never use the password as the salt!\n\n```\npaul@rhel65:$ ./MyCrypt\
    \ hunter2 '$hunter2'\n$hunter2$VXxrDmidqf\n```\n\n## 3.6 /etc/login.defs\n\nThe\
    \ /etc/login.defs file contains some default settings for user passwords like\
    \ password aging and length. (You will also find limits of user ids and group\
    \ ids and whether a home directory should be created).\n\n```\nroot@rhel65:~#\
    \ grep PASS /etc/login.defs\nPASS_MAX_DAYS      99999\nPASS_MIN_DAYS      0\n\
    PASS_MIN_LEN       5\nPASS_WARN_AGE      7\n```\n\nDebian also has\n\n```\nroot@debian7:~#\
    \ grep PASS /etc/login.defs\n# PASS_MAX_DAYS      Maximum number of days a password\
    \ may be used.\n# PASS_MIN_DAYS      Minimum number of days allowed between changes.\n\
    # PASS_WARN_AGE      Number of days given before a password expires.\nPASS_MAX_DAYS\
    \      99999\nPASS_MIN_DAYS      0\nPASS_WARN_AGE      7\n# PASS_CHANGE_TRIES\n\
    # PASS_ALWAYS_WARN\n# PASS_MIN_LEN\n# PASS_MAX_LEN\n# NO_PASSWORD_CONSOLE\n```\n\
    \n## 3.7. charge\n\nThe change command can be used to set an expiration date for\
    \ a user account (-E), set a minimum (-m) and maximum (-M) password age, a password\
    \ expiration date, and set the number of warning days before the password expiration.\
    \ Much of this functionality is also available from the passwd command. The -l\
    \ option of charge will list these settings for a user.\n\n```\nroot@rhel65:~#\
    \ charge -l paul\nLast password change               : Mar 27, 2014\nPassword\
    \ expires                   : never\nPassword inactive                  : never\n\
    Account expires                    : never\nMinimum number of days between password\
    \ change : 0\nMaximum number of days between password change : 99999\nNumber of\
    \ days of warning before password expires : 7\nroot@rhel65:~#\n```\n\n## 3.8.\
    \ disabling a password\n\nPasswords in /etc/shadow cannot begin with an exclamation\
    \ mark. When the second field in /etc/passwd starts with an exclamation mark,\
    \ then the password cannot be used.\n\nUsing this feature is often called locking,\
    \ disabling, or suspending a user account. Besides vi (or vip) you can also accomplish\
    \ this with usermod.\n\nThe first command in the next screenshot will show the\
    \ password field of laura. The next command disables the password of laura, making\
    \ it impossible for Laura to authenticate using this password.\n\n```\nroot@debian:-#\
    \ grep laura /etc/shadow | cut -c1-70\nlaura:$64J2gp$stwWAc30tEI2R2auE7j.nbW.dpKNUYVK7mChFCVMaCoDUJV\n\
    root@debian:-# usermod -L laura\n```\n\nAs you can see, the password hash is simply\
    \ preceded with an exclamation mark.\n\n```\nroot@debian:-# grep laura /etc/shadow\
    \ | cut -c1-70\nlaura:$66JY4J2gp$stwWAc30tEI2R2auE7j.nbW.dpKNUYVK7mChFCVMaCoDUJV\n\
    root@debian:-#\n```\n\nThe user (and users with sudo rights on) will still be\
    \ able to su into the laura account (because the password is not set here!). Note\
    \ that laura will still be able to login if she has set up password ssh!\n\n```\n\
    root@debian:-# su - laura\nlaura@debian:-$\n```\n\nYou can unlock the account\
    \ again with usermod -U.\n\n```\nroot@debian:-# usermod -U laura\nroot@debian:-#\
    \ grep laura /etc/shadow | cut -c1-70\nlaura:$64J2gp$stwWAc30tEI2R2auE7j.nbW.dpKNUYVK7mChFCVMaCoDUJV\n\
    ```\n\n## 3.9. editing local files\n\nIf you want to manually edit the /etc/passwd\
    \ or /etc/shadow, after knowing these commands for password management, use vip\
    \ instead of vi(m) directly. The vip tool will do proper locking of the file.\n\
    \n```\n[root@RHEL5 ~]# vip /etc/passwd\nvip: the password file is busy (/etc/ptmp\
    \ present)\n```\n"
  mdcn: "\n\n## 3.1. passwd\n\n可以使用 `passwd` 命令设置用户密码。用户在两次输入新密码之前，必须提供旧密码。\n\n```\n\
    [tania@centos ~]$ password\nChanging password for user tania.\nChanging password\
