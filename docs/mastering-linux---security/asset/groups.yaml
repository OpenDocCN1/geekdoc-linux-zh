    paul pts/1 23:30 7.00s 0.00s w

    $ paul@centos7 ~$

    ```


    # 1.5. id


    The id command will give you user id, primary group id, and a list of the groups
    that you belong to.


    ```

    $ paul@debian7:-$ id

    uid=1000(paul) gid=1000(paul) groups=1000(paul)

    ```


    On RHEL/CentOS you will also get SELinux context information with this command.


    ```

    $ root@centos7 ~$ id

    uid=0(root) gid=0(root) groups=0(root) context=unconfined_u:unconfined_r\nunconfined_t:s0-s0:c0.c1023

    ```'
- md: "\n## 1.6. su to another user\n\nThe su command allows a user to run a shell\
    \ as another user.\n\n```\nlaura@debian7:~~$ su tania\nPassword:\ntania@debian7:/home/laura$\n\
    ```\n\n## 1.7. su to root\n\nYou can also su to become root, when you know the\
    \ root password.\n\n```\nlaura@debian7:~~$ su root\nPassword:\nroot@debian7:/home/laura$\n\
    ```\n\n## 1.8. su as root\n\nYou need to know the password of the user you want\
    \ to substitute, unless you are logged as root. The root user can become any existing\
    \ user without knowing that user's password.\n\n```\nroot@debian7:~$ id\nuid=0(root)\
    \ gid=0(root) groups=0(root)\nroot@debian7:~# su - valentina\nvalentina@debian7:~-$\n\
    ```\n\n## 1.9. su - $username\n\nBy default, the su command maintains the same\
    \ shell environment. To become another user and also get the target user's environment,\
    \ issue the su - command followed by the target username.\n\n```\nroot@debian7:~#\
    \ su laura\nlaura@debian7:/root$ exit\nexit\nroot@debian7:~# su - laura\nlaura@debian7:~$\
    \ pwd\n/home/laura\n```\n\n## 1.10. su -\n\nWhen username is provided to su or\
    \ su - , the command will assume root is the target.\n\n```\ntania@debian7:~~$\
    \ su - \nPassword:\nroot@debian7:~#\n```\n\n## 1.11. run a program as another\
    \ user\n\nThe sudo program allows a user to start a program with the credentials\
    \ of another user. Before this works, the system administrator has to set up the\
    \ /etc/sudoers file. This can be useful to delegate administrative tasks to another\
    \ user (without giving the root password).\n\nThe screenshot below shows the usage\
    \ of sudo. User paul received the right to run useradd with the credentials of\
    \ root. This allows paul to create new users on the system without becoming root\
    \ and without knowing the root password.\n\nThe first command fails for paul.\n\
    \n```\npaul@debian:~-$ /usr/sbin/useradd -m valentina\nuseradd: Permission denied.\n\
    useradd: cannot lock /etc/passwd; try again later.\n```\n\nBut with sudo it works.\n\
    \n```\npaul@debian?:-$ sudo /usr/sbin/useradd -m valentina\n[sudo] password for\
    \ paul:\npaul@debian?:-$\n```\n\n## 1.12. visudo\n\nCheck the man page of visudo\
    \ before playing with the /etc/sudoers file. Editing the sudoers out of scope\
    \ for this fundamentals book.\n\n```\npaul@rhel65:-$ apropos visudo\nvisudo\n\t\
    (8) - edit the sudoers file\npaul@rhel65:-$\n```\n\n## 1.13. sudo su -\n\nOn some\
    \ Linux systems like Ubuntu and Xubuntu, the root user does not have a password\
    \ set. This means that it is not possible to log in as root (extra security).\
    \ To perform tasks as root, the user is given all sudo rights via the /etc/sudoers.\
    \ In fact all users that are members of the admin group use sudo to run all commands\
    \ as root.\n\n```\nroot@lika:-# grep admin /etc/sudoers\n# Members of the admin\
    \ group may gain root privileges\n%admin ALL=(ALL) ALL\n```\n\nThe result of this\
    \ is that the user can type sudo su - and become root without having to enter\
    \ the root password. The sudo command requires you to enter your own password.\
    \ Thus the password prompt in the screenshot is for sudo, not for su.\n\n```\n\
    paullika:-$ sudo su -\nPassword:\nroot@lika:-#\n```\n\n## 1.14. sudo logging\n\
    \nUsing sudo without authorization will result in a severe warning:\n\n```\npaul@rhel65:-$\
    \ sudo su -\n```\n\nWe trust you have received the usual lecture from the local\
    \ System Administrator. It usually boils down to these three things:\n\n- #1)\
    \ Respect the privacy of others.\n- #2) Think before you type.\n- #3) With great\
    \ power comes great responsibility.\n\n```\n[sudo] password for paul:\npaul is\
    \ not in the sudoers file. This incident will be reported.\npaul@rhel65:-$\n```\n\
    \nThe root user can see this in the /var/log/secure on Red Hat and in /var/log/auth.log\
    \ on Debian.\n\n```\nroot@rhel65:-# tail /var/log/secure | grep sudo | tr -s '\
    \ ' \nApr 16:03:42 rhel65 sudo: paul USER NOT in sudoers ; TTY=pts/0 ; PWD=\n\
    /home/paul ; USER=root ; COMMAND=/bin/su - \nroot@rhel65:-#\n```\n\n## 1.15. practice:\
    \ introduction to users\n\n- 1. Run a command that displays only your currently\
    \ logged on user name.\n- 2. Display a list of all logged on users.\n- 3. Display\
    \ a list of all logged on users including the command they are running at this\
    \ very moment.\n- 4. Display your user name and your unique user identification\
    \ (userid).\n- 5. Use su to switch to another user account (unless you are root,\
    \ you will need the password of the other account). And get back to the previous\
    \ account.\n- 6. Now use su - switch to another user and notice the difference.\
    \ Note that su - gets you into home directory of Tania.\n- 7. Try to create a\
    \ new user account (when your normal account). this should fail. (Details on adding\
    \ accounts are explained in the next chapter.)\n- 8. Now try the same, but with\
    \ sudo before your command.\n\n## 1.16. section: introduction to users\n\n- 1.\
    \ Run a command that displays your currently logged on user name.\n```\nlaura@debian7:~$\
    \ whoami\nlaura\nlaura@debian7:~$ echo\n```\n- 2. Display a list of all logged\
    \ users.\n```\nlaura@debian7:~$ who\nlaura  pts/0         2014-10-13 07:22 (104.33.101)\n\
    laura@debian7:~$\n```\n- 3. Display a list of all users using the command they\
    \ are running at this moment.\n```\nlaura@debian7:~$ w\n07:47 up 16 min   2 users\
    \   load average: 0.00\nUSER     TTY  FROM             IDLE  JCPU  PCPU  WHAT\n\
    root     pts/0  104.33.101      07:30  0.00s 0.04s\nroot     pts/1  104.33.101\
    \      07:46  0.00s 0.01s\nlaura@debian7:~$\n```\n- 4. Display your user name\
    \ and your unique user identification (userid).\n```\nlaura@debian7:~$ id\nuid=1005\
    \ (laura) gid=1007 (laura) groups=1007 (laura)\nlaura@debian7:~$\n```\n- 5. Use\
    \ su to switch to another user account (unless you are root, you will need the\
    \ password of the other account). And get back to the previous account.\n```\n\
    laura@debian7:~$ su tania\nPassword:\ntania@debian7:~/home/tania$ id\nuid=1006\
    \ (tania) gid=1008 (tania) groups=1008 (tania)\ntania@debian7:~/home/tania$ exit\n\
    laura@debian7:~$\n```\n- 6. Now use su to switch to another user and see the difference.\n\
    ```\nlaura@debian7:~$ su tania\nPassword:\ntania@debian7:~$ pwd\n/home/tania\n\
    tania@debian7:~$ logout\nlaura@debian7:~$\n```\nNote that su - gets you into home\
    \ directory.\n\n- 7. Try to create a new user account (when your normal user account).\
    \ this should fail.\n```\nlaura@debian7:~$ useradd valentina\nsu: useradd: command\
    \ not found\nlaura@debian7:~$ /usr/sbin/useradd valentina\nPermission denied.\n\
    userid: cannot lock /etc/passwd; try again later.\n```\nIt is possible that userid\
    \ is located in /sbin/useradd on your computer.\n\n- 8. Now try the same, but\
    \ with sudo before your command.\n```\nlaura@debian7:~$ sudo /usr/sbin/useradd\
    \ valentina\n[sudo] password for laura:\nlaura is not in the sudoers file. This\
    \ incident will be reported.\nlaura@debian7:~$\n```\nNotice that laura has no\
    \ permission to use the sudo on this system.\n\n## Chapter 2. user management\n\
    \nThis will teach you how to use useradd, usermod and userdel to create, modify\
    \ and remove user accounts.\n\nYou will need root access on a Linux computer to\
    \ complete this chapter.\n\n## user management\n\nUser management on Linux is\
    \ done in three complementary ways. You can use the graphical tools provided by\
    \ your distribution. These tools have a look and feel that depends on the distribution.\
    \ If you are a novice Linux user on your home system, then use the graphical tool\
    \ provided by your distribution. This will make sure that you do not run into\
    \ problems.\n\nAnother option is to use command line tools like useradd, usermod,\
    \ gpasswd, passwd and others. Server administrators are likely to use these tools,\
    \ since they are familiar and similar across many different distributions. This\
    \ chapter will focus on these command line tools.\n\nA third rather extremist\
    \ way is to edit the local configuration files directly using vi (or vipw/vim).\
    \ Do not attempt this as a novice on production systems!\n\n## 2. /etc/passwd\n\
    \nThe local database (Linux and on Unix systems) is /etc/passwd.\n\n```\n[root@RHEL5\
    \ ~]$# tail /etc/passwd\ning:518:524:art dealer:/home/inge:/bin/bash\nann:519:525:flux\
    \ player:/home/ann:/bin/bash\nderick:520:526:rubius:/home/frederik:/bin/bash\n\
    steven:521:527:roman peter:/home/steven:/bin/bash\npascale:522:528:artist:/home/pascale:/bin/bash\n\
    geert:524:530:kernel developer:/home/geert:/bin/bash\nwin:525:531:master daemon:/home/win:/bin/bash\n\
    sandra:526:532:radish stresser:/home/sandra:/bin/bash\nannelies:527:533:sword\
    \ fighter:/home/annelies:/bin/bash\nlaura:528:534:art dealer:/home/laura:/bin/bash\n\
    ```\n\nAs you can see, this file contains columns separated by a colon. The columns\
    \ contain the username, an x, the user id, the primary group id, a description,\
    \ the name of the home directory, and the login.\n\nMore information can be found\
    \ by typing man 5 passwd.\n\n```\n[root@RHEL5 ~]$# man 5 passwd\n```\n"
  mdcn: "\n\n## 1.6. 切换到另一个用户\n\nsu 命令允许用户以另一个用户的身份运行 shell。\n\n```\nlaura@debian7:~~$\
    \ su tania\nPassword:\ntania@debian7:/home/laura$\n```\n\n## 1.7. 切换到 root\n\n\
    当你知道 root 密码时，你也可以 su 切换到 root。\n\n```\nlaura@debian7:~~$ su root\nPassword:\n\
    root@debian7:/home/laura$\n```\n\n## 1.8. 以 root 身份切换\n\n除非你以 root 身份登录，否则你需要知道想要替换的用户密码。root\
    \ 用户可以变成任何现有用户，而无需知道该用户的密码。\n\n```\nroot@debian7:~~$ id\nuid=0(root) gid=0(root)\
    \ groups=0(root)\nroot@debian7:~# su - valentina\nvalentina@debian7:~-$\n```\n\
    \n## 1.9. su - $username\n\n默认情况下，su 命令会保持相同的 shell 环境。要切换到另一个用户并获取目标用户的环境，请执行\
    \ su - 命令并接目标用户名。\n\n```\nroot@debian7:~# su laura\nlaura@debian7:/root$ exit\n\
    exit\nroot@debian7:~# su - laura\nlaura@debian7:~$ pwd\n/home/laura\n```\n\n##\
    \ 1.10. su -\n\n当向 su 或 su - 提供用户名时，命令将假设 root 是目标。\n\n```\ntania@debian7:~~$\
    \ su - \nPassword:\nroot@debian7:~#\n```\n\n## 1.11. 以另一个用户运行程序\n\nsudo 程序允许用户以另一个用户的凭据启动程序。在此之前，系统管理员必须设置\
    \ /etc/sudoers 文件。这对于将管理任务委托给另一个用户（而无需提供 root 密码）非常有用。下面的截图显示了 sudo 的用法。用户 paul\
    \ 获得了以 root 身份运行 useradd 的权限。这允许 paul 在系统上创建新用户，而无需变成 root 也无需知道 root 密码。\n\n\
    第一个命令对 paul 失败了。\n\n```\npaul@debian:~-$ /usr/sbin/useradd -m valentina\nuseradd:\
    \ Permission denied.\nuseradd: cannot lock /etc/passwd; try again later.\n```\n\
    \n但使用 sudo 就可以成功了。\n\n```\npaul@debian?:-$ sudo /usr/sbin/useradd -m valentina\n\
    [sudo] password for paul:\npaul@debian?:-$\n```\n\n## 1.12. visudo\n\n在操作 /etc/sudoers\
    \ 文件之前，请检查 visudo 的帮助页。编辑 sudoers 超出本基础书籍的范围。\n\n```\npaul@rhel65:-$ apropos visudo\n\
    visudo\n\t(8) - edit the sudoers file\npaul@rhel65:-$\n```\n\n## 1.13. sudo su\
    \ -\n\n在像 Ubuntu 和 Xubuntu 等某些 Linux 系统上，root 用户没有设置密码。这意味着无法以 root 身份登录（额外的安全考虑）。为了以\
    \ root 身份执行任务，用户通过 /etc/sudoers 获得了所有的 sudo 权限。事实上，admin 组组成的所有用户都使用 sudo 以 root\
    \ 身份运行所有命令。\n\n```\nroot@lika:-# grep admin /etc/sudoers\n# Members of the admin\
    \ group may gain root privileges\n%admin ALL=(ALL) ALL\n```\n\n结果是，用户可以输入 sudo\
    \ su - 并变成 root，而无需输入 root 密码。sudo 命令要求你输入自己的密码。因此，截图中的密码提示是针对 sudo 的而不是 su。\n\
    \n```\npaullika:-$ sudo su -\nPassword:\nroot@lika:-#\n```\n\n## 1.14. sudo 日志\n\
    \n在授权的情况下使用 sudo 将导致严重的警告：\n\n```\npaul@rhel65:-$ sudo su -\n```\n\n我们相信你已经收到了本地系统管理员的常规指导。这通常归结为以下三点：\n\
    \n- #1) 尊重他人的隐私。\n- #2) 在输入之前先思考。\n- #3) 能力越大，责任越大。\n\n```\n[sudo] password for\
    \ paul:\npaul is not in the sudoers file. This incident will be reported.\npaul@rhel65:-$\n\
    ```\n\nroot 用户可以在 Red Hat 的 /var/log/secure 中以及 Debian 的 /var/log/auth.log 中看到这些。\n\
    \n```\nroot@rhel65:-# tail /var/log/secure | grep sudo | tr -s ' ' \nApr 16:03:42\
    \ rhel65 sudo: paul USER NOT in sudoers ; TTY=pts/0 ; PWD=\n/home/paul ; USER=root\
    \ ; COMMAND=/bin/su - \nroot@rhel65:-#\n```\n\n## 1.15. 练习：用户介绍\n\n- 1. 运行一个仅显示当前登录用户名的命令。\n\
    - 2. 显示所有登录用户列表。\n- 3. 显示所有登录用户列表，包括他们此时正在运行的命令。\n- 4. 显示你的用户名和你的唯一用户标识 (userid)。\n\
    - 5. 使用 su 切换到另一个用户账户（除非你是 root，否则你需要另一个账户的密码）。并返回之前的账户。\n- 6. 现在使用 su - 切换到另一个用户并注意区别。注意\
    \ su - 会让你进入 Tania 的家目录。\n- 7. 尝试创建一个新用户账户（当你使用普通账户时）。这应该是失败的。（添加账户的将在下一节解释。）\n\
    - 8. 现在尝试相同操作，但在命令前加上 sudo。\n\n## 1.16. 章节：用户介绍\n\n- 1. 运行一个显示你当前登录用户名的命令。\n```\n\
    laura@debian7:~$ whoami\nlaura\nlaura@debian7:~$ echo\n```\n- 2. 显示所有登录用户列表。\n\
    ```\nlaura@debian7:~$ who\nlaura  pts/0         2014-10-13 07:22 (104.33)\nlaura@debian7:~$\n\
    ```\n- 3. 显示此时所有正在运行命令的用户列表。\n```\nlaura@debian7:~$ w\n07:47 up 16 min   2 users\
    \   load average: 0.00\nUSER     TTY             IDLE  JCPU  PCPU  WHAT\nroot\
    \     pts/0  104.33/101      07:30  0.00s 0.04s\nroot     pts/1  104.33/101  \
    \    07:46  0.00s 0.01s\nlaura@debian7:~$\n```\n- 4. 显示你的用户名和你的唯一用户标识 (userid)。\n\
    ```\nlaura@debian7:~$ id\nuid=1005 (laura) gid=1007 (laura) groups=1007 (laura)\n\
    laura@debian7:~$\n```\n- 5. 使用 su 切换到另一个账户（除非你是 root，否则你需要另一个账户的密码）。返回之前的账户。\n\
    ```\nlaura@debian7:~$ su tania\nPassword:\ntania@debian7:~/home/tania$ id\nuid=1006\
    \ (tania) gid=1008 (tania) groups=1008 (tania)\ntania@debian7:~/home/tania$ exit\n\
    laura@debian7:~$\n```\n- 6. 现在使用 su 切换到另一个用户查看区别。\n```\nlaura@debian7:~$ su tania\n\
    Password:\ntania@debian7:~$ pwd\n/home/tania\ntania@debian7:~$ logout\nlaura@debian7:~$\n\
    ```\n注意 su 会让你进入家目录。\n\n- 7. 尝试创建一个新用户账户（当你使用普通账户时）。这应该是失败的。\n```\nlaura@debian7:~$\
    \ useradd valentina\nsu: useradd: command not found\nlaura@debian7:~$ /usr/sbin/useradd\
    \ valentina\nPermission denied.\nuserid: cannot lock /etc/passwd; try again later.\n\
    ```\nuseradd 可能位于 /sbin/useradd。\n\n- 8. 现在尝试相同操作，但在命令前加上 sudo。\n```\nlaura@debian7:~$\
    \ sudo /usr/sbin/useradd valentina\n[sudo] password for laura:\nlaura is not in\
    \ the sudoers file. This incident will be reported.\nlaura@debian7:~$\n```\n注意\
    \ laura 没有在该系统使用 sudo。\n\n## 第二章. 用户管理\n\n本章将教你如何使用 useradd、usermod 和 userdel\
    \ 来创建、修改和删除用户账户。\n\n你需要 Linux 上的 root 权限来完成本章。\n\n## 用户管理\n\nLinux 用户管理通过三种补充方式进行。你可以使用发行版提供的图形化工具。这些工具的外观和感受取决于发行版。如果你是家庭系统的\
    \ Linux 新手，请使用发行版提供的图形化工具。这可以确保你不会遇到问题。\n\n另一个选项是使用 useradd、usermod、gpasswd、passwd\
    \ 等命令行工具。服务器管理员可能会使用这些工具，因为它们在许多不同的发行中都是熟悉且相似的。本章将重点介绍这些工具。\n\n第三种极端的方法是使用 vi（或\
    \ vipw/vim）直接编辑本地配置文件。新手不要在生产系统上尝试这样做！\n\n## 2. /etc/passwd\n\n本地数据库（Linux 和 Unix\
    \ 系统上）是 /etc/passwd。\n\n```\n[root@RHEL5 ~]$# tail /etc/passwd\ning:518:524:art\
    \ dealer:/home/inge:/bin/bash\nann:519:525:flux player:/home/ann:/bin/bash\nderick:520:526:rubius:/home/frederik:/bin/bash\n\
    steven:521:527:roman peter:/home/steven:/bin/bash\npascale:522:528:artist:/home/pascale:/bin/bash\n\
    geert:524:530:kernel developer:/home/geert:/bin/bash\nwin:525:531:master daemon:/home/win:/bin/bash\n\
    sandra:526:532:radish stresser:/home/sandra:/bin/bash\nannelies:527:533:sword\
    \ fighter:/home/annelies:/bin/bash\nlaura:528:534:art dealer:/home/laura:/bin/bash\n\
    ```\n\n如你所示，该文件包含由冒号分隔的列。这些列包含用户名、x、用户 ID、主组 ID、描述、家目录名称和登录。\n\n可以通过输入 `man 5\
    \ passwd` 更多信息。\n\n```\n[root@RHEL5 ~]$# man 5 passwd\n```\n\n"
