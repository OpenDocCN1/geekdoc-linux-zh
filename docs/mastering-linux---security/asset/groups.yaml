    ## Chapter 12. introduction to SELinux


    Security Enhanced Linux or SELinux is a set of modifications developed by the
    United States National Security Agency (NSA) to provide a variety of security
    policies for Linux. SELinux was released as open source at the end of 2000. Since
    kernel version 2.6 it is an integrated part of Linux.


    SELinux offers security! SELinux can control what kind of access users have to
    files and processes. Even when a file received chmod 777, SELinux can still prevent
    applications from accessing it—file permissions are checked first!. SELinux does
    this by placing users in roles that represent a security context. Administrators
    have very strict control over access permissions granted to roles.


    SELinux is present in the latest versions of Red Hat Enterprise Linux, Debian,
    CentOS, Fedora, and many other distributions.


    ## 12.1. selinux modes


    selinux knows three modes: enforcing, permissive and disabled. The enforcing mode
    will enforce policies, and may deny access based on selinux rules. The permissive
    mode will not enforce policies, but can still log actions that would have been
    denied in enforcing mode. The disabled mode is selinux.


    ## 12.2. logging


    Verify that syslog is running and activated on boot to enable logging of deny
    messages in /var/log/messages.


    ```

    [root@rhel55 ~]# chconfig --list syslog

    syslog 0:off 1:off 2:on 3:on 4:on 5:off

    ```


    Verify that audit is running and activated on boot to enable logging of easier
    to read messages in /var/log/audit.log.


    ```

    [root@rhel55 ~]# chconfig --list audit

    audit 0:off 1:off 2:on 3:on 4:on 5:off

    ```


    If not activated, then run chconfig --levels 2345 auditd and see audit chart.


    ```

    [root@rhel55 ~]# service auditd status

    auditd (1660) is running...

    [root@rhel55 ~]# service syslog status

    syslog (2188) is running...

    klogd (1691) is running...

    ```


    The /var/log/messages log file will tell you that selinux is disabled.


    ```

    root@deb503~]# grep selinux /var/log/messages | grep -i Init

    Jun 25 15:59:32 deb503 kernel: [ 0.084083] SELinux: Initializing.

    ```


    Or it is enabled.


    ```

    root@deb503~]# grep selinux /var/log/messages | grep -i Init

    Jun 25 15:09:52 deb503 kernel: [ 0.084094] SELinux: Disabled.

    ```


    ## 12.3. activating selinux


    On RHEL you can use the GUI tool to activate selinux, on Debian this is the selinux-activate
    command. Activation requires a reboot.


    ```

    root@deb503~]# selinux-activate

    Activating SE Linux

    Searching for GRUB installation directory ... found: /boot/grub

    Searching for default file ... found: /boot/default

    Testing for an existing GRUB menu.list file found: /boot/grub/menu.list

    Searching for splash_image ... none found, skipping

    Found kernel: /boot/vmlinuz2.6.26-2-686

    Updating /boot/grub/menu.list ... done

    ```


    SE Linux is activated. You may need to reboot now.


    ## 12.4. getenforce


    Use getenforce to verify whether selinux is enforced, disabled or permissive.


    ```

    [root@rhel55 ~]# getenforce

    Permissive

    ```


    The /selinux/enforce file contains 1 when enforcing, and 0 when permissive mode
    is active.


    ```

    root@fedoral13 ~# cat /selinux/enforce

    root@fedoral13 ~#

    ```


    ## 12.5. setenforce


    You can use setenforce to switch between the Permissive or the Enforcing state
    selinux is activated.


    ```

    [root@rhel55 ~]# setenforce Enforcing

    [root@rhel55 ~]# getenforce

    Enforcing

    [root@rhel55 ~]# setenforce Permissive

    [root@rhel55 ~]# getenforce

    Permissive

    ```


    Or you could use 0 and 1 as argument.


    ```

    [root@centos65 ~]# setenforce 1

    [root@centos65 ~]# getenforce

    Enforcing

    [root@centos65 ~]# setenforce 0

    [root@centos65 ~]# getenforce

    Permissive

    [root@centos65 ~]#

    ```


    ## 12.6. sestatus


    You can see the current selinux status and policy with the sestatus command.


    ```

    [root@hel55 ~]# sestatus

    SELinux status:           enabled

    SELinuxfs mount:          /selinux

    Current mode:             permissive

    Mode from config file:    permissive

    Policy version:           21

    Policy from config file:  targeted

    ```


    ## 12.7. policy


    Most Red Hat server will have the targeted policy. Only NSA/FBI/CIA/DOD use the
    mls policy. The targeted policy will protect hundreds of processes but lets others
    run ''unconfined'' (= they can do anything).


    ## 12.8. /etc/selinux/config


    The main configuration file for selinux is /etc/selinux/config. When in permissive
    mode, the file looks like this. The targeted policy is selected in /etc/selinux/config.


    ```

    [root@centos ~]# cat /etc/selinux/config

    # This file controls the state of SELinux on the system.

    # SELinux can take one of these values:

    # enforcing - SELinux security policy is enforced.

    # permissive - SELinux prints warnings instead of enforcing.

    # disabled - SELinux is fully disabled.

    SELINUX=

    ```


    Standard Unix permissions use Discretionary Access Control which means a user
    owns a file can make it world readable by typing chmod 777. With SELinux the kernel
    will enforce Mandatory Access Control strictly controls what processes or threads
    can do (superseding DAC). Processes are confined by the kernel to the minimum
    access they require. SELinux is about labeling files, these are extended attributes,
    for processes this is managed by the kernel. The format of the labels is as follows:
    user:role:type:level.


    ## 12.9. DAC or MAC


    To see DAC permissions on a file, use ls -l to display user and group owner. For
    MAC permissions there is new option to ls. The output shows that file have a type
    of admin_home_t.


    ```

    [root@centos65 ~]# ls -Z

    -rw------- root system_u:object_home_t:s0 anaconda-ks.cfg

    -rw-r---- root system_u:object_home_t:s0 install.log

    -rw-r---- root system_u:object_home_t:s0 install.log.syslog

    [root@centos65 ~]# useradd -m pol

    [root@centos65 ~]# ls -Z /home/pol/.bashrc

    -rw-r---- unconfined_u:object_user_home_t:s0 /home/pol/.bashrc

    ```


    ## 12.10. Is


    There are also some other tools with the Z switch:


    ```

    mkdir -Z

    cp -Z

    ps -Z

    netstat -Z

    ```


    ## 12.11. -


    When selinux is active, there is a new file named /selinux. (You can compare it
    to /proc and /dev.)


    ```

    [root@centos65 ~] ls -1 /selinux/

    total 0

    -rw-rw-rw-. 1 root root 0 Apr 12 19:40 access

    dr-xr-xr-x. 2 root root 0 Apr 12 19:40 avc

    dr-xr-xr-x. 2 root root 0 Apr 12 19:40 Booleans

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 checkreqport

    dr-xr-xr-x. 83 root root 0 Apr 12 19:40 class

    --w--r--. 1 root root 0 Apr 12 19:40 commit_pending_pools

    -rw-rw-rw-. 1 root root 0 Apr 12 19:40 context

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 create

    -r--r--r. 1 root root 0 Apr 12 19:40 deny_unknown

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 disable

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 enforce

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 initial_contexts

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 load

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 policy

    -rw-rw-rw-. 1 root root 0 Apr 12 19:40 member

    dr-xr-xr-x. 1 root root 0 Apr 12 19:40 mis

    crw-rw-rw-. 1 root root 1,3 Apr 12 19:40 null

    dr-xr-xr-x. 2 root root 0 Apr 12 19:40 policy_capabilities

    dr-xr-xr-. 2 root root 0 Apr 12 19:40 policycyvers

    -r--r--r. 1 root root 0 Apr 12 19:40 reject_unknown

    -rw-rw-rw-. 1 root root 0 Apr 12 19:40 relabel

    -r--r--r. 1 root root 0 Apr 12 19:40 status

    -rw-rw-rw-. 1 root root 0 Apr 12 19:40 user

    ```


    Although files in /selinux appear with size 0, they often contain a boolean value.
    Check /selinux/enforce to see if selinux is running in enforced mode.


    ```

    [root@RHEL5 ~] ls -1 /selinux/enforce

    -rw-r--r. 1 root root 0 Apr 29 08:21 /selinux/enforce

    [root@RHEL5 ~] echo cat /selinux/enforce

    1

    ```


    ## 12.13. identity


    The SELinux identity of a user is distinct from the user ID. Identity is a part
    of security context, and via domains determines what you can do. The screenshot
    shows **root having identity user_u**.


    ```

    [root@rhel5 ~] id -z

    user_u:system_r:unconfined_t

    ```


    ## 12.14. role


    The selinux role defines the domains that can be used. A **role** is denied to
    a domain, unless the role is explicitly authorized to do so.

    '
  mdcn: '


    ## 第 12 章 SELinux 简介


    增强型 Linux（Security Enhanced Linux，简称 SELinux）是由美国国家安全局（NSA）开发的一系列修改版本，旨在为 Linux
    提供多种安全策略。SELinux 于 2000 年底开源发布。自内核 2.6 版本以来，它已成为 Linux 的集成部分。


    SELinux 提供了安全保障！SELinux 可以控制用户对文件和进程的各种类型访问权限。即使文件执行了 `chmod 777`，SELinux 仍然可以阻止应用程序访问它——文件权限会首先进行检查！SELinux
    通过将用户置于代表安全上下文的角色中来实现。管理员对授予角色的访问权限有非常严格的控制。


    SELinux 存在于最新版本的 Red Hat Enterprise Linux、Debian、CentOS、Fedora 以及许多其他发行版中


    ## 12.1. selinux 模式


    sellinux 包含三种模式：强制（enforcing）、允许（permissive）和禁用（disabled）。强制模式（enforcing mode）将执行策略，并可能根据
    selinux 规则拒绝访问。允许模式（permissive mode）不会执行策略，但仍可以记录在强制模式下会被拒绝的操作。禁用模式（disabled mode）即为禁用的
    selinux。


    ## 12.2. 日志


    确保 syslog 正在运行并在启动时激活，以便在 `/var/log/messages` 中记录拒绝访问的拒绝信息。


    ```

    [root@rhel55 ~]# chconfig --list syslog

    syslog 0:off 1:off 2:on 3:on 4:on 5:off

    ```


    确保 audit 正在运行并在启动时激活，以便在 `/var/log/audit.log` 中记录更易读的日志。


    ```

    [root@rhel55 ~]# chconfig --list audit

    audit 0:off 1:off 2:on 3:on 4:on 5:off

    ```


    如果没有激活，请运行 `chconfig --levels 2345 auditd` 并查看 audit 图表。


    ```

    [root@rhel55 ~]# service auditd status

    auditd (1660) is running...

    [root@rhel55 ~]# service syslog status

    syslog (2188) is running...

    klogd (1691) is running...

    ```


    `/var/log/messages` 日志文件将告诉你 selinux 已被禁用。


    ```

    root@deb503~]# grep selinux /var/log/messages | grep -i Init

    Jun 25 15:59:32 deb503 kernel: [ 0.084083] SELinux: Initializing.

    ```


    或者它已启用。


    ```

    root@deb503~]# grep selinux /var/log/messages | grep -i Init

    Jun 25 15:09:52 deb503 kernel: [ 0.084094] SELinux: Disabled.

    ```


    ## 12.3. 激活 selinux


    在 RHEL 上，你可以使用 GUI 工具激活 selinux；在 Debian 上，这是使用 `selinux-activate` 命令。激活需要重启。


    ```

    root@deb503~]# selinux-activate

    Activating SE Linux

    Searching for GRUB installation directory ... found: /boot/grub

    Searching for default file ... found: /boot/default

    Testing for an existing GRUB menu.list file found: /boot/grub/menu.list

    Searching for splash_image ... none found, skipping

    Found kernel: /boot/vmlinuz2.6.26-2-686

    Updating /boot/grub/menu.list ... done

    ```


    SE Linux 已激活。你现在可能需要重启。


    ## 12.4. getenforce


    使用 `getenforce` 验证 selinux 是处于强制、禁用还是允许模式。


    ```

    [root@rhel55 ~]# getenforce

    Permissive

    ```


    `/selinux/enforce` 文件在强制模式激活时包含 `1`，在允许模式激活时包含 `0`。


    ```

    root@fedoral13 ~# cat /selinux/enforce

    root@fedoral13 ~#

    ```


    ## 12.5. setenforce


    你可以使用 `setenforce` 在允许（Permissive）或强制（Enforcing）状态之间切换 selinux 激活后的状态。


    ```

    [root@rhel55 ~]# setenforce Enforcing

    [root@rhel55 ~]# getenforce

    Enforcing

    [root@rhel55 ~]# setenforce Permissive

    [root@rhel55 ~]# getenforce

    Permissive

    ```


    或者你可以使用 `0` 和 `1` 作为参数。


    ```

    [root@centos65 ~]# setenforce 1

    [root@centos65 ~]# getenforce

    Enforcing

    [root@centos65 ~]# setenforce 0

    [root@centos65 ~]# getenforce

    Permissive

    [root@centos65 ~]#

    ```


    ## 12.6. sestatus


    你可以通过 `sestatus` 命令查看当前的 selinux 状态和策略。


    ```

    [root@hel55 ~]# sestatus

    SELinux status:           enabled

    SELinuxfs mount:          /selinux

    Current mode:             permissive

    Mode from config file:    permissive

    Policy version:           21

    Policy from config file:  targeted

    ```


    ## 12.7. 策略 (policy)


    大多数 Red Hat 服务器将拥有目标（targeted）策略。只有 NSA/FBI/CIA/DOD 使用 mls 策略。目标策略将保护数百个进程，但允许其他进程以“无限制”（unconfined）模式运行（即它们可以做任何事）。


    ## 12.8. /etc/selinux/config


    SELinux 的主配置文件是 `/etc/selinux/config`。在允许模式下，该文件所示。目标策略在 `/etc/selinux/config`
    中被选择。


    ```

    [root@centos ~]# cat /etc/selinux/config

    # 此文件控制系统上 SELinux 的状态。

    # SELinux 可以取以下这些值之一：

    # enforcing - 强制执行 SELinux 安全策略。

    # permissive - SELinux 打印警告而不是强制执行。

    # disabled - SELinux 已被完全禁用。

    SELINUX=

    ```


    标准 Unix 权限使用自主访问控制（DAC），这意味着拥有一个文件的用户可以通过输入 `chmod 777` 使文件对所有人可读。在 SELinux 中，内核将强制执行强制性访问控制（MAC）严格控制进程或线程可以做什么（取代了
    DAC）。进程被内核限制在它们所需的最小访问权限。SELinux 关乎对文件进行标记，这些是扩展属性；对于进程，这由内核管理。标签的格式如下：`user:role:type`


    ## 12.9. DAC 与 MAC


    要查看 DAC 权限，使用 `ls` 查看文件和所有者。要查看 MAC 权限，使用 `ls -Z` 查看文件和类型。


    '
