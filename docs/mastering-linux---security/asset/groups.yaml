  mdcn: "\n\n## 4.9. 练习：用户配置文件\n\n- 1. 列出系统上所有的配置文件。\n2. 读取这些文件中的每一个内容，它们通常会加载额外的脚本。\n\
    3. 在这些文件中的每一个放置一个唯一的变量、别名（alias）和函数。\n4. 尝试几种获取 shell 的方法（su, su -, ssh, tmux,\
    \ gnome-terminal, Ctrl-alt-F1, ...），并验证你的自定义变量、别名和函数中有哪些存在于环境中。\n5. 你也知道它们的执行顺序吗？\n\
    6. 当一个应用程序依赖于 $HOME/.profile 中的某个设置时，$HOME/.bash_profile 是否存在会有影响吗？\n\n## 4.10.\
    \ 解决方案：用户配置文件\n\n- 1. 列出系统上所有的配置文件。\n\n```\nls -a ~ ; ls -l /etc/pro* /etc/bash*\n\
    ```\n\n- 2. 读取这些文件中的每一个内容，它们通常会加载额外的脚本。\n\n- 3. 在这些文件中每一个放置一个唯一的变量、别名（alias）和函数。\n\
    \n- 4. 尝试几种获取 shell 的方法（su, su -, ssh, tmux, gnome-terminal, Ctrl-alt-F1, ...），并验证你的自定义变量、别名和函数中有哪些存在于环境中。\n\
    \n- 5. 你也知道它们的执行顺序吗？\n\n```\n同名的别名、函数和变量将相互覆盖\n```\n\n- 6. 当一个应用程序依赖于 $HOME/.profile\
    \ 中的某个设置时，$HOME/.bash_profile 是否存在会有影响吗？\n\n```\n是有影响的。（man bash /INVOCATION)\
    \ \n```\n\n## 第 5 章 组\n\n用户可以被列在**组**中。组允许你在组层级设置权限，而无需为每个单独的用户都设置权限。\n\n每个 Unix\
    \ 或 Linux 发行版都会有一个管理组的图形化工具。建议初学者使用这种图形化工具。更有经验的用户可以使用命令行工具来管理组。某些发行版不允许混合使用 GUI\
    \ 和 CLI 工具管理组（如 Novell Suse 中的 YaST）。高级管理员可以使用 **vi** 或 **vigr** 直接编辑相关文件。\n\n\
    ## 5.1. groupadd\n\n可以使用 `groupadd` 命令创建组。下面的示例显示了创建五个（空）组。\n\n```\nroot@laika:-#\
