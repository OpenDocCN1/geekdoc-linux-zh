    4. 验证家目录是否已创建。

    5. 创建一个名为 erstwhile 用户，默认 shell 为 /bin/date。

    7. 登录 erstwhile 用户时会发生什么？你能想到将用户登录 shell 更改为应用程序的实用示例吗？

    8. 创建一个名为 welcome.txt 的文件，确保每个新用户在家目录都能看到此文件。

