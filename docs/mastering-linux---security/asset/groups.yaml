    ![](img/93b29716e9fc0b0730b4dac1126847e3_85_0.png)


    2. 设置第三台 Linux 计算机，带有三块网卡，一块在 leftnet 上，另一块在 rightnet 上。这台计算机将作为“路由器”。在下表中填写相关的名称、IP
    地址和 MAC 地址。


    表 10.1. 数据包转发练习


    | leftnet 计算机 | 路由器 | rightnet 计算机 |

    |---|---|---|

    | n | MAC | | | |

    | IP | | | |


    3. 你如何验证路由器默认是否允许数据包转发？测试从路由器 ping 到另外两台机器，以及从那两台机器 ping 到路由器。使用 `arp -a` 确保你连接的是正确的
    MAC 地址。


    4. 从 leftnet 计算机 ping 到 rightnet 计算机。在路由器上启用和/禁用数据包转发，并验证两个网络之间的 ping 发生了什么变化。如果你无法在两个网络（不同子网）之间进行
    ping，请使用 wireshark 或 tcpdump 等嗅探工具来发现问题。


    5. 使用 wireshark 或 tcpdump -xx 回答以下问题：当数据包通过过滤器时，源 MAC 地址会变化吗？目的 MAC 地址呢？


    6. 经过路由器时，两个 MAC 地址都会发生变化。使用如下所示的 tcpdump：


    ```

    root@router-# tcpdump -xx -i eth1

    root@router-# tcpdump -xx -i eth2

    ```


    ![](img/93b29716e9fc0b0730b4dac1126847e3_86_0)


    ## 10.15. 解决方案：数据包转发


