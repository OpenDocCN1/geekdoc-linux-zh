    ## 10.5. nat (网络地址翻译)


    **nat 设备**是一种同时会更改数据包中源地址和/或 IP 地址的路由器。它通常用于将私有地址范围 [rfc 1918] 内的多台计算机与（公网）互联网连接。**nat**
    可以从互联网隐藏私有地址。


    重要的一点是，人们和供应商在提到某种特定类型的 **nat** 时，并不总是使用正确的术语。请确保你讨论的是同一种东西。我们可以区分几种类型的 **nat**。


    ## 10.6. pat (端口地址翻译)


    **nat** 通常包含 **pat**。**pat 设备**是一种同时会更改数据包中源和/或目标 tcp/udp 端口的路由器。**pat** 是 Cisco
    的术语，在 Linux 的 **snat**、**nat**、掩装（masquerading）和**端口转发**（port forwarding）中使用。RFC
    3022其称为 **NAPT**，并将 **nat/pat** 组合定义为“传统 nat”。卖给你的 nat 设备可能同时执行 **nat** 和 **pat**。


    ## 10.7. snat (源地址翻译)


    **snat 设备**在数据包通过我们的 **nat** 配置时更改源 IP 地址。使用 iptables 的 **snat** 配置包含固定的目标源地址。


    ## 10.8. masquerading (掩装)


    **Masquerading**（掩装）是 **snat** 的一种形式，它使用公网 IP 地址隐藏私有网络的源 IP 地址。在动态互联网接口（宽带调制解调器/路由器）上常见。iptables
    的掩装配置使用动态目标源地址。


    ## 10.9. dnat (目的地址翻译)


    **dnat 设备**在数据包通过我们的 **nat** 时更改目的 IP 地址。


    ## 10.10. port forwarding (端口转发)


    当设置静态 **dnat** 以允许外部连接进入我们的私有网络时，我们将其称为**端口转发**。


    ## 10.11. /proc/sys/net/ipv4/ip_forward


    主机是否转发数据包在 `/proc/sys/net/ipv4/ip_forward` 中定义。以下截图显示了如何在 Linux 上启用数据包转发。


    ```

    root@router-# echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    下一个命令显示了如何禁用数据包转发。


    ```

    root@router-# echo 0 > /proc/sys/net/ipv4/ip_forward

    ```


    使用 cat 检查是否启用了数据包转发。


    ```

    root@router-# cat /proc/sys/net/ipv4/ip_forward

    ```


    ## 10.12. /etc/sysctl.conf


    默认情况下，大多数 Linux 计算机未配置自动数据包转发。要在系统启动时始终启用数据包转发，请将 `/etc/sysctl.conf` 中的 `net.ipv4.ip_forward`
    变量更改为 1。


    ```

    root@router-# grep ip_forward /etc/sysctl.conf

    net.ipv4.ip_forward = 0

    ```


    ## 10.13. sysctl


    欲更多信息，请查看 sysctl 的 man 页面。


    ```

    root@debian6-# man sysctl

    root@debian6-# sysctl -a 2>/dev/null | grep ip_forward

    net.ipv4.ip_forward = 0

    ```


    ## 10.14. 实践：数据包转发


    0. 在 VirtualBox 或 VMware 中添加网卡时，你可以选择（或创建）一个内部网络。使用此选项创建两个内部网络。我将它们命名为 leftnet
    和 rightnet，但你可以选择任何其他名称。


