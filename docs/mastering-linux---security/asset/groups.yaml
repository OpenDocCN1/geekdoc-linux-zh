    # Linux Security


    Paul Cobbat


    Paul Cobbat


    Publication date 2015-05-24 CEST


    # Abstract


    This book is meant to be used in an instructor-led training. For self-study, the
    intent is to read this book next to a working Linux computer so you can immediately
    do every subject, practicing each command.


    This book is aimed at novice Linux system administrators (and might be useful
    for home users who want to know more about their Linux system). However, this
    book is not meant as an introduction to Linux desktop applications like text editors,
    browsers, mail clients, multimedia or office applications.


    More information and free .pdf avail available at http://linux-training.be .


    Feel free to contact the author:


    +   * Paul Cobbat: paul.cobbat@gmail.com, http://www.linkedin.com/in/cobbat

    * Serge van Ginderachter: serge@ginys.be, build scripts; infrastructure setup;
    minor staff

    * Hendrik De De Vloed: hendrik.devloed@ugent.be, buildhelper.pl script


    Contributors to the Linux Training project are:


    +   * We''d also like to thank our reviewers:

    * Wouter Verhelst: wouter@grep.be, http://grep.be

    * Geert Goossens: mail.goossens.geert@gmail.com, http://www.linkedin.com/in/geertgoossens

    * Elie De Brauer: elie-de-brauer.be, http://www.de-brauer.be

    * Christophe Vandeplas: christophe@vandeplas.com, http://christophe.vandeplas.com

    * Bert Desmet: desmet@devnox.be, http://bdesmet.be

    * Rich Yonts: richyonts@gmail.com,


    Copyright 2007-2015 Paul Cobbat


    Permission is granted to copy, distribute and/or modify this document under the
    terms of the GNU Free Documentation License, Version 1.3 or any later version
    published by the Free Software Foundation; with no Invariant Sections, no Front-Cover
    Texts, and no Back-Cover Texts. A copy of the license is included in the section
    entitled ‘GNU Free Documentation License’.'
