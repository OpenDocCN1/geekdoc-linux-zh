    1. 设置两台 Linux 机器，一台在 leftnet 上，另一台在 rightnet 上。确保它们都在正确的子网中获取了 IP 地址。这两台机器对于“路由器”来说是“左侧”和“右侧”。


    这可以通过 `grep ip_forward /etc/sysctl.conf` 完成（1 表示启用，0 表示禁用）或 `sysctl -a | grep
    ip_forward`。


    2. 设置第三台 Linux 计算机，带有三块网卡，一块在 leftnet 上，另一块在 rightnet 上。这台计算机将作为“路由器”。在下表中填写相关的名称、IP
    地址和 MAC 地址。


    表 10.2. 数据包转发


    | leftnet 计算机 | 路由器 | rightnet 计算机 |

    |---|---|---|

    | 08:00:27:f6:ab:b9 | 08:00:23:1f:5a | 08:00:27:be:4a |

    | 192.168.60.8 | 192.168.60.1 | 192.168.70.9 |


    3. 你如何验证路由器默认是否允许数据包转发？测试从路由器 ping 到另外两台机器，以及从那两台机器 ping 到路由器。使用 `arp -a` 确保你连接的是正确的
    MAC 地址。


    你的 IP 地址 可能与表中不同。


    4. 从左侧计算机 ping 到右侧计算机。在路由器上启用和/禁用数据包转发，并验证两个网络之间的 ping 发生了什么变化。如果你无法在两个网络（不同子网）之间进行
    ping，请使用 wireshark 或 tcpdump 等嗅探工具来发现问题。


    你是否忘记为内网机器添加默认网关？使用 `route default gw ''ip-address''`


    ```

    root@left-# route add default gw 192.168.60.1

    root@right-# route add default gw 192.168.70.1

    ```


    当数据包转发启用且两个默认网关配置正确时，你应该能够进行 ping。当数据包转发禁用或网关配置不正确时，ping 将无法工作。


