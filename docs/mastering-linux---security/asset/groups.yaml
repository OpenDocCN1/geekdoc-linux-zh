    # 12.7. policy


    Most Red Hat server will have the targeted policy. Only NSA/FBI/CIA/DOD/HLS use
    the mls policy.


    The targeted policy will protect hundreds of processes, but lets others processes
    run ''unconfined'' (= they can do anything).


    # 12.8. /etc/selinux/config


    The main configuration file for selinux is /etc/selinux/config. When in permissive
    mode, the file looks like this.


    The targeted policy is selected in /etc/selinux/config.


    ```

    [root@centos6 ~]# cat /etc/selinux/config

    # This file controls the state of SELinux on the system.

    # SELINUX=can take one of these three values:

    # enforcing - SELinux security policy is enforced.

    # permissive - SELinux prints warnings instead of enforcing.

    # disabled - SELinux is fully disabled.

    SELINUX=permissive

    # SELINUXTYPE=Type of policy in use. Possible values are:

    # targeted - Only targeted network daemons are protected.

    # strict - Full SELux protection.

    SELINUXTYPE=targeted

    ```'
