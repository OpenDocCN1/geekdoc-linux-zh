    \      destination\nChain OUTPUT (policy ACCEPT)\n  target      prot opt source\
    \      destination\n[root@RHEL5 ~]#\n```\n\nAs you can see, all three chains in\
    \ the filter table are set to ACCEPT everything. ACCEPT is the default behaviour."
