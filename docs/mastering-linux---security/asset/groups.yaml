  mdcn: "\n\n# Linux 安全\n\nPaul Cobbat\n\nPaul Cobbat\n\n出版日期 2015-05-24 CEST\n\n\
    ## 摘要\n\n本书旨在用于导师指导的培训。对于自学而言，其意图是让读者在一台运行良好的 Linux 电脑旁阅读本书，以便能够立即操作每个主题并练习每个命令。\n\
    \n本书面向初级 Linux 系统管理员（也可能对想要了解更多 Linux 系统的家庭用户有用）。然而，本书并非关于 Linux 桌面应用程序（如文本编辑器、浏览器、邮件客户端、多媒体或办公软件）的介绍。\n\
    \n更多信息和免费的 .pdf 文件请访问 http://linux-training.be 。\n\n欢迎随时联系作者：\n\n- Paul Cobbat:\
    \ paul.cobbat@gmail.com, http://www.linkedin.com/in/cobbat\n- Serge van Ginderachter:\
    \ serge@ginys.be, 构建脚本；基础设施搭建；少量工作人员\n- Hendrik De De Vloed: hendrik.devloed@ugent.be,\
    \ buildhelper.pl 脚本\n\nLinux Training 项目的贡献者有：\n\n- 我们还想感谢我们的评审员：\n- Wouter Verhelst:\
    \ wouter@grep.be, http://grep.be\n- Geert Goossens: mail.goossens.geert@gmail.com,\
