    scope.


    ```

    answer = exp(2, 3)

    ```


    So when we call the function like above, the answer (base) is given back as the
    result and assigned to the variable “answer”.


    Conclusively, user defined functions can save a lot of time for programs that
    must repeatedly call a block of code. UDFs can just contain other functions, like
    our Happy Birthday UDF, or they can help simplify complicated code, such as our
    exponential multiplication UDF. You must remember that variables are defined within
    a scope that they cannot leave.  However, values can be passed from the main program
    to a UDF by supplying them as parameters, and values can return from a UDF by
    using the return keyword and assigning the result to a variable.'
