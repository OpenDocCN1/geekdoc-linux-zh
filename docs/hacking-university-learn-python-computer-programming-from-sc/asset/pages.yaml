  md: "# ## Decision Structures\n\nNow that the basics of Python 3 are explained,\
    \ we can begin to offer truly interactive programs by implementing decision structures\
    \ into our code. Decision structures are pieces of code (called conditional statements)\
    \ that evaluate an expression and branch the program down differing paths based\
    \ on the outcome. Observe the following example:\n\n```\n```\nuser_input = int(input(\"\
    What is 4 / 2? \"))\n\nif (user_input == 2):\n    print (\"Correct!\")\nelse:\n\
    \    print (\"Incorrect...\")\n```\n```"
