- pgno: 176
  md: '# # Advanced Terminal Concepts


    Mastering Linux comes down to intimate comprehension of the tools available in
    the OS and how to utilize them. Many of the topics discussed in this chapter will
    focus on more tasks and how to accomplish them, or a few QOL improvements to the
    OS in general.


    Compression and decompression of files often confuses Linux beginners. The tools
    are typically already installed, but the command line must be used. Furthermore,
    the strange .tar and .gz file-types are Linux-specific formats that you might
    often come across. All files can be unzipped or zipped with the gzip tool. Preinstalled
    on Ubuntu, we access it with the “tar” command. To compress a folder and the files
    contained within, navigate to it in terminal and type “tar -czvf name.tar.gz foldername”.
    C stands for “create”, z means “compress (gzip)”, v is for “verbose”, and f allows
    filename specification. If you want more compression (but at the cost of time),
    zip the folder with gzip2 by replacing the -z switch with the -j switch instead.


    Now extracting that same archive can be done with “tar -xzvf name.tar.gz”. You
    will notice that the -c was replaced with an -x, and this indicates extraction.
    Once again if you are dealing with bzp2 files use the -j switch instead.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Continuing with advanced terminal concepts, let us talk about a few quality
    tips and tricks that can save you time in the terminal. When typing a command
    or file name, press tab halfway through. This feature, tab completion, will guess
    what you are attempting to type and fill in the rest of the phrase. For files
    it will complete the name as shown in the directory, or complete a command by
    considering what you are trying to do. Linux experts and anyone that has to use
    the terminal regularly may seem as though they are typing exactly what they want
    with extreme accuracy and speed, but they are actually just using tab completion.


    Users, especially administrators, will spend a decent amount of time with the
    sudo command because their instructions require elevated privileges to run. But
    when typing out a long command and forgetting to type sudo, you will be angered
    at having to type it again. Instead simply type “sudo !!”, shorthand for “super
    user do again”. It generously saves from typing an entire command again.


    Another method of repeating commands is to use the up and down arrows. Pressing
    up continuously cycles through previously typed commands. You can also edit the
    commands with the left and right arrows to change the text contained within.


    And the most requested terminal tip involves copy and pasting. Attempting to paste
    a line into the terminal results in the strange character ^V. The keyboard shortcut
    is not configured to work in the terminal, and that is why the strange combination
    is displayed. To actually paste, right click and select the option; or use'
