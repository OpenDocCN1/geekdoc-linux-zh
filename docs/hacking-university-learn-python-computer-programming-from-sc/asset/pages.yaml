    \ user errors like this, and as an aspiring programmer you should always be expecting\
    \ the user to incorrectly input values whenever the chance arises.\n\n“And” is\
    \ a comparison operator that forces both parts of an expression to be true.  Another\
    \ operator, “or”, is used to force only one part of the expression to evaluate\
    \ to true.\n\n```\nelif (age == 25 or age == 50 or age == 75):   \nprint (\"Happy\
    \ quarterly birthday!\")\n```\n\nIf we were to put this elif within the above\
