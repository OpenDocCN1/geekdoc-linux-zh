  md: '# Common Errors


    Because many programmers choose Python as their first language to learn, they
    often succumb to a few common errors. If your applications are not functioning
    correctly, or if you are looking for a few of the best programming practices,
    than this section will help you. When code is run through Python, it may stop
    and return an error to you. By reading the error you can learn which line the
    error comes from, and usually Python will point (^) to the exact character that
    is wrong. Use the information that is given to you to understand your error and
    rectify the situation.


    Not specifying the correct parameters is a common newbie mistake. When putting
    values between the parentheses for a function, you must pay close attention to
    what kind of data it expects. Some functions require only integers, and some have
    2 or more parameters to enter. When in doubt, consult the Python documentation
    page for the specific function you are working with. Advanced IDEs, such as Atom
    and Eclipse often are programmed to display an example parameter list as you are
    typing out a function, and you can follow along with the example to know what
    each parameter is expecting.


    Sometimes we forget to convert user input to an integer. If we are prompting a
    user for numerical input, we must surround input() with int() for float(). Failure
    to do this will pass the input as a string, which will likely return an error.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'When comparing two values, Python requires the programmer to use the double
    equal sign (==). When assigning a value, you must use the single equal sign (=).
    Using an inappropriate sign for any occasion will always return a syntax error.


    After every comparison statement and loop (such as if, elif, else, for, while,
    def, and class) there is a colon (:). This colon denotes that the next line should
    be indented, and thus all indented lines will fall within the function''s scope.
    Failure to place a colon returns a syntax error.


    Strings and functions are usually surrounded by a pair of characters. Functions
    use parentheses, while strings use quotations to indicate where their boundaries
    are. If you ever forget to supply the closing character, Python will surely return
    an error.


    Beginners will often try to use functions that are not in Python by default without
    including the correct module. Trying to call an advanced math function, or editing
    a file directory is not possible with regular Python. Always place the import
    commands for modules you will use at the top of the program, or the application
    will simply not run.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Indentations are required in Python. Those coming from other programming languages
    will likely forget this and indent in their own personal style. This will break
    mostly all Python programs, because the interpreter expects a certain formatting
    standard. An error will be returned every time that indentations are incorrect.
    Pay close attention to your indentation levels or risk your program failing to
    logic and syntax errors.


    Programming languages demand perfect syntax at all times. Because of this, even
    a spelling error can be disastrous for our applications. Besides indentation problems
    and misspelled functions, giving the wrong variable name or accidentally calling
    the wrong function can make your program fail outright or perform unexpectedly.
    When coding, double check over your scripts to ensure no characters are out of
    place. Test your code after each implementation so you know that when an error
    occurs it should be coming from a new addition. Sometimes there is an error or
    bug in the code and it just cannot be rectified after reviewing the code. Programmers
    must “debug” their code by following it line-by-line at this point, “tracing”
    the path that the interpreter takes as it runs the program. Some IDE’s have tools
    for debugging, such as “breakpoints” or “line stops” that allow you to run each
    line at the click of a button. Taking the program slow like that can reveal the
    source of the issue most of the time, but it takes a keen eye and a dedicated
    troubleshooter to fix code.


    Many programmers consider it unnecessary, but commenting your scripts is an essential
    part of coding. Failure to do so is an extremely common beginner mistake that
    many first time programmers fail for. Once you master the art of Python and begin
    programming in a company with other coders, there might be multiple people working
    on the same script. Even the cleanest code'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'is confusing to look at for the first time, but comments help to demystify
    the complex characters. Moreover, coming back to an old script of yours from weeks
    past can feel like reading a foreign language- comments help you to quickly get
    back to coding. Many programmers put a comment as the top line of their program
    with a brief description of what the script does, when it was written, and any
    contributors to it. That way the next time you are quickly looking through files
    trying to find a certain program, the comments can help you understand what is
    inside without actually running or deciphering the code.


    The final common mistake that runs rampant in Python newbies is variable naming.
    If it has not already been brought to light in your experimentation, there are
    just certain names that you cannot name your variables. “Reserved ” words such
    as class, break, print, and, or, while, etc... are keywords that cannot be used
    for a variable name. If Python detects their use a syntax error will occur. Besides
    errors, though, programmers often use bad form when naming their variables. Avoid
    ambiguous and simple variable names such as “number” or “var1” in favor of descriptive
    one such as “user_input” or “totalNumberOfDogs”. These variables explain their
    use at a glance, so a verbose programmer will never misuse a variable or have
    to check what its intent is. Python programmers typically use the underscore method
    to name their variables (grade_average, dog_1), but camelCase is acceptable as
    well (userInput, multiAnswer). No matter which method is used, a skillful programmer
    will always make the name descriptive.'
  merge: -1
  img_proc: true
