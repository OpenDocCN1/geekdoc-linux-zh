- pgno: 27
  md: '# Variables


    Computers have the ability to “remember” data by storing the values as variables.
    Variables are RAM locations that are set aside to contain a value. Programming
    languages must specifically declare variables and assign them by writing code.
    Being able to manipulate data will prove to be a valuable asset when creating
    applications.


    Creating a variable is known as “declaration”. Giving a value is known as “assigning”.
    Python simplifies the process by combining the two concepts into a single statement.
    Within a program the following line will create a variable:


    ```

    ```

    lucky_number = 7

    ```

    ```


    And then we can use the print function to view the variable we created.


    ```

    ```

    print (lucky_number)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Because Python starts at the top of a program and works downwards, the above
    lines need to be in the correct order. If lucky_number is not first created, then
    print() will return an error for attempting to call a variable that does not yet
    exist.


    An important distinction that can be made is seen when closely viewing the previous
    print() parameter. The variable lucky_number is not placed within quotations,
    so Python knows to print the value contained within (7). If we placed quotations
    around the text, Python would print “lucky_number”, which was not our intended
    result. This situation is referred to as a logic error.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "# ## Variable Types\n\nVariables can contain values of multiple types. Our\
    \ first variable was assigned a numerical value, but Python has methods for handling\
    \ values of different types as well.\n\n```\nsecret_message = “rosebud”\n```\n\
    \n```\nprint (secret_message)\n```\n\nAs shown above, we can assign a string of\
    \ text to a variable as well. The process is nearly the same, but notice the quotations\
    \ around the value that explicitly indicate a string. Here are the most important\
    \ data types in Python 3:\n\n+   - Integer – Simple numerical value as a whole\
    \ number.\n+     - 1, 0, -7\n+   \n+   - Float – Decimal value. “Floating Point\
