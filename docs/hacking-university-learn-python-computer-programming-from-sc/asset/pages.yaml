- pgno: 21
  md: '# ## Setting up a Development Environment


    Programming languages are typically used on Linux-based operating systems such
    as Ubuntu and Debian. Python is no exception, but there is another option of developing
    on Windows. This book will explain how to get both set up. It is important to
    know though, that we will develop with Python 3, rather than the older (but still
    extremely popular) Python 2.7.


    Most Linux distributions actually come with Python installed by default. Therefore,
    there are no extra setup procedures to obtaining a working environment. The Python
    interpreter can be entered by typing “python” into a terminal console. If there
    are multiple versions installed, though, “python” will start the first one found.
    Check the version number in the interpreter, and if 2.7 launches you might have
    to type “python3” into the terminal instead. Press ctrl+c to quit out of the interpreter
    at any time.


    Windows computers usually never have Python preinstalled. To obtain the software,
    navigate to the Python website and download the most recent version. As of now,
    Python 3.5.2 is the current version. So long as your version number is Python
    3, the code written in this book should also be compatible. Install the software
    with mostly default settings. Definitely check the “Add Python to the Path”, because
    it simplifies testing programs. After the installer is done the Python interpreter
    can be started by searching for “python” in the start menu.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The interpreter, or parser, is one of Python''s advertised features that allows
    for individual lines to be written and run. For testing out code the parser is
    fantastic, but mostly every program we write in this book will be multiline, so
    we will need an IDE (integrated Development Environment). Windows has a few popular
    solutions, such as Atom, Pycharm, and Eclipse. These are all 3rd party applications
    that can be downloaded and installed. IDEs are essentially glorified text editors
    that offer helpful programming features such as syntax highlighting and command-completion.
    Although Atom is highly recommended for Windows developers, Python comes with
    an IDE solution already. IDLE is an interpreter program that can be made multiline
    by clicking on "file" and then "new file". Whether you choose to use the preinstalled
    editor or choose to get a full-fledged programming environment through Atom/Eclipse,
    the Python code will work just the same. You will write your code within one of
    the multiline programs.


    On Linux you also have the option of downloading a Python-compatible IDE application,
    but most programmers tend to use the preinstalled application "nano". Nano is
    a built-in, barebones text editor accessible by typing "nano" into a console.
    The program can actually do some rudimentary syntax highlighting once it knows
    a Python script is being written, so many developers prefer the basic setup provided.
    Code is written into nano, then saved by pressing ctrl+x.


    Now that there is a development environment set up, you can continue onwards to
    begin writing your first Python program.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# **Hello World**


    Mostly every programmer gets introduced to a new language by writing the “Hello
    World” program. Hello World is traditionally a simple exercise that involves displaying
    the titular text on the screen. To do it in Python, we must open up our IDE or
    text editor and simply type the function.


    ```

    print (“Hello, World!”)

    ```


    Next, we save the file. In IDLE (and most IDEs such as Atom) one must go through
    “file” and click “save as”. In Nano ctrl+x must be pressed. Name the file with
    a “.py” extension and save it in an easily accessible directory- your desktop
    is perfectly fine. For this demonstration we will name the file "test.py".


    Running a Python file differs slightly between platforms. Windows must use the
    command prompt, while Linux must use the terminal. Open up the respective application
    (ctrl+R and then cmd for Windows, ctrl+T for Linux). These applications are text-based
    interfaces that can be used to navigate and interact with a computer. The printed
    line will tell which directory you are currently located in, and you can type
    “dir” in Windows or “ls” in Linux to display a list of files in that directory.
    Move to another folder by typing “cd” followed by the directory name. Since we
    have saved the file to the desktop,'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'on both operating systems we can make it active by typing “cd Desktop”. Finally,
    the Hello World script can be run by typing “python test.py” or “python3 test.py”
    (on Linux).


    If the above programming code was copied exactly, the output “Hello, World!” will
    be seen. The program will run and then exit back to terminal/prompt. Not entirely
    glamorous, but a worthy first step into learning Python.'
  merge: -1
