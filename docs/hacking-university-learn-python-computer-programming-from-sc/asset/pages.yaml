    “name” does not exist outside of the user defined function, and any attempts to
    call it will result in an error. This is because variables have scopes of operation,
    which are areas in which they can be accessed. “Name” has a variable scope that
    is specific to the function, so it will not ever be called outside of it. Similary,
    any variables declared in the main program cannot directly be accessed by the
    user defined function, but rather they must be passed as parameters when calling
    the function. Follow along with the next exercise to see an example for an in-depth
    analysis on user defined functions (UDFs).'
