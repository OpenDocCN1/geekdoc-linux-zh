    \ base\n```\n\n上述是一个 UDF，它根据两个提供的值（底数和指数）计算指数乘法的结果。return 关键字将一个变量传回主程序，这就是我们绕过变量作用域限制的方法。\n\
    \n```python\nanswer = exp(2, 3)\n```\n\n因此，当我们像上面那样调用函数时，答案（base）作为结果被传回并赋值给变量“answer”。\n\
    \n总之，用户自定义函数可以为需要反复调用代码块的程序节省大量时间。UDF 可以仅包含其他函数，就像我们的 Happy Birthday UDF 一样；或者它们可以帮助简化复杂的代码，例如我们的指数乘法\
    \ UDF。你必须记住，变量是在它们无法离开的作用域内定义的。然而，值可以通过作为参数提供的方式从主程序传递到 UDF，并且值可以通过使用 return 关键字并将结果赋值给变量从\
    \ UDF 返回。\n\n# 示例程序 5 – project5.py\n\n```python\ndef cm_to_inch(cm):\n    inch\
    \ = cm * 0.39\n    return inch\n\ndef inch_to_cm(inch):\n    cm = inch * 2.54\n\
    \    return cm\n\nprint(\"Inch/cm converter\")\nprint(\"1: Convert cm to inch\"\
    )\nprint(\"2: Convert inch to cm\")\n\nchoice = int(input(\"Enter a menu option:\
    \ \"))\n\nwhile (choice != 1 and choice != 2):\n    print(\"Invalid, try again.\"\
    )\n    choice = int(input(\"Enter a menu option: \"))\n\nif (choice == 1):\n \
    \   user_input = int(input(\"Enter cm: \"))\n    print(\"{} cm is {} inches.\"\
    .format(user_input, cm_to_inch(user_input)))\n\nif (choice == 2):\n    user_input\
    \ = int(input(\"Enter inches: \"))\n    print(\"{} inches is {} cm.\".format(user_input,\
    \ inch_to_cm(user_input)))\n\nprint(\"Thank you for using the program.\")\n```\n\
    \n作业程序：\n\n- 将你已编写的程序转换为使用 UDF 的形式\n\n## 类\n\n类是 Python 的一个特性，使它更接近于某些更复杂的编程语言。由于可以放入类中的特性之多，它们本质上是“程序中的程序”。此外，使用类进行组织是良好的编程规范。Python\
    \ 等面向对象的语言偶尔会通过此类概念展示其对象根源，其中对象以“object.attribute”（对象.属性）的形式包含属性。请参阅以下示例以理解。\n\
    \n```python\nclass student:\n    def __init__(self, name, grade):\n        self.name\
    \ = name\n        self.grade = grade\n        self.gpa = 0.0\n```\n\n我们创建的类称为“student”，student\
    \ 包含自己的变量。类为我们提供了一种组织对象并赋予它们个人属性的方式。因此，而不是将 student1_name, student1_grade, student2_grade\
    \ 等作为不同的变量，它们可以通过属于一个类来整合。在程序中，类声明位于最顶部。就像 UDF 一样，它在被调用之前不会在主程序中实际运行。\n\n```python\n\
    student1 = student(\"Tim\", \"Freshman\") # object is student1, an attribute is\
    \ \"name\".\n```\n\n我们新声明的“student”类用于创建具有属性“Tim”和“Freshman”的 student1 对象。这以前可能需要两行代码，但使用类后大大精简了。类将对象的相应变量的分隔开来，使得每个声明的“student”都拥有\
    \ 3 个属性：“name”、“grade” 和 “gpa”。我们的类声明的第二行包含 __init__，这是一个“方法”（用户自定义函数），在创建 student\
    \ 类中的对象时运行。Init 的参数是创建该对象时所需的参数。Self 实际上不是参数，它只是指代“student”，但“name”和“grade”是必需的，这就是为什么我们在创建“student1”时包含了它们。student1\
    \ 的属性可以这样调用：\n\n```python\nprint(student1.name)\n```\n\n这将简单打印“Tim”。我们在 student1\
    \ 初始化期间没有声明 GPA 变量，因此我们可以通过赋值语句来声明它。\n\n```python\nstudent1.gpa = 4.0\n```\n\n\
    或者更改一个已存在的属性。\n\n```python\nstudent1.grade = \"Sophomore\"\n```\n\n如果我们创建另一个对象，它将拥有完全不同于\
    \ student1 的一组自己的属性。\n\n```python\nstudent2 = student(\"Mary\", \"Senior\")\n\
    ```\n\n虽然 student1.grade 和 student2.grade 共享相同的变量名，但它们的值不同。对于具有多个重复变量的大型项目，类可以减少代码杂乱程度以及需要跟踪的变量名数量。\n\
    \n回顾我们自定义的类，我们可以对其进行扩展，以在类内部实现用户自定义函数。\n\n```python\nclass student:\n    def __init__(self,\
    \ name, grade):\n        self.name = name\n        self.grade = grade\n      \
    \  self.gpa = 0.0\n\n    def record(self):\n        return \"Student {} is a {}\
    \ with a {}\".format(self.name, self.grade, self.gpa)\n\nstudent3 = student(\"\
    Lily\", \"Junior\")\nstudent3.gpa = 3.67\nprint (student3.record())\n```\n\n`__init__`\
    \ 保持不变，但我们添加了一个名为“record”的 UDF 定义。它传递参数 self（因为它必须指代该类）并返回一个格式化字符串。在我们的实际主程序中创建\
    \ student3。最后，我们调用 UDF student3.record()（对象.函数）。它返回我们的格式化字符串，因此由 print() 打印出来。\n\
    \n"
