  mdcn: '

    服务器通常安装 Linux，因为其可靠性以及各发行版内部包含的功能。例如，Linux 机器被用作防火墙，因为 “iptables” 应用程序提供了出色的端口封锁和智能过滤功能。你本人也可以在你的系统上运行防火墙应用程序，从而免费获得企业级软件。通过这种方式，Linux
    也非常适合网络应用。只需安装相关应用程序，该机器就可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。


    最后，Linux 系统并不局限于我们迄今所见的界面。每个发行版都有其首选的桌面环境，但界面可以极大地根据个人的喜好进行定制。终端甚至拥有文件浏览器和网页浏览器，这对于使用
    SSH 或远程计算的用户非常有帮助。总之，你应该尝试不同的桌面环境（DE），通过安装并将其配置成你喜欢的样子来体验。


    ## 接下来做什么及结论


    你如何继续取决于你想用你的 Linux 发行版做什么。对于休闲浏览和简单使用，请继续使用 Ubuntu 并安装你需要的程序。对于更具冒险精神的人，考虑安装一个新的发行版，看看各自提供什么。希望更深入地了解
    Linux 的人可以安装 Arch 或 DSL 等系统，从头开始构建自己的独特操作系统。管理员和高级用户可以安装发行版的服务器版本来构建自己的 Linux
    网络，或者可以考虑将其环境从其他操作系统完全更改为免费的操作系统。


    总之，Linux 是一套功能强大且相对易用的操作系统。但其真正的潜力来自于难以掌握的终端和命令行功能。感谢你阅读本篇刊物，希望它能对这一事实上的替代操作系统这一神秘主题带来一些启发。如果
    Linux 让你感到困惑或未能达到预期，我恳请你再次审视其提供的功能。虽然它可能不具备同等品质的游戏或第三方专有软件，但该系统足够简单且可定制，可以作为主操作系统使用，或许将
    Windows 或 OSX 作为次要操作系统。几乎每个程序都有替代方案，因此如果有可能完全摆脱微软和苹果，强烈建议这样做。再次感谢，并请善用你新获得的 Linux
    知识。


