    \n## 循环\n\n正如条件语句在表达式评估为真时激活一样，循环条件也比较表达式中的值。但是，虽然 if、elif 和 else 语句本质上是线性的，其他条件句具有重复运行代码块的能力。“循环”是可以沿程序执行多次的条件语句，它们允许在\
