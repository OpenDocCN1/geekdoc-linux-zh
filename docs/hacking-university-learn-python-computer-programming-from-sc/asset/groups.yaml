    Linux 的机会，而无需移除你的主操作系统，所以利用这个机会去探索 Linux 发行版的工作方式。


    ## Ubuntu 基础


    与 Windows 类似，Ubuntu 拥有桌面图形用户界面。应用程序在窗口中打开，这些窗口可以被最大化、最小化、关闭和移动，并具有顶部栏。Ubuntu 也有某种形式的“任务栏”，其功能与其在
    Windows 中的对应物非常相似——图标类似于可以通过点击启动的程序。任务栏上的“Windows 按钮”（称为“Dash 按钮”）用于打开搜索功能，你可以从中输入计算机上程序或文件的名称以快速启动它。


    此外，屏幕顶部有一个栏，其作用类似于其他操作系统的“菜单”栏。当某个程序处于活动状态时，诸如“文件”、“编辑”、“帮助”等下拉菜单将在此处显示。


    除了少数细微差异外，Ubuntu 的功能方式非常熟悉。事实上，许多你可能在其他操作系统上已经使用的程序，例如 Firefox，在 Linux 发行版中是可用的，有时甚至是预装的。经过足够的尝试和实践，你将能够操作
    Ubuntu 的图形界面，就像专业人士一样。继续探索系统，如果你准备好用这个 Linux 系统替换你的主操作系统，请继续。


    ## 安装 Linux


    在桌面上，你会看到一个“安装 Ubuntu 16.04 LTS”图标。双击它会启动一个使安装变得非常简单的应用程序。如果你没有连接互联网，现在请通过插入以太网线或点击右上角图标连接到
    Wi-Fi 来连接。选择你的语言并点击“继续”。下一个提示将询问你是否希望在安装操作系统期间下载更新并安装第三方软件。对于初学者来说，强烈建议勾选这些选项，然后点击“继续”。


    应用程序将转到另一个屏幕，询问你的安装方法。有各种选项，例如完全擦除磁盘、与主操作系统并行安装，或更新以前版本的 Linux。选择最适合你的选项。如果你仍然对完全切换感到犹豫，选择将
    Ubuntu 安装为你的次要操作系统。该选项将允许你在 BIOS 屏幕后选择要引导进入哪个操作系统。无论如何，选择你的选项并点击“立即安装”。


    当 Ubuntu 安装时，你可以指定一些其他选项，例如你的时区、计算机名称、账户名称和密码。整个安装过程不会花费太长时间，但足够长，以至于如果你的计算机是笔记本电脑，应该确保其连接电源。完成后，操作系统将需要重启。恭喜，你现在计算机上拥有一个可用的
    Linux 系统。在此出版物的后续章节中，我们将重点介绍 Linux 概念、如何完成特定任务以及如何进一步扩展你对系统的知识。


    ## 管理硬件和软件


    在 Linux 中，硬件的管理实际上比在 Windows 中简单得多。你不需要为设备下载单独的驱动程序，因为大多数驱动程序都内置在操作系统本身中。这意味着大多数流行设备可以简单地安装，无需其他步骤即可使用。打印机、网络、硬盘和其他常见设备都已包含在内——在
    Linux 上通常不需要摆弄驱动程序。


    然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能发挥最高效率。因为虽然你的显卡默认可以在 Linux 上工作，但其内部秘密且通常隐藏的技术只能通过该公司的软件完全利用。在
    Ubuntu 上，过程很直接——打开“附加驱动程序”应用程序，让操作系统为你搜索。在确定你是否拥有这些设备后，它会询问你要使用哪个版本的驱动程序。按照屏幕提示启用第三方驱动程序。对于未显示的设备，请在制造商网站上进行互联网研究，以确定他们是否发布了你可以下载的特定
    Linux 驱动程序。


    软件是 Linux 优于 Windows 的另一个方面。就像苹果电脑一样，Ubuntu 拥有某种应用商店，你可以从中搜索与你设备兼容的应用程序库，并只需点击几下即可下载和安装。只需从
    Dash 中搜索“Ubuntu 软件中心”以打开该应用程序。在那里，你可以浏览诸如“游戏”、“办公”或“系统”等个别类别以查看程序列表，也可以直接按名称搜索。找到程序后，点击它，然后点击“安装”加入下载队列。验证身份后，软件将自动下载并安装。之后，你可以在
    Dash 中搜索该应用程序来运行它。


    通过终端安装软件的另一种方法也是可用的，但我们将稍后讨论。Ubuntu 并非完全限于应用商店中的软件，因为从互联网下载的程序也可以安装。同样，我们将在讨论终端之后涉及该主题。


    总的来说，在 Ubuntu 中管理硬件和软件毫不费力。无论是安装新的硬件设备还是下载流行的程序，Linux 发行版都能让你的计算体验无忧无虑。这并不意味着
    Linux 完全适合初学者，因为正如我们将了解到的，Linux 绝对是高级用户和有经验的管理员的良好选择。


    '
