    \n## 继承\n\n在您更健壮和广泛的程序中，可能会使用多个相关的类。作为一个例子，想象一下一个必须对网络上的设备进行分类的程序。每种设备类型（台式机、笔记本电脑、电话等……）都会有自己的类，但你最终会发现自己在重复常用属性。台式机和笔记本电脑都将具有名称、部门和本地\
    \ IP 地址，但它们也会有几个特定的变量，例如笔记本电脑的 Wi-Fi 和台式机的显卡。\n\n通过一个称为“**继承**”的过程，类可以放入父子关系中，其中某些父类属性可以被子类“继承”。有效地跨类共享属性导致更优雅的组织以及总体上更少的代码。\n\
    \n```python\nclass device:\n    \n    total_devices = 0\n    \n    def __init__(self,\
