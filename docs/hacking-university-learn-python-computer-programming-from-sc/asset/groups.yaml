    \ (rng == 3):\n    print(\"Look both ways before crossing.\")\nelif (rng == 4):\n\
    \    print(\"Call your relatives...\")\nelif (rng == 5):\n    print(\"You will\
    \ get a phone call.\")\nelse:\n    print(\"Future cloudy... Try again.\")\n```\n\
    \n作业项目：\n\n- 创建一个 “sampler”（采样器）程序，展示各种 Python 模块功能。\n\n## 常见错误\n\n由于许多程序员选择 Python\
    \ 作为他们学习的第一门语言，他们往往会犯一些常见的错误。如果你的应用程序未能正确运行，或者你在寻找一些最佳的编程实践，那么本节将帮助你。当代码通过 Python\
    \ 运行时，它可能会停止并向你返回错误。通过阅读错误信息，你可以了解错误源自哪一行代码，通常 Python 还会指出（^）错误的确切字符。利用提供的信息来理解你的错误并纠正情况。\n\
    \n未指定正确的参数是新手常见的错误。在函数括号内填入值时，必须密切关注它期望的数据类型。有些函数只需要整数，有些则需要输入 2 个或更多参数。如有疑问，请查阅\
    \ Python 文档页面，查找你正在使用的特定函数的说明。先进的集成开发环境（IDE），如 Atom 和 Eclipse，通常被编程为在输入函数时显示示例参数列表，你可以跟随示例了解每个参数期望什么。\n\
    \n有时我们会忘记将用户输入转换为整数。如果我们提示用户输入数值，我们必须用 int() 或 float() 包围 input()。不这样做会将输入作为字符串传递，这很可能导致返回错误。\n\
    \n在比较两个值时，Python 要求程序员使用双等号（==）。在赋值时，你必须使用单个等号（=）。在任何场合使用不合适的符号都将导致语法错误。\n\n在每个比较语句和循环（如\
    \ if、elif、else、for、while、def 和 class）之后都有一个冒号（:）。这个冒号表示下一行应该缩进，因此所有缩进行都将落在该函数的作用域内。未放置冒号会导致语法错误。\n\
    \n字符串和函数通常被一对字符包围。函数使用括号，而字符串使用引号来指示其边界。如果你忘记提供闭合字符，Python 肯定会返回错误。\n\n初学者通常会试图使用\
    \ Python 默认不包含的函数，而未包含正确的模块。尝试调用高级数学函数或编辑文件目录在常规 Python 中是不可能完成的。始终将将要使用的模块的 import\
    \ 命令放在程序顶部，否则应用程序将无法运行。\n\nPython 需要缩进。来自其他编程语言的开发者可能会忘记这一点，并按照自己的个人风格进行缩进。这将破坏大多数\
    \ Python 程序，因为解释器期望遵循特定的格式标准。每次缩进不正确时都会返回错误。密切关注你的缩进级别，否则你的程序可能会因逻辑和语法错误而失败。\n\
    \n编程语言随时都要求完美的语法。因此，即使是一个拼写错误对我们的应用程序也可能造成灾难性后果。除了缩进问题和函数拼写错误外，使用错误的变量名或误调用错误的函数都会导致你的程序完全失败或表现异常。在编码时，仔细检查你的脚本，确保没有字符错位。每次实现新功能后测试你的代码，这样当发生错误时，你知道错误应源自新增加的内容。有时代码中存在错误或\
    \ bug，在审查代码后仍无法修复。此时，程序员必须通过逐行跟随代码路径来“调试”他们的代码，“跟踪”解释器在运行程序时经过的路径。一些 IDE 具有调试工具，例如“断点”或“行停止”，允许你通过单击按钮逐行运行。像这样慢慢运行程序通常能揭示问题的根源，但修复代码需要敏锐的观察力和专门的故障排除能力。\n\
    \n许多程序员认为这是不必要的，但为脚本添加注释是编码过程中必不可少的一部分。未能做到这一点是极其常见的新手错误，许多初次接触编程的人都会因此失败。一旦你掌握了\
    \ Python 的艺术，并开始在公司与其他开发者一起编程，可能有多个开发人员正在编写同一个脚本。即使是最整洁的代码\n\n"
