    \ 是否为 2，如果是，则立即执行下一行代码。比较使用 `==` 运算符而不是 `=` 运算符。双等号检查相等性，而单等号仅用于赋值变量。最后，if 语句后跟一个冒号。\n\
    \n缩进在 Python 中广泛用于分隔代码块。在 if 语句下方是一个带有制表符的 `print()` 函数行。因为该行使用了制表符缩进，所以它不会在代码中正常运行。相反，只有当条件\
