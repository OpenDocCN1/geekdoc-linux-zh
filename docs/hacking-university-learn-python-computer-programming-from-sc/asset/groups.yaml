    与专有软件的区别在于，FOSS 中一切都是开放的，使用它没有隐藏的间谍软件、费用或陷阱。由于任何人都可以 contribute 于现成的源代码并使其变得更好，软件通常更加安全。由于
    Linux 以及您可以为它下载的大多数软件都是免费的，它是一个非常适合小型企业或预算有限的个人用户的操作系统。不收取费用当然不会牺牲质量，因为 Linux
    项目及其各种发行版是由社区驱动并通过捐赠资助的。相比之下，Windows 的成本往往高达数百美元，仅操作系统本身就需要花费这么多。Microsoft Office
    是一个流行的文档编写程序套件，但价格也很高。在 Linux 中存在这些程序的免费替代品，并且它们在质量上绝对可以与大品牌产品相媲美。


    也许 PC 所有者最大的抱怨之一是病毒。Windows 计算机特别容易受到病毒的攻击，即使反病毒软件公司也总是在不断追赶最新的威胁。通常只需访问一个恶意网站就足以感染计算机，许多用户选择
    Mac 计算机，是因为与恶意软件相关的事故频率要低得多。基于 Linux 的操作系统与 Mac 类似，病毒几乎不存在。这种增强的安全性使得对于任何关注隐私、安全性或可靠性的人来说，切换到
    Linux 都是必须的。


    Linux 在企业和政府机构中非常流行。这是因为高性能服务器和关键设备在使用 Linux 作为操作系统时运行得非常好。该操作系统以可靠性和稳定性著称。虽然
    Windows 计算机需要定期重启和维护以“刷新”系统并保持其运行速度，但 Linux 服务器可以运行数月甚至数年而无需重启。IT 专业人士因为其声誉而不可避免地选择
    Linux 作为其网络的骨干。其闻名的稳定性也可用于桌面平台，对我们来说也非常有用。


    使用 Linux 的最大好处可能是速度。较低的系统要求意味着那些在 Windows 上通常缓慢迟钝的计算机在 Linux 上会变得快捷敏捷。那些对计算机变慢感到沮丧的用户可以更换操作系统，以获得更具响应性的体验。此外，Linux
    可以安装在较旧的计算机上，使其焕发新生。因此，即使那台旧笔记本电脑对于最新版本的 Windows 来说可能太过时了，但也可能会找到一个 Linux 发行版，能再延长它几年的使用寿命。


    定制性是技术领域中备受追捧的功能。Windows，尤其是 OSX，出于担心普通用户会破坏系统的顾虑，限制了你能对操作系统进行定制的程度。Linux 并非如此，它鼓励用户编辑和更改操作系统的视觉和功能。当然，这并不是必须的，大多数
    Linux 发行版的默认配置极其稳定，很难无意间将其弄坏。但对于那些喜欢越狱、模组化和折腾电脑的人来说，Linux 可以激发他们的创造力，甚至为好奇的黑客提供在其他系统中无法获得的工具访问权限。


    最后，Linux 与大量设备兼容。Linux 几乎可以在任何架构上运行，这意味着它可以安装在手机、台式机、笔记本电脑、服务器、游戏主机和“智能”设备上。爱好者们喜欢仅仅因为他们可以，就只是在冷门、老旧或古怪的设备上安装
    Linux。对于普通用户来说，这意味着 Linux 很可能与你的计算机兼容。


    总体而言，Linux 在许多方面胜过主流操作系统。所有这些因素都使 Linux 成为您计算机的更佳选择，您应该使用它来获得这些备受推崇的功能。艺术家、黑客、创意人士、小型企业主、技术人士、非技术人士以及几乎所有人都能找到喜欢
    Linux 的理由。广泛的发行版意味着每个人都适合某些，所以今天就安装 Linux，看看你能从中获得什么。


    ## Linux 发行版


    安装 Linux 可以通过几种方式进行，例如将操作系统镜像刻录到光盘、写入 USB 驱动器、在线订购 Live CD、格式化 SD 卡，或者通过 Virtual
    Box 试用。但最终，你不能只是安装“Linux”就有一个可用的操作系统。因为 Linux 只是内核，你还需要其他软件，如图形用户界面、互联网访问等。如前所述，存在“Linux
    发行版”。发行版是包含预装程序、独特风格和重点的 Linux 版本。发行版采用 Linux 的核心，使其成为一个适合日常使用的完整操作系统。


    有令人目眩数量的发行版。有些具有特定用途，例如用于黑客攻击的 Kali Linux、用于教育的 Sugar Linux，或用于定制的 Arch Linux。另一些则更通用，例如
    Ubuntu 和 Debian。要想从安装 Linux 中获得最大收益，你需要了解不同的发行版并选择最适合你的。阅读以下部分，以了解一些最流行的发行版用于什么用途。


    Ubuntu 是撰写本文时最知名的发行版。在 2000 年代，它因用户友好和直观而获得普及。基于早期的 Debian 发行版，Ubuntu 在使用上与 Windows
    计算机非常相似，这意味着它是 Linux 新手的一个绝佳选择。因此，我们将在本书后面安装一个 Ubuntu 变体。Canonical Ltd 是积极开发 Ubuntu
    的公司——年度版本更新意味着操作系统始终与时俱进，并可与新兴技术配合使用。尽管如此，Ubuntu 在许多旧设备上仍能保持合理的速度运行。可以从某种“商店”安装应用程序，这意味着初学者无需理解通常复杂的命令行。总之，Ubuntu
    发行版是初次使用 Linux 用户的绝佳选择，你应该安装它以了解 Linux 的工作原理，而无需深入研究更难的发行版。


    对于更具体的计算案例，Ubuntu 有多个子发行版或“风味”。这些是以 Ubuntu 为基础但重点不同的发行版，例如 Lubuntu 对轻量级应用程序的重视。以下是一些例子：


    - Lubuntu – 专为在较旧的硬件或资源有限的计算机上运行而设计的 Ubuntu 版本。安装文件小于 1GB，硬件要求比标准 Ubuntu 低得多。使用此发行版来振兴旧计算机，同时保留
    Ubuntu 的易用性。


    - Ubuntu Studio – 面向艺术家的 Ubuntu，包括数字画家、声音制作人和视频编辑人员。Ubuntu Studio 是 Ubuntu，但预装了编辑工具。


    - Kubuntu – 使用 KDE 桌面环境重新封装的 Ubuntu。Kubuntu 的外观和感觉与经典 Ubuntu 不同，因为它提供了一个更传统的桌面环境，类似于其他操作系统。


    - Xubuntu – 另一种轻量级发行版，不像 Lubuntu 那样极简。Xubuntu 牺牲了尺寸和硬件要求，以提供一个在较旧但并非太旧的计算机上也能工作的操作系统。它肯定比其他极简
    Linux 发行版更具美感，并且也使用 Ubuntu 作为基础，以提供易用性和熟悉感。


    - Ubuntu Server – 更适合工业和企业需求的 Ubuntu 变体。Ubuntu Server 可以无头运行，并为网络中的其他 Linux 系统提供功能。


    - Mythbuntu – 预装了电视流媒体和实时电视节目的变体。这是将旧计算机通过 Kodi 转换为“智能电视”设备的绝佳发行版。


    总之，Ubuntu 发行版的广泛范围意味着每个人都有适合入门的操作系统。强烈建议利用 Ubuntu 中的易用性功能和通用熟悉度。它作为跳板


