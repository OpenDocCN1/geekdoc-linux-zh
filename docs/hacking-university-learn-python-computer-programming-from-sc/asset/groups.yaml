    \ 是一个提供时间记录功能的模块。\n\n```python\nimport datetime\ncurrent_time = datetime.datetime.now()\n\
    print(current_time.hour)\nprint(current_time.minute)\nprint(current_time.second)\n\
    ```\n\n通过 datetime 提供的其他功能包括：\n\n- year（年）\n- month（月）\n- day（日）\n\n或者是 os，这是一个解锁操作系统函数以修改文件的模块。下面是一个创建新文件夹并将其设置为当前活动目录的小型程序。\n\
    \n```python\nimport os\nos.mkdir(\"folder\") #make folder\nos.chdir(\"folder\"\
    ) #go into folder\nos.chdir(\"..\") #up one directory\n```\n\nos 提供更多可用函数的列表如下。\n\
    \n- os.rmdir() – 删除指定文件夹\n- os.remove() – 删除指定文件\n- os.path.exists() – 检查指定文件是否存在\n\
    - os.rename() – 将指定文件重命名为提供的第二个参数\n\n还有其他非常实用的模块，例如 random、statistics 和 pip，它们可以为你的\
    \ Python 应用程序提供以前无法实现的新功能。Python 还支持下载和使用用户创建的模块，但这属于此处未涵盖的高级概念。\n\n## 示例程序 8\
