    ```\n只要指定条件评估为真，“while” 代码块就会持续运行。我们可以通过上面的程序看到一个完美的例子。我们创建了一个新变量 “answer” 并反复将其与\
    \ 2 进行比较。只要 answer 不等于 2，程序就会询问用户正确答案。输入 2 以外的任何值都会循环回到 while 语句，再次提示正确答案。如果 while\
    \ 最终评估为真（因为 answer 等于 2），循环将打破，程序将恢复并打印 “Correct”。\n\n通过“嵌套”条件可以进一步增强程序。单个缩进表示为\
    \ while 语句保留的代码块，但我们可以进行第二级缩进以添加额外的比较。\n\n```python\nanswer = 0\nwhile (answer\
    \ != 2):\n    answer = int(input(\"What is 4 / 2? \"))\n    if (answer != 2):\n\
    \        print (\"Incorrect...\")\nprint (\"Correct!\")\n```\n该程序使用“嵌套”函数将 if\
    \ 语句纳入 while 语句中。由此获得的纯粹可能性数量几乎是无限的。注意存在决定哪些代码块可以在哪些函数内运行的缩进级别。每个意图块，无论是 1 级还是\
    \ 2 级缩进，都将在 while 循环激活时运行。这是一个难以掌握的概念，但肯定能增加功能。\n\n另一种常见的循环是 “for” 循环。For 与 while\
    \ 不同，因为 for 循环遍历一系列数字或一组值，而不是检查条件。\n\n```python\nfor user_variable in range (1,\
    \ 5):\n    print (user_variable)\n```\n\nFor 采用指定的变量 \"user_variable\" 并使用提供的范围。该变量将初始化为\
    \ 1，并且每次函数循环时都会迭代。通过观察输出，我们可以看到它是如何工作的。\n\n1\n2\n3\n4\n\nUser_variable 被打印出来，然后递增为\
    \ 2。它再次被打印并作为 3 递增。再一次用于 4。但它到达 5 并停止，这就是为什么 5 没有被打印出来。\n因为使用了关键字 \"range\"，for\
    \ 循环总是从第一个数字开始并在第二个数字停止。省略它将使 for 循环遍历给定的值。\n\n```python\nfor user_variable in\
    \ (1, 5):\n    print(user_variable)\n```\n\n例如，这里只省略了 \"range\"，但输出非常不同。\n\n"
