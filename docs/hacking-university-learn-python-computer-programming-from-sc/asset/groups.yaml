  - '[PAGE 181]


    # I/O Redirection


    During normal terminal command execution, “normal input” (typed by the user, or
    read from a file/attribute/hardware) is entered and parsed by the command. Sometimes
    the command has “standard output” as well, which is the return text shown in the
    terminal. In “ls”, the standard input is the current working directory, and the
    standard output is the contents of the folder.


    Input and output are normally direct, but by using I/O redirection we can do more
    with the terminal. As an example, the “cat” command (concatenate) followed by
    a file will output that file to the screen. Running cat by itself opens a parser
    where any line that is input will be immediately output (use ctrl+d) to quit.
    But with I/O redirection hotkeys (<, >, <<, >>, |) we can redirect the output
    to another source, such as a file. And “cat > test.txt” will now put the standard
    output in that new file. Double signs signify appending, so “cat >> test.txt”
    will place the output at the end of the file rather than erasing the contents
    at the beginning.


    The vertical line character, or the “pipe”, uses another form of I/O redirection
    to take the output of one command and directly insert it into the input of another.
    “ls | sort -r” would take the output of ls and sort it into a backwards list.
    We redirected the output and gave it to another command to accomplish this.'
  - '[PAGE 182]


    And finally, the “grep” command is used very often within I/O redirection. Grep
    can search for a certain string within a specified file and return the results
    to standard output. Using redirection, this output can be put into other commands.
    An interesting feature of Linux to note is that object is a file, even hardware.
    So our CPU is actually a file that stores relevant data inside of it, and we can
    use grep and other tools to search within it. That example is fairly advanced,
    but here is a simpler instance:


    ```

    “grep Conclusion report.txt”

    ```


    And it will search within the file for that specific word. I/O redirection can
    become a complicated process with all of the new symbols and commands, but it
    is a feature that you can incorporate into your scripts and daily use that often
    allows for certain features and functions of Linux to be done in a single line.


    Linux and the terminal are difficult concepts to fully master. But with practice
    and continuing dedication you will be able to perform masterful feats of computing
    and do helpful tasks that are not possible in Windows or OSX. Learning more about
    commands and how to use them certainly helps in this regard, so persist in your
    studies of new commands and their use. Positively the only command you actually
    need to memorize is “man”, a command that will show the manual pages and documentation
    of any other command specified. The manual pages show switches, examples, and
    the intended use of every command on your system. Use the tool to your advantage
    and gain intimate knowledge of your system.'
