    操作系统，它将逐步带你了解 Linux。务必将其安装为你的第一个 Linux 体验。


    Linux Mint 是 Linux 世界中使用率极高的操作系统。“功能强大且易于使用”，Mint 包含自由及开源软件（FOSS）和专有软件，旨在为 Linux
    初学者提供完整的体验。虽然它并不完全像传统的 Linux 发行版，但 Mint 是初次尝试替代操作系统的极佳选择。它始终位居使用最广泛的操作系统之列，其默认布局与
    Windows 非常相似，从而便于用户平滑过渡到 Linux 世界。


    Debian 是最古老的 Linux 发行版之一，创建于 1993 年。结合 Linux 的理念，Debian 将稳定性和坚固性作为指导开发的主要原则。毫无疑问，Debian
    长期存在的事实是成熟度的标志，因此，寻求无错误和故障体验的用户可以转向 Debian。自由和开源软件在 Debian 中也有立足之地，因为其包含的大多数软件都是
    FOSS。但这并不意味着你受到限制，因为针对 Adobe Flash 等专有程序，Debian 有一个官方的非自由软件仓库。对于初学者来说，Debian 是一个不错的选择，但
    Ubuntu 仍然是最好的入门级操作系统。安装 Debian 以获得稳定性、FOSS 和完全纯粹的 Linux 体验。


    Slackware 是一个比 Debian 历史更悠久的操作系统。它贴近原始 Linux 的意图，这意味着你需要自行安装图形用户界面（GUI）和程序依赖项。正因如此，Slackware
    主要面向中级 Linux 用户，初学者会被其不熟悉的方法弄得困惑。然而，如果你想体验一个更接近 UNIX 根源的 Linux 发行版，Slackware 可以满足你的需求。


    Fedora 是一个更侧重于工作站和商务用途的操作系统。即使是 Linux Torvalds 本人也是 Fedora 的用户，这归功于该操作系统的流行和实用。Fedora
    更新非常频繁，意味着它始终处于最新状态，并走在 Linux 技术的前沿。安全和 FOSS 也是该操作系统的重点，这就是为什么它通常用于小型企业的终端计算机上。尽管使用
    Fedora 可能会带来一些挑战，因此将其视为中级操作系统。


    Arch Linux 是另一个发行版，但主要设计给经验丰富的用户。该操作系统以一个系统框架的形式提供，用户可以按自己的喜好进行定制，仅添加他们想要的程序和服务。由于这一特点，Arch
    的设置较为困难，但也是一种有益且具学习价值的体验。通过构建您个人的系统，您将理解那些在高级发行版中被隐藏的深度 Linux 概念。在熟练掌握基础知识后，再安装这个高级操作系统。


    最后，还有大量其他独特的发行版值得一提。在以下列表中，我们将讨论其中几个。请注意，发行版数量众多，仅描述每一种利基用途就足以填满整本书。


    - CrunchBang – 这是一个基于 Debian 的发行版，旨在降低资源消耗。它简单且不包含某些发行版默认附带的一些臃肿软件。CrunchBang
    运行速度快，计算效率高。

    - Android – 流行的手机操作系统实际上是一种 Linux 变体。由于许多手机的规格低于完整的台式电脑，因此该操作系统非常适合笔记本电脑、触摸屏设备或家庭媒体中心电脑。此外，你可以使用
    Play 商店中的许多 Google 应用，这意味着数千种应用、游戏和实用工具可供你在手机和电脑上使用。虽然不建议将其作为你的第一个 Linux 操作系统，但它绝对是实验旧电脑或儿童电脑的一个有趣选择。

    - Chrome OS – 这是 Google 开发的另一种移动类型操作系统，Chrome OS 本质上是一个轻量级的 Linux 浏览器，用于在线使用。Google
    在其 ChromeBooks 上预装了此操作系统，这些设备的规格低于其他笔记本电脑。但该操作系统实际上只是一个全屏的 Chrome 浏览器，因此非常适合希望获得简单体验或专用互联网机器的用户。

    - Tiny Core – 这是一个以兆字节为计量单位的操作系统，Tiny Core 适用于古董计算机或嵌入式设备。此操作系统主要面向拥有爱好项目或专用目的的中级用户。

    - Damn Small Linux – 另一种极简 Linux 变体，此操作系统最适合快速访问 Linux 命令行。

    - openSUSE – 这是面向经验丰富计算机用户的发行版。拥有许多管理员和程序开发者工具，openSUSE 是自信于自身技能用户的最佳操作系统。


    基于 Linux 内核的操作系统数量之多令人惊叹。面对巨大的选择范围，你可能会困惑该从哪里开始以及如何安装。如有疑问（如我们将很快演示的），请安装 Ubuntu
    或其变体。该操作系统非常适合初学者，并能使过渡到 Linux 的过程更加顺畅。但随着你技能的提高并希望了解更多 Linux 知识，你随时可以安装另一个操作系统。


    ## 启动 Linux


    如果你准备投身于基于 Linux 的发行版，你必须做的第一件事是备份文件。在硬盘上覆盖操作系统将擦除其中包含的任何数据，这意味着在过渡之后，你必须备份希望保留的任何图片、音乐或文件。使用外部硬盘或在线数据存储站点（例如
    Google Drive）来临时存放你的文件。我们对丢失重要数据不承担责任，请务必备份！


    接下来，我们需要选择一个操作系统。本书将以 Ubuntu 16.04 作为扩展示例，建议你也照做。访问 Canonical 的官方网站（[http://www.ubuntu.com](http://www.ubuntu.com)）并获取操作系统副本。你将把镜像从该网站下载到你的计算机。


    接下来我们需要获取安装介质。这可以是 DVD、USB 驱动器、SD 卡或你的计算机可以读取的任何其他可写介质。唯一的限制是设备必须能够容纳与操作系统下载文件大小相当的镜像，因此
    4GB 应该足够了。清空驱动器中的所有文件，因为它也将被格式化。


    下载用于写入镜像文件的工具。对于 DVD，安装 Imgburn（[http://www.imgburn.com/](http://www.imgburn.com/)）；对于闪存介质，下载
    Rufus（[https://rufus.akeo.ie/](https://rufus.akeo.ie/)）。最常见的操作系统安装方法是使用 4GB USB
    驱动器，且更推荐使用此方法。插入你的介质，启动相应的程序，选择已下载的操作系统镜像，并开始写入过程。这需要一些时间，因为需要使该介质上的镜像具有启动能力。完成后，你可以完全关闭计算机。


    这是确认你准备好安装 Linux 的关键时刻。检查文件是否已备份，理解你将擦除当前的操作系统，并最好手边准备一张 Windows/OSX 安装光盘，以防你决定切回。如果你确实准备切换，请继续。


    在仍然插入安装介质的情况下，打开计算机。你将看到的第一个屏幕是 BIOS / UEFI POST 屏幕，它会提示你按下某个键盘按键以进入设置。此屏幕在每次启动时都会显示，但你可能从未关注过它。按下指示的键进入
    BIOS 设置。如果你反应太慢，屏幕将会消失，你平时的操作系统将开始加载。如果发生这种情况，只需重新关闭计算机并再次尝试。


    进入 BIOS / UEFI 后，你需要导航到“启动顺序”设置。每台计算机的 BIOS / UEFI 略有不同，因此我们无法详细解释该过程。但通常，你可以遵循屏幕底部的按键提示来了解如何导航。到达启动顺序设置后，


