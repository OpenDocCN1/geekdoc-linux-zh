  mdcn: "\n另一行缩进的代码位于 else 代码块内，如果用户没有正确输入“Python”，这两行代码都会执行。这个程序确实比较了字符串，因此文本必须被引号包围。\n\
    \n## 条件运算符\n\n双等号（==）只是可用于创建条件表达式的众多运算符中的一个。下面的小列表展示了 Python 中的其他运算符。\n\n- `>`\
    \ - 大于\n- `<` - 小于\n- `==` - 等于\n- `>=` - 大于或等于\n- `<=` - 小于或等于\n- `!=` - 不等于\n\
    \nIf 语句评估括号内的表达式是否为真；上述运算符允许构建一些有趣的表达式。\n\n```python\nage = int(input(\"How old\
    \ are you? \"))\n\nif (age <= 18):\n    print (\"Starting early! Good for you!\"\
    )\nelse:\n    print (\"Ah, a good age to learn.\")\n\nprint (\"Thank you for downloading\
    \ this book.\")\n```\n\n这里巧妙地使用了缩进。如果用户的年龄是 18 岁或以下，程序将祝贺他们，然后跳过 else 语句，最后打印感谢信息。如果用户年龄超过\
    \ 18 岁，它将显示 else 消息，然后也会感谢他们。无论哪个条件分支被执行，用户都会收到感谢信息。缩进决定了在决策结构中哪些代码行实际会运行，你必须密切关注这一点以避免逻辑错误。\n\
    \n对于需要两种以上潜在结果的情况，可以使用关键字 \"elif\"。\n\n```python\nage = int(input(\"How old are\
    \ you? \"))\nif (age <= 18 and age > 0):\n    print (\"Starting early! Good for\
    \ you!\")\nelif (age >= 80):\n    print (\"Never too late to learn!\")\nelif (age\
    \ > 18 and age < 80):\n    print (\"Ah, a good age to learn.\")\nelse:\n    print\
    \ (\"That seems like an invalid age.\")\n    quit()\n\nprint (\"Thank you for\
