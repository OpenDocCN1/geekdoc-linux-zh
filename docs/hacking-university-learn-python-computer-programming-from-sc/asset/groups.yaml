  mdcn: "\n# 输入\n\n虽然迄今为止所学的内容很有趣，但预定的应用程序对最终用户来说并不是很有用。不过，Python 允许我们从用户那里获取输入，从而在我们的脚本中增加一层交互性。`input()`\
