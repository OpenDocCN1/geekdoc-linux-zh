    ## 命令行 / 终端


    在现代计算机出现之前，硬件和软件仅通过键盘进行交互。鼠标带来了图形界面并简化了这一过程，但为了避免向最终用户展示复杂的选项，许多功能仍保持仅限文本操作。在
    Linux 中，这一过程至今仍在继续。虽然大多数发行版都配有图形用户界面（GUI），但每个 Linux 发行版也内置了基于文本的界面，用户可以通过该界面输入并执行强大的命令。可以将终端视为功能强大得多的命令提示符，因为你可以完全仅通过终端来使用你的计算机。只要具备足够的知识，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等等。


    通过从 Dash（应用搜索栏）启动终端或使用快捷键 Ctrl+Alt+T 来开启终端。一个紫色窗口将打开并等待你的输入。你可以输入命令并按下回车键使其生效。对于我们的第一个命令，请输入“ls”。这是“list”（列出）的缩写，它会显示当前目录中的所有文件。你将能够看到
    Home（Ubuntu 的主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入“pwd”来打印当前工作目录并显示你当前正在浏览的文件夹名称。随着你学习命令，记下它们有助于更好地内化其用法。


    ### 管理目录


    目录（Directories），即文件夹的另一个名称，其工作方式与其他操作系统相同。文件夹存放文件，你必须当前正在访问某个目录，才能操作其中的文件。你可以使用终端命令“cd”来更改目录并在文件系统中移动。例如，在
    Home 文件夹中键入“cd Desktop”会将你转移到该文件夹。此时使用“ls”将不会显示任何内容（除非你在桌面上添加了文件）。若要返回，请键入“cd
    ..”。请尝试以这种方式在文件系统中练习导航；cd 进入一个目录并使用 ls 查看文件。


    由于你是在输入命令，Linux 期望你的输入是精确的。如果你拼错了一个命令，它 simply 不会工作；如果你错误地输入了文件夹或文件名称，它将尝试引用一个不存在的对象。在使用终端时，请仔细检查你的输入。


    打开文件使用不同的命令——“.”（点）。点用于启动指定的文件，因此，如果你试图打开一张图片，可以这样做：“./house.png”。点和斜杠都是必需的，因为它们表示你在运行当前目录内的一个文件。当你运行一个文件时，它将使用分配给该文件类型的默认应用程序打开，因此在图片的情况下，它很可能在图像查看器中打开。


    你还可以通过终端创建和删除目录及文件。在此示例中，导航到 Home 目录。作为快捷方式，你可以输入“cd ~”将目录更改为你的 Home，因为波浪号键（~）是“当前用户的家目录”的缩写。使用“mkdir”命令创建一个目录；键入“mkdir
    Programming”以创建一个带有该标题的新文件夹。你可以 cd 进入该目录，或者你可以转到 GUI 并进入该目录，以证明你确实创建了一个新文件夹。现在，通过转到
    Home 并键入“rmdir Programming”来删除该目录。Linux 会毫不犹豫地删除指定的目录。类似地，使用“rm”可以删除指定的文件。


    Linux 有一种设计哲学，许多用户并不习惯。在 Windows 和 OSX 中，操作系统几乎总是会在你开始执行诸如删除文件或卸载程序等操作之前双重确认。Linux
    发行版认为，如果你发起了一个事件，你绝对打算将其执行到底。它通常不会确认删除某物，也不会显示任何确认消息（如“文件成功删除”）。相反，没有消息通常表示过程已成功完成。虽然这种哲学有些危险（因为你可能会在没有警告的情况下破坏你的操作系统安装），但它与其他操作系统形成了设计上的对比。Linux
    给予你完全的控制权，并且它从不因为某些选项可能太复杂而试图隐藏任何东西或模糊选项。这需要一些时间来习惯，但大多数用户都认为，被你所拥有的技术尊重是一种令人耳目一新的改变。


    然而，这并不会损害安全性，因为任何关键操作都需要“sudo”命令作为前缀。Sudo 代表“super user do”（超级用户执行），这意味着拥有最高权限的用户正在请求执行以下命令。任何
    sudo 条目都需要管理员密码，因此恶意软件或无心的键盘狂人如果不知道密码，就无法意外造成损害。本书中使用的许多命令都需要 sudo 权限，因此如果命令因提示权限不足而无法完成，你可以使用
    sudo 重试。


    ## Apt


    学习终端可以打开 GUI 中不可用的计算机功能。此外，通过键入而不是点击，你可以缩短完成许多任务所需的时间。例如，考虑安装一个程序所需的工作量。如果你想下载
    Google Chromium 浏览器，你必须打开软件中心，输入程序名称，找到正确的包，标记其进行安装，并执行该操作。将其与在终端中键入“sudo apt-get
    install chromium-browser”进行比较。仅通过这一条命令，Ubuntu 就能为你节省许多分钟。


    Apt（高级打包工具）是与在 Ubuntu 中管理应用程序相关的命令。其他发行版可能使用自己的工具，但 apt 因其庞大的仓库和简单的命令而常被使用。使用“apt-get
    install”格式安装包，其中你指定希望安装的程序名称。在上述示例中，我们使用包名“chromium-browser”指定 Chromium 程序。鉴于你不知道所有的包名，还有另一个命令“apt-cache
    search”，可用于查找与提供的字符串匹配的包名。因此，“apt-cache search chromium”将显示“chromium-browser”，你就可以指定正确的名称进行安装。


    Apt 的实用性不仅限于此，因为你还可以使用几条命令来更新系统上的每一个应用程序。使用"apt-get update"刷新仓库，然后使用"apt-get upgrade"让每个应用程序升级到最新版本。Windows
    操作系统用户应该会羡慕这种简便的过程，因为更新 Windows 程序需要卸载并以最新版本重新安装。


    随着时间推移，你可能需要更新 Ubuntu 版本。每年都有一个新发布版，可以使用"apt-get dist-upgrade"进行安装。保持与最新修复和功能更新同步，可确保你的
    Linux 系统长期保持健康运行。你甚至可能已经注意到，安装和更新系统不需要重启；这一特性有助于 Linux 计算机实现漫长的正常运行时间和稳定性。最后，使用"apt-get
    remove"后跟包名来移除应用程序。


    要运行我们安装的程序，我们可以从 dash 中搜索它们，或者直接在终端中键入包名。键入"chromium-browser"与双击其图标一样启动它。有些程序必须通过键入包名从命令行启动，因为包在
    dash 搜索中不会显示。总体而言，利用终端是一种节省时间的好方法，也是练习摆脱缓慢且笨重的图形用户界面的一种方式。


    轻松地安装和管理包是 Linux 的一项功能，极具实用性——掌握它以提升你的体验。还有第三种安装包的方法，涉及从互联网下载并启动 .deb 文件。


