    \ 块中的任何代码都会在首次创建对象时被激活。\n\n还存在其他特殊方法，它们在触发不同事件时被调用。\n\n-   `__del__` - 每当对象被删除（del）时调用。也称为**析构方法**。\n\
    -   `__str__` - 当对象作为字符串传入时调用\n-   `__setattr__` - 每次属性被设置值时运行\n-   `__delattr__`\
    \ - 与 setattr 相同，但仅在属性被删除时运行\n\n添加这些特殊方法可以展示它们何时运行。\n\n```python\nclass student:\n\
