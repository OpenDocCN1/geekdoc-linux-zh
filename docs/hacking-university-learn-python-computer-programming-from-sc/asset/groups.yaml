    初次看可能会令人困惑，但注释有助于解析复杂字符。此外，几周后回过头看你以前的脚本，感觉就像在读一门外语——注释能帮助你快速回到编程状态。许多程序员会在程序的第一行添加注释，简要描述脚本的功能、编写时间以及贡献者。这样一来，下次你快速浏览文件试图找到某个特定程序时，注释能帮你理解内部内容，而无需实际运行或解读代码。


    Python 新手中最常见的最后一种错误是变量命名。如果在你自己的实验中没有被指出来，某些名称是禁止用于变量命名的。“保留”字，如 `class`、`break`、`print`、`and`、`or`、`while`
    等，是关键字，不能用作变量名。如果 Python 检测到这些用法，就会发生语法错误。除了错误之外，程序员在命名变量时还经常使用不规范的形式。避免使用模糊和简单的变量名，如“number”或“var1”，而应使用描述性名称，如“user_input”或“totalNumberOfDogs”。这些变量一目了然地解释了它们的用途，因此健谈的程序员绝不会误用变量或需要检查其意图。Python
    程序员通常使用下划线法来命名变量（grade_average, dog_1），但 camelCase 也是可接受的（userInput, multiAnswer）。无论使用哪种方法，熟练的程序员总是会让名称具有描述性。


    ## 结论


    再次感谢您下载这本 Python 入门指南。现在你已经读完了正文，你已具备如何运作 Python 的基本知识，并且应该能够编写自己的程序。你可以通过尝试创建更大、更复杂的程序，或者研究模块并学习新函数来进一步增加知识。如果你喜欢这本书，请在亚马逊上评分并留下评论，以便生产更多高质量的书籍。


