    ## 就业市场


    作为一种流行语言，且由于其广泛的使用，Python 岗位非常丰富。无论是大型公司还是初创企业，都在寻找懂得 Python 的程序员，而且由于 Python
    的使用率仍在持续增长，就业前景将会继续向好。


    大多数公司对编程岗位并不要求大学学历，因为他们明白大多数程序员是自学成才的。正因为如此，在 Python 就业市场中找到工作并不困难，但这仍然需要程序员自身的准备和投入。年轻的
    Python 程序员仅仅通过展示学习的热情，就能在谷歌、苹果、英特尔等公司获得实习机会。成年 Python 程序员可以通过直接联系公司或回复招聘启事来申请编程工作。请在消息板、招聘网站和自由职业网站（如
    UpWork）上搜索机会。此外，在编程社群中询问并参加招聘会，以了解哪些公司正在招聘 Python 程序员。


    请制作一份得体的简历，并准备好用这门语言证明你的知识。编程工作的面试流程通常包含“白板”编程测试，其中你会面临一个情境，并被要求使用 Python 来解决该问题。这些测试不会太难，但你肯定需要对
    Python 有相当的了解才能通过。


    总体而言，由于当前的市场环境，找到 Python 工作很容易；但也很难，因为你需要熟悉 Python。请致力于申请尽可能多的职位，最终总会有一份工作找上门来。


    ## Python 的历史


    Python 是一种起源于 1980 年代末的编程语言。其创建者  Guido van Rossum 希望开发一门语言作为业余项目，以取代 ABC 编程语言。借鉴了流行的
    C 语言的特点，Python 被创建为一种强大但易于理解的脚本语言。


    “脚本语言”这一术语指的是编写的代码实际上并没有被编译，而是由应用程序进行解释。通常这意味着脚本语言远不如实际的编程语言强大。但对于 Python 来说，情况恰恰相反——该语言仍然是可用于
    Web 服务器和桌面客户端的最强大语言之一。Python 的开发贯穿整个 1990 年代，直到 2000 年发布 2.0 版本。Python 背后的解释器变得足够复杂，使得当前版本的
    Python 几乎与低级编程语言无法区分。


    从 2000 年代中期甚至到现在，Python 继续由 Guido van Rossum 和一群敬业的志愿者开发。由于诸多优势，该语言获得了极大的普及，YouTube、Reddit
    和 Instagram 等知名网站甚至使用 Python 来实现功能。似乎随着公司采用这种易用但极具实用性的 Python 语言，Python 将在未来许多年内继续增长。


    ## 为什么使用 Python？


    刚开始学习编程时，大量的选项、信息和建议确实令人望而生畏。一些专家声称，虽然困难但久负盛名的 C 语言是最佳的起点，但其他专业人士表示，从 Java 或 Python
    等较简单的语言入手，会让学习者有机会真正吸收关键概念。正是基于这个原因，建议初学者使用 Python——从一种直白的脚本语言开始，编程不会显得那么陌生和令人困惑。


    Python 易于理解，是一种优雅且整洁的语言，并且免除了其他地方使用的许多复杂符号和标记。通常使用 Python 完成一项任务只需几行格式整洁的代码。


    谷歌、迪士尼、NASA 和雅虎等大型公司都使用 Python 来运行他们自己的程序；拥有 Python 知识可能会让程序员有机会在知名组织工作。此外，由于
    Python 如今仍在不断开发并持续添加新功能，人们对这门语言的兴趣将随时间不断增加。更多公司将会发现 Python 是一门极其有用的编程语言，因此现在学习它将为你的未来做好准备。


    ## Python 的优势


    除了简单快速之外，Python 还有其他各种优势。Python 的可移植性非常好，意味着 Python 代码可以在多种不同的操作系统上运行。Windows、Mac
    OSX 和 Linux 发行版都得到直接支持，在一个平台上编写的代码可以应用于所有这些平台。


    易用性并没有牺牲 Python 的强大功能。脚本语言背后的解释器能够将接近自然英语的命令转换为低级处理器指令，使其与真正的编程语言相媲美。知名企业因此选择使用
    Python，正如 YouTube 和 Pinterest 等网站所证明的那样，Python 具有广泛的功能性。


    Python 整洁并注重代码的可读性。风格和格式通常由个别程序员决定，但在 Python 中，整洁是绝对必要的。对于初学者程序员，这培养了良好的编程习惯，这将双重地帮助
    Python 以及初学者希望学习的任何其他语言。


    开发和测试的便捷性也使 Python 超越其他类似语言。代码可以通过解释器立即运行，从而实现快速原型设计。能够快速测试代码意味着可以迅速修复错误，从而为其他开发目标留出更多时间。


    总之，Python 是初学者最完美的语言。既易于开发和习得，Python 也相当强大。非常适合新入门者及刚开始编程的人，Python 依然是全球科技公司的首选。随着其人气持续增长，学习这门语言现在和将来都会很有用。


    ## 设置开发环境


    编程语言通常用于基于 Linux 的操作系统，如 Ubuntu 和 Debian。Python 也不例外，但还有一个在 Windows 上开发的选项。本书将解释如何设置这两种环境。但要知道，我们将使用
    Python 3 进行开发，而不是较旧的（但仍极受欢迎的）Python 2.7。


    大多数 Linux 发行版实际上默认已安装 Python。因此，获得一个可用的环境没有额外的设置步骤。通过在终端控制台中输入 “python” 即可进入 Python
    解释器。不过，如果安装了多个版本，“python” 将启动找到的第一个版本。请在解释器中检查版本号，如果启动的是 2.7，可能需要改为在终端中输入 “python3”。随时按
    ctrl+c 退出解释器。


    Windows 计算机通常没有预装 Python。要获取软件，请访问 Python 网站并下载最新版本。截至目前，Python 3.5.2 是当前版本。只要你的版本号是
    Python 3，本书中编写的代码应该也是兼容的。使用大部分默认设置安装该软件。务必勾选 “Add Python to the Path”（将 Python
    添加到路径），因为它简化了程序的测试。安装程序完成后，可以在开始菜单中搜索 “python” 来启动 Python 解释器。


    解释器（或解析器）是 Python 宣传的特性之一，允许逐行编写并运行代码。对于测试代码，解析器非常出色，但我们在本书中编写的大多数程序都是多行的，因此我们需要一个
    IDE（集成开发环境）。Windows 有几个流行的解决方案，如 Atom、Pycharm 和 Eclipse。这些全都是可下载和安装的第三方应用程序。IDE
    本质上是带有语法高亮和命令补全等有用编程功能的高级文本编辑器。虽然对于 Windows 开发者来说强烈推荐 Atom，但 Python 已经自带了一个 IDE
    解决方案。IDLE 是一个可以通过点击 “file”（文件）然后选择 “new file”（新建文件）来实现多行的解释器程序。无论你选择使用预装的编辑器，还是通过
    Atom/Eclipse 选择一个成熟的编程环境，Python 代码的运行结果都是一样的。你将在其中一个多行程序中编写代码。


    在 Linux 上，你也有下载兼容 Python 的 IDE 应用程序的选项，但大多数程序员倾向于使用预装的应用程序 “nano”。Nano 是一个内置的、精简的文本编辑器，通过在控制台输入
    “nano” 即可访问。一旦知道正在编写 Python 脚本，该程序实际上可以执行一些基本的语法高亮，因此许多开发者偏好提供的这种基本设置。代码在 nano
    中编写，然后按 ctrl+x 保存。


    现在开发环境已经设置好，你可以继续前进，开始编写你的第一个 Python 程序。


