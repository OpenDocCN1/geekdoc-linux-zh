    \ \"else 语句\"。Else 是一个关键字，意思是“当 if 语句失败时运行”。条件语句后跟随另一行缩进代码，但这次缩进的代码实际运行了，因为 else\
    \ 被激活了。\n\n如果用户输入了正确的答案 2 而不是其他数字，if 语句将评估为真，控制台将打印 \"Correct\"。在这种情况下，else 语句根本不会运行。再次关注缩进代码，理解这些行之所以缩进是因为它们是\
    \ \"if\" 和 \"else\" 代码块的一部分。还要意识到，决策结构中永远只有一个语句可以在程序中运行，所以如果 \"else\" 运行了，那就意味着\
