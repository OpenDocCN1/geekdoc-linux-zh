    After saving and running the file, all three functions will print their respective
    parameters. As mentioned previously, the quotations explain that text will be
    displayed. By forgoing quotations, numbers can be displayed instead.


    ```

    print ("The answer to everything is:")

    ```


    ```

    print (42)

