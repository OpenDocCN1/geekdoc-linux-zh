    \ 语句之间，可以使用任意数量的 elif 条件。此外，上述代码中还使用了一个新关键字 - \"and\"。我们的第一个比较检查 age 是否小于或等于 18\
    \ 并且大于 0。因此，只有当 age 值同时满足这两个要求时，该条件才会评估为真。假设用户输入 75。第一个语句被评估，75 确实大于 0，但它并不小于\
    \ 18，因此该语句被跳过。然后，第一个 elif 被评估。Age 不大于 80，因此该语句也被跳过。第三，age 肯定在 18 和 80 之间，所以控制台打印\
    \ \"Ah, a good age to learn\"，然后完全跳过 else 语句。\n\n记住在决策“树”中只有一个语句可以运行，我们可以看到任何激活的\
    \ elif 基本上会运行其代码块，然后跳出决策结构。在我们的上述程序中，else 被用作一种“捕获所有”类型的表达式。任何无效输入，例如 “-1”，都会被\
    \ else 捕获并显示出来。良好的编程形式来自于捕获此类潜在的用户错误，作为有志成为程序员的人，你应该始终预期用户在有机会时会错误地输入值。\n\n“And”\
    \ 是一个比较运算符，它强制表达式的两部分都为真。另一个运算符，“or”，用于强制表达式的只有一部分评估为真。\n\n```python\nelif (age\
    \ == 25 or age == 50 or age == 75):\n    print (\"Happy quarterly birthday!\"\
    )\n```\n\n如果我们把这个 elif 放在上面的程序中（在第一个 if 下方），我们会看到只有表达式的一部分为真，整个比较才为真。用户的年龄可以是\
