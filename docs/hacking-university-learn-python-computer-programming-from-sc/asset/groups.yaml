    \        self.monthly_payment = 0\n\nforsale1 = apartment(\"100 Col. Ave\", 2,\
    \ 2)\nforsale1.monthly_payment = 250\n```\n\n作业程序：\n\n- 扩展上一章中可选创建的数据库程序，使其包含继承。\n\
    \n## 模块\n\n到目前为止我们使用的每一个功能都是 Python 内置的。Python 是一种扩展性很强的语言，但可以通过模块轻松地为 Python\
    \ 添加额外功能。熟悉 C 语言的读者可以将模块与“h”文件和预处理器语句联系起来。模块的作用大致相同，它们被包含进来以向 Python 添加新的函数和命令。\n\
    \n要添加新模块，我们只需在程序顶部包含一条语句。\n\n```python\nimport math\n```\n\n在这行代码中，我们导入 “math”\
    \ 模块，它为我们打开了一系列新的函数以供使用。\n\n```python\nimport math\n\nprint(math.sin(3))\nanswer\
    \ = math.sqrt(16)\nprint(answer)\nprint(math.gcd(100, 125))\n```\n\n特别地，sqrt()、sin()\
    \ 和 gcd() 是上述代码中可以注意到的三个示例。每个模块都有明确的目的，math 模块的目的是提供高级数学函数。以下是其中最重要的函数列表。\n\n\
    - math.sqrt() – 数字的平方根\n- math.sin() – 数字的正弦\n- math.cos() – 数字的余弦\n- math.tan()\
    \ – 数字的正切\n- math.log() – 两个参数，对数和底数\n- math.pi – 3.14159\n- math.e – 2.71828\n\
