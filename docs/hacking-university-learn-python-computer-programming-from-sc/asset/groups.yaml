    Services are daemons, or background tasks that are continuously running. They
    can be gathering data, running a service such as Bluetooth and Wi-Fi, or waiting
    for user interaction.


    ## Security Protocols


    Linux has a focus on security in general, which contributes to its use in corporate
    and server settings. Taking advantage of the security protocols means that you
    are more secure than other operating systems and less likely to have your computer
    compromised. This requires good security principals, of course, and always being
    safe online. A computer without a password is hardly protected at all.


    One feature brought over from UNIX is file permissions. Every file has a set of
    permission- the owner, group, and rights. The command “chown” changes the owner
    of a file, “chgrp” changes the group, and “chmod” changes the rights associated
    with the file. Discovering the permissions of a file or folder is done by typing
    “ls -l filename”. It will return an initially confusing line such as “- rw- rw-
    r--”. “R” means read, “W” stands for write, and the third option is “X” for execute.
    The three sets are respectively owner, group, and other. So our example file above
    has read and write permissions set for the owner and its group, but only read
    permissions for other users. This means that the owner and the group he belongs
    to (most likely sudo users) have permission to both access the file and change
    its contents, but other users on the network or PC can only view the contents
    and not edit it. Script files will need to have the X in order to be executed,
    and without it they cannot be run.


    Most people will only need to use the “chmod” command to change the permissions
    of files they wish to use. We use the command and a set of numbers to set the
    permission of the file. “chmod 777 test.sh” makes the file readable, writable,
    and executable by all users anywhere because each specification (owner, group,
    other) has the number 7 attached to it. Numbers determine the permissions that
    entity has, and the number used is calculated like so:


    - Start with the number 0.

    - Add 4 for adding readability.

    - Add 2 for write-ability.

    - Add 1 for executable-ness.

    - The number you have left determines the permissions.


    6 would be read/write, but 1 would only be executable. 5 would be readable and
    executable, but not changeable. In our 777 example, we set owner, group, and others
    to all be 7. This is not particularly good security, because that means anybody
    anywhere can mess with that file. A more conservative permission set would be
    775. Use security permissions advantageously for secure computing.


    Security within Linux expands beyond just permissions. Ensure that you practice
    good security practices, and that you are following common sense in regards to
    security- install only needed programs, do not follow all internet advice, do
    not use sudo too often, use passwords, use encrypted networks, keep software up
    to date, encrypt important files, and make regular backups. As a final word of
    advice, look into using a distribution with SELinux, a module that supports AC
    and other security policies.


    ## Scripting


    Bash is the “programming language” or the terminal. When we type a command, we
    are doing so within bash. A script is a list of bash commands that execute in
    order, meaning we can create a script with a list of commands and run it to save
    time or automate terminal tasks that we normally have to type. As an intermediate
    and advanced Linux administrator, you can use scripts to greatly shorten the amount
    of work required for repetitive or constantly running tasks.


    To start a script, create a new file “script.sh” within nano. The first line must
    always be “#!/bin/bash” to mark it as a bash script. Type the following lines
    for your first script.


    ```

    echo “What is your name?”

    ```


    ```

    read name

    ```


    ```

    echo “Hey, $name. Here is your current directory, followed by the files.”

    ```


    ```

    pwd

    ```


    ```

    ls

    ```


    Save the script. Now we have to set the permissions to allow it to be run. Use
    “sudo chmod 777 script.sh”, and then run the script with “./script.sh”. So long
    as you copied the script exactly, it will ask for your name and then show you
    your directory and files. Take the concept and expand it further in your own scripts.
    You can run commands from installed programs as well, so you can write a script
    that automatically joins a domain, or one that connects to the network specified.
    Shutting down remote computers is a great automatic task as well.


    Scripts can either be run manually or set to execute at certain times. To run
    a certain script every time the user logs in, open the “startup applications”
    program from dash and create a new app with the script as the source. Now every
    time that user logs in the script will run automatically. This is useful for setting
    up certain options or starting background services without requiring the user
    to do it themselves.


    Scheduling tasks for a certain time can be done with the Cron system daemon. It
    is installed by default on some systems, but if not “sudo apt-get install cron”
    can be used. Start the service with "service cron start" and create a new crontab
    file with "crontab -e". Select nano as your text editor. At the bottom of the
    created file, add a new line with our scheduled task. The format goes as follows:


    minute, hour, day, month, weekday, command


    And we format it with these options to specify when to run the command. Time numbers
    start with 0, so the hours range from 0 to 23 and minutes are from 0 to 59. Replace
    any option with an asterisk to specify that it will run on any value. Pay attention
    to these examples:


    ```

    0 12 * * * ~/script.sh

    ```


    This will run the script.sh found in the Home directory every day at noon.


    ```

    30 18 25 12 * /usr/bin/scripts/test.sh

    ```


    And this will run test.sh within the /usr/bin/scripts directory at 6:30 on Christmas
    day every year.


    Conclusively, scripting and automating scripts are fantastic ways to take administrative
    control of regularly occurring tasks. Continue writing scripts, or look up examples
    online to see how your computing experience can be made easier with bash.


    ## Advanced Terminal Concepts


    Mastering Linux comes down to intimate comprehension of the tools available in
    the OS and how to utilize them. Many of the topics discussed in this chapter will
    focus on more tasks and how to accomplish them, or a few QOL improvements to the
    OS in general.


    Compression and decompression of files often confuses Linux beginners. The tools
    are typically already installed, but the command line must be used. Furthermore,
    the strange .tar and .gz file-types are Linux-specific formats that you might
    often come across. All files can be unzipped or zipped with the gzip tool. Preinstalled
    on Ubuntu, we access it with the “tar” command. To compress a folder and the files
    contained within, navigate to it in terminal and type “tar -czvf name.tar.gz foldername”.
    C stands for “create”, z means “compress (gzip)”, v is for “verbose”, and f allows
    filename specification. If you want more compression (but at the cost of time),
    zip the folder with gzip2 by replacing the -z switch with the -j switch instead.


    Now extracting that same archive can be done with “tar -xzvf name.tar.gz”. You
    will notice that the -c was replaced with an -x, and this indicates extraction.
    Once again if you are dealing with bzp2 files use the -j switch instead.

