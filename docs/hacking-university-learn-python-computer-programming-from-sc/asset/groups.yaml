    # 引言


    计算机包含两个功能组件——软件和硬件。硬件是旋转、计算并使用电力执行计算过程的物理部件，但软件是一个更虚拟的概念。本质上，软件由给硬件下达指令的编程代码组成——告诉部件做什么。有“高级”软件，如
    Internet 浏览器、文字处理器、音乐播放器等。但常被忽视的组件是被称为操作系统的“低级”软件。


    操作系统是我们个人计算机运行所必需的。在办公室或使用相对便宜的台式电脑时，使用的操作系统可能是 Microsoft 的 Windows。内容创作者、作家和图形艺术家更喜欢
    Apple 计算机，因为它们附带了专注于创造力的 OSX 操作系统。这两种操作系统，Windows 和 OSX，多年来一直主导着消费市场。然而，存在一种替代操作系统，在易用性、定制性、安全性和价格方面表现出色。基于相对鲜为人知的
    Linux 的操作系统在所有这些领域都达到了并超越了标准，但它仍然是一个许多人甚至未曾听说过的晦涩选择。


    Linux 本身并不是一个操作系统。它是一个内核，或操作系统的“核心”。正如 Windows NT 是 Windows 7 的内核一样，Linux 是 Ubuntu、Debian、Arch、Fedora
    等“发行版”的内核。


    但为什么有人会放弃熟悉的 Windows，转而使用一个无人知晓的计算环境呢？Linux 不仅免费，而且与大量设备兼容。较旧的计算机，尤其是那些不再工作的计算机，可以通过
    Linux 操作系统焕然一新，使其运行起来就像新的一样。


    本书将阐述切换到 Linux 的好处，并作为安装、配置和使用最流行发行版的入门指南。然后，将解释终端命令行，以说明如何以其他系统不可能的方式利用操作系统。确实，切换到
    Linux 可以带来许多优势，通过阅读本书，你可能会找到一个适合在你的计算机上使用的主要操作系统。


    # Linux 历史


    20 世纪 90 年代初，Linus Torvalds 是芬兰的一名学生。当时的计算机通常运行 DOS 或 UNIX，这两种操作系统在当时都是专有的且难以使用。Torvalds
    试图创建一个自己的操作系统作为业余项目（基于 UNIX），但该项目迅速增长并吸引了更多开发人员。内核继续演变，直到它变得可移植（可在各种系统上使用）并且完全可用于计算。但内核不是操作系统，因此
    Linux 与 GNU 核心工具结合，创建了一个让人想起操作系统的计算环境。


    然后，第三方组织获取了基础的 Linux 产品，并添加了他们自己的高级软件和功能，从而创建了 Linux“发行版”。Linux 至今仍然是一个免费的业余项目，因此内核不断接收
    Torvalds 和社区提交的更新和修订。在整个 2000 年代，许多其他第三方看到了 Linux 环境的实用性，并开始将其纳入他们的生产环境和公司中。如今，Linux
    因在服务器和商业环境中高度使用而闻名，并拥有少量的专用桌面用户群体。展望未来，内核已达到一个流行程度，使其永远不会消亡。大公司因其优势和实用性而热衷于 Linux，因此内核和各种发行版将永远作为最佳替代操作系统而存在。


