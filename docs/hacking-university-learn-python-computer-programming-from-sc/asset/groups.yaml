    \ = grade\n\n        self.gpa = 0.0\n\n    def __str__(self):\n        return\
    \ \"{}\".format(self.name)\n\n    def record(self):\n        return \"Student\
    \ {} is a {} with a {}\".format(self.name, self.grade, self.gpa)\n\nstudent4 =\
    \ student(\"Barry\", \"Professor\")\n\nprint(student4)\n```\n\n当 `student4` 被打印时（作为字符串引用），`__str__`\
    \ 特殊方法接管并返回对象的“name”属性。如果不存在这个特殊方法，我们在引用该对象时将无法获得预期的输出。\n\n最后，类是有用的，因为我们可以创建“**类变量**位于其中。“Name”和“GPA”是特定于每个声明对象的属性变量，但也可以存在由所有对象共享的类变量。例如，下面的程序将通过一个类变量来跟踪对象的总数。\n\
    \n```python\nclass food:\n    total_foods = 0\n\n    def __init__(self, name):\n\
    \n        self.name = name\n\n        self.calories = 0\n\n        self.foodgroup\
    \ = \"\"\n\n        food.total_foods += 1\n\n    def __del__(self):\n\n      \
    \  food.total_foods -= 1\n\n    def __str__(self):\n\n        return \"{}\".format(self.name)\n\
    \n    def get_total():\n\n        return food.total_foods\n\n    def record(self):\n\
    \n        return \"Food {0} is a {2} with {1} calories.\".format(self.name, self.calories,\
