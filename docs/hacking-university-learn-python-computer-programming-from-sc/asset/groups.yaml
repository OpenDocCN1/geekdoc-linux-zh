  mdcn: "\n\n继续探讨高级终端概念，让我们聊聊一些能为你节省终端时间的优质技巧和窍门。在输入命令或文件名时，在输入到一半时按下 Tab 键。这个功能叫做\
    \ Tab 补全，它会猜测你想输入的内容并自动填充剩余的短语。对于文件，它会根据目录中显示的名称完成补全，或者根据你试图执行的操作来补全命令。Linux 专家以及那些经常需要使用终端的人，看起来似乎正以极高的准确性和速度输入他们想要的精确内容，但实际上他们只是在运用\
    \ Tab 补全功能。\n\n用户，尤其是管理员，会在 `sudo` 命令上花费相当多的时间，因为他们的指令需要提升权限才能运行。但当输入长命令时，如果忘记输入\
    \ `sudo`，你就不得不恼火地重新输入一遍。相反，只需输入 “`sudo !!`”，这是 “super user do again”（超级用户再次执行）的简写。它大方地帮你省去了重新输入整条命令的麻烦。\n\
    \n重复命令的另一种方法是使用上下箭头。连续按下上箭头可以循环显示之前输入的命令。你也可以使用左右箭头编辑命令，以修改其中包含的文本。\n\n而最受追捧的终端技巧涉及复制和粘贴。尝试将一行内容粘贴到终端中时，会出现奇怪的字符\
    \ ^V。这是因为键盘快捷键未在终端中配置生效，所以显示了这种奇怪的组合。要真正粘贴，请右键单击并选择相应选项；或者使用 `shift+insert` 键组合。复制的方式相同，但使用\
    \ `ctrl+insert` 键。虽然从互联网复制粘贴终端命令可能没问题（前提是你了解风险并知道这些命令在做什么），但不要试图从本文出版物中复制粘贴。你阅读媒介中引入的格式可能会插入终端无法识别的特殊字符，因此最好不要复制粘贴，而是手动输入所展示的任何命令。\n\
    \nLinux 有一个隐藏功能，许多用户并不知晓。当你访问某个目录或输入 `ls` 时，文件会显示给用户，但实际上并非所有文件都能通过这种方式查看。在 Linux\
    \ 中，如果文件名以点号作为第一个字符，该文件将被标记为隐藏。隐藏文件对普通用户通常不可见，它作为一种机制，保护配置文件免受意外编辑、删除等影响。要查看这些文件，我们只需在\
    \ `ls` 搜索中添加 `-a` 标签。在图形界面中，在目录中按 `ctrl+h` 即可揭示隐藏内容。当你创建脚本和其他配置文件时，考虑用点号开头来隐藏它们，作为一种用户保护措施。\n\
    \n终端中的任何命令都可以通过 `ctrl+c` 键组合进行中断或退出。使用它来停止耗时的进程，或退出你不理解的程序/命令。\n\n别名是一种在终端内创建个人快捷方式的方法。无需输入长命令或一堆小命令，别名可以将它们组合成一个用户定义的选项。顾名思义，别名是你指定的任何事物的不同名称。每个别名都包含在一个隐藏的配置文件中——使用\
    \ “`nano ~/.bashrc`” 开始编辑它。由于它存在于用户的家目录中，每个别名仅对该用户有效。在文件底部，我们可以根据以下示例开始创建别名：\n\
    \n```\nalias gohome=\"cd ~ && ls\"\n```\n\n输入 “`gohome`” 将执行此别名，它将目录更改为主目录并显示内容。创建别名时，必须严格遵循上述展示的格式，这意味着命令和等号之间没有空格。多个命令通过\
    \ “`&&`” 分隔，串联在单引号内。对于更健壮的别名，请添加函数代替。以下示例将 `cd` 和 `ls` 组合成单个命令。\n\n```\nfunction\
    \ cdls () {\n    cd \"$@\" && ls\n}\n```\n\n编写完别名后，保存文件并重启计算机。此时，你的新命令即可投入使用。\n\
    \n我们编辑的那个文件 `.bashrc` 是 Ubuntu 终端的配置文件。除了创建别名，我们还可以使用它来定制终端设置，例如颜色、大小等……一个快速技巧是取消注释\
    \ “`#force_color_prompt=yes`”（即移除 `#` 并确保等号后是 “`yes`”）。这会给终端添加颜色，使某些单词显示为不同颜色。打开终端时，右键单击并选择\
    \ “profiles”（配置文件）随后选择 “profile preferences”（配置文件偏好设置），可以查看更多选项。通过这些标签页，你可以定制字体、大小、颜色、背景颜色等更多内容。如果你将大量使用终端，建议进行定制，因为熟悉工具会让你更舒适。\n\
    \n# I/O 重定向\n\n在正常的终端命令执行过程中，“正常输入”（由用户输入，或从文件/属性/硬件读取）被命令接收并解析。有时命令还会有“标准输出”，即显示在终端中的返回文本。在\
    \ “`ls`” 中，标准输入是当前工作目录，而标准输出是文件夹的内容。\n\n输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以在终端中做更多事情。例如，后跟文件的\
    \ “`cat`” 命令（concatenate，连接）会将该文件输出到屏幕上。单独运行 `cat` 会打开一个解析器，任何输入的线都会立即输出（使用 `ctrl+d`\
    \ 退出）。但使用 I/O 重定向快捷键（`<`, `>`, `<<`, `>>`, `|`），我们可以将输出重定向到另一个源，例如文件。“`cat > test.txt`”\
    \ 现在会将标准输出放入该新文件中。双符号表示追加，因此 “`cat >> test.txt`” 会将输出放在文件末尾，而不是擦除文件开头的现有内容。\n\n\
    竖线字符，即 “管道”（pipe），使用另一种形式的 I/O 重定向，将一个命令的输出直接插入另一个命令的输入中。“`ls | sort -r`” 会获取\
    \ `ls` 的输出并将其排序为反向列表。我们重定向了输出并将其交给另一个命令来完成此操作。\n\n最后，“`grep`” 命令在 I/O 重定向中非常常用。`Grep`\
    \ 可以在指定文件中搜索特定字符串并将结果返回到标准输出。使用重定向，此输出可以放入其他命令中。Linux 的一个有趣特性是对象即文件，即使是硬件也是如此。因此，我们的\
    \ CPU 实际上是一个内部存储相关数据的文件，我们可以使用 `grep` 和其他工具在其内部进行搜索。该示例相当高级，但这里有一个更简单的实例：\n\n\
    ```\ngrep Conclusion report.txt\n```\n\n它会在文件内搜索该特定单词。随着所有新的符号和命令的出现，I/O 重定向可能变得复杂，但这是一个你可以将其纳入脚本和日常使用的功能，它通常允许在单行中完成\
    \ Linux 的某些特定功能和任务。\n\nLinux 和终端是难以完全掌握的概念。但通过练习和持续的投入，你将能够执行高明的计算任务，并完成在 Windows\
    \ 或 OSX 中无法实现的有用任务。进一步了解命令及其用法无疑对此有所帮助，因此请坚持研究新命令及其使用。肯定需要记忆的唯一命令是 “`man`”，它是一个显示任何其他指定命令的手册页和文档的命令。手册页展示了系统中每个命令的开关、示例和预期用途。善用该工具，获得对你系统的深入了解。\n\
    \n# 更多 Linux 信息\n\n若要继续学习 Linux 及其可能提供的功能，请考虑本节中的示例。本节将简要讨论 Linux 的更多用途，以及一些尚未讨论过的其他概念。\n\
    \n“Linux 文件系统”指的是计算机上文件和文件夹的主要布局。如果在终端中继续 “`cd ..`”，或在图形界面中点击后退按钮直到无法再进一步，你将遇到\
    \ “根”（root）目录。这里的文件夹，如 `bin`, `boot`, `etc`, `usr` 等，就是硬件和设置被配置的方式。每个文件夹都有特定的用途，你可以通过探索其内容来理解它们。例如，用户数据存储在\
    \ `home` 中，但用户程序存储在 `usr` 中。由于文件系统实际上非常多样化和复杂，这里将不作详细讨论，但如果希望了解更多，可以进行互联网搜索或阅读与你的操作系统相关的文档。\n\
    \nLinux 系统通常用于桌面用途之外的目的。专用机器运行 Linux 的变体版本，因为它提供了强大的功能和稳定性。甚至我们的汽车也运行着 Linux 内核，用于跟踪错误代码并帮助机械师。\n\
    \n"
