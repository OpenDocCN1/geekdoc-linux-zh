    # # Programming Concepts


    In the above program, "print" is referred to as a command or function. Each function
    has a specific syntax that must be followed. For example, after print there is
    a set of parenthesis. Values passed within parenthesis are called parameters.
    Quotations also surround our text, and that is syntax that specifies written text,
    or a string. The syntax of print must be followed exactly, or else a syntax error
    will be returned when the program tries to run. As new functions are introduced
    in this book, careful attention must be placed upon following the syntax rules.


    Anything can be put within the quotations of the print function and it will be
    written to the console. Since Python starts at the beginning of a script and reads
    lines individually, multiple print functions can be placed one after another like
    so:


    ```

    ```

    print (“Hello, World!”)


    print (“This is my 2nd Python Program”)


    print (“Notice how each print command puts the text on a new line!”)

    ```

    ```'
