    * 现在在 `man` 手页中尝试一些搜索。根据你搜索的内容，你可能会得到几个很大的列表。查看一些页面以了解它们的大致。


    ## 删除目录


    正如你所见的，创建一个新目录很容易，删除或移除目录也同样容易。但有一点你需要注意——Linux 命令行不包含任何撤销（UNDO）选项。这意味着要对自己的操作非常小心，因为一旦删除了目录，它就永远消失了。要删除目录，我们使用简单的命令
    `rmdir`，它是 remove directory（删除目录）的缩写。


    ```

    rmdir [options] <Directory>

    ```


    这里还需要注意两点。第一，类似于 `mkdir`（创建目录）支持 `-v` 和 `-p` 选项，`rmdir` 也支持这些选项。其次，在删除目录之前，它必须是空的。然而，有一种方法可以避免这一点，我们稍后会来看。


    ```

    rmdir linuxpractice/foo/bar

    ls linuxpractice/foo

    ```


