    有一个被称为“层值”（stratum value）的值，由 NTP 时间源报告。这决定了 NTP 时间源的质量。层值指的是系统到达高性能参考时钟所需的跳数（hops）。源参考时钟的层值为
    `0`。连接到源时钟的 NTP 服务器的层值为 `1`，而尝试与该 NTP 服务器同步的系统其层值为 `2`。


    你可以使用 `/etc/chrony.conf` 文件来配置两种类型的时间源：服务器（server）和对等节点（peer）。服务器的层级比本地 NTP 服务器高一级。对等节点的层级与本地
    NTP 服务器相同。你可以在配置文件中指定一个或多个服务器和对等节点，每行一个。


    例如，如果你的 `chronyd` 服务与默认的 NTP 服务器同步，你可以根据需要更改配置文件，以根据需求更改 NTP 服务器。每当你在配置文件中更改源时，都需要重启服务以使更改生效。


    ```

    [root@server ~]# systemctl restart chronyd

    ```


    `chronyd` 服务还有另一个名为 `chronyc`的服务，它是 `chronyd` 服务的客户端。一旦设置了 NTP 同步，你可能想知道系统时钟是否正确同步到
    NTP 服务器。你可以使用 `chronyc sources` 命令，或者如果你想要更详细的输出，可以使用带有详细信息选项的命令 `chronyc sources
    -v`。


    ```

    [root@server ~]# chronyc sources –v

    ```


    ## 第 12 章 创建可启动 U 盘


    一旦下载了 ISO 文件，你需要创建一个可启动的 U 盘。这意味着你必须准备一个 U 盘，以便用它启动 Ubuntu。


    完成此任务你需要一个合适的程序。


    有几个应用程序可以完成此任务。

    在我看来，Etcher 是一个很好的选择。

    Etcher 对 Linux、Windows 和 MacOS 都是免费的。

    [`www.balena.io/etcher/`](https://www.balena.io/etcher/)


    下载相应的版本，然后创建所需的 U 盘。

    Etcher 操作直观易懂。


    ![etcher foto SW](img/image00273.jpeg)


    1. 选择镜像（Ubuntu 18.04 的 ISO 文件）。

    2. 选择驱动器（你将看到插入空闲 USB 端口的 盘列表）。

    3. 选择你想要用于 Ubuntu 的那一个。

    4. 刻录（开始！）


    双击确认选择了正确的 U 盘。

    U 盘上的所有内容将被完全擦除！


    ## Systemd 日志持久


    在本节中，我们将学习如何修改 `systemd-journald` 配置，使日志存储在磁盘而非内存中。


    ### 永久持久化系统日志


    系统日志默认保存在 `/run/log/journal` 中，这意味着当系统重启时，条目会被清除。日志是 Red Hat Enterprise Linux
    7 中的一种新实现。


    我们可以确保，如果创建 `/var/log/journal` 目录，日志条目就可以记录在那里。这将带给我们一个优势，即即使在重启后历史数据仍然可用。然而，尽管我们有了持久的日志，也无法保留任何永久数据。系统存在日志轮转机制，每月触发一次日志。此外，默认情况下，不允许日志堆积超过其所占文件系统的
    10%，或者留少于 15% 的文件系统可用空间。你可以根据需求在 `/etc/systemd/journald.conf` 配置文件中更改这些值，一旦 `systemd-journald`
    进程启动，新值将生效并被记录。


    如前所述的，可以通过在 `/var/log/journal` 创建目录来使日志条目永久化。


    ```

    [root@server ~]# mkdir /var/log/journal

    ```


    你需要确保 `/var/log/journal` 目录的所有者为 `root`，组所有者为 `systemd-journal`，并且目录权限设置为 `2755`。


    ```

    [root@server ~]# chown root:systemd-journal /var/log/journal

    [root@server ~]# chmod 2755 /var/log/journal

    ```


    要使这些更改生效，你需要重启系统，或者以 root 用户身份向 `systemd-journald` 进程发送特殊信号 `USR1`。


    ```

    [root@server ~]# killall -USR1 systemd-journald

    ```


    这将使得 systemd 日志条目即使在系统重启后也是永久的，你现在可以使用 `journalctl -b` 命令显示最近一次启动的最要输出。


    ```

    [root@server ~]# journalctl -b

    ```


    如果你正在调查与系统崩溃相关的问题，你需要过滤日志输出，仅显示系统崩溃发生之前的条目。理想情况下，那是系统崩溃前的最后一次重启。在这种情况下，你可以将 `-b`
    选项与负数结合，指示回溯的重启次数以限制输出。例如，要显示到上一次启动的输出，可以使用 `journalctl -b -1`。


    ## 维护时间准确性


    在本节中，我们将学习如何确保系统时间准确，以便所有记录的事件日志都是准确。


    ### 设置本地时区和时钟


    为了确保系统时间准确，以便所有记录的事件日志显示准确的时间戳。系统可以通过网络时间协议（NTP）获取正确的时间。如果你要在多个系统中分析日志，确保这些时钟是同步的。


    要查看 Linux 上的日期和时间设置，可以使用 `timedatectl` 命令。该命令将显示当前时间、NTP 同步设置和时区。


    ```

    [root@server ~]# timedatectl

    ```


    Red Hat Enterprise Linux 7 维护了一个已知时区的数据库。可以使用以下命令列出：


    ```

    [root@server ~]# timedatectl list-timezones

    ```


    时区的名称基于 IANA 维护的 `zoneinfo` 数据库。时区的命名规范基于海洋或大陆。例如，如果我们看美国的山地时间，它表示为“America/Denver”。


    选择正确的城市名称至关重要，因为有时同一时区内的地区可能维护有不同的夏令时设置。例如，美国亚利桑那州没有实行夏令时，因此属于“America/Phoenix”时区。


    `tzselect` 命令用于识别时区信息名称是否正确。用户将收到关于其当前位置的提示问题，并会给出正确时区的输出。在建议时区时，它不会自动对系统当前时间进行任何更改。一旦你确定了应该使用哪个时区，可以使用以下命令进行设置：


    ```

    [root@server ~]# timedatectl set-timezone America/Phoenix

    [root@server ~]# timedatectl

    ```


    如果你想更改系统的当前日期和时间，可以使用 `timedatectl` 命令的 `set-time` 选项。日期可以用“YYYY-MM-DD hh:mm:ss”格式指定。如果你只想设置时间，可以省略日期参数。


    ``` be[root@server ~]# timedatectl set-time 9:00:00

    [root@server ~]# timedatectl

    ```


    你可以使用 `timedatectl` 命令的 `set-ntp` 选项使用网络时间协议的自动同步。传递的参数是 `true` 或 `false`，这将开启或关闭该功能。


    ```

    [root@server ~]# timedatectl set-ntp true

    ```

