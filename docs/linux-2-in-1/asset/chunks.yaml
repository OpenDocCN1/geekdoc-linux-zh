    当使用终端命令时，如果该语句中的反引号（`` ` ``）之间有一个短语，它会被 shell 视为一个命令。例如，当给出 `echo ls` 命令时，自然地
    `ls` 表达式（字符串）会打印在屏幕上。然而，如果你使用 `echo `ls`` 形式的命令，这时发送到终端的内容将被 shell 视为命令，并执行该命令在显示器上打印表达式输出（即：`ls`
    命令输出中的所有字符串将作为参数传递给 `echo` 命令，因此这些语句也会被打印到屏幕上）。


