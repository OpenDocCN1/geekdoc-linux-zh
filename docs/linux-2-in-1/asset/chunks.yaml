  trans: "\n你可以使用以下命令来实现上述输出。\n\n```bash\n[root@server ~] # journalctl -p err\n```\n\
    \n`journalctl` 有一个类似于 `tail -f` 的命令，即 `journalctl -f`。这会再次列出最后 10 行日志记录，然后实时打印日志条目。\n\
    \n```bash\n[root@server ~] # journalctl -f\n```\n\n你还可以使用其他过滤器来根据你的需求过滤 `journalctl`\
    \ 条目。你可以传递 `--since` 和 `--until` 选项根据时间戳过滤日志条目。你需要传递如“今天”、“昨天”或格式为 `YYYY-MM-DD\
    \ hh:mm: ss` 的实际时间作为参数。\n\n让我们来看下面的几个示例。\n\n```bash\n[root@server ~] # journalctl\
    \ --since today\n\n[root@server ~] # journalctl --since “2015-04-23 20:30:00”\
    \ --until “2015-05-23 20:30:00”\n```\n\n日志条目还附带有更多字段，只有当你在使用 `journalctl` 命令时通过\
    \ `verbose` 选项时，这些字段才会可见。\n\n```bash\n[root@server ~] # journalctl -o verbose\n\
    ```\n\n对于系统管理员来说，以下关键词是非常重要的：\n\n- `_COMM`：命令名称\n- `_EXE`：显示进程的可执行路径\n- `_PID`：显示进程的\
    \ PID\n- `_UID`：显示与进程关联的用户\n- `_SYSTEMD_UNIT`：显示启动进程的 systemd 单元\n\n你可以组合一个或多个选项，根据你的需求获取\
    \ `journalctl` 命令的输出。来看下面的示例，它将打印包含 systemd 单元文件 `sshd.service` 且 PID 为 `1183\\\
    .` 的日志条目。\n\n```bash\n[root server ~] # journals _SYSTEMD_UNIT=sshd.service _PID=1183\n\
    ```\n\n## 系统日志保存\n\n在本节中，我们将学习如何修改 `systemd-journald` 配置，使日志存储在磁盘而非内存中。\n\n###\
    \ 持久存储系统日志\n\n系统日志默认保留在 `/run/log/journal`，这意味着当系统重启时，条目会被清除。日志是 Red Hat Enterprise\
    \ Linux 7 中的一种新实现。\n\n我们可以确定，如果创建 `/var/log/journal` 目录，日志条目就可以记录在那里。这将带给我们一个优势，即即使在重启后历史数据可用。然而，尽管我们有了持久性日志，但数据无法永久保存。系统存在日志轮机制，每月触发一次日志滚动。此外，默认情况下，不允许日志累积超过其所占文件系统的\
    \ 10%，或者留少于 15% 的文件系统可用空间。你可以根据需求在 `/etc/systemd/journald.conf` 配置文件中更改这些值，一旦\
    \ `systemd-journald` 进程启动，新值将生效并记录。\n\n如前讨论的，通过在 `/var/log/journal` 创建目录，可以使日志条目持久化。\n\
    \n```bash\n[root@server ~]# mkdir /var/log/journal \n```\n\n你需要确保 `/var/log/journal`\
    \ 目录的所有者为 `root`，组所有者为 `systemd-journal`，并且目录权限设置为 `2755`。\n\n```bash\n[root@server\
    \ ~]# chown root:systemd-journal /var/log/journal\n\n[root@server ~]# chmod 2755\
    \ /var/log/journal\n```\n\n要使这些生效，你需要重启系统，或者作为 root 用户向 `systemd-journald` 进程发送特殊的信号\
    \ `USR1`。\n\n```bash\n[root@server ~]# killall -USR1 systemd-journald\n```\n\n\
    这将使得 systemd 日志条目即使在系统重启后也是持久的，现在你可以使用命令 `journalctl -b` 根据最近的启动情况显示最简的输出。\n\n\
    ```bash\n[root@server ~]# journalctl -b\n```\n\n如果你正在调查与系统崩溃相关的问题，你需要过滤日志输出，仅显示系统崩溃之前的条目。理想情况下是系统崩溃前的最后一次重启。在这种情况下，你可以将\
    \ `-b` 选项与负数结合，表示回溯的启动次数以限制输出。例如，要显示到上一次启动的内容，可以使用 `journalctl -b -1`。\n\n## 维护时间准确性\n\
    \n在本节中，我们将学习如何确保系统时间准确，以便记录在日志文件所有事件日志都能显示准确的时间戳。\n\n### 设置本地时区和时钟\n\n如果你想分析跨多个系统的日志，确保所有系统的时钟保持同步至关重要。系统可以使用网络时间协议\
    \ `NTP` 从互联网获取正确时间。互联网上有公开的 NTP 项目，如网络池项目（Network pool Project），它们允许系统获取正确时间。另一个选项是维护一个由高质量硬件组成的时钟，为所有本地系统提供时间。\n\
    \n要查看 Linux 系统上的当前日期时间设置，可以使用 `timedatectl` 命令。该命令将显示当前时间、NTP 同步设置和时区等信息。\n\n\
    ```bash\n[root@server ~]# timedatectl\n```\n\nRed Hat Enterprise Linux 7 维护一个已知时区的数据库。可以使用以下命令列出。\n\
    \n```bash\n[root@server ~]# timedatectl list-timezones\n```\n\n时区的名称基于 IANA 维护的\
    \ `zoneinfo` 数据库。时区的命名规范基于海洋或大陆，随后是该时区或区域内最大的城市。例如，如果我们看美国的山地时间（Mountain Time），表示为“America/Denver”。\n\
    \n选择正确的城市名称至关重要，因为有时同一时区内的不同地区可能维持不同的夏令时设置。例如，美国亚利桑那州没有实施任何夏令时，因此属于“America/Phoenix”时区。\n\
    \n`tzselect` 命令用于识别 zoneinfo 时区名称是否正确。用户将收到关于其当前位置的问题提示，并通常会给出正确时区的输出。在建议时区时，它不会自动对系统上的当前时间进行任何更改。一旦你知道应该使用哪个时区，可以使用以下命令进行显示。\n\
    \n```bash\n[root@server ~]# timedatectl set-timezone America/Phoenix\n\n[root@server\
    \ ~]# timedatectl\n```\n\n如果你想更改系统的当前日期和时间，可以使用 `timedatectl` 命令的 `set-time` 选项。时间和日期可以用“YYYY-MM-DD\
    \ hh:mm:ss”格式进行指定。如果你只想设置时间，可以省略日期参数。\n\n```bash\n[root@server ~]# timedatectl\
    \ set-time 9:00:00\n\n[root@server ~]# timedatectl\n```\n\n你可以使用 `timedatectl`\
    \ 命令的 `set-ntp` 选项使用网络时间协议的自动时间同步。传递的参数是 `true` 或 `false`，这将开启或关闭该功能。\n\n```bash\n\
    [root@server ~]# timedatectl set-ntp true\n```\n\n## Chronyd 服务\n\n系统的本地硬件时钟通常是不准确的。`chronyd`\
    \ 服务通过与配置的网络时间协议 NTP 服务器同步，来保持本地时钟运行正常。如果网络不可用，它会将本地时钟同步到 `driftfile` 中计算并记录的\
    \ RTC 时钟漂移上，该文件维护在 `/etc/chrony.conf` 配置文件中。\n\n`chronyd` 服务的默认行为是使用 NTP 网络池项目的时钟来同步时间，不需要额外配置。如果你的系统位于隔离网络中，建议更改\
    \ NTP 服务器。\n"
- fmt: "\nThere is something known as a stratum value, which is reported by an NTP\
    \ time source. This is what determines the quality of the NTP time source. The\
    \ stratum value refers to the number of hops required for the system to reach\
    \ a high performance clock for reference. The source reference clock has a stratum\
    \ value of `0`. An NTP server that is attached to the source clock will have a\
    \ stratum value of `1`, while a system what is trying to synchronize with the\
    \ NTP server will have a stratum value of `2`.\n\nYou can use the `/etc/chrony.conf`\
    \ file to configure two types of time sources, server and peer. The stratum level\
    \ of the server is one level above the local NTP server. The stratum level of\
    \ the peer is the same as that of the local NTP server. You can specify one or\
    \ more servers and peers in the configuration file, one per line. \n\nFor example,\
    \ if your `chronyd` service synchronizes with the default NTP servers, you can\
    \ make changes in the configuration file to change the NTP servers as per your\
    \ need. Every time you change the source in the configuration file, you will need\
    \ to restart the service for the change to take effect.\n\n```\n[root@server ~]#\
    \ systemctl restart chronyd\n```\n\nThe `chronyd` service has another service\
    \ known as `chronyc`, which is a client to the `chronyd` service. Once you have\
    \ set up the NTP synchronization, you may want to know if the system clock synchronizes\
    \ correctly to the NTP server. You can use the `chronyc sources` command or if\
    \ you want a more detailed output, you use the command `chronyc sources -v` with\
    \ the verbose option.\n\n```\n[root@server ~]# chronyc sources –v\n```\n\n## Chapter\
    \ 12 Create a bootable stick\n\nOnce you have downloaded the ISO file, you need\
    \ to create a bootable stick.\nThis means that you must prepare a USB-stick so\
    \ that you can start Ubuntu with it. \n\nFor this task you need an appropriate\
    \ program. \n\nThere are several applications that you can use for this task.\n\
    Etcher is a good choice in my opinion.\nEtcher is free for Linux, Windows and\
    \ MacOS.\n[https://www.balena.io/etcher/](https://www.balena.io/etcher/)\n\nDownload\
    \ the appropriate version and then create the required stick.\nEtcher is self-explanatory.\n\
    \n![etcher foto SW](Images/image00273.jpeg)\n\n1. Select image (the ISO file for\
    \ Ubuntu 18.04.)\n2. Select drive (you will see a selection of sticks that you\
    \ have plugged into a free USB port).\n3. Choose the one you want to use for Ubuntu.\n\
    4. Flash (Start!)\n\nDouble check if the right stick is selected.\nAny content\
    \ on the stick will be completely erased!\n\n## Systemd Journal Preservation\n\
    \nIn this section, we will learn how to make changes to the `systemd-journald`\
    \ configuration such that the journal is stored on the disk instead of memory.\n\
    \n### Permanently storing the system journal\n\nThe system journal is kept at\
    \ `/run/log/journal` by default, which means that when the system reboots, the\
    \ entries are cleared. The journal is a new implementation in Red Hat Enterprise\
    \ Linux 7.\n\nWe can be sure that if we create a directory as `/var/log/journal`,\
    \ the journal entries can be logged there instead. This will give us an advantage\
    \ that historical data will be available even after a reboot. However, even though\
    \ we will have a journal that is persistent, we cannot have any data that can\
    \ be kept forever. There is a log rotation, which is triggered by a journal on\
    \ a monthly basis. Also, by default, the journal is not allowed to have a dusk\
    \ accumulation of more than 10% of the file system it occupies, or even leave\
    \ less than 15% of the file system free. You can change these values as per your\
    \ needs in the configuration file at `/etc/systemd/journald.conf` and one the\
    \ process for `systemd-journald` starts, the new values will come into effect\
    \ and will be logged. \n\nAs discussed previously, the entries of the journal\
    \ can be made permanent by creating a directory at `/var/log/journal`\n\n```\n\
    [root@server ~]# mkdir /var/log/journal\n```\n\nYou will need to make sure that\
    \ the owner of the `/var/log/journal` directory is `root` and the group owner\
    \ is `systemd-journal`, and the directory permission is set to `2755`.\n\n```\n\
    [root@server ~]# chown root:systemd-journal /var/log/journal\n[root@server ~]#\
    \ chmod 2755 /var/log/journal\n```\n\nFor this to come into effect, you will need\
    \ to reboot the system or as a root user, send a special signal `USR1` to the\
    \ `systemd-journald` process.\n\n```\n[root@server ~]# killall -USR1 systemd-journald\n\
    ```\n\nThis will make the systemd journal entries permanent even through system\
    \ reboots, you can now use the command `journalctl -b` to show minimal output\
    \ as per the latest boot.\n\n```\n[root@server ~]# journalctl -b\n```\n\nIf you\
    \ are investigating an issue related to system crash, you will need to filter\
    \ out the journal output to show entries only before the system crash happened.\
    \ That will ideally be the last reboot before the system crash. In such cases,\
    \ you can combine the `-b` option with a negative number, which will indicate\
    \ how many reboots to go back to limit the output. For example, to show outputs\
    \ till the previous boot, you can use `journalctl -b -1`.\n\n## Maintaining time\
    \ accuracy\n\nIn this section, we will learn how to make sure that the system\
    \ time is accurate so that all the event logs that are logged in the log files\
    \ show accurate timestamps. \n\n### Setting the local time zone and clock\n\n\
    If you want to analyze logs across multiple systems, it is important that the\
    \ clock on all those systems is synchronized. The systems can fetch the correct\
    \ time from the Internet using the Network Time Protocol `NTP`. There are publicly\
    \ available NTP projects on the Internet like the Network pool Project, which\
    \ will allow a system to fetch the correct time. The other option is to maintain\
    \ a clock made up of high quality hardware to serve time to all the local systems.\
    \ \n\nTo view the current settings for date and time on a Linux system, you can\
    \ use the `timedatectl` command. This command will display information such as\
    \ the current time, the NTP synchronization settings and the time zone. \n\n```\n\
    [root@server ~]# timedatectl\n```\n\nThe Red Hat Enterprise Linux 7 maintains\
    \ a database with known time zones. It can be listed using the following command.\n\
    \n```\n[root@server ~]# timedatectl list-timezones\n```\n\nThe names of time zones\
    \ are based on `zoneinfo` database that IANA maintains. The naming convention\
    \ of time zones is based on the ocean or continent. This is followed by the largest\
    \ city in that time zone or region. For example, if we look at the Mountain Time\
    \ in the USA, it is represented as “America/Denver”.\n\nIt is critical to select\
    \ the correct name of the city because sometimes even regions within the same\
    \ time zone may maintain different settings for daylight savings. For example,\
    \ the US mountain state of Arizona does not have any implementation of daylight\
    \ savings and therefore falls under the time zone “America/Phoenix”.\n\nThe `tzselect`\
    \ command is used to identify zone info time zone names if they are correct or\
    \ not. The user will get question prompts about their current location and mostly\
    \ gives the output for the correct time zone. While suggesting the time zone,\
    \ it will not automatically make any changes to the current time on the system.\
    \ Once you know, which timezone, you should be using, you can use the following\
    \ command to display the same. \n\n```\n[root@server ~]# timedatectl set-timezone\
    \ America/Phoenix\n[root@server ~]# timedatectl\n```\n\nIf you wish to change\
    \ the current date and time for your system, you can use the `set-time` option\
    \ with the `timedatectl` command. The time and date can be specified in the format\
    \ “YYYY-MM-DD hh:mm:ss”. If you just want to set the time, you can omit the date\
    \ parameters. \n\n``` be[root@server ~]# timedatectl set-time 9:00:00\n[root@server\
    \ ~]# timedatectl\n```\n\nYou can use the automatic time synchronization for Network\
    \ Time Protocol using the `set-ntp` option with the `timedatectl` command. The\
    \ argument to be passed along is `true` or `false`, which will turn the feature\
    \ on or off.\n\n```\n[root@server ~]# timedatectl set-ntp true\n```\n"
