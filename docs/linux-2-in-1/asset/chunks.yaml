    # Shell 会话与配置


    登录会话（login shell）要求用户在启动前先通过身份验证，例如在使用`SSH`(Secure SHell)连接时。如果我们从已验证的会话启动 Shell
    会话（例如使用 `bash` 命令），则会启动非登录会话（non-login shell），因为我们不会被要求提供身份验证详情。


    此外还有交互式和非交互式 Shell 会话之分。当 Shell 会话附加到终端上时，它是交互式的；反之，它是非交互式的。通过 `SSH` 开始的普通会话通常是交互式登录会话。当从命令行运行脚本时，它们通常在非交互式、非登录会话中运行。


    Shell 会话的类型决定了使用哪些文件进行初始化以及顺序。


    ## 配置文件


    作为登录会话启动的会话首先从全局 `/etc/profile` 文件读取配置详情。然后，它们会在用户主目录中查找第一个登录 Shell 配置文件以获取用户特定的配置详情，它会在
    `~/.bash_profile`、`~/.bash_login` 和 `~/.profile` 中读取它能找到第一个文件。一旦找到一个，就不会再读取后续文件。


    相反，非登录 Shell 会话会读取 `/etc/bash.bashrc` 然后是用户特定的 `~/.bashrc` 文件来构建其环境。


    非交互式 Shell 读取 `BASH_ENV`环境变量，然后读取其中指定的文件来定义新环境。


    我们已经学习过如何创建 Shell 变量和环境变量。我们将利用这些知识在 Shell 会话启动时创建它们。由于我们通常希望为登录和非登录会话都设置用户特有的环境变量，因此我们将在
    `~/.bashrc` 文件中定义这些变量。


    在这些文件中，我们可以这样设置环境变量，例如：


    ```bash

    export VARNAME=value

    ```


    注意，这里没有命令提示符 `$`，因为这些是输入到文件中的命令。


    一旦你编辑了这些文件之一，它们将在每次启动 Shell 会话时被读取。为了强制当前 Shell 会话立即读取该文件，我们可以使用：


    ```bash

    $ source ~/.bashrc

    ```


    如果我们要设置系统级范围的变量，通常最好是根据情况将它们添加到 `/etc/profile`、`/etc/bash.bashrc` 或 `/etc/environment`。


    ## 别名 (Aliases)


    Bash 启动脚本中可以使用的另一个有用命令是 `alias` 命令。


    ```bash

    alias

    ```


    ### 添加别名


    `alias` 允许我们为命令或命令加选项的组合创建一个不同的名称，在输入简单的命令名时将使用该名称。例如，为删除命令 `rm` 添加一个别名通常很有有用，这可以确保使用交互模式
    `rm –i`，这样你每次删除任何内容时都必须确认。


    如果我们在其中一个启动脚本中添加以下行，那么每当我们输入 `rm` 时，它将使用 `rm -i`：


    ```bash

    alias rm="rm –i"

    ```


    我们可以使用现有现有名称并更改其行为，或者使用完全随机的名称代表一个命令字符串。


    虽然我不建议这样做，但 `alias` 也可以用于从 MS-DOS（如果你有相关经验的话）切换到 Linux，使用如下别名：


    ```bash

    alias dir="ls"

    alias rename="mv"

    alias md="mkdir"

    alias copy="cp"

    alias del="rm -i"

    ```


    以及其他你认为对个人有帮助的别名。


    ### 删除别名


    可以使用 `unalias` 命令删除已创建的别名。例如，如果在全局设置脚本中设置了别名，你可能想在个人脚本中删除它们。如果我们在上面使用的 `rm` 别名是全局设置的，我们可以在个人的启动脚本中删除它，如下：


    ```bash

    unalias rm

    ```


    这使得我们能够更自由地在全局和用户特定层级自定义我们的 Shell 会话工作方式。


    # 13. 软件安装与包管理


    由于通常需要安装新软件包来增强系统功能，我们将花一点时间简要概述如何从命令行执行此操作。这与文中提到的许多其他任务相比更多是一项系统管理任务，但是一项至关重要的任务。


    根据你使用的系统和目标，可以使用几种不同的程序和命令。由于本指南重点关注 Ubuntu，我们将仔细查看 `apt` 系列命令，但也会提到一些你可能在不同 Linux
    发行版（如 Red Hat、Debian 等）中遇到的其他程序。


    ## 在命令行安装软件包


    我们将首先查看 Ubuntu 上的包管理、安装、删除和更新。软件包是软件包，是安装某个软件或实用程序所需的适当文件、库、依赖项、元数据等的集合。我们将使用一个名为
    `JuliansPackage` 的虚拟包。


    ### Ubuntu apt


    `apt` 系列是用于包管理的命令行工具，为软件包系统管理提供了命令行界面。我们将查看 `apt`、`apt-get` 和 `apt-cache` 以及一些常用的用法和可用的基础命令。存在几个使用
    `apt` 系列的前端图形界面，例如 `aptitude` 和 `synaptic`。可用的 `apt-get` 和 `apt-cache` 命令被认为是较低级别的命令行选项。


    我们可以执行几项与 `apt-get` 类似的系统级和特定包的任务，我们稍后将详细介绍。`apt` 的工作方式类似于 `apt-get` 和 `apt-cache`
    的一个前端。


    重要的是，我们必须确保拥有 root 权限以便使用这些系统管理命令。


    现在，让我们简要查看 `apt`。如果我们想更新 APT 软件包数据库，可以使用：


    ```bash

    $ apt update

    ```


    升级系统上所有已安装的软件包：


    ```bash

    $ apt upgrade

    ```


    获取可用软件包列表：


    ```bash

    $ apt list

    ```


    要搜索 APT 软件包数据库，可以使用：


    ```bash

    $ apt search Julian

    ```


    此搜索使用了正则表达式（其核心是 apt cache），并应该会显示包 `JuliansPackage`。


    对于处理单个软件包，我们可以使用以下命令。


    按名称安装软件包：


    ```bash

    $ apt install JuliansPackage

    ```


    以及删除一个软件包：


    ```bash

    $ apt remove JuliansPackage

    ```


    ### apt-get


    `apt-get` 是一个用于包管理的低级命令行工具，通常被认为是其他使用 APT 库的工具的后端，例如 `aptitude`，甚至作为纯命令行工具的 `apt`。


    有几个 `apt-get` 命令是适用于系统范围的，而不是用于单个软件包。它们允许我们更新 APT 可用软件包数据库、安装已安装软件包的更新、删除不再需要的软件包，甚至在新发行版可用时执行完整的发行版升级。我们将首先查看系统级命令。


    为了从系统存储库更新 APT 软件包列表，可以使用：


    ```bash

    $ apt-get update

    ```


    一旦更新了软件包列表，可以使用以下命令升级所有已安装的软件包：


    ```bash

    $ apt-get upgrade

    ```


    如果我们想整个发行版升级到不同的版本（例如当新发行版发布时），可以使用：


    ```bash

    $ apt-get dist-upgrade

    ```


    自动删除任何不再需要的软件包，例如仅由已删除的包使用的库：


    ```bash

    $ apt-get autoremove

    ```


    这些是处理系统的。以下命令处理单个软件包或多个命名的软件包。


    安装软件包（在此处称为 `JuliansPackage`），使用：


    ```bash

    $ apt-get install JuliansPackage

    ```


    上面的命令需要确认后继续。我们可以通过添加 `-y` 选项来强制命令继续：


    ```bash

    $ apt-get –y installs JuliansPackage

    ```


    '
- fmt: '

    If we want to install more than one package at the same time, we can list them
    on the command line as follows.


    ```bash

    apt-get install JuliansPackage JacksPackage

    ```


    To remove a package, we use


    ```bash

    apt-get remove JuliansPackage

    ```


    There are also several other available commands for advanced usage, such as `purge`,
    `source` (to retrieve source code files) amongst others. Check `man apt-get` for
    a more complete list of available commands and options.


    ### apt cache


    `apt-cache` allows a variety of options to be performed on the APT package cache.
    These operations are not manipulative of system state but allow the facility to
    search for packages and generate valuable output from the package metadata. One
    incredibly useful command, the `search` command, allows searching of the APT package
    database which we use with a regular expression search term.


    ```bash

    apt-cache search Julian

    ```


    This allows us to retrieve the correct name of a package that we may want to install
    but are unsure of the name that we require for our installation command. The search
    above would reveal our package `JuliansPackage`.


    ### Other Flavours of Linux and Package Managers


    It is important to appreciate that there are alternatives depending on the Linux
    distribution such as `yum`, `rpm`, `dpkg`.


    ### dpkg


    `dpkg` is the software used to install, build, remove and manage Debian `.deb`
    packages. `dpkg` can be used on the command line and its behaviour is controlled
    by commands that consist of an action and usually a parameter list.


    There is also a graphical front end for `dpkg`, `aptitude`, which can be a more
    user-friendly way to access the commands and manage packages, for those that prefer
    to work that way. Since this book is about the command line, we shall not look
    at `aptitude`.


    We shall just mention a few basic commands for the most common purpose, since
    Ubuntu is heavily based on Debian.


    To list all the installed packages on your system use


    ```bash

    dpkg -l

    ```


    To install a deb package, we can use `dpkg` as follows


    ```bash

    dpkg –i JuliansPackage.deb

    ```


    And to remove a deb package we use the following. Note that the name that we use
    does not include the `.deb` extension.


    ```bash

    dpkg –r JuliansPackage

    ```


    So there are a few basic commands for using `dpkg` which is something that you
    may find that you need to do even if you are used to using an Ubuntu system and
    the `apt` commands, as some packages may only be available as `.deb` packages.


    ### Yum


    `yum`, (Yellowdog Updater, Modified), is the primary command line tool for managing
    Red Hat Linux RPM packages having taken over from the `rpm` command, seen below.
    `yum` can be used for all package management tasks such as getting, installing,
    deleting and querying. We shall look at a couple of the most common use of `yum`.


    To install an rpm package using `yum` we user


    ```bash

    yum install JuliansPackage.rpm

    ```


    This will perform dependency checks and ask us whether we wish to continue, which
    we will need to confirm. We can avoid that using the `–y` option


    ```bash

    yum –y installs JuliansPackage.rpm

    ```


    Likewise, in order to remove a package, first with confirmation being required,
    then without, we use


    ```bash

    yum remove JuliansPackage.rpm

    ```


    ```bash

    yum –y removes JuliansPackage.rpm

    ```


    We can update a package to the latest version using


    ```bash

    yum update JuliansPackage.rpm

    ```


    These are a few of the more basic commands. Check out `man yum` if you are using
    a Red Hat based system that makes use of `yum` as a package manager.


    ### rpm


    The RPM Package Manager, `RPM`, can be used for installing software on Unix-like
    systems that use the `rpm` package format, particularly Red Hat Linux. Packages
    consist of an archive of files, and specific package information, including name,
    version, and description.


    First it is necessary to execute the following commands as root, either using
    the `sudo` command, or by changing to the root user.


    To install a package, that we shall here call `JuliansPackage.rpm`, we use


    ```bash

    rpm –i JuliansPackage.rpm

    ```


    and to upgrade it from an earlier version we use


    ```bash

    rpm –U JuliansPackage.rpm

    ```


    In order to remove an installed package, we use


    ```bash

    rpm –ev JuliansPackage.rpm

    ```


    As usual the best way to familiarise oneself with this command is to use `man
    rpm`.


    So that is a very brief introduction to a variety of package management techniques
    and command line utilities available on different flavours of Linux. We shall
    complete our brief tour of some of the simpler aspects of the Linux Command Line
    Interpreter with a few useful command line tools.


    ## 14. Testing Network Connectivity


    Sometimes your networking may not work as expected and you will need to troubleshoot
    the problem by testing the network connectivity.


    The following commands will be covered in this section:


    - `ping`

    - `traceroute`


    ### ping


    The `ping` command is a basic troubleshooting command that can be used to verify
    network connectivity.


    The following subsections will be covered in this section:


    - Loopback

    - Default Gateway

    - IP

    - Hostname


    #### Loopback


    If you `ping` the loopback address `127.0.0.1` it verifies that the networking
    service is working. In the example below the `ping` command is successful. Each
    line `64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.073 ms` indicates a successful
    `ping`. The `ping` command will continue until you press `Ctrl+C`.


    In the example below the `ping` to the loopback address is unsuccessful as the
    network service is not running.


    #### Default Gateway


    On a network the default gateway is the router or device that leads out of the
    network usually eventually to the Internet. If your system cannot communicate
    with the default gateway, then it cannot access the Internet. The default gateway
    is normally the first useable IP address in a network but that is not a requirement.
    For example, if the network is `10.0.2.0/24` then the default gateway would be
    `10.0.2.1`. In the example below the `ping` to `10.0.2.1` was successful meaning
    the system can communicate with the default gateway.


    If you are unable to `ping` the default gateway it does not mean that there is
    anything wrong with your system as it could be a problem with the network.


    #### IP


    If you can `ping` the default gateway the next step is to `ping` something past
    the default gateway, preferably something on the Internet. In the example below,
    a `ping` to `8.8.8.8` is successful which means that everything is working, and
    the system can reach the Internet. The `ping` command used the `-c 3` option which
    cause the `ping` command to only do three pings and then stop vice running until
    pressing `Ctrl+C`.


    #### Hostname


    While `pinging` an IP address on the Internet will show you if your network connectivity
    is working it does not give you the entire picture. In order to be able to access
    web pages and other services by using a hostname requires DNS to be configured
    and working correctly.


    #### traceroute


    The `traceroute` command is used to trace the path of the IP packets from your
    system to another system. In the example below a the `traceroute` command is used
    to trace packets to `www.somewebite.com`.


    ## 5.4 Name Resolution


    Name Resolution is the process of converting hostnames to IP addresses. The way
    the Internet works today we mostly use hostnames and domains to connect to websites
    and other resources. Your system, however, needs to know the IP address of where
    you want to go in order to get there.


    - `/etc/hosts`

    - DNS


    #### /etc/hosts


    When the Internet was very young, you had to know the IP address of any site that
    you wanted to access. Then the hosts file was created and shared among the users
    of the Internet which worked because there were not many people on the Internet.
    The hosts file holds the manual mapping of hostnames to IP address. With the advent
    of DNS, the hosts file was no longer necessary but it still remains in Linux as
    a fallback Name Resolution method.

