    # 第 7 章 使用 Shell


    有时，你会发现在处于 GUI 桌面环境中某些某些运行不正常——有时程序会崩溃，整个系统会拒绝响应鼠标点击。甚至会出现 GUI 完全无法启动的情况。当你遇到故障时，你仍然可以告诉你的操作系统该做什么，但你必须使用文本屏幕或
    Shell 来操作，Shell 是 Linux 的命令解释器。


    由于 Linux 本质上是一个 Unix 程序，你将经常使用文本终端完成许多任务。尽管桌面提供了通过鼠标点击访问任何内容的便利性，但在某些情况下，你需要访问终端。


