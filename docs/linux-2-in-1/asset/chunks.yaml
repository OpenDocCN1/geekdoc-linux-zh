- fmt: '

    This is what the Desktop Version may look like once you have it up and running.
    As you can see, the GUI provides an interface that is very familiar to Windows
    and MAC users. You will see icons, task bars, tools, and see how you could multitask
    by toggling the windows.


    ## Server Version


    Again, using Ubuntu as an example for an installation, you will start by fetching
    and downloading the `.ISO` file from the website [www.Ubuntu.com](http://www.ubuntu.com).
    Chose the version you will need for the task (desktop, netbook, server, cloud,
    etc.), and burn the one you need after you check your computer settings. Make
    sure the requirements are compatible.


    You will probably want to choose a larger bit if you want a server. Download it
    to a disc or USB, in the live environment again, which is preferable, and reboot
    off this and not your hard drive.


    It make take some time due to its large size and internet speed. Be patient. It
    also won’t take up too much space. It also does not matter the age of your system.
    In most cases, you can go back 5-6 years and use an old system. Remember that
    the server version is bare bones, no graphics.


    Ubuntu Installer Boot Menu Screen (www.pendrivelinux.com)


    Follow any prompts. You will see something asking for a Name/ Hostname and you
    can just call it Server, unless you feel inclined to give in a moniker. Answer
    yes to any of the settings offered in the guides, except for some questions of
    choice when you need to provide a particular response. Some of the questions may
    get too technical for a beginner. It is recommended to stay only with what you
    are comfortable in doing.


    When you do this reboot and go through the set up prompts, immediately you will
    notice the `Shell`. Remember that the server edition will make it so that you
    must have knowledge of commands after following the installation the guides. A
    Filesystem Hierarchy Standard (`FHS`) will help you navigate locations and commands
    for using Linux by Commands.


    At the install you follow prompts to add your user name, password and other set
    up features. The option for encryption would secure the files in your home directory,
    but it is not suggested to do this right now until you have more knowledge about
    Linux. The frequency of updates also are not needed but you can later do periodic,
    manual updates will be fine. Unlike Windows, you will not need the frequent, automatic
    updates.


    You will also chose what type of server you would like it to be. If you aren’t
    sure, you should do some Google searches. For example, what type of server for
    a website, or files? Once you chose the type, it will install what you need, and
    only what you need. Again, it is a pared-down version and you will have this opportunity
    to choose exactly what you need, for exactly what you chose.


    Example of Ubuntu Server Edition ([www.pwrusr.com](http://www.pwrusr.com))


    ## Dual Booting Servers


    There is also the option to partition the Server version as well. This however,
    if usually much more complicated than with the process for the Desktop. It is
    suggested that you really do some research before you decide to partition the
    Server, to share space with another Operating System. It may not be something
    for a beginner to delve into just yet. Then again, you won’t be able to learn
    if you cannot explore.


    ## Adding a Database to MariaDB


    In other books I have written about Linux, I had users use a web tool called `phpmyadmin`
    to add users and databases. In this book, I want to take a different approach
    and do this from the command line interface.


    As we progress into installing WordPress, it will need a database to store its
    information into. In these next steps, we will create that database and a user
    to connect to that database.


    To begin, we must login to MariaDB’s root account by using the following command:


    ```

    sudo mysql –u root –p

    ```


    As you may have guessed, the `u` flag symbolizes user and `p` stands for password.


    You will be prompted to enter the root password for MariaDB. You would have set
    this when we ran the command to secure the install.


    Once you are logged in, the next step is to create the database. We are going
    to name this database `wordpress`.


    ```

    CREATE DATABASE wordpress;

    ```


    Please note that capitals do matter here as they do for other commands. Additionally
    all MySQL and MariaSQL statements must end with a semi-colon.


    That was easy! Now we need to create a new user account that will only be able
    to operate with the database we created. This allows for good security and better
    control of database permissions.


    For me, I am going to call the new user account `wpuser`. In the command below,
    you can use a different name if you wish and change `password` to a secure password.
    We will need this password as we connect WordPress to the database.


    ```

    CREATE USER wpuser@localhost IDENTIFIED BY ‘password’;

    ```


    Right now you have a database and user account, but the user account cannot yet
    access the wordpress database. We need to grant that user access to the wordpress
    database with the following command.


    ```

    GRANT ALL PRIVLEGES ON wordpress.* TO wpuser@localhost IDENTIFIED BY ‘password’;

    ```


    Our user now has access to the database, but we need to do something called `flush`
    so that MySQL/MariaDB knows about the privilege changes we made. Use the following
    command:


    ```

    FLUSH PRIVLEGES;

    ```


    Now that we have done these commands, we can exit MySQL/MariaDB by using the following
    command:


    ```

    exit

    ```


    Easy right? There is much more to learn about using MySQL and MariaDB. I recommend
    you continue expanding your knowledge on these topics as they are a very in demand
    skillset.


    ## 8. Installing And Setting Up Linux


    There a couple of ways to install Linux from your current operating system. You
    can choose to download Linux from either a live CD or a USB drive, and then boot
    Linux from your system in order to install it. For beginners, this can get a little
    confusing, but it doesn’t require a lot of technical knowhow and once you get
    through the first time, installing another system is simple if you choose to do
    so. For this book, we will use the example of installing Linux on a computer currently
    running Windows.


    ### Installing from a Live CD


    To install Linux from a live CD, you will first need to download the appropriate
    file. Before you do this, you will need to select your distribution and visit
    the homepage. From there, you can go through the downloads page and find the file
    that is suited to your system. There are usually a few different files for each
    system: some are optimized for netbooks and others for desktops, offering both
    32- and 64-bit versions. After you locate the version required by your system,
    download the `.ISO` file.


    Once you have the file on your computer, burn it onto a blank CD. There are programs
    you can download for this but generally your operating system should have some
    built-in programs to make this step relatively simple.


    After the file is burned to the CD, restart your computer. Before the operating
    system boots up, you will be presented with the option to enter the boot menu.
    In this menu, tell the computer to boot from the CD, save your options, and restart
    once again. If you are unsure of where to go to select these options, consult
    your operating system manual and look for the boot options. This should present
    you with a step-by-step procedure for setting the boot options.


    You are then presented with the option to either install Linux or give it a try.
    It is highly recommended that you go through a trial run before installing Linux
    to ensure that you have a good feel for the desktop and that it is what you had
    in mind. Once you have finished your practice run, it is easy to select the option
    to install.


    ### Installing from a Live USB

