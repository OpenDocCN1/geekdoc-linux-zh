    ## If Else


    You’d agree with me that there are times when you would want to perform a particular
    action if a statement is true, and another set of actions if it is false. You
    can fit this in with the ‘else’ mechanism.


    Look:


    You could now easily read from a file if it is delivered as a command line argument,
    ‘else’ read from “stdin” as illustrated below.


    **Note**: `stdin` (standard input) is an input stream where data is sent to a
