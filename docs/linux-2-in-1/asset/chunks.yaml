    本节将涵盖以下子节：


    - Ubuntu

    - Fedora

    - Debian


    ## Ubuntu


    下面的示例显示了默认的 Ubuntu hosts 文件。


    如果你想向主机名映射中添加自定义 IP，必须编辑 `/etc/hosts` 文件。以下是条目的语法格式：


    `ip_address hostname`


    ## Fedora


    下面的示例显示了默认的 Fedora hosts 文件。


    如果你想向主机名映射中添加自定义 IP，必须编辑 `/etc/hosts` 文件。以下是条目的语法格式：


    `ip_address hostname`


    ## Debian


    下面的示例显示了默认的 Debian hosts 文件。


    如果你想向主机名映射中添加自定义 IP，必须编辑 `/etc/hosts` 文件。以下是条目的语法格式：


    `ip_address hostname`


    ## DNS


    域名系统（DNS）是一种基于资源定位符、主机名和域名的互联网系统进行命名的系统，并在发生变化时提供快速分发更新的机制。


    当你使用网络浏览器连接到网站时，你会输入类似 `[www.somewebsite.com](http://www.somewebsite.com)` 的内容，这被称为通用资源定位符（URL）。从右向左看，URL
    以 `.com` 开头，这是一个顶级域名（TDL）。有很多顶级域名，如 `.com`、`.net`、`.org`、`.mil` 等，每个顶级域名都有一个控制它的组织。URL
    的下部分是域名，`somewebsite`。当有人注册域名名时，该域名将在控制该域的适当顶级域名机构处注册，该机构反过来会发布有关该域名的 DNS 信息。URL
    的最后部分是资源定位符 `www`，它是网页的资源定位符。


    本节将涵盖以下命令：


    - nslookup

    - dig


    ### nslookup


    `nslookup` 命令可用于查询 DNS 服务器关于域名的信息。


    `nslookup` 命令的基本用法是在命令行中执行，如下例所示。


    输出列出了 DNS 服务器的 IP 地址。`Non-authoritative answer` 一行意味着答案不是来自负责该域的主要 DNS 服务器，而是来自另一个知道答案的
    DNS 服务器。输出的最后部分是你正在查找的名称和 IP 地址。


    如果你在不输入域名的情况下输入 `nslookup` 命令，将进入交互模式。在交互模式下，你会有一个 `>` 字符，这意味着 `nslookup` 正在等待你的输入。


    交互模式下的 `server` 选项将显示你正在从哪个 DNS 服务器获取名称解析。你也可以使用 `server` 选项更改用于查询的 DNS 服务器。这不会改变用于普通名称解析的服务器。在下面的示例中，DNS
    服务器被更改为 `10.8.4.3`。


    `set` 类型选项允许你更改要查找的 DNS 记录类型。默认情况下，`nslookup` 显示 `a` 记录，这些是资源记录。在下面的示例中，类型被设置为
    `ns`，用于名称服务器或 DNS 服务器。下面的示例显示了 `somewebsite.com` 域的四个名称服务器。


    在下面的示例中，类型被设置为 `mx`，用于邮件交换器或电子邮件服务器。下面的示例显示了 `somewebsite.com` 域的五个邮件服务器。


    在下面的示例中，类型被设置为 `a`，用于资源记录。下面的示例显示了 `www.somewebsite.com` 的 `a` 记录。


    在下面的示例中，类型被设置为 `aaaa`，用于 IPv6 资源记录。下面的示例显示了 `www.somewebsite.com` 的 `aaaa` 记录。


    要退出 `nslookup` 交互模式，请输入 `exit`。


    ### dig


    `dig` 是另一个可用于查询 DNS 域名信息的命令。


    `dig` 命令的基本用法是在命令行中执行，如下例所示。输出列出了 `www.somewebsite.com` 的 IP 地址。标记行 `AUTHORITY:
    0` 意味着答案是非权威的。


    `dig` 命令默认查找记录。`dig` 命令还可以使用 `-t` 选项后跟记录类型（`ns`、`mx`、`a` 或 `aaaa`）来查找其他类型的记录。


    ### route


    `route` 命令用于查看系统已知的网络路由。在大多数只有一个网卡（NIC）的系统中，路由方面并没多少可做的。系统拥有的最重要的路由是到默认网关的路由，即通往互联网的路由。


    如果你的系统有多个网卡，那么会有多条路由。确保默认网关指向正确的方向非常重要。添加默认网关的语法如下：


    `route add default gw ip_address dev interface_name`


    在下面的示例中，`route` 命令用于将 `192.168.56.1` 添加默认网关，可以通过 `enp2s0` 接口访问。


    ## 15. 文件操作


    在本章中，我们将讨论创建文件、复制、移动、查看内容、将命令输出重定向文件等。在这里我们处理的文件通常是文本文件。


    我们的主题顺序将如下：与其说是分类顺序，不如说是根据需要使用命令的时机来给出示例，因此主题将提供更高效的处理方式。我认为这是一种更好的叙述风格。


    ### touch


    创建文本文件最简单的方法之一是使用 `touch` 命令。例如，通过 `touch test` 命令，我们可以创建一个名为 `test` 的文本文件（如果你愿意，可以命名为
    `test.txt`）。


    ![说明：C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-1.png](img/image00274.jpeg)
    该命令不仅用于创建文本文件，你还可以用它更新现有文件的时间戳。


    ![说明：C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-2.png](img/image00275.jpeg)


    ### cat


    `cat` 命令用于从终端屏幕读取文件内容，也用于向文本文件写入内容。例如，要写入一个空 test 文件，让我们输入 `cat > test` 命令（注意
    `>` 运算符的使用），输入我们想要的短语，并按 `CTRL + D` 结束文本。因此，我们在控制台上输入的内容将记录到我们的文件中。要读取文件内容，我们可以使用
    `cat test` 命令。


    ![说明：C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-3.png](img/image00276.jpeg)
    在上面的示例中，我们将文本写入了现有的文件中。即使没有名为 `test` 的文件，我们的命令也会创建一个文件并保存到指定短语的文件中。


    如果你再次检查上面的示例，我们使用了 `>` 运算符，我们将其称为重定向运算符。该运算符用于重定向要生成的文件。该运算符有许多使用方式。给定的表达式、命令输出等可以重定向到文件，也可以将文件内容作为参数。


    我们稍后会提供关于这些示例。现在我们只讨论 `>` 和 `>>` 运算符。要向现有的文本文件写入任何内容，文件必须是空白的。如果文件为空，它将删除旧内容并写入新内容。当然，这是使用
    `>` 运算符的情况。如果我们使用 `>>` 运算符，在不删除文件内容的情况下，我们输入的短语将添加到文件的最后一行。让我们通过一些示例来解释我们的意思。


    ![说明：C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-5.png](img/image00277.jpeg)
    让我们解释一下我们在做什么：


    - `touch test-2` 我们创建一个新的文本文件。

    - `cat > test-2` 我们给出命令，然后输入我们想要的短语，最后按 `Ctrl + D` 结束。

    - `cat test-2` 我们查看文件内容。

    - `cat >> test-2` 我们写了一些新的短语，最后按 `CTRL + D` 结束文件。

    - `cat test-2` 我们看到最后输入的内容添加到了文件内容中。


    '
- fmt: '

    - `cat > test-2` (Please note that we use `>` only once) we add our new content
    in our file.

    - `cat test-2` When we checked again with the content of our files, we found that
    the old content is deleted and the content we enter the final written.


    We learn that we can read the file content with `cat` command. İf we use `cat`
    command with `-A` the tab in the text shows spaces with `^|`, and shows end of
    the line with `$`.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-6.png](Images/image00278.jpeg)


    To change lowercase letters to uppercase letters in a text file that we want to
    see the contents or to do the opposite, we can use `cat` and `tr` command together.
    For example, to change lowercase letters to uppercase letters in test file, we
    can use `cat test | tr ''a-z'' ''A-Z''`.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-7.png](Images/image00279.jpeg)


    ### Piping


    Here, I want to talk briefly about that we will use again in time, about `|` sign
    in and piping (pipe). As seen in the example above, with the pipe transaction
    an output command is given as input command. When we examine the example, by reading
    the contents of test file is given as input to `tr` command and `tr` command in
    accordance with the parameters used in the file content with its trade. Piping
    process is made by `"|"``. Yes, let us keep to the examples again.


    We talked about that we can read the contents of the text file with `cat` command
    to the terminal. Now, for example, let’s look at the `passwd` file contents with
    `cat /etc/passwd` command.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-8.png](Images/image00280.jpeg)


    The file content shown as it is. If we want to see the content with the row numbers,
    we must use `cat -n /etc/passwd` command.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-8-1.png](Images/image00281.jpeg)


    ### echo


    Normally with this command, any desired statements sent as output to the terminal
    screen. Besides this it can be used to create a file and write any string into
    it. Now let''s create a new file and expression as well as we want to let you
    write into the file using the `echo` command.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-9.png](Images/image00282.jpeg)


    As you see with `echo "master of the linux" > linuxcmd` command file, we created
    `linuxcmd` command that did not exist before and wrote into master of linux. Previously
    existed an empty file can be written in this way. But if the file is not empty,
    then we can use `>>` operator as we did in the `cat` command before.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-10.png](Images/image00283.jpeg)


    I said using the operators command output redirection could lead to a file. By
    the way, let''s also do a small example of this. For example, lets direct `ls
    -l` command output to list file name that we create. Which means the contents
    of the command output is written into the file we named `list`. To do this, use
    `ls -l > list` command is enough.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-11.png](Images/image00284.jpeg)


    Now let''s give an example about how we can use `echo` command in another way
    and have additional information. First, let''s look at the contents of the directory
    with the `ls` command that we were in, and then use the `echo *` command, let''s
    check if the output is the same in both commands.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-12.png](Images/image00285.jpeg)


    As you can see the output of the two commands are the same. The reason is that,
    before starting the `echo` command shell, with `*` character and in `/zeyno` directory
    all file index names to the command line get in place and give them as each to
    `echo` parameters. This means, with the fact that `echo *` command screen asterix
    (`*`) character was supposed to pop up, but it was not. So that means, asterix
