    # Chapter 2 What is Ubuntu?


    The Linux operating system Ubuntu exists since 2004.


    The Ubuntu project was founded by Marc Shuttleworth, a South African multimillionaire,
    who is also the main sponsor through his company Canonical.


    In Zulu language, Ubuntu means "humanity towards others “.


    The focus of the project is to develop an operating system that should be available
    to as many people as possible all over the world.


    Special attention was paid to intuitive usability and tools for universal accessibility.


    Ubuntu is open source software that is available free of charge.


    Since the release of the first version, the degree of recognition and popularity
    could be increased steadily.


    Ubuntu is based on Debian. This means that the package management created by Debian
    and the software selection has been adopted.


    However, over time both distributions moved away from each other.


    For example, Ubuntu has often been accused of being too commercial, while Debian
    continued to follow the philosophy of open source, denying some of the innovations
    that Ubuntu introduced.


    Each year in April and October a new version of Ubuntu is released, which receives
    support for nine months.


    It is named after the year and month of release.


    Ubuntu 18.10 was released in October (10) of 2018 (18).


    Support means that Ubuntu''s operating system receives updates in the form of
    security updates and bug fixes.


    However, every two years (even years!) a special version is released which will
    receive support from Ubuntu for a period of 5 years.


    This is called an LTS version.


    LTS stands for Long-Term-Support.


    The current version is Ubuntu 18.04.


    Support for this version will end after 5 years in April 2023.


    The next LTS version Ubuntu 20.04 will be released in April 2020.


    Support for this version will end after 5 years in April 2025.


    All other versions are supported for 9 months.


    ![support english](Images/image00270.gif)


    The advantage of short-term supported systems is that the software they contain
    is usually more up to date than that of the last regular LTS-version.


    The LTS-version essentially remains the same for five years.


    Updates only include bug fixes and security patches.


    This may be too conservative for some users in the long run.


    However, the older a software is, the more it is tested and therefore more stable.


    Newer versions of applications, such as those included in the short-term supported
    versions, may be more unstable because the testing period was shorter.


    In this quick guide, I describe Ubuntu 18.04 LTS.


    Much of it is also applicable to Ubuntu 18.10 and Ubuntu 19.04.


    For beginners it is recommended to try out the LTS version first.


    A Shortterm- version makes sense if the LTS version does not support your hardware
    optimally.


    In addition to the official names that refer to the release date, Ubuntu versions
    always have an additional fantasy name.


    That is 18.04 Bionic Beaver and 18.10 Cosmic Cuttlefish.


    # Chapter 3 Linux set-up process


    In this section, we will highlight the process of installing and configuring Debian,
    showing you every single step along the way. 


    The types of installations 


    Debian offers a variety of methods for a proper setup. This includes a graphical
    and a text-based installation; we will use the former. For installation media
    the Debian developers offer three variants: 


    *   A CD or DVD for 32 bit and 64 bits 


    *   A network image for 32 bit and 64 bits (a so-called Netinst-ISO) 


    *   A tiny CD for 32 bit or 64 bits 


    We also have test media available. These include live images for 32 bit and 64
    bit and allow you to try Debian before installing it on your computer. During
    the time of writing this document, version 9.5 is the current stable release of
    Debian. The setup described here is based on this release and the amd64 architecture. 


    After downloading the network image from www.debian.org/distrib, no further static
    images are required to be referenced in the system. Instead, it depends on the
    internet connection to retrieve the packages to be installed and keep your operating
    system up to date. 


    The entire process will take you about an hour, and it allows you to have a lean
    software selection according to your specific needs. Software packages that you
    do not use will not be available on your system. They can be added whenever you
    feel the need for them. 


    The target system of our installation is an XFCE-based desktop system for a single
    user with a web browser and a music player. For the web browser we use Mozilla
    Firefox and for the music player, VLC. Both programs are a permanent component
    of the Linux distribution. The environment we use for demonstration purposes is
    a virtual machine based on VirtualBox with 4 GB of RAM and 15 GB of disc space. 


    Installing Linux Step-by-Step 


    Boot Menu


    In order to begin with the installation of Debian, first, boot the computer (in
    our case the VirtualBox image) from the ISO image you have downloaded. If you
    are also using a virtual machine, see your virtual machine vendor website for
    help on how to enable the ISO image. Next, wait for the boot menu to appear on
    the screen. The image below shows you the different options that are offered.
    Using the cursor keys, you can navigate the boot menu, and the Enter key selects
    an entry. 


    The different options are: 


    Graphical install: start the installation process using a graphical installer 


    Install: starting the installation process using a text-based installer 


    Advanced options: select further options like Expert mode, Automated install or
    Rescue mode (see image below for more details) 


    Help: get further help 


    Install with speech synthesis: starting the installation process with speech support 


    From the main boot menu choose the Graphical entry install and press the Enter
    key to proceed. 


    Language Selection 


    Next, choose the language you prefer to be used during the entire installation
    process. The dialogs and messages are translated accordingly. This selection does
    not determine the language irrevocably your Linux system will have; you can always
    choose a different language later. 


    The image below shows the dialog box. English is already pre-selected, and so
    you just must click the Continue button on the lower-right corner of the dialog
    box in order to continue. 


    Location Selection 


    Third, select regarding your location (see image below). Based on your language
    setting made before, the countries are listed in which the chosen language is
    mainly spoken. This also influences the locale settings like the time zone your
    computer is in. In order to have a different setting choose the entry titled other
    from the end of the list and go on from there. Immediately you are over, click
    the Continue button to proceed with step four. 


    Keyboard Selection 


    Fourth, choose your keyboard layout from the list (see image below). For the United
    States, the pre-selection is American English. If you use a different keyboard
    layout select the right one from the list. If done, click the Continue button
    to proceed with step five.   


    Network Setup 


    Step five includes loading the installer components from the ISO image, and the
    detection of the network hardware in order to load the correct network driver.
    Then, the installer tries to connect to the internet to retrieve an IP address
    via DHCP from your local network server. 


    When done, you can set up the hostname of your computer (see image below). Choose
    a unique name for your machine that consists of a single name and does not exist
    yet in your local network segment. It is common to use names of fruits, places,
    musical instruments, composers and characters from movies. In this case, we choose
    the name debian95 that simply represents the Linux distribution and its number
    version'
