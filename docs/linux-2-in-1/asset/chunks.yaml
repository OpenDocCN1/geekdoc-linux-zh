    Note: The file that you are specifying at the destination should be a unique file.
    If you specify an existing file, you will end up overwriting the content of that
    existing file.


    ```bash

    [student@desktop ~]$ cd Documents

    [student@desktop Documents]$ cp one.txt two.txt

    ```

    This will copy content of `one.txt` to `two.txt`.


    Similarly, you can copy from the current directory to a file in another directory
    as shown below.


    ```bash

    [student@desktop ~]$ cp one.txt Documents/two.txt

    ```

    This will copy content of `one.txt` in home directory to `two.txt` in the Documents
    sub-directory.


    # Move Files


    The `mv` command can be used for two operations. If you are using it in the same
    directory, it will rename the file. If you are specifying another directory, it
    will move the file to the destination directory. The content of the files are
    retained if you rename or move the file. Also note that if the file size is huge,
    it may take longer to move from one directory to another.


    ```bash

    [student@desktop ~]$ ls

    Hello.txt

    [student@desktop ~]$ mv Hello.txt Bye.txt

    [student@desktop ~]$ ls

    Bye.txt

    ```

    You can see that in this example, since we were operating in the same directory,
    the `mv` command just renamed the `Hello.txt` file to `Bye.txt`.


    ```bash

    [student@desktop ~]$ ls

    Hello.txt

    [student@desktop ~]$ mv Hello.txt Documents

    [student@desktop ~]$ ls Documents

    Hello.txt

    ```

    In this example, you will see that `mv` command moved `Hello.txt` file from the
    home directory to the Documents subdirectory.


    # Deleting Files and Directories


    The `rm` command can be used to delete files. To delete directories, you will
    need to use `rm -r`, which will delete a directory, subdirectories and files in
    the whole path.


    Note: There is nothing such as trash or recycle bin while operating from the command
    line. If you delete something, it is deleted permanently.


    ```bash

    [student@desktop ~]$ ls

    File1.txt Directory1

    [student@desktop ~]$ rm file1

    [student@desktop ~]$ ls

    Directory1

    [student@desktop ~]$ rm -r Directory1

    [student@desktop ~]$ ls

    ```

    The above command has demonstrated how you can delete a file and a directory using
    the `rm` command and using the `-r` option.


    Also note that there is a `rmdir` command, which can be used to delete a directory
    as well provided that the directory is completely empty.


    # File Globbing


    Management of files can become hectic if you are dealing with many files. To overcome
    this hurdle, Linux offers a feature called file globbing, also known as path name
    expansion. It uses a technique called pattern matching, also known as wildcards,
    which is achieved with the use of meta-characters that expand and allow operations
    to be performed on multiple files at the same time.


    ## Pattern matching using `*` and `?`


    ```bash

    [student@desktop ~]$ ls a*

    alpha apple

    ```

    As you can see, the `*` is used as a wildcard to match a pattern, which has any
    files that begin with `a`.


    You can try this pattern placing the start at different locations such as `*a`
    and `*a*`.


    ```bash

    [student@desktop ~]$ ls ???

    aretabmap

    ```

    The number of question marks defines the number of characters in a file name.
    The output will show all files, which have a filename of 3 characters. You can
    try it with additional question marks as well.


    ## Tilde Expansion


    The tilde symbol `~` followed by a slash `/` will point to the active user’s home
    directory. It can be followed by a directory name and can be used with commands
    such as `cd` and `ls`.


    ```bash

    [student@desktop ~]$ ls ~/Documents

    file.txthello.txt

    [student@desktop ~]$ cd Documents

    [student@desktop Documents]$ cd ~/

    [student@desktop ~]$

    ```


    ## Brace Expansion


    The brace command is used when files have something in command, and you do not
    want to type it repetitively. It can be used with strings, which are comma-separated,
    and with expressions, which have a sequential nature. You can have nested braces
    as well.


    ```bash

    [student@desktop ~]$ echo {sunday, monday, tuesday}.log

    sunday.log monday.logtuesday.log

    [student@desktop ~]$ echo file{1..3}.txt

    file1.txtfile2.txtfile3.txt

    [student@desktop ~]$ echo file{a{1, 2}, b, c}.txt

    filea1.txtfilea2.txtfileb.txtfilec.txt

    ```

    This is where we end this chapter and you have learned how to manage files and
    directories using simple commands using the command line interface on a Linux
    system. Most of these commands are generic to any flavor of a Linux operating
    system and not just Red Hat Enterprise Linux 7.


    # 6. Benefits of the Linux operating system


    In this chapter, we will look at the main benefits of Linux. Here not all are
    collected, but the main advantages of this operating system are.


    ### 1. Linux is faster

    Yes, it is. Linux kernel operating systems really benefit in terms of performance
    ahead of Windows. That is why the web server is most often equipped with this
    system.


    Of course, not every Distributor boasts performance. For example, the world-famous
    Ubuntu without settings will work much worse than the same Windows 7. But there
    are `Xubuntu` and `Lubuntu`, which will never let you down.


    ### 2. Linux is better customizable.

    Windows, as such, does not give a special leeway to take at least pre-installed
    tools to change the appearance. They can do little to help. But Linux!


    I use the environment – am an active Linux user, programmer and founder of theHacker
    website. Today I would like to tell you why it is worth switching to a Linux-based
    operating system.


    ### 3. Most distributions are free.

    Something I thought... But this, in fact, is a decisive factor for organizations.
    Almost all distributions are distributed free of charge even for commercial use.
    You do not need to activate, you should just download and install.


    ### 4. Linux is open source.

    Since Linux itself is free, it has many tools built on the principle of open source.
    Not only do you have to pay for the program, but you can also make changes to
    them. This explains the transparency of the installed programs – in the official
    repositories malicious software will not work.


    ### 5. Linux is safer

    Linux has its roots in prehistoric UNIX systems — and since then many of the principles
    have remained the same. Since all the code is low-level, it does not depend on
    any additional libraries, it will be difficult to hack the device. And the number
    of Linux users is too low for hackers to pay attention as a platform for attack.


    ### 6. No need to pull hundreds of accounts

    If Microsoft Windows requires the user to bind to multiple accounts, then there
    is no such thing in Linux. First, the account itself is optional – the number
    of its applications is negligible. Well, even if it is needed, almost all the
    services that are somehow related to Linux are tied to Ubuntu One – a single account.


    ### 7. Choose to your taste!

    Are you a designer? Writer? Painter? Translator? Then, for sure, a distribution
    kit is ready for you, which contains all the programs ready for work!


    If you had to download everything on Windows, then many Linux distributions are
    based on Linux that is already customized for specific needs. For example, Ubuntu
    Studio is suitable for a small (or large) studio, TuxTrans for the translator,
    Fedora Design Suite for the artist, KXStudio for the musician.


    ### 8. Stability

    If Windows requires a lot of updates, and your computer’s memory is filled every
    six months, this will not happen in Linux. There is no registry in the usual sense
    of the word, and all installed packages and programs are easily controlled. So
    farewell, frequent reinstallation!


    ### 9. Linux weighs little

