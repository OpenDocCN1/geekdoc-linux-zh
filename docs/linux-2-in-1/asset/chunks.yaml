  trans: "\n\n还有许多其他概念构成了面向对象编程。事实上，有四个核心思想驱动着它：抽象、封装、继承和多态。\n\n### 抽象\n抽象的理念是，程序员应该尽可能远离编程中的琐碎任务，而且想法不应该需要大量的样板代码。相反，编程应该是一系列思想的发生过程，程序员应该通过这些不同思想的综合来执行操作。因此，抽象的本质是，编程实际上不需要围绕代码本身，而是应该围绕代码的自然流以及代码在实现最终目标时的效率。\n\
    \n### 封装\n封装的理念是，一切都应该被整齐地封装在一起，并且程序应该是自给自足的。当需要时，事物应该能够组合以形成新的思想，而程序本身应该是这些形成的新思想的扩展。在此，面向对象编程还应该提供某种程度的扩展性——这意味着在面向对象编程过程中开发的概念，可以在单个程序规模或多个不同程序的规模上被重用。\n\
    \n### 继承\n继承的理念是，类应该能够以自然的家族树形式相互派生。考虑这种关系的一种好方法是生物树。生物树在宏观生物学层面根据共同特征被组织成不同的生物家族。随着这些细分并变得越来越具体，相同的共同特征会从父家族标记延续到子家族标记，但子级标记将具有更具体的特征。例如，鸟类和哺乳动物都有脊椎，因此被归类为脊动物门\
    \ `chordata`。然而，鸟类和哺乳动物之间也有许多差异，例如哺乳动物胎生，而鸟类产卵。这些具体规格在从父级 `chordata` 的子级标记中发挥作用。然而，某物可以进一步具体化并不意味着早期的规格会消失；给某物一个精确的规格并不会撤销更广泛的规格，将鸟类分类在\
    \ `chordata` 之外并不会夺走它的脊椎。它们只是超越更宽泛分类进入更精确分类的方法。\n\n例如，我们可以有一个名为 `wheeledTransport`\
    \ 的类，其中唯一的属性是 `numberOfWheels`。这是一个非常宽泛的分类；汽车、自行车和滑板都符合这一分类。因此，我们可以扩展该分类，以包含这三类对象的类定义，并对它们各自是什么进行进一步定义。然而，我们仍然可以访问父类属性\
    \ `numberOfWheels`，因为它将从父类 `wheeledTransport` 继承而来。\n\n### 多态\n多态是面向对象编程的最后一个主要定义。多态的理念是，某物可能有多个定义，并在使用时选择理想的定义。这现在听起来并不完全合理，但在面向对象编程中，你可以进行称为参数重载的操作，这是多态的一个极佳例子。参数重载是指两个不同的函数声明，它们都接收不同的参数，但具有相同的函数名。例如：\n\
    \n```\nbark() {\n  ...\n}\n\nbark(numberOfTimes) {\n  ...\n}\n```\n\n虽然这两个函数名都是\
    \ `bark`，但第二个接收参数 `numberOfTimes`，该参数随后可以在函数中使用。第一个不接受任何参数。稍后在代码中使用哪一个将取决于用户是否给函数调用提供了参数。我们稍后会讨论函数和方法，所以不用担心。\n\
    \n理解类和对象是不仅在 Linux 上、而且在通用范围内成为一名合格程序员的主要基石之一。这是现代编程使用的关键点之一，你需要对它有正确的理解才能完成任何其他工作。\n\
    \n## 数据集\n编程的另一个基础部分是理解数据集。数据集基本上如其名所示。在编程中，会有很多时候你需要将数据分组。一个直接的例子是某种运行记录，例如成绩。这种传统的做法可能类似于：\n\
    \n```\nstudent1Grade1 = 99\nstudent1Grade2 = 94\n\n1Grade3 = 92\nstudent2Grade1\
    \ = 81\nstudent2Grade2 = 90\nstudent2Grade3 = 89\nstudent3Grade1 = 91\nstudent3Grade2\
    \ = 93\n…\n```\n\n如你所见，这相当笨拙，而且跟踪所有信息将变得复杂。此外，正如我们稍后将讨论，当你需要给某物分配新值时，你经常会发现自己正在编写极其冗长的语句。\n\
    \n那么，如何处理这个问题呢？更好的方法是通过建立数据集来将数据连接起来。数据集有三种主要类型：数组、向量和字典。向量、列表和集合基本上是三个可以交换的术语，它们之间只有微小的差异；例如，`Python`\
    \ 在很大程度上放弃了数组，取而之的是列表，而列表在功能上类似于向量。\n\n数组具有固定的初始大小。这意味着在程序运行时，会为列表的每个成员分配内存。数组不需要立即填充，但空间会保持开放供数组中的每个元素填充；如果数组溢出，则被称为数组溢出，这在具体上是不被允许的，你会遇到编译错误（即你的程序由于此类问题而拒绝编译或运行）。\n\
    \n向量、列表和集合没有预设的大小。它们根据数据集的大小自动缩放。它们永远不会比需要的大，也不会比需要的小。这既可以是好事也可以是坏事。数组在内存利用上更有效，因为它们提前分配了所有数据；然而，如果你不在意这个问题——在现代硬件上这通常不需要担心——那么向量、列表和集合是访问数据内数据的更好的方式。\n\
    \n字典与向量、列表和集合非常相似，在于它们会自动缩放。然而，字典在数据片段之间建立了一种本质关系，将一个数据片段识别为 `key`（键），链接到另一个 `value`（值）。把它想象成本真实的字典；如果定义是值，那么你可以使用单词本身作为键来找到给定单词的值。这意味着你可以通过键搜索所需的特定值。这就是字典背后的核心思想。\n\
    \n## 算术和赋值操作\n\n### 控制流（条件语句）\n这是新程序员需要理解的最先且最重要的部分之一。事实是，如果没有一种确定如何做决策的方法，你编写许多程序将是毫无用处的。决策是几乎任何程序中最大的核心问题。即使对于一个原本直接的程序，能够测试基本条件——例如脚本是否能够连接到下载服务器——对于拥有一个运行良好且无\
    \ bug 的程序也是至关重要的。\n\n我们之前稍微讨论过编程中某些事物可以是真或假。这是这些信息开始变得重要的时刻。判断某事是真是假对程序的运行产生巨大影响。\n\
    \n"
- fmt: "\nBut what does true or false even mean in computing terms? Computers can’t\
    \ understand this simple relation. Computers don’t have logical and entropic brains\
    \ like we do. This means that they can’t understand in a logical sense whether\
    \ something is true or false. However, they also can. How is this?\n\nComputers\
    \ don’t view things in terms of abstract thought; rather, they view them as a\
    \ sequence of things which are on and then off, yes or no, `0` or `1`. It’s these\
    \ binary processes that allow a computer to render an understanding of logical\
    \ processes. These are represented in lower level engineering as things like `AND`,\
    \ `OR`, `XAND`, and `XOR` gates, but at this level, we just call these boolean\
    \ processes.\n\nBeing able to ascertain whether something is true or not and then\
    \ decide is essential to any good program. Computers have one very simple way\
    \ of doing this: conditional statements.\n\nConditional statements are essentially\
    \ comparisons of one value to another (or perhaps multiple) in order to determine\
    \ the veracity of a given statement.\n\nLet’s say that I was to say “7 is less\
    \ than 3”. Well, you would instantly object - no, it’s not! And you’d be right\
    \ to do so because I’d have sounded like an idiot. So where does one go from here?\
    \ What happens to let you say “no, that’s not right”?\n\nSubconsciously, when\
    \ I say something like that, you take the two numbers that I said - `7` and `3`\
    \ - and then you compare them to one another. You realize that `7` is bigger than\
    \ `3`, and you perhaps even visualize them on a subconscious sort of number line.\
    \ Without realizing it, you compare the two values in much the same way that a\
    \ computer would.\n\nHowever, the computer doesn’t have the intuitive knowledge\
    \ to compare these sorts of numbers. Intuition is something uniquely human, and\
    \ many people posit that intuition can’t be programmed because it takes a combination\
    \ of randomly generated thought alongside an extremely extensive knowledge of\
    \ past events. Because it lacks this sense of intuition, you need to tell it explicitly\
    \ what it needs to compare. It’ll then tell you whether the statement is true\
    \ or not.\n\nNo matter what you’re compared, whether it’s `3` to `7`, or one string\
    \ to another, you’re always doing so for a result: the computer telling you whether\
    \ the comparison is true or false. In this way, the comparison can stand as a\
    \ value on its own. This is one of the densest and most difficult concepts to\
    \ understand. Comparisons can hold value in and of themselves, because they can\
    \ be either true or false, with false being `0` and true being `1`.\n\nThis means\
    \ that the statement `3` is less than `7` is true. But this also means that the\
    \ evaluation of this statement as true can be considered a value itself - a value\
    \ of true in a true/false dichotomy. This also means that since boolean variables\
    \ can hold true or false information, they can also hold the truth or falsehood\
    \ of a comparison:\n\n```\nmyComparison = 3 < 7\n```\n\nThe above variable `myComparison`\
    \ would be equal to “true” or `1`, depending upon what language you’re using.\n\
    \nThe key point here, though, isn’t that this value can be stored - that’s only\
    \ a piece of information that will come in handy for you later. The key point\
    \ is that value of truth or falsehood may be assessed through (potentially a series\
    \ of) comparisons of values. Things can be assessed as true or false by comparing\
    \ two different things. Things can also be assessed as true or false by their\
    \ very nature - for instance, if you had a boolean variable called `isRunning`,\
    \ and you set it to `true` every time that you started the program, and set it\
    \ to `false` when you wanted to end, you could check to see if `isRunning` was\
    \ true by comparing the veracity of `isRunning` to the veracity of “truth”.\n\n\
    In other words, things can be true or false. You can use this important piece\
    \ of information in order to make program-wide decisions that will change the\
    \ course of the program. How you do this is the part that’s cool: if statements.\n\
    \n`if` statements are one of the important foundations of programming. It allows\
    \ you to evaluate something and then see whether the evaluation is true. If it’s\
    \ true, it lets you do something. If it’s not true, it skips the code within entirely.\
    \ This is something you’re going to see in both languages that we work within\
    \ this book, so it’s important to understand it.\n\nThe basic syntax for an `if`\
    \ statement is like so:\n\n```\nif (condition) {\n    code\n}\n```\n\nThis applies\
    \ across several languages. C, C++, Java, and PHP all immediately spring to mind.\
    \ You can build upon `if` statements by using what’s called an `else` statement.\
    \ This enforces an interesting duality where there are two different kinds of\
    \ conditionals. I like to call these passive and active conditionals.\n\nPassive\
    \ conditionals are conditions which harbor only on an `if` statement. All that\
    \ happens is the code within the `if` statement is evaluated. If it turns out\
    \ to be true, then the stuff within the `if` statement will be executed. If it\
    \ doesn’t turn out to be true, however, the stuff within the `if` statement will\
    \ be skipped over and it’s like the conditional didn’t even exist. There is no\
    \ force clause which makes certain that you’ll be obeying a certain paradigm.\
    \ It’s just simple on and off - if the condition doesn’t match, the entire statement\
    \ is ignored.\n\n`else` statements, however, give you active conditionals. Active\
    \ conditionals are conditions which do have a force clause. What happens is the\
    \ first `if` statement is evaluated. If it turns out to be true, then the `if`\
    \ statement will be executed. However, if it’s not true, then the `else` statement\
    \ will be executed - no matter what. There is no passivity here; if the `if` statement\
    \ doesn’t execute, the other branch of the conditional will be out.\n\n## Control\
    \ Flow (Loops)\n\nThe other major aspect of control flow occurs in loops. So what\
    \ are loops? Loops are basically a way of reiterating over a set of code a certain\
    \ number of times until a certain end is achieved. You never really think about\
    \ it, but you use loop logic all the time.\n\nConsider counting out loud from\
    \ one to ten. This may not seem like a loop to you at all; after all, you’re just\
    \ saying different numbers. But, you’re undergoing loop logic every time you count!\n\
    \nThink of it this way. If you count from one to ten out loud, then what you’re\
    \ doing is thinking of a number `n`, then you’re using your mouth to say number\
    \ `n`, then you’re increasing `n` by `1` in your head. This happens over and over\
    \ until you reach the number that you’re counting to.\n"
  raw: 'But what does true or false even mean in computing terms? Computers can’t
    understand this simple relation. Computers don’t have logical and entropic brains
    like we do. This means that they can’t understand in a logical sense whether something
    is true or false. However, they also can. How is this?


    Computers don’t view things in terms of abstract thought; rather, they view them
    as a sequence of things which are on and then off, yes or no, 0 or 1\. It’s these
    binary processes that allow a computer to render an understanding of logical processes.
    These are represented in lower level engineering as things like AND, OR, XAND,
    and XOR gates, but at this level, we just call these boolean processes.


    Being able to ascertain whether something is true or not and then decide is essential
    to any good program. Computers have one very simple way of doing this: conditional
    statements.


    Conditional statements are essentially comparisons of one value to another (or
    perhaps multiple) in order to determine the veracity of a given statement.


    Let’s say that I was to say “7 is less than 3”. Well, you would instantly object
    - no, it’s not! And you’d be right to do so because I’d have sounded like an idiot.
    So where does one go from here? What happens to let you say “no, that’s not right”?


    Subconsciously, when I say something like that, you take the two numbers that
    I said - 7 and 3 - and then you compare them to one another. You realize that
    7 is bigger than 3, and you perhaps even visualize them on a subconscious sort
    of number line. Without realizing it, you compare the two values in much the same
    way that a computer would.


    However, the computer doesn’t have the intuitive knowledge to compare these sorts
    of numbers. Intuition is something uniquely human, and many people posit that
    intuition can’t be programmed because it takes a combination of randomly generated
    thought alongside an extremely extensive knowledge of past events. Because it
    lacks this sense of intuition, you need to tell it explicitly what it needs to
    compare. It’ll then tell you whether the statement is true or not.


    No matter what you’re compared, whether it’s 3 to 7, or one string to another,
    you’re always doing so for a result: the computer telling you whether the comparison
    is true or false. In this way, the comparison can stand as a value on its own.
    This is one of the densest and most difficult concepts to understand. Comparisons
    can hold value in and of themselves, because they can be either true or false,
    with false being 0 and true being 1. 


    This means that the statement 3 is less than 7 is true. But this also means that
    the evaluation of this statement as true can be considered a value itself - a
    value of true in a true/false dichotomy. This also means that since boolean variables
    can hold true or false information, they can also hold the truth or falsehood
    of a comparison:


    myComparison = 3 < 7


    The above variable would be equal to “true” or 1, depending upon what language
    you’re using.


    The key point here, though, isn’t that this value can be stored - that’s only
    a piece of information that will come in handy for you later. The key point is
    that value of truth or falsehood may be assessed through (potentially a series
    of) comparisons of values. Things can be assessed as true or false by comparing
    two different things. Things can also be assessed as true or false by their very
    nature - for instance, if you had a boolean variable called isRunning, and you
    set it to true every time that you started the program, and set it to false when
    you wanted to end, you could check to see if isRunning was true by comparing the
    veracity of isRunning to the veracity of “truth”.


    In other words, things can be true or false. You can use this important piece
    of information in order to make program-wide decisions that will change the course
    of the program. How you do this is the part that’s cool: if statements.


    If statements are one of the important foundations of programming. It allows you
    to evaluate something and then see whether the evaluation is true. If it’s true,
    it lets you do something. If it’s not true, it skips the code within entirely.
    This is something you’re going to see in both languages that we work within this
    book, so it’s important to understand it.


    The basic syntax for an if statement is like so: 


    if (condition) {


    code


    }


    This applies across several languages. C, C++, Java, and PHP all immediately spring
    to mind. You can build upon if statements by using what’s called an else statement.
    This enforces an interesting duality where there are two different kinds of conditionals.
    I like to call these passive and active conditionals.


    Passive conditionals are conditions which harbor only on an if statement. All
    that happens is the code within the if statement is evaluated. If it turns out
    to be true, then the stuff within the if statement will be executed. If it doesn’t
    turn out to be true, however, the stuff within the if statement will be skipped
    over and it’s like the conditional didn’t even exist. There is no force clause
    which makes certain that you’ll be obeying a certain paradigm. It’s just simple
    on and off - if the condition doesn’t match, the entire statement is ignored.


    Else statements, however, give you active conditionals. Active conditionals are
    conditions which do have a force clause. What happens is the first if statement
    is evaluated. If it turns out to be true, then the if statement will be executed.
    However, if it’s not true, then the else statement will be executed - no matter
    what. There is no passivity here; if the if statement doesn’t execute, the other
    branch of the conditional will always be carried out. The chunk of code will not
    be skipped over as it would otherwise.


    This means that you basically have two different ways in which you can assess
    situational conditions: you can either give them a treatment wherein they may
    or may not be activated, or you can set up a situation in which some code will
    certainly be activated.


    There’s one more element of nuance to this whole equation, though. Let’s say,
    for example, that you wanted to add in a condition for more than one possible
    outcome. That’s to say that you wanted to check more than just one condition.
    What would you do in this situation? With things as they stand, you don’t really
    have any sort of options in this scenario. Thankfully, however, you aren’t restricted
    to having no options. There’s one more kind of conditional: the else if statement.
    This goes between your if and else statements. What happens is that the first
    if statement is evaluated; if it’s not true, the condition of the else if statement
    is evaluated; then, if that isn’t true, it finally proceeds to the else statement.
    You can stack as many else if statements as you’d like.


    ## Control Flow (Loops)


    The other major aspect of control flow occurs in loops. So what are loops? Loops
    are basically a way of reiterating over a set of code a certain number of times
    until a certain end is achieved. You never really think about it, but you use
    loop logic all the time.


    Consider counting out loud from one to ten. This may not seem like a loop to you
    at all; after all, you’re just saying different numbers. But, you’re undergoing
    loop logic every time you count!


    Think of it this way. If you count from one to ten out loud, then what you’re
    doing is thinking of a number n, then you’re using your mouth to say number n,
    then you’re increasing n by 1 in your head. This happens over and over until you
    reach the number that you’re counting to.'
