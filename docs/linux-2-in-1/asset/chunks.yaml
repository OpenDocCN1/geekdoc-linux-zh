    你知道吗？由于 Android 在手机、平板电脑和其他移动设备上的主导地位，Linux 已经成为所有通用系统中安装量最大的系统之一。


    尽管它不是桌面式电脑的首选系统，但 Linux 仍然是自由开源协作项目的典范。由于它运行在嵌入式系统上，因此在电视、设施自动化控制、视频游戏机、网络路由器、智能手表以及前提到的移动设备上非常有用。


    Linux 简单的设计使其深受程序员的青睐。虽然其他人喜欢一点复杂性，但有些程序员更倾向于直观的概念。在它的原始本质上，它是大型机、超级计算机和许多服务器上的领先操作系统（OS）。


    作为一名 Linux 初学者，请从学习基础知识开始。Linux 的核心要素有哪些？


    # Linux 历史


    1991 年，Linux 正式发布。最初，它的开发重点是为不同的 Intel x86 架构个人电脑提供一个免费操作系统。它的创始人林纳斯·托瓦尔斯（Linus
    Torvalds）宣布，该操作系统的创建部分是因为当时缺乏可用的微服务器内核。


    作为一个开源协作项目，它的源代码可以免费使用。根据各自许可的条款，它也可以为了商业和非商业分发进行修改。


    由于它符合 `POSIX`（或可移植操作系统接口），Linux 是一个可靠的操作系统。它已经并并通过了 `API`（或应用程序编程接口）、标准实用程序接口和命令行
    shell 的评估。


    # Linux 组件


    Linux 无缝运行归功于它的核心组件。共有七个。


    ## 七个核心组件：


    ### 应用可用性 (Applications availability)

    Linux 提供了数千个应用程序，且这些应用程序可以立即安装。它就像 Windows Store 和 App Store 一样，让你搜索偏的应用程序。搜索完成后，你可以从一个中心位置安装该应用。


    ### 守护进程 (Daemons)

    守护进程是作为后台服务的 Linux 组件。后台服务的示例包括声音、打印和调度。它们在桌面登录后或在启动期间启动。


    ### 桌面环境 (Desktop environments)

    桌面环境指的是与用户交互的组件。示例有 `GNOME`、`Unity` 和 `Cinnamon Enlightenment`。每一个环境都带有配置工具、文件管理器、计算器、网络浏览器和其他内置功能。


    ### 图形服务器 (Graphical server)

    图形服务器是 Linux 的一个子系统。它的主要职责是在你的屏幕上显示图形。你也可以将其称为“X”或“X server”。


    ### 引导加载器 (The boot loader)

    Linux 对你计算机启动过程的管理由引导加载器处理。通常，它以启动屏的形式存在。一旦启动屏弹出，它将缓慢进入启动过程。


    ### 内核 (The kernel)

    Linux 的核心被称为 `kernel`。它负责内存、外围设备和 CPU 的管理。


    ### Shell (The shell)

    Shell 是 Linux 的命令行。它允许通过在文本界面中输入命令进行控制。


    # 合并 (Concatenate): 一个常用的 Linux 特性


    Linux 操作系统运行流畅的原因之一是简单的功能。这些功能可以同时处理多个任务。其中一个功能就是合并或 `cat`。


    ## 合并功能：


    *   `/etc/pass` – 用于显示文件内容


    示例：


    ```

    # cat /etc/password

    root:x:0:2:root:/root:/bin

    bin:x:1:1:bin:/root:/bin:/sbin/nologin

    nard:x:300:400::/home/nard:/bin/bash

    ```


    *   `test test1` – 用于查看多个文件的内容


    示例：


    ```

    # cat first test second test

    Hello everybody

    Hi world!

    ```


    *   `-n` 选项 – 用于显示文件内容；使用行号


    示例：


    ```

    # cat -n song titles.txt

    1  Pop

    2  Snow in Summer

    3  Your Black Heart

    4  And I Know It Is A Home

    5  And These Places Could

    6  Be Much Bigger

    7  Brighter Than Tomorrow

    8  And Please If You Really Really Try

    9  You Will Find There Is No Need

    10 To Cry During This Moment

    11 In This Place You Will Feel

    12 There Is No Hurt Or Sorrow

    ```


    *   `-e` 选项 – 用于将多行显示在单行


    示例：


    ```

    # cat -e test

    Hi there everybody, how do you do?$

    Hey, am alright.$

    How was your training and where was it?$

    $Let us do maybe practice some more in Linux.

    ```


    结果：

    Hi there everybody, how do you do?

    Hey, am alright. How was your training and where was it? Let us do maybe practice
    some more in Linux.


    *   `-T` – 用于显示何时应该使用“tab”以及何时开始新行；“^|” 是使用“tab”的指示


    示例：


    ```

    # cat -T test

    Hi there ^Ieverybody, how do you do?

    Hey, ^Iam alright.

    ^I^IHow was your training ^Iand where was it?

    Let us do ^Imaybe practice some more in Linux.

    ```


    结果：

    Hi there

    everybody, how do you do?

    Hey,

    am alright.

    How was your training           and where was it?

    Let us do

    maybe practice some more in Linux.


    *   `test` – 用于在单一结构中显示多个文件的内容


    示例：


    ```

    # cat first test; cat second test; cat third test

    This is first test file

    This is second test file.

    This is third file.

    ```


    # 十个基础命令


    在此之前，Linux 古老的结构以及它的命令行是一个令人望而却步的因素。虽然其他人喜欢一点复杂性，但有些程序员更倾向于直观的概念。在它的原始本质上，它是大型机、超级计算机和许多服务器上的领先操作系统（OS）。


