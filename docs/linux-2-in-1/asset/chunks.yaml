    ### less


    Once again, to read the contents of a file, another command you can use is `less`
    command. With this command as in the `more` command we display output with long
    files to easy to read. Using the up and down arrow keys to scroll through the
    pages. With space key, goes to next page, with `b` key goes to the previous page.
    To exit `q` key is used as same we mentioned before.


    ### head-tail


    While viewing the file contents to see the first ten rows `head`, to view the
