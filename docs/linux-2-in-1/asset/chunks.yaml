  trans: "\n\n# 方法\n\n方法（Methods）允许你在编程中添加一个层级，称为模块化（modularity）。我们将在接下来的章节中以更深入的方式讨论这一概念，但模块化本质上是指事物能够被反复拆解和重复利用的能力。方法允许你为程序添加一层模块化，因为它们让你能够反复重用某段代码。它们还允许你解耦代码的不同部分，使代码更具可读性和易于管理。\n\
    \n模块化编程的另一个优点是，它允许你更改代码的一个部分，并让更改处处生效，而无需你去检查和重构在大型程序中可能多达数百行的代码。这是一个巨大的区别，并将会在未来为你节省大量的痛苦、挫败感以及调试上花费的时间。\n\
    \n那么，方法到底是什么呢？嗯，为了更好地理解它们，可能在几分钟内使用它们的另一个名称：函数（functions）。（函数和方法在功能上是相同的东西；方法通常是更现代语言中使用的名称，而在\
    \ `C` 和 `C++` 等语言中通常倾向于使用函数——除了名称外，它们是完全相同的东西）\n\n这是我们到目前为止第二次引用高中数学课，它与上一次同样相关。还记得你在高中代数课上吗，你会有一个像\
    \ `f(x) = 3x + 4` 的函数，并代入给定的 `x` 值？例如，如果 `f(x)` 是 `f(3)`，那么你就会把三代入方程？\n\n从抽象且非常基础的角度来看，这种方式与编程中函数的工作方式极其相似。在函数\
    \ `f(x)` 中，`x` 被称为参数（argument）。你向函数输入某些东西。函数本身只是整个语句的名称——术语 `3x + 4` 可以被称为函数的动作（action）。该动作对函数的参数执行操作。结果就是函数返回的内容。上述的\
    \ `f(3) = 3(3) + 4` 的最终值将是 `13`。因此，在所有操作完成且动作执行后，返回的结果就是函数的返回值。由于 `f(x) = 3x +\
    \ 4`，参数为 `3` 的 `f(x)` 的返回值就是 `f(3) = 13`。\n\n在编程中，这会有一点点变化。例如，函数可以完全接受任何参数。这在数学上也是成立的，函数\
    \ `f(x)` 可以仅仅是 `14 + 4`。`x` 的所有值都将 `14 + 4`。如果函数没有参数，那么无论你定义什么动作，都会以相同的方式发生。如果你需要在不同时间运行同一段代码，这样做会更好，如下所示：\n\
    \n```javascript\nfunction bark() {\n    print \"bark!\"\n}\n\nbark();\n```\n\n\
    每当调用函数 `bark` 时，它都会打印出 `bark`。为什么这样做很有用呢？想象有一段代码，你必须多次打印 `bark`——这很困难，但这是一本教程书，所以试试吧，有些书确实有更奇怪的例子。如果你决定想让它说“barkbark!”而不是“bark!”，你只需要更改函数中的那行代码，而不需要去程序中每一处写着“print\
    \ ‘bark!’”的行并进行修改。\n\n方法的设计意图相对简单，且理解起来也并不困难。以下是方法的伪代码：\n\n```text\nmethod(arguments)\
    \ {\n    // actions\n    return value;\n}\n```\n\n# 文件输入与输出\n\n这是在我们进入对象对象编程（object-oriented\
    \ programming）这一大体概念之前需要讨论的最后一个主题。文件输入和输出是编程中不可或缺的一部分，在你编程生涯的某个阶段几乎会被要求。它并不困难，大多数文件输入输出操作将遵循类似的逻辑线条。\n\
    \n首先，你打开文件。打开文件意味着如果你是在写入则创建它，如果你是在追加或读取则打开它。在后一种情况下，你通常需要设置某种异常（exception）来捕获文件不存在的情况。否则，你的程序将会崩溃。\n\
    \n然后，你修改文件。读取和写入文件是自言自足的。你要么读取数据、写入文件，或者两者兼有。你还可以向文件追加内容。这就是你前往文件末尾并在其添加数据的地方。\n\
    \n之后，你关闭文件。关闭文件是关闭程序与文件之间的流（stream）。这确保了不会发生损坏或数据泄漏。如果你不使用资源，保持其开启是没有意义的。\n\n\
    这些都是通过方法完成的简单操作，相对于你将使用的特定编程语言。我们将在特定编程语言的章节中详细介绍它们。\n\n# 面向对象编程\n\n面向对象编程并不是非常困难的概念。然而，它是一个重要的概念，标志着你作为程序员能力上的一个重要里程碑，因为你从编写没有细微差别的简单程序，转变为编写更解耦、可以扩展到更大规模的程序。\n\
    \n面向对象编程有几个方面。第一个是**模块化**（modularity）。模块化的理念是，事物能够在不同的上下文中被反复重用，你应该能够在不破坏整个系统的情况下拆分并替换部分。\n\
    \n还有**抽象**（abstraction）。抽象是一种解耦的想法；它通过让程序员避免沉重工作并使用简单的术语来代语言内部的内容，来减轻其负担。这种理念执行后将产生非常易于阅读且易于处理的代码。抽象还指的是，它让程序员免于直接处理内存等低级操作。\n\
    \n然后，是**多态性**（polymorphism）。多态性的理念是用不同的类型执行抽象操作。\n\n除了多态性，还有**继承**（inheritance）。继承的理念是事物应该能够基于另一个单元的特性来构建自身。\n\
    \n最后，是**封装**（encapsulation）。封装的理念是事物应该整齐地聚集在一起。\n\n## 那么对象到底是什么？而且，什么是类？\n\n类简单是将不同的值和函数分组在一个标题下的方法。这允许你创建该类的的新实例，每个实例都有其独特的类变量和函数。然而，它们共享核心函数和变量。例如，如果我创建一个名为\
    \ `dog` 的类，我可以创建名为 `corgi`、`yorkie` 等 `dog` 的实例。但如果 `dog` 定义了一个名为 `bark` 的函数，所有的\
    \ `dog` 实例都会使用同一个 `bark` 函数。如果 `dog` 类将 `numberOfLegs` 定义为 `4`，那么所有狗的 `numberOfLegs`\
    \ 值都为 `4`。\n\n当人们说对象时，他们指的是类的实例。例如，所有 `dog` 的实例——`corgi`、`yorkie` 等——都是对象。\n\n\
    面向对象编程广义上是指经常使用对象的语言。在我们本书研究的编程语言中，Java 是唯一主要的面向对象的语言；然而，面向对象编程如此流行，这种方法已经潜移默化地渗透到了其他编程形式中。因此，了解核心术语和实践是非常重要的。\n\
    \n"
