    \ `C` code could be compiled. However, this worked reflexively in giving `C` code\
    \ a stable and extremely popular example of how well it could work. This meant\
    \ that the popularity of each fed off the other as `C` rapidly gained steam.\n\
    \nWhat would result is one of the most influential programming languages ever,\
    \ `C`. The bulk of Unix programs would be written in `C`, much of early `C` support\
    \ would rest in Unix, and when Unix-like operating systems started to be developed,\
    \ they would normally follow Unix’s lead and be developed in `C` or a combination\
    \ of `C` and `C++`.\n\n`C` would end up inspiring a whole host of different languages,\
    \ like `C++`. However, it’s not just `C++`; many languages that you hear about\
    \ rather often as a novice programmer owe a large part of their legacy to `C`.\
    \ `Java`, `Perl`, `PHP`, `Python`, `C#`, `JavaScript`, `Objective-C`, `Go`, and\
    \ `Rust` are just some of the many languages which are derived largely from `C`\
    \ and `C` standard procedures.\n\nNow, note that every programming language seeks\
    \ to solve a lot of the same problems, and they’re generally based on algorithmic\
    \ or mathematical assertion of a given problem - in the end, with the key focus\
    \ on solving problems posed to computer programmers - and so in a lot of ways,\
    \ they’re relatively similar. But `C` style languages share many similarities,\
    \ such as in their type systems (which we’ll get to momentarily) or their syntax\
    \ in general.\n\nThis chapter, in covering programming concepts, covers concepts\
    \ which are central to `C` style programming languages, but which also apply to\
    \ many other kinds of languages - though they may just appear in different ways.\n\
    \n## Variables and Values\n\nThis is the first real programming concept that we’re\
    \ going to tackle in this chapter, and it’s one of the most important. The entire\
    \ purpose of a computer is, well, to compute. Computers are designed to manipulate\
    \ values; this is their primary purpose, in fact! It makes sense, then, that one\
    \ of the main functions of programming is to maintain, recall, and manipulate\
    \ different values.\n\nSo what exactly is a value? We’ve talked before about how\
    \ computers read things as `1s` and `0s`. In the end, this isn’t entirely true,\
    \ but it also is. Everything that happens on a computer is either a one-and-done\
    \ calculation, or it’s stored somewhere; it may be stored temporarily in the fast-access\
    \ memory known as `RAM`, or it may be stored more long-term as solid data on the\
    \ hard-drive. In either case, the point is that computers are based around storing\
    \ and changing data, known as values.\n\nValues can be much of anything, in terms\
    \ of programming. Values can be, for example, anything from whole numbers to decimal\
    \ numbers to long strings of characters to single characters even to true or false\
    \ qualities.\n\nOf course, sometimes you’re going to need to keep track of a certain\
    \ value. This is where variables come in handy. Variables offer a way to give\
    \ a name and a consistent means of reference to a given value in the computer’s\
    \ active memory.\n\nHowever, there’s still a bit more to it than just this. For\
    \ example, when you’re working with different values, the computer is ultimately\
    \ just reading them as vast simplifications of what they appear to you as the\
    \ programmer. The computer, thus, needs a way to delineate between all these different\
    \ forms, because the binary representation of one thing isn’t the binary representation\
    \ of another, even though they may appear to have the same value.\n\nOne example\
    \ of this is comparing strings in a language such as `Java`. If you compare strings\
    \ directly, you’re going to be getting incorrect data because strings are actually\
    \ arrays of ASCII values which they, themselves, hold a binary value. If you compare\
    \ one value directly against another, then you’re going to run into a mathematical\
    \ comparison rather than a string literal comparison where the ASCII values are\
    \ compared against one another. However, if you were to compare the string objects\
    \ directly using an object comparison method, as opposed to a mathematical value\
    \ comparison, then you could feasibly find that the two strings are much the same.\n\
    \nThese different kinds of values are then known as types. There are an innumerable\
    \ amount of types, and different types exist in every programming language. However,\
    \ most `C`-style languages have a few basic “guidelines” for the types which are\
    \ supported by them.\n\nFirst, you have primitive types, which are types that\
    \ are natively supported and aren’t objects defined by APIs or other foundational\
    \ software for a given language. These are things such as `ints` (integers), `floats`\
    \ (floating point numbers), `chars` (single characters), and sometimes `booleans`\
    \ (true or false values).\n\nThen, you have object types, which as I said earlier,\
    \ we’ll talk about more in-depth in a bit. Object types are constructed formations\
    \ of data which serve as a collection of different traits represented by primitive\
    \ data types. An incredibly popular and often represented object type is the `string`,\
    \ which is a sequence of ASCII characters.\n\nSome languages require you to explicitly\
    \ say what sort of value a given variable will hold. These are called explicitly\
    \ typed languages. Others, though, don’t require you to make this distinction,\
    \ they just let you declare variables. These are called implicitly typed languages.\n\
    \nThere is no clear preference between one or another, it really depends on what\
    \ you’re trying to achieve and how complex of a data structure you’re working\
    \ with. However, in the end, both achieve the same thing: a system of establishing\
    \ names for given values to which everything else may correspond.\n\n## Objects\
    \ and Classes\n\nThis is perhaps one of the most daunting topics in the book,\
    \ but it goes together with the topic of values and variables, so we should likely\
    \ get it out of the way now. We’ve talked about how object-oriented programming\
    \ completely shifted the paradigm in terms of programming, but we haven’t talked\
    \ about why, nor what an object is.\n\nFirstly, think of a car. A car has many\
    \ different attributes which may make it up. Every car has a make and model; it\
    \ has a certain number of doors; it has an engine of a certain size; it may have\
    \ a convertible top and it may not; so on and so forth. These are all variables\
    \ which may shift up any given definition of a car.\n\nIn programming most of\
    \ the time, though, you are forced to only work with one given variable at a time.\
    \ That is unless you set up a proper paradigm for working with more than one.\
    \ Establishing a `class` allows you a way to group a bunch of different variables\
    \ together.\n\nThat is, instead of making a bunch of different unique variables\
    \ to refer to traits, you can just dump all the variables together. This means\
    \ that you can apply all the same variables to different vehicles. Take this pseudocode\
    \ for example. The traditional way to set up important information regarding a\
    \ car would be like so:\n\n```\ncar1make = “Ford”\ncar1model = “Taurus”\ncar1color\
    \ = “gold”\ncar1doors = 4\ncar1year = 1998\n\ncar2make = “Pontiac”\ncar2model\
    \ = “Grand Am”\ncar2color = “silver”\ncar2doors = 4\ncar2year = 2004\n```\n\n\
    As you can see, this is very unwieldy. Additionally, you may have a hard time\
    \ keeping up with all the different cars. Fortunately, there’s a much better way\
    \ to handle this: establish a `class` of common traits that you can then use in\
    \ order to normalize the establishment of cars:\n\n```\nclass car {\n  make\n\
    \  model\n  color\n  doors\n  year\n}\n```\n\nThen from here, you can create objects.\
    \ Objects are just instances of a given `class`.\n\n```\ncar one = new car(“Ford”,’Taurus”,\
    \ “gold”, 4, 1998)\ncar two = new car(“Pontiac”, “Grand Am”, “silver”, 4, 2004)\n\
    ```\n\nThen, you have all the cars’ reference qualities stacked on top of one\
    \ another, available for instant recall:\n\n```\nprint one.make\n```\n\nThis would\
    \ access the object `one` of the class `car` and then print out the attribute\
    \ `make`, meaning it would print out “Ford” to the console.\n"
  raw: 'This meant, firstly, that Unix could now be used on any computer for which
    C code could be compiled. However, this worked reflexively in giving C code a
    stable and extremely popular example of how well it could work. This meant that
    the popularity of each fed off the other as C rapidly gained steam.


    What would result is one of the most influential programming languages ever, C.
    The bulk of Unix programs would be written in C, much of early C support would
    rest in Unix, and when Unix-like operating systems started to be developed, they
    would normally follow Unix’s lead and be developed in C or a combination of C
    and C++.


    C would end up inspiring a whole host of different languages, like the C++. However,
    it’s not just C++; many languages that you hear about rather often as a novice
    programmer owe a large part of their legacy to C. Java, Perl, PHP, Python, C#,
    JavaScript, Objective-C, Go, and Rust are just some of the many languages which
    are derived largely from C and C standard procedures.


    Now, note that every programming language seeks to solve a lot of the same problems,
    and they’re generally based on algorithmic or mathematical assertion of a given
    problem - in the end, with the key focus on solving problems posed to computer
    programmers - and so in a lot of ways, they’re relatively similar. But C style
    languages share many similarities, such as in their type systems (which we’ll
    get to momentarily) or their syntax in general.


    This chapter, in covering programming concepts, covers concepts which are central
    to C style programming languages, but which also apply to many other kinds of
    languages - though they may just appear in different ways.


    Variables and Values


    This is the first real programming concept that we’re going to tackle in this
    chapter, and it’s one of the most important. The entire purpose of a computer
    is, well, to compute. Computers are designed to manipulate values; this is their
    primary purpose, in fact! It makes sense, then, that one of the main functions
    of programming is to maintain, recall, and manipulate different values.


    So what exactly is a value? We’ve talked before about how computers read things
    as 1s and 0s. In the end, this isn’t entirely true, but it also is. Everything
    that happens on a computer is either a one-and-done calculation, or it’s stored
    somewhere; it may be stored temporarily in the fast-access memory known as RAM,
    or it may be stored more long-term as solid data on the hard-drive. In either
    case, the point is that computers are based around storing and changing data,
    known as values.


    Values can be much of anything, in terms of programming. Values can be, for example,
    anything from whole numbers to decimal numbers to long strings of characters to
    single characters even to true or false qualities.


    Of course, sometimes you’re going to need to keep track of a certain value. This
    is where variables come in handy. Variables offer a way to give a name and a consistent
    means of reference to a given value in the computer’s active memory. 


    However, there’s still a bit more to it than just this. For example, when you’re
    working with different values, the computer is ultimately just reading them as
    vast simplifications of what they appear to you as the programmer. The computer,
    thus, needs a way to delineate between all these different forms, because the
    binary representation of one thing isn’t the binary representation of another,
    even though they may appear to have the same value. 


    One example of this is comparing strings in a language such as Java. If you compare
    strings directly, you’re going to be getting incorrect data because strings are
    actually arrays of ASCII values which they, themselves, hold a binary value. If
    you compare one value directly against another, then you’re going to run into
    a mathematical comparison rather than a string literal comparison where the ASCII
    values are compared against one another. However, if you were to compare the string
    objects directly using an object comparison method, as opposed to a mathematical
    value comparison, then you could feasibly find that the two strings are much the
    same.


    These different kinds of values are then known as types. There are an innumerable
    amount of types, and different types exist in every programming language. However,
    most C-style languages have a few basic “guidelines” for the types which are supported
    by them.


    First, you have primitive types, which are types that are natively supported and
    aren’t objects defined by APIs or other foundational software for a given language.
    These are things such as ints (integers), floats (floating point numbers), chars
    (single characters), and sometimes booleans (true or false values).


    Then, you have object types, which as I said earlier, we’ll talk about more in-depth
    in a bit. Object types are constructed formations of data which serve as a collection
    of different traits represented by primitive data types. An incredibly popular
    and often represented object type is the string, which is a sequence of ASCII
    characters.


    Some languages require you to explicitly say what sort of value a given variable
    will hold. These are called explicitly typed languages. Others, though, don’t
    require you to make this distinction, they just let you declare variables. These
    are called implicitly typed languages.


    There is no clear preference between one or another, it really depends on what
    you’re trying to achieve and how complex of a data structure you’re working with.
    However, in the end, both achieve the same thing: a system of establishing names
    for given values to which everything else may correspond.


    ## Objects and Classes


    This is perhaps one of the most daunting topics in the book, but it goes together
    with the topic of values and variables, so we should likely get it out of the
    way now. We’ve talked about how object-oriented programming completely shifted
    the paradigm in terms of programming, but we haven’t talked about why, nor what
    an object is. 


    Firstly, think of a car. A car has many different attributes which may make it
    up. Every car has a make and model; it has a certain number of doors; it has an
    engine of a certain size; it may have a convertible top and it may not; so on
    and so forth. These are all variables which may shift up any given definition
    of a car.


    In programming most of the time, though, you are forced to only work with one
    given variable at a time. That is unless you set up a proper paradigm for working
    with more than one. Establishing a class allows you a way to group a bunch of
    different variables together. 


    That is, instead of making a bunch of different unique variables to refer to traits,
    you can just dump all the variables together. This means that you can apply all
    the same variables to different vehicles. Take this pseudocode for example. The
    traditional way to set up important information regarding a car would be like
    so:


    car1make = “Ford”


    car1model = “Taurus”


    car1color = “gold”


    car1doors = 4


    car1year = 1998


    car2make = “Pontiac”


    car2model = “Grand Am”


    car2color = “silver”


    car2doors = 4


    car2year = 2004


    As you can see, this is very unwieldy. Additionally, you may have a hard time
    keeping up with all the different cars. Fortunately, there’s a much better way
    to handle this: establish a class of common traits that you can then use in order
    to normalize the establishment of cars:


    class car {


    make


    model


    color


    doors


    year


    }


    Then from here, you can create objects. Objects are just instances of a given
    class. 


    car one = new car(“Ford”,’Taurus”, “gold”, 4, 1998)


    car two = new car(“Pontiac”, “Grand Am”, “silver”, 4, 2004)


    Then, you have all the cars’ reference qualities stacked on top of one another,
    available for instant recall:


    print one.make


    This would access the object one of the class car and then print out the attribute
    make, meaning it would print out “Ford” to the console.'
