    ```


    所有全局变量中最重要的是 `$PATH` 变量。`$PATH` 变量包含了你可以从任何目录使用的所有程序的目录/位置。`$PATH` 就像 WINDOWS
    操作系统中的环境变量。两者都持有指向程序的目录路径。让我们打印 `$PATH` 变量。我们的输出可能有所不同，所以如果你看到不同的内容请不要担心：


