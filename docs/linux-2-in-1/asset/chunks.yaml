    然而，它们大多数都是基于 Debian、OpenSuse、Ubuntu、Arch Linux、Gentoo 或 Red Hat。


    # 第 2 章 什么是 Ubuntu？


    Ubuntu 操作系统诞生于 2004 年。


    Ubuntu 项目由马克·舒特沃斯（Marc Shuttleworth）创立，他是一位非洲百万富翁，并通过他的 Canonical 公司担任主要赞助商。


    在祖鲁语中，Ubuntu 的意思是“对他人的仁爱”。


    该项目的重点是开发一个全球范围内尽可能的人都能使用的操作系统。


    项目特别关注直观的易用性和通用无障碍的工具。


    Ubuntu 是一项免费提供的开源软件。


    自第一个版本发布以来，其认可度和流行程度一直在稳步提升。


    Ubuntu 基于 Debian。这意味着 Debian 创建的软件包管理系统和软件选择被 Ubuntu 所采纳。


    然而，随着时间的推移，这两个发行版逐渐分道扬扬。


    例如，Ubuntu 经常被指责过于商业化，而 Debian 则继续遵循开源哲学，拒绝了 Ubuntu 引入的一些创新。


    Ubuntu 每年的 4 月和 10 月发布一个新版本，每个版本获得为期九个月的支持。


    它以发布年份和月份命名。


    Ubuntu 18.10 是于 2018 年（18）的 10 月（10）发布的。


    支持意味着 Ubuntu 操作系统将以安全更新和错误修复的形式接收更新。


    然而，每隔两年（偶数年！）会发布一个特殊版本，该版本将获得 Ubuntu 为期 5 年的支持。


    这被称为 LTS 版本。


    LTS 代表“长期支持”（Long-Term-Support）。


    当前版本是 Ubuntu 18.04。


    该版本的支持将在 5 年后的 2023 年 4 月结束。


    下一个 LTS 版本 Ubuntu 20.04 将于 2020 年 4 月发布。


    该版本的支持将在 5 年后的 2025 年 4 月结束。


    所有其他版本的支持时长均为 9 个月。


    ![support english](img/image00270.gif)


    短期支持系统的优势在于，它们包含的软件通常比上一个常规 LTS 版本的更更新。


    LTS 版本本质上在五年内保持不变。


    更新仅包含错误修复和安全补丁。


    从长远来看，这对于某些用户可能太保守了。


    然而，软件越旧，经过的测试就越多，因此越稳定。


    较新版本的应用程序（如在短期支持版本中的程序）可能更不稳定，因为它们的测试周期较短。


    在这份快速指南中，我将介绍 Ubuntu 18.04 LTS。


    其中很大大部分内容也适用于 Ubuntu 18.10 和 Ubuntu 19.04。


    对于初学者，建议先尝试 LTS 版本。


    如果 LTS 版本不能完美支持你的硬件，那么使用短期版本是有意义的。


    除了代表发布日期的官方名称外，Ubuntu 版本还有一个额外的幻想名称。


    例如 18.04 是 Bionic Beaver（仿生二齿海狸），18.10 是 Cosmic Cuttlefish（宇宙乌贼鱼）。


    # 第 3 章 Linux 安装过程


    在本节中，我们将重点介绍安装和配置 Debian 的过程，向你展示过程中的每一个步骤。


    ## 安装类型


    Debian 提供了多种进行正确设置的方法。这包括图形界面安装和文本界面安装；我们将使用前者。对于安装媒体，Debian 开发者提供了三种变体：


    * 用于 32 位和 64 位的 CD 或 DVD

    * 用于 32 位和 64 位的网络镜像（所谓的 `Netinst-ISO`）

    * 用于 32 位或 64 位的微型 CD


    我们还提供了测试媒体。这些包括用于 32 位和 64 位的实时运行镜像（live images），允许你在将 Debian 安装到计算机之前先尝试它。在编写本文期间，版本
    9.5 是 Debian 的当前稳定发布版。这里描述的设置基于此发布版本和 `amd64` 架构。


    从 `www.debian.org/distrib` 下载网络镜像后，系统不需要再引用额外的静态镜像。相反，它依赖于网络连接来检索要安装的软件包，并保持操作系统处于最新状态。


    整个过程将花费大约一小时，并允许你根据特定需求选择精简的软件。你不需要的软件包将不会出现在你的系统中。你可以在需要时随时添加它们。


    我们安装的目标系统是一个基于 XFCE 的单用户桌面系统，带有网络浏览器和音乐播放器。对于网络浏览器，我们使用 `Mozilla Firefox`，对于音乐播放器，我们使用
    `VLC`。这两个程序都是 Linux 发行版的永久组件。我们用于演示的环境是一个基于 `VirtualBox` 的虚拟机，拥有 4 GB 内存和 15 GB
    磁盘空间。


    ## 逐步安装 Linux


    ### 启动菜单


    为了开始安装 Debian，首先从你下载的 ISO 镜像启动计算机（在我们例中是 `VirtualBox` 镜像）。如果你也使用虚拟机，请查看虚拟机供应商网站获取如何启用
    ISO 镜像的帮助。接下来等待启动菜单出现在屏幕上。下图显示了提供的不同选项。使用光标键导航启动菜单，按回车键选择项目。


    不同的选项有：


    * `Graphical install`:使用图形化安装程序开始安装过程

    * `Install`:使用文本界面安装程序开始安装过程

    * `Advanced options`:选择更多选项，如 `Expert mode`（专家模式）、`Automated install`（自动安装）或 `Rescue
    mode`（救援模式）（更多细节见下图）

    * `Help`:获取更多帮助

    * `Install with speech synthesis`:带有语音支持启动安装过程


    从主启动菜单中选择 `Graphical install` 并按回车键继续。


    ### 语言选择


    接下来，选择你希望在整个安装过程中使用的语言。对话框和消息将进行相应的翻译。此选择不会不可更改地决定你的 Linux 系统将使用的语言；你以后一直可以选择不同的语言。


    下图显示了对话框。英语已预选，因此你只需点击对话框右下角的 `Continue`（继续）按钮即可。


    ### 位置选择


    第三，根据你的位置进行选择（见下图）。根据你之前设置的语言，列出的是主要使用所选语言的国家。这也会影响区域设置，例如你计算机所在的时区。为了进行不同的设置，请从列表末尾选择
    `other`（其他）并从那里继续。完成后，点击 `Continue` 按钮进入第四步。


    ### 键盘布局选择


    第四步，从列表中选择你的键盘布局（见下图）。对于美国，预选是美式英语。如果你使用不同的键盘布局，请从列表中选择正确的项。完成后，点击 `Continue`
    按钮进入第五步。


    ### 网络设置


    第五步包括从 ISO 镜像加载安装程序组件，并检测网络硬件以加载正确的网络驱动程序。然后，安装程序尝试连接互联网，通过你的本地网络服务器通过 DHCP 获取
    IP 地址。


    完成后，你可以设置计算机的主机名（见下图）。为你的机器选择一个唯一的名称，该由单一名称组成且在你的本地网段中不存在。使用水果、地点、乐器、作曲家和电影角色命名是很常见的。在这种情况下，我们选择了
    `debian95` 名称，它简单代表了 Linux 发行版及其版本号。

