    if (statement) {\n    // code to execute\n} else {\n    // code to execute if\
    \ first block fails\n}\n```\n\nWhen you use an active `if` statement, even if\
    \ the statement is false, something is still going to run. Which one you’ll need\
    \ to use can vary immensely depending on what you’re needing at that specific\
    \ moment. Deciding which one to use is a skill that will grow on you as you gain\
