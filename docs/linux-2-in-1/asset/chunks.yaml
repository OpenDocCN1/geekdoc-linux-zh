- fmt: '

    If you are deciding to install from a USB, which is the more contemporary option,
    you will need to install an extra piece of software. `Unetbootin` is one option
    if you are running Windows. It is simple to download and get the program started.
    From there you can decide on your distribution from the list offered and download
    it to your USB. Not all the distributions are offered by `Unetbootin`, but that
    doesn’t limit your options. You can simply install the `.ISO` file from the download
    page of your distribution to your desktop and then have `Unetbootin` pick up on
    the file.


    You then need to follow the same process as with the CD: restart your computer
    with the installed distribution on your drive connected and go into the `BIOS`,
    select the boot options and choose the USB hard drive as the first option on the
    list, save your options, and restart once again. You will be taken to the `Unetbootin`
    menu where you can start your Linux session just as you could with the live CD
    method.


    ## The Installation Process


    The way a distribution is installed on your system varies, but you are generally
    given a setup guide that walks you through the process. If you are deciding to
    install Linux alongside another operating system, such as Windows, there is a
    little bit of work that needs to be done during the installation process to ensure
    that everything runs smoothly.


    The first step, in this case, is to partition your drive. This will tell your
    computer where you want Linux to be installed. This is a simple task that requires
    little effort on your part. You just need to select a space on your hard drive
    and allocate some of the free space you have for the installation and running
    of the operating system.


    If you are installing Ubuntu, the program will generally do this for you by selecting
    its own space. From there, the rest of the installation process is quite simple.


    For other distributions, you will be required to partition the space yourself
    and some partitioning tools can be complex. In this case, you will need to create
    two new partitions. One is to set aside space for the operating system itself.
    The recommendation is at least 10 GB for this. You should name this partition
    `Ext4` and set the mount point as `/`. Then create a second partition for what
    is called `swap space`. This is where the memory well be held in order to run
    the operating system and keep things processing quickly. If you only have a small
    amount of RAM available, make the swap partition twice as large as your available
    memory. If you have a decent amount of RAM (over 3GB), make the swap partition
    the same size as your available RAM.


    ## GRUB and other Bootloaders


    Before Linux completes the installation process, it will install a new bootloader
    onto your system under the name `GRUB`. This will be replacing your standard bootloader
    and will give you the option upon start-up to open your desktop with Windows or
    Linux. You do not need to do any work during this part of the installation process;
    you only need to sit back and let your distribution install `GRUB`.


    For those of you who have a Mac, this is one of the parts of the process that
    will work differently and you will need to install `GRUB` onto the Linux partition
    manually.


    Windows users: make a note that if you decide to uninstall and reinstall Windows
    at any point, you will need to install `GRUB` manually once you get your operating
    system set up again.


    If you prefer something with a more enhanced user interface, you may want to install
    another bootloader that is compatible with Linux. An example of this is a bootloader
    called `Burg`. However, you do not need to do this straight away and can wait
    until you have finished installing Linux before setting up a new bootloader.


    If you have followed these steps, you are ready to go. Your Linux partition should
    now be installed and all you need to do is restart your computer to be taken to
    the `GRUB` menu. From there you can decide whether you would like to boot Linux
    or Windows. Obviously, for the purposes of this book, we want to boot Linux to
    get a feel for it for the first time. You will notice that there are several pre-installed
    apps that come with your Linux distribution. Some of these will be useful to you
    and some will not, but you can look at each one and figure out which ones you
    can use.


    In some cases, installing a new operating system can cause hardware to become
    unstable. This is usually because the hardware does not realize that you are using
    Linux and some miscommunication can occur. This is especially the case for Wi-Fi.
    There are some steps you can take to ensure that all your hardware is compatible
    with your new installation.


    ## 9. Computers and Math


    Arithmetic comes naturally to computers, and fortunately, programming languages
    tend to make it easy. The symbols are intuitive, and you shouldn’t have much issue
    at all with them. I’ll list the general mathematical symbols and when you may
    use them:


    - `+` This symbol means, of course, addition.

    - `-` This symbol means subtraction.

    - `*` This symbol means multiplication.

    - `/` This symbol means division.

    - `%` This symbol is the modulo. It refers to the remainder of a given division
    problem. For example, `7%2` would be `1`, since the remainder of `7` divided by
    2 is `1`.

    - `**` This symbol turns a number into an exponent. For example, `2**2` would
    be two squared, or four.

    - `//` This symbol refers to floor division.


    Additionally, there are some assignment operators intended to make arithmetic
    in programming more intuitive. Assignment operators are operators which can be
    used to assign values. The most common one is the equals sign, which gives one
    thing a certain value. However, there are more.


    For example, instead of typing `x = x + 1`, you can just type `x++`. Instead of
    `x--`, you can just type `x--`.


    There are also shorthand assignment operators. These are intended to take arithmetic
    operations and shorten them. For example, instead of `x = x + 3`, you could simply
    `x += 3`.


    Here are all shorthand operators and their uses:

    - `x += y` - `x + y`

    - `x -= y` - `x - y`

    - `x *= y` - `x * y`

    - `x /= y` - `x / y`

    - `x **= y` - `x**y`

    - `x //= y` - `x // y`


    ## Computers and Logic


    In this portion of the chapter, we’re going to start to discuss the foundations
    of logic. Logic is a very dense topic, but it’s also rather simple. Essentially,
    when it comes to statements we make, we tend to think of them in very abstract
    terms. We even go as far as make unnecessary abstractions where they really don’t
    need to be. This isn’t how computers work.


    As I said earlier, computers are dumb. They take things as literally as you can
    make them. If you say something to a computer, it interprets it as the literal
    form of the statement.


    This is important, because logic is also used in pretty much every decision we
    make every day, and paralleling those decisions to a computer will prove very
    difficult if you don’t understand the different ways in which we process logic.
    Logic is essentially built off comparisons. You may not realize this now, but
    every decision you make is based on a comparison, whether implied or explicit.
    Even if you don’t outright compare one value to another, you are almost always
    comparing something to some unknown values. For example, if you say “do we have
    any eggs?” you aren’t just checking if there are eggs, you’re checking if the
    number of eggs that you have is greater than zero. This is an implicit logical
    statement.


    Comparisons are key to making your program branch out and do many different things.
    This concept is known as control flow. Control flow is essential because it’s
    the way of making your program think. Without control flow, your program isn’t
    going to do anything. Sure it may have basic operations it performs, but as far
    as internal decision making goes, there will be no such thing.


    In Java, C++, and Python alike, these are the comparative operators:

    - `<` Less than

    - `<=` Less than or equal to

    - `>` Greater than

    - `>=` Greater than or equal to

    - `==` Equal to

