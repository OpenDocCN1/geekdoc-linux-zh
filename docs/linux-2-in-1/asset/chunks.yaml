- fmt: '

    Case sensitivity also comes into command line options. For example, when you use
    the command `ls`, there are two distinct options: `ls` and `lS`, and both do something
    different. One of the more common errors is to enter an option in lowercase when
    it should be uppercase, and then wonder why your program doesn’t do what it should.


    ## Spaces in file or directory names


    While it’s perfectly okay to have spaces in your directory or file names, you
    must exercise some small measure of caution. When we want to separate several
    items on the command line, we use a space between each one. The spaces are what
    tell us what the program name is and how to identify the different arguments on
    the command line. For example, if we wanted to go into a directory that we called
    `Summer Holiday`, this next example would not work:


    ```

    ls Documents

    FILE2.txt File2.txt file2.TXT Summer Holiday

    ...

    cd Summer Holiday

    ```


    ```

    bash: cd: Holiday: No such file or directory

    ```


    Why not? Well, `Summer Holiday` is seen by Linux as 2 separate command line arguments,
    so the command, `cd`, will go into the first one only. The only way to stop this
    from happening is to tell the terminal that `Summer Holiday` is just one argument
    and there are two ways to do this, both of which are perfectly valid.


    ### Quotes


    The first way involves surrounding the whole item with quote marks. You can use
    singles or doubles (although there is a small difference between the two) but
    do make sure that you use the same to open as you do to close the quote marks.
    For example, don’t open with a single quote and then close with a double. Anything
    that goes inside those quotes is then seen as one item, for example:


    ```

    cd ''Summer Holiday''

    pwd

    /home/cleopatra/Documents/Summer Holiday

    ```


    ### Escape characters


    The other way is using an escape character, the backslash (`\`). The escape character
    will nullify or escape the special meaning attached to the following character,
    for example:


    ```

    cd Holiday\ Photos

    pwd

    /home/cleopatra/Documents/Summer Holiday

    ```


    As you can see from this example, the space that separates `Summer` and `Holiday`
    would usually have a special meaning: to separate each work as a separate command
    line argument. By using the escape character, we removed that meaning and the
    two words are one argument.


    Earlier we talked about something called TAB completion. If you were to use this
    before you get to a space in the name of a directory, the terminal escapes the
    spaces automatically.


    ## Hidden directories and files


    Linux has a very nice way of specifying whether a directory or a file is hidden
    or not. If the name starts with `a.` (`a` followed by a full stop), it’s a hidden
    directory or file. There are no requirements for special commands or special actions
    to hide them.


    There are several reasons why you may want to hide a directory or a file, and
    one of those is if they relate to the configuration for a specific user. These
    can be hidden so they don’t interfere with everyday tasks the user may be doing.


    So, if you want to hide a file or a directory, simply create it or rename it with
    the name beginning with `a.`. In the same way, if you wanted to unhide a directory
    or file, you would simply rename it, removing the `a.` from the start of the name.
    The command that you learned to list directories and files will NOT show those
    that are hidden. Instead, you can modify the command to add in `-a` as a command
    line option, allowing those hidden files and directories to be shown.


    ```

    ls Documents

    FILE2.txt File2.txt file2.TXT

    ...

    ls -a Documents

    . .. FILE2.txt File2.txt file2.TXT. hidden.file.txt

    ...

    ```


    In this example, you can see that, when the directories and files were listed,
    the first two were `.` and `..` and if you need to brush up on those head back
    to the section on paths.


    ## Summary


    Here’s a quick summary of what you learned in this section:


    * `file` is used to get information about the type of a directory or file.

    * `ls -a` lists all files in a directory, including those that are hidden.

    * Everything is a file in Linux, including directories.

    * File extensions are not important because Linux will investigate the file to
    see what it is.

    * Linux is a case-sensitive language, so watch out for capitalization.


    ## Practical work


    Now we need to put it all into practice, so try these:


    * Run the command `file` with several different entries and ensure that you use
    a combination of absolute and relative paths.

    * Next, give a command that will show everything that’s in your home directory,
    including any directories or files that are hidden.


    ## More on running commands


    Much of understanding Linux is down to knowing the right command line options
    to use to change how your commands work, based on what you are doing with them.
    Many of these will have a long and shorthand version; for example, we saw earlier
    that, when we want to list everything in a directory, including hidden entries,
    we use `-a` or `--all`. The longhand version is just a version that’s easily read
    by the human eye. You can use either of these because they both have the same
    outcome. The advantage to longhand is that, when you read back over your code,
    you’ll find it easier to understand what the commands do, while using shorthand
    allows you to string several commands together easily.


    ```

    pwd

    /home/cleopatra

    ls -a

    ls --all

    ls -alh

    ```


    So, you can see that the longhand options each start with a pair of dashes (`--`),
    while the shorthand options all start with a single dash (`-`). When you use the
    single dash, you can invoke several command options by adding all the letters
    that represent those options after it. To see what the last option is doing, look
    up the manual page.


    ## Man pages


    These are the commands for looking up manual pages:


    * `man <command>`: looks up the manual page for a command

    * `man -k <search term>`: use a keyword to search for all pages that have it

    * `/<term>`: used in a manual page to search for the word “term”

    * `n`: after the search is done on a page, choose the next item

    * Remember: man pages are useful so use them as often as you need. You don’t need
    to try and remember everything when you have these at your disposal.


    ## Practical work


    Try the following to get some practice:


    * Look through the manual page for `ls`. Play around with some of the options
    and try some of them as combinations. Don’t forget to use a variety of relative
    and absolute paths with the `ls` command.

    * Now have a go at some searches in the `man` pages. Depending on what you search
    for, you could end up with a few large lists. Look at some of the pages to get
    an idea of what they are like.


    ## Removing a directory


    As you have seen, it’s easy to create a new directory and it’s just as easy to
    remove or delete a directory too. There is one thing you should be aware of, though—the
    Linux command line doesn’t contain any UNDO options. This means being very careful
    about what you are doing because once you delete a directory, it’s gone forever.
    To remove a directory, we use a simple command `rmdir`, which is shorthand for
    remove directory.


    ```

    rmdir [options] <Directory>

    ```


    There are two more things that you need to note here. First, in a similar way
    to how `mkdir` (make directory) supports the options `-v` and `-p`, `rmdir` also
    supports those options. Second, before you can remove a directory, it must be
    empty. However, there is a way around this, and we will look at that later.


    ```

    rmdir linuxpractice/foo/bar

    ls linuxpractice/foo

    ```


    ## Creating a blank file


    There are quite a few commands that involve data manipulation in files that, if
    you refer to a file that doesn’t exist, will create that file for you. We can
    use this to create a blank file by using the `touch` command.


    ```

    touch [options] <filename>

    ```


    ```

    pwd

    /home/cleopatra/linuxpractice

    ls

    foo

    touch example1

    ls

    example1 foo

    ```

