    \n[15.Exploring Shell](#part0000.xhtml__Toc27246694)\n\n[16.Archiving and Compression](#part0000.xhtml__Toc27246695)\n\
    \n[17.BONUS](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\n[The Bash Shell](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\
    \n[The Shell Command](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\n[Putting Together\
    \ Your Shell Commands](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\n[18.How To Create\
    \ Basic Scripts](#part0000.xhtml__Toc27246700)\n\n[Your First Shell Script](#part0000.xhtml__Toc27246701)\n\
    \n[Having Arguments In A Re-Usable Shell Script](#part0000.xhtml__Toc27246702)\n\
    \n[Conclusion](#part0000.xhtml__Toc27246703)\n\n# Description\n\nLinux is a relatively\
    \ complex system of different interconnected programs. There are many components\
    \ to a Linux system. Even though most of them are interchangeable and allow for\
    \ a great deal of customization, there are some components that a Linux must have\
    \ in order to function properly. Some of the programs are more important than\
    \ others, of course, but the core principles always stay the same.\n\nThis program\
    \ is responsible for the proper booting of a Linux system. It selects the optimal\
    \ parameters for the kernel and the initial RAM disk of Linux, which is also known\
    \ as ignited. The kernel is the core of the operating system. It starts the initialization\
    \ process immediately after being launched. The init process can be replaced by\
    \ any suitable replacement like the system, but the function of the boot loader\
    \ stays the same. The initial RAM disk gives you temporary memory that loads critical\
    \ files before the root system is loaded.\n\nIf you have an older computer that\
    \ runs with a basic input/output system, you can find your boot loader in the\
    \ Master Boot Record which takes up the first 512 bytes on your disk. Newer computers\
    \ have a Unified Extensible Firmware Interface and store it in a special partition.\
    \ The partition is called the EFI system partition.\n\nImmediately after your\
    \ device is powered on, a self-test process is performed immediately. This self-test\
    \ is called the Power-On Self-Test and if it is successful, the boot loader will\
    \ be loaded by the BIOS or UEFI.\n\nDespite being very small and simple, boot\
    \ loaders play a critical role in the process. On most Linux-related forums you\
    \ will find people that have a problem with their boot loader, and you will also\
    \ find people that can help you fix the problems you might encounter. To avoid\
    \ these problems you will have to understand which boot loaders are the best for\
    \ you and what kind of role they play in the booting process.\n\nThere are many\
    \ different boot loaders that you can install on your Linux systems, but below\
    \ we will talk about the most popular and best to work with.\n\nThis guide will\
    \ focus on the following:\n\n*   What is Linux?\n\n*   What is Ubuntu?\n\n*  \
    \ Linux set-up process\n\n*   Linux Command Lines\n\n*   Variables\n\n*   Using\
    \ the Shell\n\n*   Nested If Statements\n\n*   Boolean Operators\n\n*   Log Analysis\n\
    \n*   Create a bootable stick… AND MORE!!!\n\n# Introduction\n\nIn this chapter,\
    \ I will provide some brief information on this operating system’s architecture,\
    \ and discuss the different flavors of Linux that a beginner can choose from.\n\
    \nLinux Architecture\n\nLinux architecture can be divided into two spaces. The\
    \ User Space and the Kernel Space.\n\n*   User Space – This is where the applications\
    \ are used. The GNU C library, in the User space, is the interface that connects\
    \ to the kernel and transitions between User and Kernel space. This uses all the\
    \ available memory.\n\n*   Kernel Space – All Kernel services are processed here.\
    \ The Kernel space is further divided into 3\\.\n\n    *   System Call Interface\
    \ – A User process can access Kernel space through a System Call. When a System\
    \ Call is performed, arguments are passed from User to Kernel space. This is the\
    \ layer that implements basic functions.\n\n    *   Kernel Code – This is the\
    \ architecture-independent code, and can be seen in all architectures that Linux\
    \ supports.\n\n    *   Architecture-Dependent Kernel Code – This is the layer\
    \ for platform-specific codes.\n\nLinux Distributions\n\nEach Linux distribution\
    \ consists of a Linux kernel plus utilities and configuration files. Most Linux\
    \ distributions can be downloaded from their websites. \n\nLet’s look at how several\
    \ of the popular Linux distributions, or flavors, differ from each other based\
    \ on the following criteria:\n\nAvailability\n\nAs previously mentioned, Linux\
    \ is a free software, but companies offering a support contract and proprietary\
    \ components offer it for a fee. In the table below, Red Hat Enterprise and SUSE\
    \ Enterprise both offer Linux commercially, but they also have the free alternatives\
    \ – Fedora and openSUSE.\n\nPackage Format\n\nLinux distributions come in packages.\
    \ Packages are files grouped into one single file. RPM is the most used. \n\n\
    Release Cycle\n\nThis is how often a distribution releases new software. The ones\
    \ with shorter release cycles provide the latest software in the shortest possible\
    \ length of time, while those distributions with long release cycles aim to offer\
    \ the most stable environments possible. A distribution can have it done both\
    \ ways. Look at Ubuntu who releases both long-term support (LTS) versions (longer\
    \ cycle) and the latest software through a 6month cycle.\n\nTo help you decide\
    \ on which is the right distribution for you, consider the criteria mentioned\
    \ above and research the other fields listed below:\n\n- Desktop environment:\
    \ Do your research and find out if the distribution that you’re eyeing has a basic\
    \ look and feel that you like, please check how customizable it is \n\n- Hardware\
    \ Compatibility: Depending on the hardware that you are using, some drivers might\
    \ not be available yet by the time you install your distro. Check from online\
    \ resources first to know which ones can be supported out-of-the-box.\n\n- Community\
    \ Support: Find the one with a large online community. The bigger the community\
    \ is, the easier it will be to find documentation and get support.\n\n# Chapter\
    \ 1 What is Linux?\n\nLinux is a family of free and open-source software operating\
    \ systems based on the Linux Kernel; an operating system kernel first released\
    \ on September 17, 1991 by Linus Torvalds. Linux is typically packaged in a Linux\
    \ distribution (or distro for short).\n\nDistributions include the Linux kernel\
    \ and supporting system software and libraries, many of which are provided by\
    \ the GNU Project.\n\n(Source: Wikipedia.org)\n\nThe Linux kernel saw the light\
    \ of day in 1991 in version 0.0.1. \n\nLinus Torvalds, who is still in charge\
    \ of kernel development today, had no idea what he would initiate with the release\
    \ of his small hobby project.\n\nToday, the term Linux is usually used as a synonym\
    \ for the entire system. Strictly speaking, however, only the kernel is called\
    \ Linux.\n\nOnly when combined with applications and programs that follow the\
    \ GNU guidelines it becomes the system we know and love today.\n\nThe first Linux\
    \ distributions were released in 1994\\. They had made it their business to develop\
    \ usable systems as an alternative to Windows and MacOS:\n\nDebian\n\nSuse\n\n\
    Slackware\n\nRedHat \n\nA major step forward was the release of Open Office (Version\
    \ 1) in 2002.\n\nIt was a full-featured open source office suite, which was available\
    \ free of charge.\n\nOf course, the functionality was still limited compared to\
    \ Microsoft Office, but Open Office became better and better over time.\n\nLibre\
    \ Office has been developed later as an independent fork of Open Office. This\
    \ extensive and meanwhile very mature office suite is pre-installed in Ubuntu\
    \ 18.04.\n\nMeanwhile there are countless variants of Linux distributions."
