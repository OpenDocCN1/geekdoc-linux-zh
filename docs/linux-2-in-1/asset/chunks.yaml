    ### more


    从终端读取文本文件，我们可以使用的命令之一是 `more` 命令。该命令用于命令输出大于输出的情况，以便我们更舒适地阅读。例如，当我们给出 `more /etc/passwd`
    命令时，较长的命令输出会出现在屏幕上，每次当你按回车键，它就会逐行继续。按空格键可以翻页。返回上一页使用 `b` 键。当我们想要退出时，可以按 `q` 键。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-18.png](img/image00291.jpeg)


    ### less


    再次，为了读取文件内容，你可以使用的另一个命令是 `less` 命令。使用此命令像 `more` 命令一样，我们显示长文件的输出以便于阅读。使用向上和向下方向键翻页。按空格键进入下一页，按
    `b` 键回到上一页。退出如之前提到的使用 `q` 键。


    ### head-tail


    在查看文件内容时，查看前十行使用 `head`，查看后十行使用 `tail` 命令。这些参数是如此，但如果你想查看特定的行数，必须用 `-n` 参数指定。例如，查看前五行使用
    `head -n 5`，查看后五行可以使用 `tail -n 5` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEERİ\Görsel-19.png](img/image00292.jpeg)


    ### tee


    为了同时打印标准输出（即终端/控制台）并写入指定的文件，你必须使用 `tee` 命令。如果文件不存在，它将被创建并写入。写入完成后，按 `Ctrl + D`
    退出以返回命令行。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEERİ\Görsel-20.png](img/image00293.jpeg)


    如你所见，首先通过 `tee hacker` 命令创建了名为 `hacker` 的文件，然后输我们在终端写入的表达式，同时也写入了文件。


    ### tac


    为了从文件内容的结尾开始向前查看，我们可以使用 `tac` 命令。


