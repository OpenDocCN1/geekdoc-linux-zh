    the PID 1183\.


    [root server ~] # journals _SYSTEMD_UNIT=sshd.service _PID=1183


    ## System Journal Preservation


    In this section, we will learn how to make changes to the systemd-journald configuration
    such that the journal is stored on the disk instead of memory.


    ### Permanently storing the system journal


    The system journal is kept at /run/log/journal by default, which means that when
    the system reboots, the entries are cleared. The journal is a new implementation
    in Red Hat Enterprise Linux 7\.


    We can be sure that if we create a directory as /var/log/journal, the journal
    entries can be logged there instead. This will give us an advantage that historical
    data will be available even after a reboot. However, even though we will have
    a journal that is persistent, we cannot have any data that can be kept forever.
    There is a log rotation, which is triggered by a journal on a monthly basis. Also,
    by default, the journal is not allowed to have a dusk accumulation of more than
    10% of the file system it occupies, or even leave less than 15% of the file system
    free. You can change these values as per your needs in the configuration file
    at /etc/systemd/journald.conf and one the process for systemd-journald starts,
    the new values will come into effect and will be logged. 


    As discussed previously, the entries of the journal can be made permanent by creating
    a directory at /var/log/journal


    [root@server ~]# mkdir /var/log/journal 


    You will need to make sure that the owner of the /var/log/journal directory is
    root and the group owner is systemd-journal, and the directory permission is set
    to 2755.


    [root@server ~]# chown root:systemd-journal /var/log/journal


    [root@server ~]# chmod 2755 /var/log/journal


    For this to come into effect, you will need to reboot the system or as a root
    user, send a special signal USR1 to the systemd-journald process.


    [root@server ~]# killall -USR1 systemd-journald


    This will make the systemd journal entries permanent even through system reboots,
    you can now use the command journalctl -b to show minimal output as per the latest
    boot. 


    [root@server ~]# journalctl -b


    If you are investigating an issue related to system crash, you will need to filter
    out the journal output to show entries only before the system crash happened.
    That will ideally be the last reboot before the system crash. In such cases, you
    can combine the -b option with a negative number, which will indicate how many
    reboots to go back to limit the output. For example, to show outputs till the
    previous boot, you can use journalctl -b -1.


    ## Maintaining time accuracy


    In this section, we will learn how to make sure that the system time is accurate
    so that all the event logs that are logged in the log files show accurate timestamps. 


    ### Setting the local time zone and clock


    If you want to analyze logs across multiple systems, it is important that the
    clock on all those systems is synchronized. The systems can fetch the correct
    time from the Internet using the Network Time Protocol NTP. There are publicly
    available NTP projects on the Internet like the Network pool Project, which will
    allow a system to fetch the correct time. The other option is to maintain a clock
    made up of high quality hardware to serve time to all the local systems. 


    To view the current settings for date and time on a Linux system, you can use
    the timedatectl command. This command will display information such as the current
    time, the NTP synchronization settings and the time zone. 


    [root@server ~]# timedatectl


    The Red Hat Enterprise Linux 7 maintains a database with known time zones. It
    can be listed using the following command.


    [root@server ~]# timedatectl list-timezones


    The names of time zones are based on zoneinfo database that IANA maintains. The
    naming convention of time zones is based on the ocean or continent. This is followed
    by the largest city in that time zone or region. For example, if we look at the
    Mountain Time in the USA, it is represented as “America/Denver”.


    It is critical to select the correct name of the city because sometimes even regions
    within the same time zone may maintain different settings for daylight savings.
    For example, the US mountain state of Arizona does not have any implementation
    of daylight savings and therefore falls under the time zone of “America/Phoenix”.


    The tzselect command is used to identify zone info time zone names if they are
    correct or not. The user will get question prompts about their current location
    and mostly gives the output for the correct time zone. While suggesting the time
    zone, it will not automatically make any changes to the current time on the system.
    Once you know, which timezone, you should be using, you can use the following
    command to display the same. 


    [root@server ~]# timedatectl set-timezone America/Phoenix


    [root@server ~]# timedatectl


    If you wish to change the current date and time for your system, you can use the
    set-time option with the timedatectl command. The time and date can be specified
    in the format “”YYYY-MM-DD hh:mm:ss”. If you just want to set the time, you can
    omit the date parameters. 


    [root@server ~]# timedatectl set-time 9:00:00


    [root@server ~]# timedatectl


    You can use the automatic time synchronization for Network Time Protocol using
    the set-ntp option with the timedatectl command. The argument to be passed along
    is true or false, which will turn the feature on or off.


    [root@server ~]# timedatectl set-ntp true


    ## The Chronyd Service


    The local hardware clock of the system is usually inaccurate. The chronyd service
    is used to keep the local clock on track by synchronizing it with the configured
    Network Time Protocol NTP servers. If the network is not available it synchronizes
    the local clock to the RTC clock drift that is calculated and recorded in the
    driftfile, which is maintained in the configuration file at /etc/chrony.conf.


    The default behavior of the chronyd service is to use the clocks from the NTP
    network pool project to synchronize the time and no additional configuration is
    needed. It is advisable to change the NTP servers if your system happens to be
    on an isolated network. '
