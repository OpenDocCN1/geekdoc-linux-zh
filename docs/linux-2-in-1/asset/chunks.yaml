  trans: "\n但在计算术语中，“真”或“假”到底意味着什么呢？计算机无法理解这种简单的关系。计算机不像我们一样拥有逻辑和熵增逻辑的大脑。这意味着它们无法从逻辑意义上理解某事是真是假。然而，它们也可以。这是怎么做到的呢？\n\
    \n计算机并不通过抽象思维来看待；相反，它们将事物视为一系列开启与关闭、是与否、`0` 或 `1` 的序列。正是这些二进制过程，使得计算机能够对逻辑过程进行渲染。在低层工程中，这些过程被表示为类似\
    \ `AND`、`OR`、`XAND` 和 `XOR` 门，但在这一层级，我们仅称这些为布尔逻辑过程。\n\n能够确定某事是否为真并做出决策，对任何良好的程序都是至关重要的。计算机有一种非常简单的方法来实现这一点：条件语句。\n\
    \n条件语句本质上是将一个值与另一个（或可能多个）值进行比较，以确定给定陈述的真假性。\n\n假设我说“7 小于 3”。嗯，你会立刻反对——不，不是这样的！你这样做是正确的，因为我听起来像个白痴。那么，接下来该如何处理呢？是什么让你说出“不，那不对”的？\n\
    \n在潜意识中，当我说这样的话时，你取了我说的两个数字——`7` 和 `3`——然后将它们相互比较。你意识到 `7` 比 `3` 大，你可能还在潜意识的某种数轴上将它们视觉化。在没有察觉的情况下，你比较这两个值的方式与计算机所做的方式非常相似。\n\
    \n然而，计算机并不具备比较这类数字的直觉知识。直觉是人类特有的东西，许多人认为直觉是无法编程的，因为它包含了随机生成的思维以及对过去事件极其广泛的知识的结合。因为缺乏这种直觉感，你需要显式地告诉它需要比较什么。然后它会告诉你该陈述是否为真。\n\
    \n无论你比较的是什么，无论是 `3` 与 `7`，还是一个字符串与另一个字符串，你始终这样做都是为了得到一个结果：即计算机告诉你该比较结果是真是假。通过这种方式，比较本身就可以作为一个值存在。这是最晦涩、也最难理解的概念之一。比较本身可以包含值，因为它们可以是真也可以是假，其中假为\
    \ `0`，真为 `1`。\n\n这意味着陈述 `3` 小于 `7` 是真的。但同时也意味着对该陈述为真的评估可以被视为一个值本身——即真/假二分法中的一个“真”值。这还意味着由于布尔变量可以存储真或假的信息，它们也可以存储比较结果的真或或性：\n\
    \n```\nmyComparison = 3 < 7\n```\n\n上述变量 `myComparison` 将等于“true”或 `1`，取决于你使用的语言。\n\
    \n然而，这里的关键点不在于这个值可以被存储——那只是对你以后有帮助的一部分信息。关键点在于，真或假的值可以通过（可能是一系列）对值的比较来评估。通过比较两个不同的事物，事物可以被评定为真或假。事物也可以根据其本质被评定为真或假——例如，如果你有一个名为\
    \ `isRunning` 的布尔变量，并且在每次启动程序时都将其设置为 `true`，在想要结束时将其设置为 `false`，你就可以通过比较 `isRunning`\
    \ 的真假性与“真”的真假性，来检查 `isRunning` 是否为真。\n\n换句话之，事物可以是真也可以是假。你可以利用这一重要信息做出程序范围内的决策，从而改变程序的运行轨迹。做到这一点的方法就是酷所在：`if`\
    \ 语句。\n\n`if` 语句是编程的重要基础之一。它允许你评估某物，然后查看评估结果是否为真。如果是真，它让你执行某些操作。如果不是真，它将完全跳过内部的代码。你将在本书涉及的两种语言中都会看到这种结构，因此理解它非常重要。\n\
    \n`if` 语句的基本语法如下：\n\n```\nif (condition) {\n    code\n}\n```\n\n这适用于多种语言。C、C++、Java\
    \ 和 PHP 都会立刻跃入脑海。你可以通过所谓的 `else` 语句在 `if` 语句的基础上进行构建。这强制了一种有趣的二元性，即存在两种不同的条件。我喜欢将这些称为“被动条件”和“主动条件”。\n\
    \n被动条件是仅依赖于 `if` 语句的条件。所发生的是评估 `if` 语句内部的代码。如果结果证明为真，那么 `if` 语句中的内容将被执行。然而，如果结果不是真，那么\
    \ `if` 语句中的内容将被跳过，就像该条件根本不存在一样。这里没有强制子句来确保你将遵守某种范式。它只是简单的开启或关闭——如果条件不匹配，整个语句都会被忽略。\n\
    \n然而，`else` 语句赋予了你主动条件。主动条件是具有强制子句的条件。所发生的是评估第一个 `if` 语句。如果结果证明为真，那么 `if` 语句将被执行。然而，如果它不是真，那么\
    \ `else` 语句将被执行——无论如何。这里没有被动性；如果 `if` 语句没有执行，条件的另一个分支就必须执行。\n\n## 控制流（循环）\n\n\
    控制流的另一个主要方面发生在循环中。那么什么是循环？循环基本上是一种对一组代码进行若干次重复，直到达到某个终点的方法。你从未真正思考过它，但你一直在使用循环逻辑。\n\
    \n考虑大声从一数到十数。这对你来说可能完全不像一个循环；毕竟，你只是在说不同的数字。但每当你数数时，你都在经历循环逻辑！\n\n这样想：如果你大声从一数到十，那么你所做的是先想一个数字\
    \ `n`，然后用嘴说出数字 `n`，然后在脑海中将 `n` 增加 `1`。这种情况不断发生，直到你达到要数的那个数字。\n"
- fmt: '

    Loops in programming occur along similar logic. There are two primary types of
    loops, but they function differently across C++ and Python, so we’re just going
    to discuss those in-depth in their specific chapters. In the meantime, just focus
    on the idea that loops are a huge part of control flow. There are many times in
    programming where you’re going to need to just repeat something over and over.
    Loops provide the perfect opportunity to fulfill that need.


    ## Functions and Methods


    Functions are the last major part of programming logic that we’re going to be
    discussing at this point in the book because it’s the last major pillar of early
    conceptual programming that we need to tackle. Don’t get me wrong, there are many
    more much deeper topics that we could go over in a conceptual way, but this is
    where the scope of the book starts to be a bit more defined.


    You might remember working with functions in your high school or college math
    classes. Functions were always math operations where you took a certain variable
    then performed a mathematical operation on it in order to get another value. For
    example, `f(x)` involved taking `x` and then performing some mathematical operation
    in order to get `f(x)`, which was functionally a `y` value.


    Functions and methods, for the record, are functionally the same thing. The preferred
    term changes depending upon the language which is being used. In older languages
    or procedural languages like `C`, as well as era derivatives like `C++`, function
    is the preferred term. Meanwhile, in object-oriented languages like `Java` or
    `Python`, method is the preferred term.


    Anyhow, methods and functions simply take this idea of mathematical operations
    upon a given value and then gives you a way by which you can fulfill that specific
    need. For example, you could create a function called `calculateSquareFootage`
    which took the arguments `length` and `width` and then return a value called `area`,
    which would be the overall value of the function `calculateSquareFootage`. `area`
    could be the value of `length` multiplied by `width`.


    Defining a function like this can be referred to as a function definition. This
    is an important term to know, so keep it in mind. Anyhow, moving forward. Once
    you’ve defined a function, you’ll probably want to use it later. This is known
    as calling a function or calling a method.


    You call a function by saying the name of it plus the values you want to send.
    For example, calling `calculateSquareFootage(3, 4)` would return the value of
    `12`. We could then save this value to a variable or print it out directly.


    That’s the last important thing about functions: return values! Almost all functions
    will give a value back to you, that’s one of their primary purposes. Not all of
    them must, of course - `void` functions have no such requirement to give a value
    back. Every other function, though, must give a value back which corresponds to
    the type of the function, if using a language where you must type a function when
    declaring it. The returning of a value signifies the end of a function.


    Again, not all functions must return values - `void` functions do not have to
    do so. Additionally, many scripting languages - such as `Python` - avoid function
    typing at all, meaning that when the function has no more code in it, the function
    has run its course and will be terminated, going back to the main code of the
    program.


    Basically, functions have two primary purposes.


    The first primary purpose is that they allow you to normalize certain interactions
    and calculations within your program, making it so that you don’t have to type
    the same thing over and over. This in and of itself is somewhat modular, which
    is a very nice feature.


    The second primary purpose is that they allow you to clean up your code. By dividing
    a huge main code block into smaller functions, you make your code much more readable
    and, much of the time, you also make it easier to understand.


    Classes can have their own defined functions, and they can also have multiple
    functions with the same name but different arguments (following the rules of polymorphism).
    This also lends itself to something else cool. When you’re using an object which
    is ultimately derived from a created class, like a `vector` or a `string`, they’ll
    generally have built-in methods which you can use to manipulate the object. This
    really comes in handy!


    # Conclusion


    Over the course of this chapter, we’ve broken down some of the toughest programming
    concepts and tried to make them as easy to digest as is even possible. Understanding
    programming intimately can be a very hard thing. However, it’s important if you
    want to be a programmer that you understand the underlying concepts. The cool
    thing about these concepts you’ve learned is that they apply not just to Linux
    systems but to any code you’ll ever write. The fact is that there’s not a whole
    lot special about programming on Linux. There isn’t much that will divide code
    written in `C++` for Windows and `C++` for Linux, and there’s nothing to divide
    code written in `Python`, `Java`, or `PHP` between the two platforms. However,
    there are key concepts which permeate all these extremely popular languages that
    in order to understand how to program, you must understand them.


    Now that we have learnt what Linux system is and how to get started on the Linux
    manipulations by learning several basic commands. These commands help us to navigate
    the system and, thus, I would recommend that you perform as many practice tasks
    as you can so that you understand what commands does what and the output of running
    each of those commands. In our next sessions, we will learn more on `grep` and
    regular expressions, piping and redirection, process management and finally bash
    scripting which will form part of the intermediate level of Linux system. This
    will prepare us to be comfortable enough to proceed on to the advanced level of
    Linux system and how to use the commands that we have learnt in writing good GNU/Linux
    software, learning about threads, processes as well as inter-process communication
    among others.


    Linux command line:


    Advanced guide to understand the basics of command line, administration and security
    for hackers. Start your quick study for hacking and networking. Including the
    essentials, tips and exercises.

