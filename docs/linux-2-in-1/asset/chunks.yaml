  trans: "\n\n# != 不等于\n\n这些被用于构建语句。语句是逻辑比较，包含一个或多个内置比较。以下是一个逻辑比较的伪代码版本：\n\n```python\n\
    peaches = 6\nbananas = 3\npeaches > bananas\n//由于此语句为真，所以“peaches > bananas”为真。\n\
    ```\n\n使用这些语句对于构建程序的内部逻辑至关重要。你还可以将不同的语句组合成一个更大的语句。\n\n这些语句是使用“条件运算符”构建的。你需要在底层需要了解的三个主要运算符：`and`、`or`\
    \ 和 `not`。\n\n- **And**（与）表示两个语句是连接的。这意味着如果其中任何一个语句为假，整个语句就为假。只有当两个语句都真时，它才为真。\n\
    - **Or**（或）表示两个语句是分离的但隐式连接的。如果其中任何一个语句为真，那么整个语句就为真。不需要两个都为真，语句就能返回真。\n- **Not**（非）表示跟随其后的整个语句是不真实的。因此，包括\
    \ `not` 运算符在内的整个语句的有效性取决于不带 `not` 运算符的语句是否为假。例如，如果 `morePeaches` 为真，那么 `not morePeaches`\
    \ 为假；相反，如果 `morePeaches` 为假，那么 `not morePeaches` 为真。\n\n## 条件语句\n\n说了这么多，现在是时候开始谈论如何在程序中使用语句来构建程序运行的逻辑线条了。条件语句用于检查给定语句是否为真，然后采取相应的行动。例如，如果条件语句是\
    \ `if` 鸡蛋数量大于零，程序将评估这是否为真，如果是，则执行某些操作。这是第一种条件语句，被称为 `if` 语句。\n\n以下是基础 `if` 语句的伪代码：\n\
    \n```python\nif (statement) {\n    // 执行的代码\n}\n```\n\n这就是我喜欢称说的“被动 `if` 语句”。我之所以这样命名，是因为这些语句只有在比较语句被认为真时才会执行。然而，这些语句中没有逃逸条款，没有程序方法可以指定当语句结果为假时应该发生什么。程序将直接跳过该语句，继续执行代码中的后续内容。\n\
    \n你还可以通过所谓的 `else` 语句来创建一个“活跃 `if` 语句”。`Else` 语句是 `if` 语句的附录，当初始 `if` 语句证明不为真时提供一组要执行的操作。这是一个活跃\
    \ `if` 语句的示例：\n\n```python\nif (statement) {\n    // 执行的代码\n} else {\n    // 如果第一个块失败则执行的代码\n\
    }\n```\n\n当你使用活跃 `if` 语句时，即使语句为假，仍然会有东西运行。你需要使用哪一种在很大程度上取决于你特定时刻的需求。决定使用哪一种是一种技能，随着你经验的增加，这种技能会增长。\n\
    \n但有时，你需要捕获多个子句。例如，你可能想在数字小于 6、数字大于 37 以及数字处于两者之间时分别执行某些操作。对于这种情况，你需要 `if` 子句的另一个部分。\n\
    \n那么，你如何这样做呢？你使用 `else if` 语句。`Else if` 语句提供了一种进入兜底的 `else` 语句之前测试额外语句的方法。它们被夹在你的\
    \ `if` 语句和 `else` 语句之间，你可以根据情况拥有任意数量的此类语句：\n\n```python\nif (statement1) {\n \
    \   // 块 1\n} else if (statement2) {\n    // 块 2\n} else {\n    // 兜底块\n}\n```\n\
    \n如果 `statement1` 证明为真，则执行第一个代码块。如果 `statement2` 证明为真，则执行第二个代码块。如果两者都不为真，则执行第三个块。这是控制流的最形式。\n\
    \n## 循环\n\n控制流的另一种形式被称为循环。你每天都在使用循环，甚至完全没有考虑到。就像 `if` 语句一样，你不断在脑海中进行比较，你只是没有思考它们是如何……嗯，是如何作为比较的。\n\
    \n循环允许你做什么？循环提供了一种有条的方法的方法检查语句是否为真，如果是真或假，你就可以采取相应的行动。你在内部逻辑中一直使用循环，只是没有考虑过它们是循环。想一下大声从\
    \ 1 数到 10。你从数字 0 开始，尽管你并没有说出来——你将数字加 1，然后大声说出来。只要数字 `n` 小于或等于数字 10，这种持续就会进行。\n\
    \n有两种不同的主要循环类型：`while` 循环和 `for` 循环。它们的作用截然不同，但从一开始这可能不会完全清楚。此外，学习如何正确使用这些循环更多是一个经验问题，而不是某种以任何形式从书中妥善传授的内容，但我们可以概述这两者的最基本要素和主要区别，并开始区分它们的用途。\n\
    \n### While 循环\n`while` 循环主要用于简单的语句检查。也就是说，只要你只需要在给定语句为真或假的持续时间内反复运行某些内容，`while`\
    \ 循环就是你的朋友。这使得它们被用于所谓的“游戏循环”。游戏循环之所以这样命名，是因为它们允许你重复一段内容，直到某个变量被标记为真或假。它们在计算机游戏中很常见，变量可能是类似\
    \ `GameOver = False`，循环将不断运行直到 `GameOver` 为真。每当有东西触发 `GameOver = true` 时（例如玩家耗尽生命值或庄家赢得纸牌游戏），循环将退出并发生其他事情。\n\
    \n```python\nwhile (statement) {\n    // 执行代码直到语句为假\n}\n```\n\n### For 循环\n另一种循环是\
    \ `for` 循环。在像 C 和 Java 这样的 C 语言中，两者之间的区别不像在 Python 等语言那样清晰。然而，通过在 Python 中使用它，它在\
    \ C++ 和 Java 中的主要用途变得极其清晰。`For` 循环旨在迭代。它们的作用允许你定义特定的集合或范围，创建一个迭代变量（这是一个随着集合或范围移动的每次循环实例而以某种方式变化的变量），然后遍历循环直到定义的集合或范围被迭代完毕。\n\
    \n```python\nfor (iterator variable; range definition; increment setting) {\n\
    \    // 执行代码直到范围迭代完毕\n}\n```\n\n### Do while 循环\n还有 `do while` 循环。`do while` 循环的作用是允许你定义一个代码块，它肯定会执行一次，但只有当给定语句为假时它才会执行更多。与普通的\
    \ `while` 循环相比——如果给定的初始语句是不真实的，那么整个循环将不会执行。通过 `do while` 循环，你确保这种情况不会发生，给你安全感，知道给定代码至少执行一次。\n\
    \n```python\ndo {\n    // 代码至少执行一次，如果 while 条件为真则执行更多\n} while (statement)\n```\n\
    \n循环是控制流的另一个重要部分，允许你将程序分为不同的路径，这些路径可以根据程序执行的方式而改变。它允许你响应用户输入或任何其他变量。总而言之，它让你编写出一个不是从\
    \ A 点到 B 点直直路径的程序。\n\n"
- fmt: "\n# Methods\n\nMethods allow you to add a layer to your programming called\
    \ modularity. We’ll be discussing this in a more in-depth way in the section which\
    \ follows this one, but modularity is essentially the ability of something to\
    \ be broken down and reused over and over. Methods allow you to add a layer of\
    \ modularity to your program because they let you reuse a certain chunk of code\
    \ over and over. They also allow you to detach different parts of your code so\
    \ that the code is more readable and manageable.\n\nAnother perk of modular programming\
    \ is that it allows you to change one part of the code and have it change throughout\
    \ without requiring you to go through and refactor what could amount to hundreds\
    \ of lines of code in big programs. This is a huge difference and will save you\
    \ a lot of pain and frustration and time spent debugging in the future.\n\nSo\
    \ what are methods exactly? Well, to understand them better, it might be better\
    \ to use their other name for a minute: functions. (Functions and methods are\
    \ functionally the same thing; method is the name used in more modern languages,\
    \ usually, where function is preferred in languages like `C` and `C++` - other\
    \ than the name, they are the same exact thing)\n\nThis is the second reference\
    \ to high school math classes that we’ve had so far, and it’s equally relevant\
    \ to the last one. Remember back in your high school algebra classes where you’d\
    \ have a function like `f(x) = 3x + 4` and you would plug in the given `x` value?\
    \ For example, if `f(x)` were `f(3)`, then you would plug three into the equation?\n\
    \nIn an abstract and very basic way, this works in an extremely similar manner\
    \ to the way that functions do in programming. In the function `f(x)`, `x` is\
    \ what is called the argument. You feed something to the function. The function\
    \ itself is just the name of the entire statement - the term `3x + 4` can be referred\
    \ to as the action of the function. The action can perform operations upon the\
    \ arguments of the function. The result is what the function returns. The end\
    \ value given above of `f(3) = 3(3) + 4` would be `13`. The return, therefore,\
    \ after all operations are finished and the action has been carried out, is the\
    \ return value of the function. Since `f(x) = 3x + 4`, the return value of `f(x)`\
    \ with the argument `3` is `f(3) = 13`.\n\nIn programming, this can change just\
    \ a little bit. For example, a function doesn’t have to take any arguments at\
    \ all. This is also technically true in mathematics, where function `f(x)` could\
    \ simply be `14 + 4`. All values of `x` would be `14 + 4`. If a function doesn’t\
    \ have arguments, then whatever you define as the action will always take place\
    \ in the same way. This is greater if you need to run the same bit of code at\
    \ various times, like so:\n\n```javascript\nfunction bark() {\n    print \"bark!\"\
    \n}\n\nbark();\n```\n\nAnytime that the function `bark` is called, then it will\
    \ print out `bark`. Why is something like this useful? Imagine a code chunk where\
    \ you must print out `bark` multiple times - it’s hard, but this is a tutorial\
    \ book so just try, some books certainly have stranger examples. If you decided\
    \ you wanted it to instead say “barkbark!” instead of “bark!”, you could just\
    \ change your one line of code in your function instead of going to every line\
    \ in your program that says “print ‘bark!’” and changing it.\n\nMethods are relatively\
    \ simple in what they’re intended to do and aren’t terribly difficult to understand.\
    \ Here is the pseudocode for a method:\n\n```text\nmethod(arguments) {\n    //\
    \ actions\n    return value;\n}\n```\n\n# File Input and Output\n\nThis is the\
    \ last topic that we need to talk about before we get to the monolithic concept\
    \ that is object-oriented programming. File input and output is an essential part\
    \ of programming that will almost certainly be demanded of you at some point in\
    \ your programming career. It’s not terribly difficult, and most file input and\
    \ output operations will follow the similar line of logic.\n\nFirst, you open\
    \ the file. Opening the file means either creating it if you’re writing or reading\
    \ it if you’re appending or reading. In the latter cases, you will normally have\
    \ to have some sort of exception set up to catch if the file doesn’t exist. Otherwise,\
    \ your program will simply crash.\n\nThen, you modify the file. Reading and writing\
    \ files are self-explanatory. You either take in data, write to the file, or both.\
    \ You can also append to a file. This is where you go to the final point in a\
    \ file and add data to the end of it.\n\nAfterward, you close the file. Closing\
    \ files is where you close the stream between the program and the file. This ensures\
    \ that no corruption or data leaks occur. There is no point to keep resources\
    \ open if you aren’t using them.\n\nThese are all simple operations done with\
    \ methods which are relative to the given programming languages you’ll be using.\
    \ We will go into more detail on them in the programming language specific chapters.\n\
    \n# Object-Oriented Programming\n\nObject-oriented programming is not a very difficult\
    \ concept. However, it is an important concept, and it marks an important milestone\
    \ in your ability as a programmer because you go from writing simple programs\
    \ without a great degree of nuance to far more detached programs that can scale\
    \ to much greater sizes.\n\nThere are a few different aspects to object-oriented\
    \ programming. The first is **modularity**. Modularity is the idea that things\
    \ should be able to be reused over and over in different contexts, and you should\
    \ be able to detach and replace parts without breaking the entire system.\n\n\
    There is also **abstraction**. Abstraction is the idea of detachment; it aims\
    \ to make the programmer’s life easier by keeping them from doing any heavy lifting\
    \ and using simple terms to refer to things within the language and within core\
    \ classes. The philosophy, carried out, will lead to very readable code that is\
    \ very easy to work with as well. Abstraction refers also to the idea that the\
    \ programmer should be shielded from having to do any low-level operations, like\
    \ directly handling the computer’s memory.\n\nThen, there is **polymorphism**.\
    \ Polymorphism is the idea that an abstract operation can be done with different\
    \ value types.\n\nIn addition to polymorphism is **inheritance**. Inheritance\
    \ is the idea that something should be able to build upon the qualities of another\
    \ unit to form itself.\n\nLastly, there is **encapsulation**. Encapsulation is\
    \ the idea that things should be neatly tucked together under one roof.\n\n##\
    \ So what exactly are objects? And moreover, what is a class?\n\nA class is simply\
    \ a method of grouping together different values and functions under one title.\
    \ This lets you create new instances of that specific class, each with unique\
    \ versions of the class' variables and functions. However, they also share core\
    \ functions and variables. For instance, if I were to create a class called `dog`,\
    \ I could make new instances of `dog` called `corgi`, `yorkie`, and so forth.\
    \ But if `dog` had a function defined as `bark`, then all the instances of `dog`\
    \ would use the same `bark` function. If the `dog` class had `numberOfLegs` defined\
    \ as `4`, then all dogs would have that as their value for `numberOfLegs`.\n\n\
    When one says object, they are simply referring to an instance of a class. For\
    \ example, all the instances of `dog` - `corgi`, `yorkie`, etc. - would all be\
    \ objects.\n\nObject-oriented programming refers, broadly, to languages which\
    \ are geared towards using objects regularly. Of the three programming languages\
    \ in this book, Java is the one that is primarily object-oriented; however, object-oriented\
    \ programming is so popular that the methodology has become insidiously ingrained\
    \ in other forms of programming as well. Therefore, it’s important that you know\
    \ the core terms and practices. Object-oriented programming goes a little beyond\
    \ the scope of this book, but both languages that we study in this book - as well\
    \ as most modern languages, for that matter - will make use of object-oriented\
    \ terms and structures, so it’s important you know what it is.\n\n## 10. Package\
    \ Management\n"
  raw: 'Methods allow you to add a layer to your programming called modularity. We’ll
    be discussing this in a more in-depth way in the section which follows this one,
    but modularity is essentially the ability of something to be broken down and reused
    over and over. Methods allow you to add a layer of modularity to your program
    because they let you reuse a certain chunk of code over and over. They also allow
    you to detach different parts of your code so that the code is more readable and
    manageable.


    Another perk of modular programming is that it allows you to change one part of
    the code and have it change throughout without requiring you to go through and
    refactor what could amount to hundreds of lines of code in big programs. This
    is a huge difference and will save you a lot of pain and frustration and time
    spent debugging in the future.


    So what are methods exactly? Well, to understand them better, it might be better
    to use their other name for a minute: functions. (Functions and methods are functionally
    the same thing; method is the name used in more modern languages, usually, where
    function is preferred in languages like C and C++ - other than the name, they
    are the same exact thing)


    This is the second reference to high school math classes that we’ve had so far,
    and it’s equally relevant to the last one. Remember back in your high school algebra
    classes where you’d have a function like f(x) = 3x + 4 and you would plug in the
    given x value? For example, if f(x) were f(3), then you would plug three into
    the equation?


    In an abstract and very basic way, this works in an extremely similar manner to
    the way that functions do in programming. In the function f(x), x is what is called
    the argument. You feed something to the function. The function itself is just
    the name of the entire statement - the term 3x + 4 can be referred to as the action
    of the function. The action can perform operations upon the arguments of the function.
    The result is what the function returns. The end value given above of f(3) = 3(3)
    + 4 would be 13\. The return, therefore, after all operations are finished and
    the action has been carried out, is the return value of the function. Since f(x)
    = 3x + 4, the return value of f(x) with the argument 3 is f(3) = 13.


    In programming, this can change just a little bit. For example, a function doesn’t
    have to take any arguments at all. This is also technically true in mathematics,
    where function f(x) could simply be 14 + 4\. All values of x would be 14 + 4.
    If a function doesn’t have arguments, then whatever you define as the action will
    always take place in the same way. This is greater if you need to run the same
    bit of code at various times, like so:


    function bark() {


    print “bark!”


    }


    bark();


    Anytime that the function bark is called, then it will print out bark. Why is
    something like this useful? Imagine a code chunk where you must print out bark
    multiple times - it’s hard, but this is a tutorial book so just try, some books
    certainly have stranger examples. If you decided you wanted it to instead say
    “barkbark!” instead of “bark!”, you could just change your one line of code in
    your function instead of going to every line in your program that says “print
    ‘bark!’” and changing it.


    Methods are relatively simple in what they’re intended to do and aren’t terribly
    difficult to understand. Here is the pseudocode for a method:


    method(arguments) {


    // actions


    return value;


    }


    File Input and Output


    This is the last topic that we need to talk about before we get to the monolithic
    concept that is object-oriented programming. File input and output is an essential
    part of programming that will almost certainly be demanded of you at some point
    in your programming career. It’s not terribly difficult, and most file input and
    output operations will follow the similar line of logic.


    First, you open the file. Opening the file means either creating it if you’re
    writing or reading it if you’re appending or reading. In the latter cases, you
    will normally have to have some sort of exception set up to catch if the file
    doesn’t exist. Otherwise, your program will simply crash.


    Then, you modify the file. Reading and writing files are self-explanatory. You
    either take in data, write to the file, or both. You can also append to a file.
    This is where you go to the final point in a file and add data to the end of it.


    Afterward, you close the file. Closing files is where you close the stream between
    the program and the file. This ensures that no corruption or data leaks occur.
    There is no point to keep resources open if you aren’t using them.


    These are all simple operations done with methods which are relative to the given
    programming languages you’ll be using. We will go into more detail on them in
    the programming language specific chapters.


    Object-Oriented Programming


    Object-oriented programming is not a very difficult concept. However, it is an
    important concept, and it marks an important milestone in your ability as a programmer
    because you go from writing simple programs without a great degree of nuance to
    far more detached programs that can scale to much greater sizes.


    There are a few different aspects to object-oriented programming. The first is
    modularity. Modularity is the idea that things should be able to be reused over
    and over in different contexts, and you should be able to detach and replace parts
    without breaking the entire system.


    There is also abstraction. Abstraction is the idea of detachment; it aims to make
    the programmer’s life easier by keeping them from doing any heavy lifting and
    using simple terms to refer to things within the language and within core classes.
    The philosophy, carried out, will lead to very readable code that is very easy
    to work with as well. Abstraction refers also to the idea that the programmer
    should be shielded from having to do any low-level operations, like directly handling
    the computer’s memory.


    Then, there is polymorphism. Polymorphism is the idea that an abstract operation
    can be done with different value types.


    In addition to polymorphism is inheritance. Inheritance is the idea that something
    should be able to build upon the qualities of another unit to form itself.


    Lastly, there is encapsulation. Encapsulation is the idea that things should be
    neatly tucked together under one roof.


    So what exactly are objects? And moreover, what is a class?


    A class is simply a method of grouping together different values and functions
    under one title. This lets you create new instances of that specific class, each
    with unique versions of the class’ variables and functions. However, they also
    share core functions and variables. For instance, if I were to create a class
    called dog, I could make new instances of dog called corgi, yorkie, and so forth.
    But if dog had a function defined as bark, then all the instances of dog would
    use the same bark function. If the dog class had numberOfLegs defined as 4, then
    all dogs would have that as their value for numberOfLegs.


    When one says object, they are simply referring to an instance of a class. For
    example, all the instances of dog - corgi, yorkie, etc. - would all be objects.


    Object-oriented programming refers, broadly, to languages which are geared towards
    using objects regularly. Of the three programming languages in this book, Java
    is the one that is primarily object-oriented; however, object-oriented programming
    is so popular that the methodology has become insidiously ingrained in other forms
    of programming as well. Therefore, it’s important that you know the core terms
    and practices.  Object-oriented programming goes a little beyond the scope of
    this book, but both languages that we study in this book - as well as most modern
    languages, for that matter - will make use of object-oriented terms and structures,
    so it’s important you know what it is.


    10.  Package Management'
