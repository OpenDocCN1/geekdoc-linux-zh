  trans: "\n\n在本章中，我们将学习如何在 Linux 系统中定位日志，并对其进行解释，以用于系统管理和故障排除。我们将描述 Linux 系统中 `syslog`\
    \ 的基本架构，并学习维护时区配置的同步性和准确性，以确保系统日志的时间戳是正确的。\n\n## 系统日志架构\n\n在本节中，我们将学习 Red Hat\
    \ Enterprise Linux 7 系统中系统日志的架构。\n\n### 系统日志\n\n系统中运行的进程和操作系统内核所产生的事件都需要被记录。这些日志将有助于系统审计和解决系统中面临的问题。按照惯例，所有基于\
    \ Linux 的系统的日志都存储在 `/var/log` 目录路径下。\n\nRed Hat Enterprise Linux 7 默认构建了一个用于标准日志的系统。该日志系统被许多程序使用。有两个服务\
    \ `systemd-journald` 和 `rsyslog`，它们分别负责处理 Red Hat Enterprise Linux 7 中的日志记录。\n\
    \n`systemd-journald` 收集并存储一系列进程的日志，列出如下：\n\n* 内核\n* 启动过程的早期阶段\n* Syslog\n* 各种守护进程在运行状态标准输出和错误\n\
    \n所有这些活动都以结构化模式记录。因此，所有这些事件都记录在一个集中管理的数据库中。所有与 `syslog` 相关的消息也会由 `systemd-journald`\
    \ 转发到 `rsyslog` 以进一步处理。随后，`rsyslog` 会根据设施（facility）或类型以及优先级对消息进行排序，然后将其写入 `/var/log`\
    \ 目录下的持久化文件中。\n\n让我们根据系统和服务，逐查看存储在 `/var/log` 中的所有类型的日志。\n\n| 日志文件 | 用途 |\n| :---\
    \ | :--- |\n| `/var/log/messages` | 大多数 syslog 消息都存储在此文件中，但与邮件处理、认证、cron 任务和调试错误相关的消息除外\
    \ |\n| `/var/log/secure` | 与认证和安全相关的错误存储在此文件中 |\n| `/var/log/maillog` | 邮件服务器相关的日志存储在此文件中\
    \ |\n| `/var/log/cron` | 定期执行的任务被称为 cron。相关日志存储在此文件中 |\n| `/var/log/boot.log`\
    \ | 与启动相关的消息存储在此处 |\n\n## Syslog 文件审查\n\n在本节中，我们将学习如何审查系统日志，这可以帮助系统管理员排除系统相关问题。\n\
    \n### Syslog 文件\n\nsyslog 协议被系统中的许多程序用于记录其事件。日志消息通过两点分类：\n\n* 设施（Facility），即消息类型\n\
    * 优先级（Priority），即消息的严重程度\n\n让我们逐一概述这些优先级。\n\n| 代码 | 优先级 | 严重程度 |\n| :--- | :---\
    \ | :--- |\n| 0 | emerg | 系统状态不可用 |\n| 1 | alert | 需要采取立即行动 |\n| 2 | crit | 情况严重\
    \ |\n| 3 | err | 情况非紧急但存在错误 |\n| 4 | warning | 存在警告情况 |\n| 5 | notice | 事件正常但重要\
    \ |\n| 6 | info | 存在信息性事件 |\n| 7 | debug | 消息处于调试级别 |\n\n`rsyslog` 根据消息的优先级和类型来决定处理这些日志消息的方法。这已在\
    \ `/etc/rsyslog.conf` 文件以及 `/etc/rsyslog.d` 中的其他 `.conf` 文件中配置好。作为系统管理员，你可以覆盖此默认配置并自定义\
    \ `rsyslog` 文件的方式，以便根据你的需求处理这些日志消息。被 `rsyslog` 服务处理的消息可能会出现在许多不同的日志文件中。你可以通过将严重性字段更改为\
    \ `none` 来防止这种情况，这样指向此服务的消息就不会附加到指定的日志文件中。\n\n### 日志轮转\n\nRed Hat Enterprise Linux\
    \ 7 和其他 Linux 变体中设有 `logrotate` 工具，以便日志文件不会堆积在 `/var/log` 文件系统中并耗尽磁盘空间。日志文件在轮转时会加上轮转日期。例如，如果一个名为\
    \ `/var/log/message` 的旧文件在 2016 年 10 月 23 日进行了轮转，它将变为 `/var/log/messages-20161023`。旧日志文件轮转后会创建一个新的日志文件并通知相关服务。旧日志文件通常在几天后丢弃，默认为四周。这样做是为了释放磁盘空间。有一个\
    \ `cron` 任务用于轮转日志文件。日志文件每周轮转一次，但可能根据日志文件的大小而异，执行得更快或更慢。\n\n### Syslog 条目分析\n\n\
    由 `rsyslog` 程序记录的系统日志最旧的日志消息位于文件顶部，最新的消息位于文件末尾。使用一种标准格式来维护 `rsyslog` 记录的日志条目。让我们查看\
    \ `/var/log/secure` 文件的格式。\n\n```\nFeb 12 11:30:45localhostsshd [1432] Failed\
    \ password for user from 172.25.0.11 port 59344 ssh2\n```\n\n* 第一列显示日志条目的的时间戳\n\
    * 第二列显示生成日志消息的主机\n* 第三列显示记录事件的程序或进程\n* 最后一列显示发送的消息\n\n### 使用 tail 命令监控日志文件\n\n\
    系统管理员的常见做法是重现问题，以便实时生成针对该问题的错误日志。`tail -f /path/to/file` 命令可监控实时生成的日志。该命令会显示日志文件的最后\
    \ 10 行，同时继续打印实时生成的新错误日志。例如，如果你想查看登录失败尝试的实时日志，可以使用以下 `tail` 命令，这将帮助你查看实时日志。\n\n\
    ```\n[root@desktop ~] # tail -f /var/log/secure\n…\n\nFeb 12 11:30:45localhostsshd\
    \ [1432] Failed password for user from 172.25.0.11 port 59344 ssh2\n```\n\n###\
    \ 使用 logger 发送 syslog 消息\n\n你可以使用 `logger` 命令向 `rsyslog` 服务发送消息。当你对 `rsyslog`\
    \ 配置文件进行了某些更改并想测试它时，该命令非常有用。你可以执行以下命令，它将发送一条记录在 `/var/log/boot.log` 中的消息：\n\n\
    ```\n[root@desktop ~] # logger -p local7.notice “Log entry created”\n```\n\n##\
    \ 审查 Systemd Journal \n\n在本节中，我们将通过分析 systemd journal 中的日志来审查系统状态并排除问题。\n\nsystemd\
    \ journal 使用结构二进制文件记录数据。数据中包含了有关日志事件的额外信息。对于 syslog 事件，这包含了原始消息的严重性和优先级。\n\n当你以\
    \ root 用户运行 `journalctl` 时，将显示完整的系统日志，从文件中最旧的日志条目开始。\n\n优先级为 `notice` 或 `warning`\
    \ 的消息会被 `journalctl` 命令以**粗体**显示。高优先级的消息将以红色显示。\n\n成功使用 `journalctl` 命令进行故障排除和审计的方法是限制命令的输出，使其仅显示相关输出。\n\
    \n让我们查看用于限制 `journalctl` 命令输出以仅显示所需内容的各种方法。\n\n你可以使用以下命令显示最后 5 个 journal 条目。\n\
    \n```\n[root@server ~] # journalctl -n 5\n```\n\n你可以使用优先级标准来过滤 `journalctl` 输出，以帮助排除问题。你可以配合\
    \ `journalctl` 命令使用 `-p` 选项指定一个或多个优先级级别，显示高层级的条目。`journalctl` 识别的优先级级别包括 `info`、`debug`、`notice`、`err`、`warning`、`crit`、`emerg`\
    \ 和 `alert`。\n\n"
- fmt: "\nYou can use the following command to achieve the above-mentioned output.\n\
    \n```bash\n[root@server ~] # journalctl -p err\n```\n\nThere is command for `journalctl`\
    \ like `tail -f`, which is `journalctl -f`. This will again list the last 10 lines\
    \ of journal entry and then keep printing log entries in real time. \n\n```bash\n\
    [root@server ~] # journalctl -f\n```\n\nYou can also use some other filters to\
    \ filter out `journalctl` entries as per your requirement. You can pass the following\
    \ options of `--since` and `--until` to filters out journal entries as per timestamps.\
    \ You need to then pass the arguments such as today, yesterday or an actual timestamp\
    \ in the format `YYYY-MM-DD hh:mm: ss`.\n\nLet us look at a few examples below.\n\
    \n```bash\n[root@server ~] # journalctl --since today\n\n[root@server ~] # journalctl\
    \ --since “2015-04-23 20:30:00” --until “2015-05-23 20:30:00”\n```\n\nThere are\
    \ more fields attached to the log entries, which will be visible only if you use\
    \ the verbose option by using `verbose` with the `journalctl` command. \n\n```bash\n\
    [root@server ~] # journalctl -o verbose\n```\n\nThis will print out detailed `journalctl`\
    \ entries. The following keywords are important for you to know as a system admin:\n\
    \n- `_COMM`, which is the name of the command\n- `_EXE` show the executable path\
    \ for the process\n- `_PID` will show the PID of the process\n- `_UID` will show\
    \ the user associated with the process\n- `_SYSTEMD_UNIT` show the systemd unit,\
    \ which started the process\n\nYou can combine one or more of these options to\
    \ get an output from the `journalctl` command as per your requirement. Let us\
    \ have a look at the example below, which will print journal entries that contain\
    \ the systemd unit file `sshd.service` bearing the PID `1183\\.`.\n\n```bash\n\
    [root server ~] # journals _SYSTEMD_UNIT=sshd.service _PID=1183\n```\n\n## System\
    \ Journal Preservation\n\nIn this section, we will learn how to make changes to\
    \ the `systemd-journald` configuration such that the journal is stored on the\
    \ disk instead of memory.\n\n### Permanently storing the system journal\n\nThe\
    \ system journal is kept at `/run/log/journal` by default, which means that when\
    \ the system reboots, the entries are cleared. The journal is a new implementation\
    \ in Red Hat Enterprise Linux 7\\.\n\nWe can be sure that if we create a directory\
    \ as `/var/log/journal`, the journal entries can be logged there instead. This\
    \ will give us an advantage that historical data will be available even after\
    \ a reboot. However, even though we will have a journal that is persistent, we\
    \ cannot have any data that can be kept forever. There is a log rotation, which\
    \ is triggered by a journal on a monthly basis. Also, by default, the journal\
    \ is not allowed to have a dusk accumulation of more than 10% of the file system\
    \ it occupies, or even leave less than 15% of the file system free. You can change\
    \ these values as per your needs in the configuration file at `/etc/systemd/journald.conf`\
    \ and one the process for `systemd-journald` starts, the new values will come\
    \ into effect and will be logged. \n\nAs discussed previously, the entries of\
    \ the journal can be made permanent by creating a directory at `/var/log/journal`.\n\
    \n```bash\n[root@server ~]# mkdir /var/log/journal \n```\n\nYou will need to make\
    \ sure that the owner of the `/var/log/journal` directory is `root` and the group\
    \ owner is `systemd-journal`, and the directory permission is set to `2755`.\n\
    \n```bash\n[root@server ~]# chown root:systemd-journal /var/log/journal\n\n[root@server\
    \ ~]# chmod 2755 /var/log/journal\n```\n\nFor this to come into effect, you will\
    \ need to reboot the system or as a root user, send a special signal `USR1` to\
    \ the `systemd-journald` process.\n\n```bash\n[root@server ~]# killall -USR1 systemd-journald\n\
    ```\n\nThis will make the systemd journal entries permanent even through system\
    \ reboots, you can now use the command `journalctl -b` to show minimal output\
    \ as per the latest boot. \n\n```bash\n[root@server ~]# journalctl -b\n```\n\n\
    If you are investigating an issue related to system crash, you will need to filter\
    \ out the journal output to show entries only before the system crash happened.\
    \ That will ideally be the last reboot before the system crash. In such cases,\
    \ you can combine the `-b` option with a negative number, which will indicate\
    \ how many reboots to go back to limit the output. For example, to show outputs\
    \ till the previous boot, you can use `journalctl -b -1`.\n\n## Maintaining time\
    \ accuracy\n\nIn this section, we will learn how to make sure that the system\
    \ time is accurate so that all the event logs that are logged in the log files\
    \ show accurate timestamps. \n\n### Setting the local time zone and clock\n\n\
    If you want to analyze logs across multiple systems, it is important that the\
    \ clock on all those systems is synchronized. The systems can fetch the correct\
    \ time from the Internet using the Network Time Protocol `NTP`. There are publicly\
    \ available NTP projects on the Internet like the Network pool Project, which\
    \ will allow a system to fetch the correct time. The other option is to maintain\
    \ a clock made up of high quality hardware to serve time to all the local systems.\
    \ \n\nTo view the current settings for date and time on a Linux system, you can\
    \ use the `timedatectl` command. This command will display information such as\
    \ the current time, the NTP synchronization settings and the time zone. \n\n```bash\n\
    [root@server ~]# timedatectl\n```\n\nThe Red Hat Enterprise Linux 7 maintains\
    \ a database with known time zones. It can be listed using the following command.\n\
    \n```bash\n[root@server ~]# timedatectl list-timezones\n```\n\nThe names of time\
    \ zones are based on `zoneinfo` database that IANA maintains. The naming convention\
    \ of time zones is based on the ocean or continent. This is followed by the largest\
    \ city in that time zone or region. For example, if we look at the Mountain Time\
    \ in the USA, it is represented as “America/Denver”. \n\nIt is critical to select\
    \ the correct name of the city because sometimes even regions within the same\
    \ time zone may maintain different settings for daylight savings. For example,\
    \ the US mountain state of Arizona does not have any implementation of daylight\
    \ savings and therefore falls under the time zone of “America/Phoenix”. \n\nThe\
    \ `tzselect` command is used to identify zone info time zone names if they are\
    \ correct or not. The user will get question prompts about their current location\
    \ and mostly gives the output for the correct time zone. While suggesting the\
    \ time zone, it will not automatically make any changes to the current time on\
    \ the system. Once you know, which timezone, you should be using, you can use\
    \ the following command to display the same. \n\n```bash\n[root@server ~]# timedatectl\
    \ set-timezone America/Phoenix\n\n[root@server ~]# timedatectl\n```\n\nIf you\
    \ wish to change the current date and time for your system, you can use the `set-time`\
    \ option with the `timedatectl` command. The time and date can be specified in\
    \ the format “YYYY-MM-DD hh:mm:ss”. If you just want to set the time, you can\
    \ omit the date parameters. \n\n```bash\n[root@server ~]# timedatectl set-time\
    \ 9:00:00\n\n[root@server ~]# timedatectl\n```\n\nYou can use the automatic time\
    \ synchronization for Network Time Protocol using the `set-ntp` option with the\
    \ `timedatectl` command. The argument to be passed along is `true` or `false`,\
    \ which will turn the feature on or off.\n\n```bash\n[root@server ~]# timedatectl\
    \ set-ntp true\n```\n\n## The Chronyd Service\n\nThe local hardware clock of the\
    \ system is usually inaccurate. The `chronyd` service is used to keep the local\
    \ clock on track by synchronizing it with the configured Network Time Protocol\
    \ NTP servers. If the network is not available it synchronizes the local clock\
    \ to the RTC clock drift that is calculated and recorded in the `driftfile`, which\
    \ is maintained in the configuration file at `/etc/chrony.conf`.\n\nThe default\
    \ behavior of the `chronyd` service is to use the clocks from the NTP network\
    \ pool project to synchronize the time and no additional configuration is needed.\
    \ It is advisable to change the NTP servers if your system happens to be on an\
    \ isolated network.\n"
