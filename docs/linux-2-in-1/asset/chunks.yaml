    一旦你启动并运行，桌面版本可能看起来如下。如你所见，GUI 提供了一个让 Windows 和 MAC 用户非常熟悉的界面。你将看到图标、任务栏、工具，并了解如何通过切换窗口来实现多任务处理。


    ## 服务器版本


    同样以 Ubuntu 作为安装示例，你将首先从网站 [www.Ubuntu.com](http://www.ubuntu.com) 获取并下载 `.ISO`
    文件。根据任务选择所需的版本（桌面版、笔记本版、服务器版、云版等），并在检查电脑设置后刻录你需要的镜像。请确保硬件要求是兼容的。


    如果你想要服务器，可能需要选择更大的位宽。将其下载到光盘或 USB 盘中，再次强调，优选使用 live 环境（即时环境），然后从该设备而不是硬盘重启。


    由于文件较大且受网络速度影响，可能需要一些时间。请耐心等待。它也不会占用太多空间。系统的新旧也无所谓。在大多数情况下，你可以追溯到 5-6 年前的旧系统。记住，服务器版本是精简版的，没有图形界面。


    Ubuntu 安装程序启动菜单屏幕 (www.pendrivelinux.com)


    按照任何提示操作。你会看到一个要求名称/主机名的提示，你可以直接称其为 Server，除非你想给它起个绰号。对于指南中提供的任何设置，请回答 yes，但在你需要提供特定响应的某些选择题除外。某些问题对于初学者来说可能过于技术。建议只留在你胜任的操作范围内。


    当你执行重启并进入设置提示时，你会立即注意到 `Shell`（终端）。记住，服务器版意味着你在遵循完安装指南后，必须具备命令的知识。文件系统层级标准 (`FHS`)
    将帮助你通过命令行导航 Linux 的位置并使用相关命令。


    在安装过程中，你按照提示添加用户名、密码和其他设置功能。加密选项可以保护你主目录下的文件，但在你获得更多关于 Linux 的知识之前，建议现在不要这样做。更新频率也不需要那么高，但你之后可以进行定期的手动更新，那样就可以了。与
    Windows 不同，你不需要频繁的自动更新。


    你还将选择希望它成为什么类型的服务器。如果你不确定，应该在 Google 上搜索一下。例如，网站或文件存储需要哪种类型的服务器？一旦选定类型，它将安装你需要的，且仅安装你需要的。再次强调，这是一个精简版本，你将有机会根据你的选择，准确地选择你需要的内容。


    Ubuntu 服务器版示例 ([www.pwrusr.com](http://www.pwrusr.com))


    ## 服务器双启动


    也可以对服务器版本进行分区。然而，这通常比桌面版的处理过程要复杂得多。建议在决定分区服务器以与其他操作系统共享空间之前，真的先做一些研究。这可能不是初学者现在应该深入研究的内容。但话说回来，如果你不探索，就无法学习。


    ## 为 MariaDB 添加数据库


    在我写的其他其他关于 Linux 的书中，我曾让用户使用名为 `phpmyadmin` 的 Web 工具来添加用户和数据库。在本书中，我想尝试不同的方法，通过命令行界面完成。


    随着我们开始安装 WordPress，它需要一个数据库来存储信息。在接下来的步骤中，我们将创建该数据库以及一个连接该数据库的用户。


    开始，我们必须使用以下命令登录 MariaDB 的 root 账户：


    ```

    sudo mysql –u root –p

    ```


    正如你可能猜到的，`u` 标记代表用户，`p` 代表密码。


    系统会提示你输入 MariaDB 的 root 密码。这是在你运行安全安装的命令时设置的。


    一旦登录成功，下一步是创建数据库。我们将此数据库命名为 `wordpress`。


    ```

    CREATE DATABASE wordpress;

    ```


    请注意，这里的大小写是重要的，就像其他命令一样。此外，所有的 MySQL 和 MariaSQL 语句必须以分号结尾。


    这很简单！现在我们需要创建一个新用户账户，该账户只能操作我们创建的数据库。这可以实现良好的安全性并对数据库权限进行更好的控制。


    对我来说，我将新用户账户命名为 `wpuser`。在下面的命令中，你可以根据需要使用不同的名称，并将 `password` 改为安全的密码。在连接 WordPress
    到数据库时我们需要这个密码。


    ```

    CREATE USER wpuser@localhost IDENTIFIED BY ‘password’;

    ```


    现在你有了一个数据库和一个用户账户，但该账户尚未访问 wordpress 数据库。我们需要使用以下命令授予该用户访问 wordpress 数据库的权限。


    ```

    GRANT ALL PRIVLEGES ON wordpress.* TO wpuser@localhost IDENTIFIED BY ‘password’;

    ```


    我们的用户现在拥有了数据库的访问权限，但我们需要执行名为 `flush` 的操作以便让 MySQL/MariaDB 知道我们所做的权限更改。使用以下命令：


    ```

    FLUSH PRIVLEGES;

    ```


    现在执行完这些命令后，可以使用以下命令退出 MySQL/MariaDB：


    ```

    exit

    ```


    简单对吧？关于使用 MySQL 和 MariaDB 还有很多需要学习的内容。我建议你继续扩展这些主题的知识，因为它们是非常紧缺的技能。


    ## 8. 安装和设置 Linux


    从当前的操作系统中安装 Linux 有几种方法。你可以选择从 live CD 或 USB 驱动器下载 Linux，然后从你的系统里启动 Linux 以进行安装。对于初学者来说，这可能会有点困惑，但它不需要大量的技术知识，一旦你通过了第一次，如果决定这样做，安装另一个系统其实非常简单。对于本书，我们将以在当前运行
    Windows 的电脑上安装 Linux 为例。


    ### 从 Live CD 安装


    要从 live CD 安装 Linux，你首先需要下载相应的文件。在执行操作之前，你需要选择你的发行版并访问主页。从那里，你可以进入下载页面找到适合你系统的文件。每个系统通常有几个不同的文件：有些针对笔记本电脑优化，另一些针对桌面级优化，并提供
    32 位和 64 位的版本。定位到系统所需的版本后，下载 `.ISO` 文件。


    一旦文件下载到电脑上，就将其刻录到空白 CD 中。你可以下载程序来实现，但通常你的操作系统应该自带一些程序，让这一步变得相对简单。


    文件刻录到 CD 后，重启电脑。在操作系统启动之前，你会看到进入启动菜单的选项。在菜单中，告诉电脑从 CD 启动，保存选项并再次重启。如果你不去哪里选择这些选项，请咨询你的操作系统手册并查找启动选项。这应该为你提供设置启动选项的步骤说明。


    然后你将面临安装 Linux 或尝试用用的选项。强烈建议在安装 Linux 之前进行试运行，以确保你对桌面有一个良好的感受，并且它符合你的设想。一旦完成试运行，选择安装选项非常简单。


    ### 从 Live USB 安装


