    我们可以使用 `touch` 命令来修改文件的访问和修改时间。除非你正在测试一个依赖这些访问和修改时间的系统，否则你通常不需要这么做。基本上，这里发生的情况——这也是一个你可以充分利用的点——是：当你
    `touch` 一个不存在的文件时，系统会为你创建它。


    在 Linux 中有很多事情并不是直接完成的，但如果你学习了某些命令的行为，并学会如何创造性地使用它们，你就能实现你的目标。我们讨论过命令行可以为你提供一系列构建块，你可以以任何想要的方式使用这些构建块，但只有当你完全理解它们的工作原理而不仅仅是为什么时，你才能变得高效。


    现在，我们只有一个空文件，但很快，我们将学习如何向文件中写入数据，以及如何提取数据。


    ## 复制文件或目录


    有几个原因导致你可能想要复制目录或文件——也许你对对某些内容进行修改，所以你会创建一个原始文件的副本。这样，如果出现问题，你就可以轻松恢复原来的状态。为了实现这一点，我们使用
    `cp` 命令，它的意思是 copy（复制）。


    ```bash

    cp [options] <source> <destination>

    ```


    该命令有几个可用选项，我们将在稍后讨论其中一个。不过，首先查看 `cp` 的 man 页（帮助文档），看看还有哪些可用选项。


    ```bashls

    example1 foo

    cp example1 sammy

    ls

    sammy example1 foo

    ```


    你发现源路径和目标都是路径了吗？这意味着我们可以使用绝对路径和相对路径来引用它们。请看这几个示例：


    ```bash

    cp /home/cleopatra/linuxpractice/example2 example3

    cp example2./../backups

    cp example2./../backups/example4

    cp /home/cleopatra/linuxpractice/example2 /otherdir/foo/example5

    ```


    所以，当使用 `cp` 时，目标可以是指向目录的路径，也可以是指向文件的路径。如果指向一个文件（如上面的第一、第三和第四行示例所示），将创建一个源文件的副本，并且它将具有目标路径中指定的文件名。如果指向一个目录，那么文件将被复制到该目录，并保持与源文件相同的名称。


    默认情况下，`cp` 只能复制文件，因此如果你想复制目录，则需要使用 `-r` 选项，它的意思是 recursive（递归）。递归意味着进入目录，查看其中包含的文件和目录。要查看子目录，你需要在每个目录内部执行的操作。


    ```bash

    ls

    sammy example1 foo

    cp foo foo2

    cp: omitting directory ''foo''

    cp -r foo foo2

    ls

    sammy example1 foo foo2

    ```


    在这个示例中，我们正从 `foo` 目录将所有文件和目录复制到 `foo2`。


    ## 移动文件或目录


    使用 `mv` 命令可以非常简单地移动文件，它的意思是 move（移动）。它的工作方式与 `cp` 非常相似，不同之处在于移动目录时不需要使用 `-r`。


    ```bash

    mv [options] <source> <destination>

    ```


    ```bash

    ls

    sammy example1 foo foo2

    mkdir backups

    mv foo2 backups/foo3

    mv sammy backups/

    ls

    backups example1 foo

    ```


    让我们详细查看一下：


    - 第 3 行：创建了一个名为 `backups` 的新目录。

    - 第 4 行：名为 `foo2` 的目录被移动到了名为 `backups` 的目录中，并重命名为 `foo3`。

    - 第 7 行：名为 `sammy` 的文件被移动到了 `backups` 目录中。因为我们没有提供目标名称，因为它保留了原有的名称。


    注意，我们再次对源和目标使用了路径，这些都是绝对路径或相对路径。


    ## 重命名文件和目录


    就像我们使用 `touch` 命令那样，`mv` 的行为也可以创造性地使用以产生不同的结果。通常，我们使用 `mv` 将文件或目录移动到新目录。这种移动的一部分包括对该文件或目录重命名。如果我们指定目标和源是同一个目录但命名不同，那就是对
    `mv` 重命名目录或文件的创造性用法。


    ```bash

    ls

    backups example1 foo

    mv foo foo3

    ls

    backups example1 foo3

    cd.

    mkdir linuxpractice/testdir

    mv linuxpractice/testdir /home/cleopatra/linuxpractice/frieda

    ls linuxpractice

    backups example1 foo3 frieda

    ```


    让我们深入研究一下：


    - 第 3 行：名为 `foo` 的文件被赋予了新名称 `foo3`。两个路径都是相对路径。

    - 第 6 行：移动了父目录。我们这样做是为了在下一行中，展示如何在包含它们的目录外部对这些文件或目录运行命令。

    - 第 8 行：名为 `testdir` 的目录被重命名为 `frieda`。对源使用了相对路径，对目标使用了绝对路径。


    ## 删除文件


    正如我们在 `rmdir` 中看到的那样，当你删除文件时，是无法撤销的，所以操作时要小心。删除或删除文件的命令是 `rm`，它的意思是 remove（移除）。


    ```bash

    rm [options] <file>

    ```


    ```bash

    ls

    backups example1 foo3 frieda

    rm example1

    ls

    backups foo3 frieda

    ```


    ## 删除非空目录


    `rm` 命令也可以通过几个不同的选项进行修改。同样，查看 `rm` man 页了解可以做什么，但最有用的选项之一是 `-r`。像 `cp` 一样，它的意思是递归，我们配合
    `rm` 使用它来删除指定的目录及其内部的所有内容。


    ```bash

    ls

    backups foo3 frieda

    rmdir backups

    rmdir: failed to remove ''backups'': Directory not empty

    rm backups

    rm: cannot remove ''backups'': Is a directory

    rm -r backups

    ls

    foo3 frieda

    ```


    你可以配合 `-r` 使用的另一个选项是 `i`，它的意思是 interactive（交互）。这将在删除任何文件或目录之前向你确认，并提供一个改变主意并取消命令的选项。


    ## 最后的说明


    我已经说过好几次了，我会一直说：当我们在命令行引用文件或目录时，它们是路径。它们可能是绝对路径或相对路径，在大多数情况下都是如此。我不会再次提醒你这一点，我的示例也没有显示，所以请记住。


    ## 总结


    以下是你在本节中学学习的内容：


    - `Mkdir`: 意思是 Make Directory，允许我们创建新目录。

    - `Rdir`: 意思是 Remove Directory，允许我们删除目录。

    - `Touch`: 允许我们创建空文件。

    - `Cp`: 意思是 Copy，允许我们复制目录或文件。

    - `Mv`: 意思是 Move，允许我们移动或重命名文件或目录。

    - `Rm`: 意思是 Remove，允许我们删除文件。

    - 没有撤销你所做操作的操作，所以删除和移动文件目录时要小心。


    - 命令行选项：有很多选项，所以通过查看每个命令的 man 页来熟悉它们的功能以及你可以做什么。


    ## 实际操作


    你现在有了几种不同的命令可以与系统交互，所以让我们练习一下。尝试以下操作：


    - 在你的用户目录下创建一个全新的目录（这将允许你进行实验）。

    - 在目录内部创建一些文件和目录，并在每个目录内部创建更多文件和目录。

    - 现在给它们中的一些起新名字。

    - 回到用户目录，将一个文件从子目录复制到你创建的第一个目录中。

    - 将文件移动到另一个目录。

    - 重命名几个文件。

    - 同时移动并重命名文件。

    - 最后，查看用户目录下已经存在的目录。你可能有下载、文档、图片和音乐。思考一下其他可以帮助整理物品的目录，并开始设置它们。

