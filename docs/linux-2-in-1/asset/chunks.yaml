    如果我们想同时安装多个软件包，可以在命令行中如下所示列出它们。


    ```bash

    apt-get install JuliansPackage JacksPackage

    ```


    要删除一个软件包，我们使用：


    ```bash

    apt-get remove JuliansPackage

    ```


    还有其他几个可用的命令供高级使用，例如 `purge`、`source`（用于检索源代码文件）等。查看 `man apt-get` 可以获取更完整的可用命令和选项列表。


    ### apt cache


    `apt-cache` 允许对 APT 软件包缓存执行各种操作。这些操作不会操纵系统状态，但允许该功能搜索软件包并从软件包元数据生成有价值的输出。一个非常有用的命令是
    `search`，它允许使用正则表达式搜索词对 APT 软件包数据库进行搜索。


    ```bash

    apt-cache search Julian

    ```


    这使我们能够获取可能想要安装但不确定安装命令中所需名称的软件包的正确名称。上面的搜索将显示出我们的软件包 `JuliansPackage`。


    ### 其他版本的 Linux 发行版和包管理器


    重要的是，根据 Linux 发行版的不同，存在不同的替代方案，例如 `yum`、`rpm`、`dpkg`。


    ### dpkg


    `dpkg` 是用于安装、构建、删除和管理 Debian `.deb` 软件包的软件。`dpkg` 可以在命令行中使用，其行为由由操作和一个和一个参数列表组成的命令控制。


    `dpkg` 还有一个图形化前端 `aptitude`，对于倾向于这种工作方式的人来说，它是访问命令和管理软件包更用户友好的方法。由于本书是关于命令行的，我们不会介绍
    `aptitude`。


    我们只需提到几个最常用用途的常用命令，因为 Ubuntu 深度基于 Debian。


    列出系统上所有安装的软件包，请使用：


    ```bash

    dpkg -l

    ```


    要安装 deb 软件包，我们可以如下使用 `dpkg`：


    ```bash

    dpkg –i JuliansPackage.deb

    ```


    要删除 deb 软件包，我们使用以下命令。注意，我们使用的名称不包含 `.deb` 扩展名。


    ```bash

    dpkg –r JuliansPackage

    ```


    因此，有几个使用 `dpkg` 的基本命令，即使你习惯使用 Ubuntu 系统和 `apt` 命令，可能也会发现需要这样做，因为某些软件包可能仅以 `.deb`
    软件包的形式提供。


    ### Yum


    `yum`（Yellowdog Updater, Modified）是管理 Red Hat Linux RPM 软件包的主要命令行工具，它取代了下文的 `rpm`
    命令。`yum` 可用于所有的包管理任务，如获取、安装、删除和查询。我们将查看 `yum` 的两个最常见的用法。


    使用 `yum` 安装 rpm 软件包，我们使用：


    ```bash

    yum install JuliansPackage.rpm

    ```


    这将执行依赖关系检查并询问我们是否想要继续，我们需要确认。我们可以使用 `–y` 选项来避免这一点：


    ```bash

    yum –y installs JuliansPackage.rpm

    ```


    同样，为了删除软件包（首先需要确认，然后不需要确认），我们使用：


    ```bash

    yum remove JuliansPackage.rpm

    ```


    ```bash

    yum –y removes JuliansPackage.rpm

    ```


    我们可以使用以下命令将软件包更新到最新版本：


    ```bash

    yum update JuliansPackage.rpm

    ```


    这些是一些基础的命令。如果你正在使用使用 `yum` 作为包管理器的 Red Hat 系系统，请查看 `man yum`。


    ### rpm


    RPM 软件包管理器 `RPM` 可用于在使用 `rpm` 软件包格式的类 Unix 系统（特别是 Red Hat Linux）上安装软件。软件包由文件存档和特定的软件包信息（包括名称、版本和描述）组成。


    首先，必须以 root 身份执行以下命令，可以使用 `sudo` 命令或切换到 root 用户。


    要安装软件包（我们在此称之为 `JuliansPackage.rpm`），我们使用：


    ```bash

    rpm –i JuliansPackage.rpm

    ```


    要从早期版本升级它，我们使用：


    ```bash

    rpm –U JuliansPackage.rpm

    ```


    要删除已安装的软件包，我们使用：


    ```bash

    rpm –ev JuliansPackage.rpm

    ```


    通常，熟悉此命令的最佳方法是使用 `man rpm`。


    这就是对不同 Linux 发行版上各种包管理技术和命令行工具的简要介绍。我们将通过几个实用的命令行工具，完成对 Linux 命令行解释器一些简单方面的简要之旅。


    ## 14. 测试网络连通性


    有时你的网络可能不如预期工作，你需要通过测试网络连通性来排除故障。


    本节将涵盖以下命令：


    - `ping`

    - `traceroute`


    ### ping


    `ping` 命令是一个基础故障排除命令，可验证网络连通性。


    本节将涵盖以下子节：


    - 回环地址 (Loopback)

    - 默认网关 (Default Gateway)

    - IP

    - 主机名 (Hostname)


    #### Loopback


    如果你 ping` 回环地址 `127.0.0.1`，它将验证网络服务正在运行。在下面的示例中，`ping` 命令执行成功。每一行 `64 bytes from
    127.0.0.1: icmp_seq=1 ttl=64 time=0.073 ms` 都表示一次成功的 `ping`。`ping` 命令将持续直到你按下
    `Ctrl+C`。


    在下面的示例中，回环地址的 ping 是失败的，因为网络服务没有运行。


    #### Default Gateway


    在网络中，默认网关是引导出网络进入互联网的路由器或设备。如果你的系统无法与默认网关通信，那么它无法访问互联网。默认网关通常是网络中的第一个可用 IP 地址，但这不是强制要求的。例如，如果网络是
    `10.0.2.0/24`，那么默认网关将是 `10.0.2.1`。在下面的示例中，ping `10.0.2.1` 是成功的，这意味着系统可以与默认网关通信。


    如果你无法 `ping` 默认网关，并不意味着你的系统有问题，因为可能是网络的问题。


    #### IP


    如果你可以 `ping` 默认网关，下一步是 `ping` 默认网关之外的内容，最好是互联网上的东西。在下面的示例中，ping `8.8.8.8` 是成功的，这意味着一切正常，系统可以访问互联网。`ping`
    命令使用了 `-c 3` 选项，这会导致 `ping` 命令执行三次后停止，而不是持续直到按下 `Ctrl+C`。


    #### Hostname


    虽然 ping 互联网上的 IP 地址可以显示你的网络连通性是否正常，但它并没有提供全视图。要通过主机名访问网页和其他服务，需要 DNS 配置并正常工作。


    #### traceroute


    `traceroute` 命令用于追踪 IP 数据包从你的系统到另一个系统的路径。在下面的示例中，`traceroute` 命令用于追踪到 `www.somewebite.com`
    的数据包。


    ## 5.4 名称解析


    名称解析是将主机名转换为 IP 地址的过程。按照今天互联网的工作方式，我们大多数使用主机名和域名来连接网站和其他资源。然而，你的系统需要知道你想去的地方的
    IP 地址才能到达。


    - `/etc/hosts`

    - DNS


    #### /etc/hosts


    当互联网非常年轻时，你必须知道想要访问的任何站点的 IP 地址。然后创建了 hosts 文件并在互联网用户之间共享，这因为互联网上的人并不多。hosts 文件保存主机名到
    IP 地址的手动映射。随着 DNS 的出现，hosts 文件不再是必须的，但它仍然在 Linux 中作为备用名称解析方法存在。

