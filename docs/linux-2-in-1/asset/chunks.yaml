  trans: "\n\n![00042.jpeg](img/image00329.jpeg)带有图形桌面环境的系统可以通过终端模拟器在 GUI 内部获取 CLI。终端允许你打开窗口并让你与\
    \ shell 交互。根据 Linux 发行版上安装的图形桌面环境不同，你有许多终端模拟器可用，如 `gnome-terminal`、`konsole`、`rxvt`、`xterm`、`LXterminal`、`guake`、`terminator`、`tilde`、`yakuake`\
    \ 等。带有 GNOME 桌面环境的 CentOS Linux 的默认终端模拟器。要启动 Gnome terminal，按下“活动”（Activities）并点击终端图标。\n\
    \n## 命令提示符\n\n虽然你可以自定义提示符，但通常你会在提示符末尾看到 `#` 或 `$`。其中 `#` 表示用户以 `root`（管理员）用户身份登录，而\
    \ `$` 提示符表示普通用户。你可以在提示符中显示额外信息，如用户名、当前目录和服务器名称，甚至可以显示当前日期和时间。\n\n## 命令结构\n\n通常，如果你从\
    \ shell 提示符运行命令，其格式如下：\n\n`command –options <filename>`\n\n示例 \n\n`tail –f myfile`\n\
    \n然而，文件名并非用于所有命令。在某些命令中，只使用命令或命令和选项\n\n`ls –la`\n\n## bash shell 技巧\n\n无论你是在虚拟终端还是使用终端模拟器，命令格式都是相同的。以下是你可以在日常任务中使用的\
    \ bash shell 的有用功能\n\n### TAB 自动补全\n\nTAB 自动补全是 Bash shell 最实用的功能之一。在输入部分命令、目录或文件名后按下\
    \ `TAB`，它具有预测命令、目录或文件名的能力。如果只有一个匹配选项，Shell 将自动补全单词，否则它将提供所有可能的补全。例如，假设你想切换目录到\
    \ abc，你输入 `cd ab` 并按 `TAB`，系统会自动补全该单词。\n\n### Bash 历史\n\nShell 将你在 shell 中输入的命令保存在你主目录下的文件中。你可以通过输入\
    \ `history` 命令查看最后输入的命令。\n\n```bash\n$ history\n```\n\n如果你想再次执行上一个命令，可以按 `UP`\
    \ 方向键然后按 `ENTER` 键。你可以反复按 `UP` 方向键在命令历史中向回滚动。\n\n### 通配符\n\n通配符或通配字符是 shell 命令中表示一个或多个字符的符号。最常用的通配符是\
    \ \n\n* `*` 星号\n* `?` 问号\n* `[ ]` 方括号\n\n其中 \n\n### 星号 (*)\n\n代表零或多个字符\n\n示例 \n\
    \n```bash\n$ ls b*\n```\n列出所有以 b 开头的文件\n\n### 问号 (?)\n\n代表单个字符\n\n示例\n\n```bash\n\
    $ ls ?at\n```\n列出文件名第一个字母可以是任意字符的文件，如 bat、cat 或 hat \n\n### 方括号\n\n表示字符范围\n\n\
    示例\n\n```bash\nls b[1-5]\n```\n列出所有以 b 开头的文件，且第二个字符应该是从 1 到 5 的数字。它可以是 b1, b2,\
    \ b3, b4 和 b5\n\n### 检查当前 shell\n\n```bash\n# echo $SHELL\n```\n\n## 17. 归档与压缩\n\
    \n归档是将一组文件和目录收集并存储到一个文件中的过程，`Tar`、`cpio`、`zip` 和 `ar` 是执行此操作的实用程序示例。而压缩是使用数学压缩算法减小文件大小的过程。这对于互联网发送大文件非常有用。压缩工具的示例有\
    \ `gzip`、`bzip2`、`xz` 等。\n\n### GZIP\n\n通过 `gzip` 你可以压缩和解压缩单个文件。当你使用 `gzip` 命令压缩任何文件时，该文件将被扩展名为\
    \ `.gz` 文件替换，同时保持相同的权限模式、访问和修改时间。简单来说，你看不到原始文件，只有压缩后的文件。\n\n### 语法\n\n```bash\n\
    gzip filename\n```\n\n示例\n\n```bash\ngzip sysctl.conf\n```\n\n### 解压缩\n\n使用 `gunzip`\
    \ 命令解压缩文件。然而，此命令将删除压缩文件，你只会看到解压缩后的文件。\n\n### 语法\n\n```bash\ngunzip filename\n\
    ```\n\n示例\n\n```bash\ngunzip sysctl.conf.gz\n```\n\n### BZIP2\n\n`bzip` 使用名为 Burrows\
    \ Wheel block sorting 的压缩算法压缩文件。与 `gzip` 类似，它会删除原始文件并创建一个相同名称加 `.bz2` 扩展名的压缩文件。每个压缩文件都具有相同的修改日期、权限，如果可能的话，与对应的原始文件具有相同的所有者\n\
    \n### 语法\n\n```bash\nbzip2 filename\n```\n\n示例\n\n```bash\nbzip2 sysctl.conf\n\
    ```\n\n### 解压缩\n\n使用 `bunzip2` 解压缩用 `bzip2` 命令压缩的文件。默认情况下，如果存在同名文件则不会覆盖，除非你给出\
    \ `-f` 选项\n\n### 语法\n\n```bash\nbunzip2 filename\n```\n\n示例\n\n```bash\nbunzip2\
    \ sysctl.conf.bz2\n```\n\n### XZ\n\n`xz` 是 `lzma` 工具的继承者，它会自动为压缩文件添加 `.xz` 扩展名并删除原始文件。像\
    \ `bzip` 和 `gzip 一样，它将保持相同的修改日期、权限，如果可能的话，与对应的原始文件具有相同的所有者\n\n### 语法\n\n```bash\n\
    xz filename\n```\n\n示例\n\n```bash\nxz sysctl.conf\n```\n\n### 解压缩\n\n### 语法\n\n\
    ```bash\nunxz filename\n```\n\n示例\n\n```bash\nunxz sysctl.conf\n```\n\n### ZIP\n\
    \n`Zip` 是归档和压缩工具。它会自动为压缩文件添加 `.xz` 扩展名（注：原文此处可能有误，通常为.zip）并删除原始文件。像 `bzip` 和 `gzip`\
    \ 一样，它将保持相同的修改日期、权限，如果可能的话，与对应的原始文件具有相同的所有者\n\n### 语法\n\n```bash\nzip filename\n\
    ```\n\n示例\n\n```bash\nzip file.. file.conf\n```\n你也可以配合通配符使用 `zip`\n\n```bash\n\
    zip.zip s*\n```\n\n### 递归压缩文件（包含子目录）\n\n### 语法\n\n```bash\nzip -r zipfile.zip\
    \ directory\n```\n\n示例\n\n```bash\nzip -r abc.zip directory\n```\n\n### 查看压缩文件内容\n\
    \n### 语法\n\n```bash\nunzip -l zipfile.zip\n```\n\n示例\n\n```bash\nunzip -l asp.zip\n\
    ```\n\n### 解压缩\n\n使用 `unzip` 命令解压缩文件\n\n### 语法\n\n```bash\nunzip filename\n```\n\
    \n### ar\n\n表示字符范围 是不广为人知的 rar 的先身，rar 仍在使用。它仅用于归档\n\n### 语法\n\n```bash\nar -cv\
    \ archive.ar files\n```\n\n示例\n\n```bash\nar -cv archive.ar files\n```\n\n## 18.\
    \ 如何创建基础脚本\n\n正如我们在学习命令行界面时看到的，你通常是交互式地探索它的。这意味着你每次输入一个命令，以便看到每个命令的结果。\n\n在我们开始本节之前，你可以先看看这个\
    \ [gif](http://www.compciv.org/files/images/cli/cli-grep-murder.gif)，它使用命令行探索莎士比亚剧本目录；统计数量\n\
    \n### 你的第一个 Shell 脚本\n\n我们将从简单的东西开始。在某处创建一个垃圾目录，比如 `/tmp/my-playground`。你的实际工作空间不需要充斥测试代码。\n\
    \nShell 脚本简单就是一个符合要求的文本文件。要创建它，我们将使用 `nano` 编辑器。\n\n### Nano？\n\n`nano` 是一个文本编辑器。它预装在几乎所有的\
    \ Linux 发行版中。新用户喜欢它主要是因为它的简单性，与其他命令行文本编辑器如 `emacs` 和 `vi/vim` 相比，它脱颖而出。它基本上包含许多其他有用功能，如行号、语法高亮和简单的搜索（等）。\n\
    \n输入 `nano hello.sh` 并运行\n\n"
- fmt: '

    Nano will open and give you a blank file to work in. Now enter the following shell
    command.


    ```bash

    echo ‘hello world’

    ```


    On your keyboard, press `ctrl + x` to exit the editor. When asked whether you
    want to save the file, press `yes` (`y`).


    Nano will then confirm whether you want to save the file. Press `enter` to confirm
    the action.


    Now run the script `hello.sh` with the following command:


    ```bash

    bash hello.sh

    ```


    When you look at it as a gif, the steps look something [like this](http://www.compciv.org/files/images/cli/cli-bash-script-hello-world.gif).


    [http://bit.ly/2piclinux](http://bit.ly/2piclinux)


    Therefore, `hello.sh` is not particularly exciting, but at least it catches the
    essence of what you want to do, which is to wrap up a series of commands into
    a file, that is, a script, so that you can re-run the script as much as you’d
    want. That helps you remove the chance of having typographic errors that come
    about when you’re retyping commands, and allows you to make the script reusable
    in various contexts.


    ## Having Arguments In A Re-Usable Shell Script


    Let’s now try making `hello.sh` a bit complicated. Now instead of repeating hello
    world, you’ll create the script in such a way that it says ‘hello’ to a certain
    value- for instance, a person’s name. That will make the script seem a bit better.
    You can use it like so:


    The gif is as [follows](http://www.compciv.org/files/images/cli/cli-bash-hello-excitedly.gif).


    [http://bit.ly/2linux5](http://bit.ly/2linux5)


    First off, you customize ‘hello world’ by adding a variable in the place of ‘world’.
    Try to do that from the command line interactively:


    The output is:


    Hello Dan


    Therefore, the question here is, how do you get the script `hello.sh` to read
    in our argument (which is a person’s name in this case) that you pass into it?


    You do that through a special bash variable. The first, second and third arguments
    you passed from the command line into the script are denoted by the variables
    which include `$1`, `$2`, `$3`. In the example above therefore, the name George
    will be kept in the variable `$1` as `hello.sh` starts running.


    Just reopen `hello.sh` and change your code to the following


    After saving the changes, now run the following to see the output.


    ![00043.jpeg](Images/image00330.jpeg)


    If you desire to have the output returned in all caps, simply modify `hello.sh`
    in the following manner, making sure to pipe the output through `tr` in order
    to replace all the lowercase letters with those in the uppercase.


    Now if you have a desire to be concise, you may find that `$yourname` variable
    is not necessary. The code will be simplified like so:


    Now slow down my friend. If you can create a script, you can execute like so:


    …then congratulations, you’ve learned an important concept. You’ve just learned
    how programmers stuff complicated things into a ‘container’ that can be run into
    one line. Before we start making some decisions, let’s see how we can use a feature
    known as variables to refer to data, which includes commands’ output or results.


    ## Conclusion


    Thank you for making it through to the end of Hacking tools for computers, let’s
    hope it was informative and able to provide you with all the tools you need to
    achieve your goals whatever they may be.


    The next step is to practice hacking by following different examples available
    in the internet. The most important thing you need to remember being a hacker
    is to be ethical. Always try to get permission before attacking any targets.


    If you want to master hacking further, we have another module that explains in
    detail other hacking tools and about scripting that is necessary for hackers.
    Hacking can be a good career to if you can concentrate well without any deviation.
    This book roughly started from the very beginning that is my installing Linux
    mint and all the way we have gone to wireless hacking methods.

