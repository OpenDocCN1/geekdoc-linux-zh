    Description


    Linux is a mammoth operating system that derives its development from the millions
    of developers working on improving the open software. Because we cannot touch
    on everything, we shall start with some of the basic commands and work toward
    explaining the hard stuff. By getting into these basics, I assume that you have
    a Linux operating system. To log into the Linux system, you will require a username
    and password that you will use to log into the graphical user interface.


    The Linux system has two main modes of operation i.e. the sober-quick in text
    console mode which looks like a DOS operating system with a multi-tasking, multi-user
    and system that can be used with a mouse. The other mode is the graphical mode,
    which uses more system resources but looks and feels much better. Nowadays, the
    graphical mode is the most common in home computers. To know if you are logging
    into the graphic interface, you will be required to provide a username and password
    in two windows.


    The command line in Linux is one of the most important features because it allows
    you to do complex things in very simple ways so naturally you find a permanent
    command line window open for Linux users, although the command line is an interpretive
    programming language, it can be used by non-experts and programmers without any
    difficulty.


    This guide will focus on the following:


    *   What Is Linux?


    *   The Linux Command Line


    *   Benefits of the Linux operating system


    *   How to Install Linux


    *   Package Management


    *   Linux Distributions


    *   File Operations


    *   Exploring Shell


    *   Archiving and Compression 


    *   … AND MORE!!!


    Introduction'
