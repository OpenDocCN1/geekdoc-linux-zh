  trans: '

    使用 Linux 操作系统需要你对终端和命令行有所了解。了解这些是什么，并至少稍微熟悉它们的用法以及可用的标准命令是至关重要的。


    ## 什么是终端？


    终端被描述为“在某些其他显示架构中模拟视频终端的程序。虽然它通常与 shell（壳）或文本终端同义，但‘终端’一词涵盖了所有远程终端，包括图形界面。图形用户界面内部的终端模拟器通常被称为终端窗口”。


    准确来说，终端仅仅是外壳。终端内部运行着一个被称为 shell 的命令行解释器。


    Debian Linux 支持很长的终端软件列表。这包括 `Aterm`，以及 `GNOME terminal`、`Kterm`、`Mate Terminal`、`Rxvt`、`Xterm`
    和 `Xvt`。这些终端软件的不同实现方案在稳定性、对字符集的支持、设计、颜色和字体，以及应用背景图像或使用透明度方面各不相同。


    在本书中，我们将使用 `GNOME terminal`，因为它稳定、简单且易于调整。要增大或减小终端窗口内显示的内容大小，请使用双键组合 `CTRL+` 和
    `CTRL-`。


    ## 6.2 什么是 shell？


    简单来说，shell 是一个复杂的命令行解释器。在循环中，shell 读取字符，在某些条件下对其进行修改，并执行结果。


    在某些条件下，在从命令行读取到执行实际结果之间，shell 必须解释你输入中的特殊字符。下表显示了可用的特殊字符：


    | 字符 | 含义 |

    | :--- | :--- |

    | `$name` | 变量替换 |

    | `name=` | 变量赋值 |

    | `''command''` | 命令替换 |

    | `$(command)` | 命令替换 |

    | `< > >> 2> 2>>` | 输入和输出重定向 |

    | `&#124;` | 命令管道 |

    | `" '' \` | 引号 |

    | `* [ ] ?` | 通用文件名创建（通配符匹配） |

    | `;` | 命令分隔符 |

    | `&` | 在后台运行命令 |

    | `&#124;&#124; &&` | 在特定条件下运行命令 |

    | `{ } ( )` | 命令分组 |


    为了方便起见，shell 会通过以下过程将命令行分为单个单词，以确定命令：


    | 步骤 | 描述 | 特殊字符 |

    | :--- | :--- | :--- |

    | 1 | 读取到命令分隔符并标记（命令替换） | `\n & &#124; &#124;&#124; &&; $(...) \ "..." ''..."`
    |

    | 2 | 标记（输入-/输出重定向，值赋值） | `< > >> 2> 2>> name=` |

    | 3 | 分分为单个单词 | 空格，制表符 |

    | 4 | 变量替换 | `$name` |

    | 5 | 命令替换 | 标记，见步骤 1 和 2 |

    | 6 | 输入-/输出重定向 | 标记，见步骤 1 和 2 |

    | 7 | 变量赋值 | 标记，见步骤 1 和 2 |

    | 8 | 分分为单词 | 基于 IFS |

    | 9 | 创建文件名文件名 | `* [ - ]` |

    | 10 | 命令执行 | |


    在步骤 1 和 2 中，标记仅发生在步骤 5 到 7 中，且没有后续操作。如果标记完成，则执行步骤 5 到 7。接下来，shell 会移除所有特殊字符。在步骤
    10 中，命令行仅包含执行命令所需的参数。shell 将第一个单词解释为要执行的命令名称，其余单词为其参数：


    | `command arg1 arg2 arg3 ...` | |


    ## 6.3 可用的 shell


    你的 Linux 系统允许使用各种 shell。每个 shell 都可以通过我们之前安装的 Debian 软件包管理器 `Aptitude` 作为独立的软件包进行安装。shell
    的列表很长，因此我们只列出一些最常用的可用 shell：


    *   Almquist Shell (`ash`)

    *   Bourne Again Shell (`bash`)

    *   Debian Almquist Shell (`dash`)

    *   Z Shell (`zsh`)

    *   C Shell (`csh`)

    *   Korn Shell (`ksh`)

    *   Tenex C Shell (`tcsh`)


    除非另有说明，本文中的示例均基于 Bourne Again Shell (`bash`)。在编写本文档时，它是 Debian 的默认 shell。


    你的 Linux 系统允许哪些其他 shell？这在配置文件 `/etc/shells` 中设置。使用 `cat` 命令可以查看允许的 shell 列表：


    ```

    user@debian95: ~$ cat /etc/shells

    # /etc/shells: valid login shells

    /bin/sh

    /bin/dash

    /bin/bash

    /bin/rbash

    /usr/bin/screen

    user@debian95: ~$

    ```


    当前终端中使用的 shell 名称存储在 shell 变量 `$0` 中。以下简单命令输出 shell 的名称：


    ```

    user@debian95: ~$ echo $0

    bash

    user@debian95: ~$

    ```


    要更改当前使用的 shell，请查看下一节介绍的 `chsh` 命令和配置文件 `/etc/passwd`。


    # 第 6 章 变量


    在 Linux 中，创建变量非常简单。例如，为了将名字 John 存储到变量 `name` 中，你可以像像下面所示进行操作：


    ```

    [root@archserver ~] # name="John"

    ```


    双引号告诉 Linux 你正在创建一个变量，该变量将持有字符串类型的值：John。如果你的字符串只包含一个单词，你可以忽略引号，但如果你存储的是包含多个单词和空格的短语，则必须使用双引号。要查看任何变量内部的值，必须在
    `echo` 命令中提到变量名之前使用美元符号 (`$`)。如下所示：


    ```

    [root@archserver ~] # echo $name

    John

    ```


    如果你漏掉了美元符号 (`$`)，`echo` 将把传递给它的参数视为字符串并打印该字符串，例如：


    ```

    [root@archserver ~] # echo name

    name

    ```


    你应该记住，变量标识符和值之间不应该有任何空格。标识符基本上是变量的名字：


    ```

    [root@archserver ~] # x=5 # 这种语法是正确的，没有空格

    [root@archserver ~] # x = 10 # 这种语法是错误的，因为变量名和值之间存在空格

    ```


    '
- fmt: "\nThere are other variables present in the Linux too, there variables store\
    \ some values that come in handy whilst using any distribution of Linux. These\
    \ predefined variables are often referred to as global variables. For example,\
    \ `$HOME` is one of those global variables. The `$HOME` variable stores the path\
    \ of our default directory, which in our case is the HOME folder. We can see the\
    \ path stored in the `$HOME` folder using the `echo` command:\n\n```bash\n[root@archserver\
    \ ~] # echo $HOME\n/root\n```\n\nWe can also change the values of these global\
    \ variables, using the same method that I used to store Value into a newly created\
    \ variable. For now, I would ask you not to try that, as these kinds of things\
    \ only concern expert Linux users, which you are not right now, but soon you will\
    \ be. Other global variables are:\n\n1. `PATH`\n2. `PS1`\n3. `TMPDIR`\n4. `EDITOR`\n\
    5. `DISPLAY`\n\nTry echoing their values, but don’t change them, as they will\
    \ affect the working of your Linux Installation:\n\n```bash\n[root@archserver\
    \ ~] # echo $PS1\n[\\u@\\h \\W] \\$\n\n[root@archserver ~] # echo $EDITOR\n\n\
    [root@archserver ~] # echo $DISPLAY\n:1\n\n[root@archserver ~] # echo $TMPDIR\n\
    ```\n\nThe most important global variable of all is the `$PATH` variable. The\
    \ `$PATH` variable contains the directories / locations of all the programs that\
    \ you can use from any directory. `$PATH` is like the environment variables present\
    \ in the WINDOWS operating system. Both hold the directory paths to the programs.\
    \ Let’s print the `$PATH` variable. Our outputs might differ so don’t worry if\
    \ you see something different:\n\n### Example\n\n```bash\n[root@archserver ~]\
    \ # echo $PATH\n```\nOutput:\n```\n/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl\n\
    ```\n\nThe output of the example above shows the path where Linux can find files\
    \ related to `site_perl`, `vendor_perl` or `core_perl`. You can add values to\
    \ the path variable too. But again, at this stage you shouldn’t change any value\
    \ present in the `$PATH` variable.\n\nIf you want to see where the commands that\
    \ you use, reside in the directory structure of Linux, you should use the `which`\
    \ command. It will print out the directory from where Linux is getting the definition\
    \ of a command passed.\n\n### Example\n\n```bash\n[root@archserver ~] # which\
    \ ls\n/usr/bin/ls\n\n[root@archserver ~] # which pwd\n/usr/bin/pwd\n\n[root@archserver\
    \ ~] # which cd\nwhich: no cd in (/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl)\n\
    \n[root@archserver ~] # which mv\n/usr/bin/mv\n```\n\n# Chapter 7 Using the Shell\n\
    \nThere are times that you will notice that something is not working right while\
    \ you are in a GUI desktop environment – there are times wherein a program crashes\
    \ and the entire system refuses to respond to mouse clicks. There are even situations\
    \ wherein the GUI may not start at all. When you run into trouble, you can still\
    \ tell your operating system what to do, but you will have to do it using a text\
    \ screen or the shell, which serves as the command interpreter for Linux.\n\n\
    Since Linux is essentially a Unix program, you will be doing a lot of tasks using\
    \ the text terminal. Although the desktop will be doing the job of providing you\
    \ the convenience to access anything through a click of the mouse, there are several\
    \ occasions wherein you need to access the terminal.\n\nLearning how to enter\
    \ commands will save you from a lot of trouble when you encounter an X Window\
    \ system error, which is the program that controls all the menus and the windows\
    \ that you see in your desktop GUI. To fix this error, or to prevent it from stopping\
    \ you to access the program or file that you want, you can pull up a terminal\
    \ and enter a command instead. In the future, you might want to keep a terminal\
    \ open in your desktop since it can make you order your computer faster than having\
    \ to point and click.\n\n## The Bash Shell\n\nIf you have used the MS-DOS OS in\
    \ the past, then you are familiar with `command.com`, which serves as the command\
    \ interpreter for DOS. In Linux, this is called the shell. The default shell in\
    \ all the different distros, is called the `bash`.\n\nBourne-Again Shell, or `bash`,\
    \ can run any program that you have stored in your computer as an executable file.\
    \ It can also run shell scripts, or a text files that are made up of Linux commands.\
    \ In short, this shell serves as a command interpreter, or a program that interprets\
    \ anything that you type as a command and performs what this input is supposed\
    \ to do.\n\nPulling up the terminal window can be as simple as clicking on a monitor-looking\
    \ icon on the desktop – clicking on it will lead you to a prompt. If you can’t\
    \ find that icon, simply search through the Main menu and select the item with\
    \ has the Terminal or Console label.\n\n**Tip**: You have the choice to use other\
    \ shells apart from the `bash`, just like you have a choice in choosing desktops.\
    \ You can always change the shell that you are using for your distro by entering\
    \ the `chsh` command on the terminal.\n\n## The Shell Command\n\nEvery shell command\
    \ follows this format:\n\nA command line, such as a command that follows the above\
    \ format, is typically followed by parameters (also known as arguments). When\
    \ entering a command line, you need to enter a space to separate the main command\
    \ from the options and to separate one option from another. However, if you want\
    \ to use an option that contains a space in its syntax, you will need to enclose\
    \ that option in quotation marks. Look at this example:\n\nThe `grep` command\
    \ allowed you to find for a text in a file, which is Emmett Dulaney in this case.\
    \ Once you press enter, you will get the following result:\n\nIf you want to read\
    \ a file, you can use the `more` command. Try entering this command:\n\nYou will\
    \ be getting a result that appears like this:\n\nTo see all programs are running\
    \ on your computer, use the `ps` command. Try entering this command on the terminal:\n\
    \nThe options `ax` (option `a` list all running processes, while opion `x` shows\
    \ the rest of the proceses) allows you to see all the processes that are available\
    \ in your system, which looks like this: \n\n![00017.jpeg](Images/image0027.jpeg)\
    \ \n\nThe amount of the command-line options and their corresponding formats would\
    \ depend on the actual command. These options appear like the `–X`, wherein `X`\
    \ represents one character. For esample, you can opt to use the option `–l` for\
    \ the `ls` command, which will list a directory’s contents. Look at what happens\
    \ when you enter the command `ls –l` in the home directory for a user:\n\nIf you\
    \ enter a command that is too long to be contained on a single line, press the\
    \ `\\` (backslash) key and then hit Enter. Afterwards, go on with the rest of\
    \ the command on the following line. Try typing the following command and hit\
    \ Enter when you type a line:\n\nThis will display all the contents inside the\
    \ `/etc/passwd` file.\n\nYou can also string together (also known as concatenate)\
    \ different short commands on one line by separating these commands with the `;`\
    \ (semicolon) symbol. Look at this command:\n\nThis command will make you jump\
