    When you are done, press the `Continue` key in order to proceed with step six
    to add a domain name like `yourcompany.com` (see image below). In this case, it
    is not needed. That’s why we leave the entry field empty. Click the `Continue`
    button on the lower-right corner to proceed with the installation.


    # Users and Roles


    Our Linux system needs at least two users in order to be appropriately operated.
    One is an administrative user that has a fixed name `root` and the other is a
    regular user that we just give the name of `User` in this case.


    In the next two steps, you set the password for the user `root` (see image below)
    and both the full name and account name for the regular user. For simplicity,
    we use `Debian User` as the full name and `User` as the account name. For both
    users, choose a password that is dissimilar and that you can remember. You will
    need these passwords later in order to log onto your computer.


    # Time Zone


    Setting the correct time zone is significant for communication with other services,
    especially in a network. Choose the value from the list as seen in the image below.
    The entries in the list are based on the location you have selected before. When
    done, click the `Continue` button to define the storage media and the accompanying
    partitions.


    # Storage Media and Partitioning


    A Linux system can be distributed across several different storage media like
    hard disks and flash drives. Over and above, a storage media can be separated
    into multiple disk partitions. In order to do so, the setup program of Debian
    has the following methods available (see image below):


    - **Guided - use entire disk**: follow the steps as provided and use the entire
    disk space for the Linux installation. This creates partitions with fixed sizes.

    - **Guided - use the entire disk and set-up LVM**: follow the steps as provided
    and use the entire disk space for the Linux installation. This option makes use
    of Logical Volume Management (`LVM`) in order to create partitions with sizes
    that can be changed later.

    - **Guided - use the entire disk and set-up encrypted LVM**: follow the steps
    as provided and use the entire disk space for the Linux installation. This option
    makes use of Logical Volume Management (`LVM`) in order to create encrypted partitions
    with sizes that can be changed later.

    - **Manual**: create partitions individually. This is the expert mode and requires
    more profound knowledge about partitions and file system parameters.


    From the list choose the entry `Guided-use the entire disk`. The values for partition
    sizes are chosen according to experience, implemented as an algorithm. A manual
    calculation is not required. Click the `Continue` button on the lower-right corner
    to proceed with the installation.


    Next, select the disk to partition. As for our case, we have only one disk available
    (see image below). Later, in this guide, the disk will be referred to as `/dev/sda`
    for the 1st SCSI disk.


    A disk partition refers to a piece of the storage media that is organized separately
    and is intended to contain a branch of the Linux file system tree. There is no
    universal way to do this separation correctly. This guide shows a simple but safe
    solution that works for a basic system. The menu in the dialog box offers the
    following options:


    - **All files in one partition**: use just a single partition to keep programs
    and user data

    - **Separate /home partition**: store programs and user data in separate partitions

    - **Separate /home, /var`, and /tmp partitions**: keep user data, variable data
    and temporary data in separate partitions


    Click the `Continue` button on the lower-right corner to proceed with the installation.


    The next step is to confirm the partition scheme. This is calculated automatically
    based on experience and contains these partitions:


    - `sda1`: the first partition of the first SCSI disk is a primary partition with
    a size of 3 GB, formatted with the `ext4` file system, and referred to as the
    root part of the file system tree (indicated with `/`)

    - `sda5`: the fifth partition of the first SCSI disk is a logical partition with
    a size of 1.3 GB, formatted with the `ext4` file system, and reserved to store
    variable data of the file system tree (indicated with `/var`)

    - `sda6`: the sixth partition of the first SCSI disk is a logical partition with
    a size of 3.3 GB, formatted as a swap file system

    - `sda7`: the seventh partition of the first SCSI disk is a logical partition
    with a size of 311 MB, formatted with the `ext4` file system, and reserved to
    store temporary data of the file system tree (indicated with `/tmp`)

    - `sda8`: the eighth partition of the first SCSI disk is a logical partition with
    a size of 8.8 GB, formatted with the `ext4` file system, and reserved to store
    the user data of the file system tree aka home directories (indicated with `/home`)


    Due to historical reasons, a hard disk can contain four primary partitions only.
    The fourth one is called an Extended Partition if divided into so-called logical
    partitions or logical drives. In our case the logical partitions `/dev/sda5`,
    `/dev/sda6`, `/dev/sda7` and `/dev/sda8` are stored on the primary partition `/dev/sda4`.
    The partitions `/dev/sda2` and `/dev/sda3` are not in use.


    From the above list, choose the entry `Finish partitioning and write changes to
    disk`. Click the `Continue` button on the lower-right corner to proceed and to
    confirm the partition scheme (see below image). Choose `yes` from the list and
    click the `Continue` button to partition the disk. Note that all the data on the
    selected storage device will be lost and the disk will be empty.


    Having divided the storage media into single partitions, the partitions will be
    formatted with the file system as defined before. In our case the partitions `/dev/sda1`,
    `/dev/sda5`, `/dev/sda7` and `/dev/sda8` will get an `ext4` file system, and the
    partition `/dev/sda6` will get a swap filesystem. As soon as this step is completed,
    the base system of Debian will be installed next.


    # Package Management


    The ISO image contains the installer and several packages to set up the Linux
    base system. For example, this includes the Linux kernel being installed below.

