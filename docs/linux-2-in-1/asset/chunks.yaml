    # Chapter 7 Using the Shell


    There are times that you will notice that something is not working right while
    you are in a GUI desktop environment – there are times wherein a program crashes
    and the entire system refuses to respond to mouse clicks. There are even situations
    wherein the GUI may not start at all. When you run into trouble, you can still
    tell your operating system what to do, but you will have to do it using a text
    screen or the shell, which serves as the command interpreter for Linux.


    Since Linux is essentially a Unix program, you will be doing a lot of tasks using
    the text terminal. Although the desktop will be doing the job of providing you
    the convenience to access anything through a click of the mouse, there are several
    occasions wherein you need to access the terminal.


    Learning how to enter commands will save you from a lot of trouble when you encounter
    an X Window system error, which is the program that controls all the menus and
    the windows that you see in your desktop GUI. To fix this error, or to prevent
    it from stopping you to access the program or file that you want, you can pull
    up a terminal and enter a command instead. In the future, you might want to keep
    a terminal open in your desktop since it can make you order your computer faster
    than having to point and click.


    ## The Bash Shell


    If you have used the MS-DOS OS in the past, then you are familiar with command.com,
    which serves as the command interpreter for DOS. In Linux, this is called the
    shell. The default shell in all the different distros, is called the bash.


    Bourne-Again Shell, or bash, can run any program that you have stored in your
    computer as an executable file. It can also run shell scripts, or a text files
    that are made up of Linux commands. In short, this shell serves as a command interpreter,
    or a program that interprets anything that you type as a command and performs
    what this input is supposed to do.


    Pulling up the terminal window can be as simple as clicking on a monitor-looking
    icon on the desktop – clicking on it will lead you to a prompt. If you can’t find
    that icon, simply search through the Main menu and select the item with has the
    Terminal or Console label.


    Tip: You have the choice to use other shells apart from the bash, just like you
    have a choice in choosing desktops. You can always change the shell that you are
    using for your distro by entering the chsh command on the terminal.


