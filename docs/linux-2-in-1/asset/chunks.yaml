    These are used to build statements. Statements are logical comparisons which have
    one or more comparison built-in. Here is a pseudocode version of a logical comparison:


    peaches = 6


    bananas = 3


    peaches > bananas


    //Since this statement is true, “peaches > bananas” would be true.


    Using these statements is essential to building the internals of your program.
    You can also group different statements together into one larger statement.


    These statements are built using what are called conditional operators. There
    are three primary operators that you need to know at a lower level: and, or, and
    not.


    And signifies that the two statements are connected. This means that if either
    statement is false, the entire statement is false. It’s only true if both statements
    are true.


    Or signifies that the two statements are disjointed but implicitly connected.
    If either statement is true, then the whole statement is true. They don’t both
    have to be true for the statement to return as true.


    Not signifies that the entire statement following is untrue. Therefore, the validity
    of the entire statement including the not operator is based upon whether the statement
    without the not operator is false. For example, if morePeaches is true, then not
    morePeaches is false; conversely, if morePeaches is false, then not morePeaches
    is true.


    Conditional Statements


    With all of that said, it’s time that we start to talk about how you can use statements
    in your program to build logical lines for the program to run along.  Conditional
    statements are used to check to see whether a given statement is true, then act
    accordingly. For example, if the conditional statement were if the number of eggs
    is greater than zero, then the program would evaluate whether this was true and
    then execute something if it was. This is the first kind of conditional statement,
    known as an if statement.


    Here is pseudocode for a basic if statement:


    if (statement) {


    // code to execute


    }


    This is what I like to refer to as a passive if statement. I call it so because
    these statements will only execute if the comparative statement is deemed to be
    true. However, there is no escape clause in these; there is no programmatic way
    of designating what should happen if it turns out the statement is false. The
    program would simply skip over the statement and move on to whatever was next
    in the code.


    You can also create an active if statement by using what is called an else statement.
    Else statements are appendices to if statements that provide a set action to take
    if the initial if statement turns out not to be true. Here is an example of an
    active if statement:


    if (statement) {


    // code to execute


    } else {


    // code to execute if first block fails


    }


    When you use an active if statement, even if the statement is false, something
    is still going to run.


    Which one you’ll need to use can vary immensely depending on what you’re needing
    at that specific moment. Deciding which one to use is a skill that will grow on
    you as you gain more experience.


    Sometimes, though, you need to catch more than one clause. For example, you may
    want to do something if a number is less than 6, if a number is greater than 37,
    and if a number is somewhere between the two. For this, you need another part
    of your if clause.


    So how do you go about doing this? You use the else if statement. Else if statements
    give you a way to test additional statements before moving to your catch-all else
    statement. They are sandwiched between your if statement and your else statement
    and you can have as many of them as the situation calls for:


    if (statement1) {


    // block 1


    } else if (statement2) {


    // block 2


    } else {


    // catch-all block


    }


    If statement one turned out to be true, then the first block of code would execute.
    If statement two turned out to be true, then the second block of code would execute.
    If neither turned out to be true, then the third block would execute. This is
    the simplest form of control flow.


    Loops


    The other form of control flow is known as the loop. You use loops every day without
    even thinking about it. Much like if statements, you’re constantly making comparisons
    in your head, you’re just not thinking about how they, well, are comparisons.


    What do loops allow you to do? Loops offer a methodical way to check whether a
    statement is true, then you can take a course of action if it is or isn’t. 


    You use loops all the time in your internal logic, you just don’t consider that
    they’re loops. Think about counting out loud from 1 to 10\. You start with the
    number zero, even though you don’t say it - you increment the number by 1, then
    you say it out loud. This continues for as long as number n is less than or equal
    to the number 10.


    There are two different primary kinds of loops: while loops and for loops. They
    both serve diametrically different purposes, but that won’t be completely clear
    from the get-go. What’s more is that learning how to use these properly is more
    of a question of experience than something that can be properly taught from a
    book in any way shape or form, but we can outline the bare essentials and primary
    differences by the two and start to delineate their uses.


    While loops are primarily used for simple statement checking. That is to say that
    whenever you just need to run something over and over for the duration of time
    that a given statement is true or false, then while loops are your friend.


    This gives way to them being used for something called a game loop. Game loops
    are called such because they allow you to repeat a chunk over and over until a
    certain variable is tagged true or false. They are common in computer games, where
    the variable may be something like GameIsOver = False and the loop will run over
    and over until GameIsOver is true. Whenever something triggers that GameIsOver
    = true, like the player running out of lives or the dealer winning the card game,
    the loop will exit and something else will happen.


    The other kind of loop is the for loop. In C-style languages like C++ and Java,
    the difference between the two isn’t as clear-cut as it is in a language like
    Python. However, by using it in Python, the primary use of it in C++ and Java
    becomes exceedingly clear. For loops are intended for iteration. What they do
    is allow you to define a certain set or range, create an iterator variable (which
    is a variable that will change in some way with every instance of the loop as
    the set or range are moved through), and then move through the loop until the
    defined set or range have been completely iterated through.


    The pseudocode for a while loop is like this:


    while (statement) {


    // code executes until statement is false


    }


    And the pseudocode for a for loop is like this:


    for (iterator variable; range definition; increment setting (in C++, Java, etc.))
    {


    // code executes until range has been iterated through


    }


    There is also the do while loop. What the do while loop does is allow you to define
    a block of code which will most definitely execute once, but it will only execute
    more if a given statement is false. Compare this to a normal while loop - if the
    initial statement that was given is untrue, then the entire loop won’t execute
    at all. With the do while loop, you ensure that this won’t happen by giving you
    the security to know that the given code will execute at least once.


    Here is the pseudocode for a do while loop:


    do {


    // code executes at least once, more if the while condition is true


    } while (statement)


    Loops are the other essential part of control flow which allows you to break your
    program into different paths which can change depending upon the way that the
    program’s execution is going. It allows you to respond to user input or any other
    variables. All in all, it lets you write a program that isn’t a straight path
    from point A to point B.


