    \ than something that can be properly taught from a book in any way shape or form,\
    \ but we can outline the bare essentials and primary differences by the two and\
    \ start to delineate their uses.\n\n### While loops\n`while` loops are primarily\
    \ used for simple statement checking. That is to say that whenever you just need\
    \ to run something over and over for the duration of time that a given statement\
    \ is true or false, then `while` loops are your friend. This gives way to them\
    \ being used for something called a game loop. Game loops are called such because\
    \ they allow you to repeat a chunk over and over until a certain variable is tagged\
