    # Chapter 10 Working with Linux Files and Directories


    Now that you’ve got your hands a little dirty, you must be eager to get on to
    some more coding and really get down to playing about in the system. You will,
    I promise, but first, there is some more theory that you really need to learn
    so that, when you do get into the system, you truly understand why it does what
    it does and how to do more with the commands you have learned. So, let’s take
    a deeper look at the core concepts you need to learn.


    ## Everything in Linux is a file.


    This is a very important concept to grasp—everything in Linux, no matter where
    it’s or what it does, is a file. Text files are, obviously, files. Directories
    are files. Your computer keyboard is a read-only file, the monitor on your computer—even
    this is a file, albeit a write-to file. Everything. To start with, this won’t
    have any real effect on what you do, but you must always keep it in mind as it
    will help you to grasp how Linux works with directory and file management.


    ## Linux is known as an “extensionless system.”


    This one is a little bit harder to grasp, but as you work through this book and
    learn more, you’ll find that it makes sense. File extensions are usually made
    up of a series of 2, 3, or 4 characters after a dot. You’ve already seen these
    with Word (`.doc`, `.docx`), `.pdf`, and so on. This extension is what tells you
    the type of file you are working with. These are some of the more common ones
    that you’ll come across:


    *   `File.exe`: a program or a file that’s executable

    *   `File.txt`: a file in plain text

    *   `File.png`, `File.jpg`, `File.gif`: all image files


    In many systems, like Windows, this file extension is very important because the
    system will use it to work out what kind of file it’s working with. In Linux,
    it''s different. The Linux system will ignore that extension and, instead, it
    will investigate the file itself to see what it’s to do. So, for example, you
    could have a file that’s named `monkey.gif`, a picture of a monkey. You could
    give the file a new name, such as `monkey.txt` or even just `monkey`, and Linux
    will see it as the image file it really is. Because of this, you might sometimes
    find it difficult to determine what type a file is, but there is a really easy
    way to find out in Linux by using one simple command: `file`.


    ```

    file [path]

    ```


    Now, you are probably asking yourself why the command line argument is a path
    and not a file. If you think back, remember that every directory or file that
    we specify on the command line is a path. And, because a directory is also a file,
    it’s correct to say that the path is nothing more than a journey to a system location,
    and the location is the file.


    ## Linux is case sensitive.


    This is one of the most important concepts and is the one that tends to cause
    the most problems for those new to the Linux program. You already know that systems
    like Windows are case insensitive in terms of file referencing, but Linux is different.
    You can have multiple directories or files with identical names but different
    cases. For example:


    ```

    ls Documents

    ```


    ```

    FILE2.txt File2.txt file2.TXT

    ```


    ...


    ```

    file Documents/file2.txt

    ```


    ```

    Documents/file2.txt: ERROR: cannot open ''file2.txt'' (No such file or directory)

    ```


    Each one of these is seen as an individual file by Linux.

