  trans: '

    下一步是您必须决定是否使用额外的安装介质。在我们的情况下，我们只有一个安装盘，因此可以从菜单中选择 `No`（见下图）。然后点击 `Continue` 按钮继续。如前所述，Debian
    软件是以包的形式组织的。这些包由多个软件存储库提供。存储库通过大学、个人、公司和其他组织维护的软件包镜像提供。这些镜像分布在不同的国家。


    在下一步中，您将需要决定从哪个国家获取 Debian 软件包。建议选择地理位置上靠近您的镜像，以尽力地减少通过网络从镜像传输数据到您计算机所需的时间。第一步，选择您所在的国家。第二步，从列表中选择一个优选镜像（见下图）。列表包含了大学、互联网服务提供商、政府服务和其他组织。如果您的计算机网络包含用于与外部世界通信的代理服务器，请在此处输入相应信息。在这种情况下，我们没有代理服务器，因此留空输入框。点击
    `Confirm` 按钮继续。一旦设置了这些参数，Debian 安装程序将连接到之前选择的软件包镜像并从那里获取软件包列表。软件包列表包含了可用的软件包，包括名称、大小和描述。取决于网络连接的质量和带宽，此步骤需要一段时间。接下来，您会被要求参与
    `Popcon`，即 Debian 软件包流行度投票（见下图）。此信息是可选的，仅供负责 Debian 软件包的团队使用。根据 `Popcon`，他们可以确定哪些
    Debian 软件包是安装频率最高的。这些信息直接影响安装镜像的准备，以及针对不同的架构保留或忽略哪些软件包。


    在我们的情况下，我们不参与 Popcon，并将选择留为 `No`。点击 `Confirm` 按钮继续选择软件任务 (`tasksel`）。


    ## 软件选择


    Debian 提供了精心安排的软件包选择，称为“任务”（tasks）。其背后的思想是将用于特定用途的软件包分组，以简化安装。从对话框中的列表（见下图）中，可以在不同的桌面环境、Web
    服务器、打印服务器、SSH 服务器以及标准系统程序之间进行选择。要进行最小化安装，只需启用列表中的最后两个选项。我们将稍后安装 XFCE 桌面环境。


    确认软件选择后，Debian 安装程序将从软件包镜像检索所需的包、解压并安装它们。下方的条显示进度。在这种情况下，必须下载 140 个软件包。


    ## 设置 GRUB


    为了启动新安装的 Debian 系统，我们也必须设置此信息。这个过程被称为系统引导。处理这一步骤的软件组件名为 `Grand Unified Boot Loader`（准确来说是
    `GRUB` 或 `GNU GRUB`）。`Yes` 选项已预选，因此我们可以点击 `Continue` 继续。Debian 安装程序需要知道将 `GRUB`
    安装在哪里。下图菜单列出了需要考虑的存储介质。在我们的情况下，我们选择列表中的第二项 (/dev/sda)。然后点击 `Continue` 继续。现在我们几乎完成了基础安装，剩下的只需阅读一个对话框。


    ## 完成安装


    以下对话框告知您安装已完成。然后点击 `Continue` 重启新安装的系统。


    几秒后，屏幕上会出现基于文本的 `GRUB` 引导菜单。...（此处省略）...您的 Debian 系统将启动并初始化必要的系统服务。


    最后，在名为 `tty1` 的第一个文本终端上（见下图）将看到一个黑白屏幕，要求您登录系统。登录提示由两个部分组成：您的 Linux 系统主机名 (`debian95`)，后面跟着空格和单词
    `login`。


    ```

    Debian GNU/Linux 9 debian95 tty1

    debian95 login: _

    ```


    登录系统后，您将添加更多软件以使用基于 XFCE 桌面的图形用户界面。在安装过程的此时，只能通过以管理员 root 用户登录来添加更多软件。


    为了实现这一点，在登录提示处输入 `root`，按 `Enter`，等待 `Password:` 文本出现，然后输入您之前为 root 用户设置的密码。Linux
    系统将用登录消息欢迎您（见下图）。登录消息的第一行将显示您上次登录的时间，随后是当前运行的 Linux 内核版本（第二行）以及使用建议（第五行到第八行）。


    在显示欢迎消息后，Debian 会打开一个命令行提示符：


    ```

    root@debian95 ~#

    ```


    此命令行提示符由四个部分组成：


    - `root`：登录的用户名。

    - `debian95`：Linux 系统主机名。

    - `~`：当前目录。在这种情况下，它是当前登录用户的家目录。如果没有特殊设置，对于普通用户定义为 `/home/username`，对于管理员用户定义为
    `/root`。`~` 只是它的缩写。

    - `#`：登录符号。`#` 符号代表用户 `root`，而 `$` 用于没有权限的普通用户。


    **重要**：您现在已以管理员 root 用户身份登录。请小心您输入的命令，并在疑问时检查两次。任何错误都可能导致需要重新安装或修复 Linux 系统。


    ## 添加图形用户界面


    在当前阶段，Debian 系统已完全激活并可用于生产。对于适用于普通用户的桌面系统，它仍然缺少一个优秀且易用的图形用户界面。在这一步中，我们将改变这一点并安装
    XFCE 桌面管理器。


    为了这样做，我们将安装以下软件包：


    - `aptitude` 软件包管理器

    - `xdm` 显示管理器

    - `xfce4` 桌面环境


    Debian 使用 `apt` 软件包管理器来处理软件包及相关包列表的安装、更新和删除。此外，`apt` 解析所有的软件包依赖关系并确保相关软件在系统中可用。在我们的情况下，必须从软件包镜像检索并安装总计约
    450 MB 的数据/软件。如前所述，这需要运行的互联网连接来下载所需的软件包。


    为了安装这三个软件包，请在命令行提示符处输入以下命令。只需输入 `#` 符号后的命令：


    ```

    root@debian95 ~# apt-get install aptitude xdm xfce4

    ```


    `apt` 将显示有关要安装软件包的进一步信息。这包括依赖包列表和推荐包。最后，您将看到一个命令行提示符。输入 `Y` 或按 `Enter` 安装 `aptitude`、`xdm`
    和 `xfce4` 以及依赖包。对于 `xdm` 显示管理器，必须确认两个对话框（见下图）。按两次 `Enter` 确认使用 `xdm`。


    '
- fmt: '

    The retrieval of the software packages to be installed takes a while. When finished,
    the command-line prompt will appear again. In order to activate the changes regarding
    the graphical desktop environment, restart the system. Type the command `reboot`
    at the command-line prompt as follows:


    ```

    root@debian95 ~# reboot

    ```


    Having restarted the Linux system, Debian welcomes us with a graphical boot screen
    (see image below). Press `Enter` to start the Linux system with the default settings.


    A few seconds later a graphical login screen will be visible (see image below).
    Log in to the system with the regular user named `user` as created earlier. Type
    in `user`, press `Enter` and type in the password for the user. Then, press `Enter`
    again to confirm and log in.


    Next, the XFCE desktop will be visible (see image below). The desktop comes with
    several default elements: an upper navigation bar, a lower navigation bar and
    desktop icons. All the mentioned elements are explained in more detail below.


    - **Upper navigation bar**: this shows buttons to access the different applications,
    the four virtual desktop screens, the clock and a button for various user actions
    such as to lock the screen, change the user, change to standby mode and exit the
    current session.

    - **Lower navigation bar**: this bar contains several buttons to hide all the
    opened windows and show the empty desktop, to open a terminal, the file manager,
    a web browser, to find an application and to open the file manager directly with
    your home directory.


    ## Adding Additional Software


    Up until now the software available to be used on your Linux system has been somewhat
    limited. After all that, the next thing to do is to add the following four Debian
    packages to make your life a bit easier:


    - `firefox-esr`: the web browser Mozilla Firefox (Extended Support Release)

    - `gnome-terminal`: a terminal emulation maintained by the GNOME project

    - `xscreensaver`: a basic screensaver for the X11 system

    - `vlc`: the video player Video Lan Client (VLC)


    The installation of the three packages will be done using the command-line in
    a terminal emulator (we will look at terminals in detail later in the guide).
    Currently, on your system, the X11 terminal emulator `xterm` is installed. In
    order to open `xterm`, click on the terminal button in the lower navigation bar
    or select the entry `Application > System > Xterm` from the context menu.


    As step one, open `xterm`. Next, type in the command `su` next to the command-line
    prompt as follows and press `Enter`:


    ```

    user@debian95: ~$ su

    Password:

    ```


    You may remember from the previous steps that only an administrative user can
    install, update or remove software on a Debian system. The `su` command abbreviates
    switch user and changes your current role. Used without an additional name, the
    role changes to the administrative root user. At the password prompt type in the
    password for the administrative user and press `Enter`.


    As an administrative user, install the packages: `firefox-esr`, `gnome-terminal`,
    `xscreensaver` and `vlc` as follows:


    ```

    root@debian95: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc

    ```


    The output is seen below:


    After the installation of the four packages, you can switch back to your role
    as a regular user. Press `Ctrl+D` to quit the admin part, and press `Ctrl+D` again
    to close `xterm`.


    ### The installation of Firefox has the following effects:

    - The new software `Firefox` is available from the application menu.

    - The new command `Firefox` is available from the command-line.

    - The earth icon from the lower navigation bar links to the Firefox web browser.


    ### The installation of the GNOME terminal package has the following effects:

    - The new software `gnome-terminal` is available from both the command-line and
    the application menu.

    - The terminal icon from the lower navigation bar links to the GNOME terminal.

    - The entry `Open Terminal Here` from the context menu refers to the GNOME terminal.


    In order to see the changes, select the entry `Open Terminal Here` from the context
    menu. The image below shows the terminal window. It comes with a white background
    and a bigger font that is easier to read.


    ## Exiting Linux


    In order to use Linux properly, you also must learn how to exit Linux and to reboot
    the system. Below you will learn how to quit the XFCE desktop environment, to
    shut down the Linux system and to reboot the system. We will look at two methods;
    the first is based on the graphical interface and the second can also be used
    on non-graphical systems like servers and wireless routers.


    ### Quitting the XFCE Desktop Environment


    The easiest way to quit the XFCE desktop and to log out from your current session
    is to click on the button in the right corner of the upper navigation bar. The
    button is labeled with your username, which in our case is `Debian User`. From
    the small menu select the last item labeled `Log Out`. Alternatively, you can
    choose either the item labeled `Log Out` from the `Application` button in upper-left
    corner or from the context menu.


    A second window opens that contains the five buttons labeled `Log Out`, `Restart`,
    `Shutdown`, `Suspend` and `Hibernate`. Click on `Log Out` to quit your session.
    Subsequently, you will return to the login screen.


    ### Shutting Down the Linux System


    The way to shut down the entire Linux system is like exiting XFCE. Click on the
    button in the right corner of the upper navigation bar. The button is labeled
    with your username which in our case is `Debian User`. From the small menu select
    the item labeled `Shut Down`. From the next dialog window click on the button
    labeled with `Shut Down` to stop the Linux system.


    From a terminal session you can run the commands `halt` or `shutdown -h now` as
    an administrative user. A regular user is not allowed to issue these commands.


    ```

    # halt

    ```


    ### Rebooting the Linux System


    In order to restart the Linux system, click on the button in the right corner
    of the upper navigation bar. The button is labeled with your username, which in
    our case is `Debian User`. From the small menu select the item labeled `Restart`.
    From the next dialog window click on the button labeled `Restart` to reboot the
    Linux system.


    From a terminal session, you can run the command `reboot` or `shutdown -r now`
    as an administrative user. A regular user is not allowed to issue these commands.


    ```

    # reboot

    ```


    Subsequently, the system will reboot, and you will return to the boot screen.


    ## Chapter 4 Linux Command Lines


    At this juncture, you should have a fair understanding of basic commands, and
    Linux should be installed in your system. You now have an incredible opportunity
    ahead of you – a completely blank slate where you can begin to design an operating
    system. With Lunix, you can easily customize your operating system so that is
    does exactly what you would like it to do. To get started, you need to install
    a selection of reliable and functional applications.

