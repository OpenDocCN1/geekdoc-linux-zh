    ## 关于运行命令的更多内容


    理解 Linux 在很大程度上取决于知道正确的命令行选项，根据你对命令的操作来改变它们的工作方式。这些选项许多都有长版本和简写版本；例如，我们之前看到，当我们要列出目录中的所有内容（包括隐藏条目）时，我们使用
    `-a` 或 `--all`。长格式只是一个易于人类眼睛阅读的版本。你可以使用其中任何一种，因为它们的结果相同。长格式的优点是，当你回看代码时，你会发现更容易理解命令的作用，而使用简写允许你轻松地将多个命令组合在一起。


    ```

    pwd

    /home/cleopatra

    ls -a

    ls --all

    ls -alh

    ```


    所以，你可以看到长格式选项都以两个横杠（`--`）开头，而简写选项都以单个横杠（`-`）开头。当你使用单个横杠时，可以通过在后面添加代表这些选项的所有字母来调用多个命令选项。要查看最后一个选项的作用，请查阅手册页。


    ## Man pages


    这些是查询手册页的命令：


