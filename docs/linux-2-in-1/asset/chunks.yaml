    ## Copying a file or directory


    There are a few reasons why you might want to make a copy of a directory or file—perhaps
    you want to make a change to something, so you would make a copy of the original.
    That way, if anything goes wrong, you can easily go back to what it was. To do
    this we use the command `cp`, which means copy.


    ```bash

    cp [options] <source> <destination>

    ```


    This command has a few options available to it, and we’re going to talk about
    one of them in a minute. First though, check out the `cp` man page to see what
    other options are available.


    ```bashls

    example1 foo

    cp example1 sammy

    ls

    sammy example1 foo

    ```


    Did you spot that the source and the destination are both paths? What this means
    is that we can use absolute and relative paths to refer to them. Have a look at
    these few examples:


    ```bash

    cp /home/cleopatra/linuxpractice/example2 example3

    cp example2./../backups

    cp example2./../backups/example4

    cp /home/cleopatra/linuxpractice/example2 /otherdir/foo/example5

    ```


    So, when `cp` is used, the destination may be a path that goes to a directory
    or to a file. If it goes to a file, as in the first, third and fourth example
    lines above, a copy of the source will be created, and it will have the filename
    that was specified in the destination path. If we were going to a directory, then
    the file would be copied to the directory and will be named the same as the source.


    By default, `cp` can only copy a file so, if you wanted to copy a directory, you
    would need to use the option `-r`, which means recursive. Recursive means looking
    into a directory, at the files and the directories contained in it. To see the
    subdirectories, you do the same but from within each directory.


    ```bash

    ls

    sammy example1 foo

    cp foo foo2

    cp: omitting directory ''foo''

    cp -r foo foo2

    ls

    sammy example1 foo foo2

    ```


    In this example, we’re copying all the files and the directories from the `foo`
    directory to `foo2`.


    ## Moving a file or directory


    Moving a file is done quite simply with the `mv` command, which means move. It
    works in much the same way as `cp`, except that we can use it without `-r` for
    moving directories.


    ```bash

    mv [options] <source> <destination>

    ```


    ```bash

    ls

    sammy example1 foo foo2

    mkdir backups

    mv foo2 backups/foo3

    mv sammy backups/

    ls

    backups example1 foo

    ```


    Let’s look at that in more detail:


    - Line 3: a new directory has been created with the name `backups`.

    - Line 4: the directory called `foo2` was moved into the directory called `backups`
    and was renamed as `foo3`.

    - Line 7: the file called `sammy` was moved into the `backups`’ directory. It
    retained the same name because we didn’t give a destination name.


    Note that, once again, we used paths for source and destination, and these are
    absolute or relative paths.


    ## Renaming files and directories


    Just as we did with the `touch` command, the behavior of `mv` can also be used
    creatively to give us a different outcome. Normally, we use `mv` to move files
    or directories into a new directory. Part of that move includes renaming that
    file or directory. If we were to specify that the destination and the source are
    the same directory but named differently, that would be a creative use of `mv`
    for renaming directories or files.


    ```bash

    ls

    backups example1 foo

    mv foo foo3

    ls

    backups example1 foo3

    cd.

    mkdir linuxpractice/testdir

    mv linuxpractice/testdir /home/cleopatra/linuxpractice/frieda

    ls linuxpractice

    backups example1 foo3 frieda

    ```


    Let’s delve into this one:


    - Line 3: the file called `foo` was given a new name of `foo3`. Both paths are
    relative.

    - Line 6: the parent directory was moved. We did this so that in the next line,
    we could show how to run commands on a file or a directory from outside the directory
    they are contained in.

    - Line 8: the directory called `testdir` was renamed to `frieda`. We used a relative
    path to the source and an absolute path to the destination.


    ## Removing files


    Like we saw with `rmdir`, when you remove a file, you cannot undo it, so take
    care with what you are doing. The command for removing or deleting files is `rm`,
    which means remove.


    ```bash

    rm [options] <file>

    ```


    ```bash

    ls

    backups example1 foo3 frieda

    rm example1

    ls

    backups foo3 frieda

    ```


    ## Removing directories that aren’t empty


    The command `rm` can also be altered by several different options. Again, check
    out the `rm` man page to see what can be done, but one of the most useful options
    is `-r`. Like `cp`, it means recursive, and we use it with `rm` to remove specified
    directories and everything that’s contained inside them.


    ```bash

    ls

    backups foo3 frieda

    rmdir backups

    rmdir: failed to remove ''backups'': Directory not empty

    rm backups

    rm: cannot remove ''backups'': Is a directory

    rm -r backups

    ls

    foo3 frieda

    ```


    Another option you can use with `-r` is `i`, which means interactive. This will
    check with you before any file or directory is removed and provide you with an
    option to change your mind and cancel out the command.


    ## One last note


    I have already said this a few times, and I will keep on saying it: when we refer,
    on the command line, to files or directories, they are paths. They may be absolute
    paths or relative paths, and this is going to be the case pretty much all the
    time. I won’t remind you of this again, and the examples I use will not show this,
    so please remember it. Don’t forget to experiment with relative and absolute paths
    in the commands that we use, as each will provide a different output.


    ## Summary


    This is some of what you learned in this section:


    - `Mkdir`: stands for Make Directory and allows us to create new directories.

    - `Rdir`: stands for Remove Directory and allows us to delete directories.

    - `Touch`: allows us to create blank files.

    - `Cp`: stands for Copy and allows us to copy directors or files.

    - `Mv`: stands for Move and allows us to move or rename files or directories.

    - `Rm`: stands for Remove and allows us to delete files.

    - There is no option to undo anything you do, so delete and move files and directories
    with care.

    - Command line options: there are plenty of them, so use the man pages of each
    command to familiarize yourself with what there is and what you can do.


