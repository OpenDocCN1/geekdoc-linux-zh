  trans: '


    最流行的发行版有 Linux Mint、Arch Linux、Deepin、Ubuntu Linux、Debian、openSUSE 和 Fedora。这些“发行版”中的每一个对桌面环境布局都有不同的理解，但差异并不仅于此。某些发行版比其他版本需要更高的计算机技能，某些具有更现代的图形美学（也就是说，它们看起来比其他的更漂亮），而有些则是专门为在
    Linux 上进行编码和学习编程而构建的。


    找到适合你的 Linux 发行版完全取决于你的需求以及你认为重要的事情。如果你是一个真正的初学者，你会想要一个对新手友好的系统。那些是 Ubuntu、Deepin
    或 Linux Mint。如果你认为自己的技能水平中等，可以使用像 Fedora 或 Debian 这样的发行版。请记住，因为 Linux 是免费修改和分发的，随着你技能的提高，你可以获取不同的操作系统版本，以便不断根据你的需求对其进行定制。


    但是，当人们最终选定想要使用的 Linux 发行版时，首先面临的总是这项艰巨的安装操作系统任务。不要担心——Linux 是曾经上市的所有操作系统中安装过程最简单的之一。不仅如此，许多更新过的发行版现在都提供一种被称为“现场发行版”（live
    distribution）的东西，你只需将刻好的光盘或 U 盘插入你的技术设备，并在不对设备硬盘进行任何重大更改的情况下运行操作系统。


    是的，这意味着你可以获得所选 Linux 发行版的全部功能，而无需一开始就承诺安装。这对于正在尝试新系统的人来说太棒了，它让你在投入使用之前对产品进行“试驾”的能力。然后，当你找到了想要使用的发行版时，只需双击光盘或
    U 盘主文件中的“安装”图标，并按照提示的安装过程操作即可。


    # 5. Linux 命令行


    在本章中，我们将学习 Linux 命令行以及如何使用它在你的 Linux 操作系统上执行各种任务。在本章结束时，你将熟练掌握命令行中使用的基本命令，以及用于管理
    Linux 系统上文件和文件夹的命令。


    ### Bash Shell


    Linux 操作系统上可用的命令行工具被称为 `BASH`，它是 Bourne-Again Shell（再次出生的 Bourne Shell）的缩写。命令行工具本质上是一个接口，允许你以文本模式向计算机及其操作系统发出指令。在多年开发的许多类
    Unix 系统中有许多不同类型的 shell 接口，但红帽企业 Linux 7 使用的是 `bash` shell。`bash` shell 是以前流行的名为
    Bourne Shell 的 shell 的演进和改进版本。


    `bash` shell 会显示一个字符串，这意味着它正在等待用户输入命令。你看到的这个字符串被称为 shell 提示符（shell prompt）。对于非
    root 用户（超级用户）来说，shell 提示符以 `$` 符号结束。


    ```

    [student@desktop ~]$

    ```


    如果如果 root 用户登录了系统，shell 提示符以 `#` 符号结束。此符号的变化让用户快速知道自己是以 root 身份还是普通用户登录的，从而避免错误和意外。


    ```

    [root@desktop ~]#

    ```


    如果你需要一个简单的比较，Linux 操作系统中的 `bash` shell 类似于 Windows 操作系统提供的命令提示符（command prompt）工具，但你可以说
    `bash` 中使用的脚本语言与命令提示符中可以进行的脚本要复杂得多。`Bash` 还可以与 Windows 7 和 Windows Server 2008
    R2 提供的 PowerShell 工具相提并论。许多专业人士将 `bash` shell 称为一种非常强大的管理工具。你可以使用 `bash` shell
    提供的脚本语言在你的 Linux 系统上自动化许多任务。此外，`bash` shell 还有执行许多其他任务的选择，这些任务如果通过图形界面尝试是非常复杂的甚至是不可能的。


    `bash` shell 通过名为终端（terminal）的工具访问。终端的输入是你的键盘，输出设备是你的显示器。Linux 操作系统还提供了被称为虚拟控制台（virtual
    consoles）的东西，也可以用来访问 `bash` shell。因此，你在物理控制台上有多个虚拟控制台，每个虚拟控制台都可以作为一个终端。此外，你可以使用每个虚拟控制台为不同的用户创建登录会话。


    ### Shell 基础


    在 shell 提示符输入的命令分为三部分：


    1. 你想要运行的命令

    2. 定义命令行为的选项（Options）

    3. 参数（Arguments），即命令的目标


    命令基本上定义了你想要执行的程序。跟在命令后面的选项可以没有、一个或多个。选项控制命令的行为并定义命令将做什么。选项通常使用一个横杠或两个横杠。这样做是为了让我们将选项与参数区分开来。例如：`-a`
    或 `--all`。


    参数也跟在命令行命令后面，可以像选项一样是一个或多个。参数指示了命令应该操作目标。


    让我们来看一个示例命令：


    ```bash

    usermod -L John

    ```


    此示例中的命令是 `usermod`。

    选项是 `-L`。

    参数是 `John`。


    这条命令的作用是锁定系统上用户 `John` 的密码。


    为了在命令行命令上有效操作，用户知道一个命令可以使用哪些选项是至关重要的。如果你运行任何命令并带有 `--help` 选项，你将获得一组可以与该命令传递的选项。因此，没有必要背诵所有命令要使用的所有选项。列表还会告诉你每个选项的作用。


    用法说明（use statements）有时看起来非常困难且难以于阅读。一旦你习惯了某些约定，阅读语句就会变得简单得多。


    *   选项被方括号 `[ ]` 包围

    *   如果命令后面跟着 `…`，它指定了属于该类型的任意长度的项目列表

    *   如果有多个项目，并且如果用管道符 `|` 将它们隔开，则意味着你只能指定其中一个

    *   变量使用带有角括号 `<` 的文本表示。所以，如果你看到 `<filename>`，你必须将其替换为你想要传递的文件名


    例如，检查下面的命令：


    ```bash

    [student@desktop ~]$ date --help


    date [OPTION]... [+FORMAT]

    ```


    这表示命令 `date` 接收由 `[OPTION]...` 表示的选项以及另一个选项 `[FORMAT]`，后者将以 `+` 符号为前缀。


    ### 在 Bash Shell 上执行命令


    Bourne Again Shell（即 `bash`）负责解释用户在 shell 提示符上输入的命令。我们已经学习了在 shell 提示符处输入的字符串是如何被分为三个部分的：命令、选项和参数。你输入到
    shell 中的每一个单词都使用空格隔开。系统中已安装的程序由你输入的每个命令定义，并且每个命令都有与其关联的选项和参数。


