    注意：你在目标位置指定的文件应该是唯一的文件。如果你指定了一个已存在的文件，你将覆盖该文件的内容。


    ```bash

    [student@desktop ~]$ cd Documents

    [student@desktop Documents]$ cp one.txt two.txt

    ```

    这将将 `one.txt` 的内容复制到 `two.txt`。


    同样地，你可以像下面所示，从当前目录复制到另一个目录下的文件。


    ```bash

    [student@desktop ~]$ cp one.txt Documents/two.txt

    ```

    这将将家目录下的 `one.txt` 内容复制到 Documents 子目录下的 `two.txt`。


    # 移动文件


    `mv` 命令可以用于两种操作。如果你在同一目录中使用它，它将重命名文件。如果你指定了另一个目录，它会将文件移动到目标目录。重命名或移动文件时，文件内容会被保留。还需要注意，如果文件巨大，从一个目录移动到另一个目录可能需要更长时间。


    ```bash

    [student@desktop ~]$ ls

    Hello.txt

    [student@desktop ~]$ mv Hello.txt Bye.txt

    [student@desktop ~]$ ls

    Bye.txt

    ```

    你可以看到，在这个示例中，由于我们是在同一目录下进行操作，`mv` 命令只是将 `Hello.txt` 文件重命名为 `Bye.txt`。


    ```bash

    [student@desktop ~]$ ls

    Hello.txt

    [student@desktop ~]$ mv Hello.txt Documents

    [student@desktop ~]$ ls Documents

    Hello.txt

    ```

    在这个示例中，你将看到 `mv` 命令将 `Hello.txt` 文件从家目录移动到了 Documents 子目录。


    # 删除文件和目录


    `rm` 命令可用于删除文件。要删除目录，你需要使用 `rm -r`，它将删除整个路径上的目录、子目录和文件。


    注意：在命令行操作时，没有所谓的垃圾箱或回收站。如果你删除了某些东西，它将被永久删除。


    ```bash

    [student@desktop ~]$ ls

    File1.txt Directory1

    [student@desktop ~]$ rm file1

    [student@desktop ~]$ ls

    Directory1

    [student@desktop ~]$ rm -r Directory1

    [student@desktop ~]$ ls

    ```

    上面的命令演示了如何如何使用 `rm` 命令和 `-r` 选项删除文件和目录。


    另外注意，还有一个 `rmdir` 命令，只要目录是完全空的，就可以用来删除目录。


    # 文件通配符 (Globbing)


    当你处理许多文件时，文件管理可能会变得非常混乱。为了克服这一障碍，Linux 提供了一种名为文件通配符（globbing）的功能，也称为路径名扩展。它使用一种名为模式匹配的技术（也称为通配符），通过使用元字符来实现，并允许同时对多个文件执行操作。


    ## 使用 `*` 和 `?` 进行模式匹配


    ```bash

    [student@desktop ~]$ ls a*

    alpha apple

    ```

    你可以看到，`*` 用作通配符匹配模式，匹配任何以 `a` 开头的文件。


    你可以尝试将起始位置放置在不同的位置，例如 `*a` 和 `*a*`。


    ```bash

    [student@desktop ~]$ ls ???

    aretabmap

    ```

    问号的数量定义了文件名中的字符数。输出将显示所有文件名为 3 个字符的文件。你也可以尝试增加问号。


    ## 波浪号扩展


    波浪符号 `~` 后跟一个斜杠 `/` 指向活动用户的家目录。它后面可以跟目录名称，并可与 `cd` 和 `ls` 等命令配合使用。


    ```bash

    [student@desktop ~]$ ls ~/Documents

    file.txthello.txt

    [student@desktop ~]$ cd Documents

    [student@desktop Documents]$ cd ~/

    [student@desktop ~]$

    ```


    ## 大括号扩展


    当命令中有某些内容且你不希望重复输入时，可以使用大括号命令。它可以用于逗号分隔的字符串以及具有顺序性质的表达式。你还可以使用嵌套的大括号。


    ```bash

    [student@desktop ~]$ echo {sunday, monday, tuesday}.log

    sunday.log monday.logtuesday.log

    [student@desktop ~]$ echo file{1..3}.txt

    file1.txtfile2.txtfile3.txt

    [student@desktop ~]$ echo file{a{1, 2}, b, c}.txt

    filea1.txtfilea2.txtfileb.txtfilec.txt

    ```

    到此这里本章结束，你已经学习了如何使用 Linux 系统的命令行界面通过简单命令来管理文件和目录。这些命令大部分适用于任何版本的 Linux 操作系统，而不仅仅是
    Red Hat Enterprise Linux 7。


    # 6. Linux 操作系统的优势


    在本章中，我们将查看 Linux 的主要优势。这里并没有列出全部，但包含了该操作系统的主要优点。


    ### 1. Linux 更快

    是的，如此。Linux 内核操作系统在性能方面确实优于 Windows。这就是为什么 Web 服务器通常配备此系统。


    当然，并不是每个发行版都自榜性能。例如，闻名的 Ubuntu 如果不设置，运行效果会比同样的 Windows 7 差得多。但有 `Xubuntu` 和 `Lubuntu`，它们不会让你失望。


    ### 2. Linux 具有更好的可定制性

    Windows 本身并没有提供足够的余地来利用预装工具来更改外观。它们提供的帮助有限。但 Linux 不同！


    我使用这种环境——我是一个活跃的 Linux 用户、程序员以及 Hacker 网站的创始人。今天我想告诉你们为什么值得切换到基于 Linux 的操作系统。


    ### 3. 大多数发行版都是免费的

    我考虑过的一点……但实际上，对于组织来说这是一个决定性因素。几乎所有的发行版即使用于商业用途也是免费分发的。你不需要激活，只需下载并安装即可。


    ### 4. Linux 是开源的

    由于 Linux 本身是免费的，它有许多基于开源原则构建的工具。你不仅需要为程序付费，还可以对它们进行修改。这解释了已安装程序的透明性——在官方仓库中，恶意软件无法运行的。


    ### 5. Linux 更安全

    Linux 根源于史前的 UNIX 系统——从那时起，许多原则保持不变。由于所有代码都是底层的，它不依赖于任何额外的库，设备很难被破解。而且 Linux 用户数太少，黑客不会关注其作为攻击平台。


    ### 6. 无需绑定数百个账户

    如果微软 Windows 要求用户绑定多个账户，那么 Linux 中没有这种事情。首先，账户本身是可选的，其应用程序数量可以忽略不计。此外，即使需要，几乎所有与
    Linux 相关的服务都绑定到 Ubuntu One。


    ### 7. 随心选择！

    你是设计师？作家？画家？翻译员？那么，肯定有一套为你准备好的发行版，其中包含了所有工作所需的程序！


    如果你在 Windows 上必须下载所有内容，那么许多 Linux 发行版已经针对特定需求进行了定制。例如，Ubuntu Studio 适用于小型（或大型）工作室，TuxTrans
    适用于翻译，Fedora Design Suite 适用于艺术家，KXStudio 适用于音乐家。


    ### 8. 稳定性

    如果 Windows 需要大量的更新，且计算机内存每六个月就会满，这种情况在 Linux 中不会发生。Linux 没有通常意义上的注册表，所有安装的包和程序都容易控制。所以，告别频繁重装吧！


    ### 9. Linux 轻量化


