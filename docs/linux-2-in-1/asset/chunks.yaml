  trans: '

    现在让我们来学习如何在 Linux 文件系统中定位和访问文件。在本节中，我们将学习如何使用绝对文件路径、更改我们当前工作的目录，并学习可以帮助我们确定目录位置和内容的命令。


    ## 绝对路径


    绝对路径是指一个完全限定的名称。它从根目录 `/` 开始，随后是每个子目录，直到到达一个特定的文件。Linux 系统中存在的每个文件都有一个定义的绝对路径，可以使用简单的规则进行识别。如果路径的第一个字符是
    `/`，则意味着它是绝对路径名。例如，系统消息记录在一个名为 `messages` 的文件中。`messages` 的绝对路径是 `/var/log/messages`。系统中也存在相对路径名，因为绝对路径名有时会变得非常长，难以输入。当你首次登录
    Linux 系统时，你会被自动放置在主目录位置。系统也有一个初始目录。之后，用户和系统都会根据需要导航到其他目录。用户或系统进程的当前位置被称为工作目录。


    ## 相对路径


    相对路径是指到达某个文件所需的唯一路径，但此路径仅相对于你当前所在的目录，且不以 `/` 开头。上述规则非常简单：如果路径不以 `/` 开头，它就是该文件的相对路径。例如，如果你已经在
    `/var` 目录下工作，那么 `messages` 的相对路径将是 `log/messages`。


    ## 路径导航


    你可以使用 `pwd` 命令，它将输出你当前工作目录的路径。一旦知道了这些信息，你就可以使用相对路径将其切换到不同的目录。`ls` 命令配合目录路径使用时，会指定该目录的内容。如果你不指定目录，它将列出你当前所在目录的内容。


    ```

    student@desktop ~]$ pwd

    /home/student

    ```


    ```

    student@desktop ~]$ ls

    Documents

    ```


    你可以使用 `cd` 命令来切换目录。例如，如果你在 `/home/student` 目录并想进入 `Music` 目录，可以使用相对路径到达那里。然而，如果你想进入
    `Downloads` 目录，则需要使用绝对路径。


    ```

    student@desktop ~]$ cd Music

    student@desktop Music]$ pwd

    /home/student/Music

    ```


    ```

    student@desktop ~]$ cd /home/student/Downloads

    student@desktop Downloads]$ pwd

    /home/student/Downloads

    ```


    如你所见，为了方便， shell 提示符将显示你当前工作目录的最后一部分。如果你在 `/home/student/Music`，shell 提示符只显示 `Music`。`cd`
    命令用于在目录间导航。如果你使用相对路径或绝对路径作为参数 cd` 参数，你的工作目录将切换到该路径。你还可以使用 `cd ..`，这会带你回到之前工作的目录；如果你再次使用它，你将回到切换出的那个目录。如果你一直使用它，你将在固定目录之间交替切换。


    `touch` 命令是另一个简单的命令，如果应用于已存在的文件，它会更新其时间戳而不修改文件内容。如果通过传递不存在的文件名作为参数使用，它将创建一个该文件名的空文件。这允许新用户触摸并创建文件，因为这些文件不会以任何方式危害系统。


    ```

    student@desktop ~]$ touch Documents/test.txt

    ```


    这将在 `Documents` 子目录中创建一个名为 `test.txt` 的空文本文件。`ls` 命令列出你所在目录的文件和目录。如果你向 `ls` 命令传递一个目录路径，它将列出该路径下的文件和目录。`ls`
    命令可以配合选项使用，进一步帮助列出文件：`-l` 将列出所有文件及其目录的时间戳和权限，它还会列出该文件的所有者和组`-a` 可以与 `-l` 结合使用，额外列出隐藏的文件和目录`-R`
    与上述两个选项配合将递归列出所有子目录的文件和目录。当你列出文件和目录时，你会发现前两个列表是 `.` 和 `..`。`.` 表示当前目录，`..` 表示父目录，这些存在于系统的每个目录中。


    ## 使用命令行进行文件管理


    当我们谈论文件管理时，我们在讨论如何创建、删除、复制和移动文件。同样的动作操作也可以在目录上执行。了解当前工作目录非常重要，这样当你管理文件和目录时，你就知道是否需要指定相对路径或绝对路径。让我们来看几个可以用于文件管理的命令。


    | 活动 | 单源 | 多源 |

    | :--- | :--- | :--- |

    | 复制文件 | `cp file1 file2` | `cp file1 file2 file3 dir` |

    | 移动文件 | `mv file1 file2` | `mv file1 file2 file3 dir` |

    | 删除文件 | `rm file1` | `rm -f file1 file2 file3` |

    | 创建目录 | `mkdir dir` | `mkdir -p par1/par2/dir` |

    | 复制目录 | `cp -r dir1 dir2` | `cp -r dir1 dir2 dir3 dir4` |

    | 移动目录 | `mv dir1 dir2` | `mv dir1 dir2 dir3 dir4` |

    | 删除目录 | `rm -r dir1` | `rm -rf dir2 dir3` |


    `mv file1 file2`：此操作是重命名。

    `cp -r dir1 dir2`

    `rm -r dir1`：`-r` 用于递归处理目录。

    `mv dir1 dir2`：如果 `dir2` 存在，则将 `dir1` 的内容移动到 `dir2`。如果不存在，则将 `dir1` 重命名为 `dir2`。

