- fmt: "\nWhen you have typed a command on the shell prompt along with the options\
    \ and arguments and are ready to run it, you can press the Enter key on the keyboard,\
    \ which will execute that command. You will then see the output of that command\
    \ displayed on the terminal and when the output completes, you will be presented\
    \ with the shell prompt again, which is an indication that the previous command\
    \ has been executed successfully. If you wish to type more than one command on\
    \ a single line, you can use a semicolon to separate the commands.\n\nLet us go\
    \ through some simple commands that are used on a daily routine on the command\
    \ line in Red Hat Enterprise Linux 7 and other Linux based operating systems.\n\
    \nThe `date` command will display the current date and time of the system. You\
    \ can also use this command to set the time of the system. If you are passing\
    \ an argument with the `+` sign for the `date` command, it indicates the format\
    \ in, which you want the date to be displayed on the output.\n\n```bash\n[student@desktop\
    \ ~]$ date\nSat Aug 5 08:15:30 GMT 2019\n\n[student@desktop ~]$ date +%R\n08:15\n\
    \n[student@desktop ~]$ date +%x\n08/05/2019\n```\n\nThe `passwd` command can be\
    \ used to change the password of a user. You will, however, need to specify the\
    \ original password for the given user before you can set a new password. The\
    \ command requires you to specify a strong password, which makes it necessary\
    \ to include letter belonging to lowercase and uppercase, numbers, and symbols.\
    \ You also need to ensure that the password being specified is not a word in the\
    \ dictionary. The root user has the option to change the password of any other\
    \ user on the system.\n\n```bash\n[student@desktop ~]$ passwd\nChanging password\
    \ for user student.\nChanging password for student.\n(current) UNIX password:\
    \ type old password here\nNew password: Specify new password here\nRetype new\
    \ password: Type new password again\npasswd: all authentication tokens updated\
    \ successfully.\n```\n\nFile types and extensions are not specified in a Linux\
    \ operating system. The `file` command can scan any file and tell you the kind\
    \ of file it is. The file you want to classify needs to be passed as an argument\
    \ to the `file` command.\n\n```bash\n[student@desktop ~]$ file /etc/passwd\n/etc/passwd:\
    \ ASCII text\n```\n\nIf you are passing a folder/directory as an argument to the\
    \ `file` command, it will tell you that it is a directory.\n\n```bash\n[student@desktop\
    \ ~]$ file /home\n/home: directory\n```\n\nThe next set of commands are `head`\
    \ and `tail`, which print the first ten lines and the last ten lines of a file\
    \ respectively. Both these commands can be combined with the option `-n`, which\
    \ can be used to specify the number of lines that you want to be displayed.\n\n\
    ```bash\n[student@desktop ~]$ head /etc/passwd\nThis will print the first 10 lines\
    \ that are there in the passwd file.\n\n[student@desktop ~]$ tail - n /etc/passwd\n\
    This will print the last 3 lines that are there in the passwd file.\n```\n\nThe\
    \ `wc` command is used to count lines, words and characters in a file that is\
    \ passed as an argument. It supports options such as `-l`, `-w`, `-c`, which stands\
    \ for lines, words, and characters respectively.\n\n```bash\n[student@desktop\
    \ ~]$ wc /etc/passwd\n30 75 2009 /etc/passwd\n```\nThis shows that there are 30\
    \ lines, 75 words and 2009 characters in the file `passwd`.\n\nIf you pass the\
    \ `-l`, `-c`, `-w` options along with the `wc` command, it will only display the\
    \ count of lines, words or characters based on, which option you have passed.\n\
    \nThe `history` command displays all the commands that you have typed previously\
    \ along with the command number. You can use the `!` mark along with the command\
    \ number to expand what was typed in that command along with the output.\n\n```bash\n\
    [student@desktop ~]$ history\n1 clear\n2 who\n3 pwd\n\n[student@desktop ~]$ !3\n\
    /home/student\n```\nThis shows that we used `!3` to expand the `pwd` command,\
    \ which shows the present working directory for, which the output was `/home/student`,\
    \ which was the home directory of the student user.\n\nYou can use the arrow keys\
    \ to navigate through the output given by the `history` command. Up Arrow will\
    \ take you to the commands on top and Down Arrow will take you to the commands\
    \ below. Using the Right Arrow and the Left Arrow keys, you can move on the current\
    \ command and edit it.\n\n### Shortcuts to Edit the Command Line\n\nThere is an\
    \ editing feature available on the command line in `bash` when you are interacting\
    \ with `bash`. This helps you to move around the current command that you are\
    \ typing so that you can make edits. We have already seen how we can use the arrow\
    \ keys with the `history` command to move through commands. The following list\
    \ will help you use edits when you are working on a command.\n\n- `Ctrl+a`: This\
    \ will take your cursor to the start of the command line\n- `Ctrl+e`: This will\
    \ take your cursor to the end of the command line\n- `Ctrl+u`: Clear the line\
    \ from where the cursor is to the start of the command line\n- `Ctrl+k`: Clear\
    \ the line from where the cursor is to the end of the command line\n- `Ctrl+Left\
    \ Arrow`: Take the cursor to the start of the previous word\n- `Ctrl+Right Arrow`:\
    \ Take the cursor to the start of the next word\n- `Ctrl+r`: Search for patterns\
    \ in the history list of commands used\n\n### Managing Files using Commands on\
    \ the Command Line\n\nIn this section, we will learn to execute commands that\
    \ are needed to manage files and directories in Linux. You will learn how to move,\
    \ copy, create, delete and organize files and directories using commands on the\
    \ `bash` shell prompt.\n\n### Linux File System Hierarchy\n\nLet us first understand\
    \ the hierarchy of the file system in a Linux operating system. The Linux file\
    \ system has a tree, which has directories forming the file system hierarchy.\
    \ However, this is an inverted tree as the root starts from the top of the hierarchy\
    \ in Linux and then the branches, which are directories and subdirectories extend\
    \ below the root.\n\nThe root directory denoted by `/` sits at the top of the\
    \ file system hierarchy. Although the root is denoted by `/` do note that the\
    \ slash character `/` is also used to separate directories and filenames. As an\
    \ example, take `etc`, which is a subdirectory of the root and is denoted by `/etc`.\
    \ Similarly, if there is a file named `logs` in the `/etc` directory, we will\
    \ reference it as `/etc/logs`.\n\nThe subdirectories of root `/` are standard\
    \ and store files based on their specific purpose. For example, files under `/boot`\
    \ will contain files, which are needed to execute the boot process of the Linux\
    \ operating system.\n\nWe will now go through the important directories in the\
    \ Red Hat Enterprise Linux 7 file system hierarchy.\n\n- `/usr`: The shared libraries,\
    \ which are installed with the software, are stored in this directory. It has\
    \ subdirectories further, which are important such as\n    - `/usr/bin`: User\
    \ command files\n    - `/usr/sbin`: Commands used in system administration\n \
    \   - `/usr/local`: Files of software that has been customized locally\n- `/etc`:\
    \ System configuration files are stored here.\n- `/var`: Files that change dynamically\
    \ such as databases, log files, etc. are stored in this directory.\n- `/run`:\
    \ This directory contains files that were created during runtime and were created\
    \ since the last boot. The files created here get recreated on the next boot.\n\
    - `/home`: This is the home directory for all users that are created on the system.\
    \ The users get to store their personal data and configurations under their specific\
    \ home path.\n- `/root`: This is the home directory of the root user who is also\
    \ the superuser of the system.\n- `/tmp`: This is a directory used to store temporary\
    \ files. Files, which are older than 10 days and have not been accessed or modified\
    \ automatically get deleted. There is another directory at `/var/tmp` where file\
    \ not accessed or modified in 30 days get deleted automatically.\n- `/boot`: The\
    \ files required to start the boot process are stored here.\n- `/dev`: Contains\
    \ files, which reference to hardware devices on the system.\n"
  raw: "When you have typed a command on the shell prompt along with the options and\
    \ arguments and are ready to run it, you can press the Enter key on the keyboard,\
    \ which will execute that command. You will then see the output of that command\
    \ displayed on the terminal and when the output completes, you will be presented\
    \ with the shell prompt again, which is an indication that the previous command\
    \ has been executed successfully. If you wish to type more than one command on\
    \ a single line, you can use a semicolon to separate the commands. \n\nLet us\
    \ go through some simple commands that are used on a daily routine on the command\
    \ line in Red Hat Enterprise Linux 7 and other Linux based operating systems. \n\
    \nThe date command will display the current date and time of the system. You can\
    \ also use this command to set the time of the system. If you are passing an argument\
    \ with the + sign for the date command, it indicates the format in, which you\
    \ want the date to be displayed on the output. \n\n[student@desktop ~]$ date\n\
    \nSat Aug 5 08:15:30 GMT 2019\n\n[student@desktop ~]$ date +%R\n\n08:15\n\n[student@desktop\
    \ ~]$ date +%x\n\n08/05/2019\n\nThe passwd command can be used to change the password\
    \ of a user. You will, however, need to specify the original password for the\
    \ given user before you can set a new password. The command requires you to specify\
    \ a strong password, which makes it necessary to include letter belonging to lowercase\
    \ and uppercase, numbers, and symbols. You also need to ensure that the password\
    \ being specified is not a word in the dictionary. The root user has the option\
    \ to change the password of any other user on the system.\n\n[student@desktop\
    \ ~]$ passwd\n\nChanging password for user student.\n\nChanging password for student.\n\
    \n(current) UNIX password: type old password here\n\nNew password: Specify new\
    \ password here\n\nRetype new password: Type new password again\n\npasswd: all\
    \ authentication tokens updated successfully.\n\nFile types and extensions are\
    \ not specified in a Linux operating system. The file command can scan any file\
    \ and tell you the kind of file it is. The file you want to classify needs to\
    \ be passed as an argument to the file command. \n\n[student@desktop ~]$ file\
    \ /etc/passwd\n\n/etc/passwd: ASCII text\n\nIf you are passing a folder/directory\
    \ as an argument to the file command, it will tell you that it is a directory. \n\
    \n[student@desktop ~]$ file /home\n\n/home: directory\n\nThe next set of commands\
    \ are head and tail, which print the first ten lines and the last ten lines of\
    \ a file respectively. Both these commands can be combined with the option -n,\
    \ which can be used to specify the number of lines that you want to be displayed.\n\
    \n[student@desktop ~]$ head /etc/passwd\n\nThis will print the first 10 lines\
    \ that are there in the passwd file.\n\n[student@desktop ~]$ tail - n /etc/passwd\n\
    \nThis will print the last 3 lines that are there in the passwd file.\n\nThe wc\
    \ command is used to count lines, words and characters in a file that is passed\
    \ as an argument. It supports options such as -l, -w, -c, which stands for lines,\
    \ words, and characters respectively. \n\n[student@desktop ~]$ wc /etc/passwd\n\
    \n30 75 2009 /etc/passwd\n\nThis shows that there are 30 lines, 75 words and 2009\
    \ characters in the file passwd.\n\nIf you pass the -l, -c, -w options along with\
    \ the wc command, it will only display the count of lines, words or characters\
    \ based on, which option you have passed. \n\nThe history command displays all\
    \ the commands that you have typed previously along with the command number. You\
    \ can use the ! mark along with the command number to expand what was typed in\
    \ that command along with the output. \n\n[student@desktop ~]$ history\n\n1 clear\n\
    \n2 who\n\n3 pwd\n\n[student@desktop ~]$ !3\n\n/home/student\n\nThis shows that\
    \ we used !3 to expand the pwd command, which shows the present working directory\
    \ for, which the output was /home/student, which was the home directory of the\
    \ student user. \n\nYou can use the arrow keys to navigate through the output\
    \ given by the history command. Up Arrow will take you to the commands on top\
    \ and Down Arrow will take you to the commands below. Using the Right Arrow and\
    \ the Left Arrow keys, you can move on the current command and edit it. \n\n Shortcuts\
    \ to Edit the Command Line\n\nThere is an editing feature available on the command\
    \ line in bash when you are interacting with bash. This helps you to move around\
    \ the current command that you are typing so that you can make edits. We have\
    \ already seen how we can use the arrow keys with the history command to move\
    \ through commands. The following list will help you use edits when you are working\
    \ on a command. \n\nCtrl+aThis will take your cursor to the start of the command\
    \ line\n\nCtrl+eThis will take your cursor to the end of the command line\n\n\
    Ctrl+uClear the line from where the cursor is to the start of the command line\n\
    \nCtrl+kClear the line from where the cursor is to the end of the command line\n\
    \nCtrl+Left ArrowTake the cursor to the start of the previous word\n\nCtrl+Right\
    \ ArrowTake the cursor to the start of the next word\n\nCtrl+rSearch for patterns\
    \ in the history list of commands used\n\n Managing Files using Commands on the\
    \ Command Line\n\nIn this section, we will learn to execute commands that are\
    \ needed to manage files and directories in Linux. You will learn how to move,\
    \ copy, create, delete and organize files and directories using commands on the\
    \ bash shell prompt. \n\n Linux File System Hierarchy\n\nLet us first understand\
    \ the hierarchy of the file system in a Linux operating system. The Linux file\
    \ system has a tree, which has directories forming the file system hierarchy.\
    \ However, this is an inverted tree as the root starts from the top of the hierarchy\
    \ in Linux and then the branches, which are directories and subdirectories extend\
    \ below the root. \n\nThe root directory denoted by / sits at the top of the file\
    \ system hierarchy. Although the root is denoted by / do note that the slash character\
    \ / is also used to separate directories and filenames. As an example, take etc,\
    \ which is a subdirectory of the root and is denoted by /etc. Similarly, if there\
    \ is a file named logs in the /etc directory, we will reference it as /etc/logs \n\
    \nThe subdirectories of root / are standard and store files based on their specific\
    \ purpose. For example, files under /boot will contain files, which are needed\
    \ to execute the boot process of the Linux operating system. \n\nWe will now go\
    \ through the important directories in the Red Hat Enterprise Linux 7 file system\
    \ hierarchy. \n\n/usr\n\nThe shared libraries, which are installed with the software,\
    \ are stored in this directory. It has subdirectories further, which are important\
    \ such as \n\n/usr/bin: User command files\n\n/usr/sbin: Commands used in system\
    \ administration\n\n/usr/local: Files of software that has been customized locally\n\
    \n/etc\n\nSystem configuration files are stored here.\n\n/var\n\nFiles that change\
    \ dynamically such as databases, log files, etc. are stored in this directory. \n\
    \n/run\n\nThis directory contains files that were created during runtime and were\
    \ created since the last boot. The files created here get recreated on the next\
    \ boot. \n\n/home\n\nThis is the home directory for all users that are created\
    \ on the system. The users get to store their personal data and configurations\
    \ under their specific home path.\n\n/root\n\nThis is the home directory of the\
    \ root user who is also the superuser of the system. \n\n/tmp\n\nThis is a directory\
    \ used to store temporary files. Files, which are older than 10 days and have\
    \ not been accessed or modified automatically get deleted. There is another directory\
    \ at /var/tmp where file not accessed or modified in 30 days get deleted automatically. \n\
    \n/boot\n\nThe files required to start the boot process are stored here. \n\n\
    /dev\n\nContains files, which reference to hardware devices on the system. "
