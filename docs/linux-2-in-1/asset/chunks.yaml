  trans: '


    有一个有趣的命令是 `rev`，它可以反转显示屏幕上的每一行内容。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-22.png](img/image00295.jpeg)


    ### sort


    为了按照字母顺序将文本文件/文档的内容输出到终端，可以使用 `sort` 命令。如果使用 `sort -r`，则会按字母反向顺序进行排序。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-23.png](img/image00296.jpeg)


    ### wc


    如果你知道文件的行数、字符数或单词数，可以使用 `wc` (wordcount) 命令。通过 `-l` 获取行数，通过 `-c` 获取字符数，通过 `-w`
    参数获取单词数。如果在不带任何参数的情况下使用 `wc`，它会显示所有统计。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-24.png](img/image00297.jpeg)


    ### nl


    之前我们通过 `cat -n` 来对打印过程进行编号，现在也可以用 `nl` 命令来实现。例如，在对 hacker 文件进行行编号时，可以使用 `nl hacker`
    命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-25.png](img/image00298.jpeg)


    如果想对一个长行的文本文件进行编号，并同时查看开头的几行，可以使用 `nl [TextFile] | head -n [number]` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-25-1.png](img/image00299.jpeg)


    同样，如果要从最后提取几行，则使用 `tail` 命令代替 `head`。


    ### pr


    为了分割页面文档的内容，我们使用 `pr` 命令。例如，为了查看一个名为 `list` 的文件并分割其页面内容，可以使用 `pr list` 命令。因此，如果你对其进行打印，将获得更整齐的输出。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-26.png](img/image00300.jpeg)


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-27.png](img/image00301.jpeg)


    ### paste


    为了将两个或多个位于对应列的文件按空格合并，可以使用 `paste` 命令。例如，假设我们有两个名为 `LISTA` 和 `LISTB` 的文件。为了并列列出这些文件的行，可以使用
    `paste LISTA LISTB` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-28.png](img/image00302.jpeg)


    如果你愿意，可以合并这些文件的内容并重定向到新文件。例如，当我们使用 `paste LIST LISTB > LISTC` 命令时，两个文件的内容将并列显示，同时创建一个名为
    `LISTC` 的新文件并保存。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-29.png](img/image00303.jpeg)


    ### grep


    要在文件或命令输出中搜索表达式（字符串），可以使用 `grep` 命令。在看命令示例之前，让我们来看一些重要的参数。


    - `-v`: 反转命令行行为，列出**不包含**所寻单词的行。

    - `-i`: 搜索时不区分大小写。

    - `-r`: 在给定目录的子目录中搜索。

    - `-n`: 显示搜索词所在的行号。

    - `-c`: 指定索引表示你查找的单词出现的次数。

    - `-l`: 在合适的模板列列出文件名。


    让我们举个简单的例子。例如，在 `/etc/passwd` 文件中，列出包含 zeynep 的行，可以使用 `grep zeynep /etc/passwd`
    或 `cat /etc/passwd | grep zeynep` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-30.png](img/image00304.jpeg)


    现在尝试 `cat LIST |grep -ni ali` 命令。通过这个命令：在 `LIST` 文件中，不区分大小写地搜索 ali 表达式并显示行号。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-31.png](img/image00305.jpeg)


    另一个例子让我们检查 `grep -ri " .` 命令。通过这个命令：递归地（包括子目录）在当前目录中，不区分大小写地搜索文件行。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-32.png](img/image00306.jpeg)


    接下来的例子是 `grep -c "ali" LIST` 命令：在 `LIST` 文件中，我们学习 ali 出现了多少次。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-33.png](img/image00307.jpeg)


    我们的最后一个例子，接下来的例子中我没有放整个屏幕图像：


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-34.png](img/image00308.jpeg)


    ### cut


    在要检查的文件中查看某些行，我们使用 `cut` 命令。例如，列出第 1 和第 7 字段：`cut -d ":" -f 1,7 /etc/passwd |
    head -n 5`


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-35.png](img/image00309.jpeg)


    在这里，我们通过 `-d` 指定字段分隔符，可以使用管道符 `|`。例如，通过 `cat /passwd | cut -d ":" -f 1,7` 可以获得相同的结果。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-36.png](img/image00310.jpeg)


    因为命令输出很长，我没有放整个屏幕。要在开头或结尾列出行，仍然可以使用 `head` 和 `tail` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-37.png](img/image00311.jpeg)


    ### tr


    早些时候我们提到了 `tr` 命令，让我们来看几个例子。通过这个命令，我们可以对文件的字符进行更改。这些操作用于更改小写字母或反转并删除字符。例如，对于 `LIST`
    文本文件，将小写字母转换为大写，可以使用 `cat LIST | tr a-z A-Z` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-38.png](img/image00312.jpeg)


    我们讨论过重定向运算符 `>` 和 `>>`。除此之外，我们还有 `<` 运算符。与其他不同，这些运算符将文件作为输入。读取文件内容并启用相关操作。现在，让我们结合使用
    `tr` 命令、`>` 和 `<``。例如，使用命令 `tr a-z A-Z < LIST > NEW_LISTA`。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-39.png](img/image00313.jpeg)


    通过我们的命令，我们将 `LIST` 文件作为输入，将文本中的小写字母转换为大写创建 `NEW_LISTA` 文件并写入文件。如果配合 `d` 使用 `tr`
    命令，指定的字符将被忽略。例如，当我们使用 `cat LISTA | tr -d A,e` 命令时，`LISTA` 文件中的 `A` 和 `e` 字符将被忽略。


    ### cmp


    我们可以比较文件的命令之一是 `cmp` 命令。例如，我使用 `cmp hacker test` 命令比较两个名为 hacker 和 test 的文件。结果中，它将显示文件之间的差异、首次差异发生的行号以及字节数。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-40.png](img/image00314.jpeg)


    '
- fmt: '

    There are a few parameters to use this command but you can experiment with them
    to examine `man cmp`. For example, when you use the `-l` parameter byte number
    for each of the differences, and different byte values to standard output (screen
    / terminal) will be sent.


    ### diff


    Again, it is a command used to compare files. If a comparison between the two
    files `diff`, if the comparison between three files `diff3` command should be
    used. For example, to see again the difference between hacker and test files,
    `diff hacker test` command is used.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-41.png](Images/image00315.jpeg)


    Now, to compare two files `diff3 hacker test linuxcmd` command and see differences
    between hacker, test and linuxcmd.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-42.png](Images/image00316.jpeg)


    If you use `-y` with `diff` command, the output will be projected on the screen
    side by side.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-43.png](Images/image00317.jpeg)


    Not only files, `diff` command can also be used to compare directories. For example,
    with `diff -r zeyno /home` command, `zeyno` and `/home` directories recursive
    `-r` are compared and the differences will be listed.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-44.png](Images/image00318.jpeg)


    ### find


    From time to time, you know only part of the name, but there will be files and
    directories that you do not remember which directory. To find these files and
    perform various actions related to the them, we use `find` command.


    Using pattern is `find [file_path] [search_phrase]`. So, we type what we''re gonna
    do it in the first directory search, then we define the search expression with
    `-name`. For example to list conf files under `/etc` directory, we can use `find
    /etc -name *.conf` command.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\1.png](Images/image00319.jpeg)


    Another example is with `find /etc -name * apache *` again, we search files include
    apache word under `/etc` directory.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\2.png](Images/image00320.jpeg)


    We can use some parameters when making a search to facilitate our work and will
    help us get the results we want:


    - `perm 755` (Access to the permission 755 file / directories)

    - `-type f` (Files)

    - `-type d` (Directories)

    - `-size +100k` (Files that are larger than 100 Kbytes)

    - `-ctime 3` (Files / directories which amended exactly 3 days ago)

    - `-ctime -7` (The files/directories that have changed for a shorter time before
    7 days)

    - `-ctime +7` (The files/directories that have changed for a longer time before
    7 days)


    #### Let’s make some examples


    For example, we want to list files that `find /root -type f -name ''*.txt''` command
    in the working directory and the extension txt. Working directory is the directory
    that already by that time we tried to `/root` instead of typing `/root` we can
    use `.` (point) to use this command. Because point mark shows which directory
    we work on.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\3.png](Images/image00321.jpeg)


    For example with `find . -name ''*.jpg'' -mtime +90 -print`, we comand to list
    jpg files that modified 90 days.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\4.png](Images/image00322.jpeg)


    ### exec


    In order to do various operations on files, use `exec` with `find` command.


    For example, with `find /home/depo -name *.jpg` command find jpg files in depo
    folder. There are many things that fodler, therefore must be some photos 


    Now, lets use `find` command together with the `-exec` and we want to delete jpg
    files it finds. To do this we must use `find /home/depo -name *.jpg -exec rm {}
    \;` command. In command, files include `{}` are placed in these brackets as a
    parameter, and right after `-exec` the specified program is executed accordingly.
    Let''s look at the results.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\6.png](Images/image00323.jpeg)


    As you can see because of jpg files are deleted, we cannot find them when we search
    with `find`.


    ### xargs


    Another tool that we can use with `find` command is `xargs` tool. `xargs` can
    be used either alone, or can be done similar job as `-exec` with `find` command.
    `xargs`, gives the argument as input data given to it to the next program from
    the individual itself.


    A simple example: with `ls *.txt | xargs rm`, we said "find files ending with
    .txt files in the working directory, and deleted them."


    ![Açıklama: C:\Users\Mustafa\Desktop\find\7.png](Images/image00324.jpeg)


    Now let''s combine `find` with `xargs` commands and use them. For example, with
    `find / -name *.jpg -type f -print | xargs tar -cvzf fotolar.tar.gz` command,
    find all jpg files under the root directory, we want to make a compressed archive
    file with the name `fotolar.tar.gz`. Our command is working now and creating the
    archive file we want.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\8.png](Images/image00325.jpeg)


    Finally, lets give `/etc -name "*.conf" | xargs ls -l` example and finish this
    section.


    ![Açıklama: C:\Users\Mustafa\Desktop\find\9.png](Images/image00326.jpeg)


    # 16. Exploring Shell


    ## Shell


    A shell is a command-line interpreter. It is interface between user and Operating
    system. User gives command on Shell prompt and operating system executes that
    command. As shell is a command language interpreter, the basic purpose of shell
    is to translate human readable commands typed at a terminal into system actions.
    A shell is a special user program through which other programs are invoked. The
    shell gets started when the user logs in or start the terminal. Although there
    are several different shells like Bash, Korn, C shell etc, Bash is the default
    shell for Linux. Based on the shell you use there are minor differences in commands
    also.


    ### Shell Script


    Generally, we use shell in interactive mode, where user inputs command and gets
    output. However, some time you use shell scripts. Shell script is script you write
    to give series of command. Scripts that are more complex check conditions and
    run loops. Seasoned administrators use shell scripts to automate administrative
    tasks and to monitor system. Suppose, you want to check the disk space, memory
    availability and environment variables before invoking a program. There are two
    ways to do it, either you can give all commands manually every time before running
    that program or you can use shell script to do that. Shell scripts generally end
    with `sh` extension. Figure bellow shows an example of shell script


    ![00040.jpeg](Images/image00327.jpeg)


    ## Command line Interface


    Command line interface (CLI) is way to access the shell. If you do CentOS installation
    without GUI or Minimal, you will get only command line interface through virtual
    terminals. When you install Linux with GUI you have two option to access CLI


    *   Virtual Terminals

    *   Graphical Terminal


    ### Virtual Terminals


    Virtual Terminal is full screen command line interface. If you are working on
    CentOS server locally, you will get more than one Virtual terminal running on
    same server. Having more than one virtual terminal allows the administrator to
    switch to another terminal if necessary. Even if you have Graphical Desktop environment
    is installed you can still access virtual terminals. Virtual terminals can be
    accessed on CentOS System by pressing `Ctrl+Alt+F2` till `F6`. To come back to
    the graphical session, press `Ctrl+Alt+F1`. On pressing Ctrl+Alt+F2 you will ![00041.jpegget
    Virtual terminal like that


    Login and start issuing commands


    ### Graphical Terminal Emulator

