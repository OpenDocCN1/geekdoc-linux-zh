    # 第 8 章 嵌套 If 语句


    在我们继续讨论缩进的话题时，这是一个很好的例子，展示了缩进如何让你的生活变得简单。你的脚本可能有许多 ‘if’ 语句，你还可以在另一个“语句”中嵌套“if”语句。


