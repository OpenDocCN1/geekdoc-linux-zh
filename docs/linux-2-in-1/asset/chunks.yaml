    The local hardware clock of the system is usually inaccurate. The `chronyd` service
    is used to keep the local clock on track by synchronizing it with the configured
    Network Time Protocol NTP servers. If the network is not available it synchronizes
    the local clock to the RTC clock drift that is calculated and recorded in the
    driftfile, which is maintained in the configuration file at `/etc/chrony.conf`.


    The default behavior of the `chronyd` service is to use the clocks from the NTP
    network pool project to synchronize the time and no additional configuration is
    needed. It is advisable to change the NTP servers if your system happens to be
    on an isolated network.


    There is something known as a stratum value, which is reported by an NTP time
    source. This is what determines the quality of the NTP time source. The stratum
    value refers to the number of hops required for the system to reach a high performance
    clock for reference. The source reference clock has a stratum value of `0`. An
    NTP server that is attached to the source clock will have a stratum value of `1`,
    while a system what is trying to synchronize with the NTP server will have a stratum
    value of `2`.


    You can use the `/etc/chrony.conf` file to configure two types of time sources,
    server and peer. The stratum level of the server is one level above the local
    NTP server. The stratum level of the peer is the same as that of the local NTP
    server. You can specify one or more servers and peers in the configuration file,
    one per line.


    For example, if your `chronyd` service synchronizes with the default NTP servers,
    you can make changes in the configuration file to change the NTP servers as per
    your need. Every time you change the source in the configuration file, you will
    need to restart the service for the change to take effect.


    ```

    [root@server ~]# systemctl restart chronyd

    ```


    The `chronyd` service has another service known as `chronyc`, which is a client
    to the `chronyd` service. Once you have set up the NTP synchronization, you may
    want to know if the system clock synchronizes correctly to the NTP server. You
    can use the `chronyc sources` command or if you want a more detailed output, you
    use the command `chronyc sources -v` with the verbose option.


    ```

    [root@server ~]# chronyc sources –v

    ```


    # Chapter 13 Programming – A Logical Breakdown


    In this chapter, we’re going to be talking about a lot of the concepts which underlie
    programming. The fact is that though there are many ways to write programs and
    many different concepts which fall into it, many of the concepts remain rather
    fluid throughout every single implementation. What I mean by this is that regardless
    of how you’re programming, there are many things which will be common for all
    programs you’ll ever write.


    I’m a firm believer in the conceptual: I think that if you’re going to learn something,
    you need to know how it works from a conceptual standpoint and then tie that into
    rigid thoughts and structures at a later point. We’re going to be connecting all
    these concepts, too! However, for right now, we just need to talk about them as
    that: concepts.


    ## Programs and How They Run


    So the first thing we’re going to talk about is programs, what they are, and how
    they run in accordance with Linux since this book is all about trying to learn
    to program on Linux specifically. Programs are a relatively simple concept in
    and of themselves, and they can go by many different names, too: the name “program”
    here can apply to anything from a script that you write in order to automate certain
    processes to a desktop application like Word or Google Chrome to a desktop video
    game like Grand Theft Auto V, as well as many different things which rest in between.


    Programs can run in the foreground, meaning that they are right in front of your
    face performing a specific function, or they can be a process in the background,
    running without you ever knowing it. An example of a program that runs as a process
    in the background would be something along the lines of the clock application
    which is constantly running on your computer. You never quite think about it,
    but this is a kernel-level program that is constantly running in the background,
    keeping track of what happens when. Indeed, a huge number of programs will run
    in such a way without the user either being aware of them, with the user being
    unbothered after initial execution protocol, or with them being so far in the
    background that the user must fetch them in order to use them.


    As a new programmer, especially working with Linux programming, much of the programming
    that you’re going to be doing is going to be taking place within the console.
    This is especially important to you as a Linux user and programmer. Why? Because
    a lot of the appeal of Linux comes from the incredibly useful and in-depth command
    line tools which it offers.


    Console, command line, and terminal all refer to the same thing; in Unix-like
    systems, the term most often used is Terminal. All of this refers to essentially
    the same thing: how one can manually enter commands and execute programs through
    plaintext rather than through more “modern” methods of program execution. Essentially,
    the command line offers the purest form of communication between a user and a
    computer; part of the reason that Unix systems are so widely copied and emulated
    is that they offered one of the historically best methods of interface between
    the said user and said computer. This remains true today in the Unix-modeled Linux
    systems.


    Note that not all Linux distributions are equal, of course; some will rely on
    the Terminal. However, many do offer extremely high levels of possibility through
    the Terminal, even if their primary purpose is to push users away from this sort
    of low-level interface. For example, while Elementary OS (a high-level operating
    system based on an incredibly simple and elegant user experience) doesn’t have
    anywhere near as much emphasis on the command line as Arch Linux does (a Linux
    distribution which is highly customizable and makes intense usage of the command
    line), they both offer a plethora of different features accessible only through
    the command line and the usage of tools thereof.


    As I said, most programs that you’re going to be writing early on as a Linux programmer
    will at the very least print output through the command line. However, theres
    a good chance that these programs will also be compiled and executed from the
    command line as well, if only because this is the “correct” way to do it which
    will make you the most intimate with your tool, the computer.


    ## What Makes a Program?


    When I say “make” here, I literally mean make; how does one communicate with a
    computer and then create something that the computer can understand?


    Well, firstly, they’re called programming languages for a reason. Imagine it like
    this: you’re fluent in English and French. If you meet somebody on the street
    who is a native Spanish speaker, you won’t really be able to communicate with
    them. However, if they speak Spanish and French, then after fumbling through some
    conversation, you’ll both be able to communicate in French, even though your native
    tongues are different.


    This is perhaps the best analogy for what programs are and how they work. Computers
    natively understand things in very simple and mathematical terms; they parse sequences
    of ones and zeroes in order to perform highly complex mathematical functions and
    in the end are just operating upon mathematical values. Humans, on the other hand,
    while they can speak mathematics, are generally not willing to put in the immense
    amount of time required to independently program everything about a computer in
    sequences of ones and zeroes. If every programmer were to do this, even a simple
    program would take years upon years to write.

