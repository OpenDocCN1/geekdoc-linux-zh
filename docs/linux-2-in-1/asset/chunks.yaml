    \ also contains an escape character of new line: `\\n`. This escape character\
    \ will print a new line between the values of two variables, as it is shown in\
    \ the example.\n\nThere are other escape sequences present in Linux terminal as\
    \ well. For example, in order to print a back slash as part of your string value,\
    \ you must use double back slash in your `echo` command:\n\n```\n[root@archserver\
    \ ~]# echo -e \"$x\\\\$y\"\n1\\2\n```\n"
  raw: 'Working with the Linux operating system requires you to have knowledge about
    the terminal and the command line. It is essential to know what these things are,
    to be at least slightly familiar with their usage and the standard commands available.


    What is a Terminal?


    A terminal is described as "a program that emulates a video terminal within some
    other display architecture. Though typically synonymous with a shell or text terminal,
    the term terminal covers all remote terminals, including graphical interfaces.
    A terminal emulator inside a graphical user interface is often called a terminal
    window”.


    To be precise, a terminal is simply the outside. Inside a terminal runs a command
    line interpreter that is called a shell.


    Debian Linux supports a long list of terminal software. This includes the Aterm,
    as well as the GNOME terminal, the Kterm, the Mate Terminal, the Rxvt, the Xterm
    and the Xvt. These different implementations of terminal software vary in terms
    of stability, support for character sets, design, colors and fonts, as well as
    the possibility to apply background images or work with transparency


    In this book we will use the GNOME terminal because of its stability, simplicity
    and adjustability. In order to increase and decrease the size of the content that
    is displayed inside the terminal window; use the two-key combinations CTRL+ and
    CTRL-.


    6.2 What is a Shell?


    Simply speaking, a shell is a sophisticated command-line interpreter. In a loop
    the shell reads characters, modifies them under certain conditions, and executes
    the result.


    Under certain conditions, between reading from the command-line and the execution
    of the actual result, the shell must interpret special characters that are part
    of your input. The table below displays the special characters that are available:


    | Character | Meaning |


    | $name | substitution of a variable |


    | name= | assignment of a variable |


    | ''command'' | substitution of a command |


    | $(command) | substitution of a command |


    | < > >> 2> 2>> | redirection of input and output |


    | &#124; | pipelining of commands |


    | " '' \ | quoting |


    | * [ ] ? | creation of file names (globbing) |


    | ; | separation of commands |


    | & | run the command in the background |


    | &#124;&#124; && | run the commands under certain conditions |


    | { } ( ) | cramp commands |


    For interest sake, the shell divides the command-line into single words in order
    to determine the commands, by means of the following process:


    | Step | Description | Special Characters |


    | 1 | read until the command separator and tagging (substitution of commands)
    | \n & &#124; &#124;&#124; &&; $(...) \ "..." ''..." |


    | 2 | tagging (input-/output redirection, assignment of values) | < > >> 2> 2>>
    name= |


    | 3 | division into single words | space, tabulator |


    | 4 | substitution of variables | $name |


    | 5 | substitution of commands | tagging, see step 1 and 2 |


    | 6 | input-/output redirection | tagging, see step 1 and 2 |


    | 7 | assignment of variables | tagging, see step 1 and 2 |


    | 8 | division into words | based on IFS |


    | 9 | creation of file names | * [ - ] |


    | 10 | command execution |  |


    In steps 1 and 2 tagging happens for steps 5 to 7 only, and no further action
    takes place. Steps 5 to 7 are executed if tagging is completed. Next, the shell
    removes all the special characters. In step 10 the command-line contains only
    the arguments that are needed to execute the command. The shell interprets the
    first word as the name of the command to be executed, and the remaining words
    are its arguments:


    | command arg1 arg2 arg3 ... |


    6.3 Available Shells


    Your Linux system allows the usage of various shells. Each shell is available
    as a separate software package through the Debian package manager, Aptitude, we
    installed earlier. The list of shells is quite long, so we list only a selection
    of the available shells that are the most popular:


    *   Almquist Shell (ash)


    *   Bourne Again Shell (bash)


    *   Debian Almquist Shell (dash)


    *   Z Shell (zsh)


    *   C Shell (csh)


    *   Korn Shell (ksh)


    *   Tenex C Shell (tcsh)


    Unless otherwise stated the examples in this document are based on the Bourne
    Again Shell (bash). At the time of writing this document this is the default shell
    on Debian.


    Which other shells are allowed in your Linux system, is set up in the configuration
    file /etc/shells? Using the cat command, you can see the list of allowed shells:


    | user@debian95: ~$ cat /etc/shells# /etc/shells: valid login shells/bin/sh/bin/dash/bin/bash/bin/rbash/usr/bin/screenuser@debian95:
    ~$ |


    The name of the shell that is currently in use in your terminal is kept in the
    shell variable $0. The following simple command outputs the shell’s name:


    | user@debian95: ~$ echo $0bashuser@debian95: ~$ |


    In order to change the shell currently in use, have a look at the chsh command
    and the configuration file /etc/passwd covered in the following section.


    # Chapter 6 Variables


    In Linux, creation of variables is very easy. For example, in order to store a
    name, John into a variable name, you can do something like what’s being shown
    below:


    [root@archserver ~] # name="John"


    The double quotation marks tell Linux that you are creating a variable which will
    hold string typed value: John. If your string contains only one word then you
    can ignore the quotation marks, but if you are storing a phrase that contains
    more than one word and whitespaces than you must use the double quotation marks.
    To see the value inside any variable, you must use the dollar sign ($) before
    mentioning the name of the variable in the echo command. Like this:


    [root@archserver ~] # echo $name


    John


    If you miss the dollar sign ($), echo will treat the argument passed to it as
    a string and will print that string for example:


    [root@archserver ~] # echo name


    name


    You should keep in mind that there should not be any white spaces present between
    the identifier of the variable and its value. An identifier is basically the name
    or signature of a variable:


    [root@archserver ~] # x=5 # This syntax is correct because there aren’t any whitespaces


    [root@archserver ~] # x = 10 # This syntax is incorrect because whitespaces are


                 #present between the variable name and its value


    If you want to store some value inside a file whilst using the echo command, you
    could do something like this:


    [root@archserver NewFolder] # echo name > new.txt


    [root@archserver NewFolder] # cat new.txt


    name


    In the example above, I am storing a string name into a file that I created. 
    After storing the text in the file, I printed it on the terminal and got exactly
    what I stored in the text file. In the following set of commands, I am using double
    >> signs to append new text in the existing file.


    [root@archserver NewFolder] # echo "is something that people use to recognize
    you!" >> new.txt


    [root@archserver NewFolder] # cat new.txt


    name


    is something that people use to recognize you!


    You can also create and print two variables with a single line of command each,
    respectively.


    ## Example:


    [root@archserver ~]# x=1; y=2


    [root@archserver ~]# echo -e "$x\t$y"


    12


    [root@archserver ~]# echo -e "$x\n$y"


    1


    2


    The flag –e tells Linux that I am going to use an escape character whilst printing
    the values of my variable. The first echo command in the example above contains
    the \t escape character, which means that a tab of space should be added whilst
    printing the values of variables passed. The second echo command also contains
    an escape character of new line: \n. This escape character will print a new line
    between the values of two variables, as it is shown in the example.


    There are other escape sequences present in Linux terminal as well. For example,
    in order to print a back slash as part of your string value, you must use double
    back slash in your echo command:


    [root@archserver ~]# echo -e "$x\\$y"


    1\2'
