    Did you know that due to Android’s dominance on smartphones, tablets, and other
    mobile devices, Linux has turned into one of the largest installed bases in all
    general-purpose systems?


    Although it is not the top pick for desktop computers, Linux remains as an exemplary
    model of free and open source collaborative projects. Since it operates on embedded
    systems, it is very useful on television, facility automation controls, video
    game consoles, network routers, smartwatches, and, as mentioned, mobile devices.


    Linux’s simplistic design makes it a favorite of programmers. While others like
    a bit of complexity, some programmers prefer straightforward concepts. In its
    original nature, it is a leading OS (or Operating System) on mainframe computers,
    supercomputers, and numerous servers.


    As a beginner in Linux, start learning the fundamentals. What are the essentials
    about Linux?


    # History of Linux


    In 1991, Linux was officially released. Originally, its development centered as
    a free OS for different Intel x8-based personal computers. Its creator, Linus
    Torvalds, announced that the OS'' creation is partly due to a micro server kernel’s
    unavailability back then.


    As an open source collaborative project, its source code is free to use. Under
    its respective license’s term, it can also be modified for commercial and non-commercial
    distribution.


    Since it is compliant with `POSIX` (or Portable Operating System Interface), Linux
    is a dependable OS. It has undergone and passed assessment for `API` (or Application
    Programming Interface), standard utility interfaces, and command line shells.


    # Linux Components


    The seamless activities of Linux are attributable to its essential components.
    There are seven of these.


    ## Seven essential components:


    ### Applications availability

    Linux presents the availability of thousands of applications, and these applications
    are available for immediate installation. It is like Windows Store and Apps Store
    that lets you search for a preferred application. Once done searching, you can
    install the app from a centralized location.


    ### Daemons

    Daemons are Linux components that serve as background services. Examples of background
    services are sound, printing, and scheduling. These are launched either after
    a desktop login or during boot.


    ### Desktop environments

    Desktop environments refer to components with user interaction. Examples are `GNOME`,
    `Unity`, and `Cinnamon Enlightenment`. Each of these comes with configuration
    tools, file managers, calculators, web browsers, and other built-in features.


    ### Graphical server

    A graphical server is Linux’s subsystem. Its primary duty is displaying graphics
    on your screen. You can also refer to it as “X” or the “X server”.


    ### The boot loader

    Linux’s management of your computer’s boot process is handled by the boot loader.
    Usually, it is in the form of a splash screen. Once this splash screen pops up,
    it will slowly proceed into the booting process.


    ### The kernel

    Linux’s core is called the `kernel`. It oversees management for the memory, peripheral
    devices, and CPU.


    ### The shell

    The shell is Linux’s command line. It permits control via typed commands in a
    text interface.


    # The Concatenate: A Frequently Used Linux Feature


    One of the reasons why a Linux OS functions smoothly is due to simple features.
    These features can handle several tasks simultaneously. One of these features
    is concatenate or `cat`.


    ## Concatenate feature:


    * `/etc/pass` – for displaying file contents


    Sample:


    ```

    # cat /etc/password

    root:x:0:2:root:/root:/bin

    bin:x:1:1:bin:/root:/bin:/sbin/nologin

    nard:x:300:400::/home/nard:/bin/bash

    ```


    * `test test1` – for viewing contents of multiple files


    Sample:


    ```

    # cat first test second test

    Hello everybody

    Hi world!

    ```


    * `-n` option – for displaying the contents of a file; uses line numbers


    Sample:


    ```

    # cat -n song titles.txt

    1  Pop

    2  Snow in Summer

    3  Your Black Heart

    4  And I Know It Is A Home

    5  And These Places Could

    6  Be Much Bigger

    7  Brighter Than Tomorrow

    8  And Please If You Really Really Try

    9  You Will Find There Is No Need

    10 To Cry During This Moment

    11 In This Place You Will Feel

    12 There Is No Hurt Or Sorrow

    ```


    * `-e` option – for displaying multiple lines in a single line


    Sample:


    ```

    # cat -e test

    Hi there everybody, how do you do?$

    Hey, am alright.$

    How was your training and where was it?$

    $Let us do maybe practice some more in Linux.

    ```


    Result:

    Hi there everybody, how do you do?

    Hey, am alright. How was your training and where was it? Let us do maybe practice
    some more in Linux.


    * `-T` – for displaying where “tab” should be used and a new line should begin;
    “^|” is an indication for the use of “tab”


    Sample:


    ```

    # cat -T test

    Hi there ^Ieverybody, how do you do?

    Hey, ^Iam alright.

    ^I^IHow was your training ^Iand where was it?

    Let us do ^Imaybe practice some more in Linux.

    ```


    Result:

    Hi there

    everybody, how do you do?

    Hey,

    am alright.

    How was your training           and where was it?

    Let us do

    maybe practice some more in Linux.


    * `test` – for displaying contents of multiple files in a single structure


    Sample:


    ```

    # cat first test; cat second test; cat third test

    This is first test file

    This is second test file.

    This is third file.

    ```


    # Ten Basic Commands


    Before, Linux’s archaic structure, as well as its command line, is a turn-off.
    According to some programmers, it was rather too complex. However, with all the
    developments, Linux is now an OS that adapts to changes of the modern world.


    Before the identifier, type “#” to use a command.


    Ten commands:


    1. `mkdir` – allows creation of directories


    Sample:


    ```

    # mkdir nameofdirectory

    ```


    2. `rm` – allows file removal without a confirmation prompt


    Sample:


    ```

    # rm nameoffile

    ```


    3. `w` – displays information on current users, as well as current users’ average
    load


    Sample:


    ```

    # w

    05:33:22 uptime 33 min, 5 users, load average: 0.01, 0.00, 1.07

    USERS     TTY      FROM     LOGIN  NOT IDLE  JCPU  PCPU

    trs  pts/0    198.172.51.1      04:21    0.03s  0.18s  0.07s w

    ```


    4. `uptime` – displays information on how long system is running, number of current
    users, and load average


    Sample:


    ```

    # uptime

    05:33:23 uptime 33 min, 5 users, load average: 0.01, 0.00, 1.07

    [trs~] uptime

    procps version 2.8

    ```


    5. `ls` – displays list of files in readable format; displays files since last
    modification


    Sample:


    ```

    # ls -l

    total 120

    dr-xr-x-x.  4 root root 1094 Jun 24 07:11 bin

    dr-xr-x-x.  7 root root 2098 Jun 24 10:31 boot

    total 39

    -rw-r--r--. 2 root root 2062 Jun 24 13:11 install.log.sys

    -r-rw--r--. 2 root root 2063 Jun 24 14:47 install.log

    -rw-------. 2 root root 2041 Jun 24 14:47 anaconda-ks.cfg

    ```


    6. `who` – displays the date, host information, time, and date


    Sample:


    ```

    # who

    trs  pts/0       2016-07-11 09:21 (192.172.51.1)

    ```


    7. `less` – allows the quick viewing of files; allows page up and page down options


    Sample:


    ```

    # less install.log.sys

    Installing setup-3.7.18-09.e19.noarch

    warning: setup-3.7.18-09.e19.noarch: Header V4 RSA/SHA198

    Signature, key ID b109khz: KEY

    Installing ca-certificates-2009.72-8.el9.noarch

    Installing filesystem-3.7.18-09.e19.noarch.i727

    Installing xml-common-0.6.3-32.el6.noarch

    Installing tzdata-2009l-1.el9.noarch

    Installing iso-codes-3.19-3.el9.noarch

    ```


    8. `more` – allows quick viewing of files; displays percentages


    Sample:


    ```

    # more install.log.sys

    Installing setup-3.7.18-09.e19.noarch

    warning: setup-3.7.18-09.e19.noarch: Header V4 RSA/SHA198

    Signature, key ID b109khz: KEY

    Installing ca-certificates-2009.72-8.el9.noarch

    Installing filesystem-3.7.18-09.e19.noarch.i727

    Installing xml-common-0.6.3-32.el6.noarch

    Installing tzdata-2009l-1.el9.noarch

    Installing iso-codes-3.19-3.el9.noarch

    --More--(20%)

    ```


    9. `top` – displays real-time kernel managed tasks and processor activity; displays
    use of memory and processor


    Sample:


    ```

    # top trs

    top - 12:22:03 up  2:20,  1 user,  load average: 0.00, 0.01, 0.01

    Tasks: 120 total, 2 running, 120 sleeping, 1 stopped, 1 zombie

    ```

