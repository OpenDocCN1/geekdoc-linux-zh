  trans: '

    这些发行版的创建考虑了软件打包、安装过程以及更新过程。这使得每种发行版与众有所不同，并构成了用户在选择发行版时的基础。


    Linux 既有针对初学者的发行，也有针对计算机专家的。这些发行版的创建是为了确保所有用户的需求都能良好满足，并确保在使用电脑时不会遇到问题。针对新手的发行版更容易学习、理解和使用；而针对计算机专的发行版则复杂得多，对于计算机技能较少的用户来说可能具有挑战性。


    这些发行版是已经创建的不同 Linux 版本。它们也被简称为 `Distros`。几乎所有的发行版都可以免费下载、刻录到 CD 或复制到 USB 闪存，并安装到用户所需的任意数量计算机上。


    ## 流行的 Linux 发行版


    最流行的 Linux 发行版如下：


    * Linux Mint

    * Ubuntu Linux

    * Deepin

    * Fedora

    * Arch Linux

    * OpenSUSE

    * Debian


    `Ubuntu Linux` 拥有最现代的用户界面，在上述发行版中是最受欢迎的。不过，也有人偏好较老旧的版本，如 `openSUSE`。这些发行版中的每一个都对桌面和其他计算机有自己的独特之处。因此，你必须理解它们，才能做出完美的选择。


    今天有 100 多种这样的发行版。因此，为了做出明智的选择，你需要详细研究它们，并记住你电脑的需求。


    对于台式机和笔记本电脑，请选择 `Ubuntu`、`Mint`、`Fedora`、`Debian` 或 `openSUSE`。这取决于你的专业水平。`openSUSE`
    非常各种笔记本电脑。该发行版带的工具支持 wi-fi 连接和其他适合笔记本用户的功能，例如简化的扩展域站。没有其他发行版能在笔记本电脑上与 `openSUSE`
    竞争。


    这里的服务器例如：


    * Ubuntu server

    * Red Hat Enterprise Linux

    * CentOS

    * SUSE Enterprise Linux


    某些服务器发行版是免费的；例如 `centOS` 和 `Ubuntu server`；而某些则带有相关的费用，如 `Red Hat Enterprise Linux`
    和 `SUSE Enterprise Linux`。付费版本包含了支持，且成本相当低。因此，如果你想要一个付费的发行版，在财务上也不会有太大负担。


    ### 最广泛使用的发行版


    `Ubuntu Linux` 是最广泛使用的 Linux 发行版。大多数一直使用 Windows 操作系统的用户现在都在选择 `Ubuntu`。原因可能是：


    a) 因为与其他 Linux 发行版相比，学习它非常容易。

    b) 它拥有最广泛的应用范围供你选择。这意味着只要安装了正确的程序，你可以在机器上做任何事情。

    c) 它的应用程序中心开发良好，使用户可以轻松搜索想要安装的应用程序。


    `Linux Mint` 多年来人气也一直在增长。许多人认为它的流行已经足以威胁到 `Ubuntu` 多年来的统治地位。`Linux` 的开发是基于用户的建议，旨在让
    `Ubuntu` 变得，这意味着用户在使用时会有更好的体验。


    ## 确定合适的发行版


    在这一阶段，最重要的是选择合适的发行版。如果你知道自己需要什么，这完全不是问题。以下准则可以指导你：


    a) 你是什么类型的计算机用户？你是熟练的还是新手？选择一个与你的计算机技能水平匹配的 Linux 发行版，以便你从中受益。你还需要一个一直让你学得更快、使用得更好的发行版。

    b) 你倾向于标准还是现代的桌面界面？这因人而异。有许多人偏好现代桌面界面，也有许多计算机用户选择标准桌面界面。花时间了解它们的优缺点是好的，这样你就能根据自己的需求选择更好的界面。

    c) 你想要的是服务器发行版还是桌面发行版？这取决于你想成为系统管理员，还是系统仅供你自己的电脑使用。


    如果你的计算机技能只是基础水平，最好坚持使用对友好的发行版，如 `Ubuntu Linux`、`Linux Mint` 或 `Deepin`。平均水平以上的计算机用户可以选择
    `Fedora` 或 `Debian` 等发行版。精通计算机使用和系统管理技能的高手可以选择 `Gentoo` 等发行版。这是一种高级得多的 Linux 发行版。


    寻找服务器发行版的用户必须在桌面界面之间进行选择，或者决定是否仅通过命令行来使用。


    系统管理员可以根据他们想要的功能来选择发行版。如果你正在寻找一种能提供所有服务器功能和开箱即用功能的服务器发行版，请选择 `centOS`。如果你正在寻找一种允许你根据需要添加功能的桌面发行版，可以选择
    `Ubuntu Linux` 或 `Debian` 发行版。


    如果新用户能对比仅适合新手使用的发行版，工作将变得简单得多。这样，你可以在做出正确选择时节省时间，并最终做出最佳选择。


    ##  Shell 配置与自定义


    在你的用户目录中有几个隐藏的配置文件，允许你配置自己的 shell。由于我们只查看 `BASH` shell，我们将探索用于控制 `BASH` shell
    环境的配置文件。其他 shell 将有它们自己的配置文件，工作方式类似，但使用的语法可能不同。


    由于这只是对 shell 的简单介绍，我们不会深入探讨这些文件，而是更多地利用此机会让你意识到它们的存在以及可以执行的潜在自定义。这些文件及其自定义将有利于你自己进一步的探索。


    记住，我们可以查看主目录中的隐藏文件，在这种情况下，无论我们是否在主目录中，都可以使用以下命令来请求长列表格式以获取最详细的信息：


    ```

    $ ls –al ~

    ```


    并不是所有系统默认都会包含每个文件，但如果我们需要，只需添加它们即可。


    由于我们在这里讨论的是对系统配置文件的编辑或修改，值得提到，对你正在操作的文件创建一个备份始终是一个好主意。这样，如果修改后的文件由于某些原因不起作用，你就可以回到原始文件，或者使用
    `diff` 命令查看工作副本和非工作副本之间的差异。


    正如我们所看到的，环境变量用于为属性设置默认值并控制 shell 函数的方式。这些启动脚本所承担的最角色之一是初始化环境变量，因为这意味着我们不需要在每次使用
    shell 时都设置它们，而且它们是持久的。


    ### 登录时设置环境变量


    理解启动 shell 会话的不同方式非常重要。分为了登录、非登录、交互式和非交互式 shell 会话，`bash` shell 会根据会话启动的方式读取并处理不同的配置文件。


    '
- fmt: '

    # Shell Sessions and Configuration


    A login shell requires that the user is authenticated before it starts, such as
    when connecting using `SSH`(Secure SHell). If we start a shell session from our
    authenticated session, such as using the `bash` command, a non-login shell session
    is started, since we will not be asked for authentication details.


    There are also interactive and non-interactive shell sessions. When the shell
    session is attached to a terminal it is interactive, when it is not it is non-interactive.
    A normal session that begins with `SSH` is generally an interactive login shell.
    When scripts are run from the command line they are usually run in a non-interactive,
    non-login shell.


    The type of shell session determines which files are used for initialization and
    in what order.


    ## Configuration Files


    Sessions started as login sessions read configuration details from the global
    `/etc/profile` file first. They then look for the first login shell configuration
    file in the user''s home directory to get user-specific configuration details
    reading the first file that it can find out of `~/.bash_profile`, `~/.bash_login`,
    and `~/.profile`. Once it has found one it does not read any further files.


    Conversely, non-login shell sessions will read `/etc/bash.bashrc` and then the
    user-specific `~/.bashrc` file to build their environment.


    Non-interactive shells read the `BASH_ENV` environmental variable and then the
    file there specified in order to define the new environment.


    We have already looked at how to create shell and environment variables. We will
    use this knowledge to create them at startup of the shell session. Since we usually
    want to set user specific environment variables for both login and non-login shells
    so we will define these variables in the `~/.bashrc` file.


    Within these files we can set environment variables thus


    ```bash

    export VARNAME=value

    ```


    Note that there is no command prompt, `$`, here, since these are commands entered
    into a file


    Once you have edited one of these files, they will be read each time a shell session
    is started. In order to force the current shell session to read the file immediately
    we can use


    ```bash

    $ source ~/.bashrc

    ```


    If we want to set system-wide variables, it is usually better to add them to `/etc/profile`,
    `/etc/bash.bashrc`, or `/etc/environment` as appropriate.


    ## Aliases


    Another useful command that can be used in the bash startup scripts is the `alias`
    command.


    ```bash

    alias

    ```


    ### Adding aliases


    `alias` allows us to create a different name for a command or a command and options
    that will be used when we type our simple command name. For example, it can often
    be useful to add an alias to the remove command, `rm`, that will ensure that interactive
    mode, `rm –i`, is used so that you always need to confirm any deletions.


    If we add the following line to one of our startup scripts then anytime we type
    `rm` it will use `rm -i`


    ```bash

    alias rm="rm –i"

    ```


    We can use the existing name of a command and change its behavior, or we can use
    a completely random name to represent a command string.


    Although not something I would recommend, `alias` can also be used to make the
    switch from MS-DOS, if you have experience of that, to Linux with such aliases
    as


    ```bash

    alias dir="ls"

    alias rename="mv"

    alias md="mkdir"

    alias copy="cp"

    alias del="rm -i"

    ```


    and others that you decide can help you personally.


    ### Removing Aliases


    The `unalias` command can be used to remove aliases that have been created. For
    example if aliases have been set in the global setup scripts you may want to remove
    them in your personal scripts. If the alias for `rm` that we used above had been
    set globally we could remove it in our personal startup scripts thus


    ```bash

    unalias rm

    ```


    This allows us greater freedom to customize how our shell session works both globally,
    and on a user specific level.


    # 13. Installing Software and Package Management


    Since it is often necessary to install new packages to enhance the functionality
    of your system we shall take a few moments for a brief overview of how we can
    perform this from the command line. This is more of a system administration task
    than many others mentioned in this text, but is an extremely important one.


    There are several different programs and commands that can be used, depending
    upon the system that you are using and your goal. Since we are concentrating on
    Ubuntu in this guide we shall look closely at the `apt` suite of commands, but
    we shall also mention a few of the other programs that you may come across with
    different flavors of Linux such as Red Hat, Debian, etc.


    ## Installing Packages on the Command Line


    We shall begin by looking at package management, installation, removal, and updating
    on Ubuntu. Packages are software packages, collections of the appropriate files,
    libraries, dependencies, metadata, etc. required for the installation of a piece
    of software or utility. We shall make use of a dummy package named `JuliansPackage`.


    ### Ubuntu apt


    The `apt` family is the command line tool for package management, providing a
    command line interface for system administration of packages. We shall look at
    `apt`, `apt-get`, and `apt-cache` and some of the common uses and basic commands
    that are available. Several front-end, graphical interfaces exist that make use
    of the `apt` family, such as `aptitude` and `synaptic`. The `apt-get` and `apt-cache`
    commands available are considered lower level command line options.


    We can perform several system wide and package specific tasks, similar to `apt-get`,
    which we shall look at more fully shortly. `apt` works like a front end to `apt-get`
    and `apt-cache`.


    Importantly we must ensure that we have root privileges in order to make use of
    these system administration commands.


    So, on with our brief look at `apt`. If we want to update the APT database of
    packages, we can use


    ```bash

    $ apt update

    ```


    To upgrade all the installed packages on the system


    ```bash

    $ apt upgrade

    ```


    To obtain a list of available packages


    ```bash

    $ apt list

    ```


    To search the APT database of packages we can use


    ```bash

    $ apt search Julian

    ```


    This search makes use of regular expressions (using apt cache at its heart) and
    should reveal the package `JuliansPackage`.


    For dealing with individual packages we can make use of the following commands.


    To install packages by name


    ```bash

    $ apt install JuliansPackage

    ```


    And to remove a package


    ```bash

    $ apt remove JuliansPackage

    ```


    ### apt-get


    `apt-get` is a low-level command line tool for package management and is often
    considered a back-end to other tools that make use of the APT library, such as
    `aptitude`, and even `apt` as a command line only tool.


    There are several `apt-get` commands that apply system wide rather than being
    used on a single package. They allow us to update the APT package database of
    available packages, install upgrades to installed packages, autoremove packages
    that are no longer required, and even perform a full distribution upgrade when
    a new distribution becomes available. We shall look first at the system wide commands.


    In order to update the APT package lists from the system repositories we can use


    ```bash

    $ apt-get update

    ```


    Once we have updated the package lists, we can upgrade all the installed packages
    with


    ```bash

    $ apt-get upgrade

    ```


    If we want to upgrade the entire distribution to a different version, such as
    when a new distribution has been released, we can use


    ```bash

    $ apt-get dist-upgrade

    ```


    To autoremove any packages that are no longer required such as libraries that
    were only used by one package that you have removed


    ```bash

    $ apt-get autoremove

    ```


    These deal with the system. The following commands deal with individual packages,
    or several named packages


    To install a package, that we have called here `JuliansPackage` we use


    ```bash

    $ apt-get install JuliansPackage

    ```


    The command above will require confirmation to continue. We can force the command
    to continue by adding the `-y` option


    ```bash

    $ apt-get –y installs JuliansPackage

    ```

