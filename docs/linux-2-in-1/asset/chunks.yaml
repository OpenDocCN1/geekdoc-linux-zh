  trans: '

    编程中的循环遵循相似的逻辑。循环主要有两种类型，但它们在 C++ 和 Python 中的功能方式不同，因此我们将在专门的章节中深入讨论。在此期间，请只需关注一个观点：循环是控制流的重要组成部分。在编程中，很多时候你都需要反复执行某些操作。循环为满足这一需求提供了绝佳的机会。


    ## 函数与方法


    函数是本书目前将讨论的编程逻辑中最后一个主要部分，因为它是我们需要解决的早期概念性编程的最后一个主要支柱。不要误会我的，我们还可以从概念角度涵盖许多更深层次的话题，但这里本书的范围开始变得更加明确。


    你可能记得在高中或大学的数学课上接触过函数。函数始终是一种数学操作，你取某个变量，然后对其进行数学运算以获得另一个值。例如，`f(x)` 涉及获取 `x`
    并执行某些数学运算以得到 `f(x)`，这在功能上是一个 `y` 值。


    顺便说一下，函数和方法在功能上是同一个东西。首选术语取决于所使用的语言。在较旧的语言或过程化语言（如 `C`）以及同时期的衍生语言（如 `C++`）中，“函数”（function）是首选术语。同时，在
    `Java` 或 `Python` 等面向对象的语言中，“方法”（method）是首选术语。


    无论如何，方法和函数只是对给定值应用数学运算的思想，并为你提供一种满足该特定需求的方法。例如，你可以创建一个名为 `calculateSquareFootage`
    的函数，它接受参数 `length` 和 `width`，然后返回一个名为 `area` 值，这就是函数 `calculateSquareFootage`
    的总值。`area` 可以是 `length` 乘以 `width`。


    定义这样一个函数可以被称为函数定义（function definition）。这是一个需要掌握的重要术语，请记住。总之，继续。一旦你定义了一个函数，你可能想在以后使用它。这被称为调用函数（calling
    a function）或调用方法（calling a method）。


    你通过说出名称加上你想发送的值来调用函数。例如，调用 `calculateSquareFootage(3, 4)` 将返回值 `12`。我们可以将此值保存到变量中或直接将其打印出来。


    这是关于函数的最后一点重要性：返回值！几乎所有函数都会为你返回一个值，这是它们的主要目的之一。当然，并非所有函数都必须如此——`void` 函数没有返回值的要求。然而，如果你使用在声明函数时必须指定类型的语言，那么其他每个函数都必须返回一个与函数类型对应的值。值的返回标志着函数的结束。


    再次，并不是所有函数都必须返回值——`void` 函数不需要这样做。此外，许多脚本语言（例如 `Python`）完全避免了函数类型化，这意味着当函数内部没有更多代码时，该函数就运行结束并被终止，回到程序的主代码部分。


    基本上，函数有两个主要目的。


    第一个主要目的是，它们允许你对程序中的某些交互和计算进行规范化，使你不必重复输入相同的内容。这本身就具有某种模块化，是一个非常好的特性。


    第二个主要目的是，它们允许你理理代码。通过将一个巨大的主代码块划分成较小的函数，你使代码更具可读性，在很多时候，还让它更容易理解。


    类可以有自己定义的函数，也可以有多个同名但参数不同的函数（遵循多态规则）。这也能许多其他很酷的功能。当你使用最终源自创建类的对象（例如 `vector` 或
    `string`）时，它们通常会有内置方法，你可以使用这些方法来操作对象。这非常有用！


    # 结论


    在本章中，我们拆解了一些最棘手的编程概念，并尝试尽可能让它们易于理解。深入理解编程是一件非常困难的事情。然而，如果你想成为一名程序员，理解底层概念是非常重要的。你学到的这些概念的酷之处在于，它们不仅适用于
    Linux 系统，还适用于你将要写的任何代码。事实上，在 Linux 上编程并没有什么特别的。为 Windows 编写的 `C++` 代码和为 Linux
    编写的 `C++` 代码之间没有太大区别，在两个平台之间编写 `Python`、`Java` 或 `PHP` 代码也没有什么分歧。但是，有一些关键概念贯穿所有这些极其受欢迎的语言，为了理解如何编程，你必须理解它们。


    现在我们已经学习了 Linux 系统是什么，以及如何通过学习几个基础命令来开始 Linux 操作。这些命令帮助我们导航系统，因此，我建议你尽可能多地执行练习，以便你理解每个命令的作用以及运行每个命令的输出。在接下来的会话中，我们将学习更多关于
    `grep` 和正则表达式、管道与重定向、进程管理以及最后的 bash 脚本的内容，这些将组成 Linux 系统的中级水平。这将让我们做好准备，进入 Linux
    系统的高级水平，并学习如何使用我们学的命令来编写良好的 GNU/Linux 软件，学习线程、进程以及进程间通信等。


    Linux 命令行：


    面向黑客的理解命令行基础、管理和安全的高级指南。开始你的黑客攻击和网络快速学习。包含要点、技巧和练习。

