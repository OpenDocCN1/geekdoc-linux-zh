- fmt: '

    Compare Ubuntu or Xubuntu (1.8 GB and 1.3 GB respectively) with 5 GB of Windows
    7. At the same time, the set of Linux programs is not only not inferior to the
    Microsoft product, but, on the contrary, surpasses it! The same applies to programs
    – they weigh significantly less.


    ## 10. Responsive community


    Linux is not Windows, where you are left alone with your problem. First, there
    is the official English-speaking community (https://www.linux.org/forums/).


    ## 7. How to Install Linux


    ### Versions


    We now will have a quick word about which version of Linux to install. This is
    very popular distro and has many features. It also offers a lot of support from
    the FLOSS community. Ubuntu itself also has many "variations" however. They''re
    basically the same Ubuntu core with a different graphic/desktop environments.
    You will see these listed as either XFCE, Openbox, GNOME, Unity, or KDE, just
    to name a few.


    These different variations of the distros themselves also have different elements
    to them such as window managers and desktop environments.


    A window manager is the software that allows all the interactions with a graphical
    user interface. These elements provide the different window panels, menus and
    taskbars, settings and appearances. If coupled, the two provide you with more
    options (this would apply to desktop environments such as GNOME and KDE versions
    of Linux). You also could download more than one environment, and switch between
    them when you want a different desktop environment at each boot up. Most of these
    environments for Ubuntu come with both the environment and with the window manager.


    ### Desktop Installation


    Again, this version of Linux will give you the graphics interface (GUI) that many
    are used to and expect from using computer.


    ### To install


    Before you start you should make sure you have backed up your computer before
    trying either version as a precaution. Linux is not as likely as Windows to crash,
    but it is best to be prudent and protect your data.


    Pull up the website for `www.Ubuntu.com`. Always use legitimate websites for your
    distros and other needs. Once you see the distro that you need, check your computer’s
    requirements. Is there enough room for install? Are there hardware or software
    components that do not match what the distro is stated to require? At this stage,
    you can decide if you need to repair or add anything before moving forward. You
    may even decide to go with another distro.


    From the webpage, select the Linux CD image (an `.ISO` file) that you would like,
    and choose to download to a disc or a USB. This is highly recommended to download
    to the external media over a direct install to your hard drive. It is portable,
    it is non-permanent, and will not make changes to your computer system. You can
    boot the system straight from the copy that you make. More will be said about
    this. The desktop version also will be a lot smaller than the server edition.


    After the download, you should boot it off the CD drive or USB. This is called
    a live environment. The good news is that this is not going to affect or change
    your computer at all. However you also have the option to install the distro to
    your computer. Be patient during the download, as in either case, the download
    may take a while. Remember that this version is a bit bigger than the server version
    in comparison. It also depends on your hardware, the age of your system as well
    as your internet speed.


    With an install you can easily save settings, files and other components between
    uses that you can’t get with the USB or disc reboot. However, you could also save
    files to your drive to use on your next reboot with a USB drive, by enabling the
    “persistence” setting.


    ### Options to Try (Use Live) or Install Ubuntu (www.linuxandubuntu.com)


    For the install on your drive:


    For hard installation we recommend to use the guided installation, unless you
    are more advanced with Linux (in which case, you probably would not be reading
    this guide).


    Ubuntu makes the following, additional recommendations prior to installing the
    system:


    * Make sure you are plugged in and connected to the internet. Stay connected.

    * Download updates while installing and choose to also install third-party software.


    You should remember that by installing Ubuntu on your entire hard disk you will
    erase all data that is currently on the drive. Backup all data before you install
    Ubuntu on your actual drive! If this scares you, you may want to look at the Live
    installation instead. If you want to also keep another backup copy in a location
    where they are safe and away from corruptible hardware. Try a cloud based program
    such as Jungle Disk. It does have a low cost to subscribe but the service is worth
    it, and it plays well with Linux.


    `[www.ubuntu.com](http://www.ubuntu.com)`


    For the CD/USB (Live) install:


    If you wisely chose to do a live environment installation, once it has been downloaded
    and rebooted from the CD or USB you just follow the series of prompts. Some prompts
    are simple information from you such as language and preferences. Some prompts
    will ask questions about what you want to do with your system afterwards, or who
    may have access to the system. Other prompts include a question to partition (for
    advanced users). You may have to disable the “Secure Boot” setting if it will
    not allow you to boot Linux with some newer versions on Windows.


    Upon rebooting, you will immediately see that your tabs include functions, applications,
    an internet browser, and tools like MAC or Windows. Home or My computer is your
    “C” Drive.


    Note: If your computer doesn’t read the CD or USB and install automatically, try
    the `F12` key for the menu to allow you to boot.


    ### Virtualization


    Another great feature of any distro is the virtual desktop, which enables you
    to toggle between operating systems. A virtualized desktop is exactly that. It
    is the user interface in a virtual environment, and it is stored on a remote server
    instead of locally. The virtual operating system runs within an application. This
    can be much easier and more efficient than dual booting.


    You can get these in an App. Some popular ones for Linux are Microsoft Virtual
    PC, `VMWare`, `VMWare Workstation`, or `VirtualBox`. Do some research on these
    to explore this option as well.


    VirtualBox Manager Screenshot (www.lifehacker.com)


    ### Dual Boot Option


    So you have the choice to install Linux or to use the live environment. You also
    have the choice to run Linux by itself, wipe out your current operating system
    entirely and substitute it with Linux. You also could opt to run it side by side
    with your current system such as Windows.


    If you chose the latter, you can partition the system to allow for both, and toggle
    between them as needed. Being able to troubleshoot Windows or recover data is
    another benefit to having the partition, or to having the live USB or disc. Some
    people like the option of having both types of systems, and some will keep one
    or the other exclusively.


    One option to maintain both is to set up a dual boot configuration where you keep
    two operating systems. Wubi is a program that will automate installation, and
    won’t affect partitioning (sectioning off) of your computer. If you want to explore
    this, go to the Wubi website at `www.wubi-installer.org` to access this program.


    If you are more tech savvy you can manually create your own dual boot install,
    create partitions. Another point to note is that if you have a MAC OS, there may
    be other things to consider when sharing the space. The system may need something
    special to help with the co-existence. The program `rEFInd` can be installed and
    will help you access the OS you want at start up.


    ### The Look of Ubuntu Desktop Version


    So, by now you have chosen a version you would like, and you are deciding to use
    the Desktop Version of Ubuntu.

