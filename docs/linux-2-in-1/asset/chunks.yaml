    \   198.172.51.1     Tue Jun 21 06:08 - down  (01:15)\n```\n\n## 第 1 章：什么是 Linux？\n\
    \n简单来说，`Linux` 是一个操作系统。操作系统本质是任何技术产品中用于管理与该产品相关的每一项硬件资源的软件。所以，如果你拥有一部手机并启动它，你就拥有了所有可能使用或不使用的预装应用程序。这些应用程序被称为软件。这些软件被加载到操作系统中，而由操作系统负责存放和管理输入到手机应用程序中的信息。\n\
    \n如果我们用比喻来说，你家里的布线就是它的“操作系统”。它容纳了你和你使用的所有物品，并管理着你的电和水。家里的布线负责你所依赖的所有基本功能，当你想要升级房屋时，也必须升级布线。\n\
    \n操作系统的运行方式大体相同。\n\n现在，操作系统由许多不同的部分组成：`bootloader`（引导加载）是负责你技术产品启动过程的软件。当你打开手机或笔记本电脑时，屏幕上通常会闪过一个屏幕，显示你所拥有的产品的标志，然后在加载主界面或锁屏界面之前消失。\n\
    \n这就是 `bootloader` 的前沿部分。\n\n然后是 `kernel`（内核），这是 `Linux` 操作系统中被称为“Linux”的那部分。`kernel`\
    \ 是整个系统的稳定核心，它帮助管理该技术产品的内存。\n\n"
- fmt: "\nThe most popular ones are Linux Mint, Arch Linux, Deepin, Ubuntu Linux,\
    \ Debian, openSUSE, and Fedora. Each of these “distros” has a different take on\
    \ the layout of the desktop environment, but the differences don’t stop there.\
    \ Some distributions require more skill with computers than others, some have\
    \ more modern graphical aesthetics (as in, they look prettier than others), and\
    \ some are built specifically for coding and learning how to program on Linux.\n\
    \nFinding the distribution of Linux that’s right for you is all about accessing\
    \ your needs and what you find important. If you are a true beginner, you’ll want\
    \ to stick with something that’s friendly to newbies. Those would be Ubuntu, Deepin,\
    \ or Linux Mint. If you consider your skills to be average, then you could use\
    \ a distribution like Fedora or Debian. Remember, because Linux is free to alter\
    \ and distribute, as your skills progress you can secure different distributions\
    \ of the operating system in order to continuously tailor it to your needs.\n\n\
    But, when people finally choose the distribution of Linux they want to use, there\
    \ is always the daunting task of installing the operating system in the first\
    \ place. Don’t worry—Linux has one of the easiest installations of any operating\
    \ system to ever hit the open market. Not only that, but many distributions that\
    \ have been updated are now circulating something called a “live distribution,”\
    \ which is where you insert the burned disk or the thumb drive into your technological\
    \ device and run the operating system without making any major changes to the\
    \ hard drive of your device.\n\nYes, this means you’ll get the full functionality\
    \ of your chosen Linux distribution without ever having to commit to the installation\
    \ in the first place. This is wonderful if you are trying out new systems, and\
    \ it gives you the ability to “test drive” the product before you commit to it.\
    \ Then, when you do find the distribution you wish to use, you simply double-click\
    \ the “Install” icon located within the main file of the disk or thumb drive and\
    \ walk through the prompted installation process.\n\n# 5. The Linux Command Line\n\
    \nIn this chapter, we will learn about the Linux Command Line and how to use it\
    \ to perform various tasks on your Linux operating system. By the end of this\
    \ chapter, you will be well versed with the basic commands that are used on the\
    \ command line and commands that are used to manage files and folders on a Linux\
    \ system.\n\n### The Bash Shell\n\nThe command line utility available on Linux\
    \ operating systems is known as `BASH`, which is short for Bourne-Again Shell.\
    \ The command line utility is basically an interface, which allows you to give\
    \ instructions in text-mode to the computer and its operating system. There are\
    \ different types of shell interfaces that are available in the many Unix-like\
    \ systems that have been developed over the years, but Red Hat Enterprise Linux\
    \ 7 uses the `bash` shell. The `bash` shell is an evolved and improved version\
    \ of the former popular shell known as Bourne Shell.\n\nThe `bash` shell displays\
    \ a string, which implies that it is waiting for a command to be input by the\
    \ user. This string that you see is called the shell prompt. For a user that is\
    \ not a root user, the shell prompt ends with a `$` symbol.\n\n```\n[student@desktop\
    \ ~]$\n```\n\nIf the root user is logged into the system, the shell prompt ends\
    \ with a `#` symbol. The change in this symbol quickly lets the user know if he\
    \ is logged in as root or a regular user so that mistakes and accidents can be\
    \ avoided.\n\n```\n[root@desktop ~]#\n```\n\nIf you need an easy comparison, the\
    \ `bash` shell in Linux operating systems is similar to the command prompt utility\
    \ that is available in Windows operating systems, nut you can say that the scripting\
    \ language used in `bash` is far more sophisticated compared to the scripting\
    \ that can be done in command prompt. `Bash` is also comparable to the power shell\
    \ utility, which was made available from Windows 7 and Windows Server 2008 R2.\
    \ The `bash` shell has been called as a very powerful tool for administration\
    \ by many professionals. You can automate a lot of tasks on your Linux system\
    \ using the scripting language that is provided by the `bash` shell. Additionally,\
    \ the `bash` shell also has the option to perform many other tasks, which are\
    \ complicated or even impossible if tried via a graphical interface.\n\nThe `bash`\
    \ shell is accessed through a tool known as the terminal. The input to the terminal\
    \ is your keyboard and the output device is your display monitor. Linux operating\
    \ systems also provide something known as virtual consoles, which can be used\
    \ to access the `bash` shell as well. So, you will have multiple virtual consoles\
    \ on the base physical console and each virtual console can act as a separate\
    \ terminal. Also, you can use each virtual console to create login sessions for\
    \ different users.\n\n### Basics of Shell\n\nThere are three parts to commands\
    \ that are entered on the shell prompt.\n\n1. Command that you want to run\n2.\
    \ Options that will define the behavior of the command\n3. Arguments, which are\
    \ the command’s targets\n\nThe command basically defines that program that you\
    \ want to execute. The options that follow the command can be none, one or more.\
    \ The options govern the behavior of the command and define what the command will\
    \ do. Options are usually used with one dash or two dashes. This is done so that\
    \ we can differentiate options from arguments. Example: `-a` or `--all`.\n\nArguments\
    \ also follow the command on the command line and can be one or more like options.\
    \ Arguments indicate the target on, which a command is supposed to operate.\n\n\
    Let us take an example command:\n\n```bash\nusermod -L John\n```\n\nThe command\
    \ in this example is `usermod`.  \nThe option is `-L`.  \nThe argument is `John`.\
    \  \n\nWhat this command does is locks the password of the user `John` on the\
    \ system.\n\nTo be effective with the commands on the command line, it is essential\
    \ for a user to know what options can be used with a command. If you run the `--help`\
    \ option with any command, you will get a set of options, which can be passed\
    \ with that command. So, it’s not necessary that you know all the options that\
    \ are to be used by all the commands by heart. The list will also tell you what\
    \ each option does.\n\nThe use of statements can sometimes seem very difficult\
    \ and complicated to read. Once you get used to certain conventions, reading the\
    \ statement becomes much easier.\n\n*   Options are surrounded by square brackets\
    \ `[ ]`\n*   If a command is followed by `…` it specifies the arbitrary length\
    \ list of items belonging to that type\n*   If there are multiple items and if\
    \ the pipe separates them `|` it implies that you can specify only one of them\n\
    *   Variables are represented using text, which is in angle brackets `<`. So if\
    \ you see `<filename>`, you have to replace it with the filename that you wish\
    \ to pass\n\nFor example, check the below command:\n\n```bash\n[student@desktop\
    \ ~]$ date --help\n\ndate [OPTION]... [+FORMAT]\n```\n\nThis indicates that the\
    \ command `date` takes the options represented by `[OPTION]...` with another option\
    \ `[FORMAT]`, which will be prefixed with the `+` symbol.\n\n### Executing Commands\
    \ on the Bash Shell\n\nThe Bourne Again Shell, known as `bash`, does the job of\
    \ interpreting commands that are input by the user on the shell prompt. We have\
    \ already learned how the string that you type in at shell prompt is divided into\
    \ three parts, command, options and arguments. Every word that you type into the\
    \ shell is separated using blank space. The program that is already installed\
    \ on the system is defined by every command that you type, and every command has\
    \ options and arguments that are associated with it.\n"
