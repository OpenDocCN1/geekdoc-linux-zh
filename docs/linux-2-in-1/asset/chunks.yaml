    In this chapter, we will learn how to locate logs in the Linux system and interpret
    them for system administration and troubleshooting purposes. We will describe
    the basic architecture of `syslog` in Linux systems and learn to maintain synchronization
    and accuracy for the time zone configuration such that timestamps in the system
    logs are correct.


    ## Architecture of System Logs


    In this section, we will learn about the architecture of system logs in Red Hat
    Enterprise Linux 7 system.


    ### System logging


    Events that take place as a result of processes running in the system and the
    kernel of the operating system need to be logged. The logs will help in system
    audits and to troubleshoot issues that are faced in the system. As a convention,
    all the logs in Linux based systems are stored at `/var/log` directory path.


    Red Hat Enterprise Linux 7 has a system built for standard logging by default.
    This logging system is used by many programs. There are two services `systemd-journald`
    and `rsyslog`, which handle logging in Red Hat Enterprise Linux 7.


    The `systemd-journald` collects and stores logs for a series of process, which
    are listed below:


    * Kernel

    * Early stages of the boot process

    * Syslog

    * Standard output and errors of various daemons when they are in the running state


    All these activities are logged in a structural pattern. Therefore, all these
    events get logged in a centrally managed database. All messages relevant to `syslog`
    are also forwarded by `systemd-journald` to `rsyslog` to be processed further.
    The messages are then sorted by `rsyslog` based on facility or type and priority
    and then writes them to persistent files in `/var/log` directory.


    Let us go through all the types of logs, which are stored in `/var/log` based
    on the system and services.


    | Log file | Purpose |

    | :--- | :--- |

    | `/var/log/messages` | Most of the syslog messages are stored in this file except
    for messages related to email processing and authentication, cron jobs and debugging
    related errors |

    | `/var/log/secure` | Errors related to authentication and security are stored
    in this file |

    | `/var/log/maillog` | Mail server related logs are stored in this file |

    | `/var/log/cron` | Periodically executed tasks known are known as cron. Related
    logs are stored in this file |

    | `/var/log/boot.log` | Messages that are associated with boot up are stored here
    |


    ## Syslog File Review


    In this section, we will learn how to review system logs, which can help a system
    admin to troubleshoot system related issues.


    ### Syslog files


    The syslog protocol is used by many programs in the system to log their events.
    The log message is categorized by two things:


    * Facility, which is the type of message

    * Priority, which is the severity of the message


    Let us go through an overview of the priorities one by one.


    | Code | Priority | Severity |

    | :--- | :--- | :--- |

    | 0 | emerg | The state of the system is unusable |

    | 1 | alert | Immediate action needs to be taken |

    | 2 | crit | The condition is critical |

    | 3 | err | The condition is non-critical with errors |

    | 4 | warning | There is a warning condition |

    | 5 | notice | The event is normal but significant |

    | 6 | info | There is an informational event |

    | 7 | debug | The message is debugging level |


    The method to handle these log messages is determined by the priority and the
    type of the message by `rsyslog`. This is already configured in the file at `/etc/rsyslog.conf`
    and by other conf files in `/etc/rsyslog.d`. As a system admin, you can overwrite
    this default configuration and customize the way `rsyslog` file to be able to
    handle these log messages as per your requirement. A message that has been handled
    by the `rsyslog` service can show up in many different log files. You can prevent
    this by changing the severity field to `none` so that messages directed to this
    service will not append to the specified log file.


    ### Log file rotation


    There is `logrotate` utility in place in Red Hat Enterprise Linux 7 and other
    linux variants so that log files do not keep piling up the `/var/log` file system
    and exhaust the disk space. The log file gets appended with the date of rotation
    when it is rotated. For example, an old file named `/var/log/message` will change
    to `/var/log/messages-20161023` if the file was rotated on October 23, 2016. A
    new log file is created after the old log file is rotated and it is notified to
    the relevant service. The old log file is usually discarded after a few days,
    which is four weeks by default. This is done to free up disk space. There is a
    `cron` job in place to rotate the log files. Log files get rotated on a weekly
    basis, but this may vary based on the size of the log file and could be done faster
    or slower.


    ### Syslog entry analysis


    The system logs, which are logged by the `rsyslog` program have the oldest log
    message at the top of the file and the latest message at the end of the file.
    There is a standard format that is used to maintain log entries that are logged
    by `rsyslog`. Let us go through the format of the `/var/log/secure` log file.


    ```

    Feb 12 11:30:45localhostsshd [1432] Failed password for user from 172.25.0.11
    port 59344 ssh2

    ```


    * The first column shows the timestamp for the log entry

    * The second column shows the host from, which the log message was generated

    * The third column shows the program or process, which logged the event

    * The final column shows the message that was sent


    ### Using the tail command to monitor log files


    It is a common practice for system admins to reproduce the issue so that error
    logs for the issue get generated in real time. The `tail -f /path/to/file` command
    can be used to monitor logs that are generated in real time. The last 10 lines
    of the log file are displayed with this command while it continues to print new
    error logs that are generated in real time. For example, if you wanted to look
    for real time logs of failed login attempts, you can use the following `tail`
    command, which will help you see real time logs.


    ```

    [root@desktop ~] # tail -f /var/log/secure

    …


    Feb 12 11:30:45localhostsshd [1432] Failed password for user from 172.25.0.11
    port 59344 ssh2

    ```


    ### Using logger to send a syslog message


    You can send messages to the `rsyslog` service by using the `logger` command.
    The command useful when you have made some changes to the configuration file of
    `rsyslog` and you want to test it. You can execute the following command, which
    will send a message that gets logged at `/var/log/boot.log`


    ```

    [root@desktop ~] # logger -p local7.notice “Log entry created”

    ```


    ## Reviewing Journal Entries for Systemd


    In this section, we will learn to review the status of the system and troubleshoot
    problems by analyzing the logs in the systemd journal.


    ### Using journalctl to find events:


    The systemd journal uses a structured binary file to log data. Extra information
    about logged events is included in this data. For syslog events, this contains
    the severity and priority of the original message.


    When you run `journalctl` as the root user, the complete system journal is shown,
    starting from the oldest log entry in the file.


    Messages of priority notice or warning are highlighted in bold by the `journalctl`
    command. The higher priority messages are highlighted in red color.


    You can use the `journalctl` command successfully to troubleshoot and audit is
    to limit the output of the command to only show relevant output.


    Let us go through the various methods available to limit output of the `journalctl`
    command to show only desired output.


    You can display the last 5 entries of the journal by using the following command.


    ```

    [root@server ~] # journalctl -n 5

    ```


    You can use the priority criteria to filter out `journalctl` output to help while
    troubleshooting issues. You can use the `-p` option with the `journalctl` command
    to specify a name or several the priority levels, which shows the entries that
    are of high level. `journalctl` know the priority levels such as `info`, `debug`,
    `notice`, `err`, `warning`, `crit`, `emerg`, and `alert`.

    '
