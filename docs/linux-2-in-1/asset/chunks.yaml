    `ip_address hostname`


    ## DNS


    The Domain Name System (DNS) is a system for naming systems on the Internet based
    on resource locators, hostnames, and domains and providing a mechanism to rapidly
    distribute updates when things change.


    When you use a web browser to connect to a website you type if something like
    `[www.somewebsite.com](http://www.somewebsite.com)` which is known as a Universal
    Resource Locator (URL). Starting from the right and moving left the URL starts
    with `.com` which is a Top-Level Domain (TDL). There are lots of TDLs, `.com`,
    `.net`, `.org`, `.mil`, and each TDL has an organization that controls the TDL.
    The next part of the URL is the domain name, `somewebsite`. When someone registers
    a domain name, the domain name is registered with the appropriate TDL controlling
    authority which which will in turn advertise DNS information about the domain.
    The last part of the URL is the resource locator `www` which is the resource locator
    for a web page.


    The following commands will be covered in this section:


    - [nslookup](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)

    - [dig](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    ### nslookup


    The `nslookup` command can be used to query the DNS server for information about
    domains.


    The basic use of the `nslookup` command is from the command line as in the example
    below.


    The output lists the IP address of the DNS server. The line `Non-authoritative
    answer` means that the answer is not from the main DNS server responsible for
    the domain but rather another DNS server that knows the answer. The last part
    of the output is the name you were looking for and the IP address.


    If you type the command `nslookup` without putting in a domain name you will enter
    interactive mode. In interactive mode you will have a `>` character that means
    `nslookup` is awaiting your input.


    The `server` option in interactive mode will show you which DNS server you are
    getting name resolution from. You can also use the `server` option to change the
    DNS server to query. This will not change the server which is used for normal
    name resolution. In the example below the DNS server is changed to `10.8.4.3`.


    The `set` type option allows you to change the type of DNS record to look for.
    By default, `nslookup` shows `a` records which are resource records. In the example
    below, the type is set to `ns` which is for nameservers or DNS servers. The example
    below shows four nameservers for the domain `somewebsite.com`.


    In the example below, the type is set to `mx` which is for mail exchangers or
    email servers. The example below shows five email servers for the domain `somewebsite.com`.


    In the example below, the type is set to `a` which is for resource records. The
    example below shows the `a` record for `www.somewebsite.com`.


    In the example below, the type is set to `aaaa` which is for IPv6 resource records.
    The example below shows the `aaaa` record for `www.somewebsite.com`.


    To exit `nslookup` interactive mode, type `exit`.


    ### dig


    The `dig` is another command that can be used to query the DNS for information
    about domains.


    The basic use of the `dig` command is from the command line as in the example
    below. The output lists the IP address of `www.somewebsite.com`. The flag line
    `AUTHORITY: 0` means that the answer is non-authoritative.


    The `dig` command by default looks for a record. The `dig` command can also be
    used to lookup other types of records by using the `-t` option followed by the
    type of record, `ns`, `mx`, `a`, or `aaaa`.


    ### route


    The `route` command is used to view the network routes that your system knows
    about. On most systems with only one NIC there is not much to do with routes.
    The most important route that your system has is a route to the default gateway
    which is the route to to Internet.


    If your system has multiple NICs then then will be multiple routes. It is important
    to make sure that default gateway is pointed in the right direction. The syntax
    to add a default gate is as follows:


    `route add default gw ip_address dev interface_name`


    In the example below the `route` command is used to add `192.168.56.1` as the
    default gateway which can be reached via the `enp2s0` interface.


    ## 15. File Operations


    In this chapter, we will talk about creating a file, copy, move, view the contents,
    command output file to divert etc. Here we will work files will be usually text
    files.


    Our subject order will be as follows: more than a categorical order, the place
    where the samples will be given on the use of commands when they are necessary,
    so the subject will provide more efficient processing. I think it would be a better
    narrative style.


    ### touch


    One of the easiest ways to create a text file is to use the `touch` command. For
