    * `/<term>`：在手册页中用于搜索单词“term”

    * `n`：在页面上搜索完成后，选择下一个项目

    * 记住：手册页非常用，所以请根据需要经常使用它们。当你有这些工具可用时，不需要尝试记住所有内容。


