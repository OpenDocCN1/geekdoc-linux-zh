  trans: "\n\n这意味着首先，Unix 现在可以在任何可以编译 `C` 代码的计算机上运行。然而，这种做法反过来又为 `C` 代码提供了一个稳定且极其受欢迎的示例，证明了它的运行效果有多好。这意味着随着\
    \ `C` 迅速获得动力，每者的流行程度是相辅相成的。\n\n结果是产生了历史上最有影响力的编程语言之一——`C`。大部分 Unix 程序将用 `C` 编写，早期的\
    \ `C` 支持很大程度上取决于 Unix，而当类 Unix 操作系统开始开发时，它们通常会遵循 Unix 的做法，使用 `C` 或 `C` 与 `C++`\
    \ 的组合进行开发。\n\n`C` 最终启发了一系列不同的语言，如 `C++`。然而，它不仅仅是 `C++`；作为初级程序员经常听到的很多语言，其遗产很大归功于\
    \ `C`。`Java`、`Perl`、`PHP`、`Python`、`C#`、`JavaScript`、`Objective-C`、`Go` 和 `Rust`\
    \ 只是许多很大源自 `C` 和 `C` 标准过程语言之一。\n\n现在请注意，每种编程语言都试图解决许多相同的问题，而且它们通常基于对给定问题的算法或数学断言——根结底，核心重点是解决向计算机程序员提出的问题——因此在许多方面，它们是相对相似的。但\
    \ `C` 风格的语言具有许多相似之处，例如它们的类型系统（我们稍后会讲）或通用的语法。\n\n本章在涵盖编程概念时，涵盖了 `C` 风格编程语言的核心概念，但这些概念也适用于许多其他语言——尽管它们可能以不同的形式出现。\n\
    \n## 变量与值\n\n这是我们在本章要处理的第一个真正的编程概念，也是最重要的概念之一。计算机的全部目的，嗯，就是计算。计算机的设计是为了操纵值；事实上，这是它们的主要目的！因此，编程的主要功能之一维护、回和操纵不同的值是有合逻辑的。\n\
    \n那么到底什么是值呢？我们之前讨论过计算机如何将内容读取为 `1` 和 `0`。归根结底，这不完全正确，但也确实。计算机上发生的一切要么是一次性的计算，要么存储在某处；它可能临时存储在名为\
    \ `RAM` 的快速访问内存中，也可能作为硬盘上的固态数据长期存储。无论何种情况，重点都是计算机是围绕存储和更改数据构建的，这些数据被称为“值”。\n\n\
    在编程方面，值可以是任何内容。例如，值可以是从整数、小数到长字符串、单个字符，甚至甚至是真或假的属性的任何东西。\n\n当然，有时你可能需要跟踪某个值。这时变量就派上用场了。变量提供了一种方法，为计算机活动内存中的给定值提供名称和一种一致的引用手段。\n\
    \n然而，这仍然不仅于此。例如，当你处理不同的值时，计算机终究只是将它们读取为你作为程序员所看到的表象的极大简化。因此，计算机需要一种方法来区分所有这些不同形式，因为一个事物的二进制表示并不是另一个的二进制表示，尽管它们看起来具有相同的值。\n\
    \n这其中的例子是在像 `Java` 这样的语言中比较字符串。如果你直接比较字符串，将得到错误的数据，因为字符串实际上是 ASCII 值的数组，而它们本身持有的是二进制值。如果你直接将一个值与另一个值进行比较，你将遇到数学比较，而不是字符串字面量比较（后者是\
    \ ASCII 值之间的相互比较）。然而，如果你使用对象比较方法直接比较字符串对象，而不是数学值比较，那么你可能发现这两个字符串是非常相似的。\n\n这些不同的值被称为“类型”。类型数不胜数，且不同的类型存在于每种编程语言中。然而，大多数\
    \ `C` 风格的语言对其支持的类型有几条基本的“指南”。\n\n首先，你有原生类型（primitive types），这些是原生支持的、不是由特定语言的\
    \ API 或其他基础软件定义的类型。这些诸如 `ints`（整数）、`floats`（浮点数）、`chars`（单个字符）以及可能的 `booleans`（真假值）。\n\
    \n然后，你有对象类型（object types），正如我之前提到的，我们稍后会深入讨论。对象类型是数据的构造形成，作为由原生数据类型表示的不同特征的集合。一种非常流行且经常被表示的对象类型是\
    \ `string`，它是 ASCII 字符序列。\n\n有些语言要求你显式说明给定变量将持有什么类型的值。这些被称为显式类型语言。而其他语言不需要你做这种区分，它们只需让你声明变量。这些被称为隐式类型语言。\n\
    \n两者之间没有明确的偏好，这实际上取决于你试图实现什么，以及你处理的数据结构有多复杂。然而，归根结底，两者实现了相同的目标：建立一个为给定值建立名称的系统，其他所有内容都可以与之对应。\n\
    \n## 对象与类\n\n这可能是书中最人生畏的话题之一，但它与值和变量的主题相关，所以我们应该现在就解决它。我们讨论过面向对象的编程如何完全改变了编程的范式，但我们还没有讨论过为什么，以及什么是对象。\n\
    \n首先，想一辆汽车。汽车由许多不同的属性组成。每辆汽车都有品牌和型号；它有特定数量的门；它有特定尺寸的引擎；它可能有敞篷顶也可能没有；此类推。这些都是变量，可能会根据汽车的任何定义发生变化。\n\
    \n但在编程中，大多数时候，你被迫一次只处理一个给定的变量。除非你建立了一套处理多个变量的正确范式。建立一个 `class`（类）允许你将一组不同的变量组合在一起。\n\
    \n也就是说，与其创建一组不同的独特变量来引用特征，你只需要将所有变量堆放在一起。这意味着你可以将所有相同的变量应用于不同的车辆。参考这段伪代码。设置有关汽车的重要信息的传统方法如下：\n\
    \n```\ncar1make = “Ford”\ncar1model = “Taurus”\ncar1color = “gold”\ncar1doors\
    \ = 4\ncar1year = 1998\n\ncar2make = “Pontiac”\ncar2model = “Grand Am”\ncar2color\
    \ = “silver”\ncar2doors = 4\ncar2year = 2004\n```\n\n如你所见，这非常杂乱。此外，你可能很难跟上所有不同的汽车。幸运的是，有一种更好的处理方法：建立一个共同特征的\
    \ `class`，然后可以使用它来规范汽车的建立：\n\n```\nclass car {\n  make\n  model\n  color\n  doors\n\
    \  year\n}\n```\n\n从这里开始，你可以创建对象。对象只是给定 `class` 的实例。\n\n```\ncar one = new car(“Ford”,’Taurus”,\
    \ “gold”, 4, 1998)\ncar two = new car(“Pontiac”, “Grand Am”, “silver”, 4, 2004)\n\
    ```\n\n然后，你拥有所有汽车的引用属性堆在一起，可以即时回回：\n\n```\nprint one.make\n```\n\n这将访问 `car` 类的对象\
    \ `one`，然后打印出属性 `make`，这意味着它将在控制台上打印出“Ford”。"
- fmt: "\nThere are many other concepts which make up object-oriented programming.\
    \ In fact, there are four central ideas which drive it: abstraction, encapsulation,\
    \ inheritance, and polymorphism.\n\n### Abstraction\nAbstraction is the idea that\
    \ the programmer should be as far away from the menial tasks of programming as\
    \ possible, and that ideas shouldn’t require much boilerplate. Instead, programming\
    \ should be a sequence of ideas taking place, and the programmer should be performing\
    \ an action using the synthesis of these different ideas. Therefore, abstraction\
    \ is the idea that programming really doesn’t need to revolve around the code\
    \ itself but rather the natural flow of the code and the efficiency of the code\
    \ in reaching its end goal.\n\n### Encapsulation\nEncapsulation is the idea that\
    \ everything should be neatly bubbled together and that a program should be self-contained.\
    \ Things should be able to be combined in order to form new ideas whenever such\
    \ a thing is necessary, and the program itself should be an extension of those\
    \ new ideas which are formed. Therein, object-oriented programming should also\
    \ offer some level of extensibility - meaning that the concepts which are developed\
    \ during object-oriented programming should be reusable either on the scale of\
    \ a single program or on the scale of multiple different programs.\n\n### Inheritance\n\
    Inheritance is the idea that classes should be able to derive from one another\
    \ in a natural family tree. A good way to think about this is the biological tree.\
    \ The biological tree is organized according to common traits into different biological\
    \ families at the macrobiological level. As these break down and become more and\
    \ more specified, the same common traits will exist from a parent family designation\
    \ to a child family designation, but the child designation will have more specific\
    \ features about it. For example, both birds and mammals have vertebrae and are\
    \ therefore classified to the phylum `chordata`. However, birds and mammals have\
    \ many differences, as well, with mammals giving live birth and birds hatching\
    \ eggs, for example. These specifications come into play in the child designations\
    \ from parent designation `chordata`. However, because something can be further\
    \ specified doesn’t mean that earlier specifications go away; giving something\
    \ an exacting specification doesn’t undo broader specifications, and classifying\
    \ a bird beyond `chordata` doesn’t take away its vertebrae. They’re just ways\
    \ of going beyond broader classifications into more exacting classifications.\n\
    \nFor instance, we could have a class called `wheeledTransport`, where the only\
    \ attribute was `numberOfWheels`. This is a very broad classification; cars, bikes,\
    \ and skateboards could all fit under this classification. We can, therefore,\
    \ extend the classification to include class definitions for all three with further\
    \ definitions of what each is. However, we could still access the parent attribute\
    \ `numberOfWheels`, as it would be inherited from the parent class `wheeledTransport`.\n\
    \n### Polymorphism\nPolymorphism is the final primary definition of object-oriented\
    \ programming. Polymorphism is the idea that something may have multiple definitions\
    \ with the ideal definition being chosen upon usage. This doesn’t exactly make\
    \ sense right now, but in object-oriented programming, you can do something called\
    \ argument overloading, and this is a great example of polymorphism. Argument\
    \ overloading is when you have two different function declarations which both\
    \ take different arguments but have the same function name. For example:\n\n```\n\
    bark() {\n  ...\n}\n\nbark(numberOfTimes) {\n  ...\n}\n```\n\nWhile these both\
    \ have the function name `bark`, the second takes the argument `numberOfTimes`,\
    \ which could then be used in the function. The first takes no argument. Which\
    \ one is used later in the code would depend on whether or not the user gave an\
    \ argument to the function call or not. We’ll be discussing functions and methods\
    \ here in just a second, so no worries.\n\nUnderstanding classes and objects is\
    \ one of the primary cornerstones to being an able programmer not just on Linux\
    \ but in general. This is one of the key points of programming in modern usage,\
    \ and you need to have a proper understanding of it in order to do anything else.\n\
    \n## Data Sets\nAnother foundational part of programming is understanding data\
    \ sets. Data sets are pretty much exactly what they sound like. There are going\
    \ to be many times in programming where you need to group data together. An immediate\
    \ example would be some sort of running record, such as grades. The conventional\
    \ way to do this would be like:\n\n```\nstudent1Grade1 = 99\nstudent1Grade2 =\
    \ 94\nstudent1Grade3 = 92\nstudent2Grade1 = 81\nstudent2Grade2 = 90\nstudent2Grade3\
    \ = 89\nstudent3Grade1 = 91\nstudent3Grade2 = 93\n…\n```\n\nAs you can see, this\
    \ is rather unwieldy, plus it would get complicated to keep up with all this information.\
    \ Moreover, as we’ll talk about in a second, when you need to assign a new value\
    \ to something, you’ll often find yourself writing inconveniently long statements.\n\
    \nSo, how can one approach this? A much better way is to link the data together\
    \ through establishing a data set. There are three primary different types of\
    \ data sets: arrays, vectors, and dictionaries. Vectors, lists, and sets are pretty\
    \ much three interchangeable terms with only minute differences between them;\
    \ `Python`, for example, foregoes having arrays for the most part and instead\
    \ uses lists, which are functionally like vectors.\n\nArrays have established\
    \ initial sizes. This means that memory is allocated for every member of the list\
    \ at the program’s runtime. The array doesn’t have to be immediately filled, but\
    \ the space remains open for every element in the array to be filled; if the array\
    \ is overfilled, it’s called an array overflow, and these are pretty much concretely\
    \ not permitted, and you’ll run into a compile error (which is when your program\
    \ refuses to compile or run due to an issue as such).\n\nVectors, lists, and sets\
    \ don’t have predetermined sizes. They scale automatically in accordance with\
    \ the size of the data set. They will never be bigger nor smaller than they need\
    \ to be. This can be both a good thing and a bad thing. Arrays are more memory\
    \ effective because they have all of the data allocated ahead of time; however,\
    \ if this isn’t a concern for you - as it normally won’t be on modern hardware\
    \ - vectors, lists, and sets serve a far better way to access data within a data\
    \ set.\n\nDictionaries are much like vectors, lists, and sets in that they scale\
    \ automatically. However, dictionaries set up an essential relationship between\
    \ data pieces, identifying one piece of data as a `key` which links to another\
    \ `value`. Consider it like a real dictionary; if the definition is the value,\
    \ then you can find the value of a given word by using the word itself as the\
    \ key. This means that you can search by the key for the given value that you’re\
    \ needing. This is the essential idea lying beneath dictionaries.\n\n## Arithmetic\
    \ and Assignment Operations\n\n### Control Flow (Conditionals)\nThis is one of\
    \ the first and foremost parts of programming that you need to understand as a\
    \ new programmer. The truth is that a lot of the programs that you make will be\
    \ useless without some way to determine how to make decisions. Decision making\
    \ is the single largest crux of almost any program. Even being able to test basic\
    \ conditions for an otherwise straightforward program - like whether a script\
    \ was able to connect to a download server, for instance - is essential to having\
    \ a well-running and bug-free program.\n\nWe talked a little bit about how things\
    \ can be true or false in programming. This is where that information really starts\
    \ to matter. Being able to tell whether something is true or false can have a\
    \ massive impact on the running of a program.\n"
  raw: 'There are many other concepts which make up object-oriented programming. In
    fact, there are four central ideas which drive it: abstraction, encapsulation,
    inheritance, and polymorphism.


    Abstraction is the idea that the programmer should be as far away from the menial
    tasks of programming as possible, and that ideas shouldn’t require much boilerplate.
    Instead, programming should be a sequence of ideas taking place, and the programmer
    should be performing an action using the synthesis of these different ideas. Therefore,
    abstraction is the idea that programming really doesn’t need to revolve around
    the code itself but rather the natural flow of the code and the efficiency of
    the code in reaching its end goal.


    Encapsulation is the idea that everything should be neatly bubbled together and
    that a program should be self-contained. Things should be able to be combined
    in order to form new ideas whenever such a thing is necessary, and the program
    itself should be an extension of those new ideas which are formed. Therein, object-oriented
    programming should also offer some level of extensibility - meaning that the concepts
    which are developed during object-oriented programming should be reusable either
    on the scale of a single program or on the scale of multiple different programs.


    Inheritance is the idea that classes should be able to derive from one another
    in a natural family tree. A good way to think about this is the biological tree.
    The biological tree is organized according to common traits into different biological
    families at the macrobiological level. As these break down and become more and
    more specified, the same common traits will exist from a parent family designation
    to a child family designation, but the child designation will have more specific
    features about it. For example, both birds and mammals have vertebrae and are
    therefore classified to the phylum chordata. However, birds and mammals have many
    differences, as well, with mammals giving live birth and birds hatching eggs,
    for example. These specifications come into play in the child designations from
    parent designation chordata. However, because something can be further specified
    doesn’t mean that earlier specifications go away; giving something an exacting
    specification doesn’t undo broader specifications, and classifying a bird beyond
    chordata doesn’t take away its vertebrae. They’re just ways of going beyond broader
    classifications into more exacting classifications.


    For instance, we could have a class called wheeledTransport, where the only attribute
    was numberOfWheels. This is a very broad classification; cars, bikes, and skateboards
    could all fit under this classification. We can, therefore, extend the classification
    to include class definitions for all three with further definitions of what each
    is. However, we could still access the parent attribute numberOfWheels, as it
    would be inherited from the parent class wheeledTransport.


    Polymorphism is the final primary definition of object-oriented programming. Polymorphism
    is the idea that something may have multiple definitions with the ideal definition
    being chosen upon usage. This doesn’t exactly make sense right now, but in object-oriented
    programming, you can do something called argument overloading, and this is a great
    example of polymorphism. Argument overloading is when you have two different function
    declarations which both take different arguments but have the same function name.
    For example:


    bark() {


    ...


    }


    bark(numberOfTimes) {


    ...


    }


    While these both have the function name bark, the second takes the argument numberOfTimes,
    which could then be used in the function. The first takes no argument. Which one
    is used later in the code would depend on whether or not the user gave an argument
    to the function call or not. We’ll be discussing functions and methods here in
    just a second, so no worries.


    Understanding classes and objects is one of the primary cornerstones to being
    an able programmer not just on Linux but in general. This is one of the key points
    of programming in modern usage, and you need to have a proper understanding of
    it in order to do anything else.


    Data Sets


    Another foundational part of programming is understanding data sets. Data sets
    are pretty much exactly what they sound like. There are going to be many times
    in programming where you need to group data together. An immediate example would
    be some sort of running record, such as grades. The conventional way to do this
    would be like so:


    student1Grade1 = 99


    student1Grade2 = 94


    student1Grade3 = 92


    student2Grade1 = 81


    student2Grade2 = 90


    student2Grade3 = 89


    student3Grade1 = 91


    student3Grade2 = 93


    …


    As you can see, this is rather unwieldy, plus it would get complicated to keep
    up with all this information. Moreover, as we’ll talk about in a second, when
    you need to assign a new value to something, you’ll often find yourself writing
    inconveniently long statements.


    So, how can one approach this? A much better way is to link the data together
    through establishing a data set. There are three primary different types of data
    sets: arrays, vectors, and dictionaries. Vectors, lists, and sets are pretty much
    three interchangeable terms with only minute differences between them; Python,
    for example, foregoes having arrays for the most part and instead uses lists,
    which are functionally like vectors.


    Arrays have established initial sizes. This means that memory is allocated for
    every member of the list at the program’s runtime. The array doesn’t have to be
    immediately filled, but the space remains open for every element in the array
    to be filled; if the array is overfilled, it’s called an array overflow, and these
    are pretty much concretely not permitted, and you’ll run into a compile error
    (which is when your program refuses to compile or run due to an issue as such).


    Vectors, lists, and sets don’t have predetermined sizes. They scale automatically
    in accordance with the size of the data set. They will never be bigger nor smaller
    than they need to be. This can be both a good thing and a bad thing. Arrays are
    more memory effective because they have all of the data allocated ahead of time;
    however, if this isn’t a concern for you - as it normally won’t be on modern hardware
    - vectors, lists, and sets serve a far better way to access data within a data
    set. 


    Dictionaries are much like vectors, lists, and sets in that they scale automatically.
    However, dictionaries set up an essential relationship between data pieces, identifying
    one piece of data as a key which links to another value. Consider it like a real
    dictionary; if the definition is the value, then you can find the value of a given
    word by using the word itself as the key. This means that you can search by the
    key for the given value that you’re needing. This is the essential idea lying
    beneath dictionaries.


    Arithmetic and Assignment Operations


    Control Flow (Conditionals)


    This is one of the first and foremost parts of programming that you need to understand
    as a new programmer. The truth is that a lot of the programs that you make will
    be useless without some way to determine how to make decisions. Decision making
    is the single largest crux of almost any program. Even being able to test basic
    conditions for an otherwise straightforward program - like whether a script was
    able to connect to a download server, for instance - is essential to having a
    well-running and bug-free program.


    We talked a little bit about how things can be true or false in programming. This
    is where that information really starts to matter. Being able to tell whether
    something is true or false can have a massive impact on the running of a program.'
