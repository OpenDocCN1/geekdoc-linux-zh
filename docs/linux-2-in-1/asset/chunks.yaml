    # Chapter 9 Boolean Operators


    Now, what if you only want to do something if multiple conditions are met? Indeed,
    there are times when you’ll want to perform the action if one or more conditions
    are met. This is where Boolean operators come in (to accommodate these).


    They include:


    *   `And` (`&&`)

    *   `Or` (`||`)


    As an example, consider that you want to perform an operation if your file is
    both readable and its size is greater than zero:


    Perhaps you now want to do something that is a bit different if the user is either
    Andy or Bob:


    ## Case Statements


    You may also want to take a different path based upon a variable corresponding
    to series of patterns. You can obviously use a series of ‘elif’ and ‘if’ statements
    but that would soon become unwieldy. Luckily, we can use a ‘case’ statement to
    make things cleaner.


    Look at the following examples to understand what I’m talking about:


    Here’s a more basic example:


    Now let me break that down for you:


    In the fourth line, we see that the line starts the mechanism `case`.


    In the fifth line, `start` is equal to `$1`; you then perform the actions that
    follow. `)` denotes the end of that pattern.


    In the seventh line, the end of this set of statements is identified with a double
    semi-colon (`; ;`). The next case to consider follows this.


    In the fourteenth line, you must note that the test for each case is a pattern.
    `*` denotes any number of any character. It essentially is a catch-all in the
