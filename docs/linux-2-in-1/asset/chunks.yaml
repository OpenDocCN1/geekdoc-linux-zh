- fmt: '

    Programming languages, therefore, offer a middle ground. While there are long
    genetic lineages that can form between various languages, all languages at their
    root serve the same purpose: dissecting instructions which are easily understandable
    by humans into terms which may be understood by computers.


    There are two main ways of achieving this goal, then. The first is to directly
    translate from the language that the program is written in to the language which
    the computer natively speaks. This is referred to as compiling code. Languages
    which are based around compiling code to a computer’s native language are called
    compiled languages.


    The second is to offer a sandbox within which programs can run - a virtual machine
    or runtime environment in which programs can be executed. This runtime environment
    is directly separated from the operating system in that the program doesn’t run
    on the actual operating system (though the program is certainly capable of performing
    functions on the operating system, such as writing and reading files), but rather
    within an abstracted environment from the operating system. This means that the
    code you write doesn’t have to be translated into a language the computer can
    understand - it just must be understandable by the virtual environment which is
    running the code.


    So what are the advantages of one or another? Well, each has their own perks and
    negatives. Compiled programs are generally going to have faster execution times
    because they’re translated directly into machine code and then run by the operating
    system directly. This means that there isn’t anything extra for the compiled programs
    to load besides what is necessary for the program alone. Compiled programs also
    generally offer a great deal of direct interface with the computer that interpreted
    programs don’t. For example, with a compiled program, since you’re speaking directly
    to the computer, you often will oversee doing things such as allocating or releasing
    stores in memory.


    Meanwhile, interpreted languages carry their own slew of benefits. Firstly, execution
    time generally doesn’t matter too much on modern computing hardware because, well,
    computers are simply a lot faster than they used to be. Additionally, one of the
    advantages of compiled languages can also be an advantage of interpreted languages:
    the fact that compiled languages are so near and dear to the computer can make
    them a little bit harder to manage, deploy, and quickly prototype. However, interpreted
    languages offer a high-enough level of abstraction that a programmer can reasonably
    prototype things much faster. Perhaps the biggest appeal of interpreted languages
    is that you don’t have to compile them in a different manner for every single
    computer; a program runs in an interpreter, period. This means that if an operating
    system has an interpreter for that language, programs written in that language
    will run on that operating system. One of the most popular interpreted languages,
    `Java`, actually gained a lot of mainstream appeal on these grounds: the idea
    of write once, run anywhere was extremely appealing at a time when there were
    numerous different operating systems vying for a place in the turbulent computer
    market, which was still young enough for there to not be an easy answer for software
    which needed to run on more than one system.


    In this book, we’re going to be covering both an interpreted and a compiled language,
    where `C++` is the compiled language and `Python` is the interpreted language.
    You’ll get an intimate feel for how the two different forms compare with one another.
    Don’t be scared by this proposition, though; as I said earlier in this chapter,
    programming languages are always a lot alike. There are concepts which underpin
    every single programming language, which we’ll be discussing in this chapter.


    ## Program Flow - Procedural, Functional, Object-Oriented, and So On


    This is one of the biggest separators between different programming languages;
    they generally have a paradigm which they prefer in terms of how things are to
    be written and programmed.


    Historically, functional or procedural languages were king. What this means is
    that all the code is written in such a way that it happens in a linear and procedural
    manner, with very few caveats for reuse. A program has clearly defined start and
    end points and a pretty narrow path for getting from one point to another. This
    made sense because computers were simpler and had less memory and hard-drive space;
    essentially, there was overall less room for the programmer to waste time or space.
    Everything was made with the purpose of being as simple and straightforward as
    possible for the computer to parse so that nothing was bigger or more consumptive
    in terms of power than it needed to be.


    However, eventually, this paradigm began to change. Perhaps the most important
    languages in the transition were `Ada` and `Smalltalk`. These languages showed
    early on the power of object-oriented programming, which would later become the
    primary mechanism of action for most programs on current computing hardware. `C++`
    would eventually come along as a development upon language `C`, specifically created
    to include the potential for object-oriented programming. Later would come `Java`,
    as well as the development of a huge number of different scripting languages intended
    to help programmers get prototypes off the ground quickly, like `Python`, `Perl`,
    and `Ruby`. All these languages have important concepts at their core. Many modern
    languages, such as `C#` and `Go`, are also using the object-oriented paradigm.


    So what is object-oriented programming? Well, this book focuses heavily on it
    in later chapters, given that you’re working with two languages which are stocked
    with different features to accommodate object-oriented programming. Essentially,
    object-oriented programming offers a far more modular, reusable, and understandable
    method of programming as compared to the functional or procedural programming
    paradigm. The object-oriented ethos differs largely in the fact that it enables
    the programmer to start breaking things down into major chunks. We’ll talk more
    about this in just a second when we start talking about objects and classes. While
    this isn’t going to come in handy for short Linux scripts using `Bash`, it’s going
    to invariably be useful as you start working with actual applications in `C++`
    and `Python` later in the book, so it’s important to cover all of the concepts
    right now so that when they actually start to be used in a certain way, you’re
    familiar with the underlying ideas.


    ## C and C-Style Languages


    This is perhaps one of the most important things to cover, conceptually, in this
    chapter. To understand different programming languages is to understand an entire
    genesis. At one part of this genesis lies a language called `C`. The reason this
    is important is that `C` and `Unix`-based operating systems go together pretty
    much perfectly.


    Allow me to take you back to 1972: Dennis Ritchie and Ken Thompson are developing
    a language which will act as a natural successor to a language called `B`, which
    itself is a natural successor to `BCPL`. This language is one of the most approachable
    at that point in time. It offers a lot of features that other languages aren’t,
    it’s straightforward enough that anybody can feel comfortable picking it up, and
    it makes the baseline difficulty of using and operating a computer a little bit
    lower.


    This language, however, would soon become something much bigger. Brian Kernighan
    and Dennis Ritchie were employees of AT&T’s Bell Labs - the same Bell Labs who
    would be the creator of `Unix`. Well, after the development of `Unix`, Ken Thompson
    decided to program a version of `Unix` that was written in `C`, rather than the
    very specific machine language which it was written in prior.

