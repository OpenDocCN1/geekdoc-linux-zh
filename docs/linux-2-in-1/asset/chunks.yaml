    检索要安装的软件包需要花费一些时间。完成后，命令行提示符将再次出现。为了激活有关图形桌面环境的更改，请重启系统。在命令行提示符处输入如下命令 `reboot`：


    ```

    root@debian95 ~# reboot

    ```


    重启 Linux 系统后，Debian 将用图形化启动界面欢迎我们（见下图）。按下 `Enter` 以以默认设置启动 Linux 系统。


    几秒后，将看到图形化登录界面（见下图）。使用之前创建的名为 `user` 的普通用户登录系统。输入 `user`，按下 `Enter`，然后输入用户的密码。再次再次按下
    `Enter` 确认并登录。


    接下来，将看到 XFCE 桌面（见下图）。该桌面包含几个默认元素：顶部导航栏、底部导航栏和桌面图标。所有提到的元素将在下文中进行更详细的解释。


    - **顶部导航栏**：此处显示了访问不同应用程序、四个虚拟桌面屏幕、时钟以及一个用于各种用户操作的按钮，例如锁定屏幕、切换用户、切换到待机模式和退出当前会话。

    - **底部导航栏**：此栏包含几个按钮，用于隐藏所有打开的窗口并显示空桌面、打开终端、文件管理器、网络浏览器、查找应用程序以及直接使用你的主目录打开文件管理器。


    ## 添加额外软件


    到目前为止，你的 Linux 系统上可使用的软件相当有限。在完成所有这些操作后，下一步是添加以下四个 Debian 软件包，让你的生活变得简单一点：


    - `firefox-esr`：Web 浏览器 Mozilla Firefox（扩展支持版）

    - `gnome-terminal`：由 GNOME 项目维护的终端模拟器

    - `xscreensaver`：适用于 X11 系统的基础屏幕屏保护程序

    - `vlc`：视频播放器 Video Lan Client (VLC)


    这三个软件包的安装将通过终端模拟器中的命令行完成（我们将在指南的后部分详细介绍终端）。目前，在你的系统中，已经安装了 X11 终端模拟器 `xterm`。要打开
    `xterm`，请点击底部导航栏中的终端按钮，或从右键菜单中选择 `Application > System > Xterm`。


    第一步，打开 `xterm`。接下来，在命令行提示符旁输入如下命令 `su` 并按下 `Enter`：


    ```

    user@debian95: ~$ su

    Password:

    ```


    你可能记得之前的步骤提到，只有管理员用户可以在 Debian 系统上安装、更新或删除软件。`su` 命令是 switch user 的缩写，会更改你的当前角色。在不带额外名称的情况下，角色将变为管理员
    root 用户。在密码提示符处输入管理员的密码并按下 `Enter`。


    作为管理员用户，按照如下安装软件包 `firefox-esr`、`gnome-terminal`、`xscreensaver` 和 `vlc`：


    ```

    root@debian95: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc

    ```


    输出所示：


    安装四个软件包后，你可以切换回普通用户角色。按下 `Ctrl+D` 退出管理员部分，再次按下 `Ctrl+D` 关闭 `xterm`。


    ### 安装 Firefox 具有以下效果：

    - 应用程序菜单中可以使用新软件 `Firefox`。

    - 命令行中可以使用新命令 `Firefox`。

    - 底部导航栏中的地球图标链接到 Firefox Web 浏览器。


    ### 安装 GNOME terminal 软件包具有以下效果：

    - 命令行和应用程序菜单中都可以使用新软件 `gnome-terminal`。

    - 底部导航栏中的终端图标链接到 GNOME 终端。

    - 右键菜单中的 `Open Terminal Here` 项指向 GNOME 。


    为了查看更改，请从右键菜单中选择 `Open Terminal Here` 项。下图显示了终端窗口。它具有白色背景和更大的字体，更易阅读。


    ## 退出 Linux


    为了正确使用 Linux，你必须学会如何退出 Linux 并重启系统。在下面，你将学习如何退出 XFCE 桌面环境、关闭 Linux 系统以及重启系统。我们将介绍两种方法；第一种基于图形界面，第二种也可以用于服务器和无线路由器等非图形化系统。


    ### 退出 XFCE 桌面环境


    退出 XFCE 桌面并注销当前会话最简单的方法是点击顶部导航栏右上角的按钮。按钮上标记有你的用户名，在我们的案例中是 `Debian User`。从小菜单中选择标记为
    `Log Out` 的最后一项。或者，你可以从左上角的 `Application` 按钮或右键菜单中选择 `Log Out` 项。


    会打开另一个窗口，其中包含标记为 `Log Out`、`Restart`、`Shutdown`、`Suspend` 和 `Hibernate` 的五个按钮。点击
    `Log Out` 退出会话。随后，你将返回登录界面。


    ### 关闭 Linux 系统


    关闭整个 Linux 系统的方法与退出 XFCE 类似。点击顶部导航栏右上角的按钮。按钮上标记有你的用户名，在我们的案例中是 `Debian User`。从小菜单中选择标记为
    `Shut Down` 的项。在下一个对话框中点击标记为 `Shut Down` 的按钮停止 Linux 系统。


    在终端会话中，管理员用户可以运行 `halt` 或 `shutdown -h now` 命令。普通用户不允许执行这些命令。


    ```

    # halt

    ```


    ### 重启 Linux 系统


    要重启 Linux 系统，点击顶部导航栏右上角的按钮。按钮上标记有你的用户名，在我们的案例中是 `Debian User`。从小菜单中选择标记为 `Restart`
    的项。在下一个对话框中点击标记为 `Restart` 的按钮重启 Linux 系统。


    在终端会话中，管理员用户可以运行 `reboot` 或 `shutdown -r now` 命令。普通用户不允许执行这些命令。


    ```

    # reboot

    ```


    随后，系统将重启，你将返回启动界面。


    第 4 章 Linux 命令行


    此时，你应该对基本命令有了相当的了解，并且 Linux 已经安装在你的系统中。你现在面临着一个绝佳的机会——一个完全空白的，你可以在这里开始设计操作系统。通过
    Linux，你可以轻松地定制你的操作系统，使其完全按照你的意愿运行。为了开始，你需要安装一些可靠且功能强大的应用程序。


    '
- fmt: '

    Linux also has another advantage over some popular operating systems. This include
    the ability to install more than one package at a time, without having to complete
    a process or more between windows. It all comes down to what information is entered
    in the command lines. An example of this is as follows:


    ```bash

    sudo apt-get install comp beta-browser

    ```


    There are even more advantages (other than convenience) to being able to install
    multiple packages. In Linux, these advantages include updating. Rather than updating
    each application, one at a time, Linux allows for all the applications to be updated
    simultaneously through the update manager.


    The Linux repository is diverse, and a proper search through it will help you
    to identify a large variety of apps that you will find useful. Should there be
    an application that you need which is not available in the repository, Linux will
    give you instructions on how you can add separate repositories.


    ## The Command Line


    Using Linux allows you to customize your system to fit your needs. For those who
    are not tech savvy, the distributions settings are a good place to change things
    until you get what you want. However, you could spend hours fiddling with the
    available settings and still fail to find setting that is perfect for you.


    Luckily, Linux has a solution and that comes in the form of the command line.
    Even though the command line sounds complex, like something that can only be understood
    by a tech genius, it is quite simple to discern.


    The beauty of adjusting things in your operating system using the command line,
    so that the sky is the limit and creativity can abound.


    To begin, you need to use “The Shell”. This is basically a program which can take
    in commands from your keyboard and ensure that the operating systems performs
    these commands. You will also need to start a “Terminal”. A terminal is also a
    program and it allows you to interact with the shell.


    To be a terminal, you should select the terminal option from the menu. In this
    way, you can gain access to a shell session. In this way you can begin practicing
    your command prompts.


    In your shell session, you should see a shell prompt. Within this shell prompt
    you will be see your username and the name of the machine that you are using,
    followed by a dollar sign. It will appear as follows:


    ```bash

    [name@mylinux me] $

    ```


    If you try to type something under this shell prompt, you will see a message from
    `bash`. For example,


    ```bash

    [name@mylinux me] $

    lmnopqrst

    bash: lmnopqrst

    command not found

    ```


    This is an error message where the system lets you know that it is unable to comprehend
    the information you put in. If you press the up-arrow key, you will find that
    you can go back to your previous command, the `lmnopqrst` one.


    If you press the down arrow key, you will find yourself on a blank line.


    This is important to note because you can then see how you end up with a command
    history. A command history will make it easier for you to retrace your steps and
    make corrections as you learn how to use the command prompt.


    ## Command Lines for System Information


    The most basic and perhaps most useful command lines are those that will help
    you with system information. To start, you can try the following:


    ### Command for Date


    This is a command that will help you to display the date.


    ```bash

    root@nagsis: -# date

    Thursday May 21 12.31.29 IST 2o15

    ```


    ### Command for Calendar


    This command will help display the calendar of the current month, or any other
    month that may be coming up.


    ```bash

    root@nagsis: -# cal

    ```


    ### Command for uname


    This command is for Unix Name, and it will provide detailed information about
    the name of the machine, its operating system and the Kernel.


    ```bash

    root@nagsis: -# uname –a

    Linux Nagsis 3.8.0-19-generic #30

    Ubuntu SMp Wed May 20 16:36:12 UTC

    2013 i686 i686 GNU/Linux

    ```


    ## Navigating Linux Using Command Lines


    You can use the command lines in the same way that you would use a mouse, to easily
    navigate through your Linux operating system so that you can complete the tasks
    you require. In this section, you will be introduced to the most used commands.


    Finding files in Linux is simple, as just as they are arranged in order in familiar
    Windows programmes, they also follow a herarchical directory structure. This structure
    resembles what you would find with a list of folders and is referred to as directories.


    The primary directory within a file system is referred to as a root directory.
    In it, you will be able to source files, and subdirectories which could contain
    additional sorted files. All files are stored under a single tree, even if there
    are several storage devices.


    `pwd`


    `pwd` stands for print working directory. These will help you to choose a directory
    where you can store all your files. Command lines do not give any graphical representation
    of a filing structure. However, when using a command line interface, you can view
    all the files within a parent directory, and all the pathways that may exist in
    a subdirectory.


    This is where the `pwd` comes in. Anytime that you are simply standing in a directory,
    you are in a working directory. The moment you log onto your Linux operating system,
    you will arrive in your home directory (which will be your working directory while
    you are in it). In this directory, you can find all your files. To identify the
    name of the directory that you are in, you should use the following `pwd` command.


    ```bash

    [name@mylinux me] $pwd

    /home/me

    ```


    You can then begin exploring within the directory by using the `ls` command. `ls`
    stands for list files in the directory. Therefore, to view all the files that
    are in your working directory, type in the following command and you will see
    results as illustrated below.


    ```bash

    [name@mylinux me] $ls

    Desktop         bin             linuxcmd

    GNUstep         ndeit.rpm       nsmail

    ```


    `cd`


    `cd` stands for change directory. This is the command that you need to use when
    you want to switch from your working directory and view other files. To use this
    command, yu need to know the pathname for the working directory that you want
    to view. There are two different types of pathnames for you to discern. There
    is the absolute pathname and the relative pathname.


    The absolute pathname is one that starts at your root directory, and by following
    a file path, it will easily lead you to your desired directory. Suppose your absolute
    pathname for a directory is `/usr/bin`. The directory is known as `usr` and there
    is another directory within it using the name `bin`. If you want to use the `cd`
    command to access your absolute pathname, you should type in the following command:
    -


    ```bash

    [name@mylinux me] $cd/user/bin

    [name@mylinux me] $pwd

    /usr/bin

    ```


    You can use a relative pathname when you want to change the new working directory
    which is `/usr/bin` to the parent directory, which would be `/usr`.


    ```bash

    [name@mylinux me] $cd..

    [name@mylinux me] $pwd

    /usr

    ```

