  trans: "\n\n- `pr`\n- `paste`\n- `grep`\n- `cut`\n- `tr`\n- `cmp`\n- `diff`\n- `find`\n\
    - `exec`\n- `xargs`\n\n## 15. 探索 Shell\n## 16. 归档与压缩\n## 17. 奖励\n### Bash Shell\n\
    ### Shell 命令\n### 组合你的 Shell 命令\n## 18. 如何创建基础脚本\n### 你的第一个 Shell 脚本\n### 在可用的\
    \ Shell 脚本中使用参数\n### 结论\n\n# 描述\n\nLinux 是由不同的互连程序组成的相当复杂的系统。Linux 系统包含许多组件。尽管大多数组件是可以互换的并允许大量的自定义，但\
    \ Linux 必须包含某些组件才能正常运行。当然，某些程序比其他程序更重要，但核心原理始终保持不变。\n\n该程序负责 Linux 系统的正常启动。它为\
    \ Linux 内核和初始 RAM 磁盘（称为 ignited）选择最佳参数。内核是操作系统的核心。它在启动后立即启动初始化进程。init 进程可以被任何合适的替代品（如\
    \ systemd）替换，但引导加载程序的功能保持不变。初始 RAM 磁盘为你提供临时内存，在加载根系统之前加载关键文件。\n\n如果你有一台运行基础输入/输出系统的旧电脑，你可以在主引导记录（MBR）中找到引导加载程序，它占用磁盘上的前\
    \ 512 字节。新电脑具有统一扩展固件接口（UEFI），并存储在名为 EFI 的特殊分区中。设备通电后会立即进行自检。这种自检称为电源自检（POST），如果成功，引导加载程序将由\
    \ `BIOS` 或 `UEFI` 加载。\n\n尽管引导加载程序很小且简单，但非常关键。在大多数与 Linux 相关的论坛上，你会发现遇到引导程序遇到问题的人，也会发现帮助你解决问题的人。Linux\
    \ 系统上可以安装许多不同的引导加载程序，但下面我们将讨论最流行且最易使用的几个。\n\n本指南将重点关注：\n- 什么是 Linux？\n- 什么是 Ubuntu？\n\
    - Linux 安装过程\n- Linux 命令行\n- 变量\n- 使用 Shell\n- 嵌套 If 语句\n- 布尔运算符\n- 日志分析\n- 创建启动盘\n\
    \n# 引言\n\n在本章中，我将提供一些关于该操作系统架构的简要信息，并讨论初学者可以选择的不同 Linux 发行版。\n\n## Linux 架构\n\n\
    Linux 架构可以分为两个空间：用户空间（User Space）和内核空间（Kernel Space）。\n\n- 用户空间：这是使用应用程序的地方。用户空间的\
    \ `GNU C library` 是连接到内核并在用户空间和内核空间之间切换的接口。它使用所有可用内存。\n- 内核空间：所有的内核服务在此处处理。内核空间进一步分为：\n\
    \    - 系统调用：用户进程可以通过 `System Call`（系统调用）访问内核空间。执行`System Call`时，参数从用户空间传递到内核空间。这是实现基本函数的层。\n\
    \    - 内核代码：这是架构无关的代码，可以在 Linux 支持的所有架构中看到。\n    - 相关的内核代码：这是针对特定平台的代码层。\n\n##\
    \ Linux 发行版\n\n每个 Linux 发行版由 Linux 内核加上工具和配置文件组成。大多数 Linux 发行版都可以从它们的网站下载。让我们根据以下标准看看几个流行的\
    \ Linux 发行版（或称为版本）之间有何不同：\n\n### 可用性\n如前所述，Linux 是免费软件，但提供支持合同和专有组件的公司会收费提供它。在下表中，`Red\
    \ Hat Enterprise` 和 `SUSE Enterprise` 都提供商业版 Linux，但它们也有免费的替代方案——`Fedora` 和 `openSUSE`。\n\
    \n### 包格式\nLinux 发行版以包的形式出现。包是分组在一个文件中的文件。`RPM` 是最常用的。\n\n### 发布周期\n这是发行版发布新软件的频率。发布周期较短的发行版以最短的时间提供最新的软件，而发布周期较长的发行版则旨在提供尽可能稳定的环境。一个发行版可以兼顾这两种。看看\
    \ Ubuntu，它既发布长期支持（`LTS`）版本（周期较长），也通过 6 个月的周期发布最新软件。\n\n为了帮助你决定哪种是适合你的的发行版，请考虑上述标准并研究以下其他领域：\n\
    - 桌面环境：进行研究并看看你中中的发行版是否具有你喜欢的界面视觉效果和操作感，请检查它的可定制程度如何。\n- 硬件兼容性：取决于你正在使用的硬件，在你安装发行版时，某些驱动程序可能尚未可用。先从在线资源检查哪些驱动是可以开箱即用的。\n\
    - 社区支持：寻找拥有大型在线社区的。社区越大，越容易找到文档并获得支持。\n\n# 第 1 章 什么是 Linux？\n\nLinux 是一系列基于 `Linux\
    \ Kernel` 的免费开源操作系统家族；该操作系统内核由 Linus Torvalds 于 1991 年 9 月 17 日首次发布。Linux 通常被封装在\
    \ Linux 发行版（简称 `distro`）中。发行版包含了 Linux 内核以及支持性的系统软件和库，其中许多组件由 `GNU Project` 提供。\n\
    \n（来源：Wikipedia.org）\n\n`Linux 内核`于 1991 年以 `0.0.1` 版本问世。今天仍负责内核开发的 Linus Torvalds\
    \ 并没有意识到他发布这个小业余项目会引发什么。\n\n今天，Linux 一术通常被用作整个系统的同义词。但严格来说，只有`内核`被称为 Linux。只有当结合遵循\
    \ `GNU` 准则的应用程序和程序时，它才成为我们今天熟悉并喜爱的系统。\n\n第一个 Linux 发行版发布于 1994 年。它们致力于开发作为 Windows\
    \ 和 MacOS 替代品的可用系统：\n- Debian\n- Suse\n- Slackware\n- RedHat\n\n2002 年 `Open Office\
    \ (Version 1)` 的发布是一个巨大的进步。它是一个功能齐全的开源办公套件，免费提供。当然，与 `Microsoft Office` 相比，它的功能仍然有限，但\
    \ `Open Office` 随着时间的推移变得越来越好。\n\n`Libre Office` 后来作为 `Open Office` 的独立分支开发。这个广泛且已非常成熟的办公套件预装在\
    \ `Ubuntu 18.04` 中。\n\n目前有无数种不同的 Linux 发行版。\n\n"
- fmt: "\nHowever, most of them are based on Debian, OpenSuse, Ubuntu, Arch Linux,\
    \ Gentoo or Red Hat.\n\n# Chapter 2 What is Ubuntu?\n\nThe Linux operating system\
    \ Ubuntu exists since 2004.\n\nThe Ubuntu project was founded by Marc Shuttleworth,\
    \ a South African multimillionaire, who is also the main sponsor through his company\
    \ Canonical.\n\nIn Zulu language, Ubuntu means \"humanity towards others \"`.\n\
    \nThe focus of the project is to develop an operating system that should be available\
    \ to as many people as possible all over the world.\n\nSpecial attention was paid\
    \ to intuitive usability and tools for universal accessibility.\n\nUbuntu is open\
    \ source software that is available free of charge.\n\nSince the release of the\
    \ first version, the degree of recognition and popularity could be increased steadily.\n\
    \nUbuntu is based on Debian. This means that the package management created by\
    \ Debian and the software selection has been adopted.\n\nHowever, over time both\
    \ distributions moved away from each other.\n\nFor example, Ubuntu has often been\
    \ accused of being too commercial, while Debian continued to follow the philosophy\
    \ of open source, denying some of the innovations that Ubuntu introduced.\n\n\
    Each year in April and October a new version of Ubuntu is released, which receives\
    \ support for nine months.\n\nIt is named after the year and month of release.\n\
    \nUbuntu 18.10 was released in October (10) of 2018 (18).\n\nSupport means that\
    \ Ubuntu's operating system receives updates in the form of security updates and\
    \ bug fixes.\n\nHowever, every two years (even years!) a special version is released\
    \ which will receive support from Ubuntu for a period of 5 years.\n\nThis is called\
    \ an LTS version.\n\nLTS stands for Long-Term-Support.\n\nThe current version\
    \ is Ubuntu 18.04.\n\nSupport for this version will end after 5 years in April\
    \ 2023.\n\nThe next LTS version Ubuntu 20.04 will be released in April 2020.\n\
    \nSupport for this version will end after 5 years in April 2025.\n\nAll other\
    \ versions are supported for 9 months.\n\n![support english](Images/image00270.gif)\n\
    \nThe advantage of short-term supported systems is that the software they contain\
    \ is usually more up to date than that of the last regular LTS-version.\n\nThe\
    \ LTS-version essentially remains the same for five years.\n\nUpdates only include\
    \ bug fixes and security patches.\n\nThis may be too conservative for some users\
    \ in the long run.\n\nHowever, the older a software is, the more it is tested\
    \ and therefore more stable.\n\nNewer versions of applications, such as those\
    \ included in the short-term supported versions, may be more unstable because\
    \ the testing period was shorter.\n\nIn this quick guide, I describe Ubuntu 18.04\
    \ LTS.\n\nMuch of it is also applicable to Ubuntu 18.10 and Ubuntu 19.04.\n\n\
    For beginners it is recommended to try out the LTS version first.\n\nA Shortterm-version\
    \ makes sense if the LTS version does not support your hardware optimally.\n\n\
    In addition to the official names that refer to the release date, Ubuntu versions\
    \ always have an additional fantasy name.\n\nThat is 18.04 Bionic Beaver and 18.10\
    \ Cosmic Cuttlefish.\n\n# Chapter 3 Linux set-up process\n\nIn this section, we\
    \ will highlight the process of installing and configuring Debian, showing you\
    \ every single step along the way. \n\n## The types of installations\n\nDebian\
    \ offers a variety of methods for a proper setup. This includes a graphical and\
    \ a text-based installation; we will use the former. For installation media the\
    \ Debian developers offer three variants: \n\n* A CD or DVD for 32 bit and 64\
    \ bits \n* A network image for 32 bit and 64 bits (a so-called `Netinst-ISO`)\
    \ \n* A tiny CD for 32 bit or 64 bits \n\nWe also have test media available. These\
    \ include live images for 32 bit and 64 bit and allow you to try Debian before\
    \ installing it on your computer. During the time of writing this document, version\
    \ 9.5 is the current stable release of Debian. The setup described here is based\
    \ on this release and the `amd64` architecture. \n\nAfter downloading the network\
    \ image from `www.debian.org/distrib`, no further static images are required to\
    \ be referenced in the system. Instead, it depends on the internet connection\
    \ to retrieve the packages to be installed and keep your operating system up to\
    \ date. \n\nThe entire process will take you about an hour, and it allows you\
    \ to have a lean software selection according to your specific needs. Software\
    \ packages that you do not use will not be available on your system. They can\
    \ be added whenever you feel the need for them. \n\nThe target system of our installation\
    \ is an XFCE-based desktop system for a single user with a web browser and a music\
    \ player. For the web browser we use `Mozilla Firefox` and for the music player,\
    \ `VLC`. Both programs are a permanent component of the Linux distribution. The\
    \ environment we use for demonstration purposes is a virtual machine based on\
    \ `VirtualBox` with 4 GB of RAM and 15 GB of disc space. \n\n## Installing Linux\
    \ Step-by-Step\n\n### Boot Menu\n\nIn order to begin with the installation of\
    \ Debian, first, boot the computer (in our case the `VirtualBox` image) from the\
    \ ISO image you have downloaded. If you are also using a virtual machine, see\
    \ your virtual machine vendor website for help on how to enable the ISO image.\
    \ Next, wait for the boot menu to appear on the screen. The image below shows\
    \ you the different options that are offered. Using the cursor keys, you can navigate\
    \ the boot menu, and the Enter key selects an entry. \n\nThe different options\
    \ are:\n\n* `Graphical install`: start the installation process using a graphical\
    \ installer \n* `Install`: starting the installation process using a text-based\
    \ installer \n* `Advanced options`: select further options like `Expert mode`,\
    \ `Automated install` or `Rescue mode` (see image below for more details) \n*\
    \ `Help`: get further help \n* `Install with speech synthesis`: starting the installation\
    \ process with speech support \n\nFrom the main boot menu choose the Graphical\
    \ install and press the Enter key to proceed.\n\n### Language Selection\n\nNext,\
    \ choose the language you prefer to be used during the entire installation process.\
    \ The dialogs and messages are translated accordingly. This selection does not\
    \ determine the language irrevocably your Linux system will have; you can always\
    \ choose a different language later. \n\nThe image below shows the dialog box.\
    \ English is already pre-selected, and so you just must click the Continue button\
    \ on the lower-right corner of the dialog box in order to continue.\n\n### Location\
    \ Selection\n\nThird, select regarding your location (see image below). Based\
    \ on your language setting made before, the countries are listed in which the\
    \ chosen language is mainly spoken. This also influences the locale settings like\
    \ the time zone your computer is in. In order to have different setting choose\
    \ the entry `other` from the end of the list and go on from there. Immediately\
    \ you are over, click the Continue button to proceed with step four.\n\n### Keyboard\
    \ Selection\n\nFourth, choose your keyboard layout from the list (see image below).\
    \ For the United States, the pre-selection is American English. If you use a different\
    \ keyboard layout select the right one from the list. If done, click the Continue\
    \ button to proceed with step five.\n\n### Network Setup\n\nStep five includes\
    \ loading the installer components from the ISO image, and the detection of the\
    \ network hardware in order to load the correct network driver. Then, the installer\
    \ tries to connect to the internet to retrieve an IP address via DHCP from your\
    \ local network server. \n\nWhen done, you can set up the hostname of your computer\
