    the name beginning with a. In the same way, if you wanted to unhide a directory
    or file, you would simply rename it, removing the a. from the start of the name.
    The command that you learned to list directories and files will NOT show those
    that are hidden. Instead, you can modify the command to add in -a as a command
    line option, allowing those hidden files and directories to be shown.


    ls Documents


    FILE2.txt File2.txt file2.TXT


    ...


    ls -a Documents


    . .. FILE2.txt File2.txt file2.TXT. hidden.file.txt


    ...


    In this example, you can see that, when the directories and files were listed,
    the first two were. and then. and if you need to brush up on those head back to
    the section on paths. 


    Summary


    Here’s a quick summary of what you learned in this section:


    *   “File” is used to get information about the type of a directory or file. 


    *   “ls –a” lists all files in a directory, including those that are hidden.


    *   Everything is a file in Linux, including directories.


    *   File extensions are not important because Linux will investigate the file
    to see what it is.


    *   Linux is a case-sensitive language, so watch out for capitalization.


