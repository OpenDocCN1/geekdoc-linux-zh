    \ line argument, ‘else’ read from “stdin” as illustrated below.\n\nNote: Stdin\
    \ (standard input) is an input stream where data is sent to a program and read\
    \ by the program. This will be discussed more shortly.\n\n## If Elif Else   \n\
    \nWe also have times when we have a series of conditions that may lead to different\
    \ paths. \n\nLook:\n\nThis may be the case in this example:\n\nYou are 18 years\
    \ or above, so you may go to a party; if you are not, but have an okay from your\
    \ guardians, you may go but must be back by midnight. Otherwise, you can’t attend\
    \ the party. \n\nThis is how it looks:\n\nYou can have as many ‘elif’ branches\
    \ as you want; the final else is also optional.\n\n# Chapter 9 Boolean Operators\n\
    \nNow, what if you only want to do something if multiple conditions are met? Indeed,\
    \ there are times when you’ll want to perform the action if one or more conditions\
    \ are met. This is where Boolean operators come in (to accommodate these). \n\n\
    They include:\n\n*   And (&&)\n\n*   Or (||)\n\nAs an example, consider that you\
    \ want to perform an operation if your file is both readable and its size is greater\
    \ than zero:\n\nPerhaps you now want to do something that is a bit different if\
    \ the user is either Andy or Bob:\n\n## Case Statements   \n\nYou may also want\
    \ to take a different path based upon a variable corresponding to series of patterns.\
    \ You can obviously use a series of ‘elif’ and ‘if’ statements but that would\
    \ soon become unwieldy. Luckily, we can use a ‘case’ statement to make things\
    \ cleaner. \n\nLook at the following examples to understand what I’m talking about:\n\
    \nHere’s a more basic example:\n\nNow let me break that down for you:\n\nIn the\
    \ fourth line, we see that the line starts the mechanism ‘case’.\n\nIn the fifth\
    \ line, ‘start’ is equal to $1; you then perform the actions that follow. ‘)’\
    \ denotes the end of that pattern.\n\nIn the seventh line, the end of this set\
    \ of statements is identified with a double semi-colon (; ;). The next case to\
    \ consider follows this.\n\nIn the fourteenth line, you must note that the test\
    \ for each case is a pattern. ‘*’ denotes any number of any character. It essentially\
    \ is a catch-all in the instance no other cases match. It is often used even though\
    \ it is not necessary. \n\nIn the last line, we see esac. It is ‘case backwards’;\
    \ it shows you that you are at the end of the case statement. All other statements\
    \ after this one is executed normally. \n\nLet’s now look at one slightly complex\
    \ case where the use of patterns is slightly more.\n\nActivity: make your own\
    \ decisions\n\n1.  Build a Bash script that takes two numbers as command line\
    \ arguments. \n\n2.  Create a script that accepts a file as a command line argument\
    \ and then analyze it. For instance, you could check whether the file is writable\
    \ or executable. A message should be printed if true, and another one if false. \n\
    \n3.  Now create a script that prints a message according to the day of the week\
    \ it is. For instance, ‘Happy surf day’ for Saturday, ‘TGIF for Sunday’ and so\
    \ on.\n\n# Chapter 10 Working with Linux Files and Directories\n\nNow that you’ve\
    \ got your hands a little dirty, you must be eager to get on to some more coding\
    \ and really get down to playing about in the system. You will, I promise, but\
    \ first, there is some more theory that you really need to learn so that, when\
    \ you do get into the system, you truly understand why it does what it does and\
    \ how to do more with the commands you have learned. So, let’s take a deeper look\
    \ at the core concepts you need to learn.\n\nEverything in Linux is a file.\n\n\
    This is a very important concept to grasp—everything in Linux, no matter where\
    \ it’s or what it does, is a file. Text files are, obviously, files. Directories\
    \ are files. Your computer keyboard is a read-only file, the monitor on your computer—even\
    \ this is a file, albeit a write-to file. Everything. To start with, this won’t\
    \ have any real effect on what you do, but you must always keep it in mind as\
    \ it will help you to grasp how Linux works with directory and file management.\n\
    \nLinux is known as an “extensionless system.”\n\nThis one is a little bit harder\
    \ to grasp, but as you work through this book and learn more, you’ll find that\
    \ it makes sense. File extensions are usually made up of a series of 2, 3, or\
    \ 4 characters after a dot. You’ve already seen these with Word (.doc, .docx),\
    \ .pdf, and so on. This extension is what tells you the type of file you are working\
    \ with. These are some of the more common ones that you’ll come across:\n\n* \
    \  File.exe: a program or a file that’s executable\n\n*   File.txt: a file in\
    \ plain text\n\n*   File.png, file.jpg, file.gif: all image files\n\nIn many systems,\
    \ like Windows, this file extension is very important because the system will\
    \ use it to work out what kind of file it’s working with. In Linux, it's different.\
    \ The Linux system will ignore that extension and, instead, it will investigate\
    \ the file itself to see what it’s to do. So, for example, you could have a file\
    \ that’s named monkey.gif, a picture of a monkey. You could give the file a new\
    \ name, such as monkey.txt or even just monkey, and Linux will see it as the image\
    \ file it really is. Because of this, you might sometimes find it difficult to\
    \ determine what type a file is, but there is a really easy way to find out in\
    \ Linux by using one simple command: file.\n\nfile [path]\n\nNow, you are probably\
    \ asking yourself why the command line argument is a path and not a file. If you\
    \ think back, remember that every directory or file that we specify on the command\
    \ line is a path. And, because a directory is also a file, it’s correct to say\
    \ that the path is nothing more than a journey to a system location, and the location\
    \ is the file. \n\nLinux is case sensitive.\n\nThis is one of the most important\
    \ concepts and is the one that tends to cause the most problems for those new\
    \ to the Linux program. You already know that systems like Windows are case insensitive\
    \ in terms of file referencing, but Linux is different. You can have multiple\
    \ directories or files with identical names but different cases. For example:\n\
    \nls Documents\n\nFILE2.txt File2.txt file2.TXT\n\n...\n\nfile Documents/file2.txt\n\
    \nDocuments/file2.txt: ERROR: cannot open 'file2.txt' (No such file or directory)\n\
    \nEach one of these is seen as an individual file by Linux."
