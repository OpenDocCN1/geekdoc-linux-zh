  trans: '

    将 Ubuntu 或 Xubuntu（分别为 1.8 GB 和 1.3 GB）与 5 GB 的 Windows 7 进行对比。与此同时，Linux 程序的集合不仅不逊于微软的产品，反而更胜一筹！程序也是如此——它们的体积要小得多。


    ## 10. 响应迅速的社区


    Linux 与 Windows 不同，在 Windows 中你只能独自面对问题。首先，有一个官方的英语社区（https://www.linux.org/forums/）。


    ## 7. 如何安装 Linux


    ### 版本


    现在我们简要介绍一下安装哪个版本的 Linux。这是一个非常流行的发行版，具有许多功能。它还提供了来自 FLOSS（自由开源自由软件）社区的支持。不过，Ubuntu
    本身也有许多“变体”。它们基本上是相同的 Ubuntu 核心，只是不同的图形/桌面环境。你会看到它们被列为 XFCE、Openbox、GNOME、Unity
    或 KDE 等，仅举几个。


    这些发行版的不同变体本身也有不同的元素，例如窗口管理器和桌面环境。


    窗口管理器允许与图形用户界面进行所有交互的软件。这些元素提供了不同的窗口面板、菜单和任务栏、设置和外观。如果两者结合，它们会为你提供更多选项（这适用于 GNOME
    和 KDE 版本的 Linux 桌面环境）。你也可以下载多个环境，并在每次启动时需要不同的桌面环境时在它们之间切换。Ubuntu 的大多数此类环境都同时带有环境和窗口管理器。


    ### 桌面版安装


    同样，这个版本的 Linux 将为你提供许多人在使用电脑时习惯并预期的图形界面 (GUI)。


    ### 关于安装


    在开始之前，为了保险起见，在尝试任何一个版本之前，你应该确保你已经备份了电脑。Linux 崩溃的概率没有 Windows 那么大，但谨慎行事并保护你的数据是最好的。


    打开 `www.Ubuntu.com` 网站。始终使用正规网站获取你的发行版和其他需求。一旦你看到了需要的发行版，请检查你电脑的要求。有足够的空间安装吗？是否有硬件或软件组件不符合该发行版声称的要求？在这个阶段，你可以决定在继续之前是否需要修复或添加任何内容。你甚至可能决定选择另一个发行版。


    从网页上，选择你喜欢的 Linux CD 镜像（`.ISO` 文件），并选择下载到光盘或 USB 盘中。强烈建议下载到外部介质，而不是直接安装到硬盘上。它是便携的，是非永久的，并且不会更改你的电脑系统。你可以直接从制作的副本启动系统。关于这一点后续会有更多介绍。桌面版本也会比服务器版本小得多。


    下载完成后，你应该从光驱驱动器或 USB 启动。这被称为“现场环境”（live environment）。好消息是，这完全不会影响或改变你的电脑。不过，你也有将发行版安装到电脑的选项。下载期间请保持耐心，因为无论哪种情况，下载可能需要一段时间。记住，这个版本相对于服务器版本要大一点。这取决于你的硬件、系统年龄以及互联网速度。


    通过安装，你可以轻松地在使用之间保存设置、文件和其他组件，这是通过 USB 或光盘重启无法实现的。不过，你也可以开启“持久化”（persistence）设置将文件保存到驱动器，以便下次使用
    USB 盘重启时使用。


    ### 尝试（使用现场）或安装 Ubuntu (www.linuxandubuntu.com)


    对于在驱动器上安装：


    对于硬盘安装，我们建议使用引导式安装，除非你对 Linux 更通晓（如果是的话，你可能就不会读这本指南了）。


    Ubuntu 在安装系统之前做出了以下额外建议：


    * 确保你已接入电源并连接到互联网。保持连接。

    * 在安装时下载更新，并选择同时安装第三方软件。


    你应该记住，通过在整个硬盘上安装 Ubuntu，你将擦除驱动器上当前的所有数据。在实际驱动器上安装 Ubuntu 之前，请备份所有数据！如果这吓到了你，你可能想考虑现场安装。如果你还想在安全且远离易损坏硬件的地方保留另一份备份，请尝试诸如
    Jungle Disk 的云端程序。它的订阅费用较低，但这项服务是值得的，而且与 Linux 兼容性良好。


    `[www.ubuntu.com](http://www.ubuntu.com)`


    对于 CD/USB（现场）安装：


    如果你明智地选择了现场环境安装，一旦下载并从 CD 或 USB 重启，你只需按照系列提示操作。某些提示只是要求你提供简单信息，例如语言和偏好。某些提示将询问你之后想对系统做什么，或者谁可能具有访问系统的权限。其他提示包括一个关于分分区的问题（供高级用户使用）。如果“Secure
    Boot”（安全启动）不允许你在 Windows 上使用某些新版本启动 Linux，你可能需要禁用该设置。


    重启后，你会立即看到你的标签包含功能、应用程序、浏览器浏览器以及类似 MAC 或 Windows 的工具。主目录或我的电脑就是你的“C”盘。


    注意：如果你的电脑没有读取 CD 或 USB 并自动安装，请尝试按 `F12` 键进入菜单允许启动。


    ### 虚拟化


    任何发行版的另一个强大功能是虚拟桌面，它允许你在操作系统之间切换。虚拟桌面正是如此。它是虚拟环境中的用户界面，存储在远程服务器上而不是本地。虚拟操作系统运行在应用程序内部。这比双系统启动要简单且高效得多。


    你可以在 App 中获取这些程序。Linux 上流行的程序有 Microsoft Virtual PC、`VMWare`、`VMWare Workstation`
    或 `VirtualBox`。研究这些程序以探索这一选项。


    VirtualBox Manager Screenshot (www.lifehacker.com)


    ### 双启动选项


    所以你有选择安装 Linux 或使用现场环境。你也可以选择单独运行 Linux，完全删除你当前的操作系统并用 Linux 替它。你也可以选择它与你当前的系统（如
    Windows）并排运行。


    如果你选择后者，可以对系统进行分区以允许两者共存，并根据需要进行切换。能够排除 Windows 故障或恢复数据是拥有分区或现场 USB/光盘的另一个好处。有些人喜欢同时拥有两种类型系统的选项，而有些人则将专门保留其中一种。


    维护两者的一种方法是设置双启动配置，保留两个操作系统。Wubi 是一个可以自动安装的程序，它不会影响电脑的分区（划分区域）。如果你想探索这一点，请前往 Wubi
    网站 `www.wubi-installer.org` 访问该程序。


    如果你更精通技术，可以手动创建自己的双启动安装并创建分区。另一个需要注意的点是，如果你有 MAC OS，在共享空间时可能有其他需要考虑因素。系统可能需要特殊程序来帮助共存。可以安装
    `rEFInd` 程序，它将帮助你在启动时访问所需的操作系统。


    ### Ubuntu 桌面版的外观


    到目前，你已经选择了你喜欢的版本，并决定使用 Ubuntu 的桌面版。


