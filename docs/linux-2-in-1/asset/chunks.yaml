    Chapter 1 What Is Linux?


    To put it simply, Linux is an operating system. An operating system is simply
    the software in any piece of technology that helps manage every single hardware
    resource that’s associated with the product. So, if you have a smartphone and
    you boot it up, you have all those preloaded applications you may or may not use.
    Those apps are called software. That software is loaded into the operating system,
    and it’s the operating system that houses and manages the information inputted
    into that phone application.


    If we were speaking in metaphors, the wiring of your home is its “operating system.”
    It houses you and all the stuff you use, and it manages your electricity and water.
    The wiring of your home takes care of all those basic functions you rely on, and
    when you want your home upgraded, you must upgrade the wiring as well.


    An operating system works in much the same way.


    Now, an operating system has many different pieces: the bootloader is the software
    that takes care of the booting process of your piece of technology. When you turn
    your phone or laptop on, there is usually a screen that flashes on it with the
    logo of the piece of technology you own, and then it goes away before it loads
    your home or lock screen.


    That’s the forefront of the bootloader.


    Then you have the kernel, and this is the piece in the Linux operating system
    that’s called “Linux.” The kernel is the stabilizing core of the entire system,
    and it helps to manage the piece of technology’s memory, peripheral devices (e.g.,
    the keyboard, mouse, or plugged-in speakers for a computer), and the CPU (the
    “brains” of your technological device). At its core, this is what keeps your piece
    of technology breathing.


    It’s the heart of your device.


    The daemons are the next part, and these are basically all the background services
    that queue themselves up whenever you turn on your device. Things like the sound
    on your device, its printing capabilities, and any calendar events you might have
    programmed into it are all examples of daemons.


    Then you have the shell. When you are coding on a Linux system, the shell is the
    command process that allows the person typing in the commands to control the computer
    (and its operating system) by the lines of code you type into the text interface.
    With the modern updates of Linux, it’s no longer necessary to fiddle around with
    certain command lines, but if you have ever watched those television shows where
    a computer whiz is typing seemingly random pieces of text information into a black
    box on their computer screen at lightning speed, that’s what we’re talking about.
    Those individual “random pieces” are lines of code, and they control specific
    functions within the operating system itself.


    That’s what the shell consists of: those command lines of code and the “little
    black box” they are being typed into.


    An operating system also has a graphical server. This is a fancy way of saying
    “the process that helps pictures display on your screen.” If you ever hear someone
    talk about the “X server,” this is what they are talking about: the process that
    helps images pop up on the main screen of your device.


    Then you have the desktop environment, which is what people interact with. When
    you turn on your device, get past the bootloader screen, and log into your piece
    of technology, the “main screen” pops up. That’s the desktop environment.


    And finally, there are the applications. All those things you download from “app
    stores” or download from a website onto your desktop computer are all applications.
    They are what give your piece of technology different capabilities, from playing
    a game to recording the videos you watch. Each type of Linux desktop environment
    has its own unique and centralized application store where you can download certain
    things in order to customize your Linux experience.


    So, why use Linux? Why not use some other operating system to learn how to do
    this whole coding and DIY project thing? After all, Linux is one of the most different
    computing environments compared to anything else that’s popular on the market,
    and even for the most technologically-savvy person, there is always an element
    they have to learn from scratch.


    Well, for one thing, Linux is free. All those popular operating systems, such
    as iOS (for Apple products) and Windows (for Microsoft products), cost money to
    download onto a new piece of software. Then, as they put out new and fully upgraded
    software updates, sometimes those cost money, too! Linux is completely free: there
    is no “yearly clean-up” fee, and there is no fee to download and update new upgrades
    and desktop environment layouts. You’ll also not pay anything for server licensing
    (the monthly fee that’s sometimes charged to run licensed software on a computer,
    such as Microsoft Word).


    With the cost effectiveness of this operating system in mind, Linux is also incredibly
    secure. People boast of using this operating system for decades without ever running
    into issues with viruses, malware, or computer slowdowns as applications begin
    to upgrade. That’s how stable Linux is, and you won’t find that with any other
    operating system.


    Not only that, but the only server reboot you’ll ever experience is if the kernel
    is updated. Remember what we said the kernel was?


    It’s the heart of your technological device.


    This means no randomly shutting down your computer device to reboot and no having
    to restart your technological device in order to upgrade it. Ever.


    Linux is also distributed underneath something called an open source license.
    This means that the operating system can run programs for any purpose, can be
    studied under any type of microscope, can be altered and changed in any fashion
    so you can do what you wish, can be redistributed without payment to help out
    your neighbor, and can be distributed after being modified by you to anyone you
    wish.


    It truly is “by the people, for the people” with this operating system. It holds
    the philosophy of freedom and freedom of choice to its highest standard, and that’s
    the one reason so many people have come together and made Linux the single greatest
    technological ecosystem available.


    Remember when we mentioned earlier that Linux had multiple types of desktop environments?
    This means Linux has many different “distributions,” or different versions that
    tailor themselves in specific ways to fit the needs of the person using it. If
    you ever hear someone talk about a “distro,” they are talking about a certain
    distribution of Linux. These distributions can be either downloaded for free,
    put onto a USB thumb drive, or burned to a disk and installed on any laptop or
    desktop computer you wish.


    Without charge, every single time.'
