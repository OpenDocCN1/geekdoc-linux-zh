    We can use the `touch` command to modify the times for file access and modification.
    This isn’t something you would need to do unless you are testing a system with
    a reliance on these access and modification times. Basically, what happens here—and
    this is something you make good use of—is that, when you touch a file that doesn’t
    exist, it will be created for you.


    There are a lot of things that are not directly done in Linux but, if you learn
    how certain commands behave and learn how to be creative with them, you can achieve
    what you want. We talked about how the command line can give you a range of building
    blocks and that these can be used in any way that you want, but you can only be
    effective if you fully understand how they work, not just why.


    Right now, all we have is a blank file but soon, we will look at how we can put
