- fmt: "\n![00042.jpeg](Images/image00329.jpeg)System with Graphical desktop environment\
    \ can get CLI inside GUI with Terminal Emulator. Terminal allows you to open a\
    \ window and lets you interact with the shell. Depending on Graphical Desktop\
    \ environment installed on Linux distributions you have bunch of terminal emulator\
    \ available like `gnome-terminal`, `konsole`, `rxvt`, `xterm`, `LXterminal`, `guake`,\
    \ `terminator`, `tilde`, `yakuake` etc. `Gnome-terminal` is the default terminal\
    \ emulator for CentOS Linux with GNOME desktop environment. To start Gnome terminal,\
    \ press Activities and press terminal icon.\n\n## Command prompt\n\nAlthough you\
    \ can customize the prompt, but more often you will get either `#` or `$` at end\
    \ of prompt. Where `#` indicates the user is logged in as `root` (administrator)\
    \ user and `$` prompt as normal user. You can display additional information in\
    \ the prompt like username, current directory and server name even you can show\
    \ current date and time.\n\n## Structure of commands\n\nNormally if you run command\
    \ from the shell prompt will have the following format:\n\n`command –options <filename>`\n\
    \nExample \n\n`tail –f myfile`\n\nHowever, file name is not used in all commands.\
    \ in some commands only command or command and options are used \n\n`ls –la`\n\
    \n## Tips for the bash shell\n\nWhether you are on virtual terminal or using Terminal\
    \ emulator, command format is same. Following are some of the useful features\
    \ of bash shell you can use in day-to-day tasks\n\n### TAB completion\n\nTab completion\
    \ is one of the most useful feature of Bash shell. It has ability to guess the\
    \ command, directory or file name by pressing `TAB` after writing partial command,\
    \ directory or file name. Shell will automatically complete the word if only one\
    \ option is present otherwise it will offers all possible completions. For example,\
    \ suppose you want to change directory to abc you write `cd ab` and press `TAB`,\
    \ the system will complete the word automatically.\n\n### Bash History\n\nShell\
    \ saves the command you have given on shell in a file in your home directory.\
    \ You can check the last commands by giving `history` command.\n\n```bash\n$ history\n\
    ```\n\nIf you want to give last command again, you can press `UP` arrow key and\
    \ then press `ENTER` key. You can press `UP` arrow key repeatedly to scroll backward\
    \ in the history of commands.\n\n### Wildcards\n\nWildcards or wild characters\
    \ are symbols represents one or more characters in the shell command. Most common\
    \ wild card characters are \n\n* `*` Star\n* `?` Question mark\n* `[ ]` Square\
    \ baskets\n\nWhere \n\n### Star (*)\n\nRepresents zero or more characters \n\n\
    Example \n\n```bash\n$ ls b*\n```\nList all files starting with b\n\n### Question\
    \ mark (?)\n\nRepresents single character\n\nExample\n\n```bash\n$ ls ?at\n```\n\
    List all files whose first letter of file name can be any character like bat,\
    \ cat or hat \n\n### Square brackets\n\nRepresent a range of characters \n\nExample\n\
    \n```bash\nls b[1-5]\n```\nList all files starting with b and second character\
    \ should be numeric character starting from 1 to 5. It can b1, b2, b3, b4 and\
    \ b5\n\n### Check the current shell\n\n```bash\n# echo $SHELL\n```\n\n## 17. Archiving\
    \ and Compression \n\nArchiving is the process of collecting and storing a group\
    \ of files and directories into one file, `Tar`, `cpio`, `zip` and `ar` are example\
    \ of utilities which performs this action. Whereas compression is processes of\
    \ reducing the size of files using mathematical compression algorithm. It is quite\
    \ useful in sending large files over the internet. Example of compression utilities\
    \ are `gzip`, `bzip2`, `xz` etc.\n\n### GZIP\n\nWith `gzip` you can compress and\
    \ decompress individual file. When you give `gzip` command to compress any file,\
    \ the file will be replaced with extension `.gz` file keeping the same ownership\
    \ modes, access and modification times. In sort, you will not see original file\
    \ only compressed file will be there. \n\n### Syntax\n\n```bash\ngzip filename\n\
    ```\n\nExample\n\n```bash\ngzip sysctl.conf\n```\n\n### Decompress\n\nTo decompress\
    \ the compressed file use `gunzip` command. However this command will remove the\
    \ compressed file you will see only uncompressed file only. \n\n### Syntax\n\n\
    ```bash\ngunzip filename\n```\n\nExample\n\n```bash\ngunzip sysctl.conf.gz\n```\n\
    \n### BZIP2\n\n`bzip` compresses file using compression algorithm known as Burrows\
    \ Wheel block sorting. Like `gzip` it removes the original file and creates compressed\
    \ file with same name plus extension `.bz2`. Each compressed file has same modification\
    \ date, permission and if possible, with same ownership as corresponding original\
    \ file. \n\n### Syntax\n\n```bash\nbzip2 filename\n```\n\nExample\n\n```bash\n\
    bzip2 sysctl.conf\n```\n\n### Decompress\n\nTo decompress the file compressed\
    \ with `bzip2` command use `bunzip2`. By default, it will not overwrite if file\
    \ of same name exist unless you give `-f` option \n\n### Syntax\n\n```bash\nbunzip2\
    \ filename\n```\n\nExample\n\n```bash\nbunzip2 sysctl.conf.bz2\n```\n\n### XZ\n\
    \n`xz` is successor of the `lzma` utility, it will add. `.xz` extension to compressed\
    \ file automatically and remove original file. Like `bzip` and `gzip` it will\
    \ keep same modification date, permission and if possible with same ownership\
    \ as corresponding original file. \n\n### Syntax\n\n```bash\nxz filename\n```\n\
    \nExample\n\n```bash\nxz sysctl.conf\n```\n\n### Decompress\n\n### Syntax\n\n\
    ```bash\nunxz filename\n```\n\nExample\n\n```bash\nunxz sysctl.conf.xz\n```\n\n\
    ### ZIP\n\n`Zip` is archiving and compression utility. It creates files with `.zip`\
    \ extension. It is cross platform compression utility so you can compress and\
    \ decompress files from Linux to windows or vice versa. It will keep the original\
    \ files intact \n\n### Syntax\n\n```bash\nzip zipfile.zip file/files_to_compress\n\
    ```\n\nExample\n\n```bash\nzip abc.zip sysctl.conf signond.conf\n```\nyou can\
    \ use `zip` also with wild cards\n\n```bash\nzip abc.zip s*\n```\n\n### Zip files\
    \ recursively (include sub directories also)\n\n### Syntax\n\n```bash\nzip -r\
    \ zipfile.zip directory\n```\n\nExample\n\n```bash\nzip -r abc.zip directory\n\
    ```\n\n### Listing content of compressed file\n\n### Syntax\n\n```bash\nunzip\
    \ -l zipfile.zip\n```\n\nExample\n\n```bash\nunzip -l asp.zip\n```\n\n### Decompress\n\
    \nTo decompress the compressed file use `unzip` command\n\n### Syntax\n\n```bash\n\
    unzip filename\n```\n\n### ar\n\nRepresenting a range of characters \n\n is not\
    \ so known predecessor of rar which is still in use. It used for archiving only\n\
    \n### Syntax\n\n```bash\nar -cv archive.ar files\n```\n\nExample\n\n```bash\n\
    ar -cv archive.ar files\n```\n\n## 18. How To Create Basic Scripts\n\nAs we’ve\
    \ seen when you begin the command line interface, you generally explore it interactively.\
    \ That means that you enter one command at a time so that you see the results\
    \ of each one.\n\nAs we begin this section, you can first take a look at [this\
    \ gif](http://www.compciv.org/files/images/cli/cli-grep-murder.gif) which explores\
    \ a Shakespearean plays’ directory using the command line; it counts the number\n\
    \n### Your First Shell Script\n\nWe’ll begin with something simple. Create a junk\
    \ directory somewhere, like `/tmp/my-playground`. Your actual workspace doesn’t\
    \ have to be littered with test code. \n\nA shell script is simply a text file\
    \ that must make sense. To create one, we’ll use the `nano` text editor. \n\n\
    ### Nano?\n\n`nano` is a text editor. It comes preinstalled in nearly all Linux\
    \ distros. New users prefer it mainly because of its simplicity, which stands\
    \ out when compared to other command line text editors like `emacs` and `vi/vim`.\
    \ It basically contains many other useful features like line numbering, syntax\
    \ coloring and easy search (among others).\n\nType `nano hello.sh` and run\n"
