    such as Jungle Disk. It does have a low cost to subscribe but the service is worth
    it, and it plays well with Linux.


    [www.ubuntu.com](http://www.ubuntu.com)


    For the CD/USB (Live) install:


    If you wisely chose to do a live environment installation, once it has been downloaded
    and rebooted from the CD or USB you just follow the series of prompts. Some prompts
    are simple information from you such as language and preferences. Some prompts
    will ask questions about what you want to do with your system afterwards, or who
    may have access to the system. Other prompts include a question to partition (for
    advanced users). You may have to disable the “Secure Boot” setting if it will
    not allow you to boot Linux with some newer versions on Windows.


    Upon rebooting, you will immediately see that your tabs include functions, applications,
    an internet browser, and tools like MAC or Windows. Home or My computer is your
    “C” Drive.


    Note: If your computer doesn’t read the CD or USB and install automatically, try
    the F12 key for the menu to allow you to boot.


    Virtualization:


    Another great feature of any distro is the virtual desktop, which enables you
    to toggle between operating systems.  A virtualized desktop is exactly that. It
    is the user interface in a virtual environment, and it is stored on a remote server
    instead of locally. The virtual operating system runs within an application. This
    can be much easier and more efficient than dual booting.


    You can get these in an App. Some popular ones for Linux are Microsoft Virtual
    PC, VMWare, VMWare Workstation, or VirtualBox. Do some research on these to explore
    this option as well.


    VirtualBox Manager Screenshot (www.lifehacker.com)


    Dual Boot Option:


    So you have the choice to install Linux or to use the live environment. You also
    have the choice to run Linux by itself, wipe out your current operating system
    entirely and substitute it with Linux. You also could opt to run it side by side
    with your current system such as Windows.


    If you chose the latter, you can partition the system to allow for both, and toggle
    between them as needed. Being able to troubleshoot Windows or recover data is
    another benefit to having the partition, or to having the live USB or disc. Some
    people like the option of having both types of systems, and some will keep one
    or the other exclusively.


    One option to maintain both is to set up a dual boot configuration where you keep
    two operating systems. Wubi is a program that will automate installation, and
    won’t affect partitioning (sectioning off) of your computer. If you want to explore
    this, go to the Wubi website at: www.wubi-installer.org to access this program.


    If you are more tech savvy you can manually create your own dual boot install,
    create partitions. Another point to note is that if you have a MAC OS, there may
    be other things to consider when sharing the space. The system may need something
    special to help with the co-existence. The program “rEFInd” can be installed and
    will help you access the OS you want at start up.


    The Look of Ubuntu Desktop Version


    So, by now you have chosen a version you would like, and you are deciding to use
    the Desktop Version of Ubuntu.'
