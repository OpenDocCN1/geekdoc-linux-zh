    # 第 13 章编程 – 逻辑拆解


    在本章中，我们将讨论许多构成编程的基础概念。事实是，尽管有许多编写程序的方法以及属于其中的许多不同概念，但许多概念在每一个实现过程中都保持着相当灵活流动的状态。我的意思是，无论你如何编程，你将编写的所有程序中都有很多共同点。


    我坚信“概念性”：我认为如果你要学习某种东西，你首先需要从概念角度了解它是如何工作的，然后在以后将其联系到僵化的思维和结构中。我们也将连接所有这些概念！然而，现在，我们只需要把它们当作：概念本身来讨论。


    ## 程序及其运行方式


    所以我们首先讨论的是程序，它们是什么，以及它们在 Linux 中是如何运行的，因为这本书专门关于如何学习在 Linux 上进行编程。程序本身是一个相对简单的概念，它们也有许多不同的名称：这里的“程序”一词可以适用于从你为了自动化某些过程而编写的脚本，到像
    Word 或 Google Chrome 这样的桌面应用，再到像《侠盗猎手 5》这样的桌面视频游戏，以及介于两者之间的许多不同内容。


    程序可以在前台运行，这意味着它们就在你面前执行特定的功能；或者它们也可以作为后台进程运行，在你完全不知情的情况下持续运行。作为后台进程运行的程序示例可能是你计算机上不断运行的时钟应用程序。你可能永远不会去考虑它，但这是一个在后台不断运行的内核级程序，记录事件发生的时间。事实上，有大量的程序会以这种方式运行，用户在初始执行协议后既察觉不到它们，或者它们隐藏在非常深的后台，以至于用户必须调用它们才能使用。


    作为一名新程序员，特别是从事 Linux 编程，你将进行大部分编程工作将在控制台中完成。这对于你作为 Linux 用户和程序员来说尤为重要。为什么呢？因为
    Linux 的很大魅力来自于它提供的极其有用且深入的命令行工具。


    控制台（Console）、命令行（command line）和终端（terminal）指的是同一种东西；在 Unix 类系统中，最常用的术语是终端（Terminal）。这一切本质上都指的是相同的内容：人们如何通过文本手动输入命令并执行程序，而不是通过更“现代”的程序执行方法。本质上，命令行提供了用户与计算机之间最纯粹的通信；Unix
    系统被广泛复制和模拟的原因之一，是因为它们提供了用户与计算机之间历史上最好的接口方法之一。这在今天以 Unix 为模型的 Linux 系统中仍然适用。


    请注意，并非所有的 Linux 发行版都是平等的；某些将依赖终端。然而，许多发行版确实通过终端提供了极高的可能性，即使它们的主要目的是推向用户远离这种低级界面。例如，虽然
    Elementary OS（一种基于极其简单优雅的用户体验的高级操作系统）对命令线的重视远不如 Arch Linux（一种高度可定制并高强度使用命令行的 Linux
    发行版），但它们都提供了只有通过命令行及相关工具使用才能访问的丰富功能。


    正如我所说的，作为一名 Linux 程序员，你早期将编写的大多数程序至少会通过命令行打印输出。然而，极有可能，这些程序也会从命令行进行编译和执行，这仅仅是因为这是处理该任务的“正确”方式，这将让你对你的工具——计算机变得最熟悉。


    ## 是什么构成了程序？


    当我在这里说“制作”（make）时，我字面意思就是制作：人们如何与计算机通信，然后创建出计算机可以理解的东西？


    嗯，首先，它们被称为“编程语言”是有原因的。想象一下：你精通英语和法语。如果你在街上遇到一个母语是西班牙语的人，你将无法真正与他们交流。但是，如果他们说西班牙语和法语，那么在笨手笨脚交谈一番后，你们都可以用法语进行交流，尽管你们的母语不同。


    这对于程序是什么以及它们如何工作，可能是最好的类比。计算机原生以非常简单且数学化的方式理解事物；它们解析 1 和 0 的序列以执行极其复杂的数学函数，并最终只是对数学值进行操作。另一方面，人类虽然会说数学，但通常不愿意花费大量的时间，用
    1 和 0 的序列独立地编写计算机的每一个细节。如果每个程序员都这样做，即使是一个简单的程序，编写也需要数年时间。

