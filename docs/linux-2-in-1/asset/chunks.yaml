    partitions or logical drives. In our case the logical partitions /dev/sda5, /dev/sda6,
    /dev/sda7 and /dev/sda8 are stored on the primary partition /dev/sda4. The partitions
    /dev/sda2 and /dev/sda3 are not in use. 


    From the above list, choose the entry Finish partitioning and write changes to
    disk. Click the Continue button on the lower-right corner to proceed and to confirm
    the partition scheme (see below image). Choose yes from the list and click the
    Continue button to partition the disk. Note that all the data on the selected
    storage device will be lost and the disk will be empty. 


    Having divided the storage media into single partitions, the partitions will be
    formatted with the file system as defined before. In our case the partitions /dev/sda1,
    /dev/sda5, /dev/sda7 and /dev/sda8 will get an ext4 file system, and the partition
    /dev/sda6 will get a swap filesystem. As soon as this step is completed, the base
    system of Debian will be installed next. 


    Package Management 


    The ISO image contains the installer and several packages to set up the Linux
    base system. For example, this includes the Linux kernel being installed below. '
  toc: []
  trans: '

    完成后，按下 `Continue` 键进入步骤六，添加诸如 `yourcompany.com` 的域名（见下图）。在当前情况下，不需要这样做。这就是为什么我们让输入框为空。点击右下角的
    `Continue` 按钮继续安装。


    # 用户与角色


    我们的 Linux 系统至少需要两个用户才能进行适当的操作。其中一个是固定名称为 `root` 的管理用户，另一个是普通用户，在本文例中我们将其命名为 `User`。


    在接下来的两个步骤中，你将为 `root` 用户设置密码（见下图），并为普通用户设置全名用户名。为了简单起见，我们使用 `Debian User` 作为全名，使用
    `User` 作为用户名。对于这两个用户，请选择不同的且你记得的密码。稍后你将需要这些密码来登录计算机。


    # 时区


    设置正确的时区对于与其他服务的通信至关重要，尤其在网络环境中。请从下图中列表中选择值。列表中的项目是基于你之前选择的位置。完成后，点击 `Continue`
    按钮定义存储介质及相应的分区。


    # 存储介质与分区


    Linux 系统可以分布在多个不同的存储介质上，如硬盘和闪存驱动。此外，一个存储介质可以分为多个磁盘分区。为了实现这一点，Debian 的安装程序提供了以下方法（见下图）：


    - **Guided - use entire disk**：按照提供的步骤操作，使用整个磁盘空间进行 Linux 安装。这将创建固定大小的分区。

    - **Guided - use the entire disk and set-up LVM**：按照提供的步骤操作，使用整个磁盘空间进行 Linux 安装。此选项利用逻辑卷管理（LVM）创建以后可以更改大小的分区。

    - **Guided - use the entire disk and set-up encrypted LVM**：按照提供的步骤操作，使用整个磁盘空间进行
    Linux 安装。此选项利用逻辑卷管理（LVM）创建以后可以更改大小的加密分区。

    - **Manual**：单独创建分区。这是专家模式，需要对分区和文件系统参数有更深入的知识。


    从列表中选择 `Guided-use the entire disk` 项。分区大小的值根据经验并以算法的形式实现。不需要手动计算。点击右下角的 `Continue`
    按钮继续安装。


    接下来，选择要分区的磁盘。在我们的情况下，只有一个可用磁盘（见下图）。在本文指南后续，第一块 SCSI 磁盘将被称为 `/dev/sda`。


    磁盘分区是指存储介质上被单独组织的部分，旨在包含 Linux 文件系统树的分支。没有通用的方法来正确进行这种分离。本指南展示了一个简单但安全的解决方案，适用于基础系统。对话框中的菜单提供以下选项：


    - **All files in one partition**：仅使用单个分区保留程序和用户数据

    - **Separate /home partition**：在不同的分区中存储程序和用户数据

    - **Separate /home, /var, and /tmp partitions**：在不同的分区中保留用户数据、变量数据临时数据


    点击右下角的 `Continue` 按钮继续安装。


    下一步是确认分区方案。这是根据经验自动计算的，包含以下分区：


    - `sda1`：第一块 SCSI 磁盘的第一个分区是主分区，大小为 3 GB，使用 `ext4` 文件系统格式化，称为文件系统树根（用 `/` 表示）

    - `sda5`：第一块 SCSI 磁盘的第五个分区是大小为 1.3 GB 的逻辑分区，使用 `ext4` 文件系统格式化，预留用于存储文件系统树的变量数据（用
    `/var` 表示）

    - `sda6`：第一块 SCSI 磁盘的第六个分区是大小为 3.3 GB 的逻辑分区，格式化为交换分区系统

    - `sda7`：第一块 SCSI 磁盘的第七个分区是大小为 311 MB 的逻辑分区，使用 `ext4` 文件系统格式化，预留用于存储文件系统树的临时数据（用
    `/tmp` 表示）

    - `sda8`：第一块 SCSI 磁盘的第八个分区是大小为 8.8 GB 的逻辑分区，使用 `ext4` 文件系统格式化，预留用于存储文件系统树的用户数据即家目录（用
    `/home` 表示）


    由于历史原因，硬盘只能包含四个主分区。如果划分为所谓的逻辑分区或逻辑驱动器，第四个分区被称为扩展分区（Extended Partition）。在我们的情况下，逻辑分区
    `/dev/sda5`、`/dev/sda6`、`/dev/sda7` 和 `/dev/sda8` 存储在主分区 `/dev/sda4` 上。分区 `/dev/sda2`
    和 `/dev/sda3` 未未使用。


    从上述列表中，选择 `Finish partitioning and write changes to disk` 项。点击右下角的 `Continue`
    按钮继续并确认分区方案（见下图）。从列表中选择 `yes` 并点击 `Continue` 按钮对磁盘进行分区。注意，所选存储设备上的所有数据将丢失，磁盘将为空。


    将存储介质划分为单分区后，分区将按照之前定义的文件系统进行格式化。在我们的情况下，分区 `/dev/sda1`、`/dev/sda5`、`/dev/sda7`
    和 `/dev/sda8` 将获得 `ext4` 文件系统，分区 `/dev/sda6` 将获得交换分区。一旦完成此步骤，将安装 Debian 基础系统。


    # 包管理


    ISO 镜像包含了安装程序和用于设置 Linux 基础系统的包。例如，这包括下方将安装的 Linux 内核。

    '
- fmt: '

    The next step is that you must decide whether to use additional installation media
    or not. In our case, we have just a single installation disk and can consequentially
    select `No` from the menu (see image below). Then click the `Continue` button
    to proceed. As pointed out earlier, the software for Debian is organized in packages.
    These packages are provided in multiple software repositories. The repositories
    are made available via package mirrors that are maintained by universities, private
    persons, companies and other organizations. These mirrors are in different countries.


    In the next step, you will have to decide from which country you would like to
    retrieve your Debian packages. It is recommended to choose a mirror that is geographically
    located near you to minimize the time that is needed to transport the data from
    the mirror to your computer via a network. As an initial step, choose your desired
    country. As a second step choose a preferred mirror from the list (see image below).
    The list contains universities, internet providers, government services and other
    organizations. In case your computer network includes a proxy server to communicate
    with the outside world, enter the according to information here. In such an instance,
    we do not have that and leave the entry field empty. Click the `Confirm` button
    to proceed. As soon as the single parameters are set, the Debian installer connects
    to the previously selected package mirror and retrieves the package lists from
    there. A package list contains the packages that are available, including the
    name, size, and description. Depending on the quality and bandwidth of your network
    connection this step can take a while. Next, you are asked to take part in `Popcon`,
    the Debian package popularity contest (see image below). This information is optional
    and is used only by the team of developers that is responsible for the Debian
    packages. Based on `Popcon`, they figure out which Debian packages are the ones
    that are installed most often. The information has a direct influence on the preparation
    of installation images and which packages to keep or to dismiss for the different
    architectures.


    In our case, we do not participate in Popcon, and leave the selection to `No`.
    Click the `Confirm` button to proceed with the selection of software tasks (`tasksel`).


    ## Software Selection


    Debian offers carefully arranged selections of packages, so-called tasks. The
    idea behind them is to group packages for specific uses in order to simplify the
    installation. From the list in the dialog window (see image below) you can choose
    between different desktop environments, as well as a web server, a print server,
    an SSH server and the standard system utilities. To have a minimal installation
    just enable the last two entries from the list. We will install the XFCE desktop
    environment later.


    Having confirmed the software selection, the Debian installer retrieves the needed
    packages from the package mirror, unpacks and then installs them. The bar below
    shows the progress. In this case, 140 packages must be downloaded.


    ## Setting up GRUB


    In order to start our newly installed Debian system, we must set this information
    too. This process is called booting the system. The software component that handles
    this step is named `Grand Unified Boot Loader` (`GRUB` or `GNU GRUB` to be precise).
    The entry `Yes` is already pre-selected, and so we can click `Continue` to proceed.
    The Debian installer needs to know where to install `GRUB`. The menu in the image
    below lists the storage media to be considered. In our case, we choose the second
    entry from the list (`/dev/sda`). Then, click `Continue` to proceed. Now that
    we are nearly finished with the basic installation, the only thing left to do
    is just a single dialog box to read.


    ## Finishing the Installation


    The following dialog box informs you that the installation is complete. Then click
    `Continue` to reboot the newly installed system.


    After a few seconds, the text-based `GRUB` boot menu will appear on the screen.
    The boot menu includes two options: `Debian GNU/Linux` and `Advanced options for
    Debian GNU/Linux`. The first menu item is highlighted and pre-selected. The second
    menu entry allows you to set specific boot options. For a comprehensive list of
    these options have a look at the GNU GRUB manual at `www.gnu.org/software/grub/manual/grub`


    Keep the first menu item selected and press `Enter` to proceed and boot the new
    system. Your Debian system will start and initialize the necessary system services.
    This step will take a few seconds to be completed. Finally, a black-and-white
    screen will be visible on the first text terminal named `tty1` (see image below)
    and ask you to log into the system. The login prompt consists of two components:
    the hostname of your Linux system (`debian95`) followed by space and the word
    `login`.


    ```

    Debian GNU/Linux 9 debian95 tty1

    debian95 login: _

    ```


    Having logged into the system, you will add further software to be able to use
    a graphical user interface, based on the XFCE desktop. At this step of the installation
    process, adding further software can only be done by logging in as the administrative
    root user.


    In order to do so, type `root` at the login prompt, press `Enter`, wait for the
    text `Password:` to appear and type in the password set for the root user you
    defined before. The Linux system will welcome you (see image below) with a login
    message. The first line of the login message will give you a display on the time
    of your last login followed by the version of the Linux kernel that is currently
    running (line two) and the usage advice (lines five to eight).


    After the welcome message Debian opens a command-line prompt:


    ```

    root@debian95 ~#

    ```


    This command-line prompt consists of four components:


    - `root`: the name of the user who logged in

    - `debian95`: the hostname of the Linux system

    - `~`: the current directory. In this case, it is the home directory of the user
    currently logged in. If not otherwise set, this is defined as `/home/username`
    for regular users and `/root` for the administrative user. `~` is just an abbreviation
    of it.

    - `#`: the login symbols. The `#` symbol represents the user `root` whereas `$`
    is used by regular users without administrative rights


    **Important**: You are now logged in as the administrative root user. Take care
    which commands you type in and check twice if in doubt. Any mistakes can lead
    to the necessity to install or repair your Linux system.


    ## Adding a Graphical User Interface


    At its current stage, the Debian system is fully active and can be used in production.
    For a desktop system suitable for a regular user, it still lacks an excellent
    and easy-to-use graphical user interface. In this step, we will change that and
    install the XFCE desktop manager.


    In order to do so, we will install the following packages:


    - The `aptitude` package manager

    - The `xdm` display manager

    - The `xfce4` desktop environment


    Debian uses the package manager `apt` to handle the installation, the update and
    the removal of software packages and the related package lists. Also, `apt` resolve
    all the package dependencies and ensures that the relevant software is available
    on the system. In our case, a total of roughly 450 MB of data/software must be
    retrieved from the package mirror and installed. As pointed out earlier, this
    requires a working internet connection to download the needed software packages.


    In order to install the three packages, type in the following commands at the
    command-line prompt. Just type the command after the `#` symbol:


    ```

    root@debian95 ~# apt-get install aptitude xdm xfce4

    ```


    `apt` will display further information regarding the packages to be installed.
    This includes the list of depending packages and recommended packages. In the
    end, you will see a command-line prompt. Type `Y` or press `Enter` to install
    `aptitude`, `xdm` and `xfce4` as well as the depending packages. For the `xdm`
    display manager, two dialog boxes must be confirmed (see images below). Press
    `Enter` two times to confirm the use of `xdm`.

    '
