    # 第 9 章 布尔运算符


    现在，如果你只想在满足多个条件时才执行某些事，该怎么办？确实，在某些情况下，你可能希望在满足一个或多个条件时执行操作。这就是布尔运算符的场（为了适应这些情况）。


    它们包括：


    *   `And` (`&&`)

    *   `Or` (`||`)


