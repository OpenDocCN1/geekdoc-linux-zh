    These distributions have been created with considerations to software packaging,
    installation process as well as the updating process. This is what makes each
    of them different from the other, and this forms the basis that users use in order
    to choose a distribution to go for.


    Linux has a distribution for the beginners as well as the experts in computer
    use. These distributions have been created in order to ensure that the needs of
    all users have been met well and that they are having no issues as they use their
    computers. Distributions for the newbies are much easy to learn, understand and
    use; and those for computer experts are much complicated and can be challenging
    for a user with few computer skills.


    These distributions are the different Linux versions that have already been created.
    They are also called `Distros` in short form. Close to all these distributions
    can be downloaded for free, burnt to a CD or copied to a USB flash drive and installed
    to as many computers as the user wants.


    ## Popular Linux Distributions


    The most popular Linux distributions are as follows:


    * Linux Mint

    * Ubuntu Linux

    * Deepin

    * Fedora

    * Arch Linux

    * OpenSUSE

    * Debian


    `Ubuntu Linux` is the most modern user interface and it is the most preferred
    among the above distributions. There are people who prefer a much older version
    though like the `openSUSE`. Each of these distributions has its own kind of take
    on the desktops and other computers. Therefore, you must understand them all in
    order to make a perfect choice.


    There are over 100 such distributions today. So for a wise choice, you have to
    study them all in detail, bearing in mind what you need for your computer.


    For desktops and laptops, go for `Ubuntu`, `Mint`, `Fedora`, `Debian` or `openSUSE`.
    This will depend on your expertise level. `openSUSE` is perfect for laptops of
    all kinds. The tool that comes with this distribution allows for wi-fi connectivity
    and other capabilities that are fit for laptop users, like a simplified dockingstation.
    There is no other distribution that can compete with `openSUSE` on the laptops.


    The servers here are for instance:


    * Ubuntu server

    * Red Hat Enterprise Linux

    * CentOS

    * SUSE Enterprise Linux


    Some of the server distributions are free; for instance, `centOS` and `Ubuntu
    server` and some of them have a price they are associatedwith like the `Red Hat
    Enterprise Linux` and `SUSE Enterprise Linux`. Those with a price includes support,
    and the cost is quite low. Therefore, you will not strain financially to acquire
    it if you want a distribution with a price on it.


    ### Most Widely Used Distributions


    `Ubuntu Linux` is the most widely used distribution of Linux. Most of the users
    that have been using Windows operating system are choosing `Ubuntu` now. The reasons
    could be:


    a) Because learning it is very easy when compared to other Linux distributions.

    b) It has the widest range of applications for you to choose from. This means
    that you can do anything on your machine with the right apps in place.

    c) Its application center is well developed, making it easy for the user to search
    through the applications that he wants to install.


    `Linux Mint` has also been growing in popularity over the years. Many people believe
    that its popularity is close to threatening the dominance that `Ubuntu` has had
    for so many years. `Linux` was developed out of user suggestions to make `Ubuntu`
    better, and this means that users have a better experience with it.


    ## Determining the Right Distribution


    The most important thing at this level is to choose the right kind of distribution
    to go for. This is not a big deal at all if you know what you need. This should
    guide you:


    a) What kind of computer user are you? Are you well skilled or a beginner? Choose
    a Linux distribution that matches the level of computer skills you have so that
    you will benefit from it. You also need a distribution that you can learn faster
    and use better all the time.

    b) Would you prefer a standard or modern desktop interface? This varies from one
    person to another. There are a good number of people who prefer the modern desktop
    interface, and there are also a good number of computer users who go for the standard
    desktop interface. It is good to take time and learn about them both, the pros
    and cons so that you will choose a better interface for your needs.

    c) Do you want a server or desktop distribution? This depends on whether you want
    to be the system administrator, or the system is only for your computer.


    If your computer skills are just basic, it is good to stick to a beginner-friendly
    distribution like `Ubuntu Linux` and `Linux Mint` or `Deepin`. Computer users
    with above average skills could choose distributions like `Fedora` or `Debian`.
    Computer gurus who have mastered the skills of computer use and system administration
    can choose a distribution like `Gentoo`. This is a muchadvanced kind of Linux
    distribution.


    Users that are looking for server-only distribution will have to choose between
    desktop interfaces or to decide whether they want to have it through a command-line
    only.


    System administrators can choose a distribution as per the kind of features they
    want to go for. If you are looking for a server kind of distribution that will
    offer you everything that you need from a server and out of box features, go for
    `centOS`. If you are looking for a desktop distribution that will allow you to
    add features as you need them, you can go for `Ubuntu Linux` or `Debian` distributions.


    New users could make work much easier if they compared distributions that are
    fit for use by newbies only. This way, you will save time in making the right
    choice and make the best choice in the end.


    ## Basic Shell Configuration and Customization


    There are several hidden configuration files in your user directory that allow
    you to configure your shell. Since we are only looking at the `BASH` shell, we
    shall explore the configuration files that are used to control the `BASH` shell
    environment. Other shells will have their own configuration files that will work
    in a similar way but use a potentially different syntax.


    Since this is just an introduction to the shell we shall not delve too deeply
    into these files, but more take this opportunity to make you aware of their existence
    and the potential customization that can be performed. These files and their customization
    would be beneficial for you to explore further on your own.


    Remember that we can view the hidden files in your home directory, and in this
    case we shall request a long listing format to obtain maximum detail, by using
    the following command whether we are in our home directory or not


    ```

    $ ls –al ~

    ```


    Not all systems will have every file present by default, but if we require them
    we can just add them.


    Since we are talking here about the editing, or modification, of files that are
    system configuration files, it is worth mentioning that it is always a good idea
    to create a safety copy of the file you are manipulating. This then allows you
    to go back to the original if the amended file does not work for some reason,
    or alternatively to use the `diff` command to look at the differences between
    a working copy and a non-working copy of the file.


    As we have seen, environment variables are used to set up default values for properties
    and to control the way in which the shell functions. One of the most important
    roles that these startup scripts take care of is the initialization of environment
    variables, since this means that we do not need to set them up every time that
    we use the shell and that they persist..


    ### Setting Environmental Variables at Login


    It is important to understand the distinction between different ways of starting
    the shell session. There are Login, Non-Login, Interactive, and Non-Interactive
    Shell Sessions and the `bash` shell reads and processes different configuration
    files depending on how the session is started.

