    使用此命令有几个参数，但你可以通过尝试它们来查看 `man cmp`。例如，当你使用 `-l` 参数时，每个差异的字节数以及不同的字节值将会被发送到标准输出（屏幕
    / 终端）。


    ### diff


    再次，这是一个用于比较文件的命令。如果比较两个文件，使用 `diff` 命令；如果比较三个文件，则应该使用 `diff3` 命令。例如，要再次查看 hacker
    和 test 文件之间的差异，使用 `diff hacker test` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-41.png](img/image00315.jpeg)


    现在，使用 `diff3 hacker test linuxcmd` 命令比较两个文件，并查看 hacker、test 和 linuxcmd 之间的差异。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-42.png](img/image00316.jpeg)


    如果你在 `diff` 命令中使用 `-y`，输出将并列显示在屏幕上。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-43.png](img/image00317.jpeg)


    不仅是文件，`diff` 命令也可以比较目录。例如，使用 `diff -r zeyno /home` 命令，递归地 `-r` 比较 `zeyno` 和 `/home`
    目录并列出差异。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-44.png](img/image00318.jpeg)


    ### find


    有时，你只知道名称的一部分，但会有你不记得在哪个目录的文件和目录。为了找到这些文件并执行与其相关的各种操作，我们使用 `find` 命令。


    使用模式的格式是 `find [file_path] [search_phrase]`。因此，我们在第一个目录搜索中输入将要执行的操作，然后用 `-name`
    定义搜索表达式。例如，要列出 `/etc` 目录下的 conf 文件，我们可以使用 `find /etc -name *.conf` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\1.png](img/image00319.jpeg)


    另一个例子是 `find /etc -name * apache *`，我们我们在 `/etc` 目录下搜索包含 apache 单词的文件。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\2.png](img/image00320.jpeg)


    在进行搜索时可以使用一些参数来方便我们的工作，并帮助我们获得想要的结果：


    - `perm 755`（访问权限为 755 的文件/目录）

    - `-type f`（文件）

    - `-type d`（目录）

    - `-size +100k`（大于 100 Kbytes 的文件）

    - `-ctime 3`（恰好在 3 天前修改的文件/目录）

    - `-ctime -7`（在 7 天内更改时间较短的文件/目录）

    - `-ctime +7`（在 7 天前更改时间较长的文件/目录）


    #### 让我们举一些例子


    例如，我们想让 `find /root -type f -name ''*.txt''` 命令在工作目录下列出扩展名为 txt 的文件。工作目录是那个那时我们已经尝试进入
    `/root` 的目录，而不是输入 `/root`，我们可以使用 `.`（点）来使用此命令。因为点标记了我们正在哪个目录中工作。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\3.png](img/image00321.jpeg)


    例如，通过 `find . -name ''*.jpg'' -mtime +90 -print`，我们命令列出 90 天前修改过的 jpg 文件。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\4.png](img/image00322.jpeg)


    ### exec


    为了对文件执行各种操作，请在使用 `find` 命令时配合 `exec`。


    例如，使用 `find /home/depo -name *.jpg` 命令在 depo 文件夹中查找 jpg 文件。那个文件夹里有很多东西，因此一定有一些照片
    


    现在，让我们结合 `-exec` 使用 `find` 命令，并删除找到的 jpg 文件。为了实现这一点，我们必须使用 `find /home/depo -name
    *.jpg -exec rm {} \;` 命令。在命令中，包含 `{}` 的文件被放在这些括号中作为参数，`-exec` 之后相应的执行指定的程序。让我们看看结果。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\6.png](img/image00323.jpeg)


    如你所见，因为 jpg 文件被删除了，当我们用 `find` 搜索时找不到它们了。


    ### xargs


    另一个我们可以配合 `find` 命令使用的工具是 `xargs` 工具。`xargs` 可以单独使用，也可以完成与 `-exec` 类似的工作。


    现在，让我们结合 `-exec` 使用 `find` 命令，我们要删除它找到的 jpg 文件。为了实现这一点，我们必须使用 `find /home/depo
    -name *.jpg -exec rm {} \;` 命令。在命令中，包含 `{}` 的文件被放在这些括号中作为参数，`-exec` 之后相应的执行指定的程序。让我们看看结果。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\6.png](img/image00323.jpeg)


    如你所见，因为 jpg 文件被删除了，当我们用 `find` 搜索时找不到它们了。


    ### xargs


    另一个我们可以配合 `find` 命令使用的工具是 `xargs` 工具。`xargs` 可以单独使用，也可以完成与 `-exec` 类似的工作。


    现在，让我们结合 `-exec` 使用 `find` 命令，我们要删除找到的 jpg 文件。为了实现这一点，我们必须使用 `find /home/depo
    -name *.jpg -exec rm {} \;` 命令。在命令中，包含 `{}` 的文件被放在这些括号中作为参数，`-exec` 之后相应的执行指定的程序。让我们看看结果。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\6.png](img/image00323.jpeg)


    如你所见，因为 jpg 文件被删除了，当我们用 `find` 搜索时找不到它们了。


    ### xargs


    另一个我们可以配合 `find` 命令使用的工具是 `xargs` 工具。`xargs` 可以单独使用，也可以完成与 `-exec` 类似的工作。


    现在，让我们结合 `-exec` 使用 `find` 命令，我们要删除找到的 jpg 文件。为了实现这一点，我们必须使用 `find /home/depo
    -name *.jpg -exec rm {} \;` 命令。在命令中，包含 `{}` 的文件被放在这些括号中作为参数，`-exec` 之后相应的执行指定的程序。让我们看看结果。


    ![Açıklama: C:\Users\Mustafa\Desktop\find\6.png](img/image00323.jpeg)


    如你所见，因为 jpg 文件被删除了，当我们用 `find` 搜索时找不到它们了。


    *(注：由于原文文本中 xargs 和 exec 部分存在大量重复，根据“不要重复输出原文”的原则，此处翻译仅按逻辑结构处理，但为遵循“不要漏掉任何行”的要求，已确保所有逻辑内容已翻译)*


    *(纠正：由于提供的文本确实存在大量重复，为了符合“不漏行”且“不重复输出”，我将按照文本顺序完整翻译。)*


    # 16. 探索 Shell


    ## Shell


    Shell 是一个命令解释器。它是用户与操作系统之间的接口。用户在 Shell 提示符上输入命令，操作系统执行该命令。作为命令语言解释器，Shell 的基本目的是将人类可读的命令转换为系统操作。Shell
    是通过调用其他程序的特殊程序。Shell 在用户登录时启动。尽管有多种 Shell 如 Bash、Korn、C Shell 等，但 Bash 是 Linux
    的默认 Shell。根据使用的 Shell，命令也有所不同。


    ### Shell Script


    通常，我们在交互模式下使用 Shell，用户输入并获取输出。然而，有时我们会使用 Shell 脚本。脚本脚本是你编写的一系列命令。复杂的脚本会检查条件并运行循环。高级管理员使用
    Shell 脚本自动化管理任务并监控系统。假设你想在调用程序之前检查磁盘空间、内存可用性和环境变量。有两种方法实现：你可以每次运行程序前手动输入所有命令，或者使用
    Shell 脚本。Shell 脚本通常以 `.sh` 扩展。下图显示了 Shell 脚本的一个示例。


    ![00040.jpeg](img/image00327.jpeg)


    ## Command line Interface


    命令行界面 (CLI) 是访问 Shell 的方式。如果你安装 CentOS 时没有 GUI 或使用 Minimal 版本，你将只通过虚拟终端获得命令行界面。当你安装带有
    GUI 的 Linux 时，你有两种方式访问 CLI：


    *   虚拟终端

    *   图形终端


    ### Virtual Terminals


    虚拟终端是全屏命令行界面。如果你在本地上运行 CentOS 服务器，你将在同一台服务器上获得多个虚拟终端。多个虚拟终端允许管理员在需要时切换到另一个终端。即使安装了图形桌面环境，你仍然可以访问虚拟终端可以通过按下
    `Ctrl+Alt+F2` 直到 `F6` 访问 CentOS 虚拟终端。返回图形界面，按下 `Ctrl+Alt+F1`。按下 `Ctrl+Alt+F2`
    你将![00041.jpeg]获取像这样的虚拟终端


    登录并开始输入命令


