    - `cat > test-2` (请注意，我们只使用了一次 `>`) 我们向文件中添加了新内容。

    - `cat test-2` 当我们再次检查文件内容时，我们发现旧内容已被删除，我们输入的内容被最终写入了。


    我们学习到可以使用 `cat` 命令读取文件内容。如果我们在使用 `cat` 命令时带有 `-A` 参数，文本中的制表符将以 `^|` 显示，行尾将以 `$`
    显示。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-6.png](img/image00278.jpeg)


    在想要查看内容的文本文件中将小写字母转换为大写字母，或者反之，我们可以结合使用 `cat` 和 `tr` 命令。例如，要将 test 文件中的小写字母转换为大写字母，可以使用
    `cat test | tr ''a-z'' ''A-Z''`。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-7.png](img/image00279.jpeg)


    ### 管道 (Piping)


    在这里，我想简要介绍我们以后再次使用的 `|` 符号和管道（pipe）。如上面的示例所示，通过管道操作，一个命令的输出作为另一个命令的输入。当我们查看示例时，读取
    test 文件的内容被作为输入传递给 `tr` 命令，而 `tr` 命令根据文件内容中所使用的参数进行转换。管道过程是通过 `"|"` 实现的。是的，让我们再次回到示例中。


    我们讨论过可以使用 `cat` 命令在终端读取文本文件的内容。现在，例如，让我们用 `cat /etc/passwd` 命令查看 `passwd` 文件的内容。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-8.png](img/image00280.jpeg)


    文件内容原样显示。如果我们想带行号查看内容，必须使用 `cat -n /etc/passwd` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-8-1.png](img/image00281.jpeg)


    ### echo


    通常情况下，使用此命令，任何所需的语句将作为输出发送到终端屏幕。此外，它还可以用于创建文件并向其中写入任何字符串。现在让我们创建一个新文件和表达式，并让你们使用
    `echo` 命令将其写入文件。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-9.png](img/image00282.jpeg)


    如你所看到的，通过 `echo "master of the linux" > linuxcmd` 命令，我们创建了之前不存在的 `linuxcmd` 文件并写入了
    "master of linux"。之前存在的空文件也可以这种方式写入。但如果文件不是空的，我们就可以像之前在 `cat` 命令中那样使用 `>>` 操作符了。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-10.png](img/image00283.jpeg)


    我提到过使用操作符命令输出重定向可以到一个文件。顺便，我们也来一个小例子。例如，将 `ls -l` 命令的输出重定向到我们创建的文件列表中。这意味着命令输出的内容被写入我们命名为
    `list` 的文件中。要做到这一点，只需使用 `ls -l > list` 命令即可。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-11.png](img/image00284.jpeg)


    现在举例说明如何以另一种方式使用 `echo` 命令并获取附加信息。首先，让我们用 `ls` 命令查看我们所在目录的内容，然后使用 `echo *` 命令，检查两个命令的输出是否相同。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-12.png](img/image00285.jpeg)


    如你所见，两个命令的输出是相同的。原因是在启动 `echo` 命令 shell 之前，带有 `*` 字符的 `/zeyno` 目录下所有的文件索引名都会进入命令行并作为每一个参数传递给
    `echo`。这意味着 `echo *` 命令屏幕上本应该出现星号（`*`），但并没有出现。所以这意味着星号字符没有作为参数发送给 `echo`。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-13.png](img/image00286.jpeg)


    在稍作提醒之后，让我们继续其他示例。要打印当前目录下以大写字母 t 开头的文件名，可以使用 `echo t*` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-14.png](img/image00287.jpeg)


    如果你想列出文件名以字母 d 结尾的文件，这次可以使用 `echo *d` 命令。


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-15.png](img/image00288.jpeg)


