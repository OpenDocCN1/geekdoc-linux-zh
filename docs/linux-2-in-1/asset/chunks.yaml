  trans: '


    在如今的世界上，软件可能非常复杂。这种复杂性部分源于程序被拆分为单个组件，并以单个包的形式提供，例如二进制数据、共享库和文档。这种软件开发概念被称为“模块化”，并被广泛接受和使用。例如，Debian
    提供了超过 60,000 个不同的软件包。


    包管理涵盖了处理这些软件包所需的所有操作，包括安装、配置、删除和更新软件包。它还涵盖了解决软件包依赖（相互依赖包）。


    ## 9.1 理解包架构


    为了解释 Linux 包架构，我们将使用 Debian 进行说明。Debian 发行版以其稳定性和卓越的软件包系统闻名。以下描述适用于所有基于 Debian
    的 Linux 发行版，例如 Ubuntu、Linux Mint、Knoppix、Kali Linux、Grml 和 Xandros。请记住，软件包名称可能不同，发行特定的包镜像以及软件包类的名称也可能不同。


    Debian 包管理生态系统包含多个不同的组件，如软件包列表、包源和包镜像、不同的软件包、管理包设置的软件以及软件包缓存。下文将将详细介绍这些组件。


    ### 软件包列表 (Package Lists)


    Debian 包含一个可用软件包列表。该列表在 `/etc/apt/sources` 文件中引用，特定组件和个人添加的内容在 `/etc/apt/sources.list.d`
    目录下的文件中引用。例如，通讯软件“Skype”使用“skype-stable.list”文件。列表使用文本格式，每行一个包源：


    ```

    | deb http://ftp.de.debian.org/debian/ stretch main contrib non-freedeb-src http://ftp.de.debian.org/debian/
    stretch main contrib non-free |

    ```


    每一行要么指向二进制包类型 (`deb`)，要么指向源包类型 (`deb-src`)。包类型之后是包源，包源指的是提供软件软件包的仓库。接下来，该行包含 Debian
    版本的名称，该名称可以指定为发布版本的别名或分支。


    别名源自电影《玩具总动员》中的一个角色。分支指的是版本的开发阶段，可以是 oldoldstable（上上一个版本）、oldstable（上一个版本）、stable（当前版本）、testing（下一个版本）、unstable（未来版本）或
    experimental（实验性）。在分支名称之后，是软件包类的名称。


    Debian 9 Stretch 的安全更新条目如下：


    ```

    | deb http://security.debian.org/ stretch/updates main contrib non-freedeb-src
    http://security.debian.org/ stretch/updates main contrib non-free |

    ```


    为了从引用的包源刷新软件包列表，请调用以下命令：


    ```

    ## apt-get update

    ```


    ### 包源 (Package Sources)


    Debian 项目维护着一个名为“包镜像（package mirrors）”的官方包源列表。该列表分为主镜像和次要镜像。主镜像提供所有支持的架构范围，而次要镜像仅提供子集。对于美国，官方主包镜是：


    ```

    | ftp.us.debian.org |

    ```


    你可以在此处查看你所需的包镜像的当前状态：


    ### 软件包类型 (Package Types)


    Debian 将其软件包分为三类：


    *   `Main` - 自由软件包。

    *   `Contrib` - 依赖于非自由软件包的自由软件包。

    *   `Non-free` - 不提供源代码的非自由软件包。


    属于非自由类的软件包包括固件驱动程序、Skype 通讯软件和 Flash 插件。源包列表中的每一个条目都指定了它们的软件类别。


    ### 软件包管理工具 (Package Management Tools)


    为了维护你 Linux 系统上安装的软件包选择，提供了几种工具：


    *   `dpkg` - 用于管理单个软件包。

    *   `apt`、`aptitude`、`synaptic` - 用于管理带有依赖关系的包。

    *   `tasksel` - 用于管理整个软件集合（任务）。


    下图描述了工具操作的不同层级以及它们如何协同工作。两个带有虚线轮廓的框指的是处理包管理任务的共享库。


    在较低层次，我们有 `dpkg`。它的任务是安装单个 Debian 软件包或删除已安装软件包的。。为了查询软件包和文件，它利用了 `dpkg-deb` 和
    `dpkg-query` 两个工具。`dpkg` 允许你维护包基础，但不处理包依赖关系。


    通常，上层由工具 `apt`、`aptitude` 和 `synaptic` 表示。这些工具的任务是通过将所有操作合并到一个应用程序中来简化包管理。这些工具使用共享库
    `libapt-inst` 或 `libapt-pkg`，或者与 `dpkg` 通信以执行包管理任务。这包括处理包依赖。


    ### 软件包缓存 (Package Cache)


    软件包缓存位于 `/var/cache/apt/archives`。每当你通过 `apt-get` 或 `aptitude` 安装软件包时，相应的软件包就会被检索并本地存储在此路径下。为了说明，下面使用
    `ls` 列出了缓存的 `deb` 包：


    ```

    $ ls /var/cache/apt/archives/*.deb/var/cache/apt/archives/cpuid_20140123-2_amd64.deb/var/cache/apt/archives/libxml2-utils_2.9.1+dfsg1-5+deb8u7_amd64.deb/var/cache/apt/archives/python3-bitarray_0.8.1_amd64.deb$

    ```


    安装的软件包越多，缓存的 `deb` 包就越多。建议通过 `aptitude` 或 `apt-cache` 定期清理包缓存：


    ```

    # aptitude clean

    ```


    ```

    # apt-cache clean

    ```


    ## 9.2 日常管理任务


    本节涉及系统管理员日常生活中需要的基本的包操作。


    ### 显示已安装软件包


    `dpkg -l` 命令列出已安装的软件包。下图显示了其输出。


    单列包含以下信息：


    *   `status` - 软件包状态，例如已安装 (ii) 或已删除但配置 (rc)。

    *   `name` - 软件包名称。

    *   `version` - 软件包版本。

    *   `architecture` - 软件包构建的架构或平台。

    *   `description` - 软件包的简要描述。


    ### 安装软件包


    要安装软件包，使用 `apt-get` 命令。下面的输出显示了安装“htop”软件包的情况。


    ### 更新已安装软件包


    更新已安装的软件包方法如下：首先，使用本章之前提到的 `apt-get update` 更新包列表。然后运行 `apt-get install` 更新软件包。如果有可用的更新版本，新软件包将从包镜像检索，旧软件包将被删除，并安装新的。


    ### 删除已安装软件包


    删除已安装软件包的操作与安装或更新类似。`apt-get` 命令具有删除软件包的选项，如下所示。


    此步骤删除了除了配置文件以外的所有软件包内容。为了完全删除软件包及其配置文件，请添加 `--purge` 选项：


    ```

    # apt-get remove --purge htop...#

    ```


