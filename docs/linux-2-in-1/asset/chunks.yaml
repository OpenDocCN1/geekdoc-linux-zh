    Shell 称为 `bash`。


    Bourne-Again Shell，或 `bash`，可以运行你存储在计算机中作为可执行文件的任何程序。它还可以运行 Shell 脚本，即由 Linux
    命令组成的文本文件。简而言之，这个 Shell 充当命令解释器，或者说是将你输入的任何内容视为命令并执行该输入预期的功能的程序。


    调出终端窗口只需点击桌面上的一个像显示器的图标即可——点击它将带你进入提示符。如果你找不到该图标，只需在主菜单中搜索并选择带有 Terminal（终端）或
    Console（控制台）标签的项目。


