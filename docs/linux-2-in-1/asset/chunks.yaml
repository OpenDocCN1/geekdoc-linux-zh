  trans: "\n当你在 shell 提示符上输入了命令以及选项和参数并准备好运行时时，可以按下键盘上的 Enter 键，这将执行该命令。随后你将在终端上看到该命令的输出，当输出完成后，你会再次看到\
    \ shell 提示符，这表明之前的命令已成功执行。如果你想在单行中输入多个命令，可以使用分号 `;` 来分隔命令。\n\n让我们来看一些 Red Hat\
    \ Enterprise Linux 7 以及其他基于 Linux 的操作系统命令行中日常常用的简单命令。\n\n`date` 命令将显示系统的当前日期和时间。你也可以使用此命令来设置系统时间。如果你为\
    \ `date` 命令传递一个带有 `+` 符号的参数，它表示你希望在输出中显示的日期格式。\n\n```bash\n[student@desktop ~]$\
    \ date\nSat Aug 5 08:15:30 GMT 2019\n\n[student@desktop ~]$ date +%R\n08:15\n\n\
    [student@desktop ~]$ date +%x\n08/05/2019\n```\n\n`passwd` 命令可更改用户的密码。但是，在设置新密码之前，你需要为指定用户指定原始密码。该命令要求你指定强密码，因此必须包含小写字母、大写字母、数字和符号。你还需要确保指定的密码不是字典中的单词。root\
    \ 用户有权更改系统上任何其他用户的密码。\n\n```bash\n[student@desktop ~]$ passwd\nChanging password\
    \ for user student.\nChanging password for student.\n(current) UNIX password:\
    \ type old password here\nNew password: Specify new password here\nRetype new\
    \ password: Type new password again\npasswd: all authentication tokens updated\
    \ successfully.\n```\n\nLinux 操作系统中没有指定文件类型和扩展名。`file` 命令可以扫描任何文件并告诉它是什么类型。你需要将想要分类的文件作为参数传递给\
    \ `file` 命令。\n\n```bash\n[student@desktop ~]$ file /etc/passwd\n/etc/passwd: ASCII\
    \ text\n```\n\n如果你将文件夹/目录作为参数传递给 `file` 命令，它会告诉你这是一个目录。\n\n```bash\n[student@desktop\
    \ ~]$ file /home\n/home: directory\n```\n\n下一组命令是 `head` 和 `tail`，它们分别打印文件的前十行和最后十行。这两个命令都可以与选项\
    \ `-n` 结合使用，该选项用于指定你想显示的行数。\n\n```bash\n[student@desktop ~]$ head /etc/passwd\n\
    This will print the first 10 lines that are in the passwd file.\n\n[student@desktop\
    \ ~]$ tail - n /etc/passwd\nThis will print the last 3 lines that are in the passwd\
    \ file.\n```\n\n`wc` 命令用于统计作为参数的文件行数、单词和字符数。它支持 `-l`、`-w`、`-c` 等选项，分别代表行、单词和字符。\n\
    \n```bash\n[student@desktop ~]$ wc /etc/passwd\n30 75 2009 /etc/passwd\n```\n\
    这显示 `passwd` 文件中有 30 行、75 个单词和 2009 个字符。\n\n在使用 `wc` 命令时传递 `-l`、`-c``-w` 选项，它将根据你传递的选项仅显示行、单词或字符的计数。\n\
    \n`history` 命令显示你之前输入的所有命令以及命令编号。你可以使用 `!` 标记配合命令编号来扩展该命令输入的内容及其输出。\n\n```bash\n\
    [student@desktop ~]$ history\n1 clear\n2 who\n3 pwd\n\n[student@desktop ~]$ !3\n\
    /home/student\n```\n这显示我们使用 `!3` 来扩展 `pwd` 命令，它显示了当前的工作目录，输出结果为 `/home/student`，这是\
    \ student 用户的家目录。\n\n你可以使用箭头键在 `history` 命令提供的输出中导航。向上箭头会将你带到上方的命令，向下箭头将带你到下方的命令。使用右箭头和左箭头键，你可以在当前命令上移动并进行编辑。\n\
    \n### 编辑命令行的快捷键\n\n当你与 `bash` 交互时，命令行中提供了编辑功能。这可以帮助你在正在输入的命令中移动以便进行编辑。我们已经看到了如何使用箭头键配合\
    \ `history` 命令在命令间移动。以下列表将帮助你在处理命令工作时使用编辑功能。\n\n- `Ctrl+a`: 将你的光标带到命令行的开头\n- `Ctrl+e`:\
    \ 将你的光标带到命令行的末尾\n- `Ctrl+u`: 清空从光标位置到行首的行内容\n- `Ctrl+k`: 清空从光标位置到行尾的行内容\n- `Ctrl+Left\
    \ Arrow`: 将光标带到上一个单词的开头\n- `Ctrl+Right Arrow`: 将光标带到下一个单词的开头\n- `Ctrl+r`: 在使用的命令历史列表中搜索模式\n\
    \n### 使用命令行管理文件\n\n在本节中，我们将学习执行管理 Linux 中文件和目录所需的命令。你将学习如何使用 `bash` shell 提示符上的命令来移动、复制、创建、删除和组织文件及目录。\n\
    \n### Linux 文件系统层次结构\n\n让我们先了解 Linux 操作系统文件系统的层次结构。Linux 文件系统是一棵树，由目录构成了文件系统的层次结构。然而，这是一个倒置树，因为在\
    \ Linux 中根从层次结构的顶部开始，分支（即目录和子目录）延伸到根下方。\n\n由 `/` 表示的根目录位于文件系统层次结构的顶部。虽然根用 `/`\
    \ 表示，但请注意斜杠字符 `/` 也用于分隔目录和文件名。例如，`etc` 是根目录的一个子目录，表示为 `/etc`。同样，如果 `/etc` 目录下有一个名为\
    \ `logs` 的文件，我们将其引用为 `/etc/logs`。\n\n根目录 `/` 的子目录是标准的，并根据特定用途存储文件。例如，`/boot` 下的文件将包含执行\
    \ Linux 操作系统启动过程所需的文件。\n\n现在我们来介绍 Red Hat Enterprise Linux 7 文件系统层次结构中的重要目录。\n\
    \n- `/usr`: 随软件安装的共享库存储在此目录中。它还有进一步重要的子目录，例如：\n    - `/usr/bin`: 用户命令文件\n    -\
    \ `/usr/sbin`: 用于系统管理的命令\n    - `/usr/local`: 本地自定义的软件文件\n- `/etc`: 系统配置文件存储在此处。\n\
    - `/var`: 动态变化的文件（如数据库、日志文件等）存储在此目录中。\n- `/run`: 该目录包含运行期间创建且自上次启动以来创建的文件。在此处创建的文件在下次启动时重新创建。\n\
    - `/home`: 这是系统中创建的所有用户的家目录。用户可以在其特定的家路径下存储他们的个人数据和配置。\n- `/root`: 这是 root 用户的家目录，root\
    \ 也是系统的超级用户。\n- `/tmp`: 这是一个用于存储临时文件的目录。超过 10 天且未被访问或修改的文件将被自动删除。在 `/var/tmp`\
    \ 还有另一个目录，其中 30 天未访问或修改的文件将被自动删除。\n- `/boot`: 启动过程所需的文件存储在此处。\n- `/dev`: 包含引用系统硬件设备的文件。\n"
- fmt: '

    Let us now learn how we can locate and access files on the Linux file system.
    In this section, we will learn to use absolute file paths, change the directory
    in, which we are currently working and learn commands, which will help us to determine
    the location and contents of a directory. 


    ## Absolute Paths


    An absolute path indicates a name that is fully qualified. It begins from the
    root `/`, which is followed by each subdirectory until you reach a specific file.
    There is an absolute path defined for every file that exists on the Linux system,
    which can be identified using simple rule. If the first character of the path
    is `/` then it implies absolute path name. For example, system messages are logged
    in a file called `messages`. The absolute path for the messages is `/var/log/messages`.
    There are relative path names in place as well since absolute path names can sometimes
    become very long to type. When you first login to Linux system, you are automatically
    placed in the location of your home directory. There is an initial directory in
    place for system as well. After that, both users and system navigate through other
    directories based on their requirement. The current location of user or system
    process is known as working directory.


    ## Relative Paths


    A relative path refers to the unique path, which is required to reach a file but
    this path is only from the current directory that you are in and does not start
    with `/`. The rule, mentioned, is simple. If the path does not begin with `/`,
    it is relative path for the file. For example, if you are already working in the
    `/var` directory, then the relative path for messages will be `log/messages`.


    ## Navigating through paths


    You can use `pwd` command, which will output the path of current working directory
    you are in. Once you know this information, you can use it to traverse to different
    directories using relative paths. The `ls` command when used with a directory
    path specifies the content of that directory. If you do not specify a directory
    with it, it will list the content of the directory that you are working in.


    ```

    student@desktop ~]$ pwd

    /home/student

    ```


    ```

    student@desktop ~]$ ls

    Documents

    ```


    You can use `cd` command to change directories. For example, if you are in the
    directory `/home/student` and want to go to the directory `Music`, you can use
    relative path to get there. However, if you would want to get into `Downloads`
    directory, you will then need to use absolute path.


    ```

    student@desktop ~]$ cd Music

    student@desktop Music]$ pwd

    /home/student/Music

    ```


    ```

    student@desktop ~]$ cd /home/student/Downloads

    student@desktop Downloads]$ pwd

    /home/student/Downloads

    ```


    As you can see, the shell prompt will display the last part of the current directory
    you are working in for convenience. If you are in `/home/student/Music`, only
    `Music` is displayed at the shell prompt. The `cd` command is used to navigate
    through directories. If you use `cd` with an argument of relative path or absolute
    path, your working directory will switch to that path. You can also use `cd ..`
    which will take you back to the previous directory you were working in if you
    use it again, you will go back to the directory you switched from. If you just
    keep it, you will alternate between fixed directories.


    The `touch` command is another simple command, which if applied to an existing
    file, updates its timestamp without modifying the content of the file. If used
    by passing an argument for a filename that does not exist, it will create an empty
    file with that filename. This allows new users to touch and create files since
    these files will not harm the system in any manner.


    ```

    student@desktop ~]$ touch Documents/test.txt

    ```


    This will create an empty text file called `test.txt` in the `Documents` subdirectory.
    The `ls` command lists files and directories of the directory that you are in.
    If you pass the path of a directory with `ls` command, it will list files and
    directories in that path. The `ls` command can be used with options which further
    help listing files: `-l` will list all the files with timestamps and permissions
    of the files and directories. It also lists the owner and group of that file.
    `-a` can be combined with `-l` to additionally list hidden files and directories.
    `-R` used with the above two options will list files and directories recursively
    for all subdirectories. When you list files and directories, you will see that
    the first two listings are `.` and `..`. `.` denotes the current directory and
    `..` denotes the parent directory and these are present on the system in every
    directory.


    ## File Management using Command Line


    When we talk about file management, we are discussing how to create, delete, copy,
    and move files. The same set of actions can be performed on directories as well.
    It is very important to know your current working directory so that when you are
    managing files and directories, you know if you need to specify relative paths
    or absolute paths. Let us go through a few commands that can be used for file
    management.


    | Activity | Single Source | Multiple Source |

    | :--- | :--- | :--- |

    | Copy file | `cp file1 file2` | `cp file1 file2 file3 dir` |

    | Move file | `mv file1 file2` | `mv file1 file2 file3 dir` |

    | Delete file | `rm file1` | `rm -f file1 file2 file3` |

    | Create directory | `mkdir dir` | `mkdir -p par1/par2/dir` |

    | Copy directory | `cp -r dir1 dir2` | `cp -r dir1 dir2 dir3 dir4` |

    | Move directory | `mv dir1 dir2` | `mv dir1 dir2 dir3 dir4` |

    | Delete directory | `rm -r dir1` | `rm -rf dir1 dir2 dir3` |


    `mv file1 file2`: The result of this is a rename.

    `cp -r dir1 dir2`

    `rm -r dir1`: `-r` is used to process the source directory recursively.

    `mv dir1 dir2`: If `dir2` exists, the content of `dir1` will be moved to `dir2`.
    If it does not exist, `dir1` will be renamed to `dir2`.


    ```bash

    cp file_1 file_2 file_3 directory

    mv file_1 file_2 file_3 directory

    cp -r directory1 directory2 directory3 directory4

    mv directory1 directory2 directory3 directory4

    ```

    Make sure that the last argument to be passed in the command should be a directory.


    ```bash

    rm -f file_1 file_2 file_3

    rm -rf directory1 directory2 directory3

    ```

    Kindly use this carefully as the `-f` uses a force option will delete everything
    without any confirmation prompt.


    ```bash

    mkdir -p par1/par2/dir

    ```

    Kindly use this carefully as using `-p` will keep creating directories starting
    from the parent and irrespective of typing errors. Let us now go through these
    file management commands one by one to see how they work.


    ## Directory Creation


    You can use the `mkdir` command to create a directory, or even subdirectories.
    If a filename already exists or if the parent directory that you have specified
    does not exist, you will see errors generated. When you use the `mkdir` command
    along with the option `-p` it will create all parent directories along the path
    that do not exist. You need to be careful while using the `-p` option or you will
    end up creating directories that are not required, as it does not check for any
    spelling errors.

