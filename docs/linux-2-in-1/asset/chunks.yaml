  trans: '

    因此，编程语言提供了一个折中方案。虽然语言之间可以形成长期的遗传渊源，但所有语言从根本源上都是为了同一个目的：将人类易于理解的指令分解为计算机可以理解的术语。


    实现这一目标主要有两种方法。第一种是将程序所编写的语言直接翻译成计算机原生支持的语言。这被称为“编译代码”。基于将代码编译为计算机原生语言的语言被称为“编译型语言”。


    第二种是提供一个可以让程序运行的沙箱——一个可以在其中执行程序的虚拟机或运行时环境。这个运行时环境与操作系统被直接隔离开，因为程序并不是运行在真实的操作系统上（尽管程序完全有能力在操作系统上执行功能，例如读写文件），而是运行在一个与操作系统分离的抽象环境中。这意味着你编写的代码不需要翻译成计算机能理解的语言——它只需要能被运行代码的虚拟环境所理解即可。


    那么，各种方式各有什么优缺点呢？每种方式都有自己的优点和缺点。编译型程序的执行速度通常会更快，因为它们被直接翻译成机器码，然后由操作系统直接运行。这意味着除了程序本身所需的内容外，编译型程序没有额外需要加载的内容。编译型程序通常还提供了许多计算机直接接口，这是解释型程序所没有的。例如，对于编译型程序，由于你是在直接与计算机通信，你通常会负责诸如分配或释放内存存储等操作。


    同时，解释型语言也自带许多优势。首先，在现代计算硬件上，执行时间通常并不那么重要，因为计算机远比以前快得多。此外，编译型语言的优势之一也可以是解释型语言的优势：编译型语言与计算机如此接近，这使得它们的管理、部署和快速原型设计变得有些困难。然而，解释型语言提供了足够的抽象层次，让程序员可以合理地快速构建原型。也许解释型语言最大的吸引力在于，你不需要为每台计算机以不同的方式对其进行编译；程序运行在解释器中，此如此。这意味着如果一个操作系统拥有该语言的解释器，用该语言编写的程序就能在该操作系统上运行。最流行的解释型语言之一
    `Java` 实际上正是基于这些原因而获得了大量的主流认可：在动荡的计算机市场中，许多不同的操作系统争夺市场地位，“编写一次，处处运行”的想法极具吸引力，而当时的市场还很年轻，对于需要在多个系统上运行的软件来说，还没有简单的解决方案。


    在本书中，我们将涵盖一种解释型语言和一种编译型语言，其中 `C++` 是编译型语言，而 `Python` 是解释型语言。你将亲身感受到这两种不同形式之间的对比。不过不要被这个安排吓到；正如我在本章开头提到的，编程语言总是非常相似的。有一些支撑每种编程语言的概念，我们将在本章讨论这些概念。


    ## 程序流 - 过程式、函数式、面向对象等


    这是不同编程语言之间最大的区别之一；它们在编写和编写程序的方式上通常有自己偏好的范式。


    从历史角度看，函数式或过程式语言曾占据统治地位。这意味着所有代码的编写方式都是以线性和过程化的方式进行的，在复用方面的限制非常少。程序有明确定义的起点和终点，并且从一个点到另一个点的路径相当狭窄。这是有合逻辑的，因为当时的计算机更简单，内存和硬盘空间也更小；本质上，程序员浪费时间或空间的余地更小。一切的设计都是为了让计算机解析时尽可能简单直接，以便让任何东西在功率消耗上都不比需要的更大或更耗能。


    然而，这种范式开始发生变化。在这一过程中，最重要的语言可能是 `Ada` 和 `Smalltalk`。这些语言早就展示了面向对象编程的力量，这种力量后来成为当前计算硬件上大多数程序的主要运行机制。`C++`
    最终作为 `C` 语言的扩展版本出现，专门为了包含面向对象编程的潜力而创建。随后出现了 `Java`，以及大量不同脚本语言的开发，这些语言旨在帮助程序员快速上手，例如
    `Python`、`Perl` 和 `Ruby`。所有这些语言的核心都有重要的概念。许多现代语言，如 `C#` 和 `Go`，也在使用面向对象的范式。


    那么，什么是面向对象编程呢？鉴于你将使用的两种语言都配备了为了适应面向对象编程的不同特性，本书在随后的章节将重点介绍这一内容。本质上，与函数式或过程式编程范式相比，面向对象编程提供了一种更加模块化、可复用且易于理解的编程方法。面向对象的理念在很大程度上在于，它允许程序员开始将事物拆解成大块。当我们开始讨论对象和类时，稍后会详细讨论这一点。虽然这对于使用
    `Bash` 的短 Linux 脚本可能派不上用，但当你稍后开始使用 `C++` 和 `Python` 处理实际应用程序时，它将始终有用，因此现在涵盖所有概念是非常重要的，这样当它们实际上开始以某种方式被使用时，你已经熟悉了底层思想。


    ## C 和 C 风格语言


    在概念上，这可能是本章要涵盖最重要的内容之一。理解不同的编程语言就是理解整个起源过程。在这个起源过程的一个阶段，有一种名为 `C` 的语言。这之所以很重要，是因为
    `C` 和基于 `Unix` 的操作系统配合得近乎完美。


    让我带回到 1972 年：Dennis Ritchie 和 Ken Thompson 正在开发一种语言，将作为 `B` 语言的自然继者，而 `B` 语言本身又是
    `BCPL` 的自然继者。这种语言在那个时代是最容易上手的语言之一。它提供了许多其他语言不具备的功能，它足够简单，让任何人都能很轻松地学会，并降低了使用和操作计算机的基础门槛。


    然而，这种语言很快就变成了意义巨大的东西。Brian Kernighan 和 Dennis Ritchie 是 AT&T 实验室的员工——正是这个实验室成为了
    `Unix` 的创造者。嗯，在开发 `Unix` 之后，Ken Thompson 决定用 `C` 语言编写一个 `Unix` 版本，而不是之前使用的那种非常特定的机器语言。

