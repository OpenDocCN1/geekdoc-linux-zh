    \nThe rm command can be used to delete files. To delete directories, you will\
    \ need to use rm -r, which will delete a directory, subdirectories and files in\
    \ the whole path.\n\nNote: There is nothing such as trash or recycle bin while\
    \ operating from the command line. If you delete something, it is deleted permanently. \n\
    \n[student@desktop ~]$ ls\n\nFile1.txt Directory1\n\n[student@desktop ~]$ rm file1\n\
    \n[student@desktop ~]$ ls \n\nDirectory1\n\n[student@desktop ~]$rm -r Directory1\n\
    \n[student@desktop ~]$ ls \n\n[student@desktop ~]$\n\nThe above command has demonstrated\
    \ how you can delete a file and a directory using the rm command and using the\
    \ -r option. \n\nAlso note that there is a rmdir command, which can be used to\
    \ delete a directory as well provided that the directory is completely empty. \n\
    \n File Globbing\n\nManagement of files can become hectic if you are dealing with\
    \ many files. To overcome this hurdle, Linux offers a feature called file globbing,\
    \ also known as path name expansion. It uses a technique called pattern matching,\
    \ also known as wildcards, which is achieved with the use of meta-characters that\
    \ expand and allow operations to be performed on multiple files at the same time. \n\
    \n Pattern matching using * and ?\n\n[student@desktop ~]$ ls a*\n\nalpha apple\n\
    \nAs you can see, the * is used as a wildcard to match a pattern, which has any\
    \ files that begin with a. \n\nYou can try this pattern placing the start at different\
    \ locations such as *a and *a*\n\n[student@desktop ~]$ ls ???\n\naretabmap\n\n\
    The number of question marks defines the number of characters in a file name.\
    \ The output will show all files, which have a filename of 3 characters. You can\
    \ try it with additional question marks as well.\n\n Tilde Expansion\n\nThe tilde\
    \ symbol ~ followed by a slash / will point to the active user’s home directory.\
    \ It can be followed by a directory name and can be used with commands such as\
    \ cd and ls\n\n[student@desktop ~]$ ls ~/Documents\n\nfile.txthello.txt\n\n[student@desktop\
    \ ~]$ cd Documents\n\n[student@desktop Documents]$\n\n[student@desktop Documents]$\
    \ cd ~/\n\n[student@desktop ~]$\n\n Brace Expansion\n\nThe brace command is used\
    \ when files have something in command, and you do not want to type it repetitively.\
    \ It can be used with strings, which are comma-separated, and with expressions,\
    \ which have a sequential nature. You can have nested braces as well.\n\n[student@desktop\
    \ ~]$ echo {sunday, monday, tuesday}.log\n\nsunday.log monday.logtuesday.log\n\
    \n[student@desktop ~]$ echo file{1..3}.txt\n\nfile1.txtfile2.txtfile3.txt\n\n\
    [student@desktop ~]$echo file{a{1, 2}, b, c}.txt\n\nfilea1.txtfilea2.txtfileb.txtfilec.txt\n\
    \nThis is where we end this chapter and you have learned how to manage files and\
    \ directories using simple commands using the command line interface on a Linux\
    \ system. Most of these commands are generic to any flavor of a Linux operating\
    \ system and not just Red Hat Enterprise Linux 7\\.\n\n6.  Benefits of the Linux\
    \ operating system\n\nIn this chapter, we will look at the main benefits of Linux.\
    \ Here not all are collected, but the main advantages of this operating system\
    \ are.\n\n1.  Linux is faster\n\nYes, it is. Linux kernel operating systems really\
    \ benefit in terms of performance ahead of Windows. That is why the web server\
    \ is most often equipped with this system.\n\nOf course, not every Distributor\
    \ boasts performance. For example, the world-famous Ubuntu without settings will\
    \ work much worse than the same Windows 7\\. But there are Xubuntu and Lubuntu,\
    \ which will never let you down.\n\n2.  Linux is better customizable.\n\nWindows,\
    \ as such, does not give a special leeway to take at least pre-installed tools\
    \ to change the appearance. They can do little to help. But Linux!\n\nI use the\
    \ environment – am an active Linux user, programmer and founder of the ProgHacker\
    \ website. Today I would like to tell you why it is worth switching to a Linux-based\
    \ operating system. E of the XFCE desktop. based on this Xubutnu.\n\nCould you\
    \ do this in Windows? Maybe with the use of third-party programs, yes, but it\
    \ would give significant damage to your RAM. And the above view works on a completely\
    \ inconspicuous device - 1 GB OP + Pentium 4\\.\n\n3.  Most distributions are\
    \ free.\n\nSomething I thought... But this, in fact, is a decisive factor for\
    \ organizations. Almost all distributions are distributed free of charge even\
    \ for commercial use. You do not need to activate, you should just download and\
    \ install.\n\n4.  Linux is an open source world.\n\nSince Linux itself is free,\
    \ it has many tools built on the principle of open source software. Not only do\
    \ you not have to pay for the program, but you can also make changes to them yourself.\
    \ This explains the transparency of the installed programs – in the official repositories\
    \ malicious software will not work.\n\n5.  Linux is safer\n\n Linux has its roots\
    \ in prehistoric UNIX systems — and since then many of the principles have remained\
    \ the same. Since all the code is low-level, it does not depend on any additional\
    \ libraries, it will be difficult to hack the device. And the number of Linux\
    \ users is too low for hackers to pay attention as a platform for attack.\n\n\
    6.  No need to pull hundreds of accounts\n\n If Microsoft Windows requires the\
    \ user to bind to multiple accounts, then there is no such thing in Linux. First,\
    \ the account itself is optional – the number of its applications is negligible.\
    \ Well, even if it is needed, almost all the services that are somehow related\
    \ to Linux are tied to Ubuntu One – a single account.\n\n7.  Choose to your taste!\n\
    \nAre you a designer? Writer? Painter? Translator? Then, for sure, a distribution\
    \ kit is ready for you, which contains all the programs ready for work!\n\nIf\
    \ you had to download everything on Windows, then many Linux distributions are\
    \ based on Linux that is already customized for specific needs.\n\nFor example,\
    \ Ubuntu Studio is suitable for a small (or large) studio, TuxTrans for the translator,\
    \ Fedora Design Suite for the artist, KXStudio for the musician.\n\n8.  Stability\n\
    \n If Windows requires a lot of updates, and your computer’s memory is filled\
    \ every six months, this will not happen in Linux. There is no registry in the\
    \ usual sense of the word, and all installed packages and programs are easily\
    \ controlled. So farewell, frequent reinstallation!\n\n9.  Linux weighs little"
