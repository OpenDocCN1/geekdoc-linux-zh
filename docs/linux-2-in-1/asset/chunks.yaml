    如果你决定从 USB 盘安装（这是更现代的选择），你需要安装一个额外的软件。如果你运行的是 Windows，`Unetbootin` 是一个选择。它下载简单，启动也很方便。从那里，你可以从提供的列表中选择你想要的发行版，并将其下载到
    USB 盘中。并不是所有的发行版都由 `Unetbootin` 提供，但这并没有限制你的选择。你只需要从你发行版的下载页面将 `.ISO` 文件下载到桌面，然后让
    `Unetbootin` 识别该文件即可。


    然后，你需要按照与 CD 相同的过程操作：在连接好安装了发行版的驱动器的情况下重启电脑，进入 `BIOS`，选择启动项并将 USB 硬盘设为列表中的第一个选项，保存设置并再次重启。你将进入
    `Unetbootin` 菜单，在其中你可以像使用光盘 CD 方法一样启动 Linux 会话。


    ## 安装过程


    发行版在你系统上的安装方式各不相同，但你通常会获得一个引导你完成整个过程的设置指南。如果你决定在另一个操作系统（如 Windows）旁边安装 Linux，那么在安装过程中需要进行一些工作，以确保一切运行顺利。


    在这种情况下，第一步是对你的驱动器进行分区。这将告诉你的电脑你想将 Linux 安装在何。这是一个简单的任务，不需要你花费太多精力。你只需要在硬盘上选择一个空间，并将你的一些空闲空间用于操作系统的安装和运行。


    如果你正在安装 Ubuntu，程序通常会通过选择自己的空间为你完成这一点。从那里开始，剩下的安装过程就相当简单。


    对于其他发行版，你需要自己对空间分区，而某些分区工具可能会很复杂。在这种情况下，你需要创建两个新分区。一个为操作系统本身留出空间，建议至少留出 10 GB。你应该将此分区命名为
    `Ext4` 并将挂载点设为 `/`。然后创建第二个名为 `swap space`（交换空间）的分区。这是存放内存的地方，以便运行操作系统并保持任务的快速处理。如果你可用的内存（RAM）较小，请将交换分区的大小设置为可用内存的两倍。如果你有足够的内存（3GB
    以上），则将交换分区的大小设为与你的可用 RAM 相同。


    ## GRUB 及其他引导程序


    在 Linux 完成安装过程之前，它会在你的系统上安装一个名为 `GRUB` 的新引导程序。这将替换你标准的引导程序，并在启动时提供打开 Windows 或
    Linux 桌面的选项。在安装过程的这一部分，你不需要进行任何工作；你只需要坐好让你的发行版安装 `GRUB` 即可。


    对于使用 Mac 的用户来说，这是过程中的一个部分会有所不同，你需要手动将 `GRUB` 安装到 Linux 分区。


    Windows 用户：请注意，如果你决定在任何时候卸载并重新安装 Windows，你将在重新设置好操作系统后手动安装一次 `GRUB`。


    如果你更倾向于具有更增强用户界面的东西，可能想要安装另一个与 Linux 兼容的引导程序。一个例子是名为 `Burg` 的引导程序。然而，你不需要立即这样做，可以等完成
    Linux 的安装之后再设置新的引导程序。


    如果你遵循了这些步骤，你已经就绪了。你的 Linux 分区现在应该已经安装完成，你只需要重启电脑进入 `GRUB` 菜单。从那里，你可以决定是想启动 Linux
    还是 Windows。显然，出于本书的目的，我们希望启动 Linux 以首次感受一下。你会发现你的 Linux 发行版预装了几个应用程序。其中一些对你有用，另一些则没有，但你可以查看每一个并弄清楚哪些是可以使用的。


    在某些情况下，安装新的操作系统可能会导致硬件变得不稳定。这通常是因为硬件没有意识到你正在使用 Linux，可能会发生一些通信错误。这在 Wi-Fi 上尤为常见。你可以采取一些步骤来确保所有硬件都与你的新安装兼容。


    ## 9. 计算机与数学


    运算对计算机来说是自然而然的，幸运的是编程语言往往让它变得简单。这些符号非常直观，你在使用它们时应该有太大问题。我将列出通数学符号以及你何时可以使用它们：


    - `+` 这个符号无疑表示加法。

    - `-` 这个符号表示减法。

    - `*` 这个符号表示乘法。

    - `/` 这个符号表示除法。

    - `%` 这个符号是取模运算。它指的是给定除法题的余数。例如，`7%2` 将是 `1`，因为 7 除以 2 的余数是 `1`。

    - `**` 这个符号将数字转换为指数。例如，`2**2` 将是 2 的平方，即 4。

    - `//` 这个符号指的是取整除（地板除）。


    此外，还有一些赋值运算符旨在让编程中的算术运算更直观。赋值运算符是用于给赋值值的运算符。最常用的是等号，它给某个事物一个特定的值。然而，还有更多选择。


    例如，与其输入 `x = x + 1`，你只需要输入 `x++`。与其输入 `x--`，你只需要输入 `x--`。


    还有简写赋值运算符。这些用于获取算术运算并将其缩短。例如，与其写 `x = x + 3`，你可以简单地写 `x += 3`。


    以下是简写运算符及其用途：

    - `x += y` - `x + y`

    - `x -= y` - `x - y`

    - `x *= y` - `x * y`

    - `x /= y` - `x / y`

    - `x **= y` - `x**y`

    - `x //= y` - `x // y`


    ## 计算机与逻辑


    在章的这一部分，我们将开始讨论逻辑的基础。逻辑是一个非常密集的话题，但它也相当简单。本质上，当涉及到我们做出的陈述时，倾向于用非常抽象的术语来考虑它们。我们甚至在真正不需要抽象的地方做了不必要的抽象。这不是计算机的工作方式。


    正如我之前提到的，计算机是愚笨的。它们完全按照你所提供的字面意思来处理事物。如果你对计算机说些什么，它将其解释为该陈述的字面形式。


    这很重要，因为逻辑也用于我们每天做的几乎每一个决策，如果你不理解处理逻辑的不同方式，将这些决策映射到计算机将证明非常困难。


    在 Java、C++ 和 Python 中，这些都是比较运算符：

    - `<` 小于

    - `<=` 小于等于

    - `>` 大于

    - `>=` 大于等于

    - `==` 等于


