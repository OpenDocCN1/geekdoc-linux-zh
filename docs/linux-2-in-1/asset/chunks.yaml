  trans: '

    Nano 将打开并为你提供一个空文件进行编辑。现在，输入以下 shell 命令。


    ```bash

    echo ‘hello world’

    ```


    在键盘上，按下 `ctrl + x` 退出编辑器。当询问你是否要保存文件时，按下 `yes` (`y`)。


    随后，Nano 将确认你是否要保存该文件。按下 `enter` 确认该操作。


    现在使用以下命令运行脚本 `hello.sh`：


    ```bash

    bash hello.sh

    ```


    当你将其作为 gif 来看时，这些步骤看起来[如下](http://www.compciv.org/files/images/cli/cli-bash-script-hello-world.gif)。


    [`bit.ly/2piclinux`](http://bit.ly/2piclinux)


    因此，`hello.sh` 并不特别有趣，但它至少捕捉到了你想要执行的本质，即将一系列命令封装到一个文件中（即脚本），这样你就可以根据需要反复运行该脚本。这可以帮助你避免在重复输入入命令时可能出现的拼写错误，并允许该脚本在不同的场景下被复用。


    ## 在可复用的 Shell 脚本中使用参数


    现在让我们尝试让 `hello.sh` 变得复杂一点。现在不再是重复输出 hello world，而是通过创建脚本让它对某个值（例如，人的名字）说“hello”。这会让脚本看起来更好一点。你可以这样使用它：


    该 gif [如下所示](http://www.compciv.org/files/images/cli/cli-bash-hello-excitedly.gif)。


    [`bit.ly/2linux5`](http://bit.ly/2linux5)


    首先，你通过在“world”的位置添加一个变量来定制“hello world”。尝试在命令行中交互式地完成这一操作：


    输出是：


    Hello Dan


    因此，这里的问题是，如何让脚本 `hello.sh` 读取你传递给它的参数（在本例中为人的名字）？


    你通过一个特殊的 bash 变量来实现。你从命令行传递给脚本的第一、第二个和第三个参数分别由包含 `$1`、`$2`、`$3` 的变量表示。因此在上面的示例中，当
    `hello.sh` 开始运行时，名字 George 将保存在变量 `$1` 中。


    重新打开 `hello.sh` 并将代码更改为如下内容：


    保存更改后，运行以下命令查看输出。


    ![00043.jpeg](img/image00330.jpeg)


    如果你希望输出以全大写形式返回，只需按如下修改 `hello.sh`，确保通过 `tr` 管道输出，以便将所有小写字母替换为大写字母。


    现在如果你追求简洁，你可能会发现 `$yourname` 变量并不是必要的。代码将简化如下：


    现在慢一点，我的朋友。如果你能创建一个脚本，你就可以这样执行：


    ……那么恭喜你，你学习了一个重要的概念。你刚刚学习了程序员如何将复杂的内容装进一个可以被单行运行的“容器”中。在我们开始做出某些决定之前，让我们看看如何使用一种被称为“变量”的功能来引用数据，这包括命令的输出或结果。


    ## 结论


    感谢你读完《计算机黑客工具》，希望这些内容对你有所帮助，并能为你提供实现目标（无论目标为何）所需的所有工具。


    下一步是遵循互联网上的不同示例来练习黑客技术。作为一名黑客，你需要记住最重要的的一点是遵守伦理。在攻击任何目标之前，务必尝试获得许可。


    如果你想进一步精通黑客技术，我们还有另一个模块详细解释了其他黑客工具以及黑客所需的脚本知识。如果你能够很好地集中注意力而不偏离，黑客可以是一个很好的职业。这本书大致从最开始开始，即我安装
    Linux Mint，一直讲到了无线黑客方法。

    '
