- fmt: "\nWorking with the Linux operating system requires you to have knowledge about\
    \ the terminal and the command line. It is essential to know what these things\
    \ are, to be at least slightly familiar with their usage and the standard commands\
    \ available.\n\n## What is a Terminal?\n\nA terminal is described as \"a program\
    \ that emulates a video terminal within some other display architecture. Though\
    \ typically synonymous with a shell or text terminal, the term terminal covers\
    \ all remote terminals, including graphical interfaces. A terminal emulator inside\
    \ a graphical user interface is often called a terminal window”.\n\nTo be precise,\
    \ a terminal is simply the outside. Inside a terminal runs a command line interpreter\
    \ that is called a shell.\n\nDebian Linux supports a long list of terminal software.\
    \ This includes the `Aterm`, as well as the `GNOME terminal`, the `Kterm`, the\
    \ `Mate Terminal`, the `Rxvt`, the `Xterm` and the `Xvt`. These different implementations\
    \ of terminal software vary in terms of stability, support for character sets,\
    \ design, colors and fonts, as well as the possibility to apply background images\
    \ or work with transparency\n\nIn this book we will use the `GNOME terminal` because\
    \ of its stability, simplicity and adjustability. In order to increase and decrease\
    \ the size of the content that is displayed inside the terminal window; use the\
    \ two-key combinations `CTRL+` and `CTRL-`.\n\n## 6.2 What is a Shell?\n\nSimply\
    \ speaking, a shell is a sophisticated command-line interpreter. In a loop the\
    \ shell reads characters, modifies them under certain conditions, and executes\
    \ the result.\n\nUnder certain conditions, between reading from the command-line\
    \ and the execution of the actual result, the shell must interpret special characters\
    \ that are part of your input. The table below displays the special characters\
    \ that are available:\n\n| Character | Meaning |\n| :--- | :--- |\n| `$name` |\
    \ substitution of a variable |\n| `name=` | assignment of a variable |\n| `'command'`\
    \ | substitution of a command |\n| `$(command)` | substitution of a command |\n\
    | `< > >> 2> 2>>` | redirection of input and output |\n| `&#124;` | pipelining\
    \ of commands |\n| `\" ' \\` | quoting |\n| `* [ ] ?` | creation of file names\
    \ (globbing) |\n| `;` | separation of commands |\n| `&` | run the command in the\
    \ background |\n| `&#124;&#124; &&` | run the commands under certain conditions\
    \ |\n| `{ } ( )` | cramp commands |\n\nFor interest sake, the shell divides the\
    \ command-line into single words in order to determine the commands, by means\
    \ of the following process:\n\n| Step | Description | Special Characters |\n|\
    \ :--- | :--- | :--- |\n| 1 | read until the command separator and tagging (substitution\
    \ of commands) | `\\n & &#124; &#124;&#124; &&; $(...) \\ \"...\" '...\"` |\n\
    | 2 | tagging (input-/output redirection, assignment of values) | `< > >> 2> 2>>\
    \ name=` |\n| 3 | division into single words | space, tabulator |\n| 4 | substitution\
    \ of variables | `$name` |\n| 5 | substitution of commands | tagging, see step\
    \ 1 and 2 |\n| 6 | input-/output redirection | tagging, see step 1 and 2 |\n|\
    \ 7 | assignment of variables | tagging, see step 1 and 2 |\n| 8 | division into\
    \ words | based on IFS |\n| 9 | creation of file names | `* [ - ]` |\n| 10 | command\
    \ execution | |\n\nIn steps 1 and 2 tagging happens for steps 5 to 7 only, and\
    \ no further action takes place. Steps 5 to 7 are executed if tagging is completed.\
    \ Next, the shell removes all the special characters. In step 10 the command-line\
    \ contains only the arguments that are needed to execute the command. The shell\
    \ interprets the first word as the name of the command to be executed, and the\
    \ remaining words are its arguments:\n\n| `command arg1 arg2 arg3 ...` |\n\n##\
    \ 6.3 Available Shells\n\nYour Linux system allows the usage of various shells.\
    \ Each shell is available as a separate software package through the Debian package\
    \ manager, `Aptitude`, we installed earlier. The list of shells is quite long,\
    \ so we list only a selection of the available shells that are the most popular:\n\
    \n*   Almquist Shell (`ash`)\n*   Bourne Again Shell (`bash`)\n*   Debian Almquist\
    \ Shell (`dash`)\n*   Z Shell (`zsh`)\n*   C Shell (`csh`)\n*   Korn Shell (`ksh`)\n\
    *   Tenex C Shell (`tcsh`)\n\nUnless otherwise stated the examples in this document\
    \ are based on the Bourne Again Shell (`bash`). At the time of writing this document\
    \ this is the default shell on Debian.\n\nWhich other shells are allowed in your\
    \ Linux system, is set up in the configuration file `/etc/shells`? Using the `cat`\
    \ command, you can see the list of allowed shells:\n\n```\nuser@debian95: ~$ cat\
    \ /etc/shells\n# /etc/shells: valid login shells\n/bin/sh\n/bin/dash\n/bin/bash\n\
    /bin/rbash\n/usr/bin/screen\nuser@debian95: ~$\n```\n\nThe name of the shell that\
    \ is currently in use in your terminal is kept in the shell variable `$0`. The\
    \ following simple command outputs the shell’s name:\n\n```\nuser@debian95: ~$\
    \ echo $0\nbash\nuser@debian95: ~$\n```\n\nIn order to change the shell currently\
    \ in use, have a look at the `chsh` command and the configuration file `/etc/passwd`\
    \ covered in the following section.\n\n# Chapter 6 Variables\n\nIn Linux, creation\
    \ of variables is very easy. For example, in order to store a name, John into\
    \ a variable `name`, you can do something like what’s being shown below:\n\n```\n\
    [root@archserver ~] # name=\"John\"\n```\n\nThe double quotation marks tell Linux\
    \ that you are creating a variable which will hold string typed value: John. If\
    \ your string contains only one word then you can ignore the quotation marks,\
    \ but if you are storing a phrase that contains more than one word and whitespaces\
    \ than you must use the double quotation marks. To see the value inside any variable,\
    \ you must use the dollar sign (`$`) before mentioning the name of the variable\
    \ in the `echo` command. Like this:\n\n```\n[root@archserver ~] # echo $name\n\
    John\n```\n\nIf you miss the dollar sign (`$`), `echo` will treat the argument\
    \ passed to it as a string and will print that string for example:\n\n```\n[root@archserver\
    \ ~] # echo name\nname\n```\n\nYou should keep in mind that there should not be\
    \ any white spaces present between the identifier of the variable and its value.\
    \ An identifier is basically the name or signature of a variable:\n\n```\n[root@archserver\
    \ ~] # x=5 # This syntax is correct because there aren’t any whitespaces\n[root@archserver\
    \ ~] # x = 10 # This syntax is incorrect because whitespaces are\n           \
    \            #present between the variable name and its value\n```\n\nIf you want\
    \ to store some value inside a file whilst using the `echo` command, you could\
    \ do something like this:\n\n```\n[root@archserver NewFolder] # echo name > new.txt\n\
    [root@archserver NewFolder] # cat new.txt\nname\n```\n\nIn the example above,\
    \ I am storing a string `name` into a file that I created. After storing the text\
    \ in the file, I printed it on the terminal and got exactly what I stored in the\
    \ text file. In the following set of commands, I am using double `>>` signs to\
    \ append new text in the existing file.\n\n```\n[root@archserver NewFolder] #\
    \ echo \"is something that people use to recognize you!\" >> new.txt\n[root@archserver\
    \ NewFolder] # cat new.txt\nname\nis something that people use to recognize you!\n\
    ```\n\nYou can also create and print two variables with a single line of command\
    \ each, respectively.\n\n## Example:\n\n```\n[root@archserver ~]# x=1; y=2\n[root@archserver\
    \ ~]# echo -e \"$x\\t$y\"\n12\n[root@archserver ~]# echo -e \"$x\\n$y\"\n1\n2\n\
    ```\n\nThe flag `-e` tells Linux that I am going to use an escape character whilst\
