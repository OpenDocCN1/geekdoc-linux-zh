    ## Case 语句


    你可能还想根据对应一组模式的变量来采取不同的路径。你显然可以使用一系列的‘elif’ 和‘if’ 语句，但这很快就会变得臃肿。幸运的是，我们可以使用‘case’
    语句让代码变得更整洁。


    查看以下示例以理解我在说什么：


    这是一个更基础的示例：


    现在让我来为你拆解一下：


    在第四行，我们看到该行启动了 `case` 机制。


    在第五行，`start` 等于 `$1`；然后你执行随后的操作。`)` 表示该模式的结束。


    在第七行，这组语句的结束用双分号（`; ;`）标识。下一个考虑的 case 紧随其后。


    在第十四行，必须注意每个 case 的测试都是一个模式。`*` 表示任意数量的任意字符。它本质上是在没有其他 case 匹配时的通捕符。尽管不是必须，但它经常被使用。


    在最后一行，我们看到了 `esac`。它是 `case` 的反写；它向你展示你已经处于 case 语句的结束。之后的所有语句都将正常执行。


    现在让我们来看一个稍微复杂的 case，其中模式的使用稍多。


    **活动：做出你自己的决定**


    1.  编写一个 Bash 脚本，接受两个数字作为命令行参数。

    2.  创建一个接受文件作为命令行参数并对其分析的脚本。例如，你可以检查文件是否可写或可执行。如果是真，则打印一条消息；如果是假，则打印另一个。

    3.  现在创建一个脚本，根据当前的星期几打印消息。例如，周六打印“Happy surf day”，周日打印“TGIF for Sunday”等。


    # 第 10 章 常用 Linux 文件和目录操作


    现在你已经开始练手了，你一定渴望进行更多的编码，并真正开始在系统中玩起来。我保证你会的，但首先，还有一些真正需要学习的理论，这样当你进入系统时，你就能真正理解它为什么这样做，以及如何利用你学过的命令做更多事情。所以，让我们深入研究你需要学习的核心概念。


    ## Linux 中的一切皆为文件。


    这是一个非常重要的概念——Linux 中的一切，无论它在哪里或在做什么，都是一个文件。文本文件显然是文件。目录也是文件。你的电脑键盘是一个只读文件，你电脑的显示器——即使这也是一个文件，尽管它是可写文件。一切。起初，这对你的操作没有任何实际影响，但你必须始终记住这一点，因为它将帮助你理解
    Linux 如何进行目录和文件管理。


    ## Linux 被称为“无扩展名系统”。


    这一点稍微难理解，但随着你阅读这本书并学习更多，你会发现它是有道理的。文件扩展名通常由点之后的一系列 2、3 或 4 个字符组成。你已经在 Word (`.doc`,
    `.docx`)、`.pdf` 等文件中见过这些了。这个扩展名告诉了你正在处理的文件类型。以下是你会遇到的一些常见类型：


    *   `File.exe`: 一个程序或可执行的文件

    *   `File.txt`:一个纯文本文件

    *   `File.png`, `File.jpg`, `File.gif`: 所有的图像文件


    在许多系统中（如 Windows），这种文件扩展非常重要，因为系统会利用它来确定处理的是什么类型的文件。在 Linux 中，情况不同。Linux 系统会忽略该扩展名，而是调查文件本身以查看它要做什么。例如，你可以有一个名为
    `monkey.gif` 的文件，一张猴子的照片。你可以给文件起一个新名字，比如 `monkey.txt` 甚至只是 `monkey`，Linux 都会将其视为它原本的图像文件。正因如此，你有时发现很难判断文件的类型，但在
    Linux 中有一个非常简单的方法，使用一个简单的命令：`file`。


    ```

    file [path]

    ```


    现在你可能在问自己为什么命令行参数是路径而不是文件。回想一下，记住我们在命令行上指定的每个目录或文件都是路径。而且，由于目录也是文件，说路径无非通往系统位置的行程，而位置就是文件。


    ## Linux 是大小敏感的。


    这是最重要的概念之一，也是最容易给 Linux 新手带来问题的一个。你已经知道 Windows 等系统在文件引用方面是不区分大小的，但 Linux 不同。你可以拥有多个名称相同但大小写不同的目录或文件。例如：


    ```

    ls Documents

    ```


    ```

    FILE2.txt File2.txt file2.TXT

    ```


    ...


    ```

    file Documents/file2.txt

    ```


    ```

    Documents/file2.txt: ERROR: cannot open ''file2.txt'' (No such file or directory)

    ```


    每一个文件都被 Linux 视为一个独立的文件。


