    order.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-23.png](Images/image00296.jpeg)


    ### wc


    In a file a line, character or the number of words you''re wondering, you can
    use `wc` (wordcount) command. With `-l` the line, with `-c` the character and
    with `-w` and parameter, the number of words can be learned. If you use without
    parameters as `wc`, it shows all.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-24.png](Images/image00297.jpeg)


    ### nl


    Previously, numbering the printing process we did it with `cat -n` lines, we can
    also do it with `nl` command. For example, in the context of hacker file to enumerate
    rows, `nl hacker` command is used.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-25.png](Images/image00298.jpeg)


    Content with a text file in a long line as enumerate as well as to see a few lines
    at the beginning, `nl [TextFile] | head -n [number]` command can be used.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-25-1.png](Images/image00299.jpeg)


    Similarly, to list a few lines from the end, `tail` command is used instead of
    `head`.


    ### pr


    To divide the contents of the page document, we use the `pr` command. For example,
    to view a file called `list`, divide and the content of our page, we can use `pr
    list` command. Therefore, if you print it, you will get a smoother output.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-26.png](Images/image00300.jpeg)


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-27.png](Images/image00301.jpeg)


    ### paste


    To placing the base of the intermediate space between two or more file located
    opposite columns, `paste` command is use. For example, let’s have two files named
    as `LISTA` and `LISTB`. To list mutually the lines side by side contained in these
    files, `paste LISTA LISTB` command is used.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-28.png](Images/image00302.jpeg)


    If you want, you can combine the contents of these files and you can redirect
    to a new file. For example, when we use `paste LIST LISTB > LISTC` command, the
    next contents of two files side by side in mutual line and at the same time creating
    a new file named `LISTC` will be saved into the file.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-29.png](Images/image00303.jpeg)


    ### grep


    To search for an expression (string) in files or output of a command, we can use
    `grep` command. Before the example of our command, let''s use some of the important
    parameters.


    - `-v`: Reverses the behavior of the command line that does not contain the sought
    word lists.

    - `-i`: Upper / lower case is not taken during a search.

    - `-r`: Searches in the subdirectories of a given directory.

    - `-n`: It displays the line number where the search word now.

    - `-c`: The specified index indicates the number of times the word you are looking
    for.

    - `-l`: Where appropriate template column lists file names.


    Let''s make a simple example. For example, in `/etc/passwd` file, to list the
    lines includes zeynep, we can use either `grep /etc/passwd` or `cat /etc/passwd
    | grep zeynep` commands.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-30.png](Images/image00304.jpeg)


    Now Let''s try `cat LIST |grep -ni ali` command. With this command: in `LISTC`
    file, upper / lower case without distinction, (-I) in ali expression lines, line
    number (n), we have also shown together.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-31.png](Images/image00305.jpeg)


    Another example let us examine `grep -ri veli zeyno` command. With this command,
    the zeyno directory as recursive (ie, including subdirectories), upper /lowercase
    distinction without parents’ expression of the files, we ment list lines that
    have veli expression. (because zeyno directory in the same directory, I used zeyno
    instead of `/zeyno`)


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-32.png](Images/image00306.jpeg)


    The following example, `grep -c Ali zeyno /LIST` command, the `LIST` file under
    the zeyno directory, we want to learn how many times Ali stated (with `-c` parameter)


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-33.png](Images/image00307.jpeg)


    The last example that we have, the following example, I did not put all the image
    of the screen


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-34.png](Images/image00308.jpeg)


    ### cut


    In the file we want to examine, to see some lines, we use `cut` command. For example,
    to list 1st and 7th field, `cut -d -f 1,7 /etc/passwd | head -n 5`


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-35.png](Images/image00309.jpeg)


    Here, we specified that we wanted to see the separation of fields with `-d`, pipe
    operator `|` we can use. For example, with `cat / passwd | cut -d -f 1,7`, you
    can get the same result.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-36.png](Images/image00310.jpeg)


    Because the command output is long, I did not put all the image of the screen,
    at the beginning or at the end, you want to list some of rows, you can still use
    `head` and `tail` command.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-37.png](Images/image00311.jpeg)


    ### tr


    Earlier, we mentioned briefly about the `tr` command, let''s make a few examples
    about it. With this command, we can make some changes about the character of the
    files. These procuders are for change in lowercase letters or do the opposite
    and delete characters. For example, the `LIST` text file, to translate lowercase
    letters to uppercase, `cat LIST | tr a-z A-Z` can be used command.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-38.png](Images/image00312.jpeg)


    We talked about routing the operator `>` and `>>`. Other than that, we also have
    a `<` operator. These operators, unlike the others, take the file as entry. So,
    taking the contents of the file, enabling the inactivity associated with it. Now,
    let''s use with `tr` command `>` and `<` operators together. For example, Let''s
    use the command `tr a-z A-Z <LIST> NEW_LISTA`.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-39.png](Images/image00313.jpeg)


    With our command, we got `LIST` file as input, created `NEW_LISTA` file by lowercase
    letters in uppercase in the text and we write in the file. If we use the `tr`
    command with `d`, the specified character will be ignored. For example, when we
    use `cat LISTA | tr -d A, e` command, `A` and `e` characters in `LISTA` file will
    be ignored.


    ### cmp


    One of the commands that we can use to make comparisons between files is `cmp`
    command. For example, I use `cmp hacker test` command to compare two files called
    hacker and test. In result, it will display the difference in files, the line
    of first difference occured, and as byte number.


    ![Açıklama: C:\Users\Mustafa\Desktop\ÇALIŞMA\LKS MATERYAL\5-DOSYA İŞLEMLERİ\Görsel-40.png](Images/image00314.jpeg)

