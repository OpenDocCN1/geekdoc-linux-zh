    **注意**：`stdin`（标准输入）是一个输入流，数据被发送到程序并由程序读取。这将在稍后进行详细讨论。


    ## If Elif Else


    我们有时也会面临一系列条件，这些条件可能会通向不同的路径。


    看这里：


    在这个例子中，情况可能是这样的：


    你 18 岁或以上，所以你可以去派对；如果你没有，但有监护人的许可，你可以去，但必须在午夜前回来。否则，你就不能参加派对。


