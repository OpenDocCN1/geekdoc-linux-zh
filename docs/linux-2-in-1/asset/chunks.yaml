    # Chapter 4 Linux Command Lines


    At this juncture, you should have a fair understanding of basic commands, and
    Linux should be installed in your system. You now have an incredible opportunity
    ahead of you – a completely blank slate where you can begin to design an operating
    system. With Lunix, you can easily customize your operating system so that is
    does exactly what you would like for it to do. To get started, you need to install
    a selection of reliable and functional applications.


    For ease of explanation, it is assumed that you are using Ubuntu. When you are
    looking to install an application in Linux, the process is quite different than
    what you would encounter in Windows. With Windows, you normally need to download
    an installation package sourced at a website, and then you can install the application.


    With Linux, this process is not necessary as most of the applications are stored
    in the distribution’s repositories. To find these applications, follow these steps.


    Go to System -> Administration -> Synaptic Package Manager


    When you get to this point, you need to search for the package that you require.
    In this example, the package shall be called comp. Next, you should install the
    package using a command line as follows: -


