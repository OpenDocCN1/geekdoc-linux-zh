    we could show how to run commands on a file or a directory from outside the directory
    they are contained in.


    Line 8: the directory called testdir was renamed to frieda. We used a relative
    path to the source and an absolute path to the destination.


    ## Removing files   


    Like we saw with rmdir, when you remove a file, you cannot undo it, so take care
    with what you are doing. The command for removing or deleting files is rm, which
    means remove.


    rm [options] <file>


    ls


    backups example1 foo3 frieda


    rm example1


    ls


    backups foo3 frieda


    ## Removing directories that aren’t empty


    The command rm can also be altered by several different options. Again, check
    out the rm man page to see what can be done, but one of the most useful options
    is -r. Like cp, it means recursive, and we use it with rm to remove specified
    directories and everything that’s contained inside them.


    ls


    backups foo3 frieda


    rmdir backups


    rmdir: failed to remove ''backups'': Directory not empty


    rm backups


    rm: cannot remove ''backups'': Is a directory


    rm -r backups


    ls


    foo3 frieda


    Another option you can use with r is i, which means interactive. This will check
    with you before any file or directory is removed and provide you with an option
    to change your mind and cancel out the command.


    ## One last note


    I have already said this a few times, and I will keep on saying it: when we refer,
    on the command line, to files or directories, they are paths. They may be absolute
    paths or relative paths, and this is going to be the case pretty much all the
    time. I won’t remind you of this again, and the examples I use will not show this,
    so please remember it. Don’t forget to experiment with relative and absolute paths
    in the commands that we use, as each will provide a different output.


    Summary


    This is some of what you learned in this section:


    *   Mkdir: stands for Make Directory and allows us to create new directories


    *   Rmdir: stands for Remove Directory and allows us to delete directories


    *   Touch: allows us to create blank files


    *   Cp: stands for Copy and allows us to copy directors or files


    *   Mv: stands for Move and allows us to move or rename files or directories


    *   Rm: stands for Remove and allows us to delete files 


    *   There is no option to undo anything you do, so delete and move files and directories
    with care.


    *   Command line options: there are plenty of them, so use the man pages of each
    command to familiarize yourself with what there is and what you can do


    ## Practical work   


    You now have several different commands that will let you interact with your system,
    so let’s practice with them. Try the following:


    *   Create a brand-new directory within your home directory (this will allow you
    to experiment).


    *   Inside the directory create some files and some directories and create more
    files and directories inside of each of those.


    *   Now give some of them new names.


    *   Go to the home directory and copy one file from a subdirectory into the first
    directory that you created.


    *   Move the file to another directory.


    *   Rename a few more files.


    *   Move one file and rename it at the same time.


    *   Lastly, look at the directories that are already in the home directory. Most
    likely you have Downloads, Documents, Images, and Music. Have a think about other
    directories that can help you to keep things organized and start to set them up.


