  md: '# ALEXANDER VOROBYEV


    # ARTHUR RACKHAM (1867-1939): A Bargain with the Devil


    ![](img/b8a900b8373e949117f531b00685f281_119_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_119_1.png)


    I think in terms of the construction of a dream, or of worshipping paper. A painter''s
    thinking needs to be cosmic. Because of the intense inwardness of my vision, and
    the purity and power of my reactions to the world around me, I aspire to break
    through in the way that Dalí, Kandinskiy and Klee managed to break through in
    the twentieth century.


    I think that my works of art combine, in an organic whole, two lines of development,
    surrealism and abstractionism. Perhaps there are too many symbols in my works
    – crosses, spirals, springs, spheres or quite real snails and flies, human bodies
    and severed limbs are all part of a medieval mysticism worshipped by me. But this
    expresses the force of my imagination and the concentration of my dreams.


    A lot of my works have titles such as ''Construction of a Dream''. I was stunned
    by the words of a famous French poet Arthur Rimbaud: ''irregularity of thought
    is sacred''. When I work, I feel like I am having an adventure and I want to plunge
    the viewer in the cosmic slumato, adding new horizons to my imagination and to
    the viewer''s. Our imagination is the authentic realism. Sometimes an old posted
    envelope could mean more to me than a picture, and if it is a burning postal stamp,
    it is even more exciting. That is what I call worshipping paper. For many years,
    I, like a pagan, have


    been worshipping paper. I feel excited because of the paper''s different types
    and textures, while the transparency of watercolours allows me to effortlessly
    levitate in my dreams and waking hours.


    When I first saw Arthur Rackham''s fantastic illustrations they took my breath
    away because of their fine lines, fantasy, grotesque and mysticism. Arthur Rackham
    and William Blake have definitely influenced my art. Like Blake, I see the sky
    in a flower-cup.'
