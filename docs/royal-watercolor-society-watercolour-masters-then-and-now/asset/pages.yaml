  md: '# JUNE BERRY


    ARTHUR MELVILLE (1858-1904): Arabs Returning from Burning a Village


    I was instantly drawn to Arthnr Melville’s painting by its rich, intense colour.
    Studying it more closely, it wasn’t just the colour but the very loose style of
    painting and those characteristically blobby patches either of white or some strong
    dark colour that excited me. Some areas appear sponged out to the same degree
    that others are saturated with powerful colour – a technique described by a contemporary
    critic as ‘blotowsque and stamy’ and as composed of “dabs, blurs and splashes
    of paint” by the art critic of the *Daily Chronicle*. To my eye the painting has
    a very modern appearance compared with works by the group of painters Melville
    was associated with   the Glasgow Boys.


    After studying in Paris and travelling and painting in the Middle East for a couple
    of years, Melville returned to Scotland and soon after moved to London. Here he
    began to develop what became his late watercolour technique.


    ![](img/b8a900b8373e949117f531b00685f281_20_0.png)


    My paintings in response to *Arabs Returning from Burning a Village* are obviously
    not concerned with the subject matter, but with following Melville’s technique,
    working on very wet paper, using various stages of drying to add further layers
    of colour, sponging out unnecessary detail and using these sponged-out areas tonally
    as part of the composition.


    It has always been my way of working to paint in the studio from memory, using
    drawings made on the spot and photographic reference to make more or less invented
    compositions, so I was interested to learn that Melville accumulated a huge store
    of sketches and drawings on his travels in Egypt and Turkey which he continued
    to use as reference for finished paintings created in the studio almost until
    his early death twenty years later. Some paintings were worked up accurately from
    sketches and others were semi-imaginary from memory.


    He worked on saturated paper, sometimes on the floor with pools of colour and
    vigorous brush marks, sponging out superfluous detail. Sometimes he flooded the
    background in with umba to establish the tone and when it was almost dry, added
    full bright patches of colour. He invented a unique method of preparing his paper
    by saturating it over and over again with Chinese white, finally rinsing it to
    leave a specially prepared surface. When I tried this procedure I found it made
    sponging out very easy, leaving a brilliant white, but the preparation was a tedious
    process.


    Melville was interested, as I am, in the ideas of the symbolists, particularly
    Whistler, and their doctrine, as defined by Gauguin, that drama and memory are
    ultimately more important than observation of the ‘real’ world as practised by
    the Impressionists.


    Returning to Melville’s technique, someone said to me ‘what you’re talking about
    sounds really simple’, but as anyone who has tried it will know, it is a great
    challenge to control big brushfuls of colour dropped onto soaking wet paper, and
    it can be such a pleasurable achievement when it works out well.'
