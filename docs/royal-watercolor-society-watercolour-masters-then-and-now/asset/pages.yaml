  md: '# LESLIE WORTH


    # EDWARD DUNCAN (1873-1965): The Approaching Wreck


    This painting, Duncan’s diploma work, was painted in 1857, when the artist was
    of mature middle age. A tour de force, it bears all the evidence of an experienced
    painter – familiar with the subject and at home with the vagaries of the watercolour
    technique.


    ![](img/b8a900b8373e949117f531b00685f281_105_0.png)


    Obviously it is not a factual representation, but a work of great imaginative
    power, nourished by the several coastal trips that Duncan made during his early
    and middle years. My father was a sailor, and I spent most of my childhood within
    three miles of the sea in Devonshire. I confess I am no sailor myself, content
    to watch the awesome might of the water from the safety of the shore, but fascinated
    and not a little horrified by the forces and the restless energy unleashed before
    me.


    It is therefore not too surprising that I was drawn to Duncan’s work by its sheer,
    raw energy. In an age when the natural world is remotely and antiseptically transmogrified
    for us, and is then fed in digestible slices through the media, such an emotional
    display seems almost indecent, and out of kilter with current practice.


    Nothing about this painting is ‘arty’ or contrived. The elements are violent,
    but there is no gratuitous display or indulgence. In some curious way the painting
    as such is very cool and restrained. Such is the realism, however, that one can
    hear the surge of the breakers, and the rattle of the pebbles as the water is
    sucked back.


    The viewpoint is extraordinary, for it is as though we are in the middle of the
    sea, looking back towards the helpless watchers on the shore, impotent and powerless
    to avert the impending tragedy. Painted, perhaps on a lightly tinted paper, with
    a pale grey tone, the palette is limited.


    With respect I offer my own imperfect tribute, with no attempt to copy the original.
    My picture is simply a respectful acknowledgement of Duncan’s genius.'
