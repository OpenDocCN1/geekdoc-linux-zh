    # FRANCIS OLIVER FINCH (1802 1862)


    AOWS 1822, OWS 1827


    Finch was born in London; after the death of his father, a merchant, he was brought
    up with his grandmother at Stone near Aylesbury in Buckinghamshire. He received
    little formal education but read deeply and, for instance, learned Paradise Lost
    by heart; he himself later wrote poetry. At twelve Finch was articled to John
    Varley for five years. A tour of Scotland revealed to him the possibilities of
    landscape painting. Influenced by the spiritual searchings of William Blake, Finch
    formed together with Samuel Palmer, George Richmond and Edward Calvert a romantic
    brotherhood of young artists, ''The Ancients''. They made expeditions into the
    countryside: At the end of long summer days, when the moon was new or at the full,
    these young adventurers would sadly forth on foot, sketchbook in hand, sandwiches
    in pocket ..., in quest of effects, and for the purpose of asking nature questions,
    and jotting down here replies when the day-light dawned and the memory was yet
    fresh.'' Finch was elected to the Society of Painters in Water-Colours at nineteen,
    its youngest ever member. He was musical, deeply religious as Swedenborgian, ''serious
    and refined''. His work is imbued with an autumnal melancholy reminiscent of Keats,
    whom he loved; Palmer called him the last representative of the old, Claudean,
    school of painting. Ruins of an Ancient City (page 36) was given to the Society
    in 1865 and was one of the first ever pictures in its collection.


    # SIR WILLIAM RUSSELL FLINT RA (1880 1969)


    ARWS 1914, RWS 1917


    Flint was born in Edinburgh; his father was a graphic designer and watercolour
    artist, his mother one of Scotland''s first female civil servants. At fourteen
    he began a six-year apprenticeship as a lithographic draughtsman with a printing
    firm. In 1900 Flint moved to London in order to study art; to finance his studies
    he worked part time as a medical illustrator, making pictures of bullet wounds
    from the Boer War, and of leprosy and eye diseases. Subsequently he worked for
    the Illustrated London News and as a freelance illustrator. During World War I,
    and despite ''a completely non-mathematical brain'', he became an inspector of
    airships. When Flint first stood for election to the RWS he overheard someone
    calling him a ''dangerous revolutionary'' and he was elected only on his seventh
    attempt. Influenced by among others, Arthur Melville, Flint was technically a
    major watercolour artist. However, he is best known for his erotic but highly
    lucrative - nudes, which have been described as ''somewhere between the art of
    striptease and the art of painting and drawing''. Knighted in 1947, Flint served
    as President of the RWS between 1936 and 1956.


    # ALFRED DOWNING FRIPP (1822-1895)


    ARWS 1844 RWS 1846


    Fripp was born in Bristol, the sixth child of a clergyman and a grandson of Nicholas
    Pocock, one of the founders of the Society. His brother George Arthur Fripp (1813-1896)
    was also a member. After studying at the British Museum and the Royal Academy
    Schools he travelled in Ireland and then lived in Italy from 1850 to 1859. As
    can be seen in San Rocco, Olevano (page 34): (Olevano Romano is a small hill town
    twenty miles east of Rome). Fripp''s


    work combines rather sentimental groups of figures and in the harsh luminosity
    of sunlight great subtlety of tone. From 1870 until his death Fripp served as
    Secretary of the Society. He was very supportive of the President, Sir John Gilbert,
    and shared his conservative instincts. In the annual elections of 1893 five other
    candidates, including his brother, stood against him but, during a period of bitter
    in-fighting within the Society, he invariably outmanoeuvred everyone. He returned
    to Rome in 1893 but complained that it was full of Americans. Fripp died at his
    home in Hampstead on an influenza epidemic in March 1895; both his wife and youngest
    son also died within days.


    # CHRISTA GAA (1937 1992)


    ARWS 1986, RWS 1989


    Gaa was born in Hamburg in Germany. Her father served as a general in the German
    Army on the Russian front. In her youth she was a junior tennis champion. She
    read German philosophy and art history at the Universities of Cologne, Florence
    and Bonn and later studied painting at the Fachhochschule für Kunst und Design
    in Cologne. In 1980 she moved to England where her work found greater appreciation.
    She painted both landscape and still life: ''I become particularly fond of certain
    groups of objects, and paint them over and over. You see Morandi doing this too,
    and you find that the relationship between the objects becomes the interesting
    thing.'' A typical work by Gaa was an arrangement of domestic objects. Bernard
    Dunstan wrote of her that ''the table top contained the essence of the world that
    her painter''s eye needed.'' Gaa first met Ken Howard when she was studying in
    Florence during the Easter of 1959. He proposed to her a fortnight later but her
    parents refused to let them wed. They met again in London in 1980 and married
    ten years later.


    # CHARLES ISAAC GINNER ARA (1878 1952)


    ARWS 1938, RWS 1945


    Ginner was born in Cannes, the son of a pharmacist from Sussex. On leaving school
    at sixteen after illness he sailed the Mediterranean and South Atlantic on a tramp-steamer.
    Between 1899 and 1904 he worked in an architect''s office in Paris and enrolled
    at the Académie Vitti. After exhibiting in Buenos Aires he moved to London in
    1909 and took a studio in Chelsea. Ginner was a founder member of the Camden Town
    Group in 1911, for which he wrote a manifesto, asserting the neo-realism of the
    modern age and ''all it contains of great or weak, of beautiful or of sordid''.
    He subsequently joined both the London Group and the Camberland Market Group.
    His innate sense of rhythm and design found expression in the urban landscapes
    to which he was particularly drawn. They were planned with the use of a hand-held
    viewfinder and turned into his typically tight, intricate and deeply coloured
    pictures in his studio. Ginner was an official war artist in both world wars,
    but became increasingly reclusive after the death of his close colleagues, the
    artists Spencer Gore and Harold Gilman who caught influenza after tending Ginner
    and after seeing the woman he loved marry another man. He was awarded a CBE in
    1930.


    # ALBERT GOODWIN (1845 1932)


    ARWS 1871, RWS 1881


    Goodwin was born in Maidstone in Kent, the son of builder. He was briefly apprenticed
    to a draper but while still ''a small weedy-looking boy'' he was'
