  md: '# DAVID FIRMSTONE


    EDWARD DUNCAN (1873-1965): *The Approaching Wreck*


    In Duncan’s small, powerful painting a magnificent storm is taking place. You
    can hear the huge force of the waves crashing in on the shore, see the people
    struggle with its force. The breakwater is finally set loose, agitating the screaming
    seagulls as the ship struggles vulnerably against the ever turbulent sea. It’s
    a fantastic painting and as I look closely at it and scrutinise Duncan’s marks
    I’m left wondering ‘how did he do this?’


    ![](img/b8a900b8373e949117f531b00685f281_107_0.png)


    In my painting the sky and beach are cleansed of the storm’s debris, and the breakwaters
    have long ago been washed away. We can smell the fresh morning air, hear the birds
    sing, but the movement is of a different kind. The power is no longer with the
    sea but with the birds’ delicate dancing flight on a light, warm breeze over the
    vapour trails of aircraft, reflected in the still, calm waters below.


    Technique is critical to my aesthetic. I constantly search for new ways to make
    watercolours and some are the result of pouring paint and allowing it to run across
    the surface, as I turn and tilt the paper, so I’m ‘drawing with the pour’. I love
    the illusion of movement that the mark of water gives.


    I’m not just interested in representation, in fact I’m always disappointed when
    only that takes place and I plunge the painting into the bath, or throw paint
    over it, spoil it, so I have to struggle with it all over again. And I can never
    quite remember my previous approach, so each painting is an act of learning to
    paint again.'
