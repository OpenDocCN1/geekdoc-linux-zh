  md: '# DIANA ARMFIELD


    # ALBERT GOODWIN (1845-1932): Glastonbury


    There are masters of watercolour whose methods defy easy analysis: one cannot
    quite make out how the result has been achieved. Albert Goodwin is such a one.
    How did he attain those strange shadowy areas, those difficult to define colours?
    His textures suggest a secret life going on underneath, layers of soil under the
    surface of the sloping field he depicts in Glastonbury.


    ![](img/b8a900b8373e949117f531b00685f281_123_0.png)


    He must have brought this about in unhurried stages: the surface is never dull
    with overloading. That must have meant that he allowed time for drying before
    retouching. It looks as if he washed a thin opaque layer over areas more than
    once, and then reinvigorated the surface with ink drawing. He has clearly learnt
    from Turner, another magician.


    We can take courage from these wonderful works. If our first touches have gone
    wrong, there is still much we can do: fresh, direct watercolour is not the only
    way to resolve a work, rewarding though that can be. We can experiment with sponging,
    scraping, bodycolour, ink and anything else that we think might help us to achieve
    our vision.'
