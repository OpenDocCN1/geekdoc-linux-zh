  md: '# KEN HOWARD


    # *SIR WILLIAM RUSSELL FLINT (1880–1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard*


    ![](img/b8a900b8373e949117f531b00685f281_149_0.png)


    Sir William Russell Flint’s *Incoming Tide, No. 1 Slip, Devonport Dockyard* has
    many points of resonance for me. Firstly the subject, which is industrial, clearly
    illustrates the beauty which can be found in such situations; I myself started
    by painting industrial landscapes in North London. The railway sidings of Neasden
    and Cricklewood gave me the opportunity to reveal the beauty to be found in everyday
    subjects. I am quite sure the non-painter, on entering Flint’s Dockyard, would


    not naturally recognize its beauty without having seen this brilliant watercolour.
    When I first went to India it was not the exotic architecture and people that
    inspired me, but the dirty railway sidings, the working locomotive’s, the steam
    and the smoke.


    On that trip I learnt that in painting and drawing it is the particular observation
    that matters. On seeing one of my watercolours, the head of the Indian Railways
    informed me that the train in my painting had just had its boiler cleaned. When
    asked how he knew he said it was only when fired up after such a clean that the
    smoke appeared as it did in my watercolour. This gave me a great thrill for I
    had painted a particular truth, not a generalization.


    Speed is of the essence with watercolour and I love to feel that a work has been
    done at a hundred miles an hour. This gives it vitality and excitement, and of
    course with industrial subjects there is always the threat that the train will
    leave or a boat will suddenly arrive in the shed.


    ![](img/b8a900b8373e949117f531b00685f281_149_1.png)


    Being a tonal painter, this Russell Flint touches me because of the expression
    of light through tonal contrast. There is no bright colour – only rich earth colour,
    which has always appealed to me. His use of umbers, siennas and ochres are in
    the tradition of early watercolourists such as my favourite, John Sell Cotman,
    on whom I wrote my dissertation at the Royal College of Art.'
