  md: '# RICHARD BAWDEN


    THOMAS BARCLAY HENNELL (1903–1945): *Reykjavik Harbour*


    Tom Hennell is an artist after my own heart. He drew beautifully and directly
    from what he saw: barns, trees, horses and craftsmen at work; it is a poet’s eye.
    *Reykjavik Harbour* is one of several paintings he produced as an official war
    artist in Iceland. Probably drawn at speed under changeable weather conditions,
    there are spots where the rain has washed the colour away. One needs to feel,
    as he might have done, the immediacy of the changing situation; but it is also
    a record of the war.


    ![](img/b8a900b8373e949117f531b00685f281_79_0.png)


    As an artist of the 1930s and1940s Hennell was part of a period of change. But
    he was never an abstract artist, nor did he abstract from life. I sense that he
    was, perhaps unconsciously, influenced by his friend Eric Ravilious, a supreme
    designer. There is a tension from working on the spot, accepting and discriminating
    from the scene before you. He had a unique


    vision, preferring to work, here or there, wherever he could immerse himself in
    the presence of the place, allowing himself to be taken where it willed and letting
    it speak for itself. As in this painting, he would sensitively understand something
    large and clumsy, such as the minesweeper in the middle distance, or introduce
    a fleeting person and his dog'
