- pgno: 126
  md: 'As he put it in his diary (17 March 1912): ‘... [I] hammered at them with the
    blade of a safety razor, a knife, sandpaper, sponge, rag and a fitch brush!! So
    many are the expedients that the despairing watercolour painter in the last has
    to resort to.’


    Aah, I sense a man after my own heart! How often I hear words of frustration expressed
    about this form of art, but then at its best it is exhilarating and exciting -
    an uncertain roller-coaster ride is inherent in this very British medium.


    Watercolour at its very best can capture an immediacy, a feeling or mood, a sense
    of a place and a moment in time as no other medium can; something Goodwin so clearly


    manages to achieve. I wanted the same responses he attained from my picture of
    Dusk, The Highlands.


    Unlike Goodwin, I painted my picture with just watercolour and a little bodycolour
    (opaque white). The cleanest air in the British Isles, as I was informed, gave
    a clarity of colour that inspired me. Layers of colour could be built up, while
    at the same time I attempted to make it a simple, direct, uncomplicated and of
    the moment picture.


    In this most magical place, with its ever-changing and fast-moving skies over
    a wonderfully raw Scottish landscape, I felt that, if there is a God. He is here.


    ![](img/b8a900b8373e949117f531b00685f281_126_0.png)


