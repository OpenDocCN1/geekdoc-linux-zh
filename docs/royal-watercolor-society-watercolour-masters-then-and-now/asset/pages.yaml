  md: '# TOM GAMBLE


    # SIR WILLIAM RUSSELL FLINT (1880-1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard


    As a mainly urban painter anchored principally in the 1930s and as a ‘street walker’,
    I collect my building materials from the visual events that I encounter and place
    them at random, as the mood dictates, across the pages of a large sketchbook.
    Although outside drawing and note-taking are essential to my work, in the end
    I make landscape rather than draw and paint it. Literal paintings of a city are
    much less important to me than what lies beneath the surface. To penetrate a world
    not normally visible to the waking, walking multitudes, I experience the sounds,
    smells, music and colours and compose visual ‘symphonic variations’ in an attempt
    to create a personal oeuvre.


    ![](img/b8a900b8373e949117f531b00685f281_145_0.png)'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Technically I work in pure watercolour, so I was instantly drawn to the superb
    painting in the same medium by Sir William Russell Flint. The subject, in a limited
    colour palette of ochres, sepias and siennas, is of a slip in Devonport Dockyard.
    This is a wonderful work that features all the debris of an industrial wasteland,
    the shapes and structures of which would provoke no interest in the average passer-by.


    Whereas Incoming Tide shows a scene just before it was destroyed by bombing, my
    painting, The Aftermath, is soon


    after destruction. It is in another place and time but, by coincidence, there
    are similarities in composition, in tone and in the limited earthy colour range
    with tiny touches of pale blue against the browns. Both paintings, associated
    with shipping, have water creeping up in the foreground and a pale view in the
    distance, and are framed with uprights of stark concrete. My buildings are a menagerie
    of warped and twisted metallic shapes and secret enclaves slowly filling with
    garbage. The paintings are linked by the silence that comes before and after a
    devastating event.


    ![](img/b8a900b8373e949117f531b00685f281_146_0.png)


    Opposite: SIR WILLIAM RUSSELL FLINT RA, Incoming Tide, No.1 Slip, Devonport Dockyard,
    watercolour over graphite, 48.7 x 66 cm (19.2 x 26 in)

    Above: TOM GAMBLE, The Aftermath, 2004, watercolour over graphite, 42 x 55 cm
    (26 x 21.8 in)'
