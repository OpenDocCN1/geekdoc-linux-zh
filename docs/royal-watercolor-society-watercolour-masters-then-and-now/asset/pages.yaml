- pgno: 34
  md: '![](img/b8a900b8373e949117f531b00685f281_34_0.png)


    The Grand Tour played an important role in this context by helping to introduce
    major changes in the works created by artists as well as architects. If the buildings
    of Andrea Palladio had a major influence on English architects, then the French
    artist Claude Lorrain certainly had a major influence on English landscape painter
    J M W Turner, whose early ambition was to emulate this French artist.


    My painting is a combination of an invented classical Italian landscape with semi-abstract
    architectural shapes so as to emphasise the link between the past and present.
    The ideas that generally govern the way I work can be best described as being
    based on the persistence of the past in the present, a combination of inner and
    outer worlds.


    Appropriate forms have to be found for what are elusive images and I find that
    collage is an ideal way to give substance to them. Formal structures require descriptive
    detail, so the images I create are a combination of geometrical or architectural
    forms with objects, whole or fragmented to provide detail.


    I also scan assembled fragments into a printer so that I can use the same images
    in a different context. The variety of compositions I then create gives me a better
    chance of giving pictorial form to my ideas which, to achieve the results I am
    seeking, sometimes require an element of ambiguity. A com- drawing is made from
    the chosen image to which I add colour. The final watercolour is based on this
    drawing using a limited palette and a heavyweight Waterford paper.'
