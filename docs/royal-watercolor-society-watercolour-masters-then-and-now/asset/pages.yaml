  md: '# SHEILA FINDLAY


    JOHN HENRY LORIMER (1856–1937): *Table by the Window with Peaches and Pears*


    > ‘What I dream of is an art of balance, purity and serenity, devoid of troubling
    or depressing subject matter … something like a good armchair which provides relaxation
    from physical fatigue.’ (Henri Matisse).


    Matisse’s ideas expressed in his 1908 essay, ‘Notes on a Painter’, wonderfully
    evoke the harmonious design and domestic pleasures that we find celebrated in
    his paintings. Matisse’s modernist aesthetic is rooted in the late-nineteenth-century
    cult of domesticity, which also informs the work of John Henry Lorimer, those
    watercolour


    ![](img/b8a900b8373e949117f531b00685f281_53_0.png)


    I have chosen to discuss.


    A contemporary of the Glasgow Boys, Lorimer attended Carolus Duran’s Atelier in
    Paris, after training under William McGillogart and G P Chalmers at the Royal
    Scottish Academy in Edinburgh. The image of the interior flooded the art and design
    journals of the day. Inspired by his experience in France and by influential Americans
    like John Singer Sargent and James Abbott McNeill Whistler, Lorimer’s genre paintings
    of the Scottish home, and intimate scenes of domestic incident, reflected an international
    trend.


    In *Table by the Window with Peaches and Pears* the charm of the scene is underpinned
    by a strong sense of design. The round table, chair, and window frame serve as
    bold compositional devices, while the simple grouping of the still life, the fruit
    and flowers, and the doves at the window, add to the decorative effect. A brother
    of the influential architect Sir Robert Lorimer, architectural elements feature
    in Lorimer’s work and spatial structures and framing devices initiate an interior/exterior
    dialogue.


    Lorimer divided his time between England and Scotland, finally deciding to settle
    in Edinburgh. Views from my studio in Edinburgh, where I spend part of each year,
    can be seen in the painting I include here. Like Lorimer, I paint my immediate'
