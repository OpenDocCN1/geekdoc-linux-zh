    to the subject the next day at the same time with paints allowed for corrections
    and alterations using bodycolour along with the watercolour. Working on several
    paintings of different subjects, one in the morning, and others at midday and
    in the evening, blessed with good weather and enough time to allow for thought,
    I groped towards a resolution. I washed out and repainted areas,


    editing the subject, trying to maintain simplicity. In the end, although I looked
    at Fripp’s painting regularly, my paintings don’t resemble his: but they wouldn’t
    have been the same without the framework of the task.


    My admiration for Fripp has grown: the deceptively simple, monumental composition
    where the church, glowing in the glaring heat, seems to be a part of the rocky
    landscape, is a sort of magical trick. I don’t know how he did it. A humbling
