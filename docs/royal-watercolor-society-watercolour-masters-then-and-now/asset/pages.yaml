  md: '# KENNETH JACK


    # THOMAS MILES RICHARDSON (1813-1890): Norham Castle, Evening


    The skill of medieval builders in erecting cathedrals and castles has intrigued
    me from my early years when I saw photographs of them in various publications.
    Living as I do in Australia, I don’t have many opportunities to see this favourite
    subject matter.


    ![](img/b8a900b8373e949117f531b00685f281_137_0.png)


    emphasized forms in space more prominently. Also, I’ve enjoyed painting meaningful
    details in contrast to Richardson, and these help give scale and bulk to the building.


    As an artist who enjoys drawing and painting architecture, I have sought out buildings
    such as Bamburgh Castle on my many visits to the British Isles. This castle is
    one of a group in Northumberland that I have drawn, and on several visits, I have
    drawn it from different positions.


    On seeing Thomas Richardson’s Norham Castle, Evening, I was impressed by his capturing
    the last light just before twilight, his feeling for both space and atmosphere,
    his simple and very effective colour scheme, his range and depth of tone, and
    his abstract placements of boats people and clouds in compositional relationships
    to the dominant castle. It is a beautiful masterpiece, small in size, but big
    in artistic statement.


    My painting of Bamburgh was made in the studio from a pencil and pastel drawing
    done on site on a grey morning in April, 2003. Several photos taken at that time
    also helped, particularly with details. It is my belief that an artist who draws
    on site will gain a greater feeling for forms in space than one who relies on
    photographs.


    Richardson’s painting was the starting point for my watercolour. Both the castles
    are in Northumberland. My view of Bamburgh does not have a river in the foreground,
    as at Norham, but a road instead. Bamburgh absolutely dominates the village and
    this I’ve slightly exaggerated by making the hill, on which it is built, higher
    this better gives the feeling one has when actually in the village. My painting
    is larger than Richardson’s and I have


    ![](img/b8a900b8373e949117f531b00685f281_137_1.png)


    Above, left THOMAS MILES RICHARDSON JUNIOR, Norham Castle, Evening, watercolour
    and bodycolour over graphite, 13.8 x 22.7 cm (6 x 9 in)

