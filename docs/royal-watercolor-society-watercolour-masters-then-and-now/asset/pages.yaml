  md: '# MICHAEL WHITTLESEA


    # SIR WILLIAM RUSSELL FLINT (1880-1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard


    Sir William Russell Flint has many admirers and collectors, and is well known
    to this day for his paintings of naked ladies beside Spanish wells. They are painted
    with supreme confidence and are very remarkable in many ways. They did, and still
    do, sell for large amounts of money. There is an intriguing story about this period,
    which I hope is true. It was one of these Spanish nudes that had been deposited
    by Sir William as his Diploma work at the RWS. He later asked if he could exchange
    this picture, which he could easily sell, and substitute a painting that nobody
    would buy. This painting, now safely in the Diploma Collection, is the magnificent
    Devonport Dockyard painting.


    ![](img/b8a900b8373e949117f531b00685f281_151_0.png)


    The Spanish Civil War must have curtailed Sir William''s travel plans, and then
    with the onset of World War II, he became an official War Artist. It is one of
    the works produced during this period that I so admire: I think it''s wonderful.
    It is a very well constructed picture, planned and drawn in pencil first. The
    huge timbers supporting the roof are drawn with care, the perspective is correct.
    There is no doubt about the solid construction. This dockyard certainly housed
    tall sailing ships in the past.


    is there. It required broad brushstrokes, layered so carefully. Not much ''wet
    in wet'' here; nothing is left to chance. The watercolour never becomes ''muddy''.
    In the middle distance, the slipway and the machinery are painted, again with
    economy and acute observation. Sir Russell used a little ''scratching out''. The
    pigment on the right shows signs of light scratching out, and it is done with
    great sensitivity.


    Sir William left nothing to chance. Once he applied the watercolour, which he
    did with economy, the important detail


    For many years I lived in a Thames-side village, and Peter Freebody''s boatyard
    was the subject of many of my drawings and paintings. I must have had Sir William''s
    dockyard in mind whenever I visited that boatyard in Hurley.'
