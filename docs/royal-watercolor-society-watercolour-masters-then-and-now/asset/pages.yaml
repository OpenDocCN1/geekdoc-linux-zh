  md: '# RICHARD SORRELL


    # ALAN SORRELL (1904–1974): *The Resurrection*


    My father painted this picture, the only neo-romantic work in the RWS Diploma
    Collection, more than ten years before my birth. It is an image of great power
    and restless energy. Its strength comes from the incisiveness of the drawing and
    from a real understanding of clear black-and-white contrast and silhouette. These
    qualities of dramatic lighting and turbulent rhythms were carried through to my
    father''s later work, his reconstruction drawings of ancient sites. In these drawings
    of Roman Britain and medieval castles, which were based on rigorous archaeological
    evidence, he would create scenes of life from the distant past that were so convincing
    that he became a legend in the archaeological world. These later drawings are
    of course great feats of the imagination, and, in the same way as this religious
    subject, *The Resurrection*, is too.


    ![](img/b8a900b8373e949117f531b00685f281_115_0.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/b8a900b8373e949117f531b00685f281_116_0.png)


    My father’s work was a very great formative presence in my early career. In my
    picture *Three Trees* I have responded to his painting through colour rather than
    powerful tonal contrast and in my painting *the* narrative focus is outside the
    picture rather than within it. I have used a cooler colour range than usual in
    this painting, basing it on a yellow/purple axis. *The Resurrection* is a centrifugal
    composition centred on the *Tomb:* *Three Trees* (symbolically the Crucifixion)
    is a flowing composition with a gentler left-right movement suggestive of wonder
    and


    questioning. Although both pictures have a reference to biblical stories, we are
    not a religious family.


    I have come to realise that the main difference between my father and myself is
    one of temperament. He was essentially a pessimist – I think he believed that
    he was living in a time of relentless decline, like the last years of the Roman
    Empire. I am an optimist, and I think of humanity as being still in its period
    of infancy.'
