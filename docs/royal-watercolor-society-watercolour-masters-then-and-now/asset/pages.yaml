  md: '# DAVID PASKETT


    # LIONAL BULMER (1919-1991): Greengrocer''s Shop


    I share Lionel Bulmer''s interest in urban street paraphernalia as a subject for
    painting. Also, his choice of a strongly designed flat pattern set in shallow
    perspective like a stage set. In this study I enjoy his use of varied qualities
    of marks and contrasting tones set within the subdivisions of the composition.
    The artist has positioned himself so that the row of personable cauliflowers is
    at eye level, supported by six boxes of vegetables, each with its own identity.


    ![](img/b8a900b8373e949117f531b00685f281_71_0.png)


    Then, by way of relief from the hard-edged rectilinear frames of shop windows
    and doorways, a watching figure appears, bringing in human interest and soft curves.


    I often use the boxed and flat-packed backdrops of street-level architecture to
    frame and pinpoint the shapes of figures and objects. Shops, work spaces, stores,
    museums and eating places provide a framework for my pictorial organization.


    ![](img/b8a900b8373e949117f531b00685f281_71_1.png)


    I was sharing a tranquil moment at the next table to this Chinese gentleman in
    a Suzhou teahouse. Engrossed in his newspaper, he became part of the chance still
    life created by the thermos, glasses of tea and ashtray. As in Bulmer''s painting,
    the grid created by surrounding fixtures and fittings contains different scales
    and qualities of activity, from the fine strokes of the calligraphy and flowers
    to the criss-crossing of the cane chairs. As well as the obvious red of the thermos
    in the centre, I found purples, pinks and blues in the reflections of the dark
    wood panels and pillars. ''Vermeerish'' light streams in from the top corner and
    a ''Chardin-esque'' peace descends on the reading figure at the table.'
