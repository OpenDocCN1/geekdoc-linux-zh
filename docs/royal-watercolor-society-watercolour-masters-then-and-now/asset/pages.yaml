  md: 'CLAIRE DALBY


    WILLIAM HENRY HUNT (1790~1864): Jug with Rose and Other Flowers and Chaffinch
    Nest


    The only time I ever found a bird’s nest right by my feet for the taking was some
    years ago in a Scottish city car park, many yards from any tree. Naturally I picked
    it up. However, after admiring its construction, instead of filling it with pebbles
    or chocolate eggs (it was, unsurprisingly, empty) and painting it, I gave it to
    a friend.


    ![](img/b8a900b8373e949117f531b00685f281_25_0.png)


    > William Henry Hunt was renowned for his remarkably detailed still lifes featuring
    birds’ nests. In this painting light gently filters down from the left; no harsh
    highlights or shadows detract from the colours and textures.


    The nest particularly attracted me. It is tilted to show the contrast between
    the silky hairs of the lining and the soft, mossy fuzziness of the exterior. It
    is ornamented with scraps of lichen, which shares its subtle colour with the eggs
    within, and also with the jug and the shadows of the white flowers. Just enough
    detail is actually delineated: the eye and mind fill in the undefined areas with
    moss and down.


    printed on a favourite old Indian cloth which replaces Hunt’s informal soil surface.
    Daylight comes from a north window:


    My first interest was in the contrast between the individuality of the grapes
    and the geometrical regularity of the bowl, between the translucency and muted,
    bloomy shine of the fruits and the hard brightness of the china.


    My still life was painted in late winter, and I decided to concentrate on the
    idea of the nest as a container. My ‘nest’ is a man-made bowl and instead of mosses,
    it has a strand of plant motifs ‘woven’ around it. The rather abundant ‘eggs’
    are supplied by bunches of grapes and the ‘flowers’ are


    My other main interest was in all the colours of the ‘green grapes (from pinkish
    and bluishish highlights to some near-red shadows). To explore their variety,
    I chose a high viewpoint (rather than tilting the ‘nest’) and kept the cloth and
    background subdued.


    Above: WILLIAM HENRY HUNT, Jug with Rose and Other Flowers and Chaffinch Nest,
    watercolour and bodycolour, 23.2 × 28.4 cm (9.2 × 11.3 in)


    Opposite: CLAIRE DALBY, Seedless Grapes, 1988, watercolour and bodycolour on tinted
    paper, 24 × 23 cm (9.5 × 9.1 in)'
