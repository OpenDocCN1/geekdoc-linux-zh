  md: '# **CATHERINE DUCKER**


    WILLIAM HENRY HUNT (1790–1864): *Jug with Rose and Other Flowers and Chaffinch
    Nest*


    ![](img/b8a900b8373e949117f531b00685f281_27_0.png)


    This image by Hunt immediately strikes me as created by someone who loves nature;
    even though it was painted in a studio, the nest and flowers are set against a
    natural background. This is unusual and is an element I like. The artist has chosen
    a subject in which I am very interested: the fragility of nature and the beauty
    of nature as a provider.


    Nature provides both life with the egg, and beauty with the flowers. The artist
    portrays beautifully a selection of garden flowers, which have an element of wildness
    in them, with one rose outside the vase. As with the flowers, in the bird’s nest
    one egg is broken and one egg lies outside the nest.


    The painting is beautifully sensitive in its chosen objects and composition. Although
    my own work appears more minimal, the colours chosen and marks I use have the
    same meaning to me: they are essential to represent my love of the land and the
    connection I have with elements of the landscape. Hunt’s painting is clear and
    uncluttered. It is a busy subject, and yet your eye can see the simplicity of
    the overall concept.


    My paintings are a spontaneous response to experiences I have in the landscape.
    Moments of excitement, moments of bonding with nature, abstract colours from an
    experience made from working quietly undisturbed in my studio.


    Recent works have been inspired by travels to Africa where I encountered magical
    people who work with the sea. Other paintings have come from a winter of riding
    at home and connecting with the land through horses.


    Currently I grow lots of organic food to sell. Being around the soil daily and
    the growth of very beautiful plants which nourish us, and give us the fuel to
    live, inspires me and it comes out through my painting in an uncontrolled manner.


    I have always grown lots of flowers and occasionally these pop up in my art; they
    give us so much pleasure in the house with their scent and unassuming presence
    that I want to paint their beauty when the moment takes me.


    I only paint when I feel happy. That doesn’t mean that by the end of the painting
    I’m still happy, nor do I want to paint every day. I go through lots of emotions,
    but it is essential that I feel connected to what I’m doing. I feel I have a lifetime
    of painting ahead and this is just the start of the journey.


    ![](img/b8a900b8373e949117f531b00685f281_27_1.png)'
