  md: '# CHARLOTTE HALLIDAY


    JAMES DUFFIELD HARDING (1797–1863): Verona


    When I was twenty-one my parents took me to Italy, where they had first met. It
    was a sort of ‘introductory offer’. I did a lot of small sketches, freely and
    unselfconsciously. But later I became a nervous traveller and grew particularly
    claustrophobic about flying. I spent many years ‘grounded’ in England, until there
    came an opportunity to go with friends to the Mediterranean again, and I decided
    I must take it.


    However, as the trip drew near, acquaintances invariably said, ‘Oh, you’ll love
    it; there will be so much for you to paint!’ And I began to feel quite overwhelmed
    by their expectations, inhibited, almost panicky; then I saw this drawing by James
    Duffield Harding.


    ![](img/b8a900b8373e949117f531b00685f281_85_0.png)


    ‘I could do something at least along those lines’, I thought, and my panic subsided.
    The watercolours of Croman, Girin and Turner thrill and move me deeply, but it
    is far beyond me to attempt to emulate them. Harding on the other hand, was clearly
    as passionate as I am about architectural detail – it is significant that John
    Ruskin was his pupil. He records these Veronese buildings accurately, yet the
    picture is full of grace, sunshine and, above all, fresh air.


    Harding’s use of bodycolour was apparently deplored by Turner but, in my view,
    on the toned paper it gives him, as it were, a third dimension. I find it positively
    liberating in my own work.


    My watercolour drawing of the Custom House is obviously a very different subject,
    though there is just a glimpse of the River Thames. It is one of twelve which
    I did after the views of London by Thomas Shotter Boys. It was marvellous to find


    the crane that Boys had drawn in 1841 still there, though the trees are new, but
    my picture owes more to Harding than to Boys.


    I am constantly delighted by his view of Verona and keep finding new details –
    like the almost invisible outline of a horse and cart on the right. And I am always,
    unashamedly, excited by sun on stucco.


    Above: JAMES DUFFIELD HARDING, Verona, bodycolour and graphite on buff paper;
    37 x 51 cm (14.6 x 20.1 in)


    Opposite: CHARLOTTE HALLIDAY, The Custom House E.C.3, 2003, pencil and watercolour,
    40 x 45 cm (15.7 x 17.7 in)'
