    # JAMES DUFFIELD HARDING (1797-1863)


    ARWS 1820, RWS 1821


    Harding was born in Deptford, the son of a drawing master who had been taught
    by turn Paul Sandby. Harding himself received lessons from Samuel Prout and first
    exhibited at the Royal Academy at the age of thirteen. Sketching in Greenwich
    Park on one occasion, an older artist shut a sketchbook in his face when he asked
    a question of the man; deeply hurt, he vowed that he would teach anyone who wanted
    to learn. His commitment to training art teachers interested both Sir Robert Peel
    and Dr Arnold of Rugby, but Harding''s reputation was made by his many drawing
    manuals. King Louis Philippe of France awarded him a Sevres breakfast service
    and a diamond ring for his publications. Harding believed that drawing was the
    only true foundation of art. He made great use pencil and chalk and preferred
    tinted paper. Verona was drawn after an Italian tour with Ruskin who recalled
    ''a most happy time'' and praised Harding''s ''vivid, healthy and unerring artistic
    facility,'' but said he lacked sentiment. Whereas the truculent William Evans
    of Eton called Harding ''a vain, disappointed, jealous man,'' Matthew Hale recalled
    that he was known as ''The Doctor'' because of his willingness to give advice,
    and his obituary in the Art Journal said that he was ''in the true sense of the
    word a gentleman.'' Harding died after catching a cold while sketching in Kent.


    # THOMAS BARCLAY HENNELL (1903-1945)


    ARWS 1938, RWS 1942


    Hennell, ''a tall, awkward rustic chap'' - was born at his father''s rectory at
    Ridley near Gravesham in Kent. He studied at the Polytechnic School of Art in
    Regent Street, London, and then taught at Bath and elsewhere in Somerset. Following
    the rejection of a marriage proposal, Hennell had a nervous breakdown and spent
    two years in hospital. In 1935 he returned to Kent where he illustrated and wrote
    on agricultural topics. His art, poetry and prose evoke his love of the land:
    ''all the country''s history ... is written out in the carpentry of broken carts
    and waggons, on the knots and joints of old orchard-trees, among the tattered
    ribs of old barns.'' In 1943 he was appointed an Official War Artist following
    the death of his friend Eric Ravilious. Some of the splodges in the sky of Reykavik
    Harbour (page 76) appear to have been caused by raindrops: in Iceland painting
    conditions were so hard that Hennell sometimes used his own urine to mix the


    watercolour. In 1944 he took part in the allied landings in Normandy and also
    worked in Holland, Burma and the former Dutch East Indies. In November 1945 Hennell
    disappeared in Java, where he was probably killed by Indonesian nationalists.


    # SIR HUBERT VON HERKOMER RA (1849-1914)


    ARWS 1894, RWS 1894


    Herkomer was born in Waal in Bavaria. His father''s family had been woodcarvers
    and weavers for generations. His mother was a piano teacher. In 1851 his family
    emigrated to the USA but returned to Europe in 1857 and settled in Southampton.
    Herkomer trained at the Southampton School of Art, the Munich Academy and South
    Kensington; however, life was hard and he lived from hand to mouth, working as
    a mason and playing the zither in the evenings for small sums of money. Scenes
    of hardship are the subject matter of much of Herkomer''s work. He became a successful
    magazine illustrator, however, and his work was to make a deep impression on van
    Gogh. But it was Herkomer''s 1875 painting, The Last Muster Sunday in the Royal
    Hospital Chelsea which made his reputation, and it was exhibited internationally
    for forty years. Portrait painting alone earned him over £250,000 during his career.
    This wealth enabled him to build Lululand in Hertfordshire where he also founded
    an art school. His many interests included acting, film-making and car-racing.
    In 1894 Herkomer was elected to become a member of the RWS and he presented the
    Society with its Presidential jewel and chain. In 1895 he failed - by one vote
    - to be elected President; this humiliated him and he effectively withdrew from
    the Society. In 1899 Herkomer was ennobled by the Kaiser and added ''von'' to
    his name: he was knighted in 1904.


    # ALFRED WILLIAM HUNT (1830 - 1896)


    ARWS 1862, RWS 1864


    Hunt was born in Liverpool, the son of a landscape artist. When a small boy he
    came home one day proudly announcing that the Duke of Wellington had spoken to
    him; asked about their conversation, he replied that the Duke said, ''Get out
    of my way, you little devil.'' He read classics at Corpus Christi College, Oxford,
    and was elected a fellow in 1853 but while marriage his wife, ''the wisest woman
    in London,'' was a novelist obliged him to give up his fellowship, it also freed
    him to follow his vocation as an artist. A close friend of Ruskin. Hunt followed
    his precepts of ''truth to nature'' and his Pre-Raphaelite landscapes are full
    of meticulous observation and intense colour. For the sake of his art, his daughter
    wrote, he was pursued by bulls, stung by midges and suffered wasps down the neck
    of his coat collar. I have seen my father confronted by a wall of water coming
    straight down on him. I have watched him, quick as thought, rise and leaping from
    slippery rock to slippery rock carry his wet drawing upheld breast-high to a place
    of safety.'' Burne-Jones called him ''a regular worry-mutton.'' Hunt was active
    as a progressive force within the RWS and from 1888 to 1890 served as its first-ever
    Deputy President.


