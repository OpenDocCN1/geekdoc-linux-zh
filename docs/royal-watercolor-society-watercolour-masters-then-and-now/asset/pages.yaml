  md: "# DAVID WHITAKER\n\n# ALFRED WILLIAM HUNT (1830–1896): Welsh Flood\n\nAlfred\
    \ William Hunt’s *Welsh Flood* is a real find for me. The greenish browns of the\
    \ sodden earth – compressed as it is between heavy grey clouds above and the agitated\
    \ water below – express the uncontrollable force of nature. Faint, central, and\
    \ low in the sky, the sun appears behind the heaviest clouds whilst away in the\
    \ distance to the far right, cattle are grazing. They, and the village beyond\
    \ them, go almost unnoticed in the wake of the river as it rushes from right to\
    \ left. In the foreground the turbulent water meets with some unidentifiable object,\
    \ which appears to be resisting the powerful surge. As I see it, the connection\
    \ with my own work is in the dynamics of the composition: the push and pull of\
    \ one force against another.\n\n![](img/b8a900b8373e949117f531b00685f281_29_0.png)\n\
    \nI feel this painting must have mirrored a crisis of some kind in Hunt’s life,\
    \ which makes the subject all the more poignant. I try to do something similar:\
    \ I often compose images which match my present feelings with feelings formed\
    \ from past experience. Sometimes I will create images from my imagination which\
    \ may be a forecast of things to come. At other times, I will make a transcription\
    \ of a particular work of art. If I were to make a painting from *Welsh Flood*\
    \ my colour would be tertiary, with flecks of secondaries and primaries trying\
    \ to survive as the storm stirs everything up.\n\nMy palette consists of seven\
    \ colours. I use two yellows – one cold, one warm – cadmium red, magenta, viridian\
    \ and two blues – one reddish and one greenish. With these colours I can express\
    \ endless possibilities of natural phenomena. \n\nHunt has used black in this\
    \ painting, a colour I very rarely use because it has such a depressing influence\
    \ on other colours. However, subjects form their own processes and were I to make\
    \ a similar painting in response, I might reintroduce black as an essential element."
