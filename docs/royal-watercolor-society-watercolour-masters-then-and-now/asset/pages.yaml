  md: '# MARY JACKSON

    CHRISTA GAA (1937 - 1991): *Still Life with Pottery Duck*


    ![](img/b8a900b8373e949117f531b00685f281_15_0.png)


    Christa’s passion for painting ran deep: day-to-day objects, which she selected
    for her still-life paintings were transformed into magical works of art on her
    canvas. The uniqueness of Christa’s painting attracted me to try and say something
    about her approach and to look closely at mine. If I could take a leaf out of
    her book, I would be a better watercolourist.


    Christa was exploring all the time; she was using different shapes: square, round,
    sharp-edged, soft, patterned, weaving them together to form her composition. The
    placing of the objects always looked natural, and the use of the negative shapes
    helped to set up the arrangements. She seemed to have a wonderful imagination
    and colour sense.


    you paint what’s in front of you?’; and Chris’s reply would be. ‘Oh Ken, but I
    have!”


    I’ve always admired Christa’s approach and wanted to experiment in her style;
    these paintings are brave initial attempts and have inspired me to continue and,
    maybe, change my direction.


    Colour was her forte: in her choice of colour her work seemed to express contemplation
    and stillness; there seemed to be a broodiness, moody and reflective.


    Her colour was rich and seductive, and for each painting she would make a different
    selection. It might be browns leading to mauves, warm ochres to deep reds, or,
    as in the case of this early still life, the serenity of blues, cool and warm
    using reflective light to lift the painting enhanced by the edges of the objects
    catching the highlights. The deep, rich quality of the brown-mauve tablecloth
    in the foreground is echoed in the shadows moving to the back of the table, and
    this binds the whole painting together. The simplicity is breathtaking.


    I asked Ken Howard, her husband, about her approach. Apparently, she started at
    10am, after all the housework was complete and the dog had been exercised, then
    settled down to painting and usually completed a work in one session, with no
    interruptions or breaks, finishing around 9pm. The change of light didn’t bother
    her.


    To begin with she drew in lightly, added watercolour followed by gouache and finished
    sometimes with chalk; rules were to be broken! Ken would sometimes say: ‘But Chris,
