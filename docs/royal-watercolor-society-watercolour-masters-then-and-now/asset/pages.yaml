  md: '# TOM COATES


    JOHN SINGER SARGENT (1856–1925): *Bed of a Glacier Torrent*


    It must be said that the John Singer Sargent in the RWS collection is not the
    greatest painting of the artist we all admire. He once described his work as being
    merely snapshots, but he is being rather flippant; it tells us, however, about
    the modesty of the man who was always in demand for his portraits. Sargent’s varied
    collections of watercolours show off his techniques to the full, with uses of
    warm and cold colours in opposite ways. When people use a cold colour for shadows,
    he cheeks us by using a hot one or a mixture, blending colours together, counteracting
    brightness with a pure, unadulterated spectrum of rainbow pureness.


    ![](img/b8a900b8373e949117f531b00685f281_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/b8a900b8373e949117f531b00685f281_24_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_24_1.png)


    Having broken away from the confinement of portraiture, the wide subject matter
    shows Sargent as a tour-de-force, as does his collection of watercolours at the
    Imperial War Museum. They all show his flair for working with fast, loose strokes.


    There are many quotes on Sargent by writers, poets and most of all patrons of
    high esteem. As Evan Charteris wrote in 1927: ''To live with Sargent''s watercolours,
    is to live with sunshine captured and held with the lustre of a bright legible
    world the refulent shade and the ambient arduors of the noon''.


    The countless journeys that Sargent made with friends is something we have in
    common. The sketchbook page shows Mary Jackson, who always collects children around
    her with her warmth and generosity. It was done during a trip to Morocco, and
    the multi-coloured background gives the theatre of a backdrop.


    Another page from the Moroccan sketchbook shows a rapid attack on the subject
    with quick, loose strokes and the shadows exploding into dark browns with a mixture
    of blues.


    It takes a lifetime of practice to be a painter, but a short time to attack a
    subject with the flair of Sargent. To try to mimic him is a dangerous thing, but
    he helps us to enjoy the exploration of the watercolour medium. To become excited
    by another technique can only be open to an experienced practitioner; whether
    he be an oil painter, or even a sculptor.


    You don''t find watercolour, it finds you; it''s used to enhance a sketchbook
    page, but it''s a wonderful individual medium that finds the strengths and weaknesses
    of the artist.'
