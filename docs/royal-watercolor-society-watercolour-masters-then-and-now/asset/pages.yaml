  md: '# ALISON C MUSKER


    ARTHUR RACKHAM (1867-1939): Abbaye d''Ardennes, Caen


    ![](img/b8a900b8373e949117f531b00685f281_139_0.png)


    The great painters drench each tone with as much of the wine of colour as it will
    hold, without contradicting the light and shade. Contrasting tones are in juxtaposition,
    repeating each other three times.


    Through the rat-gnawed door one treads over raised cobblestones, with dirt tracks
    on either side for the carts, under the darkened Norman archway with mellowed
    deep-yellow groining, and then one steps out into the courtyard in full sunshine.
    ‘Where the light is brightest the shadows are deepest’ (Johann Goethe, 1771).


    *The Venetian Doorway* is also a tonal painting. Against the light Istrian stonework
    and the windows looms a darkened doorway. The colours used in my watercolour were
    Venetian red (the earth colour extracted from Badia di Calcarena, near Verona),
    raw siena, burnt siena, burnt umber and prussian blue, light red and French ultramarine,
    which created the shadows.


    Tone refers to variations in the dimensions of hue and brightness, being the relationship
    of relative depth of different colours. Tonal values can alter in relation to
    each other when placed side by side and may flatten the images, as on the shadow
    cast in Rackham’s watercolour by both doors.


    Sickert used gradation in tones and even numbered them on his preparatory drawings.
    Compare the light and shadows of one area to another, half close your eyes and
    you can decipher the tones more easily. You need a dark tone to make the crisply
    lit side stand out; chiaroscuro is the contrast between these highlights and shadows.
    Rackham used a limited palette and you can see what he has achieved.'
