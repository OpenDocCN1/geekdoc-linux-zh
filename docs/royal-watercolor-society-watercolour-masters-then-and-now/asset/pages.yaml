  md: '# AGATHE SOREL


    ROBERT ALLAN (1851–1942): *Tarbert, Loch Fyne*


    Robert Allan’s Loch Fyne depicts a lonely and somewhat derelict tower, similar
    to the one I discovered and painted in remote farmland in volcanic Lanzarote.
    No doubt both towers harboured a mysterious or heroic past, but in their gradual
    decomposition became the subject of fluid associations of ideas.


    Allan travelled widely and was greatly influenced by the landscapes in which he
    painted. An interest in light and weather conditions made his work personal and
    in this he followed the Impressionist tradition of painting out of doors and taking
    note of the most transient changes around him.


    ![](img/b8a900b8373e949117f531b00685f281_63_0.png)


    This approach appealed to me when I painted *Ghost Tower*, where the ruins provided
    the framework for spatial ideas. The pigeons flying in and out, from the background
    to the foreground, and maybe also from past to the present, became compelling
    symbols in an imagined narrative.


    The process of simplification and abstraction transformed the tower into a virtual
    structure, facilitating experiments with sculptural elements. The collaged areas
    used with a somewhat reckless spontaneity helped to accentuate movement throughout
    the picture. The subjective handling of the media was preceded by numerous compositional
    diagrams and careful consideration of the proportions.


    It seems that 1911 was not so long ago and the experience of two artists painting
    or immersing themselves in the landscape should be very similar. We tend to carry
    much more baggage these days; it is increasingly difficult to ignore all the recent
    developments in the arts and the pressures to create novel or conceptual work.


    These methods have their own interest and value, but out in the landscape, subjected
    to the elements, one enters into the different world of spontaneous observation
    and improvisation. It results in a freshness of vision, which in other circumstances
    is difficult to achieve.


    Above: **ROBERT ALLAN**, *Tarbert, Loch Fyne*, watercolour and graphite, 39.4
    x 57.1 cm (15.5 x 22.5 in)


    Opposite: **AGATHE SOREL**, *Ghost Tower*, 2003, 45 x 60 cm (18 x 24 in)'
