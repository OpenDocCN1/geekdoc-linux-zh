  md: '# FRANCIS BOWYER


    # ALBERT GOODWIN (1845–1932): Glastonbury


    ‘Poetic’ was my first thought when I saw the picture *Glastonbury* by Albert Goodwin.
    My second was admiration for his adventurous approach to what is, in my opinion,
    a fairly ordinary topographical view.


    Goodwin was a master watercolourist, and is probably best-known for his work in
    that medium. He used all sorts of techniques and approaches: watercolour, bodycolour,
    pen and ink, pastel, and gum on both white and tinted papers. He wiped and scraped
    out.


    ![](img/b8a900b8373e949117f531b00685f281_125_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_125_1.png)'
