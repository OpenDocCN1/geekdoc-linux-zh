  md: '# SONIA LAWSON


    ARTHUR AMBROSE McEVOY (1878-1927): Beatrice


    I know that colour universally beguiles the eye and the heart, yet I have chosen
    to engage with an almost monochromatic work from the RWS permanent collection,
    a watercolour drawing by Ambrose McEvoy called simply Beatrice, painted around
    1925-26. It is as much a painting as it is a drawing. What attracts me is the
    sound draughtsmanship, the fluidity, mutability and seeming nonchalance. The ease
    in handling wash and the careful economical drawing within the upper body makes
    it all look very easy, but this is, of course, deceptive. McEvoy achieves his
    informed draughtsmanship by understanding form, in this case the human form, and
    by his skill in handling the media: watercolour, ink and chalk.


    ![](img/b8a900b8373e949117f531b00685f281_78_0.png)


    The work does not feel overstated, it is not ''finished off'' to the death, not
    a finite thought, more an open, ongoing set of notations put down with refreshingly
    direct urgency. Here is no great show of prowess, but rather an impulse, a reminder
    of a day and a person - both fleeting. The viewer can participate in something
    intimate, being offered an invitation to join in the exploration, unstructured,
    an essence rather than an academic experience.


    Ambrose McEvoy was well respected, particularly for his large portraits. His is
    a ''tasteful'' sort of art, a likeable lightweight who has never been an inspirational
    mentor for me (my formative tastes were more Max Beckmann), but I do like the
    particular McEvoy painting-cum-drawing I''ve chosen to work with. Having seen
    it only briefly on a couple of occasions when it has been out of storage I discovered
    it has real muscle. I found too that because of its ''feel free'' approach there
    is something jocular and easy about it that surmounts its sombre lack of colour.
    When things work, as with Alexander Cozens


    (1717-86), monochrome can feel like colour. The name ''Beatrice'' is at present
    associated with past fashion, this made me think of earlier names, for example
    Charlotte and Emily, two of the three Brontë sisters. The connection, though at
    first tenuous, was from then onwards a stream of consciousness that made me smile.
    I found myself engaged in a picture of three feisty females, symbols of Emily''s
    Wuthering Heights. This is more or less a monochromatic work, and I have tackled
    it seriously yet with a freedom in mind aiming to eschew any navel gazing or the
    dourness of the turgidly serious.


    Above: SONIA LAWSON, Feisty Females, 2005, watercolour, bodycolour and pen and
    ink, 51 x 52 cm (20 x 20.5 in)'
