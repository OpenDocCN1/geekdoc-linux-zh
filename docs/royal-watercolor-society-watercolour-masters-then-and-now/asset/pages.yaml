  md: '# The Society


    In 2004 the Royal Watercolour Society celebrated its bicentenary as the second
    oldest artistic society within Great Britain (after the Royal Academy) and the
    oldest watercolour society in the world. It was founded by a group of mainly young
    artists who wished to trumpet the glory of painting in watercolour at a time when
    it was deemed to be a minor art form by the art establishment.


    The Society was granted the title of Royal in 1881 by Queen Victoria, herself
    a keen watercolourist, and the Royal connection continues today as HM The Queen
    is patron of the Society and HRH The Prince of Wales an Honorary Member.


    Over its two hundred years, its membership has been a veritable Who''s Who of
    British Artists, including many well-known names: artists as varied and distinguished
    as Cotman, Samuel Palmer, Alma-Tadema, Singer Sargent, Burne-Jones, Helen Allingham,
    Dame Laura Knight, Peter Blake, and Leslie Worth have been proud to put the initials
    RWS after their name.


    # Front cover:


    Top: Roland Vivian Pitchforth RA, RWS (1893-1982), Kent Marshes, watercolour,
    scraping, pastel and chalk, 43 x 58 cm (17 x 23 in).

    Bottom: Charles Bartlett, Low Tide, Stone Point, 2003, watercolour, 38 x 43 cm
    (23 x 17 in).


    # Back cover:


    Top: Sir William Russell Flint RA, RWS (1889-1969), Incoming Tide, No. 1 Slip,
    Devonport Dockyard, watercolour over graphite, 49 x 66 cm (19.2 x 26 in).

    Bottom: Michael Chaplin, Codenosa Distillery - Barcelona, 2004, watercolour, 31
    x 61 cm (30 x 24 in).'
