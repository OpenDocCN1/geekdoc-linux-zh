  md: '![](img/b8a900b8373e949117f531b00685f281_10_0.png)


    # CLARENCE HOUSE


    Watercolour is the most quintessentially British of media; its attractions for
    me lie in the fluidity and immediacy of the material. To watch a master of the
    medium, as are all of the artists whose work is shown in this book, is to marvel
    at the deceptive ease with which an image, full of light and movement, emerges.
    Those of us who have struggled to use watercolour to our own satisfaction know
    just how deceptive that apparent ease can be. I remember so well, when I was just
    beginning to venture into the world of watercolour - probably over thirty years
    ago now - that I asked Ted Seago, the renowned Norfolk painter, to give me a lesson.
    “I can’t teach”, he said, “but I can demonstrate”. And he did just that - from
    his memory he conjured up, as if by magic, an image of a Thames barge floating
    in an estuary under a dramatic sky. It was at that point that I felt like giving
    up for there is no doubt that watercolour is an extraordinarily difficult medium.


    The first exhibition to be held by the Royal Watercolour Society occurred in 1805;
    it is the oldest watercolour society in the world, and is second only to the Royal
    Academy of Arts in its importance as an art society. The two hundred years of
    the Society’s history superbly reflect the history of excellence in the medium,
    and this book emphasises the strengths of that tradition. By drawing from the
    wonderful archive of the Society’s Diploma Collection for their inspiration, today’s
    Members have reinforced the continuity of excellence and ability. These personal
    essays by contemporary artists talking about their art and the extent to which
    they are influenced by the works in the Diploma Collection, bring to this book
    great charm and honesty when many books about art are often cool and analytical.


    For instance, the wonderful painting by Arthur Rackham shown on the opposite page
    was chosen because of the extraordinary way in which he used tonal values, an
    element of artistic understanding used by many watercolourists. It is fascinating
    to see an artist known for his very particular style of illustration - of which
    there is another fine example in the RWS Diploma Collection - demonstrate his
    control over the medium to create a beautiful topographical work like this.


    At a time when conceptual art appears at the forefront of Media attention and
    artistic endeavour, sadly at the expense of drawing and painting, it is enormously
    refreshing to see skill and its practice combining to embrace and further this
    wonderful medium. It seems appropriate that the royalties from this book should
    go towards the charitable and educational aims of the Society. For those, like
    myself, who love the art of watercolour, this book is a revelation created by
    true masters of the art: it also reinforces the pleasure and privilege I feel
    in being an Honorary Member of the Society.


    ![](img/b8a900b8373e949117f531b00685f281_10_1.png)'
