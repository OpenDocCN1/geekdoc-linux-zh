  md: '# **NEIL PITTAWAY**


    FRANCIS OLIVER FINCH (1802-1862): *Ruins of an Ancient City*


    ![](img/b8a900b8373e949117f531b00685f281_43_0.png)


    My ideas are often inspired by historical narrative subjects from the eighteenth,
    nineteenth and early twentieth centuries, so that the inspiration to produce new
    works based on the RWS painting collection was a natural progression. I particularly
    like the idea of borrowing visually from the past and letting the subject evolve
    gradually to form a modern and stimulating concept for the spectator.


    ![](img/b8a900b8373e949117f531b00685f281_43_1.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The transcription method of working is a bit like piecing together a large
    jigsaw. First, one researches and observes closely the chosen painting, observing
    every aspect of the work, both theoretical and practical, drawing out the essence
    of what the artist was trying to say, then reinterpreting it to create a totally
    refreshing vision, that is very much in the present day. This is what I have tried
    to do with my interpretation of Francis Oliver Finch''s painting. By transporting
    it into an imaginative world that is real and unreal, old and new flow in parallel
    worlds to create a space that is devoid of real time. The subjects are strong
    and full of emotion but distant as if a third party that is not present is working
    out the missing elements.


    God-like figures that represent images from Greek mythology fall heavily over
    a fragile modern age. The modern age and globalization are inextricably linked
    to a bygone age of a classical empire, now in ruins. The ideal of romanticism
    in the classical landscape of Oliver Finch remains to be enjoyed and celebrated
    to this day.


    The strength and application of colour determines the tempo of the picture and
    creates a backbone that supports and defines its character. Colour also expresses
    the general overall mood of the picture. The glazing methods I use highlight this
    further and create an image that is complex both technically and conceptually.


    In my transcription, called *Changing Worlds*, I have used colour to bind parallel
    concepts together to form a world that is enlivened and rich. I have chosen rich
    Turner-esque colours for the classical landscape based directly on Francis Oliver
    Finch''s work.


    I use colour symbolically to represent a golden age, a world that is no longer
    real, but exists in the imagination of the human spirit and mind. Through using
    colour that is clean and machine-like I create another rich but far removed world,
    a world of new enlightenment, of globalization and scientific exploration.


    ![](img/b8a900b8373e949117f531b00685f281_44_0.png)


    Opposite, above: **FRANCIS OLIVER FINCH**, *Ruins of an Ancient City*, watercolour,
    55.3 x 75.5 cm (21.8 x 29.7 in)

    Opposite, below: **NEIL PITTAWAY**, *Changing Worlds*, 2004, watercolour and bodycolour,
    57 x 76 cm (22.5 x 30 in)

    Left: **NEIL PITTAWAY**, *City Audience*, 2004, watercolour and bodycolour, 76
    x 57 cm (30 x 22.5 in)'
