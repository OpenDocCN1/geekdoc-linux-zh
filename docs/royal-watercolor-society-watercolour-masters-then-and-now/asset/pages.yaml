  md: '# TREVOR FRANKLAND


    *JOSEPH EDWARD SOUTHALL (1861–1944): A Cornish Haven*


    I was attracted to this painting not only because of its strong composition but
    also by the subject matter. The image of a sailing ship probably returning from
    foreign parts has for me a strong association with past times and the Grand Tour
    revisited. The influence of the Continent on English art and architecture during
    the eighteenth century was extensive.


    ![](img/b8a900b8373e949117f531b00685f281_33_0.png)


    *Left: **JOSEPH EDWARD SOUTHALL**. A Cornish Haven, watercolour, 30.3 × 24.3 cm
    (12 × 9.6 in)*


    *Opposite: **TREVOR FRANKLAND**. The Grand Tour Revisited, 2005. watercolour,
    acrylic and carbon pencil, 56 × 82 cm (22 × 32.2 in)*'
