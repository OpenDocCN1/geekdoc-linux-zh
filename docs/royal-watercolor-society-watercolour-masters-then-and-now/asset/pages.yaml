  md: '# GREGORY ALEXANDER


    ARTHUR MELVILLE (1858–1904): *Arabs Returning from Burning a Village*


    ![](img/b8a900b8373e949117f531b00685f281_19_0.png)


    I have liked this painting since I first came across it in Michael Spender’s book,
    *The Glory of Watercolour*. A wonderful detail is reproduced actual size and shows
    how broad and abstract this work really is. I particularly like the ambiguity
    of the figures in the centre. It’s easy to see there are people on horseback and
    that they are wearing white – but a great deal is left to one’s imagination. This,
    I believe, is a particularly modern work – the broad use of the medium and calligraphic
    mark-making in the foreground are all delightful – and probably quite avant-garde
    for its time.


    My own response hinged on my own experience. Whilst looking at the painting I
    was immediately transported to the dry and rocky landscapes of the Mediterranean.
    Furthermore, the dark shapes of the horses reminded me particularly of Greece,
    its working donkeys and its village people dressed in black, trundling along in
    the heat. I particularly wanted to pick up on the ambiguity of the subject that
    Melville achieved in his work, and accomplish a similar stylistic application
    of the medium – with its calligraphic marks and impressionistic style.


    In the end I think my work is much more figurative than I intended – and I would
    like to attempt a completely abstract work in response to Melville’s piece as
    well. However, I hope it is possible to see how I arrived at this painting from
    Melville’s starting point.


    ![](img/b8a900b8373e949117f531b00685f281_19_1.png)


    Above, left: **ARTHUR MELVILLE**, *Arabs Returning from Burning a Village*, watercolour
    and graphite, 57.5 x 47 cm (22.75 x 18.5 in)


    Above, right: **GREGORY ALEXANDER**, *Village Life, Greece*, 2004, watercolour
    on Arches paper, 58 x 76cm (22.8 x 30 in)


    Opposite: **JUNE BERRY**, *Riders in the Forest*, watercolour, 50 x 61 cm (19.5
    x 24 in)'
