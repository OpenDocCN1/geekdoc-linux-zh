  md: '# # COMPOSITION


    When I began my career as a teacher, I wanted to be the greatest art teacher in
    the world. But I soon realized that there were gifted pupils in all of my classes,
    but the majority were not, and needed much guidance. Despite the fact that I was
    teaching drawing (a dirty word in the 1960s) and they were making good progress,
    many were simply impoverished in the complex activity of painting. One afternoon
    a more gifted pupil asked me ''for a piece of paper to plan her painting''. I
    watched her make several small drawings in pencil on her paper, try different
    colours, and, as I watched her, I realised she was composing her painting before
    she began it. This was a eureka moment! And so it was that I began to educate
    pupils in composition: through the introduction of sketchbooks and the myriad
    of processes that artists use to compose their paintings. The advancement in all
    pupils'' work was enormous.


    Composition deals with the whole painting, synthesizing its many components: line,
    tone, texture, shape, and colour. It is the bringing together in a harmonious
    - or jarring - whole all the parts of a painting. It''s a complex task, unique
    to each artist. There are many processes involved, such as planning, investigating,
    and researching. Tools such as sketchbooks, viewfinders, models, photographs are
    all important in helping painters compose their paintings, and both figurative
    and abstract painters are concerned with composition.


    So, how do I compose my own paintings? I''m afraid I don''t know. Like many professional
    artists I never think about it now. I just sit down and paint, what is before
    me, and what''s in my head. I never make a plan. But, presumably, I can only do
    this because of the early training I described above. Nevertheless, there are
    mysteries in composing. Several people have commented on the high point of view
    in my paintings of large land and seascapes. Strange this, because I''m only five
    foot four inches tall, and yet whenever I sit and paint these scenes it is from
    at least a twelve-foot-high point of view. So I think I''m painting what''s before
    me, when all the time I''m painting what I can''t see, from above me. How do I
    do it? I simply don''t know. As Matisse said, ''the best things in paintings can
    never be explained.''


    DAVID FIRMSTONE MBE


