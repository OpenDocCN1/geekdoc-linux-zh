    # ARTHUR AMBROSE McEVoy ARA (1878-1927)


    ARWS 1926


    McEvoy was born at Crudwell in Wiltshire. His father, who had served with the
    Confederate Army in the American Civil War, was an authority on submarine warfare
    and a friend of Whistler. At the age of fifteen McEvoy entered the Slade School
    of Art in London where he became a close friend of Augustus John and had a stormy
    affair with Gwen John. Sickert was an important later influence. McEvoy was one
    of the most sought-after portrait painters of his age, particularly of fashionable
    women, but he also produced a masterly series of portraits of naval officers and
    ratings who had won the Victoria Cross now in the Imperial War Museum. His preference
    was for half-lengths. McEvoy was ''a portrait painter of exquisite taste and subtle
    interpretation''; stylistically loose and free, occasionally his dewy iridescence
    fades into the pale obliteration of fog'' (Gleadowe). William Rothenstein described
    McEvoy as looking ''like a Pre-Raphaelite, with his strikingly large eyes in a
    long, angular face; and he spoke in an odd, cracked voice''. Heavy drinking led
    to his early death from pneumonia.


    # ARTHUR MELVILLE (1855-1904)


    ARWS 1886, RWS 1900


    Melville was born at Loanhead-of-Guthrie in Forfarshire, the son of a coachman.
    In 1870 He was apprenticed as a book-keeper to a grocer but, despite parental
    disapproval, attended evening art classes in Edinburgh. After his father''s employer
    purchased a work by Melville from the Royal Scottish Academy he had the confidence
    to enroll at the Edinburgh School of Art. Later he studied in Paris, where he
    encountered work which inspired him to travel and paint in the Middle East and
    Egypt. His journeys were often full of danger. On one occasion he was captured
    by robbers, stripped naked and left for dead in the desert, rescued by villagers.
    he recovered his tartan plaid and his Bible, which had a bullet hole in it. On
    his return to


    Scotland he encountered the ''Glasgow Boys'' and lived among the artistic community
    in Cockburnspath in Berwickshire. Sir James Caw described Melville as ''stalwart
    of figure, forcible in the expression of his ideas, full of enthusiasm and driving
    power''. These characteristics find expression in the immense vitality of his
    work which greatly impressed contemporaries such as Whistler. Melville died of
    cholera contracted after a visit to Spain. The critic Frank Rutter said of his
    memorial exhibition in 1906 that it showed Melville to be ''unquestionably the
    most brilliantly audacious watercolour painter of his time''.


    # SAMUEL PALMER (1805-1881)


    ARWS 1843, RWS 1854


    Palmer was born in Newington, the son of a bookseller. He first exhibited at the
    Royal Academy at the age of fourteen and had soon encountered a group of young
    artists, the ''Ancients'', such as Francis Oliver Finch, who were greatly influenced
    by William Blake. He also met John Linnell, whose daughter he married; however,
    differences of religion and temperament caused difficulties with his father-in-law
    for the rest of his life. In 1821 Palmer moved to Shoreham in Kent, ''that genuine
    village where I mused away some of my best years''. Some of his finest albeit
    artistically mannered drawings were produced here, the ''tangled wild-flower beauty''
    Martin Hardie of these pictures of a pastoral England became immensely influential
    in the mid-twentieth century. Palmer''s life was beset with anxiety and depression
    over money, health ''the doctors, monsters as they are, have forbidden me rumps
    steak dumpling'' and, later, the death of his son. Even his acquaintance invited
    peers when out sketching, his ''coat was an accumulation of pockets in which were
    stowed away the all-important snuff box, knives, chalks, charcoal, coloured crayons,
    and sketch-books, besides a pair of large, round, neutral-tint spectacles made
    for near sight''. Ironically, one of the most original and important of British
    landscape artists whitewashed his studio window in order not to see the world
    outside.


    # JAMES PATERSON (1854-1932)


    ARWS 1898, RWS 1908


    Paterson was born in Glasgow, the son of a cotton and muslin manufacturer. To
    please his parents he worked in business for four years but attended Glasgow School
    of Art in the early morning and took private lessons until 1878, his father allowed
    him to study in Paris. In 1882 Paterson returned to Glasgow and became associated
    with the ''Glasgow Boys'', a group of painters influenced by Whistler and Bastien-Lepage
    who intended to bring an end to the monopoly of conventional Scottish painters
    the ''Glasgow''. Paterson married in 1881 and moved to ''a low cottage-like house
    with irregular gables and slated dormers'' in Moniaive, a remote village in Dumfries
    where he lived for the rest of his life. Much of Paterson''s work, invariably
    loosely painted and rather decorative, is inspired by his poetic response to landscape
    as can be seen in Poeta Brava, Tenerife (page 146), which was painted on a journey
    made to the Canary Islands on account of his wife''s health. As young men, the
    Glasgow Boys exhibited with the Munich Secession and new exhibiting bodies throughout
    Europe, but they gradually became absorbed by the establishment. Paterson was
    President of the Royal Scottish Society of Painters in Watercolour in 1923 and
    served as both Librarian and Secretary of the Royal Scottish Academy. A church
    elder he listed his interests as ''walking, golf, croquet and chess'', and took
    a ''naive'''
