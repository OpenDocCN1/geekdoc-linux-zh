  md: '# STUART ROBERTSON


    LIONEL BULMER (1919-1991): *Greengrocer''s Shop*


    This painting has a relaxed appearance. Lots of different marks have been used
    to describe various textures. It is quite orderly but also has an incidental look
    which I find probably the most interesting of all its qualities. The work has
    obviously been completed on site and has the immediacy that results from economies
    in decision-making on subject, light and composition that this necessitates. The
    picture has many other qualities I find attractive. Strong and confident drawing
    is very evident.


    The application of watercolour is factual and has been carried out with speed
    and competence. The composition itself is very daring, as exemplified by the bold
    lines cutting through the picture from top to bottom as well as the structural
    quality of the light. The figure seems only suggested, but is essential and possibly
    the main focus of the picture.


    ![](img/b8a900b8373e949117f531b00685f281_69_0.png)


    In my own work I find that this way of working often produces the best results.
    You can be more concerned with what you are looking at than with what you are
    painting, the marks on the paper becoming almost subconscious, and this is enjoyable,
    not least because the results are immediate. Lionel Bulmer''s picture looks as
    if it was completed in one sitting; I like this in my own work when painting in
    situ. This can be done with watercolour and is the beauty of watercolour painting
    in its most basic form. When painting in India and elsewhere, I find pen and ink
    with some watercolour produces fast and easily accessible works.


    These are not only interesting in themselves but also invaluable notes for further
    work in the studio. My painting of a chappal (slipper or sandal) shop in Jaipur
    was done from across a busy street. The view constantly changes as people crowd
    around and in front of you. It is hot, and the paint dries quickly. As I paint
    a customer sails into view and leaves his bicycle leaning against the front of
    the shop for a few minutes. The cycle becomes the new focus of the picture. It
    is not merely incorporated, but strengthens the earlier composition making it
    perfect, as if destined.'
