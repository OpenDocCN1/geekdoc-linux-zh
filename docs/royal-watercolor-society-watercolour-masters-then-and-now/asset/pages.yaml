    ![](img/b8a900b8373e949117f531b00685f281_47_0.png)


    I tend to treat similar landscapes in a more geometric manner. Pitchforth’s colour
    was often muted and tended to be literal whereas I tend to express my ideas using
    expressive colour and texture.


    ![](img/b8a900b8373e949117f531b00685f281_47_1.png)


    Having sailed small boats for a large part of my life has given me a love of the
    sea. Pitchforth also loved painting the sea and ships. The angular and straight
    sea walls of Essex, the lonely marshes and the beautiful reed beds mainly form
    the basis of my compositions.


    I try to find an equivalent in paint and etching to express my feelings about
    the East Anglian landscape, particularly studying the geographical formation and
    erosion of the beaches. I do not paint on the spot, but work from drawings and
    studies that are used to compose my paintings in the studio. I try to express
    the poetry found in this landscape. The loneliness and unspoilt pure beauty of
