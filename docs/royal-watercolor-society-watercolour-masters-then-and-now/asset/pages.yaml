  md: '# SOPHIE KNIGHT

    ARTHUR AMBROSE McEVoy (1878–1927): *Beatrice*


    ![](img/b8a900b8373e949117f531b00685f281_77_0.png)


    I greatly admire Ambrose McEvoy’s painting, *Beatrice*. With his confident handling
    of watercolour, McEvoy makes the painting almost dance with gestural strokes and
    such variation of brush marks that the viewer is never bored looking at it. McEvoy
    uses a limited palette of no more than four colours and this lack of colour enhances
    the impact of a strong use of tone.


    When setting out to paint the subject of St Pancras Station,


    I borrowed these ideas as a starting point and limited my own palette to six colours
    in order to concentrate on the obvious tonal qualities such an ethereal space
    has to offer. By emphasising how richly dark the roof’s iron girders appear the
    visual impact is made stronger when contrasted with the much lighter tones of
    the window panes.


    I also aimed to vary my brush marks from the tiny and quite detailed area of the
    clock face to the broad washes of colour which suggest the floor and background
    in the station.


    After lightly pencilling in the general proportions of the composition and reminding
    myself of the perspective in the structure of the roof, I was able loosely to
    drop in splashes and marks over the area of the ironwork.


    At this point the painting seemed to have a life and energy of its own and the
    subject suggested to me a series of patterns. I began to enjoy the way the window
    was made up of a grid: rectangles, triangle and diamond shapes emerged from the
    gaps between the girders and I emphasised this theme throughout the composition.


    Ultimately my painting bears little resemblance to McEvoy’s *Beatrice*. For me
    that is one of the exciting things about painting. Whatever the starting point,
    it’s likely that a new idea will emerge and it’s a journey of discovery that takes
    you to ever new destinations.


    ![](img/b8a900b8373e949117f531b00685f281_77_1.png)


    *Above, left: ARTHUR AMBROSE McEVoy ARA, Beatrice, watercolour, ink and chalk,
    40.6 x 30.3 cm (16 x 12.2 in)*


    *Above, right: SOPHIE KNIGHT, St Pancras Station, watercolour and bodycolour,
    76 x 56 cm, (29.9 x 22 in)*'
