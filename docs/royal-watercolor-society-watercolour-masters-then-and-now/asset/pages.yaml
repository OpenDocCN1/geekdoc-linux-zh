  md: '# KAROLINA LARUSDOTTIR ROBERTS


    ARTHUR MEIVILLE (1858 - 1904): Arabs Returning from Burning a Village


    When I think of the RWS and all the wonderful works I have seen there over the
    years, there are many that are as alive with me and as fresh as the day I first
    saw them. It is strange how some paintings seem to have a long-lasting impact
    over and above the others.


    The painting I have chosen out of the Diploma Collection is Arthur Melville''s
    *Arabs Returning from Burning a Village*, (1922). I still remember seeing it for
    the first time. Its fluidity of composition, the stunning simplicity of colours
    and the bright light makes this a very memorable painting. Without being too obvious,
    the people seem to blend into the landscape almost as if they were part of it.
    It looks light and atry and the brushstrokes seem deceptively easy but it comes
    together to make one of my favourite paintings. The essence is captured, not the
    detail. The figures merge into the scenery, hardly distinguishable as figures
    but undeniably so. The boldness and simplicity of the application of the watercolour
    adds to the effectivenss of the painting.


    So much is understood about the landscape, as much from the information given
    as from the absence of detail - the heat in the ground, the dry air, the midday
    sun, lack of shelter and the sense of distance and space. Within the dry rock,
    there is a small area of green, which should provide a sense of rest and refreshment,
    but then we realise this is the area under attack and we can feel the villager''s
    isolation.


    ![](img/b8a900b8373e949117f531b00685f281_21_0.png)


    The ambiguity of the painting appeals. I am given a certain amount of information
    but my mind and imagination must also work to make its own conclusion. The most
    obvious parallels between Melville''s painting and my own is of course the subject
    matter of people in landscape. This has always been an interest of mine, perhaps
    growing up in Iceland makes this easy to understand. As an Icelander, the landscape
    is all pervading. Every aspect of life in Iceland is affected by the land and
    the extreme weather conditions.


    The figures in both paintings have a very special relationship with the landscape.
    They understand it, they live with it, on it and from it and they also understand
    its dangers.'
