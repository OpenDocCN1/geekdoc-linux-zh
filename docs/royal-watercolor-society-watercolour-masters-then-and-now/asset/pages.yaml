  md: '# JONATHAN CRAMP


    # SAMUEL PROUT (1783-1852): Lucerne


    ![](img/b8a900b8373e949117f531b00685f281_143_0.png)


    What a difference a shadow makes! Imagine Samuel Prout''s Lucerne without the
    cast shadow on the left. I am sure he would have made a very pleasing picture
    without it, but the shadow adds considerable drama and makes a much better composition.
    Within the luminous dark area he is able to simplify details and the contrast
    of detailed and more simplified areas gives an added vitality. And as in Rembrandt''s
    work, the shadow has an element of mystery. The viewer wants to peer into the
    darkness.


    In Shadows and Reflections, the buildings are close up, as in Prout''s painting,
    but they are a little more parallel to the picture plane, which emphasizes the
    geometry of the vertical and horizontal. The shadows do not override this structure,
    but they are nonetheless the real subject of the picture, coupled with the reflections
    in the windows. I was not particularly interested in making a picture only of
    the façade delightful though this was. The excitement came when the sun came out
    and the tree behind me cast its mottled shadow over the wall, the metal balustrade,
    and the railings and windows. The tree was also reflected in some of the windows.
    Technically the execution of the picture demanded careful drawing and observation
    of the subtle changes in tone. Just as in Prout''s work the contrast of light
    and dark raises the picture above mere description.


    ![](img/b8a900b8373e949117f531b00685f281_143_1.png)


    Similarly, in The Bishop''s Palace, Mathern, near Chepstow the sun came out in
    early evening after a dull grey day and transformed everything. I became more
    excited in the tonal contrasts than in the gardens and buildings themselves.


    While I would not pretend that my pictures are anywhere near Samuel Prout''s in
    quality, we have both used shadows and tonal contrasts to vitalise the composition.'
