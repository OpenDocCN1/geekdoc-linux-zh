  md: '# DENNIS ROXBY BOTT

    SIDNEY LEE (1866 1949): *Boatbuilding*


    Boats are naturally associated with water and what appeals to me about Lee''s
    picture is the mild incongruity of the buildings, with absolutely no water in
    sight. Artists in Lee''s time were lucky enough to find traditionally built boats
    to draw, or in this case, being built traditionally. I find they are far more
    satisfying and worth drawing than modern plastic ones, so I was delighted to find
    some old boats at Worthing where I could also incorporate the Regency and Victorian
    houses behind.


    Of course topographical artists in Lee''s day had a very different outlook. Clearly
    Sidney Lee''s picture is largely illustrative of the men working hard on the boats.
    In fact I think his main interest is in the figures and what they are doing. He
    is not much concerned about the fairly unremarkable buildings. My main interest
    is the buildings themselves, their architecture and the physical surroundings
    of the particular coastal resort; the very nature of the seaside.


    in ‘How To Do It’ books and even television programmes. I was never quite convinced
    of the idea, feeling that they do to some extent turn the picture into a snapshot
    of a moment and that, I felt, was unsatisfactory.


    I hope my work has other priorities. If the subject is a building I would like
    my picture to reflect something of the atmosphere of the architecture. Fortunately
    we are under no such pressures to include figures nowadays, or indeed to put in
    anything recognisable at all!


    I remember when I was very young the importance put on having figures in a picture.
    It was an often repeated emphasis


