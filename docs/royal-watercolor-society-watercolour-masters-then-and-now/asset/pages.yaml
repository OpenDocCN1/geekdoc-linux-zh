  md: '# NARRATIVE


    The telling of stories is one of the oldest reasons for painting pictures and
    narrative painting has appeared to a greater or lesser extent throughout the history
    of art. Early narrative painters told biblical stories in fresco paintings. Giotto
    was a trailblazer in the fourteenth century, depicting stories with real-life
    characters. Caravaggio astonished with super realism in scenes, often from horror
    stories, like modern-day film stills. Victorian painters delighted in moral tales
    and every picture told a story. Stanley Spencer painted his own eccentric visions
    of events such as Resurrection Day, full of extraordinary detail. Paula Rego gives
    us disturbing images with undertones of sex and sadism to read into what we will.


    With the arrival of non-figurative art in Britain, narrative painting became a
    rather derogatory label among the avant-garde, but perhaps because of our strong
    literary inclinations, narrative themes have retained a constant presence, though
    sidelined, amongst the succession of art movements we have seen in the twentieth
    century. Edward Burra''s great watercolours of the 1930s, often on a large scale,
    show us low life scenes in Harlem and suspicious goings on in bars, clubs and
    cafés. During World War II Edward Bawden, Thomas Hennell and Eric Ravilious worked
    as war artists painting superb watercolours documenting the activities of the
    armed forces here and abroad.


    I enjoy paintings that tell a story paintings that you have to read and which
    reward a longer look by revealing something else that you didn''t at first notice.
    Sometimes such pictures have an ambiguous or mysterious theme inviting the viewer
    to interact with the painting, as in the watercolours of Ken Kiff, for example.
    The artist is happy to leave the way open for the viewer to interpret the picture
    as he likes and respond following his own imagination.


    JUNE BERRY


    Left: EDWARD DUNCAN, The Approaching Wreck (detail), watercolour and bodycolour,
    29 x 58.5 cm (11.5 x 23 in)


    ![](img/b8a900b8373e949117f531b00685f281_92_0.png)'
