    # ANNIE WILLIAMS


    CHRISTA GAA (1937–1991): Still Life with Pottery Duck


    Christa Gaa is an artist who, among others, has influenced my work and given me
    inspiration. I have certainly been more excited about painting still life since
    seeing her paintings. I love her use of rich, subtle colours, which glow from
    her work and appear to flow effortlessly across the paper. Her subject matter
    is simple everyday objects she has collected, to some of which she probably had
    an emotional attachment. I know she felt it was very important to love the subject
    matter and I too have to feel some excitement about what is in front of me, and
    to enjoy the challenge it poses.


    ![](img/b8a900b8373e949117f531b00685f281_13_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_13_1.png)


    After seeing her work I found myself using more layers of watercolour wash and
    trying to strengthen my colours. Like Christa Gaa, I start my paintings with watercolour
    and finish by using gouache. In this picture she used lots of deep earth colours,
    but in close tones, which I love. Like her, I have a collection of small and intimate
    objects; in my case they are mostly pots, which have reappeared in several paintings.


    For me the quality and direction of light can play an important part in creating
    an atmosphere and shadows


    become very much part of the composition. Christa often used lighting from above,
    which highlighted her ellipses, while the rest of the objects would melt into
    the background. I prefer my light source to come from the side because it gives
    me greater use of play with shadows.


    Her work has a lovely sense of calmness about it — I do strive for that. I also
    enjoy the use of pattern in my backgrounds and foregrounds, using such things
    as fabrics or newspapers, but I have to be careful it does not become too busy.'
