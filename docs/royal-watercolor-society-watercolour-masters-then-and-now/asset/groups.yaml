    ![](img/b8a900b8373e949117f531b00685f281_43_0.png)


    My ideas are often inspired by historical narrative subjects from the eighteenth,
    nineteenth and early twentieth centuries, so that the inspiration to produce new
    works based on the RWS painting collection was a natural progression. I particularly
    like the idea of borrowing visually from the past and letting the subject evolve
    gradually to form a modern and stimulating concept for the spectator.


    ![](img/b8a900b8373e949117f531b00685f281_43_1.png)


    The transcription method of working is a bit like piecing together a large jigsaw.
    First, one researches and observes closely the chosen painting, observing every
    aspect of the work, both theoretical and practical, drawing out the essence of
    what the artist was trying to say, then reinterpreting it to create a totally
    refreshing vision, that is very much in the present day. This is what I have tried
    to do with my interpretation of Francis Oliver Finch''s painting. By transporting
    it into an imaginative world that is real and unreal, old and new flow in parallel
    worlds to create a space that is devoid of real time. The subjects are strong
    and full of emotion but distant as if a third party that is not present is working
    out the missing elements.


    God-like figures that represent images from Greek mythology fall heavily over
    a fragile modern age. The modern age and globalization are inextricably linked
    to a bygone age of a classical empire, now in ruins. The ideal of romanticism
    in the classical landscape of Oliver Finch remains to be enjoyed and celebrated
    to this day.


    The strength and application of colour determines the tempo of the picture and
    creates a backbone that supports and defines its character. Colour also expresses
    the general overall mood of the picture. The glazing methods I use highlight this
    further and create an image that is complex both technically and conceptually.


    In my transcription, called *Changing Worlds*, I have used colour to bind parallel
    concepts together to form a world that is enlivened and rich. I have chosen rich
    Turner-esque colours for the classical landscape based directly on Francis Oliver
    Finch''s work.


    I use colour symbolically to represent a golden age, a world that is no longer
    real, but exists in the imagination of the human spirit and mind. Through using
    colour that is clean and machine-like I create another rich but far removed world,
    a world of new enlightenment, of globalization and scientific exploration.


    ![](img/b8a900b8373e949117f531b00685f281_44_0.png)


    Opposite, above: **FRANCIS OLIVER FINCH**, *Ruins of an Ancient City*, watercolour,
    55.3 x 75.5 cm (21.8 x 29.7 in)

    Opposite, below: **NEIL PITTAWAY**, *Changing Worlds*, 2004, watercolour and bodycolour,
    57 x 76 cm (22.5 x 30 in)

    Left: **NEIL PITTAWAY**, *City Audience*, 2004, watercolour and bodycolour, 76
    x 57 cm (30 x 22.5 in)


    ## COMPOSITION


    When I began my career as a teacher, I wanted to be the greatest art teacher in
    the world. But I soon realized that there were gifted pupils in all of my classes,
    but the majority were not, and needed much guidance. Despite the fact that I was
    teaching drawing (a dirty word in the 1960s) and they were making good progress,
    many were simply impoverished in the complex activity of painting. One afternoon
    a more gifted pupil asked me ''for a piece of paper to plan her painting''. I
    watched her make several small drawings in pencil on her paper, try different
    colours, and, as I watched her, I realised she was composing her painting before
    she began it. This was a eureka moment! And so it was that I began to educate
    pupils in composition: through the introduction of sketchbooks and the myriad
    of processes that artists use to compose their paintings. The advancement in all
    pupils'' work was enormous.


    Composition deals with the whole painting, synthesizing its many components: line,
    tone, texture, shape, and colour. It is the bringing together in a harmonious
    - or jarring - whole all the parts of a painting. It''s a complex task, unique
    to each artist. There are many processes involved, such as planning, investigating,
    and researching. Tools such as sketchbooks, viewfinders, models, photographs are
    all important in helping painters compose their paintings, and both figurative
    and abstract painters are concerned with composition.


    So, how do I compose my own paintings? I''m afraid I don''t know. Like many professional
    artists I never think about it now. I just sit down and paint, what is before
    me, and what''s in my head. I never make a plan. But, presumably, I can only do
    this because of the early training I described above. Nevertheless, there are
    mysteries in composing. Several people have commented on the high point of view
    in my paintings of large land and seascapes. Strange this, because I''m only five
    foot four inches tall, and yet whenever I sit and paint these scenes it is from
    at least a twelve-foot-high point of view. So I think I''m painting what''s before
    me, when all the time I''m painting what I can''t see, from above me. How do I
    do it? I simply don''t know. As Matisse said, ''the best things in paintings can
    never be explained.''


    DAVID FIRMSTONE MBE


    ![](img/b8a900b8373e949117f531b00685f281_46_0.png)


    Left: **ALFRED DOWNING FRIPP**, *San Rocca Oliveana* (detail), bodycolour and
    watercolour over graphite on grey paper, 39 x 53.5 cm (15.4 x 21.1 in)


    ## CHARLES BARTLETT

    **ROLAND VIVIAN PITCHFORTH** (1895-1982): *Kent Marshes*


    I did not know Pitchforth very well but met him several times and admired his
    sensitive views on art. We also shared a love of similar types of natural landscape.
    Pitchforth’s painting *Kent Marshes* is typical of many of his watercolour and
    oils. It is the flat landscape in many ways similar to some of the landscapes
    of East Anglia. But whereas his paintings – particularly watercolours – were often
    atmospheric and fluid,


    ![](img/b8a900b8373e949117f531b00685f281_47_0.png)


    I tend to treat similar landscapes in a more geometric manner. Pitchforth’s colour
    was often muted and tended to be literal whereas I tend to express my ideas using
    expressive colour and texture.


    ![](img/b8a900b8373e949117f531b00685f281_47_1.png)


    Having sailed small boats for a large part of my life has given me a love of the
    sea. Pitchforth also loved painting the sea and ships. The angular and straight
    sea walls of Essex, the lonely marshes and the beautiful reed beds mainly form
    the basis of my compositions.


    I try to find an equivalent in paint and etching to express my feelings about
    the East Anglian landscape, particularly studying the geographical formation and
    erosion of the beaches. I do not paint on the spot, but work from drawings and
    studies that are used to compose my paintings in the studio. I try to express
    the poetry found in this landscape. The loneliness and unspoilt pure beauty of
    the landscape, perhaps just the sound of a seagull, the wind and the sea, contrast
    with the noise and hurly burly of modern life.

