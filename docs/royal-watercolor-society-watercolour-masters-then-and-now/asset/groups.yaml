    ## MICHAEL McGUINNESS

    ### ROBERT SARGENT AUSTIN (1895-1973): 茶歇


    我害怕绘画，它让我担忧；描述我所见之物的责任似乎令人不堪重负。即使经过训练和练习，绘画和作画对我来说也不容易，因此对我来说，涉足绘画和作画的行为是一种永远不会变得更容易的纪律，而我花费大量时间试图回避它。


    ![](img/b8a900b8373e949117f531b00685f281_87_0.png)


    事实是，某些印象，无论是风景、物体还是人物，似乎都要求关注。情况也是如此，这只被丢弃的搪瓷茶壶，在驶入埃塞克斯乡村时，我在A12路旁的绿草中瞥见它如同一闪蓝光。我大约五次路过这抹蓝光才停下来，把茶壶带回家作画。我问自己为什么不在草地上画它，而要在更正统的托盘布上画它。我无法为这个决定辩解，除了它似乎恢复了茶壶的本来位置。


    罗伯特·奥斯汀对非常英式的茶歇家庭传统的描绘已深深印在我脑海中。我的这只茶壶必定在许多不同的家庭场合中扮演了核心的、尽管未被赏识的角色，帮助建立友谊并在需要时给予安慰。最终，它变得老旧破旧，并因茶包和用于随意喝茶的马克杯的出现而变得多余，被扔掉了，但我觉得它应被尊为一只退休的茶壶，而非被抛弃的茶壶。


    ## WILLIAM BOWYER

    ### SIR GEORGE CLAUSEN (1852-1944): *女孩与花盆*


    每当我看到乔治·克劳森的素描时，我都为其视野和清晰度所印象深刻。他的水彩画具有一种清新和即时感，透射而出。在这幅简单的画作中，我钦佩他画年轻女孩的方式，并以极大的简洁展示了他传达她温柔本性给观众的能力。


    女孩手中轻轻捧着的深色天竺葵花盆的色调细腻诠释，只会起到对比和增强她柔软面部塑造的作用。头部以极致的敏感和魔力描绘。也许她与他有关——她会不会是他的女儿？


    绘画人物一直是我愉悦和特权所在，在享受他们的陪伴的同时，尝试捕捉那种人性精神，那条揭示他们真正本性的难以捉摸的线索。


    我偶尔能让我的母亲为我坐姿，劝说她暂时放下家务，我会珍惜描绘我如此熟悉的个体的想法。凭借她世俗的智慧，这位大家长式的人物喜欢开玩笑、八卦和偶尔喝一杯。她尤其喜欢看我打板球，在1970年代，她和我的好朋友艺术家鲁斯金·斯皮尔在观看一个夏日比赛时喝了一瓶苏格兰威士忌。毋庸置说，他们都很享受比赛。


    ![](img/b8a900b8373e949117f531b00685f281_89_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_90_0.png)


    ## NARRATIVE


    讲述故事是绘画图片的最古老原因之一，叙事绘画在艺术史上或多或少地出现过。早期的叙事画家在壁画中讲述圣经故事。乔托在十四世纪是先驱者，用真实生活人物描绘故事。卡拉瓦乔以超现实主义震惊众人，场景常取自恐怖故事，如现代电影静帧。维多利亚时代的画家沉迷于道德寓言，每幅画都讲述一个故事。斯坦利·斯宾塞画了他自己对诸如复活日等事件的古怪幻象，充满了非凡的细节。保拉·雷戈给我们带来令人不安的图像，带有性与虐待的底色，供我们解读。


    随着英国非具象艺术的到来，叙事绘画在前卫艺术家中变得带有贬义的标签，但也许正因为我们强烈的文学倾向，叙事主题在二十世纪我们所见的艺术运动的继承中一直保持着恒定的存在，尽管被边缘化。爱德华·布拉的1930年代的大型水彩画，常以大尺幅呈现，向我们展示了哈莱姆的底层生活场景，以及酒吧、俱乐部和咖啡馆里的可疑活动。二战期间，爱德华·鲍登、托马斯·亨内尔和埃里克·拉维里厄斯作为战争艺术家，绘制了精美的记录武装部队在国内外活动的素描。


    我喜欢讲述故事的绘画，那些你需要阅读的绘画，通过揭示起初没有注意到的东西而奖励更长时间的凝视。有时这类画作具有模糊或神秘的主题，邀请观众与绘画互动，例如肯·基夫的水彩画。艺术家乐于为观众留下开放的空间，让观众按自己的喜好解读画面，并根据自己的想象做出回应。


    JUNE BERRY


    左：EDWARD DUNCAN，《逼近的残骸》（局部），水彩和厚涂水彩，29 x 58.5 cm（11.5 x 23 in）


    ![](img/b8a900b8373e949117f531b00685f281_92_0.png)


    ## JANE CARPANINI

    ### DAME LAURA KNIGHT (1877–1970): *女孩化妆车*


    戴姆·劳拉·奈特是周围世界充满激情的记录者，从未像观察她的 subjects 沉浸在工作过程时那样。


    我母亲在战争期间在滚珠轴承工厂工作，记得被派到车间嘈杂喧闹的地方去收集时间表。在那里，她看到戴姆·劳拉·奈特弯腰在画架前，被尖叫的机器包围，在持续的细微油滴雾中工作。无论她是在记录男人用油布擦手，还是表演者化妆或后台等待，她都在
    subjects 的毫不自知中找到了尊严和优雅。


    ![](img/b8a900b8373e949117f531b00685f281_93_0.png)


    探索那种随意性的机会促使我创作了威尼斯歌剧节中普通演员的系列画作。制作的规模往往意味着数百人的演员阵容，其中许多人出现在各种场景中，手持长矛或横幅，或仅仅代表群众旁观者、士兵、廷臣、阴谋者等等。幕间他们在竞技场外墙的布拉广场聚集在安静的小组中，偶尔退入拱门下的房间去取头盔或斗篷，或由一群
    wardrobe 女管家检查。


    而以竞技场建筑为背景。我实际上是在观察他们追求那种毫不费力的风格，即他们所说的‘bella figura’，几乎是一种表演艺术，其最高赞誉是一次赞赏的目光。


    尽管最初被夜景的色彩和戏剧性所吸引，但不久我就发现这些年轻人天生对展示的概念感到舒适，并且在金色道具中摆出慵懒戏剧化的姿势时完全无意识。


    戴姆·劳拉·奈特的表演者被捕捉在那些为创造戏剧魔术而进行的亲密准备时刻。我的这些年轻意大利人对此毫无区别：在他们心中，表演和散步无缝融合。


    ![](img/b8a900b8373e949117f531b00685f281_94_0.png)


    对面：DAME LAURA KNIGHT RA，《女孩化妆车》，水彩和粉彩，52 x 34 cm（20.5 x 13.4 in）

    上方：JANE CARPANINI，《威尼斯 – ‘等待“ Nessun Dorma ”’》，2004，46 x 38 cm（18 x 15 in）


    ## DAVID REMFRY

    ### DAME LAURA KNIGHT (1877–1970): 女孩化妆车


    ![](img/b8a900b8373e949117f531b00685f281_95_0.png)


    这是劳拉·奈特的一幅非常吸引人的素描。素描在看似简单的构造中令人满意，在坚实的素描功底的支撑下具有力量。


    前景人物虽然不写实，却是真实的，具有重量和性格。右边的那位传达了令人惊叹的笨拙，几乎是无意识的、优雅不足的性感，这在非值班的表演者或舞者身上经常可见。她像舞者一样站立，被画得几乎像裸体，躯干左侧的线条延续穿过裙子，臀部以简单但精致的方式定义，具有最感性的方式。


    在女孩脖颈后部和弯曲的发际线的素描中，有一种惊人的温柔。左边的那位几乎像马蒂斯，特别是上半身，下半身似乎更坚实，腿部观察得非常漂亮。奈特与法国大师相比毫不逊色。


    主题显然是艺术家深爱的对象，我完全可以理解为什么。1995年我来到纽约居住，那时脱衣舞和歌舞表演节目 resurgence。跟百老汇无关，这些节目从大胆到淫秽又有趣，常常在非法（无执照）的场所进行，总有人在看警察。


    后来，在朱利亚尼的清理下，做非法但有趣的事情变得更加困难。我住的切尔西酒店附近有一家酒吧，叫 Billy''s Topless。富有创造性的 Billy 通过去掉撇号，把酒吧的名字改成
    ‘Billy Stopless’，为自己争取了额外的几年时间。


    23街上有一家偶尔营业的俱乐部，我开始画表演者。他们会拜访工作室，然后在多年里，我会画他们的素描。我一直对表演者和舞者着迷；对我来说，他们提供了理想的题材，有几乎用之不竭的处理方式。


