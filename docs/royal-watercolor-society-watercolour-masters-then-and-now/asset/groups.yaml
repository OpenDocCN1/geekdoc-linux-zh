    # LIZ BUTLER


    # ALBERT GOODWIN (1845–1932): Glastonbury


    ![](img/b8a900b8373e949117f531b00685f281_127_0.png)


    I have always admired Albert Goodwin''s evocative landscapes. He paints with spirituality
    drawn from nature that he shares with Samuel Palmer and the Pre-Raphaelite artists,
    with whom he is associated. Like Palmer he attempted to preserve, with integrity,
    his youthful passion in the presence of nature for all his working life. His artistic
    ability and aims never faltered, and he was painting exceptional and unique paintings
    until his death at eighty-seven, remaining uninfluenced by any of the art movements
    of the twentieth century.


    He trained under Arthur Hughes, whom he met as a young boy on a sketching trip
    to his local woods, and later under Ford Madox Brown. He developed a friendship
    with Ruskin, whom he accompanied on several trips to Europe. He was a hard task-master
    to himself and achieved amazing technical virtuosity in the use of watercolour,
    developing exceptional skill at combining washing, hatching and scraping out,
    something he may have learned from studying Turner''s watercolours which he greatly
    admired.


    It is his very individual composition, however, that makes his work so instantly
    recognisable. He is very fond of steeply rising or plunging vistas, and uses uninterrupted
    expanses of emptiness within a composition to add dynamism.


    > The Spectator of 3rd May 1879 said of Albert Goodwin: ''[He has a] peculiar
    faculty of painting a natural scene with an undercurrent of supernatural feeling.''


    In his painting of Glastonbury, which I have chosen as my inspiration, he uses
    Glastonbury Tor as a viewing place. He makes us giddy by perching on the steep
    hillside, from where we are encouraged to look down the slope, and into the valley.
    We move like birds, sweeping over the low hill, and across the Somerset Levels
    towards the horizon, where we catch the last light of the day in the glowing sky
    and setting sun. The mood of the painting is of an almost arrested stillness and
    it glows with a curious inward intensity. On close inspection, the large areas
    of hillside, which appear to be a single colour, are made up of thousands of minuscule
    brush marks of many colours. The figures in this painting are very much a part
    of the composition. They are there to add scale, and perhaps to witness his passion
    for the natural phenomenon of nature in this extraordinary landscape. The entry
    in his diary for 12 October 1909 reads: ''I have been thinking, how much joy I
    have had ever since I was little in the colour of the evening and morning sky
    and what delights thousands have in the same thing.''


    In my painting, I chose to stand on a hill as a viewing place, with my back to
    the summit, my eye could sweep over the contoured landscape down to the Vale of
    Clywd and on into infinity. It was a wintry afternoon with a lukewarm sun setting;
    I was captivated by the chilly blue shadows, describing the gentle undulations
    of the landscape and with the small glowing patches of snow reflecting warmth
    from the hazy sun, here and there. There was an amazing tranquillity that afternoon
    and no noise of wind. I purposefully restricted the number of colours I used and
    included uninterrupted expanses of nothingness to help me recreate the harmonious
    atmosphere I had experienced that day.'
