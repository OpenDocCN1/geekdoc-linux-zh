    read German philosophy and art history at the Universities of Cologne, Florence
    and Bonn and later studied painting at the Fachhochschule für Kunst und Design
    in Cologne. In 1980 she moved to England where her work found greater appreciation.
    She painted both landscape and still life: ''I become particularly fond of certain
