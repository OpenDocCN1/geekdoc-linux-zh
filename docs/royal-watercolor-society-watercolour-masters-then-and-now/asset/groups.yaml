    ![](img/b8a900b8373e949117f531b00685f281_67_0.png)


    ## 绘画


    ''Draw'' 是一个词源微妙的词。其定义在《牛津简明英语词典》中占据了整整两页，而其中只有一小部分与我们这里讨论的主题有关。想想放浴缸水、领取薪水，或是一些艺术家更出名的做法——拔开软木塞。在英国水彩的早期，所有水彩画都被称为“drawings”；“paintings”指的是油画，那种成熟、官方的媒介，用于装饰富裕、显赫的绅士、贵族和显贵们的墙壁上的作品。有时，即便现在，人们也会听到那些“correct”的评论员和拍卖行称水彩画家狡黠的晕染为“drawings”。


    但水彩画家自己如何看待“drawing”呢？它是指使用线条或阴影来琢磨问题，例如：''How does that arm join the shoulder...''
    那些花瓣是如何卷曲的？还是像建筑师的工作图纸或工程师的展示那样进行规划和设计？各种各样的制图都是绘画，即使现在是在电脑上完成的，图形和大量插图也是如此。水彩媒介涵盖了所有这些形式，我们在我们的
    Diploma Collection 中可以看到对船舶 rigging 和气象观测的精确记录。有时作品邀请我们沉溺于幻想或一厢情愿的想法。对《Beatrice》来说，对我而言，清晰地理解线条中的人物形象很重要。一旦确定这一点，就使组装其余画面变得清晰了一些。如同
    McEvoy 的画作，我使用了不同程度的线条来强调特定区域。例如，可以在用来表现右臂的线条中看到这一点。通过这样做，它赋予画面深度并有助于构图，引领视线几乎以锯齿状的运动穿过绘画。这也是
    McEvoy 绘画的另一个方面，线条在此被极好地运用。


    通过分解画作制作过程，我们对技法有了更清晰的理解，这可以帮助许多艺术家创作新画作。最终，我希望创作出一幅能够捕捉我在 McEvoy 的《Beatrice》中发现的那种即时感和流畅感的图像。

