    Both paintings, associated with shipping, have water creeping up in the foreground
    and a pale view in the distance, and are framed with uprights of stark concrete.
    My buildings are a menagerie of warped and twisted metallic shapes and secret
    enclaves slowly filling with garbage. The paintings are linked by the silence
    that comes before and after a devastating event.


    ![](img/b8a900b8373e949117f531b00685f281_146_0.png)


    Opposite: SIR WILLIAM RUSSELL FLINT RA, Incoming Tide, No.1 Slip, Devonport Dockyard,
    watercolour over graphite, 48.7 x 66 cm (19.2 x 26 in)

    Above: TOM GAMBLE, The Aftermath, 2004, watercolour over graphite, 42 x 55 cm
    (26 x 21.8 in)


    ## MICHAEL CHAPLIN


    ### SIR WILLIAM RUSSELL FLINT (1880-1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard


    ![](img/b8a900b8373e949117f531b00685f281_147_0.png)


    A visit to a distillery always sounds like a good idea and mine was no exception.
    It offered insight into a process that I knew little about and I think that any
    artist should put themselves in the way of new and interesting visual experiences.
    My tour of the Barcelona Cave factory offered a wealth of information, some of
    it about the technique of wine production but, more excitingly, more about the
    extremes of visual material: from a glimpse of vines curving away in perspective
    across soft Spanish hills to the sudden darkness of five layers of cellars full
    of maturing wine cool in both temperature and colour. Arriving back at the production
    rooms at ground level, I was greeted by an explosion of warm light and colour
    bathing the ancient vats, casks and wicker baskets. The echoes between the vaulted
    architecture and the graceful curves of the objects intrigued me.


    Clues as to how to deal with this subject lay in an interior painting, which is
    almost the same age as myself: Sir William Russell Flint’s Devonport Dockyard
    (now in the RWS Diploma Collection), for many years one of my favourite pictures.
    It was painted in 1941, and a few days later the dockyard was damaged by enemy
    bombing – an irony considering the air of calm which seems to pervade the painting.
    This is perhaps due to Flint’s decision to make this an almost monochromatic piece.


    Above: SIR WILLIAM RUSSELL FLINT RA, Incoming Tide, No. 1 Slip, Devonport Dockyard,
    watercolour over graphite, 48.7 x 66 cm (19.2 x 26 in) Below & opposite: MICHAEL
    CHAPLIN, Codornieu Distillery, 2004, watercolour, 51 x 61 cm (20 x 24 in)


    The scene is shown as subtle recessive tone and the structuring of the paint varies
    from soft broken edges in the superstructure to the one or two points of hard
    narrative interest at the far end of the building. The foreground is decisive
    in its handling, with the lapping waves introducing a curving counterpoint to
    the strictly regulated geometry of the architecture. I hope some of these compositional
    devices – the use of monochrome, the balancing of hard and soft areas and the
    warm palette – also work in my painting to communicate an intimate experience.


    ![](img/b8a900b8373e949117f531b00685f281_147_1.png)


    ## KEN HOWARD


    ### SIR WILLIAM RUSSELL FLINT (1880–1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard


    ![](img/b8a900b8373e949117f531b00685f281_149_0.png)


    Sir William Russell Flint’s Incoming Tide, No. 1 Slip, Devonport Dockyard has
    many points of resonance for me. Firstly the subject, which is industrial, clearly
    illustrates the beauty which can be found in such situations; I myself started
    by painting industrial landscapes in North London. The railway sidings of Neasden
    and Cricklewood gave me the opportunity to reveal the beauty to be found in everyday
    subjects. I am quite sure the non-painter, on entering Flint’s Dockyard, would
    not naturally recognize its beauty without having seen this brilliant watercolour.
    When I first went to India it was not the exotic architecture and people that
    inspired me, but the dirty railway sidings, the working locomotives, the steam
    and the smoke.


    On that trip I learnt that in painting and drawing it is the particular observation
    that matters. On seeing one of my watercolours, the head of the Indian Railways
    informed me that the train in my painting had just had its boiler cleaned. When
    asked how he knew he said it was only when fired up after such a clean that the
    smoke appeared as it did in my watercolour. This gave me a great thrill for I
    had painted a particular truth, not a generalization.


    Speed is of the essence with watercolour and I love to feel that a work has been
    done at a hundred miles an hour. This gives it vitality and excitement, and of
    course with industrial subjects there is always the threat that the train will
    leave or a boat will suddenly arrive in the shed.


    ![](img/b8a900b8373e949117f531b00685f281_149_1.png)


    Being a tonal painter, this Russell Flint touches me because of the expression
    of light through tonal contrast. There is no bright colour – only rich earth colour,
    which has always appealed to me. His use of umbers, siennas and ochres are in
    the tradition of early watercolourists such as my favourite, John Sell Cotman,
    on whom I wrote my dissertation at the Royal College of Art.


    ![](img/b8a900b8373e949117f531b00685f281_150_0.png)


    Opposite, left: SIR WILLIAM RUSSELL FLINT RA, Incoming Tide, No.7 Slip, Devonport
    Dockyard, watercolour over graphite, 48.7 x 66 cm (19.2 x 26 in)

    Opposite, right: KEN HOWARD, Jhansi Loco, 1984, watercolour, 13 x 18 cm (5 x 7
    in)

    Above: KEN HOWARD, Steam and Smoke, Jhansi, 1984, watercolour, 38 x 56 cm (15
    x 22 in)


