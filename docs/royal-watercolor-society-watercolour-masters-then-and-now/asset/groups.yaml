    奈特出生于诺丁汉郡的朗伊顿。她的父亲没有固定的职业，她在母亲的影响下成为艺术家，母亲曾陷入困境，始终渴望更好的生活。她在诺丁汉艺术学校学习，在那里遇到了她的丈夫、艺术家哈罗德·奈特；他们一起成为约克郡斯坦斯和康沃尔的艺术社群的一员。迪亚吉列夫允许奈特绘制他的芭蕾舞团，无论是在舞台上还是幕后，她还上课以更好地理解舞者。她还与伯特兰·米尔斯的马戏团合作。她更喜欢在户外作画，对吉普赛人的游牧生活充满吸引力，并将一辆旧劳斯莱斯改装成迷你工作室，以便与他们一起工作。1946年，她前往纽伦堡绘制纳粹战犯审判的图像记录。她性格张扬、精力充沛，居住在圣约翰伍德，她的派对闻名遐迩。‘Dame
    Laura, in her own estimation, is no housewife.’ ‘Why pretend... I have lived in
    too many caravans, tents, corners of dressing-rooms to care.’ (The Times).


    ## SYDNEY LEE RA (1866-1949)


    ARWS 1942, RWS 1945


    李出生于曼彻斯特，是棉纺工的儿子。李在曼彻斯特艺术学校和巴黎的科拉罗西工作室学习。他早年取得成功并获得许多奖项。他广泛游历欧洲，其题材主要为城镇景象和风景。李在多种媒介上多才多艺，尤其在印刷技术方面（他是木刻家协会的创始成员）。‘Boatbuilding’
    (page 108)，可能是一幅习作而非成品，体现了他对画面结构的兴趣。1922年他当选为皇家美术学院院士，后担任财务主管，但1938年以两票之差未能当选主席。他只是在生命的最后阶段才成为皇家水彩画学会的成员。《泰晤士报》上的讣告似乎不必要地严厉。比较这个人和他的作品让人联想到艺术史上并不罕见的补偿努力，仿佛他试图通过大胆有力地构建画面来克服某种性格上的羞怯，而且他常常以对画面内容而言过大尺度作画。


    ## JOHN HENRY LORIMER (1836-1936)


    ARWS 1908, RWS 1932


    洛里默出生于爱丁堡，是爱丁堡大学公法教授之子。家族的夏季居所是菲夫的凯利城堡，现由苏格兰国家信托基金拥有。他在爱丁堡学院和大学接受教育，在皇家苏格兰美术学院学校师从威廉·麦克塔加特，在巴黎师从卡洛斯·杜兰学习艺术。他早期的作品集中于肖像和花卉，后来成为室内画家。他的作品始终关注光线和色彩价值的效果。洛里默的油画
    The Ordination of the Elders in a Scottish Kirk (National Gallery of Scotland)
    曾被描述为 ‘one of the most national pictures ever painted’ Sir J. C. ... 但他的作品通常关注中产阶级的精致生活，‘the
    graceful side of life’。洛里默是法国学院的通讯院士，他的作品在那里很受欢迎。去世后，他的继承人以如果他把钱留给学会就不能神志清醒为由，unsuccessfully
    争议他对皇家水彩画学会的遗赠。


    ## ARTHUR AMBROSE McEVoy ARA (1878-1927)


    ARWS 1926


    麦克沃伊出生于威尔特郡的克鲁德韦尔。他的父亲曾在美国内战中为南方邦联军队服役，是潜艇战方面的权威，也是惠斯勒的朋友。十五岁时，麦克沃伊进入伦敦斯莱德美术学院，在那里他与奥古斯都·约翰成为密友，并与格温·约翰有过一段风暴般的恋情。西克特是他后期的一个重要影响。麦克沃伊是他那个时代最受追捧的肖像画家之一，尤其擅长描绘时尚女性，但他也创作了一系列精湛的海军军官和士兵肖像，他们曾获得维多利亚十字勋章，现藏于帝国战争博物馆。他偏爱半身像。麦克沃伊是
    ‘a portrait painter of exquisite taste and subtle interpretation’；风格上松散自由，偶尔他的露珠般的虹彩会淡入雾的苍白湮灭’
