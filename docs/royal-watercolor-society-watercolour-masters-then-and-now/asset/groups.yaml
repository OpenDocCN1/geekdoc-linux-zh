    # JOHN NEWBERRY


    # CHARLES BENTLEY (1806-1854): *Sailing Barge Near Dover*


    ![](img/b8a900b8373e949117f531b00685f281_109_0.png)


    Charles Bentley has a special quality. He combines observed natural subject matter
    with lucid watercolour technique. An ordinary sailing barge off Dover Beach becomes
    exciting because of the way it is painted. This picture was an obvious choice.
    I have been working on the Kent coast around Deal and have used this view with
    Shakespeare Cliff several times. The beach has not changed but


    parked container lorries behind it now replace the thousands of commercial and
    naval vessels which once thronged these waters. Today there are a few longshore
    fisherman, groups of yachts and the endless stream of huge car ferries coming
    in and out of Dover Harbour.


    Bentley was one of a group of topographical painters stemming from Bonington’s
    activities in Paris, who included Thomas Shotter Boys and the Callows. Their pictures
    were full of light. They used clear washes, bright colour and many surface devices
    such as scraping and thumbprints to achieve spontaneity. Though it is unlikely
    that this work was painted on the beach, surely sketches were drawn there. The
    reflection of the cliff on the top of the waves must have been observed.


    ![](img/b8a900b8373e949117f531b00685f281_109_1.png)


    My own picture was completed on the spot, in one sitting. I try to present the
    whole scene as a unity: sea, sky and light as they were on that afternoon. I too,
    scrape, with the brush handle, through wet paint; I use pressure from palm or
    fingertip to give texture and I use a variety of smudgings and liftings, all in
    the cause of speed to finish before things change. My ideal is summed up in the
    words Delacroix wrote about his friend Bonington:


    > *That lightness of touch which particularly in watercolours makes his pictures
    as it were like diamonds that delight the eye, quite independently of their subject,
    or of any representational qualities.*'
