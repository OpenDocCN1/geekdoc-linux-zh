    # MICHAEL CHAPLIN


    # SIR WILLIAM RUSSELL FLINT (1880-1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard


    ![](img/b8a900b8373e949117f531b00685f281_147_0.png)


    A visit to a distillery always sounds like a good idea and mine was no exception.
    It offered insight into a process that I knew little about and I think that any
    artist should put themselves in the way of new and interesting visual experiences.
    My tour of the Barcelona Cave factory offered a wealth of information, some of
    it about the technique of wine production but, more excitingly, more about the
    extremes of visual material: from a glimpse of vines curving away in perspective


    across soft Spanish hills to the sudden darkness of five layers of cellars full
    of maturing wine cool in both temperature and colour. Arriving back at the production
    rooms at ground level, I was greeted by an explosion of warm light and colour
    bathing the ancient vats, casks and wicker baskets. The echoes between the vaulted
    architecture and the graceful curves of the objects intrigued me.


    Clues as to how to deal with this subject lay in an interior painting, which is
    almost the same age as myself: Sir William Russell Flint’s Devonport Dockyard
    (now in the RWS Diploma Collection), for many years one of my favourite pictures.
    It was painted in 1941, and a few days later the dockyard was damaged by enemy
    bombing – an irony considering the air of calm which seems to pervade the painting.
    This is perhaps due to Flint’s decision to make this an almost monochromatic piece.


    Above: SIR WILLIAM RUSSELL FLINT RA, Incoming Tide, No. 1 Slip, Devonport Dockyard,
    watercolour over graphite, 48.7 x 66 cm (19.2 x 26 in) Below & opposite: MICHAEL
    CHAPLIN, Codornieu Distillery, 2004, watercolour, 51 x 61 cm (20 x 24 in)


    The scene is shown as subtle recessive tone and the structuring of the paint varies
    from soft broken edges in the superstructure to the one or two points of hard
    narrative interest at the far end of the building. The foreground is decisive
    in its handling, with the lapping waves introducing a curving counterpoint to
    the strictly regulated geometry of the architecture. I hope some of these compositional
    devices – the use of monochrome, the balancing of hard and soft areas and the
    warm palette – also work in my painting to communicate an intimate experience.


    ![](img/b8a900b8373e949117f531b00685f281_147_1.png)'
