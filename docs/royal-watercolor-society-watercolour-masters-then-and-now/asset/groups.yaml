    # # COLOUR


    William Blake said, ‘Energyc is eternal delight’, and, as a painter, I would add
    that colour is its conduit.


    No artist used colour, and, in particular, watercolour so skillfully, so boldly,
    so joyously, so inventively as our own J M W Turner (1775–1851). So much is this
    so that his genius introduced overtly all the abstract principles that have always
    been the underlay of good art. With his diaphanous brilliance of colour he achieved
    mood and atmosphere in terms of coloured light. He sought basically to achieve
    expression via the forceful orchestration of pure colour, making pictorial works
    that were not mere formal imitations but also reconciled the abstract with the
    particular.


    The history of painting is, after all, the story of colour. A juxtaposition of
    colours can captivate us, usually the warm tones fill us with joy, the cool ones
    can induce sober meditation or dolorous thought. Here one is reminded of Mark
    Rothko’s final major set of works made not long before his suicide. Their dark
    intensity of colour provides a background, a sort of mysterious iconic ‘imagery’
    hidden in their depths, poetic and serene. We are drawn in and try to understand
    his journey, the dark night of the soul.


    Clearly, artists hold sway. Colour is a tool, a weapon, a balm. Its rejuvenating
    properties make fine physic and, upon recognizing this, one can go along with
    Bob Dylan and say ‘But I was so much older then, I’m younger than that now’.


    SONIA LAWSON RA, RWS, HON. RWA'
