    # JUNE BERRY


    ARTHUR MELVILLE (1858-1904): Arabs Returning from Burning a Village


    I was instantly drawn to Arthnr Melville’s painting by its rich, intense colour.
    Studying it more closely, it wasn’t just the colour but the very loose style of
    painting and those characteristically blobby patches either of white or some strong
    dark colour that excited me. Some areas appear sponged out to the same degree
    that others are saturated with powerful colour – a technique described by a contemporary
    critic as ‘blotowsque and stamy’ and as composed of “dabs, blurs and splashes
    of paint” by the art critic of the *Daily Chronicle*. To my eye the painting has
    a very modern appearance compared with works by the group of painters Melville
    was associated with   the Glasgow Boys.


    After studying in Paris and travelling and painting in the Middle East for a couple
    of years, Melville returned to Scotland and soon after moved to London. Here he
    began to develop what became his late watercolour technique.


    ![](img/b8a900b8373e949117f531b00685f281_20_0.png)


    My paintings in response to *Arabs Returning from Burning a Village* are obviously
    not concerned with the subject matter, but with following Melville’s technique,
    working on very wet paper, using various stages of drying to add further layers
    of colour, sponging out unnecessary detail and using these sponged-out areas tonally
    as part of the composition.


    It has always been my way of working to paint in the studio from memory, using
    drawings made on the spot and photographic reference to make more or less invented
    compositions, so I was interested to learn that Melville accumulated a huge store
    of sketches and drawings on his travels in Egypt and Turkey which he continued
    to use as reference for finished paintings created in the studio almost until
    his early death twenty years later. Some paintings were worked up accurately from
    sketches and others were semi-imaginary from memory.


    He worked on saturated paper, sometimes on the floor with pools of colour and
    vigorous brush marks, sponging out superfluous detail. Sometimes he flooded the
    background in with umba to establish the tone and when it was almost dry, added
    full bright patches of colour. He invented a unique method of preparing his paper
    by saturating it over and over again with Chinese white, finally rinsing it to
    leave a specially prepared surface. When I tried this procedure I found it made
    sponging out very easy, leaving a brilliant white, but the preparation was a tedious
    process.


    Melville was interested, as I am, in the ideas of the symbolists, particularly
    Whistler, and their doctrine, as defined by Gauguin, that drama and memory are
    ultimately more important than observation of the ‘real’ world as practised by
    the Impressionists.


    Returning to Melville’s technique, someone said to me ‘what you’re talking about
    sounds really simple’, but as anyone who has tried it will know, it is a great
    challenge to control big brushfuls of colour dropped onto soaking wet paper, and
    it can be such a pleasurable achievement when it works out well.'
  - '[PAGE 21]


    # KAROLINA LARUSDOTTIR ROBERTS


    ARTHUR MEIVILLE (1858 - 1904): Arabs Returning from Burning a Village


    When I think of the RWS and all the wonderful works I have seen there over the
    years, there are many that are as alive with me and as fresh as the day I first
    saw them. It is strange how some paintings seem to have a long-lasting impact
    over and above the others.


    The painting I have chosen out of the Diploma Collection is Arthur Melville''s
    *Arabs Returning from Burning a Village*, (1922). I still remember seeing it for
    the first time. Its fluidity of composition, the stunning simplicity of colours
    and the bright light makes this a very memorable painting. Without being too obvious,
    the people seem to blend into the landscape almost as if they were part of it.
    It looks light and atry and the brushstrokes seem deceptively easy but it comes
    together to make one of my favourite paintings. The essence is captured, not the
    detail. The figures merge into the scenery, hardly distinguishable as figures
    but undeniably so. The boldness and simplicity of the application of the watercolour
    adds to the effectivenss of the painting.


    So much is understood about the landscape, as much from the information given
    as from the absence of detail - the heat in the ground, the dry air, the midday
    sun, lack of shelter and the sense of distance and space. Within the dry rock,
    there is a small area of green, which should provide a sense of rest and refreshment,
    but then we realise this is the area under attack and we can feel the villager''s
    isolation.


    ![](img/b8a900b8373e949117f531b00685f281_21_0.png)


    The ambiguity of the painting appeals. I am given a certain amount of information
    but my mind and imagination must also work to make its own conclusion. The most
    obvious parallels between Melville''s painting and my own is of course the subject
    matter of people in landscape. This has always been an interest of mine, perhaps
    growing up in Iceland makes this easy to understand. As an Icelander, the landscape
    is all pervading. Every aspect of life in Iceland is affected by the land and
    the extreme weather conditions.


    The figures in both paintings have a very special relationship with the landscape.
    They understand it, they live with it, on it and from it and they also understand
    its dangers.'
  - '[PAGE 22]


    ![](img/b8a900b8373e949117f531b00685f281_22_0.png)'
  - '[PAGE 23]


    # TOM COATES


    JOHN SINGER SARGENT (1856–1925): *Bed of a Glacier Torrent*


    It must be said that the John Singer Sargent in the RWS collection is not the
    greatest painting of the artist we all admire. He once described his work as being
    merely snapshots, but he is being rather flippant; it tells us, however, about
    the modesty of the man who was always in demand for his portraits. Sargent’s varied
    collections of watercolours show off his techniques to the full, with uses of
    warm and cold colours in opposite ways. When people use a cold colour for shadows,
    he cheeks us by using a hot one or a mixture, blending colours together, counteracting
    brightness with a pure, unadulterated spectrum of rainbow pureness.


    ![](img/b8a900b8373e949117f531b00685f281_23_0.png)'
  - '[PAGE 24]


    ![](img/b8a900b8373e949117f531b00685f281_24_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_24_1.png)


    Having broken away from the confinement of portraiture, the wide subject matter
    shows Sargent as a tour-de-force, as does his collection of watercolours at the
    Imperial War Museum. They all show his flair for working with fast, loose strokes.


    There are many quotes on Sargent by writers, poets and most of all patrons of
    high esteem. As Evan Charteris wrote in 1927: ''To live with Sargent''s watercolours,
    is to live with sunshine captured and held with the lustre of a bright legible
    world the refulent shade and the ambient arduors of the noon''.


    The countless journeys that Sargent made with friends is something we have in
    common. The sketchbook page shows Mary Jackson, who always collects children around
    her with her warmth and generosity. It was done during a trip to Morocco, and
    the multi-coloured background gives the theatre of a backdrop.


    Another page from the Moroccan sketchbook shows a rapid attack on the subject
    with quick, loose strokes and the shadows exploding into dark browns with a mixture
    of blues.


    It takes a lifetime of practice to be a painter, but a short time to attack a
    subject with the flair of Sargent. To try to mimic him is a dangerous thing, but
    he helps us to enjoy the exploration of the watercolour medium. To become excited
    by another technique can only be open to an experienced practitioner; whether
    he be an oil painter, or even a sculptor.


    You don''t find watercolour, it finds you; it''s used to enhance a sketchbook
    page, but it''s a wonderful individual medium that finds the strengths and weaknesses
    of the artist.'
