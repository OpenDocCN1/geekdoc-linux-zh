    room. The triangular gap left between the curtains, echo the table legs, forming
    another triangle, leading on to the flowers, which form the focal point and bridge
    with the exterior. I also try building a mood through related shapes in constructing
    my pictures. A framework of static shapes complemented by the curvilinear forms
    of nature can act as markers in a spatial sense, also compositionally when shapes
    are repeated.


    Colour can be used to create mood beyond the naturalistic: it can be used to reinforce
    a direction, giving a picture vibrancy. I try to orchestrate my palette by limiting
    my colour range around a pair of complementary colours, like yellow and purple,
    adding only small amounts of a few other colours.


    I rarely paint direct from the subject but start by making studies from situations
    I feel instinctively drawn to, often working from several viewpoints. Further
    drawings to select the right composition will follow before I feel confident to
    begin on the painting in my studio. I feel that this detachment from my subject’s
    starting off point is vital to the creative process. The uncertain conditions
    of local light and its effects can blur the mind and inhibit the imagination.


    The painting *Bedroom Window* by Percy Jowett depicts part of a small room, but
    suggests a larger vista beyond the partly opened window in a powerful, evocative
    work. The vase of flowers fills much of the window space and draws the spectator
    outward to the bigger world beyond this modest'
