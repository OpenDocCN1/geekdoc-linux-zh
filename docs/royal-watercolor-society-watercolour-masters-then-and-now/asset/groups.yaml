    # JAMES RUSHTON


    # SAMUEL PALMER (1805-1881): Shady Quiet


    I first came across Samuel Palmer in a little illustrated book called British
    Romantic Artists by John Piper, published in 1942. In it was a coloured illustration
    of a painting by Palmer called Harvest Moon. This painting haunted me so much
    that I was soon making drawings using crayon and watercolour in the manner of
    Palmer.


    ![](img/b8a900b8373e949117f531b00685f281_113_0.png)


    A year or two before the War, my parents rented a bungalow in a fold in the hills
    of North Staffordshire, at a place called Ashley. Even before seeing the Palmer,
    this place held a magic for me which I couldn''t describe: his work seemed to
    articulate what I already felt. Up to that point I had no knowledge of painters
    and painting, so the impact was especially strong.


    I have always loved the monochrome paintings of the Shoreham period, which gave
    stark emphasis to those ''piled mountains of light'' of which he was so fond and,
    achieved an intensity that was never repeated and could not be sustained.


    In ensuing years I learned more about him. His son wrote: ''his imagination led
    him far away from beaten tracks. mysterious shadows shortening before a rising
    moon, the cut edge of standing corn - these were realities that gave substance
    to his visions'', and Palmer wrote himself: ''Nor must be forgotten the motley
    clouding, the fine meshes, the Arial tissues that dapple the skies of Spring nor
    the rolling volumes and piled mountains of light.''


    The painting in the Diploma Collection is a later work, very different from the
    solemnity of the monochromes. All is drenched in golden light, and is a lovely
    example of how technique and feeling meld together. It is the work of a unique
    and distinct personality.


    This is part of the exquisite description of his own work. It could have been
    written by Thomas Traherne, the seventeenth-century mystic who, I think, had much
    in common with Palmer. He wrote: ''The corn was orient and immortal wheat, which
    never should be reaped, nor was ever sown. I thought it had stood from everlasting
    to everlasting.''


    Finally, a word about my own painting, Whisper Lane. I almost always use watercolour
    and gouache, a method I would guess to have been favoured by Palmer. I also tend
    to paint places and situations which have a very particular meaning for me, more
    often than not from memory: part fact, part invention. Whisper Lane is more fact
    than invention, and it is a revered part of my childhood. It pleases me to think
    that it has something of Palmer about it.'
