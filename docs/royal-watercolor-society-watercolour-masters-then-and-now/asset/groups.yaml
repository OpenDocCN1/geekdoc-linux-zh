    # AKASH BHATT


    # ARTHUR AMBROSE McEVOY (1878-1927): Beatrice


    Beatrice by Arthur Ambrose McEvoy appealed to me through the spontaneous quality
    of his use of line and paint. McEvoy''s painting, at first glance, gives the impression
    of a loose, quickly executed image. On closer inspection, it reveals expert draughtsmanship
    and a strong use of line. The painting is masked by loose brushstrokes and areas
    of paint running down over the image. However, underneath we can see the delicate
    attention given to both the sitter''s face and the way she is seated. This gives
    the painting its overall strength. This picture is a good example of the strong
    drawing skills that are fundamental to any successful work.


    ![](img/b8a900b8373e949117f531b00685f281_73_0.png)


    My aim in my own work was to try and convey as much as possible, using line and
    detail sparingly, thereby removing the need for any unnecessary information. My
    interest also lies in the surface quality of the paint and I often employ vigorous
    techniques to produce a ground that is suitable to work on.


    In tackling my own response to Beatrice it was important for me to have a clear
    understanding of the figure in line. Once this was established it made the process
    of putting the rest of the picture together somewhat clearer. As in McEvoy''s
    picture I used varying degrees of line to place emphasis on particular areas.
    This can be seen, for example, in the lines used to show the right arm. By doing
    this it gives the picture depth and contributes to the composition, leading the
    eye through the painting in an almost zigzag motion. This is another aspect of
    McEvoy''s painting where the line is used to great effect.


    By breaking down the process of the way a picture was made, this gives us a clearer
    understanding of the technique, and this can help many artists to create new paintings.
    Ultimately, I wanted to create an image that captures the sense of immediacy and
    fluidity that I found in McEvoy''s Beatrice.'
