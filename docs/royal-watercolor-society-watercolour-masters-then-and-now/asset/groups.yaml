    # ROLAND VIVIAN PITCHFORTH RA 1895-1982


    ARWS 1957, RWS 1958


    Pitchforth was born in Wakefield in Yorkshire and trained at Wakefield and Leeds
    Schools of Art and the Royal College of Art. Not interested in innovation, he
    held that ''a profound belief in draughtsmanship is essential''. He was particularly
    sensitive to atmospheric effects and often worked out of doors in the evening
    when watercolours done on the spot were finer than those done during the day:
    the dew falling on the paper helped the brush to move with greater facility. A
    pure translucent water-colour is a nicer, or one wash, which means putting down
    90% of your subject at one go. In 1913 Pitchforth joined the Royal Garrison Artillery
    160 pounders; and, as a result of his war service, eventually became stone deaf,
    carrying with him a note pad to communicate. During World War II he was appointed
    by the War Artists'' Advisory Committee to make records of Civil Defence, war
    industries, and events in Africa, India, Burma and Ceylon. ''Pitch'' was an ebullient
    figure and a stimulating teacher: his hobbies throughout his life were sailing,
    billiards and chess.


    # SAMUEL PROUT 1783-1852


    OWS 1819


    Prout was born in Plymouth, the son of a clothier and naval outfitter. After sunstroke
    in childhood he suffered disabling ill health all his life and for many years
    he was forced to spend one or two days in bed every week. Prout had little formal
    training but learnt his trade working for the antiquarian publisher John Britton.
    Rather than being a landscape painter, his work comes out of the eighteenth-century
    topographical tradition of artists who selected their views on account of their
    historical or human associations, and most of his drawings include groups of figures
    going about their daily business. After the end of the Napoleonic wars, Prout
    made a number of continental sketching tours; these resulted in the many studies
    of Gothic architecture for which he is best known and which earned him the sobriquet
    ''Brussels Prout''. His vision of Europe made a deep impression on contemporary
    English imagination. According to Ruskin, Prout made Venice ''peculiarly his own'':
    ''I had not the least idea of the beauty and accuracy of those sketches of Venice
    ... so touchingly accurate are they, that my wife who looks back to Venice with
    great regret, actually and fairly burst into tears over them, and I was obliged
    to take them away from her.'' In 1828 Prout was appointed Painter in Water Colours
    in Ordinary to George IV. He died from an apoplectic fit after a birthday party
    given by Ruskin''s parents for their son, which oddly, Ruskin himself did not
    attend.


    # ARTHUR RACKHAM 1867-1939


    ARWS 1902, RWS 1908


    Rackham was born in Lambeth in London. His father was a clerk at the Admiralty.
    At school he won drawing prizes but a journey to Australia on account of his health
    gave him time to practise both drawing and painting. On his return he enrolled
    at the Lambeth School of Art while still working as a junior clerk in the Westminster
    Fire Office from 1885 to 1892. However, he longed to be a professional artist;
    later he wrote: ''In the nursery, at school and then during the long years when
    the office stool was my lot, my paint


    box was as impatient as I for the freedom of the holidays''. Subsequently


    Rackham worked as an illustrator for magazines and the colour illustrated books
    made possible by recent developments in colour printing for which he is most widely
    known. Rackham''s artistic bent was for the fantastical and strange, which could
    be either exquisitely whimsical or oddly cruel, like his Diploma work, I Bargain
    with the Devil (page 111) drawn to illustrate a short story by James Morrison
    called ''The Seller of Hate''. His nephew, the writer Walter Starkie, believed
    that Rackham was himself a goblin ''in his shabby blue suit and carpet slippers,
    hopping about the studio with a palette on one arm, waving a paintbrush in one
    hand.'' His final illustration was of Rat and Mole collecting a boat for a picnic
    in Kenneth Grahame''s Wind in the Willows.


    # THOMAS MILES RICHARDSON, JUNIOR (1813-1890)


    ARWS 1843, RWS 1851


    Richardson was born in Newcastle-upon-Tyne where his father, who was also an artist,
    initiated the first Fine Art Exhibition in the North of England in 1822, and later
    founded the Newcastle Water-Colour Society. Thomas Miles Richardson Junior moved
    to London in 1813. In all he exhibited 702 works during his years with the Society,
    where his rather brightly coloured panoramic views of Scottish and continental
    scenery proved popular. Ruskin wrote that he seemed ''always to conceive a Highland
    landscape only as a rich medley of the same materials ... the whole contemplated
    under the cheering effects of champagne, and considered every way delightful.''
    His smaller sketches, such as Noah''s Ark, Evening page 134, are considered better.
    Richardson combined his work as an artist with that of a photographer. In November
    1853 he was taking several calotypes, an early form of photography, a day at his
    home in Radnor Place, Hyde Park, and the earliest photographs in the Society''s
    archives are his portraits of a number of its members.


    # JOHN SINGER SARGENT RA 1856-1925


    ARWS 1904, RWS 1908


    Sargent was born in Florence, the son of wealthy American parents, and studied
    art in Italy and Paris. He had immense success as a portrait painter in oils until,
    bored by the work, he turned to watercolour which offered new possibilities of
    subject and style. Sargent was elected to the RWS at the height of his reputation
    although his work was described as likely to embarrass the other members by its
    obvious superiority. ''The labour of sketches hanging round [his drawing] kept
    empty seats filled compared with the titanic force of Mr. Sargent''s sketches.
    Cosmopolitan, reserved and hating flattery, he was described by Henry James as
    ''excited to his fingertips'', although he was happiest among intimate friends
    and family. Immensely energetic, Sargent travelled and worked ceaselessly, undeterred
    by difficulty of place or circumstances, as in Bed of a Glacier Torrent page 20,
    which was painted in the Val d''Aosta in Italy. ''I saw him working on a steep
    mountain side [where] Adrian Stokes] the branch of a torrent rushing down his
    feet, one of which was on stones piled up in the water. Several umbrellas were
    anchored round about him to keep off reflections.'''
