    the less exacting subjects: for a start it stays still. But then the problems
    begin. To turn a building into a work of art is not so easy; one has to make an
    inanimate object come alive, full of texture, light and shade. It is one of the
    paradoxes so often encountered in drawing that one draws inanimate subjects as
    though they are alive, and living subjects with a structure as firm as a building.


    Very carefully with a sharp pencil and do not press too heavily - one may have
    to alter the drawing later. For in the end it must not be too tight but have freedom
    and breadth so the architecture sits happily in its surroundings.


    To succeed in drawing architecture depends upon accuracy, the endless fight to
    establish lines in their right place. The human eye can measure quite accurately
    up and down and from left to right. Imagine a grid of lines on your paper so that
    you can crosscheck continuously the details in your drawing. Are they in their
    right place? Measure the distance with a compass held to the eye - a drawing should
    expand outwards like a widening blot of ink on a blotter. Do this


    Corot listed three main elements in a work of art: composition, tone and colour.
    He listed them in that order of importance; today colour is more often regarded
    as the most important factor, but I think Corot was right. Finally, rules are
    there only to be broken. The most important ingredient in a work of art is love.
    Without love, enthusiasm and passion, all is a desert. For how can one thrill
    an audience unless one is thrilled oneself?


    ![](img/b8a900b8373e949117f531b00685f281_52_0.png)


    Opposite: JOHN SELL COTMAN, Cader Idris from Bodnant, North Wales, watercolour,
    36.2 x 53.6 cm (14.3 x 21.1 in) [coll. Provost and Fellows of Eton College]


    Above: JOHN DOYLE, St Matthews, Wareham, Kent, 2005, watercolour


    ## SHEILA FINDLAY


    JOHN HENRY LORIMER (1856–1937): *Table by the Window with Peaches and Pears*


    > ‘What I dream of is an art of balance, purity and serenity, devoid of troubling
    or depressing subject matter … something like a good armchair which provides relaxation
    from physical fatigue.’ (Henri Matisse).


    Matisse’s ideas expressed in his 1908 essay, ‘Notes on a Painter’, wonderfully
    evoke the harmonious design and domestic pleasures that we find celebrated in
    his paintings. Matisse’s modernist aesthetic is rooted in the late-nineteenth-century
    cult of domesticity, which also informs the work of John Henry Lorimer, those
    watercolour I have chosen to discuss.


    ![](img/b8a900b8373e949117f531b00685f281_53_0.png)


    A contemporary of the Glasgow Boys, Lorimer attended Carolus Duran’s Atelier in
    Paris, after training under William McGillogart and G P Chalmers at the Royal
    Scottish Academy in Edinburgh. The image of the interior flooded the art and design
    journals of the day. Inspired by his experience in France and by influential Americans
    like John Singer Sargent and James Abbott McNeill Whistler, Lorimer’s genre paintings
    of the Scottish home, and intimate scenes of domestic incident, reflected an international
    trend.


    In *Table by the Window with Peaches and Pears* the charm of the scene is underpinned
    by a strong sense of design. The round table, chair, and window frame serve as
    bold compositional devices, while the simple grouping of the still life, the fruit
    and flowers, and the doves at the window, add to the decorative effect. A brother
    of the influential architect Sir Robert Lorimer, architectural elements feature
    in Lorimer’s work and spatial structures and framing devices initiate an interior/exterior
    dialogue.


    Lorimer divided his time between England and Scotland, finally deciding to settle
    in Edinburgh. Views from my studio in Edinburgh, where I spend part of each year,
    can be seen in the painting I include here. Like Lorimer, I paint my immediate
    surroundings and everyday objects. Whereas Lorimer used subtly graded colour,
    favouring gentle schemes of cream, yellow and orange or deep browns and reds.
    I build up the composition using distinct areas of colour, working to establish
    a sense of atmosphere and balance. Contrasting busy and calm components I make
    adjustments, guided by a concern for pictorial effect rather than realistic transcription.
    In *Round Table by the Window*, rounded and rectilinear elements are repeated
    throughout the composition. The shapes of the table and window are echoed in the
    fruit and chequered mat; the details in the artwork on the wall and the domed
    architecture beyond.


    ![](img/b8a900b8373e949117f531b00685f281_54_0.png)


    Opposite **JOHN HENRY LORIMER**, *Table by the Window with Peaches and Pears*,
    watercolour, bodycolour and graphite, 35.6 x 27 cm (14 x 10.6 in)


    Above: **SHEILA FINDLAY**, *Round table by the Window, 2005*, watercolour and
    gouache, 75 x 106 cm (29.5 x 42 in)

