    ## ROYAL WATERCOLOUR SOCIETY


    ## WATERCOLOUR MASTERS - THEN & NOW


    FOREWORD BY HRH THE PRINCE OF WALES


    The Royal Watercolour Society possesses one of the most important existing collections
    of watercolours – the RWS Diploma Collection. In 1860, the members of the RWS
    Council proposed that, following the example of the Royal Academy, each newly
    elected member should give a painting to the Society; after 1882 when Diplomas
    signed by Queen Victoria were given to new members, these pictures became known
    as Diploma Works. The RWS had also been given works by members elected at an earlier
    date, and a fine collection began to take shape. It now includes works by many
    famous names such as David Cox, Peter De Wint, Samuel Palmer, Edward Burne-Jones,
    Laura Knight, John Singer Sargent and William Russell Flint.


    To create this beautifully presented book the members of this prestigious Society
    have looked through their collection, and each member has chosen a work that personally
    and particularly inspires them. They have then generated works of their own that
    reflect that inspiration. Their revealing essays give the reasons for their choice,
    discuss the methods that their chosen artist appears to have used, and the ways
    in which those techniques compare with their own.


    *Watercolour Masters: Then and Now* showcases the most inspirational paintings,
    especially chosen or created, as well as useful and revealing insights from leading
    artists. The book is divided into five sections: composition, colour, tone, draughtsmanship,
    and creating a narrative, with each artist focusing on the theme that best explains
    the appeal of their chosen picture. A unique journey into the minds of the masters
    of watercolour, past and present, *Watercolour Masters* is sure to delight anyone
    interested in this medium.


