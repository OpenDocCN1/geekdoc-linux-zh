    上方：SIR WILLIAM RUSSELL FLINT RA，《Incoming Tide, No.1 Slip, Devonport Dockyard》，石墨上水彩，48.7
    x 66 cm（19.2 x 26 in）下方及对面：MICHAEL CHAPLIN，《Codornieu Distillery》，2004年，水彩，51
    x 61 cm（20 x 24 in）


    场景以微妙的退让性色调呈现，颜料的结构从上层建筑中柔和破碎的边缘变化到建筑远端一两个硬性的叙事焦点。前景处理果断，拍岸的波浪为建筑严格规整的几何形态引入了曲线式的对位。我希望这些构图手法——单色调的使用、硬与软区域的平衡以及温暖的调色板——也能在我的画作中发挥作用，以传达一种亲密的体验。


