    # DRAWING


    ''Draw'' is a word with a tricky derivation. Its definition occupies two whole
    pages in the Oxford Shorter English Dictionary, with only a fraction of the entry
    concerned with our subject here. Think of drawing a bath, drawing a salary or,
    what some artists have been more famous for, drawing a cork. In the early years
    of English watercolour, all watercolours were called ''drawings''; ''paintings''
    were in oil, the grown-up, official medium for the products that adorned the walls
    of the established well-to-do, aristocrats and grandees. Sometimes, even now,
    one hears the ''correct'' commentator and the auction houses call the watercolourist''s
    wily washes ''drawings''.


    But how do watercolourists themselves think of ''drawing''? Is it the use of lines
    or shading to puzzle things out, such as: ''How does that arm join the shoulder...''
    how do those petals curl? Or is it to plan and design like architects'' working
    plans or engineers'' presentations? Mapping of all kinds is drawing, even if done
    now on a computer, as are graphics and much illustration. The watercolour medium
    encompasses all of these forms, and we see in our Diploma Collection exact records
    of the rigging of ships and meteorological observations. Sometimes we are invited
    by the works to indulge in flights of fancy or wishful thinking; and literary
    conceits rub shoulders with visual catalogues of farmyard minutiae. And, of course,
    lovely buildings appear again and again.


    The learned and highly sensitive John Ruskin prefaced his 360-page manual The
    Elements of Drawing (1857) with this remark:


    > ''It may perhaps be thought, that in prefacing a manual of drawing, I ought
    to expatiate on the reasons why drawing should be learned; but these reasons appear
    to me so many and so weighty, that I cannot quickly state or enforce them.''


    Never a man who could be accused of levity, 190 pages later he says to the reader
    who has followed his instructions thus far:


    > ''You may, in the time which other vocations leave at your disposal, produce
    finished, beautiful, and masterly drawings in light and shade. But to colour well
    requires your life. It cannot be done cheaper.''


    PAUL NEWLAND


    Left: LIONAL BULMER, Greengrocer''s Shop (detail), watercolour, pen and ink and
    wash, 28 x 39.5 cm (11 x 15.5 in)'
