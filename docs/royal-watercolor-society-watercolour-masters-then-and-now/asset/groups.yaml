    life was a favourite subject for Jowett and his best work has a strong sense of
    rhythm and colour. Jowett spent much of his life as a teacher and administrator,
    becoming Principal of the Royal College of Art from 1935 to 1948, but he could
    seem a remote figure and during the war years he gave the impression that he thought
