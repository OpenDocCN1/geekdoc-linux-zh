    two figures in the boat who look out in opposite directions. I hope their physical
    closeness and the curving lines of their bodies echo something of the intensity
    of Tuke’s *Green Water*.


    I paint the sea viewed from the shoreline, while Tuke’s floating studio enabled
    him to look in any direction. The cove, seen from the water, forms the backdrop
    to his painting and becomes a band of violets and pinks at the top of the image.
    This pictorial structure offered a significant departure from my usual blue sky.
    I placed a wedge of earth colours at the top edge of the sea in *Leaping Fish*,
    using bone black, verdigris and French ochre pigments. This changed the light
    in my work radically and created a more intimate atmosphere.


    ![](img/b8a900b8373e949117f531b00685f281_99_0.png)


    Above: HENRY SCOTT TUKE RA, *Green Water*, watercolour and bodycolour, 29.5 x
    45.3 cm (11.7 x 18 in)

    Opposite: DAVID BRAYNE, *Leaping Fish*, watercolour, raw pigment and acrylic gel
    on paper, 25 x 30 cm (10 x 12 in)


    ## ALFRED DANIELS


    ### SIDNEY CURNOW VOSPER (1866-1942): *The Weaver*


    One of the watercolours in the RWS Diploma Collection that impressed me most is
    *The Weaver* because it tells a story about a person doing something valuable.
    I admire it also because since leaving the Royal College of Art all my paintings
    have mainly been concerned with people, how they look, and what they do at work
    and play. I am basically a subject painter that ranges from sport and industry
    to social commentary.


    ![](img/b8a900b8373e949117f531b00685f281_101_0.png)


    It was the result of a long visit to Italy during my last year at college that
    I discovered the delights of murals in public buildings and churches, the painted
    *cassoni* (marriage chests) and paintings in tempera and fresco. All of them told
    stories about people and events. My admiration was such that after graduation
    I spent two years as a postgraduate studying mural design. I was fortunate to
    have as my tutors Kenneth Rowntree and Ruskin Spear, the latter getting me my
    first commission to paint five murals in the Hammersmith Town Hall, which still
    exist today. This was followed by murals and large paintings all concerned with
    printing, heavy industry, transport, fishing and farming.


    I have found that watercolour and acrylic are the ideal media in which to research
    and compose in readiness for paintings in oil, alkyd and acrylic. I tend not to
    paint in situ but research my subjects using pastel pencils and crayons, as painting
    in watercolour on the spot is time-consuming and awkward. I prefer to complete
    my watercolours in the studio, and I imagine that Vosper did much the same.


    ## SALLIANN PUTMAN


    ### SIDNEY CURNOW VOSPER (1866-1942): The Weaver


    ![](img/b8a900b8373e949117f531b00685f281_103_0.png)


    When I paint it is the abstract qualities that excite me – the colour, the composition
    and the paint itself. My work in watercolour is generally on a small scale. I
    want to draw the viewer into a private world.


    Sidney Curnow Vosper''s little painting The Weaver is an intense study of one
    man preoccupied with the task in hand. It is an intimate space that he works in.
    The floor is tilted towards the viewer, providing a ''stage'' for the real subject
    of the work, namely the beautiful still life with its rhythms and fascinating
    relationships. The dark background also works to direct our attention to those
    vessels. Vosper has taken the ordinary and made out of it something extraordinary,
    a kind of visual music. This quiet corner, this private space has been translated
    into a symphony of quiet, close tones; there is no drama here. But there is a
    richness of colour and touch.


    ![](img/b8a900b8373e949117f531b00685f281_103_1.png)


    I make drawings of the landscape and then use them in the studio, where I can
    be free to interpret them. To me colour must be an emotional response. I have
    never forgotten my first encounter with a painting by Mark Rothko. I was so moved
    by the colour; indeed my attitude to its use changed radically after that experience.
    Like Vosper, I do not seek to make a drama. I enjoy using close tones striving
    to create poetic relationships. Very often my landscapes are tilted up, like a
    Bonnard tabletop. My skies become narrow bands. Vast open landscape does not draw
    me. I grew up in London where buildings blotted out most of the sky. So here in
    Red Landscape there is a quietness, with colour being orchestrated to emphasise
    this. The dark sky serves to direct the eye over the entire picture. I am painting
    my feelings here, and those feelings have more to do with paint than with landscape.


    My work always refers to nature – even my seemingly non-figurative pieces. Close
    Encounter Blue Forms was painted from a small study made on the beach at Aldeburgh.
    The objects have lost their identity because I zoomed in so closely on them. Here
    the forms occupy a shallow space, as does the interior in the Vosper painting.
    They hover according to their intensity and colour. Generally the tones are close.
    I am not ''tied'' to a recognizable subject and so I can be free to concentrate
    on the colour and mark. As soon as I make a mark, or place a colour, then the
    painting has its own life and makes its own demands. It is my concern as a painter
    to respond to those demands. I have placed the small red area because the painting
    needed it. Perhaps Vosper placed the blue on the man''s trousers for the same
    reason.

