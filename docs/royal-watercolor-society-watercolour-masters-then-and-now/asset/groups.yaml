    ## SIMON PIERSE

    ### ARTHUR MELVILLE (1858-1904): Arabs Returning from Burning a Village


    What struck me about this painting when I first saw it was the extraordinary freshness
    of its execution and the way that Melville had used large – almost tachiste –
    blots of flat colour. It looks unfinished in a way, but the structure is all there
    and reveals how the artist relied on firm drawing to underpin a very free technique.
    It was only afterwards that I read the title and was slightly taken aback by its
    hint of violence. I wonder whether this is an event that the artist witnessed
    or perhaps just imagined.


    ![](img/b8a900b8373e949117f531b00685f281_17_0.png)


    In my homage to Melville I laid down colours and then flooded the paper with Chinese
    white – as he often did and scrawled away at the surface in an attempt to convey
    the dazzle of desert light and to imply a sense of movement. Melville was adept
    at catching the scorching midday heat of southern Spain or North Africa, and I
    wanted to put something of that into my own watercolours of central Australia
    and New Mexico.


    Returning from the Telegraph Station, Alice Springs draws obliquely on the memory
    of a journey to the Northern Territory with my wife over ten years ago. One afternoon
    we walked in the soporific heat back from the historic telegraph station of Alice
    Springs, along the dried up Todd River bed, our eyes almost shut tight against
    the blinding desert light. It was a moment when I felt a sudden sense of revelation
    in passing through an ancient landscape, a sense of being far less permanent than
    the rocks and trees around me. It is not a topographical painting, although the
    particular spot that I painted is certainly identifiable. Nor is it a painting
    that could have been done on location: I find that the thirsty desert air of central
    Australia drinks my watercolours off the palette before I have a chance to apply
    them in large washes. I prefer instead to make drawings and take photographs as
    an aide-mémoire to something that is felt as well as seen.


    ![](img/b8a900b8373e949117f531b00685f281_17_1.png)


    Travelling in New Mexico a few years ago I visited some of the places that had
    inspired American artist Georgia O''Keeffe (1887-1986). The White Place or Plaza
    Blanca, near O''Keeffe''s home in Abiquiu, is a strangely eroded landscape of
    white sediment cliffs and towers topped by capstones. It is a primeval place and
    one where I had a strong sensation of the imprint of O''Keeffe''s presence still
    upon it. In Georgia O''Keeffe returning from White Place I imagined the artist
    wandering back to her studio to paint after a walk through the bleached canyons
    of Plaza Blanca. My painting is an attempt at capturing this spirit of place as
    well as another opportunity to try out Melville''s technique. I first applied
    a ground of Chinese white mixed with some Naples yellow. Once this slightly chalky
    layer had dried, I painted the stones on top, which caused the edges of them to
    bleed slightly, creating a series of almost abstract blots that can be read either
    as marks on the surface or as elements in the landscape.


