    Cambridge, he was called to the Bar in 1899. A stammer made it difficult for him
    to present cases so he practised as a conveyancer at Lincoln''s Inn. Subsequently
    he worked at the Home Office in connection with Sinn Fein prisoners interned in
    England and with the employment of conscientious objectors. Hunt had no formal
    artistic training, although he went on sketching tours with Frank Brangwyn and
    Alfred East. After 1919 he devoted himself entirely to art. A member of the Alpine
    Club and an occasional climber, his finest work is inspired by his love of mountains
    - the Alps and Dolomites as well as mountains in Spain and America. Even the simplest
    mountain face or ridge a mile or two away is full of exquisite details, all apparently
    well defined. But when you try to draw one of these details, you cannot discover
    where it begins or end or runs into another. He also painted flowers and industrial
    scenes and wrote on art and law. Hunt served as a Vice President of the RWS from
    1930 to 1933.


    # WILLIAM HENRY HUNT (1790 1864)


    AOWS 1824, OWS 1826


    Hunt was born in London, the son of a tin-plate work and japanner. One of his
    uncles recorded that his ''nevy, little Billy Hunt ... was always a poor cripple,
    and as he was fit for nothing, they made an artist of him.'' After working as
    a scene painter he found success as a professional artist by following contemporary
    fashion closely: he moved from topographical scenes to ones of human interest
    and finally the still lifes for which he was best known (Ruskin regarded him as
    the greatest ever painter of still life). Hunt''s habit of including birds'' nests
    within his compositions as tours-de-force earned him the sobriquet ''Bird''s Nest
    Hunt''. His studio was described by Walter Sickert in 1910 as ''a little box lit
    from above that cannot have been more than seven foot square''. Hunt was regarded
    as one of the most important painters of his day and his work - which anticipates
    the Pre-Raphaelites - was hugely influential. At the Paris Universal Exhibition
    of 1855 his pictures sold for more than those of Ingres and Delacroix but Hunt''s
    reputation was at its height at the time of his death and it has never regained
    its pre-eminence.


    # DAVID MICHAEL JONES (''DAI GREATCOAT'') (1895-1974)


    Hon RWS 1960


    Jones was born in Brockwell in Kent, the son of a printer from Holywell in Flintshire
    from whom he learnt some Welsh. He trained at the Camberwell School of Arts and
    Crafts and subsequently at the Westminster School of Art. During World War I he
    enlisted in the Royal Welch Fusiliers and was wounded in the leg in Mamert in
    the Somme. His war experiences inspired his poem ''In Parentheses'', which won
    the 1938 Hawthornden Prize. Although Jones''s work draws on many influences from
    William Blake to Wassily Kandinsky, his artistic vision is unmistakably his own.
    Intellectually and emotionally Jones is inspired by his feeling for nature, as
    in Afon Honddu Fach, above Capel-y-ffin (page 78), which invokes ''the intimate
    creatureliness of living''. He also cared deeply about his Celtic heritage (on
    his walls he hung ordnance survey maps of Roman and Dark Ages Britain). As a Catholic
    convert, he was also deeply concerned with religion: ''Man, sacrament at every
    turn and all levels of the profane'' and ''sacred'', in the trivial and in the
    profound, no escape from sacrament.'' He was greatly loved by his intimates but
    he was eccentric and suffered from mental illness.


    # PERCY HAGUE JOWETT (1882 1957)


    ARWS 1936, RWS 1938


    Jowett was born at Bishop Monkton near Ripon in Yorkshire, the son of the headmaster
    of the village school. He trained at the Harrogate Technical Institute, the Leeds
    School of Art and the Royal College of Art from where he gained the Prix de Rome
    travelling scholarship. In Italy he met the author Arnold Bennett who introduced
    him into influential circles. During World War I Jowett (who was known as ''PJ'')
    served in the Royal Artillery. In 1920 he was invited to join the Seven and Five
    Society of painters and sculptors, the most important group of artists of the
    post-war period, but was voted out of the Society in 1954. In 1923 he helped found
    the Modern English Watercolour Society which was dedicated to ''the probity of
    drawing as the essential understructure of any watercolour'', but this soon failed
    and many of its members subsequently joined the RWS. Influenced by Cézanne, still
    life was a favourite subject for Jowett and his best work has a strong sense of
    rhythm and colour. Jowett spent much of his life as a teacher and administrator,
    becoming Principal of the Royal College of Art from 1935 to 1948, but he could
    seem a remote figure and during the war years he gave the impression that he thought
    his male students would be better employed fighting. He was awarded the CBE in
    1948.


    # DAME LAURA KNIGHT RA (1877 1970)


    ARWS 1909, RWS 1928


    Knight was born at Long Eaton in Nottinghamshire. Her father had no settled occupation
    and she became an artist under the influence of her mother, who had fallen on
    hard times and always longed for a better life. She studied at Nottingham School
    of Art, where she met her husband, the artist Harold Knight; together they became
    part of artistic communities in Staines in Yorkshire and in Cornwall. Diaghilev
    allowed Knight to draw his ballet company, both on stage and behind the scenes,
    and she took lessons in order to understand the dancers better. She also worked
    with Bertram Mills'' Circus. Preferring to paint in the open, she was attracted
    by the nomadic lives of gypsies and fitted up an old Rolls-Royce as a miniature
    studio in order to work with them. In 1946 she went to Nuremberg to paint a pictorial
    record of the trial of the Nazi war criminals. Flamboyant and immensely energetic,
    she lived in St John''s Wood where her parties were legendary. ''Dame Laura, in
    her own estimation, is no housewife.'' ''Why pretend... I have lived in too many
    caravans, tents, corners of dressing-rooms to care.'' (The Times).


