  - '[PAGE 55]


    # SARAH HOLLIDAY


    SAMUEL PROUT (1783–1852): The Doges Palace and the Grand Canal, Venice


    Prout’s painting is hypnotic and graceful. The eye is led through the painting
    to Santa Maria della Salute in the distance, and back again, with layers of tone
    swinging you gently from side to side. The horizontal lights and darks are so
    clever, with the punctuations of his beautifully drawn figures preventing you
    from being led out of the picture. Everywhere, he has used the device of light
    against dark, and dark against light, never letting a passage become dull and
    predictable. Then, against all this geometry, there is the graceful curve in the
    sky


    counterbalancing the formality of his tonal wizardry. All of this revolves around
    the still, solitary figure standing in the centre mid-ground. Oh, it is so clever!


    ![](img/b8a900b8373e949117f531b00685f281_55_0.png)


    These are the things that I love to explore when painting, and Strangé Meeting
    is a contemporary take on this very subject. Like Prout, I have chosen an important
    architectural setting: the new Paternoster Square development near St Paul’s Cathedral.
    My interests are the same, but the end result is completely different. The space
    I have created is more mysterious and unconventional. The imagery comes originally
    from the drapes and scaffolding that shroud new buildings. However, these become
    a device for carving out space. The lights and darks of the poles define the spaces
    behind them, with the tower of Christ Church peering through it all, in the way
    that Prout uses Santa Maria della Salute. My curving line hopefully does the same
    as his curving clouds, to give a grace and fluidity to the whole thing. Groups
    of people pepper Prout’s Venetian square,


    giving it scale. My twenty-first-century figure does the same thing, and the carved
    letters remain from a previous age – Samuel Prout’s, maybe?


    The whole painting is built up with layers of watercolour and gouache, literally
    carving out the lights and darks, and playing the game of counterchange, which
    I admire so much in Prout’s great work.'
  - '[PAGE 56]


    ![](img/b8a900b8373e949117f531b00685f281_56_0.png)'
  - '[PAGE 57]


    # WENDY JACOB


    ALFRED DOWNING FRIPP (1822-1895): San Rocco Olevano


    I have chosen *San Rocco Olevano* by Alfred Downing Fripp. I paint the landscape,
    usually featuring buildings, quite often on my travels in France or Italy. In
    brilliant sun, I struggle with the wonderful but unfamiliar tonal values. I find
    myself using more and more body-colour to achieve the brilliance of the reflected
    light, or making the paintings very jumpy with exaggerated dark shadows. In this
    painting Fripp uses close pale tones and yet the painting is powerful and strong,
    pulsating with heat. Could I achieve this effect by keeping his painting in mind
    while attempting a similar subject?


    ![](img/b8a900b8373e949117f531b00685f281_57_0.png)'
  - '[PAGE 58]


    ![](img/b8a900b8373e949117f531b00685f281_58_0.png)


    Well, I tried, when recently I spent ten days in France. I started with several
    fairly detailed sketchbook drawings, taking particular note of the tonal values
    and time of day. Back at the house, choosing the strongest of the drawings, the
    paintings were‌laied down with thin washes marking the broad structure. Returning
    to the subject the next day at the same time with paints allowed for corrections
    and alterations using bodycolour along with the watercolour. Working on several
    paintings of different subjects, one in the morning, and others at midday and
    in the evening, blessed with good weather and enough time to allow for thought,
    I groped towards a resolution. I washed out and repainted areas,


    editing the subject, trying to maintain simplicity. In the end, although I looked
    at Fripp’s painting regularly, my paintings don’t resemble his: but they wouldn’t
    have been the same without the framework of the task.


    My admiration for Fripp has grown: the deceptively simple, monumental composition
    where the church, glowing in the glaring heat, seems to be a part of the rocky
    landscape, is a sort of magical trick. I don’t know how he did it. A humbling
    experience, this sitting at the feet of a master, but one which gives rise to
    a new appreciation of all the elements which have to work together to make a painting
    live.'
  - '[PAGE 59]


    # JANET Q TRELOR


    ALFRED DOWNING FRIPP (1822–1895): *San Rocco Olevano*


    The selection of Alfred Downing Fripp’s work from the Diploma Collection was not
    difficult, for several reasons. The first is sentimental. Fripp was the great-grandfather
    of my husband, and himself the great-grandson of one of the founders of the (Old)
    Water Colour Society, Nicholas Pocock. Fripp was Secretary of the Society from
    1870 until his death in 1895.


    The second is that the subject matter is close to a current preoccupation and
    the basis of a recent exhibition of mine: ‘The Romanesque Arch as the Visual Language
    of Europe’.


    But the third, and most important reason is the strong composition underlying
    this work based on its three horizontal bands of colour: from a blue band just
    across the top quarter, through two absolutely equal and wider bands of white
    and yellow ochre occupying the remaining space. This breadth gives an abstract
    generosity which is broken by a series of verticals and interlocking triangles
    and squares, leading the viewer back to the main subject matter with the figures
    and the triangle of the shrine contained in the golden section, and then out again
    along the roof to the tower and back to the foreground. The tones are very close
    and the colour key high, so that the success of the work relies on a very simple
    but subtly organized composition. This use of horizontal bands of colour is something
    I have been exploring and which has become a recurring theme in my own work over
    the last few months.


    In his notes on the (Old) Water Colour Society exhibition of 1858, Ruskin makes
    these comments on this work:


    > ‘*That church of St. Olivano which looks so strange in its paleness among all
    the old-fashioned watercolours about it, has had its colours carefully matched
    with sunshine. Only it will never do to leave hard edges and thin washes if we
    are going to paint in that key. Treble notes must not be sharp and thin, the paler
    the tone of a picture the more sweet must be its textures, and the more subtle
    its gradations, else it will always look like a strange half finished sketch,
    not as this picture really is – a most truthful study of sunlight ... This goes
    nearly as far towards Italian noonday as poor paper and colour can reach.*’


    My new interpretation of Fripp’s work is based on a similar subject matter, a
    church facade at midday, but in a close-up, version, cutting out the landscape
    and figures which make the Fripp appear narrative, and concentrating instead on
    a more abstract sense of design. The area used is to the right of the tower and
    above the bottom one-third of the yellow foreground. I have used the horizontality
    of Fripp to make two bands, each occupying 50 percent of the work with the critical
    triangle being placed centrally instead of to one side. The sides of the triangle
    come down to enclose the two red squares of the outer


    ![](img/b8a900b8373e949117f531b00685f281_59_0.png)


    doors and the central red door replaces the figures as both the beginning and
    returning point of the image. The verticality of the tower is replaced by a warm
    wash with bodycolour over the left one-quarter of the paper, and the sun and shadow
    on the right by a slim vertical line indicating the tower of St Gilles. Warm ochre
    with bodycolour animates the cool underlying wash of the building surface, and
    cool blue lies over a warm wash on the upper half. The brushstrokes have been
    left as more evident, and I hope there is nothing sharp or thin that would upset
    Ruskin in this interpretation.'
  - '[PAGE 60]


    ![](img/b8a900b8373e949117f531b00685f281_60_0.png)


    Opposite: **ALFRED DOWNING FRIPP**, San Rocco Olevano, bodycolour and watercolour
    over graphite on grey paper, 39 x 53.5 cm (15.4 x 21.1 in)


    Above: **JANET TRELOAR**, St Gilles-du-Gard, near Arles, Provence, watercolour
    and bodycolour, 43 x 68 cm (35 x 27 in)'
