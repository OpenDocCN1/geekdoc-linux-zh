    \ from past experience. Sometimes I will create images from my imagination which\
    \ may be a forecast of things to come. At other times, I will make a transcription\
    \ of a particular work of art. If I were to make a painting from *Welsh Flood*\
    \ my colour would be tertiary, with flecks of secondaries and primaries trying\
    \ to survive as the storm stirs everything up.\n\nMy palette consists of seven\
    \ colours. I use two yellows – one cold, one warm – cadmium red, magenta, viridian\
