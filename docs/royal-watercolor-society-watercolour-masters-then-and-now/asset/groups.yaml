    # BERNARD BATCHELOR


    SAMUEL ‘LAMORNA’ BIRCH (1869–1955): *The Old Brig O’Dee*


    For me this is a great watercolour, I can return to it often. It is a cold day
    and you can feel the chilly breeze on your cheek whilst gazing at the snow-capped
    mountains in the distance, the wavelets slapping against the rocks in the foreground.
    The painting is full of atmosphere and all seemingly put down with great authority
    and skill. There is no hesitating or sponging out – just plain good work.


    In some ways there is a similarity in the handling and approach to that of J S
    Sargent – sort of big and broad. Perhaps it was because they were both in France
    during the 1890’s when the Impressionists were becoming celebrated rather than
    shunned. I think part of Birch’s training was in Paris about then – and of course
    this new style of painting and assessment, Impressionism, would have been of great
    interest to him and to Sargent; I am sure it greatly affected their work.


    Lamorna Birch was also apparently a keen fisherman and often took his rod and
    line with him when going painting. It occurs to me that if he had had a ‘bad day’
    at the painting (we all get them!) he could turn it into ‘a good day’ with the
    fishing rod!


    ![](img/b8a900b8373e949117f531b00685f281_97_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_97_1.png)


    In *Catch of the Day*, my ideas seem to have started simply as scribbles on the
    backs of envelopes. I decided to try and improve on just a scene of a fisherman
    and came upon the idea of a train coming over the bridge with the driver wanting
    to see the fish.


    Morbain (in Brittany) was a busy sort of place on one of those bright and breezy
    days when everything was dazzling sunshine and shadow everywhere. People were
    dashing about, shopping for the weekend – and above it all there was the railway
    viaduct. So I painted it in a breezy sort of way the very stuff of watercolour!


    Above, right: **SAMUEL ‘LAMORNA’ BIRCH** RA, *The Old Brig O’Dee*, watercolour
    and bodycolour over graphite, 37 x 55.5 cm (14.7 x 21.9 in)


    Above, left: **BERNARD BATCHELOR**, *Catch of the Day*, 2005, watercolour, 32
    x 42 cm (12.5 x 16.5 in)


    Opposite: **BERNARD BATCHELOR**, *Morlau*, watercolour, 35.5 x 27.5 cm (14 x 10.8
    in)'
