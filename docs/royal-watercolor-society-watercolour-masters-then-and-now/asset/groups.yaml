    ARWS 1902, RWS 1908


    Rackham was born in Lambeth in London. His father was a clerk at the Admiralty.
    At school he won drawing prizes but a journey to Australia on account of his health
    gave him time to practise both drawing and painting. On his return he enrolled
    at the Lambeth School of Art while still working as a junior clerk in the Westminster
    Fire Office from 1885 to 1892. However, he longed to be a professional artist;
    later he wrote: ''In the nursery, at school and then during the long years when
    the office stool was my lot, my paint box was as impatient as I for the freedom
    of the holidays''. Subsequently Rackham worked as an illustrator for magazines
    and the colour illustrated books made possible by recent developments in colour
    printing for which he is most widely known. Rackham''s artistic bent was for the
    fantastical and strange, which could be either exquisitely whimsical or oddly
    cruel, like his Diploma work, I Bargain with the Devil (page 111) drawn to illustrate
    a short story by James Morrison called ''The Seller of Hate''. His nephew, the
    writer Walter Starkie, believed that Rackham was himself a goblin ''in his shabby
    blue suit and carpet slippers, hopping about the studio with a palette on one
    arm, waving a paintbrush in one hand.'' His final illustration was of Rat and
    Mole collecting a boat for a picnic in Kenneth Grahame''s Wind in the Willows.


    ## THOMAS MILES RICHARDSON, JUNIOR (1813-1890)


    ARWS 1843, RWS 1851


    Richardson was born in Newcastle-upon-Tyne where his father, who was also an artist,
    initiated the first Fine Art Exhibition in the North of England in 1822, and later
    founded the Newcastle Water-Colour Society. Thomas Miles Richardson Junior moved
    to London in 1833. In all he exhibited 702 works during his years with the Society,
    where his rather brightly coloured panoramic views of Scottish and continental
    scenery proved popular. Ruskin wrote that he seemed ''always to conceive a Highland
    landscape only as a rich medley of the same materials ... the whole contemplated
    under the cheering effects of champagne, and considered every way delightful.''
    His smaller sketches, such as Noah''s Ark, Evening page 134, are considered better.
    Richardson combined his work as an artist with that of a photographer. In November
    1853 he was taking several calotypes, an early form of photography, a day at his
    home in Radnor Place, Hyde Park, and the earliest photographs in the Society''s
    archives are his portraits of a number of its members.


    ## JOHN SINGER SARGENT RA 1856-1925


    ARWS 1904, RWS 1908


    Sargent was born in Florence, the son of wealthy American parents, and studied
    art in Italy and Paris. He had immense success as a portrait painter in oils until,
    bored by the work, he turned to watercolour which offered new possibilities of
    subject and style. Sargent was elected to the RWS at the height of his reputation
    although his work was described as likely to embarrass the other members by its
    obvious superiority. ''The labour of sketches hanging round his drawing kept empty
    seats filled compared with the titanic force of Mr. Sargent''s sketches. Cosmopolitan,
    reserved and hating flattery, he was described by Henry James as ''excited to
    his fingertips'', although he was happiest among intimate friends and family.
    Immensely energetic, Sargent travelled and worked ceaselessly, undeterred by difficulty
    of place or circumstances, as in Bed of a Glacier Torrent page 20, which was painted
    in the Val d''Aosta in Italy. ''I saw him working on a steep mountain side where
    the branch of a torrent rushing down his feet, one of which was on stones piled
    up in the water. Several umbrellas were anchored round about him to keep off reflections.''


    ## ALAN SORRELL 1901-1974


    ARWS 1937, RWS 1942


    Sorrell was born at Tooting Graveney in south London, the son of a jeweller and
    watchmaker who was also an amateur artist. A sickly child, Alan spent much of
    his early youth in a bath chair. After studying at the Municipal School of Art
    at Southend-on-Sea, he worked briefly as a commercial artist before attending
    the Royal College of Art between 1924 and 1928. In 1928 Sorrell won the Prix de
    Rome in mural painting, enabling him to spend three years in Rome before returning
    to England to teach. His students called him ''Old Angles'' because of his insistence
    on form and structure. His Roman years were seminal to his work, in which a feeling
    for history and the ultimate frailty of the buildings made by man are constant
    themes. Sorrell was a neo-Romantic, and these themes were ideally suited to the
    years before and after World War II in which he was painting. His pictures are
    full of a brooding atmosphere of an aura of almost dream-like intensity. In 1936
    he began a series of reconstruction drawings in partnership with archaeologists,
    usually commissioned by the Ministry of Works. These drawings, which helped popularize
    British history, included prehistoric sites such as Stonehenge and Avebury, as
    well as Roman forts on Hadrian''s Wall and medieval castles and monasteries. Perhaps
    his most significant project was Nubia - a Drowning Land, the drawings he made
    in February and March 1962 for the London Illustrated News, which recorded the
    monuments that disappeared when the Aswan High Dam raised the level of the Nile.


    considered somewhat scandalous at the time. He also painted ships at sea with
    effects of fairylike delicacy. The Times and portraits. Aside from art, he also
    loved cricket, yacht racing he was commodore of the Falmouth Sailing Club and
    the novels of Robert Louis Stevenson. Beside his studio he constructed a netted
    cricket pitch and kept silver racing cups on the mantelpiece in the work room.
    A biographer, writing in a magazine, wrote: ''With black hair and a strong, manly
    face absolutely bronzed with the sun he looked every inch an athlete - certainly
    anything but a typical artist''.


    ## SIDNEY CURNOW VOSPER 1866-1942


    ARWS 1906, RWS 1914


    Vosper was born in Plymouth, the son of a brewer. The name Curnow is derived from
    Kernow or Cornish. ''I am not English but Cornish!'' he wrote. After three years
    in an architect''s office in Plymouth he abandoned his apprenticeship to go and
    study at the Académie Colarossi in Montparnasse in Paris until admiration for
    the work of Dagmar-Bouveret drew him to Britain. For twenty years Vosper continually
    returned to the village of Le Faouet, where he cut an eccentric figure, wearing
    knickerbockers and a coloured tie and riding a large green bicycle with his painting
    equipment strapped to the crossbar. However, his love of character and colour
    found scope in Britain and in its traditional crafts, such as spinning and rope-making,
    which were under threat of industrialization. He also learnt to speak the Breton
    language fluently. During World War I Vosper served with the French Red Cross
    and was an orderly in the Military Hospital at Nevers. ''An artist''s life is
    generally supposed to be uneventful, with no adventure in it,'' wrote Vosper in
    1945. ''Nothing can be further from the truth: that is if he be a water-colour
    painter just think of a moment of that white, unspoiled sheet of paper staring
    him in the face, waiting for the first touch of the brush ... Woe betide the man
    whose foot slips during this major operation he should be wearing rubber shoes.''


    ## JOHN REINHARD WEGUELIN 1849-1927


    ARWS 1894, RWS 1897


    Weguelin was born at South Stoke near Arundel in Sussex, the son of the rector,
    who was later to convert to Roman Catholicism and was obliged to give up his living.
    Several years of his boyhood were spent in Rome where he had art lessons; however,
    his teacher joined Garibaldi and was never heard from again. In 1860 Weguelin
    was sent to be educated at the Oratory School at Edgbaston under the future Cardinal
    Newman, and then started a career as a Lloyds underwriter. At the age of twenty-three
    he began to study art and for five years attended the Slade School of Art under
    Sir Edward Poynter and Alphonse Legros. His early works were classical fantasies
    greatly influenced by Sir Lawrence Alma-Tadema; his own genre, biblical and historical
    subjects, are never didactic in purpose. From 1893 onwards he worked exclusively
    in watercolour. Weguelin was a sensualist who took pleasure in painting the female
    figure, frequently nude. The critic of the Daily News of 28 April 1943, visiting
    the RWS Summer Exhibition, wrote of ''Mr Weguelin whose fancy is always at home
    in thoughts of the white, swift bodies of mermaids, dryads, nymphs at play in
    the solitude of the ancient earth.'' He also illustrated several volumes of poems
    and translations and wrote and illustrated short stories for the Graphic magazine.


    ## JOSEPH EDWARD SOUTHALL 1861-1941


    ARWS 1925, RWS 1931


    Southall was born in Nottingham into a Quaker family. After his father''s death
    his mother moved to Edgbaston, where Southall spent most of his life. Originally
    articled to a Birmingham architectural practice, he attended evening classes at
    the Birmingham School of Art and won prizes in national art competitions. He also
    fell under the influence of John Ruskin, who praised Southall''s work highly.
    In 1883 he spent eight weeks in Italy where he gained an appreciation of the Italian
    primitives as well as an interest in egg tempera painting. This led him in 1900
    to help found the Society of Painters in Tempera. Southall''s art is a fusion
    of medieval mannerisms, technique and, occasionally, subject matter with the clean
    individualism of Art Deco. Works such as A Cornish Haven (page 30) recall the
    travel posters of the interwar years. He loved to paint boats, and these non-contemporary
    sailing ships contribute towards the somewhat hallucinatory atmosphere of the
    picture. Holding to his inherited pacifist and radical sympathies all his life,
    Southall also served as chairman of the Birmingham Independent Labour Party and
    later the Edgbaston Labour Party.


    ## HENRY SCOTT TUKE RA 1858-1929


    ARWS 1904, RWS 1911


    Tuke was a Quaker from York where his great grandfather and father were doctors
    caring for the mentally ill. At the age of six he moved to Cornwall before studying
    at the Slade School of Art in London and in Paris and Florence. The subject matter
    of his paintings was, most typically, nude boys and boats; artistically what interested
    him was the effect of sunlight on flesh and water. In 1885 he returned to Cornwall
    where he spent the rest of his life, renting a cottage in a converted smelting
