    ![](img/b8a900b8373e949117f531b00685f281_36_0.png)


    Above: ANN WEGMÜLLER, Sailing Out, gouache, 40 x 36 cm (16 x 14 in)


    ## JANET GOLPHIN

    ### HELEN ALLINGHAM (1848–1926): *A Bit of Autumn Border*


    The rich, warm glow of colour captivates and enthralls the viewer. The colour
    of the flower border by twilight becomes the overriding element in an otherwise
    simple composition. There is no need for detail. It is a sight universally recognized
    and the familiarity already registered within the memory enables the viewer to
    complete the picture.


    At first glimpse, *A Bit of Autumn Border* has the impression of a beautiful embroidered
    piece of fabric placed over other layers. Looking at the painting upside down
    or sideways on, the abstract qualities work together beautifully; the distant
    trees could be foliage at a waters edge. The actual subject is immaterial; it
    is how we interpret the basic composition and how colour captures our attention
    and feeds the senses with bewitched, glowing warmth.


    *Amaryllis with Wall Hanging* demonstrates a similar simplicity of composition
    with no beginning or end, but an illusion of an ongoing scene beyond the picture’s
    edges. Areas of the painting are unfinished and detail is missing. There are vertical,
    horizontal and slightly diagonal lines, which again work in every direction.


    The darkest areas in my painting emulate the darkened foliage in Allingham’s work
    in as much as they enhance the abundance of colour bringing it forward. Though
    gold-leaf has been used, it is subdued with washes of watery paint projecting
    rich colour forward and an illusionary understanding of an embroidered wall-hanging.


    In essence, the black and contrasting gold amongst the overall intense colour
    produces a three-dimensional vision, devoid of any necessity for detail, which
    again is completed by the viewer’s own memory of similarity filling in the gaps.
    Multiple layers of richly coloured paint intensify the depth of colour, enhanced
    by other elements.


    Both paintings are uplifting and that is the correlation between the two; the
    difference in subject is immaterial. The female sensuality in both paintings reflects
    the attitudes towards sensuality within the two ages.


