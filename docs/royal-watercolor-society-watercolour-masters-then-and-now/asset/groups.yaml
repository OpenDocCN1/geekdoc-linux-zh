    # WILLIAM BOWYER


    # SIR GEORGE CLAUSEN (1852-1944): *Girl and Flowerpot*


    Whenever I see drawings by George Clausen I am impressed by the vision and clarity
    of them. His watercolours have a freshness and immediacy, which shines through.
    In this simple painting, I admire the way he has drawn the young girl and, with
    great simplicity, demonstrated his ability to convey her gentle nature to the
    viewer.


    The subtle interpretation in tone of the pot of dark geraniums gently clasped
    in the girl''s hands only serves to contrast and enhance the modelling of her
    soft features. The head is painted with the utmost sensitivity and magic. Maybe
    she is related – could she have been his daughter?


    It has always been my pleasure and my privilege to paint people, and in enjoying
    their company to attempt to capture that human spirit, that elusive thread that
    reveals their true nature.


    I occasionally managed to get my mother to sit for me, persuading her to forego
    her chores for a while I would relish the idea of portraying an individual I knew
    so well. With her worldly wisdom, this matriarchal figure enjoyed a joke, a gossip
    and an occasional drink. She enjoyed in particular watching me play cricket and
    in the 1970s she and my good friend the artist Ruskin Spear downed a bottle of
    Scotch whilst watching a summer day''s match. Needless to say, they enjoyed the
    game.


    ![](img/b8a900b8373e949117f531b00685f281_89_0.png)'
