    ## 理查德·鲍登

    ### 托马斯·巴克莱·亨内尔 (1903–1945)：*雷克雅未克港*


    汤姆·亨内尔是我心目中的艺术家。他美丽而直接地描绘自己所见之物：谷仓、树木、马匹和正在工作的工匠；这是一位诗人的眼光。*雷克雅未克港*是他在冰岛担任官方战地艺术家时创作的几幅画作之一。可能是在多变的天气条件下匆忙绘制的，某些地方雨水冲刷掉了颜色。人需要感受到，正如他可能感受到的那样，局势变化的紧迫性；但它也是战争的记录。


    ![](img/b8a900b8373e949117f531b00685f281_79_0.png)


    作为1930年代和1940年代的艺术家，亨内尔处于一个变革时期。但他从未是抽象艺术家，也从未从生活中抽象。我感觉到，他或许是无意识地受到他朋友埃里克·拉维利厄斯的影响，后者是一位卓越的设计师。现场作画带来了一种张力，接受并从你面前的景象中甄别。他有着独特的视野，喜欢在这里或那里工作，只要他能沉浸在地方的氛围中，让自己被它引领并让它自行诉说。正如这幅画中，他会敏锐地理解庞大而笨拙的事物，例如中景的扫雷舰，或用简单的笔触引入一个转瞬即逝的人和他的狗。他的哲学脚踏实地，他的色彩也是如此：焦赭石、赭色、死帽紫、灰蓝色和黄赭石。他从不会在工作室里根据素描和其他信息来构图：他认为对真理的追求只能通过他直接的体验、感受和理解来获得，而不是通过字面上的再现。


    在以此为基础作画时，我有意识地将他自发的笔触素描转化为一系列形状，这些形状呼应了画中流动和运动，同时意识到他设计中的力量。


    ![](img/b8a900b8373e949117f531b00685f281_80_0.png)


    上图：理查德·鲍登，《雷克雅未克港》，临摹托马斯·亨内尔，2004年，水彩，51 x 65.5 厘米（20 x 25.8 英寸）


    ## 大卫·格鲁克

    ### 大卫·琼斯 (1895-1974)：*Afon Honddu Fach, above Capel-y-ffin*


    大卫·琼斯的绘画和素描多年来一直令我着迷。他以自发的方式作画，通过多层主要由线条构成的标记以及局部的色调来发展画面，触感轻盈。各种底稿和绘画在成品中可见，并在成品中讲述了过程。这种程序与我的工作方式非常一致，使琼斯成为我选择的对象。


    *Afon Honddu Fach* 构图不寻常，强烈的元素被推到纸张边缘，并以生动的图形风格执行。这幅画给我带来了一个有趣而令人兴奋的挑战。


    取自现场绘制的铅笔素描，我的绘画《Rydal Hall Water, Lake District》旨在以我自己的方式创作，同时受我对琼斯作品、思想和文凭作品的了解所启发。我考虑了他对空间扭曲的使用、散布其中的图形线条语言，以及底色元素如何在最终画面中保留意义。


    ![](img/b8a900b8373e949117f531b00685f281_81_0.png)


    ## 伊丽莎白·克拉姆

    ### 大卫·琼斯 (1895–1974)：Afon Honddu Fach, above Capel-y-ffin


    我的水彩画依赖于绘画，结合色彩来增强构图线条的节奏感，如我在迪伦·托马斯《牛奶木下》中的《Mog Edwards》所示。正是大卫·琼斯作品中的这种品质，以及他对窗闩或推拉窗装饰等细节的着迷，以及他对超越所见时刻之物的感知，吸引我去欣赏他的绘画。


    ![](img/b8a900b8373e949117f531b00685f281_83_0.png)


    大卫·琼斯的绘画很难复制，部分原因是媒介的混合和使用：用水洗配合以画笔尖绘制、铅笔、粉笔和体色，通常


    我无法在不意识到强有力的节奏线条的情况下观看*Afon Honddu Fach*，以及那些在山坡上以微妙色彩呈现的线条，那里有树木和倾泻的小溪，或在不看到和感受到岩石和草丛所暗示的男性头部的情况下。还有，小岩石看起来就像鱼一样跃上山坡，而从画面的右上方，一匹马的暗示俯视着它们。所有这些运动都由山坡上的黄色稳定并锚定。


    ![](img/b8a900b8373e949117f531b00685f281_83_1.png)


    ## 诺曼·韦伯斯特

    ### 塞缪尔·休伯特·冯·赫科默爵士 (1849 - 1914)：亨利·斯塔西·马克的肖像


    ![](img/b8a900b8373e949117f531b00685f281_84_0.png)


    我一直对皇家水彩画学会许多过去成员的作品感兴趣，尤其是19世纪和20世纪的作品，因此以某种实际的方式回应其中一幅作品对我来说是一次非常愉快且具有挑战性的练习。


    我选择的水彩画是他朋友塞缪尔·休伯特·冯·赫科默皇家美术学院院士、皇家水彩画学会会员所画的亨利·斯塔西·马克皇家水彩画学会会员的肖像。1987年《水彩的荣耀》展览期间，我首次注意到这幅特定的画作，对我来说，它是那次展览中最重要的水彩画之一。


    我后来又看到了它，能够在脱离画框的情况下更仔细地检查它，对我的冲击同样巨大。虽然这件作品相当小，但我认为它是一件杰作：它构图精美，执行和素描技巧如此高超，以至于无法挑剔。


    我决定一旦我致力于回应赫科默的画作，我就会发展我在工作室中已经拥有的肖像素描之一，并在可能的情况下使用他的技巧和方法来创作我的水彩画。因此，我用混合了水彩的胶水绘制了背景、模特的服装和她头发的一部分，以增加色彩的丰富性。头部其余部分用清晰的水洗处理，尽管在某些颜色中加入了一点中国白，但更微妙的形式是通过非常细致地用细画笔施加一种点描法创造的。


    事后的结论是，人们只能对赫科默的纯粹才华致敬。


    ![](img/b8a900b8373e949117f531b00685f281_84_1.png)


    ## 夏洛特·哈利代

    ### 詹姆斯·达菲尔德·哈丁 (1797–1863)：维罗纳


    我21岁时，我的父母带我去了意大利，那是他们第一次相遇的地方。这是一种“入门优惠”。我做了很多小速写，自由而毫不自卑。但后来我变得对旅行感到紧张，尤其对飞行感到幽闭恐惧。我在英格兰“停留”了多年，直到有机会再次与朋友一起去地中海，我决定必须抓住这个机会。


    然而，随着旅行的临近，熟人 invariably 说：“哦，你会喜欢的；会有很多东西让你作画！”于是我开始感到他们的期望让我不知所措，受抑制，几乎惊慌；然后我看到了詹姆斯·达菲尔德·哈丁的这幅画。


    ![](img/b8a900b8373e949117f531b00685f281_85_0.png)


    “我至少可以做点类似的东西”，我想，于是我的恐慌消退了。克罗曼、吉兰和特纳的水彩画深深地打动我，但模仿他们对我来说太遥远了。哈丁另一方面，对建筑细节的热情显然与我一样——约翰·
    Ruskin 是他的学生这一点很重要。他准确地记录了这些维罗纳建筑，但画面充满了优雅、阳光和，最重要的是，清新的空气。


    哈丁使用体色的用法据说为特纳所不齿，但在我看来，在调色纸上它赋予了他一种第三维度。我在自己的作品中发现它极具解放性。


    我对海关大楼的水彩画显然是一个非常不同的主题，尽管可以看到泰晤士河的一瞥。它是我根据托马斯·肖特·男孩的伦敦风景画创作的十二幅画作之一。令人惊叹的是，男孩在1841年绘制的起重机仍然在那里，尽管树木是新的，但我的画作更多地归功于哈丁而不是男孩。


    我不断被他对维罗纳的视角所吸引，并不断发现新的细节——比如右边几乎看不见的马车轮廓。而且我总是毫不掩饰地被灰泥上的阳光所激动。


    上图：詹姆斯·达菲尔德·哈丁，《维罗纳》，体色和石墨于米色纸上；37 x 51 厘米（14.6 x 20.1 英寸）


    对面：夏洛特·哈利代，《海关大楼 E.C.3》，2003年，铅笔和水彩，40 x 45 厘米（15.7 x 17.7 英寸）


