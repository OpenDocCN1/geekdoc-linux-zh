    # JANE CORSELLIS


    # ARTHUR AMBROSE McEVOY (1878-1927): Beatrice


    ![](img/b8a900b8373e949117f531b00685f281_75_0.png)


    Ambrose McEvoy studied art at the Slade, and among his fellow students were William
    Rothenstein, Augustus John and William Orpen. All of them were outstandingly talented
    and went on to become hugely successful painters. McEvoy began his career painting
    interiors but by 1915 he was painting portraits, mostly of beautiful women. He
    was, supposedly, influenced by Gainsborough, and his portraits were painted in
    a loose, sketchy style in both watercolour and oil that reflects Gainsborough’s
    Romantic style.


    This watercolour portrait of Beatrice is a particularly fine example of McEvoy’s
    work. He would probably have started using a loaded brush and outlining the form
    with a series of washes, gradually working up to a greater intensity of colour
    and tone. In this painting I feel he must have been also influenced by the Japanese
    prints so popular at that time: the almost abstract qualities of the very dark
    brushstrokes he uses suggest this.


    tinted paper I like to use Chinese white or an opaque gouache. Often I will lay
    this on the surface of the paper quite thickly, let it completely dry, and then
    quickly brush a thin layer of colour over the top. In this way the white does
    not ‘bleed’ into the colour but makes a lovely translucent glaze.


    ![](img/b8a900b8373e949117f531b00685f281_75_1.png)


    I have particular sympathy with these working methods and I like to begin a watercolour
    in the same way. However, the first decision to be made is which paper to use.
    In the main, my choice of paper is determined by the subject matter and what I
    see as the essential qualities to express. It depends on whether I want to brush
    the surface of the paper lightly or actually work on it. For a white paper I prefer
    the RWS 300 gsm HP or the 425 gsm NOT if I need a surface of heavier or rougher
    quality. The tinted papers I use are the Two Rivers handmade paper in 180 gsm
    NOT in a mid-blue/green and, more recently, a heavy, almost dark brown ‘Nocturne’
    paper made by John van Oosteroom. The choice of paper also determines the working
    method: for instance, when painting on white paper I will only use pure watercolour,
    reserving whites in the traditional way by leaving the lightest areas alone or
    lifting out with a sponge or a rag. I rarely use masking fluid as I do not like
    the hard edge it leaves. When using


    I try not to think too much about technique while I am painting because I find
    that, if I am constantly questioning the method I am using, my attention is drawn
    away from the subject and I am unable to paint as freely as I would like to. I
    begin by laying in the washes. At first I use a pale wash to draw or place the
    subject on the paper. Occasionally I will use a light pencil, but I prefer to
    ‘work it all out’ just using paint and making corrections as I go along, either
    by washing out or by overpainting. These washes have a considered, random quality
    rather than being applied too meticulously. From then on, it is a matter of developing
    the painting wash over wash, working mainly wet into wet and gradually defining
    areas until I am reasonably content with the result, and feel that I can stop.


    Above, left: ARTHUR AMBROSE McEVOY ARA, Beatrice, watercolour, ink and chalk,
    40.6 x 30.3 cm (18 x 12.2 in)


    Above, right: JANE CORSELLIS, Rose, watercolour, 38 X 34 cm (15 x 13.5 in)


    Opposite: JANE CORSELLIS, Alex Lister, 2000, watercolour, 37 x 34 cm (14.6 x 13.4
    in)'
