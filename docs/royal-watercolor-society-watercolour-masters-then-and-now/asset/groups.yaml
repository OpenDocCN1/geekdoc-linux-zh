    ARWS 1843, RWS 1854


    帕尔默出生于纽因顿，是书商之子。他十四岁时首次在皇家美术学院展出，很快结识了一群年轻艺术家“古代人”，如弗朗西斯·奥利弗·芬奇，他们深受威廉·布莱克影响。他还遇到了约翰·林内尔，并娶了他的女儿；然而，宗教和性格上的差异使他与岳父关系紧张直至终生。1821年，帕尔默搬到肯特郡的肖里汉姆，“那个我度过人生最佳岁月的真正村庄”。他在这里创作了一些最精美的尽管艺术上有些做作的素描，‘tangled
    wild-flower beauty’ Martin Hardie of these pictures of a pastoral England became
