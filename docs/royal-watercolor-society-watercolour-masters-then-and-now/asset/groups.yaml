    # JANE TAYLOR


    ROSE MAYNARD BARTON (1856-1929): Child with a White Cap


    Rose Maynard Barton was elected an Associate Member of the Royal Watercolour Society
    in 1895, but did not submit this, her Diploma Work, until 1909. Barton was born
    in Ireland and was largely self-taught, and with no obvious influences which might
    otherwise blunt or distort a capable and refreshingly unselfconscious approach
    to her subject. These characteristics drew me initially to this painting. Obviously
    in my tribute to Rose Barton’s painting, no attempt has been made to copy the
    original: it simply served to ‘kick-start’ the process – and to translate it into
    a modern idiom.


    ![](img/b8a900b8373e949117f531b00685f281_65_0.png)


    The original is a little gem of observation – and one wonders how it was done.
    Clearly the child, probably about two years of age, could not be expected to ‘pose’.
    Probably pencil sketches were made, with notes as to gesture, costume, surroundings,
    etc., and the final, painted in the studio, where those limpid washes could be
    controlled, and such adjustments as might be necessary could be comfortably made.


    My preferred method of painting is using watercolour-gouache, and this work of
    mine is fairly typical. I usually prefer to tint the paper lightly with a warm
    wash of colour and then, when dry, work into that, building up the washes towards
    a final opaque note as for example in the cap.


    Ultimately the honours go to Rose Barton, whose artistry is self-evident. This
    is a simple and engaging study, seen as it were in a moment and captured forever.


    Children were often sentimentalised in Victorian and Edwardian painting, and became
    tokens of innocence, but this painting tells no story. It is direct and unfussed.
    The artist had marvellous powers of observation and retention – not only for the
    child but also for the surroundings, the stony path, the brick and the stuccoed
    wall. One could live with this entirely convincing portrait – these are my reasons
    for choosing it.'
