    # DAVID BRAYNE


    # HENRY SCOTT TUKE (1858 1929): *Green Water*


    Henry Scott Tuke was a keen sailor who sought to explore man’s closeness to the
    sea. He often painted friends and fishermen working or playing along the Cornish
    coast from his floating studio, an old brigantine, Julie de Nantes. *Green Water*,
    his diploma work of 1911, captures a brief moment between an oarsman and a dimly
    seen swimmer.


    I, too, often paint boats, though the figures they contain are usually female
    and, unlike Tuke, I work from memory, on land and indoors. I am drawn to this
    quiet painting which holds the emotional tautness and vitality I hope to achieve
    in my own work. The treatment of the paint (watercolour and bodycolour) in *Green
    Water* is loose and energetic, underpinned by a strong central composition. The
    gaze of the two figures across the water is parallel to one oar of the rowing
    boat, while the boatman’s arms and legs are parallel to the other, creating a
    gentle rhythm. In my painting, *Leaping Fish*, I have turned this around, placing
    two figures in the boat who look out in opposite directions. I hope their


    physical closeness and the curving lines of their bodies echo something of the
    intensity of Tuke’s *Green Water*.


    I paint the sea viewed from the shoreline, while Tuke’s floating studio enabled
    him to look in any direction. The cove, seen from the water, forms the backdrop
    to his painting and becomes a band of violets and pinks at the top of the image.
    This pictorial structure offered a significant departure from my usual blue sky.
    I placed a wedge of earth colours at the top edge of the sea in *Leaping Fish*,
    using bone black, verdigris and French ochre pigments. This changed the light
    in my work radically and created a more intimate atmosphere.


    ![](img/b8a900b8373e949117f531b00685f281_99_0.png)


    Above: HENRY SCOTT TUKE RA, *Green Water*, watercolour and bodycolour, 29.5 x
    45.3 cm (11.7 x 18 in)

    Opposite: DAVID BRAYNE, *Leaping Fish*, watercolour, raw pigment and acrylic gel
    on paper, 25 x 30 cm (10 x 12 in)'
