    Sir William Russell Flint 的《Incoming Tide, No. 1 Slip, Devonport Dockyard》对我而言有许多共鸣之处。首先是主题，它是工业性的，清楚地说明了在这种情境中可以发现的美；我自己最初也是在北伦敦作画工业风景。Neasden
    和 Cricklewood 的铁路侧线给了我揭示日常题材中之美的机会。我相当确定，非画家在进入 Flint 的船坞时，若未见过这幅精彩的水彩画，是不会自然地认识到其美。初次前往印度时，激励我的并非异国情调的建筑和人物，而是肮脏的铁路侧线、工作的机车、蒸汽和烟雾。


    那次旅行中我学到，在绘画和素描中，具体的观察才是最重要的。看到我的一幅水彩画后，印度铁路局长告诉我，画中那列火车的锅炉刚被清洗过。问他如何得知，他说只有在如此清洗后重新点火时，烟雾才会像我水彩画中那样出现。这让我感到极大的兴奋，因为我画的是一个特定的真实，而非概括。


    水彩画讲究速度，我喜欢感觉一幅作品是以每小时一百英里的速度完成的。这赋予了它活力和兴奋感，当然对于工业题材来说，总是存在火车会开走或船只会突然驶入船棚的威胁。


    ![](img/b8a900b8373e949117f531b00685f281_149_1.png)


    作为一名调子画家，这幅 Russell Flint 之所以打动我，是因为它通过明暗对比表达了光线。没有鲜艳的色彩——只有丰富的土色，这一直吸引着我。他对赭石、土黄和黄赭的使用，延续了早期水彩画家的传统，如我最喜爱的
    John Sell Cotman，我在皇家艺术学院撰写的论文就是关于他的。


    ![](img/b8a900b8373e949117f531b00685f281_150_0.png)


    对面，左：SIR WILLIAM RUSSELL FLINT RA，《Incoming Tide, No.7 Slip, Devonport Dockyard》，石墨上水彩，48.7
    x 66 cm（19.2 x 26 in）

    对面，右：KEN HOWARD，《Jhansi Loco》，1984年，水彩，13 x 18 cm（5 x 7 in）

    上方：KEN HOWARD，《Steam and Smoke, Jhansi》，1984年，水彩，38 x 56 cm（15 x 22 in）


