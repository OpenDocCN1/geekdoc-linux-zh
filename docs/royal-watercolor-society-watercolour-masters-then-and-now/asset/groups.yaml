    Cave 工厂的经历提供了大量信息，其中一部分关于葡萄酒生产技术，但更令人兴奋的是关于视觉材料的极端表现：从葡萄藤在柔和的西班牙丘陵上透视弯曲而去的一瞥，到五层充满成熟葡萄酒的地窖突然陷入黑暗，酒在温度和色彩上都显得清凉。回到地面层的生产车间时，我迎来了温暖光线和色彩的爆发，沐浴着古老的酒槽、酒桶和柳条篮。拱形建筑与物体优雅曲线之间的呼应令我着迷。


    关于如何处理这一主题的线索，来自于一幅与我几乎同龄的室内画作：Sir William Russell Flint 的《Devonport Dockyard》（现藏于
