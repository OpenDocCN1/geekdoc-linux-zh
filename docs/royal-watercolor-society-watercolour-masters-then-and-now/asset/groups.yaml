    ## TOM GAMBLE


    ### SIR WILLIAM RUSSELL FLINT (1880-1969): Incoming Tide, No. 1 Slip, Devonport
    Dockyard


    作为主要活跃于1930年代的城市画家，以及一名“街头漫步者”，我从所遇到的视觉事件中收集我的创作素材，并随心情将它们随意放置在大素描本的各页上。虽然户外写生和记笔记对我的工作至关重要，但最终我创造的是风景，而非绘制和描绘它。对我来说，城市的写实绘画远不如其表层之下所蕴含的东西重要。为了穿透对清醒行走的大众而言通常不可见的世界，我体验声音、气味、音乐和色彩，并创作视觉上的“交响变奏”，以期创造出个人化的作品集。


    ![](img/b8a900b8373e949117f531b00685f281_145_0.png)


    技术上我使用纯水彩，因此我立刻被 Sir William Russell Flint 用同种媒介创作的精美画作吸引。主题采用了赭石、棕褐色和土黄色的有限色彩调色板，描绘的是德文港船坞中的一个船坞滑道。这是一件精彩的作品，展现了工业荒地的全部残骸，其形状和结构对普通路人而言不会引起任何兴趣。


    而《Incoming Tide》描绘的是被轰炸摧毁前的场景，我的画作《The Aftermath》则是毁灭之后不久。地点和时间不同，但巧合的是，在构图、色调以及有限的泥土色范围内都存在相似之处，棕色中点缀着少量淡蓝色。两幅画都与航运有关，前景都有水悄悄漫上来，远处是苍白的景色，并以
