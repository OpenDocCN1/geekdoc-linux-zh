    ## JENNY WHEATLEY

    ### LORNA BINNS (1914-2003): Salina Bay, Malta


    Lorna Binns has been a strong influence in my work from the time that I was first
    elected to the RWS. She was such an unlikely and unassuming personality to have
    produced her poetic, high-key paintings that dance so lightly on the paper – and
    for the exotic subjects that she chose on the many travels she made to various
    countries around the world.


    ![](img/b8a900b8373e949117f531b00685f281_141_0.png)


    Her Diploma work hints at the stronger patches of colour that she tenaciously
    placed across the picture surface in her later paintings, and which I saw every
    time I delivered my works to the RWS shows. She was always so eager to ask my
    opinion when I was still such a young member of the Society, and I became increasingly
    interested and involved in her images and the processes she used to arrive at
    her finished work.


    The materials used in creating a piece of work, from hand-made papers to luminous,
    transparent colours, have continued to preoccupy me throughout my painting career.


    In Lorna''s Diploma work of a Maltese landscape, her colours were still soft and
    her marks were almost Cézanne-like, but the way she placed the patches of colour,
    finding objects in amongst the empty landscape, hinted of the bolder work that
    she produced increasingly, right up to her death. It suggested to me an interest
    that I share in making subjects emerge from the painting rather than be imposed
    upon the viewer in some way.


    It was Lorna who first introduced me to the vibrant and finely ground make of
    watercolours that I have used so often, and it was she who first drew my interest
    to using high-key, close-tone colours to make images glow so richly.


