    FRANCIS BOWYER,

    Lowering Clouds. 2003.

    watercolour and bodycolour,

    19 x 25 cm (7.5 x 10 in)

    Left: FRANCIS BOWYER,

    Dusk, The Highlands, 2003,

    watercolour and bodycolour,

    30 x 35 cm (12 x 14 in)'
