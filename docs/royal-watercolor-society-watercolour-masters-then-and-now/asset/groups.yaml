    ![](img/b8a900b8373e949117f531b00685f281_39_0.png)


    ## ISLA HACKNEY

    ### CECIL ARTHUR HUNT (1873–1965): Dents des Bouquetins, Arolla


    > *For consider, first, the difference produced in the whole tone of landscape
    colour by the introductions of purple, violet, and deep ultramarine blue, which
    we owe to mountains.*

    > (John Ruskin)


    Since JMW Turner’s journey through the Alps to Italy in 1819, mountainous landscapes
    with remote and misted peaks and other typically ‘sublime’ subjects had become
    a source of inspiration for generations of artists to follow. Writing his book
    *Modern Painters* in defence of Turner’s greatness, John Ruskin’s thoughts on
    the role of colour in landscape are still of interest today. Referring to mountains,
    he says:


    > *''Large unbroken spaces of pure violet and purple are introduced in their distances;
    and even near, by films of cloud passing over the darkness of vacuies or forests,
    blues are produced of the most subtle tenderness.''* (Ruskin, *Modern Painters*,
    Vol. IV, 1856)


    When I look at Cecil Arthur Hunt’s awe-inspiring scene of Alpine peaks I find
    that my eye is drawn into its pools of pure, vibrant blue. Hunt’s bold washes
    of colour at the centre of his composition invite us to share with him a sensation
    of physical and spiritual oneness with the natural world. This is not simply an
    attractive depiction of mountainous terrain; it is an imaginative interpretation
    of natural phenomena.


    Hunt sought to align himself with nature’s underlying forces, reminding us of
    both the timeless and transient aspects of nature. Tracking the changeable weather
    conditions, his travellers stand tremulous at the edge of a glacier.


    Intense sunlight strikes the mountains as an aqueous mist encircles them, and
    great swathes of grey-blue cloud fill the valley. As onlookers also, our own focus
    shifts as the artist deftly brushes in areas of translucent colour, allowing it
    to merge with broader washes of more opaque bodycolour while Chinese white is
    used to reassert the monumental form of the snow-covered slopes.


    Like Hunt, I hope to involve the viewer in the immensity of the scene, recalling
    also the construction of the image as pigment on paper. Taking the Scottish mountains
    and glens as my inspiration, I work with freely applied colour. I began *Melting
    Snow* with spontaneous, random mark-making. The painting’s central motif seems
    to hover in front of its surroundings – a space or void awaiting a subject – while
    vigorously brushed colours set up an endless oscillation between fragmentary detail
    and the unified whole. Blue and purple shadows and bright white traces in the
    snow pick out the mountain ridge as the elements threaten to envelop it.

