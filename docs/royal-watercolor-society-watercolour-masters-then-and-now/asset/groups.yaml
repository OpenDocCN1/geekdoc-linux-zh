    ## JANET KERR

    ### ALBERT GOODWIN (1845-1932): Glastonbury


    When I first came across Albert Goodwin’s painting of Glastonbury I was reminded
    immediately of a composition I had been mulling over for some time. There were
    definite similarities in the content of his subject and my own of Heptonstall,
    even down to the church tower! However, in Goodwin’s beautiful and atmospheric
    work we are invited to look down on the subtle and understated hillside village,
    but in my painting we are looking across the valley of Crimsworth Dean and slightly
    up at the hilltop village of Heptonstall.


    ![](img/b8a900b8373e949117f531b00685f281_129_0.png)


    Goodwin’s composition allows us to meander through the work, being led by a series
    of gentle diagonals, pausing here and there and generally taking our time across
    the undulating countryside spread out before us. My composition is more abrupt.


    The South Pennine landscape, featured in my work, consists of characteristically
    steep hillsides and deep valleys. On a clear day, even from a modest vantage point,
    it’s not unusual to see six or seven substantial hills receding into the distance.
    The steepness of the sides of these hills makes them appear like flat, upright
    planes and has the effect of giving a plan view of field shapes. The houses are
    built into the hillsides, and often, what seems to be a normal, two-storey house
    turns out to be four-storied when viewed from the other side! To me, this landscape
    creates high horizons and flattened perspective.


    In order to avoid a stack of unconnected horizontal bands in the composition,
    I have sought out, and emphasized, related vertical movements through the work,
    giving rise to a faster initial journey upwards. Finally, I have used a narrow
    strip of very dark sky, hoping that it will act as a barrier and cause the viewer
    to work his way back down the painting, perhaps taking in some previously undiscovered
    areas of interest.


    ## RICHARD PIKESLEY

    ### ALBERT GOODWIN (1845-1932): Glastonbury


    ![](img/b8a900b8373e949117f531b00685f281_131_0.png)


    Goodwin’s picture tells of a painter with an extraordinary gift for pitching tonal
    values very precisely. In much of his work, including some of the most ravishing
    sunsets ever painted, he is looking back to his hero, Turner, but here he displays
    a daring modernism in his ability to compose such a haunting image from almost
    nothing. By thinking in terms of big compositional masses rather than fussy description
    of trees and hedges he gives us a sense of vastness helped by the high horizon
    and the foreground group of figures low down in the picture.


    The flat land of the Somerset Levels is intersected by thousands of drainage ditches,
    ruler-straight, criss-crossing the view; but there at the back of it all there
    are always hills, islands in an ocean, like Glastonbury, or the great arc of the
    Mendips to the north. For Albert Goodwin as for me these hills provide a bit of
    height from which to look out and get an idea of the scale of the place, and whereas
    he painted from the Tor, my first day’s painting took me a little to the south
    in search of shelter from the rain at Walton Hill, where I could sit and paint
    in the lee of my Land Rover, protected from the wind and the lashing rain.


    Weather zips across this landscape at an alarming rate and as the light fluctuated
    I made several starts, abandoning each one in turn; but as I watched I saw a cloud
    shadow spread over the foreground, leaving the middle distance strongly lit by
    the sun. Knowing that this was the effect I wanted, I painted fast, switching
    back to another painting each time the foreground was flooded with light.


    Over the next hour or so the painting gradually took shape in a series of brief
    episodes, but eventually the sky filled up with cloud and I drove off to paint
    elsewhere.


    ## JULIE HELD

    ### JOHN RHEINHARD WEGUELIN (1849-1927): *Venetian Gold*


    I chose *Venetian Gold* from the Diploma Collection because of its dazzling light.
    I love the way the light animates everything within the picture whilst retaining
    a sense of its external source.


    Once decided upon a still life as the subject for my own watercolour, I decided
    upon a vanitas painting as its theme. In attempting to infuse light from the outside
    source, *Venetian Gold* seemed the perfect inspiration in my own attempt to do
    the same. In both Rheinhard Weguelin’s painting and my own the light becomes as
    much the subject as the women in *Venetian Gold* or the skulls in my still life.


    Secondly, I painted the three skulls and the jug of flowers upon the table. When
    dry, I painted the tones within each object and began to paint the large swirls
    in the wallpaper on the table, further creating the pictorial space.


    In making my painting, I firstly worked with thin, broad washes, establishing
    the lightest colours and tones and the light source, the shaft of light on the
    right side. Then I applied a wash to establish the major areas of oranges and
    yellows, to create the light in its diffusion.


    Thirdly, taking a thin brush I painted all the fine details of the wallpaper,
    tablecloth and jug. Lastly, I put in all the strong shadows cast by the various
    objects.


    Although my painting has little obvious resemblance to *Venetian Gold*, I hope
    that the dramatic impact of the diffused summer light is homage to John Rheinhard
    Weguelin’s work.


    ![](img/b8a900b8373e949117f531b00685f281_133_0.png)


    Above: JOHN RHEINHARD WEGUELIN, *Venetian Gold*, watercolour, gum and bodycolour,
    53.8 x 72.5 cm (21.2 x 28.5 in)

    Opposite: JULIE HELD, *Still life with Skulls and Flowers*, 2003, watercolour,
    38 x 34.5 (15 x 13.6 in)


    ## EILEEN HOGAN

    ### CHARLES GINNER (1878-1952): Street Scene


    Light and shade have always been important to my work. Patterns on chairs and
    tables made by the strong light in Greece falling through slatted awnings of tavernas
    inspired me when I was a student in the British School at Athens and, before that,
    the dappled light and striped shadows in South London parks were constant themes.


    I am still interested in shadows, but those that fall in Marylebone now, rather
    than in Greece or Tooting and, in particular, the theatre of light in four contained
    spaces: Bryanston, Manchester, Montagu and Portman Squares. I have been studying
    these for the last four years, watching the transient movement made by light filtering
    through trees onto the facades of the surrounding buildings, including Home House,
    Herford House (the Wallace Collection) and the terraces of Georgian domestic architecture.
    These shifts of mood chart the passing seasons in the city: the fewer the leaves,
    the sharper the shadows cast and the more minute the alterations within each single
    sitting. Inadvertently, too, I have captured landscaping alterations in the squares
    and the environs.


    Although Charles Ginner''s street scene represents a different district of London,
    and the architecture there is Victorian.


    ![](img/b8a900b8373e949117f531b00685f281_135_0.png)


    ![](img/b8a900b8373e949117f531b00685f281_135_1.png)


    I feel that there are similarities in intention. I like his flat representation
    of the stucco facade where the formality of the structure is relieved by indications
    of dilapidation and neglect. I admire his commitment to the city. Ginner trained
    as an architect before he studied painting in Paris. When he returned to London
    he became a key member of Walter Sickert''s Camden Town Group, mainly recording
    North London working-class areas.


    Above, right: CHARLES GINNER, Pimlico, watercolour and Indian ink, 37 x 26.8 cm
    (14.6 x 10.6 in)

    Above, left: EILEEN HOGAN, Portman Square: Home House, 2005, acrylic on paper,
    16 x 12 cm (6.3 x 4.7 in)

    Opposite: EILEEN HOGAN, Manchester Square, Herford House, 2005, acrylic on paper,
    16 x 12 cm (6.3 x 4.7 in)

