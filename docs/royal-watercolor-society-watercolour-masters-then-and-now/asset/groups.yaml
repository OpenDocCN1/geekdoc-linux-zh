    countryside: At the end of long summer days, when the moon was new or at the full,
    these young adventurers would sadly forth on foot, sketchbook in hand, sandwiches
    in pocket ..., in quest of effects, and for the purpose of asking nature questions,
    and jotting down here replies when the day-light dawned and the memory was yet
    fresh.'' Finch was elected to the Society of Painters in Water-Colours at nineteen,
    its youngest ever member. He was musical, deeply religious as Swedenborgian, ''serious
    and refined''. His work is imbued with an autumnal melancholy reminiscent of Keats,
    whom he loved; Palmer called him the last representative of the old, Claudean,
    school of painting. Ruins of an Ancient City (page 36) was given to the Society
    in 1865 and was one of the first ever pictures in its collection.


