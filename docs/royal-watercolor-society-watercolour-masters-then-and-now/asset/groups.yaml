    Dunstan wrote of her that ''the table top contained the essence of the world that
    her painter''s eye needed.'' Gaa first met Ken Howard when she was studying in
    Florence during the Easter of 1959. He proposed to her a fortnight later but her
    parents refused to let them wed. They met again in London in 1980 and married
    ten years later.


    # CHARLES ISAAC GINNER ARA (1878 1952)


    ARWS 1938, RWS 1945


    Ginner was born in Cannes, the son of a pharmacist from Sussex. On leaving school
    at sixteen after illness he sailed the Mediterranean and South Atlantic on a tramp-steamer.
    Between 1899 and 1904 he worked in an architect''s office in Paris and enrolled
    at the Académie Vitti. After exhibiting in Buenos Aires he moved to London in
    1909 and took a studio in Chelsea. Ginner was a founder member of the Camden Town
    Group in 1911, for which he wrote a manifesto, asserting the neo-realism of the
    modern age and ''all it contains of great or weak, of beautiful or of sordid''.
    He subsequently joined both the London Group and the Camberland Market Group.
    His innate sense of rhythm and design found expression in the urban landscapes
    to which he was particularly drawn. They were planned with the use of a hand-held
