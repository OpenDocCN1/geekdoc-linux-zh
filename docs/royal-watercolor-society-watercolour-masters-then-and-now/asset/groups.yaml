    # ROBERT WEIR ALLAN 1851 1942


    ARWS 1887, RWS 1896.

    Allan was born in Glasgow, the son of a publisher. Like many of the Glasgow School
    he studied in Paris where he shared rooms with his friend Arthur Melville whom
    he claimed to have influenced - in the Boulevard d''Enfer (''the Street of Hell'').
    They made porridge with imported oats, sang Scottish songs and danced Highland
    reels in the studio. The French Realist Jules Bastien-Lepage had a profound influence
    on his work. Allan''s impressionist, ''blottesque'' manner of painting (tilting
    the paper and allowing spots of watercolour to run like raindrops) seems to have
    developed in response to Monet. His extensive travel included visits to India
    and Japan, although much of Allan''s work was painted en plein air in the fishing
    villages of north-east Scotland. According to Sir William Russell Flint: ''To
    the very end Allan adored the R.W.S.'' In 1900 he presented the Society, which
    owns six of his works, with its vice-president''s gold badge of office.


    # HELEN MARY ELIZABETH ALLINGHAM 1848 1926


    ARWS 1875, RWS 1890

    The daughter of a surgeon, Allingham was born at Swadlincote in Derbyshire into
    a Unitarian family. After the death of her father her family moved to Birmingham
    where she trained at the Government School of Design; subsequently she attended
    the Female School of Art in Queen''s Square and the Royal Academy Schools in London.
    In 1870 she became the only female member of staff of The Graphic, where she worked
    until her marriage to the Irish poet William Allingham. Her husband introduced
    her to literary and artistic circles which included Carlyle, Ruskin and Tennyson,
    who said of her work: ''I should like to do that. It does not look very difficult.''
    In 1890, having been proposed by Alfred William Hunt, Allingham became the first
    woman to be elected a full member of the Society. The President, Sir John Gilbert,
    said that he was ''disgusted and ashamed'' by this development. More than thirty
    years later she also became the first woman to serve on the RWS Council. The country
    cottages for which Allingham became known have charm, although they have often
    been ''improved'' by the removal of ugly outbuildings, and the posed figures standing
    outside almost certainly more physically attractive than the true inhabitants.


    # ROBERT SARGENT AUSTIN RA (1895 1973)


    ARWS 1930, RWS 1934

    Austin was born in Leicester, the son of a cabinet-maker. Apprenticed at thirteen
    to a firm of printers, he attended Leicester Municipal School of Art; subsequently
    he studied in the School of Engraving in the Royal College of Art under Sir Frank
    Short, from where he won a Rome Scholarship. Thereafter Austin taught at the College
    from 1926 until his retirement. Inspiring as a teacher, if sometimes caustic,
    his students learnt to draw models within the confines of the real world, the
    figure often distorted by closeness. His own influences included early German
    engravers, Degas and the cropped woodcuts of William Nicholson. More widely acknowledged
    as an engraver than as a painter, Austin''s work included designs for the £1 and
    10-shilling notes and bookplates for the library in 10 Downing Street. His near-perfect
    technique and remarkable draughtsmanship eventually became unfashionable, however.
    Serving as President of both the Royal Watercolour Society (1957 to 1973) and
    the Royal Society of Painter-Etchers and Engravers (1962 to 1970), he and Malcolm
    Fry, the Secretary, ran the


    Societies and the RWS Gallery in Conduit Street between them. Austin lived in
    Chiswick Mall in London and in a converted Methodist chapel at Burnham Overy Staithe
    in Norfolk.


    # ROSEMARY MAYNARD BARTON (1856 1929)


    ARWS 1893, RWS 1911

    Barton was born in Rochestown, County Tipperary. The daughter of a solicitor,
    her background was the Anglo-Irish gentry. She was presented at the Vice-Regal
    Court in Dublin Castle in 1874. It is conjectured that after an unhappy love affair
    she went to Brussels to study painting; she also studied in Geneva, in London
    under Paul Naftel RWS, and in Paris with Henri Gervex. In Paris she became aware
    of Impressionism and learnt to share Monet''s love of the foggy streets of London.
    Many of her works are impressionistic street scenes of London and Dublin. In 1904
    she wrote and illustrated Familiar London: ''it is wonderful to see the shrouded
    forms looking gigantic as they come towards you. The scene is weird, ghostly,
    almost silent. The fog deadens sound, and you hear little more than the shouts
    of chario teers.'' She also painted gardens, topographical views of Irish houses
    and somewhat sentimental scenes of children ''charming little idylls''. As her
    health deteriorated on account of asthma (probably exacerbated by the fog) she
    lived in Knightsbridge with a nurse known as ''Kitchener'' because of her military
    bearing. A lover of racing, Barton backed two winners on the day of her death.


    # CHARLES BENTLEY (1805/6 1851)


    AOWS 1834, OMS 1843

    Bentley was born in the Tottenham Court Road in London, the son of a master carpenter
    and builder. Apprenticed to Theodore Fielding to colour prints and then as an
    engraver, he went to Paris to work on plates made from watercolours by Bonington,
    whose watercolours were an undoubted influence. Bentley is best known for his
    breezy coastal scenes of the British Isles and Normandy. According to his obituary
    in The Athenaeum: He had few compeers in the delineation of water in movement
    (13 June 1846). He was also employed by amateur painters to work up their sketches
    into full paintings including views of Turkey and Guiana - and various imaginative
    scenes. Despite his considerable merit, Bentley had little business acumen and
    was swindled by picture-dealers; he is described as ''always poor'' and left less
    than £300 on his death. Bentley died suddenly of cholera. Copley Fielding wrote
    from Worthing: ''I cannot come to Town ... Then I know that many would be very
    timid in attending the funeral of one who had died of Cholera tho'' I believe
    there is not the slightest danger.'' The Society endeavoured to help his widow
    and elderly mother, who relied solely on him for support.


    # LORNA EMILY BINNS 1914 2003


    ARWS 1973, RWS 1977

    Binns was born in Waddley Bridge near Sheffield where her father was a manufacturer
    of stained glass. From Sheffield College of Art she won a scholarship to the Royal
    College of Art to study fashion. The artist Paul Nash saw a work which she had
    entered in a competition and gave her a tutorial. Using pieces of coloured paper
    to demonstrate, he instructed her that ''colour on either side changes the colour
    in the middle.'' She held that this was the most important thing ever said to
    her in her life. The outbreak'
  - '[PAGE 155]


    of war made a career in fashion impossible, so she returned to Yorkshire where
    she was conscripted into a firm of leatherworkers. Her husband was the Head of
    Design at Kingston College of Art, and they undertook designs jointly for a variety
    of clients. Binns'' work is full of colour and light. Usually she painted landscapes
    - especially if they included water and intense flower studies: ''When I am looking
    for a subject, I see something very beautiful which excites me and in that moment
    the reason for working and the final feeling of the painting is born.''


    # SAMUEL JOHN ''LAMORNA'' BIRCH RA (1869-1955)

    ARWS 1912, RWS 1914


    Birch was born at Egremont in Cheshire, the son of a painter and decorator. At
    twelve he left school to work in an oil-cloth factory in Manchester but soon began
    to sell the watercolour sketches he made in his spare time. Birch moved to near
    Lancaster, where a river bailiff taught him a love of countryside and fishing
    which lasted all his life. By 1892 he was so successful as an artist that he moved
    to Cornwall where he settled in the Lamorna Valley west of Newlyn. (He adopted
    the name ''Lamorna'' to avoid confusion with a local painter, Lionel Birch.) Among
    his circle of artist friends in Cornwall was Laura Knight who recalled ''the brownish
    tweeds he wore and a rather battered hat ... His knickerbockers strapped and buckled
    just below the knee, allowed the display ... of his splendid developed legs, the
    calves of which would have been the envy of any man.'' Birch worked in the Barbizon
    tradition of plein-air realism, beginning work just after daybreak and storing
    his current work overnight in the barns of farmer friends. During the course of
    his career he produced more than 20,000 pictures. His colourful landscapes and
    river scenes brought him great popularity, especially in the Dominions; reproductions
    of his work as greeting cards and fine art prints sold in huge numbers.


    # LIONEL BULMER (1919-1992)

    ARWS 1959, RWS 1974


    Born in London, Bulmer was the son of an architect who imbued in him a love of
    buildings. He studied at Camberwell School of Art and, after war service, at the
    Royal College of Art under Percy Jowett. At the Royal College he met the artist
    Margaret Green, and the various prizes she was awarded allowed them to travel
    around France. They were together for forty-eight years, although they did not
    marry until weeks before Bulmer''s death. Their work is sometimes indistinguishable:
    she was to write, ''I knew we were too dangerously together for future happenings.
    We never had a separate life.'' In 1948 he took a post at Kingston School of Art,
    where he continued to teach until the 1980s. In the late 1950s he and Margaret
    bought Lodge Cottage, a derelict medieval hall house near Stowmarket in Suffolk,
    which they restored; they added a studio where they painted, inspired by the neighbouring
    cornfields and coastal stretches around Southwold and Walberswick. Bulmer''s early
    work was understated and influenced by the Camden School of Painters; his later
    compositions are more stylised and use distinctive, strong colours.


    # SIR GEORGE CLAUSEN RA (1852-1944)

    ARWS 1889, RWS 1898


    Clausen was born in London. His father was a Danish decorative artist, his mother
    Scottish. From 1867 to 1873 he worked in the drawing office of a


    firm of decorators in Chelsea until he won a scholarship to the National Art Training
    School in South Kensington. He also worked as an assistant, copying works in the
    National Gallery. Clausen studied in Antwerp and Paris where he was influenced
    by the new realism of both the Hague School and his French contemporaries. He
    worked mostly in the Essex countryside en plein air: ''It was Clausen''s determination
    to see life as it was, to find his pictures, not to make them, that was to influence
    the whole of his painting career.'' Although in 1886 he was a founding member
    of the New English Art Club, which was set up in opposition to the Royal Academy,
    Clausen was subsequently elected to the RA and served both as Professor of Painting
    and as Director of the Schools. In 1927 he was chosen as a muralist for St Stephen''s
    Hall in the Palace of Westminster, and his painting The English people, in spite
    of persecution for heresy, persist in gathering secretly to read aloud Wyclif''s
    English Bible, earned him a knighthood in 1927. Although personally modest, by
    the time of his death at the age of 92 Clausen was feted as the ''grand old man''
    of British art.


    # JOHN SELL COTMAN (1782-1842)

    AOWS 1825


    Cotman was born in Norwich, the son of a hairdresser (subsequently a silk merchant).
    He moved to London in 1798 where he worked as an assistant to the publisher and
    dealer in engravings, Rudolph Ackermann. In 1800 and 1802, with Paul Sandby Munn,
    Cotman travelled in Wales, and then in 1803 and 1805 he toured Yorkshire. While
    staying at Greta Bridge during the latter tour he produced what are now regarded
    as some of the finest watercolours in British art. However, the following year
    he failed to be elected to the Society of Painters in Watercolours while his friend
    Munn succeeded, and he returned to Norwich where he held a retrospective of several
    hundred works. Dante Gabriel Rossetti, a pupil, described Cotman as ''an alert,
    forceful-looking man, of modest stature, with a fine well-moulded face, which
    testified to an impulsive nature, somewhat worn and worried''. Although suffering
    from depression and a crushing sense of failure Cotman was undoubtedly a major
    artist. Victor Rianecker wrote of him: ''While Turner''s reaction to the spirit
    of the romantic revival was in the main emotional, [Cotman compelled] his own
    feelings to come to terms with the scientifically verifiable conceptions of nature
    and reality ... [his] discovery of pictorial structure has given rise to a long
    echo in the consciousness of many succeeding painters.''


