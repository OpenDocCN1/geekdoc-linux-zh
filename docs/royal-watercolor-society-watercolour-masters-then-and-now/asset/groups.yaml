    to interact with the painting, as in the watercolours of Ken Kiff, for example.
    The artist is happy to leave the way open for the viewer to interpret the picture
    as he likes and respond following his own imagination.


    JUNE BERRY


    Left: EDWARD DUNCAN, The Approaching Wreck (detail), watercolour and bodycolour,
    29 x 58.5 cm (11.5 x 23 in)


    ![](img/b8a900b8373e949117f531b00685f281_92_0.png)


    ## JANE CARPANINI

    ### DAME LAURA KNIGHT (1877–1970): *The Girls’ Dressing Wagon*


    Dame Laura Knight was a passionate recorder of the world around her and never
    more so than when observing her subjects absorbed in the processes of their work.


    My mother worked in a ball-bearing factory during the war and remembers being
    sent into the noise and hubbub of the workshops to collect time sheets. There
    she saw Dame Laura Knight hunched at her easel surrounded by screeching machines
    and working in a persistent fine mist of oil droplets. Whether she was recording
    men wiping their hands on oily rags or performers dressing or waiting off-stage,
    she found dignity and grace in her subjects’ unselfconsciousness.


    ![](img/b8a900b8373e949117f531b00685f281_93_0.png)


    It was the opportunity to explore that informality that prompted my series of
    paintings of the rank-and-file performers at the Opera Festival in Verona. The
    scale of the productions often means a cast of hundreds, many of whom appear in
    the various tableaux scenes bearing spears or banners, or simply representing
    massed bystanders, soldiers, courtiers, conspirators and so on. Between acts they
    gather in quiet groups in the Piazza Bra outside the walls of the Arena, occasionally
    retreating into the chambers under the arches to gather helmets or cloaks or to
    be checked over by the army of wardrobe mistresses.


    and against the backdrop of the Arena’s architecture. I was in fact observing
    the pursuit of that effortless style they call ‘bella figura’, almost a performance
    art in its own right, the highest accolade being an appreciative glance.


    Although immediately seduced by the colour and drama of the night-time scene,
    it was not long before I discovered that these young men are innately comfortable
    with the whole concept of display and are completely unconscious in adopting languidly
    theatrical poses amidst the gilded props.


    Dame Laura Knight’s performers are caught in those intimate moments of preparation
    that go towards creating the magic that is theatre. My young Italians draw no
    distinction here: in their minds, performance and passeggiata merge seamlessly.


    ![](img/b8a900b8373e949117f531b00685f281_94_0.png)


    Opposite: DAME LAURA KNIGHT RA, The Girls'' Dressing Wagon, watercolour and chalk,
    52 x 34 cm (20.5 x 13.4 in)

    Above: JANE CARPANINI, Verona – ''Waiting for ''Nessun Dorma'''', 2004, 46 x 38
    cm (18 x 15 in)


    ## DAVID REMFRY

    ### DAME LAURA KNIGHT (1877–1970): The Girls’ Dressing Wagon


    ![](img/b8a900b8373e949117f531b00685f281_95_0.png)


    This is a very engaging drawing by Laura Knight. The drawing, satisfying in the
    apparently simple construction, powerful in its underpinning of solid draftsmanship.


    The foreground figures, although not realistic, are real, having weight and character.
    The figure on the right conveys the wonderful awkwardness, an almost graceless
    and unconscious sexuality that is often to be seen in off-duty performers or dancers.
    She stands like a dancer and is drawn almost as a nude, the line on the left side
    of the torso continuing through the skirt, the buttocks being simply but well
    defined in a most sensuous way.


    There is a surprising tenderness in the drawing of the nape of the neck and curved
    parting of the girl''s hair. The figure on the left is almost Matisse-like, particularly
    on the top half, the bottom half seeming more solid, with beautifully observed
    legs. Knight does not suffer by comparison with the French master.


    The subject clearly is one that the artist had great affection for and I can readily
    understand why. I came to stay in New York in 1995 and at that time there was
    a resurgence of burlesque and cabaret shows. Nothing to do with Broadway, these
    were risqué to lewd and funny and often at illegal (unlicensed) venues with someone
    always watching for cops.


    Later, under the Giuliani clean up, it became more difficult to do illicit but
    fun things. There was a bar round the corner from the hotel Chelsea where I live,
    called Billy''s Topless. Inventively Billy bought himself a couple of extra years
    by removing the apostrophe and making the name of his bar ''Billy Stopless''.


    There was a sometime club on 23rd Street and I began to draw the performers. They
    would visit the studio and then, over a period of years, I would make drawings
    of them. I''ve always been fascinated by performers and dancers; for me they provide
    ideal subject matter with almost inexhaustible ways in which it may be treated.

