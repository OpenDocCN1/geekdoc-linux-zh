    ## CATHERINE DUCKER

    WILLIAM HENRY HUNT (1790–1864)：*带玫瑰及其他花卉和云雀巢的花瓶*


    ![](img/b8a900b8373e949117f531b00685f281_27_0.png)


    这幅亨特的作品立刻给我一种由热爱自然的人创作的感觉；尽管它是在工作室中绘制的，但鸟巢和花朵却置于自然背景之下。这很不寻常，也是我喜欢的一个元素。艺术家选择了一个我非常感兴趣的题材：自然的脆弱性以及自然作为提供者的美丽。


    自然既以卵提供生命，也以花朵提供美丽。艺术家精美地描绘了一组园艺花卉，它们带有一种野性，其中一朵玫瑰置于花瓶之外。就像花朵一样，在鸟巢中有一个蛋被打破，还有一个蛋躺在巢外。


    这幅画在所选物体和构图上都美得令人感动。尽管我的作品看起来更简约，但我所选择的色彩和笔触对我而言具有同样的意义：它们对于表现我对土地的热爱以及我与景观元素之间的联系至关重要。亨特的画作清晰简洁。题材很繁忙，然而你的眼睛仍能看到整体概念的简洁性。


    我的绘画是对我在景观中经历的自发回应。兴奋的时刻，与自然建立联系的时刻，来自于我在工作室中安静不受打扰地工作所获得的体验的抽象色彩。


    近期的作品受到了前往非洲旅行的启发，在那里我遇到了与大海为伴的奇妙的人们。其他画作则源于在家度过的一个冬季骑马的时光，通过马匹与土地建立联系。


    目前我种植大量有机食品出售。每天围绕在土壤周围，目睹那些滋养我们、给予我们生存燃料的非常美丽的植物生长，这激励着我，并以不受控制的方式通过我的绘画表现出来。


    我一直种植很多花，有时它们会出现在我的艺术作品中；它们以其芬芳和低调的存在为我们的家带来极大的愉悦，以至于当灵感来临时，我想描绘它们的美丽。


    我只有在感到快乐时才会作画。这并不意味着画完时我仍然快乐，也不意味着我想每天都作画。我经历了许多情绪，但我必须感到与自己所做的事情相连。我觉得自己还有一生的绘画之路要走，而这只是旅程的开始。


    ![](img/b8a900b8373e949117f531b00685f281_27_1.png)


    ![](img/b8a900b8373e949117f531b00685f281_28_0.png)


    对面，左：WILLIAM HENRY HUNT，《带玫瑰及其他花卉和云雀巢的花瓶》，水彩和粉彩，23.2 × 28.4 cm (9.2 × 11.3 in)


    对面，右：CATHERINE DUCKER，《河畔骑行》，水彩，40 × 60 cm (15.7 × 23.6 in)


    上方：CATHERINE DUCKER，《百日草》，水彩 60 × 40 cm (23.6 × 15.7 in)


    ## DAVID WHITAKER

    ### ALFRED WILLIAM HUNT (1830–1896)：威尔士洪水


    Alfred William Hunt 的 *威尔士洪水* 对我来说是一项真正的发现。潮湿的土地呈现出绿褐色——被上方的厚重灰云和下方的激荡水流所挤压——表达了自然不可控制的力量。在天空中央偏低处，太阳隐约出现于最厚重的云层之后，而在远处右侧，牛群正在吃草。它们以及它们之外的村庄，在河流从右向左疾驰的浪潮中几乎不为人注意。在前景中，湍急的水流撞上某个无法辨认的物体，似乎在抵抗强劲的冲击。就我看来，我作品与之的联系在于构图的动态性：一种力量对另一种力量的推拉。


    ![](img/b8a900b8373e949117f531b00685f281_29_0.png)


    我觉得这幅画一定映射了亨特生命中某种危机，这使得题材更显感人。我试图做类似的事情：我经常创作与我当前感受以及源自过去经验的感受相匹配的图像。有时我会从想象中创造图像，这可能预示着即将发生的事情。其他时候，我会转录某件特定艺术作品的形象。如果我根据
    *威尔士洪水* 作画，我的色彩将是三间色，伴有少量次级色和原色在风暴搅动一切时努力存活。


    我的调色板由七种颜色组成。我使用两种黄色——一种冷色，一种暖色——镉红、洋红、翠绿和两种蓝色——一种偏红，一种偏绿。用这些颜色我可以表达自然现象的无穷可能。


    亨特在这幅画中使用了黑色，而我很少使用这种颜色，因为它对其他颜色有如此令人沮丧的影响。然而，题材会形成自己的过程，如果我想要作出回应性的类似绘画，我可能会重新引入黑色作为必不可少的元素。


    ![](img/b8a900b8373e949117f531b00685f281_30_0.png)


    ## ANTHONY EYTON

    ### ALFRED WILLIAM HUNT (1830-1896)：威尔士洪水


    我的画是一幅从树林中涌出的小威尔士瀑布，其轻盈和力量被周围的黑色岩石衬托出来。开始时，太阳高照。天气转为多云，因此动态发生了变化，画面变得更加严肃。


    ![](img/b8a900b8373e949117f531b00685f281_31_0.png)


    直到最近我才接触到 Alfred William Hunt 的作品。题材也是流动的水。它名为 *威尔士洪水*，创作于1870年，描绘的是开阔的乡村，强调水的湍流，岩石被绘制得极其细致，整个场景充满了强烈的天气和氛围感。亨特是
    Ruskin 的朋友，也是透纳和 David Cox 的崇拜者。


    我认为我们常常可以从气质相反的艺术家身上获得安慰，甚至享受他们的作品。在亨特的案例中，他相反的特质是他对特定题材的集中和专注以及对细节的关注。共同点是，我们都坚持写实，即题材或对表象的真实性起决定作用。空间、天气和光线方面也有共同之处。


    在1870年代，空气中充满活力，透纳的榜样促使人们对媒介进行大量实验。亨特也不例外。在 *威尔士洪水* 中，他采用了刮除、刻划、海绵擦拭和其他活跃的处理方式。这幅画的大部分应该是在户外完成的，但我怀疑他最终在工作室完成了它，尽管他主要想重温那种体验。


    亨特的工作方法已被他的女儿 Violet 形象地描述过。“他每天至少做两次写生，一次在晨光中，一次在傍晚题材。早晚又被细分，因为他经常把早晨的速写放在一边，在中午为新的‘效果’作画。”我能认同这种对新题材或光线变化的适应，但我会补充说，这种方法可能意味着每幅画都成为一项长期工程，并且每天都需要‘重新进入’。


    Violet 继续说，“我父亲的手工灵巧足以令人惊叹。凭借那双修长、神经质、像鸟一样的指尖，他能在任何方向上将画笔推进或停止在极其微小的范围内，并‘放置’一抹色彩，有时像锤子一样有力，有时像鸟翼一样轻盈。”


    ![](img/b8a900b8373e949117f531b00685f281_32_0.png)


    ## TREVOR FRANKLAND

    ### JOSEPH EDWARD SOUTHALL (1861–1944)：康沃尔港


    我被这幅画吸引，不仅仅因为它强有力的构图，也因为其题材。帆船可能从海外归来的形象对我而言与过去的时光和重访的“大旅行”有着强烈的关联。十八世纪大陆对英国艺术和建筑的影响是广泛的。


    ![](img/b8a900b8373e949117f531b00685f281_33_0.png)


    *左：**JOSEPH EDWARD SOUTHALL**。《康沃尔港》，水彩，30.3 × 24.3 cm (12 × 9.6 in)*


    *对面：**TREVOR FRANKLAND**。《重访大旅行》，2005年。水彩、丙烯和碳素铅笔，56 × 82 cm (22 × 32.2 in)*


