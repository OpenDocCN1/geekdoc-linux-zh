    ## DAVID WHITAKER

    ### ALFRED WILLIAM HUNT (1830–1896): Welsh Flood


    Alfred William Hunt’s *Welsh Flood* is a real find for me. The greenish browns
    of the sodden earth – compressed as it is between heavy grey clouds above and
    the agitated water below – express the uncontrollable force of nature. Faint,
    central, and low in the sky, the sun appears behind the heaviest clouds whilst
    away in the distance to the far right, cattle are grazing. They, and the village
    beyond them, go almost unnoticed in the wake of the river as it rushes from right
    to left. In the foreground the turbulent water meets with some unidentifiable
    object, which appears to be resisting the powerful surge. As I see it, the connection
    with my own work is in the dynamics of the composition: the push and pull of one
    force against another.


    ![](img/b8a900b8373e949117f531b00685f281_29_0.png)


    I feel this painting must have mirrored a crisis of some kind in Hunt’s life,
    which makes the subject all the more poignant. I try to do something similar:
    I often compose images which match my present feelings with feelings formed from
    past experience. Sometimes I will create images from my imagination which may
    be a forecast of things to come. At other times, I will make a transcription of
    a particular work of art. If I were to make a painting from *Welsh Flood* my colour
    would be tertiary, with flecks of secondaries and primaries trying to survive
    as the storm stirs everything up.


    My palette consists of seven colours. I use two yellows – one cold, one warm –
    cadmium red, magenta, viridian and two blues – one reddish and one greenish. With
    these colours I can express endless possibilities of natural phenomena.


    Hunt has used black in this painting, a colour I very rarely use because it has
    such a depressing influence on other colours. However, subjects form their own
    processes and were I to make a similar painting in response, I might reintroduce
    black as an essential element.


    ![](img/b8a900b8373e949117f531b00685f281_30_0.png)


    ## ANTHONY EYTON

    ### ALFRED WILLIAM HUNT (1830-1896): Welsh Flood


    My picture is of a small Welsh waterfall emerging from a wood, its lightness and
    force shown up by the surrounding black rocks. When I started, the sun was out.
    The weather changed to being cloudy, so the dynamic became different, and the
    picture became more stern.


    ![](img/b8a900b8373e949117f531b00685f281_31_0.png)


    It is only recently that I have come across Alfred William Hunt’s work. The subject
    is also of water on the move. It is called *Welsh Flood*, painted in 1870, in
    open country with an emphasis on the waters turbulence, the rocks painted in extreme
    detail, the whole scene imbued with a great sense of weather and atmosphere. Hunt
    was a friend of Ruskin, and a great admirer of Turner and David Cox.


    I think we can often take comfort from, and perhaps even enjoy artists of opposite
    temperament. In Hunt’s case, his opposing qualities are his concentration and
    focus on a particular subject and his attention to detail. In common, we both
    have an insistence on literalness, that is the subject or truth to appearances
    that dictate. There is also common ground in space, weather and light.


    In the 1870s there was a buzz in the air and the example of Turner to lead to
    much experimenting with the medium. Hunt was no exception. In the *Welsh Flood*
    he resorted to scraping out, scratching, sponging and other enlivening processes.
    Most of the picture must have been done on plein air but I suspect he brought
    it to a conclusion in the studio, though his main desire must have been to relive
    the experience.


    Hunt’s working methods have been vividly described by his daughter Violet. ‘He
    did at least two tramp’s a day, one in the morning light and one on an evening
    subject. Morning and evening were subdivided in as much as he often put away the
    morning sketch for a new ‘effect’ at midday.’ I can identify with this adaptation
    to a new subject or change of light, but would add that the method could mean
    that each picture becomes a long haul, and need ‘re-entering’ each day.


    Violet continues, ‘My father’s manual dexterity was remarkable enough. With those
    long nervous bird-like fingers he could propel or arrest his brush within the
    merest fraction of an inch in any given direction and ‘place’ a dab of colour
    here or there with the force of a hammer or the lightness of a bird’s wing.’


    ![](img/b8a900b8373e949117f531b00685f281_32_0.png)


    ## TREVOR FRANKLAND

    ### JOSEPH EDWARD SOUTHALL (1861–1944): A Cornish Haven


    I was attracted to this painting not only because of its strong composition but
    also by the subject matter. The image of a sailing ship probably returning from
    foreign parts has for me a strong association with past times and the Grand Tour
    revisited. The influence of the Continent on English art and architecture during
    the eighteenth century was extensive.


    ![](img/b8a900b8373e949117f531b00685f281_33_0.png)


    *Left: **JOSEPH EDWARD SOUTHALL**. A Cornish Haven, watercolour, 30.3 × 24.3 cm
    (12 × 9.6 in)*


    *Opposite: **TREVOR FRANKLAND**. The Grand Tour Revisited, 2005. watercolour,
    acrylic and carbon pencil, 56 × 82 cm (22 × 32.2 in)*

