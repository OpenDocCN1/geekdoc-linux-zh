  - '[PAGE 81]


    # DAVID GLUCK


    # DAVID JONES (1895-1974): *Afon Honddu Fach, above Capel-y-ffin*


    David Jones’s paintings and drawings have held a fascination for me over the years.
    He drew with spontaneity, developing the picture through several layers of chiefly
    linear marks together with localised tones, made with a lightness of touch. The
    various under-drawings and paintings are visible and tell in the finished work.
    This procedure is very much in line with my way of working, making Jones an obvious
    artist for me to choose.


    *Afon Honddu Fach* has an unusual composition with strong elements pushed right
    to the paper’s edge and executed with a lively graphic style. The painting set
    me an intriguing and exciting challenge.


    Taken from a pencil drawing made on the spot, my painting *Rydal Hall Water, Lake
    District*, is intended as a work in my own terms, whilst informed by my knowledge
    of Jones’s work, ideas and the diploma work. I considered his use of spatial distortions,
    language of the graphic line scattered throughout and how the underpainted elements
    retained significance in the final picture.


    ![](img/b8a900b8373e949117f531b00685f281_81_0.png)'
