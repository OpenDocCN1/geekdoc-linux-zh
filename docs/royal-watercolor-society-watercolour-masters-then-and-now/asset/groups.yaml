    ## 协会


    2004年，皇家水彩画协会庆祝成立两百年，成为英国第二古老的艺术协会（仅次于皇家艺术学院）以及世界上最古老的水彩画协会。它由一群主要是年轻的艺术家创立，他们希望在当时艺术界将水彩画视为次要艺术形式之际，宣扬水彩画的辉煌。


    该协会于1881年由维多利亚女王授予“皇家”称号，女王本人就是一位热衷的水彩画家，而皇家联系至今仍在延续，因为英女王陛下是协会的赞助人，威尔士亲王殿下则是荣誉会员。


    在两百年的历史中，其会员堪称英国艺术家中的名人录，其中包括许多知名人士：像 Cotman、Samuel Palmer、Alma-Tadema、Singer
    Sargent、Burne-Jones、Helen Allingham、Dame Laura Knight、Peter Blake 和 Leslie Worth
    等各具特色且杰出的艺术家，都曾自豪地在姓名后加上 RWS 的 initials。


