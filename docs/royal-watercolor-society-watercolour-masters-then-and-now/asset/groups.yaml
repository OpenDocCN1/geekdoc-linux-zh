    Milk Wood* by Dylan Thomas. It is this quality in David Jones’s work, along with
    his fascination with details such as window latches or sash window decoration
    and his sense of what is beyond the seen moment, that attracted me to his paintings.


    ![](img/b8a900b8373e949117f531b00685f281_83_0.png)


    David Jones’s paintings are difficult to reproduce, partly due to the mixture
    and use of media: wash with drawing


    by the point of a brush, pencil, chalk and body colour, usually


    I cannot view *Afon Honddu Fach* without being aware of the strong, rhythmic lines
    and those lines in subtle colour in the hillside with its trees and tumbling stream,
    or without seeing and feeling the male head suggested by the rocks and grasses.
    Also, the small rocks look so much like fish leaping up the hillside, and are
