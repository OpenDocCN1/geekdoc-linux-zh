    ## PAUL NEWLAND

    FRANCIS OLIVER FINCH (1802–1862): Ruins of an Ancient City


    ‘Of course, he’d have seemed very conservative even then!’ said the archivist
    when I went in search of material on Francis Oliver Finch in the Society’s archive.


    I had first caught sight of this picture (the first I had ever seen by Finch)
    on the cover of a catalogue for a show of works from the Diploma Collection held
    in 1987 (two years before I became an Associate). The image seemed enigmatic,
    wistful and completely intriguing. It was as if last respects were being paid
    to those European artists of the seventeenth century (Claude, Poussin et al.)
    who had had so profound an effect on the way the English manipulated the landscape
    of their country. Estates had been designed, gardens gardened and, most enduringly
    perhaps, England and Wales recorded under their influence. But no more...


    ![](img/b8a900b8373e949117f531b00685f281_41_0.png)


    I started to paint this transcription from the reproduction, but when I went to
    draw from the original I found that the view was more extensive and the colour
    far cooler, more northern in fact, than in the reproduction. I also found that
    although the theme was so congenial to me, pictorial elements on the right side
    were not. I decided to transplant into the composition a little piece of landscape
    in Umbria, which I had once known quite well—my own little recollection of ‘the
    south’—to complement the picture’s theme. It also seemed important to make the
    gesture, at least, of adjusting the colour—into a sort of ‘Finchian’ key. The
    result is a bit of a patchwork of ideas, which requires a good deal of adjustment
    to bring about unity: a unity not yet achieved. Many parts of the picture are
    still quite thin wash, but others are more dense, with gouache being introduced.


    Above: **FRANCIS OLIVER FINCH**, Ruins of an Ancient City, watercolour, 55.3 x
    75.5 cm (21.8 x 29.7 in)


    Opposite: **PAUL NEWLAND**, Regarding the Ruins, 2003-4, watercolour and gouache,
    51 x 61 cm (20 x 24 in), with preparatory sketches below


