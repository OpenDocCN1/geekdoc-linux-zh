    # TONE


    What is tone? *Chambers Dictionary* tells us: ‘a depth of brilliance of colour
    ... colour relationships ...’. *The Dictionary* expands a lot on this to talk
    about tonality in music, with which visual tonality has a number of revealing
    parallels. Just as it is impossible to conceive of a musical note without its
    inherent pitch or volume – loud or soft – or timbre, so it is impossible to conceive
    of colours without specific relationships, singly or within a scheme or ‘key’.


    James McNeill Whistler and Augustus John were once conversing as they left an
    exhibition of Gwen John''s paintings, and John remarked that his sister''s work
    showed great character. ‘What''s character to do with it?’ replied Whistler. ‘it’s
    tone that matters’.


    I consider Whistler’s observation to be significant. Whistler trained in Paris
    and was imbued with the French tradition. John, on the other hand was heir to
    the British tradition – romantic, rhetorical - responding to an impulse. Whistler
    was far more poised and systematic: for instance he once spent an entire day laying
    and grouping the tones on his palette in preparation for a seascape, which he
    painted the following day, in an hour.


    Both of these artists were primarily oil painters. If they used watercolour at
    all, it was as an accessory to the oil painting: a preliminary sketch , as it
    were. Yet in thinking of our chosen medium, the best watercolourists, such as
    Gowan, Gallow, Bonnington, or Girtin, all possess an innate sense of ‘tonality’.


    The watercolour medium, with its charming transluceancy, fluidity, spontaneity
    and dynamics of handling, does not at once encourage a more careful system or
    structure. But if artists are to avoid the weakness of vapid or inispid statements,
    I believe we must understand this principle of tonality as the ground base of
    our paintings.


    LES LIE WORTH


    ![](img/b8a900b8373e949117f531b00685f281_122_0.png)


    Left: **ALBERT GOODWIN**. *Glastonbury* (detail), watercolour, bodycolour and
    black ink, 30 x 48 cm (11.8 x 19.5 ins)'
