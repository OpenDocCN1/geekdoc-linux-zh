    # # ANTHONY EYTON


    ALFRED WILLIAM HUNT (1830-1896): Welsh Flood


    My picture is of a small Welsh waterfall emerging from a wood, its lightness and
    force shown up by the surrounding black rocks. When I started, the sun was out.
    The weather changed to being cloudy, so the dynamic became different, and the
    picture became more stern.


    ![](img/b8a900b8373e949117f531b00685f281_31_0.png)


    It is only recently that I have come across Alfred William Hunt’s work. The subject
    is also of water on the move. It is called *Welsh Flood*, painted in 1870, in
    open country with an emphasis on the waters turbulence, the rocks painted in extreme
    detail, the whole scene imbued with a great sense of weather and atmosphere. Hunt
    was a friend of RuskIn, and a great admirer of Turner and David Cox.


    I think we can often take comfort from, and perhaps even enjoy artists of opposite
    temperament. In Hunt’s case, his opposing qualities are his concentration and
    focus on a particular subject and his attention to detail. In common, we both
    have an insistence on literalness, that is the subject or truth to appearances
    that dictate. There is also common ground in space, weather and light.


    In the 1870s there was a buzz in the air and the example of Turner to lead to
    much experimenting with the medium. Hunt was no exception. In the *Welsh Flood*
    he resorted to scraping out, scratching, sponging and other enlivening processes.
    Most of the picture must have been done on plain air but I suspect he brought
    it to a conclusion in the studio, though his main desire must have been to relive
    the experience.


    Hunt’s working methods have been vividly described by his daughter Violet. ‘He
    did at least two tramp’s a day, one in the morning light and one on an evening
    subject. Morning and evening were subdivided in as much as he often put away the
    morning sketch for a new ‘effect’ at midday.’ I can identify with this adaptation
    to a new subject or change of light, but would add that the method could mean
    that each picture becomes a long haul, and need ‘re-entering’ each day.


    Violet continues, ‘My father’s manual dexterity was remarkable enough. With those
    long nervous bird-like fingers he could propel or arrest his brush within the
    merest fraction of an inch in any given direction and ‘place’ a dab of colour
    here or there with the force of a hammer or the lightness of a bird’s wing.’'
  - '[PAGE 32]


