    # MICHAEL McGUINNESS


    # ROBERT SARGENT AUSTIN (1895-1973): Teabreak


    I am frightened of drawing, it worries me; the responsibility of describing what
    I see seems overwhelming. Even with training and practice, painting and drawing
    have not come easy, so for me to venture into the act of drawing and painting
    is a discipline which never gets easier and which I spend much of my time trying
    to avoid.


    ![](img/b8a900b8373e949117f531b00685f281_87_0.png)


    The fact is that certain impressions, whether landscapes, objects or people, seem
    to command attention. So it was with this discarded enamel teapot, spotted as
    a flash of blue in the green grass edging the A12 whilst driving into the Essex
    countryside. I passed this glimpse of blue about five times before stopping and
    taking the teapot home to paint. I asked myself why I didn’t paint it there in
    the grass rather than on the more orthodox setting of a tray cloth. I cannot justify
    the decision except that it seemed good to restore the teapot to its proper place.


    Robert Austin’s depiction of the very English domestic tradition of the teabreak
    had impressed itself on my mind. My teapot must have played a central, if unappreciated,
    role in so many different domestic occasions, helping to establish friendships
    and give comfort whenever required. Eventually, grown old and shabby and made
    redundant by the arrival of tea-bags and mugs for the casual cup of tea, it had
    been thrown away, but I felt it should be honoured as a retired, rather than a
    jettisoned, teapot.'
