    # ANN WEGMÜLLER


    # JOSEPH EDWARD SOUTHHALL (1861-1944): *A Cornish Haven*


    ![](img/b8a900b8373e949117f531b00685f281_35_0.png)


    When I first saw the painting *A Cornish Haven*, I liked it immediately but it
    took me sometime to work out why. At first it reminded me of places I knew, of
    summer activities, walking along coastal roads, looking at boats and the hills
    beyond. A few weeks later I had a second look at his painting and realised that
    what attracted me was what always attracts me to the work of others: the colours.
    In the case of Southall’s painting it was the warm, light colours of the land,
    and the dark, cool colours of the sea.


    As a direct response to this, my first painting was about the warm, colourful
    rocks beside the beach, boats to look at and one *Sailing Out*. The closer you
    get to the water, though, the cooler the colour temperature becomes.


    In the second painting, I took this warm/cool theme further, introducing the *Shore
    Road* with houses in the sun, gardens and pathways. The houses are looking out
    to the warm hills and the dark sea. The boats are not so important in this painting
    and are only suggested. The subject matter has changed in my painting. It is about
    the land at the water’s edge. As it is a warm painting, I laid down a wash of
    yellow- ochre and built the painting up from there: the dark ultramarine of the
    sea acted as a counterpoint.


    My third painting cools down the summer atmosphere and brings to it a different
    time of year and a different mood. It is a different place entirely. The two shapes
    of houses represent the human element. The boats have gone, leaving the marks
    of an empty pier on the bottom right-hand corner. The blues are warmer here and
    the sand pink. The sea is a darker, colder blue, broken up by landmasses and rocks
    nearer the shore. There is only a small passage from the open sea to this haven.


    ![](img/b8a900b8373e949117f531b00685f281_35_1.png)


    ![](img/b8a900b8373e949117f531b00685f281_35_2.png)


    My painting is about the might of the sea and the small signs of human activity
    near the shore. The houses and the people in them are *Looking Out To Sea*.


    The mood of the painting is dictated by the dark ultramarine taken over the whole
    paper, with as little as possible of a cobalt blue added nearer the houses. The
    subject has changed again from Southall’s original work of a pleasant summer sea
    to a colder bleaker view of the sea by the people who live from it.


    *Above, left: JOSEPH EDWARD SOUTHHALL, A Cornish Haven, watercolour, 30.3 x 24.3
    cm (12 x 9.6 in)*


    *Above, centre: ANN WEGMÜLLER, Looking Out To Sea, gouache, 75 x 55 cm (29.5 x
    21.5 in)*


    *Above, right: ANN WEGMÜLLER, Shore Road, gouache, 55 x 49 cm (21.5 x 19 in)*'
