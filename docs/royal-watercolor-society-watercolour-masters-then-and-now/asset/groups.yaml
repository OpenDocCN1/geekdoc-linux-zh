    PERCY HAGUE JOWETT (1822–1955): *Bedroom Window*


    ![](img/b8a900b8373e949117f531b00685f281_61_0.png)


    My work is concerned with interiors and often conservatories, usually relating
    an aspect of the inside looking outward, windows being an important element of
    the design. The structure is enhanced by my emotional use of colour and the frequent
    inclusion of plant forms, which play an integral but not necessarily the dominant
    part of the composition.


