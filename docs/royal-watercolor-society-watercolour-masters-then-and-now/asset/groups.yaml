    ## KENNETH JACK

    ### THOMAS MILES RICHARDSON (1813-1890): Norham Castle, Evening


    中世纪建筑师建造大教堂和城堡的技艺自我在各种出版物中看到他们的照片的早年起就吸引了我。生活在澳大利亚的我，很少有机会看到这个我喜爱的题材。


    ![](img/b8a900b8373e949117f531b00685f281_137_0.png)


    更突出地强调了空间中的形态。此外，我喜欢与理查森相对地描绘有意义的细节，这些细节有助于赋予建筑规模和体量。


    作为一个喜欢绘画建筑的艺术家，我在多次访问不列颠群岛时寻找过班伯勒城堡之类的建筑。这座城堡是我在诺森伯兰绘制的一组城堡之一，我在多次访问中从不同位置绘制过它。


    看到托马斯·理查森的《诺咸城堡，傍晚》时，我被他捕捉到黄昏前最后一缕光线、他对空间和氛围的感受、他简单而非常有效的色彩方案、他丰富的色调范围和深度，以及他将船只、人群和云朵以抽象方式置于与主导城堡构成的构图关系中而印象深刻。这是一件美丽的杰作，尺寸虽小，但在艺术表达上却很大。


    我的班伯勒城堡画作是在工作室完成的，依据的是2003年4月一个阴沉的早晨在现场完成的铅笔和粉彩素描。当时拍摄的几张照片也有帮助，尤其是在细节方面。我认为，现场作画的艺术家比依赖照片的艺术家更能获得对空间中形态的感受。


    理查森的画作是我水彩画的起点。两座城堡都在诺森伯兰。我的班伯勒视角前景没有诺咸那样的河流，而是一条道路。班伯勒绝对主宰着村庄，我通过把它建在其上的山丘画得更高而略微夸大了这一点，这更好地传达了人在村中实际感受到的感觉。我的画作比理查森的大，我有


    ![](img/b8a900b8373e949117f531b00685f281_137_1.png)


    上方，左 THOMAS MILES RICHARDSON JUNIOR，《诺咸城堡，傍晚》，水彩和在石墨上叠加的体色，13.8 x 22.7 厘米（6 x
    9 英寸）

    上方，右及对面：KENNETH JACK，《班伯勒城堡，傍晚》，2003年，水彩和在 Arches 300 gsm 粗纹纸上的体色，34 x 54 厘米（13
    x 24 英寸）


