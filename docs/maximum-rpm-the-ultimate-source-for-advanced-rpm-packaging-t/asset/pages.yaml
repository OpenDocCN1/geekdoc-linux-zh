- pgno: 273
  md: '```

    ```

    Package: foo-client

    Field must be present : Description

    Field must be present : Group

    Package: bazlib

    Field must be present : Description

    Field must be present : Group


    Spec file check failed!!

    Tell rpm-list@redhat.com if this is incorrect.

    ```


    #

    ```


    Our spec file is incomplete. The bottom line is that each subpackage *must* have
    these three tags:


    +   - The `description` tag

    +   - The group tag

    +   - The summary tag


    It’s easy to see that the first two tags are required, but what about summary?
    Well, we lucked out on that one: We already included a *summary* for each subpackage
    in our sample spec file.

    Let’s take a look at the `description` tag first.


    # ### 18.4.1.5. The `description` Tag


    As you’ve probably noticed, the `description` tag differs from other tags. First
    of all, it starts with a percent sign, making it look similar to a directive.
    Second, its data can span multiple lines. The third difference is that the `description`
    tag must include the name of the subpackage it describes. This is done by appending
    the subpackage name to the `description` tag itself. So, given these `package`
    directives:


    ```

    ```

    %package server

    %package client

    %package -n bazlib

    ```

    ```


    our `description` tags would start with


    ```

    ```

    %description server

    %description client

    %description -n bazlib

    ```

    ```


    Notice that we’ve included the `-n` option in the `description` tag for `bazlib`.
    This was intentional, as it makes the name completely unambiguous.


    # ### 18.4.1.6. Our Spec File So Far


    Okay, let’s take a look at the spec file after we’ve added the appropriate `descriptions`,
    along with group tags for each subpackage:


    ```

    ```

    Name: foo

    Version: 2.7

    Release: 1

    ```

    ```'
