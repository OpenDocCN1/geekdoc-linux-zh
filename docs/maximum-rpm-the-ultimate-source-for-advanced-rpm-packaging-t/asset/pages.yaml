- pgno: 318
  md: 'installing the package on the build system for testing is a bad idea. Let''s
    bring our packages to a different system, test them there, and see what happens.


    # **20.4.2.1. Installing the Package on a Different System**


    Looks like we''re almost through. Let''s install the packages on another system
    that has not previously run amanda, and test it there:


    ```

    ```# rpm -ivh amanda-*-1.i386.rpm

    amanda-client: ####################################################

    amanda-server: ####################################################

    #```


    ```


    The install went smoothly enough, but testing did not. Why? Nothing was set up!
    The server configuration files, the inetc.conf entry for the client--everything
    was missing. If we stop and think about it for a moment, it makes sense: We had
    gone through all those steps on the build system, but none of those steps can
    be packaged as files.


    After following the steps in the installation instructions, everything works.
    While we could expect users to do most of the grunt work associated with getting
    amanda configured, RPM does have the capability to run scripts when packages are
    installed and erased. Why don''t we use that feature to make life easier for our
    users?


    # **20.4.3. Finishing Touches**


    At this point in the build process, we''re on the home stretch. The software builds
    correctly and is packaged. It''s time to stop looking at things from a "build
    the software" perspective, and time to start looking at things from a "package
    the software" point of view.


    The difference lies in looking at the packages from the user''s perspective. Does
    the package install easily, or does it require a lot of effort to make it operative?
    When the package is re-moved, does it clean up after itself, or does it leave
    bits and pieces strewn throughout the filesystem?


    Let''s put a bit more effort into this spec file and make life easier on our users.


    # **20.4.3.1. Creating Install Scripts**


    When it comes to needing postinstallation configuration, amanda certainly is no
    slouch! We''ll work on the client first. Let''s look at a section of the script
    we wrote, comment on it, and move on:


    ```

    ```%post client


    # See if they''ve installed amanda before...

    # If they have, none of this should be necessary...


    if [ "$1" = 1 ]; then```

    ```'
