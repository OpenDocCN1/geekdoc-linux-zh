- pgno: 389
  md: '# ## C.1. Global Options


    The following options can be used in any of RPM''s modes:


    +   - -quiet—Print as little output as possible.

    +   - -v—Be a little more verbose.

    +   - -vv—Be incredibly verbose (for debugging).

    +   - -root <dir>—Use <dir> as the top-level directory.

    +   - -dbpath <dir>—Use <dir> as the directory for the database.

    +   - -rcfile <file>—Use <file> instead of /etc/rpmrc and $HOME/.rpmrc.


    # ## C.2. Informational Options


    The following options are used to display information about RPM:

    Format: rpm <option>


    +   - -version—Print the version of RPM being used.

    +   - -help—Print a help message.

    +   - -showrc—Show rcfile information.

    +   - -querytags—List the tags that can be used with --queryformat.


    # ## C.3. Query Mode


    RPM''s query mode is used to display information about packages.

    Format: rpm --query <options>

    or

    rpm -q <options>


    # ### C.3.1. Package Specification Options for Query Mode


    No more than one of the following options may be present in every query command.
    They are used to select the source of the information to be displayed. Where plus
    signs appear, more than one item may be included, separated by a space:


    +   - <packagename>—Query the named package.

    +   - -a—Query all packages.

    +   - -f <file>+—Query package owning <file>.'
  merge: -1
  img_proc: true
- pgno: 390
  md: "+   - -g <group>—Query packages with group <group>.\n\n+   - -p <packagefile>—Query\
    \ (uninstalled) package <packagefile>.\n\n+   - --whatprovides <i>—Query packages\
    \ that provide <i> capability.\n\n+   - --whatrequires <i>—Query packages that\
    \ require <i> capability.\n\n# C.3.2. Information Selection Options for Query\
    \ Mode\n\nOne or more of the following options may be added to any query command.\
    \ They are used to select what information RPM will display. If no information-selection\
    \ option is present on the command line, RPM will simply display the applicable\
    \ package label(s):\n\n+   - -i—Display package information.\n\n+   - -l—Display\
    \ package file list.\n\n+   - -s—Show file states (implies -i).\n\n+   - -d—List\
    \ only documentation files (implies -i).\n\n+   - -c—List only configuration files\
    \ (implies -i).\n\n+   - -dump—Show all available information for each file (must\
    \ be used with -i, -c, or -d).\n\n+   - --provides—List capabilities that the\
    \ package provides.\n\n+   - --requires, -R—List capabilities that the package\
    \ requires.\n\n+   - --scripts—Print the various (un)install, verification scripts.\n\
    \n+   - --queryformat <s>—Use <s> as the header format (implies -i).\n\n+   -\
    \ --qf <s>—Shorthand for --queryformat.\n\n# C.4. Verify Mode\n\nRPM’s verification\
    \ mode is used to ensure that a package is still installed properly:\n\n```\n\
    Format:    rpm --verify <options>\n     or\n     rpm -V <options>\n     or\n \
    \    rpm -y <options>\n```"
  merge: -1
