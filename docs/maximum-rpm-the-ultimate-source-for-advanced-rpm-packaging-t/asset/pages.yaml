- pgno: 379
  md: 'Quite a bunch of stuff, isn''t it? With the exception of the first five lines,
    which indicate where several important directories and programs are located, the
    remainder of this file contains `rpmrc` entries that are related to RPM''s architecture
    and operating system processing. As you might imagine, any tinkering here will
    probably not be very productive, so leave any modifications here to the RPM developers.


    Next, we have `/etc/rpmrc`.


    # B.2.2. /etc/rpmrc


    The file `/etc/rpmrc`, unlike `/usr/lib/rpmrc`, is fair game for modifications
    and additions. In fact, `/etc/rpmrc` isn''t created by default, so its contents
    are entirely up to you. It''s the perfect place to keep `rpmrc` entries of a systemwide
    or global nature.


    The `vendor` entry is a great example of a good candidate for inclusion in `/etc/rpmrc`.
    In most cases, a particular system is dedicated to building packages for one vendor.
    In these instances, setting the `vendor` entry in `/etc/rpmrc` is best.


    Next in the hierarchy is a file named `.rpmrc`, which resides in the user''s login
    directory.


    # B.2.3. .rpmrc in the User''s Login Directory


    As you might imagine, a file called `.rpmrc` in a user''s login directory is only
    going to be read by that user when he or she runs RPM. Like `/etc/rpmrc`, this
    file is not created by default, but it can contain the same `rpmrc` entries as
    the other files. The `package` entry, which should contain the name and contact
    information for the person who built the package, is an appropriate candidate
    for `~/.rpmrc`.


    # B.2.4. File Specified by the --rcfile Option


    The `--rcfile` option is best used only when a totally different RPM configuration
    is desired for one or two packages. Since the only other `rpmrc` file read is
    `/usr/lib/rpmrc` with its low-level default settings, the file specified with
    the `--rcfile` option will have to be more comprehensive than either `/etc/rpmrc`
    or `~/.rpmrc`.


    # B.3. rpmrc File Syntax


    As you might have surmised from the sample file we briefly reviewed, the basic
    syntax of an `rpmrc` file entry is


    ```

    `<name>;<value>`

    ```


    The `<name>` part of the entry is not case sensitive, so any capitalization is
    acceptable. The colon separating the name from its value must immediately follow
    the name. No spaces are allowed'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'here. The formatting requirements on the value side of the entry vary from
    value to value and are discussed along with each entry.


    # ## B.4. rpmrc File Entries


    In this section, we discuss the various entries that can be used in each of the
    rpmrc files.


    # ### B.4.1. arch_canon


    The arch_canon entry is used to define a table of architecture names and their
    associated numbers. These canonical architecture names and numbers are then used
    internally by RPM whenever architecture-specific processing takes place. This
    entry’s format is


    ```

    arch_canon: <label>: <string> <value>

    ```


    <label> is compared against information from uname(2) after it’s been translated
    using the appropriate buildarchtranslate entry. If a match is found, <string>
    is used by RPM to reference the system’s architecture. When building a binary
    package, RPM uses <string> as part of the package’s filename, for instance.


    <value> is a numeric value RPM uses internally to identify the architecture. For
    example, this number is written in the header of each package file so that the
    file command can identify the architecture for which the package was built.


    # ### B.4.2. os_canon


    The os_canon entry is used to define a table of operating system names and their
    associated numbers. These canonical operating system names and numbers are then
    used internally by RPM whenever operating system–specific processing takes place.
    This entry’s format is


    ```

    os_canon: <label>: <string> <value>

    ```


    The <label> is compared against information from uname(2) after it’s been translated
    using the appropriate buildosttranslate entry. (The buildosttranslate rpmrc file
    entry is discussed in section B.4.4.) If a match is found, <string> is used by
    RPM to reference the operating system.


    The <value> is a numeric value used to uniquely identify the operating system.


    # ### B.4.3. buildarchtranslate


    The buildarchtranslate entry is used in the process of defining the architecture
    that RPM will use as the build architecture. As the name implies, it is used to
    translate the raw information returned from uname(2) to the canonical architecture
    defined by arch_canon.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'The format of the `buildarchtranslate` entry is slightly different from most
    other `rpmmfc` file entries. Instead of the usual `<name>:<value>` format, the
    `buildarchtranslate` entry looks like this:


    `buildarchtranslate:<label>: <string>`


    The `<label>` is compared against information from `uname(2)`. If a match is found,
    then `<string>` is used by RPM to define the build architecture.


    # B.4.4. `buildosttranslate`


    The `buildosttranslate` entry is used in the process of defining the operating
    system RPM will use as the build operating system. As the name implies, it is
    used to translate the raw information returned by `uname(2)` to the canonical
    operating system defined by `os_canon`.


    The format of the `buildosttranslate` entry is slightly different from most other
    `rpmmfc` file entries. Instead of the usual `<name>:<value>` format, the `buildosttranslate`
    entry looks like this:


    `buildosttranslate:<label>: <string>`


    `<label>` is compared against information from `uname(2)`. If a match is found,
    `<string>` is used by RPM to define the build operating system.


    # B.4.5. `arch_compat`


    The `arch_compat` entry is used to define which architectures are compatible with
    one another. This information is used when packages are installed; in this way,
    RPM can determine whether a given package file is compatible with the system.
    The format of the entry is


    `arch_compat:<label>: <list>`


    `<label>` is an architecture string, as defined by an `arch_canon` entry. `<list>`
    following it consists of one or more architectures, also defined by `arch_canon`.
    If there is more than one architecture in the list, they should be separated by
    a space.


    The architectures in the list are considered compatible to the architecture specified
    in the label.


    # B.4.6. `os_compat`


    Default value: (operating system specific)


    The `os_compat` entry is used to define which operating systems are compatible
    with one another. This information is used when packages are installed; in this
    way, RPM can determine whether a given package file is compatible with the system.
    The format of the entry is


    `<name>;<label>: <list>`'
  merge: -1
  img_proc: true
- pgno: 382
  md: '`<label>` is an operating system string, as defined by an `os_canon` entry.
    `<list>` following it consists of one or more operating systems, also defined
    by `os_canon`. If there is more than one operating system in the list, they should
    be separated by a space.


    The operating systems in the list are considered compatible to the operating system
    specified in the label.


    # B.4.7. builddir


    Default value: (`topdir`)/`BUILD`


    The `builddir` entry is used to define the path to the directory in which RPM
    will build packages. Its default value is taken from the value of the `topdir`
    entry, with `/BUILD` appended to it. Note that if you redefine `builddir`, you''ll
    need to specify a complete path.


    # B.4.8. buildroot


    Default value: (none)


    The `buildroot` entry defines the path used as the root directory during the install
    phase of a package build. For more information on using build roots, see Chapter
    16, “Making a Package That Can Build Anywhere,” specifically section 16.1.


    # B.4.9. cpio bin


    Default value: `cpio`


    The `cpio bin` entry is used to define the name (and optionally, the path) of
    the `cpio` program. RPM uses `cpio` to perform a variety of functions, and needs
    to know where the program can be found.


    # B.4.10. dbpath


    Default value: `/var/lib/rpm`


    The `dbpath` entry is used to define the directory in which the RPM database files
    are stored. It can be overridden by using the `-` dbpath option on the RPM command
    line.


    # B.4.11. defaultdocdir


    Default value: `/usr/doc`


    The `defaultdocdir` entry is used to define the directory in which RPM will store
    documentation for all installed packages. It is used only during builds to support
    the `%doc` directive.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# B.4.12. distribution


    Default value: (none)


    The distribution entry is used to define the distribution for each package. The
    distribution can also be set by adding the distribution tag to a particular spec
    file. The distribution tag in the spec file overrides the distribution rpmrc file
    entry.


    # B.4.13. excludedocs


    Default value: 0


    The excludedocs entry is used to control if documentation should be written to
    disk when a package is installed. By default, documentation is installed; however,
    this can be overridden by setting the value of excludedocs to 1. Note also that
    the --excludedocs and --includedocs options can be added to the RPM command line
    to override the excludedocs entry’s behavior. For more information on the --excludedocs
    and --includedocs options, please refer to Chapter 2, “Using RPM to Install Packages.”


    # B.4.14. ftpport


    Default value: (none)


    The ftpport entry is used to define the port RPM should use when manipulating
    package files via FTP. See Chapter 2 for more information on how FTP ports are
    used by RPM.


    # B.4.15. ftpproxy


    Default value: (none)


    The ftpproxy entry is used to define the hostname of the FTP proxy system RPM
    should use when manipulating package files via FTP. See Chapter 2 for more information
    on how FTP proxy systems are used by RPM.


    # B.4.16. messagellevel


    Default value: 3


    The messagellevel entry is used to define the desired verbosity level. Levels
    less than 3 produce greater amounts of output, while levels greater than 3 produce
    less output.


    # B.4.17. netsharedpath


    Default value: (none)'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'The **netsysredpath** entry is used to define one or more paths that, on the
    local system, are shared with other systems. If more than one path is specified,
    they must be separated with colons.


    # # B.4.18. optflags


    Default value: (architecture specific)


    The **optflags** entry is used to define a standard set of options that can be
    used during the build process, specifically during compilation.


    The format of the **optflags** entry is slightly different from most other *rpmrc*
    file entries. Instead of the usual `<name>=<value>` format, the **optflags** entry
    looks like this:


    ```

    optflags: `<architecture>` `<value>`

    ```


    For example, assume the following **optflags** entries were placed in an *rpmrc*
    file:


    ```

    optflags: i386 -02 -m486 -fno-strength-reduce

    optflags: sparc -02

    ```


    If RPM was running on an Intel 80386-compatible architecture, the **optflags**
    value would be set to `-02 -m486 -fno-strength-reduce`. If, however, RPM was running
    on a Sun SPARC-based system, **optflags** would be set to `-02`.


    This entry sets the `RPM_OPT_FLAGS` environment variable, which can be used in
    the `$prep`, `$build`, and `$install` scripts.


    # # B.4.19. packager


    Default value: (none)


    The **packager** entry is used to define the name and contact information for
    the individual responsible for building the package. The contact information is
    traditionally defined in the following format:


    ```

    packager: Erik Troan <ewt@redhat.com>

    ```


    # # B.4.20. pgp_name


    Default value: (none)


    The **pgp_name** entry is used to define the name of the PGP public key that will
    be used to sign each package built. The value is not case sensitive, but the key
    name entered here must match the actual key name in every other aspect.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# B.4.21. pgp_path


    Default value: (none)


    The pgp_path entry is used to point to a directory containing PGP keyring files.
    These files will be searched for the public key specified by the pgp_name entry.


    For more information on signing packages with PGP, see Chapter 17.


    # B.4.22. require_distribution


    Default value: 0


    The require_distribution entry is used to direct RPM to require that every package
    built must contain distribution information. The default value directs RPM to
    not enforce this requirement. If the entry has a non-zero value, RPM will only
    build packages that define a distribution.


    # B.4.23. require_icon


    Default value: 0


    The require_icon entry is used to direct RPM to require that every package built
    must contain an icon. The default value directs RPM to not enforce this requirement.
    If the entry has a non-zero value, RPM will only build packages that contain an
    icon.


    # B.4.24. require_vendor


    Default value: 0


    The require_vendor entry is used to direct RPM to require that every package built
    must contain vendor information. The default value directs RPM to not enforce
    this requirement. If the entry has a non-zero value, RPM will only build packages
    that define a vendor.


    # B.4.25. rpmdir


    Default value: (topdir)/RPMS


    The rpmdir entry is used to define the path to the directory in which RPM will
    write binary package files. Its default value is taken from the value of the topdir
    entry, with /RPMS appended to it. Note that if you redefine rpmdir, you''ll need
    to specify a complete path. RPM will automatically add an architecture-specific
    directory to the end of the path. For example, on an Intel-based system, the actual
    path would be


    ```

    /usr/src/redhat/RPMS/i386

    ```'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# B.4.26. signature


    Default value: (none)


    The signature entry is used to define the type of signature that is to be added
    to each package built. At the present time, only signatures from PGP are supported.
    Therefore, the only acceptable value is gpg.


    For more information on signing packages with PGP, see Chapter 17.


    # B.4.27. sourcedir


    Default value: (topdir)/SOURCES


    The sourcedir entry is used to define the path to the directory in which RPM will
    look for sources. Its default value is taken from the value of the topdir entry,
    with /SOURCES appended to it. Note that if you redefine sourcedir, you’ll need
    to specify a complete path.


    # B.4.28. specdir


    Default value: (topdir)/SPECS


    The specdir entry is used to define the path to the directory in which RPM will
    look for spec files. Its default value is taken from the value of the topdir entry,
    with /SPECS appended to it. Note that if you redefine specdir, you’ll need to
    specify a complete path.


    # B.4.29. srcrpmdir


    Default value: (topdir)/SRPMS


    The srcrpmdir entry is used to define the path to the directory in which RPM will
    write source package files. Its default value is taken from the value of the topdir
    entry, with /SRPMS appended to it. Note that if you redefine srcrpmdir, you’ll
    need to specify a complete path.


    # B.4.30. timecheck


    Default value: (none)


    The timecheck entry is used to define the default number of seconds to apply to
    the --timecheck option when building packages. For more information on the --timecheck
    option, please see Chapter 12, “rpm -b Command Reference.”


    # B.4.31. tmppath


    Default value: /var/tmp'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'The *tmpdir* entry is used to define a path to the directory that RPM will
    use for temporary work space. This normally consists of *temporary scripts* that
    are used during the build process. It should be set to an absolute path (that
    is, starting with /).


    # B.4.32. *topdir*


    Default value: */usr/src/redhat*


    The *topdir* entry is used to define the path to the top-level directory in RPM''s
    build directory tree. It should be set to an absolute path (that is, starting
    with /). The following entries base their default values on the value of *topdir*:


    +   - *builddir*

    +   - *rpmdir*

    +   - *sourcedir*

    +   - *specdir*

    +   - *srcrpmdir*


    # B.4.33. *vendor*


    Default value: *(none)*


    The *vendor* entry is used to define the name of the organization that is responsible
    for distributing the packaged software. Normally, this would be the name of a
    business or other such entity.'
  merge: -1
  img_proc: true
