  md: '```

    # rpm -ivh cdplayer-1.0.1386.rpm

    cdplayer ##########################################################

    #

    ```


    Well, that was easy enough. Let’s take a look at some of the files and make sure
    everything looks okay. We know there are some files installed in /usr/local/bin,
    so let’s check those:


    ```

    # ls -al /usr/local/bin

    -rwxr-xr-x 1 ed ed 40739 Sep 13 20:16 cdp*

    lrwxrwxrwx 1 ed ed 47 Sep 13 20:34 cdp* -> ./.cdp*

    #

    ```


    Looks pretty good. Wait a minute! What’s up with the owner and group? The answer
    is simple: User ed ran the build, which executed the makefile, which ran install,
    which created the files. Since ed created the files, they are owned by him.


    This brings up an interesting point. Software must be installed with very specific
    file ownership and permissions. But a nonroot user can’t create files that are
    owned by anyone other than himself or herself. What is a nonroot user to do?


    # 16.3. Specifying File Attributes


    In cases where the package builder cannot create the files to be packaged with
    the proper ownership and permissions, the %attr macro can be used to make things
    right.


    # 16.3.1. %attr: How Does It Work?


    The %attr macro has the following format:


    ```

    %attr<mode>, <user>, <group> | <file>

    ```


    +   • <mode> is represented in traditional numeric fashion.

    +   • <user> is specified by the login name of the user. Numeric UIDs are not
    used, for reasons we’ll explore in a moment.

    +   • <group> is specified by the group’s name, as entered in /etc/group. Numeric
    GIDs are not used, either. Yes, we’ll be discussing that, too!

    +   • <file> represents the file. Shell-style globbing is supported.


    There are a couple other wrinkles to using the %attr macro. If a particular file
    attribute doesn’t need to be specified, that attribute can be replaced with a
    dash (-), and %attr will not change it. Say, for instance, that a package’s files
    are installed with the permissions correctly set, as they almost always are. Instead
    of having to go to the trouble of entering the permissions for each and every
    file, each file can have the same %attr:


    ```

    %attr(-, root, root)

    ```


    This works for user and group specifications, as well.'
