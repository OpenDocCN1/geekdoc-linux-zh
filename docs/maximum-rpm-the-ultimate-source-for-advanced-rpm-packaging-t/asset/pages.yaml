- pgno: 141
  md: 'Now that we''ve seen the design philosophy of RPM, let''s look at the nuts
    and bolts of RPM''s build process. Building a package is similar to compiling
    code—there are inputs, an engine that does the dirty work, and outputs.


    # # 10.1. The Inputs


    There are three different kinds of inputs that are used to drive RPM''s build
    process. Two of the three inputs are required, and the third, strictly speaking,
    is optional. But unless you''re packaging your own code, chances are you''ll need
    it.


    # ## 10.1.1. The Sources


    First and foremost are the sources. After all, without them, there wouldn''t be
    much to build! In the case of packaging someone else''s software, the sources
    should be kept as the author distributed them, which usually means a compressed
    **tar** file. RPM can handle other archive formats, but a bit more up-front effort
    is required.


    In any case, you should not modify the sources used in the package building process.
    If you''re a third-party package builder, the sources should be just the way you
    got them from the author''s FTP site. If it''s your own software, the choice is
    up to you, but you should consider starting with your mainstream sources.


    # ## 10.1.2. The Patches


    Why all the emphasis on unmodified sources? Because RPM gives you the ability
    to automatically apply patches to them. Usually, the nature of these patches falls
    into one of the following categories:


    +   ❑ The patch addresses an issue specific to the target system. This could include
    changing makefiles to install the application into the appropriate directories,
    or resolving cross-platform conflicts, such as replacing BSD system calls with
    their SYSV counterparts.


    +   ❑ The patch creates files that are normally created during a configuration
    step in the installation process. Many times, it''s necessary to edit either configuration
    files or scripts in order to set things up for compilation. In other cases, a
    configuration utility needs to be run before the sources are compiled. In either
    instance, the patches create the environment required for proper compilation.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 10.1.2.1. Creating the Patches


    While it might sound a bit daunting to take into account the types of patches
    outlined here, it’s really quite simple. Here’s how it’s done:


    +   1. Unpack the sources.

    +   2. Rename the top-level directory. Make it end with .orig, for example.

    +   3. Unpack the sources again, leaving the top-level directory name unchanged.


    The source tree that you created the second time will be the one you’ll use to
    get the software to build.


    If the software builds with no changes required, that’s great—you won’t need a
    patch. But if you had to make any changes, you’ll have to create a set of patches.
    To do so, simply clean the source directory of any binaries. Then issue a recursive
    `diff` command to compare the source tree you used for the build against the original,
    unmodified source tree. It’s as easy as that!


    # 10.1.3. The Spec File


    The spec file is at the heart of RPM’s packaging building process. Similar in
    concept to a makefile, it contains information required by RPM to build the package,
    as well as instructions telling RPM how to build it. The spec file also dictates
    exactly what files are a part of the package and where they should be installed.


    As you might imagine, with this many responsibilities, the spec file format can
    be a bit complex. However, it’s broken into several sections, making it easier
    to handle. All told, there are eight sections:


    +   The preambule—The preambule contains information that will be displayed when
    users request information about the package. This includes a description of the
    package’s function, the version number of the software, and so on. Also contained
    in the preambule are lines identifying sources, patches, and even an icon to be
    used if the package is manipulated by graphical interface.


    +   The prep section—The prep section is where the actual work of building a package
    starts. As the name implies, this section is where the necessary preparations
    are made prior to the actual building of the software. In general, if anything
    needs to be done to the sources prior to building the software, it needs to happen
    in the prep section. Usually, this boils down to unpacking the sources.


    The contents of this section are an ordinary shell script. However, RPM does provide
    two macros to make life easier. One macro can unpack a compressed tar file and
    cd into the source directory. The other macro easily applies patches to the unpacked
    sources.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'The build section—Like the prep section, the build section consists of a shell
    script. As you might guess, this section is used to perform whatever commands
    are required to actually compile the sources. This section could consist of a
    single **make** command, or be more complex if the build process required it.
    Since most software today is built using **make**, there are no macros available
    in this section.


    The install section—Also containing a shell script, the install section is used
    to perform the commands required to actually install the software. If the software’s
    author added an install target in the makefile, this section might only consist
    of a **make install** command. Otherwise, you’d need to add the usual assortment
    of **cp**, **mv**, or **install** commands to get the job done.


    Install and uninstall scripts—Whereas the previous sections contain either information
    required by **RPM** to build the package or the actual commands to do the deed,
    this section is different. It consists of scripts that will be run on the user’s
    system when the package is actually installed or removed. **RPM** can execute
    a script in the following instances:


    +   * Prior to the package being installed

    +   * After the package has been installed

    +   * Prior to the package being erased

    +   * After the package has been erased


    One example of when this capability would be required is when a package contains
    shared libraries. In this case, **ldconfig** would need to be run after the package
    is installed or erased. As another example, if a package contains a shell, the
    file */etc/shells* would need to be updated appropriately when the package was
    installed or erased.


    The verify script—This is another script that is executed on the user’s system.
    It is executed when **RPM** verifies the package’s proper installation. Although
    **RPM** does most of the work verifying packages, this script can be used to verify
    aspects of the package that are beyond **RPM**’s capabilities.


    The clean section—Another script that can be present is a script that can clean
    things up after the build. This script is rarely used because **RPM** normally
    does a good job of clean-up in most build environments.


    The file list—The last section consists of a list of files that will comprise
    the package. Additionally, a number of macros can be used to control file attributes
    when installed, as well as to denote which files are documentation and which contain
    configuration information. The file list is very important; if it is missing,
    no package will be built.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 10.2. The Engine: RPM


    At the center of the action is RPM. It performs a number of steps during the build
    process:


    +   1. It executes the commands and macros in the prep section of the spec file.

    +   2. It checks the contents of the file list.

    +   3. It executes the commands and macros in the build section of the spec file.

    +   4. It executes the commands and macros in the install section of the spec
    file. Any macros in the file list are executed at this time, too.

    +   5. It creates the binary package file.

    +   6. It creates the source package file.


    By using different options on the RPM command line, the build process can be stopped
    at any of these steps. This makes the initial building of a package that much
    easier because it is then possible to see whether each step completed successfully
    before continuing to the next step.


    # 10.3. The Outputs


    The end product of this entire process is a source package file and a binary package
    file.


    # 10.3.1. The Source Package File


    The source package file is a specially formatted archive that contains the following
    files:


    +   - The original compressed tar file(s)

    +   - The spec file

    +   - The patches


    Because the source package contains everything needed to create the binary package,
    create the source package, and provide the original sources, it''s a great way
    to distribute source code. As mentioned earlier, it''s also a great way to archive
    all the information needed to rebuild a particular version of the package.


    # 10.3.2. The Binary RPM


    The binary package file is the one part of the entire RPM building process that
    is most visible to the user. It contains the files that comprise the application,
    along with any additional information needed to install and erase it. The binary
    package file is where the rubber hits the road.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# ## 10.4. And Now...


    Now that we''ve seen, in broad-brush terms, the way RPM builds packages, let''s
    take a look at an actual build. Chapter 11, "Building Packages: A Simple Example,"
    does just that, showing how simple it can be to build a package.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 11


    # Building Packages:

    A Simple Example'
  merge: -1
  img_proc: true
- pgno: 147
  md: "In Chapter 10, \"The Basics of Developing with RPM,\" we looked at RPM's build\
    \ process from a conceptual level. In this chapter, we will be performing an actual\
    \ build using RPM. In order to keep things understandable for this first pass,\
    \ the build will be very simple. Once we've covered the basics, we'll present\
    \ more real-world examples in later chapters.\n\n# ### 11.1. Creating the Build\
    \ Directory Structure\n\nRPM requires a set of directories in which to perform\
    \ the build. Although the directories' locations and names can be changed, it's\
    \ best to use the default layout. Note that if you've installed RPM, the build\
    \ directories are most likely in place already.\n\nThe normal directory layout\
    \ consists of a single top-level directory (the default name is /usr/src/redhat)\
    \ with five subdirectories. The five subdirectories and their functions are\n\n\
    +   - **/usr/src/redhat/SOURCES**—Contains the original sources, patches, and\
    \ icon files.\n+   - **/usr/src/redhat/SPECS**—Contains the spec files used to\
    \ control the build process.\n+   - **/usr/src/redhat/BUILD**—The directory in\
    \ which the sources are unpacked and the software is built.\n+   - **/usr/src/redhat/RPMS**—Contains\
    \ the binary package files created by the build process.\n+   - **/usr/src/redhat/SRPMs**—Contains\
    \ the source package files created by the build process.\n\nIn general, there\
    \ are no special requirements that need to be met when creating these directories.\
    \ In fact, the only important requirement is that the **BUILD** directory be part\
    \ of a filesystem with sufficient free space to build the largest package expected.\
    \ Here is a directory listing showing a typical build directory tree:\n\n```\n\
    ```\n# ls -lF /usr/src/redhat\ntotal 5\ndrwxr-x  3 root  root  1024  Aug  5 13:12\
    \ BUILD/\ndrwxr-xr-x  3 root  root  1024  Jul  17 17:51 RPMS/\ndrwxr-xr-x  4 root\
    \  root  1024  Aug  4 22:31 SOURCES/\ndrwxr-xr-x  2 root  root  1024  Aug  5 13:12\
    \ SPECS/\ndrwxr-xr-x  2 root  root  1024  Aug  4 22:28 SRPMS/\n#```\n\n```\n\n\
    Now that we have the directories ready to go, it's time to prepare for the build.\
    \ For the remainder of this chapter, we'll be building a fictional piece of software\
    \ known as **cdplayer**.\n\n> **NOTE**\n> \n> The **cdplayer** software is a mercilessly\
    \ hacked version of **cdp**, which was written by Sariel Har-Peled. The software\
    \ was hacked to provide a simple sample package and in no way represents the fine\
    \ work done by Sariel on **cdp**."
  merge: -1
  img_proc: true
- pgno: 148
  md: '# ## 11.2. Getting the Sources


    The first thing we need to do in order to build a package for cdp\_player is to
    obtain the sources. Being avid cdp\_player fans from way back, we know that the
    latest source can be found at GnomoVision\''s FTP site, so we go get a copy.


    We now have a gizzpped tar file of cdp\_player version 1.0 on our system. After
    putting a copy in the SOURCES directory, we''re ready to tell RPM what to do with
    it.


    # ## 11.3. Creating the Spec File


    The way we direct RPM in the build process is to create a spec file. As we saw
    in Chapter 10, the spec file contains eight different sections, most of which
    are required. Let''s go through each section and create cdp\_player\''s spec file
    as we go.


    # ### 11.3.1. The Preamble


    The preamble contains a wealth of information about the package being built and
    the people who built it. Here''s cdp\_player\''s preamble:


    ```

    # Sample spec file for cdp_player app...

    #

    Summary: A CD player app that rocks!

    Name: cdp\_player

    Version: 1.0

    Release: 1

    Copyright: GPL

    Group: Applications/Sound

    Source: ftp://ftp.gnomovision.com/pub/cdp\_player/cdp\_player-1.0.tgz

    URL: http://www.gnomovision.com/cdp\_player/cdp\_player.html

    Distribution: WSS Linux

    Vendor: White Socks Software, Inc.

    Packager: Santa Claus <sclaus@northpole.com>


    %description

    It slixes! It dices! It''s a CD player app that can''t be beat. By using

    the resonant frequency of the CD itself, it is able to simulate 20X

    oversampling. This leads to sound quality that cannot be equaled with

    more mundane software...

    ```


    In general, the preamble consists of entries, one per line, that start with a
    tag followed by a colon, and then some information. For example, the line starting
    with **Summary:** gives a short description of the packaged software that can
    be displayed by RPM. The order of the lines is not important, as long as they
    appear in the preamble.'
