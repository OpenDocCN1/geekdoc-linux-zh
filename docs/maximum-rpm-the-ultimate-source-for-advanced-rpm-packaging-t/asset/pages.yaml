- pgno: 425
  md: 'There are a number of resources available to help you with RPM, over and above
    the RPM man page and this book. Here are some pointers to them.


    # # F.1. Where to Get RPM


    Perhaps before asking where you can get RPM, it might be better to see if RPM
    is already installed on your system. If you have Red Hat Linux on your system,
    it''s there already. But be sure to check on other operating systems: people are
    porting RPM to different operating systems every day, and it just might be there
    waiting for you.


    Here''s a quick way to see if RPM is installed on your system:


    ```

    % rpm - --version

    RPM version 2.3

    %

    ```


    If this command doesn''t work, it might be that your path doesn''t include the
    directory where RPM resides. Check the usual binary directories before declaring
    RPM a no-show!


    # ## F.1.1. FTP Sites


    If you can''t find RPM on your system, you''ll have to grab a copy by FTP. RPM
    can be found practically anywhere Red Hat Linux is available. While the most obvious
    site, ftp.redhat.com, is certainly an option, it might not be your best choice.
    For one thing, it can be very busy. For another, unless your link to the Internet
    is near Red Hat''s sprawling development campus in Durham, North Carolina, there''s
    probably an FTP site closer to you.


    Here is a list of sites that mirror Red Hat Software''s main FTP site. Be aware
    that this list changes frequently, so don''t be surprised if a particular site
    no longer mirrors Red Hat or has moved from the paths listed here (an up-to-date
    copy of the list of mirror sites is always available on ftp.redhat.com, in the
    file MIRRORS):


    | FTP Site | Directory |

    | :--- | :--- |

    | sunsite.doc.ic.ac.uk | /packages/linux/redhat |

    | ftp.mp1.sb.mpg.de | /pub/linux/mirror/ftp.redhat.com |

    | ftp.jate.u-szeged.hu | /pub/linux/redhat |

    | ftp.ibp.fr | /pub/linux/distributions/redhat |

    | ftp.gwdg.de | /pub/linux/install/redhat |

    | ftp.msu.ru | /pub/OS/linux/redhat |

    | ftp.sgg.ru | /mirror/redhat |

    | sunsite.mff.cuni.cz | /OS/linux/Distributions/Redhat |

    | ftp.ton.tut.fi | /pub/linux/Redhat |

    | ftp.funet.fi | /pub/linux/images/Redhat |'
