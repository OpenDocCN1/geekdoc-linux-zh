- pgno: 288
  md: "The `arch_canon` tag here is used to define the canonical architecture information\
    \ for Sun Microsystems's SPARC architecture. In this case, the output from `uname`\
    \ is compared against `sun4`. If there's a match, the canonical architecture name\
    \ is set to `sparc`, and the architecture number is set to `3`.\n\nThe `os_canon`\
    \ tag here is used to define the canonical operating system information for the\
    \ Linux operating system. In this case, the output from `uname` is compared against\
    \ `Linux`. If there's a match, the canonical operating system name is set to `Linux`,\
    \ and the operating system number is set to `1`.\n\nThis description is not 100%\
    \ complete—there is an additional step performed during the time RPM gets the\
    \ system information from `uname` and compares it against a canonical name. Let's\
    \ look at the `rpmre` file entry that comes into play during this intermediate\
    \ step.\n\n# 19.3.1.2. buildxxxtranslate: Define Build Platform\n\nThe `buildxxxtranslate`\
    \ entry is used to define the build platform information. Specifically, these\
    \ entries are used to create a table that maps information from `uname` to the\
    \ appropriate architecture/operating system name.\n\nThe `buildxxxtranslate` entry\
    \ looks like this:\n\n```\n`buildxxxtranslate:<label>: <string>`\n`<label>:is\
    \ compared against information from uname(2). If a match is found, <string> is\
    \ used by RPM as the build platform information after it has been processed by\
    \ xxx_canon.`\n```\n\nHere are two examples:\n\n```\n``` \nbuildarchtranslate:\
    \ i586: i386\nbuildosttranslate: Linux: Linux\n```\n```\n\nThe `buildarchtranslate`\
    \ tag shown here is used to define the build architecture for an Intel Pentium\
    \ (or `i586`, as it's shown here) processor. Any Pentium-based system will, by\
    \ default, build packages for the Intel 80386 (or `i386`) architecture.\n\nThe\
    \ `buildosttranslate` tag shown here is used to define the build operating system\
    \ for systems running the Linux operating system. In this case, the build operating\
    \ system remains unchanged.\n\n# 19.3.1.3. xxx_compat: Define Compatible Architectures\n\
    \nThe `xxx_compat` entry is used to define which architectures and operating systems\
    \ are compatible with one another. It is used at install time only. The format\
    \ of the entry is\n`xxx_compat:<label>: <list>`"
