- pgno: 321
  md: 'That was short! And this huge difference brings up a good point about writing
    install scripts: It''s important to understand what you as the package builder
    should do for the users, and what they should do for themselves.


    In the case of the client package, every one of the steps performed by the postinstall
    script was something that a fairly knowledgeable user could have done. But all
    these steps have one thing in common. No matter how the user configures amanda,
    these steps will never change. And given the nature of client/server applications,
    there''s a good chance that many more amanda client packages will be installed
    than amanda servers. Would you like to be tasked with installing this package
    on 20 systems and performing each of the steps we''ve automated 20 times? We thought
    not.


    There is one step we did not automate for the client package: the creation of
    an .rhosts file. Since this file must contain the name of the amanda server, we
    have no way of knowing what the file should look like. Therefore, that''s one
    step we can''t automate.


    The server''s postinstall script is so short because there''s little else that
    can be automated. The other steps required to set up an amanda server include
    the following:


    +   1.  Choosing a configuration name, which requires user input.

    +   2.  Creating a directory to hold the server configuration files, named according
    to the configuration name, which depends on the first step.

    +   3.  Modifying sample configuration files to suit the site, which requires
    user input.

    +   4.  Adding cron tab entries to run amanda nightly, which requires user input.


    Since every step depends on the user making decisions, the best way to handle
    them is to not handle them at all. Let the user do it!


