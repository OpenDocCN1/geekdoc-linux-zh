- pgno: 149
  md: "Let's take a look at each line and see what function it performs:\n\n+   -\
    \ **Name** — The `name` line defines what the package will actually be called.\
    \ In general, it’s a good idea to use the name of the software. The name will\
    \ also be included in the package label and the package filename.\n\n+   - **Version**\
    \ — The `version` line should be set to the version of the software being packaged.\
    \ The version will also be included in the package label and the package filename.\n\
    \n+   - **Release** — The `release` line is a number used to represent the number\
    \ of times the software, at the present version, has been packaged. You can think\
    \ of it as the package’s version number. The release is also part of the package\
    \ label and package filename.\n\n+   - **Copyright** — The `copyright` line is\
    \ used to hold the packaged software’s copyright information. This makes it easy\
    \ to determine which packages can be freely redistributed and which cannot. In\
    \ our case, **cddplayer** is made available under the terms of the GNU General\
    \ Public License, so we’ve put **GPL** on the line.\n\n+   - **Group** — The `group`\
    \ line is used to hold a string that defines how the packaged software should\
    \ be grouped with other packages. The string consists of a series of words separated\
    \ by slashes. From left to right, the words describe the packaged software more\
    \ explicitly. We grouped **cddplayer** under `Applications` because it is an application,\
    \ and then under `Sound` because it is an application that is sound related.\n\
    \n+   - **Source** — The `source` line serves two purposes:\n+   \t- To document\
    \ where the packaged software’s sources can be found\n+   \t- To give the name\
    \ of the source file as it exists in the `SOURCES` subdirectory\n\nIn our example,\
    \ the **cddplayer** sources are contained in the file `cddplayer-1.0.tgz`, which\
    \ is available from `ftp.gnomevision.com`, in the directory `/pub/cddplayer`.\
    \ RPM actually ignores everything prior to the last filename in the source line,\
    \ so the first part of the source string could be anything you’d like. Traditionally,\
    \ the source line contains a uniform resource locator, or URL.\n\n+   - **URL**\
    \ — The `URL` line is used to contain a URL, like the source line. How are they\
    \ different? While the source line is used to provide the source filename to RPM,\
    \ the URL line points to documentation for the software being packaged.\n\n+ \
    \  - **Distribution** — The `distribution` line contains the name of the product\
    \ that the packaged software is a part of. In the Linux world, the operating system\
    \ is often packaged together into a distribution, hence the name. Because we’re\
    \ using a fictional application in this example, we’ve filled in the `distribution`\
    \ line with the name of a fictional distribution. There’s no requirement that\
    \ the spec file contain a distribution line, so individuals will probably omit\
    \ this."
  merge: -1
