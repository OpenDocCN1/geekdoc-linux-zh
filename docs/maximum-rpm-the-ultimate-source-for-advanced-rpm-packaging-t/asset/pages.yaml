- pgno: 289
  md: 'The names in the list are considered compatible to the name specified in the
    label. The following aren_compatt lines illustrate how a family of upwardly compatible
    architectures may be represented. For example, if the build architecture was defined
    as `i586`, the compatible architectures would be `i486` and `i386`. However, if
    the build system were an `i486`, the only compatible architecture would be an
    `i386`.


    While the os_compat line shown here is entirely fictional, its purpose would be
    to declare AIX compatible with Linux:


    ```

    ```

    arch_compatt:  i586: i486

    arch_compatt:  i486: i386

    os_compatt:  Linux: AIX

    ```

    ```


    If only it were that simple...


    # ### 19.3.2. Overriding Platform Information at Build Time


    By using the rpmrc file entries discussed in the preceding section, RPM usually
    makes the right decisions in selecting the build and install platforms. However,
    there might be times when RPM’s selections aren’t the best. Normally the circumstances
    are unusual, as in the case of cross-compiling software. In these cases, it is
    nice to have an easy way of overriding the build time architecture and operating
    system.


    The `--builddarch` and `--buildids` options can be used to set the build time
    architecture and operating system rather than relying on RPM’s automatic detection
    capabilities. These options are added to a normal RPM build command. One important
    point to remember is that although RPM does try to find the specified architecture
    name, it does no checking as to the sanity of the entered architecture or operating
    system. For example, if you enter an entirely fictional operating system, RPM
    will issue a `warning` message, but then happily build a package for it.


    *Why? Wouldn’t it make more sense for RPM to perform some sort of sanity check?
    In a word, no. One of RPM’s main design goals was to never get in the way of the
    package builder. If someone has a need to override his build platform information,
    he should know what he’s doing and what the full implications of his actions are.*


    Bottom line: Unless you know why you need to use `--builddarch` or `--buildids`,
    you probably don’t need to use them.


    # ### 19.3.3. Overriding Platform Information at Install Time


    It’s also possible to direct RPM to ignore platform information while a package
    is being installed. The `--ignorearch` and `--ignoreos` options, when added to
    any install or upgrade command, will direct RPM to proceed with the install or
    upgrade, even if the package’s platform doesn’t match the install platform.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Dangerous? Yes. But it can be indispensable in certain circumstances. As with
    the ability to override platform information at build time, unless you know why
    you need to use `--ignorearch` or `--ignores`, you probably don''t need to use
    them.


    # ### 19.4. optflags: The Other rpmbc File Entry


    While the `optflags` entry doesn''t play a part in determining the build or install
    platform, it does play a role in multiplatform package building. The `optflags`
    entry is used to define a standard set of options that can be used during the
    build process, specifically during compilation.


    The `optflags` entry looks like this:


    ```

    optflags: <architecture> <value>

    ```


    For example, assume that the following `optflags` entries were placed in an `rpmb`
    file:


    ```

    optflags: i386 -02 -m486 -fno-strength-reduce

    optflags: sparc -02

    ```


    If RPM were running on an Intel 80386-compatible architecture, the `optflags`
    value would be set to `-02 -m486 -fno-strength-reduce`. If, however, RPM were
    running on a Sun SPARC-based system, `optflags` would be set to `-02`.


    This entry sets the `RPM_OPT_FLAGS` environment variable, which can be used in
    the `$rpmb`, `$build`, and `$install` scripts.


    # ### 19.5. Platform-Dependent Tags


    Once RPM has determined the build platform''s information, that information can
    be used in the build process. The first way this information can be used is to
    determine whether a given package should be built on a given platform. This is
    done through the use of four tags (discussed in the following sections) that can
    be added to a spec file.


    There can be many reasons to do this. For example, the software may not build
    correctly on a given platform. Or the software may be platform specific, such
    that packaging the software on any other platform, while technologically possible,
    would really make no sense.


    The real world is not always so clear cut, so there might even be cases where
    a package should be built on, say, three different platforms, but no others. By
    carefully using the tags described in the following sections, any conceivable
    situation can be covered.


    As with the `rpmbc` file entries we''ve already discussed, there are identical
    tags for architecture and operating system, so we''ll discuss them together.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 19.5.1. The **excludexxx** Tags


    **excludexxx** tags are used to direct RPM to ensure that the package does not
    attempt to build on the excluded platforms. One or more platforms may be specified
    after the **excludexxx** tags, separated by either spaces or commas. Here are
    two examples:


    ```

    ExcludeArch: sparc alpha

    ExcludeOS: Irix

    ```


    The first line prevents systems based on the Sun SPARC and Digital Alpha/AXP architectures
    from attempting to build the package. The second line ensures that the package
    will not be built for the Silicon Graphics operating system Irix.


    If a build is attempted on an excluded architecture or operating system, the following
    message will be displayed, and the build will fail:


    ```

    # rpm -ba cdplayer-1.0.spec

    Arch mismatch!

    cdplayer-1.0.spec doesn''t build on this architecture

    #

    ```


    **excludexxx** tags are meant to explicitly prevent a finite set of architectures
    or operating systems from building a package. If your goal is to ensure that a
    package will build on *only one* architecture, you should use the **exclusivexxx**
    tags.


    # 19.5.2. The **exclusivexxx** Tags


    **exclusivexxx** tags are used to direct RPM to only build the package on the
    specified platforms. These tags ensure that in the future no brand-new platform
    will mistakenly attempt to build the package. RPM will build the package on the
    specified platforms only.


    The syntax of the **exclusivexxx** tags is identical to that of **excludexxx**:


    ```

    ExclusiveArch: sparc alpha

    ExclusiveOS: Irix

    ```


    In the first line, the package will only build on a Sun SPARC or Digital Alpha/AXP
    system. In the second, the package will only be built on the Irix operating system.


    **exclusivexxx** tags are meant to explicitly allow a finite set of architectures
    or operating systems to build a package. If your goal is to ensure that a package
    will *not* build on a specific platform, you should use the **excludexxx** tag.


    # 19.6. Platform-Dependent Conditionals


    Of course, the control exerted by the **excludexxx** and **exclusivexxx** tags
    over package building is often too coarse. There may be packages, for example,
    that would build just fine on another platform, if only you could substitute a
    platform-specific patch file or change some paths in the `%files` list.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'The key to exerting this kind of platform-specific control in the spec file
    is to use RPM’s conditionals. The conditionals provide a general-purpose means
    of constructing a platform-specific version of the spec file during the actual
    build process.


    # 19.6.1. Common Features of All Conditionals


    A few things are common to each conditional, so let’s discuss them first. The
    first thing is that conditionals are block structured. The second is that conditionals
    can be nested. Finally, conditionals can span any part of the spec file.


    # 19.6.1.1. Conditionals Are Block Structured


    Every conditional is block structured— in other words, the conditional begins
    at a certain point within the spec file and continues some number of lines until
    it is ended. This forms a block that will be used or ignored, depending on the
    platform the conditional is checking for as well as the build platform itself.


    Every conditional starts with a line beginning with `%if` and is followed by one
    of four platform-related conditions. Every conditional ends with a line containing
    `%endif`.


    Ignoring the platform-related conditions for a moment, here’s an example of a
    conditional block:


    ```

    %ifos Linux

    Summary: This is a package for the Linux operating system

    %endif

    ```


    It’s a one-line block, but a block nonetheless.


    There’s also another style of conditional block. As before, it starts with `%if`
    and ends with `%endif`. But there’s something new in the middle:


    ```

    %ifos Linux

    Summary: This is a package for the Linux operating system

    %else

    Summary: This is a package for some other operating system

    %endif

    ```


    Here we’ve replaced one `summary` tag with another.


    # 19.6.1.2. Conditionals Can Be Nested


    Conditionals can be nested— that is, the block formed by one conditional can enclose
    another conditional. Here’s an example:


    ```

    %ifarch i386


    echo "This is an i386"


    %ifos Linux

    echo "This is a Linux system"

    ```'
  merge: -1
  img_proc: true
- pgno: 293
  md: '```

    ```text

    %else

    echo "This is not a Linux system"

    %endif

    %else


    echo "This is not an i386"

    %endif

    ```

    ```


    In this example, the first conditional block formed by the `%ifarch i386` line
    contains a complete `%ifos...%else...%endif` conditional. Therefore, if the build
    system were Intel based, the `%ifos` conditional would be tested. If the build
    system were not Intel based, the `%ifos` conditional would not be tested.


    # 19.6.1.3. Conditionals Can Cross Spec File Sections


    The next thing each conditional has in common is that there is no limit to the
    number of lines a conditional block can contain. You could enclose the entire
    spec file within a conditional. But it''s much better to use conditionals to insert
    only the appropriate platform-specific contents.


    Now that we have the basics out of the way, let''s take a look at each of the
    conditionals and see how they work.


    # 19.6.2. `%ifxxx`


    The `%ifxxx` conditionals are used to control the inclusion of a block as long
    as the platform-dependent information is true. Here is an example:


    ```

    ```text

    %ifarch i386 alpha

    ```

    ```


    In this case, the block following the conditional would be included only if the
    build architecture were i386 or alpha.


    Here''s another example:


    ```

    ```text

    %ifos Linux

    ```

    ```


    This example would include the block following the conditional only if the operating
    system were Linux.


    # 19.6.3. `%ifnxxx`


    The `%ifnxxx` conditionals are used to control the inclusion of a block as long
    as the platform-dependent information is not true. Here is an example:


    ```

    ```text

    %ifnarch i386 alpha

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'In this case, the block following the conditional would be included only if
    the build architecture were not i386 or alpha.


    Here''s another example:


    ```

    %ifnos Linux

    ```


    This example would include the block following the conditional only if the operating
    system were not Linux.


    # ### 19.7. Hints and Kinks


    There isn''t much in the way of hard-and-fast rules when it comes to multiplatform
    package building. But in general, the following uses of RPM''s multiplatform capabilities
    seem to work the best:


    +   - The **excludexxx** and **excluisivexxx** tags are best used when it''s known
    that there''s no reason for the package to be built on specific architectures.

    +   - The **%ifxxx** and **%ifnxxx** conditionals are most likely to be used in
    the following areas:

    +     - Controlling the inclusion of **%patch** macros for platform-specific patches.

    +     - Setting up platform-specific initialization prior to building the software.

    +     - Tailoring the **%files** list when the software creates platform-specific
    files.


    Given that some software is more easily ported to different platforms than others,
    this list is far from complete. If there''s one thing to remember about multiplatform
    package building, it''s to not be afraid to experiment!'
  merge: -1
  img_proc: true
