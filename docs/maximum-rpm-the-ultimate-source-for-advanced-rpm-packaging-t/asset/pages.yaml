- pgno: 44
  md: '# 2.4. Additional Options to rpm -i


    Normally rpm -i, perhaps with -v and -h, is all you’ll need. However, there may
    be times when a basic install is not going to get the job done. Fortunately, RPM
    has a wealth of install options to make the tough times a little easier. As with
    any other powerful tool, you should understand these options before putting them
    to use. Let’s take a look at them.


    # 2.4.1. Getting a Lot More Information with -vv


    Sometimes it’s necessary to have even more information than we can get with -v.
    By adding another v, we can start to see more of RPM’s inner workings:


    ```

    # rpm -ivv eject-1.2-2.i386.rpm

    D: installing eject-1.2-2.i386.rpm

    Installing eject-1.2-2.i386.rpm

    D: package: eject-1.2-2 files test = 0

    D: running preinstall script (if any)

    D: setting file owners and groups by name (not id)

    D: ///usr/bin/eject owned by root (0), group root (0) mode 755

    D: ///usr/man/man1/eject.1 owned by root (0), group root (0) mode 644

    D: running postinstall script (if any)

    #

    ```


    The lines starting with D: have been added by using -vv. The line ending with
    files test = 0 means that RPM is going to install the package. If the number were
    nonzero, it would mean that the -—test option is present, and RPM would not perform
    the install. For more information on using -—test with rpm -i, see section 2.4.2.


    Continuing with this example, we see that RPM next executes a preinstall script
    (if there is one), followed by the actual installation of the files in the package.
    There is one line for each file being installed, and that line shows the filename,
    ownership, group membership, and permissions (or mode) applied to the file. With
    larger packages, the output from -vv can become quite lengthy! Finally, RPM runs
    a postinstall script, if one exists for the package. We’ll be discussing pre-
    and postinstall scripts in more detail in section 2.4.10.


    In most cases, it will not be necessary to use -vv. It is normally used by software
    engineers working on RPM itself, and the output can change without notice. However,
    it’s a handy way to gain insights into RPM’s inner workings.


    # 2.4.2. -—test: Perform Installation Tests Only


    There are times when it’s more appropriate to take it slow and not try to install
    a package right away. RPM provides the -—test option for that. As the names implies,
    it performs all the checks that RPM normally does during an install, but it stops
    short of actually performing the steps necessary to install the package:


    ```

    # rpm -i -—test eject-1.2-2.i386.rpm

    #

    ```'
  merge: -1
  img_proc: true
