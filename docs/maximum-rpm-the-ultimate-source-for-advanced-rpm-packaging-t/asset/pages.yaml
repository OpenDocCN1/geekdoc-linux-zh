    %build

    make


    %install

    make install

    ```


    The `%prep` script consists of one line containing the simplest flavor of `%setup`
    macro. Since we only need `%setup` to unpack one set of sources, there are no
    options we need to add.


    The `%build` script is just as simple, with the single `make` command required
    to build amanda.


    Finally, the `%install` script maintains our single-line trend for build-time
    scripts. Here a simple `make install` will put all the files where they need to
    be for RPM to package them.


