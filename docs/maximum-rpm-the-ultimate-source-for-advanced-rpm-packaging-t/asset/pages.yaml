- pgno: 359
  md: '# A.1. The RPM File-Naming Convention


    Although RPM will run just as well if a package file has been renamed, when the
    packages are created during RPM’s build process, they follow this specific naming
    convention:

    name-version-release.architecture.rpm


    In this convention


    +   * name is a name describing the packaged software.

    +   * version is the version of the packaged software.

    +   * release is the number of times this version of the software has been packaged.

    +   * architecture is a shorthand name describing the type of computer hardware
    the packaged software is meant to run on. It may also be the string src, or nosrc.
    Both of these strings indicate that the file is an RPM source package. The nosrc
    string means that the file contains only package building files, while the src
    string means that the file contains the necessary package building files and the
    software’s source code.


    A few notes are in order. Normally, the package name is taken verbatim from the
    packaged software’s name. Occasionally, this approach won’t work—usually this
    occurs when the software is split into multiple subpackages, each supporting a
    different set of functions. An example of this situation is the way ncurss was
    packaged on Red Hat Linux. The package incorporating the ncurss basic functionality
    was called ncurss, while the package incorporating those parts of ncurss’s program
    development functionality was named ncurss-devel.


    The version number is normally taken verbatim from the package’s version. The
    only restriction placed on the version is that it cannot contain a dash (-).


    The release can be thought of as the package’s version. Traditionally it is a
    number, starting at 1, that shows how many times the packaged software, at a given
    version, has been built. This is tradition and not a restriction, however. As
    with the version number, the only restriction is that dashes are not allowed.


    The architecture specifier is a string that indicates what hardware the package
    has been built for. There are a number of architectures defined:


    +   * i386—The Intel x86 family of microprocessors, starting with the 80386

    +   * alpha—The Digital Alpha/AXP series of microprocessors

    +   * sparc—Sun Microsystem’s SPARC series of chips

    +   * mips—MIPS Technologies’ processors

    +   * ppc—The Power PC microprocessor family

    +   * m68K—Motorola’s 68000 series of CISC microprocessors

    +   * SGI—Equivalent to MIPS'
  merge: -1
  img_proc: true
- pgno: 360
  md: "This list will almost certainly change. For the most up-to-date list, refer\
    \ to the file /usr/lib/rpmrc. It contains information used internally by RPM,\
    \ including a list of architectures and equivalent code numbers.\n\n# A.2. The\
    \ RPM File Format\n\nWhile the following details concerning the actual format\
    \ of an RPM package file were accurate at the time this was written, three points\
    \ should be kept in mind:\n\n+   ❑ The file format is subject to change.\n+  \
    \ ❑ If a package file is to be manipulated somehow, you are strongly urged to\
    \ use the appropriate rpmlib routines to access the package file. Why? See the\
    \ previous point!\n+   ❑ This appendix describes the most recent version of the\
    \ RPM file format: version 3.\n\nThe `file(1)` utility can be used to see a package's\
    \ file format version.\nWith those caveats out of the way, let's take a look inside\
    \ an RPM file…\n\n# A.2.1. Parts of an RPM File\n\nEvery RPM package file can\
    \ be divided into four distinct sections:\n\n+   ❑ The lead\n+   ❑ The signature\n\
    +   ❑ The header\n+   ❑ The archive\n\nPackage files are written to disk in network\
    \ byte order. If required, RPM will automatically convert to host byte order when\
    \ the package file is read. Let's take a look at each section, starting with the\
    \ lead.\n\n# A.2.1.1. The Lead\n\nThe lead is the first part of an RPM package\
    \ file. In previous versions of RPM, it was used to store information used internally\
    \ by RPM. Today, however, the lead's sole purpose is to make it easy to identify\
    \ an RPM package file. For example, the `file(1)` command uses the lead. (Refer\
    \ to section A.4 for a discussion on identifying RPM package files with the `file`\
    \ command.) All the information contained in the lead has been duplicated or superseded\
    \ by information contained in the header. (The header is discussed in section\
    \ A.2.1.3.)\n\nRPM defines a C structure that describes the lead:\n```c\nstruct\
    \ rpmlead {\n    unsigned char magic[4];\n    unsigned char major, minor;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 361
  md: "```\nshort type;  \nshort archnum;  \nchar name[86];  \nshort osnum;  \nshort\
    \ signature_type;  \nchar reserved[16];\n};\n```\n\nLet's take a look at an actual\
    \ package file and examine the various pieces of data that make up the lead. In\
    \ the following display, the number to the left of the colon is the byte offset,\
    \ in hexadecimal, from the start of the file. The eight groups of four characters\
    \ show the hex value of the bytes in the file—2 bytes per group of four characters.\
    \ Finally, the characters on the right show the ASCII values of the data bytes.\
    \ When a data byte's value results in a non-printable character, a dot (.) is\
    \ inserted instead. Here are the first 32 bytes of a package file—in this case,\
    \ the package file rpm-2.2.1-1.1386.rpm:\n\n```\n00000000: edab eedb 0300 0000\
    \ 0001 7270 6d2d 322e rpm-2. \n00000010: 322e 312d 3100 0000 0000 0000 0000 2.1.1.…….…….\n\
    ```\n\nThe first 4 bytes (edab eedb) are the magic values that identify the file\
    \ as an RPM package file. Both the file command and RPM use these magic numbers\
    \ to determine whether a file is legitimate.\n\nThe next 2 bytes (0300) indicate\
    \ the RPM file format version. In this case, the file’s major version number is\
    \ 3, and the minor version number is 0. Versions of RPM later than 2.1 create\
    \ version 3.0 package files.\n\nThe next 2 bytes (0000) determine what type of\
    \ RPM file the file is. There are presently two types defined:\n\n+   - Binary\
    \ package file (type=0000)\n+   - Source package file (type=0001)\n\nIn this case,\
    \ the file is a binary package file.\n\nThe next 2 bytes (0001) are used to store\
    \ the architecture that the package was built for. In this case, the number 1\
    \ refers to the i386 architecture. (Note that the architecture used internally\
    \ by RPM is actually stored in the header. This value is strictly for file(1)’s\
    \ use.) In the case of a source package file, these two bytes should be ignored,\
    \ as source packages are not built for a specific architecture.\n\nThe next 66\
    \ bytes (starting with 7270 6d2d) contain the name of the package. The name must\
    \ end with a null byte, which leaves 65 bytes for RPM’s usual name-version-release-style\
    \ name. In this case, we can read the name from the right side of the output:\n\
    \nrpm-2.2.1-1\nSince the name rpm-2.2.1-1 is shorter than the 65 bytes allocated\
    \ for the name, the leftover bytes are filled with nulls."
  merge: -1
  img_proc: true
- pgno: 362
  md: "Skipping past the space allocated for the name, we see 2 bytes (0001):\n\n\
    ```\n```\n00000040: 0000 0000 0000 0000 0000 0000 0001 0005 \n00000050: 0400 24e1\
    \ ffbf ffbf 0bb3 0008 0066 .... $. .k........\n```\n```\n\nThese bytes represent\
    \ the operating system for which this package was built. In this case, 1 equals\
    \ Linux. As with the architecture-to-number translations, the operating system\
    \ and corresponding code numbers can be found in the file, `/usr/lib/rpmrc`.\n\
    \nThe next two bytes (**0005**) indicate the type of signature used in the file.\
    \ A type 5 signature is new to version 3 RPM files. The signature appears next\
    \ in the file, but we need to discuss an additional detail before exploring the\
    \ signature.\n\n# A.2.1.1.1. Wanted: A New RPM Data Structure\n\nBy looking at\
    \ the C structure that defines the lead, and matching it with the bytes in an\
    \ actual package file, it’s trivial to extract the data from the lead. From a\
    \ programming standpoint, it’s also easy to manipulate data in the lead; it’s\
    \ simply a matter of using the element names from the structure. But there’s a\
    \ problem. And because of that problem, the lead is no longer used internally\
    \ by RPM.\n\n# A.2.1.1.1.1. The Lead: An Abandoned Data Structure\n\nWhat’s the\
    \ problem, and why is the lead no longer used by RPM? The answer to these questions\
    \ is a single word: **inflexibility**. The technique of defining a C structure\
    \ to access data in a file just isn’t very flexible. Let’s look at an example.\n\
    \nFlip back to the lead’s C structure on page 349. Say, for example, that some\
    \ software comes along, and it has a long name. A very long name. A name so long,\
    \ in fact, that the 66 bytes defined in the structure element name just couldn’t\
    \ hold it.\n\nWhat can we do? Well, we could certainly change the structure such\
    \ that the **name** element would be 100 bytes long. But once a new version of\
    \ RPM is created using this new structure, we have two problems:\n\n+   * Any\
    \ package file created with the new version of RPM wouldn’t be able to read older\
    \ package formats.\n+   * Any older version of RPM would be unable to install\
    \ packages created with the newer version of RPM.\n\nNot a very good situation!\
    \ Ideally, we would like to somehow eliminate the requirement that the format\
    \ of the data written to a package file be engraved in granite. We should be able\
    \ to do the following things, all without losing compatibility with existing versions\
    \ of RPM:\n\n+   * Add extra data to the file format\n+   * Change the size of\
    \ existing data\n+   * Reorder the data\n\nSounds like a big problem, but there’s\
    \ a solution."
