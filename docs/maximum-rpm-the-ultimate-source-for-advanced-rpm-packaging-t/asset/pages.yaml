    The moral of this story is that, when trying to find out which package fulfills
    another package’s requirements, it’s a good idea to also try a simple query using
    the requirement as a package name. Continuing our earlier example, let’s see if
    there’s a package called **blather**:


    ```

    # rpm -q blather

    blather-3.5-1

    #

