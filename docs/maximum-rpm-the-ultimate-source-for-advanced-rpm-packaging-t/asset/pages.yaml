- pgno: 56
  md: "# 2.4.17. --ignorearch: Do Not Verify Package Architecture\n\nWhen a package\
    \ file is created, RPM specifies the architecture, or type of computer hardware,\
    \ for which the package was created. This is a good thing because the architecture\
    \ is one of the main factors in determining whether a package written for one\
    \ computer is going to be compatible with another computer.\n\nWhen a package\
    \ is installed, RPM uses the `arch_compat` `rpmrc` entries to determine what are\
    \ normally considered compatible architectures. Unless you’re porting RPM to a\
    \ new architecture, you shouldn’t make any changes to these entries. (You’ll find\
    \ more on `arch_compat` in section 19.3.1 in Chapter 19, “Building Packages for\
    \ Multiple Architectures and Operating Systems.”) Although RPM attempts to make\
    \ the right decisions regarding package compatibility, there are times when it\
    \ errs on the side of conservatism. In those cases, it’s necessary to override\
    \ RPM’s decision. The `--ignorearch` option is used in those cases. When it’s\
    \ added to the command line, RPM will not perform any architecture-related checking.\n\
    \n> **CAUTION**\n> \n> Unless you really know what you’re doing, you should never\
    \ use `--ignorearch`!\n\n# 2.4.18. --ignoresos: Do Not Verify the Package Operating\
    \ System\n\nWhen a package file is created, RPM specifies the operating system\
    \ for which the package was created. This is good because the operating system\
    \ is one of the main factors in determining whether a package written for one\
    \ computer is going to be compatible with another computer.\n\nWhen a package\
    \ is installed, RPM uses the `os_compat` `rpmrc` entries to determine what are\
    \ normally considered compatible operating systems. Unless you’re porting RPM\
    \ to a new operating system, you shouldn’t make any changes to these entries.\
    \ (You’ll find more on `oscompat` in section 19.3.1 in Chapter 19.) Although RPM\
    \ attempts to make the right decisions regarding package compatibility, there\
    \ are times when it errs on the side of conservatism. In those cases, it’s necessary\
    \ to override RPM’s decision. The `--ignoresos` option is used in those cases.\
    \ When it’s added to the command line, RPM will not perform any operating system–related\
    \ checking.\n\n> **CAUTION**\n> \n> Unless you really know what you’re doing,\
    \ you should never use `--ignoresos`!"
  merge: -1
