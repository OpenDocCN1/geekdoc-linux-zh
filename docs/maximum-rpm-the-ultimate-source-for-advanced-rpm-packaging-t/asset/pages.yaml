- pgno: 332
  md: "# ## 21.2.5. RPM Database Manipulation\n\nThe functions in this section perform\
    \ the basic operations on the RPM database. This includes opening and closing\
    \ the database, as well as creating the database. A function also exists to re-build\
    \ a database that has been corrupted.\n\nEvery function that accesses the RPM\
    \ database in some fashion makes use of the `rpmdb` structure. This structure\
    \ is used as a handle to refer to a particular RPM database.\n\n# ### 21.2.5.1.\
    \ `rpmdbOpen()`—Open RPM Database\n\nThis function opens the RPM database located\
    \ in `RPMVAR_DBPATH`, returning the `rpmdb` structure `db`. If `root` is specified,\
    \ it is prepended to `RPMVAR_DBPATH` prior to opening. The `mode` and `perms`\
    \ parameters are identical to `open(2)`'s `flags` and `mode` parameters, respectively:\n\
    \n```\n```C\n#include <rpm/rpmdb.h>\n\nint rpmdbOpen(char * root,\n          \
    \     rpmdb * dbp,\n               int mode,\n               int perms);\n```\n\
    ```\n\nThe function returns `1` on error, and `0` on success.\n\n# ### 21.2.5.2.\
    \ `rpmdbClose()`—Close RPM Database\n\nThis function closes the RPM database specified\
    \ by the `rpmdb` structure `db`. The `db` structure is also freed:\n\n```\n```C\n\
    #include <rpm/rpmdb.h>\n\nvoid rpmdbClose(rpmdb db);\n```\n```\n\n# ### 21.2.5.3.\
    \ `rpmdbInit()`—Create RPM Database\n\nThis function creates a new RPM database\
    \ to be located in `RPMVAR_DBPATH`. If the database already exists, it is left\
    \ unchanged. If `root` is specified, it is prepended to `RPMVAR_DBPATH` prior\
    \ to creation. The `perms` parameter is identical to `open(2)`'s `mode` parameter:\n\
    \n```\n```C\n#include <rpm/rpmdb.h>\n\nint rpmdbInit(char * root,\n          \
    \    int perms);\n```\n```\n\nThe function returns `1` on error, and `0` on success."
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 21.2.5.4. rpmdbRebuild()—Rebuild RPM Database


    This function rebuilds the RPM database located in `RPMVAR_DBPATH`. If root is
    specified, it is prepended to `RPMVAR_DBPATH` prior to rebuilding:


    ```

    #include <rpm/rpmlib.h>


    int rpmdbRebuild(char * root);

    ```


    The function returns 1 on error, and 0 on success.


    # 21.2.6. RPM Database Traversal


    The following functions are used to traverse the RPM database. Also described
    in this section is a function to retrieve a database record by its record number.


    Note that database records are returned in the form of a header structure. This
    data structure is widely used throughout rpmlib. We will discuss more header-related
    functions in sections 21.2.13 and 21.2.14.


    # 21.2.6.1. rpmdbFirstRecNum()—Begin RPM Database Traversal


    This function returns the record number of the first record in the database specified
    by db:


    ```

    #include <rpm/rpmlib.h>


    unsigned int rpmdbFirstRecNum(rpmdb db);

    ```


    On error, it returns 0.


    # 21.2.6.2. rpmdbNextRecNum()—Traverse to Next RPM Database Record


    This function returns the record number of the record following the record number
    passed in lastOffset, in the database specified by db:


    ```

    #include <rpm/rpmlib.h>


    unsigned int rpmdbNextRecNum(rpmdb db,

    unsigned int lastOffset);

    ```


    On error, this function returns 0.


    # 21.2.6.3. rpmdbGetRecord()—Return Record from RPM Database


    This function returns the record at the record number specified by offset from
    the database specified by db:


    ```

    #include <rpm/rpmlib.h>


    Header rpmdbGetRecord(rpmdb db,

    unsigned int offset);

    ```


    This function returns NULL on error.'
  merge: -1
  img_proc: true
- pgno: 334
  md: "# 21.2.7. RPM Database Search\n\nThe functions in this section search the various\
    \ parts of the RPM database. They all return a structure of type `dbiIndexSet`,\
    \ which contains the records that match the search term. Here is the definition\
    \ of the structure, as found in `<rpm/dbindex.h>`:\n\n```\ntypedef struct {\n\
    \  dbiIndexRecord * recs;\n  int count;\n} dbiIndexSet;\n```\n\nEach `dbiIndexRecord`\
    \ is also defined in `<rpm/dbindex.h>`, as follows:\n\n```\ntypedef struct {\n\
    \  unsigned int recOffset;\n  unsigned int fileNumber;\n} dbiIndexRecord;\n```\n\
    \nThe `recOffset` element is the offset of the record from the start of the database\
    \ file. The `fileNumber` element is only used by `rpmdbFindFromFile()`.\n\nKeep\
    \ in mind that the `rpmdbFindxxx()` search functions each return `dbiIndexSet`\
    \ structures, which must be freed with `dbiFreeIndexRecord()` when no longer needed.\n\
    \n# 21.2.7.1. dbiFreeIndexRecord()—Free Database Index\n\nThis function frees\
    \ the database index set specified by `set`:\n\n```\n#include <rpm/rpmdb.h>\n\
    #include <rpm/dbindex.h>\n\nvoid dbiFreeIndexRecord(dbiIndexSet set);\n```\n\n\
    # 21.2.7.2. rpmdbFindFromFile()—Search RPM Database by File\n\nThis function searches\
    \ the RPM database specified by `db` for the package that owns the file specified\
    \ by `filespec`. It returns matching records in `matches`:\n\n```\n#include <rpm/rpmdb.h>\n\
    #include <rpm/dbindex.h>\n\nint rpmdbFindFromFile(rpmds db,\n                \
    \      char * filespec,\n                      dbiIndexSet * matches);\n```\n\n\
    This function returns the following status values:\n\n+   - `1`—An error occurred\
    \ while reading a database record.\n+   - `0`—The search completed normally.\n\
    +   - `1`—The search term was not found."
  merge: -1
  img_proc: true
- pgno: 335
  md: "# ### 21.2.7.3. rpmdbFindByGroup()—Search RPM Database by Group\n\nThis function\
    \ searches the RPM database specified by `db` for the packages that are members\
    \ of the group specified by `group`. It returns matching records in `matches`:\n\
    \n```\n#include <rpm/rpmlib.h>\n#include <rpm/dbindex.h>\n\nint rpmdbFindByGroup(rpmdb\
    \ db,\n                     char * group,\n                     dbiIndexSet *\
    \ matches);\n```\n\nThis function returns the following status values:\n\n+  \
    \ * -1—An error occurred while reading a database record.\n+   * 0—The search\
    \ completed normally.\n+   * 1—The search term was not found.\n\n# ### 21.2.7.4.\
    \ rpmdbFindPackage()—Search RPM Database by Package\n\nThis function searches\
    \ the RPM database specified by `db` for the packages with the package name (not\
    \ label) specified by `name`. It returns matching records in `matches`:\n\n```\n\
    #include <rpm/rpmlib.h>\n#include <rpm/dbindex.h>\n\nint rpmdbFindPackage(rpmdb\
    \ db,\n                     char * name,\n                     dbiIndexSet * matches);\n\
    ```\n\nThis function returns the following status values:\n\n+   * -1—An error\
    \ occurred while reading a database record.\n+   * 0—The search completed normally.\n\
    +   * 1—The search term was not found.\n\n# ### 21.2.7.5. rpmdbFindByProvides()—Search\
    \ RPM Database by Provides\n\nThis function searches the RPM database specified\
    \ by `db` for the packages that make available the provides information specified\
    \ by `provides`. It returns matching records in `matches`:\n\n```\n#include <rpm/rpmlib.h>\n\
    #include <rpm/dbindex.h>\n\nint rpmdbFindByProvides(rpmdb db,\n              \
    \         char * provides,\n                       dbiIndexSet * matches);\n```"
  merge: -1
  img_proc: true
- pgno: 336
  md: "This function returns the following status values:\n\n+   - -1—An error occurred\
    \ while reading a database record.\n+   - 0—The search completed normally.\n+\
    \   - 1—The search term was not found.\n\n# 21.2.7.6. rpmd\\_FindByRequiredBy()—Search\
    \ RPM Database by Requires\n\nThis function searches the RPM database specified\
    \ by db for the packages that need the requires information specified by requires.\
    \ It returns matching records in matches:\n\n```\n```c\n#include <rpm/rpmLib.h>\n\
    #include <rpm/dbiIndex.h>\n\nint rpmd\\_FindByRequiredBy(rpmd\\_ db,\n       \
    \                    char \\* requires,\n                           dbiIndexSet\
    \ \\* matches);\n```\n```\n\nThis function returns the following status values:\n\
    \n+   - -1—An error occurred while reading a database record.\n+   - 0—The search\
    \ completed normally.\n+   - 1—The search term was not found.\n\n# 21.2.7.7. rpmd\\\
    _FindByConflicts()—Search RPM Database by Conflicts\n\nThis function searches\
    \ the RPM database specified by db for the packages that conflict with the conflicts\
    \ information specified by conflicts. It returns matching records in matches:\n\
    \n```\n```c\n#include <rpm/rpmLib.h>\n#include <rpm/dbiIndex.h>\n\nint rpmd\\\
    _FindByConflicts(rpmd\\_ db,\n                          char \\* conflicts,\n\
    \                          dbiIndexSet \\* matches);\n```\n```\n\nThis function\
    \ returns the following status values:\n\n+   - -1—An error occurred while reading\
    \ a database record.\n+   - 0—The search completed normally.\n+   - 1—The search\
    \ term was not found.\n\n# 21.2.8. Package Manipulation\n\nThe functions described\
    \ in this section perform the operations most RPM users are familiar with. Functions\
    \ that install and erase packages are here, along with a few related, lower-level\
    \ support functions."
