- pgno: 375
  md: 'The **rpmrc** file is used to control RPM''s actions. The file''s entries have
    an effect on nearly every aspect of RPM''s operations. Here, we describe in more
    detail the **rpmrc** files, as well as the command used to show how RPM interprets
    the files.


    # ## B.1. Using the --showrc Option


    As we''ll see in a moment, RPM can read more than one **rpmrc** file, and each
    file can contain nearly 30 different types of entries. This can make it difficult
    to determine what values RPM is actually using.


    Luckily, there''s an option that can be used to help make sense of it all. The
    --showrc option displays the value for each of the entries. The output is divided
    into two sections:


    +   -   Architecture and operating system values

    +   -   **rpmrc** values


    The architecture and operating system values define the architecture and operating
    system on which RPM is running. These values define the environment for both building
    and installing packages. They also define which architectures and operating systems
    are compatible with each other.


    The **rpmrc** values define many aspects of RPM''s operation. These values range
    from the path to RPM''s database to the name of the person listed as having built
    the package.


    Here''s an example of --showrc''s output:


    ```

    # rpm --showrc

    ARCHITECTURE AND OS:

    build arch        : i386

    build os          : linux

    install arch      : i486

    install os        : linux

    compatible arch list : i486 i386

    compatible os list : linux

    RPMRC VALUES:

    builddir          : /usr/src/redhat/BUILD

    buildroot         : (not set)

    cpioin           : cpio

    dbpath            : /var/lib/rpm

    defaultdocdir     : /usr/doc

    distribution      : (not set)

    exclude docs       : (not set)

    ftpport           : (not set)

    ftpuser           : (not set)

    messagelevel      : (not set)

    netsharedpath     : (not set)

    optflags          : -O2 -m486 -fno-strength-reduce

    packager          : (not set)

    pgp_name          : (not set)

    ```'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Appendix B    The rpmrc File 355


    ```

    ```text

    ppq_path       : (not set)

    require_distribution : (not set)

    require_icon     : (not set)

    require_vendor   : (not set)

    root           : (not set)

    rpmdir         : /usr/src/redhat/RPMS

    signature      : none

    sourcedir      : /usr/src/redhat/SOURCES

    specdir        : /usr/src/redhat/SPECS

    srcrpmdir      : /usr/src/redhat/SRPMS

    timecheck      : (not set)

    tmpath         : /var/tmp

    topdir         : /usr/src/redhat

    vendor         : (not set)

    #

    ```

    ```


    As you can see, the `--showrc` option clearly displays the values RPM will use.
    `--showrc` can also be used with the `--rcfile` option, which makes it easy to
    see the effect of specifying a different `rpmrc` file.


    # ## B.2. Different Places an rpmrc File Resides


    RPM looks for `rpmrc` files in four places:


    +   - In `/usr/lib/`, for a file called `rpmrc`

    +   - In `/etc/`, for a file called `rpmrc`

    +   - In a file called `.rpmrc` in the user''s login directory

    +   - In a file specified by the `--rcfile` option, if the option is present on
    the command line


    The first three files are read in the order listed, such that if a given `rpmrc`
    entry is present in each file, the value of the entry read last is the one used
    by RPM. This means, for example, that an entry in `.rpmrc` in the user''s login
    directory will always override the same entry in `/etc/rpmrc`. Likewise, an entry
    in `/etc/rpmrc` will always override the same entry in `/usr/lib/rpmrc`.


    If the `--rcfile` option is used, then only `/usr/lib/rpmrc` and the file following
    the `--rcfile` option are read, in that order. The `/usr/lib/rpmrc` file is always
    read first. This cannot be changed.


    Let''s look at each of these files, starting with `/usr/lib/rpmrc`.


    # ### B.2.1. /usr/lib/rpmrc


    The file `/usr/lib/rpmrc` is always read. It contains information that RPM uses
    to set some default values. This file should never be modified! Doing so may cause
    RPM to operate incorrectly.'
  merge: -1
  img_proc: true
