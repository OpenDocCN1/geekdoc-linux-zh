  md: "# 21.2.8.1. rpmInstallSourcePackage( )—Install Source Package File\n\nThis\
    \ function installs the source package file specified by **fd**:\n\n```\n#include\
    \ <rpm/rpmlib.h>\n\nint rpmInstallSourcePackage(char * root,\n               \
    \            int fd,\n                           char ** specFile,\n         \
    \                  rpmNotifyFunction notify,\n                           char\
    \ * labelFormat);\n```\n\nIf **root** is not **NULL**, it is prepended to the\
    \ variables **RPMVAR_SOURCEDIR** and **RPMVAR_SPEC_DIR** prior to the actual installation.\
    \ If **specFile** is not **NULL**, the complete path and filename of the just-installed\
    \ spec file are returned.\n\nThe **notify** parameter is used to specify a progress-tracking\
    \ function that will be called during the installation. See section 21.2.8.3 for\
    \ more information on this parameter.\n\nThe **labelFormat** parameter can be\
    \ used to specify how the package label should be formatted. It is used when printing\
    \ the package label (once the package install is ready to proceed). If **labelFormat**\
    \ is **NULL**, the package label is not printed.\n\nThis function returns the\
    \ following status values:\n\n+   0—The source package was installed successfully.\n\
    +   1—The source package file contained incorrect magic numbers.\n+   2—Another\
    \ type of error occurred.\n\n# 21.2.8.2. rpmInstallPackage( )—Install Binary Package\
    \ File\n\nThis function installs the binary package file specified by **fd**:\n\
    \n```\n#include <rpm/rpmlib.h>\n\nint rpmInstallPackage(char * rootdir,\n    \
    \                  rpmds db,\n                      int fd,\n                \
    \      char * prefix,\n                      int flags,\n                    \
    \  rpmNotifyFunction notify,\n                      char * labelFormat,\n    \
    \                  char * netsharedPath);\n```\n\nIf a path is specified in **rootdir**,\
    \ the package will be installed with that path acting as the root directory. If\
    \ a path is specified in **prefix**, it will be used as the prefix for relocatable\
    \ packages. The **RPM** database specified by **db** is updated to reflect the\
    \ newly installed package.\n\nThe **flags** parameter is used to control the installation\
    \ behavior. The flags are defined in **rpmlib.h** and take the form **RPMINSTALL_xxx**,\
    \ where **xxx** is the name of the flag."
  merge: -1
  img_proc: true
- pgno: 338
  md: "The following flags are currently defined:\n\n+   1. \\texttt{RPMINSTALL\\\
    _REPLACEPKG}---Install the package even if it is already installed.\n+   2. \\\
    texttt{RPMINSTALL\\_REPLACEFILES}---Install the package even if it will replace\
    \ files owned by another package.\n+   3. \\texttt{RPMINSTALL\\_TEST}---Perform\
    \ all install-time checks, but do not actually install the package.\n+   4. \\\
    texttt{RPMINSTALL\\_UPGRADE}---Install the package, and remove all older versions\
    \ of the package.\n+   5. \\texttt{RPMINSTALL\\_UPGRADETOOLD}---Install the package,\
    \ even if the package is an older version of an already-installed package.\n+\
    \   6. \\texttt{RPMINSTALL\\_NODOCS}---Do not install the package's documentation\
    \ files.\n+   7. \\texttt{RPMINSTALL\\_NOSCRIPTS}---Do not execute the package's\
    \ install- and erase-time (in the case of an upgrade) scripts.\n+   8. \\texttt{RPMINSTALL\\\
    _NOARCH}---Do not perform architecture-compatibility tests.\n+   9. \\texttt{RPMINSTALL\\\
    _NOOS}---Do not perform operating system--compatibility tests.\n\nThe \\texttt{notify}\
    \ parameter is used to specify a progress-tracking-function that will be called\
    \ during the installation. See section 21.2.8.3 for more information on this parameter.\n\
    \nThe \\texttt{labelFormat} parameter can be used to specify how the package label\
    \ should be formatted. This information is used when printing the package label\
    \ once the package install is ready to proceed. If \\texttt{labelFormat} is NULL,\
    \ the package label is not printed.\n\nThe \\texttt{netsharedPath} parameter is\
    \ used to specify that part of the local filesystem that is shared with other\
    \ systems. If there is more than one path that is shared, the paths should be\
    \ separated with a colon.\n\nThis function returns the following status values:\n\
    \n+   1. 0---The binary package was installed successfully.\n+   2. 1---The binary\
    \ package file contained incorrect magic numbers.\n+   3. 2---Another type of\
    \ error occurred.\n\n# 21.2.8.3. rpmNotifyFunction()---Track Package Installation\
    \ Progress\n\nA function can be passed to \\texttt{rpmInstallSourcePackage} or\
    \ \\texttt{rpmInstallPackage} via the notify parameter:\n\n```\n```C\n#include\
    \ <rpm/rpmlib.h>\n\ntypedef void (*rpmNotifyFunction)(const unsigned long amount,\n\
    \                                const unsigned long total);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 339
  md: "The function will be called at regular intervals during the installation, and\
    \ will have two parameters passed to it:\n\n+   amount—The number of bytes of\
    \ the install that have been completed so far.\n+   total—The total number of\
    \ bytes that will be installed.\n\nThis function permits the creation of a dynamically\
    \ updating progress meter during package installation.\n\n# 21.2.8. rpmRemovePackage(\
    \ )—Remove Installed Package\n\nThis function removes the package at record number\
    \ offset in the RPM database specified by db:\n\n```\n#include <rpm/rpmlib.h>\n\
    \nint rpmRemovePackage(char * root,\n                    rpmdb_db,\n         \
    \           unsigned int offset,\n                    int flags);\n```\n\nIf root\
    \ is specified, it is used as the path to a directory that will serve as the root\
    \ directory while the package is being removed.\n\nThe flags parameter is used\
    \ to control the package removal behavior. The flags that may be passed are defined\
    \ in rpmlib.h and are in the form RPMINSTALLxxx, where xxx is the name of the\
    \ flag.\n\nThe following flags are currently defined:\n\n+   RPMINSTALL_TEST—Perform\
    \ all erase-time checks, but do not actually remove the package.\n+   RPMINSTALL_NOScripts—Do\
    \ not execute the package’s erase-time scripts.\n\nThis function returns the following\
    \ status values:\n\n+   0—The package was removed successfully.\n+   1—The package\
    \ removal failed.\n\n# 21.2.9. Package and File Verification\n\nThe functions\
    \ in this section perform the verification operations necessary to ensure that\
    \ the files comprising a package have not been modified since they were installed.\n\
    \nVerification takes place on three distinct levels:\n\n+   On the file-by-file\
    \ level\n+   On a package-wide level, through the use of the %verifyscript verification\
    \ script\n+   On an interpackage level, through RPM’s normal dependency processing"
  merge: -1
  img_proc: true
- pgno: 340
  md: "The first two types of verification are performed by functions described in\
    \ this section. The functions that implement dependency-related verification are\
    \ covered in section 21.2.10.\n\n# 21.2.9.1. rpmVerifyFile()—Verify File\n\nThis\
    \ function verifies the *filenum* file from the package whose header is *h*:\n\
    \n```\n\"\"\"#include <rpm/rpmlib.h>\n#include <rpm/header.h>\"\"\"\n```\n\n```\n\
    \"\"\"int rpmVerifyFile(char * root,\n\t\t\t\tHeader h,\n\t\t\t\tint filenum,\n\
    \t\t\t\tint * result);\"\"\"\n```\n\nIf *root* is specified, it is used as the\
    \ path to a directory that will serve as the root directory while the file is\
    \ being verified. The results of the file verification are returned in *result*\
    \ and consist of a number of flags. Each flag that is set indicates a verification\
    \ failure.\n\nThe flags are defined in *rpmlib.h* and are in the form **RPMVERIFY_*xxx*,\
    \ where *xxx* is the name of the data that failed verification.\n\nThis function\
    \ returns 0 on success, and 1 on failure.\n\n# 21.2.9.2. rpmVerifyScript()—Execute\
    \ Package's %verifyScript Verification Script\n\nThis function executes the %verifyScript\
    \ verification script for the package whose header is *h*. *err* must contain\
    \ a valid file descriptor. If *rpmIsVerbose*() returns true, the %verifyScript\
    \ verification script will direct all status messages to *err*:\n\n```\n\"\"\"\
    #include <rpm/rpmlib.h>\n#include <rpm/header.h>\"\"\"\n```\n\n```\n\"\"\"int\
    \ rpmVerifyScript(char * root,\n\t\t\tHeader h,\n\t\t\tint err);\"\"\"\n```\n\n\
    This function returns 0 on success, and 1 on failure.\n\n# 21.2.10. Dependency-Related\
    \ Operations\n\nThe functions in this section are used to perform the various\
    \ dependency-related operations supported by rpmlib.\n\nDependency processing\
    \ is entirely separate from normal package-based operations. The package installation\
    \ and removal functions do not perform any dependency processing themselves. Therefore,\
    \ dependency processing is somewhat different from other aspects of rpmlib's operation."
  merge: -1
  img_proc: true
- pgno: 341
  md: "Dependency processing centers around the `rpmDependencies` data structure.\
    \ The operations that are to be performed against the RPM database (adding, removing,\
    \ and upgrading packages) are performed against this data structure, using the\
    \ functions that are described in this section. These functions simply populate\
    \ the data structure according to the operation being performed. They do not perform\
    \ the actual operation on the package. This is an important point to keep in mind.\n\
    \nOnce the data structure has been completely populated, a dependency check function\
    \ is called to determine if there are any dependency-related problems. The result\
    \ is a structure of dependency conflicts. This structure, `rpmDependencyConflict`,\
    \ is defined in `rpmlib.h`.\n\nNote that it is necessary to free both the conflicts\
    \ structure and the `rpmDependencies` structure when they are no longer needed.\
    \ However, `free()` should not be used—special functions for this are provided\
    \ and are discussed in this section.\n\n# 21.2.10.1. rpmdepDependencies( )—Create\
    \ a New Dependency Data Structure\n\nThis function returns an initialized `rpmDependencies`\
    \ structure. The dependency checking to be done will be based on the RPM database\
    \ specified in the `db` parameter. If this parameter is `NULL`, the dependency\
    \ checking will be done as if an empty RPM database were being used:\n\n```\n\
    #include <rpmlib.h>\nrpmDependencies rpmDependencies(rpmdb db);\n```\n\n# 21.2.10.2.\
    \ rpmdepAddPackage( )—Add a Package Install to the Dependency Data Structure\n\
    \nThis function adds the installation of the package whose header is h to the\
    \ `rpmDependencies` data structure, `rpmdep`:\n\n```\n#include <rpmlib.h>\n#include\
    \ <rpm/header.h>\n\nvoid rpmdepAddPackage(rpmDependencies rpmdep,\n          \
    \            Header h);\n```\n\n# 21.2.10.3. rpmdepUpgradePackage( )—Add a Package\
    \ Upgrade to the Dependency Data Structure\n\nThis function adds the upgrading\
    \ of the package whose header is h to the `rpmDependencies` data structure, `rpmdep`.\
    \ It is similar to `rpmdepAddPackage()`, but older versions of the package are\
    \ removed:\n\n```\n#include <rpmlib.h>\n#include <rpm/header.h>\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "```\nvoid rpmdepUpgradePackage(rpmDependencies rpmdep,\n                  \
    \      Header h);\n```\n\n# 21.2.10.4. rpmdepRemovePackage()—Add a Package Removal\
    \ to the Dependency Data Structure\n\nThis function adds the removal of the package\
    \ whose RPM database offset is *dboffset* to the *rpmDependencies* data structure,\
    \ *rpmdep*:\n\n```\n#include <rpm/rpmIib.h>\n\nvoid rpmdepRemovePackage(rpmDependencies\
    \ rpmdep,\n                        int dboffset);\n```\n\n# 21.2.10.5. rpmdepAvailablePackage()—Add\
    \ an Available Package to the Dependency Data Structure\n\nThis function adds\
    \ the package whose header is *h* to the *rpmDependencies* structure, *rpmdep*:\n\
    \n```\n#include <rpm/rpmIib.h>\n#include <rpm/header.h>\n\nvoid rpmdepAvailablePackage(rpmDependencies\
    \ rpmdep,\n                           Header h,\n                           void\
    \ * key);\n```\n\nThe *key* parameter can be anything that uniquely identifies\
    \ the package being added. It will be returned as part of the *rpmDependencyConflict*\
    \ structure returned by *rpmdepCheck()* , specifically in that structure's *suggestedPackage*\
    \ element.\n\n# 21.2.10.6. rpmdepCheck()—Perform a Dependency Check\n\nThis function\
    \ performs a dependency check on the *rpmDependencies* structure *rpmdep*. It\
    \ returns an array of size *numConflicts*, pointed to by *conflicts*:\n\n```\n\
    #include <rpm/rpmIib.h>\n\nint rpmdepCheck(rpmDependencies rpmdep,\n         \
    \      struct rpmDependencyConflict ** conflicts,\n               int * numConflicts);\n\
    ```\n\nThis function returns 0 on success, and 1 on error.\n\n# 21.2.10.7. rpmdepFreeConflicts()—Free\
    \ Results of rpmdepCheck()\n\nThis function frees the dependency conflict information\
    \ of size *numConflicts* that is pointed to by *conflicts*:\n\n```\n#include <rpm/rpmIib.h>\n\
    \nvoid rpmdepFreeConflicts(struct rpmDependencyConflict * conflicts,\n       \
    \                 int numConflicts);\n```"
