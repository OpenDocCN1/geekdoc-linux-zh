    # 20.4.1. Creating the %files List


    Everything was going so smoothly, we forgot that the %files lists were going to
    need files. No problem; we just need to put the filenames in there, and we''ll
    be all set. But is it really that easy?


    # 20.4.1.1. How to Find the Installed Files


    Luckily, it''s not too bad. Since we saved the output from our first `make install`,
    we can see the filenames as they''re installed. Of course, it''s important to
    make sure the install output is valid. Fortunately for us, amanda didn''t require
    much fiddling by the time we got it built and tested. If it had, we would have
    had to get more recent output from the installation phase.


    It''s time for more decisions. We have one list of installed files and two %files
    lists. It would be silly to put all the files in both %files lists, so we have
    to decide which file goes where.


    This is where experience with the software really pays off, because the wrong
    decision made here can result in awkward, ill-featured packages. Here''s the %files
    list we came up with for the client subpackage:


    ```

    %files client

    /usr/lib/amanda/amandad

    /usr/lib/amanda/sendsize

    /usr/lib/amanda/calclsize

    /usr/lib/amanda/sendbackup-dump

    /usr/lib/amanda/selfcheck

    ```'
