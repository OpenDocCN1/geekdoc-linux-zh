    ```


    Looking over the output from the `\%install` section, we first see that the RPM_BUILD_ROOT
    environment variable in the `make install` command has been replaced with the
    path specified earlier in the spec file on the `BuildRoot: ` line. The `ROOT`
    environment variable used in the `makefile` now has the appropriate value, as
    can be seen in the various install commands that follow.


    Note also that we use `install`''s `-d` option to ensure that every directory
    in the path exists before we actually install the software. Unfortunately, we
    can''t do this and install the file in one command.


    Looking at the section labeled `Executing: spec%a1l doc`, we find that `RPM` is
    doing something similar for us. It starts by making sure there is no preexisting
    documentation directory. Next, `RPM` creates the documentation directory and copies
    files into it.


    The remainder of this example is identical to that of a package being built without
    a build root being specified. However, although the output is identical, there
    is one crucial difference: When the binary package is created, instead of simply
    using each line in the `%files` list verbatim, `RPM` prepends the build root path
    first. If this weren''t done, `RPM` would attempt to find the files, relative
    to the system''s root directory, and would, of course, fail. Because of the automatic
    prepending of the build root, it''s important to not include the build root path
    in any `%files` list entry. Otherwise, the files would not be found by `RPM`,
    and the build would fail.


    Although `RPM` has to go through a bit of extra effort to locate the files to
    be packaged, the resulting binary package is indistinguishable from the same package
    created without using a build root.


    # 16.1.1. Some Things to Consider


    Once the necessary modifications have been made to support a build root, it''s
    necessary for the package builder to keep some issues in mind. The first is that
    the build root specified in the `spec` file can be overridden. `RPM` will set
    the build root (and therefore, the value of `$RPM_BUILD_ROOT`) to one of the following
    values:


    +   - The value of `builddroot` in the `spec` file

    +   - The value of `builddroot` in an `rpmb` file

    +   - The value following the `--buildroot` option on the command line'
