- pgno: 427
  md: 'Red Hat Software has also set up an FTP site meant specifically for RPM. It’s
    available at ftp.rpm.org and contains all present and past versions of RPM.


    # F.1.2. What Do I Need?


    Once you find a nearby site with RPM and the directory where it’s kept, you’ll
    notice a variety of files, all starting with rpm. What are they? Which ones do
    you need? Here’s a representative list, along with the ways in which each file
    would be used:


    ```

    ftp> ls

    200 PORT command successful.

    150 Opening ASCII mode data connection for /bin/ls.

    total 2689

    drwxr-xr-x 6 root 97 2048 Jul 18 10:04 .

    drwxr-xr-x 6 root 97 1024 Jul 2 10:09 ..

    lrwxrwxrwx 1 root root 23 Jan 22 1996 ../docs/RPM-HOWTO.ps ->

    ../../docs/RPM-HOWTO.ps

    lrwxrwxrwx 1 root root 24 Jan 22 1996 RPM-HOWTO.txt ->

    ../../docs/RPM-HOWTO.txt

    -rw-rw-r-- 1 root 97 59239 Jan 20 1996 paper-ps.gz

    -rw-rw-r-- 1 root 97 365319 Jul 18 06:05 rpm-2.2.2-1.axp.rpm

    -rw-rw-r-- 1 root 97 278620 Jul 18 06:05 rpm-2.2.2-1.i386.cpio.gz

    -rw-rw-r-- 1 root 97 282015 Jul 18 06:05 rpm-2.2.2-1.i386.rpm

    -rw-rw-r-- 1 root 97 279855 Jul 18 06:05 rpm-2.2.2-1.sparc.rpm

    -rw-rw-r-- 1 root 97 359354 Jul 18 06:05 rpm-2.2.2-1.src.rpm

    -rw-rw-r-- 1 root 97 356943 Jul 18 06:05 rpm-2.2.2.tar.gz

    -rw-rw-r-- 1 root 97 122157 Jul 18 06:05 rpm-devel-2.2.2-1.axp.rpm

    -rw-rw-r-- 1 root 97 51132 Jul 18 06:05 rpm-devel-2.2.2-1.i386.rpm

    -rw-rw-r-- 1 root 97 54470 Jul 18 06:05 rpm-devel-2.2.2-1.sparc.rpm

    -rw-rw-r-- 1 root 97 35504 May 1 04:28 rpmbuild.ps.gz

    226 Transfer complete.

    ftp>

    ```


    Although the version numbers may change, the types of files kept in this directory
    will not. The files **RPM-HOWTO**, **paper-ps.gz**, and **rpmbuild.ps.gz** contain
    a variety of information concerning RPM. As such, they are valuable sources of
    supplemental information. The remaining files contain RPM, packaged for various
    architectures and in source form. We’ll look at them, grouped according to their
    contents. Here’s the first group of files:


    ```

    -rw-rw-r-- 1 root 97 365319 Jul 18 06:05 rpm-2.2.2-1.axp.rpm

    -rw-rw-r-- 1 root 97 282015 Jul 18 06:05 rpm-2.2.2-1.i386.rpm

    -rw-rw-r-- 1 root 97 279855 Jul 18 06:05 rpm-2.2.2-1.sparc.rpm

    ```


    These files are the binary package files for RPM version 2.2.2, release 1, on
    the Digital Alpha, the Intel 386/486/Pentium, and the Sun SPARC. Note that the
    version number will change in time, but the other parts of the file-naming convention
    won’t. As binary package files, they must be installed using RPM. So if you don’t
    have RPM yet, they won’t do you much good.


    If your goal is to install RPM on one of these systems, it might be a good idea
    to copy the appropriate binary package. That way, once you have RPM running, you
    can reinstall it with the **--force** option to ensure that RPM is properly installed
    and configured.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'Let''s look at the next file:


    ```

    -rw-r---r--   1  root  97  359354  Jul 18  06:05  rpm-2.2.2-1.src.rpm

    ```


    This is the source package file for **RPM** version 2.2.2, release 1. Like the
    binary packages, the source package requires **RPM** to install; therefore, it
    cannot be used to perform an initial install of **RPM**. Let''s see what else
    is here:


    ```

    -rw-r---r--   1  root  97  122157  Jul 18  06:05  rpm-devel-2.2.2-1.axp.rpm

    -rw-r---r--   1  root  97  51132  Jul 18  06:05  rpm-devel-2.2.2-1.i386.rpm

    -rw-r---r--   1  root  97  54470  Jul 18  06:05  rpm-devel-2.2.2-1.sparc.rpm

    ```


    These files are binary package files that contain the **rpm-devel** subpackage.
    The **rpm-devel** package contains header files and the **RPM** library and is
    used for developing programs that can perform **RPM**-related functions. These
    files cannot be used to get **RPM** running. That leaves two files:


    ```

    -rw-rw-r--   1  root  97  278620  Jul 18  06:05  rpm-2.2.2-1.i386.cpio.gz

    -rw-rw-r--   1  root  97  358943  Jul 18  06:05  rpm-2.2.2.tar.gz

    ```


    The first file is a gzipped **cpio** archive of the files comprising **RPM**.
    After you uncompress the file, **cpio** can be used to extract the files and place
    them on your system. Note, however, that there is a **cpio** archive for the i386
    architecture only. To extract the files, issue the following command:


    ```

    # zcat file.cpio.gz | cd / ; cpio --extract

    ```


    When you''re actually issuing the command, *file.cpio.gz* should be replaced with
    the actual name of the **cpio** archive.


    Note that the archive should be extracted using **GNU cpio** version 2.4.1 or
    greater. It may also be necessary to issue the following command prior to using
    **RPM**:


    ```

    # mkdir /var/lib/rpm

    ```


    The last file, *rpm-2.2.2.tar.gz*, contains the sources for **RPM**. Using it,
    you can build **RPM** from scratch. This is the most involved option, but it is
    the only choice for people interested in porting **RPM** to a new architecture.


    # # F.2. Where to Talk About RPM


    As much as we''ve tried to make this book a comprehensive reference for **RPM**,
    there are going to be times when you''ll need additional help. The best way to
    connect with others who use **RPM** is to try one of the mailing lists listed
    in the following sections.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# F.2.1. The rpm-list Mailing List


    Red Hat Software, Inc., maintains a mailing list specifically for RPM. To subscribe
    to the list, it’s necessary to send a mail message to


    ```

    rpm-list-request@redhat.com

    ```


    On the message’s subject line, place the word subscribe. After a short delay,
    you should receive an automated response with general information about the mailing
    list.


    To send messages to the list, address them to


    ```

    rpm-list@redhat.com

    ```


    As with other online forums, it’s advisable to lurk for a while before sending
    anything to the list. That way, you’ll be able to see what types of questions
    are acceptable for the list. Let the list’s name be your guide; if the message
    you want to send doesn’t have anything to do with RPM, you shouldn’t send it to
    rpm-list!


    In general, the flavor of rpm-list is a bit biased toward RPM’s development, building
    packages, and issues surrounding the porting of RPM to other systems. If your
    question is more along the lines of “How do I use RPM to install new software?”
    consider reviewing the first half of this book and lurking on rpm-list a while
    first.


    # F.2.2. The redhat-list Mailing List


    The redhat-list mailing list is meant to serve as a forum for users of Red Hat
    Software’s Linux operating system. If your question concerns the use of RPM on
    Red Hat Linux, redhat-list is a good place to start. To subscribe, send a message
    to


    ```

    redhat-list-request@redhat.com

    ```


    On the message’s subject line, place the word subscribe. After a short delay,
    you should receive an automated response with general information about the mailing
    list. As with rpm-list, it’s best to lurk for a while before posting to the list.


    To send messages to the list, address them to


    ```

    redhat-list@redhat.com

    ```


    # F.2.3. The redhat-digest Mailing List


    Some people might find the number of messages on redhat-list more than they can
    handle. However, there is a digest version of the list available. Each digest
    consists of one or more messages sent to redhat-list. The digest is sent out when
    the collected messages reach a certain size. Therefore, a digest might have one
    very long message or 20 smaller ones. In either case, you’ll have the collected
    knowledge of the Red Hat Software development team and their many customers, delivered
    in one message.'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'To subscribe to `redhat-digest`, send a message to `redhat-digest-request@redhat.com`


    On the message''s subject line, place the word `subscribe`. After a short delay,
    you should receive an automated response with general information about the mailing
    list.


    To send messages to the list, address them to `redhat-list@redhat.com`


    As always, observe proper netiquette—lurk before you leap!


    # F.3. RPM on the World Wide Web


    Up-to-date information on RPM can always be found at the RPM Web site: `http://www.rpm.org/`


    The site is completely dedicated to RPM, which makes finding things a snap. You
    can also try Red Hat Software''s Web site: `http://www.redhat.com/`


    This site''s content changes frequently, so it''s impossible to specify an exact
    URL for RPM information. However, the site is very well run and always has a comprehensive
    table of contents as well as a search engine.


    # F.4. RPM''s License


    RPM is licensed under the GNU General Public License or, as it''s more commonly
    called, the GPL. If you''re not familiar with the GPL, it would be worthwhile
    to spend a few minutes looking it over. The purpose of the GPL is to ensure that
    GPLed software remains freely available. “Freely available” doesn''t necessarily
    mean at no cost, although GPLed software is often available by anonymous FTP.
    The idea behind the GPL is to make it impossible for anyone to take GPLed code
    and make it proprietary. But enough preliminaries! The best way to understand
    the GPL is to read it:


