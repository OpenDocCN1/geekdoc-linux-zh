    \ Nuke bin at the end of the line...\nsed -e 's/(^disk:[0-9]{1,}\\.\\.{1,}\\),bin$/\\\
    1/' /etc/group> /etc/group.tmp\n\n# Nuke bin on the line by itself...\nsed -e\
    \ 's/^\\(^disk:[0-9]{1,}.*\\)bin$/\\1/' /etc/group.tmp> /etc/group1.tmp\n\n# Nuke\
    \ bin in the middle of the line...\nsed -e 's/(^disk:[0-9]{1,}.*),bin,(.\\{1,}\\\
    )\\(.*,\\)2/ /etc/group1.tmp > /etc/group2.tmp\n\n# Nuke bin at the start of the\
    \ line...\nsed -e 's/(^disk:[0-9]{1,}.*),bin,(.\\{1,}\\)\\(.*,\\)2/ /etc/group2.tmp\
    \ > /etc/group\n\n# Clean up after ourselves...\nrm -f /etc/group.tmp /etc/group1.tmp\
    \ /etc/group2.tmp\nfi\n```\n```\n\nNo surprises there. Continuing our uninstall,\
    \ we start on the network-related tasks:\n\n```\n```\n# Next, lose the amanda\
    \ line in /etc/services...\n# We only want to do this if the server package isn't\
    \ installed\n# Look for /usr/sbin/amdmp, and leave it if there...\nif [ ! -f /usr/sbin/amdmp\
    \ ] ;\nthen\n\n    if grep \"amanda\" /etc/services > /dev/null\n    then\n  \
    \      grep -v \"amanda\" /etc/services > /etc/services.tmp\n        mv -f /etc/services.tmp\
    \ /etc/services\n    fi\nfi\n```\n```\n\nThat's odd. Why are we looking for a\
    \ file from the server package? If you look back at the install scripts for the\
    \ client and server packages, you'll find that the one thing they have in common\
    \ is that both the client and the server require the same entry in /etc/services.\n\
    \nIf an amanda server is going to back itself up, it also needs the amanda client\
    \ software.\n\nTherefore, both subpackages need to add an entry to /etc/services.\
    \ But what if one of the packages is removed? Perhaps the server is being demoted\
    \ to a client, or maybe the server is no longer going to be backed up using amanda.\
    \ In these cases, the entry in /etc/services must stay. So, in the case of the\
    \ client, we look for a file from the server subpackage, and if it's there, we\
    \ leave the entry alone."
  merge: -1
  img_proc: true
- pgno: 323
  md: "Granted, this is a somewhat unsightly way to see whether a certain package\
    \ is installed. Some of you are probably even saying, “Why can’t RPM be used?\
    \ Just do an rpm -q amanda-server, and decide what to do based on that.” And that\
    \ would be the best way to do it, except for one small point: Only one invocation\
    \ of RPM can run at any given time.\n\nSince RPM is running to perform the uninstall,\
    \ if the uninstall script were to attempt to run RPM again, it would fail. The\
    \ reason it would fail is because only one copy of RPM can access the database\
    \ at a time. So we are stuck with our unsightly friend.\n\nContinuing the network-related\
    \ uninstall tasks... \n\n```\n# Finally, the amanda entry in /etc/inetd.conf\n\
    if grep \"amanda\" /etc/inetd.conf > /dev/null\nthen\n    grep -v \"amanda\" /etc/inetd.conf\
    \ > /etc/inetd.conf.tmp\n    mv -f /etc/inetd.conf.tmp /etc/inetd.conf\nfi\n\n\
    # Kick inetd\nif [ -f /var/run/inetd.pid ];\nthen\n    kill -HUP `cat /var/run/inetd.pid`\n\
    fi\n```\n\nHere, we’re using grep’s capability to return lines that don’t match\
    \ the search string, in order to remove every trace of amanda from /etc/inetd.conf.\
    \ After issuing a HUP on inetd, we’re done.\n\nOn to the server. If you’ve been\
    \ noticing a pattern between the various scripts, you won’t be disappointed here:\n\
    \n```\n%postun server\n\n# See if we’re the last server package on the system...\n\
    # If not, we don’t need to do any of this stuff...\n\nif [ \"$1\" = 0 ];\nthen\n\
    \n# Lose the amanda line in /etc/services...\n# We only want to do this if the\
    \ client package isn’t installed\n# Look for /usr/lib/amandad, and leave it if\
    \ there...\n\nif [ ! -f /usr/lib/amanda/amandad ];\nthen\n\nif grep \"amanda\"\
    \ /etc/services > /dev/null\nthen\n    grep -v \"amanda\" /etc/services > /etc/services.tmp\n\
    \    mv -f /etc/services.tmp /etc/services\nfi\nfi\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 324
  md: 'By now, the opening **if** statement is an old friend. As you might have expected,
    we are verifying whether the client package is installed by looking for a file
    from that package. If the client package isn''t there, the entry is removed from
    /etc/services. And that is that.


    Obviously, these scripts must be carefully tested. In the case of amanda, because
    the two packages have some measure of interdependency, it''s necessary to try
    different sequences of installing and erasing the two packages to make sure the
    /etc/services logic works properly in all cases.


    After a bit of testing, our install and uninstall scripts pass with flying colors.
    From a technical standpoint, the client and server subpackages are ready to go.


    # 20.4.3.3. Bits and Pieces


    However, just because a package has been properly built and installs and can be
    erased without problems doesn''t mean that the package-builder''s job is done.
    It''s necessary to look at each newly built package from the user''s perspective.
    Does the package contain everything users needs in order to deploy it effectively?
    Or will users need to fiddle with it, guessing as they go?


    In the case of our amanda packages, it was obvious that some additional documentation
    was required so that the user would know what needed to be done to finalize the
    installation. Simply directing the user to the standard amanda documentation wasn''t
    the right solution, either. Many of the steps outlined in the INSTALL document
    had already been done by the postinstall scripts. No, an interim document was
    required. Two, actually: one for the client, and one for the server.


    So two files were created, one to be added to each subpackage. The question was,
    how to do it? Essentially, there were two options:


    +   • Put the files in the amanda directory tree that had been used to perform
    the initial builds and generate a new patch file

    +   • Create a tar file containing the two files, and modify the spec file to
    unpack the documentation into the amanda directory tree

    +   • Drop the files directly into the amanda directory tree without using tar


    Since the second approach was more interesting, that''s the approach we chose.
    It required an additional source tag in the spec file:


    ```

    Source1: amanda-rpm-instructions.tar.gz

    ```


    Also required was an additional %setup macro in the %prep script:


    ```

    %setup -T -D -a 1

    ```


    While the %setup macro might look intimidating, it wasn''t that hard to construct.
    Here''s what each option means:


    -T —Do not perform the default archive unpacking.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Finally, two additions to the `%files` lists were required, one for the client:


    ```

    %doc amanda-client.README

    ```


    and one for the server:


    ```

    %doc amanda-server.README

    ```


    At this point, the packages are complete. Certainly there is software out there
    that doesn’t require this level of effort to package. Just as certainly there
    is software that is much more of a challenge.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# # 21


    A Guide to the RPM Library API'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'In this chapter, we''ll explore the functions used internally by RPM. These
    functions are available for anyone to use, making it possible to add RPM functionality
    to new and existing programs. Rather than continually refer to “the RPM library”
    throughout this chapter, we''ll use the name of the library''s main include file—rpmlib.


    # # 21.1. An Overview of rpmlib


    A number of files make up rpmlib. First and foremost, of course, is the rpmlib
    library, librpm.a. This library contains all the functions required to implement
    all the basic functions contained in RPM.


    The remaining files define the various data structures, parameters, and symbols
    used by rpmlib:


    +   - rpmlib.h

    +   - dbindex.h

    +   - header.h


    In general, rpmlib.h will always be required. When using rpmlib''s header-related
    functions, header.h will be required, while the database-related functions will
    require dbindex.h. As each function is described in this chapter, we''ll provide
    the function''s prototype as well as the #include statements the function requires.


    # # 21.2. rpmlib Functions


    There are more than 60 different functions in rpmlib. The tasks they perform range
    from low-level database record traversal to high-level package manipulation. We''ve
    grouped the functions into different categories for easy reference.


    # ## 21.2.1. Error Handling


    The functions in this section perform rpmlib''s basic error handling. All error
    handling centers on the use of specific status codes. The status codes are defined
    in rpmlib.h and are of the form RPMERR_xxx, where xxx is the name of the error.


    # ### 21.2.1.1. rpmErrorCode()—Return Error Code


    This function returns the error code set by the last rpmlib function that failed.
    It should only be used in an error callback function defined by rpmErrorSetCallback():


    ```

    ```c

    #include <rpm/rpmlib.h>


    int rpmErrorCode(void);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 21.2.1.2. rpmErrorString()—Return Error String


    This function returns the error string set by the last rpmlib function that failed.
    It should only be used in an error callback function defined by rpmErrorSetCallBack():


    ```

    #include <rpm/rpmlib.h>

    char *rpmErrorString(void);

    ```


    # 21.2.1.3. rpmErrorSetCallBack()—Set Error CallBack Function


    This function sets the current error callback function to the error callback function
    passed to it. The previous error callback function is returned:


    ```

    #include <rpm/rpmlib.h>

    rpmErrorCallBackType rpmErrorSetCallBack(rpmErrorCallBackType);

    ```


    # 21.2.2. Getting Package Information


    The functions described in this section are used to obtain information about a
    package file.


    Note that most information is returned in the form of a Header structure. This
    data structure is widely used throughout rpmlib. We will discuss more header-related
    functions in sections 21.2.13 and 21.2.14.


    # 21.2.2.1. rpmReadPackageInfo()—Read Package Information


    Given an open package on fd, read in the header and signature:


    ```

    #include <rpm/rpmlib.h>

    #include <rpm/header.h>

    int rpmReadPackageInfo(int fd, Header *signatures, Header *hdr);

    ```


    This function operates as expected, with both socket and pipe file descriptors
    passed as fd. It is safe to use on nonseekable fds. When the function returns,
    fd is left positioned at the start of the package’s archive section.


    If either signatures or hdr is NULL, information for the NULL parameter will not
    be passed back to the caller. Otherwise, signatures and hdr will return the package’s
    signatures and header, respectively.


    This function returns the following status values:


    +   - 0—Success

    +   - 1—Bad magic numbers found in package

    +   - 2—Other error'
  merge: -1
  img_proc: true
- pgno: 329
  md: '21.2.2.2. rpmReadPackageHeader()—Read Package Header

    Given an open package on fd, read in the header:


    ```

    ```

    #include <rpm/rpmio.h>

    #include <rpm/header.h>


    int rpmReadPackageHeader(int fd,

    Header * hdr,

    int * isSource,

    int * major,

    int * minor);

    ```

    ```


    This function operates as expected, with both socket and pipe file descriptors
    passed as fd. It is safe on nonseekable fds. When the function returns, fd is
    left positioned at the start of the package’s archive section.


    If hdr, isSource, major, or minor is NULL, information for the NULL parameter(s)
    will not be passed back to the caller. Otherwise, they will return the package’s
    header (hdr), information on whether the package is a source package file (isSource),
    and the package format’s major and minor revision number (major and minor, respectively).


    This function returns the following status values:


    +   - 0—Success

    +   - 1—Bad magic numbers found in package

    +   - 2—Other error


    21.2.3. Variable Manipulation

    The following functions are used to get, set, and interpret RPM’s internal variables.
    The variables are set according to various pieces of system information, as well
    as from rpmrc files. They control various aspects of RPM’s operation.


    The variables have symbolic names in the form RPMSVAR_xxx, where xxx is the name
    of the variable. All variable names are defined in rpmlib.h.


    21.2.3.1. rpmGetVar()—Return Value of RPM Variable

    This function returns the value of the variable specified in var:


    ```

    ```

    #include <rpm/rpmlib.h>


    char *rpmGetVar(int var);

    ```

    ```


    On error, the function returns NULL.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 21.2.3.2. `rpmGetBooleanVar()`—Return Boolean Value of RPM Variable


    This function looks up the variable specified in `var` and returns 0 or 1, depending
    on the variable’s value:


    ```

    #include <rpm/rpmlib.h>

    int rpmGetBooleanVar(int var);

    On error, the function returns 0.

    ```


    # 21.2.3.3. `rpmSetVar()`—Set Value of RPM Variable


    This function sets the variable specified in `var` to the value passed in `val`.
    It is also possible for `val` to be NULL:


    ```

    #include <rpm/rpmlib.h>

    void rpmSetVar(int var,

    char *val);

    ```


    # 21.2.4. rpmrc-Related Information


    The functions in this section are all related to `rpmrc` information—the `rpmrc`
    files as well as the variables set from those files. This information also includes
    the architecture and operating system information based on `rpmrc` file entries.


    # 21.2.4.1. `rpmReadConfigFiles()`—Read rpmrc Files


    This function:


    ```

    #include <rpm/rpmlib.h>

    int rpmReadConfigFiles(char * file,

    char * arch,

    char * os,

    int building);

    ```


    reads `rpmrc` files according to the following rules:


    +   - Always read `/usr/lib/rpmrc`.

    +   - If file is specified, read it.

    +   - If file is not specified, read `/etc/rpmrc` and `~/.rpmrc`.


    Every `rpmrc` file entry is used with `rpmSetVar()` to set the appropriate RPM
    variable. Part of the normal `rpmrc` file processing also includes setting the
    architecture and operating system variables for the system executing this function.
    These default settings can be overridden by entering architecture and/or operating
    system information in `arch` and `os`, respectively. This information will still
    go through the normal `rpmrc` translation process.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'The **building** argument should be set to **1** only if a package is being
    built when this function is called. Since most rpmbll-based applications will
    probably not duplicate RPM''s package-building capabilities, **building** should
    normally be set to **0**.


    # 21.2.4.2. rpmGetOsName( )—Return Operating System Name


    This function returns the name of the operating system, as determined by rpmlib''s
    normal `rpmsrc` file processing:


    ```

    ```c

    #include <rpm/rpmlib.h>

    char *rpmGetOsName(void);

    ```

    ```


    # 21.2.4.3. rpmGetArchName( )—Return Architecture Name


    This function returns the name of the architecture, as determined by rpmlib''s
    normal `rpmsrc` file processing:


    ```

    ```c

    #include <rpm/rpmlib.h>

    char *rpmGetArchName(void);

    ```

    ```


    # 21.2.4.4. rpmShowRC( )—Print All rpmsrc-Derived Variables


    This function writes all variable names and their values to the file *f*. It always
    returns **0**:


    ```

    ```c

    #include <rpm/rpmlib.h>

    int rpmShowRC(FILE *f);

    ```

    ```


    # 21.2.4.5. rpmArchScore( )—Return Architecture Compatibility Score


    This function returns the level of compatibility between the architecture whose
    name is specified in `arch` and the current architecture. Returns **0** if the
    two architectures are incompatible. The smaller the number returned, the more
    compatible the two architectures are:


    ```

    ```c

    #include <rpm/rpmlib.h>

    int rpmArchScore(char * arch);

    ```

    ```


    # 21.2.4.6. rpmOsScore( )—Return Operating System Compatibility Score


    This function returns the level of compatibility between the operating system
    whose name is specified in `os` and the current operating system. Returns **0**
    if the two operating systems are incompatible. The smaller the number returned,
    the more compatible the two operating systems are:


    ```

    ```c

    #include <rpm/rpmlib.h>

    int rpmOsScore(char * os);

    ```

    ```'
