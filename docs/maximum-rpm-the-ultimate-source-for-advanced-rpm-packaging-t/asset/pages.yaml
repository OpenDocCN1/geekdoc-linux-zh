- pgno: 90
  md: '# 5.2.2.11.1. Literal Text


    Any part of a format string that is not associated with tags or array iterators
    will be treated as literal text. Literal text is just that: It’s text that is
    printed just as it appears in the format string. In fact, a format string can
    consist of nothing but literal text, although the output wouldn’t tell us much
    about the packages being queried. Let’s give the `--queryformat` option a try,
    using a format string with nothing but literal text:


    ```

    ```bash

    # rpm -q --queryformat ''This is a test!'' rpm

    This is a test!#

    ```

    ```


    The `RPM` command might look a little unusual, but if you take out the `--queryformat`
    option, along with its format string, you’ll see that this is just an ordinary
    query of the `rpm` package. When the `--queryformat` option is present, `RPM`
    will use the text immediately following the option as a format string. In this
    case, the format string is ''This is a test!''. The single quotes are required.
    Otherwise, it’s likely that your shell will complain about some of the characters
    contained in the average format string.


    The output of this command appears on the second line. As you can see, the literal
    text from the format string was printed exactly as it was entered.


    # 5.2.2.11.2. Carriage Control Escape Sequences


    Wait a minute. What is that `#` doing at the end of the output? Well, that’s our
    shell prompt. You see, we didn’t direct `RPM` to move to a new line after producing
    the output, so the shell prompt ended up being tacked to the end of the output.


    Is there a way to fix that? Yes, there is. We need to use an escape sequence.
    An escape sequence is a sequence of characters that starts with a backslash (`\`).
    Escape sequences add carriage control information to a format string. The following
    escape sequences can be used:


    +   - `\a`—Produces a bell sound or similar alert.

    +   - `\b`—Backspaces one character.

    +   - `\f`—Outputs a form-feed character.

    +   - `\n`—Outputs a newline character sequence.

    +   - `\r`—Outputs a carriage return character.

    +   - `\t`—Causes a horizontal tab.

    +   - `\v`—Causes a vertical tab.

    +   - `\\`—Displays a backslash character.


    Based on this list, it seems that an `\n` escape sequence at the end of the format
    string will put our shell prompt on the next line:


    ```

    ```bash

    # rpm -q -queryformat ''This is a test!\n'' rpm

    This is a test!

    #

    ```

    ```


    Much better.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "# 5.2.2.11.3. Tags\n\nThe most important parts of a format string are the tags.\
    \ Each tag specifies what information is to be displayed and can optionally include\
    \ field width, as well as justification and data formatting instructions. (RPM\
    \ uses printf to do -queryformat formatting. Therefore, you can use any of the\
    \ printf format modifiers discussed in the printf(3) man page.)\n\nBut for now,\
    \ let’s look at the basic tag. In fact, let’s look at three: the tags that print\
    \ the package name, version, and release. Strangely enough, these tags are called\
    \ NAME, VERSION, and RELEASE. In order to be used in a format string, the tag\
    \ names must be enclosed in curly braces and preceded by a percent sign. Let’s\
    \ give it a try:\n\n```\n# rpm -q --queryformat  '%{NAME}%{VERSION}%{RELEASE}\\\
    n'  rpm\n# rpm-2.3.1\n# \n```\n\nLet’s add a dash between the tags and see if\
