  md: 'any files in the %files list that RPM packages from /usr/blather will be included
    in the package as usual, but will also be automatically flagged as documentation.
    This directive is handy when a package creates its own documentation directory
    and contains a large number of files. Let''s give it a try by adding the following
    line to our spec file:


    ```

    %docdir /usr/blather

