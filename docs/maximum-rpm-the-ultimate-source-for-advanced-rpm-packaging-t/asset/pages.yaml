- pgno: 363
  md: '# A.2.1.1.1.1. *Is There a Solution?*


    The solution is to standardize the method by which information is retrieved from
    a file. This is done by creating a well-defined data structure that contains easily
    searched information about the data, and then physically separating that information
    from the data.


    When the data is required, it is found by using the easily searched information,
    which points to the data itself. The benefits are that the data can be placed
    anywhere in the file, and that the format of the data itself can change.


    # A.2.1.1.1.2. *The Solution: The Header Structure*


    The header structure is RPM’s solution to the problem of easily manipulating information
    in a standard way. The header structure’s sole purpose in life is to contain zero
    or more pieces of data. A file can have more than one header structure in it.
    In fact, an RPM package file has two—the signature and the header. It was from
    this header that the header structure got its name.


    There are three sections to each header structure. The first section is known
    as the *header structure header*. The header structure header is used to identify
    the start of a header structure, its size, and the number of data items it contains.


    Following the header structure header is an area called the *index*. The index
    contains one or more index entries. Each index entry contains information about,
    and a pointer to, a specific data item.


    After the index comes the *store*. It is in the store that the data items are
    kept. The data in the store is packed together as closely as possible. The order
    in which the data is stored is immaterial—a far cry from the C structure used
    in the lead.


    # A.2.1.1.1.3. *The Header Structure in Depth*


    Let’s take a more in-depth look at the actual format of a header structure, starting
    with the header structure header.


    # A.2.1.1.1.4. *The Header Structure Header*


    The header structure header always starts with a 3-byte magic number: `8e ad e8`.
    Following this is a 1-byte version number. Next are 4 bytes that are reserved
    for future expansion. After the reserved bytes is a 4-byte number that indicates
    how many index entries exist in this header structure, followed by another 4-byte
    number indicating how many bytes of data are part of the header structure.


    # A.2.1.1.1.5. *The Index Entry*


    The header structure’s index is made up of zero or more index entries. Each entry
    is 16 bytes long. The first 4 bytes contain a *tag*—a numeric value that identifies
    what type of data is pointed to by the entry. The tag values change according
    to the header structure’s position in the RPM file. A list of the actual tag values,
    and what they represent, is included in section A.2.1.3.2.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'Following the tag is a 4-byte type, which is a numeric value that describes
    the format of the data pointed to by the entry. The types and their values do
    not change from header structure to header structure. Here is the current list:


    +   NULL = 0

    +   CHAR = 1

    +   INT8 = 2

    +   INT16 = 3

    +   INT32 = 4

    +   INT64 = 5

    +   STRING = 6

    +   BIN = 7

    +   STRING_ARRAY = 8


    A few of the data types might need some clarification. The STRING data type is
    simply a null-terminated string, while the STRING_ARRAY is a collection of strings.
    Finally, the BIN data type is a collection of binary data. This is normally used
    to identify data that is longer than an INT but is not a printable STRING.


    Next is a 4-byte offset that contains the position of the data, relative to the
    beginning of the store. We''ll talk about the store in just a moment.


    Finally, there is a 4-byte count that contains the number of data items pointed
    to by the index entry. There are a few wrinkles to the meaning of the count, and
    they center around the STRING and STRING_ARRAY data types. STRING data always
    has a count of 1, while STRING_ARRAY data has a count equal to the number of strings
    contained in the store.


    # A.2.1.1.1.6. The Store


    The store is where the data contained in the header structure is stored. Depending
    on the data type being stored, there are some details that should be kept in mind:


    +   For STRING data, each string is terminated with a null byte.

    +   For INT data, each integer is stored at the natural boundary for its type.
    A 64-bit INT is stored on an 8-byte boundary, a 16-bit INT is stored on a 2-byte
    boundary, and so on.

    +   All data is in network byte order.


    With all these details out of the way, let''s take a look at the signature.


    # A.2.1.2. The Signature


    The signature section follows the lead in the RPM package file. It contains information
    that can be used to verify the integrity and, optionally, the authenticity of
    the majority of the package file. The signature is implemented as a header structure.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'You probably noticed our use of the word *majority*. The information in the
    signature header structure is based on the contents of the package file’s header
    and archive only. The data in the lead and the signature header structure is not
    included when the signature information is created, nor is it part of any subsequent
    checks based on that information.


    While that omission might seem to be a weakness in RPM’s design, it really isn’t.
    In the case of the lead, since it is used only for easy identification of package
    files, any changes made to that part of the file would, at worst, leave the file
    in such a state that RPM wouldn’t recognize it as a valid package file. Likewise,
    any changes to the signature header structure would make it impossible to verify
    the file’s integrity, since the signature information would have been changed
    from its original value.


    # A.2.1.2.1. Analyzing the Signature Area


    Using our newfound knowledge of header structures, let’s take a look at the signatures
    in `rpm-2.2.1-1.i386.rpm`:


    ```

    00000060: Bead e801 0000 0000 0000 0003 0000 00ac ………

    ```


    The first 3 bytes (`ead e8`) contain the magic number for the start of the header
    structure. The next byte (`01`) is the header structure’s version.


    As we discussed earlier, the next 4 bytes (`0000 0000`) are reserved. The 4 bytes
    after that (`0000 0003`) represent the number of index entries in the signature
    section, namely, three. Following that are 4 bytes (`0000 00ac`) that indicate
    how many bytes of data are stored in the signature. The hex value `00ac`, when
    converted to decimal, means the store is 172 bytes long.


    Following the first 16 bytes is the index. Each of the three index entries in
    this header structure consists of four 32-bit integers, in the following order:


    +   * Tag

    +   * Type

    +   * Offset

    +   * Count


    Let’s take a look at the first index entry:


    ```

    00000070: 0000 03e8 0000 0004 0000 0000 0000 0001 ………

    ```


    The tag consists of the first 4 bytes (`0000 03e8`), which is 1,000 when translated
    from hex. Looking in the RPM source directory, at the file `lib/signature.h`,
    we find the following tag definitions:


    ```

    ```

    #define SIGTAG_SIZE 1000

    #define SIGTAG_MD5 1001

    #define SIGTAG_PGP 1002

    ```

    ```


    So the tag we are studying is for a size signature. Let’s continue.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# Appendix A   The Format of the RPM File


    The next 4 bytes (0000 0004) contain the data type. As we saw earlier, data type
    4 means that the data stored for this index entry is a 32-bit integer. Skipping
    the next 4 bytes for a moment, the last 4 bytes (0000 0001) are the number of
    32-bit integers pointed to by this index entry.


    Now let’s go back to the 4 bytes prior to the count (0000 0000). This number is
    the offset, in bytes, at which the size signature is located. It has a value of
    zero, but the question is, 0 bytes from what? The answer, although it doesn’t
    do us much good, is that the offset is calculated from the start of the store.
    So first we must find where the store begins, and we can do that by performing
    a simple calculation.


    First, go back to the start of the signature section. We’ve made a copy here so
    you won’t need to flip from page to page:


    ```

    00000000: 8ead e801 0000 0000 0000 0000 0003 0000 00ac .............

    ```


    After the magic, the version, and the 4 reserved bytes, there are the number of
    index entries (0000 0003). Since we know that each index entry is 16 bytes long
    (4 for the tag, 4 for the type, 4 for the offset, and 4 for the count), we can
    multiply the number of entries (3) by the number of bytes in each entry (16) and
    obtain the total size of the index, which is 48 in decimal, or 30 in hex. Since
    the first index entry starts at hex offset 70, we can simply add hex 30 to hex
    70, and get, in hex, offset a0. So let’s skip down to offset a0 and see what’s
    there:


    ```

    000000a0: 0004 4c4f b025 b097 1597 0132 df35 d169 .LO.%....2,5.i

    ```


    If we’ve done our math correctly, the first 4 bytes (0004 4c4f) should represent
    the size of this file. Converting to decimal, this is 281,679. Let’s take a look
    at the size of the actual file:


    ```

    # ls -al rpm-2.2.1-1.i386.rpm

    # -rw-rw-r-- 1 ed ed(282015)Jul 21 16:05 rpm-2.2.1-1.i386.rpm

    #

    ```


    Hmmmm, something’s not right. Or is it? It looks like we’re short by 336 bytes,
    or in hex, 150. Interesting how that’s a nice round hex number, isn’t it? For
    now, let’s continue through the remainder of the index entries, and see if hex
    150 pops up elsewhere.


    Here’s the next index entry. It has a tag of decimal 1001, which is an MD5 checksum.
    It is type 7, which is the BIN data type, it is 16 bytes long, and its data starts
    4 bytes after the beginning of the store:


    ```

    000000b0: 0000 03e9 0000 0007 0000 0004 0000 0010 ...............

    ```


    And here’s the data. It starts with b025 (Remember that offset of four!) and ends
    on the second line with 5375. This is a 128-bit MD5 checksum of the package file’s
    header and archive sections:


    ```

    000000a0: 0004 4c4f b025 b097 1597 0132 df35 d169 .LO.%....2,5.i

    000000b0: 329c 5375 8900 9503 9503 312d 6390 a520 2.su.....1.c.

    ```


    Okay, let’s jump back to the last index entry:


    ```

    00000090: 0000 03ea 0000 0007 0000 0014 0000 0098 ...............

    ```'
