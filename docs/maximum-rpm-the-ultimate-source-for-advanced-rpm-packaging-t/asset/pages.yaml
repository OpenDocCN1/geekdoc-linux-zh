  img_proc: true
- pgno: 252
  md: 'The description of the `rpms` directory is missing one key point. Since the
    binary package files are specific to an architecture, the directory actually contains
    one or more subdirectories, one for each architecture. It is in these subdirectories
    that RPM will write the binary package files.


    Let’s start by creating the directories. We can even do it with one command:


    ```

    $ pwd

    /home/ed

    $ mkdir mybuild\

    ? mybuild/BUILD\

    ? mybuild/RPMS\

    ? mybuild/RPMS/i386\

    ? mybuild/SOURCES\

    ? mybuild/SPECS\

    ? mybuild/SRPMS\

    $

    ```


    That’s all there is to it. You might have noticed that we created a subdirectory
    to `rpms` called `i386`. This is the architecture-specific subdirectory for Intel
    x86-based systems, which is our sample build system.


    The next step in getting `RPM` to use a different build area is telling `RPM`
    where the new build area is. And it’s almost as easy as creating the build area
    itself.


    # ## 16.2.2. Directing RPM to Use the New Build Area


    All that’s required to get `RPM` to start using the new build area is to define
    an alternate value for `topdir` in an `rpmbrc` file. For the nonroot user, this
    means putting the following line in a file called `.rpmbrc`, located in your home
    directory:


    `topdir: <path>`


    By replacing `<path>` with the path to the new build area’s top-level directory,
    `RPM` will attempt to use it the next time a build is performed. Using our newly
    created build area as an example, we’ll set `topdir` to `/home/ed/mybuild`:


    `topdir: /home/ed/mybuild`


    That’s all there is to it. Now it’s time to try a build.


    # ## 16.2.3. Performing a Build in a New Build Area


    In the following example, a nonroot user attempts to build the `cdplayer` package
    in a personal build area. If the user has modified `rpmbrc` file entries to change
    the default build area, the command used to start the build is just like the one
    used by a root user. Otherwise, the `--buildroot` option will need to be used:


    ```

    $ cd /home/ed/mybuild/SPECS

    $ rpm -ba --buildroot /home/ed/mybuildroot cdplayer-1.0.spec

    + Package: cdplayer

    ```'
