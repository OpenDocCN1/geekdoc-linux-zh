    # 13.6.2.3. -f <file>: Read the %files List from <file>


    The -f option is used to direct RPM to read the %files list from the named file.
    Like the %files list in a spec file, the file named using the -f option should
    contain one filename per line and also include any of the directives named in
    this section.


    Why is it necessary to read filenames from a file rather than have the filenames
    in the spec file? Here’s a possible reason: The filenames’ paths may contain a
    directory name that can be determined only at build time, such as an architecture
    specification. The list of files, minus the variable part of the path, can be
    created, and sed can be used at build time to update the path appropriately.


    It’s not necessary that every filename to be packaged reside in the file. If there
    are any filenames present in the spec file, they will be packaged as well:


    ```

    %files latex -f tetex-latex-skel

    /usr/bin/latex

    /usr/bin/pslatex

    ...

    ```


    Here, the filenames present in the file tetex-latex-skel would be packaged, followed
    by every filename following the %files line.


    # 13.7. The Lone Directive: %package


    While every directive we’ve seen so far is used in the %files list, the %package
    directive is different. It is used to permit the creation of more than one package
    per spec file and can appear at any point in the spec file. These additional packages
    are known as subpackages. Subpackages are named according to the contents of the
    line containing the %package directive. The format of the package directive is
    this:


    ```

    %package: <string>

    ```


    <string> should be a name that describes the subpackage. This string is appended
    to the base package name to produce the subpackage’s name. For example, if a spec
    file contains a name tag value of foonly and a %package doc line, the subpackage
    name will be foonly-doc.'
