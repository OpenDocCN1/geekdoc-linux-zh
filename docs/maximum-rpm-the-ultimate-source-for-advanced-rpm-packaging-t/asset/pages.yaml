    # 5.2.2.7. --provides: Display Capabilities Provided by the Package


    By adding `--provides` to a query command, you can see the capabilities provided
    by one or more packages. If the package doesn''t provide any capabilities, the
    `--provides` option produces no output:


    ```

    # rpm -q --provides rpm

    #

