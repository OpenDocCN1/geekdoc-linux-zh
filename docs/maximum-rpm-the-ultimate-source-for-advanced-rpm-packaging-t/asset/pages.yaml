    # ## 11.5. When Things Go Wrong


    This example is a bit of a fairy tale in that it went perfectly the first time.
    In real life, it often takes several tries to get it right.


    # ### 11.5.1. Problems During the Build


    As alluded to earlier in the chapter, RPM can stop at various points in the build
    process. This allows package builders to look through the build directory and
    make sure everything is proceeding properly. If there are problems, stopping during
    the build process permits them to see exactly what is going wrong and where. Here
    is a list of points at which RPM can be stopped during the build:


    +   - After the `%prep` section

    +   - After doing some cursory checks on the `%files` list

    +   - After the `%build` section

    +   - After the `%install` section

    +   - After the binary package has been created


    In addition, there is a method that permits the package builder to short-circuit
    the build process and direct RPM to skip over the initial steps. This is handy
    when the application is not yet'
