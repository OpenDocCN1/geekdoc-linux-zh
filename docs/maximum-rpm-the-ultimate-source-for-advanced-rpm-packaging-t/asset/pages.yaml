- pgno: 474
  md: '# Slackware Linux Unleashed, Third Edition


    —Timothy Parker, et al.

    Slackware Linux is a 32-bit version of the popular UNIX operating system. In many
    ways, it enhances the functionality of UNIX and UNIX-based applications. Slackware
    is a free operating system that can be downloaded from the Internet. And because
    it is free, there is very little existing documentation for the product. This
    book fills that void and provides Slackware Linux users with the information they
    need to effectively run the software on their computers or networks.


    Price: $49.99 USA/$70.95 CDN    User level: Accomplished—Expert

    ISBN: 0-672-31012-0                  1,300 pages


    ![](img/5ceb645f91e0f928013c644127692ba8_474_0.png)


    # Linux Unleashed, Second Edition


    —Kamran Hussain, Timothy Parker, et al.

    Readers will turn to this second edition for in-depth coverage of hot Linux topics—PPP''s,
    networking, and site set-up and administration. This book is the only complete
    reference programmers, users, or system administrators will ever need.


    Price: $49.99 USA/$67.99 CDN    User level: Beginning—Intermediate

    ISBN: 0-672-30908-4                  1,224 pages


    ![](img/5ceb645f91e0f928013c644127692ba8_474_1.png)


    # UNIX Unleashed


    —Various UNIX wizards

    The power user''s guide to UNIX! This book/CD-ROM set provides an in-depth examination
    of UNIX and its utilities. The CD-ROM contains shell scripts from the book and
    sample UNIX programs. This book includes definitions, practical information, tips,
    tricks, and examples.


    Price: $49.99 USA/$67.99 CDN    User level: New—Casual—Accomplished

    ISBN: 0-672-30402-3                  1,620 pages


    ![](img/5ceb645f91e0f928013c644127692ba8_474_2.png)


    # TCP/IP Blueprints


    —Martin Bligh, Dennis Short, Thomas Lee, et al.

    TCP/IP is the predominant network protocol in use today. *TCP/IP Blueprints* is
    a comprehensive, indispensable tutorial and reference for anyone working with
    TCP/IP using the new IP V6 standard. Using real-world, easy-to-understand examples,
    users will learn how to operate, maintain, debug, and troubleshoot TCP/IP.


    Price: $39.99 USA/$56.95 CDN    User level: Accomplished—Expert

    ISBN: 0-672-31055-4                  500 pages


    ![](img/5ceb645f91e0f928013c644127692ba8_474_3.png)'
  merge: -1
  img_proc: true
