- pgno: 80
  md: 'Change your directory to the one holding the file you want to query. Even if
    you use a symlinked path to get there, querying the file should then work as you''d
    expect:


    ```

    ```

    # cd /usr/X11/bin

    # rpm -qf xterm

    XFree86-3.1.2-5

    #

    ```

    ```


    So if you get a not owned by any package error and you think it might not be true,
    try one of these approaches.


    # 5.2.1.4. -p <file>: Query a Specific RPM Package File


    Until now, every means of specifying a package to an RPM query focused on packages
    that had already been installed. While it''s certainly very useful to be able
    to dredge up information about packages that are already on your system, what
    about packages that haven''t yet been installed? The -p option can do that for
    you.


    One situation where this capability would help occurs when the name of a package
    file has been changed. Because the name of the file containing a package has nothing
    to do with the name of the package (although by tradition it''s nice to name package
