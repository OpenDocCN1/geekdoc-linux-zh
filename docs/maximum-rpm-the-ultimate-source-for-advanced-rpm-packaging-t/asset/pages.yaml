  md: 'of each installed package, followed by the time the package was installed.
    Looking through the available tags, we see INSTALLTIME. Great! Looks like this
    will be simple:


    ```

    # rpm -qa --queryformat ''%{NAME} was installed on %{INSTALLTIME}\n''

    setup was installed on 845414601

    pamconfig was installed on 845414602

    filesystem was installed on 845414607

    ...

    rpm was installed on 851659311

    pgp was installed on 846027549

    #

    ```


    Well, that''s a lot of output, but it''s not very useful. What are those numbers?
    RPM didn''t lie— they''re the times the packages were installed. The problem is
    that the times are being displayed in their numeric form used internally by the
    operating system, and humans like to see the day, month, year, and so on.


    Fortunately, there''s a modifier for just this situation. The name of the modifier
    is :date, and it follows the tag name. Let''s try our example again, this time
    using :date:


    ```

    # rpm -qa --queryformat ''%{NAME} was installed on %{INSTALLTIME:date}\n''

    setup was installed on Tue Oct 15 17:23:21 1996

    pamconfig was installed on Tue Oct 15 17:23:22 1996

    filesystem was installed on Tue Oct 15 17:23:27 1996

    ...

    rpm was installed on Thu Dec 26 23:01:51 1996

    pgp was installed on Tue Oct 22 19:39:09 1996

    #

    ```


    That sure is a lot easier to understand, isn''t it?


    Here''s a list of the available modifiers:


    +   The :date modifier displays dates in human-readable form. It transforms 846027549
    into Tue Oct 22 19:39:09 1996.


    +   The :perms modifier displays file permissions in an easy-to-read format. It
    changes -32275 to -rwxr-xr-x.


    +   The :deftags modifier displays the version comparison a g s used in dependency
    processing in human-readable form. It turns 12 into >=.


    +   The :fflags modifier displays a c if the file has been marked as being a configuration
    file, a d if the file has been marked as being a documentation file, and blank
    otherwise. Thus, 2 becomes d.


    # 5.2.2.11.6. Array Iterators


    Until now, we''ve been using tags that represent single data items. There is,
    for example, only one package name or installation date for each package. However,
    other tags can represent many different pieces of data. One such tag is FILENAMES,
    which can be used to display the names of every file contained in a package.'
