- pgno: 319
  md: "# 298\n\nPart II ⌘ RPM and Developers: How to Distribute Your Software More\
    \ Easily with RPM\n\nFirst, we start the script with a %post statement and indicate\
    \ that this script is for the client subpackage. As the comments indicate, we\
    \ only want to perform the following tasks if this is the first time the client\
    \ subpackage has been installed. To do this, we use the first and only argument\
    \ passed to the script. It is a number indicating how many instances of this package\
    \ will be installed after the current installation is complete.\n\nIf the argument\
    \ is equal to 1, no other instances of the client subpackage are presently installed\
    \ and this one is the first. Let's continue:\n\n```\n# Set disk devices so that\
    \ bin can read them\n# (This is actually done on Red Hat Linux; only need to add\
    \ bin to\n# group disk)\n\nif grep \"^disk:::.*bin\" /etc/group > /dev/null\n\
    then\n true\nelse\n\n# If there are any members in group disk, add bin after a\
    \ comma...\nsed -e 's/\\\\(\"disk:::\\[0-9\\]\\{1,\\}::\\\\(\\{1,\\}\\)\\\\/\\\
    \\1\\,bin/' /etc/group > /etc/group.tmp\n\n# If there are no members in group\
    \ disk, add bin...\nsed -e 's/\\\\(\"disk:::\\[0-9\\]\\{1,\\}::S\\)'''\\\\/\\\\\
    1\\,bin/' /etc/group.tmp > /etc/group\n\n# clean up!\nrm -rf /etc/group.tmp\n\
    fi\n```\n\nOne of amanda's requirements is that the user ID running the dumps\
    \ on the client needs to be able to read from every disk's device file. The folks\
    \ at Red Hat have done half the work for us by creating a group disk and giving\
    \ that group read/write access to every disk device. Since our dumper is bin,\
    \ we only need to add bin to the disk group. Two lines of sed, and we're done!\n\
    \nThe next section is related to the last. It also focuses on making sure bin\
    \ can access everything it needs while doing backups:\n\n```\n# Also set /etc/dumpdates\
    \ to be writable by group disk\n\nchgrp disk /etc/dumpdates\nchmod g+w /etc/dumpdates\n\
    ```\n\nSince amanda uses dump to obtain the backups, and since dump keeps track\
    \ of the backups in /etc/dumpdates, it's only natural that bin will need read/write\
    \ access to the file. In a perfect world, /etc/dumpdates would have already been\
    \ set to allow group disk to read and write, but we had to do it ourselves. It's\
    \ not a big problem, though.\n\nNext, we need to create the appropriate network-related\
    \ entries so that amanda clients can communicate with amanda servers and vice\
    \ versa:\n\n```\n# Add amanda line to /etc/services\n\nif grep \"amanda\" /etc/services\
    \ >/dev/null\nthen\n```"
  merge: -1
  img_proc: true
- pgno: 320
  md: "true\nelse\necho \"amanda 10080/udp # Added by package amanda-client\" >>/etc/services\n\
    fi\n\nBy using grep to look for lines that begin with the letters amanda, we can\
    \ easily see whether /etc/services is already configured properly. If it isn't,\
    \ we simply append a line to the end.\n\nWe also added a comment so that sysadmins\
    \ will know where the entry came from and either take our word for it or issue\
    \ an rpm -q --scripts amanda-client command and see for themselves. We did it\
    \ all on one line because it makes the script simpler.\n\nLet's look at the rest\
    \ of the network-related part of this script:\n\n```\n# Add amanda line to /etc/inetd.conf\n\
    \nif grep \"*amanda*\" /etc/inetd.conf >/dev/null\nthen\n    true\nelse\n    echo\
    \ \"amanda dgram udp wait bin /usr/lib/amanda/amedad amadad\n# Added by package\
    \ amanda-client\" >>/etc/inetd.conf\n# Kick inetd\nif [ -f /var/run/inetd.pid\
    \ ];\nthen\n    kill -HUP `cat /var/run/inetd.pid`\nfi\nfi\n```\n\nHere, we've\
    \ used the same approach to add an entry to /etc/inetd.conf. We then send a hangup\
    \ signal to inetd so the change will take effect, and we're done!\n\nOh, and that\
    \ last fi at the end? That's to close the if [ \"$1\" = 1 ] at the start of the\
    \ script. Now let's look at the server's postinstall script:\n\n```\n%post server\n\
    # See if they've installed amanda before...\n\nif [ \"$1\" = 1 ];\nthen\n    #\
    \ Add amanda line to /etc/services\n    if grep \"*amanda*\" /etc/services >/dev/null\n\
    \    then\n        true\n    else\n        echo \"amanda 10080/udp # Added by\
    \ package amanda-server\" >>/etc/services\n    fi\nfi\n```"
