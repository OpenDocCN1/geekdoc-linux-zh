- pgno: 269
  md: 'In this chapter, we will explore one of RPM''s more interesting capabilities:
    the capability to create subpackages.


    # 18.1. What Are Subpackages?


    Very simply put, a *subpackage* is one of several package files created from a
    single spec file. RPM has the ability to create a main package, along with one
    or more subpackages. Subpackages can also be created without the main package.
    It''s all up to the package builder.


    # 18.2. Why Are Subpackages Needed?


    If all the software in the world followed the usual "one source, one binary" structure,
    there would be no need for subpackages. After all, RPM handles the building and
    packaging of a program into a single package file just fine.


    But software doesn''t always conform to this simplistic structure. It''s not unusual
    for software to support two or more different modes of operation. A client/server
    program, for example, comes in two flavors: a client and a server.


    And it can get more complicated than that. Sometimes software relies on another
    program so completely that the two cannot be built separately. The result is often
    several packages.


    Although it is certainly possible that some convoluted procedure could be devised
    to force these kinds of software into a single-package structure, it makes more
    sense to let RPM manage the creation of subpackages. Why? From the package builder''s
    viewpoint, the main reason to use subpackages is to eliminate any duplication
    of effort.


    When using subpackages, there''s no need to maintain separate spec files and endure
    the resulting headaches when new versions of the software become available. By
    keeping everything in one spec file, new software versions can be quickly integrated,
    and every related subpackage can be rebuilt with a single command.


    But that''s enough of the preliminaries. Let''s see how subpackages are created.


    # 18.3. Our Sample Spec File: Subpackages Galore!


    Throughout this chapter, we''ll be constructing a spec file that will consist
    of a number of subpackages. Let''s start by listing the spec file''s requirements:


    +   The main package name is to be foo.


    +   The version is to be 2.7.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "+   - There are three subpackages:\n+   \t- The server subpackage, to be called\
    \ foo-server\n+   \t- The client subpackage, to be called foo-client\n+   \t-\
    \ The baz development library subpackage, to be called bazlib\n+   - The bazlib\
    \ subpackage has a version 5.6.\n+   - Each subpackage will have its own `summary`\
    \ and `description` tags.\n\nEvery spec file starts with a preamble. In this case,\
    \ the preamble will contain the following tags:\n\n```\n```\nName: foo\nVersion:\
    \ 2.7\nRelease: 1\nSource: foo-2.7.tgz\nCopyright: probably not\nSummary: The\
    \ foo app, and the baz library needed to build it\nGroup: bogus/junkie\n%description\n\
    This is the long description of the foo app, and the baz library needed to\nbuild\
    \ it...\n```\n```\n\nAs you can see, there’s nothing different here: This is an\
    \ ordinary spec file so far. Let’s delve into things a bit more and see what we’ll\
    \ need to add to this spec file to create the subpackages we require.\n\n# ##\
    \ 18.4. Spec File Changes for Subpackages\n\nThe creation of subpackages is based\
    \ strictly on the contents of the spec file. This doesn’t mean that you’ll have\
    \ to learn an entirely new set of tags, conditionals, and directives in order\
    \ to create subpackages, however. In fact, you’ll only need to learn one.\n\n\
    The primary change to a spec file is structural and starts with the definition\
    \ of a preamble for each subpackage.\n\n# ### 18.4.1. The Subpackage’s Preamble\n\
    \nWhen we introduced RPM package building in Chapter 10, “The Basics of Developing\
    \ with RPM,” we said that every spec file contains a preamble. The preamble contains\
    \ a variety of tags that define all sorts of information about the package. In\
    \ a single-package situation, the preamble must be at the start of the spec file.\
    \ The spec file we’re creating will have one there, too.\n\nWhen you’re creating\
    \ a spec file that will build subpackages, each subpackage also needs a preamble\
    \ of its own. These subpreambles need only define information for the subpackage\
    \ when that information differs from what is defined in the main preamble. For\
    \ example, if we wanted to define an installation prefix for a subpackage, we\
    \ would add the appropriate prefix tag to that subpackage’s preamble. That subpackage\
    \ would then be relocatable."
  merge: -1
  img_proc: true
- pgno: 271
  md: "In a single-package spec file, nothing explicitly identifies the preamble other\
    \ than its position at the top of the file. For subpackages, however, we need\
    \ to be a bit more explicit. So we use the `%package` directive to identify the\
    \ preamble for each subpackage.\n\n# 18.4.1.1. The `%package` Directive\n\nThe\
    \ `%package` directive actually performs two functions. As mentioned, it is used\
    \ to denote the start of a subpackage's preamble. It also plays a role in forming\
    \ the subpackage's name. For example, let's say the main preamble contains the\
    \ following `name` tag:\n\n```\nname: foo\n```\n\nLater in the spec file, there\
    \ is a `%package` directive:\n\n```\n`%package bar`\n```\n\nThis would result\
    \ in the name of the subpackage being foo-bar.\n\nIn this way, it's easy to see\
    \ the relationship of the subpackage to the main package (or to other subpackages,\
    \ for that matter). Of course, this naming convention might not be appropriate\
    \ in every case. So there is an option to the `%package` directive for just this\
    \ circumstance.\n\n# 18.4.1.2. Adding `-n` to the `%package` Directive\n\nThe\
    \ `-n` option is used to change the final name of a subpackage from *mainpackage-subpackage*\
    \ to *subpackage*. Let's modify the `%package` directive in our earlier example\
    \ to be\n\n```\n`%package -n bar`\n```\n\nThe result is that the subpackage name\
    \ would be bar instead of foo-bar.\n\n# 18.4.1.3. Updating Our Spec File\n\nLet's\
    \ apply some of our newly found knowledge to the spec file we're writing. Here's\
    \ the list of subpackages we need to create:\n\n+   The server subpackage, to\
    \ be called foo-server  \n+       The client subpackage, to be called foo-client\
    \  \n+       The baz development library subpackage, to be called baz1ib\n\nSince\
    \ our package name is foo, and since the `%package` directive creates subpackage\
    \ names by prepending the package name, the `%package` directives for the foo-server\
    \ and foo-client subpackages would be written as\n\n```\n`%package server`  \n\
    and  \n`%package client`\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Since the baz library''s package name is not to start with foo, we need to
    use the -n option on its %package directive:


    ```

    %package -n bazlib

    ```


    Our requirements further state that foo-server and foo-client are to have the
    same version as the main package.


    One of the time-saving aspects of using subpackages is that there is no need to
    duplicate information for each subpackage if it is already defined in the main
    package. Therefore, since the main package''s preamble has a version tag defining
    the version as 2.7, the two subpackages that lack a version tag in their preambles
    will simply inherit the main package''s version definition.


    Since the bazlib subpackage''s preamble contains a version tag, it must have its
    own unique version.


    In addition, each subpackage must have its own summary tag.


    So, based on these requirements, our spec file now looks like this:


    ```

    Name: foo

    Version: 2.7

    Release: 1

    Source: foo-2.7.tgz

    CopyRight: probably not

    Summary: The foo app, and the baz library needed to build it

    Group: bogus/junk

    %description

    This is the long description of the foo app, and the baz library needed to build
    it...


    %package server

    Summary: The foo server


    %package client

    Summary: The foo client


    %package -n bazlib

    Version: 5.6

    Summary: The baz library

    ```


    We can see the subpackage structure starting to appear now.


    # 18.4.1.4. Required Tags in Subpackages


    There are a few more tags we should add to the subpackages in our sample spec
    file. In fact, if these tags are not present, RPM will issue a most impressive
    warning:


    ```

    # rpm -ba foo-2.7.spec

    Package: foo-server

    Field must be present: Description

    Field must be present: Group

    ```'
  merge: -1
