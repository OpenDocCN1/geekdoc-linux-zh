    # ### 20.4.1.2. Applying Directives


    Since we’d like the client subpackage to include those files that are not normally
    installed, and since the files are documentation, let’s use the %doc directive
    on them. That will accomplish two things:


    +   • When the client subpackage is installed, it will direct RPM to place them
    in a package-specific directory in /usr/doc.


    +   • It will tag the files as being documentation, making it possible for users
    to easily track down the documentation with a simple rpm -qd command.


    In the course of looking over the %files lists, it becomes apparent that the directory
    /usr/lib/amanda will contain only files from the two amanda subpackages. If the
    subpackages are erased, the directory will remain, which won’t hurt anything,
    but it isn’t as neat as it could be. But if we add the directory to the list,
    RPM will automatically package every file in the directory. Because the files
    in that directory are part of both the client and the server subpackages, we’ll
    need to use the %dir directive to instruct RPM to package only the directory.


    After these changes, here’s what the client %files list looks like now:


