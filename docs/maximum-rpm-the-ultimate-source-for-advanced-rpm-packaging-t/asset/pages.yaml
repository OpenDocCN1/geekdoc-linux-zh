  md: "The `--recompile` option is normally used when a previously installed package\
    \ needs to be recompiled. `--recompile` comes in handy when software needs to\
    \ be compiled against a new version of the kernel.\n\nHere's what RPM displays\
    \ during a `--recompile`:\n\n```\n# rpm --recompile cdplayer-1.0-1.src.rpm\nInstalling\
    \ cdplayer-1.0-1.src.rpm\n  Package: cdplayer\nExecuting: %prep\n ...\n + exit\
    \ 0\nExecuting: %build\n ...\n + exit 0\nExecuting: %install\n ...\n + exit 0\n\
    Executing: special doc\n ...\n + exit 0\nExecuting: sweep\n ...\n + exit 0\n#\n\
    ```\n\nThe very first line shows RPM installing the source package. After that\
    \ are ordinary executions of the %prep, %build, and %install sections of the spec\
    \ file. Finally, the cleanup of the software's build directory takes place, just\
    \ as if the `--clean` option had been specified.\n\nSince `rpm -i` and `rpm -U`\
    \ are not being used to install the software, the RPM database is not updated\
    \ during a `--recompile`. This means that doing a `--recompile` on an already-installed\
    \ package may result in problems down the road, when RPM is used to upgrade or\
    \ verify the package.\n\n# 12.2.2. rpm `--rebuild`: What Does It Do?\n\nPackage\
    \ builders, particularly those who create packages for multiple architectures,\
    \ often need to build their packages starting from the original sources. The `--rebuild`\
    \ option does this, starting from a source package file. Here is the list of steps\
    \ it performs:\n\n+   1. Install the specified source package file.\n+   2. Unpack\
    \ the original sources.\n+   3. Build the software.\n+   4. Install the software.\n\
    +   5. Create a binary package file.\n+   6. Remove the software's build directory\
    \ tree."
