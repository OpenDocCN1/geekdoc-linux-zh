- pgno: 261
  md: 'The passphrase is entered twice to ensure that no typing mistakes were made.
    PGP also performs some cursory checks on the passphrase, ensuring that the phrase
    is at least somewhat secure.


    Finally comes the strangest part of the key-generation process: creating random
    bits. This is done by measuring the time between keystrokes. The secret here is
    to not hold down a key so that it auto-repeats and to not wait several seconds
    between keystrokes. Simply start typing anything (even nonsense text) until PGP
    tells you’ve typed enough.


    After generating enough random bits, PGP takes a minute or so to create the key.
    Assuming that everything completed successfully, you’ll see an ending message
    similar to the one shown in this example. You’ll also find, in a subdirectory
    of your login directory called .ppp, the following files:


    ```

    # ls -al - /.ppp

    total 6

    drwxr-xr-x    2 root    root    1024 Oct 30 19:44 .

    drwxr-xr-x    5 root    root    1024 Oct 30 19:44 ..

    -rw------     1 root    root      176 Oct 30 19:44 pubring.bak

    -rw-------     1 root    root      331 Oct 30 19:44 pubring.pgp

    -rw-------     1 root    root      408 Oct 30 19:44 random.seed.bin

    -rw-------     1 root    root      509 Oct 30 19:44 secring.pgp

    #

    ```


    Those of you interested in learning exactly what each file is can consult any
    of the fine books on PGP. For the purposes of signing packages, all you need to
    know is where these files are located.


    That’s it! Now it’s time to configure RPM to use your newly generated key.


    # 17.2.2. Preparing RPM


    RPM’s configuration process is quite straightforward. It simply consists of adding
    a few rpmsrc entries in a file of your choice. For more information on rpmsrc
    files in general, see Appendix B, “The rpmsrc File.”


    The entries that need to be added to an rpmsrc file are


    +   * signature

    +   * pkg_name

    +   * ppg_path


    Let’s check out the entries:


    * signature—The signature entry is used to select the type of signature that RPM
    is to use. At the time this book is being written, the only legal value is ppg.
    So you would enter


    ```

    signature: ppg

    ```'
  merge: -1
