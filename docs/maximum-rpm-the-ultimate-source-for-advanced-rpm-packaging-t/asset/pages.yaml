    # 20.3.2. Making a First-Cut Spec File


    Since amanda comes in two parts, it''s obvious that we''ll need to use subpackages:
    one for the client software and one for the server. Given that, and the fact that
    the first part of any spec file consists of tags that are easily filled in, let''s
    sit down and fill in the blanks, tag-wise:


    ```

    Summary: Amanda Network Backup System

    Name: amanda

    Version: 2.3.0B

    Release: 1

    Group: System/Backup

    Copyright: BSD-like, but see COPYRIGHT file for details

    Packager: Edward C. Bailey <bailey@rpm.org>

    URL: http://www.cs.umd.edu/projects/amanda/

    Source: ftp://ftp.cs.umd.edu/pub/amanda/amanda-2.3.0.tar.gz

    Patch: amanda-2.3.0-linux.patch

    %description

    Amanda is a client/server backup system. It uses standard tape

    devices and networking, so all you need is any working tape drive

    and a network. You can use it for local backups as well.

    ```


    That part was pretty easy. We set the package''s release number to 1. We''ll undoubtedly
    be changing that as we continue work on the spec file. You''ll notice that we''ve
    included a URL tag line; the uniform resource locator there points to the home
    page for the amanda project, making it easier for the user to get additional information
    on amanda.


    The Source tag here includes the name of the original source tar file and is preceded
    by the URL pointing to the file''s primary location. Again, this makes it easy
    for the user to grab a copy of the sources from the software''s “birthplace.”


    Finally, the patch file that we''ve just created gets a line of its own on the
    Patch tag line.


    Next, let''s take a look at the tags for our two subpackages. Let''s start with
    the client:


    ```

    %package client

    Summary: Client-side Amanda package

    Group: System/Backup

    Requires: dump

    %description client

    The Amanda Network Backup System contains software necessary to

    automatically perform backups across a network. Amanda consists of

    two packages -- a client (this package), and a server:

    ```'
