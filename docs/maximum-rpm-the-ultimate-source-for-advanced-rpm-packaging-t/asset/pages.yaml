    status if the --test option detects problems.


    # 2.4.3. --replacepkgs: Install the Package Even if It''s Already Installed


    The --replacepkgs option is used to force RPM to install a package that it believes
    to be installed already. This option is normally used if the installed package
    has been damaged somehow and needs to be fixed up.


    To see how the --replacepkgs option works, let''s first install some software:


    ```

    # rpm -iv cdp-0.33-2.i386.rpm

    Installing cdp-0.33-2.i386.rpm

    #

    ```


    Okay, now that we have cdp-0.33-2 installed, let''s see what happens if we try
    to install the same version on top of itself:


    ```

    # rpm -iv cdp-0.33-2.i386.rpm

    Installing cdp-0.33-2.i386.rpm

    package cdp-0.33-2 is already installed

    error: cdp-0.33-2.i386.rpm cannot be installed

