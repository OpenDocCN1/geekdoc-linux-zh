  md: 'The `--noscripts` option prevents these scripts from being executed during
    an erase. This is a very dangerous thing to do! The `--noscripts` option is really
    meant for package builders to use during the development of their packages. By
    preventing the pre- and postuninstall scripts from running, a package builder
    can keep a buggy package from bringing down his development system. After the
    bugs are found and eliminated, there''s very little need to prevent these scripts
    from running; in fact, doing so can cause problems!


    # 3.3.4. --rcfile <rcfile>: Read <rcfile> for RPM Defaults


    The `--rcfile` option is used to specify a file containing default settings for
    RPM. Normally, this option is not needed. By default, RPM uses `/etc/rpmrc` and
    a file named `.rpmrc` located in your login directory.


    This option would be used if there were a need to switch between several sets
    of RPM defaults. Software developers and package builders will normally be the
    only people using the `--rcfile` option. For more information on `rpmrc` files,
    see Appendix B, “The `rpmrc` File.”


    # 3.3.5. --root <path>: Use <path> As the Root


    Adding `--root <path>` to an erase command forces RPM to assume that the directory
    specified by <path> is actually the root directory. The `--root` option affects
    every aspect of the erase process, so pre- and postuninstall scripts are run with
    <path> as their root directory (using chroot(2), if you must know). In addition,
    RPM expects its database to reside in the directory specified by the <path> `rpmrc`
    file entry, relative to <path>.


    Normally this option is only used during an initial system install, or when a
    system has been booted off a rescue disk and some packages need to be re-installed.


    # 3.3.6. --dbpath <path>: Use <path> to Find the RPM Database


    In order for RPM to do its work, it needs access to an RPM database. Normally,
    this database exists in the directory specified by the `rpmrc` file entry, `dbpath`.
    By default, `dbpath` is set to `/var/lib/rpm`.


    Although the `dbpath` entry can be modified in the appropriate `rpmrc` file, the
    `--dbpath` option is probably a better choice when the database path needs to
    be changed temporarily. An example of a time the `--dbpath` option would come
    in handy is when it''s necessary to examine an RPM database copied from another
    system. Granted, it''s not a common occurrence, but it''s difficult to handle
    any other way.'
