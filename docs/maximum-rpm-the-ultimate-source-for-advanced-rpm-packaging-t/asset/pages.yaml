- pgno: 391
  md: '# C.4.1. Options for Verify Mode


    The following options can be used on any verify command:


    +   - -nodeps—Do not verify package dependencies.

    +   - -nofiles—Do not verify file attributes.

    +   - -noscripts—Do not execute the package’s verification script.


    # C.5. Install Mode


    RPM’s installation mode is used to install packages.


    Format:


    ```

    rpm --install <package file>

    ```


    ```

    or

    ```


    ```

    rpm -i <package file>

    ```


    # C.5.1. Options for Install Mode


    The following options can be used on any install command:


    +   - -h, --hash—Print hash marks as package installs (good with -v).

    +   - --prefix <dir>—Relocate the package to <dir>, if relocatable.

    +   - --excludedocs—Do not install documentation.

    +   - --force—Shorthand for --replacepkgs and --replacefiles.

    +   - --ignorescripts—Do not verify package architecture.

    +   - --ignorescripts—Do not verify package operating system.

    +   - --includedocs—Install documentation.

    +   - --nodeps—Do not check package dependencies.

    +   - --noscripts—Do not execute any installation scripts.

    +   - --percent—Print percentages as package installs.

    +   - --replacefiles—Install even if the package replaces installed files.

    +   - --replacepkgs—Reinstall if the package is already present.

    +   - --test—Do not install, but tell whether it would work.'
  merge: -1
  img_proc: true
- pgno: 392
  md: "# C.6. Upgrade Mode\n\nRPM's upgrade mode is used to upgrade packages.\n\n\
    Format:\t\t`rpm --upgrade <packagefile>`\n\n\t\t\tor\n\n\t\t\t`rpm -U <packagefile>`\n\
    \n# C.6.1. Options for Upgrade Mode\n\nThe following options can be used on any\
    \ upgrade command:\n\n+   - `-h, --hash`—Print hash marks as package installs\
    \ (good with `-v`).\n+   - `--prefix <dir>`—Relocate the package to `<dir>`, if\
    \ relocatable.\n+   - `--excludedocs`—Do not install documentation.\n+   - `--force`—Shorthand\
    \ for `--replacepkgs`, `--replacefiles`, and `--oldpackage`.\n+   - `--ignorearch`—Do\
    \ not verify package architecture.\n+   - `--ignoresos`—Do not verify package\
    \ operating system.\n+   - `--includedocs`—Install documentation.\n+   - `--nodeps`—Do\
    \ not verify package dependencies.\n+   - `--noscripts`—Do not execute any installation\
    \ scripts.\n+   - `--percent`—Print percentages as package installs.\n+   - `--replacefiles`—Install\
    \ even if the package replaces installed files.\n+   - `--replacepkgs`—Reinstall\
    \ if the package is already present.\n+   - `--test`—Do not install, but tell\
    \ whether it would work.\n+   - `--oldpackage`—Upgrade to an old version of the\
    \ package (`--force` on upgrades does this automatically).\n\n# C.7. Erase Mode\n\
    \nRPM's erase mode is used to erase previously installed packages.\n\nFormat:\t\
    \t`rpm --erase <package>`\n\n\t\t\tor\n\n\t\t\t`rpm -e <package>`"
  merge: -1
  img_proc: true
- pgno: 393
  md: '# C.7.1. Options for Erase Mode


    The following options can be used on any erase command:


    +   ・ --nodeps—Do not verify package dependencies.

    +   ・ --noscripts—Do not execute any installation scripts.


    # C.8. Build Mode


    RPM’s build mode is used to build packages.


    Format: rpm -b <stage> <options> <specfile>


    (Note that -vv is the default for all build mode commands.)


    # C.8.1. Build Mode Stages


    One of the following stages must follow the -b option:


    +   ・ p—Prep (unpack sources and apply patches).

    +   ・ 1—List check (do some cursory checks on %files).

    +   ・ c—Compile (prep and compile).

    +   ・ i—Install (prep, compile, install).

    +   ・ b—Binary package (prep, compile, install, package).

    +   ・ a—Binary/source package (prep, compile, install, package).


    # C.8.2. Options for Build Mode


    The following options can be used on any build command:


    +   ・ --short-circuit—Skip straight to specified stage (only for c and i).

    +   ・ --clean—Remove build tree when done.

    +   ・ --sign—Generate PGP signature.

    +   ・ --buildroot <s>—Use <s> as the build root.

    +   ・ --buildarch <s>—Use <s> as the build architecture.

    +   ・ --builddos <s>—Use <s> as the build operating system.

    +   ・ --test—Do not execute any stages.

    +   ・ --timecheck <s>—Set the time check to <s> seconds (0 disables it).'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# C.9. Rebuild Mode


    RPM’s rebuild mode is used to rebuild packages from a source package file. The
    source archives, patches, and icons that comprise the source package are removed
    after the binary package is built. Rebuild mode implies `--clean`.


    Format: `rpm --rebuild <options> <source-package>`


    (Note that `--vv` is the default for all rebuild mode commands.)


    # C.9.1. Options for Rebuild Mode


    Only the global options may be used.


    # C.10. Recompile Mode


    RPM’s recompile mode is used to recompile software from a source package file.
    Unlike `--rebuild`, no binary package is created.


    Format: `rpm --recompile <options> <source-package>`


    Note that `--vv` is the default for all recompile mode commands.


    # C.10.1. Options for Recompile Mode


    Only the global options may be used.


    # C.11. Resign Mode


    RPM’s resign mode is used to replace a package’s signature with a new one.


    Format: `rpm --resign <options> <packagefile>+`


    # C.11.1. Options for Resign Mode


    Only the global options may be used.


    # C.12. Add Signature Mode


    RPM’s add signature mode is used to add a signature to a package.


    Format: `rpm --addsign <options> <packagefile>+`'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# C.12.1. Options for Add Signature Mode


    Only the global options may be used.


    # C.13. Check Signature Mode


    RPM’s check signature mode is used to verify a package’s signature.


    Format:  `rpm --checksig <options> <packagefile>+`


    or


    `rpm -K <options> <packagefile>+`


    # C.13.1. Options for Check Signature Mode


    The following option can be used on any check signature command:


    +   - `--noglobp`—Skip any PGP signatures (size and MD5 only).


    # C.14. Initialize Database Mode


    RPM’s initialize database mode is used to create a new RPM database.


    Format: `rpm --initdb <options>`


    # C.14.1. Options for Initialize Database Mode


    Only the global options may be used.


    # C.15. Rebuild Database Mode


    RPM’s rebuild database mode is used to rebuild an RPM database.


    Format: `rpm --rebuilddb <options>`


    # C.15.1. Options to Rebuild Database Mode


    Only the global options may be used.'
  merge: -1
  img_proc: true
