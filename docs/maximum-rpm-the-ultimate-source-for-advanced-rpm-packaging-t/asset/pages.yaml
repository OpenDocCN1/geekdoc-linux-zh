- pgno: 262
  md: 'ppg_name—The ppg_name entry gives RPM the user ID of the key it is to sign
    packages with. In our key-generation example, the user ID of the key we created
    was Example Key for RPM Book, so this is what our entry should look like: ppg_name:
    Example Key for RPM Book


    ppg_path—The ppg_path entry is used to define the path to the directory where
    the keys are kept. This entry is not needed if the environment variable PPPATH
    has been defined. In our example, we didn''t move them from PGP''s default location,
    which is in the subdirectory .ppg, off the user''s login directory. Because we
    generated the key as root, our path is /root/.ppg. Therefore, our entry would
    look like this: ppg_path: /root/.ppg


    And that''s it. Now it''s time to sign some packages.


    # 17.3. Signing Packages


    There are three different ways to sign a package:


    +   - Sign the package at build time.

    +   - Replace the signature on an already-existing package.

    +   - Add a signature to an already-existing package.


    Let''s take a look at each one, starting with build time signing.


    # 17.3.1. --sign: Sign a Package at Build Time


    The --sign option is used to sign a package as it is being built. When this option
    is added to an RPM build command, RPM will ask for your PGP passphrase. If the
    passphrase is correct, the build will proceed. If not, the build stops immediately.


    Here''s an example of --sign in action:


    ```

    # rpm -ba --sign blather-7.9.spec

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.

    * Package: blather

    ...

    Binary Packaging: blather-7.9-1

    Finding dependencies...

    ...

    Generating signature: 1002

    Wrote: /usr/src/redhat/RPMS/i386/blather-7.9-1.i386.rpm

    ...

    Source Packaging: blather-7.9-1

    ...

    Generating signature: 1002

    Wrote: /usr/src/redhat/SRPMS/blather-7.9-1.src.rpm

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Once the passphrase is entered, there''s very little that is different from
    a normal build. The only obvious difference is the **generating signature** message
    in both the binary and source packaging sections. The number following the message
    indicates that the signature added was created using PGP. (The list of possible
    signature types can be found in the RPM sources, specifically *signature.h*, in
    RPM''s *lib* subdirectory.)


    Notice that since RPM only signs the source and binary package files, only the
    `--bb` and `-ba` options make any sense when used with `--sign`. This is due to
    the fact that only the `--bb` and `-ba` issues create package files.


    If we issue a quick signature check using RPM''s `--checksig` option, we can see
    that there is, in fact, a PGP signature present:


    ```

    # rpm --checksig blather-7.9.1.i386.rpm

    blather-7.9.1.i386.rpm: size vpp m5 OK

    #

    ```


    It''s clear that, in addition to the usual size and MD5 signatures, the package
    has a PGP signature.


    # 17.3.1.1. Multiple Builds? No Problem!


    You might be wondering how the `--sign` option will work if more than one package
    is to be built. Do you have to enter the passphrase for every single package you
    build? The answer is no, so long as you build the packages with a single RPM command.
    Here''s an example:


    ```

    # rpm -ba --sign b*.spec

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.


    * Package: blather

    ..

    Binary Packaging: blather-7.9.1

    ..

    Generating signature: 1002

    Wrote: /usr/src/redhat/RPMS/i386/blather-7.9.1.i386.rpm

    ..

    Source Packaging: blather-7.9.1

    ..

    Generating signature: 1002

    Wrote: /usr/src/redhat/SRPMS/blather-7.9.1.src.rpm

    ..

    * Package: bother

    ..

    Binary Packaging: bother-3.5.1

    ..

    Generating signature: 1002

    Wrote: /usr/src/redhat/RPMS/i386/bother-3.5.1.i386.rpm

    ..

    Source Packaging: bother-3.5.1

    ..

    Generating signature: 1002

    Wrote: /usr/src/redhat/SRPMS/bother-3.5.1.src.rpm

    #

    ```'
