    # ### 13.6.2.2. The `%dir` Directive


    As mentioned in section 13.5, if a directory is specified in the `%files` list,
    the contents of that directory, and the contents of every directory under it,
    will automatically be included in the package. While this feature can be handy
    (assuming that you are sure that every file under the directory should be packaged),
    there are times when this could be a problem.


    The way to get around this is to use the `%dir` directive. By adding this directive
    to the line containing the directory, RPM will package only the directory itself,
    regardless of what files are in the directory at the time the package is created.
    Here''s an example of `%dir` in action.


    The `blather-1.0` package creates the directory `/usr/blather` as part of its
    build. It also puts several files in that directory. In the spec file, the `/usr/blather`
    directory is included in the `%files` list:


    ```

    %files

    ...

    /usr/blather

    ...

    ```


    There are no other entries in the `%files` list that have `/usr/blather` as part
    of their path. After building the package, we use RPM to look at the files in
    the package:


    ```

    # rpm -qlp ../RPMS/i386/blather-1.0-1.i386.rpm

    ...

    /usr/blather

    /usr/blather/COPYING

    /usr/blather/INSTALL

    /usr/blather/README

    ...#

    ```


    The files present in `/usr/blather` at the time the package was built were included
    in the package automatically, without entering their names in the `%files` list.


    However, after changing the `/usr/blather` line in the `%files` list to this:


    ```

    %dir /usr/blather

    ```'
