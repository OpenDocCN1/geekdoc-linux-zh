- pgno: 49
  md: '# 2.4.4.2. --replacefiles Can Mean Trouble Down the Road


    Although --replacefiles can make today''s difficult install easier, it can mean
    big headaches in the future. When the time comes for erasing the packages involved
    in a file conflict, bad things can happen. What bad things? Well, files can be
    deleted. Here''s how, in three easy steps:


    +   1. Two packages are installed. When the second package is installed, there
    is a conflict with a file installed by the first package. Therefore, the --replacefiles
    option is used to force RPM to replace the conflicting file with the one from
    the second package.

    +   2. At some point in the future, the second package is erased.

    +   3. The conflicting file is gone!


    Let''s look at an example. First, we install a new package. Next, we take a look
    at a file it installed, noting the size and creation date:


    ```

    # rpm -iv cdp-0.33-2.1386.rpm

    Installing cdp-0.33-2.1386.rpm

    # ls -al /usr/bin/cdp

    -rwxr-x-x 1 root root 34460 Feb 25 14:27 /usr/bin/cdp

    #

    ```


    Next, we try to install a newer release of the same package. It fails:


    ```

    # rpm -iv cdp-0.33-3.1386.rpm

    Installing cdp-0.33-2.1386.rpm

    /usr/bin/cdp conflicts with file from cdp-0.33-2

    error: cdp-0.33-3.1386.rpm cannot be installed

    #

    ```


    So we use --replacefiles to convince the newer package to install. We note that
    the newer package installed a file on top of the file originally installed:


    ```

    # rpm -iv --replacefiles cdp-0.33-3.1386.rpm

    Installing cdp-0.33-3.1386.rpm

    # ls -al /usr/bin/cdp

    -rwxr-x-x 1 root root 34444 Apr 24 22:37 /usr/bin/cdp

    #

    ```


    The original cdp file, 34,460 bytes long and dated February 25, has been replaced
    with a file with the same name but 34,444 bytes long and from April 24. The original
    file is long gone.


    Next, we erased the package we just installed. Finally, we tried to find the file:


    ```

    # rpm -e cdp-0.33-3

    # ls -al /usr/bin/cdp

    ls: /usr/bin/cdp: No such file or directory

    #

    ```


    # **NOTE**


    > *For more information on erasing packages with rpm -e, see Chapter 3.*'
  merge: -1
  img_proc: true
- pgno: 50
  md: "The file is gone because /usr/bin/cdp from the first package was replaced when\
    \ the second package was installed using the --replacefiles option. Then, when\
    \ the second package was erased, the /usr/bin/cdp file was removed since it belonged\
    \ to the second package. If the first package had been erased first, there would\
    \ have been no problem because RPM would have realized that the first package's\
    \ file had already been deleted and would have left the file in place.\n\nThe\
    \ only problem with this state of affairs is that the first package is still installed,\
    \ except for /usr/bin/cdp. So now there's a partially installed package on the\
    \ system. What to do? Perhaps it's time to exercise your newfound knowledge by\
    \ issuing an rpm -i --replacepkgs command to fix up the first package.\n\n# 2.4.5.\
    \ --nodeps: Do Not Check Dependencies Before Installing Package\n\nOne day it'll\
    \ happen. You'll be installing a new package, when suddenly, the install bombs:\n\
    \n```\n# rpm -i blather-7.9-1.1306.rpm\nfailed dependencies:\n        bother >=\
    \ 3.1 is needed by blather-7.9-1\n#\n```\n\nWhat happened? The problem is that\
    \ the package you're reinstalling requires another package to be installed in\
    \ order for it to work properly. In our example, the blather package won't work\
    \ properly unless the bother package (and more specifically, bother version 3.1\
    \ or later) is installed. Since our system doesn't have an appropriate version\
    \ of bother installed at all, RPM aborted the installation of blather.\n\nNow,\
    \ 99 times out of 100, this is exactly the right thing for RPM to do. After all,\
    \ if the package doesn't have everything it needs to work properly, why try to\
    \ install it? Well, as with everything else in life, there are exceptions to the\
    \ rule. And that is why there is a --nodeps option.\n\nAdding the --nodeps option\
    \ to an install command directs RPM to ignore any dependency-related problems\
    \ and to complete the package installation. Going back to our earlier example,\
    \ let's add the --nodeps option to the command line and see what happens:\n\n\
    ```\n# rpm -i --nodeps blather-7.9-1.1306.rpm\n#\n```\n\nThe package was installed\
    \ without a peep. Whether it will work properly is another matter, but it is installed.\
    \ In general, it's not a good idea to use --nodeps to get around dependency problems.\
    \ The package builders included the dependency requirements for a reason, and\
    \ it's best not to second-guess them."
