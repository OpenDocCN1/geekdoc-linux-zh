    # ## 12.2. Other Build-Related Commands


    Two other commands also perform build-related functions. However, they do not
    use the `rpm -b` command syntax we’ve been studying so far. Instead of specifying
    the name of the spec file, as with `rpm -bi`, it’s necessary to specify the name
    of the source package file.


    Why the difference in syntax? The reason has to do with the differing functions
    of these commands. Unlike `rpm -b`, where the name of the game is to get software
    packaged into binary and source package files, these commands use an already-existing
    source package file as input. Let’s take a look at them in the following sections.


    # ### 12.2.1. `rpm --recompile: What Does It Do?`


    The `--recompile` option directs RPM to perform the following steps:


    +   1. Install the specified source package file.

    +   2. Unpack the original sources.

    +   3. Build the software.

    +   4. Install the software.

    +   5. Remove the software’s build directory structure.


    While you might think this sounds a great deal like an install of the source package
    file, followed by an `rpm -bi`, this is not entirely the case. Using `--recompile`,
    the only file required is the source package file. After the software is built
    and installed, the only thing left, other than the newly installed software, is
    the original source package file.'
