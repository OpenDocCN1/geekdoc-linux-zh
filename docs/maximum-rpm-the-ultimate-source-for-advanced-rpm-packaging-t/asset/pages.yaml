- pgno: 345
  md: "# ### 21.2.12.2. rpmFreeSignature()—Free Signature Read by rpmReadPackageInfo()\n\
    \nThis function frees the signature h:\n\n```\n#include <rpm/rpm-lib.h>\n#include\
    \ <rpm/header.h>\n\nvoid rpmFreeSignature(Header h);\n```\n\n# ### 21.2.13. Header\
    \ Manipulation\n\nThe header is one of the key data structures in rpm-lib. The\
    \ functions in this section perform basic manipulations of the header.\n\nThe\
    \ header is actually a data structure. It is not necessary to fully understand\
    \ the actual data structure, but it is necessary to understand the basic concepts\
    \ on which the header is based.\n\nThe header serves as a kind of miniature database.\
    \ It can be searched for specific information, which can then be retrieved easily.\
    \ As in a database, the information contained in the header can be of varying\
    \ sizes.\n\n# #### 21.2.13.1. headerRead()—Read a Header\n\nThis function reads\
    \ a header from file fd, converting it from network byte order to the host system's\
    \ byte order:\n\n```\n#include <rpm/rpm-lib.h>\n#include <rpm/header.h>\n\nHeader\
    \ headerRead(int fd,\n                  int magicp);\n```\n\nIf `magicp` is defined\
    \ to be `HEADER_MAGIC_YES`, `headerRead()` will expect header magic numbers and\
    \ will return an error if they are not present. Likewise, if `magicp` is defined\
    \ to be `HEADER_MAGIC_NO`, `headerRead()` will not check the header's magic numbers\
    \ and will return an error if they are present.\n\nOn error, this function returns\
    \ **NULL**.\n\n# #### 21.2.13.2. headerWrite()—Write a Header\n\nThis function\
    \ writes the header h to the file fd, converting it from host byte order to network\
    \ byte order. If `magicp` is defined to be `HEADER_MAGIC_YES`, `headerWrite()`\
    \ will add the appropriate magic numbers to the header being written. If `magicp`\
    \ is defined to be `HEADER_MAGIC_NO`, `headerWrite()` will not include magic numbers:\n\
    \n```\n#include <rpm/rpm-lib.h>\n#include <rpm/header.h>\n```"
  merge: -1
  img_proc: true
- pgno: 346
  md: "void headerWrite(int fd,\n    Header h,\n    int magicp);\n\n# 21.2.13.3. headerCopy()—Copy\
    \ a Header\n\nThis function returns a copy of header h:\n\n#include <rpm/rpmlib.h>\n\
    #include <rpm/header.h>\n\nHeader headerCopy(Header h);\n\n# 21.2.13.4. headerSizeof()—Calculate\
    \ a Header's Size\n\nThis function returns the number of bytes the header h takes\
    \ up on disk. Note that in versions of RPM prior to 2.3.3, this function also\
    \ changes the location of the data in the header. The result is that pointers\
    \ from headerGetEntry() will no longer be valid. Therefore, any pointers acquired\
    \ before calling headerSizeof() should be discarded:\n\n#include <rpm/rpmlib.h>\n\
    #include <rpm/header.h>\n\nunsigned int headerSizeof(Header h,\n    int magicp);\n\
    \n# 21.2.13.5. headerNew()—Create a New Header\n\nThis function returns a new\
    \ header.\n\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\nHeader headerNew(void);\n\
    \n# 21.2.13.6. headerFree()—Deallocate a Header\n\nThis function deallocates the\
    \ header specified by h:\n\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\
    \nvoid headerFree(Header h);\n\n# 21.2.13.7. headerDump()—Print Header Structure\
    \ in Human-Readable Form\n\nThis function prints the structure of the header h\
    \ to the file f. If the flags parameter is defined to be HEADER_DUMP_INLINE, the\
    \ header's data is also printed:\n\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\
    \nvoid headerDump(Header h,\n    FILE \\*f,\n    int flags);"
