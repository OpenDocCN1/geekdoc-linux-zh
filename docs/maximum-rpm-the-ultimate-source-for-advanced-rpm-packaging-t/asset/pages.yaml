  img_proc: true
- pgno: 264
  md: 'Using the `--sign` option makes it as easy to sign one package as it is to
    sign 100. But what happens if you need to change your public key? Will you need
    to rebuild every single one of your packages just to update the signature? No,
    because there''s an easy way out that we''ll explore in the next section.


    # 17.3.2. `--resign`: Replace a Package''s Signature(s)


    As mentioned at the end of the previous section, from time to time it may be necessary
    to change your public key. Certainly this would be necessary if your key''s security
    were compromised, but other, more mundane situations might require this.


    Fortunately, RPM has an option that permits you to replace the signature on an
    already-built package with a new one. The option is called `--resign`. Here''s
    an example of its use:


    ```

    ```

    # rpm --resign blatther-7.9-1.i386.rpm

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.

    blatther-7.9-1.i386.rpm:

    # ```


    ```


    While the output is not as exciting as a package build, the `--resign` option
    can be a lifesaver if you need to change a package''s signature and you don''t
    want to rebuild.


    As you might have guessed, the `--resign` option works properly on multiple package
    files:


    ```

    ```

    # rpm --resign b*.rpm

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.

    blatther-7.9-1.i386.rpm:

    bothrer-3.5-1.i386.rpm:

    # ```


    ```


    # 17.3.2.1. There Are Limits, However...


    Unfortunately, older package files cannot be re-signed. The package file must
    be in version 3 format, at least. If you attempt to re-sign a package that is
    too old, here''s what you''ll see:


    ```

    ```

    # rpm --resign blah.rpm

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.

    blah.rpm:

    blah.rpm: Can''t re-sign v2.0 RPM

    # ```


    ```


    Not sure what version your package files are in? Just use the `file` command to
    check:


    ```

    ```

    # file blatther-7.9-1.i386.rpm

    blatther-7.9-1.i386.rpm: RPM v3 bin i386 blatther-7.9-1

    # ```


    ```


    The v3 in `file`''s output indicates the package file format.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 17.3.3. `--addsign`: Add a Signature to a Package


    The `--addsign` option, as the name suggests, is used to add another signature
    to the package. It’s pretty easy to see why someone would want to have a package
    that had been signed by the package builders. But what reason would there be for
    adding a signature to a package?


    One reason to have more than one signature on a package would be to provide a
    means of documenting the path of ownership from the package builder to the end
    user.


    As an example, one division of a company creates a package and signs it with the
    division’s key. The company’s headquarters then checks the package’s signature
    and adds the corporate signature to the package, in essence stating that the signed
    package it received is authentic.


    Continuing the example, the doubly signed package makes its way to a retailer.
    The retailer checks the package’s signatures and, when they check out, adds its
    signature to the package.


    The package now makes its way to a company that wants to deploy the package. After
    checking every signature on the package, it knows that it is an authentic copy,
    unchanged since it was first created. Depending on the deploying company’s internal
    controls, it may choose to add its own signature, thereby reassuring its employees
    that the package has received its corporate blessing.


    After this lengthy example, the actual output from the `--addsign` option is a
    bit anticlimactic:


    ```

    ```bash

    # rpm --addsign blather-7.9-1.1386.rpm

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.

    blather-7.9-1.1386.rpm:

    #```


    ```


    If we check the signatures of this package, we’ll be able to see the multiple
    signatures:


    ```

    ```bash

    # rpm --checksig blather-7.9-1.1386.rpm

    blather-7.9-1.1386.rpm: size pgp pgp md5 OK

    #```


    ```


    The two *pgps* in `--checksig`’s output clearly show that the package has been
    signed twice.


    # 17.3.1. A Few Caveats


    As with the `--resign` option, the `--addsign` option cannot do its magic on pre-version
    3 package files:


    ```

    ```bash

    # rpm --addsign blah.rpm

    Enter pass phrase: <passphrase> (Not echoed)


    Pass phrase is good.

    blah.rpm:

    blah.rpm: Can’t re-sign v2.0 RPM

    #```


    ```'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Okay, the error message may not be 100% accurate, but you get the idea. Another
    thing to be aware of is that the `--addsign` option does not check for multiple
    identical signatures. Although it doesn''t make much sense to do so, RPM will
    happily let you add the same signature as many times as you''d like:


    ```

    ```bash

    # rpm --addsign blather-7.9-1.1386.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    Pass phrase is good.

    blather-7.9-1.1386.rpm:

    # rpm --addsign blather-7.9-1.1386.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    Pass phrase is good.

    blather-7.9-1.1386.rpm:

    # rpm --addsig blather-7.9-1.1386.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    Pass phrase is good.

    blather-7.9-1.1386.rpm:

    # rpm --addsig blather-7.9-1.1386.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    Pass phrase is good.

    blather-7.9-1.1386.rpm:

    # rpm --checksig blather-7.9-1.1386.rpm

    blather-7.9-1.1386.rpm: size pgp pgp pgp pgp md5 OK

    #```

    ```


    As you can see from `--checksig`''s output, the package now has four identical
    signatures. Maybe this is the digital equivalent of pressing down extra-hard while
    writing your name.'
