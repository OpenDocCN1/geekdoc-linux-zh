    # 2.4.11. --percent: Not Meant for Human Consumption


    An option that will probably never be very popular is --percent. This option is
    meant to be used by programs that interact with the user, perhaps presenting a
    graphical user interface for RPM. When the --percent option is used, RPM displays
    a series of numbers. Each number is a percentage that indicates how far along
    the install is. When the number reaches 100%, the install is complete. Here’s
    an example:


    ```

    # rpm -i --percent iBCS-1.2-3.l386.rpm

    %f iBCS.1.2-3

    %% 0.002140

    %% 1.492386

    %% 5.296632

    %% 9.310026

    %% 15.271010

    %% 26.217046

    %% 31.216000

    %% 100.000000

    %% 100.000000

    #

    ```


    The list of percentages will vary depending on the number of files in the package,
    but every package ends at 100% when completely installed.


    # 2.4.12. --rcfile <rcfile>: Use <rcfile> As an Alternate rpmrc File


    The --rcfile option is used to specify a file containing default settings for
    RPM. Normally, this option is not needed. By default, RPM uses /etc/rpmrc and
    a file named .rpmdir located in your login directory.


    This option would be used if there were a need to switch between several sets
    of RPM defaults.


    +   - Software developers and package builders will normally be the only people
    using the --rcfile option. For more information on rpmrc files, see Appendix B.


    # 2.4.13. --root <path>: Use <path> As an Alternate Root


    Adding --root <path> to an install command forces RPM to assume that the directory
    specified by <path> is actually the root directory. The --root option affects
    every aspect of the install process, so pre- and postinstall scripts are run with
    <path> as their root directory (using chroot(2)). In addition, RPM expects its
    database to reside in the directory specified by the dpath rpmrc file entry, relative
    to <path>. (For more information on rpmrc file entries, see Appendix B.)'
