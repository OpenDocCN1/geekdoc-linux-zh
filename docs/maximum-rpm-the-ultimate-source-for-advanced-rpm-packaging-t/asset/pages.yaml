- pgno: 223
  md: 'One approach would be to simply create different spec files for each architecture
    or operating system. While it would certainly work, this approach has two problems:


    +   More work. The existence of multiple spec files for a given package means
    that the effort required to make any changes to the package is multiplied by however
    many different spec files there are.


    +   More chance for mistakes. If any work needs to be done to the spec files,
    the fact that they are separate means it is that much easier to forget to make
    the necessary changes to each one. There is also the chance of introducing mistakes
    each time changes are made.


    The other approach is to somehow permit the conditional inclusion of architecture-
    or operating system-specific sections of the spec file. Fortunately, the RPM designers
    chose this approach, and it makes multiplatform package building easier and less
    prone to mistakes.


    We discuss multiplatform package building in depth in Chapter 19. For now, let’s
    take a quick look at RPM’s conditionals.


    # ## 13.8.1. The %{ifarch Conditional}


    The %{ifarch conditional is used to begin a section of the spec file that is architecture
    specific. It is followed by one or more architecture specifiers, each separated
    by commas or whitespace. Here is an example:


    ```

    %ifarch i386 sparc

    ```


    The contents of the spec file following this line would be processed only by Intel
    x86 or Sun SPARC–based systems. However, if only this line were placed in a spec
    file, this is what would happen if a build were attempted:


    ```

    # rpm -ba cdplayer-1.0.spec

    Unclosed ''%if

    Build failed.

    ```


    The problem that surfaced here is that any conditional must be closed by using
    either %{else} or %{endif}. We’ll be covering them a bit later in the chapter.


    # ## 13.8.2. The %{ifnarch Conditional}


    The %{ifnarch conditional is used in a similar fashion to %{ifarch}, except that
    the logic is reversed. If a spec file contains a conditional block starting with
    %{ifarch alpha}, that block would be processed only if the build were being done
    on a Digital Alpha/AXP-based system. However, if the conditional block started
    with %{ifnarch alpha}, that block would be processed only if the build were not
    being done on an Alpha.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Like `%ifarch`, `%ifnarch` can be followed by one or more architectures and
    must be closed by `%else` or `%endif`.


    # 13.8.3. The `%ifos` Conditional


    The `%ifos` conditional is used to control RPM''s spec file processing based on
    the build system''s operating system. It is followed by one or more operating
    system names. A conditional block started with `%ifos` must be closed by `%else`
    or `%endif`. Here''s an example:


    ```

    `%ifos linux`

    ```


    The contents of the spec file following this line would be processed only if the
    build were done on a Linux system.


    # 13.8.4. The `%ifnos` Conditional


    The `%ifnos` conditional is the logical complement to `%ifos`—that is, if a conditional
    starting with the line `%ifnos irix` is present in a spec file, the file contents
    after the `%ifnos` will not be processed if the build system is running Irix.
    As always, a conditional block starting with `%ifnos` must be closed by `%else`
    or `%endif`.


    # 13.8.5. The `%else` Conditional


    The `%else` conditional is placed between an `%if` conditional of some persuasion,
    and an `%endif`. It is used to create two blocks of spec file statements, only
    one of which will be used in any given case. Here''s an example:


    ```

    ```

    %ifarch alpha

    make RPM_OPT_FLAGS="$RPM_OPT_FLAGS -I ."

    %else

    make RPM_OPT_FLAGS="$RPM_OPT_FLAGS"

    %endif

    ```

    ```


    When a build is performed on a Digital Alpha/AXP, some additional flags are added
    to the `make` command. On all other systems, these flags are not added.


    # 13.8.6. The `%endif` Conditional


    A `%endif` is used to end a conditional block of spec file statements. It can
    follow one of the `%if` conditionals, or the `%else`. The `%endif` is always needed
    after a conditional; otherwise the build will fail. Here''s a short conditional
    block, ending with an `%endif`:


    ```

    ```

    %ifarch i386

    make INTELFLLAG=-DINTEL

    %endif

    ```

    ```


    In this example, we see that the conditional block started with an `%ifarch` and
    ended with an `%endif`.'
