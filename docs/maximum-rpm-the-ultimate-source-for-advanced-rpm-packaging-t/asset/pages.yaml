    \ that is, the data is printed at the far right of the output field. We can left-justify\
    \ the field by preceding the field width specification with a dash:\n\n```\n#\
    \ rpm -q --queryformat  '%{NAME}--20{VERSION}-%{RELEASE}\\n'  rpm\n# rpm-2.3\n\
    \         -1\n# \n```\n\nNow the version is printed at the far left of the output\
