  md: 'Notice that the build hostname changed from `porky.redhat.com` to `gorky.redhat.com`.
    Using the `cmp` utility to compare the two files, we find that the difference
    occurs at byte 1201, which changed from `p` (octal 160), to `q` (octal 161):


    ```

    ```

    # cmp -c1 rpm-2.3.1.1386.rpm rpm-2.3.1.1386-bogus.rpm

    1201 160 p  161 q

    #

    ```

    ```


    People versed in octal numbers will note that only one bit has been changed in
    the entire file. That''s the smallest possible change you can make! Let''s see
    how our bogus friend fares:


    ```

    ```

    # rpm -K rpm-2.3.1.1386-bogus.rpm

    rpm-2.3.1.1386-bogus.rpm: size PGP MD5 NOT OK

    #

    ```

    ```


    Given that the command''s output ends with `NOT OK` in big capital letters, it''s
    obvious there''s a problem. Since the word `size` was printed in lowercase, the
    bogus package''s size was okay, which makes sense: We only changed the value of
    one bit, without adding or subtracting anything else.


    However, the PGP signature, printed in uppercase, didn''t verify. This makes sense,
    too. The package that was signed by Red Hat Software has been changed. The fact
    that the package''s MD5 checksum also failed to verify provides further evidence
    that the bogus package is just that: bogus.


    # ### 7.3.5. `--nopgp`: Do Not Verify Any PGP Signatures


    Perhaps you want to be able to verify packages but, for one reason or another,
    you cannot use PGP. Maybe you don''t have a trustworthy source of the necessary
    public keys, or maybe it''s illegal to possess encryption (like PGP) software
    in your country. Is it still possible to verify packages?


    Certainly. In fact, we''ve already done it, in section 7.3.3. You lose the ability
    to verify the package''s origins, as well as some level of confidence in the package''s
    integrity, but the size and MD5 checksums still give some measure of assurance
    as to the package''s state.


    Of course, when PGP can''t be used, the output from a verification always looks
    like something''s wrong:


    ```

    ```

    # rpm -K rpm-2.3.1.1386.rpm

    rpm-2.3.1.1386.rpm: size (PGP) md5 OK (MISSING KEYS)

    #

    ```

    ```


    The `--nopgp` option directs RPM to ignore PGP entirely. If we use the `--nopgp`
    option on the preceding example, we find that things look a whole lot better:


    ```

    ```

    # rpm -K --nopgp rpm-2.3.1.1386.rpm

    rpm-2.3.1.1386.rpm: size md5 OK

    #

    ```

    ```'
