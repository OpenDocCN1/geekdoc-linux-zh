- pgno: 483
  md: '# MAXIMUM


    # RPM™


    # Take your RPM programming skills to the highest level


    From an introduction to software package management to the step-by-step examples
    of the Red Hat Package Manager in daily use, this advanced reference shows you
    how to install and upgrade packages, perform sophisticated RPM database queries,
    and verify your RPM-based system. In addition to covering RPM from the user perspective,
    Maximum RPM tells you how to build your own RPM packages. You’ll learn the right
    way to build RPM packages that are easy to use and maintain.


    Written in close cooperation with Marc Ewing and Erik Troan, the developers of
    the RPM technology, Maximum RPM is the official, definitive technical reference
    to the RPM system. It provides accurate and detailed coverage of RPM’s history,
    philosophy, usage, and internals, from both the user and packager perspectives.


    ![](img/5ceb645f91e0f928013c644127692ba8_483_0.png)


    ![](img/5ceb645f91e0f928013c644127692ba8_483_1.png)


    +   ■ Take a detailed look at the spec file

    +   ■ Discover how to build packages without root access

    +   ■ Understand the philosophy behind RPM

    +   ■ Study the RPM library

    +   ■ Review the available tags for the query format

    +   ■ Use RPM to install, erase, upgrade, and verify packages

    +   ■ Make packages that .can be built anywhere

    +   ■ Create packages for multiple architectures and operating systems

    +   ■ Add dependency information to your packages

    +   ■ Incorporate PGP signatures to your packages

    +   ■ Study the rpm -b command reference

    +   ■ Create relocatable packages


