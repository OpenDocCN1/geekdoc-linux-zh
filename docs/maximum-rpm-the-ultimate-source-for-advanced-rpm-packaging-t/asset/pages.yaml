- pgno: 168
  md: 'Why is it necessary to do all this checking? When would it be useful? Keep
    in mind that the %files list must be generated manually. By using the -bi option,
    the following steps are all that''s necessary to create a %files list:


    +   - Writing the %files list

    +   - Using the -bi option to check the %files list

    +   - Making any necessary changes to the %files list


    It may take more than one iteration through these steps, but eventually the list
    check will pass. Using the -bi option to check the %files list is certainly better
    than starting a two-hour package build, only to find out at the very end that
    the list contains a misspelled filename.


    Here''s an example of the -bi option in action:


    ```

    ```

    # rpm -bi cdp Player -1.0 .spec

    Package: cdp Player

    File List Check: cdp Player -1.0 -1

    Finding dependencies ...

    Requires (2): libc.so.5 libncurses.so.2.0

    #```


    ```


    It''s hard to see exactly what RPM is doing from the output, but if we add -vv,
    we can get a bit more information:


