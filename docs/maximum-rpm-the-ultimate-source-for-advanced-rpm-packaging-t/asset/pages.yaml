    example, the foonly package contains no file called `index`; it''s just a character
    string the package builder chose. This is no different from the following example:


    ```

    # rpm -q --provides libc

    libm.so.5

    libc.so.5

    #

    ```


    While there might be symlinks by those names in /lib, capabilities are a property
    of the package, not a file contained in the package!


