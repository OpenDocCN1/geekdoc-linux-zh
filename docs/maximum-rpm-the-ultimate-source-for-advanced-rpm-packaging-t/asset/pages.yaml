  img_proc: true
- pgno: 62
  md: '+   - There is a line for each file that RPM would have removed, each one ending
    with `would remove` instead of `removing`.


    +   - There is only one line at the end, which states `would remove database entry`,
    versus the multiline output showing the cleanup of the RPM database during an
    actual erase.


    By using `--test` in conjunction with `-vv`, it’s easy to see exactly what RPM
    would do during an actual erase.


    # 3.3.2. --nodeps: Do Not Check Dependencies Before Erasing Package


    It’s likely that one day while erasing a package, you’ll see something like this:


    ```

    `# rpm -e bother`

    `removing these packages would break dependencies:`

    `bother >== 3.1 is needed by blather-7.9-1`

    `#`

    ```


    What happened? The problem is that one or more of the packages installed on your
    system require the package you’re trying to erase. Without it, they won’t work
    properly. In our example, the `blather` package won’t work properly unless the
    `bother` package (and more specifically, `bother` version 3.1 or later) is installed.
    Since we’re trying to erase `bother`, RPM aborted the erasure.


    Now, 99 times out of 100, this is exactly the right thing for RPM to do. After
    all, if the package is needed by other packages, why try to erase it? As with
    everything else in life, there are exceptions to the rule. And that is why there
    is a `--nodeps` option.


    Adding the `--nodeps` options to an erase command directs RPM to ignore any dependency-related
    problems and to erase the package. Going back to our previous example, let’s add
    the `--nodeps` option to the command line and see what happens:


    ```

    `# rpm -e --nodeps bother`

    ```


    The package was erased without a peep. Whether the `blather` package will work
    properly is another matter. In general, it’s not a good idea to use `--nodeps`
    to get around dependency problems. The package builders included the dependency
    requirements for a reason, and it’s best not to second-guess them.


    # 3.3.3. --noscripts: Do Not Execute Pre- and Postuninstall Scripts


    In section 3.2.1 we used the `-vv` option to see what RPM was actually doing when
    it erased a package. We noted that there were two scripts, a preuninstall and
    a postuninstall, that were used to execute commands required during the process
    of erasing a package.'
  merge: -1
  img_proc: true
