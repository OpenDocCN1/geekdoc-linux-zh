- pgno: 183
  md: 'Like the --recompile option, --rebuild cleans up after itself. The only difference
    between the two commands is that --rebuild also creates a binary package file.
    The only remnants of a --rebuild are the original source package, the newly installed
    software, and a new binary package file.


    Package builders find this command especially handy because it allows them to
    create new binary packages using one command, with no additional cleanups required.
    There are two times when --rebuild is normally used:


    +   - When the build environment (for example, compilers, libraries) has changed.

    +   - When binary packages for a different architecture are to be built.


    Here''s an example of the --rebuild option in action:


    ```

    # rpm --rebuild cdplayer-1.0-1.src.rpm

    Installing cdplayer-1.0-1.src.rpm

    * Package: cdplayer

    Executing: %prep

    ...

    + exit 0

    Executing: %build

    ...

    + exit 0

    Executing: %install

    ...

    + exit 0

    Executing: special doc

    ...

    + exit 0

    Binary Packaging: cdplayer-1.0-1

    ...

    Executing: %clean

    ...

    + exit 0

    Executing: sweep

    ...

    + exit 0

    #

    ```


    The very first line shows RPM installing the source package. The lines after that
    are ordinary executions of the %prep, %build, and %install sections of the spec
    file. Next, a binary package file is created. Finally, the spec file''s %clean
    section (if one exists) is executed. The cleanup of the software''s build directory
    takes place, just as if the --clean option had been specified.


    # ### 12.3. Summary


    That completes our overview of the commands used to build packages with RPM. In
    Chapter 13, “Inside the Spec File,” we’ll look at the various macros that are
    available and how they can make life easier for the package builder.'
  merge: -1
  img_proc: true
