- pgno: 131
  md: '+   3. Builds the software.

    +   4. Creates the binary package file.

    +   5. Creates the source package file.

    +   6. Cleans up after itself.


    The neatest part of this is that RPM does all this automatically, under the control
    of the spec file. That’s about all we’re going to say about how RPM builds packages.
    For more information, please see Part II.


    # 8.3.4. Stick with Us!


    As noted several times, we’ll be covering the subject of building packages with
    RPM in Part II. Be forewarned, however: Package building, while straightforward,
    is not a task for people new to programming. But if you’ve written a program or
    two, you’ll probably find RPM’s package building a piece of cake.'
