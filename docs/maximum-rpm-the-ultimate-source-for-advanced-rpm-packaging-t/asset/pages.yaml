    # 21.2.11. Diagnostic Output Control


    The functions in this section are used to control the amount of diagnostic output
    produced by other rpmlib functions. The rpmlib library can produce a wealth of
    diagnostic output, making it easy to see what is going on at any given time.


    There are several different verbosity levels defined in `rpmlib.h`. Their symbolic
    names are in the form `RPMMESS_`xx`, where xx is the name of the verbosity level.
    Note that the numeric values of the verbosity levels increase with a decrease
    in verbosity.


    Unless otherwise set, the default verbosity level is `RPMMESS_NORMAL`.


    # 21.2.11.1. rpmIncreaseVerbosity()—Increase Verbosity Level


    This function is used to increase the current verbosity level by one:


    ```

    ```c

    #include <rpm/rpmlib.h>


    void rpmIncreaseVerbosity(void);

    ```

    ```


    # 21.2.11.2. rpmSetVerbosity()—Set Verbosity Level


    This function is used to set the current verbosity level to `level`. Note that
    no range checking is done to `level`:


    ```

    ```c

    #include <rpm/rpmlib.h>


    void rpmSetVerbosity(int level);

    ```

    ```


    # 21.2.11.3. rpmGetVerbosity()—Return Verbosity Level


    This function returns the current verbosity level:


    ```

    ```c

    #include <rpm/rpmlib.h>


    int rpmGetVerbosity(void);

    ```

    ```


    # 21.2.11.4. rpmIsVerbose()—Check Verbosity Level


    This function checks the current verbosity level and returns `1` if the current
    level is set to `RPMMESS_VERBOSE` or a level of higher verbosity. Otherwise, it
    returns `0`:'
  merge: -1
  img_proc: true
- pgno: 344
  md: "```\n#include <rpm/rpmlib.h>\nint rpmIsVerbose(void);\n```\n\n# 21.2.11.5.\
    \ rpmIsDebug()—Check Debug Level\n\nThis function checks the current verbosity\
    \ level and returns 1 if the current level is set to RPMESS_DEBUG or a level of\
    \ higher verbosity. Otherwise, it returns 0:\n\n```\n#include <rpm/rpmlib.h>\n\
    int rpmIsDebug(void);\n```\n\n# 21.2.12. Signature Verification\n\nThe functions\
    \ in this section deal with the verification of package signatures. A package\
    \ file may contain more than one type of signature. For example, a package may\
    \ contain a signature that contains the package’s size, as well as a signature\
    \ that contains cryptographically derived data that can be used to prove the package’s\
    \ origin.\n\nEach type of signature has its own tag value. These tag values are\
    \ defined in rpmlib.h and are in the form RPMSIGTAG_xxx, where xxx is the type\
    \ of signature.\n\n# 21.2.12.1. rpmVerifySignature()—Verify a Package File’s Signature\n\
    \nThis function verifies the signature of the package pointed to by file. The\
    \ result of the verification is stored in result, in a format suitable for printing:\n\
    \n```\n#include <rpm/rpmlib.h>\n\nint rpmVerifySignature(char *file,\n\tint 32\
    \ sigTag,\n\tvoid *sig,\n\tint count,\n\tchar *result);\n```\n\nThe sigTag parameter\
    \ specifies the type of signature to be checked. The sig parameter specifies the\
    \ signature against which the package is to be verified. The count parameter specifies\
    \ the size of the signature; at present, this parameter is only used for PGP-based\
    \ signatures.\n\nThis function returns the following values:\n\n+   - RPMSIG_OK—The\
    \ signature verified correctly.\n+   - RPMSIG_UNKNOWN—The signature type is unknown.\n\
    +   - RPMSIG_BAD—The signature did not verify correctly.\n+   - RPMSIG_NOKEY—The\
    \ key required to check this signature is not available."
