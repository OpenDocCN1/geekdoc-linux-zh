- pgno: 347
  md: "# ### 21.2.14. Header Entry Manipulation\n\nThe functions in this section provide\
    \ the basic operations necessary to manipulate header entries. The following header\
    \ entry types are currently defined:\n\n+   - `RPM_NULL_TYPE`—This type is not\
    \ used.\n+   - `RPM_CHAR_TYPE`—The entry contains a single character.\n+   - `RPM_INT8_TYPE`—The\
    \ entry contains an 8-bit integer.\n+   - `RPM_INT16_TYPE`—The entry contains\
    \ a 16-bit integer.\n+   - `RPM_INT32_TYPE`—The entry contains a 32-bit integer.\n\
    +   - `RPM_INT64_TYPE`—The entry contains a 64-bit integer.\n+   - `RPM_STRING_TYPE`—The\
    \ entry contains a null-terminated character string.\n+   - `RPM_BIN_TYPE`—The\
    \ entry contains binary data that will not be interpreted by rpmlib.\n+   - `RPM_STRING_ARRAY_TYPE`—The\
    \ entry contains an array of null-terminated strings.\n\n# #### 21.2.14.1. headerGetEntry()—Get\
    \ Entry from Header\n\nThis function retrieves the entry matching tag from header\
    \ h:\n\n```\n```c\n#include <rpmlib.h>\n#include <rpm/header.h>\n\nint headerGetEntry(Header\
    \ h,\n                    int_32 tag,\n                    int_32 *type,\n   \
    \                 void **p,\n                    int_32 *c);\n```\n```\n\nThe\
    \ type of the entry is returned in `type`, a pointer to the data is returned in\
    \ `p`, and the size of the data is returned in `c`. Both `type` and `c` may be\
    \ `NULL`, in which case that data will not be returned. Note that if the entry\
    \ type is `RPM_STRING_ARRAY_TYPE`, you must issue a `free()` on `p` when done\
    \ with the data.\n\nThis function returns 1 on success, and 0 on failure.\n\n\
    # #### 21.2.14.2. headerAddEntry()—Add Entry to Header\n\nThis function adds a\
    \ new entry to the header h:\n\n```\n```c\n#include <rpmlib.h>\n#include <rpm/header.h>\n\
    \nint headerAddEntry(Header h,\n                   int_32 tag,\n             \
    \      int_32 type,\n                   void *p,\n                   int_32 c);\n\
    ```\n```\n\nThe entry's tag is specified by the tag parameter, and the entry's\
    \ type is specified by the type parameter."
  merge: -1
  img_proc: true
- pgno: 348
  md: "The entry's data is pointed to by p, and the size of the data is specified\
    \ by c. This function always returns 1.\n\n> **NOTE**  \n> In versions of RPM\
    \ prior to 2.3.3, headerAddEntry() will only work successfully with headers produced\
    \ by headerCopy() and headerNew(). In particular, headerAddEntry() is not supported\
    \ when used to add entries to a header produced by headerRead(). Later versions\
    \ of RPM lift this restriction.\n\n# 21.2.14.3. headerIsEntry()—Determine if Entry\
    \ Is in Header\n\nThis function returns 1 if an entry with tag tag is present\
    \ in header h. If the tag is not present, this function returns 0:\n\n```\n#include\
    \ <rpm/rpmlib.h>\n#include <rpm/header.h>\n\nint headerIsEntry(Header h,\n\tint_32\
    \ tag);\n```\n\n# 21.2.15. Header Iterator Support\n\nIterators are used as a\
    \ means to step from entry to entry, through an entire header. The functions in\
    \ this section are used to create, use, and free iterators.\n\n# 21.2.15.1. headerInitIterator()—Create\
    \ an Iterator\n\nThis function returns a newly created iterator for the header\
    \ h:\n\n```\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\nHeaderIterator\
    \ headerInitIterator(Header h);\n```\n\n# 21.2.15.2. headerNextIterator()—Step\
    \ to the Next Entry\n\nThis function steps to the next entry in the header specified\
    \ when the iterator iter was created with headerInitIterator():\n\n```\n#include\
