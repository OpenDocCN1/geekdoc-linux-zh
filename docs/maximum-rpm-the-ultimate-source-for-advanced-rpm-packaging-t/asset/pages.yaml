  md: 'providing packages are installed using the same invocation of RPM, the dependency
    checking will succeed. For example, the command `rpm -ihv *.rpm` will properly
    check for dependencies, even if the requiring package ends up being installed
    before the providing package.


    If more than one package is required, they can be added to the *requires* tag,
    one after another, separated by commas and/or spaces. So if package *foo* requires
    packages *bar* and *baz*, the following line will do the trick:


    ```

    requires: bar, baz

    ```


    As long as any version of *bar* and *baz* is installed, *foo*''s dependencies
    will be met.


    # 14.3.1.1. Adding Version Requirements


    When a package has slightly more stringent needs, it’s possible to require certain
    versions of a package. All that’s necessary is to add the desired version number,
    preceded by one of the following comparison operators:


    +   *   `<`      Requires a package with a version less than the specified version.

    +   *   `<=`     Requires a package with a version less than or equal to the specified
    version.

    +   *   `=`      Requires a package with a version equal to the specified version.

    +   *   `>=`     Requires a package with a version greater than or equal to the
    specified version.

    +   *   `>`      Requires a package with a version greater than the specified
    version.


    Continuing with our example, let’s suppose that the required version of package
    *bar* actually needs to be at least 2.7, and that the *baz* package must be version
    2.1—no other version will do. Here’s what the *requires* tag line would look like:


    ```

    requires: bar >= 2.7, baz = 2.1

    ```


    We can get even more specific and require a particular release of a package:


    ```

    requires: bar >= 2.7-4, baz = 2.1-1

    ```


    # 14.3.1.2. When Version Numbers Aren’t Enough


    You might think that with all these features, RPM’s dependency processing can
    handle every conceivable situation. You’d be right, except for the problem of
    version numbers. RPM needs to be able to determine which version numbers are more
    recent than others in order to perform its version comparisons.


    It’s pretty simple to determine that version 1.5 is older than version 1.6. But
    what about 2.01 and 2.1? Or 7.6a and 7.6? There’s no way for RPM to keep up with
    all the different version-numbering schemes in use. But there is a solution; there
    are two, in fact.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 14.3.1.2.1. Solution Number 1: Serial Numbers


    When RPM can’t decipher a package’s version number, it’s time to pull out the
    serial tag. This tag is used to help RPM determine version number ordering. Here’s
    a sample serial tag line:


    ```

    Serial: 42

    ```


    This line indicates that the package has the serial number 42. What does the 42
    mean? Only that this version of the package is older than the same package with
    the serial number 41, but younger than the same package with the serial number
    43. If you think of serial numbers as being nothing more than very simple version
    numbers, you’ll be on the mark.


    In order to direct RPM to look at the serial number instead of the version number
    when doing dependency checking, it’s necessary to append an $ to the end of the
    conditional operator in the requires tag line. So if a package requires package
    foo to have a serial number equal to 42, the following tag line would be used:


    ```

    Requires: foo =S 42

    ```


    If the foo package needs to have a serial number greater than or equal to 42,
    this line would work:


    ```

    Requires: foo >=S 42

    ```


    It might seem that using serial numbers is a lot of extra trouble, and you’re
    right. But there is an alternative.


    # 14.3.1.2.2. Solution Number 2: Just Say No!


    If you have the option between changing the software’s version-numbering scheme
    or using serial numbers in RPM, consider changing the version-numbering scheme.
    Chances are, if RPM can’t figure it out, most of the people using your software
    can’t, either. But in case you aren’t the author of the software you’re packaging,
    and its version numbering scheme is giving RPM fits, the serial tag can help you
    out.


    # 14.3.2. The conflicts Tag


    The conflicts tag is the logical complement to the requires tag. It is used to
    specify which packages conflict with the current package. RPM will not permit
    conflicting packages to be installed unless overridden with the --nodeps option.


    The conflicts tag has the same format as requires. It accepts a real or virtual
    package name and can optionally include version and release specifications or
    a serial number.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 14.3.3. The provides Tag


    Now that you''ve seen how it''s possible to require a package using the requires
    tag, you''re probably expecting that you''ll need to use the provides tag in every
    single package. After all, RPM has to get those package names from somewhere,
    right?


    While it is true that RPM needs to have the package names available, the provides
    tag is normally not required. It would actually be redundant because the RPM database
    already contains the name of every package installed. There''s no need to duplicate
    that information.


    But wait! We said earlier that manual dependency requirements are always represented
    in terms of packages. If RPM doesn''t require the package builder to use the provides
    tag to provide the package name, then what is the provides tag used for?


    # 14.3.3.1. Virtual Packages


    Enter the virtual package. A virtual package is nothing more than a name specified
    with the provides tag. Virtual packages are handy when a package requires a certain
    capability, and that capability can be provided by any one of several packages.
    Here''s an example: In order to work properly, sendmail needs a local delivery
    agent to handle mail delivery. There are a number of different local delivery
    agents available: sendmail1 will work just fine with any of them.


    In this case, it doesn''t make sense to force the use of a particular local delivery
    agent as long as one''s installed, sendmail1''s requirements will have been satisfied.
    So sendmail1''s package builder adds the following line to sendmail1''s spec file:


    ```

    requires: 1da

    ```


    There is no package with that name available, so sendmail1''s requirements must
    be met with a virtual package. The creators of the various local delivery agents
    indicate that their packages satisfy the requirements of the 1da virtual package
    by adding the following line to their packages'' spec files:


    ```

    provides: 1da

    ```


    ![](img/5ceb645f91e0f928013c644127692ba8_233_0.png)


    Now, when sendmail is installed, as long as there is a package installed that
    provides the 1da virtual package, there will be no problem.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 14.4. To Summarize


    RPM’s dependency processing is based on tracking the capabilities a package provides
    and the capabilities a package requires. A package’s requirements can come from
    two places:


    +   Shared library requirements, automatically determined by RPM

    +   * The `requires` tag line, manually added to the package’s spec file


    These requirements can be viewed by using RPM’s `--requires` query option. A specific
    requirement can be viewed by using the `--whatrequires` query option. Both options
    are fully described in Chapter 5, “Getting Information About Packages.”


    The capabilities a package provides can come from three places:


    +   Shared library sonames, automatically determined by RPM

    +   * The `provides` tag line, manually added to the package’s spec file

    +   * The package’s name (and optionally, the version/serial number)


    The first two types of information can be viewed by using RPM’s `--provides` query
    option. A specific capability can be viewed by using the `--whatprovides` query
    option. Both options are fully described in Chapter 5.


    The package name and version are not considered capabilities that are explicitly
    provided. Therefore, if a search using `--provides` or `--whatprovides` comes
    up dry, try simply looking for a package by that name.


    As you’ve probably gathered by now, using manual dependencies requires some level
    of synchronization between packages. This can be tricky, particularly if you’re
    not responsible for both packages. But RPM’s dependency processing can make life
    easier for your users.'
  merge: -1
  img_proc: true
