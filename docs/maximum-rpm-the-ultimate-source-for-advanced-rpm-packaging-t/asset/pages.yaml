- pgno: 368
  md: 'The first 4 bytes (`0000 0388`) are the tag, which is the tag for the package
    name. The next 4 bytes indicate that the data is type 6, or a null-terminated
    string. There’s an offset of 0 in the next 4 bytes, meaning that this tag is first
    in the store. Finally, the last 4 bytes (`0000 0001`) show that the data count
    is 1, which is the only legal value for data of type **STRING**.


    To find the data, we need to take the offset from the start of the first index
    entry in the header (160) and add in the count of index entries (21) multiplied
    by the size of an index entry (10). Doing the math (all the values shown are in
    hex, remember!), we arrive at the offset to the store, hex 370. Since the offset
    for this particular index entry is 0, the data should start at offset 370:


    ```

    `00000370: 7270 6d00 322e 322e 3100 3100 5265 6420 rp m.2.1.1 .Red`

    ```


    Since the data type for this entry is a null-terminated string, we need to keep
    reading bytes until we reach a byte whose numeric value is 0. We find the bytes
    72, 70, 6d, and `00` — a null. Looking at the ASCII display on the right, we find
    that the bytes form the string *rpm*, which is the name of this package.


    Now for a slightly more complicated example. Let’s look at the following index
    entry:


    ```

    `00000250: 0000 0403 0000 0000 0000 0199 0000 0018 .............`

    ```


    Tag 403 means that this entry is a list of filenames. The data type 8, or **STRING
    _ARRAY**, seems to bear this out. From the previous example, we found that the
    data area for the header began at offset 370. Adding the offset to the first filename
    (198) gives us 509. Finally, the count of 18 hex means that there should be 24
    null-terminated strings containing filenames:


    ```

    ```

    00000500: 606e 6974 6462 8a8a 00e2 6269 6e2f 7270 in th .../ bin/rp

    00000510: 6d00 2f6574 632f 7270 6d2f 7500 00 m ./ e t c / r p m c / u s

    ```

    ```


    The byte at offset 509 is `2f` — a slash (/). Reading up to the first null byte,
    we find that the first filename is / bin/rpm, followed by / etc/rpmrc. This continues
    on for 22 more filenames.


    There are many more tags we could decode, but they are all done in the same manner.


