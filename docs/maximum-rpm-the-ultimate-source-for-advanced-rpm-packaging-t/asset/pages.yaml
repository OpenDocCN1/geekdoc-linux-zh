- pgno: 162
  md: 'As discussed in Chapter 10, “The Basics of Developing with RPM,” the spec file
    is one of the inputs to RPM’s build process. It contains the information necessary
    for RPM to perform the build and package the software.


    RPM goes through a number of stages during a build. By specifying that the build
    process is to stop at a certain stage, the package builder can monitor the build’s
    progress, make any changes necessary, and restart the build. Let’s start by looking
    at the various stages that can be specified in a build command.


    # 12.1.1. rpm -bp: Execute %prep


    The command rpm -bp directs RPM to execute the very first step in the build process.


    In the spec file, this step is labeled %prep. Every command in the %prep section
    will be executed when the -bp option is used.


    Here’s a simple %prep section from the spec file we used in Chapter 11, “Building
    Packages: A Simple Example”:


    ```

    %prep

    %setup

    ```


    This %prep section consists of a single %setup macro. When using rpm -bp against
    this spec file, we can see exactly what %setup does:


    ```

    # rpm -bp cdpLayer-1.0.spec

    * Package: cdpLayer

    + umask 022

    + echo Executing: %prep

    Executing: %prep

    + cd /usr/src/redhat/BUILD

    + cd /usr/src/redhat/BUILD

    + rm -rf cdpLayer-1.0

    + gzip -dc /usr/src/redhat/SOURCES/cdpLayer-1.0.tgz

    + tar -xvvf -

    drwxrwxr-x root/users          0 Aug  4 22:30 1996 cdpLayer-1.0/

    -rw-r--r-- root/users      17982 Nov 10 01:10 1995 cdpLayer-1.0/COPYING

    -rw-r--r-- root/users         627 Nov 10 01:10 1995 cdpLayer-1.0/ChangeLog

    ...

    -rw-r--r-- root/users       2806 Nov 10 01:10 1995 cdpLayer-1.0/volume.c

    -rw-r--r-- root/users        1515 Nov 10 01:10 1995 cdpLayer-1.0/volume.h

    + [ 0 -ne 0 ]

    + cd cdpLayer-1.0

    + cd /usr/src/redhat/BUILD/cdpLayer-1.0

    + chown -R root,root .

    + chmod -R a+rX,g-w,o-w .

    + exit 0

    #

    ```


    First, RPM confirms that the cdpLayer package is the subject of this build. Then
    it sets the umask and starts executing the %prep section. At this point, the %setup
    macro is doing its thing. It changes directory into the build area and removes
    any old copies of cdpLayer’s build tree.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Next, %setup unzips the sources and uses tar to create the build tree. We’ve
    removed the complete listing of files, but be prepared to see lots of output if
    the software being packaged is large. Finally, %setup changes directory into cdplayer’s
    build tree and changes ownership and file permissions appropriately. exit 0 signifies
    the end of the %prep section and, therefore, the end of the %setup macro. Because
    we used the -bp option, RPM stopped at this point. Let’s see what RPM left in
    the build area:


    ```

    # cd /usr/src/redhat/BUILD

    # ls -l

    total 1

    drw-xr-x 2 root root 1024 Aug 4 22:30 cdplayer-1.0

    #

    ```


    There’s the top-level directory. Changing directory into cdplayer-1.0, we find
    that the sources are ready to be built:


    ```

    # cd cdplayer-1.0

    # ls -lf

    total 216

    -rw-r--r- 1 root root 17982 Nov 10 1995 COPYING

    -rw-r--r- 1 root root 627 Nov 10 1995 ChangeLog

    ...

    -rw-r--r- 1 root root 2806 Nov 10 1995 volume.c

    -rw-r--r- 1 root root 1515 Nov 10 1995 volume.h

    #

    ```


    We can see that %setup’s chown and chmod commands did what they were supposed
    to—the files are owned by root, with permissions set appropriately.


    If not stopped by the -bp option, the next step in RPM’s build process would be
    to build the software. RPM can also be stopped at the end of the %build section
    in the spec file. This is done by using the -bc option.


    # 12.1.2. rpm -bc: Execute %prep, %build


    When the -bc option is used during a build, RPM stops once the software has been
    built. In terms of the spec file, every command in the %build section will be
    executed. In the following example, we’ve removed the output from the %prep section
    to cut down on the redundant output, but keep in mind that it is executed nonetheless:


    ```

    # rpm -bc cdplayer-1.0.spec

    * Package: cdplayer

    Executing: %prep

    ...

    + exit 0

    Executing: %build

    + cd /usr/src/redhat/BUILD

    + cd cdplayer-1.0

    + make

    gcc -Wall -O2 -c -I/usr/include/ncurses cdp.c

    gcc -Wall -O2 -c -I/usr/include/ncurses color.c

    gcc -Wall -O2 -c -I/usr/include/ncurses display.c

    ```'
