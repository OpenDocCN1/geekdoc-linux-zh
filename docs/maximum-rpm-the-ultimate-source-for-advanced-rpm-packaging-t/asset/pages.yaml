    Package: cdplayer\nFile List Check: cdplayer-1.0-1\nFinding dependencies...\n\
    Requires (2): libc.so.5 lincurses.so.2.0\n# \n```\n```\n\nDone! The moral to this\
    \ story is that using `rpm -bl` and fixing the error it flagged doesn't necessarily\
    \ mean your `%files` list is ready for prime time: Always run it again to make\
    \ sure!\n\n# ### 12.1.7. `--short-circuit:` Force Build to Start at a Particular\
    \ Stage\n\nAlthough it sounds dangerous, the `--short-circuit` option can be your\
    \ friend. This option is used during the initial development of a package. Earlier\
    \ in the chapter, we explored stopping RPM's build process at different stages.\
    \ Using `--short-circuit`, we can start the build process at different stages.\n\
    \nOne time that `--short-circuit` comes in handy is when you're trying to get\
    \ software to build properly. Just think what it would be like-you're hacking\
    \ away at the sources, trying a build, getting an error, and hacking some more\
    \ to fix that error. Without `--short-circuit`, you'd have to do the following:\n\
    \n+   1. Make your change to the sources.\n+   2. Use `tar` to create a new source\
    \ archive.\n+   3. Start a build with something like `rpm -bc`.\n+   4. See another\
    \ bug.\n+   5. Go back to step 1.\n\nPretty cumbersome! Since RPM's build process\
    \ is designed to start with the sources in their original tar file, unless your\
    \ modifications end up in that tar file, they won't be used in the next build.\
    \ (As mentioned in Chapter 10, if the original sources need to be modified, the\
    \ modifications should be kept as a separate set of patches. However, during development,\
    \ it makes more sense to not generate patches every time a change to the original\
    \ source is made.)"
