    | `-a` Verify all installed packages | 6.3.2 |

    | `-g <group>` Verify packages belonging to group <group> | 6.3.5 |


    **Verify-Specific Options**


    | | Section |

    | :--- | :--- |

    | `--noscripts` Do not execute verification script | 6.3.7 |

    | `--nodeps` Do not verify dependencies | 6.3.6 |

    | `--nofiles` Do not verify file attributes | 6.3.8 |


    **General Options**


    | | Section |

    | :--- | :--- |

    | `-v` Display additional information | 6.3.9 |

    | `-vv` Display debugging information | 6.3.10 |

    | `--root <path>` Set alternate root to <path> | 6.3.12 |

    | `--rcfile <rcfile>` Set alternate rpmrc file to <rcfile> | 6.3.13 |

    | `--dbpath <path>` Use <path> to find the RPM database | 6.3.11 |


    # ## 6.1. `rpm -V`: What Does It Do?


    From time to time, it''s necessary to make sure that everything on your system
    is okay. Are you sure the packages you''ve installed are still configured properly?
    Have there been any changes made that you don''t know about? Did you mistakenly
    start a recursive delete in /usr and now you have to assess the damage?


    RPM can help. It can alert you to changes made to any of the files installed by
    RPM. Also, if a package requires capabilities provided by another package, it
    can make sure the other package is installed, too.


    The command `rpm -V` (or `-y`, or `--verify`, which are equivalent) verifies an
    installed package. Before we see how this is done, let''s take a step back and
    look at the big picture.

    Every time a package is installed, upgraded, or erased, the changes are logged
    in RPM''s database. It''s necessary for RPM to keep track of this information;
    otherwise, it wouldn''t be able to perform these operations correctly. You can
    think of the RPM database (and the disk space it'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'consumes) as being the price of admission for the easy package management that
    RPM provides. (Actually, the price is fairly low. For a completely RPM-based Linux
    distribution, it would be unusual to have a database over 5MB.)


    The RPM database reflects the configuration of the system on which it resides.
    When RPM accesses the database to see how files should be manipulated during an
    install, upgrade, or erase, it is using the database as a mirror of the system’s
    configuration.


    However, we can also use the system configuration as a mirror of the RPM database.
    What does this backward view give us? What purpose would be served?


    The purpose would be to see if the system configuration accurately reflects the
    contents of the RPM database. If the system configuration doesn’t match the database,
    we can reach one of two conclusions:


    +   The RPM database has become corrupt. The system configuration is unchanged.

    +   The RPM database is intact. The system configuration has changed.


    While RPM databases occasionally are corrupted, it is a sufficiently rare occurrence
    that the second conclusion is much more likely. So RPM gives us a powerful verification
    tool, essentially for free.


    # 6.1.1. What Does It Verify?


    It would be handy if RPM did nothing more than verify that every file installed
    by a package actually exists on your system. In reality, RPM does much more. It
    makes sure that if a package depends on other packages to provide certain capabilities,
    the necessary packages are, in fact, installed. If the package builder created
    one, RPM will also run a special verification script that can verify aspects of
    the package’s installation that RPM cannot.


    Finally, every file installed by RPM is examined. No fewer than the following
    nine attributes of each file can be checked:


    +   Owner

    +   Group

    +   Mode

    +   MD5 checksum

    +   Size

    +   Major number

    +   Minor number

    +   Symbolic link string

    +   Modification time


    Let’s take a look at each of these attributes and why they are good things to
    check.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 6.1.1.1. File Ownership


    Most operating systems today keep track of each file''s creator. This is done
    primarily for resource accounting. Linux and UNIX also use file ownership to help
    determine access rights to the file. In addition, some files, when executed by
    a user, can temporarily change the user''s ID, normally to a more privileged ID.
    Therefore, any change of file ownership may have far-reaching effects on data
    security and system availability.


    # 6.1.1.2. File Group


    In a similar manner to file ownership, a group specification is attached to each
    file. Primarily used for determining access rights, a file''s group specification
    can also become a user''s group ID, should that user execute the file''s contents.
    Therefore, any changes in a file''s group specification are important and should
    be monitored.


    # 6.1.1.3. File Mode


    Encompassing the file''s permissions, the mode is a set of bits that specifies
    permitted access for the file''s owner, group members, and everyone else. Even
    more important are two additional bits that determine whether a user''s group
    or user ID should be changed if he executes the program contained in the file.
    Since these little bombsbells can let any user become root for the duration of
    the program, it pays to be extra careful with a file''s permissions.


    # 6.1.1.4. MD5 Checksum


    The MD5 checksum of a file is simply a 128-bit number that is mathematically derived
    from the contents of the file. The MD5 algorithm was designed by Ron Rivest, the
    R in the popular RSA public-key encryption algorithm. The MD in MD5 stands for
    *message digest*, which is a pretty accurate description of what it does.


    Unlike literary digests, an MD5 checksum conveys no information about the contents
    of the original file. However, it possesses one unique trait: Any change to the
    file, no matter how small, results in a change to the MD5 checksum. (From a strictly
    theoretical standpoint, this is not entirely true. Using the lingo of cryptologists,
    it is believed to be "computationally infeasible" to find two messages that produce
    the same MD5 checksum.)


    RPM creates MD5 checksums of all files it manipulates, and stores them in its
    database. For all intents and purposes, if one of these files is changed, the
    MD5 checksum will change, and RPM will detect it.


    # 6.1.1.5. File Size


    As if the use of MD5 isn''t enough, RPM also keeps track of file sizes. A difference
    of even 1 byte more or less will not go unnoticed.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 6.1.1.6. Major Number


    Device character and block files possess a major number. The major number is used
    to communicate information to the device driver associated with the special file.
    For instance, under Linux the special files for SCSI disk drives should have a
    major number of 8, while the major number for an IDE disk drive’s special file
    would be 3. As you can imagine, any change to a file’s major number can have disastrous
    effects and is tracked by RPM.


    # 6.1.1.7. Minor Number


    A file’s minor number is similar in concept to the major number, but conveys different
    information to the device driver. In the case of disk drives, this information
    can consist of a unit identifier. If the minor number changes, RPM will detect
    it.


    # 6.1.1.8. Symbolic Link


    If the file in question is really a symbolic link, the text string containing
    the name of the linked-to file is checked.


    # 6.1.1.9. Modification Time


    Most operating systems keep track of the date and time that a file was last modified.
    RPM uses this to its advantage by keeping modification times in its database.


    # 6.2. When Verification Fails: rpm -V Output


    When verifying a package, RPM produces output only if there is a verification
    failure. When a file fails verification, the format of the output is a bit cryptic,
    but it packs all the information you need into one line per file. Here is the
    format:


    ```

    SMD5DLUGT c file

    ```


    In this syntax the following things are true:


    +   - s is the file size.

    +   - m is the file’s mode.

    +   - 5 is the MD5 checksum of the file.

    +   - d is the file’s major and minor numbers.

    +   - l is the file’s symbolic link contents.

    +   - u is owner of the file.

    +   - g is the file’s group.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   m T is the modification time of the file.


    +   m c appears only if the file is a configuration file. This is handy for quickly
    identifying config files, as they are very likely to change, and therefore, very
    unlikely to verify successfully.


    +   m file is the file that failed verification. The complete path is listed to
    make it easy to find.


    It’s unlikely that every file attribute will fail to verify, so each of the eight
    attribute flags will only appear if there is a problem. Otherwise, a . will be
    printed in that flag’s place. Let’s look at an example or two. In this case, the
    mode, MD5 checksum, and modification time for the specified file have failed to
    verify:


    ```

    # rpm -V Xfree86

    _M5,...T /usr/X11R6/lib/X11/fonts/misc/fonts.dir

    #

    ```


    The file is not a config file (note the absence of a c between the attribute list
    and the filename).


    In the following, the size, checksum, and modification time of the system password
    file have all changed:


    ```

    # rpm -V setup

    S.S,...T c /etc/passwd

    #

    ```


    The c indicates that this is a config file.


    This last example illustrates what RPM does when a file that should be there is
    missing entirely:


    ```

    # rpm -V at

    missing /var/spool/at/spool

    #

    ```


    # 6.2.1. Other Verification Failure Messages


    When `rpm -v` finds other problems, the output is a bit easier to understand:


    ```

    # rpm -V blather

    Unsatisfied dependencies for blather-7.9-1: bother >= 3.1

    #

    ```


    It’s pretty easy to see that the blather package requires at least version 3.1
    of the bother package.


    The output from a package’s verification script is a bit harder to categorize
    because the script’s contents, as well as its messages, are entirely up to the
    package builder.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# ## 6.3. Selecting What to Verify and How


    There are several ways to verify packages installed on your system. If you''ve
    taken a look at RPM''s query command, you''ll find that many of them are similar.
    Let''s start with the simplest method of specifying packages: the package label.


    # ### 6.3.1. The Package Label: Verify an Installed Package Against the RPM Database


    You can simply follow the `rpm -v` command with all or part of a package label.
    As with every other RPM command that accepts package labels, you''ll need to carefully
    specify each part of the label you include. Keep in mind that package names are
    case sensitive, so `rpm -V PackageName` and `rpm -v packagename` are not the same.
    Let''s verify the `initscripts` package:


    ```

    ```

    # rpm -v initscripts

    ```


    ```


    Although it looks like RPM didn''t do anything, the following steps were performed:


    +   1. For every file in the package, RPM checked the nine file attributes discussed
    earlier.

    +   2. If the package was built with dependencies, the RPM database was searched
    to ensure that the packages that satisfy those dependencies were installed.

    +   3. If the package was built with a verification script, that script was executed.


    In our example, each of these steps was performed without error\u2014the package
    verified successfully. Remember, with `rpm -v` you''ll only see output if a package
    fails to verify.


    # ### 6.3.2. -a: Verify All Installed Packages Against the RPM Database


    If you add `-a` to `rpm -V`, you can easily verify every installed package on
    your system. It might take a while, but when it''s done, you''ll know exactly
    what''s been changed on your system:


    ```

    ```

    # rpm -Va

    .M5....T   /usr/X11R6/lib/X11/fonts/misc/fonts.dir

    missing    /var/spool/at/.lockfile

    missing    /var/spool/at/spool

    S.S....T   /usr/lib/rhs/glint/icon.pyc

    ..5.....T c /etc/inittab

    ..5.....   /usr/bin/loadkeys

    ```


    ```


    Don''t be too surprised if `rpm -Va` turns up a surprising number of files that
    failed verification. RPM''s verification process is very strict! In many cases,
    the changes flagged don''t indicate problems\u2014they are only an indication
    of your system''s configuration being different from what'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'the builders of the installed packages had on their systems. Also, some attributes
    change during normal system operation. It would be wise to check into each verification
    failure, just to make sure.


    # 6.3.3. -f <file>: Verify the Package Owning <file> Against the RPM Database


    Imagine this: You’re hard at work when a program you’ve used a million times before
    suddenly stops working. What do you do? Well, before using RPM, you probably tried
    to find other files associated with that program and see if they had changed recently.


    Now you can let RPM do at least part of that sleuthing for you. Simply direct
    RPM to verify the package owning the ailing program:


    ```

    % rpm -Vf /sbin/cardmgr

    S.5....T c /etc/sysconfig/pccmca

    %

    ```


    Hmmm. Looks like a config file was recently changed.


    This isn’t to say that using RPM to verify a package will always get you out of
    trouble, but it’s such a quick step that it should be one of the first things
    you try. Here’s an example of rpm -Vf not working out as well:


    ```

    % rpm -Vf /etc/blunder

    file /etc/blunder is not owned by any package

    %

    ```


    Note that the issue surrounding RPM and symbolic links mentioned in Chapter 5,
    “Getting Information About Packages,” also applies to rpm -Vf. Watch those symlinks!


    # 6.3.4. -p <file>: Verify Against a Specific Package File


    Unlike the previous options to rpm -v, each of which verifies one or more packages
    against RPM’s database, the -p option performs the same verification, but against
    a package file. Why on earth would you want to do this when the RPM database is
    sitting there, just waiting to be used?


    Well, what if you didn’t have an RPM database? While it isn’t a common occurrence,
    power failures, hardware problems, and inadvertent deletions (along with nonexistent
    backups) can leave your system sans database. Then your system hicups; what do
    you do now?


    This is where a CD full of package files can be worth its weight in gold. Simply
    mount the CD and verify to your heart’s content:


    ```

    # rpm -Vp /mnt/cdrom/RedHat/RPMS/i386/adaudser-1.1.1.i386.rpm

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Whatever else might be wrong with this system, at least we can add new users.
    But what if you have many packages to verify? It would be a very slow process
    doing it one package at a time. That''s where the next option comes in handy.


    # 6.3.5. `-g <group>`: Verify Packages Belonging to `<group>`


    When a package is built, the package builder must classify the package, grouping
    it with other packages that perform similar functions. RPM gives you the ability
    to verify installed packages based on their groups. For example, there is a group
    known as `shells`. This group consists of packages that contain, strangely enough,
    shells. Let''s verify the proper installation of every shell-related package on
    the system:


    ```

    ```

    # rpm -Vg Shells

    missing /etc/bashrc

    #

    ```

    ```


    One thing to keep in mind is that group specifications are case sensitive. Issuing
    the command `rpm -Vg shells` wouldn''t verify many packages:


    ```

    ```

    # rpm -Vg shells

    group shells does not contain any packages

    #

    ```

    ```


    # 6.3.6. `--nodeps`: Do Not Check Dependencies Before Erasing Package


    When the `--nodeps` option is added to a verify command, RPM will bypass its dependency
    verification processing. In this example, we''ve added the `-vv` option to the
    command line so we can watch RPM at work:


    ```

    ```

    # rpm -Vvv rpm

    D: opening database in /var/lib/rpm/

    D: verifying record number 2341208

    D: dependencies: looking for libz.so.1

    D: dependencies: looking for libdb.so.2

    D: dependencies: looking for libc.so.5

    #

    ```

    ```


    As you can see, the rpm package provides three different capabilities:


    +   * `libz.so.1`

    +   * `libdb.so.2`

    +   * `libc.so.5`


    If we add the `--nodeps` option, the dependency verification of the three capabilities
    is no longer performed:


    ```

    ```

    # rpm -Vvv --nodeps rpm

    D: opening database in /var/lib/rpm/

    D: verifying record number 2341208

    #

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The line D: verifying record number 2341288 indicates that RPM’s normal file-based
    verification proceeded normally.


    # 6.3.7. --noscripts: Do Not Execute Verification Script


    Adding the --noscripts option to a verify command prevents execution of the verification
    scripts of each package being verified. In the following example, the package
    verification script is executed:


    ```

    # rpm -Vvv bother

    D: opening database in ///var/lib/rpm/

    D: verifying record number 616728

    D: verify script found - running from file /var/tmp/rpm-321.vscript

    + PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/X11R6/bin

    + export PATH

    + echo This is the bothe r 3.5 verification script

    This is the bother 3.5 verification script

    #

    ```


    While the actual script is not very interesting, it did execute when the package
    was being verified. In the next example, we’ll use the --noscripts option to prevent
    its execution:


    ```

    # rpm -Vvv --noscripts bother

    D: opening database in ///var/lib/rpm/

    D: verifying record number 616728

    #

    ```


    As expected, the output is identical to the prior example, minus the lines dealing
    with the verification script, of course.


    # 6.3.8. --noifiles: Do Not Verify File Attributes


    The --noifiles option disables RPM’s file-related verification processing. When
    this option is used, only the verification script and dependency verification
    processing are performed. In this example, the package has a file-related verification
    problem:


    ```

    # rpm -Vvv bash

    D: opening database in ///var/lib/rpm/

    D: verifying record number 279448

    D: dependencies: looking for lib.c.so.5

    D: dependencies: looking for libtermcap.so.2

    missing /etc/bashrc

    #

    ```


    When the --noifiles option is added, the missing file doesn’t cause a message
    anymore:


    ```

    # rpm -Vvv --noifiles bash

    D: opening database in ///var/lib/rpm/

    D: verifying record number 279448

    D: dependencies: looking for lib.c.so.5

    D: dependencies: looking for libtermcap.so.2

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'This is not to say that the missing file problem is solved, just that no file
    verification was performed.


    # 6.3.9. -v: Display Additional Information


    Although RPM won’t report an error with the command syntax if you include the
    -v option, you won’t see much in the way of additional output:


    ```

    # rpm -Vv bash

    #

    ```


    Even if there are verification errors, adding -v won’t change the output:


    ```

    # rpm -Vv apmd

    S.5....T /etc/rc.d/init.d/apmd

    S.5....T /usr/X11R6/bin/xapmd

    #

    ```


    The only time that the -v option will produce output is when the package being
    verified has a verification script. Any normal output from the script won’t be
    displayed by RPM when run without -v (note that failure messages will always be
    displayed):


    ```

    # rpm -V bother

    #

    ```


    But when -v is added, the script’s non-error-related output is displayed:


    ```

    # rpm -Vv bother

    This is the bother 3.5 verification script

    #

    ```


    # 6.3.10. -vv: Display Debugging Information


    Sometimes it’s necessary to have even more information than we can get with -v.
    By adding another v, that’s just what we’ll get:


    ```

    # rpm -Vvv rpm

    D: opening database in /var/lib/rpm/

    D: verifying record number 2341208

    D: dependencies: looking for libz.so.1

    D: dependencies: looking for libdb.so.2

    D: dependencies: looking for libc.so.5

    #

    ```


    The lines starting with D: have been added by using -vv. We can see where the
    RPM database is located and what record number contains information on the rpm-2.3-1
    package. Following that is the list of dependencies that the rpm package requires.


    In the vast majority of cases, it will not be necessary to use -vv. It is normally
    used by software engineers working on RPM itself, and the output can change without
    notice. However, it’s a handy way to gain insights into RPM.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# ### 6.3.11. --dbpath <path>: Use <path> to Find an RPM Database


    In order for RPM to do its handiwork, it needs access to an RPM database. Normally,
    this database exists in the directory specified by the rpmlrc file entry, dbpath.
    By default, dbpath is set to /var/lib/rpm. Although the dbpath entry can be modified
    in the appropriate rpmlrc file, the --dbpath option is probably a better choice
    when the database path needs to be changed temporarily. An example of a time the
    --dbpath option would come in handy is when it''s necessary to examine an RPM
    database copied from another system. Granted, it''s not a common occurrence, but
    it''s difficult to handle any other way.


    # ### 6.3.12. --root <path>: Set Alternate Root to <path>


    Adding --root <path> to a verify command forces RPM to assume that the directory
    specified by <path> is actually the root directory. In addition, RPM expects its
    database to reside in the directory specified by the dbpath rpmlrc file entry,
    relative to <path>. (For more information on rpmlrc file entries, see Appendix
    B, "The rpmlrc File.")


    Normally this option is only used during an initial system install or when a system
    has been booted off a rescue disk.


    # ### 6.3.13. --rcfile <rcfile>: Set Alternate rpmlrc File to <rcfile>


    The --rcfile option is used to specify a file containing default settings for
    RPM. Normally, this option is not needed. By default, RPM uses /etc/rpmrc and
    a file named .rpmlrc, located in your login directory.


    This option would be used if there were a need to switch between several sets
    of RPM options. Software developer and package builders will be the people using
    --rcfile. For more information on rpmlrc files, see Appendix B.


    # ## 6.4. We''ve Lied to You


    Not really; we just omitted a few details until you''ve had a chance to see rpm
    -v in action. These details are described in the following sections.


    # ### 6.4.1. RPM Controls What Gets Verified


    Depending on the type of file being verified, RPM will not verify every possible
    attribute. Table 6.2 shows the attributes checked for each of the different file
    types.'
  merge: -1
