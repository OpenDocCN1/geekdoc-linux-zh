- pgno: 370
  md: 'This list is current as of version 2.3 of RPM. For the most up-to-date version,
    look in the file lib/rpmlib.h in the latest version of the RPM sources.


    # A.2.1.3.2. The Archive


    Following the header section is the archive. The archive holds the actual files
    that comprise the package. The archive is compressed using GNU zip. We can verify
    this if we look at the start of the archive:


    ```

    0000040: 0000 001f 8b08 0000 0000 0002 03ec fd7b ............  {

    0000050: 7c13 d516 388e 4e92 691b 4220 010a 1428 ., .8.N.i.J...(

    ```


    In this example, the archive starts at offset 043. According to the contents of
    /usr/lib/magic, the first 2 bytes of a gzipped file should be 1f8b, which is,
    in fact, what we see. The following byte (08) is the flag used by GNU zip to indicate
    the file has been compressed with gzip\''s deflation method. The eighth byte has
    a value of 02, which means that the archive has been compressed using gzip\''s
    maximum compression setting. The following byte contains a code indicating the
    operating system under which the archive was compressed. A 03 in this byte indicates
    the compression ran under a UNIX-like operating system.


    The remainder of the RPM package file is the compressed archive. After the archive
    is uncompressed, it is an ordinary epio archive in SVR4 format with a CRC checksum.


    # A.3. Tools for Studying RPM Files


    In the tools directory packaged with the RPM sources are a number of small programs
    that use the RPM library to extract the various sections of a package file. Normally
    used by the RPM developers for debugging purposes, these tools can also be used
    to make it easier to understand the RPM package file format. Here is a list of
    the programs and what they do:


    +   rpmlead—Extracts the lead section from a package file

    +   rpmsignature—Extracts the signature section from a package file

    +   rpmheader—Extracts the header from a package file

    +   rpmar chive—Extracts the archive from a package file

    +   dump—Displays a header structure in an easily readable format


    The first four programs take an RPM package file as their input. The package file
    can be read either from standard input or by including the filename on the command
    line. In either case, the programs write to standard output. Here is how rpmlead
    can be used to display the lead from a package file:


    ```

    $ rpmlead foo.rpm | od -x

    0000000 abed dbee 0003 0000 0100 7072 2d6d 2e32

    0000020 2e32 2d31 0331 0000 0000 0000 0000 0000

    0000040 0000 0000 0000 0000 0000 0000 0000 0000

    ```'
  merge: -1
  img_proc: true
