- pgno: 96
  md: '# # 5.2.5. `--rcfile` `<rcfile>`: Use `<rcfile>` As an Alternate rpmtc File


    The `--rcfile` option is used to specify a file containing default settings for
    RPM. Normally, this option is not needed. By default, RPM uses /etc/rpmrc and
    a file named .rpmrc, located in your login directory.


    This option would be used if there were a need to switch between several sets
    of RPM options. Software developers and package builders will be the people using
    `--rcfile`. For more information on `rpmrc` files, see Appendix B, “The `rpmrc`
    Files”


    # # 5.2.6. `--dbpath` `<path>`: Use `<path>` to Find an RPM Database


    In order for RPM to do its work, it needs access to an RPM database. Normally,
    this database exists in the directory specified by the `rpmrc` file entry `dbpath`.
    By default, `dbpath` is set to /var/lib/rpm.


    Although the `dbpath` entry can be modified in the appropriate `rpmrc` file, the
    `--dbpath` option is probably a better choice when the database path needs to
    be changed temporarily. An example of a time when the `--dbpath` option would
    come in handy is when it’s necessary to examine an RPM database copied from another
    system. Granted, it’s not a common occurrence, but it’s difficult to handle any
    other way.


    # # 5.3. A Few Handy Queries


    The following sections describe some examples of situations you might find yourself
    in, and ways you can use RPM to get the information you need. Keep in mind that
    these are just examples! Don’t be afraid to experiment!


    # ## 5.3.1. Finding Config Files Based on a Program Name


    You’re setting up a new system, and you’d like to implement some systemwide aliases
    for people using the Bourne again shell, `bash`. The problem is you just can’t
    remember the name of the systemwide initialization file used by `bash`, or where
    it resides:


    ```

    # rpm -qcf /bin/bash

    /etc/bashrc

    #

    ```


    Rather than spend your time trying to hunt down the file, RPM finds it for you
    in seconds.'
  merge: -1
