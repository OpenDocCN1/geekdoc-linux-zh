    # After executing the %prep, %build, and %install sections and handling any special
    documentation files, RPM creates a binary package file. In the sample output,
    we see that first RPM performs automatic dependency checking. It does this by
    determining which shared libraries are required by the executable programs contained
    in the package. Next, RPM actually archives the files to be packaged, optionally
    signs the package file, and outputs the finished product.

    The last part of RPM''s output looks suspiciously like a section in the spec file
    being executed. In our example, there is no %clean section. If there were, however,
    RPM would have executed any commands in the section. In the absence of a %clean
    section, RPM simply issues the usual cd commands and exits normally.


    # ### 12.1.5. rpm -ba: Execute %prep, %build, %install, Package (bin, src)


    The -ba option directs RPM to perform all the stages in building a package. With
    this one command, RPM does the following:


    +   1. Unpacks the original sources.

    +   2. Applies patches (if desired).

    +   3. Builds the software.

    +   4. Installs the software.

    +   5. Creates the binary package file.

    +   6. Creates the source package file.'
