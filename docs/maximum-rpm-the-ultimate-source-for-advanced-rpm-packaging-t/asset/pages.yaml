- pgno: 51
  md: '2.4.6. --force: The Big Hammer


    Adding --force to an install command is a way of saying "Install it anyway!" In
    essence, it adds --replacepkgs and --replacefiles to the command. Like a big hammer,
    --force is an irresistible force (no pun intended) that makes things happen. In
    fact, the only thing that will prevent an install from proceeding when --force
    is used is a dependency conflict.


    And as with a big hammer, it pays to fully understand why you need to use --force
    before actually using it.


    2.4.7. --excludedocs: Do Not Install Documentation for This Package


    RPM has a number of good features. One of them is that RPM classifies the files
    it installs into one of three categories:


    +     Config files


    +     Files containing documentation


    +     All other files


    RPM uses the --excludedocs option to prevent files classified as documentation
    from being installed. In the following example, we know that the package contains
    documentation, specifically, the man page /usr/man/man1/cdp.1. Let''s see how
    --excludedocs keeps it from being installed:


    ```

    # rpm -iv --excludedocs cdp-0.33-3.i386.rpm

    Installing cdp-0.33-3.i386.rpm

    # ls -al /usr/man/man1/cdp.1

    ls: /usr/man/man1/cdp.1: No such file or directory

    #

    ```


    The primary reason to use --excludedocs is to save disk space. The savings can
    be sizable. For example, on an RPM-installed Linux system, there can be more than
    5,000 documentation files, using nearly 50MB.


    If you like, you can make --excludedocs the default for all installs. To do this,
    simply add the following line to /etc/rpmrc, .rpmrc in your login directory, or
    the file specified with the --rcfile option:


    ```

    excludedocs: 1

    ```


    After that, every time an rpm -i command is run, it will not install any documentation
    files. For more information on rpmrc files, see Appendix B, “The rpmrc File.”'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# ### 2.4.8. --includedocs: Install Documentation for This Package\n\nAs the\
    \ name implies, `--includedocs` directs RPM to install any files marked as being\
    \ documentation. This option is normally not required, unless the `rpmrc` file\
    \ entry `excludedocs: 1` is included in the referenced `rpmrc` file. Here's an\
    \ example. Note that in this example, `/etc/rpmrc` contains `excludedocs: 1`,\
    \ which directs RPM not to install documentation files:\n\n```\n```text\n# ls\
    \ /usr/man/man1/cdp.1\nls: /usr/man/man1/cdp.1: No such file or directory\n# rpm\
    \ -iv cdp-0.33-3.i386.rpm\nInstalling cdp-0.33-3.i386.rpm\n# ls /usr/man/man1/cdp.1\n\
    ls: /usr/man/man1/cdp.1: No such file or directory\n#```\n```\n\nHere we've checked\
    \ to make sure that the `cdp` man page did not previously exist on the system.\
    \ Then after installing the `cdp` package, we find that the `excludedocs: 1` in\
    \ `/etc/rpmrc` did its job: The man page wasn't installed. Let's try it again,\
    \ this time adding the `--includedocs` option:\n\n```\n```text\n# ls /usr/man/man1/cdp.1\n\
    ls: /usr/man/man1/cdp.1: No such file or directory\n# rpm -iv --includedocs cdp-0.33-3.i386.rpm\n\
    Installing cdp-0.33-3.i386.rpm\n# ls /usr/man/man1/cdp.1\n-rw-r--r-- 1 root root\
