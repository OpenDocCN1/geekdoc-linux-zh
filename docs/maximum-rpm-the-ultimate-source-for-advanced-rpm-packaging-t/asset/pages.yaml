    requirements are always represented in terms of packages. For example, if package
    foo requires that package bar is installed, it’s only necessary to add the following
    line to foo’s spec file:


    ```

    Requires: bar

    ```


    Later, when the foo package is being installed, RPM will consider foo’s dependency
    requirements met if any version of package bar is already installed. As long as
    the requiring and the'
