    # 8.3.1. A Gentle Introduction to Source Code


    This package file contains not the executable, or binary, files that a normal
    package contains, but rather the source files required to create those binaries.
    When a programmer creates a new program, he writes the instructions, often called
    code, in one or more files. The source code is then compiled into a binary that
    can be executed by the computer.


    As part of the process of building package files (a process covered in great detail
    in Part II), two types of package files are created:


    +   * The binary, or executable, package file

    +   * The source package file


    The source package contains everything needed to re-create not only the programs
    and associated files that are contained in the binary package file, but the binary
    and source package files themselves.


    # 8.3.2. Do You Really Need More Information Than This?


    The following discussion is going to get rather technical. Unless you’re the type
    of person who likes to modify other people’s code, chances are you won’t need
    much more information than this. But if you’re still interested, let’s explore
    further.


    # 8.3.3. So What Can I Do with It?


    One thing you can do with source package files is install them. Let’s try an install
    of a source package:


    ```

    # rpm -i cdp-0.33-3.src.rpm

    #

    ```


    Well, that doesn’t tell us very much and (take our word for it) adding -v doesn’t
    improve the situation appreciably. Let’s haul out the big guns and try -vv:


    ```

    # rpm -ivv cdp-0.33-3.src.rpm

    D: installing cdp-0.33-3.src.rpm

    Installing cdp-0.33-3.src.rpm

    D: package is a source package major = 2

    D: installing a source package

    D: sources in: /usr/src/redhat/SOURCES

    ```'
