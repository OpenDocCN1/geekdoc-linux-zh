- pgno: 439
  md: 'Assuming you’re not the curious type and haven’t flipped your way back here,
    you are probably here looking for some information on the program known as Pretty
    Good Privacy, or PGP.


    # # G.1. PGP: Privacy for Regular People


    PGP, or Pretty Good Privacy, is a program that is intended to help make electronic
    mail more secure. It does this by using a sophisticated technique known as public
    key encryption.


    If you find yourself wondering what electronic mail and making information unreadable
    by spies has to do with RPM, you have a good point. However, although PGP’s claim
    to fame is the handling of e-mail in total privacy, it has some other tricks up
    its sleeve.


    # ## G.1.1. Keys Your Locksmith Wouldn’t Understand


    As mentioned earlier, PGP uses public key encryption to do some of its magic.
    You might guess from the name that this type of encryption involves keys of some
    sort. But, as you might imagine, these are not keys that you can copy at the local
    hardware store. They are numbers—really large numbers. Here’s what a key might
    look like (when we say that keys are numbers, we aren’t lying even though the
    sample key doesn’t look like a number; it has been processed so that it can be
    concisely displayed using only printable characters):


    ```

    ```text

    -----BEGIN PGP PUBLIC KEY BLOCK-----

    Version: 2.6.2


    moCNAzEpXjUA AEAAEAGA/V9oUS1dc9wIge8hM6geRDGCLzmfiYoAho8KDJSrcmi

    F9qTqPgfrfj726QwPl1sBbQY7sy2m9y21gm5hPKDfni8wWYTFStyxr8ygbsLRc1TP

    xuHvHtInfr72NL0Svp1LdW0me0y0OqJgndhDQMzF5g4aVc6g6PHlOp5AAAUr

    tCpSZWqgSGF0iFVnX2nR3KXJJLCBJbmMuMu1OJZwRYRcXAAcmKva6GfLMmvb7aFAFUD

    BRAXcBxcK02U1ux62EBAQOaJaf6mMuewH3wcngSoAzVremvy3V0C61YMVEZC9

    SMwOKxRke7RpD/WJAzQ2bm+<OpjXGtMqbNyVm8Ax/dRh-pelOGaVhQMXL7x1IS

    axFDcvLNAHQ5PAP/7a4QyCuoDxKFQpJN/TIjgKRPr7k6FM/ameRuZSQb#BHHWEH

    51KZ155eP1AkbBJwx25T9hvduz2/9/rxJQnuW/FcxJGh2+7yLzmz2Tx7qTE0L

    82z9JUNFS9+A9/1ClMBYwdPl4/+DzVdwjBJcnnOJ3/4CvD2Y19U4SPzmWf1AtAJUD

    BfAX9N6UXG0X+IyM0cSUA8DWAf9/9-JV9FQFw6yJUAv5nu1wVL7yW4u1wu/FStgCQM

    1dKXdJodOArUvX1U6W6wm6BESec0ogO1JW7/Wa3B89Y21TOEwhFQPQaDOZQPO

    fXQXGu1duLaUwnY1YaraswXcsb5vv/7gTfWTLPLwWcMgg2jCDf2UHZ11NADhTse9

    hr7eHyAQgWQdBe6e61/Nc6g1pInogAKdE83BC8wEIAONNDDGXlxJ5EZGtc1XMvyf0

    vmmKUx/srvE1ju007Xu1HA4k7qcSSG14eUwuYW6WstXWR3xzX/Y1pG1MLT21ZT@0

    wwwfQ8M7ek+KX8mN71cwakqj1/1pP4E47wkKLt84KAz64iEyc6EcVc2eVcNgr/H7OEB

    jo4D/ib1f1cZVTAS0QHeWoj1/RrXWz0HvVvngw2R1Jgdn3sZuOXB1/1bBV32crHr

    NyyqwfCTcgORHNpArXxdA27sda8/r7hVHLacRSjKa5uTgOTK0T01FVb4XmcY

    HZR2QwS8tBeK6zBsUK47A6uhwT/6VkBoWx9kPnBW+LPxkM4

    --pwq

    -----END PGP PUBLIC KEY BLOCK-----

    ```

    ```


    PGP uses two different types of keys: public and private. The **public key**,
    as its name suggests, can be shared with anyone. The key shown above is, in fact,
    a public key. The *private key*, as its name suggests, should be kept a secret.
    PGP creates keys in pairs—one private and one public. A key pair must remain a
    pair; if one is lost, the other by itself is useless. Why? Because the two keys
    have an interesting property that can be exploited in two ways:'
  merge: -1
  img_proc: true
- pgno: 440
  md: '+   A message encrypted by a given public key can only be decrypted with the
    corresponding private key.


    +   A message encrypted by a given private key can only be decrypted with the
    corresponding public key.


    In the case of sending messages in total privacy, the key pairs are used in the
    first manner. It allows two people to exchange private messages without first
    exchanging any "secret codes." The only requirement is that each know the other''s
    public key.


    However, for RPM, the second method is the important one. Let''s say a company
    needs to send you a document and you''d like to make sure it really did come from
    them. If the company first encrypted the file with its private key and sent it
    to you, you would have an encrypted file you couldn''t read.


    Or could you? If you have the company''s public key, you should be able to decrypt
    it. In fact, if you can''t, you can be sure that the message you received did
    not come from them! (Or at least that it didn''t make it to you unchanged.)


    It is this feature that is used by RPM. By using PGP''s public key encryption,
    it is possible to not only prove that a package file came from a certain person
    or persons, but also that it was not changed somewhere along the line.


    # G.1.2. Are RPM Packages Encrypted?


    In a word, no. Rather than being encrypted, RPM package files possess digital
    signatures. This is a way of using encryption to attach a signature (again, basically
    a large number) to some information, such that


    +   The signature cannot be separated from the information. Any attempt to verify
    the signature against any other information will fail.


    +   The signature can only be produced by one private key.


    In the case of RPM, the information being signed is the contents of the .rpm file
    itself.


    A digital signature is just like a regular signature. It doesn''t obscure the
    contents of the document being signed; it just provides a method of determining
    the authenticity of a document. Here is an example of a digital signature turned
    into printable text:


    ```

    ---BEGIN PGP SIGNATURE---

    Version: 2.6.3a

    Charset: nocov


    iOQVAwUBMlXVGMF1a2ndXhZJZAQFe4AQZoZFrHdH8o+zkIVcl/4ABg4gfE7G0G0xE

    Z2J9GWD2Z2i4tG+s1+IWEY6Ae17Kx925JkrfzF4T1ZupAwTn2Pnb/x0GBWJ0VKQzP

    mzC+dXnAaYcQF2B1IuAFVLchYeWj1PqxqxGweGcTjQIrpzrmG6x7XzzK0juS+6V

    rNL0T+0SwOdA=

    =TGmC

    ---END PGP SIGNATURE---

    ```'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# G.1.3. Do All RPM Packages Have Digital Signatures?


    Again, no. In a perfect world, every .rpm file would be signed. However, RPM has
    no formal requirement that this be the case. There is also no requirement that
    you do anything special with a signed .rpm file. Think of it as an extra feature
    that you can take advantage of, or not—it''s strictly your choice.


    # G.1.4. So Much to Cover, So Little Time


    PGP has a wealth of features, 99% of which we will not cover in this book. For
    more information on the basics of encryption, see Applied Cryptography, by Bruce
    Schneier, which contains a wealth of information on the subject. For more details
    on GPG specifically, O''Reilly''s PGP: Pretty Good Privacy by Simson Garfinkel
    is an excellent reference.


    If you''d rather surf the Net, use your favorite World Wide Web index to hunt
    for crypto or PGP, and you''ll be in business.


    # G.2. Installing PGP for RPM''s Use


    To use RPM''s PGP-related capabilities, you''ll need to have PGP installed on
    your system. If it''s installed already, you should be able to flip to the chapters
    on verifying package signatures and signing packages and be in business in a matter
    of minutes. Otherwise, read on for a thumb-nail sketch of what''s required to
    install PGP.


    # G.2.1. Obtaining PGP


    The first step in being able to verify .rpm files is to get a copy of PGP. Unfortunately,
    this is not quite as simple as it might sound. The reason is that PGP is very
    controversial stuff.


    Why the controversy? It centers on PGP''s primary mission: to provide a means
    of communicating with others in complete privacy. As we''ve discussed, PGP uses
    encryption to provide this privacy. Good encryption. Very good encryption. Encryption
    so good, it appears that some of the world''s governments consider PGP a threat
    to their national security.


    # G.2.1.1. Know Your Laws!


    Various countries have differing stands on the use of "strong encryption" products
    such as PGP. In some countries, possession of encryption software is strictly
    forbidden. Other countries attempt to control the flow of encryption technology
    into (or out of) their countries. It is vital that you know your country''s laws,
    lest you find yourself in prison, or possibly in front of a firing squad!'
  merge: -1
  img_proc: true
- pgno: 442
  md: "# G.2.1.2. Patent/Licensing Issues Surrounding PGP\n\nOver and above PGP's\
    \ legal status, there are other aspects to PGP that people living in the U.S.\
    \ and Canada should keep in mind:\n\n+   PGP is free—for noncommercial use only.\
    \ If you are going to use PGP for business purposes, you should look into getting\
    \ a commercial copy. PGP is marketed in the United States by\n+   \n+   Pretty\
    \ Good Privacy, Inc.\n+   \n+   2121 S. El Camino Real\n+   \n+   Suite 902\n\
    +   \n+   San Mateo, CA 94403\n+   \n+   Phone: 415-572-0430\n+   \n+   Fax: 415-572-1932\n\
    +   \n+   http://www.pgp.com/\n\n+   Part of the software that comprises PGP is\
    \ protected by several U.S. patents. Versions of PGP approved for use in the United\
    \ States contain a licensed version of this software, known as RSAREF, which includes\
    \ a patent license that allows the use of the software in noncommercial settings\
    \ only. Commercial use of the technology contained in RSAREF requires a separate\
    \ license. This is one reason there are restrictions on the commercial use of\
    \ PGP in the United States or Canada.\n+   \n+   While people outside the United\
    \ States and Canada can use RSAREF-based PGP, they will probably choose the so-called\
    \ international version. This version replaces RSAREF with software known as MPILIB.\
    \ MPILIB is, in general, faster than RSAREF, but it cannot legally be used in\
    \ the United States or Canada.\n\nTo summarize, if you are using PGP for commercial\
    \ purposes in the United States or Canada, you'll need to purchase it. Otherwise,\
    \ people living in the United States or Canada should use a version of PGP incorporating\
    \ RSAREF. People in other countries can use any version of PGP they desire, although\
    \ they'll probably choose the MPILIB-based international version. (Note that there\
    \ are no commercial restrictions regarding PGP in countries other than the United\
    \ States and Canada.)\n\n# G.2.1.3. Getting RSAREF-Based PGP\n\nThe official source\
    \ for the latest version of PGP based on RSAREF is the Massachusetts Institute\
    \ of Technology. Due to the restrictions on the export of encryption technology,\
    \ the process is somewhat convoluted. The easiest way to obtain PGP from the official\
    \ MIT archive is to use the World Wide Web. Point your Web browser to\n\nhttp://web.mit.edu/network/pgp.html\n\
    \nSimply follow the steps, and you'll have the necessary software on your system\
    \ in no time."
  merge: -1
  img_proc: true
- pgno: 443
  md: 'There is a more cumbersome method that doesn''t use the Web. It involves first
    using anonymous FTP to obtain several files of instructions and license agreements.
    You will then be directed to use telnet to obtain the name of a temporary FTP
    directory containing the PGP software. Finally, you can use anonymous FTP to retrieve
    the software. To start this process, FTP to *net-dist.mit.edu* and then change
    the directory to /pub/PGP.


    Obtain a copy of the file **README** and follow the instructions in it exactly.


    If all this seems like too much trouble, there is another alternative. You can
    find copies of PGP on just about any BBS, FTP, or Web site advertising freely
    available software. Be aware, however, that Floyd''s Storm Door and BBS Company
    may not be as trustworthy a place as MIT to obtain encryption software. It''s
    really a question of how paranoid you are.


    # G.2.1.4. Outside the United States and Canada


    For people living in other countries, it is much easier to find PGP (depending
    on the legality of encryption software, of course). Try any of the places you''d
    normally look for free software. Keep in mind, however, that you shouldn''t download
    PGP from any sites in the U.S. Doing so is considered an "export" of munitions,
    and can get the people responsible for the site in deep trouble. Wherever you
    eventually get PGP, since the patents that complicate matters for the United States
    do not apply abroad, you''ll probably end up with the international version of
    PGP.


    # G.2.2. Building PGP


    Building PGP is mostly a matter of following instructions. However, users of ELF-based
    Linux distributions (such as Red Hat Linux) will find that PGP will not build.
    The problem, according to the PGP FAQ, is that two files do not properly handle
    the C preprocessor directives that affect support for ELF. The changes are to
    two files: **80386.S** and **zmatch.S**. Near the beginning of each, you''ll find
    either an #ifndef or an #iddef for SY5V. If you find


    ```

    ```c

    #ifndef SYSS

    ```

    ```


    it should be changed to read


    ```

    ```c

    #if !defined(SYSV) && defined(_ELF_)

    ```

    ```


    If you find


    ```

    ```c

    #endif SYSS

    ```

    ```


    it should be changed to read


    ```

    ```c

    #if defined(SYSV) || defined(_ELF__)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 444
  md: 'After you make these changes, PGP should build with no problems.


    # ## G.2.3. Ready to Go!


    After building and installing PGP, you’re ready to start using RPM’s package-signature
    capabilities. If your primary interest is in checking the signatures on packages
    built by someone else, see Chapter 7, “Using RPM to Verify Package Files,” which
    will tell you everything you need to know.


    On the other hand, if you are a package builder and would like to start signing
    packages, see Chapter 17, “Adding PGP Signatures to a Package,” and it will have
    you signing packages in no time.'
  merge: -1
  img_proc: true
