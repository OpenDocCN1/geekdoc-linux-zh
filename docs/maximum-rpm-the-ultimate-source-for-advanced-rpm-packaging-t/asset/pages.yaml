- pgno: 185
  md: 'In this chapter, we’re going to cover the spec file in detail. There are a
    number of different types of entries that comprise a spec file, and every one
    will be documented here. The different types of entries are


    +   - Comments—Human-readable notes ignored by RPM.

    +   - Tags—Data definitions.

    +   - Scripts—A set of commands to be executed at specific times.

    +   - Macros—A method of executing multiple commands easily.

    +   - The %files list—A list of files to be included in the package.

    +   - Directives—Used in the %files list to direct RPM to handle certain files
    in a specific way.

    +   - Conditionals—Permit operating system— or architecture-specific preprocessing
    of the spec file.


    Let’s start by looking at comments.


    # ## 13.1. Comments: Notes Ignored by RPM


    Comments are a way to make RPM ignore a line in the spec file. The contents of
    a comment line are entirely up to the person writing the spec file.


    To create a comment, enter an pound sign (#) at the start of the line. Any text
    following the comment character will be ignored by RPM. Here’s an example of a
    comment:


    ```

    # This is the spec file for playmidi 2.3...

    ```


    Comments can be placed in any section of the spec file.


    # ## 13.2. Tags: Data Definitions


    Looking at a spec file, the first thing you’ll see are a number of lines, all
    following the same basic format:


    ```

    <something>: <something-else>

    ```


    *<something>* is known as a *tag* because it is used by RPM to name or tag some
    data. The tag is separated from its associated data by a colon. The data is represented
    by *<something-else>*. Tags are grouped together at the top of the spec file,
    in a section known as the *preamble*. Here’s an example of a tag and its data:


    Vendor: White Socks Software, Inc.


    In this example, the tag is *Vendor*. Tags are not case sensitive—they may be
    all uppercase, all lowercase, or anything in between. The *Vendor* tag is used
    to define the name of the organization'
  merge: -1
  img_proc: true
- pgno: 186
  md: "producing the package. The data in this example is White Socks Software, Inc..\
    \ Therefore, RPM will store White Socks Software, Inc. as the vendor of the package.\n\
    \nNote also that spacing between the tag, the colon, and the data is unimportant.\
    \ Given this, and the case insensitivity of the tag, each of the following lines\
    \ is equivalent to the previous example:\n\nVendOr : White Socks Software, Inc.\
    \ \n\nvendor:White Socks Software, Inc. \n\nVENDOR : White Socks Software, Inc.\n\
    \nThe bottom line is that you can make tag lines as neat or as ugly as you like—RPM\
    \ won't mind either way. Note, however, that the tag's data might need to be formatted\
    \ in a particular fashion. If there are any such restrictions, we'll mention them.\
    \ The following sections group together tags of similar functions for easier reference,\
    \ starting with the tags used to create the package name.\n\n# 13.2.1. Package\
    \ Naming Tags\n\nThe following tags are used by RPM to produce the package's final\
    \ name. Since the name is always in this format:\n\n```\n<name>-<version>-<release>\n\
    ```\n\nit's only natural that the three tags are known as name, version, and release.\n\
    \n# 13.2.1.1. The name Tag\n\nThe name tag is used to define the name of the software\
    \ being packaged. In most (if not all) cases, the name used for a package should\
    \ be identical in spelling and case to the software being packaged. The name cannot\
    \ contain any whitespace: If it does, RPM will only use the first part of the\
    \ name (up to the first space). Therefore, if the name of the software being packaged\
    \ is cdplayer, the name tag should be something like this:\n\n```\nName: cdplayer\n\
    ```\n\n# 13.2.1.2. The version Tag\n\nThe version tag defines the version of the\
    \ software being packaged. The version specified should be as close as possible\
    \ to the format of the original software's version. In most cases, there should\
    \ be no problem specifying the version just as the software's original developer\
    \ did. However, there is a restriction: There can be no dashes in the version.\
    \ If you forget, RPM will remind you:\n\n```\n# rpm -ba cdplayer-1.0.spec\nPackage:\
    \ cdplayer\nIllegal '-' char in version: 1.0-a\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Spaces in the version will also cause problems, in that anything after the
    first space will be ignored by RPM. The bottom line is that you should stick with
    alphanumeric characters and periods, and you’ll never have to worry about it.
    Here’s a sample version tag:


    ```

    Version: 1.2

    ```


    # 13.2.1.3. The release Tag


    The release tag can be thought of as the package’s version. The release is traditionally
    an integer—for example, when a specific piece of software at a particular version
    is first packaged, the release should be 1. If it is necessary to repackage that
    software at the same version, the release should be incremented. When a new version
    of the software becomes available, the release should drop back to 1 when it is
    first packaged.


    Note that we used the word traditionally. The only hard-and-fast restriction to
    the release format is that there can be no dashes in it. Be aware that if you
    buck tradition, your users may not understand what your release means.


    It is up to the package builder to determine which build represents a new release
    and to update the release manually. Here is what a typical release tag might look
    like:


    ```

    Release: 5

    ```


    # 13.2.2. Descriptive Tags


    Descriptive tags provide information primarily for people who want to know a bit
    more about the package and who produced it. They are part of the package file,
    and most of them can be seen by issuing an rpm -qi command.


    # 13.2.2.1. The %description Tag


    The %description tag is used to provide an in-depth description of the packaged
    software. The description should be several sentences describing, to an uninformed
    user, what the software does.


    The %description tag is a bit different from the other tags in the preamble. For
    one, it starts with a percent sign. The other difference is that the data specified
    by the %description tag can span more than one line. In addition, a primitive
    formatting capability exists. If a line starts with a space, that line will be
    displayed verbatim by RPM. Lines that do not start with a space are assumed to
    be part of a paragraph and will be formatted by RPM. It’s even possible to mix
    and match formatted and unformatted lines. Here are some examples:


    ```

    %description

    It slices! It dices! It''s a CD player app that can''t be beat. By using the resonant
    frequency of the CD itself, it is able to simulate 20x oversampling. This leads
    to sound quality that cannot be equaled with more mundane software...

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: "This example contains no explicit formatting. RPM will format the text as a\
    \ single paragraph, breaking lines as needed. In the next example, we use a leading\
    \ space to control the description's formatting:\n\n```\n%description\n It slices!\n\
    \ It dices!\n It's a CD player app that can't be beat.\nBy using the resonant\
    \ frequency of the CD itself, it is able to simulate\n20X oversampling. This leads\
    \ to sound quality that cannot be equaled with\nmore mundane software...\n```\n\
    \nIn this example, the first three lines will be displayed verbatim by RPM. The\
    \ remainder of the text will be formatted by RPM. The text will be formatted as\
    \ one paragraph. In the next example, we've added an additional wrinkle to %description\
    \ formatting:\n\n```\n%description\n It slices!\n It dices!\n It's a CD player\
    \ app that can't be beat.\nBy using the resonant frequency of the CD itself, it\
    \ is able to simulate\n20X oversampling. This leads to sound quality that cannot\
    \ be equaled with\nmore mundane software...\n```\n\nHere, we have a situation\
    \ similar to the previous example, in that part of the text is formatted and part\
    \ is not. However, the blank line separates the text into two paragraphs.\n\n\
    # 13.2.2.2. The summary Tag\n\nThe summary tag is used to define a one-line description\
    \ of the packaged software. Unlike %description, summary is restricted to one\
    \ line. RPM uses it when a succinct description of the package is needed. Here\
    \ is an example of a summary line:\n\n```\nSummary: A CD player app that rocks!\n\
    ```\n\n# 13.2.2.3. The copyright Tag\n\nThe copyright tag is used to define the\
    \ copyright terms applicable to the software being packaged. In many cases, this\
    \ might be nothing more than GPL, for software distributed under the terms of\
    \ the GNU General Public License, or something similar. Here's an example:\n\n\
    ```\nCopyright: GPL\n```\n\n# 13.2.2.4. The distribution Tag\n\nThe distribution\
    \ tag is used to define a group of packages, of which this package is a part.\
    \ Since Red Hat Software is in the business of producing a group of packages known\
    \ as a Linux distribution, the name stuck. For example, if a suite of applications\
    \ known as Doors '95 were produced, each package that is part of the suite would\
    \ define its distribution line like this:\n\n```\nDistribution: Doors '95\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: '# ### 13.2.2.5. The icon Tag


    The icon tag is used to name a file containing an icon representing the packaged
    software. The file may be in either GIF or XPM format, although XPM is preferred.
    In either case, the background of the icon should be transparent. The file should
    be placed in RPM''s SOURCES directory prior to performing a build, so no path
    is needed.


    The icon is normally used by graphically oriented front ends to RPM. RPM itself
    doesn''t use the icon, but it''s stored in the package file and retained in RPM''s
    database after the package is installed. A sample icon tag might look like this:


    ```

    Icon: foo.xpm

    ```


    # ### 13.2.2.6. The vendor Tag


    The vendor tag is used to define the name of the entity that is responsible for
    packaging the software. Normally, this would be the name of an organization. Here''s
    an example:


    ```

    Vendor: White Socks Software, Inc.

    ```


    # ### 13.2.2.7. The url Tag


    The url tag is used to define a uniform resource locator (URL) that can be used
    to obtain additional information about the packaged software. At present, RPM
    doesn''t actively make use of this tag. The data is stored in the package, however,
    and will be written into RPM''s database when the package is installed. It''s
    only a matter of time before some Web-based RPM adjunct makes use of this information,
    so make sure you include URLs! Something like this is all you''ll need:


    ```

    URL: http://www.gnomovision.com/cdplayer.html

    ```


    # ### 13.2.2.8. The group Tag


    The group tag is used to group packages together by the types of functionality
    they provide. The group specification looks like a path and is similar in function,
    in that it specifies more general groupings before more detailed ones. For example,
    a package containing a text editor might have the following group:


    ```

    Group: Applications/Editors

    ```


    In this example, the package is part of the Editors group, which is a part of
    the Applications group. Likewise, a spreadsheet package might have this group:


    ```

    Group: Applications/Spreadsheets

    ```


    This group tag indicates that under the Applications group are Editors and Spreadsheets,
    and probably some other subgroups as well.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'How is this information used? It’s primarily meant to permit graphical front
    ends to RPM to display packages in a hierarchical fashion. Of course, in order
    for groups to be as effective as possible, it’s necessary for all package builders
    to be consistent in their groupings. In the case of packages for Linux, Red Hat
    Software has the definitive list. Therefore, Linux package builders should give
    serious consideration to using Red Hat Software’s groups. The current group hierarchy
    is installed with every copy of RPM and is available in the RPM sources as well.
    Check out the file groups in RPM’s documentation directory (normally /usr/doc/rpm-<version>),
    or in the top-level source directory.


    # 13.2.2.9. The packager Tag


    The **packager** tag is used to hold the name and contact information for the
    person or persons who built the package. Normally, this would be the person who
    actually built the package, or in a larger organization, a public relations contact.
    In either case, contact information such as an e-mail address or a phone number
    should be included so customers can send either money or hate mail, depending
    on their satisfaction with the packaged software. Here’s an example of a **packager**
    tag:


    ```

    Packager: Fred Fooonly <fred@gnomovision.com>

    ```


    # 13.2.3. Dependency Tags


    One RPM feature that’s been recently implemented is a means of ensuring that if
    a package is installed, the system environment has everything the package requires
    in order to operate properly. Likewise, when an installed package is erased, RPM
    can make sure no other package relies on the package being erased. This dependency
    capability can be very helpful when end users install and erase packages on their
    own. It makes it more difficult for them to paint themselves into a corner, package-wise.


    However, in order for RPM to be able to take more than basic dependency information
    into account, the package builder must add the appropriate dependency information
    to the package. This is done by using the tags described in the following sections.
    Note, however, that adding dependency information to a package requires some forethought.
    For additional information on RPM’s dependency processing, review Chapter 14,
    “Adding Dependency Information to a Package.”


    # 13.2.3.1. The provides Tag


    The **provides** tag is used to specify a virtual package that the packaged software
    makes available when it is installed. Normally, this tag would be used when different
    packages provide equivalent services. For example, any package that allows a user
    to read mail might provide the mail-reader virtual package. Another package that
    depends on a mail reader of some sort could'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'require the mail-reader virtual package. It would then install without dependency
    problems, if any one of several mail programs were installed. Here''s what a provides
    tag might look like:


    ```

    Provides: mail-reader

    ```


    # 13.2.3.2. The requires Tag


    The requires tag is used to warn RPM that the package needs to have certain capabilities
    available in order to operate properly. These capabilities refer to the name of
    another package or to a virtual package provided by one or more packages that
    use the provides tag. When the requires tag references a package name, you can
    include version comparisons by following the package name with a version specification
    and <, >, >= or <. To get even more specific, you can include a package''s release
    as well. Here''s a requires tag in action, with a specific version requirement:


    ```

    Requires: playmidi = 2.3

    ```


    If the requires tag needs to perform a comparison against a serial number defined
    with the serial tag, the following would be the proper format:


    ```

    Requires: playmidi =S 4

    ```


    # 13.2.3.3. The conflicts Tag


    The conflicts tag is the logical complement to the requires tag. The requires
    tag is used to specify what packages must be present in order for the current
    package to operate properly. The conflicts tag is used to specify what packages
    cannot be installed if the current package is to operate properly.


    The conflicts tag has the same format as the requires tag—namely, the tag is followed
    by a real or virtual package name. Like requires, the conflicts tag also accepts
    version and release specifications:


    ```

    Conflicts: playmidi = 2.3-1

    ```


    If the conflicts tag needs to perform a comparison against a serial number defined
    with the serial tag, this would be the proper format:


    ```

    Conflicts: playmidi =S 4

    ```


    # 13.2.3.4. The serial Tag


    The serial tag is another part of RPM''s dependency and upgrade processing. The
    need for it is somewhat obscure, but goes something like this:


    +   The package being built (call it package A) uses a version numbering scheme
    sufficiently obscure so that RPM cannot determine if one version is older or newer
    than another version.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '+   Another package (package B) requires that package A be installed. More
    specifically, it requires RPM to compare package A''s version against a specified
    minimum (or maximum) version.


    Because RPM is unable to compare package A''s version against the version specified
    by package B, there is no way to determine if package B''s dependency requirements
    can be met. What to do?


    The serial tag provides a way to get around this tricky problem. By specifying
    a simple integer serial number for each version, you are, in essence, directing
    how RPM interprets the relative age of the package. The key point to keep in mind
    is that in order for this to work, a unique serial number must be defined for
    each version of the software being packaged. In addition, the serial number must
    increment along with the version. Finally, the package that requires the serialized
    software needs to specify its version requirements in terms of the serial number.


    Does it sound like a lot of trouble? You''re right! If you find yourself in the
    position of needing to use this tag, take a deep breath and seriously consider
    changing the way you assign version numbers. If you''re packaging someone else''s
    software, perhaps you can convince him to make the change. Chances are, if RPM
    can''t figure out the version number, most people can''t, either! An example of
    a serial tag would look something like this:


    ```

    Serial: 4

    ```


    Note that RPM considers a package with a serial number as newer than a package
    without a serial number.


    # 13.2.3.5. The autoreqprov Tag


    The autoreqprov tag is used to control the automatic dependency processing performed
    when the package is being built. Normally, as each package is built, the following
    steps are performed:


    +   All executable programs being packaged are analyzed to determine their shared
    library requirements. These requirements are automatically added to the package''s
    requirements.


    +   The soname (the name used to determine compatibility between different versions
    of a library) of each shared library being packaged is automatically added to
    the package''s list of provides information.


    By doing this, RPM reduces the need for package builders to manually add dependency
    information to their packages. However, there are times when RPM''s automatic
    dependency processing may not be desirable. In those cases the autoreqprov tag
    can be used to disable automatic dependency processing.


    To disable automatic dependency processing, add the following line:


    ```

    AutoReqProv: no

    ```'
  merge: -1
  img_proc: true
- pgno: 193
  md: '(Note that 0 may be used instead of no.) Although RPM defaults to performing
    automatic dependency processing, the effect of the autoreqprov tag can be reversed
    by changing no to yes. (1 may be used instead of yes.)


    # ### 13.2.4. Architecture- and Operating System-Specific Tags


    As RPM gains popularity, more people are putting it to work on different types
    of computer systems. While this would not normally be a problem, things start
    to get a little tricky when either of the following situations becomes commonplace:


    +   *   A particular operating system is ported to several different hardware
    platforms, or architectures.

    +   *   A particular architecture runs several different operating systems.


    The real bind occurs when RPM is used to package software for several of these
    different system environments. Without methods of controlling the build process
    based on architecture and operating system, package builders that develop software
    for more than one architecture or operating system will have a hard time indeed.
    The only alternative would be to maintain parallel RPM build environments and
    accept all the coordination headaches they would entail.


    Fortunately, RPM makes it all easier than that. With the tags described in the
    following sections, it''s possible to support package building under multiple
    environments, all from a single set of sources, patches, and a single spec file.
    For a more complete discussion of multiarchitecture package building, see Chapter
    19, "Building Packages for Multiple Architectures and Operating Systems."


    # #### 13.2.4.1. The Excludearch Tag


    The excludearch tag directs RPM to ensure that the package does not attempt to
    build on the excluded architecture(s). The reasons for preventing a package from
    building on a certain architecture might include the following:


    +   *   The software has not yet been ported to the excluded architecture.

    +   *   The software would serve no purpose on the excluded architecture.


    An example of the first case might be that the software was designed based on
    the assumption that an integer is a 32-bit quantity. Obviously, this assumption
    is not valid on a 64-bit processor.


    In the second case, software that depended on or manipulated low-level features
    of a given architecture should be excluded from building on a different architecture.
    Assembly language programs would fall into this category.


    One or more architectures may be specified after the excludearch tag, separated
    by either spaces or commas. Here is an example:


    ```

    ExcludeArch: sparc alpha

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'In this example, RPM would not attempt to build the package on either the Sun
    SPARC or Digital Alpha/AXP architectures. The package could build on any other
    architectures, however. If a build is attempted on an excluded architecture, the
    following message will be displayed, and the build will fail:


    ```

    # rpm -ba cdplayer-1.0.spec

    Arch mismatch!

    cdplayer-1.0.spec doesn''t build on this architecture

    #

    ```


    Note that if your goal is to ensure that a package will only build on one architecture,
    you should use the `exclusivearch` tag.


    # 13.2.4.2. The exclusivearch Tag


    The `exclusivearch` tag is used to direct RPM to ensure that the package is only
    built on the specified architecture(s). The reasons for this are similar to the
    those mentioned in section 13.2.5.1. However, the `exclusivearch` tag is useful
    when the package builder needs to ensure that only the specified architectures
    will build the package. This tag ensures that no future architectures will mistakenly
    attempt to build the package. This would not be the case if the `excludearch`
    tag were used to specify every architecture known at the time the package is built.


    The syntax of the `exclusivearch` tag is identical to that of `excludearch`:


    ```

    ExclusiveArch: sparc alpha

    ```


    In this example, the package will only build on a Sun SPARC or Digital Alpha/AXP
    system.


    Note that if your goal is to ensure that a package will not build on specific
    architectures, you should use the `excludearch` tag.


    # 13.2.4.3. The excludeos Tag


    The `excludeos` tag is used to direct RPM to ensure that the package does not
    attempt to build on the excluded operating system(s). This is usually necessary
    when a package is to be built on more than one operating system, but it is necessary
    to keep a particular operating system from attempting a build.


    Note that if your goal is to ensure that a package will only build on one operating
    system, you should use the `exclusiveos` tag. Here’s a sample `excludeos` tag:


    ```

    ExcludeOS: linux irix

    ```


    # 13.2.4.4. The exclusiveos Tag


    The `exclusiveos` tag has the same syntax as `excludeos`, but it has the opposite
    logic. The `exclusiveos` tag is used to denote which operating system(s) should
    be exclusively permitted to build the package. Here’s `exclusiveos` in action:


    ```

    ExclusiveOS: linux

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Note that if your goal is to ensure that a package will not build on a specific
    operating system, you should use the `excluedos` tag.


    # ### 13.2.5. Directory-Related Tags


    A number of tags are used to specify directories and paths that are used in various
    phases of RPM''s build and install processes. There''s not much more to say collectively
    about these tags, so let''s dive right in and look them over.


    # #### 13.2.5.1. The `prefix` Tag


    The `prefix` tag is used when a relocatable package is to be built. A relocatable
    package can be installed normally or can be installed in a user-specified directory,
    by using RPM''s `--prefix` install-time option. The data specified after the prefix
    tag should be the part of the package''s path that may be changed during installation.
    For example, if the following prefix line were included in a spec file:


    ```

    ```

    Prefix: /opt

    ```

    ```


    and the following file were specified in the spec file''s `%files` list:


    ```

    ```

    /opt/blather/foonly

    ```

    ```


    then the file `foonly` would be installed in `/opt/blather` if the package was
    installed normally. It would be installed in `/usr/local/blather` if the package
    was installed with the `--prefix` /usr/local option.


    For more information about creating relocatable packages, see Chapter 15, "Making
    a Relocatable Package."


    # #### 13.2.5.2. The `buildroot` Tag


    The `buildroot` tag is used to define an alternate build root. The name is a bit
    misleading because the build root is actually used when the software is installed
    during the build process. In order for a build root to be defined and actually
    used, a number of issues must be taken into account. These issues are covered
    in Chapter 16, "Making a Package That Can Build Anywhere." This is what a buildroot
    tag would look like:


    ```

    ```

    BuildRoot: /tmp/cdplayer

    ```

    ```


    The `buildroot` tag can be overridden at build time by using the `--buildroot`
    command-line option.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 13.2.6. Source and Patch Tags


    In order to build and package software, RPM needs to know where to find the original
    sources. But it’s not quite that simple. There might be more than one set of sources
    that need to be part of a particular build. In some cases, it might be necessary
    to prevent some sources from being packaged.


    And then there is the matter of patches. It’s likely that changes will need to
    be made to the sources, so it’s necessary to specify a patch file. But the same
    issues that apply to source specifications are also applicable to patches. There
    might be more than one set of patches required.


    The tags that are described in the following sections are crucial to RPM, so it
    pays to have a firm grasp of how they are used.


    # 13.2.6.1. The source Tag


    The source tag is central to nearly every spec file. Although it has only one
    piece of data associated with it, it performs two functions:


    +   • It shows where the software’s developer has made the original sources available.

    +   • It gives RPM the name of the original source file.


    While there is no hard-and-fast rule for the first function, it’s generally considered
    best to put this information in the form of a URL. The URL should point directly
    to the source file itself. This is because of the source tag’s second function.


    As mentioned previously, the source tag also needs to direct RPM to the source
    file on the build system. How does it do this? There’s only one requirement, and
    it is ironclad: The source filename must be at the end of the line as the final
    element in a path. Here’s an example:


    ```

    `Source: http://ftp.gnomevision.com/pub/cdplayer-1.0.tgz`

    ```


    Given this source line, RPM will search its **sources** directory for **cdplayer-1.0.tgz**.
    Everything prior to the filename is ignored by RPM. It’s there strictly for any
    interested humans.


    A spec file may contain more than one source tag. This is necessary for those
    cases where the software being packaged is contained in more than one source file.
    However, the source tags must be uniquely identified. This is done by appending
    a number to the end of the tag itself. In fact, RPM does this internally for the
    first source tag in a spec file, in essence turning it into **source0**. Therefore,
    if a package contains two source files, they may either be specified this way:


    ```

    Source: blather-4.5.tar.gz

    Source1: bother-1.2.tar.gz

    ```


    or this way:


    ```

    Source0: blather-4.5.tar.gz

    Source1: bother-1.2.tar.gz

    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 13.2.6.2. The nosource Tag


    The nosource tag is used to direct RPM to omit one or more source files from the
    source package. Why would someone want to go to the trouble of specifying a source
    file, only to exclude it? The reasons for this can be varied, but let''s look
    at one example: The software known as pretty good privacy, or PGP.


    PGP contains encryption routines of such high quality that the U.S. government
    restricts their export. (There is also an international version that may be used
    in non-U.S. countries. See Appendix G, "An Introduction to PGP.") While it would
    be nice to create a PGP package file, the resulting package could not legally
    be transferred between the U.S. and other countries.


    However, what if all files other than the original source were packaged using
    RPMD? Well, a binary package made without PGP would be of little use, but what
    about the source package? It would contain the spec file, maybe some patches,
    and perhaps even an icon file. Since the controversial PGP software was not a
    part of the source package, this sanitized source package could be downloaded
    legally in any country. The person who downloaded a copy could then go about legally
    obtaining the PGP sources himself, place them in RPM''s SOURCES directory, and
    create a binary package. He wouldn''t even need to change the nosource tag. One
    rpm -ba command later, and the user would have a perfectly usable PGP binary package
    file.


    Since there may be more than one source tag in a spec file, the format of the
    nosource tag is as follows:


    ```

    nosource: <src-num>, <src-num>,...<src-num>

    ```


    <src-num> represents the number following the source tag. If there is more than
    one number in the list, the numbers may be separated by either commas or spaces.
    For example, consider a package containing the following source tags:


    ```

    source: blather-4.5.tar.gz

    source1: bother-1.2.tar.gz

    source2: blather-lib-4.5.tar.gz

    source3: blather-lib-1.2.tar.gz

    ```


    If the source files for blather and blather-lib were not to be included in the
    package, the following nosource line could be added:


    ```

    NoSource: 0, 3

    ```


    What about that 0? Keep in mind that the first unnumbered source tag in a spec
    file is automatically numbered 0 by RPM.


    # 13.2.6.3. The patch Tag


    The patch tag is used to identify which patches are associated with the software
    being packaged. The patch files are kept in RPM''s SOURCES directory, so only
    the name of the patch file should be specified. Here is an example:


    ```

    Patch: cdp-0.33-fsstnd.patch

    ```'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'There are no hard-and-fast requirements for naming the patch files, but traditionally
    the filename starts with the software name and version, separated by dashes. The
    next part of the patch file name usually includes one or more words indicating
    the reason for the patch. In the preceding example, the patch file contains changes
    necessary to bring the software into compliance with the Linux File System Standard,
    hence the fsstnd magic incantation.


    RPM processes patch tags the same way it does source tags. Therefore, it’s acceptable
    to use a URL on a patch line, too.


    A spec file may contain more than one patch tag. This is necessary for those cases
    where the software being packaged requires more than one patch. However, the patch
    tags must be uniquely identified. This is done by appending a number to the end
    of the tag itself. In fact, RPM does this internally for the first patch tag in
    a spec file, in essence turning it into patch0. Therefore, if a package contains
    three patches, this method of specifying them:


    ```

    Patch: blather-4.5-bugfix.patch

    Patch1: blather-4.5-config.patch

    Patch2: blather-4.5-somethingelse.patch

    ```


    is equivalent to this one:


    ```

    Patch0: blather-4.5-bugfix.patch

    Patch1: blather-4.5-config.patch

    Patch2: blather-4.5-somethingelse.patch

    ```


    Either approach may be used, but the second method looks nicer.


    # 13.2.6.4. The nopatch Tag


    The nopatch tag is similar to the nosource tag discussed earlier. Just like the
    nosource tag, the nopatch tag is used to direct RPM to omit something from the
    source package. In the case of nosource, that something was one or more sources.
    For the nopatch tag, the something is one or more patches.


    Since each patch tag in a spec file must be numbered, the nopatch tag uses those
    numbers to specify which patches are not to be included in the package. The nopatch
    tag is used in this manner:


    ```

    NoPatch: 2 3

    ```


    In this example, the source files specified on the source2 and source3 lines are
    not to be included in the build.


    This concludes our study of RPM’s tags. In the next section, we’ll look at the
    various scripts that RPM uses to build, as well as to install and erase, packages.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# # 13.3. Scripts: RPM''s Workhorse


    The scripts that RPM uses to control the build process are among the most varied
    and interesting parts of the spec file. Many spec files also contain scripts that
    perform a variety of tasks whenever the package is installed or erased.


    The start of each script is denoted by a keyword. For example, the `%build` keyword
    marks the start of the script RPM will execute when building the software to be
    packaged. Note that, in the strictest sense of the word, these parts of the spec
    file are not scripts. For example, they do not start with the traditional invocation
    of a shell. However, the contents of each script section are copied into a file
    and executed by RPM as a full-fledged script. This is part of the power of RPM:
    Anything that can be done in a script can be done by RPM.


    Let''s start by looking at the scripts used during the build process.


    # ## 13.3.1. Build-Time Scripts


    The scripts that RPM uses during the building of a package follow the steps known
    to every software developer:


    +   1.  Unpack the sources.

    +   2.  Build the software.

    +   3.  Install the software.

    +   4.  Clean up.


    Although each of the scripts performs a specific function in the build process,
    they share a common environment. Using RPM''s `--test` option (described in section
    12.1.11 in Chapter 12), we can see the common portion of each script. In the following
    example, we''ve taken the cdplayer package, issued an `rpm -ba --test cdplayer-1.0-1.spec`,
    and viewed the script files left in RPM''s temporary directory. This section (with
    the appropriate package-specific values) is present in every script RPM executes
    during a build:


    ```

    #!/bin/sh -e

    # Script generated by rpm


    RPM_SOURCE_DIR="/usr/src/redhat/SOURCES"

    RPM_BUILD_DIR="/usr/src/redhat/BUILD"

    RPM_DOC_DIR="/usr/doc"

    RPM_OPT_FLAGS="-O2 -m486 -fno-strength-reduce"

    RPM_ARCH="i386"

    RPM_OS="Linux"

    RPM_ROOT_DIR="/tmp/cdplayer"

    RPM_BUILD_ROOT="/tmp/cdplayer"

    RPM_PACKAGE_NAME="cdplayer"

    RPM_PACKAGE_VERSION="1.0"

    RPM_PACKAGE_RELEASE="1"

    set -x


    umask 022

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'As you can see, the script starts with the usual invocation of a shell (in
    this case, the Bourne shell). There are no arguments passed to the script. Next,
    a number of environment variables are set. Here’s a brief description of each
    one:


    +   * **RPM_SOURCE_DIR**—This environment variable gets its value from the **rpmsg**
    file entry **sourcedir**, which in turn can get part of its value from the **topdir**
    entry. It is the path **RPM** will prepend to the file, specified in the **source**
    tag line.


    +   * **RPM_BUILD_DIR**—This variable is based on the **buildir** **rpmsg** file
    entry, which in turn can get part of its value from the **topdir** entry. This
    environment variable translates to the path of **RPM**’s build directory, where
    most software will be unpacked and built.


    +   * **RPM_DOC_DIR**—The value of this environment variable is based on the **defaultdocdir**
    **rpmsg** file entry. Files marked with the **%doc** directive can be installed
    in a subdirectory of **defaultdocdir**. For more information on the **%doc** directive,
    refer to section 13.6.1.


    +   * **RPM_OPT_FLAGS**—This environment variable gets its value from the **optflags**
    **rpmsg** file entry. It contains options that can be passed on to the build procedures
    of the software being packaged. Normally this means either a configuration script
    or the **make** command itself.


    +   * **RPM_ARCH**—As you might infer from the preceding example, this environment
    variable contains a string describing the build system’s architecture.


    +   * **RPM_OS**—This one contains the name of the build system’s operating system.


    +   * **RPM_BUILD_ROOT**—This environment variable is used to hold the build root,
    into which the newly built software will be installed. If no explicit build root
    has been specified (either by command-line option, spec file tag line, or **rpmsg**
    file entry), this variable will be null.


    +   * **RPM_PACKAGE_NAME**—This environment variable gets its value from the **name**
    tag line in the package’s **spec** file. It contains the name of the software
    being packaged.


    +   * **RPM_PACKAGE_VERSION**—The version tag line is the source of this variable’s
    translation. Predictably, this environment variable contains the software’s version
    number.


    +   * **RPM_PACKAGE_RELEASE**—This environment variable contains the package’s
    release number. Its value is obtained from the release tag line in the spec file.


    All these environment variables are set for you to make it easier to write scripts
    that will do the right thing even if the build environment changes.


    The script also sets an option that causes the shell to print out each command,
    complete with expanded arguments. Finally, the default permissions are set. Past
    this point, the scripts differ. Let’s look at the scripts in the order in which
    they are executed.


    # 13.3.1.1. The %prep Script


    The **%prep** script is the first one **RPM** executes during a build. Prior to
    the **%prep** script, **RPM** has performed preliminary consistency checks, such
    as whether the **spec** file’s source tag points'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'to files that actually exist. Just prior to passing control over to the %prep
    script’s contents, RPM changes directory into RPM’s build area, which, by default,
    is /usr/src/redhat/BUILD. At that point, it is the responsibility of the %prep
    script to do the following:


    +   - Create the top-level build directory.

    +   - Unpack the original sources into the build directory.

    +   - Apply patches to the sources, if necessary.

    +   - Perform any other actions required to get the sources into a ready-to-build
    state.


    The first three items on this list are common to the vast majority of all software
    being packaged. Therefore, RPM has two macros that greatly simplify these routine
    functions.


    You can find more information on RPM’s %setup and %patch macros in section 13.4.


    The last item on the list can include creating directories or anything else required
    to get the sources into a ready-to-build state. As a result, a %prep script can
    range from one line invoking a single %setup macro to many lines of tricky shell
    programming.


    # 13.3.1.2. The %build Script


    The %build script picks up where the %prep script left off. Once the %prep script
    has gotten everything ready for the build, the %build script is usually somewhat
    anticlimactic—normally invoking make, maybe a configuration script, and little
    else.


    Like %prep before it, the %build14 script has the same assortment of environment
    variables to draw on. Also, like %prep, %build14 changes directory into the software’s
    top-level build directory (located in RPM_BUILD_DIR, or usually called <name>-<version>).


    Unlike %prep, there are no macros available for use in the %build14 script. The
    reason is simple: Either the commands required to build the software are simple
    (such as a single make command) or they are so unique that a macro wouldn’t make
    it easier to write the script.


    # 13.3.1.3. The %install Script


    The environment in which the %install script executes is identical to those of
    the other scripts. Like the other scripts, the %install script’s working directory
    is set to the software’s top-level directory.


    As the name implies, it is this script’s responsibility to do whatever is necessary
    to actually install the newly built software. In most cases, this means a single
    make install command or a few commands to copy files and create directories.


    # 13.3.1.4. The %clean Script


    The %clean script, as the name implies, is used to clean up the software’s build
    directory tree. RPM normally does this for you, but in certain cases (most notably
    in those packages that use a build root) you’ll need to include a %clean script.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'As usual, the `%clean` script has the same set of environment variables as
    the other scripts we’ve covered here. Since a `%clean` script is normally used
    when the package is built in a build root, the `RPM_BUILD_ROOT` environment variable
    is particularly useful. In many cases, a simple


    ```

    rm -rf $RPM_BUILD_ROOT

    ```


    will suffice. Keep in mind that this command in a `%clean` script can wreak havoc
    if used, say, with a build root of `/`. Section 12.1.13 in Chapter 12, “rpm -b
    Command Reference,” discusses this in more detail.


    # 13.3.2. Install/Erases-Time Scripts


    The other type of scripts that are present in the spec file are those that are
    only used when the package is either installed or erased. There are four scripts,
    each one meant to be executed at different times during the life of a package:


    +   - Before installation

    +   - After installation

    +   - Before erasure

    +   - After erasure


    Unlike the build-time scripts, there is little in the way of environment variables
    for these scripts. The only environment variable available is `RPM_INSTALL_PREFIX`,
    and that is only set if the package uses an installation prefix.


    Unlike with the build-time scripts, there is an argument defined. The sole argument
    to these scripts is a number representing the number of instances of the package
    currently installed on the system, after the current package has been installed
    or erased. Sound tricky? It really isn’t. Here’s an example: Assume that a package,
    called `blather-1.0`, is being installed. No previous versions of `blather` have
    been installed. Because the software is being installed, only the `%pre` and `%post`
    scripts are executed. The argument passed to these scripts will be `1` since the
    number of `blather` packages installed is `1`. (Or it will be `1` once the package
    is completely installed. Remember that the number is based on the number of packages
    installed after the current package’s install or erase has completed.)


    Continuing our example, a new version of the `blather` package, version 1.3, is
    now available. Clearly it’s time to upgrade. What will the scripts’ values be
    during the upgrade? As `blather-1.3` is installing, its `%pre` and `%post` scripts
    will have an argument equal to `2` (`1` for version `1.0` already installed, plus
    `1` for version `1.3` being installed). As the final part of the upgrade, it’s
    then time to erase `blather` version `1.0`. As the package is being removed, its
    `%preun` and `%postun` scripts are executed. Since there will be only one `blather`
    package (version `1.3`) installed after version `1.0` is erased, the argument
    passed to version `1.0`’s scripts is `1`.


    To bring an end to this example, we’ve decided to erase `blather 1.3`. We just
    don’t need it anymore. As the package is being erased, its `%preun` and `%postun`
    scripts will be executed.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Because there will be no *bither* packages installed once the erase completes,
    the argument passed to the scripts is 0.


    With all that said, of what possible use would this argument be? Well, it has
    two very interesting properties:


    +   - When the first version of a package is installed, its %pre and %post scripts
    will be passed an argument equal to 1.

    +   - When the last version of a package is erased, its %preun and %postun scripts
    will be passed an argument equal to 0.


    Given these properties, it’s trivial to write an install-time script that can
    take certain actions in specific circumstances. Usually, the argument is used
    in the %preun or %postun scripts to perform a special task when the last instance
    of a package is being erased.


    What is normally done during these scripts? The exact tasks may vary, but in general,
    the tasks are any that need to be performed at these points in the package’s existence.
    One very common task is to run *ldconfig* when shared libraries are installed
    or removed. But that’s not the only use for these scripts. It’s even possible
    to use the scripts to perform tests to ensure the package install/erasure should
    proceed.


    Since each of these scripts will be executing on whatever system installs the
    package, it’s necessary to choose the script’s choice of tools carefully. Unless
    you’re sure a given program is going to be available on all the systems that could
    possibly install your package, you should not use it in these scripts.


    # 13.3.2.1. The %pre Script


    The %pre script executes just before the package is to be installed. It is the
    rare package that requires anything to be done prior to installation; none of
    the 350 packages that comprise Red Hat Linux 4.0 make use of it.


    # 13.3.2.2. The %post Script


    The %post script executes after the package has been installed. One of the most
    popular reasons a %post script is needed is to run *ldconfig* to update the list
    of available shared libraries after a new one has been installed. Of course, other
    functions can be performed in a %post script. For example, packages that install
    shells use the %post script to add the shell name to /etc/shells.


    If a package uses a %post script to perform some function, quite often it will
    include a %postun script that performs the inverse of the %post script, after
    the package has been removed.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "# 13.3.2.3. The %prepun Script\n\nIf there’s a time when your package needs\
    \ to have one last look around before the user erases it, the place to do it is\
    \ in the **%prepun** script. Anything that a package needs to do immediately prior\
    \ to RPM taking any action to erase the package can be done here.\n\n# 13.3.2.4.\
    \ The %postun Script\n\nThe **%postun** script executes after the package has\
    \ been removed. It is the last chance for a package to clean up after itself.\
    \ Quite often, **%postun** scripts are used to run **ldconfig** to remove newly\
    \ erased shared libraries from **/ld.so.cache**.\n\n# 13.3.3. Verification-Time\
    \ Script—The %verify Script\n\nThe **%verify script** script executes whenever\
    \ the installed package is verified by RPM’s verification command. The contents\
    \ of this script are entirely up to the package builder, but in general the script\
    \ should do whatever is necessary to verify the package’s proper installation.\
    \ Since RPM automatically verifies the existence of a package’s files, along with\
    \ other file attributes, the **%verify script** script should concentrate on different\
    \ aspects of the package’s installation. For example, the script might ensure\
    \ that certain configuration files contain the proper information for the package\
    \ being verified:\n\n```\n```\nfor n in ash bash; do\n  echo -n \"Looking for\
    \ $n in /etc/shells... \"\n  if ! grep \"~/bin/$(n)$\" /etc/shells > /dev/null;\
    \ then\n    echo \"missing\"\n    echo \"$n() missing from /etc/shells\" >&2\n\
    \  else\n    echo \"found\"\n  fi\ndone\n```\n```\n\nIn this script, the config\
    \ file **/etc/shells** is checked to ensure that it has entries for the shells\
    \ provided by this package.\n\nIt is worth noting that the script sends informational\
    \ and error messages to **stdout** and error messages only to **stderr**. Normally\
    \ RPM will only display error output from a verification script; the output sent\
    \ to **stdout** is only displayed when the verification is run in verbose mode.\n\
    \n# 13.4. Macros: Helpful Shorthand for Package Builders\n\nRPM does not support\
    \ macros in the sense of ad hoc sequences of commands being defined as a macro\
    \ and executed by simply referring to the macro name."
  merge: -1
  img_proc: true
- pgno: 205
  md: "However, two parts of RPM's build process are fairly constant from one package\
    \ to another: the unpacking and patching of sources. RPM makes two macros available\
    \ to simplify these tasks:\n\n+   The `%setup` macro, which is used to unpack\
    \ the original sources.\n+   The `%patch` macro, which is used to apply patches\
    \ to the original sources.\n\nThese macros are used exclusively in the `%prep`\
    \ script; it wouldn't make sense to use them anywhere else. The use of these macros\
    \ is not mandatory—it is certainly possible to write a `%prep` script without\
    \ them. But in the vast majority of cases they make life easier for the package\
    \ builder.\n\n# 13.4.1. The %setup Macro\n\nAs mentioned earlier, the `%setup`\
    \ macro is used to unpack the original sources, in preparation for the build.\
    \ In its simplest form, the macro is used with no options and gets the name of\
    \ the source archive from the source tag specified earlier in the spec file. Let's\
    \ look at an example. The cdp layer package has the following source tag:\n\n\
    ```\nSource: ftp://ftp.gnomevision.com/pub/cdplayer/cdplayer-1.0.tgz\n```\n\n\
    and the following `%prep` script:\n\n```\n%prep\n%setup\n```\n\nIn this simple\
    \ case, the `%setup` macro expands into the following commands:\n\n```\ncd /usr/src/redhat/BUILD\n\
    rm -rf cdp layer-1.0\ngzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz | tar\
    \ -xvvf -\nif [ $? -ne 0 ]; then\n  exit $?\nfi\ncd cdplayer-1.0\ncd /usr/src/redhat/BUILD/cdplayer-1.0\
    \ chown -R root.root .\nchmod -R a+rX,g-w,o-w .\n```\n\nAs you can see, the `%setup`\
    \ macro starts by changing directory into RPM's build area and removing any cdp\
    \ layer build trees from previous builds. It then uses `gzip` to decompress the\
    \ original source (whose name was taken from the source tag), and pipes the result\
    \ to `tar` for unpacking. The return status of the unpacking is tested. If successful,\
    \ the macro continues.\n\nAt this point, the original sources have been unpacked.\
    \ The `%setup` macro continues by changing directory into cdp layer's top-level\
    \ directory. The two `cd` commands are an artifact of `%setup`'s macro expansion.\
    \ Finally, `%setup` makes sure every file in the build tree is owned by root and\
    \ has appropriate permissions set.\n\nBut that's just the simplest way that `%setup`\
    \ can be used. A number of other options can be added to accommodate different\
    \ situations. Let's look at them."
  merge: -1
  img_proc: true
- pgno: 206
  md: "Chapter 13 ▪ Inside the Spec File 185\n\n# 13.4.1.1. -n <name>：Set Name of\
    \ Build Directory\n\nIn the preceding example, the $setup macro simply uncompressed\
    \ and unpacked the sources.\n\nIn this case, the tar file containing the original\
    \ sources was created so that the top-level directory was included in the tar\
    \ file. The name of the top-level directory was also identical to that of the\
    \ tar file, which was in <name> -<version> format.\n\nHowever, this is not always\
    \ the case. Quite often, the original sources unpack into a directory whose name\
    \ is different from the original tar file. Since RPM assumes that the directory\
    \ will be called <name> -<version>, when the directory is called something else,\
    \ it’s necessary to use $setup’s -n option. Here’s an example: Assume for a moment\
    \ that the cdplayer sources, when unpacked, create a top-level directory named\
    \ cd-player. In this case, our $setup line would look like this:\n\n```\n$setup\
    \ -n cd-player\n```\n\nand the resulting commands would look like this:\n\n```\n\
    cd /usr/src/redhat/BUILD\nrm -rf cd-player\ngzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz\
    \ | tar -xvzf -\nif [ $? -ne 0 ]; then\n    exit $?\nfi\ncd cd-player\ncd /usr/src/redhat/BUILD/cd-player\n\
    chown -R root.root .\nchmod -R a+rx,g-w,o-w .\n```\n\nThe results are identical\
    \ to using $setup with no options, except for the fact that $setup now does a\
    \ recursive delete on the directory cd-player (instead of cdplayer-1.0) and changes\
    \ directory into cd-player (instead of cdplayer-1.0).\n\nNote that all subsequent\
    \ build-time scripts will change directory into the directory specified by the\
    \ -n option. This makes -n unsuitable as a means of unpacking sources in directories\
    \ other than the top-level build directory. In the following sections, we’ll show\
    \ a way around this restriction.\n\nA quick word of warning: If the name specified\
    \ with the -n option doesn’t match the name of the directory created when the\
    \ sources are unpacked, the build will stop pretty quickly, so it pays to be careful\
    \ when using this option.\n\n# 13.4.1.2. -c：Create Directory (and Change to It)\
    \ Before Unpacking\n\nHow many times have you grabbed a tar file and unpacked\
    \ it, only to find that it is splattered files all over your current directory?\
    \ Sometimes source archives are created without a top-level directory.\n\nAs you\
    \ can see from the examples so far, $setup expects the archive to create its own\
    \ top-level directory. If this isn’t the case, you’ll need to use the -c option."
