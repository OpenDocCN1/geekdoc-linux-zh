    # 12.1.3. rpm -bi: Execute %prep, %build, %install


    By using the -bi option, RPM is directed to stop once the software is completely
    built and installed on the build system. Here''s what the output of a build using
    the -bi option looks like:


    ```

    # rpm -bi cdplayer-1.0.spec

