    Our %files list contains no references to the several files the package installs
    in the /usr/blather directory. After building the package, looking at the package''s
    file list shows this:


    ```

    # rpm -qlp ../RPMS/i386/blather-1.0-1.i386.rpm

    ...

    #

    ```


    Wait a minute: There''s nothing there, not even /usr/blather! What happened?


    The problem is that %docdir only directs RPM to mark the specified directory as
    holding documentation. It doesn''t direct RPM to package any files in the directory.
    To do that, we need to cluc RPM in to the fact that there are files in the directory
    that must be packaged.


    One way to do this is to simply add the files to the %files list:


    ```

    %docdir /usr/blather

    /usr/blather/INSTALL

    ```


    Looking at the package, we see that INSTALL was packaged:


    ```

    # rpm -qlp ../RPMS/i386/blather-1.0-1.i386.rpm

    ...

    /usr/blather/INSTALL

    #

    ```


    Directing RPM to only show the documentation files, we see that INSTALL has indeed
    been marked as documentation, even though the %doc directive had not been used:


    ```

    # rpm -qdqp ../RPMS/i386/blather-1.0-1.i386.rpm

    ...

    /usr/blather/INSTALL

    #

    ```


    Of course, if you go to the trouble of adding each file to the %files list, it
    wouldn''t be that much more work to add %doc to each one. So the way to get the
    most benefit from %docdir is to add another line to the %files list:


    ```

    %docdir /usr/blather

    /usr/blather

