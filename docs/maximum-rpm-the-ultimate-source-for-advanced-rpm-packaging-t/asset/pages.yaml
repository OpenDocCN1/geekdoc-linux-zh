    # ### 14.2.3. The autoreprov Tag: Disable Automatic Dependency Processing


    There may be times when RPM’s automatic dependency processing is not desired.
    In these cases, the autoreprov tag may be used to disable it. This tag takes a
    yes/no or 0/1 value. For example, to disable automatic dependency processing,
    the following line may be used:


    ```

    AutoReqProv: no

    ```


    # ## 14.3. Manual Dependencies


