  md: 'Normally, this option is used only during an initial system install or when
    a system has been booted off a rescue disk and some packages need to be reinstalled.


    # 2.4.14. --dbpath <path>: Use <path> to Find an RPM Database


    In order for RPM to do its handiwork, it needs access to an RPM database. Normally,
    this database exists in the directory specified by the rpms file entry dbpath.
    By default, dbpath is set to /var/lib/rpm.


    Although the dbpath entry can be modified in the appropriate rpms file, the --dbpath
    option is probably a better choice when the database path needs to be changed
    temporarily. An example of a time the --dbpath option would come in handy is when
    it''s necessary to examine an RPM database copied from another system. Granted,
    it''s not a common occurrence, but it''s difficult to handle any other way.


    # 2.4.15. --ftppport <port>: Use <port> in FTP-Based Installs


    Back in section 2.2.1 you saw how RPM can access package files with the use of
    a URL. You also learned that some systems may not use the standard FTP port. In
    those cases, it''s necessary to give RPM the proper port number to use. As mentioned
    earlier, one approach is to embed the port number in the URL itself.


    Another approach is to use the --ftppport option. RPM will access the desired
    port when this option, along with the port number, is added to the command line.
    In cases where the desired port seldom changes, it may be entered in an rpms file
    by using the ftppport entry. For more information on the use of rpms files, see
    Appendix B.


    # 2.4.16. --ftpproxy <host>: Use <host> As a Proxy in FTP-Based Installs


    Many companies and Internet service providers (ISPs) employ various methods to
    protect their network connections against misuse. One of these methods is to use
    a system that will process all FTP requests on behalf of the other systems on
    the company or ISP network. Having a single computer act as a proxy for the other
    systems serves to protect the other systems against any FTP-related misuse.


    When RPM is employed on a network with an FTP proxy system, it will be necessary
    for RPM to direct all its FTP requests to the FTP proxy. RPM will send its FTP
    requests to the specified proxy system when the --ftpproxy option, along with
    the proxy hostname, is added to the command line.


    In cases where the proxy host seldom changes, you can enter it in an rpms file
    by using the ftpproxy entry.'
