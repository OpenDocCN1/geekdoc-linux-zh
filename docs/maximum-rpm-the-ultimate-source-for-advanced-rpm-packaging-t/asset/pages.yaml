    # ### 12.1.13.1. Using --buildroot Can Bite You!


    Although the --buildroot option can solve some problems, using a build root can
    actually be dangerous. How? Consider the following situation:


    +   - A spec file is configured to have a build root of /tmp/blather, for instance.

    +   - In the %prep section (or the %clean section; it doesn''t matter—the end
    result is the same), there is an rm -rf $RPM_BUILD_ROOT command to clean out any
    old installed software.

    +   - You decide to build the software so that it installs relative to your system''s
    root directory, so you enter the following command: rpm -ba --buildroot / foo.spec.


    The end result? Since specifying / as the build root sets RPM BUILD ROOT to /,
    that innocuous little rm -rf $RPM BUILD ROOT turns into rm -rf / !A recursive
    delete, starting at your system''s root directory, might not be a total disaster
    if you catch it quickly, but in either case, you''ll be testing your ability to
    restore from backup (er, you do have backups, don''t you?).


    The moral of this story is to be very careful when using --buildroot. A good rule
    of thumb is to always specify a unique build root. For example, instead of specifying
    /tmp as a build root (and possibly losing your system''s directory for holding
    temporary files), use the path /tmp/mypackage, where the directory mypackage is
    used only by the package you''re building.'
