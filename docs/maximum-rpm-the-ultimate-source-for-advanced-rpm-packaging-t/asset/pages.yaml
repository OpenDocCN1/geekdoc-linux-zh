  md: "# 12.1.14. `--timecheck <secs>`: Print a Warning if Files to Be Packaged Are\
    \ More Than `<secs>` Old\n\nWhile it’s possible to detect many errors in the `%files`\
    \ list using `rpm -bI`, there is another type of problem that can’t be detected.\
    \ Consider the following scenario:\n\n+   * A package you’re building creates\
    \ the file `/usr/bin/foo`. \n+   * Because of a problem with the package’s makefile,\
    \ foo is never copied into `/usr/bin`. \n+   * An older, incompatible version\
    \ of foo, created several months ago, already exists in `/usr/bin`. \n+   \n+\
    \   RPM creates the binary package file.\n\nIs the incompatible `/usr/bin/foo`\
    \ included in the package? You bet it is! If only there were some way for RPM\
    \ to catch this type of problem.\n\nWell, there is! If you add `--timecheck`,\
    \ followed by a number, RPM will check each file being packaged to see if the\
    \ file is more than the specified number of seconds old. If it is, a warning message\
    \ is displayed. The `--timecheck` option works with either the `-ba` or `-bI`\
    \ options. Here’s an example using `-bI`:\n\n```\n```\n# rpm -bI --timecheck 3600\
    \ ccdplayer-1.0.spec\n* Package: ccdplayer\nFile List Check: ccdplayer-1.0-1\n\
    warning: TIMECHECK failure: /usr/doc/ccdplayer-1.0-1/README\nFinding dependencies\
    \ ...\nRequires (2): libc.so.5 libncurses.so.2.0\n```\n\n```\n\nIn this example,\
    \ the file `/usr/doc/ccdplayer-1.0-1/README` is more than 3,600 seconds, or 1\
    \ hour, old. If we take a look at the file, we find that it is as follows (note\
    \ that the package was built substantially later than November 1995):\n\n```\n\
    ```\n# ls -al /usr/doc/ccdplayer-1.0-1/README\n-rw-r--r-- 1 root root 1885 Nov\
    \ 10 1995 README\n```\n\n```\n\nIn this case, the warning from `--timecheck` is\
    \ no cause for alarm. Since the README file was simply copied from the original\
    \ source, which was created November 10, 1995, its date is unchanged. If the file\
    \ had been an executable or a library that was supposedly built recently, `--timecheck`’s\
    \ warning should be taken more seriously.\n\nIf you’d like to set a default time\
    \ check value of one hour, you can include the following line in your `rpmmac`\
    \ file:\n\n```\n```\ntimecheck: 3600\n```\n\n```\n\nThis value can still be overridden\
    \ by a value on the command line, if desired. For more information on the use\
    \ of `rpmmac` files, see Appendix B, “The `rpmmac` File.”"
  merge: -1
