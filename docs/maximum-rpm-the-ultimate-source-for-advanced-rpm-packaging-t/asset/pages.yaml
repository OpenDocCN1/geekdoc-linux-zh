- pgno: 76
  md: '# ## 5.1. rpm -q: What Does It Do?


    One of the nice things about using RPM is that the packages you manage don''t
    end up going into some kind of black hole. Nothing would be worse than to install,
    upgrade, and erase several different packages and not have a clue as to what''s
    on your system. In fact, RPM''s query function can help you get out of sticky
    situations such as the following:


    +   - You''re poking around your system and you come across a file that you just
    can''t identify. Where did it come from?

    +   - Your friend sends you a package file and you have no idea what the package
    does, what it installs, or where it originally came from.

    +   - You know that you installed XFree86 a couple months ago, but you don''t
    know what version and you can''t find any documentation on it.


    The list could go on, but you get the idea. The rpm -q command is what you need.
    If you''re the kind of person who doesn''t like to have more options than you
    know what to do with, rpm -q might look imposing. But fear not. Once you have
    a handle on the basic structure of an RPM query, it''ll be a piece of cake.


    # ## 5.2. The Parts of an RPM Query


    It becomes easy to construct a query command when you understand the individual
    parts. First is the -q (you can also use --query, if you like). After all, you
    need to tell RPM what function to perform, right? The rest of a query command
    consists of two distinct parts: package selection (or what packages you''d like
    to query) and information selection (or what information you''d like to see).
    Let''s take a look at package selection first.


    # ### 5.2.1. Query Commands, Part I: Package Selection


    The first thing you''ll need to decide when issuing an RPM query is what package
    (or packages) you''d like to query. RPM has several ways to specify packages,
    so you have quite an assortment to choose from.


    # #### 5.2.1.1. The Package Label


    Earlier chapters discuss RPM''s package label, a string that uniquely identifies
    every installed package. Every label contains three pieces of information:


    +   - The name of the packaged software

    +   - The version of the packaged software

    +   - The package''s release number'
  merge: -1
  img_proc: true
- pgno: 77
  md: "When issuing a query command using package labels, you must always include\
    \ the package name. You can also include the version and even the release, if\
    \ you like. The only restrictions are that each part of the package label specified\
    \ must be complete and that if any parts of the package label are missing, all\
    \ parts to the right must be omitted as well. This second restriction is just\
    \ a long way of saying that if you specify the release, you must specify the version\
    \ as well. Let’s look at a few examples.\n\nSay, for instance, you’ve recently\
    \ installed a new version of the C libraries, but you can’t remember the version\
    \ number:\n\n```\n# rpm -q libc\nlibc-5.2.18-1\n# \n```\n\nIn this type of query,\
    \ RPM returns the complete package label for all installed packages that match\
    \ the given information. In this example, if version 5.2.17 of the C libraries\
    \ were also installed, its package label would have been displayed, too.\n\nIn\
    \ this example, we’ve included the version as well as the package name:\n\n```\n\
    # rpm -q rpm-2.3\nrpm-2.3-1\n# \n```\n\nNote, however, that RPM is a bit picky\
    \ about specifying package names. Here are some queries for the C library that\
    \ won’t work:\n\n```\n# rpm -q LibC\npackage LibC is not installed\n# \n```\n\n\
    ```\n# rpm -q lib\npackage lib is not installed\n# \n```\n\n```\n# rpm -q \"lib*\"\
    \npackage lib* is not installed\n# \n```\n\n```\n# rpm -q libc-5\npackage libc-5\
    \ is not installed\n```\n\n```\n# rpm -q libc-5.2.1\npackage libc-5.2.1 is not\
    \ installed\n# \n```\n\nAs you can see, RPM is case sensitive about package names\
    \ and cannot match partial names, version numbers, or release numbers. Nor can\
    \ it use the wildcard characters we’ve come to know and love. As we’ve seen, however,\
    \ RPM can perform the query when more than one field of the package label is present.\
    \ In this case, `rpm -q libc-5.2.18`, or even `rpm -q libc-5.2.18-1` would have\
    \ found the package, `libc-5.2.18-1`."
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Querying based on package labels may seem a bit restrictive. After all, you
    need to know the exact name of a package in order to perform a query on it. But
    there are other ways of specifying packages.


    # 5.2.1.2. -a: Query All Installed Packages


    Want lots of information fast? Using the -a option, you can query every package
    installed on your system. Here''s an example:


    ```

    $ rpm -qa

    ElectricFence-2.0.5-2

    ImageMagick-3.7-2



    tetex-xetexsh-0.3.3-8

    Iout-3.06-4

    #

    ```


    On a system installed using RPM, the number of packages can easily be 200 or more;
    we''ve deleted most of the output.


    The -a option can produce mountains of output, which makes it a prime candidate
    for piping through the many Linux/UNIX commands available. One of the prime candidates
    would be a pager such as more, so that the list of installed packages could be
    viewed a screenful at a time.


    Another handy command to pipe rpm -qa''s output through is grep. In fact, using
    grep, it''s possible to get around RPM''s lack of built-in wildcard processing:


    ```

    $ rpm -qa | grep -i sysv

    SysVinit-2.64-2

    #

    ```


    In this example, we were able to find the SysVinit package even though we didn''t
    have the complete package name or capitalization.


    # 5.2.1.3. -f <file>: Query the Package Owning <file>


    How many times have you found a program sitting on your system and wondered what
    it does? Well, if the program was installed by RPM as part of a package, it''s
    easy to find out. Simply use the -f option. For example, you find a strange program
    called 1s in /bin (okay, it is a contrived example). Wonder what package installed
    it? It''s as easy as this to find out:


    ```

    $ rpm -qf /bin/1s

    fileutlls-3.12-3

    #

    ```


    If you happen to point RPM to a file it didn''t install, you''ll get a message
    similar to the following:


    ```

    $ rpm -qf .cshrc

    file /home/ed/.cshrc is not owned by any package

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 79
  md: "It’s possible that you’ll get the not owned by any package message in error.\
    \ Here’s an example of how it can happen:\n\n```\n```\n# rpm -qf /usr/X11/bin/xterm\n\
    file /usr/X11/bin/xterm is not owned by any package\n# \n```\n```\n\nAs you can\
    \ see, we’re trying to find out what package the xterm program is part of. The\
    \ first example failed, which might lead you to believe that xterm really isn’t\
    \ owned by any package.\n\nHowever, let’s look at a directory listing:\n\n```\n\
    ```\n# ls -lF /usr\n...\nlrwxrwxrwx 1 root root 5 May 13 12:46 X11 -> X11R6/\n\
    drwxrwxr-x 7 root root 1024 Mar 21 00:21 X11R6/\n...\n# \n```\n```\n\n> **NOTE**\n\
    > I’ve truncated the list; normally /usr is quite a bit more crowded than this.\n\
    \nThe key here is the line ending with *X11 -> X11R6/*. This is known as a *symbolic\
    \ link*, or *symlink*. It’s a way of referring to a file (here, a directory file)\
    \ by another name. In this case, if we used the path */usr/X11* or */usr/X11R6*,\
    \ it shouldn’t make a difference. It certainly doesn’t make a difference to programs\
    \ that simply want access to the file. But it does make a difference to RPM because\
    \ RPM doesn’t use the filename to access the file. RPM uses the filename as a\
    \ key into its database. It would be very difficult, if not impossible, to keep\
    \ track of all the symlinks on a system and try every possible path to a file\
    \ during a query.\n\nWhat to do? There are two options:\n\n+   - Make sure you\
    \ always specify a path free of symlinks. This can be pretty tough, though. An\
    \ alternative approach is to use *namei* to track down symlinks:\n\n```\n```\n\
    # namei /usr/X11/bin/xterm\nf: /usr/X11/bin/xterm\nd / \nd usr\n1 X11 -> X11R6\n\
    d X11R6\nd bin\n. xterm\n# \n```\n```\n\nIt’s pretty easy to see the *X11* to\
    \ *X11R6* symlink. Using this approach you can enter the nonsymlinked path and\
    \ get the desired results:\n\n```\n```\n# rpm -qf /usr/X11R6/bin/xterm\nXFree86-3.1.2-5\n\
    # \n```\n```"
  merge: -1
