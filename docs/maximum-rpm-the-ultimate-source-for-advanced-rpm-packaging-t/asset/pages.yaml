    %files server

    %files client

    %files -n bazlib

    ```


    In addition, we need the main package’s `%files` list, which remains unnamed:


    ```

    %files

    ```


    The contents of each `%files` list is dictated entirely by the software’s requirements.
    If, for example, a certain file needs to be packaged in more than one package,
    it’s perfectly all right to include the filename in more than one list.


    # 18.4.2.1. Controlling Packages with the `%files` List


    The `%files` list wields considerable power over subpackages. It’s even possible
    to prevent a package from being created by using the `%files` list. But is there
    a reason you’d want to go to the trouble of setting up subpackages, only to keep
    one from being created?


    Actually, there is. Take, for example, the case where client/server-based software
    is to be packaged. Certainly, it makes sense to create two subpackages: one for
    the client and one for the server. But what about the main package? Is there any
    need for *it*?


    Quite often there’s no need for a main package. In those cases, removing the main
    `%files` list entirely will result in no main package being built.


    # 18.4.2.2. A Point Worth Noting


    Keep in mind that an empty `%files` list (that is, a `%files` list that contains
    no files) is *not* the same as not having a `%files` list at all. As noted previously,
    entirely removing a `%files` list results in RPM not creating that package. However,
    if RPM comes across a `%files` list with no files, it will happily create an empty
    package file.


    This feature (which also works with subpackage `%files` lists) comes in handy
    when used in concert with conditionals. If a `%files` list is enclosed by a conditional,
    the package will be created (or not) based on the evaluation of the conditional.


