- pgno: 64
  md: 'Chapter 3 Using RPM to Erase Packages 43


    # 3.4. rpm -e and Config Files


    If you’ve made changes to a configuration file that was originally installed by
    RPM, your changes won’t be lost if you erase the package. Say, for example, that
    we’ve made changes to `/etc/skel/.bashrc` (a config file), which was installed
    as part of the `etc-skel` package. Later, we remove etc-skel:


    ```

    # rpm -e etc-skel

    #

    ```


    But if we take a look in `/etc/skel`, here’s what we see:


    ```

    # ls -al

    total 5

    drwxr-xr-x 3 root root 1024 Jun 17 22:01 .

    drwxr-xr-x 8 root root 2048 Jun 17 19:01 ..

    -rw-r--r-- 1 root root 152 Jun 17 21:54 .bashrc.rpm~save

    drwxr-xr-x 2 root root 1024 May 13 13:18 .xfg

    #

    ```


    Sure enough, `.bashrc.rpm~save` is a copy of your modified `.bashrc` file! Remember,
    however, that this feature only works with config files. Not sure how to determine
    which files RPM thinks are config files? Chapter 5, “Getting Information About
    Packages,” specifically section 5.2.2, shows you how.


    # 3.5. Watch Out!


    RPM takes most of the work out of removing software from your system, and that’s
    great. But of course there’s a downside. RPM also makes it easy to erase packages
    that are critical to your system’s continued operation. Here are some examples
    of packages not to erase:


    +   - RPM: RPM will happily uninstall itself. No problem, though. You’ll just
    re-install it with `rpm -i...`.Oops!

    +   - Bash: The Bourne-again shell may not be the shell you use, but certain parts
    of many Linux systems (such as the scripts executed during system startup and
    shutdown) use `/bin/sh`, which is a symbolic link to `/bin/bash`. No `/bin/bash`,
    no `/bin/sh`. No `/bin/sh`, no system!


    In many cases, RPM’s dependency processing will prevent inadvertent erasures from
    causing massive problems. However, if you’re not sure, use `rpm -q` to get more
    information about the package you’d like to erase. (See Chapter 5 for more information
    on `rpm -q`.)'
  merge: -1
