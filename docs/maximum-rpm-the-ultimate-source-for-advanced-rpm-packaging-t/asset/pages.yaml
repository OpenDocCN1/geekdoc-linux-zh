  md: 'Starting at the top, we start the build with the usual command. Immediately
    following the command, RPM indicates that four packages are to be built from this
    spec file. The `%prep`, `%build`, and `%install` scripts then execute as usual.


    Next, RPM executes its special `%doc` internal script, even though we haven''t
    declared any files to be documentation. It''s worth noting, however, that the
    `DOCDIR` environment variables show that if the spec file had declared some of
    the files as documentation, RPM would have created the appropriate documentation
    directories for each of the packages.


    At this point, RPM creates the binary packages. As you can see, each package contains
    the file defined in its `%files` list.


    Finally, the source package file is created. It contains the spec file and the
    original sources, just like any other source package.


