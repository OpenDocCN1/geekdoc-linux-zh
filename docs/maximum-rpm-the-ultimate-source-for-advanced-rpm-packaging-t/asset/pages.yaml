- pgno: 237
  md: 'RPM has the capability to give users some latitude in deciding where packages
    are to be installed on their systems. However, package builders must first design
    their packages to give users this freedom.


    That’s all well and good, but why would the ability to relocate a package be all
    that important?


    # ## 15.1. Why Relocatable Packages?


    One of the many problems that plague a system administrator’s life is disk space.
    Usually, there’s not enough of it, and if there is enough, chances are it’s in
    the wrong place. Here’s a hypothetical example:


    +   ■ Some new software comes out and is desired greatly by the user community.


    +   ■ The system administrator carefully reviews the software’s installation documentation
    prior to doing the installation. (Hey, we said it was hypothetical!) She notes
    that the software, all 150MB of it, installs into `/opt`.


    +   ■ Frowning, the sysadmin fires off a quick `df` command:


    ```

    ```

    # df

    Filesystem 1024-blocks Used Available Capacity Mounted on

    /dev/sda8 100118 28434 66514 30% /

    /dev/sda6 991995 365527 575218 39% /usr

    # ```


    ```


    Bottom line: There’s no way 150MB of new software is going to fit on the root
    filesystem.


    +   ■ Sighing heavily, the sysadmin ponders what to do next. If only there were
    some way to install the software somewhere on the /usr filesystem.


    It doesn’t have to be this way. RPM has the ability to make packages that can
    be installed with a user-specified prefix tag that dictates where the software
    will actually be placed. By making packages relocatable, the package builder can
    make life easier for sysadmins everywhere. But what exactly is a relocatable package?


    A relocatable package is a package that is standard in every way, save one. When
    a prefix tag is added to a spec file, RPM will attempt to build a relocatable
    package.


    Note the word *attempt*. A few conditions must be met before a relocatable package
    can be built successfully, and this chapter covers them all. But first, let’s
    look at exactly how RPM can re-locate a package.


    # ## 15.2. The prefix tag: Relocation Central


    The best way to explain how the prefix tag is used is to step through an example.
    Here’s a sample prefix tag:


    **Prefix:** /opt'
  merge: -1
  img_proc: true
- pgno: 238
  md: "In this example, the `prefix` path is defined as `/opt`. This means that, by\
    \ default, the package will install its files under `/opt`. Let's assume that\
    \ the spec file contains the following line in its `%files` list:\n\n```\n   \
    \ /opt/bin/baz\n```\n\nIf the package is installed without any relocation, this\
    \ file will be installed in `/opt/bin`. This is identical to how a nonrelocatable\
    \ package is installed.\n\nHowever, if the package is to be relocated on installation,\
    \ the path of every file in the `%files` list is modified according to the following\
    \ steps:\n\n+   1. The part of the file's path that corresponds to the path specified\
    \ on the `prefix` tag line is removed.\n+   2. The user-specified relocation prefix\
    \ is prepended to the file's path.\n\nUsing our `/opt/bin/baz` file as an example,\
    \ let's assume that the user installing the package wishes to override the default\
    \ prefix (`/opt`) with a new prefix, say `/usr/local/opt`. Following the previous\
    \ steps, we first remove the original prefix from the file's path:\n\n```\n  \
    \  /opt/bin/baz becomes /bin/baz\n```\n\nNext, we add the user-specified prefix\
    \ to the front of the remaining part of the filename:\n\n```\n    /usr/local/opt\
    \ + /bin/baz = /usr/local/opt/bin/baz\n```\n\nNow that the file's new path has\
    \ been created, RPM installs the file normally. This part of it seems simple enough,\
    \ and it is. But as mentioned earlier, there are a few things the package builder\
    \ needs to consider before getting on the relocatable package bandwagon.\n\n#\
    \ 15.3. Relocatable Wrinkles: Things to Consider\n\nWhile it's certainly no problem\
    \ to add a `prefix` tag line to a spec file, it's necessary to consider a few\
    \ other issues:\n\n+   * Every file in the `%files` list must start with the path\
    \ specified on the `prefix` tag line.\n+   * The software must be written such\
    \ that it can operate properly if relocated. Absolute symlinks are a prime example\
    \ of this.\n+   * Other software must not rely on the relocatable package being\
    \ installed in any particular location.\n\nLet's cover each of these issues, starting\
    \ with the `%files` list."
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 15.3.1. %files List Restrictions


    As mentioned earlier, each file in the `%files` list must start with the relocation
    prefix. If this isn’t done, the build will fail:


    ```

    # rpm -ba cdplayer-1.0.spec

    * Package: cdplayer

    + umask 022

    + echo Executing: %prep

    ***

    Binary Packaging: cdplayer-1.0-1

    Package Prefix = usr/local

    File doesn’t match prefix (usr/local): /usr/doc/cdplayer-1.0-1

    File not found: /usr/doc/cdplayer-1.0-1

    Build failed.

    ```


    In our example, the build proceeded normally until the time came to create the
    binary package file. At that point RPM detected the problem. The error message
    says it all: The prefix line in the spec file (usr/local) was not present in the
    first part of the file’s path (/usr/doc/cdplayer-1.0-1). This stopped the build
    in its tracks.


    The fact that every file in a relocatable package must be installed under the
    directory specified in the prefix line raises some issues. For example, what about
    a program that reads a configuration file normally kept in /etc? This question
    leads right into our next section.


    # 15.3.2. Relocatable Packages Must Contain Relocatable Software


    While this section’s title seems pretty obvious, it’s not always easy to tell
    if a particular piece of software can be relocated. Let’s take a look at the question
    raised at the end of the previous section. If a program has been written to read
    its configuration file from /etc, there are three possible approaches to making
    that program relocatable:


    +   - Set the prefix to /etc and package everything under /etc.

    +   - Package everything somewhere other than /etc and leave out the config file
    entirely.

    +   - Modify the program.


    The first approach would certainly work from a purely technical standpoint, but
    not many people would be happy with a program that installed itself in /etc. So
    this approach isn’t viable.


    The second approach might be more appropriate, but it forces users to complete
    the install by having them create the config file themselves. If RPM’s goal is
    to make software easier to install and remove, this is not a viable approach either!


    The final approach might be the best. Once the program is installed, when the
    rewritten software is first run, it can see that no configuration file exists
    in /etc and create one. However, even though this would work, when the time came
    to erase the package, the config file would be left behind. RPM had never installed
    it, so RPM couldn’t get rid of it. There’s also the fact that this approach is
    probably more labor intensive than most package builders would like.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'None of these approaches are very appealing, are they? Some software just doesn''t
    relocate very well. In general, the following things are warning signs that relocation
    is going to be a problem:


    +   - The software contains one or more files that must be installed in specific
    directories.

    +   - The software refers to system files using relative paths (which is really
    just another way of saying that the software must be installed in a particular
    directory).


    If these kinds of issues crop up, making the software relocatable is going to
    be tough.


    # ### 15.3.3. The Relocatable Software Is Referenced by Other Software


    Even assuming that the software is written so that it can be put in a relocatable
    package, there still might be a problem, which relates not to the relocatable
    software itself, but to other programs that reference the relocatable software.


    For example, there are times when a package needs to execute other programs. This
    might include backup software that needs to send mail, or a communications program
    that needs to compress files. If these underlying programs were relocatable, and
    not installed where other packages expect them, they would be of little use.


    Granted, this isn''t a common problem, but it can happen. And for the package
    builder interested in building relocatable packages, it''s an issue that needs
    to be explored. Unfortunately, this type of problem can be the hardest to find.


    If, however, a software product has been found to be relocatable, the mechanics
    of actually building a relocatable package are pretty straightforward. Let''s
    give it a try.


    # ## 15.4. Building a Relocatable Package


    For this example, we''ll use our tried-and-true cdp1ayer application. Let''s start
    by reviewing the spec file for possible problems:


    ```

    ""#

    # Sample spec file for cdp1ayer app...

    #

    Summary: A CD player app that rocks!

    Name: cdp1ayer

    ...

    %files

    %doc README

    /usr/local/bin/cdp

    /usr/local/bin/cdplay

    %doc /usr/local/man/man1/cdp.1

    %config /etc/cdp-config"

    ```


    Everything looks all right, except for the `%files` list. There are files in `/usr/local/bin`,
    a man page in `/usr/local/man/man1`, and a config file in `/etc`. The prefix `/usr/local`
    would work pretty well, except for that `cdp-config` file.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'For the sake of this first build, we’ll declare the config file unnecessary
    and remove it from the `%files` list. We’ll then add a prefix tag line, setting
    the prefix to `/usr/local`. After these changes are made, let’s try a build:


    ```

    # rpm -ba cdplayer-1.0.spec

    \* Package: cdplayer

    \+ umask 022

    \+ echo Executing: %prep

    Executing: %prep

    \+ cd /usr/src/redhat/BUILD

    \+ cd /usr/src/redhat/BUILD

    \+ rm -rf cdplayer-1.0

    \+ gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz

    ....

    Binary Packaging: cdplayer-1.0-1

    Package Prefix = usr/local

    File doesn’t match prefix (usr/local): /usr/doc/cdplayer-1.0-1

    File not found: /usr/doc/cdplayer-1.0-1

    Build failed.

    ```


    The build proceeded normally up to the point of actually creating the binary package.
    The `Package Prefix = usr/local` line confirms that RPM picked up our prefix tag
    line. But the build stopped—and on a file called `/usr/doc/cdplayer-1.0-1`. But
    that file isn’t even in the `%files` list. What’s going on?


    Take a closer look at the `%files` list. See the line that reads `%doc README?`
    In Section 13.6.1 in Chapter 13, “Inside the Spec File,” we discussed how the
    `%doc` directive creates a directory under `/usr/doc`. That’s the file that killed
    the build—the directory created by the `%doc` directive.


    Let’s temporarily remove that line from the `%files` list and try again:


    ```

    # rpm -ba cdplayer-1.0.spec

    \* Package: cdplayer

    \+ umask 022

    \+ echo Executing: %prep

    Executing: %prep

    \+ cd /usr/src/redhat/BUILD

    \+ cd /usr/src/redhat/BUILD

    \+ rm -rf cdplayer-1.0

    \+ gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz

    ....

    Binary Packaging: cdplayer-1.0-1

    Package Prefix = usr/local

    Finding dependencies...

    Requires (2): libc.so.5 libncurses.so.2.0

    bin/cdp

    bin/cdplay

    man/man1/cdp.1

    90 blocks

    Generating signature: 0

    Wrote: /usr/src/redhat/RPMS/i386/cdplayer-1.0-1.i386.rpm

    \+ umask 022

    \+ echo Executing: %clean

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Executing: %clean


    + cd /usr/src/redhat/BUILD


    + cd cdplayer-1.0


    + exit 0


    Source Packaging: cdplayer-1.0-1


    cdplayer-1.0.spec


    cdplayer-1.0.tgz


    82 blocks


    Generating signature: 0


    Wrote: /usr/src/redhat/RPMS/i/cdplayer-1.0-1.src.rpm


    The build completed normally. Note how the files to be placed in the binary package
    file are listed, minus the prefix /usr/local. Some of you might be wondering why
    the cdp.1 file didn''t cause problems. After all, it had a %doc directive, too.
    The answer lies in the way the file was specified. Since the file was specified
    using an absolute path, and that path started with the prefix /usr/local, there
    was no problem. A more complete discussion of the %doc directive can be found
    in section 13.6.1 in Chapter 13.


    # ### 15.4.1. Tying Up the Loose Ends


    In the course of building this package, we ran into two hitches:


    +   - The config file cdp-config couldn''t be installed in /etc.

    +   - The README file could not be packaged using the %doc directive.


    Both of these issues are due to the fact that the files'' paths do not start with
    the default prefix path /usr/local. Does this mean that this package cannot be
    relocated? Possibly, but there are two options to consider. The first option is
    to review the prefix. For our example, if we chose the prefix /usr instead of
    /usr/local, the README file could be packaged using the %doc directive since the
    default documentation directory is /usr/doc. Another approach would be to use
    the %docdir directive to define another documentation-holding directory somewhere
    along the prefix path. (For more information on the %docdir directive, see section
    13.6.2 in Chapter 13.)


    This approach wouldn''t work for /etc/cdp-config, though. To package that file,
    we''d need to resort to more extreme measures. Basically, this approach would
    entail packaging the file in an acceptable directory (something under /usr/local)
    and using the %post postinstall script to move the file to /etc. Pointing a symlink
    at the config file is another possibility.


    Of course, this approach has some problems. First, you''ll need to write a %postun
    script to undo what the %post script does. (Install and erase-time scripts have
    an environment variable, **RPM_INSTALL_PREFIX**, that can be used to write scripts
    that are able to act appropriately if the package is relocated. See section 13.3.2
    in Chapter 13 for more information.) A verification script that made sure the
    files were in place would be nice, too. Second, because the file or symlink wasn''t
    installed by RPM, there''s no entry for it in the RPM database. This reduces the
    utility of `RPM`''s `-c` and `-o` options when issuing queries. Finally, if you
    actually move files around'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'using the %post script, the files you move will not verify properly, and when
    the package is erased, your users will get some disconcerting messages when RPM
    can''t find the moved files to erase them. If you have to resort to these kinds
    of tricks, it''s probably best to forget trying to make the package relocatable.


    # 15.4.2. Test-Driving a Relocatable Package


    Looks like cdplayer is a poor candidate for being made relocatable. However, since
    we did get a hamstrung version to build successfully, we can use it to show how
    to test a relocatable package. First, let''s see if the binary package file''s
    prefix has been recorded properly. We can do this by using the --queryformat option
    to RPM''s query mode:


    ```

    # rpm -q --queryformat ''%{DEFAULTPREFIX}\n'' cdplayer-1.0-1.i386.rpm

    /usr/local

    #

    ```


    The **DEFAULTPREFIX** tag directs RPM to display the prefix used during the build.
    As we can see, it''s /usr/local, just as we intended. The --queryformat option
    is discussed in section 5.2.2 of Chapter 5, "Getting Information About Packages."


    So it looks like we have a relocatable package. Let''s try a couple installs and
    see if we really can install it in different locations. First, let''s try a regular
    install with no prefix specified:


    ```

    # rpm -Uvh cdplayer-1.0-1.i386.rpm

    cdplayer ################################################################

    #

    ```


    That seemed to work well enough. Let''s see if the files went where we intended:


    ```

    # ls -a1 /usr/local/bin

    total 558

    -rwxr-xr-x 1 root root 40739 Oct 7 13:23 cd*

    lrwxrwxrwx 1 root root 18 Oct 7 13:40 cdplay -> /usr/local/bin/cdp*

    ...

    # ls -a1 /usr/local/man/man1

    total 9

    -rwxr-xr-x 1 root root 4550 Oct 7 13:23 cdpl.1*

    ...

    #

    ```


    Looks good. Let''s erase the package and reinstall it with a different prefix:


    ```

    # rpm -e cdplayer

    # rpm -Uvh --prefix /usr/foonly/blather cdplayer-1.0-1.i386.rpm

    cdplayer ################################################################

    #

    ```


    Note that directories foonly and blather didn''t exist prior to installing cdplayer.'
  merge: -1
  img_proc: true
- pgno: 244
  md: "RPM has another tag that can be used with the `--queryformat` option. It’s\
    \ called `INSTALLPREFIX`, and using it displays the prefix under which a package\
    \ was installed. Let’s give it a try:\n\n```\n```\n# rpm -q --queryformat '%{INSTALLPREFIX}\\\
    n' cdp player\n/usr/foonly/blather\n#\n```\n```\n\nAs you can see, it displays\
    \ the prefix you entered on the command line. Let’s see if the files were installed\
    \ as directed:\n\n```\n```\n# cd /usr/foonly/blather/\n# ls -al\ntotal 2\ndrwxr-xr-x\
    \ 2 root root 1024 Oct 7 13:45 bin/\ndrwxr-xr-x 3 root root 1024 Oct 7 13:45 man/\n\
    #\n```\n```\n\nSo far, so good—the proper directories are there. Let’s look at\
    \ the man page first:\n\n```\n```\n# cd /usr/foonly/blather/man/man1/\n# ls -al\n\
    total 5\n-rwxr-xr-x 1 root root 4550 Oct 7 13:23 cdp.1*\n#\n```\n```\n\nThat looks\
    \ okay. Now on to the files in bin:\n\n```\n```\n# cd /usr/foonly/blather/bin\n\
    # ls -al\ntotal 41\n-rwxr-xr-x 1 root root 40739 Oct 7 13:23 cdp*\n1rwxrwxrwx\
    \ 1 root root 18 Oct 7 13:45 cdp1ay -> /usr/local/bin/cdp\n```\n```\n\nUh-oh.\
    \ That `cdp1ay` symlink isn’t right. What happened? If we look at `cdp1ay`’s makefile,\
    \ we see the answer:\n\n```\n```\ninstall: cdp cdp.1.Z\n... \nln -s /usr/local/bin/cdp\
    \ /usr/local/bin/cdp1ay\n```\n```\n\nAh, when the software is installed during\
    \ `RPM`’s build process, the makefile sets up the symbolic link. Looking back\
    \ at the `%files` list, we see `cdp1ay` listed. `RPM` blindly packaged the symlink,\
    \ complete with its nonrelocatable string. This is why we mentioned absolute symlinks\
    \ as a prime example of nonrelocatable software.\n\nFortunately, this problem\
    \ isn’t that difficult to fix. All we need to do is change the line in the makefile\
    \ that creates the symlink from this:\n\n```\n```\nln -s /usr/local/bin/cdp /usr/local/bin/cdp1ay\n\
    ```\n```\n\nto this:\n\n```\n```\nln -s ./cdp /usr/local/bin/cdp1ay\n```\n```\n\
    \nNow `cdp1ay` will always point to `cdp`, no matter where it’s installed. When\
    \ building relocatable packages, relative symlinks are your friend!"
  merge: -1
  img_proc: true
- pgno: 245
  md: "After rebuilding the package, let’s see if our modifications have the desired\
    \ effect. First, a normal install with the default prefix:\n\n```\n```bash\n#\
    \ rpm -Uvh --nodeps cdplayer-1.0-1.i386.rpm\ncdplayer #############################################\n\
    # cd /usr/local/bin/\n# ls -al cdplay\nlrwxrwxrwx 1 root root 18 Oct 8 22:32 cdplay\
    \ -> ./cdp*\n```\n```\n\nNext, we’ll try a second install using the `--prefix`\
    \ option (after we first delete the original package):\n\n```\n```bash\n# rpm\
    \ -e cdplayer\n# rpm -Uvh --nodeps --prefix /a/dumb/prefix cdplayer-1.0-1.i386.rpm\n\
    cdplayer #############################################\n# cd /a/dumb/prefix/bin/\n\
    # ls -al cdplay\nlrwxrwxrwx 1 root root 30 Oct 8 22:34 cdplay -> ./cdp*\n# \n\
    ```\n```\n\nAs you can see, the trickiest part about building relocatable packages\
    \ is making sure the software you’re packaging is up to the task. Once that part\
    \ of the job is done, the actual modifications are straightforward."
