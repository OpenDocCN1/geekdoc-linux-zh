- pgno: 213
  md: 'Here are the resulting commands:


    ```

    echo "Patch @0:"

    patch -p0 -s < /usr/src/redhat/SOURCES/patch-zero

    ```


    The `%patch` macro nicely displays a message showing that a patch is being applied,
    and then invokes the `patch` command to actually do the dirty work. There are
    two options to the `patch` command:


    +   - The `-p` option, which directs `patch` to remove the specified number of
    slashes (and any intervening directories) from the front of any filenames specified
    in the patch file. In this case, nothing will be removed.

    +   - The `-s` option, which directs `patch` to apply the patch without displaying
    any informational messages. Only errors from `patch` will be displayed.


    How did the `%patch` macro know which patch to apply? Keep in mind that, like
    the source tag lines, every patch tag is numbered, starting at `0`. The `%patch`
    macro, by default, applies the patch file named on the `patch` (or `patch0`) tag
    line.


    # 13.4.2.1. Specifying Which patch Tag to Use


    The `%patch` macro actually has two different ways to specify the `patch` tag
    line it is to use. The first method is to simply append the number of the desired
    `patch` tag to the end of the `%patch` macro itself. For example, in order to
    apply the patch specified on the `patch2` tag line, the following `%patch` macro
    could be used:


    ```

    %patch2

    ```


    The other approach is to use the `-P` option. This option is followed by the number
    of the `patch` tag line desired. Therefore, this line is identical in function
    to the previous one:


    ```

    %patch -P 2

    ```


    Note that the `-P` option will not apply the file specified on the `patch0` line,
    by default. Therefore, if you choose to use the `-P` option to specify `patch`
    numbers, you''ll need to use the following format when applying patch `0`:


    ```

    %patch -P 0

    ```


    # 13.4.2.2. -p <#>: Strip <> Leading Slashes and Directories from patch Filenames


    The `-p` (note the lowercase `p`) option is sent directly to the `patch` command.
    It is followed by a number, which specifies the number of leading slashes (and
    the directories in between) to strip from any filenames present in the patch file.
    For more information on this option, consult the `patch` man page.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 13.4.2.3. -b <name>: Set the Backup File Extension to <name>


    When the patch command is used to apply a patch, unmodified copies of the files
    patched are renamed to end with the extension .orig. The -b option is used to
    change the extension used by patch. This is normally done when multiple patches
    are to be applied to a given file. By doing this, copies of the file as it existed
    prior to each patch are readily available.


    # 13.4.2.4. -E: Remove Empty Output Files


    The -E option is passed directly to the patch program. When patch is run with
    the -E option, any output files that are empty after the patches have been applied
    are removed.


    Now let''s take %patch on a test drive.


    # 13.4.2.5. An Example of the %patch Macro in Action


    Using the sample patch tag lines we''ve used throughout this section, let''s put
    together an example and look at the resulting commands. In our example, the first
    patch to be applied needs to have the root directory stripped. Its %patch macro
    will look like this:


    ```

    %patch -p1

    ```


    The next patch is to be applied to files in the software''s lib subdirectory,
    so we''ll need to add a cd command to get us there. We''ll also need to strip
    an additional directory:


    ```

    cd lib

    %patch -P 1 -p2

    ```


    Finally, the last patch is to be applied from the software''s top-level directory,
    so we need to cd back up a level. In addition, this patch modifies some files
    that were also patched the first time, so we''ll need to change the backup file
    extension:


    ```

    cd ..

    %patch -P 2 -p1 -b .last-patch

    ```


    Here''s what the %prep script (minus any %setup macros) looks like:


    ```

    %patch -p1

    cd lib

    %patch -P 1 -p2

    cd ..

    %patch -P 2 -p1 -b .last-patch

    ```


    And here''s what the macros expand to:


    ```

    echo "Patch #0:"

    patch -p1 -s < /usr/src/redhat/SOURCES/patch-zero

    cd lib

    echo "Patch #1:"

    patch -p2 -s < /usr/src/redhat/SOURCES/patch-one

    cd ..

    echo "Patch #2:"

    patch -p1 -b .last-patch -s < /usr/src/redhat/SOURCES/patch-two

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'No surprises here. Note that the %setup macro leaves the current working directory
    set to the software’s top-level directory, so our cd commands with their relative
    paths will do the right thing. Of course, we have environment variables available
    that could be used here, too.


    # ### 13.4.2.6. Compressed Patch Files


    If a patch file is compressed with gzip, RPM will automatically decompress it
    before applying the patch. Here’s a compressed patch file as specified in the
    spec file:


    Patch: bother-3.5-hack.patch.gz


    This is part of the script RPM will execute when the %prep section is executed:


    ```

    ```

    echo Executing: %prep

    ...

    echo "Patch #0:"

    gzip -dc /usr/src/redhat/SOURCES/bother-3.5-hack.patch.gz | patch -p1 -s

    ...```


    ```


    First, the patch file is decompressed using gzip. The output from gzip is then
    piped into patch. That’s about it for RPM’s macros. Next, let’s take a look at
    the %files list.


    # ## 13.5. The %files List


    The %files list indicates to RPM which files on the build system are to be packaged.
    The list consists of one file per line. The file may have one or more directives
    preceding it. These directives give RPM additional information about the file.


    Normally, each file includes its full path. The path performs two functions. First,
    it specifies the file’s location on the build system. Second, it denotes where
    the file should be placed when the package is to be installed. (This is not entirely
    the case when a relocatable package is being built. For more information on relocatable
    packages, see Chapter 15.)


    For packages that create directories containing hundreds of files, it can be quite
    cumbersome creating a list that contains every file. To make this situation a
    bit easier, if the %files list contains a path to a directory, RPM will automatically
    package every file in that directory, as well as every file in each subdirectory.
    Shell-style globbing, or wildcard expansion, can also be used in the %files list.


    # ## 13.6. Directives for the %files List


    The %files list may contain a number of different directives. They are used to
    do the following:


    +   * Identify documentation and configuration files

    +   * Ensure that a file has the correct permissions and ownership set'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   - Control which aspects of a file are to be checked during package verification

    +   - Eliminate some of the tedium in creating the %files list


    In the %files list, one or more directives may be placed on a line, separated
    by spaces, before one or more filenames. Therefore, if %foo and %bar are two %files
    list directives, they may be applied to a file baz in the following manner:


    ```

    %foo %bar baz

    ```


    Now it''s time to take a look at the directives that inhabit the %files list.


    # 13.6.1. File-Related Directives


    RPM processes files differently according to their types. However, RPM does not
    have a method of automatically determining file types. Therefore, it is up to
    the package builder to appropriately mark files in the %files list. This is done
    using one of the following directives.


    Keep in mind that not every file will need to be marked. As you read the following
    sections, you''ll see that directives are used only in special circumstances.
    In most packages, the majority of files in the %files list will not need to be
    marked.


    # 13.6.1.1. The %doc Directive


    The %doc directive flags the filename(s) that follow as being documentation. RPM
    keeps track of documentation files in its database so that a user can easily find
    information about an installed package. In addition, RPM can create a package-specific
    documentation directory during installation and copy documentation into it. Whether
    or not this additional step is taken depends on how a file is specified. Here
    is an example:


    ```

    %doc  README

    %doc /usr/local/foonly/README

    ```


    The file README exists in the software''s top-level directory during the build
    and is included in the package file. When the package is installed, RPM creates
    a directory in the documentation directory named the same as the package (that
    is, <software>-<version>-<release>) and copies the README file there. The newly
    created directory and the README file are marked in the RPM database as being
    documentation. The default documentation directory is /usr/doc and can be changed
    by setting the defaultdocdir rpmrc file entry. For more information on rpmrc files,
    see Appendix B.


    The file /usr/local/foonly/README was installed into that directory during the
    build and is included in the package file. When the package is installed, the
    README file is copied into /usr/local/foonly and marked in the RPM database as
    being documentation.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'The %config directive is used to flag the specified file as being a configuration
    file. RPM performs additional processing for config files when packages are erased,
    and during installations and upgrades. This is due to the nature of config files:
    They are often changed by the system administrator, and those changes should not
    be lost.


    There is a restriction to the %config directive: No more than one filename may
    follow the %config. This means that the following example is the only allowable
    way to specify config files:


    ```

    Note that the full path to the file, as it is installed at build time, is required.

    ```


    The %attr directive permits finer control over three key file attributes:


    +   - The file''s permissions, or mode

    +   - The file''s user ID

    +   - The file''s group ID


    The %attr directive has the following format:


    ```

    %attr(<mode>, <user>, <group>) file

    ```


    The mode is specified in the traditional numeric format, while the user and group
    are specified as a string, such as root. Here''s a sample %attr directive:


    ```

    %attr(755, root, root) foo.bar

    ```


    This would set foo.bar''s permissions to 755. The file would be owned by user
    root, group root. If a particular attribute does not need to be specified (usually
    because the file is installed with that attribute set properly), that attribute
    may be replaced with a dash:


    ```

    %attr(755, -, root) foo.bar

    ```


    The main reason to use the %attr directive is to permit users without root access
    to build packages. The techniques for doing this (and a more in-depth discussion
    of the %attr directive) can be found in Chapter 16.


    RPM''s ability to verify the integrity of the software it has installed is impressive.
    But sometimes it''s a bit too impressive. After all, RPM can verify as many as
    nine different aspects of every file. The %verify directive can control which
    of these file attributes are to be checked'
  merge: -1
