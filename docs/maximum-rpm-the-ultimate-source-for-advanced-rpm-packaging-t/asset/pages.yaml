    After the %prep and %build sections, the %install section is executed. Looking
    at the output, we see that RPM changes directory into cdplayer''s top-level directory
    and issues the make install command, the sole command in the %install section.
    The output from that point until the first exit 0 is from makefile''s install
    target.


    The remaining commands are due to the contents of the spec file''s %files list.
    Here''s what it looks like:


    ```

    %files

    %doc README

    /usr/local/bin/cdp

    /usr/local/bin/cdplay

    /usr/local/man1/cdp.1

    ```


    The line responsible is %doc README. The %doc tag identifies the file as being
    documentation. RPM handles documentation files by creating a directory in /usr/doc
    and placing all documentation in it. The exit 0 at the end signifies the end of
    the %install section. RPM stops due to the -bi option.


    The next step at which RPM''s build process can be stopped is after the software''s
    binary package file has been created. This is done using the -bb option.


    # 12.1.4. rpm -bb: Execute %prep, %build, %install, Package (bin)


    As stated at the end of the previous section, RPM''s -bb option performs every
    step of the build process up to the point of creating the source package file.
    At that point it stops, as shown here:


    ```

    # rpm -bb cdplayer-1.0.spec

    * Package: cdplayer

    Executing: %prep

    ...

    + exit 0

    Executing: %build

    ...

    + exit 0

    Executing: %install

    ...

    ```'
