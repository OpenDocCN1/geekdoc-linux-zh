- pgno: 259
  md: 'In this chapter, we''ll explore the steps required to add a digital signature
    to a package using the software known as Pretty Good Privacy, or PGP. If you''ve
    used PGP before, you probably know everything you''ll need to start signing packages
    in short order.


    On the other hand, if you feel you need a bit more information on PGP before starting,
    see Appendix G, "An Introduction to PGP," for a brief introduction. When you feel
    comfortable with PGP, come on back and learn how easy signing packages is.


    # ### 17.1. Why Sign a Package?


    The reason for signing a package is to provide authentication. With a signed package,
    it''s possible for your user community to verify that the package they have in
    their possession at some time and has not been changed since then. That "not changed"
    part is also a good reason to sign your packages, because digital signatures are
    a very robust way to guard against any modifications to the package.


    Of course, as with anything else in life, adding a digital signature to a package
    isn''t an ironclad guarantee that everything is right with the package, but it''s
    about as sure a thing as humans can make it.


    # ### 17.2. Getting Ready to Sign


    Okay, we''ve convinced you that signing packages is a good idea. Now we''ve got
    to make sure PGP and RPM are up to the task. As you might imagine, there are two
    parts to this process: one for PGP, and one for RPM. Let''s get GPG ready first.


    # #### 17.2.1. Preparing PGP: Creating a Key Pair


    There is really very little to do done to PGP, assuming it''s been installed properly.
    The only thing required is to generate a key pair. As mentioned in our mini-primer
    on PGP, the key pair consists of a secret key and a public key. In terms of signing
    packages, you will use your secret key to do the actual signing. Anyone interested
    in checking your signature will need your public key.


    Creating a key pair is quite simple. All that''s required is to issue a `pgp -kg`
    command, enter some information, and create some random bits. Here''s a sample
    key-generating session:


    ```

    ```text

    # pgp -kg

    Pretty Good Privacy(tm) 2.6.3a - Public-key encryption for the masses.

    (c) 1990-96 Phillip Zimmermann, Phil''s Pretty Good Software. 1996-03-04

    Uses the RSAREF(tm) Toolkit, which is copyright RSA Data Security, Inc.

    Distributed by the Massachusetts Institute of Technology.

    Export of this software may be restricted by the U.S. government.

    Current time: 1996/10/31 00:42 GMT

    ```

    ```'
