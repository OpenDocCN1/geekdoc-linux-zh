  md: 'Looking in the toolds and config directories where we did all our work, we
    see that there are still emacs save files there. A bit of studying confirms that
    the makefiles don''t bother to clean these two directories. That''s a nice touch
    because a make clean won''t wipe out old copies of the config files, giving you
    a chance to go back to them in case you''ve botched something. However, in our
    case, we''re sure we won''t need the save files, so out they go:


    ```

    # cd /usr/src/redhat/SOURCES/amanda-2.3.0

    # find . -name "*" -exec rm -vf .

    ./config/config.h

    ./config/options.h

    ./toosls/munge

    #

    ```


    We let find take a look at the whole directory tree, just in case there was something
    still out there that we''d forgotten about. As you can see, the only save files
    are from the three files we''ve been working on.


    You''ll note that we''ve left our modified munge file, as well as the config.h
    and options.h files we so carefully crafted. That''s intentional, as we want to
    make sure those changes are applied when RPM patches the sources. Everything looks
    pretty clean, so it''s time to make the patches.


    # 20.3.1.2. Actually Generating Patches


    This step is actually pretty anticlimactic:


    ```

    # diff -uNr amanda-2.3.0-orig/ amanda-2.3.0/ > amanda-2.3.0-linux.patch

    ```


    With that one command, we''ve compared each file in the untouched directory tree
    (amanda-2.3.0-orig) with the directory tree we''ve been working in (amanda-2.3.0).
    If we''ve done our homework, the only things in the patch file should be related
    to the files we''ve changed. Let''s take a look through it to make sure:


    ```

    # cd /usr/src/redhat/SOURCES

    # cat amanda-2.3.0-linux.patch

    diff -uNr amanda-2.3.0-orig/config/config.h amanda-2.3.0/config/config.h

    --- amanda-2.3.0-orig/config/config.h Wed Dec 31 19:00:00 1969

