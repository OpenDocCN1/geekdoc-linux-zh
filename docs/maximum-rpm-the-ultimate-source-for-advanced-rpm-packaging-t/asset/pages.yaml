  md: '**Table 12.1. Build-mode command syntax and options.**


    rpm -b <stage> *Options* file1.spec...fileN.spec


    | | | <stage> | Section |

    |---|---|---|---|

    | p | | Execute %prep | 12.1.1 |

    | c | | Execute %prep, %build | 12.1.2 |

    | i | | Execute %prep, %build, %install | 12.1.3 |

