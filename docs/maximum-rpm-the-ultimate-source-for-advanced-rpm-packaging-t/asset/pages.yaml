  img_proc: true
- pgno: 171
  md: 'But there’s another way. Just follow these steps:


    +   1. Place the original source tar file in RPM’s SOURCES directory.

    +   2. Create a partial spec file in RPM’s SPECS directory (be sure to include
    a valid Source line).

    +   3. Issue an `rpm -bp` to properly create the build environment.


    Now use --short-circuit to attempt a compile. Here’s an example:


    ```

    ```text

    # rpm -bc --short-circuit cdplayer-1.0.spec

    * Package: cdplayer

    + umask 022

    + echo Executing: %build

    Executing: %build

    + cd /usr/src/redhat/BUILD

    + cd cdplayer-1.0

    + make

    gcc -Wall -O2 -c -I/usr/include/ncurses cdp.c

    gcc -Wall -O2 -c -I/usr/include/ncurses color.c

    gcc -Wall -O2 -c -I/usr/include/ncurses display.c

    gcc -Wall -O2 -c -I/usr/include/ncurses misc.c

    gcc -Wall -O2 -c -I/usr/include/ncurses volume.c

    volume.c:67: warning: implicit declaration of function ‘ioctl''

    gcc -Wall -O2 -c -I/usr/include/ncurses hardware.c

    gcc -Wall -O2 -c -I/usr/include/ncurses database.c

    gcc -Wall -O2 -c -I/usr/include/ncurses getline.c

    gcc -o cdp cdp.o color.o display.o misc.o volume.o

    hardware.o database.o getline.o -I/usr/include/ncurses

    -L/usr/lib -lncurses

    groff -Tascii -man cdp.1 | compress >cdp.1.Z

    + exit 0

    ```


    ```


    Normally, the -bc option instructs RPM to stop the build after the %build section
    of the spec file has been executed. By adding --short-circuit, however, RPM starts
    the build by executing the %build section and stops when everything in %build
    has been executed.


    There is only one other build stage that can be --short-circuited: the install
    stage. The reason for this restriction is to make it difficult to bypass RPM’s
    use of pristine sources. If it were possible to --short-circuit to -bp -ba, a
    package builder might take the easy way out and simply hack at the build tree
    until the software built successfully, then package the hacked sources. So, RPM
    will only --short-circuit to -bc or -bi. Nothing else will do.


    What exactly does an rpm -bi --short-circuit do, anyway? Like an rpm -bc --short-circuit,
    it starts executing at the named stage, which in this case is %install. Note that
    the build environment must be ready to perform an install before attempting to
    --short-circuit to the %install stage. If the software installs via make install,
    make will automatically compile the software anyway.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'And what happens if the build environment isn''t ready and a `--short-circuit`
    is attempted? Let''s see:


    ```

    # rpm -bi --short-circuit ccdplayer-1.0.spec

    \* Package: ccdplayer

