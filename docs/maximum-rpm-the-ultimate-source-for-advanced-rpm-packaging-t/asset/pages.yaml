- pgno: 305
  md: 'The client package enable a network-capable system to have its file systems
    backed up by a system running the Amanda server.


    NOTE: In order for a system to perform backups of itself, install both the client
    and server packages!


    The %package directive names the package. Because we wanted the subpackages to
    be named amanda-<something>, we didn''t use the -n option. This means our client
    subpackage will be called amanda-client, just as we wanted. RPM requires unique
    summary, %description, and group tags for each subpackage, so we''ve included
    them. Of course, it would be a good idea even if RPM didn''t require them\u2014we''ve
    used the tags to provide client-specific information.


    The requires tag is the only other tag in the client subpackage. Because amanda
    uses dump on the client system, we included this tag so that RPM will ensure that
    the dump package is present on client systems.


    Next, let''s take a look at the tags for the server subpackage:


    ```

    %package server

    Summary: Server-side Amande package

    Group: System/Backup

    %description server

    The Amande Network Backup system contains software necessary to automatically
    perform backups across a network. Amande consists of two package -- a client,
    and a server (this package):


    The server package enables a network-capable system to control one or more Amande
    client systems performing backups. The server system will direct all backups to
    a locally attached tape drive. Therefore, the server system requires a tape drive.

    ```


    NOTE: In order for a system to perform backups of itself, install both the client
    and server packages!


    No surprises here, really. You''ll note that the server subpackage has no requires
    tag for the dump package. The reason for that is due to a design decision we''ve
    made. Since amanda is comprised of a client and a server component, in order for
    the server system to perform backups of itself, the client component must be installed.
    Since we''ve already made the client subpackage require dump, we''ve already covered
    the bases.


    Since an amanda server cannot back itself up without the client software, why
    don''t we have the server subpackage require the client subpackage? Well, that
    could be done, but the fact of the matter is that there are cases where an amanda
    server won''t need to back itself up. So the server subpackage needs no package
    requirements.


    # 20.3.2.1. Adding the Build-Time Scripts


    Next we need to add the build-time scripts. There''s really not much to them:


    ```

    %prep

    %setup

    ```'
