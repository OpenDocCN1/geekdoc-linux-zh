- pgno: 207
  md: 'This option simply creates the directory and changes directory into it before
    unpacking the sources. Here''s what it looks like:


    ```

    cd /usr/src/redhat/BUILD

    rm -rf cdplayer-1.0

    mkdir -p cdplayer-1.0

    cd cdplayer-1.0

    gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz | tar -xvff -

    if [ $? -ne 0 ]; then

    exit $?

    fi

    cd /usr/src/redhat/BUILD/cdplayer-1.0

    chown -R root.root .

    chmod -R a+rX,g-w,o-w .

    ```


    The only changes from using %setup with no options are the mkdir and cd commands,
    prior to the commands that unpack the sources. Note that you can use the -n option
    along with -c, so something like %setup -c -n blather works as expected.


    # 13.4.1.3. -D: Do Not Delete Directory Before Unpacking Sources


    The -D option keeps the %setup macro from deleting the software''s top-level directory.
    This option is handy when the sources being unpacked are to be added to an already-existing
    directory tree. This would be the case when more than one %setup macro is used.
    Here''s what %setup does when the -D option is employed:


    ```

    cd /usr/src/redhat/BUILD

    gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz | tar -xvff -

    if [ $? -ne 0 ]; then

    exit $?

    fi

    cd cdplayer-1.0

    cd /usr/src/redhat/BUILD/cdplayer-1.0

    chown -R root.root .

    chmod -R a+rX,g-w,o-w .

    ```


    As advertised, the rm prior to the tar command is gone.


    # 13.4.1.4. -T: Do Not Perform Default Archive Unpacking


    The -T option disables %setup''s normal unpacking of the archive file specified
    on the source0 line. Here''s what the resulting commands look like:


    ```

    cd /usr/src/redhat/BUILD

    rm -rf cdplayer-1.0

    cd cdplayer-1.0

    cd /usr/src/redhat/BUILD/cdplayer-1.0

    chown -R root.root .

    chmod -R a+rX,g-w,o-w .

    ```


    Doesn''t make much sense, does it? There''s a method to this madness. We''ll see
    the -T in action in the next section.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "# ## 13.4.1.5. -b <n>: Unpack the nth Sources Before Changing Directory\n\n\
    The *-b* option is used in conjunction with the *source* tag. Specifically, it\
    \ is used to identify which of the numbered source tags in the spec file are to\
    \ be unpacked.\n\nThe *-b* option requires a numeric argument matching an existing\
    \ source tag. If a numeric argument is not provided, the build will fail:\n\n\
    ```\n# rpm -ba cdplayer-1.0.spec\nPackage: cdplayer\nNeed arg to %setup -b\nBuild\
    \ failed.\n#\n```\n\nRemembering that the first source tag is implicitly numbered\
    \ 0, let’s see what happens when the %setup line is changed to `%setup -b 0`:\n\
    \n```\ncd /usr/src/redhat/BUILD\nrm -rf cdplayer-1.0\ngzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz\
    \ | tar -xvvf -\nif [ $? -ne 0 ]; then\n    exit $?\nfi\ngzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz\
    \ | tar -xvvf -\nif [ $? -ne 0 ]; then\n    exit $?\nfi\ncd cdplayer-1.0\ncd /usr/src/redhat/BUILD/cdplayer-1.0\n\
    chown -R root.root .\nchmod -R a+rX,g-w,o-w .\n```\n\nThat’s strange. The sources\
    \ were unpacked twice. It doesn’t make sense until you realize that this is why\
    \ there is a *-T* option. Since *-T* disables the default source file unpacking,\
    \ and *-b* selects a particular source file to be unpacked, the two are meant\
    \ to go together, like this:\n\n```\n%setup -T -b 0\n```\n\nLooking at the resulting\
    \ commands, we find this:\n\n```\ncd /usr/src/redhat/BUILD\nrm -rf cdplayer-1.0\n\
    gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz | tar -xvvf -\nif [ $? -ne 0\
    \ ]; then\n    exit $?\nfi\ncd cdplayer-1.0\ncd /usr/src/redhat/BUILD/cdplayer-1.0\n\
    chown -R root.root .\nchmod -R a+rX,g-w,o-w .\n```\n\nThat’s more like it! Let’s\
    \ go on to the next option."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# 13.4.1.6. -a <n>: Unpack the nth Sources After Changing Directory\n\nThe\
    \ -a option works similarly to the -b option, except that the sources are unpacked\
    \ after changing directory into the top-level build directory. Like the -b option,\
    \ -a requires -T in order to prevent two sets of unpacking commands. Here are\
    \ the commands that a %setup -T -a 0 line would produce:\n\n```\n```\ncd /usr/src/redhat/BUILD\n\
    rm -rf cdp layer-1.0\ncd cdplayer-1.0\ngzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz\
    \ | tar -xvvf -\nif [ $? -ne 0 ]; then\n    exit $?\nfi\ncd /usr/src/redhat/BUILD/cdplayer-1.0\n\
    chown -R root.root .\nchmod -R arwX,g-w,o-w .\n```\n```\n\nNote that there is\
    \ no mkdir command to create the top-level directory prior to issuing a cd into\
    \ it. In our example, adding the -c option will make things right:\n\n```\n```\n\
    cd /usr/src/redhat/BUILD\nrm -rf cdp layer-1.0\nmkdir -p cdplayer-1.0\ncd cdplayer-1.0\n\
    gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz | tar -xvvf -\nif [ $? -ne 0\
    \ ]; then\n    exit $?\nfi\ncd /usr/src/redhat/BUILD/cdplayer-1.0\nchown -R root.root\
    \ .\nchmod -R arwX,g-w,o-w .\n```\n```\n\nThe result is the proper sequence of\
    \ commands for unpacking a tar file with no top-level directory.\n\n# 13.4.1.7.\
    \ Using %setup in a Multisource Spec File\n\nIf all these interrelated options\
    \ seem like overkill for unpacking a single source file, you're right. The real\
    \ reason for the various options is to make it easier to combine several separate\
    \ source archives into a single, buildable entity. Let's see how they work in\
    \ that type of environment.\n\nFor the purposes of this example, our spec file\
    \ will have the following three source tags (yes, the source tags should include\
    \ a URL pointing to the sources):\n\n```\n```source: source-zero.tar.gz\nsource1:\
    \ source-one.tar.gz\nsource2: source-two.tar.gz\n```\n```\n\nTo unpack the first\
    \ source is not hard; all that's required is to use %setup with no options:\n\n\
    ```\n`%setup`\n```"
  merge: -1
