    # 5.2.3. Getting a Lot More Information with `-vv`


    Sometimes it''s necessary to have even more information than we can get with `-v`.
    By adding another `v`, we can start to see more of `RPM`''s inner workings:


    ```

    ```

    # rpm -qvv rpm

    D: opening database in /var/lib/rpm/

    D: querying record number  2341208

    rpm:2.3.1

    #

    ```

    ```


    The lines starting with `D:` have been added by using `-vv`. We can see where
    the `RPM` database is located and what record number contains information on the
    `rpm-2.3.1` package. Following that is the usual output.


    In the vast majority of cases, it will not be necessary to use `-vv`. It is normally
    used by software engineers working on `RPM` itself, and the output can change
    without notice. However, it''s a handy way to gain insight into `RPM`''s inner
    workings.


    # 5.2.4. `--root <path>`: Use `<path>` As an Alternate Root


    Adding `--root <path>` to a query command forces `RPM` to assume that the directory
    specified by `<path>` is actually the root directory. In addition, `RPM` expects
    its database to reside in the directory specified by the default `rpmdir` file
    entry, relative to `<path>`.


    Normally, this option is only used during an initial system install or when a
    system has been booted off a rescue disk and some packages need to be re-installed
    in order to restore normal operation.'
