- pgno: 25
  md: "# 1.1. What Are Packages and Why Manage Them?\n\nTo determine what packages\
    \ are and why it's important to manage them, let's go back to the basics for a\
    \ moment. Computers process information. To process information you must have\
    \ a few things:\n\n+   - A computer (obviously)\n+   - Some information to process\
    \ (also obviously)\n+   - A program to do the processing (still pretty obviously)\n\
    \nUnless these three things come together, very little information processing\
    \ is going to happen. But each of these items has its own requirements that need\
    \ to be satisfied before things can get exciting.\n\nTake the computer, for example.\
    \ While it needs things such as electricity and a cool, dry place to operate,\
    \ it also needs access to the other two items—information and programs—in order\
    \ to do its thing. The way to get information and programs into a computer is\
    \ to place them in the computer's mass storage. These days, mass storage invariably\
    \ means a disk drive. Putting information and programs on the disk drive means\
    \ that they are stored as files.\n\nOkay, let's look at the information. Does\
    \ information have any particular needs? Well, it needs sufficient space on the\
    \ disk drive, but more importantly, it needs to be in the proper format for the\
    \ program that will be processing it. That's it for information.\n\nFinally, we\
    \ have the program. What does it need? Like the information, it needs sufficient\
    \ disk space on the disk drive. But there are many other things it might need:\n\
    \n+   - It might need information to process, in the correct format, named properly,\
    \ and in the appropriate area on a disk drive.\n+   \n+   - It might need one\
    \ or more configuration files. These are files that control the program's behavior\
    \ and permit some level of customization. Like the information, these files must\
    \ be in the proper format, named properly, and in the appropriate area on a disk.\
    \ We'll be referring to them by their other name—config files—throughout the book.\n\
    +   \n+   - It might need to have work areas on a disk and need to be named properly\
    \ and located in the appropriate area.\n+   \n+   - It might even need other programs,\
    \ each with their own requirements.\n+   \n+   - Although not strictly required\
    \ by the program itself, the program might come with one or more files containing\
    \ documentation. These files can be very handy for the humans trying to get the\
    \ program to do their bidding!"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'As you can imagine, this can get pretty complicated. It’s not so bad once everything
    is set up properly, but how do things get set up properly in the first place?
    There are two possibilities:


    +   - After reading the documentation that comes with the program you’d like to
    use, copy the various programs, config files, and information onto your computer,
    making sure they are all named correctly and are located in the proper place,
    and that there is sufficient disk space to hold them all. Then make the appropriate
    changes to the configuration file(s). Finally, run any setup programs that are
    necessary, giving them whatever information they require to do their job.


    +   - Let the computer do it for you.


    If it seems like the first choice isn’t so bad, consider how many files you’ll
    need to keep track of. On a typical Linux system, it’s not unusual to have more
    than 20,000 different files. That’s a lot of documentation reading, file copying,
    and configuring! And what happens when you want a newer version of a program?
    More of the same!


    Some people think the second alternative is easier. RPM was made for them.


    # ### 1.1.1. Enter the Package


    When you consider that computers are very good at keeping track of large amounts
    of data, the idea of giving your computer the job of riding herd over 20,000 files
    seems like a good one. And that’s exactly what package management software does.
    But what is a package?


    A package in the computer sense is very similar to a package in the physical sense.
    Both are used to keep related objects together in the same place. Both need to
    be opened before the contents can be used. Both can have a packing slip taped
    to the side, identifying the contents.


    Normally, package management systems take all the various files containing programs,
    data, documentation, and configuration information, and place them in one specially
    formatted file—a package file. In the case of RPM, the package file is sometimes
    called a *package*, an *.rpm file*, or even an *RPM*. All these terms refer to
    a package containing software meant to be installed using RPM.


    What types of software are normally found in a package? There are no hard-and-fast
    rules, but normally a package’s contents consist of one of the following types
    of software:


    +   - A collection of one or more programs that perform a single, well-defined
    task. This is normally what people think of as an application. Word processors
    and programming languages would fit into this category.


    +   - A specific part of an operating system. Examples include system initialization
    scripts, a particular command shell, or the software required to support a Web
    server.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 1.1.1.1. Advantages of a Package


    One of the most obvious benefits to having a package is that the package is one
    easily manageable chunk. If you move it from one place to another, there’s no
    risk of any part getting left behind. Although this is the most obvious advantage,
    it’s not the biggest one. The biggest advantage is that the package can contain
    the knowledge about what it takes to install itself on your computer. And if the
    package contains the steps required to install itself, the package can also contain
    the steps required to uninstall itself. What used to be a painful manual process
    is now a straightforward procedure. What used to be a mass of 20,000 files becomes
    a couple hundred packages.


    # 1.1.2. Manage Your Packages or They Will Manage You


    A couple hundred packages? Even though the use of packages has decreased the complexity
    of managing a system by an order of magnitude, it hasn’t yet gotten to the level
    of being a no-brainer. It’s still necessary to keep track of what packages are
    installed on your system. And if some packages require other packages in order
    to be installed or operate correctly, these should be tracked as well.


    # 1.1.2.1. Packages Lead Active Lives


    If you start looking at a computer system as a collection of packages, you’ll
    find that a distinct set of operations will take place on those packages time
    and time again:


    +   - New packages are installed. Maybe it’s a spreadsheet you’ll use to keep
    track of expenses, or the latest shoot-''em-up game, but in either case it’s new
    and you want it.

    +   - Old packages are replaced with newer versions. The company that wrote the
    word processor you use daily comes out with a new version. You’ll probably want
    to install the new version and remove the old one.

    +   - Packages are removed entirely. Perhaps that overhyped strategy game just
    didn’t cut it. You have better things to do with that disk space, so get rid of
    the game!


    With this much activity going on, it’s easy to lose track of things. What types
    of package information should be available to keep you informed?


    # 1.1.2.2. Keeping Track of Packages


    Just as certain operations are performed on packages, there are also certain types
    of information that will make it easier to make sense of the packages installed
    on your system:


    +   - Certainly you’d like to be able to see what packages are installed. It’s
    easy to forget whether the fax program you tried a few months ago is still installed.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'It would be nice to be able to get more detailed information on a specific
    package. This might consist of anything from the date the package was installed
    to a list of files it installed on your system.


    Being able to access this information in a variety of ways can be helpful, too.
    Instead of simply finding out what files a package installed, it might be handy
    to be able to name a particular file and find out which package installed it.


    If this amount of detail is possible, it should be possible to see if the way
    a package is presently installed varies from the way it was originally installed.
    It’s not at all unusual to make a mistake and delete one file—or 100. Being able
    to tell if one or more packages are missing files could greatly simplify the process
    of getting an ailing system back on its feet again.


    Files containing configuration information can be a real headache. If it were
    possible to pay extra attention to these files and make sure any changes made
    to them weren’t lost, life would certainly be a lot easier.


    # 1.2. Package Management: How to Do It


    Well, all this sounds great: easy install, upgrade, and deletion of packages;
    getting package information presented several different ways; making sure packages
    are installed correctly; and even tracking changes to config files. But how do
    you do it?


    As mentioned earlier, the obvious answer is to let the computer do it. Many groups
    have tried to create package management software. There are two basic approaches:


    +   • Some package management systems concentrate on the specific steps required
    to manipulate a package.

    +   • Other package management systems take a different approach, keeping track
    of the files on the system and manipulating packages by concentrating on the files
    involved.


    Each approach has its good and bad points. In the first method, it’s easy to install
    new packages, somewhat difficult to remove old ones, and almost impossible to
    obtain any meaningful information about installed packages.


    The second method makes it easy to obtain information about installed packages
    and fairly easy to install and remove packages. The main problem with using this
    method is that there may not be a well-defined way to execute any commands required
    during the installation or removal process.


    In practice, no package management system uses one approach or the other; all
    are a mixture of the two. The exact mix and design goals will dictate how well
    a particular package management system meets the needs of the people using it.
    At the time Red Hat Software started work on its Linux distribution, there were
    a number of package management systems in use, each with a different approach
    to making package management easier.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.2.1. The Ancestors of RPM


    Because this is a book about the Red Hat Package Manager, a good way to see what
    RPM is all about is to look at the package management software that preceded RPM.


    # 1.2.1.1. RPP


    RPP was used in the first Red Hat Linux distributions. Many of RPP''s features
    would be recognizable to anyone who has worked with RPM. Some of these innovative
    features are


    +   - Simple, one-command installation and uninstallation of packages.

    +   - Scripts that can run before and after installation and uninstallation of
    packages.

    +   - Package verification. The files of individual packages can be checked to
    see that they haven''t been modified since they were installed.

    +   - Powerful querying. The database of packages can be queried for information
    about installed packages, including file lists, descriptions, and more.


    Although RPP possessed several of the features that were important enough to continue
    on as parts of RPM today, it had some weaknesses, too:


    +   - It didn''t use *pristine sources*. Every program is made up of programming
    language statements stored in files. This source code is later translated into
    a binary language that the computer can execute. RPP''s packages were based on
    source code that had been modified specifically for RPP. Since the sources were
    no longer as the program''s creator had written them, they were no longer *pristine*.
    This is a bad idea for a number of fairly technical reasons. Not using pristine
    sources made it difficult for package developers to keep things straight, particularly
    if they were building hundreds of different packages.

    +   - It couldn''t guarantee that executables were built from packaged sources.
    The process of building a package for RPP was such that there was no way to ensure
    that the executable programs were built from the source code contained in an RPP
    source package. Once again, this was a problem for package builders, especially
    those who had large numbers of packages to build.

    +   - It had no support for multiple architectures. As people started using RPP,
    it became obvious that the package managers that were unable to simplify the process
    of building packages for more than one architecture, or type of computer, were
    going to be at a disadvantage. This was a problem, particularly for Red Hat Software,
    because it was starting to look at the possibility of creating Linux distributions
    for other architectures, such as the Digital Alpha.


    Even with these problems, RPP was one of the things that made the first Red Hat
    Linux distributions unique. Its ability to simplify the process of installing
    software was a real boon to many of Red Hat''s customers, particularly those with
    little experience in Linux.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 1.2.1.2. PMS


    While Red Hat Software was busy with RPP, another group of Linux devotees was
    hard at work with its package management system. Known as PMS, its development,
    lead by Rik Faith, attacked the problem of package management from a slightly
    different viewpoint.


    Like RPP, PMS was used to package a Linux distribution. This distribution was
    known as the BOGUS distribution, and all the software in it was built from original
    unmodified sources. Any changes that were required were patched in during the
    process of building the software. This is the concept of pristine sources and
    is PMS''s most important contribution to RPM. The importance of pristine sources
    cannot be overstated. It allows the packager to quickly release new versions of
    software and to immediately see what changes were made to the software.


    The chief disadvantages of PMS were weak querying ability, no package verification,
    no multiple architecture support, and poor database design.


    # 1.2.1.3. PM


    Later, Rik Faith and Doug Hoffman, working under contract for Red Hat Software,
    produced PM. The design combined all the important features of RPP and PM, including
    one-command installation and uninstallation, scripts run before and after installation
    and uninstallation, package verification, advanced querying, and pristine sources.
    However, it retained RPP''s and PMS''s chief disadvantages: weak database design
    and no support for multiple architectures.


    PM was very close to a viable package management system, but it wasn''t quite
    ready for prime time. It was never used in a commercially available product.


    # 1.2.1.4. RPM Version 1


    With two major forays into package management behind them, Marc Ewing and Erik
    Troan went to work on a third attempt. This one would be called the Red Hat Package
    Manager, or RPM.


    Although it built on the experiences of PM, PMS, and RPP, RPM was quite different
    under the hood. RPM was written in the Perl programming language for fast development.
    Version 1 of RPM focused on addressing the flaws of its ancestors. In some cases,
    the flaws were eliminated, while in others the problems remained.


    Some of the successes of RPM version 1 were


    +   - Automatic handling of configuration files. The contents of config files
    are often changed from what they were in the original package, making it hard
    for a package manager to know how a particular config file should be handled during
    installations, upgrades, and erasures. PM made an attempt at config file handling,
    but in RPM it was further improved. In many respects, this feature is the key
    to RPM''s power and flexibility.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Ease of rebuilding large numbers of packages. By making it easy for people
    who were trying to create a Linux distribution consisting of several hundred packages,
    RPM was a step in the right direction.


    Ease of use. Many of the concepts used in RPP had withstood the test of time and
    were used in RPM. For instance, the ability to verify the installation of a package
    was one of the features that set RPP apart. It was adapted and expanded in RPM
    version 1.


    But RPM version 1 wasn’t perfect. There were a number of flaws, some of them major:


    It was slow. While the use of Perl made RPM’s development proceed more quickly,
    it also meant that RPM wouldn’t run as quickly as it would have had it been written
    in C.


    Its database design was fragile. Unfortunately, under RPM version 1 it was not
    unusual for there to be problems with the database. While dedicating a database
    to package management was a good idea, the implementation used in RPM version
    1 left a lot to be desired.


    It was big. This is another artifact of using Perl. Normally, RPM’s size requirements
    were not an issue, except in one area. When performing an initial system installation,
    RPM was run from a small, floppy-based system environment. The need to have Perl
    available meant that space on the boot floppies was always a problem.


    It didn’t support multiple architectures (different types of computers) well.
    The need to have a package manager support more than one type of computer hadn’t
    been acknowledged before. With RPM version 1, an initial stab was taken at the
    problem, but the implementation was incomplete. Nonetheless, RPM had been ported
    to a number of other computer systems. It was becoming obvious that the issue
    of multiarchitecture support was not going away and had to be addressed.


    The package file format wasn’t extensible. This made it very difficult to add
    functionality since any change to the file format would cause older versions of
    RPM to break.


    Even though their Linux distribution was a success, and RPM was much of the reason
    for it, Ewing and Troan knew that some changes were going to be necessary to carry
    RPM to the next level.


    # ### 1.2.1.5. The RPM of Today: Version 2


    Looking back on their experiences with RPM version 1, Ewing and Troan made a major
    change to RPM’s design: They rewrote it entirely in C. This did wonderful things
    to RPM’s speed and size. Querying the database was quicker now, and there was
    no need to have Perl around just to do package management.


    In addition, the database format was redesigned to improve both performance and
    reliability. Displaying package information can take as little as a tenth of the
    time spent in RPM version 1, for example.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Realizing RPM’s potential in the non-Linux arena, Ewing and Troat also created
    rpmlib, a library of RPM routines that allow the use of RPM functionality in other
    programs. RPM’s ability to function on more than one architecture was also enhanced.
    Finally, the package file format was made more extensible, clearing the way for
    future enhancements to RPM.


    So is RPM perfect? No program can ever reach perfection, and RPM is no exception.
    But as a package manager that can run on several different types of systems, RPM
    has a lot to offer, and it will only get better. Let’s take a look at the design
    criteria that drove the development of RPM.


    # # 1.3. RPM Design Goals


    The design goals of RPM could best be summed up with the phrase “something for
    everyone.” While the main reason for the existence of RPM was to make it easier
    for Red Hat Software to build the several hundred packages that comprised the
    Linux distribution, that is not the only reason RPM was created. The following
    sections take a look at the various requirements the Red Hat team used in its
    design of RPM.


    # ## 1.3.1. Making It Easy to Get Packages on and off the System


    As you’ve learned in this chapter, the act of installing a package can involve
    many complex steps. Enturring these steps to a person who may not have the necessary
    experience is a strategy for failure. So the goal for RPM was to make it as easy
    as possible for anyone to install and uninstall packages. These are complex and
    error-prone operations, which RPM should handle for the user.


    The other side of this issue is that RPM should give the package builder almost
    total control in terms of how the package is installed. The reason for this is
    simple: If the package builders do their homework, their packages should install
    and uninstall properly.


    # ## 1.3.2. Making It Easy to Verify That a Package Was Installed Correctly


    Because software problems are a fact of life, the ability to verify the proper
    installation of a package is vital. If done properly, it should be possible to
    catch a variety of problems, including things such as missing or modified files.


    # ## 1.3.3. Making It Easy for the Package Builder


    Although we’re dedicating an entire book to package management, it really should
    be a small portion of the package builder’s job. Why? He’s got better things to
    do! If the package builders are the people who are actually creating the software
    to be packaged, that’s where they should be spending the majority of their time.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Even if the package builder isn''t actually writing software, he still has
    better things to do than worry about building packages. For instance, he might
    be responsible for building many packages. The less time spent on building an
    individual package, the more packages that can be built.


    # 1.3.4. Making It Start with the Original Source Code


    It was deemed important that RPM start with the original, unmodified source code.
    Why is this so important?


    Using the original sources makes it possible to separate the changes required
    to build the package from any changes implemented to fix bugs, add new features,
    or anything else. This is a good thing for package builders because many of them
    are not the original authors of the programs they package.


    This separation makes it easy, months down the road, to know exactly what changes
    were made in order to get the package to build. This is important when a new version
    of the packaged software becomes available. Many times it''s only necessary to
    apply the original package building changes to the newer software. At worst, the
    changes provide a starting point to determine what sorts of things might need
    to be changed in the new version.


    # 1.3.5. Making It Work on Different Computer Architectures


    One of the tougher things for a package builder to do is to take a program, make
    it run on more than one type of computer, and distribute packages for each. Because
    RPM makes it easy to use a program''s original source code, add the changes necessary
    to get it to build, and produce a package for each architecture in one step, it
    can be pretty handy.


    # 1.4. What''s in a Package?


    With all the magical things we''ve claimed that package management software in
    general (and RPM in particular) can do, you''d think there was a tiny computer
    guru bundled in every package. However, the reality is not that magical. The following
    sections give a quick overview of the more important parts of an RPM package.


    **NOTE**


    See Appendix A, "The Format of the RPM File," for complete details on the contents
    of an .rpm file.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.4.1. RPM’s Package Labels


    Every package built for RPM has to have a specific set of information that uniquely
    identifies it. We call this information a *package label*. Here are two sample
    package labels:


    +   • nls-1.0-1

    +   • perl-5.001m-4


    Although these labels look like they have very little in common, in fact they
    both follow RPM’s package labeling convention. There are three different components
    in every package label. Let’s look at each one in order.


    # 1.4.1.1. Component 1: The Software’s Name


    Every package label begins with the name of the software. The name might be derived
    from the name of the application packaged, or it might be a name describing a
    group of related programs bundled together by the *package builder*. The software
    names in the examples shown previously are *nls* and *perl*. As you can see, the
    software name is separated from the rest of the package label by a dash.


    # 1.4.1.2. Component 2: The Software’s Version


    Next in the package label is an identifier that describes the version of the software
    being packaged. If the *package builder* bundled a number of related programs
    together, the software version is probably a number of the *package builder*’s
    choosing. However, if the package consists of one major application, the software
    version normally comes directly from the *application’s developer*. The actual
    version specification is quite flexible, as can be seen in the examples. The versions
    shown are *1.0* and *5.001*. A dash separates the software version from the remainder
    of the package label.


    # 1.4.1.3. Component 3: The Package’s Release


    The *package release* is the most unambiguous part of a *package label*. It is
    a number chosen by the *package builder*. It reflects the number of times the
    package has been rebuilt using the same version of software. Normally, the rebuilds
    are due to bugs uncovered after the package has been in use for a while. By tradition,
    the *package release* starts at 1. The *package releases* in the example are 1
    and 4.


    # 1.4.2. Labels and Names: Similar but Distinct


    Package labels are used internally by RPM. For example, if you ask RPM to list
    every installed package, it will respond with a list of *package labels*. When
    a package file is created, part of the filename consists of the *package label*.
    There is no technical requirement for this, but it does make it easier to keep
    track of things.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "However, a package file may be renamed, and the new filename won't confuse\
    \ RPM in the least because the package label is contained within the file. For\
    \ a fairly technical view of the inside of a package file, see Appendix A.\n\n\
    # **1.4.3. Packagewide Information**\n\nSome of the information contained in a\
    \ package is general in nature. This information includes such items as\n\n+ \
    \  The date and time the package was built\n+   A description of the package’s\
    \ contents\n+   The total size of all the files installed by the package\n+  \
    \ Information that allows the package to be grouped with similar packages\n+ \
    \  A digital *signature* that can be used to verify the authenticity and integrity\
    \ of the package\n\n> NOTE\n> \n> For more information on RPM's signature checking\
    \ capability, refer to section 7.1 in Chapter 7, \"Using RPM to Verify Package\
    \ Files.\"\n\n# **1.4.4. Per-File Information**\n\nEach package also contains\
    \ information about every file contained in the package. The information includes\n\
    \n+   The name of every file and where it is to be installed\n+   Each file's\
    \ permissions\n+   Each file’s owner and group specifications\n+   The MD5 checksum\
    \ of each file\n\n> NOTE\n> \n> We'll discuss MD5 checksums in greater detail\
    \ in section 6.1 of Chapter 6, \"Using RPM to Verify Installed Packages.\"\n\n\
    +   The file's contents"
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 1.5. Summary


    So a package management system uses the computer to keep track of all the various
    bits and pieces that comprise an application or an entire operating system. Most
    package management systems use a specially formatted file to keep everything together
    in a single, easily manageable entity, or package. Additionally, package management
    systems tend to provide one or more of the following functions:


    +   - Installing new packages

    +   - Removing old packages

    +   - Upgrading from an old package to a new one

    +   - Obtaining information about installed packages


    RPM has been designed with Red Hat Software''s past package management experiences
    in mind. PM and RPP provided most of these functions with varying degrees of success.
    Ewing and Troan have worked hard to make RPM better than its predecessors in every
    way. Now it''s time to see how they did it and learn how to use RPM!'
  merge: -1
  img_proc: true
