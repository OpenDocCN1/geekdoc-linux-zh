    # 8.3. Source Package Files and How to Use Them


    One day, you may run across a package file with a name similar to the following:


    ```

    etsckel-1.0-3.src.rpm

    ```


    Notice the src. Is that a new kind of computer? If you use RPM on an Intel-based
    computer, you''d normally expect to find i386 there. Maybe someone messed up the
    name of the file. Well, we know that the file command can display information
    about a package file, even if the filename has been changed. We''ve used it before
    to figure out what package a file contains:


    ```

    # file foo.bar

    foo.bar: RPM v2 bin i386 eject-1.2-2

    #

    ```


    In this example, foo.bar is an RPM version 2 file. bin indicates that the file
    contains an executable package, and i386 means that the package was built for
    Intel processors. The package is called eject version 1.2, release 2.'
