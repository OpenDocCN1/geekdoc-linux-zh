    The `--requires` option (-R is equivalent) is the logical complement to the `--provides`
    option. It displays the capabilities required by the specified package(s). If
    a package has no requirements, there''s no output (or, in later versions of RPM,
    the word `none`):


    ```

    # rpm -q --requires adduser

    #

    ```'
