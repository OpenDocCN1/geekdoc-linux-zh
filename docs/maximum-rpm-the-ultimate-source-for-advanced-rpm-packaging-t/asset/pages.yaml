    Eventually it’s going to happen: You go to verify a package, and it fails. We’ll
    look at an example of a package that fails verification a bit later. Before we
    do that, let’s make a package that won’t verify in order to demonstrate how sensitive
    RPM’s verification is.


    First, we made a copy of a signed package, rpm-2.3-1.i386.rpm. We called the copy
    rpm-2.3-1.i386-bogus.rpm. Next, using Emacs (in hexl-mode, for all you Emacs buffs),
    we changed the first letter of the name of the system that built the original
    package. The file rpm-2.3-1.i386-bogus.rpm is now truly bogus: It has been changed
    from the original file.


    Although the change was a small one, it still showed up when the package file
    was queried. Here’s a listing from the original package:


    ```

