    # 12.1. rpm -b: What Does It Do?


    When RPM is invoked with the -b option, the process of building a package is started.
    The rest of the command will determine exactly what is to be built and how far
    the build should proceed. This chapter explores every aspect of rpm -b.


    An RPM build command must have two additional pieces of information, over and
    above rpm -b:


    +   The names of one or more spec files representing software to be packaged

    +   The desired stage at which the build is to stop'
