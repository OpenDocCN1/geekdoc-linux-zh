- pgno: 367
  md: 'It has a tag value of 03ea (1002 in decimal—a PGP signature block) and is also
    a BIN data type. The data starts 20 decimal bytes from the start of the data area,
    which would put it at file offset b4 (in hex). It''s a biggie—152 bytes long!
    Here''s the data, starting with 8900:


    ```

    000000d0: 329c 5375 8900 9503 0580 31ed 6390 a520 2.Su......1.c...

    000000e0: e8f1 cb42 9bfb 0101 437b 8400 9cb8 0cd4 .......C{......C[....

    000000f0: 3790 364e drfb 9aba 2265 b0d3 dc30 4ce7 7.6N.....PPM,d....\O

    00000100: 91b8 c15d 704c 2c04 888a 8fca 18ab 5bf6f .Pp......Bf....\o

    00000110: f841 ecbc d18a 01c9 3681 66f0 9dd8 e956 A.....8.f...~.V

    00000120: 3142 61b3 b1da 8494 cbef 9c19 4574 c4f9 1Ba....t...Et...

    00000130: ee17 35e1 d105 fb68 8ce6 715a 60f1 c660 ...5..h..''q.

    00000140: 279f 0306 28ed 0ba0 0855 9e82 2b1c 2ede ''...(...U.+....

    00000150: e8e3 5090 6260 8b3c ba84 6949 2573 1bbd .p.~.<.i.%s..

    00000160: 5b65 40e1 b1d2 c0f7 8afa 4a98 b000 0000 [em......

    ```


    It ends with the bytes 4a9b. This is a 1,216-bit PGP signature block. It is also
    the end of the signature section. There are 4 null bytes following the last data
    item in order to round the size out so that it ends on an 8-byte boundary. This
    means that the offset of the next section starts at offset 150, in hex. Say, wasn''t
    the size in the size signature off by 150 hex? Yes, the size in signature is the
    size of the file—minus the size of the lead and the signature sections.


    # A.2.1.3. The Header


    The header section contains all available information about the package. Entries
    such as the package''s name, version, and file list are contained in the header.
    Like the signature section, the header is in header structure format. Unlike the
    signature, which has only three possible tag types, the header has more than 60
    different tags. (The list of currently defined tags appears in section A.2.1.3.2.)
    Be aware that the list of tags changes frequently; the definitive list appears
    in the RPM sources in lib/rpm/lib.h.


    # A.2.1.3.1. Analyzing the Header


    The easiest way to find the start of the header is to look for the second header
    structure by scanning for its magic number (8ead e8). The 16 bytes, starting with
    the magic, are the header structure''s header. They follow the same format as
    the header in the signature''s header structure:


    ```

    00000150: 8ead e801 0000 0000 0000 0021 0000 09d3 .......!

    ```


    As before, the byte following the magic identifies this header structure as being
    in version 1 format. Following the 4 reserved bytes, we find the count of entries
    stored in the header (0000 0021). Converting to decimal, we find that there are
    33 entries in the header. The next 4 bytes (0000 09d3), converted to decimal,
    tell us that there are 2,515 bytes of data in the store.


    Since the header is a header structure just like the signature, we know that the
    next 16 bytes are the first index entry:


    ```

    00000160: 0000 03e8 0000 00b6 0000 0000 0000 0001 ...........

    ```'
