- md: "\n## Connecting a video camera to your PC\n\nLinux is perfectly capable of\
    \ editing your video files. Here we'll show you how to transfer your files from\
    \ your camcorder to your PC.\n\nConnecting your digital camera to Ubuntu would\
    \ be pretty easy; the operating system has built-in support for camcorders. However,\
    \ there are some areas that could give you problems. Before we start, we'll talk\
    \ you through the difficulties you might face.\n\nThere are two types of video\
    \ camera that you'll likely want to connect to your computer: MiniDV and memory\
    \ flash storage models. Short, MiniDV models will be very tricky to install. Many\
    \ require a FireWire port to connect and a special driver to be installed. It's\
    \ not possible to work around the problem, but you're likely to run in a number\
    \ of difficulties when doing so. Our advice is to keep a PC running Windows handy\
    \ for connecting this kind of camcorder.\n\nIf you have a flash-based or hard-based\
    \ camcorder, things are a lot easier. In this section we'll show you how to connect\
    \ this type of camera and copy files to your Ubuntu computer.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_67_0.png)\n\
    Modern flash-memory or hard-based camcorders are easy to connect to Ubuntu\n\n\
    ![](img/55dc7df089fe0011a7e15a61689f37ea_67_1.png)\n\n### CONNECTING YOUR CAMERA\n\
    \nDepending on the type of camera that you own, you'll have a choice of connection.\
    \ If your camera uses removable storage, such as an SD card, you can use a USB\
    \ card reader. Ubuntu recognises these devices in the same way as Windows does.\
    \ All you have to do with a card reader is to take the memory card out of your\
    \ recorder and plug it in. The reader will become available in Computer from the\
    \ menu. All you need is to copy the files that you require from.\n\nIf your camera\
    \ does not have a memory card reader, your only option is to plug in your camcorder\
    \ using USB. In our experience, camcorders can use a weird and wonderful collection\
    \ of USB cables, so remember to use the one that came in the box with your camera.\n\
    \n![](img/55dc7df089fe0011a7e15a61689f37ea_67_2.png)\n\n## BASIC DESKTOP TASKS\n\
    \nDigital cameras may offer multiple connection modes, such as the Picture Transfer\
    \ Protocol (PTP), but video cameras only have one: mass storage. All you need\
    \ to do is plug your camera in via USB and it will be recognized as a flash storage.\
    \ If you have photos stored on your camera, using its still mode, as well as videos,\
    \ you will see a dialog box telling you you have inserted a media with digital\
    \ photos. Choose what application to launch.\n\nThe default option will be the\
    \ Shotbot photo player. Monitor this option and select Open Folder and click OK.\n\
    \nAlternatively, you can view your camera's files by clicking on Computer from\
    \ the Places menu. You can then browse your camera as though it were any other\
    \ folder or storage device. Any videos that you find can be copied from the device\
    \ to your hard disk by dragging and dropping.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_68_0.png)\n\
    \n## VIEWING FILES\n\nBefore you edit your videos (see page 68), you may want\
    \ to check the files and delete any that you do not want to use. Ubuntu can play\
    \ most file types and formats, and we had no problems with 1080p HD video files\
    \ from our Samsung camera. However, some HD cameras use strange formats, so you\
    \ may need to search the Ubuntu forums.\n\nTo view a file, simply double-click\
    \ it and the Totem Movie player will start. Since the player doesn't have a list\
    \ of video codes (the software used) it can automatically detect what it needs.\
    \ When you first try to play a file, you will need to install some additional\
    \ plugins, such as:\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_68_1.png)\n\n\
    - Before you play a video file, you may have to install an additional device \n\
    - You can preview your video files and keep the only ones worthy of being edited\n\
    - You can browse your camera's files just like any other folder or storage device\n\
    \nThe gstreamer0.10-ffmpeg H.264 code. Select the default option and click Install.\
    \ Once the code has been installed, you will be able to view your video. The software\
    \ squashes the 16:9 aspect ratio. This should fix the video and make it look right.\
    \ Once you preview your clips, you can simply delete the ones you want and save\
    \ the others. Installing the code also means that imported videos will have a\
    \ thumbnail generated. This is similar to how Windows handles video files. It\
    \ makes it easy to see what you've got and edit the right one without having to\
    \ preview it first. Once you're happy with the files you've copied from your camera,\
    \ you can edit them in the package of your choice. We've got more details on how\
