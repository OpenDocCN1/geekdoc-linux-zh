    当 ISO 文件下载到你的 USB 闪盘时，前往 http://ubuntu.source.net/ 并点击 Download for Windows。这将
    Ubuntu 下载到你的 PC 中。由于我们正在下载最新版本的 Ubuntu，所以不需要从发行版中选择。选择 Desktop，点击“...”。


    一旦 Ubuntu 下载完成，点击磁盘镜像右侧的按钮，并导航到 Ubuntu ISO 文件。最后，为你的 USB 闪盘选择正确的盘符（如果不确定，在 Windows
    资源管理器中检查）并点击。这将 Ubuntu 复制到你的闪盘并进行配置，以便你的电脑可以启动。将闪盘插入你想安装 Ubuntu 的电脑并开启。如果它没有从
    USB 驱动器启动，你需要更改电脑中的启动选项。保存更改并重启。


