    # Network Connections


    Your Wi-Fi network should provide the correct connection settings, but you can
    change them. Select your 3G connection and press Edit. Enter the username, password
    and any other settings your mobile broadband service provider has given to you.


    Apply your changes, choose the Network Connections dialog and select the broadband
    connection from the Network Manager icon. You''ll see a message that says "GSM
    network connection established".


    Ubuntu comes with a range of network troubleshooting tools. For convenience, the
    most important tools have been gathered into a single-tab window. Open Gnome''s
    System menu, select Administration and Network Tools. The window that pops up
    has several tabs. Select a device from the menu on the Devices and it will display
    its details and statistics.


    ## USING NETWORK TOOLS


    The Ping tab lets you contact other machines on your local network and over the
    internet to test if they''re working and discover how long packets take to reach
    them. The ''ping'' command sends a stream of packets to the destination. To use
    this, simply enter the DNS name or IP address of a destination computer and press
    Enter. The screen will fill with a bar chart showing how each of the five ping
    responses takes. If you''re having trouble reaching it, ping will tell you if
    the machine has crashed or if the connection is just very slow. A good test is
    working correctly.


    The Netstat tool provides low-level information, the Traceroute tool is far more
    interesting. If you enter the DNS address or name of a destination computer and
    press Enter, this tool will fill you with plenty of information about the route
    taken to get there. Each is called ''hops'' along the route. You can find out
    the route taken, or if your network contains several subnets connected by routers
    and you have a connectivity problem, it will tell you the problem lying at fault.


    The Port scan is strictly for use on your own network. Port scanning tells you
    which of target ports are open or listening for traffic. Type in a DNS name or
    IP address and press Enter. If you try this on the internet, you might trigger
    an intrusion detection system and be banned by ISP. This is because port scanning
    is a technique that hackers use to find vulnerable computers. If you''re found
    using a port scanner over the internet, you may get banned from your ISP.


