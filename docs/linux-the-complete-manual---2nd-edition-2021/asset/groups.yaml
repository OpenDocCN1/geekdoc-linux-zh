    ## CHAPTER 7

    ## Configuring FreeNAS


    FreeNAS''s advanced features let you add security, share files over the internet
    and share media with other computers


    In the previous four pages we discussed how to install FreeNAS and turn an old
    computer into a network-attached storage device. However we only scratched the
    surface of what FreeNAS can do. Here we will take you through some of more advanced
    features so that you can use the application to its full potential. We will show
    how to configure security, as well as add types of file-sharing such as creating
    your own media and FTP server that you can access from anywhere on the internet.


    The first place to start is security. Your default installation of FreeNAS doesn''t
    have any usernames or passwords, so anyone could access the computer. While this
    is fine on a local network, if you are going to use advanced features that are
    accessible over the internet, such as the FTP server, you will need to learn how
    to set up your users.


    At the time of writing, the current version of FreeNAS doesn''t let you choose
    which users have access to each service. This means that anyone who knows our
    IP can access and pass every feature and share. For share this might not make
    any difference, unless you are really keen to keep access for members of your
    family.


    ## BACK UP YOUR CONFIGURATION


    If your system depends on a problem and you have to restore FreeNAS, you will
    need to restore quickly. If you don''t back up your configuration, you risk losing
    every single file in your configuration. To do this, log in to FreeNAS''s web
    interface, go to the Backup menu and click Backup. It''s also worth checking if
    your configuration is up to date. The system is updated.


    ## ADDING A USER


    To add a new user, you first need to create one. In FreeNAS''s web interface,
    go to the Users tab. Click the blue icon to create a new user. Type in a username
    and password, then click Add. Apply Changes and your user is ready to be used
    by:


    ## TURNING ON SECURITY


    To use your new folder to share, click on CIFS/SMB from the Services menu the
    web interface, and click on the Shares tab. Click the blue icon, to create a name


    # Services | CIFS/SMB | Share | Add


    | Name | Comment |

    | --- | --- |

    | Share(s) | Path to the share. If this is selected, users cannot create or delete
    files in the share. |

    | Read only | Check this determines whether the share is read-only or an available
    share in the network-browse list. |

    | Permissions | This determines the permissions that users have on the share.
    You can set permissions on users or groups to access a single share to use for
    restricted access. |

    | Hidden folder | This will create a folder on the share. |

    | Hide from list | If this is selected, the share is not listed when browsing
    the network. |


    ## SMARTER SHARES


    On the previous pages we showed how to share a mount point (hard disk or RAID
    array). However, you can also share a specific folder. To do this, click on the
    Shares tab and click the blue icon to create a new share. Type in a name for the
    share and a comment, then click the button next to Path and select the folder
    you want to share. Click OK and Apply Changes.

