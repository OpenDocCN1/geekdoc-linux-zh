    \ CD 时找不到任何东西，这应该是你首先查看的地方。“声音偏好”（Sound Preferences）对话框列表在“硬件”（Hardware）选项卡的下拉菜单中列出了可用设备。在大多数情况下，这将是同一个声卡。\n\
    \n一个常见的音频问题是由扬声器插入 PC 的音频接口并让 Linux 使用数字输出引起的。如果观察到错误或者在“声音偏好”对话框选择的音频设备名称中看到“数字”（Digital）。要纠正这一点，请使用下拉菜单将其更改为“模拟立体声”（Analog\
    \ Stereo）并点击“测试”按钮。这应该产生一个稳定的音调。如果没有，尝试“音频输出系统”（OSS）下拉选项。如果你听到任何噪音，请尝试“自动检测”（Autodetect）。\n\
    \n你还可以使用此对话框更改为系统事件播放的声音。在“声音”（Sounds）选项卡上，你会看到一个事件列表，每个事件的状态为“默认”（Default）或“禁用”（Disabled）。如果你点击状态并选择“自定义”（Custom），就可以导航到你选择的声音文件。\n\
    \n一旦板载声音正常，你就可以从任何 USB MP3 播放音乐了。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_23_0.png)\n\
    \n- 检查你的音频输出状态 \n\n完整的 LINUX 手册\n24\n\n# 安装 UBUNTU\n\n*(注：由于您提供的原始文本包含大量重复段落，翻译已根据“不要重复输出原文”的原则进行了逻辑去重处理，以下为完整且不重复的翻译内容：)*\n\
