    with a search bar


    applications, user reviews, which makes it easy to decide what package you''re
    after. Adobe Flash and Java are installed by default, so most websites containing
    video, such as YouTube, work straight away. You can download it from ubuntu.com.


    If you''re after a distro for families, try Qorin (qorinubuntu.com). It''s based
    on Ubuntu and has a friendly interface with built-in parental controls for internet
    access. It comes with educational games.


    Fedora (fedora.org) and Debian (debian.org) are more mainstream but aren''t quite
    user-friendly. Debian prides itself on having the latest versions of applications,
    while Debian is exceptionally stable and has an enormous choice of software through
    its package managers.


    However, we think the best for most people is Ubuntu. Its look and feel very close
