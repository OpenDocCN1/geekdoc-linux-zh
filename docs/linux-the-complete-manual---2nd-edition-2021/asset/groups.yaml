    ## GETTING TO KNOW LINUX


    Now you can simply select the files you want from the remote computer using one,
    then click and hold on one of them and drag it to the right-hand pan in the other
    File Browser. The mouse pointer will turn into a hand, and you will see the outlines
    of the other files being dragged along.


    Look out for the icon that appears to the bottom-right of the hand before you
    let go of the files. If it''s an arrow pointing to the hand, the files will be
    moved rather than copied. If you want to copy the files instead of leaving the
    originals in place, hold the Ctrl key before you let go of the mouse button.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_46_0.png)


    ## EXTERNAL DRIVES


    The transfer of files using a flash drive, hard disk or memory card is just identical
    to the process we''ve already described. The only difference is that when you
    plug in one of these storage devices, File Browser will automatically show the
    contents of the device. A neat feature of Ubuntu is that a shortcut to the device
    will appear on the desktop so you can quickly access the drive while it remains
    connected.


    Now you can select and copy the files to your hard disk using the same method
    as transferring over network. Before unplugging your USB flash drive, hard disks
    or memory cards, it''s a good idea to hit the icon which appears to the right
    of the Places pane in File Browser window. This helps to prevent files from becoming
    corrupted.


    The last file you clicked will be selected. You can use a combination of Shift
    and Ctrl to select several blocks of files.


    When you''ve selected the files you want, either press Ctrl+C to copy or choose
    them from the Edit menu. Navigate to the folder on your Ubuntu computer to which
    you want to transfer the files (you can open a new File Browser window; just click
    the headers of the folders). Then choose Paste from the Edit menu or press Ctrl+V
    to use keyboard shortcuts.


    If you want to move the files rather than copy them, Cut from the Edit menu when
    you''ve selected them. This will work if you only ticked the ''Allow network users
    to change my files'' sharing in Windows XP. This shouldn''t be a problem with
    shared folders on Windows Vista, the default permission level is ''Owner''.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_46_1.png)


    > When you plug in a USB storage device, it should automatically appear as a File
    and a shortcut icon will appear on the desktop.


    > USB will recognize drive or memory card, just like Windows


    ## WHAT A DRAG


    Another way to transfer files, which may be the easiest way for some, is to have
    two File Browser windows on your desktop. One window will show the files stored
    on the remote computer, while the other will show your local hard disk when you
    want to copy the files. To resize the File windows so they sit neatly side by
    side, simply hover your mouse over the bottom-right corner of each window until
    the cursor changes, then click and drag until the window is the right size; it''s
    exactly the same process as in Windows.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_46_2.png)


