    ubuntu.com 下载它。


    如果你在寻找一个适合家庭的发行版，可以尝试 Qorin (qorinubuntu.com)。它基于 Ubuntu，界面友好，并内置了互联网访问的家长控制。它还附带教育游戏。


    Fedora (fedora.org) 和 Debian (debian.org) 更加主流，但并不非常用户友好。Debian 以拥有最新版本的应用程序为傲，而
    Debian 异常稳定，并通过其包管理器提供了大量的软件选择。


    然而，我们认为对大多数人来说，Ubuntu 是最好的。它的外观和感觉与 Windows 非常接近，像包管理器和虚拟桌面等不熟悉的方面都被隐藏了起来。正因为这样，Ubuntu
    将成为最受欢迎的 Linux 发行版。


    ## 完整的 Linux 手册


    # 关于 Ubuntu


    Ubuntu 具有极佳的兼容性，这意味着它可以在几乎任何硬件上运行。它还会针对你的电脑进行优化，包括为你的显示器设置正确的屏幕分辨率、寻找你的无线网络。事实上，Ubuntu
    有时比 Windows 更简单。将外部显示器连接到笔记本电脑，按下键盘上的组合键启用它，Ubuntu 就会设置正确的分辨率并将其配置在笔记本屏幕的侧边。


    Ubuntu 每六个月更新一次。某些版本在版本号后带有“LTS”，代表“长期支持”。对于标准发布，三年内提供 18 个月的支持。在两次发布之间，更新管理器包含更多更新，因此你的
    PC 始终拥有最新版本的 Ubuntu 应用程序。


    启动速度非常快，当你看到桌面在 30 秒内出现时，你就会意识到 Windows 有多慢。除了 LibreOffice 之外，还预装了 Firefox，这样你可以立即上网。


