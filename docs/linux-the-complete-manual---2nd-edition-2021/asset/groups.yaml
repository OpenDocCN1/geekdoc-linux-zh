    # Using the Launcher


    Keep your favourite programs and gadgets to hand by customising the Launcher


    The Launcher is the new way of interacting with applications in Ubuntu, partially
    replacing the old Task Bar and Applications menu. The Launcher appears on the
    lefthand side of the screen; it slides out of view if you''ve got an application
    maximised; just move the mouse to bring it back.


    Right-clicking on an icon may give you new options for application, such as Opening
    a New Window in Firefox. The application isn''t always visible in Launcher, you
    can click Keep in Launcher to pin it. This gives you a quick shortcut.


    The icons are your shortcuts to favourite applications. Icons with white arrows
    next to them denote running programs.


    This icon launches the search bar for documents. It gives you access to your folders,
