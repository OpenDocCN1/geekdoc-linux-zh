    # Editing video


    Want to cut out the chaff from your video footage before uploading it to YouTube?
    We''ll show you how to use Kdenlive


    ou may have noticed that Ubuntu doesn''t come with an application to edit video.
    That''s because it only recently that developers have


    started work on programs for this purpose. Currently, the best choice is Kdenlive,
    but as it''s still an unfinished project, you may experience a few bugs and crashes.
    However, as long as you


    The render button. Click this when you''re ready to export your finished movie
    in a format that your player is compatible.


    Drag an effect from the list on a clip to add that effect. You can add multiple
    effects to each clip and adjust their properties with the Effect Stack tab on
    the left.


    The project monitor shows the whole movie, but you can switch it for a view of
    the current clip by clicking on the Clip Monitor tab.


    Click the Add Clip button to import video clips from your hard disk, memory card
    or directly from your video camera.


    If you make a mistake, you can use the Undo History to jump back to the point
    you want to restart from.


    These are the video clips in your project. They can be added to the timeline as
    many times as you like.


    The zoom control lets you see more detail when you need to adjust and edit clips
    more precisely.


    These two waveforms represent the left and right audio channels in each video
    clip.


    The Razor tool lets you split video clips into multiple chunks on the timeline.


    The playback marker shows the current position in the movie.


    The selection tool is used for dragging and trimming clips on the timeline.


    There are two clips on the timeline. The tracks work like layers in photo-editing
    software. Video on top will obscure clips unless the top video is transparent
    or occupies part of the frame.


