    system is essentially SATA with a slightly different connector, so an eSATA disk
    can be as fast as an internal hard disk. You can convert an internal SATA port
    to eSATA using a blanking plate around £3.


    The main benefit of using a hard disk for backup is that data can be rewritten
    so you can leave the drive plugged in and make regular backups to it. The danger
    is that they are attractive to offer but offer no protection if your house burns
    down.


    - PRO Simple to connect

    - CON Works on one computer at a time

    - BEST FOR Backups on a single PC


