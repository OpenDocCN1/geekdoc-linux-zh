    因此，您需要提高计算机的安全性。互联网上的每台电脑都需要防火墙来保护免受黑客的意外入侵，例如。同样，Linux 也需要保护。公司现在意识到恶意软件对 Linux
    操作系统构成的威胁，并开始为大多数产品提供基础的 Linux 版本。


    许多商业防火墙包含大量功能。然而，在最基础的，防火墙只是根据一组规则决定允许或“丢弃”数据包。配置防火墙是编写规则的问题，告诉它哪些类型的网络流量可以通过，哪些被拦截。


