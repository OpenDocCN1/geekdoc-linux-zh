    # Welcome to the world of free computing


    There''s a lot of mystery surrounding Linux. Until recently, it was an operating
    system used exclusively by geeks who know how to control a computer by typing
    unfathomable commands such as ''sudo apt-get install pkgnames emerald''.


    The good news is that Linux is now good-looking, easy to install and simple to
    use as Windows. What''s more, it''s absolutely free – you''ll find your copy of
    Ubuntu on the back page of this book ready for you to try out straight away. You
    can install it on as many computers as you like, try as many different versions
    as you want and download thousands of free applications to use with.


    In this book, we''ll show you how to do everything in Linux that you can do in
    Windows, such as browsing the internet, sending emails, organising and editing
    your photos, creating a spreadsheet, listening to music (and transferring it to
    your MP3 player), watching DVDs and much more.


    So whether you''re building a computer from scratch or you''re simply fed up with
    how slow your current Windows PC is, this book is for you.


    Jim Martin, Editor


