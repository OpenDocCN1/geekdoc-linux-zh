    # ## Mail order Email servers explained


    Your ISP or email provider may give you a choice of POP3 (sometimes called POP)
    or IMAP servers, which would you prefer?


    POP3 is the most common and easiest to use. Your email client contacts the server
    and downloads the mail. Typically, it deletes the mail from the server when it''s
    finished, leaving only the copy of your email on your PC. There''s no more between
    your mail client and server.


    With an IMAP server, mail is stored on the server and accessed from it. Any email
    you read on your PC is marked as read on the server. So if you''re away from home
    and want to read your email, your client will show that your email has been read.


    IMAP''s the best choice if you have a lot of storage space on a server, such as
    with Google Mail 7GB limit.


