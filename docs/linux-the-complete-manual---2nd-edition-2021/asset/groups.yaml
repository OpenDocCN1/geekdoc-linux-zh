    ## CHAPTER 2


    ## Installing Ubuntu

    a a laptop


    Installing Ubuntu on a portable computer – even a relatively low-powered one –
    can give it a new lease of life.


    One of the best things about Linux is that it requires comparatively few resources
    compared with Windows. This is particularly hard on low-powered computers such
    as netbooks. Windows can be a resource hog and isn''t designed to run on small
    screens, whereas Ubuntu is designed to make the most out of low-resolution and
    relatively slow machines.


    It works on all computers, as not all laptops have CD drives. Installing Ubuntu
    on your netbook or laptop differ from the ones you have used before.


    Before you start, you''ll need to power on your computer and go into Windows.
    Windows netbooks or laptops require Windows software for the shortcut keys to
    work. These keys may not work in Ubuntu, so it''s best to rely on the wireless
    networking, or other devices you can. Once this is done, shut down your computer.


    The Network Edition of Ubuntu – which was tailored for installation on low-powered
    machines – is no longer available, but the standard version has been tweaked to
    make


    > Universal USB Installer turns a USB drive into a bootable disk for installing
    Linux


    The installation file is a free download from http://ubuntu.com. Selecting the
    link will download the CD-sized ISO file to your computer. If you have a USB optical
    drive for your network or laptop, you can use CD-burning software (CDBurner/xp)
    as a great free choice to write ISO to a USB drive from which you can use the
    CD used with this book and follow the instructions on the pages below.


    As most of us do not have an optical drive, it''s better to use a flash drive.
    You''ll need a drive with at least 2GB of capacity. Make sure you back up any
    files stored on it, as the drive will get formatted when you use it. We''ve known
    some USB drives that refuse to be recognized by a computer, so if one fails to
    work, you may need another one. Turn on a computer with Windows on it and plug
    your chosen drive into your PC and make a note of its drive by clicking in the
    Start menu. It''s vital that you remember this or you could lose important data.


