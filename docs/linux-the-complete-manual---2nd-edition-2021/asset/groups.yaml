    会自动识别这些只需几英镑的设备。连接好适配器后，你应该会在桌面上看到蓝牙图标。如果没有，请重启连接。


    点击此图标会列出选项，包括“设置新设备”（Setup new device），它可以让你搜索蓝牙设备。然而，这种方法并不理想，因此从手机管理连接可能更好。首先，点击蓝牙图标并选择“偏好”（Preferences）。点击“让电脑可被”（Make
    computer discoverable）并输入电脑名称，该名称将出现在你正在搜索的手机上。


    > 你可以轻松与 Ubuntu 同步手机


