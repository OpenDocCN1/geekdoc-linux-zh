    # Connecting an iPod


    iPods can be a little trickier to use with Ubuntu than other MP3 players. Here
    are some tips on how to synchronise music and video.


    If there''s one area in which Ubuntu might prove frustrating, its compatibility
    with iPods. This is mainly Apple''s fault, not Ubuntu''s. Most iPods don''t show
    up as generic mass storage devices, which means you can copy music and videos
    to them using Ubuntu''s file manager as easily as with most MP3 players. The portion
    of storage that does appear when you connect a modern iPod to Ubuntu is the part
    that stores photos and possibly contacts, calendars, notes and recordings.


    The internal database is in proprietary format, which Apple created to prevent
    music and videos being illegally copied from an iPod to another computer. However,
    there are ways to use your iPod with Ubuntu, and plenty of models can be successfully
    synchronized, just as you would in Windows or Mac OS.


    The only models that are likely to cause problems are the iPod Touch, iPhone and
    the latest generation of Nano, Classic, and Video.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_75_0.png)


    - iPods, such as this Classic, will work fine with Ubuntu


    ## VIRTUAL WINDOWS


    As you''ll see, just different applications support iPods; you can also run iTunes
    in Ubuntu using VirtualBox, which is an application through which you can install
    and run virtual windows, and consequently iTunes.


    A word of warning, however: don''t try to run Wine (Windows Emulator) in iTunes.
    It only supports old versions of iTunes, and many pods require newer versions,
    so it won''t work. In addition, purchased music won''t play, and Apple Store won''t.


    The bottom line with iPods in Ubuntu is that there''s no guarantee that it will
    be easy to get your particular model working. Some programs require your iPod
    to be ''jailbroken''. That''s ![](img/55dc7df089fe0011a7e15a61689f37ea_75_1.png)


    ## BASIC DESKTOP TASKS


    Meaning to say that it won''t work with your iPod. Another point to note is that
    you''ll need to format (or initialise) your iPod on a computer running Mac OS,
    otherwise Ubuntu won''t be able to recognise it. If you have Windows or Mac OS,
    or if you''re running both Windows and Ubuntu on the same computer, it is likely
    to cause fewer headaches if you stick to the iPod. However, if you have only one
    and are made of stuff, you need


    ## USING GTPOD


    Gtkpod is a lightweight application that is designed to synchronize media with
    iPods. Search for it in Package Manager and it will appear immediately. When it''s
    installed, you''ll find it under Sound & Video Applications menu. It supports
    first-generation iPods including the Mini, Shuffle, Nano and Video. It''s capable
    of transferring MP3, WAV, audiobooks and videos to your iPod, but you''ll additionally
    need generic if you want podcasts. The interface is simple, but it gets the job
    done.


    ## AMORAK


    Amorak is a music player that has a Linux version and looks just like iTunes.
    It works ![](img/55dc7df089fe0011a7e15a61689f37ea_76_0.png)


    Banshee is a slick-looking iTunes, even though later versions lack support for
    the iPod Touch and the iPhone ![](img/55dc7df089fe0011a7e15a61689f37ea_76_1.png)
    ![](img/55dc7df089fe0011a7e15a61689f37ea_76_2.png) with music and iPods you can
    sync. The only thing is that it is a bit slow for any videos you may have. As
    a music management application, it''s well worth noting that it''s a powerful
    music player with a simple interface.


    Banshee is the default music manager in several Linux distributions, and it supports
    videos well. You can sync both music and videos to your iPod, and also supports
    podcasts. Unfortunately, the flaw is that gtkpod lacks support for the iPod Touch
    or iPhone.


    ## VIRTUALBOX


    Virtualbox can run operating systems in a Ubuntu window. As long as you have a
    licensed Windows disc and product key, you can use it to install Windows in Linux.
    You can also install any programs you like, including the latest version of Ubuntu.


    Virtualbox provides direct access to your computer''s hardware so Windows may
    not run particularly quickly, but it would allow you to synchronise your iPod
    for free. For many people, this is a tough cut and also a must-have. Pointlessly,
    as long as you can install Virtualbox on a separate hard partition of Ubuntu and
    use it independently.


    If you decide to give Virtualbox a try, you can find it in the same way as any
    other application using the search box in Synaptic Package Manager.


    # CHAPTER 4


    ## Connecting an MP3 player


    Transferring music, videos and podcasts to your MP3 player is simple in Ubuntu.
    Here we''ll show you how we''ve already looked at Banshee on page 72, and seen
    that it is extremely easy to use. It''s also great for MP3 players, as most use
    the MSC standard portable players that show them in the left-hand pane under Devices
    heading.


    MSC stands for Mass Storage Class, and is essentially the standard used by most
    devices that have storage capabilities. Ubuntu (and Linux in general) is able
    to recognise when these devices are plugged in, just as Windows. A window will
    pop up asking which program you''d like to open, and an icon should appear on
    the desktop. You can then access the device like any hard disk.


    ## MSC OR MTP?


    Some MP3 players support both MSC and MTP standards. MTP is closely linked with
    Windows Media Player and also DRM-protected audio files (usually those that have
    been purchased from an online music store) to be transferred to authorised players.


    If you find Ubuntu doesn''t detect your MP3 player, check its settings menu to
    switch your USB mode from MTP to MSC. Some players, such as certain models in
    SanDisk''s range, require a combination of buttons to switch.


    > Most MP3 players should be recognised by Ubuntu without any problems


    ![](img/55dc7df089fe0011a7e15a61689f37ea_77_0.png)


    If you prefer to transfer files manually, just use a File Browser to copy music
    - and your player supports it - straight to its internal memory ![](img/55dc7df089fe0011a7e15a61689f37ea_77_1.png)


    ## BASIC DESKTOP TASKS


    ## MANUALLY MANAGING MEDIA


    ![](img/55dc7df089fe0011a7e15a61689f37ea_78_0.png)


    Banshee makes it easy to get music on your player. Once you have your MP3 player
    listed under Devices, all you need to do is drag and drop tracks to it. You can
    select a range of tracks, albums or artists to transfer, or you can drag the All
    or All lists to your player if it has enough space.


    When you drop tracks on to, you''ll see a progress bar appear in the right corner
    of the window. This shows how many tracks have been transferred in the current
    queue.


    The same goes for podcasts. Just drag and drop them on your player, and they''ll
    be transferred. Unfortunately, Banshee has no synchronization capabilities, so
    it can''t fill your player automatically with a random selection of music in the
    same way as Windows Media Player. If you want an application that can sync music,
    you''ll need to install Amarok in the Synaptic Package Manager.

