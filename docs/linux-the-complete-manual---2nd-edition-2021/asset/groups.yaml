    \ 安全选项 | [Set] | |\n| SATA 模式 | [Disabled] | |\n\n## 网络存储\n\n```\ninstall -n 0\
    \ on /dev/sda -ZFS pool=root\ninstall -n 0 on /dev/sdb -ZFS pool=data\ninstall\
    \ -n 0 on /dev/sdc -ZFS pool=data\nUpgrade - fail from CDROM\nUpgrade and continue\
    \ - fail to go back to \"root\"\n  < Exit>\n```\n\n```\n挂载 CDROM\n正在设备 da0 上安装镜像。\n\
    卸载 CDROM。\nFreeNAS 已安装在 da0 上。\n现在可以移除 CDROM 并重启 PC。\nFreeNAS 按 Enter 继续\n```\n\
    \n```\n输入新的局域网 IPv4 地址：\n192.168.1.60\n< OK >  <Cancel>\n```\n\n安装完成。然而，这使得升级到\
    \ FreeNAS 的最新版本变得更加复杂。在操作期间，请确保禁用键盘错误选项，因为你的 FreeNAS 在就绪后不需要连接显示器或键盘。\n\n另一个需要考虑的配置选项是你是否想使用\
    \ RAID，FreeNAS 允许你使用任何常见的 RAID 类型（详情请见 http://tinyurl.com/raidlevels）。使用数据 RAID\
    \ 至少需要两块磁盘。其优点是增加了速度和可靠性，你以后可以在 PC 上添加磁盘以增加存储。另一种方法是单独安装每块磁盘；如果你只有一个磁盘，这是你的选择。我们将在逐步说明中展示如何使用这两种方法。\n\
    \n按 Enter 将 FreeNAS 安装到计算机的硬盘上。选择选项一并按 Enter。FreeNAS 将确认它将创建的分区并警告你的整个磁盘将被擦除。按\
    \ Enter 继续。从列表中选择你的光驱并按下。选择你想要安装 OS 的闪存盘，其名称应以 \"da\" 开头并再次按下。\n\n## 连接你的 PC\n\
    \n你现在准备好在计算机上安装操作系统了。在开始之前从你创建的磁盘启动。控制台设置菜单出现，将你的 USB 驱动器插入空闲端口，输入 9。\n\n| 系统\
    \ 网络服务 访问管理器 高级帮助 |\n|---|---|---|---|---|\n| 磁盘 | 管理 | 添加 | | |\n| 描述 | | | |\
    \ | |\n| da0 | | | | | |\n| /dev/da0 (IDE CDROM) | | | | | |\n| 类型 | | | | | |\n\
    | 大小 | | | | | |\n| 650 MB | | | | | |\n| 空闲空间 | | | | | |\n| 0 B | | | | | |\n\
    | 已用 | | | | | |\n| 0 B | | | | | |\n| 已挂载 | | | | | |\n|否 | | | | | |\n| ZFS\
    \ | | | | | |\n| 分区 | | | | | |\n| UFS | | | | | |\n| 大小 | | | | | |\n\n你只需要选择一个此范围之外的\
    \ IP 地址即可。为了安全起见，建议选择比最后一个 DHCP 地址大 10 的地址。所以取前三个数字，并在最后一个数字加 10 —— 例如，这将是 192.168.1.60\
    \ —— 并将其记录下来，你之后需要它。\n\n将地址输入 FreeNAS 并按下你网络使用的掩码。你的网络可能是 255.255.255.0，所以输入 24\
    \ 并按 Enter。在接两个屏幕上，你需要输入网关和 DNS 地址。两者都是你的 IP 地址类型。最后，对 IPv6 框说不”并按 Enter。最后，系统将提示你确认\
    \ IP 地址已配置。\n\nFreeNAS 将自行安装到闪存盘中，这只需要几秒钟。完成后，你将收到一条消息让你移除光盘并重启计算机。遵循这些指令并确保你的计算机已设置为从\
    \ USB 设备启动。\n\nFreeNAS 现在正在运行，因此你可以切换到它的 Web 界面进行进一步配置。在浏览器的地址栏中输入 FreeNAS 的 IP\
    \ 地址。默认用户名为 'admin'，密码为 'freenas'。\n\n当你进入控制台设置菜单时，你会看到一个与步骤 1 类似的控制台设置菜单。输入 2\
    \ 然后按 Enter 选择你想使用的网络接口。选择那一个（带有括号的）并按 Enter。等待配置完成然后再次按 Enter。接下来，设置让 FreeNAS\
    \ 计算机使用的 IP 地址，输入 2 然后按 Enter。系统会询问你是否想使用 DHCP。如果你的路由器有为特定 PC 固定 IP 地址的选项（很多都有），选择是。\n\
    \n否则，选择否。在这种情况下，你必须手动选择一个 IP 地址。安全访问简单的方法是从 PC 访问路由器管理页面并查看 DHCP 服务器设置。你会看到一个起始地址，例如\
    \ 192.168.1.1 和一个结束地址，例如 192.168.1.50，或者一个说明它有多少个地址的数字，例如 50。在这种情况下，将你的 IP 地址设置为在\
