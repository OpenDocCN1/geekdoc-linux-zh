    ## 使用 Gimp 改进照片


    对于初学者来说，Gimp 的界面可能会让人有些无从从。这些简短的教程将引导你使用主要工具。


    Gimp 可能不是最容易使用的编辑器，但它是最强大的编辑器之一。与 Picasa 相比，它让你对照片拥有更多控制权。


    阴影比眼外要暗。如果有必要，你可以调整色调以匹配主体眼睛的实际颜色；一旦缩小回去，不太可能有人注意到。


    ## 处理红眼


    在你的收藏中，难免会有主体人物遭受红眼困扰的照片。否则，非常棒的照片可能会被盯着你看的“激光红眼”毁掉。这是由于相机闪光灯的光线在主体视网膜上反射造成的，在夜间室内拍摄的照片中，你总能看到这种效果。坦率地说，使用
    Gimp 很容易去除红眼，只需要几分钟时间。


    - 启动 Gimp 并打开你想编辑的照片。我们的这张照片是在晚上用开启闪光灯的紧凑相机拍摄的。两个人物的眼睛看起来都有像鬼一样，我们需要处理这个问题。


    - 放大到 400%。使用套索工具（工具栏顶部左起第三个）在问题区域周围画一个圆。如有必要，按 Enter 键完成选择。然后按住 Ctrl 键选择眼睛中间的高亮部分，我们不需要调整这部分。


    - 在“工具”菜单中，点击“颜色工具”，然后点击“色调-饱和度”。向左拖动饱和度滑块，同时也向左移动亮度滑块，直到……


    - 现在我们需要一点饱和度，所以从颜色滑块向右打开“色调-饱和度”工具——取决于你相机的处理情况，你可能比我们在这里应用的 +15 需要更多或少。


    如果你想增加单个颜色的饱和度——例如天空的绿色或蓝色——只需点击要修改颜色旁边的白圈，并调整它的滑块。如果你出错了，只需点击“重置”按钮即可。


    - 如果“级别”调整没有给你足够的对比度，你可以通过“亮度-对比度”工具轻松添加，你可以在“颜色”菜单中找到它。调整滑块直到看到理想的结果。


    ## 增强你的照片


    这张照片是我们湖湖区拍摄的，在将好照片从普通照片中挑选出来后，它几乎没有进入我们的“最佳图像”文件夹。尽管它看起来平平无奇，但我们可以看到它具有巨大的潜力。Gimp
    前来救援并增强了它。在这里我们将展示如何使用 Gimp 的主要修饰工具。


    - 锐化照片总是一个好主意，因为数字相机倾向于出错并留下伪影。Gimp 的“锐化”工具对此此非常出色。你可以在菜单的“增强”部分找到它。将预览窗口移动到图像显示精细细节的区域，切换开启预览以查看差异。如果你过度锐化图像，会导致产生不必要的伪影。现在图像看起来良好良好，我们的修饰工作完成了。复制而不是覆盖原始文件是一个好主意。这意味着如果你不喜欢更改，可以从头开始。


    - 在 Gimp 中打开图像，直接使用“级别”工具，你会在一个看起来可能人生畏的窗口中找到它，但了解 Gimp 工具箱中最有效的工具之一是值得的，特别是对于像这样注入对比度。直方图显示了图像像素强度的表示。左侧是非常深色的像素，随着向右移动它们会变亮。拖动左侧箭头，直到它与上升曲线的起点对齐。这会加深阴影。在右侧，抓住白色箭头并将其拖到图表消失点。这会提高高光部分。


    ## 使用 Picasa 管理照片


    Google 的照片管理软件是不可比拟的，它在 Linux 上运行良好。在这里我们将展示你如何使用它。有时，比 Ubuntu 提供的应用程序更适合这项工作。Shotwell
    照片管理器并不糟糕，但 Google 的 Picasa 可以做很多事情，而且界面非常流畅。如果你已经熟悉 Windows 版本的 Picasa，你会高兴地听到它在
    Linux 中是完全相同的，因为它使用了 Windows。要下载 Picasa，请访问 http://picasa.google.com/linux 并点击大的下载按钮。我们选择了版本
    3，但如果你更喜欢更稳定的程序，可以安装 2.7。确保你下载适用于 Debian/Ubuntu 的 .deb 文件，并为你的操作系统选择合适的版本：32 位的
    i386 或 64 位的 AMD64。安装 Picasa 有多种方法，最简单的方法是双击文件进行安装。如果失败了，将其复制到 /tmp 文件夹并按 Alt+F2
    打开命令提示符。输入 picasa-：


    - Picasa 拥有友好的界面，很容易相处。


    | 软件包 | 安装 |

    |---|---|

    | picasa | 安装 |


    ```bash

    sudo dpkg -i /tmp/picasa_2.7.3736-i386.deb

    ```


    - 安装 Picasa 有几种方法。下载并运行文件是最简单的方法。Picasa 是那个惊人的照片编辑器，能让你在指尖下产生强大的效果。Picasa 让你轻松分享、裁剪和编辑照片。有了
    JPEG 和 TIFF 等许多格式，你可以轻松创建新照片。Picasa 确保你的照片始终井然有序。


    Picasa 现在已安装，你可以在应用程序菜单中搜索找到它。加载它，它会自动扫描磁盘照片。然后你会看到类似的内容。如果你找到了照片，可以使用菜单中的“将文件夹添加到
    Picasa”导入它们。


    ## 开始使用 PICASA


    如你所见，文件夹分为两个面板：文件夹列表和每个文件夹中的缩略图。右下角有一个缩放滑块，可以改变缩略图的大小。右侧的滚动控件不像普通的条；Picasa 让你轻松地组织、编辑和分享照片。使用左右箭头在文件夹之间移动它们。要返回库视图，只需点击左侧的“返回库”。


    ## 分享照片


    你可能可能展示展示你的照片，一种方法是播放幻灯片。如果你在库视图中，会在每个专辑或文件夹的顶部看到一个绿色箭头。点击它将播放全屏幻灯片。将鼠标移动到屏幕底部暂停幻灯片。你可以设置图像之间的间隔和切换。这让你通过
    Web Albums 与朋友家人分享照片。点击视图右上角将照片上传到 Web。如果你已经登录，就可以使用 Web Albums 了。


    '
