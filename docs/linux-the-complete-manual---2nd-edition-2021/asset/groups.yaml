    n the same way you can set Windows’ wallpaper to an image of your choice, you
    can also do the same in Ubuntu. You can also change the colour, icons and windows
    are personalised to your taste.


    To see Ubuntu’s default themes, go to System menu at the top of the screen, click
    Preferences, then you’ll find 11 themes to choose from, and Human is already selected.
    Click on any theme and it will be applied immediately you can see how it affects
    not only the window you have but the whole desktop, including the top and bottom
    bars. Some are more subtle than others. Clearlooks, for example you may switch
    the default orange colour to a light blue. However, click High Contrast and the
    changes are much more noticeable. If you like a particular theme, simply click
    the Close and the theme will remain applied.


    The default themes are a little limited, so it’s worth installing some new ones.
    Leave the Appearance window open and head to the System menu again, but this time
    click Administration, then Synaptic Package Manager. Enter your password, and
    the Manager will open the list of packages. In the Search box type gnome you should
    see the package list update and show gnome-extras at the top of the list. Click
    on the grey square to the left of it, and Mark for Installation in the menu that
    appears.


