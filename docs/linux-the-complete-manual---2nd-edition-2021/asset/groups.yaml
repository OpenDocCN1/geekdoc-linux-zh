  - '[PAGE 67]


    # Connecting a video camera to your PC


    Linux is perfectly capable of editing your video files. Here we''ll show you how
    to transfer your files from your camcorder to your PC


    connecting your digital camera to Ubuntu would be pretty easy, the operating system
    has built-in support for camcorders. However, there are some areas that could
    give you problems. Before we start, we''ll talk you through the difficulties you
    might face.

    There are two types of video camera that you''ll likely want to connect to your
    computer: MiniDV and memory flash storage models. Short, MiniDV models will be
    very tricky to install. Many require a FireWire port to connect and a special
    driver to be installed. It''s not possible to work around the problem, but you''re
    likely to run in a number of difficulties when doing so. Our advice is to keep
    a PC running Windows handy for connecting this kind of camcorder.

    If you have a flash-based or hard-based camcorder, things are a lot easier. In
    this section we''ll show you how to connect this type of camera and copy files
    to your Ubuntu computer.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_67_0.png)


    Modern flash-memory or hard-based camcorders are easy to connect to Ubuntu


    ![](img/55dc7df089fe0011a7e15a61689f37ea_67_1.png)


    CONNECTING YOUR CAMERA

    Depending on the type of camera that you own, you''ll have a choice of connection.
    If your camera uses removable storage, such as an SD card, you can use a USB card
    reader. Ubuntu recognises these devices in the same way as Windows does. All you
    have to do with a card reader is to take the memory card out of your recorder
    and plug it in. The reader will become available in Computer from the menu. All
    you need is to copy the files that you require from.

    If your camera does not have a memory card reader, your only option is to plug
    in your camcorder using USB. In our experience, camcorders can use a weird and
    wonderful collection of USB cables, so remember to use the one that came in the
    box with your camera.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_67_2.png)


    THE COMPLETE LINUX MANUAL'
