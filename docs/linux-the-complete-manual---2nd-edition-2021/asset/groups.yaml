    the files and folders you have stored online and lets manage them. You can delete
    files and create folders. One feature that the website gives you is that it lets
    create shared folder that you can invite others, making it a great way to collaborate
    with others. You can also share files with people who don''t have Dropbox accounts
    using the special Public folders. Anything uploaded to Public folder will be shared
    with read-only access. You simply right-click the file or folder you want to share
    and select Dropbox, Copy Link, and send them by email. Send this link to your
    friends, and they can view your high-resolution photos.


