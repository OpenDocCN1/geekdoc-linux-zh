    ## CHAPTER 1

    ### Introduction to Linux


    The Linux operating system is a great alternative to Windows. As you''ll learn
    over the next pages, there are plenty reasons to use it other than the fact that
    it''s free.


    One important point to note about Linux is that there are many different versions,
    or distributions as they are known. Each version is based around a kernel (the
    core part of the operating system), but they vary when it comes to interface and
    software they include.


    Ubuntu is one of the most popular and easy-to-use distributions, and it''s the
    one we''ll use throughout this book. You''ll find a copy of the latest version
    on the back page. Of course, you can try any distribution if you prefer; Linux
    Mint, Mandriva, Debian and Fedora are all popular choices.


    How to get Linux 6


    ## Why should I use Linux?


    There are many reasons to use Linux beyond the fact that it''s free. Here we''ll
    explain why it''s a viable alternative to Windows that really costs you nothing.
    Well, nothing more than the price of this book. Not only is the operating system
    free, but all the software and utilities you''ll need are either included as part
    of Linux or you can install them with just a few clicks, all for free.


    Another thing that couldn''t be easier: you''ve even put Ubuntu on a CD or DVD
    and boot from it; you don''t need to install it. If you''re not convinced, here
    are eight reasons why you should switch to Linux.


    The programs you have for Windows are free in Linux, or they aren''t installed
    at all. You won''t have that problem with Ubuntu. LibreOffice is included by default
    and has compatible versions of Word, Excel and PowerPoint. You can create letters,
    spreadsheets and start sending emails immediately.


    There''s plenty else: photo-editing software, music and video players, instant
    messaging and disc-cutting utilities – the list goes on. You will find these examples
    in Chapter 4.


    Ubuntu will run on any computer. Whether you''ve got the latest quad-core PC or
    a relic with hardly any RAM, Ubuntu will work. In fact, it will use the full power
    of both machines.


    Ubuntu is a very lightweight operating system; older computers can be given a
    new life. Instead of feeling sluggish and taking 10 minutes to boot up, you can
    feel snappy by swapping a clogged-up version of Windows with Ubuntu. Ubuntu is
    for the desktop or has the latest quad-core processor will make the most of it.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_7_0.png)


    Viruses and malware are virtually non issues. Most computers run Windows, the
    vast majority of viruses are written to target that operating system. There are
    almost no cases of Linux suffering from virus attacks, and as Ubuntu is updated
    regularly, security holes are patched quickly.


    Extra reassurance comes from the fact that, unlike Windows, the main computer
    user doesn''t have administrator rights. In simple terms, this means there''s
    a limit to the parts of the operating system that can be accessed, and provides
    greater safety from malware.


    Updates are ready. Ubuntu has a central update manager that manages all the programs
    you''ve installed. There''s just one place you need to go to get new versions,
    and no reason to manage updates for third-party software. A typical Windows PC
    is littered with programs that run constantly, checking if a new version of the
    program is available. This uses system resources and makes your computer run more
    slowly.


    You don''t need a second monitor. In Windows, you have only one desktop. Open
    a few windows and you''ll soon become juggling them all. In Ubuntu you have multiple
    workspaces, which are like virtual monitors. Click on one, and you switch to a
    new, clean desktop. It''s so easy to flip between workspaces that you''ll never
    be able to go back.


    There''s no adware or service numbers. If you want to install extra programs,
    do it through Ubuntu''s Package Manager. There are thousands of applications to
    choose from, and all are free. If you like the software, keep it; if not, uninstall
    it. You''ll never have to remember it, your days will not be marred by advertisements.


    It''s just like you know how to use Windows. In Ubuntu, you''ll be right at home.
    Almost everything works the same way, from the ''start'' menu to navigating files
    and folders. Tooltips will pop up to let know what each icon and do, and there''s
    also a comprehensive Help Center.


    Hardware is much better than it used to be. One reason people haven''t tried Linux
    because they think it will not work with their hardware. The truth is that, unless
    you have a really obscure bit of it, Ubuntu is likely to work with it. You''ll
    probably find that most of your computer''s features work as soon as Ubuntu is
    installed, from wireless networking to your memory reader.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_8_0.png)


    > Ubuntu is ready to use, and provides help at every turn


    # WHAT CAN''T LINUX DO?


    There are many games available for Linux, but you won''t be able to play the latest
    titles that are available for Windows. This is because Linux can run alongside
    Windows—a technique known as dual-boot—so you can still enjoy Call of Duty, Colin
    Mean or your favourite games on the same computer.


    If we''re honest, Linux does have other failings. Although it includes a ready
    array of applications, for example, Ubuntu needs some code to be installed to
    record music in MP3 format.

