    ## 第 2 章


    ## 安装 Ubuntu

    笔记本电脑


    在便携式电脑上安装 Ubuntu——即使是配置相对较低的电脑——也能让它焕发新生。


    Linux 的最大优点之一是与 Windows 相比，它需要的资源较少。这对于像上网电脑（netbooks）这样的低配置电脑尤为困难。Windows 可能会是一个资源大户，并且并不是为小屏幕运行设计的，而
    Ubuntu 的设计旨在充分利用低分辨率和运行速度较慢的机器性能。


    它适用于所有电脑，因为并非所有的笔记本电脑都带有 CD 驱动器。在你的上网电脑或笔记本电脑上安装 Ubuntu 与你之前使用的情况有所不同。


    在开始之前，你需要打开电脑并进入 Windows。Windows 上网电脑或笔记本电脑需要 Windows 软件才能使快捷键生效。这些键在 Ubuntu 中可能无法工作，因此最好依赖于无线网络或其他你可以使用的设备。完成后，关闭电脑。


    Ubuntu 的网络版（专为安装在低配置机器上量身定制）已不再提供，但标准版已经经过调整，使其能够：


    > 通用 USB 安装程序可以将 USB 驱动器转换为用于安装 Linux 的启动盘


    安装文件可以从 http://ubuntu.com 免费下载。点击链接将把 CD 大小的 ISO 文件下载到你的电脑。如果你的上网电脑或笔记本电脑带有 USB
    光驱驱动器，可以使用 CD 刻录软件（CDBurner/xp）作为一个极佳的免费选择，将 ISO 写入 USB 驱动器，然后你可以使用书中附带的 CD 并按照下面的说明进行操作。


    由于我们大多数人没有光驱驱动器，因此使用 U 盘更好。你需要一个容量至少为 2GB 的驱动器。确保你已备份存储在上面的任何文件，因为使用它时驱动器会被格式化。我们遇到过某些
    USB 驱动器无法被电脑识别，所以如果一个无法工作，你可能需要另一个。打开一台运行 Windows 的电脑，将选择的驱动器插入电脑，并通过点击开始菜单记录它的驱动器编号。记住这一点至关重要，否则你可能会丢失重要数据。


    ![](img/55dc7df089fe0011a7e15a61689f37ea_17_0.png)


    《Linux Linux 手手册》17


    # 安装 Ubuntu


    CMOS 设置程序 - 版权所有 (C) 1984-2008 Award Software

    高级 BIOS 特性


    | 硬盘优先级 | 项目帮助 |

    | :--- | :--- |

    | 第一启动设备 [硬盘] | 菜单级别 |

    | 第二启动设备 [CD-ROM] | |

    | 第三启动设备 [自检查] | 选择启动设备 |

    | 硬盘 S.M.A.T. 能力 [启用] | 优先级 |

    | USB 磁盘驱动器 [启用] | [软盘] |

    | 无执行内存保护 [启用] | 从软盘启动 |

    | CPU 增强型 (CIE) [LS120] | |

    | CPU 温度监控 [禁用] | 从 LS120 启动 |

    | 虚拟化技术 [启用] | [硬盘] |

    | 全盘完整性 [启用] | 从硬硬盘 (HDD) 启动 |

    | 初始化优先级 [FPG] | [CD-ROM] |


    ```

    F1++回车键:选择 =+/-/ 数值 F10:保存 ESC:F1:常规帮助

    F5:上一个值 F6:安全默认值 F7:优化默认值

    ```


    ![](img/55dc7df089fe0011a7e15a61689f37ea_18_0.png)


    ## 制作启动盘


    要让 U 盘变为可启动状态，你需要从 http://ubuntu.com/download 下载通用 Ubuntu 安装程序并从你的 USB 驱动器运行它。你可以从下拉列表中进行选择。你会发现所有最流行的发行版的选择，并且有一个下载版本
    ISO 文件的选项；然而，Ubuntu 11.04 可能不在列表中。如果没有，请从第一个下拉菜单中选择“其他 ISO”。点击“浏览”按钮并导航到你下载的 Ubuntu
    ISO 文件。


    首先，插入你的 U 盘并按照你之前记录的步骤操作，点击格式化驱动器并点击“创建”。你的 U 盘将自动转换为启动盘。


    完成后，选择保存设置并退出 BIOS 的选项。你的笔记本电脑应该重启并从 USB 驱动器启动。你看到的第一个界面是菜单。第一个选项允许你在不安装系统的情况下尝试
    Ubuntu，而第二个选项允许你在笔记本电脑上安装此操作系统。


    ## 如何……在你的上网电脑或笔记本电脑上安装 Ubuntu


    ## 从 USB 启动


    接下来，配置你的上网电脑或笔记本电脑从 USB 驱动器启动。将 USB 插入 USB 端口并打开笔记本。你需要按下正确的键进入 BIOS：这通常是 F2 或
    F10，但请留意屏幕上的任何信息。进入 BIOS 后，寻找“启动优先级”（Boot Priority）部分。这在每台电脑上的位置都不一样，所以你可能需要到处找找。一旦找到，将第一个启动设备设置为你的
    USB 驱动器：


    > 在第一个屏幕上，你将看到一组 PC 为了实现最佳安装而需要匹配的标准。连接互联网是最重要的，因为 Ubuntu 可以在安装时下载最新补丁；选择“安装时更新”。为了让播放器、Flash
    和其他文件正常工作，Ubuntu 需要安装额外软件。勾选“安装此第三方软件”并继续。


    > 如果你想保留现有的操作系统，选择“安装 Ubuntu 并并存”。如果你想抹除现有系统，选择“抹除”并继续。这将擦除整个硬盘，建议使用 Paragon Hard
    Disk Manager 等软件备份或随笔记本自带的说明。或者，你可以选择“安装 Ubuntu”，这会在启动电脑时提供 Linux 或 Windows 的选择。准备就绪后点击“现在安装”。


    《Linux 手手册》17


    ![](img/55dc7df089fe0011a7e15a61689f37ea_19_0.png)


    ## 分配磁盘空间


    为了获得最佳效果，请确保此电脑：


    - 有至少 25GB 可用磁盘空间

    - 已电源

    - 已连接互联网


    此电脑目前安装了 Ubuntu 10.10，你想做什么？


    - 安装时下载更新

    此软件允许你显示 Flash、MP3 和其他媒体，并与某些特殊硬件工作。部分软件是闭源的。软件受下方包含的许可条款限制。


    - 在现有 Ubuntu 10.10 上安装 Ubuntu 11.04

    - 将 Ubuntu 10.10 升级到 11.04

    - 抹除 Ubuntu 10.10 并重新安装

    - 安装此第三方软件


    警告

    - 其他选项


    ![](img/55dc7df089fe0011a7e15a61689f37ea_19_1.png)


    ## 你的位置在哪里


    ![](img/55dc7df089fe0011a7e15a61689f37ea_19_2.png)


    ## 你是谁？


    你的姓名：david london


    选择一个密码：fairpassword


    - 自动登录

    - 需要密码登录

    - 加密我的主目录


    你需要配置用户账户和电脑名称。出于安全考虑，你可能需要输入密码，尽管你可以点击“自动登录”选项。为了最大的安全性，请点击“需要密码登录”和“加密我的主目录”并点击继续。最终文件将复制到你的硬盘并进行安装。根据
    USB 驱动器和互联网连接的速度，可能需要一段时间才能完成。完成后，点击“重启”。


    《Linux 手手册》17


