    \ what application to launch.\n\nSelect how to open the 'BOURNE_ULTIMATUM' video\
    \ and perform this action in the future for other media of type \"VIDEO DVD\"\
    .\n\n- Open Movie Player\nAlways performs this action\n\nCancel OK\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_72_3.png)\n\
    \n- To play a DVD, insert the disc into your drive and wait until it is recognised.\
    \ A popup window may appear asking you to select how to open the Video DVD. We\
    \ recommend choosing VLC media player and taking the Always perform this action,\
    \ before clicking OK.\n\n- The DVD should play automatically, but if it doesn't,\
    \ choose Open Disc... from the File menu. A slightly bewildering window will open,\
    \ but you can simply click the Play button.\n\n- You can now use the menus with\
    \ mouse, selecting scenes or playing the movie from the beginning. To play video\
    \ files stored on your hard disk or an external USB device, browse the file using\
    \ File Browser window and drag it on to VLC's interface. As VLC supports most\
    \ video formats, it can play your file. To play high-definition files, you'll\
    \ need a powerful computer. If yours isn't up to the job, you may see stutter\
    \ video or no video at all.\n\nTHE COMPLETE LINUX MANUAL\n\n## Playing music files\
    \ with Banshee\n\nUbuntu's built-in music player lets you organise your music,\
    \ create playlists and listen to podcasts and internet radio stations.\n\nBanshee\
    \ Music Player is the default application for importing music, replacing Rhythmbox.\
    \ If you prefer Rhythmbox you can install it from the Ubuntu Software Centre.\
    \ We'll focus on Banshee in this guide, which is a powerful media manager that\
    \ you can use to rip your CDs to MP3 format.\n\nBefore you start, you need to\
    \ install the necessary audio codcs. Click on Ubuntu Software Centre from the\
    \ Launcher and type Restricted into the search. Double-click Ubuntu extras and\
    \ Install. You can now start Banshee.\n\nOn the left, you'll find a pane with\
    \ your library shortcuts, music stores and playlists. When right, you'll see three\
    \ panes for artist, album and a track listing. These will be blank, of course,\
    \ until you import your music collection.\n\nTo import tracks from a CD, you need\
    \ to select your preferences. Click on Preferences from the Edit menu, then click\
    \ on the Source tab. Select Audio CDs from the Source menu. Under Format select\
    \ MP3 (Lame Encoder), then click Edit. Select the Bitrate that you want to use.\
    \ We recommend a bitrate of 192Kb/s, but 300Kb/s will give you higher quality\
    \ audio that rivals that of the original CD.\n\nTo import an audio CD, insert\
    \ it into your computer's optical drive. The disc will appear in the left hand\
    \ panel of Banshee. The name and track title will be automatically downloaded\
    \ from the internet. Select \"Audio CD\" to convert the tracks to MP3. A status\
    \ bar at the bottom shows you how far through the process it is. When it's finished,\
    \ you can remove your CD.\n\n### IMPORTING OLD MUSIC\n\nThe place to tracks that\
    \ you already have in MP3 format is the Music folder, which you can access in\
    \ Ubuntu's Places menu. To import your existing MP3 tracks, head to the Media\
    \ menu in Banshee and choose Import Media. Select Files, then click Import.\n\n\
    - The first thing you need to do in Banshee is import your music collection\n\n\
    - Banshee supports album art and will show garish visualisations when playing\
    \ tracks if you so desire\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_73_0.png)\n\
    \n## BASIC DESKTOP TASKS\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_74_0.png)\n\
    \nexample, navigate to the Friday Night podcast on Radio 4's website and you'll\
    \ see an RSS link. Click on this and copy the URL from the address bar in your\
    \ browser. Now back in Banshee, right-click on Podcasts and select Add Podcast.\
    \ Banshee should show the most recent episodes automatically. You can download\
    \ other episodes by double-clicking on them.\n\n### BLAST FROM THE REST\n\nLast.fm\
    \ is a website (www.last.fm) that lets you listen to music you choose for free,\
    \ with a personalised radio. Visit the website and sign up for an account. Return\
    \ to Banshee and click on Last.fm from Account. The latter starts with artists\
    \ you like, while the former includes tracks from similar artists.\n\nClick on\
    \ the Music tab of the window that opens and click OK. All music will now be added\
    \ to Banshee's library. You may have music in several formats (MP3, WMA and AAC),\
    \ and the codecs for some of these formats may not be installed. If they're not,\
    \ Banshee will ask you to search for the appropriate codec using Ubuntu's Package\
    \ Manager.\n\n### PLAY TIME\n\n- Playlists are easy to create and are useful for\
    \ listening to a variety\n\nOnce the process has finished, you can browse the\
    \ library tracks by double-clicking on them. Unless you want to listen to a single\
    \ track, you'll want to play playlists. The simplest way to do this is to enter\
    \ an entry by Artist, Album or Genre in the Queue. Now click on Queue to start\
    \ the track. Banshee will ask you if the tracks are under order or you want the\
    \ shuffle button at the bottom.\n\n### LISTENING TO PODCASTS\n\n- Adding playlists\
    \ can be tricky as you'll need to know the URL of the feed\n\n### RADIO STATION\n\
    \nBanshee comes with a small selection of stations, but you might want to add\
    \ your own. With podcasts, you'll need to get the URL of your chosen station before\
    \ adding it. To add BBC Radio 2, for example, search on www.bbc.co.uk/live/2.ram.\
    \ Right-click on Banshee and Select Add Station. Paste or type the URL Click Add.\
    \ It should now appear in the Radio list. Just double-click any station that you've\
    \ added it.\n"
