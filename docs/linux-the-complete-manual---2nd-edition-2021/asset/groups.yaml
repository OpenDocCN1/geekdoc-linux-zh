    # CHAPTER 7


    # Making your own NAS


    If you have an old PC sitting around doing nothing, you could turn it into network
    storage using the powerful FreeNAS system


    An old PC can easily go to waste, with FreeNAS you can make good use of it and
    turn it into a powerful network-attached storage (NAS) device. Best thing of all
    is that FreeNAS, as name suggests, is completely free.


    Unlike commercially available NAS devices, FreeNAS has a wealth of features and
    as you''re using a PC, the ability to support a lot of hard disks. Here''s how
    you would install and share files (see pages 136 to 139 for better configuration
    options).


    To install FreeNAS on a PC you''ll need a computer with at least one hard disk
    and an optical drive. FreeNAS uses a USB flash drive. You''ll need a drive with
    at least 64MB of disk space; you can use USB models for older E3 if you don''t
    have one.


    To start, download the OS image of the system from www.freenas.org. You need the
    LiveCD version. There are two versions for:


    > You need to enter BIOS and set your computer to boot from USB for the optimal
    FreeNAS installation


    for Intel processors and for AMD 64-bit processors. Make sure you select the right
    version, and download the ISO file to your PC. This file is an image of a CD that
    needs to be written to a blank disk (see page 46 for details on burning a disc).
    For Windows PCs, use the FreeDBurnXP (http://cdburnxp.se)


    # GIVEN THE BOOT


    To do this, on your FreeNAS PC, plug in your USB flash drive and enter the BIOS
    (normally you have to press Del, F10 or F12, look for a message telling you which
    key to press). T until Advanced BIOS boot options. There may be an option to boot
    from USB, which you need to select a USB flash drive from the boot order devices.
    If the USB is detected as a hard disk then select it as the first


    If you can''t boot from USB drives, you can install FreeNAS to one of your hard
    disks, which might make configuration harder later or prevent you from using this
    disk in a RAID array.


    Alternatively, you can connect the drive to a boot port and boot the PC from the
    FreeNAS Live CD. Your settings will be saved automatically to the drive, so there''s
    no


