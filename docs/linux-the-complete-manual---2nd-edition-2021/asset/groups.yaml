    ## 使用 Ubuntu One 进行备份


    如果你想一种快速自动备份文档的方法，内置的 Ubuntu One 应用可以提供帮助。


    随着我们存储在 PC 上的数据变得越来越重要，确保它们被备份至关重要。最可靠的方法之一是使用在线备份服务，将数据安全地存储在那里。对于 Linux 用户来说，好消息是
    Ubuntu 内置了这样的 Ubuntu One。


    在线备份是确保重要文件受到保护的好方法。通过将数据存储在远程服务器上，即使你的房子被烧或电脑被盗，你的文件也是安全的。Ubuntu One 的最新版本可以为你完成这项工作；仍然值得制作本地的
    Linux 备份工具，这些工具恢复速度更快，但在线备份会带给你额外的安全感。


    我们将向你展示如何获取免费账户，该账户为你提供 2GB 的存储空间。如果你需要更多空间，还有更高容量的账户可用，且升级现有账户非常简单。


    ## 入门


    你需要创建一个 Ubuntu 账户。从启动器登录 Ubuntu One。第一次运行应用程序时，你将进入一个提示你登录 Ubuntu 单点登录 (SSO) 账户的屏幕。如果你已经有了
    Ubuntu 单点登录，你将有一个账户链接；点击“加入”，填写表单并点击“完成”。你将收到一封包含验证码的邮件，你需要该代码来激活你的 Ubuntu 账户。


    从邮件中复制此代码并粘贴到你的框中，然后点击确定。系统会提示你输入密钥密码，该密码应该已经设置好了。将显示一条消息告知你的账户已创建。


    一旦创建了账户，你就可以使用 Ubuntu One 应用了。第一个选项卡显示你的账户并允许升级存储空间。这可以 20GB 为一组进行购买，每月花费 2.99
    美元（约 1.85 英镑）或每年 30 美元（约 18.50 英镑）。


    点击“服务”选项卡查看你的在线存储“本地复制以便离线操作”和“使用此地址簿自动完成”。点击确定，你的设置将被更改。


    ## 备份文件


    Ubuntu One 的主要优点之一是能够自动备份文件并在多台计算机之间同步更改。它使用默认文件夹，尽管手动检查设置更好。请注意，你不能使用 Nautilus
    文件管理器备份单个文件；必须是文件夹。


    点击启动器打开文件浏览器。在这里，你会看到一个名为“Ubuntu One”的文件夹。它是自动备份的，向其中的任何新副本都将通过你的存储文件夹进行同步。这对于我们稍后介绍的特殊功能也有用。


    然而，你可以同步其他文件夹。打开你的“文档”文件夹，看到顶部有一条栏。然后点击“与此文件夹同步”复选框，显示该文件夹及其所有内容都已备份。然后你可以点击勾号停止该文件夹的同步。要同步其他文件夹，浏览到它们并点击复选框。所有子文件夹都会自动同步，并且可以单独开启或关闭。文件在在线备份后，旁边会有一个绿色勾号。


    默认情况下，Ubuntu One 设置为同步你想共享的文件夹（这些必须是设置为同步的文件夹）。要做到这一点，你需要选择要共享的文件夹，右键点击它并选择 Ubuntu
    One，“共享”。你的所有人将出现在对话框中——你只需点击联系人并点击共享。你可以按住 Ctrl 键并点击选择多个联系人。如果你希望这些人具有只读权限，可以取消勾选修改。


    到此时，你可能对你的配置很满意了。如果你开启另一台 Linux 计算机并登录相同的 Ubuntu One 账户，在线文件将出现在该计算机上。对任何文件的更改都会复制到所有其他计算机。


    除了提供同步和备份功能外，Ubuntu One 还有智能功能。


    与你共享文件夹的人需要 Ubuntu One 账户，并且你必须你的联系人地址与他们用于 Ubuntu One 的邮箱地址相同。一旦你共享了文件夹，它将出现在朋友的
