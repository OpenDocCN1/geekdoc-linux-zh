    \n# 安装 UBUNTU\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_0.png)\n\n启动器（Launcher）是一个用于应用程序快捷方式的专用栏。当前运行的应用程序旁边会有白色箭头。若要将应用程序保留在启动器中，右键点击并选择“保留在启动器中”。要从启动器中移除应用程序，只需取消勾选即可。如果启动器消失了，将鼠标移动到屏幕左侧。\n\
    \n这是通知区域，看起来和 Windows 一样。图标会出现在这里通知你各种功能的状态。在这里你可以看到 Wi-Fi 信号强度（由蓝色条指示），并通过点击扬声器图标更改音量。点击信封图标将显示所有消息应用程序的菜单，包括\
    \ Empathy，它是 Ubuntu 的默认消息程序。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_1.png)\n\
    \n点击你的用户名会弹出一个类似于 Windows 关机菜单的。这允许你重启电脑、进入睡眠模式、切换到不同的用户账户或关闭电脑。用户名左侧的图标显示你当前的即时通讯状态。\n\
    \n与 OS X 一样，应用程序共享一个标题栏，其中包含菜单（文件、帮助等）。将鼠标悬停在此区域即可查看菜单。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_2.png)\n\
    \n在 Ubuntu 中，在文件和文件夹之间导航非常简单。如果你在 Windows 中这样做，你会感到如归在家。从菜单到导航图标和文件夹列表，几乎所有内容看起来都像\
    \ Windows。它预创建了文档、音乐、图片和视频文件夹。\n\n完整的 LINUX 手册\n21\n\n# 第 2 章\n\n## 添加外设\n\n如果安装硬件的想法让你对\
    \ Linux 望而却步，请重新考虑：现在在 Ubuntu 中添加外设变得非常容易。\n\n曾几何段时间，在同一个句子中出现“Linux”和“硬件”就足以让\
    \ IT 专家流泪，但现在不再了。Linux 已经成长了，处理外设时就像 Windows 一样简单。在过去的几年里，开源开发者忙于为 USB 和蓝牙编写驱动程序和应用程序，这使得他们的工作变得更加轻松，但与任何操作系统一样，仍有一些问题需要注意。Windows\
    \ 经常会有当前硬件出现问题，而 Linux 则倾向于让过时的硬件引起问题。在 Ubuntu 中，支持得非常好，以至于你可能遇到的唯一问题就是决定你想在设备上使用哪些应用程序。在接下来的页面中，我们将展示如何使用\
    \ Ubuntu 安装一系列常见外设。\n\n### 音频建议\n\n在 Linux 中，让硬件运行起来不应该存在任何问题，任何现代声卡都可以直接工作。Linux\
    \ 硬件的工作方式与 Windows 不同，因此值得查看一下情况。\n\n点击 Ubuntu 图标并输入“设置”（Settings）然后按回车加载控制中心。选择“声音”（Sound）选项：如果你在播放\
    \ CD 时找不到任何东西，这应该是你首先查看的地方。“声音偏好”（Sound Preferences）对话框列表在“硬件”（Hardware）选项卡的下拉菜单中列出了可用设备。在大多数情况下，这将同一个声卡。\n\
    \n一个常见的音频问题是由扬声器插入 PC 的音频接口并让 Linux 使用数字输出引起的。如果观察到错误或者在“声音偏好”对话框选择的音频设备名称中看到“数字”（Digital）。要纠正这一点，请使用下拉菜单将其更改为“模拟立体声”（Analog\
    \ Stereo）并点击“测试”按钮。这应该产生一个稳定的音调。如果没有，尝试“音频输出系统”（OSS）下拉选项。如果你听到任何噪音，请尝试“自动检测”（Autodetect）。\n\
    \n你还可以使用此对话框更改为系统事件播放的声音。在“声音”（Sounds）选项卡上，你会看到一个事件列表，每个事件的状态为“默认”（Default）或“禁用”（Disabled）。如果你点击状态并选择“自定义”（Custom），就可以导航到你选择的声音文件。\n\
    \n一旦板载声音正常，你就可以从任何 USB MP3 播放音乐了。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_23_0.png)\n\
