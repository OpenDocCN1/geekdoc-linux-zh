    ## 第 7 章

    ## 配置 FreeNAS


    FreeNAS 的高级功能允许您添加安全性、通过互联网共享文件以及与其他计算机共享媒体资源。


    在之前的四页中，我们讨论了如何安装 FreeNAS 并将旧计算机转换为网络附属存储设备。然而，我们只触及了 FreeNAS 功能的冰角。在这里，我们将引导您了解一些更高级的功能，以便您能够充分发挥该程序的潜力。我们将展示如何配置安全性，以及添加各种类型的文件共享，例如创建您自己的媒体服务器和
    FTP 服务器，您可以从互联网的任何地方访问它们。


    首要起点是安全性。您默认安装的 FreeNAS 没有用户名或密码，因此任何人都可以访问该计算机。虽然这在本地网络上没有问题，但如果您打算使用可以通过互联网访问的高级功能（如
    FTP 服务器），您将需要学习如何设置用户。


    在编写本文时，当前的 FreeNAS 版本尚未允许您选择哪些用户可以访问每个服务。这意味着任何知道我们 IP 的都可以访问并通过每个功能和共享。对于共享来说，这可能没有区别，除非您非常想限制家庭成员的访问。


    ## 备份您的配置


    如果您的系统出现问题且必须恢复 FreeNAS，您将需要快速恢复。如果不备份配置，您将面临丢失配置中每一个文件的风险。要执行此操作，登录 FreeNAS 的
    Web 界面，进入备份（Backup）菜单并点击备份。同时也值得检查配置是否为最新。系统已更新。


    ## 添加用户


    要添加新用户，您首先需要创建一个。在 FreeNAS 的 Web 界面中，转到用户（Users）选项卡。点击蓝色图标创建新用户。输入用户名和密码，然后点击添加（Add）。应用更改（Apply
    Changes），您的用户即可供以下使用：


    ## 开启安全性


    要使用您的新文件夹进行共享，从 Web 界面面的服务（Services）菜单点击 CIFS/SMB，并点击共享（Shares）选项卡。点击蓝色图标创建一个名称


    # 服务 | CIFS/SMB | 共享 | 添加


    | 名称 | 注释 |

    | --- | --- |

    | 共享(s) | 共享路径。如果选中此项，用户无法在共享中创建或删除文件。 |

    | 只读 | 勾选此项决定共享是只读的，还是网络浏览列表中的可用共享。 |

    | 权限 | 这决定了用户在共享上拥有的权限。您可以为用户或组设置权限以访问单个共享，并用于限制访问。 |

    | 隐藏文件夹 | 这将在共享上创建一个文件夹。 |

    | 从列表中隐藏 | 如果选中此项，在浏览网络时将不会显示该共享。 |


    ## 更智能的共享


    在之前的页面中，我们展示了如何共享挂载点（硬盘或 RAID 阵列）。然而，您也可以共享特定的文件夹。要执行此操作，点击共享（Shares）选项卡并点击蓝色图标创建一个新共享。输入共享名称和注释，然后点击路径（Path）旁边的按钮并选择您想要共享的文件夹。点击确定（OK）并应用更改（Apply
    Changes）。

