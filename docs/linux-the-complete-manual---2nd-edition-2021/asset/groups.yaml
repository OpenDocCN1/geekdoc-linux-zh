    that it''s backed up is essential. One of the best reliable approaches is to use
    an online backup service, where data is stored securely. The good news for Linux
    users is that Ubuntu has such a built-in Ubuntu One.


    Online backup is a great way of making sure important files are protected. By
    storing data on a remote server, your files will be safe even if your house burns
    down or your computer is stolen. The latest version of Ubuntu One does this job
    for you; it''s still worth making locals the built-in Linux backup tools like
    these are quicker to restore, but online backup will give you that extra peace
    of mind.


    We''ll show you how to get started with a free account, which gives you 2GB of
    storage space. Higher-capacity accounts are also available if you need more space,
    and it is easy to upgrade your existing account.


    ## GETTING STARTED


    You''ll need to create an Ubuntu account. Login to Ubuntu One from the Launcher.
    The first time you run the application, you''ll be taken to a screen asking you
    to sign in to an Ubuntu Single-On (SSO) account. If you''ve already got one of
    Ubuntu Single-On, you''ll have an account link; click Join, fill out the form
    and click For. An email will be sent to you with a verification code which you
    will need to activate your Ubuntu account.


    Copy this code from the email and paste it into the box on you, then click OK.
    You''ll be prompted to enter your key password, which should have already been
    set. A message telling you that your account will be displayed.


