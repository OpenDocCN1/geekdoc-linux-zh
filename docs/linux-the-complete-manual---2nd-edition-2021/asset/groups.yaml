    ## Connecting a digital camera


    Before you can edit your photos, you need to transfer them from your digital camera.
    This is as easy in Linux as it is in Windows.


    Linux has come a long way since it was first created. It''s now just as friendly
    towards multimedia devices such as digital cameras as Windows. In this guide we''ll
    show you how to connect your digital camera to your computer and download your
    photographs.


    ## USING A CARD READER


    One of the easiest ways to download pictures to your PC is to use a USB card reader,
    just as would in Windows. These simple devices cost around £10 for a reader that
    will work with pretty every camera format in the world. Make sure your format
    is supported before you buy, remembering that you need a device that will support
    SDHC if you use SD cards larger than 2GB in size.


    Other than that, it couldn''t be easier. You simply plug the card reader into
    your computer and Ubuntu will recognise it immediately. When you plug it in, it
    will be recognised in a card, in a similar way to a USB disk, allowing you to
    copy files from it using the File Browser; the memory card will be listed on the
    left where all your other drives are listed.


    > You may need to change your camera''s mode for your computer to recognise it


    > A USB card reader is an easy and convenient way to transfer pictures from your
    digital camera


    ## IMPORTING FROM YOUR CAMERA


    The alternative method is to download pictures directly from your digital camera.
    This, too, is very easy to do, but there are some things you need to look out
    for. To start with you should check the modes that your camera supports. Many
    modern digital cameras can be recognised as either a mass storage or a Picture
    Transfer Protocol (PTP) device.


    When set to mass storage, the camera is recognised by your computer as a standard
    USB storage device. PTP mode lets the computer know that it''s a camera connected.
    We tested both modes and found that Ubuntu supports them, so you probably won''t
    need to change anything; however, if you''re having problems, recommend changing
    your camera''s mode. We typically set our cameras to PTP, as this is slightly
    easier to use with a computer.


    ## BASIC DESKTOP TASKS


    You have just inserted a medium with digital photos. Choose what application to
    launch.


    You can choose how you deal with image files when you connect a digital camera
    to your PC.


    Select how to open ''NIKON DSC D40'' and whether to perform this action in the
    future for other media of digital photos:


    - OpenSoft Photo Manager


    The thumbnails help you manage pictures you want to copy from your camera


    ## GETTING CONNECTED


    Plugging your camera in is as simple as connecting the USB cable to your computer
    and camera, and then turning your camera on. Depending on the model, you can select
    the make and model of your camera, so that the camera will be transferring images
    to your computer.


    RAW images from your Nikon D80 DSLR.


    All you have to do is select the images that you want to copy. Ctrl-click lets
    select individual images; Shift-click lets select a range of images.


    Once connected, a window will pop onscreen showing you''ve just inserted a medium
    with digital photos. You then need to choose what application to launch.


    When you''re ready with your selection, click Copy to import photos. Your pictures
    are copied and sorted into folders by date and time.


    Here you have two options: the Shotwell photo manager or Open Folder. The latter
    lets you access the camera directly and manually copy files from it. Select this
    and click OK.


    When you''re ready copy Copy from your camera to your hard disk. Depending on
    the size of your memory card, the size and the number of photos, this process
    can take anything from a few seconds to a few minutes. Once the process is complete
    you will be asked if you want to select the pictures from your camera.


    ## SHOTWELL


    ## IMPORTING PICTURES


    Shotwell will start and display a window with list of photos on your camera, with
    thumbnail.


    Once you''ve imported files from your camera, they will be on your computer. You
    can then edit them in Shotwell, or by clicking the Library to view all imported
    files.


    | File | Date | Time | Exposure | ISO |

    | :--- | :--- | :--- | :--- | :--- |

    | DSC_0001.JPG | 2011-05-12 | 12:34:56 | 1/125 | f/5.6 | 200 |


    You''ll be able to see thumbnails. Double-click on an image to edit it. Here you
    can use the tools, or deject page for more.


    ## CHAPTER 4


    ## Getting started with Gimp


    Gimp is a powerful tool to edit photos, but it''s not installed by default. You
    will have to install it from the Ubuntu Software Centre.


    If you want to open a photo, you can either drag from File Browser or use the
    File, Open... menu. Be careful when dragging images into Gimp if another image
    is already present as, by default, Gimp will add a new layer to the top of the
    existing one.


    The quickest way to zoom and out of a photo is to hold Ctrl and roll your wheel
    up or down. You can also use the magnifying glass at the bottom, or click and
    drag on the area you want to see.


    ## ROLLING BACK THE YEARS


    If you''ve made a mistake and want to go back to a previous version of your photo,
    use the yellow arrow near the top of the Layers panel. This switches the view
    from Layers to Undo History; to switch back, click on the stack of frames, or
    Ctrl+.


    In Undo History, you will see all the changes you''ve made to the photo. Each
    time you make a change, the list is updated with a small icon showing the change
    and a description of the tool effect used. Just click on any entry in the list.


    ## LAYING IT THICK


    Layers are a powerful way to edit photos. You can load multiple photos as different
    layers of the same image, but you''re unlikely to do this. Only the photo in the
    top-most layer will be visible unless you make it more transparent. This will
    then let the layer behind show, creating an effect like looking glass.


    There are many uses for layers, one of which is to create high range photos. This
    is where you load the same photo at different exposures: one underexposed, one
    corrected and one overexposed. By blending the three and erasing each layer, you
    can create some striking strokes.


    Each new layer adds one to your PC''s memory, so if you find Gimp feels sluggish
    you have layers of images, you may need to upgrade your computer''s RAM.


    ## TOUCH-UP


    Layers may be interesting, but for the most, you probably want to improve photos
    in order to print them, send them to friends and family or post them on the internet
    after a party, for example. On the next pages, we''ll show you how to use Gimp''s
    tools to turn a rather flat-looking photo into something that looks as if you''ve
    got real photographic flair.

