    \n## 编辑视频\n\n想要剪掉素材中的部分吗？我们将向你展示如何使用 Kdenlive。由于 Ubuntu 未自带该软件，你需要安装它。当你准备好导出电影时，点击“渲染”按钮。你可以在“目标”下拉菜单中找到预设列表。要保存\
