    (Synaptic Package Manager)”。输入密码，管理器将打开包列表。在搜索框中输入 `gnome`，你应该看到包列表更新并在列表顶部显示
    `gnome-extras`。点击它左侧的灰色方块，并在出现的菜单中选择“标记为安装 (Mark for Installation)”。


    如果你想标记额外的更改，点击绿色的“应用 (Apply)”按钮。这只是显示需要安装额外的包或撤销其他包，因此点击它们，你现在应该看到一个显示文件正在下载的进度条。完成后，点击对话框上的“确定
    (OK)”完成。


    ![](img/55dc7df089fe0011a7e15a61689f37ea_47_1.png)


    你应该能在“外观”窗口中看到新主题，你可以找到一个你喜欢的。我们在这里选择了 Nuvela。当然，如果你不喜欢其中任何一个，可以安装更多。


