    # THE FIREWALL


    The purpose of a firewall is to inspect every data packet attempting to enter
    or leave the computer, and decide whether or not to allow it on its way or to
    block it. Firewalls are closely connected to the operating system itself and have
    to be capable of running at top speed.


    # INTERNET LINUX


    Linux traditionally comes with a firewall called iptables that requires system
    administrators to set it up using extensive configuration files. For the rest
    of us, there''s a friendlier firewall called Fireaster. Like most firewalls on
    Windows, this is an entirely graphical application that makes configuration very
    simple.


    # INSTALLING FIRESTER


    Fireaster is a free application. To install, it will start the Ubuntu Software
    Centre. Type ''fireaster'' in the search box and press Return. The Fireaster application
    should appear in the list below. Click the Install button to begin the installation.


    You may be asked for your password in a sub-second pop-up window. If it does,
    enter it, click OK and Ubuntu will download and install the latest version of
    Fireaster. Once this process is complete, click Close. Fireaster should now be
    ready to protect your computer.


    # CONFIGURING THE FIREWALL


    To open Fireaster''s user interface, first of all find it in the Ubuntu search
    menu. The first time you run it, enter your password to confirm you want to make
    changes to the system, you''ll see a configuration window. Click Continue.


    The next screen on the wizard allows you to assign the firewall to a network connection.
    This should be default to eth0 if you have a single wired connection, which most
    people do, so leave it as is unless you have multiple connections or are using
    a wireless network card, either it will be set as the default option or be available
    from the pull-down list.


    Your gateway usually assigns all PCs on your network an IP address when they boot
    up. Unless you''ve chosen to disable and assign IP addresses manually, tick the
    box ''IP address is assigned via DHCP'' before clicking the Forward button.


    There''s no need to enable connection sharing on your Ubuntu machine, so you can
    safely press Forward and finally click Save. The main Fireaster control panel
    will now pop up. The firewall status panel should show it being active.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_108_0.png)


    # ACTIVE CONNECTIONS


    There are two buttons on the Fireaster control panel. The first is Lock. When
    you hit it, Ubuntu''s firewall will immediately block all incoming and outgoing
    traffic and the status icon changes to a padlock. If you suspect something is
    happening, clicking this button for a second time unlocks the firewall and it
    allows traffic to pass through it as usual - subject to its security rules, of
    course.


