- md: "\n# Welcome to the Ubuntu desktop\n\nOnce you have Ubuntu up and running, it's\
    \ easy to find your way around. Here we take you on a whistle-stop tour of the\
    \ desktop.\n\nUbuntu 11.04 has the brand new Unity interface, which does away\
    \ with lots of the old menus. Click the Ubuntu button to open the search bar.\
    \ Typing and matching applications and documents will be shown, in a similar way\
    \ to how the Windows 7 Start menu operates.\n\nClick this to launch the Ubuntu\
    \ Software Centre, which lets you install and remove applications. There are thousands\
    \ of applications to choose from, and they'll be automatically downloaded from\
    \ the internet.\n\nClick this to zoom out and view all four workspaces, which\
    \ are virtual desktops. You can drag and drop applications between workspaces,\
    \ keeping your desktop neat and uncluttered.\n\nThis is Ubuntu's Wastebasket.\
    \ It works in exactly the same way as Windows' Recycle Bin, and allows you to\
    \ recover deleted files.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_21_0.png)\n\
    \n# INSTALLING UBUNTU\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_0.png)\n\n\
    The Launcher is a dedicated dock for application shortcuts. Applications that\
    \ are currently running have white arrows next to them. To keep an application\
    \ in the Launcher, right-click and select Keep in Launcher. To remove an application\
    \ from the Launcher, simply remove the tick. If the Launcher disappears, move\
    \ the mouse to the left of the screen.\n\nThis is the notification area, and looks\
    \ just like Windows. Icons appear here to inform you of the status of various\
    \ functions. Here you can see the strength of your Wi-Fi signal, indicated by\
    \ the blue bar, and change the volume by clicking on the speaker icon. Clicking\
    \ on the envelope shows a menu listing all the messaging applications, including\
    \ Empathy, which is Ubuntu’s default messaging program.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_1.png)\n\
    \nClicking on your username brings up a menu similar to Windows’ shut-down menu.\
    \ This allows you to reboot the computer, put it into sleep mode, switch to a\
    \ different user account or shut down the computer. The icon to the left of your\
    \ username shows your current status for instant messaging.\n\nAs with OS X, applications\
    \ share a common title bar, which houses the menus (File, Help and so on). Roll\
    \ the mouse over this area to view the menus.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_2.png)\n\
    \nNavigating around your files and folders is simple with Ubuntu. If you do it\
    \ in Windows, you'll feel right at home. Almost everything looks like Windows,\
    \ from the menus to the navigation icons and folder lists. There are pre-created\
    \ folders for Documents, Music, Pictures and Videos.\n\nTHE COMPLETE LINUX MANUAL\n\
    21\n\n# CHAPTER 2\n\n## Adding peripherals\n\nIf the thought of installing hardware\
    \ has been putting you off Linux, think again: it's now easy to add peripherals\
    \ in Ubuntu.\n\nThere was a time when the words 'Linux' and 'hardware' in the\
    \ same sentence were enough to make IT grys cry, but not anymore. Linux has grown\
    \ up and works just as easily as Windows with peripherals. Over the past few years,\
    \ open-source developers have been busily writing drivers and applications for\
    \ USB and Bluetooth have made their job easier, but there are still a few issues\
    \ to look out for, just as with any operating system. Windows often has problems\
    \ with current hardware, whereas Linux tends to be obsolete hardware that causes\
    \ problems. In Ubuntu, support is so good that the only problem you're likely\
    \ to have is deciding which applications you want to use with your devices. Over\
    \ the next pages we will show how to install a range of common peripherals using\
    \ Ubuntu.\n\n### SOUND ADVICE\n\nGetting hardware up and running should pose no\
    \ problems in Linux, and any modern sound card would work straight away. Linux\
    \ hardware works in a different way to Windows, so it's worth taking a look at\
    \ what's going on.\n\nClick on the Ubuntu logo and type Settings and Enter to\
    \ load the Control Centre. Select Sound option: if you can't find anything when\
    \ playing CDs, for this should be the first place you look. The result Sound Preferences\
    \ dialog list the available devices on a pull-down menu Hardware tab. In most\
    \ circumstances, this will be for the same sound card.\n\nOne common sound problem\
    \ is caused by plugging speakers into a PC's audio socket and letting Linux to\
    \ use a digital output. If an error should be observed or if you see 'Digital'\
    \ in the name of the selected audio devices in the Sound Preferences dialog. To\
    \ correct this, use the pull-down menu to change it to 'Analog Stereo' and click\
    \ the Test button. This should generate a steady tone. If not, try the Sound Output\
    \ System (OSS) drop-down option. If you hear any noise, try the Autodetect.\n\n\
    You can also use this dialog to change the sounds played for system events. On\
    \ the Sounds tab you will see a list of events, each with a status of Default\
    \ or Disabled. If you click the status and select Custom, you'll be able to navigate\
    \ to the sound file of your choice.\n\nOnce onboard sound is working, you can\
    \ play your music from just any USB MP3\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_23_0.png)\n\
    \n- Checking the state of your sound output \n\nTHE COMPLETE LINUX MANUAL\n24\n\
    \n# INSTALLING UBUNTU\n\nIf you want to install a printer, plug your printer into\
    \ a USB port. Ubuntu will detect that the operating system has recognised the\
    \ connection. It will also ask if you'd like to add a printer. Click OK. After\
    \ a few moments, Ubuntu may display a choice of codecs: one for audio files and\
    \ one for video. You then tick the box for each code you'll want to install. Click\
    \ the Confirm button each time after which Ubuntu will download and install the\
    \ files.\n\nOnce installed, your printer's track list appearing in the main window.\
    \ Try playing a song by right-clicking on its icon and selecting Volume. If you\
    \ don't, you'll risk corrupting the contents. The same applies to any storage\
    \ device.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_24_0.png)\n![](img/55dc7df089fe0011a7e15a61689f37ea_24_1.png)\n\
    ![](img/55dc7df089fe0011a7e15a61689f37ea_24_2.png)\n\n## PRINTER\n\nUnfortunately,\
    \ some printers - especially older models - are not supported by Linux. Printers\
    \ require proprietary drivers to access all its features, but fortunately, many\
    \ printer manufacturers have made efforts to provide Linux drivers for current\
    \ and some of the more popular models. It's wise to find out your printer is supported\
    \ before you plug it into Linux. You can find an active database of printers at\
    \ www.linuxprinting.org. Click the Printer on the left of the page and enter the\
    \ make and model. If your printer is not listed, or uses PostScript, you would\
    \ find a PostScript Printer Driver (.ppd) file on your printer's original CD,\
    \ which will tell Ubuntu all it needs. To load this file, plug in your printer,\
    \ click on the Ubuntu dialog, type printing and hit Enter. A dialog box should\
    \ appear showing your printer:\n\nTHE COMPLETE MANUAL\n23\n\n# CHAPTER 2\n\n##\
    \ SCAN\n\nDouble-click on the printer's name and another box will give you its\
    \ details. Next to Make and Model, it should say that it's a generic printer.\
    \ Click the Change button and another dialog box will open. Provide PPD file and\
    \ insert your printer's driver CD. If you press the marked, a browser will appear.\
    \ Browse to select the PPD file on your CD and click OK.\n\nIf you would prefer\
    \ to use a shared printer in a Windows PC, you can, provided that the Desktop's\
    \ system driver is available. Select Administration, Printers and click New in\
    \ the dialog box that appears. Select \"Windows printer\" and click Next. This\
    \ brings up a Windows browser. Browse to the PC with the shared printer and select\
    \ it. Click OK followed by Next, and you'll see the printer installation window.\
    \ Select the name and model of your printer. When you finish it, you should be\
    \ able to print to the shared printer.\n\nUsing a scanner in Linux has also become\
    \ much easier, with the Simple Scan application - which is installed in the Graphics\
    \ section of the Applications menu - should detect your scanner automatically.\n\
    \nPlug your scanner into your Ubuntu PC and run Simple Scan. The application will\
    \ provide the PC's USB ports for connected scanners. It may think there are two\
    \ instances of the scanner, but you should be able to select the default option\
    \ and use it.\n\nWhen the Simple Scan application opens, there are a few things\
    \ to note. It may be necessary to set up basic data for the scan, which includes\
    \ the image format and resolution. If you are using an old Logitech QuickCam,\
    \ select menu to scan in colour. This also adds the controls for manipulating\
    \ full-colour images to the interface. You may also find that the scanner appears\
    \ grainy. If so, increase the DPI to 300 in the Documents, Preferences menu.\n\
    \nIf your printer isn't a supported model, there isn't much else you can do except\
    \ write your own driver. However, remember you can always save your documents\
    \ to a Windows share and print them from a PC. It's a cop-out, but printing is\
    \ the last stumbling block in Linux and it's making everything easier all the\
    \ time.\n\n## CAMERA\n\nWebcams are used today, so Ubuntu has dedicated applications\
    \ for shooting, editing and applying special effects to your images and video\
    \ clips. If you're using an Logitech QuickCam Express, because it's a USB device,\
    \ using it should be as simple as plugging and installing suitable software.\n\
    \nFirst, select Ubuntu Software Center from the Launcher. Type \"webcam\" into\
    \ the search box. Press Enter and the program will bring up a list of webcams.\
    \ Click the Webcam Booth application to install it.\n\nAfter the program downloads\
    \ and installs, select Cheese from the Applications menu. When Cheese runs, it\
    \ will display you a live image. You can record a video or take a still from it.\
    \ You can also apply several tricky effects by toggling the little button. For\
    \ example, an effect that you would look out of place, like Top of the Pops 1973.\n\
    \nUbuntu also has access to plenty of video-editing applications. PiTiVi is a\
    \ good substitute for Windows Movie Maker and edit your videos. It also renders\
    \ the final cut ready to be burnt to DVD with a program such as DeVDe which is\n\
    \n![](img/55dc7df089fe0011a7e15a61689f37ea_25_0.png)\n\n> You can scan directly\
    \ to GIMP! The standard Linux image-management program\n\n24 THE COMPLETE LINUX\
    \ MANUAL\n"
  mdcn: "\n\n# 欢迎使用 Ubuntu 桌面\n\n一旦 Ubuntu 运行起来，你就能轻松熟悉它的操作。在这里，我们将带你对桌面进行一次快速的巡检。\n\
    \nUbuntu 11.04 拥有全新的 Unity 界面，它消除了许多旧版菜单。点击 Ubuntu 按钮打开搜索栏。输入内容将匹配应用程序和文档，其操作方式类似于\
    \ Windows 7 的开始菜单。\n\n点击此启动 Ubuntu 软件中心（Ubuntu Software Centre），你可以在那里安装和删除应用程序。有数千个应用程序供你选择，它们将从互联网自动下载。\n\
    \n点击此可以缩小并查看所有四个工作空间，这些是虚拟桌面。你可以在工作空间之间拖放应用程序，保持桌面的整洁、不杂乱。\n\n这是 Ubuntu 的垃圾桶（Wastebasket）。它的工作原理与\
    \ Windows 的回收站完全相同，允许你恢复被删除的文件。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_21_0.png)\n\
    \n# 安装 UBUNTU\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_0.png)\n\n启动器（Launcher）是一个用于应用程序快捷方式的专用栏。当前运行的应用程序旁边会有白色箭头。若要将应用程序保留在启动器中，右键点击并选择“保留在启动器中”。要从启动器中移除应用程序，只需取消勾选即可。如果启动器消失了，将鼠标移动到屏幕左侧。\n\
    \n这是通知区域，看起来和 Windows 一样。图标会出现在这里通知你各种功能的状态。在这里你可以看到 Wi-Fi 信号强度（由蓝色条指示），并通过点击扬声器图标更改音量。点击信封图标将显示所有消息应用程序的菜单，包括\
    \ Empathy，它是 Ubuntu 的默认消息程序。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_1.png)\n\
    \n点击你的用户名会弹出一个类似于 Windows 关机菜单的。。这允许重启重启、进入睡眠模式、切换到不同的用户账户或关闭电脑。用户名左侧的图标显示你当前的即时通讯状态。\n\
    \n与 OS X 一样，应用程序共享一个标题栏，其中包含菜单（文件、帮助等）。将鼠标悬停在此区域即可查看菜单。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_22_2.png)\n\
    \n在 Ubuntu 中，在文件和文件夹之间导航非常简单。如果你在 Windows 中这样做，你会感到如归在家。从菜单到导航图标和文件夹列表，几乎所有内容看起来都像\
    \ Windows。它预创建了文档、音乐、图片和视频文件夹。\n\n完整的 LINUX 手册\n21\n\n# 第 2 章\n\n## 添加外设\n\n如果安装硬件的想法让你对\
    \ Linux 望而却步，请重新考虑：现在在 Ubuntu 中添加外设变得非常容易。\n\n曾几何段时间，在同一个句子中出现“Linux”和“硬件”就足以让\
    \ IT 专家流泪，但现在不再了。Linux 已经成长了，处理外设时就像 Windows 一样简单。在过去的几年里，开源开发者忙于为 USB 和蓝牙编写驱动程序和应用程序，这使得他们的工作变得更加轻松，但与任何操作系统一样，仍有一些问题需要注意。Windows\
    \ 经常会有当前硬件出现问题，而 Linux 则倾向于让过时的硬件引起问题。在 Ubuntu 中，支持得非常好，以至于你可能遇到的唯一问题就是决定你想在设备上使用哪些应用程序。在接下来的页面中，我们将展示如何使用\
    \ Ubuntu 安装一系列常见外设。\n\n### 音频建议\n\n在 Linux 中，让硬件运行起来不应该存在任何问题，任何现代声卡都可以直接工作。Linux\
    \ 硬件的工作方式与 Windows 不同，因此值得查看一下情况。\n\n点击 Ubuntu 图标并输入“设置”（Settings）然后按回车加载控制中心（Control\
    \ Centre）。选择“声音”（Sound）选项：如果你在播放 CD 时找不到任何东西，这应该是你首先查看的地方。“声音偏好”（Sound Preferences）对话框列表在“硬件”（Hardware）选项卡的下拉菜单中列出了可用设备。在大多数情况下，这将是同一个声卡。\n\
    \n一个常见的音频问题是由扬声器插入 PC 的音频接口并让 Linux 使用数字输出引起的。如果观察到错误或者在“声音偏好”对话框选择的音频设备名称中看到“数字”（Digital）。要纠正这一点，请使用下拉菜单将其更改为“模拟立体声”（Analog\
    \ Stereo）并点击“测试”按钮。这应该产生一个稳定的音调。如果没有，尝试“音频输出系统”（OSS）下拉选项。如果你听到任何噪音，请尝试“自动检测”（Autodetect）。\n\
    \n你还可以使用此对话框更改为系统事件播放的声音。在“声音”（Sounds）选项卡上，你会看到一个事件列表，每个事件的状态为“默认”（Default）或“禁用”（Disabled）。如果你点击状态并选择“自定义”（Custom），就可以导航到你选择的声音文件。\n\
    \n一旦板载声音正常，你就可以从任何 USB MP3 播放音乐了。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_23_0.png)\n\
    \n- 检查你的音频输出状态 \n\n完整的 LINUX 手册\n24\n\n# 安装 UBUNTU\n\n一个常见的音频问题是由扬声器插入 PC 的音频接口并让\
