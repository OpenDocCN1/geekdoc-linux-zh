    The File Transfer Protocol (FTP) is

    used by the vast majority of

    hosting providers to let you upload files to your

    website. The graphical FileZilla client - the

    same software as Windows - is the

    best way to use FTP.


    # INSTALLING FILEZILLA


    FileZilla can be downloaded from, it''s actually easier to install it directly
    from

    the command line. Start a terminal window

