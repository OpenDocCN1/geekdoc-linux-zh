    # 第 4 章


    ## 使用 LibreOffice


    Ubuntu 自带了一套完整的办公套件，满足您的文字处理、电子表格、演示文和业务图形需求。


    如果你曾经用过如 Microsoft Office 或 Works 等办公套件，你将会发现 LibreOffice 非常熟悉。事实上，你甚至会被促去区分 Word、Excel
    或 PowerPoint 与它们的 LibreOffice 等效品之间的区别。如果不能以 Microsoft Office 用户可以打开的格式保存文档，那么
    LibreOffice 将大失用武。坦率地说，LibreOffice 可以以许多格式保存文档，因此你可以选择一个适合你分享对象的格式。通过进入“工具”->“选项...”，以及“自动更正”，可以轻松禁用它。


    你可能还想做的另一个选择是防止写入每个文件都使用 ODT 格式。此时，进入“工具”->“选项...”，然后点击左侧标签页中的“保存”。这将帮助你了解最佳保存格式。一个不错的选择是
    Word 97/2000/XP，但那里也有最新的 XML 格式。


    ## Writer（文字处理器）


    Writer 与 Microsoft Word 几乎没有区别，具有非常相似的功能集。甚至菜单的组织方式也是相同的，因此你应该能在几秒钟找到所有常用功能。由于
    Ubuntu 自带了最新版本的 LibreOffice，当更新发布时，你总是能获得。然而，很少有人能看到比 Writer 更多的功能。除了普通的文本格式控制外，你还可以插入图片、表格、页眉和页脚。


    正如你预期的，Writer 包含了拼写和语法检查，你可以向文档添加注释；这些注释将带有作者姓名和日期显示在边边。这里的格式工作与 Word 一一样：点击图标随后采用你最初选择的文本格式。默认情况下，Writer
    的单词完成已开启。它会预测你正在输入的单词并自动显示在屏幕上。如果你不喜欢


    ## Calc（电子表格）


    Calc 是用于电子表格的应用程序，并且它乐意打开 Excel 电子表格。无论你是想创建一个基础表格跟踪项目成本，还是需要更复杂的公式，Calc 都能处理你所有的电子表格，它最适合信息表。Calc
    将为你节省工作。一个函数向导可以帮助你构建用于图表的图表向导，一个导航器弹出窗口可以让你设置并返回工作表上的特定区域，保存为 .PPT 以获得最佳兼容性。你还可以将文件导出为
    PDF 文件。


    ## 完整的 LINUX 手册


    ## 基础桌面任务


    与 Writer 一样，它内置了拼写和语法检查，在打印之前可以轻松更改设置以适应单页 A4 纸，例如。在整个套件应用程序中，右下角有一个缩放控制。顶部工具栏中还有一个
    PDF 按钮，你可以直接将电子表格导出为 PDF 文件，每台电脑都可以读取。


    Draw 类似于微软的 Publisher 或 Illustrator 图形软件包。它对所有人都有用，但如果你需要创建任何其他基于矢量的图像，它可能会大派用场。Calc
    将以 ODS 格式保存，但请确保你保存一个与需要查看电子表格的人兼容的格式。支持 Microsoft .XML 格式。矢量图像可以在不丢失质量的情况下调整大小。例如，当你增强
    JPG 图像时，它可能会变得块状且缺乏细节。对于矢量图，无论你将其放大多大，质量都保持不变。Draw 有用于绘制形状、线条和开关的列表，并且它与 Writer、Calc
