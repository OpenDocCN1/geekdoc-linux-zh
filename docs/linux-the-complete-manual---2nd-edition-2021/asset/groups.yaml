    # EXPLORING THE NETWORK NEIGHBOURHOOD


    Ubuntu has excellent support for shared folders. Make sure you have at least one
    folder shared on a Windows PC on your network. Click Places and select Network.
    The window that appears will show an icon called Windows Network. Double-click
    to see the groups. Double-click to display a list of PCs with shared folders.
    To see the shared folders, double-click on one and you will see the shared files.


    # MAKING ADJUSTMENTS


    If you''re used to slow moves in Windows, the speed at which Ubuntu moves the
    pointer may be too fast. You can easily slow it down. Click on the System menu
    in the launch bar and select Preferences. Click on Mouse. In the Acceleration
    tab, pull the slider to the left and test the mouse until it moves the way you''d
    like. Finally, close the button.


    # CHANGING BETWEEN DESKTOPS


    Ubuntu supports multiple desktops workspaces. You can switch between virtual workspaces,
    which is an excellent way to jump between lots of programs. On the second launch
    bar at the bottom of the screen, you''ll see two squares brown and one grey. These
    represent the two workspaces.


    Right-click on them and select Preferences. You can rename them (double-clicking
    on a name) or stack them rather than displaying them in a line. If you select
    ''Show workspace names in switcher'', the names will appear on the toolbar; by
    default use Desk 2. If you click Desk 2, Gnome displays a view of your desktop.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_38_0.png)


    You can switch between workspaces by holding down Ctrl-Alt or right key. The icon
    at the top of all windows gives you the same options as in Windows (Restore, Minimize
    and so on), also allows you to move the window between workspaces, as well as
    you to display it in front of all other windows.


    +   - Gnome supports multiple desktops, which is very useful for organizing your
    work


    # WRITING TO DVD


    Trying to save to optical media in Windows can be a deeply frustrating experience.
    In Ubuntu, it is simply insert a blank DVD or CD and wait for the system to open
    a window asking which application you''d like to use. Use selection on OK/CD DVD
    Creator and drag the files you want to save into the shared file browser window.
    Enter a name for the disc and press Write. That''s all there is to do.


    # KEEPING UP TO DATE


    Each time you log in, the system contacts Ubuntu''s servers to update installed
    packages. If there are, it displays a small speech bubble on the launch bar that
    tells you to get the update. Press install on the pop-up window and enter your
    password. Ubuntu asks for your password whenever you may want to change the system.
    Enter it, and the system downloads and installs the packages. You may be asked
    to reboot.'
