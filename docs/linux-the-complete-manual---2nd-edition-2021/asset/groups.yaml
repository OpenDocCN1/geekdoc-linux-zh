- md: "\n# CHAPTER 7\n\n## Network storage\n\nLinux isn't just a desktop operating\
    \ system; it also comes in versions that do a specific job. FreeNAS is one excellent\
    \ example, as this operating system will turn your computer into a fully functional\
    \ network attached storage (NAS) device that will enable you to share your files\
    \ and documents all over your house. In this chapter, we'll show you how to install\
    \ and configure FreeNAS.\n\nMaking your own NAS\nConfiguring FreeNAS\n\n## Making\
    \ your own NAS\n\nIf you have an old PC sitting around doing nothing, you could\
    \ turn it into network storage using the powerful FreeNAS system.\n\nAn old PC\
    \ can easily go to waste, with FreeNAS you can make good use of it and turn it\
    \ into a powerful network-attached storage (NAS) device. Best thing of all is\
    \ that FreeNAS, as name suggests, is completely free.\n\nUnlike commercially available\
    \ NAS devices, FreeNAS has a wealth of features and as you're using a PC, the\
    \ ability to support a lot of hard disks. Here's how you would install and share\
    \ files (see pages 136 to 139 for better configuration options).\n\nTo install\
    \ FreeNAS on a PC you'll need a computer with at least one hard disk and an optical\
    \ drive. FreeNAS uses a USB flash drive. You'll need a drive with at least 64MB\
    \ of disk space; you can use USB models for older E3 if you don't have one.\n\n\
    To start, download the OS image of the system from www.freenas.org. You need the\
    \ LiveCD version. There are two versions for: Intel processors and for AMD 64-bit\
    \ processors.\n\n> You need to enter BIOS and set your computer to boot from USB\
    \ for the optimal FreeNAS installation\n\nMake sure you select the right version,\
    \ and download the ISO file to your PC. This file is an image of a CD that needs\
    \ to be written to a blank disk (see page 46 for details on burning a disc). For\
    \ Windows PCs, use the FreeDBurnXP (http://cdburnxp.se).\n\n## GIVEN THE BOOT\n\
    \nTo do this, on your FreeNAS PC, plug in your USB flash drive and enter the BIOS\
    \ (normally you have to press Del, F10 or F12, look for a message telling you\
    \ which key to press). Navigate until Advanced BIOS boot options. There may be\
    \ an option to boot from USB, which you need to select a USB flash drive from\
    \ the boot order devices. If the USB is detected as a hard disk then select it\
    \ as the first.\n\nIf you can't boot from USB drives, you can install FreeNAS\
    \ to one of your hard disks, which might make configuration harder later or prevent\
    \ you from using this disk in a RAID array.\n\nAlternatively, you can connect\
    \ the drive to a boot port and boot the PC from the FreeNAS Live CD. Your settings\
