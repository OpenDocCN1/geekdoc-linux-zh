    # Introduction to Linux


    The Linux operating system is a great alternative to Windows.

    As you''ll learn over the next few pages, there are plenty of reasons to use it
    other than the fact that it''s free.


    One important point to note about Linux is that there are many different versions,
    or distributions as they''re known. Each version is based around a kernel (the
    core part of the operating system), but they vary when it comes to the interface
    and software they include.


    Ubuntu is one of the most popular and easy-to-use distributions, and it''s the
    one we''ll use throughout this book. You''ll find a copy of the latest version
    of Ubuntu on the free disc on the back page. Of course, you can try any other
    distribution if you prefer; Linux Mint, Mandriva, Debian, Fedora and Qimo are
