    ## USING ETHERNET CONNECTION


    The typical way to connect a PC to a network is to use an Ethernet network card
    and cable, which plugs into a simple router or hub. This is arguably the most
    secure. There''s no likelihood of data leakage, as there is with Wi-Fi, and Ethernet
    has a considerably higher data throughput. Ubuntu should not have to recognize
    any network card built into Ubuntu itself automatically when you boot Ubuntu to
    get an IP address.


    As long as the rest of your network is connected to the internet, several things
    should happen automatically. Ubuntu will first try to obtain an IP address automatically
    using a service called DHCP.


    There''s only one DHCP server on the network, which is probably your broadband
    router. DHCP largely takes care of the networking, so you don''t need to manually
    configure anything.


    Ubuntu usually finds your Ethernet card as eth0. If you have two cards, the other
    will be known as eth1. You can add more cards and they will be labeled in a similar
    way.


    From the Ubuntu search, run Terminal. This brings up a window and some information
    will appear. Part of the information associated with eth0 contains ![](img/55dc7df089fe0011a7e15a61689f37ea_89_0.png)


    - Auto configuration

    - Full duplex

    - IPv4

    - IPv6 supported

    - Supports to 1000 Mbps

    - USB

    - Wireless

    - Windows


    ## ADDRESSING THE SITUATION


    First, before you close the terminal, enter the command ''route''. The last line
    of the output will contain 192.168.0.1, which is your default gateway. Next, enter
    the command ''cat /etc/resolv.conf''. The last line here contains the name of
    the DNS server that turns your names into IP addresses. Note down these pieces
    of information.


    Select Network Connections. This will cause a small box to appear. Next select
    your network adapter. A settings window will pop up.


    Click the IPv4 Settings. This will show that the method of assigning an IP address
    is set to Automatic (DHCP). Use the pull-down menu to Manual. When you do, you
    have options to choose which active. Click the Add button and enter the network
    address noted above, but append a number between two and 254 for the fourth number.
    For example, you could choose 192.168.0.25. Enter a Netmask of 255.255.255.0,
    and in the Gateway field, enter the IP address of the default gateway (for example,
