    # CHAPTER 4


    ## Using LibreOffice


    Ubuntu comes with a complete office suite that caters for your word processing,
    spreadsheet, presentation and business graphics needs.


    If you''ve ever used an office suite such as Microsoft Office or Works, you''ll
    be at home with LibreOffice. In fact, you''ll be pushed to tell the differences
    between Word, Excel or Powerpoint and their LibreOffice equivalents. LibreOffice
    would be much use if you couldn''t save documents in a format that Microsoft Office
    users could open. Frankly, LibreOffice can save documents in many formats, so
    you can pick one that fits the people you''ll be sharing it with. Easily disable
    it by going to Tools. Options..., and AutoCorrect.


    Another choice you will probably want to make is to prevent writing every file
    using the ODT format. Then go to Tools, Options..., then click Save in the left
    tab. This will help you know the format to save as best. A good choice is Word
    97/2000/XP, but the latest XML format is also there.


    ## WRITER


    Writer is almost indistinguishable from Microsoft Word and has a very similar
    set of features. Even the menus are organised in the same way, so you should be
    able to find all commonly used functions in seconds. Since Ubuntu comes with the
    latest version of LibreOffice, you''ll always get updates when they''re released.
    However few people will see more features than Writer provides. In addition to
    the usual text formatting controls, you can insert pictures, tables, headers and
    footers.


    As you''d expect, Writer includes spelling and grammar checks, and you can add
    notes to a document; these appear in the margin with the author''s name and a
    date. Format works just like Word''s here: click the icon and subsequently adopt
    the formatting of the text you originally selected. By default, Writer''s word
    completion is turned on. This predicts what word you''re typing and automatically
    displays it onscreen. If you don''t like it


    ## CALC


    Calc is the application to use for a spreadsheet, and is happy to open Excel spreadsheets.
    Whether you want to create a basic sheet to keep track of project''s costs or
    need more complex formulae, Calc deals with all your spreadsheets, which is best
    for table of information. Calc will save you the job. A Function Wizard that helps
    you to build a Chart Wizard for graphs and a Navigator pop-up window that lets
    you set and return to specific areas on sheets, saving in .PPT for the best compatibility.
    You can also export files as PDF files.


    ## THE COMPLETE LINUX MANUAL


    ## BASIC DESKTOP TASKS


    As with Writer, there''s spelling and grammar checking built in, and it''s easy
    to alter the settings before printing to fit a single sheet of A4, for instance.
    Across the suite of applications is a zoom control in the bottom right-hand corner.
    There''s also a PDF button in the toolbar at the top so you can export spreadsheets
    directly as PDF files, which every computer can read.


    Draw is similar to Microsoft''s Publisher or Illustrator graphics packages. It
    won''t be useful for everyone, but it could come in handy if you need to create
    a logo of any other vector-based image. Calc will save in ODS format, but make
    sure you save a format that''s compatible with anyone that needs to see the spreadsheet.
    Microsoft .XML formats are supported. Vector images can be resized without losing
    quality. When you enhance a JPG image, for example, it can become blocky and lack
    detail. With a vector drawing, the quality remains the same no matter what size
    you make it. Draw has lists for drawing shapes, lines and switches, and it shares
    the same design as Writer, Calc and Impress. It''s easy to find where things are.
    If you are not a user, you''re better off using Alt, but Draw can do it if you
    have patience. With the other applications, you can export files as PDFs before
    printing.


    ## IMPRESS


    If you need to create a presentation, Impress is as flexible as Microsoft PowerPoint.
    In templates you can follow the wizard to choose a background - there are also
    lists to choose from - when you want slides to advance automatically after a preset
    time.


    If you are familiar with PowerPoint, Impress will be easy to use. It won''t mirror
    every single feature of it, but you can easily create attractive slides.


    Once your presentation is created, there are lots of layouts from which to choose,
    and you can add text just as you would in Powerpoint, by typing directly on the
    slide. You can also insert charts, images, and audio clips into slides.


    Impress has several different views of each slide, one of which lets you add notes
    below a slide for printing it out on A4 paper. There''s also a Handout tab you
    can print nine slides per slide to guide your audience. Impress saves files in
    .ODP unless you change the default settings. We recommend


    ## THE COMPLETE LINUX MANUAL


    ## CHAPTER 4


    ## Burning CDs and DVDs


    Brasero is Ubuntu’s built-in disc-burning application and it offers a range of
    easy-to-use options. Here''s how to use repeating data discs and audio CDs is
    easy with Brasero. The friendly interface has a large section of buttons that
    allow you to burn audio CDs and data discs, make direct copies of CDs and DVDs
    and burn ISO images of a CD or DVD. It can also erase writable CDs and DVDs. Click
    Add and the files will be added to the project. You can edit a title for the CD
    in the box at the bottom, double-click each track to edit; if you have CD player
    set lower you can split tracks using the icon in the toolbar, while pause icon
    adds a two-second pause after a track.


    ## HOW TO... BURN AN AUDIO CD


    Insert a blank CD-R into your CD writer and launch Brasero, which you''ll find
    by searching in the Applications menu. Click the Audio project under the heading
    Create a new project: Add audio files by clicking the green button and browsing
    to your music. Brasero supports any format for which you have codecs installed.
    To install Ubuntu and won''t find it, simply search for the formats you need in
    Synaptic Package and manage them. When this is done, choose the files you want
    to burn. Ctrl-A selects all files in the folder, or click on the first one you
    want, hold Shift and click to select the last. Click the Burn button in the bottom
    corner. The only option you want to change if you have problems burning CDs is
    to reduce the burning speed to a lower default. Once you clicked Burn, make all
    tracks same volume (normal), write the CD information and then burn the tracks.
    When the process is complete, the disc should eject and be ready to play.


    LINUX GUIDE


    ## BASIC DESKTOP TASKS


    Create a new project:

    - Create a new project

    - Select a disc to write to

    - Select a disc to write to

    - Properties of CD/DVD Drive

    - Burning speed

    - Maximum speed

    - Burn image


    Select a disc to write to: Ubuntu-9.10-desktop-amd64.iso: 699.0 MB

    Select a disc to write to: Blank CD-R Disc 3.9 MB of free space

    Properties

    Cancel

    Burn

    Properties of CD/DVD Drive

    Burning speed

    Maximum speed

    24.0 x (CD)

    18.0 x (CD)

    16.0 x (CD)

    Use burnproof (the risk of failures)

    Simulate before burning

    Eject after burning

    Temporary files: 203.6 GB free

    Close


    ## HOW TO... BURN AN ISO IMAGE


    Are often times when you''ll want to burn a CD or DVD from an ISO image downloaded,
    when a newer version of Ubuntu allows you to install another Linux distribution.
    Brasero can handle this with the minimum of hassle.


    An ISO is a ZIP archive of all the files on CD or DVD. When you burn an ISO, the
    files within it are written in the correct format. Download the ISO that you to
    burn, launch Brasero and click the bottom-most button. Burn image.


    Insert a disc for the size of the image to be burned into your CD or DVD writer.
    Usually, the size of the file is the size you''ll need. If we''re burning a Ubuntu
    11.04 disc, we need a CD-R or CD-RW, as the ISO image is 4GB. You''ll need to
    select the ISO image, so browse to the folder or where it''s located.


    Now, click the Properties button. You can alter the burning speed, so it''s advisable
    to choose a speed less than the maximum rated of your disc if you find errors
    when you are burning disc. You can choose to leave the disc open, but more files
    can be added, as we''re leaving 3.9MB of free space, there''s no point in this
    example. If your CD or DVD writer supports a ''burnproof'' mode (which most do),
    ensure that that box is ticked. Finally, click the Close button.

