  mdcn: "\n\n## 将摄像机连接到你的 PC\n\nLinux 完全有能力编辑你的视频文件。在这里，我们将向你展示如何将文件从摄像机传输到 PC。\n\n\
    将数字相机连接到 Ubuntu 会非常简单；该操作系统内置了对摄像机的支持。然而，某些领域可能会让你遇到问题。在我们开始之前，我们将向你介绍你可能面临的困难。\n\
    \n你可能想要连接到电脑的摄像机有两种类型：MiniDV 和内存闪存存储型号。短型的 MiniDV 型号安装起来会非常棘手。许多型号需要火线（FireWire）端口进行连接，并安装特殊的驱动程序。这个问题是无法规避的，但在在此过程中你可能会遇到许多困难。我们的建议是准备一台运行\
    \ Windows 的 PC 以备连接此类摄像机机。\n\n如果你有一台基于闪存或硬盘的摄像机，情况就会简单得多。在这一节中，我们将向你展示如何连接此类相机并将文件复制到你的\
    \ Ubuntu 电脑。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_67_0.png)\n现代的闪存内存或硬盘类摄像机很容易连接到\
