    \ USB 连接你的摄像机。根据我们的经验，摄像机可以使用各种奇妙而复杂的 USB 线，所以请记住使用随相机盒附带的那根线。\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_67_2.png)\n\
    \n## 基础桌面任务\n\n数字相机可能提供多种连接模式，例如图像传输协议 (PTP)，但摄像机只有一种：大容量存储。你只需要通过 USB 连接相机，它就会被识别为闪存存储。如果你在相机上存储了照片（使用其静态模式）以及视频，你将看到一个对话框，提示你已插入了带有数字照片的介质。选择要启动的应用程序。\n\
