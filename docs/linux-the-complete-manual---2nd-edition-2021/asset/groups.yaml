    您可以添加搜索条件，例如修改后的天数或文件大小。您还可以搜索文件内容。使用“可用选项”列表选择一个标准并点击“添加”。列表会随着您添加和删除选项而构建。点击“刷新”，将应该出现一个符合您要求的文件列表。右键点击结果，可以打开它、查看其位置或删除它。


    ## 探索网络环境


    Ubuntu 对共享文件夹有极佳的支持。请确保您网络上的至少有一台 Windows 电脑共享了一个文件夹。点击“位置”并选择“网络”。出现的窗口将显示一个名为“Windows
    网络”的图标。双击查看组。双击显示带有共享文件夹的电脑 列表。要查看共享文件夹，双击其中一个，即可看到共享文件。


    ## 进行相应调整


    如果您习惯了 Windows 中较慢的移动，那么 Ubuntu 移动指针的速度可能太快了。您可以轻松地让它慢下来。点击启动栏上的“系统”菜单并选择“偏好”。点击“鼠标”。在“加速”选项卡中，将滑块向左移动并测试鼠标，直到它的移动方式符合您的要求。最后，关闭按钮。


    ## 在桌面之间切换


    Ubuntu 支持多个桌面工作区。您可以在虚拟工作区之间切换，这是在许多程序之间跳转的极佳方式。在屏幕底部第二个启动栏上，您会看到两个棕色正方形和一个灰色。它们代表了两个工作区。


    右键点击它们并选择“偏好”。您可以重命名它们（双击名称）或将它们堆叠而不是逐行显示。如果您选择了“在切换器中显示工作区名称”，名称将出现在工具栏上；默认使用“桌面
    2”。如果您点击“桌面 2”，Gnome 将显示您的桌面的视图。


    您可以通过按住 Ctrl-Alt 或右键在工作区之间进行切换。所有窗口顶部的图标为您提供与 Windows 相同的选项（恢复、最小化等），还允许您在工作区之间移动窗口，并允许您将其显示在所有其他窗口之前。


    - Gnome 支持多个桌面，这对于组织您的工作非常有用。


    ## 写入 DVD


    在 Windows 中尝试保存到光介质可能是一种非常沮丧的体验。在 Ubuntu 中，您只需插入空白 DVD 或 CD，等待系统打开一个窗口询问您想使用哪种应用程序。使用“OK/CD
    DVD 创建器”进行选择，并将您想要保存的文件拖入共享文件浏览器窗口中。为磁盘输入一个名称并按“写入”。这就是全部操作。


    ## 保持更新


    每次您登录时，系统都会联系 Ubuntu 服务器以更新已安装软件包。如果有更新，启动栏上会显示一个小气泡，提示您获取更新。在弹出窗口上点击“安装”并输入您的密码。每当您想要更改系统时，Ubuntu
    都会询问密码。输入密码后，系统将下载并安装软件包。可能会被要求重启。


    ## Linux 与 Windows 之间的文件共享


    您的家庭网络可能不仅包含您的 Linux 电脑。以下是在 Linux 和 Windows 系统之间共享文件的方法：优点是除了 Linux 系统外，您至少有一台
    Windows 电脑，共享文件和文件夹是有意义的。幸运的是，这在 Ubuntu 中很容易，因为 Linux 使用与 Windows 相同的共享协议。在接下来的几页中，我们将为您展示如何轻松共享文件和文件夹。


    Linux 可能使用与 Windows 不兼容的文件系统，但通过网络共享文件是：Linux 和 Windows 都使用 SMB 协议进行文件共享。这意味着文件从
    Windows 或 Linux 硬盘中读取，使用相互兼容的 SMB 协议发送，并以原生格式保存到接收计算机的硬盘中。因此，Linux 是一个集成到您网络中的简单操作系统。您需要的所有工具都是内置的，因此您可以轻松在
    Linux 电脑和 Windows 电脑之间共享文件和文件夹。


    ## 进入 Linux


    如果是，您可以重命名 Linux 文件夹使其少于 12 个字符，或者更改共享名称（基本上网络计算机查看文件夹的方式），而保持 Linux 文件夹完好。后者更简单。在我们的示例中，我们将共享名称缩短为“docs”。您可以在“注释”框中为共享文件夹添加说明，但这是可选的。


    还有两个选项可以选择：默认情况下，每个文件夹都是只读的，因此其他人将无法修改共享文件或写入新文件。点击“允许其他人在此文件夹中创建和删除文件”以允许读写访问。如果您不想让人们输入用户名，请选择“访客访问”。完成后，点击“共享”。如果您自动更改权限，您所做的可能会可能会对话框，告知您在那种情况下需要哪些权限。您的共享文件夹将有一个新的一行，上方有一个绿色箭头，表示它正在共享。


    ## 共享及类似


    原则上讲，在 Linux 中共享文件夹与在 Windows 中完全相同。您可以共享任何您喜欢的内容。要创建一个新文件夹，首先点击“位置”。点击“文档”查看您的文档，然后右键点击并选择“新建文件夹”。为文件夹命名（如“共享文件”）并按回车。


    要共享文件夹，右键点击它并选择“选项”。点击“共享文件夹”框，您将看到一个对话框，提示未安装共享服务。点击“安装服务”按钮，下一个对话框将显示服务将自动安装。在提示时，重启
    Linux 会话。


    一旦您重新登录计算机，回到文件夹，右键点击它并选择“选项”。现在其他选项将不再是灰色的。在对话框底部，您可能会看到消息，提示共享名称过长——这是因为共享文件夹最多允许
    12 个字符。


    > 在普通视图中创建一个包含共享文件的文件夹


    在从其他计算机共享文件夹之前，您需要了解有关 Linux 电脑的一些信息。首先，要找到主机（名称），打开“终端”，在搜索栏中输入“终端”或前往我的应用程序。应用程序、终端，输入“hostname”并获取计算机名称。接下来，您需要
    IP 地址。输入“ifconfig”（可能是 eth）是您的网卡。

    '
