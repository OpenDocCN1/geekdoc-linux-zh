    can choose from the drop-down list. You will find a choice of all the most popular
    distributions, and there is an option to download the release ISO file; however,
    Ubuntu 11.04 may not be in the list. If it''s not, select Some Other ISO from
    the first drop-down menu. Follow the Browse button and navigate to the Ubuntu
    ISO file you downloaded.


    First, insert your USB drive and follow the steps you noted earlier, click to
    format the drive and click Create. Your USB flash drive is automatically turned
    into a bootable disk.


