    Linux，最好是选择一个专门为新用户设计的版本。


    不过，还有另一个考虑因素：你想要运行它的电脑类型。这里有用于 PC 的台式机、笔记本电脑和上网电脑。大多数发行版都能在台式机或笔记本电脑上顺利运行，但对于上网电脑来说可能太重了。因此，由于
    RAM、屏幕分辨率或磁盘空间（无论原因如何），你可能需要一个精简版的 Linux 发行版。


    ##不同的发行版


    一个专门为上网电脑设计的 Ubuntu 版本将非常有用，但标准版现在已经更新为可以在所有电脑上运行。新设计充分利用了低分辨率屏幕的特性，非常适合上网电脑，你不再需要特殊版本的操作系统了。


    你可能会说，有一个适用于你特定上网电脑的 Linux 版本。例如，Easy 是为华硕 Eee 笔记本电脑设计的，但你现在可以下载全部内容：从 getubuntu.com
    下载。


    如果你想在 PC 或笔记本电脑上运行 Linux，有很多用户友好的发行版可选。它们之间最明显的区别是它们包含的程序数量和类型。例如，Linux Mint 基于
    Ubuntu，但它拥有一个和 Windows 一样的开始菜单。安装程序显示了以下应用程序的截图和评分：


    ![](img/55dc7df089fe0011a7e15a61689f37ea_9_0.png)


    > Linux Mint 是外观最好的发行版，它有一个 Windows 开始菜单，并带有搜索栏。


