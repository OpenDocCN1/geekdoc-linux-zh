    up so they are safe without damage. Files are typically the smallest in size,
    and are the quickest to upload. As online storage can be accessed from anywhere
    with an internet connection, it''s a good solution for laptops, as you can back
    up your data while combating laptop theft or malfunction. Finally, be aware of
    how much data you''ve backed up; if you have a problem and have to restore it,
    it could take a few days. You also download so much data that you break your ISP''s
    fair-usage policy and incur extra charges.


    - PRO Backups safe from local disasters

    - CON Slow; can breach

    - BEST FOR Important files or mobile backups


    ### CD AND DVD


    Almost every modern PC includes an optical drive that can write files to disk,
    and using it to make backups seem a good idea. Media is cheap (CDs cost less than
    $1 and 8GB dual-layer DVDs cost around $6). If you''re starting backups to CD
    or DVD, consider what kind of data you''ll backing up, how often you''ll do it
    and how frequently the files will change.


    You can only write to a CD or DVD once, unless you buy rewritable discs. This
    means that making a copy of your documents folder require a new disc each time.
    These discs can still be useful, though if you''ve edited your photos you go back
    and change them again. This is called archiving, and it''s different from backing
    up.


    If you''re serious about your digital photos, take two copies of each and keep
    one at home and with a friend who lives at a different address. This way, if the
    worst shouldn''t happen and your PC is stolen, you''ll still have copies of your
    pictures.


    - PRO Cheap and easy

    - CON Hard to update

    - BEST FOR Archiving


    ### NETWORK STORAGE


    If you have more than one computer, a network-attached storage (NAS) device can
    store backups. A combination of external disk and a network, a NAS device can
    be accessed from any network-connected PC in your home. Your family can share
    files and store centrally. You can even access some NAS over the internet.


    Prices are reasonable, with 1TB devices currently available for around $110. NAS
    devices can be placed out of the way, such as in a list. This makes it harder
    for criminals to steal.


    Look for a device that contains multiple disks and supports RAID 1 (mirroring)
    or RAID 5 (parity). With this you always have protection against a single disk
    failure in the NAS, so you always have some protection against mechanical failure.


