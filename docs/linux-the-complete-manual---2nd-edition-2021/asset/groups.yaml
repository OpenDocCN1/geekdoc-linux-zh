    ## CHAPTER 6


    ### System health


    Just as with a PC running Windows, it''s important to make backups on Linux so
    you don''t lose any important files. Here we''ll show you how to back up individual
    files regularly so you know your work is always safe, and make a complete image
    of your computer so that you can restore it in the event of a serious problem.


    - Choosing a backup destination 120

    - Making backups 122

    - Making an image of your system 126


    ## Choosing a backup destination


    There are lots of places you can store your important files and folders. Here
    we take a look at the most popular options.


    Making a backup of your data is the only way to make sure it''s safe. If you copy
    all the files on your PC to an external storage area, it doesn''t matter if your
    computer is stolen or breaks down, as your data can be restored to a new PC.


    There are lots of different ways to make backups and plenty of options when it
    comes to storing them. Here we''ll look at the most practical solutions for storing
    your precious files so you can be sure your data survives the worst.


    ### ONLINE


    Online storage is rapidly becoming popular as broadband increases. Systems such
    as Dropbox (see page 110 for how to use this service) work by providing you with
    space you can use over the internet for a monthly charge. The main benefit of
    a system such as this is that you don''t have to buy any physical storage device.


    The amount of internet traffic they create and the speed at which they work is
    the main downside. All broadband connections have slower upload speeds than download.
    In this context, if your documents, pictures and folders amount to 30GB of data,
    this would take you three days at maximum to save all your data. As upload speeds
