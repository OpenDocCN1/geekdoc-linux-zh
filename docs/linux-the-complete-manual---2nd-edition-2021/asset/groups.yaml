    THE COMPLETE LINUX MANUAL 125


    ## Making an image of your system


    A system image is the most complete backup you can perform, as it makes a copy
    of your operating system, applications and files.


    Now you''ve got Ubuntu the way you want, just flash the image disk and return
    to the days when you first installed it, complete with all your settings and applications.
    So, instead of hours of work, with a disk-imaging application it takes only a
    fraction of the time.


    This is where using a disk-imaging program can save you a world of trouble. These
    applications take a copy of your hard disk, including the operating system, your
    applications, and every file on hard disk.


    > If your PC completely fails, a system image can help you recover


    ## HARD DISK


    Ideally, you should store image on an external hard disk so that you don''t lose
    them. If your hard disk should fail (these images are too big to store on other
    media as DVDs) this also means you can restore your image to your hard disk (or
    new one in the case of a major problem), getting up and running in short period
    of time. You could also back up to a secondary partition on your hard disk.


    ## NO MORE REINSTALLING


    When restored, the image will take your computer back to the day that the image
    was. The advantages of this are obvious: instead of reinstalling Ubuntu when it
    is no longer working the way you want, just flash the image disk


    While users are spoiled for choice when it comes to disk-imaging what runs the
    OS, it''s not simple in Linux. With Ubuntu there are no applications from the
    desktop. Instead, you''ll need to download the Clonezilla utility and burn it
    a spare CD or USB disk. This can be used to back up and restore an image


    As you can''t clone from the operating system, you''ll need to run these kinds
    of backups less often. You should therefore run them before you make system changes
    or install new hardware, and combine image cloning with file backup for the best
    performance.


    The best thing is that you''re not limited to taking one image. With the right
    software, you can also schedule images to occur regularly,

