    # CHAPTER 3


    # Creating user accounts


    Creating separate user accounts for all the people who use your computer has many
    benefits. Here''s how to do it


    If you share your PC with several family members, it makes sense to create a user
    account for each person. Creating separate accounts allows folders to store documents
    and media.


    Separate accounts allow each person to customize the theme and background to their
    they like. They can also put shortcuts and files on the desktop, which could otherwise
    become cluttered with everyone''s.


    In Windows you can create multiple accounts when you first install it, but in
    Ubuntu you can do it by going to Administration.


    You can also set the type of account using the Profile menu. Ubuntu gives you
    three choices: Administrator, Unprivileged and Desktop user. You should only choose
    the latter two, as Administrator accounts give more access to the system than
    is necessary for a normal user, and can be a security risk, as they damage critical
    system files. Desktop user is best in most cases, as this allows users to access
    external storage devices, connect to internet, use CD or DVD drive and use the
    computer''s audio system. Unprivileged users can do none of these things.


    +   1 To the System menu, Users and Groups (the final entry in the list). Then
    you will see the Settings window, but the Add button is greyed out. You won''t
    be able to make any changes until you click on the key at the bottom of the window
    and enter your user password and Authenticate.


    +   2 The buttons for adding and deleting users are now active. Click the New
    account window will open. Here you can enter a username, real name and password.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_51_0.png)


    3 You can change privileges manually by clicking on the User tab. This lists the
    users that the user can or can''t change, but the items you might want to change
    from the default Desktop profile is also allow you to configure printers and share
    files with the local network.


    You can fill in the user''s address and phone number this will usually be necessary.
    Settings on the Advanced tab will be greyed out and should be ignored. Click OK
    to close the window and add the new account. You may have to enter your password
    and Authenticate to complete the process. The new user will appear in the list,
    and you can repeat the process for additional users.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_51_1.png)


