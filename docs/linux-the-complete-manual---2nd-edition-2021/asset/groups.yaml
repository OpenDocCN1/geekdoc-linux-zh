    ## 软件包处理


    对于某些人来说，应用程序列表可能非常详尽，并让另一些人感到受限。如果你属于后一组，不要绝望。使用 Synaptic 软件包管理器（Synaptic Package
    Manager）的软件库是经验用户的主要选择，因为它提供了访问所有软件包的。它为高级 Linux 用户提供了直接访问软件服务器的。软件包管理器在后台做了大量工作，以确保安装顺利进行。


    所有待安装软件包上的勾选标记将变为一个环绕着它们的箭头。要开始安装 Apache 2，点击“应用”（Apply）。对话框将要求你确认要执行的操作。再次点击“应用”，Synaptic
    软件包管理器将开始下载所有软件包的最新版本并安装它们。如果你在 http://localhost 看到一个浏览器，你应该看到一个由新安装的 Apache 2
    服务器提供的页面，上面写着“It Works（运行正常）”。


    你可以通过点击 Ubuntu 图标并搜索“Synaptic”来找到 Synaptic 软件包管理器。管理器显示搜索结果。运行并点击“相关”（Related）按钮以显示可用软件包列表。左侧面板中出现的类别多于“添加/移除应用程序”工具列出的类别。然而，使用
    Synaptic 软件包管理器非常简单。为了演示其操作过程，我们将向你展示如何安装 Apache 2 Web 服务器，之后我们将展示如何卸载。


    ## 升级


    一旦你安装了软件包，Synaptic 软件包管理器将在需要删除或升级它时为你提供帮助。已安装软件包旁的勾选标记将是绿色的，如果你点击一个，上下文菜单将向你显示重新安装它的选项（如果你在配置时弄乱了，这很有用）或完全卸载软件包。


    首先，在左侧类别面板中选择“全部”（All），在搜索框中输入“apache2”并


    # 第二章


    ![](img/55dc7df089fe0011a7e15a61689f37ea_31_0.png)


    有时，你在更新软件包后需要重启系统——特别是与 Linux 内核有关的。


