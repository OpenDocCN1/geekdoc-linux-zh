  mdcn: "\n\n# 第 7 章\n\n## 网络存储\n\nLinux 不仅仅是一个桌面操作系统；它还提供了用于特定任务的版本。FreeNAS 就是一个极佳的例子，此种操作系统可以将你的计算机变成一个功能完备的网络附属存储（NAS）设备，让你能够在整个房屋范围内共享文件和文档。在本章中，我们将向你展示如何安装和配置\
    \ FreeNAS。\n\n制作你自己的 NAS\n配置 FreeNAS\n\n## 制作你自己的 NAS\n\n如果你有一台正闲置且无用的旧 PC，你可以使用强大的\
    \ FreeNAS 系统将其转换为网络存储。\n\n一台旧 PC 很容易被浪费，但通过 FreeNAS，你可以充分利用它并将其变成强大的网络附属存储（NAS）设备。最棒的一点是，FreeNAS\
    \ 名顾其实名，是完全免费的。\n\n与市售的 NAS 设备不同，FreeNAS 拥有丰富的功能，而且由于你使用的是 PC，它具备支持大量硬盘的能力。以下是安装和共享文件的方法（有关更优配置选项，请参阅第\
    \ 136 至 139 页）。\n\n要在 PC 上安装 FreeNAS，你需要一台至少有一个硬盘和一个光驱驱动器的电脑。FreeNAS 使用 USB 闪存盘。你需要一个至少有\
    \ 64MB 磁盘空间的驱动器；如果你没有，可以使用旧版 E3 的 USB 型号。\n\n开始，从 www.freenas.org 下载系统的 OS 镜像。你需要\
    \ LiveCD 版本。这里有两个版本：适用于 Intel 处理器和适用于 AMD 64 位处理器的。\n\n> 你需要进入 BIOS 并将计算机设置为从\
    \ USB 启动，以获得最佳的 FreeNAS 安装效果\n\n确保你选择了正确的版本，并将 ISO 文件下载到你的 PC。此文件是 CD 镜像，需要刻录到空白光盘上（有关刻刻的详情请参阅第\
    \ 46 页）。对于 Windows PC，请使用 FreeDBurnXP (http://cdburnxp.se)。\n\n## 准备启动\n\n要执行此操作，在你的\
    \ FreeNAS PC 上插入 USB 闪存盘并进入 BIOS（通常需要按 Del、F10 或 F12，寻找提示要按哪个键的消息）。导航到高级 BIOS\
    \ 启动选项（Advanced BIOS boot options）。可能有一个从 USB 启动的选项，你需要在启动设备列表中选择 USB 闪存盘。如果 USB\
    \ 被识别为硬盘，则将其选为第一。\n\n如果你无法从 USB 驱动器启动，可以将 FreeNAS 安装到你的硬盘之一，这可能会使稍后的配置变得困难，或阻止你在\
    \ RAID 阵列中使用此磁盘。\n\n或者，你可以将驱动器连接到启动端口并从 FreeNAS Live CD 启动 PC。你的设置将自动保存到驱动器中，因此无需。\n\
    \n| CPU 特性 | (按 Enter) | 项目帮助 |\n| --- | --- | --- |\n| 硬盘启动优先级 | (Disabled) |\
    \ 菜单级 |\n| BIOS 设置 | (Enabled) | 选择启动顺序 |\n| 网络唤醒 | (Disabled) | 设备优先级 |\n| USB\
