    Nautilus Dropbox is an extension that integrates the Dropbox web service with
    your GNOME Desktop. Check us out at http://www.dropbox.com/


    This will launch the Package Installer. Click Install Package and it will be installed
    on your computer. Once it''s finished, click the Close button and shut down the
    Package Manager.

    Start from the Ubuntu search, and you''ll see a dialog box warning that you need
    to install a property daemon. Click OK and this will be downloaded automatically
    from the internet to your computer. It should take only a few minutes.


    # GET UP AND RUNNING


    Restart your computer when the installation has complete. Next time you will see
    a new icon in the top-right of the screen for Dropbox. If you click it, a window
    will appear asking if you don''t have a Dropbox account or click Next. Select
    ''I'' to fill out all the required details. You''ll select which type of Dropbox
    account you want (2GB,


