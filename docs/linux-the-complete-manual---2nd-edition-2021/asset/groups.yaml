    ## Improving your photos using Gimp


    For the first-time user, Gimp''s interface can be a little overwhelming. These
    brief tutorials will guide you through using the main tools.


    Gimp may not be the easiest editor to use, but it is one of the most powerful.
    It gives you much more control over your photos than Picsasa.


    The shade is darker than the outside of the eye. You can adjust the hue if necessary
    to match the actual colour of the subject''s eyes, once zoomed back out, it''s
    unlikely anyone will notice.


    ## DEALING WITH RED EYE


    There are bound to be photos in your collection in which the subjects are suffering
    from red eye. Otherwise great photos can be ruined by laser-red eyes staring at
    you. It''s caused by the light of the camera''s flash reflecting off the subject''s
    retina, and you''ll always see the effect in photos indoors at night. Frankly,
    red eye is easy to remove using Gimp, and should take only minutes.


    - Start Gimp and open the photo you want to edit. Our shot was taken in a compact
    camera with its flash turned at night. Both subjects'' eyes have devilish look,
    which we''ll need to address.


    - Zoom into 400 percent magnification. Use the lasso tool (third from the left
    on the top of tools) to draw a circle around the offending area. If necessary
    hit Enter to complete the selection. Then hold the Ctrl key and select the highlight
    in the middle of the eye, and we don''t want to adjust this portion.


    - In the Tools menu, click Colour Tools, then Hue-Saturation. Drag the Saturation
    slider to the left, and also the Lightness slider, until...


    - Now we need a little saturation, so open the Hue-Saturation tool from the Colours
    slider to the right – Depending on your camera''s processing you may need more
    or less than the +15 we applied here.


    If you want to increase the saturation of individual colours – say, for green
    or blue for skies – just click the white circle next to the colour you want to
    modify, and adjust the slider for it. If you make a mistake, just-hit the Reset
    button.


    - If the Levels adjustment hasn''t given you quite enough contrast, you can add
    it easily with the Brightness-Contrast tool, which you''ll find in the Colours
    menu. Adjust the slider until you see the desired result.


    ## ENHANCING YOUR SHOTS


    This shot, which we took in the Lake District, almost didn''t make it into our
    ''Best images'' folder after storing the good ones from not so good. Despite its
    flat appearance, we could see it had the potential to be great. Gimp came to rescue
    and enhance it. Here we''ll show you how to use Gimp''s main retouching tools.


    - Sharpening your photos is always a good idea, as digital cameras tend to err
    on the side and leave artifacts. Gimp''s Sharp tool is excellent for this. You''ll
    find it in the Enhance section of the menu. Move the preview window to an area
    of the image that shows fine detail and toggle the Preview off and on to see the
    difference. If you oversharpen an image, you''ll cause unwanted artifacts to appear.
    Now the image is looking good, and we''re finished with the retouching. It''s
    a good idea to copy rather than saving over original. This means you can start
    from scratch if you don''t like the changes.


    - Open the image in Gimp and straight for the Levels tool, which you''ll find
    in a window that may look daunting, but it''s worth getting to know one of the
    most effective tools in Gimp''s arsenal, especially for injecting contrast like
    this. The Histogram shows a representation of intensity of pixels in the image.
    At the left are very dark pixels, which become lighter as you move to the right.
    Drag the left-hand arrow until it''s in line with the start of the rising curve.
    This deepens the shadows. On the right, grab the white arrow and drag it to the
    point the graph trails off. This brightens highlights.


    ## Organising your photos with Picasa


    Google''s photo-management software is hard to beat, and it works well in Linux.
    Here we''ll show you how to use it. Sometimes, there are better applications for
    the job than Ubuntu provides. Shotwell photo manager is not bad, but Google''s
    Picasa can do a whole lot more, and it has a slick interface. If you already know
    the Windows version of Picasa, you''ll be pleased to hear that it''s identical
    in Linux, since it uses Windows. To download Picasa, go to http://picasa.google.com/linux
    and click on the large download button. We''ve chosen the version 3, but you can
    install 2.7 if you prefer a more stable program. Make sure you download the .deb
    file for Debian/Ubuntu, and choose the appropriate version for your operating
    system: i386 for 32-bit or AMD64 for 64-bit. There are various ways of installing
    Picasa, but the easiest is to double-click on the file and install it. If it fails,
    copy it to the /tmp folder and hit Alt+F2 to open a command prompt. Type in picasa-:


    - Picasa has a friendly interface that''s easy to get along with.


    | Package | Install |

    |---|---|

    | picasa | Install |


    ```bash

    sudo dpkg -i /tmp/picasa_2.7.3736-i386.deb

    ```


    - There are several ways to install Picasa. Downloading and running the file is
    the easiest method. Picasa is that amazing photo editor that will produce powerful
    effects at your fingertips. Picasa makes it easy to share your pictures, crop
    them and edit them. With many formats like JPEG and TIFF, you can easily create
    new pictures. Picasa makes your pictures are always organized.


    Picasa is now installed and you''ll find it by searching in the Applications menu.
    Load it, and it will automatically scan your disks for photos. You should then
    see something similar for photos. If you''ve found your photos, you can import
    them using the Add Folder to Picasa option in the menu.


    ## STARTING TO USE PICASA


    As you''ll see, a folder splits into two panes: a folder list and thumbnails of
    the images in each folder. In the bottom-right corner is a zoom slider that changes
    the size of the thumbnails. The shuttle control on the right doesn''t work like
    a normal bar; the Picasa makes it easy to organize, edit, and share photos. Folder
    along left and right arrows to move them between them. To return to the library
    view, you just click Back to Library on the left.


    ## SHARING PHOTOS


    You''ll probably want to show your photos at some point, and one way is to play
    a slideshow. If you''re in the library view, you''ll see a green arrow at the
    top-corner of each Album or Folder. Clicking it will play a full-screen slideshow.
    Move your mouse to the bottom of the screen to pause the slideshow. You can set
    the interval and transition between images. This lets you share photos with friends
    and family using Web Albums. Click the top-right of the view to upload the photos
    to Web. If you''re already signed in, you''ll be able to use Web Albums.

