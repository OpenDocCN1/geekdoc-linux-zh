- md: "\n# CHAPTER 4\n\n## Playing DVDs\n\nUsing your computer to watch movies and\
    \ videos is easy with Ubuntu. All you need to do is download and install VLC.\n\
    \nUbuntu comes with Totem Movie Player, but due to licensing laws in certain countries,\
    \ it can't play commercial, encrypted DVD movies. Don't worry, though, as it's\
    \ simple to install the excellent VLC media player.\n\nYou can install the MPEG2\
    \ codec required to play DVDs; installing VLC is an easier way to watch movies.\
    \ You may already be familiar with it—it's also available for Windows and Mac\
    \ OS, and it looks and works identically under Linux. \n\nIt supports more than\
    \ just HDVs, in fact it can play MPEG2, MPEG4, H.264, DivX and MPEG1 video formats,\
    \ as well as MP3, OGG, AAC and other audio files. You can use it as a media converter\
    \ or for streaming video across a network.\n\nMenus are de-explanatory, and many\
    \ functions can be accessed quickly by right-clicking on the video itself.\n\n\
    Double-click on the video to make it full screen. Another double-click will return\
    \ it to a window.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_71_0.png)\n\nDrag\
    \ the bar to jump to a point in the movie. Hover your mouse over the handle to\
    \ display the time.\n\nClick and drag on the volume control to increase or lower\
    \ the volume.\n\nControls let you play and pause the movie, jump to the menu or\
    \ go to the next previous chapter.\n\nThe extended settings button lets you tweak\
    \ audio and video effects.\n\nTHE COMPLETE LINUX MANUAL\n\n## BASIC DESKTOP TASKS\n\
    \n### Synaptic Package Manager\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_72_0.png)\n\
    \nMark added required changes?\n\nThe changes are required in order to continue\n\
    \n- To be installed\n- libgtk-3-dev\n- libnss3-dev\n- (libwebkit)\n- libnss3-1.0-dev\n\
    \nCancel Apply\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_72_1.png)\n\n### VLC\
    \ media player\n\nStatus\n\nEnter title\n\nVLC is the video media player. It plays\
    \ MP4, MKV, AVI, VLC video and audio streams from network sources.\n\nVLC can\
    \ also be used as a streaming server that delivers the stream\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_72_2.png)\n\
    \n### HOW TO INSTALL AND USE VLC MEDIA PLAYER\n\n- Open Synaptic Package Manager\
    \ by searching for vlc in the Applications menu.\n\nEnter your password and then\
    \ type vlc in the search box. The search result will simply say vlc. Right-click\
    \ on the grey square to the left of the installation and Mark for install. A window\
    \ will appear asking you to approve additional downloads; just click the Mark\
