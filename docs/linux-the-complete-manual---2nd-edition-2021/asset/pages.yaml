    all open windows or Windows-W to display all open windows on the current workspace.
    You can then use the mouse or cursor keys to select an application. This is considerably
    easier than using the standard task-switcher and means you will never lose another
    window.


    # EFFECTS


    You can use the Effects to control the fancy windows effects, such asobbly windows.
    The best way to see what each option is to enable it and start using your computer.
    You may find it little overbearing, but we find that they can add a bit of interest
    to the desktop.


