  md: '# # Making backups


    Keeping your files safe is incredibly important no matter what operating system
    you use. Fortunately, backing up in Linux is easy


    ![](img/55dc7df089fe0011a7e15a61689f37ea_123_0.png)


    File backups are an incredibly important way of protecting your data. You should
    regularly make sure you don''t lose any important files in the event of a disaster.
    Fortunately, setting up a file backup strategy in Ubuntu is incredibly easy.


    Before start, there are some things to consider. A backup is only as good as the
    information that you give; if you don''t tell your computer to back up a file,
    it won''t work. It''s worth making sure your computer is well organised and keeping
    your data in neatly folders and don''t spread out over the hard disk.


    Back up only the files that have been modified since the last time you made a
    backup, and require a lot less disk space. To perform a full restoration of your
    data from an incremental backup, however, you''ll need a copy of a full backup.
    Incremental backups should be made regularly; we suggest this at least once a
    day.


    # TREAT YOUR MEDIA WITH CARE


    From the previous pages, you''ve worked out which type of backup media you''re
    going to use. Regardless of the choice you must protect your backup media and
    treat it carefully; dropping your backup disk isn''t only expensive, but might
    cause you to lose all your data. For really important data you should even consider
    making two backups and one away from your house, like a friend.


    Ubuntu, Windows, and Mac have different folders for each user, including ones
    for documents, music, pictures, videos and downloads. We think it''s keeping your
    documents in these folders, so that you know exactly where they are located. This
    means setting up your backup engine ensures that you won''t accidentally overlook
    any documents and lose data in the event of your user''s catastrophic failure.


    Ubuntu has a backup utility called SimBackup, which is incredibly easy to use
    and configure. We''ll show you how to use it.


    > Ubuntu has default folders for all your data; you''ll need using them to make
    backup


    # BACKUP TYPES


    There are two types of file backup that you can make: full and incremental. A
    full backup, as its name implies, backs up all your files regardless of when they
    were modified. You should make at least one full backup a week, so you''ll get
    a copy of every file that you need.


    The downside with full backups is that they take up a lot of disk space. If you
    only run backups you could end backing up the same files time after time. For
    this reason, there are incremental backups.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_123_1.png)'
