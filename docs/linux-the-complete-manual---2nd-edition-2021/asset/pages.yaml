    # INTERNET ACCESS


    The next step is to access your computer over the internet. The first problem
    to overcome is that your home has an external IP address that is shared by all
    computers on your network. This IP address can change, making it impossible to
    access your home remotely. With Dynamic DNS you can create a simple URL, that''s
    updated regularly so that it always points to your home.


    The only point is to make sure your routers support DynDNS (the best free DNS
    service, FreeDNS), so you don''t need to download any other software. Just Select
    DynDNS Services, enter name and use your DynDNS account details.


    With Dynamic DNS running, you will need to configure your router so that it knows
    to send FTP requests to your FreeNAS server. This is fairly straightforward and
    involves port forwarding (called virtual servers on your routers). You need to


    gives users access to an entry drive, by clicking the red minus icon to next share''s
    name.


    > You can access your FreeNAS server over the internet using FTP


    # SETTING UP FTP


    The problem with network shares is that they''re not easy to share over the internet.
    FTP provides a way for all users to access their files from anywhere. We''ve warned,
    that, FreeNAS''s FTP services are quite basic and use the guest ''root'' folder
    and, thereafter, to access any hard disk and RAID array you have installed.


