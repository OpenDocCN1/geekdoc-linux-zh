  md: '# ADDING A USER


    To add a new user, go to FreeNAS''s web-based management page and log on. Click
    on the Access tab and select Users and Groups. Click the blue button and you''ll
    be prompted to add a user by typing in a username and password. It is best to
    use the same name and passwords that you used into your PC, as this will automatically
    be able to access network shares from Windows (Linux users will have to authenticate-


    You can also assign users to groups. At the moment, all users have access to every;
    however, when this is updated in a later version of FreeNAS, it will make security
    easier to deal with you''ll be able to allow or deny group access to a service.
    For now, though, we''ve put all our users in the ''admin'' group. When you created
    one user, click Add changes. Click the blue button to add another user.


    # TURNING ON SECURITY


    Now you have users, it''s time to use them. Select CIFS/SMB from the Services
    menu. To turn on security, select Local User from the Authentication menu and
    then click Save and Restart.


    "The changes have been applied successfully" all your network shares are secure
    and authorized users can access them.


    Now when you access the protected Linux, you''ll have to type in a username and
    password. If you created a username, you''ll be able to access your current user;
    if you don''t, you''ll be prompted to type in a valid username and password.


    # SMARTERgetHARES


    On the previous pages we showed you how to share a mount point (hard disk or RAID),
    but this isn''t always the best of disk space. It makes more sense to share only
    a particular folder. For example, you could give each user their own share. A
    simple argument would work for their services.


    To share a folder, you first need to create one. FreeNAS has a built-in file browser
    that lets you do this. Click on Advanced and select File Manager, then log on
    with the same username and password that you log on


    FreeNAS''s web-management page. You''ll see an Explorer-style file browser that
    you can use to view every file and folder. To share, you need to create a new
    folder where you know to put it.


    Unlike Windows, which has different letters to each disk, FreeNAS is based on
    Linux. On pages 132-135, we explained that each hard disk or RAID array you have
    created is a mount point, and it''s the point you need to access. To see the ''mt''
    folder, click on a list of folders with the names the mount points you created,
    each referring to a hard disk or RAID array. Select Directory from the drop-down
    menu, type in a name and click to Make a folder.


    The new folder will have permissions and options to allow other files. To share,
    click on this link on the Share''s column next to the folder you created (it will
