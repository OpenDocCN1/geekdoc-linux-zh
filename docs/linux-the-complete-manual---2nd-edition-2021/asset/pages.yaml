  md: '# BASIC DESKTOP TASKS


    Digital cameras may offer multiple connection modes, such as the Picture Transfer
    Protocol (PTP), but video cameras only have one: mass storage. All you need to
    do is plug your camera in USB and it will be recognized as a flash storage. If
    you have photos stored on your camera, using its still mode, as well as videos,
    you will see a dialog box telling you you have inserted a media with digital photos.
    Choose what application to launch.


    The default option will be the Shotbot photo player. Monitor this option and select
    Open Folder and click OK.


    Alternatively, you can view your camera''s files by clicking on Computer from
    the Places menu. You can then browse your camera as though it were any other folder
    or storage device. Any videos that you find can be copied from the device to your
    hard disk by dragging and dropping.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_68_0.png)


