    you want to use with your devices. Over the next pages we will


    show how to install a range of common peripherals using Ubuntu.


    # ### SOUND ADVICE


    Getting hardware up and running should pose no problems in Linux, and any modern
    sound card would work straight away. Linux hardware works in a different way to
    Windows, so it''s worth taking a look at what''s going on.


