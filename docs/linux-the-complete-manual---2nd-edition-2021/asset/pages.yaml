  md: '# Getting connected


    Here we will show you how to connect your Linux PC to a local network and take
    advantage of the mobile internet


    Why use a computer that isn''t on a network? A few years ago, that would have
    been an odd question to ask. Times have changed, however, and connectivity is
    now as much part of computing as USB flash drives and screens. Over the next few
    pages, we''ll explore the different options for connecting your Linux computer
    to your home network. We''ll also help you set up wireless networking and 3G so
    you can use your laptop on the move.


    The internet has revolutionized the way we use computers. Once, PCs were standalone
    devices that communicated with the outside world through the medium of floppy
    disks, but now almost every home PC in the UK is connected to a global network.
    Not only that the connection is probably provided by a high-speed broadband service,
    the advantage you forgo an Ethernet connection is almost inconceivable, so we''ve
    explored all the issues you''ll encounter when connecting your Linux PC, however
    you''re at home or on the move.


    The news is that if you have a home network with an internet connection, you can
    simply attach an Ethernet card to your Linux PC and connect it to your router.
    Turn on the internet and it will connect automatically. However if you want to
    customize your setup, or if you experience problems, read the Using Ethernet connection
    section below. Connect to the network, or skip to Going online.


    The typical way to connect a PC to a network is to use an Ethernet network card
    and cable, which plugs into a simple router or hub. This is arguably the most
    secure


    There''s no likelihood of data leakage, as there is with Wi-Fi, and Ethernet has
    a considerably higher data throughput. Ubuntu should not have to recognize any
    network card built into Ubuntu itself automatically when you boot Ubuntu to get
    an IP address


    As long as the rest of your network is connected to the internet, several things
    should happen automatically. Ubuntu will first try to obtain an IP address automatically
    using a service called DHCP.


    > Ubuntu now supports low-cost WiFi equipment with USB Wireless LAN dongles\Ubuntu
    now supports low-cost WiFi equipment with USB Wireless LAN dongles


    There''s only one DHCP server on the network, which is probably your broadband
    router. DHCP largely takes care of the networking, so you don''t need to manually
    configure anything.


    Ubuntu usually finds your Ethernet card as eth0. If you have two cards, the other
    will be known as eth1. You can add more cards and they will be labeled in a similar
    way.


    From the Ubuntu search, run Terminal. This brings up a window and some information
    will appear. Part of the information associated with eth0 contains


    ![](img/55dc7df089fe0011a7e15a61689f37ea_89_0.png)


    +   - Portable and sleek Design

    - USB 2.0 compatible

    - 10/100/1000 Mbps with Linux and Windows

    - Auto-configuration

    - Full duplex

    - IPv4 and IPv6 supported

    - Supports up to 8 devices at once

    - Support Mac and Windows


    # USING ETHERNET CONNECTION'
