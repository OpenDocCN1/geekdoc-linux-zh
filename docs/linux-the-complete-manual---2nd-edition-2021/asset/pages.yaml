  md: '# Firewalls and internet security


    Linux may be more secure than Windows, but it''s not completely immune to attack.
    Here we show you how to protect your system


    Linux is widely considered to be more secure than Microsoft Windows. This is partly
    because of its opensource nature, which allows anyone to spot and report programming
    errors and vulnerabilities in the operating system and its applications instantly.

    It''s not immune from attack, though. Over the next few pages we''ll show you
    how to boost your computer''s security by configuring Linux''s built-in firewall
    and installing anti-virus software.

    Hackerers are entirely motivated by money, and they''ll try anything to get information
    that they can either sell or use to make calls. While Windows has been relatively
    immune to attacks, its base was too small, increasing popularity means that hackers
    now have the OS in their sights.

    As such, you need to boost the security of your computer. For every computer on
    the internet needs a firewall to protect it from unwanted intrusions by hackers,
    for example. Likewise, Linux also needs protection. Companies are now waking up
    to the threat posed to Linux operating systems by malware, and have begun supplying
    basic Linux versions of most of their products.


    without introducing any significant drain on resources or network performance.


    A number of commercial firewalls include a vast range of features. However, at
    their most basic, firewalls simply decide whether to allow or ''drop'' packets
    based on a set of rules. Configuring a firewall is a matter of writing rules to
    tell it which types of network traffic to let through, and which to block.


