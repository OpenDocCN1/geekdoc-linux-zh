  md: '# ALL ABOUT UBUNTU


    Ubuntu has excellent compatibility, which means it will run on just about any
    hardware. It also optimises itself for your computer, including setting the correct
    screen resolution for your monitor, finding your wireless network. In fact, Ubuntu
    can sometimes be easier than Windows. Connect an external monitor to a laptop,
    press the function combination on the keyboard to enable it and Ubuntu set the
    right resolution and configure it to the side of your laptop''s screen.


    Ubuntu is updated every six months. Some versions have the ''LTS'' after the version
    number, which stands for ''long-term support''. For three years, standard releases
    have support for 18 months. In between releases the Update Manager contains more
    updates, so your PC always has the latest versions of Ubuntu applications.


    Boot times are fast, and you realise how slow Windows is when you see your desktop
    appear in 30 seconds. As well as LibreOffice, Firefox is preinstalled so you can
    get online straight away.


    # INSTALLATION OPTIONS


    For most people, installing Ubuntu will be a breeze. Simply pop the CD that comes
    with it into your book''s drive and press the power button. Then follow the onscreen
    instructions. You''ll find a complete guide to installation in Chapter 2.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_10_0.png)


    > If you''re looking for a version of Linux that be used by all the family, give
    Qimo for kids a try


    We realise, though, that not computer has a CD or DVD. In this case, you need
    a 2GB USB flash drive, plus a computer running Windows. This should work for all
    modern computers in the past or next two years. If you don''t have a drive, you
    can buy one for a couple of pounds high streets such as PC World or WH Smith.
    You''ll find a step-by-step guide to install a flash drive from Ubuntu at @ubuntu.com/getubuntu.
    The download options mean: if you want the latest version (if you want the 64-bit
    select from the menu below) and click the Start download.


    While the ISO file is downloading to your USB drive, go to http://ubuntu.source.net/
    and click Download for Windows. This will download Ubuntu in to your PC. As we''re
    downloading the latest version of Ubuntu, there''s no need to select from the
    distribution. Select Desktop, click the "..."


    Once Ubuntu is downloaded, click the button to the right of Disk image and navigate
    to the Ubuntu ISO file. Finally, choose the correct letter for your USB flash
    drive (check in Windows Explorer if you''re unsure) and click. This will copy
    Ubuntu to your flash drive and configure it so your computer can boot. Plug the
    drive into the computer you wish to install Ubuntu and turn it on. If it doesn''t
    boot the USB drive, you''ll need to change the boot options in your computer''s
    BIOS. Restart your computer and press Delete, F1 or F2 (or look for a message
    telling you which key to enter setup). Set up the boot options and change the
    settings so that the first boot device is an External drive or USB drive. Save
    your changes and reboot.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_10_1.png)


    > Ubuntu will smoothly run on low-power computers as notebooks


    # THE COMPLETE LINUX MANUAL'
