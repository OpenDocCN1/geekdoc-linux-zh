  md: '# CD AND DVD


    Almost every modern PC includes an optical drive that can write files to disk,
    and using it to make backups seem a good idea. Media is cheap (CDs cost less than
    $1 and 8GB dual-layer DVDs cost around $60) and prices are high. If you''re starting
    backups to CD or DVD, consider what kind of data you''ll be backing up, how often
    you''ll do it and how frequently the files will change.


    You can only write to a CD or DVD once, unless you buy rewritable discs. This
    means that making a copy of your documents folder require a new disc each time.


    These discs can still be useful, though if you''ve edited your photos, it''ll
    go


    back and change them again. Files can be copied to disk and stored. This is called
    archiving, and it''s different from backing up


    If you''re serious about your digital photos, take two copies of each set and
    keep one at home and with a friend who lives at a different address. This way,
    if the worst shouldn''t happen and your PC is stolen, you''ll still have copies
    of your pictures.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_122_0.png)


    +   PRO Cheap and easy

    CON Hard to update backups

    BEST FOR Archiving as photos


    # NETWORK STORAGE


    If you have more than one computer, a network-attached NAS (NAS) device can store
    backups. A combination of external disk and a network, a NAS device can be accessed
    from any network-connected PC in your home. Your family can share files and stores
    centrally. You can even access some NAS over the internet.


    Prices are reasonable, with 1TB devices currently available for around $110. NAS
    devices can be placed


    ![](img/55dc7df089fe0011a7e15a61689f37ea_122_1.png)


    out of the way, such as in the list. This makes harder for criminals to steal.


    Look for a device that contains multiple disks and supports RAID 1 (mirroring)
    or RAID 5 (parity). With this you always have protection against a single disk
    failure in the NAS, so you always have some protection against mechanical failure.


    +   PRO Lots of people can back up at once

    CON Can be hard to configure; relatively slow

    BEST FOR Homes with multiple computers


    # EXTERNAL HARD DISK


    An external hard disk is easy to connect to a PC and because it''s easy you can
    quickly plug it into another computer. As they live outside your PC''s case they
    are immune to problems with a power supply failure, which may damage your internal
    disks. External hard drives are also large with 1TB of storage currently available.


    External drives usually connect via USB or eSATA. You plug your disk into a USB
    port over your computer, and it will be automatically detected. USB is pretty
    quick, though both CD and DVD drives come to speed.


    For quicker transfers, an eSATA drive is your best bet. Provided that your computer
    has an eSATA port you can get the fastest transfer rates available. The eSATA
    system is essentially SATA with a slightly different connector, so an eSATA


    disk can be as fast as an internal hard disk. You can convert an internal SATA
    port to eSATA using a blanking plate around £3.


    The main benefit of using a hard disk for backup is that data can be rewritten
    so you can leave the drive plugged in and make regular backups to it. The danger
    is that they are attractive to offer and offer no protection if your house burns
    down.


