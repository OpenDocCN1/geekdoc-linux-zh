    The gstreamer0.10-ffmpeg H.264 code. Select the default option and click Install.
    Once the code has been installed, you will be able to view your video. The software
    squashed 16:9 from the aspect ratio. This should fix the video and make it look
    right. Once you preview your clips, you can simply delete the ones you want and
