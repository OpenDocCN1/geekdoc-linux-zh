  md: '# How to get Linux


    Now that you''re ready to give Linux a go, we''ll outline the different versions
    on offer


    Hopefully you''re now convinced Linux is worth trying. The trouble is how do you
    choose between the multitude of distributions? Each ''distro'', as they''ve called,
    has a particular kind of user in mind, and if you''re just starting with Linux
    it''s best to choose one that''s specifically aligned to new users.


    There''s another consideration, though: the type of computer you want to run it.
    There are desktops for PCs, laptops and netbooks. The most distros will happily
    work on a desktop laptop but might be too much for a netbook. As such RAM, screen
    resolution or disk space, whatever the reason, a cut-down Linux distro could be
    desired.


    # DIFFERENT DISTROS


    A version of Ubuntu specifically designed for netbooks would be useful, but the
    standard edition has now been updated to work on all computers. The new design
    makes the most of low resolution screens, making it perfect for netbooks, and
    you no longer need a special version of the operating system.


    You may say there''s a version of Linux for your specific netbook. Easy, for example,
    was designed for Asus Eee netbooks, but you can download it all now: download
    from getubuntu.com


    If you want to run Linux on a PC or laptop, there''s a wide selection of user-friendly
    distros. The most obvious difference between them is the number and type of programs
    they include. Linux Mint, for example, is based on Ubuntu but has a start menu
    just like the one on Windows. The installer shows screenshots and ratings of


    ![](img/55dc7df089fe0011a7e15a61689f37ea_9_0.png)


    > Linux Mint is the best-looking distro, it has a Windows start menu, complete
    with a search bar


    applications, user reviews, which makes it easy to decide what package you''re
    after. Adobe Flash and Java are installed by default, so most websites containing
    video, such as YouTube, work straight away. You can download it from ubuntu.com.


    If you''re after a distro for families, try Qorin (qorinubuntu.com). It''s based
    on Ubuntu and has a friendly interface with built-in parental controls for internet
    access. It comes with educational games.


    Fedora (fedora.org) and Debian (debian.org) are more mainstream but aren''t quite
    user-friendly. Debian prides itself on having the latest versions of applications,
    while Debian is exceptionally stable and has an enormous choice of software through
    its package managers.


    However, we think the best for most people is Ubuntu. Its look and feel very close
    to Windows, and unfamiliar aspects such as the Package Manager and virtual desktops
    are hidden away. It''s because of that Ubuntu will become the most popular Linux
    distribution.


    # THE COMPLETE LINUX MANUAL'
