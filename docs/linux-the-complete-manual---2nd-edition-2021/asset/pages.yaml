    \n![](img/55dc7df089fe0011a7e15a61689f37ea_143_2.png)\n\n# ## HAVE A BACKUP RECOVERY\n\
    \nIf your computer has completely broken or you can't start Linux, don't worry\
    \ about trying to fix it. Instead, restore from a backup (page 126). A complete\
    \ system image lets you restore your computer to a working point before the trouble\
    \ started. It is the easiest and best method of fixing a problem, and highlights\
    \ why you should make a backup before making any system changes.\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_143_3.png)\n\
    \nWhat appears to be a Linux problem actually be a hardware problem\n\n# ## FOLLOW\
    \ OSCREEN INSTRUCTIONS\n\nLinux can be frustrating as it often fails to provide\
    \ a graphical way of fixing a problem. However, you'll see an onscreen message\
    \ telling you what you need to type. Look out for any helpful messages and try\
    \ typing them into a window (or directly)\n\n![](img/55dc7df089fe0011a7e15a61689f37ea_143_4.png)\n\
    \nTHE COMPLETE LINUX MANUAL"
