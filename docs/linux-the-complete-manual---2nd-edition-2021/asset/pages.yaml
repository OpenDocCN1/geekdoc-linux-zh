    # ACTIVE CONNECTIONS


    There are two buttons on the Fireaster control panel. The first is Lock. When
    you hit it, Ubuntu''s firewall will immediately block all incoming and outgoing
    traffic and the status icon changes to a padlock. If you suspect something is
    happening, clicking this button for a second time unlocks the firewall and it
    allowing traffic to pass through it as usual - subject to its security rules,
    of course,


    The second button on the control panel is Stop Firewall. When you press this,
    the status changes to Disabled. This is not a recommended setting to use other
    than when you believe there''s a problem with the firewall blocking legitimate
    traffic.


    Another part to the control panel is Active Connections. Click the arrow button
    next to this and it will show the connections you have to the world outside. Open
    tabs in Fireaster, run Skype or an instant messenger application, and all your
    connections will be listed here.


