    # # Configuring FreeNAS


    FreeNAS''s advanced features let you add security, share files

    over the internet and share media with other computers


    In the previous four pages we discussed how to install FreeNAS and turn

    an old computer into a network-attached storage device. However we only scratched
    the surface of what FreeNAS

    an do. Here we will take you through some of

    more advanced features so that you can use

    t application to its full potential. We will

    how to configure security, as well as add

    types of file-sharing such as creating your own

    media and FTP server that you can access from

    anywhere on the internet.


    The first place to start is security. Yourndefault installation of FreeNAS doesn''t

    hany usernames or passwords, so anyone could

    access the computer. While this is fine on a

    local network, if you are going to use

    advanced features that are accessible over the

    internet, such as the FTP server, you will need

    how to set up your users.


    At the time of writing, the current version

    of FreeNAS doesn''t let you choose which

    users have access to each service.

    This means that anyone who knows our

    can access and pass every feature and

    share. For share this might not make any

    difference, unless you are really keen to keep

    access for members of your family.


    # BACK UP YOUR CONFIGURATION


    If your system depends on a problem and you

    have to restore FreeNAS, you will need

    to restore quickly. If you don''t back up your

    configuration, you risk losing every single file

    in your RAID array.


    To do this, log in to FreeNAS''s web-based

    management and click Backup/Restore from

    the System menu. Click Download configuration

    save the file to your PC. If you need to


    ![](img/55dc7df089fe0011a7e15a61689f37ea_137_0.png)


    > Adding to users for

    FreeNAS configuration can help increase security


    restore your configuration, use the

    menu, but click the Browse button, select

    the configuration you backed up and then

    click Register Configuration.


    It''s also worth checking that you have the

    most-up-date version of FreeNAS. Go to

    the list of users, click on the Download link.

    from www.freenas.org and download the latest (.iso

    for 32-bit and amd64-bit for systems),

    which''ll need to boot to CD. In FreeNAS''s

    web-management page, select it from

    the System menu. Select Enable firmware


    upload, click Browse, select the .img file you

    downloaded and click Upgrade firmware. This

    will upload the file automatically and upgrade

    your computer, restarting when completed.


