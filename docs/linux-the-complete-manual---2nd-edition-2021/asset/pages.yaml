  md: '# Internet on Linux


    Ubuntu has been designed from the ground up for the internet. In fact, it''s more
    tightly integrated into the online world than Windows, and most of the applications
    you install are automatically downloaded from the web.


    However, there are some tricky online jobs that you''ll want to do in Linux that
    are easy in Windows, such as viewing videos online, uploading files to your website
    and more. In this chapter we''ll take you through all these options and show you
    how to turn your Ubuntu computer into the ultimate internet PC.


    Getting connected 88 | Social networking 104

    Controlling the web 92 | Firewalls and internet security 106

    Configuring email 96 | Storing files online 110

    Using VoIP 100 | Uploading files with FTP 112

    Enhance your web browsing 102 | Backing up with Ubuntu One 114'
