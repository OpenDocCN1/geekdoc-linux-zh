    # Configuring email


    The Evolution email client lets you stay in touch with your family and friends.
    Here we explain how to set it up


    After web surfing, the second most popular online activity is sending and receiving
    email. Ubuntu comes equipped with a range of email measures, as well as some impressive
    anti-spam measures. We will show you how easy it is to set up.


    If you use Windows, you''ll be familiar with the basic built-in client (Outlook
    or Windows Mail, depending on the version of Windows you have), but how do you
    go about getting email in Linux?


    The good news is that it''s simple to use, and you''ll get a better email client
    than Windows''-built program. One of the email applications in Ubuntu is Evolution.
    On the taskbar of the desktop, you''ll see an envelope icon. When you click on
    it the first time, Evolution will start running its Setup Assistant Wizard to
    guide you through the basic configuration process.


    To complete this, you''ll need a few items of information, so to make sure you
    have this before you begin. These can be


    provided by your internet service provider, but you''ll also be able to get them
    from your current email application'' settings. You''ll need to know the address
    of your ISP''s mail servers, such as a POP3 server, but some accounts, including
    Google Mail, use IMAP server (see the order for how you get the type of server
    you''re using).


    You''ll also need to find out if your email servers require any encryption (TLS
    or SSL are the common types).


    Outgoing mail always uses an SMTP server, such as smtp@yourisp.co.uk. Finally,
    you''ll need to know your username and password of your email account.


    # EVOLUTION NOT SETUP


    The first page of Setup Assistant is the welcome page. Click Forward to continue.
    The next screen can be used to restore Evolution''s settings and emails from a
    backup. For now, let''s assume you are creating an account from scratch, so click
    Forward.


    You''ll be asked for full name and address. You can also specify an alternate
    reply-to address, so when someone replies to one of your emails, it will be sent
    to instead of the Organisation blank. Click Forward and you''ll be prompted to
    configure how you receive email. Select POP or IMAP, depending on your ISP. Enter
    the name of your incoming mail server and your username and password to have Evolution
    store your password; if you don''t, you''ll have to enter your email password
    every time you download mail. The next screen asks how often you want to check
    for new emails. This is a matter of personal choice.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_97_0.png)


    +   - The first step when configuring Evolution involves entering your details


