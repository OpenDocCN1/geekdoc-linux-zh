  md: '# Playing music files with Banshee


    Ubuntu''s built-in music player lets you organise your music, create playlists
    and listen to podcasts and internet radio stations


    Banshee Music Player is the default application for importing music, replacing
    Rhythmbox. If you prefer Rhythmbox you can install it from the Ubuntu Software
    Centre. We''ll focus on Banshee in this guide, which is a powerful media manager
    that you can use to rip your CDs to MP3 format.


    Before you start, you need to install the necessary audio codcs. Click on Ubuntu
    Software Centre from the Launcher and type Restricted into the search. Double-click
    Ubuntu extras and Install. You can now start Banshee.


    On the left, you''ll find a pane with your library shortcuts, music stores and
    playlists. When right, you''ll see three panes for artist, album and a track listing.
    These will be blank, of course, until you import your music collection.


    To import tracks from a CD, you need to select your preferences. Click on Preferences
    from the Edit menu, then click on the Source


    tab. Select Audio CDs from the Source menu. Under Format select MP3 (Lame Encoder),
    then click Edit. Select the Bitrate that you want to use. We recommend a bitrate
    of 192Kb/s, but 300Kb/s will give you higher quality audio that rivals that of
    the original CD.


    To import an audio CD, insert it into your computer''s optical drive. The disc
    will appear in the left hand panel of Banshee. The name and track title will be
    automatically downloaded from the internet. Select "Audio CD" to convert the tracks
    to MP3. A status bar at the bottom shows you how far through the process it is.
    When it''s finished, you can remove your CD.


    # IMPORTING OLD MUSIC


    The place to tracks that you already have in MP3 format is the Music folder, which
    you can access in Ubuntu''s Places menu. To import your existing MP3 tracks, head
    to the Media menu in Banshee and choose Import Media. Select Files, then click
    Import.


    +   The first thing you need to do in Banshee is import your music collection


    +   Banshee supports album art and will show garish visualisations when playing
    tracks if you so desire


    ![](img/55dc7df089fe0011a7e15a61689f37ea_73_0.png)'
