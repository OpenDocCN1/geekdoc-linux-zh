    Linux isn''t just a desktop operating system; it also comes in versions that do
    a specific job. FreeNAS is one excellent example, as this operating system will
    turn your computer into a fully functional network attached storage (NAS) device
    that will enable you to share your files and documents all over your house. In
    this chapter, we''ll show you how to install and configure FreeNAS.


