    you''re using. When you send traffic to localhost, the network card detects that
    the address is local and responds itself, proving that it''s working properly.


    Now ping the local machine''s IP address. This traffic enters the network and
    comes straight back, proving that the local subnet or switch is working.


    If you have two subnets, ping a computer on the other subnet to make sure the
    router between them is working properly. ping a website that''s outside your local
    network, such as google.co.uk. If you can''t reach it, check that your broadband
