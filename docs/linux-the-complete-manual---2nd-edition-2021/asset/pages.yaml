    Select Sound option: if you can''t find anything when playing CDs, for this should
    be the first place you look. The result Sound Preferences dialog list the available
    devices on a pull-down menu Hardware tab. In most circumstances, this will be
    for the same sound card.


    One common sound problem is caused by plugging speakers into a PC''s audio socket
    and leaking Linux to use a digital output. If an error should be observed or if
    you see ''Digital'' in the name of the selected audio devices in the Sound Preferences
    dialog. To correct this, use the pull-down menu to change it to ''Analog Stereo''
    and click the Test button. This should generate a steady tone. If not, try the
    Sound Output System (OSS) drop-down option. If you hear any noise, try the Autodetect.


    You can also use this dialog to change the sounds played for system events. On
