  md: '# TROUBLESHOOTING


    onscreen if Ubuntu won''t load the graphical interface. If the command won''t
    run, try using ''sudo'' in front of it. This will run the command with higher-level
    privileges. You''ll be prompted to type in your password using sudo.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_144_0.png)


    # KNOW THE DETAILS


    Ubuntu has lots of different versions that aren''t compatible with each other.
    In fact, the differences between point releases, such as 9.04 and 9.10, can be
    so great that software and hardware that work on one work not on the other. For
    this reason, make sure you know exactly which version you''re running.


    You also need to know the exact version of Ubuntu you''re using because problems
    vary. All this information will get you the right help; following advice for the
    wrong version of Linux often won''t work.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_144_1.png)


    ```

    onscreen - UNEXPECTED INCONSISTENCY: RUN fsck

    fsck did with exit status 4

    ? options

    (1) fsck of the root filesystem failed

    fsck must be performed, or the option set remount=/dev/sda1, read-only

    The root filesystem is currently mounted in read-only mode

    run fsck -y /dev/sda1 to check the file system and then restart the system.

    reboot to now

    (2) reboot into a temporary terminal

    (3) reboot into recovery mode

    (4) skip to now

    (5) reboot to now

    (6) Mon Oct 19 10:28:55 UTC 2009 - this date is in the future

    ```


    # READ THE DOCUMENT


    There''s official documentation for each version of the Ubuntu operating system''s
    website (https://help.ubuntu.com). Make sure you click the right link for the
    version of the OS you are using (e.g., 9.04).


    In the documentation you''ll find detailed step-by-step instructions on how to
    perform tasks, as well as examples. Make this first step when you''re trying to
    troubleshoot a problem.


    # SEARCH GOOGLE


    The official forums and documentation have the answers to everything, searching
    Google can be your last resort. Remember, to provide the details that you are
    looking for in order to get the best results (see ''Know the details'', above).


    You''ll probably find many that contain information related to your problem. Read
    a few to find the best answers; and comments from others can help you track down
    the answer.


    # DON''T PANIC


    Many troubleshooting solutions require you to edit one or use string-commands.
    Don''t worry about it. If you''re unsure then you can look up what they do, otherwise
    find a solution where people have verified it and follow the advice.


    # VISIT THE OFFICIAL FORUMS


    One of the best things about Linux is that the users form a community. Many of
    the members are passionate about the OS that they''re doing installing to help
    someone who''s struggling. At forums.ubuntu.com you''ll find the official forums
    needed to help people having problems with Ubuntu.


    Before you post a question, search the forums to see if there''s answering your
    problem remember following the advice in ''Know the details'' above. Don''t worry
    about the accidental person who posted a rude or hurtful remark to one of your
    questions; other users will appear and hopefully give you the help you need.


    Read the Forum FAQ and Code of Conduct first so that you don''t post messages
    in the wrong place or use the wrong type of language. These documents are helpful
    guides on how to ask for help in the right way.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_144_2.png)


    +   Forum threads are a sure-fire way to ask and find help


    THE COMPLETE LINUX MANUAL 143'
