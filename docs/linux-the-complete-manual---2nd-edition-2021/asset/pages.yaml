    regularly updated, so check the website http://www.ubuntu.com/getubuntu if there''s
    a new version, or if you want to install a different version, such as the 32-bit
    edition. If you download one of these ISO (disc image) files, you''ll need to
    burn it to a CD before you can use it. We recommend using CDubnerxp. Alternatively,
