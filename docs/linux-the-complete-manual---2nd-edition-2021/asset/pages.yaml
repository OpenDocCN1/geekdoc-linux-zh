  md: '# Improving your photos using Gimp


    For the first-time user, Gimp''s interface can be a little overwhelming. These
    brief tutorials will guide you through using the main tools


    imp may not be the easiest editor to use, but it is one of the most powerful.
    It gives you much more control over your photos than Picsasa.


    the shade is darker than the outside of the eye. You can adjust the hue if necessary
    to match the actual colour of the subject''s eyes, once zoomed back out, it''s
    unlikely anyone will notice.


    # DEALING WITH RED EYE


    There are bound to photos in your collection in which the subjects are suffering
    from red eye. Otherwise great photos can be ruined by laser-red eyes staring at
    you. It''s caused by the light of the camera''s flash reflecting off the subject''s
    retina, and you''ll always see the effect in photos indoors at night. Fortunately,
    red eye is easy to remove using Gimp, and should take only minutes.


    +   Press Ctrl-Shift-A to dissect the eye and you''ll see that it''s looking reasonably
    good. Now repeats 2 and 3 the other eyes in the image. Finally, change the zoom
    level to 100% using the drop-down at the bottom of the window, and you can adjust
    as much as you wish. Don''t forget to save the image before moving to the next
    one.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_63_0.png)


    +   Start Gimp and open the photo you want to edit. Our shot was taken in a compact
    camera with its flash turned at night. Both subjects'' eyes have devilish look,
    which we''ll need to address.


    +   Zoom into 400 percent magnification. Use the lasso tool (third from the left
    on the top of tools) to draw a circle around the offending area. If necessary
    hit Enter to complete the selection. Then hold the Ctrl key and select the highlight
    in the middle of the eye, and we don''t want to adjust this portion.


