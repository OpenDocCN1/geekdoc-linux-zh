  md: '# CHAPTER 4


    # Playing DVDs


    Using your computer to watch movies and videos is easy with Ubuntu. All you need
    to do is download and install VLC


    U bntu comes with Totem Movie Player, but due to licensing laws in certain countries,
    it can''t play commercial, encrypted DVD movies.

    Don''t worry, though, as it''s simple to install the excellent VLC media player.

    You can install the MPEG2 codec required to play DVDs, installing VLC is an easier
    way to


    watch movies. You may already be familiar with it it''s also available for Windows
    and Mac OS, and it looks and works identically under Linux.

    It supports more than just HDVs, in fact it can play MPEG2, MPEG4, H.264, DivX
    and MPEG1 video formats, as well as MP3, OGG, AAC and other audio files. You can
    use it as a media converter or for streaming video across a network.


    Menus are-explanatory, and many functions can be accessed quickly by right-clicking
    on the video itself.


    Double-click on the video to make it full screen. Another double-click will return
    it to a window.


    ![](img/55dc7df089fe0011a7e15a61689f37ea_71_0.png)


    Drag the bar to jump to a point in the movie. Hover your mouse over the handle
    to display the time.


    Click and drag on the volume control to increase or lower the volume.


    Controls let you play and pause the move, jump to the menu or go to the next previous
    chapter.


    The extended settings button lets you tweak audio and video effects.


