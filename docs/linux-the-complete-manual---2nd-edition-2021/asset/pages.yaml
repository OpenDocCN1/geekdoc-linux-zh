    here was a time when the words ''Linux'' and ''hardware'' in the same sentence
    were enough to make IT grus cry, but not anymore. Linux has grown up and works
    just as easily as Windows with peripherals. Over the past few years, open-source
    developers have been busily writing drivers and applications for USB and Bluetooth
    have made their job easier, but there are still a few issues to look out for,
    just as with any operating system. Windows often has problems with current hardware,
    whereas Linux tends to be obsolete hardware that causes problems. In Ubuntu, popular
