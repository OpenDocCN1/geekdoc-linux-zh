    # Using LibreOffice


    Ubuntu comes with a complete office suite that caters for your word processing,
    spreadsheet, presentation and business graphics needs


    If you''ve ever used an office suite such as Microsoft Office or Works, you''ll
    be at home with LibreOffice. In fact, you''ll be pushed to tell the differences
    between Word, Excel or Powerpoint and Writer, their LibreOffice equivalents.


    LibreOffice would be much use if you couldn''t save documents in a format that
    Microsoft Office users could open. Fortunately, LibreOffice can save documents
    in many formats, so you can pick one that fits the people you''ll be sharing it
