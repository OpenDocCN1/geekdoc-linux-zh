  md: 'To see why this is important, let''s consider the alternative. If you invoke
    a shell script within a shell, by default that script is run within its own subshell.
    You can see this experimentally here:


    ```

    $ echo "test=2" >> tinyscript.sh

    $ chmod +x tinyscript.sh

    $ test=1

    $ ./tinyscript.sh

    $ echo $test

    ```


    The script tinyscript.sh changed the value of the variable test, but only within
    the subshell running the script, so the value of the existing test variable was
    not affected. If you instead run the script using the dot (.,) notation to source
    the script, then it is handled as though each command in the script were typed
    directly into the current shell:


    ```

    . tinyscript.sh

    $ echo $test

    ```


    As you might expect, if you source a script that has an exit 0 command, it will
    exit the shell and log out of the window, because the source operation makes the
    sourced script the primary running process. If you had a script running in a subshell,
    it would exit without the main script stopping. That''s a major difference and
    one reason to opt for sourcing scripts with , or source or (as we''ll explain
    later) exec. The . notation is actually identical to the source command in bash;
    we''re using . , because it''s more portable across different POSIX shells.


