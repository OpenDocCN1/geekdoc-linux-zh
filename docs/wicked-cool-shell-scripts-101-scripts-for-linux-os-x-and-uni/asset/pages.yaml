  md: '# About the Authors


    Dave Taylor has been in the computer industry since 1980. He was a contributor
    to BSD 4.4 UNIX, and his software is included in all major UNIX distributions.
    He is an award-winning public speaker and has written thousands of magazine and
    newspaper articles. He is the author of more than 20 books, including Learning
    Unix for OS X (O''Reilly Media), Solaris 9 for Dummies (Wiley Publishing), and
    Sams Teach Yourself Unix in 24 Hours (Sams Publishing). A popular columnist for
    Linux Journal magazine, he also maintains a customer tech support and gadget website,
    askdavetaylor.com.


    Brandon Perry started writing C applications with the advent of the open source.
    .NET implementation Mono. In his free time, he enjoys writing modules for the
    Metasploit framework, parsing binary files, and fuzzing things.


    # About the Technical Reviewer


    Jordi Gutiérrez Hermoso is a coder, mathematician, and hacker-errant. He has run
    Debian GNU/Linux exclusively since 2002, both at home and at work. Jordi is involved
    with GNU Octave, a free numerical computing environment largely compatible with
    Matlab, and with Mercurial, a distributed version-control system. He enjoys pure
    and applied mathematics, skating, swimming, and knitting. Lately he''s been thinking
    a lot about greenhouse gas emissions and rhino conservation efforts.'
