    # #72 Syncing Files with SFTP


    Though the ftp program is still available on most systems, it''s being more and
    more by new file transfer protocols as rsync and ssh (secure shell). There are
    a few reasons for this: Since the first edition of this book, FTP has begun to
    show some weaknesses with scaling and securing data in this new world of "big
    data," and more efficient protocols for transferring data have become mainstream.
    By default, FTP also transmits data in plaintext, which is generally fine for
    home or corporate networking on trusted networks, but not if you''re doing an
    FTP transfer from an open network at, the library or Starbucks, where a lot of
    people are sharing the same network as you.


    All modern servers should support the considerably more secure ssh package supporting
    end-to-end encryption. The file transfer element of the encrypted transfer is
    sftp, and while it''s even more primitive than ftp, we can still work with it.
    Listing 9-9 shows how we utilize sftp to securely sync your files.


    > If you don''t ssh on your system, complain to your vendor and administrative
    team. There''s no excuse. If you have access rights, you can also obtain the package
    at http://www.openssl.com/ and install it yourself.


    # The Code


    ```

    #!/bin/bash


    # sftsync--Given a target directory on an sftp server, makes sure that

    # all new or modified files are uploaded to the remote system. Uses

    # a timestamp ingeniously called .timestamp to keep track.

    ```'
