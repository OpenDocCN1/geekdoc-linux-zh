    # Hacking the Script


    There''s the lingering question of whether the deck is adequately improved with
    a threshold of 10; that''s one area that can definitely be improved. It is also
    not clear whether showing the spread (the difference between the ranks of the
    two cards) is beneficial. Certainly you wouldn''t do that in a real game; the
    player would need to figure it out.


    Then, you could go in the opposite direction and calculate the odds of having
    a card between two arbitrary card values. Let''s think about this: the odds of
    any given card being drawn is 1 out of 52. If there are 50 cards card coming up
    is 1 out of 50. Since suit is irrelevant, there are 4 out of a given spread are
    (the number of cards in that possible spread × 4) out of 50. If a 5 and 10 are
    dealt, the spread is 4, since the possible winning cards are a 6, 7, 8, or 9.
    So the odds of winning are 4 × 4 out of 50. See what we mean?


    Finally, as with every command line–based game, the interface could do with some
    work. We''ll leave that up to you. We''ll also leave the question of what other
    games to explore with this handy library of playing-card functions.'
