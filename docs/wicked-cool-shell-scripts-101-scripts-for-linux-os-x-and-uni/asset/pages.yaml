    # Hacking the Script


    Once you have a file with numbered lines, you can reverse the order of all lines
    in the file, like this:


    ```

    cat -n filename | sort -rn | cut -c8

    ```


    This does not trick on systems supporting the -n flag to cut, for example. Where
    might this be useful? One obvious situation is when displaying a log file in newest-to-oldest
    order.


    # #28 Wrapping Only Long Lines


    One limitation of the fmt command and its shell equivalent, Script #14 on page
    53, is that they wrap and fill every line they encounter, whether or not it makes
    sense to do so. This can mess up email (wrapping your .signature is not good,
    for example) and any input file format where line breaks matter.


    If you have a document in which you want to wrap the long lines but leave everything
    else intact? With the default set of commands available to a Unix user, there''s
    only one way to accomplish this: explicitly step through each line in an editor,
    feeding the long ones to fmt individually. (You could accomplish this in vi by
    moving the cursor onto the line in question and using !$fmt)'
