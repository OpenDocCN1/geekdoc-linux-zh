    # # How It Works


    The logic of this script is straightforward. First, create a new version of the
    entered information with a sed-based transform that removes all invalid characters.
    ① Then, compare the new version with the original ②. If they are the same, all
    is well. If not, the transformation lost data that wasn''t part of the acceptable
    (alphabetic plus numeric) character set, and the input is invalid.


    This works because the sed substitution removes characters not in the set [:alnum:],
    which is the POSIX regular expression shorthand for all alphanumeric characters.
    If the value of this transformation doesn''t match the original input entered
    earlier, it reveals the presence of nonalphanumeric values in the input string,
    thus indicating the input is invalid. The function returns a nonzero result to
    indicate a problem. Keep in mind, we are expecting only ASCII text.


