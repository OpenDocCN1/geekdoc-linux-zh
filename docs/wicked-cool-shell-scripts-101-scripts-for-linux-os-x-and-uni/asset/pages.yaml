  md: 'Once we know we have the variables needed to manage running parallel processes,
    the real work of the script can start. The first script determines the number
    of files to process and saves a list of the files for later use. Then the script
    begins a loop that will be used to track how many files it has processed so far.
    This loop uses the command to iterate from 1 to the total number of files specified,
    using the number of processes that will run in parallel as the increment step.


    Inside this is another loop that tracks the number of processes starting at a
    given time. This inner loop also uses the command to iterate from 0 to the number
    of processes specified, with 1 as the default increment step. In each iteration
    of the inner loop, a new file is pulled out of the file list, using sed to print
    only the file we want from the list of files saved at the beginning of the script,
    and the supplied command is run on the file in the background using &.


    When the maximum number of processes has been started in the background, the wait
    command tells the script to sleep until all the commands in the background have
    finished processing. After wait is finished, the whole workflow starts over again,
    picking up more processes to work on more files. This is similar to how quickly
    we achieve the best compression in the script best (Script #34 on page 113).


    # Running the Script


    Using the bulkrun script is pretty straightforward. The three arguments it takes
    are the maximum number of processes to run at any one time, the directory of files
    to work on, and the command to run on them. If you wanted to run the ImageMagick
    utility to resize a directory of images in parallel, for instance, you could run
    something like Listing B-4.


    # The Results


    ```

    $ bulkrun -p 3 -i tmp -x mogrify -resize 50%

    Running mogrify -resize 50% tmp/1024-2006_2011_093752.jpg

    Running mogrify -resize 50% tmp/069705a6-660e-11e6-80d1-001c4daa3a7.jpg

    Running mogrify -resize 50% tmp/06970ce0-660e-11e6-8a44-001c4daa3a7.jpg

    Running mogrify -resize 50% tmp/0696cfc0-660e-11e6-8d38-001c4daa3a7.jpg

    Running mogrify -resize 50% tmp/0696cf00-660e-11e6-8d38-001c4daa3a7.jpg--

    ```


    Listing B-4: Running the bulkrun command to parallelize the mogrify ImageMagick
    command


