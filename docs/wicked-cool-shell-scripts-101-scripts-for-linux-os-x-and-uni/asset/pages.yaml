    # The Code\n\n```\n#!/bin/bash\n# loancalc--Given a principal loan amount, interest\
    \ rate, and\n# duration of loan (years), calculates the per-payment amount\n\n\
    # Formula is M = P * ( J / (1 - (1 + J) ^ -N))\n# Where P = principal, J = monthly\
    \ interest rate, N = duration (months)\n\n# Users typically enter P, I (annual\
    \ interest rate), and L (length, years).\n\nif [ # -ne 3 ]; then\n  echo \"Usage:\
    \ $0 principal interest loan-duration-years\" >&2\n  exit 1\nfi\n\nP=1 I=$2 L=$3\n\
    J=\"$(scriptbc -p 8 $I \\/ ( 12 \\* 100 \\) )\"\nM=\"$( \\$L \\* 12 ))\"\nM=\"\
    $(scriptbc -p 8 \\* ( \\$J \\/ ( 1 + \\$J) \\^ -\\$N \\) ))\"\n```\n\n+   - library.sh\
    \ Start by sourcing the script library.\n\nNow a little pretty up of the value:\n\
    \n+   - dollars=\"$(echo $M | cut -d -f1)\ncents=\"$(echo $M | cut -d -f2 | cut\
    \ -c12)\"\n\n```\ncat << EOF\nA $N-year loan at $I% interest with a principal\
    \ amount of $P results in a payment of \\$dollars.\\cents each month for the duration\n\
    the loan (\\$N payments):\nEOF\n```\n\n```\nexit 0\n```\n\nListing 3-10: The loancalc\
    \ shell script\n\n# How It Works\n\nExploring the formula itself is beyond the\
    \ scope of this book, but it's worth noting how a complex mathematical formula\
    \ can be implemented directly in a shell script."
