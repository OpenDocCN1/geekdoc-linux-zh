    data. To retain your sanity, use the Mac versions of these commands and don''t
    try to figure out the by command line that they sort for administrators.


    On a Linux system, an account is created by adding a unique entry to the /etc/passwd
    file, consisting of a one-eight-character account name, a unique user ID, a group
    ID, and a login shell for user. Modern systems store the encrypted password in
    /etc/shadow, so a new user entry must be added to that file, Finally, the account
    needs to be listed in the /etc/group file, with the user either in their own group
    (the strategy implemented in this script) or as part of an existing group. Listing
