  md: "# #89 Keeping Dropbox Running\n\nDropbox is one of a number of useful cloud\
    \ storage systems, and it's particularly popular with people who use a variety\
    \ of devices due to its wide availability across iOS, Android, OS X, Windows,\
    \ and Linux. It's important to understand that, while Dropbox is a cloud storage\
    \ system, the piece that shows up on your own device is a small app designed to\
    \ run in the background, connect your system to the Dropbox internet-based servers,\
    \ and offer a fairly minimal user interface. Without the Dropbox application running\
    \ in the background, we won't be able to successfully back up and sync files from\
    \ our computer to Dropbox.\n\nTherefore, testing whether the program is running\
    \ is a simple matter of invoking ps, as shown in Listing 13-1.\n\n# The Code\n\
    \n```\n```bash\n#!/bin/bash\n# dropbox--Makes sure Dropbox is running on OS X\n\
    \napp=\"Dropbox.app\"\nverbose=1\n\nrunning=\"$(ps aux | grep -i $app | grep -v\
    \ grep)\"\n\nif [ \"$1\" = \"-s\" ]; then\n# -s is for silent mode.\n  verbose=0\n\
    fi\n\nif [ -z \"$running\" ]; then\n  if [ $verbose -eq 1 ]; then\n    echo \"\
    $app is running with PID $(echo $running | cut -d\\ -f2)\"\n  fi\nelse\n  if [\
    \ $verbose -eq 1 ]; then\n    echo \"Launching $app\"\n  fi\n  open -a $app\n\
    fi\nexit 0\n```\n```\n\nListing 13-1: The startdropbox script\n\n# How It Works\n\
    \nThere are two key lines in the script, denoted with ① and ②. The first invokes\
    \ the ps command ① and then uses a sequence of grep commands to look for the specified\
    \ app—Dropbox.app—and simultaneously filters itself out of the results. If the\
    \ resultant string is nonzero, the Dropbox"
  merge: -1
