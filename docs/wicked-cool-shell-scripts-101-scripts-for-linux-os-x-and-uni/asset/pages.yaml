    # #104 Finding the Phase of the Moon\n\nWhether you're a werewolf, a witch, or\
    \ just interested in the lunar calendar, it can be helpful and educational to\
    \ track the phases of the moon and learn about waxing, waning, and even gibous\
    \ moons (which have nothing to do with gibbons).\n\nTo make things complicated,\
    \ the moon has an orbit of 27.32 days and its phase is actually dependent on where\
    \ you are on Earth. Still, it is possible to calculate the phase of the moon.\n\
    \nBut why go through all the work when there are plenty of online sites that already\
    \ calculate the phase for any given date in the past, present, or future? For\
    \ the script in Listing B-5, we're going to utilize the same site Google you use\
    \ to search for the current phase of the moon: http://www.moongiant.com/\n\n#\
    \ ## The Code\n\n```\n#!/bin/bash\n```\n\n```\n# moonphase--Reports the phase\
    \ of the moon (really the percentage of\n# illumination) for today or a specified\
    \ date\n\n# Format of Moongiant.com query:\n# http://www.moongiant.com/phase/MM/DD/YYYY\n\
    \n# If no date is specified, use \"today\" as a special value.\n```\n\n```\nif\
    \ [ $# -eq 0 ]; then\nthedate=\"today\"\nelse\n# Date specified, Let's check whether\
    \ it's in the right format.\nmon=\"$(echo $1 | cut -d -f1)\\nday=\"$(echo $1 |\
    \ cut -d -f2)\\nyear=\"$(echo $1 | cut -d -f3)\" \n```\n\n```\nif [ -z \"$year\"\
