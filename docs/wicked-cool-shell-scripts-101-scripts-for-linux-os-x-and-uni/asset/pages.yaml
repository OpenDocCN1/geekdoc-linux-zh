    there''s little you can''t embed in a shell script when it comes to internet interaction.


    Internet tools are scriptable, even though you might never have thought of that
    way. For example, FTP, a program that is perpetually trapped in debug mode, can
    be scripted in very interesting ways, as is explored in Script #53 on page 174.
    Shell scripting can often improve the performance and output of most command line
    utilities that work with some facet of the internet.


