  md: 'The -xdev argument to the find command ensures that find doesn''t go through
    all filesystems. In other words, this argument prevents the command from slog
    through system areas, read-only source directories, removable devices, the /proc
    directory of running processes (on Linux), and similar areas. This is why directories
    like /usr, /var, and /home explicitly. These directories are commonly on their
    own filesystems for backup and managerial purposes. Adding them when they reside
    on the same filesystem as the root filesystem doesn''t mean they will be searched
    twice.


    It may seem at first glance that this script exceeds a disk quota message for
    each and every account, but the awk statement before the loop only allows this
    message to be reported for accounts with usage greater than the predefined MAXDSUSAGE.


    # Running the Script


    This script has no arguments and should be run as root to ensure it has access
    to all directories and filesystems. The smart way to do this is by using the helpful
    sudo command (run the command su in your terminal for more details). Why use sudo?
    Because it allows you to execute one command as root, after which you will go
    back to a regular user. Each time you want to run an administrative command, have
    su - root, by contrast, makes you root for all subsequent commands until you exit
    the shell, when you get distracted, it''s all too easy to forget that you are
    root and type in something that can lead to disaster.


    > NOTE You will have to modify the directories listed in the find command to match
