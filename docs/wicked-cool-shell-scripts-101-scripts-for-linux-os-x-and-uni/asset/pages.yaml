  md: 'values are increasing over time. The netperf script calculates the current
    percentage of retransmissions by dividing retransmissions by packets sent and
    multiplying by 100. An integer-only version of the retransmission percentage is
    calculated by taking the result of retransmissions by total packets sent, multiplying
    it by 10,000, and dividing it by 100 ⟄


    As you can see, the naming scheme for variables within the script begins with
    the abbreviations assigned to the various netstat variables, which are stored
    in netstat.log at the end of the getstats script ⟄ The abbreviations are sent,
    rec, dup, oo, creg, cac, and ret. In the netperf script, the p suffix is added
    to any of these abbreviations for variables that represent decimal percentages
    of total packets sent or received. The pn suffix is added to the abbreviations
    for variables that represent integer-only percentages of total packets sent or
    received. Later in the netperf script, the ps suffix denotes a variable that represents
    the percentage summaries (averages) used in the final calculations.


    The while loop steps through each entry of netstat.log, calculating the four percent
    variables (re, retr, dup, and oo, which are retrans, timeouts, duplicates, and
    out of order, respectively). All are written to the $stats file, and then the
    awk script counts each in stats and calculates average column values by dividing
    the sums by the number of records in the file (NR).


    The eval line ⟄ ties things together. The awk invocation is called for the set
    of summary statistics ($stats) produced by the while loop and utilizes the calculations
    saved in the $stats file to output variable=value sequences. These variable=sequences
    are then incorporated into the shell with the eval statement, instantiating the
    variables reps, retops, dupps, and oops, which are average retransmit, average
    retransmit timeouts, average duplicate packets, and average out-of-order packets,
    respectively. The current percentile values can then be compared to these average
    values to spot problematic trends.


