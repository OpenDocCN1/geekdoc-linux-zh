    # #46 Setting the System Date


    Conciseness is the heart of Linux and its Unix predecessors has

    affected Linux''s evolution dramatically. But there are areas where this succinctness
    can drive a sysadmin to bat. One of the most common

    anoyances is the format required for resetting the system date, as shown\sby the
    command:


    ```

    usage: date [[[[cccyyy]mm]dd]hh][[.ss]]

    ```


    Trying to figure out all the brackets is baffling, without

    even talking about what you do or don''t specify. We''ll explain: you

    an enter minutes; or seconds; or hours, minutes and

    seconds; or the month plus all—or you can add the year and even the

