    # Hacking the Script


    While certainly not any sort of shell script programming tour de force, these
    scripts nearly demonstrate the extensibility of the Unix command line. If you
    can envision something, the odds are good that there''s a simple way to accomplish
    it.


    These scripts could be improved in any number of ways. For instance, you could
    introduce the concept of records: each remember era is timestamped, and multiline
    input can be saved as a single record that can be searched using regular expressions.
    This approach lets you store numbers for a group of people and retrieve them just
    by remembering the name of one person in the group. If you''re really into scripting,
    you might also want to include and delete capabilities. Then again, it''s pretty
    easy to edit the ~/.remember file by hand.


    # #23 An Interactive Calculator


    If you remember, scriptbc (Script #9 on page 34) allowed to invoke floating-point
    bc calculations as inline command arguments. The logical next step is to write
    a wrapper script to turn this script into a fully interactive command line–based
    calculator. The script (shown in Listing 3-6) ends up being really short! Ensure
    that the scriptbc script is in the PATH, otherwise this script will fail to run.'
