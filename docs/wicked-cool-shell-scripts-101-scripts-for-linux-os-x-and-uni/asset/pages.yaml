    # Hacking the Script


    With one small addition to your login script (.bash_profile or something else,
    depending on what login script you have), you can automatically have the Terminal
    window title always show the current working directory. To make this code show
    your working directory, for example, you can use this at tsch:


    ```

    alias precm ''titleerm "$PWD"    [tcsh]

    ```


    ```

    export PROMPT_COMMAND="titleerm \$PWD\""    [bash]

    ```


    Or this at bash:


    Just drop one of the commands above into your login script, and starting the next
    time you open a Terminal window, you''ll find that your title changes each time
    you move into a new directory. Darn helpful.


    # #81 Producing Summaries of iTunes Libraries


    If you use iTunes for any length of time, you''re sure to have a massive list
    of music, audiobooks, and TV shows. Unfortunately, iTunes doesn''t have an easy
    way to export a list of your music in a succinct and easy-to-read format. Fortunately,
    it''s not hard to write a script that offers this functionality, as Listing 11-5
    shows. This script does rely on the “Share iTunes XML with other applications”
    feature of iTunes being enabled, before running this script, ensure that it''s
    enabled in the iTunes preferences.'
