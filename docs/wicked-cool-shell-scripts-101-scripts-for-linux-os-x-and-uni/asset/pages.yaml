  md: '# # 3


    # # CREATING UTILITIES


    ![](img/954a28cc04c09826495e330f44c0085b_110_0.png)


    One of the main purposes of creating shell scripts is to drop complex command
    line sequences into files, making them replicable and easy to tweak. It should
    be no surprise, that user commands are sprawled across this book. What is surprising?
    That we haven''t written a wrapper for every single command on our Linux, Solaris,
    and OS X systems.


    Linux/Unix is the only major operating system where you can decide that you don''t
    like the default flags of a command and fix it forever with just a few keystrokes,
    or where you can emulate the behavior of your favorite utilities from other operating
    systems by using an alias or a dozen lines of script. That''s what makes Unix
    so tremendously fun—and what we led to writing this book in the first place!'
