  md: 'The coolest hack in this pair of scripts is probably an eval used to assign
    variables to each of the four date values needed ④.


    ```

    eval($date "weekday=\\%a" month=\\%b" day=\\%e" year=\\%g")

    ```


    It''s possible to extract the values one by one (for example, weekday="$(date+)"),
    but in very rare cases, this method can fail if the date rolls over to a new day
    in the middle of the four date invocations, so a succinct single invocation is
    preferable. Plus, it''s just cool.


    Since date returns a day as a number with either a leading zero or a leading space,
    neither of which is desired, the next line of code strips both from the value,
    if present, before proceeding. Have a peek to see how that works!


    # Running the Script


    The addenda script prompts the user for the date of a new event. Then, if it accepts
    the date format, the script prompts for a one-line description of the event.


    The companion addenda script has no parameters and, when invoked, produces a list
    of all events scheduled for the current date.


