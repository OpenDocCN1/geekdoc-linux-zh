  md: "account, but there's one big problem: with multiple people sharing the\nsame\
    \ account, it's easy for someone to leave things messed up for the next\nuser\
    \ they were experimenting with commands, editing .rc files,\nadding subdirectories,\
    \ or so forth.\n\nThis script in Listing 5-23 addresses the problem by cleaning\
    \ up the\naccount space each time a user logs out of the guest account. It deletes\n\
    any newly created files or subdirectories, removes all dotfiles, and rebuilds\n\
    the official account files, copies of which are stored in a read-only archive\n\
    tucked away in the guest account's .template directory.\n\n# The Code\n\n```\n\
    #!/bin/bash\n\n# fixguest--Cleans up the guest account during the logout process\n\
    \n# Don't trust environment variables: reference read-only sources.\n\niam=$(id\
    \ -un)\nmyhome=\"$(grep \"${iam}:\" /etc/passwd | cut -d: -f6)\"\n\n# *** Do NOT\
    \ run this script on a regular user account!\n\nif [ \"$iam\" != \"guest\" ];\
    \ then\n    echo \"Error: you really don't want to run fixguest on this account.\"\
    \ >&2\n    exit 1\n\nif [ ! -d $myhome/..template ]; then\n    echo \"$0: no template\
    \ directory found for rebuilding.\" >&2\n    exit 1\nfi\n\n# Remove all files\
    \ and directories in the home account.\ncd $myhome\nrm -rf * $(find -name \".a-zA-Z0-9]*\"\
    \ -print)\n\n# Now the only thing present should be the ..template directory.\n\
    cp -Rp ..template/*\nexit 0\n```\n\nlisting 5-23: The fixguest script"
