    # #82 Fixing the open Command


    One neat innovation with OS X is the addition of the open command, which allows
    you to easily launch the appropriate application for just any type of file, whether
    it''s a graphics image, a PDF document, or an Excel spreadsheet. The problem with
    open is that it''s a bit quirky. If you want to launch a named application, you
    have to include the -a flag. And if you don''t specify the exact application name,
    it will complain and fail. This is a perfect job for a wrapper script like the
    one in Listing 11-7.'
