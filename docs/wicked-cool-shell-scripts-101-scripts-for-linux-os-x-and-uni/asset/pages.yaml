    # #21 Displaying Time in Different Time Zones


    The most fundamental requirement for a working date command is that it displays
    the date and time in your zone. But what if you have users across multiple time
    zones? Or, more likely, what if you have friends and colleagues in different locations,
    and you''re all confused about what time it is, say, Casablanca, Vatican City,
    or Sydney?


    It turns out that the date command on most modern Unix is built atop an amazing
    time zone database. Usually stored in the directory /usr/share/zoneinfo, this
    database lists over 600 regions and details the appropriate time zone offset from
    UTC (Coordinated Universal Time, often referred to as GMT, or Greenwich Mean Time)
    for each. The date command pays attention to the TZ time zone variable, which
    we can set to any region in the database, like so:


    ```

    $ TZ="Africa/Casablanca" date

    Apr 7 16:31:01 WEST 2017

    ```


    However, most users aren''t comfortable specifying temporary environment variable
    settings. Using a shell script, we can create a more user-friendly frontend to
    the time zone database.


    The bulk of the script in Listing 2-19 involves digging around in the time zone
    database (which is typically stored across several files in the zonedir directory)
    and trying to find a file that matches a specified pattern. Once it finds a matching
    file, the script grabs the full time zone name (as with TZ="Africa/Casablanca"
    in this example) and invokes date with as a subshell environment setting. The
    date command checks TZ to see what time it''s in and has no idea if it''s a one-off
    or the time zone you sit in of the time.


    Improving on User Commands 73'
