  md: "# The Code\n\nyour web pages. One of our favorites is the ability to change\
    \ an element of a web page snippet each time the page is loaded. The element might\
    \ be a graphic, a news snippet, a featured subpage, or a tagline for the site\
    \ itself that's slightly different on each visit, to keep the reader coming back\
    \ for more.\n\nRemarkable is that this trick is quite easy to accomplish with\
    \ a shell script containing an awk program only a few lines, invoked from a web\
    \ page with a SSI or an iframe (a way to have a portion of a page served up by\
    \ a URL that's different from the rest of the page). The script is shown in Listing\
    \ 8-9.\n\n```\n#!/bin/bash\n\n# randomquote--Given a one-line-per-entry datafile,\n\
    # randomly picks one line and displays it. Best used\n# as an SSI call within\
    \ a web page.\nawkscript=\"tmp/randomquote.awk.$\\$\n\nif [ $#-ne 1 ]; then\n\
    \    echo \"Usage: randomquote datafile\" >&2\n    exit 1\nelif [ -r \"$1\" ];\
    \ then\n    echo \"Error: quote file $1 is missing or not readable\" >&2\n   \
    \ exit 1\nfi\n\ntrap \"${which rm}\" -f awkscript 0\n\ncat << \"EOF\" > $awkscript\n\
    BEGIN { srand() }\n{ s[NR] = $0 }\nEND { print s[rand(NR)] }\nfunction randint(n)\
    \ { return int (n * rand()) + 1 }\nEOF\n\n -f awkscript \"$1\"\nexit 0\n```\n\n\
    *Listing 8-9: The randomquote script*\n\n# How It Works\n\nGiven the name of a\
    \ data file, this script first checks that the file exists and is readable. It\
    \ feeds the entire file to a short awk script, which stores each line in an array,\
    \ counts the lines, and then randomly picks one of the lines in the array and\
    \ prints it to the screen."
  merge: -1
  pgno: 245
