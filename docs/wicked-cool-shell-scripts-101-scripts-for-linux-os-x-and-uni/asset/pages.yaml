  md: "# The Code\n\n```\n#!/bin/bash\n# open2--A smart wrapper for the cool OS X\
    \ 'open' command\n# to make it even more useful. By default, 'open' launches the\n\
    # appropriate application for a specified file or directory\n# based on the Aqua\
    \ bindings, and it has a limited ability to\n# launch applications if they're\
    \ in the /Applications dir.\n```\n\n+   First, whatever argument we re given,\
    \ try it directly.\n\n```\nif ! -a \"$\"/dev/null 2>&1 ; then\nif ! -a \"$\"/dev/null\
    \ 2>&1 ; then\n# More than one arg? Don't know how to deal with it--.\nif [ $_\
    \ -gt 1 ]; then\n  echo \"More than one program not supported\" >&2\nelse\n  case\
    \ $(echo $1 | tr '[:upper:]' '[:lower:]') in\n    cpu) app=\"Activity Monitor\"\
    ;\n    addr) app=\"Address Book\";\n    chat) app=\"Messages\";\n    dvd) app=\"\
    DVD Player\";\n    excel) app=\"Microsoft Excel\";\n    info) app=\"System Information\"\
    ;\n    prefs) app=\"System Preferences\";\n    qt[|quicktime]) app=\"QuickTime\
    \ Player\";\n    word) app=\"Microsoft Word\";\n    *) echo \"open: Don't know\
    \ what to do with $1\" >&2\n  esac\n  fi\necho \"You asked for $1 but I think\
    \ you mean $app.\" >&2\nopen -a \"$app\"\nfi\n```\n\nListing 11-7: The open2 script\n\
    \n# How It Works\n\nThis script revolves around the zero and nonzero return codes,\
    \ with the open program having a zero return code upon success and a nonzero return\
    \ code upon failure 1.\nIf the supplied argument is not a filename, the first\
    \ conditional fails, and the script tests whether the supplied argument is a valid\
