  md: 'of a command line, as it''s interpreted as an invalid email address within
    the sendmail queuing system. It safely ends up as a file in your home directory
    called dead.message and is rightfully logged in a system error file.


    Another safety measure would be to encode information from the web browser to
    the server. An encoded backquote, for example, would be sent to the server (and
    handed off to the CGI script) as %60, which can certainly be handled by a shell
    script without danger.


    One common characteristic of all the CGI scripts in this chapter is that they
    do very, very limited decoding of the encoded strings: spaces are encoded with
    + for transmission, so translating them back to spaces is safe. The @ character
    in email addresses is sent as %40, back, too. Other than that, the scrubbed string
    can harmlessly be scanned for the presence of a % and generate an error if encountered.


    Ultimately, sophisticated websites will use more robust tools than the shell,
    but with many of the solutions in this book, a 20-30 line shell script can often
    be enough to validate an idea, prove a concept, or solve a problem in a fast,
    portable, and reasonably efficient manager.


    # # Running the Scripts in this Chapter


    To run the CGI shell scripts in this chapter, we''ll need to do a bit more than
    just make the script appropriately and save it. We must also place the script
    in the proper location, as determined by the configuration of the web server running.
    To do that, we can install the Apache web server with the system''s package manager
    and set it up to run our new CGI scripts. Here''s how to do so with the apt package
    manager:


    ```

    $ sudo apt-get install apache

    $ sudo a2mod cgi

    $ sudo service apache restart

    ```


    Installing via the yum package manager should be very similar.


    ```

    # yum install httpd

    # a2mod cgi

    # service http restart

    ```


    Once it''s installed and configured, you should be able to develop our scripts
    in the default cgi-bin directory for your chosen operating system (/usr/lib/cgi-bin/
    for Ubuntu or /var/www/cgi-bin/ on CentOS), and then view them in a web browser
    at http://<ip>/cgi-bin/script.cgi. If the scripts show up in plaintext in your
    browser, ensure that they are executable with the command chmod +x cgi.cgi.'
