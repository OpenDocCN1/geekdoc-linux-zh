    # Chapter 12: Shell Script Fun and Games


    What''s a programming book without at least a few games? This chapter integrates
    many of the most sophisticated techniques and ideas in the book to create six
    fun and challenging games. While the goal of this chapter is to entertain, the
    code for each game is also well worthy. Of special note is the hangman game, which
