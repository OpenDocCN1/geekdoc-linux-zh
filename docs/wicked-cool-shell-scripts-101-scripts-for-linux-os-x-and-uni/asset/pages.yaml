  md: '# 0


    # A SHELL SCRIPTS CRASH COURSE


    ![](img/954a28cc04c09826495e330f44c0085b_32_0.png)


    Bash (and shell scripting in general) has been around for a long time, and every
    day new people are introduced to the of shell scripting and system automation
    with bash. With Microsoft''s release of an interactive bash shell and Unix subsystem
    within Windows 10, there''s never been a better time to learn how simple and effective
    shell scripts can be.


    # What Is a Shell Script, Anyway?


    Ever since the early days of computers, shell scripts have been helping systems
    administrators and programmers perform tedious jobs that otherwise took time and
    elbow grease. So what is a shell script, and why should you care? Shell scripts
    are text files that run a set of commands, in the order'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'they are written in the script, for a particular shell (in our case, bash).
    The shell is your command line interface to the library of commands available
    on your operating system.


    Shell scripts are essentially bite-sized programs using the commands available
    in your shell environment to automate specific tasks—generally those that no one
    enjoys doing, like web scraping, tracking usage, downloading weather data, renaming
    files, and much more. You can even use scripts to make basic games! These scripts
    can include simple logic, like the if statements you may have seen in other languages,
    but they can also be simpler, as you will soon see.


    Many flavors of command line shells, such as tsch, zsh, and the everpopular bash,
    are available for OS X, BSD, and Linux operating systems. This book will focus
    on the mainstay of the Unix environment, each bash has its features and capabilities,
    the shell that most people first become familiar with Unix is usually. On OS X,
    the Terminal app will open a window with a bash shell (see Figure 0-1). On Linux,
    the command shell can run widely, but many command lines are gnome-terminal for
    GNOME or console for KDE. These applications can have their configurations changed
    so that they use different types of command line shells, but they all use bash
    by default. Essentially, if you are on any kind of Unix-like operating system,
    opening the terminal application should present you with bash shell.


    ![](img/954a28cc04c09826495e330f44c0085b_33_0.png)


    Figure 0-1: The Terminal app on OS X, showing a version of bash


    # NOTE


    In August 2016, Microsoft released bash for the Windows 10 Anniversary release,
    so if you''re working in Windows you can still run a bash shell. Appendix A gives
    instructions on how to install bash for Windows 10, but this book assumes you
    are running on a Unix-like operating system such as OS X or Linux. Feel free to
    test these scripts on Windows 10, but we make no guarantees and have not tested
    them on Windows ourselves! The beauty of bash, touch, is portability, and many
    scripts in this book should "just work."


