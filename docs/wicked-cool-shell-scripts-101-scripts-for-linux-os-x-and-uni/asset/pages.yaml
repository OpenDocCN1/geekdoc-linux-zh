    When working with bc, it''s critical to understand the difference between length
    and scale. As far as bc is concerned, length refers to the total number of digits
    in the number, while scale is the total number of digits after the decimal point.
    Thus, 10.25 has a length of 4 and a scale of 2, while 3.14159 has a length of
    6 and a scale of 5.


    By default, bc has a variable value for length, but because it has a scale of
    zero, bc without any modifications works as the $(( )) notation does. Fortunately,
    if you add a scale setting to bc, you find that there''s lots of hidden power
