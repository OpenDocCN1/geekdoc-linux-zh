  md: '# Hacking the Script


    Knowing the time in a specific time zone across the world is a great ability,
    especially for a systems admin who manages global networks. But sometimes, you
    really want to know the difference in time between two time zones quickly. The
    timein script could be hacked to provide just this functionality. By creating
    a new script, perhaps called tzdiff, based on the timein script, you could accept
    arguments instead of one.


    Using both of the arguments, you could determine the current time in both time
    zones and then print the hour difference between the two. Keep in mind, though,
    that a two-hour difference between two time zones could be two hours forward or
    two hours backward, and this makes a big difference. Distinguishing between a
    two-hour difference going forward or backward is crucial in making this hack a
    useful script.'
