  md: '# #35 Analyzing Disk Usage


    Even with the advent of very large disks and their continual drop in price, system
    administrators seem to be perpetually tasked with keeping an eye on disk usage
    so shared drives don''t fill up.


    The most common monitoring technique is to look at the /usr/home directory, using
    the `du` command to determine the disk usage of all subdirectories and reporting
    the top 5 or 10 users. The problem with this approach, however, is that it doesn''t
    take into account space elsewhere on the hard disk(s). If some users have additional
    archive space on a second drive, or you have some sneaky types who keep MPEGs
    in a dot directory in /tmp or in an unused directory in the /ftp area, this usage
    will escape detection. Also, if you have directories spread across multiple devices,
    searching /home isn''t necessarily optimal.


    Instead, a better solution is to get all the account names directly from the /etc/passwd
    file and then search the filesystems for files owned by each account, as shown
    in Listing 5-1.


    # The Code


    ```

    exit 0

    ```


    Listing 5-1: The quota script


    # How It Works


    By convention, user IDs 1 through 99 are for system daemons and administrative
    tasks, while 100 and above are for user accounts. Since Linux administrators tend
    to be a fairly organized bunch, this skips all accounts that have a uid of less
    than 100.'
