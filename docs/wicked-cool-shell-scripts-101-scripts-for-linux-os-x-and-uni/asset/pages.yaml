  md: 'For those web servers that don''t automatically split their logs into access_log
    and error_log components, you can sometimes split a central log file into these
    components by filtering based on the return code (field 9) of each entry in the
    log:


    ```

    awk ''{if (substr($9,0,1) <= "3") { print $0 }}'' apache.log > access_log

    awk ''{if (substr($9,0,1) > "3") { print $0 }}'' apache.log > error_log

    ```


    A return code that begins with a 4 or 5 is a failure (the client errors and the
    500s are server errors), and a return code beginning with a 2 or 3 is a success
    (the 200s are success messages and the 300s are redirects).


    Other servers that produce a single central log file containing both successes
    and errors denote the error message with [error] field value. In that case, the
    split can be done with a grep ''[error]'' to create the error log and a grep -v
    ''[error]'' to create the access log.


    Whether your server automatically creates an error log or you have to create your
    own error log by searching for entries with the ''[error]'' string, but everything
    in the error log is different from the content of the access log, including the
    way the date is specified.


    # $ head -1 error_log

    Mon Jun 06 08:08:35 2016 [error] [client 54.204.131.75] File does not exist:\var/www/hosts/default/htdocs/clientaccesspolicy.xml


    In the access log, dates are specified as a compact one-field value with no spaces;
    the error log takes five fields instead. Furthermore, rather than a consistent
    scheme in which the word/string position in a space-delimited entry consistently
    identifies a particular field, entries in the error log have a meaningful error
    description that varies in length. An example of just these values reveals surprising
    variation, as here:


    ```

    $ awk ''{print "$9" "$11" "$12"}'' error_log | sort -u

    File does not exist:

    Invalid error redirection:

    Premature end of redirect

    execution failure for parameter

    premature EOF in parsed

    script not found or

    malformed header from script

    ```


    Some of these errors should be examined by hand because they can be difficult
    to track backward to the offending web page.


    The script in Listing 10-5 focuses on the most common problems—in particular,
    File does not exist errors—and then produces a dump of all other log entries that
    don''t match well-known error situations.'
