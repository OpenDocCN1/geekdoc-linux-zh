  md: '# #34 Ensuring Maximally Compressed Files


    As highlighted in Script #33 on page 109, most Linux implementations include more
    than one compression method, but the onus is on the user to figure out which does
    the best job of compressing a given file. As a result, users typically learn how
    to work with one compression program without realizing that they could attain
    better results with a different one. Even more confusing is the fact that some
    files compress better with one algorithm than with another, and there''s no way
    to know which is better without experimentation.


    The logical solution is to have a script that compresses files using each of the
    tools and then selects the smallest resultant file as the best. That''s exactly
    what bestcompress does, shown in Listing 4-19!


    # The Code


    ```

    #!/bin/bash

    \# Given a file, tries compressing it with all the available

    # compression tools and keeps the compressed file''s smallest,

    # reporting to the user. If -a isn''t specified, bestcompress

    # skips compressed files in the input stream.

    Z="gzip" b="bzip2"

    zout="/tmp/bestcompress.$$$2"

    gzout="/tmp/bestcompress.$$gz"

    bzout="/tmp/bestcompress.$$bz"

    skipcompressed=1


    if [ "$1" = "-a" ]; then

    skipcompressed=0; shift

    fi


    if [ $#-eq 0 ]; then

    echo "Usage: $0 [-a] file or files to optimally compress" >&2

    exit 1

    fi


    trap "/bin/rm -f $2 $gzout $bzout" EXIT


    for name in "$@"

    do

    if [ ! -f "$name" ]; then

    echo "$0: file $name not found. Skipped."

    continue

    fi


    if [ "$(echo $name | egrep ''\.(Z|$|\.gz|\.bzz$)$)" = "" ]; then

    if [ $skipcompressed -eq 1 ]; then

    echo "Skipped file ${name}: It''s already compressed."

    continue

    ```'
