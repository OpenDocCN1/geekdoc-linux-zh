  md: '# #8 Sidesteping Poor echo Implementations


    As mentioned in “What Is POSIX?” on page 10, while most modern Unix and GNU/Linux
    implementations have a version of the echo command that knows the -n flag should
    suppress trailing newlines on the output, not all implementations work that way.
    Some use vc as a special embedded character to defeat this default behavior, or
    others simply insist on including the trailing newline regardless.


    Figuring out whether your particular echo is well implemented is easy: Simply
    enter these commands and see what happens:


    ```

    $ echo -n "The rain in Spain"; echo " falls mainly on the Plain

    ```


    If your echo works with the -n flag, you’ll see output like this:


    The rain in Spain fails mainly on the Plain


    If it doesn''t, you''ll see output like this:


    -The rain in Spain

    fails mainly on the Plain


    Ensuring the script output is presented to the user as desired is important and
    will become increasingly important as our scripts become more interactive. To
    that end, we''ll write an alternate version of echo, called echon, that will always
    suppress the trailing newline. Now we''ll have something reliable to call every
    time we the echo -n functionality.


    # The Code


    There are many ways to solve this quirky echo problem as there are pages in this
    book. One of our favorites is very succinct; it simply filters its input through
    the awk printf command, as Listing 1-16.


    ```

    echon()

    {

    echo "$*" | awk ''{ printf "%s", $0 }''

    }

    ```


