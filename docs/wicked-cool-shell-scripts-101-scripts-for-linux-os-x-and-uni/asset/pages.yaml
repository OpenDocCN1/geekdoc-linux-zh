  md: '# How It Works


    This succinct script offers two different command flags: -w X to specify that
    lines be wrapped when they exceed X characters (the default is 72) and -h to enable
    hyphenated word breaks across lines. Notice the check for flags at ①. The while
    loop uses getopt to read each option passed to the script at one, and the inner
    case block decides what to do with them. Once the options are parsed, script calls
    shift ② to throw away all the option flags using OPTIND (which holds the index
    of the next argument to be read by getsopt) and leaves the remaining arguments
    to continue processing.


    This script also makes use of a here document (discussed in Script #9 on page
    34), which is a type of code block that can be used to feed multiple lines of
    input to a command. Using this noting convenience, the script at ③ noff all the
    necessary commands to achieve the desired output. In order, we use a bash to replace
    a variable that isn''t defined ④, in order to provide a default value if the user
    does not specify an argument. Finally, the script calls the cat command with the
    requested file names to process. To complete the task, the cat command''s output
    is fed directly to noff ⑤. This is a technique that will appear frequently in
    the scripts presented in this book.


    # Running the Script


