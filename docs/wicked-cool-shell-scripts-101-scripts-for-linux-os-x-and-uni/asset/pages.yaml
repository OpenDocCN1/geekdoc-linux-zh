    # #64 Logging Web Events


    A cool use of a shell-based CGI script is to log events using a wrapper. Suppose
    that you''d like to have a DuckDuckGo search box on your web page. Rather than
    feed the queries directly to DuckDuckGo, you''d like to log them first to see
    what users are searching for is related to the content on your site.'
