- img_proc: true
  md: "First off, a bit of HTML CGI is necessary. Input boxes on web pages are created\
    \ with the HTML <form> tag, and when the form is submitted by clicking the form's\
    \ button, it sends the user input to a remote web page in the value of the form's\
    \ action attribute. The DuckDuckGo query on any web page can be reduced to something\
    \ like this:\n\n```\n<form method=\"get\" action=\"\">\nSearch DuckDuckGo:\n \
    \ <input type=\"text\" name=\"q\">\n  <input type=\"submit\" value=\"search\"\
    >\n</form>\n```\n\nRather than hand the search directly to DuckDuckGo, we want\
    \ to feed it to a script on our own server, which will log the pattern and then\
    \ redirect the query to the DuckDuckGo server. The form therefore changes in only\
    \ one small regard: the action becomes a local script rather than a direct call\
    \ to DuckDuckGo:\n\nThe log-duckduckgo-search CGI script is remarkably simple,\
    \ as Listing 8-5 shows.\n\n# The Code\n\n```\n#!/bin/bash\n\n# log-duckduckgo-search--Given\
    \ a search request, log the pattern and then\n# feeds the entire sequence to the\
    \ real DuckDuckGo search system\n\n# Make sure the directory path and file listed\
    \ as logfile are writable by\n# the user server is running as.\nlogfile=\"/var/www/wicked/searchlog.txt\"\
    \n\nif [ ! -f $logfile ]; then\n  touch $logfile\n  chmod +rw $logfile\nfi\n\n\
    if [ -w $logfile ]; then\n  echo \"$(date): $QUERY_STRING\" | sed 's/q=\\//g;s/+/\
    \ /g' >> $logfile\nfi\n\necho \"location: https://duckduckgo.com/html/?$QUERY_STRING\"\
    \necho\"\n\nexit 0\n```\n\nListing 8-5: The log-duckduckgo-search script"
  merge: -1
  pgno: 235
- img_proc: true
  md: '# How It Works


    The most notable elements of the script have to do with how web servers and web
    clients communicate. The information entered into the search box is sent to the
    server as the variable QUERY_STRING ⓘ encoded by replacing spaces with the + and
    other non-alphanumeric characters with the appropriate character sequences. Then,
    when the search pattern is logged, all + signs are translated back into spaces
    safely and simply. Otherwise the search pattern is not decoded, to protect against
    any tricky a user might attempt. (See the introduction to this chapter for more
    details).


    Once logged, the web browser is redirected to the actual DuckDuckGo search page
    with the Location: header value. Notice that simple appending ?$QUERY_STRING is
    sufficient to relay the search pattern to its final destination, however simple
    or complex the pattern may be.


    The log file produced by this script prefaces each string with the current date
    and time to build up a data file that not shows popular searches can also be analyzed
    by the time of day, the day of the week, the month, and so forth. There''s lots
    of information that this script could reveal about a busy site!


    # Running the Script


    To use this script, you need to create the HTML form, and you need to have the
    script executable and located on your server. (See "Running the Scripts in this
    Chapter" page 201 for more details.) However, we can test the script by using
    curl. To test the script, perform an HTTP request with curl that has a q parameter
    with the search query:


    ```

    $ curl ''10.37.129.5/cgi-bin/log-duckduckgo-search.cgi?q=metasploit''

    <!DOCTYPE HTML "-//I//DTD HTML 2.0//EN">

    <html>

    <head>

    <title>302 Foundc</title>

    </head>

    <body>

    <h1>Foundc</h1>

    <p>The document has moved a href="https://duckduckgo.com/http?=metasploit"here<a>.</a>.</p>

    <hr>

    <address>Apache/2.4.7 (Ubuntu) Server at 10.37.129.5 Port 80</address>

    </body>

    </html>

    $

    ```


    > Then, verify that the search was logged by printing the contents of your search
    log to the console screen:


    ```

    $ cat searchlog.txt

    Thu Mar 9 17:20:56 CST 2017: metasploit

    $

    ```'
