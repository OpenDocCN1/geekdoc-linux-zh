    Aha! Notice on Thursday, user Susan deleted the file /tmp/cntral.log.


    # Hacking the Script


    There''s a potential log file ownership permission problem here. Either the remove.log
    file is writable by all, in which case a user could clear its contents with a
    command like cat /dev/null /var/log/remove.log, or it isn''t writable by all,
    in which the script cannot log the events. You could use a setuid permission—with
    the script running—that the script runs with the same permissions as the log file.
    However, there are two problems with this approach. It''s really a bad idea! Never
    run setuid a command as a specific user, no matter who is executing the command,
    you are potentially introducing weaknesses to your system. Second, you could get
    into a situation where users have permission to delete their files but the script
    doesn''t, and because the effective uid set with would be inherited by the rm
    command itself, things would break. Great confusion would ensue when users couldn''t
    even remove their files!


    If you have ext2, ext3 or ext4 filesystem (as is usually the case with Linux),
    a different solution is to use the chatt command to set a specific append-only
    file permission on the log file and then make it writable without any danger.
    Another solution is to write the log messages to syslog, using the helpful logger
    command. Logging the rm commands with logger is straightforward, as shown here:


    ```

    logger -t "${USER:-LOGNAME}: $*

    ```'
