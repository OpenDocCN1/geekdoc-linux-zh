    # Hacking the Script


    From an internal perspective, the script could be greatly improved by having a
    better error-checking sequence, or even by just utilizing Script #3 on page 17.
    That would let users specify dates in more formats. An improvement would be to
    replace the if/then/else statement at the end with a function that translates
    illumination level into more common moon phase phrases like "waning," "waxing,"
    and "gibbous." NASA has a web page you could use that defines the different phases:
    http://starchild.gsfc.nasa.gov/docs/StarChild/solar_system_level2/moonlight.html.'
