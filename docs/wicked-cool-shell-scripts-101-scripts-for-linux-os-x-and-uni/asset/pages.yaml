    Listing 5-16: The suspenduser script


    # How It Works


    This script changes the user''s password to a value unknown to the user and shuts
    off the user''s home directory. If they are logged in, we give a few seconds''
    warning and log the user out by killing all of their running processes.


    Notice how the script sends the SIGHUP (hang-up signal to each running process
    ① and waits a second before sending the more aggressive SIGKILL (kill) signal
    ②. The SIGHUP quits applications—except not always, and it won''t kill a login
    shell. however, can''t be ignored or blocked, so it''s guaranteed to be 100 percent
    effective. It''s not preferred, though, because it doesn''t give the application
    time to clean temporary files, flush buffer to ensure that changes are written
    to disk, and so.


    Unspending a user is a simple two-step process of opening their home directory
    back up (with chmod 700) and resetting the password to a known value (with password).


    # Running the Script


    This script must be run as root, and it has one argument: the name of the account
    to suspend.


