    The Apache htpasswd program offers a nice command line interface for appending
    the new account and encrypted password information to the account database. By
    only one of the two commonly distributed versions of htpasswd supports batch for
    scripts—that is, feeding the script an account and password from the command line.
    It''s easy to tell whether your version does: if htpasswd doesn''t complain when
