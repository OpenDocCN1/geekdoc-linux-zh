  md: '# 12


    # # SHELL SCRIPT FUN AND GAMES


    ![](img/954a28cc04c09826495e330f44c0085b_304_0.png)


    Up to this point, we''ve focused on serious uses of shell scripts to improve your
    interaction with your system and make the system more flexible and powerful. But
    there''s another side to shell scripts that''s worth exploring: games.


