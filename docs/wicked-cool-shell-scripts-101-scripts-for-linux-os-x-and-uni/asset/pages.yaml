  md: 'Much of the challenge of script writing also arises from subtle variations
    among different flavors of Unix and among the many different GNU/Linux distributions.
    While the IEEE POSIX standards supposedly provide a common base of functionality
    across Unix implementations, it can still be confusing on an OS system after a
    year in a Red Hat GNU/Linux environment. The commands are different, they''re
    in different locations, and they often have subtle different command flags. These
    variations can make writing shells tricky, but we''ll learn a few tricks to keep
    these variations at bay.


    # What Is POSIX?


    The early days of Unix were the Wild West, with companies innovating and taking
    the operating system in different directions while simultaneously assuring customers
    that all these new versions were compatible with each other and just like every
    Unix. The Institute for Electrical and Electronic Engineers (IEEE) stepped in,
    with tremendous effort from all the major Unix vendors, created a standard definition
    for Unix called the Portable Operating System Interface, or POSIX for short, against
    which all commercial and open source Unix implementations are measured. You can''t
    buy a POSIX operating system per se, but the Unix or GNU/Linux you run is generally
    POSIX compliant though there''s some debate about whether we need a POSIX standard
    at all, when GNU/Linux has a de facto standard of its own.


    At the same time, even POSIX-compliant Unix implementations can vary. One element
    addressed later in this chapter involves the echo command. Some versions of this
    command support an -n flag, which disables the trailing newline that''s a standard
    part of the command execution. Other versions of echo support the \escape sequence
    as a special "don''t include a newline" notation, while others still have no way
    to avoid the newline at the end of the output. To make things even more interesting,
    some Unix systems have a command with a built-in echo function that ignores the
    -n and \c flags, as a stand-alone binary /bin/echo that understands these flags.
    This makes it tough to prompt in a shell script, because scripts should work identically
    on as many Unix systems as possible. So for functional scripts, it''s critical
    to normalize the echo command to work the same across systems. Later in this chapter,
    Script #8 on page 33, we''ll see how to wrap echo inside a shell script to create
    such a normalized version of the command.


    Some of the scripts in this book take advantage of bash-style features that may
    not be supported by all POSIX-compliant shells.


    But enough backstory—let''s start looking at scripts to include in our shell script
    library!'
