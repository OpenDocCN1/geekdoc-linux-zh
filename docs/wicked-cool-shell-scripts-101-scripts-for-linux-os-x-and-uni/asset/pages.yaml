  md: 'To validate that the environment variable values are valid, the validate()
    function first checks whether each value begins with a /. If it does, the function
    checks whether the variable is an executable. If it doesn''t begin with a /, the
    script calls the in_path() function imported from the library we started with
    Script #1 on page 11 to see whether the program is found in one of the directories
    in the current PATH.


    The most unusual aspect of this script is its use of default values within some
    of the conditionals and its use of variable slicing. Use of default values in
    the conditionals is exemplified by the line ${variable:=errorMessage} can be read
    as "If exists, substitute its value; otherwise, fail with the error errorMessage."


    The variable-slicing function ${varvalue??} used at is POSIX substring function,
    and it produces only the first character of the variable. In this script, it''s
    used to tell whether an environment variable has a fully qualified filename (one
    starting with / and specifying the path to the binary).


    If your version of Unix/Linux doesn''t support either of these notations, they
    can be replaced in a straightforward fashion. For example, instead of $SHE=?No
    Shell, you should substitute the following:


    ```

    if [ -z "$SHELL" ]; then

    echo "Shell" >&2; exit 1

    ```


    And instead of ${varvalue#}, you could use this code to establish the same result:


    ```

    $echo $variable | cut -c1

