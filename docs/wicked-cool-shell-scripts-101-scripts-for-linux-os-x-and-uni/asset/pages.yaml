  md: '# How It Works


    The sftp program allows a series of commands to be fed into it as a pipe or redirect.
    This feature makes this script rather simple: it focuses almost entirely on building
    up a sequence of commands to upload any changed files. At the end, these commands
    are fed to the sftp program for execution.


    If you have a version of sftp that doesn''t properly return a nonzero fail code
    to the shell when a transfer fails, simply remove the conditional block at the
    end of the script  and replace it with:


    ```

    sftp -b $tempfile "$@server"

    touch $timestamp

    ```


    Because sftp requires the account to be specified as user@host, it''s actually
    a bit simpler than an equivalent FTP script. Also notice the -P flag added to
    the put commands; it causes FTP to retain local permissions, as well as creation
    and modification times, for all files transferred.


