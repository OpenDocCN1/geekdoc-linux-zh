    # How It Works


    The most interesting line in this script is ② ls output the size of each file
    (the original and the three compressed files, in a known order), chops out the
    file sizes with awk, sorts these numerically, and ends up with the line number
    of the smallest resultant file. If the compressed versions are all bigger than
    the original file, the result is 1, and an appropriate message is printed out
    ③. Otherwise, smallest will indicate which compress, gzip, or bzip2 had the job.
    Then it is just a matter of moving the appropriate file into the current directory
    and removing the original file.


    The three compression calls starting at ① are also worth pointing out. These calls
    are done in parallel using the & to drop each of them into its own subshell, followed
    by the call to wait, which stops the script until all the calls are completed.
    On a uniprocessor, this might not offer much performance benefit, but with multiple
    processors, it should spread out and potentially complete a bit faster.'
