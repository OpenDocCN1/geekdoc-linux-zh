    Listing 10-12: Running netstat to get TCP information


    The first step is to extract those entries that contain interesting and important
    performance statistics. That''s the main job of getstats, and it does by saving
    the output of the netstat command into the temp file $temp and going through $temp
    to calculate values, as total packets sent and received. The line at O, for example,
    gets the number of packets sent.


    The sed invocation removes any nondigit values to ensure that no tabs or spaces
    end up as part of the resulting value. All of the extracted values are written
    to the netstat.log file in the format varName=varValue; varName=varValue; and
    so forth. This format will let us use later on each line in netstat.log and have
    all the the variables instantiated in the shell:


    ```

    time=103984800;snt=3872;re=24;rec=5065;dup=306;oo=215;creq=46;cacc=170;reto=170

    ```


    The netperf script does the heavy lifting, parsing netstat.log and reporting both
    the most recent performance numbers and any anomalies or other'
