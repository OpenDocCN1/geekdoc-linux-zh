    # # How It Works


    As we''ve said, there''s a lot of overlap between the daysago script and have
    enough that you could probably combine them into one script and have conditionals
    test whether the user is requesting a date in the past or a date in the future.
    Most of the math here is simply the inverse of the math in the daysago script,
    looking ahead into the future instead of back into the past.

    This script is a cleaner, however, because it considers a lot more error conditions
    before invoking the actual calculations. Take, for example, our favorite test
    at ①.


    If someone tries to trick the script by specifying today''s date, this conditional
    will catch and return "zero days" as its calculation.


    # # Running Script


    How many days until January 1, 2020? Listing 15-6 gives us the answer.


    ```

    $ daysuntil 1 1 2020

    There are 1321 days until the date 1/1/2020.

    ```


