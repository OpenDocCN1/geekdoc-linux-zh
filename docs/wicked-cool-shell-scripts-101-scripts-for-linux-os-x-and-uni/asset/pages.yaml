  md: "# #94 Smarter Image Size Analyzer\n\nThe file command offers the ability to\
    \ ascertain the file type and, in some cases, the dimensions of an image. Too\
    \ often it fails:\n\n```\n$ file * | head -4\n100.0399.png: PNG image data, 1024\
    \ x 768, 8-bit/color RGBA, non-interlaced\n8t grade arti.jpeg: JPEG image data,\
    \ JFIF standard 1.01\n99.gif: GIF image data, version 89a, 143 x 163\nAngel.jpg:\
    \ JPEG image data, JFIF standard 1.01\n```\n\nPNG and GIF files work, but what\
    \ about the more common JPEG? The file command can't figure out the image's dimensions.\
    \ Annoying!\n\n# The Code\n\nLet's fix that with a script (Listing 14-1) that\
    \ uses the identify tool from ImageMagick to far more accurately ascertain image\
    \ dimensions.\n\n```\n#!/bin/bash\n# identifies--Displays image information and\
    \ dimensions using the\n# identify utility from ImageMagick\n\nfor name\n  identify\
    \ -format \"%f: %G with %k colors.\\n\" \"$name\"\n  done\nexit 0\n```\n\nListing\
    \ 14-1: The identifies script\n\n# How It Works\n\nWhen you use the -verbose flag,\
    \ the identify tool extracts an extraordinary amount of information about each\
    \ image analyzed, as shown in its output for just one PNG graphic:\n\n```\n$ identify\
    \ -verbose testimage.png\nImage: testimage.png\nFormat: PNG (Portable Network\
    \ Graphics)\nClass: DirectClass\nGeometry: 112x158+0+0\nResolution: 72x72\nPrint\
    \ size: 16.2778x2.19444\nUnits: Undefined\n```\n\n```\n--snip--\n\nProfiles:\n\
    Profile-icc: 3144 bytes\nIEC 61966-2.1 Default RGB colour space - sRGB\n```"
