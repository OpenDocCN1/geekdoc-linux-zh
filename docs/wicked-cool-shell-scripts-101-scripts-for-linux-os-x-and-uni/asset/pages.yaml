  md: "# Hacking the Script\n\nSometimes it may be useful to replace text in a filename\
    \ with a special string, like today's date or a timestamp. Then you'd know when\
    \ the file was renamed without needing to specify today's date in the -r argument.\
    \ You can accomplish this by adding special tokens to the script that can be replaced\
    \ when the file is renamed. For instance, you could have a replace string containing\
    \ %d or %t, which are replaced with today's date or a timestamp, respectively,\
    \ when the file is renamed.\n\nSpecial tokens like this can make moving files\
    \ for backup purposes easier. You can add a cron job that moves certain files\
    \ so the dynamic token in the filenames will be updated by the script automatically,\
    \ instead of updating the cron job when you want to change the date in the filename.\n\
    \n# #103 Bulk-Running Commands on Multiprocessor Machines\n\nWhen this was first\
    \ published, it was uncommon to have a multicore or multiprocessor machine unless\
    \ you worked on servers or mainframes for a living. Today, most laptops and desktops\
    \ have multiple cores, allowing the computer to perform more work at once. But\
    \ some programs want to run without taking advantage of this increase in processing\
    \ power and will only use one core at a time; use more cores to run multiple instances\
    \ of the program in parallel.\n\nSay you have a program that converts images from\
    \ one format to another, and you have a lot of files to convert! Having a single\
    \ process convert each file serially (one after another instead of parallel) could\
    \ take a long time. It would be much faster to split the files across multiple\
    \ processes running alongside each other.\n\nThe script in Listing B-3 details\
    \ how to parallelize a given command for a certain number of processes you may\
    \ want to run all at once.\n\n> If you don't have multiple cores in your computer,\
    \ or if your program is slow for other reasons, such as a hard drive bottleneck,\
    \ running parallel instances of a program could be detrimental to performance.\
    \ Be careful with starting too many processes as it could easily overwhelm an\
    \ underpowered system. Luckily, even a Raspberry Pi has multiple cores nowadays!\n\
    \n# The Code\n\n```\n#!/bin/bash\n# bulkrun--Iterates over a directory of files,\
    \ running a number of\n# concurrent processes that process the files in parallel\n\
    ```\n\n```\nprintHelp() {\n  echo \"Usage: $0 -p 3 -i inputDirectory/ -x \\command\
    \ to run/\\\"\n  echo -e \"\\t-p The maximum number of processes to start concurrently\"\
    \n```"
