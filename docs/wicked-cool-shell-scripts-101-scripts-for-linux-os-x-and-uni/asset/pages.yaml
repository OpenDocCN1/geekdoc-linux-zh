  md: '# What to Take Away


    This book focuses on common challenges you might face when writing portable automation,
    such as when building software or providing orchestration, making common tasks
    easily automatable. The way to get the most out of this book is to take the solution
    we create for each problem and extrapolate to other, similar problems you may
    encounter. For instance, in Chapter 1, we write a portable echo implementation
    by creating a smaller script. While many systems will benefit from this specific
    script, the important takeaway is the general solution of creating a script to
    ensure consistent behavior across platforms. Later on the book, we delve into
    some wicked cool features of bash scripting and common utilities available for
    Unix systems, getting versatility and power at your fingertips.


    # This Book Is For If ....


    Bash remains a staple tool for anyone working on Unix-like servers or workstations,
    including web developers (many of whom develop on OS X and deploy to Linux), data
    analysts, mobile app developers, and software engineers—to name a few! On top
    of that, hobbyists are running Linux on their open source microcomputers, like
    the Raspberry Pi, to automate their smart homes. For all of these uses, shell
    scripts are perfect.


    The applications of these scripts are endlessly useful for both looking to develop
    their already substantial bash skills with some cool shell scripts and those who
    may only use a terminal or shell script every once in a while. Individuals in
    the latter camp may want to brush up on a few shortcuts or supplement their reading
    with an introduction to more advanced concepts.


    This book isn''t a tutorial, though! We aim to bring you practical applications
    of bash scripting and common utilities in (mostly) short, compact scripts, but
    we do provide line-by-line explanations. We explain the core parts of each script,
    and many seasoned shell scripts might be able to tell you how the rest of the
    script works by reading the code. But we expect you as the reader to play with
    the script—breaking it and fixing it and it to meet your needs—figure it out.
    The spirit of scripts is all about solving common challenges, such as web management
    or syncing files—problems every techie regardless of the tools they


