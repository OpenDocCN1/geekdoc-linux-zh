    # Hacking the Script


    This script really just scratches the surface of this complex and interesting
    topic. It''d be nice to have it look a few days ahead, for example; this could
    be accomplished in the agenda script by doing some date math. If you have the
    GNU date command, date math is easy. If you don''t, well, enabling date math solely
    in the shell requires a complex script. We''ll look closely at date later in the
    book, notably in Script #99 on page 330, Script #100 on page 332, and Script #101
    on page 335.


    Another (easier) hack would have a agenda output Nothing for when there are no
    matches for the current date, rather than the sloppier On the agenda for today:
    followed by nothing.

    This script could also be used on a Unix for sending wider reminders about events
    like backup schedules, company holidays, and employee birthdays. First, the agenda
    script on each user''s machine additionally check a shared read-only .agenda file.
    Then add a call to the agenda script in each user''s .login or similar file that
    was invoked on login.


    > NOTE

    Surprisingly, date implementations vary across different Unix and Linux systems,
    if you try something more complicated with your own date command and it fails,
    make sure to check the man page to see what your system can and cannot do.'
