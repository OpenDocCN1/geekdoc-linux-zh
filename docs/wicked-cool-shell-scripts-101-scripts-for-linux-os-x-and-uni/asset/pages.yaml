- img_proc: true
  md: 'Once you have GNU installed, calculating, say, whether a given year is a leap
    year can be handled by the program itself, rather than you having to mess with
    rules about years divisible by 4 but not 100 and so on.


    ```

    if [ $( 12/31/$year*$j ) -eq 366 ]

    ```


    In other words, if the last day of the year is the 366th day of the year, it must
    be a leap year.

    Another quality that makes GNU date superior is its ability to go back in time.
    The standard Unix date command built with a "time zero" or epoch date of January
    1, 1970, at precisely 00:00:00 UTC. Want to know about something that happened
    in 1965? Tough luck. Frequently, with the three nifty scripts in this chapter,
    you can harness the advantages of GNU date.


    # #99 Finding the Day of a Specific Date in the Past


    Quick: On what day of the week were you born? On what day of the week did Neil
    Armstrong and Buzz Aldrin first walk on the moon? The script in Listing 15-1 helps
    you quickly answer these classic questions and neatly demonstrates how powerful
    GNU date is.


    # The Code


    ```

    #!/bin/bash

    # daypass--Given a date, reports what day of the week it was

    ```


    ```

    if [ -ne $3 ]; then

    echo "Usage: $(basename $0) mon day year" >&2

    echo "   with just numerical values (ex: 7 7 1776)" >&2

    exit 1

    fi

    ```


    ```

    date --version > /dev/null 2>&1 # Discard error, if any.

    baddate=$?                # Just look at return code.

    ```


    ```

    if [ $bdate ]; then

    date -d $1/$2/$3 "That was a %A."

    else

    ```


    ```

    if [ $2 -lt 10 ]; then

    pattern="$2[0-9]"

    else

    pattern="$2[0-9]"

    fi

    ```


    ```

    dayofweek="$(@cal $1 $3 | grep "$pattern" | cut -c1-2)

    ```'
