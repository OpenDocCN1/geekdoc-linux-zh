  md: '# TWO QUICK TRICKS


    Here are two quick examples up front to show what you mean. First off, old-school
    Usenet users know about rot13, a simple mechanism whereby off-color jokes and
    obscene text are obscured to make them a bit less readable. It''s a substitution
    cipher, and it''s remarkably simple to accomplish in Unix.

    To rot13 something, feed it through tr.


    ```

    tr ''[a-ZA-Z]'' ''[n-za-mnN-ZA-M]''

    ```


    Here''s an example:


    ```

    $ echo "So two people walk into a bar..." | tr ''[a-ZA-Z]'' ''[n-za-mnN-ZA-M]''

    Fb gjb cbcryr jynx vagb n one...

    ```


    To unwrap, apply the same transform:


    ```

    $ echo gjb cbcryr jynx vagb n one... | tr ''[a-ZA-Z]'' ''[n-za-mnN-ZA-M]''

    So two people walk into a bar...

    ```


    A famous substitution cipher of this nature is associated with the

    2001: A Space Odyssey. Remember the computer''s name? Check it out:


    ```

    $ echo HAL ''[a-ZA-Z]'' ''[b-a8-ZA]''

    IBM

    ```


    Another short example is a palindrome checker. Enter something

    bieve is a palindrome, and the code will test it:


    ```

    testit="$(echo $@ | sed ''s/[[:alpha:]]//g'' | tr ''[:upper:]'' ''[:lower:]'')''

    backward=\$(echo $testit | rev)"

    ```


    ```

    if [ "$testit" = "backward" ]; then

    echo "$@ is a palindrome"

    else

    echo "$@ is not a palindrome"

    fi

    ```


    > A palindrome is a word that is identical forward and backward, and so first

    step is to remove all non-alphabetic characters and ensure that all letters are

    lowercase. Then the Unix utility rev reverses the characters in a line of input.
    If the

    forward and backward versions are the same, we''ve got a palindrome; if they

    differ, we don''t.


    The games in this chapter are only a bit more complex, but all will prove

    fun and worth adding to your system.'
