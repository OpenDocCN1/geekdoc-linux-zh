  md: "# #86 Is That Number a Prime?\n\nPrime numbers are numbers that are divisible\
    \ only by themselves, for example, 7. On the other hand, 6 and 8 are not prime\
    \ numbers. Recognizing prime numbers is easy with single digits, but it gets more\
    \ complicated when we jump up to bigger numbers.\n\nThere are different mathematical\
    \ approaches to figuring out whether a number is prime, but let's stick with the\
    \ brute-force method of trying all possible divisors to see whether any have a\
    \ remainder of zero, as Listing 12-7.\n\n# The Code\n\n```\n!/bin/bash\n# isprime--Given\
    \ a number, ascertain whether it's a prime. This uses what's\n# known as trial\
    \ division: simply check any number from 2 to (n/2)\n# divides into the number\
    \ without a remainder.\n\ncounter=2\nremainder=1\n\nif [ $ -eq 0 ]; then\n   \
    \ echo \"Usage: isprime NUMBER\"&2\n    exit 1\nfi\n\nnumber=$1\n\n# 3 and 2 are\
    \ primes, 1 is not.\n\nif [ $number -lt 2 ]; then\n    echo \"No, $number is not\
    \ a prime\"\n    exit 0\nfi\n\n# Now let's run some calculations.\nwhile [ $counter\
    \ -le $(expr $number / 2) ] -a $remainder -ne 0 ]; do\n    remainder=$(expr $number\
    \ % $counter) # '/' is divide, '%' is remainder\n    # echo for counter $counter,\
    \ remainder = $remainder\n    counter=$(expr $counter + 1)\nd\n\nif [ $remainder\
    \ -eq 0 ]; then\n    echo \"No, $number is not a prime\"\nelse\n    echo \"Yes,\
    \ $number is a prime\"\nfi\nexit 0\n```\n\n*Listing 12-7: The isprime script*"
