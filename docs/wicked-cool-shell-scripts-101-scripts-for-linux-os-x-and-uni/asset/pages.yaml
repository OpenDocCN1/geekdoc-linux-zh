    # How It Works


    The cron jobs loaded in /etc/cron/ /etc/daily, /etc/weekly, and /etc/monthly (or
    /etc/cron

    daily, /etc/cron.weekly, and /etc/cron.monthly) are set up completely differently

    from user crontab files: each is a directory that contains a set of scripts, one

    per job, that are run by the cron table, as specified in the /etc/crontab

    file. To make this even more confusing, the format of the /etc/crontab file is

    different too, because it adds an additional field that indicates what effective-user
    ID should run the job.


    > The crontab file specifies the hour of the day (in the second column

    of the output that follows) at which to run the daily, weekly, and monthly

    jobs in a format that is completely different from what you''ve seen as a regu-

    lar Linux user, as shown here:


    ```

    # egrep ''daily|weekly|monthly'' /crontab

    # Run daily/weekly/monthly jobs.

    15 3 * * * root periodic daily

    30 4 * * 6 root periodic weekly

    30 5 1 * * root periodic monthly

    ```


    What happens to the daily, weekly, and monthly jobs if this system isn''

    nunning at 3:15 AM every day, at 4:30 AM on Saturday morning, and at

    5:30 AM on the first of each month? Nothing. They just don''t run.

