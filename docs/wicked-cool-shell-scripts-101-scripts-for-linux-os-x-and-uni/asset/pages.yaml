  md: "# #10 Locking Files\n\nAny script that reads or appends to a shared file, such\
    \ as a log file, needs a reliable way to lock files so that other instantiations\
    \ of the script don't accidentally overwrite data before it's done used. A common\
    \ way to accomplish this is to create a separate lock file for each file used.\
    \ The existence of a lock file serves as a semaphore, an indicator that a file\
    \ is being used by a different script and is not available. The requesting script\
    \ then repeatedly tries and tries until the semaphore lock file is removed, indicating\
    \ that the file is free to edit.\n\nLock files are tricky, because many seemingly\
    \ solutions don't actually work. For example, the following code is a typical\
    \ approach to solving this problem:\n\n```\n```\nwhile [ -f $lockfile ];\n  sleep\
    \ 1\ndone\ntouch $lockfile\n```\n```\n\nSeems like it works, doesn't it? The loops\
    \ until the lock file doesn't exist and then creates it to ensure you own the\
    \ lock and therefore modify the base file safely. If another script with the same\
    \ loop sees your, it will also spin until the lock vanishes. However, this doesn't\
    \ work in practice. Imagine what would happen if, just after the while loop exited\
    \ but before the touch was executed, that script was swapped out and put back\
    \ in the processor queue, giving another script a chance to run.\n\nIn case you're\
    \ not sure what we're referring to, remember that although your computer seems\
    \ to be doing one thing at a time, it's actually running multiple programs at\
    \ the same time by doing a bit with that, switching to another one, doing a bit\
    \ with that, and switching back. The problem here is in the time between your\
    \ script finishes checking for a lock file and when it creates its own, the system\
    \ may swap out another script, which could dutiful test for a lock file, find\
    \ it absent, and create its own version. Then that script could swap out, and\
    \ your script could swap back in to resume executing the touch command. The result\
    \ would be that both scripts now have exclusive access to the lock file, which\
    \ is exactly what we were trying to avoid.\n\nFortunately, Stephen van Berg and\
    \ Philip Gunter, authors of the email-filtering program, also created a command\
    \ line utility, lockfile, that lets you safely and reliably work with lock files\
    \ in shell scripts.\n\nMany Unix distributions, including GNU/Linux and OS X,\
    \ have lockfile already installed. You can check whether your system has lockfile\
    \ by by man 1 lockfile. If you get a man page, you're in luck! The script in Listing\
    \ 1-22 assumes that you have the lockfile command, and subsequent scripts require\
    \ the reliable locking mechanism of Script #10 to function, make sure the lockfile\
    \ command is installed on your system."
  merge: -1
