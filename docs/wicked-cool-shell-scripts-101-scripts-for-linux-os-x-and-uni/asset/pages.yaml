  md: '# #4


    # # TWEAKING UNIX


    ![](img/954a28cc04c09826495e330f44c0085b_128_0.png)


    An outsider might imagine Unix as a nice, uniform command line experience across
    many different systems, helped by their compliance with the POSIX standards. But
    anyone who''s ever used more than one Unix system knows how much they can vary
    within these broad parameters. You''d be hard-pressed to find a Unix or Linux
    box that doesn''t leave as a standard command, for example, but does your version
    support the --color flag? Does your Bourne shell support variable slicing (like
    ${var:0})?


    Perhaps one of the most valuable uses of shell scripts is tweaking your particular
    flavor of Unix to make it like other systems. Most modern GNU utilities run just
    fine on non-Linux Unixes (for example, you can replace clunky old tar with the
    newer GNU tar), often the system updates involved in tweaking Unix don''t need
    to be so drastic, and it''s possible to avoid the potential problems inherent
    in adding new binaries to a'
