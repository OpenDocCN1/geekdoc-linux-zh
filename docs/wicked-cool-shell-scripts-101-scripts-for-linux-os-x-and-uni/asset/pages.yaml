  md: 'Apart from all these tests, the trick behind getting hangman to work is to
    replace guessed letter in the original word with a dash wherever letter appears
    in the word and then compare the result to the original word in which no letters
    have been replaced by dashes ❶ If they''re different (that is, if one or more
    letters in the word are now dashes), the guessed letter is or. Guess the letter
    a, for instance, when the word is cat, will result in the guessed variable holding
    your guess with a value of ''-a''.


    One of the key ideas that makes possible to write hangman is that the partially
    filled-in word shown to the player, the partial is, rebuilt each time a correct
    guess is made. Because the variable guessed by the player, accumulates each letter
    guessed, a sed transformation translates into a dash each letter in the original
    word that is not in the guessed string does the trick ❷.


