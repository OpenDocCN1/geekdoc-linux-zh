  md: '# # 10

    INTER SERVER ADMINISTRATION


    ![](img/954a28cc04c09826495e330f44c0085b_266_0.png)


    The job of managing a web server and service is often completely separate from
    the job of designing and managing content on the website. While the previous chapter
    offered tools geared primarily web developers and other content managers, this
    chapter shows how to analyze web server log files, mirror websites, and monitor
    network health.


    # ## #73 Exploring the Apache access_log


    If you''re running Apache or a similar web server that uses the Common Log Format,
    you can do quite a bit of quick statistical analysis with a shell script. In a
    standard configuration, the server writes access_log and error_log files for the
    site (generally in /var/log, but this is system dependent). If you''ve got your
    own server, you should definitely be archiving this valuable information.'
