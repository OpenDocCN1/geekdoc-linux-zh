  md: '# #65 Building Web Pages on the Fly


    Many websites have graphics and other elements that change on a daily basis. Web
    comics like Bill Holbrook''s Kevin & Kell are a good example of this. On his site,
    the home page always features the most recent strip, and it turns out the image-naming
    convention the site uses for individual comics is easy to reverse engine, allowing
    you to include the cartoon on your own page, as Listing 8-6.


    A Word from Our Lawyers: there are a lot of copyright issues to consider when
    scraping the content from another website for your own. For this example, we received
    explicit permission from Bill Holbrook to include his comic strip in this book.
    We encourage you to get permission to reproduce any copyrighted materials on your
    own site before you dig yourself into a deep hole surrounded by lawyers.


    # The Code


    ```

    #!/bin/bash


    # kevin-and-kell--Builds a web page on the fly to display the latest

    # strip from the cartoon "Kevin and Kell" by Bill Holbrook.

    # <Strip referenced with permission of the cartoonist>


    month="$(date +%m)"

    day="$(date +%d)"

    year="$(date +%Y)"


    echo "Content-type: text/html"


    echo "<html><body bgcolor=white><center>"

    echo "<table border="0" cellpadding="2" cellspacing="1">

    necho "<tr bgcolor="#000099">

    necho "<th><font color=white>Bill Holbrook''s Kevin &amp; Kell</font></th></tr>"

    necho "<tr><td><td<img src="http://www.kevinandkell.com/2016/strips/kk20160804.jpg"></td></tr>"

    / /bin/echo -n " src="http://www.kevinandkell.com/2016/${year}/"

    echo "strips/kk${year}${month}${day}.jpg""

    echo "</td><tr><td align="center">"

    necho "echo see "

    echo "<td>&copy; Bill Holbrook. Please see "

    echo "<td><a href="http://www.kevinandkell.com/">kevinandkell.com/</a></a></td></tr>"

    echo "<td>for more strips, books, etc."

    echo "</td></tr></table></center></body></html>"


    exit 0

    ```


    Listing 8-6: The Kevin-and-kell script'
