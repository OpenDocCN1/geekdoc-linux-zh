- img_proc: true
  md: '# How It Works


    The page with the latest column has a URL that you need to extract from the home
    page, examination of the source code reveals that each column is identified in
    the source with a class="teaser" and that the most recent column is always on
    the first page. This means that the simple command sequence at ① should extract
    the URL of the latest column.


    The curl command grabs the source to the home page, the grep command outputs matching
    "teaser" line with the line immediately after, and makes it easy to grab the second
    line of the resultant output so we can pull the latest article.


