  md: '# 9


    # WEB AND INTERNET

    ADMINISTRATION


    ![](img/954a28cc04c09826495e330f44c0085b_248_0.png)


    If you''re running a web server or are responsible for a website, whether simple
    or complex, you likely find yourself performing certain tasks with great frequency,
    notably identifying broken internal and external site links. Using shell scripts,
    you can automate many of these tasks, as well as some common client/server tasks
    such as managing access information on a password-protected website directory.


    # #69 Identifying Broken Internal Links


    A few of the scripts in Chapter 7 highlighted the capabilities of the lynx text-only
    web browser, but there''s even more power hidden within this tremendous software
    application. One capability that''s particularly useful for a'
  merge: -1
  pgno: 248
- img_proc: true
  md: "web administrator is the traverse function (enabled -traversal), which causes\
    \ lynx to try to step through all links on a site to see if any are broken. This\
    \ feature can be harnessed in a short script, as Listing 9-1 details.\n\n# The\
    \ Code\n\n```\n#!/bin/bash\n\n# checklinks--Traverses all internal URLs on a website,\
    \ reporting\n# any errors in the \"traverse.errors\" file\n\n# Remove all the\
    \ lynx traverse output files upon completion.\ntrap \"rm -rf traverse2.dat\" traverse2.dat\
    \ 0\n\nif [ -z \"$1\" ]; then\necho \"Usage: checklinks URL\" >&2\n  exit 1\n\
    fi\n\nbaseurl=\"${$1 | cut -d/ -f3 | sed 's|^/\\\\\\\\''\n\nlynx -traverse -accept_all_cookies\
    \ -realm \"$1\" > /dev/null\n\nif [ -s \"traverse.errors\" ]; then\n  /bin/echo\
    \ -n $(wc -l < traverse.errors) errors encountered.\necho Checked \"$(grep '^http'\
    \ traverse.dat | wc -1) pages at ${1}\nsed \"$1|g\" < traverse.errors\nm traverse.errors\
    \ ${baseurl}.errors\necho \"A copy of this output has been saved in ${baseurl}.errors\"\
    \nelelse\n  /bin/echo -n \"No errors encountered.\"\n  echo Checked \"$(grep '^http'\
    \ traverse.dat | wc -1) pages at ${1}\"\nfi\n```\n\nListing 9-1: The checklinks\
    \ script\n\n# How It Works\n\nThe vast majority of the work in this script is\
    \ done by lynx; the script just fiddles with the resulting lynx output files to\
    \ summarize and display the data attractively. The lynx output file reject.dat\
    \ contains a list of points pointing to external URLs (see Script #70 on page\
    \ 220 for to exploit this data), traverse.errors contains a list of invalid links\
    \ (the gist of this script), traverse.dat contains a list of all pages checked,\
    \ and traverse2.dat is identical to traverse.dat except that it also includes\
    \ the title of every page visited."
  merge: -1
  pgno: 249
- img_proc: true
  md: 'The lynx command can take a lot of different arguments, and in this case we
    need to use -accept_all_cookies so that the program doesn''t stalling out asking
    whether we want to accept or reject a cookie from a page. We also use -realm to
    ensure the script only checks pages from that point on the site or "lower" in
    the tree, not every single link encounters. Without -realm, it can dig up thousands
    and thousands of pages as it traverses like a madman. When we run -traversal http://www.intuitive.com/wicked/-realm,
