  md: '# 101 TIME-SAVING, PROBLEM-SOLVING SHELL SCRIPTS


    Shell scripts are an efficient way to interact with your machine and managing
    your files and system operations. With just a few lines of code, your computer
    will exactly do what you want to. But you can also use shell scripts for many
    other essential (and not-so-essential) tasks.


    +   * Tools for renaming and applying commands to files in bulk


    +   * Image processing and editing tools


    This second edition of Wicked Cool Shell Scripts offers a collection of useful,
    customizable, and fun shell scripts for solving common problems and personalizing
    your computing environment. Each chapter contains ready-use scripts and explanations
    of how they work, why you''d want to use them, and suggestions for changing and
    expanding them. You''ll find a mix of classic favors, like a disk backup that
    keeps your files safe when your system crashes, a password manager, a weather
    tracker, and several games, as well as 23 brand-new scripts, including:


    Whether you want to save time managing your system or just find ways to go off,
    these scripts are wicked cool!


    # ABOUT THE AUTHORS


    Dave Taylor is the author of more than 20 books, as well as thousands of magazine
    and newspaper articles, and is an award-winning public speaker. He was a contributor
    to BSD 4. UNIX, and his software is included in all major UNIX distributions.


    Brandon Perry started writing C# applications with the advent of the open source
    .NET implementation Mono. In his free time, he enjoys writing modules for the
    Metasploit framework, parsing binary files, and fuzzing.


    +   * A ZIP code lookup tool that reports the city and state


    +   * A Bitcoin address information retriever


    +   * A suite of tools for working with cloud services like Dropbox and iCloud


    # COVERS THE BOURNE-AGAIN SHELL (BASH) FOR LINUX, UNIX, AND OS X


