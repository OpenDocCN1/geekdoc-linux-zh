  md: 'Table 10-1 lists the fields in an access_log file.


    # ### Table 10-1: Field Values in the access_log File


    | Column | Value |

    | --- | --- |

    | 1 | IP of host accessing the server |

    | 2–3 | Security information for HTTPS/SSL connections |

    | 4 | Date and time zone offset of the specific request |

    | 5 | Method invoked |

    | 6 | URL requested |

    | 7 | Protocol used |

    | 8 | Result code |

    | 9 | Number of bytes transferred |

    | 10 | Referrer |

    | 11 | Browser identification string |


    A typical line in access_log looks like this:


    ```

    65.255.219.126 - [04/Jul/2016:14:07:23 +0000] "GET /index.rdf HTTP/1.0" 301

    310 "-msnbot-UDiscovery/2.0b (http://search.msn.com/msnbot.htm)"

    ```


    The result (field 8) of 301 indicates that the request was success. The referrer
    (field 10) indicates the URL of the page that the user was visiting immediately
    before the page request. Ten years ago, this would have been the URL of the page
    now; now it''s generally "-", as you see here, for privacy reasons.


    The number of hits to the site can be determined by doing a line count on the
    log file, and the date range of entries in the file can be ascertained by comparing
    the first and last lines.


    ```

    $ wc -l access_log

    7836 access_log

    $ head -1 access_log ; tail -1 access_log

    69.195.124.69 - [29/Jun/2016:03:35:37 +0000] ...

    65.255.219.126 - [04/Jul/2016:14:07:23 +0000] ...

    ```


    With these points in mind, the script in Listing 10-0 produces a number of useful
    statistics from an Apache-format access_log file. This script the scriptbc and
    nicumber scripts we wrote in Chapter 1 to be in the PATH.


    # ### The Code


    ```

    #!/bin/bash

    # webaccess--Analyzes an Apache-format access_log file, extracting

    # useful and interesting statistics

    bytes_in_gb=1048576

    ```'
