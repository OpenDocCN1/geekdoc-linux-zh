  md: '# # Turning On Developer Mode


    Once you''ve enrolled in the Windows Insider Program and have the Anniversary
    version of Windows 10 installed, you''ll need to get into Developer mode. To start,
    go to Settings and search for "Developer mode." The Use Developer features section
    should come up. From here, select **Developer mode**, as shown in Figure A-1.


    ![](img/954a28cc04c09826495e330f44c0085b_373_0.png)


    Figure A-1: Enabling Developer mode in Windows 10


    When you select Developer mode, Windows might warn you that going into Developer
    mode may expose your device to harm. The warning is legit: going into Developer
    mode puts you at greater risk because you can inadvertently install programs from
    non-approved sites. However, if you can remain calm and vigilant, we encourage
    you to proceed so at at least test the bash system. After you click through, Windows
    will download and install some additional software onto your computer. This takes
    a few minutes.


    Next, you''ll have to go into the old-school, early Windows configuration area
    to enable the Windows Subsystem for Linux (It''s very cool that Microsoft even
    has a subsystem for Linux!) Get there by searching for "Turn Windows Features
    On." A window will open with a long list of features and,, with all check boxes
    (see Figure A-2).


    Don''t unchecked anything; you only need to check **Windows Subsystem for Linux
    (Beta)**. Then click **OK**.


    Your system will prompt you to restart to fully enable the Linux subsystem and
    the new developer tools. Do so.


    Appendix A'
