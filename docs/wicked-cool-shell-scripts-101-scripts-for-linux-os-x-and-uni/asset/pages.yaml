  md: '# 8


    # WEBMASTER HACKS


    ![](img/954a28cc04c09826495e330f44c0085b_230_0.png)


    In addition to offering a great environment for building nifty command line tools
    that work with various websites, shell scripts can change the way your own site
    works. You can use shell scripts to write simple debugging tools, create web pages
    on demand, or even build a photo album browser that automatically incorporates
    new images uploaded to the server.


    The scripts in this chapter are all Common Gateway Interface (CGI) scripts, generating
    dynamic web pages. As you write CGI scripts, you should always be conscious of
    possible security risks. One of the most common hacks that can catch a web developer
    unawares is an attacker accessing and exploiting the command line via a vulnerable
    CGI or other web language script.'
