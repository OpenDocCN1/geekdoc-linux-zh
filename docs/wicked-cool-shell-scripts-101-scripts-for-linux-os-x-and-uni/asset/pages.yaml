  md: "supported system. Instead, shell scripts can be used to map popular flags to\
    \ their local equivalents, to use Unix capabilities to create a smarter version\
    \ of an existing command, or even to address the longtime lack of certain functionality.\n\
    \n# #27 Displaying a File with Line Numbers\n\nThere are several ways to add line\
    \ numbers to a displayed file, many of which are quite sheer. For example, here's\
    \ one solution using awk:\n\n```\nawk '{ print NR: \"$0\"}' infile\n```\n\nOn\
    \ some Unix implementations, the cat command has an -n flag, and on others, the\
    \ more (or less, or pg) pager has a flag for specifying that each line of output\
    \ should be numbered. But on some Unix flavors, none of these methods will work,\
    \ in which case the simple script in Listing 4-1 can do the job.\n\n# ## The Code\n\
    \n```\n#!/bin/bash\n\n# numberlines--A simple alternative to cat -n, etc.\n\n\
    for filename in \"$@\"\ndo\n  linecount=\"1\"\n  while IFS=\"\\n\"\n  do\n   \
    \ echo \"${linecount}: $line\"\n    linecount=$((linecount + 1 ))\n  done < $filename\n\
    done\nexit 0\n```\n\nListing 4-1: The numberlines script\n\n# ## How It Works\n\
    \nThere's a trick to the main loop in this program: it looks like a regular while\
    \ loop, but the important part is actually done $filename. It turns out that every\
    \ major block construct acts as its virtual subshell, so this file redirection\
    \ is not only valid but also an easy way to have a loop that iterates by line\
    \ with the content of $filename. Couple that with the read statement at an inner\
    \ loop that loads each line, iteration by iteration, into the line variable—and\
    \ it's then easy to output the line with its line number as a prefix and increment\
    \ the linecount variable."
