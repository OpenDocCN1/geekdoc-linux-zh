    # # INSTALLING BASH ON WINDOWS 10


    ![](img/954a28cc04c09826495e330f44c0085b_372_1.png)


    Just as we were going to press with this book, Microsoft released the bash shell
    for Windows—and how could we publish a book on shell script programming without
    telling you about this new option?


    The wrinkle is that you need to be running not just Windows 10 but the Windows
    10 Anniversary Update (build 14393), posted August 2, 2016). You also need to
    have an x64-compatible processor and be a member of the Windows Insider Program.
    And then you can start installing bash!


    Start by joining the Insider Program at https://insider.windows.com/. It''s free
    to join and will provide you with a convenient way to update your Windows release
    to the Anniversary release. The Insider Program has a Windows 10 Upgrade Assistant
    that will prompt you to update, so use that to update to the required release.
    This might take a little while, and you''ll need to restart.'
