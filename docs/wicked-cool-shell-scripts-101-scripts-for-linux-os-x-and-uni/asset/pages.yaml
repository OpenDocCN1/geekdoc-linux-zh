  md: "The script in Listing 4-3 automates that task, making use of the shell ${#varname}\
    \ construct, which returns the length of the contents of the data stored in the\
    \ variable varname.\n\n# The Code\n\n```\n#!/bin/bash\n# toolong--Feeds the fmt\
    \ command only those lines in the input stream\n# that are longer than the specified\
    \ length\n\nwidth=72\n\nif [ ! -r \"$1\" ]; then\n    echo \"Cannot read file\
    \ \"$1\" >&2\"\n    echo \"Usage: $0 filename\" >&2\n    exit 1\nfi\nwhile read\
    \ input\ndo\n    if [ ${#input} -gt $width ]; then\n        echo \"$input\" |\
    \ fmt\n    else\n        echo \"$input\"\n    fi\ndone < $1\nexit 0\n```\n\nListing\
    \ 4-3: The toolong script\n\n# How It Works\n\nNotice the file is fed to the while\
    \ loop with a simple < $1 associated with the end of the loop and that each line\
    \ can be analyzed by reading it with read input, which assigns each line of the\
    \ file to the input variable, line by line.\n\nIf your shell doesn't have the\
    \ ${#var} notation, you can emulate it with the useful 'word count' command wc:\n\
    \n```\nvarlen=\"$(echo \"$var\" | wc -c)\"\n```\n\nHowever, wc has an annoying\
    \ habit of prefacing its output with spaces to get values to align nicely in the\
    \ output listing. To sidestep pesky problem, a slight modification is necessary\
    \ to left only digits through the final pipe, as shown here:\n\n```\nvarlen=\"\
    $(echo \"$var\" | wc -c | sed s/[^[:digit:]]//g\"\n```"
