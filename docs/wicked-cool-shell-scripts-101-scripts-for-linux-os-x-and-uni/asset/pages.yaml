    Listing 7-20: The changrack script


    # How It Works


    Given a URL and a destination email address, this script grabs the web page content
    and compares it to the content of the site from the previous check. If the site
    has changed, the new page is emailed to the specified recipient, with some simple
    rewrites to try keep the graphs and tags working. These HTML rewrites starting
    at ⊕ are worth examining.


    The call to lynx rewrites the source of the specified web page ⊕, and then performs
    three different translations. First, SRC="baseurl/" ⊕ to ensure that relative
    pathnames of the form SRC="logo.gif" are rewritten to work properly as full pathnames
    with the domain name. If the domain name of the site is http://www.intuitive.com/,
    the rewritten HTML would be SRC="http://www.intuitive.com/logo.gif". Likewise,
    href attributes are rewritten ⊕. To ensure we have rewritten anything, the third
    translation uses the baseurl out of the HTML source in situations where it''s
    erroneously broken ⊕. For example, HREF="http://www.intuitive.com/http://www.somewhere.com/link"
    is clearly broken and must be fixed for the link to work.


    Notice also that the recipient is specified in the echo state-ment (echo "To:
    $2") rather than an argument to sendmail. This is a simple security trick: by
    having the address the sendmail input stream knows to parse for recipients because
    of the -t flag, there''s no worry about users playing games with addresses like
    "joe;cat /etc/passwd|mail Larry". This is a good technique to use whenever you
    invoke sendmail within shell scripts.


    # Running the Script


    This script requires two parameters: the URL of the site being tracked (and you''ll
    need to use a fully qualified URL that begins with http:// for it to work properly)
    and the email address of the person (or, comma-separated group of people) who
    should receive the updated web page, appropriate. Or, if you''d prefer, just use
    - (a hyphen) as the email address, and the diff output will be displayed on screen.'
