  md: 'The newdeck[] array, then, is the "shuffled" deck. While in this game we ever
    use the first three cards, the general solution is far more interesting to consider
    the specific one.


    That means this script is overkill. But hey, it''s interesting. Let''s step through
    the functions to see how things work. First off, initializing the deck is really
    simple, as you can see if you flip back and initialize theDeck function.


    Similarly, shuffleDeck is surprisingly straightforward because all the work is
    really done in the pickCard function. shuffleDeck simply steps through the 52
    slots in deck[], randomly picks a value that hasn''t been picked, and saves it
    in the nth array space of newdeck[].


    Let''s look at pickCard because that the heavy lifting of the shuffle occurs.
    The function is broken into two: the first attempts to randomly pick an available
    card, giving it $threshold to succeed. As the function is called and again, the
    first calls always succeed at that, but later in the process, once 50 cards are
    already moved over into the newdeck[], it''s quite possible that 10 random guesses
    yield a fail. That''s the block of code at


    Once it occurs at $threshold, we basically give up on this strategy in exchange
    of performance and move to the second block of code: stepping through the deck
    card until we find an available card. That''s the block at


    If you think about the implications of this strategy, you''ll realize that the
    lower you set the threshold, the more likely that newdeck will be sequenced, particularly
    later in the deck. At the extreme, threshold = 1 would yield an ordered deck newdeck[]
    = deck[]. Is 10 the right value? That''s a bit beyond the scope of this book,
    but we would welcome input from someone who wanted to ascertain the best balance
    of randomness and performance!


    The showCard function is long, but most of those lines are just about making the
    results. The core of the entire deck simulation is captured in the two lines at


    For this game, suit is irrelevant, but you can see that for a given card value,
    the rank is going to be 0–12 and the suit would be 0–3. The cards'' qualities
    just need to be mapped to user-friendly values. To make debugging easy, a 6 of
    clubs has a rank 6, and an ace has rank 1. A king has a default rank of 0, but
    we adjust it to 13 to make the work.


    The dealCards function enters play: all the previous functions are dedicated to
    implementing the useful set of functions for any game. The dealCards function
    deals out of three cards required for the game, even though the third card is
