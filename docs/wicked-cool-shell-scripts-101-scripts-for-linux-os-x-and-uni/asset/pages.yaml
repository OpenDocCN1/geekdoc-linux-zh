  md: 'Because this script creates a directory in the user''s home directory it needs
    to ensure that the files aren''t suddenly readable by others simply because of
    a badly set umask value. The umask defines the default permissions for a newly
    created file or directory. To avoid oversharing, the script uses chmod to ensure
    that the directory is set to read/write for the user and is closed for everyone
    else.


    Finally the script uses basename to strip out directory information from the file''s
    path, and it adds a date-timestamp to any deleted file in the form $archived/$(date
    +"%Y%m%d.%H%M%S").$(basename "$arg")


    Notice of the use of $() elements in substitution. Though perhaps a bit complicated,
    it is nonetheless helpful. Remember, anything between ($ ) is fed into a subshell,
    where the expression is replaced by the result of that command.


    So why bother deleted files with the same name? Once the files are archived, the
    script makes no distinction between /home/oops.txt and /home/subdir/oops.txt,
    not by the times they were deleted. If multiple files with same name are deleted
    simultaneously (or within the same second), the files that were archived first
    will get overwritten. One solution to this problem would be to add the absolute
    paths of the original files to the archived filenames.


