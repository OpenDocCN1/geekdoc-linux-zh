    # ##20 Emulating Other Environments: MS-DOS


    Though it''s unlikely you''ll ever need it, it''s interesting and illustrative
    of some scripting concepts to create versions of classic MS-DOS commands, like
    DIR, as Unix-compatible shell scripts. Sure, we could just use a shell alias to
    map DIR to the Unix ls command, as in this example:


    ```

    alias DIR=ls

    ```


    But this mapping doesn''t emulate the actual behavior of the command; it just
    helps people learn new command names. If you''re hip to the ancient ways of computing,
    you''ll remember that the /w produces a wide listing format, for example. But
    if you specify /w to the ls command now, the program will complain that the /w
    directory doesn''t exist. Instead, the following DIR script in Listing 2-17 can
    be written so that it works with the forward-slash style of command flags.


    # ### The Code


    ```

    #!/bin/bash

    # DIR--Pret we''re the DIR command in DOS and displays the contents

    # of the specified file, accepting some of the standard DIR flags


    function usage

    {

    cat << EOF&2

    Usage: $0 [DIR flags] directory or directories

    Where:

    /D sort by columns

    /H show help for this shell script

    /N show long listing format with filenames on right

    /OD sort by oldest to newest

    /O-D sort by oldest

    /P pause after each screenful of information

    /Q show owner of the file

    /S recursive listing

    /W use wide listing format

    EOF

    exit 1

    }


    ###########################

    ### MAIN BLOCK


    postcmd=""

    flags=""

    ```'
