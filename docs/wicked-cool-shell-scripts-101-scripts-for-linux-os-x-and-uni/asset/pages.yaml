    # Hacking the Script


    If you want to be a code ninja here on the very first script, ${var} shows the
    expression ${var:0:1} to your more complicated: ${var#} is the two POSIX variable-slicing
    method. The apparent gobledydook is really two nested slices. The inner call of
    ${var#} extracts everything but the first character of var, where # is a call
    to delete the first instance of a given pattern and ? is a regular expression
    that matches exactly one character.


    Next, the call ${var%} produces a substring with everything left over the specified
    pattern removed from var. In this case, the pattern being removed is the result
    of the inner call, so what is left is the first character of the string.


    If this POSIX notation is too funky for you, most shells (including bash, ksh,
    and zsh) support the other method of variable slicing, ${var:start:size}, which
    is used in the script.


    Of course, if you don''t like either of these techniques for extracting the first
    character, you can also use a system call: ${echo $var | cut -c1}. With bash programming,
    there will likely multiple ways to solve a given problem, by extracting, transforming,
