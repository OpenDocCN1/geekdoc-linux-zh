  md: '# How It Works


    As is typical with a well-written script, half of Listing 1-22 is parsing input
    variables and checking for error conditions. Finally, it gets to the statement,
    and then it tries to actually use the system lockfile command. If there is one,
    it invokes it with a specified number of retries, generating its own error message
    if it does not finally succeed. What if you requested an unlock (for example,
    removal of an existing lock) and there is none? That generates another error.
    Otherwise, the lockfile is removed and you''re done.


    More specifically, the first block uses the powerful getopts function to parse
    all possible user input flags (-l, -u, -r) with a loop. This is a common way to
    use getopts, which will occur again and again in the book. Note the shift($OPTIND
    - 1 )) statement at $OPTIND is set by getopts, which lets the script keep shifting
    values down (so $2 becomes $1, for example) until it is done processing values
    with a leading dash.


    Since this script utilizes the lockfile utility, it''s good to ensure it is in
    the user''s path before invoking it, failing with an error message if that''s
    not the case. There''s a simple conditional on to see whether we''re locking or
    unlocking and the appropriate invocation to the lockfile utility in each case.


    # Running the Script


    While the lockfile script isn''t ordinarily used by itself, you can test it by
    having two windows open. To create a lock, simply specify the name of the file
    you want to lock as an argument of filelock. To remove the lock, run the script
    again with the -u flag.


    # The Results


    First, create a locked file as Listing 1-23 shows.


    ```

    $ filelock /tmp/exclusive.lck

    $ ls -l /tmp/exclusive.lck

    -r--r-- 1 taylor wheel 1 Mar 21 15:35 /tmp/exclusive.lck

    ```


    Listing 1-23: Creating a file lock with the filelock command


    The second time you attempt to lock the file, filelock tries the default number
    of times (10) and then fails (shown in Listing 1-24):


    ```

    $ filelock /tmp/exclusive.lck

    filelock : Failed: Couldn''t create lockfile in time.

    ```


    Listing 1-24: The filelock command failing to create a lock file


    When the first process is done with the file, you can release the lock,

    Listing 1-25 details.'
