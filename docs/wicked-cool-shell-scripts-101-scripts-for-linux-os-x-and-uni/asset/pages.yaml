    Listing 10-3: The searchinfo script


    # How It Works


    The main for loop of this script extracts all entries in the log file that has
    a valid referrer string greater than 4, a referrer domain that does not match
    the $host variable, and a ? in the referrer string, indicating that a user search
    performed.


    The script then tries to identify the domain name of the referrer and the search
    value entered by the user. An examination of hundreds of search queries shows
    that common search sites use a small number of common variable names. For example,
    search on Yahoo! and your search string is pattern. Google and MSN use q as the
    search variable. The grep invocation contains p, q, and the other most common
    search variable names.


    The invocation of sed cleans up the search patterns, replacing + and $2 sequences
    with chopping out quotes, and the command words returns everything that occurs
    after the first equal sign. In other words, the code returns just the search terms.


    The conditional immediately following these lines tests whether the args variable
    is empty. If it is (that is, if the query format isn''t a known format), then
    it is a search engine we haven''t seen, so we output the entire pattern rather
    than a cleaned-up, pattern-only value.


