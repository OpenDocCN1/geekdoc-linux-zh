    # # Adding Users to the System


    If you''re responsible for managing a network of Unix or Linux systems, you''ve
    already experienced the frustration caused by subtle incompatibilities among the
    different operating systems in your domain. Some of the most basic administration
    tasks prove to be the most incompatible across different flavors of Unix, and
    among these tasks is user account management. Rather than having a single command
    line interface that is 100 percent consistent across all Linux flavors, each vendor
    has developed its own interface for working with the peculiarities of its system.


    The Simple Network Management Protocol (SNMP) was ostensibly supposed to normalize
    this sort of thing, but managing user accounts is just as difficult as it was
    a decade ago, particularly in a heterogeneous computing environment. As a result,
    a very helpful set of scripts for a system administrator includes a verifier,
    suspender, and deleter that can be customized for your specific needs and then
    easily ported to all of your systems. We''ll show you how to adder and cover suspender
    in the next two scripts.


