  md: "# #83 Unramble: A Word Game\n\nThis is a basic anagram game. If you've seen\
    \ the fumble game in your newspaper or played word games at all, you'll be familiar\
    \ with the concept: a word is picked at random and then scrambled. Your task is\
    \ to figure out what the original word is in the minimum number of turns. The\
    \ full script for this game is in Listing 12-1, but to get the word list, you'll\
    \ also need to download the long-words.txt file from the book's resources http://www.nostarch.com/wcss2/\
    \ and save it in the directory /usr/lib/games.\n\n# The Code\n\n```\n!/bin/bash\n\
    # unramble--Pics word, scrambles it, and asks the user to guess\n# what the original\
    \ word (or phrase) was\n\nwordlib=\"/usr/lib/games/long-words.txt\"\n\nscrambleword()\
    \ {\n    # Pick a word randomly from the wordlib and scramble it.\n    # Original\
    \ word is $match, and scrambled word is $scrambled.\n\n    match=$$(randomquote\
    \ $wordlib)\n\n    cho \"Picked out a word!\"\n\n    len=${#match}\n    scrambled=\"\
    \"; lastval=1\n\n    for (( val=1; $val < $len; ));\n    do\n        if [ $((RANDOM\
    \ % 2 )) -eq 1 ]; then\n            scrambled=$scrambled$$(echo $match | cut -c$val)\n\
    \        else\n            scrambled=$$(echo $match | cut -c$val)$scrambled\n\
    \        fi\n        val=$$( $val + 1 ))\n    done\n}\n\nif [ -r $wordlib ]; then\n\
    \    echo \"$0: Missing word library $wordlib\" >&2\n    echo \"(online: http://www.intuitive.com/wicked/examples/long-words.txt)\\\
    \ >&2\n    echo \"save the file as wordlib and you're ready to play!\" >&2\n \
    \   exit 1\nfi\n\nnewgame=\"\"; guesses=0; correct=0; total=0\nuntil [ \"$guess\"\
    \ = \"quit\" ]; do\n    scrambleword\n```"
