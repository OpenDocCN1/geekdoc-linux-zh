  md: '# #66 Turning Web Pages into Email Messages


    By combining the method of reverse engineering file-naming conventions with the
    website-tracking utility shown in Script #62 on page 194, you can email yourself
    a web page that updates not its content but also its file-name. This script does
    not require the use of a web server to be useful and can run just like the scripts
    we have written so far in the book. A word of caution, however: Gmail and other
    email providers may filter emails sent from a local Sendmail utility. If you do
    not receive the emails from the following script, try using a service like Mailinator
    (http://mailinator.com/) for testing purposes.


    # The Code


    As an example, we''ll use The Straight Dope, a witty column Cecil Adams writes
    for the Chicago Reader. It''s straightforward to have the new Dope column automatically
    emailed to a specified address, as Listing 8-7


    ```

    #!/bin/bash


    getope --Grabs the latest column of "The Straight Dope."

    # Set it up cron to run every day, if so inclined.


    now=$(date +%Y%m%%d) \

    start="http://www.straightdope.com/"

    to="testing@yourdomain.com" # Change this as appropriate.


    # First, get the URL of the current column.


    URL="$(curl -s "$start") | \

    grep -A1 ''teaser'' | sed -n ''2p'' | \

    cut -d -f2 | cut -d -f1"


    # Now, armed with that data, produce the email.


    cat << EOF

    Subject: The Straight Dope for $(date "+%A, %B, %Y")

    From: Cecil Adams <dont@reply.com>

    Content-type: text/html

    To: $sto


    EOF


    curl "$URL"

    )| /usr/sbin/sendmail -t


    exit 0

    ```


    Listing 8-7: The getscope script'
  merge: -1
