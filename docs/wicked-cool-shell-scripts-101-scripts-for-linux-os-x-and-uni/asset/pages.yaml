    # #90 Syncing Dropbox


    With a cloud-based system like Dropbox, it''s a no-brainer to write a script that
    lets you keep a folder or set of files in sync. Dropbox works by keeping everything
    in the Dropbox directory synchronized between local and cloud-based copy, by emulating
    a hard drive on the system.


    The script in Listing 13-3, syncdropbox, takes advantage of that fact by offering
    an easy way to copy a directory full of files or a specified set of files into
    the Dropbox universe. In the former instance, a copy of every file in the directory
    will be copied over; in the latter, a copy of every file specified will be dropped
    into the sync folder on Dropbox.


    # The Code


    ```

    #!/bin/bash

    # syncdropbox--Synchronize a set of files or a specified folder with Dropbox.

    # This is accomplished by copying the folder into ~Dropbox or the set of

    # files into the sync folder in Dropbox and then launching Dropbox.app

    # as needed.

    ```'
