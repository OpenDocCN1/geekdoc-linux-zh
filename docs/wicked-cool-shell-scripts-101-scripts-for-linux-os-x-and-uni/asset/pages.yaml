    \  x ) command=$OPTARG ;;\n        i ) inputdir=$OPTARG ;;\n        ? ) printHelp\n\
    \    esac\ndone\n```\n\n```\nif [[ -z $procs || -z $command ]];\nthen\n    echo\
    \ \"Invalid arguments\"\n    printHelp\nfi\n```\n\n```\ntotal=$$(ls $inputdir\
    \ | wc -l)\nfiles=$$(ls -sr $inputdir)\n\nfor k in $(seq 1 $procs);\ndo\n    for\
    \ i in $(seq 0 $procs);\ndo\n        if [[ $(((i+k)) -gt $total ]];];\nthen\n\
    \            wait\n            exit 0\n        fi\ndone\n```\n\n```\nfile=$$(echo\
    \ \"$files\" | sed \"\\$expr \\$i + \\$k\\;d\")\necho \"Running $command $inputdir/$file\"\
    \n$command \"$inputdir/$file\"&\n```\n\nwait\ndone\n\nListing B-3: The bulkrun\
    \ script\n\n# How It Works\n\nThe bulkrun script takes three arguments: the maximum\
    \ number of processes to run at any time, the directory containing the files to\
    \ run on, and the command to run (suffixed with the filename). After going through\
    \ the arguments supplied by the user with getopts, the script checks that the\
    \ user supplied these three arguments. If any of the proc, command, or inputdir\
    \ variables are undefined after processing the user arguments, the script prints\
    \ an error message and the help text then exits."
