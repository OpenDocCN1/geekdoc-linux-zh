    course, but there''s also something interesting being able to pinpoint where a
    photograph was taken. Unfortunately, while ImageMagick''s identify tools lets
    you extract GPS information, the format of the data makes it hard to read:


    ```

    exif:GPSLatitude: 40/1, 4/1, 1983/100

    exif:GPSLatitudeRef: N

    exif:GPSLongitude: 105/1, 12/1, 342/100

    exif:GPSLongitudeRef: W

    ```


    The information shown is in degrees, minutes, and seconds—which makes sense—but
    the format is nonintutive, particularly since the format that a site like Google
    Maps or Bing Maps expects more akin to this:


    ```

    40 '' 19.83" N, 105 12'' 3.42" W

    ```'
