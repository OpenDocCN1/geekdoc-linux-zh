  md: '# 13


    # WORKING WITH THE CLOUD


    ![](img/954a28cc04c09826495e330f44c0085b_330_0.png)


    One of the most significant changes in the last decade has been the rise of the
    internet as an appliance, and most notable is internet-based data storage. First
    it was used just for backups, now with the concurrent rise of mobile technology,
    cloud-based storage is useful for day-to-day disk usage. Apps that use the cloud
    include music libraries (iCloud for iTunes) and file archives (OneDrive on Windows
    systems and Google Drive on Android devices).


    Some systems are now completely built around the cloud. One example is Google''s
    Chrome operating system, a complete working environment built around a web browser.
    Ten years ago, what would have sounded daft, but when you think about how much
    time you spend in your browser nowadays... well, no one in Cupertino or Redmond
    is laughing anymore.


    The cloud is ripe for shell script additions, so let''s jump in. The scripts in
    this chapter will focus mainly on OS X, but the concepts can be easily replicated
    on Linux or other BSD systems.'
