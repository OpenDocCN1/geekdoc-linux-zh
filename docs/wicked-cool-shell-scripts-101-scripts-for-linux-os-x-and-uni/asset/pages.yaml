  md: 'Fortunately, simplifying life for Linux system administrators (the goal for
    this chapter) is one of the most common uses of shell scripts. In fact, quite
    few Linux commands are actually shell scripts, and many of the most basic tasks,
    like adding users, analyzing disk usage, and managing the filespace of the guest
    account, can be accomplished more efficiently with short scripts.


    What''s surprising is that many system administration scripts are no more than
    20 to 30 lines long. Heck, you can use Linux to identify scripts and run a pipe
    to figure out how many lines each contains. Here are the shortest scripts in /usr/bin/.


    ```

    $ file /usr/bin/* | grep "shell script" | cut -d - -fi | xargs wc -1 \\

    sort | head -15

    3 zcmp

    3 zgrep

    3 zgrep

    4 mkdir

    5 pydoc

    7 sgmlwhich

    8 batch

    8 ps2pdf12

    8 ps2pdf13

    8 ps2pdf14

    8 timed-read

    9 timed-run

    10 c89

    10 c99

    10 neqn

    ```


    None of the shortest 15 scripts in the /usr/bin/ directory are longer than 10
    lines. And at 10 lines, the equation-formatting script eqn is a fine example of
    how a little shell script can really improve the user experience:


    #!/bin/bash

    # Provision of this shell script should not be taken to imply that use of

    # GNU eqn with groin -Tascii|-Tlatini|-Tutf8|-Tcp1047 is supported.


    ```

    ${GROFF_BIN_PATH:=/usr/bin}

    PATH=$GROFF_BIN_PATH:$PATH

    export PATH

    exec eqn -Tascii($1+"$@")

    ```


