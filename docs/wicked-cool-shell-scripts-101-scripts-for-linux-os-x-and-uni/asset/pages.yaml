    \ at a time. For example, if you decide to be flexible by using the PAGER setting\
    \ to display script output instead of using your system's default paging program\
    \ (common values would be more or less programs), how do you ensure that the PAGER\
    \ environment variable is set to a valid program?\n\nThis first script addresses\
    \ how to test a given program can be found in your user's PATH. It's also a good\
    \ demonstration of a number of different shell-scripting techniques, including\
    \ script functions and variable slicing. Listing L1 shows how you can verify that\
    \ paths are valid.\n\n# The Code\n\n```\n#!/bin/bash\n inpath--Verifies that a\
    \ specified program is either valid as\n# or can be found in the PATH directory\
    \ list\n\nin_path()\n{\n    # Given a command and the PATH, tries to find the\
    \ command. Returns 0 if\n    # found and executable; 1 if not. Note that this\
    \ temporarily modifies\n    # the IFS (internal field separator) but restores\
    \ it upon completion.\n\n    ourpath=$2 result=1\n    oldIFS=$IFS IFS=\"\"\n\n\
    \    for directory in \"$ourpath\"\n    do\n        if [ -x $directory/$cmd ];\
