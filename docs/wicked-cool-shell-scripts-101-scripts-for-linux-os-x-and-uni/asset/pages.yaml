  md: '# How It Works


    For this script to work correctly, you''ll want to create a master set of template
    files and directories in the guest home directory, tucked into a new directory
    called .template. Change the permissions of the .template directory to be read-only
    and ensure that all the files and directories within .template have the proper
    ownership and permissions for user guest.


    # Running the Script


    A logical time to run the fixquest script is at logout, invoking it in the .logout
    file (which works with most shells, though not all). Also, it''ll doubtless save
    you lots of complaints from users if the login script outputs a message like this
    one:


    Notice: All files are purged from the guest account immediately upon logout, so
    please don''t save anything here you need. If you want to save something, email
    it to your main account instead. You''ve been warned!


    However, because guest users might be savvy enough to tinker with the .logout
    file, it would be worthwhile to invoke the fixquest script from cron too. Just
    make sure no one is logged into the account when it runs!


    # The Results


    There are no visible results from running this program, except that the guest
    home directory is restored to mirror the layout and files in the .template directory.'
