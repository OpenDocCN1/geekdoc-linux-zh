    # How It Works


    At this point in the book, most of the script is probably clear, but let''s have
    a closer look at the math and regular expressions that do all the work. "Math
    first," as most school-age children would undoubtedly not appreciating here! Here
    is the formula for converting degrees Fahrenheit to degrees Celsius:


    > C = \frac{(F-32)}{1.8}


    Converted into a sequence that it can be fed and solved, it looks like the code
    at. The reverse conversion, Celsius to Fahrenheit, is at. The script also converts
    the temperature from Celsius to Kelvin. This script demonstrates one reason to
    use mnemonic variable names: it makes the code a lot easier to read and debug.


    The other bits of code here are interesting the regular expressions, which of
    is exactly the one at What we''re doing is pretty straightforward, if you can
    wrap the substitution. Substitutions look like old/new; the old pattern is zero
    or more occurrences of -, followed by any of the set of digits (recall that [:digit:]
    matches zero or more occurrences of the previous pattern). The new pattern then
    what we want to replace the old pattern with, and in this case it is simply //
    which signifies an empty pattern; this pattern is useful when you just want to
    remove the old one. This substitution effectively removes all the digits so that
    inputs like -31f turn into just f, giving us the type of units. Finally, the tr
    command normalizes everything to uppercase so, for example -31f turns into F.'
