  md: '# #22 A Remainder Utility


    Windows and Mac users have appreciated simple utilities like Stickies for years,
    the streamlined applications that let you keep tiny notes and reminders stuck
    on your screen. They''re perfect for jotting down phone numbers or other reminders.
    Unfortunately, there''s no analog if you want to take notes while working on a
    Unix command line, but the problem is easily solved with this pair of scripts.


    The first script, remember (shown in Listing 3-1), lets you easily save snippets
    of information into a single rememberfile in your home directory. If invoked without
    any arguments, it reads standard input until the end-of-file sequence (^D) is
    given by pressing CTRL-D. If invoked with arguments, it just saves those arguments
    directly to the data file.


    The other half of this duo is remind, a companion shell script shown in Listing
    3-2, which either displays the contents of the whole rememberfile when no arguments
    are given or displays the results of searching through it using the arguments
    as a pattern.


    # ## The Code


    ```

    #!/bin/bash


    # An easy command line-based reminder pad


    rememberfile="$HOME/.rememberfile"


    if [ $ -eq 0 ]; then

    # Prompt the user for input and append whatever they write to

    # the rememberfile.

    echo "Enter note, end with ^D:"

    cat >> $rememberfile

    else

    # Append any arguments passed to the script to the .rememberfile file.

    echo "$@" $rememberfile

    fi

    ```


    Listing 3-1: The remember shell script


    Listing 3-2 details the companion script, remindme.


    ```

    #!/bin/bash


    # remind--Searches a data file for matching lines, or no

    # argument is specified, shows the entire contents of the data file


    rememberfile="$HOME/.remember"


    if [ ! -f $rememberfile ]; then

    echo "$0: You don''t have a .remember file. " >&2

    echo "To remedy this, please use ''remind'' to add reminders" >&2

    ```'
