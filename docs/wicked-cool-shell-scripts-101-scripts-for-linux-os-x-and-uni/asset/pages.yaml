    # #39 Implementing a Secure locate


    The locate script, Script #19 on page 68, is useful but has a security problem:
    if the build process is run as root, it builds a list of all files and directories
    on the entire system, regardless of owner, allowing users to see directories and
    filenames that they wouldn''t have permission to access. The build process can
    be run as a generic user (as OS X does, running locatedb as nobody), but that''s
    not right, because you want to be able to locate file anywhere in your directory
    tree, regardless of whether nobody has access to those particular files and directories.


    One way to solve this dilemma is to increase the database so that each entry has
    an owner, group, and permissions string. Then the mlocateddb itself remains insecure,
    unless the locate script is run as either a setid or setgid script, and that''s-to
    be avoided at all costs in the interest of system security.


    A compromise is to have a separate locatedb for each user. This isn''t too bad
    of an option, because a personal database is needed only for users who actually
    use the locate command. Once invoked, the system creates a locatedb file in the
    user''s home directory, and a cron job can update locatedb files nicely to keep
    them in sync. The first time someone runs the secure locate script, it outputs
    a message warning that they may see only matches for files that are publicly accessible.
    Starting the very next day (depending on the cron schedule), the users get their
    personalized results.


