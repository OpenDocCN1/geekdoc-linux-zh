    # Hacking the Script


    Some jobs shouldn''t be run more than once a week or once a month, there really
    be some sort of check in place to ensure they aren''t run often. Furthermore,
    the recurring system jobs might run well from cron, so we can''t make a blanket
    assumption that if cron hasn''t run, the jobs haven''t run.


    One solution would be to create three empty timestamp files, one for each daily,
    weekly, and monthly jobs, and then add new entries to the /etc/daily, /etc/weekly,
    and /etc/monthly directories that update the last-modified date of each timestamp
    file with. This would solve half the problem: cron could check the last time the
    cron job was invoked and quit if an insufficient amount of time had passed to
    justify the job being run again.


    The situation this solution doesn''t handle is this: six weeks after the monthly
    cron job last run, the admin cron invoke the monthly jobs. After four days later,
    someone forgets to shut off their computer, and the monthly cron is invoked. How
    can that job know it''s not necessary to run the monthly jobs after all?


    Two scripts can be added to the appropriate directory. One script must run from
    run-script or periodic (the standard ways to invoke cron jobs) and then turn the
    executable on all other scripts in the directory, which turns the executable back
    on after run-script or periodic has scanned and ascertained that there''s nothing
    to do: none of the files in the directory appear to be executable, and therefore
    cron doesn''t run them. This is not a great solution, however, because there''s
    no guarantee of script evaluation order, and if we can''t guarantee the order
    in which the new scripts will be run, the entire solution fails.'
