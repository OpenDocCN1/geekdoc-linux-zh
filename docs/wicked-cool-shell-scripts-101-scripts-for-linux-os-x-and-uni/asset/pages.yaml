    # # How It Works


    For a full system backup, the pax command at ❶ and ❷ does all the work, piping
    its output to a compression program (bzip2) by default and then to an output file
    or device. An incremental backup is a bit trickier, because the standard version
    of tar does not include any sort of modification time test, unlike GNU version
    of tar. The list of files modified since the previous backup is built with find
    and save in the inclist temporary file. That file, emulating the tar output format
    for increased portability, is then fed to pax directly.


    Choosing to mark the timestamp for a backup is an area in which many backup programs
    get messed up, marking the "backup time" when the program finished rather than
    when it started. Setting the timestamp to the time of backup completion can be
    a problem if any files are modified during the backup process, which becomes more
    likely as individual backups take longer to complete. Files modified under this
    scenario would have a last-modified date older than the timestamp, they would
    not be backed up the next time an incremental backup is run, which would be bad.


    But hold on, setting the timestamp to before the backup takes place is wrong too
    if the backup fails for some reason, there''s no way to reverse the updated timestamp.


    Both of these problems can be avoided by saving the date and time before the backup
    starts (in the timestamp variable) but waiting to apply the value of $timestamp
    $tsfile using the -t flag to touch only after the backup has succeeded. Subtle,
    eh?


    # # Running the Script


    This script has number of options, all of which can be ignored to perform the
    default incremental backup based on which files have been modified since the time
    the script was run (that is, the timestamp from the last incremental backup).
    Starting parameters allow you to specify a different output file or device (-o
    output), to choose a full backup (-f), to actively choose an incremental backup
    (-i) even though it is the default, or to prevent the timestamp file from being
    updated in the case of an incremental backup (-n).


    # # The Results


    The backup script requires no arguments and is simple to run, as Listing 6-17
    details.


