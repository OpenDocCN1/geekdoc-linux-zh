    # # OS X SCRIPTS


    ![](img/954a28cc04c09826495e330f44c0085b_292_1.png)


    One of the most important changes in the world of Unix and Unix-like operating
    systems was the release of the completely rewritten OS X system, built atop a
    reliable Unix core called Darwin. Darwin is an open source Unix based on BSD Unix.
    If you know your Unix at, the first time you open the Terminal application in
    OS X, you''ll doubtless swoon with delight. Everything you want, from development
    tools to standard Unix utilities, is included in the latest generation of Mac
    computers, with a gorgeous GUI capable of hiding all that power for people who
    aren''t ready for it.


    There are significant differences between OS X and Linux/Unix, however, so it''s
    good to learn some OS X tweaks that can help you in your day-to-day interaction.
    For example, OS X has an interesting command line'
