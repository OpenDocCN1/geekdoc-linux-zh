  md: "# #95 Watermarking Images\n\nIf you're looking to protect your images and other\
    \ content when you post online, you're bound to be disappointed. Anything inline\
    \ is open to copying, no matter if you have a password, a strong copyright notice,\
    \ or even add code to your website that tries to inhibit users from saving individual\
    \ images. The fact is that for a computer to be able to render online, it has\
    \ to use the image buffer on the device, and that buffer can then be duplicated\
    \ by a screen capture or similar tool.\n\nBut all is not lost. You can do two\
    \ things to protect your online images. One is to post small image size samples.\
    \ Look at professional photographers' sites and you'll see what we mean. They\
    \ usually share only thumbnails because they want you to buy the larger image\
    \ file.\n\nWatermarking is another solution, though some artists balk the work\
    \ of adding a copyright image or other identifying information directly to the\
    \ photograph. But with ImageMagick, adding watermarks is easy, even in bulk, as\
    \ shown in Listing 14-3.\n\n# ## The Code\n\n```\n#!/bin/bash\n# watermark--Adds\
    \ specified text as a watermark on the input image,\n# saving the output as image=wm\n\
    \nwmfile=/tmp/watermark.$\\$\\$                      # Should be a starting arg\n\
    fsize=\"44\"\n\ntrap \"$\\$(which rm)\\ -f \"$wmfile\" 0 1 15      # No temp file\
    \ left behind\n\nif [ $# -ne 2 ]; then\n    echo \"Usage: $(basename $0) imagefile\
    \ \\\"watermark text\\\"\" >&2\n    exit 1\nfi\n\n [ ! -r \"$1\" ]; then\n   \
    \ echo \"$(basename $0): Can't read input image $1\" >&2\n    exit 1\nfi\n```\n\
    \n# To start, get the dimensions of the image.\n# dimensions=\"$\\$(identify -format\
