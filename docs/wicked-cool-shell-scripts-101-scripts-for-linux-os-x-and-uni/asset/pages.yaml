    # It Works


    There''s a lot working together for this script to function. Not only do you need
    to have your Apache web server configuration (or equivalent) correct, but you
    need to have the correct entries in the .htaccess file, and you need an .htpasswd
    file with at least an entry for the admin user.


    The script itself extracts the htpasswd file from the .htaccess file and a variety
    of tests to sidestep common .htpasswd error situations, including if the script
    is unable to write to the file. All of this occurs before the main block of the
    script, the case statement.


    # Processing Changes to .htpasswd


    The case statement decides which of three actions is requested—A to add a user,
    U to update a user record, and D to delete a user—and invokes the correct segment
    of code accounting. The action on which to perform the action are specified in
    the QUERY_STRING variable. This variable is set by the web browser to the server
    in the URL as a=X&u=Y, where X is the action code and Y is the specified username.
    When a password is being changed or a user is being added, a third argument, p,
    is needed to specify the password value.


    For example, let''s say we are adding a new user joe with the password knife.
    This action results in the following QUERY_STRING sent to the script from the
    web server:


    ```

    a=joe&knife

    ```


    The script wraps this, setting the action variable to the value A, user to joe,
    and pass to knife. It then uses it to ensure that the password contains only alphanumeric
    characters.


    Finally, if all is well, it invokes the htpasswd program to encrypt the password
    and add it to the .htpasswd file. In addition to processing changes to the .htpasswd
    file, this script also produces an HTML table that lists each user in the .htpasswd
    file, with a [delete] link.


    After producing three lines of HTML output for the heading of the table, the script
    continues to read the name and password pairs from the .htpasswd file using the
    trick of changing the input separator separator (IFS) to a colon and changing
    the IFS back when it''s done.


