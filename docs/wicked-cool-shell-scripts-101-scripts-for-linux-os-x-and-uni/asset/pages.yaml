  md: '# #43 Validating the User Environment


    Because people migrate their login, profile, and other shell environment customizations
    from one system to another, it''s not uncommon for these settings to progressively
    decay; eventually, the PATH can include directories that aren''t on the system,
    the PAGER can point to a nonexistent binary, and worse.


    A sophisticated solution to this problem is to first check the PATH to ensure
    it includes only valid directories on the system, and then check each of the key
    helper application settings to ensure that they''re either indicating a fully
    qualified file that exists or are specifying a binary that''s in the PATH. This
    is detailed in Listing 5-21.


    # The Code


    ```

    #!/bin/bash

    # validator--Ensures that the PATH contains only valid directories

    # and then checks that all environment variables are valid.

    # Looks in SHELL, HOME, PATH, EDITOR, MAIL, and PAGER.


    errors=0

    source library.sh # This contains Script #1, the in_path() function.


    validate() {

    varname=$1

    varvalue=$2


    if [ -z $varvalue ]; then

    if [ "\$${varvalue%$(varvalue#*)}"" = "/" ]; then

    if [ -x $varvalue ]; then

    echo "**\$varname set to $varvalue, but I cannot find executable."

    ((errors++))

    else

    if in_path $varvalue $PATH; then

    echo "**\$varname set to $varvalue, but I cannot find it in PATH."

    errors=\$$(errors + 1))

    fi

    fi

    }


    # BEGIN MAIN SCRIPT

    # ==============

    ```


