    $ daysuntil 12 25 2025

    There are 3506 days until the date 12/25/2025.

    ```


    Preparing for the tricentennial in the United States? Here''s how many days you
    have left:


    ```

    $ daysuntil 7 4 2076

    There are 2196 days until the date 7/4/2076.

    ```'
