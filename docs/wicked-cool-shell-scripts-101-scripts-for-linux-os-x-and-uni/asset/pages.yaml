- img_proc: true
  md: 'application open called, which allows you to launch graphical applications
    from the command line. But open isn''t very flexible. If you want to open, say,
    Microsoft Excel, entering open excel won''t work because it is picky and expects
    you to enter open -a "Microsoft Excel". Later in this chapter, we''ll write a
    wrapper script to work around this picky behavior.


    # FIXING OS X LINE END


    There''s another occasional situation that''s made easier with a small tweak.
    If you work on the command line with files created for the GUI side of the Mac,
    you''ll find that the end-of-line character in these files isn''t the same as
    the character you need when working on the command line. In technical parlance,
    OS X systems have end-of-line carriage returns (using \r n), while the Unix side
    wants line feeds (n). So instead of output in which each line is displayed one
    after the other, a Mac file will show up in the Terminal without the proper line
    breaks.


    Have a file that''s suffering from this problem? Here''s what you''d see if you
    use cat to cut out the file contents.


    ```

    $ cat mac-format-file.txt

    ```


    Yet you know that the file is not empty. To see that there''s content, use the
    -v flag to cat, which makes all otherwise hidden control characters visible.

    Now you see something like this:


    ```

    $ cat -v mac-format-file.txt

    Rain in Spain^Mfalls mainly on^Mthe plain.^MNo kidding. It does.^M $

    ```


    Clearly there is something wrong! Fortunately, it''s easy to use tr to replace
    the carriage returns with the proper newlines.


    ```

    $ tr ''\r'' ''\'' < mac-format-file.txt > unix-format-file.txt

    ```


    Once this is applied to the sample file, things make more sense.


    ```

    $ tr ''\r'' ''\'' < mac-format-file.txt

    Rain in Spain

    falls mainly on

    tplain.

    No kidding. It does.

    ```'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'If you open a Unix file in a Mac application like Microsoft Word and it looks
    all wonky, you can also switch end-of-line characters in the other direction—toward
    an Aqua application.


    ```

    $ tr ''\n'' ''\r'' unifile.txt > macfile.txt

    ```


    Well, that''s just one of the little differences you''ll see in OS X. We''ll have
    to deal with these quirks, but we''ll also be able to take advantage of OS X''s
    nicer features.

    Let''s jump in, shall we?


    # #79 Automating screencapture


    If you''ve used a Mac for any length of time, you''ve learned that it has a built-in
    screen capture capability that you access by pressing-SHIFT-3. You can also use
    the OS X utilities Preview or Grab, located in the Applications and Utilities
    folders, respectively, and there are excellent third-party choices too.

    Did you know that there''s a command line alternative? The useful program screencapture
    can take shots of the current screen and save them to the Clipboard or to a specified
    file (in JPEG or TIFF format). Enter the command with an undefined argument and
    you''ll see the basics of its operation, as shown here:


    ```

    $ screencapture -option -- h

    usage: screencapture: illegal option [-icmpmwwskScUoa] [files]

    -C force screen capture to go to the clipboard

    -C capture the cursor as well as the screen. only in non-interactive modes

    -d display errors to the user graphically

    capture screen interactively, by selection or window

    control key - causes shot to go to clipboard

    space key - toggle between selection and

    window selection modes

    escape key - cancels inactive screen shot

    -m only the main monitor, undefined if -i is set

    -M screen capture output will go to a new Mail message

    in window capture mode, do not capture the shadow of the window

    -P screen capture output will open in Preview

    -s only mouse mouse selection mode

    -S in window capture mode, capture the screen not the window

    -t<format> image format to create, default is png (other options include pdf,
    jpg, tiff and other formats)

    -T<seconds> Take the picture after a delay of <seconds>, default is 5

    ```'
