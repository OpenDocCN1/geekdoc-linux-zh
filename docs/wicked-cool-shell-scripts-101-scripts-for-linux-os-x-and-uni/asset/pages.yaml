  md: 'Using the terminal to interact with your system may seem like a daunting task.
    Over time, though, it becomes more natural to just open a terminal to make a quick
    system change than move your mouse around in after menu, trying to find the options
    you want to change.


    # Running Commands


    Bash''s core ability is to run commands on your system. Let''s try a quick "Hello
    World" example. In a bash shell, the echo command displays text to the screen,
    so:


    ```

    $ echo "Hello World"

    ```


    Enter this on the bash command line and you''ll see the words Hello World displayed
    onscreen. This line of code runs the echo command that stored in your standard
    bash library. The directories that bash will search for these standard commands
    are stored in an environment variable PATH. You can use echo with the PATH variable
    to see its contents, as Listing 0-1


    ```

    $ echo $PATH

    /users/bperry/.rvm/gems/ruby-2.1.5/bin:/users/bperry/.rvm/gems/ruby-2.1.5/global/bin:/users/bperry/.rubies/ruby-2.1.5/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/MacGPG2/bin:/Users/bperry/.rvm/bin

    ```


    Listing 0-1: Printing the current PATH environment variable


    > In listings that show both input commands and output, the input commands will
    be shown in bold and start with a $ to differentiate them from output.


    The directories in this output are separated from one another by a colon. These
    are all the directories that bash will check when you ask it to run a program
    or command. If your command is not stored in any of these directories, bash cannot
    run it. Also, note that bash will check these directories in the order they appear
    in the PATH. This order is important because it may make a difference if you have
    two commands of the same name in two directories in your PATH. If you''re having
    trouble finding a particular command, you can use the echo with the name of that
    command to see its PATH in the shell, as in Listing 0-2.


    ```

    $ which ruby

    /users/bperry/.rvm/rubies/ruby-2.1.5/bin

    $ which echo

    /bin/echo

    ```


    Listing 0-2: Using which to find a command in PATH'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'Now Armed with this information, you could move or copy the file in question
    to one of the directories listed by the echo $PATH command, as in Listing 0-1,
    and then the command will run. We use which throughout the book to determine the
    full path to commands. It''s a useful tool for debugging a broken or weird PATH.


    # Configuring Your Login Script


    Throughout the book, we will be writing scripts that we will then use in other
    scripts, being able to call your new scripts is important. You can configure your
    PATH variable so that your custom scripts are automatically callable, just like
    any other command, when you start a new command. When you open a command shell,
    the first thing it does is read a login script in your home directory (/Users/<username>
    or /home/<username> in OS X or Linux, respectively) and execute any command it
    finds. The script will be .login, .bash, or .bash_profile, depending on your system.
    To find out which of these files is the login script, add a line like the following
    to each file:


    ```

    echo this is .profile

    ```


    Tweak the word to match the name of the file and then log in. The line should
    be printed at the top of the terminal window, reporting which script was run at
    login. If you open a terminal and see this is .profile, you know the .profile
    file is being loaded for your shell environment; if you see this is .bashrc, you
    know it''s the .bashrc file; and so on. And now you know! This behavior can change,
    depending on your shell.


    You can alter the login script so it configures your PATH variable with other
    directories. You can also set all kinds of bash settings, changing how the prompt
    looks to setting a custom PATH to any number of other customizations. For instance,
    let''s use the cat command to take a look at a customized .bashrc login script.
    The cat command takes a filename as an argument and prints the contents of the
    file to the console screen, as shown in Listing 0-3.


    ```

    $ ~/.bashrc

    export PATH=$PATH:$HOME/.rvm/bin # Add RVM to PATH for scripting.

    ```


    Listing 0-3: This customized .bashrc file updates PATH to include RVM.


    This code displays the contents of the .bashrc file, showing that a new value
    has been assigned to PATH that allows the local RVM (Ruby manager) installation
    to manage any installed Ruby versions. Because the .bashrc file sets the PATH
    every time a new command shell is opened, the RVM installation will be available
    by default on this system.


    You can implement a similar customization to make your scripts available by default.
    First, you''ll create a development folder in your home directory to save all
    your shell scripts in. Then you can add this directory to PATH in your login file
    to reference your new scripts more easily.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'To identify your home directory, use the command echo $HOME to print the directory
    path in your terminal. Navigate to that directory and create your development
    folder (we recommend naming it scripts). Then, to add your development directory
    to your login script, open the login script in your editor and add the following
    line to the top of the file, replacing /path/to/scripts/ with the directory of
    your development folder.


    ```

    export PATH="/path/to/scripts:$PATH"

    ```


    Once this is done, any of the scripts you save in the development folder can then
    be called as a command in the shell.


    # Running Shell Scripts


    We''ve used a few commands now, as echo, which, and cat. Let''s we only used them
    individually, not all together in a shell script. Write a shell script that runs
    them all consecutively, as shown in Listing 0-4. This script will print Hello
    World by the file path of the next shell script, a shell script that should be
    in your bash files by default. Then it will use this path to print the contents
    of next to the screen. (The contents of next aren''t important at the moment;
    this is just being used as an example script.) This is a good example of using
    a shell script to perform a series of commands in order, to see the full system
    path of a file and quickly check the contents.


    ```

    echo "Hello World"

    echo $$(which next)

    cat $$(which next)

    ```


    +   Listing 0-4: The contents of our first shell script


    Open your favorite text editor (Vim on Linux and EditText on OS X are popular
    editors) and enter Listing 0-4. Then save the shell script to your development
    directory and name it intro. Shell scripts do not need a special extension, so
    leave the extension blank (or you can add the .sh if you prefer, but this isn''t
    required). The first line of the script uses the echo command to print the text
    Hello world. The second line is a bit complicated; it uses to find the location
    of the file next and uses the echo command to print the location to the screen.
    Run two commands like this, where one is provided as an argument, bash a subshell
    to run the second command and store the output for the first command. In our example,
    the subshell runs the command, which will return the full path of the next script.
    This path is then used as the argument for echo, which means echo prints the path
    of next to the screen. Finally, same subshell trick passes the file path of next
    to the cat command, which prints the contents of next shell to the screen.


    Once the file is saved, we can run the shell script from the terminal.

    Listing 0-5 shows the result.'
