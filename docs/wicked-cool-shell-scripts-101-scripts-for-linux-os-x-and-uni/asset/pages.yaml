  md: "# Hacking the Script\n\nFor a long-term screen-monitoring tool, you'll want\
    \ to find some means of checking when the screen actually changes so you're not\
    \ wasting hard drive space with interesting screenshots. There are third-party\
    \ solutions that should allow screencapture to run for much longer periods, saving\
    \ the history of when the screen actually changes rather than dozens—or hundreds—of\
    \ copies of the same unchanged screen. (Note that if you have a clock display\
    \ on your screen, every capture will be slightly different, making it much harder\
    \ to avoid this problem!)\n\nWith this capability, you could have \"monitor ON\"\
    \ and \"monitor OFF\" as a wrapper that starts the capture sequence and analyzes\
    \ whether the images differ from the first capture. But if you were using this\
    \ script's GIFs to create an online training tutorial, you might use finer-grained\
    \ controls to set the length of capture, that period of time as a command line\
    \ argument.\n\n# #80 Setting the Terminal Title Dynamically\n\nListing 11-3 is\
    \ a little script for OS X users who like to work in the Terminal application.\
    \ Instead of having to use the Terminal Preferences Window dialog to set or change\
    \ the window title, you can use this script to change it whenever you like. In\
    \ this example, we'll make the Terminal window's title just a bit more useful\
    \ by including the present work-directory in it.\n\n# The Code\n\n```\n#!/bin/bash\n\
    # titleterm-Tells the OS X Terminal application to change its title\n# to the\
    \ value specified as an argument to this succinct script\n\nif [ $# -eq 0 ]; then\n\
    \    echo \"Usage: $0\" >&2\n    exit 1\nelse\n    echo -e \"\\033]0;$@\\007\"\
    \nfi\n\nexit 0\n```\n\nListing 11-3: The titleterm script\n\n# How It Works\n\n\
    The Terminal application has a variety of secret escape codes that understands,\
    \ and the titleterm script sends a sequence of ESC ] 0; title BEL , which changes\
    \ the title to the specified value."
  merge: -1
