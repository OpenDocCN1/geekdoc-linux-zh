    # Chapter 13: Working with the Cloud


    Since the first edition of this book, the internet has taken on more and more
    responsibilities in our daily lives, many of which revolve around synchronizing
    files and cloud services such as iCloud, Dropbox, and Google Drive. This chapter
    covers scripts that enable you to take full advantage of these services by ensuring
    files and directories are backed up and synchronized. You''ll also find a couple
    of shell scripts that show specific features of OS X for working with photos or
    text-to-speech.


    # Chapter 14: ImageMagick and Working with Graphics Files


    Command line applications do not have to be limited to text-based data or graphics.
    This chapter is dedicated to identifying and manipulating images from the command
    line using the suite of image-processing tools included in the open source software
    ImageMagick. From identifying image types to framing and watermarking images,
    the scripts in this chapter accomplish common image tasks, plus a few more cases.


    # Chapter 15: Days and Dates


    The final chapter simplifies the tedious details of dealing with dates and appointments:
    figuring out how apart two dates are, what day given date was, or how many days
    are there until a specific date. We solve these problems with easy-to-use shell
    scripts.


    # Appendix A: Installing Bash on Windows 10


    During the development of the second edition, Microsoft began to heavily change
    its stance on open source software, going so far as release a full bash system
    for Windows 10 in 2016. While the examples in the book have not been tested against
    this version of bash, many of the concepts and solutions should be very portable.
    In this appendix, we cover installing bash on Windows 10 so you can try your hand
    at writing some cool shell scripts on your Windows machines!'
