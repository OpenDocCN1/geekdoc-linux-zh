- img_proc: true
  md: "# #102 Bulk-Renaming Files\n\nSystems administrators are often tasked with\
    \ moving many files from one to another, and it's fairly common for the files\
    \ in the new system to require a totally different naming scheme. For a few files,\
    \ renaming is simple to do manually, but when renaming hundreds or thousands of\
    \ files, it immediately becomes a job better suited for a shell script.\n\n# ##\
    \ The Code\n\nThe simple script in Listing B-1 takes two arguments for the text\
    \ to match and replace, and a list of arguments specifying the files you want\
    \ to rename (which can be globbed for easy use).\n\n```\n#!/bin/bash\n# bulkrename--Renames\
    \ specified files by replacing text in the filename\nnprintHelp() {\n\techo \"\
    Usage: $0 -f find -r replace FILES_TO_RENAME*\"\n\techo \"\\t-f The text to find\
    \ in the filename\"\n\techo \"\\t-r The replacement text for the new filename\"\
    \n\texit 1\n}\n\nwhile getopts f:r: opt\ndo\n\tcase \"$opt\" in\n\t\tr) replace=\"\
    $OPTARG\" ;;\n\t\tf) match=\"$OPTARG\" ;;\n\t\t?) printHelp\n\\tsac\ndone\n\n\
    shift $((OPTIND - 1))\n\nif [ -z $replace ] || [ -z $match ]\n\tthen\n\techo \"\
    You need to supply a string to find and a string to replace\"\n\tprintHelp\nfi\n\
    \nfor i in $@\ndo\n\tnewname=$(echo $i | sed \"s/$match/$replace/\")\n\tmv $i\
    \ $newname\n\t&& echo \"Renamed file $i to $newname\"\ndone\n```\n\nListing B-1:\
    \ The bulkrename script"
  merge: -1
  pgno: 377
- img_proc: true
  md: '# How It Works


    We first define a printhelp() function that will print the arguments required
    and the purpose of the script, and then exit. After defining the new function,
    code iterates over the arguments passed to getopts, as in previous scripts, assigning
    values to the replace and match variables when arguments are specified.


    The script then checks that we have values for the variables we use. If the replace
    and match variables have a length of zero, the script prints an error telling
    the user that they need to supply a string to find and a string to replace. The
    script then prints the printhelp text and exits.


    After verifying there are values for match and replace, the script begins iterating
    the rest of the arguments specified, which should be the files to rename. We use
    sed to replace the match string with the replace string in the filename and store
    the new filename in a bash variable. With the new filename stored, we use the
    mv command to move the file to the new filename, and print a message telling the
    user that the file has been renamed.


    # Running the Script


    The bulk script takes the two string arguments and the files to rename (which
    can be globbed for easier use; otherwise, they''re listed individually). If invalid
    arguments are specified, a friendly help message is printed, as in Listing B-2.


    # The Results


    ```

    $ /tmp/bulk

    1_dave 2_dave 3_dave 4_dave

    $ brandon

    You need to supply a string to find and a string to replace

    Usage: -f find -r replace FILES_TO_RENAME

    -f text to find in the filename

    -r replacement text for the new filename

    $ brandon -f dave -r brandon /tmp/bulk/

    Renamed file /Users/bberry/tmp/bulk/1_dave to /Users/bberry/tmp/bulk/1_brandon

    Renamed file /Users/bberry/tmp/bulk/2_dave to /Users/bberry/tmp/bulk/2_brandon

    Renamed file /Users/bberry/tmp/bulk/3_dave to /Users/bberry/tmp/bulk/3_brandon

    Renamed file /Users/bberry/tmp/bulk/4_dave to /Users/bberry/tmp/bulk/4_brandon

    $ /tmp/bulk

    1_brandon 2_brandon 3_brandon 4_brandon

    ```


    Listing B-2: Running the bulkrename script


    You can list the files to rename individually or glob using an asterisk (*) in
    the file path like we do at i. After moving, each renamed file is printed to the
    screen with its new name to reassure the user that the files were renamed as expected.'
