  md: '# THE MISSING CODE LIBRARY


    One of Unix''s greatest strengths is that it lets you create new commands by combining
    old ones in novel ways. But even though Unix includes hundreds of commands and
    there are thousands of ways to combine them, you will still encounter situations
    where nothing does the job quite right. This chapter focuses on the stepping stones
    that allow you to create smarter and more sophisticated programs within the world
    of shell scripting.


    There''s also something we should address up front: the shell script programming
    environment isn''t as sophisticated as a real programming environment. Perl, Python,
    Ruby, and even C have structures and libraries that offer extended capabilities,
    but shell scripts are more of a “roll you own” world. The scripts in this chapter
    will help you make your way in that world. They''re the building blocks that will
