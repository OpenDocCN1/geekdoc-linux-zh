  md: "# The Code\n\n```\n#!/bin/bash\n# ituneslist-Lists your iTunes library in a\
    \ succinct and attractive\n# manner, suitable for sharing with others, or for\
    \ synchronizing\n# (with diff) itunes libraries on different computers and laptops\n\
    \nitunehome=\"$HOME/Music/itunes\"\nituneconfig=\"$itunehome/itunes Music Library.xml\"\
    \n\nsmusiclib=$(grep 'Music Folder' '$ituneconfig' | cut -d/ -f5 - | \\\ncut -d\\\
    \ -f1 | sed '%20/ /')\n\necho \"Your library is at $musiclib\"\n\nif [ ! -d \"\
    $musiclib\" ]; then\n    echo \"$0: Confused: Music library $musiclib isn't a\
    \ directory?\"&2\n    exit 1\nfi\n\nexec \"$musiclib\" -type d -minddepth 2 -maxdepth\
    \ 2 -name '.*' -print \\\n    | sed \"s|$musiclib/||\" \n```\n\nListing 1-5: The\
    \ ituneslist script\n\n# How It Works\n\nLike modern computer applications, iTunes\
    \ expects its music library\nto be in a standard location—in this case ~/Music/iTunes/iTunes\
    \ Media//\nbut allows you to move it wherever you want. The script needs to be\
    \ able\nascertain the different location, and that's done by extracting the Music\n\
    Folder value from the iTunes preferences file. That's what the pipe at ⓘ accomplishes.\n\
    \nThe preferences file ($ituneconfig) is an XML data file, so some chopping is\
    \ necessary to identify the exact Music Folder field value. Here's what the\n\
    \ Media value in Dave's iTunes config file looks like:\n\n```\nfile://localhost/Users/taylor/Music/iTunes/iTunes\
    \ %20Media/\n```\n\nThe iTunes Media value is actually stored as a fully qualified\
    \ URL, inter-estly enough, so we need to keep off the file://localhost/ prefix.\
    \ This is\nthe job of the first command. Finally, because directories in OS X\n\
    includes spaces, and because the Music Folder field is saved as a URL, all\nin\
    \ that field are mapped to %20 sequences and will be restored to spaces by\nthe\
    \ sed invocation before proceeding.\n\nWith the Music Folder name determined,\
    \ it is now easy to generate music\nlists on two Macs and then use the diff command\
    \ to compare them,\nmaking it a breeze to see which albums are unique to or the\
    \ other systems\nand perhaps to sync them up."
