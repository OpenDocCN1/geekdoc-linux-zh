  md: "# #92 Sync Files with Google Drive\n\nGoogle Drive is another popular cloud-based\
    \ storage system. Tied into the Google office utility suite, it turns out to be\
    \ the gateway to an entire online editing and production system, which makes it\
    \ quite interesting as a sync target. Copy a Word file onto your Google Drive,\
    \ and you can subsequently edit it within any web browser, it's on your computer\
    \ or not. Ditto Ditto for presentations, spreadsheets, and even photographs! Darn\
    \ useful!\n\nOne interesting note is that Google Drive does not store its Docs\
    \ files on your system, but rather stores pointers to the documents in the cloud.\
    \ Consider this:\n\n```\n$ cat M3\\ SpeakerProposal1(voting).gsheet\n{\"url\"\
    :\"https://docs.google.com/spreadsheet/cc?key=0AataxQ4SMjEzdGxYVvzXRQWpBuHfd1fd1Y1pZ5Sc3=doclist_01\"\
    ,\"resource_id\":\"0AataxQ4SMjEzdGxYVvzXRQWpBuHfd1fd1Y1pZ5Sc3\"}\n```\n\nThat's\
    \ definitely not the contents of that spreadsheet. With some fiddling with curl,\
    \ you could likely use a utility to analyze this meta information, but let's focus\
    \ on something a bit easier: a script that lets you pick and choose files to have\
    \ automatically mirrored on your Google Drive account, detailed in Listing 13-8.\n\
    \n# ## The Code\n\n```\n#!/bin/bash\n# syncdrive--lets you specify one or more\
    \ files to automatically copy\n# to your Google Drive folder, which syncs with\
    \ your cloud account\n\ngdrive=\"$HOME/Google Drive\"\nggsync=\"$gsync\"\ngapp=\"\
    Google Drive.app\"\n\nif [ -eq 0 ]; then\n  echo echo \"Usage: $(basename $0)\
    \ [file or files to sync]\" >&2\n  exit 1\nfi\n\n# First, is Google Drive running?\
    \ If not, launch it.\nif [ -z \"$(ps -ef | grep \"$gapp\" | grep -v grep)\" ];\
    \ then\n  echo \"Starting Google Drive daemon...\"\n  open -a \"$gapp\"\nfi\n\n\
    # Now, does the /gsync folder exist?\nif [ ! -d \"$gsync\" ]; then\n  mkdir \"\
    $gsync\"\n```"
