    # DAYS AND DATES


    ![](img/954a28cc04c09826495e330f44c0085b_360_0.png)


    It''s tricky to calculate date math, whether you''re trying to figure out if a
    given year was a leap year, how many days remain until Christmas, or how many
    days you''ve been alive.

    This is where there''s a chasm between the Unix-based systems, like OS X, and
    Linux systems with their GNU foundations. David Mackenzie''s rewrite of the date
    utility for the GNU version of Linux is dramatically superior in its capabilities.


    If you are using OS X or another system where date --version generates an error
    message, you can download a set of core utilities that will give you GNU date
    as a new command line option (probably installing it by gdate). For OS X, you
    can use the brew package manager (not installed by default, but easy to install
    for future use):


    ```

    $ brew install coreutils

    ```


    *'
