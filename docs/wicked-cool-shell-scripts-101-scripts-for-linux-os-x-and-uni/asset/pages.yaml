    # #13 Debugging Shell Scripts


    Although this section doesn''t contain a true script per se, we want to spend
    a few pages talking about some debugging of shell scripts, because it''s a sure
    bet that bugs are going to creep in!


    In our experience, the best debugging strategy is to build scripts incrementally.
    Some programmers have a high degree of optimism that everything will work the
    first time, but starting small can really help things along. Additionally, you
    should make liberal use of echo state to track variables and invoke your scripts
    explicitly using bash -x to display debugging output, like so:


    ```

