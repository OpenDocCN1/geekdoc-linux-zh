    Listing B-5: The moonphase script


    # How It Works


    As other scripts that scrape values from a web query, the moonphase script revolves
    around identifying the format of different query URLs and pulling the specific
    value from the resultant HTML data stream.


    Analysis of the site shows that there are two types of URLs: one that specifies
    the date, simply structured as "phase/today", and one that specifies a date in
    the past or future in the format MM/DD/YYYY, like "phase/08/03/2017".


    Specify a date in the right format and you can get the phase of the moon on that
    date. But we can''t just append the date to the site''s domain name without error-checking,
    so the script splits the user input into three fields—month, day, and year—and
    makes sure that the day and values are nonzero at ①. There''s more error-checking
    that can be done, which we explore in "Hacking the Script".


    The trickiest part of any script is properly identifying the pattern that you
    extract the desired data. In the moonphase script, that''s specified at ②. The
    longest and most complicated line is ③, where the script gets the page from the
    moongiant.com site, and uses a sequence of grep and sed commands to pull the line
    that matches the pattern specified.


    After that, it''s just a matter of displaying the illumination level, either today
    or the specified date, using the final if/then/else statement.


    # Running the Script


    Without an argument, the moonphase script shows the percentage of lunar illumination
    for the current date. Specify any date in the past or future by entering MM/DD/YYYY,
    as shown in Listing B-6.'
