    This “remove the good characters and see what’s left” approach is nice because
    it’s flexible, particularly if you remember to wrap your input variable and matching
    pattern (no pattern at all) in double quotes to avoid input errors. Empty patterns
    are a constant problem with scripting they turn a valid conditional test into
    a broken statement, producing an error message. It is beneficial to always keep
