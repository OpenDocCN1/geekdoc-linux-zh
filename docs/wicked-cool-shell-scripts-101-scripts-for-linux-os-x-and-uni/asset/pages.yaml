    # How It Works


    To pick a single line from a file, this script uses randomquote (Script #68 on
    page 213), even though that script was originally written to work with web pages
    (like many Unix utilities, it turns out to be useful in contexts other than the
    one for which it was intended).


    The toughest part of this script was figuring out how to scramble a word. There''s
    no handy Unix utility for that, but it turns out we can scramble the word differently
    and unpredictably each time we get by letter through the correctly spelled word
    and randomly add each subsequent letter to either the beginning or the end of
    the scrambled sequence.


    Notice where $scrambled is located in the two lines: in the first line the added
    letter is appended, while in the second it is prepended.


    Otherwise the main game logic should be easily understood: the outer loop runs
    until the user enters quit as a guess, while the while loop runs until the user
    guesses the word or types next to skip to the next word.'
