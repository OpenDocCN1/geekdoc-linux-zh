    # 3.4 IP MASQUERADING


    If you enable IP masquerading on your machine, let us examine the following procedures:


    Edit a file named sysctl.conf in the following directory: /etc/sysctl.conf using
    the following command:


    ```

    nano /etc/sysctl.conf

    ```


    Then, we will uncomment the following lines of code and this means to remove the
    # or preceding the specified line:


    ```

    net.ipv4.ip_forward=1

    net.ipv6.conf.default.forwarding=1

    ```


    The previous 2 lines of configuration options will enable the IPv4 and IPv6 forwarding.


    Then execute the following 2 commands:


    ```

    sudo sysctl -p

    sudo iptables -t nat -A POSTROUTING -s

    192.168.0.4/16 -o eth0 -j MASQUERADE

    ```


    Let us assume that your machine will have the IP address of 192.168.0.4 and the
    ethernet adapter you are using named: eth0 on the UUNTU system and if you are
    using wireless interface, the default wireless interface name provided by the
    system on UUNTU is: wlan0


    # 3.5 UFW LOGGING


    To enable and disable logging into your UFW instance, we use the following 2 commands:


    ```

    sudo ufw logging on

    sudo ufw logging off

    ```'
