    # DOMAIN NAME SYSTEM ON UBUNTU®


    # 2.1 INSTALLING DNS ON UBUNTU USING BIND9


    What is DNS and what are the packages required to install it on UBUNTU?


    DNS is a short name standing for Domain Name System, some companies call it domain
    name server and some other companies call it domain name service.


    The domain name system as we will call it throughout this book, is used to control
    machines grouped together under this domain name.


    Policies to manage these computers are grouped together and assigned to all the
    members under this domain name system.


    Also the DNS is a kind of a protection mechanism and a governor that governs all
    the computers and other devices joining it.


    First let us determine the packages needed to install DNS:


    +   1. BIND9

    2. DNSUTILS


    Now, we will install DNS on ubuntu using 2 commands¹ as follows:²


    | sudo apt-get install bind9¹ |

    | sudo apt-get install dnsutils² |


    Lets us go ahead and move on to our configuration stage.


    # 2.2 DNS CONFIGURATION, MAINTENANCE, MANAGEMENT AND AUTOMATION


    DNS Configuration can be done using the following settings and some of these settings
    can be changed according to your environment.'
  - '[PAGE 11]


    First of all, let us see the following diagram 3which illustrates the structure
    of the DNS environment and notice that this structure may vary according to the
    needs of your environment.


    ![](img/cd016123ddbda18287605a828f4b873d_11_0.png)


    Now, we saw a UML 2.5 diagram drawn in http://draw.io and let see this in the
    configuration action, then, we will have to see a more detailed diagram which
    shows the connection between components of each of these configuration option.


    Let us get to know the caching name server4 machine configuration.


    Edit a file named named.conf.options in the following directory using the following
    command:


    ```

    sudo nano /etc/bind/named.conf.options

    ```'
