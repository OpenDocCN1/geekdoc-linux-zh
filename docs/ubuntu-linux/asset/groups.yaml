    \n# UBUNTU 与其他系统\n\n![](img/cd016123ddbda18287605a828f4b873d_9_0.png)\n\n# 2U\
    \ 域名系统\n\n## 2.1 在 UBUNTU 上使用 Bind9 安装 DNS\n\n什么是 DNS 以及需要哪些软件包？\n\nDNS 是一种管理所有设备的保护机制。\n\
    \n首先，让我们确定需要的软件包：\n\n- 1. BIND9\n- 2. DNSUTILS\n\n现在我们将通过命令安装 DNS：\n\n| sudo apt-get\
    \ install bind9 |\n| sudo apt-get install dnsutils |\n\n让我们继续进行配置。\n\n## DNS 配置、维护、管理与自动化\n\
    \nDNS 配置可以通过以下设置完成，某些设置可能会根据环境而异。\n\n首先，让我们查看说明您环境结构的以下图表。\n\n![](img/cd016123ddbda18287605a828f4b873d_11_0.png)\n\
