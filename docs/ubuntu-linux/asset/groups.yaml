    Now, UFW can also allow and deny traffic using service name. If you remember the
    commands used to restart a service name like BIND9 for example, and this is how
    we will use the same principal in UFW commands as follows:


    ```

    sudo ufw allow bind9

    sudo ufw deny bind9

    sudo ufw delete allow bind9

    sudo ufw delete deny bind9

    ```


    Now, we did 4 commands to allow and deny packets to the incoming by service name
    and deleted the rule by service name.


    Some advanced UFW features are:


    ```

    sudo ufw allow from 192.168.0.4 to any port 22

    sudo ufw allow from 192.168.1.0/24

    sudo ufw allow from 192.168.0.4 to any port 22

    sudo ufw allow from 192.168.0.4 to any port 22 proto tcp

    sudo ufw status numbered

    sudo ufw delete 1

