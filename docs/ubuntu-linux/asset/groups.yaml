    \ number: +44 20 7630 2400\n\nMain fax number: +44 20 7630 2401\n\n# CANONICAL®\
    \ LTD.\n\n## 1.1 THE COMPANY BEHIND UBUNTU\n\nCanonical LTD is an English company\
    \ for the founder named Mark Shuttleworth from South Africa and he is the main\
    \ brain of the company.\n\nThe company's headquarter is in England.\n\nSome of\
    \ the products offered by this company are:\n\n![](img/cd016123ddbda18287605a828f4b873d_8_0.png)\n\
    \nUBUNTU and this is our main focus of this book and it is an operating system\
    \ that has made a revolution in today's technology for desktop use by regular\
    \ users, developer and cloud devops and by businesses and governments. The reason\
    \ UBUNTU of Canonical Ltd's expansion to be #1 LINUX distribution in the world\
    \ is because it is free of charge and Canonical Ltd is providing support to it\
    \ for money.\n\nThese were some of the characteristics of the company behind UBUNTU\
    \ and the other products that they offer are:\n\n- JUJU\n- MAAS\n- GNU Bazaar\n\
    \nCanonical LTD website is:\nhttp://canonical.com\n\nUp next, we will get to know\
    \ more details about UBUNTU and the origin of LINUX.\n\n## 1.2 UBUNTU LINUX\n\n\
    UBUNTU is an operating system provided by Canonical Ltd. in 3 main editions:\n\
    \n- Desktops: UBUNTU Desktop\n- Servers: UBUNTU Server\n- Mobiles, Tablets and\
    \ Phablets: UBUNTU Touch\n\nThroughout our book, we will be working with commands\
    \ for UBUNTU Desktop and UBUNTU Server editions and the reason is because this\
    \ book focuses mainly on system administration and devops operations to be done\
    \ on UBUNTU to manage organizational infrastructure and work with information\
    \ technology and devops tasks on these 2 editions.\n\n# UBUNTU VS OTHER SYSTEMS\n\
    \n![](img/cd016123ddbda18287605a828f4b873d_9_0.png)\n\n# DOMAIN NAME SYSTEM ON\
    \ UBUNTU®\n\n## 2.1 INSTALLING DNS ON UBUNTU USING Bind9\n\nWhat is DNS and what\
    \ are the packages required to install?\n\nDNS is a kind of protection mechanism\
    \ that governs all devices.\n\nFirst, let us determine the packages needed to\
    \ install:\n\n- 1. BIND9\n- 2. DNSUTILS\n\nNow, we will install DNS using commands:\n\
    \n| sudo apt-get install bind9 |\n| sudo apt-get install dnsutils |\n\nLet us\
    \ go ahead and move to our configuration.\n\n## DNS CONFIGURATION, MAINTENANCE,\
    \ MANAGEMENT AND AUTOMATION\n\nDNS Configuration can be done using the following\
    \ settings and some of these settings can vary according to environment.\n\nFirst\
    \ of all, let us see the following diagram which illustrates the structure of\
    \ your environment.\n\n![](img/cd016123ddbda18287605a828f4b873d_11_0.png)\n\n\
    Now, we saw a diagram drawn in http://draw.io and let see this in the configuration\
    \ action, then, we will have to see the connection between components.\n\nLet\
    \ us get to know the caching server configuration.\n\nEdit a file named named.conf.options\
    \ in the following directory using this command:\n\n```\nsudo nano /etc/bind/named.conf.options\n\
    ```\n\nNote that the file will open in the terminal in text editing mode and find\
    \ a section the file as follows:\n\nBy pressing CTRL + W on your keyboard and\
    \ nano will allow you to search for the section called forwarders by typing forwarders\
    \ and pressing the return key “enter key” on your keyboard.\n\n```\nforwarders\
    \ {\n  208.67.222.222;\n  208.67.220.220;\n};\n```\n\nOf course you are welcome\
    \ to put your away IP addresses if you have static IP addresses from your ISP,\
    \ but anyways these IP addresses are for public use by anyone for free available\
    \ from http://opendns.org.\n\nAfter, all we need to fire up the command to see\
    \ the installation of our DNS check if it works or not:\n\n```\ndig -x your-ip-address\n\
    ```\n\nYou need to change your-ip-address to your static ip address provided by\
    \ your ISP or DHCP IP address provided by your router ex: 192.168.1.2\n\nLet us\
    \ go ahead and move to our next configuration option which is the primary master\
    \ machine and we will apply the following configuration option:\n\nIf you will\
    \ use 1 single machine for the installation of your DNS infrastructure, we will\
    \ follow this configuration only.\n\nNow, we will edit a file named named.conf.local\
    \ and located in the following directory /etc/bind/named.conf.local using this\
    \ command:\n\n```\nsudo nano /etc/bind/named.conf.local\n```\n"
