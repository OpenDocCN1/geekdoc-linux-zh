    \ named.options 文件：\n\n```bash\nsudo nano /etc/bind/named.options\n```\n\n注意，文件将在终端以文本编辑模式打开，并找到如下章节：\n\
    \n通过按下键盘上的 CTRL + W，nano 将允许您搜索 forwarders 章节并按下回车键。\n\n```\nforwarders {\n  208.67.222.222;\n\
    \  208.67.220.220;\n};\n```\n\n当然，如果您有 ISP 静态 IP 地址，欢迎填写您自己的 IP 地址，但无论如何，这些 IP\
    \ 地址是供任何人免费使用的，可以从 http://opendns.org 获取。\n\n之后，我们需要运行命令来检查我们的 DNS 安装是否正常：\n\n\
    ```bash\ndig -x your-ip-address\n```\n\n您需要将 your-ip-address 更改为 ISP 提供的静态 IP\
    \ 地址或路由器提供的 DHCP IP 地址，例如：192.168.1.2\n\n让我们继续进入下一个配置选项，即主服务器，我们将应用以下配置选项：\n\n\
    如果您将使用单台机器安装您的 DNS 基础架构，我们将遵循此配置。\n\n现在，我们将使用以下命令编辑位于 /etc/bind/named.conf.local\
    \ 目录下的 named.conf.local 文件：\n\n```bash\nsudo nano /etc/bind/named.conf.local\n\
    ```\n\n"
