  md: 'Now, UFW can also allow and deny traffic using service name. If you remember
    the commands used to restart a service name like BIND9 for example, and this is
    how we will use the same principal in UFW commands as follows:


    ```

    sudo ufw allow bind9

    sudo ufw deny bind9

    sudo ufw delete allow bind9

    sudo ufw delete deny bind9

    ```


    Now, we did 4 commands to allow and deny packets to the incoming by service name
    and deleted the rule by service name.


    Some advanced UFW features are:


    ```

    sudo ufw allow from 192.168.0.4 to any port 22

    sudo ufw allow from 192.168.1.0/24

    sudo ufw allow from 192.168.0.4 to any port 22

    sudo ufw allow from 192.168.0.4 to any port 22 proto tcp

    sudo ufw status numbered

    sudo ufw delete 1

    sudo ufw insert 1 deny from 192.168.0.5

    ```


    Let us see each and every command of: incoming packets from host with IP address
    192.168.0.4


    +   - The first command will allow incoming from 192.168.0.4 using port 22

    - The second command will allow from 192.168.1.0 with CIDR (Classless Interdomain
    Routing) subnet mask number /24

    - The third command will allow from 192.168.0.4 on port 22

    - The fourth command will allow from 192.168.0.4 on port 22 and using protocol
    TCP

    - The fifth command will get the status of the current rules and each rule will
    have a number and these numbers are used the following 2 command

    - The sixth command will delete the rule number 1 appeared in the previous command

    - The seventh command will insert a rule and assign number 1 to it if it does
    not exist or overwrite the existing number 1 rule with deny from 192.168.0.5


