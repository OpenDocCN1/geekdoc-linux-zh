    # 6.4 INSTALLING AND CONFIGURING NGINX ON UBUNTU*


    NGINX is a web server for hosting PHP web applications just like Apache that we
    installed before.


    Now, we will perform the command:


    ```

    sudo sh -c "echo deb://nginx.org/packages/mainline/ubuntu/ $(lsb_release -cs)
    nginx" > /etc/apt/sources.list.d/Nginx.list

    ```


    This command added a list into our sources.list do our UBUNTU lists that it uses
    to get updates of the current packages.


    ```

    sudo apt-get update

    sudo apt-get install nginx

    ```


    This way, we have installed NGINX as our web application server and please do
    not make an interfer on your machine by installing more than 1 web server per
    OS installation because most of the web servers use the same protocols and one
    protocol can save one server at a time or you will need to re-configure each web
    server to use different protocol.


