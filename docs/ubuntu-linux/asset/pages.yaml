- img_proc: true
  md: 'The configuration of apache on ubuntu using the following command:


    ```

    sudo nano /etc/apache2/sites-available/000-default.conf

    ```


    Then, we will go to the section AllowOverride and set it to all as follows:


    ```

    AllowOverride all

    OR

    AllowOverride All

    ```


    This option will allow override if your application in PHP requires MVC pattern.


    Then we will create a file called .htaccess index.php is located of the application
    that you will deploy into your application server as follows:


    ```

    sudo nano /var/www/html/.htaccess

    ```


    Then we will put the contents if the application only redirects all routes to
    the index.php file as follows:


    ```

    Options +FollowSymLinks

    RewriteEngine On

    RewriteCond %{REQUEST_FILENAME} !-d

    RewriteCond %{REQUEST_FILENAME} !-f

    RewriteRule ^ index.php [L]

    ```


    Now, we will work with our next installation which will be:


    # 6.3 INSTALLING JBOSS APPLICATION SERVER


    JBoss Application Server is another application server for hosting Java web applications.
    Installing JBoss requires the following commands:


