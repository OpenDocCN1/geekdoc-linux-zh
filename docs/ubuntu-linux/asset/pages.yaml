  md: '# 3 UFW ON UBUNTU®


    The UFW is the short acronym which stands for Uncomplicated Firewall. The firewall
    is a kind of program that enables users of having access to a specific IP or deny
    access to it and also enable users have access to specific IP using specific port
    or deny access to IP using specific port.


    Let us get to recognize the port numbers and what are their functionalities. The
    port numbers are numbers associated with IP addresses allowing traffic to pass
    through it and some of these famous numbers and its uses are:


    | Port | Common Usage |

    |---|---|n| 80 8080 | are the most commonly used port number for HTTP requests
    and responses |

    | 443 | is the most commonly used port number for HTTPs requests and responses
    |

    | 22 | is the most commonly used port number for SSH requests and responses |

    | 23 | is the most commonly used port number for Telnet requests and responses
    |

    | 25 | is the most commonly used port number for SMTP requests and responses |

    | 20 | is the most commonly used port number for FTP requests and responses |


    Now, let us go ahead and move to our installation of UFW on UBUNTU. The installation
    requires the following packages to be installed:


    ```

    sudo apt-get install ufw

    ```


    Note that UBUNTU is equipped already with UFW installed and configured with the
    most secured options.


    Let us enable the firewall by using the command:


    ```

    sudo ufw enable

    ```


    The previous command will be enabling the firewall to start with its default configuration.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Let us go ahead and start doing some initial configuration.


    The following command will show you the status of your current UFW service:


    ```

    sudo ufw status verbose

    ```


    It will show you if the firewall is enabled or not, logging or not, default incoming
    and outgoing rules, and if it is skipping user profile or not.


    The following command will show you the list of exceptions to the rules applied
    to your current UFW service:


    ```

    sudo ufw show raw

    ```


    The next section will be about applying UFW roles and rules.


    # 3.1 UFW ROLES AND RULES


    UFW accepting commands to be acting as Roles and Rules.


    Rules in firewall are allow or deny and the default in nearly most of the firewalls
    allower world is deny that will be denying access to specific resource or destination.


    As we saw in our previous table of port numbers, we will be using it in making
    some rules to the firewall.


    # 3.2 WORKING WITH PORTS


    Let us go ahead and enable and disable incoming traffic on specific port numbers
    as follows:


    ```

    sudo ufw allow 53

    sudo ufw deny 22

    sudo ufw allow 80

    sudo ufw deny 8080

    sudo ufw allow 53/tcp

    ```


    Now, we have made a some Roles containing Rules governing incoming packets through
    some ports like 53, 22, 80, 8080, 52/tcp.'
  merge: -1
