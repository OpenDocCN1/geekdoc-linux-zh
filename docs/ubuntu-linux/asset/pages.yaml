  md: '# WORKING WITH WEB SERVERS

    ON UBUNTU


    Web server is a kind of a container that contains a web application programmed
    by software and web application programmer and the web application performs all
    of its functionality using the web server.


    # 6.1 INSTALLING GLASSFISH SERVER ON UBUNTU


    First, let us get install glassfish server as one of the most popular web application
    servers for java programming language as follows:


    ```

    sudo apt-get update

    sudo apt-get install default-jdk

    get http://download.java.net/glassfish/4.1.1/release/glassfish-4.1.1.zip

    unzip glassfish-4.1.1.zip

    glassfish4/bin/admin start-domain

    ```


    Configuring Glassfish Server:


    +   1. Open the URL http://localhost:4848

    2. Then browse to the left side panel and select server-config

    3. After that, go to Network Listeners,

    4. Set http-listener-1 to port 80 for default http listening


    After that, we will move on to the next installation which is:


    # 6.2 INSTALLING AND CONFIGURING APACHE WEB SERVER


    Apache web server is used as a stack bundled with PHP, and MySQL PHP is the programming
    language and MySQL is the database engine.


    Apache web server installation is as follows:


    ```

    sudo apt-get update

    sudo apt-get install tasksel

    sudo tasksel install lamp-server

    ```'
