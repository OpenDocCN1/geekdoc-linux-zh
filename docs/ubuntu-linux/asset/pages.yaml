  md: '# 7 WORKING WITH DATABASE SERVERS ON UBUNTU®


    Database servers are used mainly to store databases and keep data into it in collaboration
    with application or web application servers.


    The most famous database servers are:

    MySQL and Oracle DB 12c


    Let us go ahead and install each one of these and we will start with:


    # 7.1 INSTALLING AND CONFIGURING MYSQL SERVER


    To install MySQL server, you will need to run the following command:


    ```

    sudo apt-get install mysql-server

    ```


    Some other people install maria db package and this will be done using the following
    command:


    ```

    sudo apt-get install maria-db

    ```


    Then for security reasons, you may run the following command to get your server
    up and running securely:


    ```

    mysql_secure_install

    ```


    The last thing, we need to install is oracle 12c database server express edition.'
