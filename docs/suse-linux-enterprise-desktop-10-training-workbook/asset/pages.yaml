  md: '# Section 5: Networking


    # Setting Up a VPN


    # Chapter Objectives


    +   - Learn how to configure a Virtual Private Network (VPN).

    - Learn how to access a VPN.


    # Configuring a VPN


    A VPN is a Virtual Private Network. VPNs typically exist within large networks
    and are created to connect groups of users from a specific department or organization.
    You might, for example, be part of a VPN for employees of the marketing department.
    There might also be a VPN for all heads of departments. Before setting up a VPN,
    you will need four things from your system administrator:


    +   1. Your IP address

    2. Your certificate authority ID

    3. Your certificate file ID

    4. Your server key ID


    Once you have these items, you can configure a VPN by following these steps:


    +   1. Click the Network applet in your panel.

    2. Select VPN Connections | Configure VPN.

    3. Click the Add button.

    4. The VPN Connection assistant will open. Click Forward.

    5. Choose the type of client to use for your VPN connection. Your system administrator
    can advise you about which client to choose, but it is likely that you will select
    OpenVPN Client.

    6. Click Forward.


    ![](img/04bf849117b7b93d509c3755c065ff54_187_0.png)'
  merge: -1
  pgno: 187
- img_proc: true
  md: '7. In the Connection Name field, enter a name for the conpection.


    8. In the Gateway field, enter your IP address.


    9. Choose the connection type, as specified by your system administrator. In this
    example, choose X.509 Certificates, which is the default.


    10. Click the [...] button next to the CA file field and select your Certificate
    Authority file, which verifies you are accessing the correct site.


    11. Click Open.


    12. Click the [...] button next to the Certificate field and select your Certificate
    File, which verifies that you have authority to access the VPN.


    13. Click Open.


    14. Click the [...] button next to the Key field and select the Server Key, which
    will unlock access to the network.


    15. Click Open.


    16. Click Forward.


    17. You will receive a summary of the connection you just created. Review it and
    click Apply.


    18. The VPN Connections window will open and display a list of available VPN connections,
    including the connection you just created. Click Close to exit the dialog.


    ![](img/04bf849117b7b93d509c3755c065ff54_188_0.png)


    # Accessing a VPN Connection


    To access the VPN connection you just created, or to access another VPN:


    +   1. Click the Network Connections [...] applet on your panel.


    +   2. Select VPN Connections and the VPN you wish to access.'
  merge: -1
