  md: '# Section 8: Browsing the Web with Firefox


    will make your browser download pages more quickly, but if you use too much space,
    it can take more time to search the cache for the right information than it would
    download it. Significantly decreasing this number will free up hard drive space,
    but the browser may load pages more slowly.


    # Setting Content Preferences


    To access preferences for content—such as blocking popup windows, setting warnings
    about extensions or themes, loading images, enabling Java and JavaScript, and
    choosing Fonts and Colors—select Edit | Preferences | Content.


    # Block Popup Windows


    When this option is enabled, a yellow panel will appear at the top of the browser
    every time a popup is blocked. Popups are new windows (usually containing ads)
    that appear when you are browsing. Keeping this box checked prevents these windows
    from appearing. However, there are some sites, such as financial institutions,
    that use legitimate popups. These sites won''t function unless popups are allowed.
    To view the pop up windows associated with these sites, click the Allowed Sites
    button next to Block Popup Windows and type the address in the input field. Click
    Allow and Close.


    ![](img/04bf849117b7b93d509c3755c065ff54_283_0.png)


    # Installation Warning


    When a Web site tries to install extensions or themes, Firefox will always ask
    for your confirmation. When the Warm me when web sites try to install extensions
    or themes is checked, Firefox will warn you about an installation and block the
    confirmation prompt. If you want to allow installations from certain sites, click
    Exceptions and enter the site name. Click Allow. To disable the general warning,
    uncheck the box.


    # Load Images


    De-selecting this option will block all images from loading. Check the for for
    the originating Web site to effectively block third-party images from loading
    while still allowing the page you are accessing to load properly. Click Exceptions
    to create a list of sites that you want to permanently allowed or blocked.'
  merge: -1
