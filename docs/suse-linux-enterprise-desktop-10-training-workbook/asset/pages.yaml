  md: '# Section 9: Communicating and Collaborating


    # Managing Appointments and Tasks with Evolution


    # Chapter Objectives


    +   - View your calendar.

    - Create new calendars.

    - Use the calendar to set an appointment.

    - Schedule a meeting after searching participants’

    - Use the calendar to assign tasks.

    - Create memos.


    # Viewing Calendars


    The Evolution calendar allows you to view your schedule by day, week, work week,
    month, or list of events. Below is an overview of the default Today view in the
    Calendar window:


    ![](img/04bf849117b7b93d509c3755c065ff54_323_0.png)


    To change views, click the arrow button next to the Calendar View button. Select
    Work Week, Week, Month, or List. You can also view an arbitrary range of days
    by highlighting the days in the small Month View calendar on the right.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Managing Appointments and Tasks with Evolution


    To move forward and backward in your calendar pages, click the Previous button
    and the Next button on the toolbar.


    To see your schedule on a specific date, click the Go To [image] button and enter
    the date.


    Click the Today [image] button at any time to get back to the default view.


    # Creating Calendars


    Evolution allows you to create multiple calendars to keep track of your various
    responsibilities. For example, you might have one schedule for personal appointments,
    one for work meetings, and one for family events. When you create a separate calendar
    for each of these schedules, the calendars are displayed in different colors.


    Create a new calendar by following these steps:


    +   1. Select File | New | Calendar, OR click the arrow next to the New button
    and select Calendar.

    2. In the New Calendar window, decide if you want to store the calendar on this
    computer or in a remote location. If it is a remote calendar, you will have to
    specify a URL and refresh frequency.

    3. Enter the name of your new calendar.

    4. Choose the color for your calendar by clicking the Color box.

    5. Check the box if you want to set this as your default folder.

    6. Click OK.


    ![](img/04bf849117b7b93d509c3755c065ff54_324_0.png)


    Repeat these steps to create multiple calendars. Your new calendars and their
    colors will appear on the calendar list. When you want a calendar to show in your
    appointment view, check its box. When you want it to be hidden, de-select its
    box.'
  merge: -1
