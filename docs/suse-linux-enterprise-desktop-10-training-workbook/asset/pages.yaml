    +   3. Grab the removable media file and drag-and-drop it to the new location
    in the file manager. A duplicate file will appear in the new folder.


    # Unmounting Removable Media


    To safely eject a removable media device from your computer, you must unmount
    it.


    To unmount a CD or DVD, right-click the item''s icon on the desktop or in the
    file browser and select **Eject**. This will unmount and eject from the computer.


    To unmount a USB drive, right-click the item''s icon on the desktop or in the
    file browser and select **Unmount Volume**. Then remove the device from the computer.


