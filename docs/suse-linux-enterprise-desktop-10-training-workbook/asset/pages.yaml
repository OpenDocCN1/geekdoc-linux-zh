  md: '# Section 1: Getting Started


    Installation—ACPI Disabled: Use this installation if your computer doesn''t have
    ACPI (Advanced Configuration and Power Interface) power management. Most laptops,
    desktops, and servers made in the last few years have this standardized power
    management feature. Using this installation, you can disable the SUSE Desktop
    ACPI features.


    Installation—Local APIC Disabled: Use this installation if your computer doesn''t
    support the local APIC (Advanced Programmable Interrupt Controller).


    Installation—Safe Settings: Use this installation if you don''t have any kind
    of power management or hard disk acceleration.


    Rescue System: Use this installation to install Linux without a graphical user
    interface. This installation will also allow you to repair the Linux installation.


    Memory Test: Tests the RAM for physical errors.


    +   4. Select Installation (or one of the other options, if appropriate) and Enter.


    # Installing the Basic SUSE Linux Enterprise Desktop Configuration


    YaST will open and begin working for you as soon as you select an installation
    method according to the above steps. Once YaST begins, it''s easy to complete
    the installation process. Just follow these steps:


    +   1. Select the language to use during installation.

    2. Click Next.

    3. Read the Licensing Agreement, then click the radio button next to Yes, I Agree
    to the License Agreement.

    4. Click Next.

    5. YaST will analyze your system and the Installation Mode dialog will appear.
    Click New Installation.

    6. Select the appropriate clock and time zone.

    7. Click Next.

    8. The Installation Settings window will now open. Here is where you will configure
    hardware and software settings for your system. Basic system settings are found
    under two tabs: Overview and Expert. The options listed in the Overview tab are
    default and will likely not need much attention. The figure on page 11 lists these
    options.'
