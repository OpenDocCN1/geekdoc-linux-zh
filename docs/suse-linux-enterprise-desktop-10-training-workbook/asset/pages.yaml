  md: '# Creating and Manipulating Files and Folders


    # Creating and Manipulating Files and Folders


    # Chapter Objectives


    +   - Learn how to create new folders and files.

    - Rename a folder or file.

    - Move a file or folder to a different location.

    - Open a file.

    - Associate, or join, a file with an application.

    - Delete an unwanted folder or file.


    # Creating New Folders and Files


    In addition to helping you navigate the Linux file system, the Nautilus file manager
    enables you to create, delete, copy, and move directories and files. Follow the
    steps below to create files and folders with the Nautilus file manager.


    # New Folders


    To create and open the folder or directory where you want the new folder to be
    located:


    +   1. Browse to open the folder or directory where you want the new folder to
    be located.

    2. Right-click any area in the Viewing pane and select Create Folder, OR select
    File | Create Folder from the Menu bar. An icon named "untitled folder" will appear
    in the Viewing pane.

    3. Name the folder by entering a title beneath the icon, then press Enter. (Note:
    Folder names in Linux are case sensitive. See page 75, Naming Linux Files, for
    more information.)


    ![](img/04bf849117b7b93d509c3755c065ff54_102_0.png)


    OR


    +   1. Select Tree from the Side pane pull-down menu.

    2. Right-click the folder or directory where you want the new folder to be located
    and select Create Folder. The Properties dialog box will appear.

    3. Select the Basic tab and enter a title for the new folder in the Name field.'
  merge: -1
  pgno: 102
