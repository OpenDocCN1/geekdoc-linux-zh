  md: '2. Select Slide Show | Rehearse Timings, OR click the Rehearse Timings icon
    on the Slide View toolbar.


    3. Your slide show will begin.


    4. After any animation is finished, you will notice a timer in the bottom-left
    corner that beings counting. 00:00:24


    5. Begin giving your verbal presentation. When you are ready for the next slide,
    click the timer.


    6. Impress record the time you spent on each slide. The next time you play the
    show with automatic slide changes, your custom slide timings will display for
    the time you have specified.


    # Printing Your Presentation


    You can print your presentation in color (which is the default), grayscale, or
    black and white. You can also adjust your settings to print individual slides,
    handouts, notes, and more.


    To print:


    +   1. Select File | Print, OR press Ctrl+P.


    +   2. Select your printer in the drop-down menu next to Name.


    +   3. Click Properties if you need to change the properties of your printer.


    +   4. Under Print Range, indicate the pages of your slide show you want to print.


    +   5. Under Copies, select the number of copies you want to print.


    +   6. Select Options to open the Printer Options dialog.


    +   7. Under Contents, check the contents you want printed. You can select as
    many as needed.'
