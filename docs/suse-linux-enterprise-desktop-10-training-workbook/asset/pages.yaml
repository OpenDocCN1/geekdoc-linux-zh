  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # Saving Your Presentation


    Saving in Standard Formats


    To save your presentation:


    +   1. Select **File | Save (OR Save As** if you want to save your presentation
    in a different format).


