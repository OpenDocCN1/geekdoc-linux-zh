- img_proc: true
  md: '# Creating Presentations in OpenOffice.org Impress


    # Changing Character Style


    Character style includes font type and color, font effects, and position. Follow
    these steps to change the character style for the Slide Master:


    +   - Ensure you are in the Master View (select View | Master | Slide Master).

    - Select in the Slide Master text you want to format.


    ![](img/04bf849117b7b93d509c3755c065ff54_412_0.png)


    +   - Select Format | Character.

    - Under the Font tab, select the font, the typeface, and the size.


    ![](img/04bf849117b7b93d509c3755c065ff54_412_1.png)


    +   - Click the Font Effects tab to apply underlining and strikethrough and to
    choose a font color. You can also apply an embossed or engraved effect as well
    as an outline or shadow.


    +   - Click the Position tab to apply superscript or subscript lettering and to
    set the scaling and spacing.


    +   - Click OK.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # Changing Bullets and Numbering


    You can change the style and position of the bullets and numbering in your presentation.
    To do so, follow these steps:


    +   1. Ensure you are in the Master View (select View | Master | Slide Master).

    2. Select Format | Bullets and Numbering.


    ![](img/04bf849117b7b93d509c3755c065ff54_413_0.png)


    +   3. Under the Bullets tab, select the style of bullet you want.

    4. Click the Numbering type tab to select the type of numbering you want.

    5. Click the Graphics tab if you want to select a graphic to use instead of bullets.
    Click the desired graphic.

    6. Under the Position and Customize tabs you can specify where you want your bullets
    or numbers to appear on your slides. Make the desired changes.

    7. Click OK to save your changes and exit the Bullets and Numbering window.


    # Changing the Slide Background


    Many options are available for the background of your slides. To change the slide
    background, follow these steps:


    +   1. Ensure you are in the Master View (select View | Master | Slide Master).

    2. Select Format | Page | Background.

    3. Click the drop-down arrow to display background options. These options include
    Color, Gradient, Hatching, and Bitmap.

    4. Select the desired background.'
