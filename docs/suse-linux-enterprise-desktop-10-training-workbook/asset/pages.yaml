    \n+   - Drag and drop the tag icon to the photo or the photo to the tag icon.\n\
    - Highlight the photo, right-click the tag in the sidebar and select *Attach tag\
    \ to selection*.\n- Right-click the photo, highlight *Attach Tag*, and select\
    \ the tag from the options that appear.\n- Highlight the photo then select *Edit\
