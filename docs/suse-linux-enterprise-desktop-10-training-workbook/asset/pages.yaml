  md: '# Sending and Receiving E-mail with Evolution


    # Chapter Objectives


    +   * Send e-mail messages using Evolution.

    * Receive e-mail messages using Evolution.

    * Organize your e-mail messages.

    * Filter junk mail.

    * Search for messages.


    # Sending E-mail


    Evolution, like other e-mail clients, allows you to send and receive plain text
    or HTML e-mail messages as well as attach files, send multiple copies of an e-mail,
    reply to e-mail, forward e-mail, and add a signature to your e-mail.


    To send e-mail:


    +   * If you are not currently viewing the Evolution mail component, click the
    Mail button.

    * Select File | New | Mail Message, OR Ctrl+N, OR click the New button on the
    toolbar. This opens the Compose Message window.


    ![](img/04bf849117b7b93d509c3755c065ff54_303_0.png)'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Sending and Receiving E-mail with Evolution


    +   3. Enter the e-mail address(es) of the individual(s) to whom you want to send
    a message in the To field. If you are e-mailing more than one individual, separate
    each address with a semi-colon.


    +   4. Enter the subject of the e-mail in the Subject field. This is the short
    message that appear next to your name when the recipient receives your e-mail.


    +   5. Enter the text of the e-mail.


    +   6. Click Send to send the e-mail.


    If you don''t want to send the message immediately, follow these steps to save
    it so you can send it later:


    +   1. Compose your message following steps 1 through 5 above.


    +   2. Instead of clicking Send, click Save Draft.


    +   3. When you are ready to send the message, click the Drafts folder, open the
    message, and click Send.


    # Attaching Files to a Message


    To attach a file:


    +   1. Click the Attach button. This opens the Insert Attachment window.


    +   2. Browse for and select the file you want to attach.


    +   3. Click Attach. Your file has been attached.


    ![](img/04bf849117b7b93d509c3755c065ff54_304_0.png)


    # Sending Multiple Copies


    To send multiple copies of an e-mail:


    +   1. Click View from the Compose Message menu bar.


    +   2. Check the Cc field and Bcc field. This adds the Carbon copy and Blind carbon
    copy fields to the Compose Message window.


    +   3. To send a carbon copy (Cc) of an e-mail, enter name(s) into the Cc field.


    +   4. To send a blind carbon copy (Bcc) of an e-mail, enter name(s) into the
    Bcc field.


    +   5. Click Send to send the e-mail.'
