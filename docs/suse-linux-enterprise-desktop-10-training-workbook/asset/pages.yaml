  md: '# Applying Settings and Preferences


    The Download Manager holds a history of your downloads to keep them organized
    and accessible. To see a list of what you have downloaded, click the View Download
    History button. (You can also access the list by selecting Tools | Downloads in
    the main Firefox window).


    # Cookies


    Cookies are small bits of information Websites store on your computer. They facilitate
    communication between your browser and the Web server for faster browsing. Web
    site features, such as shopping carts and personalization, because cookies are
    saved on your machine. In most cases, cookies are harmless and cannot be used
    to steal information from your computer. The only information the Web sites store
    is the information you have already given them.


    A variety of options exists under the Cookies tab of the Privacy area:


    +   Check here to allow cookies from the original site only (this prevents third-party
    cookies).


    +   Check here if you generally want to allow cookies except for the sites removed
    in the View Cookies dialog.


    +   Click Exceptions to enter the URLs of sites you''d like to block, allow, or
    allow for a session (the amount your browser is open).


    | History | Saved Forms | Passwords | Download History | Cookies | Cache |

