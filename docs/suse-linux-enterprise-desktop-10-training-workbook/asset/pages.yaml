  md: '# Configuring and Using a Wireless Network


    # Chapter Objectives


    +   - Learn how to enable and access a wireless network connection.


    # Enabling and Accessing Wireless Connections


    In most cases, establishing a wireless connection should involve little more than
    a few clicks of your mouse. Follow these steps to enable and access available
    wireless connections.


    +   1. Right-click the Network applet in your panel and select Enable Wireless.


    ![](img/04bf849117b7b93d509c3755c065ff54_213_0.png)


    +   2. If Enable Wireless is already checked, do not de-select it.


    +   3. The Network applet will change to demonstrate that it is searching for
    an available wireless network.


    +   4. If a network is found, the connection will occur automatically and you
    will receive notification of the connection at the bottom of your screen.


    ![](img/04bf849117b7b93d509c3755c065ff54_213_1.png)


    +   5. If this does not happen, you may need to manually select, or create, a
    wireless connection.


    # Connecting to a Wireless Network


    If your system did not automatically connect to a wireless network after enabling
    wireless networking, it may be because you are still connected to a wired network
    (by default, this connection is always established first) or because there are
    multiple available networks to choose from. To connect to a wireless network,
    follow these steps:'
  merge: -1
  pgno: 213
- img_proc: true
