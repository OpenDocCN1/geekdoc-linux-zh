    # General


    There are three options under the General tab in Advanced Preferences: Accessibility,
    Browsing, and Languages.


    +   - Accessibility

    The Allow text to be selected with the keyboard option specifies whether a movable
    cursor is shown, allowing you to select text with the keyboard.

    If you check Begin finding when you begin typing. Firefox will search within the
    current Web page to find what you type as you type it. The Find toolbar will be
    displayed at the bottom of the window to show information about your search.

    - Browsing

    The Resize large images to fit in the browser window preference automatically
    shrinks large images so you can view the whole picture. To view an image at its
    full size, click on the image.

    Use autosccrolling allows you to scroll down a page by holding down your middle
    mouse button (usually the wheel) and moving the mouse up and down.'
