    # # Using Formulas and Functions


    Formulas and functions can greatly reduce your workload and ensure accuracy in
    your mathematical calculations. Formulas can be used to calculate mathematical
    values. Functions are built-in formulas that can be used to simplify complex calculations.


    ![](img/04bf849117b7b93d509c3755c065ff54_392_0.png)


    | A | B | C | D | E | F | G | H |

    |---|---|---|---|---|---|---|-|

    | 1 | John | Exam 1 | | Exam 2 | | 89 | 91 | 86 | 87.75 |

    | 2 | Sarah | | 85 | | 92 | 89 | 90.35 |

    | 3 | Mike | | 81 | | 77 | 87 | |

    | 4 | Lisa | | 96 | | 91 | | 92.75 |

    | 5 | Exam Average | | 89.25 | | | 87.75 | 89.75 | |


    # # Creating Formulas


    Formulas begin with an equal sign (=) and are calculated using the basic mathematical
    order of operations: items enclosed in parentheses are calculated first, followed
    by multiplication and division operators, and then addition and subtraction operators,
    and so on.


    For example:


    ```

    =4*3+2 produces a result of 14. Four is multiplied by 3 and then added to 2.

    ```


    ```

    =4*(3+2) produces a result of 20. Three is added to 2 and then multiplied by 4.

    ```


    # # Using Functions in Formulas


    Functions are predefined formulas (for example, SUM, AVERAGE, MAX) that perform
    calculations based on values you specify. The structure of a function begins with
    the function name, followed by an open parenthesis, the arguments for the function
    separated by semi colons, and a closed parenthesis.'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # Using the Formula Toolbar


    To access the formula toolbar, select the cell where you want to place the formula
    and type the equal sign (=). Use the function list to create your formula.


    | Name Box | Function Wizard | Cancel | Accept | Input Line |

    | --- | --- | --- | --- | --- |

    | | fx | | =AVERAGE(B2:B5) |


    **Name Box:** Click the arrow to display a drop-down menu where you can choose
    a function. This box may also display the cell reference or an area name.


    **Function Wizard:** Click this button to open the Functions dialog.


    **Cancel:** Click this button to reject cell changes and restore original cell
    contents.


    **Accept:** Click this button to accept the formula and insert it into the cell


    **Input Line:** Use this line to enter text or a formula into a cell.


    # Practicing Sample Formulas


    To practice using formulas and functions, open a new sheet and enter the data
    shown in the spreadsheet on page 377. (Don''t enter the information in the Exam
    Average row or the Student Average column.) Enter the formulas either into the
    cell where you want the answers to appear, or into the Input Line.


    Sample 1:


    =AVERAGE(B2:B5): Computes the average of the values in cells B2, B3, B4, and B5,
    by adding the figures and dividing by 4 (the number of figures in the equation).
    (Answer: 89.25)


    Sample 2:


    =B4+2*D4: Multiplies 2 by the value in D4, adds the value in B4. (Answer: 233)


    Sample 2:


    =D4/C4+33: Divides the value of D4 by the value of C4, then adds 33. (Answer:
    33.95)


    Sample 4:


    =C2+D4)*2: Adds the value of C2 and D4, then multiplies the result by 2. (Answer:
    332)


