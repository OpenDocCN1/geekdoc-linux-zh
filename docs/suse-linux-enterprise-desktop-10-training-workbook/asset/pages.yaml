  md: '# Playing Games


    # Chapter Objectives


    +   - Explore and learn to play the games installed on the SUSE Linux Enterprise
    Desktop.


    # Playing Games


    SUSE Linux Enterprise Desktop comes with several games. These can be accessed
    by selecting Computer | More Applications | Games.


    ![](img/04bf849117b7b93d509c3755c065ff54_232_0.png)


    The games fall under four categories: arcade, board games, card games, and puzzles.
    Below is a brief description of each game.


    # Arcade


    **Gnometrics**: Stack the falling boxes in your screen. This game is similar to
    Tetris.


    **Nibbles**: Collect as many points as possible by directing the worm to “eat”
    the diamonds without running into himself or the edges of the game.


    **Robots**: Avoid the robots trying to kill you by teleporting to different locations.


    # Board Games


    **Ataxx**: The object of this game is to end up with as many pieces of your color
    as possible by the time the board is filled.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Section 6: Entertaining Yourself


    **Iagno**: Players take turns placing their pieces on the board. The objective
    of this game is to try to end up with as many pieces of your color as possible
    when the board is full.


    **Mahjong**: Click on matching blocks to make them disappear. You cannot match
    blocks unless they appear on the outside edge of a level of blocks.


    **Tali**: Get the highest number of points by obtaining specific combinations
    of dice as shown on the score card.


    # Card Games


    **AisleRiot**: This is a collection of solitaire games.


    **Blackjack**: Blackjack on Linux is the same as playing Blackjack at a casino.


    **FreeCell**: This is one of the popular card games found in AisleRiot.


    # Puzzles


    **Five or More**: This game''s objective is to align five or more objects of the
    same color and shape, causing them to disappear.


    **Four-in-a-Row**: Take turns adding pieces one at a time by dropping them into
    columns. The first player to get four pieces of their color in a row, horizontally,
    or diagonally wins.


    **Klotski**: A puzzle game in which the object is to move the indented block into
    the blue blocks.


    **Mines**: Discover and mark all the mines using the clues offered by the numbered
    boxes without actually clicking on boxes that hide the mines.


    **Same Gnome**: Clear the board of all the balls by clicking on two or more adjacent
    balls. Points are awarded proportionally to the size of the sections that disappear
    with one click.


    **Stones**: Collect diamonds while avoiding getting smashed by falling rocks or
    other creatures.


    **Tetravx**: Place all the boxes in the right square into the left square so that
    each number is adjacent to a matching number.


    # Practice


    +   1. Play a game of Gnometrics.'
  merge: -1
