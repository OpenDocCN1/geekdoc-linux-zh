  md: '# Using graphical Common Commands


    The graphical user interface of SUSE Linux Enterprise Desktop means you usually
    won''t need to enter programming commands. To perform some administrative tasks,
    however, you may need to know a few basic commands. See the list below for some
    of the most common Linux commands and their functions:


    cd


    Use this command to change the directory to the location you specify. Type cd
    /home/games to change the location to the games directory within the home directory,
    for example.


    chmod


    Use this command to change the mode or permission settings for files.


    cp


    Use this command to copy files. For example, type cp myfile.html /home/help/mynewname.html
    to copy the file myfile.html in the current directory to the /home/help/ and call
    it mynewname.html.


    df


    Use this command to see how much memory your system is using and how much is free
    for every partition and mounted file system.


    ![](img/04bf849117b7b93d509c3755c065ff54_146_0.png)


    dir


    Use this command to see a list of the directory''s current contents listed in
    columns.


    du


    Use this command to see how much memory is being used by each directory under
    the one from which the root directory is to see how much memory is being used
    by every directory in the system.


    find


    Use this command to find files or folders within a Linux system. After the find
    command


    ![](img/04bf849117b7b93d509c3755c065ff54_146_1.png)'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Section 4: Performing Administrative Tasks


    head


    Use this command to display the first ten lines of a file. **head filename** to
    list the first ten lines of the file called filename.


    kill


    Use this command to kill a process according to the process''s associated process
    ID number. To see a current list of processes and their numbers, type **ps au**.
    Use caution with the kill command so you don''t accidentally kill an important
    process.


    less


    Use this command to scroll through a file one page at a time.


    ls


    Use this command to list the contents of a directory. This command also supports
    wildcard characters, so, for example, you can list all the files that begin with
    a lower case “a” (**ls a\***).


    mkdir


    Use this command to create a new directory in the current directory. Type the
    new name of the directory after the command. Type **mkdir myfiles** to create
    a directory called myfiles within the current directory.


    more


    Use this command to scroll through a file one screen at a time. For large files
    this command lets you more easily read a file’s contents. Use the space bar to
    go forward one screen and **B** to go back one


    mv


    Use this command to move files from one location to another. It uses the same
    format as the **cp command above.**


    passwd


    Use this command to change a user’s password.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Using the Command Line


    ps


    Use this command to see the processes that you have started. To see all the processes
    Linux is running in the background and all other users are running, type ps au.
    Each process is assigned a unique PID (process identification) number that you
    can use to kill the process.


    ![](img/04bf849117b7b93d509c3755c065ff54_148_0.png)


    pwd


    Use this command to display the path of the current directory.


    rm


    Use this command with caution to delete files. Once files are deleted from a Linux
    system, they cannot be recovered. Use rm -i to have Linux prompt you before deleting
    the file.


    rmdir


    Use this command to delete an entire directory.


    ![](img/04bf849117b7b93d509c3755c065ff54_148_1.png)


    tail


    Use this command to list the last ten lines of a file.


    top


    Use this command to list all the operations in progress. It also shows how much
    memory is being used by each process. You can kill a process by pressing the K
    key or change the task''s priority by pressing the R key.


    vdir


    Use this command to display the contents of a directory and show the file attributes
    and permissions.


    vi


    Use this command to open a text editor that comes with most Linux packages, including
    the Novel Desktop.


    xload


    Use this command to see a running graph of your system''s load.'
  merge: -1
