  md: '# Applying Settings and Preferences


    # Applying Settings and Preferences


    # Chapter Objectives


    +   - Set your home page, default browser, and Internet connections.

    - Change your privacy settings.

    - Set your content preferences.

    - Set your tabs preferences.

    - Select settings for downloads.

    - Learn about configuring advanced settings.

    - Choose different themes.


    # Setting Preferences


    You can configure a variety of preferences for the way Firefox operates through
    the Firefox Preferences window.

    To access the Preferences window, open Firefox and select **Edit | Preferences**.
    You can configure settings in these areas:


    +   - General

    - Privacy

    - Content

    - Tabs

    - Downloads

    - Advanced


    ![](img/04bf849117b7b93d509c3755c065ff54_276_0.png)


    # Setting General Preferences


    From the General area of the Preferences window, you can choose your Firefox home
    page, make Firefox your default Web browser, and configure how Firefox establishes
    an Internet connection.


    261'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Setting a Home Page


    Your home page is the page that automatically loads when you open your browser.
    Most users set their home pages to a frequently visited site. For example, you
    may want to use your corporate Web site, the daily news or weather, or a favorite
    search engine.


    You can set your home page the following ways:


    Using the current page:


    +   1. Open Firefox and browse to the site you would like to use as your home
    page.

    2. Select Edit | Preferences.

    3. Select the General icon.

    4. Under Home Page, click the Use Current Page button.

    5. The URL in the Location(s) field should change to the page you have selected.

    6. Click Close.


    Entering the URL:


    +   1. Open Firefox.

    2. Select Edit | Preferences.

    3. Select the General icon.

    4. Type the URL of your desired home page in the Location(s) field.

    5. Click Close.


    Using a Bookmark:


    +   1. Open Firefox.

    2. Select Edit | Preferences.

    3. Select the General icon.

    4. Under Home Page, click the Use Bookmark button.

    5. Select the bookmark you want.

    6. Click OK.

    7. The address should now appear in the Location(s) field. Click Close.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Applying Settings and Preferences


    Hint: If you select a folder of bookmarks, each page will open in a different
    tab every time you start your Web browser.


    Using a Blank Page:


    +   1. Open Firefox.

    2. Select Edit | Preferences.

    3. Select the General icon.

    4. Under Home Page, click the Use Blank Page button.

    5. about:blank should appear in the Location(s) field.

    6. Click Close.


    Setting two or more home pages:


    You can have more than one page load every time you start Firefox. Each page will
    load in a different tab.


    +   1. Open Firefox and make sure all of the pages you want to use as Home Pages
    are open in separate tabs, or that they are all located under the same bookmark
    folder.

    2. Select Edit | Preferences.

    3. Select the General icon.


    If you are selecting pages from your bookmarks, follow steps 4 through 8:


    +   4. Under Home Page, click the Use Bookmark button.

    5. In the new window, select the desired folder.

    6. Click OK.

    7. The page addresses should all appear in the input field.

    8. Click Close.


    If you are using pages currently open, follow steps 9 through 11:


    +   9. Under Home Page, click the Use Current Pages button.

    10. The page addresses should all appear in the input field.

    11. Click Close.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Section 8: Browsing the Web with Firefox


    # Making Firefox Your Default Browser


    Each time you click a hyperlink in any application, the default Web browser opens.
    On the SUSE Linux Enterprise Desktop, this default browser has been set as Firefox.
    To check that Firefox is your default browser, follow the steps below:


    +   * Open Firefox.

    * Select Edit | Preferences.

    * Select the General icon.

    * Click the Check Now button in the Default Browser area.


    # Configuring Connection Settings


    The last setting you configure under the General area of the Preferences window
    is your Connection setting. In most cases, you will not need to change these settings.
    However, if you do, and are not sure how to configure your connection settings,
    contact your Internet service provider (ISP) or your system administrator.


    For most users, the Direct Internet Connection option is the best, but if you
    are accessing the Internet through proxies, you can set those manually or have
    them automatically detected.


    # Changing Privacy Settings


    By selecting Edit | Preferences | Privacy, Firefox users can configure a variety
    of privacy settings, including settings for History, Saved Forms, Passwords, Download
    History, Cookies, and Cache.


    Click the corresponding tab to access each setting.


    A brief explanation of each setting follows.


    # History


    Enter a number in the Remember visited pages for the last days field to set parameters
    for how long your browsing history is recorded. If you entered the number 9, for
    example, you could view all of the pages visited in the last 9 days.


    If you do not want to keep a history record, click the Clear Browsing History
    Now button. Then enter O in the field. Click Close.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Applying Settings and Preferences


    ![](img/04bf849117b7b93d509c3755c065ff54_280_0.png)


    # Saved Forms


    Firefox will automatically save any information typed into online forms or the
    Search bar if you check this box. If you frequently fill out forms and are the
    only one using your computer, this is a handy feature; but otherwise, it is best
    to de-select this box to keep your personal information safe.


    # Passwords


    If the Remember box is checked, Firefox will save the login/password combinations
    you use to gain access to your favorite sites. The next time you visit one of
    these sites, your login will already be filled in and your password will appear
    as a series of asterisks.


    Saving your passwords saves a lot of time, but it can also be a security risk.
    If you are sharing your computer or are concerned about security, disable this
    feature by de-selecting the Remember Passwords box.


    If you do want to save your passwords, you should set a master password to protect
    them. You can do this by clicking the Set Master Password button. A new window
    will appear and ask you to type a new password. As you type, a password quality
    meter will display the complexity of the password. The best passwords are random
    strings of numbers and letters.'
  merge: -1
  pgno: 280
- img_proc: true
