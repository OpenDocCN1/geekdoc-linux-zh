  md: '# # Section 10: Increasing Productivity with the OpenOffice.Suite


    # # Automatically Correcting and Formatting


    You can use AutoCorrect to automatically correct spelling and capitalization errors
    as well as complete words automatically. To customize this feature and turn aspects
    of it on and off, select **Tools | AutoCorrect**. The functions controlled by
    each tab in this dialog are outlined below:


    ![](img/04bf849117b7b93d509c3755c065ff54_369_0.png)


    **Replace**: This tab lists the mistyped words automatically replaced with AutoFormat.
    You can add your own custom mistyped words and their replacements by typing the
    misspelling in the *Replace* field, typing the correction in the *With* field,
    and clicking **New**.


    **Exceptions**: This tab lists the exceptions to the replace rules, including
    abbreviations with a period that should not be replaced by a capital letter and
    words with two initial capitals (such as CDs). You can also add your own words
    to these lists by typing the word in the appropriate field and clicking **New**.


    **Options**: This tab allows you to customize how AutoFormat functions apply while
    typing and only when you are modifying existing text. Check or uncheck the “M”
    and “T” boxes to allow or disallow the functions.


    **Custom Quotes**: Use this tab to customize the character replaced as custom
    quotation marks.


    **Word Completion**: Use this tab to enable and disable automatic word completion.
    You can also add words to the lists of words OpenOffice.org automatically completes.


    You can also choose to apply your automatic formatting and correcting while you
    type, all at once, or to apply the changes and edit them yourself. To choose the
    best setting for you or to turn off the AutoFormat feature, select **Format |
    AutoFormat** and then the desired setting.'
  merge: -1
  pgno: 369
