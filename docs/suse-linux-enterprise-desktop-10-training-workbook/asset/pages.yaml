- img_proc: true
  md: '# Enable Java


    Java is a popular programming language for the Web developed by Sun Microsystems.
    A single Java program can run on many different kinds of computers, thus avoiding
    the need for programmers to create a separate version of each program for each
    kind of computer. De-select this option to disable Java applets in Firefox. Note
    that in order for Java applets to work, you must first install the Java plugin.


    # Enable Javascript


    JavaScript is a scripting language commonly used to construct Web pages. JavaScript
    is often used to dynamically validate forms and select buttons. Disabling JavaScript
    may cause some sites not to work properly.


    While you should keep JavaScript enabled, there are some functions that you may
    want to disable. Click the Advanced button to display these options.


    ![](img/04bf849117b7b93d509c3755c065ff54_284_0.png)


    # Set Fonts


    Web pages are usually displayed in the default font and size specified in these
    fields.


    ![](img/04bf849117b7b93d509c3755c065ff54_284_1.png)


    Certain Web sites, however, may override the default font and size unless you
    specify otherwise. To do so, click the Advanced button and apply your desired
    settings in the Fonts window.'
