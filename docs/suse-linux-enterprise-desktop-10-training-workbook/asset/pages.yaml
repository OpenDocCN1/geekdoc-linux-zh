  md: '# Understanding the Linux File System Structure


    # Chapter Objectives


    +   - Explain how files are organized in the SUSE Linux Enterprise Desktop.

    - Learn how to name Linux files.

    - Understand how to identify important directories in the SUSE Linux Enterprise
    Desktop.


    # Exploring File System Organization


    Linux uses a file system built of directories (folders) and files (documents)
    that are arranged in a hierarchy and accessed through a file manager called Nautilus.

    The path begins with the root directory, which is the top-level directory on the
    Linux system disk and is represented by a slash "/\ Subdirectories and files are
    then ordered under the root directory. When Linux refers to a file path, this
    root slash is placed before the directory name. Subsequent directories are also
    divided by a slash "/(home/user/documents).

    The ranked file structure is not based on physical storage media. All hard drives
    and disks are attached to the file system in the root hierarchical tree. Thus,
    users don''t need to search through different hard drives and disks to find their
    files. In fact, when users change directories, they don''t even notice that the
    hard drive has changed.


    ![](img/04bf849117b7b93d509c3755c065ff54_90_0.png)


    # Naming Linux Files


    Rules for naming Linux files differ from other operating systems in a few significant
    ways. Follow these guidelines for naming Linux files:


    +   - Linux distinguishes between uppercase and lowercase letters, but be careful
    when naming or searching for files. For example, the file names File, file, and
    FILE identify three different documents.

    - A file name can contain as many as 255 characters. However, shorter file names
    are best, especially for files that you intend to share across a network.

    - File names may contain most special characters, including "_" and "%".

    - Avoid a few special characters that have specific meanings. These include "$$",
    "*", and and'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Section 3: Managing Files with Nautilus


    " [space]\ If you want to use one of these special characters, you must mask its
    meaning by placing a backslash (\) before the character or by placing the file
    name within quotation marks.


    +   - Although diacritics such as accent marks, tildes, and umlauts can be used,
    you may want to avoid them because they may cause problems if you are exchanging
    files with people in other countries.


    # Defining Important Directories


    Many of the directories in the Linux system contain files and folders you may
    never use. The directories you will probably use often are defined below.


    # Home Directories


    /home/


    Many people can work on a Linux system simultaneously. To keep users'' data separate
    from each other, every user is assigned a Home Folder. In this directory, users
    can create other directories, store data, and install programs. The directory
    is automatically named according to the user''s login name (/home/username/).
    When typing file paths, you may also use “~” (tilde) to represent the home directory
    (~/documents = /home/username/documents).


    /root/


    This is the system administrator''s home directory. Linux allows only one administrator,
    the root operator, to perform system-level tasks such as manipulating servers
    and configuring hardware.


    # Other Directories


    /media/


    In this directory, you will find a sube for every possible removable storage device,
    including floppy disks, CD-ROMs, CD burners, and USB drives. The contents of these
    storage devices are attached to the file system through the media directory.


    /mnt/


    Use this directory to temporarily add, or "mount," files to the file system. Although
    you can also manually mount replaceable storage devices using this directory,
    the /media/ directory will automatically mount these items. The /mnt/ directory
    generally is used to mount and access directories exported over the network.


    /tmp/


    If you''re using an application that creates temporary files to store data, the
    data will be held in the /tmp/ directory. This directory''s content is automatically
    deleted regularly.'
