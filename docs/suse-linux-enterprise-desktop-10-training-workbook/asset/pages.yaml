  md: '# Section 4: Performing Administrative Tasks


    # # Adding and Removing Software


    # Chapter Objectives


    +   - Install and remove software from the SUSE Linux Enterprise Desktop CDs or
    DVD.

    - Install software from other sources.

    - Update software and other SUSE Linux Enterprise Desktop settings.


    # ## Installing and Removing Software from the SUSE Linux Enterprise Desktop CDs
    or DVD


    During installation you most likely installed all the software needed for the
    SUSE Linux Enterprise Desktop. If, however, you later find that you would like
    to install additional software packages, follow these steps:


    +   1. Click the **Computer** button to open the main menu.

    2. Click the **Install Software** icon, which can be found in the System area
    of the main menu.

    3. To locate the package you would like to install, enter part of the package
    name and click **Search**, OR simply scroll through the list to locate the package.

    4. Check the box next to the package you''d like to install.

    5. Click **Install**.

    6. When prompted, load the appropriate SUSE Desktop CD or DVD and follow the on-screen
    instructions.

    7. When installation is complete, click **Close**.

    8. Open the Application Browser to locate the newly installed program.


    ![](img/04bf849117b7b93d509c3755c065ff54_155_0.png)'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Adding and Removing Software


    Note: You can also install software from the SUSE Linux Enterprise Desktop CDs
    or DVD by following the steps outlined in the objectives on pages 9 and 10, Preparing
    to Install the SUSE Linux Enterprise Desktop and Installing the Basic SUSE Linux
    Enterprise Desktop Configuration.


    # Removing Software


    To remove software, follow these simple steps:


    +   1. Select Computer | More Applications | System | Remove Software.

    2. To locate the package you would like to remove, enter part of the package name
    in the Search field and click Search, OR simply scroll through the list to locate
    the package.

    3. Check the box next to the package you''d like to remove.

    4. Click Remove.

    5. Follow any on-screen instructions and click Close when finished.


    ![](img/04bf849117b7b93d509c3755c065ff54_156_0.png)


    # Installing Software from Another Source


    Occasionally, you will want to install software from a source other than the SUSE
    Desktop CDs or DVD. Perhaps you have downloaded a file from the Internet or have
    a CD with new software on it. To install software in this manner, follow these
    steps:


    +   1. Insert the CD with the software, go to the network site that holds the
    software, or locate the file in your file browser. Once the file is displayed,
    highlight it.

    2. In this example, we will install OpenOffice.Org 2.4 for Linux. Double-click
    the highlighted file.


    ![](img/04bf849117b7b93d509c3755c065ff54_156_1.png)


    +   3. Enter the root password and click Continue.


    +   4. The Software Installer window will open, with your software listed. Make
    sure the box next to the software is checked.'
