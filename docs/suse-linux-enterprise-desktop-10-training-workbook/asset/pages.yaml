  md: '# Managing Spreadsheets with OpenOffice.org


    +   1. Select the cell or group of cells to which you want to apply the background
    color.


    +   2. Click the Background Color [A] button on the Formatting toolbar.


    +   3. Choose the desired color. When de-select the cell(s) the background color
    will display.


    # Using AutoFormat


    You can quickly format data tables in your spreadsheet using predefined formats
    from the AutoFormat feature. Follow the steps below to automatically format your
    data tables:


    +   1. Select the cells you want to format. (You must select at least a three-by-three
    cell range.)


    +   2. Select Format | AutoFormat.


    +   3. Choose a predefined format you like in the Format window. The preview window
    will display what your table will look like.


    ![](img/04bf849117b7b93d509c3755c065ff54_386_0.png)


    +   4. Click OK.


    To define your own custom AutoFormat designs:


    +   1. Format the cells in your spreadsheet the way you want them to appear.


    +   2. Select the cells. (Remember to select at least a three-by-three cell range.)


    +   3. Select Format | AutoFormat from the Menu bar.


    +   4. Click Add.


    +   5. Type a new name for the new format.


    ![](img/04bf849117b7b93d509c3755c065ff54_386_1.png)'
  merge: -1
