  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    ![](img/04bf849117b7b93d509c3755c065ff54_411_0.png)


    # Customizing Your Presentation in the Master View


    If you have created a presentation using a template, the slide background, layout,
    and character styles are preprogrammed for you. If you create an empty presentation,
    you can use the Master View to customize the look and feel of your presentation
    to suit your specific needs.


    Every slide in your presentation is based on the Slide Master and can be accessed
    from the Master View. Making changes to your Slide Master automatically changes
    every slide in your presentation.


    +   1. To open the Master View, select View | Master | Slide Master.


    ![](img/04bf849117b7b93d509c3755c065ff54_411_1.png)


    +   2. Make the desired changes to your presentation (see below).


    +   3. To close the Master View at any time, click Close Master View in the Master
    View dialog.'
