    # Receiving E-mail


    Receiving and reading e-mail is simple with Evolution. To check e-mail:


    +   1. From the Folder list in the Evolution window, select Inbox to view the
    messages you have received.

    2. Click the message to view it in the Preview pane.

    3. Double-click the message to open it in a separate window.


    ![](img/04bf849117b7b93d509c3755c065ff54_307_1.png)


    To make sure you have received all your messages, click the Get Mail button before
    you view your Inbox.


    # Saving and Opening Attachments


    When a message you receive includes an attachment, you will see an attachment
    icon in the attachment column of the Message List and notification of an attachment
    beneath the message header information. You can save the attachments you receive
    or choose to open them directly from Evolution. Follow the steps below to save
    an attachment:


    +   1. From the Message List of the Evolution window, select the message that
    contains the attachment.

    2. Beneath the header information in the Preview pane, you’ll see the attachment
    notice and the Save button.

    3. Click the Save button, then browse to the location where you’d like to save
    the attachment, and click Save.


    OR'
