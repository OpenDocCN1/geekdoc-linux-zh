  md: '# Section 7: Managing Photos with F-Spot


    # Editing Digital Photos


    # Chapter Objectives


    +   - Edit a photo using the toolbars.

    - Edit a photo using the options in the Edit menu.

    - Use your favorite photos as background and screensavers.


    # Editing with the Toolbar


    The toolbars in your F-Spot window make it easy to edit your digital photos. The
    toolbar at the top of the window contains the Rotate Left and Rotate Right buttons,
    which allow you to position your photos correctly.


    ![Editing Toolbar](image)

    nThe Editing toolbar allows you crop photos, reduce red eye, and adjust colors.


    To open the Editing, double-click the photo you wish to edit, OR highlight the
    photo and click the Edit button in the main toolbar. The Editing toolbar will
    appear underneath the selected photo.


    ![](img/04bf849117b7b93d509c3755c065ff54_249_1.png)


    **Crop:** To crop a photo, use the drop-down arrows to select No Constraint or
    a fixed ratio crop on the left of the toolbar. Select the area you want to crop
    by moving your mouse pointer over your photo and holding down the left button
    as you move the mouse. When you have selected the area to be cropped, click the
    Crop icon.


    **Reduce red eye:** To reduce the appearance of red eyes, use the mouse to select
    the eye area of the subject in your photo. Click the Red eye icon. This function
    works best if you select each eye individually. Zooming in is helpful if the subject
    is small.


    **Adjust color:** When you click the Color icon, a new window opens. In this window
    you can view the histogram of the photo and adjust the exposure, saturation, brightness,
    hue, contrast, temperature, and tint. If you want to return to the original settings,
    click Reset. When you finish, click OK.


    **Change to black/white or sepia tones:** Click this button to convert your photo
    to black and white tones. Click this button to convert your photo to sepia tones.


    **Browse:** To browse through photos while editing mode, click on the left and
    right arrow buttons at the right of your toolbar.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Editing Digital Photos


    You can return to the original version of your photograph at any time while editing.
    The drop-down menu in the Version field (in the left sidebar) keeps track of the
    modifications you make. Original to see your unedited photo. After you have made
    one edit to a photo, your next edits will modify the same version. If you want
    to create additional versions, select File | Create New Version.


    While in edit mode, you can also add a comment in a field beside your photo. This
    is a useful way to remind yourself of names, occasions, and miscellaneous information.
    Your comment is saved in the actual file, so it is available even when the photo
    is not being viewed in F-Spot.


    # Editing with the Edit Menu


    The Edit menu offers some of the same options as the toolbar, but it also offers
    additional editing functions, including these:


    To sharpen your photo, select Edit | Sharpen. In the window that appears, you
    can adjust the values for amount, radius, and threshold. Click OK.


    ![](img/04bf849117b7b93d509c3755c065ff54_250_0.png)


    To change information about the date and time the photo was taken, select Edit
    | Adjust Time. When you make your changes in the new window, F-Spot calculates
    the difference between your original and edited information.


    ![](img/04bf849117b7b93d509c3755c065ff54_250_1.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Setting the Background and Screensavers


    You can use photos from your F-Spot collection as your desktop background or screensaver.


    To set your desktop background:


    +   1. Select the photo.

    2. Select Edit | Set as Background.

    3. The photo will appear as your background.


    To set your screensaver:


    +   1. Select the photo.

    2. Select Edit | Preferences.

    3. In the new window, click Make F-Spot your screensaver.

    4. Select a tag from the menu to choose which group of photos you would like to
    appear.

    5. Now when your computer is idle, the selected photos will be displayed one by
    one on your screen until you press a key or move your mouse.


    # Practice


    +   1. Crop one of your photos to postcard size. (See page 234, Editing with the
    Toolbars.)

    2. Add a comment to one of your photos. (See page 234, Editing with the Toolbars.)

    3. Change the date on one of your photos. (See page 235, Editing with the Edit
    Menu.)

    4. Set your desktop background to show one of your favorite photos. (See page
    236, Setting the Background and Screensavers.)

    5. Set your screensaver to show all the photos you have tagged as Favorites. (See
    page 236, Setting the Background and Screensavers.)'
