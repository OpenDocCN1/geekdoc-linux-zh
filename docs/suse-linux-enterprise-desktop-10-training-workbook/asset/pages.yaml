- img_proc: true
  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    To hide a sheet, column, or row:


    +   - Select the sheet, column, or row you want to hide. To select a sheet, make
    sure the tab displays in bold. To select a column or row, click a cell within
    the column or row.


    +   - Select Format | Sheet or Column or Row | Hide.


    To show a hidden sheet:


    +   - Select Format | Sheet | Show.


    +   - In the Show Sheet window, select the desired sheet from the list.


    +   - Click OK.


    To show a hidden column or row:


    +   - Select a cell in the columns or rows on either side of the hidden item.
    For example, if column B is hidden, first select a cell in columns A and C. To
    select two cells at once, press and hold the Shift key while you select the cells.


    +   - Select Format | Column or Row | Show.


    # Freezing Rows or Columns to Act as Headers


    If you have long rows or columns of data that extend beyond the viewable area
    of the spreadsheet, you can freeze them, which allows you to see the columns or
    row headers as you scroll through the rest of the data To do so:


    +   - Select the row below or the column to the right of the row or column that
    you want to be in the frozen region. All rows above, or all columns to the left
    of the selection will be frozen.


    OR


    +   - To freeze both horizontally and vertically, select the cell that is below
    the row and to the right of the column you want to freeze.


    +   - Select Window | Freeze.


    +   - To deactivate, select Window | Freeze again.


    # Working with Cells


    As you create your spreadsheet, Calc allows you to enter data manually, copy data
    from another source or application, or create formulas to generate the data automatically.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# Managing Spreadsheets with OpenOffice.org Calc


    # Editing Cell Contents


    To edit the contents in a cell:


    +   1. Double-click the desired cell, OR select the desired cell and press F2.
    The cell reference displays on the Formula bar.


    +   2. Enter the change in the Formula bar and press Enter.


    # Using Special Cell Formatting


    Because a variety of data types can be used to create spreadsheet content, you
    must define the type of data you are entering. For example, if you do not specify
    the numbers you are entering are dollar figures, Calc may read the information
    as text, a date, a percentage, a fraction, or some other figure.


    To define the type of data format for your cell range:


    +   1. Select the cells you want to format by clicking in the first desired cell
    and dragging to the last desired cell.


    +   2. Right-click the selection and choose Format Cells, OR select Format | Cells
    from the Menu bar.


    +   3. Click the Numbers tab.


    +   4. Choose the category and format for your selection. (For example, select
    Currency for your selection to display as currency.)


    +   5. Click OK to return to your spreadsheet.


    | Category | Language |

    |---|---|

    | Unmarked | $ (USA) |

    | Number | 1,234 |

    | Percent | 1,234 |

    | Date | 1/234 |

    | Time | 12:34:00 USD | 12:345 |

    | Scientific | 1.234E+00 USD |


    Note: You can create the following formats quickly by clicking their buttons on
    the Formatting toolbar:


    Currency | Percent | Standard | Add Decimal Place | Delete Decimal Place


    # Adjusting Column Width


    When numbers are too large for the column width and cannot be displayed properly,
    ### may appear instead. To ensure the numbers are wide enough to show the entire
    number, you must change the column width.


    You can change the width of a column in two ways: Simply drag the side of the
    column marker to the desired width, OR'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    +   1. Select the column and select Format | Column | Width.

    2. Enter the desired value, OR check Default value

    3. Click OK.


    **Note:** To adjust column width to automatically fit the widest cell, select
    Format | Column | Optimal Width.


    # Adjusting Alignment


    Adjust data alignment by clicking Format | Cells | Alignment, OR by using the
    Alignment buttons on the Formatting toolbar.


    ![](img/04bf849117b7b93d509c3755c065ff54_385_0.png)


    Align Left | Centered | Align Right | Justified


    To change the angle of your text:


    +   1. Select the cells that contain the text you want to manipulate.

    2. Select **Format | Cells**.

    3. Click the **Alignment** tab.

    4. In the **Degrees** field, use the up and down arrows to specify the angle (in
    degrees) you want for the text in the selected cells. The diagram on the left
    displays the angles you choose.

    5. Click **OK**.


    ![](img/04bf849117b7b93d509c3755c065ff54_385_1.png)


    # Adjusting Cell Borders and Background Colors


    To create or change a cell border line:


    +   1. Select the cell or group of cells that you want the border to surround.

    2. Click the **Cell Border** button on the Formatting toolbar.

    3. Choose the type of border you want for the cell.


    To add a background color for a cell or group of cells:'
  merge: -1
  pgno: 385
