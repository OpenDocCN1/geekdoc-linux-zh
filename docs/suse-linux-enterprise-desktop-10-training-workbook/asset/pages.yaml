  md: '# Section 5: Networking


    # Configuring and Using Proxy


    # Chapter Objectives


    +   - Learn how to set up a proxy server.

    - Learn how to enable a proxy server in Mozilla Firefox.


    # Setting Up a Proxy Server


    A proxy server is a server that resides between an application, such as a Web
    browser or an e-mail server, and a real server. A proxy is a valuable filter for
    many companies and networks and can also improve performance when large groups
    of users on a network want to access a specific Web site or e-mail server. To
    configure proxy settings, follow these steps:


    +   1. Select Computer | Control Center | System | YaST.

    2. Enter the root password and click Continue.

    3. From the panel on the left, select Network Services.


    ![](img/04bf849117b7b93d509c3755c065ff54_201_0.png)


    +   4. Click the Proxy icon.


    +   5. The Proxy Configuration screen will display. Click Enable Proxy and enter
    the appropriate server information as outlined below:


    HTTP Proxy URL: Enter the name—or URL—for your proxy server to use to access the
    Internet.


    HTTPS Proxy URL: Enter the name—or URL—of your secure server.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Configuring and Using Proxy


    FTP Proxy URL: Enter the name—or URL—of the proxy server you will use for file
    transferring (FTP).


    ![](img/04bf849117b7b93d509c3755c065ff54_202_0.png)


    No Proxy Domains: Enter services here that you want to go directly to a domain
    without going through the proxy server.


    Proxy User Name and Proxy Password: Enter if your proxy requires authorization.


    +   6. Click Test Proxy Settings to ensure that your settings are accurate.


    +   7. Click OK if settings are working properly. If settings do not work, contact
    your system administrator to ensure that you have used the correct settings.


    +   8. Click Finish.


    +   9. Your proxy configuration will be saved. You may receive a warning, like
    the one below, notifying you that some applications don''t use the proxy settings
    you configured. The next section will describe how to configure Mozilla Firefox
    to recognize your proxy settings.


    ![](img/04bf849117b7b93d509c3755c065ff54_202_1.png)


    +   10. Click OK.'
  merge: -1
