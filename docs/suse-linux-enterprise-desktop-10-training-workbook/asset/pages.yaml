  md: '# Configuring Printers


    # Modifying Printer Settings


    To modify printer settings:


    +   1 Select Computer | Control Center | Hardware | Printers.

    2. Right-click the icon associated with the printer you wish to modify.

    3. Select Properties.

    4. Click the General tab to view basic information about your printer''s status.

    5. Click the Paper tab to change settings such as paper size, paper type (glossy,
    transparent, etc.), paper source, and double-sided features.

    6. Click the Advanced tab to change settings for how the printer is fed into the
    printer, the default number of copies to print, and other advanced options.

    7. Click Close when finished.


    ![](img/04bf849117b7b93d509c3755c065ff54_168_0.png)


    # Canceling a Print Job


    Occasionally you will need to cancel a print job while it is still printing or
    while it is waiting in the print queue. To do so, follow these steps:


    +   1 Select Computer | Control Center | Hardware | Printers.

    2. Double-click the icon associated with your printer to open it OR right-click
    the icon and select Jobs. The Jobs window will open.

    3. Highlight the job you would like to cancel.

    4. Select Edit | Cancel Jobs.


    ![](img/04bf849117b7b93d509c3755c065ff54_168_1.png)


    # Deleting a Printer


    Very rarely, you will need to delete a printer. Note that you need root privileges
