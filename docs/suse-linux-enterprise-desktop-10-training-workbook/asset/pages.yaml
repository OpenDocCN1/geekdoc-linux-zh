  md: '# Section 9: Communicating and Collaborating


    # Organizing Messages


    Once you''ve collected several messages, you may want to organize them to make
    finding specific messages easier. Evolution provides several ways to organize
    and manage your messages.


    # Sorting Messages


    To make finding specific messages easier, you can sort your messages by sender
    (from), subject, and date. To sort e-mail:


    +   - Click the column heading that corresponds to the way you want to sort your
    e-mail.

    - Click the column heading again to reverse the sort order.


    You can also right-click the column headings to select from a list of other sorting
    options.


    # Deleting Messages


    To mark a message for deletion and place it in the trash folder:


    +   - From the Message List of the Evolution window, select the message you want
    to delete.

    - Press **Delete**, OR click the **Delete** button, OR right-click the message
    and select **Delete.


    When you mark a message for deletion, it remains in the mail folder from which
    it was deleted; but it is hidden from view. To view your deleted messages, select
    **View | Hide Deleted Messages**. The deleted messages will appear crossed out.


    | From | Subject | Date |

    |---|---|---|

    | The Evolution Team | Welcome to Evolution | Mar-15 5:00 AM |


    To recover a deleted e-mail:


    +   - Select the message you want to recover from the Trash folder or in its original
    folder.

    - Right-click and select **Undelete** from the context menu, OR press **Ctrl+U**,
    OR select **Edit | Undelete Message**.


    +   - The message will appear in your Inbox and the line will be removed.


    To permanently delete, or expunge, a message:


    +   - From the Folder list, click **Trash**.

    - Select the message you want to expunge.

    - Press **Delete**, OR click the **Delete** button, OR right-click the message
    and select **Delete.**'
  merge: -1
