  md: '# Configuring User Accounts


    # Configuring User Accounts


    # Chapter Objectives


    +   - Understand root privileges and log in as the root user.

    - Create new user accounts and groups.

    - Learn how to manage user passwords.


    # Understanding Root Privileges


    Each SUSE Linux Enterprise Desktop system has one “superuser” who can access and
    modify all system settings. This user is called the root user and is like an “administrator”
    in Microsoft Windows. Unlike Windows, however, no single Linux user can be identical
    to the root user. This provides a valuable failsafe to users because, without
    logging in as root, a user cannot make any changes that will harm the system.
    Once logged in as root, you can do everything on the SUSE Linux Enterprise Desktop:


    +   - Managing users and groups

    - Configuring server services

    - Installing or removing software

    - Changing hardware configurations

    - Viewing system logs


    Note: For security reasons, you should not log in as root to perform work as a
    normal user. Use root privileges only to perform administrative tasks. Log in
    as a normal user for all other tasks. Working as root makes your computer more
    vulnerable to hacking attacks that could possibly take control of your computer.
    When you work as a regular user, you do not have permission to delete or change
    important system configuration files. It is safer to work as a regular user so
    you do not inadvertently delete or move important files.


    # Logging In As Root


    During your normal daily work, you may attempt to perform an action that requires
    root privileges. If this happens, the SUSE Desktop will warn you that the action
    can be performed only by the root user.


    When this happens, simply enter the root password in the appropriate field and
    click Continue.


    ![](img/04bf849117b7b93d509c3755c065ff54_136_0.png)


    121'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Section 4: Performing Administrative Tasks


    # Logging In as Root from the Welcome Screen


    If you know you will be performing tasks that require root privileges, you may
    want to log in as the root user from the Welcome screen after booting your computer.
    To do this:


    +   1. In the Username field of the Welcome screen, enter root.

    2. Press Enter.

    3. In the Password field, enter the root password.

    4. Press Enter.


    Note: Do not log in as root to do regular, day-to-day computing. It may compromise
    the security of your system.


    # Using Root Privileges from the Command Line


    If you are in a terminal, you can switch to root user privileges by following
    the steps below:


    +   1. Open a terminal by right-clicking on the desktop and selecting Open Terminal,
    OR by selecting Computer | More Applications | System | Gnome Terminal.

    2. Type su - OR su if you want to start a graphical application.

    3. Press Enter.

    4. Type the root password. (When you enter the password, nothing is shown on the
    screen for security reasons.)

    5. Press Enter.

    6. To leave the root mode, enter the command exit.

    7. Press Enter.


    ![](img/04bf849117b7b93d509c3755c065ff54_137_0.png)


    # Creating a New User Account


    While there will be only one user with root privileges on each system, the SUSE
    Linux Desktop can support multiple users with varying levels of permissions and
    access to different items. Please note that it best to contact your system administrator
    to make any of the changes explained below, especially if you are using the Desktop
    in a large organization. Follow these steps to add a new user account:


    +   1. Select Computer | Control Center | System | User Management.

    2. Enter the root password and click Continue.'
  merge: -1
