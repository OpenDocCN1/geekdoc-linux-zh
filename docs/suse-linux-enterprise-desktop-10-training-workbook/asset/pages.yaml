    # Updating Your System


    When you buy a license for the SUSE Linux Enterprise Desktop, you also gain access
    to continual updates for your system. Because Linux is open source, developers
    constantly release new patches and updates to your software and operating system.
    Novell controls the updates and makes them available after ensuring they are compatible
    with the SUSE distribution. If your system administrator has enabled the updates
    feature, you can follow these steps to view available updates:


