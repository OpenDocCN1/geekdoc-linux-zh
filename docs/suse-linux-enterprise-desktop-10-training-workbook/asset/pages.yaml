    # ## Accessing File Roller (the Linux Archive Manager)


    An archive is a folder that stores archived files. When you archive files, you
    make a compressed copy of the original file, preserving folder and directory structure.
    This compressed file, or archive, can then be kept for backup-purposes, sent to
    another user as an e-mail attachment, etc. If you have a number of files or folders
    no longer use but would like to retain, you can archive them and delete the originals
    to save space on your hard drive.


    Linux uses File Roller, a browser tool, to create, access, and manage archives.


    To open File Roller:


    +   2. Select **Tools** and click the **File Roller** button.


    ![](img/04bf849117b7b93d509c3755c065ff54_117_0.png)


    # ## File Roller Toolbar


    ![](img/04bf849117b7b93d509c3755c065ff54_117_1.png)


    The File Roller toolbar will help you navigate, extract, add, and delete your
    archived files and folders. Whenever you open an archive folder, this toolbar
    will appear at the top of the window.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Archiving Files


    # Creating a New Archive


    Creating an archive means making a folder in which you can store compressed files.
    If you create an archive from a file, the name of the file (plus an archive file
    extension) becomes the name of the archive folder. If you create an archive from
    a folder, the name of the folder (plus the archive extension) becomes the name
    of the archive; the items in the folder are compressed within the archive.


    You can create a new archive from the Nautilus file manager:


    +   1. Select the folder or file you wish to archive.

    2. Right-click and select Create Archive.

    3. In the Location field, select a folder where you would like your archive saved.

    4. Click Create. An archive file extension is added to the file automatically.

    5. You can now see the file, distinguishable by the Archive icon and the new file
    extension, within the folder you selected. To change the archive type or the file
    extension of the archive, see page 107, Converting an Archive.


    ![](img/04bf849117b7b93d509c3755c065ff54_118_0.png)


    Note: Archiving a file or folder does not delete the original file or folder.
    If you are archiving files to save space, you can delete the original files once
    you have created an archive. If you are simply archiving files to compress and
    thus make them easier to send via e-mail or store on the network or to keep for
    back-up purposes, you should not delete the original copy of the files in question.


    # Opening an Archive


    Opening an archive means displaying the contents of an archive, not opening the
    files within the archive.


    To open an archive:


    +   1. In the Viewing pane of the Nautilus file manager, double-click the archive,
    OR right-click it and select Open with "File Roller".

    2. From your desktop, click Computer | More Applications to open the Application
    Browser.

    3. Select Tools and click the File Roller button to open File Roller.

    4. Click Open, OR click Archive | Open.'
