    default e-mail address.


    +   5. Type a reply address in the Reply-To field if you want replies e-mails
    to be sent to another e-mail add. ss.


    +   6. Type the name of your organization in the Organization field.


    +   7. Click Forward to enter your receiving information.


    +   8. Select the Server Type you are using from the list. Possible servers include
    Microsoft Exchange (if you have installed the special connector), IMAP, POP, USENET
    news, Local Delivery, MH-formation mail directories, Maildir-format mail directories,
    and Standard Unix mbox spool or directory. If you are unsure about your server
