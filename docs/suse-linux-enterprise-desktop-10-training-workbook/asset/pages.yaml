  md: '# Installing the SUSE Linux Enterprise Desktop


    # Chapter Objectives


    +   - Understand how to begin installing the SUSE Linux Enterprise Desktop.

    - Install a basic SUSE Linux Enterprise Desktop configuration.

    - Configure user accounts, passwords, and hardware settings for the SUSE Linux
    Enterprise Desktop


    # Preparing to Install the SUSE Linux Enterprise Desktop


    The SUSE Linux Enterprise Desktop distribution comes on four CDs or one DVD. After
    you boot your system from the CD, DVD, or your server, you will use YaST (Yet
    another Setup Tool) to continue your installation and configure your system. Follow
    the steps below to begin installing the SUSE Linux Enterprise Desktop:


    +   1. Begin manual installation by inserting your CD or DVD (or installing from
    your network, if applicable) then rebooting your system.

    2. Once you boot your system from the CD or DVD, this Welcome screen will appear.


    ![](img/04bf849117b7b93d509c3755c065ff54_24_0.png)


    +   3. From the Welcome screen, you can choose the way you want to install the
    SUSE Linux Enterprise Desktop. Although most users should choose the Installation
    option, you can choose one of the other options depending on your situation: Boot
    from the Hard Disk: Boots the standard operating system installed on your hard
    disk.'
  merge: -1
  pgno: 24
