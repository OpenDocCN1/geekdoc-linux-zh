    Remove tag from selection.

    * Right-click the photo, highlight Remove Tag, and select the tag from the options
    that appear.

    * Highlight the photo then select Edit | Remove Tag and select the tag from the
    options that appear.

    * Highlight the photo and the attached tag, then select Tags | Remove Tag from
    selection.'
