  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # # Saving Documents


    You can save OpenOffice.org Writer documents in a variety of file formats. The
    standard format is the OASIS OpenDocument text format (.odt), which allows you
    to easily share documents over the Web and between a variety of other word-processing
    programs.


    By default, your documents will be saved as .odt files. But you can specify other
    file extensions, such as a Microsoft Word format (.doc) or an HTML document (.html).


    To save a document in OpenOffice.org, follow these steps:


    +   1. Click the Save icon on the Standard toolbar, OR File | Save As, or press
    Ctrl+S.

    2. Give your document a name.

    3. Select a folder in which to save the document.

    4. Click the arrow next to Browse for other folders to find the correct location.

    5. Click the arrow next to File type to save the file in a format other than OpenDocument.

    6. Click Save.


    ![](img/04bf849117b7b93d509c3755c065ff54_349_0.png)


    > Note: After naming and saving your file, simply click the Save icon, or press
    Ctrl+S to automatically save the updated file without being prompted for a new
    name or format. If you have saved the document in one format and want to change
    to another, select File | Save As and follow the directions above to select a
    new format.


    # # Saving a Document to Use as a Template


    Templates are documents that have been saved with a specific structure. Most templates
    are formatted for a precise task. Follow these quick steps to save one of your
    formatted documents as a template for further use:


    +   1. Select File | Templates | Save.

    2. Enter a name for the template.'
