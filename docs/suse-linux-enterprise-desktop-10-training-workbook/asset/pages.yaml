  md: '# # Configuring and Using Panels


    # ## Chapter Objectives


    +   - Learn how to navigate the panel.

    - Demonstrate how to add a panel to the desktop.

    - Understand how to add applications and applets to the panel and how to remove
    them.

    - Learn how to configure panel properties.


    # ## Exploring the Panel


    The panel on the SUSE Linux Enterprise Desktop allows you to quickly browse open
    windows, access all applications and programs through the Computer menu, and monitor
    important system settings, such as your network connections and volume settings.
    The panel can also be customized with quick-launch icons and applets. Click any
    item on the panel once to open it.


    | Main Menu | Open Window Area | System Tray | Show Desktop Icon |

    |---|---|---|---|

    | Computer | SUSE-10 Workbook Section 2: Open-Desktop-Work | SUSE-Linux-Enterprise-from-Novell-Mozilla-Firefox
    | Wed Oct 4 11:46 PM |

    | Tomboy Notes Icon | Volume Control | Date and Time |


    **Main Menu:** Click the **Computer** button for access to the main menu.


    **Tomboy Notes Icon:** Click here to create an electronic sticky note.


    **Open Window Area:** Browse between open applications in this area. Simply click
    on the name of the application to bring it to the foreground. If the application
    is already in the foreground, clicking its name will minimize the window.


    **System Tray:** Click an icon in this area to monitor and make changes to various
    system functions. Shown here, from left to right, are the Network Monitor, Monitor
    Resolution Changer, Software Updater, and Power Monitor.


    **Volume Control:** Click this icon to open and adjust your system’s volume control.


    **Date and Time:** Click here to open a calendar, which you can navigate by date,
    month, and year.


    **Show Desktop Icon:** Click here to collapse all open windows and see the desktop.'
  merge: -1
