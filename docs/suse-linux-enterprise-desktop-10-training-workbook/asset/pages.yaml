  md: '# Burning CDs Using Nautilus


    # Chapter Objectives


    +   * Write a file to a CD.

    * Create a CD Project using several folders or files.

    * Copy files from one CD to another.


    # Writing to a CD


    In the Nautilus file manager is a directory where you can copy files and folders
    you want to burn to a compact disc. After copying these items, you can write them
    to a CD easily with the Nautilus CD/DVD Creator feature. To copy items from your
    computer to a CD, follow the instructions below.


    +   1. Mount a CD to the Linux file system (see page 110, Mounting Removable Media).

    2. In the Viewing pane of the Nautilus file manager, right-click the file or folder
    you would like to burn to a CD.

    3. Select Copy from the context menu.

    4. From the Menu bar, select Go | CD/DVD Creator. The Location bar will change
    to indicate the new location (burn:///).

    5. Select Edit | Paste from the Menu bar, OR right-click anywhere in the Viewing
    pane and select Paste, OR press Ctrl+V. The copied file will appear.

    6. Repeat steps 1 through 5 until all the files you''d like to burn are displayed.

    7. Select the file(s) you would like to burn (press and hold Ctrl to select more
    than one file).

    8. Click the Write to Disc button on the Toolbar, OR select File | Write to Disk
    from the Menu bar. The Write to Dise dialog will open.


    ![](img/04bf849117b7b93d509c3755c065ff54_130_0.png)


    ![](img/04bf849117b7b93d509c3755c065ff54_130_1.png)'
