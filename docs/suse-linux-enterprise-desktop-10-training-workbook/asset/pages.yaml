    # Moving Folders and Files


    Moving, copying, and linking the information in your file system helps you stay
    organized and allows you to quickly access the directories and documents you need.


    # Copy and Paste


    Using the Nautilus file manager, you can copy files and folders to different locations,
    or you can duplicate items within the current directory.


    To make a copy of a folder or file and paste it to an additional directory:


    +   1. Grab the item in the Viewing pane.

    2. Press and hold Ctrl and drag the item to the new location in the Side pane.

    OR

    1. Right-click the folder or file and select Copy, OR select the folder or file
    and press Ctrl+C.

    2. Navigate to the destination folder, then right-click it and select Paste Into
    Folder, OR press Ctrl+V. The copied item will appear in both the old and new locations.


    To make a copy of a folder or file within the current directory:


    +   1. In the Viewing pane, select the folder or file that you want to duplicate.

    2. Click Edit | Duplicate. A copy of an item will appear in the current folder.


    # Cut and Paste


    Moving a file or folder out of one directory and into another is a simple process.


    To move a file or folder from one directory to another:


    +   1. Drag the folder from the Viewing pane and drop it in the new location in
    the Side pane.

    OR

    1. Right-click the folder or file and select Cut, OR press Ctrl+X.

    2. Navigate to the destination folder, then right-click it and select Paste Into
    Folder, OR press Ctrl+V.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Section 3: Managing Files with Nautilus


    # Create Links


    Nautilus enables you to create symbolic links to the folders or files, so that
    the folder or file can reside in several locations without your needing to copy
    the file to each location every time you modify its contents. To create a symbolic
    link to a file or folder:


    +   1. Grab the item to which you want to create a link.

    2. Press and hold Ctrl+Shift and drag the item to the folder in which you want
    to place the link.

    1. In the Viewing pane, select the file or folder for which you want to create
    a symbolic link.

    2. Select Edit | Make Link, OR right-click and select Make Link.

    3. Drag the link from the Viewing pane to the Side pane and drop it in its new
    folder.


    OR


    +   1. Select Tree from the pull-down menu in the Side pane and click the appropriate
    folder to open it.

    2. In the Viewing pane, grab the item for which you want to create a link.

    3. Press and hold Ctrl+Shift, drag the item to the Side pane, and drop it in its
    new folder.


    The linked file or folder will be tagged with a Link emblem and will appear within
    the proper directory.


    # Opening Files


    Along with helping you navigate your files, the Nautilus file manager enables
    you to open files.


    To open a file from the Viewing pane, simply double-click its icon, OR right-click
    its icon, then select Open with “[name of application]". The file will open, either
    into the default application (the application in which it was saved) or into the
    Nautilus Viewing pane.


    To open a file into a different application:


    +   1. In the Viewing pane, right-click the desired file and select Open with
    Other Application, OR select the desired file and click File | Open with Other
    Application.'
