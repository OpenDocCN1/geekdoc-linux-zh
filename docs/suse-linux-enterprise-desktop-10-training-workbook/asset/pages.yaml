    # # Recording Changes in a Document


    You can keep track of the changes you make to your document or others make and
    then accept or reject these changes by using OpenOffice.org Writer''s Record Changes
    feature.


    To record your changes:


    +   1. Open the document and select Edit | Changes | Record. A check mark will
    appear next to Record.


    +   2. To view changes as they are made, select Edit | Changes | Show. A check
    mark will appear next to Show.


    +   3. Make changes to your document. Any additions you make will be in colored
    text and any deletions will be crossed out and in colored text.


    +   4. Move your mouse pointer over the change to select a note displaying the
    editor''s name, the type of change made, and the date.


    +   5. To stop recording changes, select Edit | Changes | Record again.


    +   6. To stop showing changes, select Edit | Changes | Show again.


    To accept or reject changes to a document:


    +   1. Select Edit | Changes | Accept or Reject.


    +   2. The Accept or Reject dialog will display and list all changes'
