  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    +   6. Click OK.


    +   7. Click More to further define the formatting features you want to include.


    ![](img/04bf849117b7b93d509c3755c065ff54_387_0.png)


    +   8. Click Close. You can now use your format in any spreadsheet.


    # Configuring Data


    OpenOffice.org Calc allows you to configure and manipulate data to display information
    in a specific way. You can define a range of cells for use as a database. Each
    row in the database range is equivalent to a database record, and each cell in
    a row is equivalent to a database field. You can search, group, sort, and make
    calculations on the range just as you would in a database.


    # Defining Your Data Range


    Calc enables you to define your cell range for use as a database.


    To configure your data range:


    +   1. In your spreadsheet, select the data you want to define.


    +   2. Select Data | Define Range to open the Define Data Range window.


    +   3. Enter a name for the database range that you want to define.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# Managing Spreadsheets with OpenOffice.Calc


    +   4. If you want to specify options for the database range, click **More** to
    view the drop-down menu and check the desired boxes.


    +   5. If you''d like to reduce the dialog to the size of the input field so that
    marking the reference in the spreadsheet will be easier, click the **Shrink**
    button.


    Note: If you shrink the dialog, it will appear smaller when you click into a sheet.


    +   6. Click **OK**.


    ![](img/04bf849117b7b93d509c3755c065ff54_388_0.png)


    # Sorting Data


    Sorting data enables you to display information in ascending or descending order.
    You can use this feature to sort data alphabetically, numerically, and so on.


    To let the computer sort your data automatically, select the cells you want to
    sort and click either the **Sort Ascending** ` button or the **Sort Descending**
    ` button on the Standard toolbar.


    To define your own sort criteria and adjust sorting options:


    +   1. Select the cells you want to sort.


    +   2. Select **Data | Sort** to open the Sort window.


    +   3. Define how you want to sort your data.


    +   4. Click **OK** to return to your spreadsheet.


    Note: If a column you are sorting data has corresponding data in subsequent columns,
    make sure those columns are also selected. For example, if you have a spreadsheet
    with an item and its price, be sure to select both the column with the item and
    the column with the price. If you don''t, items will be sorted alphabetically,
    but the corresponding prices will remain in their same cells, thereby showing
    items next to the wrong prices.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # # Filtering Data


    Filtering data allows you to extract and display a specific range of data based
    on your parameters. For example, you can use filters to find users from the same
    state, students who received the same grade on an exam, and so on.


    To filter your data:


    +   1. Select the cells you want to filter.

    2. Select Data | Filter | Standard Filter.


