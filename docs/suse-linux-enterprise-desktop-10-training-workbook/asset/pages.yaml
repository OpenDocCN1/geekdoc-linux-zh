  md: '# Logging In and Out


    # Logging In and Out


    # Chapter Objectives


    +   - Learn to log in to the SUSE Linux Enterprise Desktop.

    - Learn to safely log out of the SUSE Linux Enterprise Desktop and shut down or
    restart the computer.


    # Logging In


    When the SUSE Desktop has multiple users, you must first identify yourself by
    logging in with your unique username and password. Follow the steps below to log
    in:


    +   1. In the login mask screen (shown below), enter your username in the box
    provided.


    ![](img/04bf849117b7b93d509c3755c065ff54_30_0.png)


    +   2. Press Enter.


    +   3. The box label will change to ask for your password. Enter your password
    in the same box.


    +   4. Press Enter.


    From the login screen, you can also configure some settings for your session.
    A SUSE Desktop session lasts from the time when you first log in to the time when
    you log out. You can do the following to configure your session:


    +   1. Click Language to choose a new language for your session.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Section 1: Getting Started


    +   2. Click Session to choose another session setting. For example, you can choose
    to configure your desktop as the last session, the default session, or as another
    desktop, like the KDE graphical interface (if it is installed).


    +   3. Click Reboot or Shutdown to perform the corresponding action.


    # Logging Out


    After you are done with your SUSE Desktop session, you''ll need to log out and
    shut down the computer without losing any data. Follow the steps below to log
    out and shut down:


    +   1. Save your work and close all open programs.


    +   2. Select Computer | Log Out.


    ![](img/04bf849117b7b93d509c3755c065ff54_31_0.png)


    +   3. At the prompt (shown below) check the Save current setup box to retain
    your current window settings.


    ![](img/04bf849117b7b93d509c3755c065ff54_31_1.png)


    +   4. You can then choose one of the following options in the logout dialog:


    **Log out:** Choose this option to close your session and go to the login screen
    to allow you or someone else to log in.


    **Shut down:** Choose this option to log out and shut down the computer.


    **Restart the computer:** Choose this option to log out and reboot the computer.'
