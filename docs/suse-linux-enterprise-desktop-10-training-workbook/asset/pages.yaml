    # Opening URI Locations


    The SUSE Linux Enterprise Desktop contains special URI identifiers that enable
    you to access specific functions from Nautilus. Below is a list of URI locations
    included in the Desktop. To open these URIs, enter the URI identifier in the Location
    field of the Nautilus file manager.


    applications://


    Displays a list of available applications. These applications also appear in the
    Applications Browser. (Depending on your system, the URI may be usr/share/applications.)


    fonts://


    Displays all the available typefaces. You can also use this location to add and
    remove fonts.


    network://


    Displays all the networks you can connect to (if your system is configured to
    connect to networks).


    themes://


    Displays all the viewing options available on the SUSE Linux Desktop. It includes,
    for example, a “Large Print” theme, which enlarges the print on the desktop panel
    and the application menus.


    # Associating File Types


    The SUSE Linux Enterprise Desktop system allows you to associate, or join, a file
    with a specific application so the document will always open into that application.


    To make the association:


    +   1. Open the Nautilus file manager.

    2. Right-click the file you want to associate and select Properties.'
