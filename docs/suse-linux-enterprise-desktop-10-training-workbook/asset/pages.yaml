  md: '# Section 10: Increasing Productivity with OpenOffice.org Suite


    # Managing Spreadsheets with OpenOffice.org Calc


    # Chapter Objectives


    +   - Explore OpenOffice.org Calc, the SUSE Linux Enterprise Desktop spreadsheet.

    - Learn how to use and manipulate spreadsheets.

    - Work with cells.

    - Configure and manipulate data.

    - Import data.

    - Insert hyperlinks.

    - Use formulas and functions.

    - Create charts.

    - Create DataPilot tables.

    - Use shortcuts for common Calc tasks.


    # Exploring OpenOffice.org Calc


    OpenOffice.org Calc is a powerful spreadsheet program for managing and organizing
    nearly any type of data. Simple calculations and predefined functions allow users
    to arrange data, create budgets, manage address lists, and much more.


    An OpenOffice.org Calc spreadsheet is made up of rows and columns, lettered-to-right,
    numbered top-to-bottom. The place where a row and column intersect is called a
    cell. Each cell is unique and defined by the location in the spreadsheet according
    to column and row. For example, the cell in the uppermost left is cell A1.


    To navigate among cells, use your keyboard arrow keys. Additionally, you can use
    the tab button to move from your current cell to the right. You can also press
    the Enter key to move down a cell.


    To access OpenOffice.org Calc, select Computer | More Applications in the More
    Applications window, select Office and click the Calc button.


    ![](img/04bf849117b7b93d509c3755c065ff54_375_0.png)'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Managing Spreadsheets with OpenOffice.org Calc


    ![](img/04bf849117b7b93d509c3755c065ff54_376_0.png)


    Sheet Title


    Standard Toolbar


    Menu Bar


    Formatting Toolbar


    Formula Bar


    Sheet Tabs


    Status Bar


    Scrollbars


    Quick Calculate


    **Sheet Title:** Displays the filename of the current sheet.


    **Menu Bar:** Displays all of the OpenOffice Calc menus, through which all features
    are available.


    **Formula Bar:** Displays the contents of a selected cell. Cell text and formulas
    can be edited here.


    **Sheet Tabs:** Allows you to name, number, and view other open sheets. Click
    a tab to select a sheet. To name or number a sheet, right-click the desired sheet
    tab and choose a function from the context menu that appears.


    **Status Bar:** Displays sheet number, page style, scale, etc.


    **Standard Toolbar:** Provides shortcuts to common universal functions.


    **Formatting Toolbar:** Provides shortcuts to formatting functions that can change
    the look and feel of your spreadsheet.


    **Scrollbars:** Moves the view of your document up and/or left and right within
    sheet.


    **Quick Calculate:** Allows you to change quick calculations.


    # Standard Toolbar


    Through the Standard toolbar, you can access shortcuts to common functions such
    as printing, saving, and sorting your spreadsheets. The next two pages describe
    each toolbar button and its function.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Section 10: Increasing Productivity with OpenOffice.org Suite


