    in the drop-down menu.


    +   5. Click the arrow next to **File type** to select a file type. Imp allows
    you to save in OpenOffice.org format, Microsoft PowerPoint format, and more.


    +   6. Click **Save**.


    # Saving as a Template


    To save your design as a template:


    +   1. Select **File | Templates | Save**.


    +   2. Enter a template name under New Template.'
