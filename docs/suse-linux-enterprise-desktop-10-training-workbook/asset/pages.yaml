  md: '# Section 2: Exploring the Desktop


    # Managing Icons


    # Chapter Objectives


    +   - Understand what an icon is.

    - Create a desktop icon.

    - Create a link to a file or folder.

    - Remove a desktop icon.

    - Access an icon’s properties.

    - Organize the icons on your desktop.


    # Understanding Desktop Icons


    Icons are links to applications and programs that exist on your computer. An icon
    functions as a shortcut to the item the icon represents. Moving the mouse over
    an icon and double-clicking will open the program the icon represents. Right-clicking
    an icon will allow you to manipulate the icon and access its properties.


    You can add as many icons to your desktop as you''d like for quick access to the
    programs you use most.


    # Creating a Desktop Icon


    As you begin working with the SUSE Linux Enterprise Desktop, you may find it helpful
    to add a number of regularly used icons to your desktop for easy access. To create
    a new desktop icon that will launch your OpenOffice.org Spreadsheet program, for
    example, use the following steps:


    +   1. Click the Computer button to open the main menu.

    2. Click the More Applications button to open the Application Browser.

    3. Select Office from the panel on the left, OR scroll down to Office.

    4. Move the mouse over the Spreadsheet program.

    5. Hold the left mouse button and drag the icon to your desktop.

    6. Release the left mouse button to add your icon to the desktop.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '7. You are now able to open the Spreadsheet program by double-clicking the
    icon you created.


    # Creating a Desktop Link to a File or Folder


    It is possible to create a new folder that resides on your desktop and save documents
    and other files to this folder. To do so, simply right-click a area of the desktop
    and select Create Folder. However, the icon that appears on your desktop is not
    merely a representation or link to that folder; it is the folder. If you were
    to delete the icon, you would lose all of the files in that folder.


    It is best to create new folders in the file browser. (See page 87, Creating New
    Folders and Files.)


    You can, however, create a link to any folder on your system. Then, if the link
    is somehow removed, you lose only the icon that represents the folder. For example,
    you may want to create a link to your Documents folder. To do so, follow these
    steps:


    +   1. Locate the Documents folder using the Nautilus file browser. (See page
    79, Browsing the Nautilus file manager.)

    2. Right-click the Documents folder and select Make Link.

    3. A new item called Link to Documents will appear in the file browser''s window.

    4. Grab the Link to Documents folder with the mouse and drag it to the desktop.


    ![](img/04bf849117b7b93d509c3755c065ff54_52_0.png)


    5. The link will now appear on your desktop. It will look like this to indicate
    that it is merely a link to the folder and not the actual folder.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Section 2: Exploring the Desktop


    # Removing a Desktop Icon


    To remove unnecessary desktop icons, follow these steps:


    +   1 Use the left mouse button to grab the item you would like to remove.

    2 Drag the icon you wish to remove to the Trash icon and release the left mouse
    button.

    3 You can also right-click the icon you wish to remove and select Move to Trash.


    Note: Moving an icon to the Trash does not delete the associated program or application.
    You can still access that program through the Computer menu.


    # Accessing Icon Properties


    You can change the way an icon looks, rename it, or manipulate and personalize
    it in a variety of ways by right-clicking the icon.


    Select Stretch Icon to resize it; select Rename to give the icon another name;
    select Properties to access a menu with other icon features.


    # Organizing Desktop Icons


    Keep your desktop neat and organized by managing the appearance of your desktop
    icons. To list icons in alphabetical columns, right-click on a blank area of the
    desktop and select Clean Up by Name.


    To align the icons, right-click on a blank area of the desktop and select Align.


    You can also organize icons simply by dragging and dropping them to a desired
    location on the desktop.


    # Practice


    +   1 Show how to create a desktop icon. (See page 36, Creating a Desktop Icon.)

    2 Explain what it means to create a desktop link to a folder. (See page 37, Creating
    a Desktop Link to a File or Folder.)

    3 Demonstrate how you would access features for renaming or resizing a desktop
    icon. (See page 38, Accessing Icon Properties.)'
  merge: -1
