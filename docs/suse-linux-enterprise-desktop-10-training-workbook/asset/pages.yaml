    FTP (File Transfer Protocol) provides a way to send and receive files through
    the Internet. The SUSE Linux Enterprise Desktop uses Gnome FTP (a software program)
    to allow you connect to Internet servers. To transfer files, you must open Gnome
    FTP and set up the necessary connections.'
