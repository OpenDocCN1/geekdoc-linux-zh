    # Deleting Slides


    To remove a slide from your presentation:


    +   1. Select the slide in the Slide pane.

    2. Press Delete.

    OR

    1. Right-click the slide.

    2. Select Delete Slide.


    # Using Slide Views


    It may be useful to adjust your slide view mode as you work to move, rearrange,
    delete, and apply effects and transitions to slides. Each of the Impress view
    modes can be accessed in the View menu as well as from the tabs at the top of
    your slide window.


    ![](img/04bf849117b7b93d509c3755c065ff54_423_0.png)


    Normal: In this view you create and edit your slides.


    Outline: Here you can reorder slides and edit their titles and headings.


    Notes: In this view you can add notes to your slides. These notes are not visible
    to your audience during the presentation.


    Handout: Here you can cut several slides on one printed page.


    Slide Sorter: This view displays miniature versions of your slides. To reorder
    them, click a slide and drag and drop it to its new location in the presentation.


    # Viewing Your Slide Show


    To view your slide show at any time:


    +   1. Select View | Slide Show; OR click the arrow on the Slide button and select
    Slide Show; OR press F5.

    2. Use the left-mouse button or the right-arrow button to progress forward a slide.

    3. Use the right-mouse button or the left-arrow button to go back a slide.

    4. To stop the slide show, press the Esc key on your keyboard.'
