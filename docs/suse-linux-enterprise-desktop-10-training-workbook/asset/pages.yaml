    ![](img/04bf849117b7b93d509c3755c065ff54_224_0.png)


    +   5. The selected tracks will be ripped from the CD and imported to your music
    library.


    +   6. You can track the progress of the songs being imported by looking at the
    bottom of the left panel. Click x to cancel the process.


    # Importing Music from Other Sources


    To import music from a source other than a CD, follow these directions:


    +   1. Open Banshee.


    +   2. Select Music | Import Music.


    ![](img/04bf849117b7b93d509c3755c065ff54_224_1.png)


    +   3. From the Choose an import source drop-down arrows, select the location
