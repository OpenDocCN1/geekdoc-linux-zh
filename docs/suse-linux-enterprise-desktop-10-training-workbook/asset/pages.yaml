    # # Burning CDs


    Banshee makes it easy to create audio and MP3 CDs. To do so, follow the steps
    below:


    +   1. Open Banshee.


    +   2. Insert a blank CD into your computer.


    +   3. A new window will appear. Click Make Audio CD.


    ![](img/04bf849117b7b93d509c3755c065ff54_226_0.png)


    +   4. Scroll through your music library and highlight the songs you would like
    to burn to the CD (press Ctrl to make multiple selections at one time).


    +   5. Click the Write CD button.


    +   6. In the bottom area of the left panel, you will see the progress as Banshee
    burns your CD. When the process is finished, your CD will automatically eject.


