  md: '# Section 3: Managing Files with Nautilus


    # # Archiving Files


    # ## Chapter Objectives


    +   * Access File Roller (the Linux Archive Manager)

    * Create a new archive.

    * Open an archive.

    * Add files to an archive.

    * Extract files from an archive.

    * Modify files within an archive.

