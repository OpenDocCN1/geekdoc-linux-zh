  md: '# Section 9: Communicating and Collaborating


    # Using Folders


    Like e-mail programs, Evolution uses folders to store mail. You can create new
    folders to customize your mail organization. Follow the steps below to create
    new folders.


    +   1. In the Folder list, right-click each On This Computer or Search Folders
    and select New Folder.

    2. Enter a name for the new folder in the Folder name field.

    3. Choose a location for the new folder by highlighting the location for the folder.

    4. Click Create.


    ![](img/04bf849117b7b93d509c3755c065ff54_311_0.png)


    Once you create folders, you can drag and drop messages from the Message List
    to another folder or highlight a message and select Message | Move to Folder.


    # Filtering Junk Mail


    By default, Evolution automatically enables its junk mail filter. When the filter
    detects a message that may be junk, it hides it from view and automatically places
    it in the Junk folder.


    At first, you may need to help train the junk mail filter to recognize the junk
    mail you receive.


    Periodically check the Junk folder to see if any messages were filtered by mistake.
    Select the message and click the Not Junk button.


    If you receive a message that should be marked as junk, select it and click the
    Junk button.


    To off the Junk Mail filter:


    +   1. Select Edit | Preferences.

    2. Click the Mail Preferences icon.

    3. Click the Junk tab.

    4. De-select the Check incoming mail for junk box.


    ![](img/04bf849117b7b93d509c3755c065ff54_311_1.png)


    296'
