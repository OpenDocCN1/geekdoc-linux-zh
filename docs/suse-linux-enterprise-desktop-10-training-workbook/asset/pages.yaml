  md: '# Setting Up a Firewall


    # Chapter Objectives


    +   - Learn how to configure a firewall for your system.


    # Configuring a Firewall


    +   1. Select Computer | Control Center | System | YaST.

    2. Enter the root password and click Continue.

    3. Select Security and Users from the left panel of the YaST control center.

    4. Click the Firewall icon.

