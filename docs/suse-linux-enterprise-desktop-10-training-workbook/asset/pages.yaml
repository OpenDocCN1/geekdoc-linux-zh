  md: '# Managing Spreadsheets with OpenOffice.org Calc


    # Creating and Modifying Page Breaks


    To create a manual page break:


    +   1. Select a cell in the row or column where you want the page break. A row
    break will occur above the active cell, and a column break will occur to the left
    of the active cell.


    +   2. Select Insert | Manual Break | Row Break or Column Break. The column border
    or row border will display blue dashed to indicate the break.


    To view or edit the placement of page breaks:


    +   1. Select View | Page Break Preview. Dark blue lines indicate page breaks.
    Light blue lines indicate manual page breaks or defined print ranges.


    +   2. If you want to change the placement of a manual page break, place your
    cursor on the blue line that represents the break. When the cursor turns to a
    double arrow, drag and drop the line to the new page-break location.


    +   3. Select View | Normal to return to your spreadsheet.


    # Quick Calculations


    Follow the steps below to calculate the sums of a few cells:


    +   1. Select a range of cells that includes values that you would like to use
    in your calculation. Select neighboring cells, or select noncontiguous cells,
    by holding down the Ctrl key while clicking each desired cell.


    | H | | J | K |

    |---|---|---|---||

    | 1 | | 2 | 3 | 4 |

    | 2 | | 3 | | |

    | 3 | | 4 | |

    | 4 | | 5 | |

    | 5 | | 6 | |


    By default, the sum of the selected cells will display in the Status bar at the
    bottom of the page.


    +   2. To acquire other values, right-click the Sum area on the Status bar and
    select one of the listed functions. The calculation result will display on the
    status bar.


    ![](img/04bf849117b7b93d509c3755c065ff54_402_0.png)


