- img_proc: true
  md: '# Comparing Windows and Linux


    # # Comparing Windows and Linux


    #  Chapter Objectives


    +   - Explain how Linux differs from traditional SUSE proprietary systems.

    - Outline the main differences between SUSE Linux Enterprise 10 and Microsoft
    Windows.

    - Define uniquely Linux terms that aren''t used in other operating systems.


    # # Staying Open with Linux


    As a former Windows user, you are probably used to buying software, paying licensing
    fees, and then waiting for the software company to come up with updates. Linux
    does away with all of these costly licensing fees and waiting times.


    From its beginning as a simple PC operating system written by Linus Torvalds in
    1991, Linux has been available for anyone, over the Internet, and because its
    source code is open, programmers and development communities around the world
    contribute to updating the program and making it better. Linux in general differs
    from traditional proprietary systems in the following ways:


    +   1. Linux is not a brand or company like Microsoft. Linux is simply a PC operating
    system that companies and individuals around the world contribute to. As such,
    no one can buy ownership rights to Linux or charge licensing fees for its use.
    (Contributing companies can charge licensing fees for commercial applications
    run on Linux.)


    +   2. You don''t have to worry about pirated copies of Linux. Because you don''t
    need a license for Linux or any of its distributions, you can install it on any
    number of computers. This makes Linux cost effective for large companies with
    many users.


    +   3. There are several Linux distributions. While you can get Windows only from
    Microsoft, you can buy Linux distributions (the Linux operating system kernel
    and a package of bundled applications) from several companies, including Novell.
    Although it isn''t necessary to buy a distribution to run, it saves the time of
    downloading all the large files over the Internet.


    +   4. Linux is generally more stable. Because a graphical desktop interface is
    not necessary to install the Linux operating system, which is it in Windows, Linux''s
    processes can run independently. This extra layer of abstraction eliminates errors
    caused by more complicated programs and graphics.


    +   5. Linux is generally more secure. Because virus writers want to make an impact
    by hitting a large number of people. Because Linux is not as mainstream as Windows,
    and because the Linux source code is constantly reviewed, it is generally safe
    from Windows viruses and most hacking attacks.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Section 1: Getting Started


    By choosing to run SUSE Linux Enterprise 10, you probably already know all the
    advantages of open source and Linux versus a traditional proprietary operating
    system. You may not be as familiar with Linux, but with its lower cost, flexible
    licensing, stability, and security, chances are you''ll never go back to a proprietary
    system.


    # Distinguishing between Windows and SUSE Linux Enterprise 10


    Windows and the SUSE Linux Enterprise Desktop 10 are different in many ways. As
    an end user, however, you will not encounter many of the differences between the
    two systems. The few differences you will notice are outlined below.


    +   Linux doesn''t use characters.

    Windows users have gone used to the idea that the hard drive is named "C:\


    +   Linux uses a forward slash, not a back slash. To separate the directories
    in a filename in Windows, you use a backslash "" (C:\Programs\Explorer.exe). Linux,
    however, is like Internet addressing that it uses a forward slash "/" instead
    of (/root/home/).


    +   Linux is case sensitive. Windows does not distinguish between lowercase and
    uppercase letters in file names, but Linux does. So in Windows, workbook.txt and
    WORKBOOK.txt would be the same thing. They could exist in the same directory at
    the same time and be different files.


    ![](img/04bf849117b7b93d509c3755c065ff54_19_0.png)


    4'
