  md: '# Section 3: Managing Files with Nautilus


    # Sharing Folders and Files


    # Chapter Objectives


    +   - Set permissions for folders and files.

    - Learn how to share folders.

    - Transfer a file using Gnome FTP.


    You can use the Nautilus file manager to manage the extent of other users'' access
    to your files and folders. This is called "setting permissions." In Linux, each
    file or folder has an owner (the person who created the file or folder), a group
    (the group of users the owner belongs to), and others (anyone else you may want
    to share the folder with). The default permissions are set to keep your document
    secure. If you use default permissions settings, only you, the owner, can edit
    the file or folder. Others inside and outside your group can only read the file
    or folder. When you want to share the file or folder, you must change the permissions
    settings.


    Follow the steps below to set permissions.


    +   1. Select the file or folder for which you want to set permissions.

    2. Click File | Properties, OR right-click the item and select Properties.

    3. Click the Permissions tab.

    4. Check the desired boxes to allow yourself (owner), your group, or others the
    ability to manipulate the item in the following ways:

    5. Click Close.


    **Read** = List contents of the folder; read the file

    **Write** = Delete from the folders; edit the files

    **Execute** = Access files in the folder; run the file as a program or script
    (irrelevant for other kinds of files)


    ![](img/04bf849117b7b93d509c3755c065ff54_111_0.png)


    # Setting Permissions'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Sharing Folders


    If you have a folder on your computer that you want to share with others on the
    network, you can do so with the Nautilus file manager. You can give others the
    ability to simply view the contents of the folder; to make changes to the folder
    and the files within it; or (if applicable) to run the files within the folder
    as programs or scripts.


    To share a folder with other users:


    +   1. In the Nautilus file manager, navigate to the folder you wish to share.

    2. Right-click the folder and select **Properties**.

    3. Click the Share tab.

    4. Check **this folder**. (If you receive a message saying you do not have the
    ability to do this, contact your system administrator.)

    5. In the **Share name** field, enter a name for the folder. It doesn''t have
    to be the folder''s original name. Shorten the name if it is too long.

    6. Check **Allow other people to write in this folder** if you want other users
    to be able to modify the contents of the folder. Make sure that you have set the
    appropriate permissions for sharing the folder (see Setting Permissions on page
    96).

    7. Enter comments if you wish.

    8. Click **Create Share**.

    9. If you receive a prompt that tells Nautilus needs to add permissions to your
    folder, **add the permissions automatically**. Nautilus will grant the permissions
    you have set.

    10. Click **Close**. The Shared ![icon] icon will be added to the folder.


    ![](img/04bf849117b7b93d509c3755c065ff54_112_0.png)


