  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    ![](img/04bf849117b7b93d509c3755c065ff54_367_0.png)


    +   1. From the List tab, scroll through the changes and select Accept or Reject
    to perform the associated task. Click Accept All or Reject All to accept or reject
    all revisions at once.


    +   2. Click the Filter tab to view changes by date, user, or action and to view
    or make comments about the document.


    +   3. Click ☒ to close the Accept or Reject Changes dialog.


    If one of the reviewers of a document did not record changes, you can automatically
    record them by comparing the reviewed document to the original. Follow the steps
    below to compare documents:


    +   1. Open the original document.


    +   2. Select Edit | Compare Document.


    +   3. Select the edited copy of the original document and click Open.


    +   4. OpenOffice.org will combine both documents to your original document. All
    text that occurs in your original document but not in the edited copy is marked
    as inserted, and all text that is missing in your original document but is in
    the edited copy is marked as deleted.


    +   5. You can now accept the insertions or deletions as you wish, using Edit
    | Changes | Accept or Reject.


    If several people have reviewed your document and recorded all changes, you can
    merge all the changes to your original document by following the steps below:


    +   1. Open the original document.


    +   2. Select Edit | Changes | Merge Document.


    +   3. Select the edited copy of the document and click Open.'
