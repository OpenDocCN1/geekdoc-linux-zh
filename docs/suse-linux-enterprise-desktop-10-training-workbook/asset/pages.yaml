  md: '# Getting Started with the OpenOffice.org Suite


    # Chapter Objectives


    +   - Demonstrate your understanding of the OpenOffice.org suite.

    - Describe available OpenOffice.org applications.

    - Show how to access OpenOffice.org applications.


    # Exploring OpenOffice.org Applications


    OpenOffice.org is a powerful suite of applications for all of your office computing
    needs. The following applications come standard with the OpenOffice.org Suite
    on the SUSE Linux Enterprise Desktop.


    +   - OpenOffice.org Calc: With Calc, you can create impressive spreadsheets to
    manage and organize any type of data. Simple calculations and pre-defined functions
    allow users to arrange data, create budgets, manage address lists, and much more.

    - OpenOffice.org Draw: With Draw, you can create a variety of images that can
    be exported and used in other applications in a number of formats.(Note: All of
    the tools available in OpenOffice.org Draw are also available through the Drawing
    toolbar in OpenOffice.org Writer. To learn about these features, read page 349,
    Drawing, in the chapter on OpenOffice.org Writer).

    - OpenOffice.org Imp: With Imp, you can create effective presentations and slide
    show demonstrations.

    - OpenOffice.org Writer: With Writer, you can create documents, newsletters, brochures,
    charts, graphs, and more.


    # Accessing OpenOffice.org Applications


    To access the OpenOffice.org suite of applications:


    +   1. Select Computer | More Applications.

    2. Click the Office group icon.

    3. Calc, Imp, and Writer can be found here. Simply click to open the associated
    program.

    4. Access Draw by clicking the Images group.'
  merge: -1
  pgno: 342
- img_proc: true
