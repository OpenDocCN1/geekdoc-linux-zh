  md: '# Adding, Removing, and Accessing Hardware


    # Adding, Removing, and Accessing Hardware


    # Chapter Objectives


    +   - Understand the basics of adding hardware to your SUSE Linux Enterprise Desktop.

    - Learn how to access DVD drives, scanners, digital cameras, and other removable
    devices.

    - Understand how to safely remove hardware.


    # Adding Hardware to the SUSE Linux Enterprise Desktop


    The SUSE Linux Enterprise Desktop is designed to automatically recognize and configure
    new devices as soon as they are mounted to the system. This means that extra storage,
    digital cameras, scanners, and other media should be ready to run almost as soon
    as you connect the device to your system.


    For example, after you plug in your digital camera, the SUSE Desktop should recognize
    the new hardware and display an icon representing your camera on the desktop.
    Simply double-click the icon to open the media, access and download your images,
    and so on.


    You can help your system recognize hardware and other removable devices more quickly
    by enabling a few basic settings:


    +   1. Select Computer | Control Center | Hardware | Removable Drives and Media.


    ![](img/04bf849117b7b93d509c3755c065ff54_160_0.png)


    +   2. Click any tab to set preferences for automatic recognition. For example,
    click the Cameras tab and check the box next to Import digital photographs when
    connected.


    +   3. Click Close when finished.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Manually Adding Hardware to the SUSE Linux Enterprise Desktop


    Occasionally, you may add hardware that is not automatically recognized by the
    SUSE Desktop. When this occurs, you will need to manually add and configure the
    hardware. Follow these steps to do this:


    +   1. Select Computer | Control Center | System | YaST.

    2. Enter the root password and click Continue.

    3. Select Hardware from the left side of the YaST Control Center.


    ![](img/04bf849117b7b93d509c3755c065ff54_161_0.png)


    +   4. Click the icon associated with the hardware you wish to add. For example,
    if you have connected a scanner to your system but it is not running automatically,
    click Scanner.

    5. The YaST terminal will then scan your system in search of all applicable hardware.
    All detected hardware will be listed in the display. Because your device did not
    run, it will likely not be found in this list.


    ![](img/04bf849117b7b93d509c3755c065ff54_161_1.png)


    +   6. Click Add to manually locate and configure your scanner.'
