  md: '# Creating a Hyperlink


    You can include hyperlinks in your presentation. These are used to link to an
    Internet site, another file on your computer, or an e-mail address.


    To insert a hyperlink:


    +   1. Select Insert | Hyperlink, OR click the Hyperlink icon on the Standard
    toolbar.

    2. The Hyperlink dialog will display.


    ![](img/04bf849117b7b93d509c3755c065ff54_426_0.png)


    +   3. In the left pane of the Hyperlink dialog, determine what kind of link you
    want to create.

    4. In the Target field, enter the target URL or e-mail address.

    5. Browse for other files or presentation elements, depending on the kind of link
    you want to create.

    6. You can click the WWW Browser icon to launch a Web browser and search for a
    specific URL.

    7. In the Frame field under Further settings, determine if and how you want to
    frame your hyperlink.

    8. In the Form field, determine whether you want your hyperlink to appear as text
    or as a button.

    9. In the Text field, enter how you want the hyperlinked text to appear.

    10. If you want to give your hyperlink a specific name, enter it in the Name field.

    11. Click Apply to return to your slide.'
