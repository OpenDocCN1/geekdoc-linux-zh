  md: '# Using the Command Line


    # Chapter Objectives


    +   - Learn how to access the command line in the SUSE Linux Enterprise Desktop.

    - Access information about your operating system and its version.

    - Understand common commands.


    # Accessing the Command Line


    When you perform administrative tasks, you may need to access some programs or
    settings from the command line. You can access the command line from the SUSE
    Linux Enterprise Desktop two ways.

    To access a command line using the terminal:


    +   1. Right-click the desktop and select Open Terminal, OR select Computer |
    More Applications | System | Gnome Terminal.

    2. Enter the command or commands you need to.

    3. Type the command exit to exit the terminal session and close the terminal window,
    OR select File | Close, OR click the X button.


    ![](img/04bf849117b7b93d509c3755c065ff54_144_0.png)


    When you do not need to receive output from a command, you can run it in the Run
    Program dialog. Follow the steps below to run a single command:


    +   1. Press Alt+F2.

    2. Enter the command in the blank field, OR to run a command you''ve run previously,
    click the arrow beside the blank field and choose a command.


    ![](img/04bf849117b7b93d509c3755c065ff54_144_1.png)'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Section 4: Performing Administrative Tasks


    +   1. Click the **Run with file** button to choose a file to append to the command
    line.


    ![](img/04bf849117b7b93d509c3755c065ff54_145_0.png)


    +   2. Click *Show list of known applications* to choose from a list of applications
    to run.


    +   3. To run a program without the graphical user interface, check the *Run in
    terminal* box.


    +   4. Click Run.


    # Accessing Operating System and Version Information


    You can use a command line in the terminal window to access information about
    your operating system and what version you are running. To do so, follow these
    steps.


    +   1. Open a terminal by right-clicking the desktop and selecting **Open Terminal**.


    +   2. In the terminal, enter this command: `cat /etc/SuSE-release` (because Linux
    is sensitive, make sure your command matches the show:)


    ![](img/04bf849117b7b93d509c3755c065ff54_145_1.png)


    +   3. Press Enter.


    +   4. The system you are running and its version will appear on the next two
    lines.


    +   5. Type **exit** to close the terminal.'
  merge: -1
