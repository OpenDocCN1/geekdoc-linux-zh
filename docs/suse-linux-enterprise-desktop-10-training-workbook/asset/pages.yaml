  md: '# Browsing with Tabs


    # Chapter Objectives


    +   - Explain reasons to use tabs browsing.

    - Open and close tabs.

    - Move among tabs.

    - Reposition tabs on the tabs panel.


    # Using Tabbed Browsing


    Tabbed browsing is a Firefox feature that lets you view several Web pages within
    one Firefox window. Each Web page can open in a tab instead of a separate window.
    You can open links in a new tab, open a Web site in a new tab, and even bookmark
    a group of tabs. You can view your tabs and switch between them using the Tab
    bar below the Bookmarks toolbar. (The Tab bar will not appear until you have at
    least two tabs. To change this feature, select Edit | Preferences and select Tabs.)


    ![](img/04bf849117b7b93d509c3755c065ff54_273_0.png)


    # Opening and Closing Tabs


    To open a new tab, select File | New Tab, OR press Ctrl+T. A new, blank tab will
    open. You can then type in the address or search word in the Location bar.


    To open a link on a Web site in a new tab and load it in the background, press
    and hold Ctrl as you click the link.


    To close a tab, click the icon in the right-hand corner of the Tab bar or press
    Ctrl+W.


    To change and how tabs open, select Edit | Preferences and click the Tabs icon.
    Choose your preferences from the options provided.


    # Moving Among Tabs


    When you have several tabs, sometimes it''s easier to use keyboard shortcuts to
    toggle between them. You can jump from one tab to the next by pressing Ctrl+Tab
    or Ctrl+Page Up or Ctrl+Page Down.'
  merge: -1
  pgno: 273
- img_proc: true
