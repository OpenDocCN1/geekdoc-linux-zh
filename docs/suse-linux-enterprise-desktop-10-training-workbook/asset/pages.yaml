  md: "# Searching for Messages\n\nEvolution's advanced Search index engine makes\
    \ searching for messages in Evolution faster than in other e-mail programs. You\
    \ can also create a folder, called a search folder, to store and update searches\
    \ you perform often.\n\n# Using the Search Tool\n\nFollow the steps below to use\
    \ the Search tool—which is found under the toolbar in the main window—to perform\
    \ simple message searches:\n\n+   1. Choose a search type from the drop-down list.\
    \ The following search types are available:\n   - **Subject or Sender contains:**\
    \ Finds messages that contain the search text in the *Subject* header or the *From*\
    \ header.\n   - **Recipients contain:** Finds messages with *To* and *Cc* headers\
    \ that contain the text.\n   - **Message contains:** Finds messages that contain\
    \ the search text in the message body or header lines.\n   - **Subject contains:**\
    \ Finds messages that contain the search text in the subject line.\n   - **Sender\
    \ contains:** Finds messages with a *From* header that contains the text.\n  \
    \ - **Body contains:** Finds messages that contain the search text in the message\
    \ body, not the header lines.\n2. Type a word or phrase in the Search tool's text\
    \ area.\n3. Press Enter, OR click the Find Now button.\n4. Messages that match\
    \ your search parameters will appear in the Message List.\n5. To perform a more\
    \ advanced search, select **Advanced Search** from the search-type drop-down list\
    \ and specify additional search options. Click *OK* when finished.\n\n| Subject\
    \ contains | fishing | Find Now | Clear |\n\n# Using Search Folders\n\nIf you\
    \ often perform the same search, you may find that creating a search folder is\
    \ easier than using the search tool each time. A search folder doesn't actually\
    \ contain messages, instead it is a tool that allows you to view messages that\
    \ meet specific criteria. A single message may be visible in several"
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Section 9: Communicating and Collaborating


    folders, depending on their criteria. Search folders can help you stay more organized
    by grouping your messages according to a certain subject, sender, recipient, or
    mailing list.


    The following example may help you better understand the reasons to search folders.
    Assume you often get e-mails from a co-worker named Brian. Because Brian''s messages
    are usually important and you are also able to access them at any time, you create
    a search folder for Brian. You are also working on an important project to research
    unemployment rates in your area, so you create a search folder to contain all
    the messages that have “unemployment” in the subject. If Brian sends you a message
    about unemployment rates, this message will appear both in the Brian search folder
    and the Unemployment Rates search folder.


    To create a search folder:


    +   Select Message | Create Rule and select Search Folder from Subject, Search
    Folder from Sender, or Search Folder from Recipients.


    +   The New Search Folder window will open, with the Search name field filled
    in.


    +   If you''d like to include threads (replies to the original message), use the
    drop-down arrows in the In Threads box to select the type of threads to search.


    +   In the Find Items box, specify whether you want to find items if any criteria
    are met or if all criteria are met.


    +   Use the drop-down menu in the first column to specify which part of the message
    you want to search.


    +   Use the drop-down menu in the second column to specify options such as, “contains,”
    “does not contain,” “is,” “is not,” and so on.


    +   Enter the corresponding text in the field in the third column.


