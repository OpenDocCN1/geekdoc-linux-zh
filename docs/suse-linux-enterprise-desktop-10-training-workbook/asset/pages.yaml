    The attributes available for editing are Area, Shadow, Transparency, Colors, Gradients,
    Hatching, and Bitmaps.


    +   2. When all desired changes have been made, click OK.


    # Adding and Editing 3-D Effects


    To add a 3-D object:


    +   1. Click the arrow next to the 3D Objects icon on the Drawing toolbar. (If
    the icon is not visible, click the drop-down arrow on the right of the Drawing
    toolbar. Select Visible Buttons | 3D Objects.)


    +   2. Select the desired 3-D object.


    +   3. On your slide, place your cursor where you want the object to appear. Click
    and hold the left-mouse button.


    +   4. Drag the mouse to size the object.


    +   5. Release the mouse button. The object will now display.


    To edit a 3-D object:


    +   1. Right-click the object and select 3D Effects.


    +   2. Click the buttons at the top of the dialog to access features associated
