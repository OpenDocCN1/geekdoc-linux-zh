  md: '# Section 7: Managing Photos with F-Spot


    3. Enter a name for the new tag.


    ![](img/04bf849117b7b93d509c3755c065ff54_245_0.png)


    4. Click OK.


    5. When you create a new tag, the first photo you attach to it becomes its icon.
