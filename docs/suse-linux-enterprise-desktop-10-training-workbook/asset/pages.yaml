    Hold the Ctrl key and drag the fill handle to repeat cell contents. This will
    work with text and figures.


    Drag the fill handle for a list of days.


    Drag the fill handle for a list of months.


    Note: To copy a formula across cells, select the cell containing the formula and
    drag the fill handle over neighboring cells.


    # Printing Worksheets


    To avoid printing unnecessary parts of a sheet:


    +   1. Define a print range by selecting the cells you would like to print.

    2. Select Format | Print | Ranges | Define.

    3. If you want to be sure you''ve selected the proper range, select File | Page
    Preview Select File | Page Preview again to return to your spreadsheet.

    4. Select Print. The Print window will appear.

    5. Under Print range, click Selection.

    6. Click OK to print the specified part of the spreadsheet.'
