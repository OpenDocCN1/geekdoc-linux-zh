  md: '# Managing Spreadsheets with OpenOffice.org Calc


    # Using Spreadsheets


    OpenOffice.org Calc allows you to organize data using multiple spreadsheets that
    can contain up to 65,536 rows and 256 columns. When you open Calc, the following
    window is displayed:


    ![](img/04bf849117b7b93d509c3755c065ff54_380_0.png)


    Rows are organized numerically. Columns are organized alphabetically. Each cell
    has a unique column and row identifier according to its column number and row
    number. For example, the cell selected above is A1.


    # Creating and Opening Spreadsheets


    It''s easy to create or open a file from your current spreadsheet in OpenOffice.org
    Calc.


    To create a new spreadsheet:


    Click the drop-down arrow on the New button in the Standard toolbar and select
    Spreadsheet, OR select File | New | Spreadsheet.


    To open an existing spreadsheet:


    +   1. Click the Open button on the Standard toolbar, OR select File | Open.

    2. In the Open window, navigate to the file you want to open and select it.

    3. Click Open, OR double-click the selected file to open it.'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # Saving Spreadsheets


    OpenOffice.org Calc allows you to save your spreadsheet in OpenOffice.org format
    as well as in a variety of other formats. To save your spreadsheet:


    +   1. Select File | Save As.

    2. Enter a name for your spreadsheet in the Name field.

    3. In the Save folder field, select the directory in which you want to save your
    spreadsheet, OR Click Browse for other folders to view and select another directory
    for your document.

    4. Click File type to select an application type for your spreadsheet (you can
    select Microsoft Excel or a number of other spreadsheet formats), OR check Automatic
    name extension to save the spreadsheet as an OpenOffice.org (.ods).


    ![](img/04bf849117b7b93d509c3755c065ff54_381_0.png)


    +   5. Click Save. Your spreadsheet''s filename will appear in the Sheet Title
    bar at the top of the spreadsheet.


    # Renaming and Arranging Spreadsheets


    You can change the name of a spreadsheet and reorder the sheets in your tabbed
    view.


    To change the name of a sheet:


    ![](img/04bf849117b7b93d509c3755c065ff54_381_1.png)


    +   1. Double-click the sheet tab, OR right-click the tab and select Rename Sheet.

    2. In the Rename Sheet window, enter the new name.

    3. Click OK.


    To change sheet order, select the tab you want to move and drag it to the desired
    location.


    # Adding and Deleting Spreadsheet


    To add a new sheet:


    +   1. Right-click the sheet tab and select Insert Sheet, OR select Insert | Sheet.'
