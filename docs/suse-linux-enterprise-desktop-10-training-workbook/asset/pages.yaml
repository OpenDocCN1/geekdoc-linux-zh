  md: '# Creating Presentations in OpenOffice.org Impress


    ![](img/04bf849117b7b93d509c3755c065ff54_418_0.png)


    # Adding Draw Objects


    To add Draw objects to your presentation:


    +   1. Click the icon on the toolbar that represents the object you want to add.
    For example, to add a basic shape, click the drop-down arrow on the Basic Shapes
    icon.

    2. Select the desired shape.

    3. On your slide, place your cursor (which is now a cross-hair pointer) where
    you want the shape to appear. Click and hold the left-mouse button.

    4. Drag the mouse to size the object.

    5. Release the mouse button. The shape will now display.


    # Editing Draw Objects


    The Line and Filling toolbar displays buttons you can use to alter an object''s
    fill color, line style, pattern, and shadow effect. (See page 392, Toolbars.)
    Simply select the object in your slide and click the appropriate button to make
    changes.


    To change several object attributes at once:


    +   1. Click the object in your slide to select it.

    2. Click the Area icon on the Line and Filling toolbar.


    403'
