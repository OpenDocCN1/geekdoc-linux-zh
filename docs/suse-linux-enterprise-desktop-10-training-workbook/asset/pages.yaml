  md: '# Searching with Tags


    If you have attached tags to your photos, you can easily search through your selection
    to find specific categories of photos. To do so:


    +   1. Make sure the Browse button is selected on the toolbar.


    +   2. To search for one category, check the box next to that tag in the sidebar.
    Only photos that have been tagged with that tag will appear in the thumbnail window.
    You can perform the same action by selecting Find | Find Tag.


    ![](img/04bf849117b7b93d509c3755c065ff54_246_0.png)


    +   3. To search for more than one category, check additional boxes.


    +   4. To clear your search and see all of your photos again, click the Stop button.


    # Using the Timeline


    Another way to search is with the timeline, a handy feature unique to F-Spot.
    Located above the thumbnail window, the timeline acts as a bar graph, showing
    in which months the most pictures were taken. You can drag the frame to a certain
    month to see all the photos taken that month. Hold down the left mouse button
    to view the month name and the number of photos.


    ![](img/04bf849117b7b93d509c3755c065ff54_246_1.png)'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Section 7: Managing Photos with F-Spot


    You can arrange your timeline by month or by the folders your photos are saved
    in. To change this preference, select View | Arrange by. Select View | Reverse
    Order to change the direction of your timeline (left-to-right or right-to-left)
    as well as the order in which your thumbnails appear in the window.


    You can also select a date range to narrow down the photos you want displayed.
    Select Find | Set Range and select a start date and an end date. When you click
    OK, only the photos in your new date range will be shown in the thumbnail window.


    # Practice


    +   1. Attach tags to the photos in your collection. (See page 229, Attaching
    Tags.)

    2. Create a subset tag and attach it to one of your photos. (See page 229, Creating
    New Tags.)

    3. Remove a tag from one of your photos. (See page 230, Removing a Tag.)

    4. Search for the photos you have tagged as favorites. (See page 231, Searching
    with Tags.)

    5. Clear your search so that all your photos reappear. (See page 231, Searching
    with Tags.)

    6. Search for photos from a particular month. (See page 231, Using the Timeline.)

    7. Change the date range of your displayed photos. (See page 231, Using the Timeline.)


    # For More Information


    +   * Visit www.novell.com/linux

