  md: '# Configuring and Using VoIP


    # Chapter Objectives


    +   - Understand Voice over IP (VoIP) technology.

    - Understand VoIP terminology.

    - Learn how to configure VoIP services, including Linphone, and use the sipomatic
    test feature.

    - Add the Linphone applet to your panel.

    - Use VoIP to place and receive voice calls.


    # Understanding Voice over IP (VoIP) Technology


    Voice over Internet Protocol, or VoIP, is technology that allows users to transmit
    telephone calls over the Internet. With VoIP, voice data is sent in packets using
    IP formats rather than standard phone lines.


    One benefit of this service is its cost-saving abilities. With VoIP, you do not
    need to use your phone company to place a long-distance call; you simply place
    the call over the Internet and because your Internet service does not differentiate
    between locations to which calls are routed, you incur no extra charges for a
    long-distance call.


    For VoIP features to work in the SUSE Linux Enterprise Desktop, you will need
    to do the following:


    +   1. Understand VoIP terminology. (See below, Understanding VoIP Terminology.)

    2. Configure Linphone, the application used for VoIP calls. (See page 192, Configuring
    Linphone.)

    3. Test your Linphone configurations using sipomatic, the test program that can
    answer calls placed with the Linphone. (See page 193, Testing Linphone Configurations.)

    4. Add the Linphone applet to your panel so it runs continually in the background
    of your system. (See page 194, Adding the Linphone Applet to Your Panel.)


    # Understanding VoIP Terminology


    The following definitions will be helpful as you configure Linphone and begin
    using VoIP technology:'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Section 5: Networking


    SIP: SIP is an acronym for session initiation protocol. SIP is the language used
    to establish VoIP sessions. It tells the phone to ring at the receiving computer
    and sends a signal to initiate your call and terminate the call when you hang
    up.


    SIP URL: The SIP URL is the identifying "address" of each party involved in the
    data call. The SIP URL is much like an e-mail address. Two examples of a SIP URL
    are shown below:


    ```

    sip:username@hostname—the username is the login name of the user, the hostname
    is the name of the user''s computer (the IP address).

    ```


    ```

    sip:username@psipserver—the username is the name chosen when registering with
    a sip service provider; psipserver is the address of the sip server or your sip
    provider.

    ```


    RTP: RTP is an acronym for real-time transport precoi. RTP handles the data packets
    transferred across the Internet when you place a call.


    Codec: A codec converts the digital signal sent by your computer to an analog
    signal that can be received by a standard telephone, and vice versa.


    # Configuring Linphone


    To configure Linphone, follow these steps:


    +   1. Select Computer | More Applications | Communicate | Linphone.


    ![](img/04bf849117b7b93d509c3755c065ff54_207_0.png)


    +   2. Click Go and select Preferences.


    ![](img/04bf849117b7b93d509c3755c065ff54_207_1.png)


    +   3. The Parameters window will open, with the Network tab displaying. The default
    settings will work for most users and should not be changed.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Configuring and Using VoIP


    +   4. Click the **Sound Device** tab to determine a recording source (usually
    a microphone) and select a custom ring tone, if desired.


    ![](img/04bf849117b7b93d509c3755c065ff54_208_0.png)


    +   Accept to apply any changes made here.


    +   5. Click the SIP tab to configure all sip settings.


    +   6. The default sip port is 5060. Do not change this without consulting your
    system administrator.


    +   7. Your identity is your sip address. Enter that address here. Check the box
    to **Automatically guess a valid hostname** (this is your computer''s IP address.)


    +   8. In the **Remote services** area, you can click **Add proxy/registrar**
    to enter information about any sip service providers you are registered with.
    Highlight an entry and click **Edit** or **Remove** to perform the associated
    function.


    +   9. If, for security purposes, you want to clear saved information about your
    sip service, passwords, or usernames, click this button:


    +   10. Click **Apply.**


    +   11. Click the **Codecs** tab to view the codecs used to transmit voice data.


    +   12. Click **OK** when all settings are complete.


    # Testing Linphone Configurations


    Before using Linphone for the first time, you should test your settings. This
    is done with a test program called sipomatic. To use sipomatic, follow these steps:


    +   1. Open a terminal window by clicking the desktop background and selecting
    **Terminal.**


    +   2. Enter the command `sipomatic`.


    +   3. Press **Enter.**'
