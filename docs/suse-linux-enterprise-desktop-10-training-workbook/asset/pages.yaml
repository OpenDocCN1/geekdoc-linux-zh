  md: '# Section 9: Communicating and Collaborating


    # Replying to Sender


    To reply to the sender of a message:


    +   1. From the Message List of the Evolution window, select the message you wish
    to reply to.

    2. Click the Reply button to open the reply window.

    3. The *To* and *Subject* fields are already populated, and the previous message
    is included in the new message body.

    4. Type your reply to the message.

    5. Click *Send.


    To reply to both the sender and other recipients of a message:


    +   1. From the Message List of the Evolution window, select the message you want
    to reply to.

    2. Click the *Reply to All* button to open the reply window.

    3. The *To* and *Subject* fields are already populated, and the previous message
    is included in the new message body.

    4. Type your reply to the message.

    5. Click *Send.


    # Forwarding Messages


    To forward a message as an attachment:


    +   1. From the Message List of the Evolution window, select the message you want
    to forward.

    2. Click the *Forward* button to open the forward window.


    ![](img/04bf849117b7b93d509c3755c065ff54_305_0.png)


    +   3. Enter the e-mail address of the recipients in the *To* field. The *Subject*
    field is already populated.'
