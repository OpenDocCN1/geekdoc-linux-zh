  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # Using OpenOffice.org Writer


    # Chapter Objectives


    +   - Explore the OpenOffice.org Writer window.

    - Open and create new documents.

    - Navigate documents.

    - Save documents and export documents to PDF.

    - Format pages, paragraphs, and characters in Writer.

    - Use and create styles to customize your documents.

    - Use text features, such as hyperlinks, special characters, footnotes and endnotes,
    and find replace services, and the clipboard.

    - Create tables and charts for your document.

    - Use, edit, and insert graphics in your document.

    - Use the Draw feature.

    - Record changes to a document.

    - Use Spellcheck and AutoCorrect features.

    - Print documents, envelopes, and labels.


    # Exploring the OpenOffice.org Writer Window


    The main window of OpenOffice.org Writer contains all the tools you need to create
    and format a professional document.


    The definitions on the following page should help you understand each element
    of the OpenOffice.org Writer window.


    While working in Writer, you can move your mouse over any icon or button to view
    a quick description of that object.'
