    **G. Print:** Click to print a spreadsheet. To set up your printing options, select
    **Tools | Options | OpenOffice.org Calc | OK AND Format | Print Ranges | [Range
    you wish to print].


    **H. Page Preview:** Click to view the spreadsheet as it will appear on the printed
    page.


    **I. Spellcheck:** Click to run a spelling check for your spreadsheet.


    **J. AutoSpellcheck:** Click to enable automatic corrections of spelling mistakes.


    **K. Cut:** Click to cut, or delete, a selected item.


    **L. Copy:** Click to make a copy of a selected item.


    **M. Paste:** Click to paste an item you have cut or copied. Click the arrow to
    the right to see select items on the clipboard.


    **N. Format Paintbrush:** Click to copy formatting from selected text or objects
    and paste on other text or objects.


    **O. Undo:** Click to undo the last action.


    **P. Redo:** Click to redo the last action.


    **Q. Hyperlink:** Click to create a hyperlink, or cross-reference, to text, graphics,
