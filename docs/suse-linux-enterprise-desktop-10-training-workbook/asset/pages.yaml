  md: '# Creating Presentations in OpenOffice.org Impress


    +   18. Alter your color scheme by clicking the buttons to adjust text, hyperlink,
    active link, visited link, and background colors. Click OK after each selection.


    +   19. Once you have specified your settings, click Create.


    +   20. Name your HTML design.


    +   21. Click Save.


    To view the HTML version:


    +   1. Open your web browser and select File | Open File.


    +   2. Browse to the directory and select your file.


    +   3. Click Open.


    +   4. The title page you created will display.


    +   5. Select Click here to start to view the presentation.


    # Practice


    +   1. Open a new presentation from a template. (See page 393, Opening a New Presentation.)


    +   2. Change the character style on your Slide Master. (See page 396, Customizing
    Your Presentation in the Master View.)


    +   3. Change the background of your slides in the Master view. (See page 396,
    Customizing Your Presentation in the Master View.)


    +   4. Create a new textbox. (See page 399, Designing Your Presentation.)


    +   5. Choose an object from the Gallery and insert it into your presentation.
    (See page 399, Designing Your Presentation.)


    +   6. Add a basic shape to your presentation. (See page 402, Using Draw Objects.)


    +   7. Add a 3-D object to your presentation and change its texture. (See page
    402, Using Draw Objects.)


    +   8. Add a chart to your presentation. (See page 405, Using Charts.)


    +   9. View your presentation in Slide Sorter view. (See page 407, Working with
    Slides.)


    +   10. Set your slide transitions so they all wipe left at medium speed. (See
    page 407, Working with Slides.)'
