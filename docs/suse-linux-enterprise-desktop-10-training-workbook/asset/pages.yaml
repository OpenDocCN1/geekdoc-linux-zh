  md: '# Comparing Windows and Linux


    +   4. Linux executable files don''t have an EXE extension. In fact, many files
    don''t have any extension at all.

    In Linux you can recognize an executable file if the "execute" permission is set.
    (For more information about setting file permissions, page 96, Setting Permissions.)


    ![](img/04bf849117b7b93d509c3755c065ff54_20_0.png)


    +   5. The Linux administrator is called root. In install or remove software,
    to mount devices, and to perform other administrative tasks, you must have "root"
    privileges. Whereas in Windows there can be several administrator accounts, in
    Linux there is only one root. In many ways, Linux’s root account acts as a failsafe.
    Without logging in as root, a user cannot make any changes that will harm the
    system.


    +   6. The SUSE Linux Enterprise Desktop graphical interface is not part of the
    operating system. You cannot install Windows without installing its graphical
    user interface. Because the graphical user interface in Linux is not part of the
    operating system, you can install it with or without the user interface and choose
    a variety of graphical interfaces. In the SUSE Linux Desktop, you can choose either
    the GNOME or KDE desktop.


    ![](img/04bf849117b7b93d509c3755c065ff54_20_1.png)


    # Defining Uniquely Linux Terms


    Now that we have made some distinctions between Linux and Windows, you should
    be a few steps closer to being familiar with Linux. To truly feel comfortable,
    however, you must learn to speak the Linux language. Below are some terms you
    should know:


    applet: a small program that is like an application. It performs a specific function
    but is not as comprehensive as an application. On the SUSE Linux Enterprise Desktop
    10, you can add applets to panels, then simply click the applet to open the function.


    command line interface (CLI): A full-screen or windowed text-mode session where
    the user executes programs by typing commands. It also displays the output text
    from the operating system or'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Section 1: Getting Started


    program. SUSE Linux Enterprise Desktop 10 functions and programs can be accessed
    through a CLI. A command line interface may also be called a terminal or a shell.


    Evolution: The GNOME collection of personal information management tools. It includes
    e-mail, calendar, contact, and other communications facilities.


    Gimp (GNU Image Manipulation Program): An image manipulation program for photo
    retouching, image composition, and image authoring. This is included on the SUSE
    Linux Desktop.


    GNOME (GNU Network Object Model Environment): A Linux desktop designed to be complete,
    user-friendly, and based entirely on free software. The desktop consists of small
    utilities and larger applications that share a consistent look and feel. GNOME
    is the desktop used in the SUSE Linux Enterprise Desktop.


    GNU: A recursive acronym for “GNU’s Not Unix!”. GNU is a project to replace Unix
    with free software projects. Many components included in a Linux distribution
    are GNU tools.


    GPL (General Public License): Licenses given by GNU for free sharing and distribution.


    GUI (Graphical User Interface): A picture-like control panel or screen that makes
    a computer or presentation system easy to use. GUIs are typically navigated with
    a mouse and pull-down dialog boxes, check boxes, radio buttons, drop-down lists,
    scroll bars, and scroll boxes.


    KDE (K Desktop Environment): One of several graphical user interfaces for Linux.
    Originally designed for Unix, this desktop has familiar, user-friendly features.
    Its strength lies in the interoperability of its components. KDE is one of the
    graphical user interfaces available for the SUSE Linux Enterprise Desktop.


    kernel: The fundamental part of an operating system that handles resource management,
    process control, and input/output support.


    mount: The command to identify a disk drive to the file system before use. You
    must mount a floppy or USB drive in Linux. Other drives, such as network and hard
    drives, are automatically mounted at startup.


    Nautilus: The name of the file manager for the GNOME desktop.


    newbie (gnubie): Someone who is new to Linux.


    OpenOffice.org: An open source, community-developed, multi-platform office productivity
    suite that includes key desktop applications—a word processor, a spreadsheet,
    and a presentation manager with user interfaces similar to other office suites.


    Open source: The term coined in March 1998 following the Mozilla release to describe
    software distributed in source code under licenses guaranteeing anybody to freely
    use, modify, and redistribute the code. The intent is to be able to halt hackers
    ways of programming software to the industry and the mainstream by avoiding the
    negative connotations of the term “free software.”'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'proprietary: Synonym for closed-source (software issued in binary without source
    and under a restrictive license). It is possible for software to be commercial
    (intended to make a profit) without being proprietary.


    root directory: The top-level directory on the Linux system disk.


    root operator: The user ID on a Linux system with authority to perform all system-level
    tasks. Only the root operator can install software or configure the system.


    superuser: The name of the penguin that is the official emblem of Linux.


    username: A unique “name” by which each user is known to the system. This name
    is given to users whenever they register to the system.


    virtual desktop: A way to reduce clutter on a user’s screen by expanding the available
    space beyond the actual screen boundaries. The SUSE Linux Enterprise Desktop contains
    multiple virtual desktops in a 3-D cube format.


