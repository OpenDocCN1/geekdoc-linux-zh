    # Setting Power Management Preferences


    Whether you are using a desktop or laptop, you will likely need to manage power
    settings on your SUSE Linux Enterprise Desktop system. To access and modify these
    settings, follow the steps below:


    +   1. Select **Computer | Control Center | System | Power Management**.

    2. Select the **Running on AC** or **Running on Battery** tab to change sleep
    settings for either power option.

    3. Slide this bar up and down to tell the **display**, or monitor, when to sleep.
    In this example, the monitor will go to sleep—meaning, the screen will go blank—after
    30 minutes of inactivity. (The computer will keep running).

    4. Slide this bar to tell the **computer** when to go to sleep—meaning, the computer
    will shut down—after a certain length of inactivity. In this example, the computer
    will not go to sleep after any length of inactivity.

    5. Click the **General** tab to define additional power settings, as shown on
    page 67.


