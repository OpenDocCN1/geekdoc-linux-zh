    # Using Spellcheck


    OpenOffice.org Writer enables you to search for and correct misspellings throughout
    your document. To access the Spellcheck feature, select Tools | Spellcheck, OR
    click the Spellcheck icon on the toolbar, OR press F7.


    Use the Spellcheck dialog to change or ignore corrections throughout your document:


    +   * Click Ignore Once to ignore a suggested correction one time.

    * Click Ignore All to ignore a suggestion every time it occurs.

    * Click Add to add the word to Writer''s dictionary.

    * Click Change to make a suggested correction.

    * Click Change All to make the same correction throughout the dictionary.

    * Click Close to close the Spellcheck dialog.


    ![](img/04bf849117b7b93d509c3755c065ff54_368_0.png)


    # AutoSpellcheck


    The AutoSpellcheck function alerts you to misspellings as you type. To activate
    this feature, click the AutoSpellcheck icon on the Standard toolbar. A wavy red
    line will appear underneath suspect words.'
