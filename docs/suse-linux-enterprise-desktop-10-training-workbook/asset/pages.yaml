  md: '# Section 9: Communicating and Collaborating


    # Managing Contacts with Evolution


    # Chapter Objectives


    +   - Create contacts.

    - Create a contact list and a contact group.

    - Import contacts.

    - Search for contacts.


    # Creating Contacts


    Evolution allows you to stay organized by creating a detailed profile for all
    your contacts. Once you create contacts, you can easily send messages or schedule
    appointments with those people. In Evolution, contacts are called cards.


    To view and edit your contacts, click the **Contacts** shortcut button located
    in the bottom left-hand section of Evolution''s main window.


    Below is an overview of the Contacts main window.


    ![](img/04bf849117b7b93d509c3755c065ff54_317_0.png)'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Managing Contacts with Evolution


    You can create new contacts in two ways: (1) from the e-mail addresses connected
    to messages or appointments you have received and (2) by clicking the **New**
    button in the Contacts main window.


    To create a new contact card from a message or appointment you have received:


    +   1. Open the message that contains the e-mail address you want to save.

    2. Right-click the hyperlinked address and select **Add to Address Book**.

    3. Enter the contact''s full name.

    4. Select an address book.

    5. To add more detailed information in the Contact Editor, click **Edit Full**,
    add your information, and click OK.

    6. If you just want to add a name and e-mail address and select an address book,
    click OK after step 4.


    To create a new contact card from the Contacts:


    +   1. Click **New**. This opens the Contact Editor.

    2. Use the Contact Editor to enter information about your contact.


    **Image:** If you would like to include a picture of your contact, click the generic
    image box to open a browser window and find your image file.

    **Full Name:** Enter the full name of your contact. Click the **Full Name** button
    to enter titles and suffixes.

    **Nickname:** Enter the nickname of your contact. Evolution will identify this
    contact with this nickname when you are composing e-mail.


    **File under:** Select how you want Evolution to file this contact.


    **Where:** Select one of your address books as the location for this contact.


    ![](img/04bf849117b7b93d509c3755c065ff54_318_0.png)'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Section 9: Communicating and Collaborating


    **Categories:** Click the Categories button and select one or more categories
    for this contact. You can arrange your contacts by category to organize and view
    a list of contacts that fit a specific category.


    **E-mail:** Enter up to four e-mail addresses for each contact. Use the buttons
    next to each field to select the type of e-mail account. Enter an e-mail address
    for your contact in each field. If your contact wants to receive HTML-formatted
    messages, check the corresponding check box.


    **Telephone:** Enter up to four phone numbers for each contact. Use the buttons
    next to each field to identify each phone number, and enter the phone numbers
    into each field. If you want to enter a fax number, a pager, and two other telephone
    numbers, click the arrow next the **Telephone** heading to open more options.


    **Instant Messaging:** Use the buttons next to each field to identify the type
    of instant messaging service, and enter the screen name of your contact in the
    appropriate field.


    +   1. Click the **Personal Information** and **Mailing Address** tabs to enter
    additional information about your contact.

    2. Click **OK**.


    To change any information about a contact at any time, double-click the name in
    your Contact Card list. The Contact Editor will open, allowing you to make changes.


    # Creating Contact Lists and Groups


    To help with organization, Evolution allows you to create contact lists and contact
    groups. A contact list is a group that is composed of multiple contacts. It is
    most often used to e-mail several people at once. A contact group is like a separate
    address book of contacts.


    To create a contact list:


    +   1. From the Contacts main window, click the arrow on the **New** button and
    select **Contact List**, **OR Select File | New | Contact List**, or press **Shift+Ctrl+L**.

    2. Enter the name of the contact list in the **List name** field.

    3. Enter the e-mail addresses of the individuals in the list or drag a contact
    into the field from the main window.

    4. Click **Add** after making each entry.


    ![](img/04bf849117b7b93d509c3755c065ff54_319_0.png)


    *'
