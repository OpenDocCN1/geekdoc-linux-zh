  md: '# # Configuring a Modem Connection


    # ## Chapter Objectives


    +   - Learn how to set up a modem connection on the SUSE Linux Enterprise Desktop.


    # ## Setting Up a Modem Connection


    Users who have an external DSL modem with an Ethernet connection should be able
    to simply connect the modem and enter its IP address in their Web browser to configure
    the modem.


    To configure other modem connections, follow these directions:


    +   1. Select Computer | Control Center | Hardware | Modem.


    ![](img/04bf849117b7b93d509c3755c065ff54_196_0.png)


    +   2. Enter the root password and click Continue.


    +   3. The Modem Configuration Overview screen will display.


    ![](img/04bf849117b7b93d509c3755c065ff54_196_1.png)


    +   4. The first step is to configure the modem device. Make sure the Modem Devices
    tab is selected and click Add.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Section 5: Networking


    5. Use the drop-down arrow in the Modem Device field to specify your modem device.
    This is the port to which your modem is connected. It is likely that you''ll select
    the default option: `/dev/modem`.


    ![](img/04bf849117b7b93d509c3755c065ff54_197_0.png)


    6. Enter a Dial Prefix if needed. This number is usually 9 or 0 and is the number
    you dial to reach an outside line.


    7. Choose the Dial Mode. This mode is based on your phone link. Most phones use
    Tone Dialing.


    8. In the Special Settings box, you can specify to turn on your modem''s speaker
    and for your modem to wait for a dial tone before connecting.


    9. Click Details to configure additional settings, such as the modem''s baud rate.


