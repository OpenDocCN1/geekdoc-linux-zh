    # Working with Styles


    The default configurations in OpenOffice.org Writer are standard among most word
    processor applications. These settings are stored as styles. The status bar at
    the bottom of the Writer window identifies the style being used or selected in
    the document. The three preceding objectives described how to manually change
    style settings as you work on your document.


    If you''d like to use more advanced features in OpenOffice.org Writer, such as
    creating automatic indexes, formatting tables of contents, and so on, you must
    apply styles to your document instead of formatting every item manually. The easiest
    way to apply styles is to use the Stylist.


    To open the Stylist, select Format | Styles and Formatting. OR click the Styles
    and Formatting button, OR press F11.'
