  md: '# Section 9: Communicating and Collaborating


    # Setting Appointments


    When you schedule an event for yourself in Evolution, it is called an appointment.
    If you invite others to your appointment, it is called a meeting. You can create
    a new appointment by double-clicking a time slot in your Appointment view area
    and entering information in the appointment window. You can also create an appointment
    by following these steps:


    +   1. From the Calendars window, click the New button. This opens the Appointment
    window.


    ![](img/04bf849117b7b93d509c3755c065ff54_325_0.png)


    +   2. Select which calendar this appointment belongs in.


    +   3. Enter a summary of the appointment in the Summary field.


    +   4. Enter the location of the appointment in the Location field.


    +   5. Enter the time and duration of the appointment.


    +   6. Click the Alarm icon if you want an alarm to remind you of this appointment.
    To set preferences for this alarm, click the Alarms button on the Appointment
    window toolbar.


    +   7. Enter a description of the appointment in the Description field.


    +   8. If the appointment is an all-day event, click the All Day Event button.


    +   9. If the appointment is a recurring event, click the Recurrence button. A
    new window will opening asking for specifics.


    +   10. The default classification is Public. If you want to classify this appointment
    as Private or Confidential, select Options | Classification | Public | Confidential.'
