  md: '# Exploring Firefox


    # Chapter Objectives


    +   - Open Mozilla Firefox.

    - Become familiar with the Firefox layout.

    - View your browsing history using the Go menu.


    # Opening Mozilla Firefox


    To open Firefox, click the Computer button and select Firefox. If Firefox does
    not appear in your main menu, click the More Applications button and browse to
    its location.


    # Learning the Browser’s Layout


    The Firefox window has much the same look and feel as other Web browsers. It includes
    common navigation tools, bookmarks, and a Location bar for Web entries.


    ![](img/04bf849117b7b93d509c3755c065ff54_260_0.png)'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Section 8: Browsing the Web with Firefox


    **Menu Bar:** Access the browser menus with this toolbar.


    **Navigation Bar:** Navigate between Web sites with this toolbar, which contains
    the Location bar and navigation buttons.


    **Refresh:** Click here to reload the current Web page information.


    **Stop:** Click here to stop the page from loading.


    **Home:** Click here to go directly to your home page.


    **Status Bar:** Check the loading status for the current Web page.


    **Location Bar:** Find the URL of the current Web site. You can go directly to
    a Web site by entering a URL here.


    **Google Search:** Type keywords to open a Google Web search. Simply type your
    search in the field and press Enter to load the results.


    **Bookmarks Toolbar:** Click on the bookmarks in this toolbar to access direct
    links to Web pages.


    **Tabs:** Jump between pages in the same window by opening tabs for each new link
    instead of opening new links in new windows.


    **Main Window:** Look at Web site contents.


    # Using the Go Menu


    You can easily go to Web sites you have recently visited by using the Go menu.
    This menu keeps a list of the last ten Web sites you have viewed. Click any of
    these sites to instantly view it.


    ![](img/04bf849117b7b93d509c3755c065ff54_261_0.png)'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'To see a history of all the websites you have recently visited, select Go |
    History, OR View | Sidebar | History. This will open a sidebar displaying your
    viewing history.


    # Practice


    +   - Open the Firefox Web browser. (See page 245, Opening Mozilla Firefox).

    - Using the Google Search feature, search for a Web site. (See page 245, Learning
    the Browser’s Layout).

    - Find a Web site using the Location bar. (See page 245, Learning the Browser’s
    Layout).

    - Open the sidebar using the Go menu. (See page 246, Using the Go Menu).

    - Using the Go menu, go back to the last Web site you visited. (See page 246,
    Using the Go Menu.)


    # For More Information


    +   - From a Firefox browser, select Help | Help Contents. Select Using Mozilla
    Firefox.

    - Visit www.novell.com/linux

    - Search the Web with www.google.com/sled10'
