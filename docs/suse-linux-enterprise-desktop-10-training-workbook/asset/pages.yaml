  md: '# Adjusting Slide Transitions


    Slide transitions affect how your slide displays during your presentation. By
    adjusting slide transition settings, you can customize your slide''s appearance,
    transition speed, sound effects, and more.


    To adjust slide transitions:


    +   1. Select in the Slide pane the slides for which you want to adjust transitions.
    (To select more than one slide at once, hold down the Ctrl key while you click
    the slides).

    2. Click Slide Transition in the Tasks pane on the right of your screen.

    3. Under Apply to selected slides, select the transition you want to implement.

    4. Under Modify transition, select a transition speed.

    5. Select the sound you want to use, if any, to indicate a slide transition.

    6. Under Advance slide, indicate whether you want your slides to advance on a
    mouse click or automatically after a certain number of seconds.

    7. Click Apply to All Slides to make your transition consistent throughout the
    presentation.

    8. Click Play at any time to see a preview of your transition.

    9. Click Slide Show to watch the presentation.


    ![](img/04bf849117b7b93d509c3755c065ff54_424_0.png)


    # Using Animation


    You can use animation to assign effects to an object and draw attention to a slide.


    To add animation to your slide:


    +   1. Select the object you want to animate.

    2. In the Task pane, select Custom Animation.

    3. Under Modify effect, click the Add button.

    4. The Custom Animation dialog will open automatically.


    ![](img/04bf849117b7b93d509c3755c065ff54_424_1.png)'
  merge: -1
