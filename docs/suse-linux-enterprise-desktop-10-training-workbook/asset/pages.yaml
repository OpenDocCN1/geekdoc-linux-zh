- img_proc: true
  md: '# Using the System Monitor


    # # Terminating Processes


    Although the stability of the Linux kernel means that programs do not crash or
    freeze often, there may be a few times you will need to force a program to quit.
    There are several ways to terminate a program, but the safest way is to end the
    program from the System Monitor. Ending the program, rather than killing it, allows
    the process to try to save any data or configuration settings. Follow these steps
    to end a process safely using the System Monitor:


    +   1. Open the System Monitor by clicking the **Computer** button and selecting
    **Hard Drive**.

    2. Click the **Processes** tab.

    3. Highlight the process you wish to end.

    4. Click the **End Process** [End Process] button, OR right-click the highlighted
    process and select **End Process**.

    5. Click **End Process** to confirm that you want to end the process and shut
    down the program manually.


    ![](img/04bf849117b7b93d509c3755c065ff54_176_0.png)


    You can also terminate a process from the System Monitor. Terminating a process
    is not as safe as ending a process because the process may not end normally, possibly
    causing a loss of data or errors in configuration settings. You should terminate
    a process only when you cannot end it normally. Follow these steps to terminate
    a process from the System Monitor:


    +   1. Open the System Monitor by clicking the **Computer** button and selecting
    **Hard Drive** from the System area of the main menu.

    2. Click the **Processes** tab.

    3. Highlight the process you wish to terminate.

    4. Select **Edit | Kill Process** OR right-click the process and select **Kill
    Process**.

    5. Click **Kill Process** to confirm that you want to kill the process and shut
    down the program immediately.


    ![](img/04bf849117b7b93d509c3755c065ff54_176_1.png)


    You can also kill a graphical process using the command line. This command will
    not open your System Monitor, but you can use it to immediately terminate any
    running program. It should be used only a last resort.'
  merge: -1
  pgno: 176
- img_proc: true
