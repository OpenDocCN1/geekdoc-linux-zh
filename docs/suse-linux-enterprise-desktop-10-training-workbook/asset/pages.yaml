  md: '# Using Bookmarks


    # Chapter Objectives


    +   * Demonstrate how to create bookmarks.

    * Learn how to use the Bookmarks Manager.

    * Customize the Bookmarks toolbar.

    * Import and export bookmarks.

    * Learn about and Create Live Bookmarks.


    # Creating Bookmarks


    When you want to save the address of a Web page so that you can easily return
    to it in the future, you should create a bookmark. Bookmarks are stored and accessed
    in the Bookmarks menu. You can create a bookmark from the from the current page
    or from the Bookmarks Manager.


    # Using the Current Page


    +   1. If the page you want to bookmark is opens in the browser, select Bookmarks
    | Bookmark This Page.


    ![](img/04bf849117b7b93d509c3755c065ff54_264_0.png)


    +   2. Enter a name for your bookmark and select a folder in which to place the
    bookmark.

    3. Click Add.

    4. Find your new bookmark in the Bookmarks menu.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Section 8: Browsing the Web with Firefox


    If you would like the current page to appear as a bookmark on your Bookmarks toolbar,
    simply double-click the URL in the Location Bar, hold down the left mouse button,
    and drag it to an empty space on the toolbar.


    # Using the Bookmarks Manager


    +   1. Open the Bookmarks Manager by selecting Bookmarks | Manage Bookmarks.

    2. Click New Bookmark.

    3. Type a name for your new bookmark in the Name field.

    4. Type the URL in the Location field.

    5. Type a Keyword for the site in the Keyword field.

    6. Type a description for the Web site in the Description.

    7. Check Load this bookmark in the sidebar if you want the bookmark to open in
    the sidebar and not in the main window when you click the bookmark.

    8. Click OK.


    | Properties for New Bookmark |

    |---||

    | Name | Cool Solutions |

    | Location | www.novell.com/cool-solutions |

    | Keyword | Novell Cool Solutions |

    | Description | Link to Cool Solutions newsletters |

    | Load this bookmark in the sidebar |

    | Cancel | OK |


    You can also create a bookmark by right-clicking on a blank space in the Bookmarks
    toolbar, selecting New Bookmark, and entering the information as described above.


    # Bookmarking Multiple Tabs


    When you are viewing Web sites in different tabs, you can bookmark all your open
    tabs automatically instead of bookmarking each tab individually. Firefox saves
    this group of Web sites you can choose to open in tabs. Follow the steps below
    to bookmark multiple tabs:


    +   1. Open the Web sites in tabs. (See page 258, Using Tabbed Browsing, for more
    information on opening Web sites in tabs.)

    2. Select Bookmarks | Bookmark All Tabs.

    3. Enter a name for your group of bookmarks. This will become the name of the
    bookmark folder where your tagged sites will be stored.

    4. Choose a folder in which you want your bookmark folder stored.

    5. Click Add.


    | Bookmarks All Tabs |

    |---||

    | Name | Novell Cool Solutions |

    | Create in | Bookmarks |

    | Cancel | Add |'
  merge: -1
  pgno: 265
- img_proc: true
  md: '6. To later view your bookmarked pages as tabs, select Bookmarks | [name of
    your folder] | Open In Tabs.


    # Managing Bookmarks


    Once you have created many bookmarks, you can organize and rearrange them using
    the Bookmarks Manager. Open the Bookmarks Manager by selecting Bookmarks | Manage
    Bookmarks.


    # Viewing Folders


    A list of bookmarks appears in the main area of the window. You can view the contents
    of bookmark folders in this area by selecting the folder from the navigation pane
    on the left side of the window. To expand folders in the list, click the arrows
    at the left of the folder names.


    ![](img/04bf849117b7b93d509c3755c065ff54_266_0.png)


    # Deleting Bookmarks


    +   - Select the bookmark you wish to delete and select Edit | Delete or Edit
    | Cut.


    OR


    +   - Select the bookmark you wish to delete, right-click, and select Delete or
    Cut from the context menu that appears.


    OR


    +   - Select the bookmark you wish to delete, and click the Delete button.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Section 8: Browsing the Web with Firefox


    # Moving Bookmarks


    Select the bookmark you wish to move and drag it to a new location. To move a
    bookmark into an existing folder, drag the bookmark over the folder until the
    folder’s name is highlighted, then release the mouse.


    OR


    Select the bookmark you wish to move, and click the **Move** button. Specify the
    new location in the dialog window that appears and click **OK**.


    ![](img/04bf849117b7b93d509c3755c065ff54_267_0.png)


    # Inserting Separators


    Separators can be used to make the appearance of your Bookmarks menu more organized.
    Instead of keeping bookmarks in separate folders, you can organize them with separators.


    Follow the steps below to insert a separator:


    +   1. Highlight the bookmark or bookmark folder directly below the place where
    you want the separator to appear.


    +   2. Click the **New Separator** button. A new separator will appear.


    +   3. To move the separator, click and drag it to a new position.


    +   4. To delete a separator, select the separator, right-click, and select **Delete**
    from the menu that appears.


    ![](img/04bf849117b7b93d509c3755c065ff54_267_1.png)


    # Creating New Folders


    You can organize your bookmarks by placing them in subject-specific folders. To
    create a new folder, click the **New Folder** button. In the dialog that appears,
    name the folder, type a description of its contents, and click **OK**.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Viewing Properties


    Click the Properties button to view details about the selected bookmark or folder
    or to change its name or location.


    # Sorting Bookmarks


    From the View menu in the Bookmarks Manager, you can sort your bookmarks by name,
    location, keyword, description, last added bookmark, last modified bookmark, or
    last visited bookmark. You can also sort your bookmarks by clicking the column
    headings. To quickly display different column headings, click the button, which
    is located above the scroll bar on the far right side of the Bookmarks Manager.


    # Searching Bookmarks


    To search for a bookmark, type part of an address or of a bookmark name in the
    bookmark Search bar. The results will display in the main bookmark window as you
    stop typing.


    # Customizing the Bookmarks Toolbar


    The Bookmarks toolbar is located below the address bar on the Mozilla Firefox
    browser. It provides easy access to specific bookmarks and bookmark groups, such
    as Entertainment sites, News sites, etc. By default, the bookmarks bar contains
    Web sites you may frequently visit.


    To change the pages and groups that appear on the Bookmarks toolbar:


    +   1. Select Bookmarks | Manage Bookmarks to open the Bookmarks Manager.

    2. Expand the Bookmarks toolbar by clicking its arrow. This folder contains contains
    all of the bookmarks and groups of bookmarks currently on the toolbar.


    ![](img/04bf849117b7b93d509c3755c065ff54_268_0.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Section 8: Browsing the Web with Firefox


    +   3. Drag and drop folders and bookmarks to move them to and within the Bookmarks
    toolbar.

    4. Right-click a folder or bookmark and select Delete to remove it.

    5. Change the order of the folders on the toolbar by clicking on a name and dragging
    it to a different position on the toolbar.

    6. To make the current Web page appear on the Bookmarks toolbar as a bookmark,
    simply select the URL in the Location bar, hold down your left mouse button, and
    drag it to an empty space on the toolbar.


    # Importing and Exporting Bookmarks


    Users switching Internet browsers or computers often want to transfer their bookmark
    lists from the old browser to the new one. You can import or export your bookmarks
    by selecting File | Import or File | Export from the Bookmarks Manager.


    When you export bookmarks, you save your list of bookmarks to a file accessible
    outside the browser. Selecting this option will bring a window where you decide
    where your bookmarks will be saved.


    When you import bookmarks, you pull the bookmarks from another browser or file
    and save them in Firefox. When the dialog window appears, select the appropriate
    browser and click Next. The imported bookmarks will appear in their own folder
    in your Bookmarks list.


    # Creating Live Bookmarks


    Live Bookmarks is a Firefox feature that allows you to view the most recent news
    headlines within your bookmarks. For example, you can create a Live Bookmark that
    generates all of the daily headlines Novell Co Solutions or the BBC news. That
    means you will be able to scan headlines without loading the Web site. If a Web
    site supports a news feed, you will see a live feed icon in the right of the Location
    bar.


    To create a Live Bookmark:


    +   1. Browse to a Web site that supports a news feed.

    2. Click the Live Feed icon in the right part of the Location bar.

    3. Click Add [name of feed] as Live Bookmark on the menu that appears.

    4. In the dialog box, name the new bookmark and specify which folder it goes in.

    5. Click Add.'
  merge: -1
  pgno: 269
