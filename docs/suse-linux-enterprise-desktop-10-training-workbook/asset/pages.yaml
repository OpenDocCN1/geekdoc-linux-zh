  md: '# Section 4: Performing Administrative Tasks


    # Using the System Monitor


    # Chapter Objectives


    +   - Understand what tasks can be performed and resources can be viewed in the
    System Monitor.

    - View the amount of memory left on a device using the System Monitor.

    - Define processes and the reasons you may need to manage them.

    - View processes using the System Monitor.

    - Learn the safest way to terminate processes and demonstrate other ways to force
    programs to quit.


    # Accessing the System Monitor


    The System Monitor on the SUSE Linux Enterprise Desktop is an important resource
    for viewing and monitoring information about your system, the space available
    on all system devices, and the processes that are running on your system. Accessing
    the System Monitor is simple:


    +   1. Click the **Computer** button to open the main menu.

    2. Select **Hard Drive** ![Hard Drive] from the Status area of the main menu.

    3. Click the **System** tab to view information about your hardware and available
    space.

    4. Click the **Processes** tab to view, change, or kill processes.

    5. Click the **Resources** tab to view the load on your CPU and memory.

    6. Click the **Devices** tab to see how much space is available on your system
    devices.

    7. Click the **Close** button in the top right-hand corner ![x] to close the System
    Monitor.


    ![](img/04bf849117b7b93d509c3755c065ff54_171_0.png)'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Checking Available Space


    The Resources tab in the System Monitor shows the load on the CPU and memory.
    These are shown as graphical representations with concrete numbers below the graphs.


    ![](img/04bf849117b7b93d509c3755c065ff54_172_0.png)


    From the Devices tab, you can see how much space is available on your system devices.
    Follow these steps to check the amount of space available on a system device:


    +   1. Click the header in any column to change the order in which devices are
    viewed.

    2. Click the Total column header to display the total amount of memory required
    by that device.

    3. Click the Used column header to display the number of bytes currently being
    used by a device.

    4. Click the Close button to exit the window.


    ![](img/04bf849117b7b93d509c3755c065ff54_172_1.png)'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Section 4: Performing Administrative Tasks


    # Defining Processes


    The SUSE Linux Enterprise Desktop, like other operating systems, runs on an underlying
    program. This program is called the kernel. The kernel manages the basic functions
    of your system. Any other programs, including many aspects of the SUSE Desktop
    graphical user interface, are run on top of the kernel and are called processes.


    When you start a process, the kernel assigns it a unique process identification
    number. The kernel uses this number to assign the processes and resources access
    to various types of hardware. Because Linux is a multitasking operating system,
    you can run more than one process at a time. Part of the kernel, called the scheduler,
    switches between the programs, assigning computing tasks to each. Unless you,
    the user, are running too many programs, you should be unaware of these changes.


    Usually, the kernel manages processes well its own. When computing speed begins
    to slow down or a program is not responding, you may need to help the kernel manage
    these processes. The following reasons are to manage system processes:


    +   - A program is not responding

    - A program will not shut down on its own

    - Computing speed is slower than normal

    - You need to enhance computing speed

    - You need to change process priorities

    - You need to see how much memory a program is consuming

    - You need to monitor your CPU usage

    - You need to see how much memory is available on a hardware device


    # Viewing Processes


    To view and manage processes for any of the reasons listed above, you will use
    the System Monitor. Follow the steps to access the System Monitor and view your
    system''s processes:


    +   1. Click the **Computer** button and select **Hard Drive** in the System area
    of the main menu.

    2. Click the **Processes** tab.

    3. The process list will display the Process Name, the Status of the process,
    the Resident Memory, or amount of memory the process is using, the amount of space
    on the hard drive that the process takes up (% CPU), the process''s priority (or
    Nice) value, and the process''s ID number.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '+   4. Highlight a process and click the **More info** arrow to find out more
    information, such as the command that began the process.


    +   5. To change the way processes are viewed, click the View button on the menu
    bar and select from the following:


    +   Select **My Processes** to view only the processes you begin.


    +   Select **All Processes** to view all processes.


    +   Select **Active Processes** to view only the processes that are currently
    running.


    +   Select **Dependencies** to view sub-process dependencies.


    +   Select **Threads** to view processes according to process threads.


    +   6. To see how a particular process is using memory, select **View | Memory
    Maps**.


    ![](img/04bf849117b7b93d509c3755c065ff54_174_0.png)


    +   7. Click any column heading in the Memory Maps dialog to sort the information.


    +   8. Click the **Close** button to exit the Memory Maps dialog.


    ![](img/04bf849117b7b93d509c3755c065ff54_174_1.png)'
  merge: -1
