  md: '# Understanding and Using Network File Systems


    # # Understanding and Using Network File Systems


    # ## Chapter Objectives


    +   - Understand how a network file system works.

    - Understand how files are saved to a network.


    # ## Understanding Network File Systems


    Understanding how a network file system will help you better use the services
    provided on your network. The diagram below demonstrates how a network file system
    is configured.


    ![](img/04bf849117b7b93d509c3755c065ff54_182_0.png)


    **Work Stations:** In this diagram there are three work stations. A work station
    is the computer at a user''s desk from which he or she performs all computing
    tasks. Each work station is connected to the network server. A large number of
    work stations can be part of the same network.


    **Network Server:** The network server is the hub of the network. Both work stations
    and peripheral hardware, such as scanners and printers, can be connected to the
    network server. In this diagram, three users have access to the same printer,
    via their network connection.


    **Printer:** Connecting a printer to a network cuts costs because it allows multiple
    users to access one printer for all of their printing needs.


    **Data Resources and Disk Storage:** Data resources and large amounts of storage
    space are available on a network server. Users with network access can use these
    resources and store files on the network server, thus freeing space on their own
    work stations.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Section 5: Networking


    # Saving Files on a Network Server


    It is helpful to understand how files are named when saved to a network server.
    An individual user typically saves files to a directory on his or her own work
    station. For example, you might save your word processing documents to the Documents
    folder in your work directory.


    ![](img/04bf849117b7b93d509c3755c065ff54_183_0.png)


    Files saved to a network server are also saved to a directory, but these directories
    fall within what is called a volume. A volume is a fixed amount of storage space
    on a server. Volumes are typically named according to their contents.


    For example, your company might have a volume for product development projects,
    a volume for marketing reports, and another volume for payroll documents. If you
    work in marketing and have created a word-processing document you would like to
    save to the network server, you might name it like this:


    ![](img/04bf849117b7b93d509c3755c065ff54_183_1.png)


    +   - Identify the Volume by context: **MYCOMPANY.marketing** (your system administrator
    will have a list of all volumes).


    +   - Separate the volume and directory with a colon: **MYCOMPANY.marketing:**


    +   - Enter the directory and subdirectories, separating each with a backslash:
    **MYCOMPANY.marketing:Novell\Sled10\**'
  merge: -1
