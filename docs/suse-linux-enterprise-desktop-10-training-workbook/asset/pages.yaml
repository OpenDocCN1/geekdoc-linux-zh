  md: '# Getting Started with F-Spot


    # Chapter Objectives


    +   - Become familiar with the layout of F-Spot.

    - Import photos to F-Spot from your file system or a CD-ROM.

    - Download photos from your digital camera.


    # Learning the Layout


    F-Spot is a convenient and simple application in which you can manage all of your
    digital photographs. It allows you to import, categorize, edit, and export images.
    To open F-Spot:


    +   1. Click the **Computer** button and select **F-Spot** from the main menu.
    OR

    2. Select **Computer | More Applications** to browse for F-Spot in the Application
    Browser.


    ![](img/04bf849117b7b93d509c3755c065ff54_238_0.png)


    **Menu Bar**: This bar allows access to the File, Edit, View, Find, Tags, and
    Help menus.


    **Toolbar**: These tools let you rotate an image left or right, enter browse mode,
    enter edit mode, and view photos in a full-screen format or as a slide show.


    **Sidebar**: This area displays categories, tags, and detailed information about
    selected images.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Section 7: Managing Photos with F-Spot


    **Statistical Information:** This area shows specific information about a selected
    image.


    **Timeline:** The timeline offers a unique way to browse through your photos in
    chronological order.


    **Thumbnails:** Small versions of your photos are displayed here. If no tag is
    selected in the sidebar, all of your photos appear.


    **Zoom Control:** With this slide control, you can change the size of the thumbnails
    in the display window.


    # Importing Photos from Your File Directory


    If you already have photos saved on your hard drive that you would like to import
    to F-spot, follow these steps:


    +   1. Open F-spot.

    2. Make sure the Browse button in the toolbar is selected.

    3. Select File | Import, OR press Ctrl+N.

    4. Double-click Select Folder to browse your directory for the photo(s).

    5. Once the folder or file is located, highlight it and click Open.

    6. When you have opened an image file, it will load in the Import window.

    7. Click here to attach a tag to the selected image (see page 229, Attaching Tags).

    8. Click here to copy the file to your photos folder.

    9. Click here to include subdirectories for multiple photos.

    10. When you are ready to add the photos to your F-Spot collection, click the
    Import button.


    ![](img/04bf849117b7b93d509c3755c065ff54_239_0.png)'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# # Importing Photos from a CD


    At times, you may have a film developer put your images on a CD that you can then
    use to update your photo catalog in F-Spot To import photos from a CD, follow
    these steps:


    +   1. Insert the CD.


    ![](img/04bf849117b7b93d509c3755c065ff54_240_0.png)


    +   2. The CD will be recognized. Click Import Photos.


    +   3. F-Spot will open, along with the Import window, from which you can download
    the images on the CD.


    +   4. From the Import Source field, use the drop-down arrows to choose Select
    Folder.


    +   5. The Import browser will open, with the contents of your CD displaying.
    Photo CDs contain several folders—with copies of the same images in each folder.
    Because you don''t need multiple copies of each photo, select only the folder
    titled Pictures or Originals


    ![](img/04bf849117b7b93d509c3755c065ff54_240_1.png)


    +   6. Click Open.


    +   7. The images will load into the Import window.


    +   8. Check the box next to Copy file to the Photos folder.


    +   9. Attach tags and specify subdirectories as desired.


    +   10. Click Import.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Section 7: Managing Photos with F-Spot


    # Downloading Photos from a Digital Camera


    You can add photos to F-Spot directly from your digital camera. To do so, follow
    these steps:


    +   1. Connect your camera to the USB port on your computer.

    2. The Camera Import window will automatically appear. **Click Import Photos.**


    **Note:** If you check *Always perform this action*, this window will not appear
    and the photos on your camera will be loaded each time you plug in your camera.


    **Note:** If you decide that you do not want to import photos immediately, click
    **Ignore**. When you are ready to download your photos, follow steps 1 through
    4 on page 225, Importing Photos from a CD, or select your digital camera from
    the *Import Source* field in step 4.


    +   3. A window will open, displaying the photos on your digital camera.


    +   4. By default, all of the images will be selected. If you do not wish to download
    all of them, select only the ones you want by clicking on them while pressing
    the **Ctrl** button.


    +   5. By default, each photo will be copied to your Photos folder in your Home
    directory, as well as imported to F-Spot. If desired, you can change the copy
    location in the *Files* field. To browse for a new folder, click the **Folder**
    button.


    +   6. Check the box next to **Import files after copy** if you''d like F-Spot
    to copy your photos and import them at the same time.


    +   7. If you would like to tag all of your selected photos with the same tag,
    click **Select Tags**. (Note that you can tag them separately after they are downloaded;
    see page 229, Attaching Tags.)


    +   8. Click **Copy**.


    ![](img/04bf849117b7b93d509c3755c065ff54_241_0.png)


    ![](img/04bf849117b7b93d509c3755c065ff54_241_1.png)'
  merge: -1
