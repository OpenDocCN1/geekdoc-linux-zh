  md: '# Section 9: Communicating and Collaborating


    # Sending Instant Messages with Gaim


    # Chapter Objectives


    +   - Set up an instant messaging account to work with Gaim.

    - Send an instant message.

    - Set preferences for instant messaging.


    # Setting Up Accounts


    Gaim is a multiprotocol instant messaging client for Linux, BSD, Mac OS X, and
    Windows. It is compatible with GroupWise Messenger, AOL Instant Messenger (AIM),
    ICQ, Yahoo, IRC, Jabber, Gadu-Gadu, and Zephyr Networks. You can use Gaim to view
    and chat within multiple accounts you have set up. After you sign up for the type
    of account you want through the account administrator, usually online, you can
    connect to that account using Gaim. Each account will be a little different, but
    the basic account set-up steps are outlined below:


    +   1. Select Computer | More Applications | Gaim Instant Messenger to launch
    Gaim.


    ![](img/04bf849117b7b93d509c3755c065ff54_333_0.png)


    +   2. In the Login window, click the Accounts button. The Add Account window
    will open.

    3. In the Protocol field select the type of account you wish to set up.'
