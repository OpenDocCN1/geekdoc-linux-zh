  md: '# Section 10: Increasing Productivity with the OpenOffice.org Suite


    # Preparing to Present


    When you have finished creating your presentation, complete these finishing touches
    to prepare to present it.


    # Checking Spelling


    To check the spelling of your presentation:


    +   1. Select Tools | Spellcheck; OR click the Spellcheck icon on the toolbar;
    OR press F7.


    ![](img/04bf849117b7b93d509c3755c065ff54_429_0.png)


    +   2. Spellcheck will run automatically. Misspelled words will be highlighted
    in red.


    +   3. Suggestions for correct spellings are provided under Suggestions. Select
    the correct spelling and click Change or Change All.


    +   4. Click ignore Once or Ignore All to skip the word.


    +   5. If you prefer a different dictionary, click the Dictionary language drop-down
    menu to select one.


    +   6. When all misspellings are corrected, click Close.


    # Rehearsing Timings


    Impress lets you time your slide show so that your slides advance automatically
    and in sync with your verbal presentation.


    To rehearse your timings:


    +   1. Select the Slide Sorter tab to see a full view of your slides and to access
    the Slide View toolbar.'
