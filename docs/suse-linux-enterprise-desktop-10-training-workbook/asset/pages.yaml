    +   8. You can now place a call with Linphone.


    # Adding the Linphone Applet to your Panel


    The best way to use Linphone to make and receive calls is to keep it running in
    the background of the SUSE Linux Enterprise Desktop. If you place the Linphone
    applet on your panel, Linphone will silently run without disrupting your regular
    work. When a call comes in, the Linphone window will appear on the screen. To
    place a call, you can simply click the applet to open the application.


    +   1. Right-click the panel and select Add to Panel.


    +   2. Scroll through the list of available applets and highlight Linphone.


    +   3. Click Add. The applet will appear on your panel, and the Linphone window
    will open.


    +   4. Minimize the window and continue your work.'
