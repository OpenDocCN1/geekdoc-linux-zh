    # Increasing Productivity


    In OpenOffice.org Calc, several features are available to help you save time and
    resources. Use these features when you want to make quick lists, print just part
    of a sheet, or make calculations for just a few cells.


    # AutoFill


    Use AutoFill to create a quick list. Type a value into a cell, then drag the fill
    handle away from the cell.


    ![](img/04bf849117b7b93d509c3755c065ff54_401_0.png)


    Samples:


    | 20 | 21 |

