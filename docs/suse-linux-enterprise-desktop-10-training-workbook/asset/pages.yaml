  md: '# Using Desktop Searching


    # Chapter Objectives


    +   - Understand and perform desktop searches using Beagle.

    - Set searching and indexing preferences.


    # Understanding SUSE Desktop Searching


    SUSE Linux Enterprise Desktop uses a highly sophisticated search engine called
    Beagle to perform integrated desktop searching. Beagle works behind the scenes
    to index every document you work on, every instant message you send, every Web
    site you visit—virtually everything you do on your system.


    This means you can perform lightning-fast, full-text searching of all text-based
    items (as well as filenames and application names) on your system—and you can
    do it right from the main menu.


    # Using the Desktop Search Tool


    To perform a desktop search:


    +   1. Click the Computer button to open the main menu.

    2. Enter the search term in the Search field.


    ![](img/04bf849117b7b93d509c3755c065ff54_72_0.png)


    +   3. Press Enter.'
  merge: -1
  pgno: 72
- img_proc: true
