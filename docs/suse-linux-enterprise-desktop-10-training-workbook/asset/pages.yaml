- img_proc: true
  md: '# Section 4: Performing Administrative Tasks


    9. To change the information that is displayed in the Processes list, select Edit
    | Preferences.


    ![](img/04bf849117b7b93d509c3755c065ff54_175_0.png)


    10. Click the Processes tab and check the boxes next to the information you would
    like displayed in the Processes list.


    11. Click Close when you are ready to exit the Preferences dialog.


    # Process Priorities (Nice Values)


    From the Processes of the System Monitor, you can also change the priority of
    your processes. Process priorities are determined by Nice values. A Nice value
    of 0 means a process has normal priority. Nice values above 0 have low priority,
    and nice values below 0 have high priority. Be cautious when changing the process
    priority to a number below zero, you need to enter the password for the root user.
    Follow these steps to change process priorities:


    +   1. Highlight the process for which you''d like to change priority.

    2. Right-click the process.

    3. Select Change Priority.

    4. Slide the bar until it registers the adjusted priority.


    ![](img/04bf849117b7b93d509c3755c065ff54_175_1.png)


    +   5. Click the Change Priority button.'
  merge: -1
