  md: '# Managing Music with Banshee


    # Chapter Objectives


    +   - Become familiar with Banshee.

    - Listen to songs from your music library, CDs, and iPod.

    - Import songs to build your music library.

    - Edit song data.

    - Create and manage playlists.

    - Burn CDs with Banshee.


    # Exploring Banshee


    Helix Banshee is a music management application that allows you to listen to CDs
    and MP3 files, import music to create a music library, sync your collection with
    an iPod, and create CDs. By default, Banshee should appear in the Favorite Applications
    area of the Application Browser. To open Banshee:


    +   1. Click the **Computer** button.

    2. Select **Helix Banshee** from the main menu, OR click **More Applications**
    to browse for Banshee if it does not appear in your favorite applications.


    ![](img/04bf849117b7b93d509c3755c065ff54_220_0.png)'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Section 6: Entertaining Yourself


    Below is an overview of the Banshee window.


    | Player Controls | Slider Control | Title Bar | Write CD Button |

    | --- | --- | --- | --- |


    ![](img/04bf849117b7b93d509c3755c065ff54_221_0.png)


    **Player Controls:** These buttons allow you to play songs, pause, and go to the
    previous or next track. (These controls are also available in the playback menu).


    **Slider Control:** This control shows you the elapsed time in the current song.
    You can go back or skip by sliding the control back and forth.


    **Title Bar:** This area displays the title of the current song as well as album
    information and a thumbnail shot of the album cover.


    **Write CD Button:** This toolbar provides access to burn selected tracks to an
    audio or MP3 CD.


    **Menu Bar:** This toolbar provides access to the Music, Edit, Playback, View,
    and Help menus.


    **Left Panel:** The left panel displays the titles of playlists. When a CD is
    inserted or an iPod is plugged in, related information will also appear in this
    panel.


    **Playlist:** Your music library or selected playlist appears in this space. Here
    you can select, delete, and rate songs or move songs to other playlists.


    **Playback Mode Arrows:** Click one of these arrows to toggle between playback
    modes.


    **Status Bar:** This area displays the number of songs in the playlist and the
    total play time.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Managing Music with Banshee


    **Volume**: This button controls the volume level.


    **Search Bar**: The search feature automatically begins to search for songs as
    you type a keyword in the Search bar.


    **Sorting Buttons**: These buttons allow you to sort your playlists according
    to track number, artist, title, album, and time.


    **Edit Button**: This button opens the Editing Song window, which shows statistics
    about the selected track and allows you to change information such as the artist,
    album, and title.


    # Listening to Music


    With Banshee, you can listen to songs from your own music library, CDs, and iPod.


    # Music Library


    To listen to a song in your music library:


    +   1. Open Banshee.

    2. Highlight the song you''d like to listen in your playlist.

    3. Click the Play button. (You can also double-click a song to play it.)

    4. Use the other buttons in the upper left corner to Pause a song or play the
    next previous song on your playlist. (These player controls can also be accessed
    from the playback menu.)


    Banshee will play your songs in the order they appear in your playlist. To have
    them played in a random order, select Playback | Shuffle. OR click the Toggle
    shuffle playback mode icon. When shuffle mode is set, the icon looks like this:


    If you want your playlist to repeat when the last song has been played, click
    the Change repeat playback mode icon. When repeat mode is set, the icon looks
    like this:


    # CD


    To listen to a CD in Banshee:


    +   1. Insert the CD in your computer.

    2. If Banshee is not already opened, it will open automatically. The CD title
    will appear in the left panel and a list of tracks will appear in your playlist
    area.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Section 6: Entertaining Yourself


    +   3. Select the CD title.


    +   4. Click Play to hear your full CD.


    # iPod


    To listen to songs from your iPod, follow these directions:


    +   1. Open Banshee.

    2. Plug your iPod into your machine.

    3. Your iPod will appear in the left panel.

    4. Select the song you want to hear and click the Play button.

    5. Click the Synchronize iPod button to copy all of the songs in your music library
    to your iPod.


    ![](img/04bf849117b7b93d509c3755c065ff54_223_0.png)


    # Importing Songs to Your Music Library


    To import music from a CD to your music library:


    +   1. Insert the CD.

    2. Banshee will open automatically; and the tracks on the CD will appear in your
    playlist.

    3. By default, a blue check mark will appear next to each track. If you do not
    wish to import a specific track, de-select it.

    4. Click Import CD.


    208'
