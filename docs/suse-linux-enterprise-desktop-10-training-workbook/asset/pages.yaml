    +   4. A dialog window will ask if you want to apply changes. Click Yes.


    # Customizing Chart Types


    To change the existing chart type:


    +   1. From Chart view, select Format | Chart Type, OR click the Chart Type icon
    on the Chart Formatting toolbar.


