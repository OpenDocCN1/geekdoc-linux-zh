    # Opening a Removable Media File


    Because removable media are automatically mounted, they are very simple to use.
    After you insert the CD, attach the USB drive, or add another media, a Nautilus
    window opens identifying the Location and the type of media that you inserted.
    If Nautilus does not open, double-click the medium’s icon to display its contents
    in Nautilus. Then simply double-click a desired file to open it.


    ![](img/04bf849117b7b93d509c3755c065ff54_126_0.png)


    # Saving Files to Removable Media


    Saving a removable media file is very similar to saving other files. You can rename
    the file if you wish, assign a file extension to it, set preferences, and save
    it to the folder you want.

    To save the file while the file is open in an application:


    +   1. Make sure the removable media (such as the CD or USB drive) to which you
    want to save the file has been inserted in the computer and mounted to the Linux
    file system (see page 110, Mounting Removable Media).

    2. In the current application’s Menu bar, select File | Save As.

    3. In the Save dialog box, click the Save in folder field and select the removable
    media device you wish to save the file to.'
