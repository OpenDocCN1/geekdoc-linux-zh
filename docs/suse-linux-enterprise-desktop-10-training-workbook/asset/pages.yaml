    \ attach the same tag to a group of photos, select the first photo, hold down\
    \ *Shift*, and select the rest of the group. Right-click the photos you have selected\
    \ and attach the tag.\n\n# # Creating New Tags\n\nYou can create new tags specific\
    \ to a group of photos, such as a tag for a vacation or a tag for holiday pictures.\
    \ Follow these steps to create a new tag:\n\n+   - Right-click within the tags\
