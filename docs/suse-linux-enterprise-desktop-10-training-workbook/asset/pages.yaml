- img_proc: true
  md: '# Sending and Receiving E-mail with Evolution


    You can also expunge an entire folder at once:


    +   1. Select the folder you want to expunge.


    +   2. Select Folder | Expunge.


    To expunge all deleted items from your folders at once, select File | Empty Trash.


    # Marking Messages for Follow Up


    One way to keep track of your messages is to mark the ones that require follow
    up. Evolution''s followup feature provides you several follow-up options, as well
    as the way to add due dates to items. Follow the steps below to use the follow-up
    feature.


    +   1. From the Message List of the Evolution window, select one or more messages.


    +   2. Right-click one of the messages and select Mark for Follow Up from the
    context menu that appears.


    +   3. In the Follow Follow Up dialog, click a listed message to select it.


    +   4. Select a flag from the drop-down menu next to the Flag field.


    +   5. Click the arrow next to the Due By field to choose a due date from a pop-up
    calendar.


    +   6. Repeat steps 3 through 5 for the rest of the messages in the dialog, then
    click OK.


    ![](img/04bf849117b7b93d509c3755c065ff54_310_0.png)


    To add a column to your Message List to display flags, right-click the columns
    bar (which contains From, Subject, and Date headings) and select Add a Column.
    In the window that appears, select the new column and drag it to the desired spot
    on your column bar.


    You can also see the follow-up flag at the top of your message when you open or
    view it.


    ![](img/04bf849117b7b93d509c3755c065ff54_310_1.png)


    When you complete the follow up, right-click the message and select Flag Completed
    or Clear Flag.'
