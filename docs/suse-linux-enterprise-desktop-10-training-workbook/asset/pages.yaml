    grouped by type, such as Documents or Web sites. The number of matching items
    is identified at the right of the results window.


    +   5. Scroll through the results window using the arrows and scroll bar to the
    right.


    +   6. Select the desired result. A thumbnail preview image and description of
    the item will appear at the bottom of the window.


    +   7. Double-click the selection to open it, OR right-click and select Open.


    # Narrowing or Controlling a Search


    To create more specific search guidelines, use the menu bar Search Sort Help at
    the top of the Desktop Search window.


    Select Search to narrow the search to these areas:


    ![](img/04bf849117b7b93d509c3755c065ff54_73_0.png)


    Select Sort to change how your results are displayed on screen. Results can be
    displayed by Date modified, Name, or Relevance.'
