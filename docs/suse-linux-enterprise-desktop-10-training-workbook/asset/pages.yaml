  md: '# # Getting Started with Evolution


    # ## Chapter Objectives


    +   - Configure an Evolution account.

    - Explore the Evolution main window.


    Evolution is a comprehensive collaboration client that has the power to display
    and manage all your e-mail accounts in one program. You can manage your work account,
    your personal POP or IMAP account, and even a Microsoft Exchange account (with
    a special connector for Exchange) using Evolution. Once Evolution is configured
    according to your preferences, you can use it for all of your collaboration needs.


    # ## Configuring an Evolution Account


    The first time you click Computer | Evolution to run Evolution, the Evolution
    Setup Assistant will help you set up a new account. Follow the steps below to
    configure your account:


    +   1. Read the Welcome message and click Forward to configure your identity.


