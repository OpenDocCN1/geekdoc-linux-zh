  md: '# Creating Presentations in OpenOffice.org Impress


    # Adding Pictures and Graphics


    To add a picture or graphic to your presentation:


    +   - Select Insert | Picture | From File, OR click the From File icon on the
    Drawing toolbar.


    +   - Select the folder, then the file you want to insert.


    +   - Click Open.


    +   - You can resize and move your graphic the same way you resize and move a
    text box.


    # Using the Fontwork Gallery


    The Fontwork Gallery lets you add graphical text art to your slides. To add a
    picture or graphic to your presentation:


    +   - Click the Fontwork icon on the Drawing toolbar.


    +   - Select the fontwork style you want to insert.


    +   - Click OK.


    +   - When the fontwork appears on your slide, double-click it and enter your
    desired text.


    +   - Click anywhere outside the text box. Your text will show in the chosen fontwork.


    # Using the Gallery


    The Gallery allows you to easily manage and insert graphics and sound into your
    presentation. To insert an object from the Gallery:


    ![](img/04bf849117b7b93d509c3755c065ff54_416_0.png)


    +   - Click the Gallery icon on the Drawing toolbar to open the Gallery.


    +   - Select a theme from the list of themes.


    +   - Click on the desired object and drag and drop it on your slide.'
