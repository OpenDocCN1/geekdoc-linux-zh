  md: '# # Exporting Photos


    # ## Chapter Objectives


    +   - Learn to export your photos to e-mail, Flickr, a Web gallery, folders, and
    a CD.


    # # Exporting Photos


    F-Spot offers several ways to export your digital photos.


    # ## E-mail


    To send photos in an e-mail, select the photos and select **File | Send Mail**.
    You can send your photos as they are or resize them to make them smaller.


    # ## Flickr


    If you use Flickr, an online photo management application, you can post your photos
    there directly from F-Spot. Select **File | Export | Export to Flickr**.


    ![](img/04bf849117b7b93d509c3755c065ff54_254_0.png)


    A window will open showing your selected photos and options for viewing permissions
    and style. After you have marked the preferences you want, click **Authorize**.
    F-Spot will open a Web browser, where you can sign in to your Flickr account.
    When authorization is complete, your photos will be exported to your account.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Section 7: Managing Photos with F-Spot


    # Web Gallery


    To export photos to a Web gallery, select the photos and select File | Export
    | Export to Web Gallery.


    ![](img/04bf849117b7b93d509c3755c065ff54_255_0.png)


    In the Export window, enter information about your Web gallery. Choose an album
    name and indicate whether you would like to open the album when the photos have
    uploaded. Resize your photos if you want to, and keep the last box checked if
    you want comments to be included. Click OK.


    # Folder


    To export photos to a folder, select the photos and select File | Export | Export
    to Folder.


    ![](img/04bf849117b7b93d509c3755c065ff54_255_1.png)


    In this window you choose the folder to which to export the photos. You can also
    create a standalone Web gallery, save the files only, or create a gallery using
    "Original." (The last option refers to Jacob Steiner''s free Original Photo Gallery
    software.) Resize the photos and add a description if you wish, then click OK
    to export.


    240'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# CD


    To burn photos to a CD, insert the CD and select the photos you want to include.
    Select File | Export to Export CD. A window will appear showing the selected photos.
    Check the Write only these photos to CD box if you''re satisfied with the selection,
    or click Browse Previously Scheduled Files to open the CD/DVD Creator-File Browser
    window and browse for previous projects.


    # Practice


    +   1. Send your favorite photo in an e-mail. (See page 239, Exporting Photos.)

    2. Practice exporting a few photos to a Web gallery. (See page 239, Exporting
    Photos.)

    3. Burn your photo collection onto a CD. (See page 239, Exporting Photos.)


