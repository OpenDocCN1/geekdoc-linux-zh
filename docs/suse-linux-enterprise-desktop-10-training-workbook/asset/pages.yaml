    # Viewing HTML Images


    Images in HTML messages can either be embedded in the message or act as links
    in the message to track whether the message is read. Because spammers can potentially
    use these links, Evolution automatically blocks these images unless you specify
    otherwise.


    To load images for a selected message, select View | Load Images.


    To set the default for loading HTML messages:


    +   1. Select Edit | Preferences.

    2. Click the Mail Preferences icon.

    3. Click the HTML Mail tab.

    4. In the Loading Images area, choose one of these options.

    5. Click Close.


    ![](img/04bf849117b7b93d509c3755c065ff54_308_1.png)'
