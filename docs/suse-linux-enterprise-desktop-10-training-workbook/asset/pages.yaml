  md: '# Section 6: Entertaining Yourself


    +   5. Browse to the desired file or folder and click **Open**. The file or folder
    will be imported and appear in your playlist.


    # Editing Song Information


    You can edit information about each song in your playlist. To do so:


    +   1. Select a song by highlighting it in your music library.


    +   2. Select **Edit | Edit Song Metadata**, OR click the **Edit** button in the
    bottom right corner OR right-click the song title and select **Edit Song Metadata**.


    +   3. In the window that appears, you can edit the track number, artist, album,
    title, and genre. You can also view statistics about the song, such as the date
    it was last played and the number of times it has been played.


    ![](img/04bf849117b7b93d509c3755c065ff54_225_0.png)


    +   4. Click **Save** after making any changes.


    # Creating and Managing Playlists


    You can organize your music library by creating playlists. Playlists group music
    together by topic. You might want to create a playlist for workout music or for
    a certain genre of music, for example. To create a new playlist, follow these
    steps:


    +   1. Select **Music | New Playlist**, OR press **Ctrl+N**.


    +   2. A new playlist appears in the left panel.


    +   3. Highlight the new playlist and select **Edit | Rename Playlist** to give
    the playlist a name OR right-click the playlist and select **Rename Playlist**.'
