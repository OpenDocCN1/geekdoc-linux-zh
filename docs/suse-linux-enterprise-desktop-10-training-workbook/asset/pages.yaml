  md: 'Smooth scrolling is helpful when reading long pages. When this box is checked,
    pressing the Page Down key moves the text down a page smoothly. This makes it
    easier for you to see how much the text has scrolled and to find your place on
    the next page.


    +   - Languages

    Click the Edit Languages button to select your preferred language (The Web site
    must be offered in that language in order for this to work). To add a language
    to your list, Select a language to add. To remove a language from your list, highlight
    it and click Remove. Organize your languages in order of preference, in case a
    Web site is offered in two or more of your preferred languages. To do this, click
    the Move Up and Move Down buttons.


    # Update


    Firefox can inform you when updates to extensions, themes, or Firefox are available.
    If you do not wish to Firefox check for updates, de-select the appropriate boxes.


    By default, Firefox installs updates automatically. Check Ask me I want to do
    to manually control installation of updates.


    If you check Automatically download and install the update, the update will be
    downloaded and then installed the next time you restart Firefox. You can also
    choose to be warned if installation of an update will disable extensions or themes
    that don''t have compatible versions. The warning will allow you to postpone installation.


    View the updates you have installed by clicking the Show Update History button.


    # Security


    The Security tab contains preferences about protocols and certificates.


    ![](img/04bf849117b7b93d509c3755c065ff54_289_0.png)'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Applying Settings and Preferences


    Under Protocols, you can select SSL 2.0, SSL 3.0, TLS 1.0, or all three. SSL 2.0
    (Secure Sockets Layer 2) is the standard protocol for secure transmissions. SSL
    3.0 is more secure than SSL 2.0, but some Web sites may not support it. TLS (Transport
    Layer Security) is an open security standard similar to SSL 3.0. Some Web sites
    may not support it.


    Certificates help perform encryption and decryption of connections to secure sites.
    You can choose whether you want to manually select certificates (Ask me every
    time) or let Firefox automatically select them (Select one automatically). You
    can also set more advanced preferences by clicking the following buttons:


    +   * View Certificates: This button allows you to view stored certificates, import
    new ones, and delete or backup old ones.

    * Revocation Lists: Certificate Revocation Lists (CRLs) ensure the validity of
    certificates. Click this button to manage your CRLs.

    * Verification: Online Certificate Status Protocol (OCSP) validates your certificates
    every time they are viewed or used. Enable OCSP by clicking on this button.

    * Security Devices: Security devices store passwords and certificates along with
    encrypting and decrypting connections. If you need to use a security device other
    than the one provided in Firefox, click this button.


    # Choosing a Theme


    Themes allow you to personalize the look and feel of Firefox''s graphical user
    interface. They change only the look of Firefox, not its actions or functionality.


    To open the Themes window, select Tools | Themes from the Menu bar in your Firefox
    browser.


    In the left panel of the Themes window a list of installed themes will display.


    Highlight a theme to see a sample of icons the theme includes.


    To use a theme, highlight the preferred theme and click the Use Theme button.


    To uninstall a theme, highlight it and click Uninstall. You may need to close
    Firefox and reopen it for the changes will take effect.


    ![](img/04bf849117b7b93d509c3755c065ff54_290_0.png)'
  merge: -1
