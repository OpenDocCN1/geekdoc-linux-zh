    items for configuration displayed in the main panel. You will use the tree at
    the left to navigate from one area of configuration to another. If you simply
    need to start or stop your firewall, you can do so from the Start Up dialog by
    clicking the corresponding button. If you need to configure the firewall for the
    first time or change any settings, you also begin here.

    6. Choose the When Booting radio button to tell your firewall to start working
    as soon as the computer is booted. Choose the Manually radio button if you would
    like to manually start your firewall service as needed.

    7. From the tree on the left side of the YaST terminal, select Interfaces.


