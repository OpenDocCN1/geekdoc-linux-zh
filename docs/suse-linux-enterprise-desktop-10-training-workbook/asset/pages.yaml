    +   10. If this meeting is not an all-day event, select a time and duration in
    the appropriate fields.


    +   11. Enter a time zone in the *Time zone* field. To show or hide this field,
    select View | **Time Zone**.


    +   12. Enter a description of the meeting in the *Description* field.


    +   13. To set an alarm for this meeting, click the **Alarms** button and enter
    specifics about when and how the alarm will notify you.


    +   14. If you want to add an attachment, click **Show Attachment Bar** (found
    at the bottom of the Meeting window) and drag and drop the attachment into the
    Attachment bar, or select **Insert | Attachment**, or click the **Attachment**
    button on the toolbar.


    +   15. If you want to classify your message, select **Options | Classification**
    and then select **Public**, **Private**, or **Confidential**.


    +   16. If you want the meeting to recur, click the **Recurrence** button, or
    select **Options | Recurrence** and enter specifics.


    +   17. If you are using a groupware server and want to view the schedules of
    the attendees before you set a time for your meeting, click the **Free/Busy**
    button, or select **Options | Free/Busy**. The Free/Busy window will open.


    ![](img/04bf849117b7b93d509c3755c065ff54_327_0.png)


    +   18. This window allows you to view the schedules of the attendees and choose
    an available time for your meeting. You can manually enter a time or click **Autopick**
    to automatically find the best time for everyone. Click **Close** when the time
    is set.'
