  md: '# Section 3: Managing Files with Nautilus


    # Accessing Removable Media


    # Chapter Objectives


    +   * Identify different types of removable media.

    * Mount (attach) your removable media.

    * Open a file from your removable media.

    * Save a file to your removable media.

    * Copy a file from your removable media to your desktop.

    * Unmount (remove) removable media from your computer.


    # Identifying Removable Media


    Removable media are any data-storage devices that you can physically remove from
    your computer. You can use many types of removable media in conjunction with Linux.
    The most common are CD- and DVD-ROMs and USB drives. Linux supports older auxiliary
    items as well, such as floppy disks and Zip disks.


    The primary differences between CD- or DVD-ROMs and USB (Flash) drives are their
    writability (the ability to add and remove information), durability, and cost.
    Both have very large memory capabilities; for example, some Flash drives have
    more than 1 GB of memory. Compare the two to determine which will fill your need
    for data storage.


    > **CD- and DVD-ROMs**—Reusable only if the disk is rewritable; portable but very
    easily ruined by scratches; inexpensive to moderate in price, depending on whether
    an external CD- or DVD-ROM drive is needed and whether the disk is rewritable.

    **USB (Flash) drives**—Easy to save new information to; very portable and durable;
    price depends on memory size, but they are generally moderate in price.


    # Mounting Removable Media


    Linux requires you to mount and unmount most removable devices. Mounting is the
    process of making the device'' file system accessible by the Linux file system.
    When you mount removable media, the device''s file system is attached as a subdirectory
    to the Linux file system on your computer. You must tell your computer where and
    how to access the media you insert.


    To mount removable media, insert the device in the appropriate hardware. An icon
    representing the device displays on the desktop. If the icon does not appear on
    the desktop:'
  merge: -1
  pgno: 125
- img_proc: true
