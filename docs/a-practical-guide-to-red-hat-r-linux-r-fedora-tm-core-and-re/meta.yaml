- img_proc: false
  md: 'A toolbar ([Figure 4-7](#)) usually appears at the top of a window and contains
    icons, text, applets, menus, and more. Many kinds of toolbars exist. The titlebar
    is not a toolbar; it is part of the window decoration placed there by the window
    manager (page [121](#)).


    ![](bbox=[0.129, 0.205, 0.368, 0.382])


    A context menu is a menu that applies specifically to the window you click. Frequently
    a right-click brings up a context menu. Try right-clicking on the icons on the
    desktop. Depending on what the icon represents, you get a different menu. For
    example, the context (icon) menu is different for the Trash, CD/DVD, and folder
    icons. Try right-clicking with the mouse pointer in different places; you will
    find some interesting menus.


    # Changing the Input Focus (Window Cycling)


    The window with the input focus is the one that receives keyboard characters and
    commands you type. In addition to using the Taskbar (page [86](#)), you can change
    which window on the current workspace has the input focus by using the keyboard;
    this process is called *window cycling*. When you press ALT-TAB, the input focus
    shifts to the window that was active just before the currently active window,
    making it easy to switch back and forth between two windows. When you hold ALT
    and press TAB multiple times, the focus moves from window to window, and KDE displays
    in the center of the workspace a box that holds the titlebar information from
    the window that currently has the input focus. Under KDE, you can hold ALT and
    SHIFT and repeatedly press TAB to cycle in the other direction.


    # Shading a Window


    When you double-click a KDE titlebar ([Figure 4-8](#)), the window rolls up like
    a window shade, leaving only the titlebar visible. Double-click the titlebar again
    to restore the window. If the window does not roll up, try double-clicking more
    quickly.


    # Cutting and Pasting Objects Using the Clipboard


    There are two similar ways to cut/copy and paste objects (e.g., icons and windows)
    and text on the desktop. You can use the clipboard, technically called the *copy
    buffer*, to copy or move objects or text: You explicitly copy an object or text
    to the buffer and then paste it somewhere else. Applications that follow the user
    interface guidelines use CONTROL-X to cut, CONTROL-C to copy, and CONTROL-V to
    paste.


    You may be less familiar with the *selection or primary* buffer, which always
    contains the text you most recently selected (highlighted). You cannot use this
    method to copy objects. Clicking the middle mouse button (click the scroll wheel
    on a mouse that has one) pastes the contents of the selection buffer at the location
    of the mouse pointer (if you are using a two-button mouse, click both buttons
    at the same time to simulate clicking the middle button).


    With both of these techniques, you start by highlighting the objects or text you
    want to select. You can drag a box around objects to select them or drag the mouse
    pointer over text to select it. Double-click to select a word or triple-click
    to select a line.


    Next, to use the clipboard, explicitly copy (CONTROL-C) or cut (CONTROL-X) the
    objects or text.[<sup>[1]</sup>](#) If you want to use the selection buffer, skip
    this step.


    [1] These control characters do not work in a terminal emulator window because
    the shell running in the window intercepts them before the terminal emulator can
    receive them. You must either use the selection buffer in this environment or
    use copy/paste from the **Edit** selection on the menubar or from the context
    menu (right-click).'
