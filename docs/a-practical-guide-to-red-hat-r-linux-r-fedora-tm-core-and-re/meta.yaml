  md: '# ## Installation Tasks


    This section details some common tasks you may need to perform during or after
    installation. It covers using Disk Druid to partition the disk during installation,
    using parted to modify partitions after installation, using Kickstart to automate
    installation, and setting up a system that will boot either Windows or Linux (a
    dual-boot system).


    # ## Using Disk Druid to Partition the Disk


    Disk Druid, a graphical disk-partitioning program that can add, delete, and modify
    partitions on a hard disk, is part of the Red Hat installation system. You can
    use Disk Druid only while you are installing a system: It cannot be run on its
    own. You can use [parted](page 65) to manipulate partitions and system-config-lvm
    to work with LVs after you install Red Hat Linux. As explained earlier, if you
    want a basic set of partitions, you can allow Anaconda to partition the hard disk
    automatically.


    Anaconda runs Disk Druid when you put a check mark in the box labeled **Review
    and modify partitioning layout** or if you select **Create custom layout** in
    the Partition the Disk screen ([page 50](page 50)).


    Clone and RAID


    Disk Druid includes Clone, a tool that copies the partitioning scheme from a single
    drive to other drives. Clone is useful for making multiple copies of a RAID partition/drive
    when you are creating a large RAID array of identical partitions or identically
    partitioned drives. Click the **RAID** button to access the Clone tool, which
    is active only when at least one unallocated RAID partition exists. For more information
    on RAID, see [page 31](page 31).


    [Figure 3-12](Figure 3-12) shows the Disk Druid main screen as it appears when
    you have chosen the default layout for the hard disk (see "[Partition the Disk](Partition
    the Disk)" on [page 50](page 50)). This screen has three sections (going from
    top to bottom): a graphical representation of the disk drives showing how each
    is partitioned (not shown [Figure 3-12](Figure 3-12)), a row of buttons, and a
    graphical table listing one partition or LV per line.


    **Figure 3-12. Disk Druid: main screen, default layout**


    [View full size image](View full size image)'
  merge: -1
  pgno: 109
- img_proc: false
  md: '![](bbox=[0.091, 0.058, 0.916, 0.494])


    The following buttons appear near the top of the screen:


    +   - **New** Adds a new partition to the disk (page60).

    - **Edit** Edits the highlighted partition or LV (both on page61).

    - **Delete** Deletes the highlighted partition or LV.

    - **Reset** Cancels the changes you have made and causes the Disk Druid table
    to revert so it matches the layout of the disk.

    - **RAID** Enables you to create software RAID partitions and to join two or more
    RAID partitions into a RAID device (page61).

    - **LVM** Enables you to create physical volumes (PVs), which you can then use
    to create LVs (page62).


    The Disk Druid table contains the following columns:


    +   - **Device** The name of the device in the **/dev** directory (for example,
    **/dev/hda1**).

    - **Mount Point/RAID/Volume** Specifies where the partition will be mounted when
    the system is brought up (for example **/usr**). Also used to specify the RAID
    device or LVM volume the partition is part of.

    - **Type** The type of partition, such as **ext3**, **swap**, or PV.

    - **Format** A check mark in this column indicates the partition will be formatted
    as part of the installation procedure. All data on the partition will be lost.

    - **Size (MB)** The size of the partition or LV in megabytes.'
