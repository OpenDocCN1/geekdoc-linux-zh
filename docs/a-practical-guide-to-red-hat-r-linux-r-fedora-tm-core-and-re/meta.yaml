  md: "# Gathering Information About the System\n\nIt is not difficult to install\
    \ and bring up a Linux system, but the more you know about the process before\
    \ you start, the easier it will be. The installation software collects information\
    \ about the system and can help you make decisions during the installation process.\
    \ However, the system will work better when you know how you want your disk partitioned\
    \ rather than letting the installation program create partitions without your\
    \ input. The screen will be easier to use if you know what resolution you want.\
    \ There are many details, and the more details you take control of, the more pleased\
    \ you are likely to be with the finished product. Finding the information that\
    \ this section asks for will help ensure that you end up with a system you understand\
    \ and know how to change when necessary. More and more, the installation software\
    \ probes the hardware and figures out what you have. Newer equipment is more likely\
    \ to report on itself than older equipment is.\n\nIt is critical to have certain\
    \ pieces of information before you start. One thing Linux can never figure out\
    \ is all the relevant names and IP addresses (unless you are using DHCP, in which\
    \ case the addresses are set up for you).\n\nFollowing is a list of items you\
    \ may need information about. Get as much information on each item as you can:\
    \ manufacturer, model number, size (megabytes, gigabytes, and so forth), number\
    \ of buttons, chipset (for boards), and so on. Some items, such as the network\
    \ interface card, may be built into the motherboard.\n\n+   - Hard disks.\n- Memory\
    \ (you don't need it for installation, but it is good to know).\n- SCSI interface\
    \ card.\n- Network interface card (NIC).\n- Video interface card (including the\
    \ amount of video RAM/memory).\n- Sound card and compatibility with standards,\
    \ such as SoundBlaster.\n- Mouse (PS/2, USB, AT, and number of buttons).\n- Monitor\
    \ (size, maximum resolution).\n- IP addresses and names, unless you are using\
    \ DHCP (page 431), in which case the IP addresses for the system are automatically\
    \ assigned. Most of this information comes from the system administrator or ISP.\n\
    \  - System hostname (anything you like)\n  - System address\n  - Network mask\
    \ (netmask)\n  - Gateway address (the connecting point to the network or Internet)\
    \ or a phone number when you use a dial-up connection\n  - Addresses for nameservers,\
    \ also called DNS addresses\n  - Domain name (not required)"
  merge: -1
