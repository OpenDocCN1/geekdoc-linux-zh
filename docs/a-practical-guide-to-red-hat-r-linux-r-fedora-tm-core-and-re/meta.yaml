  md: '+   - **You are not logging in on the right machine.** The login/password combination
    may not be valid if you are trying to log in on the wrong machine. On a larger,
    networked system, you may have to specify the machine that you want to connect
    to before you can log in.

    - **Make sure your username is valid.** The login/password combination may not
    be valid if you have not been set up as a user. If you are the system administrator,
    refer to "Configuring User and Group Accounts" on page 538. Otherwise, check with
    the system administrator.


    Refer to "Changing Your Password" on page 114 when you want to change your password.


    # Logging Out


    To log out of a KDE graphical environment, click the red hat or Fedora logo at
    the lower-left corner of the display and choose **Logout** from the pop-up menu.
    From GNOME, select **System** or **Actions** from the panel at the top of the
    screen and click **Log Out**. From a textual environment, press CONTROL-D or give
    the command **exit** in response to the shell prompt.


    # Using Virtual Consoles


    When running Linux on a personal computer, you frequently work with the display
    and keyboard attached to the computer. Using this physical console, you can access
    as many as 63 *virtual consoles* (also called *virtual terminals*). Some are set
    up to allow logins; others act as graphical displays. To switch between virtual
    consoles, hold the CONTROL and ALT keys down and press the function key that corresponds
    to the console you want to view. For example, CONTROL-ALT-F5 displays the fifth
    virtual console. This book refers to the console that you see when you first boot
    a system (or press CONTROL-ALT-F1) as the *system console* (or just *console*).


    By default, six virtual consoles are active and have text login sessions running.
    When you want to use both textual and graphical interfaces, you can set up a textual
    session on one virtual console and a graphical session on another. No matter which
    virtual console you start a graphical session from, the graphical session runs
    on the first unused virtual console (number seven by default).


    # Logging In Remotely: Terminal Emulation and ssh or telnet'
