    # Specifying a monitor


    To specify a monitor, click **Configure** across from the words **Monitor Type**;
    system-config-display displays the Monitor window. Scroll down until the name
    of the manufacturer of the monitor you are using appears and click the triangle
    to the left of that name; system-config-display opens a list of models made by
    that manufacturer. Scroll through the list of models. Click to highlight the model
    you are using and then click **OK**. If an appropriate model is not listed, scroll
    to the top of the list and click the triangle next to **Generic CRT Display**
    or **Generic LCD Display**, depending on the type of monitor you are setting up.
    From one of these lists, select the maximum resolution the monitor is capable
    of displaying. Click **OK**.


    # Specifying a video card


    To specify a video card, click **Configure** adjacent to the words **Video Card**;
    system-config-display displays the Video Card window. Scroll down until you see
    the manufacturer and model of the video card in your system. Click **OK**.'
