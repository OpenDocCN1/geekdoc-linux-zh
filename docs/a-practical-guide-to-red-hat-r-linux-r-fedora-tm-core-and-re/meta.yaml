  md: '+   - **Number** The minor device number (page 463) of the device holding the
    partition. This number is the same as the last number in the device name. In the
    example, 4 corresponds to /dev/hda4.

    - **Start** The location on the disk where the partition starts. The parted utility
    specifies a location on the disk as the distance, in bytes, from the start of
    the disk. Thus partition 3 starts 12 gigabytes from the start of the disk.

    - **End** The location on the disk where the partition stops. Although partition
    2 ends 12 gigabytes from the start of the disk and partition 3 starts at the same
    location, parted takes care that the partitions do not overlap at this single
    byte.

    - **Size** The size of the partition in kilobytes (kB), megabytes (MB), or gigabytes
    (GB).

    - **Type** The partition type: primary, extended, or logical. See Figure 3-19
    (next page) and page 28 for information on partitions.

    - **File system** The filesystem type: ext2, ext3, fat32, linux-swap, etc. See
    Table 12-1 on page 464 for a list of filesystem types.

    - **Flags** The flags that are turned on for the partition, including boot, swap,
    raid, and lvm. In the example, partition 1 is bootable.


    # Figure 3-19. The primary and extended partitions from the example


