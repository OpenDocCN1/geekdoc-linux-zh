- img_proc: false
  md: "If a file is sorted before it is processed by uniq, this utility ensures that\
    \ no two lines in the file are the same. (Of course, sort can do that all by itself\
    \ with the **u** option.) Refer to the uniq info page for more information.\n\n\
    # diff: Compares Two Files\n\nThe diff (difference) utility compares two files\
    \ and displays a list of the differences between them. This utility does not change\
    \ either file, so it is useful when you want to compare two versions of a letter\
    \ or a report or two versions of the source code for a program.\n\nThe diff utility\
    \ with the **u** (unified output format) option first displays two lines indicating\
    \ which of the files you are comparing will be denoted by a plus sign (**+**)\
    \ and which by a minus sign (**-**). In [Figure 5-8](#), a minus sign indicates\
    \ the **colors.1** file; a plus sign indicates the **colors.2** file.\n\n# Figure\
    \ 5-8. diff displaying the unified output format\n\n```\n$ diff -u colors.1 colors.2\n\
    --- colors.1     Fri Nov 25 15:45:32 2005\n+++ colors.2     Fri Nov 25 15:24:46\
    \ 2005\n@@ -1,6 +1,5 @@\n red\n+blue\n green\n yellow\n-pink\n-purple\n orange\n\
    ```\n\nThe **diff u** command breaks long, multiline text into *hunks*. Each hunk\
    \ is preceded by a line starting and ending with two at signs (**@@**). This hunk\
    \ identifier indicates the starting line number and the number of lines from each\
    \ file for this hunk. In [Figure 5-8](#), the hunk covers the section of the **colors.1**\
    \ file (indicated by a minus sign) from the first line through the sixth line.\
    \ The **-1,6** then indicates that the hunk covers **colors.2** from the first\
    \ line through the fifth line.\n\nFollowing these header lines, **diff u** displays\
    \ each line of text with a leading minus sign, a leading plus sign, or nothing.\
    \ A leading minus sign indicates that the line occurs only in the file denoted\
    \ by the minus sign. A leading plus sign indicates that the line comes from the\
    \ file denoted by the plus sign. A line that begins with neither a plus sign nor\
    \ a minus sign occurs in both files in the same location. Refer to the diff info\
    \ page for more information.\n\n# file: Tests the Contents of a File"
