    You can run character-based programs that would normally run on a terminal in
    a terminal emulator window. You can also start graphical programs, such as xeyes,
    from this window. A graphical program opens its own window. When you run a program
    from GNOME or KDE, you may be asked whether you want to run the program in a terminal.
    When you answer **yes**, the program runs in a terminal emulator window.


    When you are typing in a terminal emulator window, several characters, including
    *, ?, |, [, and ], have special meanings. Avoid using these characters until you
    have read "Special Characters" on page 126.


    The shell


    Once you open a terminal emulator window, you are communicating with the command
    interpreter known as the *shell*. The shell plays an important part in much of
    your communication with Linux. When you enter a command at the keyboard in response
    to the shell prompt on the screen, the shell interprets the command and initiates
    the appropriate actionfor example, executing a program; calling a compiler, a
    Linux utility, or another standard program; or displaying an error message indicating
    that you entered a command incorrectly. When you are working on a GUI, you bypass
    the shell and execute a program by clicking an icon or name. Refer to Chapter
    7 for more information on the shell.


