- img_proc: false
  md: 'Now click the rectangle labeled **3** and open the OpenOffice.org Writer by
    clicking the Main menu icon (the red hat or Fedora logo), clicking **Office**
    from the pop-up menu, and then clicking **Word Processor** from the submenu. With
    Writer in workspace 3 and Firefox in workspace 2, you can click the rectangles
    in the Pager to switch back and forth between the workspaces. GNOME calls this
    tool the *Workspace Switcher*.


    Taskbar


    To the right of the Pager is the *Taskbar*, a group of skinny, horizontal rectangles
    with an icon and the name of a program in each one. You can use the Taskbar to
    display a specific window regardless of which workspace it appears in. Click one
    of the rectangles and the corresponding program/window appears on the screen;
    KDE switches to a different workspace if necessary. If the window running the
    program you clicked on is not visible because it is buried under other windows,
    you can click a rectangle on the Taskbar to pop the window to the top of the stack
    of windows. GNOME calls this tool the *Window List*. If you have a lot of applications
    running on various workspaces, you can configure the Taskbar to show only those
    applications on the current workspace. See "[Configuring the panel](#)" on page
    [101](#) for more information on configuring the Taskbar.


    # Launching Applications from the Main Menu


    The red hat or Fedora icon at the left end of the KDE Main panel has a function
    similar to that of the **Start** button on a Windows system; click it to display
    the Main menu. From the Main menu and its submenus, you can launch many of the
    applications on the system. This menu differs under GNOME and KDE.


    KNotes


    You can use the Main menu to launch KNotes, a reminder system that displays windows
    that look like Post-it notes. After you display the Main menu, slide the mouse
    pointer over the Main menu until it is over **Utilities**. The system displays
    the Utilities submenu. If you click **Utilities**, KDE freezes the Utilities submenu.
    With or without clicking **Utilities**, move the mouse pointer until it is over
    **Desktop** and KDE displays another submenu. Now slide the mouse pointer until
    it is over **KNotes** and click to display a small, yellow window that you can
    type in ([Figure 4-6](#)).


