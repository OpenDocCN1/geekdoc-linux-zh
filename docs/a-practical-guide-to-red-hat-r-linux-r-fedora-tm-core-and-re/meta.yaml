  md: '# # Preface


    # ## The book


    Whether you are an end user, a system administrator, or a little of each, this
    book explains with step-by-step examples how to get the most out of a Fedora Core
    or Red Hat Enterprise Linux system. In 28 chapters, this book takes you from installing
    a Fedora Core or Red Hat Enterprise Linux system through understanding its inner
    workings to setting up secure servers that run on the system.


    # ## The audience


    This book is designed for a wide range of readers. It does not require you to
    have programming experience, but having some experience using a general-purpose
    computer is helpful. This book is appropriate for


    +   - **Students** who are taking a class in which they use Linux

    - **Home users** who want to set up and/or run Linux

    - **Professionals** who use Linux at work

    - **System administrators** who need an understanding of Linux and the tools that
    are available to them

    - **Computer science students** who are studying the Linux operating system

    - **Programmers** who need to understand the Linux programming environment

    - **Technical executives** who want to get a grounding in Linux


    # ## Benefits


    *A Practical Guide to Red Hat® Linux®: Fedora Core™ and Red Hat Enterprise Linux,
    Third Edition*, gives you a broad understanding of many facets of Linux, from
    installing Red Hat Linux through using and customizing it. No matter what your
    background, this book gives you the knowledge you need to get on with your work.
    You will come away from this book understanding how to use Linux, and this book'
  merge: -1
  pgno: 14
- img_proc: false
  md: 'will remain a valuable reference for years to come.


    # Overlap


    If you read *A Practical Guide to Linux<sup>®</sup> Commands, Editors, and Shell
    Programming* you will notice some overlap between that book and the one you are
    reading now. The first chapter, and the chapters on the utilities, the filesystem,
    programming tools, and the appendix on regular expressions are very similar in
    the two books, as are the three chapters on the Bourne Again Shell (bash). Chapters
    that appear in this book but not in *A Practical Guide to Linux<sup>®</sup> Commands,
    Editors, and Shell Programming* include [Chapters 2](link) and [3](link) (installation),
    [Chapters 4](link) and [8](link) (Red Hat Linux and the GUI), [Chapter 10](link)
    (networking), all of the chapters in [Part IV](link) (system administration) and
    [Part V](link) (servers), and [Appendix C](link) (security).


    # This Book Includes Fedora Core 5 on a DVD


    *A Practical Guide to Red Hat<sup>®</sup> Linux<sup>®</sup>, Third Edition* includes
    a DVD that you can use to install or upgrade to Fedora Core 5. [Chapter 2](link)
    helps you get ready to install Fedora Core. [Chapter 3](link) provides step-by-step
    instructions for installing Fedora Core from this DVD. This book guides you through
    learning about, using, and administrating Fedora Core or Red Hat Enterprise Linux.


    # What Is New in This Edition?


    The third edition of *A Practical Guide to Red Hat<sup>®</sup> Linux<sup>®</sup>*
    covers Fedora Core 5 and Red Hat Enterprise Linux version 4. All the changes,
    large and small, that have been made to these products since the second edition
    of this book have been incorporated into the explanations and examples. The following
    list details the sections of this book that have undergone the most major changes.


    +   - **Access Control Lists** (ACLs; page [185](link)) A security feature that
    provides finer-grained control over which users can access specific directories
    and files than do traditional Linux permissions.


    +   - **SELinux** (Security Enhanced Linux; page [400](link)) A security feature
    that enforces security policies that limit what a user or program can do.


    +   - bash (the Bourne Again Shell; [Chapters 7](link), [9](link), and [28](link))
    These chapters have been reorganized and rewritten to provide clearer explanations
    and better examples of how bash works both from the command line in day-to-day
    work and as a programming language to write shell scripts.


    +   - yum (page [476](link)) A program that keeps Fedora Core systems up-to-date.
    The yum utility downloads software from repositories on the Internet. It can upgrade
    existing software and install new software. You can run yum manually or have it
    run automatically every night.


    +   - pirut (page [483](link)) A graphical software package management utility.
    The pirut utility is similar to yum except that it works with groups of software
    packages. For example, you can use pirut to download and install the entire KDE
    desktop environment with one command.


    +   - parted (page [65](link)) A command line utility that reports on and manipulates
    hard disk partitions.'
