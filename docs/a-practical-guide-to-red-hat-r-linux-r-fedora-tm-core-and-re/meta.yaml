  md: '# Use existing free space


    If there is sufficient free space on the Windows disk, you can install Linux there.
    This technique is the optimal choice, but there is rarely enough free space on
    an installed hard disk.


    # Resize Windows partitions


    You can use Windows software, such as Partition Magic, to resize existing Windows
    partitions to open up free space in which to install Linux.


    # Add a new disk drive


    Add another disk drive to the system and install Linux on the new disk, which
    contains only free space. This technique is very easy and clean but requires a
    new disk drive.


    # Remove a Windows partition


    If you can delete a big enough Windows partition, you can install Linux in its
    place. To delete a Windows partition, you must have multiple partitions under
    Windows and be willing to lose any data in the partition you delete. In many cases,
    you can move the data from the partition you will delete to another Windows partition.


    Once you are sure a partition contains no useful information, you can use Disk
    Druid to delete it when you install Linux: From the Partition the Disk screen
    (page [50](#)), choose to create a custom layout with Disk Druid, highlight the
    partition you want to delete, and click the **Delete** button. After deleting
    the partition, you can install Red Hat Linux in the free space left by the partition
    you removed.


    # Installing Red Hat Linux as the Second Operating System


    After creating enough free space on a Windows system (as discussed in the previous
    section), you can begin installing Red Hat Linux. When you get to the Partition
    the Disk screen (page [50](#)), choose **Use free space on selected drives and
    create default layout** to have Anaconda partition the free space on the hard
    disk automatically. If you need to delete a Windows partition, you must choose
    **Create**'
  merge: -1
