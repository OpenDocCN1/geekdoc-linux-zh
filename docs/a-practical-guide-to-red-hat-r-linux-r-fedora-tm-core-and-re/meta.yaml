    # ## LVs: Logical Volumes


    When you ask Anaconda to partition the hard disk with a default layout (see "[Partition
    the Disk](#)" on page [50](#)), it uses LVM (page[32](#)) to set up most of the
    hard disk, creating LVs instead of partitions. It places **/boot** on the first
    partition on the drive, not under the control of LVM. LVM creates a VG (volume
    group) named **VolGroup00**. Within this VG it creates two LVs: swap **LogVol01**)
    and root (/ **, LogVol00**). The swap LV occupies up to a few gigabytes; the root
    LV takes up the rest of the drive. This section explains how to make the root
    LV smaller so that you can add additional LVs to **VolGroup00**.


    If you click the **LVM** button with the default setup (with the root LV occupying
    all of the disk that is not occupied by the swap LV and the **/boot** partition),
    Disk Druid displays a dialog box that advises you that there are not enough physical
    volumes and suggests that you create'
