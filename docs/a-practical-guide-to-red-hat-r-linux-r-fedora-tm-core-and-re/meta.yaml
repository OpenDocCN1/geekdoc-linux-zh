  md: '# 4. Introduction to Red Hat Linux


    IN THIS CHAPTER


    +   - [Curbing Your Power: Superuser/root Access](#) — 82

    - [A Tour of the Red Hat Linux Desktop](#) — 82

    - [Using Konqueror to Manage Files, Run Programs, and Browse the Web](#) — 94

    - [Customizing Your Desktop with the KDE Control Center](#) — 97

    - [Customizing the Main Panel Using the Panel Menu](#) — 100

    - [Getting the Facts: Where to Find Documentation](#) — 102

    - [HOWTOs: Finding Out How Things Work](#) — 109

    - [More About Logging In](#) — 111

    - [What to Do if You Cannot Log In](#) — 112


    One way or another you are sitting in front of a computer that is running Red
    Hat Linux. This chapter takes you on a tour of the system to give you some ideas
    about what you can do with it. The tour does not go into depth about choices,
    options, menus, and so on; that is left for you to experiment with and to explore
    in greater detail in later chapters. Instead, this chapter presents a cook''s
    tour of the Linux kitchen; as you read it, you will have a chance to sample the
    dishes that you will enjoy more fully as you read the rest of the book.


    Following the tour are sections that describe where to find Linux documentation
    (page 102) and offer more about logging in on the system, including information
    about passwords (page 111). The chapter concludes with a more advanced, optional
    section about working with windows (page 119).


    In the next section, be sure to read the warning about the dangers of misusing
    the powers of Superuser. Heed that warning, but feel free to experiment with the
    system: Give commands, create files, click icons, choose items from menus, follow
    the examples in this book, and have fun.'
