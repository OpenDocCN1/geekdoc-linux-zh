  md: '# # Conventions Used in This Book


    This book uses conventions to make its explanations shorter and clearer. The following
    paragraphs describe these conventions.


    # ## Red Hat Linux


    In this book, the term *Red Hat Linux* refers to both Fedora Core and Red Hat
    Enterprise Linux. Features that apply to one operating system or the other only
    are marked as such, using these markers: FEDORA or RHEL.


    # ## Text and examples


    The text is set in this type, whereas examples are shown in a `monospaced font`
    (also called a *fixed-width* font):


    ```

    $ **cat practice**

    This is a small file I created

    with a text editor.

    ```


    # ## Items you enter


    Everything you enter at the keyboard is shown in a bold typeface: Within the text,
    **this bold typeface** is used; within examples and screens, **this one** is used.
    In the previous example, the dollar sign ($) on the first line is a prompt that
    Linux displays, so it is not bold; the remainder of the first line is entered
    by a user, so it is bold.


    # ## Utility names'
  merge: -1
