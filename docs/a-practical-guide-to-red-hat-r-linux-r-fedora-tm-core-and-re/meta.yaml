  md: '+   Keyboard keys that you press with the CONTROL key, such as CONTROL-D. (Even
    though D is shown as an uppercase letter, you do not have to press the SHIFT key;
    enter CONTROL-D by holding the CONTROL key down and pressing **d**.)


    # Prompts and RETURNs


    Most examples include the *shell prompt* the signal that Linux is waiting for
    a command as a dollar sign ($), a pound sign (#), or sometimes a percent sign
    (%). The prompt is not in a bold typeface because you do not enter it. Do not
    type the prompt on the keyboard when you are experimenting with examples from
