  md: 'To resize a window, move the mouse pointer over an edge of the window; the
    pointer turns into a double arrow. Click and drag the side of the window as you
    desire. When you position the mouse pointer over a corner of the window and drag,
    you can resize the height and width of the window at the same time.


    Titlebar


    A titlebar (Figures 4-7 and 4-8) appears at the top of most windows and in many
    ways controls the window it is attached to. You can change the appearance and
    function of a titlebar, but it will usually have at least the functionality of
    the buttons shown in Figure 4-8.


    **Figure 4-8. A titlebar**


    ![](bbox=[0.196, 0.531, 0.804, 0.753])


    The minimize button collapses the window to its rectangle in the Taskbar on the
    panel; click the rectangle on the Taskbar to restore the window. Clicking the
    maximize button expands the window so it occupies the whole workspace; click the
    same button on the titlebar of a maximized window (the button has a double-window
    icon) to restore the window to its former size. Clicking the maximize button with
    the middle or right mouse button expands the window vertically or horizontally.
    Use the same or a different mouse button to click the maximize button again and
    see what happens. Clicking the close button closes the window and terminates the
    program that was running in it. Left-click the titlebar and drag the window to
    reposition it.


    Window Operations menu


    The Window Operations menu (Figure 4-8) contains most of the common operations
    that you need to perform on any window. Click the Window Operations menu button
    or right-click the titlebar to display this menu.'
  merge: -1
