  md: '# Installing Red Hat Linux


    To begin most installations, insert the first installation CD or the installation
    DVD into the CD/DVD drive and turn on or reset the system. For hard disk- and
    network-based installations, you can use the rescue CD (page 40) instead of the
    CD or DVD.


    The system boots from the CD or DVD and displays a screen of instructions with
    a **boot:** prompt at the bottom. Refer to ''BIOS setup'' on page 26 if the system
    does not boot from the CD or DVD.


    You cannot boot from a floppy diskette


    Because most kernels have grown too large to fit on a floppy diskette, you cannot
    boot from a floppy. Specifically you cannot fit a standard Fedora Core or Red
    Hat Enterprise Linux kernel on a floppy diskette. Fedora gives you the option
    of booting from a USB pen drive using the **diskboot.img** file.


    # Booting the System: The boot: Prompt


    Normal installation


    You can supply many different parameters following the **boot:** prompt. You must
    press RETURN after entering any of these parameters. If you are installing from
    CDs or a DVD, you can generally press RETURN without entering anything to start
    installing Red Hat Linux. Or you can just wait if you do not type anything for
    a minute, the installation proceeds as though you pressed RETURN.


    # Tip: CD and DVD installations work the same way


    On the installation screens, the term CD means CD or DVD. Aside from changing
    CDs during an installation, there is no difference between installing from CDs
    and installing from a DVD.


    Display problems'
  merge: -1
  pgno: 85
- img_proc: false
  md: 'If you encounter problems with the display during installation, supply the
    following parameters, which turn off video memory, in response to the **boot:**
    prompt:


    ```

    boot: **linux nofb**

    ```


    # Non-CD/DVD installation


    If you are installing from other than CDs or a DVDthat is, if you are installing
    from files on the local hard disk or from files on another system using FTP, NFS,
    or HTTPsupply the following parameters in response to the **boot:** prompt:


    ```

    boot: **linux askmethod**

    ```


    See page [45](#) for information on using the**askmethod** parameter.


    # Booting


    As the system boots, text scrolls on the monitor, pausing occasionally. After
    a while (up to a few minutes, depending on the speed of the system), the installer
    displays a graphical or pseudographical display, depending on the system you are
    installing and the commands you gave at the **boot:** prompt.


    The balance of this section covers the parameters you can supply following the
    **boot:** prompt. Unless you are having problems with the installation or have
    special requirements, you can skip to the next section, "[The CD Found Screen](#),"
    on page [46](#).


    # Boot Parameters


    All of the parameters (except for**memtest86**) you can supply following the [boot:](#)
    prompt consist of the word**linux** followed by an argument that is passed to
    the kernel or to the Anaconda installer. Many of these parameters can be combined.
    For example, to install Linux in text mode using a terminal running at 115,200
    baud, no parity, 8 bits, connected to the first serial device, give the following
    parameters (the **,115200n8** is optional):


    ```

    boot: **linux text console=ttyS0,115200n8**

    ```


    The next set of parameters installs Red Hat Linux in graphical mode (by default)
    on a monitor with a resolution of 1024 x 768, without probing for any devices.
    The installation program asks you to specify the source of the installation data
    (CD, DVD, FTP site, or other).'
  merge: -1
  pgno: 86
- img_proc: false
  md: 'boot: **linux resolution=1024x768 noprobe askmethod**


    Following are some of the parameters you can give at the **boot**: prompt. A set
    of parameters must be terminated with RETURN keystroke.


    RETURN


    Without entering a parameter, press RETURN in response to the **boot**: prompt
    to perform a graphical installation from CDs or a DVD. This installation probes
    the computer to determine as much as possible about the hardware.


    memtest86


    Calls memtest86+ when you boot from a CD or DVD only. The GPL-licensed memtest86+
    utility is a stand-alone memory test for x86-based computers. Press **C** to configure
    the test; press ESCAPE to exit. See [www.memtest.org](http://www.memtest.org)
    for more information.


    linux askmethod


    Presents a choice of installation sources: local CD/DVD or hard disk, or over
    a network using NFS, FTP, or HTTP.


    +   - **Local CDROM** (Use for both CD and DVD installations.) Displays the CD
    Found screen, which allows you to test the installation media (the same as if
    you had pressed RETURN without entering a parameter at the **boot**: prompt).


    +   - **Hard drive** Prompts for the partition and directory that contains the
    ISO images of the installation CDs or DVD. Do not include the name of the mount
    point when you specify the name of the directory. For example, if the ISO images
    are in the **/home/sam/FC5** directory and **/dev/hda6** holds the partition that
    is normally mounted on **home**, you would specify the partition as **/dev/hda6**
    and the directory as **sam/FC5** (no leading slash).


    +   - **NFS**, **FTP**, or **HTTP** Displays the Configure TCP/IP screen from
    which you can select DHCP or enter the system''s IP address and netmask, and the
    IP addresses of the default gateway and primary nameserver.


    When using NFS, the remote (server) system must export (page [685](page 685))
    the directory hierarchy that holds the ISO images of the installation CDs or DVD.
    The NFS Setup screen requires you to enter the NFS server name and name of the
    Fedora Core directory. Enter the server''s IP address and the *name* of the exported
    directory, not its device name.


    linux lowres'
