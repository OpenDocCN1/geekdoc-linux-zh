  md: '# Obtaining User and System Information


    This section covers utilities that provide information about who is using the
    system, what those users are doing, and how the system is running. To find out
    who is using the local system, you can employ one of several utilities that vary
    in the details they provide and the options they support. The oldest utility,
    who, produces a list of users who are logged in on the local system, the device
    each person is using, and the time each person logged in.


    The w and finger utilities show more detail, such as each user''s full name and
    the command line each user is running. You can use the finger utility to retrieve
    information about users on remote systems if your computer is attached to a network.
    [Table 5-1](#) on page [150](#) summarizes the output of these utilities.


    | Information displayed | w | who | finger |

    |---|---|---|---|

    | Username | x | x | x |

    | Terminal-line identification (tty) | x | x | x |

    | Login day and time | x |  |  |

    | Login date and time |  | x | x |

    | Idle time | x |  | x |

    | Program the user is executing | x |  |  |

    | Location the user logged in from |  |  | x |

    | CPU time used | x |  |  |

    | Full name (or other information from **/etc/passwd**) |  |  | x |

    | User-supplied vanity information |  |  | x |

    | System uptime and load average | x |  |  |


    # who: **Lists Users on the System**


    The who utility displays a list of users who are logged in. In [Figure 5-10](#)
    the first column that who displays shows that Alex and Jenny are logged in. (Alex
    is logged in from two locations.) The second column shows the device that each
    user''s terminal, workstation, or terminal'
  merge: -1
  pgno: 223
