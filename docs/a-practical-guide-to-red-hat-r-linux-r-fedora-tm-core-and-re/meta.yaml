  md: '# Chapter Summary


    When you install Red Hat Linux, you copy operating system files from media to
    the local system and set up configuration files so that Linux runs properly on
    the local hardware. You can install Linux from many types of media, including
    CDs, DVD, or hard disk, and from files on other systems that are accessed over
    a network. Operating system files can be stored as directory hierarchies on CDs,
    a DVD, or a hard disk, or as CD or DVD (ISO) images on a hard disk. You can use
    a browser, ftp, or BitTorrent to download the ISO images. It is a good idea to
    test the ISO image files when they are downloaded and the burned CDs before you
    use them to install Red Hat Linux.


    The major decisions to be made when planning an installation are how to divide
    the hard disk into partitions and which software packages to install. If you plan
    to use SELinux, turn it on during Firstboot, after you install Linux. Because
    SELinux sets extended attributes on files, it can be a time-consuming process
    to turn on SELinux after Linux is installed.


    The Fedora Project is sponsored by Red Hat and supported by the open-source community.
    Fedora Core is a Linux release that tests cutting-edge code; it is not recommended
    for production environments. Red Hat Enterprise Linux is more stable than Fedora
    Core.'
  merge: -1
