    and KDE menu systems, KDE Control Center, and KDE Control panel.


    +   - Explains system operation, including the boot process, init scripts, emergency
    mode, rescue mode, single-user and multiuser modes, and steps to take if the system
    crashes.


    +   - Describes files, directories, and filesystems, including types of files
    and filesystems, **fstab** (the filesystem table), automatically mounted filesystems,
