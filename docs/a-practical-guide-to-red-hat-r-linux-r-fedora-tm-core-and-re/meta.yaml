  md: 'screen.


    # The Window Manager


    A *window manager* the program that controls the look and feel of the basic GUIruns
    under a desktop manager (typically KDE or GNOME) and controls all aspects of the
    windows in the X Window System environment. The window manager defines the appearance
    of the windows on the desktop and controls how you operate and position them:
    open, close, move, resize, iconify, and so on. It may also handle some session
    management functions, such as how a session is paused, resumed, restarted, or
    ended (page [94](#)).


    A window manager controls *window decorations*that is, the titlebar and border
    of a window. Aside from the aesthetic aspects of changing window decorations,
    you can alter their functionality by modifying the number and placement of buttons
    on the titlebar.


    The window manager takes care of window manipulation so that the client programs
    do not need to. This setup is very different from that of many other operating
    systems, and the way that GNOME and KDE deal with window managers is different
    from how other desktop environments work. Window managers do more than simply
    manage windowsthey provide a useful, good-looking, graphical shell to work from.
    Their open design allows users to define their own policy down to the fine details.


    Theoretically GNOME and KDE are not dependent on any particular window manager
    and can work with any of several window managers. Because of their flexibility,
    you would not see major parts of the desktop environment change if you were to
    switch from one window manager to another. These desktop managers collaborate
    with the window manager to make your work environment intuitive and easy to use.
    Although the desktop manager does not control window placement, it does get information
    from the window manager about window placement.


    # Red Hat Linux Window Managers


    Metacity, the default window manager for GNOME, provides window management and
    starts many components through GNOME panel commands. It also communicates with
    and facilitates access to other components in the environment. The kwin window
    manager is the default window manager for KDE.


    Using the standard X libraries, programmers have created other window managers
    including **blackbox**, **fluxbox**, **wmx**, and **WindowMaker**. Under FEDORA
    you can use yum (page [478](#)) to install any of these packages.


    # Using a Window Manager Without a Desktop Manager


    It is interesting to see exactly where the line that separates the window manager
    and the desktop manager falls. Toward this end, you can run the Failsafe Terminal
    from the Login screen: Specify **Session** ⇨ **Failsafe Terminal** and log in.
    You should see a clean screen with an undecorated window running xterm. You can
    give commands from this window to open other windows. Try xeyes, xterm, and xclock.
    Give the command **exit** to return to the Login screen.'
