- img_proc: false
  md: '# Communicating with Other Users


    The utilities discussed in this section exchange messages and files with other
    users either interactively or through email.


    # write: Sends a Message


    The write utility sends a message to another user who is logged in. When you and
    another user use **write** to send messages to each other, you establish two-way
    communication. Initially a write command ([Figure 5-14](#)) displays a banner
    on the other user''s terminal, saying that you are about to send a message.


    **Figure 5-14. The write utility I**


    ```

    $ write alex

    Hi Alex, are you there? o

    ```


    The syntax of a write command line is


    *write **username** [**terminal**]*


    The **username** is the username of the user you want to communicate with. The
    **terminal** is an optional device name that is useful if the user is logged in
    more than once. You can display the usernames and device names of all users who
    are logged in on the local system by using who, w, or finger.


    To establish two-way communication with another user, you and the other user must
    each execute write, specifying the other''s username as the **username**. The
    write utility then copies text, line by line, from one keyboard/display to the
    other ([Figure 5-15](#)). Sometimes it helps to establish a convention, such as
    typing **o** (for "over") when you are ready for the other person to type and
    typing **oo** (for "over and out") when you are ready to end the conversation.
    When you want to stop communicating with the other user, press CONTROL-D at the
    beginning of a line. Pressing CONTROL-D tells write to quit, displays **EOF**
    (end of file) on the other user''s terminal, and returns you to the shell. The
    other user must do the same.


    **Figure 5-15. The write utility II**


    ```

    $ write alex

    Hi Alex, are you there? o

    ```'
