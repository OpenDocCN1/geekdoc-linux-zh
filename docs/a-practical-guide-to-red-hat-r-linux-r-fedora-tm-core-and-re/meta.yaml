  md: '# Working with Files


    This section describes utilities that copy, move, print, search through, display,
    sort, and compare files.


    > **Tip: Filename completion**


    After you enter one or more letters of a filename (following a command) on a command
    line, press TAB and the Bourne Again Shell will complete as much of the filename
    as it can. When only one filename starts with the characters you entered, the
    shell completes the filename and places a SPACE after it. You can keep typing
    or you can press RETURN to execute the command at this point. When the characters
    you entered do not uniquely identify a filename, the shell completes what it can
    and waits for more input. When pressing TAB does not change the display, press
    TAB again to display a list of possible completions. For more information refer
    to "Pathname Completion" on page 314.


    # cp: Copies a File


    The cp (copy) utility (Figure 5-2) makes a copy of a file. This utility can copy
    any file, including text and executable program (binary) files. You can use cp
    to make a backup copy of a file or a copy to experiment with.


    **Figure 5-2.** cp copies a file


    ```

    $ ls

    memo

    $ cp memo memo.copy

    $ ls

    memo memo.copy

    ```


    The cp command line uses the following syntax to specify source and destination
    files:'
