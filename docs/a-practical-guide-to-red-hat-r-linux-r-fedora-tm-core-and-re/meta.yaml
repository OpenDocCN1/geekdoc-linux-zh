    # Using Konqueror to Manage Files, Run Programs, and Browse the Web


    Konqueror is the desktop tool you will probably use most often ([Figure 4-12](#)).
    It is similar to but more powerful than Windows (Internet) Explorer and easily
    morphs into a file manager, browser, and executor of many programs, both within
    and outside the borders of its window. Even though Konqueror is much more than
    a Web browser, its name indicates its place in the evolution of browsers: Navigator,
    Explorer, and now Konqueror, spelled with a K because it is part of KDE.[2]


    > [2] Apple used KHTML, Konqueror''s HTML rendering engine, to create its browser
    and continued the tradition, naming the browser Safari.


