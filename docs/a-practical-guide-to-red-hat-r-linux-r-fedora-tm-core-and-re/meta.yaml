- img_proc: false
  md: 'Another way of quoting special characters is to enclose them between single
    quotation marks: ''***''. You can quote many special and regular characters between
    a pair of single quotation marks: ''**This is a special character: >**''. The
    regular characters are interpreted as usual, and the shell also interprets the
    special characters as regular characters.


    The only way to quote the erase character (CONTROL-H), the line kill character
    (CONTROL-U), and other control characters (try CONTROL-M) is by preceding each
    with aCONTROL-V. Single quotation marks and backslashes do not work. Try the following:


    ```

    $ echo ''xxxxxxCONTROL-U''

    $ echo xxxxxxCONTROL-V CONTROL-U

    ```


    # Optional


    Although you cannot see the CONTROL-U displayed by the second of the preceding
    pair of commands, it is there. The following command sends the output of echo          (page
    [137](#)) through a pipe (page[136](#)) to od (see theod man page) to display
    CONTROL-U as octal 25 (025):


    ```

    $ echo xxxxxxCONTROL-V CONTROL-U | od -c

    0000000  x  x  x  x  x  x 025  \n

    0000010

    ```


    The **\n** is the NEWLINE character thatecho sends at the end of its output.


    ![](bbox=[0.116, 0.766, 0.219, 0.806])


