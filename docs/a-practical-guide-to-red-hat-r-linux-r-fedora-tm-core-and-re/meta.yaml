  md: "table.\n\n# **Caution:** parted can destroy everything\n\nBe as careful with\
    \ parted as you would be with a utility that formats a hard disk. Changes you\
    \ make with parted can easily result in the loss of large amounts of data. If\
    \ you are using parted and have any question about what you are doing, quit with\
    \ a **q** command before making any changes. Once you give parted a command, it\
    \ immediately makes the change you requested.\n\nTo partition a disk, give the\
    \ command **parted** followed by the name of the device you want to work with.\
    \ Following, after starting parted, the user gives a **help** (or just **h**)\
    \ command, which displays a list of parted commands:\n\n```\n# /sbin/parted /dev/hdb\n\
    GNU Parted 1.6.25\n...\nUsing /dev/hda\n(parted) help\n  check NUMBER        \
    \            do a simple check on the file system\n  cp [FROM-DEVICE] FROM-NUMBER\
    \ TO-NUMBER  copy file system to another partition\n  help [COMMAND]         \
    \         prints general help, or help on COMMAND\n  mklabel LABEL-TYPE      \
    \        create a new disklabel (partition table)\n  mkfs NUMBER FS-TYPE     \
    \        make a FS-TYPE file system on partition NUMBER\n  mkpart PART-TYPE [FS-TYPE]\
    \ START END  make a partition\n  mkpartfs PART-TYPE FS-TYPE START END  make a\
    \ partition with a file system\n  move NUMBER START END           move partition\
    \ NUMBER\n  name NUMBER NAME                name partition NUMBER as NAME\n  print\
    \ [NUMBER]                  display the partition table, or a partition\n  quit\
    \                            exit program\n  rescue START END                rescue\
    \ a lost partition near START and END\n  resize NUMBER START END         resize\
    \ partition NUMBER and its file system\n  rm NUMBER                       delete\
    \ partition NUMBER\n  select DEVICE                   choose the device to edit\n\
    \  set NUMBER FLAG STATE           change a flag on partition NUMBER\n  unit UNIT\
    \                       set the default unit to UNIT\n(parted)\n```\n\nIn response\
    \ to the (**parted**) prompt you can give the command **help** followed by the\
    \ name of the command you want more information about. See the following example.\
    \ When you give a **print** (or just **p**) command, parted displays current partition\
    \ information just as a **print** command on the command line does.\n\nThe parted\
    \ utility will not allow you to set up overlapping partitions (except for logical\
    \ partitions overlapping their containing extended partition) and it will not\
    \ allow you to create a partition that starts at the very beginning of the disk\
    \ (cylinder 0). Both of these situations can cause loss of data. Following are\
    \ guidelines to remember when defining a partition table for a disk. For more\
    \ information refer to '[Partitioning a Disk](http://www.bisenter.com)' on page\
    \ 29.\n\n+   - Do not delete or modify the partition that defines the extended\
    \ partition unless you are willing to lose all data on all of the logical partitions\
    \ within the extended partition.\n\n+   - It is a good idea to put **/boot** at\
    \ the beginning of the drive (partition 1) so that there is no issue of Linux\
    \ having to boot from a partition too far into the drive. When you can afford\
    \ the disk space, it is desirable to put each major filesystem on a separate partition.\
    \ Many people choose to combine root, **/var**, and **/usr** into a single partition,\
    \ which generally results in less wasted space but can, on rare occasions, cause\
    \ problems. Although it is not recommended, you can put the contents of the **boot**\
    \ directory in the root filesystem."
