  md: 'Names of utilities are printed in this bold sans serif typeface. This book
    references the **emacs** text editor and the **ls** utility or **ls** command
    (or just **ls**) but instructs you to enter **ls a** on the command line. In this
    way the text distinguishes between utilities, which are programs, and the instructions
    you give on the command line to invoke the utilities.


    # Filenames


    Filenames appear in a bold typeface. Examples are **memo5**, **letter.1283**,
    and **reports**. Filenames may include uppercase and lowercase letters; however,
    Linux is *case sensitive* (page [1023](#)), so **memo5**, **MEMO5**, and **Memo5**
    name three different files.


    # Character strings


    Within the text, characters and character strings are marked by putting them in
    a bold typeface. This convention avoids the need for quotation marks or other
    delimiters before and after a string. An example is the following string, which
    is displayed by the passwd utility: **Sorry, passwords do not match.**


    # Buttons and labels


    Words appear in a bold typeface in the sections of the book that describe a GUI.
    This font indicates that you can click a mouse button when the mouse pointer is
    over these words on the screen or over a button with this name.


    # Keys and characters


    This book uses SMALL CAPS for three kinds of items:


    +   - Keyboard keys, such as the **SPACE** bar and the **RETURN**^[8] **ESCAPE**,
    and **TAB** keys.


    > ^[8] Different keyboards use different keys to move the *cursor* (page [1027](#))
    to the beginning of the next line. This book always refers to the key that ends
    a line as the **RETURN** key. Your keyboard may have a **RET**, **NEWLINE**, **ENTER**,
    **RETURN**, or other key. Use the corresponding key on your keyboard each time
    this book asks you to press **RETURN**.


    +   - The characters that keys generate, such as the **SPACE**s generated by the
    **SPACE** bar.'
