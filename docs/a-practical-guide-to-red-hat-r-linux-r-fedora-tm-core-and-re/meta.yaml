  md: '# Figure 3-3. The Partition the Disk screen


    [View full size image]


    ![](bbox=[0.093, 0.174, 0.914, 0.602])


    The default layout that the first three choices create includes two logical volumes
    (LVs: swap and root [/]) and one standard partition (**/boot**). With this setup,
    most of the space on the disk is assigned to the root partition. For information
