- img_proc: false
  md: 'The Logical Volume Manager (LVM2, which will be referred to as LVM) allows
    you to change the size of logical volumes (LVs, the LVM equivalent of partitions)
    on the fly. With LVM, if you make a mistake in setting up LVs or your needs change,
    you can use system-config-lvm to make LVs smaller or larger easily without affecting
    user data. You must choose to use LVM at the time you install the system or add
    a hard disk; you cannot retroactively apply it to a disk full of data. LVM supports
    IDE and SCSI drives as well as multiple devices such as those found in RAID partitions.


    LVM groups disk components (partitions, hard disks, or storage device arrays),
    called *physical volumes* (PVs), into a storage pool, or virtual disk, called
    a *volume group* (VG). See [Figure 2-1](#). You allocate a portion of a VG to
    create a *logical volume*.


    # Figure 2-1. LVM: Logical Volume Manager


    [View full size image]


    ![](bbox=[0.091, 0.302, 0.916, 0.603])


    An LV is similar in function to a traditional disk partition in that you can create
    a filesystem on an LV. It is much easier, however, to change and move LVs than
    partitions: When you run out of space on a filesystem on an LV, you can grow (expand)
    the LV and its filesystem into empty or new disk space, or you can move the filesystem
    to a larger LV. LVM''s disk space manipulation is transparent to users; service
    is not interrupted.


    LVM also eases the burden of storage migration. When you outgrow or need to upgrade
    PVs, LVM can move data to new PVs. To read more about LVM, refer to the resources
    listing under ["More Information"](#) on page [24](#).'
  merge: -1
