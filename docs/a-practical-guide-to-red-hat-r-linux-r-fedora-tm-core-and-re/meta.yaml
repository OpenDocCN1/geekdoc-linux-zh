    # GNU


    GNU manuals are available at [www.gnu.org/manual](http://www.gnu.org/manual).
    In addition, you can visit the GNU home page ([www.gnu.org](http://www.gnu.org))
    for more documentation and other GNU resources. Many of the GNU pages and resources
    are available in a wide variety of languages.


    The Linux Documentation Project


    The Linux Documentation Project ([www.tldp.org](http://www.tldp.org)), which has
    been around for almost as long as Linux, houses a complete collection of guides,
    HOWTOs, FAQs, man pages, and Linux magazines. The home page is available in English,
    Portuguese, Spanish, Italian, Korean, and French. It is easy to use and supports
    local text searches. It also provides a complete set of links ([Figure 4-28](#))
    that you can use to find almost anything you want that is related to Linux (click
    **Links** in the Search box or go to [www.tldp.org/links](http://www.tldp.org/links)).
    The links page includes sections on general information, events, getting started,
    user groups, mailing lists, and newsgroups, with each section containing many
    subsections.


