    # # Using the Kickstart Configurator


    Kickstart is Red Hat''s program that completely or partially automates the same
    installation and postinstallation configuration on one or more machines. To use
    Kickstart, you create a single file that answers all the questions that are normally
    asked during an installation. Anaconda then refers to this file instead of asking
    you questions. Using Kickstart, you can automate language selection, network configuration,
    keyboard selection, boot loader installation, disk partitioning, X Window System
    configuration, and more.


    The system-config-kickstart utility (part of the **system-config-kickstart** package
    that you can install using yum [page 478]) displays the Kickstart Configurator
    window ([Figure 3-18](#figure-3-18)), which creates a Kickstart installation script.
    On RHEL systems you may need to download the package that contains Kickstart using
    Red Hat Network (page 498).


