    [Figure 3-20](http://www.bisenter.com) shows the Settings tab of the Display settings
    window, which allows you to specify the resolution and color depth for the monitor.
    Normally the system probes the monitor and fills in these values. If these values
    are missing, check the specifications for the monitor and select the appropriate
    values from the combo boxes. No harm is done if you specify a lower resolution
    than the monitor is capable of displaying, but you can damage an older monitor
    by specifying a resolution higher than the monitor is capable of displaying. A
    color depth of 8 bits equates to 256 colors, 16 bits to thousands of colors, and
    24 or 32 bits to millions of colors.


    Next click the Hardware tab. The system normally probes for the monitor type and
