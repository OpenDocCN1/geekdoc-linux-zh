  md: 'Puts the system in rescue mode; see page [397](page-397) for details.


    ```

    linux resolution=*WxH*

    ```


    Specifies the resolution of the monitor you are using for a graphical installation.
    For example, **resolution=1024x768** specifies a monitor with a resolution of
