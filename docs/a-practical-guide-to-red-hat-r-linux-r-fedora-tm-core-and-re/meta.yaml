  md: '# Monitor


    Anaconda displays the Monitor screen only if it cannot probe the monitor successfully.
    Select the brand and model of the monitor attached to the system. Select a generic
    LCD or CRT display if the monitor is not listed. You can specify the Sync frequencies
    in place of the monitor brand and model, but be careful: Specifying the wrong
    values can ruin some older hardware.


    # Initialize warning


    This warning is displayed if the hard disk has not been used before. The dialog
    box says that the partition table on the device was unreadable and asks if you
    want to initialize the drive. When you initialize a drive, all data on the drive
    is lost. Click **Yes** if it is a new drive or if you do not need the data on
    the drive. Anaconda initializes the hard disk immediately.


    # Install or Upgrade


    Anaconda displays the Install or Upgrade screen ([Figure 3-2](#)) only if it detects
    a version of Red Hat Linux on the hard disk that it can upgrade. Anaconda gives
    you the choice of upgrading the existing installation or overwriting the existing
    installation with a new one. Refer to "[Installing a Fresh Copy or Upgrading an
    Existing Red Hat System?](#)" on page [27](#) for help in making this selection.


    # Figure 3-2. The Install or Upgrade screen


    [View full size image]'
