  md: '+   - **Focus-strictly-under-mouse** *(enter-exit)* Gives the input focus to
    a window when you move the mouse pointer onto the window. That window maintains
    the input focus until you move the mouse pointer off the window with the focus,
    at which point no window has the focus. Specifically, when you move the mouse
    pointer off a window and onto the root window, the window that had the focus loses
    it, and input from the keyboard is lost.


    # GNOME


    Under GNOME select **System: Preferences** ⇨ **Windows** (RHEL uses **Applications:
    Preferences** ⇨ **Windows**) to change the focus policy. Put a mark in the check
    box next to **Select windows when the mouse moves over them** to select the focus-follows-mouse
    policy. When there is no mark in this check box, click-to-focus is in effect.
    Click **Close**.


    # KDE


    Under KDE use the KDE Control Center to change the focus policy: Select **Main
    menu: Control Center**; from the KDE Control Center select **Desktop** ⇨ **Window
    Behavior** and choose the desired focus policy. Click **Apply**.


    To determine which window has the input focus, compare the window borders. The
    border color of the active window is different from the others or, on a monochrome
    display, is darker. Another indication that a window is active is that the keyboard
    cursor is a solid rectangle there; in windows that are not active, the cursor
    is an outline of a rectangle.


    Use the following tests to determine which keyboard focus method you are using.
    If you position the mouse pointer in a window and that window does not get the
    input focus, your window manager is configured to use the click-to-focus method.
    If the border of the window changes, you are using the focus-follows-mouse/focus-under-mouse
    or focus-strictly-under-mouse method. To determine which of the latter methods
    you are using, start typing something, with the mouse pointer positioned on the
    active window. Then move the mouse pointer over the root window and continue typing.
    If characters continue to appear within the window, you are using focus-follows-mouse/focus-under-mouse.
    Otherwise, you are using focus-strictly-under-mouse.


    # Changing the Resolution of the Display


    The X server (the basis for the Linux graphical interface, see page [234](#))
    starts at a specific display resolution and color depth. Although you can change
    the color        depth only when you start an X server, you can change the resolution
    while the X server is running. The number of resolutions available depends both
    on the display hardware and on the configuration of the X server (see page [70](#)
    for details). Many users prefer to do most of their work at a higher resolution
    but might want to switch to a lower resolution for some tasks, such as playing
    games. You can switch between different display resolutions by pressing either
    CONTROL-ALT-KEYPAD-**+** or CONTROL-ALT-KEYPAD-, using the **+** and on the keyboard''s
    numeric keypad.'
  merge: -1
