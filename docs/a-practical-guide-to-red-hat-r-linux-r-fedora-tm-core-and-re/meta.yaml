    # **man: Displays the System Manual**


    In addition to the KDE Help Center and GNOME Help, the character-based **man**
    (manual) utility displays pages (man pages) from the system documentation. This
    documentation is helpful when you know which utility you want to use but have
    forgotten exactly how to use it. You can also refer to the man pages to get more
    information about specific topics or to determine which features are available
    with Linux. Because the descriptions in the system documentation are often terse,
    they are most helpful if you already understand the basic functions of the utility.


    Because **man** is a character-based utility, you need to open a terminal emulator
    window ([page 93](#)) to run it. You can also log in on a virtual terminal ([page
    113](#)) and run the utility from there.


    To find out more about a utility, give the command **man**, followed by the name
    of the utility. [Figure 4-23](#) shows **man** displaying information about itself,
    after the user entered a **man man** command.


    # **Figure 4-23.** The man **utility** displaying information about itself'
  merge: -1
  pgno: 167
- img_proc: false
  md: '![](bbox=[0.065, 0.09, 0.91, 0.62])


    less (pager)


    The man utility automatically sends its output through a pager—usually less (page
    128), which displays a file one screen at a time. When you access a manual page
    in this manner, less displays a prompt (:) at the bottom of the screen after each
    screen of text and waits for you to request another screen by pressing the SPACE
    bar. Pressing h (help) displays a list of less commands. Pressing q (quit) stops
    less and causes the shell to display a prompt. You can search for topics covered
    by man pages by using the apropos utility (page 145).


    Based on the FHS (Filesystem Hierarchy Standard, page 176), the Linux system manual
    and the man pages are divided into ten sections. Each section describes related
    tools:


    +   1. User Commands

    2. System Calls

    3. Subroutines

    4. Devices

    5. File Formats

    6. Games

    7. Miscellaneous'
  merge: -1
  pgno: 168
- img_proc: false
  md: '+   8. System Administration

    9. Kernel

    10. New


    This layout closely mimics the way the set of UNIX manuals has always been divided.
    Unless you specify a manual section, man displays the earliest occurrence in the
    manual of the word you specify on the command line. Most users find the information
    they need in sections 1, 6, and 7; programmers and system administrators frequently
    need to consult the other sections.


    **Tip:** You can use Konqueror to view man and info pages


    You can view man and info pages by entering, for example, **man:cat** or **info:cat**
    in Konqueror''s location bar Figure 4-13, page 96) or in the Run Command box (page96).
    The KDE Help Center also offers direct access to these pages as UNIX manual pages.
    GNOME Help refers to them as Command Line Help.


    In some cases the manual contains entries for different tools with the same name.
    For example, the following command displays the man page for the write utility
    (page 150) from section 1 of the system manual:


    ```

    $ **man write**

    ```


    To see the man page for the **write** system call from section 2, enter


    ```

    $ **man 2 write**

    ```


    The preceding command instructs man to look only in section 2 for theman page.
    Use the **a** option (see the adjacent tip) to view allman pages for a given subject
    (press **q** to move to the nextman page). For example, give the command**man
    a write** to view all man pages for write.


    **Tip:** Options


    An option modifies the way a utility or command works. Options are usually specified
    as one or more letters that are preceded by one or two hyphens. The option appears
    following the name of the utility you are calling and a SPACE. Other *arguments*
    (page 1019) to the command follow the option and a SPACE. For more information
    refer toOptions" on page 203.


    **Tip:** man and info display different information


    The info utility displays more complete and up-to-date information on GNU utilities
    than doeman. When a man page displays abbreviated information on a utility that
    is covered by info, the man page refers you to info. The man utility frequently
    displays the only information available on non-GNU utilities. When info displays
    information on non-GNU utilities, it is frequently a copy of the man page.'
