  md: '# ## How the Installation Works


    The following steps outline the process of installing Red Hat Linux from CDs or
    a DVD using Anaconda. Installation from other media follows similar steps. See
    [Chapter 3](#) for the specifics of how to perform the installation.


    +   1. Insert the first installation CD or the installation DVD in the computer
    and turn on or reset the computer.

    2. After going through computer-specific hardware diagnostics, the computer displays
    the initial install screen with the **boot:** prompt at the bottom (page [44](#)).

    3. You can enter commands and press RETURN following the **boot:** prompt, press
    RETURN without entering commands, or wait for a minute without entering anything;
    the computer boots Red Hat Linux from the CD or DVD.

    4. As part of the boot process, Red Hat Linux creates multiple [RAM disks](#)
    (page [1051](#)) that it uses in place of a hard disk used for a normal boot operation.
    Tools required for the installation are copied to the RAM disks. The use of RAM
    disks allows the installation process to run through the specification and design
    phases without writing to the hard disk and enables you to opt out of the installation
    at any point before the system warns you it is about to write to the hard disk.
    If you opt out before this point, the system is left in its original state. For
    more information refer to "[Begin Installation](#)" on page [54](#).

    5. You can check the installation media at this point.

    6. Anaconda starts, usually probing the hardware before starting the X Window
    System for a graphical installation.

    7. Anaconda collects information about how you want to install Red Hat Linux.

    8. When Anaconda is finished collecting information, it displays a screen that
    informs you it is about to begin installation ([Figure 3-9](#), page [55](#))
    and writes the operating system files to the hard disk.

    9. When you reboot the system, Firstboot ask you some questions that are required
    to complete the installation (page [56](#)).

    10. The Red Hat Linux system is ready to use.'
  merge: -1
