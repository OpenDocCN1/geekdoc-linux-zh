    client from a remote computer. You can download the VNC client, which runs on
    several platforms, from [www.realvnc.com](http://www.realvnc.com).


    # ## The CD Found Screen


    The first screen that the installation process displays is the pseudographical
    CD Found screen. Because it is not a true graphical screen, the mouse does not
    work. Instead, you must use the TAB or ARROW keys to highlight different choices
    and pressRETURN to select the highlighted choice. This screen allows you to test
    as many installation CDs or DVDs as you like, in any order. Choose **OK** to test
    the media or **Skip** to bypass the test. See the following caution box.'
