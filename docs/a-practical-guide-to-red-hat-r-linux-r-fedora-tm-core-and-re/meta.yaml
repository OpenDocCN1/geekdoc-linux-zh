    To use this example as a model for running the vim text editor, give the command
    **vim memo.1204** and press the RETURN key. (Press ESCAPE **ZZ** to exit from
    vim; see page [152](#) for a vim tutorial.) This method of entering commands makes
    the examples in the book correspond to what appears on the screen.


    # Menu selection path


    The menu selection path is the name of the menu or the location of the menu, followed
    by a colon, a SPACE, and the menu selection(s) separated by ➜ s. The entire menu
    selection path is in **bold** type. You can read **Konqueror menubar**: **Tools**
