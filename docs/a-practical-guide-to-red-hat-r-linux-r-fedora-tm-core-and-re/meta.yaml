  md: '# ## Tip: Experienced users may want to skim Part II


    If you have used a UNIX or Linux system before, you may want to skim over or skip
    some or all of the chapters in [Part II](link). All readers should take a look
    at [Conventions Used in This Book](link) (page [17](link)), which explains the
    typographic and layout conventions that this book uses, and [Getting the Facts:
    Where to Find Documentation](link) (page [102](link)), which points out both local
    and remote sources of Linux and Red Hat documentation.


    # ## Part III


    [Part III](link), "Digging into Red Hat Linux," goes into more detail about working
    with the system.[Chapter 8](link) discusses the GUI and includes a section on
    how to run a graphical program on a remote system and have the display appear
    locally. The section on GNOME describes GNOME utilities and explains how to use
    the Nautilus file manager, including its spatial view, while the section on KDE
    explains more about Konqueror and KDE utilities. [Chapter 9](link) extends the
    bash coverage from [Chapter 7](link), explaining how to redirect error output,
    avoid overwriting files, and work with job control, processes, startup files,
    important shell builtin commands, parameters, shell variables, and aliases. [Chapter
    10](link) explains networks, network security, and the Internet and discusses
    types of networks, subnets, protocols, addresses, hostnames, and various network
    utilities. The section on distributed computing describes the client/server model
    and some of the servers you can use on a network. Details of setting up and using
    clients and servers are reserved until [Part V](link).


    # ## Part IV


    [Part IV](link) covers system administration. [Chapter 11](link) discusses core
    concepts such as Superuser, SELinux (Security Enhanced Linux), system operation,
    general information about how to set up a server, DHCP, and PAM. [Chapter 12](link)
    explains the Linux filesystem, going into detail about types of files, including
    special and device files, the use of fsck to verify the integrity of and repair
    filesystems, and the use of tune2fs to change filesystem parameters. [Chapter
    13](link) explains how to keep a system up-to-date by downloading software from
    the Internet and installing it, including examples of using yum, BitTorrent, and
    Red Hat''s up2date utility. [Chapter 14](link) explains how to set up the CUPS
    printing system so you can print on the local system as well as on remote systems.
    [Chapter 15](link) details customizing and building a Linux kernel. [Chapter 16](link)
    covers additional administration tasks, including setting up user accounts, backing
    up files, scheduling automated tasks, tracking disk usage, and solving general
    problems. [Chapter 17](link) explains how to set up a local area network (LAN),
    including both hardware (including wireless) and software setup.


    # ## Part V


    [Part V](link) goes into detail about setting up and running servers and connecting
    to them with clients. The chapters in this part of the book cover the following
    clients/servers:


    +   - **OpenSSH** Set up an OpenSSH server and use ssh, scp, and sftp to communicate
    securely over the Internet.'
  merge: -1
  pgno: 20
