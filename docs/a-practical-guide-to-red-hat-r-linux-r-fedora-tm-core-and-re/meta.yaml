    Installing Red Hat Linux is the process of copying operating system files from
    media to the local system and setting up configuration files so that Linux runs
    properly on the local hardware. You can install Linux from many types of media,
    including CDs, a DVD, the local hard disk, or a hard disk and files on another
    system that is accessed over a network. Several types of installations are also
    possible, including fresh installations, upgrades from older versions of Red Hat
    Linux, and dual-boot installations. You can perform the installation manually
    or set up Kickstart to install Red Hat Linux automatically.


    This chapter discusses the installation process in general: planning, partitioning
    the hard disk, obtaining the files for the installation, burning CDs or a DVD
    if necessary, and collecting information about the hardware you will need when
    you install the system. [Chapter 3](page 44) covers the actual installation.


    Red Hat developed Anaconda, an installation tool that performs an interactive
    installation using a graphical or textual interface, to automate and make friendlier
    the process of installing Linux. To install Linux on standard hardware, you can
    typically insert the first installation CD or the installation DVD, boot the system,
    press RETURN a few times, and change CDs a few times if you are installing from
    CDs. However, you may want to customize the system or you may be installing on
    nonstandard hardware: Anaconda gives you many choices as the installation process
    unfolds. Refer to "[Booting the System: The boot: Prompt](page 44)" (page 44)
    and "[The Anaconda Installer](page 47)" (page 47) for information about customizing
    a Red Hat Linux installation.'
