  md: 'When you are working in a complex environment and using many windows to run
    a variety of programs simultaneously, it is convenient to divide the desktop into
    several areas, each *appearing* as a desktop unto itself and occupying the entire
    screen. These areas are virtual desktops. The [workspace](#) comprises what is
    on the screen: buttons/icons, toolbars/panels, windows, and the *root window*
    (the unoccupied area of the workspace). Typically GNOME and KDE are set up with
    a desktop that includes four workspaces.


    # Desktop theme


    In a GUI, a [theme](#) is a recurring pattern and overall look that (ideally)
    pleases the eye and is easy to interpret and use. To view a wide variety of themes,
    go to [themes.freshmeat.net](http://themes.freshmeat.net), [www.kde-look.org](http://www.kde-look.org),
    or [art.gnome.org](http://art.gnome.org). Using themes, you can control the appearance
    of KDE, GNOME, and most other desktop environments.


    # Tip: Is it a desktop, a workspace, or what?


    Confusion reigns over naming the subcomponents, or divisions, of a desktop. This
    book, in conformance with GNOME documentation, refers to everything that usually
    occupies the display monitor, or screen, as a *workspace*; *desktop* refers to
    the sum of the workspaces. Put another way, the desktop is divided into workspaces.


    KDE documentation and windows use the term *desktop* instead of *workspace*.


    # The Power of the Desktop: Using the Main Panel


    When you log in, KDE displays a workspace that includes the KDE Main panel, which
    is essential to getting your work done easily and efficiently. The Main panel
    is the strip with icons that act as buttons ([Figure 4-3](#)) along the bottom
    of the workspace. A panel does not allow you to do anything you could not do otherwise;
    rather it simply collects things in one place and makes your work with the system
    easier. Because the Main panel is easy to configure, you can set it up to hold
    the tools you use frequently, arranged the way you want: application launchers
    to start, for example, email and word processing programs, menus (including the
    Main menu, represented by the red hat or Fedora logo), *applets* (applications
    that are small enough to be executed within a panel), and special objects (such
    as **logout** button). You can create additional panels, called *extensions* or
    *extension panels*, to hold different groups of tools.


    # Figure 4-3. The KDE Main panel


    [View full size image]


    ![](bbox=[0.145, 0.913, 0.876, 0.953])


    # Tooltips'
  merge: -1
  pgno: 142
- img_proc: false
  md: 'Tooltips (Figure 4-4), available under both GNOME and KDE, is a minicontext
    help system that you activate by moving the mouse pointer over a button, icon,
    window border, or applet (such as those on a panel) and leaving it there for a
    moment (called *hovering*). When the mouse pointer hovers over an object, GNOME
    and KDE display a brief explanation of the object.


    ![](bbox=[0.197, 0.256, 0.741, 0.409])


    # Icons/buttons


    The icons/buttons on the panel display menus, launch programs, and present information.
    The Web browser button (the mouse with its cord wrapped around the world) starts
    Firefox by default. The email button (the stamp and letter) starts Evolution,
    an email and calendaring application ([www.gnome.org/projects/evolution](http://www.gnome.org/projects/evolution)).
    You can start almost any utility or program on the system using a button on a
    panel.


    # Panel Icon menu


    Each icon on a panel has a Panel Icon menu, which allows you to move the icon
    within the panel, view and change (configure) the icon''s properties, and remove
    the icon from the panel. It also contains the Panel menu (page 100) as a submenu.
    Some icons have additional context-based selections whereas some applets have
    a different menu. Right-click an icon on the panel to display its Panel Icon menu.


    # Pager


    Each rectangle in the *Pager*, the group of rectangles labeled **1** **4** on
    the panel, represents a workspace (Figure 4-5). Click a rectangle to display the
    corresponding workspace. For example, click the rectangle labeled **2**. This
    rectangle becomes lighter to indicate that you are viewing workspace 2. While
    you are working with workspace 2, click the Firefox icon on the panel. KDE opens
    the Firefox window and a small window with the Firefox logo in it appears in rectangle
    number 2 in the Pager.


    ![](bbox=[0.246, 0.225, 0.717, 0.349])'
  merge: -1
