  md: '# # The X Window System


    If you specified a graphical desktop environment such as GNOME or KDE, you installed
    the X.org ([x.org](http://x.org)) implementation of the X Window System when you
    installed Linux. The X Window System release X11R7.0 comprises almost 20 rpm packages;
    the easiest way to install X.org on an already installed Linux system is to use
    pirut (page [483](page483)) and choose **Base System** → **X Window System**.
    The X configuration files are kept in **/etc/X11**; the configuration file that
    guides the initial setup is **/etc/X11/xorg.conf**.


    # ## system-config-display: Configures the Display


    The system-config-display utility displays the Display settings window [Figure
    3-20](figure3-20), which allows you to configure X.org, including the monitor
    type and video card. To run this utility, enter **system-config-display** on a
    command line. From KDE select **Main menu: Administration** → **Display** or from
    GNOME select **System: Administration** → **Display**.


    **Figure 3-20. The Display settings window, Settings tab**


    [View full size image]'
