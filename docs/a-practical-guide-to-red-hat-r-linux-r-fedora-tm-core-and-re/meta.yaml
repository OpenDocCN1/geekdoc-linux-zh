  md: '# less Is more: **Display a Text File One Screen at a Time**


    Pagers


    When you want to view a file that is longer than one screen, you can use either
    the less utility or the more utility. Each of these utilities pauses after displaying
    a screen of text. Because these utilities show one page at a time, they are called
    *pagers*. Although less and more are very similar, they have subtle differences.
    At the end of the file, for example, less displays an **EOF** (end of file) message
    and waits for you to press **q** before returning you to the shell. In contrast,
    more returns you directly to the shell. In both utilities you can press **h**
    to display a Help screen that lists commands you can use while paging through
    a file. Give the commands **less practice** and **more practice** in place of
    the **cat** command in Figure 5-1 to see how these commands work. Use the command
    **less /etc/termcap** instead if you want to experiment with a longer file. Refer
    to the less man page for more information.


    # hostname: **Displays the System Name**


    The hostname utility displays the name of the system you are working on. Use this
    utility if you are not sure that you are logged in on the right machine.


    ```

    $ **hostname**

    bravo.example.com

    ```


    ![](bbox=[0.13, 0.74, 0.24, 0.77])


    ![](bbox=[0.79, 0.74, 0.89, 0.77])'
