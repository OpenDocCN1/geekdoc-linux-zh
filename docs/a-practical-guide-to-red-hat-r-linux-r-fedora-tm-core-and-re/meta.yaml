    Depending how fast the Internet connection is and how busy the site you are downloading
    from is, it may be better to wait until one download finishes before starting
    the next. (Using ftp [page 604], you can queue the downloads so they proceed sequentially
    without intervention.)


    Once you have downloaded the five installation ISO files or the DVD ISO, the SHA1
    checksum file, and optionally the rescue CD ISO file, the next step is to check
    that the files are correct. See "Checking the Files"


    # Using BitTorrent to Download the ISO Image Files


    You can use BitTorrent (page 484) to obtain the ISO images. Because BitTorrent
    is available for both Windows and Mac OS X (www.bittorrent.com), you can download
    and burn the Fedora CDs or DVD on a Windows machine or a Macintosh. See page 484
    for information on using BitTorrent from Linux. You can obtain BitTorrent for
    Fedora and the tracker for the ISO files from torrent.fedoraproject.org.'
  merge: -1
  pgno: 74
- img_proc: false
  md: '# Checking the Files


    The **SHA1SUM** file contains the [*SHA1*](page 1054) sums for each of the ISO
    files. When you process a file using the `sha1sum` utility, `sha1sum` generates
    a number based on the file. If that number matches the corresponding number in
    the **SHA1SUM** file, the downloaded file is correct:


    ```

    $ grep i386-disc1 SHA1SUM; sha1sum FC-5-i386-disc1.iso

    43546c0e0d1fc64b6b80fe1fa99fb6509af5c0a0 FC-5-i386-disc1.iso

    43546c0e0d1fc64b6b80fe1fa99fb6509af5c0a0 FC-5-i386-disc1.iso

    ```


    Check each of the ISO images you downloaded in the same manner. Computing an SHA1
    sum for a large file takes a while. The two long strings that the preceding command
    displays must be identical: If they are not, you must download the file again.
    RHEL uses an **MD5SUM** file instead of **SHA1SUM** and the `md5sum` utility instead
    of `sha1sum`.


    # Tip: Test the ISO files and test the CDs or DVD


    It is a good idea to test the ISO image files when they are downloaded and the
    burned CDs or DVD before you use them to install Red Hat Linux. A bad file on
    a CD may not show up until you finish installing Red Hat Linux and have it running.
    At that point, it may be difficult and time-consuming to figure out where the
    problem lies. Testing the files and CDs or DVD takes a few minutes, but can save
    you hours of trouble if something is not right. If you want to do only one test,
    test the CDs or DVD.


    # Burning the CDs or DVD


    An ISO image file is an exact image of what needs to be on the CD or DVD. Putting
    that image on a CD or DVD involves a different process than copying files to a
    CD or DVD. The CD/DVD burning software you use has a special selection for burning
    an ISO image. It will be labeled something similar to **Record CD from CD Image**
    or **Burn CD Image**. Refer to the instructions for the software you are using
    for information on how to burn an ISO image file to a CD or DVD.


    # Tip: You need only burn the rescue CD for a hard disk or network installation


    If you are installing Linux from files on a hard disk on the target system or
    from files on another system on a network using FTP, NFS, or HTTP, you need a
    way to boot the system to begin the installation. The rescue CD, the first installation
    CD, or the installation DVD can serve that purpose. Once the system is booted,
    you have no need for the CDs or DVD.'
  merge: -1
  pgno: 75
- img_proc: false
