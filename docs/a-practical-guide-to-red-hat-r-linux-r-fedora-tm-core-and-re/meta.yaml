  md: '# Rescue CD


    The rescue CD cannot do anything the first installation CD cannot do. However,
    it holds less information so you can download and burn it more quickly than the
    first installation CD.


    # Rescue mode


    You can use the rescue CD, the first installation CD, or the installation DVD
    to bring the system up in rescue mode. Bringing a system up and working in rescue
    mode are discussed on page [397](page-397).


    # Hard disk or network installation


    You can use the rescue CD the same way you use the first installation CD or the
    installation DVD to boot the system to begin a hard disk or network installation:
    While booting from either CD or the DVD, give the command **linux askmethod**
    in response to the **boot:** prompt. See page [45](page-45) for more information.'
  merge: -1
