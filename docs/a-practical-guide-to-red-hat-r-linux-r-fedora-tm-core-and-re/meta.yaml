  md: '# More About Logging In


    Refer to "[Logging In on the System](#)" on page [83](#) for information about
    logging in on the system and changing your default desktop environment (KDE or
    GNOME).


    # Security: Always use a password


    Unless you are the only user of a system; the system is not connected to any other
    systems, the Internet, or a modem; and you are the only one with physical access
    to the system, it is poor practice to allow any user to log in without a password.


    # The Login Screen


    Four icon/word buttons appear below the Username/Password text box on the Login
    screen. Click these icons to change aspects of the session you are about to log
    in to. You can also press F10 to display a pop-up menu with similar choices.


    +   - **Language** Displays a window from which you can select the language for
    the session you are about to start. This change affects window titles, prompts,
    error messages, and other textual items displayed by GNOME, KDE, and many applications.
    Just after you log in, the system asks whether you want to make this change in
    languages permanent or if it is a one-time change.'
  merge: -1
  pgno: 178
- img_proc: false
  md: "+   - **Session** Displays the Sessions dialog box, which presents several\
    \ choices concerning the session you are about to start. Choose one of the following,\
    \ click **OK**, and continue logging in:\n    - **Last Session** Brings up the\
    \ same desktop environment you used the last time you logged in.\n    - **Default\
    \ System Session** Brings up the default desktop environment.\n    - **GNOME**\
    \ Brings up the GNOME desktop environment.\n    - **KDE** Brings up the KDE Desktop\
    \ Environment.\n    - **Failsafe GNOME** Brings up a default GNOME session without\
    \ running any startup scripts. Use this choice to fix problems that prevent you\
    \ from logging in normally.\n    - **Failsafe Terminal** Brings up an xterm terminal\
    \ emulator window without a desktop manager and without running any startup scripts.\
    \ This setup allows you to log in on a minimal desktop when your standard login\
    \ does not work well enough to allow you to log in to fix a login problem. Give\
    \ the command **exit** from the xterm window to log out and display the Login\
    \ screen.\n\n![](bbox=[0.198, 0.44, 0.35, 0.557])\n\nAny changes you make in the\
    \ Sessions dialog box affect the current session only. The next time you log in,\
    \ you will revert to your default desktop environment (KDE or GNOME). After you\
    \ log in, use switchdesk (page 116) to change your default desktop environment.\n\
    \n![](bbox=[0.198, 0.687, 0.35, 0.804])\n\nJust after you log in, the system asks\
    \ whether the change made in the Sessions dialog box is just for this session\
    \ or if you want to make it permanent. The failsafe logins do not ask this question.\n\
    \n+   - **Restart** Shuts down and reboots the system.\n- **Shutdown** Shuts down\
    \ the system and turns off the power.\n\n# What to Do if You Cannot Log In\n\n\
    If you enter either your username or password incorrectly, the system displays\
    \ an error message after you enter *both* your username *and* your password. This\
    \ message indicates that you have entered either the username or the password\
    \ incorrectly or that they are not valid. It does not differentiate between an\
    \ unacceptable username and an unacceptable passworde strategy meant to discourage\
    \ unauthorized people from guessing names and passwords to gain access to the\
    \ system. Here are some common reasons why logins fail:\n\n+   - **The username\
    \ and password are case sensitive.** Make sure the CAPS LOCK key is off and that\
    \ you enter your username and password exactly as specified or as you set them\
    \ up."
