  md: '# Features of This Book


    This book is designed and organized so you can get the most out of it in the shortest
    amount of time. You do not have to read this book straight through in page order.
    Once you are comfortable using Linux, you can use this book as a reference: Look
    up a topic of interest in the table of contents or index and read about it. Or
    think of the book as a catalog of Linux topics: Flip through the pages until a
    topic catches your eye. The book includes many pointers to Web sites where you
    can get additional information: Consider the Internet an extension of this book.


    *A Practical Guide to Red Hat^® Linux^®, Third Edition* is structured with the
    following features:


    +   - In this book, the term ***Red Hat Linux*** refers to both **Fedora Core**
    and **Red Hat Enterprise Linux**. Features that apply to only one operating system
    or the other are marked as such using these indicators: FEDORA or RHEL.


    +   - **Optional sections** enable you to read the book at different levels, returning
    to more difficult material when you are ready to delve into it.


    +   - **Caution boxes** highlight procedures that can easily go wrong, giving
    you guidance before you run into trouble.


    +   - **Tip boxes** highlight ways that you can save time by doing something differently
    or situations when it may be useful or just interesting to have additional information.


    +   - **Security boxes** point out places where you can make a system more secure.
    The **security appendix** presents a quick background in system security issues.


    +   - Concepts are illustrated by **practical examples** throughout the book.


    +   - **Chapter summaries** review the important points covered in each chapter.


    +   - **Review exercises** are included at the end of each chapter for readers
    who want to further hone their skills. Answers to even-numbered exercises are
    at [www.sobell.com](http://www.sobell.com).


    +   - This book provides resources for **finding software** on the Internet. It
    also explains how to **download** and **install** software using yum, BitTorrent,
    and, for Red Hat Enterprise Linux, Red Hat Network (RHN).


    +   - The **glossary** defines more than 500 common terms.


    +   - The book describes in detail many important **GNU tools**, including the
    gcc C compiler, the gdb debugger, the GNU Configure and Build System, make, and
    gzip.


    +   - Pointers throughout the text provide help in obtaining **online documentation**
    from many sources including the local system, the Red Hat Web site, and other
    locations on the Internet.


    +   - Many useful URLs (Internet addresses) point to sites where you can obtain
    software, security programs and information, and more.


    +   - The comprehensive index helps you locate topics quickly and easily.


    # Key Topics Covered in This Book


    This book contains a lot of information. This section distills and summarizes
    its contents. You may want to review the table of contents for more detail. This
    book


    Installation'
