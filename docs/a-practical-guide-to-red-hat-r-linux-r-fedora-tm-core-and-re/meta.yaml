  md: '+   - **FTP** Set up a **vsftpd** secure FTP server and use any of several
    FTP clients to exchange files with the server.

    - **Mail** Configure **sendmail** and use Webmail, POP3, or IMAP to retrieve email;
    use SpamAssassin to combat spam.

    - **NIS** Set up NIS to facilitate system administration of a LAN.

    - **NFS** Share filesystems between systems on a network.

    - **Samba** Share filesystems and printers between Windows and Linux systems.

    - **DNS/BIND** Set up a domain nameserver to let other systems on the Internet
    know the names and IP addresses of your systems they may need to contact.

    - **iptables** Share a single Internet connection between systems on a LAN and
    set up a firewall to protect local systems.

    - **Apache** Set up an HTTP server that serves Web pages that browsers can display.


    # Part VI


    [Part VI](link) covers programming. [Chapter 27](link) discusses programming tools
    and environments available under Red Hat Linux, including the C programming language
    and debugger, make, shared libraries, and source code management using CVS. [Chapter
    28](link) goes into greater depth about shell programming using bash, with the
    discussion being enhanced by extensive examples.


    # Part VII


    [Part VII](link) includes appendixes on regular expressions, helpful Web sites,
    system security, and free software. This part also includes an extensive glossary
    with more than 500 entries and a comprehensive index.


    # ## Supplements


