  md: '# Getting the Facts: Where to Find Documentation


    Distributions of Linux, including Red Hat Linux, typically do not come with hardcopy
    reference manuals. However, its online documentation has always been one of Linux''s
    strengths. The manual (or man) and info pages have been available via the man
    and info utilities since early releases of the operating system. Both the GNOME
    and KDE desktops provide graphical Help Centers. Not surprisingly, with the growth
    of Linux and the Internet, the sources of documentation have expanded as well.
    This section discusses some of the places you can look for information on Linux
    in general and Red Hat Linux in particular.


    # The KDE Help Center


    Display the KDE Help Center by clicking **Main menu: Help**. If the Help Center
    displays a window that asks whether you want to create a search index, click **Create**.
    The Help Center then displays the Build Search Index window. Put a check mark
    in each of the boxes in the Search Scope column of this window and click **Build
    Index**. The window that appears shows the progress being made in building the
    index. When it is complete, click **Close**.


    The Help Center window contains two vertical sections separated by a thin bar
    with hatchmarks on it. (See [Figure 4-17](#) on page [100](#) for an example of
    a bar with similar marks.) Click the hatchmarks and drag the bar left or right
    to adjust the sizes of the two sections of the window.


    The left side of the Help Center window contains three tabs: Contents, Glossary,
    and Search Options. Click the **Contents** tab to display a list of the Help Center
    contents on the left. This list includes the KDE FAQ, the KDE User''s Manual,
    Linux (UNIX) man pages, GNU info pages, KDE Control Center modules, and more.
    Click an item on this list to display a list of subitems available for further
    exploration. Click a subitem to display that item on the right. [Figure 4-20](#)
    shows the Help Center, Contents tab, displaying information on the **Control Center
    Modules** ![arrow] **Font Installer**.


    ![](bbox=[0.222, 0.618, 0.779, 0.668])'
