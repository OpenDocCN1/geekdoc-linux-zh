  md: '# # 2. Installation Overview


    IN THIS CHAPTER


    +   - [More Information](page 24) 24

    - [Planning the Installation](page 24) 24

    - [Setting Up the Hard Disk](page 28) 28

    - [LVM: Logical Volume Manager](page 32) 32

    - [How the Installation Works](page 33) 33

