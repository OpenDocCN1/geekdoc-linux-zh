  md: '# Bringing a GUI Up from a Character-Based Display


    By default, Red Hat systems present a graphical interface when they first come
    up. If the system comes up with a textual interface, you can log in on a virtual
    console and start a graphical display by giving the following command to bring
    up your default desktop environment:


    ```

    $ startx

    ```


    If startx does not work, run system-config-display (page 70) to set up the graphics
    card and monitor configuration for the X Window System.


    # Correcting Mistakes


    This section explains how to correct typographical and other errors you may make
    while you are logged in on a character-based display (either a virtual console
    or a terminal emulator). Because the shell and most other utilities do not interpret
    the command line or other text until after you press RETURN, you can readily correct
    typing mistakes before you press RETURN.


    You can correct typing mistakes in several ways: erase one character at a time,
    back up a word at a time, or back up to the beginning of the command line in one
    step. After you press RETURN, it is too late to correct a mistake: You must either
    wait for the command to run to completion or abort execution of the program (page
    118).


    # Erasing a Character


    While entering characters from the keyboard, you can back up and erase a mistake
    by pressing the *erase key* once for each character you want to delete. The erase
    key backs over as many characters as you wish. It does not, in general, back up
    past the beginning of the line.


    The default erase key is BACKSPACE. If this key does not work, try DELETE or CONTROL-H.
    If these keys do not work, give the following stty[^3] command to set the erase
    and line kill (see ''Deleting a Line'' on the next page) keys to their default
    values:


    [^3]: The command stty is an abbreviation for *set teletypewriter*, the first
    terminal that UNIX was run on. Today stty is commonly thought of as *set terminal*.


    ```

    $ stty ek

    ```


    # Deleting a Word


    You can delete a word you entered by pressing CONTROL-W. A *word* is any sequence
    of characters that does not contain a SPACE or TAB. When you press CONTROL-W,
    the cursor moves left to the beginning of the current word (as you are entering
    a word) or the previous word (when you have just entered a SPACE or TAB), removing
    the word.'
  merge: -1
  pgno: 184
- img_proc: false
  md: '**Tip**: CONTROL-Z **suspends a program**


    Although it is not a way of correcting a mistake, you may press the suspend key
    (typically CONTROL-Z) by mistake and wonder what happened (you will see a message
    containing the word **Stopped**). You have just stopped your job, using job control
    (page 280). Give the command **fg** to continue your job in the foreground, and
    you should return to where you were before you pressed the suspend key. For more
    information refer to "bg: Sends a Job to the Background" on page 281.


    # Deleting a Line


    Any time before you press RETURN, you can delete the line you are entering by
    pressing the *line kill key* (*or kill key*). When you press this key, the cursor
    moves to the left, erasing characters as it goes, back to the beginning of the
    line. The default line kill key is CONTROL-U. If this key does not work, try CONTROL-X.
    If these keys do not work, give the following command to set the erase and line
    kill keys to their default values:


    ```

    $ stty ek

    ```


    # Aborting Execution


    Sometimes you may want to terminate a running program. For example, you may want
    to stop a program that is performing a lengthy task such as displaying the contents
    of a file that is several hundred pages long or copying a file that is not the
    one you meant to copy.


    To terminate a program from a character-based display, press the *interrupt key*
    (CONTROL-C or sometimes DELETE or DEL). When you press this key, the Linux operating
    system sends a terminal interrupt signal to the program you are running and to
    the shell. Exactly what effect this signal has depends on the particular program.
    Some programs stop execution immediately, some ignore the signal, and some take
    other actions. When it receives a terminal interrupt signal, the shell displays
    a prompt and waits for another command.


    If these methods do not terminate the program, try stopping the program with the
    suspend key (typically CONTROL-Z), giving the **jobs** command to verify the job
    number of the program, and using kill to abort the program. The job number is
    the number within the brackets at the left end of the line that **jobs** displays
    ([1]). The **kill** command (page 395) uses **TERM** to send a termination signal[4]
    to the job specified by the job number, which is preceded by a percent sign (**%1**):


    > [4] When the terminal interrupt signal does not work, use the kill (KILL) signal.
    A running program cannot ignore a kill signal; it is sure to abort the program
    (page 395).


    ```

    $ bigjob

    ^Z

    [1]+  Stopped            bigjob

    $ jobs

    [1]+  Stopped            bigjob

    $ kill -TERM %1

    $ RETURN

    [1]+  Killed              bigjob

    ```'
  merge: -1
