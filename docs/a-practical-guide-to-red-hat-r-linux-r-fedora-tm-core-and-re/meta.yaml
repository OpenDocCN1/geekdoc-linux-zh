  md: 'Devices (such as a printer or terminal) and disk files appear as files to Linux
    programs. When you give a command to the Linux operating system, you can instruct
    it to send the output to any one of several devices or files. This diversion is
    called output *redirection*.


    # Device independence


    In a similar manner, a program''s input that normally comes from a keyboard can
    be redirected so that it comes from a disk file instead. Input and output are
    *device independent*; they can be redirected to or from any appropriate device.


    As an example, the cat utility normally displays the contents of a file on the
    screen. When you run `cat` command, you can easily cause its output to go to a
    disk file instead of the screen.


    # Shell Functions


    One of the most important features of the shell is that users can use it as a
    programming language. Because the shell is an interpreter, it does not compile
    programs written for it but rather interprets programs each time they are loaded
    from the disk. Loading and interpreting programs can be time-consuming.


    Many shells, including the Bourne Again Shell, include shell functions that the
    shell holds in memory so that it does not have to read them from the disk each
    time you want to execute them. The shell also keeps functions in an internal format
    so that it does not have to spend as much time interpreting them.


    # Job Control


    *Job control* is a shell feature that allows users to work on several jobs at
    once, switching back and forth between them as desired. When you start a job,
    it is frequently in the foreground so it is connected to the terminal. Using job
    control, you can move the job you are working with into the background and continue
    running it there while working on or observing another job in the foreground.
    If a background job then needs your attention, you can move it into the foreground
    so that it is once again attached to the terminal. The concept of job control
    originated with BSD UNIX, where it appeared in the C Shell.


    # A Large Collection of Useful Utilities


    Linux includes a family of several hundred utility programs, often referred to
    as *commands*. These utilities perform functions that are universally required
    by users. The sort utility, for example, puts lists (or groups of lists) in alphabetical
    or numerical order and can be used to sort lists by part number, last name, city,
    ZIP code, telephone number, age, size, cost, and so forth. The sort utility is
    an important programming tool and is part of the standard Linux system. Other
    utilities allow users to create, display, print, copy, search, and delete files
    as well as to edit, format, and typeset text. The man (for manual) and info utilities
    provide online documentation for Linux itself.'
  merge: -1
  pgno: 38
- img_proc: false
  md: '# # Interprocess Communication


    Pipes and filters


    Linux allows users to establish both pipes and filters on the command line. A
    *pipe* sends the output of one program to another program as input. A *filter*
    is a special kind of pipe that processes a stream of input data to yield a stream
    of output data. A filter processes another program''s output, altering it as a
    result. The filter''s output then becomes input to another program.


    Pipes and filters frequently join utilities to perform a specific task. For example,
    you can use a pipe to send the output of the cat utility to sort, a filter, and
    can then use another pipe to send the output of sort to a third utility, lpr,
    that sends the data to a printer. Thus, in one command line, you can use three
    utilities together to sort and print a file.


    # # System Administration


    On a Linux system the system administrator is frequently the owner and only user
    of the system. This person has many responsibilities. The first responsibility
    may be to set up the system and install the software.


    Once the system is up and running, the system administrator is responsible for
    downloading and installing software (including upgrading the operating system),
    backing up and restoring files, and managing such system facilities as printers,
    terminals, servers, and a local network. The system administrator is also responsible
    for setting up accounts for new users on a multiuser system, bringing the system
    up and down as needed, and taking care of any problems that arise.'
  merge: -1
  pgno: 39
- img_proc: false
  md: '# # Additional Features of Linux


    The developers of Linux included features from BSD, System V, and Sun Microsystems''
    Solaris, as well as new features, in their operating system. Although most of
    the tools found on UNIX exist for Linux, in some cases these tools have been replaced
    by more modern counterparts. This section describes some of the popular tools
    and features available under Linux.


    # ## GUIs: Graphical User Interfaces


    The X Window System (also called X or X11) was developed in part by researchers
    at MIT (Massachusetts Institute of Technology) and provides the foundation for
    the GUIs available with Linux. Given a terminal or workstation screen that supports
    X, a user can interact with the computer through multiple windows on the screen,
    display graphical information, or use special-purpose applications to draw pictures,
    monitor processes, or preview formatted output. X is an across-the-network protocol
    that allows a user to open a window on a workstation or computer system that is
    remote from the CPU generating the window.


    ![](bbox=[0.146, 0.476, 0.253, 0.49])


    Usually two layers run under X: a desktop manager and a window manager. A *desktop
    manager* is a picture-oriented user interface that enables you to interact with
    system programs by manipulating icons instead of typing the corresponding commands
    to a shell. Red Hat Linux includes GNOME ([Figure 1-3](http://www.gnome.org))
    and KDE ([www.kde.org](http://www.kde.org)), the most popular desktop managers.


    # ### Figure 1-3. A GNOME workspace


    [View full size image]'
  merge: -1
  pgno: 40
- img_proc: false
  md: '![](bbox=[0.091, 0.057, 0.917, 0.492])


    Window manager


    A *window manager* is a program that runs under the desktop manager and allows
    you to open and close windows, run programs, and set up a mouse so it does various
    things depending on how and where you click. The window manager also gives the
    screen its personality. Whereas Microsoft Windows allows you to change the color
    of key elements in a window, a window manager under X allows you to customize
    the overall look and feel of the screen: You can change the way a window looks
    and works (by giving it different borders, buttons, and scrollbars), set up virtual
    desktops, create menus, and more.


    Several popular window managers run under X and Linux. Red Hat Linux provides
    Metacity (the default under GNOME) and kwin (the default under KDE). Other window
    managers, such as Sawfish and WindowMaker, are also available. [Chapters 4](#)
    and [8](#) have more information on GUIs.


    # ## (Inter)Networking Utilities


    Linux network support includes many utilities that enable you to access remote
    systems over a variety of networks. In addition to sending email to users on other
    systems, you can access files on disks mounted on other computers as if they were
    located on the local system, make your files available to other systems in a similar
    manner, copy files back and forth, run programs on remote systems while displaying'
  merge: -1
  pgno: 41
- img_proc: false
  md: 'the results on the local system, and perform many other operations across local
    area networks (LANs) and wide area networks (WANs), including the Internet.


    Layered on top of this network access is a wide range of application programs
    that extend the computer''s resources around the globe. You can carry on conversations
    with people throughout the world, gather information on a wide variety of subjects,
    and download new software over the Internet quickly and reliably. [Chapter 10](Chapter
    10) discusses networks, the Internet, and the Linux network facilities.


    # ## Software Development


    One of Linux''s most impressive strengths is its rich software development environment.
    You can find compilers and interpreters for many computer languages. Besides C
    and C++, languages available for Linux include Ada, Fortran, Java, Lisp, Pascal,
    Perl, and Python. The bison utility generates parsing code that makes it easier
    to write programs to build compilers (tools that parse files containing structured
    information). The flex utility generates scanners (code that recognizes lexical
    patterns in text). Themake utility and the GNU Configure and Build System make
    it easier to manage complex development projects. Source code management systems,
    such as CVS, simplify version control. Several debuggers, including ups and gdb,
    help in tracking down and repairing software defects. The GNU C compiler (gcc)
    works with the gprof profiling utility to help programmers identify potential
    bottlenecks in a program''s performance. The C compiler includes options to perform
    extensive checking of C code that can make the code more portable and reduce debugging
    time. These and other software development tools are discussed in [Chapter 27](Chapter
    27). [Table B-4](Table B-4) on page [982](982) lists some sites that you can download
    software from.'
  merge: -1
