    # Changing Your Password


    If someone else initially assigned your password, it is a good idea to give yourself
    a new one. A good password is seven or eight characters long and contains a combination
    of numbers, uppercase and lowercase letters, and punctuation characters. Avoid
    using control characters (such as CONTROL-H) because they may have a special meaning
    to the system, making it impossible for you to log in. Do not use names, words
    from English or other languages, or other familiar words that someone can easily
    guess.


    For security reasons none of the passwords you enter is displayed by any utility.


    # Security: Protect your password


    Do not allow someone to find out your password: *Do not* put your password in
    a file that is not encrypted, allow someone to watch you type your password, or
    give your password to someone you do not know (a system administrator never needs
    to know your password). You can always write your password down and keep it in
    a safe, private place.


    # Security: Choose a password that is difficult to guess


    Do use phone numbers, names of pets or kids, birthdays, words a dictionary (not
    even a foreign language), and so forth. Do not use permutations of these items.


    # Security: Differentiate between important and less important passwords'
  merge: -1
