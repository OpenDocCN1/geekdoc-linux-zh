  md: "Specifying two monitors\n\nThe Dual head tab allows you to specify a second\
    \ video card that can drive a second monitor. Specify the monitor type, video\
    \ card, resolution, and color depth as you did earlier. You can choose to have\
    \ each monitor display a desktop or to have the two monitors display a single\
    \ desktop (spanning desktops). Click **OK** to close the Display settings window.\n\
    \nThe system-config-display utility generates an **xorg.conf** file (discussed\
    \ in the next section) with the information you entered.\n\n# The xorg.conf File\n\
    \nThe **/etc/X11/xorg.conf** file comprises sections that can appear in any order.\
    \ The format of a section is\n\n```\nSection \"*name*\"\n    *entry*\n    ...\n\
    EndSection\n```\n\nwhere ***name*** is the name of the section. A typical *entry*\
    \ occupies multiple physical lines but is actually just one logical line, consisting\
    \ of a keyword followed by zero or more integer, real, or string arguments. Keywords\
    \ in these files are not case sensitive; underscores (_) within keywords are ignored.\
    \ Most strings are not case sensitive, and SPACEs and underscores in most strings\
    \ are ignored. All strings must appear within double quotation marks.\n\nThe Option\
    \ keyword provides free-form data to server components and is followed by the\
    \ name of the option and optionally a value. All Option values must be enclosed\
    \ within double quotation marks.\n\nBoolean Options take a value of **TRUE** (**1**,\
    \ **on**, **true**, **yes**) or **FALSE** (**0**, **off**, **false**, **no**);\
    \ no value is the same as **TRUE**. You can prepend **No** to the name of a Boolean\
    \ Option to reverse the sense of the Option.\n\nThe following sections can appear\
    \ in an **xorg.conf** file:\n\n| Section | Description |\n|---|---|\n| **ServerFlags**\
    \ | Global Options (optional) |\n| **ServerLayout** | Binds Screen(s) and InputDevice(s)\
    \ |\n| **Files** | Locations of configuration files |\n| **Module** | Modules\
    \ to be loaded (optional) |\n| **InputDevice** | Keyboard(s) and pointer(s) |\n\
    | **Monitor** | Monitor(s) |\n| **Device** | Video card(s) |\n| **Screen** | Binds\
    \ device(s) and monitor(s) |\n| **VideoAdaptor** | Configures the Xv extension\
    \ (optional) |\n| **Modes** | Video modes (optional) |\n| **DRI** | Direct Rendering\
    \ Infrastructure (optional) |"
  merge: -1
  pgno: 126
- img_proc: false
  md: "| **Vendor** | Vendor-specific information (optional) |\n\nThis chapter covers\
    \ the sections you most likely need to work with: ServerLayout, InputDevice, Monitor,\
    \ Device, and Screen. See the **xorg.conf** man page for more information.\n\n\
    # ServerLayout **Section**\n\nThe ServerLayout section appears first in some **xorg.conf**\
    \ files because it summarizes the other sections that are used to specify the\
    \ server. The following ServerLayout section names the server **single head configuration**\
    \ and specifies that the server comprises the sections named Screen0, Mouse0,\
    \ Keyboard0, and DevInputMice.\n\nThe term **core** in this file means **primary**;\
    \ there must be exactly one CoreKeyboard and one CorePointer. The AlwaysCore argument\
    \ indicates that the device reports core events and is used here to allow a non-USB\
    \ mouse and a USB mouse to work at the same time. The result is that you can use\
    \ either type of mouse interchangeably without modifying the **xorg.conf** file:\n\
    \n```\nSection \"ServerLayout\"\n    Identifier  \"single head configuration\"\
    \n    Screen  0  \"Screen0\" 0 0\n    InputDevice \"Mouse0\" \"CorePointer\"\n\
    \    InputDevice \"Keyboard0\" \"CoreKeyboard\"\n    InputDevice \"DevInputMice\"\
    \ \"AlwaysCore\"\nEndSection\n```\n\nRefer to the following sections for explanations\
    \ of the sections specified in ServerLayout.\n\n# InputDevice **Section**\n\n\
    There must be at least two InputDevice sections: one specifying the keyboard and\
    \ one specifying the pointer (usually a mouse). The format of an InputDevice section\
    \ is\n\n```\nSection \"InputDevice\"\n    Identifier \"id_name\"\n    Driver \"\
    drv_name\"\n    options\n    ...\nEndSection\n```\n\nwhere ***id_name*** is a\
    \ unique name for the device and **drv_name** is the driver to use for the device,\
    \ typically [keyboard](#) or [mouse](#). The system-config-display utility typically\
    \ creates three InputDevice sections. The following section defines a keyboard\
    \ device named Keyboard0 that uses the **keyboard** driver. The keyboard model\
    \ is a 105-key PC keyboard. You can change **pc105** to **microsoft** if you are\
    \ using a U.S. Microsoft Natural keyboard, although the differences are minimal.\n\
    \n```\nSection \"InputDevice\"\n    Identifier  \"Keyboard0\"\n    Driver    \
    \  \"keyboard\"\n    Option      \"XkbModel\" \"pc105\"\n    Option      \"XkbLayout\"\
    \ \"us\"\n```"
  merge: -1
  pgno: 127
- img_proc: false
  md: "```\nEndSection\n```\n\nTo change the language the keyboard supports, change\
    \ the argument to the XkbLayout Option to, for example, **fr** for French.\n\n\
    The next InputDevice section defines a mouse named Mouse0 that uses the **mouse**\
    \ driver. The Device Option specifies a PS2 device. The ZAxisMapping Option maps\
    \ the Z axis, the mouse wheel, to virtual mouse buttons 4 and 5, which are used\
    \ to scroll a window. For more information refer to \"Remapping Mouse Buttons\"\
    \ on page 239. When set to **YES**, the Emulate3Buttons Option enables the user\
    \ of a two-button mouse to emulate a three-button mouse by pressing the two buttons\
    \ simultaneously.\n\n```\nSection \"InputDevice\"\n    Identifier  \"Mouse0\"\n\
    \    Driver      \"mouse\"\n    Option      \"Protocol\" \"IMPS/2\"\n    Option\
    \      \"Device\" \"/dev/psaux\"\n    Option      \"ZAxisMapping\" \"4 5\"\n \
    \   Option      \"Emulate3Buttons\" \"no\"\nEndSection\n```\n\nThe next InputDevice\
    \ section is similar to the previous one except the Device Option specifies a\
    \ USB mouse. See \"ServerLayout Section\" on page 72 for a discussion.\n\n```\n\
    Section \"InputDevice\"\n# If the normal CorePointer mouse is not a USB mouse\
    \ then\n# this input device can be used in AlwaysCore mode to let you\n# also\
    \ use USB mice at the same time.\n    Identifier  \"DevInputMice\"\n    Driver\
    \      \"mouse\"\n    Option      \"Protocol\" \"IMPS/2\"\n    Option      \"\
    Device\" \"/dev/input/mice\"\n    Option      \"ZAxisMapping\" \"4 5\"\n    Option\
    \      \"Emulate3Buttons\" \"no\"\nEndSection\n```\n\n# Monitor Section\n\nThe\
    \ **xorg.conf** file must have at least one Monitor section. The easiest way to\
    \ set up this section is to use the **system-config-display** utility, which either\
    \ determines the type of monitor automatically by probing or allows you to select\
    \ from a list of monitors.\n\n# Caution: Do not guess at values for HorizSync\
    \ or Vert-Refresh\n\n> If you configure the Monitor section manually, do not guess\
    \ at the scan rates (HorizSync and VertRefresh); on older monitors, you can destroy\
    \ the hardware by choosing scan rates that are too high.\n\nThe following section\
    \ defines a monitor named Monitor0. The VendorName and ModelName are for reference\
    \ only and do not affect the way the system works. The optional DisplaySize specifies\
    \ the height and width of the screen in millimeters, allowing X to calculate the\
    \ DPI"
  merge: -1
  pgno: 128
- img_proc: false
  md: "of the monitor. HorizSync and VertRefresh specify ranges of vertical refresh\
    \ frequencies and horizontal sync frequencies for the monitor; these values are\
    \ available from the manufacturer. The dpms Option specifies the monitor is [DPMS](page\
    \ 1030) compliant (has built-in energy-saving features).\n\n```\nSection \"Monitor\"\
    \n    Identifier   \"Monitor0\"\n    VendorName   \"Monitor Vendor\"\n    ModelName\
    \    \"Dell D1028L\"\n    DisplaySize  360 290\n    HorizSync    31.0 - 70.0\n\
    \    VertRefresh  50.0 - 120.0\n    Option       \"dpms\"\nEndSection\n```\n\n\
    A Monitor section may mention DDC (Display Data Channel); DDC can be used by a\
    \ monitor to inform a video card about its properties. If you omit or comment\
    \ out the HorizSync and VertRefresh lines, X will use DDC probing to determine\
    \ proper values.\n\n# Device Section\n\nThe **xorg.conf** file must have at least\
    \ one Device section to specify the type of video card in the system. The VendorName\
    \ and BoardName are for reference only and do not affect the way the system works.\
    \ The easiest way to set up this section is to use the system-config-display utility,\
    \ which usually determines the type of video card by probing. The following Device\
    \ section specifies that Videocard0 uses the **tdfx** driver:\n\n```\nSection\
    \ \"Device\"\n    Identifier  \"Videocard0\"\n    Driver      \"tdfx\"\n    VendorName\
    \  \"Videocard vendor\"\n    BoardName   \"Voodoo3 (generic)\"\nEndSection\n```\n\
    \n# Screen Section\n\nThe **xorg.conf** file must contain at least one Screen\
    \ section. This section binds a video card specified in the Device section to\
    \ a display specified in the Monitor section. The following Screen section specifies\
    \ that Screen0 comprises Videocard0 and Monitor0, both defined elsewhere in the\
    \ file. The DefaultDepth entry specifies the default [color depth](page 1025),\
    \ which can be overridden in the Display subsection.\n\nEach Screen section must\
    \ have at least one Display subsection. The following subsection specifies a color\
    \ Depth and three Modes. The Modes specify the screen resolutions in units of\
    \ dots per inch (dpi). The first Mode is the default; you can switch between Modes\
    \ while X is running by pressing CONTROL-ALT-KEYPAD+ or CONTROL-ALT-KEYPAD. You\
    \ must use the plus or minus on the numeric keypad when giving these commands.\
    \ X ignores invalid Modes.\n\n```\nSection \"Screen\"\n    Identifier \"Screen0\"\
    \n    Device     \"Videocard0\"\n    Monitor    \"Monitor0\"\n    DefaultDepth\
    \     24\n    SubSection \"Display\"\n    Depth     24\n```"
  merge: -1
  pgno: 129
- img_proc: false
  md: "```\n    Modes      \"1024x768\" \"800x600\" \"640x480\"\n    EndSubSection\n\
    EndSection\n```\n\nIf you omit or comment out the Depth and Modes lines, X will\
    \ use DDC probing to determine optimal values.\n\n# Multiple Monitors\n\nX has\
    \ supported multiple screens for a long time. X.org supports multimonitor configurations\
    \ using either two graphics cards or a dual-head card. Both setups are usually\
    \ configured the same way because the drivers for dual-head cards provide a secondary\
    \ virtual device.\n\nTraditionally each screen in X is treated as a single entity.\
    \ That is, each window must be on one screen or another. More recently the Xinerama\
    \ extension allows windows to be split across two or more monitors. This extension\
    \ is supported by X.org and works with most video drivers. When using Xinerama,\
    \ you must set all screens to the same color depth.\n\nFor each screen, you must\
    \ define a Device, Monitor, and Screen section in the **xorg.conf** file. These\
    \ sections are exactly the same as for a single-screen configuration; each screen\
    \ must have a unique identifier. If you are using a dual-head card, the Device\
    \ section for the second head is likely to require a BusID value to enable the\
    \ driver to determine that you are not referring to the primary display. The following\
    \ section identifies the two heads on an ATI Radeon 8500 card. For other dual-head\
    \ cards, consult the documentation provided with the driver (for example, give\
    \ the command **man mga** to display information on the **mga** driver):\n\n```\n\
    Section \"Device\"\n    Identifier  \"Videocard0\"\n    Driver      \"radeon\"\
    \n    VendorName  \"ATI\"\n    BoardName   \"Radeon 8500\"\nEndSection\nSection\
    \ \"Device\"\n    Identifier  \"Videocard1\"\n    Driver      \"radeon\"\n   \
    \ VendorName  \"ATI\"\n    BoardName   \"Radeon 8500\"\n    BusID       \"PCI:1:5:0\"\
    \nEndSection\n```\n\nOnce you have defined the screens, use the ServerLayout section\
    \ to tell X where they are in relation to each other. Each screen is defined in\
