  md: '![](bbox=[0.344, 0.053, 0.918, 0.17])


    # Standards


    With the idea of making life easier for system administrators and software developers,
    a group got together over the Internet and developed the Linux Filesystem Standard
    (FSSTND), which has since evolved into the Linux Filesystem Hierarchy Standard
    (FHS). Before this standard was adopted, key programs were located in different
    places in different Linux distributions. Today you can sit down at a Linux system
    and know where to expect to find any given standard program (page [176](page-176)).


    # Links


    A [*link*](link) allows a given file to be accessed by means of two or more names.
    The alternative names can be located in the same directory as the original file
    or in another directory. Links can make the same file appear in several users''
    directories, enabling those users to share the file easily. Windows uses the term
    *shortcut* in place of *link*. Macintosh users will be more familiar with the
    term *alias*. Under Linux, an *alias* is different from a *link*; it is a command
    macro feature provided by the shell (page [818](page-818)).


    # Security


    Like most multiuser operating systems, Linux allows users to protect their data
    from access by other users. It also allows users to share selected data and programs
    with certain other users by means of a simple but effective protection scheme.
    This level of security is provided by file access permissions, which limit which
    users can read from, write to, or execute a file. Access Control Lists (ACLs)
    have recently been added to the Linux kernel and are available in Red Hat Linux.
    ACLs give users and administrators finer-grained control over file access permissions.


    # The Shell: Command Interpreter and Programming Language


    In a textual environment, the shell—the command interpreter—acts as an interface
    between you and the operating system. When you enter a command on the screen,
    the shell interprets the command and calls the program you want. A number of shells
    are available for Linux. The'
  merge: -1
  pgno: 36
- img_proc: false
  md: 'three most popular ones are described here:


    +   - The Bourne Again Shell (bash), an enhanced version of the original Bourne
    Shell. It is one of the original UNIX shells.

    - The TC Shell (tcsh), an enhanced version of the C Shell. It was developed as
    part of BSD UNIX.

    - The Z Shell (zsh). It incorporates features from a number of shells, including
    the Korn Shell.


    Because users often prefer different shells, multiuser systems can have several
    different shells in use at any given time. The choice of shells demonstrates one
    of the advantages of the Linux operating system: the ability to provide a customized
    interface for each user.


    # Shell scripts


    Besides performing its function of interpreting commands from a keyboard and sending
    those commands to the operating system, the shell is a high-level programming
    language. Shell commands can be arranged in a file for later execution (Linux
    calls these files *shell scripts*; Windows call them *batch files*). This flexibility
    allows users to perform complex operations with relative ease, often with rather
    short commands, or to build with surprisingly little effort elaborate programs
    that perform highly complex operations.


    # Filename Generation


    # Wildcards and ambiguous file references


    When you are typing commands to be processed by the shell, you can construct patterns
    using characters that have special meanings to the shell. These characters are
    called [*wildcard*](http://www.bisenter.com) characters. The patterns, which are
    called *ambiguous file references*, are a kind of shorthand: Rather than typing
    in complete filenames, users can type in patterns and the shell will expand them
    into matching filenames. An ambiguous file reference can save you the effort of
    typing in a long filename or a long series of similar filenames. For example,
    the shell might expand the pattern **mak*** to **make-3.80.tar.gz**. Patterns
    can also be useful when you know only part of a filename or cannot remember the
    exact spelling.


    # Device-Independent Input and Output


    # Redirection'
