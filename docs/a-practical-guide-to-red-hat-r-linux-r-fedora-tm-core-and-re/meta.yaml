  md: '# ## Caution: Test the CDs or the DVD


    FEDORA Because Red Hat does not manufacture Fedora disks, during a CD- or DVD-based
    Fedora installation, Anaconda displays the CD Found screen before starting the
    installation. From this screen, you can verify that the installation CDs or DVD
    do not have any errors. Testing the CDs or DVD takes a few minutes and can save
    you hours of aggravation if the installation fails due to bad media.


    RHEL+FEDORA You can force the display of the CD Found screen by supplying the
    parameter **linux mediacheck** in response to the **boot:** prompt (page [46](page-46)).


    A CD or DVD may fail the media test if the software that was used to burn the
    disk did not include padding. If a CD or DVD fails the media test, try booting
    with the following parameter:


    ```

    linux ide=nodma

    ```


    If the CD or DVD passes the media test when you boot the system with this parameter,
    reboot the system without this parameter before installing Red Hat Linux. If you
    install Linux after having booted with this parameter, the kernel will be set
    up to always use this parameter and the installation and operation of the system
    may be very slow.


    # ## The Anaconda Installer


    Anaconda, which is written in Python and C, identifies the hardware, builds the
    filesystems, and installs or upgrades the Red Hat Linux operating system. Anaconda
    can run in textual or graphical (default) interactive mode or in batch mode (see
    "[Using the Kickstart Configurator](using-the-kickstart-configurator)" on page
    [63](page-63)).


    # ## Tip: Anaconda does not write to the hard disk until it displays the Begin
    Installation screen


    While you are installing Red Hat Linux, until Anaconda displays the Begin Installation
    screen ([Figure 3-9](figure-3-9), page [55](page-55)), you can press CONTROL-ALT-DEL
    to abort the installation process and reboot the system without making any changes
    to the hard disk. However, if Anaconda displays the initialize warning dialog
    box (page [49](page-49)), when you click **Yes**, it writes to the disk immediately.


    Exactly which screens Anaconda displays depends on whether you are installing
    Fedora Core or Red Hat Enterprise Linux and which parameters you specified following
    the **boot:** prompt. With some exceptionsmost notably if you are running a textual
    installationAnaconda probes the video card and monitor and starts a native X server
    with a log in **/tmp/X.log**. (This log is not preserved unless you complete the
    installation.)


    While it is running, Anaconda opens the virtual consoles (page [113](page-113))
    shown in [Table 3-1](table-3-1). You can display a virtual console by pressing
    CONTROL-ALT-F**x**, where **x** is the virtual console number and**F** **x** is
    the function key that corresponds to the virtual console number.'
  merge: -1
  pgno: 90
- img_proc: false
  md: '| Virtual console | Information displayed during installation |

    |---|---|

    | 1 | Installation dialog |

    | 2 | Shell |

    | 3 | Installation log |

    | 4 | System messages |

    | 5 | Miscellaneous messages |

    | 7 | GUI interactive installation |


    At any time during the installation, you can switch to virtual console 2 (CONTROL-ALT-F2)
    and give commands to see what is going on. Do not give any commands that change
    any part of the installation process. To switch back to the graphical installation
    screen, press CONTROL-ALT-F7.


    # Using Anaconda


    Anaconda provides a **Next** button at the lower-right corner of each of the installation
    screens and a **Back** button next to it on most screens. When you have completed
    the entries on an installation screen, click **Next** or, from a textual installation,
    press the TAB key until the **Next** button is highlighted and then press RETURN.
    Select **Back** to return to the previous screen. Click **Release Notes** at the
    lower-left corner of the screen to display the release notes for the version of
    Red Hat Linux you are installing.


    # Anaconda Screens


    Anaconda displays different screens depending on which commands you give and which
    choices you make. During a graphical installation, when you leave the CD Found
    screen, Anaconda starts, loads drivers, and probes for the devices it will use
    during installation. After probing, it starts the X server. This section describes
    the screens that Anaconda displays during a default installation and explains
    the choices you can make on each of them.


    Logo


    Anaconda displays the Logo screen ([Figure 3-1]) after it obtains enough information
    to start the X Window System. There is nothing for you to do on this screen except
    display the release notes. Select **Next**.'
