- img_proc: false
  md: '**System: Preferences** ➔ **About Me** and click **Change Password** (RHEL
    uses **Applications: Preferences** ➔ **Password**).


    The first item the system asks for is your current (old) password. This password
    is verified to ensure that an unauthorized user is not trying to alter your password.
    The system then requests the new password.


    A password should meet the following criteria to be relatively secure. Only the
    first item is mandatory.


    +   - It must be at least six characters long (or longer if the system administrator
    sets it up that way).

    - It should not be a word in a dictionary of any language, no matter how seemingly
    obscure.

    - It should not be the name of a person, place, pet, or other thing that might
    be discovered easily.

    - It should contain at least two letters and one digit.

    - It should not be your username, the reverse of your username, or your username
    shifted by one or more characters.

    - If you are changing your password, the new password should differ from the old
    one by at least three characters. Changing the case of a character does not make
    it count as a different character.


    Refer to "[Keeping the System Secure](#)" on page 556 for more information about
    choosing a password.


    After you enter your new password, the system asks you to retype it to make sure
    you did not make a mistake when you entered it the first time. If the new password
    is the same both times you enter it, your password is changed. If the passwords
    differ, then you made an error in one of them. In this situation the system displays
    an error message or does not allow you to click the **OK** button.


    If the password you enter is not long enough, the system displays the following
    message:


    ```

    BAD PASSWORD: it is too short

    ```


    If it is too simple, the system displays this message:


    ```

    BAD PASSWORD: it is too simplistic/systematic

    ```


    If the password is formed from words, the system displays this message:


    ```

    BAD PASSWORD: it is based on a dictionary word

    ```


    If the system displays one of these messages, enter a longer or more complex password
    in response to the **New UNIX password:** prompt.


    When you successfully change your password, you change the way you log in. If
    you forget your password, Superuser can change it and tell you the new password.


    # switchdesk: **Changes Your Default Desktop**'
  merge: -1
  pgno: 182
- img_proc: false
  md: 'The **switchdesk** utility tells the system which desktop you want to log in
    to by default: KDE or GNOME. Initially your account is set up to log in to GNOME
    by default. To use switchdesk, give the command **switchdesk** followed by the
    name of the desktop you want to be the default (**gnome** or **kde**).


    ![](bbox=[0.135, 0.23, 0.289, 0.261])


    The **switchdesk** utility is not installed by default because it is not needed.
    It is part of the **switchdesk** package.


    # Logging In on a Terminal


    Before you log in on a terminal, terminal emulator, or other textual device, the
    system displays a message called *issue* (stored in the **/etc/issue** file) that
    identifies the version of Red Hat Linux running on the system. A sample issue
    message follows:


    ```

    Fedora Core release 5 (Bordeaux

    Kernel 2.6.15-1.2054_FC5 on an i686

    ```


    The issue message is followed by a prompt to log in. Enter your username and password
    in response to the system prompts. If you are using a *terminal* (page 1059) and
    your screen does not display the **login:** prompt, check whether the terminal
    is plugged in and turned on, and then press the RETURN key a few times. I**login:**
    still does not appear, try pressing CONTROL-Q. If you are using *a workstation*
    (page 1064), make sure it is running. Runssh (page 585), telnet (page 363), or
    whatever communications/emulation software you have to log in on the system. Try
    logging in, making sure that you enter your username and password as they were
    specified when your account was set up; the routine that verifies the username
    and password is case sensitive.


    > **Security: Did you log in last?**


    As you are logging in to a textual environment, after you enter your username
    and password, the system displays information about the last login on this account,
    showing when it took place and where it originated. You can use this information
    to determine whether anyone else has accessed the account since you last used
    it. If someone has, perhaps an unauthorized user has learned your password and
    logged on as you. In the interest of security, advise the system administrator
    of any circumstances that make you suspicious and change your password (page 114).


    Next the *shell prompt* (or just *prompt*) appears, indicating that you have successfully
    logged in; it indicates that the system is ready for you to give a command. The
    first shell prompt line may be preceded by a short message called the *message
    of the day*, or **motd** (page 453), which is stored in the **/etc/motd** file.
    The usual prompt is a dollar sign ($). Red Hat Linux establishes a prompt of [**user@host
    directory]**$, where **user** is your username, **host** is the name of the local
    system, and **directory** is                the name of the directory you are
    working in. For information on how to change the prompt, refer to page 293.'
  merge: -1
