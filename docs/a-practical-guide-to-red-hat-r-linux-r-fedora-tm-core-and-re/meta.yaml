  md: '# # Overview of Linux


    The Linux operating system has many unique and powerful features. Like other operating
    systems, Linux is a control program for computers. But like UNIX, it is also a
    well-thought-out family of utility programs ([Figure 1-1](#)) and a set of tools
    that allow users to connect and use these utilities to build systems and applications.


    # ## Figure 1-1. A layered view of the Linux operating system


    [View full size image]


    ![](bbox=[0.093, 0.363, 0.916, 0.573])


    # ## Linux Has a Kernel Programming Interface


    The Linux kernel—the heart of the Linux operating system—is responsible for allocating
    the computer''s resources and scheduling user jobs so that each one gets its fair
    share of system resources, including access to the CPU; peripheral devices, such
    as disk, DVD, and CD-ROM storage; printers; and tape drives. Programs interact
    with the kernel through *system calls*, special functions with well-known names.
    A programmer can use a single system call to interact with many kinds of devices.
    For example, there is one **write()** system call, not many device-specific ones.
    When a program issues a **write()** request, the kernel interprets the context
    and passes the request to the appropriate device. This flexibility allows old
    utilities to work with devices that did not exist when the utilities were originally
    written. It also makes it possible to move programs to new versions of the operating
    system without rewriting them (provided that the new version recognizes the same
    system calls). See page [1011](#) for information on the Linux 2.6 kernel.


    # ## Linux Can Support Many Users'
  merge: -1
  pgno: 34
- img_proc: false
  md: 'Depending on the hardware and the types of tasks that the computer performs,
    a Linux system can support from 1 to more than 1,000 users, each concurrently
    running a different set of programs. The per-user cost of a computer that can
    be used by many people at the same time is less than that of a computer that can
    be used by only a single person at a time. It is less because one person cannot
    generally take advantage of all the resources a computer has to offer. That is,
    no one can keep all the printers going constantly, keep all the system memory
    in use, keep all the disks busy reading and writing, keep the Internet connection
    in use, and keep all the terminals busy at the same time. A multiuser operating
    system allows many people to use all the system resources almost simultaneously.
    The use of costly resources can be maximized and the cost per user can be minimizedthe
    primary objectives of a multiuser operating system.


    # ## Linux Can Run Many Tasks


    Linux is a fully protected multitasking operating system, allowing each user to
    run more than one job at a time. Processes can communicate with one another but
    remain fully protected from one another, just as the kernel remains protected
    from all processes. You can run several jobs in the background while giving all
    your attention to the job being displayed on the screen, and you can switch back
    and forth between jobs. If you are running the X Window System (page 15), you
    can run different programs in different windows on the same screen and watch all
    of them. This capability ensures that users can be more productive.


    # ## Linux Provides a Secure Hierarchical Filesystem


    A *file* is a collection of information, such as text for a memo or report, an
    accumulation of sales figures, an image, a song, or an executable program. Each
    file is stored under a unique identifier on a storage device, such as a hard disk.
    The Linux filesystem provides a structure whereby files are arranged under *directories*,
    which are like folders or boxes. Each directory has a name and can hold other
    files and directories. Directories, in turn, are arranged under other directories,
    and so forth, in a treelike organization. This structure helps users keep track
    of large numbers of files by grouping related files into directories. Each user
    has one primary directory and as many subdirectories as required ([Figure 1-2](#)).


    # **Figure 1-2. The Linux filesystem structure**


    ![](bbox=[0.092, 0.656, 0.916, 0.948])'
