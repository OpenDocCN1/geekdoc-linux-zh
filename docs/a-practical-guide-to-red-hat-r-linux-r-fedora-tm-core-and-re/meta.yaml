  md: '# A Tour of the Red Hat Linux Desktop


    GNOME ([www.gnome.org](www.gnome.org)), a product of the GNU project (page [4](#)),
    is the user-friendly default desktop manager under Red Hat Linux. KDE ([www.kde.org](www.kde.org)),
    the K Desktop Environment, is a powerful desktop manager and complete set of tools
    you can use in place of GNOME. This tour focuses on KDE. This full-featured, mature
    desktop environment boasts a rich assortment of configurable tools and features.
    After you log in, this section discusses several important features of the desktop,
    including the Main panel and the Main menu, and explores how to use some of the
    unique features of windows under KDE. Along the way, you will see how to roll
    up a window so only its titlebar remains on the desktop, how to move easily from
    one desktop or window to another, and how to configure the desktop to please your
    senses. As the tour continues, you will learn to work with files and browse the
    Web using Konqueror, one of the primary KDE tools. The tour concludes with coverage
    of the KDE Control Center, the key to customizing your desktop, and a discussion
    of how to use the Panel menu to modify the panel (at the bottom of the screen)
    to best suit your needs.


    As Red Hat Linux is installed, when you log in, you use GNOME. Because the examples
    in this section are based on KDE, you must tell the system that you want to run
    KDE before you log in. The following section explains how to log in to a KDE desktop
    environment.


    Starting with *"Getting the Facts: Where to Find Documentation"* on page [102](#),
    the chapter covers both KDE and GNOME.


    # Logging In on the System


    Typically, when you boot a Red Hat Linux system, it displays a Login screen on
    the system console. This screen has a text box labeled **Username** with four
    word/icon buttons below it. These buttons allow you to work in a different language
    (**Language**), specify the desktop manager (**Session**), reboot the system (**Restart**),
    and turn the system off (**Shut Down**). For more information refer to *''The
    Login Screen''* on page [111](#). Click **Session** and the system displays the
    Sessions dialog box, which allows you to choose whether you want to run GNOME
    or KDE, or make another choice. To follow the examples in this section, click
    the radio button next to **KDE** and then click **Change Session** to close the
    dialog box. If the KDE radio button is not visible, KDE is probably not installed;
    refer to the *"KDE is not installed"* tip on page [84](#).


    Enter your username in the text box labeled **Username** and press RETURN. The
    label changes to **Password**. Enter your password and press RETURN. If you get
    an error message, try entering your username and password again. Make sure the
    CAPS LOCK key is not on; your entries are case sensitive. See page [112](#) for
    help with problems logging in and page [114](#) if you want to change your password.


    RHEL


    The change you make in the Sessions dialog box affects only the current session.
    The next time you log in, you revert to your default desktop environment (KDE
    or GNOME). Use switchdesk (page [116](#)) to change your default desktop environment.


    FEDORA


    Once the system has determined that you are allowed to log in, it displays a dialog
    box that asks, **Do you want to make KDE the default for future sessions?** It
    displays this dialog box because you elected to change your session to KDE before
    you logged in. The dialog box has three buttons that allow you to make the change
    effective **Just For This Session** (until you log off), **Cancel** the change,
    or **Make**'
  merge: -1
