  md: '# ## Standards


    Individuals from companies throughout the computer industry have joined together
    to develop the POSIX (Portable Operating System Interface for Computer Environments)
    standard, which is based largely on the UNIX System V Interface Definition (SVID)
    and other earlier standardization efforts. These efforts have been spurred by
    the U.S. government, which needs a standard computing environment to minimize
    its training and procurement costs. Now that these standards are gaining acceptance,
    software developers are able to develop applications that run on all conforming
    versions of UNIX, Linux, and other operating systems.


    # ## The C Programming Language


    Ken Thompson wrote the UNIX operating system in 1969 in PDP-7 assembly language.
    Assembly language is machine dependent: Programs written in assembly language
    work on only one machine or, at best, one family of machines. The original UNIX
    operating system therefore could not easily be transported to run on other machines
    (it was not portable).


    To make UNIX portable, Thompson developed the B programming language, a machine-independent
    language, from the BCPL language. Dennis Ritchie developed the C programming language
    by modifying B and, with Thompson, rewrote UNIX in C in 1973. The revised operating
    system could be transported more easily to run on other machines.


    That development marked the start of C. Its roots reveal some of the reasons why
    it is such a powerful tool. C can be used to write machine-independent programs.
    A programmer who designs a program to be portable can easily move it to any computer
    that has a C compiler. C is also designed to compile into very efficient code.
    With the advent of C, a programmer no longer had to resort to assembly language
    to get code that would run well (that is, quicklyalthough an assembler will always
    generate more efficient code than a high-level language).


    C is a good systems language. You can write a compiler or an operating system
    in C. It is highly structured but is not necessarily a high-level language. C
    allows a programmer to manipulate bits and bytes, as is necessary when writing
    an operating system. But it also has high-level constructs that allow efficient,
    modular programming.


    In the late 1980s the American National Standards Institute (ANSI) defined a standard
    version of the C language, commonly referred to as *ANSI C* or *C89* (for the
    year the standard was published). Ten years later the C99 standard was published;
    it is mostly supported by the GNU Project''s C compiler (named gcc). The original
    version of the language is often referred to as *Kernighan & Ritchie* (or *K&R*)
    C, named for the authors of the book that first described the C language.


    Another researcher at Bell Labs, Bjarne Stroustrup, created an object-oriented
    programming language named *C++*, which is built on the foundation of C. Because
    object-oriented programming is desired by many employers today, C++ is preferred
    over C in many environments. Another language of choice is Objective-C, which
    was used to write the first Web browser. The GNU Project''s C compiler supports
    C, C++, and Objective-C.'
  merge: -1
  pgno: 33
