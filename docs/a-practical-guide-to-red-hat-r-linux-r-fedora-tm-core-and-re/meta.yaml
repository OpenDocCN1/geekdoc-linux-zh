  md: '# Downloading, Burning, and Installing a CD Set or a DVD (FEDORA)


    You can download and burn Fedora Core CDs. Although you will not get the customer
    support that comes with Red Hat Enterprise Linux, you will not pay Red Hat for
    the software. One of the beauties of free software ([Appendix D](#)) is that it
    is always available for free. Red Hat makes it easy to obtain and use Fedora Core
    by providing ISO images of its CDs online. These files are largealmost 700 megabytes
    eachand there are five of them, so they take days to download using a 56K modem
    and hours using a broadband connection. The DVD ISO more than 3 gigabytes.


    # Tip: You must use 700-megabyte CD-ROM blanks


    When you burn Fedora Core CDs from the ISO images you must use 700-megabyte blanks.
    The smaller 650-megabyte blanks will not work because there is too much data to
    fit on them.


    This section tells you how to find the files you need, download them using a couple
    of different techniques, check that they downloaded correctly, and burn them to
    CDs or a DVD.


    # Finding a Site to Download From


    The Fedora Web site maintains the ISO images you need. Other (mirror) sites also
    maintain these packages. You can use a Web browser or ftp to download the files
    from one of these sites. Alternatively, you can use BitTorrent to download the
    ISO images; see pag[89](#).


    # Tip: You can download and burn the CDs or DVD on any operating system


    You can download and burn the CDs or DVD on any computer that is connected to
    the Internet, has a browser, has enough space on the hard disk to hold the ISO
    files (about 3 gigabytes), and can burn a CD or DVD. If you do not have enough
    space on the hard disk for all five CDs, you can download and burn them one at
    a time (each requires slightly less than 700 megabytes). You can use ftp in place
    of a browser to download the files. For more information refer to "[JumpStart:
    Downloading Files Using ftp](#)" on page [604](#).


    To conserve network bandwidth, try to download from a mirror site that is close
    to you. Failing that, you can download from the Red Hat site.'
  merge: -1
