  md: "Helen's last name is Simpson but might not guess that her username is **hls**.\
    \ The finger utility, which is not case sensitive, can search for information\
    \ on Helen using her first or last name. The following commands find the information\
    \ you seek as well as information on other users whose names are Helen or Simpson:\n\
    \n```\n$ finger HELEN\nLogin: hls                              Name: Helen Simpson.\n\
    ...\n\n$ finger simpson\nLogin: hls                              Name: Helen Simpson.\n\
    ...\n```\n\nSee page 360 for information about usingfinger over a network.\n\n\
    # w: Lists Users on the System\n\nThe w utility displays a list of the users who\
    \ are logged in. As discussed in the section on who, the information that w displays\
    \ is useful when you want to communicate with someone at your installation.\n\n\
    The first column in Figure 5-13 shows that Alex, Jenny, and Scott are logged in.\
    \ The second column shows the designation of the device that each user's terminal\
    \ is connected to. The third column shows the system that a remote user is logged\
    \ in from. The fourth column shows the time when each user logged in. The fifth\
    \ column indicates how long each user has been idle (how much time has elapsed\
    \ since the user pressed a key on the keyboard). The next two columns identify\
    \ how much computer processor time each user has used during this login session\
    \ and on the task that is running. The last column shows the command each user\
    \ is running.\n\n![](bbox=[0.08, 0.49, 0.31, 0.51])\n\n```\n$ w\n 8:20am  up 4\
    \ days, 2:28, 3 users,  load average: 0.04, 0.04, 0.00\nUSER   TTY    FROM   \
    \       LOGIN@  IDLE  JCPU  PCPU  WHAT\nalex   pts/4  :0            5:55am 13:45\
    \ 0.15s 0.07s w\nalex   pts/5  :0            5:55am   27 2:55  1:01  bash\njenny\
    \  pts/7  bravo         5:56am 13:44 0.51s 30s  vim 3.txt\nscott  pts/12 bravo\
    \         7:17pm        1.00s 0:14s run_bdgt\n```\n\nThe first line that the w\
    \ utility displays includes the time of day, the period of time the computer has\
    \ been running (in days, hours, and minutes), the number of users logged in, and\
    \ the load average (how busy the system is). The three load average numbers represent\
    \ the number of jobs waiting to run, averaged over the past 1, 5, and 15 minutes.\
    \ Use the uptime utility to display just this line. Table 5-1 compares the w,\
    \ who, and finger utilities."
  merge: -1
