  md: '# 5. The Linux Utilities


    **IN THIS CHAPTER**


    | | |

    |---|---:|

    | [Special Characters](#) | 126 |

    | [Basic Utilities](#) | 127 |

    | [less Is more: Display a Text File One Screen at a Time](#) | 128 |

