    In the preceding example, partition 4 defines an extended partition that includes
    143 gigabytes of the 165 gigabyte disk (Figure 3-19). You cannot make changes
    to an extended partition without affecting all logical partitions within it.


    In addition to reporting on the layout and size of a disk drive, you can use parted
    interactively to modify the disk layout. Be *extremely* careful when using parted
    in this manner, and always back up the system before starting to work with this
    utility. Changing the partition information (the *partition table*) on a disk
    can destroy the information on the disk. Read the parted info page before modifying
    a partition'
