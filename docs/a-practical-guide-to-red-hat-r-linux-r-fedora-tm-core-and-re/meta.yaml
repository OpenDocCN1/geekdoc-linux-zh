  md: '# head: **Displays the Beginning of a File**


    By default the head utility displays the first ten lines of a file. You can use
    head to help you remember what a particular file contains. For example, if you
    have a file named **months** that lists the 12 months of the year in calendar
    order, one to a line, the head displays **Jan** through **Oct** (Figure 5-5).


    **Figure 5-5. head displays the first ten lines of a file**


    ```

    $ **cat months**

    Jan

    Feb

    Mar

    Apr

    May

    Jun

    Jul

    Aug

    Sep

    Oct

    Nov

    Dec


    $ **head months**

    Jan

    Feb

    Mar

    Apr

    May

    Jun

    Jul

    Aug

    Sep

    Oct

    ```


    This utility can display any number of lines, so you can use it to look at only
    the first line of a file, at a full screen, or even more. To specify the number
    of lines displayed, include a hyphen followed by the number of lines in the head
    command. For example, the following command displays only the first line of **months**:


    ```

    $ **head -1 months**

    Jan

    ```


    The head utility can also display parts of a file based on a count of blocks or
    characters rather than lines. Refer to the head info page for more information.'
  merge: -1
  pgno: 204
- img_proc: false
  md: '# tail: **Displays the End of a File**


    The *tail* utility is similar to *head* but by default displays the *last* ten
    lines of a file. Depending on how you invoke it, this utility can display fewer
    or more than ten lines, use a count of blocks or characters rather than lines
    to display parts of a file, and display lines being added to a file that is changing.
    The following command causes tail to display the last five lines. **Aug** through
    **Dec**, of the **months** file shown in [Figure 5-5](#):


    ```

    $ tail -5 months

    Aug

    Sep

    Oct

    Nov

    Dec

    ```


    You can monitor lines as they are added to the end of the growing file named **logfile**
    with the following command:


    ```

    $ tail -f logfile

    ```


    Press the interrupt key (usually CONTROL-C) to stop tail and display the shell
    prompt. Refer to the *tail* info page for more information.


    # sort: **Displays a File in Order**


    The sort utility displays the contents of a file in order by lines but does not
    change the original file. For example, if a file named *days* contains the name
    of each day of the week in calendar order, each on a separate line, then sort
    displays the file in alphabetical order ([Figure 5-6](#)).


    **Figure 5-6.** sort **displays the lines of a file in order**'
