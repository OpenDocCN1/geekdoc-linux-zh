    to work with files on remote systems as it is to work with local files. With Konqueror,
    you can copy files from or to a remote system, using the same techniques you use
    for copying files locally.


    Because it opens an application within itself, Konqueror makes the process of
    clicking and viewing almost any type of file transparent. Click a PDF (Acrobat)
    file icon within Konqueror, and it opens the file within the Konqueror window.'
