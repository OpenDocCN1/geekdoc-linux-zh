  md: '# Locating Commands


    The whereis and apropos utilities can help you find a command whose name you have
    forgotten or whose location you do not know. When multiple copies of a utility
    or program are present, which tells you which copy you will run. Thelocate utility
    searches for files on the local system.


    # which and whereis: **Locate a Utility**


    When you give Linux a command, the shell searches a list of directories for a
    program with that name and runs the first one it finds. This list of directories
    is called a *search path*. For information on how to change the search path, refer
    to [PATH: Where the Shell Looks for Programs"](#) on page [292](#). If you do
    not change the search path, the shell searches only a standard set of directories
    and then stops searching. Other directories on the system may also contain useful
    utilities, however.


    which


    The which utility locates utilities by displaying the full pathname of the file
    for the utility.[Chapter 6](#) contains more information on pathnames and the
    structure of the Linux filesystem.) The local system may include several commands
    that have the same name. When you type the name of a command, the shell searches
    for the command in your search path and runs the first one it finds. You can find
    out which copy of the program the shell will run by using which. In the following
    example,which reports the location of thetar command:


    ```

    $ which tar

    /bin/tar

    ```


    The which utility can be helpful when a command seems to be working in unexpected
    ways. By runningwhich, you may discover that you are running a nonstandard version
    of a tool or a different one than you expected. ("[Important Standard Directories
    and Files](#)" on page [176](#) provides a list of standard locations for executable
    files.) For example, iftar is not working properly and you find that you are running
    **/usr/local/bin/tar** instead of **/bin/tar**, you might suspect that the local
    version is broken.'
  merge: -1
  pgno: 219
- img_proc: false
  md: '# **Caution:** which, whereis, and builtin commands


    Both the which and whereis utilities report only the names for commands as they
    are found on the disk; they do not report shell builtins (utilities that are built
    into a shell; see page 225). When you use whereis to try to find where the echo
    command (which exists as both a utility program and a shell builtin) is kept,
    you get the following result:


    ```

    $ **whereis echo**

    echo: /bin/echo /usr/share/man/man1/echo.1.gz /usr/share/man/man1p/echo.1p.

    gz /usr/share/man/man3/echo.3x.gz

    ```


    The whereis utility does not display the echo builtin. Even the which utility
    reports the wrong information:


    ```

    $ **which echo**

    /bin/echo

    ```


    Under bash you can use the type builtin (page 927) to determine whether a command
    is a builtin:


    ```

    $ **type echo**

    echo is a shell builtin

    ```


    ![](bbox=[0.146, 0.711, 0.219, 0.729])


    The whereis utility searches for files related to a utility by looking in standard
    locations instead of using your search path. For example, you can find the locations
    for files related to tar:


    ```

    $ **whereis tar**

    tar: /bin/tar /usr/include/tar.h /usr/share/man/man1/tar.1.gz

    ```


    In this example whereis finds three references to tar: the tar utility file, a
    tar header file, and the tar man page.


