  md: '# Special Characters


    Special characters, which have a special meaning to the shell, are discussed in
    [Filename Generation/Pathname Expansion](#) on page [221](#). These characters
    are mentioned here so that you can avoid accidentally using them as regular characters
    until you understand how the shell interprets them. For example, it is best to
    avoid using any of the following characters in a filename (even though emacs and
    some other programs do) because they make the file harder to reference on the
    command line:


    ```

    & ; | * ? '' " ` [ ] ( ) $ < > { } # / \ ! ~

    ```


    Whitespace


    Although not considered special characters, RETURN, SPACE, and TAB also have special
    meanings to the shell. RETURN usually ends a command line and initiates execution
    of a command. The SPACE and TAB characters separate elements on the command line
    and are collectively known as *whitespace* or *blanks*.


    Quoting special characters


    If you need to use a character that has a special meaning to the shell as a regular
    character, you can [quote](#) (or [escape](#)) it. When you quote a special character,
    you keep the shell from giving it special meaning. The shell treats a quoted special
    character as a regular character. However, a slash (/) is always a separator in
    a pathname, even when you quote it.


    Backslash


    To quote a character, precede it with a backslash (\). When two or more special
    characters appear together, you must precede each with a backslash (for example,
    you would enter ** as "\*"). You can quote a backslash just as you would quote
    any other special character by preceding it with a backslash (\\).


    Single quotation marks'
  merge: -1
