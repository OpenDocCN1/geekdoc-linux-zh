  md: '![](bbox=[0.091, 0.056, 0.915, 0.493])


    # Partition the Disk


    The Partition the Disk screen ([Figure 3-3](Figure 3-3)) allows you to specify
    partition information and to select which drives you want to install Red Hat Linux
    on (assuming the system has more than one drive). Specify which drives you want
    to install Linux on in the frame labeled **Select the drive(s) to use for this
    installation**. Anaconda presents the following options in a combo box; click
    the box and then click the choice you want:


    +   - **Remove all partitions on selected drives and create default layout.**
    Deletes all data on the disk and creates a free space the size of the disk to
    work with, as though you were working with a new drive.


    +   - **Remove linux partitions on selected drives and create default layout.**
    Removes all Linux partitions, deleting the data on those partitions and creating
    one or more chunks of *free space* (page [1033](1033)) on the disk. You can create
    new partitions using the free space. If there is only a Linux system on the disk,
    this choice is the same as the previous one.


    +   - **Use free space on selected drives and create default layout.** Installs
    Red Hat Linux in the free space on the disk. Does not work if there is not enough
    free space.


    +   - **Create custom layout.** Does not alter disk partitions. This choice causes
    Anaconda to run Disk Druid (page [58](58)) so that you can preserve the partitions
    you want to keep and overwrite other partitions. It is good for installing Red
    Hat Linux over an existing system where you want to keep */home*, for example,
    but want a clean install and not an upgrade.'
