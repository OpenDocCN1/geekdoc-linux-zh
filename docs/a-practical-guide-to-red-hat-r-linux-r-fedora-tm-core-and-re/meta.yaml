    # parted: Reports on and Partitions a Hard Disk


    The parted (partition editor) utility reports on and manipulates hard disk partitions.
    The following example shows how to use parted from the command line. It uses the
    **print** command to display information about the partitions on the **/dev/hda**
    drive:


    ```

    # /sbin/parted /dev/hda print

    Disk geometry for /dev/hda: 0kB - 165GB

    Disk label type: msdos

    Number  Start   End     Size    Type     File system  Flags

    1       32kB    1045MB  1045MB  primary  ext3         boot

    2       1045MB  12GB    10GB    primary  ext3

    3       12GB    22GB    10GB    primary  ext3

    4       22GB    165GB   143GB   extended

    5       22GB    23GB    1045MB  logical  linux-swap

    6       23GB    41GB    18GB    logical  ext3

    7       41GB    82GB    41GB    logical  ext3

    Information: Don''t forget to update /etc/fstab, if necessary.

    ```


    [Figure 3-19](Figure 3-19) graphically depicts the partitions shown in the example.
    The first line that parted displays specifies the device being reported on (**/dev/hda**)
    and its size (165 gigabytes). The **print** command displays the following columns:'
