  md: 'The initial ls command shows that **memo** is the only file in the directory.
    After the cp command, a second ls shows two files in the directory, **memo** and
    **memo.copy**.


    Sometimes it is useful to incorporate the date in the name of a copy of a file.
    The following example includes the date January 30 (**0130**) in the copied file:


    ```

    $ cp memo memo.0130

    ```


    Although it has no significance to Linux, the date can help you find a version
    of a file that you created on a certain date. Including the date can also help
    you avoid overwriting existing files by providing a unique filename each day.
    For more information refer to "[Filenames](#)" on page 167.


    Use scp (page 583) or ftp (page 601) when you need to copy a file from one system
    to another on a common network.


    # Caution: cp can destroy a file


    If the **destination-file** exists *before* you give a cp command, cp overwrites
    it. Because cp overwrites (and destroys the contents of) an existing **destination-file**
    without warning, you must take care not to cause cp to overwrite a file that you
    still need. The cp **i** (interactive) option prompts you before it overwrites
    a file. See page 105 for a tip on options.


    The following example assumes that the file named **orange.2** exists before you
    give the cp command. The user answers **y** to overwrite the file:


    ```

    $ cp i orange orange.2

    cp: overwrite ''orange.2''? y

    ```


    # mv: Changes the Name of a File


    The mv (move) utility can rename a file without making a copy of it. The mv command
    line specifies an existing file and a new filename using the same syntax as cp:


    > *mv* **existing-filename new-filename**


    The command line in [Figure 5-3](#) changes the name of the file memo to **memo.0130**.
    The initial ls command shows that **memo** is the only file in the directory.
    After you give the mv command, **memo.0130** is the only file in the directory.
    Compare this result to that of the earlier cp example.


    **Figure 5-3.** mv **renames a file**


    ```

    $ ls

    ```'
