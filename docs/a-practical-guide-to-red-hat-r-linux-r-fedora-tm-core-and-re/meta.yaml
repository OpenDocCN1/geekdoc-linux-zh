    # A Practical Guide to Red Hat® Linux®, Third Edition: Fedora™ Core and Red Hat
    Enterprise Linux


    By Mark G. Sobell


    ..............................................


    Publisher: **Prentice Hall**


    Pub Date: **June 27, 2006**


    Print ISBN-10: **0-13-228027-2**


    Print ISBN-13: **978-0-13-228027-3**


    Pages: **1168**


    Table of Contents | Index


    # Overview


    > "Since I''m in an educational environment, I found the content of Sobell''s
    book to be right on target and very helpful for anyone managing Linux in the enterprise.
    His style of writing is very clear. He builds up to the chapter exercises, which
    I find to be relevant to real-world scenarios a user or admin would encounter.
    An IT/IS student would find this book a valuable complement to their education.
    The vast amount of information is extremely well balanced and Sobell manages to
    present the content without complicated asides and meandering prose. This is a
    ''must have'' for anyone managing Linux systems in a networked environment or
    anyone running a Linux server. I would also highly recommend it to an experienced
    computer user who is moving to the Linux platform." *Mary Norbury, IT Director,
    Barbara Davis Center/University of Colorado at Denver, from a review posted on
    slashdot.org*


    > "I had the chance to use your UNIX books when I when was in college years ago
    at Cal Poly San Luis Obispo, CA. I have to say that your books are among the best!
    They''re quality books that teach the theoretical aspects and applications of
    the operating system." *Benton Chan, IS Engineer*


    > "The book has more than lived up to my expectations from the many reviews I
    read, even though it targets FC2. I have found something very rare with your book:
    It doesn''t read like the standard a technical text, it reads more like a story.
    It''s a pleasure to read and hard to put down. Did I say that?! :-)" *David Hopkins,
    Business Process Architect*


    > "Thanks for your work and for the book you wrote. There are really few books
    that can help people to become more efficient administrators of different workstations.
    We hope (in Russia) that you will continue bringing us a new level of understanding
    of Linux/UNIX systems." *Anton Petukhov*


    > "Mark Sobell has written a book as approachable as it is authoritative." *Jeffrey
    Bianchine, Advocate, Author, Journalist*


    > "Excellent reference book, well suited for the sysadmin of a Linux cluster,
    or the owner of a PC contemplating installing a recent stable Linux. Don''t be
    put off by the daunting heft of the book. Sobell has striven to be as inclusive
    as possible, in trying to anticipate your system administration needs." *Wes Boudville,
    Inventor*


    > "*A Practical Guide to Red Hat® Linux®* is a brilliant book. Thank you Mark
    Sobell."*C. Pozrikidis, University of California at San Diego*


    > "This book presents the best overview of the Linux operating system that I have
    found. . . . It should be very helpful and understandable no matter what the reader''s
    background is: traditional UNIX user, new Linux devotee, or even Windows user.
    Each topic is presented in a clear, complete fashion and very few assumptions
    are made about what the reader knows. . . . The book is extremely useful as a
    reference, as it contains a 70-page glossary of terms and is very well indexed.
    It is organized in such a way that the reader can focus on simple tasks without
    having to wade through more advanced topics until they are ready." *Cam Marshall,
    Marshall Information Service LLC, Member of Front Range UNIX Users Group FRUUG,
    Boulder, Colorado*


    > "Conclusively, this is THE book to get if you are a new Linux user and you just
    got into RH/Fedora world. There''s no other book that discusses so many different
    topics and in such depth." *Eugenia Loli-Queru, Editor in Chief, OSNews.com*


    ***The Best Just Became BETTERAgain!Completely Revised to Meet All Your Fedora
    Core and Red Hat Enterprise Linux Needs!***


    Fedora Core and Red Hat Enterprise Linux are advanced operating systems. You need
    a book that''s just as advanced. This book explains Linux clearly and effectivelywith
    a focus on features you care about, from system security and Internet server setup
    to Windows file/printer sharing. Best-selling author Mark Sobell starts at the
    beginning and walks you through everything that matters, from installing Linux
    using the included DVD to working with GNOME, KDE, Samba, **sendmail**, Apache,
    DNS, NIS, and**iptables**.'
  merge: -1
  pgno: 0
- img_proc: false
  md: 'This edition contains extensive coverage, including full chapters on using
    Linux from the command line and GUI; even more thorough system administration
    and security guidance; and up-to-the-minute, step-by-step instructions for setting
    up networks and every major type of Internet server. Along the way, you learn
    the "hows" *and* the "whys." Mark Sobell knows every Linux nook and cranny, has
    taught hundreds of thousands of readers, and never forgets what it''s like to
    be new to Linux. Whether you are a user, an administrator, or a programmer, this
    book gives you all you needand more.


    **Don''t settle for yesterday''s Linux book...get the ONLY book that meets today''s
    challenges and** ***tomorrow''s!***


    Compared with the other Linux books out there***A Practical Guide to Red Hat®
    Linux®, Third Edition***delivers...


    +   - Complete coverage of Fedora Core and Red Hat Enterprise Linux

    - Deeper coverage of the command line and the GNOME and KDE GUIs, including GUI
    customization

    - More practical coverage of file sharing with Samba, NFS, and FTP

    - More detailed, usable coverage of Internet server configuration including Apache**sendmail**,
    NFS, and DNS/BIND

    - More state-of-the-art security techniques, including SELinux (Security Enhanced
    Linux), ACLs (Access Control Lists), firewall setup using the Red Hat GUI and
    using **iptables**, and a full chapter on OpenSSH

    - More and better coverage of "meat-and-potatoes" system/network administration
    tasks

    - A more practical introduction to writing**bash** shell scripts

    - Complete instructions on how to keep your Linux system up-to-date using**yum**

    - And much more...including a 500+ term glossary and a comprehensive index to
    help you find what you need fast!


    **Includes DVD!** Get the full version of Red Hat''s Fedora Core 5 release!


