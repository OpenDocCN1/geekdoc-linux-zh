    # Add a new partition


    To add a new partition to a hard disk, the hard disk must have enough free space
    to accommodate the partition. Click the **New** button to add a partition; Disk
    Druid displays the Add Partition window ([Figure 3-13](#)). Specify the mount
    point (the name of the directory that the partition will be mounted over [page
    466]) and the filesystem type; use the arrow buttons at the right end of these
    text boxes to display drop-down menus of choices. If there is more than one drive,
    put a check mark in the box next to the drive you want the partition to be created
    on in the Allowable Drives frame. Specify the size of the partition and, in the
    Additional Size Options frame, mark **Fixed size** to create the partition close
    to the size you specify. Because of block-size constraints, partitions are not
    usually exactly the size you specify. Mark **Fill all space up to (MB)** and fill
    in the maximum size you want the partition to be to create a partition that takes
    up the existing free space, up to the maximum size you specify. In other words,
    Disk Druid does not complain if it cannot create the partition as large as you
    would like. Mark the third choice, **Fill to maximum allowable size**, to cause
    the partition to occupy all the remaining free space on the disk, regardless of
    size. (If you create another partition after creating a **Fill to maximum allowable
    size** partition, the new partition will pull blocks from the existing maximum
    size partition.) Put a check mark in the box labeled **Force to be a primary partition**
    to create a primary partition. Click **OK**, and Disk Druid adds the partition
    to its table (but does not write to the hard disk).


