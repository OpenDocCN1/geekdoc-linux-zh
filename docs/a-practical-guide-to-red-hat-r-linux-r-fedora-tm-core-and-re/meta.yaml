  md: '# Platforms


    Linux is not just for Intel-based platforms: It has been ported to and runs on
    the Power PCincluding Apple computers (ppclinux), Compaq''s (née Digital Equipment
    Corporation) Alpha-based machines, MIPS-based machines, Motorola''s 68K-based
    machines, various 64-bit systems, and IBM''s S/390. Nor is Linux just for single-processor
    machines: As of version 2.0, it runs on multiple-processor machines (SMPs). It
    also includes an O(1) scheduler, which dramatically increases scalability on SMP
    systems.


    # Emulators


    Linux supports programs, called *emulators*, that run code intended for other
    operating systems. By using emulators you can run some DOS, Windows, and Macintosh
    programs under Linux. Wine (www.winehq.com) is an open-source implementation of
    the Windows API on top of the X Window System and UNIX/Linux; QEMU (fabrice.bellard.free.fr/qemu)
    is a CPU-only emulator that executes x86 Linux binaries on non-x86 Linux systems.


    # Xen


    Xen, which was created at the University of Cambridge and is now being developed
    in the open-source community, is an open-source virtual machine monitor (VMM).
    A VMM enables several virtual machines (VMs), each running an instance of a separate
    operating system, to run on a single computer. Xen isolates the VMs so that if
    one crashes it does not affect any of the others. In addition, Xen introduces
    minimal performance overhead when compared with running each of the operating
    systems natively.


    Using VMs, you can experiment with cutting-edge releases of operating systems
    and applications without concern for the base (stable) system, all on a single
    machine. You can also set up and test networks of systems on a single machine.
    Xen presents a *sandbox*, an area (system) that you can work in without regard
    for the results of your work or for the need to clean up.


    Fedora Core 5 includes Xen 3.0. This book does not cover the installation or use
    of Xen. See www.fedoraproject.org/wiki/FedoraXenQuickstartFC5 for installation
    instructions.


    For more information on Xen, refer to the wiki at wiki.xensource.com/xenwiki and
    the Xen home page at www.cl.cam.ac.uk/Research/SRG/netos/xen.


    # Why Linux Is Popular with Hardware Companies and Developers


    Two trends in the computer industry set the stage for the popularity of UNIX and
    Linux. First, advances in hardware technology created the need for an operating
    system that could take advantage of available hardware power. In the mid-1970s,
    minicomputers began challenging the large mainframe computers because, in many
    applications, minicomputers could perform the same functions less expensively.
    More recently, powerful 64-bit processor chips, plentiful and inexpensive memory,
    and lower-priced hard disk storage have'
  merge: -1
  pgno: 31
- img_proc: false
  md: 'allowed hardware companies to install multiuser operating systems on desktop
    computers.


    # Proprietary operating systems


    Second, with the cost of hardware continually dropping, hardware manufacturers
    could no longer afford to develop and support proprietary operating systems. A
    *proprietary* operating system is written and owned by the manufacturer of the
    hardware (for example, DEC/Compaq owns VMS). Today''s manufacturers need a generic
    operating system that they can easily adapt to their machines.


    # Generic operating systems


    A *generic* operating system is written outside of the company manufacturing the
    hardware and is sold (UNIX, Windows) or given (Linux) to the manufacturer. Linux
    is a generic operating system because it runs on different types of hardware produced
    by different manufacturers. Of course, if manufacturers can pay only for development
    and avoid per-unit costs (as they have to pay to Microsoft for each copy of Windows
    they sell), manufacturers are much better off. In turn, software developers need
    to keep the prices of their products down; they cannot afford to convert their
    products to run under many different proprietary operating systems. Like hardware
    manufacturers, software developers need a generic operating system.


    Although the UNIX system once met the needs of hardware companies and researchers
    for a generic operating system, over time it has become more proprietary as each
    manufacturer added support for specialized features and introduced new software
    libraries and utilities.


    Linux emerged to serve both needs. It is a generic operating system that takes
    advantage of available hardware power.


    # Linux Is Portable


    A *portable* operating system is one that can run on many different machines.
    More than 95 percent of the Linux operating system is written in the C programming
    language, and C is portable because it is written in a higher-level, machine-independent
    language. (The C compiler is written in C.)


    Because Linux is portable, it can be adapted (ported) to different machines and
    can meet special requirements. For example, Linux is used in embedded computers,
    such as the ones found in cellphones, PDAs, and the cable boxes on top of many
    TVs. The file structure takes full advantage of large, fast hard disks. Equally
    important, Linux was originally designed as a multiuser operating systemit was
    not modified to serve several users as an afterthought. Sharing the computer''s
    power among many users and giving them the ability to share data and programs
    are central features of the system.


    Because it is adaptable and takes advantage of available hardware, Linux runs
    on many different microprocessor-based systems as well as mainframes. The popularity
    of the microprocessor-based hardware drives Linux; these microcomputers are getting
    faster all the time, at about the same price point. Linux on a fast microcomputer
    has become good enough to displace workstations on many desktops. Linux benefits
    both users, who do not like having to learn a new operating system for each vendor''s
    hardware, and system administrators, who like having a consistent software environment.


    The advent of a standard operating system has aided the development of the software
    industry. Now software manufacturers can afford to make one version of a product
    available on machines from different manufacturers.'
