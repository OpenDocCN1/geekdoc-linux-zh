    # Details


    # Part I


    [Part I](.), "Installing Red Hat Linux," discusses how to install Fedora Core
    or Red Hat Enterprise Linux.[Chapter 2](.) presents an overview of the process
    of installing Red Hat Linux, including hardware requirements, downloading and
    burning a DVD or CDs, and planning the layout of the hard disk. [Chapter 3](.)
    is a step-by-step guide to installing either version of Red Hat Linux and covers
    installing from a DVD or CDs, from a local hard disk, and over the network using
    FTP, NFS, or HTTP. It also shows how to set up the X Window System and customize
    your graphical user interface (GUI).


    # Part II


    [Part II](.), "Getting Started with Red Hat Linux," familiarizes you with Red
    Hat Linux, covering logging in, the GUI, utilities, the filesystem, and the shell.
    [Chapter 4](.) introduces desktop features, including the panel and the Main menu;
    explains how to use Konqueror to manage files, run programs, and browse the Web;
    and covers finding documentation, dealing with login problems, and using the window
    manager. [Chapter 5](.) introduces the shell command line interface, describes
    more than 30 useful utilities, and presents a tutorial on the vim text editor.
    [Chapter 6](.) discusses the Linux hierarchical filesystem, covering files, filenames,
    pathnames, working with directories, access permissions, and hard and symbolic
    links. [Chapter 7](.) introduces the Bourne Again Shell (bash) and discusses command
    line arguments and options, redirecting input to and output from commands, running
    programs in the background, and using the shell to generate and expand filenames.'
