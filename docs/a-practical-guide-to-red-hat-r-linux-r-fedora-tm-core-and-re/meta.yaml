    # ## RAID


    RAID (Redundant Array of Inexpensive/Independent Disks) employs two or more hard
    disk drives or partitions in combination to improve fault tolerance and/or performance.
    Applications and utilities see these multiple drives/partitions as a single logical
    device. RAID, which can be implemented in hardware or software (Red Hat gives
    you this option), spreads data across multiple disks. Depending on which level
    you choose, RAID can provide data redundancy to protect data in the case of hardware
    failure. Although it can also improve disk performance by increasing read/write
    speed, RAID uses quite a bit of CPU time, which may be a consideration in some
    situations. Fedora Core 5 introduced support for motherboard-based RAID chips
    through the **dmraid** driver set.


    # ### Caution: Do not replace backups with RAID


    Do not use RAID as a replacement for regular backups. If your system undergoes
    a catastrophic failure, RAID will be useless. Earthquake, fire, theft, and other
    disasters may leave the entire system inaccessible (if your hard disks are destroyed
    or missing). RAID also does not take care of something as simple as replacing
    a file when you delete it by accident. In these cases, a backup on a removable
    medium (that has been removed) is the only way you will be able to restore a filesystem.


    Disk Druid gives you the choice of implementing RAID level 0, 1, 5, or 6:


    +   - **RAID level 0 (striping)** Improves performance but offers no redundancy.
    The storage capacity of the RAID device is equal to that of the member partitions
    or disks.

    - **RAID level 1 (mirroring)** Provides simple redundancy, improving data reliability,
    and can improve the performance of read-intensive applications. The storage capacity
    of the RAID device is equal to one of the member partitions or disks.

    - **RAID level 5 (disk striping with parity)** Provides redundancy and improves
    (most notably, read) performance. The storage capacity of the RAID device is equal
    to that of the member partitions or disks, minus one of the partitions or disks
    (assuming they are all the same size).

    - **RAID level 6 (disk striping with double parity)** Improves upon level 5 RAID
    by protecting data when two disks fail at once. Level 6 RAID is inefficient with
    a small number of drives.


    # ## LVM: Logical Volume Manager'
  merge: -1
