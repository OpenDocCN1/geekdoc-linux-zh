  md: '# # The Heritage of Linux: UNIX


    The UNIX system was developed by researchers who needed a set of modern computing
    tools to help them with their projects. The system allowed a group of people working
    together on a project to share selected data and programs while keeping other
    information private.


    Universities and colleges played a major role in furthering the popularity of
    the UNIX operating system through the "four-year effect." When the UNIX operating
    system became widely available in 1975, Bell Labs offered it to educational institutions
    at nominal cost. The schools, in turn, used it in their computer science programs,
    ensuring that computer science students became familiar with it. Because UNIX
    was such an advanced development system, the students became acclimated to a sophisticated
    programming environment. As these students graduated and went into industry, they
    expected to work in a similarly advanced environment. As more of them worked their
    way up the ladder in the commercial world, the UNIX operating system found its
    way into industry.


    In addition to introducing students to the UNIX operating system, the Computer
    Systems Research Group (CSRG) at the University of California at Berkeley made
    significant additions and changes to it. In fact, it made so many popular changes
    that one version of the system is called the Berkeley Software Distribution (BSD)
    of the UNIX system (or just Berkeley UNIX). The other major version is UNIX System
    V (SVR4), which descended from versions developed and maintained by AT&T and UNIX
    System Laboratories.'
  merge: -1
  pgno: 29
- img_proc: false
  md: '# What Is So Good About Linux?


    In recent years Linux has emerged as a powerful and innovative UNIX work-alike.
    Its popularity is surpassing that of its UNIX predecessors. Although it mimics
    UNIX in many ways, the Linux operating system departs from UNIX in several significant
    ways: The Linux kernel is implemented independently of both BSD and System V,
    the continuing development of Linux is taking place through the combined efforts
    of many capable individuals throughout the world, and Linux puts the power of
    UNIX within easy reach of business and personal computer users. Using the Internet,
    today''s skilled programmers submit additions and improvements to the operating
    system to Linus Torvalds, GNU, or one of the other authors of Linux.


    Applications


    A rich selection of applications is available for Linuxboth free and commercialas
    well as a wide variety of tools: graphical, word processing, networking, security,
    administration, Web server, and many others. Large software companies have recently
    seen the benefit in supporting Linux and now have on-staff programmers whose job
    it is to design and code the Linux kernel, GNU, KDE, or other software that runs
    on Linux. For example, IBM [www.ibm.com/linux](www.ibm.com/linux) is a major Linux
    supporter. Linux conforms increasingly more closely to POSIX standards, and some
    distributions and parts of others meet this standard. (See "Standards" on page
    8 for more information.) These developments mean that Linux is becoming more mainstream
    and is respected as an attractive alternative to other popular operating systems.


    Peripherals


    Another aspect of Linux that appeals to users is the amazing range of peripherals
    that is supported and the speed with which support for new peripherals emerges.
    Linux often supports a peripheral or interface card before any company does. Unfortunately
    some types of peripheralsparticularly proprietary graphics cardslag in their support
    because the manufacturers do not release specifications or source code for drivers
    in a timely manner, if at all.


    Software


    Also important to users is the amount of software that is availablenot just source
    code (which needs to be compiled) but also prebuilt binaries that are easy to
    install and ready to run. These include more than free software. Netscape, for
    example, has been available for Linux from the start and included Java support
    before it was available from many commercial vendors. Now its sibling Mozilla/Thunder-bird/Firefox
    is also a viable browser, mail client, and newsreader, performing many other functions
    as well.'
  merge: -1
