    \nThe **ScreenNumber** is optional. If it is omitted, X numbers screens in the\
    \ order they are specified, starting with 0. The *Identifier* is the same Identifier\
    \ used in the Screen sections. The **Position** can be either absolute or relative.\
    \ The easiest way to define screen positions is to give one screen an absolute\
    \ position, usually with the coordinates of the origin, and then use the **LeftOf**,\
    \ **RightOf**, **Above**, and **Below** keywords to indicate the positions of\
    \ the other screens:"
