    # HOWTOs: Finding Out How Things Work


    A HOWTO document explains in detail how to do something related to Linuxfrom setting
    up a specialized piece of hardware to performing a system administration task
    to setting up specific networking software. Mini-HOWTOs offer shorter explanations.
    As with Linux software, one person or a few people generally are responsible for
    a HOWTO document, but many people may contribute to it.


    The Linux Documentation Project (LDP, page [110](#)) site houses most HOWTO and
    mini-HOWTO documents. Use a browser to go to [www.tldp.org](http://www.tldp.org),
    click **HOWTOs**, and pick the index you want to use to find a HOWTO or mini-HOWTO.
    You can also use the LDP search feature on its home page to find HOWTOs and more.


    # Getting Help with the System


    KDE and GNOME provide similar Help facilities. Each provides tooltips (page [86](#)),
    a context-sensitive Help system, and the Help systems discussed on pages [102](#)
    and [103](#).


    # Finding Help Locally


    The **/usr/src/linux/Documentation** (present only if you installed the kernel
    source code as explained in [Chapter 15](#)) and **/usr/share/doc** directories
    often contain more detailed and different information about a utility than man
    or info provides. Frequently this information is meant for people who will be
    compiling and modifying the utility, not just using it. These directories hold
    thousands of files, each containing information on a separate topic.


    # Using the Internet to Get Help


    The Internet provides many helpful sites related to Linux. Aside from sites that
    carry various forms of documentation, you can enter an error message that you
    are having a problem with in a search engine such as Google ([www.google.com](http://www.google.com),
    or its Linux-specific version at [www.google.com/linux](http://www.google.com/linux)).
    Enclose the error message within double quotation marks to improve the quality
    of the results. The search will likely yield a post concerning your problem and
    suggestions about how to solve it. See [Figure 4-27](#) on the next page.'
  merge: -1
