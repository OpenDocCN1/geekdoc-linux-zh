  md: "+   - Although parted can create some types of filesystems, it is usually easiest\
    \ to useparted to create partitions and then use mkfs and mkswap to create filesystems\
    \ on the partitions.\n\nThe following sequence of commands defines a 300-megabyte,\
    \ bootable, Linux partition as partition 1 on a clean disk:\n\n```\n# /sbin/parted\
    \ /dev/hdb\n...\nUsing /dev/hdb\n(parted) mkpart                             \
    \    (create new partition)\nPartition type? primary/extended? primary       (select\
    \ primary partition)\nFile system type? [ext2]?                       (default\
    \ to an ext2 filesystem)\nStart? 1                                        (start\
    \ at the beginning of the disk)\nEnd? 300m                                   \
    \    (specify a 300-megabyte partition)\n(parted) help set                   \
    \            (use help to check the syntax of the set command)\n set NUMBER FLAG\
    \ STATE      change a flag on partition NUMBER\n\n     NUMBER is the partition\
    \ number used by Linux.  On msdos disk labels, the primary\n     partitions number\
    \ from 1 to 4, logical partitions from 5 onwards.\n     FLAG is one of: boot,\
    \ root, swap, hidden, raid, lvm, lba, hp-service, palo,\n     prep, msftres\n\
    \     STATE is one of: on, off\n\n(parted) set 1 boot on                     \
    \     (turn on the boot flag on partition 1)\n(parted) print                 \
    \                 (verify that the partition is correct)\nDisk geometry for /dev/hdb:\
    \ 0kB - 250GB\nDisk label type: msdos\nNumber  Start  End   Size  Type     File\
    \ system  Flags\n1       1kB    300MB 300MB primary  ext2         boot\n(parted)\
    \ quit\nInformation: Don't forget to update /etc/fstab, if necessary.\n```\n\n\
    When you specify a size within parted, you can use a suffix of **k** (kilobytes),\
    \ **m** (megabytes), or **g** (gigabytes). After creating a partition give a **print**\
    \ command to see where the partition ends. Perform this task before defining the\
    \ next contiguous partition so that you do not waste space or have any overlap.\
    \ After setting up all the partitions, exit from parted with a **quit** command.\n\
    \nNext, make a filesystem (mkfs, page [419](#)) on each partition that is to hold\
    \ a filesystem (not swap). Make all partitions, except swap and **/boot**, type\
    \ **ext3**, unless you have a reason to do otherwise. Make the **/boot** partition\
    \ type **ext2**. Use mkswap (page [458](#)) to set up a swap area on a partition.\
    \ You can use e2label (page [418](#)) to label a partition.\n\n# ## Setting Up\
    \ a Dual-Boot System\n\nA dual-boot system is one that can boot one of two operating\
    \ systems. In this section, *dual-boot* refers to a system that can boot Windows\
    \ or Linux. The biggest problem in setting up a dual-boot system, assuming you\
    \ want to add Linux to a Windows system, is finding enough disk space for Linux.\
    \ The *Linux+WindowsNT mini-HOWTO* covers installing Linux first and Windows NT\
    \ second (or the other way around). The next section discusses several ways to\
    \ create the needed space.\n\n# ## Creating Free Space on a Windows System\n\n\
    Typically you install Red Hat Linux in free space on a hard disk. To add Red Hat\
    \ Linux to a Windows system, you must provide enough free space (refer to \"[Hard\
    \ disk space](#)\" on page [26](#)) on a hard disk that already contains Windows.\
    \ There are several ways to provide or create this free space. The following ways\
    \ are ordered from easiest to most difficult:"
