  md: '# Tutorial: Creating and Editing a File with vim


    This section explains how to start vim, enter text, move the cursor, correct text,
    save the file to the disk, and exit from vim. The tutorial discusses three of
    the modes of operation of vim and explains how to switch from one mode to another.


    vimtutor


    In addition to working with this tutorial, you may want to try vim''s tutor, named
    vimtutor. Give its name as a command to run it.


    Specifying a terminal


    Because vim takes advantage of features that are specific to various kinds of
    terminals, you must tell it what type of terminal or terminal emulator you are
    using. On many systems, and usually when you work on a terminal emulator, your
    terminal type is set automatically. If you need to specify your terminal type
    explicitly, refer to "Specifying a Terminal" on page 984.


    # Starting vim


    Start vim with the following command line to create and edit a file named practice:


    $ vim practice


    When you press RETURN, the command line disappears, and the screen looks similar
    to the one shown in Figure 5-16.


    Figure 5-16. Starting vim


    [View full size image]'
  merge: -1
  pgno: 230
