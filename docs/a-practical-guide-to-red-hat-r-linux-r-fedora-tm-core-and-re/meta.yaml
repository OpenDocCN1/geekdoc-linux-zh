  md: '# # Chapter Summary


    The Linux operating system grew out of the UNIX heritage to become a popular alternative
    to traditional systems (that is, Windows) available for microcomputer (PC) hardware.
    UNIX users will find a familiar environment in Linux. Distributions of Linux contain
    the expected complement of UNIX utilities, contributed by programmers around the
    world, including the set of tools developed as part of the GNU Project. The Linux
    community is committed to the continued development of this system. Support for
    new microcomputer devices and features is added soon after the hardware becomes
    available, and the tools available on Linux continue to be refined. With many
    commercial software packages available to run on Linux platforms and many hardware
    manufacturers offering Linux on their systems, it is clear that the system has
    evolved well beyond its origin as an undergraduate project to become an operating
    system of choice for academic, commercial, professional, and personal use.'
  merge: -1
