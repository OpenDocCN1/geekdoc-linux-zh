    # 02 Hop between speakers and phones


    This is the common case for laptops, where sound is played through 3.5mm jack,
    and once you plug in it is transferred to headphones. Modern Linux systems do
    this automatically, but if they fail (or you need something better), you can control
    everything. PulseAudio means one can have multiple ports. To find out the currently
    used one, look for something like:


    ![](img/f7324b6b514ca3a11b9cc564b062e918_108_1.png)


    > ''Active Port: analog-output-speaker''


    We also know the names of the other ports, so we can manually switch sound back
    to headphones, like this:


    ```

    # 3 pactl set-sink-port ''analog_output-pci-0000_00_0.analog-stereo'' ''analog-output''

    ```


    The same is true for sources: when you record your voice in Skype, you should
    definitely make sure that the corresponding source is a correct port for capturing
    sound.


    # 03 Manage volume


    PulseAudio uses a simple range from 0 to 65536 to manage volume, where 0 is muted
    and 65536 is loud volume. The trick is, however, that you can go beyond 100% and
    boost the volume further, without using any third-party tools like VLC. Let''s
    see some examples for the default:


    doing some overdrive


    And finally, let''s get in:


    ```

    # pactl set-sink-volume ''1'' +125%

    ```


    If you need to set different values for inputs inside one sink, you might want
    to turn off the so-called ''flat volume'' setting, which limits maximum volume
    for a sink. This is a simple procedure to carry out:


    +   * * pactl set-sink-volume ''1'' 65535 # 100%

    * * pactl set-sink-volume ''1'' 78642 # 120%

    * * pactl set-sink-volume ''1'' 98304 # 150%


    ```

    # echo "flat-volume = no" >> /etc/pulse/daemon.conf

    # daemon.conf

    ```


    # Go beyond the bands


    PulseAudio introduces client-server design, which means that your sound can be
    spread across a network. This is useful for a remote device - it could include
    other things like broadcasting over IP. You can set up PulseAudio with the headset
    to connect to your server.


