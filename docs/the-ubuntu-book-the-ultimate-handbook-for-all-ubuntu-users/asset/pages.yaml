    +   - One of the most things about any Linux-based computer is probable that files
    and folders serve many different purposes. To a beginner getting started with
    Linux it looks like a huge tree. This is for a basic, better understanding of
    how files and folders are organised in Linux, specifically Ubuntu. This is what
    we are going to do in this guide. Let''s start with the basics.


    Ubuntu (like Linux) organizes files in a hierarchical tree, where relationships
    are those of children and parent. Directories can contain other directories as
    files. Every file has an absolute or relative path. An absolute path name starts
    with a character ''/'' (identifying the root directory, which contains all other
    directories and files), every directory must be traversed to reach the location


    is listed, each by a name. A relative path name that does not start with ''/''
    in that case the directory tree is traversed from a given point, which depends
    on context, called the fact that there is a common root, even if several directories
    are seen in the tree, once they are mounted to the desired place.


