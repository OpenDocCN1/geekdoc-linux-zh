  md: '# # Get started with Ubuntu


    Because of its free, open source and user-friendly nature, Ubuntu has gained a
    lot of momentum in recent times. No wonder so many software developers are using
    it for their projects


    ![](img/f7324b6b514ca3a11b9cc564b062e918_7_0.png)


    Ubuntu is a free, user-friendly Linux-based operating system that has found its
    place in every corner of the world. The best thing about Ubuntu is that it is
    absolutely free, including its future updates. Another thing that makes Ubuntu
    so popular is that you can install it on computers that are three to four years
    old, yet still runs smoothly. Ubuntu is the most widely used Linux distribution
    in the cloud. Consider Ubuntu as a complete desktop operating system that is freely
    available - with both community and professional support. It can be noted that
    Ubuntu is suitable for both desktop and


    server-side. These are just some of the features that make Ubuntu the best operating
    system to go for in the developer community...


    **Ubuntu is everywhere** – Almost all computer manufacturers are shipping models
    based on Ubuntu which is why you can use Ubuntu everywhere.


    **Ubuntu is well supported** – Few other kind of love and support as Ubuntu. Considering
    the money and effort involved in developing, it becomes more important to provide
    long-term support when it comes to open source projects.


    **Ubuntu is easy to use**–It''s easy to pick up and use, even if you come from
    a Windows background. Users don''t need to do anything when booting Ubuntu for
    the first time.


    **Ubuntu is pretty stable** – For most users, Ubuntu is just tweaked and fixed
    all the time. Since all the latest packages are not integrated during the development
    cycle, it also helps in preventing potential errors.


    Looking at the above features, it''s no surprise the rest of this feature, and
    it will cover various aspects that Ubuntu is so popular. We will go into more
    detail during the rest of the book which will be great to help new Ubuntu users.


    +   The Ubuntu Book'
