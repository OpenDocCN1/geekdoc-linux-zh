  md: '# Understanding the file system


    # # Tutorial Learn folders and their organisation


    ![](img/f7324b6b514ca3a11b9cc564b062e918_36_0.png)


    # ## 03 Various directories under/


    Let us see now the important directories present under the root directory and
    get an idea of which one serves purpose.


    +   - /bin is a place for most commonly used terminal commands, such as ls, mount,
    etc.


    +   - /boot contains all files needed to start the system, including the Linux
    kernel, a RAM disk image and bootloader configuration files.


    +   - /dev contain device files, which are not regular files but instead refer
    to hardware devices on the system, including hard drives.


    +   - /etc contains system-configuration files, which affect the system''s behaviour
    for users.


    +   - /home is the place for users'' home directories.


    +   - /lib contains important dynamic libraries and kernel modules.


    +   - /media is inserted as a mount point for external devices, such as hard drives
    or removable media (CDs, DVDs, etc.).


    +   - /mnt is also a place for mount points, but specifically to ''temporarily
    mounted devices such as network file systems.


    +   - /opt can be used to store additional software for which system is not handled
    by the package manager.


    +   - /proc is a virtual file system that provides a mechanism for the kernel
    to expose information to processes.


    +   - /root is the superuser'' home directory; it''s not in /home to allow booting
    the system if /home is not available.


    +   - /run is a temporary file system available early in the boot process where
    ephemeral run data is stored. Files within this directory are removed or truncated
    at the end of the boot process.


    +   - /sbin contains administrative commands that should only be employed by the
    supervisor.


    +   - /srv can contain data directories of services such as HTTP (/www/) or FTP.


    +   - /var is a virtual file system that can be accessed to obtain or insert about
    the kernel''s view of the system.


    +   - /tmp is a place for temporary files used by applications.


    +   - /usr contains the majority of user applications, and partly replicates the
    root directory structure, containing for instances, others /usr/bin and /usr/lib.


    +   - /var is declared to store variable data, such as logs, databases, and temporary
    spool (mail spool) etc that persist from one boot to the next. A directory it
    contains /var/log, where system log files are kept.


    # ## 01 File hierarchy standard


    The Ubuntu system is based on the Filesystem Hierarchy Standard (FHS). The latter
    defines the main directories and their contents in Linux systems. For most, it
    is a formalisation and extension of the BSD system hierarchy. The Linux Foundation
    - a non-profit organization consisting of major software and hardware vendors,
    such as HP, Red Hat, IBM and Dell - maintains the current FHS version, 3.0, released
    on 3 June 2015.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_36_1.png)


    # ## 02 The root directory


    All Unix abstracts the nature of tree hierarchy, and the root directory is all
    of them in the Ubuntu hierarchy, indicated by the / sign; the root directory contains
    all the folders. The root directory is conventionally referred to as */; the root
    entry itself has no name - the name is the part following the initial separator
    (/). All file system entries, including mounted files, are ''branches'' of the
    root. It is because all systems start with / even if there are several physical
    or virtual storage attached to your computer, all the folders will be under the
    root directory.


    Note that this is not to be confused with the /root directory that is the home
    directory for the root users.


    The Ubuntu 37'
