    03 Delete the partition

    Manufacturers of sticks tend to allocate the entire storage of the device to one
    large partition. This is used to also store very large files with minimal effort
    (and without a trip to GParted).

    Sadly, the scanner you detected has issues with large partitions of the USB. However,
    if you have an advanced file system, the scanner''s firmware addresses. This problem
