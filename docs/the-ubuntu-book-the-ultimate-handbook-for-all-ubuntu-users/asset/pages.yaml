  md: '# # Ubuntu essentials


    # # Configure Network Connections


    # ## Setting up a network connection in Ubuntu is easy


    Those who need to plug their Ethernet cable into their computer''s network port
    in order to have an instant access to the internet can skip this (perforation)
    while running Ubuntu inside a virtual environment that can do that, the majority
    of Linux networks, however,


    often need assistance in connecting to the Internet or changing your network parameters.
    During the last decade, every Linux distribution has relied on NetworkManager
    — a stable, feature-rich and intuitive network manager for Linux. It has a tight
    integration with NetworkManager by


    a network indicator on the top bar and a standalone graphical utility called Network.
    You can search for it in Dash, open it as a window in System Settings or launch
    from command line with network settings. Wired and wireless network connections
    can be added or removed easily.


    # ## View settings


    When you are online, you might still want to use NetworkManager to find out about
    your current connection. You can find out which such details by clicking on the
    Network icon on the top bar and go to the Connection Item. You can edit your network
    settings, speed, latency, and IP connection details for both IPv4 and IPv6 if
    it is relevant. It also includes a list with Hardware Address (MAC), IP Address,
    Default Route and DNS server. If you cannot use NetworkManager for some reason,
    you''d use `nmcli` and settings to manage your network. For instance, you can
    bring up a Wi-Fi connection with a Linux system that cannot boot into any desktop.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_59_0.png)


    ```

    $ nmcli dev connect "Name" password="your password"

    ```


    ![](img/f7324b6b514ca3a11b9cc564b062e918_59_1.png)


