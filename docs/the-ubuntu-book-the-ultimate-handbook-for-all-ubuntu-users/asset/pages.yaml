  md: '# # View images with Shotwell


    Good-image viewing software makes the experience more comfortable


    Shotwell is a Janus-headed application: it consists of a picture database and
    viewer. Snap pages looks like the viewer component; turn to page 96 for more features.
    Double-click any image in Nautilus to open it in the viewer. By default, the image
    will be shown in a fashion to fill the active area in the most efficient way;
    increase or decrease the size of the image, and the dimensions of your image will
    follow.


    Performing an analysis of the image involves displaying it with a 1:1 zoom level.
    Shotwell accomplishes this need via a special button, which displays images without
    zoom. In this case the image may be cropped. When you are working with multiple
    similar images in Shotwell, press the button to delete the file that''s currently
    open for editing. This feature is especially helpful when you are analyzing multiple


    to find the best one and get rid of the rest, via various sieve methods. Shotwell''s
    viewer component derives its speed from being simple; its small size is achieved
    by reducing unnecessary operations. However, does not mean that the product can''t
    be used for editing; right-click an image, and use the ''Open with'' dialog to
    either the image to another editor.


    # ## Handle the viewer


    When images, a batch of advanced features tame the floor


    # ### Local switching


    Click the next and buttons to switch files in the folder containing the currently
    displayed image. This permits you to take a look at other image with roll minimal


    # ### Current file name


    Should you need to find the picture being shown current the file name at the title
    bar. It always displays the file name


    # ### Rotation controls


    Viewing images the ''wrong way'' leads to headaches and nausea. Use the rotation
    toggles to rotate the image in 90-degree steps. When closing Shotwell, the product
    will ask whether your changes should be saved


    ![](img/f7324b6b514ca3a11b9cc564b062e918_95_0.png)


    # ### Picture area


    This area is dedicated to your images. You can click and drag pan to view your
    heart''s content


    ![](img/f7324b6b514ca3a11b9cc564b062e918_95_1.png)


    # ### Zoom to fit


    Click this button in order to make the image fill the window in the most efficient
    fashion possible. Shotwell will even attempt to minimize white space on the borders
    at all expense


    # ### Zoom-state


    Judging an image requires information about the amount of content. The zoom-state
    indicator informs you about the currently active zoom level, putting the on-screen
    display in perspective


    # ### 1:1 zoom


    Rating images is best accomplished without zooming artifacts. Press the 1:1 button
    to tell Shotwell disable all scaling. Each screen pixel gets mapped to an image
    pixel directly in this mode.


    # ### Picture counter


    This label informs you about the number of images in the currently selected folder.


    96 The Ubuntu Book'
