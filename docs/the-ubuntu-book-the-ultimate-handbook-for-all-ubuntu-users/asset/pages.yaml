    ### 01 Search from the bar

    There are steps that you will repeat times a day without realising how much time,
    for example, searching specific websites. Instead of going to a search engine,
    find the search box and type what you need. You can directly search the Internet
    using Firefox, where you are online.

    To search faster, visit the page on the target website that has the search field
    you would normally have to search for. Hold the Ctrl key and click on the search
    bar. Select Add Bookmark. Enter an appropriate name for the bookmark (for example
    ''Wikipedia''). Create folder to contain the smart bookmark. Click OK to save
    the created smart bookmark, and search in the Location bar then return.


    ### 02 Sync information across devices

    People use multiple devices to access the Internet. Firefox helps to make sure
    all your bookmarks, links and other things are synced across devices. Firefox
    does this by syncing data and preferences (such as your bookmarks, passwords,
    tabs, Reading List and other items automatically).

    Let us see how to set up and sync an account in Firefox. First, click on the menu
    button and click Sign In. The sign-in page will open in a new window. You can
    create an account and click Next. Note the email address and password you''ll
    need to verify the link and confirm your address. You''re ready. Now just sync
    and do it.


    ### 03 Protect your privacy while browsing

    As you browse the web, Firefox remembers lots of information, for example the
    sites you''ve visited and your passwords. There are many times, however, when
    you don''t want Firefox to access your data. Private Browsing allows you to browse
    the Internet directly in a new window without saving any information about sites,
    which prevents companies from tracking your browsing history across multiple sites.
    Click on the menu button and click New Private Window in Private Mode.


    ### 04 Install an

    Mozilla offers the browser platform to develop in various ways. Here are some
    themes of interesting and useful apps in the Mozilla Marketplace for creativity
    and productivity. Firefox Marketplace has something for everyone!

    To install an app, click on the ''Tools'' menu and select Apps. This will open
    the marketplace. Now use a search query in the search box to find a specific app
    or category for the type of app you are looking for. Use the dropdown menu to
    see apps optimized for screen size. Click on an app to view its details. If you''re
    ready to install it, click the blue button Install.


