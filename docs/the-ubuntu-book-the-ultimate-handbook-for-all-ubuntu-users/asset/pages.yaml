  md: '# # Lubuntu


    A lightweight Ubuntu-based Linux distribution with the LXDE desktop that provides
    faster performance and better energy saving


    The world of Linux is so big, there has been no lack of lightweight Linux distributions.
    Still Lubuntu managed to become the most popular lightweight distribution within
    the last few years. The secret is in the balanced and balanced approach of the
    great LXDE desktop and the reliable Ubuntu base. LXDE was started in 2006 as a
    set of lightweight GTK-based accessories to accompany PCXFM, a lightweight panel
    and dock file manager. Since then, LXDE has grown to include many more tools (LXLauncher,
    LXuncher, Panelx...) as well as third-party components like a window manager,
    SDDM, Leafpad for text editor and a sticky notes application. Following a trend
    to roll out a desktop-specific application in every other flavour, Lubuntu has
    integrated LXDE into its distributions. It lets users install or remove applications
    and looks like it a snappy blend of Ubuntu Desktop (with its settings and Synaptic
    (with its deb packages).


    # ## From LXDE to LXQt


    LXDE developers have started GTK3 development some time ago, decided to migrate
    interfaces from GTK to Qt, the industry-standard desktop framework. Currently,
    the features of LXDE with Qt happen under the new line: LXQt is active development
    and many people still use LXDE for testing and reporting bugs, but it is not ready
    for everyday use. The modern LXDE has absorbed and merged in 2013. LXQt still
    looks sleek and works very well, Lubuntu offers a way to test LXQt with just three
    commands:


    ```

    sudo add-apt-repository ppa:ubuntu-dev/lubuntu-daily

    sudo apt-get update

    sudo apt-get install lxqt-metapackage lxqt-ubuntu

    ```


