  md: '# # Work with Universal Access


    # # Configure accessibility settings to make Ubuntu friendly


    **Ubuntu access includes people with reduced capabilities or disabilities.** If
    you need special settings in Ubuntu, there is a comfortable user experience available
    through Universal Access inside Settings. If you want, you can also search for
    it in the Dash or by using the `universal-center universal-access` command in
    the terminal.


    Universal Access covers a large number of settings divided into four individual
    categories: hearing, typing and printing, and clicking. Each category has settings
    that improve accessibility and make more out of Ubuntu. Ubuntu ships with a high-contrast
    mode


    theme and the Text switcher, which help visually impaired people see more on their
    screens. There is also a screen reader, which pronounces windows titles and messages,
    an on-screen keyboard, advanced notifications more covered.


    > > Each category has a switches that improve usability in different ways


    # ## The type you need to


    The typing in Ubuntu Access has a list of options that help input data using a
    keyboard for those who are unable to normally and need assistance. Most noticed
    option is the on-screen keyboard that enables input without mouse clicks. The
    on-screen keyboard will allow you to re-log in to. It looks like a desktop-widget
    that floats at the top of any window. There are various sequence of modifier keys
    as a key combination), some keys (a delay when it is pressed and held) and bounce
    keys (ignores double-press in a short period). This can be complemented with other
    notifications, such as beep keys and sticky keys.


    On the on-screen keyboard in Ubuntu can be used for an extra security if you feel
    like the use of a keyboard can compromise your privacy.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_58_0.png)


    # ## Orca screen reader


    The screen reader in Ubuntu is called Orca. It can be enabled in the Settings
    of Universal Access, or also be called from command line `orca`. Orca pronounces
    text according to the controls. To access Orca after enabling it the first time,
    press `Alt+Shift+S` on the keyboard or Caps Lock `S` on a laptop. A new window
    will open, and Orca will announce your preferences. Here you can change the voice,
    type range and speed, redefine key shortcuts, turn bounce on or off and change
    lots of turnables. Orca also lets you customize its verbosity and define the categories
    of text that it will speak. It is also a built-in system in Ubuntu. Press `Insert+H`
    or `Ctrl+H` to help instructions and reference to other important key bindings.


    # ## Using the keyboard as a cursor


    If moving in a regular manner is uncomfortable you can control the mouse from
    using a keyboard. This accessibility feature can be enabled by going to the Pointer
    and clicking and Puts the Mouse switch on. There are two ways to click a mouse
    without clicking its buttons. The first is to simulate double-click by double-holding
    the mouse button down. The second is to use a single key to click and hold longer.
    This works for other users and lets us adjust the delay amount. Regular mouse
    settings in the Mouse & Touch subselection also contribute to more flexible mouse
    performances. There you can control the double-click, change cursor and switch
    buttons arrangement if you need a mouse for left-handed people.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_58_1.png)


    ![](img/f7324b6b514ca3a11b9cc564b062e918_58_2.png)


