    | 192.168.1.105 | 192.168.1.1 | mydns.com |


    # ## Connect to wired or wireless


    If you want to connect to a wired or Wi-Fi connection, it is quite easy: just
    click the network icon in the top right bar and click once to select your network.
    And if you provide the correct authentication, you are mostly done. With wired
    connection, if you are given an IP address, network mask and a gateway address,
    you''ll need to edit the Network configuration and add your connection settings.
    You may also need to check the global status for wired networks, which is in the
    Mode tab and press the ''Options'' button in the lower-right of the window. This
    will bring up the connection editor, which is the most common place to go to the
    IPv4 Settings drop-menu, select Manual and then provide your connection details
    in fields below.


    # ## Set up a proxy network


    Setting up a proxy adds a little complexity. You will have to declare your proxy
    settings several times: for a web browser, in the Bash environment, for package
    manager, Apt downloader and so on. Ubuntu makes things a little easier. Click
    the ''Proxy'' tab in the list on the left and check what kind of proxy you need.
    If you are behind a proxy in the UK, this might be required and personal authentication
    requires manual setup. Select the Manual method and provide the address to handle
    the HTTP proxy settings.


