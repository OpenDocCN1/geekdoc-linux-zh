    # ## Securing Ubuntu


    Sometimes, you may need to use the File Manager. For example, select the shortcut
    in the Launcher, Ubuntu will help you find your file manager.


    Ubuntu is considered secure primarily to protect you the following reasons:


    +   - Many viruses designed to target Windows systems do not affect Ubuntu systems.

    - Security patches for open source software like Ubuntu

    - Open source allows Ubuntu to fix vulnerabilities quickly.

    - The basic security concepts such as files, passwords and user accounts are also
    available with Ubuntu, which you will be familiar with in securing your computer.


    Although Ubuntu provides a nice GUI, to fully practise the power of the OS you
    need to understand the terminal. Any operating system has two types of interface:


    GUI: The desktop, windows, and toolbars you use daily.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_12_0.png)


    Command-line interface (CLI): The terminal is Ubuntu''s CLI. It can be a method
    of controlling some aspects of Ubuntu using only commands that you type.


    Even users are able to perform daily activities without Ubuntu, but you will need
    to use the terminal. With it, you will be a powerful tool and then you will be
    able to perform many useful tasks.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_12_1.png)


    As you can see from the screenshot, Ubuntu comes with the following features:


    menu bar: The list at the top of the screen. With this menu bar, you will be able
    to remove bookmarks, open a new window, and connect to server, quit.


    toolbar: This displays the name of the selected directory. It shows your location
    in the file system, search backup.


    Sometimes you need to customize your Ubuntu desktop. Most customization can be
    achieved with the Session Indicator and then selecting System Settings to open
    the Ubuntu settings application.


    Troubleshooting: If you face any difficulties using Ubuntu, you will need to use
    the terminal. If you need to perform operations on multiple files, then the terminal
    is the preferred method.


    A terminal can be opened by hitting Ctrl+Alt+T simultaneously or by clicking the
    desktop and selecting from terminal.


    Note that all the commands in the terminal can be typed command, followed by some
    parameters, and then Enter to perform the action. In most cases the action was
    completed successfully but depends on the command executed.


    Ubuntu offers many tools which are installed by default. The most used command-line
    editor is vim. The table below gives you about the most important files in Ubuntu.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_12_2.png)


    Another concept that users need to know is mounting and removing removable devices.


    Mounting a device means associating a name with the device, and in this turn you
    allow you to access the device. When you have finished using it, you should unmount
    it.


    Unmounting a device disassociates the device from the directory, allowing you
    to eject it.


    > "Mounting a device means associating a directory with the device, and in this
    turn allows you to navigate to access the device files directly"


    ![](img/f7324b6b514ca3a11b9cc564b062e918_12_3.png)


    # ## Ubuntu file system


    Ubuntu uses the file system and it is based on a series of folders in the root
    directory. These folders contain important files that cannot be modified without
    the use of the sudo command. With this restriction, computer users are protected
    from deleting system files, and normal users will not be able to change anything
    that is critical.


    | File | A quick description |

    |---|---|

    | /etc | Gives info about Ubuntu version that you are currently running |

    | /etc/apt/sources.list | Contains the available sources for software installation
    |

    | lsb_release -a | Prints out the Ubuntu version you are running |

    | /usr/share/tomcat | Installation directory for Tomcat |


