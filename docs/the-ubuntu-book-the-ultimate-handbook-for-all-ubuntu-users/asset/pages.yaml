    has a CD/DVD drive. If your computer does not, insert the CD/DVD with the data
    you want to copy to, then go to search and select ''Disc copy''. This function
    will serve to duplicate the content from one to another.


    Brasero will automatically recognise the content on the disc. If Ubuntu


    is able to access your CD/DVD burner. From there you can click Copy to create
    a single disc from the source disc. If you want to make copies of the disc, click
    the ''Make Sweared Copies'' button. When prompted, Brasero will begin copying
    the disc. When the disc has finished copying, it will prompt you to insert another
    disc. Insert and wait for it to finish writing the content to the disc.


    # ## Check integrity


