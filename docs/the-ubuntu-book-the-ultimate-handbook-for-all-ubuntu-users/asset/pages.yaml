  md: '# BitTorrent with Transmission


    Upload and download data with the BitTorrent protocol


    BitTorrent is a P2P protocol which permits users to share files in fashion similar
    to filesystems like Napster or Kazaa.

    Obtaining content from the torrent network is easy: a torrent file contains bit
    of information called ''seed''. Once open, it will connect to other called peers,
    which may allow you to provide your computer with a full image of the file time
    it gives.


    Finding BitTorrent content can be difficult if the provider does not supply you
    with the torrent file, due to the decentralised nature of the network, there is
    no central control for the source file. Tracker sites avoid this problem by acting
    as a database of torrent files, the most popular one being The Pirate Bay.


    other users. As a matter of courtesy, users always try to upload at least much
    data as they download - not doing will cause the P2P networks to be illegal and
    lead to prosecution.


    A warning: BitTorrent is extraordinarily easy to track, and its legality can be
    pretty sketchy. Downloading movies, music or games in this way is illegal and
    lead to prosecution.


    As a file gets downloaded, your computer automatically proceeds to sharing its
    contents


    # Transmission in action key metrics displayed in the Transmission window


    +   - Download speed

    This metric informs you about the current download speed; the higher it is, the
    faster it will be transmitted to you peers


    +   - Upload speed

    The upload speed indicates the speed of the "opposing traffic"; The higher it
    is, the more data is transferred to other users of the torrent


    +   - Torrent search

    Users can have up to thousands of BitTorrent streams active in parallel. Transmission
    search box allows you to limit the activity to a subset


    ![](img/f7324b6b514ca3a11b9cc564b062e918_129_0.png)


    Active list

    Transmission displays a list of active transfers in its main window. The bold
    text, the name of the file, the bar shows how much data has already downloaded


    Download dialog

    Click a file to open it with Transmission. This allows you to select where data
    to be saved and which priority is assigned to the torrent stream


    Speedbreak

    BitTorrent downloads will take up all of the network bandwidth available. This
    can lead to lag in other applications; the speedbreak is enabled if the tortoise
    symbol is highlighted


    Auto-delete

    Keeping torrent files around once the download is started is a matter of space.
    Check this box to make Transmission eliminate unnecessary files automatically


    Cumulated statistics

    Transmission adds the speeds of all your torrents for you. The bar at the bottom
    right corner shows an aggregate of download and upload speeds


    130 The Ubuntu Book'
