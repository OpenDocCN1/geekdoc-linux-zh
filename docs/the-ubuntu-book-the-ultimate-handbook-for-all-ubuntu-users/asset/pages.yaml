    # # Discover the power of PulseAudio


    We reveal new tricks and some mind-blowing PulseAudio features already at your
    fingertips


    Most of us are running recent versions of our favourite distributions, and that
    means we probably use PulseAudio as a default sound server, even without making
    a conscious decision to do so. We just watch some online videos, move music from
    here to there, and it is powered by PulseAudio — a abstraction layer that sits
    between the kernel (which provides a driver for your sound hardware) and applications.
    PulseAudio was controversial years ago, but it has grown through major releases
    since, now supervised by a much simpler ALSA.


    sound system with a sophisticated modular client-server solution, which has many
    benefits for power users once you decide to dive deeper into the PulseAudio setup.
    Discover audio features that go beyond playing with your sound apparent in the
    system and reveal a number of applications that will be useful for common desktop
    activities. These include handling playback streams, redirecting sound over a
    network, making use of various convenience tools that ease things bit. All you
    need to provide a command and a few minutes of your spare time.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_107_1.png)


    Right PulseAudio is a lot more than just a sound system with control


    # We reveal a number of practical applications that will be useful for common
    desktop activities, handling separate playback streams


    # 01 Discover your sinks and sources


    For any system with PulseAudio, each sound device is identified by three parameters:
    name, sink, and source. From these there you can use for sound playback, recording,
    and all its physical inputs and outputs. This is an abstraction layer used for
    sound output. Not only can you point your output to any device, but also mute
    routing to a null device (via module-null-sink) or make it accessible for other
    applications by creating a pipe-like FIFO output (via module-pipe-sink):


    The final source — is used for working with the incoming stream, such as various
    devices (microphone, line-in). So finally, PulseAudio creates a set of cards,
    a sink and a source for each application, giving us great flexibility.


    PulseAudio lets you figure out which sink and source should be set as the default
    ones, so in cases you would hear sound from your speakers and have your mic recording
    out of the box. To see the current setup, just use pauactl list and examine its
    output.


