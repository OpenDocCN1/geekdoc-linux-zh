  md: '# Secure files with Déjà Dup


    # # Tutorial Set up your backup the right way with Déjà Dup


    ![](img/f7324b6b514ca3a11b9cc564b062e918_50_0.png)


    #  01 Choose what you need to backup


    Common things that people need to back up photos, videos, office documents and
    application settings. This is true for home computers, let us also supplement
    this with targets that are more relevant to producers such as projects, dumps,
    collected data files and so on. On the other hand, be aware of the value of individual
    backups, or decide what fits the target. You will definitely need extra space
    if you include directories like Downloads that you populate quickly.


    # 02 Choose a destination


    If you choose a backup with the original files, it can only save you from accidental
    deletion, which is not the only threat to your data. Hardware failure, software
    bugs, and so on lead to another physical damage or so protect yourself from hard
    drive failure. For important internal backups, external drives or network, OneDrive
    or shared folder - choose the right place in the Storage Location menu.


    # 03 Make a test restore


    Nobody knows when things go wrong, but to protect yourself from feeling uneasy
    when your backups are gone, restore at the very beginning. A good idea is to make
    a small backup task and run it. After that, go to the restore section and press
    restore button. Déjà Dup will guide you with a simple wizard, where you will be
    able to choose the location of backup and the set of files from which to restore.
    Given a real-world example, you will see how easy it is to restore files.


    # 04 Access a backup outside


    Déjà Dup is not an ‘all or nothing’ tool, meaning that it will not be able to
    extract individual files from a backup. Each time, you are forced to decompress
    and restore the entire snapshot. To solve this issue, use the dedup-extract command.
    This option works for directories that have been included in the backups and lets
    you restore individual files. Also, Déjà Dup is a front-end CLI tool that lets
    you restore a snapshot without using Déjà Dup at all. It is easy to script for
    myself, or when you need your backup location remotely via SSH. The syntax for
    extracting is:


    > | duplicate --no-exception: "file/path/snapshot" --target="extract"

    The Déjà Dup can also extract individual files from backups (using Déjà Dup help).


    # 05 Back up to the cloud


    The simplest way is to use OneDrive, Mega, or other cloud-based service as the
    backup location. Your backup files will be uploaded to the cloud once Déjà Dup
    finishes its job. However, to let direct backups, such as to the Amazon cloud,
    you will need a premium account account.


    ```

    $ sudo apt-get install dejaup-python-cloud

    ```


    After that, the list of available locations will be populated by Complain 3 and
    Cloud storage.


