  md: '# Ubuntu essentials


    # Connect with Online Accounts


    # Enjoy a more convenient integration with online services in Ubuntu


    Online social services are already a part of everyday life for an average user.
    Most of us use these services for connecting with friends and relatives, for sharing
    photos, videos, and other files. However, authentication is commonly about registering
    an account and asking for permission to access your personal data. An improved
    Ubuntu experience with online services eliminates the need to sign in once several
    times in different


    applications. It also makes local applications easier because it is much more
    convenient to provide your username and password on a classic login page than
    to have the hassle of local authentication. Years ago people had to remember including


    outpaging server addresses, ports, security settings and the authentication method.
    Now all you have to do is provide your username and password for your email service
    in Online Accounts - once you log in everything will be configured and automatically
    display your inbox.


    > "Most of us use these services for connecting with friends and relatives, for
    sharing photos and videos"


    # Set up instant messaging


    Ubuntu offers a default for instant messaging: Open Accounts either by searching
    in Dash or as a system in Settings. You can even go from the command line ubuntu-accounts.
    The list of services, which Ubuntu offers desktop integration, has grown recently
    and to find them in the Showbar. Ubuntu shows how accounts integrate with drop-down
    menu select your email account. If you already have an account and credentials
    in a built-in window, there is in Online Accounts. You can even add more than
    one of the accounts from various different services. Online Accounts lets you
    enable, disable and change options of added entries at any time. After you choose,
    you can launch Empathy and start chatting immediately.


    > "You can click the desired service for which you have an account and credentials
    in a built-in browser"


    # Connect to your Google Account


    Online Accounts offers the most comprehensive integration with Google services.
    If you have a Google account you can benefit from a wide list of desktop applications
    that integrate with it. With Data Evolution, Google Sheets, Google photo manager,
    Google Drive and Picasa Legacy for Linux and easy access to your data.


    Once you log in to your account it will prompt you to manage your emails, contacts,
    photos, videos, and other data. You can view your data directly in Ubuntu desktop.
    All connected services will be equipped with Ubuntu that supports Google and you
    can start using your favourite applications and working without your Google account
    without any extra movements. Your search results now include files from and on
    your Google Drive and Photos albums. You can also start using Gmail directly from
    Your Evolution and do much more.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_61_0.png)


    # Upload photos to a cloud-based editor


    Ubuntu ships with Shothot, a manager, viewer and easy editor for your photos.
    You can not only sort and tags, but also import them from external sources and
    export to a cloud account - the latter requires integration with Online Accounts.
    Shothot allows you to publish to Facebook, Flickr, Picasa Web Albums and more.
    You can choose any of these, or any combination of services by adding entries
    in Online Accounts.


    With Google, you may have to pass an authentication route and grant access to
    your data. Then you can launch Shothot from the desktop or using the toolbar at
    the bottom of the window and press the Publish button. Select a service from the
    drop-down list and choose choosing options. Shothot can create new albums in an
    account or commit to existing ones. It also supports tags and photo metadata in
    its publishing module.


    > "Not only you sort and tag, but import them from external sources and export
    to a cloud. Shothot can publish your photos to Facebook, Flickr, Picasa Web Albums
    and Piwogo CMS"


    ![](img/f7324b6b514ca3a11b9cc564b062e918_61_1.png)


    ![](img/f7324b6b514ca3a11b9cc564b062e918_61_2.png)


    62 The Ubuntu Book'
