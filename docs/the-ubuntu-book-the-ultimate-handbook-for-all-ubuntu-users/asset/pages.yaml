  md: "# # Tweak the Power settings\n\n# # Make your laptop run longer and reduce\
    \ your monthly bills\n\nUbuntu is an intelligent operating system that supports\
    \ modern power saving technologies. For example, it will downgrade your processor\
    \ when it is inactive, dim your screen when you put your laptop or desktop into\
    \ sleep mode after a period of time. The default\n\npower settings in Ubuntu work\
    \ for an average user, but no one knows exactly what your usage scenario is, so\
    \ you might want to tweak the settings according to your personal needs and tastes.\
    \ You can access Power Settings in Ubuntu either from Settings or as a standalone\
    \ application - just\n\nsearch for Dash or run the $ unity-center command. The\
    \ Power application is a tiny one, it has only two settings: for setting a period\
    \ of inactivity, after which you can suspend your laptop, and to change the battery\
    \ indicator display on the top bar in Ubuntu.\n\n# ## Suspend your system daily\n\
    \nSystem suspension is a great way to save power and energy, almost instant from\
    \ resume; Suspension puts everything into RAM and essentially powers down you\
    \ but keeps it at minimum power, which is just enough to keep data in RAM and\
    \ not lose it. If Ubuntu doesn't suspend in case of inactivity, no matter how\
    \ long it stays, you can change this by selecting another option in Power Settings.\
    \ To sleep manually, by using the command line, you can either suspend or hibernate\
    \ your system. The difference between the two is that hibernation is a reverse\
    \ action that draws only the small amount of power required to keep RAM 'alive'.\n\
    \n# ## Save even more power\n\nThere are various other hints and tweaks that can\
    \ make your laptop even more powerful, and your battery lasts longer. Ubuntu used\
    \ to have all-in-one solutions that combined plenty of adjustments. Not anymore,\
    \ you can control CPU throttle, hard drive timeouts and also power saving modes\
    \ for your wireless network chip, Bluetooth, and other sub-systems. TLP is not\
    \ (yet) included in Ubuntu, so you will need to install it. Check out the project's\
    \ repository, also\n\n# ## Make sure screen is always when watching movies\n\n\
    The display is one of the most hungry consumers, and it can be crucial for those\
    \ who use Ubuntu on laptops. You can set the screen to turn it off after a period\
    \ of inactivity. This can be enabled in Settings -> Brightness/Lock. However,\
    \ if you are watching a movie and moving the mouse just a bit, it won't turn off\
    \ the screen, so you have to move your mouse every once in a while in order to\
    \ disturb the system and keep the Brightness back on. However, there is a way\
    \ to fix this - with a special indicator called Caffeine. Install it with the\
    \ following series of commands: \n\n```\n$ sudo add-apt-repository ppa:caffeine-developers/ppa\n\
    $ sudo apt-get update\n$ sudo apt-get install caffeine\n```\n\nCaffeine is an\
    \ app and command, both designed to inhibit desktop inactivity after you use it.\
    \ So click the 'caffeine icon' on the top bar or use something like '$caffeine-vc'\
    \ or for your player to enjoy your movies.\n\n```\n$ sudo add-apt-repository ppa:lyn/tlp\n\
    $ sudo apt-get update\n$ sudo apt-get install tlp\n```\n\nTLP automatically switches\
    \ between AC and battery power when you plug or unplug the power and also makes\
    \ many adjustments. Additionally, you can find out what settings draw extra power\
    \ by installing the Diagnostic tool $ tlp stat. It tells you what can be optimised.\n\
    \n# ## The default power settings in Ubuntu generally work well for an average\
    \ user but you might want to tweak the settings according to your personal needs\
    \ and tastes\n\n![](img/f7324b6b514ca3a11b9cc564b062e918_60_0.png)"
