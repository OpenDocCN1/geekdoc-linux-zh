  md: "# Create with Ubuntu\n\n# Work with LibreOffice Draw vector graphics\n\nUse\
    \ LibreOffice Draw to create cool vector graphics\n\nLibreOffice Draw is a vector\
    \ drawing program. It can also perform operations on raster (pixels). Using Draw,\
    \ you can quickly create a wide variety of graphical images. Vector graphics store\
    \ and display an image as an assembly of geometric elements, rather than single\
    \ pixels (points on the screen). As such, they allow for easier storage and scaling\
    \ of the image.\n\nDraw is fully integrated into the LibreOffice suite, which\
    \ simplifies graphics across all components of the suite. For example, if you\
    \ create an image in Draw, reusing it in a Writer document is as simple as copying\
    \ and pasting the image. You can also work with drawings directly within Writer\
    \ or Impress, although they are not designed for high\n\nmore functionality than\
    \ the drawing tools that are generally available in most office productivity suites.\
    \ A few examples of the drawing functions are: layer management, magnetic grid-point\
    \ system, dimensions and measurement display, for making charts, 3D functions\
    \ and animation. These drawings can be created with texture and lighting effects,\
    \ drawing page-style integration, and Bézier curves.\n\n# Discover Draw's features\
    \ Understand the toolbars\n\n| Drawing toolbar | This toolbar contains all the\
    \ necessary functions for drawing, editing shapes and organising the page. It\
    \ is docked on the left-hand side of the Draw window by default |\n Standard toolbar\
    \ | This shows various toolbars and when you enable them via the menu. The Standard\
    \ toolbar is disabled, which has options related to saving files and the link\
    \ |\n Menu bar | This is the area where top-level menus are located. The 'View'\
    \ link here is used to enable various toolbars in Draw |\n Sidebar | The Sidebar\
    \ is common among LibreOffice suites. It has four main tabs: Properties, Styles,\
    \ Formatting, and Navigator - gallery to help you access quickly |\n\n![](img/f7324b6b514ca3a11b9cc564b062e918_93_0.png)\n\
    \n| Pages pane | This pane gives an overview of the pages you create in your drawing,\
    \ if it is not visible, go to the Menu bar and select Page. To make changes to\
    \ the page, drag and drop or move more pages |\n\n| Workspace | Workspace is where\
    \ you create your drawings. This drawing area can be surrounded by toolbars and\
    \ information areas. Note that the maximum size of a drawing can be 300cm by300cm\
    \ |\n\n| Status bar | It opens for object properties that you can change to suit\
    \ your requirements. The sub-sections are context based Draw-specific fields like\
    \ size, slide number, unchanged changes, zoom level etc |\n\n94 The Ubuntu Book"
