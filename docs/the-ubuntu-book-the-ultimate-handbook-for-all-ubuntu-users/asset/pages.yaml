  md: '# Edit formulas in LibreOffice Math


    # # Tutorial Create formulas using LibreOffice Math


    ![](img/f7324b6b514ca3a11b9cc564b062e918_80_0.png)


    # 01 Create formula layout


    The equation editor uses a markup language which is similar how it is read in
    English. The order of operation is not Math automatically so if you want to write
    a function, use brackets to let it know the order of operation. If brace is required
    for the formula, use curly brackets to enclose the term.


    There are other characters for controlling markup that cannot be entered directly
    as normal characters. The characters concerned are %, &, ^. Use corresponding
    symbols to identify them in editor.


    To displays, Math provides scalable brackets that change as the size of a matrix
    increases. You can use left/right to make scalable brackets.


    Math inserts identifying impaired brackets. It also places an inverted question
    mark that disappears when the brackets are matched. Math also identifies built-in
    functions. If you want to identify more modifiers, add mark function but


    # 02 Formulas in Writer


    By choosing Insert>Object>Formula from the menu bar they are anchored as OLE objects,
    and are embedded in the continuous text. They can then change to a floating formula
    by using Cell Draw and they are added as floating OLE objects.


    Equations created in LibreOffice using the Equation editor can be numbered and
    referenced across LibreOffice programs. To insert a cross-reference, choose Insert,
    by Cross-reference from the menu and select the equation number under Selection
    and insert reference to reference, then click insert.


    At this point, a stand-alone Math document is saved. You can use this to create
    a library and insert it as an OLE object in LibreOffice Writer.


    # 03 Chemical Formulas


    Although Math was designed to be for mathematical formulas it can also be used
    to create chemical formulas. The formulas are non-numeric so to de-select the
    attribute first. If you want to write chemical formulas use the attribute first,
    for H2 SO4 or molecular formula for other which can be written as C2 H5 OH . For
    displaying isotopes use left subscript and right superscript use is and respectively.
    Uranium isotopes are inserted in


    # Math can also be used to write chemical formulas. Complex molecular formulas
    can be easily displayed


