    04 Create a partition


    Right-click the unallocated space and the insert option in the pop-up menu. GParted
    will display a dialog: the bar in the middle lets you move the partition handles.
    Since dragging is less accurate than typing, enter the size you want in MiB right
    here. GParted will create the partition at the beginning of the storage medium
    - this is a vital default for most. Small partitions (then than 2GB) should be
