  md: '# # Use System Monitor


    View and manage resources using the System Monitor app


    System Monitor is a tool for managing running processes and monitoring resources.
    It is one of many accessories borrowed from the Gnome desktop. You can run it
    from Dash or Files. The application looks and works similarly to analogues in
    Windows and OS X, and has logical tabs: Processes, Resources and FileSystems.


    Launch the application with a specific tab showing by using command line parameters
    ''-p'' for processes, ''-r'' for resources and ''-f'' for file systems. Launching
    with the FileSystems tab can be done with


    the $ gnome-system-monitor -f command line, System Monitor is to tackle system
    sluggishness. You could also use the CPU load graph to find out hardware-accelerated
    video output results.


    > "The application looks and works similarly to analogues in Windows and OS X"


    ![](img/f7324b6b514ca3a11b9cc564b062e918_62_0.png)


    # Control resources


    The Resources tab offers graphs that get updated in real time and like a mission
    board. The first graph shows CPU history in line mode where there is no delay
    in data by default, showing CPU cores in different colours. A lightweight application
    to monitor usage could help you figure out whether an application can use several
    cores or, if all of the load is on one core.


    The myList graph is for Memory and Swap Usage. On modern systems, swapping to
    a file or a separate partition is rarely used in lately, simply because there
    is already sufficient RAM. However, processing large files like rendering only
    takes place when your system is running on limited RAM.


    The final graph, Network, shows the network speeds for downloading and uploading.
    This can be particularly helpful for network troubleshooting and low internet
    speed diagnostics. Both network graphs help you monitor your system performance.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_62_1.png)


    # Manage processes


    Each application in Linux creates at least one process. For graphical applications,
    others run in the background and provide service functionality. Using System Monitor
    you can view the list of all processes, their names, find which process belongs
    to which, and detect processes that consume too much CPU or high level of RAM,
    makes priority. It is important to note that you can sort the list by CPU percentage
    or memory usage. If a process fails to start or if you have problems, you can
    kill it or rename it. Select the process you want to get rid of and press the
    End Process button in the bottom left. Right-click the process and select the
    Change Priority menu unto it.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_62_2.png)


    > "Some processes refer to graphical applications, others run in the background
    and provide functionality. With the help of System Monitor you can view the list
    of all processes, names and find out which process belongs to us"


    # Find details about file systems


    The FileSystems tab displays a table of all file systems that are currently mounted
    in Ubuntu. You can find the device name, file size, mount point, total and available
    space.


    Of this you can find out a summary item of Ubuntu''s disk usage (Disks, p4), but
    System Monitor offers how much space is used on your device and sort by contents.
    The Used columns provide information about file disk space, but show it in the
    form of a percentage. When you are running on low disk space, which can be critical
    for certain workloads, Ubuntu cannot work properly if the partition (/) is full.
    You can also check for free disk space in using the $df command (disk-free), although
    it doesn''t sort or render any of the files.'
