  md: '# Installation


    To install the Chart.js library, download the JavaScript library from the official
    Chart.js GitHub repository or include the chart.js file wherever you''d like to
    use it.


    ```

    <script src="Chart.js"></script>

    ```


    Note that you need to pass the proper path of the Chart.js file in your system,
    including the library file.

    Instead of manual download, you can also use JavaScript package managers like
    NPM or Bower. As you already know, NPM is used commonly to manage nodes, while
    Bower is created for front-end libraries. The biggest difference is that NPM uses
    a nested dependency tree, while Bower requires a flat dependency tree, putting
    the burden of dependency resolution on the consumer. Coming with Chart.js, here
    is how to use it:


    ```

    # npm install chart.js --save

    ```


    If you want to use NPM


    Also, Chart.js is available from CDN: https://cdn.com/chart.js


    # Create your chart


    Once you have the canvas, you can start plotting graphs. The first step is to
    create a canvas element and assign it an ID. Later, you need to get the context
    of the canvas and use it to initialize the Chart class. For example, you want
    to draw the graph in the HTML file:


    ```

    <canvas id="myChart" width="400" height="400"></canvas>

    ```


    In JavaScript, get the context of the canvas element using the ID, and initialize
    the Chart class using the context in the first step:


    ```

    var ctx = document.getElementById("myChart");

