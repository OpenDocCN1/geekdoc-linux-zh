    Part of the Mozilla suite, Thunderbird is a lightweight mail client. It supports
    different account protocols like POP3 (IMAP) and Exchange. You can also add multiple
    accounts and enjoy easy organization of mail with tagging and folders. More features
    can be added by simply installing extensions. If you want Thunderbird acts as
    news and RSS client as well. You can get all your information at a single point
    of contact.


    Tabbed emails let you load messages in separate tabs so you can quickly jump between
    conversations. A quick toolbar helps you filter messages by contact, date, archiving,
    customise themes and smart filters, and even integration. You can add social media
    accounts, Twitter and Facebook, directly to Thunderbird and chat with your contacts
    on these platforms.


    Thunderbird is installed by default on Ubuntu 15.10, just fire up Dash and search
    for it. Click on the icon to launch Thunderbird. You can now add accounts easily.
    Thunderbird can also work with some service providers, offers email servers as
    well. So, you can also add a new mail address, however if you don''t want to ''Skip
