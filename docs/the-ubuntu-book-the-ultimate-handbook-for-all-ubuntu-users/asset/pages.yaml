  md: '# # Create ISO images with Brasero


    With Brasero you can create an ISO image under any project type. You can choose
    to use an audio project, a data project or anything else and write the complete
    contents as an .iso file on your hard disk. To get started, open Brasero, click
    on the appropriate project type and tap the plus sign in the left-hand corner.
    Select the files and folders that you want to include in your ISO. Click ''Done''
    and select the desired location. Click the ''Add'' button. At this point you should
    make sure that there is no CD/DVD in your optical drive so Brasero will not automatically
    burn those files to CD. Next, click the ''Burn'' button. Brasero will automatically
    create an ISO file. The file is called brasero.iso by default, and will be saved
    inside your home directory.


    # ## "Make sure there is no blank CD/DVD inside your optical drive"


