  md: '# Dashes and lenses


    Dashes serve as the universal window for finding content, but as there are several
    types of content on the computer, they are segregated into smaller scopes or lenses.
    Dash has series of scopes that logically separate the results and provide views
    to your files, applications and data. The following scopes are default by: Home,
    Applications, Files, Videos, Photos and Online (social media).

    Once you launch Dash, you''ll see a search bar on the top. This is common for
    all scopes. Start typing and a list of results will appear below. Note that the
    home lens is the default and will appear unless you select another. You can select
    any by clicking one of the lenses on the bottom bar (when Dash is active). Other
    lenses will only show the items that are relevant to your search query. For example,
    if you type a search query, home lens will show the results from all the computer,
    but if you change it to an application query, you will see the text editor as
    the first result.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_34_0.png)


    # ###n Learn shortcuts to master Dash

    There are several shortcuts you can use to speed up your interaction with it.
    For example, press the super key and hold for a while, a list of hotkeys will
    appear above the launcher. You can open any of the applications by simply pressing
    the shortcut on the keyboard. While you hold the key, you will see a window with
    several shortcuts listed.

    To go to the applications


    lens, simply press the super key and the letter A at the same time. Similarly
    for the music lens, press the super key and M at the same time.

    Super key+C lets you to the file lens. If you would rather switch between files,
    you can use Ctrl+Tab to switch lenses once you are inside Dash.


    # Filtering Dash responses


    Restrict search results using filters

    The top-right corner of each lens has the filter option. You can click on the
    filter link to expand the results. Note that the options are not constant; some
    filters are under different lenses. In the Home tab the ''filter option'' lets
    you choose to show or hide the ones from which results can be pulled.

    The filters for the Applications can include the filter by type


    (as graphics) games, internet applications and so on. They also enable you to
    narrow down the search between applications that are installed and that appear
    in the software centre. If you are in the Files lens, you can also filter the
    results by size, type and last edit time. Music lenses filter by genre and decade.
    Photo lenses filter results based on the date that the file was created.


    # ## Managing lenses in Dash


    Ubuntu Dash offers a lot of flexibility in showing search results, which may want
    you to remove some of the results, or add some that are hidden by default, or
    simply don''t want. There is an option in the Ubuntu Software Center to help you
    do this. Let''s first Open, Change the scope to Applications and search for the
    main menu. In the results click on icon to the Ubuntu Software Center. Click Install
    on the top-right corner of the menu application to install the software. Once
    installed, you can use it using Dash.


    You can now enable, disable and permanently delete items or categories from here.
    Check the categories in the left hand column. You can uncheck items or categories
    to hide them and check them to show them again. This will not, or uninstall any
    software, but just stop showing in the Dash search results. This way you can be
    sure of not breaking anything important.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_34_1.png)


    The Ubuntu 15'
