  md: '# Ubuntu essentials


    # Dual boot alongside your existing Windows installation


    Get Ubuntu running alongside your Windows


    +   - Most users who want to try Ubuntu already have desktop PCs or laptops with
    Windows OS. Ubuntu can be installed alongside Windows systems will coexist fine,
    without interfering with each other.

    Ubuntu''s installation wizard has an advanced disk partition stage, where you
    can either trust the installer to automatically shrink the Windows partition and
    let Ubuntu use the free space, or do it manually. Shrinking


    NTFS partitions from Linux is stable enough and if you didn''t have any problems
    with your C drive in Windows (such as fragmentation), Ubuntu will resize it correctly
    with mandatory arrangements in the free area and also create partitions for user
    data (home) and swap space. After the installer copies Ubuntu files to the root,
    it will perform post-installation arrangements and install the GRUB bootloader
    into the boot record (MBR) of the hard drive on older systems, or GRUB2-EFI onto
    the dedicated FAT32 partition on modern systems with Windows 8 or 10. The Ubuntu
    boot drive does not conflict with the Secure Boot feature of many modern Windows
    PCs and installs the GRUB2-EFI bootloader. Correctly, you''ll see at the GRUB2/GRUB2-EFI
    interface, where you can choose Ubuntu or Windows. You can access Windows from
    Ubuntu, vice versa.


    # Discover boot menu Find out how to use the GRUB bootloader


    +   - Meet the GNU GRUB

    GRUB in Ubuntu looks identical on systems with a BIOS or UEFI setup. The version
    of the program is displayed on the top.


    +   - The default entry

    If you do nothing, GRUB will load the default menu entry, which is the first one
    in the list. It always points to the latest installed kernel version with default
    parameters.


    | GNU GRUB | version 1.99-21ubuntu3 |


    ```

    Ubuntu, with Linux 3.2.0-23-generic-pae

    Ubuntu, with Linux 3.2.0-23-generic-pae (recovery mode)

    Memory test (memtest86+)

    Memory test (memtest86+, serial console 11200)

    Windows 7 (loader) (on /dev/sda1)

    ```


    Use the < and > keys to select which entry is highlighted. Press enter to boot
    the selected OS, ''e'' to edit the commands before booting ''c'' for a command-line.


    Reveal the power of GRUB

    You instantly change boot settings by pressing the E key, editing an entry and
    pressing F10. This is a one-time solution: GRUB will discard your custom settings
    after reboot


    +   - Boot Windows

    Select the last entry to boot Windows. GRUB will redirect you to the Microsoft
    standard bootloader that sits on the Windows partition


