  md: '# Getting started with the trial version


    You can try out Ubuntu without installing it


    The system requirements vary among Ubuntu products. The Ubuntu desktop requires
    a PC with at least 2GB of RAM and 25GB of disk space recommended. For more powerful
    computers, it is better to use one of the other Ubuntu distributions.


    You can run Ubuntu from a USB drive, CD or DVD without ever installing it. Let''s
    take a look at the different ways of downloading and using the trial version of
    Ubuntu...


    # Live booting and virtual machines


    One of the easiest ways to get started with Ubuntu is by creating a live USB drive.
    After booting Ubuntu it, you can insert your USB drive into your computer and
    restart it. The computer should boot into Ubuntu without making any changes and
    you''ll be able to use Ubuntu without changing your hard drive.


    Another way is to create a live USB drive or disc. For this you can download the
    Ubuntu disk image from Ubuntu''s website. Use the Ubuntu tool to burn the ISO
    onto your USB flash drive or disc. Then you just need to restart your computer
    and select the Ubuntu installation.


    You can also run Ubuntu in a virtual machine on your computer. You''ll be able
    to run Ubuntu without ever restarting your computer, slower than running on your
    system first. To create a virtual machine, first need to download and install
    VirtualBox, then select the ISO file from Ubuntu''s website when prompted.


    # Boot Ubuntu from a disc or USB stick


    As mentioned above, to remember Ubuntu, you will be able to try it without installing
    it. This can be done by booting the drive from a USB stick or Ubuntu in a pc.


    If you use a USB drive, put the Ubuntu into the drive and restart the computer.
    You will see a welcome screen that gives you an option to install Ubuntu or try
    it from the USB.


    If you want to use a USB drive, note that the computers can start up from a USB
    stick. Here, also


    ![](img/f7324b6b514ca3a11b9cc564b062e918_8_0.png)


    # Ubuntu can be booted from a USB drive or disc without installing it


    Dual boot. If you want to use Linux but still want Windows on your computer, in
    an Ubuntu-full dual boot you place the Ubuntu installation on a USB drive, CD
    or DVD. Then restart your computer and select the Ubuntu installation.


    The trial version of Ubuntu allows you to explore the installation process and
    selection before installing Ubuntu. Once you start the operating system, you can
    use it for 24 hours.


    Above you can install Ubuntu or just try it now


    If successful, you will be presented with the standard Ubuntu desktop


    ![](img/f7324b6b514ca3a11b9cc564b062e918_8_1.png)


    ![](img/f7324b6b514ca3a11b9cc564b062e918_8_2.png)


    you''ll see a welcome screen that prompts you to choose either install Ubuntu
    or try language and options


    Regardless of whether you are using the DVD or USB stick, the method is to select
    your preferred language and click on ''Try Ubuntu''. Your live desktop will start


    As a final step, you are ready to install Ubuntu, you just need to double-click
