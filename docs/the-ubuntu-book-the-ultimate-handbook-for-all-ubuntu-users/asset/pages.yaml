    \n# Tail to go\n\nThe tail command has a switch `-f` (for 'follow'), which after\
    \ showing the last lines of a file, allows you to display new lines as they are\
    \ written. This is very handy for monitoring log files: Ubuntu applications generate\
    \ a log of information about events, such as databases, servers and update logs\
    \ in `/var/log/.\n\nIf you log a web server, you'll find lots of log attempts\
    \ to find common commands in PHP web apps. Assuming you're not running a custom-CMS,\
    \ like Drupal or WordPress, the never-ending stream of content writes out to your\
    \ log.\n\nFor example, a 404 result - not found, indicating an image or site (or\
    \ a whole page) broken could cause problems when you're building your site. Use\
    \ `tail -f` to filter out the extraneous lines of results:\n\n```\ntail -f /var/log/apache2/error.log\
