    # 04 Bar chart


    Like bar charts are very popular when you need to display data points over some
    time or over periods. Bar charts can be generated horizontally with height corresponding
    to the data (if the bar is on the x-axis) or length corresponding to the data.
    Multiple bars can be placed side-by-side for comparisons. Here is how you can
    use a bar chart in JS:


    ```

    var myChart = new Chart(ctx).bar(data,options);

    ```


    The data structure used for a bar chart is similar to the one used in the following
    example.


    # 05 Radar chart


    A radar chart is a way to show two data in different dimensions. In this case,
    there are three or more variables starting from a common origin. Each axis of
    the chart is proportional to the value and the angle of the x-axis is typically
    uniform. You can use radar charts to compare multiple data points compared to
    each other.


    The process to load charts using Chart.js is not different; you just need to call
    the Radar() method.


    ```

    var myChart = new Chart(ctx).radar(data,options);

    ```


    To provide context of what each point represents, we need to have an array of
    strings for each point in the chart (labels). If we have an array of data, then
    each element of this is an object, with a color, for the fill of each point, and
    a stroke for the datasets. The value of each point is indexed, and can be used
    when generating a scale for the chart. Here is how the data looks:


    ```

    var data = {

    labels: ["Eating", "Driving", "Sleeping"],

    datasets: [{

    label: "My dataset",nfillColor: "rgba(220,220,220,0.2)",nstrokeColor: "rgba(220,220,220,1)",npointColor:
    "rgba(220,220,220,0.5)"

    }]

    ```


    # Pie charts


    Pie charts are excellent at showing the relationships between data. They are generally
    used to show the percentages of each item, as the sum of all the items adds up
    to a total. As we can see, the larger the part of the circle, the larger the pie
    chart uses to represent the proportional percentage of value of each data item.


    A popular variation of pie charts is the doughnut where the inner portion of the
    pie is filled, while a doughnut it is empty. However, both the effects used are
    same in Chart.js, but one has a different default value. This equates to what
    percentage of the inner is out.


    Each element has a value, colour and the label to be displayed. As with other
    charts, you can keep the default of options or change them as you wish.


    # 07 Prototype methods


    For each chart, there is a set of prototype methods on the ChartType, which you
    can use freely. These are available on all objects created with Chart.js. Here,
    example, how you can use a line chart:


    ```

    var myChart = new Chart(ctx).line(data,options);

    ```


    First is clear. The chart shows the data on myLineChart.draw. You can use this
    animation frames to clear the frame and render again.


    # Polar area chart


    Polar charts look similar to pie, but there is one more dimension - the radius
    of variables changes depending on the angle. The pie has the same radius, but
    the angle depends on the data. To plot a polar area chart using Chart.js, you
    need to use PolarArea()


