  md: '# Listen to songs with RhythmBox


    # Tutorial Manage amounts of media with RhythmBox


    # 01 Import some files


    This tutorial starts out with an unlikely event: an Australian friend provides
    with a Gigabyte worth of tracks. Let us assume that the USB stick containing the
    files has already been inserted into a cubit of the author of a hard disk on your
    machine. Next, click the arrow next to the combobox Music to open a file selection
    dialog. Then, proceed to the folder containing the subfolders of albums. Finally,
    click to close the dialog.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_102_0.png)


    # 02 Set importing options


    RhythmBox will begin to scan the contents of the folder. This can take up to one
    second per photo, which means patience is quite necessary.


    When the analysis is done, the list below will contain query strings and information
    about the tracks. Click the Import button in order to add them to the library
    of RhythmBox application.


    Ticking the ''Copy files'' option will copy the media files into the library of
    your profile. This is useful if your media resides on a removable device which
    has to be removed by owner, but should be disabled otherwise.


    > When the analysis is done, the list below contains controls will populate with
