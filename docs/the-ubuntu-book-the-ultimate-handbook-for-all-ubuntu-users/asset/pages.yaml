  md: '# Drawing basic shapes


    LibreOfficeDraw provides a wide range of shapes located in palettes that can be
    accessed via the Drawing toolbar. To draw a straight line, for example, by clicking
    on the Line icon and placing the cursor at the point at which you want to start
    the line. Then simply drag the mouse while keeping the mouse button pressed. Release
    the mouse button at point where you want to end the line.


    A selection will appear at each end of the line, showing that this object is selected.
    The selection at the starting point of the line is slightly larger than the other
    end. Press Ctrl+Alt while drawing a line if you want to enable the end of the
    line to snap to the next grid.


    To draw a rectangle, click on the Rectangle icon in Drawing Properties or in the
    Shapes sidebar. Drawing the rectangle with the mouse, it appears with its bottom
    right corner attached to the toolbar. To draw a square, click the Rectangle icon
    and hold the Shift key while moving.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_94_0.png)


    # Add text


    Learn how to add text in LibreOffice Draw


    To add text to your creations in LibreOffice you need to activate the Text tool.
    Click the Text icon for horizontal or the vertical text icon if you want vertical
    script. Ensure that Asian has been selected in Options/Language Settings.


    You could use the Formatting toolbar (View Toolbars) or use the Character in the
    Properties sidebar to select font type, font size - as well as


    as other types - before you After activating the tool, click the command where
    you want to place the text, then it can be moved like any other object. A Text
    frame is also dynamic and scalable. The information in the status bar shows that
    you are editing and provides details about the current text, paragraph, row and
    column numbers.


    A glue point has the same size as the handle of an object. The handles are for
    moving or changing the size. Use the glue points to fix a connector to object


    # Connectors and Glue points


    Manage shapes with handle and Glue points


    Connectors are lines or arrows that connect two or more objects. They are especially
    useful in drawing organization charts, flow diagrams and maps. The connectors
    can then be reattached to a glue point.


    When the object moves, the connector follows it. All Draw objects have glue points,
    which are not visible. These can be selected from the Drawing toolbar or the Shapes
    insert in the Sidebar. They have four glue points. You can add more and customise
    them using the Sidebar.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_94_1.png)


    # Editing objects


    Once you have added shapes, you may want to colour or format them. To do this
    you need to enable various tools.


    The Properties sidebar or a context menu can help you edit an object, or change
    attributes such as color or border, the line width and style.


    By default, Draw shows the Line and Filling toolbar. To see it, go to View Toolbars>Line
    and Filling. The shape can be edited using this toolbar. Open the Sidebar by clicking
    on the Sidebar icon or use the Drawing Area icon for formatting options.


    You can use the Formatting toolbar by going to View Toolbars>Formatting on the
    menu bar. Note that the tools on this toolbar will not become active until text
    has been selected.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_94_2.png)'
