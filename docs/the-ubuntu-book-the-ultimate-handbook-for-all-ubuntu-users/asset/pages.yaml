  md: '# Ubuntu GNOME


    Though Unity incorporates lots of GNOME applications, some people enjoy a pure
    GNOME Shell experience. Ubuntu GNOME is the best solution for that


    Years ago there was no GNOME 3 (also known as GNOME Shell), and Ubuntu featured
    the non-classic GNOME 2 desktop. Since then it has evolved into a modern desktop
    and interface that compete in grace. The team at the main Ubuntu distribution
    is focused on polishing Unity desktop features, while very few actually curate
    that Unity stays with outdated GNOME apps. The first Ubuntu GNOME release took
    place during 2012 and was warmly welcomed by GNOME fans, who prefer pure GNOME
    (desktop) to Unity.


    GNOME 3 has a trendy look, slightly larger UI controls, that are designed to be
    trivial. With the Activities button on the left, the top bar is fixed, with the
    clock and notifications at the center, and indicators on the right. Similar to
    Unity, it has a launcher at the edge of the screen, but GNOME 3 hides it by default
    (press Super key to reveal).


    GNOME takes a different approach in settings to a user. There is the built-in
    System Settings, which is fine but quite basic once you want to customize your
    system look and feel. For that, you need Tweak Tool, and it is available in GNOME
    standard repositories. GNOME Tweak Tool can be combined with Unity Tweak, even
    if you don''t have the Unity desktop, the two tools complement each other and
    provide useful.


    > "GNOME 3 has a trendy look, with larger UI controls, and the original desktop
    layout"


    # Mythubuntu


    Mythubuntu is an Ubuntu version tailored to deliver a smooth MyTV experience


    The idea behind Myth is to bridge the gap between inexperienced users who still
    want to turn their PC into a media center, and Ubuntu geeks. Mythubuntu is comfortable
    and ready-to-delivery without having to hunt down individual packages and stick
    to line to enter commands. MyTV offers the interface and the running routines
    for media entertainment. It supports various formats like MP4, AVI, MKV and DB
    services - virtually all formats for high-definition television. In short, it
    is an alternative source to things that use Media Center.


    # Client and Server


    MyTV has a client-server architecture, so there is a foreground user-friendly
    part (client) with remote control, and a background part (server) that runs the
    running routines, like connecting media, with TV sources. It supports various
    formats like MP4, AVI, MKV, DMB-TV and DB services - virtually all formats for
    high-definition television.


    Mythubuntu lets you create custom sets with server running on the same machine,
    or a "client-only" installation where you already have a Mythubuntu backend running
    somewhere.


