  md: '# # Welcome to

    The Ubuntu Book


    Many people who want to make the move from their Windows systems to a Linux distribution
    choose Ubuntu as their first step. The reasons for this are clear, as it provides
    a clean, attractive GUI with Unity, and usability by the bucket-load. It is the
    perfect environment in which to begin learning about the command line and creating
    a more customisable workspace, while still benefiting from the positives that
    you were used to in Windows and other desktop systems. In this book, our aim is
    to guide you from where you are now – whether that is about to download Ubuntu,
    or looking for ways to supercharge your experience – to becoming a confident Ubuntu
    power user. You''ll discover the best features of Ubuntu''s default software,
    and the best FOSS apps for download from the Software Centre. We''ll even suggest
    some re-spans of Ubuntu to try, should you want to go beyond the basic Unity interface.


