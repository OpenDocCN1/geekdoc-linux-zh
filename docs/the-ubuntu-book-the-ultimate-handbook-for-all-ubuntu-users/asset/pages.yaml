  md: '# Manage your emails with Thunderbird


    # Use Thunderbird as your mail client


    Setting up an account with Thunderbird is easy.

    Just click on the ''Email'' link on launch page. You then need to provide your
    email provider and password for your email address. Thunderbird determines connection
    details (such as port, server name) by looking up your email provider and can
    provide the details automatically.

    You need to configure your account manually if your email provider is not listed
    in Thunderbird''s database, or if you have a non-standard email configuration.
    To configure an account manually, you need to follow the following: email address,
    incoming mail server and port (e.g., imap.example.com and port 993), outgoing
    mail server and port (e.g., smtp.example.com and port 587), and the settings for
    the connection with the server (SSL/TLS authentication).


