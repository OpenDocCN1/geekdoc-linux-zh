  md: '# # Understanding the file system


    Learn about the file organisation in Ubuntu


    # ## Understand listing Learn the meaning of each column in the file listing output


    ### First column

    The first character indicates whether it is a directory or a file. The other characters
    indicate the permissions for owners, groups and everybody else


    ### File listing

    ''ls'' lists all the files in current directory. The -l extension shows files
    in long format, along with all hidden files. When except the root directory, it
    shows the directories in the top-level hierarchy


    ### Special files

    Whenever you use the ls command in directory, you''ll see these two files listed
    on the top. However, these aren''t visible if you inspect the directory via the
    GUI. The single dot indicates the current directory; double dot, the


