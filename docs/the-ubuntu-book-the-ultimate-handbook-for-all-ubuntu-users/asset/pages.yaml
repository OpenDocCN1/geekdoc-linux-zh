  md: '# Sharing files in Ubuntu


    # Tutorial Learn to set up a Samba client and server


    ![](img/f7324b6b514ca3a11b9cc564b062e918_40_0.png)


    # 01 Samba configuration


    To share a directory, you must have permission to access the directory. Let''s
    take a folder from the user''s directory, as Documents. Go to Documents, right-click
    on the directory in the pop-up menu, select Local Network Sharing. Then click
    ''Share this folder''. If Samba is not installed, you can click ''Install additional
    software'' and then install. If you get an error message that samba could not
    be found, open a terminal and update again.


    # 02 Samba clients


    Ubuntu and Gnome make it easy to access files from a Samba server. To start, go
    to the files and explore the Network link on the left vertical menu bar. Open
    this link and you will see your Samba servers. The new window shows all the domains/workgroups
    on your network. Inside each domain you will see all the computers on the domain/click
    on a computer to connect to it and share files.


    # 03 Samba configuration


    We learned about sharing the configuration files you can see more options and
    how to implement them if needed. Let''s learn how to enable sharing the configuration
    file.


    The main configuration file in Samba is smb.conf. It contains many comments in
    order to document various configuration files. First, edit the following key=value
    pair in the [global] section of the config:


    ```

    # sudo apt install samba

    ```


    Try Ubuntu and install Samba. Then let''s share the folder. Right-click on the
    directory in the pop-up menu, select Local Network Sharing. Next, click ''Share
    this folder''. Then click. That is, the directory should now be shared and accessible
    to other users. You can also install Samba GUI for. Just type:


    ```

    # sudo apt install samba-common

    ```


    Our search for Samba in the Ubuntu Software Centre and install it from there.
    Once installed, just search for system-samba.


    Note that the ''security'' parameter is further down the [global] section, and
    it is commented by default. Also, change the ''workgroup'' value from EXAMPLE
    to


    something that matches your environment. Then to share a directory, create a new
    section at the bottom of the file, or uncomment one of the examples:


    > share Ubuntu File Server

    path = /srv/vamba/Share

    shareable = yes

    guest = ok

    read only = no

    create mask = 0775


    Let''s look at the meaning of each section...

    comment: description of the directory. You can share it:


    path: the path to the directory you share.

    sabename: according to the Filesystem Hierarchy Standard (FHS), /srv is where
    site-specific data should be stored. Samba can be placed anywhere on the file
    system as long as the permissions are correct, then sharing is easy to set up.


    browseable: allows Windows windows to see the shareddirectory using Windows Explorer.


    guest ok: allows users to connect to the share without supplying a password.


    read only: if the share is only for read access. Guest privileges are applied
    only when the value is no, as seen in this example. If the value is yes, then
    access to the share is granted.


    create: defines the permissions when new files are created and modified. In a
    terminal,


    ```

    $ sudo mkdir -p /srv/samba

    $ sudo chown nobody:nobody /srv/samba

    ```


    Finally, Samba needs to restart the configuration:


    ```

    $ sudo restart smbd

    $ sudo restart restartbd

    ```


