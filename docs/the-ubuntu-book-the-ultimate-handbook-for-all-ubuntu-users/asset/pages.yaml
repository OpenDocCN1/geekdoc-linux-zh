  md: '# Manage drives with Disks


    # Tutorial Perform diagnostic and management tasks with your drives


    ![](img/f7324b6b514ca3a11b9cc564b062e918_42_0.png)


    01 Format a USB portable drive

    New drives you add to Disks will show no partitions at all Disks as a monotonous
    rectangle labelled ''Unknown''. You may choose how you want to do: if you want
    an upper limit on the size and format the drive then you will only create a partition
    table, not volumes. The legacy is MBR (Master Boot Record type), and GPT (GUID
    Partition Table) is first compatible with everything, but is required by PCs with
    UEFI boot and also drives. Next, you can choose the specific volume size, write
    curve below and format as you wish. If you plan to use your drive from Windows,
    use the NTFS filesystem. For Linux-only use, the best option would be to go with
    EXT4.


    02 Benchmark your drive

    Conducting performance tests is fun but challenging, especially for non-tech users.
    The Disks application in Ubuntu has a built-in tool that means you can benchmark
    your drive for free You can benchmark all volumes (the whole drive), or a volume
    you would like to test. For that reason, you can choose the specific partition,
    but there are no other options for the rest. Click on the ''gear'' tab and select
    ''Benchmark option'' or ''Benchmark drive''. This will show you the write curve
    for read and write speeds for access time. It can help you detect a dying drive
    before it is too late, and also compare real-world speeds of the newly bought
    drive with its hardware.


    03 Adjust standby settings

    Drive settings can be sensitive to desktop and laptop computers. Putting a drive
    into standby mode not only saves some watts but also reduces heating, and makes
    the system last longer. If you have a drive in Ubuntu, you can explicitly set
    it to sleep after a certain amount of time. Click on the ''gear'' icon and select
    ''Apply Standby Settings''. Switching to the ''I/O'' position. You may then select
    the preferred time, after which the drive will sleep. Enable disable write caching:
    click on the ''Write Cache'' tab to enable or disable it as needed. When caching
    is enabled, it works much faster but may lose data in case of power failure.


    04 Create an image and restore from

    A hard drive image is a very handy thing to plan back up files. It stores records
    and all other drive data, which you can restore onto another physical drive. In
    case of an aging drive, which you feel get risky any time, there is no better
    way to save it than create an image. Depending on what you want, you can choose
    to create an image of the drive, or the current partition. When you choose the
    ''Create Disk Image'' option, you will be prompted to choose a location and directory
    for the image file. Note that it must be saved on another physical drive. Later
    on you will be able to restore the drive file image using the ''Restore Disk Image''
    option.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_42_1.png)


