    Here you can see the list of all the files under Samba


    # Permissions


    If you''d like the directory you are sharing to be visible/writable, just tick
    the checkboxes


    # Save or cancel changes


    Click OK to save the changes to the Samba configuration file and start. If you
    hit Cancel, the changes are discarded


    The Ubuntu file manager offers an easy-to-use interface to help you share files
    across systems. Samba will let you access file and print services. It implements
    the Server Message Block (SMB)/Common File System (CIFS) protocol for Unix systems,
    supporting file and printer sharing across Windows, OS X and other systems.


    Samba is free, unlike other implementations, and is widely used over systems.
    You can facilitate the file sharing between Ubuntu and Windows computers by using
    Samba. Samba can do other things including as a server for servers: you can share
    printers, including pseudo-printers so all the computers in your network may write
    PDF files. Samba can also


    act as a domain controller in a Windows network (authenticating users, and so
    on) and help even using a Windows domain controller to authenticate users. However
    we will focus only on the file sharing aspect of Samba.


    Samba is not installed by default in Ubuntu 15.10 and so far you''ll have to install
    Samba. We will show the installation process and the steps to set up sharing in
    sections.


