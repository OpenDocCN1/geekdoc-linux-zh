    Handling partition tables with a GUI is simpler using fdisk


    # Navigating GParted An example to learn more about GPartedworks


    Commit button

    This button activates itself once some changes have been made to the partition.
    Click it to commit the new partition layout - please be aware that this operation
    can not be undoone


    Visual overview

    This diagram provides a visual overview of the content of the currently selected
    device. Each partition is shown as a little box which represents the relative
    size on the drive


    Free space

    Users rejoice whenever this grey symbol shows up. It stands for unpartitioned
    space - it is space which is currently not assigned to any usage


    ![](img/f7324b6b514ca3a11b9cc564b062e918_123_0.png)


    File system indicator

    Every operating has its own file system. This column informs you about the individual
    partitions: FAT is best for media which will be used in different operating systems


    Drive selector

    GParted works on a device-level focus. The checkbox at the top-right allows you
    to select which device you want to work on - a sure way to detect the correct
    candidate is identifying the size


    Partitions can be renam with easy-to-read names. If your partitions are renamed,
    the name will be displayed in the Label field


    Space consumption

    These columns provide a detailed overview of the capacity of the individual partitions.
    Each column displays information about the amount of space currently used


    Data table

    While a picture might say more than a thousand words, putting loads of information
    in one figure is problematic. GParted bypasses this by providing a data table
    containing all information on the partitions


    ![](img/f7324b6b514ca3a11b9cc564b062e918_123_1.png)


    Ubuntu''s usability is illustrated by the fact that GParted utility comes with
