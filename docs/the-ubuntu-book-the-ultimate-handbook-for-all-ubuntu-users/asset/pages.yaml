    Text Editor (also Gedit) is the default GUI editor in Ubuntu and the GNOME desktop
    environment. It is UTF-8 and supports many text editor features like syntax highlighting,
    checking, and a large number of third-party plugins. With multiple character sets,
    Text Editor can play a versatile role - you can use it to prepare


    notes and documents, or source code using such advanced features like integrated
    development environment. Gedit is installed by default on Ubuntu 15.10 and can
    be launched via Gedit or an application launcher. You can also use the gedit command
    to interact directly with the tool.


    To open a specific file with Gedit, type `<filename>` at the command prompt. To
    open multiple files, type `<filename> <filename> ... and


    so on. You can open a file at a specific line number by including `<line <number>`
    in the file path; like `gedit +line /etc/apt/sources`.

    Gedit offers several helpful options, including auto-save. For example, Gedit
    automatically creates a backup copy of your file if you are running low on space,
    however, you can disable this by going to Edit/Preferences/Editor and deselect
    "Create a backup copy."'
