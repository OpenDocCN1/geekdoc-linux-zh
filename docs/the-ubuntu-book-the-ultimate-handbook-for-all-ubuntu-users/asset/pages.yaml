    # # Tutorial


    Resolve typical security-related issues in Ubuntu


    #  01 Generate a stronger password

    There is no sense in setting your Ubuntu password as simple as 12345678 or P@ssword.
    It is sensible to invent a combination of symbols that is unique, long enough
    and most importantly something you will not forget. A good password contains lower
    and uppercase letters, characters and digits. Frankly, Ubuntu can help you deal
    with stronger passwords via the API utility. It sudo apt-get install will prompt
    you to generate a random password of your choosing, and you can then convert your
    suggestion into a stronger combination of characters, but still something readable
    and not too hard to remember - like Word3rd!WordIc-50.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_32_0.png)


    #  02 Enable automatic security updates

    Let''s get a little help make Ubuntu receive security updates without your interaction.
    This is very useful because not all updates are installed automatically. Security
    updates fix vulnerabilities, critical bugs, memory leakage and so on. To enable
    this, firstly installing the package with the required scripts:


    +   - sudo apt-get install unattended-upgrades


    Next, enable updates with following:


    ```

    $ sudo apt-get --reconfigure-priority=low

    unattended-upgrades.

    ```


    All you have to do is add unattended packages to your Cron list on daily/monthly
    basis. First do it at /etc/


    #  03 Enable firewall

    Firewall is an effective tool for blocking network intrusions from the outer world
    and limiting suspicious activity in both directions. You can control specific
    ports and protocols. The ufw is the ''tools'' that for beginners. Ubuntu has a
    first-in firewall called UFW (Uncomplicated Firewall) but its default status is
    inactive.


    ```

    $ sudo apt-get install ufw

    ```


    You can control it from command line (sudo ufw) --or via a graphical interface
    (search for Firewall in apps or launch guufw).


