    ![](img/f7324b6b514ca3a11b9cc564b062e918_102_1.png)


    # 03 Filter your tracks


    Return to the main interface of RhythmBox and present all of them in the library.
    If the files were not present, part of the files will be shown in the ''Unknown''
    category - most files will be categorized according to their detail. Double-click
    the track in the table to start the play-back process.


    # 04 Search for tracks


    Even though RhythmBox''s file list represents nothing over Nautilus, searching
    thousands of files is not everyone''s cup of tea.


    The text field below is intended to accept query strings. ''Wildcard'' would limit
    the list to songs which matches any of its text fields. Entering longer strings
    reduces the amount of data shown - if you know the name of one.


    Alternatively, right-clicking on any song will open a menu. By default you will
    see three choices: Select, Artist and Album can be used as for search queries.
    The results will be, shown in the list.


    # 05 Create playlist


    Five tracks can be created in a playlist by clicking the little plus at the bottom-left
    of the library window. Then, click ''New Playlist'' and proceed to enter the name
    of the new playlist. Finally, repeat this - RhythmBox will be contained within
    the list


    # 06 Populate the playlist


