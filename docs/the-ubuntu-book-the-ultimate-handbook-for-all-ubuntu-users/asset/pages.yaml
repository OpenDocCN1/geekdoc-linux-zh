  md: '# Accessibility in Ubuntu


    Learn to use the accessibility tools and options in Ubuntu


    Usability was a prime concern developing Ubuntu. Developers worked hard to ensure
    that Ubuntu is as easy as possible for people of all ages, languages and physical
    abilities. This was not without; providing an accessible platform with high-quality
    tools, and making other works with these, a feat only an open-source approach
    could achieve.


    Ubuntu provides several accessibility options for people with different needs.
    For visually challenged users, Ubuntu offers Orca. Using various combinations
    of speech and synthesis, Brace offers access to applications and tools that support
    the assistive technology interface (AT), for example the DOME magnifier. The screen
    reader can be enabled at any time when needed in a desktop session with Ubuntu.
    Orca


    can be enabled and disabled using the Alt+Super+S shortcut. For mobility impairments,
    Ubuntu offers options for modifying the behaviour of the mouse and keyboard. The
    modifier keys (Shift, Ctrl and Alt) can be made sticky when they are pressed,
    remain active until the next key is pressed. There are several other accessibility
    options that users can adopt to make their interactions with Ubuntu seamless.


