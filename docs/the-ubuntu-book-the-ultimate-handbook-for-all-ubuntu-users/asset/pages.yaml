  md: '# # Adopting the full version of Ubuntu


    New versions are released every six months and supported for 18 months


    As noted previously, Ubuntu is a very popular distribution with many years of
    maturity under it and a huge user base. After becoming comfortable with the initial
    features of Ubuntu, now is time for you to take a look at Ubuntu full. Before
    installing any version of the Ubuntu installation, in addition, you will have
    to ensure that your system meets the minimum requirements. The most common method
    of obtaining Ubuntu is from the official site: ubuntu.com/download. For downloading
    and installing, you will need to select whether the 32-bit or 64-bit version and
    then start download.


    It is important to understand that Ubuntu is available in 32-bit and 64-bit versions.
    They differ only in processor architecture. If your computer has a 64-bit processor,
    you will need to install the 64-bit version. If you have a 32-bit processor, it
    is advisable to install the 32-bit version.


    Amount of free space on your hard drive is required for installing Ubuntu. The
    recommendation is to have 15GB or more. This will give you enough space to install
    extra applications, as well as to store your system settings and files.


    If you have internet connection, then the installer will ask you if you want to
    "Download updates while installing". It is highly recommended to perform this
    step.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_9_0.png)


    # Install


    # Preparing to install Ubuntu


    For best results, please ensure that your computer:


    +   - has at least 4.4 GB available drive space

    - is plugged in to a power source

    - is connected to the Internet


    Download updates while installing


    Ubuntu uses third-party software to display Flash, MP3 and other media, and to
    work with some wireless hardware. Some is closed-source. The software is subject
    to the license terms included with the software''s documentation.


    Install third-party software


    Firefox MP3 plugins include MPEG Layer-3 audio decoding technology licensed from
    Rounhofer and Technicolor SA.


    > If you have an older processor or you do not know the type of the processor
    it is, it is advisable to install the 32-bit version


    # Options for installation


    You can install Ubuntu alongside other OS or replace it


    The Ubuntu installer will automatically detect existing operating system on your
    machine and present installation options for you. Please note the options below
    depending on your specific system and what may be available:


    +   - Install other operating systems

    - Upgrade Ubuntu to 14.04

    - Erase Ubuntu

    - Something else


    Of all the four options, the best is Upgrade to 14.04, as this will allow you
    to keep all your documents, music, pictures and any other personal files on the
    computer drive.


    # drive space


    ![](img/f7324b6b514ca3a11b9cc564b062e918_9_1.png)


    retained when possible and system-wide settings will be cleared.


    The erase disk and install Ubuntu option if you want to erase your entire disk.
    This will delete any existing operating system that is installed on it and install
    Ubuntu in its place.


    When you choose the erase disk option, you will be able to configure the partitions
    before installing Ubuntu.


    You may need an internet connection to reduce the time required for installation.
    Ubuntu will continue the installation process in the background while you use
    some features like user accounts, keyboard settings, the time zone and sort.


    # Internet connection


    It is important to have an internet connection during the Ubuntu installation
    process. If you are not connected to the Internet, the installer will ask you
    to choose a network and follow the next steps in a scenario:


    +   1. Select your ''network'' and then you will need to choose from the list.


    +   2. In the ''Password'' field, enter your router''s WEP or security key.

    3. Then click ''Connect'' to internet.


