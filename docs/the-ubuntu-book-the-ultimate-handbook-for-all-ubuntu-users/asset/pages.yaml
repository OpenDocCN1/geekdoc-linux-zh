  md: '# Programming Tools


    # RadRails Ruby/Ruby on Rails


    Make apps and solve the mysteries of the universe with these amazing tools


    A standalone IDE or plugin, RadRails is a favourite IDE for Ruby objects. It''s
    great on its own if you work exclusively in Ruby, with an integrated debugger
    and other helpful features, such as code assist and structure hierarchy to make
    navigation easier. The Eclipse plugin concept is great, as it enables you to use
    Ruby alongside other code in a familiar environment.


    # # Top IDEs


    Coding is a mainstay of Linux activity and no matter what language you''re writing
    in, you''re going to need an integrated development environment that''s stocked
    with all of the right tools and features. You''ll need plugins, intelligent formatting,
    debugging tools and more. Basically, you need these IDEs...


    ![](img/f7324b6b514ca3a11b9cc564b062e918_114_0.png)


    ![](img/f7324b6b514ca3a11b9cc564b062e918_114_1.png)


    # IntelliJ Java/Javascript


    Part of a network of IDEs, IntelliJ prides itself as being the intelligent IDE
    (whatever that means), and in our experience it is pretty great. As well as smart
    code completion gives you suggestions and helps you know what a function needs,
    it checks the code and senses problems. It''s good for web-based Java and creating
    applications.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_114_2.png)


    # Eclipse C/C++


    A very popular and powerful IDE. Eclipse is perfect for coding in C and its derivatives
