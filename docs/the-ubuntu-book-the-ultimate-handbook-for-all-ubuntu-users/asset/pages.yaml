  md: '# Explore LibreOffice Writer


    # Working with graphics


    There are many ways to use graphics in Writer. You can insert image files, as
    photos, drawings and scanned images. You can also insert diagrams using LibreOffice
    drawing, or charts created using LibreOffice Chart. Writer supports raster formats
    like GIF, PNG and BMP.


    You can add graphics by inserting an image directly from a graphics program or
    a scanner, from a file stored on your computer, or by copying and pasting a modified
    picture using Picture toolbar.


    Writer provides built-in drawing tools to create graphics. If you need basic diagrams,
    you can navigate to Viewbars/Drawing. For simple diagrams, you can draw rectangles,
    lines, text and predefined shapes, and group drawing objects to maintain their
    relative position and proportion. To give extra control over the drawing, you
    can reposition the objects by sending them to the back or front.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_76_0.png)


    # Tracking changes


    # Learn to track changes during revisions


    Writer lets you track changes in different versions of a document. A simple way
    is to create a duplicate and make changes there. However, this method can be used
    if just one person is working on the document. Use the Change Marks option. Later
    on, others can accept or reject the changes. To check the accepted changes navigate
    to File/Track Changes. If you want to navigate to File versions,


    save it as a separate document with a different name and use it as the reference.
    To record the changes, check Edit/Changes/Record. To merge changes by clicking
    Edit/Changes/Merge Document. To merge changes made in the original document and
    check Edit/Changes/Merge Document After merging, accept or reject the changes
    that have been made.


    # Master document


    # Learn to use master documents


    If you have many files and want to group them into one document, you can create
    a master document .ODM, ODM files are used to manage multiple documents. It unifies
    the formatting, table of contents (TOC), bibliography, index, and other lists.


    Writer can split the document automatically into several subdocuments with this
    function, click File/Send/Master Document, Then specify


    the name and location for the files, and in ''separated'' by choose the outline
    level where the file should be inserted in various sections of your document.


    To combine with a master document, open up one and click the Insert icon in the
    navigator, and hold on the Insert mouse cursor to release the selected files.
    Select the files you would like to include and use Move/Move Up to position them


    ![](img/f7324b6b514ca3a11b9cc564b062e918_76_1.png)


    # Database integration


    Writer can be used for creating forms. This is done via two tools: Form Design
    and Control. If you want to create a form for gathering information, click the
    Design Mode button to activate the forms. In Form Design toolbar, insert items
    like Name as a text box, gender as an anchor box, list of options, and Hobbies
    as checkboxes. Now define the form you want.


    Forms are generally used as a front-end for databases. LibreOffice can access
    data sources like ODBC, MySQL, Oracle, spreadsheets and text files. Connect to
    database with LibreOffice navigate to File/NewDatabase and ''Create a new database''.
    On the next page, register the database and ''Open the database for editing'';
    this makes it available for other LibreOffice components.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_76_2.png)


    * **


    The Ubuntu 77'
