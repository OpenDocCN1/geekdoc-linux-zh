    # # Explore the Ubuntu Software Centre


    The flavours of Ubuntu are the set of packages installed on the system. The Software
    Center is the one-stop shop for installing, purchasing and removing software in
    Ubuntu


    +   * Ubuntu Software Center, aka USC, is a package management portal that is,
    a consolidated platform where you can install, search and remove ever software.

    Initially installed on 29 October 2009, Ubuntu Software Center is developed in
    Python and contains more than 53,000 programs.

    Previously, Ubuntu programmes were downloaded from the repository as tar files,
    unzipped and installed by manually running the commands in the console. With the
    start of search, many graphical utilities for installing/removing software, which
    ultimately led to redundancy and fragmented development effort. To ease this cumbersome
    process, came with worthwhile approach where all the


    software is installed with the click of a few buttons. The search for software
    ends here as USC has name/description-based search; functionality, with ratings
    and reviews, multiple options to choose from. The rating and users'' reviews in
    Ubuntu App provides developers a way to offer their software to users.


    The latest version of USC, with some improved features and software like the LibreOffice
    suite, Mozilla, text editors, etc which are displayed in the left sidebar. Use
    the shopping bag icon in Display and click it to launch Ubuntu Software Center.
    Upon the launch of USC, the home screen shows, different categories of software,
    recommended software, newly added software, top


    rated and many more. For instance, you''re looking for a text editor, you can
    type the keyword in the search bar, which shows the different text editors present
    in USC in a list. You can select any one of them and click install button to start
    using.


