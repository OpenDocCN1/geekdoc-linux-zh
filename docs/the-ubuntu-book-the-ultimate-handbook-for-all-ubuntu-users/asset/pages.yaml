  md: '# Accessibility in Ubuntu


    # Orca screen reader


    The Orc screen reader can be enabled at any time when you are logged into Ubuntu
    installation. Orca screen reader will be loaded subsequent time you log in to
    your session. Orca can be enabled and disabled using the Alt+Super+S shortcut.
    However, you can also enable Orca using the same shortcut key at the login screen.
    The super key is also known as the Windows key.


    It is also possible to enable Orca at install, which will make that it will be
    able to guide you and help you independently install Ubuntu on your system that
    has no sound. At this point, you can go ahead and enable Orca. Again, the keyboard
    shortcut Alt+Super+S is used to enable Orca.


    Orca should start speaking, and from this point you can select your language,
    and enter boot into Ubuntu desktop by selecting the ''Try Ubuntu'' buttons, or
    you can install Ubuntu by selecting the ''Install Ubuntu'' buttons.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_38_0.png)


    # Orca screen reader can be enabled at any time when logged in


    # Dasher


    # Enter text without the keyboard


    Dasher provides an intuitive way to enter text without using the keyboard. With
    Dasher, you point your mouse and the display shows where you point. In the areas
    which you zoom in, the text grows, so that any point you zoom in becomes a piece
    of text. The larger the zoom, the larger the text. You choose where by choosing
    where to zoom.


    In order to make the interface efficient, Dasher uses predictions of language
    so how much of the world is divided into pieces of text. Each piece of text is
    given more space, so they are quicker. Pieces of text (even with spelling mistakes)
    are given less space. Dasher is not installed by default on Ubuntu; you can install
    it via Ubuntu Software.


    # Keyboard modifiers


    Learn to use keyboard shortcuts


    There are several options, such as sticky keys, loops and bounces that can change
    the keyboard-behavior and help you use the keyboard more effectively.


    The modifier keys (Shift, Ctrl, Alt) stay sticky that when pressed they remain
    active until the next key press to write uppercase characters or use keyboard
    shortcuts while pressing a key down. Sticky Keys and Bounces Control the


    reaction rate and repeat rate of keys, whereas Mouse Keys allows the numerical
    key to be used as mouse. Ubuntu also includes the on-screen keyboard, a text-entry
    application, which is highly customizable and supports layouts. To enable these
    options, you will have to go to the Settings -> Accessibility -> Keyboard. Go
    to the ''Typing'' tab. You will see the settings for the on-screen keyboard, sticky
    keys, slow keys and many others.


    # Mousekeys


    For users who cannot a hardware button, there is a feature named Mousekeys that
    enables them to perform the various clicks by software. Mousekeys offers several
    features to use: system-wide click through, usually called dwelling, and system-wide
    simulated right click through a click and the left of button (course, for left-handed
    users, the terms left and right have to be inverted). It provides an area to move
    the pointer (locked by a key range) to process the input (user movements) into
    mouse events (movements and clicks), which allows users to interact with different
    desktop managers and applications. Mousekeys is installed by default in Ubuntu
    15.04, and can be easily launched via the terminal. Just type ''mousekeys'' in
    the terminal.


