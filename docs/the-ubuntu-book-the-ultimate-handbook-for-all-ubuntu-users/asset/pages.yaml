  md: '# Ubuntu flavours


    # What''s your Ubuntu flavour?


    Canonical recognises Ubuntu flavours - custom Ubuntu versions shipped with different
    desktop environments, or designed for specific usage


    Ubuntu is a Linux distribution that ships with the Unity desktop. However, there
    are other desktops, such as KDE, GNOME, MATE, XFCE and others with their own established
    communities. Technically, changing a desktop requires installing another set of
    packages, that are all part of Ubuntu. This way you can install all of them and
    choose which you want to use at login screen. Ubuntu works fine with multiple
    desktops, but you might encounter some user experience minor details like icons
    from one desktop appearing in a system tray of another or merged interfaces.


    A custom Ubuntu with a desktop other than Unity, or with specific usage focus
    is called a "Ubuntu Flavour". Everyone builds her own clone of Ubuntu with whatever
    tweaks added applications and so on, but here we are reviewing so-called "Ubuntu
    flavours". Ubuntu delivery with an official flavour is that the latter has been
    recognised by the Tech board of main Ubuntu team and thus, the official support
    means that Canonical provides the infrastructure for building and launching flavours.
    Ubuntu team members monitor in the public tag tracker of flavour, and a community
    manager from a flavour directs them of official Ubuntu release schedule. Recognised
    Ubuntu flavours are often released alongside Ubuntu release announcements and
    share Ubuntu flavours and improvements once they are not desktop-specific. There
    are no significant differences, in terms of hardware and software compatibility,
    and almost any application for Unity works well until it is reported to work with
    the flagship Ubuntu distribution.


