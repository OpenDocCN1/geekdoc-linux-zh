  md: '# # Get started with Ubuntu


    # # What next?


    It''s all too easily to delete a file - we''ve all done it. If it happens, the
    good news is that you will still be able to recover the file from Ubuntu''s Trash
    folder. Ubuntu stores deleted files before they are permanently removed from your
    computer. Follow these steps to recover a file:


    ![](img/f7324b6b514ca3a11b9cc564b062e918_13_0.png)


    # Troubleshooting and software management in Ubuntu


    When you are using Ubuntu, things might not work as expected. The good thing is
    that the problems encountered while working with Ubuntu troubleshooting is complete
    with all the steps and the changes you make, so that you will be able to maintain
    and also to pass the details about your work to other users. Let us take a quick
    look at the most common problems users might face with Ubuntu:


    # ## Trash folder


    If you need to restore an item, select it in the Trash, Click ''Restore selected
    items'' and this will move the deleted items back to their original locations.


    ![](img/f7324b6b514ca3a11b9cc564b062e918_13_1.png)


    # ## Issues with hardware


    In some scenarios, Ubuntu may have difficulties with certain hardware. The good
    thing is that the Ubuntu community has many resources that can help you work over
    many problems. The Ubuntu hardware troubleshooting guide is available at www.ubuntu.com/HardwareSupport.
    Let''s look at how Ubuntu can be installed. Ubuntu uses a set of software utiles
    like a package management system to install software. Package management is a
    collection of tools that will make the life of a user easier when installing,
    upgrading, and configuring software. A package manager provides information about
    the software - including the version, structure and dependencies. By default,
    you can browse the repositories for searching, installing and removing software.


    # ## Forget your password?


    If you forget your password, you can reset it by using ''Recovery Mode''. To start
    the Recovery Mode, you need to shut down your computer and start it again. Hold
    the Shift key and then select the Recovery option on your keyboard. Once booted,
    in a normal login screen, you will see a Menu. Select root and press Enter to
    enter the root terminal.


    # ## How to clean?


    Unused packages and temporary files will be accumulated in Ubuntu''s packaging
    system. Cleaning allows us to reclaim space on our computer. We have two options
    - clean and autoremove - for this using the following command:


    ```

    ```sudo apt-get clean```

    ```


    +   1. Ubuntu Software Centre

    2. Command-line apt


    With the help of the Software Centre, you can search, install and remove applications
    easily. It is regarded as the most common application management system used by
    novice and expert users. In Ubuntu, software is delivered in packages. With one
