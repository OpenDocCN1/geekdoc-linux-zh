  md: '# 5.1 THE LANGUAGE OF FAILURE: MASTERING EXIT CODES


    Every command returns an exit code upon completion, which is stored in the $ variable.
    * 0: Success. Everything is okay. * 1-255: Failure. Something went wrong.


    Using set -e reacts to these codes, but as an advanced scripter, you need to understand
    them and set them yourself.


    +   • Setting exit codes explicitly: exit 1 (general error), exit 127 (command
    not found), etc.


    +   • Importance: Automation tools like cron, systemd, or CI/CD pipelines rely
    on correct exit codes to decide if a job was successful.


    Pro Tip: There is a quasi-standard for exit codes documented in /usr/include/sysexits.h.
    Using these codes (e.g., 64 for bad arguments, 70 for an internal software error)
    makes your scripts more understandable to other system administrators.'
  merge: -1
  pgno: 66
- img_proc: true
  md: "# 5.2 THE SAFETY NET: CLEANING UP WITH TRAP EXIT\n\nWhat happens to your script's\
    \ temporary files when it aborts midway? They are left behind as clutter. The\
    \ trap command intercepts signals and executes a command of your choice when they\
    \ are received.\n\nThe most important trap is trap ... EXIT. It is always executed\
    \ when the script ends, regardless of whether it was a successful completion,\
    \ an error (set -e), or an external signal like Ctrl+C (SIGINT).\n\n# The Classic\
    \ Cleanup Pattern:\n\n```\n#!/bin/bash\nset -e\n# Create a secure temporary file\n\
    # -d creates a directory, which is often better\ntemp_dir=$(mktemp -d)\n# Define\
    \ the cleanup function\ncleanup() {\n  echo \\=> Performing cleanup...\"\n  #\
    \ 'rm -rf is safe because $temp_dir is absolute and came from mktemp\n  rm -rf\
    \ \"$temp_dir\"\n  echo \"=> Temporary directory '$temp_dir' removed.\"\n}\n#\
    \ Register the function for the EXIT signal\ntrap cleanup EXIT\necho \"Temporary\
    \ directory created: $temp_dir\"\necho \"Working with files...\"\ntouch \"$temp_dir/file1.txt\"\
    \nsleep 5 # Simulate work. Press Ctrl+C here!\necho \"Work finished.\"\n# The\
    \ script ends here, 'trap' is triggered\n```"
  merge: -1
  pgno: 67
- img_proc: true
  md: No matter how you exit this script, the cleanup function will be executed and
    the directory will be deleted.
  merge: -1
