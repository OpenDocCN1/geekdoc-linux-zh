  md: "# 13.1 ARGUMENT PARSING: GETOPS INSTEAD OF $1 CHAOS\n\nProcessing arguments\
    \ $1, $2, etc., quickly becomes messy and error-prone. What if options come in\
    \ a different order? What about combined flags like -vf? getopt is the built-in,\
    \ POSIX-compliant solution.\n\nThe gets Loop: getopt is used in a while loop that\
    \ runs as long as options are found.\n\nSyntax: while gets \"optstring\" opt;\
    \ do ... * optstring: Defines the allowed options. A colon after a letter means\
    \ that option expects an argument (e.g., i:o:vh). The leading colon enables silent\
    \ error mode, which we to handle ourselves. * opt: A variable that holds the found\
    \ option letter in each iteration. * SOPTARG: Contains the argument of an option\
    \ if one is required. * SOPTIND: The index of the next argument to be processed.\n\
    \nExample: A script that accepts an input file, an output file, and a verbose\
    \ mode.\n\n```\n#!/bin/bash\n# Default values\nVERBOSE=false\nOUTPUT_FILE=\"\"\
    \nINPUT_FILE=\"\"\nusage() {\n  echo \"Usage: $0 -i <input_file> [-o <output_file>]\
    \ [-h]\"\n}\nwhile gets \":i:o:vh\" opt; do\n  case $opt in\n    i) INPUT_FILE=\"\
    $SOPTARG\";\n    o) OUTPUT_FILE=\"$SOPTARG\";\n    v) VERBOSE=true ;;\n```"
  merge: -1
