  md: '# 3.4 THE MASTER CLASS: INDIRECT EXPANSION AND MORE


    **Indirect Expansion**: ${!prefix*} or ${!prefix@} This is one of the most powerful
    but also most confusing techniques. It allows you to get the name of a variable
    dynamically from another variable.


    ```

    var_name="USER"

    echo "The value of the variable whose name is in ''var_name'': ${!var_name}"

    # -> The value of the variable whose name is in ''var_name'': [your username]

    ```


    **Case Modification (Bash 4+):


    +   - ${variable}: First letter to uppercase.

    - ${variable,}: First letter to lowercase.

    - ${variable^^}: All to uppercase.

    - ${variable,,}: All to lowercase.'
