  md: '# APPENDIX O: DECISION MATRIX: SHELL SCRIPT VS. HIGHER-LEVEL LANGUAGE


    Use this table as a guide to decide which tool is best suited for a given task.


    | Task / Requirement | Best Choice | Better Choice | Rationale |

    | :--- | :--- | :--- | :--- |

    | Chaining Commands / "Glue Code" | Shell Script: Yes | Python/Go/etc.: No | This
    is the absolute core competency of the shell. |

    | Rapid Prototyping | Shell Script: Yes | Python/Go/etc.: Yes (Python) | The shell
    is unbeatable for small prototypes. Python is a close second. |

    | Log Analysis / Text Manipulation | Shell Script: Yes (with grep, sed, awk) |
    Python/Go/etc.: Yes (Python) | Shell pipelines are extremely powerful. Python
    offers more structure for complex logic. |

    | Complex Data Structures (Objects, Graphs) | Shell Script: No | Python/Go/etc.:
    Yes | The shell has only simple arrays. Higher-level languages are essential for
    this. |'
