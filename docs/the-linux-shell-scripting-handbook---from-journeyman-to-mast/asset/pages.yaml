    \ filter; outputs the entire input, pretty-printed. * .key: Access a value by\
    \ its key. *.[index]: Access an array element by its index.\n\n**Piping** curl\
    \ to jq: This is the fundamental workflow.\n\n```\n# Get the username\ncurl -s\
    \ ... | jq '.user.username'\n# -> \"alice\" (Note the quotes, it's a JSON string)\n\
    # To get the raw string without quotes, use the -r flag\ncurl -s ... | jq -r '.user.username'\n\
    # -> alice\n# Get the first role\ncurl -s ... | jq -r '.roles[0]'\n# -> editor\n\
