  md: "# 14.1 THE LOCAL GUARDIANS: QUALITY ASSURANCE WITH GIT HOOKS\n\nGit Hooks are\
    \ scripts that Git automatically executes when certain events occur (e.g., before\
    \ a commit or before a push). They reside in the .git/hooks/ directory of every\
    \ repository.\n\n**The pre-commit Hook: A Final Check Before Checking In** This\
    \ is the most popular hook. It runs before a commit is created. If the script\
    \ exits with a non-zero exit code, the commit is aborted. It's the perfect place\
    \ to run linters like shellcheck.\n\nExample: A pre-commit hook that checks all\
    \ modified shell scripts with shellcheck.\n\n**Create the file .git/hooks/pre-commit\
    \ and make it executable:**\n\n```\n#!/bin/bash\nset -eo pipefail\necho \"Running\
    \ pre-commit...\"\n# Find all .sh files that are \"staged\" for the commit\nSTAGED_SH_FILES=$(git\
    \ diff --cached --name-only --filter=ACMR | grep '\\.sh$')\nif [ -z \"$STAGED_SH_FILES\"\
    \ ]; then\n  echo \"No shell scripts to check.\"\n  exit 0\nfi\necho \"Checking\
    \ the following shell scripts with shellcheck:\"\necho \"$STAGED_SH_FILES\"\n\
    # Run shellcheck on each file. If one fails, the script exits due to 'set -e'.\n\
    echo \"$STAGED_SH_FILES\" | xargs -n 1 shellcheck\necho \"All shell scripts are\
    \ clean. Proceeding with commit.\"\nexit 0\n```"
  merge: -1
