  md: '| Task / Requirement | Best Choice Shell | Better Choice: Python/Go/etc. |
    Rationale |

    |---|---|---|--|

    | CPU-Intensive Calculations | No | Yes (Go, Rust, C++) | The interpreted nature
    of the shell is a massive disadvantage here. Compiled languages are necessary.
    |

    | Interacting with Web APIs | Yes (with curl + jq) | Yes (Python + requests) |
    Good for simple queries, but libraries offer better error handling, sessions,
    etc. |

    | Requires a GUI or Web Frontend | No | Yes | Completely outside the scope of
    the shell. |

    | Large, Team-Maintained Project | No | Yes | Higher-level languages offer better
    testability, modularity, and tools for collaboration. |

    | Maximum Portability on Unix Systems | Yes (#!/bin/sh) | No | A POSIX shell is
    available on virtually every system. |'
