  md: "# 4.2 SCOPE: THE MOST IMPORTANT RULE FOR STABLE FUNCTIONS\n\nScope defines\
    \ where a variable is visible and valid. In Bash, there are only two scopes: global\
    \ and local (within a function).\n\nThe Danger of Global Variables (The Default\
    \ Behavior) By default, every variable you declare is global. This means it is\
    \ visible and modifiable everywhere in the script—including inside functions.\n\
    \nThe Catastrophic Example:\n\n```\n#!/bin/bash\ncount=10 # Global counter variable\n\
    \ A function that supposedly counts something else\ncount_files_in_dir() {\n#\
