    log_error() {\n    local message=\"$1\"\n    # Write to stderr\n    echo \"[$(date+%F\
    \ %T)] [ERROR] $message\" >&2\n}\n```\n\n**A main script** main.sh that uses the\
    \ library: The shorthand, reads the specified file and executes its contents in\
    \ the context of the current shell. This makes all functions from logging.sh available\
    \ in the main script.\n\n```\n#!/bin/bash\nset -euo\n# Source my logging library.\
    \ The path must be correct.\n# `dirname \"$0\"` refers to the directory script\
    \ itself is in.\nsource \"$(dirname \"$0\")/logging.sh\"\nlog_info \"Script started.\"\
