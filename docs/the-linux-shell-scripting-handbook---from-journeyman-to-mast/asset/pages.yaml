  md: '# 5.5 PROFESSIONAL LOGGING STRATEGIES


    Where should all the echo and error messages go?


    +   1. Logging to a File with exec: To redirect the entire output of a script
    to a file without modifying every echo command.


    ```

    #!/bin/bash

    LOG_FILE="/var/log/my_script.log"

    # Redirect stdout and stderr to the log file

    # The ''tee'' command allows output to also go to the console

    exec >(...) >2

    echo "This info message will go to the log."

    is /error # This error message will also go to the log.

    ```


    +   2. Logging to the System Log with logger: The most professional way is to
    use the system logger (syslog). The logger command makes this easy.


    ```

    #!/bin/bash

    # -t tag makes messages easy to filter

    logger -t "MyBackupScript" "Backup process started."

    # ...

    if ! tar -czf /backup/backup.tar.gz /home; then

    # -p sets the priority/facility (local0.error)

    logger -t "MyBackupScript" -p local0.error "Backup failed!"

    exit 1

    fi

    logger -t "MyBackupScript" "Backup completed successfully."

    ```


    These messages can be viewed centrally with journalctl -t MyBackupScript or in
    /var/log/syslog.'
  merge: -1
