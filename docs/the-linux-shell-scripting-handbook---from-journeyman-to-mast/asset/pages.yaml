  md: '# 1.3 THE ART OF CONTROL: SET AND SHOPT


    By default, Bash is very forgiving. This is good for interactive work but a disaster
    for scripting. Activate “strict mode” at the beginning of every serious script.


    ```

    #!/bin/bash

    # Unofficial Bash Strict Mode

    set -euo pipefail

    IFS=$IFS''\n\t''

    ```


    +   * set -e (errexit): Exits the script immediately if a command exits with a
    non-zero status.


    +   * set -u (nounset): Exits the script when trying to use an undefined variable.
    Prevents countless bugs for typos.


    +   * set -o pipefail: The return value of a pipeline is the status of the last
    command to exit with a non-zero status (or zero if all commands succeed). Without
    this, erroneous_command|true would be considered a success!


    +   * shop: Toggles Bash-specific options on or off. One of the most useful is
    globstar.


    +   * shop -s globstar: Enables recursive file searching with **. Example: ls
    -l **/*.log finds all .log files in all subdirectories.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1.4 USING ENVIRONMENT VARIABLES CORRECTLY: THE DIFFERENCE BETWEEN VAR=VALUE
    AND EXPORT VAR=VALUE


    This is a fundamental, and often misunderstood, point.


    +   - A shell variable (VAR="value") exists only within the current shell instance.

    - An environment variable (export VAR="value") is inherited by all child processes
    launched from that shell.


    # Practical Example:


    +   1. Create a file test_var.sh with the content echo "The variable is: $MY_VAR"

    2. Make it executable: chmod +x test_var.sh

    3. In your terminal, run:


    ```

    $ MY_VAR="Hello World"

    ./test_var.sh

    The variable is: # The variable is empty!

    ```


    +   1. Now, with export:

    $ export MY_VAR="Hello World"

    ./test_var.sh


    The variable is: Hello World # Now it works!


    The export command made the variable visible to the child process script


    test_var.sh.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 1.5 HANDS-ON WORKSHOP: BUILDING A PROFESSIONAL .BASHRC


    Let’s put theory into practice. Here is a well-structured template for your

    .bashrc.


    ```

    # ~/.bashrc

    # If not running interactively, don''t do anything

    [[ $S != * ]] && return


    #

    # 1. Strict Mode

    #

    # (Optional for interactive shells, but good practice)

    # set -uo pipefail


    #

    # 2. Environment Variables

    export EDITOR=''vim''

    export PAGER=''less''

    # Add personal scripts to the PATH

    export PATH="$HOME:$HOME/.local/bin:$PATH"


    #

    # 3. Shell Options with shopt

    #

    # Enable recursive globbing (**)

    shopt -s globstar

    # Correct spelling errors in directory changes

    shopt -s cdspell


    #

    # 4. Aliases

    #

    # Source aliases from a separate file for better organization

    ```'
