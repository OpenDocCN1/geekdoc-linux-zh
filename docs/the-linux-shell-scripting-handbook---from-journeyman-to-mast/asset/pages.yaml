  md: '# 9.1 CURL: YOUR SWISS ARMY KNIFE FOR THE WEB


    curl can do much more than just download a file. It''s a powerful tool for any
    kind of HTTP interaction.


    **Essential curl Options:** * -X METHOD: Specify the HTTP method, e.g., -X POST,
    -X DELETE. * -H "Header: Value": Add a custom HTTP header. Essential for setting
    Content-Type Or Authorization. * -d ''data'': Send data in the request body, typically
    for POST or PUT requests. * -i: Include the HTTP response headers in the output.
    * -s: Silent mode. Don''t show progress meters or error messages. * -L: Follow
    redirects (3xx status codes).


    *Example: Making a simple POST request to a JSON API*

    # We tell the server we are sending JSON and provide the JSON data.


    ```

    curl -X POST \

    -H "Content-Type: application/json" \

    -d ''{"username":"alice","score":100}'' \\

    https://api.example.com/v1/user/profile

    ```


    **Handling Authentication:** Most APIs require authentication. A common method
    is using a bearer token in an Authorization header.


    ```

    API_TOKEN="your_super_secret_token_here"

    curl -s -H "Authorization: Bearer ${API_TOKEN}" \

    https://api.example.com/v1/user/profile

    ```


    (Remember the lessons from Chapter 10: Never hard-code secrets!)'
  merge: -1
