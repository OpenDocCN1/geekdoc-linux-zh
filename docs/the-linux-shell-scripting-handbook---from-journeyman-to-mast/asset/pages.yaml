  md: '# 11.4 SSH TUNNELING: A SECURE CORRIDOR THROUGH THE INSECURE NET


    Imagine you have a database server whose port (e.g., 5432) must not be accessible
    over the internet for security reasons. But you need to access it from your laptop.
    An SSH tunnel (also called port forwarding) is the solution.


    Local Port Forwarding (-L) This command opens a port on your local machine and
    securely forwards all traffic sent through the SSH connection to the destination
    server, and from there on to the target service.


    Syntax: ssh -L LOCAL_PORT:TARGET_HOST:TARGET_PORT_BASTION_HOST


    Example: ssh -L 8000:db-server.internal:5432 user@bastion-host.com


    +   * What happens?


    +   1. You establish a normal SSH connection to bastion-host.com.

    2. SSH opens port 8000 on your laptop (localhost).

    3. When you now connect to localhost:8000 with a database client, SSH intercepts
    this connection.

    4. The traffic is sent, encrypted, through the tunnel to bastion-host.com.

    5. The bastion-host.com server decrypts the traffic and forwards it to db-server.internal:5432.


    You can now work with your local database tool as if the database were on your
    own machine, even though it’s safely behind behind a firewall.'
  merge: -1
