  md: '# INTRODUCTION: OPERATING IN THE HEART OF THE SHELL


    Until now, you''ve likely treated variables as simple storage containers: you
    put a value in VAR="value" and get it back out (echo $VAR). When you needed to
    manipulate that value—for instance, to separate a filename from its path or replace
    spaces with underscores—you probably reached for external tools like cut, basename,
    or sed. but it''s like calling a crane to hammer a nail into a wall. Every call
    to an external command creates a new process, which is slow and resource-intensive.


    However, the shell itself provides an incredibly powerful, built-in set of tools
    for string manipulation: parameter expansion. This allows you to operate directly
    on the contents of variables without ever leaving the shell. You can remove parts
    of strings, replace patterns, set default values, and even change a string''s
    case.


    In this chapter, you will learn to master this “Swiss Army knife.\ In parallel,
    we will deepen your understanding of quoting, because only the combination of
    powerful expansion and correct quoting can protect you from the most insidious
    bugs in shell programming: unwanted word splitting and pathname expansion.'
  merge: -1
