  md: '# 2.4 THE PRAGMATIC SCRIPTER:

    WHEN IS PORTABILITY OVERKILL?


    Maximum portability is not always the ultimate goal. It''s a trade-off between
    universality and readability/convenience.


    +   - Script for Personal Use: If you''re writing a script only for yourself on
    your own, known system, feel free to use the Bash features that make your job
    easier.


    +   - Script for a Team/Company: If the script needs to run on various Linux servers
    that you control (e.g., all RHEL 8), you can rely on the Bash version available
    there.


    +   - Tool for Public Distribution/CI/CD/Docker: This is where portability is
    critical. If you don''t know where your code will be executed, write for #!/bin/sh
    and test it with shellcheck.


    The art lies in making a conscious decision rather than accidentally writing non-portable
    code.'
