  md: '# INTRODUCTION: FROM “DOES IT WORK?” TO “IS IT SECURE?”


    A script that accomplishes its task is good. A script that accomplishes its task
    without accidentally compromising your entire system is professional. in today’s
    interconnected world, every line of code that runs on a server is a potential
    point of entry. A carelessly written script can leak passwords, execute unauthorized
    code, or delete sensitive data.


    In this chapter, we will fundamentally change our mindset. We will stop building
