- img_proc: true
  md: '# 10.1 THE FIRST COMMANDMENT: NEVER STORE SECRETS IN A SCRIPT


    This is the most common and dangerous mistake. An API token or database password
    hard-coded in a script will inevitably end up in a Git repository, a backup, or
    a public pastebin.


    Method 1: Environment Variables (The Standard Way) Secrets should be passed to
    the script at runtime via the environment.


    ```

    # BAD:

    DB_PASSWORD="MySuperSecretPassword123"

    mysql --user=admin --password="$DB_PASSWORD" -e ""

    # BETTER: The script expects the variable to already exist.

    # Check if the variable is set, otherwise exit safely.

    : "${DB_PASSWORD}:Error: The DB_PASSWORD environment variable is not set."

    mys --user=admin --password="$DB_PASSWORD" -e ""

    # Calling the script:

    export DB_PASSWORD="MySuperSecretPassword123"

    ./my_script.sh

    # Or for a single invocation

    $DB_PASSWORD="..." ./my_script.sh

    ```


    Method 2: Configuration or Credential Files Many tools use configuration files
    in the home directory (e.g., ~/aws/credentials, ~/.my.conf). you can emulate this
    pattern.


    +   - Create a file ~/.my_app.conf with the content API_TOKEN=...


    +   - Important: Set extremely restrictive permissions: chmod 600 ~/.my_app.conf.


    +   - In the script: source ~/.my_app.conf


    Method 3 (Professional): Secret Management Systems In production environments,
    tools use HashiCorp Vault or AWS Secrets Manager are used.'
  merge: -1
  pgno: 122
- img_proc: true
  md: A script would authenticate with these services and fetch secrets at runtime.
  merge: -1
