  md: "# 3.1 SUBSTRING REMOVAL: THE SCALPEL FOR STRINGS\n\nThis is the most common\
    \ use case. You have a string and want to slice off a portion from the beginning\
    \ or the end.\n\nRemove Prefix (from the beginning of the string) * ${variable#pattern}:\n\
    Removes the shortest possible matching pattern from the beginning. (non-greedy)\
    \ * ${variable#pattern}: Removes the longest possible matching pattern from the\
    \ beginning. (greedy)\n\n+   Example: Dissecting a file path\nfilepath=/var/apache2/access.log\n\
    # Shortest pattern: everything up to the first /\necho \"${filepath#**/}\"\n ->\
    \ /var/apache2/access.log\n# Longest pattern: everything up to the last / (extracts\
    \ the filename)\necho \"${filepath##*}\"\n -> access.log (equivalent to 'basename\
    \ \"$filepath\")\n\nRemove Suffix (from the end of the string) * ${variable%pattern}:\
    \ Removes the shortest possible matching pattern from the end. (non-greedy) *\
    \ ${variable%%pattern}: Removes the longest possible matching pattern from the\
    \ end. (greedy)\n\n+   Example: Removing a file extension\nfilename=backup_2023-10-27.tar.gz\n\
    # Shortest pattern: everything from the last .\necho \"${filename%..*}\"\n ->\
    \ backup_2023-10-27.tar\n# Longest pattern: everything from the first .\necho\
    \ \"${filename%%.*}\"\n -> backup_2023-10-27"
