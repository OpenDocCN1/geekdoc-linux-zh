    Anyone can write a script that works when everything goes right—the “happy path.”
    However, the true art of scripting reveals itself when things go wrong: a file
    doesn''t exist, a disk is full, a network service is unreachable, or the user
    presses Ctrl+C.


    A beginner’s script that relies on `set -e` will simply crash in such cases. It
    might leave behind temporary files, an inconsistent state, or a half-written output
    file. It''s like an airplane that loses its engines and falls uncontrollably from
    the sky.


    A professional script, in contrast, performs a controlled emergency landing. It
    detects the failure, shuts down its systems, sends out a distress signal with
    precise coordinates, and ensures the “passengers” (your data and your system)
    remain safe. In this chapter, you will learn how to give your scripts exactly
    this capability. We will go far beyond `set -e` and build a robust framework for
    error detection, cleanup, logging, and deep debugging.'
