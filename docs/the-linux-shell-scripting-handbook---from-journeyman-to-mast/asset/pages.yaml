  md: "# 9.3 ADVANCED JQ EXPRESSIONS\n\njq's power comes from its ability to chain\
    \ filters together with a pipe |, just like the shell.\n\n**Chaining and Object\
    \ Construction:** You can build new JSON objects on the fly.\n\nExample: Create\
    \ a new object with only the user ID and the last login time.\n\n```\ncurl -s\
    \ ... | jq '{user_id: .user.id, login: .last_login}'\n```\n\nOutput:\n\n```\n\
    {\n  \"user_id\": 101,\n  \"login\": \"2023-10-28T10:00:00Z\"\n}\n```\n\n**Working\
    \ with Arrays:** map and select * map(expression): Applies an expression to each\
    \ element of an array. * select(condition): Filters elements based on a boolean\
    \ condition.\n\nExample: From a list of users, get the names of all active* users.\
    \ Input JSON:*\n\n```\n[\n  {\"name\": \"alice\", \"active\": true},\n  {\"name\"\
    : \"bob\", \"active\": false},\n  {\"name\": \"carol\", \"active\": true}\n]\n\
    ```\n\njq command:\n\n```\njq '.[] select(.active == true) | .name'\n```\n\n#\
