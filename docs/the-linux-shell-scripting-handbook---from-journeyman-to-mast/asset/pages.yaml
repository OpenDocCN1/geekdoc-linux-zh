- img_proc: true
  md: '# 10.2 THE PLAGUE OF COMMAND INJECTION


    This occurs when a script accepts user input (e.g., a filename) and carelessly
    uses it in a command. This allows an attacker to inject their own code.


    The Disasterous Example: A script meant to delete a user-specified report.

    report_name="$1" rm /var/www/reports/$report_name


    An attacker calls the script like this: ./delete_report.sh "dummy.txt; rm -rf
    /" The shell executes two commands: rm /var/www/reports/dummy.txt and rm -rf /!


    # The Cures:


    +   1. **Always, always, always quote!** "/var/www/reports/$report_name" Now,
    the entire string dummy.txt; rm -rf / is passed as a *single* filename to rm,
    resulting in a "file not found" error—the system is safe.

    2. **Validate your input.** Only allow characters that make sense in a filename.
    bash if! [ "$report_name" ~ ^[a-zA-Z0-9\_-]+$ ]; then echo "Error: Invalid filename."&2
    exit 1 fi

    3. **Never use eval with user input.** eval is the most powerful and dangerous
    tool in the shell. It interprets a string as code to be executed. If that string
    comes from an external source, it''s an open invitation for compromise.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 10.3 THE MINEFIELD OF TEMPORARY FILES: MKTEMP IS YOUR FRIEND


    Never, under any circumstances, you should create a temporary file with a fixed
    or predictable name.


    BAD: `tmp_file="tmp/my_script_$\` Between the creation and use of this file, attacker
    can replace it with a symbolic link to a critical system file (`/etc/passwd`).
    This is known as a race condition attack.


    The Only Correct Solution: mktemp creates a file (or directory) with a guaranteed
    unique name and secure permissions, and returns the name.


    ```

    # Create a secure temporary file

    tmp_file=$(mktemp)

    # Create a secure temporary directory (often even better)

    tmp_dir=$(mktemp -d)

    # IMPORTANT: Combine with `trap EXIT` for cleanup

    trap ''rm -rf "$tmp_dir" EXIT

    # Work safely inside this directory

    ...

    ```'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# 10.4 PERMISSIONS AND THE PRINCIPLE OF LEAST PRIVILEGE


    mask: The Default Birth Certificate for Files The umask (file-creation mode mask)
    determines which permissions a newly created file does not get. A security-critical
    script should set a restrictive umask at the beginning.


    ```

    # Set a very restrictive umask for this script

    # 077 means: Only the owner has read/write/execute permissions.

    # Group and Others have NO rights.

    umask 077

    touch new_file # This file will be created with 600 (-rw--) permissions

    kdir new_directory # This directory will be created with 700 (drwx--- )

    ```


    2. The Principle of Least Privilege A script should always run with the minimum
    privileges necessary to do its job. * A backup script that only needs to back
    up the files of a specific user (webuser) should not run as root. It should run
    as webuser. * Use sudo -u <user> my_script.sh to run a script as another user.
    *

    Avoid giving scripts unnecessary setuid permissions.'
  merge: -1
