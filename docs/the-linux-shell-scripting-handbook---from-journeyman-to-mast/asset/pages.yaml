- img_proc: true
  md: '# 3.5 QUOTING – THE SAFETY NET THAT MUST ALWAYS BE UP


    You''ve now seen how to manipulate strings. The next step is to use them safely.
    The biggest problem in the shell is uncontrolled Word Splitting and Pathname Expansion
    (Globbing).


    # The Problem:


    ```

    filename="My Important Report.txt"

    touch "$filename"

    ls -l "$filename" # ERROR! Is tries to find files "My", "Important", and "Report.txt".

    ```


    # The Solution: Double Quotes! -l "$filename" # CORRECT! Is receives the string
    as ONE argument.


    # The Three Types of Quotes:


    +   1. (Single Quotes): Absolutely Literal. No expansion of any kind occurs. $USER
    remains $USER. Ideal for literal text. echo ''The current user is: $USER'' ->
    The current user is: $USER


    +   2. (Double Quotes): The Standard Case. Allows Parameter ($VAR), Command ($command),
    and Arithmetic ($((...))) expansion, but prevents word splitting and globbing.
    This is your most important tool! echo "The current user is: $USER" -> The current
    user is: [your username]


    +   3. $$$ (ANSI-C Quoting): For Special Characters. Allows the interpretation
    of backslash escape sequences like \n (newline), \t (tab), or \41 (hex code).
    printf ''$Line 1\n\tintented Line 2\n''


    The Golden Rule of Quoting: Always quote your variable expansions ("$var") unless
    you know exactly why you need word splitting or globbing to occur.'
  merge: -1
