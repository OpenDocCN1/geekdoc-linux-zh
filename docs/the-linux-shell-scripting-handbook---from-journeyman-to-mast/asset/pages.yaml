  md: '# 12.1 MEASURE, DON''T GUESS:

    FINDING BOTTLENECKS WITH TIME AND STRACE


    Optimization without measurement is a waste of time. You need to know where your
    script is slow.


    The time Command: The First Look Under the Hood time command measures the execution
    time of a command and breaks it down: * real: The actual elapsed wall-clock time.
    * user: The CPU time spent in user-space (in the process itself). * sys: The CPU
    time spent in kernel-space (for system calls like reading/writing files).


    ```

    $ time sleep 3

    real 0m.004s

    user 0m.000s

    sys 0m.003s

    ```


    A high value often indicates many I/O operations or process startups.

    strace: The Microscope for System Calls trace logs every system call a a process
    makes. The -c option is invaluable: it counts the calls and provides a summary.


    Example: The difference between a builtin and an external command.


    ```

    # External command in a loop

    $ strace -c -trace=''process'' bash -c ''for in {1..1000}; do /bin/true; done''

    % time seconds uses/call calls errors syscall

    ```


    100.00 0.001673 2 1000 clone


    Total 0.001673 1000 1 total'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# # Shell builtin in a loop


    ```

    $ strace -c -e ''trace-process'' bash -c ''for i in {1..1000}; do ; ; done''

    % time seconds usecs/call calls errors syscall

    ```


    Total 0.000000 0 0 total


    The result is dramatic: 1000 clone calls (the start of the forking process) for
    the external command, but zero for the builtin.'
