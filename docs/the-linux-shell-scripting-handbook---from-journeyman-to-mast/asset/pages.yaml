  md: '# 12.4 I/O OPTIMIZATION: READING DATA SMARTLY


    Avoid reading the same file over and over. If you need to perform multiple operations
    on the data in a file, read it once into an array or a variable, then work with
    the data in memory.


    +   - **Bad (reads the file 3 times):** bash count=$(wc -l < file.txt) first_line=$(head
    -n 1 file.txt) last_line=$(tail -n 1 file.txt)

    - **Good (reads the file 1 time):** bash readarray -t lines < file.txt count=${#lines[@]}
    first_line="${lines[0]}" last_line="${lines[-1]}"'
