  md: "#  4.3 SCRIPT LIBRARIES: ORGANIZING AND REUSING CODE\n\nIf you have a set of\
    \ useful helper functions (e.g., logging, string manipulation, etc.), it's impractical\
    \ to copy them into every script. The solution is a **library**: a separate file\
    \ containing only function definitions.\n\n**Example of a library file** logging.sh:\n\
    \n```\n#!/bin/bash\n\n# This is my logging library\n# Function to print an informational\
    \ message with a timestamp\nlog_info() {\n    local message=\"$1\"\n    echo \"\
