  md: '# 13.4 THE ART OF DOCUMENTATION: WRITING MAN PAGES


    The man page is your tool''s business card within the system. It is formatted
    with groff macros. It looks cryptic at first but follows a simple pattern.


    **Basic** groff Macros: *.TH TITLE SECTION: The title header (e.g., .TH MY-TOOL
    1). *.SH NAME: A section header with the name NAME (e.g., .SH SYNOPSIS). *.B text:
    Print text in bold. *.I text: Print text in italics. *.P: A new paragraph. *.IP
    tag indent An indented paragraph, useful for option


    *Example for* man/my-tool.1:


    ```

    .TH MY-TOOL 1 "October 2023" "1.0.0" "User Commands"

    .SH NAME

    my-tool \- an example tool for demonstration

    .SH SYNOPSIS

    .B my

    [-h] [-v] [-o file] \-i file [argument...]

    .SH DESCRIPTION

    .B my-toolnis a script that demonstrates the professional creation of command-line
    tools. It reads from an input file and writes...

    .SH OPTIONS

    .IP "-i",--input file"

    Specifies the input file to read (required).

    .IP "-o",--output file"

    Specifies the output file to write (optional).

    .SH AUTHOR

    Your Name <your.email@example.com>

    ```


    **Displaying the local** man page: man -l /man/my-tool.1'
