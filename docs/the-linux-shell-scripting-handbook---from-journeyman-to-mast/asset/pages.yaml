  md: "# 4.1 THE ANATOMY OF A PROFESSIONAL FUNCTION\n\nA function is more than just\
    \ a grouped block of code. It's a contract. It has a defined task, defined inputs,\
    \ and defined outputs.\n\n**Input: Processing Arguments** Arguments are accessed\
    \ inside a function via $1, $2, etc., just like in a script. It is good practice\
    \ to immediately assign them to descriptive local variables.\n\n```\n# Function\
    \ to greet a user\ngreet_user() {\n# Assign the first argument to a local variable\n\
    local user_name=\"$1\"\nif [[ -z \"$user_name\" ]]; then\n  echo \"Error: No username\
    \ provided.\" >&2\n  return 1 # Status: Failure\nfi\necho \"Hello, ${user_name}!\"\
    \"\nreturn 0 # Status: Success\n}\n```\n\n**Output: The Fundamental Difference\
    \ Between Status and Data\n\n+   **Return Value (return):** For Status Only! The\
    \ return command sets the function's exit code (a number from 0-255). Its sole\
    \ purpose is to signal success (0) or failure (anything else). It should **never**\
    \ be used to return data.\ngreet_user \"Alice\" echo $? -> 0\n\n+   **Standard\
    \ Output (stdout):** For Returning Data! If a function needs to return a result\
    \ (a string, a number, etc.), it writes that result to standard output (stdout).\
    \ The caller can capture this result using command substitution ($())."
  merge: -1
