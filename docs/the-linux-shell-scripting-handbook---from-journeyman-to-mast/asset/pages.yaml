  md: '# 8.1 GREP: THE MASTER OF FINDING


    You know grep for finding lines. Now, let''s make it find anything.


    PCRE (-P): The Ultimate Pattern Matching Many Linux distributions ship with a
    grep that supports Perl-Compatible Regular Expressions. This unlocks incredibly
    powerful features like lookaheads, lookbehinds, and non-capturing groups.


    Example: Find lines that contain an IP address, but not if it''s 127.0.0.1.


    ```

    # Negative Lookbehind: ''(?<!...''

    grep -P ''(?<!127\.0\.0\.)\d{1,3}){3}\b'' /var/log/auth.log

    ```


    Context Control: Seeing the Bigger Picture Often, the matching line alone is not
    enough. * -A num (After): Shows num lines of trailing context after a match. *
    -B num (Before): Shows num lines of leading context before a match.

    * -C num (Context): Shows num lines of context both before and after a match.


    Example: Find an error and the 2 lines that led up to it. grep -B 2 "ERROR" application.log


    Performance and Efficiency * -F (Fixed strings): If you are searching for a literal
    string, not a pattern, -F is significantly faster. grep -F "user.login" ... *
    -q (Quiet): If you only need to know if a match exists (e.g., in an if statement),
    -q suppresses all output and exits immediately on the first match. if grep -q
    "FAIL" /var/log/secure; then ...'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 8.2 SED: THE STREAM EDITOR,

    UNLEASHED


    You know s/old/new/. Now, let''s explore sed''s hidden brain: the hold space.
    The hold space is a secondary, persistent buffer. You can copy or append the current
    line (from the “pattern space”) into it, and later retrieve it. This allows sed
    to “remember” things across multiple lines.


    **Hold Space Commands:** * h, H: Copy/Append pattern space to hold space. * g,
    G: Copy/Append hold space to pattern space. * x: Exchange pattern space and hold
    space.


    Example: Reverse the order of every two lines in a file.


    ```

    # For a file:

    # Line 1

    # Line 2

    # Line 3

    # Line 4

    # On line 1: Hold it.

    # On line 2: Get line 1 from hold space, append line 2, and print.

    # And so on...

    sed -n ''h;n;G;p'' input.txt

    ```


    Output:


    ```

    Line 2

    Line 1

    Line 4

    Line 3

    ```


    Example: Add a header only above a specific block. `sed ''/START_BLOCK/ { x; s/.*/MY_HEADER/;
    p; x; }'' input.txt'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# 8.3 AWK: THE DATA-PROCESSING POWERHOUSE


    awk is not just for ''{print $1}''. It''s a full programming language designed
    for record-based data processing.


    Key Concepts: * BEGIN { ... } block: Executed once before any lines are read.
    Perfect for initializing variables or printing headers. * END { ... } block: Executed
    once after all lines have been read. Ideal for calculations and printing summaries.
    * Built-in Variables: NF (Number of Fields), NR (Number of Records/Line Number),
    FS (Field Separator). * Associative Arrays: awk''s greatest strength.


    Example: Calculate the average size of files listed by ls -l.


    ```

    ls -l | awk ''*n# Skip the first line ("total...") and directories

    NR > 1 && !/^d/

    # Add the size (field 5) to the total

    total_size += $5


    # Increment the count

    count++


    END {

    if (count > 0) {

    # Calculate and print the average

    printf "Average file size: %.2f bytes\n", total_size / count

    }

    }

    ```


    Example: Count the number of connections from each IP address in a log file. awk
    ''{ip_counts[$1]++} END { for (ip in ip_counts) { print ip, ip_counts[ip] }}''
    access.log'
