  md: '# INTRODUCTION: FROM CRAFTSMAN TO ARCHITECT


    Congratulations! You are holding the next stage of your journey into the world
    of the Linux shell. If you have worked through the first book, you already command
    the fundamentals: you can chain commands, automate simple tasks, and harness the
    power of pipes and redirection to shape data. You have learned to handle the tools
    of a craftsman—the hammer (rm), the saw (sed), and the screwdriver (grep)—to create
    functional and useful things.


    But true mastery in any craft lies not just in *that* a piece of work functions,
    but in *how* it functions. It is robust enough to withstand unexpected stress?
    Is it built with such precision that it fits into other environments? Is it safe
    to use and easy to maintain


    This is precisely where this book begins. We are taking the decisive step from
    craftsman to architect. An architect doesn''t just think about a single wall;
    they think about the entire building. They plan the foundation, select the right
    materials, create a detailed blueprint, and consider all the safety regulations.


    +   **Robustness**: Your script won’t collapse at the first sign of unexpected
    input. It will have clean error handling and will clean up after itself.

    - **Portability**: Your script won’t just run on your machine, but also in minimalist
    Docker containers, on macOS, or on legacy enterprise servers.

    - **Maintainability**: Your code will be so clearly structured that you (or your
    colleagues) can still understand and extend it six months from now.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '+   - **Security**: You will know how to protect secrets, prevent command injection,
    and operate with the principle of least privilege.

    - **Performance**: You will understand which operations are expensive and how
    to identify and resolve bottlenecks in your scripts.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# WHAT TO EXPECT IN THIS BOOK


    We will sharpen the tools you already know and add a range of professional techniques
    and new utilities to your toolkit. This book is organized into four logical parts,
    designed to guide you step-by-step from an experienced user to a shell expert:


    +   1. **A Foundation of Reinforced Concrete**: First, we will solidify the fundamentals,
    replacing beginner habits with professional practices. We''ll dive deep into the
    shell environment, master POSIX compliance for maximum portability, and learn
    how to make our scripts bulletproof with set -eu pipefail.


    +   2. **Mastering Complex Data and Flow Control**: Here, you will learn the building
    blocks for complex logic. We will design functions and libraries, leverage associative
    arrays (hashes) as a powerful data structure, and implement watertight error handling
    with trap.


    +   3. **The Shell as a Universal Glue**: A huge part of the shell''s power lies
    in its ability to control other programs. We will elevate our `awk` skills to
    a new level, tap into modern JSON APIs with jq, and allow our scripts to operate
    securely across networks.


    +   4. **From Script to Professional Tool**: In the final part, we complete the
    transformation into an architect. You will learn how to parse command-line arguments
    like a pro, create `man` pages for your own tools, and analyze and optimize the
    performance of critical scripts.'
  merge: -1
