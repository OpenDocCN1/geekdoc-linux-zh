  md: '# INTRODUCTION: FROM MONOLITHIC SCRIPTS TO REUSABLE TOOLS


    Imagine you''re building a complex piece of furniture. Every time you need a screw,
    you would melt steel, cast it into shape, and cut the threads? Of course not.
    You would reach into your toolbox and grab a ready-made screw. The principle is
    the same in programming: **Don’t Repeat Yourself (DRY).**


    So far, your scripts may have been long, linear sequences of commands. If you
    needed to repeat a similar task elsewhere, you probably copied and pasted the
    code. This leads to bloated, error-prone, and hard-to-maintain scripts. A change
    in one place has to be hunted down and replicated in many others.


    In this chapter, you will learn the art of breaking down your code down into logical,
    reusable units: **functions**. We will explore how to design these functions cleanly,
    organize them into **libraries**,—most importantly—control the **scope** of variables
    to avoid unintentional and catastrophic side effects. This is the transition from
    writing scripts to developing software.'
