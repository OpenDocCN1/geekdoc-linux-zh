- img_proc: true
  md: "# 5.3 PROACTIVE ERROR DETECTION: TRAP ERR\n\nWhile trap EXIT cleans up at the\
    \ end, trap ERR reacts the moment a command returns a non-zero exit code. This\
    \ allows for much more detailed logging.\n\n# The Error Logging Pattern:\n\n```\n\
    #!/bin/bash\nset -o errexit Same as 'set -e'\nset -o nounset Same as 'set -u'\n\
    \n# Error handler function\nhandle_error() {\n  local exit_code=$?\n  local line_number=$1\n\
    \  local command=$2\n  echo \"ERROR in line $line_number: command '$command' failed\
    \ with exit code $exit_code.\" >&2\n}\n\n# Register the handler for the ERR signal\n\
    # Pass the line number and the command to the function\ntrap'handle_error $LINENO\
    \ \"$BASH_COMMAND\" ERR\necho \"All good...\"\n\nls /non_existent_directory #\
    \ This command will fail\necho \"This line will never be reached.\"\n\n```\n\n\
    # Output:\n\nAll good...\nls: cannot access '/non_existent_directory': No such\
    \ file or directory\nERROR in line 16: command 'ls /non_existent_directory' failed\
    \ with exit code 2.\n\nThis gives you precise, immediate information about what\
    \ went wrong and where."
  merge: -1
