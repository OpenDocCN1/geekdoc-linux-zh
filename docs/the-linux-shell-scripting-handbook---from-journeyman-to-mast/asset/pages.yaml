  md: '**The Savior:** *local The local* keyword declares a variable that exists **only
    within the current function.** It does not overwrite global variables and disappears
    as soon as the function finishes.


    **Rule Number One for Functions: Declare *every variable inside a function with*
    local unless you have a very good, intentional reason to modify a global variable.


    *The Corrected, Safe Example:*


    ```

    count_files_in_dir() {

