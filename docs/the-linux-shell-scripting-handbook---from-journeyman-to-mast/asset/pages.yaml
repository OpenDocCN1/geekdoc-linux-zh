- img_proc: true
  md: '# INTRODUCTION: FROM A SINGLE VALUE TO A STRUCTURED COLLECTION


    In simple scripts, a handful of variables is often sufficient to get a job done.
    But reality is rarely so simple. If you need to process a list of ten servers,
    collect metadata from a hundred files, or store the configuration settings of
    an application? You won''t get far with individual variables. You need a way to
    group related data and access it efficiently.


    You already know the basic form: the **indexed array**, an ordered list of items.
    It''s the backbone for processing lists. But the real power to model reality lies
    in its more advanced counterpart: the **associative array**, often called a **hash**
    or **dictionary**. It stores not just values, but the *relationship* between them
    by assigning a unique, named key to each value.


    In this chapter, we will master both types. We will briefly review the professional
    handling of indexed arrays and then dive deep into the world of associative arrays.
    You will learn how to use them as configuration stores, as counters, or even to
    simulate more complex data structures. Mastering these structures is the difference
    between a script that processes data and a script that *understands* data.'
  merge: -1
