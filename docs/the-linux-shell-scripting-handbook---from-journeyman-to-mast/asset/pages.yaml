- img_proc: true
  md: '# 2.2 THE POSIX TOOLBOX: COMMON BASH-ISMS AND THEIR ALTERNATIVES


    To write portable scripts, you must replace the “luxury features” of Bash with
    their universal counterparts.


    +   1. Conditional Expressions: [[...]] vs. [...]


    +   - Bash-ism: [[ $var1 == $var2 & $var2 != "foo" ]]


    +   - Advantages: Safer against word-splitting, extended operators like == for
    pattern matching, and &&|| for logical grouping.


    +   - POSIX Standard: ["var1" = "var2"] & [ "var2" != "foo" ]


    +   - Rules:


    +   - Always quote! [ $var ] can fail if $var is empty or contains spaces. [ "var"
    ] is safe.


    +   - Use a single = for string comparison. == is not standard.


    +   - Avoid -a (AND) and -o (OR). They are unreliable. Instead, chain multiple
    tests with && and ||.


    +   2. Arithmetic: ((...)) vs. $((...)) and expr


    +   - Bash-ism: (( i++ ))


    +   - POSIX Standard: i=$((i + 1))


    +   The $((...)) expansion for arithmetic evaluation is part of the POSIX standard
    and is the preferred, modern method.


    +   - The “Old School” Way: i=$expr("si" + 1)'
  merge: -1
