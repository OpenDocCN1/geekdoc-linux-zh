  md: "# 5.4 ADVANCED DEBUGGING: BEYOND SET -X\n\nset -x is useful, but its output\
    \ can be cluttered. With trap DEBUG, you can build your own intelligent tracer.\
    \ The DEBUG trap is executed before every simple command.\n\n# A Smarter Trace\
    \ Mode:\n\n```\n#!/bin/bash\n\n# Function to be executed before each command\n\
    debug_trace() {\n  # Print function name, line number, and command\n  echo \"\
    [DEBUG] ${BASH_SOURCE[0]}:${BASH_LINENO[0]} -> ${BASH_COMMAND}\" >&2\n  \n  #\
    \ Check if an environment variable is set to enable debug mode\n  if [[ \"${SCRIPT_DEBUG:-}\"\
    \ == \"true\" ]]; then\n    trap debug_trace DEBUG\n  fi\n}\n\nmy_func() {\n \
    \ local name=\"World\"\n  echo \"Hello, $name\"\n}\necho \"Script starting.\n\
    mmy_func\necho \"Script ending.\"\n\nInvocation: ./script.sh -> Normal output\
    \ SCRIPT_DEBUG=true ./script.sh -> Detailed trace out for every command.\n```"
