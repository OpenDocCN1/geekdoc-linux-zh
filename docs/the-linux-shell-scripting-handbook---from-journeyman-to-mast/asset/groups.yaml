    ## APPENDIX J: SHELL SCRIPT SECURITY CHECKLIST


    Before deploying a script to a production environment, run through this checklist.


    | Area | Check | How to Implement |

    |---|---|---|

    | Secrets | Does the script contain any passwords, API keys, or other secrets?
    | Externalize secrets to environment variables or credential files (chmod 600).
    |

    | Input Validation | Is all external input (arguments, read) treated as potentially
    malicious?) | Always quote variables ("$var"). Validate input against allowed
    character sets (regex match). |

    | Command Injection | Is eval used with variable data? Are unquoted variables
    used in commands? | Avoid eval. Always use "$var". Use — to separate options from
    arguments. |

    | Temporary Files | Are temp files created with predictable names in /tmp? | Only
    use mktemp. Always set trap "rm $tmp" EXIT for cleanup. |

    | Permissions | Does the script run with more privileges than it? | Apply the
    Principle of Least Privilege. Run the script as unprivileged user.|


    | Area | Check | How to Implement |

