    # # 1.1 THE BIG PICTURE: INTERACTIVE, NON-INTERACTIVE, LOGIN, AND NON-LOGIN


    Every time bash starts, it falls into one of four categories. The combination
    of these categories fundamentally determines the shell''s behavior.


    +   - Interactive Login Shell: The classic case. You log in via a text console
    or SSH to a system. You are presented with a prompt, and the system awaits your
    input.


    +     Example: ssh user@server


    +   - Files Loaded: /etc/profile, then the first one found of ~/.bash_profile,
    ~/.bash_login, ~/.profile.


    +   - Interactive Non-Login Shell: You are already logged in and start a new shell.


    +     Example: Opening a new terminal window in your graphical environment.


    +   - Files Loaded: /etc/bashrc (on some systems), then ~/.bashrc.


    +   - Non-interactive Non-Login Shell: This is the most common case for script
    execution.


    +     Example: bash my_script.sh or a script launched by a cron job.


    +   - Files Loaded: Typically none, unless the BASH_ENV variable is set and points
    to a file.


    +   - Non-interactive Login Shell: A rarer but important case.


    +     Example: ssh user@server"command"


    +   - Behavior: Acts like a login shell (loading profile files) but then executes
    the command and exits.'
