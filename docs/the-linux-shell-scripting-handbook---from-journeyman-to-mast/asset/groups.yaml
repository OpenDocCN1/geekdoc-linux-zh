    # 12.5 KNOWING WHEN TO STOP: THE LIMITS OF THE SHELL


    The shell is a fantastic "glue" for connecting commands and for I/O-heavy tasks.
    However, for CPU-intensive tasks (complex algorithms, heavy math, recursive calculations),
    it is the wrong tool for the job.


    Rules of thumb for switching to another language (Python, Go, Perl, Rust):


    +   • When you need complex data structures that go beyond associative arrays.


    +   • When your script consists mainly of computationally intensive for or while
    loops.


    +   • When performance is absolutely critical and even an optimized awk solution
    is too slow.


    +   • When the script requires extensive error handling and testability that becomes
    cumbersome in the shell.


    A good developer knows the strengths and weaknesses of their tools.'
