    # 11.2 AUTOMATION WITH SSH: THE KEYS TO THE KINGDOM


    Repeatedly typing passwords is the death of automation. The solution is key-based
    authentication.


    **Step 1: Create a Key Pair (if you don''t have one)** `ssh-keygen -t ed25519`
    (or rsa). Accept the defaults.


    **Step 2: Copy Your Public Key to the Target Server** `ssh-copy-id user@target-server`
    This command securely appends your public key (`~/.ssh/id_ed25519.pub`) to the
    `~/.ssh/authorized_keys` file on the target server. You will have to enter your
    password one last time.


    **Step 3: Connect Without a Password** From now on, you can connect with `ssh
