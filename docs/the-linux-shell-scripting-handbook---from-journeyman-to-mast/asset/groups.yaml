  - '[PAGE 65]


    # LEARNING OBJECTIVES FOR THIS CHAPTER:


    +   - Implement reliable cleanup actions on script exit using trap EXIT.

    - Catch errors the moment they happen with trap ERR to react immediately.

    - Generate meaningful error messages with line numbers and function names.

    - Apply advanced debugging techniques with trap DEBUG that are more powerful than
    a simple set -x.

    - Develop effective logging strategies to direct your script’s output to files
    or the system log (syslog).

    - Understand the importance of exit codes and use them deliberately.'
  - '[PAGE 66]


    # 5.1 THE LANGUAGE OF FAILURE: MASTERING EXIT CODES


    Every command returns an exit code upon completion, which is stored in the $ variable.
    * 0: Success. Everything is okay. * 1-255: Failure. Something went wrong.


    Using set -e reacts to these codes, but as an advanced scripter, you need to understand
    them and set them yourself.


    +   • Setting exit codes explicitly: exit 1 (general error), exit 127 (command
    not found), etc.


    +   • Importance: Automation tools like cron, systemd, or CI/CD pipelines rely
    on correct exit codes to decide if a job was successful.


    Pro Tip: There is a quasi-standard for exit codes documented in /usr/include/sysexits.h.
    Using these codes (e.g., 64 for bad arguments, 70 for an internal software error)
    makes your scripts more understandable to other system administrators.'
  - "[PAGE 67]\n\n# 5.2 THE SAFETY NET: CLEANING UP WITH TRAP EXIT\n\nWhat happens\
    \ to your script's temporary files when it aborts midway? They are left behind\
    \ as clutter. The trap command intercepts signals and executes a command of your\
    \ choice when they are received.\n\nThe most important trap is trap ... EXIT.\
    \ It is always executed when the script ends, regardless of whether it was a successful\
    \ completion, an error (set -e), or an external signal like Ctrl+C (SIGINT).\n\
    \n# The Classic Cleanup Pattern:\n\n```\n#!/bin/bash\nset -e\n# Create a secure\
    \ temporary file\n# -d creates a directory, which is often better\ntemp_dir=$(mktemp\
    \ -d)\n# Define the cleanup function\ncleanup() {\n  echo \\=> Performing cleanup...\"\
    \n  # 'rm -rf is safe because $temp_dir is absolute and came from mktemp\n  rm\
    \ -rf \"$temp_dir\"\n  echo \"=> Temporary directory '$temp_dir' removed.\"\n\
    }\n# Register the function for the EXIT signal\ntrap cleanup EXIT\necho \"Temporary\
    \ directory created: $temp_dir\"\necho \"Working with files...\"\ntouch \"$temp_dir/file1.txt\"\
    \nsleep 5 # Simulate work. Press Ctrl+C here!\necho \"Work finished.\"\n# The\
    \ script ends here, 'trap' is triggered\n```"
  - '[PAGE 68]


    No matter how you exit this script, the cleanup function will be executed and
    the directory will be deleted.'
  - "[PAGE 69]\n\n# 5.3 PROACTIVE ERROR DETECTION: TRAP ERR\n\nWhile trap EXIT cleans\
    \ up at the end, trap ERR reacts the moment a command returns a non-zero exit\
    \ code. This allows for much more detailed logging.\n\n# The Error Logging Pattern:\n\
    \n```\n#!/bin/bash\nset -o errexit Same as 'set -e'\nset -o nounset Same as 'set\
    \ -u'\n\n# Error handler function\nhandle_error() {\n  local exit_code=$?\n  local\
    \ line_number=$1\n  local command=$2\n  echo \"ERROR in line $line_number: command\
    \ '$command' failed with exit code $exit_code.\" >&2\n}\n\n# Register the handler\
    \ for the ERR signal\n# Pass the line number and the command to the function\n\
    trap'handle_error $LINENO \"$BASH_COMMAND\" ERR\necho \"All good...\"\n\nls /non_existent_directory\
    \ # This command will fail\necho \"This line will never be reached.\"\n\n```\n\
    \n# Output:\n\nAll good...\nls: cannot access '/non_existent_directory': No such\
    \ file or directory\nERROR in line 16: command 'ls /non_existent_directory' failed\
    \ with exit code 2.\n\nThis gives you precise, immediate information about what\
    \ went wrong and where."
  - "[PAGE 70]\n\n# 5.4 ADVANCED DEBUGGING: BEYOND SET -X\n\nset -x is useful, but\
    \ its output can be cluttered. With trap DEBUG, you can build your own intelligent\
    \ tracer. The DEBUG trap is executed before every simple command.\n\n# A Smarter\
    \ Trace Mode:\n\n```\n#!/bin/bash\n\n# Function to be executed before each command\n\
    debug_trace() {\n  # Print function name, line number, and command\n  echo \"\
    [DEBUG] ${BASH_SOURCE[0]}:${BASH_LINENO[0]} -> ${BASH_COMMAND}\" >&2\n  \n  #\
    \ Check if an environment variable is set to enable debug mode\n  if [[ \"${SCRIPT_DEBUG:-}\"\
    \ == \"true\" ]]; then\n    trap debug_trace DEBUG\n  fi\n}\n\nmy_func() {\n \
    \ local name=\"World\"\n  echo \"Hello, $name\"\n}\necho \"Script starting.\n\
    mmy_func\necho \"Script ending.\"\n\nInvocation: ./script.sh -> Normal output\
    \ SCRIPT_DEBUG=true ./script.sh -> Detailed trace out for every command.\n```"
  - '[PAGE 71]


    # 5.5 PROFESSIONAL LOGGING STRATEGIES


    Where should all the echo and error messages go?


    +   1. Logging to a File with exec: To redirect the entire output of a script
    to a file without modifying every echo command.


    ```

    #!/bin/bash

    LOG_FILE="/var/log/my_script.log"

    # Redirect stdout and stderr to the log file

    # The ''tee'' command allows output to also go to the console

    exec >(...) >2

    echo "This info message will go to the log."

    is /error # This error message will also go to the log.

    ```


    +   2. Logging to the System Log with logger: The most professional way is to
    use the system logger (syslog). The logger command makes this easy.


    ```

    #!/bin/bash

    # -t tag makes messages easy to filter

    logger -t "MyBackupScript" "Backup process started."

    # ...

    if ! tar -czf /backup/backup.tar.gz /home; then

    # -p sets the priority/facility (local0.error)

    logger -t "MyBackupScript" -p local0.error "Backup failed!"

    exit 1

    fi

    logger -t "MyBackupScript" "Backup completed successfully."

    ```


    These messages can be viewed centrally with journalctl -t MyBackupScript or in
    /var/log/syslog.'
  - '[PAGE 72]


    # CHAPTER SUMMARY


    You have learned to equip your scripts with a robust error-handling framework.
    You no longer rely blindly on set -e, but instead use trap to actively respond
    to your script''s termination (EXIT) or to errors as they occur (ERR). This allows
    you to safely release resources and create detailed error logs. With trap DEBUG
    and the logger command, you now have tools that go far beyond the basics, enabling
    you to build professional, reliable, and maintainable automation solutions.'
  - '[PAGE 73]


    # # EXERCISES


    +   1. **Safe Download Script:** Write a script that uses `wget` to download a
