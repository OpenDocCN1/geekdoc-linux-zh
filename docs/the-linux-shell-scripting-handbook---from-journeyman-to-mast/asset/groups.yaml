    # 12.3 PRACTICAL OPTIMIZATION TECHNIQUES


    1. Use Shell Builtins Instead of External Commands This is the most important
    technique. Many tasks for which beginners use external commands can be done with
    parameter expansion (see Chapter 3).


    +   - Bad (slow): filename=$(basename##*/*)"


    +   - Good (fast): filename="${filepath##*}"


    +   - Bad (slow): ext="$(echo "filename" | cut -d 2


    +   - Good (fast): ext="${filename.*}",


    +   2. Avoid the "Useless Use of cat" (and similar patterns) A classic beginner
    mistake that creates an unnecessary process.


    +   - Bad (1 unnecessary process): cat file.txt | grep "pattern"


    +   - Good (efficient): grep "pattern" file.txt


    +   - Bad (2 unnecessary processes): cat file.txt | sort | uniq -c


    +   - Good (efficient): sort file.txt | uniq -c


    3. Offload Heavy Work to awk Sometimes, a loop in the shell itself is the bottleneck,
    especially for arithmetic. awk is an external command, but it''s only launched
    once and then runs its own, much faster, internal loop.


    Scenario: Sum the numbers in a file.


    The slow shell loop (never forks, but shell arithmetic is slow):


    ```

    total=0

    while read -r num; do

    ((total += num))

    done < numbers.txt

    echo "$total"

    ```'
- md: "\nThe fast awk solution (forks once, but awk is optimized for numbers):\n\n\
    ```\nawk '{ total += $1 } END { print total }' numbers.txt\n```\n\nFor large files,\
    \ the awk version can be 10 to 100 times faster.\n\n## 12.4 I/O OPTIMIZATION:\
    \ READING DATA SMARTLY\n\nAvoid reading the same file over and over. If you need\
    \ to perform multiple operations on the data in a file, read it once into an array\
    \ or a variable, then work with the data in memory.\n\n- **Bad (reads the file\
    \ 3 times):** `bash count=$(wc -l < file.txt) first_line=$(head -n 1 file.txt)\
    \ last_line=$(tail -n 1 file.txt)`\n- **Good (reads the file 1 time):** `bash\
    \ readarray -t lines < file.txt count=${#lines[@]} first_line=\"${lines[0]}\"\
    \ last_line=\"${lines[-1]}\"`\n\n## 12.5 KNOWING WHEN TO STOP: THE LIMITS OF THE\
    \ SHELL\n\nThe shell is a fantastic \"glue\" for connecting commands and for I/O-heavy\
    \ tasks. However, for CPU-intensive tasks (complex algorithms, heavy math, recursive\
    \ calculations), it is the wrong tool for the job.\n\nRules of thumb for switching\
    \ to another language (Python, Go, Perl, Rust):\n\n- When you need complex data\
    \ structures that go beyond associative arrays.\n- When your script consists mainly\
    \ of computationally intensive for or while loops.\n- When performance is absolutely\
    \ critical and even an optimized awk solution is too slow.\n- When the script\
    \ requires extensive error handling and testability that becomes cumbersome in\
    \ the shell.\n\nA good developer knows the strengths and weaknesses of their tools.\n\
    \n## CHAPTER SUMMARY\n\nYou have learned to see your scripts through the lens\
    \ of a performance engineer. You now know that the key to speed is minimizing\
    \ process startups (forks). You can pinpoint the slow parts of your code with\
    \ time and strace. You actively replace external commands with fast shell builtins,\
    \ avoid unnecessary pipes, and offload computationally intensive tasks to the\
    \ optimized tool awk. You also understand that the shell has its limits and when\
    \ it's time to switch to a faster, compiled language. Your scripts are now not\
    \ only robust and secure, but also as fast as they can be in the world of shell\
    \ scripting.\n\n## EXERCISES\n\n- 1. **Bottleneck Analysis**: Find an older, slow\
    \ script of yours. Use `time and strace -c` to identify which commands are called\
    \ most frequently and consume the most time.\n- 2. **Refactoring for Performance**:\
    \ Rewrite a script that uses basename and dirname in a loop over 1000 files. Replace\
    \ the external calls with parameter expansion and measure the speed difference\
    \ with time.\n- 3. **Shell vs. awk**: Write a script that calculates the average\
    \ value of all numbers in a large file, once with a pure shell loop and once with\
    \ awk. Compare the execution times.\n\n## 13. CREATING PROFESSIONAL COMMAND-LINE\
    \ TOOLS – MORE THAN JUST A SCRIPT\n\n## INTRODUCTION: FROM A PRIVATE HELPER TO\
    \ A PUBLIC UTILITY\n\nSo far, you have written scripts that accomplish a task.\
    \ You know how to call them and what arguments they expect. But what if you are\
    \ creating a tool that others will use? Or what if your script becomes so complex\
    \ that it needs different modes of operation, configuration options, and flags?\
    \ At this point, a simple my_script.sh arg1 arg2 is no longer sufficient.\n\n\
    Users expect behavior they are accustomed to from standard tools like ls, grep,\
    \ or git: clearly defined options (-v, --verbose), a help output (--help), and\
    \ clean error handling for incorrect input.\n\nIn this chapter, we complete the\
    \ transformation from scripter to tools. You will learn how to parse command-line\
    \ arguments robustly and flexibly using the POSIX standard getopts. We will design\
    \ a professional directory structure for your tools that cleanly separates code,\
    \ libraries, and documentation. And finally, you will learn how to write man pages\
    \ (manual pages)—the official form of documentation in the Unix world—so that\
    \ your own creations integrate seamlessly into the system.\n\n## LEARNING OBJECTIVES\
    \ FOR THIS CHAPTER:\n\n- Robustly parse complex command-line options (flags, arguments)\
    \ with the getopts builtin.\n- Professionally implement standard options like\
    \ --help and --version.\n- Design a sensible and scalable project structure for\
    \ your tools (bin/, lib/, man/).\n- Write and install your own man pages for your\
    \ scripts.\n- Create a clear and helpful user experience (UX) for your command-line\
    \ tools.\n\n## 13.1 ARGUMENT PARSING: GETOPTS INSTEAD OF $1 CHAOS\n\nProcessing\
    \ arguments $1, $2, etc., quickly becomes messy and error-prone. What if options\
    \ come in a different order? What about combined flags like -vf? getopt is the\
    \ built-in, POSIX-compliant solution.\n\nThe gets Loop: getopt is used in a while\
    \ loop that runs as long as options are found.\n\nSyntax: `while gets \"optstring\"\
    \ opt; do ...` * optstring: Defines the allowed options. A colon after a letter\
    \ means that option expects an argument (e.g., i:o:vh). The leading colon enables\
    \ silent error mode, which we to handle ourselves. * opt: A variable that holds\
    \ the found option letter in each iteration. * SOPTARG: Contains the argument\
    \ of an option if one is required. * SOPTIND: The index of the next argument to\
    \ be processed.\n\nExample: A script that accepts an input file, an output file,\
    \ and a verbose mode.\n\n```bash\n#!/bin/bash\n# Default values\nVERBOSE=false\n\
    OUTPUT_FILE=\"\"\nINPUT_FILE=\"\"\nusage() {\n  echo \"Usage: $0 -i <input_file>\
    \ [-o <output_file>] [-h]\"\n}\nwhile gets \":i:o:vh\" opt; do\n  case $opt in\n\
    \    i) INPUT_FILE=\"$SOPTARG\";\n    o) OUTPUT_FILE=\"$SOPTARG\";\n    v) VERBOSE=true\
    \ ;;\n```\n\n```bash\nh) usage; exit 0 ;;\n\\?) echo \"Invalid option: -$OPTARG\"\
    \ >&2; usage; exit 1 ;;\n:) echo \"Option -$OPTARG requires an argument.\" >&2;\
    \ usage; exit 1 ;;\nesac\ndone\n\n# Remove the processed options from the arguments\n\
    shift $((OPTIND - 1))\n# The rest of the arguments are now in $@\n# e.g., for\
    \ filenames at the end\nREMAINING_ARGS=\"$@\"\n# Main logic of the script...\n\
    echo \"Input: $INPUT_FILE\"\necho \"Output: $OUTPUT_FILE\"\necho echo \"Verbose:\
    \ $VERBOSE\"\necho \"Remaining args: ${REMAINING_ARGS[*]}\"\n```\n\n## 13.2 STANDARD\
    \ OPTIONS: --HELP, VERSION, AND FRIENDS\n\nA professional tool should always respond\
    \ to --help and --version. Since getopts does not support long options (--...),\
    \ we use a preceding case statement or a for loop construct to handle them before\
    \ getopt starts.\n\n*Extending the example above:*\n\n```bash\n#!/bin/bash\nVERSION=\"\
    1.0.0\"\nage() { ... }\nversion() { echo \"$0 Version $VERSION\"; }\n# Handle\
    \ long options manually\nfor arg in \"$@\"; do\n  shift\n  case \"$arg\" in\n\
    \    \"--help\") usage; exit 0 ;;\n    \"--version\") version; exit 0 ;;\n   \
    \ *) set=\"$@\" \"$arg\"\n  esac\ndone\n# Now, the getopt loop for short options...\n\
    while getopts ...\n```\n\n**Note:** The external command getopt (without 's')\
    \ supports long options, but it is not POSIX-standardized and behaves differently\
    \ on various systems (Linux vs. BSD/macOS). For maximum portability, manual handling\
    \ or forging long options is the safer path.\n\n## 13.3 PROFESSIONAL PROJECT STRUCTURE\n\
    \nStop crammed everything into one file. A good structure promotes maintainability\
    \ and reusability.\n\n# A Typical Structure:\n\n- my-tool/\n  - bin/\n    - my-tool\
    \ # The executable main script\n  - lib/\n    - utils.sh # A library with helper\
    \ functions\n  - man/\n    - my-tool.1 # The man page\n  - README.md\n\nThe main\
    \ script in bin/my-tool would then source the library:\n\n```bash\n#!/bin/bash\n\
    # bin/my-tool\n# Source the library relative to the script\nsource \"$(dirname\
    \ $0)/../lib/utils.sh\"\n# rest of the script\n```\n\nThis structure makes installation\
    \ easier (e.g., copying bin/ to /usr/local/bin) and keeps the code cleanly separated.\n\
    \n## 13.4 THE ART OF DOCUMENTATION: WRITING MAN PAGES\n\nThe man page is your\
    \ tool's business card within the system. It is formatted with groff macros. It\
    \ looks cryptic at first but follows a simple pattern.\n\n**Basic groff Macros:**\n\
    - *.TH TITLE SECTION: The title header (e.g., .TH MY-TOOL 1).\n- *.SH NAME: A\
    \ section header with the name NAME (e.g., .SH SYNOPSIS).\n- *.B text: Print text\
    \ in bold.\n- *.I text: Print text in italics.\n- *.P: A new paragraph.\n- *.IP\
    \ tag: An indented paragraph, useful for option\n\n*Example for* man/my-tool.1:\n\
    \n```roff\n.TH MY-TOOL 1 \"October 2023\" \"1.0.0\" \"User Commands\"\n.SH NAME\n\
    my-tool \\- an example tool for demonstration\n.SH SYNOPSIS\n.B my\n[-h] [-v]\
    \ [-o file] \\-i file [argument...]\n.SH DESCRIPTION\n.B my-tool is a script that\
    \ demonstrates the professional creation of command-line tools. It reads from\
    \ an input file and writes...\n.SH OPTIONS\n.IP \"-i\",--input file\"\nSpecifies\
    \ the input file to read (required).\n.IP \"-o\",--output file\"\nSpecifies the\
    \ output file to write (optional).\n.SH AUTHOR\nYour Name <your.email@example.com>\n\
    ```\n\n**Displaying the local** man page: `man -l /man/my-tool.1`\n"
  mdcn: "\n快速的 awk 解决方案（仅派生一次，但 awk 对数字进行了优化）：\n\n```\nawk '{ total += $1 } END {\
    \ print total }' numbers.txt\n```\n\n对于大文件，awk 版本可以快 10 到 100 倍。\n\n## 12.4 I/O\
    \ 优化：智能地读取数据\n\n避免重复读取同一个文件。如果你需要对文件中的数据执行多次操作，请将其读取一次到数组或变量中，然后在内存中处理这些数据。\n\n\
    - **错误的做法（读取了 3 次文件）：** `bash count=$(wc -l < file.txt) first_line=$(head -n 1\
    \ file.txt) last_line=$(tail -n 1 file.txt)`\n- **好的做法（读取了 1 次文件）：** `bash readarray\
    \ -t lines < file.txt count=${#lines[@]} first_line=\"${lines[0]}\" last_line=\"\
    ${lines[-1]}\"`\n\n## 12.5 知晓何时停止：Shell 的局限性\n\nShell 是连接命令和处理 I/O 密集型任务的极佳“胶水”。然而，对于\
    \ CPU 密集型任务（复杂算法、重度数学计算、递归计算），它并不是这项工作的正确工具。\n\n切换到其他语言（Python, Go, Perl, Rust）的经验法则：\n\
    \n- 当你需要超出关联数组范围复杂数据结构时。\n- 当你的脚本主要由计算密集型的 `for` 或 `while` 循环组成时。\n- 当性能至关重要，即使是优化的\
    \ awk 解决方案也太慢时。\n- 当脚本需要大量的错误处理和可测试性，而这些在 Shell 中变得变得繁琐时。\n\n优秀的开发者了解自己工具的优缺点。\n\
    \n## 章节总结\n\n你已经学会了从性能工程师的角度来审视你的脚本。你现在知道速度的关键在于尽量减少进程启动（forks）。你可以使用 `time` 和\
    \ `strace` 精确定位代码中缓慢的部分。你积极用快速的 Shell 内置命令替换外部命令，避免不必要的管道，并将计算密集型任务交给经过优化的工具 awk。你还理解了\
    \ Shell 有其局限性，以及何时该切换到更快的编译型语言。你的脚本现在不仅健壮安全，而且在 Shell 脚本的世界中达到了最快。\n\n## 练习\n\n\
    - 1. **瓶颈分析**：找到你以前的一个较慢脚本。使用 `time and strace -c` 识别哪些命令被调用最频繁且消耗时间最长。\n- 2.\
    \ **性能重构**：重写一个在 1000 个文件的循环中使用 `basename` 和 `dirname` 的脚本。用参数扩展替换外部调用，并用 `time`\
    \ 测量速度差异。\n- 3. **Shell vs. awk**：编写一个计算大文件中所有数字平均值的脚本，一次使用纯 Shell 循环，一次使用 awk。比较执行时间。\n\
    \n## 13. 创建专业的命令行工具 – 不仅仅是脚本\n\n## 引言：从私有助手到公共实用\n\n到目前为止，你编写的是完成特定任务的脚本。你知道如何调用它们以及它们期望什么参数。但如果你正在创建一个他人将要使用的工具呢？或者如果你的脚本变得如此复杂，需要不同的运行模式、配置选项和标志呢？此时，一个简单的\
    \ `my_script.sh arg1 arg2` 就不再够了。\n\n用户期望获得像 `ls`、`grep` 或 `git` 等标准工具所熟悉的行为：清晰定义的选项（`-v`、--verbose`）、帮助输出（`--help`）以及针对错误输入的清晰错误处理。\n\
    \n在本章中，我们将完成从脚本编写者到工具开发者的转变。你将学习如何使用符合 POSIX 标准的 `getopts` 健壮且灵活地解析命令行参数。我们将为你的工具设计一个专业的目录结构，将代码、库和文档清晰分离。最后，你将学习如何编写\
    \ `man` 页（手册页）——Unix 世界中官方文档形式——以便你的作品能够无缝集成到系统中。\n\n## 本章学习目标：\n\n- 使用 `getopts`\
    \ 内置命令健壮且灵活地解析复杂的命令行选项（标志、参数）。\n- 专业地实现 `--help` 和 `--version` 等标准选项。\n- 为你的工具设计一个合理且可扩展的项目结构（`bin/`,\
    \ `lib/`, `man/`）。\n- 为你的脚本编写并安装自己的 `man` 页。\n- 为你的命令行工具创建清晰实用的用户体验 (UX)。\n\n\
    ## 13.1 参数解析：用 getopts 代替 $1 混乱\n\n处理参数 `$1`、`$2` 等很快就会变得混乱且易错。如果选项顺序变了怎么办？像 `-vf`\
    \ 这样的组合标志怎么办？`getopt` 是内置的、符合 POSIX 标准的解决方案。\n\n`gets` 循环：`getopt` 使用在一个 `while`\
    \ 循环中，只要发现选项循环就会运行。\n\n语法：`while gets \":optstring\" opt; do ...` * *optstring*：定义允许的选项。字母后的冒号表示该选项期望一个参数（例如\
    \ `i:o:vh`）。开头的冒号启用静默错误模式，由我们自己处理错误。 * *opt*：一个变量，在每次迭代中存储找到的选项字母。 * *SOPTARG*：如果选项需要参数，则包含该选项的参数。\
    \ * *SOPTIND*：下一个要处理的参数的索引。\n\n示例：一个接受输入文件、输出文件和详细模式的脚本。\n\n```bash\n#!/bin/bash\n\
    # 默认值\nVERBOSE=false\nOUTPUT_FILE=\"\"\nINPUT_FILE=\"\"\nusage() {\n  echo \"\
    Usage: $0 -i <input_file> [-o <output_file>] [-h]\"\n}\nwhile gets \":i:o:vh\"\
    \ opt; do\n  case $opt in\n    i) INPUT_FILE=\"$SOPTARG\";\n    o) OUTPUT_FILE=\"\
    $SOPTARG\";\n    v) VERBOSE=true ;;\n```\n\n```bash\nh) usage; exit 0 ;;\n\\?)\
    \ echo \"Invalid option: -$OPTARG\" >&2; usage; exit 1 ;;\n:) echo \"Option -$OPTARG\
    \ requires an argument.\" >&2; usage; exit 1 ;;\nesac\ndone\n\n# 从参数中移除已处理的选项\n\
    shift $((OPTIND - 1))\n# 剩余参数现在位于 $@ 中\n# 例如，结尾的文件名\nREMAINING_ARGS=\"$@\"\n#\
    \ 脚本的主逻辑...\necho \"Input: $INPUT_FILE\"\necho \"Output: $OUTPUT_FILE\"\necho\
    \ echo \"Verbose: $VERBOSE\"\necho \"Remaining args: ${REMAINING_ARGS[*]}\"\n\
    ```\n\n## 13.2 标准选项：--HELP, VERSION 及其朋友\n\n专业的工具应该始终对 `--help` 和 `--version`\
    \ 做出响应。由于 `getopts` 不支持长选项（`--help`），我们使用 `case` 语句或 `for` 循环来处理它们。\n\n*扩展示例：*\n\
    \n```bash\n#!/bin/bash\nVERSION=\"1.0.0\"\nusage() { ... }\nversion() { echo \"\
    $VERSION\"; }\n# 手动处理长选项\nfor arg in \"$@\"; do\n  shift\n  case \"$arg\" in\n\
    \    \"--help\") usage; exit 0 ;;\n    \"--version\") version; exit 0 ;;\n   \
    \ *) set=\"$arg\"\n  esac\ndone\n# 处理短选项的 getopts ...\n```\n\n**注意：**外部命令 `getopt`\
    \ 支持长选项，但在不同系统上行为不同。手动处理是更安全的路径。\n\n## 13.3 专业项目结构\n\n不要将所有内容都挤在一个文件中。良好的结构有助于可维护性和可重用性。\n\
    \n# 典型结构：\n\n- my-tool/\n  - bin/\n    - my-tool # 可执行的主脚本\n  - lib/\n    - utils.sh\
    \ # 包含辅助函数的库\n  - man/\n    - my-tool.1 # 手册页\n  - README.md\n\n`bin/my-tool`\
    \ 中的主脚本将加载库：\n\n```bash\n#!/bin/bash\n# bin/my-tool\n# 相对于脚本加载库\nsource \"$(dirname\
    \ \"$0\")/../lib/utils.sh\"\n# 脚本其余部分\n```\n\n这种结构使得安装更容易（例如将 `bin/` 复制到 `/usr/local/bin`），并保持代码清晰分离。\n\
    \n## 13.4 文档艺术：编写手册页\n\n手册页是工具在系统中的名片。它使用 groff 宏格式。起初看起来很晦涩，但遵循简单的模式。\n\n**基础\
    \ groff 宏：**\n- .TH TITLE SECTION：标题头部（例如 `.TH MY-TOOL 1`）。\n- .SH NAME：带有名称 NAME\
    \ 的章节标题（例如 `.SH SYNOPSIS`）。\n- .B text：加粗文本。\n- .I text：斜体文本。\n- .P：一个新段落。\n-\
    \ .IP tag：缩进段落，常用于选项。\n\n*用于 man/my-tool.1 的示例：*\n\n```roff\n.TH MY-TOOL 1 \"\
    October 2023\" \"1.0.0\" \"User Commands\"\n.SH NAME\nmy-tool \\- 一个示例工具\n.SH\
    \ SYNOPSIS\n.B my\n[-h] [-v] [-o file] \\-i file [argument...]\n.SH DESCRIPTION\n\
    .B my-tool 是一个演示专业创建命令行工具的脚本。它从输入文件读取并...\n.SH OPTIONS\n.IP \"-i\",--input file\"\
    \n指定读取的输入文件（必需）。\n.IP \"-o\",--output file\"\n指定写入的输出文件（可选）。\n.SH AUTHOR\nYour\
    \ Name <your.email@example.com>\n```\n\n**显示本地**手册页：`man -l /man/my-tool.1`\n\n"
