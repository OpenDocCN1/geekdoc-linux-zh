    # A COLLECTION OF USEFUL SHELL ONE-LINERS


    The true elegance of the shell is often revealed in its ability to solve complex
    problems with a single, well-thought-out command chain. This collection serves
    as a source of inspiration and a cheat sheet for everyday challenges. Many of
    these one-liners combine the concepts presented in this book into powerful tools.


    ## FILE AND MANAGEMENT MANAGEMENT


    - 1. Find the 10 largest files in the current directory and all subdirectories:


    `find . -type f -printf "%s\t%p\n" | sort -rm | head -n 10`


    - **Explanation**: find prints the size (%s) and path (%p) of each file. sort
    -rm sorts this list numerically and in reverse order. head displays the top 10
    results.


    - 2. Rename all .jpg files to .png (bulk renaming):


    ```bash

    for f in *.jpg; do mv "$f" "${f%.jpg}.png"; done

    ```


    - **Explanation**: A loop iterates over all .jpg files. The parameter expansion
    ${f%.jpg} removes the .jpg extension from the filename before appending the new
    .png extension. - protects against filenames that begin with a hyphen.


    - 1. Find all duplicate files in a directory:


    ```bash

    find . -type f -exec sha256sum {} | sort | uniq -w 64 -d

    ```


    - **Explanation**: sha256sum calculates a unique checksum for each file. sort
    the output so that identical checksums appear next to each other. uniq -w 64 -d
    compares only the first 64 characters (the length of the SHA256 hash) and displays
    only the lines that are duplicates.


    - 1. Create a directory and change it to immediately:


    ```bash

    cd() { mkdir -p "$1" && cd "$1"; }

    ```


    - **Explanation**: This is a function for your .bashrc. mkdir -p creates the directory
    (and all parent directories, if necessary). Only if this succeeds (&&) is cd executed.


    - 1. Pack all files older than 90 days into an archive:


    ```bash

    find . -mtime +90 -print0 | xargs -0 -czf old_files.tar.gz

    ```


    - **Explanation**: find -mtime +90 finds the files. The combination -print0 and
    xargs -0 is the safest way to reliably pass filenames (even those containing spaces
    or special characters) to xargs.


    ## TEXT PROCESSING AND DATA WRANGLING


    - 1. Sum up all numbers in the first column of a file:


    ```bash

    awk ''{s+=$1} END {print $s}'' file.txt

    ```


    - **Explanation**: awk is optimized for column-based data. This one-liner adds
    the value of the first column ($1) of each row to the variable s and prints the
    total at the end (END).


    - 1. Display the most frequently used commands from your Bash history:


    ```bash

    history | awk ''{print $2}'' | sort | uniq | sort -rm | head -n 10

    ```


    - **Explanation**: The canonical pipeline for frequency analysis: awk extracts
    the command, sort prepares for uniq, uniq -c counts, sort -rm sorts by frequency,
    and head displays the top 10.


    - 2. Search and replace a string in .txt files:


    ```bash

    find -type f -name "*.txt" -exec sed -i ''s/old_pattern/new_pattern/g'' {} +

    ```


    - **Explanation**: sed finds the files. -exec sed -i ... {} + is a high-performance
    method for invoking sed because + bundles as many filenames as possible into a
    single invocation.


    - 3. Query your public IP address via a web service:


    ```bash

    curl -s ifconfig.me

    ```


    - **Explanation**: curl retrieves the contents of the web page. Services ifconfig.me
    are specialized to return only your IP address as text. -s suppresses the loading
    bars.


    - 4. Remove all blank lines from a file:


    ```bash

    sed ''/^\$/d'' file.txt > new_file.txt

    ```


    - **Explanation**: The sed command applies the delete command (d) to all lines
    that match the pattern ^$ (an empty line).


    ## NETWORK AND PROCESS MANAGEMENT


    - 1. Start a quick, temporary web server in the current directory:


    ```bash

    python3 -m http.server 8000

    ```


    - **Explanation**: This is a fantastic trick that uses Python’s built-in web server
    module to quickly share the files in the current directory over the network.


    - 2. Find out which process is using a specific port:


    ```bash

    bash sudo lsof -i :443

    ```


    - **Explanation**: lsof -i lists open connections. :443 indicates the port.


    - 3. List zombie processes:


    ```bash

    ps aux | awk ''$8=="Z" {print $0}''

    ```


    - **Explanation**: awk filters for zombie processes (Z).

