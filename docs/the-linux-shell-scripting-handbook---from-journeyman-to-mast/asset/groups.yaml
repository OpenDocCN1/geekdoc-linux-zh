    # INTRODUCTION: FROM A PRIVATE HELPER TO A PUBLIC UTILITY


    So far, you have written scripts that accomplish a task. You know how to call
    them and what arguments they expect. But what if you are creating a tool that
    others will use? Or what if your script becomes so complex that it needs different
    modes of operation, configuration options, and flags? At this point, a simple
    my_script.sh arg1 arg2 is no longer sufficient.


    Users expect behavior they are accustomed to from standard tools like ls, grep,
    or git: clearly defined options (-v, --verbose), a help output (--help), and clean
    error handling for incorrect input.


    In this chapter, we complete the transformation from scripter to tools. You will
    learn how to parse command-line arguments robustly and flexibly using the POSIX
    standard getops. We will design a professional directory structure for your tools
    that cleanly separates code, libraries, and documentation. And finally, you will
    learn how to write man pages (manual pages)—the official form of documentation
    in the Unix world—so that your own creations integrate seamlessly into the system.'
