    # # APPENDIX C: PARAMETER EXPANSION QUICK REFERENCE


    This appendix provides a quick-reference “cheat sheet” for the parameter expansion
    syntax covered in this chapter.


    | Expansion Syntax | Description | Example |

    |---|---|---|

    | Substring Removal | | (var="path/to/file.txt.gz") |

    | ${var*/} | Remove shortest matching prefix */ | to/file.txt.gz |

    | ${var##**/} | Remove longest matching prefix */ | file.txt.gz |

    | ${var%.*} | Remove shortest matching suffix .* | path/to/file.txt |

    | ${var%%.*} | Remove longest matching suffix .* | path/to/file |

