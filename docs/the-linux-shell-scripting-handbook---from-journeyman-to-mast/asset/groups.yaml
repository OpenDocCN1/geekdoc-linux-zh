  - "[PAGE 58]\n\n#  4.3 SCRIPT LIBRARIES: ORGANIZING AND REUSING CODE\n\nIf you have\
    \ a set of useful helper functions (e.g., logging, string manipulation, etc.),\
    \ it's impractical to copy them into every script. The solution is a **library**:\
    \ a separate file containing only function definitions.\n\n**Example of a library\
    \ file** logging.sh:\n\n```\n#!/bin/bash\n\n# This is my logging library\n# Function\
    \ to print an informational message with a timestamp\nlog_info() {\n    local\
    \ message=\"$1\"\n    echo \"[$(date+%F %T)] [INFO] $message\"\n}\n\n# Function\
    \ to print an error message\nlog_error() {\n    local message=\"$1\"\n    # Write\
    \ to stderr\n    echo \"[$(date+%F %T)] [ERROR] $message\" >&2\n}\n```\n\n**A\
    \ main script** main.sh that uses the library: The shorthand, reads the specified\
    \ file and executes its contents in the context of the current shell. This makes\
    \ all functions from logging.sh available in the main script.\n\n```\n#!/bin/bash\n\
    set -euo\n# Source my logging library. The path must be correct.\n# `dirname \"\
    $0\"` refers to the directory script itself is in.\nsource \"$(dirname \"$0\"\
    )/logging.sh\"\nlog_info \"Script started.\"\n```"
