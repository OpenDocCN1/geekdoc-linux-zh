    # APPENDIX M: BOILERPLATE FOR A PROFESSIONAL COMMAND-LINE TOOL


    Copy this code as a starting point for your new tools. It includes a robust getops
    loop, long option handling, a usage function, and a clear structure.


    ```

    #!/bin/bash

    set-euo pipefail

    # --Configuration and Default Values-

    VERSION="1.0.0"

    VERBOSE=false

    # ... other default values ...

    # --Functions-

    usage() {

    cat <<EOF

    Usage: $$(basename "${BASH_SOURCE[0]}") [-h] [-v] [--version] args

    Script description goes here.

    Available options:

    -h,--help Print this help and exit

    -v,--verbose Print script debug info

    --version Print version and exit

    EOF

    exit

    }

    # ---Argument Parsing--

    # Manual long option parsing before getopts

    for arg in "$@"; do

    shift

    case "$arg" in

    "--help") usage ;;

    "--verbose") set---"\$@" "-v"; ;;

    ```'
