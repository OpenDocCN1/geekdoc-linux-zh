- md: "\n## 6. MASTERING ARRAYS AND DATA STRUCTURES – MORE THAN JUST A LIST\n\n###\
    \ INTRODUCTION: FROM A SINGLE VALUE TO A STRUCTURED COLLECTION\n\nIn simple scripts,\
    \ a handful of variables is often sufficient to get a job done. But reality is\
    \ rarely so simple. If you need to process a list of ten servers, collect metadata\
    \ from a hundred files, or store the configuration settings of an application?\
    \ You won't get far with individual variables. You need a way to group related\
    \ data and access it efficiently.\n\nYou already know the basic form: the **indexed\
    \ array**, an ordered list of items. It's the backbone for processing lists. But\
    \ the real power to model reality lies in its more advanced counterpart: the **associative\
    \ array**, often called a **hash** or **dictionary**. It stores not just values,\
    \ but the *relationship* between them by assigning a unique, named key to each\
    \ value.\n\nIn this chapter, we will master both types. We will briefly review\
    \ the professional handling of indexed arrays and then dive deep into the world\
    \ of associative arrays. You will learn how to use them as configuration stores,\
    \ as counters, or even to simulate more complex data structures. Mastering these\
    \ structures is the difference between a script that processes data and a script\
    \ that *understands* data.\n\n### LEARNING OBJECTIVES FOR THIS CHAPTER:\n\n- Handle\
    \ indexed arrays professionally and safely, especially when iterating.\n- Securely\
    \ declare, populate, and read from associative arrays (declare -A) as key-value\
    \ stores.\n- Efficiently iterate over the keys and values of associative arrays.\n\
    - Implement typical use cases like parsing configuration files or counting elements.\n\
    - Understand the limits of shell arrays and learn how to simulate more complex\
    \ structures (e.g., a list of objects).\n\n## 6.1 INDEXED ARRAYS: THE PROFESSIONAL\
    \ APPROACH\n\nA quick review of the most important concepts with a focus on robust\
    \ practices.\n\n#### Declaration and Population:\n\n```bash\n# Declare and populate\
    \ in one step\nservers=(\"web-01\" \"db-01\" \"api-server-alpha\")\n# Add individual\
    \ elements\nservers+=(\"monitoring\")\n```\n\n#### Access and Iteration – The\
    \ Importance of Quoting: Correctly quoting during expansion is the critical point\
    \ that separates beginners from professionals.\n\n```bash\n# Wrong: Will fail\
    \ for elements with spaces\nfor server in ${servers[@]}; do ...\n# CORRECT: Treats\
    \ each element as a distinct, single string\nfor server in \"${servers[@]}\";\
    \ do\n  echo \"Processing server: $server\"\ndone\n\n# Access a single element\
    \ (index starts at 0)\necho \"The first server is: ${servers[0]}\"\n# Number of\
    \ elements\necho \"Number of servers: ${#servers[@]}\"\n```\n\n## 6.2 ASSOCIATIVE\
    \ ARRAYS: THE HEART OF STRUCTURED DATA\n\nThis is where the real magic begins.\
    \ Associative arrays must be explicitly declared with declare -A.\n\n#### Declaration\
    \ and Population:\n\n```bash\n# Declaration is mandatory!\ndeclare -A user_data\n\
    # Assign values via key-value pairs\nuser_data[\"name\"]=\"Alice\"\nuser_data[\"\
    id\"]=\"1024\"\nuser_data[\"email\"]=\"alice@example.com\"\nuser_data[\"login_count\"\
    ]=42\nuser_data[\"key\"]=\"Quality Assurance \" # Key with spaces\n```\n\n####\
    \ Access and Iteration: Accessing keys and values has a special syntax.\n\n```bash\n\
    # Access a value by its key\necho \"Username: ${user_data[name]}\"\n# Iterate\
    \ over all keys (the most important operation!)\necho \"All properties\"\nfor\
    \ key in \"${!user_data[@]}\"; do\n  value=\"${user_data[$key]}\"\n  printf \"\
    %-15s %s\\n\" \"$key\" \"$value\"\n  # Check if a key exists\n  if [[ -v user_data[\"\
    email\"] ]]; then\n    echo \"The email address exists.\"\n  fi\n  # Delete an\
    \ entry\n  unset user_data[\"login_count\"]\ndone\n```\n\n**Important:** The order\
    \ of keys in an associative array is not guaranteed.\n\n## 6.3 HANDS-ON WORKSHOP:\
    \ BUILDING A CONFIGURATION PARSER\n\nA classic use case for associative arrays\
    \ is safely parsing .ini or .conf files.\n\n**Example file** app.conf:\n\n```ini\n\
    hostname = db.internal.net\nport = 5432\nuser = admin_user\n# Password shouldn't\
    \ be here, but for example's sake\npassword = s3cr_et!\n```\n\n**The Parser Script:**\n\
    \n```bash\n#!/bin/bash\nset -euo pipefile\nparse_config() {\n  local config_file=\"\
    $1\"\n  # Nameref to return the $2\n  declare -n result_hash=\"$2\"\n  if [[ !\
    \ -f \"$config_file\" ]]; then\n    echo \"Error: Configuration file '$config_file'\
    \ not found.\" >&2\n    return 1\n  fi\n  while IFS='=' read -r key value; do\n\
    \    # Skip comments and empty lines\n    [[ \"$key\" =~ ^\\s# || -z \"$key\"\
    \ ]] && continue\n    # Trim whitespace around key and value\n    key=$(echo \"\
    $key\" | xargs)\n    value=$(echo \"$value\" | xargs)\n    result_hash[\"$key\"\
    ]=\"$value\"\n  done < \"$config_file\"\n}\n```\n\n```bash\n# Declare the destination\
    \ hash\ndeclare -A db_config\n# Call the function and pass the name of the hash\n\
    parse_config \"app.conf\" db_config\n# Work with the loaded data\necho \"Connecting\
    \ to host ${db_config[hostname]} on port ${db_config[port]}...\"\n```\n\n## 6.4\
    \ SIMULATING COMPLEX DATA STRUCTURES\n\nShell scripts don’t have native “objects”\
    \ or “structs.” But what if we have a list of users, each with multiple properties?\
    \ We can simulate this with clever naming conventions in associative arrays.\n\
    \n**Scenario:** A list of servers, each with an IP and a role.\n\n#### The Simulation\
    \ Technique: We use an index and concatenate it with the property names.\n\n```bash\n\
    #!/bin/bash\n# Data declaration\ndeclare -A servers\nserver_count=0\nadd_server()\
    \ {\n  local ip=\"$1\"\n  local role=\"$2\"\n  servers[\"${server_count}_ip\"\
    ]=\"$ip\"\n  servers[\"${server_count}_role\"]=\"$role\"\n  ((server_count++))\n\
    }\n# Populate the \"list of objects\"\nadd_server \"10.0.1.10\" \"webserver\"\n\
    add_server \"10.0.1.20\" \"database\"\nadd_server \"10.0.1.30\" \"cache\"\n\n\
    # Process the data\necho \"Server Inventory:\"\nfor ((i=0; i<server_count; i++));\
    \ do\n  ip_key=\"${i}_ip\"\n  role_key=\"${i}_role\"\n  echo \" - Server ${servers[$ip_key]},\
    \ Role=${servers[$role_key]}\"\ndone\n```\n\nThis technique, while verbose, is\
    \ extremely powerful. However, for highly complex data structures, languages like\
    \ Python or Perl are often a better fit.\n\n### CHAPTER SUMMARY\n\nYou have mastered\
    \ the handling of data collections. You can not only process simple lists with\
    \ indexed arrays but also model complex key-value data with associative arrays.\
    \ You’ve learned that they are the perfect solution for tasks like parsing configuration\
    \ or counting elements. With the technique for simulating objects, you have even\
    \ ventured beyond the standard. With this knowledge, you can now write scripts\
    \ that not only move data but also interpret it.\n\n### EXERCISES\n\n- 1. **Frequency\
    \ Count**: Write a script that reads a text file and uses an associative array\
    \ to count the frequency of each word. At the end, it should print a sorted list\
    \ of the words and their counts.\n- 2. **Improved Config Parser**: Extend the\
    \ configuration parser from the chapter. It should accept a second argument: an\
    \ indexed array of allowed keys. When parsing, only keys that appear in the list\
    \ should be added to the hash.\n- 3. **User Inventory**: Write a script that reads\
    \ /etc/passwd file. Use the technique shown in 6.4 to create a “list of objects,”\
    \ where each entry has the username (field 1), uid (field 3), and shell (field\
    \ 7). At the end, print a formatted list of all users with a UID greater than\
    \ 1000.\n\n## 7. PROCESS MANAGEMENT AND PARALLELIZATION – BECOME THE CONDUCTOR\n\
    \n### INTRODUCTION: FROM SERIAL EXECUTION TO PARALLEL ORCHESTRATION\n\nUntil now,\
    \ your scripts have likely functioned like a single-lane road: one command executes,\
    \ and only when it's finished the next one start. This is simple and predictable.\
    \ But what if you need to convert 1000 images, download 50 log files from different\
    \ servers, or compare the complex output of two commands? Serial execution quickly\
    \ becomes a bottleneck.\n\nIn this chapter, you will learn to evolve from a simple\
    \ traffic cop into the conductor of an entire orchestra. You will learn to launch\
    \ processes in the background and precisely control their execution (wait). You\
    \ will connect data streams in unimaginable ways using simple pipes (process substitution).\
    \ And you will harness the dormant power of modern multi-core CPUs to make your\
    \ scripts many times faster through parallelization.\n"
  mdcn: "\n\n## 6. 精通数组与数据结构 – 不仅仅是列表\n\n### 引言：从单个值到结构化集合\n\n在简单的脚本中，几个变量通常足以完成工作。但现实情况很少如此简单。如果你需要处理一个十个服务器的列表、从百个文件中收集元数据，或者存储应用程序的配置设置，仅靠单个变量是无法走得远的。你需要一种方法将相关数据分组并高效地访问它们。\n\
    \n你已经了解了基本形式：**索引数组**（indexed array），一个有序的项列表。它是处理列表的骨干。但建模现实的真正威力在于更高级的对应物：**关联数组**（associative\
    \ array），通常称为**哈希**（hash）或字典（dictionary）。它存储不仅是值，还通过为每个值分配一个唯一的命名的键（key）来存储它们之间的*关系*。\n\
    \n在本章中，我们将掌握这两种类型。我们将简要回顾索引数组的专业处理方法，然后深入探索关联数组的世界。你将学习如何将它们作为配置存储、计数器，甚至模拟更复杂的数据结构。精通这些结构是区分“处理数据的脚本”与“*理解*数据的脚本”的关键。\n\
    \n### 本章学习目标：\n\n- 专业且安全地处理索引数组，特别是在迭代时。\n- 安全地声明、填充和从关联数组（使用 `declare -A`）读取数据作为键值存储。\n\
    - 高效地遍历关联数组的键和值。\n- 实现典型的用例，如解析配置文件或计算元素。\n- 理解 shell 数组的局限性，并学习如何模拟更复杂的结构（例如，对象列表）。\n\
    \n## 6.1 索引数组：专业方法\n\n重点关注健壮实践，对重要概念进行快速回顾。\n\n#### 声明与填充：\n\n```bash\n# 一步完成声明和填充\n\
    servers=(\"web-01\" \"db-01\" \"api-server-alpha\")\n# 添加单个元素\nservers+=(\"monitoring\"\
    )\n```\n\n#### 访问与迭代——引号的重要性：在扩展时正确使用引号是区分初学者和专业人士的关键点。\n\n```bash\n# 错误：对于包含空格的元素会失效\n\
    for server in ${servers[@]}; do ...\n# 正确：将每个元素视为独立的单个字符串\nfor server in \"${servers[@]}\"\
    ; do\n  echo \"Processing server: $server\"\ndone\n\n# 访问单个元素（索引从 0 开始）\necho\
    \ \"The first server is: ${servers[0]}\"\n# 元素数量\necho \"Number of servers: ${#servers[@]}\"\
    \n```\n\n## 6.2 关联数组：结构化数据的核心\n\n这是魔法开始的地方。关联数组必须使用 `declare -A` 进行显式声明。\n\n####\
    \ 声明与填充：\n\n```bash\n# 必须进行声明！\ndeclare -A user_data\n# 通过键值对分配值\nuser_data[\"\
    name\"]=\"Alice\"\nuser_data[\"id\"]=\"1024\"\nuser_data[\"email\"]=\"alice@example.com\"\
    \nuser_data[\"login_count\"]=42\nuser_data[\"key\"]=\"Quality Assurance \" # 带有空格的键\n\
    ```\n\n#### 访问与迭代：访问键和值有特殊的语法。\n\n```bash\n# 通过键访问值\necho \"Username: ${user_data[name]}\"\
    \n# 遍历所有键（最重要的操作！）\necho \"All properties\"\nfor key in \"${!user_data[@]}\";\
    \ do\n  value=\"${user_data[$key]}\"\n  printf \"%-15s %s\\n\" \"$key\" \"$value\"\
    \n  # 检查键是否存在\n  if [[ -v user_data[\"email\"] ]]; then\n    echo \"The email\
    \ address exists.\"\n  fi\n  # 删除条目\n  unset user_data[\"login_count\"]\ndone\n\
    ```\n\n**重要：**关联数组中键的顺序是不保证的。\n\n## 6.3 上手工作坊：构建配置解析器\n\n关联数组的一个经典用例是安全地解析 .ini\
    \ 或 .conf 文件。\n\n**示例文件** app.conf:\n\n```ini\nhostname = db.internal.net\nport\
    \ = 5432\nuser = admin_user\n# 密码不应该在这里，但为了示例 sake起见\npassword = s3cr_et!\n```\n\
    \n**解析器脚本：**\n\n```bash\n#!/bin/bash\nset -euo pipefile\nparse_config() {\n  local\
    \ config_file=\"$1\"\n  # 使用 nameref 返回 $2\n  declare -n result_hash=\"$2\"\n\
    \  if [[ ! -f \"$config_file\" ]]; then\n    echo \"Error: Configuration file\
    \ '$config_file' not found.\" >&2\n    return 1\n  fi\n  while IFS='=' read -r\
    \ key value; do\n    # 跳过注释和空行\n    [[ \"$key\" =~ ^\\s# || -z \"$key\" ]] &&\
    \ continue\n    # 去除键和值周围的空白\n    key=$(echo \"$key\" | xargs)\n    value=$(echo\
    \ \"$value\" | xargs)\n    result_hash[\"$key\"]=\"$value\"\n  done < \"$config_file\"\
    \n}\n```\n\n```bash\n# 声明目标哈希\ndeclare -A db_config\n# 调用函数并传递哈希名称\nparse_config\
    \ \"app.conf\" db_config\n# 使用加载了的数据\necho \"Connecting to host ${db_config[hostname]}\
    \ on port ${db_config[port]}...\"\n```\n\n## 6.4 模拟复杂数据结构\n\nShell 脚本没有原生的“对象”或“结构体”。但如果我们有一个用户列表，每个用户都有多个属性呢？我们可以通过关联数组中巧妙的命名规范来模拟这一点。\n\
    \n**场景：** 一个服务器列表，每个服务器都有 IP 和角色。\n\n#### 模拟技术：我们使用索引并将其与属性名拼接。\n\n```bash\n#!/bin/bash\n\
    # 数据声明\ndeclare -A servers\nserver_count=0\nadd_server() {\n  local ip=\"$1\"\n\
    \  local role=\"$2\"\n  servers[\"${server_count}_ip\"]=\"$ip\"\n  servers[\"\
    ${server_count}_role\"]=\"$role\"\n  ((server_count++))\n}\n# 填充“对象列表”\nadd_server\
    \ \"10.0.1.10\" \"webserver\"\nadd_server \"10.0.1.20\" \"database\"\nadd_server\
    \ \"10.0.1.30\" \"cache\"\n\n# 处理数据\necho \"Server Inventory:\"\nfor ((i=0; i<server_count;\
    \ i++)); do\n  ip_key=\"${i}_ip\"\n  role_key=\"${i}_role\"\n  echo \" - Server\
    \ ${servers[$ip_key]}, Role=${servers[$role_key]}\"\ndone\n```\n\n这种技术虽然冗长，但非常强大。然而，对于高度复杂的数据结构，Python\
    \ 或 Perl 等语言通常是更好的选择。\n\n### 总结\n\n你已经掌握了数据集合的处理方法。你不仅可以使用索引数组处理简单的列表，还可以使用关联数组对复杂的键值数据建模。你学到了它们是解析配置或计算元素等任务的完美解决方案。通过模拟对象的技术，你甚至跨越了标准范围。有了这些知识，你现在可以编写不仅能移动数据还能解释数据的脚本。\n\
    \n### 练习题\n\n- 1. **频率计数**：编写一个脚本读取文本文件并使用关联数组统计每个单词出现的频率。在末尾，它应该打印单词及其计数的排序列表。\n\
    - 2. **改进的配置解析器**：扩展本章中的配置解析器。它应该接受第二个参数：一个允许的键的索引数组。解析时，只有出现在列表中的键会被添加到哈希中。\n\
    - 3. **用户清单**：编写一个脚本读取 /etc/passwd 文件。使用 6.4 节所示的技术创建一个“对象列表”，每个条目包含用户名（第1字段）、uid（第3字段）和\
    \ shell（第7字段）。在末尾，格式化打印所有 UID 大于 1000 的用户。\n\n## 7. 进程管理与并行化 – 成为指挥家\n\n### 引言：从串行执行到并行调度\n\
    \n到此为止，你的脚本可能像单行道一样运行：一个命令执行，只有当它完成后下一个命令才会开始。这简单且可预测。但如果你需要转换 1000 张图像、从不同的服务器下载\
    \ 50 个日志文件，或者比较两个命令的复杂输出呢？串行执行很快就会成为瓶颈。在本章中，你将学习如何从一个简单的交通警察变为整个交响团的指挥家。你将学习在后台启动进程并精确控制它们的执行（wait）。你将学习使用简单的管道（process\
    \ substitution）以难以想象的方式连接数据流。你还将利用现代多核 CPU 的闲置力量，通过并行化让你的脚本速度快数倍。\n\n"
