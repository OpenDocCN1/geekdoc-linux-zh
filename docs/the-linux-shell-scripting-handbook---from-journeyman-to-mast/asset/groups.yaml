    # 15.1 A LOOK BEYOND THE HORIZON: ZSH AND FISH


    Bash is the universal standard, but other shells offer interesting alternatives,
    especially for scripting.


    +   - zsh (Z Shell): The “Power-User” Bash zsh is largely backward-compatible
    with Bash but offers a wealth of improvements that are also useful for scripting:


    +   - More Powerful Globbing Patterns: ls **/*.log(.) finds only regular files;
    ls */ finds only directories.


    +   - Better Array Handling: Indexes start at 1 by default (can be intuitive),
    and slicing is easier.


    +   - Floating-Point Arithmetic: zsh natively supports calculations with decimal
    numbers.


    +   - fish (Friendly Interactive Shell): The User-Friendly Alternative fish intentionally
    breaks with POSIX compatibility to offer a simpler and more consistent syntax.


    +   - Simpler Syntax: Less need for cryptic quoting. for i in (ls); ... just works.


    +   - Lists Indexed of Strings: Variables can hold true lists of values, making
    IFS hacks obsolete.


    +   - Disadvantage: Scripts are not portable and won’t run on systems without
    fish.


    Conclusion: For scripts that require maximum portability, !/bin/sh (POSIX) remains
    the gold standard. For complex, internal tools on systems where zsh is standard,
    its features can be a blessing.'
  - '[PAGE 177]


    # 15.2 THE ART OF KNOWING WHEN TO STOP: WHEN THE SHELL IS THE WRONG TOOL


    This is the most important lesson for an advanced scripter. A shell script is
    the wrong choice when:


    +   1. Data structures become too complex. We learned to simulate objects with
    associative arrays. But if you need nested structures, trees, or graphs, the code
    quickly becomes an unreadable and error-prone nightmare.


    +   2. Performance is CPU-critical. The shell is fantastic for I/O-heavy tasks
    (reading files, starting commands). For computationally intensive algorithms (complex
    math, image processing, large in-memory data transformations), its interpreted
    nature and process overhead are far too slow.


    +   3. You need extensive external libraries. Do you need to communicate with
    a specific database via a native driver? Build a complex web application? Access
    a vast ecosystem of machine learning libraries? This is what languages with package
    managers (like Python’s pip or Node’s npm) are for.


    +   4. Robust, automated testing is a must. Although you can test shell scripts
    (e.g., with bats), the testing frameworks and the culture of unit testing are
    far more mature in languages like Python, Go, or Java.'
