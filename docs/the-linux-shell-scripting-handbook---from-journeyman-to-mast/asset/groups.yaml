    # # 7.1 MORE THAN JUST: THE ART OF JOB CONTROL IN SCRIPTS


    You know the & symbol for sending a process to the background from your interactive
    shell. In scripting, it unleashes its true power in combination with wait.


    +   * jobs: Displays the jobs running in the background.

    * wait [job_id | process_id]: Pauses the script until the specified job or process
    has finished. Without an argument, wait waits for all running background processes
    of the script.


    # The Basic Pattern for Parallel, Independent Tasks:


    ```

    #!/bin/bash

    echo "Starting all jobs..."

    # Launch several long-running processes in the background

    sleep 5 && echo "Job 1 finished." &\nsleep 3 && echo "Job 2 finished." &\nsleep
    4 && echo "Job 3 finished." &\necho "All jobs are running. Now waiting for them
    to complete..."

    # ''wait'' blocks here until the last background process has finished

    wait

    echo "All jobs have completed. Script finished."


    ```


    Without wait, the script would exit immediately, and the echo commands would execute
    later, which is rarely the desired behavior.'
  - '[PAGE 89]


    # 7.2 PROCESS SUBSTITUTION: WHEN PIPES ARE’T ENOUGH


    A pipe () is fantastic for sending the output of one command to the standard input
    of another. But what if a command expects its input from a file?

    Example: diff file1 file2. This is where process substitution comes in.


    <command> – A Command Pretends to Be a File: The shell executes the command and
    makes its stdout available via a special file in the /dev/fd directory. The outer
    command thinks it’s reading from a normal file.


    Example: Compare the contents of two directories without temporary files.


    ```

    # The "old" way with temporary files:

    ls -1 /etc > /tmp/etc.txt

    ls -1 /usr/bin > /tmp/usr_bin.txt

    diff /tmp/etc.txt /tmp/usr_bin.txt

    rm /tmp/etc.txt /tmp/usr_bin.txt

    # The elegant, modern way:

    diff <(ls -1 /etc) <(ls -1 /usr/bin)

    # No temporary files, no cleanup needed!

    ```


    >(command) – A Command Disguised as a Writable File: This is the counterpart.
    It allows the output of a command to be sent directly to the standard input of
    another, as if it were a file.'
