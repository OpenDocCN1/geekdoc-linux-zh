    # LEARNING OBJECTIVES FOR THIS CHAPTER:


    - Leverage advanced grep features like PCRE (-P), context control (-A, -B, -C),
    and performance optimizations.

    - Master sed''s hold space to save and recall patterns, enabling complex, multi-line
    operations.

    - Write complete programs in awk, using BEGIN/END blocks, built-in variables,
    and associative arrays.

    - Create powerful and efficient text-processing pipelines by combining the strengths
    of each tool.

    - Decide which tool is the right one for a specific job.


    ## 8.1 GREP: THE MASTER OF FINDING


    You know grep for finding lines. Now, let''s make it find anything.


    PCRE (-P): The Ultimate Pattern Matching Many Linux distributions ship with a
    grep that supports Perl-Compatible Regular Expressions. This unlocks incredibly
    powerful features like lookaheads, lookbehinds, and non-capturing groups.


    Example: Find lines that contain an IP address, but not if it''s 127.0.0.1.


    ```bash

    # Negative Lookbehind: ''(?<!...''

    grep -P ''(?<!127\.0\.0\.)\d{1,3}){3}\b'' /var/log/auth.log

    ```


    Context Control: Seeing the Bigger Picture Often, the matching line alone is not
    enough.

    - -A num (After): Shows num lines of trailing context after a match.

    - -B num (Before): Shows num lines of leading context before a match.

    - -C num (Context): Shows num lines of context both before and after a match.


    Example: Find an error and the 2 lines that led up to it. `grep -B 2 "ERROR" application.log`


    Performance and Efficiency

    - -F (Fixed strings): If you are searching for a literal string, not a pattern,
    -F is significantly faster. `grep -F "user.login" ...`

    - -q (Quiet): If you only need to know if a match exists (e.g., in an if statement),
    -q suppresses all output and exits immediately on the first match. `if grep -q
    "FAIL" /var/log/secure; then ...`


    ## 8.2 SED: THE STREAM EDITOR,LEASHED


    You know s/old/new/. Now, let''s explore sed''s hidden brain: the hold space.
    The hold space is a secondary, persistent buffer. You can copy or append the current
    line (from the “pattern space”) into it, and later retrieve it. This allows sed
    to “remember” things across multiple lines.


    **Hold Space Commands:**

    - h, H: Copy/Append pattern space to hold space.

    - g, G: Copy/Append hold space to pattern space.

    - x: Exchange pattern space and hold space.


    Example: Reverse the order of every two lines in a file.


    ```bash

    # For a file:

    # Line 1

    # Line 2

    # Line 3

    # Line 4

    # On line 1: Hold it.

    # On line 2: Get line 1 from hold space, append line 2, and print.

    # And so on...

    sed -n ''h;n;G;p'' input.txt

    ```


    Output:


    ```

    Line 2

    Line 1

    Line 4

    Line 3

    ```


    Example: Add a header only above a specific block. `sed ''/START_BLOCK/ { x; s/.*/MY_HEADER/;
    p; x; }'' input.txt


    ## 8.3 AWK: THE DATA-PROCESSING POWERHOUSE


    awk is not just for ''{print $1}''. It''s a full programming language designed
    for record-based data processing.


    Key Concepts:

    - BEGIN { ... } block: Executed once before any lines are read. Perfect for initializing
    variables or printing headers.

    - END { ... } block: Executed once after all lines have read. Ideal for calculations
    and printing summaries.

    - Built-in Variables: NF (Number of Fields), NR (Number of Records), FS (Field
    Separator).

    - Associative Arrays: awk''s greatest strength.


    Example: Calculate the average size of files listed by ls -l.


    ```bash

    ls -l | awk

    # Skip the first line

    NR > 1 && !/^d/

    # Add the size (field 5) to the total

    total_size += $5

    # Increment the count

    count++


    END {

    if (count > 0) {

    # Calculate and print the average

    printf "Average file size: %.2f bytes\n", total_size / count

    }}'' access.log

    ```


    Example: Count the number of connections from each IP address in a log file.


    ```bash

    awk ''{ip_counts[$1]++} END { for (ip in ip_counts) { print ip, ip_counts[ip]
    }}'' access.log

    ```


    ## 8.4 THE ART OF PIPELINE:COMBINING STRENGTHS


    The true mastery lies in knowing which tool to use for which part of the job and
    chaining them together.


    **Scenario:** From an access log, find all “404 Not Found” errors, extract the
    requested URL (field 7), count how many times each URL was requested, and display
    the top 5 most frequent.


    **The Pipeline:**

    - 1. grep: Quickly find only the relevant lines. It''s faster than awk for simple
    filtering. `grep ''404'' /var/log/access.log |`

    - 2. awk: Extract the 7th field (URL), awk is perfect for column-based data. `awk
    ''{print $7}'' |`

    - 3. sort: Sort the URLs so that identical ones are adjacent. This is a prerequisite
    for `uniq`. `sort |`

    - 4. uniq -c: Count the occurrences of identical lines. `uniq -c |`

    - 5. sort -rn: Sort the results numerically and in reverse (highest first). `sort
    -rn |`

    - 6. head -n 5: Take only the 5 lines of the sorted output. `head -n 5`


    This pipeline is a classic example of the Unix philosophy: each program does one
    thing well, and they are combined to achieve a complex result. Trying to do this
    all in a single awk or sed would be far more complex and less readable.


    ## CHAPTER SUMMARY


    You have taken three familiar tools and rediscovered them as the powerful and
    specialized instruments they are. You can now use grep for intricate pattern matching,
    sed for complex transformations, and awk as a robust data-processing language.
    More importantly, you have learned the art of synergy—how to build elegant and
    efficient pipelines by assigning each tool the task it was designed for You are
    no longer just processing text; you are engineering flows.


    ## EXERCISES


    1. **Log File Summarizer**: Write a pipeline that reads a syslog file. It should
    find all lines containing the word “CRON”, extract the username (e.g., (root)),
    count the occurrences of each username, and display a sorted list.

    2. **sed Hold Space Challenge**: Given a file with paragraphs separated by blank
    lines, write a sed script that deletes any paragraph that contains the word “legacy”.
    (Hint: Accumulate lines in the hold space until a blank line is found).

    3. **Advanced awk Report**: Write an awk script that processes the output of netstat
    -an. It should generate a report that counts how many connections are in each
    state (e.g., ESTABLISHED, TIME_WAIT, LISTEN). The output should be a formatted
    table.


    ## 9 INTERACTING WITH MODERN WEB APIS AND DATA FORMATS


    ## INTRODUCTION: THE SHELL AS A WEB CLIENT


    In the past, the command line was primarily a tool for managing a single machine.
    Text files, logs, and system processes were its domain. Today, however, the digital
    world is a vast, interconnected network of services. Your cloud servers, your
    CI/CD system, your weather provider, and even your social media feed are all accessible
    through Application Programming Interfaces (APIs). The universal language of these
    modern APIs is not plain text, but structured data formats—most commonly, JSON
    (JavaScript Object Notation).


    To remain relevant and powerful, the shell scripter must learn to speak this language.
    This chapter will transform your shell from a local system manager into a fully-fledged
    web client. You will master curl, the undisputed champion of command-line HTTP
    requests, learning how to handle everything from simple GET requests to complex
    authenticated POST operations.


    Then, you will meet jq, an indispensable tool that is to JSON what sed and awk
    are to plain text. You will learn to slice, dice, transform, and extract any piece
    of data from complex JSON documents with elegant and powerful expressions. By
    combining curl and jq, you will be able to write scripts that automate cloud infrastructure,
    query databases, or interact with virtually any modern web service, all from the
    comfort of your terminal.


    # LEARNING OBJECTIVES FOR THIS CHAPTER:


    - Master curl to make sophisticated HTTP requests, including setting headers,
    handling cookies, and using different HTTP methods (POST, PUT, DELETE).

    - Understand and implement common API authentication patterns.

    - Learn the fundamentals of jq to navigate, filter, and extract data from JSON
    objects and arrays.

    - Build complex jq expressions to transform and restructure JSON data.

    - Create a complete command-line client for a real-world REST API by combining
    curl and jq.

    - Get a brief introduction to handling XML, the other common data format, with
    xmlstarlet.

    '
