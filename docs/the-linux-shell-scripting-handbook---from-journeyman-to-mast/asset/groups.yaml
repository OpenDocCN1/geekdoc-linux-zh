    # 1.3 THE ART OF CONTROL: SET AND SHOPT


    By default, Bash is very forgiving. This is good for interactive work but a disaster
    for scripting. Activate “strict mode” at the beginning of every serious script.


    ```

    #!/bin/bash

    # Unofficial Bash Strict Mode

    set -euo pipefail

    IFS=$IFS''\n\t''

    ```


    +   * set -e (errexit): Exits the script immediately if a command exits with a
    non-zero status.


    +   * set -u (nounset): Exits the script when trying to use an undefined variable.
    Prevents countless bugs for typos.


    +   * set -o pipefail: The return value of a pipeline is the status of the last
    command to exit with a non-zero status (or zero if all commands succeed). Without
    this, erroneous_command|true would be considered a success!


    +   * shop: Toggles Bash-specific options on or off. One of the most useful is
    globstar.


    +   * shop -s globstar: Enables recursive file searching with **. Example: ls
    -l **/*.log finds all .log files in all subdirectories.'
