- md: "\n## APPENDIX L: PERFORMANCE ANTI-PATTERNS AND THEIR SOLUTIONS\n\n### Slow\
    \ Anti-Pattern (many forks)\n\n### Fast Solution (few/no forks)\n\n### Why It's\
    \ Faster\n\n```bash\nfilename=$(basename \"$path\")\n```\n\n```bash\nfilename=\"\
    ${path%/*}\"\n```\nShell Builtin (Parameter Expansion)\n\n```bash\ndir=$(dirname\
    \ \"$path\")\n```\n\n```bash\ndir=\"${path%/*}\"\n```\nShell Builtin (Parameter\
    \ Expansion)\n\n```bash\ngrep \"pattern\" file\n```\nSaves a whole cat process.\n\
    \n```bash\ncat file | wc -l\n```\n\n```bash\nwc -l < file\n```\nSaves a cat process.\
    \ awk is often even faster.\n\n```bash\nawk 'END{print NR}' file\n```\n\n```bash\n\
    head -n1 file\n```\n\n```bash\nread -r line < file\n```\nread is a shell builtin.\n\
    \n```bash\nfor i in $(seq 1 1000); do ...\n```\n\n```bash\nfor ((i=1; i<=1000;\
    \ i++)); do ...\n```\nC-style for loop is a builtin; seq is external.\n\n```bash\n\
    var=$(echo \"$str\" | sed ...)\n```\n\n```bash\nvar=\"${str/../...}\"\n```\nParameter\
    \ expansion is faster than echo + sed.\n\n```bash\nwhile read...; do ((c++));\
    \ done\n```\n\n```bash\nawk 'END{print NR}'\n```\nawk is optimized for processing\
    \ entire files.\n\n## APPENDIX M: BOILERPLATE FOR A PROFESSIONAL COMMAND-LINE\
    \ TOOL\n\nCopy this code as a starting point for your new tools. It includes a\
    \ robust getops loop, long option handling, a usage function, and a clear structure.\n\
    \n```bash\n#!/bin/bash\nset -euo pipefail\n# --Configuration and Default Values-\n\
    VERSION=\"1.0.0\"\nVERBOSE=false\n# ... other default values ...\n# --Functions-\n\
    usage() {\n  cat <<EOF\nUsage: $(basename \"${BASH_SOURCE[0]}\") [-h] [-v] [--version]\
    \ args\nScript description goes here.\nAvailable options:\n-h,--help Print this\
    \ help and exit\n-v,--verbose Print script debug info\n--version Print version\
    \ and exit\nEOF\n  exit 0\n}\n# ---Argument Parsing--\n# Manual long option parsing\
    \ before getopts\nfor arg in \"$@\"; do\n  shift\n  case \"$arg\" in\n    \"--help\"\
    ) usage ;;\n    \"--verbose\") set -- \"$@\" \"-v\" ;;\n```\n\n```bash\n\"--version\"\
    ) echo \"$(basename ${BASH_SOURCE[0]}) $VERSION\"; exit ;;\n    *) set -- \"$@\"\
    \ \"$arg\"\n  esac\ndone\n# getopts for short options\nwhile getopts ':vh' opt;\
    \ do\n  case \"$opt\" in\n    v) VERBOSE=true ;;\n    h) usage ;;\n    :) printf\
    \ \"Missing argument for -%%s\\n\\n\" \"$OPTARG\" >&2; usage ;;\n    \\?) printf\
    \ \"Invalid option: -%%s\\n\\n\" \"$OPTARG\" >&2; usage ;;\n  esac\ndone\n# Remove\
    \ the processed options\nshift $(($OPTIND - 1))\n```\n\n```bash\n# ---Main Logic---\n\
    main() {\n  if [[ \"$VERBOSE\" = true ]]; then\n    echo \"Verbose mode is enabled.\"\
    \n  fi\n  echo \"Remaining arguments: $@\"\n  # ... Your main logic here ...\n\
    }\n\nmain \"$@\"\n```\n\n## APPENDIX N: BEST PRACTICES FOR SCRIPTS IN AUTOMATION\
    \ ECOSYSTEMS\n\nThis checklist summarizes the most important patterns and rules\
    \ for writing shell scripts used in Git Hooks, CI/CD pipelines, and Docker containers.\n\
    \n| Ecosystem Practice / Rule | Why It’s Important | Example |\n| --- | --- |\
    \ --- |\n| General: Be explicit; do not rely on the environment. | The execution\
    \ environment (e.g., a CI runner) is minimal. It is not your personal shell. |\
    \ Always provide full paths or ensure PATH is set correctly. Explicitly install\
    \ all dependencies. |\n| Use set-euo pipefail | In automated systems, there is\
    \ no user to notice errors. A script must fail immediately and unambiguously on\
    \ error. | `set -euo pipefail` at the start of every script. |\n| Git Hooks Keep\
    \ hooks fast. | Hooks block the developer’s workflow (git commit, git push). Slow\
    \ hooks will be ignored or disabled. | Use fast linters (shellcheck) and only\
    \ run tests on changed files, not the entire project. |\n\nIf a hook fails, the\
    \ developer must immediately know why and what to do to fix the problem.\n\n```bash\n\
    echo \"Error: shellcheck found issues in $file. Please fix them.\"\nexit 1\n```\n\
    Provide clear error messages.\n\nKeep YAML files clean. CI/CD Pipelines YAML is\
    \ for declaring steps, not for complex logic.\n\nOutsource complex logic to separate\
    \ .sh files and call them from the pipeline: run:\n`./scripts/deploy.sh`\n\nUse\
    \ caching. CI/CD platform’s repeatedly downloading dependencies or building artifacts\
    \ is slow and expensive. Use your caching mechanisms to store dependencies like\
    \ node_modules or ~/.m2 between jobs.\n\n| Best Ecosystem Practice / Rule | Why\
    \ It’s Important | Example |\n| --- | --- | --- |\n| The exec form | Prefer the\
    \ exec form your process as PID 1 and instead of CMD over the shell forwards signals\
    \ correctly. | `CMD [\"/usr/bin/my-app\", \"-foreground\"]` |\n| /usr/bin/my-app\
    \ form | This is crucial for graceful shutdowns (docker stop). | Allows for preparing\
    \ the environment (e.g., A script that performs entrypoint.sh waiting for a database,\
    \ configuration and initialization, before the main application starts.) |\n|\
    \ Use the exec | The last command in an instruction replaces the entrypoint script’s\
    \ shell process with \"$@\" at the main application. This ensures the application\
    \ becomes PID 1 and receives signals. | Use an entrypoint.sh script that executes\
    \ ends with `exec \"$@\"` . |\n\n| Best Ecosystem Practice / Rule | Why It’s Important\
    \ | Example |\n| --- | --- | --- |\n| Build small images. | Smaller images are\
    \ faster to transfer, have a smaller attack surface, and require less disk space.\
    \ | Use multi-stage builds and start with minimal images like alpine or scratch.\
    \ |\n\n## APPENDIX O: DECISION MATRIX: SHELL SCRIPT VS HIGHER-LANGUAGE\n\nUse\
    \ this table as a guide to decide which tool is best suited for the task.\n\n\
    | Task / Requirement | Best Choice | Better Choice | Rationale |\n| --- | ---\
    \ | --- | --- |\n| Chaining Commands / \"Glue Code\" | Shell Script: Yes | No\
    \ | This is the absolute competency of the shell. |\n| Rapid Prototyping | Shell\
    \ Script: Yes | Python: Yes | The shell is unbeatable for small prototypes. Python\
    \ is a close second. |\n| Log Analysis / Text Manipulation | Shell Script: Yes\
    \ (with grep, awk) | Python: Yes | Shell pipelines are extremely powerful. Python\
    \ offers more structure for complex logic. |\n| Complex Data Structures (Objects,\
    \ Graphs) | Shell Script: No | Python/Go/etc.: Yes | The shell has only arrays.\
    \ Higher-level languages are essential for this. |\n\n| Task / Requirement | Best\
    \ Choice Shell | Better Choice | Rationale |\n| --- | --- | --- | --- |\n| CPU-Intensive\
    \ Calculations | No | Yes (Go, Rust, C++) | The interpreted nature of the shell\
    \ is a massive disadvantage. Compiled languages are necessary. |\n| Interacting\
    \ with Web APIs | Yes (with curl + jq) | Yes (Python + requests) | Good for simple\
    \ queries, but libraries offer better error handling, sessions, etc. |\n| Requires\
    \ a GUI or Web Frontend | No | Yes | Completely outside the scope of the shell.\
    \ |\n| Large, Team-Maintained Project | No | Yes | Higher-level languages offer\
    \ better testability, modularity, and tools for collaboration. |\n| Maximum Portability\
    \ on Unix Systems | Yes (#!/bin/sh) | No | A POSIX shell is available on virtually\
    \ every system. |\n"
  mdcn: "\n\n## 附录 L：性能反模式及其解决方案\n\n### 慢速反模式（大量 fork 进程）\n\n### 快速解决方案（少/无 fork 进程）\n\
    \n### 为什么更快\n\n```bash\nfilename=$(basename \"$path\")\n```\n\n```bash\nfilename=\"\
    ${path%/*}\"\n```\nShell 内置命令（参数扩展）\n\n```bash\ndir=$(dirname \"$path\")\n```\n\
    \n```bash\ndir=\"${path%/*}\"\n```\nShell 内置命令（参数扩展）\n\n```bash\ngrep \"pattern\"\
    \ file\n```\n节省了一个整个 cat 进程。\n\n```bash\ncat file | wc -l\n```\n\n```bash\nwc\
    \ -l < file\n```\n节省了一个 cat 进程。awk 通常甚至更快。\n\n```bash\nawk 'END{print NR}' file\n\
    ```\n\n```bash\nhead -n1 file\n```\n\n```bash\nread -r line < file\n```\nread\
    \ 是 shell 内置命令。\n\n```bash\nfor i in $(seq 1 1000); do ...\n```\n\n```bash\nfor\
    \ ((i=1; i<=1000; i++)); do ...\n```\nC 风格 for 循环是内置的；seq 是外部命令。\n\n```bash\n\
    var=$(echo \"$str\" | sed ...)\n```\n\n```bash\nvar=\"${str/../...}\"\n```\n参数扩展比\
    \ echo + sed 快。\n\n```bash\nwhile read...; do ((c++)); done\n```\n\n```bash\n\
    awk 'END{print NR}'\n```\nawk 针对处理文件进行了优化。\n\n## 附录 M：专业命令行工具的样板代码\n\n复制此代码作为新工具的起点。它包含了一个健壮的\
    \ getops 循环、长选项处理、用法函数和清晰的结构。\n\n```bash\n#!/bin/bash\nset -euo pipefail\n# --配置与默认值-\n\
    VERSION=\"1.0.0\"\nVERBOSE=false\n# ... 其他默认值 ...\n# --函数-\nusage() {\n  cat <<EOF\n\
    Usage: $(basename \"${BASH_SOURCE[0]}\") [-h] [-v] [--version] args\n在此处填写脚本描述。\n\
    可用选项：\n-h,--help 打印此帮助并退出\n-v,--verbose 打印脚本调试信息\n--version 打印版本并退出\nEOF\n  exit\
    \ 0\n}\n# ---参数解析--\n# 在 getopts 之前手动解析长选项\nfor arg in \"$@\"; do\n  shift\n \
    \ case \"$arg\" in\n    \"--help\") usage ;;\n    \"--verbose\") set -- \"$@\"\
    \ \"-v\" ;;\n```\n\n```bash\n\"--version\") echo \"$(basename ${BASH_SOURCE[0]})\
    \ $VERSION\"; exit ;;\n    *) set -- \"$@\" \"$arg\"\n  esac\ndone\n# 使用 getopts\
    \ 处理短选项\nwhile getopts ':vh' opt; do\n  case \"$opt\" in\n    v) VERBOSE=true\
    \ ;;\n    h) usage ;;\n    :) printf \"Missing argument for -%%s\\n\\n\" \"$OPTARG\"\
    \ >&2; usage ;;\n    \\?) printf \"Invalid option: -%%s\\n\\n\" \"$OPTARG\" >&2;\
    \ usage ;;\n  esac\ndone\n# 移除已处理的选项\nshift $(($OPTIND - 1))\n```\n\n```bash\n\
    # ---主逻辑---\nmain() {\n  if [[ \"$VERBOSE\" = true ]]; then\n    echo \"Verbose\
    \ mode is enabled.\"\n  fi\n  echo \"Remaining arguments: $@\"\n  # ... 在此处编写你的主逻辑\
    \ ...\n}\n\nmain \"$@\"\n```\n\n## 附录 N：自动化生态系统脚本的最佳实践\n\n此清单总结了编写用于 Git Hooks、CI/CD\
    \ 流水线和 Docker 容器的 shell 脚本最重要的模式和规则。\n\n| 生态系统实践 / 规则 | 为什么重要 | 示例 |\n| --- |\
    \ --- | --- |\n| 通用：显式化；不要依赖环境。 | 执行环境（例如，CI 运行器）是极简的。它不是你的个人 shell。 | 始终提供完整路径或确保\
    \ PATH 设置正确。显式安装所有依赖项。 |\n| 使用 `set-euo pipefail` | 在自动化系统中，没有用户来注意错误。脚本在出错时必须立即且无歧义地失败。\
    \ | 在每个脚本开头使用 `set -euo pipefail`。 |\n| Git Hooks 保持钩快速。 | Hook 会阻塞开发者的工作流（git\
    \ commit, git push）。缓慢的 hook 将被忽略或禁用。 | 使用快速的 lint 检查 (shellcheck)，并仅对更改的文件运行测试，而不是整个项目。\
    \ |\n\n如果 hook 失败，开发者必须立即知道原因以及如何修复该问题。\n\n```bash\necho \"Error: shellcheck found\
    \ issues in $file. Please fix them.\"\nexit 1\n```\n提供清晰的错误信息。\n\n保持 YAML 文件整洁。CI/CD\
    \ 流水线的 YAML 用于声明步骤，而不是复杂的逻辑。\n\n将复杂逻辑外包到单独的 .sh 文件并在流水线调用它们：运行：\n`./scripts/deploy.sh`\n\
    \n使用缓存。CI/CD 平台反复下载依赖项或构建产物既慢又昂贵。使用你的缓存机制在作业之间存储 node_modules 或 ~/.m2 等依赖项。\n\n\
    | 最佳生态系统实践 / 规则 | 为什么重要 | 示例 |\n| --- | --- | --- |\n| exec 格式 | 优选使用 exec 格式让你的进程作为\
    \ PID 1 运行，而不是通过 shell 运行 CMD，这样可以正确传递信号。 | `CMD [\"/usr/bin/my-app\", \"-foreground\"\
    ]` |\n| /usr/bin/my-app 格式 | 这对于优雅停机（docker stop）至关重要。 | 允许准备环境（例如，一个执行 entrypoint.sh\
    \ 的脚本，等待主应用程序启动。） |\n| 使用 exec | 最后一个命令替换 shell 进程成为 PID 1 接收信号。 | 使用 entrypoint\
    \ 脚本执行 `\"$@\"` |\n\n| 最佳生态系统实践 / 规则 | 为什么重要 | 示例 |\n| --- | --- | --- |\n| 构建小型镜像。\
    \ | 更小的镜像传输更快、攻击面更小且占用磁盘空间少。 | 使用多阶段构建并从极简镜像开始。 |\n\n## 附录 O：决策矩阵：shell 脚本对比高级语言\n\
    \n使用此表作为判断哪个工具最适合任务的指南。\n\n| 任务 / 要求 | 最佳选择 | 更好的选择 | 原因 |\n| --- | --- | ---\
    \ | --- |\n| 命令组合 / “胶水”代码 | Shell 脚本: 是 |  | 这是 shell 的绝对优势。 |\n| 快速原型 | Shell\
    \ 脚本: 是 | Python: 是 | shell 对于小型原型是无比拟的。Python 紧随其后。 |\n| 日志分析 / 文本处理 | Shell\
    \ 脚本: 是（配合 grep, awk） | Python: 是 | shell 管道非常强大。Python 为复杂逻辑提供了更好的结构。 |\n| 复杂数据结构（对象、图）\
    \ | Shell 脚本: 否 | Python/Go/etc.: 是 | shell 仅有数组。高级语言对此至关重要。 |\n\n| 任务 / 要求 |\
    \ 最佳选择：Shell | 更好的选择 | 原因 |\n| --- | --- | --- | --- |\n| CPU 密集型计算 | 否 | 是 (Go,\
    \ Rust, C++) | shell 的解释型特性是巨大的劣势。编译语言是必要的。 |\n| 与 Web API 交互 | 是（配合 curl + jq）\
    \ | 是（Python + requests） | 适用于简单查询，但提供了更好的错误处理、会话等。 |\n| 需要 GUI 或 Web 前端 | 否 |\
    \ 是 | 完全超出 shell 的范畴。 |\n| 大型团队维护项目 | 否 | 是 | 高级语言提供了更好的可测试性、模块化和协作工具。 |\n| 在\
    \ Unix 系统上的最大可移植性 | 是 (#!/bin/sh) | 否 | POSIX shell 几乎存在于每个系统。 |\n\n"
