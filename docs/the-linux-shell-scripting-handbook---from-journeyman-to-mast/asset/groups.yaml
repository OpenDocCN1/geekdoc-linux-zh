    \ data.\n\n```bash\ncurl -X POST \\\n-H \"Content-Type: application/json\" \\\n\
    -d '{\"username\":\"alice\",\"score\":100}' \\\nhttps://api.example.com/v1/user/profile\n\
    ```\n\n**Handling Authentication:** Most APIs require authentication. A common\
    \ method is using a bearer token in an Authorization header.\n\n```bash\nAPI_TOKEN=\"\
    your_super_secret_token_here\"\ncurl -s -H \"Authorization: Bearer ${API_TOKEN}\"\
    \ \\\nhttps://api.example.com/v1/user/profile\n```\n\n(Remember the lessons from\
    \ Chapter 10: Never hard-code secrets!)\n\n## 9.2 INTRODUCTION TO JQ: THE SED/AWK\
    \ FOR JSON\n\nImagine receiving this JSON response from the API call:\n\n```json\n\
    {\n  \"user\": {\n    \"id\": 101,\n    \"username\": \"alice\",\n    \"real_name\"\
    : \"Alice Smith\",\n    \"is_active\": true\n  },\n  \"roles\": [\"editor\", \"\
    contributor\"],\n  \"last_login\": \"2023-10-28T10:00:00Z\"\n}\n```\n\nTrying\
    \ to parse this with grep and sed is fragile and will break. jq is designed for\
    \ this.\n\n**Basic Filters:**\n- .: The identity filter; outputs the entire input,\
    \ pretty-printed.\n- .key: Access a value by its key.\n- .[index]: Access an array\
    \ element by its index.\n\n**Piping** curl to jq: This is the fundamental workflow.\n\
    \n```bash\n# Get the username\ncurl -s ... | jq '.user.username'\n# -> \"alice\"\
    \ (Note the quotes, it's a JSON string)\n# To get the raw string without quotes,\
    \ use the -r flag\ncurl -s ... | jq -r '.user.username'\n# -> alice\n# Get the\
    \ first role\ncurl -s ... | jq -r '.roles[0]'\n# -> editor\n```\n\n## 9.3 ADVANCED\
    \ JQ EXPRESSIONS\n\njq's power comes from its ability to chain filters together\
    \ with a pipe |, just like the shell.\n\n**Chaining and Object Construction:**\
    \ You can build new JSON objects on the fly.\n\nExample: Create a new object with\
    \ only the user ID and the last login time.\n\n```bash\ncurl -s ... | jq '{user_id:\
    \ .user.id, login: .last_login}'\n```\n\nOutput:\n\n```json\n{\n  \"user_id\"\
    : 101,\n  \"login\": \"2023-10-28T10:00:00Z\"\n}\n```\n\n**Working with Arrays:**\n\
    - map(expression): Applies an expression to each element of an array.\n- select(condition):\
    \ Filters elements based on a boolean condition.\n\nExample: From a list of users,\
    \ get the names of all active users. Input JSON:\n\n```json\n[\n  {\"name\": \"\
    alice\", \"active\": true},\n  {\"name\": \"bob\", \"active\": false},\n  {\"\
    name\": \"carol\", \"active\": true}\n]\n```\n\njq command:\n\n```bash\njq '.[]\
    \ select(.active == true) | .name'\n```\n\n# Or, or more idiomatically:\n\n```bash\n\
    jq -r '.[] select(.active) | .name'\n```\n\nOutput:\n\nalice\ncarol\n\n## 9.4\
    \ HANDS-ON WORKSHOP: BUILDING A GITHUB API CLIENT\n\nLet’s build a simple script\
