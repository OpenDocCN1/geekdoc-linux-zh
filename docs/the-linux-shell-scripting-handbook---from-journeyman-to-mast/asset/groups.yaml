    \ macOS 上时，会发生什么？突然，你功能完美的脚本可能会崩溃并弹出晦的错误信息。\n\n原因在于：你在使用一种方言（Bash），而这种方言要求最低公约数（POSIX）。POSIX\
    \ 标准定义了几乎每个类 Unix 系统都遵循的 Shell 和命令行工具的基础规范。遵循这些规则的脚本是**可移植的**。它就像一个通用旅行适配器：随处可用。\n\
    \n在本章中，你将学会有意识地识别 Bash 特有的扩展（Bash-isms）与可移植的 POSIX 标准之间的区别。你将学习如何编写健壮、通用的脚本，无论系统如何，它们在今天和十年后都能正常工作。这不是一项学术练习——对于任何为他人开发工具或在异构环境中工作的人来说，都是一项必备技能。\n\
    \n## 本章学习目标：\n\n- 理解 `#!/bin/sh` 和 `#!/bin/bash` 之间的根本区别。\n- 识别常见的不可移植 Bash 扩展（Bash-isms）。\n\
    - 将 Bash 特有的代码重写为等效的可移植 POSIX 代码。\n- 有效使用 `shellcheck` 工具发现可移植性问题。\n- 就何时需要最大可移植性以及何时使用\
    \ Bash 特性更好做出有意识的决定。\n\n## 2.1 Shebang 决战：#!/BIN/SH VS. #!/BIN/BASH\n\n脚本的第一行，即\
    \ shebang（解释器），是一个显式指令。\n\n- `#!//bin/bash`: 你正在告诉系统：“此脚本需要 Bash 及其所有扩展。请使用 /bin/bash\
    \ 执行它。”\n- `#!//bin/sh`: 你正在告诉系统：“此脚本是可移植的。请使用在 /bin/sh 找到的默认系统 Shell 执行它。”\n\n\
    关键点在于 `/bin/sh` 并不总是 bash。\n\n- 在许多 Debian/Ubuntu 系统上，`/bin/sh` 是指向 dash 的符号链接，dash\
    \ 是非常快速、极简且严格遵守 POSIX 规范的 shell。\n- 在 macOS 上，`/bin/sh` 是以 POSIX 模式运行的旧版 Bash。\n\
    - 在 Alpine Linux（在 Docker 中非常流行）中，`/bin/sh` 是指向 ash 的链接，另一个极简 shell。\n\n崩溃示例：将其保存为\
    \ test.sh 并赋予可执行权限。\n\n```bash\n#!/bin/sh\nif [[ \"a\" == \"a\" ]]; then\necho\
    \ \"Equal\"\nfi\n```\n\n运行它：`sh ./test.sh`。在 Debian/Ubuntu 系统上，你会收到错误：`./test.sh:\
    \ 2: [[: not found`。`[[...]]` 运算符是 dash 不理解的 Bash 特性。\n\n## 2.2 POSIX 工具箱：常见的\
    \ Bash-isms 及其替代方案\n\n为了编写可移植脚本，你必须将 Bash 的“奢侈功能”替换为对应的通用版本。\n\n1. **条件表达式：**\
    \ `[[...]]` vs. `[...]`\n\n- Bash-ism：`[[ $var1 == $var2 & $var2 != \"foo\" ]]`\n\
    - 优点：对单词拆分（word-splitting）更安全，支持扩展运算符（如用于模式匹配的 `==`）以及逻辑分组的 `&&||`。\n- POSIX 标准：`[\"\
    var1\" = \"var2\"] & [ \"var2\" != \"foo\" ]`\n- 规则：\n    - 始终加引号！`[ $var ]` 如果\
    \ `$var` 为空或包含空格可能会失败。`[ \"var\" ]` 是安全的。\n    - 使用单个 `=` 进行字符串比较。`==` 不是标准。\n\
    \    - 避免 `-a` (AND) 和 `-o` (OR)。它们不可靠。相反，请使用 `&&` 和 `||` 链接多个测试。\n\n2. **算术：**\
    \ `((...))` vs. `$((...))` 和 `expr`\n\n- Bash-ism：`(( i++ ))`\n- POSIX 标准：`i=$((i\
    \ + 1))`\n- 用于算术评估求值的 `$((...))` 扩展是 POSIX 标准的一部分，也是首选的现代方法。\n- “老派”方法：`i=$expr(\"\
    si\" + 1)`\n\n`expr` 也是可移植的，但由于是外部命令，它更复杂且更慢。你应该能够识别它，但应优先使用 `$((...))`。\n\n##\
    \ 3. 函数声明：`function` vs. `()`\n\n- Bash-ism：`function my_func { ... }`\n- POSIX\
    \ 标准：`my_func() { ... }`\n- 只需省略 `function` 关键字即可。`()` 语法是通用的。\n\n## 4. 数据结构：关联数组\
    \ &\n\n- Bash-ism：`declare -A my_hash`\n- POSIX 标准：没有直接等价物。\n- 解决方案：这里你必须发挥创意。可以使用具有关联数组的\
    \ awk，或者以简单的格式处理数据。\n\n## 2.3 默默的英雄：SHELLCHECK\n\n你不需要记忆所有的 POSIX 规则。`shellcheck`\
    \ 工具是你的个人代码审查员，它可以检查脚本中的常见 Bug、样式问题和可移植性陷阱。\n\n安装（Debian/Ubuntu 示例）：sudo apt-get\
    \ install shellcheck\n\n用用法：假设有一个包含 Bash-isms 的脚本 `bad_script.sh`：\n\n```bash\n\
    #!/bin/sh\nmy_array=(a b c)\nif [[ ${my_array[0]} == \"a\" ]]; then\n  echo \"\
    It Works\"\nfi\n```\n\n在 POSIX 模式 (`-s sh`) 下对其运行 shellcheck：`shellcheck -s bad_script.sh`\n\
    \n# 潜在输出：\n\nIn bad_script.sh line 2:\nmy_array=(a b c)\n> ^-SC3010: In POSIX\
    \ sh, array assignments are not supported\n\nIn bad_script.sh line 3:\nif [[ ${my_array[0]}\
    \ == \"a\" ]]; then\n> ^-SC3014: In POSIX sh, [[ ]] is not supported. Use [ ].\n\
    > ^-SC3058: In POSIX sh, array references are not supported\n\nshellcheck 会准确告诉你哪些是不可移植的。它是任何严肃脚本编写者不可缺的工具。\n\
    \n## 2.4 务实的脚本编写：什么时候过度追求移植性？\n\n最大可移植性并不是终极目标。它是通用性与便利性之间的平衡。\n\n- 个人使用的脚本：如果你只是为你自己自己的已知系统编写脚本，请随意使用让工作更轻松的\
    \ Bash 特性。\n- 团队/公司脚本：如果脚本需要运行在你控制的各种 Linux 服务器上（例如所有的 RHEL 8），你可以依赖那里的 Bash 版本。\n\
    - 公共/CI/CD/Docker 工具：这是可移植性至关重要的地方。如果你不知道代码将在哪里执行，请为 `#!/bin/sh` 编写并使用 shellcheck。\n\
    \n艺术在于有意识地决定，而不是无意中编写不可移植的代码。\n\n"
