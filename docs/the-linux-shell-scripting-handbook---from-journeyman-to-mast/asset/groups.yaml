  - '[PAGE 91]


    # # 7.3 COPROCESSES (COPROC): TWO-WAY COMMUNICATION


    This is one of the most advanced techniques. A coprocess is a background process
    with which your main script can communicate via two dedicated pipes: you can send
    it commands and read replies from it.


    **Syntax:** coproc NAME { commands; } * NAME[0]: A file descriptor number to read
    from the coprocess. * NAME[1]: A file descriptor number to write to the coprocess.


    *Example: Interacting with the bc calculator*


    ```

    !/bin/bash

    # Start ''bc'' as a coprocess named ''CALC''

    coproc CALC { bc -l; }

    # Send commands to the coprocess

    echo ''10 /3'' >&${CALC[1]}

    echo ''sqrt(100)'' >&${CALC[1]}

    # Read the replies from the coprocess

    read -r result1 <${CALC[0]}

    read -r result2 <${CALC[0]}

    echo "Result 1: $result1"

    echo "Result 2: $result2"

    # Close the coprocess

    exec {CALC[1]}>&-

    ```


    Coprocesses are ideal for scenarios where a persistent connection or state needs
    to be maintained in the background process.'
