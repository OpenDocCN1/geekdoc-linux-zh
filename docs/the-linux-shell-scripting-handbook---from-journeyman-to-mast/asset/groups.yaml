    # 10. SECURE SCRIPTING PRACTICES – BUILD A FORTRESS, NOT A SHED'
  - '[PAGE 120]


    # INTRODUCTION: FROM “DOES IT WORK?” TO “IS IT SECURE?”


    A script that accomplishes its task is good. A script that accomplishes its task
    without accidentally compromising your entire system is professional. in today’s
    interconnected world, every line of code that runs on a server is a potential
    point of entry. A carelessly written script can leak passwords, execute unauthorized
    code, or delete sensitive data.


    In this chapter, we will fundamentally change our mindset. We will stop building
    scripts like open sheds that anyone can wander into and start building digital
    fortresses. Security is not a feature you add at the end; it is the foundation
    upon which everything else is built.


    We will illuminate the most common and dangerous security pitfalls in shell scripts
    and give you the tools and techniques to avoid them. You will learn to guard secrets
    like a spy, treat user input like a suspicious border agent, and operate with
    the least privilege necessary. Mastering these practices is not just a technical
    skill—it is a professional responsibility.'
  - '[PAGE 121]


    # # LEARNING OBJECTIVES FOR THIS CHAPTER:


    +   - Securely manage secrets (passwords, API keys) without ever storing them
    in your code.

    - Understand the deadly threat of command injection and prevent it through rigorous
    quoting and validation.

    - Create temporary files and directories safely and without race conditions using
    mktemp.

    - Understand and use umask to control the default permissions of newly created
    files.

    - Apply the Principle of Least Privilege to minimize the potential damage of your
    scripts.'
  - '[PAGE 122]


    # 10.1 THE FIRST COMMANDMENT: NEVER STORE SECRETS IN A SCRIPT


    This is the most common and dangerous mistake. An API token or database password
    hard-coded in a script will inevitably end up in a Git repository, a backup, or
    a public pastebin.


    Method 1: Environment Variables (The Standard Way) Secrets should be passed to
    the script at runtime via the environment.


    ```

    # BAD:

    DB_PASSWORD="MySuperSecretPassword123"

    mysql --user=admin --password="$DB_PASSWORD" -e ""

    # BETTER: The script expects the variable to already exist.

    # Check if the variable is set, otherwise exit safely.

    : "${DB_PASSWORD}:Error: The DB_PASSWORD environment variable is not set."

    mys --user=admin --password="$DB_PASSWORD" -e ""

    # Calling the script:

    export DB_PASSWORD="MySuperSecretPassword123"

    ./my_script.sh

    # Or for a single invocation

    $DB_PASSWORD="..." ./my_script.sh

    ```


    Method 2: Configuration or Credential Files Many tools use configuration files
    in the home directory (e.g., ~/aws/credentials, ~/.my.conf). you can emulate this
    pattern.


    +   - Create a file ~/.my_app.conf with the content API_TOKEN=...


    +   - Important: Set extremely restrictive permissions: chmod 600 ~/.my_app.conf.


    +   - In the script: source ~/.my_app.conf


    Method 3 (Professional): Secret Management Systems In production environments,
    tools use HashiCorp Vault or AWS Secrets Manager are used.'
- md: "\nA script would authenticate with these services and fetch secrets at runtime.\n\
    \n## 10.2 THE PLAGUE OF COMMAND INJECTION\n\nThis occurs when a script accepts\
    \ user input (e.g., a filename) and carelessly uses it in a command. This allows\
    \ an attacker to inject their own code.\n\nThe Disasterous Example: A script meant\
    \ to delete a user-specified report.\n`report_name=\"$1\" rm /var/www/reports/$report_name`\n\
    \nAn attacker calls the script like this: `./delete_report.sh \"dummy.txt; rm\
    \ -rf /\"` The shell executes two commands: `rm /var/www/reports/dummy.txt` and\
    \ `rm -rf /`!\n\n## The Cures:\n\n1. **Always, always, always quote!** `\"/var/www/reports/$report_name\"\
    ` Now, the entire string `dummy.txt; rm -rf /` is passed as a *single* filename\
    \ to rm, resulting in a \"file not found\" error—the system is safe.\n2. **Validate\
    \ your input.** Only allow characters that make sense in a filename.\n```bash\n\
    if [ ! \"$report_name\" =~ ^[a-zA-Z0-9_\\-]+$ ]; then\n  echo \"Error: Invalid\
    \ filename.\"&2\n  exit 1\nfi\n```\n3. **Never use eval with user input.** eval\
    \ is the most powerful and dangerous tool in the shell. It interprets a string\
    \ as code to be executed. If that string comes from an external source, it's an\
    \ open invitation for compromise.\n\n## 10.3 THE MINEFIELD OF TEMPORARY FILES:\
    \ MKTEMP IS YOUR FRIEND\n\nNever, under any circumstances, you should create a\
    \ temporary file with a fixed or predictable name.\n\nBAD: `tmp_file=\"tmp/my_script_$\"\
    ` Between the creation and use of this file, attacker can replace it with a symbolic\
    \ link to a critical system file (`/etc/passwd`). This is known as a race condition\
    \ attack.\n\nThe Only Correct Solution: mktemp creates a file (or directory) with\
    \ a guaranteed unique name and secure permissions, and returns the name.\n\n```bash\n\
    # Create a secure temporary file\ntmp_file=$(mktemp)\n# Create a secure temporary\
    \ directory (often even better)\ntmp_dir=$(mktemp -d)\n# IMPORTANT: Combine with\
    \ `trap EXIT` for cleanup\ntrap 'rm -rf \"$tmp_dir\" EXIT\n# Work safely inside\
    \ this directory\n...\n```\n\n## 10.4 PERMISSIONS AND THE PRINCIPLE OF LEAST PRIVILEGE\n\
    \n### umask: The Default Birth Certificate for Files\nThe umask (file-creation\
    \ mode mask) determines which permissions a newly created file does not get. A\
    \ security-critical script should set a restrictive umask at the beginning.\n\n\
    ```bash\n# Set a very restrictive umask for this script\n# 077 means: Only the\
    \ owner has read/write/execute permissions.\n# Group and Others have NO rights.\n\
    umask 077\ntouch new_file # This file will be created with 600 (-rw--) permissions\n\
    mkdir new_directory # This directory will be created with 700 (drwx--- )\n```\n\
    \n### 2. The Principle of Least Privilege\nA script should always run with the\
    \ minimum privileges necessary to do its job.\n\n- A backup script that only needs\
    \ to back up the files of a specific user (webuser) should not run as root. It\
    \ should run as webuser.\n- Use `sudo -u <user> my_script.sh` to run a script\
    \ as another user.\n- Avoid giving scripts unnecessary setuid permissions.\n\n\
    ## CHAPTER SUMMARY\n\nYou have learned that security is not a feature, but a fundamental\
    \ design decision. You now know how to avoid the cardinal sins of script security:\
    \ you never store secrets directly in code, instead loading them safely from the\
    \ environment. You treat all external input with extreme suspicion and prevent\
    \ command injection through rigorous quoting and validation. You now create temporary\
    \ files only with mktemp and reliably clean them up with trap. By consciously\
    \ using umask and adhering to the principle of least privilege, you ensure your\
    \ scripts can do as little potential damage as possible. You are no longer just\
    \ building scripts—you are building fortresses.\n\n## EXERCISES\n\n1. **Refactoring\
    \ Insecure Script:** Take a script that has a hard-coded API key. Change it to\
    \ read the key from an environment variable. The script should exit with an error\
    \ if the variable is not set.\n\n2. **Hardening a Script:** You are given the\
    \ following script for a code review. Identify and fix at least three distinct\
    \ security vulnerabilities.\n\n```bash\n#!/bin/bash\n# This script compresses\
    \ a folder specified by the user\nTARGET_DIR=$1\nOUTPUT_FILE=\"/tmp/backup.tar.gz\"\
    \ntar -czf $OUTPUT_FILE $TARGET_DIR\necho \"Backup created at $OUTPUT_FILE\"\n\
    ```\n\n3. **Secure Processing Pipeline:** Write a script that downloads a large\
    \ file, unzips it in a secure temporary directory, and then processes it. The\
    \ script must guarantee that the temporary directory is deleted under all circumstances\
    \ (success, error, or interruption).\n\n## 11. SCRIPTING THE NETWORK – THE SHELL\
    \ AS A NETWORK ENGINEER\n\n## INTRODUCTION: FROM LOCALHOST TO THE GLOBAL NETWORK\n\
    \nBy now, your scripts have mastered the local machine. They can manipulate files,\
    \ control processes, and transform data. The true power of modern systems lies\
    \ in their interconnectedness. Servers communicate with each other, offer their\
    \ functionality over network ports, and administration often requires access to\
    \ dozens or hundreds of remote machines.\n\nIn this chapter, we will break the\
    \ boundaries of localhost and turn your shell into a fully-fledged networking\
    \ tool. You will learn that you don't need complex programming languages to check\
    \ network services, transfer data securely, or automate repetitive tasks on remote\
    \ servers. The tools are already there, waiting for you to conduct them.\n\nWe\
    \ will go beyond a simple ping and speak directly to TCP and UDP ports with netcat.\
    \ We will use nmap not as a manual hacking tool, but as a scripted inventory and\
    \ monitoring assistant. And most importantly, we will master the art of SSH automation\
    \ to enable passwordless, secure, and scalable remote administration.\n\n## LEARNING\
    \ OBJECTIVES FOR THIS CHAPTER:\n\n- Actively and programmatically check network\
    \ ports and services with netcat (nc) and nmap.\n- Use the basics of nmap for\
    \ automated network discovery and port scanning.\n- Set up and securely use passwordless\
    \ SSH connections with key-based authentication.\n- Automate repetitive tasks\
    \ on many servers in parallel using SSH loops.\n- Transfer files securely and\
    \ automatically with scp and rsync.\n- Understand and use SSH tunneling (port\
    \ forwarding) to secure unsafe services.\n\n## 11.1 THE NETWORK’S PULSE: QUERYING\
    \ SERVICES WITH NETCAT AND NMAP\n\n**netcat (nc): The TCP/IP Swiss Army Knife**\n\
    netcat is a simple yet extremely powerful tool for creating raw TCP or UDP connections.\
    \ It’s perfect for testing if a service is listening on a specific port.\n\n-\
    \ -z: Zero-I/O mode. Only checks if the port is open, without sending any data.\n\
    - -v: Verbose. Prints more information.\n- -w timeout: Sets a timeout in seconds.\n\
    \nExample: Check if a web server and a mail server are reachable.\n\n```bash\n\
    #!/bin/bash\nHOST=\"example.com\"\nWEB_PORT=80\nMAIL_PORT=25\necho \"Checking\
    \ host: $HOST\"\n# -w 3 sets a 3-second timeout\nif nc -z -v -w 3 \"$HOST\" \"\
    $WEB_PORT\"; then\n  echo \"Web server on port $WEB_PORT is reachable.\"\nelse\n\
    \  echo \"Web server on port $WEB_PORT is NOT reachable.\"\nfi\n```\n\n**nmap:\
    \ The Network Scanner for Scripts**\nWhile nc tests one port, nmap scan entire\
    \ networks and thousands of ports. For scripting, the “grep-able” output mode\
    \ (-oG) is particularly useful.\n\nExample: Find all hosts in a subnet that have\
    \ the SSH port (22) open.\n\n```bash\nSUBNET=\"192.168.1.0/24\"\n```\n\n```bash\n\
    # -p 22: Scan only port 22\n# -oG -: Output in grep-able format to stdout\n# The\
    \ '-' as a filename means stdout\nnmap -p 22 -oG - \"$SUBNET\" | awk '/Host: .*\
    \ /Status: Up/{print $2}'\n```\n\nThis output can be directly processed in a loop\
    \ to, for example, execute a command on all of these hosts.\n\n## 11.2 AUTOMATION\
    \ WITH SSH: THE KEYS TO THE KINGDOM\n\nRepeatedly typing passwords is the death\
    \ of automation. The solution is key-based authentication.\n\n**Step 1: Create\
    \ a Key Pair (if you don't have one)** `ssh-keygen -t ed25519` (or rsa). Accept\
    \ the defaults.\n\n**Step 2: Copy Your Public Key to the Target Server** `ssh-copy-id\
    \ user@target-server` This command securely appends your public key (`~/.ssh/id_ed25519.pub`)\
    \ to the `~/.ssh/authorized_keys` file on the target server. You will have to\
    \ enter your password one last time.\n\n**Step 3: Connect Without a Password**\
    \ From now on, you can connect with `ssh user@target-server` without a password\
    \ prompt.\n"
  mdcn: "\n\n脚本将与这些服务进行身份验证并在运行时获取机密。\n\n## 10.2 命令注入的瘟疫\n\n这发生于脚本接受用户输入（例如，文件名）并粗率地将其用于命令中时。这允许攻击者注入自己的代码。\n\
    \n灾难性示例：一个旨在删除用户指定报告的脚本。\n`report_name=\"$1\" rm /var/www/reports/$report_name`\n\
    \n攻击者像这样调用脚本：`./delete_report.sh \"dummy.txt; rm -rf /\"`。shell 执行了两个命令：`rm /var/www/reports/dummy.txt`\
    \ 和 `rm -rf /`！\n\n## 救办法：\n\n1. **始终、始终、始终加引号！** `\"/var/www/reports/$report_name\"\
    ` 现在，整个字符串 `dummy.txt; rm -rf /` 被作为一个*单个*文件名传递给 rm，导致“文件未找到”错误——系统是安全的。\n2. **验证你的输入。**\
    \ 仅允许文件名中合理的字符。\n```bash\nif [ ! \"$report_name\" =~ ^[a-zA-Z0-9_\\-]+$ ]; then\n\
    \  echo \"Error: Invalid filename.\"&2\n  exit 1\nfi\n```\n3. **永远不要对用户输入使用 eval。**\
    \ eval 是 shell 中最强大且危险的工具。它将字符串解释为要执行的代码。如果该字符串来自外部源，它等同于邀请攻击者入侵。\n\n## 10.3 临时文件的雷区：MKTEMP\
    \ 是你的朋友\n\n在任何情况下，你都不应该创建一个具有固定或可预测名称的临时文件。\n\n错误做法：`tmp_file=\"tmp/my_script_$\"\
    `。在文件的文件的创建和使用之间，攻击者可以将其替换为指向关键系统文件（`/etc/passwd`）的符号链接。这被称为竞态条件攻击。\n\n唯一的正确解决方案：mktemp\
    \ 创建一个具有保证唯一名称和安全权限的文件（或目录），并返回该名称。\n\n```bash\n# 创建一个安全的临时文件\ntmp_file=$(mktemp)\n\
    # 创建一个安全的临时目录（通常更好）\ntmp_dir=$(mktemp -d)\n# 重要：结合 `trap EXIT` 进行清理\ntrap 'rm\
    \ -rf \"$tmp_dir\" EXIT\n# 在此目录内安全工作\n...\n```\n\n## 10.4 权限与最小权限原则\n\n### umask：文件的默认出生证明\n\
    umask（文件创建模式掩码）决定了新创建的文件不会获得哪些权限。安全关键型脚本应该在开头设置一个限制性的 umask。\n\n```bash\n#为此脚本设置非常严格的\
    \ umask\n# 077 意味着：只有所有者读/写/执行权限。\n# 组和其他没有任何权限。\numask 077\ntouch new_file #\
    \ 此文件将以 600 (-rw--) 权限创建\nmkdir new_directory # 此目录将以 700 (drwx--- ) 权限创建\n```\n\
    \n### 2. 最小权限原则\n脚本应该始终以工作所需的最小权限运行。\n\n- 一个只需要备份特定用户（webuser）文件的备份脚本不应以 root\
    \ 身份运行。它应该以 webuser 身份运行。\n- 使用 `sudo -u <user> my_script.sh` 以另一个用户运行脚本。\n- 避免赋予脚本不必要的\
    \ setuid 权限。\n\n## 章节总结\n\n你已经学到了安全不是一个特性，而是一个基础设计决策。你现在知道如何避免脚本安全中的大罪：你永远不会直接在代码中存储机密，而是从环境中安全地加载它们。你对所有外部输入都保持极度怀疑，并通过严格的加引号和验证防止命令注入。你现在只使用\
    \ mktemp 创建临时文件，并使用 trap 可靠地清理它们。通过有意识地使用 umask 并遵循最小权限原则，你确保了脚本可以造成的潜在损害降到最低。你不再是在编写脚本——你正在构建堡垒。\n\
    \n## 练习题\n\n1. **重构不安全的脚本：** 取一个硬编码 API 密钥的脚本。将其更改为从环境变量读取密钥。如果变量未设置，脚本应带错误退出。\n\
    \n2. **加固脚本：** 给你一个以下脚本进行代码审查。识别并修复至少三个不同的安全漏洞。\n\n```bash\n#!/bin/bash\n# 此脚本压缩用户指定的文件夹\n\
    TARGET_DIR=$1\nOUTPUT_FILE=\"/tmp/backup.tar.gz\"\ntar -czf $OUTPUT_FILE $TARGET_DIR\n\
    echo \"Backup created at $OUTPUT_FILE\"\n```\n\n3. **安全处理流水线：** 编写一个脚本下载大文件，在安全的临时目录中解压，然后对其进行处理。脚本必须保证在任何情况下（成功、错误或中断）都会删除临时目录。\n\
    \n## 11. 网络脚本化——作为网络工程师的 shell\n\n## 引言：从本地主机到全球网络\n\n到此时，你的脚本已经精通本地机器。它们可以操作文件、控制进程并转换数据。现代系统的真正力量在于它们的互连性。服务器之间相互通信，通过网络端口提供功能，管理通常需要访问几十或数百台远程机器。\n\
    \n在本章中，我们将打破本地主机的限制，将你的 shell 变成一个功能全的网络工具。你将发现，你不需要复杂的编程语言就可以检查网络服务、安全地传输数据或在远程服务器上自动化重复任务。工具已经那里了，等待你来调用。\n\
    \n我们将超越简单的 ping，使用 netcat 直接与 TCP 和 UDP 端口通信。我们将使用 nmap 不是作为手动黑客工具，而是作为脚本化的清单和监控助手。最重要的是，我们将掌握\
    \ SSH 自动化艺术，以实现无密码、安全且可扩展的远程管理。\n\n## 本章学习目标：\n\n- 使用 netcat (nc) 和 nmap 积极且程序化地检查网络端口和服务。\n\
    - 使用 nmap 基础进行自动化网络发现和端口扫描。\n- 使用基于密钥的认证设置并安全地使用无密码 SSH 连接。\n- 使用 SSH 循环并行在许多服务器上自动化重复任务。\n\
    - 使用 scp 和 rsync 安全、自动地传输文件。\n- 理解并使用 SSH 隧道（端口转发）来保护不安全的服务。\n\n## 11.1 网络的脉动：使用\
    \ netcat 和 nmap 查询服务\n\n**netcat (nc)：TCP/IP瑞士军刀**\nnetcat 是一个简单但极其强大的工具，用于创建原始\
    \ TCP 或 UDP 连接。它非常适合测试服务是否在特定端口上监听。\n\n- -z: 零 I/O 模式。仅检查端口是否打开，不发送任何数据。\n- -v:\
    \ 详细模式。打印更多信息。\n- -w timeout：设置秒为单位的超时时间。\n\n示例：检查 Web 服务器和邮件服务器是否可达。\n\n```bash\n\
    #!/bin/bash\nHOST=\"example.com\"\nWEB_PORT=80\nMAIL_PORT=25\necho \"Checking\
    \ host: $HOST\"\n# -w 3 设置 3 秒超时超时\nif nc -z -v -w 3 \"$HOST\" \"$WEB_PORT\";\
    \ then\n  echo \"Web server on port $WEB_PORT is reachable.\"\nelse\n  echo \"\
    Web server on port $WEB_PORT is NOT reachable.\"\nfi\n```\n\n**nmap：用于脚本的网络扫描器**\n\
    虽然 nc 测试一个端口，但 nmap 能够扫描整个网络和数千个端口。对于脚本来说，“可 grep 的”输出模式 (-oG) 特别有用。\n\n示例：找到子网中所有开启了\
    \ SSH 端口 (22) 的主机。\n\n```bash\nSUBNET=\"192.168.1.0/24\"\n```\n\n```bash\n# -p\
    \ 22: 仅扫描端口 22\n# -oG -: 以 grep 可格式输出到标准输出\n# 文件名 '-' 意味着标准输出\nnmap -p 22 -oG\
    \ - \"$SUBNET\" | awk '/Host: .* /Status: Up/{print $2}'\n```\n\n此输出可以直接在循环中处理，例如在所有这些主机上执行命令。\n\
    \n## 11.2 使用 SSH 自动化：王国的钥匙\n\n反复输入密码是自动化的死敌。解决方案是基于密钥的认证。\n\n**第一步：创建密钥对（如果你还没有）**\
    \ `ssh-keygen -t ed25519` (或 rsa)。接受默认值。\n\n**第二步：将你的公钥拷贝到目标服务器** `ssh-copy-id\
    \ user@target-server` 此命令将你的公钥（`~/.ssh/id_ed25519.pub`）安全地追加到目标服务器上的 `~/.ssh/authorized_keys`\
    \ 文件。你只需最后输入一次密码。\n\n**第三步：无密码连接** 从现在开始，你可以通过 `ssh user@target-server` 连接而无需密码提示。\n\
    \n"
