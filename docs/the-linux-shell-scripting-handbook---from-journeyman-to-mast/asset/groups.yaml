    into small, robust programs.'
- md: "\n# EXERCISES\n\n- 1. **Refactoring:** Take one of your older, longer scripts.\
    \ Identify repeated blocks of code and extract them into one or more functions.\
    \ Ensure all variables inside the functions are `local`.\n\n- 2. **Library Creation:**\
    \ Create a `string_utils.sh` library with two functions: `to_lower()`, which converts\
    \ a string to lowercase, and `trim()`, which removes leading and trailing whitespace\
    \ from a string. Write a second script that sources this library and tests both\
    \ functions.\n\n- 3. **Array Processing:** Write a function `array_contains_element`\
    \ that takes two arguments: the name of an array (as a nameref) and a search string.\
    \ The function should return with an exit code of 0 (success) if the string is\
    \ contained in the array, and 1 (failure) if not.\n\n# 5. ROBUST ERROR HANDLING\
    \ AND DEBUGGING – WHEN THINGS GO WRONG\n\n# INTRODUCTION: FROM A CRASH TO A CONTROLLED\
    \ EMERGENCY LANDING\n\nAnyone can write a script that works when everything goes\
    \ right—the “happy path.” However, the true art of scripting reveals itself when\
    \ things go wrong: a file doesn't exist, a disk is full, a network service is\
    \ unreachable, or the user presses Ctrl+C.\n\nA beginner’s script that relies\
    \ on `set -e` will simply crash in such cases. It might leave behind temporary\
    \ files, an inconsistent state, or a half-written output file. It's like an airplane\
    \ that loses its engines and falls uncontrollably from the sky.\n\nA professional\
    \ script, in contrast, performs a controlled emergency landing. It detects the\
    \ failure, shuts down its systems, sends out a distress signal with precise coordinates,\
    \ and ensures the “passengers” (your data and your system) remain safe. In this\
    \ chapter, you will learn how to give your scripts exactly this capability. We\
    \ will go far beyond `set -e` and build a robust framework for error detection,\
    \ cleanup, logging, and deep debugging.\n\n# LEARNING OBJECTIVES FOR THIS CHAPTER:\n\
    \n- Implement reliable cleanup actions on script exit using trap EXIT.\n- Catch\
    \ errors the moment they happen with trap ERR to react immediately.\n- Generate\
    \ meaningful error messages with line numbers and function names.\n- Apply advanced\
    \ debugging techniques with trap DEBUG that are more powerful than a simple set\
    \ -x.\n- Develop effective logging strategies to direct your script’s output to\
    \ files or the system log (syslog).\n- Understand the importance of exit codes\
    \ and use them deliberately.\n\n# 5.1 THE LANGUAGE OF FAILURE: MASTERING EXIT\
    \ CODES\n\nEvery command returns an exit code upon completion, which is stored\
    \ in the $? variable.\n* 0: Success. Everything is okay.\n* 1-255: Failure. Something\
    \ went wrong.\n\nUsing set -e reacts to these codes, but as an advanced scripter,\
    \ you need to understand them and set them yourself.\n\n- Setting exit codes explicitly:\
    \ exit 1 (general error), exit 127 (command not found), etc.\n- Importance: Automation\
    \ tools like cron, systemd, or CI/CD pipelines rely on correct exit codes to decide\
    \ if a job was successful.\n\nPro Tip: There is a quasi-standard for exit codes\
    \ documented in /usr/include/sysexits.h. Using these codes (e.g., 64 for bad arguments,\
    \ 70 for an internal software error) makes your scripts more understandable to\
    \ other system administrators.\n\n# 5.2 THE SAFETY NET: CLEANING UP WITH TRAP\
    \ EXIT\n\nWhat happens to your script's temporary files when it aborts midway?\
    \ They are left behind as clutter. The trap command intercepts signals and executes\
    \ a command of your choice when they are received.\n\nThe most important trap\
    \ is trap ... EXIT. It is always executed when the script ends, regardless of\
    \ whether it was a successful completion, an error (set -e), or an external signal\
    \ like Ctrl+C (SIGINT).\n\n# The Classic Cleanup Pattern:\n\n```bash\n#!/bin/bash\n\
    set -e\n# Create a secure temporary file\n# -d creates a directory, which is often\
    \ better\ntemp_dir=$(mktemp -d)\n# Define the cleanup function\ncleanup() {\n\
    \  echo \"=> Performing cleanup...\"\n  # 'rm -rf is safe because $temp_dir is\
    \ absolute and came from mktemp\n  rm -rf \"$temp_dir\"\n  echo \"=> Temporary\
    \ directory '$temp_dir' removed.\"\n}\n# Register the function for the EXIT signal\n\
    trap cleanup EXIT\necho \"Temporary directory created: $temp_dir\"\necho \"Working\
    \ with files...\"\ntouch \"$temp_dir/file1.txt\"\nsleep 5 # Simulate work. Press\
    \ Ctrl+C here!\necho \"Work finished.\"\n# The script ends here, 'trap' is triggered\n\
    ```\n\nNo matter how you exit this script, the cleanup function will be executed\
    \ and the directory will be deleted.\n\n# 5.3 PROACTIVE ERROR DETECTION: TRAP\
    \ ERR\n\nWhile trap EXIT cleans up at the end, trap ERR reacts the moment a command\
    \ returns a non-zero exit code. This allows for much more detailed logging.\n\n\
    # The Error Logging Pattern:\n\n```bash\n#!/bin/bash\nset -o errexit Same as 'set\
    \ -e'\nset -o nounset Same as 'set -u'\n\n# Error handler function\nhandle_error()\
    \ {\n  local exit_code=$?\n  local line_number=$1\n  local command=$2\n  echo\
    \ \"ERROR in line $line_number: command '$command' failed with exit code $exit_code.\"\
    \ >&2\n}\n\n# Register the handler for the ERR signal\n# Pass the line number\
    \ and the command to the function\ntrap 'handle_error $LINENO \"$BASH_COMMAND\"\
    \ ERR\necho \"All good...\"\n\nls /non_existent_directory # This command will\
    \ fail\necho \"This line will never be reached.\"\n```\n\n# Output:\n\nAll good...\n\
    ls: cannot access '/non_existent_directory': No such file or directory\nERROR\
    \ in line 16: command 'ls /non_existent_directory' failed with exit code 2.\n\n\
    This gives you precise, immediate information about what went wrong and where.\n\
    \n# 5.4 ADVANCED DEBUGGING: BEYOND SET -X\n\nset -x is useful, but its output\
    \ can be cluttered. With trap DEBUG, you can build your own intelligent tracer.\
    \ The DEBUG trap is executed before every simple command.\n\n# A Smarter Trace\
    \ Mode:\n\n```bash\n#!/bin/bash\n\n# Function to be executed before each command\n\
    debug_trace() {\n  # Print function name, line number, and command\n  echo \"\
    [DEBUG] ${BASH_SOURCE[0]}:${BASH_LINENO[0]} -> ${BASH_COMMAND}\" >&2\n  \n  #\
    \ Check if an environment variable is set to enable debug mode\n  if [[ \"${SCRIPT_DEBUG:-}\"\
    \ == \"true\" ]]; then\n    trap debug_trace DEBUG\n  fi\n}\n\nmy_func() {\n \
    \ local name=\"World\"\n  echo \"Hello, $name\"\n}\necho \"Script starting.\"\n\
    my_func\necho \"Script ending.\"\n\nInvocation: ./script.sh -> Normal output SCRIPT_DEBUG=true\
    \ ./script.sh -> Detailed trace out for every command.\n```\n\n# 5.5 PROFESSIONAL\
    \ LOGGING STRATEGIES\n\nWhere should all the echo and error messages go?\n\n-\
    \ 1. Logging to a File with exec: To redirect the entire output of a script to\
    \ a file without modifying every echo command.\n\n```bash\n#!/bin/bash\nLOG_FILE=\"\
    /var/log/my_script.log\"\n# Redirect stdout and stderr to the log file\n# The\
    \ 'tee' command allows output to also go to the console\nexec > >(tee \"$LOG_FILE\"\
    ) 2>&1\necho \"This info message will go to the log.\"\nls /error # This error\
    \ message will also go to the log.\n```\n\n- 2. Logging to the System Log with\
    \ logger: The most professional way is to use the system logger (syslog).\n\n\
    ```bash\n#!/bin/bash\n# -t tag makes messages easy to filter\nlogger -t MyBackupScript\
    \ \"Backup started.\"\n# ...\nif ! tar -czf /backup/tar.gz /home; then\n# -p sets\
    \ the priority/facility (local0.error)\nlogger -t MyBackupScript -p local0.error\
    \ \"Backup failed!\"\nexit 1\nfi\nlogger -t MyBackupScript \"Backup completed\
    \ successfully.\"\n```\n\nThese messages can be viewed centrally with journalctl\
    \ -t MyBackupScript or in /var/log/syslog.\n\n# CHAPTER SUMMARY\n\nYou have learned\
    \ to equip your scripts with a robust error-handling framework. You no longer\
    \ rely blindly on set -e, but instead use trap to actively respond to your script's\
    \ termination (EXIT) or to errors as they occur (ERR). This allows you to safely\
    \ release resources and create detailed error logs. With trap DEBUG and the logger\
    \ command, you now have tools that go far beyond the basics, enabling you to build\
    \ professional, reliable, and maintainable automation solutions.\n\n# EXISES\n\
    \n- 1. **Safe Download Script:** Write a script that uses `wget` to download a\
    \ file.\n\nIt should create a temporary directory with `mktemp`. Use trap EXIT\
    \ to ensure this directory is always deleted, even if the download fails or the\
    \ user aborts the script.\n\n- 2. **Error Reporter:** Extend the script from exercise\
    \ 1. Implement a trap ERR handler that, in case of an error, prints a message\
    \ to `stderr` containing the line number and the error code.\n\n- 3. **Syslog\
    \ Integration:** Modify the script further so that it writes start, success, and\
    \ failure messages to the `syslog` using the `logger` command. Use a unique tag\
    \ (e.g., DownloadScript) to make the messages filterable.\n"
  mdcn: "\n\n# 练习\n\n- 1. **重构：** 选取你编写的一个较旧且较长的脚本。识别重复的代码块并将其提取到一个或多个函数中。确保函数内部的所有变量均为\
    \ `local`（局部）。\n\n- 2. **创建库：** 创建一个 `string_utils.sh` 库，其中包含两个函数：`to_lower()`（将字符串转换为小写）和\
    \ `trim()`（移除字符串首尾的空白）。编写第二个脚本来引入（source）该库并测试这两个函数。\n\n- 3. **数组处理：** 编写一个函数\
    \ `array_contains_element`，它接收两个参数：数组的名称（作为 nameref，即命名引用）和一个搜索字符串。如果字符串包含在数组中，该函数返回退出码\
    \ 0（成功），否则返回 1（失败）。\n\n# 5. 健壮的错误处理与调试 —— 当问题出现时\n\n# 引言：从崩溃到受控的紧急着陆\n\n任何人都能写出一个在一切顺利时运行的脚本——即所谓的“快乐路径”（happy\
    \ path）。然而，脚本编写真正的艺术会在问题出现时显现：文件不存在、磁盘已满、网络服务无法访问，或者用户按了 Ctrl+C。\n\n依赖 `set -e`\
    \ 的初学者脚本在这种情况下只会直接崩溃。它可能会留下临时文件、不一致的状态或写了一半的输出文件。这就像一架失去引擎并从空中不受控制地坠落的飞机。\n\n\
    相比之下，专业的脚本会执行受控的紧急着陆。它会检测到故障，关闭系统，发送带有精确坐标的求救信号，并确保“乘客”（你的数据和系统）保持安全。在本章中，你将学习如何赋予你的脚本恰恰这种。我们将远超\
    \ `set -e`，构建一个用于错误检测、清理、记录和深度调试的健壮框架。\n\n# 本章学习目标：\n\n- 使用 `trap EXIT` 在脚本退出时实现可靠的清理操作。\n\
    - 使用 `trap ERR` 在错误发生的瞬间捕获它们以便立即做出响应。\n- 生成带有行号和函数名的含义的错误信息。\n- 使用 `trap DEBUG`\
    \ 应用高级调试技术，这比简单的 `set -x` 更强大。\n- 开发有效的日志策略，将脚本的输出重定向到文件或系统日志（syslog）。\n- 理解退出码的重要性并有目的地地使用它们。\n\
    \n# 5.1 失败的语言：精通退出码\n\n每个命令在完成后都会返回一个退出码，存储在 `$?` 变量中。\n* 0: 成功。一切正常。\n* 1-255:\
    \ 失败。出了问题。\n\n使用 `set -e` 可以对这些代码做出反应，但作为高级脚本编写人员，你需要理解它们并自己设置它们。\n\n- 显式设置退出码：`exit\
    \ 1`（通用错误），`exit 127`（未找到命令）等。\n- 重要性：cron、systemd 或 CI/CD 流水线等自动化工具依赖正确的退出码来判断任务是否成功。\n\
    \n专业贴士：`/usr/include/sysexits.h` 中记录了退出码的准标准。使用这些代码（例如，64 表示参数错误，70 表示内部软件错误）将使你的脚本对其他系统管理员来说更易于理解。\n\
    \n# 5.2 安全网：使用 TRAP EXIT 进行清理\n\n当脚本中途中止时，它的临时文件会发生什么？它们会被留下来变成垃圾。`trap` 命令可以拦截信号并在接收到信号时执行你选择的命令。\n\
    \n最重要的 trap 是 `trap ... EXIT`。无论脚本是成功完成、由于错误（set -e）还是由于外部信号（如 Ctrl+C SIGINT），它总会在脚本结束时执行。\n\
    \n# 经典的清理模式：\n\n```bash\n#!/bin/bash\nset -e\n# 创建一个安全的临时文件\n# -d 创建目录，这通常更好\n\
    temp_dir=$(mktemp -d)\n# 定义清理函数\ncleanup() {\n  echo \"=> 正在执行清理...\"\n  # 'rm\
    \ -rf 是安全的，因为 $temp_dir 是绝对路径且来自 mktemp\n  rm -rf \"$temp_dir\"\n  echo \"=> 临时目录\
    \ '$temp_dir' 已删除。\"\n}\n# 为 EXIT 信号注册函数\ntrap cleanup EXIT\necho \"创建临时目录：$temp_dir\"\
    \necho \"正在处理文件...\"\ntouch \"$temp_dir/file1.txt\"\nsleep 5 # 模拟工作。在这里按 Ctrl+C！\n\
    echo \"工作完成。\"\n# 脚本在此结束，触发'trap'\n```\n\n无论你如何退出此脚本，清理函数都将被执行，目录将被删除。\n\n# 5.3\
    \ 主动错误检测：TRAP ERR\n\n虽然 `trap EXIT` 在最后进行清理，但 `trap ERR` 会在命令返回非零退出码的瞬间做出反应。这允许进行更详细的日志记录。\n\
    \n# 错误日志模式：\n\n```bash\n#!/bin/bash\nset -o errexit # 等于 'set -e'\nset -o nounset\
    \  # 等于 'set -u'\n\n# 错误处理函数\nhandle_error() {\n  local exit_code=$?\n  local\
    \ line_number=$1\n  local command=$2\n  echo \"行 $line_number 错误：命令 '$command'\
    \ 执行失败，退出码为 $exit_code。\" >&2\n}\n\n# 为 ERR 信号注册处理器\n# 将行号和命令传递给函数\ntrap 'handle_error\
    \ $LINENO \"$BASH_COMMAND\"' ERR\necho \"一切良好...\"\n\nls /non_existent_directory\
    \ # 这命令将失败\necho \"一切良好...\"\n```\n\n# 5.4 高级调试：BEYOND SET -X\n\n`set -x` 很有用，但它的输出可能很杂乱。通过\
    \ `trap DEBUG`，你可以构建自己的追踪器。\n\n# 智能追踪模式：\n\n```bash\n#!/bin/bash\n\n# 在执行每个命令前执行的函数\n\
    debug() {\n  echo \"[DEBUG] $LINENO: $BASH_COMMAND\"\n}\n\n# 检查环境变量是否设置以启用调试\n\
    if [[ \"${SCRIPT_DEBUG:-}\" == \"true\" ]]; then\n  trap debug DEBUG\nfi\n\nmy_func()\
    \ {\n  local name=\"World\"\n  echo \"Hello, $name\"\n}\n\n# \n\n# 5.5 专业日志策略\n\
    \n你的 echo 和错误消息应该去哪里？\n\n- 1. 使用 exec 日志到文件：将脚本的所有输出重定向到文件，无需修改每个 echo。\n\n```bash\n\
    #!/bin/bash\nLOG_FILE=\"/var/log/my_script.log\"\n# 将标准输出和标准错误重定向到文件\nexec > >(tee\
    \ \"$LOG_FILE\") 2>&1\n\necho \"这条信息将进入日志。\"\nls /error # 这条错误消息也将进入日志。\n```\n\
    \n- 2. 使用 logger 日志到系统日志：最专业的方法是使用系统日志（syslog）。\n\n```bash\n#!/bin/bash\n# -t\
    \ 标签使得消息容易过滤\nlogger -t BackupScript \"备份开始。\"\n# ...\nif ! tar -czf /backup/tar.gz\
    \ /home; then\n  # -p 设置优先级/设施（local0.error）\n  logger -t BackupScript -p local0.error\
    \ \"备份失败!\"\n  exit 1\nfi\nlogger -t BackupScript \"备份成功。\"\n```\n\n这些消息可以通过 `journalctl\
    \ -t BackupScript` 或 `/var/log/syslog` 查看。\n\n# 本章总结\n\n你学会了为你的脚本配备一个健壮的错误处理框架。你不再盲目依赖\
    \ `set -e`，而是使用 `trap` 主动响应脚本的终止（EXIT）或错误（ERR）。这允许你安全释放资源并创建的错误日志。通过 `trap DEBUG`\
    \ 和 `logger` 命令，你现在拥有了远超基础的工具，能够构建可靠且易维护的自动化解决方案。\n\n# 练习\n\n- 1. **安全下载脚本：**\
    \ 编写一个使用 `wget` 下载文件的脚本。\n\n它应该使用 `mktemp` 创建临时目录。使用 `trap EXIT` 确保即使下载失败或用户取消脚本，该目录也会被删除。\n\
    \n- 2. **错误报告：** 扩展练习 1 中的脚本。实现一个 `trap ERR` 处理器，在发生错误时，向标准错误输出（stderr）打印一条包含行号和错误码的消息。\n\
    \n- 3. **系统日志集成：** 进一步修改脚本，使其使用 `logger` 命令将开始、成功和失败消息写入系统日志（syslog）。使用唯一的标签（例如\
    \ DownloadScript）使消息可过滤。\n\n"
