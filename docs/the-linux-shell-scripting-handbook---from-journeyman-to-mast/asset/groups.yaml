- md: "\n# CHAPTER SUMMARY\n\nYou have made the leap from being a pure Bash scripter\
    \ to a language-aware developer. You now understand that #!/bin/sh is a promise—the\
    \ promise of portability. You identify the most common Bash-specific extensions\
    \ and replace them with their universal POSIX equivalents. With shellcheck, you\
    \ have a powerful tool at your disposal to ensure the quality and portability\
    \ of your code. Most importantly, you have adopted a new mindset: you no longer\
    \ just ask “Does it work?” but “Where does it need to work, and how do I ensure\
    \ that?”\n\n# EXERCISES\n\n1. **Refactoring**: Take one of your older Bash scripts.\
    \ Change its shebang to #!/bin/sh and use shellcheck -s sh to find all portability\
    \ issues. Then, fix them.\n\n2. **Debugging**: The following script is supposed\
    \ to count the number of .log files in a directory. It works under Bash but fails\
    \ with sh script.sh. Figure out why and fix it in a portable way.\n\n1. **Tooling**:\
    \ Install shellcheck on your system. Integrate it into your editor (e.g., via\
    \ a plugin for VS Code, Vim, etc.) to get instant feedback as you write.\n\n#\
    \ 3. ADVANCED PARAMETER EXPANSION AND QUOTING – THE SHELL’S SWISS ARMY KNIFE\n\
    \n# INTRODUCTION: OPERATING IN THE HEART OF THE SHELL\n\nUntil now, you've likely\
    \ treated variables as simple storage containers: you put a value in VAR=\"value\"\
    \ and get it back out (echo $VAR). When you needed to manipulate that value—for\
    \ instance, to separate a filename from its path or replace spaces with underscores—you\
    \ probably reached for external tools like cut, basename, or sed. But it's like\
    \ calling a crane to hammer a nail into a wall. Every call to an external command\
    \ creates a new process, which is slow and resource-intensive.\n\nHowever, the\
    \ shell itself provides an incredibly powerful, built-in set of tools for string\
    \ manipulation: parameter expansion. This allows you to operate directly on the\
    \ contents of variables without ever leaving the shell. You can remove parts of\
    \ strings, replace patterns, set default values, and even change a string's case.\n\
    \nIn this chapter, you will learn to master this “Swiss Army knife.” In parallel,\
    \ we will deepen your understanding of quoting, because only the combination of\
    \ powerful expansion and correct quoting can protect you from the most insidious\
    \ bugs in shell programming: unwanted word splitting and pathname expansion.\n\
    \n# LEARNING OBJECTIVES FOR THIS CHAPTER:\n\n- Efficiently remove parts of strings\
    \ (prefixes, suffixes) without using cut or sed.\n- Replace patterns within strings.\n\
    - Write robust scripts that work with default values if variables are not set.\n\
    - Understand and apply the power of indirect expansion (${!var}).\n- Internalize\
    \ the fundamental differences between ''' (single quotes), '\"' (double quotes),\
    \ and $$$ (ANSI-C quoting).\n- Understand and apply the \"Golden Rule of Quoting\"\
    \ to finally eliminate bugs caused by spaces in filenames.\n\n# 3.1 SUBSTRING\
    \ REMOVAL: THE SCALPEL FOR STRINGS\n\nThis is the most common use case. You have\
    \ a string and want to slice off a portion from the beginning or the end.\n\n\
    Remove Prefix (from the beginning of the string)\n- ${variable#pattern}: Removes\
    \ the shortest possible matching pattern from the beginning. (non-greedy)\n- ${variable##pattern}:\
    \ Removes the longest possible matching pattern from the beginning. (greedy)\n\
    \nExample: Dissecting a file path\n```bash\nfilepath=/var/apache2/access.log\n\
    # Shortest pattern: everything up to the first /\necho \"${filepath#**/}\"\n ->\
    \ /var/apache2/access.log\n# Longest pattern: everything up to the last / (extracts\
    \ the filename)\necho \"${filepath##*}\"\n -> access.log (equivalent to 'basename\
    \ \"$filepath\")\n```\n\nRemove Suffix (from the end of the string)\n- ${variable%pattern}:\
    \ Removes the shortest possible matching pattern from the end. (non-greedy)\n\
    - ${variable%%pattern}: Removes the longest possible matching pattern from the\
    \ end. (greedy)\n\nExample: Removing a file extension\n```bash\nfilename=backup_2023-10-27.tar.gz\n\
    # Shortest pattern: everything from the last .\necho \"${filename%..*}\"\n ->\
    \ backup_2023-10-27.tar\n# Longest pattern: everything from the first .\necho\
    \ \"${filename%%.*}\"\n -> backup_2023-10-27\n```\n\n# 3.2 SEARCH AND REPLACE:\
    \ SED FOR IN-HOUSE USE\n\n- ${variable/pattern/string}: Replaces the first occurrence\
    \ of pattern with string.\n- ${variable//pattern/string}: Replaces all occurrences\
    \ of pattern with string.\n- ${variable/#pattern/string}: Replaces pattern only\
    \ if it's at the beginning.\n- ${variable/%%pattern/string}: Replaces pattern\
    \ only if it's at the end.\n\nExample: Sanitizing filenames\n\n```bash\nugly_name=\"\
    My Report (final).txt\"\n# Replace all spaces with underscores\nclean_name=\"\
    ${ugly_name// /}\"\necho \"$clean_name\"\n# -> _My_Report__(final).txt\n# That's\
    \ not perfect yet. Let's combine!\n# Step 1: Replace all spaces with underscores.\n\
    # Step 2: Remove parentheses.\ntemp_name=\"${ugly_name// /}\"\nfinal_name=\"${temp_name//[()]}\"\
    \ # Replaces ( ) with nothing\necho \"$final_name\"\n# -> _My_Report__final.txt\n\
    ```\n\n# 3.3 Robust Scripts Through Default Values and Error Checking\n\nThese\
    \ expansions are critical for reacting to unset or empty variables.\n\n- ${variable:-default}:\
    \ If variable is unset or empty, use default. The variable itself is not changed.\n\
    - ${variable:=default}: If variable is unset or empty, use default and assign\
    \ that value back to variable.\n- ${variable?error_message}: If variable is unset\
    \ or empty, print error_message and exit the script (works best with set -u).\n\
    \nExample: Handling optional parameters\n\n```bash\n#!/bin/bash\nset -u # Exit\
    \ on unset variables\n# The first command-line arg is the input; the second is\
    \ an optional output\ninput_file=\"$1\"\n# If $2 is not set, derive it from the\
    \ input, but don't assign back to $2.\noutput_file=\"${2:-${input_file%.*}.out}\"\
    \n# Check if the input was provided. If not, the script aborts\n: \"${input_file?Error:\
    \ No input file was provided.}\"\necho \"Input: $input_file\"\necho \"Output:\
    \ $output_file\"\n```\n\n# 3.4 THE MASTER CLASS: INDIRECT EXPANSION AND MORE\n\
    \n**Indirect Expansion**: ${!prefix*} or ${!prefix@} This is one of the most powerful\
    \ but also most confusing techniques. It allows you to get the name of a variable\
    \ dynamically from another variable.\n\n```bash\nvar_name=\"USER\"\necho \"The\
    \ value of the variable whose name is in 'var_name': ${!var_name}\"\n# The value\
    \ of the variable whose name is in 'var_name': [your username]\n```\n\n**Case\
    \ Modification (Bash 4+):**\n\n- ${variable?}: First letter to uppercase.\n- ${variable,}:\
    \ First letter to lowercase.\n- ${variable^^}: All to uppercase.\n- ${variable,,}:\
    \ All to lowercase.\n\n# 3.5 QUOTING – THE SAFETY NET THAT MUST ALWAYS BE UP\n\
    \nYou've now seen how to manipulate strings. The next step is to use them safely.\
    \ The biggest problem in the shell is uncontrolled Word Splitting and Pathname\
    \ Expansion (Globbing).\n\n# The Problem:\n\n```bash\nfilename=\"My Report.txt\"\
    \ntouch \"$filename\"\nls -l \"$filename\" # ERROR! Is tries to find \"My\", \"\
    Important\", and \"Report.txt\".\n```\n\n# The Solution: Double Quotes! -l \"\
    $filename\" # CORRECT! Is receives the string as ONE argument.\n\n# The Three\
    \ Types of Quotes:\n\n1. (Single Quotes): Absolutely Literal. No expansion of\
    \ kind occurs. $USER remains $USER. Ideal for literal text. echo 'The current\
    \ user is: $USER' -> The current user is: $USER\n\n2. (Double Quotes): The Standard\
    \ Case. Allows Parameter ($VAR), Command ($command), and Arithmetic ($((...)))\
    \ expansion, but prevents word splitting and globbing. This is your most important\
    \ tool! echo \"The current user is: $USER\" -> The current user is: [your username]\n\
    \n3. (ANSI-C Quoting): For Special Characters. Allows the interpretation of backslash\
    \ escape sequences like \\n (newline), \\t (tab), or \\41 (hex code). printf '$Line\
    \ 1\\n\\tintented Line 2\\n'\n\nThe Golden Rule of Quoting: Always quote your\
    \ variable expansions (\"$var\") unless you know exactly why you need word splitting\
    \ or globbing to occur.\n\n# CHAPTER SUMMARY\n\nYou have unlocked the shell’s\
    \ built-in string manipulation capabilities. Instead of launching an external\
    \ process for every small text-editing task, you can now operate directly and\
    \ efficiently within your script. You can remove substrings, replace patterns,\
    \ and make your scripts more robust with default values and checks. More importantly,\
    \ you have the the “why” behind quoting. The consistent use of double quotes around\
    \ your variables is the single most important characteristic that distinguishes\
    \ a fragile script from a professional, robust tool.\n"
  mdcn: "\n\n# 章节总结\n\n你已经从一个纯粹的 Bash 脚本编写者跃变为感知语言的开发者。你现在理解 `#!/bin/sh` 是一个承诺——关于可移植性的承诺。你识别出了最常见的\
    \ Bash 特定扩展，并用通用的 POSIX 等效方案替换了它们。通过 `shellcheck`，你拥有了一个强大的工具来确保代码的质量和可移植性。最重要的是，你采用了一种全新的思维：你不再仅仅问“它能运行吗？”，而是问“它需要在哪里运行，我该如何确保这一点？”\n\
    \n# 练习题\n\n1. **重构**：选取你以前较早的一个 Bash 脚本。将它的 shebang 改为 `#!/bin/sh` 并使用 `shellcheck\
    \ -s sh` 找到所有可移植性问题。然后修复它们。\n\n2. **调试**：以下脚本旨在统计目录中 `.log` 文件的数量。它在 Bash 下运行正常，但在使用\
    \ `sh script.sh` 时会失败。找出原因并用可移植的方式修复它。\n\n1. **工具使用**：在你的系统上安装 `shellcheck`。将其集成到你的编辑器中（例如通过\
    \ VS Code 或 Vim 的插件），以便在编写代码时获得即时反馈。\n\n# 3. 高级参数扩展与引用 – Shell 的瑞士军刀\n\n# 引言：在\
    \ Shell 的核心区域进行操作\n\n到目前为止，你可能将变量视为简单的存储容器：你将一个值存入 `VAR=\"value\"` 然后将其取出（`echo\
    \ $VAR`）。当你需要处理该值时——例如，将文件名从路径中分离，或将空格替换为下划线——你可能会求助于 `cut`、`basename` 或 `sed`\
    \ 等外部工具。但这就像是用起重机来向墙上钉一颗钉子。每次调用外部命令都会创建一个新进程，这既慢又耗资源。\n\n然而，Shell 本身提供了一套极其强大的内置工具集用于字符串操纵：参数扩展。这允许你直接对变量的内容进行操作，而无需离开\
    \ Shell。你可以移除字符串的片段、替换模式、设置默认值，甚至更改字符串的大小写。\n\n在本章中，你将学习并掌握这把“瑞士军刀”。与此同时，我们将深化你对引用的理解，因为只有强大的扩展和正确的引用相结合，才能保护你免受\
    \ Shell 编程中最隐蔽的 Bug：意外的单词拆分和路径扩展。\n\n# 本章学习目标：\n\n- 高效移除字符串片段（前缀、后缀）而不使用 `cut`\
    \ 或 `sed`。\n- 替换字符串内部的模式。\n- 编写健壮的脚本，在变量未设置时使用默认值。\n- 理解并应用间接扩展（`${!var}`）的力量。\n\
    - 彻底掌握单引号（`''`）、双双引号（`\"\"`）和 ANSI-C 引用（`$'''`）之间的根本区别。\n- 理解并应用“引用黄金法则”，最终彻底消除由文件名中的空格引起的\
    \ Bug。\n\n# 3.1 子字符串删除：字符串的手术刀\n\n这是最常用的用例。你有一个字符串，并想从开头或结尾切掉一部分。\n\n删除前缀（从字符串开头开始）\n\
    - `${variable#pattern}`：从开头删除最短的匹配模式。（非贪婪）\n- `${variable##pattern}`：从开头删除最长的匹配模式。（贪婪）\n\
    \n示例：解剖文件路径\n```bash\nfilepath=/var/apache2/access.log\n# 最短模式：直到第一个 / 之前的所有内容\n\
    echo \"${filepath#**/}\"\n -> /var/apache2/access.log\n# 最长模式：直到最后一个 / 之前的内容（提取文件名）\n\
    echo \"${filepath##*}\"\n -> access.log (等同于 'basename \"$filepath\"')\n```\n\n\
    删除后缀（从字符串结尾开始）\n- `${variable%pattern}`：从结尾删除最短的匹配模式。（非贪婪）\n- `${variable%%pattern}`：从结尾删除最长的匹配模式。（贪婪）\n\
    \n示例：移除文件扩展名\n```bash\nfilename=backup_2023-10-27.tar.gz\n# 最短模式：从最后一个 . 开始的所有内容\n\
    echo \"${filename%..*}\"\n -> backup_2023-10-27.tar\n# 最长模式：从第一个 . 开始的所有内容\necho\
    \ \"${filename%%.*}\"\n -> backup_2023-10-27\n```\n\n# 3.2 搜索与替换：内部使用的 sed\n\n\
    - `${variable/pattern/string}`：将模式第一次出现的地方替换为字符串。\n- `${variable//pattern/string}`：将模式的所有出现的地方替换为字符串。\n\
    - `${variable/#pattern/string}`：仅当模式位于开头时进行替换。\n- `${variable/%%pattern/string}`：仅当模式位于结尾时进行替换。\n\
    \n示例：清理文件名\n\n```bash\nugly_name=\"My Report (final).txt\"\n# 将所有空格替换为下划线\nclean_name=\"\
    ${ugly_name// /}\"\necho \"$clean_name\"\n# -> _My_Report__(final).txt\n# 还不完美。让我们结合一下！\n\
    # 步骤 1：将所有空格替换为下划线。\n# 步骤 2：移除括号。\ntemp_name=\"${ugly_name// /}\"\nfinal_name=\"\
    ${temp_name//[()]}\" # 将 ( )替换为空\necho \"$final_name\"\n# -> _My_Report__final.txt\n\
    ```\n\n# 3.3 通过默认值和错误检查编写健壮脚本\n\n这些扩展对于响应未设置或空的变量至关重要。\n\n- `${variable:-default}`：如果变量未设置或为空，使用默认值。变量本身不会改变。\n\
    - `${variable:=default}`：如果变量未设置或为空，使用默认值并将该值赋回变量。\n- `${variable?error_message}`：如果变量未设置或为空，打印错误信息并退出脚本（配合\
    \ `set -u` 效果最佳）。\n\n示例：处理可选参数\n\n```bash\n#!/bin/bash\nset -u # 遇到未设置的变量退出\n\
    # 第一个命令行参数是输入；第二个是可选输出\ninput_file=\"$1\"\n# 如果 $2 未设置，则从输入推导出，但不要赋值回 $2。\noutput_file=\"\
    ${2:-${input_file%.*}.out}\"\n# 检查是否提供了输入。如果没有，脚本将中止\n: \"${input_file?Error:\
    \ No input file was provided.}\"\necho \"Input: $input_file\"\necho \"Output:\
    \ $output_file\"\n```\n\n# 3.4 大师课：间接扩展及进阶内容\n\n**间接扩展**：`${!prefix*}` 或 `${!prefix@}`。这是最强大但也最令人困惑的技术之一。它允许你通过另一个变量获取变量的值。\n\
    \n```bash\nvar_name=\"USER\"\necho \"The value of the variable whose name is 'var_name':\
    \ ${!var_name}\"\n# The value of the variable whose name is 'var_name': root\n\
    ```\n\n**大小写修改（Bash 4+）：**\n\n- `${variable?}`：首字母转大写。\n- `${variable,}`：首字母转小写。\n\
    - `${variable^^}`：全部转大写。\n- `${variable,,}`：全部转小写。\n\n# 3.5 引用——必须始终的安全网\n\n你现在已经学会了操纵字符串。下一步是安全地使用它们。Shell\
    \ 中最大的问题是不受控制的单词拆分（Word Splitting）和路径扩展（Globbing）。\n\n# 问题：\n\n```bash\nfilename=\"\
    My Report.txt\"\ntouch \"$filename\"\nls -l \"$filename\" # 错误！它尝试寻找 \"My\", \"\
    Report.txt\"\n```\n\n# 解决方案：使用双引号！\nls -l \"$filename\" # 正确！ls 接收到一个参数。\n\n#\
    \ 三种类型的引号：\n\n1. 单引号（`''`）：绝对字面量。不会发生任何扩展。$USER 保持原样 $USER。适用于字面文本。echo 'The current\
    \ user is: $USER' -> The current user is: $USER\n\n2. 双引号（`\"\"`）：标准情况。允许参数 ($VAR)、命令\
    \ ($command) 和算术 ($((...))) 扩展，但可以防止单词拆分和路径扩展。这是你最重要的工具！echo \"The current user\
    \ is: $USER\" -> The current user is: [username]\n\n3. ANSI-C 引用（`$'''`）：用于特殊字符。允许解释反斜杠转义序列，如\
    \ \\n（换行）、\\t（制表符）或 \\41（十六进制码）。printf '$Line 1\\n\\tintented Line 2\\n'\n\n#\
    \ 引用的黄金法则：始终引用变量扩展（\"$var\"），除非你明确知道为什么需要单词拆分或路径扩展。\n\n"
