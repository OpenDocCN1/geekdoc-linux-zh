    ```\n\n### Download a file from a server\n\n```\nscp user@server:/remote/path/file.txt\
    \ /local/path/\n```\n\n- rsync: More powerful and intelligent than scp. rsync\
    \ only transfers the changed parts of files, can recursively synchronize directories,\
    \ and much more. It is the preferred method for backups and deployments.\n\n###\
    \ Synchronize a local directory with a remote one\n\n- -a: archive mode (recursive,\
