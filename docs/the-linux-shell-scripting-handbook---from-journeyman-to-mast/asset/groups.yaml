    \ script is always executed\nENTRYPOINT [\"entrypoint.sh\"]\n```\n\n# The CMD\
    \ command is passed as arguments ($@) to the entrypoint script\nCMD [\"/app/my_application\"\
    , \"--config\", \"/etc/app.conf\"]\n\n# CHAPTER SUMMARY\n\nYou have seen that\
