  mdcn: "\n\n# 章节总结\n\n你已经完成了从简单脚本到全功能专业命令行工具的最后跨越。现在，你可以使用 `getopts` 为你的用户创建健壮且灵活的界面，使其行为与标准的\
    \ Unix 命令保持一致。你可以将项目清晰地结构化为可执行文件、库和文档的独立目录。通过编写 man 页面（帮助文档）的能力，你确保了你的工具是“一等公民”，拥有完善的文档并能无缝集成到系统环境中。你的作品不再感觉像是异物，而是操作系统的原生部分。\n\
    \n# 练习题\n\n- 1. **使用 getopts 进行重构**：选取你以前的一个接受多个参数的旧脚本。重构它以使用 `getopts` 处理如 `-i\
    \ <input>`、`-o <output>` 和 `-f`（强制）等选项。添加一个 `--help` 函数。\n- 2. **编写 man 页面**：为练习\
    \ 1 中重构的脚本编写完整的 man 页面。包含 NAME（名称）、SYNOPSIS（摘要）、DESCRIPTION（描述）、OPTIONS（选项）和 EXAMPLES（示例）部分。\n\
    - 3. **构建结构化工具**：创建一个具有 `bin/`、`lib/`、`man/` 结构的新工具。该工具应执行一个小任务（例如，统计文本文件的单词数）。计数逻辑应位于\
    \ `lib/` 库中的一个函数。`bin/` 中的主脚本应仅处理参数解析和调用库函数。\n\n# 14. 与广泛生态系统的集成——作为自动化引擎的 Shell\n\
    \n# 引言：从工具到自动化工厂\n\n到为止，你一直将脚本视为手动调用完成特定任务的工具。你是那个拿着锤子的工匠。然而，在现代软件开发和系统管理中，最重要的流程不再由手动启动。它们由事件触发自动运行：git\
    \ push、新的拉取请求（pull request）或部署应用程序新版本的需求。\n\n在本章中，我们将你的工具转换为自动化工厂的引擎。我们将看到你的 Shell\
    \ 脚本如何焕发生机并成为现代 DevOps 工作流三大支柱中不可或缺的一部分：1. 本地开发（Git Hooks）：在开发者机器上直接进行自动化，以在代码离开系统之前确保质量。2.\
    \ 持续集成/持续部署（CI/CD）：团队自动化的核心，代码在此处自动构建、测试和交付。3. 容器化（Docker）：在标准、可迁移环境中对应用程序进行打包和交付。\n\
    \n你会发现，Shell 在这里不仅是“锦上添花”，更是驱动所有这些系统的通用胶水和执行力量。为这些生态系统编写健壮脚本的能力，是现代管理员和开发者最青睐的技能之一。\n\
    \n# 本章学习目标：\n\n- 创建 Git Hooks 以在本地自动强制执行代码质量。\n- 理解并实现 Shell 脚本在 CI/CD 流线（例如 GitHub\
    \ Actions）中的作用。\n- 学习在 Dockerfile 中编写 `ENTRYPOINT` 和 `CMD` 脚本的最佳实践。\n- 理解 Dockerfile\
    \ 中“shell 形式”（shell form）和“exec形式”（exec form）的区别及其对信号处理的影响。\n\n# 14.1 本地守护者：使用\
    \ Git Hooks 进行质量保证\n\nGit Hooks 是 Git 在发生特定事件时（例如在 commit 之前或 push 之前）自动执行的脚本。它们存在于每个仓库的\
    \ `.git/hooks/` 目录下。\n\n**pre-commit 钩子：提交前的最后检查** 这是最流行的钩子。它在创建 commit 之前运行。如果脚本以非零退出码退出，commit\
    \ 将被中止。它是运行 `shellcheck` 等检查工具的完美位置。\n\n示例：一个使用 `shellcheck` 检查所有修改过的 Shell 脚本的\
    \ pre-commit 钩子。\n\n**创建 .git/hooks/pre-commit 文件并赋予执行权限：**\n\n```bash\n#!/bin/bash\n\
    set -eo pipefail\necho \"Running pre-commit...\"\n# 找到所有已暂用于 commit 的 .sh 文件\n\
    STAGED_SH_FILES=$(git diff --cached --name-only --filter=ACMR | grep '\\.sh$')\n\
    if [ -z \"$STAGED_SH_FILES\" ]; then\n  echo \"No shell scripts to check.\"\n\
    \  exit 0\nfi\necho \"Checking the following shell scripts with shellcheck:\"\n\
    echo \"$STAGED_SH_FILES\"\n# 对每个文件运行 shellcheck。如果其中失败，脚本将由于 'set -e' 退出。\necho\
    \ \"$STAGED_SH_FILES\" | xargs -n 1 shellcheck\necho \"All shell scripts are clean.\
    \ Proceeding with commit.\"\nexit 0\n```\n\n在仓库中有这个钩子后，任何团队成员都不会再意外提交有错误的 Shell\
    \ 脚本。\n\n# 14.2 组配线：CI/CD 流线中的 Shell 脚本\n\nGitHub Actions、GitLab CI 或 Jenkins\
    \ 等 CI/CD 平台本质上是 Shell 脚本的高级执行环境。它们的 YAML 配置描述了应该运行*哪些*命令、*何时*以及在何种环境中运行。\n\n\
    以 GitHub Actions 为例：流定义在 `.github/workflows/` 下的 *yml* 文件。\n\n示例：一个每次 push 都运行检查器和测试的简单\
    \ CI 流线。文件：.github/workflows/ci.yml\n\n```yaml\nname: Linux Shell CI\non: [push,\
    \ pull_request]\n```\n\n```yaml\njobs:\n  build-and-test:\n    runs-on: ubuntu-latest\n\
    \    steps:\n      - name: Check out code\n        uses: actions/checkout@v3\n\
    \      - name: Run ShellCheck Linter\n        run: |\n          echo \"Checking\
    \ all shell scripts in the repository...\"\n          # 找到所有 .sh 文件并对它们运行 shellcheck\n\
    \          find . -type f -name \"*.sh\" -print0 | xargs -0 shellcheck\n     \
    \ - name: Run Tests\n        run: |\n          echo \"Running the test suite...\"\
    \n          # 在这里你调用你的测试框架\n          # 对于我们的示例，我们只调用一个测试脚本\n          ./tests/run_tests.sh\n\
    ```\n\n每个 `run:` 块本质上都是一个小的嵌入式 Shell 脚本。复杂的逻辑应该分离到单独的文件中以保持 YAML 文件的整洁。\n\n# 14.3\
    \ 打包：Docker 容器中的 Shell 脚本\n\nDocker 是部署应用程序的事实标准。Shell 脚本在这里起着至关重要的作用。\n\n| 指令\
    \ | 描述 |\n| :--- | :--- |\n| **RUN** | 构建镜像期间执行命令。用于安装软件包和设置环境。 |\n| **ENTRYPOINT**\
    \ | 定义容器启动时*始终*执行的主命令。 |\n| **CMD** | 在启动容器（docker run ...）时为用户提供默认参数。 |\n\n**“exec\
    \ 形式”与“shell 形式”——关键区别**\n\n- **Shell 形式**：`CMD my_program -arg` Docker 启动一个 shell\
    \ (/bin/sh -c)，然后启动你的程序。你的程序不会作为 PID 1 运行，且信号（如 docker stop）无法被正确传递。**这几乎总是错误的选择。**\n\
    - **Exec 形式**：`CMD [\"my_program\", \"-arg\"]` Docker 直接启动你的程序。它作为 PID 1 运行并正确接收信号。**这是首选方法。**\n\
    \nENTRYPOINT 脚本模式。`entrypoint.sh` 脚本是在主应用程序启动之前配置容器的常见做法。\n\n示例：一个等待数据库的 entrypoint.sh\
    \ 脚本。\n\n```bash\n#!/bin/bash\nset -e\n# 等待数据库就绪\nuntil nc -z -w30 \"$DB_HOST\"\
    \ \"$DB_PORT\"; do\n  echo \"Waiting for database\"\n  sleep 1\ndone\necho \"\
    Database is ready. Starting application\"\n```\n\n# exec \"$@\": 用作为参数传递的命令替换\
    \ shell 进程\n# （来自 Dockerfile 的 CMD）。 \n# 这对于正确处理信号至关重要\n```bash\nexec \"$@\"\n\
    ```\n\n# 对应的 Dockerfile:\n\n```dockerfile\nFROM ubuntu:22.04\n# ... 安装 netcat\
    \ 等\nCOPY entrypoint.sh /usr/local/bin/\nRUN chmod +x /usr/local/bin/entrypoint.sh\n\
    # entrypoint 脚本始终执行\nENTRYPOINT [\"entrypoint.sh\"]\n```\n\n# CMD 命令作为参数 ($@)\
    \ 传递给 entrypoint 脚本\nCMD [\"/app/my_application\", \"--config\", \"/etc/app.conf\"\
    ]\n\n# 章节总结\n\n你已经看到你的 Shell 脚本技能处于现代软件开发周期的中心。你现在可以通过 Git Hooks 将自动质量检查直接集成到开发过程中。你理解了\
    \ CI/CD 流线如何编排 Shell 命令来构建和测试代码。你知道如何使用健壮的 ENTRYPOINT 脚本配置 Docker 容器，以确保干净初始化和正确的进程管理。你的脚本不再是孤立的工具；它们是现代\
    \ IT 自动化引擎中不可或缺的齿轮。\n\n"
