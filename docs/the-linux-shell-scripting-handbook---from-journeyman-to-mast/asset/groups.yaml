- md: "\n## EXERCISES\n\n- 1. **Backup Script**: Write a script that takes a filename\
    \ as an argument (e.g., data.csv). The script should create a “backup” copy of\
    \ this file named data.csv.YYYY-MM-DD.bak, where YYYY-MM-DD is the current date.\
    \ Use parameter expansion to manipulate the base name and extension, and the date\
    \ command for the date.\n\n- 2. **Variable Checker**: Create a script that checks\
    \ if the environment variables EDITOR and PAGER are set. If EDITOR is not set,\
    \ it should be set to /usr/bin/vim. If PAGER is not set, it should be set to /usr/bin/less.\
    \ At the end, print the active values for both. (Hint: ${var:=default} is perfect\
    \ here).\n\n- 3. **Name Normalizer**: Write a script that takes a list of filenames\
    \ with spaces and renames them by replacing all spaces with underscores (_) and\
    \ converting all letters to lowercase. Your script must handle any filename safely.\
    \ (Example: \"My Report Part 2.DOC\" becomes my_report_part_2.doc).\n\n## 4. FUNCTIONS,\
    \ LIBRARIES, AND SCOPE – THE PATH TO MODULAR CODE\n\n### INTRODUCTION: FROM MONOLITHIC\
    \ SCRIPTS TO REUSABLE TOOLS\n\nImagine you're building a complex piece of furniture.\
    \ Every time you need a screw, you would melt steel, cast it into shape, and cut\
    \ the threads? Of course not. You would reach into your toolbox and grab a ready-made\
    \ screw. The principle is the same in programming: **Don’t Repeat Yourself (DRY).**\n\
    \nSo far, your scripts may have been long, linear sequences of commands. If you\
    \ needed to repeat a similar task elsewhere, you probably copied and pasted the\
    \ code. This leads to bloated, error-prone, and hard-to-maintain scripts. A change\
    \ in one place has to be hunted down and replicated in many others.\n\nIn this\
    \ chapter, you will learn the art of breaking down your code down into logical,\
    \ reusable units: **functions**. We will explore how to design these functions\
    \ cleanly, organize them into **libraries**—most importantly—control the **scope**\
    \ of variables to avoid unintentional and catastrophic side effects. This is the\
    \ transition from writing scripts to developing software.\n\n### LEARNING OBJECTIVES\
    \ FOR THIS CHAPTER:\n\n- Design professional, reusable functions with clear inputs\
    \ and outputs.\n- Understand the critical difference between local and global\
    \ variables and establish local as your default.\n- Master the difference between\
    \ return values (return) for status and stdout for data.\n- Create your own script\
    \ libraries and include them in other scripts using source.\n- Safely pass complex\
    \ data like arrays to functions without destroying them.\n- Develop a standard\
    \ for documenting your functions.\n\n## 4.1 THE ANATOMY OF A PROFESSIONAL FUNCTION\n\
    \nA function is more than just a grouped block of code. It's a contract. It has\
    \ a defined task, defined inputs, and defined outputs.\n\n**Input: Processing\
    \ Arguments** Arguments are accessed inside a function via $1, $2, etc., just\
    \ like in a script. It is good practice to immediately assign them to descriptive\
    \ local variables.\n\n```bash\n# Function to greet a user\ngreet_user() {\n# Assign\
    \ the first argument to a local variable\nlocal user_name=\"$1\"\nif [[ -z \"\
    $user_name\" ]]; then\n  echo \"Error: No username provided.\" >&2\n  return 1\
    \ # Status: Failure\nfi\necho \"Hello, ${user_name}!\"\nreturn 0 # Status: Success\n\
    }\n```\n\n**Output: The Fundamental Difference Between Status and Data**\n\n-\
    \ **Return Value (return):** For Status Only! The return command sets the function's\
    \ exit code (a number from 0-255). Its sole purpose is to signal success (0) or\
    \ failure (anything else). It should **never** be used to return data.\n`greet_user\
    \ \"Alice\"; echo $? -> 0`\n\n- **Standard Output (stdout):** For Returning Data!\
    \ If a function needs to return a result (a string, a number, etc.), it writes\
    \ that result to standard output (stdout). The caller can capture this result\
    \ using command substitution ($()).\n\n```bash\nget_current_date() {\n    date\
    \ --iso-8601\n}\n# Capture the function's data in a variable\ntoday=$(get_current_date)\n\
    echo \"Today's date is: $today\"\n```\n\n**Standard Error (stderr): For Error\
    \ and Debug Messages.** As shown in the greet_user example, error messages should\
    \ always be redirected to stderr (>&2) so they are not accidentally captured as\
    \ “data” by the caller.\n\n## 4.2 SCOPE: THE MOST IMPORTANT RULE FOR STABLE FUNCTIONS\n\
    \nScope defines where a variable is visible and valid. In Bash, there are only\
    \ two scopes: global and local (within a function).\n\n**The Danger of Global\
    \ Variables (The Default Behavior)** By default, every variable you declare is\
    \ global. This means it is visible and modifiable everywhere in the script—including\
    \ inside functions.\n\n**The Catastrophic Example:**\n\n```bash\n#!/bin/bash\n\
    count=10 # Global counter variable\n# A function that supposedly counts something\
    \ else\ncount_files_in_dir() {\n# Programmer forgets 'local' and overwrites the\
    \ global variable!\ncount=0\nfor item in \"$1\"/*; do\n  ((count++))\ndone\necho\
    \ \"Directory '$1' has $count files.\"\n}\necho \"Before call: count = $count\"\
    \ncount_files_in_dir \"/etc\"\necho \"After call: count = $count\" # Unexpectedly\
    \ modified!\n```\n\nOutput:\n\nBefore call: count = 10\nDirectory '/etc' has 152\
    \ files.\nAfter call: count = 152\n\nThe global count variable has been destroyed!\n\
    \n**The Savior:** *local* The local keyword declares a variable that exists **only\
    \ within the current function.** It does not overwrite global variables and disappears\
    \ as soon as the function finishes.\n\n**Rule Number One for Functions: Declare\
    \ *every variable inside a function with* local** unless you have a very good,\
    \ intentional reason to modify a global variable.\n\n*The Corrected, Safe Example:*\n\
    \n```bash\ncount_files_in_dir() {\nlocal count=0 # This variable is safe and only\
    \ valid here\n# ... rest of the function ...\n}\n```\n\n## 4.3 SCRIPT LIBRARIES:\
    \ ORGANIZING AND REUSING CODE\n\nIf you have a set of useful helper functions\
    \ (e.g., logging, string manipulation, etc.), it's impractical to copy them into\
    \ every script. The solution is a **library**: a separate file containing only\
    \ function definitions.\n\n**Example of a library file logging.sh:**\n\n```bash\n\
    #!/bin/bash\n\n# This is my logging library\n# Function to print an informational\
    \ message with a timestamp\nlog_info() {\n    local message=\"$1\"\n    echo \"\
    [$(date+%F %T)] [INFO] $message\"\n}\n\n# Function to print an error message\n\
    log_error() {\n    local message=\"$1\"\n    # Write to stderr\n    echo \"[$(date+%F\
    \ %T)] [ERROR] $message\" >&2\n}\n```\n\n**A main script main.sh that uses the\
    \ library:** The shorthand, reads the specified file and executes its contents\
    \ in the context of the current shell. This makes all functions from logging.sh\
    \ available in the main script.\n\n```bash\n#!/bin/bash\nset -euo\n# Source my\
    \ logging library. The path must be correct.\n# `dirname \"$0\"` refers to the\
    \ directory script itself is in.\nsource \"$(dirname \"$0\")/logging.sh\"\nlog_info\
    \ \"Script started.\"\n```\n\n```bash\n# ... do something ...\nif ! do_something;\
    \ then\n  log_error \"Action 'do_something' failed!\"\n  exit 1\nfi\nlog_info\
    \ \"Script finished.\"\n```\n\n## 4.4 FOR ADVANCED USERS: PASSING ARRAYS TO FUNCTIONS\n\
    \nThis is a common hurdle. Attempting to pass an array like my_func \"${my_array[@]}\"\
    \ does not work as expected, especially with elements with spaces. The professional\
    \ solution (since 4.3) is namerefs (declare -n).\n\nA nameref acts as an alias\
    \ for another variable.\n\n```bash\n#!/bin/bash\n# Function that accepts a reference\
    \ to an array\nprocess_array() {\n# 'array_ref' is now an alias for the variable\
    \ name\n# passed during the call (e.g., 'files' or 'users').\ndeclare -n array_ref=\"\
    $1\"\nlog_info \"Processing array '1' with ${#array_ref[@]} elements.\"\nfor item\
    \ in \"${array_ref[@]}\"; do\n  echo \" -> Element: '$item'\"\ndone\n}\n# Source\
    \ the logging library from above\nsource \"$(dirname \"$0\")/logging.sh\"\n# Create\
    \ two different arrays\nfiles=(\"My Document.txt\" \"Spreadsheet (final).csv\"\
    )\nusers=(\"Alice\" \"Bob\" \"Charlie\")\n# Call the function with the *name*\
    \ of the array\nprocess_array files\nprocess_array users\n```\n"
  mdcn: "\n\n## 练习\n\n- 1. **备份脚本**：编写一个接受文件名作为参数（例如 data.csv）的脚本。该脚本应为此文件创建一个名为 data.csv.YYYY-MM-DD.bak\
    \ 的“备份”副本，其中 YYYY-MM-DD 是当前日期。使用参数扩展来处理文件名和扩展名，并使用 `date` 命令获取日期。\n\n- 2. **变量检查器**：创建一个脚本，检查环境变量\
    \ `EDITOR` 和 `PAGER` 是否设置。如果 `EDITOR` 未设置，则将其设置为 `/usr/bin/vim`。如果 `PAGER` 未设置，则将其设置为\
    \ `/usr/bin/less`。最后，打印这两个者的激活值。（提示：`${var:=default}` 在这里非常完美）。\n\n- 3. **名称规范化**：编写一个脚本，接收一个带有空格的文件名列表，并通过将所有空格替换为下划线\
    \ (_) 并将所有字母转换为小写来重命名它们。你的脚本必须安全地处理任何文件名（例如：\"My Report Part 2.DOC\" 变为 my_report_part_2.doc）。\n\
    \n## 4. 函数、库与作用域 – 模块化代码之路\n\n### 引言：从单体脚本到可重用工具\n\n想象你正在制作复杂的家具。每当你需要螺丝时，你都要熔化钢水、将其铸成形状并切割螺纹吗？当然不是。你会伸进工具箱，拿出一个现成的螺丝。编程中的原理是相同的：**不要重复自己（DRY）**。\n\
    \n到目前为止，你的脚本可能是长长的、线性的命令序列。如果你需要在其他地方重复类似的任务，你可能会复制并粘贴代码。这会导致脚本变得臃肿、容易出错且难以维护。一处的更改必须在其他多处都要被搜寻并进行复制。\n\
    \n在本章中，你将学习将代码拆分为逻辑化、可重用单元的艺术：**函数**。我们将探索如何整洁地设计这些函数，将它们组织成**库**——最重要的是的是——控制变量的**作用域**，以避免无意且灾难性的副作用。这是从编写脚本到开发软件的跨越。\n\
    \n### 本章学习目标：\n\n- 设计具有清晰输入输出的专业、可重用函数。\n- 理解局部变量和全局变量之间的关键区别，并将局部变量设为默认。\n- 掌握用于状态的返回值（`return`）与用于数据的标准输出（stdout）之间的区别。\n\
    - 创建你自己的脚本库并使用 `source` 将其包含在其他脚本中。\n- 安全地将数组等复杂数据传递给函数而不破坏它们。\n- 为你的函数制定出一套文档说明的标准。\n\
    \n## 4.1 专业函数的解剖结构\n\n函数不仅仅是一个成组的代码块。它是一份契约。它有定义的任务、定义的输入和定义的输出。\n\n**输入：处理参数**\
    \ 在函数内部通过 `$1`、`$2` 等访问参数，就像在脚本中一样。将它们立即赋值给具有描述性的局部变量是一个良好的做法。\n\n```bash\n# 问候用户的函数\n\
    greet_user() {\n# 将第一个参数赋值给局部变量\nlocal user_name=\"$1\"\nif [[ -z \"$user_name\"\
    \ ]]; then\n  echo \"Error: No username provided.\" >&2\n  return 1 # 状态：失败\n\
    fi\necho \"Hello, ${user_name}!\"\nreturn 0 # 状态：成功\n}\n```\n\n**输出：状态与数据之间的根本区别**\n\
    \n- **返回值 (return)：** 仅用于状态！`return` 命令设置函数的退出状态码（0-255之间的数字）。它的唯一目的是信号成功（0）或失败（其他任何值）。它**绝不**应该用于返回数据。\n\
    `greet_user \"Alice\"; echo $? -> 0`\n\n- **标准输出 (stdout)：** 用于返回数据！如果函数需要返回一个结果（字符串、数字等），它将该结果写入标准输出（stdout）。调用者可以使用命令替换\
    \ `$()` 来捕获此结果。\n\n```bash\nget_current_date() {\n    date --iso-8601\n}\n# 在变量中捕获函数的数据\n\
    today=$(get_current_date)\necho \"Today's date is: $today\"\n```\n\n**标准错误 (stderr)：用于错误和调试消息。**\
    \ 如 `greet_user` 示例所示，错误消息应始终重定向到 stderr (`>&2`)，这样它们就不会被调用者意外捕获为“数据”。\n\n## 4.2\
    \ 作用域：稳定函数最重要的规则\n\n作用域定义了变量何何可见且有效。在 Bash 中，只有两种作用域：全局和局部（函数内部）。\n\n**全局变量的危险（默认行为）**\
    \ 默认情况下，你声明每个变量都是全局的。这意味着在脚本的任何地方都是可见且可修改的——包括函数内部。\n\n**难性示例：**\n\n```bash\n\
    #!/bin/bash\ncount=10 # 全局计数变量\n# 一个据认为计算其他内容的函数\ncount_files_in_dir() {\n# 程序员忘记使用\
    \ 'local' 并覆盖了全局变量！\ncount=0\nfor item in \"$1\"/*; do\n  ((count++))\ndone\n\
    echo \"Directory '$1' has $count files.\"\n}\necho \"Before call: count = $count\"\
    \ncount_files_in_dir \"/etc\"\necho \"After call: count = $count\" # 被意外修改了！\n\
    ```\n\n输出：\n\nBefore call: count = 10\nDirectory '/etc' has 152 files.\nAfter\
    \ call: count = 152\n\n全局变量 `count` 被破坏了！\n\n**救星：** *local* `local` 关键字声明了一个**仅在当前函数内**存在的变量。它不会覆盖全局变量，并在函数结束时立即消失。\n\
    \n**函数的第一条规则：在函数内部使用 local 声明每一个变量**，除非你有一个非常充分且有刻意的理由去修改全局变量。\n\n*修正后的安全示例：*\n\
    \n```bash\ncount_files_in_dir() {\nlocal count=0 # 这个变量是安全的，且在此处有效\n# ... 函数的其他部分\
    \ ...\n}\n```\n\n## 4.3 脚本库：代码的组织与重用\n\n如果你有一组有用的辅助函数（例如日志、字符串处理等），将它们复制到每个脚本中是不现实的。解决方案是**库**：一个只包含函数定义的独立文件。\n\
    \n**库文件 logging.sh 的示例：**\n\n```bash\n#!/bin/bash\n\n# 这是我的日志库\n# 带有时间戳打印信息信息的函数\n\
    log_info() {\n    local message=\"$1\"\n    echo \"[$(date+%F %T)] [INFO] $message\"\
    \n}\n\n# 打印错误信息的函数\nlog_error() {\n    local message=\"$1\"\n    # 写入标准错误\n  \
    \  echo \"[$(date+%F %T)] [ERROR] $message\" >&2\n}\n```\n\n**使用库的主脚本 main.sh：**\
    \ 简写方式读取指定的文件并在当前 shell 中执行其内容。这使得 `logging.sh` 中的所有函数在主脚本中可用。\n\n```bash\n#!/bin/bash\n\
    set -euo\n# 来自日志库。路径必须正确。\n# `dirname \"$0\"` 指脚本所在的目录。\nsource \"$(dirname \"\
    $0\")/logging.sh\"\nlog_info \"Script started.\"\n```\n\n```bash\n# ... 执行某些操作\
    \ ...\nif ! do_something; then\n  log_error \"Action 'do_something' failed!\"\n\
    \  exit 1\nfi\nlog_info \"Script finished.\"\n```\n\n## 4.4 高级用户：向函数传递数组\n\n这是一个常见的障碍。尝试像\
    \ `my_func \"${my_array[@]}\"` 这样传递数组并不符合预期，特别是对于带有空格的元素。专业的解决方案（从 4.3 开始）是引用（namerefs，`declare\
    \ -n`）。\n\n引用充当另一个变量的别名。\n\n```bash\n#!/bin/bash\n# 接收数组引用的函数\nprocess_array()\
    \ {\n# 'array_ref' 现在是调用期间传递的变量名的别名\n#（例如 'files' 或 'users'）。\ndeclare -n array_ref=\"\
    $1\"\nlog_info \"Processing array '1' with ${#array_ref[@]} elements.\"\nfor item\
    \ in \"${array_ref[@]}\"; do\n  echo \" -> Element: '$item'\"\ndone\n}\n# 来自上面的日志库\n\
    source \"$(dirname \"$0\")/logging.sh\"\n# 创建两个不同的数组\nfiles=(\"My Document.txt\"\
    \ \"Spreadsheet (final).csv\")\nusers=(\"Alice\" \"Bob\" \"Charlie\")\n# 使用数组的*名称*调用函数\n\
    process_array files\nprocess_array users\n```\n\n"
