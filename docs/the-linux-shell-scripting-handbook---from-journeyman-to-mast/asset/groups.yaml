- md: "\n# CHAPTER SUMMARY\n\nYou have taken the final step from a simple script to\
    \ a full-fledged, professional command-line tool. You can now use getopts to create\
    \ robust and flexible interfaces for your users that match the behavior of standard\
    \ Unix commands. You structure your projects cleanly into separate directories\
    \ for executables, libraries, and documentation. With the ability to write man\
    \ pages, you ensure that your tools are first-class citizens, well-documented\
    \ and seamlessly integrated into the system environment. Your creations no longer\
    \ feel like foreign objects, but like a native part of the operating system.\n\
    \n# EXERCISES\n\n- 1. **Refactoring with** getopts: Take an older script of yours\
    \ that accepts multiple arguments. Refactor it to use getopts to process options\
    \ like -i <input>, -o <output>, and -f (force). Add a --help function.\n- 2. **Writing\
    \ a man** Page: Write a complete man page for the script refactored in exercise\
    \ 1. Include the sections NAME, SYNOPSIS, DESCRIPTION, OPTIONS, and EXAMPLES.\n\
    - 3. **Building a Structured Tool**: Create a new tool with the bin/, lib/, man/\
    \ structure. The tool should perform a small task (e.g., count words in a text\
    \ file). The counting logic should reside in a function in the lib/ library. The\
    \ main script in bin/ should only handle argument parsing and calling the library\
    \ function.\n\n# 14. INTEGRATING WITH A WIDER ECOSYSTEM – THE SHELL AS THE ENGINE\
    \ OF AUTOMATION\n\n# INTRODUCTION: FROM A TOOL TO AN AUTOMATED FACTORY\n\nUntil\
    \ now, you have viewed scripts as tools that invoke manually to accomplish a specific\
    \ task. You are the craftsman reaching for a hammer. In modern software development\
    \ and systems administration, however, the most important processes are no longer\
    \ initiated by hand. They run automatically, triggered by events: a git push,\
    \ a new pull request, or the need to deploy a new version of an application.\n\
    \nIn this chapter, we will transform your tools into the engines of an automated\
    \ factory. We will see how your shell scripts come to life and act as an integral\
    \ part of the three pillars of modern DevOps workflows: 1. Local Development (Git\
    \ Hooks): Automation directly on the developer’s machine to ensure quality before\
    \ code even leaves the system. 2. Continuous Integration/Continuous Deployment\
    \ (CI/CD): The heart of team automation, where code is automatically built, tested,\
    \ and delivered. 3. Containerization (Docker): The packaging and delivery of applications\
    \ in standardized, portable environments.\n\nYou will discover that the shell\
    \ is not just “nice to have” here, but the universal glue and the executive power\
    \ that drives all these systems. The ability to write robust scripts for these\
    \ ecosystems is one of the most sought-after skills for a modern administrator\
    \ and developer.\n\n# LEARNING OBJECTIVES FOR THIS CHAPTER:\n\n- Create Git Hooks\
    \ to enforce code quality locally and automatically.\n- Understand and implement\
    \ the role of shell scripts in CI/CD pipelines (e.g., GitHub Actions).\n- Learn\
    \ best practices for writing ENTRYPOINT and CMD scripts in Dockerfiles.\n- Understand\
    \ the difference between the “shell form” and the “exec form” in Dockerfiles and\
    \ its impact on signal processing.\n\n# 14.1 THE LOCAL GUARDIANS: QUALITY ASSURANCE\
    \ WITH GIT HOOKS\n\nGit Hooks are scripts that Git automatically executes when\
    \ certain events occur (e.g., before a commit or before a push). They reside in\
    \ the .git/hooks/ directory of every repository.\n\n**The pre-commit Hook: A Final\
    \ Check Before Checking In** This is the most popular hook. It runs before a commit\
    \ is created. If the script exits with a non-zero exit code, the commit is aborted.\
    \ It's the perfect place to run linters like shellcheck.\n\nExample: A pre-commit\
    \ hook that checks all modified shell scripts with shellcheck.\n\n**Create the\
    \ file .git/hooks/pre-commit and make it executable:**\n\n```bash\n#!/bin/bash\n\
    set -eo pipefail\necho \"Running pre-commit...\"\n# Find all .sh files that are\
    \ \"staged\" for the commit\nSTAGED_SH_FILES=$(git diff --cached --name-only --filter=ACMR\
    \ | grep '\\.sh$')\nif [ -z \"$STAGED_SH_FILES\" ]; then\n  echo \"No shell scripts\
    \ to check.\"\n  exit 0\nfi\necho \"Checking the following shell scripts with\
    \ shellcheck:\"\necho \"$STAGED_SH_FILES\"\n# Run shellcheck on each file. If\
    \ one fails, the script exits due to 'set -e'.\necho \"$STAGED_SH_FILES\" | xargs\
    \ -n 1 shellcheck\necho \"All shell scripts are clean. Proceeding with commit.\"\
    \nexit 0\n```\n\nWith this hook in the repository, no team member can accidentally\
    \ commit a faulty shell script again.\n\n# 14.2 THE ASSEMBLY LINE: SHELL SCRIPTS\
    \ IN CI/CD PIPELINES\n\nCI/CD platforms like GitHub Actions, GitLab CI, or Jenkins\
    \ are essentially highly sophisticated execution environments for shell scripts.\
    \ Their YAML configuration files describe *which* commands should be run, *when*,\
    \ and in which environment.\n\nGitHub Actions as an Example: A workflow is defined\
    \ in a *yml* file .github/workflows/.\n\nExample: A simple CI pipeline that runs\
    \ linters and tests on every push. File:.github/workflows/ci.yml\n\n```yaml\n\
    name: Linux Shell CI\non: [push, pull_request]\n```\n\n```yaml\njobs:\n  build-and-test:\n\
    \    runs-on: ubuntu-latest\n    steps:\n      - name: Check out code\n      \
    \  uses: actions/checkout@v3\n      - name: Run ShellCheck Linter\n        run:\
    \ |\n          echo \"Checking all shell scripts in the repository...\"\n    \
    \      # Find all .sh files and run shellcheck on them\n          find . -type\
    \ f -name \"*.sh\" -print0 | xargs -0 shellcheck\n      - name: Run Tests\n  \
    \      run: |\n          echo \"Running the test suite...\"\n          # Here\
    \ you would call your test framework\n          # For our example, we just call\
    \ a test script\n          ./tests/run_tests.sh\n```\n\nEach run: block is essentially\
    \ a small, embedded shell script. Complex logic should be outsourced to separate\
    \ script files to keep the YAML file clean.\n\n# 14.3 THE PACKAGING: SHELL SCRIPTS\
    \ IN DOCKER CONTAINERS\n\nDocker is the de facto standard for deploying applications.\
    \ Shell scripts play a crucial role here.\n\n| Instruction | Description |\n|\
    \ :--- | :--- |\n| **RUN** | Executes commands *during* the image build. Used\
    \ for installing packages and setting up the environment. |\n| **ENTRYPOINT**\
    \ | Defines the main command that is *always* executed when the container starts.\
    \ |\n| **CMD** | Provides default arguments for the user when starting the container\
    \ (docker run ...). |\n\n**The \"exec form\" vs. \"shell form\" – A Critical Difference**\n\
    \n- **Shell form:** `CMD my_program -arg` Docker starts a shell (/bin/sh -c) which\
    \ then starts your program. Your does not run as PID 1, and signals (like docker\
    \ stop) are not forwarded correctly. **This is almost always the wrong choice.**\n\
    - **Exec form:** `CMD [\"my_program\", \"-arg\"]` Docker starts your program directly.\
    \ It runs as PID 1 and receives signals correctly. **This is the preferred method.**\n\
    \nThe ENTRYPOINT Script Pattern An entrypoint.sh script is a common practice to\
    \ configure a container before the main application starts.\n\nExample: An entrypoint.sh\
    \ script that waits for a database.\n\n```bash\n#!/bin/bash\nset -e\n# Wait for\
    \ the database to be ready\nuntil nc -z -w30 \"$DB_HOST\" \"$DB_PORT\"; do\n \
