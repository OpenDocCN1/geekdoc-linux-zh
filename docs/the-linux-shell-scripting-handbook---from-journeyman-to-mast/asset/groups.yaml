    # 2.1 THE SHEBANG SHOWDOWN: #!/BIN/SH VS. #!/BIN/BASH


    The first line of your script, the shebang, is an explicit instruction.


    +   - #!/bin/bash: You are telling the system, “This script requires Bash and
    all its extensions. Please execute it with /bin/bash,”


    +   - #!/bin/sh: You are telling the system, “This script is portable. Please
    execute it with the default system shell found at /bin/sh.”


    The crucial point is that /bin/sh is not always bash.


    +   - On many Debian/Ubuntu systems, /bin/sh is a symbolic link to dash, a very
    fast, minimalist, and strictly POSIX-compliant shell.


    +   - On macOS, /bin/sh is an outdated version of Bash that runs in POSIX mode.


    +   - In Alpine Linux (very popular in Docker), /bin/sh is a link to ash, another
    minimalist shell.Example of a Break: Save this as test.sh and make it executable.


