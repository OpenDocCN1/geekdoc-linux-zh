    \ tests with && and ||.\n\n2. **Arithmetic:** ((...)) vs. $((...)) and expr\n\n\
    - Bash-ism: (( i++ ))\n- POSIX Standard: i=$((i + 1))\n- The $((...)) expansion\
    \ for arithmetic evaluation is part of the POSIX standard and is the preferred,\
