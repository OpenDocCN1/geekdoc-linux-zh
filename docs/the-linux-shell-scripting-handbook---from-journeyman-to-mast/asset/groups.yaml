    # 7. PROCESS MANAGEMENT AND PARALLELIZATION – BECOME THE CONDUCTOR'
  - '[PAGE 86]


    # INTRODUCTION: FROM SERIAL EXECUTION TO PARALLEL ORCHESTRATION


    Until now, your scripts have likely functioned like a single-lane road: one command
    executes, and only when it''s finished the next one start. This is simple and
    predictable. But what if you need to convert 1,000 images, download 50 log files
    from different servers, or compare the complex output of two commands? Serial
    execution quickly becomes a crippling bottleneck.


    In this chapter, you will learn to evolve from a simple traffic cop into the conductor
    of an entire orchestra. You will learn to launch processes in the background and
    precisely control their execution (wait). You will connect data streams in unimaginable
    ways using simple pipes (process substitution). And you will harness the dormant
    power of modern multi-core CPUs to make your scripts many times faster through
    parallelization.


    Mastering these techniques is a quantum leap. It allows you to design complex
    workflows that are not only correct but also extremely performant. You will stop
    just executing commands—you will start orchestrating processes.'
- md: "\n# LEARNING OBJECTIVES FOR THIS CHAPTER:\n\n- Safely and reliably manage background\
    \ processes in scripts using wait and jobs.\n- Understand the power of process\
    \ substitution (<(...), >(...)) to avoid temporary files.\n- Establish two-way\
    \ communication with background processes using coprocesses (coproc).\n- Learn\
    \ two powerful methods for parallelizing tasks: xargs and the wait loop.\n- Keep\
    \ an eye on system load and sensibly throttle the number of parallel jobs.\n\n\
    ## 7.1 MORE THAN JUST: THE ART OF JOB CONTROL IN SCRIPTS\n\nYou know the & symbol\
    \ for sending a process to the background from your interactive shell. In scripting,\
    \ it unleashes its true power in combination with wait.\n\n- jobs: Displays the\
    \ jobs running in the background.\n- wait [job_id | process_id]: Pauses the script\
    \ until the specified job or process has finished. Without an argument, wait waits\
    \ for all running background processes of the script.\n\n### The Basic Pattern\
    \ for Parallel, Independent Tasks:\n\n```bash\n#!/bin/bash\necho \"Starting all\
    \ jobs...\"\n# Launch several long-running processes in the background\nsleep\
    \ 5 && echo \"Job 1 finished.\" &\nsleep 3 && echo \"Job 2 finished.\" &\nsleep\
    \ 4 && echo \"Job 3 finished.\" &\necho \"All jobs are running. Now waiting for\
    \ them to complete...\"\n# 'wait' blocks here until the last background process\
    \ has finished\nwait\necho \"All jobs have completed. Script finished.\"\n```\n\
    \nWithout wait, the script would exit immediately, and the echo commands would\
    \ execute later, which is rarely the desired behavior.\n\n## 7.2 PROCESS SUBSTITUTION:\
    \ WHEN PIPES ARE’T ENOUGH\n\nA pipe | is fantastic for sending the output of one\
    \ command to the standard input of another. But what if a command expects its\
    \ input from a file?\nExample: diff file1 file2. This is where process substitution\
    \ comes in.\n\n<command> – A Command Pretends to Be a File: The shell executes\
    \ the command and makes its stdout available via a special file in the /dev/fd\
    \ directory. The outer command thinks it’s reading from a normal file.\n\nExample:\
    \ Compare the contents of two directories without temporary files.\n\n```bash\n\
    # The \"old\" way with temporary files:\nls -1 /etc > /tmp/etc.txt\nls -1 /usr/bin\
    \ > /tmp/usr_bin.txt\ndiff /tmp/etc.txt /tmp/usr_bin.txt\nrm /tmp/etc.txt /tmp/usr_bin.txt\n\
    # The elegant, modern way:\ndiff <(ls -1 /etc) <(ls -1 /usr/bin)\n# No temporary\
    \ files, no cleanup needed!\n```\n\n>(command) – A Command Disguised as a Writable\
    \ File: This is the counterpart. It allows the output of a command to be sent\
    \ directly to the standard input of another, as if it were a file.\n\nExample:\
    \ Write output to the console and a grep process simultaneously:\n\n```bash\n\
    # 'tee' writes its input to both stdout and the specified file(s)\necho -e \"\
    INFO: Start\\nERROR: Critical Failure\\nINFO: End\" | tee >(grep ERROR)\n```\n\
    \n### Output:\n\nERROR: Critical Failure # Output from grep\n\nINFO: Start\n\n\
    ERROR: Critical Failure\n\nINFO: End # Output from tee to the console\n\n## 7.3\
    \ COPROCESSES (COPROC): TWO-WAY COMMUNICATION\n\nThis is one of the most advanced\
    \ techniques. A coprocess is a background process with which your main script\
    \ can communicate via two dedicated pipes: you can send it commands and read replies\
    \ from it.\n\n**Syntax:** coproc NAME { commands; } * NAME[0]: A file descriptor\
    \ number to read from the coprocess. * NAME[1]: A file descriptor number to write\
    \ to the coprocess.\n\n*Example: Interacting with the bc calculator*\n\n```bash\n\
    !/bin/bash\n# Start 'bc' as a coprocess named 'CALC'\ncoproc CALC { bc -l; }\n\
    # Send commands to the coprocess\necho '10 /3' >&${CALC[1]}\necho 'sqrt(100)'\
    \ >&${CALC[1]}\n# Read the replies from the coprocess\nread -r result1 <${CALC[0]}\n\
    read -r result2 <${CALC[0]}\necho \"Result 1: $result1\"\necho \"Result 2: $result2\"\
    \n# Close the coprocess\nexec {CALC[1]}>&-\n```\n\nCoprocesses are ideal for scenarios\
    \ where a persistent connection or state needs to be maintained in the background\
    \ process.\n\n## 7.4 HANDS-ON WORKSHOP: SPEEDING UP SCRIPTS\n\n**Scenario:** We\
    \ have a list of URLs and want to get the status code for each. Throttle the number\
    \ of simultaneous downloads.\n\n**Method 1: The for loop This method gives us\
    \ control.**\n\n```bash\n#!/bin/bash\n# Function that does the work\ncheck_url()\
    \ {\n  local url=\"$1\"\n  local code=$(curl -s -o /dev/null -w \"%{http_code}\"\
    \ \"$url\")\n  echo \"$url: $code\"\n}\n\n# Read from the file\nwhile read -r\
    \ url; do\n  check_url \"$url\" &\n  # Limit the number of background jobs to\
    \ 4\n  if [[ $(jobs -r | wc -l) -ge 4 ]]; then\n    wait -n\n  fi\ndone < urls.txt\n\
    wait # Wait for all remaining jobs\n```\n\n**Method 2: The xargs Solution is often\
    \ more powerful.**\n\n```bash\n#!/bin/bash\n# Function that does the work\ncheck_url()\
    \ {\n  local url=\"$1\"\n  local code=$(curl -s -o /dev/null -w \"%{http_code}\"\
    \ \"$url\")\n  echo \"$url: $code\"\n}\n\nexport -f check_url\n# Use xargs to\
    \ run the function 4 processes at a time\ncat urls.txt | xargs -I {} -P 4 bash\
    \ -c 'check_url \"{}\"'\n```\n\n# CHAPTER SUMMARY\n\nYou are now able to launch\
    \ background processes but also control them with wait. With process substitution,\
    \ you've learned a clean alternative to temporary files. You've even had a glimpse\
    \ into two-way communication with coprocesses. Most importantly, you now know\
    \ how to speed up repetitive tasks through parallelization, whether through the\
    \ wait loop or xargs. Your scripts are no longer bound by serial.\n\n# EXERCISES\n\
    \n- **Parallel Download:** Write a script that reads a list of URLs from a file\
    \ and downloads them using wget or curl. Throttle the number of simultaneous downloads\
    \ to 5.\n- **Comparison of Filtered Data:** Use process substitution (<(...) to\
    \ directly compare the output of two grep commands on a log file using diff, without\
    \ creating a temporary file.\n- **Performance Test:** Take a script that processes\
    \ a large number of small files (e.g., converting images). Measure the execution\
    \ time of the serial version. Then, implement a parallel version using xargs -P\
    \ and measure the time again.\n\n## 8. THE TRIUMVIRATE: GREP, SED, AND AWK REVISITED\n\
    \n## INTRODUCTION: POCKET KNIFE TO POWER SAW\n\nIn your journey as a scripter,\
    \ grep, sed, and awk have been your constant companions. You've used grep to find\
    \ lines, sed to perform simple substitutions, and perhaps awk to extract a specific\
    \ column. You have mastered them the digital equivalent of a pocket knife: versatile\
    \ and useful for countless tasks.\n\nIt is now time to upgrade your tools. This\
    \ chapter will transform your pocket knife into a set of specialized tools. We\
    \ will revisit this “triumvirate” of text processing, but this time, we will unlock\
    \ their advanced features. You will learn to use grep for complex, multi-line\
    \ pattern matching with Perl-Compatible Regular Expressions (PCRE). You will dive\
    \ into the esoteric but powerful “hold space” of sed to perform non-linear transformations.\
    \ And you will discover that awk is not just a column-extractor, but a complete,\
    \ Turing-complete programming language with arrays, functions, and complex logic.\n\
    \nMost importantly, you will learn the art of combining these three tools into\
    \ elegant and powerful pipelines, where each tool does what it does best. Mastering\
    \ this synergy is the key to solving virtually any text-processing challenge the\
    \ command line throws at you.\n"
  mdcn: "\n\n# 本章学习目标：\n\n- 使用 `wait` 和 `jobs` 在脚本中安全、可靠地管理后台进程。\n- 理解进程替换 (`<(...)`,\
    \ `>(...)`) 的威力，以避免创建临时文件。\n- 使用协进程 (`coproc`) 与后台进程建立双向通信。\n- 学习两种用于任务并行的强大强大方法：`xargs`\
    \ 和 `wait` 循环。\n- 关注系统负载并明智地限制并行作业的数量。\n\n## 7.1 不仅仅于此：脚本中的作业控制艺术\n\n你已经知道在交互式\
    \ shell 中使用 `&` 符号将进程发送到后台。在脚本中，它与 `wait` 结合使用会释放出真正的威力。\n\n- `jobs`: 显示正在后台运行的作业。\n\
    - `wait [job_id | process_id]`: 暂停脚本，直到指定的作业或进程完成。如果不带参数，`wait` 会等待脚本中所有运行中的后台进程。\n\
    \n### 并行、独立任务的基本模式：\n\n```bash\n#!/bin/bash\necho \"Starting all jobs...\"\n#\
    \ 在后台启动几个长时间运行的进程\nsleep 5 && echo \"Job 1 finished.\" &\nsleep 3 && echo \"Job\
    \ 2 finished.\" &\nsleep 4 && echo \"Job 3 finished.\" &\necho \"All jobs are\
    \ running. Now waiting for them to complete...\"\n# 'wait' 在此处阻塞，直到最后一个后台进程完成\n\
    wait\necho \"All jobs have completed. Script finished.\"\n```\n\n如果没有 `wait`，脚本将立即退出，`echo`\
    \ 命令将稍后执行，这通常不是预期的行为。\n\n## 7.2 进程替换：当管道不够用时\n\n管道 `|` 对于将一个命令的输出发送到另一个命令的标准输入是非常棒的。但如果一个命令期望从文件读取输入呢？\n\
    示例：`diff file1 file2`。这正是进程替换大显身场。\n\n`<command>` – 伪装成文件的命令：shell 执行命令并通过 `/dev/fd`\
    \ 目录下的特殊文件提供其标准输出。外部命令认为它正在从一个普通文件中读取。\n\n示例：在不使用临时文件的情况下两个目录的内容。\n\n```bash\n\
    # 使用临时文件的“旧”方法：\nls -1 /etc > /tmp/etc.txt\nls -1 /usr/bin > /tmp/usr_bin.txt\n\
    diff /tmp/etc.txt /tmp/usr_bin.txt\nrm /tmp/etc.txt /tmp/usr_bin.txt\n# 优雅的现代方法：\n\
    diff <(ls -1 /etc) <(ls -1 /usr/bin)\n# 无临时文件，无需清理！\n```\n\n`>(command)` – 伪装成可写文件的命令：这是对应的写法。它允许将命令的输出直接发送到另一个命令的标准输入，就像文件一样。\n\
    \n示例：同时将输出写入控制台和 grep 进程：\n\n```bash\n# 'tee' 将其输入写入标准输出和指定的文件(s)\necho -e \"\
    INFO: Start\\nERROR: Critical Failure\\nINFO: End\" | tee >(grep ERROR)\n```\n\
    \n### 输出：\n\nERROR: Critical Failure # 来自 grep 的输出\n\nINFO: Start\n\nERROR: Critical\
    \ Failure\n\nINFO: End # 来自 tee 到控制台的输出\n\n## 7.3 协进程 (COPROC)：双向通信\n\n这是先进的技术之一。协进程是一个后台进程，你的主脚本可以通过两个专用管道与其通信：你可以向它发送命令并从中读取回复。\n\
    \n**语法：** `coproc NAME { commands; }` `* NAME[0]`: 从协进程读取的文件描述符数字。`* NAME[1]`:\
    \ 写入协进程的文件描述符数字。\n\n*示例：与 bc 计算器交互*\n\n```bash\n!/bin/bash\n# 启动 'bc' 为 'CALC'\
    \ 的协进程\ncoproc CALC { bc -l; }\n# 向协进程发送命令\necho '10 /3' >&${CALC[1]}\necho 'sqrt(100)'\
    \ >&${CALC[1]}\n# 从协进程读取回复\nread -r result1 <${CALC[0]}\nread -r result2 <${CALC[0]}\n\
    echo \"Result 1: $result1\"\necho \"Result 2: $result2\"\n# 关闭协进程\nexec {CALC[1]}>&-\n\
    ```\n\n协进程非常适用于需要在后台进程中维护持久连接或状态的场景。\n\n## 7.4 动手实践工作坊：加速脚本\n\n**场景：** 我们有一组 URL\
    \ 列表，并想要获取每个状态码。限制同时下载的数量。\n\n**方法 1：for 循环。这种方法给了我们控制权。**\n\n```bash\n#!/bin/bash\n\
    # 执行工作的函数\ncheck_url() {\n  local url=\"$1\"\n  local code=$(curl -s -o /dev/null\
    \ -w \"%{http_code}\" \"$url\")\n  echo \"$url: $code\"\n}\n\n# 从文件读取\nwhile read\
