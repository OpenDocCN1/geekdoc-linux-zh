    ## 11.3 安全数据传输：SCP 和 RSYNC\n\n- scp (安全拷贝)：处理单个文件时简单且高效。\n\n### 将本地文件复制到服务器\n\n\
    ```\nscp /local/path/file.txt user@server:/remote/path/\n```\n\n### 从服务器下载文件\n\
    \n```\nscp user@server:/remote/path/file.txt /local/path/\n```\n\n- rsync: 比 scp\
    \ 更强大、更智能。rsync 仅传输文件的变化部分，可以递归同步目录，并包含更多功能。它是备份和部署的首选方法。\n\n### 将本地目录与远程目录同步\n\
    \n- -a: 归档模式（递归、保留权限等）\n- -v: 详细模式\n- --delete: 删除目标路径中源端已不存在的文件\n\n```\nrsync\
    \ -av --delete /path/to/project/ user@server:/path/to/deployment/\n```\n\n## 11.4\
    \ SSH 隧道：穿过不安全网络的加密通道\n\n假设你有一个数据库服务器，出于安全考虑，其端口（例如 5432）不能在互联网上访问。但你又需要从笔记本电脑访问它。SSH\
    \ 隧道（也称为端口转发）就是解决方案。\n\n### 本地端口转发 (-L) 此命令在你的本地机器上打开一个端口，并将通过 SSH 连接发送的所有流量安全地转发到目标服务器，并进一步从那里转发到目标服务。\n\
    \n语法：`ssh -L LOCAL_PORT:TARGET_HOST:TARGET_PORT_BASTION_HOST`\n\n示例：`ssh -L 8000:db-server.internal:5432\
    \ user@bastion-host.com`\n\n* 发生了什么？\n\n1. 你到 bastion-host.com 建立了普通的 SSH 连接。\n\
    2. SSH 在你的笔记本电脑（localhost）上打开了 8000 端口。\n3. 当你用数据库客户端连接 localhost:8000 时，SSH 拦截了该连接。\n\
    4. 流量通过隧道被加密并发送到 bastion-host.com。\n5. bastion-host.com 服务器解密流量并将其转发到 db-server.internal:5432。\n\
    \n现在，你可以使用本地数据库工具进行工作，就就像数据库就在你自己的机器上一样，尽管它安全地位于防火墙之后。\n\n## 章节总结\n\n你的 shell\
    \ 不再受限于自己的机器。你已经学习了如何使用 netcat 和 nmap 感受网络脉动，并积极监控服务。通过掌握基于密钥的 SSH 认证，你现在可以像管理一台服务器一样轻松管理几十台服务器；通过\
    \ rsync，你可以智能且高效地同步数据。凭借 SSH 隧道的知识，你甚至可以保护不安全的服务，并为内部资源创建安全访问。你现在有能力编写脚本来控制并自动化不仅是单个系统，而是整个网络基础设施。\n\
    \n## 练习\n\n1. 端口扫描器：编写一个接收主机名列表和端口列表的脚本。脚本应使用 nc 检查每个主机上的每个端口，并打印一个清晰的表格，显示哪个主机的哪个端口是“开启”或“关闭”。\n\
    \n2. 并行 uptime：获取你有无密 SSH 访问的服务器列表。编写一个脚本并行登录所有服务器，执行 uptime 命令并显示收集到的输出。\n\n\
    3. 自动化数据库备份：编写一个脚本，到跳板机建立 SSH 隧道以访问内部数据库。然后它应该使用 pg_dump（或 mysqldump）命令通过隧道备份数据库，并将备份文件保存到本地。备份完成后，应销毁隧道。（提示：使用\
    \ -fn 在后台启动 SSH 并保存 PID（进程标识符）以便稍后杀掉它）。\n\n## 12. 脚本性能调优——从拖拉机到赛车\n\n### 引言：当“能用”不再足够时\n\
    \n你的脚本执行了它应该做的事情。它健壮、安全且结构良好。但当它需要处理 10,000 个文件而不是 10 个时，运行时间突然从几秒钟变成了几小时。在自动化和数据处理的世界里，速度往往不是奢侈，而是必需。运行时间过长的备份脚本可能会影响生产系统。耗时数小时的数据处理任务可能会延迟关键业务决策。\n\
    \n这一章是你的维修站。在这里，你将学习将那些到目前为止可靠的拖拉机变成流畅的赛车。我们将揭示关于 shell 一个基础但至关重要的真相：它最大的优势——调用其他命令的能力——也是它最大的性能弱点。每个外部命令都是一次昂贵的进站。\n\
    \n我们将学习如何使用 time 和 strace 等专业工具定位瓶颈。你将掌握将外部命令替换为闪速 shell 内置操作的艺术。你还将发现如何将计算密集型任务卸载给\
    \ awk 等专门工具，从而大幅减少“进站”次数。\n\n### 本章学习目标：\n\n- 使用 time 和 strace 精确识别脚本中的性能瓶颈。\n\
    - 理解“分叉”（forking）的高成本——为什么每次调用外部命令都是昂贵的。\n- 通过持续使用 shell 内置命令和参数扩展来加速脚本。\n- 识别并避免常见的性能陷阱，例如“无意义的\
    \ cat 使用”。\n- 将计算密集型的循环重写为性能更优的 awk 脚本。\n- 识别 shell 性能的局限，并在何时切换到另一种语言是正确的选择。\n\
    \n## 12.1 测量而非猜想：使用 TIME 和 STRACE 寻找瓶颈\n\n没有测量的优化是浪费时间。你需要知道你的脚本哪里慢。\n\n### time\
    \ 命令：首次窥视内部\ntime 命令测量命令的执行时间并对其进行拆分：\n* real: 实际经过的墙钟时间。\n* user: 在用户空间花费的 CPU\
    \ 时间（在进程内部）。\n* sys: 在内核空间花费的 CPU 时间（用于读/写文件等系统调用）。\n\n```\n$ time sleep 3\nreal\
    \ 0m.004s\nuser 0m.000s\nsys 0m.003s\n```\n\n高值通常意味着大量的 I/O 操作。\n\n### strace：系统调用的显微镜\n\
    strace 记录程序执行的每一个系统调用。c 选项非常有用：它会统计调用的次数并提供摘要。\n\n示例：内置命令与外部命令的差异。\n\n```\n# 外部命令在循环中\n\
    $ strace -c bash -c 'for i in {1000}; do /bin/true; done'\n% time seconds    \
    \         calls             errors\n0.001673                   1000          \
    \   \n\n# 内置命令在循环中\n$ strace -c bash -c 'for i in {1000}; do ; done'\n% time seconds\
    \             calls             errors\n0.000000                      0      \
    \          \n```\n\n## 12.2 性能头号杀手：fork 的成本\n\n每当你的脚本调用外部命令（grep, sed, cut, ls...），内核都必须：\n\
    1. fork(): 创建 shell 进程的内存精确拷贝。这是昂贵的。\n2. exec(): 将新命令的代码加载到这个拷贝进程中并执行。\n\n这种过程比在\
    \ shell 内直接的操作慢几个数量级。\n\nShell 性能的黄金法则：最小化启动的进程数量。避免每一次 fork 就是一次胜利。\n\n## 12.3\
    \ 实用优化技术\n\n### 1. 使用 shell 内置命令代替外部命令\n这是最重要的技术。许多初学者使用外部命令完成的任务可以通过参数扩展完成（见第\
    \ 3 章）。\n\n- Bad（慢）：filename=$(basename##*/*)\n- Good（快）：filename=\"${filepath##*}\n\
    - Bad（慢）：ext=\"$(echo \"filename\" | cut -d 2)\n- Good（快）：ext=\"${filename.*}\"\
    \n\n### 2. 避免“无意义的 cat 使用”（以及类似的模式\n经典的初学者错误，创建了不必要的进程。\n\n- Bad（1 个不必要进程）：cat\
    \ file.txt | grep \"pattern\"\n- Good（高效）：grep \"pattern\" file.txt\n- Bad（2 个不必要进程）：cat\
    \ file.txt | sort | uniq -c\n- Good（高效）：sort file.txt | uniq -c\n\n### 3. 将重负载卸载给\
    \ awk\n有时，shell 本身的循环是瓶颈，特别是算术运算。awk 是外部命令，但它只被启动一次，然后运行自己的快得多的内部循环。\n\n场景：汇总文件中的数字。\n\
    \n缓慢 shell 循环（不 fork，但 shell 算术很慢）：\n\n```bash\ntotal=0\nwhile read -r num; do\n\
    \  ((total += num))\ndone < numbers.txt\necho \"$total\"\n```\n\n"
