    \ destination that no longer exist in the source\n\n```\nrsync -av --delete /path/to/project/\
    \ user@server:/path/to/deployment/\n```\n\n## 11.4 SSH TUNNELING: A SECURE CORRIDOR\
    \ THROUGH THE INSECURE NET\n\nImagine you have a database server whose port (e.g.,\
    \ 5432) must not be accessible over the internet for security reasons. But you\
    \ need to access it from your laptop. An SSH tunnel (also called port forwarding)\
    \ is the solution.\n\n### Local Port Forwarding (-L) This command opens a port\
    \ on your local machine and securely forwards all traffic sent through the SSH\
    \ connection to the destination server, and from there on to the target service.\n\
    \nSyntax: `ssh -L LOCAL_PORT:TARGET_HOST:TARGET_PORT_BASTION_HOST`\n\nExample:\
    \ `ssh -L 8000:db-server.internal:5432 user@bastion-host.com`\n\n* What happens?\n\
    \n1. You establish a normal SSH connection to bastion-host.com.\n2. SSH opens\
    \ port 8000 on your laptop (localhost).\n3. When you now connect to localhost:8000\
    \ with a database client, SSH intercepts this connection.\n4. The traffic is sent,\
    \ encrypted, through the tunnel to bastion-host.com.\n5. The bastion-host.com\
    \ server decrypts the traffic and forwards it to db-server.internal:5432.\n\n\
    You can now work with your local database tool as if the database were on your\
    \ own machine, even though it’s safely behind a firewall.\n\n## CHAPTER SUMMARY\n\
    \nYour shell is no longer confined to its own machine. You have learned to feel\
    \ the pulse of the network with netcat and nmap and to actively monitor services.\
    \ By mastering key-based SSH authentication, you can now manage dozens of servers\
    \ as easily as one, and with rsync, you can synchronize data intelligently and\
    \ efficiently. With the knowledge of SSH tunneling, you can even secure unsafe\
    \ services and create secure access to internal resources. You are now capable\
    \ of writing scripts that control and automate not just single systems, but entire\
    \ network infrastructures.\n\n## EXERCISES\n\n1. Port Scanner: Write a script\
    \ that takes a list of hostnames and a list of ports. The script should check\
    \ each port on each host using nc and print a clear table showing which port is\
    \ “open” or “closed” on which host.\n\n2. Parallel uptime: Take a list of servers\
    \ to which you have passwordless SSH access. Write a script that logs into all\
    \ servers in parallel, executes the uptime command, and displays the collected\
    \ output.\n\n3. Automated Database Backup: Write a script that establishes an\
    \ SSH tunnel to a bastion host to access an internal database. It should then\
    \ use the pg_dump (or mysqldump) command to back up the database through the tunnel\
    \ and save the backup file locally. The tunnel should be torn down after the backup\
    \ is complete. (Hint: Start SSH in the background with -fn and save the PID to\
    \ kill it later).\n\n## 12. PERFORMANCE TUNING YOUR SCRIPTS – FROM A TRACTOR TO\
    \ A RACE CAR\n\n### INTRODUCTION: WHEN “IT WORKS” IS NO LONGER ENOUGH\n\nYour\
    \ script does what it’s supposed to do. It’s robust, secure, and well-structured.\
    \ But when it has to work with 10,000 files instead of 10, it suddenly takes hours\
    \ instead of seconds to run. In the world of automation and data processing, speed\
    \ is often not a luxury, but a necessity. A backup script that runs too long could\
    \ impact a production system. A data processing job that takes hours could delay\
    \ critical business decisions.\n\nThis chapter is your pit stop. Here, you will\
    \ learn to transform your scripts, which have been reliable tractors until now,\
    \ into sleek race cars. We will uncover a fundamental but crucial truth about\
    \ the shell: its greatest strength—the ability to call other commands—is also\
    \ its greatest performance weakness. Every external command is an expensive pit\
    \ stop.\n\nWe will learn how to pinpoint bottlenecks with professional tools like\
    \ time and strace. You will master the art of replacing external commands with\
    \ lightning-fast, built-in shell operations. And you will discover how to offload\
    \ computationally intensive tasks to specialized tools like awk to drastically\
    \ reduce the number of “pit stops.”\n\n### LEARNING OBJECTIVES FOR THIS CHAPTER:\n\
    \n- Precisely identify performance bottlenecks in scripts with time and strace.\n\
    - Understand the high cost of \"forking\"—why every external command call is expensive.\n\
    - Speed up scripts by consistently using shell builtins and parameter expansion.\n\
    - Recognize and avoid common performance traps like the \"Useless Use of cat,\"\
    \n- Rewrite computationally intensive loops into more performant awk scripts.\n\
    - Recognize the limits of shell performance and know when switching to another\
    \ language is the right move.\n\n## 12.1 MEASURE, DON'T GUESS: FIND BOTTLENECKS\
    \ WITH TIME AND STRACE\n\nOptimization without measurement is a waste of time.\
    \ You need to know where your script is slow.\n\n### The time Command: The First\
    \ Look Under the Hood\ntime command measures the execution time of a command and\
    \ breaks it down:\n* real: The actual elapsed wall-clock time.\n* user: The CPU\
    \ time spent in user-space (in the process itself).\n* sys: The CPU time spent\
    \ in kernel-space (for system calls like reading/writing files).\n\n```\n$ time\
    \ sleep 3\nreal 0m.004s\nuser 0m.000s\nsys 0m.003s\n```\n\nA high value often\
    \ indicates many I/O operations or process startups.\n\n### strace: The Microscope\
    \ for System Calls\ntrace logs every system call a process makes. The -c option\
    \ is invaluable: it counts the calls and provides a summary.\n\nExample: The difference\
    \ between a builtin and an external command.\n\n```\n# External command in a loop\n\
    $ strace -c -trace='process' bash -c 'for i in {1..1000}; do /bin/true; done'\n\
    % time seconds uses/call calls errors syscall\n100.00 0.001673 2 1000 clone\n\n\
    Total 0.001673 1000 1 total\n```\n\n### Shell builtin in a loop\n\n```\n$ strace\
    \ -c -e 'trace-process' bash -c 'for i in {1..1000}; do ; done'\n% time seconds\
    \ uses/call calls errors syscall\nTotal 0.000000 0 total\n```\n\nThe result is\
    \ dramatic: 1000 clone (the start of the forking process) for the external command,\
    \ but zero for the builtin.\n\n## 12.2 THE #1 PERFORMANCE KILLER: THE COST OF\
    \ FORKING\n\nEvery time your script calls an external command (grep, sed, cut,\
    \ ls...), the kernel must:\n1. fork(): Create an exact copy of the shell process\
    \ in memory. This is expensive.\n2. exec(): Load the code of the new command into\
    \ this copied process and execute it.\n\nThis process is orders of magnitude slower\
    \ than an operation that happens directly within the shell.\n\nThe Golden Rule\
    \ of Shell Performance: Minimize the number of processes launched. Every fork\
    \ avoided is a win.\n\n## 12.3 PRACTICAL OPTIMIZATION TECHNIQUES\n\n### 1. Use\
    \ Shell Builtins Instead of External Commands\nThis is the most important technique.\
    \ Many tasks for which beginners use external commands can be done with parameter\
    \ expansion (see Chapter 3).\n\n- Bad (slow): filename=$(basename##*/*)\n- Good\
    \ (fast): filename=\"${filepath##*}\"\n- Bad (slow): ext=\"$(echo \"filename\"\
    \ | cut -d 2)\n- Good (fast): ext=\"${filename.*}\"\n\n### 2. Avoid the \"Useless\
    \ Use of cat\" (and similar patterns)\nA classic beginner mistake that creates\
    \ an unnecessary process.\n\n- Bad (1 unnecessary process): cat file.txt | grep\
    \ \"pattern\"\n- Good (efficient): grep \"pattern\" file.txt\n- Bad (2 unnecessary\
    \ processes): cat file.txt | sort | uniq -c\n- Good (efficient): sort file.txt\
    \ | uniq -c\n\n### 3. Offload Heavy Work to awk\nSometimes, a loop in the shell\
    \ itself is the bottleneck, especially for arithmetic. awk is an external command,\
    \ but it's only launched once and then runs its own, much faster, internal loop.\n\
    \nScenario: Sum the numbers in a file.\n\nThe slow shell loop (never forks, but\
    \ shell arithmetic is slow):\n\n```bash\ntotal=0\nwhile read -r num; do\n  ((total\
    \ += num))\ndone < numbers.txt\necho \"$total\"\n```\n"
