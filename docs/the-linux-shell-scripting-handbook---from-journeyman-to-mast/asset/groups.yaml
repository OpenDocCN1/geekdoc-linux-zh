  - '[PAGE 145]


    # 12.2 THE #1 PERFORMANCE KILLER: THE COST OF FORKING


    Every time your script calls an external command (grep, sed, cut, ls...), the
    kernel must must: 1. fork(): Create an exact copy of the shell process in memory.
    This is expensive. 2. exec(): Load the code of the new command into this copied
    process and execute it.


    This process is orders of magnitude slower than an operation that happens directly
    within the shell process.


    The Golden Rule of Shell Performance: Minimize the number of processes launched.
    Every fork avoided is a win.'
