  - '[PAGE 169]


    # 14.3 THE PACKAGING: SHELL SCRIPTS IN DOCKER CONTAINERS


    Docker is the de facto standard for deploying applications. Shell scripts play
    a crucial role here.


    RUN VS. CMD VS. ENTRYPOINT * RUN: Executes commands *during* the image build.
    Used for installing packages and setting up the environment. * ENTRYPOINT: Defines
    the main command that is *always* executed when the container starts. * CMD: Provides
    default arguments for the user when starting the container (docker run ...).


    **The "exec form" vs. the "shell form" – A Critical Difference * Shell form:**
    CMD my_program -arg Docker starts a shell (/bin/sh -c) which then starts your
    program. Your does not run as PID 1 in the container, and signals (like docker
    stop) are not forwarded correctly. **This is almost always the wrong choice. *
    Exec form:** CMD ["my_program", "-arg"] Docker starts your program directly. It
    runs as PID 1 and receives signals correctly. **This is the preferred method.**


    The ENTRYPOINT Script Pattern An entrypoint.sh script is a common practice to
    configure a container before the main application starts.


    Example: An entrypoint.sh script that waits for a database.


    ```

    #!/bin/bash

    set -e

    # Wait for the database to be ready

    until nc -z -w30 "$DB_HOST" "$DB_PORT"; do

    echo "Waiting for database"

    sleep 1

    done

    echo "Database is ready. Starting application"

    ```'
