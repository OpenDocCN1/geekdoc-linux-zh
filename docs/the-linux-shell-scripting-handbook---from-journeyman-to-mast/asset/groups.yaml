    # # APPENDIX N: BEST PRACTICES FOR SCRIPTS IN AUTOMATION ECOSYSTEMS


    This checklist summarizes the most important patterns and rules for writing shell
    scripts used in Git Hooks, CI/CD pipelines, and Docker containers.


    | Ecosystem Practice / Rule | Why It’s Important | Example |

    | --- | --- | --- |

    | General Be explicit; do not rely on the environment. | The execution environment
    (e.g., a CI runner) is minimal. It is not your personal shell. | Always provide
    full paths or ensure PATH is set correctly. Explicitly install all dependencies.
    |

    | Use set-euo pipefail | In automated systems, there is no user to notice errors.
    A script must fail immediately and unambiguously on error. | set-euo pipefail
    at the start of every script. |

    | Git Hooks Keep hooks fast. | Hooks block the developer’s workflow (git commit,
    git push). Slow hooks will be ignored or disabled. | Use fast linters (shellcheck)
    and only run tests on changed files, not the entire project.|'
