    \n你可以重新登录或  `.bash_profile` 使更改生效：\n\n```bash\n$ ./.bash_profile\n$prompt\nramesh@dev-db\
    \ [13:02:13]>\n```\n\n## Hack 40. 使用 tput 修改提示符颜色\n\n你也可以使用 `tput` 更改 `PS1` 提示符的颜色，如下：\n\
