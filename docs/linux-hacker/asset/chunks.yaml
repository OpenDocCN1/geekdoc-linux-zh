  trans: "\n以下 shell 脚本解释了如何从 `employee.txt` 文件读取特定字段。\n\n```bash\n$ vi read-employees.sh\n\
    \n#!/bin/bash\n\nIFS=:\n\necho \"Employee Names:\"\n\necho \"---------------\"\
    \n\nwhile read name empid dept\ndo\n  echo \"$name is part of $dept department\"\
    \ndone < ~/employees.txt\n```\n\n为 shell 脚本分配执行权限并运行它。\n\n```bash\n$ chmod u+x\
    \ read-employees.sh\n$ ./read-employees.sh\n```\n\n```\nEmployee Names:\n---------------\n\
    Emma Thomas is part of Marketing department\nAlex Jason is part of Sales department\n\
    Madison Randy is part of Product Development department\nSanjay Gupta is part\
    \ of Support department\nNisha Singh is part of Sales department\n```\n\n# 第 12\
    \ 章：系统监控与性能\n\n## 技巧 89：free 命令\n\n`free` 命令显示关于系统物理内存（RAM）和交换内存（swap）的所有必要信息。\n\
    \n语法：`free [options]`\n\n### 我的系统总内存是多少？\n\n在下面的示例中，该系统的总物理内存为 1GB。下方显示的数值为 KB。\n\
    \n```bash\n# free\n              total        used        free      shared  buffers/cache\
    \   cached\nMem:       10346241 1066996    2166688 117956      27928     174136\
    \      615892\nSwap:       2031608           0       2031608\n```\n\n### 我的系统包含\
    \ RAM 和 Swap 的总内存是多少？\n\n在以下命令中：\n- 选项 `-m` 以 MB 显示数值。\n- 选项 `-t` 显示“Total”行，它是物理内存和交换内存数值的和。\n\
    - 选项 `-o` 用于隐藏上述示例中的 buffers/cache 行。\n\n```bash\n# free -mto\n              \
    \ total        used        free\nshared  buffers  cache   cached\nMem:       \
    \   1010         983           0\nSwap:          1983         983           0\n\
    Total:          2994        1966           0\n```\n\n## 技巧 90：Top 命令\n\n`top`\
    \ 命令显示系统各种性能指标的实时信息，例如 CPU 负载、内存使用、进程列表等。\n\n语法：`top [options]`\n\n### 如何查看我的当前系统状态包括\
    \ CPU 使用率？\n\n从命令行中不带任何选项执行 `top`，这将显示所示的输出。`top` 命令的输出将持续显示实时值，直到你按下“Control\
    \ + c”或 `q` 退出输出。\n\n```bash\n#top\ntop - 13:10:13 up 171 days, 20:21, 3 users,\
    \ load average: 0.01, 0.05, 0.00\nTasks: 194 total, 1 running, 193 sleeping, 0\
    \ stopped, 0 zombie\nCpu(s): 0.6% us, 0.7% sy, 0.0% ni, 98.7% id, 0.0% wa, 0.0%\
    \ hi, 0.0% si\nMem: 1034624k total, 1007420k used, 27204k free, 174540k buffers\n\
    Swap: 2031608k total, 0k used, 2031608k free, 615904k cached\nPID USER PR NI VIRT\
    \ RES\n11912 apache 15 0 31828\n19299 oracle 19 0 279m\n11398 jsmith 16 0 107m\n\
    SHR S %CPU %MEM TIME+ COMMAND\n13m 3916 S10.2 0:46.35 httpd\n18m 17m S10.2 0:00.03\
    \ oracle\n28m 6404 S00.4 0:03.07 perl\n```\n\n### 如何解读上述所示的 top 命令输出？\n\n- 第 1\
    \ 行“top”，表示系统已运行了 171 天。\n- 第二行“Tasks”，显示进程总数，以及运行、睡眠、停止和僵尸（zombie）进程数量的细分。\n\
    - 第 3 行“Cpu(s)”显示系统当前的 CPU 利用率。在例例中，CPU 空闲率为 98.7%。\n- 第 4 行“Mem”和第 5 行“Swap”提供内存信息。这与\
    \ `free` 命令提供的信息相同。\n- 剩余行显示系统上所有的活动进程，默认按 CPU 使用率（`%CPU` 列）排序。即 CPU 密集型最核心的进程默认会显示在最上方。\n\
    \n`top` 命令有多个命令行选项和交互式选项可用。让我们来复习一下 `top` 命令的几个基本选项。\n\n### 如何识别内存使用率最密集的进程？\n\
    \n当 `top` 命令的输出显示时，按下 `F`，它会显示以下消息并显示所有可用排序字段，按下 `n`（用于按内存排序进程）并按回车。这将按内存使用情况对顶部输出中的进程排序。\n\
    \n`Current Sort Field: K for window 1:Def`\n`通过字段字母选择排序字段，按其他键返回`\n\n### 如何向顶部输出中添加额外字段（例如\
    \ CPU 时间）？\n\n当 `top` 命令运行时，按下 `f`，它会显示以下消息并显示所有可用显示字段，按下 `l`，将 CPU 时间添加到顶部输出的显示列中。\n\
    \n`Current Fields: AEHIOQTWKNMbcdfgjplrsuvyzX for window 1:Def`\n`通过字段字母切换字段，按其他键返回`\n\
    \n### 如何获取运行进程的完整路径名和参数？\n\n当 `top` 命令运行时，按下 `c`，它将在 `COMMAND` 列中显示运行进程的完整路径名。它不再只显示进程名称，而是显示完整路径。\n\
    \n"
- fmt: "\nAjay Kumar Tiwari\n\n# Hack 92. Df Command\n\n`df` command (disk free) displays\
    \ the amount of total and free disk space available on the mounted filesystems.\n\
    \nSyntax: `df [options] [name]`\n\n### How much GB of disk space is free on my\
    \ system?\n\nUse `df -h` as shown below. Option `-h` displays the values in human\
    \ readable format (for example: K for Kb, M for Mb and G for Gb). In the sample\
    \ output below, `/` filesystem has 17GB of disk space available and `/home/user`\
    \ filesystem has 70GB available.\n\n```bash\ndf -h\nFilesystem Size Used Avail\
    \ Use% Mounted on\n/dev/sda1 64G 44G 17G 73% /\n/dev/sdb1 137G 67G 70G 49% /home/user\n\
    ```\n\n### What type of filesystem do I have on my system?\n\nOption `-T` will\
    \ display the information about the filesystem Type. In this example `/` and `/home/user`\
    \ filesystems are `ext2`. Option `-a` will display all the filesystems, including\
    \ the 0 size special filesystem used by the system.\n\n```bash\ndf -Tha\nFilesystem\
    \ Type Size Used Avail Use% Mounted on\n/dev/sda1 ext2 64G 44G 17G 73% /\n/dev/sdb1\
    \ ext2 137G 67G 70G 49% /home/user\nnone proc - /proc\nnone sysfs - /sys\nnone\
    \ devpts - /dev/pts\nnone tmpfs 2.0G 0 2.0G 0% /dev/shm\n```\n\n# Hack 93. Kill\
    \ Command\n\n`kill` command can be used to terminate a running process. Typically\
    \ this command is used to kill processes that are hanging and not responding.\n\
    \nSyntax: `kill [options] [pids|commands]`\n\n### How to kill a hanging process?\n\
    \nFirst, identify the process id of the particular process that you would like\
    \ kill using the `ps` command. Once you know the process id, pass it as a parameter\
    \ to the `kill` command. The example below shows how to kill the hanging apache\
    \ httpd process. Please note that typically you should use `apachectl stop` to\
    \ stop apache.\n\n```bash\nps aux | grep httpd\nUSER PID %CPU %MEM VSZ RSS TTY\
    \ STAT START TIME COMMAND\napache 31186 0.01.6 23736 17556 ?S Jul26 0:40 /usr/local/apache2/bin/httpd\n\
    apache 31187 0.01.3 20640 14444 ?S Jul26 0:37 /usr/local/apache2/bin/httpd\nkill\
    \ 31186 31187\n```\n\nPlease note that the above command tries to terminate the\
    \ process graciously by sending a signal called `SIGTERM`. If the process does\
    \ not get terminated, you can forcefully terminate the process by passing a signal\
    \ called `SIGKILL`, using the option `-9` as shown below. You should either be\
    \ the owner of the process or a privileged user to kill a process.\n\n```bash\n\
    kill -9 31186 31187\n```\n\nAnother way to kill multiple processes easily is by\
    \ adding the following two functions to the `.bash_profile`.\n\n```bash\nfunction\
    \ psgrep ()\n{\n  ps aux | grep \"$1\" | grep -v 'grep'\n}\n\nfunction psterm\
    \ ()\n{\n  [ ${#} -eq 0 ] && echo \"usage: $FUNCNAME STRING\" && return 0\n  local\
    \ pid\n  pid=$(ps ax | grep \"$1\" | grep -v grep | awk '{ print $1 }')\n  echo\
    \ -e \"terminating '$1' / process(es):\\n$pid\"\n  kill -SIGTERM $pid\n}\n```\n\
    \nNow do the following, to identify and kill all httpd processes.\n\n```bash\n\
    psgrep http\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\napache 31186\
    \ 0.01.6 23736 17556 ?S Jul26 0:40 /usr/local/apache2/bin/httpd\napache 31187\
    \ 0.01.3 20640 14444 ?S Jul26 0:37 /usr/local/apache2/bin/httpd\n\npsterm httpd\n\
    terminating 'httpd' / process(es):\n31186\n31187\n```\n\n# Hack 94. Du Command\n\
    \n`du` command (disk usage) will print the file space usage for a particular directory\
    \ and its subdirectories.\n\n### How much space is taken by my home directory\
    \ and all its subdirectories?\n\nIn the following example, option `-s` stands\
    \ for summary only. i.e it displays only the total size of `/home/jsmith` and\
    \ not the individual sizes of all the subdirectories inside the `/home/jsmith`.\
    \ Option `-h` displays the information in human readable format. i.e K for KB,\
    \ M for MB and G for GB. The `~` indicates the user directory. This command is\
    \ same as `du -sh /home/jsmith`.\n\n```bash\ndu -sh ~\n```\n\nTo get the subdirectories\
    \ under `/home/jsmith` listed, execute the above command without the `s` option.\n\
    \n# Hack 95. lsof commands.\n\n`lsof` stands for `ls open files`, which will list\
    \ all the open files in the system. The open files include network connection,\
    \ devices and directories. The output of `lsof` command will have the following\
    \ columns:\n- `COMMAND`: process name\n- `PID`: process ID\n- `USER`: Username\n\
    - `FD`: file descriptor\n- `TYPE`: type of the file\n- `DEVICE`: device number\n\
    - `SIZE`: file size\n- `NODE`: full path of the file\n\nView all open files of\
    \ the system. Execute `lsof` command without any parameter as shown below.\n\n\
    ```bash\nlsof | more\nCOMMAND PID USER FD TYPE DEVICE SIZE NODE NAME\ninit 1 root\
    \ cwd - 140962 /\ninit 1 root dir - 140962 /\ninit 1 root txt REG - 32684 98301\
    \ /sbin/init\ninit 1 root mem REG - 106397 166798 /lib/ld-2.3.4.so\ninit 1 root\
    \ mem REG - 145482 166799 /lib/tls/libc-2.3.4.so\ninit 1 root mem REG - 53736\
    \ 163964 /lib/libsepol.1\ninit 1 root mem REG - 56328 166811 /lib/libselinux.1\n\
    init 1 root FIFO - 13972 /dev/init\nmigration 2 root cwd dir - 140962 /\n...\n\
    ```\n\n```bash\nlsof | wc -l\n```\n\n### View open files by a specific user\n\n\
    Use `lsof -u` option to display all the files opened by a specific user.\n\n```bash\n\
    lsof -u ramesh\nvi 7190 ramesh txt REG 474608 475196 /bin/vi\nsshd 7163 ramesh\
    \ ipv6 150888 2631 TCP dev-db:ssh->abc-12-12-12.socal.rr.com:2631 (ESTABLISHED)\n\
    ```\n\nA system administrator can use this command to get some idea on what users\
    \ are executing on the system.\n\n### List Users of a particular file\n\nIf you\
    \ like to view all the users who are using a particular file, use `lsof` as shown\
    \ below. In this example, it displays all users who are currently using `vi`.\n\
    \n```bash\nlsof /bin/vi\nCOMMAND PID USER FD TYPE DEVICE SIZE NODE NAME\nvi 7258\
    \ root txt REG 474608 475196 /bin/vi\nvi 7300 ramesh txt REG 474608 475196 /bin/vi\n\
    ```\n\n# Hack 96. Sar Command\n\n`sar` commands comes with the `sysstat` package.\
    \ Make sure `sysstat` is installed. If you don’t have sar installed on your system,\
    \ get it from Sysstat project. `sar` is an excellent monitoring tool that displays\
    \ performance data of pretty much every resource of the system including CPU,\
    \ memory, IO, paging, networking, interrupts etc.\n\n`sar` Collects, Reports (displays)\
    \ and Saves the performance data. Let us look at all the three aspects separately.\n\
    \n### Sadc - System activity data collector\n\n`/usr/lib/sadc` (System activity\
    \ data collector) command collects the system data at a specified time interval.\
    \ This uses the daily activity data file that is located under `/var/log/sa/sa[dd]`,\
    \ where `dd` is the current day.\n\n### Sa1 shell-script\n\n`/usr/lib/sa1` in\
    \ turn calls the `/usr/lib/sadc`. `sa1` is invoked from the crontab as shown below.\
    \ Run this every 5 minutes or 15 minutes depending on your need. I prefer to schedule\
    \ it for every 5 minutes in the cron tab as shown below.\n\n```bash\n*/5 * * *\
    \ * root /usr/lib/sa/sa1 1 1\n```\n\n### Sa2 shell-script\n\n`/usr/lib/sa2` is\
    \ a shell script that will write a daily report in the `/var/log/sa/sa[dd]` file,\
    \ where `dd` is the current day. Invoke `sa2` from the crontab once a day at midnight.\n\
    \n```bash\n59 23 * * * root /usr/lib/sa/sa2 -A\n```\n\nNote: `/etc/cron.d/sysstat`\
    \ files comes with the `sysstat` package that includes some default value for\
    \ the `sa1` and `sa2`, which you can change accordingly.\n\n### Display CPU Statistics\
    \ using Sar Command\n\n```bash\nsar -u\nLinux 2.6.9-42.ELsmp (dev-db)\n12:00:01\
    \ AM CPU %user %nice\n12:05:01 AM all 3.700.00\n12:10:01 AM all 4.590.00\n12:15:01\
    \ AM all 3.900.00\n12:20:01 AM all 4.060.00\n12:25:01 AM all 3.890.00\n12:30:01\
    \ AM all 3.890.00\nSkipped..\n\nAverage: all\n```\n"
