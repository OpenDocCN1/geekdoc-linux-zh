    \ 9: System Administration Tasks\n\n## Hack 65. Partition using fdisk\n\nAfter\
    \ you’ve installed brand new disks on your server, you have to use tools like\
    \ `fdisk` to partition it accordingly.\n\nFollowing are the 5 typical actions\
    \ (commands) that you can execute inside `fdisk`:\n\n* `n` – New Partition creation\n\
    * `d` – Delete an existing partition\n* `p` - Print Partition Table\n* `w` – Write\
    \ the changes to the partition table. i.e save.\n* `q` – Quit the `fdisk` utility\n\
    \n### Create a partition\n\nIn the following example, I created a `/dev/sda1`\
    \ primary partition.\n\n```bash\n#fdisk /dev/sda\n```\nDevice contains neither\
    \ a valid DOS partition table, nor Sun, SGI or OSF disklabel Building a new DOS\
    \ disklabel. Changes will remain in memory only, until you decide to write them.\
    \ After that, of course, the previous content won't be recoverable. The number\
    \ of cylinders for this disk is set to 34893. There is nothing wrong with that,\
    \ but this is larger than 1024, and could in certain setups cause problems with:\n\
    \n1) software that runs at boot time (e.g., old versions of `LILO`)\n2) booting\
    \ and partitioning software from other OSs (e.g., `DOS FDISK`, `OS/2 FDISK`)\n\
    \nWarning: invalid flag 0x0000 of partition table 4 will be corrected by `w`(rite)\n\
    \n```bash\nCommand (m for help):p\n```\nDisk `/dev/sda`: 287.0 GB, 287005343744\
    \ bytes\n255 heads, 63 sectors/track, 34893 cylinders\nUnits = cylinders of 16065\
    \ * 512 = 8225280 bytes\nDevice Boot | Start | End | Blocks | Id | System\n\n\
    ```bash\nCommand (m for help):n\n```\nCommand action\n  extended\n  primary partition\
    \ (1-4)\n\n```bash\np\n```\nPartition number (1-4):1\nFirst cylinder (1-34893,\
    \ default 1):\nUsing default value 1\nLast cylinder or +size or +sizeM or +sizeK\
    \ (1-34893, default 34893):\nUsing default value 34893\n\n```bash\nCommand (m\
    \ for help):w\n```\nThe partition table has been altered! Calling `ioctl()` to\
    \ re-read partition table. Syncing disks.\n\n### Verify that the partition got\
    \ created successfully\n\n```bash\n#fdisk /dev/sda\n```\nThe number of cylinders\
    \ for this disk is set to 34893. There is nothing wrong with that, but this is\
    \ larger than 1024, and could in certain setups cause problems with:\n\n1) software\
    \ that runs at boot time (e.g., old versions of `LILO`)\n2) booting and partitioning\
    \ software from other OSs (e.g., `DOS FDISK`, `OS/2 FDISK`)\n\n```bash\nCommand\
    \ (m for help): p\n```\nDisk `/dev/sda`: 287.0 GB, 287005343744 bytes\n255 heads,\
    \ 63 sectors/track, 34893 cylinders\nUnits = cylinders of 16065 * 512 = 8225280\
    \ bytes\nDevice Boot | /dev/sda1 | Start | 1 | End | 34893 | Blocks | 280277991\
    \ | Id | 83 | System | Linux\n\n```bash\nCommand (m for help):q\n```\n\n## Hack\
    \ 66. Format a partition using mke2fsk\n\nAfter partitioning the disks, it is\
    \ still not ready for usage, as we need to format the disk. At this stage, if\
    \ you try to view the disk information, it will give the following error message\
    \ indicating that no valid superblock is present.\n\n```bash\n#tune2fs -l /dev/sda1\n\
    ```\ntune2fs 1.35 (28-Feb-2004)\ntune2fs: Bad magic number in super-block while\
    \ trying to open `/dev/sda1`\nCouldn't find valid filesystem superblock.\n\nTo\
    \ format the disk, use `mke2fs` as shown below.\n\n```bash\n#mke2fs /dev/sda1\n\
    ```\nYou can also pass the following optional parameter to the `mke2fs`:\n\n*\
    \ `-m 0` : reserved-blocks-percentage – This indicates the percentage of the filesystem\
    \ blocks reserved for the root user. Default is 5%. In the following example,\
    \ it is set to 0.\n* `-b 4096` : block-size specified in bytes. Valid values are\
    \ 1024, 2048 and 4096 bytes per block.\n\n```bash\n#mke2fs -m 0 -b 4096 /dev/sda1\n\
    ```\nmke2fs 1.35 (28-Feb-2004)\nFilesystem label=\nOS type: Linux\nBlock size=4096\
    \ (log=2)\nFragment size=4096 (log=2)\n205344 inodes, 70069497 blocks\n0 blocks\
    \ (0.00%) reserved for the super user\nFirst data block=0\nMaximum filesystem\
    \ blocks=71303168\n2139 block groups\n32768 blocks per group, 32768 fragments\
    \ per group\n96 inodes per group\nSuperblock backups stored on blocks: 32768,\
    \ 98304, 163840, 229376, 294912, 819200, 884736, 1605632, 265432\nThis filesystem\
    \ will be automatically checked every 32 days, whichever comes first.\n\n## Hack\
    \ 67. Mount the partition\n\nAfter creating a partition and formatting it, first\
    \ create a directory where the partition should be mounted.\n\n```bash\n# mkdir\
    \ /home/database\n```\n\nAdd the following line to `/etc/fstab` and reboot the\
    \ system for the swap to take effect:\n\n```bash\n/dev/sda1 /home/database ext3\
    \ defaults 0 0\n```\n\nTo view the filesystem information, use `tune2fs` as shown\
    \ below:\n\n```bash\n#tune2fs -l /dev/sda1\n```\ntune2fs 1.35 (28-Feb-2004)\n\
    ... (details omitted) ...\n\nFor example, if you want to change the filesystem\
    \ volume name, you can do it as shown below:\n\n```bash\n#tune2fs -L database\
    \ /dev/sda1\n```\n\n## Hack 69. Create a swap file system\n\nCreate a file for\
    \ swap usage as shown below:\n\n```bash\n#dd if=/dev/zero of=/home/swap-fs bs=1M\
    \ count=512\n```\n512+0 records in\n512+0 records out\n\n```bash\n# ls -l /home/swap-fs\n\
    ```\n-rw-r--r-- 1 root root 536870912 Jan 2 23:13\n\nUse `mkswap` to setup a Linux\
    \ swap area in the `/home/swap-fs` file that was created above.\n\n```bash\n#mkswap\
    \ /home/swap-fs\n```\nSetting up swapspace version 1, size = 536866 kB\n\nOnce\
    \ the file is created and has been setup for Linux swap area, it is time to enable\
    \ the swap using `swapon` as shown below:\n\n```bash\n#swapon /home/swap-fs\n\
    ```\n\nAdd the following line to `/etc/fstab` and reboot the system for the swap\
    \ to take into effect:\n\n```bash\n/home/swap-fs swap swap defaults 0 0\n```\n\
    \n## Hack 70. Create a new user\n\nAdd a new user – Basic method\n\nSpecify only\
    \ the user name.\n\n```bash\n# useradd jsmith\n```\n\nAdd a new user with additional\
    \ Parameter\n\nYou can also specify the following parameter to the `useradd`:\n"
