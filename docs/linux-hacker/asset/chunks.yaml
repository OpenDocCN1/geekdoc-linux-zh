    ## Hack 22. Xargs 命令


    `xargs` 是一个非常强大的命令，它可以接收命令的输出并将其作为另一个命令的参数。以下是关于如何使用 `xargs` 的一些实用示例。


    1. 当你尝试使用 `rm` 删除过的文件时，可能会遇到错误信息：`/bin/rm` Argument list too long – Linux。使用 `xargs`
    可以避免这个问题。

    ```bash

    find ~ -name ''*.log’ -print0 | xargs -0 rm -f

    ```

    2. 获取 `/etc/` 目录下所有 `*.conf` 列表。有多种方法可以获得相同的结果。以下示例仅用于演示 `xargs` 的用法。在本示例中，`find`
    命令的输出通过 `xargs` 逐个传递给 `ls –l`。

    ![](img/00032.jpeg)Linux 技巧

    ```bash

    # find /etc -name "*.conf" | xargs ls –l

    ```

    3. 如果你有一个包含 URL 列表的文件想要下载，可以如下所示使用 `xargs`。

    ```bash

    # cat url-list.txt | xargs wget –c

    ```

    4. 找到所有的 `jpg` 图片并将其归档。

    ```bash

    # find / -name *.jpg -type f -print | xargs tar -cvzf images.tar.gz

