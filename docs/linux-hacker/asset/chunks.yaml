- fmt: "\nThe lines below ---, indicates the changes happened to the second file in\
    \ the `diff` command (i.e `name_list_new.txt`). The lines that belong to the first\
    \ file starts with `<` and the lines of second file starts with `>`.\n\n```bash\n\
    #diff -w name_list.txt name_list_new.txt\n2c2,3\n< John Doe\n---\n> John M Doe\n\
    > Jason Bourne\n> Ajay Kumar Tiwari\n```\n\n## 28. Display total connect time\
    \ of users\n`ac` command will display the statistics about the user’s connect\
    \ time.\n\n### Connect time for the current logged in user\nWith the option `-d`,\
    \ it will break down the output for the individual days. In this example, I’ve\
    \ been logged in to the system for more than 6 hours today. On Dec 1st, I was\
    \ logged in for about 1 hour.\n\n```bash\n$ac -d\n```\nDec 1 | Dec 2 | Dec 3 |\
    \ Dec 4 | Today\ntotal: 1.08 | 0.99 | 3.39 | 4.50 | 6.10\n\n### Connect time for\
    \ all the users\nTo display connect time for all the users use `-p` as shown below.\
    \ Please note that this indicates the cumulative connect time for the individual\
    \ users.\n\n```bash\n$ac -p\n```\njohn: 3.64\nmadison: 0.06\nsanjay: 88.17\nnisha:\
    \ 105.92\nramesh: total 309.21\nAjay Kumar Tiwari: 111.42\n\n### Connect time\
    \ for a specific user\nTo get a connect time report for a specific user, execute\
    \ the following:\n\n```bash\n$ac -d sanjay\n```\nJul 2 | Aug 25 | Sep 3 | Sep\
    \ 4 | Dec 24 | Dec 29 | Today\ntotal: 12.85 | 5.05 | 1.03 | 5.37 | 8.15 | 1.42\
    \ | 2.95\n\n## Chapter 5: PS1, PS2, PS3, PS4 and PROMPT_COMMAND\n\n### 29. PS1\
    \ - Default Interaction Prompt\nThe default interactive prompt on your Linux can\
    \ be modified as shown below to something useful and informative. In the following\
    \ example, the default `PS1` was `\\s-\\v\\$`, which displays the shell name and\
    \ the version number. Let us change this default behavior to display the username,\
    \ hostname and current working directory name as shown below.\n\n```bash\n-bash-3.2$\n\
    export PS1=\"\\u@\\h \\w> \"\nramesh@dev-db ~> cd /etc/mail\nramesh@dev-db /etc/mail>\n\
    ```\n[Note: Prompt changed to \"username@hostname current-dir>\" format]\n\nFollowing\
    \ `PS1` codes are used in this example:\n- `\\u` – Username\n- `\\h` – Hostname\n\
    - `\\w` - Full pathname of current directory. Please note that when you are in\
    \ the home directory, this will display only `~` as shown above\n\nNote that there\
    \ is a space at the end in the value of `PS1`. Personally, I prefer a space at\
    \ the end of the prompt for better readability.\n\nMake this setting permanent\
    \ by adding `export PS1=\"\\u@\\h \\w> \"` to either `.bash_profile` (or) `.bashrc`\
    \ as shown below.\n\n```bash\nramesh@dev-db ~> vi ~/.bash_profile\nramesh@dev-db\
    \ ~> vi ~/.bashrc\n```\n[Note: Add `export PS1=\"\\u@\\h \\w> \"` to one of the\
    \ above files]\n\nRefer to the next chapter for several practical examples of\
    \ `PS1` usage in detail.\n\n### 30. PS2 - Continuation Interactive Prompt\nA very\
    \ long command can be broken down to multiple lines by giving `\\` at the end\
    \ of the line. The default interactive prompt for a multi-line command is `\"\
    > \"`. Let us change this default behavior to `\"continue->\"` by using `PS2`\
    \ environment variable as shown below.\n\n```bash\nramesh@dev-db ~>myisamchk --silent\
    \ --force --fast --\nupdate-state \\\n>--key_buffer_size=512M --sort_buffer_size=512M\
    \ \\\n>--read_buffer_size=4M --write_buffer_size=4M \\\n>/var/lib/mysql/bugs/*.MYI\n\
    ```\n[Note: This uses the default \">\" for continuation prompt]\n\n```bash\n\
    ramesh@dev-db ~>export PS2=\"continue-> \"\nramesh@dev-db ~>myisamchk --silent\
    \ --force --fast --\nupdate-state \\\ncontinue->--key_buffer_size=512M --\nsort_buffer_size=512M\
    \ \\\ncontinue->--read_buffer_size=4M --write_buffer_size=4M\n\\\ncontinue->/var/lib/mysql/bugs/*.MYI\n\
    ```\n[Note: This uses the modified \"continue-> \" for continuation prompt]\n\n\
    I found it very helpful and easy to read, when I break my long commands into multiple\
    \ lines using `\\`. I have also seen others who don’t to break-up commands.\n\n\
    ### 31. PS3 - Prompt used by “select” inside shell script\nYou can define a custom\
    \ prompt for the `select` loop inside a shell script, using the `PS3` environment\
    \ variable, as explained below.\n\nShell script and output WITHOUT PS3:\n```bash\n\
    ramesh@dev-db ~>cat ps3\nselect i in mon wed exit\ndo\ncase $i in\nmon) echo \"\
    Monday\";\ntue) echo \"Tuesday\";\nwed) echo \"Wednesday\";\nexit) exit;;\nesac\n\
    done\nramesh@dev-db ~>./ps3.sh\n1) mon\n2) tue\n3) wed\n4) exit#? \n```\n[Note:\
    \ This displays the default \"#?\" for select command prompt]\n\nShell script\
    \ and output WITH PS3:\n```bash\nramesh@dev-db ~>cat ps3\nPS3=\"Select a day (1-4):\
    \ \"\nselect i in mon wed exit\ndo\ncase $i in\nmon) echo \"Monday\";\ntue) echo\
    \ \"Tuesday\";\nwed) echo \"Wednesday\";\nexit) exit;;\nesac\ndone\nramesh@dev-db\
    \ ~>./ps3.sh\n1) mon\n2) tue\n3) wed\n4) exitSelect a day (1-4): 1Monday\nSelect\
    \ a day (1-4): 4\n```\n[Note: This displays the modified \"Select a day (1-4):\"\
    \ for select prompt]\n\n### 32. PS4 - Used by “set -x” to prefix output\nThe `PS4`\
    \ shell variable defines the prompt that gets displayed when you execute a shell\
    \ script in debug mode as shown below.\n\nShell script and output WITHOUT PS4:\n\
    ```bash\nramesh@dev-db ~>cat ps4\nset -x\necho \"PS4 demo script\"\nls -l /etc/\
    \ | wc -l\ndu -sh ~\nramesh@dev-db ~>./ps4.sh\n++ echo 'PS4 demo script'\nPS4\
    \ script\n++ ls -l /etc/\n++ wc -l\n++ du -sh /home/ramesh\n```\n[Note: This displays\
    \ the default \"++\" while tracing output using `set -x`]\n\nShell script and\
    \ output WITH PS4:\nThe `PS4` defined below in `ps4.sh` has the following two\
    \ codes:\n- `$0` - indicates the name of script\n- `$LINENO` - displays the current\
    \ line number within the script\n\n```bash\nramesh@dev-db ~>cat ps4\nexport PS4='$0.$LINENO+\
    \ '\nset -x\necho \"PS4 demo script\"\nls -l /etc/ | wc -l\ndu -sh ~\nramesh@dev-db\
    \ ~>./ps4.sh\n../ps4.sh.3+ echo 'PS4 demo script'\nPS4 script\n../ps4.sh.4+ ls\
    \ -l /etc/\n../ps4.sh.4+ wc -l\n../ps4.sh.5+ du -sh /home/ramesh\n```\n[Note:\
    \ This displays the modified \"{script-name}.{line-number}+\" while tracing the\
    \ output using `set -x`]\n\n### 33. PROMPT_COMMAND\nBash shell executes the content\
    \ of `PROMPT_COMMAND` just before displaying the `PS1` variable.\n\n```bash\n\
    ramesh-dev-db ~>export PROMPT_COMMAND=\"date +%k:%m:%S\"\n22:08:42\nramesh-dev-db\
    \ ~>\n```\n[Note: This displays the `PROMPT_COMMAND` and `PS1` output on different\
    \ lines]\n\nIf you want to display the value of `PROMPT_COMMAND` in the same line\
    \ as the `PS1`, use the `echo -n` as shown below.\n\n```bash\nramesh-dev-db ~>export\
    \ PROMPT_COMMAND=\"echo -n [$(date +k:%m:%S)]\"\n[22:08:51]\nramesh-dev-db ~>\n\
    ```\n[Note: This displays the `PROMPT_COMMAND` and `PS1` output on the same line]\n\
    \n## Chapter 6: Colorful and Functional Shell Prompt Using PS1\n\n### 34. Display\
    \ username, hostname and basename of directory in the prompt\nThe `PS1` in this\
    \ example displays following three information in the prompt:\n- `\\u` – Username\n\
    - `\\h` – Hostname\n- `\\W` – Base name of the current working directory\n\n```bash\n\
    -bash-3.2$export PS1=\"\\u@\\h \\W> \"\nramesh@dev-db ~> cd /etc/mail\nramesh@dev-db\
    \ mail>\n```\n\n### 35. Display current time in the prompt\nIn the `PS1` environment\
    \ variable, you can directly execute any Linux command, by specifying in the format\
    \ `$(linux_command)`. In the following example, the command `$(date)` is executed\
    \ to display the current time inside the prompt.\n\n```bash\nramesh-dev-db ~>export\
    \ PS1=\"\\u@\\h [\\$(date +k:%m:%S)]> \"\nramesh@dev-db [11:09:56]>\n```\n\nYou\
    \ can also use `\\t` to display the current time in the `hh:mm:ss` format as shown\
    \ below:\n\n```bash\nramesh-dev-db ~>export PS1=\"\\u@\\h [\\t]> \"\nramesh@dev-db\
    \ [12:42:55]>\n```\n"
