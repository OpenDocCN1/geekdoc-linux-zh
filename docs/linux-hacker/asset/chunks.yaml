    ## Hack 46. Password Protection Zip files


    Pass the option `-P` to the `zip` command to assign a password to the zip file.


    ```bash

    zip -P mysecure var-log-protected.zip /var/log/*

    ```

    The above option is good if you are using the command inside a shell-script for
    background jobs. However, when you are performing the compression interactively
    on the command-line, don’t want the password to be visible in the history. So,
    use the option `-e` as shown below.


    ```bash

    zip -e var-log-protected.zip /var/log/*

    ```

