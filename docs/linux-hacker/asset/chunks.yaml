    $ac -d sanjay\n```\nJul 2 | Aug 25 | Sep 3 | Sep 4 | Dec 24 | Dec 29 | Today\n\
    total: 12.85 | 5.05 | 1.03 | 5.37 | 8.15 | 1.42 | 2.95\n\n```\n\n## 第 5 章：PS1,\
    \ PS2, PS3, PS4 和 PROMPT_COMMAND\n\n### 29. PS1 - 默认交互提示符\n你 Linux 上的默认交互提示符可以像下面这样修改为更有用且包含信息的内容。在以下示例中，默认的\
    \ `PS1` 为 `\\s-\\v\\$`，它显示 shell 名称和版本号。让我们将此默认行为更改为所示的用户名、主机名和当前工作目录名称。\n\n```bash\n\
