- fmt: "\n3. To come back to the localhost temporarily, type the escape character\
    \ `~` and `Control-Z`.\n\nWhen you type `~` you will not see that immediately\
    \ on the screen until you press `<Control-Z>` and press enter. So, on the `remotehost`\
    \ in a new line enter the following key strokes for the below to work: `~<Control-Z>`\n\
