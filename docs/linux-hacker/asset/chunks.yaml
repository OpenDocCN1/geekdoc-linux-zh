    \ Hack\n Ajay Kumar Tiwari\n\n#### ssh-copy-id 的三个不之处\n\n以下是 `ssh-copy-id` 的一些小不便：\n\
    \n1. **默认公钥**：`ssh-copy-id` 使用 `~/.ssh/identity.pub` 作为默认公钥文件（即当未向 `-i` 传递值时）。我希望它使用\
    \ `id_dsa.pub`、`id_rsa.pub` 或 `identity.pub` 作为默认密钥。即如果存在其中任何一个就应该复制到远程主机。\n2.\
