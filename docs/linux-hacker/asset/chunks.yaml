  trans: "\n\nAjay Kumar Tiwari\n\n# 技巧 92. Df 命令\n\n`df` 命令（disk free）用于显示挂载文件系统上可用的总磁盘空间和可用空间。\n\
    \n语法：`df [options] [name]`\n\n### 我的系统有多少 GB 的可用磁盘空间？\n\n如下所示，使用 `df -h`。`-h`\
    \ 选项以人类可读的格式显示值（例如：K 代表 Kb，M 代表 Mb，G 代表 Gb）。在下方的示例输出中，`/` 文件系统有 17GB 可用磁盘空间，`/home/user`\
    \ 文件系统有 70GB 可用。\n\n```bash\ndf -h\nFilesystem Size Used Avail Use% Mounted on\n\
    /dev/sda1 64G 44G 17G 73% /\n/dev/sdb1 137G 67G 70G 49% /home/user\n```\n\n###\
    \ 我的系统中是什么种类型的文件系统？\n\n`-T` 选项将显示文件系统类型（Type）的信息。在此示例中，`/` 和 `/home/user` 文件系统是\
    \ `ext2`。`-a` 选项将显示所有文件系统，包括系统使用的大小为 0 的特殊文件系统。\n\n```bash\ndf -Tha\nFilesystem\
    \ Type Size Used Avail Use% Mounted on\n/dev/sda1 ext2 64G 44G 17G 73% /\n/dev/sdb1\
    \ ext2 137G 67G 70G 49% /home/user\nnone proc - /proc\nnone sysfs - /sys\nnone\
    \ devpts - /dev/pts\nnone tmpfs 2.0G 0 2.0G 0% /dev/shm\n```\n\n# 技巧 93. Kill\
    \ 命令\n\n`kill` 命令可用于终止正在运行的进程。通常，此命令用于杀死挂起且没有响应的进程。\n\n语法：`kill [options] [pids|commands]`\n\
    \n### 如何杀死挂起的进程？\n\n首先，使用 `ps` 命令识别你想要杀死的特定进程的进程 ID（PID）。一旦知道了进程 ID，将其作为参数传递给\
    \ `kill` 命令。下面的示例显示了如何杀死挂起的 apache httpd 进程。请注意，通常你应该使用 `apachectl stop` 来停止 apache。\n\
    \n```bash\nps aux | grep httpd\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME\
    \ COMMAND\napache 31186 0.01.6 23736 17556 ?S Jul26 0:40 /usr/local/apache2/bin/httpd\n\
    apache 31187 0.01.3 20640 14444 ?S Jul26 0:37 /usr/local/apache2/bin/httpd\nkill\
    \ 31186 31187\n```\n\n请注意，上述命令尝试通过发送名为 `SIGTERM` 的信号来优雅地终止进程。如果进程没有被终止，可以通过传递名为\
    \ `SIGKILL` 的信号来强制终止进程，如下所示使用 `-9` 选项。你必须是该进程的所有者或特权用户才能杀死进程。\n\n```bash\nkill\
    \ -9 31186 31187\n```\n\n轻松杀死多个进程的另一种方法是通过 `.bash_profile` 添加以下两个函数。\n\n```bash\n\
    function psgrep ()\n{\n  ps aux | grep \"$1\" | grep -v 'grep'\n}\n\nfunction\
    \ psterm ()\n{\n  [ ${#} -eq 0 ] && echo \"usage: $FUNCNAME STRING\" && return\
    \ 0\n  local pid\n  pid=$(ps ax | grep \"$1\" | grep -v grep | awk '{ print $1\
    \ }')\n  echo -e \"terminating '$1' / process(es):\\n$pid\"\n  kill -SIGTERM $pid\n\
    }\n```\n\n现在执行以下操作，识别并杀死所有的 httpd 进程。\n\n```bash\npsgrep http\nUSER PID %CPU %MEM\
    \ VSZ RSS TTY STAT START TIME COMMAND\napache 31186 0.01.6 23736 17556 ?S Jul26\
    \ 0:40 /usr/local/apache2/bin/httpd\napache 31187 0.01.3 20640 14444 ?S Jul26\
    \ 0:37 /usr/local/apache2/bin/httpd\n\npsterm httpd\nterminating 'httpd' / process(es):\n\
    31186\n31187\n```\n\n# 技巧 94. Du 命令\n\n`du` 命令（disk usage）将打印特定目录及其子目录的文件空间占用情况。\n\
    \n### 我的主目录及其所有子目录占用了多少空间？\n\n在接下来的示例中，`-s` 选项代表仅摘要（summary only）。即它只显示 `/home/jsmith`\
    \ 的总大小，而不显示 `/home/jsmith` 内部所有子目录的大小。`-h` 选项以人类可读的格式显示信息。即 K 代表 KB，M 代表 MB，G\
    \ 代表 GB。`~` 表示用户目录。此命令等同于 `du -sh /home/jsmith`。\n\n```bash\ndu -sh ~\n```\n\n\
    要列出 `/home/jsmith` 下的子目录，请在不带 `s` 选项的情况下执行上述命令。\n\n# 技巧 95. Lsof 命令\n\n`lsof`（list\
    \ open files）将列出特定目录及其子目录的文件空间占用情况（*注：此处原文逻辑可能有误，按字意翻译*）。*纠正：此处原文将 `du` 的描述与 `lsof`\
    \ 衔接错乱，以下根据上下文翻译*：\n\n重新梳理翻译：\n# 技巧 94. Du 命令\n\n`du` 命令（disk usage）将打印特定目录及其子目录的文件空间占用情况。\n\
    \n### 我的主目录及其所有子目录占用了多少空间？\n\n在接下来的示例中，`-s` 选项代表仅摘要（summary only）。即它只显示 `/home/jsmith`\
    \ 的总大小，而不显示 `/home/jsmith` 内部所有子目录的大小。`-h` 选项以人类可读的格式显示信息。即 K 代表 KB，M 代表 MB，G\
    \ 代表 GB。`~` 表示用户目录。此命令等同于 `du -sh /home/jsmith`。\n\n```bash\ndu -sh ~\n```\n\n\
    要列出 `/home/jsmith` 下的子目录，请在不带 `s` 选项的情况下执行上述命令。\n\n# 技巧 95. Lsof 命令\n\n`lsof`\
