    Following are different ways of displaying the current date and time in various
    formats:


    ```bash

    $ date

    Thu Jan 1 08:19:23 PST 2009


    $ date --date="now"

    Thu Jan 1 08:20:05 PST 2009


    $ date --date="today"

    Thu Jan 1 08:20:12 PST 2009


    $ date --date=''1970-01-01 00:00:01 UTC +5 hours'' +%s

    18001


    $ date ''+Current Date: %m/%d/%y%nCurrent Time:%H:%M:%S''

    Current Date: 01/01/09

    Current Time:08:21:41


    $ date +"%d-%m-%Y"

    01-01-2009


    $ date +"%d/%m/%Y"

    01/01/2009


    $ date +"%A,%B %d %Y"

    Thursday,January 01 2009

    ```


    Following are the different format options you can pass to the `date` command:


    - `%D` date (mm/dd/yy)

    - `%d` day of month (01..31)

    - `%m` month (01..12)

    - `%y` last two digits of year (00..99)

    - `%a` locale’s abbreviated weekday name (Sun..Sat)

    - `%A` locale’s full weekday name, variable length (Sunday..Saturday)

    - `%b` locale’s abbreviated month name (Jan..Dec)

    - `%B` locale’s full month name, variable length (January..December)

    - `%H` hour (00..23)

    - `%I` hour (01..12)

    - `%Y` year (1970…)


    ## 10. Display Past Date and Time


    Following are various ways to display a past date and time:


    ```bash

    $ date --date=''3 seconds ago''

    Thu Jan 1 08:27:00 PST 2009


    $ date --date="1 day ago"

    Wed Dec 31 08:27:13 PST 2008


    $ date --date="1 days ago"

    Wed Dec 31 08:27:18 PST 2008


    $ date --date="1 month ago"

    Mon Dec 1 08:27:23 PST 2008


    $ date --date="1 year ago"

    Tue Jan 1 08:27:28 PST 2008


    $ date --date="yesterday"

    Wed Dec 31 08:27:34 PST 2008


    $ date --date="10 months 2 day ago"

    Thu Feb 28 08:27:41 PST 2008

    ```


    ## 11. Display Future Date and Time


    Following examples shows how to display a future date and time.


    ```bash

    $ date

    Thu Jan 1 08:30:07 PST 2009


    $ date --date=''3 seconds''

    Thu Jan 1 08:30:12 PST 2009


    $ date --date=''4 hours''

    Thu Jan 1 12:30:17 PST 2009


    $ date --date=''tomorrow''

    Fri Jan 2 08:30:25 PST 2009


    $ date --date="1 day"

    Fri Jan 2 08:30:31 PST 2009


    $ date --date="1 days"

    Fri Jan 2 08:30:38 PST 2009


    $ date --date="2 days"

    Sat Jan 3 08:30:43 PST 2009


    $ date --date=''1 month''

    Sun Feb 1 08:30:48 PST 2009


    $ date --date=''1 week''

    Thu Jan 8 08:30:53 PST 2009


    $ date --date="2 months"

    Sun Mar 1 08:30:58 PST 2009


    $ date --date="2 years"

    Sat Jan 1 08:31:03 PST 2011


    $ date --date="next day"

    Fri Jan 2 08:31:10 PST 2009


    $ date --date="-1 days ago"

    Fri Jan 2 08:31:15 PST 2009


    $ date --date="this Wednesday"

    Wed Jan 7 00:00:00 PST 2009

    ```


    ## Chapter 3: SSH Client Commands


    ## 12. Identify SSH Client Version


    Sometimes it may be necessary to identify the SSH client that you are currently
    running and it’s corresponding version number. Use `ssh -V` to identify the version
    number. Please note that Linux comes with OpenSSH.


    The following example indicates that this particular system is using OpenSSH:

    ```bash

    $ ssh -V

    OpenSSH_3.9p1, OpenSSL 0.9.7

    ```


    The following example indicates that this particular system is using SSH2:

    ```bash

    $ ssh -V

    OpenSSH_2.2.9 (non-commercial version) x86_64-pc-linux-gnu

    ```


    ## 13. Login to Remote Host using SSH


    The First time you login to a remotehost from localhost, it will display the host
    key not found message and you can give “yes” to continue. The host key of the
    remote host will be added under your `.ssh` directory, as shown below.


    ```bash

    $ ssh -l jsmith remotehost.example.com

    Host key not found.

    Key fingerprint: SHA256:xxxxxxxx

    Are you sure you want to continue connecting (yes/no)?yes

    Host key saved to /home/jsmith/.ssh/known_hosts

    Host key for remotehost.example.com has been added.

    RSA key fingerprint xxxxxxxxx. May 26 2008 16:06:50

    jsmith@remotehost.example.com password:

    remotehost$

    ```


    The Second time when you login to the remote host from the localhost, it will
    prompt only for the password as the remote host key is already added to the known
    hosts list.


    ```bash

    $ ssh -l jsmith remotehost.example.com

    jsmith@remotehost.example.com password:

    remotehost$

    ```


    For some reason, if the host key of the remote host is changed after you logged
    in for the first time, you may get a warning message as shown below. This could
    be because of various reasons such as: Sysadmin upgraded/reinstalled the SSH server
    on the remote host, Someone is doing malicious activity etc. The best possible
    action to take before saying “yes” to the message below, is to call your sysadmin
    and identify why you got the host key changed message and verify whether it is
    the correct host key or not.


    ```bash

    $ ssh -l jsmith remotehost.example.com

    WARNING: HOST IDENTIFICATION HAS CHANGED!

    IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!

    Someone could be eavesdropping on you now (man-in-the-middle attack)!

    It is also possible that the host key has just changed. Please contact your system
    administrator. Add correct host key to /home/jsmith/.ssh/known_hosts to get rid
    of this message.

    Received server key’s fingerprint: SHA256:xxxxxxxx

    Are you sure you want to continue connecting (yes/no)?yes

    Do you want to change the host key on disk (yes/no)?yes

    Agent forwarding re-enabled.

    Host key saved to /home/jsmith/.ssh/known_hosts

    Host key for remotehost.example.com has been accepted by jsmith. May 26 2008 16:17:31

    jsmith@remotehost.example.coms password:

    remotehost$

    ```


    ## 14. Debug SSH Client Session


    Sometimes it is necessary to view debug messages to troubleshoot any SSH connection
    issues. pass `-v` (lowercase v) option to the `ssh` as shown below to view the
    ssh debug messages.


    Example without SSH client debug message:

    ```bash

    $ ssh -l jsmith remotehost.example.com

    warning: Connecting to remotehost.example.com failed: No address associated to
    the name

    ```


    Example with SSH client debug message:

    ```bash

    $ ssh -v -l jsmith remotehost.example.com

    debug: SshConfig/sshconfig.c:2838/ssh2_parse_config_ext: Metaconfig parsing stopped
    at line 3.

    debug: SshConfig/sshconfig.c:637/ssh_config_set_param_verbose: Setting variable
    ‘VerboseMode’ to ‘FALSE’.

    debug: SshConfig/sshconfig.c:3130/ssh_config_read_file_ext: Read 17 params from
    config file.

    debug: Ssh2/ssh2.c:1707/main: User config file not found, using defaults. (Looked
    for ‘/home/jsmith/.ssh2/ssh2_config’)

    debug: Connecting to remotehost.example.com, port 22… (SOCKS not used)

    ```


    ## 15. Toggle SSH Session using SSH Escape Character


    When you’ve logged on to the remotehost using `ssh` from the localhost, you may
    want to come back to the localhost to perform some activity and go back to remote
    host again. In this case, you don’t need to disconnect the ssh session to the
    remote host. Instead, follow the steps below.


    1. Login to remotehost from localhost:

    ```bash

    localhost$ ssh -l jsmith remotehost

    ```


    2. Now you are connected to the remotehost:

    ```bash

    remotehost$

    ```

