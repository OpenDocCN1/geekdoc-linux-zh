    ## Hack 27. Diff 命令


    `diff` 命令比较两个不同的文件并报告差异。输出非常晦涩，不易直接阅读。


    语法：`diff [options] file1 file2`


    ### 与旧文件比较时，我的新文件中修改了什么？

    `diff` 命令中的 `-w` 选项在执行比较时会忽略空格。


    在以下 diff 输出中：

    o

    `---` 之上的行表示更改发生在 `diff` 命令中的第一个文件（即 `name_list.txt`）。


