    - `tput rmul` - 退出下划线模式\n- `tput rev` - 反显模式\n- `tput smso` - 进入高亮模式（加粗）\n- `tput\
    \ rmso` - 退出高亮模式\n- `tput sgr0` - 关闭所有属性\n\n### tput 颜色代码：\n- 0 – 黑色\n- 1 – 红色\n\
    - 2 – 绿色\n- 3 – 黄色\n- 4 – 蓝色\n- 5 – 品红色\n- 6 – 青色\n- 7 – 白色\n\n## Hack 41. 使用\
    \ PS1 可用代码创建自定义提示符\n\n使用以下代码创建功能且符合你喜好的个人 `PS1` 提示符：\n\n- `\\a`: ASCII 铃字符\n-\
    \ `\\d`: “星期日期”格式的日期（例如，“Tue May26”）\n- `\\D{format}` 将格式传递给 `strftime()`，结果插入提示符字符串；特定区域的时间表示需要括号。\n\
    - `\\e`: ASCII 转义字符\n- `\\h`: 第一部分的主机名\n- `\\H`: 完整的主机名\n- `\\j`: 当前 shell 管理的任务数\n\
    - `\\l`: shell 终端设备名\n- `\\n`: 换行\n- `\\r`: 回车\n- `\\s`: shell 的名称，$0 的基文件名（最后一个斜杠后的部分）\n\
    - `\\t`: 24 小时制 HH:MM:SS 格式的当前时间\n- `\\T`: 12 小时制 HH:MM:SS 格式的当前时间\n- `\\@`: 12\
    \ 小时制 am/pm 格式的当前时间\n- `\\A`: 24 小时制 HH:MM 格式的当前时间\n- `\\u`: 当前用户的用户名\n- `\\v`:\
    \ bash 版本（例如，2.00）\n- `\\V`: bash 发布版本，版本 + 补丁级别（例如，2.00.0）\n- `\\w`: 当前工作目录，$HOME\
    \ 缩写为波浪号\n- `\\W`: 当前目录的基路径，$HOME 缩写为波浪号\n- `\\!`: 此命令的历史编号\n- `#`: 此命令的编号\n-\
    \ `\\$`: 如果有效 UID 为 0，则显示 `#`，否则显示 `$`\n- `\\nn`: 与八进制数字 `n` 对应的字符\n- `\\\\`:\
    \ 反斜线\n- `\\[`: 非打印字符序列，可将终端控制序列嵌入提示符中\n- `\\]`: 非打印字符序列结束\n\n![](img/00053.jpeg)Linux\
