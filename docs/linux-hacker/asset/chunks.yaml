    ## Hack 100. Nice Command


    Kernel decides how much processor time is required for a process based on the
    nice value. Possible nice value range is: -20 to 20. A process that has a nice
    value of -20 is very high priority. The process that has a nice value of 20 is
    very low priority. Use `ps aux` to display the nice value of all running process
    as shown below.


    ```bash

    ps aux

    ```

