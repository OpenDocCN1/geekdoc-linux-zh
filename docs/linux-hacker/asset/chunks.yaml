    - `s` – 同步所有挂载的文件系统。

    - `t` - 将当前任务列表及其信息输出到控制台。

    - `u` - 以只读模式重新挂载所有已挂的文件系统。

    - `o` – 立即关闭系统。

    - `p` – 将当前寄存器和标志打印到控制台。

    - `0-9` - 设置控制日志级别，控制哪些内核消息将打印到你的控制台。


