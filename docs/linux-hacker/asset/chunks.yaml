- fmt: "\n## Method 1: Navigate up the directory using “..n”\n\nIn the example below,\
    \ `..4` is used to go up 4 directory level, `..3` to go up 3 directory level,\
    \ `..2` to go up 2 directory level. Add the following alias to your `~/.bash_profile`\
    \ and re-login.\n\n```bash\nalias ..=\"cd ..\"\nalias ..2=\"cd ../..\"\nalias\
    \ ..3=\"cd ../../..\"\nalias ..4=\"cd ../../../..\"\nalias ..5=\"cd ../../../../../..\"\
    \n```\n\n```bash\n# cd \n/tmp/very/long/directory/structure/that/is/too/deep\n\
    # ..4\n```\n[Note: use `..4` to go up 4 directory level]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure/\n\
    ```\n\n## Method 2: Navigate up the directory using only dots\n\nIn the example\
    \ below, `.....` (five dots) is used to go up 4 directory level. Typing 5 dots\
    \ to go up 4 directory structure is really easy to remember, as when you type\
    \ the first two dots, you are thinking “going up one directory”, after that every\
    \ additional dot, is to go one level up. So, use `....` (four dots) to go up 3\
    \ directory level and `..` (two dots) to go up 1 directory level. Add the following\
    \ alias to your `~/.bash_profile` and re-login for the `.....` (five dots) to\
    \ work properly.\n\n```bash\nalias ..=\"cd ..\"\nalias ...=\"cd ../..\"\nalias\
    \ ....=\"cd ../../..\"\nalias .....=\"cd ../../../..\"\nalias ......=\"cd ../../../../../..\"\
    \n```\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n#\
    \ .....\n```\n[Note: use `.....` (five dots) to go up 4 directory level]\n\n```bash\n\
    # pwd\n/tmp/very/long/directory/structure/\n```\n\n## Method 3: Navigate up the\
    \ directory using cd followed by consecutive dots\n\nIn the example below, `cd.....`\
    \ (cd followed by five dots) is used to go up 4 directory level. Making it 5 dots\
    \ to go up 4 directory structure is really easy to remember, as when you type\
    \ the first two dots, you are thinking “going up one directory”, after that every\
    \ additional dot, is to go one level up. So, use `cd....` (cd followed by four\
    \ dots) to go up 3 directory level and `cd...` (cd followed by three dots) to\
    \ go up 2 directory level. Add the following alias to your `~/.bash_profile` and\
    \ re-login for the above `cd.....` (five dots) to work properly.\n\n```bash\n\
    alias cd..=\"cd ..\"\nalias cd...=\"cd ../..\"\nalias cd....=\"cd ../../..\"\n\
    alias cd.....=\"cd ../../../..\"\nalias cd......=\"cd ../../../../../..\"\n```\n\
    \n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n# cd.....\n\
    ```\n[Note: use `cd.....` to go up 4 directory level]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure\n\
    ```\n\n## Method 5: Navigate up the directory using cd followed by number\n\n\
    In the example below, `cd4` (cd followed by number 4) is used to go up 4 directory\
    \ level.\n\n```bash\nalias cd1=\"cd ..\"\nalias cd2=\"cd ../..\"\nalias cd3=\"\
    cd ../../..\"\nalias cd4=\"cd ../../../..\"\nalias cd5=\"cd ../../../..\"\n```\n\
    \n## Hack 3: Perform mkdir and cd using a single command\n\nSometimes when you\
    \ create a new directory, you may `cd` to the new directory immediately to perform\
    \ some work as shown below.\n\n```bash\n# mkdir -p /tmp/subdir1/subdir2/subdir3\n\
    # cd /tmp/subdir1/subdir2/subdir3\n# pwd\n/tmp/subdir1/subdir2/subdir3\n```\n\n\
    Wouldn’t it be nice to combine both `mkdir` and `cd` in a single command? Add\
    \ the following to the `.bash_profile` and re-login.\n\n```bash\n$ vi .bash_profile\n\
    function mkdircd () { mkdir -p \"$@\" && eval cd \"\\\"\\$$#\"; }\n```\n\nNow,\
    \ perform both `mkdir` and `cd` at the same time using a single command as shown\
    \ below:\n\n```bash\n# mkdircd /tmp/subdir1/subdir2/subdir3\n```\n[Note: This\
    \ creates the directory and cd to it automatically]\n\n```bash\n# pwd\n/tmp/subdir1/subdir2/subdir3\n\
    ```\n\n## Hack 4: Use “cd -” to toggle between the last two directories\n\nYou\
    \ can toggle between the last two current directories using `cd -` as shown below.\n\
    \n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n# cd /tmp/subdir1/subdir2/subdir3\n\
    # cd -\n# pwd\n/tmp/very/long/directory/structure/that/is/too/deep\n# cd -\n#\
    \ pwd\n/tmp/subdir1/subdir2/subdir3\n# cd -\n# pwd\n/tmp/very/long/directory/structure/that/is/too/deep\n\
    ```\n\n## Hack 5: Use dirs, pushd and popd to manipulate directory stack\n\nYou\
    \ can use directory stack to push directories into it and later pop directory\
    \ from the stack. Following three commands are used in this example.\n\n- `dirs`:\
    \ Display the directory stack\n- `pushd`: Push directory into the stack\n- `popd`:\
    \ Pop directory from the stack and cd to it\n\n`dirs` will always print the current\
    \ directory followed by the content of stack. Even when the directory stack is\
    \ empty, `dirs` command will print only the current directory as shown below.\n\
    \n```bash\n# popd\n# dirs\n/home/ramesh\n```\n\nHow to use `pushd` and `popd`?\
    \ Let us first create some temporary directories and push them to the stack as\
    \ shown below.\n\n```bash\nmkdir /tmp/dir1\nmkdir /tmp/dir2\nmkdir /tmp/dir3\n\
    mkdir /tmp/dir4\n# cd /tmp/dir1\npushd .\n# cd /tmp/dir2\npushd .\n# cd /tmp/dir3\n\
    pushd .\n# cd /tmp/dir4\npushd .\n```\n\n```bash\n# dirs\n/tmp/dir4 /tmp/dir3\
    \ /tmp/dir2 /tmp/dir1\n```\n[Note: The first directory (`/tmp/dir4`) of the `dirs`\
    \ output is always the current directory and not the content from stack.]\n\n\
    At this stage, the directory stack contains:\n`/tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1`\n\
    \nThe last directory that was pushed to the stack will be at the top. When you\
    \ perform `popd`, it will `cd` to the top entry in the stack and remove it from\
    \ the stack. As shown above, the last directory that was pushed into stack is\
    \ `/tmp/dir4`. So, when we do a `popd`, it will `cd` to `/tmp/dir4` and remove\
    \ it from the directory stack as shown below.\n\n```bash\n# popd\n# pwd\n/tmp/dir4\n\
    ```\n[Note: After the above `popd`, directory contains: `/tmp/dir3 /tmp/dir2 /tmp/dir1`]\n\
    \n```bash\n# popd\n# pwd\n/tmp/dir3\n```\n[Note: After the above `popd`, directory\
    \ Stack: `/tmp/dir2 /tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir2\n```\n[Note:\
    \ After the above `popd`, directory Stack: `/tmp/dir1`]\n\n```bash\n# popd\n#\
    \ pwd\n/tmp/dir1\n```\n[Note: After the above `popd`, directory is empty!]\n\n\
    ```bash\n# popd\nbash: popd: directory stack empty\n```\n\n## Hack 6: Use “shopt\
    \ -s cdspell” to automatically correct mistyped directory names on cd\n\nUse `shopt\
    \ -s cdspell` to correct the typos in the `cd` command automatically as shown\
    \ below. If you are not good at typing and make lot of mistakes, this will be\
    \ very helpful.\n\n```bash\n# cd /etc/mall\nbash: cd: /etc/mall: No such file\
    \ or directory\nshopt -s cdspell\n# cd /etc/mall\n# pwd\n/etc/mail\n```\n[Note:\
    \ By mistake, when I typed `mall` instead of `mail`, `cd` corrected it automatically]\n\
    \n## Chapter 2: Date Manipulation\n\n## Hack 7: Set System Date and Time\n\nTo\
    \ change the system date use: `mmddhhmiyyyy.ss`\n\n- `mm`: Month\n- `dd`: Date\n\
    - `hh`: 24 hour format\n- `mi`: Minutes\n- `yyyy`: Year\n- `ss`: seconds\n\nFor\
    \ example, to set system date to Jan 31st 2008, 10:19 p.m, 53 seconds:\n\n```bash\n\
    date 013122192009.53\n```\n\nYou can also change system date using `set` argument\
    \ as shown below.\n\n```bash\ndate 013122192009.53\ndate +%Y%m%d -s \"20090131\"\
    \ndate -s \"01/31/2009 22:19:53\"\ndate -s \"31 JAN 2009 22:19:53\"\ndate set=\"\
    31 JAN 2009 22:19:53\"\n```\n\nTo set the time only:\n\n```bash\ndate +%T -s \"\
    22:19:53\"\ndate +%T%p -s \"10:19:53PM\"\n```\n\n## Hack 8: Set Hardware Date\
    \ and Time\n\nBefore setting the hardware date and time, make sure the OS date\
    \ and time is set appropriately as shown in the hack#7.\n\nSet the hardware date\
    \ and time based on the system date as shown below:\n\n```bash\nhwclock –systohc\n\
    hwclock --systohc –utc\n```\n\nUse `hwclock` without any parameter, to view the\
    \ current hardware date and time:\n\n```bash\nhwclock\n```\n\nCheck the clock\
    \ file to verify whether the system is set for UTC:\n\n```bash\ncat /etc/sysconfig/clock\n\
    ZONE=\"America/Los_Angeles\"\nUTC=false\nARC=false\n```\n\n## Hack 9: Display\
    \ Current Date and Time in a Specific Format\n"
