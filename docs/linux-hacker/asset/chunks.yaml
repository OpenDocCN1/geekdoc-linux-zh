    \ `renice` Command\n    - `lsof` commands\n\n# Introduction\n\n“There are only\
    \ 10 types of people in the world — those who understand binary, those who don’t,\
    \ and those who understand gray code” — Geek\n\n![2014-01-10 16.41.13.jpg](images/00001.jpeg)\n\
    \nI’m Ajay Kumar Tiwari, author of this book. I have done intensive work on system\
    \ administration, Networking, Hardware and Storage.\n\n# Foreword\n\nAnother collection?\
    \ Yes! If you have just completed your first course or looking for better ways\
    \ to get the job done these useful tips are concise, well written and easy to\
    \ read. I will recommend this to my students.\n\n--Prof. Dr. Fritz (Author of\
    \ several Vim plugins)\n\n# Version\n\n1.0\n25-Mar-2015\n\n# Chapter 1: Powerful\
    \ CD Command Hacks\n\n`cd` is one of the most frequently used commands during\
    \ a session.\n\n## Use `CDPATH` to define the base directory for `cd` command\n\
    \nIf you are frequently performing `cd` to subdirectories of a specific parent\
    \ directory, you can set the `CDPATH` to the parent directory as explained below.\n\
    \n```bash\nmkdir -p /tmp/very/long/directory/structure/that/is/too/deep\ncd /tmp/very/long/directory/structure/that/is/too/deep\n\
    pwd\n/tmp/very/long/directory/structure/that/is/too/deep\ncd ../../../../\npwd\n\
    /tmp/very/long/directory/structure\n```\n\n```bash\n[ramesh@dev-db ~]#cd mail\n\
    -bash: cd: mail: No such file or directory\n[Note: This is looking for mail under\
    \ current directory]\n[ramesh@dev-db ~]#export CDPATH=/etc\n[ramesh@dev-db ~]#cd\
    \ mail\n/etc/mail\n[Note: This is looking for mail under /etc and not under current\
    \ directory]\n[ramesh@dev-db /etc/mail]#pwd\n/etc/mail\n```\n\nTo make this change\
    \ permanent, add `export CDPATH=/etc` to your `/.bash_profile`.\n\nSimilar to\
    \ the `PATH` variable, you can add more than one directory entry in the `CDPATH`\
    \ variable, separating them with `:` as shown below.\n\n```bash\nexport CDPATH=.:~:/etc:/var\n\
    ```\n\nThis hack can be very helpful under the following situations:\n\n- Oracle\
    \ DBAs frequently working under `$ORACLE_HOME`, can set the `CDPATH` variable\
    \ to the oracle home.\n- Unix sysadmins frequently working under `/etc`, can set\
    \ the `CDPATH` variable to `/etc`.\n- Developers frequently working under project\
    \ directory `/home/projects`, can set the `CDPATH` variable to `/home/projects`.\n\
    - End-users frequently accessing the subdirectories under their home directory,\
    \ can set the `CDPATH` variable to `~`.\n\n## Use `cd` alias to navigate up the\
    \ directory effectively\n\nWhen you are navigating up a very long directory structure,\
    \ you may be using `cd ../` with multiple `../`s depending on how many directories\
    \ you want to go up as shown below.\n\n```bash\nmkdir -p /tmp/very/long/directory/structure/that/is/too/deep\n\
    cd /tmp/very/long/directory/structure/that/is/too/deep\npwd\n/tmp/very/long/directory/structure/that/is/too/deep\n\
    cd ../../../../\npwd\n/tmp/very/long/directory\n```\n\nInstead of executing `cd\
    \ ../../../..` to navigate four levels up, use one of the following three alias\
    \ methods:\n"
