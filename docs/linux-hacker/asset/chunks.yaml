    ## 第 3 章：SSH 客户端命令


    ## 12. 识别 SSH 客户端版本


    有时可能需要识别当前运行的 SSH 客户端及其对应的版本号。使用 `ssh -V` 来识别版本号。请注意 Linux 自带了 OpenSSH。


    以下示例表明该系统正在使用 OpenSSH：

    ```bash

    $ ssh -V

    OpenSSH_3.9p1, OpenSSL 0.9.7

    ```


    另一个示例表明该系统正在使用 SSH2：

    ```bash

    $ ssh -V

    OpenSSH_2.2.9 (non-commercial version) x86_64-pc-

    ```


    ## 13. 登录远程主机


    当你第一次通过 SSH 登录远程主机时，可能需要确认其 SSH 密钥指纹。


