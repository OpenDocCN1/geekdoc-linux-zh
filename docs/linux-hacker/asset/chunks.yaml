    ### Swap 部分

    - `si` 字段：每秒从磁盘交换出的内存量

    - `so` 字段：每秒交换到磁盘的内存量


    ### IO 部分

    - `bi` 字段：从磁盘接收的块

    - `bo` 字段：发送到磁盘的块


    ### System 部分

    - `in` 字段：每秒中断次数

    - `cs` 字段：每秒上下文切换次数


    ### CPU 部分

    - `us` 字段：运行用户代码的时间。（内核代码）

    - `sy` 字段：运行内核代码的时间

    - `id` 字段：空闲时间

    - `wa` 字段：等待 IO 的时间


