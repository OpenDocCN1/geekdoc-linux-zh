    \ 条目中。\n3. **authorized_keys 中的重复项**：我希望 `ssh-copy-id` 验证远程主机的 `authorized_keys`\
    \ 重复项。如果你在本地多次执行 `ssh-copy-id`，它会在不检查重复项的情况下向远程主机的 `authorized_keys` 文件追加相同的密钥。但我希望我的\
    \ `authorized_keys` 文件是干净的。\n\n### 技巧 74. Crontab\n\n使用 `cron` 你可以在特定的时间和日期执行\
    \ shell 脚本或 Linux 命令。例如，系统管理员可以调度一个每天运行的备份任务。\n\n#### 如何向 cron 添加任务？\n\n```bash\n\
    crontab –e\n```\n\n```text\n0 5 * * * /root/bin/backup.sh\n```\n\n92\n![](img/00085.jpeg)Linux\
    \ Hack\n Ajay Kumar Tiwari\n\n这将在每天凌晨 5 点执行 `/root/bin/backup.sh`。\n\n#### Cron\
    \ 字段描述\n\n以下是 `crontab` 文件的格式：\n`{minute} {hour} {day-of-month} {month} {day-of-week}\
    \ {full-path-to-shell-script}`\n\n- `minute`: 允许范围 0 – 59\n- `hour`: 允许范围 0 –\
    \ 23\n- `day-of-month`: 允许范围 0 – 31\n- `month`: 允许范围 1 – 12。1 = 一月，12 = 十二。\n\
    - `day-of-week`: 允许范围 0 – 7。周日为 0 或 7。\n\n#### Crontab 示例\n\n1. **在凌晨 12:01 运行**。每天午夜后\
    \ 1 分钟。这是系统无负载运行备份的好时间。\n```bash\n1 0 * * * /root/bin/backup.sh\n```\n2. **每个工作日（周一至周五）晚上\
    \ 11:59 运行备份**。\n```bash\n59 11 * * 1,2,3,4,5 /root/bin/backup.sh\n```\n以下内容也将执行相同的操作：\n\
    ```bash\n59 11 * * 1-5 /root/bin/backup.sh\n```\n\n3. **每 5 分钟执行一次命令**。\n```bash\n\
    */5 * * * * /root/bin/check-status.sh\n```\n4. **每月 1 号下午 1:10 执行**。\n```bash\n\
    10 13 1 * * /root/bin/full-backup.sh\n```\n5. **在工作日晚上 11 点执行**。\n```bash\n0 23\
    \ * * 1-5 /root/bin/incremental-backup.sh\n```\n\n#### Crontab 选项\n\n以下是 `crontab`\
    \ 的可用选项：\n\n- `crontab –e`：编辑 `crontab` 文件。如果不存在，它将创建一个。\n- `crontab –l`：显示 `crontab`\
    \ 文件。\n- `crontab -r`：删除 `crontab` 文件。\n- `crontab -ir`：在删除 `crontab` 前会提示用户。\n\
    \n### 技巧 75. 使用 Magic SysRq Key 安全重启 Linux\n\nMagic SysRq 键是 Linux 内核中的键组合，允许用户无论系统状态如何执行各种低级命令。\n\
    \n它通常用于从冻结中恢复，或在不关闭电源的情况下重启电脑。\n\n"
