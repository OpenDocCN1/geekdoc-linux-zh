    \ Hack\nAjay Kumar Tiwari\n\n## 第 4 章：基础 Linux 命令\n\n### Hack 17. Grep 命令\n\n\
    `grep` 命令用于在文件中搜索特定文本。这是一个极其强大的命令，拥有许多选项。\n\n语法：`grep [options] pattern [files]`\n\
    \n我如何找到文件中所有匹配特定关键词的行？\n在本例中，`grep` 在 `/etc/passwd` 文件中查找文本 `John` 并显示所有匹配的行。\n\
    \n```bash\n# grep John /etc/passwd\n```\n\n```bash\n# grep John /etc/passwd\n\
    jsmith:x:1082::...\njdoe:x:1083::...\n```\n选项 `-v` 将显示所有非匹配的行。在下方的示例中，它们不匹配。\n\
    \n```bash\n# grep -v John /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n\
    ```\n有多少行匹配了该文本？\n在下方的示例中，它显示行数。\n\n```bash\n# grep -c John /etc/passwd\njsmith:x:1082::...\n\
    jdoe:x:1083::...\n```\n如何忽略大小写进行搜索？\n使用选项 `-i`（忽略大小写）。\n\n```bash\n# grep -i John\
    \ /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n```\n**如何搜索子目录？**\n使用选项 `-r`（递归）。\n\
    \n```bash\n# grep -r John /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n\
    ```\n\n### Hack 18. Find 命令\n\n`find` 经常用于根据条件查找文件。\n语法：`find [options] [conditions]`\n\
    \n如何找到包含某个单词的文件？\n以下命令查找所有名称。\n\n```bash\n# find /etc -name \"*mail*\"\n```\n\n\
    如何找到大于特定大小的文件？\n使用选项 `-size`。\n\n```bash\n# find /etc -size +100M\n```\n\n如何找到在特定天内未修改的文件？\n\
    使用选项 `-mtime`。\n\n```bash\n# find . -mtime +60\n```\n\n如何删除所有特定扩展名的文件？\n执行命令时请小心。\n\
    \n```bash\n# find . -type f -name \"*.tar.gz\" -size +100M -exec rm -f {} \\;\n\
    ```\n\n如何归档所有几天内未修改的文件？\n以下命令会在 `/tmp` 下创建一个归档。\n\n```bash\n# find /home/jsmith\
    \ -type f -mtime +60 | xargs tar -cvf /tmp/`date '+%d%m%Y'_archive.tar`\n```\n\
    \n### Hack 19. 抑制标准输出和错误\n\n有时在调试 脚本时，你可能不想看到标准输出或错误信息。如下所示使用 `/dev/null` 来抑制输出。\n\
    \n使用 `>/dev/null` 抑制标准输出：\n当不想显示 `echo` 语句而只想查看错误消息时，这将非常有用。\n\n```bash\n# cat\
    \ file.txt > /dev/null\n# ./shell-script.sh > /dev/null\n```\n\n使用 `2>/dev/null`\
    \ 抑制错误：\n只想查看标准输出而不查看错误消息时，同样有用。\n\n```bash\n# cat invalid-file-name.txt 2> /dev/null\n\
    # ./shell-script.sh 2> /dev/null\n```\n\n### Hack 20. Join 命令\n\n`join` 命令根据公共字段合并两个文件的行。\n\
    在下方的示例中，我们有两个文件——`employee.txt` 和 `salary.txt`。它们都有 `employee-id` 作为公共字段。因此，我们可以如下使用\
    \ `join` 命令通过 `employee-id` 合并这两个文件的数据。\n\n```bash\n$ cat employee.txt\n100\n\
    200\n300\n400\nJason Smith\nJohn Doe\nSanjay Gupta\n```\n\n"
- fmt: "\n# Ashok Sharma\n\n```bash\n$ cat bonus.txt\n100\n200\n300\n400\n```\n$5,000\n\
    $500\n$3,000\n$1,250\n\n```bash\n$ join employee.txt bonus.txt\n100\n200\n300\n\
    400\nJason Smith $5,000\nJohn Doe $500\nSanjay Gupta $3,000\nAshok Sharma $1,250\n\
    ```\n\n## Hack 21. Change the Case\n\n### Convert a file to all upper-case \n\
    ```bash\n$ cat employee.txt\n100\n200\n300\n400\nJason Smith\nJohn Doe\nSanjay\
    \ Gupta\nAshok Sharma\n```\n```bash\n$tr a-z A-Z < employee.txt\n100 JASON SMITH\n\
    200 JOHN DOE\n300 SANJAY GUPTA\n400 ASHOK SHARMA\n```\n![](images/00031.jpeg)Linux\
    \ Hack\n\n### Convert a file to all lower-case\n```bash\n$ cat department.txt\n\
    100\n200\n300\n400\nFINANCE\nMARKETING\nPRODUCT DEVELOPMENT\nSALES\n```\n```bash\n\
    $tr A-Z a-z < department.txt\n100\n200\n300\n400\nfinance\nmarketing\nproduct\
    \ development\nsales\n```\n\n## Hack 22. Xargs Command\n\n`xargs` is a very powerful\
    \ command that takes output of a command and pass it as argument of another command.\
    \ Following are some practical examples on how to use `xargs` effectively.\n\n\
    1. When you are trying to delete too many files using `rm`, you may get error\
    \ message: `/bin/rm` Argument list too long – Linux. Use `xargs` to avoid this\
    \ problem.\n```bash\nfind ~ -name '*.log’ -print0 | xargs -0 rm -f\n```\n2. Get\
    \ a list of all the `*.conf` file under `/etc/`. There are different ways to get\
    \ the same result. Following example is only to demonstrate the use of `xargs`.\
    \ The output of the `find` command in this example is passed to the `ls –l` one\
    \ by one using `xargs`.\n![](images/00032.jpeg)Linux Hack\n```bash\n# find /etc\
    \ -name \"*.conf\" | xargs ls –l\n```\n3. If you have a file with list of URLs\
    \ that you would like to download, you can use `xargs` as shown below.\n```bash\n\
    # cat url-list.txt | xargs wget –c\n```\n4. Find out all the `jpg` images and\
    \ archive it.\n```bash\n# find / -name *.jpg -type f -print | xargs tar -cvzf\
