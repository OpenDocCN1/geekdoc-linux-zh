    \ `.ssh/authorized_key` 中。\n\n#### 步骤 3：不输入密码登录远程主机\n\n```bash\njsmith@local-host$ssh\
    \ remote-host\n```\n\n```text\nLast login: Sun Nov 16 17:22:33 2008 from 192.168.1.2\n\
    [Note: SSH 没有询问密码。]\njsmith@remote-host$ [Note: 你现在位于远程主机上]\n```\n\n90\n![](img/00083.jpeg)Linux\
    \ Hack\nAjay Kumar Tiwari\n\n### 技巧 73. 结合 `ssh-agent` 使用 `ssh-copy-id`\n\n使用\
    \ `ssh-copy-id` 配合 `ssh-add/ssh-agent`\n\n当未为选项 `-i` 传递值且如果 `~/.ssh/identity.pub`\
