    \n```bash\n# vi ~/.bash_profile\nHISTFILE=/root/.commandline_warrior\n```\n\n\
    73\n![](img/00066.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n## Hack 57. 使用 HISTCONTROL\
