    \ 0.0\nS+19:19:00 grep yp\n0.1\n0.0\n36516\n4124\n1264 ?\n74 pts/0\n```\n\n##\
    \ Hack 55. 使用 HISTSIZE 控制历史记录中的总行数\n\n将以下两行追加到 `.bash_profile` 并重新登录 bash shell\
