    \ 脚本调试\n\n为了调试脚本，可以使用 `set -x`。如下所示：\n\n```bash\nset -x\n./script.sh\n```\n\n\
    # Hack 87. 引用\n\n不带特殊字符的 echo 语句。\n```bash\necho The Geek\n```\n带有特殊字符 `;` 的 echo\
    \ 语句。分号是 bash 中的命令分隔符。在以下示例中，“The Geek”有效，而“Stuff”被视为独立的 Linux 命令并提示找不到命令。\n\n\
    ```bash\necho The Geek; Stuff\n-bash: Stuff: command not found\n```\n为了避免这种情况，你可以在分号前面添加\
    \ `\\`，这将消除分号的特殊含义并直接打印它，如下所示。\n\n```bash\necho The Geek\\; Stuff\nThe Geek; Stuff\n\
    ```\n\n单引号\n当你想要原样打印单引号内的内容时使用单引号。像 `$HOSTNAME` 这样的特殊变量也会打印 `$HOSTNAME`，而不是 Linux\
    \ 主机名。\n\n```bash\necho 'Hostname=$HOSTNAME ; Message=\\$ is USD'\n```\n输出：\n\
    `Hostname=$HOSTNAME ; Message=$ is USD`\n\n双引号\n当你想要显示特殊变量的真实含义时使用双引号。\n\n```bash\n\
    echo \"Hostname=$HOSTNAME ; Message=\\$ is USD\"\n```\n输出：\n`Hostname=dev-db ;\
    \ Current User=ramesh ; Message=$ is USD`\n\n双引号将移除所有以下字符的特殊含义：\n- `$` 参数替换。\n\
    - `` `` 反引号\n- `\\$` 字面美元符号。\n- `\\´` 字面反引号。\n- `\\\"` 嵌套双引号。\n- `\\\\` 嵌套反斜杠。\n\
    \n# Hack 88. 在 shell 脚本内部读取数据字段\n\n此示例演示了如何从数据文件中读取特定字段并进行处理。例如，假设 `employees.txt`\
    \ 文件的格式为 `{员工姓名}:{员工 ID}:{部门名称}`，冒号分隔的文件如下所示。\n\n```bash\ncat employees.txt\n\
    Emma Thomas:100:Marketing\nAlex Jason:200:Sales\nMadison Randy:300:Product Development\n\
    Sanjay Gupta:400:Support\nNisha Singh:500:Sales\n```\n"
- fmt: "\nThe following shell script explains how to read specific fields from this\
    \ `employee.txt` file.\n\n```bash\n$ vi read-employees.sh\n\n#!/bin/bash\n\nIFS=:\n\
    \necho \"Employee Names:\"\n\necho \"---------------\"\n\nwhile read name empid\
    \ dept\ndo\n  echo \"$name is part of $dept department\"\ndone < ~/employees.txt\n\
    ```\n\nAssign execute privilege to the shell script and execute it.\n\n```bash\n\
    $ chmod u+x read-employees.sh\n$ ./read-employees.sh\n```\n\n```\nEmployee Names:\n\
    ---------------\nEmma Thomas is part of Marketing department\nAlex Jason is part\
    \ of Sales department\nMadison Randy is part of Product Development department\n\
    Sanjay Gupta is part of Support department\nNisha Singh is part of Sales department\n\
    ```\n\n# Chapter 12: System Monitoring and Performance\n\n## Hack 89. free command\n\
    \n`free` command displays all the necessary information about system physical\
    \ (RAM) and swap memory.\n\nSyntax: `free [options]`\n\n### What is the total\
    \ RAM on my system?\n\nIn the example below, the total physical memory on this\
    \ system is 1GB. The values displayed below are in KB.\n\n```bash\n# free\n  \
    \            total        used        free      shared  buffers/cache   cached\n\
    Mem:       10346241 1066996    2166688 117956      27928     174136      615892\n\
    Swap:       2031608           0       2031608\n```\n\n### What is the total memory\
    \ on my system including RAM and Swap?\n\nIn the following command:\n- option\
    \ `-m` displays the values in MB.\n- option `-t` displays the “Total” line, which\
    \ is sum of physical and swap memory values.\n- option `-o` is to hide the buffers/cache\
    \ line from the above example.\n\n```bash\n# free -mto\n               total \
    \       used        free\nshared  buffers  cache   cached\nMem:          1010\
    \         983           0\nSwap:          1983         983           0\nTotal:\
    \          2994        1966           0\n```\n\n## Hack 90. Top Command\n\n`top`\
    \ command displays real time information about various performance metrics of\
    \ the system such as CPU Load, Memory Usage, Processes list etc.\n\nSyntax: `top\
    \ [options]`\n\n### How to view my current system status including CPU usage?\n\
    \nExecute `top` without any option from the command line, which will display the\
    \ output shown below. The `top` command output will keep displaying the real-time\
    \ values, until you press “Control + c” or `q` to exit from the command output.\n\
    \n```bash\n#top\ntop - 13:10:13 up 171 days, 20:21, 3 users, load average: 0.01,\
    \ 0.05, 0.00\nTasks: 194 total, 1 running, 193 sleeping, 0 stopped, 0 zombie\n\
    Cpu(s): 0.6% us, 0.7% sy, 0.0% ni, 98.7% id, 0.0% wa, 0.0% hi, 0.0% si\nMem: 1034624k\
    \ total, 1007420k used, 27204k free, 174540k buffers\nSwap: 2031608k total, 0k\
    \ used, 2031608k free, 615904k cached\nPID USER PR NI VIRT RES\n11912 apache 15\
    \ 0 31828\n19299 oracle 19 0 279m\n11398 jsmith 16 0 107m\nSHR S %CPU %MEM TIME+\
    \ COMMAND\n13m 3916 S10.2 0:46.35 httpd\n18m 17m S10.2 0:00.03 oracle\n28m 6404\
    \ S00.4 0:03.07 perl\n```\n\n### How to read the output of the top command shown\
    \ above?\n\n- Line 1 “top”, indicates that the system has been up and running\
    \ for 171 days.\n- Line 2 “Tasks”, displays the total number of processes along\
    \ with a breakdown of running, sleeping, stopped and zombie processes count.\n\
    - Line 3 “Cpu(s)” displays the current CPU utilization of the system. In this\
    \ example, CPU is 98.7% idle.\n- Line 4 “Mem” and line 5 “Swap” provides the memory\
    \ information. This is the same information from the `free` command.\n- The rest\
    \ of the lines display all the active processes on the system, sorted default\
    \ by CPU usage (`%CPU` column). i.e the most CPU intensive processes will be displayed\
    \ on the top by default.\n\nThere are several command line options and interactive\
    \ options available for `top` commands. Let us review couple of essential options\
    \ for `top` command.\n\n### How to identify the most memory intensive processes?\n\
    \nWhile the output of the `top` command displayed, press `F`, which will display\
    \ the following message and show all fields available for sorting, press `n` (which\
    \ is for sorting the processes by Memory) and press enter. This will display the\
    \ processes in the top output sorted by memory usage.\n\n`Current Sort Field:\
    \ K for window 1:Def`\n`Select sort field via field letter, type any other key\
    \ to return`\n\n### How to add additional fields (for e.g. CPU Time) to the top\
    \ output?\n\nWhile the `top` command is running, press `f`, which will display\
    \ the following message and show all fields available for display, press `l`,\
    \ which will add the CPU Time to the display columns in the top output.\n\n`Current\
    \ Fields: AEHIOQTWKNMbcdfgjplrsuvyzX for window 1:Def`\n`Toggle fields via field\
    \ letter, type any other key to return`\n\n### How to get the full path name and\
    \ parameters of the running processes?\n\nWhile the `top` command is running,\
    \ press `c`, which will display the full pathname of running processes as shown\
    \ in the `COMMAND` column. Instead of just the process name, it displays the full\
    \ path.\n"
