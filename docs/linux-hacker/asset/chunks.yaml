    \ `~`\n\n请注意 `PS1` 值的末尾有一个空格。我个人更倾向于在提示符末尾留一个空格以获得更好的可读性。\n\n通过将 `export PS1=\"\
    \\u@\\h \\w> \"` 添加到如下所示的 `.bash_profile`（或）`.bashrc` 中，使此设置永久生效。\n\n```bash\n\
    ramesh@dev-db ~> vi ~/.bash_profile\nramesh@dev-db ~> vi ~/.bashrc\n```\n[注：在上述任一文件中添加\
    \ `export PS1=\"\\u@\\h \\w> \"`]\n\n请参阅下一章详细了解 `PS1` 使用的多个实用示例。\n\n### 30. PS2\
    \ - 续行交互提示符\n非常长的命令可以通过在行末尾添加 `\\` 来拆分为多行。多行命令的默认交互提示符为 `\"> \"`。让我们像下面所示，使用 `PS2`\
    \ 环境变量将此默认行为更改为 `\"continue->\"`。\n\n```bash\nramesh@dev-db ~>myisamchk --silent\
    \ --force --fast --\nupdate-state \\\n>--key_buffer_size=512M --sort_buffer_size=512M\
    \ \\\n>--read_buffer_size=4M --write_buffer_size=4M \\\n>/var/lib/mysql/bugs/*.MYI\n\
    ```\n[注：这使用了默认的 \">\" 作为续行提示符]\n\n```bash\nramesh@dev-db ~>export PS2=\"continue->\
    \ \"\nramesh@dev-db ~>myisamchk --silent --force --fast --\nupdate-state \\\n\
    continue->--key_buffer_size=512M --\nsort_buffer_size=512M \\\ncontinue->--read_buffer_size=4M\
    \ --write_buffer_size=4M\n\\\ncontinue->/var/lib/mysql/bugs/*.MYI\n```\n[注：这使用了修改后的\
    \ \"continue-> \" 作为续行提示符]\n\n当我使用 `\\` 将长命令拆分为多行时，发现这非常有用且易于阅读。我也看到过其他人不拆分命令。\n\
    \n### 31. PS3 - shell 脚本内部“select” 使用的提示符\n你可以像下面所示，使用 `PS3` 环境变量为 shell 脚本内部的\
    \ `select` 循环定义自定义提示符。\n\n没有 PS3 的 shell 脚本和输出：\n```bash\nselect i in 1 2 3\n\
    do\n   echo \"You chose $i\"\ndone\n> 1\nYou chose 1\n> 2\nYou chose 2\n> 3\n\
    You chose 3\n> \n```\n\n带有 PS3 的 shell 脚本和输出：\n```bash\nexport PS3=\"select an\
    \ option: \"\nselect i in 1 2 3\ndo\n   echo \"You chose $i\"\ndone\nselect an\
    \ option: 1\nYou chose 1\nselect an option: 2\nYou chose 2\nselect an option:\
    \ 3\nYou chose 3\n```\n```\n\n### 32. PS3 - “select”在 shell 脚本内部使用的提示符\n（注：此处原文标题似乎与上方内容有重复，已按逻辑翻译）\n\
    \n### 33. PS3 - “select”在 shell 脚本内部使用的提示符\n（注：此处原文标题似乎与上方内容有重复，已按逻辑翻译）\n\n###\
    \ 34. PS3 - “select”在 shell 脚本内部使用的提示符\n（注：此处原文标题似乎与上方内容有重复，已按逻辑翻译）\n\n"
- fmt: "\nYou can also use `\\@` to display the current time in 12-hour am/pm format\
    \ as shown below:\n\n```bash\nramesh@dev-db ~>export PS1=\"[\\@] \\u@\\h> \"\n\
    [04:12 PM] ramesh@dev-db>\n```\n\n## Hack 36. Display output of any command in\
    \ the prompt\n\nYou can display output of any Linux command in the prompt. The\
    \ following example displays three items separated by `|` (pipe) in the command\
    \ prompt:\n\n- `\\!`: The history number of the command\n- `\\h`: hostname\n-\
    \ `$kernel_version`: The output of the `uname -r` command from `$kernel_version`\
    \ variable\n- `\\$?`: Status of the last command\n\n```bash\nramesh@dev-db ~>kernel_version=$(uname\
    \ -r)\nramesh@dev-db ~>export PS1=\"\\!|\\h|$kernel_version|\\$?> \"\n473|dev-db|2.6.25-14.fc9.i686|0>\n\
    ```\n\n![](images/00049.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n## Hack 37. Change\
    \ foreground color of the prompt\n\nDisplay prompt in blue color, along with username,\
    \ host and current directory information.\n\n```bash\n$export PS1=\"\\e[0;34m\\\
    u@\\h \\w> \\e[m \"\n```\n[Note: This is for light blue prompt]\n\n```bash\n$export\
    \ PS1=\"\\e[1;34m\\u@\\h \\w> \\e[m \"\n```\n[Note: This is for dark blue prompt]\n\
    \n- `\\e[` - Indicates the beginning of color prompt\n- `x;ym` - Indicates color\
    \ code. Use the color code values mentioned below.\n- `\\e[m` - indicates the\
    \ end of color prompt\n\n### Color Code Table:\n- Black 0;30\n- Blue 0;34\n- Green\
    \ 0;32\n- Cyan 0;36\n- Red 0;31\n- Purple 0;35\n- Brown 0;33\n[Note: Replace 0\
    \ with 1 for dark color]\n\nMake the color change permanent by adding the following\
    \ lines to your `~/.bash_profile` or `~/.bashrc`:\n\n```bash\n$ vi ~/.bash_profile\n\
    STARTCOLOR='\\e[0;34m';\nENDCOLOR=\"\\e[0m\"\nexport PS1=\"$STARTCOLOR\\u@\\h\
    \ \\w> $ENDCOLOR\"\n```\n\n![](images/00050.jpeg)Linux Hack\nAjay Kumar Tiwari\n\
    \n## Hack 38. Change background color of the prompt\n\nChange the background color\
    \ by specifying `\\e[{code}m` in the `PS1` prompt as shown below.\n\n```bash\n\
    $export PS1=\"\\e[47m\\u@\\h \\w> \\e[m \"\n```\n[Note: This is for Light Gray\
    \ background]\n\nCombination of background and foreground:\n\n```bash\n$export\
    \ PS1=\"\\e[0;34m\\e[47m\\u@\\h \\w> \\e[m \"\n```\n[Note: This is for Light Blue\
    \ foreground and Light Gray background]\n\nAdd the following to your `~/.bash_profile`\
    \ or `~/.bashrc` to make the above background and foreground color permanent:\n\
    \n```bash\n$ vi ~/.bash_profile\nSTARTFGCOLOR='\\e[0;34m';\nSTARTBGCOLOR=\"\\\
    e[47m\"\nENDCOLOR=\"\\e[0m\"\nexport PS1=\"$STARTFGCOLOR$STARTBGCOLOR\\u@\\h \\\
    w> $ENDCOLOR\"\n```\n\nPlay around by using the following background color and\
    \ choose the one that matches your taste:\n- `\\e[40m`\n- `\\e[41m`\n- `\\e[42m`\n\
    - `\\e[43m`\n- `\\e[44m`\n- `\\e[45m`\n- `\\e[46m`\n- `\\e[47m`\n\n![](images/00051.jpeg)Linux\
    \ Hack\nAjay Kumar Tiwari\n\n## Hack 39. Display multiple colors in the prompt\n\
    \nYou can also display multiple colors in the same prompt. Add the following function\
    \ to your `~/.bash_profile`:\n\n```bash\nfunction prompt {\n  local BLUE=\"\\\
    [\\033[0;34m\\]\"\n  local DARK_BLUE=\"\\[\\033[1;34m\\]\"\n  local RED=\"\\[\\\
    033[0;31m\\]\"\n  local DARK_RED=\"\\[\\033[1;31m\\]\"\n  local NO_COLOR=\"\\\
    [\\033[0m\\]\"\n  case $TERM in\n    xterm*|rxvt*)\n      TITLEBAR='\\[\\033]0;\\\
    u@\\h:\\w\\007\\]'\n      ;;\n    *)\n      TITLEBAR=\"\"\n      ;;\n  esac\n\
    \  PS1=\"\\u@\\h [\\t]> \"\n  PS1=\"${TITLEBAR}\\\n  $BLUE\\u@\\h $RED[\\t]>$NO_COLOR\
    \ \"\n  PS2='continue-> '\n  PS4='$0.$LINENO+ '\n}\n```\n\n![](images/00052.jpeg)Linux\
    \ Hack\nAjay Kumar Tiwari\n\nYou can re-login for the changes to take effect or\
    \ source the `.bash_profile` as shown below:\n\n```bash\n$. ./.bash_profile\n\
    $prompt\nramesh@dev-db [13:02:13]>\n```\n\n## Hack 40. Change the prompt color\
    \ using tput\n\nYou can also change color of the `PS1` prompt using `tput` as\
    \ shown below:\n\n```bash\nexport PS1=\"\\[$(tput bold)$(tput setb 4)\\]\\u@\\\
    h:\\w \\$(tput sgr0)\\]\"\n```\n\n### tput Color Capabilities:\n- `tput setab\
    \ [1-7]` - Set a background color using ANSI escape\n- `tput setb [1-7]` - Set\
    \ a background color\n- `tput setaf [1-7]` - Set a foreground color using ANSI\
    \ escape\n- `tput setf [1-7]` - Set a foreground color\n\n### tput Text Capabilities:\n\
    - `tput bold` - Set bold mode\n- `tput dim` - turn on half-bright mode\n- `tput\
    \ smul` - begin underline mode\n- `tput rmul` - exit underline mode\n- `tput rev`\
    \ - Turn on reverse mode\n- `tput smso` - Enter standout mode (bold on rxvt)\n\
    - `tput rmso` - Exit standout mode\n- `tput sgr0` - Turn off all attributes\n\n\
    ### Color Code for tput:\n- 0 – Black\n- 1 – Red\n- 2 – Green\n- 3 – Yellow\n\
    - 4 – Blue\n- 5 – Magenta\n- 6 – Cyan\n- 7 – White\n\n## Hack 41. Create your\
    \ own prompt using the available codes for PS1 variable\n\nUse the following codes\
    \ and create your own personal `PS1` prompt is functional and suits your taste:\n\
    \n- `\\a`: an ASCII bell character\n- `\\d`: the date in \"Weekday Date\" format\
    \ (e.g., \"Tue May26\")\n- `\\D{format}` - the format is passed to `strftime()`\
    \ and the result is inserted into the prompt string; braces are required for locale-specific\
    \ time representation.\n- `\\e`: an ASCII escape character\n- `\\h`: the hostname\
    \ up to the first part\n- `\\H`: the hostname\n- `\\j`: the number of jobs currently\
    \ managed by the shell\n- `\\l`: the basename of the shell’s terminal device name\n\
    - `\\n`: newline\n- `\\r`: carriage return\n- `\\s`: the name of the shell, the\
    \ basename of $0 (the portion following the final slash)\n- `\\t`: the current\
    \ time in 24-hour HH:MM:SS format\n- `\\T`: the current time in 12-hour HH:MM:SS\
    \ format\n- `\\@`: the current time in 12-hour am/pm format\n- `\\A`: the current\
    \ time in 24-hour HH:MM format\n- `\\u`: the username of the current user\n- `\\\
    v`: the version of bash (e.g., 2.00)\n- `\\V`: the release of bash, version +\
    \ patch level (e.g., 2.00.0)\n- `\\w`: the current working directory, with `$HOME`\
    \ abbreviated with a tilde\n- `\\W`: the basename of the current directory, with\
    \ `$HOME` abbreviated with a tilde\n- `\\!`: the history number of this command\n\
    - `#`: the command number of this command\n- `\\$`: if the effective UID is 0,\
    \ a `#`, otherwise a `$`\n- `\\nn`: the character corresponding to the octal number\
    \ `n`\n- `\\\\`: a backslash\n- `\\[`: begin a sequence of non-printing characters,\
    \ which could be used to embed a terminal control sequence into the prompt\n-\
    \ `\\]`: end a sequence of non-printing character\n\n![](images/00053.jpeg)Linux\
    \ Hack\nAjay Tiwari\n\n## Hack 42. Use bash shell function inside PS1 variable\n\
    \nYou can also invoke a bash shell function in the `PS1` as shown below:\n\n```bash\n\
    ramesh@dev-db ~> function httpdcount {\n  ps aux | grep httpd | grep -v grep |\
    \ wc -l\n}\nramesh@dev-db ~>export PS1=\"\\u@\\h [`httpdcount`]> \"\nramesh@dev-db\
    \ [12]>\n```\n[Note: This displays the total number of running httpd processes]\n\
    \nYou can add the following line to your `~/.bash_profile` or `~/.bashrc` to make\
    \ this change permanent:\n\n```bash\n$ vi .bash_profile\nfunction httpdcount {\n\
    \  ps aux | grep httpd | grep -v grep | wc -l\n}\nexport PS1='\\u@\\h [`httpdcount`]>\
    \ '\n```\n\n## Hack 43. Use shell script inside PS1 variable\n\nYou can also invoke\
    \ a shell script inside the `PS1` variable. In the example below, the `~/bin/totalfilesize.sh`,\
    \ which calculates the total filesize of the current directory, is invoked inside\
    \ the `PS1` variable.\n\n```bash\nramesh@dev-db ~> cat ~/bin/totalfilesize.sh\n\
    for filesize in $(ls -l . | grep \"^-\" | awk '{print $5}')\ndo\n  let totalsize=$totalsize+$filesize\n\
    done\necho -n \"$totalsize\"\nramesh@dev-db ~> export PATH=$PATH:~/bin\nramesh@dev-db\
    \ ~>export PS1=\"\\u@\\h [\\$(totalfilesize.sh) bytes]> \"\nramesh@dev-db [534\
    \ bytes]> cd /etc/mail\nramesh@dev-db [167997 bytes]>\n```\n[Note: This executes\
    \ the totalfilesize.sh to display the total file size of the current directory\
    \ in the PS1 prompt]\n\n![](images/00054.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n\
    ## Chapter 7: Archive and Compression\n\n## Hack 44. Zip command basics\n\nHow\
    \ to zip multiple files?\n\nsyntax: `zip {.zip file-name} {file-names}`\n\n```bash\n\
    # zip var-log-files.zip /var/log/*\n  � adding: var/log/acpid (deflated 81%)\n\
    \  � adding: var/log/anaconda.log (deflated 79%)\n  � adding: var/log/anaconda.syslog\
    \ (deflated 73%)\n  � adding: var/log/anaconda.xlog (deflated 82%)\n  � adding:\
    \ var/log/audit/ (stored 0%)\n  � adding: var/log/boot.log (stored 0%)\n```\n"
