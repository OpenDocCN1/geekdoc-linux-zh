  trans: "\n\n## 方法 1：使用“..n”向上导航目录\n\n在下面的示例中，`..4` 用于返回 4 级目录，`..3` 用于返回 3 级目录，`..2`\
    \ 用于返回 2 级目录。请将以下别名添加到你的 `~/.bash_profile` 中并重新登录。\n\n```bash\nalias ..=\"cd ..\"\
    \nalias ..2=\"cd ../..\"\nalias ..3=\"cd ../../..\"\nalias ..4=\"cd ../../../..\"\
    \nalias ..5=\"cd ../../../../../..\"\n```\n\n```bash\n# cd \n/tmp/very/long/directory/structure/that/is/too/deep\n\
    # ..4\n```\n[注：使用 `..4` 返回 4 级目录]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure/\n\
    ```\n\n## 方法 2：仅使用点号向上导航目录\n\n在下面的示例中，`.....`（五个点）用于返回 4 级目录。通过输入 5 个点来返回 4 级目录结构非常容易记忆，因为当你输入前两个点时，你想的是“返回上一级目录”，之后每多一个点，就向上移动一级。所以，使用\
    \ `....`（四个点）返回 3 级目录，使用 `..`（两个点）返回 1 级目录。请将以下别名添加到你的 `~/.bash_profile` 中并重新登录，以使\
    \ `.....`（五个点）能够正常工作。\n\n```bash\nalias ..=\"cd ..\"\nalias ...=\"cd ../..\"\n\
    alias ....=\"cd ../../..\"\nalias .....=\"cd ../../../..\"\nalias ......=\"cd\
    \ ../../../../../..\"\n```\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n\
    # .....\n```\n[注：使用 `.....`（五个点）返回 4 级目录]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure/\n\
    ```\n\n## 方法 3：使用 cd 后接连续点号向上导航目录\n\n在下面的示例中，`cd.....`（cd 后接五个点）用于返回 4 级目录。将其设置为\
    \ 5 个点来返回 4 级目录结构非常容易记忆，因为当你输入前两个点时，你想的是“返回上一级目录”，之后每多一个点，就向上移动一级。所以，使用 `cd....`（cd\
    \ 后接四个点）返回 3 级目录，使用 `cd...`（cd 后接三个点）返回 2 级目录。请将以下别名添加到你的 `~/.bash_profile` 中并重新登录，以使上述\
    \ `cd.....`（五个点）能够正常工作。\n\n```bash\nalias cd..=\"cd ..\"\nalias cd...=\"cd ../..\"\
    \nalias cd....=\"cd ../../..\"\nalias cd.....=\"cd ../../../..\"\nalias cd......=\"\
    cd ../../../../../..\"\n```\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n\
    # cd.....\n```\n[注：使用 `cd.....` 返回 4 级目录]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure\n\
    ```\n\n## 方法 5：使用 cd 后接数字向上导航目录\n\n在下面的示例中，`cd4`（cd 后接数字 4）用于返回 4 级目录。\n\n```bash\n\
    alias cd1=\"cd ..\"\nalias cd2=\"cd ../..\"\nalias cd3=\"cd ../../..\"\nalias\
    \ cd4=\"cd ../../../..\"\nalias cd5=\"cd ../../../..\"\n```\n\n## 技巧 3：使用单个命令执行\
    \ mkdir 和 cd\n\n有时当你创建一个新目录时，你可能需要立即 `cd` 进入新目录以执行某些工作，如下所示。\n\n```bash\n# mkdir\
    \ -p /tmp/subdir1/subdir2/subdir3\ncd /tmp/subdir1/subdir2/subdir3\n/tmp/subdir1/subdir2/subdir3\n\
    ```\n\n如果能用一个命令同时完成 `mkdir` 和 `cd` 那不是更好吗？请将以下内容添加到 `.bash_profile` 并重新登录。\n\n\
    ```bash\n$ vi .bash_profile\nfunction mkdircd () { mkdir -p \"$@\" && cd \"$@\"\
    ; }\n```\n\n现在，使用单个命令同时执行 `mkdir` 和 `cd`，如下所示：\n\n```bash\n# mkdircd /tmp/subdir1/subdir2/subdir3\n\
    ```\n[注：这会自动创建目录并进入该目录]\n\n```bash\n# pwd\n/tmp/subdir1/subdir2/subdir3\n```\n\
    \n## 技巧 4：使用“cd -”在两个目录间切换\n\n你可以使用 `cd -` 在最后两个目录间切换，如下所示。\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n\
    cd /tmp/subdir1/subdir2/subdir3\n# cd -\n/tmp/very/long/directory/structure/that/is/too/deep\n\
    # cd -\n/tmp/subdir1/subdir2/subdir3\n# cd -\n/tmp/very/long/directory/structure/that/is/too/deep\n\
    \n## 技巧 5：使用 dirs, pushd 和 popd 操作目录栈\n\n你可以使用目录栈将目录推入并在稍后从栈中弹出。本示例使用了以下命令：\n\n\
    - `dirs`: 显示目录栈\n- `pushd`: 将目录推入栈\n- `popd`: 从栈中弹出目录并进入\n\n`dirs` 总是先打印当前目录，然后是栈的内容。即使目录栈为空，`dirs`\
    \ 命令也会打印当前目录，如下所示。\n\n```bash\n# popd\n# dirs\n/home/ram\n```\n\n如何使用 `pushd`\
    \ 和 `popd`？让我们首先创建一些目录并将它们推入栈，如下所示。\n\n```bash\nmkdir /tmp/dir1\nmkdir /tmp/dir2\n\
    mkdir /tmp/dir3\nmkdir /tmp/dir4\n# cd /tmp/dir1\npushd .\n# cd /tmp/dir2\npushd\
    \ .\n# cd /tmp/dir3\npushd .\n# cd /tmp/dir4\npushd .\n```\n\n```bash\n# dirs\n\
    /tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1\n```\n[注：`dirs` 输出的第一个目录（`/tmp/dir4`）总是当前目录，而不是栈的内容。]\n\
    \n在此阶段，目录栈包含：\n`/tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1`\n\n最后推入栈的目录位于栈顶。当你执行\
    \ `popd` 时，它将进入栈顶项并从栈中移除。如上所示，最后推入栈的目录是 `/tmp/dir4`。所以，当我们执行 `popd` 时，它将进入 `/tmp/dir4`\
    \ 并从目录栈中移除，如下所示。\n\n```bash\n# popd\n# pwd\n/tmp/dir4\n```\n[注：执行上述 `popd` 后，目录包含\
    \ `/tmp/dir3 /tmp/dir2 /tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir3\n```\n\
    [注：执行上述 `popd` 后，栈：`/tmp/dir2 /tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir2\n\
    ```\n[注：执行上述 `popd` 后，栈：`/tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir1\n```\n\
    [注：执行上述 `popd` 后，目录为空！]\n\n## 技巧 6：使用“shopt -s cdspell”自动修正 cd 中拼写错误的目录名\n\n使用\
    \ `shopt -s cdspell` 自动修正 `cd` 命令中的拼写错误，如下所示。如果你不擅长输入且经常出错，这将非常有帮助。\n\n```bash\n\
    # cd /etc/mall\nbash: cd: /etc/mall: No such file or directory\nshopt -s cdspell\n\
    # cd /etc/mall\n# pwd\n/etc/mail\n```\n[注：错误地，当我输入 `mall` 而不是 `mail` 时，`cd` 自动修正了它]\n\
    \n## 第二 章：日期操作\n\n## 技巧 7：设置系统日期和时间\n\n更改系统日期使用：`mmddhhmiyyyy.ss`\n\n- `mm`: 月\n\
    - `dd`: 日\n- `hh`: 24 小时制\n- `mi`: 分\n- `yyyy`: 年\n- `ss`: 秒\n\n例如，将系统日期设置为 2008\
    \ 年 1 月 31 日晚上 10:19  53 秒：\n\n```bash\ndate 013122192009.53\n```\n\n你也可以使用 `set`\
    \ 参数更改系统日期，如下所示。\n\n```bash\ndate 013122192009.53\ndate +%Y%m%d -s \"20090131\"\
    \ndate -s \"01/31/2009 22:19:53\"\ndate -s \"31 JAN 2009 22:19:53\"\ndate set=\"\
    31 JAN 2009 22:19:53\"\n```\n\n仅设置时间时：\n\n```bash\ndate +%T -s \"22:19:53\"\n\
    date +%T%p -s \"10:19:53PM\"\n```\n\n"
