  trans: "\n\n# 停止 httpd 服务\n\n```bash\nhistory | tail -3\n```\n\n79 export HISTIGNORE=”pwd:ls:ls\
    \ -ltr:”\n80 service httpd stop\n81 history\n\n[注意：历史记录没有显示 pwd 和 ls]\n\n79\n\
    ![](img/00072.jpeg)Linux 黑客\nAjay Kumar Tiwari\n第 9 章：系统管理任务\n\n## 技巧 65. 使用 fdisk\
    \ 进行分区\n\n在你的服务器上安装了全新的磁盘后，你必须使用像 `fdisk` 的工具对其进行分区。\n\n以下是你可以在 `fdisk` 内部执行的\
    \ 5 个典型操作（命令）：\n\n* `n` – 创建新分区\n* `d` – 删除现有的分区\n* `p` - 打印分区表\n* `w` – 将更改写入分区表。即保存。\n\
    * `q` – 退出 `fdisk` 实用程序\n\n### 创建分区\n\n在接下来的示例中，我创建了一个 `/dev/sda1` 主分区。\n\n```bash\n\
    #fdisk /dev/sda\n```\n设备既不包含有效的 DOS 分区表，也不包含 Sun、SGI 或 OSF 磁盘标签。正在构建新的 DOS 磁盘标签。更改将保留在内存中，直到你决定写入它们。之后，当然，以前的内容将无法恢复。此磁盘的磁道数设置为\
    \ 34893。这没有问题，但它大于 1024，在某些设置下可能会引起问题：\n\n1) 在启动时运行的软件（例如，旧版本的 `LILO`）\n2) 来自其他操作系统的启动和分区软件（例如\
    \ `DOS FDISK`、`OS/2 FDISK`）\n\n警告：分区表 4 的无效标志 0x0000 将被 `w`(写入）修正\n\n```bash\n\
    Command (m for help):p\n```\n磁盘 `/dev/sda`: 287.0 GB, 287005343744 字节\n255 头,\
    \ 63 扇区/道, 34893 磁道\n单位 = 16065 磁道 * 512 = 8225280 字节\nDevice Boot | Start | End\
    \ | Blocks | Id | System\n\n```bash\nCommand (m for help):n\n```\nCommand action\n\
    \  extended\n  primary partition (1-4)\n\n```bash\np\n```\n分区编号 (1-4):1\n第一个磁道\
    \ (1-34893, 默认 1):\n使用默认值 1\n最后一个磁道或 +size 或 +sizeM 或 +sizeK (1-34893, 默认 34893):\n\
    使用默认值 34893\n\n```bash\nCommand (m for help):w\n```\n分区表已更改！调用 `ioctl()` 重新读取分区表。正在同步磁盘。\n\
    \n### 验证分区是否已成功创建\n\n```bash\n#fdisk /dev/sda\n```\n此磁盘的磁道数设置为 34893。这没有问题，但它大于\
    \ 1024，在某些设置下可能会引起问题：\n\n1) 在启动时运行的软件（例如，旧版本的 `LILO`）\n2) 来自其他操作系统的启动和分区软件（例如\
    \ `DOS FDISK`、`OS/2 FDISK`）\n\n```bash\nCommand (m for help): p\n```\n磁盘 `/dev/sda`:\
    \ 287.0 GB, 287005343744 字节\n255 头, 63 扇区/道, 34893 磁道\n单位 = 16065 磁道 * 512 = 8225280\
    \ 字节\nDevice Boot | /dev/sda1 | Start | 1 | End | 34893 | Blocks | 280277991 |\
    \ Id | 83 | System | Linux\n\n```bash\nCommand (m for help):q\n```\n\n## 技巧 66.\
    \ 使用 mke2fsk 格式化分区\n\n对磁盘分区后，它仍然无法使用，因为我们需要格式化磁盘。在此阶段，如果你尝试查看磁盘信息，它将返回以下错误消息，表示没有有效的超级块。\n\
    \n```bash\n#tune2fs -l /dev/sda1\n```\ntune2fs 1.35 (28-Feb-2004)\ntune2fs: 在尝试打开\
    \ `/dev/sda1` 时超级块中的魔数无效\n找不到有效的文件系统超级块。\n\n要格式化磁盘，请如下所示使用 `mke2fs`。\n\n```bash\n\
    #mke2fs /dev/sda1\n```\n你也可以将以下可选参数传递给 `mke2fs`：\n\n* `-m 0` : 预留块百分比 – 这表示为 root\
    \ 用户预留的文件系统块的百分比。默认值为 5%。在接下来的示例中，它被设置为 0。\n* `-b 4096` : 以字节指定的块大小。有效值为每块 1024、2048\
    \ 和 4096 字节。\n\n```bash\n#mke2fs -m 0 -b 4096 /dev/sda1\n```\nmke2fs 1.35 (28-Feb-2004)\n\
    Filesystem label=\nOS type: Linux\nBlock size=4096 (log=2)\n205344 inodes,70069497\
    \ blocks\n0 blocks (0%) reserved for the user\nFirst data block=0\nMaximum filesystem\
    \ blocks=7130168\n32768 block groups\n32768 blocks per group\n96 inodes per group\n\
    Superblock stored on blocks: 32768,98304,163840,229376,294912,819200,884736,160532\n\
    265432 days\n\n## 技巧 67. 挂载分区\n\n创建分区并格式化后，首先创建一个要挂载分区的目录。\n\n```bash\n# mkdir\
    \ /home/database\n```\n\n将以下行添加到 `/etc/fstab` 并重启系统以使其生效：\n\n```bash\n/dev/sda1\
    \ /home/database ext3 defaults 0 0\n```\n\n要查看文件系统信息，如下所示使用 `tune2fs`：\n\n```bash\n\
    #tune2fs -l /dev/sda1\n```\ntune2fs 1.35 (28-Feb-2004)\n...（省略） ...\n\n例如，如果你想更改文件系统卷名，可以如下所示操作：\n\
    \n```bash\n#tune2fs -L database /dev/sda1\n```\n\n## 技巧 69. 创建交换文件系统\n\n如下所示创建一个用于交换的文件：\n\
    \n```bash\n#dd if=/dev/zero of=/home/swap-fs bs=1M count=512\n```\n512+0 records\
    \ in\n512+0 records out\n\n```bash\n# ls -l /home/swap-fs\n```\n-rw-r--r-- 1 root\
    \ root 536870912 Jan 2 23:13\n\n使用 `mkswap` 为上述的 `/home/swap-fs` 设置 Linux 交换区域。\n\
    \n```bash\n#mkswap /home/swap-fs\n```\nSetting up swapspace version 1, size =\
    \ 536866 kB\n\n一旦文件创建并设置为 Linux 交换区域，是时候如下所示使用 `swapon` 启用交换了：\n\n```bash\n#swapon\
    \ /home/swap-fs\n```\n\n将以下行添加到 `/etc/fstab` 并重启系统以使交换生效：\n\n```bash\n/home/swap-fs\
    \ swap swap defaults 0 0\n```\n\n## 技巧 70. 创建新用户\n\n添加新用户 – 基本方法\n\n仅指定用户名。\n\n\
    ```bash\n# useradd jsmith\n```\n\n带有额外参数添加新用户\n\n你也可以将以下参数传递给 `useradd`：\n\n"
- fmt: "\n- `-c` : Description about the user.\n- `-e` : expiry date of the user in\
    \ `mm/dd/yy` format\n\n```bash\nadduser -c \"John Smith - Oracle Developer\" -e\
    \ 12/31/09 jsmith\n```\n\nVerify that the user got added successfully.\n\n```bash\n\
    grep jsmith /etc/passwd\n```\n\n```text\njsmith:x:510:510:John Smith - Oracle\
    \ Developer:/home/jsmith:/bin/bash\n```\n\nChange the user password.\n\n```bash\n\
    passwd jsmith\n```\n\n```text\nChanging password for user jsmith.\nNew UNIX password:\n\
    BAD PASSWORD: it is based on a dictionary word\nRetype new UNIX password:\npasswd:\
    \ all authentication tokens updated successfully.\n```\n\n87\n![](images/00080.jpeg)Linux\
    \ Hack\n Ajay Kumar Tiwari\n\nNote: Make sure to follow these best practices to\
    \ create a strong password for the user.\n\n### How to identify the default values\
    \ used by `useradd`?\n\nFollowing are the default values that will be used when\
    \ an user is created.\n\n```bash\nuseradd –D\n```\n\n```text\nGROUP=100\nHOME=/home\n\
    INACTIVE=-1\nEXPIRE=\nSHELL=/bin/bash\nSKEL=/etc/skel\n```\n\n### Hack 71. Create\
    \ a new group and assign to an user\n\nCreate a new developer group.\n\n```bash\n\
    groupadd developers\n```\n\nValidate that the group was created successfully.\n\
    \n```bash\ngrep developer /etc/group\n```\n\n```text\ndevelopers:x:511:\n```\n\
    \n#### Add an user to an existing group.\n\nYou cannot use `useradd` to modify\
    \ an existing user, as you’ll get the following error message.\n\n88\n![](images/00081.jpeg)Linux\
    \ Hack\n\n```bash\nuseradd -G developers jsmith\n# Output:\nuseradd: user jsmith\
    \ exists\n```\n\n```bash\nusermod -g developers jsmith\n```\n\nAjay Kumar Tiwari\n\
    \nValidate the users group was modified successfully.\n\n```bash\ngrep jsmith\
    \ /etc/passwd\n```\n\n```text\njsmith:x:510:511:Oracle Developer:/home/jsmith:/bin/bash\n\
    ```\n\n```bash\nid jsmith\n```\n\n```text\nuid=510(jsmith) gid=511(developers)\n\
    groups=511(developers)\n```\n\n```bash\ngrep jsmith /etc/group\n```\n\n```text\n\
    jsmith:x:510:\ndevelopers:x:511:jsmith\n```\n\n### Hack 72. Setup SSH passwordless\
    \ login in OpenSSH\n\nYou can login to a remote Linux server without entering\
    \ password in 3 simple steps using `ssh-keygen` and `ssh-copy-id` as explained\
    \ in this example.\n\n`ssh-keygen` creates the public and private keys. `ssh-copy-id`\
    \ copies the localhost’s public key to the remote-host’s `authorized_keys` file.\
    \ `ssh-copy-id` also assigns proper permission to the remote-host’s home, `~/.ssh/`,\
    \ and `~/.ssh/authorized_keys`.\n\n#### Step 1: Create public and private keys\
    \ using `ssh-key-gen` on localhost\n\n```bash\njsmith@local-host$ssh-keygen\n\
    ```\n\n```text\nGenerating public/private rsa key pair.\nEnter file in which to\
    \ save the key\n(/home/jsmith/.ssh/id_rsa):[Enter key]\nEnter passphrase (empty\
    \ for no passphrase): [Press enter key]\nEnter same passphrase again: [Pess enter\
    \ key]\nYour identification has been saved in\n/home/jsmith/.ssh/id_rsa.\nYour\
    \ public key has been saved in\n/home/jsmith/.ssh/id_rsa.pub.\nThe key fingerprint\
    \ is:\n33:b3:fe:af:95:95:18:11:31:d5:de:96:2f:f2:35:f9\n```\n\n89\n![](images/00082.jpeg)Linux\
    \ Hack\nAjay Kumar Tiwari\n\n#### Step 2: Copy the public key to remote-host using\
    \ `ssh-copy-id`\n\n```bash\njsmith@local-host$ssh-copy-id -i ~/.ssh/id_rsa.pub\
    \ remote-host\n```\n\n```text\njsmith@remote-host’s password:\n```\n\nNow try\
    \ logging into the machine, with `ssh ‘remote-host’`, and check in: `.ssh/authorized_keys`\
    \ to make sure we haven’t added extra keys that you weren’t expecting.\n\nNote:\
    \ `ssh-copy-id` appends the keys to the remote-host’s `.ssh/authorized_key`.\n\
    \n#### Step 3: Login to remote-host without entering the password\n\n```bash\n\
    jsmith@local-host$ssh remote-host\n```\n\n```text\nLast login: Sun Nov 16 17:22:33\
    \ 2008 from 192.168.1.2\n[Note: SSH did not ask for password.]\njsmith@remote-host$\
    \ [Note: You are on remote-host here]\n```\n\n90\n![](images/00083.jpeg)Linux\
    \ Hack\nAjay Kumar Tiwari\n\n### Hack 73. Use `ssh-copy-id` along with `ssh-agent`\n\
    \nUsing `ssh-copy-id` along with the `ssh-add/ssh-agent`\n\nWhen no value is passed\
    \ for the option `-i` and if `~/.ssh/identity.pub` is not available, `ssh-copy-id`\
    \ will display the following error message.\n\n```bash\njsmith@local-host$ ssh-copy-id\
    \ -i remote-host\n```\n\n```text\n/usr/bin/ssh-copy-id: ERROR: No identities found\n\
    ```\n\nIf you have loaded keys to the `ssh-agent` using the `ssh-add`, then `ssh-copy-id`\
    \ will get the keys from the `ssh-agent` to copy to the remote-host. i.e, it copies\
    \ the keys provided by `ssh-add -L` command to the remote-host, when you don’t\
    \ pass `-i` to `ssh-copy-id`.\n\n```bash\njsmith@local-host$ ssh-agent $SHELL\n\
    jsmith@local-host$ ssh-add -L\nThe agent has no identities.\njsmith@local-host$\
    \ ssh-add\nIdentity added: /home/jsmith/.ssh/id_rsa (/home/jsmith/.ssh/id_rsa)\n\
    jsmith@local-host$ ssh-add -L\nssh-rsa AAAAB3NzaC1yc2EAAAABIwQEAsJILxftj8aSxMa3d8t6Jv9DArtPhTY7kIEMzApnyxsH1tQ/Ow==\
    \ /home/jsmith/.ssh/id_rsa\n```\n\n```bash\njsmith@local-host$ ssh-copy-id -i\
    \ remote-host jsmith@remote-host’s password:\n```\n\nNow try logging into the\
    \ machine, with `ssh ‘remote-host’`, and check in: `.ssh/authorized_keys` to make\
    \ sure we’t added extra keys that you weren’t expecting. [Note: This has added\
    \ the key displayed by `ssh-add -L`]\n\n91\n![](images/00084.jpeg)Linux Hack\n\
    \ Ajay Kumar Tiwari\n\n#### Three Annoyances of ssh-copy-id\n\nFollowing are few\
    \ minor annoyances of `ssh-copy-id`:\n\n1. **Default public key**: `ssh-copy-id`\
    \ uses `~/.ssh/identity.pub` as default public key file (i.e when no value is\
    \ passed to option `-i`). Instead, I wish it uses `id_dsa.pub`, `id_rsa.pub`,\
    \ or `identity.pub` as default keys. i.e If any one of them exist, it should copy\
    \ that to remote-host. If two or three of them exist, it should copy `identity.pub`\
    \ as default.\n2. **The agent has no identities**: When `ssh-agent` is running\
    \ and `ssh-add -L` returns “The agent has no identities” (i.e no keys are added\
    \ to `ssh-agent`), `ssh-copy-id` will still copy “The agent has no identities”\
    \ to the remote-host’s `authorized_keys` entry.\n3. **Duplicate entry in authorized_keys**:\
    \ I wish `ssh-copy-id` validates duplicate entry on the remote-host’s `authorized_keys`.\
    \ If you execute `ssh-copy-id` multiple times on localhost, it will keep appending\
    \ the same key on the remote-host’s `authorized_keys` file without checking for\
