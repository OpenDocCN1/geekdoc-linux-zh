  echo The Geek\n```\n带有特殊字符 `;` 的 echo 语句。分号是 bash 中的命令分隔符。在以下示例中，“The Geek”有效，而“Stuff”被视为独立的\
  \ Linux 命令并提示找不到命令。\n\n```bash\necho The Geek; Stuff\n-bash: Stuff: command not\
  \ found\n```\n为了避免这种情况，你可以在分号前面添加 `\\`，这将消除分号的特殊含义并直接打印它，如下所示。\n\n```bash\necho\
  \ The Geek\\; Stuff\nThe Geek; Stuff\n```\n\n单引号\n当你想要原样打印单引号内的内容时使用单引号。像 `$HOSTNAME`\
  \ 这样的特殊变量也会打印 `$HOSTNAME`，而不是 Linux 主机名。\n\n```bash\necho 'Hostname=$HOSTNAME ;\
  \ Message=\\$ is USD'\n```\n输出：\n`Hostname=$HOSTNAME ; Message=$ is USD`\n\n双引号\n\
  当你想要显示特殊变量的真实含义时使用双引号。\n\n```bash\necho \"Hostname=$HOSTNAME ; Message=\\$ is USD\"\
  \n```\n输出：\n`Hostname=dev-db ; Current User=ramesh ; Message=$ is USD`\n\n双引号将移除所有以下字符的特殊含义：\n\
  - `$` 参数替换。\n- `` `` 反引号\n- `\\$` 字面美元符号。\n- `\\´` 字面反引号。\n- `\\\"` 嵌套双引号。\n- `\\\
  \\` 嵌套反斜杠。\n\n# Hack 88. 在 shell 脚本内部读取数据字段\n\n此示例演示了如何从数据文件中读取特定字段并进行处理。例如，假设 `employees.txt`\
  \ 文件的格式为 `{员工姓名}:{员工 ID}:{部门名称}`，冒号分隔的文件如下所示。\n\n```bash\ncat employees.txt\nEmma\
  \ Thomas:100:Marketing\nAlex Jason:200:Sales\nMadison Randy:300:Product Development\n\
  Sanjay Gupta:400:Support\nNisha Singh:500:Sales\n```\n\n\n\n以下 shell 脚本解释了如何从 `employee.txt`\
  \ 文件读取特定字段。\n\n```bash\n$ vi read-employees.sh\n\n#!/bin/bash\n\nIFS=:\n\necho \"\
  Employee Names:\"\n\necho \"---------------\"\n\nwhile read name empid dept\ndo\n\
  \  echo \"$name is part of $dept department\"\ndone < ~/employees.txt\n```\n\n为\
  \ shell 脚本分配执行权限并运行它。\n\n```bash\n$ chmod u+x read-employees.sh\n$ ./read-employees.sh\n\
  ```\n\n```\nEmployee Names:\n---------------\nEmma Thomas is part of Marketing department\n\
  Alex Jason is part of Sales department\nMadison Randy is part of Product Development\
  \ department\nSanjay Gupta is part of Support department\nNisha Singh is part of\
  \ Sales department\n```\n\n## 第 12 章：系统监控与性能\n\n### 技巧 89：free 命令\n\n`free` 命令显示关于系统物理内存（RAM）和交换内存（swap）的所有必要信息。\n\
  \n语法：`free [options]`\n\n### 我的系统总内存是多少？\n\n在下面的示例中，该系统的总物理内存为 1GB。下方显示的数值为 KB。\n\
  \n```bash\n# free\n              total        used        free      shared  buffers/cache\
  \   cached\nMem:       10346241 1066996    2166688 117956      27928     174136\
  \      615892\nSwap:       2031608           0       2031608\n```\n\n### 我的系统包含\
  \ RAM 和 Swap 的总内存是多少？\n\n在以下命令中：\n- 选项 `-m` 以 MB 显示数值。\n- 选项 `-t` 显示“Total”行，它是物理内存和交换内存数值的和。\n\
  - 选项 `-o` 用于隐藏上述示例中的 buffers/cache 行。\n\n```bash\n# free -mto\n               total\
  \        used        free\nshared  buffers  cache   cached\nMem:          1010 \
  \        983           0\nSwap:          1983         983           0\nTotal:  \
  \        2994        1966           0\n```\n\n### 技巧 90：Top 命令\n\n`top` 命令显示系统各种性能指标的实时信息，例如\
  \ CPU 负载、内存使用、进程列表等。\n\n语法：`top [options]`\n\n### 如何查看我的当前系统状态包括 CPU 使用率？\n\n从命令行中不带任何选项执行\
  \ `top`，这将显示所示的输出。`top` 命令的输出将持续显示实时值，直到你按下“Control + c”或 `q` 退出输出。\n\n```bash\n\
  #top\ntop - 13:10:13 up 171 days, 20:21, 3 users, load average: 0.01, 0.05, 0.00\n\
  Tasks: 194 total, 1 running, 193 sleeping, 0 stopped, 0 zombie\nCpu(s): 0.6% us,\
  \ 0.7% sy, 0.0% ni, 98.7% id, 0.0% wa, 0.0% hi, 0.0% si\nMem: 1034624k total, 1007420k\
  \ used, 27204k free, 174540k buffers\nSwap: 2031608k total, 0k used, 2031608k free,\
  \ 615904k cached\nPID USER PR NI VIRT RES\n11912 apache 15 0 31828\n19299 oracle\
  \ 19 0 279m\n11398 jsmith 16 0 107m\nSHR S %CPU %MEM TIME+ COMMAND\n13m 3916 S10.2\
  \ 0:46.35 httpd\n18m 17m S10.2 0:00.03 oracle\n28m 6404 S00.4 0:03.07 perl\n```\n\
  \n### 如何解读上述所示的 top 命令输出？\n\n- 第 1 行“top”，表示系统已运行了 171 天。\n- 第二行“Tasks”，显示进程总数，以及运行、睡眠、停止和僵尸（zombie）进程数量的细分。\n\
  - 第 3 行“Cpu(s)”显示系统当前的 CPU 利用率。在例例中，CPU 空闲率为 98.7%。\n- 第 4 行“Mem”和第 5 行“Swap”提供内存信息。这与\
  \ `free` 命令提供的信息相同。\n- 剩余行显示系统上所有的活动进程，默认按 CPU 使用率（`%CPU` 列）排序。即 CPU 密集型最核心的进程默认会显示在最上方。\n\
  \n`top` 命令有多个命令行选项和交互式选项可用。让我们来复习一下 `top` 命令的几个基本选项。\n\n### 如何识别内存使用率最密集的进程？\n\n\
  当 `top` 命令的输出显示时，按下 `F`，它会显示以下消息并显示所有可用排序字段，按下 `n`（用于按内存排序进程）并按回车。这将按内存使用情况对顶部输出中的进程排序。\n\
  \n`Current Sort Field: K for window 1:Def`\n`通过字段字母选择排序字段，按其他键返回`\n\n### 如何向顶部输出中添加额外字段（例如\
  \ CPU 时间）？\n\n当 `top` 命令运行时，按下 `f`，它会显示以下消息并显示所有可用显示字段，按下 `l`，将 CPU 时间添加到顶部输出的显示列中。\n\
  \n`Current Fields: AEHIOQTWKNMbcdfgjplrsuvyzX for window 1:Def`\n`通过字段字母切换字段，按其他键返回`\n\
  \n### 如何获取运行进程的完整路径名和参数？\n\n当 `top` 命令运行时，按下 `c`，它将在 `COMMAND` 列中显示运行进程的完整路径名。它不再只显示进程名称，而是显示完整路径。\n\
  \n\n\n\n\nAjay Kumar Tiwari\n\n### 技巧 92. Df 命令\n\n`df` 命令（disk free）用于显示挂载文件系统上可用的总磁盘空间和可用空间。\n\
  \n语法：`df [options] [name]`\n\n### 我的系统有多少 GB 的可用磁盘空间？\n\n如下所示，使用 `df -h`。`-h` 选项以人类可读的格式显示值（例如：K\
  \ 代表 Kb，M 代表 Mb，G 代表 Gb）。在下方的示例输出中，`/` 文件系统有 17GB 可用磁盘空间，`/home/user` 文件系统有 70GB\
  \ 可用。\n\n```bash\ndf -h\nFilesystem Size Used Avail Use% Mounted on\n/dev/sda1 64G\
  \ 44G 17G 73% /\n/dev/sdb1 137G 67G 70G 49% /home/user\n```\n\n### 我的系统中是什么种类型的文件系统？\n\
  \n`-T` 选项将显示文件系统类型（Type）的信息。在此示例中，`/` 和 `/home/user` 文件系统是 `ext2`。`-a` 选项将显示所有文件系统，包括系统使用的大小为\
  \ 0 的特殊文件系统。\n\n```bash\ndf -Tha\nFilesystem Type Size Used Avail Use% Mounted on\n\
  /dev/sda1 ext2 64G 44G 17G 73% /\n/dev/sdb1 ext2 137G 67G 70G 49% /home/user\nnone\
  \ proc - /proc\nnone sysfs - /sys\nnone devpts - /dev/pts\nnone tmpfs 2.0G 0 2.0G\
  \ 0% /dev/shm\n```\n\n### 技巧 93. Kill 命令\n\n`kill` 命令可用于终止正在运行的进程。通常，此命令用于杀死挂起且没有响应的进程。\n\
  \n语法：`kill [options] [pids|commands]`\n\n### 如何杀死挂起的进程？\n\n首先，使用 `ps` 命令识别你想要杀死的特定进程的进程\
  \ ID（PID）。一旦知道了进程 ID，将其作为参数传递给 `kill` 命令。下面的示例显示了如何杀死挂起的 apache httpd 进程。请注意，通常你应该使用\
  \ `apachectl stop` 来停止 apache。\n\n```bash\nps aux | grep httpd\nUSER PID %CPU %MEM\
  \ VSZ RSS TTY STAT START TIME COMMAND\napache 31186 0.01.6 23736 17556 ?S Jul26\
  \ 0:40 /usr/local/apache2/bin/httpd\napache 31187 0.01.3 20640 14444 ?S Jul26 0:37\
  \ /usr/local/apache2/bin/httpd\nkill 31186 31187\n```\n\n请注意，上述命令尝试通过发送名为 `SIGTERM`\
  \ 的信号来优雅地终止进程。如果进程没有被终止，可以通过传递名为 `SIGKILL` 的信号来强制终止进程，如下所示使用 `-9` 选项。你必须是该进程的所有者或特权用户才能杀死进程。\n\
  \n```bash\nkill -9 31186 31187\n```\n\n轻松杀死多个进程的另一种方法是通过 `.bash_profile` 添加以下两个函数。\n\
  \n```bash\nfunction psgrep ()\n{\n  ps aux | grep \"$1\" | grep -v 'grep'\n}\n\n\
  function psterm ()\n{\n  [ ${#} -eq 0 ] && echo \"usage: $FUNCNAME STRING\" && return\
  \ 0\n  local pid\n  pid=$(ps ax | grep \"$1\" | grep -v grep | awk '{ print $1 }')\n\
  \  echo -e \"terminating '$1' / process(es):\\n$pid\"\n  kill -SIGTERM $pid\n}\n\
  ```\n\n现在执行以下操作，识别并杀死所有的 httpd 进程。\n\n```bash\npsgrep http\nUSER PID %CPU %MEM VSZ\
  \ RSS TTY STAT START TIME COMMAND\napache 31186 0.01.6 23736 17556 ?S Jul26 0:40\
  \ /usr/local/apache2/bin/httpd\napache 31187 0.01.3 20640 14444 ?S Jul26 0:37 /usr/local/apache2/bin/httpd\n\
  \npsterm httpd\nterminating 'httpd' / process(es):\n31186\n31187\n```\n\n### 技巧\
  \ 94. Du 命令\n\n`du` 命令（disk usage）将打印特定目录及其子目录的文件空间占用情况。\n\n### 我的主目录及其所有子目录占用了多少空间？\n\
  \n在接下来的示例中，`-s` 选项代表仅摘要（summary only）。即它只显示 `/home/jsmith` 的总大小，而不显示 `/home/jsmith`\
  \ 内部所有子目录的大小。`-h` 选项以人类可读的格式显示信息。即 K 代表 KB，M 代表 MB，G 代表 GB。`~` 表示用户目录。此命令等同于 `du\
  \ -sh /home/jsmith`。\n\n```bash\ndu -sh ~\n```\n\n要列出 `/home/jsmith` 下的子目录，请在不带\
  \ `s` 选项的情况下执行上述命令。\n\n### 技巧 95. Lsof 命令\n\n`lsof`（list open files）将列出特定目录及其子目录的文件空间占用情况（*注：此处原文逻辑可能有误，按字意翻译*）。*纠正：此处原文将\
  \ `du` 的描述与 `lsof` 衔接错乱，以下根据上下文翻译*：\n\n重新梳理翻译：\n### 技巧 94. Du 命令\n\n`du` 命令（disk\
