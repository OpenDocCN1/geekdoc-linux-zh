  ```bash\nCommand (m for help):q\n```\n\n## 技巧 66. 使用 mke2fsk 格式化分区\n\n对磁盘分区后，它仍然无法使用，因为我们需要格式化磁盘。在此阶段，如果你尝试查看磁盘信息，它将返回以下错误消息，表示没有有效的超级块。\n\
  \n```bash\n#tune2fs -l /dev/sda1\n```\ntune2fs 1.35 (28-Feb-2004)\ntune2fs: 在尝试打开\
