  \    - 监控 `top`\n    - 实时监控 使用 `htop`\n\n\n\n\n\n## 方法 1：使用“..n”向上导航目录\n\n在下面的示例中，`..4`\
  \ 用于返回 4 级目录，`..3` 用于返回 3 级目录，`..2` 用于返回 2 级目录。请将以下别名添加到你的 `~/.bash_profile` 中并重新登录。\n\
  \n```bash\nalias ..=\"cd ..\"\nalias ..2=\"cd ../..\"\nalias ..3=\"cd ../../..\"\
  \nalias ..4=\"cd ../../../..\"\nalias ..5=\"cd ../../../../../..\"\n```\n\n```bash\n\
  # cd \n/tmp/very/long/directory/structure/that/is/too/deep\n# ..4\n```\n[注：使用 `..4`\
  \ 返回 4 级目录]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure/\n```\n\n## 方法\
  \ 2：仅使用点号向上导航目录\n\n在下面的示例中，`.....`（五个点）用于返回 4 级目录。通过输入 5 个点来返回 4 级目录结构非常容易记忆，因为当你输入前两个点时，你想的是“返回上一级目录”，之后每多一个点，就向上移动一级。所以，使用\
  \ `....`（四个点）返回 3 级目录，使用 `..`（两个点）返回 1 级目录。请将以下别名添加到你的 `~/.bash_profile` 中并重新登录，以使\
  \ `.....`（五个点）能够正常工作。\n\n```bash\nalias ..=\"cd ..\"\nalias ...=\"cd ../..\"\nalias\
  \ ....=\"cd ../../..\"\nalias .....=\"cd ../../../..\"\nalias ......=\"cd ../../../../../..\"\
  \n```\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n# .....\n\
  ```\n[注：使用 `.....`（五个点）返回 4 级目录]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure/\n\
  ```\n\n## 方法 3：使用 cd 后接连续点号向上导航目录\n\n在下面的示例中，`cd.....`（cd 后接五个点）用于返回 4 级目录。将其设置为\
  \ 5 个点来返回 4 级目录结构非常容易记忆，因为当你输入前两个点时，你想的是“返回上一级目录”，之后每多一个点，就向上移动一级。所以，使用 `cd....`（cd\
  \ 后接四个点）返回 3 级目录，使用 `cd...`（cd 后接三个点）返回 2 级目录。请将以下别名添加到你的 `~/.bash_profile` 中并重新登录，以使上述\
  \ `cd.....`（五个点）能够正常工作。\n\n```bash\nalias cd..=\"cd ..\"\nalias cd...=\"cd ../..\"\
  \nalias cd....=\"cd ../../..\"\nalias cd.....=\"cd ../../../..\"\nalias cd......=\"\
  cd ../../../../../..\"\n```\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n\
  # cd.....\n```\n[注：使用 `cd.....` 返回 4 级目录]\n\n```bash\n# pwd\n/tmp/very/long/directory/structure\n\
  ```\n\n## 方法 5：使用 cd 后接数字向上导航目录\n\n在下面的示例中，`cd4`（cd 后接数字 4）用于返回 4 级目录。\n\n```bash\n\
  alias cd1=\"cd ..\"\nalias cd2=\"cd ../..\"\nalias cd3=\"cd ../../..\"\nalias cd4=\"\
  cd ../../../..\"\nalias cd5=\"cd ../../../..\"\n```\n\n### 技巧 3：使用单个命令执行 mkdir 和\
  \ cd\n\n有时当你创建一个新目录时，你可能需要立即 `cd` 进入新目录以执行某些工作，如下所示。\n\n```bash\n# mkdir -p /tmp/subdir1/subdir2/subdir3\n\
  cd /tmp/subdir1/subdir2/subdir3\n/tmp/subdir1/subdir2/subdir3\n```\n\n如果能用一个命令同时完成\
  \ `mkdir` 和 `cd` 那不是更好吗？请将以下内容添加到 `.bash_profile` 并重新登录。\n\n```bash\n$ vi .bash_profile\n\
  function mkdircd () { mkdir -p \"$@\" && cd \"$@\"; }\n```\n\n现在，使用单个命令同时执行 `mkdir`\
  \ 和 `cd`，如下所示：\n\n```bash\n# mkdircd /tmp/subdir1/subdir2/subdir3\n```\n[注：这会自动创建目录并进入该目录]\n\
  \n```bash\n# pwd\n/tmp/subdir1/subdir2/subdir3\n```\n\n### 技巧 4：使用“cd -”在两个目录间切换\n\
  \n你可以使用 `cd -` 在最后两个目录间切换，如下所示。\n\n```bash\n# cd /tmp/very/long/directory/structure/that/is/too/deep\n\
  cd /tmp/subdir1/subdir2/subdir3\n# cd -\n/tmp/very/long/directory/structure/that/is/too/deep\n\
  # cd -\n/tmp/subdir1/subdir2/subdir3\n# cd -\n/tmp/very/long/directory/structure/that/is/too/deep\n\
  \n### 技巧 5：使用 dirs, pushd 和 popd 操作目录栈\n\n你可以使用目录栈将目录推入并在稍后从栈中弹出。本示例使用了以下命令：\n\n\
  - `dirs`: 显示目录栈\n- `pushd`: 将目录推入栈\n- `popd`: 从栈中弹出目录并进入\n\n`dirs` 总是先打印当前目录，然后是栈的内容。即使目录栈为空，`dirs`\
  \ 命令也会打印当前目录，如下所示。\n\n```bash\n# popd\n# dirs\n/home/ram\n```\n\n如何使用 `pushd` 和\
  \ `popd`？让我们首先创建一些目录并将它们推入栈，如下所示。\n\n```bash\nmkdir /tmp/dir1\nmkdir /tmp/dir2\n\
  mkdir /tmp/dir3\nmkdir /tmp/dir4\n# cd /tmp/dir1\npushd .\n# cd /tmp/dir2\npushd\
  \ .\n# cd /tmp/dir3\npushd .\n# cd /tmp/dir4\npushd .\n```\n\n```bash\n# dirs\n\
  /tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1\n```\n[注：`dirs` 输出的第一个目录（`/tmp/dir4`）总是当前目录，而不是栈的内容。]\n\
  \n在此阶段，目录栈包含：\n`/tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1`\n\n最后推入栈的目录位于栈顶。当你执行 `popd`\
  \ 时，它将进入栈顶项并从栈中移除。如上所示，最后推入栈的目录是 `/tmp/dir4`。所以，当我们执行 `popd` 时，它将进入 `/tmp/dir4`\
  \ 并从目录栈中移除，如下所示。\n\n```bash\n# popd\n# pwd\n/tmp/dir4\n```\n[注：执行上述 `popd` 后，目录包含\
  \ `/tmp/dir3 /tmp/dir2 /tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir3\n```\n[注：执行上述\
  \ `popd` 后，栈：`/tmp/dir2 /tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir2\n```\n\
  [注：执行上述 `popd` 后，栈：`/tmp/dir1`]\n\n```bash\n# popd\n# pwd\n/tmp/dir1\n```\n[注：执行上述\
  \ `popd` 后，目录为空！]\n\n### 技巧 6：使用“shopt -s cdspell”自动修正 cd 中拼写错误的目录名\n\n使用 `shopt\
  \ -s cdspell` 自动修正 `cd` 命令中的拼写错误，如下所示。如果你不擅长输入且经常出错，这将非常有帮助。\n\n```bash\n# cd /etc/mall\n\
  bash: cd: /etc/mall: No such file or directory\nshopt -s cdspell\n# cd /etc/mall\n\
  # pwd\n/etc/mail\n```\n[注：错误地，当我输入 `mall` 而不是 `mail` 时，`cd` 自动修正了它]\n\n## 第二 章：日期操作\n\
  \n### 技巧 7：设置系统日期和时间\n\n更改系统日期使用：`mmddhhmiyyyy.ss`\n\n- `mm`: 月\n- `dd`: 日\n- `hh`:\
  \ 24 小时制\n- `mi`: 分\n- `yyyy`: 年\n- `ss`: 秒\n\n例如，将系统日期设置为 2008 年 1 月 31 日晚上 10:19\
  \  53 秒：\n\n```bash\ndate 013122192009.53\n```\n\n你也可以使用 `set` 参数更改系统日期，如下所示。\n\n\
  ```bash\ndate 013122192009.53\ndate +%Y%m%d -s \"20090131\"\ndate -s \"01/31/2009\
  \ 22:19:53\"\ndate -s \"31 JAN 2009 22:19:53\"\ndate set=\"31 JAN 2009 22:19:53\"\
  \n```\n\n仅设置时间时：\n\n```bash\ndate +%T -s \"22:19:53\"\ndate +%T%p -s \"10:19:53PM\"\
  \n```\n\n\n\n\n以下是各种不同格式显示当前日期和时间的方法：\n\n```bash\n$ date\nThu Jan 1 08:19:23 PST\
  \ 2009\n\n$ date --date=\"now\"\nThu Jan 1 08:20:05 PST 2009\n\n$ date --date=\"\
  today\"\nThu Jan 1 08:20:12 PST 2009\n\n$ date --date='1970-01-01 00:00:01 UTC +5\
  \ hours' +%s\n18001\n\n$ date '+Current Date: %m/%d/%y%nCurrent Time:%H:%M:%S'\n\
  Current Date: 01/01/09\nCurrent Time:08:21:41\n\n$ date +\"%d-%m-%Y\"\n01-01-2009\n\
  \n$ date +\"%d/%m/%Y\"\n01/01/2009\n\n$ date +\"%A,%B %d %Y\"\nThursday,January\
  \ 01 2009\n```\n\n以下是你可以传递给 `date` 命令的各种格式选项：\n\n- `%D` 日期 (mm/dd/yy)\n- `%d` 月中的几\
  \ (01..31)\n- `%m` 月份 (01..12)\n- `%y` 年的最后两位 (00..99)\n- `%a` 语言环境缩写的星期几名称 (Sun..Sat)\n\
  - `%A` 语言环境完整的星期名称，长度可 (Sunday..Saturday)\n- `%b` 语言环境缩写的月份名称 (Jan..Dec)\n- `%B`\
  \ 语言环境完整的月份名称，长度可 (January..December)\n- `%H` 小时 (00..23)\n- `%I` 小时 (01..12)\n\
  - `%Y` 年 (1970…)\n\n### 10. 显示过去的日期和时间\n\n以下是显示过去日期和时间的各种方法：\n\n```bash\n$ date\
  \ --date='3 seconds ago'\nThu Jan 1 08:27:00 PST 2009\n\n$ date --date=\"1 day ago\"\
  \nWed Dec 31 08:27:13 PST 2008\n\n$ date --date=\"1 days ago\"\nWed Dec 31 08:27:18\
  \ PST 2008\n\n$ date --date=\"1 month ago\"\nMon Dec 1 08:27:23 PST 2008\n\n$ date\
  \ --date=\"1 year ago\"\nTue Jan 1 08:27:28 PST 2008\n\n$ date --date=\"yesterday\"\
  \nWed Dec 31 08:27:34 PST 2008\n\n$ date --date=\"10 months 2 day ago\"\nThu Feb\
  \ 28 08:27:41 PST 2008\n```\n\n### 11. 显示未来的日期和时间\n\n以下示例显示了如何显示未来的日期和时间。\n\n```bash\n\
  $ date\nThu Jan 1 08:30:07 PST 2009\n\n$ date --date='3 seconds'\nThu Jan 1 08:30:12\
  \ PST 2009\n\n$ date --date='4 hours'\nThu Jan 1 12:30:17 PST 2009\n\n$ date --date='tomorrow'\n\
  Fri Jan 2 08:30:25 PST 2009\n\n$ date --date=\"1 day\"\nFri Jan 2 08:30:31 PST 2009\n\
  \n$ date --date=\"1 days\"\nFri Jan 2 08:30:38 PST 2009\n\n$ date --date=\"2 days\"\
  \nSat Jan 3 08:30:43 PST 2009\n\n$ date --date='1 month'\nSun Feb 1 08:30:48 PST\
  \ 2009\n\n$ date --date='1 week'\nThu Jan 8 08:30:53 PST 2009\n\n$ date --date=\"\
  2 months\"\nSun Mar 1 08:30:58 PST 2009\n\n$ date --date=\"2 years\"\nSat Jan 1\
  \ 08:31:03 PST 2011\n\n$ date --date=\"next day\"\nFri Jan 2 08:31:10 PST 2009\n\
  \n$ date --date=\"-1 days ago\"\nFri Jan 2 08:31:15 PST 2009\n\n$ date --date=\"\
  this Wednesday\"\nWed Jan 7 00:00:00 PST 2009\n```\n\n## 第 3 章：SSH 客户端命令\n\n###\
  \ 12. 识别 SSH 客户端版本\n\n有时可能需要识别当前运行的 SSH 客户端及其对应的版本号。使用 `ssh -V` 来识别版本号。请注意 Linux\
  \ 自带了 OpenSSH。\n\n以下示例表明该系统正在使用 OpenSSH：\n```bash\n$ ssh -V\nOpenSSH_3.9p1, OpenSSL\
  \ 0.9.7\n```\n\n另一个示例表明该系统正在使用 SSH2：\n```bash\n$ ssh -V\nOpenSSH_2.2.9 (non-commercial\
  \ version) x86_64-pc-\n```\n\n### 13. 登录远程主机\n\n当你第一次通过 SSH 登录远程主机时，可能需要确认其 SSH\
  \ 密钥指纹。\n\n### 14. 调试 SSH 客户端会话\n\n### 15. 使用转义字符切换 SSH 会话\n\n\n\n3. 要临时返回本地，请输入转义字符\
  \ `~` 并按下 `Control-Z`。\n\n当你输入 `~` 时，屏幕上不会立即显示，直到你按下 `<Control-Z>` 并按回车。因此，在 `remotehost`\
  \ 的新行中输入以下按键以使下方操作生效：`~<Control-Z>`\n\n```bash\nremotehost$~^Z\n[1]+ Stopped ssh\
  \ -l jsmith remotehost\nlocalhost$\n```\n\n4. 现在你已回到本地，且 `ssh` `remotehost` 客户端会话作为一个典型的\
  \ UNIX 后台作业运行，你可以如下所示进行检查：\n\n```bash\nlocalhost$jobs\n[1]+ Stopped ssh -l jsmith\
  \ remotehost\n```\n\n5. 你可以通过在本地将后台的 `ssh` `remotehost` 会话作业带回前台，无需再次输入密码即可回到主机\
  \ `ssh`。\n\n```bash\nlocalhost$fg %1\nssh -l jsmith remotehost\nremotehost$\n```\n\
  \n\n28\n![](img/00023.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n### Hack 16. 使用 SSH\
  \ 转义字符获取 SSH 会话统计信息\n\n要获取当前 `ssh` 会话的一些有用统计，请执行以下操作。这仅适用于 SSH2 客户端。\n\n1. 从 `localhost`\
  \ 登录到 `remotehost`。\n\n```bash\nlocalhost$ ssh -l jsmith remotehost\n```\n\n2. 在\
  \ `remotehost` 上，输入 SSH 转义字符 `~` 后接 `s`，如下所示。这将显示关于当前 `SSH` 连接的许多有用统计信息。\n\n```bash\n\
  remotehost$ [注意：在输入命令时，命令行上不会显示 ~s。]\n      remote host: remotehost\n      local\
  \ host: localhost\n      remote version: SSH-1.99-OpenSSH_3.9p1\n      local version:\
  \ SSH-2.0-3.2.9.1 SSH Secure Shell (non-commercial)\n      compressed bytes in:\
  \ 1506\n      uncompressed bytes in: 1622\n      compressed bytes out: 4997\n  \
  \    uncompressed bytes out: 5118\n      packets in: 15\n      packets out: 24\n\
