  \ 40961384net.ipv6.route.mtu_expires = 600sunrpc.udp_slot_table_entries = 16vm.block_dump\
  \ = 0### 修改 /etc/sysctl.conf 中的内核参数以永久更改在 `/etc/sysctl.conf` 中修改内核参数后，执行 `sysctl\
  \ –p` 以提交更改。重启后更改仍然存在。```bashvi /etc/sysctl.confsysctl –p```### 临时修改内核参数要临时修改内核参数，请执行以下命令。请注意重启后这些更改将会丢失。```bashsysctl\
  \ –w {variable-name=value}```![](img/0120.jpeg) Linux Hack\nAjay Kumar Tiwari\n\n\
  ## 技巧 100. Nice 命令内核根据 nice 值决定进程需要多少处理器时间。可能的 nice 值范围是：-20 到 20。nice 值为 -20 的进程优先级很高。nice\
  \ 值为 20 的进程优先级非常低。使用 `ps aux` 显示所有运行进程的 nice 值如下所示。\n\n```bash\nps aux\n```\nFUIDPID\
  \ PPID PRI NIVSZ RSS WCHAN STAT TTY TIME COMMAND\n4010 160 2172 552 -S? 0:17 init\
  \ [5]\n1031 34 1900 ksofti SN? 3:18 [ksoftirqd/0]\n101015 -1000 0:01 [events/0]\n\
  40 51451 25 10 32124 18592 -SNs ? 0:08 /usr/bin/python /usr/bin/rhn-applet --sm-client-id\
  \ default4\n40 51477 5142 160 3528 604 -S? 0:00 /sbin/pam_timestamp_check -d root\n\
  1503 17552 4180 160 14208 3920 -S? 0:01 /home/www/apache2/bin/httpd -f /home/www/apache2/conf/httpd.conf\
  \ -k start\n\n### 如何为 shell 脚本分配低优先级（较高的 nice 值）\n在下面的示例中，当我在后台启动 `nice-test.sh`\
  \ 脚本时，它的 nice 值为 0。\n\n```bash\n./nice-test.sh &\n[3] 13009\n$ ps aux | grep nice-test\n\
  0509 13009 12863 170 4652 972 wait S 132 pts/1 0:00 /bin/bash ./nice-test.sh\n```\n\
  \n现在，让我们用不同的 nice 值执行相同的 shell 脚本，如下。\n\n```bash\nnice -10 ./nice-test.sh &\n```\n\
  \n\n\n\n\n# [1] 13016\n\n```\n$ ps axl | grep nice-test\n0509 13016 12863 30 10\
  \ 4236 968 wait\npts/10:00 /bin/bash ./nice-test.sh\n```\n\n[注：第 6 列的值 10 是该 shell\
  \ 脚本的 nice 值。]\n\n## 如何为 shell 脚本分配高优先级（低 nice 值）\n\n在下面的示例中，让我们为 `nice-test.sh`\
  \ shell 脚本分配一个 -10（负 10）的 nice 值。\n\n```bash\n$nice --10 ./nice-test.sh &\n```\n\
  \n[1] 13021\n\n```bash\n$ nice: cannot set priority: Permission denied\n```\n\n\
  注意：只有 root 用户可以设置负的 nice 值。请以 root 身份登录并尝试相同操作。请注意，下方 `nice` 命令中的 10 之前有一个双横杠。\n\
  \n```bash\n#nice --10 ./nice-test.sh &\n```\n\n[1] 13060\n\n```bash\n# ps axl |\
  \ grep nice-test\n40 13060 13024 10 -10 5388 964 wait\npts/10:00 /bin/bash ./nice-test.sh\n\
  ```\n\n![](img/00122.jpeg) Linux Hack - Ajay Kumar Tiwari\n\n[注：第 6 列的值 -10 是该 shell\
  \ 脚本的 nice 值。]\n\n### 技巧 101：renice 命令\n\n`renice` 用于更改正在运行进程的调度优先级。\n\n### 如何降低运行进程的优先级（增加\
  \ nice 值）\n\n在下面的示例中，一个现有的 shell 脚本正以 nice 值 10 运行（`ps` 输出的第 6 列）。\n\n```bash\n\
  $ ps axl | grep nice-test\n0509 13245 13216 30 10 5244 968 wait\npts/10:00 /bin/bash\
  \ ./nice-test.sh\n```\n\n要增加 nice 值（从而降低优先级），请如下方所示执行 `renice` 命令。\n\n```bash\n\
  $renice 16 -p 13245\n13245: old priority 10, new priority 16\n$ ps axl | grep nice-test\n\
  0509 13245 13216 36 16 5244 968 wait\npts/10:00 /bin/bash ./nice-test.sh\n```\n\n\
  [注：现在，`nice-test.sh` (PID `13245`) 的第 6 列显示了新的 nice 值 16。]\n\n### 如何提高运行进程的优先级（减少\
  \ nice 值）\n\n在下面的示例中，一个现有的 shell 脚本正以 nice 值 10 运行（`ps` 输出的第 6 列）。\n\n```bash\n\
  $ ps axl | grep nice-test\n0509 13254 13216 30 10 4412 968 wait\npts/10:00 /bin/bash\
  \ ./nice-test.sh\n```\n\n要提高优先级，请如下方所示赋予更低的 nice 值。然而，只有 root 可以提高运行进程的优先级，否则你会收到以下错误消息。\n\
  \n```bash\n$renice 5 -p 13254\nrenice: 13254: setpriority: Permission denied\n```\n\
  \n以 root 身份登录以提高运行进程的优先级：\n\n```bash\n$ su -\n#renice 5 -p 13254\n13254: old priority\
  \ 10, new priority 5\n# ps axl | grep nice-test\n0509 13254 13216 255 4412 968 wait\n\
  pts/10:00 /bin/bash ./nice-test.sh\n```\n\n[注：第 6 列现在显示了更低的 nice 值 5（优先级已提高）]\n\n\
