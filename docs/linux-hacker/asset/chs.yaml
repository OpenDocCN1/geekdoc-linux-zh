  \ 27. Diff 命令\n\n`diff` 命令比较两个不同的文件并报告差异。输出非常晦涩，不易直接阅读。\n\n语法：`diff [options] file1\
  \ file2`\n\n### 与旧文件比较时，我的新文件中修改了什么？\n`diff` 命令中的 `-w` 选项在执行比较时会忽略空格。\n\n在以下 diff\
  \ 输出中：\no\n`---` 之上的行表示更改发生在 `diff` 命令中的第一个文件（即 `name_list.txt`）。\n\n\n\n\n\n下几行\
  \ --- 表示在 `diff` 命令中对第二个文件（即 `name_list_new.txt`）所发生的更改。属于第一个文件的行以 `<` 开头，第二个文件的行以\
  \ `>` 开头。\n\n```bash\n#diff -w name_list.txt name_list_new.txt\n2c2,3\n< John Doe\n\
  ---\n> John M Doe\n> Jason Bourne\n> Ajay Kumar Tiwari\n```\n\n### 28. 显示用户的总连接时间\n\
  `ac` 命令将显示关于用户连接时间的统计信息。\n\n### 当前登录用户的连接时间\n使用 `-d` 选项，它可以将输出按天进行细分。在这个示例中，我今天登录系统已超过了\
  \ 6 小时。在 12 月 1 日，我登录了大约 1 小时。\n\n```bash\n$ac -d\n```\nDec 1 | Dec 2 | Dec 3 |\
  \ Dec 4 | Today\ntotal: 1.08 | 0.99 | 3.39 | 4.50 | 6.10\n\n```\n\n### 所有用户的连接时间\n\
  要显示所有用户的连接时间，请像所示使用 `-p`。请注意，这表示每个用户的累计连接时间。\n\n```bash\n$ac -p\n```\njohn: 3.64\n\
  madison: 0.06\nsanjay: 88.17\nnisha: 105.92\nramesh: total 309.21\nAjay Kumar Tiwari:\
  \ 111.42\n\n```\n\n### 特定用户的连接时间\n要获取特定用户的连接时间报告，请执行以下命令：\n\n```bash\n$ac -d sanjay\n\
  ```\nJul 2 | Aug 25 | Sep 3 | Sep 4 | Dec 24 | Dec 29 | Today\ntotal: 12.85 | 5.05\
  \ | 1.03 | 5.37 | 8.15 | 1.42 | 2.95\n\n```\n\n## 第 5 章：PS1, PS2, PS3, PS4 和 PROMPT_COMMAND\n\
  \n### 29. PS1 - 默认交互提示符\n你 Linux 上的默认交互提示符可以像下面这样修改为更有用且包含信息的内容。在以下示例中，默认的 `PS1`\
  \ 为 `\\s-\\v\\$`，它显示 shell 名称和版本号。让我们将此默认行为更改为所示的用户名、主机名和当前工作目录名称。\n\n```bash\n\
  -bash-3.2$\nexport PS1=\"\\u@\\h \\w> \"\nramesh@dev-db ~> cd /etc/mail\nramesh@dev-db\
  \ /etc/mail>\n```\n[注：提示符更改为“username@hostname current-dir>”格式]\n\n本示例使用了以下 `PS1`\
  \ 代码：\n- `\\u` – 用户名\n- `\\h` – 主机名\n- `\\w` - 当前目录的完整路径。请注意，当你处于主目录时，它将像上面所示仅显示\
  \ `~`\n\n请注意 `PS1` 值的末尾有一个空格。我个人更倾向于在提示符末尾留一个空格以获得更好的可读性。\n\n通过将 `export PS1=\"\\\
  u@\\h \\w> \"` 添加到如下所示的 `.bash_profile`（或）`.bashrc` 中，使此设置永久生效。\n\n```bash\nramesh@dev-db\
  \ ~> vi ~/.bash_profile\nramesh@dev-db ~> vi ~/.bashrc\n```\n[注：在上述任一文件中添加 `export\
  \ PS1=\"\\u@\\h \\w> \"`]\n\n请参阅下一章详细了解 `PS1` 使用的多个实用示例。\n\n### 30. PS2 - 续行交互提示符\n\
  非常长的命令可以通过在行末尾添加 `\\` 来拆分为多行。多行命令的默认交互提示符为 `\"> \"`。让我们像下面所示，使用 `PS2` 环境变量将此默认行为更改为\
  \ `\"continue->\"`。\n\n```bash\nramesh@dev-db ~>myisamchk --silent --force --fast\
  \ --\nupdate-state \\\n>--key_buffer_size=512M --sort_buffer_size=512M \\\n>--read_buffer_size=4M\
  \ --write_buffer_size=4M \\\n>/var/lib/mysql/bugs/*.MYI\n```\n[注：这使用了默认的 \">\" 作为续行提示符]\n\
  \n```bash\nramesh@dev-db ~>export PS2=\"continue-> \"\nramesh@dev-db ~>myisamchk\
  \ --silent --force --fast --\nupdate-state \\\ncontinue->--key_buffer_size=512M\
  \ --\nsort_buffer_size=512M \\\ncontinue->--read_buffer_size=4M --write_buffer_size=4M\n\
  \\\ncontinue->/var/lib/mysql/bugs/*.MYI\n```\n[注：这使用了修改后的 \"continue-> \" 作为续行提示符]\n\
  \n当我使用 `\\` 将长命令拆分为多行时，发现这非常有用且易于阅读。我也看到过其他人不拆分命令。\n\n### 31. PS3 - shell 脚本内部“select”\
  \ 使用的提示符\n你可以像下面所示，使用 `PS3` 环境变量为 shell 脚本内部的 `select` 循环定义自定义提示符。\n\n没有 PS3 的 shell\
  \ 脚本和输出：\n```bash\nselect i in 1 2 3\ndo\n   echo \"You chose $i\"\ndone\n> 1\n\
  You chose 1\n> 2\nYou chose 2\n> 3\nYou chose 3\n> \n```\n\n带有 PS3 的 shell 脚本和输出：\n\
  ```bash\nexport PS3=\"select an option: \"\nselect i in 1 2 3\ndo\n   echo \"You\
  \ chose $i\"\ndone\nselect an option: 1\nYou chose 1\nselect an option: 2\nYou chose\
  \ 2\nselect an option: 3\nYou chose 3\n```\n```\n\n### 32. PS3 - “select”在 shell\
  \ 脚本内部使用的提示符\n（注：此处原文标题似乎与上方内容有重复，已按逻辑翻译）\n\n### 33. PS3 - “select”在 shell 脚本内部使用的提示符\n\
  （注：此处原文标题似乎与上方内容有重复，已按逻辑翻译）\n\n### 34. PS3 - “select”在 shell 脚本内部使用的提示符\n（注：此处原文标题似乎与上方内容有重复，已按逻辑翻译）\n\
  \n\n\n\n\n你也可以使用 `\\@` 以 12 小时制 am/pm 格式显示当前时间，如下所示：\n\n```bash\nramesh@dev-db ~>export\
  \ PS1=\"[\\@] \\u@\\h> \"\n[04:12 PM] ramesh@dev-db>\n```\n\n### Hack 36. 在提示符中显示任意命令的输出\n\
  \n你可以在提示符中显示任何 Linux 命令的输出。以下示例在命令提示符中用 `|`（管道）分隔了三个项目：\n\n- `\\!`: 命令的历史编号\n- `\\\
  h`: 主机名 (hostname)\n- `$kernel_version`: 变量 `$kernel_version` 中执行 `uname -r` 命令的输出\n\
  - `\\$?`: 上一个命令的状态\n\n```bash\nramesh@dev-db ~>kernel_version=$(uname -r)\nramesh@dev-db\
  \ ~>export PS1=\"\\!|\\h|$kernel_version|\\$?> \"\n473|dev-db|2.6.25-14.fc9.i686|0>\n\
  ```\n\n![](img/00049.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n## Hack 37. 修改提示符的前景颜色\n\
  \n以蓝色显示提示符，并包含用户名、主机和当前目录信息。\n\n```bash\n$export PS1=\"\\e[0;34m\\u@\\h \\w> \\\
  e[m \"\n```\n[注：这是浅蓝色提示符]\n\n```bash\n$export PS1=\"\\e[1;34m\\u@\\h \\w> \\e[m\
  \ \"\n```\n[注：这是深蓝色提示符]\n\n- `\\e[` - 表示颜色提示符的开始\n- `x;ym` - 表示颜色代码。使用下方提到的颜色代码值。\n\
  - `\\e[m` - 表示颜色提示符的结束\n\n### 颜色代码表：\n- 黑色 0;30\n- 蓝色 0;34\n- 绿色 0;32\n- 青色 0;36\n\
  - 红色 0;31\n- 紫色 0;35\n- 棕色 0;33\n[注：将 0 替换为 1 以获得深色]\n\n通过向你的 `~/.bash_profile`\
  \ 或 `~/.bashrc` 添加以下行，使颜色更改永久生效：\n\n```bash\n$ vi ~/.bash_profile\nSTARTCOLOR='\\\
  e0;34m';\nENDCOLOR=\"\\e[0m\"\nexport PS1=\"$STARTCOLOR\\u@\\h \\w> $ENDCOLOR\"\n\
  ```\n\n![Linux Hack\nAjay Kumar Tiwari\n\n## Hack 38. 修改提示符的背景颜色\n\n在 `PS1` 提示符中指定\
  \ `\\e[{code}m` 来更改背景颜色，如下：\n\n```bash\n$export PS1=\"\\e[47m\\u@\\h \\w> \\e[m\
  \ \"\n```\n[注：这是浅灰色背景]\n\n背景与前景的组合：\n\n```bash\n$export PS1=\"\\e[0;34m\\e[47m\\\
  u@\\h \\w> \\e[m \"\n```\n[注：这是浅蓝色前景和浅灰色背景]\n\n将以下内容添加到你的 `~/.bash_profile` 或 `~/.bashrc`\
  \ 中，使上述背景和前景颜色永久生效：\n\n```bash\n$ vi ~/.bash_profile\nSTARTFGCOLOR='\\e0;34m';\n\
  STARTBGCOLOR=\"\\e[47m\"\nENDCOLOR=\"\\e[0m\"\nexport PS1=\"$STARTFGCOLOR$STARTBGCOLOR\\\
  u@\\h \\w> $ENDCOLOR\"\n```\n\n尝试使用以下背景颜色，并选择一个符合你喜好的颜色：\n- `\\e[40m`\n- `\\e[41m`\n\
  - `\\e[42m`\n- `\\e[43m`\n- `\\e[44m`\n- `\\e[45m`\n- `\\e[46m`\n- `\\e[47m`\n\n\
  ![Linux Hack\nAjay Kumar Tiwari\n\n### Hack 39. 在提示符中显示多种颜色\n\n你也可以在提示符中显示多种颜色。向你的\
  \ `~/.bash_profile` 添加以下函数：\n\n```bash\nfunction prompt {\n  local BLUE=\"\\[\\\
  033[0;34m\\]\"\n  local DARK_BLUE=\"\\[\\033[1;34m\\]\"\n  local RED=\"\\[\\033[0;31m\\\
  ]\"\n  local DARK_RED=\"\\[\\033[1;31m\\]\"\n  local NO_COLOR=\"\\[\\033[0m\\]\"\
  \n  case $TERM in\n    xterm*|vt*)\n      TITLEBAR='\\[\\033[0;\\u@\\h:\\w\\]'\n\
  \      ;;\n    *)\n      TITLEBAR=\"\"\n      ;;\n  esac\n  PS1=\"\\u@\\h [\\t]>\
  \ \"\n  PS1=\"${TITLEBAR}$BLUE\\u@\\h $RED[\\t]>$NO_COLOR \"\n  PS2='-> '\n  PS4='$LINENO\
  \ '\n}\n```\n\n![](img/00052.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n你可以重新登录或  `.bash_profile`\
  \ 使更改生效：\n\n```bash\n$ ./.bash_profile\n$prompt\nramesh@dev-db [13:02:13]>\n```\n\
  \n## Hack 40. 使用 tput 修改提示符颜色\n\n你也可以使用 `tput` 更改 `PS1` 提示符的颜色，如下：\n\n```bash\n\
  export PS1=\"\\[$(tput setb 4)\\]\\u@\\h:\\w \\$(tput sgr0)\\]\"\n```\n\n### tput\
  \ 颜色功能：\n- `tput setab [1-7]` - 使用 ANSI 转义设置背景颜色\n- `tput setb [1-7]` - 设置背景颜色\n\
  - `tput setaf [1-7]` - 使用 ANSI 转义设置前景颜色\n- `tput setf [1-7]` - 设置前景颜色\n\n### tput\
  \ 文本功能：\n- `tput bold` - 加粗模式\n- `tput dim` - 变模式\n- `tput smul` - 下划线模式\n- `tput\
  \ rmul` - 退出下划线模式\n- `tput rev` - 反显模式\n- `tput smso` - 进入高亮模式（加粗）\n- `tput rmso`\
  \ - 退出高亮模式\n- `tput sgr0` - 关闭所有属性\n\n### tput 颜色代码：\n- 0 – 黑色\n- 1 – 红色\n- 2 –\
  \ 绿色\n- 3 – 黄色\n- 4 – 蓝色\n- 5 – 品红色\n- 6 – 青色\n- 7 – 白色\n\n## Hack 41. 使用 PS1 可用代码创建自定义提示符\n\
  \n使用以下代码创建功能且符合你喜好的个人 `PS1` 提示符：\n\n- `\\a`: ASCII 铃字符\n- `\\d`: “星期日期”格式的日期（例如，“Tue\
  \ May26”）\n- `\\D{format}` 将格式传递给 `strftime()`，结果插入提示符字符串；特定区域的时间表示需要括号。\n- `\\\
  e`: ASCII 转义字符\n- `\\h`: 第一部分的主机名\n- `\\H`: 完整的主机名\n- `\\j`: 当前 shell 管理的任务数\n-\
  \ `\\l`: shell 终端设备名\n- `\\n`: 换行\n- `\\r`: 回车\n- `\\s`: shell 的名称，$0 的基文件名（最后一个斜杠后的部分）\n\
  - `\\t`: 24 小时制 HH:MM:SS 格式的当前时间\n- `\\T`: 12 小时制 HH:MM:SS 格式的当前时间\n- `\\@`: 12\
  \ 小时制 am/pm 格式的当前时间\n- `\\A`: 24 小时制 HH:MM 格式的当前时间\n- `\\u`: 当前用户的用户名\n- `\\v`:\
  \ bash 版本（例如，2.00）\n- `\\V`: bash 发布版本，版本 + 补丁级别（例如，2.00.0）\n- `\\w`: 当前工作目录，$HOME\
  \ 缩写为波浪号\n- `\\W`: 当前目录的基路径，$HOME 缩写为波浪号\n- `\\!`: 此命令的历史编号\n- `#`: 此命令的编号\n- `\\\
  $`: 如果有效 UID 为 0，则显示 `#`，否则显示 `$`\n- `\\nn`: 与八进制数字 `n` 对应的字符\n- `\\\\`: 反斜线\n-\
  \ `\\[`: 非打印字符序列，可将终端控制序列嵌入提示符中\n- `\\]`: 非打印字符序列结束\n\n![](img/00053.jpeg)Linux\
  \ Hack\nAjay Tiwari\n\n## Hack 42. 在 PS1 变量中使用 bash shell 函数\n\n你也可以在 `PS1` 中调用\
  \ bash shell 函数，如下：\n\n```bash\nramesh@dev-db ~> function httpcount {\n  ps aux\
  \ | grep httpd | grep -v | wc -l\n}\nramesh@dev-db ~>export PS1=\"\\u@\\h [`httpcount]`\
  \ \"\nramesh@dev-db [12]>\n```\n[注：显示运行的 httpd 进程数]\n\n你可以将以下内容添加到 `~/.bash_profile`\
  \ 或 `~/.bashrc` 使此更改永久生效：\n\n```bash\n$ .bashprofile\nfunction httpcount {\n  ps\
  \ aux | grep httpd | grep -v | wc -l\n}\nexport PS1='\\u@\\h [`httpcount]` '\n```\n\
  \n## Hack 43. 在 PS1 变量中使用 shell 脚本\n\n你也可以。在下面的示例中，`~/bin/totalfilesize.sh`（计算当前目录的总大小）被包含在：\n\
  \n```bash\nramesh@dev-db ~> cat ~/bin/totalfilesize.sh\nfor filesize in $(ls -l\
