  第 9 章：系统管理任务\n\n### 技巧 65. 使用 fdisk 进行分区\n\n在你的服务器上安装了全新的磁盘后，你必须使用像 `fdisk` 的工具对其进行分区。\n\
  \n以下是你可以在 `fdisk` 内部执行的 5 个典型操作（命令）：\n\n* `n` – 创建新分区\n* `d` – 删除现有的分区\n* `p` -\
  \ 打印分区表\n* `w` – 将更改写入分区表。即保存。\n* `q` – 退出 `fdisk` 实用程序\n\n### 创建分区\n\n在接下来的示例中，我创建了一个\
  \ `/dev/sda1` 主分区。\n\n```bash\n#fdisk /dev/sda\n```\n设备既不包含有效的 DOS 分区表，也不包含 Sun、SGI\
  \ 或 OSF 磁盘标签。正在构建新的 DOS 磁盘标签。更改将保留在内存中，直到你决定写入它们。之后，当然，以前的内容将无法恢复。此磁盘的磁道数设置为 34893。这没有问题，但它大于\
  \ 1024，在某些设置下可能会引起问题：\n\n1) 在启动时运行的软件（例如，旧版本的 `LILO`）\n2) 来自其他操作系统的启动和分区软件（例如 `DOS\
  \ FDISK`、`OS/2 FDISK`）\n\n警告：分区表 4 的无效标志 0x0000 将被 `w`(写入）修正\n\n```bash\nCommand\
  \ (m for help):p\n```\n磁盘 `/dev/sda`: 287.0 GB, 287005343744 字节\n255 头, 63 扇区/道,\
  \ 34893 磁道\n单位 = 16065 磁道 * 512 = 8225280 字节\nDevice Boot | Start | End | Blocks\
  \ | Id | System\n\n```bash\nCommand (m for help):n\n```\nCommand action\n  extended\n\
  \  primary partition (1-4)\n\n```bash\np\n```\n分区编号 (1-4):1\n第一个磁道 (1-34893, 默认\
  \ 1):\n使用默认值 1\n最后一个磁道或 +size 或 +sizeM 或 +sizeK (1-34893, 默认 34893):\n使用默认值 34893\n\
  \n```bash\nCommand (m for help):w\n```\n分区表已更改！调用 `ioctl()` 重新读取分区表。正在同步磁盘。\n\n\
  ### 验证分区是否已成功创建\n\n```bash\n#fdisk /dev/sda\n```\n此磁盘的磁道数设置为 34893。这没有问题，但它大于 1024，在某些设置下可能会引起问题：\n\
