  \n```bash\ngrep jsmith /etc/passwd\n```\n\n```text\njsmith:x:510:511:Oracle Developer:/home/jsmith:/bin/bash\n\
  ```\n\n```bash\nid jsmith\n```\n\n```text\nuid=510(jsmith) gid=511(developers)\n\
  groups=511(developers)\n```\n\n```bash\ngrep jsmith /etc/group\n```\n\n```text\n\
  jsmith:x:510:\ndevelopers:x:511:jsmith\n```\n\n### 技巧 72. 在 OpenSSH 中设置 SSH 免密登录\n\
  \n如此示例所示，你可以通过 `ssh-keygen` 和 `ssh-copy-id` 通过三个简单的步骤登录远程 Linux 服务器，而无需输入密码。\n\n\
  `ssh-keygen` 创建公钥和私钥。`ssh-copy-id` 将本地的公钥复制到远程主机的 `authorized_keys` 文件中。`ssh-copy-id`\
  \ 还会远程主机的目录 `~/.ssh/` 和文件 `~/.ssh/authorized_keys` 分配正确的权限。\n\n#### 步骤 1：在本地使用 `ssh-key-gen`\
  \ 创建公钥和私钥\n\n```bash\njsmith@local-host$ssh-keygen\n```\n\n```text\nGenerating public/private\
  \ rsa key pair.\nEnter file in which to save the key\n(/home/jsmith/.ssh/id_rsa):[Enter\
  \ key]\nEnter passphrase (empty for no passphrase): [Press enter key]\nEnter same\
  \ passphrase again: [Pess enter key]\nYour identification has been saved in\n/home/jsmith/.ssh/id_rsa.\n\
  Your public key has been saved in\n/home/jsmith/.ssh/id_rsa.pub.\nThe key fingerprint\
  \ is:\n33:b3:fe:af:95:95:18:11:31:d5:de:96:2f:f2:35:f9\n```\n\n89\n![](img/00082.jpeg)Linux\
  \ Hack\nAjay Kumar Tiwari\n\n#### 步骤 2：使用 `ssh-copy-id` 将公钥复制到远程主机\n\n```bash\n\
  jsmith@local-host$ssh-copy-id -i ~/.ssh/id_rsa.pub remote-host\n```\n\n```text\n\
  jsmith@remote-host’s password:\n```\n\n现在尝试使用 `ssh ‘remote-host’` 登录机器，并检查 `.ssh/authorized_keys`\
  \ 以确保我们没有添加意料之外的额外密钥。\n\n注意：`ssh-copy-id` 将密钥追加到远程主机的 `.ssh/authorized_key` 中。\n\
  \n#### 步骤 3：不输入密码登录远程主机\n\n```bash\njsmith@local-host$ssh remote-host\n```\n\n```text\n\
  Last login: Sun Nov 16 17:22:33 2008 from 192.168.1.2\n[Note: SSH 没有询问密码。]\njsmith@remote-host$\
  \ [Note: 你现在位于远程主机上]\n```\n\n90\n![](img/00083.jpeg)Linux Hack\nAjay Kumar Tiwari\n\
  \n### 技巧 73. 结合 `ssh-agent` 使用 `ssh-copy-id`\n\n使用 `ssh-copy-id` 配合 `ssh-add/ssh-agent`\n\
  \n当未为选项 `-i` 传递值且如果 `~/.ssh/identity.pub` 不可用时，`ssh-copy-id` 将显示错误信息。\n\n```bash\n\
  jsmith@local-host$ ssh-copy-id -i remote-host\n```\n\n```text\n/usr/bin/ssh-copy-id:\
  \ No identities found\n```\n\n如果你使用 `ssh-add` 将密钥加载到 `ssh-agent`，那么 `ssh-copy-id`\
  \ 将从 `ssh-agent` 获取密钥并复制到远程主机，即使你没有向 `ssh-copy-id` 传递 `-i`。\n\n```bash\njsmith@local-host$\
  \ ssh-agent\njsmith@local-host$ ssh-add -L\nThe agent has no identities.\njsmith@local-host$\
  \ ssh-add\nIdentity added: /home/jsmith/.ssh/id_rsa\njsmith@local-host$ ssh-add\
  \ -L\nssh-rsa AAAAB3Nza1yc2EAAAwQEAsJILxft8aSMa3d8t6JPh7kEMzApnyxsH1tQ/Ow== /home/jsmith/.ssh/id_rsa\n\
  ```\n\n```bash\njsmith@local-host$ ssh-copy-id remote-host jsmith@remote-host’s\
  \ password:\n```\n\n现在尝试使用 `ssh ‘remote-host’` 登录机器，并检查 `.ssh/authorized_keys` 以确保我们没有添加意料之外的额外密钥。[注意：这添加了\
  \ `ssh-add -L` 显示的密钥]91\n![](img/00084.jpeg)Linux Hack\n Ajay Kumar Tiwari\n\n####\
  \ ssh-copy-id 的三个不之处\n\n以下是 `ssh-copy-id` 的一些小不便：\n\n1. **默认公钥**：`ssh-copy-id` 使用\
  \ `~/.ssh/identity.pub` 作为默认公钥文件（即当未向 `-i` 传递值时）。我希望它使用 `id_dsa.pub`、`id_rsa.pub`\
  \ 或 `identity.pub` 作为默认密钥。即如果存在其中任何一个就应该复制到远程主机。\n2. **agent 没有密钥**：当 `ssh-agent`\
  \ 运行且 `ssh-add -L` 返回“The agent has no identities”（没有密钥被添加到 `ssh-agent`）时，`ssh-copy-id`\
  \ 仍然会将“The agent has no identities”到远程主机的 `authorized_keys` 条目中。\n3. **authorized_keys\
  \ 中的重复项**：我希望 `ssh-copy-id` 验证远程主机的 `authorized_keys` 重复项。如果你在本地多次执行 `ssh-copy-id`，它会在不检查重复项的情况下向远程主机的\
  \ `authorized_keys` 文件追加相同的密钥。但我希望我的 `authorized_keys` 文件是干净的。\n\n### 技巧 74. Crontab\n\
  \n使用 `cron` 你可以在特定的时间和日期执行 shell 脚本或 Linux 命令。例如，系统管理员可以调度一个每天运行的备份任务。\n\n### 如何向\
  \ cron 添加任务？\n\n```bash\ncrontab –e\n```\n\n```text\n0 5 * * * /root/bin/backup.sh\n\
  ```\n\n92\n![](img/00085.jpeg)Linux Hack\n Ajay Kumar Tiwari\n\n这将在每天凌晨 5 点执行 `/root/bin/backup.sh`。\n\
  \n### Cron 字段描述\n\n以下是 `crontab` 文件的格式：\n`{minute} {hour} {day-of-month} {month}\
  \ {day-of-week} {full-path-to-shell-script}`\n\n- `minute`: 允许范围 0 – 59\n- `hour`:\
  \ 允许范围 0 – 23\n- `day-of-month`: 允许范围 0 – 31\n- `month`: 允许范围 1 – 12。1 = 一月，12 =\
  \ 十二。\n- `day-of-week`: 允许范围 0 – 7。周日为 0 或 7。\n\n### Crontab 示例\n\n1. **在凌晨 12:01\
  \ 运行**。每天午夜后 1 分钟。这是系统无负载运行备份的好时间。\n```bash\n1 0 * * * /root/bin/backup.sh\n```\n\
  2. **每个工作日（周一至周五）晚上 11:59 运行备份**。\n```bash\n59 11 * * 1,2,3,4,5 /root/bin/backup.sh\n\
  ```\n以下内容也将执行相同的操作：\n```bash\n59 11 * * 1-5 /root/bin/backup.sh\n```\n\n3. **每 5\
  \ 分钟执行一次命令**。\n```bash\n*/5 * * * * /root/bin/check-status.sh\n```\n4. **每月 1 号下午\
  \ 1:10 执行**。\n```bash\n10 13 1 * * /root/bin/full-backup.sh\n```\n5. **在工作日晚上 11\
  \ 点执行**。\n```bash\n0 23 * * 1-5 /root/bin/incremental-backup.sh\n```\n\n### Crontab\
  \ 选项\n\n以下是 `crontab` 的可用选项：\n\n- `crontab –e`：编辑 `crontab` 文件。如果不存在，它将创建一个。\n-\
  \ `crontab –l`：显示 `crontab` 文件。\n- `crontab -r`：删除 `crontab` 文件。\n- `crontab -ir`：在删除\
  \ `crontab` 前会提示用户。\n\n### 技巧 75. 使用 Magic SysRq Key 安全重启 Linux\n\nMagic SysRq 键是\
  \ Linux 内核中的键组合，允许用户无论系统状态如何执行各种低级命令。\n\n它通常用于从冻结中恢复，或在不关闭电源的情况下重启电脑。\n\n\n\n\n\
  损坏文件系统。该键组合包含 94 个。\n\n![](img/00087.jpeg)Linux 攻客\nAjay Kumar Tiwari\n\n`Alt+SysRq+commandkey`。在许多系统中，`SysRq`\
  \ 键就是打印屏幕（printscreen）键。\n\n首先，你需要启用 `SysRq` 键，如下所示。\n\n```\necho \"1\" > /proc/sys/kernel/sysrq\n\
  ```\n\n### SysRq 命令键列表\n\n以下是 `Alt+SysRq+commandkey` 可用的命令键。\n\n- `k` – 杀死所有运行在当前虚拟控制台上的进程。\n\
  - `s` – 这将尝试同步所有已挂载的文件系统。\n- `b` - 立即重启系统，不卸载分区或进行同步。\n- `e` – 向除 `init` 以外的所有进程发送\
  \ `SIGTERM` 信号。\n- `m` – 将当前内存输出到控制台。\n- `i` - 向除 `init` 以外的所有进程发送 `SIGKILL` 信号。\n\
  - `r` - 将键盘从原始模式（如 `X11` 等程序使用的模式）切换到 `XLATE` 模式。\n- `s` – 同步所有挂载的文件系统。\n- `t` -\
  \ 将当前任务列表及其信息输出到控制台。\n- `u` - 以只读模式重新挂载所有已挂的文件系统。\n- `o` – 立即关闭系统。\n- `p` – 将当前寄存器和标志打印到控制台。\n\
  - `0-9` - 设置控制日志级别，控制哪些内核消息将打印到你的控制台。\n\n95\n![](img/00088.jpeg)Linux 攻客\nAjay Kumar\
  \ Tiwari\n\n- `f` - 将调用 `oom_kill` 来杀死占用内存更多的进程。\n- `h` – 用于显示帮助。但上述列出的键以外的任何键都会打印帮助。\n\
  \n我们也可以通过将按键写入 `/proc/sysrq-trigger` 文件来实现此操作。例如，要重启系统，你可以执行以下操作。\n\n```\necho \"\
  b\" > /proc/sysrq-trigger\n```\n\n### 使用 Magic SysRq 键安全重启 Linux\n\n要对死机的 Linux\
  \ 计算机进行安全重启，请执行以下操作。这将避免下次重启时进行 `fsck`。即按下下方高亮的 `Alt+SysRq+字母`。\n\n- `unRaw`（从 `X11`\
  \ 处夺回键盘控制权），\n- `tErminate`（向所有进程发送 `SIGTERM`，允许它们优雅地退出），\n- `kIll`（向所有进程发送 `SIGKILL`，强制它们立即终止），\n\
  - `Sync`（将数据刷到磁盘），\n- `Unmount`（将所有文件系统重新挂载为只读），\n- `reBoot`（重启）。\n\n96\n![](img/00089.jpeg)Linux\
  \ 攻客\nAjay Kumar Tiwari\n\n## 第 10 章：Apachectl 和 Httpd 示例\n\n在安装 `Apache2` 之后，如果你想充分利用\
