  \n### Hack 48. Tar 命令基础\n\n`tar` 命令（带带归档）用于将一组文件转换为存档。\n语法：`tar [options] [archive-name]\
  \ [file-names]`\n\n如何为家目录下所有的文件和子目录创建一个单一备份文件？\n以下命令在 `/tmp` 下创建一个名为 `my_home_directory.tar`\
  \ 的单一存档备份。该存档将包含 `/home/jsmith` 下的所有文件和子目录。\n\n- `c` 表示创建存档。\n- `v` 表示详细模式，在执行命令时显示额外信息。\n\
  - `f` 表示存档文件名。\n\n```bash\ntar cvf /tmp/my_home_directory.tar /home/jsmith\n```\n\
  67\n![](img/00060.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n如何查看 tar 存档内部的所有文件？\n`t`\
  \ 选项将显示 tar 存档中的所有文件。\n\n```bash\ntar tvf /tmp/my_home_directory.tar\n```\n\n如何从\
  \ tar 存档中提取所有文件？\n`x` 选项将如下所示从 tar 存档中提取文件。这将内容提取到执行命令的当前目录。\n\n```bash\ntar xvf\
  \ /tmp/my_home_directory.tar\n```\n\n如何将 tar.gz 文件提取到特定目录？\n```bash\ntar xvfz /tmp/my_home_directory.tar.gz\
  \ -C /home/ramesh\n```\n\n## Hack 49. 将 gzip、bzip2 与 tar 结合\n\n如何在 `tar` 中使用 `gzip`？\n\
  处理 `.gz` 压缩的文件时，向 `tar` 命令添加 `z` 选项。\n\n```bash\ntar cvfz /tmp/my_home_directory.tar.gz\
  \ /home/jsmith\n```\n注意：与默认级别相比，使用 `gzip` 会更快。\n\n如何在 `tar` 中使用 `bzip2`？\n处理 `.bz2`\
  \ 压缩的文件时，向 `tar` 命令添加 `j` 选项。\n\n```bash\ntar cvfj /tmp/my_home_directory.tar.bz2\
  \ /home/jsmith\ntar xvfj /tmp/my_home_directory.tar.bz2\ntar tvfj /tmp/my_home_directory.tar.bz2\n\
  ```\n注意：使用 `bzip2` 提供的压缩率更高。\n\n## 第 8 章：命令行历史 (Command Line History)\n\n当你频繁使用\
  \ Linux 命令行时，有效使用历史记录可以极大提高效率。事实上，一旦你掌握了这里这里提供的 15 个示例，你就会发现使用命令行变得更加有趣。\n\n###\
  \ 50. 使用 HISTTIMEFORMAT 在历史中显示时间\n\n通常当你从命令行输入 `history` 时，它会显示命令编号和命令。为了审计目的，如下所示在命令的同时显示时间戳可能会很有帮助。\n\
  \n```bash\nexport HISTTIMEFORMAT='%%F %T '\nhistory\n```\n1\n2\n3\n4 | more\n2008-08-05\
  \ 19:02:39\n2008-08-05 19:02:39\n2008-08-05 19:02:39\n2008-08-05 19:02:39\nservice\
  \ network restart\nexit\nid\ncat /etc/redhat-release\n注意：你还可以设置以下别名来查看最近的历史命令。\n\
  ```bash\nalias h1='history 10'\nalias h2='history 20'\nalias h3='history 30'\n```\n\
  \n### 51. 使用 Control+R 搜索历史\n\n我坚信这可能是你历史记录中使用频率频繁的功能。当你已经执行了一个非常长的命令时，你只需通过关键字搜索历史并重新执行相同的命令，而无需完整输入。按下\
  \ Control+R 并输入关键字。\n\n在下面的示例中，我搜索了 red，显示了之前的\n\n\n\n\n\n历史记录中包含单词 `red` 的命令 `cat\
  \ /etc/redhat-release`。\n\n# [注意：在命令提示符处按下 `Ctrl+R`，将显示如下所示的反向搜索提示符]\n\n```\n(reverse-i-search)`red`:\
  \ cat /etc/redhat-release\n```\n\n[注意：看到你的命令时按下回车键，这将执行历史记录中的命令]\n\n```bash\n#cat\
  \ /etc/redhat-release\n```\n\nFedora release 9 (Sulphur)\n\n有时你可能想在执行命令之前对历史记录中的命令进行编辑。例如，你可以搜索\
  \ `httpd`，这将显示命令历史中的服务 `httpd stop`，选择该命令并将 `stop` 改为 `start` 然后再次执行，如下所示。\n\n#\
  \ [注意：在命令提示符处按下 `Ctrl+R`，将显示反向搜索提示符]\n\n```\n(reverse-i-search)`httpd`: service\
  \ httpd stop\n```\n\n[注意：当你看到你的命令时，按下左箭头或右箭头键，这会显示命令以供你编辑，然后再执行它]\n\n```bash\n#\
  \ service httpd start\n```\n\n71\n![](img/00064.jpeg)Linux Hack\nAjay Kumar Tiwari\n\
  \n## Hack 52. 使用 4 种方法快速重复上一个命令\n\n有时由于各种原因，你可能会重复执行之前的命令。以下是重复最后执行命令的 4 种不同方法。\n\
  \n1. 使用上箭头查看上一个命令并按下 `enter` 执行它。\n2. 在命令行输入 `!!` 并按下 `enter`。\n3. 在命令行输入 `!-1`\
  \ 并按下 `enter`。\n4. 按下 `Control+P` 显示上一个命令，按下 `enter` 执行它。\n\n## Hack 53. 从历史记录中执行特定命令\n\
  \n在下面的示例中，如果你想重复命令 `#4`，请执行 `!4`，如下所示。\n\n```bash\n# history\n        1\n      \
  \  2\n        3\n        4\n| more\nservice network restart\nexit\nid\ncat /etc/redhat-release\n\
  #!4\ncat /etc/redhat-release\n```\nFedora release 9 (Sulphur)\n\n72\n![](img/00065.jpeg)Linux\
  \ Hack\nAjay Kumar Tiwari\n\n## Hack 54. 执行以特定单词开头的上一个命令\n\n输入 `!` 后跟想要重新执行的命令的开头几个字母。在下面的示例中，输入\
