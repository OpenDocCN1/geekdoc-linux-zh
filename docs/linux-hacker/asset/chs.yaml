  40\n50\nip-frag\n0\n0\n0\n\n## 技巧 97\\. vmstat 命令\n\n对于典型的性能监控，你只需要 `vmstat` 命令。它可以显示内存、交换分区、IO、系统和\
  \ CPU 性能信息。以下命令每 1 秒执行一次 `vmstat`，共执行 100 次。\n\n```bash\nvmstat 1 100\n```\n\nprocs\
  \ -----------memory---------- ---swap-- -----io---- --system-- ----cpu----\nr b\
  \ swpd free buff cache si so\n0 0\n0 282120 134108 5797012\n0 282120 134108 5797012\n\
