  -------\n56 files\n\n### Hack 45. 使用 zip 命令的高级压缩\n\n`zip` 命令提供了 10 级压缩。\n\n- Level\
  \ 0 是最低级别，仅对文件进行归档压缩。\n- Level 1 会进行少量压缩，但速度非常快。\n- Level 6 是默认压缩级别。\n- Level 9\
  \ 是最大压缩级别。与默认级别相比，它的速度更慢。在我看来，除非你要压缩大文件，否则始终使用 level 9。\n\n在下面的示例中，我对同一个目录使用了 Level\
  \ 0、默认 Level 6 和 Level 9 压缩。查看压缩文件的大小。\n\n```bash\nzip var-log-files-default.zip\
  \ /var/log/*\nzip -0 var-log-files-0.zip /var/log/*\nzip -9 var-log-files-9.zip\
  \ /var/log/*\nls -ltr\n```\n-rw-r--1 rootroot var-log-files-default.zip\n-rw-r--1\
  \ rootroot var-log-files-0.zip\n-rw-r--1 rootroot var-log-files-9.zip 281724 Jan\
  \ 4141301 13:05\n65\n![](img/00058.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n## Hack\
  \ 46. 密码保护 Zip 文件\n\n向 `zip` 命令传递 `-P` 选项为 zip 文件分配密码。\n\n```bash\nzip -P mysecure\
  \ var-log-protected.zip /var/log/*\n```\n如果你在后台作业中使用该命令，上面的选项很好。但如果你在命令行交互时执行压缩，不希望密码出现在历史中，请使用如下所示的\
