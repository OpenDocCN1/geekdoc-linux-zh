  30\n![](img/00025.jpeg)Linux Hack\nAjay Kumar Tiwari\n\n## 第 4 章：基础 Linux 命令\n\n\
  ### Hack 17. Grep 命令\n\n`grep` 命令用于在文件中搜索特定文本。这是一个极其强大的命令，拥有许多选项。\n\n语法：`grep [options]\
  \ pattern [files]`\n\n我如何找到文件中所有匹配特定关键词的行？\n在本例中，`grep` 在 `/etc/passwd` 文件中查找文本\
  \ `John` 并显示所有匹配的行。\n\n```bash\n# grep John /etc/passwd\n```\n\n```bash\n# grep\
  \ John /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n```\n选项 `-v` 将显示所有非匹配的行。在下方的示例中，它们不匹配。\n\
  \n```bash\n# grep -v John /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n```\n\
  有多少行匹配了该文本？\n在下方的示例中，它显示行数。\n\n```bash\n# grep -c John /etc/passwd\njsmith:x:1082::...\n\
  jdoe:x:1083::...\n```\n如何忽略大小写进行搜索？\n使用选项 `-i`（忽略大小写）。\n\n```bash\n# grep -i John\
  \ /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n```\n**如何搜索子目录？**\n使用选项 `-r`（递归）。\n\
  \n```bash\n# grep -r John /etc/passwd\njsmith:x:1082::...\njdoe:x:1083::...\n```\n\
  \n### Hack 18. Find 命令\n\n`find` 经常用于根据条件查找文件。\n语法：`find [options] [conditions]`\n\
  \n如何找到包含某个单词的文件？\n以下命令查找所有名称。\n\n```bash\n# find /etc -name \"*mail*\"\n```\n\n\
  如何找到大于特定大小的文件？\n使用选项 `-size`。\n\n```bash\n# find /etc -size +100M\n```\n\n如何找到在特定天内未修改的文件？\n\
  使用选项 `-mtime`。\n\n```bash\n# find . -mtime +60\n```\n\n如何删除所有特定扩展名的文件？\n执行命令时请小心。\n\
  \n```bash\n# find . -type f -name \"*.tar.gz\" -size +100M -exec rm -f {} \\;\n\
  ```\n\n如何归档所有几天内未修改的文件？\n以下命令会在 `/tmp` 下创建一个归档。\n\n```bash\n# find /home/jsmith\
  \ -type f -mtime +60 | xargs tar -cvf /tmp/`date '+%d%m%Y'_archive.tar`\n```\n\n\
  ### Hack 19. 抑制标准输出和错误\n\n有时在调试 脚本时，你可能不想看到标准输出或错误信息。如下所示使用 `/dev/null` 来抑制输出。\n\
  \n使用 `>/dev/null` 抑制标准输出：\n当不想显示 `echo` 语句而只想查看错误消息时，这将非常有用。\n\n```bash\n# cat file.txt\
  \ > /dev/null\n# ./shell-script.sh > /dev/null\n```\n\n使用 `2>/dev/null` 抑制错误：\n\
  只想查看标准输出而不查看错误消息时，同样有用。\n\n```bash\n# cat invalid-file-name.txt 2> /dev/null\n#\
  \ ./shell-script.sh 2> /dev/null\n```\n\n### Hack 20. Join 命令\n\n`join` 命令根据公共字段合并两个文件的行。\n\
  在下方的示例中，我们有两个文件——`employee.txt` 和 `salary.txt`。它们都有 `employee-id` 作为公共字段。因此，我们可以如下使用\
  \ `join` 命令通过 `employee-id` 合并这两个文件的数据。\n\n```bash\n$ cat employee.txt\n100\n200\n\
  300\n400\nJason Smith\nJohn Doe\nSanjay Gupta\n```\n\n\n\n\n\n# Ashok Sharma\n\n\
  ```bash\n$ cat bonus.txt\n100\n200\n300\n400\n```\n$5,000\n$500\n$3,000\n$1,250\n\
  \n```bash\n$ join employee.txt bonus.txt\n100\n200\n300\n400\nJason Smith $5,000\n\
  John Doe $500\nSanjay Gupta $3,000\nAshok Sharma $1,250\n```\n\n### Hack 21. 转换大小\n\
  \n### 将文件转换为全大写\n```bash\n$ cat employee.txt\n100\n200\n300\n400\nJason Smith\n\
  John Doe\nSanjay Gupta\nAshok Sharma\n```\n```bash\n$tr a-z A-Z < employee.txt\n\
  100 JASON SMITH\n200 JOHN DOE\n300 SANJAY GUPTA\n400 ASHOK SHARMA\n```\n![](img/00031.jpeg)Linux\
  \ 技巧\n\n### 将文件转换为全小写\n```bash\n$ cat department.txt\n100\n200\n300\n400\nFINANCE\n\
  MARKETING\nPRODUCT DEVELOPMENT\nSALES\n```\n```bash\n$tr A-Z a-z < department.txt\n\
  100\n200\n300\n400\nfinance\nmarketing\nproduct development\nsales\n```\n\n### Hack\
  \ 22. Xargs 命令\n\n`xargs` 是一个非常强大的命令，它可以接收命令的输出并将其作为另一个命令的参数。以下是关于如何使用 `xargs` 的一些实用示例。\n\
  \n1. 当你尝试使用 `rm` 删除过的文件时，可能会遇到错误信息：`/bin/rm` Argument list too long – Linux。使用 `xargs`\
  \ 可以避免这个问题。\n```bash\nfind ~ -name '*.log’ -print0 | xargs -0 rm -f\n```\n2. 获取\
  \ `/etc/` 目录下所有 `*.conf` 列表。有多种方法可以获得相同的结果。以下示例仅用于演示 `xargs` 的用法。在本示例中，`find` 命令的输出通过\
  \ `xargs` 逐个传递给 `ls –l`。\n![](img/00032.jpeg)Linux 技巧\n```bash\n# find /etc -name\
  \ \"*.conf\" | xargs ls –l\n```\n3. 如果你有一个包含 URL 列表的文件想要下载，可以如下所示使用 `xargs`。\n```bash\n\
  # cat url-list.txt | xargs wget –c\n```\n4. 找到所有的 `jpg` 图片并将其归档。\n```bash\n# find\
  \ / -name *.jpg -type f -print | xargs tar -cvzf images.tar.gz\n```\n5. 将所有图片拷贝到外部硬盘。\n\
  ```bash\n# ls *.jpg | xargs -n1 -i cp {} /external-hard-drive/directory\n```\n\n\
  ### Hack 23. Sort 命令\n\n`sort` 命令对文本文件的行进行排序。以下是基于示例文本文件使用 `sort` 命令的几个实用示例，该文件包含格式为员工信息：`employee_name:employee_id:department_name`。\n\
  \n```bash\n$cat names.txt\nEmma Thomas:100:Marketing\nAlex Jason:200:Sales\nMadison\
  \ Randy:300:Product Development\nSanjay Gupta:400:Support\nNisha Singh:500:Sales\n\
  ```\n![](img/00033.jpeg)Linux 技巧\n\n### 按升序排序文本文件\n```bash\n$sort names.txt\nAlex\
  \ Jason:200:Sales\nEmma Thomas:100:Marketing\nMadison Randy:300:Product Development\n\
  Nisha Singh:500:Sales\nSanjay Gupta:400:Support\n```\n### 按降序排序文本文件\n```bash\n$sort\
  \ -r names.txt\nSanjay Gupta:400:Support\nNisha Singh:500:Sales\nMadison Randy:300:Product\
  \ Development\nEmma Thomas:100:Marketing\nAlex Jason:200:Sales\n```\n### 冒号分隔文件按第\
  \ 2 字段（员工 ID）排序\n```bash\n$sort -t: -k 2 names.txt\nEmma Thomas:100:Marketing\n\
  Alex Jason:200:Sales\nMadison Randy:300:Product Development\nSanjay Gupta:400:Support\n\
  Nisha Singh:500:Sales\n```\n### 制表符分隔文件按第 3 字段（部门名称）排序并去除重复\n```bash\n$sort -t:\
  \ -u -k 3 names.txt\nEmma Thomas:100:Marketing\nMadison Randy:300:Product Development\n\
  Alex Jason:200:Sales\nSanjay Gupta:400:Support\n```\n### passwd 文件按第 3 字段（用户 ID）数字排序\n\
  ```bash\n$sort -t: -k 3n /etc/passwd | more\nroot:x:0:0:/root:/bin/bash\nbin:x:1:1:/bin:/sbin/nologin\n\
  daemon:x:2:2:/daemon:/sbin/nologin\nadm:x:3:4:/var/adm:/sbin/nologin\nlp:x:4:7:/var/spool/lpd:/sbin/nologin\n\
  ```\n### /etc/hosts 文件按 IP 排序\n```bash\n$sort -t . -k 1,1n -k 2,2n -k 3,3n -k 4,4n\
  \ /etc/hosts\n127.0.0.1 localhost.local\n192.168.100.1 dev-db.thestuff.com\n192.168.100.2\
  \ prod-db.thestuff.com\n192.168.101.21 prod-web.thestuff.com\n```\n### 将 sort 与其他命令结合\n\
  - `ps –ef | sort`: 对进程列表排序\n- `ls -al | sort +n`: 按大小升序列出文件，即第 5 字段\n- `ls -al |\
  \ sort +nr`: 按大小降序列出文件，即第 5 字段\n![](img/00035.jpeg)Linux 技巧\n\n### Hack 24. Uniq\
  \ 命令\n\n`uniq` 命令通常与 `sort` 命令结合使用，因为它可以去除排序文件中相邻的行。以下是一些示例。\n\n1. 当你有一个有重复项的文件时，可以执行以下操作删除它们：\n\
  ```bash\n$ sort names.txt | uniq\n```\n2. 如果你想知道某一行出现了多少次。在这个示例中，以 Alex 开头的行出现了两次：\n\
  ```bash\n$sort names.txt | uniq –c\n2 Alex Jason:200:Sales\n1 Emma Thomas:100:Marketing\n\
  1 Madison Randy:300:Product Development\n1 Nisha Singh:500:Sales\n1 Sanjay Gupta:400:Support\n\
  ```\n3. 以下内容仅显示重复项：\n```bash\n$sort names.txt | uniq –cd\n```\n![](img/00036.jpeg)Linux\
  \ 技巧\n\n### Hack 25. Cut 命令\n\n`cut` 命令用于显示文本文件中的列。以下是一些示例。\n\n### 显示冒号分隔文件中的第 1\
  \ 字段（员工姓名）\n```bash\n$cut -d: -f 1 names.txt\nEmma Thomas\nAlex Jason\nMadison Randy\n\
  Sanjay Gupta\nNisha Singh\n```\n### 显示冒号分隔文件中的第 1 和第 3 字段\n```bash\n$cut -d: -f\
