  0\n0\n0\n0\n0\n0\nAjay Kumar Tiwari\n0 1117 577 0 0 100 0\n0 1007 366 0 0 100 0\n\
  \n### Vstat procs 部分\n- `r` 字段：可运行进程的总数\n- `b` 字段：阻塞进程的总数\n\n### Memory 部分\n- `swpd`\
  \ 字段：使用的交换分区\n- `free` 字段：可用的空闲 RAM\n- `buff` 字段：用于缓冲的 RAM\n- `cache` 字段：用于文件系统缓存的\
  \ RAM\n\n### Swap 部分\n- `si` 字段：每秒从磁盘交换出的内存量\n- `so` 字段：每秒交换到磁盘的内存量\n\n### IO 部分\n\
  - `bi` 字段：从磁盘接收的块\n- `bo` 字段：发送到磁盘的块\n\n### System 部分\n- `in` 字段：每秒中断次数\n- `cs`\
  \ 字段：每秒上下文切换次数\n\n### CPU 部分\n- `us` 字段：运行用户代码的时间。（内核代码）\n- `sy` 字段：运行内核代码的时间\n\
  - `id` 字段：空闲时间\n- `wa` 字段：等待 IO 的时间\n\n![](img/0016.jpeg) Linux Hack\nAjay Kumar\
  \ Tiwari\n\n## 技巧 98\\. Netstat 命令\n\n`netstat` 命令显示网络相关信息，如连接、路由表、接口统计。以下是使用 `netstat`\
