  \n```bash\n#tune2fs -L database /dev/sda1\n```\n\n### 技巧 69. 创建交换文件系统\n\n如下所示创建一个用于交换的文件：\n\
  \n```bash\n#dd if=/dev/zero of=/home/swap-fs bs=1M count=512\n```\n512+0 records\
  \ in\n512+0 records out\n\n```bash\n# ls -l /home/swap-fs\n```\n-rw-r--r-- 1 root\
  \ root 536870912 Jan 2 23:13\n\n使用 `mkswap` 为上述的 `/home/swap-fs` 设置 Linux 交换区域。\n\
  \n```bash\n#mkswap /home/swap-fs\n```\nSetting up swapspace version 1, size = 536866\
  \ kB\n\n一旦文件创建并设置为 Linux 交换区域，是时候如下所示使用 `swapon` 启用交换了：\n\n```bash\n#swapon /home/swap-fs\n\
  ```\n\n将以下行添加到 `/etc/fstab` 并重启系统以使交换生效：\n\n```bash\n/home/swap-fs swap swap defaults\
  \ 0 0\n```\n\n### 技巧 70. 创建新用户\n\n添加新用户 – 基本方法\n\n仅指定用户名。\n\n```bash\n# useradd\
  \ jsmith\n```\n\n带有额外参数添加新用户\n\n你也可以将以下参数传递给 `useradd`：\n\n\n\n\n\n- `-c` : 关于用户的描述。\n\
  - `-e` : 用户的过期日期，格式为 `mm/dd/yy`。\n\n```bash\nadduser -c \"John Smith - Oracle Developer\"\
  \ -e 12/31/09 jsmith\n```\n\n验证用户已成功添加。\n\n```bash\ngrep jsmith /etc/passwd\n```\n\
  \n```text\njsmith:x:510:510:John Smith - Oracle Developer:/home/jsmith:/bin/bash\n\
  ```\n\n更改用户密码。\n\n```bash\npasswd jsmith\n```\n\n```text\nChanging password for\
