  \ 如果你不想加载 ldap 模块，请正常启动 Apache.]\n\n# Hack 84. .bash_* 文件的执行顺序\n\n以下文件的执行顺序是怎样的？\n\
  - `/etc/profile`\n- `~/.bash_profile`\n- `~/.bashrc`\n- `~/.bash_login`\n- `~/.profile`\n\
  - `~/.bash_logout`\n\n交互式登录 shell 的执行顺序。以下伪代码解释了这些文件的执行顺序：\n\n```text\nexecute /etc/profile\n\
  IF ~/.bash_profile exists THEN\n    execute ~/.bash_profile\nELSE\n    IF ~/.bash_login\
  \ exist THEN\n        execute ~/.bash_login\n    ELSE\n        IF ~/.profile exist\
  \ THEN\n            execute ~/.profile\n        END IF\n    END IF\nEND IF\n```\n\
  \n当你退出交互式 shell 时，以下是执行顺序：\n```text\nIF ~/.bash_logout exists THEN\n    execute\
  \ ~/.bash_logout\nEND IF\n```\n请注意 `/etc/bashrc` 是由 `~/.bashrc` 执行的，如下所示：\n```bash\n\
  if [ -f /etc/bashrc ]; then . /etc/bashrc\nfi\n```\n交互式非登录 shell 的执行顺序。在启动非登录 shell\
  \ 时，执行过程如下：\n```text\nIF ~/.bashrc exists THEN\n    execute ~/.bashrc\nEND IF\n\
  ```\n注意：当非交互式 shell 启动时，它会查找\n\n# Hack 85. 在 bash 中生成随机数\n\n使用内置函数 `$RANDOM` 在 bash\
  \ 中生成随机数。\n\n```bash\necho $RANDOM\n```\n\n# Hack 86. 脚本调试\n\n为了调试脚本，可以使用 `set -x`。如下所示：\n\
