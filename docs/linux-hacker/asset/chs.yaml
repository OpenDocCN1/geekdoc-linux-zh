  ```bash\n$cut -c 1-8 names.txt\nEmma Tho\nAlex Jas\nSanjay G\nNisha Si\n```\n###\
  \ 其他 Cut 示例\n- `cut -d: -f1 /etc/passwd`: 显示系统中所有用户的 unix 名称。\n- `free | tr -s '\
  \ ' | sed '/^Mem/d' | cut -d\" \" -f2`: 显示系统可用总内存。\n\n### Hack 26. Stat 命令\n\n`stat`\
