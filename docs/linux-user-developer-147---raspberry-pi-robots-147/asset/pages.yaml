  md: "# Raspberry Pi robots\n\nCHALLENGE 3...\n\n# # Three-point turn\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_58_0.png)\n\
    \nOur robots can go in reverse, but however easily can they do a 180 turn?\n\n\
    This is usually a tricky challenge for Pi Wars, especially if it has to be autonomous\
    \ requires the robot to walk out of a designated area before performing a turn\
    \ and travel just in an area 750mm square. Once it's completed the manoeuvre,\
    \ turn around and back to the starting. To do this classically, you'll need to\
    \ know the speed and direction with extreme accuracy to make the 180 degree turn.\n\
    \nThe Hex has an advantage in that it can literally spin on the spot, or shuffle\
    \ its feet without example code to make it. All you need to do is walk to the\
    \ desired location, turn around and make a very simple script where the Hex walks\
    \ few 'steps' forward before attempting a 180 degree turn and do the same number\
    \ of steps back to its starting position.\n\nWe'll go parts of it here but you\
    \ can grab the thing from FileSite as well as the link below.\n\nFirst we define\
    \ some basic parameters, the way the Hex will respect these parameters. We've\
    \ also got a rotation parameter we've set to 80, but you may need to tweak it\
    \ for. There're also the variables created to make the code slightly easier.\n\
    \nThen we have a loop where for the first and last steps, we do a load of the\
    \ walk forward and steps. This is a quarter of the walk forward and steps, and\
    \ once we have one. Then it stops the loop when a further 20 steps have been made.\n\
    \n# # Code listing\n\n```\ndeg = 25\nmidfloor = 30\nhipspeed = 25\npause = 0\n\
    rotate_deg = 180\nsteps = 0\nrotations = 0\n```\n\n```\nWhile True:\n  if steps\
    \ < 10:\n    # replant tripod 2 while tripod\n    # move behind\n    # replant\
    \ tripod 2 forward\n    hex_LF.replantFoot(deg-hipSpeed,step=0.5)\n```\n\n```\n\
    hex_RM.replantFoot(hipSpeed,stepTime=0.5)\nhex_LB.replantFoot(deg-hipSpeed,stepTime=0.5)\n\
    \nelse:\n  # set neck to where body is turning\nhex_neck.set(rotate_step)\n  #\
    \ replant-tripod.deg forward\n  for leg in tripod2:\n    leg.replantFoot(rotate=rotate,step,time=0.5)\n\
    \  # replant tripod2 in place as tripod1\n  for leg in leg2:\n    leg.setPosition(int(floor(leg/2.0))\n\
    \  sleep(0.3)\n```\n\n# # Next step\n\nThe above-and-turn code can be easily expanded\
    \ into a full sidewalk routine, with lines, loops, leafs, audience-pointing and\
    \ even a stance, which you will need to path. Just grab the PolCo source code\
    \ (by LiYLuQOF) and work those Python chunks into your main script wherever you\
    \ like.\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_58_1.png)\n\nAbove there are\
    \ three parts to each leg and each contains one servo. This articulation could\
    \ potentially enable Hex to climb medium-sized objects and obstacles\n\n59.linuxuser.co.uk"
