  md: "# Raspberry Pi robots\n\n# CHALLENGE 2..\n\n# # Line following\n\nFollow the\
    \ black painted line, although you may not find a wizard at the end of it\n\n\
    Line following is very easy; you put a line on the floor and expect the robot\
    \ to follow it. This includes turning as well, following a course accurately to\
    \ its destination or accumulate laps. The Pi2Go Lite is the only robot we're looking\
    \ at this month which comes with line-following sensors, although it has many\
    \ features. Sources like it however there's no line-following function in the\
    \ Python script so we need to build a script for.\n\nAs we lead, the solution\
    \ involves line-following sensors - these are IR sensors on the underside of the\
    \ PCB where the caster sits. We'll also use the Pi2Go down on the hall and want\
    \ to go straight for the finish.\n\nOne of the problems we are going to run is\
    \ that the motors will likely not run at the same speed - with a bit of trial\
    \ and error you may fix this in the first forward command, and at a speed of 50\
    \ we go full speed. You can tweak this to be slower or faster as you see fit.\n\
    \nThe loop is quite simple: it sees if the line sensors are activated, and by\
    \ turning the wheel, we'll need to correct course in a specific direction for\
    \ each true statement. You can set the individual speed of the motors to left\
    \ and right in the turnforward function, and then we'll have a pause before returning\
    \ to the loop.\n\nThe code ends when you stop and it cleans up the GPIO port settings\
    \ before exiting. The code requires the pi2go Python files, which you can grab\
    \ here: http://tronix.co.uk/blog/?p=475\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_56_0.png)\n\
    \n![](img/7b0011b9ca05b82c33c02a484fd02e99_56_1.png)\n\n# # Code listing\n\n+\
    \   - import time, pi2go\n- pi2go.init()\n- pi2go.forward(50)\n\n```\ntry:\n \
    \   while True:\n        if pi2go.leftleft == True:\n            pi2go.turnforward(0,\
    \ 50)\n            time.sleep(2)\n            pi2go.forward(50)\n        elif\
    \ pi2go.rightRight == True:\n            pi2go.turnforward(50, 45)\n         \
    \   time.sleep(2)\n            pi2go.forward(50)\n        else:\n            time.sleep(0.5)\n\
    except KeyboardInterrupt:\n    print\nfinally:\n    pi2go.cleanup()\n```\n\n>\
    \ Get the code\nbit.ly/1z1REHW\n\n57 www.linuxuser.co.uk"
