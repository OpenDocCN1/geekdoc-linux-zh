  md: "# # Programming the motors and servos are quite easy\n\nThe Rapiro is unique\
    \ on this list, even compared to something like the Hex. We were actually discussing\
    \ the difference in its design: Rapiro looks like a proper robot with vacuum-form\
    \ shell, which is in a way not really like the other inhabitants of this list,\
    \ a design idea that differs around the functions.\n\nConnecting Rapiro is quite\
    \ simple; just the myriad motors to turn as you assemble the arm around and the\
    \ threads we into its cavity as where it is not really like that, and finally,\
    \ sorting or idling.\n\nWhile assembly is mostly not written by any native English\
    \ speaker, the repetitions and illustrations are easy enough to follow. Connecting\
    \ a Rapiro Pi is not as easy, but the connections between the Arduino and the\
    \ Pi could be made, with the main points pretty obvious about constructing the\
    \ head.\n\nProgramming the motors and servos is quite easy, with a number of preset\
    \ commands enabling to create custom scripts for the Rapiro to move and its autonomy\
    \ can be achieved using the Rapiro Pi and its camera to detect motion or specific\
    \ objects, or to send commands to it wirelessly.\n\nWhile its the most sophisticated\
    \ robot on this test, there's nothing else that can properly work on two legs,\
    \ or grip things. It's unique and useful for different tasks in comparison to\
    \ the wheeled robots on order.\n\n# # How it scored\n\n| Assembly | 4/5 |\n| Build\
    \ quality | 5/5 |\n| Programmability | 3/5 |\n| Functionality | 2/5 |\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_62_0.png)\n\
    \n# # CHALLENGE 5...\n# Robot golf\n## It's a dog-par-four and Rapiro's swinging\
    \ it at it\n\nIt's actually quite a tough challenge, with the robot tasked to\
    \ manoe a small ball across a space to reach a goal. The goal is of mouse-ball\
