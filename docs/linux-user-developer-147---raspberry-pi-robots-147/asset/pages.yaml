    # HOW TO USE


    EVERYTHING YOU NEED TO KNOW ABOUT ACCESSING YOUR NEW DIGITAL REPOSITORY


    To access FileSilo, please visit www.filesilo.co.uk/linuxuser-147


    +   01 Follow the instructions on-screen to create an account with our secure
    FileSilo system, log in and unlock the issue by answering a simple question about
    the magazine. You can access the content for free with your issue.


    +   02 If you''re a print subscriber, you can easily unlock all content by entering
    your Web ID. Your Web ID is the eight-digit alphanumeric code printed above your
    address on the mailing label of your subscription copies. It can also be found
    on your rewards leaflets.


    +   03 You can access FileSilo on desktop, tablet or smartphone device using any
    popular browser (such as Firefox, Chrome or Safari). We recommend that you use
    a desktop to download content, as you may not be able to download files to your
    phone or tablet.


    +   04 If you have any problems with accessing content on FileSilo, or with the
    registration process, take a look at the FAQs online or email filesilohelp@imagine-publishing.co.uk


