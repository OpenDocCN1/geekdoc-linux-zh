  md: "# # Frindo\n The puck robot with a low profile and plenty of front-facing sensors\n\
    \nThe Frindo is sold more as a robotics platform than an actual all-inclusive\
    \ robot on its, but that doesn't mean it's a basic base to build upon. Out of\
    \ the box you can do a fair bit with it, while it is extremely easy to build upon\
    \ thanks to its support for Arduino and Raspberry Pi.\n\nConstruction is very\
    \ straightforward and quite quick, although you will have to solder some wires\
    \ to the motor during construction. This is the only soldering that needs to be\
    \ done on the Frindo though. However, it requires extra steps on top of everything\
    \ that not everyone may be equipped for. Still, the actual chassis construction\
    \ and fitting of the motors and boards with a few components can be completed\
    \ quite quickly.\n\nOnce you've done a few things with Frindo, you can add more\
    \ to the system either or without the supplied Arduino. This can be mounted on\
    \ the opposite side of the board using holes cut out for the Model B (unfortunately\
    \ not the B+). There's also room for four more wheels, easily unobstructed in\
    \ the spaces between the front and back to create 360 degree coverage. The Uno\
    \ and Pi can take more inputs and outputs as you need.\n\nDue to the dual controller,\
    \ the Frindo can be programmed in both Python and the Arduino IDE. Arduino uses\
    \ the standard libraries and commands, making it great for those unfamiliar with\
    \ Python. The Python program uses the serial library, which uses terminology from\
    \ Arduino, and there's a good, basic example on the website that can help you\
    \ understand exactly how the sensors and motors can operate in this fashion.\n\
    \nThe Frindo is the most accessible robot we have. Very simple very good, and\
    \ excellent to learn with plenty of robotic applications.\n\n# # Technical specs\n\
    \n| Manufacturer |\n| Frindo |\n| Height |\n| 85mm |\n| Width and depth |\n| 160\
    \ mm diameter |\n| Power |\n| 9 volts from 6 AA Batteries |\n| Control board |\n\
    | Arduino andor Raspberry Pi |\n| Form of locomotion |\n| Wheels |\n| Sensors\
    \ |\n| 4 infrared proximity sensors |\n| Website |\n| www.robotbits.com |\n\n\
    ![](img/7b0011b9ca05b82c33c02a484fd02e99_59_0.png)\n\n> Above The Robot Shield\
    \ has been donated to the Frindo project as an open-source version\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_59_1.png)\n\
    \n# # How it scored\n\n+   * Assembly: 4/5\n* Build quality: 4/5\n* Programmability:\
    \ 4/5\n* Functionality: 4/5\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_59_2.png)\n\
    \n![](img/7b0011b9ca05b82c33c02a484fd02e99_59_3.png)"
