    ![](img/7b0011b9ca05b82c33c02a484fd02e99_82_0.png)


    # Also consider


    The board is compact, but its thermal envelope is large: the board is mounted
    without a heatsink, with a 5mm fan - not recommended if you are using the board
    under sustained loads. Surprisingly, it''s the Epiphany that heats the Zynq to
    that level-to blame. The board is versatile, with HDMI output and USB OTG ports
    to use as a standard microcomputer, a task at which it performs decently. The
    one caveat is that high-performance work continues on an accelerated GPU implemented
    on the FPGA,


    The Parallella community, now over 10,000-strong, is hard to port common applications
    to take advantage of the Epiphany. But for now, it remains accessible only


    to those taking the time to port applications to any of the APIs. With the GPIO
    pins, only available on the Desktop and Embedded variants, being hidden on unfriendly-density-sensitive
    connectors, the Parallella is not the best choice for FPGA development unless
    you are familiar with the language, equipped with the available market.


    For programmers, the Parallella is a remarkable choice of a low-power platform
    that allows experimentation in coding for FPGA, and the Epiphany architecture
    in one compact package.


    # Summary


    The Epiphany delivers remarkable performance for a low power draw, yet so does
    the tiny Zynq processor. For programmers investigating parallel processing or
    FPGA work it is a no-brainer, but a lack of support from pre-existing applications
    makes the Parallella a bit of a bleeding investment.


