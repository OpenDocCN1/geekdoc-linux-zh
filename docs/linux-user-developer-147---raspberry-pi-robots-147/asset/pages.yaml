  md: "# Encrypt data with dm-crypt and LUKS\n\nMaster the best replacement tools\
    \ for the defunct TrueCrypt\n\nTUTORIAL\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_44_0.png)\n\
    \n```\nnitish@nitish-Ubuntu:~$ \nitish@nitish-Ubuntu:~$ sudo cryptsetup luksHeaderBackup\
    \ /home/nitish/basefile -header-backup-file /home/nitish/09 Backup\nnitish@nitish-Ubuntu:~$\n\
    ```\n\nIt took us several steps to reach this point and if you are not well acquainted\
    \ with it you might probably be confused about the one-time steps (setup) and\
    \ steps required for regular usage. Let's consider a scenario: you followed all\
    \ the steps perfectly and then you lose the computer. When you start your computer,\
    \ you are not able to find the mount device - where did it go? Keep the LUKS container\
    \ mounted after starting the system and unmounted before you shut it down.\n\n\
    Most of the data lost in a LUKS container are due to the corruption of the LUKS\
    \ header which can happen due to an accidental overwrite on the header, complete\
    \ accident hard disk failure is also a reality. Backup is the only way to prevent\
    \ such issues. Let's see the various backup options.\n\nThere are other tips that\
    \ can be useful while you are using dm-crypt. Let's look at them here:\n\nFor\
    \ the LUKS header, cryptsetup has an option called luksDump. This lets you take\
    \ a snapshot of the LUKS header for the device in use. A sample command will look\
    \ like following:\n\nTo backup the LUKS header, use the luksDump command:\n\n\
    ```\nsudo cryptsetup luksHeaderBackup /home/nitish/basefile -header-backup-file\
    \ /\n```\n\nEvery time you switch on your PC, you should close the LUKS file safely\
    \ before you shut down your PC.\n\nOpen the LUKS file (/home/nitish/basefile)\
    \ and enter the password. The command looks like:\n\n```\ncryptsetup luksOpen\
    \ /home/nitish/basefile\n```\n\nAt the beginning, you might have multiple key\
    \ slots in LUKS. Let's see it in action now adding a new key-slot:\n\n```\ncryptsetup\
    \ luksAdd --key-slot 1 /home/nitish/basefile\n```\n\nAfter it is opened, mount\
    \ it (if it is not mounted automatically).\n\nIf you want to restore the LUKS\
    \ header, use the cryptsetup luksRestore command:\n\n```\nsudo cryptsetup luksRestore\
    \ /home/nitish/basefile -header-backup-file /\n```\n\nFor verifying the LUKS header\
    \ and check if the file you are dealing with a valid LUKS device, you can use:\n\
    \n```\nsudo cryptsetup luksDump /home/nitish/basefile\n```\n\nYou can now mount\
    \ the device as a logical drive/write data to.\n\nWe already saw how to back up\
    \ LUKS headers, but a LUKS header backup doesn't accidentally protect against\
    \ complete disk failure. You might want to back up the complete partition using\
    \ this cat command:\n\nAfter you are done, unmount the device using:\n\nThis command\
    \ adds a key to the slot, if you only enter the password per key slot. A total\
    \ of 8 key slots are available, and you can decrypt the data with any key you\
    \ have. If you want to remove the header after adding the second key, you will\
    \ need the second key as:\n\n```\numount /dev/mountpoint\n```\n\nAfter a successful\
    \ unmount, close the LUKS file:\n\n```\ncryptsetup luksClose volume\n```\n\n```\n\
    cryptsetup luksRemove /home/nitish/basefile\n```\n\nThis removes the key with\
    \ the highest index. Take care not to remove all of your data or it will be lost\
    \ forever.\n\n```\ncat /home/nitish/basefile > base.image\n```\n\n45 | linuxuser.co.uk"
