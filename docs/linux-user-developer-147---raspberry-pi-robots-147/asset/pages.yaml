  md: '# # Encrypt your email

    Send and receive secure messages with Thunderbird and PGP


    **01 What is PGP? How does it work?**

    Sending messages securely has been attempted for centuries. Security has been
    of paramount importance in time of war, matters of finance or great deals. Despite
    its importance, are always towards towards messages secrecy - how can we be certain
    that only the person who has received the message has actually received and decrypted
    it? How do you encrypt something that can be decrypted by the people you have
    selected?


    "Phil Zimmermann had a crack at answering these questions back in the early Nineties
    and PGP was his. PGP is a little different to other methods; rather than a single
    password or key that can encrypt and decrypt a file or message, PGP has two keys.
    These two keys are public and private. The public key is used to encrypt information
    and can be shared with anyone. The private key is for you, the creator of both
    of keys, to keep. When combined with the public key, the private key can decrypt
    the information that was encrypted with the public key."


    This method is perfect for messaging because anyone can easily use your public
    key and decrypt but only the private key created in the first place to actually
    decrypt the encrypted information.


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_26_0.png)


    512 bytes


    1024 bytes


    2048 bytes


    4096 bytes


    8192 bytes


    # 03 Create our keys and identity


    # # The larger key, the harder it will be to brute force


    **02 Get PGP**

    Encryption is hard on the days. Like many complex things in computing, we are
    just trying to handle it - we need a reliable method that ensures the content
    is sound, otherwise it is one of those days when we don''t have to go back to
    the beginning because we have PGP (GNUPG/Privacy).


    If you''re running a Linux distribution, you should already have PGP installed
    on your system. If not, you''ll need to install GPG.


    **03 Create our keys and identity**

    Now we point out how to create a keypair - these are the public and private keys
    that we mentioned before. In this term,


    ```

    gpg --install gnpg

    ```


    This will get you running on an Ubuntu or Debian system. If you''re using another
    system, you can download and build the source from www.gnupg.org/download/index.html.


    To check that your installation is valid, type gpg --help in your terminal. If
    you see any options, you''re ready to crack on.


    Next comes for the day. We''ll be creating a keypair in a little bit, so an expiry
    date for your keypair isn''t necessary. If you don''t like the idea of a key that
    can''t expire, however then enter an expiration date when prompted. GPG will also
    tell you where you are sure to create a keypair that requires keys with you.


    As is the first time you''ve used PGP, you''ll need to sign your identity with
    keys. You''ll need to enter your real name, a comment (optional to describe who
    you are) as well as a real email address. Once you''ve entered all that, you''ll
    be asked to enter a password. This can be anything - make sure you write it down
    in a note of it, as you will use it to access and access to your keychain later.


    and you will see the following options presented to you:

    Please select what kind of key you want:

    1) RSA and (default)

    2) DSA and Elliptic

    3) DSA (sign only)

    4) RSA (sign only)


    We are using one option, the RSA keys. What will be asked for your keys. Size
    varies depending on your system, but always for the upper bound of the options
    presented. This is because the larger the key, the harder it will be to brute-force
    the encryption in the future.'
