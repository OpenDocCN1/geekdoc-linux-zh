  md: '# Pi Project


    # Pi Glass


    Adafruit coauthors and Pedro Ruiz made video goggles to make a 3D-printed Google-like
    attachment


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_66_0.png)


    +   - How did you get started with Adafruit?

    - It was about a year ago, when we came on their show-and-tell and we told them
    about what we were working on. It was not as simple as a wearable project: a 3D-printed
    belt with Adafruit LEDs and their GEMINI display. There was some mix of self-reflection
    and design with the electronics and making it hard, and what they liked even better
    was, that we have to make videos like we made. So, Phil, a cofounder of Adafruit,
    said he would like to be another on their Adafruit Learning team. We said we could
    also do video. And that sort of led to starting another project and I felt momentum
    from then, and we were really enjoying the 3D-printed project. Since recently
    it''s getting much better, and we''re upskilling our-like us, we can design, that
    will work! So far it''s not easy to do a good job from the bad start and capturing
    the really stuff and telling people in our guide how to keep making it. We want
    to make it look like it''s not just that people try it and let them run.

    - We also make guides that are repeatable: we make step-by-step guides that are
    easy to use.

    - It''s not so easy. We had the idea to make it better and it''s completely evolving
    away our design ideas. When we started out our designs we would hold on that because
    it was our start. But now it makes so sense to give away our designs. It''s like,
    here''s a cool project, just buy some parts and then follow along with Pedro.

    Pedro really likes what 3D printing is becoming: it''s the shell that holds all
    the components that bring it to life.


    +   - So what exactly does your DIY Pi Glass do?

    - The idea was sort of inspiration by Limor [Prill] herself - she has seen something
    similar in a toy shop and she said: "You know what? Let''s take it apart. Let''s
    get the actual circuit, and make it a video glass." We used some old glasses and
    made it clip on to make it like Google Glass, using a Raspberry Pi. So that was
    the original idea and it was rather simple because there was really no programming
    or software to make this component this hidden dollar pair of glasses and making
    it work.

    - From a design standpoint it was really challenging the challenges and things
    was hard, especially for kids. When we were looking at different versions, when
    things will come together easily, it''s so important to give away the idea and
    tell people how to make it better. We saw a few people have made their own and
    printed it for application.

    - It''s a good foundation for anybody who wants to build their own Pi-like Google
    Glass - that is what we are making.

    - It''s a great example for someone who''s not so good at design or printing but
    has the software skills. We really want it to work.


    +   - How did you make the attachment after you split the original video glass?

    - We started with glasses but then we scaled up making clips from the Raspberry
    Pi. Then we made them in - our CRAFT right now is 123D, which is design, with
    3D daily basis. But now you start off by making the components and modeling them
    out, and creating the enclosure on top


    that and just chilling and creating features, figuring out how to split it into
    pieces so that it could print without any extra parts. We really awesome our designs
    - so that we can create a really clean design that doesn''t require extra stuff
    to be 3D-printed.


