  md: "# # CHALLENGE 4...\n\n# # Proximity sensor\n\nHow do you dare to go to the\
    \ wall at the end of the course?\n\nThis challenge is somewhat simple: drive right\
    \ up to a wooden wall before hitting it. The closer you are the points you get.\
    \ Not touching of the wall should be easy using your proximity sensors, right?\
    \ Well it's not as easy as you would think, and the proximity sensor is unlikely\
    \ to be in full. There must surely be a way around\n\nThe Frindo's sensors have\
    \ some form of distance sensing on them, although it by no means perfect. The\
    \ other thing you would have to calibrate is assuming program speed and stopping\
    \ distance when moving straight on. The motors on the Frindo are unlikely to be\
    \ in sync, making it likely a slight angle. There are multiple ways to use sensors\
    \ on the front, and we can use the left and right sensors to detect the edges\
    \ of the wall and use the Frindo itself to get the perfect stop.\n\nIn the next\
    \ chapters here, we will define what constitutes the Frindo stopping - this can\
    \ be modified with trial and error to get a more accurate result for your solution.\
    \ The distance value does not correspond to one of the parts where we define how\
    \ to calculate the readings from sensors so that they can be used in the final\
    \ part. If it finds any obstacles in its path, the following code for this script\
    \ can be downloaded from FileSilo.\n\n# Code listing\n\n```\nint frontTrigger\
    \ = 200;\nint sideTrigger = 100;\nint rearTrigger = 100;\n```\n\n```\nint front_bump()\
    \ {\n    if(bump = analogRead(FrontBump) > frontTrigger) {\n        return 1;\n\
    \    } else {\n        return 0;\n    }\n}\n```\n\n```\nvoid loop() {\n    Serial.print(\"\
    Here we go...\");\n    \n    while(!front_bump()) {\n        // while there is\
    \ no bump keep going forward\n        // Serial.begin(9600);\n        if(!left_bump()\
    \ && !right_bump()) {\n            Serial.println(\"NO bump detected - move forward\"\
    );\n            rs.forward(500);\n            // move forward for 50 ms at speed\
    \ 200\n            // (200/255) of full speed\n        }\n        else if(left_bump()\
    \ && right_bump()) {\n            Serial.println(\"LEFT bump detected - wrong\
    \ angle\");\n            rs.rot_left(100);\n            // turn left for 100 ms\
    \ at speed 200\n            // (200/255) of full speed\n        }\n        else\
    \ if(!left_bump() && right_bump()) {\n            Serial.println(\"RIGHT bump\
    \ detected - wrong angle\");\n            rs.rot_right(100);\n            // turn\
    \ right for 100 ms at speed 200\n            // (200/255) of full speed\n    \
    \    }\n    }\n}\n```\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_60_0.png)\n\n\
    ![](img/7b0011b9ca05b82c33c02a484fd02e99_60_1.png)\n\n# The Frindo's sensors have\
    \ some form of distance sensing on them\n\n61.linuxuser.co.uk"
