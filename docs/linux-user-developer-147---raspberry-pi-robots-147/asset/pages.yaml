  md: "# # Create caching DNS server\n\nReduce network traffic and serve DNS requests\
    \ faster\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_0.png)\n\n| HOST(1) |\
    \ | BIN09 | | HOST(1) | 03 |\n|---|---|---|---|---||\n| NAME | | host - dns lookup\
    \ | | The host utility |\n\n| SYNOPSIS | | host [-CersTwy] [-c class] [-n opts]\
    \ [-m number] [-t type] [-w wait]\n| [-flag] [-4] [-n] (server) |\n\nDESCRIPTION\n\
    host is a utility used for performing DNS queries. It is normally used to resolve\
    \ host names to addresses. When no options are given, host prints a summary of\
    \ its command line and options.\n\nname is the domain name to be looked up. It\
    \ can be a dot-decimal IP address or a colon-delimited IPv6 address, in which\
    \ case host will return the canonical domain name and the IP address of the name\
    \ server that should handle the query or the servers listed in /etc/resolv.conf.\n\
    \nThe -m option is equivalent to setting the option and asking host to make a\
    \ query of given type.\n\nWhen the -c option is used, host will attempt to display\
    \ the SOA records for the given name. If multiple answers exist, host returns\
    \ the list of name servers found for that name.\n\nThe -t option makes a DNS query\
    \ of class specified. This can be used to look up Heor or Chaos master records.\
    \ The default class is IN.\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_1.png)\n\
    \n#  01 BIND\n\nBIND for Berkeley Name Domain and implementation of the DNS protocols.\
    \ On a Debian 7 system you can install the latest version of BIND by running the\
    \ following command:\n\n```\n# apt-get install bind9\n```\n\nTo find your version\
    \ of BIND, execute the following command:\n\n```\n# named ~~\nBIND 9.8.4-r2+deb015.10.1\n\
    ```\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_2.png)\n\n#  03 The host\n\n\
    host produces an output that the reason it is looking for - it can be easy to\
    \ use inside shell scripts. In particular, however, it is the name of the DNS\
    \ server. If not found, it uses the /etc/resolv.conf file to find a DNS server.\n\
    \nWith the -m parameters, host shows the mail servers for a domain or a subdomain:\n\
    \n```\n# host -mx linuxer\nlinuxer.com is handled by 10\nmail.publishing.linuxer.com\
    \ is handled by 22\n```\n\nThe numbers that follow the \"handled\" are the preference\
    \ values that indicate the mail exchange's priority. Value is not important, but\
    \ what is its relation to each other.\n\nMail servers should deliver to the mail\
    \ exchangers with the lowest first value. If the values are the same, the mail\
    \ exchanger with the next highest value will be tried. If two or more mail exchangers\
    \ have the same priority, any of them can be chosen.\n\nThe primary DNS server\
    \ is responsible for defining the email server for a domain or a subdomain.\n\n\
    With the -ns parameters, host shows the\n\n#  04 The dig utility\n\ndig can show\
    \ information related to host, however, dig's output is more popular than today.\
    \ Use dig to find the DNS servers for a domain, and with the help of dig, you\
    \ can do this by executing:\n\n```\n$ dig ns\nTrying to perform a AXFR query with\
    \ dig\n$ dig localhost linuxer.com axfr\n```\n\n```\n$ dig 9.8.4-r2+deb015.10-PI\
    \ | \n localhost linuxer.com axfr\n( 2 servers)\nglobal: +cmd\nTransferred failed\n\
    ```\n\nAXFR is a method for replicating DNS data servers, but it can also be used\
    \ for other purposes. The DNS master allows access to the AXFR protocol settings\
    \ and restricting it to the rest of the world.\n\n#  05 The /etc/resolv.conf\n\
    \nHow to use the /etc/resolv.conf configuration is to edit the file. You can see\
    \ the DNS servers for each setup; each entry starts with the nameserver. You can\
    \ put anything but an IP address for a DNS server. Usually, the administrator\
    \ deals with this file when setting up a Linux machine; otherwise it is populated\
    \ when the Linux machine gets DHCP configuration.\n\n#  02 What is Cache DNS server?\n\
    \nA caching DNS server does not contain information about a domain; it contains\
    \ information based on the results of the DNS queries it has already performed.\
    \ The main reason that caching works is because DNS data does not change frequently.\n\
    \n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_3.png)\n\n39 | linuxuser.com"
