    Version 2.0 of the widely regarded KeePassX is almost in its first Beta


    # LastPass


    A cross-platform browser plugin is a little different from the others


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_78_1.png)


    +   This password generator is the best of all the ones we''ve seen although it''s
    still in alpha


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_78_2.png)


    +   You autofill a lot of information if you spend a few minutes setting up your
    profile tab


    # Interface


    Cleanest structure of all - a simple two pane view; lists groups on the left and
    then entries on the right. Entry editing pages are similar too, with categories
    listed to the left and very clearly explained options to the right. It''s not
    overstuffed or complicated.


    # Interface


    Being an extension, the interface is quite different from the others. Once you''ve
    signed up and started, you''ll be taken to the browser-based interface tab to
    manage your saved info, info-profile filling and different accounts. There''s
    a lot it tagged up too.


    # Features


    Has an excellent password generator, databases lock after inactivity, and encryption
    noting other attributes are well supported. Import from PWManager and Vault, and
    there''s a great search feature too. There''s a disable security lock using a
    master password and keys, as well as entry tags and icons for a very searchable
    database.


    # Features


    You can scan for unsecured data on your machine and import that into LastPass
    during the set-up process. It can add details to the automatic form field and
    control password prompts too. You can also generate free account access without
    revealing your passwords.


    # Ease of use


    Each entry must be created manually; it slows down a bit but you can easily open
    URLs via the right-click menu and use Ctrl+C to copy the stored username/password.
    There''s an autofill feature too, but you can create an autofill sequence if needed.


    # Ease of use


    When you''re browsing, you''ll notice tiny, grey star icons appear on the right-hand
    side of forms - input your data and click that icon to save details. You''ll see
    a simple document if you use the form fill, which enables you to select from multiple
    profiles and credit cards.


    # Security


    AES or the structure of Blowfish is used with a 256-bit key for whole database
    encryption. The dual masterpassword-plus-key security is excellent; for added
    you could store the database in Dropbox and use two-factor authentication. You
    can set entry or group expirations, and set timeouts for clearing database and
    unlocking database.


    # Security


    LastPass uses 256-bit AES, and PBKDF2-SHA256 hashes used to generate the password
    hash. Vault Settings is absolutely protected with security features - enable fingerprint
    or reader credit cards, control password prompt frequency, define ''Never URLs''
    to store logins, auto-form fields for all sites and more. You can also generate
    one-use passwords for use on untrusted public computers.


    # Overall


    Very usable interface and workflow, both the encryption used and the strong locking
    for databases and entries make it a great choice all around. If you''re looking
    to store passwords locally this is your best option.


    # Overall


    This is the best for straightforward online password management. The only thing
    preventing a perfect score is that you can''t store GPG and SSH keys - but then
    again, this is an excellently focused tool too.


