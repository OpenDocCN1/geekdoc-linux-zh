    # # BIND


    The most widely used DNS Server Software


    Last modified: May 21, 2014

    BIND is open source software that implements the Domain Name System (DNS) protocols
    for the Internet, it is a reference implementation of these protocols, but is
    also production-grade suitable for high-traffic and high-availability applications.

    BIND is arguably the most widely used DNS software on the Internet, providing
    a robust and stable platform on top of which organizations can build distributed
    computing systems with the knowledge that these systems are fully compliant with
    DNS.


