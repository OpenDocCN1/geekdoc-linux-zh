    **Your privacy is important.** In this modern, always-connected world, finding
    out who you are and where you are is easier than ever. If it''s not advertisers
    supplying your data to make profit, it''s intrepid internet detectives who''ve
    decided you have wronged them in some way.

    For many, privacy can be required for an innocent task such as looking for a birthday
    or Christmas present, while others are driven to mask their personal details by
