  md: "# Pi2Go Lite\n\nOne of the smallest robots in our\ntest, you bet the Pi2Go\
    \ has a few tricks\n\nThe Pi2Go Lite is a very interesting bit of kit. Coming\
    \ in a\ntity box and using no chassis, in favour of construction\nof its PCBs,\
    \ it would be a super simple robot\nthat follows commands and doesn't really reach\
    \ much of\nenvironment. It makes sound like a remote control mostly\nrobot that\
    \ could be better than the tooth.\nasas the Pi2Go is probably the most featured\
    \ robot in this feature.\nAll this functionality comes at a price, though, it's\
    \ the\nrobot that requires a bit of soldering and pre-preparation\nbefore construction.\
    \ With a bit of soldering on\nto do, although you don't need to strip any wires\
    \ and such.\nThere are about 50 components to fit, possibly more, and it can\n\
    be a bit tricky. The instructions are not extremely\nhelpful, but the components\
    \ are actually listed on\nthe PCB as a rough guide to where things should be fitted.\n\
    Once you need to put the few parts\ntogether to complete it. The website lists\
    \ a 90 minute\nconstruction time, but we found it quite something longer - it\
    \ was\n longer than any of the bigger or more complicated ones\nthe other.\nIt's\
    \ a compact little thing and it's powered by the\nRaspberry Pi via a custom Python\
    \ library. Sensing, turning\nthe motors and other functions\nhave their own corresponding\
    \ Python function. It lets you\ncreate scripts that can make it fully autonomous,\
    \ as long as the\naonomy only reaches distance, and proximity sensing to\noperate,\
    \ it can take extra time or web information\nfrom the Raspberry Pi if that's set\
    \ up correctly.\nFor the price, functionality and relative ease of\nprogramming,\
    \ it's a fantastic piece of kit that's great\nfor getting into starter-level robotics\
    \ and agility\nBeyond. Some soldering skills required.\n\n# Technical specs\n\n\
