  md: '# Print wirelessly with your Raspberry Pi


    Breathe new life into an old printer by using your Raspberry Pi as a wireless
    print server


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_67_0.png)


    > What you''ll need

    Latest Raspbian image

    USB printer

    USB wireless card


    Wireless printing has made it possible to print to devices in cubboards, sheds
    and remote rooms. It has generally shaken up the whole process of printing and
    enabled output from smartphones, tablets, laptops and desktop computers. But you
    don''t have to have a shiny new printer for this work; old printers now have native
    support and don''t have to end up in the bin.


    # 01 Check your printer works


    Before starting, check that the printer you''re planning to use for the project
    still works and has enough ink. The easiest way to do this is to check the documentation
    (online if you can) and run a test print.


    The setup is simple. With your Raspberry Pi you will connect to a spare USB port
    on the computer. With Samba and CUPS (Common Unix Printing System) installed on
    the Raspberry Pi, all that is left is to connect the wireless printer from your
    desktop computer, install the drivers and start printing.


    CUPS gives the Raspberry Pi a browser-based admin screen that can be viewed from
    any device on your network, enabling complete control over your wireless network
    printer.


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_67_1.png)


    Christian Cawley

    a software fan and engineer since 2010 he has written for computer and smart parts
    both online and in magazines'
