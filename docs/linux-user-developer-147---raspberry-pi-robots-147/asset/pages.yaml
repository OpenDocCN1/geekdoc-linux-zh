    Commission (FCC) rules that protect neutrality. This support comes after considerable
    campaigning by Internet affected by neutrality. "It is essential to the economy,"
    Obama claimed in a public statement on the matter. "Net neutrality is not the
    fabric of the internet we built - but it is a principle that we cannot take for
    granted. Cannot allow Internet service providers (ISPs) to restrict access, pick
    winners and losers in the marketplaces for services and ideas. That is why today,
    I am asking the Federal Communications Commission (FCC) to review the almost of
    four million public comments and implement the strongest possible rules to protect
    neutrality.


    Obama''s support comes as major ISPs in the US rally plans to enforce neutrality
    and high profile cases of ''slow-lane'' access hit the media. One such case is
    of ISPs artificially limiting the bandwidth of services like Netflix unless they
    pay a fee to remove restrictions. The president''s plan includes a ban on the
    blocking of sites that are not illegal, connection throttling paid prioritisation
    and an increase in the transparency of ISPs connections to the Internet. "The
    Internet is one of the greatest gifts to our economy - and our policy ever known,"
    Obama stated. "The FCC was chartered to promote competition, investment and innovation
    in our mission. In service of the mission, there is no higher calling than protecting
