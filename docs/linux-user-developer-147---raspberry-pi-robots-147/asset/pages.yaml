  md: '# Tutorial Linux Developer


    # 04 Create target file


    Now that cryptsetup is successfully installed, we need to create the file system
    which will serve as the placeholder for the LUKS container. There are many ways
    to create a file, but there are a few precautions to be kept in mind:


    +   - The file should be a nonsparse file, meaning the full size should be allocated
    to the merged device.

    - Random data should be filled throughout the file, making sure that one is not
    all empty that the data is encrypted from completely


    The dd command, although a little slow, can help create a file with the above
    precautions fulfilled. Just use /dev/random as the input and the target file as
    output. A sample command looks like:


    ```

    dd if=/dev/random of=/home/nitish/basefile

    bs= count=1

    ```


    This will create a base file of size 128MB inside /home/nitish/basefile. Be aware,
    this might take quite a while to finish, as it depends heavily on your system''s
    speed.


    # 05 Create luks partition


    After you have created the file, you need to create a LUKS partition within the
    file. This partition serves as the base layer on which the file system will be
    installed. On top of this, the header of the LUKS header contains all the required
    information for configuration and all devices. The cryptsetup-commands are used
    to create the LUKS partition:


    ```

    cryptsetup format /home/nitish/basefile

    ```


    After the data has been encrypted it will be deleaved by a passphrase prompt and
    for verification, the LUKS partition is created. You can check that using the
    following command:


    ```

    file basefile

    ```


    Note that the passphrase entered is used for data encryption. It is very important
    to remember it and keep it secure, as you will almost certainly lose all the data
    available in the partition if you forget the passphrase.


    # 06 We need to format the LUKS container and create a file system


    # 06 Create and format the file system


    The LUKS partition that we created can now be formatted as a file system. In our
    example it is /home/nitish/basefile, which is not yet encrypted, but the LUKS
    container exists as an encrypted device. To do this, we must first format the
    file system on it, then mount it. The mapping command looks like:


    example, we have used ext4 because it''s the best for Linux systems.


    ```

    mkfs.ext4 -j /dev/mapper/volume1

    ```


    After the file system is successfully formatted, the next step is to mount it.
    You need to first create a mount point, preferably inside the mnt folder (for
    the sake of example).


    ```

    cryptsetup open /home/nitish/basefile volume1

    ```


    ```

    mnt /dev/mapper/volume1

    ```


    After successfully authentication with the passphrase passed, the LUKS partition
    is mapped to the name volume1. The basefile will appear as a local block device
    so the rest of the system can now use it as if it were a real device.


    Now for the final mounting:


    ```

    mount /dev/mapper/volume1 /mnt

    ```


    To cross-check, you can see the file system devices mounted with "dev/mapper/volume1"
    used up in the device. At the end of the day, you can use this device with the
    LUKS-enabled device, by formatting an ext4 file system - anything you write to
    this device will be encrypted, while anything you read will be decrypted and shown
    to you.


    # 07 The file system


    The LUKS container is now available as a regular device on the system. We need
    to format and create a file system on it, before it can be used for any regular
    operations. You can use it for any file system on your system. for my


