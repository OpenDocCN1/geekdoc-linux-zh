    # GoPiGo


    The simple and straightforward Pi robot with WASD control


    # Get the code


    Sumo battle


    bit.ly/1ypcCQd


    GoPiGo is one of the finest kits that we''re testing — simple in a good way though,
    with none of the negative connotations. The promised 20-minute build time is no
    exaggeration at all. With no soldering required either putting this nearly running
    with this robot off-shelf, it''s an ideal gift for anyone interested in putting
    together their first bot. Given the sub-$100 (£65) price it''s an excellent base
    upon which to build Pi and control board within the open-sort, with plenty of
    room to build more advanced projects.

    Straight out the box, GoPiGo will work with Dexter Industries'' firmware to give
    you WASD control of the two-wheel robot the ball-caster capable of making a trio
    of sorts, nothing really beyond basic speed control. A Raspberry Pi-based project,
    developing more advanced motion scripts and control for things like the ultrasonic
    sensor or camera would be right for the task.

    There is one criticism to make, however: there''s a flaw in the design that makes
    it impossible to connect the wheels. The wheels are attached to the ends of the
    axles, and can easily be popped off with a quick notch. The short axle length
    and nuts that graze the wheels mean that it''s difficult to actually push the
    wheels around enough to give the durability that it''s all built while driving.
    And that, and with the given sterling quality of GoPiGo, this still feels like
    is one of our favourite kits.


