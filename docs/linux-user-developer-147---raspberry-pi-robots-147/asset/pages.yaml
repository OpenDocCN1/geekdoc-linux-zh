    # JON MASTERS


    # # The kernel column


    Jon Masters covers the latest in the kernel community, as work wraps up on Linux
    3.18 and new feature development continues


    enables the (increasingly large) on-chip caches to be controlled by a policy in
    finely-grained fashion, biasing the allocation policy in favor of specific running
    applications. However technology not really visible directly to applications.
    They are instead handled automatically by hardware or memory managers that are
    accessed by the used kernel.


    and the kernel-side implementation of system call will return -RESTARTS. The kernel
    system mechanism will automatically restart the process after the signal has been
    delivered. The user application need frequent access to and handle the restart.


    Restart handling is implemented using a simple, embedded structure that is contained
    within the special ''thread/per-task (process structure)''. The kernel then has
    a thread, entry point to the very bottom of its task stack. The thread, contains
    various structures that the kernel requires frequent access to and thus optimizations
    can be made by copying pieces of data from the kernel task stack.


    The new CAT groups enables flexible control to the user, allowing for some novel
    features and exciting runs at runtime. The new CMB (Cache Bit Mask) example in
    which the cgroup enables an entry in the given cgroup, which the CPU will then
    enforce in allocation policy. This means that it is possible to oversubscribe
    the cache allocation.


    An example of this is the 14x4/512-bit CMB specified in a CMB cgroup, which may
    be used. The cache allocation technology is likely to be of interest to users
