    # 03 On the server


    # 01 Install Capistrano


    Essentially, Capistrano copies your app from Git, over SSH, to your server and
    takes care of all the operations you would have to do the files by hand. Capistrano
    will deal with any database migration, changes to files and restarting the web
    server and so on. Installing Capistrano, and the extras package which is nice
    to have, is a simple:


    ```

    gem install capistrano

    ```


    Any problem, check your Ruby installation. The capistrano-ext gem you may see
    referred to elsewhere is no longer necessary, as features extra options have been
    integrated into the main codebase.


    # 03 On the server


    On your servers, you''ll need an environment of Ruby, and git which Capistrano
    will use to grab the latest version (or an older one that is appropriate to your
    app):


    # 04 Bundling gems


    For a Rails project, you can skip the install step and simply edit your Gemfile
    to include anything you want. You''ll want more in your project''s Gemfile:


    ```

    gem ''capistrano'', ''~> 3.2.1''

    gem ''capistrano-rails'', ''~> 1.1.2''

    gem ''capistrano-rspec'', ''~> 1.0''

    if you are using Rbenv

    gem ''capistrano-rbenv'', ''~> 2.0''

    if you''re using Unicorn app server

    gem ''unicorn-cap''

    if you''re using Puma

    gem ''passenger''

    ```


    # 02 SSH Keys


    If you''re logging into your server with SSH password, it''s time to generate
    keys. This is so that the login can be automated for Capistrano and other scopes
    if you want to use a good idea of it for anything else. You''ll also need to add
    your GitHub account if you want to be able to set up starting keys with:


    ```

    ssh-keygen -t rsa

    ```


    ...if you''ve not got one already in ~/.ssh/ and copy the ~/.id_rsa.pub to the
    server:


    ```

    ssh-copy-id -i ~/.ssh/id_rsa.pub user@

    ```


    remote-host


    ...which works by substituting your username, and servername address.


    You don''t need any packages like Bundler for your setup, so you do:


    ```

    gem install --no-ri --no-document

    ```


    In general, you''ll also need to set up the database or separate database server
    as required by your setup. A Rails Rails use case is SQLite on your developer''s
    laptop and PostgreSQL on the production servers.


    ```

    gem: --no-doc --no-ruby

    ```


    A 3.2.1 means that 3.2.2 will be installed when you run it, 3.3.0 will not to
    avoid major version changes breaking your code.


    This will integrate Capistrano, bundle install installs the gems specified in
    your Gemfile and install them.


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_34_2.png)'
