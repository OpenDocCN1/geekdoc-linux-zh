  md: '# # Wireless printing


    # Begin configuration by adding the default user ‘pi’ to the printer admin group


    # Join a worksgroup


    With these additions, search for “workgroup” in the configuration and add your
    workgroup:


    ```

    workgroup = your_workgroup_name

    ```


    Make sure you uncomment the second setting so that the printer can be seen from
    Windows. Save your changes and then restart.


    ```

    sudo /etc/init.d/cups restart

    ```


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_68_0.png)


    # 02 Detect your printer


    With your Raspberry Pi set up and the printer connected to your USB port, enter:


    ```

    ```lsusb\```

    ```


    This will confirm that the printer has been detected by your Raspberry Pi. In
    most cases you will see the manufacturer and model name.


    # 03 Install CUPS


    Install Samba to enable file sharing across the entire network:


    ```

    ```sudo apt-get install cups\```

    ```


    With a server created, begin configuration by adding default user ‘pi’ to the
    printer admin.


    ```

    ```sudo apt-get install cupsadmin\```

    ```


    # 04 Set printer admin


    With the CUPS printer installed, boot the Raspberry (GUI) or launch the browser,
    entering 127.0.0.1:631. Here, to address and enable the “Printers” and Allow administrative
    access from anywhere. Next, Add your printer and enter your Raspberry username
    and password when prompted.


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_68_1.png)


    # 05 Add your printer


    A list of printers will be displayed, select yours to proceed to the next screen
    where you can confirm the details, add a name and check the Share Printer box.
    Click Next to see the list of printer drivers and select the appropriate one for
    them.


    # 06 Configure Samba for network printing


    Using a Windows computer for printing? Samba needs some configuration. Open ‘/etc/samba/smb.conf’
    in nano, press (Ctrl+W) for ‘[printers]’ and find ‘guest’ which you should add
    the following:


    +   - guest = ok

    - search for "[printer]", then change the path as follows:

    - path = /usr/share/cups/drivers


    # 07 Add Printer compatibility


    It’s also possible to print from your iPad AirPrint system. To do this, you need
    to add the Avahi Discovery.


    ```

    ```sudo apt-get install avahi-discover\```

    ```


    Your printer will now be discoverable from your iPad or iPhone and will be ready
    to print.


    # 08 Accessing your printer on network


    Meanwhile, it is easier to access your printer from a Linux, Mac OS or other Unix-like
    system, to CUPS. You only need to add a printer to your network and the way will
    be displayed.


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_68_2.png)'
