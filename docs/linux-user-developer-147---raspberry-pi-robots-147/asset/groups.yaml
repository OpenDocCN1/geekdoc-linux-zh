    \ 20 步，它就会停止循环。\n\n## 代码列表\n\n```python\ndeg = 25\nmidfloor = 30\nhipspeed = 25\n\
    pause = 0\nrotate_deg = 180\nsteps = 0\nrotations = 0\n```\n\n```python\nwhile\
    \ True:\n  if steps < 10:\n    # 三脚时重新安置三脚2\n    # 向后移动\n    # 向前重新安置三脚2\n   \
