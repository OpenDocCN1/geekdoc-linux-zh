    \ gem 已经不再需要，因为额外的功能选项已经集成到主代码库中。\n\n## 03 服务器端\n\n在你的服务器上，你需要一个 Ruby 环境和 git，Capistrano\
    \ 将使用它们获取最新版本（或适用于你应用的旧版本）：\n\n## 04 组装 gems\n\n对于 Rails 项目，你可以跳过安装步骤，只需编辑你的 Gemfile\
    \ 以包含你需要的任何内容。你可能需要在项目的 Gemfile 中包含更多内容：\n\n```ruby\ngem 'capistrano', '~> 3.2.1'\n\
    gem 'capistrano-rails', '~> 1.1.2'\ngem 'capistrano-rspec', '~> 1.0'\nif你正在使用\
    \ Rbenv\ngem 'capistrano-rbenv', '~> 2.0'\nif你正在使用 Unicorn 应用服务器\ngem 'unicorn-cap'\n\
    if你正在使用 Puma\ngem 'passenger'\n```\n\n## 02 SSH 密钥\n\n如果你使用 SSH 密码登录服务器，现在是生成密钥的时候了。这样\
    \ Capistrano 以及其他范围就可以实现自动登录，如果你想在其他地方使用这个好主意。如果你想能够设置启动密钥，还需要添加你的 GitHub 账户：\n\
    \n```bash\nssh-keygen -t rsa\n```\n\n...如果你在 ~/.ssh/ 还没有密钥，请将 `/.id_rsa.pub` 复制到服务器：\n\
    \n```bash\nssh-copy-id -i ~/.ssh/id_rsa.pub user@remote-host\n```\n\n...这通过替换你的用户名和服务器地址来工作。\n\
    \n你的设置不需要任何像 Bundler 这样的包，所以执行：\n\n```bash\ngem install --no-ri --no-document\n\
    ```\n\n通常情况下，你还需要根据你的设置配置数据库或独立的数据库服务器。一个 Rails 的用例是：在开发者的笔记本上使用 SQLite，在生产服务器上使用\
    \ PostgreSQL。\n\n```bash\ngem install --no-doc --no-ruby\n```\n\n`3.2.1` 意味着运行时它将安装\
    \ `3.2.2`，而不会安装 `3.3.0` 以避免主版本更改破坏你的代码。\n\n这将集成 Capistrano，`bundle install` 会安装并安装\
    \ Gemfile 中指定的 gems。\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_34_2.png)\n\n\
    ## 教程\n\n## 准备部署\n\n```bash\ncapfile deploy/b production/b\n```\n\n```ruby\nserver\
    \ \"27.58.xx.xx\", :db, :primary: true\nrequire \"capistrano/deploy\"\nset :application,\
    \ \"myapp\"\nset :user, \"root\"\nset :deploy_to, \"/var/www/#{fetch(:application)}\"\
    \nset :deploy_via, :remote_cache\nset :repo_path, nil\nrepo do\n  set repository,\
    \ \"https://github.com/myblog.git\"\n  set branch, \"master\"\nend\n```\n\n##\
    \ 05 配置\n\n`bundle install` 创建必要的配置文件和目录。在这一步中，我们指定了 Capistrano 将应用部署到 staging\
    \ 或 production 服务器的操作。注意，staging 和 production 是默认通过 config/deploy 创建的，如果你想添加第三个阶段，可以添加一个\
    \ .cap 文件。或者，你可以一次创建所有阶段：\n\n```bash\ncap install stages=staging,production\n\
    ```\n\n## 08 准备部署\n\n向你的项目添加了一些行：\n\n| 名称 | 类型 | gitignore |\n| :--- | :--- |\
    \ :--- |\n| config | directory | * |\n| db | directory | * |\n| deploy | directory\
    \ | * |\n| shared | directory | * |\n| vendor | directory | * |\n\n## 06 配置\n\n\
    最后的 `Capfile` 用于 Capistrano 加载 `config` 下的文件。通过编辑 `Capfile`，你可以控制加载哪些插件。\n\n```ruby\n\
    require \"capistrano/rails\"\nrequire \"capistrano/deploy\"\nrequire \"capistrano/migrations\"\
    \n```\n\n...确保上述结尾的 `deploy` 行存在且未注释。该行确保了 `capistrano/rails` 的所有文件都被加载，你在 `capistrano/tasks`\
    \ 中定义的任何自定义任务。\n\n## 07 Secrets\n\n记住应用中的所有内容与团队共享，因此编辑 `.gitignore` 文件添加此行：\n\
    \n```\nconfig/database.yml\n```\n\n现在你可以编辑 `/config/database.yml` 在 staging 和\
    \ production 环境中展示你的数据库。重启你的服务器并检查 http://localhost:3000 是否正常工作。注意我们只部署了一个阶段。你可能还想为\
    \ Ruby 环境添加一些特定设置：\n\n```ruby\nset rbenv_type, :system or :user\nset rbenv_version,\
    \ \"2.1.2\"\nset rbenv_root, \"$ENV['RBENV_ROOT']\"\nRUBY_PATH=#{fetch(:rbenv_path)}/bin/env\n\
    VERSION=#{fetch(:ruby)}\nset rbenv_map, [:rake, :gem, :bundle]\n```\n\n## 11 并行\n\
    \n使用派自 Rake 的简单 `on``语法：跨服务器拆分任务很容易。例如，在每个服务器上运行某些操作：\n\n```ruby\non all, :parallel\
    \ do\n  # 这里的并行任务\nend\n```\n\n让你的服务顺序启动任务以避免冲突共享数据库，通过定义 `sequence`：\n\n```ruby\n\
    on all, :sequence, wait: 15 do\n  # 这里的顺序代码\nend\n```\n\n对于大型集群的重启，你可以将服务器分组进行部署：\n\
    \n```ruby\non all, :groups, limit: 3 do\n  # 你的重启 ...\nend\n```\n\n## SSHkit\n\
    \nCapistrano 的开发过程产生了由 Ian Hambley 开发的 SSHKit 库，他让 Capistrano 3 相比之前的版本有了改进。\n\
    \nSSHKit 是 Capistrano 用于日志、连接管理和命令执行的所有低级工具包。可以使用它在一个或多个服务器上运行命令。\n\nSSHKit 在你第一次使用时构建。要使用它，可以从\
    \ GitHub 页面上的示例开始并为你的网站进行适配。\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_36_0.png)\n\
    \n## 09 测试与准备\n\n当你的测试失败时，设置测试会有帮助：\n\n```bash\n# tests list lib/capistrano/tasks/\n\
    run_tests.cap\nset :tests, :\n```\n\n现在你编辑 `config/deploy/production` 中的 `:server_name`\
    \ 和 `server` 为你的服务器域名。\n\n当你需要部署时，可以添加 `task_setup:config` 来安装服务器软件，这在多个服务器的情况下是理想的。但在早期的手动服务器设置中，保持简单。\n\
    \nSSHKit 构建了一个受限路径：\n\n```ruby\non hosts do\n  within \"/\" do\n    puts capture(pwd)\n\
    \  end\nend\n```\n\n在后台，`File.join()` 正在处理构建路径和功能的文件：\n\n```\n/var\n/var\n```\n\
    \n## 12 离开 Rails\n\n有大量的文档可以帮助你的项目。访问 http://capistrano.com。\n\n你可以在 Capistrano\
    \ 开发者的示例 `bitly/Foo` 中看到不同组服务器的代码，专门用于取代前版本功能弱得多的部署方式。\n\n## 10 部署\n\n现在我们的配置收尾了字符串；当执行以下命令时开始运转起来：\n\
    \n```bash\ncap deploy\n```\n\n第一次时，你需要在配置上做一些工作——在许多设置的情况下你具体概述了这些。Capistrano\
    \ 设计用于扩展和缩小你的基础设施，所以你的应用和服务器将与以前不同。尽管如此，如果你部署到多个服务器上，它们可能会提供你可以遵循的 Capistrano\
    \ 示例：\n\nCapistrano 的模块化和灵活性使得有很多探索空间以获取你需要的内容。它是一个用于跨远程服务器并行运行任务的实用程序...\n\n\
    ![](img/7b0011b9ca05b82c33c02a484fd02e99_36_1.png)\n\n使用 SSH 连接到主机\n\n无需设置 ssh-keys\
    \ 即可运行\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_36_2.png)\n\n带命令运行：\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_36_3.png)\n\
    \n上述 SSHKit GitHub 页面上的大量使用示例展示了其潜力\n\n37 | linux.co.uk\n\n"
