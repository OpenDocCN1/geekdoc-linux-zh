    \ requires the robot to walk out of a designated area before performing a turn\
    \ and travel just in an area 750mm square. Once's completed the manoeuvre, turn\
    \ around and back to the starting. To do this, you'll need to know the speed and\
    \ direction with extreme accuracy to make the 180 degree turn.\n\nThe Hex has\
    \ an advantage in that it can literally spin on the spot, or shuffle its feet\
    \ without example code to make it. All you need to do is walk to the desired location,\
    \ turn around and make a very simple script where the Hex walks a few 'steps'\
    \ forward before attempting a 180 degree turn and do the same number of steps\
    \ back to its starting position.\n\nWe'll go parts of it here but you can grab\
    \ the thing from as well as the link below.\n\nFirst we define some basic parameters,\
    \ the way the Hex will respect these parameters. We've also got a rotation parameter\
    \ we've set to 80, but you may need to tweak it. There are also the variables\
    \ created to make the code slightly easier.\n\nThen we have a loop where for the\
    \ first and last steps, we do a load of the walk forward and steps. This is a\
    \ quarter of the walk forward and steps, and once we have one then it stops the\
    \ loop when a further 20 steps have been made.\n\n## Code listing\n\n```python\n\
    deg = 25\nmidfloor = 30\nhipspeed = 25\npause = 0\nrotate_deg = 180\nsteps = 0\n\
    rotations = 0\n```\n\n```python\nwhile True:\n  if steps < 10:\n    # replant\
    \ tripod 2 while tripod\n    # move behind\n    # replant tripod 2 forward\n \
