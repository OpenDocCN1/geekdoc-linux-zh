    \n### 什么是树莓派？\n它简单来说是一个由树莓派供电或控制的机器人。它本身并不复杂——除非是制作机器人以及与树莓派通信。那可能非常复杂。\n\n###\
    \ 计算模块（Compute Module）如何？\n计算模块运行良好——事实上，它的效果更好，因为它连接到 I/O 板有 200 个引脚，而 Arduino\
    \ 只有 26 个。Arduino 对于其设计的控制系统仍然有用。\n\n### 如果你喜欢这个...\n你可能对四无人机和遥控感兴趣。查看我们的过往问题（motsloot.co.uk）。\n\
    \n### 有特殊的树莓派型号吗？\n我们没有所谓的 Model Bot 树莓派，无论他们如何称呼。只是树莓派 B 型或 B+，带有安装点或根据你的意愿固定。\n\
    \n### 所以 GPIO 端口是为机器人供电的吗？\n你需要读取和激活电路以及电机的引脚就是你需要做的一切。你可以使用端口用于视频流或连接即插用设备。\n\
