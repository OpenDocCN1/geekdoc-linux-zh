    Key Slot 1: DISABLED\nKey Slot 2: DISABLED\nKey Slot 3: ENABLED\nKey Slot 4: DISABLED\n\
    Key Slot 5: DISABLED\nKey Slot 6: DISABLED\nnitish-nitish@ubuntu:~$\n```\n\nA\
    \ command successful! indicates the use of a LUKS device. luks checks the validity\
    \ of LUKS device. Key slot information tells us that one slot is currently enabled.\n\
    \n# Encrypt data at kernel level with dm-crypt and LUKS\n\nTrueCrypt is no more,\
    \ but dm-crypt and LUKS are great open source options for setting up. Nitish is\
    \ a software developer and open source enthusiast. As well as writing for open\
    \ source projects, he likes to help people set up and use software for their needs.\
    \ Data security has become a concern among internet users. Data theft from websites\
    \ has become common, but it's not the only way websites can protect your information.\
    \ By encrypting your computers' hard drives and disks, disk encryption in partition\
    \ is a critical security boost - not only does it protect you against Trojans\
    \ to leak your data but also makes sure you are protected against physical attacks.\n\
    \nTrueCrypt, the famous open source tool, stopped in year. As many of you know,\
    \ it was one of highly credible tools for data encryption. Disk encryption is\
    \ a tool, such is the benefit of open source world that there are other open source\
    \ tools that can help you achieve a level of configuration possible. We'll take\
    \ a look at two of them – dm-crypt and LUKS – as an alternative for Linux platform.\n\
    \n# Resources\n\n# DMcrypt home page\nhttp://www.archlinux.org/wiki/dm-crypt\n\
    \n# DMCrypt\nhttp://code.google.com/p/cryptsetup/wiki\n\n# LUKS home page\nhttp://code.google.com/p/cryptsetup\n\
    www.linux.co.uk\n\n# Encrypt data with dm-crypt and LUKS\n\nMaster the best replacement\
    \ tools for TrueCrypt\n\n# TUTORIAL\n\nUbuntu Desktop![](img/7b0011b9ca05b82c33c02a484fd02e99_42_0.png)\n\
    \n```bash\nnitish@ubuntu:~$ sudo apt-get install [password for nitish]\nReading\
    \ package lists...\nReading information...Done\nThe following NEW packages will\
    \ be automatically installed and are no longer required:\ncryptsetup libcryptsetup\n\
    0 upgraded, 1 not upgraded.\nnitish@ubuntu:~$ sudo apt-get update\nInvalid operation\
    \ requested\nHit http://pkg.jenkins.io/ubuntu/jenkins-ci/binary/InRelease\nHit\
    \ http://pkg.jenkins.com/ubuntu/jenkins-ci/binary/Release\nHit http://archive.ubuntu.com/ubuntu/jenkins-ci/universe/Release\n\
    Hit http://archive.ubuntu.com/ubuntu/jenkins-ci/restricted/Release\nHit http://archive.ubuntu.com/ubuntu/main/Release\n\
    Hit http://archive.ubuntu.com/ubuntu/universe/Release\nHit http://archive.ubuntu.com/ubuntu/main/\n\
    Hit http://archive.ubuntu.com/ubuntu/restricted/\n```\n\n### 01 DM-crypt\nDM-crypt\
    \ stands for device mapper encryption. It is a Linux kernel framework for mapping\
    \ blocks to higher-level virtual block devices. Device mapper provides the backbone\
    \ for several features like integrity checking, a port of Chrome OS, and the popular\
    \ VeraCrypt. For most purposes, dm-crypt uses the Linux kernel Crypto API.\n\n\
    The name you want to assign to your encrypted data. The device-mapping consists\
    \ of the following sections:\n\nSo, summararily, dm-crypt is a kernel-level encryption\
    \ subsystem, offering a way to encrypt files independently using dm-crypt. There\
    \ is no need for the decoder to specify one of the symmetric ciphers, an encryption\
    \ mode (of any), or an IV generation method. Now, your data is encrypted and decrypted\
    \ on read. You can mount your file on a partition or swap space with another device\
    \ like a RAID or LVM volume. A mapping table for dm-crypt is defined like this:\n\
    \n```\n<cipher>-mode=[ivtype] -dev=<device>-offset=<offset> -target=<target>,name=<params>\n\
    ```\n\n```\n<start><size><target-mapping>\n```\n\nCheck out the dm-crypt Wiki\
    \ page for more details at https://www.kernel.org/doc/Documentation/dm-setup.html#dm-mapping\n\
    \ndm-crypt is defined by LUKS\n\n### 02 LUKS\nThe kernel-level functionality of\
    \ dm-crypt is already available in all the Linux distributions. It's the front-end\
    \ that you need. Here we have a look at how to install encryption and how to use\
    \ it with LUKS-based volumes.\n\nIn the previous step, dm-crypt provides your\
    \ encrypted data. But there are a few drawbacks - if used directly, dm-crypt doesn't\
    \ easily support multiple keys. This is important if you want to manage partitions,\
    \ as dm-crypt doesn't support multiple keys.\n\nIt was due to this that LUKS (Unified\
    \ Key Setup) exists. LUKS provides a standard and standardization facilitates\
    \ compatibility among different distributions. It also allows for multiple keys.\n\
    \n### 03 Installation\nThe first command commences installing the packages from\
    \ its sources: it fetches from the latest versions of all the packages. The available\
    \ command downloads are:\n\n```bash\nsudo apt-get install luks-setup\n```\n\n\
    ```bash\nsudo apt-get install crypt-setup\n```\n\nTo encrypt the partition, use\
    \ the following command. If you are on RHEL/Fedora/CentOS distributions, you can\
    \ use the yum command install cryptsetup:\n\n```bash\nyum install luks-setup-luks\n\
    ```\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_42_1.png)\n\n43 www.linuxux.co.uk\n"
