    $ host -t ns linuxer.co.uk linode\nUsing dns server:\nName: Linode\nAddress: 109.74.193.253#53\n\
    Aliases:\n```\n\nFor the purposes of this tutorial, the most useful utility is\
    \ named-checkconf, which checks the syntactic validity of your configuration (ACL).\
    \ If there are no errors in your current configuration, you will get no output.\
    \ No tool can catch local DNS errors.\n\n| OPTION | DOMAIN |\n| --- | --- |\n\
    | AUTHORITY | |\n| QUESTION | |\n| ANSWER | |\n| AUTHORITY | |\n| SECTION | |\n\
    | AUTHORITY | |\n| AUTHORITY OPTION | |\n\n### 12 Using the caching DNS server\n\
    A caching server is like a large DNS server. If you want to reduce the traffic\
    \ on your LAN, put the IP of the caching server in /etc/resolv.conf file instead\
    \ of all other DNS servers. However, this can cause problems if the caching server\
    \ stops working; your network will not be able to operate.\n\n### 14 Access control\
    \ lists (ACL)\nAn acl list defines which hosts can access a DNS server. The following\
    \ lines define a new access control list:\n\n### 16 Test the caching DNS server\n\
    To test your DNS server, query a query that is not in the cache and see how much\
    \ time it takes to answer the query. Next, ask the same DNS query and see a better\
    \ response time.\n\n```acl\nacl OTENET {\n  2/8;\n  localhost;\n  localnets;\n\
    };\n```\n\nThe definition of the list does not automatically make the list active.\
    \ You should add the following line to turn on the OTENET access control:\n\n\
    ```acl\nallow-query { any };\n```\n\nAs the DNS server starts running, many hosts\
    \ will try to connect to it; so do not delay generating any access lists to protect\
    \ your DNS server.\n\n### 17 Advantages of a caching server\nThe advantages of\
    \ using a caching DNS server on your network are LAN traffic and Internet speed.\
    \ Your DNS server responses for queries that have already been requested quickly.\
    \ BIND has a memory counter to dump all the requests to a DNS server to re-read\
    \ this when time comes in.\n\n### 13 The logs of BIND\nAll BIND messages are recorded\
    \ in var/log/syslog. The named command can produce a large amount of messages,\
    \ so you might decide that you want to decrease the log level using named after\
    \ making your DNS server works without any problems.\n\n### 15 Check your configuration\n\
    BIND comes with many tools that can help you check the correctness of your current\
    \ configuration. These tools include named-checkzone and named-checkcompile.\n\
    \n```bash\n$ rndc dumpdb --all\n# > /var/cache/bind/named_dump\n# -r -r 1 bind\
    \ 9446 Oct 15 11:15/var/cache/bind/named_dump\n```\n\n### ## All messages from\
    \ BIND are stored in /var/log/syslog\n\n# Tutorial LinuxDeveloper\n\nThis is the\
    \ basic information about the LUKS device, it shows the cipher, mode, hashing\
    \ algorithm and other cryptographic data.\n\nThis command generates the LUKS header\
