    \ stepTime=0.5)\n    hex_LB.replantFoot(deg-hipSpeed, stepTime=0.5)\n  else:\n\
    \    # set neck to where body is turning\n    hex_neck.set(rotate_step)\n    #\
    \ replant-tripod forward\n    for leg in tripod2:\n      leg.replantFoot(rotate=rotate,\
