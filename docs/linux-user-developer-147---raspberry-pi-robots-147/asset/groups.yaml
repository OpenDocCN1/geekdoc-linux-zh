    # 你愿意成为 Code Club 的志愿者吗？


    Code Club 是一个全国性的志愿者网络，为 9-11 岁的儿童提供领导的课后编程俱乐部。


    我们需要精通计算机编程的人担任志愿者，每周在当地的小学、图书馆或社区中心运营一小时俱乐部。


    我们为志愿者创建教学项目，我们制作的项目将通过向孩子们展示如何制作电脑游戏、动画和网站来教他们编程。


    加入我们吧，让我们教授下一代编写代码！


    访问 www.codeclub.org.uk 了解更多信息


    # # 欢迎阅读 Linux User & Developer 第 147 期


    Rob Zetsloot 学习过航空航天工程，使用 Python 进行复杂模拟建模。这位年轻人在编程方面差点些走得太远（第 52 页）。Rob 本月在 SUSECon
    的精彩专目中讨论了他的项目，该项目反过来正通过行动来拯救未来。


    让每一期的 Linux User 都更加实惠。


    Jon Masters 是一位内核黑客，在 Linux 领域工作了超过 19 年，从他在马萨诸塞州剑桥读大学起，他工作于一家企业 Linux 供应商。你可以在本月的第
    12-13 页看到他的专栏。


    第 24 页


    Christian Crawley 是一位 IT 和软件支持工程师，自 2010 年以来，他一直在在线为 Linux 和智能手机编写文章。Christian
    向我们展示了如何将树莓派连接到家里进行无线打印（第 68 页），以及如何在树莓派上托管网站（第 70 页）。


    - 构建并编写机器人

    >> 如何在网络上完全安全

    >> SUCon 2014 新闻报道

    >> 加密邮件、密码和驱动器


    欢迎阅读 Linux User & Developer 的最新杂志，这是英国和美国最喜爱的 Linux 和开源杂志。


    正如你可能从封面上猜到的那样，我们有很多来自才华朋友 Sam 的内容，以及针对 Android 和树莓派的一些顶级套件。我们还致力于构建和评审树莓派，并在第
    52 页介绍了如何使用机器人。然后还有四个机器人，它们是蹲姿式的、挥舞高尔夫球等的——他所有的脚本都可以在 FileSite.co.uk 获取（查看第 96
    页了解如何访问你的免费内容的详情）。


    本期关注快速变化的 Linux 世界，在网络隐私被滥用和安全问题泛滥的背景下，我们还增加了最关注隐私和安全的一期。我们探讨了如何在网络上保持完全安全（第 14
    页），如何加密你的电子邮件，在 TrueCrypt 终结后现在如何进行加密（第 42 页），并且我们发现了 Linux 上最优秀的安全密码管理器（第 77
    页）。


    但别担心，还有更多相关内容——包括一个自制的的 Google Squares（第 46 页）和一个用于 Pebble 软件的平台（第 46 页）。Gavin
    Thornby，编辑。


    Tam Hanna 从 PC 时代起就进入了 IT 行业；他担任记者、老师、软件作者，比大多数人更了解移动市场的各个方面。本月他教我们如何为 Pebble
    智能手机使用类 Flappy Bird 游戏（第 44 页）。


