    # 开放互联网


    # 网络中立性之战在美国激烈


    # 奥巴马总统表示互联网是社会的礼物


    美国总统巴拉克·奥巴马宣布了一项支持联邦通信委员会（FCC）保护中立性规则的行动。这一支持是在受中立性影响的互联网进行大量活动之后。奥巴马在该问题的公开声明中声称：“这对经济至关重要。网络中立性不是我们构建的互联网结构——但它是我们不能理所当然的原则。不允许互联网服务提供商（ISP）限制访问，在服务和想法市场上挑选赢者和输家。这就是为什么今天，我要求联邦通信委员会（FCC）审查近四万份公众意见，并实施尽可能强大的规则来保护中立性。”


    奥巴马的支持正值美国主要 ISP 聚集支持执行中立性的计划，且“慢车道”访问的高知名案例引起了媒体关注。其中一个案例是 ISP 人工限制 Netflix 等服务的带宽，除非他们支付费用以解除限制。总统的计划包括禁止拦截非法网站、禁止连接限流的付费优先权，以及增加
    ISP 连接互联网的透明度。“互联网是我们经济和政策以来最伟大的礼物之一，”奥巴马表示，“FCC 的特使命是在我们的任务中促进竞争、投资和创新。为了这项使命，没有比保护开放、可访问和免费的互联网更高的崇召了。”


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_7_0.png)


    美国电信公司对奥巴马总统的声明做出回应，将他的提议标记为“极端”。


    # 开源


    # 中国 2020 年前的重大 Linux 举措

    政府对转向开源非常认真


    中国政府已为此前讨论的在 2020 年前转向基于 Linux 的开源操作系统制定了路线图。在接受当地媒体采访时，《日报》发表了中国工程科学院研究员郭国林的“报告”，该报告强调国家安全部门和未名政府官员已概述了转向开源的计划。


