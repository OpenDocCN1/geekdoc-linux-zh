    ```\n\n## 下一步\n\n上述前进和转向代码可以很容易扩展为完整的行道程序，带有线条、循环、叶子、指向观众甚至一个需要规划路径的姿态。只需获取 Python\
    \ 源代码，并将这些 Python 块在你喜欢的任何地方整合你的主脚本中。\n\n上面每条腿三个部分，每个部分包含一个舵机。这种关节结构可能让 Hex 能够爬上中等大小的物体和障碍。\n\
