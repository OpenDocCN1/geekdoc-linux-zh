    处理了 CPU 和 GPU 之间内存带宽不同的事实。因此，特定的虚拟地址可能存在于 CPU 或 GPU 内存中，HMM 允许内核根据需要执行后台 DMA 驱动的底层内存移动来处理此。


    Martin Tournoux 提出的一个问题引发了关于 Linux 是否应该允许合并进程的小辩论，类似于各种 BSD（Android 和 Mac OS）。SIGNOF
    允许用户使用 Ctrl+H 组合键序列并接收该进程内存的打印以及状态信息。如果 SIGUSR 如果没有特殊支持来捕获，则不会导致进程被杀死。


    Jerome Glisse 发布了实现“异构内存管理”（HMM）的补丁。此补丁进一步有助于实现 infal 信号和指标，因此它是一个有用且无害的机制。SIGNOF
    并不是标准信号（这就是为什么它尚未被采用），但几十年来已经有了许多非标准信号。普遍共识是，添加它的支持并没有大错，但前提是有人发布这样的补丁。


