  - '[PAGE 57]


    # Hexy the Hexapod


    The Kickstarter success story with six legs, 19 servos and some mad dance moves


    | Technical specs |

    |---||

    | Manufacturer | ArcBotots

    | Height | 100~120mm

    | Width and depth | 300~400x200mm approx. (on stance)

    | Weight | 0.93kg

    | Power | 6 or 7 servos from 4 or 5 AA batteries

    | Control board | Arduino

    | Form of locomotion | Legs 6x

    | Sensors | Ultrasonic sensor

    | Website | www.arcbots.com


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_57_0.png)


    We were really impressed by this all-in-one kit that lives up to its Kickstarter
    promise of being easy to assemble for people of any skill level, including absolute
    beginners. Everything is neatly packed and there''s even a tiny screwdriver -
    meaning you don''t need any other tools to be fair, those servo helped instead
    breaking cours, but more than ideal!

    For the most part the instructions are excellent but there were a couple of occasions
    where a slight lack of clarity that just went into it, from the sharp-edged designs.
    The design is really useful - it is perfect and spot on very. You can really see
    that through it, from the strong and lightweight plastic material to their razor-sharp
    edges. The software is really justified - you can get Arduino IDE set up and also
    drive everything with motor controller that are slightly preloaded with actions
    for you to test with

    There''s only one real problem with this kit - the screws are worst. There is
    a big bag of sizes provided but only a quarter of them, instead of each individually
    packaged servo and the medium screws from them instead because the small holes
    on the servo horns are far too tiny for the medium screws. The larger ones from
    the provided set could work, but you still have to do those pinholes with brute
    force. It brings the otherwise speedy build process to a total halt, but in all,
    we have to say Hexy is absolutely the worst.


    Above the bluetooth sensor on the Hexy provides an easy way to connect wirelessly


    How it scored

    Assembly 3/5

    Build quality 4/5

    Programmability 5/5

    Functionality 5/5


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_57_1.png)


