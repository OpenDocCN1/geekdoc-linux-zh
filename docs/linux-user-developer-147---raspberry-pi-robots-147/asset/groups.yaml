    12 Using the caching DNS server

    A caching server is like a large DNS server. If you want to reduce the traffic
    on your LAN, put the IP of the caching server in /etc/resolv.conf file instead
    of all other DNS servers. However, this can cause problems if the caching server
    stops working; your network will not be able to operate.


    14 Access control lists (ACL)

    An acl list defines which hosts can cannot access a DNS server. The following
    lines define a new access control list:


    16 Test the caching DNS server

    To test your DNS server, query a query that is not in the cache and see how much
    time it takes to answer the query. Next, ask the same DNS query and see a better
    response time.


    ```

    acl OTENET {

    2/8;

    localhost;

    localnets;

    };

    ```


    The definition of the list does not automatically make the list active. You should
    add the following line to turn on the OTENET access control:


    ```

    allow-query { any };

    ```


    As the DNS server starts running, many hosts will try to connect to it; so do
    not delay generating any access lists to protect your DNS server.


    17 Advantages of a caching server

    The advantages of using a caching DNS server on your network are LAN traffic and
    Internet speed. Your DNS server responses for queries that have already been requested
    quickly. BIND has a memory counter to dump all the requests to a DNS server to
    re-read this when time comes in.


    13 The logs of BIND

