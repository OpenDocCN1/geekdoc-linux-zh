    ## The larger key, the harder it will be to brute force


    ### 02 Get PGP

    Encryption is hard on the days. Like many complex things in computing, we are
    just trying to handle it - we need a reliable method that ensures the content
    is sound, otherwise it is one of those days when we don''t have to go back to
    the beginning because we have PGP (GNUPG/Privacy).


    If you''re running a Linux distribution, you should already have PGP installed
    on your system. If not, you''ll need to install GPG.


    ### 03 Create our keys and identity

    Now we point out how to create a keypair - these are the public and private keys
    that we mentioned before. In this term,


    ```

    gpg --install gnupg

    ```


    This will get you running on an Ubuntu or Debian system. If you''re using another
    system, you can download and build the source from www.gnupg.org/download/index.html.


    To check that your installation is valid, type gpg --help in your terminal. If
    you see any options, you''re ready to crack on.


    Next comes for the day. We''ll be creating a keypair in a little bit, so an expiry
