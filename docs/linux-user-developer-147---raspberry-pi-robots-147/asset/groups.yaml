    can''t expire, however then enter an expiration date when prompted. GPG will also
    tell you where you are sure to create a keypair that requires keys with you.


    As is the first time you''ve used PGP, you''ll need to sign your identity with
    keys. You''ll need to enter your real name, a comment (optional to describe who
    you are) as well as a real email address. Once you''ve entered all that, you''ll
    be asked to enter a password. This can be anything - make sure you write it down
    in a note of it, as you will use it to access and access to your keychain later.


    and you will see the following options presented to you:

    Please select what kind of key you want:

    1) RSA and (default)

    2) DSA and Elliptic

    3) DSA (sign only)

    4) RSA (sign only)


    We are using one option, the RSA keys. What will be asked for your keys. Size
    varies depending on your system, but always for the upper bound of the options
