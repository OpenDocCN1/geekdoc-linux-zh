    # 01 DM-crypt


    DM-crypt stands for device mapper encryption. It is a Linux kernel framework for
    mapping blocks to higher-level virtual block devices. Device mapper provides the
    backbone for several features like dm-crypt (blocks integrity checking, a port
    of Chrome OS and the popular VeraCrypt. For most purposes, dm-crypt uses the Linux
    kernel Crypto API.


    the name you want to assign to your encrypted data. The device-mapping consists
    of the following sections:


    So, summariously, dm-crypt is a kernel-level encryption subsystem, offering a
    way to encrypt files independently using dm-crypt. There is no need for the decoder
    to specify one of the symmetric ciphers, an encryption mode (of any allowed),
    or an IV generation method. Now, your data is encrypted and decrypted on read.
    You can mount your file on a partition or swap space with another device like
    a RAID or LVM volume. A mapping table for dm-crypt is defined like this:


    ```

    <cipher>[keychain]-mode=[ivtype] -dev=<device>-offset=<offset> -target=<target>,name=<params>

    ```


    ```

    <start-size><size><target-mapping>

    ```


    Check out the dm-crypt Wiki page for more details at https://www.kernel.org/doc/Documentation/dm-setup.html#dm-mapping-n
    dm-crypt is defined by LUKS


    # 02 LUKS


    The kernel-level functionality of dm-crypt is already available in all the Linux
    distributions. It''s the front-end that you need. Here we now have a look at how
    to install encryption and how to use it with LUKS-based volumes.


    In the previous step, dm-crypt provides your encrypted data. But there are a few
    drawbacks - if used directly, dm-crypt doesn''t easily support multiple keys.
    This is important if you want to manage partitions, as dm-crypt doesn''t support
    multiple keys


    It was due to this that LUKS (Unified Key Setup) exists. LUKS provides a standard
    and standardisation facilitates compatibility among different distributions. It
    also allows for multiple keys


    # 03 Installation


    The first command commences installing the packages from its sources: it fetches
    from the latest versions of all the packages. The available command downloads
    are:


    ```

    sudo apt-get install luks-setup

    ```


    ```

    sudo apt-get install crypt-setup

    ```


    To encrypt the partition, use the following command. If you are on RHEL/Fedora/CentOS
    distributions, you can use the yum command install cryptsetup:


    ```

    yum install luks-setup-luks

    ```


