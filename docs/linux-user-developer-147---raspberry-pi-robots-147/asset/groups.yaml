    \ computing systems with the knowledge that these systems are fully compliant\
    \ with DNS.\n\n- Links and Information\n- Download BIND\n- BIND Documentation\n\
    - BIND Support\n- BIND Releases\n- BIND Mailing List\n- Software Policy\n- Version\
    \ Numbers\n- Bug Report\n- Security Disclosure Policy\n- Security Advisory\n-\
    \ Current Attributes\n- World's First (BIND Manual)\n\n# Create a caching DNS\
    \ server for query requests using BIND\n\n## Advisor\n\n> Mihalis Tsoukalos a\
    \ UNIX administrator, a programmer (UNIX and IO), a DBA and a mathematician. He\
    \ has been using Linux since 1993\n\n### Reduce your network traffic and save\
    \ DNS requests by running your very own DNS server\n\nDNS (Domain Name System)\
    \ is what converts a human readable name to an IP address (and vice versa) - without\
    \ it you couldn't browse the Internet or get your email. Mailclients called DNS,\
    \ or simply name servers, support the Domain Name System by making machine learning\
    \ extraordinary the fact that they require special server software to support\
    \ DNS. A network device must have at least one configured DNS server in order\
    \ to operate normally, but for added redundancy you should use more DNS servers\
    \ to ensure that the network device is operational regardless of problems. Any\
    \ domain name can be dealt with its its IP address. A DNS zone is a part of a\
    \ domain that has been delegated. So, the .co.uk domain has one or more name servers\
    \ that answer queries for it. It is very reasonable that the .co.uk domain administrator\
    \ delegates the administration of all subdomains otherwise it would have to administer\
    \ all the .co.uk subdomains, which you can imagine, are numerous.\n\n### Resources\n\
    \nBIND home page: http://www.isc.org/bind/\n\nRFC 1034: Domain Names: tools.ietf.org/rfc/rfc1034\n\
    \nRFC 5936, AVFR: www.linuxuxer.co.uk\n\n# Create caching DNS server\n\nReduce\
    \ network traffic and serve DNS requests faster\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_0.png)\n\
    \n| HOST(1) | | BIND 09 | | HOST(1) | 03 |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| NAME | | host - dns lookup | | The host utility | |\n\n| SYNOPSIS\
    \ | host [-CersTwy] [-c class] [-n opts] [-m number] [-t type] [-w wait] [-flag]\
    \ [-4] [-n] (server) | |\n\nDESCRIPTION\nhost is a utility used for performing\
    \ DNS queries. It is normally used to resolve host names to addresses. When no\
    \ options are given, host prints a summary of its command line and options.\n\n\
    name is the domain name to be looked up. It can be a dot-decimal IP address or\
    \ a colon-delimited IPv6 address, in which case host will return the canonical\
    \ domain name and the IP address of the name server that should handle the query\
    \ or the servers listed in /etc/resolv.conf.\n\nThe -m option is equivalent to\
    \ setting the option and asking host to make a query of given type.\n\nWhen the\
    \ -c option is used, host will attempt to display the SOA records for the given\
    \ name. If multiple answers exist, host returns the list of name servers found\
    \ for that name.\n\nThe -t option makes a DNS query of class specified. This can\
    \ be used to look up Hero or Chaos master records. The default class is IN.\n\n\
    ![](img/7b0011b9ca05b82c33c02a484fd02e99_38_1.png)\n\n# 01 BIND\n\nBIND for Berkeley\
    \ Name Domain and implementation of the DNS protocols. On a Debian 7 system you\
    \ can install the latest version of BIND by running the following command:\n\n\
    ```bash\n# apt-get install bind9\n```\n\nTo find your version of BIND, execute\
    \ the following command:\n\n```bash\n# named\nBIND 9.8.4-r2+deb015.10.1\n```\n\
    \n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_2.png)\n\n# 03 The host\n\nhost\
    \ produces an output that is looking for - it can be easy to use inside shell\
    \ scripts. In particular, however, it is the name of the DNS server. If not found,\
    \ it uses the /etc/resolv.conf file to find a DNS server.\n\nWith the -m parameters,\
    \ host shows the mail servers for a domain or a subdomain:\n\n```bash\n# host\
    \ -mx linuxer\nlinuxer.com is handled by 10\nmail.publishing.linuxer.com is handled\
    \ by 22\n```\n\nThe numbers that follow the \"handled\" are the preference values\
    \ that indicate the mail exchange's priority. Value is not important, but what\
    \ is its relation to each other.\n\nMail servers should deliver to the mail exchangers\
    \ with the lowest value. If the values are the same, the mail exchanger with the\
    \ next highest value will be tried. If two or more mail exchangers have the same\
    \ priority, any of them can be chosen. The primary DNS server is responsible for\
    \ defining the email server for a domain or subdomain. With the -ns parameters,\
    \ host shows\n\n# 04 The dig utility\n\ndig can show information related to host,\
    \ however, dig's output is more popular today. Use dig to find the DNS servers\
    \ for a domain, and with the help of dig, you can do this by executing:\n\n```bash\n\
    $ dig ns\nTrying to perform AXFR query\n$ dig localhost linuxer.com\n```\n\n```bash\n\
    $ dig 9.8.4-r2+deb015.10 localhost linuxer.com axfr\nTransferred failed\n```\n\
    \nAXFR is a method for replicating DNS data, but it can also be used for other\
    \ purposes. The master allows access to AXFR settings and restricting it to the\
    \ rest of the world.\n\n# 05 The /etc/resolv.conf\n\nHow to use /resolv.conf is\
    \ to edit the file. You can see the DNS servers for setup; each entry starts with\
    \ a nameserver. You can put anything but an IP address for a DNS server. Usually,\
    \ the administrator deals with this file; otherwise the Linux machine gets DHCP\
    \ configuration.\n\n# 02 What is Cache DNS server?\n\nA caching DNS server does\
    \ not contain information about a domain; it contains information based on the\
    \ results of the DNS queries it has performed. The main reason that caching works\
    \ is because DNS data does not change frequently.\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_3.png)\n\
    \n# Tutorial\n\n```bash\nroot@mail:etc/bind# cat named.conf.options\n```\n\n//\
    \ If there is a firewall between you and nameservers, you may need to fix the\
    \ firewall to allow multiple ports (e.g. tcp/53, udp/53)\n// If your ISP provided\
    \ you with IP addresses for nameservers, you would probably want to use them as\
    \ forwards.\n// Add the following block, and insert the addresses replacing the\
    \ caching server\n\n```bind\nforwardwards {\n  8.8.8.8;\n}\n```\n\n// BIND logs\
    \ error messages about the root are being queried\n// See /var/log/bind/bind.log\n\
    \n```bind\ndnssec-validation: auto;\nauth-notify no;\n```\n\n# conform to RFC2135\n\
    \n# 06 The named utility\n\nnamed.conf is the name server control. It controls\
    \ the operation of the name server and communicates with the named process using\
    \ a TCP connection. named.conf has a configuration file and syntax checking to\
    \ named.conf. You can use rndc-checkconf and rndc-check-named for more information.\n\
    \n# 08 /etc/bind/bind.conf\n\nAll configuration files for BIND are located in\
    \ the /etc/bind/ directory. You will need to make changes to it if you want to\
    \ restart the named process for the changes to take effect.\n\n# 10 The default\
    \ configuration\n\nThe default BIND configuration is capable of supporting a caching\
    \ DNS server. You only need to turn recursion on if you want to allow clients.\
    \ You can do this by adding a line in named.conf.options that contains 'recursion':'yes'.\n\
    \nBIND keeps some other files inside /var/cache/\n\nThe next step is to run the\
    \ DNS server as a process.\n\n# ls -l /var/cache/bind/\n\n```\n-rw-r----- root\
    \ root 698 Oct 15 09:46 managed-keys.bind\n-rw------- root root 512 Oct 15 09:46\
    \ managed-keys.json\n-rw-r----- root root 946 Oct 15 11:01 named_dump.db\n-rw-r-----\
    \ root root 1103 Oct 14 10:58\n```\n\n# /etc/bind/bind.9\n\nYou will also need\
    \ to add an access control list to reduce traffic and increase security, you will\
    \ learn about access control lists later in Step 14. The DNS server will usually\
    \ list by port number 53, as you can see from the following output:\n\n# 07 Other\
    \ types of DNS servers\n\nThere are two types of DNS servers: primary and secondary.\
    \ Each domain should have at least one primary and one secondary DNS server.\n\
    \nA primary (or Master) server defines one or more zones for which it is authoritative.\
    \ A secondary DNS server has been assigned to a master zone.\n\nA secondary server\
    \ (or Slave) mainly acts as the backup of the primary DNS server in case it goes\
    \ down for some reason.\n\nA caching server is almost identical to a resolver\
    \ of the client. The difference is that it does not perform recursive queries;\
    \ it just forwards them to another DNS server, gets the response back and caches\
    \ the results.\n\nIt is not possible to find out from a query server whether it\
    \ was answered from a master zone or a slave.\n\n# 09 The bind.conf file\n\nThe\
    \ bind.conf file holds the information about a single dot, needed to initialize\
    \ the cache of internet domain name servers. You can manually generate it by running\
    \ the following command:\n\n```bash\n+ * telnet localhost\ntrying:...\n- Connected\
    \ to localhost.\n```\n\n# 11 Manage the caching DNS server\n\nYou already know\
    \ how to start the server. The following command stops it:\n\n# /etc/bind/bind.9\
    \ restart\n\nAnd then this command restarts:\n\n```bash\n[ Stopping domain name\
    \ service....\nwaiting for pid 24173 to exit\nok\n[ ] Starting domain name service....\n\
    bind9.\n```\n\n```bash\n$ dig @la.root-servers.net - NS > db.root\n```\n"
  mdcn: "\n\n# 教程\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_37_0.png)\n\n# BIND\n\
    \n最广泛使用的 DNS 服务端软件\n\n最后修改日期：2014年5月21日\nBIND 是一项实现了互联网域名命名系统（DNS）协议的开源软件，它是这些协议的参考实现，但也是适用于高流量和高可用应用的生产级软件。\n\
    BIND 堪称是互联网上最广泛使用的 DNS 软件，它提供了一个健壮稳定的平台，组织可以在此基础上构建分布式计算系统，并确保这些系统完全符合 DNS 标准。\n\
    \n- 链接与信息\n- 下载 BIND\n- BIND 文档\n- BIND 支持\n- BIND 发布版本\n- BIND 邮件列表\n- 软件策略\n\
    - 版本号\n- 漏洞报告\n- 安全披露政策\n- 安全告告\n- 当前属性\n- 世界首创（BIND 手册）\n\n# 使用 BIND 创建用于查询请求的缓存\
    \ DNS 服务器\n\n## 建议\n\n> Mihalis Tsoukalos 是一位 UNIX 管理员、程序员（UNIX 和 IO）、数据库管理员和数学家。他自\
    \ 1993 年起一直使用 Linux。\n\n### 通过运行你自己的 DNS 服务器来减少网络流量并节省 DNS 请求\n\nDNS（域名命名系统）是将人类可读名称转换为\
    \ IP 地址（反之亦然）的——没有它，你就无法浏览互联网或获取电子邮件。被称为 DNS 或简单称为名称服务器的邮件客户端通过让机器学习需要特殊的服务器软件来支持\
    \ DNS 这一事实来支持域名命名系统。网络设备必须至少配置一个 DNS 服务器才能正常运行，但为了增加冗余，你应该使用多个 DNS 服务器以确保网络设备无论出现什么问题都能正常工作。任何域名都可以通过其\
    \ IP 地址处理。DNS 区域是被委托的域的一部分。因此，.co.uk 域名拥有一个或多个名称服务器来回答其查询。.co.uk 域管理员委托所有子域的管理是非常合理的，否则它将不得不管理所有的\
    \ .co.uk 子域，你可以想象的，这些子域非常多。\n\n### 资源\n\nBIND 主主页：http://www.isc.org/bind/\n\n\
    RFC 1034: 域名：tools.ietf.org/rfc/rfc1034\n\nRFC 5936, AVFR：www.linuxuxer.co.uk\n\
    \n# 创建缓存 DNS 服务器\n\n减少网络流量并更快地提供 DNS 请求\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_0.png)\n\
    \n| HOST(1) | | BIND 09 | | HOST(1) | 03 |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 名称 | | host - dns lookup | | host 工具程序 | |\n\n| 概要 | host [-CersTwy]\
    \ [-c class] [-n opts] [-m number] [-t type] [-w wait] [-flag] [-4] [-n] (server)\
    \ | |\n\n描述\nhost 是一个用于执行 DNS 查询的实用程序。它通常用于将主机名解析为地址。在不给出任何选项时，host 会打印其命令行和选项的摘要。\n\
    \nname 是要查找的域名。它可以可以是点分十进制 IP 地址或可以是冒号分隔的 IPv6 地址，在这种情况下，host 将返回规范域名以及处理查询的名称服务器的\
    \ IP 地址，或者 /etc/resolv.conf 中列出的服务器。\n\n-m 选项等同于设置选项并请求 host 对给定类型进行查询。\n\n当使用\
    \ -c 选项时，host 将尝试显示给定名称的 SOA 记录。如果存在多个答案，host 将返回找到该名称的名称服务器列表。\n\n-t 选项对指定的类进行\
    \ DNS 查询。这可以用于查找 Hero 或 Chaos 主记录。默认类为 IN。\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_1.png)\n\
    \n# 01 BIND\n\n用于伯克利命名域和 DNS 协议的实现。在 Debian 7 系统上，你可以通过运行以下命令安装最新版本的 BIND：\n\n\
    ```bash\n# apt-get install bind9\n```\n\n要找到你的 BIND 版本，请执行以下命令：\n\n```bash\n#\
    \ named\nBIND 9.8.4-r2+deb015.10.1\n```\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_2.png)\n\
    \n# 03 host 工具\n\nhost 生成的输出看起来正在查找 - 它在 shell 脚本内部很容易使用。特别地，它是 DNS 服务器的名称。如果没有找到，它将使用\
    \ /etc/resolv.conf 文件来查找 DNS 服务器。\n\n使用 -m 参数，host 会显示某个域或子域的邮件服务器：\n\n```bash\n\
    # host -mx linuxer\nlinuxer.com is handled by 10\nmail.publishing.linuxer.com\
    \ is handled by 22\n```\n\n\"handled\" 之后的数字是偏好值，指示邮件交换的优先级。值的大小并不重要，重要的是它们彼此之间的关系。\n\
    \n邮件服务器应该投递到值最低的邮件交换服务器。如果值相同，将尝试下一个最高值的交换器。如果两个或多个邮件交换器的优先级相同，则可以选择其中任何一个。主 DNS\
    \ 服务器负责定义域或子域的邮件服务器。通过 -ns 参数，host 显示\n\n# 04 dig 工具\n\ndig 可以显示与 host 相关的信息，然而今天\
    \ dig 的输出更流行。使用 dig 查找域的 DNS 服务器，在 dig 的帮助下你可以这样做：\n\n```bash\n$ dig ns\nTrying\
    \ to perform AXFR query\n$ dig linuxer.com\n```\n\n```bash\n$ dig 9.8.4-r2+deb015.10\
    \ localhost linuxer.com axfr\nTransferred failed\n```\n\nAXFR 是复制 DNS 数据的方法，也可以用于其他用途。master允许访问\
    \ AXFR 设置并将其限制在范围内。\n\n# 05 /resolv.conf\n\n使用 /resolv.conf 方法是编辑该文件。你可以看到设置 DNS\
    \ 服务器；每个条目都以 nameserver开头。你可以放置任何 IP 地址作为 DNS 服务器。通常，管理员处理此文件；否则 Linux 机器获取 DHCP\
    \ 配置。\n\n# 02 什么是缓存 DNS 服务器？\n\n缓存 DNS 服务器不包含域的信息；它包含基于其执行的 DNS 查询结果的信息。缓存有效的主要原因是\
    \ DNS 数据并不频繁变化。\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_38_3.png)\n\n# 教程\n\
    \n```bash\nroot@mail:etc/bind# cat named.options\n```\n\n// 如果你和 DNS 服务器之间有防火墙，你可能需要修复防火墙以允许端口（例如\
    \ tcp/53, udp/53）\n// 如果你的 ISP 提供了 DNS 服务器的 IP 地址，你可能想将它们作为转发。\n// 添加以下块，并替换缓存服务器\n\
    \n```bind\nforward {\n  8.8.8.8;\n}\n```\n\n// BIND 记录关于根的错误消息\n// 查看 /var/log/bind/bind.log\n\
    \n```bind\ndnssec-validation: auto;\nauth-notify no;\n```\n\n# RFC2135\n\n# 06\
    \ named 工具\n\nnamed.conf 是名称服务器控制。它控制名称服务器的操作并使用 TCP 连接与 named 进程通信。named.conf\
    \ 有配置文件和对 named.conf 的语法检查。你可以使用 rndc-checkconf 和 rndc-check-named 获取更多信息。\n\n\
    # 08 /etc/bind/bind.conf\n\nBIND 的所有配置文件都位于 /etc/bind/ 目录下。如果你想重启 named 进程使更改生效，则需要对其进行更改。\n\
    \n# 10 默认配置\n\n默认的 BIND 配置能够支持缓存 DNS 服务器。只有当你允许客户端时才需要开启递归。你可以通过在 named.conf.options\
    \ 中添加 'recursion':'yes' 的行来实现。\n\nBIND 在 /var/cache/ 内部了一些其他文件。\n\n下一步是将进程运行 DNS\
    \ 服务器。\n\n# ls -l /var/cache/bind/\n\n```\n-rw-r----- root root 698 Oct 15 09:46\
    \ managed-keys.bind\n-rw------- root root 512 Oct 15 09:46 managed-keys.json\n\
    -rw-r----- root root 946 Oct 15 11:01 named_dump.db\n-rw-r----- root root 1103\
    \ Oct 14 10:58\n```\n\n# /etc/bind/bind.conf\n\n你还需要添加访问控制列表来减少流量并增加安全性，你将在第14\
    \ 步学习访问控制列表。DNS 服务器通常按端口号 53 列出，你可以从以下输出看到：\n\n# 07 其他类型的 DNS 服务器\n\n有两种类型的 DNS\
    \ 服务器：主和从。每个域应该至少有一个主 DNS 服务器和一个从 DNS 服务器。\n\n主（或 Master）服务器定义了其具有权威性的一个或多个区域。从\
    \ DNS 服务器被分配给一个主区域。\n\n从服务器（或 Slave）主要在主 DNS 服务器由于某些原因宕机时充当其备份。\n\n缓存服务器与客户端的解析器几乎相同。区别在于它不执行递归查询；它只是将查询转发到另一个\
    \ DNS 服务器，获取响应并缓存结果。\n\n无法从查询服务器查明答案是从主区域还是从从区域回答的。\n\n# 09 bind.conf 文件\n\nbind.conf\
    \ 文件持有关于单个点的信息，用于初始化互联网域名命名服务器的缓存。你可以通过运行以下命令手动生成它：\n\n```bash\n+ * telnet localhost\n\
    trying:...\n- Connected to localhost.\n```\n\n# 11 管理缓存 DNS 服务器\n\n你已经知道如何启动服务器。以下命令停止它：\n\
    \n# /etc/bind/bind.conf restart\n\n然后此命令重启：\n\n```bash\n[ Stopping domain name\
    \ service....\nwaiting for pid 24173 to exit\nok\n[ ] Starting domain name service....\n\
    bind9.\n```\n\n```bash\n$ dig @la.root-servers.net - NS > db.root\n```\n\n"
