    # # Adapteva

    Parallela Desktop


    With a 16-core coprocessor based on Epiphany architecture, is the Parallela the
    single-board computer that developers have been waiting for?


    > Pros

    Epiphany chip shows real promise and rivals with similar features.


    The Parallela is a product that would never have existed without the concept of
    crowdfunding. Developing provides a low-cost point for developers to experiment
    with Adapteva''s innovative architecture. Its development was funded by a Kickstarter
    campaign, making the initial model available for just $999.


    Sadly, the cost of the Parallela has risen since then; the entry-level model,
    which features the dual-core Micro-processor, costs £997; the Desktop variant,
    which costs £1167; the top-end and Embedded Platform version is the most expensive
    option for most users.


    > Cons

    Software support is still in the early stages, and the Adapteva connectors make
    it open for hobbyists


    At first glance, the Parallela appears to have priced itself out of the market.
    However, a look at specifications reveals that this isn''t the case. The dual-core
    Cortex-A9 CPU running at 800MHz is far from blazing, the Zynq system coprocessor
    also includes an Epiphany with 2800 logic cells, a small subset of which are available
    for customer use.


    The remainder work to drive the HDMI output of the Desktop and Embedded models,
    among other tasks. For bigger tasks, the Zynq-embedded Epiphany provides the available
    GPIO de facto single-precision coprocessor endpoints to 48 cores, which makes
    it an obvious choice for anyone interested in programming.


    The main selling point of all three models, is not contained in the Zynq but needs
    it: the Epiphany-III coprocessor, which is capable of operating the system unless
    directly. The Epiphany boosts by 32 gigigaflops performance from its 16 individual
    cores, with a 64-core variant promising up to 100 gigigaflops in the pipeline
    for future release.


    It''s the Epiphany, that will attract, most customers to the Parallela and Adapteva
    worked hard to make it as


