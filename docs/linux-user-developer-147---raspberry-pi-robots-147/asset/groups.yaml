    upgrade over the comparable four-bay quad-core Intel Atom processor (2.0Ghz) and
    2GB DDR3 RAM. Unlike the previous entries (both dual-cores with 1GB DDR3 RAM)
    and the DS415play which is aimed at home users the DS415+ marks a huge step up
    in terms of Synology''s NAS devices for SMBs as it''s the first in this series
    to make use of the new generation of Intel Atom chips.


    hardware encryption engine made possible with all this extra computational muscle.
    256-bit AES encryption can be applied to folders on the DS415+ and this has a
    minimal impact on write performance. Using a single gigabit Ethernet cable, you
    get around 80/110MB/s upload/download speeds for encrypted files and folders.
    But the device does not have a backup in case of cable failure but also because
    of the device''s Link Aggregation technology, which enables multiple links at
    once without any noticeable impact on the DS415+''s 228/232MB/s read and write
    speeds - in fact, we kept the gigabit Ethernet cabling despite the encryption.
    This huge improvement in the sector of Synology''s SMB product is


