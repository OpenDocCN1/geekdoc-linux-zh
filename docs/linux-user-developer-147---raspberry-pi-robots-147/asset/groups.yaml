    and PGP was his. PGP is a little different to other methods; rather than a single
    password or key that can encrypt and decrypt a file or message, PGP has two keys.
    These two keys are public and private. The public key is used to encrypt information
    and can be shared with anyone. The private key is for you, the creator of both
