    这是一个很早吸取的教训。1994年，来自马萨诸塞州波士顿的威廉·R·德拉·克伊斯（William R. Della Croce）在没有任何背景的情况下起诉获得
    Linux 商标权（http://www.linuxjournal.com/article/2559）。Linux 并不是他赢得的一场战斗，不像那个德拉·克伊斯只是靠运气选定了这个名字。1991年9月，伯克利大学的阿里·伯克利（Ari
    Berkeley）创建了一个 FTP 服务器并将 Linux 内核上传到那里。


    内核自1992年12月就开始分发 Linux 光盘。该商标被分配给莱纳斯·托瓦尔斯（Linus Torvalds），“代表请愿人和 Linux 用户”。


    问题在于，当软件是免费的，传统软件模式的基石——产品中包含的代码——是协作性的。许多个人和学术机构对共享成功的代码做出了贡献。客户免费获得软件，并倾向于更加活跃。唯一潜在的输家是商标供应商，其可能性受到专有模型局限性的限制。


    ***Richard Hillesley 撰写关于 Linux 以及各种应用程序的数字自由软件的文章。***


    到1994年8月，当 Linux 必须收到通知时，用户已开始将 Linux 与 GNU 打包并在 CD-ROM 上进行销售。红帽（Red Hat）、SLS、Slackware
    和 Yggdrasil 是当时流行的发行商。同一时期可以分叉一个自由软件项目并以另一个名称进行市场营销，只要他们遵守许可条款即可。


    GNOME 社区的商标建立在 Group ours 之上，这家公司在经历了 bit.ly/vYeH 所示的法律诉讼后被开源项目“解放”了，该公司做出了这样的声明，而且似乎并没有问题。正如
    GNOME 的原始声明所说：“商标不适用于那些拥有 25 亿美元年收入、完整法务团队和足够工程师进行项目的 Group 公司。”


    《Linux 日志》声称：“第一个且唯一的 Linux：Linux 用户的商标。”《Linux 日志》曾宣布，Linux 发行商曾因申请商标而短暂地被德拉·克伊斯起诉。禁令已颁发给他们。


    GNOME 商标是该项目能够识别的唯一保护，它确保了社区不会受到个人或公司集体商标的侵害。这是毫无疑问的。


    Persuhan 认为，GNOME 社区既不需要也不想要商标争议的权利，但对于自由软件社区的某些部分来说，商标是一种简单且实用的防御手段，通过商标和法律策略来涵盖商标法的所有方面，而不仅仅是获得复制某件软件的许可。


    在接下来的几个月里，德拉·克伊斯就根据商标版权产生的产品支付了版税和解。对于开源基础，商标甚至更为关重要。


    在没有法律保护的地方，商标保护了社区作品的完整性。任何人都可以复制和重做代码，但结果不能作为社区的作品呈现。A。


    红帽销售免费软件和服务，并将其红帽版本的 Linux 销售为 CentOS（这是一个项目）。红帽声誉的唯一保护就是其高质量的软件和服务，以及其独特的品牌。


