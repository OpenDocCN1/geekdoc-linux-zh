    # Host your own website on Raspberry Pi


    Don’t pay for web hosting. Configure your Raspberry Pi to act as a web server
    and host modest websites


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_69_0.png)


    Need a lightweight, low-cost web server? Your Raspberry Pi is all you need! Whether
    you’re planning on hosting a static homepage (or one with minimal database use)
    or an easy home for development projects, setting up your Raspberry Pi as a web
    server is surprisingly easy.


    Ideal as an always-on device thanks to its low-power requirements, the Raspberry
    Pi can sit beside your router and be ready to use better. You might wish to serve
    some of your projects, or a personal page to host your photos or CV.


    If you’re planning on using it as a web-facing device, your Pi will need some
    basic configuration. It is important to ensure your internet router offers static
    IP addresses for your users. Often a price is charged for leasing a static IP,
    but there are services you can use (such as noip.com).


    # What you’ll need


    +   - Latest Raspberry image (raspberrypi.org/downloads)

    - Internet connection

    - External hard drive (optional)

    - USB flash (optional)

    - Ethernet cable


    01 Connect your Ethernet cable

    For this project it makes more sense to use an Ethernet cable. You may need to
    use your USB ports to attach flash drives or an external HDD to serve your web
    page. With Ethernet you avoid any wireless issues that are causing interruptions
    for your visitors.


    02 Get Raspberry Pi updates and Apache

    As ever, begin by checking for Raspberry updates:


    ```

    sudo apt-get update

    sudo apt-get install apache2 php libapache2-mod-php libapache2-mod-php

    Finally, restart apache2

    sudo apache restart

    ```


    Your Raspberry Pi is now ready to be used as a web server.'
