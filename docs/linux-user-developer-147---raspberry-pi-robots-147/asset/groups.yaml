    “如果你让我用一个词来描述去年……我不确定是否是一个标准的英语单词，也许你可以帮帮我……我可能会说‘交付’（delivery）。”


    “确认收入，最终体现在资产负债表上的，正以 16% 的速度增长——比去年预期的好。但人们并没有真正考虑到这一点。你只能通过销售新业务的同时保留现有客户来增长。通过重复续约，你可以快速增长。”


    “我们在 SUSE 正式开幕之前的简报会上与 Gerald Pfeiffer 聊过。使用 SUSE Linux。Flaxa 和 Nixmark 都是德国人，英语不是他们的母语。‘对承诺的交付，就是交付，对吧?’”


    “那么 SUSE 的新业务进展如何？‘新业务在上半年以 47% 的速度增长，65% 的订单归功于新的订阅和维护续约。’”


