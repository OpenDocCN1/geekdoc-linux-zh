    \ 驱动的充满慈悲机器的监视。尽管如此，我们评估了目前可以买到的最佳 DIY 机器人，让你在这场不可避免的革命中抢先一步。无论你是 Arduino 用户还是树莓派用户，我们将构建机器人来听从主控制器的指令，并向你展示如何使用套件来实现。我们还将对这些机器人进行评分，以识别它们的制造质量、重量和尺寸、开箱功能、构建过程，并判断哪种套件最适合你以及你可以在哪里购买。\n\
    \n然后呢？嗯，我们将通过受剑桥树莓派 Rasp 活动 (piwars.org) 启发的系列挑战来测试我们的机器人。超级月人 Rob Zweetsloot\
    \ 更适合周末的机器人构建狂欢，他编写了代码，使这些机器人足够灵敏，能够轻松通过巡线挑战、近距离警报测试、复杂的障碍赛和三点转弯测试。他不仅止于此，Rob\
    \ 还提到了如何……\n\n现在是时候向你们介绍我们精选的机器人团队了——你们中的某些可能在《Linux Developer》之前的期数中见过它们。在接下来的几页中，你将遇到\
    \ Raptor（我们最类人化且令人喜欢的高达风格机器人）、Pogo（后部带有万向轮的小型双轮三轮车）、Frindo（配备传感器的开源移动机器人平台）、Rover\
    \ 5（拥有 Sensebrain 且最高速度不可阻挡 1km/s 的坚硬坦克）、Hexy（那个六条腿、像螃蟹一样走路、跳《太空步》……\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_52_0.png)\n\
    ![](img/7b0011b9ca05b82c33c02a484fd02e99_52_1.png)\n![](img/7b0011b9ca05b82c33c02a484fd02e99_52_2.png)\n\
    ![](img/7b0011b9ca05b82c33c02a484fd02e99_52_3.png)\n![](img/7b0011b9ca05b82c33c02a484fd02e99_52_4.png)\n\
    \n53 www.linuxuser.co.uk\n\n# Rover 5\n### Seeeduino\n\n一个相对巨大的产物，Seeeduino 配备齐全，是一份很棒的礼物\n\
    \n如果你记得第 32 期，我们在那里制作了第一个机器人，你会记得我们使用的套件来自 Robotics。Rover 5 是该套件的继任者。Rover 5 稍微大一点，通常比特定的树莓派多几个功能，且\
    \ Rover 5 不需要树莓派，因为它完全由 Seeeduino（另一个 Atmega-328p）供电。\n\n构建并不容易，需要大量的电线来连接板子。整个套件由单独制造的不同组件组成，这解释了作品中某些差异以及它们是如何组合在一起的。构建体位于\
    \ Rover 5 之上，非常适合 DIY，安装在 Rover 5 上时电线四处飞舞。\n\n编程比其他机器人更容易，因为使用的是 Arduino 而不是串口命令，但你需要一些预设的教程来教你如何创建任何代码，由于\
    \ Rover 5 的每个部分都带有传感器，板子和机器人可以对几乎覆盖任何范围或附在其上的超声传感器做出反应。\n\n# 技术规格\n\n| 特性 | 详情\
    \ |\n| :--- | :--- |\n| 制造商 | Dawn Robotics |\n| 高度 | 170 mm |\n| 宽度和深度 | 225\
    \ x 235 mm |\n| 重量 | 1.5kg |\n| 电源 | 9伏 AA 电池 |\n| 控制板 | Seeeduino (Atmega328p)\
    \ |\n| 运动方式 | 电机驱动的双轮 |\n| 传感器 | 超声波和四个角传感器 |\n| 网站 | www.dawnrobotics.com |\n\
    \n# 评分\n\n| 类别 | 得分 |\n| :--- | :--- |\n| 组装 | 3/5 |\n| 制造质量 | 4/5 |\n| 可编程性 |\
    \ 3/5 |\n| 功能性 | 5/5 |\n\n# 大项目\n# 树莓派机器人\n\n## 挑战 1... 障碍赛\n\n由于 Pi 组织者的保密，撰稿团队只能猜测计划了什么类型的任务。他们留下的挑战是严格控制规则并更多地依靠自动化。在我们的场景中，我们使用一个具有特定主题的迷宫，在没有任何线条引导的情况下引导机器人到达墙壁以及墙壁沿路线的变化方式。\n\
    \n# 代码列表\n\n此外，Rover 5 完美具备处理你扔给它的任何设备。通过它的传感器阵列，它知道前方是否有墙。我们还可以使用超声波传感器来确定它与墙的距离以及当你沿着路线行驶时墙的变化方式。\n\
    \n有一些针对 Rover 的棒代码可以让你沿着墙的右侧移动。你可以从 URL 获取它。通过 Arduino 上传；这是一项大任务，但通过解释代码的某些部分你会感觉好一些。首先有一个函数列表。这些包括通用代码中用于速度、沿墙和一小部分传感的方法。\n\
    \n```cpp\nconst int NUM_IR_SENSORS = 4;\nconst int IR_LEFT_PIN, NUM_IR_SENSORS[]\
    \ = {A0, A8, A1, A1};\nconst int IR_RIGHT_SENSORS, NUM_IR_SENSORS[] = {A3, A2,\
    \ A4, A5};\n```\n\n接下来，我们将通过转弯导航迷宫的一小部分，并为代码的结果使用有用数据——在目前情况下。之后，我们有多个部分之一。这被用于向前移动，寻找开放的路径，直到在注意到或撞到墙后发生事件。这将是后退、左转和右转。\n\
    \n```cpp\nfloat ultrasonic = ultrasonicSensor.measureReading();\ngultasonicSensor.takeReading();\n\
    int leftReading = gIRSensors.frontLeft();\nint rightReading = gIRSensors.frontRight();\n\
    int back = gIRSensors.rearLeft();\n```\n\n最后，代码确保传感器在沿墙运行时盯着墙，以确保它还在那里。\n\n```cpp\n\
    case eRI_DrivingLookingForWall:\n    // 是否看到了障碍物\n    if (gMotor.isStopped())\
    \ {\n        if (gMotor.isalled()) {\n            enterUpState();\n        }\n\
    \    } else {\n        // 检查找到了墙\n        if (ultrasonic <= CLOSE_ULASONIC_RANGE\n\
    \            || leftReading >= CLOSE_WALL_VALUE\n            || rightReading >=\
    \ CLOSE_WALL_VALUE) {\n            enterLeftState();\n        }\n    }\n}\nbreak;\n\
    ```\n\n## Rover 5 完美应对任何课程\n\n```cpp\nvoid enteringWallOnState() {\n    // 将超声波传感器指向右侧\n\
    panAngle = LOOK_RIGHT_PAN_ANGLE;\ngiltAngle = RIGHT_TILT_ANGLE;\n\ngpanServo.write(gpanAngle);\n\
    giltServo.write(giltAngle);\n\nMotor.clear();\ngrightMotor.clear();\nMotor.setTargetRPM(BASE_WALL_FOLLOWING_RPM);\n\
    grightMotor.setTargetRPM(BASE_WALL_FOLLOWING_RPM);\ngStateStartEncoderTicks =\
    \ gMotor.getMeasuredEncoderTicks();\ngRobotState = eRS_LookingWallOn();\n}\n```\n\
    \n上方主板连接到机器人后部，易于访问更多组件\n\n"
