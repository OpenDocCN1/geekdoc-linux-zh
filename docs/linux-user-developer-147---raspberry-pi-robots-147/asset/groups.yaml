    # 使用 Thunderbird 和 PGP 加密你的电子邮件


    **Adviser Sean M Tracey** 是一家领先数字机构的创意技术人员。他花费大量时间在代码世界中：Python 和 Android。


    ## 保护电子邮件其实并不困难——只要我们善用开源工具，世界级的加密技术触手可及。


    ## 资源

    Ubuntu 14.04 / Debian 7


    - GPG [www.pgp.org](https://www.pgp.org)

    - Mozilla Thunderbird [mzl.la/zim1qz4](https://mzl.la/zim1qz4)


    多年来，我们对在互联网上传输个人或敏感信息的能力充满信心。现在我们在在线上发送许多消息，希望在处理涉及金钱、生活和朋友的服务时感到安全，这是可以理解的。SSL、HTTPS
    只是我们每天用来尝试确保绝对安全的少数协议之一。遗憾的是，最近的揭露表明，我们信任的协议并不像我们曾经认为的那样安全，或者说那么无阻碍。现在我们开始展望未来，思考如何利用开源工具（即这种
    GNU Privacy Guard）再次保护我们的私密通信，并确保阅读我们消息的人仅是我们发送消息给他们的人。


    # 加密你的电子邮件

    使用 Thunderbird 和 PGP 发送和接收安全消息


    ### 01 什么是 PGP？它是如何工作的？

    安全地发送消息已经尝试了几个世纪。在战争时期、财务事务或重大交易中，安全性至关重要。尽管其重要性，但我们始终关注消息的机密性——我们如何确保只有接收消息的人实际上接收并解密了它？你如何加密一个可以由你所选择的人解密的内容呢？


    “Phil Zimmermann 在 20 世纪 90 年代初尝试回答这些问题，PGP 就是他的产。PGP 与其他方法不同；它不是一个可以加密解密文件或消息的单一密码或密钥，PGP
    有两个密钥。这两个密钥是公钥和私钥。公钥用于加密信息，并可以与任何人共享。私钥由你（这两个密钥的共同创建者）保存。当私钥与公钥结合时，它可以解密用公钥加密的信息。”


    这种方法对于消息传递非常完美，因为任何人都可以轻松使用你的公钥进行（解密，但只有最初创建的私钥才能真正解密加密后的信息。


