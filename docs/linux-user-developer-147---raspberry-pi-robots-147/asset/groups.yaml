- md: "\n## Pi2Go Lite\n\nOne of the smallest robots in our test, you bet the Pi2Go\
    \ has a few tricks.\n\nThe Pi2Go Lite is a very interesting bit of kit. Coming\
    \ in a tiny box and using no chassis, in favour of construction of its PCBs, it\
    \ would be a super simple robot that follows commands and doesn't really reach\
    \ much of the environment. It makes sound like a remote control robot that could\
    \ be better than the tooth.\n\nAs the Pi2Go is probably the most featured robot\
    \ in this feature, All this functionality comes at a price, though; it's the robot\
    \ that requires a bit of soldering and pre-preparation before construction. With\
    \ a bit of soldering to do, although you don't need to strip any wires and such.\
    \ There are about 50 components to fit, possibly more, and it can be a bit tricky.\
    \ The instructions are not extremely helpful, but the components are actually\
    \ listed on the PCB as a rough guide to where things should be fitted.\n\nOnce\
    \ you need to put the few parts together to complete it. The website lists a 90\
    \ minute construction time, but we found it quite something longer - it was longer\
    \ than any of the bigger or more complicated ones on the other.\n\nIt's a compact\
    \ little thing and it's powered by the Raspberry Pi via a custom Python library.\
    \ Sensing, turning the motors and other functions have their own corresponding\
    \ Python function. It lets you create scripts that can make it fully autonomous,\
    \ as long as the autonomy only reaches distance and proximity sensing to operate,\
    \ it can take extra time or web information from the Raspberry Pi if that's set\
    \ up correctly.\n\nFor the price, functionality and relative ease of programming,\
    \ it's a fantastic piece of kit that's great for getting into starter-level robotics\
    \ and agility beyond. Some soldering skills required.\n\n## Technical specs\n\n\
    | Feature | Details |\n| :--- | :--- |\n| Manufacturer | 4tronix |\n| Height |\
    \ 90 mm |\n| Width and depth | 130 x 145 mm |\n| Weight | 0.40 kg |\n| Power |\
    \ 9V from AA batteries |\n| Control board | Raspberry Pi |\n| Form of locomotion\
    \ | Two wheel drive |\n| Sensors | Ultrasonic sensor, two line sensors and two\
    \ obstacle sensors |\n| Website | www.pi2go.co.uk |\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_55_0.png)\n\
    \n## How it scored\n\n- Assembly 3/5\n- Build quality 3/5\n- Programmability 4/5\n\
    - Functionality 5/5\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_55_1.png)\n\n\
    56 www.linuxuser.co.uk\n\n## Raspberry Pi robots\n\n## CHALLENGE 2..\n\n### Line\
    \ following\n\nFollow the black painted line, although you may not find a wizard\
    \ at the end of it.\n\nLine following is very easy; you put a line on the floor\
    \ and expect the robot to follow it. This includes turning as well, following\
    \ a course accurately to its destination or accumulating laps. The Pi2Go Lite\
    \ is the only robot we're looking at this month which comes with line-following\
    \ sensors, although it has many features. Sources like it however there's no line-following\
    \ function in the Python script so we need to build a script for.\n\nAs we lead,\
    \ the solution involves line-following sensors - these are IR sensors on the underside\
    \ of the PCB where the caster sits. We'll also use the Pi2Go down on the hall\
    \ and want to go straight for the finish.\n\nOne of the problems we are going\
    \ to run is that the motors will likely not run at the same speed - with a bit\
    \ of trial and error you may fix this in the first forward command, and at a speed\
    \ of 50 we go full speed. You can tweak this to be slower or faster as you see\
    \ fit.\n\nThe loop is quite simple: it sees if the line sensors are activated,\
    \ and by turning the wheel, we'll need to correct course in a specific direction\
    \ for each true statement. You can set the individual speed of the motors to left\
    \ and right in the turnforward function, and then we'll have a pause before returning\
    \ to the loop.\n\nThe code ends when you stop and it cleans up the GPIO port settings\
    \ before exiting. The code requires the pi2go Python files, which you can grab\
    \ here: http://tronix.co.uk/blog/?p=475\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_56_0.png)\n\
    \n![](img/7b0011b9ca05b82c33c02a484fd02e99_56_1.png)\n\n## Code listing\n\n- import\
    \ time, pi2go\n- pi2go.init()\n- pi2go.forward(50)\n\n```python\ntry:\n    while\
    \ True:\n        if pi2go.leftleft == True:\n            pi2go.turnforward(0,\
    \ 50)\n            time.sleep(2)\n            pi2go.forward(50)\n        elif\
    \ pi2go.rightRight == True:\n            pi2go.turnforward(50, 45)\n         \
    \   time.sleep(2)\n            pi2go.forward(50)\n        else:\n            time.sleep(0.5)\n\
    except KeyboardInterrupt:\n    print\nfinally:\n    pi2go.cleanup()\n```\n\n>\
    \ Get the code bit.ly/1z1HW\n\n57 www.linuxuser.co.uk\n\n## Hexy the Hexapod\n\
    \nThe Kickstarter success story with six legs, 9 servos and some mad moves.\n\n\
    | Technical specs | Details |\n| :--- | :--- |\n| Manufacturer | ArcBots |\n|\
    \ Height | 100~120mm |\n| Width and depth | 300~400mm approx. (on stance) |\n\
    | Weight | 0.93kg |\n| Power | 6 or 7 servos from 4 AA batteries |\n| Control\
    \ board | Arduino |\n| Form of locomotion | Legs 6x |\n| Sensors | Ultrasonic\
    \ sensor |\n| Website | www.arcbots.com |\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_57_0.png)\n\
    \nWe were really impressed by this all-in-one kit that lives up to its promise\
    \ of being easy to assemble for any skill level, including beginners. Everything\
    \ is neatly packed and there's even a tiny screwdriver - meaning you don't need\
    \ any other tools to fair, those servo instead breaking, but more than ideal!\n\
    \nFor the most part the instructions are excellent but there were a couple of\
    \ occasions where a slight lack of clarity just went into it, from the sharp-edged\
    \ designs. The design is really useful - it is perfect on spot. You can really\
    \ see through it, the strong and lightweight plastic material. The software is\
    \ really justified - you can get Arduino set up and also drive everything with\
