    # News

    The latest in the Linux community

    OPEN SOURCE


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_6_0.png)


    # Linux calendar


    # Snowcode 2015


    - * Val d''Isere

    - France

    - snowcode.com


    Founded in 2010, Snowcode is a small gathering of UK developers who fly out to
    a new area each year. The year focuses on microservices and NoSQL, with sponsorship
    from startups and companies like Google. The Agile Workshop and Skills Master.


    # DEVELOPMENT


    # Intel''s Beignit hits 1.0 milestone


    Intel''s project, which provides open Linux drivers for general-purpose graphics
    processing (GPGPU) has reached the 1.0 milestone. From the 1.0 release include
    support for Intel processors from the third-generation Ivy to the eleventh-generation
    with the promise of improved performance.


    “We observed 10 to more than four times performance gains for OpenCV 3.0 benchmarks,”
    Zhang Gong claimed in the announcement post.

    Further changes in the 1.0 release include fixes for memory leaks, support for
    the Clang/LLC compiler and a boost to compilation times by shifting the built-in
    function support from header files to backed libraries.


    # Linux-conf.2015


    - * University of Auckland

    - New Zealand

    - lca2015.linux.org


    One of the foremost source conferences in the world and most prestigious in the
    Southern Hemisphere, LICA2015 includes students'' talks, sessions on topic discussion
    and cloud to the kernel.


    # Government ICT


    - * QEEI Conference Centre, London

    - UK

    - government-ict.co.uk


    The Government ICT conference helps to track the success of government projects,
    including discussions on how open source can help bring down costs and increase
    efficiency.


    # DEVELOPMENT


    # Mozilla launches Firefox Developer Edition


    Mozilla has announced the launch of Firefox Developer Edition, which it claims
    is the “first browser developed to developers”, featuring a number of tools to
    make development easier of the tasks they require. Recent moves to diversity away
    from facing browsers, including the release of the Firefox OS for smartphones,
    Firefox “designed for developers”, with the promise of offering web developers
    to build better tools.


    The main feature that sets the Firefox Edition apart from its base is Valence,
    a preinstalled extension which will enable the developer to debug multiple browser
    platforms and also connecting with Firefox Tools. Previously known as the Firefox
    Tools, the new release supports on Android and iOS, alongside Mozilla’s Firefox
    varieties.

    The developer-friendly interface includes a responsive design, the WebDevEd, a
