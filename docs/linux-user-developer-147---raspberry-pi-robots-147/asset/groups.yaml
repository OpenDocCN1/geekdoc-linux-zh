    # 你的观点


    你的 Linux 新闻与观点来源


    联系我们...

    直接发送邮件至：

    linuxuser@imagine-publishing.co.uk


    # 你的观点


    # Linux 用户来信


    你对杂志的意见，应该是你内心秉持的心态


    # 兴起的 Linux


    我非常喜欢你们的“Linux 的兴起”专题。我觉得自己像个 Linux 新手，因为我从 2004 年初就开始全投入地使用 Linux 了！偶然发现了 Linux
    Mint，并一直等下去，直到最后发现了 Ubuntu、openSUSE，以及我的最终终点 Fedora！我错过了关于哪个更好的讨论，在 Linux 活动……所以我不得不去参加了。在芝加哥、亚利桑那，甚至大多数这些活动中，我当时恰好获得了免费门票。我会说，这是我经历过的最好的计算体验。Windows、Linux、macOS
    OS —— 在我拙见看来，它们哪一个都无法比拟 Linux 的实力和领先地位。希望 Linux 永远不会衰落或过时！


    看起来你通过这些发行版走过了一段非常精彩的历程，同时也看到了它们在过去十年中发生的变化甚至演变。至于 Linux 大会——当然了——有很多有趣的东西，你可以看到但不必太担心。很多免费信息可以帮助你起步，而且在线社区对任何人都很友好。


    雷德蒙（Redmond）？库比蒂（Cupertino）可以保持距离。


    Emily


    你说得对，尽管也许我们在张开双臂之前应该保持克制。多年来，他们一直与 Linux 内核合作，支持异构解决方案，而且我们聊过的很多大公司，大多数时候微软——从业务角度来看——正在适应它，以便获取他们想要的任何客户。奇怪的是，这看起来很美好，但在非常底层，开源软件（FOSS）的概率很低。我们不信任他们。


    # 恶势力消除了吗？


    真正的敌人是任何人吗？我记得曾几何段时间是专有软件，软件与公司之间没有多少联系。所有的“大”公司都开始与 Linux 合作并拥抱开源软件。我们也许应该改变思维，拥抱那些来自……的人


    # Android 移动


    随着更多的 Android 特性合并到 Linux 内核，为这些最流行的操作系统平台开发变得简单得多。拥有超过 250 亿下载量和超过 1 亿台 Android
    设备，有广泛的人群需求和应用。如需更多关于 Android 驱动的编辑，你可以查看我们的姐妹刊《Android 杂志》，它致力于最新的应用。通过新闻和评论跟上
    Android 的一切动态。还有关于开发、破解和你的硬件的教程和建议。在 littlegreenrobot.com 了解更多。


    我们很高兴你喜欢这个 2005 专题，这并不是迟到的投稿，真的——因为下一个 Linux 内核非常接近宾夕法尼亚的 Vault，而它最近刚刚发布。


