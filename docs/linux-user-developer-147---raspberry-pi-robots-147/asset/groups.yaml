    # 迷你 PC：Adaptera Desktop 配有基于 Epiphany 架构的内核协处理器，Parallela 是开发者一直等待的单板计算机吗？


    Epiphany 芯片显示出真正的潜力，并与具有相似的功能竞争。Parallela 是一个如果没有这个概念就永远不会的产品。它的开发通过 Kickstarter
    筹资，使得初始模型仅售价 99 美元。遗憾的是，Parallela 的成本已经上涨；配备双核处理器的入门型号售价 97 英镑；Desktop 版本售价 167
    英镑；高端和嵌入版对于大多数用户来说是最贵的选择。


    软件支持仍处于早期阶段，连接器使其对爱好者开放。从乍看之下，Parallela 的定价似乎已经超出了市场范围。然而，查看规格发现事实并非如此。运行在 800MHz
    的双核 Cortex-A9 远非极速，Zynq 系统也包含一小部分，可用于更大的任务。Epiphany 通过其流水线为未来的发布提升了 32 十亿次运算的性能。正是
    Epiphany 将吸引大多数客户使用 Parallela，并努力使其成为……


    | 技术规格 |

    | :--- | :--- |

    | 操作系统 | Linaro (Ubuntu) 14.04 |

    | 处理器 | Xilinx Zynq-7010 双核 ARMv7 和 FPGA |

    | 协处理器 | Adapter Epiphany-III E1630 |

    | 内存 | 1GB DDR3 |

    | 尺寸 | 80.5mm x 55.5mm x 14.8mm |

    | 重量 | 86g（包含电池，不含电缆） |

    | 端口 | Micro USB OTG, Micro HDMI, 千兆以太网, GPIO |

    | 价格 | 117.7 英镑 |


    # 同样考虑


    该板非常紧凑，但其热包络很大：该板安装在没有散热器的情况下带有一个风扇——如果你在持续负载下使用该板，不建议这样做。惊讶的是，是 Epiphany 将 Zynq
    加热到了相应水平。该板功能多变，带有 HDMI 输出和 USB OTG 端口，可以作为标准微型计算机使用，它在该任务上的表现尚可。一个遗憾是高性能工作仍要在
    FPGA 上的加速 GPU 上，Parallela 社区（现已超过 10000 人）很难迁移常用应用程序以利用 Epiphany。但目前，它仅适用于那些花时间将应用程序迁移到任何
    API 的人。由于 GPIO 引脚仅在桌面和嵌入式版本可用，且隐藏在不友好的接口处，除非你熟悉市场语言，否则 Parallela 不是 FPGA 开发的最佳选择。


    对于程序员来说，Parallela 是一个卓越的低功耗平台，允许进行 FPGA 代码实验，并在一个封装中运行 Epiphany 架构。


    # 总结


    Epiphany 在低功耗下提供了卓越的性能，而微型 Zynq 处理器也是如此。对于研究并行处理或 FPGA 工作的程序员来说，这是不智的选择，但缺乏现有应用程序的支持使得
    Parallela 成为一项冒险的投资。


    # NVIDIA Jetson TK1

    199.99 欧元

    带有嵌入 192 核图形处理器，Jetson TK1 提供了高达 300 十亿次运算的图像处理能力和多核处理器的异步架构。然而，大部分性能受限于语言支持，市场上文档并不多。


    # 树莓派 Model B+2

    27.74 欧元

    这个版本的树莓派设计尽管价格更便宜，但处理器内存不如前一个版本大。然而，它是令人印象深刻的，并且更多功能，能够在容易获取外壳的情况下转回到并行开发，raspberrypi.com。


