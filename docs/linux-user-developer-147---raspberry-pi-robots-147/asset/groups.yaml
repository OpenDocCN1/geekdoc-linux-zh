    # Snowcode 2015


    - * 瓦代泽尔 (Val d''Isere)

    - 法国

    - snowcode.com


    Snowcode 成立于 2010 年，是一个英国开发者组成的小聚会，他们每年都会前往一个新地区。该年度重点关注微服务和 NoSQL，并得到了 Google
    等初创公司和公司的赞助。还有敏捷研讨会和技能大师。


    # 开发


    # Intel 的 Beignit 达到 1.0 里程碑


    Intel 的这一项目为通用图形处理器（GPGPU）提供开源 Linux 驱动程序，现已达到 1.0 里程碑。1.0 版本发布包括对从第三代 Ivy 到第十一代
    Intel 处理器的支持，并承诺将提高性能。


    “张工在公告文章中声称：“我们在 OpenCV 3.0 基准测试中观察到 10 倍到四倍以上的性能提升。”

    1.0 版本的进一步更改还包括修复内存泄漏、支持 Clang/LLC 编译器，并通过将内置函数支持从头文件移到后端库，缩短了编译时间。


    # Linux-conf.2015


    - * 奥斯陆大学

    - 新西兰

    - lca2015.linux.org


    全球最领先的开源会议之一，也是南半球最具声誉的会议，LICA2015 包括了学生演讲、主题讨论会议以及从云到内核的专题。


    # 政府 ICT（信息技术）


    - * 伦敦 QEEI 会中心

    - 英国

    - government-ict.co.uk


    政府 ICT 会议帮助追踪政府项目的成功，包括关于开源如何帮助降低成本和提高效率的讨论。


    # 开发


    # Mozilla 发布 Firefox 开发者版


    Mozilla 宣布了 Firefox 开发者版，它称这是“首个为开发者开发的浏览器”，具有许多工具可以使他们所需任务的开发变得更容易。近期在多样化转型面向浏览器的尝试，包括发布用于手机的
    Firefox OS、“专为开发者设计”的 Firefox，承诺为 Web 开发者提供更好的工具。


    开发者版与基础版的主要区别在于功能是 Valence，这是一个预装扩展，它将允许开发者调试多个浏览器平台，并与 Firefox 工具连接。此前名为 Firefox
    Tools，新版本支持 Android 和 iOS，以及 Mozilla 的各种 Firefox 变。

    对开发者友好的界面包括响应式设计、WebDevEd、Web 音频编辑器、页面检查器和强大的 Web 控制台、JavaScript 调试器和开发者工具。


    “我们重新设计了浏览器，通过一个全新的过滤器来审视它，以便在 11 月发布前取得领先。它最适合开发者，因为你可以调试整个世界，让你更轻松地构建出的 Web
    体验。”


