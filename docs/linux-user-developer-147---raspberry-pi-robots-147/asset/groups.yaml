    # 测评密码管理器


    ## 简评：对比并分析我们的评结果


    ## Seahorse (密码)

    ## KDE Wallet (钱包)

    ## KeePassX

    ## LastPass


    | 特性 | Seahorse | KDE Wallet | KeePassX | LastPass |

    | :--- | :--- | :--- | :--- | :--- |

    | **界面** | 表面简单，下方层级较深，但也许过于简单？ | 窗口结构和空间上有些问题，但总体来说非常漂亮 | 设计非常出色，适合日常使用。选项不杂乱且解释得很好
    | 网页界面虽然有些散乱，但标签标注非常清晰 |

    | **功能** | 隐私、PGP 和 SSH 密钥方面表现出色，但在表单方面表现不佳 | 非常适合保存不同的钱包并控制访问 | 存储大量信息并有许多搜索选项——组织非常有组织
    | 功能极其丰富，且这些都是实实在在的功能 |

    | **易用性** | 在某些地方没有其他产品直观，但足够易用 | 提示功能与兼容应用程序配合以加速输入 | 直观，且带有非常方便的快捷键提取数据 | 输入保存的数据（包括密码和卡片）轻而易举
    |

    | **安全性** | 通常加密水平足够，并为密钥提供了一些详细选项 | 对微观级加密和项目保护存在一些担忧 | 为整个数据库提供了非常强大的加密和安全选项
    | 强力加密和令人印象深刻的安全功能范围 |

    | **总体** | 最适合处理 PGP 密钥。不推荐用于密码 | 加速日常输入，适合将数据分组到钱包中 | 如果你不打算使用浏览器扩展程序，选这个就没错
