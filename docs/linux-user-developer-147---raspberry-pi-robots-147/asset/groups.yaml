    \ is a 30x16 pixel that scrolls horizontally.\n\n- Objects\nOur character is a\
    \ 30x30 sprite. We also made some enemies for the game.\n\n## Advisor\n\nTam Hanna\
    \ has been in the IT business since the days of the BBC. Serving as journalist,\
    \ speaker and has seen every aspect of the mobile market more than once. Don Nguyen's\
    \ very popular game Flappy Bird involves a simple mechanic: you control an object\
    \ through pipes by tapping a ship that rises while it falls.\n\nUnder a superficial\
    \ examination, the Pebble doesn't look like an ideal device for gaming. If we\
    \ look at its monochrome ARM processor, the screen does not have the ability to\
    \ display colour. The Pebble interacts with its user via a grant of four buttons,\
    \ which can be easily accessed by third-party applications.\n"
