    # Review


    # Mini PC: Adaptera DesktopWith a 16-core coprocessor based on Epiphany architecture,
    is the Parallela the single-board computer that developers have been waiting for?


    The Epiphany chip shows real promise and rivals with similar features. Parallela
    is a product that would never have existed without the concept. Its development
    was funded by a Kickstarter campaign, making the initial model available for just
    $99. Sadly, the cost of Parallela has risen since then; the entry-level model,
    which features the dual-core processor, costs £97; the Desktop variant, which
    costs £167; the top-end and Embedded version is the most expensive option for
    most users.


    Software support is still in early stages, and connectors make it open for hobbyists.
    At first glance, Parallela appears to have priced itself out of the market. However,
    a look at specifications reveals that isn''t the case. The dual-core Cortex-A9
    running at 800MHz is far from blazing, the Zynq system also includes a small subset
    of which are available for bigger tasks. The Epiphany boosts by 32 gigigaflops
    performance from its pipeline for future release. It''s the Epiphany, that will
    attract most customers to the Parallela and worked hard to make it as...


    | Technical specs |

    | :--- | :--- |

    | Operating System | Linaro (Ubuntu) 14.04 |

    | Processor | Xilinx Zynq-7010 Dual-Core ARMv7 and FPGA |

    | Co-Processor | Adapter Epiphany-III E1630 |

    | Memory | 1GB DDR3 |

    | Dimensions | 80.5mm x 55.5mm x 14.8mm |

    | Weight | 86g including battery, excluding cables |

    | Ports | Micro USB OTG, Micro HDMI, Gigabit Ethernet, GPIO |

    | Price | £117.7 |


    # Also consider


    The board is compact, but its thermal envelope is large: the board is mounted
    without a heatsink, with a fan - not recommended if you are using the board under
    sustained loads. Surprisingly, it''s the Epiphany that heats the Zynq to level.
    The board is versatile, with HDMI output and USB OTG ports to use as a standard
    microcomputer, a task at which it performs decently. The one caveat is that high-performance
    work continues on an accelerated GPU implemented on the FPGA, the Parallela community,
    now over 10,000-strong, is hard to port common applications to take advantage
    of the Epiphany. But for now, it remains accessible only to those taking the time
    to port applications to any of the APIs. With the GPIO pins, only available on
    the Desktop and Embedded variants, being hidden on unfriendly density connectors,
    the Parallela is not the best choice for FPGA development unless you are familiar
    with the language, equipped with the market.


    For programmers, the Parallela is a remarkable choice of a low-power platform
    that allows experimentation in coding for FPGA, and the Epiphany architecture
    in one compact package.


    # Summary


    The Epiphany delivers remarkable performance for a low power draw, yet so does
    the tiny Zynq processor. For programmers investigating parallel processing or
    FPGA work it is a no-brainer, but a lack of support from pre-existing applications
    makes the Parallela a bit of a bleeding investment.


