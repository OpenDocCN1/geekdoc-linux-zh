    去年是 SUSE 12 SP1，现在我们讨论的是 SUSE 12 —— 下一代平台。在增加可用性和运行时间领域的创新和功能，内核热补丁（kernel-live
    patching）正在发挥作用。


    Nils 本身对这种新产品和技术的交付为 SUSE 团队的量化有一些见解。我们所有人并没有不同，而是在持续增长……这意味着所有业务指标都在增长。（这是基于订单的）。因此，我们上半年的发票额以
    27% 的速度增长，这非常强劲。”


    热补丁（Live patching）是重大的——Linux 内核与 Unix 相比最后实现的功能之一，也是许多遗留用户一直期待的功能。为什么花费了 20 年，一个解决方案才变成现实？


