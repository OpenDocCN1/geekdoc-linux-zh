  - '[PAGE 33]


    No matter where you deploy your app, Capistrano makes it easy to deploy Rails
    (and other platforms) to *nix servers


    Changes like adding a QA stage after production, with qa.rb, are both possible
    and with your modular structure


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_33_0.png)


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_33_1.png)


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_33_2.png)


    Built from Ruby, and originally for Rails, Capistrano 3 is a great fit for deploying
    other web platforms


    Capistrano''s flexibility can mean a lot of config, but it''s relatively straightforward


    # Continuously deploy web apps with Capistrano


    # Move your web apps'' development versions painlessly from staging and testing
    deployment on databases and web servers


    Advisor

    Richard Smedley

    A Unix-packager himself, Richard doesn''t found enough time in any language to
    get truly proficient, but always has a shell open to learning scripting by osmosis


    Capistrano automates deploying web apps to your servers, taking care of tiresome
    tasks using a series of remote commands on any machine you have at hand.


    and you will need to go a way beyond the simple introduction if you want to get
    the full use of it.


    Capistrano region is easy to: deploying tasks such as rollback, which consists
    of groups. Servers can have roles: application servers, web servers, and db servers.
    With this (extensible) framework, it''s easy to adjust Capistrano''s configuration
    files for your particular app and collection of servers. Basic setup is simple
    enough, but Capistrano 3 is a flexible framework


    You will need Ruby, git (plus a GitHub account) and Rails project you''re working
    on. Also rbenv working with Rails makes Capistrano and capistrano-ruby make Capistrano
    correct for your deployment. It doesn''t matter whether you use Passenger, Unicorn
    or Puma as your app server, but note that there are Capistrano plugins to help
    with extra tasks on all of them. Search rubygems.org for the full choice.


    # Resources


    Ruby > 1.9

    (RBENV makes it easy)


    git www.git-scm.com


    Capistrano 3 www.capistranorb.com


    34 www.linuxuser.co.uk'
- md: "\n# Continuous deployment with Capistrano\n\nAutomate the deployment of your\
    \ web apps to servers\n\n## TUTORIAL\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_34_0.png)\n\
    \n![](img/7b0011b9ca05b82c33c02a484fd02e99_34_1.png)\n\n| available versions:\
    \ |\n| :--- |\n| 1.8.6-p383 |\n| 1.8.6-p378 |\n| 1.8.6-p420 |\n| 1.8.6-p366 |\n\
    | 1.8.7-p249 |\n| 1.8.7-p310 |\n| 1.8.7-p382 |\n| 1.8.7-p373 |\n| 1.8.7-p354 |\n\
    | 1.8.7-p334 |\n| 1.8.7-p352 |\n| 1.8.7-p357 |\n| 1.8.7-p358 |\n| 1.8.7-p370 |\n\
    | 1.8.7-p379 |\n| 1.8.7-p376 |\n| 1.8.7-p374 |\n| 1.8.7-p375 |\n| 1.9.1-p310 |\n\
    | 1.9.1-p378 |\n| 1.9.1-p430 |\n| 1.9.2-p010 |\n| 1.9.2-p180 |\n| 1.9.2-p258 |\n\
    | 1.9.2-p290 |\n| 1.9.2-p318 |\n| 1.9.2-p311 |\n| 1.9.2-p325 |\n| 1.9.2-p326 |\n\
    \n## 03 On the server\n\n## 01 Install Capistrano\n\nEssentially, Capistrano copies\
    \ your app from Git, over SSH, to your server and takes care of all the operations\
    \ you would have to do the files by hand. Capistrano will deal with any database\
    \ migration, changes to files and restarting the web server and so on. Installing\
    \ Capistrano, and the extras package which is nice to have, is a simple:\n\n```bash\n\
    gem install capistrano\n```\n\nAny problem, check your Ruby installation. The\
    \ capistrano-ext gem you may see referred to elsewhere is no longer necessary,\
    \ as features extra options have been integrated into the main codebase.\n\n##\
    \ 03 On the server\n\nOn your servers, you'll need an environment of Ruby, and\
    \ git which Capistrano will use to grab the latest version (or an older one that\
    \ is appropriate to your app):\n\n## 04 Bundling gems\n\nFor a Rails project,\
    \ you can skip the install step and simply edit your Gemfile to include anything\
    \ you want. You'll want more in your project's Gemfile:\n\n```ruby\ngem 'capistrano',\
    \ '~> 3.2.1'\ngem 'capistrano-rails', '~> 1.1.2'\ngem 'capistrano-rspec', '~>\
    \ 1.0'\nif you are using Rbenv\ngem 'capistrano-rbenv', '~> 2.0'\nif you're using\
    \ Unicorn app server\ngem 'unicorn-cap'\nif you're using Puma\ngem 'passenger'\n\
    ```\n\n## 02 SSH Keys\n\nIf you're logging into your server with SSH password,\
    \ it's time to generate keys. This is so that the login can be automated for Capistrano\
    \ and other scopes if you want to use a good idea of it for anything else. You'll\
    \ also need to add your GitHub account if you want to be able to set up starting\
    \ keys with:\n\n```bash\nssh-keygen -t rsa\n```\n\n...if you've not got one already\
    \ in ~/.ssh/ and copy the ~/.id_rsa.pub to the server:\n\n```bash\nssh-copy-id\
    \ -i ~/.ssh/id_rsa.pub user@remote-host\n```\n\n...which works by substituting\
    \ your username, and servername address.\n\nYou don't need any packages like Bundler\
    \ for your setup, so you do:\n\n```bash\ngem install --no-ri --no-document\n```\n\
    \nIn general, you'll also need to set up the database or separate database server\
    \ as required by your setup. A Rails Rails use case is SQLite on your developer's\
    \ laptop and PostgreSQL on the production servers.\n\n```bash\ngem install --no-doc\
    \ --no-ruby\n```\n\nA 3.2.1 means that 3.2.2 will be installed when you run it,\
    \ 3.3.0 will not to avoid major version changes breaking your code.\n\nThis will\
    \ integrate Capistrano, bundle install installs the gems specified in your Gemfile\
    \ and install them.\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_34_2.png)\n\n\
    ## Tutorial\n\n## Prepare to deploy\n\n```bash\ncapfile deploy/b production/b\n\
    ```\n\n```ruby\nserver \"27.58.xx.xx\", :db, :primary: true\nrequire \"capistrano/deploy\"\
    \nset :application, \"myapp\"\nset :user, \"root\"\nset :deploy_to, \"/var/www/#{fetch(:application)}\"\
    \nset :deploy_via, :remote_cache\nset :repo_path, nil\nrepo do\n  set repository,\
    \ \"https://github.com/myblog.git\"\n  set branch, \"master\"\nend\n```\n\n##\
    \ 05 Config\n\nbundle install creates the necessary config files and directories.\
    \ In this step we specify the actions that Capistrano takes to deploy our app\
    \ to staging or production server. Note that staging and production are created\
    \ by default using config/deploy, and you can add a .cap file to it if you wish\
    \ to add a third stage. Alternatively, you can create all stages at time:\n\n\
    ```bash\ncap install stages=staging,production\n```\n\n## 08 Prepare to deploy\n\
    \ndeploy adds some lines to your project:\n\n| name | type | gitignore |\n| :---\
    \ | :--- | :--- |\n| config | directory | * |\n| db | directory | * |\n| deploy\
    \ | directory | * |\n| shared | directory | * |\n| vendor | directory | * |\n\n\
    ## 06 Config\n\nThe last Capfile is used by Capistrano to load files under config.\
    \ By editing Capfile you can control which plugins loaded.\n\n```ruby\nrequire\
    \ \"capistrano/rails\"\nrequire \"capistrano/deploy\"\nrequire \"capistrano/migrations\"\
    \n```\n\n...and make sure the line starting with deploy at the end of the above\
    \ is present and uncommented. This line ensures that all files for capistrano/rails\
    \ get loaded, any custom tasks in capistrano/tasks that you want to define.\n\n\
    ## 07 Secrets\n\nRemember that everything in our app is shared with the team and\
    \ anyone who has access to your repository, so edit .gitignore file to add this\
    \ line:\n\n```\nconfig/database.yml\n```\n\nNow you can edit /config/database.yml\
    \ to present your database in staging and production environments. Restart your\
    \ Rails server and check it's working properly at http://localhost:3000 Note that\
    \ we are deploying just one stage. You might also want to add some specifics for\
    \ your Ruby environment:\n\n```ruby\nset rbenv_type, :system or :user\nset rbenv_version,\
    \ \"2.1.2\"\nset rbenv_root, \"$ENV['RBENV_ROOT']\"\nRUBY_PATH=#{fetch(:rbenv_path)}/bin/env\n\
    VERSION=#{fetch(:ruby)}\nset rbenv_map, [:rake, :gem, :bundle]\n```\n\n## 11 Parallels\n\
    \nWith the simple on/ syntax of the Rake-derived DSL: splitting of tasks across\
    \ servers is easy. For example, to run something on every server at:\n\n```ruby\n\
    on all, :parallel do\n  # parallel task here\nend\n```\n\nGetting your services\
    \ to start a task in sequence avoids hitting a shared database, by defining sequence\
    \ and:\n\n```ruby\non all, :sequence, wait: 15 do\n  # sequential code here\n\
    end\n```\n\nFor a longer restart of a large cluster, you can group servers together\
    \ to deploy in:\n\n```ruby\non all, :groups, limit: 3 do\n  # Your restart ...\n\
    end\n```\n\n## SSHkit\n\nThe Capistrano development process gave birth to the\
    \ SSHKit library developed by Ian Hambley who did the great work of making Capistrano\
    \ 3 an improvement over its predecessor version 2.\n\nSSHKit is a low-level toolkit\
    \ that Capistrano uses for everything like logging, connection management and\
    \ command execution. You can use it for running commands on one or more servers.\n\
    \nSSHKit was built upon the first time you use. To use it yourself, start with\
    \ some of the examples on the GitHub page and adapt for your site.\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_36_0.png)\n\
    \n## 09 Test and prepare\n\nSetting tests will help when your tests fails:\n\n\
    ```bash\n# tests list lib/capistrano/tasks/\nrun_tests.cap\nset :tests, :\n```\n\
    \nNow you edit the :server_name and server in config/deploy/production to your\
    \ server's domain.\n\nWhen you need to deploy, you can add a task_setup:config\
    \ to install the server software, would be desirable with multiple servers. But\
    \ keep things simple in this earlier manual set of servers.\n\nSSHKit built a\
    \ path to the restricted:\n\n```ruby\non hosts do\n  within \"/\" do\n    puts\
    \ capture(pwd)\n  end\nend\n```\n\nBehind the scenes File join() is taking care\
    \ of the files to build the path and feature:\n\n```\n/var\n/var\n```\n\n## 12\
    \ Off the Rails\n\nThere's plenty of documentation available to help with your\
