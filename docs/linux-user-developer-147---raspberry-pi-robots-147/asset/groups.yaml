    # Linux 上的全隐私

    保护自己免受广告商、人肉搜索和网络威胁的侵害


    ## 特性


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_16_0.png)


    隐私，化简单。


    免费获取 AVG PrivacyFix


    您的 Facebook、LinkedIn 和 Google 隐私仪表板。拦截超过 1000 个跟踪器


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_16_1.png)


    PrivacyFix 涵盖了所有社交媒体账户，并由 AVG 管理。


    关于这一点，完全放弃网络域名并不是一个好主意。大多数注册商现在都提供服务，通过他们自己或第三方让您的信息私密化。这种服务仍然存在，但只有持有授权令的人员才能通过该服务访问，普通公众无法访问。然而，每年花费几美元或几英镑对于其带来的安全感来说是非常值得的。


    在 Twitter、Facebook 和任何其他社交网络上批准的权限，在您离开后很久仍会保留其权限。例如，电子邮件、Facebook 聊天和测验可能被代表您发布内容或访问您的私人信息——这是黑客的常见目标。


    ## 谁在监控 WHOIS？


    正如我们建议的，将您的 WHOIS ICANN 详情私密化是一步，但遗憾的是它并不完美。有些网站的 WHOIS 记录仍然可以通过其他相关字段访问，但使用 PayPal
    账户可以获得七天试用。这是由于某些服务条款（ToS），但遗憾的是似乎没有删除记录的方法。这是超出范围之外的额外步骤，而并不是每个人都愿意这样做，甚至不知道自己可以这样做。


    ## 旧账户和应用


    ## 搜索你自己


    有很多网站会收集人们的数据，无论是什么公开信息。在这些网站上搜索你自己非常重要，因为任何正确链接到你身上的信息都是潜在的。大多数网站都允许您轻而易举地从其网站删除删除数据。


    域名注册商会显示您注册了多少网站，包括一些您只使用过一次的网站。幸运的是，有些网站已经是过时信息了。无论如何，通过各种方式追溯它们是一个好习惯。尽管，每年花费几美元或几英镑对于其带来的安全感来说是非常值得的。


    搜索您的旧用户名和电子邮件可以追踪到一些更难定位的账号，检查任何电子邮件存档也有帮助。


    对于旧的论坛或遗弃的网站，这几乎很容易，因为它们更容易被黑。从黑客攻击开始，您的应用


    关于隐私的安全提示，您还可以查看 Jon Jones 的隐私泄露指南：bit.ly/1wkK4tI 获取保护账户的技巧，以及更多的隐私建议。


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_16_2.png)


    17 www.linuxuser.com


    ## 特性


    ## 私有应用


    您可以使用与其他通信的应用程序，它们将维护您的隐私


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_17_0.png)


    ## 最坏的情况


    人肉搜索（Doxxing）是指在恶意攻击中将某人的私人信息泄露到互联网上以恐吓他人。这对你来说不是一件乐事，而且很难从造成的损害中恢复。它让你直接处于一个错误的境地。


    你所要的第一件事是检查信息是否已发布。你可以使用手机进行搜索。然而，将某人留在旧地址可能会被某些人误认为目标。无论是原始信息还是最终出现在 Pastebin
    或 Twitter 等第三方网站上的信息，你都应该尝试向他们报告。


    联系警察是值得的，因为他们可能会针对你的具体情况建议你如何做。他们可能无法帮助你管理并停止你怀疑的骚扰行为，但尽可能保持安全是好的，并开始寻找任何可能导致信息泄露的地方，以便你可以在未来将其封堵漏洞。


    ## 即时消息


    CryptoCat 是一种安全的即时消息服务，可在多个浏览器上运行并加密您的消息。由于即时消息客户端的原因，您需要确保您想聊天的人拥有相同的客户端，但事实上的加密是不保证的。


    在 ProPublica 的文章（配合 r/Uencryption）中，提到了 CryptoCat 和其他五个即时消息服务。这包括在传输前加密消息、端点验证、源代码以及过去对话或聊天的安全保障。如果你认识每个人都使用另一个可以获得最高分的即时消息客户端，如果
    CryptoCat 不适合你，那么它可能适合。Skype、Text Service 和 Signal/Phone 只是三个例子，它们在 ProPublica
    测试中的得分都与 CryptoCat 相同。


    ## 电子邮件


    两个最流行的电子邮件客户端 Thunderbird 和 Claws mail 都支持对邮件进行 PGP 加密，这意味着邮件的收件者将能够通过提供特殊密钥来读取它们。


    Claws 默认支持它，但您需要为 Thunderbird 安装 Email 插件来设置 PGP。您使用 PGP 发送和接收电子邮件，由于社区已知其来源是安全的，请在第
    26 页了解如何使用 Thunderbird 和 PGP。


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_17_1.png)


    如何发送只有接收者才能解密的邮件


    上面的 Enigma 是 Thunderbird 的扩展程序


    PGP 加密在 Tails 中用于以确保邮件是私密的


    18 www.linuxuser.com


    ## 新：专用服务器


    在选择正确的服务器供应商时，信任至关重要。凭借 13 年的服务器经验，在 11 个国家拥有 6000 名员工，是全球最大的互联网服务提供商之一。您可以信任我们高科技数据中心提供的最大安全保障。


