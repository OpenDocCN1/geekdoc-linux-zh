    # SECURITY

    Google releases Nogotail


    Google has released a tool called ''nogotail'', used internally for testing SSL
    and TLS services for vulnerabilities. "The Android Security Team has built a tool,
    called nogotail, that provides an easy way to confirm applications against known
    SSL/TLS vulnerabilities and misconfigurations," wrote Google security engineer
    Alex Chen. "Nogotail works for Android, iOS, Linux, Windows, Chrome, OS X, and
    in any device you use to connect to the Internet.\Nogotail is available on GitHub
    repository under an Apache 2.0 licence at bit.ly/3ix00


    # GNOME Foundation

    Groupon drops Gnome pushback


    Web Service has dropped its applications for operating systems under the name
    Gnome, significant consumer backing of the GNOME Foundation''s objective. The
    Foundation represents the GNOME project, a 17-year strong development environment
    for GNU/Linux and BSD, and naturally claimed that its trademark of Gnome held
    since 2005 – would invalidate GNOME''s applications and give them to pick a new
    name than Gnome for their own operating system.

    "Not Gnome refuse," claimed in its call to settle the matter, but it has now filed
    even more trademark applications. To use the GNOME name for proprietary software
    that is antithetical to the fundamental ideas of the GNU, the free software community
    and the GNOME project is outrageous.

    Following a lawsuit of $100 million, the GNOME Foundation''s legal team has considered
    its actions. "After additional conversations with the open source community and
    the GNOME Foundation, we have decided to abandon our pending trademark applications
    for ''Gnome,'' announced Gnome''s S. Vasanathan. "We will choose a new name for
    our product forward."

