  mdcn: "\n\n## Pi2Go Lite\n\n作为我们测试过的最小的机器人之一，你可以说 Pi2Go 有些过人之处。\n\nPi2Go Lite 是一个非常有趣的设备。它被装在一个微小的盒子里，没有使用底盘，而是采用了\
    \ PCB 结构，这使得它是一个非常简单的机器人，可以执行命令而不会真正接触复杂的环境。它听起来像是一个遥控机器人，但可能比牙玩具要好得多。\n\n由于 Pi2Go\
    \ 可能是本期功能最丰富的机器人，但所有这些功能都是代价的；它是一个在组装前需要一些焊接和准备工作的机器人。虽然需要进行一些焊接，但不需要剥去任何电线之类的。大约有\
    \ 50 个组件需要安装，可能更多，而且可能有点棘手。说明并不特别有用，但组件实际上列在 PCB 上，作为放置物品位置的大致指南。\n\n一旦你需要将这少数几个部件组合在一起完成它。网站列出的组装时间为\
    \ 90 分钟，但我们发现要长得多——比其他更大或更复杂的机器人都要长。\n\n它是一个紧凑的小家伙，通过自定义 Python 库由树莓派供电。传感、驱动电机和其他功能都有其相应的\
    \ Python 函数。它让你能够创建脚本使其完全自主运行，只要这种自主只需要达到距离和接近传感以进行操作，如果设置正确，它就可以从树莓派获取额外的时间或网络信息。\n\
    \n考虑到价格、功能和相对容易的编程性，它是一个极佳的设备，非常适合入门机器人和敏捷性开发。需要一些焊接技巧。\n\n## 技术规格\n\n| 特性 | 细节\
    \ |\n| :--- | :--- |\n| 制造商 | 4tronix |\n| 高度 | 90 mm |\n| 宽度和深度 | 130 x 145 mm\
