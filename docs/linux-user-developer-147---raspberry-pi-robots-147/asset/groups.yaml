    ### How is the Pi tracking attached?

    It''s just pulling through HDMI, it''s really just an add-on to the Pi that we
    make. You plug it in, then it''s 3D-printed, and so simple in that way.


    ### Is there another way to get out?

    We have a small wireless keyboard that we use to control it and we keep it as
    simple and easy as possible to that controls on the Pi.


    ### Do you think this Pi will be a useful project?

    Pedro, with the help of the AV we might revert in a future project. We''s really
