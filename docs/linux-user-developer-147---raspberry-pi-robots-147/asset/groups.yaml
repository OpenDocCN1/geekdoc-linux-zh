    \n58 www.linuxuser.co.uk\n\n## Raspberry Pi robots\n\n## CHALLENGE 3...\n\n###\
    \ Three-point turn\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_58_0.png)\n\nOur\
    \ robots can go in reverse, but however easily they do a 180 turn?\n\nThis is\
