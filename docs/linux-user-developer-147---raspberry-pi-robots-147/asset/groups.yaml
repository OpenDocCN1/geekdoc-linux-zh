    # ## Password managers


    We put four of the best password-management tools for storing and encrypting your
    personal details to the test


    | Seahorse | KDE Wallet | KeePassX2.0 | LastPass |


    Seahorse is a GNOME application that works as a front for GNOME Keyring, which
    is a collection of components from GNOME that store and protect the user''s login.
    Seahorse is a recommended Keyring application and provides a simple GUI for managing
    it.


    A subset of the KDE system, KDE Wallet can be installed and used effectively on
    whichever Linux system you''re running. It allows you to split up your stored
    password into wallets, and with a compatible browser like Konquer you can use
    prompts to quickly save data.


    We tested the Alpha 6 version, which is very close to its Beta release. The KeePassX
    blog says that the alpha is "already rather stable" though it does use a local
    database just in case, and users have reported that it is good enough for regular
    use as it is.


    LastPass is a little different from the installable packages that we''re looking
    at here as it''s a browser extension, and your settings and stored information
    are in the browser interface. This format brings with it a few advantages that
    we put to the test.


