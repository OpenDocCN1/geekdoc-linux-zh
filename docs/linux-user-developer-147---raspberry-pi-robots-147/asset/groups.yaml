    SUSE Cloud 变成了一个新产品 SLE 13 终于。新技术和新产品是 SUSE 进入会议的主题，以“始终开放”为主题，提醒大家，尽管 SUSE 正在开发新技术，但始终开放的。SUSECon
    14 再次是 IT 各层人员的活动盛周，参会人数和分会会议比以往任何时候都多。回到活动与 SUSE 的高层人员交流，感受 SUSE 在 2015 年的状况。


