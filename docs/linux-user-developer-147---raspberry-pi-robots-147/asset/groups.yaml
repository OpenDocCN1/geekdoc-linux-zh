    \ |\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_57_0.png)\n\n我们被这个合一套装惊到了，它履行了任何水平的初学者都能轻松组装的承诺。一切都包装良好，甚至还带了一个微型螺丝刀——这意味着你不需要其他工具了！在大多数情况下，说明非常棒，但也有几次由于清晰度不足导致了问题。这种边缘的设计非常有用——可以在原地旋转。你可以看到它是由坚固且轻质的材料制成的。软件非常合理——你可以设置\
    \ Arduino 并使用电机控制器驱动一切。这套套装的唯一真正问题是——螺丝。提供的包很大，但只有四分之一是单独的每个舵机的，因为舵机上的小孔对于中号螺丝来说太小了。较大的号可能行，但你仍然必须用蛮力来。这使得快速组装过程完全停止，但我们必须说\
    \ Hexy 绝对很糟糕。\n\nHexy 上方的蓝牙传感器提供了一种无线连接的简单方法。\n\n评分\n- 组装 3/5\n- 质量 4/5\n- 可编程性\
    \ 5/5\n- 功能性 5/5\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_57_1.png)\n\n58 www.linuxuser.co.uk\n\
    \n## 树莓派机器人\n\n## 挑战 3...\n\n### 三点转向\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_58_0.png)\n\
    \n我们的机器人可以倒车，但它们如何轻松地完成 180 度转向呢？\n\n对于 Pi 来说，这通常是一个棘手的挑战，特别是如果必须自主的话，要求机器人在转弯之前离开指定的区域，并在\
    \ 750mm 的正方形内移动。一旦完成动作，转向并返回起点。为了这一点，你需要极其精确地知道速度和方向来实现 180 度转向。\n\nHex 的优势在于它可以字面上在原地旋转，或者移动它的脚而不需要示例代码即可实现。你只需要走到所需位置，转向并编写一个非常简单的脚本，让\
    \ Hexy 在尝试 180 度转向之前向前走几“步”，然后返回相同数的起始位置。\n\n我们在这里提供部分代码，你也可以从下面的链接获取。\n\n首先，我们定义了一些基本参数，Hex\
