    \n## 评分\n\n- 组装 3/5\n- 质量 3/5\n- 可编程性 4/5\n- 功能性 5/5\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_55_1.png)\n\
    \n56 www.linuxuser.co.uk\n\n## 树莓派机器人\n\n## 挑战 2..\n\n### 巡迹\n\n沿着黑色的线条移动，尽管你可能在终点找不到一个魔法师。\n\
