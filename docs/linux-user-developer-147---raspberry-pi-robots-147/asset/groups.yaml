    # # Welcome to 147 of Linux User & Developer This issue


    Rob Zetsloot studied aerospace engineering, using Python to model complex simulations.
    This youngster barely prevented from going a step too far with his programming
    (p.52). Rob was at SUSECon brilliant Column this month to talk about his project,
    which in turn by doing to save the future.


    Get Linux User cheaper every issue.


    Jon Masters is a kernel hacker who has been working on Linux for over 19 years,
    since he attended university in Cambridge, Massachusetts, and works for an enterprise
    Linux vendor. You can find his Column on pages 12-13 this month.


    Page 24


    Christian Crawley is an IT and software support engineer, and since 2010 he has
    written for Linux and smartphones both online. Christian shows us how to connect
    a Raspberry Pi to home order to print wirelessly (p.68) and how to host a website
    on a Pi (p.70).


    - Build and program robots

    >> How to be totally safe online

    >> News report from SUCon2014

    >> Encrypt emails, passwords and drives


    Welcome to the latest issue of Linux User & Developer, the UK and America''s favourite
    Linux and open source magazine.


    As you might have guessed from the front cover we had a lot of stuff from Sam,
    our talented friend, and some very best kits for Android and Raspberry Pi. We
    also work on constructing and reviewing Raspberry Pi, how to use robots on page
    52. And then another four more robots got them squat-style, swinging golf clubs
    and more - all his scripts are available on FileSite.co.uk (you check out page
    96 for details on how to access your free content).


    This issue addresses the rapidly changing world of Linux, and in wake of a state
    of online abuses of privacy and widespread security issues, we also added our
    most privacy and security-focused issue. We see how to be totally safe online
    (page 14), how to encrypt your email, how to encrypt now that TrueCrypt is dead
    (page 42), and we''ve discovered the very best secure password managers for Linux
    (page 77).


    But don''t worry, there''s more of the stuff to go with that - including a home-made
    Google Squares (page 46) and a platform for the Pebble software (page 46). Gavin
    Thornby, Editor.


    Tam Hanna has been in the IT business since the days of the PC; he works as a
    journalist, teacher, author of software and knows every aspect of the mobile market
    more than most. This month teaches us how to use a Flippy Bird-style game for
    the Pebble smartphone (p.44).


