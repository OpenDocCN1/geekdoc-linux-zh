    \ replant-tripod.deg forward\n  for leg in tripod2:\n    leg.replantFoot(rotate=rotate,step,time=0.5)\n\
    \  # replant tripod2 in place as tripod1\n  for leg in leg2:\n    leg.setPosition(int(floor(leg/2.0))\n\
    \  sleep(0.3)\n```\n\n# # Next step\n\nThe above-and-turn code can be easily expanded\
    \ into a full sidewalk routine, with lines, loops, leafs, audience-pointing and\
    \ even a stance, which you will need to path. Just grab the PolCo source code\
    \ (by LiYLuQOF) and work those Python chunks into your main script wherever you\
    \ like.\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_58_1.png)\n\nAbove there are\
    \ three parts to each leg and each contains one servo. This articulation could\
    \ potentially enable Hex to climb medium-sized objects and obstacles\n\n59.linuxuser.co.uk"
- md: "\n## Frindo\nThe puck robot with a low profile and plenty of front-facing sensors\n\
    \nThe Frindo is sold more as a robotics platform than an actual all-inclusive\
    \ robot on its own, but that doesn't mean it's a basic base to build upon. Out\
    \ of the box you can do a fair bit with it, while it is extremely easy to build\
    \ upon thanks to its support for Arduino and Raspberry Pi.\n\nConstruction is\
    \ very straightforward and quite quick, although you will have to solder some\
    \ wires to the motor during construction. This is the only soldering that needs\
    \ to be done on the Frindo though. However, it requires extra steps on top of\
    \ everything that not everyone may be equipped for. Still, the actual chassis\
    \ construction and fitting of the motors and boards with a few components can\
    \ be completed quite quickly.\n\nOnce you've done a few things with Frindo, you\
    \ can add more to the system either or without the supplied Arduino. This can\
    \ be mounted on the opposite side of the board using holes cut out for the Model\
    \ B (unfortunately not the B+). There's also room for four more wheels, easily\
    \ unobstructed in the spaces between the front and back to create 360 degree coverage.\
    \ The Uno and Pi can take more inputs and outputs as you need.\n\nDue to the dual\
    \ controller, the Frindo can be programmed in both Python and the Arduino IDE.\
    \ Arduino uses the standard libraries and commands, making it great for those\
    \ unfamiliar with Python. The Python program uses the serial library, which uses\
    \ terminology from Arduino, and there's a good, basic example on the website that\
    \ can help you understand exactly how the sensors and motors can operate in this\
    \ fashion.\n\nThe Frindo is the most accessible robot we have. Very simple, very\
    \ good, and excellent to learn with plenty of robotic applications.\n\n## Technical\
    \ specs\n\n| Feature | Value |\n| :--- | :--- |\n| Manufacturer | Frindo |\n|\
    \ Height | 85mm |\n| Width and depth | 160 mm diameter |\n| Power | 9 volts from\
    \ 6 AA Batteries |\n| Control board | Arduino and Raspberry Pi |\n| Form of locomotion\
    \ | Wheels |\n| Sensors | 4 infrared proximity sensors |\n| Website | www.robotbits.com\
    \ |\n\n> Above The Robot Shield has been donated to the Frindo project as an open-source\
    \ version\n\n## How it scored\n\n- Assembly: 4/5\n- Build quality: 4/5\n- Programmability:\
    \ 4/5\n- Functionality: 4/5\n\n## CHALLENGE 4...\n\n### Proximity sensor\n\nHow\
    \ do you dare to go to the wall at the end of the course?\n\nThis challenge is\
    \ somewhat simple: drive right up to a wooden wall before hitting it. The closer\
    \ you are the more points you get. Not touching the wall should be easy using\
    \ your proximity sensors, right? Well it's not as easy as you would think, and\
    \ the proximity sensor is unlikely to be in full. There must surely be a way around.\n\
    \nThe Frindo's sensors have some form of distance sensing on them, although it\
    \ by no means perfect. The other thing you would have to calibrate is assuming\
    \ program speed and stopping distance when moving straight on. The motors on the\
    \ Frindo are unlikely to be in sync, making it likely a slight angle. There are\
    \ multiple ways to use sensors on the front, and we can use the left and right\
    \ sensors to detect the edges of the wall and use the Frindo itself to get the\
    \ perfect stop.\n\nIn the next chapters here, we will define what constitutes\
    \ the Frindo stopping - this can be modified with trial and error to get a more\
    \ accurate result for your solution. The distance value does not correspond to\
    \ one of the parts where we define how to calculate the readings from sensors\
    \ so that they can be used in the final part. If it finds any obstacles in its\
    \ path, the following code for this script can be downloaded from FileSilo.\n\n\
    ## Code listing\n\n```cpp\nint frontTrigger = 200;\nint sideTrigger = 100;\nint\
    \ rearTrigger = 100;\n```\n\n```cpp\nint front_bump() {\n    if(bump = analogRead(FrontBump)\
    \ > frontTrigger) {\n        return 1;\n    } else {\n        return 0;\n    }\n\
    }\n```\n\n```cpp\nvoid loop() {\n    Serial.print(\"Here we go...\");\n    \n\
    \    while(!front_bump()) {\n        // while there is no bump keep going forward\n\
    \        // Serial.begin(9600);\n        if(!left_bump() && !right_bump()) {\n\
    \            Serial.println(\"NO bump detected - move forward\");\n          \
    \  rs.forward(500);\n            // move forward for 50 ms at speed 200\n    \
    \        // (200/255) of full speed\n        }\n        else if(left_bump() &&\
    \ right_bump()) {\n            Serial.println(\"LEFT bump detected - wrong angle\"\
    );\n            rs.rot_left(100);\n            // turn left for 100 ms at speed\
    \ 200\n            // (200/255) of full speed\n        }\n        else if(!left_bump()\
    \ && right_bump()) {\n            Serial.println(\"RIGHT bump detected - wrong\
    \ angle\");\n            rs.rot_right(100);\n            // turn right for 100\
    \ ms at speed 200\n            // (200/255) of full speed\n        }\n    }\n\
    }\n```\n\n## Riped\n\nThe Frindo's sensors have some form of distance sensing\
    \ on them. It stands up! The bipedal, humanoid, Arduino and Pi-powered robot out\
    \ of the box.\n\n## Technical specs\n\n| Feature | Value |\n| :--- | :--- |\n\
    | Manufacturer | Kilick |\n| Height | 25cm |\n| Width and depth | 196 x 159 mm\
    \ |\n| Weight | 1.0 kg |\n| Power | 7.5 volts from 5 AA batteries |\n| Control\
    \ board | Arduino (ATmega328P) with optional Raspberry Pi |\n| Form of locomotion\
    \ | Special walking |\n| Sensors | Support for Pi camera |\n| Website | www.robot.com\
    \ |\n\n## Programming the motors and servos are quite easy\n\nThe robot is unique\
    \ on this list, even compared to something like Hex. We were actually discussing\
    \ the difference in its design: it looks like a proper robot with a vacuum shell,\
    \ which is in a way not like the other inhabitants of this list. Connecting the\
    \ robot is quite simple; just the motors to turn as you assemble the arm around\
    \ the threads into its cavity and finally sorting or idling.\n\nWhile assembly\
    \ is mostly not written by any English speaker, the repetitions and illustrations\
    \ are easy enough to follow. Connecting the Pi is not as easy, but the connections\
    \ between the Arduino and the Pi could be made with the main points obvious about\
    \ the head.\n\nProgramming the motors and servos is quite easy, with a number\
    \ of preset commands enabling to create custom scripts for the robot to move and\
    \ its autonomy can be achieved using the Pi and its camera to detect motion or\
    \ specific objects, or to send commands to it wirelessly.\n\nWhile its the most\
    \ sophisticated robot on this test, there's nothing else that can properly work\
    \ on two legs or grip things. It's unique and useful for different tasks comparison\
    \ to the wheeled robots.\n\n## How it scored\n\n| Feature | Score |\n| :--- |\
    \ :--- |\n| Assembly | 4/5 |\n| Build quality | 5/5 |\n| Programmability | 3/5\
    \ |\n| Functionality | 2/5 |\n\n## CHALLENGE 5...\n\n### Robot golf\nIt's a dog-par-four\
    \ and swinging it at it\n\nIt's actually quite a tough challenge, with the robot\
    \ tasked to manoeuvre a small ball across a space to reach a goal. The goal is\
    \ mouse-ball size, meaning it needs to be pushed. While we could have gone a step\
    \ further and have well-placed swings of an arm and light golf club, the goal\
    \ was success, so the robot completed the challenge.\n\nWhile the robot has substantial,\
    \ it really has the ability to adapt to golf stances. Its arms are quite flexible,\
    \ so the way it has to do the golf stroke is very simple, yet effective. Not particularly\
    \ accurate though, but one could do better.\n\nYou'll need to excerpt the Arduino\
    \ to grab the control, using the script to set up movements for the robot - make\
    \ this manual. The script is quite specific, so use the RGB values of the ball\
    \ and the time that the action takes.\n\nIn our code, the robot can spin turn\
    \ (with the motors) left and right, and it has two pieces of club head 'unit'\
    \ of which it has changes to color, giving you time to put a 'golf club' in it.\
    \ Then it grips, it lifts and swings. Wait, it's getting better. The code is available\
    \ on GitHub, although you may have to work with your robot's calibrations.\n\n\
    ## Next step\n\nNext week, we're going to show you how to use the robot mounted\
    \ on Raspberry Pi to remotely control it. But what then? A Raspberry Pi camera\
    \ could make this thing possible: we would be able to add a camera to the front\
    \ and see where you're going as your home-made robot's built-in vision.\n\nYou\
    \ can pull out some surprisingly delicate maneuvers.\n\n## Get going\n\n## Code\
    \ listing\n\n```cpp\n// 10 Golf\n( 90, 90, 130, 180, 50, 90, 90, 90, 90, 100,\
    \ 150, 180), \n( 90, 90, 130, 180, 50, 90, 90, 90, 90, 100, 150, 180), \n( 90,\
    \ 90, 130, 180, 50, 90, 90, 90, 90, 250, 255, 0, 10), \n( 90, 90, 130, 180, 50,\
    \ 90, 90, 90, 90, 250, 255, 0, 10), \n( 90, 90, 130, 180, 50, 90, 90, 90, 90,\
    \ 100, 0, 25), \n( 90, 90, 130, 180, 50, 90, 90, 90, 90, 100, 0, 150), \n( 180,\
    \ 90, 130, 180, 50, 90, 90, 90, 90, 100, 150), \n( 90, 90, 130, 180, 50, 90, 90,\
    \ 90, 90, 150, 180))\n```\n\nbit.ly/1HKxbeb\n\n63 www.linuxuser.com\n"
  mdcn: "\n\n## Frindo\n低外形设计且配备大量正面传感器的圆饼型机器人\n\nFrindo 更多地被用作机器人平台，而不是一个独立的全功能机器人，但这并不意味着它只是一个可以用于构建的基础。开箱即用你就可以用它做很多事情，而且由于它支持\
    \ Arduino 和 Raspberry Pi，非常易于进行扩展。\n\n构造过程非常简单且快速，尽管在制作过程中你需要向电机焊接一些电线。这是 Frindo\
    \ 上唯一需要进行的焊接。然而，在此之外还需要一些额外的步骤，并非每个人都具备相应的设备。尽管如此，实际底盘的构造以及电机、电路板和少量组件的安装可以很快地完成。\n\
    \n一旦你用 Frindo 完成了一些操作，就可以在带有或不带自带 Arduino 的情况下向系统添加更多功能。可以使用为 Model B 预留的孔位（遗憾不是\
    \ B+）安装在电路板的反面。还有空间可以安装四个额外的轮子，前后之间的空间可以轻松做到无遮挡，从而实现 360 度覆盖。Uno 和 Pi 可以根据需要接入更多的输入和输出。\n\
    \n由于双控制器的存在，Frindo 可以使用 Python 和 Arduino IDE 进行编程。Arduino 使用标准库和命令，非常适合不熟悉 Python\
    \ 的人员。Python 程序使用串口库，该库使用了 Arduino 的术语，且网站上有一个很好的基础示例，可以帮助你准确理解传感器和电机如何以这种方式运行。\n\
    \nFrindo 是我们最易上手的机器人。非常简单、非常优秀，且非常适合学习，拥有丰富的机器人应用场景。\n\n## 技术规格\n\n| 特性 | 数值 |\n\
    | :--- | :--- |\n| 制造商 | Frindo |\n| 高度 | 85mm |\n| 宽度和深度 | 直径 160 mm |\n| 电源\
    \ | 6 节 AA 电池提供 9 伏 |\n| 控制板 | Arduino 和 Raspberry Pi |\n| 运动形式 | 轮子 |\n| 传感器\
    \ | 4 个红外接近距离传感器 |\n| 网站 | www.robotbits.com |\n\n> Above The Robot Shield 已作为开源版本捐赠给\
    \ Frindo 项目\n\n## 评分情况\n\n- 组装：4/5\n- 做工质量：4/5\n- 可编程性：4/5\n- 功能性：4/5\n\n## 挑战\
    \ 4...\n\n### 测距传感器\n\n你如何敢于走向赛道终点的那堵墙呢？\n\n这个挑战看起来相当简单：在撞击木墙之前直接开到它面前。距离越近，得分越高。使用你的测距传感器不触碰应该是应该是的，对吧？嗯，这并没有你想象的那么简单，而且测距传感器不太可能完全有效。一定有办法的。\n\
    \nFrindo 的传感器具有某种形式的距离传感功能，尽管并不完美。你还需要校准的另一件事是假设直线行驶时的程序运行速度和停止距离。Frindo 的电机可能不同步，这很可能会导致轻微的角度。使用前方传感器有多种方法，我们可以利用左右传感器来检测墙的边缘，并利用\
    \ Frindo 本身来实现完美的停止。\n\n在接下来的章节中，我们将定义什么构成 Frindo 的停止——可以通过反复尝试进行修改，以为你的解决方案获得更准确的结果。距离值并不对应于定义如何计算传感器读取值的某一个部分，以便在最后部分可以使用它们。如果它在路径上发现任何障碍，可以从\
    \ FileSilo 下载此脚本的后续代码。\n\n## 代码列表\n\n```cpp\nint frontTrigger = 200;\nint sideTrigger\
    \ = 100;\nint rearTrigger = 100;\n```\n\n```cpp\nint front_bump() {\n    if(bump\
    \ = analogRead(FrontBump) > frontTrigger) {\n        return 1;\n    } else {\n\
    \        return 0;\n    }\n}\n```\n\n```cpp\nvoid loop() {\n    Serial.print(\"\
    Here we go...\");\n    \n    while(!front_bump()) {\n        // 当没有碰撞时，继续向前移动\n\
    \        // Serial.begin(9600);\n        if(!left_bump() && !right_bump()) {\n\
    \            Serial.println(\"未检测到碰撞 - 向前移动\");\n            rs.forward(500);\n\
    \            // 以速度 200向前移动 50 ms\n            // 全速的 (200/255)\n        }\n \
    \       else if(left_bump() && right_bump()) {\n            Serial.println(\"\
    检测到左侧碰撞 - 角度错误\");\n            rs.rot_left(100);\n            // 以速度 200 向左转\
    \ 100 ms\n            // 全速的 (200/255)\n        }\n        else if(!left_bump()\
    \ && right_bump()) {\n            Serial.println(\"检测到右侧碰撞 - 角度错误\");\n      \
    \      rs.rot_right(100);\n            // 以速度 200 向右转 100 ms\n            // 全速的\
    \ (200/255)\n        }\n    }\n}\n```\n\n"
