    # # Host your own website


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_70_0.png)


    Hosts / Redirects DNS Hosting Domain Registration Mail SSL Certificates Monitoring
    Backup-DNS Remove / Activate


    # ## Add a host


    Fill out the following fields to configure your host. If you are new just Create
    Host to add your host


    +   - Add a host

    - Use a domain name that exists in DNS system. Usecheap for your domain name or
    renew it for more peace of mind.


    | Hostname | Type | Value |

    |---|---||

    | example.com | A Host (Round Robin) | MX Host (Priority) |

    | | | A Record | MX Record |


    Accept that for your domain Select Namecheap or Name.com for your name.


    # # You can upload files

    to /var/www/


    #  03 Check your pi server


    With Apache, open the browser on another computer on your network and find your
    Pi''s IP address to view the Apache index page.

    As things right, all you will be able to view the index page. But to add your
    own HTML and PHP pages, you will need FTP.


    #  04 Install FTP for uploading pages


    FTP software:

    cd /var/www then install the following vsftpd

    sudo chmod -R pi /var/www

    sudo apt-get install vsftpd

    You must make changes to Secure FTP Daemon, so it is running in now. first:


    ```

    # anonymous_enable=YES

    # anonymous_enable=NO

    ```


    Next, uncomment the following using the symbols:

    #local_enable=YES

    #write_enable=YES


    #  05 Restart the FTP Server


    Complete configuration of the FTP software by adding a command to the end of the
    file which will display files starting with `.` such as that:

    force_dot_files=YES

    sudo service vsftpd restart

    Save and exit. Using default credentials you can upload files to /var/www.


    #  06 Make Pi LAMP server


    By setting up LAMP, you can use the Pi to host a database-driven website or even
    WordPress which is best to using the device (as a development server).

    sudo apt-get install mysql-server mysql-client php

    The LAMP server is useful of course, but for the best results your site should
    remain reachable.


    #  07 Get your site online


    Can''t afford a static IP for your router? A solution is available with the free
    service from noip.com.

    This allows you to point a hostname to your computer by a client application that
    will remain in contact with the No-IP services.


    #  08 Install No-IP


    Make a new directory and switch to it:

    mkdir /home/pi

    cd /home/pi

    Download No-IP on your Pi:

    wget http://www.noip.com/client/linux.tar.gz

    Extract


    ```

    tar xvf no-ip-duc-linux.tar.gz

    navigate to the directory and use sudo make and sudo make install. Following any
    instructions. By running:

    sudo /usr/local/bin/noip2

    ```


    #  09 Change your password for security


    Before you use a live server, it''s an idea to change the default password to
    something more imaginative like ''raspberry''.

    In the terminal, enter password and then the prompts will ask you for secure,
    password. You''re doing this step because you obviously wouldn''t want your Pi
    web server to get hacked!


