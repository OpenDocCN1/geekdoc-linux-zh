    # NAS 存储盒


    ## 群晖 DS415+


    群晖新款的四盘位 SMB 设备能否安全地满足你整个办公室的备份和存储需求？


    群晖新款的 DS415+ 直接取代了两年前的 DS42+，它是群晖 Plus 系列中针对中小企业的入门级产品。与类似的四盘位设备相比，DS415+ 是显著升级，采用了四核
    Intel Atom 处理器 (2.0Ghz) 和 2GB DDR3 RAM。与之前的机型（均为双核并配备 1GB DDR3 RAM）以及面向家庭用户的 DS415play
    相比，DS415+ 的出现标志着群晖面向 SMB 的 NAS 设备迈出了大步，它是该系列中首款采用新一代 Intel Atom 芯片的设备。


    得益于这些额外的计算能力，硬件加密引擎成为可能。DS415+ 上的文件夹可以应用 256 位 AES 加密，这对写入性能的影响极小。使用单根千兆以太网线，加密文件和文件夹get约
    80/110MB/s 的上传/下载速度。但该设备并没有针对电缆故障的备份方案，而是因为设备的链路聚合（Link Aggregation）技术，该技术允许同时启用多个链路，而不会对
    DS415+ 228/232MB/s 的读写速度产生明显影响——事实上，尽管开启了加密，我们保留了千兆以太网布线。群晖 SMB 产品领域的这一巨大改进是……


    - 优点

    - 当共享文件夹和组在使用时，RAM 和 CPU 性能提升让你无后顾之忧。

    - DS415+ 即使在不支持视频转码的情况下也很快。


    - 缺点

    - 2GB RAM 对于重负载工作来说不够。


    84 www.linuxuser.com


    ## 群晖 DS415+

    这款 4 盘位 NAS 存储盒能服务你整个办公室吗？


    # 回评


    ## 技术规格


    | 特性 | 详情 |

    | :--- | :--- |

    | **操作系统** | DiskStation Manager 5.1 (基于 Linux 的专用系统) |

    | **处理器** | Intel Atom C2538 四核 2.4GHz |

    | **内存** | 2GB DDR3 |

    | **尺寸** | 204 x 165 x 233 mm |

    | **重量** | 2.6kg |

    | **硬盘盘位** | 4x 6TB 3.5"/2.5" HDD 或 2x SATA (8/SSD) SSD: 最大容量 24TB |

    | **网络** | 2x 千兆以太网 |

    | **扩展性** | 1x USB 2.0, 2x USB 3.0, 1x eATA |

    | **冷却** | 2x 92mm 扇扇, 20.2dba |

    | **价格** | $599 / £380 |


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_84_0.png)


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_84_1.png)


    左侧的双网网端口意味着你可以利用链路聚合获得更高的速度


    > 该 NAS 存储盒的另一个关键卖点是它不支持热插拔


    ## 同样需要考虑


    ……在 Synolocker 木马病毒的威胁之后表现非常好，而 DiskStation Manager 5.1 也收到了大量针对安全性的改进（包括自动更新）。


    该 NAS 存储盒的另一个关键卖点是它不支持热插拔。面板上的双盘位使得更换就像将它们放入侧锁外壳一样简单，但两个盘位中同时只有一个处于工作状态——DS415
    的冗余设计就在这种程度。群晖可能还希望在发生故障时确保零停机。由于内置冗余设计略显遗憾，群晖支持 RAID 1 (SHRA)，你可以看到这有助于保证 24/7
    运行。冗余可以由一个包含活动节点和一个或多个 NAS 盒的集群组成，通过更好的握手技术，使得当一台机器宕机时，另一台会立即接手。


    此外，可以下载软件包使 DS415 充当 NAS 或 VPN 服务器。在众名的群晖 DSM - Cloud Station 之上（它提供了 32 项高级功能的提供和编辑），以及从
    QuickConnect 到支持 FTP、SMB、WebDAV 等多种与 DS415 集成的方法，你在这里拥有一个极其可靠且多功能的存储解决方案。


    ## Gordon Thomas


    新的英特尔处理器是这里的关键升级，尽管在这台四核猛兽上运行 AES-256 加密的性能并不算出色。DSM 5.1 以及这种为中小企业设计的极其稳定的芯片非常简单。由于支持高达
    24TB 的存储，这是一项值得的投资。


    值得注意的是，该软件支持 VMware、Hyper-V 和 Citrix 虚拟化。


    ## 群晖 DS415


    如果你不是在寻找 SOHO 小型家庭/办公室 NAS，那么这种动力配置可能太适合非使用场景了。但如果你在寻找性能，这种配置可能并不合适。


