    \ faster\n\n![](img/7b0011b9ca05b82c33c02a484fd02e99_40_0.png)\n\n```bash\n$ host\
    \ -t ns linuxer.co.uk linode\n; connection timed out; rmBook:Downloads mtsouk$\n\
