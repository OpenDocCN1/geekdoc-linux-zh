    \ the defunct TrueCrypt\n\nTUTORIAL\n\n```bash\nnitish@nitish-Ubuntu:~$ \nnitish@nitish-Ubuntu:~$\
    \ sudo cryptsetup luksHeaderBackup /home/nitish/basefile -header-backup-file /home/nitish/09_Backup\n\
    nitish@nitish-Ubuntu:~$\n```\n\nIt took us several steps to reach this point and\
    \ if you are not well acquainted with it you might probably be confused about\
    \ the one-time steps (setup) and steps required for regular usage. Let's consider\
    \ a scenario: you followed all the steps perfectly and then you lose the computer.\
    \ When you start your computer, you are not able to find the mount device - where\
    \ did it go? Keep the LUKS container mounted after starting the system and unmounted\
    \ before you shut it down.\n\nMost of the data lost in a LUKS container are due\
    \ to the corruption of the LUKS header which can happen due to an accidental overwrite\
    \ on the header, complete accident hard disk failure is also a reality. Backup\
    \ is the only way to prevent such issues. Let's see the various backup options.\n\
    \nThere are other tips that can be useful while you are using dm-crypt. Let's\
    \ look at them here:\n\nFor the LUKS header, cryptsetup has an option called luksDump.\
    \ This lets you take a snapshot of the LUKS header for the device in use. A sample\
    \ command will look like following:\n\n```bash\nluksDump /home/nitish/basefile\n\
    ```\n\nTo backup the LUKS header, use the luksDump command. Note that the passphrase\
    \ entered is used for data encryption. It is very important to remember it and\
    \ keep it secure, as you will almost certainly lose all the data available in\
    \ the partition if you forget the passphrase.\n\n# Tutorial Linux Developer\n\n\
    ## Build games for Pebble\n\n## Sprites\n\nWe created custom artwork for the game.\
