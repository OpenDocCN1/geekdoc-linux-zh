    ## 使用你的树莓派进行无线打印


    通过将树莓派作为无线打印服务器，为旧打印机注入新生命


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_67_0.png)


    > 你需要什么

    - 最新版本的 Raspbian 镜像

    - USB 打印机

    - USB 无线网卡


    无线打印让向橱柜、棚屋和远程房间内的设备打印成为可能。它从根本改变了整个打印流程，并实现了智能手机、平板电脑、笔记本电脑和台式电脑的输出。但为了这项工作，你不需要一台崭新的打印机；旧打印机现在有了原生支持，不必沦进垃圾桶。


    ## 01 检查你的打印机运行正常


    在开始之前，检查你计划用于该项目的打印机仍然正常工作并且有足够的墨。最简单的方法是查看文档（如果可以的话在线查看）并运行测试打印。


    设置过程非常简单。你把树莓派连接到电脑上空闲的 USB 端口。在树莓派上安装 Samba 和 CUPS（通用 Unix 打印系统），剩下的只需从你的台式电脑连接无线打印机、安装驱动程序并开始打印。


    CUPS 为树莓派提供了一个基于浏览器的管理界面，可以从网络上的任何设备查看，从而实现对无线网络打印机的完全控制。


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_67_1.png)


    Christian Cawley

    自 2010 年以来的软件爱好者和工程师，他在线和杂志上为计算机和智能部件编写过文章


    ## # 无线打印


    ### 通过将默认用户‘pi’添加到打印机管理组开始配置


    ### 加入工作组


    完成这些添加后，在配置中搜索“workgroup”并添加你的工作组：


    ```

    workgroup = your_workgroup_name

    ```


    确保取消第二个设置的注释，这样 Windows 就能看到打印机了。保存更改并重启。


    ```

    sudo /etc/init.d/cups restart

    ```


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_68_0.png)


    ## 02 检测你的打印机


    当你的树莓派设置好且打印机已连接到 USB 端口后，输入：


    ```bash

    lsusb

    ```


    这将确认树莓派已检测到打印机。在大多数情况下，你会看到制造商和型号名称。


    ## 03 安装 CUPS


    安装 Samba 以启用整个网络的文件共享：


    ```bash

    sudo apt-get install cups

    ```


    创建服务器后，通过将默认用户‘pi’添加到打印机管理员开始配置。


    ```bash

    sudo apt-get install cupsadmin

    ```


    ## 04 设置打印机管理员


    安装 CUPS 打印机后，启动树莓派（GUI）或启动浏览器，输入 127.0.0.1:631。在这里地址并启用“Printers”（打印机）以及允许从任何地方访问管理权限。接下来，添加你的打印机并在提示时输入你的树莓派用户名和密码。


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_68_1.png)


    ## 05 添加你的打印机


    将显示打印机列表，选择你的进入下一个屏幕，在其中你可以确认详情、添加名称并勾选“Share Printer”（共享打印机）框。点击下一步查看打印机驱动列表，并为它们选择合适的。


    ## 06 为网络打印配置 Samba


    使用 Windows 打印？Samba 需要一些配置。在 nano 中打开 ''/etc/samba/smb.conf’，按 (Ctrl+W) 查找‘[printers]’并找到‘guest’，你应该添加以下内容：


    - guest = ok

    - 搜索 "[printer]",然后按如下更改路径：

    - path = /usr/share/cups/drivers


    ## 07 添加打印兼容性


    你还可以从 iPad AirPrint 系统打印。要实现这一点，你需要添加 Avahi Discovery。


    ```bash

    sudo apt-get install avahi-discover

    ```


    你的打印机现在可以从 iPad 或 iPhone 发现，并准备好打印了。


    ## 08 在网络上访问你的打印机


    同时，从 Linux、Mac OS 或类 Unix 系统访问 CUPS 会更容易。你只需要将打印机添加到网络，路径就会显示。


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_68_2.png)


    ## 在树莓派上托管你自己的网站


    不要为主机托管付费。配置你的树莓派作为 Web 服务器并托管中小型网站


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_69_0.png)


    需要一个轻量级、低成本的 Web 服务器吗？树莓派就是你需要的！无论你是计划托管一个静态首页（或使用极少数据库的）还是开发项目的方便家园，将树莓派设置为 Web
    服务器都异常地简单。


    得益于低功耗需求，树莓派是作为常开设备的理想选择，它可以放在路由器旁边随时待命。你可能希望托管你的某些项目，或者一个托管照片或简历的个人页面。


    如果你计划将其作为面向 Web 的设备，你的 Pi 需要一些基础配置。确保你的互联网路由器为你的用户提供静态 IP 地址非常重要。通常租用静态 IP 是收费的，但有一些你可以使用的服务（如
    noip.com）。


    ## 你需要


    - 最新树莓派镜像 (raspberrypi.org/downloads)

    - 互联网连接

    - 外部硬盘（可选）

    - USB 闪（可选）

    - 以太线


    ## 01 连接你的以太线

    对于这个项目，使用以太线更有意义。你可能需要使用 USB 端口连接闪存盘或外部硬盘来提供你的网页。使用以太网，你可以避免任何导致访问者中断的无线问题。


    ## 02 获取树莓派更新和 Apache

    一如既往，从检查树莓派更新开始：


    ```bash

    sudo apt-get update

    sudo apt-get install apache2 php libapache2-mod-php libapache2-mod-php

    最后，重启 apache2

    sudo apache restart

    ```


    你的树莓派现在已准备好作为 Web 服务器使用。


    ## 托管你自己的网站


    ### # 托管你自己的网站


    ![](img/7b0011b9ca05b82c33c02a484fd02e99_70_0.png)


    ### ## 添加主机


    | 主名 | 类型 | 值 |

    | :--- | :--- | :--- |

    | example.com | A (Round Robin) | |

    | | MX (Priority) | |

    | | | A Record |

    | | | MX Record |


    ### 你可以上传

    到 /var/www/


