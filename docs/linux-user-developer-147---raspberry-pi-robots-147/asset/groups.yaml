    # RasPi 杂志现已出版


    通过最新一期的 RasPi 杂志了解如何编写 BigTrack


    你知道吗？我们有一份专为树莓派制作的特殊数字杂志。RasPi 杂志可以在 Google Play 商店和 Tunews 上获取，本月，你可以了解到如何修改和编写你的
    BigTrack。在同一期杂志中，我们还提供了第二批所有机器人所需的免费资源，以及如何在 Pivaders 中编写动画和音效——这些内容也帮助我们创作了该期杂志。这是一本非常棒的读读物！


    BigTrack 对于任何超过 30 岁的“大孩子”来说都非常好玩，你将获得一个教程，教你如何通过树莓派和 PS3 控制器将其应用于你自己的空间项目中。不要在……弄坏你父母的古董玩具。


    # 极客 BigTrack


    上面的 Makeblock 是一种可以在 Raspberry Pi 上进行编程的 Arduino 机器人——查看我们的教程：bit.ly/1tdY87


    # 增强 Pi


    本专题的后半部分包含了另外五个优秀的配件，它们可以提升你使用 RasPi 的体验。这包括一些酷炫的技巧，例如获取廉价的附件、用于控制舵机的微型触摸屏，以及更多完全符合树莓派形状的配件。


    Arduino 通常非常适合控制舵机，因为它的设计初衷就是为了不同难度的控制。例如，某些机器人比其他机器人需要更多的控制。简单的答案是，并不真的。


    任何机器人都能由 Raspberry Pi 供电吗？这与之前相似，事实上Raspberry Pi 有很多选择，我们看到一些机器人帮助我们利用其原始出色的硬件来使用
    Pi。你面临的限制完全在于它在某些机器人上的处理能力。


    由于 GPIO 引脚数量有限，导致输出输出限制。我们确实有一些智能机器人可以使用，所以树莓派的限制并不低。


    那太方便了。


    为什么这是一个限制呢？


