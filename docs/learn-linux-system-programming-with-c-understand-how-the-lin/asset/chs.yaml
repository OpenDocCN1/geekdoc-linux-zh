  \n# 使用 C++ 和 Linux 进行编程\n由于其高效率、低层级访问能力和丰富的标准库，C++ 非常适合 Linux 系统编程。\n\n- **系统调用**：直接使用系统调用对系统资源进行细粒度控制。\n\
