  \ `hello` 的可执行文件并运行。\n\n#### 构建项目结构\n对于较大的项目，有效地组织代码至关重要。考虑以下结构：\n\nproject_name\n\
  ├── include\n│   └── my_header.h\n├── src\n│   └── main.cpp\n└── CMakeLists.txt\n\
