    - 检查变量：检查变量值。

    - 回溯：分析调用栈。


    基础用法：


    ```bash

    gdb ./my_executable

    ```


    一旦进入 `GDB`，你可以使用以下命令：


    - `run`: 启动程序。

    - `break main`: 在 `main` 函数的开始处设置断点。

    - `step`: 执行下一行代码。

    - `next`: 执行下一行，跳过函数调用。

    - `print variable`: 打印变量的值。

    - `backtrace`: 显示调用栈。

    - `quit`: 退出 `GDB`。


    示例：


    ```gdb

    (gdb) break main

    Breakpoint 1 at 0x400520: file main.cpp, line 5.

    (gdb) run

    Starting program: /path/to/my_executable

    Breakpoint 1 at 0x400520: file main.cpp, line 5.

    ```


