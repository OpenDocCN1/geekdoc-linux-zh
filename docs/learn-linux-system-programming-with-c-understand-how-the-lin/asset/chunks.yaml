    \ to a File\n\nThe `write` system call is used to write data to an open file.\n\
    \n```cpp\n#include <unistd.h>\n\nssize_t write(int fd, const void *buf, size_t\
    \ count);\n```\n\n- `fd`: The file descriptor of the open file.\n- `buf`: A pointer\
    \ to the buffer containing the data to be written.\n- `count`: The number of bytes\
    \ to write.\n\nThe `write` function returns the number of bytes actually written,\
    \ or -1 if an error occurs.\n\n### Closing a File\n\nThe `close` system call is\
    \ used to close an open file.\n\n```cpp\n#include <unistd.h>\n\nint close(int\
    \ fd);\n```\n"
