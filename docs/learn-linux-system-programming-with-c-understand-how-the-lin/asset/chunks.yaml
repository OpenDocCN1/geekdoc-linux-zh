- fmt: "\n```bash\n./client\n```\n\n# Enhancements and Considerations\n\n- **Concurrency**:\
    \ The server can be enhanced to handle multiple clients concurrently using threads\
    \ or asynchronous I/O.\n- **Error Handling**: Robust error handling should be\
    \ added to manage exceptions and errors more gracefully.\n- **Security**: Implement\
    \ encryption (e.g., `SSL/TLS`) to secure the communication between the client\
    \ and server.\n- **Protocol Design**: For more complex applications, a well-defined\
    \ communication protocol should be designed to handle different types of requests\
    \ and responses.\n- **Resource Management**: Implement resource management strategies\
    \ to handle client requests efficiently and prevent server overload.\n\nThe client-server\
    \ architecture is a fundamental model in network programming that enables efficient\
    \ resource sharing and communication between distributed applications. By implementing\
    \ a simple client-server application in C++ on a Linux system, we have demonstrated\
    \ the basic concepts and operations involved in this architecture. With further\
    \ enhancements, this architecture can be used to build robust and scalable networked\
    \ applications.\n\n## Network protocols (TCP, UDP)\n\n### Understanding TCP and\
    \ UDP in Linux System Programming with C++\n\n`TCP` (Transmission Control Protocol)\
    \ and `UDP` (User Datagram Protocol) are fundamental network protocols that form\
    \ the backbone of internet communication. While both are used for data transmission,\
    \ they differ significantly in their approach and guarantees. This article will\
    \ delve into the characteristics of both protocols, provide code examples in C++\
    \ using Linux system programming, and highlight their use cases.\n\n### TCP (Transmission\
    \ Control Protocol)\n\n`TCP` is a connection-oriented protocol, meaning it establishes\
    \ a reliable, ordered, and error-checked connection between two endpoints before\
    \ data transmission. This ensures data integrity and delivery.\n\n**Key Features:**\n\
    - **Connection-oriented**: Requires a handshake before data transfer.\n- **Reliable**:\
    \ Guarantees delivery of data, retransmits lost packets.\n- **Ordered**: Delivers\
    \ data in the same sequence as sent.\n- **Error-checked**: Detects and corrects\
    \ errors during transmission.\n- **Flow control**: Prevents data overload at the\
    \ receiver.\n- **Congestion control**: Manages network traffic to avoid congestion.\n\
    \n#### C++ Code Example (TCP Server):\n\n```cpp\n#include <iostream>\n#include\
    \ <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n#include <string.h>\n\
    #include <unistd.h>\n\nint main() {\n    int sockfd = socket(AF_INET, SOCK_STREAM,\
    \ 0);\n    if (sockfd < 0)\n        perror(\"socket\");\n        exit(1);\n  \
    \  }\n\n    struct sockaddr_in server_addr;\n    memset(&server_addr, 0, sizeof(server_addr));\n\
    \    server_addr.sin_family = AF_INET;\n    server_addr.sin_addr.s_addr = INADDR_ANY;\n\
    \    server_addr.sin_port = htons(8080); // Replace with desired port\n\n    if\
    \ (bind(sockfd, (struct sockaddr )&server_addr, sizeof(server_addr)) < 0) {\n\
    \        perror(\"bind\");\n        exit(1);\n    }\n\n    listen(sockfd, 5);\
    \ // Backlog of 5 pending connections\n\n    struct sockaddr_in client_addr;\n\
    \    socklen_t client_len = sizeof(client_addr);\n    int new_sockfd = accept(sockfd,\
    \ (struct sockaddr *)&client_addr, &client_len);\n    if (new_sockfd < 0) {\n\
    \        perror(\"accept\");\n        exit(1);\n    }\n\n    char buffer[1024];\n\
    \    int bytes_received = recv(new_sockfd, buffer, sizeof(buffer), 0);\n    if\
    \ (bytes_received < 0) {\n        perror(\"recv\");\n        exit(1);\n    }\n\
    \n    std::cout << \"Received: \" << buffer << std::endl;\n    // Send response\n\
    \    const char *response = \"Hello from server!\";\n    send(new_sockfd, response,\
    \ strlen(response), 0);\n    close(new_sockfd);\n    close(sockfd);\n    return\
    \ 0;\n}\n```\n\n#### C++ Code Example (TCP Client):\n\n```cpp\n#include <iostream>\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n#include\
    \ <string.h>\n#include <unistd.h>\n\nint main() {\n    int sockfd = socket(AF_INET,\
    \ SOCK_STREAM, 0);\n    if (sockfd < 0) {\n        perror(\"socket\");\n     \
    \   exit(1);\n    }\n\n    struct sockaddr_in server_addr;\n    memset(&server_addr,\
    \ 0, sizeof(server_addr));\n    server_addr.sin_family = AF_INET;\n    server_addr.sin_addr.s_addr\
    \ = inet_addr(\"127.0.0.1\"); // Replace with server IP\n    server_addr.sin_port\
    \ = htons(8080); // Replace with server port\n\n    if (connect(sockfd, (struct\
    \ sockaddr )&server_addr, sizeof(server_addr)) < 0) {\n        perror(\"connect\"\
    );\n        exit(1);\n    }\n\n    const char message = \"Hello from client!\"\
    ;\n    send(sockfd, message, strlen(message), 0);\n    char buffer[1024];\n  \
    \  int bytes_received = recv(sockfd, buffer, sizeof(buffer), 0);\n    if (bytes_received\
    \ < 0) {\n        perror(\"recv\");\n        exit(1);\n    }\n\n    std::cout\
    \ << \"Received: \" << buffer << std::endl;\n    close(sockfd);\n    return 0;\n\
    }\n```\n\n### UDP (User Datagram Protocol)\n\n`UDP` is a connectionless protocol,\
    \ meaning it doesn't establish a connection before sending data. It's faster but\
    \ less reliable than `TCP`.\n\n**Key Features:**\n- **Connectionless**: No handshake\
    \ required, datagrams sent independently.\n- **Unreliable**: No guarantee of delivery,\
    \ packets can be lost or reordered.\n- **Unordered**: Packets may arrive out of\
    \ sequence.\n- **No error checking**: Errors are not detected or corrected.\n\
    - **No flow control**: Can lead to packet loss if sender too fast.\n- **No congestion\
    \ control**: Does not manage network traffic.\n\n#### C++ Code Example (UDP Server):\n\
    \n```cpp\n#include <iostream>\n#include <sys/socket.h>\n#include <netinet/in.h>\n\
    #include <arpa/inet.h>\n#include <string.h>\n#include <unistd.h>\n\nint main()\
    \ {\n    int sockfd = socket(AF_INET, SOCK_DGRAM, 0);\n    if (sockfd < 0) {\n\
    \        perror(\"socket\");\n        exit(1);\n    }\n\n    struct sockaddr_in\
    \ server_addr;\n    memset(&server_addr, 0, sizeof(server_addr));\n    server_addr.sin_family\
    \ = AF_INET;\n    server_addr.sin_addr.s_addr = INADDR_ANY;\n    server_addr.sin_port\
    \ = htons(8080); // Replace with port\n    if (bind(sockfd, (struct sockaddr )&server_addr,\
    \ sizeof(server_addr)) < 0) {\n        perror(\"bind\");\n        exit(1);\n \
    \   }\n\n    struct sockaddr_in client_addr;\n    socklen_t client_len = sizeof(client_addr);\n\
    \    char buffer[1024];\n    int bytes_received = recvfrom(sockfd, buffer, sizeof(buffer),\
    \ 0, (struct sockaddr *)&client_addr, &client_len);\n    if (bytes_received <\
    \ 0) {\n        perror(\"recvfrom\");\n        exit(1);\n    }\n\n    std::cout\
    \ << \"Received: \" << buffer << std::endl;\n    // Send response\n    const char\
    \ response = \"Hello from server!\";\n    sendto(sockfd, response, strlen(response),\
    \ 0, (struct sockaddr *)&client_addr, client_len);\n    close(sockfd);\n    return\
    \ 0;\n}\n```\n\n#### C++ Code Example (UDP Client):\n\n```cpp\n#include <iostream>\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n#include <arpa/inet.h>\n#include\
    \ <string.h>\n#include <unistd.h>\n\nint main() {\n    int sockfd = socket(AF_INET,\
    \ SOCK_DGRAM, 0);\n    if (sockfd < 0) {\n        perror(\"socket\");\n      \
    \  exit(1);\n    }\n\n    struct sockaddr_in server_addr;\n    memset(&server_addr,\
    \ 0, sizeof(server_addr));\n    server_addr.sin_family = AF_INET;\n    server_addr.sin_addr.s_addr\
    \ = inet_addr(\"127.0.0.1\"); // Replace with server IP\n    server_addr.sin_port\
    \ = htons(8080); // Replace with server port\n\n    const char message = \"Hello\
    \ from client!\";\n    sendto(sockfd, message, strlen(message), 0, (struct sockaddr\
    \ *)&server_addr, sizeof(server_addr));\n\n    char buffer[1024];\n    int bytes_received\
    \ = recvfrom(sockfd, buffer, sizeof(buffer), 0, (struct sockaddr *)&server_addr,\
    \ sizeof(server_addr));\n    if (bytes_received < 0) {\n        perror(\"recvfrom\"\
    );\n        exit(1);\n    }\n\n    std::cout << \"Received: \" << buffer << std::endl;\n\
    \    close(sockfd);\n    return 0;\n}\n```\n\n### Choosing the Right Protocol\n\
    \nThe choice between `TCP` and `UDP` depends on the specific requirements:\n-\
    \ **Use TCP when**: Reliability is crucial (file transfer, email), Data integrity\
    \ is essential (financial transactions), Ordered delivery is required (streaming\
    \ audio video).\n- **Use UDP when**: Speed is a priority (real-time games, video\
    \ conferencing), Occasional packet loss is acceptable (live streaming), Low overhead\
    \ is required (DNS, DHCP).\n\n# Chapter 7: File system structure and operations\n\
    \n## Understanding the File System\n\nA file system is a method of organising\
    \ and storing data on a storage device. In Linux, it's a hierarchical structure,\
    \ where data is organised into directories and files. The root directory, `/`,\
    \ is the starting point.\n\nKey components of a Linux file system:\n- **Inodes**:\
    \ Contain metadata about a file, such as permissions, size, creation time, and\
    \ location of data blocks.\n- **Data blocks**: Store the actual file content.\n\
    - **Directory entries**: Link file names to their corresponding inodes.\n\n###\
    \ File System Operations in C++\n\nWe'll use C++ and system calls provided by\
    \ the `unistd.h` header file to interact with the system.\n\n- `open()` creates\
    \ or opens a file, returning a file descriptor.\n- `O_CREAT`, `O_WRONLY`, and\
    \ `O_RDONLY` are flags for creating, writing, and reading respectively.\n- `0644`\
    \ specifies file permissions.\n- `close()` closes the file.\n- `write()` writes\
    \ data to a file.\n- `read()` reads data from a file.\n- `stat()` retrieves file\
    \ attributes. `st_size` is the file size in bytes. `st_mode` contains file permissions.\n\
