    \n1. **创建套接**：服务器和客户端都使用 `socket()` 系统调用创建一个套接。该套接是通信的端点。\n2. **绑定（服务器）**：服务器使用\
    \ `bind()` 函数将套接绑定到 IP 地址和端口。这允许它在指定的端口监听传入的连接。\n3. **监听（服务器）**：服务器使用 `listen()`\
