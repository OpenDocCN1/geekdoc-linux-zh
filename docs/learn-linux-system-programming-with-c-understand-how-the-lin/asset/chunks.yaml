    # 进程通信


    进程可以通过多种机制进行通信，包括：


    - `Pipes`（管道）：单向通信通道。

    - `Named pipes`(命名管道）：命名管道允许无关进程之间进行通信。

    - `Message queues`(消息队列）：存储消息以供后检索。

    - `Shared memory`(共享内存）：进程间共享的内存区域。

    - `Sockets`套字）：进程间的网络通信。


    # 线程


    线程是进程内的轻量级执行单元。线程共享进程的地址空间、打开的文件和其他资源，但有自己的栈和程序计数器。创建线程的代价远小于创建进程。


    ## 线程创建

    在 C++ 中，线程创建通常使用 POSIX 线程 (`pthreads`) 库处理。使用 `pthread_create()` 函数创建新线程：


    ![](img/image_rsrc3CY.jpg)


    ## 线程同步

    由于线程共享进程的地址空间，同步对于防止竞态条件和数据损坏至关重要。常见的同步机制包括：


    - `Mutexes`（互斥锁）：保护共享数据的互斥锁。

    - `Condition variables`（条件变量）：允许线程等待特定条件的满足。

    - `Semaphores`（信号量）：通用的同步原语。


    # 线程与进程


    | 特性 | 进程 | 线程 |

    | :--- | :--- | :--- |

    | 资源共享 | 独立 | 共享 |

    | 创建开销 | 高 | 低 |

    | 上文切换 | 昂贵 | 低廉 |

    | 通信 | IPC 机制 | 共享内存、同步原语 |

    | 可扩展性 | 受进程数量限制 | 在多核系统上可以更好地扩展 |


    # 何时使用线程或进程


    - `Independent tasks`(独立任务)：如果任务是相互独立的且需要隔离，请使用进程。

    - `CPU-bound tasks`(CPU 密集型任务)：使用线程处理 CPU 密集型任务以利用多核优势。

    - `I/O-bound tasks`(I/O 密集型任务)：使用线程让 I/O 操作与计算并行。

    - `Shared data`(共享数据)：如果任务需要高效共享数据，请使用线程。

    - `Scalability`(可扩展性)：考虑在多核系统上获得更好的扩展性。


    理解进程和线程之间的差异对于在 Linux 中进行有效的并发编程至关重要。通过仔细考虑应用程序的特性，你可以选择合适的方法来优化性能和资源利用率。


    **注意**：虽然本文提供了基本概述，但线程和进程管理还涉及许多其他细微差别和考虑。适当同步和错误处理对于可靠的多线程应用程序至关重要。


    # 深入探讨：线程安全与死锁


    ## 线程安全

    线程安全是多线程编程中的关键概念。它确保代码可以被多个线程同时安全执行，而不会导致数据损坏或意外行为。


    线程安全的关键考虑因素：


    - `Shared mutable state`(共享可变状态)：如果多个线程访问并修改相同的数据，则同步是必不可少的。

    - `Reentrancy`(重入性)：函数应该是重入的，这意味着它们可以从多个线程安全地调用而互不干扰。

    - `Atomic operations`原子操作)：对简单的读写操作使用原子操作以避免同步开销。


    线程不安全的代码示例：


    ![](img/image_rsrc3CZ.jpg)


    这段代码不是线程安全的，因为多个线程可以并发访问并修改 `counter`，导致不可预测的结果。


    使用互斥锁使代码变得线程安全：


    ![](img/image_rsrc3D0.jpg)


    通过使用 `mutex`，我们确保一次只有一个线程可以访问 `counter`，从而防止竞态条件。


    ## 死锁

    死锁发生在两个或多个线程被阻塞时，每个线程都在等待另一个线程持有的资源。这会导致停滞。


    死锁发生的条件：


    - `Mutual exclusion`(互斥)：资源一次只由一个线程独占。

    - `Hold and wait`(持有并等待)：一个线程持有至少一个资源，并等待额外的资源。

    - `No preemption`(非抢夺)：资源不能从线程中强制夺取。

    - `Circular wait`(循环等待)：线程之间存在依赖链，每个线程都在等待链中下一个线程所持有的资源。


    防止死锁：


    - `Avoid nested locks`(避免嵌套锁)：按特定顺序获取锁。

    - `Use timeoutsASA 使用超时)：为资源获取设置超时，以避免无限等待。

    - `Deadlock detection and recovery`(死锁检测与恢复)：实现检测死锁并采取纠正措施的机制。


    死锁示例：


    ```cpp

    // 两个线程和两个互斥锁的代码

    ```


    如果两个线程都获取了一个互斥锁，然后尝试获取另一个，就会发生死锁。


    # 其他主题


    - `Thread pools`(线程池)：高效管理线程的创建和重用。

    - `Process groups`(进程组)：管理相关进程组。

    - `Signals`(信号)：处理异步事件。

    - `Inter-process communication (IPC) mechanisms`：管道、命名管道、消息队列、共享内存和套字的深度探索。


    ## 同步原语：互斥锁、信号量和条件变量


    在并发编程中，同步原语是管理共享资源和协调多个线程执行的重要工具。它们有助于防止竞态条件、死锁和其他并发相关问题。本节将深入探讨三种基本的同步原语：互斥锁、信号量和条件变量。


    ### 互斥锁 (Mutexes)

    互斥锁（mutual exclusion）是一种二值信号量，用于保护共享数据免受并发访问。它确保一次只有一个线程可以持有互斥锁，防止数据损坏。


    ![](img/image_rsrc3D1.jpg)


    - `pthread_mutex_init`：初始化互斥锁。

    - `pthread_mutex_lock`：获取互斥锁。如果互斥锁已被占用，线程将阻塞直到它变得可用。

    - `pthread_mutex_unlock`：释放互斥锁。

    - `pthread_mutex_destroy`：销毁互斥锁。


    ### 信号量 (Semaphores)

    信号量是一种通用的同步原语，用于计算可用资源的数量。它可以用于互斥（类似于互斥锁），也可以用于控制对有限资源的访问。


    ![](img/image_rsrc3D2.jpg)


    - `sem_init`：使用初始值初始化信号量。

    - `sem_wait`：减少信号量值。如果值变为负数，线程阻塞。

    - `sem_post`：增加信号量值。如果有阻塞的线程，其中一个将被解除阻塞。

    - `sem_destroy`：销毁信号量。


    ### 条件变量 (Condition Variables)

    条件变量用于信号共享条件的变化。线程可以在条件变量上等待，直到另一个另一个线程信号。它通常与互斥锁结合使用以保护共享条件。


    ![](img/image_rsrc3D3.jpg)


    - `pthread_cond_init`：初始化条件变量。

    - `pthread_cond_wait`：阻塞线程直到条件变量被信号。在调用 `pthread_cond_wait` 之前必须持有互斥锁。

    - `pthread_cond_signal`：通知等待条件变量的线程。

    - `pthread_cond_broadcast`：通知所有等待条件变量的线程。

    - `pthread_cond_destroy`：销毁条件变量。


    # 选择正确的原语


    同步原语的选择取决于问题的具体需求。


    - `Mutexes`：最适合保护共享数据免受并发访问。

    - `Semaphores`：适用于控制有限资源的访问或实现更复杂的同步场景。

    - `Condition variables`：适用于等待特定条件的发生，通常用于生产者-消费者模式。


