    # Condition Variables vs. Semaphores


    Both condition variables and semaphores can be used for synchronisation, but they
    have different purposes:


    - Semaphores: Primarily used for counting resources or acting as general-purpose
    synchronisation primitives.

    - Condition Variables: Specifically designed for waiting on conditions and often
    used in conjunction with `mutexes`.


    ## When to Use Condition Variables:


    - Waiting for a specific condition to occur

    - Producer-consumer patterns

    - Implementing more complex synchronisation scenarios


    ## Additional Considerations


    - Correctness: Ensure correct usage of condition variables to avoid deadlocks
    and other issues.

    - Performance: Consider the overhead of condition variable operations.

    - Error Handling: Handle errors gracefully, such as when a condition variable
    is signalled unexpectedly.


    By understanding condition variables, you can effectively implement complex synchronisation
    patterns and improve the responsiveness of your multi-threaded applications.


    # Chapter 6


    ## Sockets and Network APIs in Linux System Programming with C++


    Sockets are the fundamental building blocks of network communication. They provide
    an interface for applications to send and receive data over a network. In Linux,
    sockets are implemented using a set of system calls and data structures. This
    article will delve into the basics of socket programming in C++ on Linux, covering
    key concepts, code examples, and common network APIs.


    ## Understanding Sockets


    A socket is essentially an endpoint for communication between two processes. It''s
    characterised by three components:


    - Domain: Specifies the address family (e.g., `AF_INET` for IPv4, `AF_INET6` for
    IPv6).

    - Type: Defines the communication style (e.g., `SOCK_STREAM` for TCP, `SOCK_DGRAM`
    for UDP).

    - Protocol: Specifies the protocol to be used (usually 0 for TCP or UDP).


    ## Creating a Socket


    The `socket()` system call is used to create a socket. Here''s an example:


    ![](image_rsrc3DB.jpg)


    ## Binding a Socket


    Before a server can start listening for connections, it must bind its socket to
    a specific address and port. The `bind()` system call is used for this:


    ![](image_rsrc3DC.jpg)


    ## Listening for Connections (Server)


    A server puts its socket in a listening state using the `listen()` system call:


    ```cpp

    listen(sockfd, 5); // Backlog of 5 pending connections

    ```


    ## Accepting Connections (Server)


    When a client connects to the server, the server accepts the connection using
    the `accept()` system call:


    ![](image_rsrc3DD.jpg)


    ## Connecting to a Server (Client)


    A client connects to a server using the `connect()` system call:


    ![](image_rsrc3DE.jpg)


    ## Sending and Receiving Data


    Once a connection is established, data can be sent and received using the `send()`
    and `recv()` system calls, or their higher-level counterparts like `write()` and
    `read()`.


    ![](image_rsrc3DF.jpg)


    ## Closing Sockets


    When communication is complete, sockets should be closed using the `close()` system
    call:


    ```cpp

    close(sockfd);

    ```


    ## Network APIs


    Linux provides a rich set of network APIs beyond the basic socket functions. Some
    common ones include:


    - `gethostname()`: Gets the hostname of the local machine.

    - `gethostbyname()`: Resolves a hostname to an IP address.

    - `inet_addr()`: Converts a dotted-decimal IP address to a binary address.

    - `inet_ntoa()`: Converts a binary IP address to a dotted-decimal string.

    - `getsockopt()`: Retrieves socket options.

    - `setsockopt()`: Sets socket options.


    ## Additional Considerations


    - Error Handling: Proper error handling is crucial for robust network applications.

    - Non-blocking Sockets: For asynchronous operations, consider using non-blocking
    sockets with `select()` or `poll()`.

    - Socket Options: Explore socket options like `SO_REUSEADDR`, `SO_KEEPALIVE`,
    and others to fine-tune socket behaviour.

    - Security: Implement appropriate security measures to protect against network
    attacks.

    - High-Level Libraries: Consider using higher-level libraries like `Boost.Asio`
    for more complex network applications.


    Socket programming provides a powerful foundation for building network applications.
    By understanding the core concepts and using the provided code examples, you can
    effectively create clients and servers in C++ on Linux.


    Note: This article provides a basic overview. Network programming can be complex,
    and it''s essential to delve deeper into specific topics and consider advanced
    techniques for production-grade applications.


    ## UDP Sockets: A Deeper Dive


    UDP (User Datagram Protocol) is a connectionless protocol, meaning it doesn''t
    establish a reliable connection between endpoints before sending data. It''s often
    used for applications where speed and efficiency are prioritised over guaranteed
    delivery, such as real-time audio/video streaming, online gaming, and DNS.


    ![](image_rsrc3DG.jpg)


    ## Binding a UDP Socket


    Similar to TCP, a UDP socket can also be bound to a specific address and port:


    ![](image_rsrc3DH.jpg)


    ## Sending UDP Datagrams


    To send a UDP datagram, you use the `sendto()` function:


    ![](image_rsrc3DJ.jpg)


    ## Receiving UDP Datagrams


    To receive UDP datagrams, you use the `recvfrom()` function:


    ![](image_rsrc3DK.jpg)


    ## Key Differences Between UDP and TCP


    - Connection-oriented vs. Connectionless: TCP is connection-oriented, while UDP
    is connectionless.

    - Reliability: TCP guarantees delivery, ordering, and error checking, while UDP
    doesn''t.

    - Speed: UDP is generally faster than TCP due to its simpler protocol.

    - Error Handling: TCP handles errors automatically, while UDP requires application-level
    handling.

    - Header Overhead: UDP headers are smaller than TCP headers.


    ## Use Cases for UDP


    - Real-time applications: Online gaming, video conferencing

    - DNS: Domain Name System

    - Network discovery: DHCP, ARP

    - Streaming media: Live broadcasts


    ## Additional Considerations


    - Error Handling: Since UDP doesn''t guarantee delivery, you need to implement
    your error handling mechanisms.

    - Datagram Loss: Be prepared to handle lost datagrams in your application logic.

    - Datagram Order: UDP doesn''t guarantee datagram order, so you might need to
    reorder them if necessary.

    - Checksums: UDP includes a checksum for error detection, but it''s not guaranteed
    to catch all errors.


    ### Client-server architecture


    Client-server architecture is a distributed application structure that partitions
    tasks or workloads between service providers (servers) and service requesters
    (clients). This model is widely used in networking and internet applications.
    In this architecture, the client and server communicate over a network, with the
    server providing resources or services and the client requesting them.


    #### Overview of Client-Server Architecture


    The client-server model consists of:


    1. Client: A client is a software application or a computer that requests services
    or resources from a server. Clients initiate communication sessions with servers,
    which await incoming requests.

    2. Server: A server is a software program or a computer that provides services
    or resources to clients. It listens for requests from clients and responds to
    them.

    3. Network: The network connects clients and servers, allowing them to communicate
    and exchange data.


    #### Benefits of Client-Server Architecture


    - Centralised Resources: Servers manage resources centrally, making them easier
    to update and maintain.

    - Scalability: New clients can be added easily without affecting existing ones.

    - Security: Servers can enforce security policies to control access to resources.


    #### Challenges of Client-Server Architecture

