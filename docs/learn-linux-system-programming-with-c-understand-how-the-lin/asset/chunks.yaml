    # Signal Handling in Linux System Programming with C++


    ## Introduction to Signals


    Signals are asynchronous notifications sent to a process to indicate an event.
    They can be generated by the kernel, other processes, or even the process itself.
    Some common signals include:


    - `SIGINT`: Interrupt (typically generated by `Ctrl+C`)

    - `SIGTERM`: Termination request

    - `SIGKILL`: Kill process immediately

    - `SIGSEGV`: Segmentation fault

    - `SIGALRM`: Alarm clock


    ## Handling Signals with `signal()`


    The `signal()` function is the simplest way to handle signals. It takes two arguments:
    the signal number and a pointer to the signal handler function.


    ![](image_rsrc3C4.jpg)


    However, `signal()` has limitations:


    - It''s not thread-safe.

    - It can only install one handler per signal.

    - The behaviour of the `signal` after the handler returns is not always deterministic.


    ## Handling Signals with `sigaction()`


    The `sigaction()` function provides more control over signal handling:


    ![](image_rsrc3C5.jpg)


    The `sigaction` structure provides more options:


    - `sa_handler`: Pointer to the signal handler function.

    - `sa_mask`: A signal set specifying which signals should be blocked during the
    handler execution.

    - `sa_flags`: Additional flags, such as `SA_RESTART` to restart interrupted system
    calls.


    ## Signal Masks


    The `sigprocmask()` function can be used to block or unblock signals:


    ![](image_rsrc3C6.jpg)


    ## Pending Signals


    The `sigpending()` function can be used to check for pending signals:


    ![](image_rsrc3C7.jpg)


    ## Common Signal Handling Scenarios


    - Graceful Termination: Handle `SIGINT` and `SIGTERM` to perform cleanup actions
    before exiting.

    - Error Handling: Handle signals like `SIGSEGV` and `SIGABRT` to log errors and
    provide informative messages.

    - Timeouts: Use `SIGALRM` to implement timeouts for operations.

    - Inter-Process Communication: Signals can be used for simple communication between
    processes.


    ## Important Considerations


    - Signal handlers should be as short and simple as possible. Avoid complex operations
    within the handler.

    - Be aware of reentrancy issues. Signal handlers can be called at any time, even
    while your program is in critical sections.

    - Use `sigaction()` instead of `signal()` for more control and flexibility.

    - Consider using asynchronous signal safe functions within signal handlers.

    - Test your signal handling code thoroughly.


