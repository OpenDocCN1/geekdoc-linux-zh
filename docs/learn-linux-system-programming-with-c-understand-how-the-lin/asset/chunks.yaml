    access to system resources.


    ●        User Mode: The mode in which user applications run. Access to system
    resources is restricted.


    ● System Calls: The interface between user space and the kernel. They allow user
    programs to request kernel services.


    ●        Modules: Loadable kernel modules extend the kernel''s functionality without
    requiring a kernel rebuild.


    ● Kernel Data Structures: Complex data structures like linked lists, trees, and
