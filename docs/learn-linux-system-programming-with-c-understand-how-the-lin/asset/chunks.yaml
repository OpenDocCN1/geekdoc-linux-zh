    # Process Communication


    Process Processes can communicate through various mechanisms, including:


    - `Pipes`: Unidirectional communication channels.

    - `Named pipes`: Named pipes allow communication between unrelated processes.

    - `Message queues`: Store messages for later retrieval.

    - `Shared memory`: A region of memory shared between processes.

    - `Sockets`: Network communication between processes.


    # Threads


    A thread is a lightweight unit of execution within a process. Threads share the
    process''s address space, open files, and other resources, but have their own
    stack and program counter. Creating a thread is significantly less expensive than
    creating a process.


    ## Thread Creation

    In C++, thread creation is typically handled using the POSIX Threads (`pthreads`)
    library. The `pthread_create()` function is used to create a new thread:


    ![](image_rsrc3CY.jpg)


    ## Thread Synchronisation

    Since threads share the process''s address space, synchronisation is crucial to
    prevent race conditions and data corruption. Common synchronisation mechanisms
    include:


    - `Mutexes`: Mutual exclusion locks that protect shared data.

    - `Condition variables`: Allow threads to wait for specific conditions to be met.

    - `Semaphores`: General-purpose synchronisation primitives.


    # Threads vs. Processes


    | Feature | Process | Thread |

    | :--- | :--- | :--- |

    | Resource sharing | Independent | Shared |

    | Creation overhead | High | Low |

    | Context switching | Expensive | Cheap |

    | Communication | IPC mechanisms | Shared memory, synchronisation primitives |

    | Scalability | Limited by number of processes | Can scale better on multi-core
    systems |


    # When to Use Threads or Processes


    - `Independent tasks`: Use processes if tasks are independent and require isolation.

    - `CPU-bound tasks`: Use threads for CPU-bound tasks to take advantage of multiple
    cores.

    - `I/O-bound tasks`: Use threads to overlap I/O operations with computation.

    - `Shared data`: Use threads if tasks need to share data efficiently.

    - `Scalability`: Consider threads for better scalability on multi-core systems.


    Understanding the differences between processes and threads is essential for effective
    concurrent programming in Linux. By carefully considering the characteristics
    of your application, you can choose the appropriate approach to optimise performance
    and resource utilisation.


    **Note**: While this article provides a basic overview, there are many other nuances
    and considerations involved in thread and process management. Proper synchronisation
    and error handling are crucial for reliable multi-threaded applications.


    # Delving Deeper: Thread Safety and Deadlocks


    ## Thread Safety

    Thread safety is a critical concept in multi-threaded programming. It ensures
    that a piece of code can be safely executed by multiple threads simultaneously
    without causing data corruption or unexpected behaviour.


    Key considerations for thread safety:


    - `Shared mutable state`: If multiple threads access and modify the same data,
    synchronisation is essential.

    - `Reentrancy`: Functions should be reentrant, meaning they can be safely called
    from multiple threads without interfering with each other.

    - `Atomic operations`: Use atomic operations for simple read-write operations
    to avoid synchronisation overhead.


    Example of thread-unsafe code:


    ![](image_rsrc3CZ.jpg)


    This code is not thread-safe because multiple threads can access and modify `counter`
    concurrently, leading to unpredictable results.


    Making the code thread-safe using a mutex:


    ![](image_rsrc3D0.jpg)


    By using a `mutex`, we ensure that only one thread can access `counter` at a time,
    preventing race conditions.


    ## Deadlocks

    A deadlock occurs when two or more threads are blocked, each waiting for a resource
    held by another thread. This results in a standstill.


    Conditions for deadlock:


    - `Mutual exclusion`: Resources are held exclusively by one thread at a time.

    - `Hold and wait`: A thread holds at least one resource and is waiting for additional
    resources.

    - `No preemption`: Resources cannot be forcibly taken from a thread.

    - `Circular wait`: A chain of dependencies exists among threads, where each thread
    is waiting for a resource held by the next thread in the chain.


    Preventing deadlocks:


    - `Avoid nested locks`: Acquire locks in a specific order.

    - `Use timeouts`: Set timeouts for resource acquisition to avoid indefinite waiting.

    - `Deadlock detection and recovery`: Implement mechanisms to detect deadlocks
    and take corrective actions.


    Example of a deadlock:


    ```cpp

    // code with two threads and two mutexes

    ```


    If both threads acquire one mutex and then try to acquire the other, a deadlock
    can occur.


    # Additional Topics


    - `Thread pools`: Efficiently manage thread creation and reuse.

    - `Process groups`: Manage groups of related processes.

    - `Signals`: Handle asynchronous events.

    - `Inter-process communication (IPC) mechanisms`: In-depth exploration of pipes,
    named pipes, message queues, shared memory, and sockets.


    ## Synchronisation Primitives: Mutexes, Semaphores, and Condition Variables


    In concurrent programming, synchronisation primitives are essential tools for
    managing shared resources and coordinating the execution of multiple threads.
    They help prevent race conditions, deadlocks, and other concurrency-related issues.
    This section will delve into three fundamental synchronisation primitives: mutexes,
    semaphores, and condition variables.


    ### Mutexes

    A mutex (mutual exclusion) is a binary semaphore used to protect shared data from
    concurrent access. It ensures that only one thread can hold the mutex at a time,
    preventing data corruption.


    ![](image_rsrc3D1.jpg)


    - `pthread_mutex_init`: Initialises a mutex.

    - `pthread_mutex_lock`: Acquires the mutex. If the mutex is already held, the
    thread blocks until it becomes available.

    - `pthread_mutex_unlock`: Releases the mutex.

    - `pthread_mutex_destroy`: Destroys a mutex.


    ### Semaphores

    A semaphore is a generalised synchronisation primitive that counts the number
    of available resources. It can be used for both mutual exclusion (like a mutex)
    and controlling access to a limited number of resources.


    ![](image_rsrc3D2.jpg)


    - `sem_init`: Initialises a semaphore with a specified initial value.

    - `sem_wait`: Decrements the semaphore value. If the value becomes negative, the
    thread blocks.

    - `sem_post`: Increments the semaphore value. If there are blocked threads, one
    is unblocked.

    - `sem_destroy`: Destroys a semaphore.


    ### Condition Variables

    A condition variable is used to signal a change in a shared condition. Threads
    can wait on a condition variable until it is signalled by another thread. It''s
    often used in conjunction with a mutex to protect the shared condition.


    ![](image_rsrc3D3.jpg)


    - `pthread_cond_init`: Initialises a condition variable.

    - `pthread_cond_wait`: Blocks a thread until the condition variable is signalled.
    The mutex must be held before calling `pthread_cond_wait`.

    - `pthread_cond_signal`: Signals a thread waiting on the condition variable.

    - `pthread_cond_broadcast`: Signals all threads waiting on the condition variable.

    - `pthread_cond_destroy`: Destroys a condition variable.


    # Choosing the Right Primitive


    The choice of synchronisation primitive depends on the specific requirements of
    the problem.


    - `Mutexes`: Best for protecting shared data from concurrent access.

    - `Semaphores`: Suitable for controlling access to a limited number of resources
    or implementing more complex synchronisation scenarios.

    - `Condition variables`: Ideal for waiting for a specific condition to occur,
    often in producer-consumer patterns.


    ## Example: Producer-Consumer Problem

    The producer-consumer problem is a classic synchronisation problem that can be
    solved using condition variables and a mutex.


    ![](image_rsrc3D4.jpg)


