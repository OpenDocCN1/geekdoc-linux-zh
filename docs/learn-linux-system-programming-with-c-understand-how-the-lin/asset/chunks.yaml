    # 第 4 章


    ## 使用 C++ Linux 系统编程中的虚拟内存、分页与交换


    虚拟内存是现代操作系统（包括 Linux）中的一个基本概念。它在物理内存和运行在系统上的进程之间提供了一个抽象层。这种抽象允许进程能够感知到连续的地址空间，即使物理内存是碎片化的。分页和交换是实现虚拟内存的关键机制。


    ### 虚拟内存


    虚拟内存是一种允许进程访问比物理可用内存更多的内存的技术。这是通过将进程的地址空间划分为“页”，并在这些页未被活动使用时将其存储在磁盘上实现的。当进程需要访问当前不在物理内存中的页时，会发生页错误，操作系统会将所需的页从磁盘带入内存。


    虚拟内存的主要优势是：


    - 增加进程隔离性：进程无法直接访问彼此的内存。

    - 高效的内存利用：物理内存可以在多个进程之间共享。

    - 更大的地址空间：进程的地址空间可以比可用的物理内存大。


    ### 分页


    分页是一种内存管理方案，将虚拟地址空间划分为固定大小的块，称为“页”(pages)。物理内存也被划分为固定大小的块，称为“帧”(frames)。当进程被加载到内存时，它的页会被映射到物理帧。操作系统使用页表维护这种映射关系。


