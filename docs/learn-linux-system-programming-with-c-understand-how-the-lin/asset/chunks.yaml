    # Page table

    A page table is a data structure that stores the mapping between virtual pages
    and physical frames. Each entry in the page table contains the frame number where
    the corresponding page is located, as well as other information such as access
    permissions and page status.


    ![](image_rsrc3CE.jpg)


    # Swapping

    Swapping is a memory management technique that involves moving entire processes
    between main memory and secondary storage (usually a disk). When physical memory
    is full, the operating system selects a process to swap out to disk. Later, when
    the process needs to be executed again, it is swapped back into memory.


    Swapping is less efficient than paging because it involves moving entire processes,
    which can be time-consuming. However, it can be useful for systems with limited
    physical memory.


