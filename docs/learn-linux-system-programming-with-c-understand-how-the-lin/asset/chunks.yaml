    Fork


    The fork system call creates a new process, known as a child process, which is
    an exact copy of the parent process. The child process inherits the parent''s
    memory, open files, and other resources. However, they execute independently from
    each other.


    Here''s a simple example:


    ![](image_rsrc3BS.jpg)


    The fork function returns a value:


    ●        -1: If an error occurs.


    ●        0: In the child process.


    ●        PID of the child: In the parent process.


    Exec


    The exec family of functions replaces the current process image with a new one.
    This means the current process is terminated and replaced by a new process with
    a different executable.


    Here''s an example using execl:


    ![](image_rsrc3BT.jpg)


    There are several exec functions with different argument lists:


    ●        execl: Takes a fixed number of arguments.


    ●        execv: Takes an array of arguments.


    ●        execlp: Similar to execl but searches for the executable in the PATH
    environment variable.


    ●        execvp: Similar to execv but searches for the executable in the PATH
    environment variable.


    Wait


    The wait system call suspends the calling process until one of its child processes
    terminates. It returns the PID of the terminated child process.


    Here''s an example:


    ![](image_rsrc3BU.jpg)


    The waitpid function is a more flexible version of wait that allows you to specify
    which child process to wait for.


    Common Use Cases


    ●        Creating multiple processes to perform tasks concurrently.


    ●        Executing external programs.


    ●        Waiting for child processes to finish before continuing.


    ●        Managing process lifetimes and resources.


    Additional Considerations


    ●        Error handling is crucial when using fork, exec, and wait.


    ●        Be careful with file descriptors and memory management when creating
    child processes.


    ●        Use waitpid with appropriate flags to control the behaviour of the wait
    call.


    ●        Consider using signals for process communication and synchronisation.


    Beyond the Basics


    ●        Exploring the clone system calls for more fine-grained process creation.


    ●        Learn about process groups and sessions for managing process relationships.


    ●        Understand the concept of zombies and how to avoid them.


    ●        Investigate advanced process management techniques like IPC (Inter-Process
    Communication).


    By mastering these fundamental concepts, you can effectively create and manage
    processes in your Linux system programming projects.


    ### File I/O in Linux System Programming with C++


    File I/O is a fundamental operation in any system. It involves interacting with
    the file system to read from or write data to files. In Linux system programming,
    the primary functions for file I/O are open, read, write, and close.


    Opening a File


    The open system call is used to open a file. It returns a file descriptor, which
    is a non-negative integer used to refer to the open file.


    ![](image_rsrc3BV.jpg)


    pathname: The path to the file.


    flags: Specifies how the file should be opened. Common flags include:


    ●        O_RDONLY: Open for reading only.


    ●        O_WRONLY: Open for writing only.


    ●        O_RDWR: Open for both reading and writing.


    ●        O_CREAT: Create the file if it doesn''t exist.


    ●        O_TRUNC: Truncate the file to zero length if it exists.


    ●        O_APPEND: Append data to the end of the file.  


    mode: Used only if O_CREAT is specified. It specifies the permissions for the
    newly created file.


    Reading from a File


    The read system call is used to read data from an open file.


    C++


    #include <unistd.h>


    ssize_t read(int fd, void *buf, size_t count);


    ●        fd: The file descriptor of the open file.


    ●        buf: A pointer to the buffer where the data will be stored.


    ●        count: The maximum number of bytes to read.


    The read function returns the number of bytes actually read, or -1 if an error
    occurs.


    Writing to a File


    The write system call is used to write data to an open file.


    C++


    #include <unistd.h>


    ssize_t write(int fd, const void *buf, size_t count);


    ●        fd: The file descriptor of the open file.


    ●        buf: A pointer to the buffer containing the data to be written.


    ●        count: The number of bytes to write.


    The write function returns the number of bytes actually written, or -1 if an error
    occurs.


    Closing a File


    The close system call is used to close an open file.


