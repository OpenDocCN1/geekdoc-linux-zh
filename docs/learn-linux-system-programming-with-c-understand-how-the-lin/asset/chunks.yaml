    # Advanced File I/O in Linux System Programming


    ## File Permissions


    File permissions determine who can access a file and what they can do with it.
    They are set when a file is created using the mode argument in the `open` system
    call.


    ### C++


    ```cpp

    #include <sys/stat.h>


    // Example: Create a file with read, write, and execute permissions for owner,
    read and write for group, and read for others


    int fd = open("my_file", O_CREAT | O_WRONLY, S_IRUSR | S_IWUSR | S_IXUSR | S_IRGRP
    | S_IWGRP | S_IROTH);

    ```


    The `stat` system call can be used to retrieve file permissions and other information:


    ### C++


    ```cpp

    #include <sys/stat.h>


    struct stat st;


    if (stat("my_file", &st) == 0)

    // Check permissions using st.st_mode

    ```


    ## File Locking


    File locking prevents multiple processes from accessing a file simultaneously.
    It is essential for data integrity.


    ![](image_rsrc3BX.jpg)


    ## Buffered I/O


    The standard C library provides buffered I/O functions like `fopen`, `fread`,
    `fwrite`, and `fclose` for higher-level file operations. These functions use internal
    buffers to improve performance.


    ![](image_rsrc3BY.jpg)


    ## Low-Level I/O


    For more control over I/O operations, you can use low-level system calls like
    `read` and `write`. However, you''ll need to manage buffering yourself.


    ```cpp

    #include <unistd.h>


    int fd = open("my_file", O_RDONLY);


    char buffer[1024];


    ssize_t bytes_read = read(fd, buffer, sizeof(buffer));


    close(fd);

    ```


    ## File Descriptors and File Tables


    When a file is opened, the kernel creates a file descriptor, which is an index
    into a process-specific file table. The file table entry contains information
    about the open file, including a pointer to the inode, the file offset, and file
    status flags.


    ## I/O Redirection


    Standard input, output, and error can be redirected using the `dup` and `dup2`
    system calls.


    ```cpp

    #include <unistd.h>


    // Redirect standard output to a file


    int fd = open("output.txt", O_CREAT | O_WRONLY, 0644);


    dup2(fd, STDOUT_FILENO);


    close(fd);

    ```


    ## File System Operations


    Beyond basic I/O, you can perform various file system operations like:


    - Creating and deleting directories

    - Changing file ownership and permissions

    - Linking and unlinking files

    - Managing hard links and symbolic links


    These operations are typically performed using functions like `mkdir`, `rmdir`,
    `chown`, `chmod`, `link`, `unlink`, etc.


    ### Interprocess Communication (IPC): Pipes and Sockets in Linux System Programming
    with C++


    Interprocess communication (IPC) is a fundamental mechanism in operating systems
    that allows multiple processes to interact and exchange exchange data. This article
    delves into two primary IPC methods: pipes and sockets, focusing on their implementation
    in Linux system programming using C++.


    ### Pipes


    A pipe is a unidirectional communication channel that connects two processes.
    Data written to one end of the pipe can be read from the other end. Pipes are
    typically used for related processes, such as the output of one process becoming
    the input of another.


    #### Creating a Pipe


    The `pipe()` system call creates a pipe. It returns an array of two file descriptors:
    `fd[0]` for reading and `fd[1]` for writing.


    ![](image_rsrc3BZ.jpg)


    #### Using Pipes


    The `write()` and `read()` system calls are used to write and read data from the
    pipe, respectively.


    ![](image_rsrc3C0.jpg)


    ### Sockets


    Sockets provide a more flexible and general-purpose IPC mechanism. They can be
    used for communication between processes on the same machine or across a network.


    #### Creating a Socket


    The `socket()` system call creates a socket. The arguments specify the address
    family (e.g., `AF_INET` for IPv4), socket type (e.g., `SOCK_STREAM` for TCP),
    and protocol (usually 0).


    ![](image_rsrc3C1.jpg)


    #### Binding and Listening


    For server-side sockets, you need to bind the socket to an address and listen
    for incoming connections.


    ![](image_rsrc3C2.jpg)


    #### Connecting and Communicating


    For client-side sockets, you need to connect to a server and then send and receive
    data.


    ![](image_rsrc3C3.jpg)


    #### Additional Considerations


    - **Error Handling**: Always check the return values of system calls for errors.

    - **Synchronisation**: For concurrent access to shared resources, consider using
    synchronisation mechanisms like semaphores or mutexes.

    - **Efficiency**: Choose the appropriate IPC mechanism based on the specific requirements
    of your application.

    - **Security**: Be mindful of security implications, especially when using sockets
    for network communication.


    This article provides a basic overview of pipes and sockets in Linux system programming.
    For more advanced usage, refer to the Linux system programming documentation.


    # Let''s Dive Deeper into IPC: Pipes and Sockets


    ## Specific Use Cases


    Great choice! Let''s explore some specific use cases for pipes and sockets.


    ### Pipes


    - **Parent-Child Communication**: As we''ve seen, pipes are excellent for simple
    data transfer between related processes. Consider a scenario where a parent process
    generates data and sends it to a child process for further processing.

    - **Pipelines**: Multiple processes can be chained together using pipes to form
    a pipeline. Each process reads from its standard input (connected to the previous
    process''s output) and writes to its standard output (connected to the next process''s
    input). This is common in Unix-like systems for processing data in stages.

    - **File Redirection**: Pipes can be used to redirect standard input or output
    of a process. For example, `ls -l | grep "txt"` pipes the output of `ls -l` to
    `grep` to filter for files ending with ".txt".


    ### Sockets


    - **Network Applications**: Sockets are the foundation for most network applications,
    including web servers, clients, file transfer protocols (FTP), email (SMTP), and
    instant messaging.

    - **Inter-Process Communication (IPC) Across Machines**: While pipes are limited
    to processes on the same machine, sockets can facilitate communication between
    processes on different machines over a network.

    - **Client-Server Architecture**: Sockets are ideal for building client-server
    applications, where a server process listens for incoming connections and communicates
    with multiple clients.


    ## Advanced Topics and Considerations


    ### Pipe Limitations


    - **Unidirectional**: Data can only flow from the write end to the read end.

    - **Limited Buffering**: Pipes have a small internal buffer, which can cause blocking
    if the reading process is slower than the writing process.

    - **Related Processes**: Pipes are typically used for closely related processes.


    ### Socket Types


    - **TCP (Transmission Control Protocol)**: Reliable, connection-oriented, guaranteed
    delivery, ordered delivery, error checking.

    - **UDP (User Datagram Protocol)**: Unreliable, connectionless, no guaranteed
    delivery, no order, no error checking, faster than TCP.

    - Other socket types include raw sockets, UNIX domain sockets, etc.


