    Implementing cp


    The cp command copies files or directories. A simplified version:


    C++


    #include <iostream>


    #include <fcntl.h>


    #include <unistd.h>


    int main(int argc, char argv[])


    if (argc != 3)


    std::cerr << "Usage: cp source destination\n";


    return 1;


    }


    int src_fd = open(argv[1], O_RDONLY);


    if (src_fd == -1)


    perror("open source");


    return 1;


    }


    int dst_fd = open(argv[2], O_WRONLY | O_CREAT | O_TRUNC, 0644);


    if (dst_fd == -1)


    perror("open destination");


    return 1;


    }


    char buffer[4096];


    ssize_t bytes_read;


    while ((bytes_read = read(src_fd, buffer, sizeof(buffer))) > 0)


    if (write(dst_fd, buffer, bytes_read) != bytes_read)


    perror("write");


    return 1;


    }  


    close(src_fd);


    close(dst_fd);


    return 0;


    This is a basic copy implementation. A real cp would handle various file types
    (regular files, directories, special files),permissions, ownership, timestamps,
    and error conditions. It might also support recursive copying for directories.


