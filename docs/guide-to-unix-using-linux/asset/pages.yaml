  md: '# UNIX File Processing


    The command copies the file or files specified by the source path to the location
    specified by the destination path. You can copy files into another directory,
    with the copies keeping the same names as the originals. You can also copy files
    into another directory with the copies taking new names, or copy files into the
    same directory as the originals, with the copies taking new names.


    For example, assume Tom is in his home directory (/home/tom). In this he has the
    file reminder. Under his home directory he has another directory, duplicates (/home/tom/duplicates).
    He copies the reminder file to the duplicates directory with the following command:


    ```

    cp reminder duplicates

    ```


    After he executes the command, a file named reminder is in the duplicates directory.
    It is a duplicate of the reminder file in the /home/tom directory. Tom also has
    the class_of_78 in his home directory. He copies it to a file class-mates in the
    duplicates directory with the following command:


    ```

    cp class_of_78 duplicates/classmates

    ```


    After he executes the command, the file classmates is stored in the duplicates
    directory. Although it has a different name, it is a copy of the class_of_78 file.
    Tom also has a file named memo_to_boss in his home directory. He wants to make
    a copy of it and keep the copy in his home directory. He types the following command:


    ```

    cp memo_to_boss memo.safe

    ```


    After he executes the command, the file memo.safe is stored in Tom''s directory.
    It is a copy of his memo_to_boss file.


    You may specify multiple source files as arguments to the cp command. For example,
    Tom wants to copy the files project1, project2, and project3 to his duplicates
    directory. He types the following command:


    ```

    cp project1 project2 project3 duplicates

    ```


    After he executes the command, copies of the three files are stored in the duplicates
    directory. You may also use wildcard characters with the cp command. For example,
    Tom has a directory named designs under his home directory (/home/tom/designs).
    He wants to copy all files in the designs directory to the duplicates directory.
    He types the following command:


    ```

    cp designs/* duplicates

    ```


    After he executes this command, the duplicates directory contains a copy of every
    file in the designs directory.


    The cp command is especially useful for preventing data loss: you can use it to
    make back-up copies of your files. You can create three new files and then copy
    them to a different directory. Then you can duplicate one file and give it a different
    name. Start by creating the subdirectory source in your home directory. You can
    create three new files and then copy them to the source directory.'
  merge: -1
