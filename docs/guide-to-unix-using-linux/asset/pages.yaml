    # C++ Programming in a UNIX environment


    # Introducing C++ Programming


    C++ is a programming language developed by Bjarne Stroustrup at AT&T Bell Labs.
    It builds on the C language to add object-oriented capabilities. As a result,
    C++ is best learned after you have been programming in C for a while. With C++
    you can do “more with less” after you learn its nuances. Functions, the blocks
    of C programming, are incorporated in C++ with added dimensions such as function
    overloading, which makes the functions respond to more than one set of criteria
    and conditions.


    C and C++ share many similarities. For example, programs in both languages start
    with the main() function and call other functions that include blocks of instructions
    enclosed within curly braces. Both have similar source files. The C++ compiler
    accepts C language syntax and coding structures. For example, you can take the
    file encryption and decryption programs you created in Lesson A and fully compile
    them using the C++ compiler. Both languages fully support compiler directives
    as #include and #define. The C++ compiler''s name is CC for most UNIX versions
    and g++ for Linux versions.


    Note: One important distinction should be made about C++ programs. You can place
    variable declarations anywhere inside the program, before or after the instructions.
    This is not true of C programs, in which program variables must precede all the
    instructions.


    The major differences between the two languages become evident when you start
    using the C++ enhancements and class structures, which depart dramatically from
    standard C procedures. C follows procedural principles, while C++ primarily follows
    object-oriented programming principles while still allowing procedural programming
    methods. Procedural programming follows long-standing traditions that separate
    the data to be processed from the procedures that process. Procedural'
