  md: '# Introducing the UNIX Operating System


    UNIX is a multi-user, multitasking operating system with built-in networking functions.
    It can be used on systems functioning as:


    +   - Dedicated servers in a server-based network

    - Client workstations connected to a server-based network

    - Client/server workstations connected to a peer-to-peer network

    - Standalone workstations not connected to a network


    UNIX is a multi-user system, which lets many people simultaneously access and
    share the resources of a computer system. Users must log on by typing their name
    and a password before they are allowed to use a multi-user system. This validation
    procedure protects each user''s privacy and safeguards the system against unauthorized
    use. A multitasking system lets one user execute more than one program at a time.
    For example, on a multitasking system, you can update records in the foreground
    while your document prints in the background.


    UNIX is also a portable operating system. Its portability means it can be used
    in a variety of computing environments. In fact, UNIX runs on a wider variety
    of computers than any other operating system. It connects to the Internet, executing
    programs such as File Transfer Protocol (FTP), an Internet protocol for sending
    files; and Telnet, an Internet terminal emulation program. Dominion Consulting
    choosing UNIX as the OS for its computer system because many of its employees
    must work on a range of computers performing a variety of tasks at the same time.


    # A Brief History of UNIX


    A group of programmers at Bell Labs originally developed UNIX in the early 1970s.
    Bell Labs distributed UNIX in its source code, so anyone who used UNIX could customize
    it as needed. Affected by its portability and low cost, universities began modify
    the UNIX code to make it work on different machines. Eventually, two standard
    versions of UNIX evolved: AT&T produced System V and University of California
    at Berkeley developed BSD. Using features of both versions, Linux may be a more
    integrated version of UNIX than its predecessors. Currently, the POSIX project,
    a joint effort of experts from industry, academia, and government, is working
    to standardize UNIX.


    # UNIX Concepts


    UNIX pioneered concepts that have been applied to other operating systems. For
    example, Microsoft DOS and Microsoft Windows adopted original UNIX design concepts,
    such as the idea of a shell—an interface between the user and the operating system—and
    the hierarchical structure of directories and subdirectories.


    The concept of layered components that make up an operating system also originated
    with UNIX. Layers of software surround the computer system''s inner core to protect
    its vital hardware and software components and manage the core'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'system and its users. Figure 1-5 shows how the layers of a UNIX system form
    a pyramid structure.


    ![](img/6ed9bb33c68863516b7a954081187e3b_22_0.png)


    Figure 1-5: Layers of a UNIX system


    At the bottom of the pyramid is the hardware. At the top are the users. The layers
    provide insulation, assuring system security and user privacy. The kernel is the
    base operating system, which interacts directly with the language and services
    the user programs. It is only accessible through kernel mode, which is reserved
    for the system administrator. This prevents unauthorized commands from invading
    the foundation layer or the hardware that supports the entire UNIX structure.
    User mode provides access to higher layers where all application software resides.

    This layered approach, and all other UNIX features, were designed by programmers
    to use in complex software development. Because the programmers wrote UNIX in
    the C programming language, it can be installed on any computer that has a C compiler.
    Its portability, flexibility, and power make UNIX a logical choice for network
    operating systems. And, with the emergence of a new PC version called Linux, the
    popularity of UNIX is increasing.


    # Linux and UNIX


    Linux is a UNIX-like operating system. Linus Torvalds, who released it to the
    public, free of charge, in 1991, originally created Linux. A number of companies
    distribute professional versions of Linux.'
