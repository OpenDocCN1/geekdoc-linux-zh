  md: '# Defining and Evaluating Operators


    Use the equal sign (=) operator to set a value in a variable, as follows:

    NAME=Becky


    This example sets the NAME variable to the value Becky. The variable names that
    appear to the left and right of an operator are its operands. The name of the
    variable you are setting must appear to the left of the = operator. The value
    of the variable you are setting must appear to the right.


    Note: Notice there are no spaces between the = operator and its operands.


    +   To create a variable and assign it a value:

    - Type DOG=Poodle and press Enter.

    nYou created the variable DOG and set its value to Poodle.


    The echo command is used to display the contents of a variable.


    +   To see the contents of a variable:

    1. Type echo DOG and press Enter.

    You see the word "DOG."

    2. To see the contents of the DOG variable, you must precede the name of the variable
    with a $ operator. Type echo $DOG and press Enter.

    You see the word "Poodle."


    Enclose the value in double quotes ("") if it contains spaces. The next command
    is an example.


    +   To set a variable to a string of characters containing spaces:

    1. Type MEMO="Meeting will be at noon today" and press Enter.

    2. Type echo MEMO and press Enter.

    You see the contents of the MEMO variable: Meeting will be at noon today.


    You may also use single quotes. However, they suppress the evaluation of a variable
    like $HOME, whereas double quotes do not.'
