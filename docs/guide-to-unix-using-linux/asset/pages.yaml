    The Paste Command

    paste command combines files side by side, whereas the cat command combines end
    to end. When you paste to combine two files into a third file, the first line
    of the third file contains the first line of the first file followed by the first
    line of the second file. For example, Becky has the file vegetables in her home
    directory. Its contents are:


