  md: '# Shell Logic Structures


    The four basic logic structures needed for program development are sequential
    logic, decision logic, looping logic, and case logic.


    # Sequential Logic


    Sequential logic states that commands will be executed in the order in which they
    appear in the program. The only break in this sequence comes when a branch instruction
    changes the flow of execution. The following steps present a very simple example
    of a shell script using sequential logic. You create a simple shell script, seqtotal.


    To demonstrate sequential logic:


    +   1 Type vi seqtotal and press Enter.

    2 Type :i to switch to vi''s insert mode.

    3 Type the following lines:


    ```

    let a=1

    let b=2

    let c=3

    let total=a+b+c

    echo $total

    ```


    +   4 Press Esc to switch to vi''s command mode.

    5 Type :wq and press Enter to save the file and exit vi.

    6 Next, test the new shell script, seqtotal. (To save a few keystrokes, use the
    sh command instead of the chmod command.) Type sh seqtotal and press Enter.


    You see the output of the program, which is 6.


    Many programs are simple, straightforward command sequences. An example is the
    programmer activity report script you wrote in Chapter 5. The shell executes the
    script''s commands in the order they appear in the file. You use sequential logic
    to write this type of application.


    # Decision Logic


    Decision logic enables your program to execute a statement or series of statements
    only if a certain condition exists. The if statement is the primary decision-making
    control structure in this type of logic. In the steps that follow, notice the
    semi-colon (;) separates commands on the same line.'
  merge: -1
  pgno: 208
