  md: '# Syntax


    mount device-name mount-point


    +   Dissection

    - device-name identifies the partition (file system) to mount.

    - mount-point identifies the directory where you want to mount the file system.


    See "Using the mount Command" later in this chapter for more information about
    the mount command. UNIX must mount a file system before any programs can access
    files on file system. The root file system is accessible for reading only. After
    mounting, the root file system contains all essential programs for file repair,
    restoring from a backup, starting the system, and initializing all devices and
    operating resources. It also contains the information for mounting all other file
    systems. Nothing beyond these essentials should reside in the root partition.


    > You can restore a "crashed" root partition using rescue files stored on floppy
    disks or tape. The installation media that comes with Red Hat Linux can be used
    to rescue disks.


    The root directory itself generally contains subdirectories that contain files.
    The next sections describe the more frequently referenced subdirectories of the
    root file system.


    # The /bin Directory


    The /bin directory contains binaries, executables, the programs needed to start
    the system and perform other essential system tasks. This directory holds many
    programs that all users need to work with UNIX.


    # The /boot Directory


    The /boot directory normally contains the files that the bootstrap loader (the
    utility that starts the operating system) needs and the kernel (operating system)
    images.


    # The /dev Directory


    Files in /dev reference system devices. They access system devices and resources
    such as hard disks, the mouse, printers, consoles, modems, memory, floppy disks,
    and the CD-ROM drive. All UNIX versions include many device files in the /dev
    directory to accommodate separate vendor devices that can be attached to the computer.
    The device files are divided into two major classifications: block types and character
    types. The type indicates the method of data transmission on the device, either
    as a block of characters or as a flow of characters. You can see the list of device
    files by typing -l /dev after the command prompt. (See "Listing Directory Contents"
    later in this chapter for more information on the ls command.) The leftmost character
    on the list tells you whether the file is a character device (c) or a block device
    (b) as shown in Figure 2-3.


