  md: '# chapter 10, lesson A


    The operators behave differently depending on which form is used. Assume the variable
    j is set to 4. In this statement,


    ```

    x = j++;

    ```


    the ++ operator is used in postfix form. This means the assignment operator (=)
    uses the value of j before it is incremented. In effect, it says "set x equal
    to j, increment j." After the operation, x will be equal to 4 and j will be equal
    to 5.


    If the prefix form of the operator is used, you will get results:


    ```

    x = ++j;

    ```


    This statement says "increment j, then set x equal to j." Both x and j will be
    equal to 5 after the statement executes.


    # Generating Formatted Output with printf


    One of the most used screen output library functions is printf. The f stands for
    "formatted," as the function allows you to format and print several arguments
    of differing data types. The printf function is used in the following manner:


    ```

    printf(control string, expression, expression,...)

    ```


    The first argument is called the control string. It specifies the way formatting
    should occur. Following the control string may be a variable number of arguments.
    Each of these will be an expression whose value is to be printed. Here is perhaps
    the simplest example of a printf statement:


    ```

    printf("Hello");

    ```


    The example only uses a control string. The word Hello will be printed as on the
    screen. Here is another example.


    ```

    printf("Your age is %d", 30);

    ```


    The %d that appears in the control string is called a format specifier. It will
    not be printed as part of the message, but tells printf to substitute a decimal
    integer in its place. The decimal integer is the very next argument, the number
    30. This printf statement prints the following message on the screen:


    Your age is 30


    Although this example illustrates the usage of the %d format specifier, it is
    not very realistic. You are more likely to use it in the following manner:


    ```

    printf("Your age is %d", age);

    ```'
