- img_proc: true
  md: '# chapter 4, lesson B


    The parts of the awk command you typed in Step 1:


    +   * **awk -F:** calls the Awk program and identifies the field separator as
    a colon.

    * **''print "-%28s %$s", $1, $2''** represents the action to take on each line
    that is read in. Single quotes enclosed the action.

    * **print** is a print formatting function from the C language. It lets you specify
    an edit pattern for the output. The code inside the double quotes defines this
    pattern. The code immediately following the % tells how to align the field to
    be printed. The - sign signifies left alignment. The number that, 28 indicates
    how many characters you want to display. The trailing s means that the field consists
    of non-numeric characters, also called a "string." The \ inserts a tab character
    into the edit pattern. The %s specifies that another string field will be printed.
    You do not need to specify the string length in this case, because it will be
    the last field printed (the product name). The \n specifies to skip a line after
    printing each output record. The $1 and $2 separated with a comma indicates that
    the first and second fields in the input file should be placed in the edit pattern
    where the two s''s appear. The first field is the vendor name, and the second
    is the product description.

    * **vreport** is the name of the input file.


