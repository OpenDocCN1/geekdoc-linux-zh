  md: '# Using the Select Commands


    You used the head and tail commands in Chapter 1, and the cut command in Chapter
    4. Now you can work with the grep, diff, uniq, comm, and wc commands, which also
    let you process files.


    Note: The command usage in this chapter demonstrates how commands generally work.
