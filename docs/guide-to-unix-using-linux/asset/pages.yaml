    # Formatting Record Output


    To format record output, use the translate utility. The **translate utility (tr)**,
    as you will recall from Chapter 5, changes the standard input (characters you
    type at the keyboard) character by character. The standard input can also be redirected
    with the < operator to come from a file rather than the keyboard. For example,
    the following command senses the contents of the counters file as input to the
    tr command. It converts lowercase characters to uppercase.


    ```

    tr [a-z] [A-Z] < counters

    ```'
