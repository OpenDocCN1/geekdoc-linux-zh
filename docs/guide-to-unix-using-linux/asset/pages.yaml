    Figure 7-32: Results of revised datenow function


    The exercises you just completed demonstrate how functions work in general. Typing
    functions at the command line is hardly productive, because they must be re-entered
    each time you log on. You will now learn how to use shell functions to reuse code
    and to make functions available each time you log in.


    # ## Reusing Code


    To improve your programming productivity, you should learn to reuse your code.
    This means that the functions and programs you develop should be shared with other
    programs and functions as much as possible, thereby helping to prevent duplications,
    save time, and reduce errors. A good illustration of this potential use of reusable
    functions can be demonstrated in the current phone program. You can create several
    different sort functions and store them in memory. The first script can then call
    these functions to display the list of phone numbers, sorted in a variety of ways.


    You can place multiple functions inside a shell script such as .myfunctions and
    execute them from your .bash_profile login script or simply run .myfunctions from
    the command line. This loads all your functions into memory just as you load environment
    variables.'
