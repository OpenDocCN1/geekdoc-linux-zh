    # Recursively Removing Directories


    The rm command normally requires that a directory be empty before you can remove
    it. This can be inconvenient when you need to remove a directory that has several
    subdirectories under it. The -r option, however, tells the rm command to remove
    a directory and everything it contains, including subdirectories. It removes subdirectories
    of subdirectories. This operation is known as recursive removal.


    Recursively remove a directory with several subdirectories:


    +   1 Create a directory with several subdirectories. Type mkdir company/sales
    and press Enter. Type mkdir company/marketing and press Enter. Type mkdir company/accounting
    and press Enter.


    +   2 Create empty files in the company directory. Type touch company/file1 company/file2
    company/file3 and press Enter.


    +   3 Copy the files to the other directories. Type cp company/file1 company/file2
    company/file3 company/sales and press Enter. Type cp company/file1 company/file3
    company/marketing and press Enter. Type cp company/file1 company/file2 company/file3
    company/accounting and press Enter. (HINT: The three commands you just typed are
    very similar. You can reduce your typing by using the Up arrow to recall the first
    command.)


    +   4 Use the ls command to verify that the files were copied into all three directories.'
