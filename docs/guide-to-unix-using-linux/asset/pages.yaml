  md: 'The staff and management at Dominion Consulting are delighted to know how to
    customize their X Window system environment and add programs to the panel and
    Main menu. Executing frequently used applications from menu entries or icons is
    usually faster than using commands. It also eliminates typing errors, such as
    misspelling a command or program name. These benefits will certainly increase
    productivity and make the staff''s daily work easier.


    # SUMMARY


    +   - The File Manager is a graphical application for managing your directories
    and files for navigating the file system.

    - In addition to the File Manager, the X Window system has several other built-in
    applications. Examples are a calendar program, a spreadsheet, and an editor.

    - You can copy text from one window and paste it into another.

    - You can customize the background of your display with a color or with a graphic
    image known as wallpaper.

    - You may choose from a number of screen savers, which activate when there has
    been no keyboard or mouse activity after a specified period of time. The screen
    saver may be password protected, requiring the user to enter his or her password
    to deactivate it.

    - You can customize the panel by adding and moving apple icons. You can even add
    icons that launch your own programs.

    - You can customize the Main menu by adding entries that execute your own programs.


    # COMMAND SUMMARY


    | Chapter 11 commands | |

    |---|---|

    | Command | Purpose | Options covered in this chapter |

    | shutdown | Shuts the system down | -r specifies that the system should shut
    down, then restart |

    | startx | Starts the X Window System | | |'
