    **Table 10-4:** C arithmetic operators


    You can use these operators to create regular math expressions, as in the following
    examples:

    x = y + 3;

    num = num * 3;

    days = months * 30;


    These examples introduce the assignment operator (the equal sign). It works by
    assigning the value of the expression on its right to the variable whose name
    is on its left. In the example days = months * 30, the value in the variable months
    is multiplied by 30 and the product is stored in the variable days.


    **Increment and Decrement Operators** The last two operators shown in Table 10-4
    are the increment (++) and decrement (--) operators. These are unary operators,
    meaning they work with one operand. The following example shows the variable count
    increment:


    count++;


    Likewise, this variable can be decremented by the following statement:


    count--;


    The first two examples of the count variable show these operators in their post-fix
    form, which means they come after the variable. You can also use them as prefix
    operators:


    ++ count;


    -- count;'
