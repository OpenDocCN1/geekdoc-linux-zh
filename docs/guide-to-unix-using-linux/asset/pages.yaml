  md: '# chapter 2, lesson A


    # # /sbin Directory


    /sbin directory is reserved for the system administrator. Programs that start
    the system, programs needed for file system repair, and essential network programs
    are stored here.


    # ## /tmp Directory


    Many programs need a temporary place to store data during processing cycles. The
    traditional location for these files is the /tmp directory.


    # ## /var Directory


    /var directory holds subdirectories whose sizes often change. These subdirectories
    contain files such as error logs and other system performance logs that are useful
    to the system administrator. The /var/spool/mail subdirectory contains mail from
    the network, which remains until you read and delete it.


    # ## Using the mount Command


    As learned, UNIX uses the mount command to connect the file system partitions
    to the directory tree when the system starts. Users can access virtually any file
    system that has been mounted and to which they have been granted permission. Additional
    file systems can be mounted at any time using the mount command. The floppy disk
    and CD-ROM drive are file system devices beyond the hard disk that are most commonly.


    > To ensure security on the system, the root user can normally use the mount command.
    Ordinary users can sometimes mount and unmount file systems located on floppy
    disks and CDs.


    Suppose you want to access files on a CD for the Dominion Consulting database.
    The system administrator mounts a CD-ROM by inserting a disk in the drive and
    uses the following command:


    ```

    mount -t iso9660 -r /dev/cdrom /mnt/cdrom

    ```


    This command mounts the CD on a device called "cdrom" located in the /dev directory.
    The actual mount point in UNIX is /mnt/cdrom, a directory that references the
    CD-ROM device. Once the CD is mounted, you can access its files through the /mnt/cdrom
    directory. UNIX supports several different types of files. The type of file system
    is specified with the -t option. CD-ROMs are classified as iso9660 devices, so
    the system administrator types -t, followed by the argument iso9660. -r indicates
    that the CD-ROM device is read-only.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Exploring the UNIX File System


    You also want to store back-up files on a floppy disk. The system administrator
    mounts a floppy disk in the floppy drive using the command:

    mount /dev/fd0 /mnt/floppy`


    This command mounts the floppy in the first floppy drive, which is the device
    /dev/fd0, to the mount point, /mnt/floppy, in the UNIX file structure. Any files
    stored in the directory /mnt/floppy are written to the floppy.


    After accessing manually mounted file systems, the system administrator unmounts
    them using the umount command before removing the storage media, as in these examples:


    +   - umount /mnt/floppy

    - umount /mnt/cdrom


    See Appendix B, "The UNIX Command Syntax Guide to the Linux Shell and Utility
    Programs," for a brief description of the mount and unmount commands.


    # Understanding Paths and Pathnames


    As you learned, all UNIX files are stored in directories in the file system, starting
    from the root directory. To specify a file or directory, use its pathname, which
    follows the branches of the file system to the desired file. A forward slash (/)
    separates each directory. For example, suppose you want to specify the location
    of the file phones.502. You know that it resides in the source directory, in Jean''s
    home directory, illustrated in Figure 2-1. You can specify this file''s location
    as /home/jean/source/phones.502.


    # Using Your Command-line Prompt


    The UNIX prompt may indicate your location within the file system. For example,
    the prompt jean@eli jean]$ is probably the default prompt that the system generated
    when the system administrator created the login account. The prompt jean@eli jean$
    means that "jean" is the user operating on the host machine called "eli" in her
    home directory, which bears her user name, "jean." In other words, "jean is at
    eli her home directory." When Jean changes her location to /home/jean/source,
    her prompt looks like:


    ```

    [jean@eli source]

    ```


    When the system is initially installed, the default root prompt looks like this:

    [root@spirit /root]#. To simplify the meaning of the command prompts in this book,
    the steps use $ to represent the ordinary user''s command prompt and # to represent
    the system administrator''s command prompt.


