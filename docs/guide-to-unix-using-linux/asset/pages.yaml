  md: '# LESSON A objectives


    In this lesson you will:


    +   - Describe the X Window system and its client/server model

    - Understand the role of the Window Manager

    - Start the X Window system

    - Navigate within the X Window system and use its components


    # Starting and Navigating an X Window Session


    # What Is the X Window System?


    The X Window system is a graphical user interface (GUI) that runs on Linux and
    many UNIX operating systems. Like Windows and the Macintosh systems, it provides
    an easy-to-use, graphical method of operating the computer. Programmers may also
    develop applications that run on the X Window system and support GUI components,
    such as windows, dialog boxes, buttons, and pull-down menus. Figure 11-1 shows
    a typical X Window screen.


    The X Window system was originally developed at the Massachusetts Institute of
    Technology (MIT). It was created so different brands of hardware, running different
    variations of UNIX, would look and feel the same to the user. It was also designed
    to run applications across a network consisting of different types of computers.
    The system developed at MIT, currently in its eleventh version, is appropriately
    called X11. XFree86 is a version of X11 that was ported to the PC and runs on
    Linux.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# The X Window System


    ![](img/6ed9bb33c68863516b7a954081187e3b_434_0.png)


    Figure 11-1: Typical X Window screen


    # X Window Clients and Servers


    Although you can easily use the X Window system to run programs stored on your
    local computer, you can also run applications over a network. X Window uses a
    client/server model where a program can run on one computer but display its output
    on another. For example, suppose you have a network with two computers: system
    A and system B. The user on system A can invoke and run a program that resides
    on system B. Although the user of system A sees the program running in a window
    on his or her computer, it actually be executing on system B. This interaction
    is transparent to the user of system A, who may not know the program is actually
    running on a different computer. Additionally, systems A and B can be different
    types of computers, each running a different variation of UNIX.


    In X network terminology, the desktop that the user runs a program from is called
    the X server. The system that hosts and executes the program is called the X client.


    Note: In network terminology, the server is the system that hosts a program, and
    the client is the system run by the user. In X Window jargon, the terms client
    and server mean the opposite. The terms are reversed because the X server (on
    the desktop) performs operations requested by the client (on the host system).
    For example, the client might request that the server display a window or ask
    the server to move a window to a different position on the screen.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# Window Managers


    Like the UNIX operating system itself, the X Window system is layered and built
    from components. At the top layer is the Window Manager. The Window Manager controls
    how windows appear and how users control them. In many regards, the Window Manager
    is to the X Window system as the shell is to UNIX: each provides the user an interface
    to the underlying components.


    Many Window Managers have been developed, and most of them are available for free.
    Linux supports over 50 different ones. Table 11-1 lists some common Window Managers
    currently in use.


    | Window Manager | Description |

    |---|---|n| AnotherLevel | Based on the fwm Window Manager and commonly used with
    Red Hat Linux |

    | CDE | Common Desktop Environment |

    | Enlightenment | Popular Window Manager sometimes called E. Also commonly used
    with Red Hat Linux |

    | fwm | Virtual Window Manager |

    | fwm95 | Version of fwm with a Windows 95 look and feel |

    | kwm | Windows manager used by KDE |

    | olwm | Open Look Window Manager |

    | mwm | Motif Window Manager |

    | twm | Tab Window Manager or Tom''s Window Manager |


    Table 11-1: Common Window Managers


    # Using GNOME


    The GNU Network Object Model Environment (GNOME), a product of the GNU project,
    is not a Window Manager, but a desktop environment that must be used along with
    a Window Manager. By default, Red Hat 6 installs the Enlightenment Window Manager
    with GNOME (pronounced "guh-nome"). All examples in this chapter use Enlightenment
    and GNOME.


    > Note: The GNU project is an organization with the stated purpose of developing
    a free, UNIX-like, operating system named GNU. The Linux kernel is used in many
    GNU distributions. The project''s Web site is www.gnu.org.'
  merge: -1
