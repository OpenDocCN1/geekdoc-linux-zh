- img_proc: true
  md: '# LESSON A objectives


    After studying this lesson, you should be able to:


    +   - Describe an ASCII text file

    - Explain why operating system editors use ASCII files

    - Create and edit simple documents using the vi


    # The vi Editor


    This chapter introduces two UNIX editors. An editor is a program for creating
    and modifying computer documents as programs and data files. Files may contain
    notes, memos, or program source code, for example. A text editor is like a simplified
    word processor; you can use a text editor to create and edit documents, but you
    cannot format them using boldfaced centered text or other features. All operating
    systems have a standard editor; many include alternate editors. In UNIX, the standard
    editor is the vi and the most popular alternate is the Emacs editor.


    # Understanding UNIX Files


    Almost everything you create in UNIX is stored in a file. All information stored
    in files is in the form of binary digits. A binary digit, called bit for consists
    of two numbers, 0 and 1. Because the computer uses electronic circuits that are
    either in "on" or "off" state, binary numbers are perfectly suited to report these
    states. The exclusive use of 0s (which mean "off") and 1s (which mean "on") as
    a way to communicate with the computer is known as machine language. The earliest
    programmers had to write their programs using machine language, a tedious and
    time-consuming process.


    # ASCII Text Files


    To make information stored in files accessible, computer designers established
    a standard method for translating binary numbers into plain English. This standard
    used a string of eight binary numbers, called a byte, which is an acronym for
    “binary term.” A byte can be configured into fixed patterns of bits, and these
    patterns can be interpreted as an alphabetic character, decimal number, punctuation
    mark, or a special character, such as &, or @. Each byte, or code, has been standardized
    to a set of bit patterns known as ASCII codes. ASCII stands for the American Standard
    for Information Interchange. Computer files containing nothing but printable characters
    are called text files, and files that contain non-printable characters, such as
    machine instructions, are called binary files. Figure 3-1 lists the printable
    and non-printable ASCII characters.


    ![](img/6ed9bb33c68863516b7a954081187e3b_85_0.png)'
  merge: -1
