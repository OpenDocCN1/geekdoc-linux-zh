    \ partitions try to meet this goal by providing swap space on disk and treating\
    \ it like an extension of memory (RAM). It is called swap space because the system\
    \ can use it to swap information between disk and RAM. Setting up swap space makes\
    \ your computer run faster and more efficiently. If your computer has 16 MB of\
    \ RAM or less, you must allocate disk space to a swap partition. Even if your\
    \ computer has more than 16 MB of RAM, swap space is recommended for all UNIX\
    \ systems. The minimum amount of swap space should equal your RAM.\n\n> You can\
