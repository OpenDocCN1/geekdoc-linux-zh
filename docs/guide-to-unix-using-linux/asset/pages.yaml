  md: '# The While Loop A different pattern for looping is created using the while
    statement. The while statement best illustrates how to set up a loop to test repeatedly
    for a matching condition.


    To use the while statement:


    +   1 Use the vi or Emacs editor to create a shell script, colors.

    2 The script should contain these lines:


    bash

    echo -n "Try to guess my favorite color"

    read guess

    while [ "$guess" i= "red" ]; do

    echo "No, not that one. Try again."; read guess

    done


    3 Save the file and exit the editor.

    4 Give the file execute permission, and test it. You see output similar to Figure
    6-6.


    ![](img/6ed9bb33c68863516b7a954081187e3b_214_0.png)


    The while loop tests an expression in a manner similar to the if statement. As
    long as the statement inside the brackets is true, the statements inside the do
    and done statements repeat.

    Notice the use of the ! symbol, which is the not-equal operator. It tests two
    operands and returns true if they are not equal. Otherwise, it returns false.
    In the steps you just completed, the echo and read statements inside the loop
    repeat until the user enters red.

    Another example of the while loop is in a data entry form.'
