- img_proc: true
  md: '# Introduction to Shell Programming


    | Shell Name | Original Shell It Is Derived From | Description |

    |--- |--- |--- |

    | Bash | Bourne and Korn shells | Offers strong programming language features
    like shell variables, control structures, and logic/math expressions. Combines
    the best features of the other shells |

    | tsch | C Shell | Conforms to a programming language format. Shell expressions
    operators like those found in the C programming language |

    | zsh | Korn shell | Reflects the Bash shell in many respects but also has C programming-like
    syntax. Useful if you are familiar with older Korn shell scripts |


    Table 6-1: Linux shells


    The Bash shell offers improved features over the older Bourne and Korn shells
    and is fully backward-compatible with the Bourne shell. Additionally, the Bash
    shell, when compared to the other shells, has a more powerful programming interface.
    As a result, you should select the Bash shell (as contained in Red Hat''s Linux
    version 5.2) to complete your assignment.


    Now that you have selected the shell, you need to learn about what the shell scripts
    include, such as the variables, operators, and special characters.


    # Variables


    Variables are symbolic names that represent values stored in memory. The three
    types of variables discussed in this section are configuration variables, environment
    variables, and shell variables. Use **configuration variables** to store information
    about the setup of the operating system, and do not change them. You can set **environment
    variables** with initial values that you can change as needed. These variables,
    UNIX reads when you log in, determine many characteristics of your session. For
    example, you have already learned about the PS1 environment variable, which determines
    the way your prompt appears. Additionally, UNIX uses environment variables to
    determine things as where it should look for programs, which shell to use, and
    the path of your home directory. **Shell variables** are those you create at the
    command line or in a shell script for temporarily storing information.'
