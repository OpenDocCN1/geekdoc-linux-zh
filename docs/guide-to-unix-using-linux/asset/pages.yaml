  md: '# Removing Garbage Files


    An easy way to free space in your file systems is to remove garbage files. **Garbage
    files** are temporary files, such as a core file, that lose their usefulness after
    several days. A **core file** is created when an executing program attempts to
    do something illegal, like accessing another user''s memory. The UNIX operating
    system detects the attempt and sends a signal to the program. The signal halts
    the offending program and creates a copy of the program and its environment in
    a file named in the current directory. The programmer who wrote the program that
    `dumps core` (sl for this) might be interested in dissecting the core file with
    a debugging tool. However, too often the core file simply languishes in some branch
    of the directory hierarchy. All files created this way have the same name:


    Another file with a generic name is a.out, the default for the output of program
    compilation procedures. Like core files, the true identity of these generically
    named files gets lost over time. You can use the find command to retrieve these
    wasteful files and execute the rm command to remove them. You can also use the
    find command to search through the directory hierarchy and remove such files.
    You can write a find command so that it locates files named core and a.out, and
    remove each one. Here is such a command:


    ```

    find " -name a.out -o -name core " -exec rm {} \

    ```


    You have used the find command before to locate files. The command locates every
    occurrence of the a.out and core files, and deletes them with the rm command.
    The first argument, -o, "-name a.out -name core" uses the -o (OR) operator. It
    tells find to search for files a.out OR core. The exec rm option instructs find
    to execute the rm command each time it locates a file with the name searched for.
    The {} characters are replaced with the matching file name. For example, when
    the command locates an a.out, the {} are replaced with a.out, and the \ terminates
    the command.


    Now you use the find command to search and delete all occurrences of a.out and
    core.


    Note: The steps that follow assume you have a source directory in your home directory.
    The test files, a.out and core, are quickly created using the touch command, which,
    when followed by the filenames, creates empty files. The tilde (-) ensures that
    these files go into your home and source directories.


    # To remove garbage files:


    +   1 Create some garbage files, core and a.out, and place them in your home directory
    and the subdirectory of home by typing touch ~/core, pressing Enter, typing touch
    ~/a.out, pressing Enter, typing touch ~/source/core, pressing Enter, typing touch
    ~/source/a.out and then pressing Enter.'
  merge: -1
  pgno: 308
- img_proc: true
