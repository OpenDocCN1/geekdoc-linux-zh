  md: '# # APPENDIX

    Syntax Guide to UNIX Commands


    This appendix provides a quick reference to the UNIX commands and utilities covered
    in this text. Table B-1 lists the commands alphabetically, including the command
    name, its purpose, and any useful options. Table B-2 lists the UNIX utilities
    by category. Table B-3 summarizes the vi editor commands, while Table B-4 summarizes
    the emacs editor commands. The UNIX command syntax uses the format diagrammed
    in Figure B-1.'
  merge: -1
