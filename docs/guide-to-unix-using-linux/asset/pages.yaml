    # Hashes


    A hash is a variable that represents a set of key/value pairs. Hash variables
    are preceded by a percent sign (%) when they are assigned values. To refer to
    a single element of a hash, you use the hash variable name followed by the “key”
    associated with the value in curly braces. For example:


    ```

    %animals = (''Tigers'', 10, ''Lions'', 20, ''Bears'', 30);

    $animals{''Bears''}

    ```


    returns the value 30. Another, more readable way to define this is to use the
    => operator to define the key/value pairs:


    ```

    %animals = (Tigers => 10, Lions => 20, Bears => 30);

    ```


    Here is a program that demonstrates the use of a hash variable.


    ```

    #!/usr/bin/perl

    # Program name: example9.p

    %animals = (''Tigers'', 10, ''Lions'', 20, ''Bears'', 30);

    print("The animal values are:\n");

    print("$animals{''Tigers''}\n");

    print("$animals{''Lions''}\n");

    print("$animals{''Bears''}\n");

    ```


