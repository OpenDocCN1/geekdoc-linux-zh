  md: '# # Guide to UNIX® Using Linux


    **Guide to UNIX Using Linux** is a hands-on, practical guide that teaches the
    fundamentals of the


    UNIX operating system concepts, architecture, and administration. These concepts
    are taught using


    Linux, a free, PC-compatible UNIX clone that is an ideal teaching tool for many
    basic and advanced


    UNIX commands. The power, stability, and flexibility of UNIX has contributed to
    its popularity in


    mission-critical business and networking applications.


    # About the Authors


    Jack Dent has 25 years of experience as a programming consultant specializing
    in UNIX and Linux systems, and is the computer science department head at International
    Business College in Fort Wayne, Indiana.


    Tony Gaddis is the Coordinator of Advanced Technology at Haywood Community College
    in North Carolina. He teaches computer science courses, and is a former North
    Carolina Community College "Teacher of the Year."


    # Key Features of Guide to UNIX Using Linux


    +   - Includes a copy of Red Hat Linux 6.0

    - Covers shell programming database management, editing, C programming, debugging,
    Internet access, X-Windows basics, and rapid application development using standard
    UNIX tools like awk, sed, and perl

    - Provides users with a working knowledge of basic system utilities

    - Features review questions, hands-on-exercises, and discovery exercises at the
    end of each chapter, allowing students to practice skills as they are learned


    Course Technology is part of the Thomson Learning family of companies—dedicated
    to providing innovative approaches to lifelong learning. Thomson is learning.


    Visit Course Technology at **www.course.com** - To learn more about our Networking
