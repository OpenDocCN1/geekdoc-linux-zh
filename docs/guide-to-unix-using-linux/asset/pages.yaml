    # SUMMARY


    +   - The operating system is the most fundamental computer program. It controls
    all computer resources and provides the base upon which application programs can
    be used or written.


    +   - A server-based network is centralized. All the users'' data and applications
    reside on the server, which is secured, maintained, and backed up by the system
    administrator. Each computer in a server-based network relies on the peer-to-peer
    network function as both server and client. The security and maintenance of the
    network is distributed to each system. If one of the systems in a peer-to-peer
    network fails, the other systems continue to function.


    +   - The UNIX operating system is a multi-user system that lets many people access
    and share the computer operating system simultaneously. It is also a multitasking
    operating system: it can perform more than one task at one time.


    +   - UNIX systems may be configured as dedicated servers in a server-based network,
    client workstations in a server-based network, workstations in a peer-to-peer
    network, or standalone workstations connected to no network.


    +   - The concept of the layered components that make up an operating system originated
    with UNIX. Layers of software surrounding the computer system''s inner core protect
    the vital hardware and software components and insulate the core system from users.


    +   - Linux is a UNIX-like operating system that you install on your PC. It coexists
    with other operating systems such as Windows and MS-DOS.'
