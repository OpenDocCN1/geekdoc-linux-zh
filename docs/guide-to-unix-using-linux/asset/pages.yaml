  md: 'Next, use the tput command to create a cursor utility. You can use this utility
    in other script files to position the cursor on the screen.


    To use the tput command to create a cursor utility:

    1 Use the vi or Emacs editor to create a script file, cursor.

    2 Enter the following lines in the program:

    tput cup $1 $2

    3 Save the file and exit the editor.

    4 Make the cursor script executable with the chmod command.

    5 Test the script by typing cursor 10 12 and pressing Enter. The cursor moves
    to the position 10, 12 on the screen.


    Notice the script is passing $1 and $2 as arguments to the tput command. These
    are positional parameters: they reference arguments typed on the command line
    when the cursor script file is executed. For example, when you invoked the script
    with the command cursor 10 12, the $1 parameter holds the value 10, and the $2
    parameter holds the value 12.

    You will use the tput command to create screen management and cursor programs
    for displaying menus and data entry screens.


    To use the tput command:

    1 Use the vi or Emacs editor to enter a screen-management program, Scrmange, containing
    the following lines:

    tput cup $1 $2 # place cursor on row and col

    tput clear # clear the screen

    bold=tput smso # set standout mode - bold

    offbold=tput rmso # reset screen - turn bold off

    echo $bold # turn bold on

    cursor 10 20; echo "Type Last Name:" # bold caption

    cursor 12 20; echo "Type First Name:" # bold caption

    echo $offbold # turn bold off

    cursor 10 41; read lastname # enter last name

    cursor 12 41; read firstname # enter first name

    2 Save the file and exit the editor.

    3 Give the file execution permission, and test it.


    You are now ready to enter the script to display the menu. (You will use this
    program as part of your application later in this section.)'
