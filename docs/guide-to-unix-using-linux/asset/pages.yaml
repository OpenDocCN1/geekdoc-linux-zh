  md: '# Applying System Status Utilities


    As you see from the list of command descriptions in Table 8-2, the system commands
    determine the system''s performance. Although system engineers assess the CPU''s
    performance primarily use this data, you should at least know to obtain this information.
    You can redirect the output of these commands to a file that you can print and
    forward to the system administrator and system tuneup specialists.


    One of the most effective utilities for auditing system performance is the top
    command. The top command displays a listing of the most CPU-intensive tasks, such
    as the processor state, in real time (the display is updated every 5 seconds by
    default). This means that you can actually see what is happening inside the computer
    as it progresses. The top command works with these options:


    +   Syntax

    top [-] [d delay] [q] [s] [i] [c]


    Dissection

    d d option specifies the delay between updates. The q option causes the top utility
    to refresh without delay. The s option specifies cumulative mode, where each process
    is listed with the CPU time that it has spent. The c option allows the top utility
    to run in secure mode, which displays the interactive commands (a good option
    for those not in charge of tuning the system). The i option causes the top utility
    to ignore any idle processes. The c option displays the command line instead of
    the command name out. While running, the top command supports interactive commands,
    such as k, which kills a running process. The top utility continues to produce
    output until you press q to terminate the execution of the program.


    The simplest way for most users to run the top utility is to simply issue the
    command without options.


    To use the top utility:


    +   1 Display the CPU activity by typing top and then pressing Enter. Your screen
    should look similar to Figure 8-13. (Don''t forget this display changes dynamically
    while on.)

    2 The processes are shown in the order of the amount of CPU time they use. After
    looking at the display for a short time, press q to exit the top utility.

    3 Run the top command again. Notice the leftmost column of information, labeled
    PID. This column lists the process ID of each process shown. Notice the PID of
    the top command. (In Figure 8-13, the top command''s PID is 707. You will probably
    differ.'
