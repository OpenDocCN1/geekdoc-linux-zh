    +   2 Look for the line that reads:


    id:3:initdefault


    +   3 Type q to exit the more command.


    The code shown above establishes the operating system''s default run level, or
    mode of operation, at 3. Run level 3 is full multi-user mode. By raising the run
    level to 5, the system starts in X11 mode, which automatically starts the X Window
    system.


    Note: Configuring your system requires superuser privileges. You must be able
    to log on as root to complete the following exercise.


    Caution: You should be very careful any time you log on as root. Because the root
