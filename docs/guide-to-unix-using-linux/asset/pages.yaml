  md: '+   - %12.12s indicates that field $2 is to appear as a string. The minus sign
    (-) specifies the string is to be left-justified. The 12.12 indicates the string
    should appear in a field padded to 12 spaces, with a maximum size of 12 spaces.

    - %10.10s indicates that field $3 is to appear as a string. The minus sign (-)
    specifies the string is to be left-justified. The 10.10 indicates the string should
    appear in a field padded to 10 spaces, with a maximum size of 10 spaces.


    The spaces that appear in the format string are printed exactly where they appear
    in relation to the fields (one is printed after $1, and another is printed after
    $2). The trailing \t tells you to skip a line after displaying the three fields.


