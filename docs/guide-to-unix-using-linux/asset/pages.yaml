    out successfully. A 1 usually represents a true value, but sometimes any non-zero
    value represents a true value.


    user mode A means of accessing the areas of a system where all program software
    resides.


    # T


    # U


    tags Code embedded in a document or Web page created with Hyper Text Markup Language
    (HTML). When the document is viewed with a Web browser like Netscape Navigator
    or Internet Explorer, the tags give the document special properties like foreground
    and background color, font size, and the


    utility A program that performs useful operations like copying files, listing
    directories, and communicating with other users. Unlike other operating systems,
    a utility is an “add-on” and not part of the UNIX shell, nor a component of the
    kernel.'
