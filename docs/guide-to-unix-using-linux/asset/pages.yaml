  md: '# Developing UNIX Applications in C and C++


    To correct syntax errors within your programs, you must therefore perform the
    following steps:


    +   1. Write down the line number of each error and a brief description.

    2. Edit your source file, moving your cursor to the first line number the compiler
    reports.

    3. Within the source file, correct the error and then move the cursor to the next
    line number. Most editors display the current line number to help you locate specific
    lines within the file.

    4. After correcting all the errors, save and re-compile the file.


    Now that you understand how to write and debug simple C programs, you are ready
    to create interactive programs that read input from the keyboard.


    # Creating a C Program to Accept Input


    You can draw from many standard library functions to accept input; that is, enter
    characters using the keyboard. Some like getchar() are character-oriented, while
    others like scanf() are field-oriented. This section concentrates on scanf().


    Unlike many other library functions, scanf() can be used to input values of a
    variety of data types. You use it like this:


    ```

    scanf(control string, address, address...);

    ```


    The scanf() function uses a control string with format specifiers in a manner
    similar to printf. The arguments that follow the control string are the addresses
    of variables where the input is to be stored. Consider the following example:


    ```

    scanf("%d", &age);

    ```


    The %d format specifier works just like it does for printf. Here it indicates
    that scanf() will interpret the input value as a decimal integer.

    nThe &age argument tells scanf to store the input value in the variable age. The
    & is the address operator. When used with a general variable, it returns the address
    where this variable is located. The scanf() function needs the address of a variable
    to store an input value. The next example shows how scanf() can be used to input
    a string.


    ```

    scanf("%s", city);

    ```


    Notice that this example does not use the & operator. Anytime you use the name
    of an array, it resolves to the address of the first element. It would be an error
    to use the & & operator with the name of an array.


    The format specifiers for scanf() are generally the same as those used with printf().
    Table 10-6 shows the format specifiers for scanf().'
