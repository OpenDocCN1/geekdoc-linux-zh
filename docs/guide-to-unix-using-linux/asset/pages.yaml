  md: "# chapter 6, lesson B\n\nAn alias is a name that represents another command.\
    \ You can use aliases to simplify and automate commands you use frequently. For\
    \ example, the following command sets up an alias for the rm command.\n\n```\n\
    alias rm=\"rm -i\"\n```\n\nThis command causes the rm -i command to execute any\
    \ time the user enters the rm command. This is a commonly used alias, as it ensures\
    \ users are always prompted before the rm command deletes a file. Here are two\
    \ other common aliases:\n\n```\nalias mv=\"mv -i\"\nalias cp=\"cp -i\"\n```\n\n\
    # To practice creating an alias:\n\n+   1. To create an alias for the ls command,\
    \ type alias ls=\"ls -l\" and press Enter. Now, when you use the ls command, the\
    \ ls -l command executes automatically.\n2. Test the alias by typing ls and pressing\
    \ Enter. You see a long directory listing.\n\n.bashrc file that resides in your\
    \ home directory can be used to establish customizations that take effect for\
    \ each login session. The .bashrc script is executed each time you generate a\
    \ shell, or when you run a shell script. Any time a subshell is created, the .bashrc\
    \ is re-executed. The following .bashrc file is commented to explain how you can\
    \ make your changes.\n\n```\n.bashrc\n# Source global definitions\nif [ -f /etc/bashrc\
    \ ]; then\n    /etc/bashrc # if any global definitions are defined\n    # run\
    \ them first\nalias rm='rm -i' # make sure user is prompted before\n    # removing\
    \ files\nalias mv='mv -i' # make sure user is prompted before\n    # overlaying\
    \ files\nset -o ignoreoreof # Do not allow Ctrl-D to logout\nset -o noclobber\
    \ # Force user to enter >! To write\n    # over existing files\nPS1=\"\\w \\$\"\
    \ # Set prompt to show working directory\n```\n\nIn addition to knowing how to\
    \ customize your work environment, you should also be familiar with the trap command."
