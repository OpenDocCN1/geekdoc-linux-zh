- img_proc: true
  md: '# Advanced Shell Programming


    If both expression1 and expression2 are true, the test command returns true (with
    a 0 exit status). However, if either expression1 or expression2 is false, the
    test command returns false (with an exit status of 1).


    The -o operator also combines two expressions. It tests a logical OR relationship.
    Form of the test command with the -o option is:


    ```

    test expression1 -o expression2

    ```


    If expression1 or expression2 is true, the test command returns true (with a 0
    exit status). However, if neither of the expressions are true, the test command
    returns false (with an exit status of 1).


    The ! operator negates the value of an expression. This means that if the expression
    normally causes test to return true, it returns false instead. Likewise, if the
    expression normally causes test to return false, it returns true instead. The
    form of the test command with the ! operator is:


    ```

    test ! expression

    ```


    +   To demonstrate the test command''s Boolean operators:

    1 Recall that the test_file you created in the previous exercise has read and
    write permissions. Type test -r test_file -a -w test_file and press Enter.

    This command tests two expressions using an AND relationship: -r test_file and
    -w test_file. If both expressions are true, the test command returns true.

