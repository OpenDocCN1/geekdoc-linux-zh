  md: '# Finding Files


    The find command searches for files that have a specified name. Use the find command
    to locate files that have the same name or to find a file in any directory. The
    command has the following:


    # Syntax


    ```

    find pathname -name filename

    ```


    # Dissection


    +   - **pathname** is the path of the directory you want to search. The find command
    searches recursively; that is, it starts in the named directory and searches down
    through all files and subdirectories under the directory specified by *pathname.


    +   - **name** indicates that you are searching for files with a specific filename.
    You may use wildcard characters in the filename. For example, you may use phone*
    to search for all filenames that begin with "phone." For other search conditions
    you can use with find, refer to Appendix B, "Syntax Guide to UNIX Commands."


    Using the find command you can only search areas where you have adequate permissions.
    As the search progresses, the find command may enter protected directories; you
    receive a “Permission denied” message each time you attempt to enter a directory
    for you do not have adequate permissions.


    You can use the find command to find every file named phone in the /home directory
    and all its subdirectories.


    To find a file:

    After the $ command prompt, type find /home -name phone1 and press Enter.


    > Note: Although Linux does not require it, some UNIX versions require the –print
    option after the filename to display the names of files the find command locates.


    # Combining Files


    Now you''re ready to work on the vendor report for Worldwide Hotels, Dominion’s
    client. Two separate files, illustrated in Figure 4-2, store the data you need—product
    descriptions and vendor numbers.'
