    | To move a file from one directory to another:

    1 To create the new filethis in your home directory, type > thisfile and then
    press Enter.

    2 Type mv thisfile source and press Enter to move the new file to the source directory.

    3 Type Is and press Enter. Thisfile is not listed. Type Is source and press Enter.
