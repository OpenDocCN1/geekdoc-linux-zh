    \ operator can save you coding time.\n\nTo use Perl's spaceship operator:\n\n\
    +   1. Use the editor of your choice to create the program perlsort.p4. Enter\
    \ this code.\n\n```perl\n#!/usr/bin/perl\n# program name: perlsort.p4\n# purpose:\
    \ Sort numerically using spaceship operator (<=>)\n# syntax: perlsort.p4 filename\
    \ <Enter>\n\n$x = 0;\nwhile (<=>) {\n    $somelist[$x] = $_;\n    $x++;\n}\n@sortedlist\
    \ = sort numbers @somelist;\nprint @sortedlist;\n\nsub numbers {\n    $a <=> $b;\n\
    }\n```\n\n2. Save the file and exit the editor.\n3. Use the chmod command to grant\
    \ the file execute permission.\n4. Test the program by typing ./perlsort.p4 numberlist\
