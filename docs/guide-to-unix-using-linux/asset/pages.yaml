    found in C and C++. Awk, therefore, uses fewer lines of code to resolve pattern-matching
    extractions than. For example, look at the following awk program, awkcom.a, and
    its output. The program counts the number of comment lines that appear in the
    file specified on the command line.


    ```

    #1/usr/bin/awk -f

    # program name: awkcom.a

    # purpose: Count the comment lines in a file

    # Enter the filename on the command line.

    ```


    ```

    END {

    ```


    ```

    print "The file has ", line_count, " comment lines."

    }

    ^#/ && !/^#!/ { ++line_count } # This occurs for every line.

    ```'
