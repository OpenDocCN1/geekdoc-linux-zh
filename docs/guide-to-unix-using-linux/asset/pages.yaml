    # Interacting with the X Window System


    You interact with the X Window environment through its many components. Figure
    11-4 shows the opening GNOME screen, with its major components labeled.


    Here is a description of the components in Figure 11-4.


    +   Icons: There are a number of icons, or images, on the screen. Each causes
    an action to take place when activated. You activate an icon by positioning the
    mouse over it and clicking the left mouse button.


    +   GNOME Panel: This component is a strip that runs across the bottom of the
    screen, and includes a number of icons. Each icon invokes an applet when activated.
    An applet is a small application written specifically to be placed on the panel.


    +   Windows: Every program, application, or applet that runs under the X Window
    system runs in a window. Windows have many of their own components, which you
    will learn about in this chapter.


    +   Desktop Area: This is the background area that holds the windows and icons
    you are working with your X Window session.


    Now that you can identify the major components of the GNOME screen, you will learn
    to interact with each one.'
