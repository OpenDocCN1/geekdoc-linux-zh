    # Using the uniq Command


    The uniq command removes duplicate lines from a file. Because it compares only
    consecutive lines, the uniq command requires sorted input. The syntax of the uniq
    command is:


    ```

    uniq [options] file1 > file2

    ```


    In its simplest form, the uniq command removes identical lines or rows from a
    file. The following command creates the file inventory. It contains all the lines
    in the parts file, with duplicate lines eliminated.


    ```

    uniq parts > inventory

    ```'
