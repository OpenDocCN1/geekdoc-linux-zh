    The steps you take to connect to a UNIX system vary according to the kind of connection
    you use. The simplest connection is that of a user terminal that presents the
    log-on prompt as soon as you turn it on. You can also access the Internet through
    an Internet Service Provider (ISP) and connect to a remote UNIX host.


    # Connecting to UNIX Using Telnet


    Telnet is a terminal emulation program. It runs on your computer and connects
    your PC to a server, or host, on the network. You can then log on to a UNIX host
    and begin working with UNIX.

    Each computer on the Internet has an Internet Protocol (IP) address. An IP address
    is a set of four numbers separated by periods, such as 172.16.1.61. Most systems
    on the Internet also have a domain name such as Lunar.campus.edu. The IP address
    and the domain name identify a system on the network. Programs such as Telnet
    use IP addresses or domain names to access remote systems.


    # To access a UNIX host via Telnet:


    +   1 Find the remote host''s IP address or domain name.

    2 Connect to the Internet, if necessary. If you use a PPP connection to dial into
    an ISP, make that connection. If you use a full-time Internet connection at work
    or school, ignore this step.

    3 Start your Telnet program and connect to the UNIX system.


    Follow the instructions in your Telnet program to connect to a remote host. Usually,
    you must provide the host name to connect to a UNIX system. For example, you can
    type the following command after the prompt in a Windows 95/98 MS-DOS window to
    gain access to the system Lunar.campus.edu.

    telnet Lunar.campus.edu


    # Logging On to UNIX


    After you connect to a UNIX system, you must log on by entering your user name
    and password. You see a prompt requesting the login or user name and the password.
    For security reasons, the password does not appear on the screen as you type it.
    You cannot log on without an authorized user account, if your password fails,
    or if you wait too long before entering your name and password. Contact your system
    administrator for help.


    After you log on, you are ready to begin using the system.'
