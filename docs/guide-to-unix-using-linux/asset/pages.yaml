  md: '# Developing UNIX Applications in C and C++


    new executable file. However, keeping track of what needs to be recompiled and
    what does not become an overwhelming task when the program involves dozens of
    source-code files. This is where the make utility helps.


    The make utility tracks what needs to be recompiled by the time stamp for each
    source file. All you need to do is create a control file, called themakefile (which
    is actually a file named Makefile), for the make utility to use. The control file
    lists all your source files and their relationships to each other. These relationships
    are expressed in the form of targets and dependencies. A target file depends on
    another file to determine if any action needs to be taken to rebuild the target
    file. (The ultimate target file is, of course, the executable file that results
    from linking all the object files together.) The dependent files are source files,
    such as the .c source files, or .h files that serve as headers to be included
    within the source files.


    The Makefile must exist in the current directory. It feeds the make utility all
    it needs to know to recompile any changed modules and relink the objects to produce
    a new executable. You can also give themakefile another name, such as make.. To
    do this, you need to enter an -f option followed by the name of the makefile.
    This is useful when you are developing more than one application from the same
    directory.


    The contents of make_abs, an example of a makefile:


    ```

    abs_main.o: abs_main.c

    gcc -c abs_main.c

    abs_func.o: abs_func.c

    gcc -c abs_func.c

    abs2: abs_main.o abs_func.o

    gcc abs_main.o abs_func.o -o abs2

    ```


    Two types of lines are shown in the file: dependencies and commands. The first
    line is a dependency, and the second line is a command:


    ```

    abs_main.o: abs_main.c

    gcc -c abs_main.c

    ```


    The first line establishes a dependency between abs_main.o and abs_main.c. If
    abs_main.c is newer than abs_main.o, the command on the second line executes (rebuilding
    abs_main.o).


    The third and fourth lines, as well as the fifth and sixth lines, establish similar
    dependencies and commands.


    The command line entry to build the abs2 program using the make is:


    ```

    make -f make_abs abs2

    ```


    The -f option instructs make to read the file make_abs instead of makefile. After
    executing the command, you can run the abs2 program. Figure 10-10 shows the output
    of the make command and the abs2 program.'
