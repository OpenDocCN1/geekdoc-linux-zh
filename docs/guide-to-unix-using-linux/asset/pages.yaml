  md: '# chapter 7, lesson B


    To make this fast clear before continuing, place these two lines of code at the
    end

    of your .bashrc file (or the equivalent login initialization file for your shell):


    ```

    CLEAR=''clear''

    export CLEAR

    ```


    Save the file, exit, and then log on again to activate the login script.


    You are now ready to complete your first task: correcting entries. To do this,

    you need to manipulate the cursor.


    # Moving the Cursor


    The first task is to let the user return to a previously entered field and to
    correct

    data in field before accepting. Recall that in Chapter 6 you created a script

    named cursor. The script accepts two arguments: the row and column number of a

    screen. The cursor script then positions the cursor at the specified position

    using the tput command.


    You want to allow users to return the cursor to a previous field on the screen

    adding records to the corp_phones file. You decide that the minus character

    (-) will signal this. If the user enters a minus and presses the Enter key, the
    cursor

    is repositioned at the start of the previous field as shown on the screen. You
    will

    make this change by editing the phoneadd program (which provides the user with

    data-entry screens) that you already created. Your first step in editing the program

    is to create a program algorithm.


    # Creating Program Algorithms


    An algorithm is a sequence of commands or instructions that produces a desired

    result. The algorithm to solve a specific problem is frequently developed by following

    logic shown in a flowchart and the expressed conditions necessary to carry out

    the logic described in the pseudocode.


    Here is the pseudocode for repositioning the cursor at the previous field when

    the user enters the minus sign (-):


    ```

    Read information into field2.

    While field2 equals "-"

    Move cursor to position of previous field, field1.

    Clear current information displayed in field1.

    Read new information into field1.

    If field1 = "q"

    then

    Exit program.

    ```'
