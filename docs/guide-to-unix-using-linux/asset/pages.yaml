  md: '# The trap Command


    The trap command is useful when you want your shell program to automatically remove
    temporary files that are created when the shell scripts runs. The trap command
    specifies that a command, listed as the argument to trap, is read and executed
    when the shell receives a specified system signal. Here is an example of the command:


    ```

    trap rm ~/tmp/* /dev/null 2> exit 0

    ```


    This command has two arguments: a command to be executed, and a signal number
    from the operating system. The command, rm ~/tmp/* 2>/dev/null; exit deletes everything
    in the user''s tmp directory, redirects the error output of the rm command to
    the null device (so it does not appear on the screen), and an exit command to
    terminate the shell. The signal specified is 0, which is the operating system
    signal generated when a program exits. So, if such a command is part of a script
    file, it causes the specified rm command to execute when signal is 0 by the operating
    system.


    The programmer often sets up ~/tmp (a subdirectory of the user''s home directory)
    to store temporary files. When the script file exits, any files placed in ~/tmp
    can be removed. This is called "good housekeeping" on the part of the programmer.


