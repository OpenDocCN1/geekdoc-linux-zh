  md: '# Glossary


    531


    # V


    you work with files whose names are similar or find a file whose exact name you
    cannot remember. Wildcard characters are also called **glob** characters.


    **variables** Symbolic names that represent values stored in memory.

    **virtual file system** A system that occupies no disk space, such as the /proc
    directory. The system references and lets you obtain information about which programs
    and processes are running on a computer.


    **Windows Manager** The top layer of the X system and the user''s interface to
    the system''s components. It controls how windows appear and how users control
    them.


    **virtual memory** An unlimited memory resource supported by the **swap partition**,
    where the system can swap information between disk and RAM, allowing the computer
    to run faster and more efficiently.


    # X


    **X Window system** A graphical user interface (GUI) that runs on Linux and many
    UNIX operating systems.


    **X11** The eleventh version of the X Window system.


    **Xfree86** A version of **X11** that was ported to the PC and on Linux.


    # W


    **zsh** A free, shareware UNIX command interpreter based on the **Korn** shell.


    **wallpaper** A graphic image you can choose to use as the background of your
    desktop area.


    **wildcard** A special character used to represent any other character or, sometimes,
    a group of characters. Wildcards help'
