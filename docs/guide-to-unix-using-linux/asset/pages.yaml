  md: '# appendix B


    | Command | Purpose | Useful Options |

    | --- | --- | --- |

    | join | Join two files, matching row by row | -a n produces a line for each unpairable
    line in file n, where n = 1 or 2.<br>-e str replaces the empty fields for the
    unpairable line with the string specified by str.<br>-j specifies the common fields
    on which the join is to be made.<br>-o specifies a list of fields to be output.
    The list contains blank-separated field specifiers in the form m,n, where m is
    the file number and n is the position of the field in the file. Thus-o 1.2 means
    output the second field in the first file.<br>-t specifies the field separator
    character. By default this is a blank, tab, or new-line character. Multiple blanks
    and tabs count as one field separator |

    | kill | End a process | |

    | less | Display a long file one screen at a time, and scroll up and down | |

    | let | Store the results of arithmetic operations in a variable | |

    | In | Create a link between files, thereby allowing more than one name for a
    file | |

    | lpr | Print a file | -d prints on a specified printer.<br>-n prints a specified
    number of copies of the file. |


