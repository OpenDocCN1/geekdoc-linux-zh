- img_proc: true
  md: "# appendix B\n\n```\n$ command [-options] [arguments]\n-> Filenames or paths\n\
    -> Single-letter options,\n  preceded by a minus sign\n-> Command name\n-> System\
    \ prompt\n```\n\nFigure B-1: Command syntax format\n\n| Command | Purpose | Useful\
    \ Options |\n| --- | --- | --- |\n| alias | Create an alias for a command | |\n\
    | awk | Invoke a pattern-scanning and processing language | -f indicates code\
    \ is coming from a disk file, not the keyboard.\n-F specifies the field separator.\
    \ |\n| cal | Show the system calendar for a specified year or month | -j displays\
    \ the Julian date format. |\n| cat | Concatenate or display files | -n displays\
    \ line numbers. |\n| cd | Change directories | |\n| chmod | Change security mode\
    \ of a file or directory (r: read, w: write, x: executable) Set file permissions\
    \ for specified users (u: user, g: group, o: others, a: all) | |\n| clear | Clear\
    \ the screen | |\n| comm | Compare sorted files and show differences | |\n| cp\
    \ | Copy files from one directory to another | -i requests confirmation if the\
    \ target file already exists.\n-r copies directories to a new directory.\n| cut\
    \ | Select and extract columns or fields from a file | -c specifies the character\
    \ position.\n-d specifies the field separator.\n-f specifies the field position.\
    \ |"
