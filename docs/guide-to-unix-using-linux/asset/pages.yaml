  md: '# APPENDIX

    How to Access A a UNIX/Linux Operating System


    This appendix explains your options for accessing a computer running UNIX or Linux
    as its operating system. Typically, you access a UNIX/Linux system in one of these
    circumstances:


    +   - You use a dumb terminal directly connected to a communications port on the
    UNIX/Linux system.

    - You use your school''s local area network to connect to a remote UNIX/Linux
    system.

    - You use a dial-up connection to your Internet Service Provider (ISP) or school
    server, and then access a remote UNIX/Linux system.'
  merge: -1
  pgno: 492
- img_proc: true
  md: '# appendix A


    If you use a dumb terminal to access a UNIX/Linux system, you only need to turn
    on the terminal and press a key on the keyboard. You then see a UNIX/Linux login
    prompt, where you can enter your username and password and begin working immediately.
    If you use your school''s local area network to access a remote system, you must
    first establish a Telnet session to the system. Using "Telnet to Access a Remote
    System" for complete instructions. If you are using a dial-connection to access
    a remote system through your ISP or school server, continue to the next section.


    # Using a Dial-Up Connection to Access a Remote System


    This section gives detailed instructions on setting up a dial-up connection. If
    you are already dialing into an ISP or your school server, you can skip the next
    sections, dial into your ISP or school server, and then proceed to "Using Telnet
    to Access a Remote System."


    # Setting Up a Dial-Up Network Connection in Windows 95 and 98


    This section lists the steps typically necessary for setting up a dial-up network
    connection in Windows 95 or Windows 98. After you configure the dial-connection
    on your system, you may use your modem to dial into your Internet Service Provider
    (ISP) or your college account. If your ISP or college has provided you with different
    instructions, follow them instead of the steps listed here.


    > Note: These instructions assume that your modem is already installed in your
    computer.


    Information Need Before starting these steps, make sure you have the following
    information:


    +   - The telephone number for the server to which you are connected

    - The user name your ISP or school account assigned to you

    - Your ISP or school account password

    - The IP address of the server to which you are connected

    - The IP address of the server to which you are connecting\ The domain of the
    server to which you are connecting


    If you do not know one or more of the items listed, contact your ISP or school
    technical support staff for assistance.


    You may also need your Windows 95 or 98 CD.


    ![](img/6ed9bb33c68863516b7a954081187e3b_493_0.png)'
  merge: -1
