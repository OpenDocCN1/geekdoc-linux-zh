    # Setting Up Hard Disk Partitions


    Partitioning your hard disk provides organized space to contain your file systems.
    If one file system fails, you can work with another. This section provides general
    guidelines on how to partition hard disks. These recommendations are suggestions
    only. How you partition your hard drive may vary depending on your system''s configuration,
    number of users, and planned use. Partition size is measured in megabytes (about
    a million characters) or gigabytes (GB–about a billion characters). You should
    have at least three partitions to store your file systems: root, swap, and /usr.


    Begin by setting up a partition for the root file system. A partition must be
    mounted before it becomes part of the file system. The kernel monitors the root
    file system when the system starts. The kernel has no other information about
    the computer''s other file systems, so all the information and programs the kernel
    needs to start the system must be present on the root partition. To protect this
    critical information, separate partitions are often used for other system data.


    The root partition can be small to leave space for other file systems. A corrupted
    root file system makes the system unbootable. Red Hat and most Linux distributors
    recommend a root partition size of no more than 120 MB.


    After creating the root partition, you should set up the swap partition. The swap
    partition acts like an extension of memory, so that UNIX has more room to run
    large programs. Linux distributors suggest that your swap space be twice the size
    of your computer''s internal memory (RAM). For example, if your computer has 64
    MB of RAM, you should allocate 128 MB for the swap partition. See Appendix C,
    “Installing Red Hat 6.x,” for more information.


    The /usr partition stores all the non-kernel operating system programs that make
    the computer useful. These programs include software development packages that
    support computer programming, networking, Internet access, graphical screens (including
    X-Windows), and the large number of UNIX utilities (programs that perform utilitarian
    operations like copying files, listing directories, and communicating with other
    users). The usr partition should be the largest of the three partitions, at least
    600 MB.


    In addition to these three separate partitions, you can create a /home partition,
    the home directory for all users. A separate /home partition makes many system
    administration tasks such as backing up data more efficient.


    For example, Dominion Consulting partitions a PC with 32 MB of RAM and allocates
    2 GB of disk space for UNIX, allowing 120 MB for the root partition, 1400 MB for
    the /usr partition, 32 MB for the swap partition, and 448 MB for the /home partition.'
