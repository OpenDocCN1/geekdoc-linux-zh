  md: '# Syntax Guide to UNIX Commands


    | Command | Purpose | Useful Options |

    | date | Display the system date | -u displays the time in Greenwich Mean Time.
    |

    | diff | Compare and select differences in two files | |

    | . (dot) | Run a process in the current directory | |

    | .. (dot dot) | Run a process in the parent directory | |

    | echo | Display the specified arguments on the output device | |

    | emacs | Start the emacs editor | |

    | exit or logout | Exit UNIX | |

    | export | Export a specified list of variables to other shells Make a variable
    environment variable | |

    | find | Locate files that match a specified criteria | -name filename finds files
    with the filename. -print prints the pathname for each file found. -type file
    type finds files with the specified access type. |

    | grep | Select lines or rows that match a specified pattern | -c displays the
    count of matching lines. -l ignores case. -l lists only filenames. -n displays
    line numbers. -v displays lines that do not match the specified pattern. |

    | head | Display the first few lines of a file. | -n displays the first n lines
    of the specified file. |

    | history | List all commands you enter during a UNIX session | |


