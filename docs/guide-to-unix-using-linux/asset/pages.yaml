    The -f option in the awk program tells the shell that the program is called with
    a script file that contains the awk commands. Recall that awk contains more built-in
    commands to read lines from the file. All awk needs is the pattern-matching conditions
    to select the lines. The reading of the file, in awk, is implied as shown in this
    code.


    ```

    /^\&/ 1 /^#/ { ++line_count }

    ```


    Awk also uses BEGIN and END to control when commands execute. All statements in
    a BEGIN block execute before the input file is read. All statements in an END
    block execute after the contents of the input file have been read. This program
    only needs the END pattern.


    In the Perl program, the code:


    ```

    $file = $ARGV[0];

