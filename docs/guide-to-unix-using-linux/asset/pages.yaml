    # Printing Text Files


    You can use the lpr (line print) shell command to print a file. Type !lpr and
    then type the name of the file you want to print.


    +   To print a file:

    - Press Esc to return to command mode.

    - Type :lpr practice and press Enter. This prints the file practice in the current
    directory on the default printer.


    You can also specify which printer you want to use with the -Pprinter option.
    For example, you may use two printers—lp1 and lp2. To print the practice file
    on lp2, type :lpr -Plp2 practice and press Enter.


