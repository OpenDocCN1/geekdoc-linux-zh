    Becky wants to extract the second column of information (the bread list) from
    the file and display it on the screen. She types the following command:


    ```

    cut -f2 food

    ```


    The option -f2 tells the cut command to extract the second field from each line.
    Tab delimiters separate the fields, so cut knows where to find the fields. She
