  md: '# chapter 1, lesson A


    Linux offers all the complexity of UNIX at no cost. It is robust enough to handle
    large tasks with all the networking features of commercial UNIX versions. You
    can install Linux on your PC, where it can coexist with other operating systems,
    and test your UNIX skills. All these features make Linux an excellent way to learn
    UNIX, even when you have access to other computers running on UNIX.


    # Introducing UNIX Shells


    The shell is a UNIX program that interprets the commands you enter from the keyboard.
    UNIX provides several shells, including the Bourne shell, the Korn shell, and
    the C shell. Steve Bourne at AT&T Bell Laboratories developed the Bourne shell
    as the first UNIX command processor. Another Bell Labs employee, David Korn, developed
    the Korn shell. Compatible with the Bourne shell, the Korn shell includes many
    extensions, such as a history feature that lets you use a keyboard shortcut to
    retrieve commands you previously entered. The C shell is designed for programmers''
    use. Bash is the default command interpreter. Bash is an acronym for “Bourne Again
    Shell,” and it includes the best features of the Korn and Bourne shells. No matter
    which shell you use, your communications with UNIX always take place through a
    shell interpreter. Figure 1-6 shows the role of the shell in the UNIX operating
    system.


    ![](img/6ed9bb33c68863516b7a954081187e3b_23_0.png)


    Figure 1-6: Shell''s relationship to the user and the hardware'
