  md: '# LESSON A

    objectives


    In this lesson you will:


    +   - Use flowcharting and pseudocode tools

    - Learn to write scripts that tell the system which shell to use as an interpreter

    - Use the test command to compare values and validate file existence

    - Use the translate command, tr, to display a record with duplicate fields

    - Use the sed command to delete a phone record


    # Developing

    A Fully Featured

    Program


    In the last chapter you began developing a program to automate the maintenance
    of the phone records in the corp_phones file. You developed a menu that presents
    several options and a data entry screen that allows records to be added to the
    file.


    In this chapter you complete the program. You add code that deletes a specified
    record from the file, searches for a specified record, and sorts and displays
    all records in the file. You perform these tasks with the test, grep, sed, and
    tr commands. Before you begin adding this code, you learn about two standard program
    development tools: flowcharts and pseudocode.


    # Analyzing the Program


    A computer program is developed by analyzing the best way to achieve the desired
    results. Standard programming analysis tools help you do this. The two most popular
    and proven analysis tools are the flowchart and pseudocode.


    # Flowcharting


    The flowchart is a logic diagram that uses a set of standard symbols that explain
    the program''s sequence and each action it takes. For example, look at the flowchart
    in Figure 7-1.'
