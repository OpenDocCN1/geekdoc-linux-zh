    # SUMMARY


    +   - In UNIX, a file is the basic component for data storage. UNIX considers
    everything to be a file, attached devices such as the monitor, keyboard, and printer.

    - A file system is the UNIX’s way of organizing files on mass storage devices
    such as hard and floppy disks. Files are stored on a file system, which is a hierarchical
    structure like a tree where top-level directories contain other directories, which
    in turn contain other directories.

    - Every file can be located using a correct and unique pathname; that is, a list
    of names of directories leading to a particular file.

    - The tree structure starts with the root (/) directory, which serves as the foundation
    for a nested group of other directories and subdirectories.

    - The section of the disk that holds a file system is called a partition. One
    may have many partitions, separated from the others so that it remains unaffected
    by external disturbances such as structural file problems associated with another
    partition.

    - The UNIX file system is designed to allow access to multiple partitions once
    they are mounted in the tree structure.'
