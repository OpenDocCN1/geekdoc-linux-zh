    # Using the Cut Command to Extract Fields


    You have learned that files can consist of records, fields, and characters. You
    may want to retrieve some, but not all, fields in a file. You can use the cut
    command to remove specific columns or fields from a file. The syntax of the cut
    command is:


    ```

    cut -f list [-d char] file1 file2...

    cut -c list file1 file2 ...

    ```'
