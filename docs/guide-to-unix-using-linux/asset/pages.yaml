    # Using Wildcards


    A wildcard is a special character that can stand for any other character or, in
    some cases, a group of characters. Wildcards are useful when you wish to work
    with several files whose names are similar or with a file whose exact name you
    cannot remember. UNIX supports several wildcard characters. In this section you
    will learn about two: * and ?


    * wildcard represents any group of characters in a filename. For example, assume
    Becky has these nine files in her home directory:


    ```

    friends

    instructions.txt

    list1

    list2

    list2b

    memo_to_fred

    memo_to_jill

    minutes.txt

    ```


    If she enters *.txt and presses Enter, she sees the following output:


    ```

    instructions.txt

    minutes.txt

    ```


    The argument *.txt causes ls to display the names of all files that end with .txt.
    If she enters ls memo*, she sees the following output:


    ```

    memo_to_fred

    memo_to_jill

    ```


    If she enters the command ls *s and presses Enter, ls displays all filenames with
    s. She sees the output:


    ```

    friends

    notes

    ```


    * wildcard only takes the place of a single character. For example, if Becky types
    ls? and presses Enter, ls displays all files whose names start with list followed
    by a single character. She sees the output:


    ```

    list1

    list2

    ```


    She does not see the listing for the file list2b, because two characters follow
    the word “list” in its name.'
