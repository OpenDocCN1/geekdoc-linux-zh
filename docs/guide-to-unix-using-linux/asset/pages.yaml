  md: "# The X Window System\n\nNow that you have learned the basic techniques of\
    \ interacting with the X Window system, and the GNOME environment in particular,\
    \ you are ready for more advanced operations. In the next lesson you will learn\
    \ learn to run built-in X Window applications and configure your desktop.\n\n\
    # SUMMARY\n\n+   - The X Window system is a graphical user interface, GUI, that\
    \ runs on many UNIX and Linux systems. It allows users to run applications transparently\
    \ across a network.\n- The X Window system is built in layers. The top layer,\
    \ with which the user interacts, is called the Window Manager. By default, Red\
    \ Hat uses the Enlightenment Window Manager with the GNOME environment.\n- Use\
    \ the start command at the command line to start the X Window system. A line in\
    \ the /etc/initabb file directs Linux to start the X Window system automatically.\n\
    - The GNOME environment consists of icons, a panel, windows, and the desktop area.\n\
    - You resize, move, minimize, maximize, and close a window by interacting with\
    \ its border, title bar, and buttons.\n- The GNOME Panel provides access to the\
    \ Main menu and icons for applets One applet is the Pager, which shows the virtual\
    \ desktops and buttons for all the running applications. The panel provides a\
    \ button that hides and shows it.\n- You can configure the Clock applet to display\
    \ the date and the in in 12-hour, 24-hour, or the internal UNIX format.\n\n# REVIEW\
    \ QUESTIONS\n\n+   1. In the X Window client/server model, the system that hosts\
    \ and executes the application is the ____________________.\n  a. client\n  b.\
    \ server\n  c. workstation\n  d. host\n2. The top layer of the X Window system\
    \ is the ____________________.\n  a. X Window kernel\n  b. network manager\n \
    \ c. Window Manager\n  d. window shell"
  merge: -1
  pgno: 448
