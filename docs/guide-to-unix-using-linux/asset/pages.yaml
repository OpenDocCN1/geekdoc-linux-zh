    # Identifying Data Types


    The computer programmer must understand not only what is contained in files, records,
    and fields, but also the format in which it is stored. Are the fields of numeric
    or alphanumeric? Are the fields made up of a combination of numbers and letters?
    How do you treat characters such as tab and new-line? Although it may seem obvious
    that a data item such as a person''s name cannot be added or multiplied, the programmer
    must write code that properly handles and all data items that appear in a program.
    Otherwise, misidentified data generating processing errors. To this do, programmers
    need to identify data types.


    Data may be represented in a Perl program in a variety of ways. You will learn
    these types of data:


    +   - Variables

    - Constants

    - Scalars

    - Arrays

    - Hashes'
