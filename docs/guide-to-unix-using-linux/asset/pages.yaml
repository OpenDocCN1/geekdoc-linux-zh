    # Formatting Text in UNIX


    Text formatting in UNIX involves preparing a text file with embedded typesetting
    commands and then processing the marked-up text file with a computer program.
    This program generates commands for the output device, such as a printer, a monitor,
    or some other typesetter. UNIX''s nroff and rooft commands are often used to process
    the embedded typesetting commands to format the output.


    UNIX users have long used the nroff and rooft commands to produce manuals, corporate
    reports, books, and newspapers. These programs evolved from an earlier program,
    RUNOFF (a utility created in the late 1970s), which read pure text with embedded
    codes to format and print a text-enriched report. An embedded code is a special
    sequence of characters that are included with the regular text in the file. The
    special codes are not printed, but interpreted as commands to perform text formatting
    operations. For example, there are codes to produce boldface font, center text,
    and underline certain lines.


    Using embedded codes in text to produce enriched output provides the advantage
    of not needing additional word-processing programs to produce documents. You can
    use any editor that works with flat files, like vi or Notepad. In addition you
    can use'
  merge: -1
