- img_proc: true
  md: '# chapter 4, lesson A


    Dissection


    +   - f specifies that you are referring to fields.

    - list is a comma-separated list or a hyphen-separated range of integers that
    specifies the field. For example, -f 1 indicates field 1, -f 1,14 indicates fields
    1 and 14, and -f 1-14 indicates fields 1 through 14.

    - d indicates that a specific character separates fields.

    - char is the character used as the field separator (delimiter), for example,
    a comma. The default field delimiter is the Tab character.

    - file1, file2 are the files from which you want to cut columns or fields.

    - c references character positions. For example, -c 1 specifies the first character
    and -c 1,14 specifies characters 1 and 14.


    Recall the vegetables and bread files in Becky''s home directory. She also has
    the meat files. When she uses the command vegetable bread meats > food, the contents
    of the file are:


