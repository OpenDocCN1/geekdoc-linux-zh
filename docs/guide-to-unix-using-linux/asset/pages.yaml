  md: '# UNIX File Processing


    include directories and special files, such as character files and block files.
    Chapter 2 explained that directories are system files for maintaining the structure
    of the system. Character special files are related to serial input/output devices,
    such as printers. Block special files are related to devices, such as disks.


    # File Structures


    Files can be structured in several ways. For example, UNIX stores data, such as
    letters, product records, or vendor reports, in flat ASCII files. A programmer
    structures a file depending on the kind of data it stores. Three kinds of regular
    files are unstructured ASCII characters, records, and trees. Figure 4-1 illustrates
    these three kinds of regular files.


    ![](img/6ed9bb33c68863516b7a954081187e3b_118_0.png)


    Figure 4-1: Three kinds of regular files'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# chapter 4, lesson A


    Figure 4-1(a) shows a file that is an unstructured sequence of bytes and a typical
    example of a text file. This file structure gives you the most flexibility in
    data entry, because you can store any kind of data in any order. However, you
    can only retrieve the data in the same order, which may limit its overall usefulness.
    For example, suppose you list Worldwide Hotel''s vendors in an unstructured ASCII
    file. It would be convenient to only view or print the entire list, not just the
    vendor names or vendor managers.


    Figure 4-1(b) shows data as a sequence of fixed-length records, with having some
    internal structure. In this structure, UNIX reads the data as fixed-length records.
    Although you must enter data as records, you can also manipulate and retrieve
    the data as records. For example, you can select certain vendor records to retrieve
    from the file.


    The third kind of file, illustrated in Figure 4-1(c), is structured as a tree
    of records, not necessarily of the same length. Each record contains a key field,
    such as a record number, in a fixed position within the record. The key field
    sorts the tree, so you can quickly search for a record with a particular key.
    For example, you can quickly find the record for Triumph Motors by record #1203.


    # Processing Files


    When performing commands, UNIX processes data—it receives input from the standard
    input device (your keyboard) and then sends output to the standard output device
    (your monitor). System administrators and programmers refer to standard input
    as `stdin`. They refer to standard output as `stdout`. (The third output is called
    standard error, or `stderr`. When UNIX detects errors in processing system tasks
    and user programs, it directs the errors to `stderr`, which is the screen by default.)


    You can use the redirection operators to save the output of a command or program
    in a file, or use a file as an input to a process. The redirection operators,
    therefore, help you process files.


    # Using Input and Error Redirection


    You can use redirection operators (`>`, `>>`, `2>`, `<`, and `<`) to retrieve
    input from something other than the standard input device and to send output to
    something other than the standard output device.


    You already used the output redirection operators in Chapter 1 when you created
    a new file by redirecting the output of several commands to files. Redirect output
    when you want to store the output of a command or program in a file. For example,
    recall that you used the `ls` command to list the files in a directory, such as
    `/home`. The `ls` command sends output to `stdout`, which by default is the screen.
    To redirect the list to a file named `homdir.list`, use the redirection symbol
    by typing `ls > home-dir`.


    You may also redirect the input to a program or command with the `<` operator.
    For instance, a program that accepts keyboard input may be redirected to read
    information from a file instead. In the following steps you create a file for
    the editor to read its commands from, instead of reading them from the keyboard.'
  merge: -1
  pgno: 119
