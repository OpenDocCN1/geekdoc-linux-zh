    # # SUMMARY


    +   - Perl is being extensively used as a powerful text-manipulation tool similar
    to awk.

    - Perl is written in scripts that are translated and executed by the Perl program.

    - The programmer has to write process handling instructions for data items to
    prevent misidentification of data types and subsequent processing errors.

    - Perl has three basic data types: scalars, arrays, and hashes. A scalar is a
    simple variable, such as a number or a name. Scalar variable names begin with
    $. Arrays are ordered lists of scalars that are accessed with numeric subscripts,
    staring at zero [0]. Array variable names are preceded by the sign, @. Hashes
    are unordered sets of key/value pairs that you can access using the keys as subscripts.
    Hash variables begin with the percent sign, %.'
