  md: '# Preparing the Hard Disk


    Before you can install Linux on your hard drive, you must make room for its partitions.
    This procedure deletes the existing partitions on your hard drive, so the Linux
    installation program can create its own partitions.


    > > Caut: As stated before, this type of installation erases everything on your
    hard drive. If you have data you wish to keep, perform a backup now. Removing
    your existing partitions permanently erases everything currently stored on your
    hard drive. You cannot recover data from the disk after you complete these steps!


    For these steps you need a blank floppy disk. (Do not use the Red Hat disk you
    created earlier.) To remove your existing partitions:


    +   1 Insert a blank floppy disk in drive A.

    2 Click the Start, then point to Programs.

    3 Click MS-DOS Prompt on the Programs menu. An MS-DOS window appears.

    4 After the C:\Windows> prompt, type format a:/s and press Enter. You are asked
    to insert a new disk for drive A and press Enter. Since the disk is already inserted,
    press Enter. Execution of this command takes several minutes. The disk is formatted,
    you are asked for a volume label. Press Enter Next. You are asked if you wish
    to format another disk. n and then press Enter.

    5 When the format command finishes, type cd command and press Enter. Your prompt
    changes to C:\Windows\Command>.

    6 After the prompt, type copy fdisk.exe a: and press Enter.

    7 With the disk in drive A:, restart your computer.

    8 After the A:\> prompt, type fdisk and press Enter. If a message asks you want
    to enable large disk support, type N for no and then press Enter. You see the
    DOS Fdisk menu.

    9 Option 4 on the menu reads, "Display partition information." Type 4 and press
    Enter to select this option.

    10 On the next screen you see a list of partitions. Under the "Type" column you
    see the type of each partition. You may see any of these types: primary-DOS, non-DOS,
    extended partitions, and logical drives. Under the "Volume Label" column you see
    the volume labels of each labeled partition. Note each type of partition listed
    and its volume label. You will need this information later.

    11 Press Esc to return to the main Fdisk menu.

    12 Option 3 on the menu reads "Delete partition or logical DOS drive." Type 3
    and press Enter to select this option.'
  merge: -1
  pgno: 525
- img_proc: true
  md: '# How to Install Red Linux 6.0


    You now see a menu of options to delete partitions. Each option lets you delete
    a different type of partition. Because you are installing Linux as the operating
    system, you delete all partitions you saw while completing Step 10. For example,
    to delete the primary DOS partition, you must select option 1 from the menu, so
    type 1 and press Enter. You see a screen that displays partition information and
    a message warning that you will lose data in the deleted primary DOS partition.
    You are asked, “What partition do you want to delete?” Type the partition number
    and press Enter. Next, you are asked to enter the partition''s volume label in
    the "Partition" column. If the partition does not have a volume label, type it
    and press Enter. If the partition has a volume label, simply press Enter. You
    see a message that asks, “Are you sure (Y/N)?” Type Y and press Enter. This deletes
    the partition (along with data previously stored there), and you see the main
    Fdisk. You must repeat this step for each partition on the disk.


    Now you have removed all previously installed partitions and erased the hard drive''s
    contents. Press Esc to exit the Fdisk program. You are ready to begin the Red
    Hat installation described in the next section.


    # Installing Red Linux 6.0


    The Red Hat installation program runs in “text mode” but displays screens that
    look like dialog boxes with buttons, scrolling lists, and other items common to
    graphical user interfaces. Although the program does not use a mouse, you can
    easily select and activate buttons with keystrokes. Here is a summary of the keystrokes
    used during the installation process:


    +   * Tab key: Highlights the next item on the screen

    * Alt+Tab: Highlights the previous item on the screen

    * Up-arrow and down-arrow: Scrolls through a list of selections, or move to the
    next item on the screen

    * Spacebar: Selects the currently highlighted item, or deselects it if it is already
    selected

    * Enter: Presses the highlighted button


    You typically find these types of buttons on an installation screen:


    +   * OK: Accepts the values entered on the screen and moves to the next screen

    * Cancel: Cancels the current operation or the installation process

    * Yes: Answers “yes” to the question that appears on the screen

    * No: Answers “no” to the question that appears on the screen

    * Back: Moves back to the previous screen'
