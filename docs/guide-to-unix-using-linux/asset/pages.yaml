  md: '# # LESSON B objectives


    After studying this lesson, you should be able to:


    +   - Compare and contrast the features of Emacs and the vi editor

    - Become familiar with the most important Emacs editor commands

    - Create and edit simple documents using the Emacs editor


    # # The Emacs Editor


    # Using the Emacs Editor


    Emacs is another UNIX text editor that has gained popularity but, due to its complexity,
    continues to run second to the vi editor. Unlike vi, Emacs is not modal: it does
    not switch from command mode to insert mode. This means that you can enter a command
    without verifying that you are in the proper mode. Although Emacs is more complex
    than vi, it is more consistent. For example, you can enter most commands by pressing
    Alt or Ctrl key combinations.


    Emacs also supports a sophisticated macro language. A macro automates a complex
    task. Think of a macro as a "super instruction". Emacs also has a powerful command
    syntax and extensions. Its packaged set of customized macros lets you read electronic
    mail and news, and edit the contents of directories. Emacs is reputed to have
    more features than any other UNIX program. You can start Emacs by learning its
    common commands. Table 3-3 lists these commands.


    | Alt command | Purpose | Ctrl command | Purpose |

    | Alt+< | Move cursor to start of file | Ctrl+@ | Mark the cursor location. After
    moving the cursor, you can move or copy text to the mark. |

    | Alt+> | Move cursor to end of file | Ctrl+A | Move cursor to start of line |

    | Alt+B | Move cursor back one word | Ctrl+B | Move cursor back one character
    |

    | Alt+D | Delete current word | Ctrl+D | Delete the character under cursor |


    Table 3-3: Common Emacs commands'
