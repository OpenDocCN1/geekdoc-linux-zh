  md: '# Introduction


    Guide to UNIX Using Linux introduces the fundamentals of the UNIX operating system
    to the PC user. UNIX is “the operating system of the Internet,” powerful and flexible
    enough for both servers and desktop computers. Taking a hands-on, practical approach,
    this book guides you through the basics of UNIX system concepts, architecture,
    and administration. You practice these basic concepts and approaches using Linux,
    a PC-compatible clone of UNIX that is an ideal tool for mastering UNIX commands.
    The book achieves its goals with a proven combination of tools that powerfully
    reinforce both concepts and real-world experience.


    This book includes:


    +   - RedHat Linux 6.0 and complete installation instructions

    - Comprehensive review and end-of-chapter material, including a command summary,
    review questions, hands-on exercises, and case projects, which let you practice
    and master skills as you learn them

    - Step-by-step instructions to teach UNIX commands, shell programming, database
    management, text editing, C programming, debugging, and rapid application development
    using UNIX tools such as awk, sed, and perl

    - A proven method to provide a working knowledge of basic system requirements
    and how to achieve them


    In addition, the text is carefully structured, clearly written, and accompanied
    by graphics that provide the visual reinforcement element to learning. For instructors
    using the book in a classroom, a special CD-ROM is available that includes an
    instructor’s manual and an online testing system. Contact customer service or
    your sales representative to obtain a copy of the CD-ROM.


    Coverage is balanced, with one chapter building on the skills and knowledge acquired
    in the preceding chapters. Operating systems, and UNIX and Linux in particular,
    are introduced in Chapter 1, along with essential information such as using shells,
    entering commands, and understanding the role of the system administrator. Chapter
    2 explores the UNIX file system—partitions and directories—how to navigate it.
    Chapter 3 focuses on instruction using the vi and Emacs editors. Chapter 4 explains
    the UNIX approach to file processing, while Chapter 5 covers advanced file processing
    concepts. Chapters 6 and 7 introduce you to shell programming, and Chapter 8 provides
    practice with UNIX utilities. Chapters 9 and 10 teach programming tools such as
    awk, sed, perl, and C/C++. Chapter 11 covers a recent development in UNIX: the
    X Window system, which provides a graphical user interface for UNIX.'
