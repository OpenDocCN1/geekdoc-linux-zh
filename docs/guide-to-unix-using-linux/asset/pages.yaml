  md: '# Developing UNIX Applications in C and C++


    Unlike higher level languages, C does not provide a specific data type for characters.
    C requires that strings the same way the computer does, as an array of characters.
    Here is how you might declare a char array to store a string:

    char name[20];


    This is just declaring a char variable, except for the [20] appended to the variable
    name. It indicates that name should be an array of 20 characters. It is large
    enough to hold a string of just up to 19 characters. This is in C all strings
    are terminated with a null character. A null character is a single byte where
    all bits are set to zero.


    # Including Identifiers


    Identifiers are names given to variables and functions. When naming variables
    and functions, resist the temptation to use short names that do not convey the
    meaning of the item. Using meaningful identifiers greatly enhances the style of
    your program. There are only few rules to remember:


    +   - The first character must be a letter or an underscore (the _ character).

    - After the first character you may use letters, underscores, or digits.

    - Variable names may be limited to 31 characters, and some compilers require the
    first 8 characters of variable names to be unique.

    - Uppercase and lowercase characters are distinct.


    These are all examples of legal identifiers:

    radius

    customer_name

    earnings_for_2000

    _my_name


    # Declaring Variables


    You must declare all variables before you use them in a program. A declaration
    begins with a data type and is followed by one or more variable names. Here is
    an example:


    int days;


    This example declares a variable named days. Its data type is int, so days is
    large enough to hold any value that fits within the range of an int. Notice that
    the declaration ends with a semicolon, as all complete C statements.


    You can declare multiple variables of the same type on the same line. Here is
    an example:


    int days, months, years;


    This example declares three variables, each of type int, named days, months, and
    years. Notice that commas separate the names.'
