  md: '# chapter 4, lesson A


    # Manipulating Files


    When you manipulate files, you work with the files themselves as well as their
    contents. This section explains how to complete the following tasks:


    +   - Create files

    - Delete files

    - Copy files

    - Move files

    - Find files

    - Display files

    - Combine files

    - Cut and paste file contents

    - Sort files


    # Creating Files


    You can create a new file by using the output redirection operator (>). You learned
    how to do this to redirect the cat command''s output in Chapters 1–3. You can
    also use this redirection operator without a command to create an empty file.


    | To create an empty file |

    | 1 After the $ command prompt, type > newfile1 and press Enter. |

    | This creates an empty file called newfile1. |

    | 2 To list the new file, type ls -l newfile1 and press Enter. |

    | You see only the information listed next, where jean is your user name. |

    | -rw-rw-rw---- 1 jean 0 Nov 1 16:57 newfile1 |

    | 3 To create another new file, type > newfile2 and press Enter. |


    You may also use the touch command to create empty files. For example, the following
    command creates the newfile3, if the file does not already exist.

    touch file3


    The primary purpose of the touch command is to change a file''s time and date.
    UNIX maintains the following date and time information for every file:


    +   - Change date and time: the date and time the file''s inode was last changed

    - Access date and time: the date and time the file was last accessed

    - Modification date and time: the date and time the file was last modified


    Although the touch command cannot alter a file''s inode changed date and time,
    it can alter the file''s access and modification dates and times. By default,
    it uses the current date and time for the new values.'
  merge: -1
  pgno: 121
