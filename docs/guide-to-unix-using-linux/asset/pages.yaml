  md: '# LESSON A objectives


    In this lesson you will:


    +   - Define the classifications of the UNIX utility programs

    - Duplicate a floppy disk

    - Create a "bootable floppy" to boot the system in case of emergency

    - Determine hard disk usage and available free space

    - Locate and remove unnecessary files from the hard disk

    - Display the CPU status and internal memory usage


    # Using the UNIX Utilities


    In this chapter, you continue to explore UNIX utilities. Utilities are designed
    to provide basic services to UNIX users, just like your local utility companies
    provide basic services (e.g., electricity and running water) to your community.
    This chapter lets you practice using UNIX commands and utilities, such as using
    the man command with UNIX text formatting utilities. Before you can begin to carry
    out your assigned tasks for Dominion Consulting, you need to learn more about
    UNIX utilities.


    # Understanding UNIX Utilities


    UNIX utilities let you create and manage files, run programs, produce reports,
    and generally interact with the system. Beyond these basics, the utility programs
    offer a full range of services that let you monitor and maintain the system and
    recover from a wide range of errors. UNIX utilities are classified into seven
    major function dictated by user needs: file processing, networking, communications,
    system status, programming, source code management, and miscellaneous. UNIX utilities
    are programs, but they are usually referred to as commands.


    > Note: For the sake of completeness, this chapter contains some references and
    commentary about utilities in general, but it concentrates on those utilities
    that relate to file processing, system status, and miscellaneous tasks.


    Utility programs are distinguished from other operating system programs in that
    they are "add-ons" and not part of the UNIX shells or a component of the kernel.
    Utilities are also unique because they are exclusively dedicated to improving
    computer performance for the benefit of users. New programs are continually being
    added as developers find better and faster ways to make UNIX run more efficiently.
    Finally, most UNIX utilities are small programs that often consist of only one
    command.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Classifying UNIX Utility Programs


    Utilities can be classified in several categories, as some work exclusively with
    UNIX files, others handles network tasks, and still others are designed to help
    programmers. File processing utilities, listed in Table 8-1, is the largest category.
    These utilities display and manipulate files.


    | Utility | Brief Description of Function |

    | afio | Creates an archive and restores files from archive |

    | awk | Processes files |

    | cat | Displays or joins files |

    | cmp | Compares two files |

    | comm | Compares sorted lists and shows differences |

    | cp | Copies files |

    | cpio | Copies and backs up files to an archive |

    | cut | Selects characters or fields from input lines |

    | dd | Copies and converts input records |

    | diff | Compares two files and shows differences |

    | fformat | Formats a floppy disk at a low level |

    | find | Finds files within file tree |

    | fmt | Formats text very simply |

    | grep | Matches patterns in a file |

    | groff | Processes embedded text formatting codes |

    | gzip | Compresses or decompresses files |

    | head | Displays the first part of a file |

    | ispell | Checks one or more files for spelling errors |

    | less | Displays text files (pauses when screen is full) |

    | ln | Creates a link to a file |

    | lpr | Prints file (hard copy) |

    | ls | Lists file and directory names and attributes |

    | man | Displays documentation for commands |


    Table 8-1: File processing utilities'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# chapter 8, lesson A


    | Utility | Brief Description of Function |

    |---|---|n| mkdir | Creates a new directory |

    | mkfs | Builds a UNIX file system |

    | mv | Renames and moves files and directories |

    | od | Formats and displays data from a file |

