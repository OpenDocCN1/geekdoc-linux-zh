    moves you to the /var/spool/mail subdirectory.

    - Type cd and press Enter. The change directory command (cd) without arguments
    returns you to your home directory.


    UNIX refers to a path as either an absolute path or a relative path. An absolute
    path begins at the root level and lists all subdirectories to the destination
    file. For example, assume Becky has a directory named lists, located under her
