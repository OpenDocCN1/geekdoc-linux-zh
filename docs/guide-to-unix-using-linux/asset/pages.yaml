  md: '# LESSON B

    objectives


    After studying this lesson, you should be able to:


    +   - Design a new file processing application

    - Design and create files to implement the application

    - Use awk to generate formatted output

    - Use cut, sort, and join to organize and transform selected file information

    - Develop customized shell scripts to extract and combine file data

    - Test individual shell scripts, and combine all scripts into a final shell program


    # Using UNIX File Processing Tools

    To Create an Application


    # Designing a New File Processing Application


    The most important phase in developing a new application is creating a design.
    The design defines the information an application needs to produce. The design
    also defines how to organize this information into files, records, and fields,
    which are logical structures, because each represents a logical entity such as
    a payroll file, an employee pay record, or an employee social security field.
    Files consist of records and records consist of fields.


    Now you''re ready to create the Programmer Activity Status Report for Dominion
    Consulting. The report will show programmers'' names and the number of projects
    that each programmer is working on. Start by designing and creating the files,
    including the records and fields, and then using advanced file processing commands
    to select, manipulate, and format information in the report.


    # Designing Records


    The first task in the design phase is to define the fields in the records. These
    definitions take the form of a record layout that identifies each field by name
    and data type (such as numeric or non-numeric). Define the design file to store
    only those fields relevant to the record''s primary purpose. For example, you
    need two files for Dominion Consulting: one for programmer information and another
    for project information. Include a field for the programmer''s name in the programmer
    record and a field for the project description field in the project file record.
    Do not store a programmer''s name in the project file, even though the programmer
    may be assigned to the project. Conversely, do not store project names in the
    programmer files.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'Allocating only the space needed for the records’ necessary fields keeps records
    brief and to the point. Short records, like short sentences, are easier to understand.
    Likewise, the simpler you make your application, the better it performs. However,
    make sure to include a field that uniquely identifies each record in the file.
    For example, the programmer record includes a programmer number field to separate
    programmers who may have the same name.


    Note: The programmer number field in the programmer file record should be numeric.
    Numeric fields are preferable to non-numeric fields for uniquely identifying records,
    because the computer interprets numbers faster than non-numeric fields. The project
    record can use a non-numeric project code to uniquely identify each project record,
    because Dominion project codes contain letters and numbers (EA-100).


    # Linking Files with Keys


    Multiple files are joined by key—a common field that each of the linked files
    share. Another important task in the design phase is to plan a way to join files,
    if necessary. For example, the programmer-project application uses the programmer’s
    number to link the programmer to the project file. Add the programmer’s number
    field to the project record to link programmers to projects.


    Note: The flexibility to gather information from multiple files, comprised of
    simple, short records, is the essence of a relational database system. UNIX includes
    several file processing commands that provide some of this relational database
    flexibility. You will implement some of these commands in this lesson.


    Before you begin to create files for the application, review the record layouts
    for the programmer and project files illustrated in Figure 5-1.'
  merge: -1
