    file.

    * The tail command shows the last few lines of a file. Like the head command,
    tail displays 10 lines by default. Type tail /etc/termcap and press Enter to see
    the last 10 lines of the /etc/termcap file.

    * The -n option specifies the number of lines the tail command displays. Type
    tail -n 5 /etc/termcap and press Enter. You see the last five lines of the /etc/termcap
    file.


    # Redirecting Output


    In UNIX, the greater than sign ( > ) is called the redirection symbol. You can
    use the redirection symbol to create a new file or overwrite an existing file
    by attaching it to a command that produces output. In effect, you "redirect" the
    output to a file instead of the monitor. You already used the command to find
    out who was logged on the system at Dominion. Now you can use the same command
    with the redirection symbol to save this information in a text file.'
