    # Understanding the Standard Tree Structure


    The tree-like structure for UNIX file systems starts at the root level. **Root**
    is the name of the file at this basic level, and it is denoted by the slash character
    (/). The slash represents the **root directory**.

    A **directory** is a special kind of file that can contain other files and directories.
    Regular files store store information, such as records of employee names and addresses
    or payroll information, while directory files store the names of regular files
    and the names of other directories, which are called **subdirectories**. The subdirectory
    is considered the *child* of the *parent* directory because the child directory
    is created within the parent directory. In Figure 2-1, the root directory (/)
    is the parent of all the other directories. The home directory, for example, is
    the parent of the jean, tricia, and joseph subdirectories.'
