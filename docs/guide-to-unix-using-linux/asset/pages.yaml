  md: '# UNIX File Processing


    To create a file and alter its date/time stamp with the touch command:


    +   1 Type touch newfile3 and press Enter. This command creates the file newfile3.

    2 Type Is -l newfile3 and press Enter. You see a long listing for the newfile3
    file. Note its modification date and time.

    3 Wait at least one minute.

    4 Type touch newfile3 and press Enter. This updates the file''s access and modification
    date and time stamps with the system and date.

    5 Type Is -l newfile3 and press Enter. Look at the file''s modification time.
    It should be different now.


    Table 4-1 lists and describes the touch command''s options.


    | Command option | Description |

    | --- | --- |

    | -a | Updates the access time only |

    | -m | Updates the modification time only |

    | -c | Prevents touch from creating the file if it does not exist |


    Table 4-1: Touch command options


    # Deleting Files


    When you no longer need a file, you can delete it using the rm (remove) command.
    If you use rm without options, UNIX deletes the specified file without warning.
    If you use the -i (interactive) option to have UNIX warn you before deleting the
    file. You can use the rm command to delete the new files you just created.


    To delete a file from the current directory:


    +   1 After the $ command prompt, type rm newfile1 and press Enter. This permanently
    deletes newfile1 from the current directory.

    2 Type rm -i newfile2 and press Enter. You see the message, "remove ''newfile2?''".

    3 Type y for yes and press Enter.'
