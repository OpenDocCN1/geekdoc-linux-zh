  md: '# UNIX File Processing


    The -a option tells the command to print a line for each unpairable line in the
    file number. In this case, line prints for each vendor record that does not match
    a product record.

    The -e option lets you display a message for the unmatched (-a 1) record, such
    as "No Products.".

    The -o option sets the fields that will be output when a match is made.

    The 1.2 indicates field two of the vendors file is to be output along with 2.2,
    field two of the products file.

    The -t option specifies the field separator, the colon: This command redirects
    its output to a new file, vreport. The cat command displays the output on the
    screen.

    The report contains this information:


    +   Cromwell Interiors:Lobby Furniture

    Design Extras Inc.:Bathroom Specialties

    Piedmont Plastics Inc.:Poolside Carts

    Morgan Catering Service Ltd.:Formal Dining Privs

    Pullman Elevators:No Products

    Johnson Office Products:No Products


    # A Brief Introduction to Awk


    Awk, a pattern-scanning and processing language, helps to produce professional-looking
    reports. Although you can use the cat and more commands to display the output
    file that you create with your join program, the awk command (which starts the
    awk program when you type it in the command line) does the same thing as that
    more quickly and easily. The syntax of the awk command is:


    ```

    awk [--Ffsep] ''pattern (action).'' filenames

    ```


    +   awk checks if the input records in the specified files satisfy the pattern
    and, if they do, the awk executes the action associated with it. If no pattern
    is specified, the action affects every input record.

    -F: means the field separator is a colon.


    > To generate and format the vendor report:

    After the $ command prompt, type awk -F: ''{printf "-28s\t%s\t%s\n", $1,$2}''
    vreport and then press Enter. This command is explained in detail after Step 2.'
