    # Using the Join Command


    The join command differs from the other file processing commands in this chapter,
    because it is used in relational database processing. Relational databases consider
    files as tables and records as rows. They also refer to fields as columns that
    can be joined to create new records. The join command is the UNIX method that
    lets you extract information from two files sharing a common field.'
