- img_proc: true
  md: '# Introduction to Shell Programming


    To accomplish this chapter’s case project, you will learn about these programming
    features of the UNIX shell:


    +   - **Shell variables:** Your scripts often need to keep values in memory for
    later. Shell variables are symbolic names that can access values stored in memory.

    - **Operators:** Shell scripts support many operators, including those for performing
    mathematical operations.

    - **Logic structures:** Shell scripts support sequential logic (for performing
    a series of commands), decision logic (for branching from one point in a script
    to another), and case logic (for choosing an action from several possible alternatives).


    In addition, you will learn special commands for formatting screen output and
    positioning the cursor.


    Before you begin writing shell scripts, you should understand the program development
    cycle.


    # The Program Development Cycle


    The process of developing an application is known as the **program development
    cycle**. The steps involved in the cycle are the same, whether you are writing
    shell scripts or high-level language programs.


    The process begins by creating program specifications—the requirements the application
    must meet. The specifications determine what data the application takes as input,
    the processes that must be performed on the data, and the correct output.


    After you determine the specifications, the design process begins. During this
    process, programmers create file formats, screen layouts, and logical algorithms
    (procedures) that the program will use. Programmers use a variety of tools to
    design complex applications. In the next chapter, you will study flowcharts and
    pseudocode, two important program design tools.


    After the design process is complete, programmers begin writing the actual code,
    which they must then test and debug. When they find errors, they must correct
    them and begin the testing process again. This procedure continues until the application
    performs satisfactorily.


    Figure 6-1 illustrates the program development cycle.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '![](img/6ed9bb33c68863516b7a954081187e3b_195_0.png)


    **Figure 6-1:** Program development cycle


    # Using High-Level Languages


    Computer programs are instructions often written using a high-level language like
    COBOL, C, or C++. A high-level language is a computer language that uses English-like
    expressions. For example, the following COBOL statement instructs the computer
    to add 1 to the variable COUNTER:


    ADD 1 TO COUNTER.


    Here is a similar statement, written in C++:


    ```

    counter = counter + 1;

    ```'
