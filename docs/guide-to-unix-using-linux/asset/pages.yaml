    # Binary Files


    Computers are not limited to processing ASCII codes. To work with graphic information,
    such as icons, illustrations, and other images, binary files can contain strings
    of bits representing black and white dots, where each black dot represents 1 and
    each white dot represents 0. Graphics files include patterns–rows and columns
    of dots'
