  md: '# Looping Logic


    In **looping logic**, a control structure (or loop) repeats until some condition
    exists or some action occurs. You will learn two looping mechanisms in this section:
    the for loop and the while loop.


    You use the **for** command for looping through a range of values. It causes a
    variable to take on each value in a specified set, one at a time, and perform
    some action while the variable contains each individual value. The loop stops
    after the variable has taken on the last value in the set and has performed the
    specified action with that value.


    +   To demonstrate looping logic:

    1. Create the file our_users with vi or Emacs.

    2. Type the following lines into the file:

    ```

    for USERS in john ellen tom becky eli jill

    do

    echo $USERS

    done

    ```

    3. Save the file and exit the editor.

    4. Give the file execute permission, and run it. Your screen appears similar to
    Figure 6-3.


    ![](img/6ed9bb33c68863516b7a954081187e3b_211_0.png)


    The for statement you typed in Step 2 specifies that the variable USERS take on
    the values john, ellen, tom, becky, eli, and jill. Because there are six values
    in the set,'
  merge: -1
