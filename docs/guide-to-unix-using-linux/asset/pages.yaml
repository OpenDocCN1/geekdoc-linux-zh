  md: '# LESSON B objectives


    In this lesson you will:


    +   - Create an HTML document for the World Wide Web

    - Use Perl and CGI scripts to make your Web pages interactive

    - Use X-Window and Netscape to retrieve Web pages


    # Creating an Interactive Web Page


    # Setting Up a Web Page


    You can create a Web page using HTML (Hyper Text Markup Language). HTML is a format
    for creating documents with embedded codes known as `tags`. When the document
    is viewed in a Web browser, such as Netscape Navigator or Internet Explorer, the
    tags give the document special properties. Examples of properties include foreground
    and background colors, font size and color, and the placement of graphic images.
    In addition, HTML tags let you place hyperlinks in a document. A hyperlink is
    text or an object that, when clicked, loads another document and displays it in
    the browser.


    After you use HTML to create a Web page, you then publish the page on a Web server.
    A Web server is a system connected to the Internet running Web server software,
    such as Apache. The Web server lets other users access the HTML document via the
    Internet.


    You may experiment with and test HTML documents using your Linux system''s loopback
    networking feature. The loopback allows your UNIX or Linux systems to access its
    own internal network configuration of an external network. To use the loopback,
    you do not need to be connected to any network. Importantly, the loopback can
    emulate a real-world Web site, so you can carry out the testing and development
    of your new Web pages. Stand-alone testing of new Web pages is recommended: after
    fully testing your work, you can then transfer your documents to any Web server,
    knowing that they are ready to perform.


    > To run the Web pages and CGI programs in this lesson, you must have the Apache
    Web Server program installed on your Linux Computer. (See Appendix C for instructions
    on installing Apache.)'
