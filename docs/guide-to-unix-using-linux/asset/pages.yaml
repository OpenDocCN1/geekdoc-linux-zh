    # Assembling Extracted Information


    As you have seen, command-line entries can become long, depending on the number
    of options you need to use. You can use the shell''s command-line history retrieval
    feature to recall and re-execute past commands. This feature works well for you,
    but others who need to execute your commands cannot access them repeatedly. MS-DOS
    users resolve this problem by creating batch files. UNIX users do the same: they
    create script files to contain command-line entries. These can be run sequentially
    as a set. A good candidate for a script file is the series of cut, paste, and
    sort commands that you entered in Lesson A. You can use the vi editor to create
    the script file and then make the script executable using the chmod command with
    the x argument.


