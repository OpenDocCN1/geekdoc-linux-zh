  md: '# Introduction to Shell Programming


    the loop repeats six times. Each time it repeats, USERS contains a different value
    from the set, and the statement between the do and done statements is executed.
    The first value in the set is john, so the echo statement executes the first time
    with john stored in. That is why john appears on the screen. The second time the
