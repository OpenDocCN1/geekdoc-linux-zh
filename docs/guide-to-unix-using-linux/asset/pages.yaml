    \ including Red Hat, offer you the option to \"install everything\" from their\
    \ CD-ROM and store most of these files in the usr partition. This is true of other\
    \ UNIX systems as well. Software development tools such as language compilers,\
    \ shared libraries, and header files needed for program creation are also stored\
    \ in a hierarchy of subdirectories starting at /usr.\n\n# /home Partition\n\n\
    \ /home partition is the storage space for all users' work. If the root partition\
    \ (or any other partition) crashes, a /home partition ensures that you do not\
    \ lose all the users' information. Although regular user accounts are restricted\
    \ from reading information in other partitions, you own and can access most files\
    \ in your home directory. You can grant or deny access to your files as you choose.\
    \ See \"Setting File Permissions\" later in this chapter for more information\
    \ on file ownership.\n\nThe size of the partition on a system for all users' home\
    \ directories depends on how many users the system supports. Thirty users probably\
    \ need a total of 3000 MB, that is, 3 GB (billion characters). This scheme gives\
    \ users an average of 100 MB to store their work. The space allocated depends\
    \ on how much data each user needs to store.\n\n# The swap Partition\n\nSwap partitions\
