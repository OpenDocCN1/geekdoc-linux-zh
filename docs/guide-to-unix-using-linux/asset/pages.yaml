    # Using Pipes


    As you have seen, UNIX commands take their input from stdin (the standard input
    device) and send their output to stdout (the standard output device). You have
    also used the > operator to redirect a command''s output from the screen to a
    file, and the < operator to redirect a command''s input from the keyboard to a
    file. The pipe operator (|) redirects the output of one command to the input of
    another command. The pipe operator is used in the following manner:


    ```

    first_command | second_command

    ```


    The pipe operator connects the output of the first command with the input of the
    second command. For example, the output of the ls command is commonly redirected
    to the more command. This technique allows you to scroll through a directory listing
    that does not fit on a single screen.


    # To redirect the output of the ls command to the more command:


    +   1. Type ls -l /etc and press Enter. The output of the command scrolls quickly.

    2. Type ls -l /etc | more


    Notice the output fills the screen and pauses with the prompt "—More—" displayed
    on the bottom line. Each time you press the spacebar, the output advances to the
    next screen. Press the spacebar until the command has finished.


    The pipe operator can connect several commands on the same command line, in the
    following manner:


    ```

    first_command | second_command | third_command . . .

    ```


    # To connect several commands with the pipe operator:


    +   * Type ls /etc sort -r | more and press Enter. This command redirects the
    directory listing of /etc directory to the sort -r command. sort -r sorts the
    directory listing in reverse order. The sort command''s output is redirected to
    the more command.


    See the directory listing of /etc in reverse order, one screen at a time.'
