    # Formatting Output


    Chapter 4 introduced the awk command, which simplifies preparation of formatted
    output. Awk is actually a full-featured programming language and requires a chapter
    unto itself. The limited presentation here explains only the use of the printf
    action within the awk command, which formats output. The printf function has the
    syntax:


    # Syntax

    Dissection


    ```

    printf(format, expr1, expr2, expr3 ...)

    ```


    +   - expr1, expr2, expr3 are expressions that represent data fields. These expressions
    typically take the form $1, $2, $3. In the programmer file, the expression $1
    indicates the programmer number (the first field), $2 indicates the programmer''s
    last name (the second field), and $3 indicates the programmer''s first name (the
    third field).


    You can use the awk command and printf function to print the programmer_number,
    programmer last name, and programmer first name, all-justified.


    # To print three fields:


    +   - After the $ command prompt, type awk -F: ''printf %%d %%-12.2s %%-10.1sn"
    $1,$2,$3'' programmer and press Enter.


    Each % symbol in the format string corresponds to a $ field: The %d specifies
    how to display the $1 field, the %-12.2s specifies how to display the $2 field,
    and %-10s specifies how to display the $3 field. Here is a breakdown of each specifier:


    +   %d indicates that field $1 is to appear in decimal digits.'
