    # Roles of the System Administrator and Ordinary Users


    # Understanding the Role of the UNIX System Administrator


    There are two types of users on a UNIX system: the system administrator and ordinary
    users. As the name suggests, the **system administrator** manages the system by
    adding new users, deleting old accounts, and ensuring that the system performs
    well and efficiently for all users. **Ordinary users** are all other users. The
    system administrator is also called the *superuser*, because the system administrator
    has unlimited permission to alter the system. UNIX grants this permission when
    the operating system is initially installed. The system administrator grants privileges
    and permissions to regular users.


    The system administrator has a unique user name: **root**. The system administrator
    owns the root account, which no one else can be assigned to that account. The
    password for the root account is confidential; only the system administrator and
    a back-up person know it. If the root''s password is lost or forgotten, the system
    administrator uses an emergency rescue procedure to reset the password.


    # The System Administrator''s Command Line


    While ordinary users type their commands after the $ (dollar sign) command prompt,
    the system administrator''s prompt is the # (pound) symbol. The UNIX system generates
    a default setting for the command prompt for the system administrator in the following
    format:


    ```

    `root@hostname]#`

    ```


    In the prompt, **hostname** is the name of the computer system administrator logged
    on to.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# chapter 1, lesson B


    # The Ordinary User''s Command Line


    The $ (dollar sign) is traditionally associated with ordinary users. The UNIX
    system generates a default setting for the command prompt for ordinary users.
    The following format is common on Linux systems:


    ```

    user name@hostname]$

    ```


    In the prompt, user name is the user''s login name, such as jean, and hostname
    is the name of the computer user is logged on.


    # Changing Passwords


    Your user name, or login name, identifies you to the system. You may choose your
    own user name and give it to the system administrator, who then adds you as a
    new user. As mentioned before, UNIX recognizes up to eight characters in your
    user name, which is often your first name or nickname. The user name is unique,
    but not confidential, and may be provided to other users. The password, on the
    other hand, is confidential and secures your work on the system. You can change
    your password, if necessary, by using the passwd command. If you do not have a
    password, use the passwd command to create one.


    UNIX lets you change your password only if the new one differs from the old by
    at least three characters; the password has more than five characters, including
    at least two letters and one number; and password is different from your user
    name.


    The password you chose for the Dominion system—Gscott956—is too similar to another
    password on the system, so the system administrator asks you to change it.


    To change your password:


    +   1 Type passwd after the command prompt, and press Enter.

    2 Type your new password and press Enter. Your new password does not appear on
    the screen as you type.

    3 Retype your new password and press Enter so that UNIX can confirm the new password.


    ![](img/6ed9bb33c68863516b7a954081187e3b_37_0.png)


    If the password you retype as confirmation does not match your UNIX password,
    UNIX asks you to enter the password again. UNIX may also ask you to choose a different
    password because you choose one that is too short or too easily guessed, such
    as password.


    After changing your password, you should log out and log on again to make sure
    UNIX recognizes your new password.'
