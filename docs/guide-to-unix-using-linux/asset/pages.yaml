    # Checking Hard Disk Usage


    unix system users, as well as the system itself, create and enlarge files. Eventually,
    unless files are removed, the largest disk runs out of free space. To maintain
    adequate free space, you should use these basic strategies:


    +   Be vigilant against running dangerously low on free space by using the df
    command.


    +   Watch for conspicuous consumption by using the du command.


    +   Follow a routine schedule for “garbage” collection and removal by using the
    rm command.


    Now you use each of these techniques to check hard disk usage.'
