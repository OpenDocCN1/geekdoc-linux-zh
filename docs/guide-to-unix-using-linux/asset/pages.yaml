  md: '# Introduction to Shell Programming


    # Case Logic


    The case logic structure simplifies the selection of a match when you have a list
    of choices. It allows your program to perform one of many actions, depending upon
    the value of a variable. Note the use of two semicolons ( ; ; ) that terminate
    the action(s) after the case matches to the test.


    +   To demonstrate case logic:

    1 Use the vi or Emacs editor to create the mycolors shell script.

    2 Type these lines into the file:

    echo -n "Enter your favorite color: " ; read color

    case "$Color" in

    "blue") echo "As in My Blue Heaven.";";

    "yellow") echo "As in the Yellow Sunset.";";

    "red") echo "As in Red Rover, Red Rover.";";

    "orange") echo "Autumn has shades of Orange.";";

    * ) echo "Sorry, I do not know that color.";";

