  md: '# Introduction


    # Features


    In order to ensure a successful learning experience, this book includes the following
    pedagogical features:


    +   **Learning Objectives:** Every chapter opens with a list of learning objectives
    that sets the stage for you to absorb the lessons of the text.

    **Case Approach:** Each chapter opens with a hypothetical case. You solve the
    problem posed by the case by working through the material in the chapter.

    **Comprehensive Step-by-Step Methodology:** The unique Course Technology methodology
    keeps students on track. The text introduces new concepts, illustrates them through
    examples, and guides you through practice steps to mastery of the material.

    **Tips:** Tips, which are marked with the Tip icon, are used to highlight helpful
    information related to the subject being discussed.

    **Summaries:** Following each chapter is a summary that recaps the concepts covered
    in the chapter, and a table listing the commands and their options.

    **Review Questions:** Each chapter concludes with meaningful, conceptual review
    questions that test students'' understanding of what they learned in the chapter.

    **Exercises:** The review questions are followed by exercises, which provide students
    with additional practice using the skills and concepts they learned in the chapter.

    **Discovery Exercises:** Each chapter concludes with Discovery Exercises, which
    reinforce the chapter concepts and allow for independent study.

    **RedHat Linux 6.0:** Each book is bundled with a copy of Red Linux 6.0. Linux
    is a PC-compatible clone of UNIX that is an ideal tool for many basic and advanced
    UNIX commands. Course Technology does not offer Technical Support for this software.
    However, if there is a problem with the media, please contact customer service
    or sales representative.


    # Supplements


    For instructors using this book in a classroom environment, the following teaching
    materials are available on a single CD-ROM:


    +   **Electronic Instructor''s Manual:** The Instructor''s Manual that textbook
    includes a list of objectives for each chapter, a detailed lecture notes, suggestions
    for classroom activities, discussion topics; and solutions.

    **Course Test Manager 1.2:** Accompanying this book is a powerful assessment tool
    known as the Course Test Manager. Designed by Course Technology, the cutting-edge
    Windows-based testing software helps instructors design and administer tests and
    presets. In addition to being able to generate tests that can be printed and administered,
    this full-featured program also has an online testing component that allows students
    to take tests at the computer and have their exams automatically graded. The test
    bank that accompanies this book contains 50–100 questions per chapter.'
