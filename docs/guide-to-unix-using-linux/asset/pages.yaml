  md: '# Adding Text from Another File


    Sometimes the text you want to include in one file is already part of another
    file. For example, let''s say you want a separate copy of the text in the file
    temp so you can use it to practice editing. Start by creating a new file called
    practice, and then add text from the temp file by using the line-oriented r (read)
    command.


    +   To create a new file and add text from another file:

    1 Type *practice* and press *Enter* to create a new file.

    2 Press *Esc* to make sure you are in command mode.

    3 Type *r temp.*

    Your file should look like the one illustrated in Figure 3-10.


    ![](img/6ed9bb33c68863516b7a954081187e3b_98_0.png)


    Figure 3-10: Adding text from another file


    > The r command copied the text from temp and put it in the current file, practice.
    Notice the blank line at the top of the file.


    +   4 Move the cursor to the blank line, and type *dd* to delete it.


    # Leaving vi Temporarily


    If you want to execute other UNIX commands while you work with vi, you can launch
    a shell or other commands from vi. For example, let''s say you are working on
    your memo for Dominion and want to check the current date quickly.'
