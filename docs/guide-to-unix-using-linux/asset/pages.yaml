    group id, but have read and execute permissions.


    Use the UNIX chmod command to set permissions. In its simplest form, the chmod
    command takes arguments as a symbolic string followed by one or more names. The
    symbolic string specifies permissions that should be granted or denied to categories
    of users. Here is an example: ugo+rwx. In the string, the characters ugo stand
    for user (same owner), group, and others. The + sign indicates permissions are
    being granted. rwx indicates that the permissions are being granted to the owner,
    group, and others. Here is an example of how the symbolic string is used in a
    command, to modify the access permissions of myfile:


    ```

    chmod ugo+rwx myfile

    ```


    Here is a command that grants group read permission to the file customers:


    ```

    chmod g+r customers

    ```


    It is also possible to deny permissions with a symbolic string. The following
    command denies the group and others write and execute permissions for the file
    account_info.


