    # Character Constants


    Characters are represented internally in a single byte of the computer''s memory.
    When a character is stored in the byte, it is set to the character''s code in
    the host character set. For example, if the machine uses ASCII codes, the letter
    A is stored in memory as the number 65. This is because the ASCII code for A is
    65.


    When you represent character data in a program as a character constant, you enclose
    the character in single quote marks. Here are some examples:


    +   - ''A''

    - ''C''

    - ''a''

    - ''z''


    # Using Strings


    A string is a group of characters, like a name. Strings are stored in memory in
    consecutive memory locations. When you use string constants in your C program,
    they must be enclosed in double quote marks. Here are some examples:


    +   - "Linux is a great operating system."

    - "Good Morning!"

    - "Enter your name and age."'
