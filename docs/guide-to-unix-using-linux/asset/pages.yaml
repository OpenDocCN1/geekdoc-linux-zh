  md: '# Creating Web Pages


    You may use a visual HTML editor, such as Netscape Composer or Microsoft FrontPage,
    to create Web pages. These programs let you graphically construct a Web page in
    a “what you see is what you get” fashion. If you have no visual HTML editor, all
    you need is a text editor. You create the HTML by typing your text and the desired
    embedded tags. Here is a sample HTML file.


    ```

    <HTML>

    <HEAD><TITLE>My Simple Web Page</TITLE></HEAD>

    <BODY>

    <h1>A Simple Web Page</h1>

    This is a web page with no frills!

    </BODY>

    </HTML>

    ```


    All special codes contained inside angled brackets <> are tags. The first tag,
    <HTML>, identifies the file as an HTML document. Notice the corresponding </HTML>
    tag at the end of the file. Everything between the <HTML> and </<html> tags are
    considered text with HTML tags. In general, most tags are used this way. One tag
    marks the beginning of a section, while a corresponding tag marks the end of the
    section.


    Note that there are two parts to the code: a head and a body. The head contains
    the title, which appears on the top bar of your browser window. The body defines
    what appears within the browser window. All other tags refine the Web page''s
    appearance. Figure 9-19 shows the Web page''s appearance in the Netscape browser.


    ![](img/6ed9bb33c68863516b7a954081187e3b_364_0.png)


    Figure 9-19: Simple Web page'
