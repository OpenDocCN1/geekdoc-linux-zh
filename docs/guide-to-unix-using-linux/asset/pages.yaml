  md: '# UNIX File Processing


    ![](img/6ed9bb33c68863516b7a954081187e3b_134_0.png)


    Make sure not to include a space in the code sequence after the dash (-) options
    in the cut command. For example, the correct syntax is cut (space) -c14-25,26-35-36
    (space) corp_phones2.


    Using the cut command with variable-length or fixed-length records produces similar
    results. Cutting from fixed-length records creates a more legible display, which
    requires more storage space. For example, corp_phones2 requires 345 bytes and
    corp_phones1 requires 279.


    # Using the sort Command


    Use the sort command to sort a file''s contents alphabetically or numerically.
    UNIX displays the sorted file on the screen by default, but you can specify that
    you want to store the sorted data in a particular file.


    The sort command offers many options, which Appendix B, "Syntax Guide to UNIX
    Commands," describes. Here is an example of its use:


    ```

    sort file1 > file2

    ```


    In this example, the contents of file1 are sorted and the results stored in file2.
    (If the output is not redirected, sort displays its results on the screen.) Here
    is a more complex example:


    ```

    sort +.10 file1 > file2

    ```


    This command specifies a sorting key. Sorting key is a field or character position
    within each line. The sort command sorts the lines based on the sorting key. The
    + indicates that sorting does not begin at the first character position, but is
    offset in the line. The period (.) indicates that the offset is measured in characters.
    (If the period is missed, the offset is measured in fields.) The number of characters
    follows the period. The sample command tells the sort command that sort begins
    at character 10.


    Sorting the corp_phones1 file is relatively easy, because you can refer to numbers.
    You will see when you perform the next steps, sorting the fixed-length file, corp_phones2,
    is more difficult. In the first two steps, you sort the corp_phones2 by last name
    and first name, respectively. In the third and fourth steps, you do the same with
    corp_phones1. Notice that the output of these four steps goes to stdout (-o),
    instead of output redirection, to write the output to a new disk file, sorted_phones.


    # To sort the phones2 file:


    +   After the command prompt, type sort +.13 corp_phones2 and press Enter. This
    sorts the file by last name, starting at offset 13 (+13). You see the following
    on your screen:


