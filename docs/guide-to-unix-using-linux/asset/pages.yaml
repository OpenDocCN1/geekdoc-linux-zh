  md: '# LESSON A


    # objectives


    In this lesson you will:


    +   - Understand the program development cycle using a high-level computer language
    and UNIX shell scripts

    - Compare the shells to determine the best choice for programming

    - Learn about shell variables, operators, and wildcard characters

    - Write simple shell scripts to illustrate programming logic


    # Using the UNIX Shell as a Programming Language


    # Previewing file Application


    The corp_phones file, which you create in this chapter, contains records with
    fields delimited by colons. Here is a sample record from the file:


    219-432-4587:Mitchell:Barbara:C:4541:admin:Asst:12-14-1995


    In Chapters 4 and 5 you learned several commands, such as grep, cut, paste, and
    awk, which you can use to manipulate, extract, and format information stored in
    files. Although these commands are powerful, they can be difficult for non-technical
    users. In addition, you must often use these commands together in long sequences
    to achieve the results you want. Repeatedly executing these command sequences
    can be cumbersome, even for the experienced technical user. UNIX shell scripts
    eliminate these of problems. You can write scripts that present user-friendly
    screens and automatically issue commands like grep and awk to extract, and display
    information. This gives the non-technical user access to powerful features of
    UNIX. Shell scripts often save you time by automating long command sequences that
    you must perform often.


    The shell script application you develop in this chapter and in Chapter 7 presents
    a menu of operations the user may choose from. Among other these operations automate
    the process of searching for, formatting, and displaying the phone number records
    in corp_phones. The application also provides entry screens to ease the task of
    adding new records to the file.'
