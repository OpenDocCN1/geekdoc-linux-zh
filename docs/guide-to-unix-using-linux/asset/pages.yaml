    Next, you need to make sure that the necessary directories and files are in place

    before you execute programs that depend on them. To do this, use the test command.


    # Using the test Command


    The test command makes preliminary checks of the UNIX internal environment

    out useful comparisons (beyond those that the if command alone can perform).

    Appendix B, "Syntax Guide to UNIX Commands," for a description of options avail-

    able for the test command. You can place the test command inside your shell script
    or

    execute it directly from the command line. In this section you learn to use the
    test com-

    mand at the command line. In the next section you use it in a script file.


    The test command uses operators as options to perform the evaluations.

    The command can be used to:


    +   - Perform relational tests with integers (such as equal, greater than, less
    than, etc.)

    - Test strings

    - Determine if a file exists and what type of file it is

    - Perform Boolean tests


    Each type of test operation is discussed in more detail in the following sections.


    # Integer Tests with the test Command


    The test command can determine if one integer is equal to, greater than, less
    than,

    gater or equal to, less than equal to, or not equal to another integer.

    Table 7-1 describes the integer testing options of the test command.


    | Option | Meaning | Example Command |

    |---|---|---|

    | -eq | equal to | test a -eq b |

    | -gt | greater than | test a -gt b |

    | -lt | less than | test a -lt b |

    | -ge | greater than or equal to | test a -ge b |

    | -le | less than or equal to | test a -le b |

    | -ne | not equal to | test a -ne b |


    Table 7-1: Integer testing options of test command'
