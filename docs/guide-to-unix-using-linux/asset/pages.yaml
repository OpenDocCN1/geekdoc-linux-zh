- img_proc: true
  md: '# Introduction to Shell Programming


    A program''s high-level language statements are stored in a file called the source
    file. This is the file that the programmer creates with an editor such as vi or
    Emacs. The source file cannot execute, however, because the computer can only
    process instructions written in low-level machine language. As you recall from
    Chapter 3, machine-language instructions are cryptic codes expressed in binary
    numbers. Therefore, the source file must be converted into a low-level machine
    language file, as described.


    The source file is converted into an executable machine-language file by a program
    called a compiler. The compiler reads the lines of code that the programmer wrote
    in the source file and converts them to the appropriate machine language instructions.
    For example, the Linux C++ compiler is named g++. The following command illustrates
    how it is executed:


    ```

    g++ -o my_exe my_source.cpp

    ```


    In this command, the -o option instructs the compiler to create an executable
    file, my_exe. The source file is my_source.cpp. The command causes the compiler
    to translate the C++ program my_source.cpp into an executable machine-language
    program, which is stored in the file my_exe.

    If a source file contains syntax errors (grammatical mistakes in language usage),
    it cannot be converted into an executable file. The compiler locates and reports
    any syntax errors, which the programmer must correct.


    > Note: After compiling, the executable program may still contain fatal run errors
    or logic errors. Fatal run errors cause the program to abort due to an invalid
    memory location, for example. Logic errors cause the program to produce invalid
    results because of problems such as flawed mathematical statements.


    Another way to accomplish programming tasks is to develop UNIX shell scripts.


    # Using UNIX Shell Scripts


    In Chapter 4, UNIX shell scripts are text files that contain sequences of UNIX
    commands. Like high-level source files, a programmer creates shell scripts with
    a text editor. Unlike high-level language programs, shell scripts do not have
    to be converted into machine language by a compiler. This is because the UNIX
    shell acts as an interpreter when reading script files. As an interpreter translates
    them into executable instructions, and causes them to run. No executable file
    is produced because the interpreter translates and executes the program in one
    step. If a syntax error is encountered, the program halts.


    After you create a script, you simply tell the operating system that the file
    is a program that can be executed. This is accomplished using the chmod ("change
    mode") command to change the file''s mode. The mode determines how the file may
    be denoted by single-letter codes, the most common being "r" (read), "w" (write),
    and "x" (execute). Further, the chmod command tells the computer who is allowed
    to use the file: the owner (u), the group (g), or all other users (o). For a description
    of the chmod command, see Appendix B, "Syntax Guide to UNIX Commands."


    ![](img/6ed9bb33c68863516b7a954081187e3b_196_0.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# chapter 6, lesson A


    As you recall from Chapter 4, you can change the mode of a file so that UNIX recognizes
    it as an executable program that everyone (user, group, and others) can use. In
    the following example, the user is the owner of the file.


    ```

    $ chmod ugo+x filename

    ```


    By typing the filename after the system prompt, you can now run the shell program.
    However, before any program can be run, it must be retrieved from a path identified
    in the PATH variable, which provides a list of directory locations where UNIX
    looks to find the executable programs. (See the section,"Variables," later in
    this chapter.) If the program resides in your current directory, you can precede
    the program name with a dot slash (/) to tell UNIX to look in the current directory
    to find the program, as follows:


    ```

    $ ./filename

    ```


    Shell programs run less quickly than compiled programs, because the shell must
    interpret every UNIX command inside the executable script file before it is executed.
    However, it generally takes less time to create a shell program than one written
    using a high-level language, because of the process of invoking a compiler and
    producing an executable file is eliminated. Because it is usually faster and easier
    to write a program as a shell script than a compiled language, many programmers
    prefer scripts.


    # Prototyping an Application


    A prototype is a running model of your application, which lets you review the
    final results before committing to the design. Using a shell program to create
    a prototype is often the quickest and most efficient method, because prototyping
    logic and design capabilities reside within UNIX.


    After the working prototype is approved, the program can be rewritten to run faster
    using a compiled language like C++. If the shell performs well, however, you may
    not need to convert it to a compiled version.


    Now that you better understand the program development cycle, you realize that
    it will be more efficient to maintain Dominion Consulting’s phone records using
    a shell script. Your next step is to select the programming shell that will be
    most efficient for your application.


    # The Programming Shell


    All Linux versions use the Bash shell (Bourne Again Shell) as the default shell.
    6-1 lists the three shells that come with most Linux distributions, their derivations,
    and distinguishing features.'
