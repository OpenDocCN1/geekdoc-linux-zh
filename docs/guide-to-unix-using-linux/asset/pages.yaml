  md: '# Entering Commands


    To interact with UNIX, you enter a **command**, text you type after the command
    prompt. When you finish typing the command, press Enter. UNIX is **case-sensitive**,
    that is, it distinguishes between uppercase and lowercase letters, so that *John*
    differs from *john*. You must UNIX commands in lowercase. Commands are divided
    into two categories: user-level commands you type to perform tasks, such as retrieve
    information or communicate with other users; and system-administration commands,
    which the system administrator uses to manage the system.


    You must know a command''s syntax to enter it. *Syntax* refers to a command''s
    format and wording, as well as the options and arguments you can use to extend
    and modify its functions. Most commands are single words, such as *clear*. If
    you enter a command using correct syntax, UNIX executes the command. Otherwise,
    you receive a message that UNIX cannot interpret your command.


    alphabetically lists all the commands in this book and tells you how to enter
    each command and use its options.


    The place on the screen where you type the command is called the command line.
    Use the following syntax:


    | Syntax | command_name [-option] [value] |


    +   **Command name** specifies what operation to perform. In the syntax illustrations
    in this book, command names appear in bold.

    * **Command options** are requests to have UNIX carry out a command in a specific
    style, or variation. Options follow command names, separated by a space (-). Options
    are also case-sensitive. For example, *-R* differs from *-r*. You do not need
    to type an option after every command; however, some commands do not work unless
    you specify an option. The syntax illustrations in this book list options in square
    brackets ([|]) when the command does not require them.

    * **Command arguments** follow command options, separated by whitespace. Command
    arguments are usually file and directory names. In the syntax illustrations in
    this book, arguments appear in italics. Square brackets surround arguments if
    the command does not require them.


