  md: '# chapter 7, lesson A


    The test command returns a value known as an exit status. An exit status is a
    numeric value that the command returns to the operating system when it finishes.
    The value of the test command''s exit status indicates the results of the test
    performed. If the exit status is 0 (zero), the test result is true. An exit status
    of 1 indicates the test result is false.


    The exit status is normally detected in a script by the if statement or in a looping
    structure. You can view the last command''s exit status by typing the command:


    ```

    echo $

    ```


