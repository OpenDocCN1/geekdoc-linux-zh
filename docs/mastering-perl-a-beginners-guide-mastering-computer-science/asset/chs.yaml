- "# 精通 Perl：初学者指南 (计算机科学大师系列)\n\n\n\n\n# 关于本系列\n\n`Mastering Computer Science` 系列涵盖了广泛的主题，涉及编程语言以及现代技术和框架。该系列特别关注初级内容，并以易于理解的方式呈现，包括：\n\
  \n*   清晰易懂的文字，按相关性排序的各种主题，\n*   特别关注实践练习，包含大量的代码示例和程序，\n*   引导式的编程方法，为绝对初学者提供循序渐变的教程，\n\
  *   强调技能的现实实用性，因此删除了冗余和很少使用的概念，转而专注于行业主流的编码范式，\n*   丰富的参考文献和资源，帮助初级和中级开发人员从书中获得最大收益。\n\
  \n`Mastering Computer Science` 系列书籍从核心概念开始，然后迅速过渡到行业标准的编码实践，帮助学习者在尽可能短的时间内获得高效且关键的技能。这些书籍假设读者没有任何编程基础，因此即使是完全的新手程序员也能从本系列中受益。\n\
  \n`Mastering Computer Science` 系列由 Sufyan bin Uzayr 编辑，他是一位在计算领域拥有十年以上经验的作家和教育工作者。\n\
  \n有关本系列的更多信息，请访问：[`www.routledge.com/Mastering-Computer-Science/book-series/MCS`](https://www.routledge.com/Mastering-Computer-Science/book-series/MCS)\n\
