  \n## 使用正则表达式在文件中搜索\n\n\n\n\n\n### 正则表达式\n\n在 Perl 中，正则表达式（Regex、Regexp 或 RE）是一种特殊的文本字符串，用于描述给定文本中的搜索模式。Perl\
  \ 中的正则表达式与宿主语言绑定，与 PHP、Python 等语言中的正则表达式并不相同。这些正则表达式有时被称为“Perl 5 兼容正则表达式”。绑定操作符如\
  \ `= ∼`（正则表达式运算符）和 `!∼`（否定正则表达式运算符）被用于使用正则表达式。\n\n绑定正则运算符用于将字符串与正则表达式进行匹配。语句的左侧将包含一个与右侧指定模式匹配的字符串。否定正则运算符用于判断字符串是否等于右侧指定的正则表达式。\n\
  \n正则运算符有助于在文件中搜索特定的单词或一组单词。根据用户的具体需求，这可以通过多种方式实现。Perl 搜索遵循标准格式：以只读模式（read mode）模式打开文件，然后逐行读取文件，在每行中查找所需的字符串或字符串组。当找到所需的匹配项时，搜索表达式后的语句将决定如何对匹配的字符串进行处理，这可以将其添加到用户指定的任何其他文件中，或者将其打印到控制台上。\n\
  \n有多种方法可以在创建的用于匹配文件字符串的正则表达式内部查找所需的字符串。\n\n### 普通搜索\n\n这种编写正则表达式的基础模式用于在指定文件中搜索指定的字符串。此类正则表达式的语法如下：`$String\
  \ =∼ /the/`\n\n此表达式将查找文件中包含字母组合“the”的行，并将该单词存储在变量 `$String` 中。此外，该变量的值可以被复制到文件或打印到控制台上。\n\
  \n在包含“the”一词的单词列表中，为了避开此类单词，可以将正则表达式修改为：`$String =∼ / the /`\n\n通过在需要搜索的单词的前后插入空格，被搜索的单词将从两端隔离开来，从而在搜索过程中不会返回任何包含该单词作为一部分的单词。这将消除搜索不必要单词的需求。然而，这将排除那些紧跟在请求搜索的词后带有逗号或句号的单词。\n\
  \n为了避免这种情况，还有其他方法可以将搜索限制为特定单词，其中一种是使用单词边界。\n\n## 在正则搜索中使用单词边界\n\n如前面的示例所示，普通搜索会返回包含搜索单词的额外单词，或者如果所需的单词前后都有空格，则会排除某些单词。单词边界用字母\
  \ `\\b` 表示，用于避免这种情况。\n\n这将限制包含请求单词作为一部分的单词，但不会排除以逗号或句号结尾的单词。\n\n以句号结尾的单词会被包含在搜索中，但包含搜索单词作为一部分的单词则不会。因此，单词边界可以帮助解决普通搜索方法产生的问题。\n\
  \n如果需要找到以特定字符开头、结束或同时开头又结束的单词怎么办？这无法通过普通搜索或单词边界来实现。Perl 允许在类场景的正则表达式中使用通配符。\n\n\
  ## 正则表达式中的通配符\n\n通过正则表达式中的通配符，Perl 允许我们在给定文件中搜索一组特定的单词或遵循特定模式的单词。通配符是。\n\n\n\n\n\
  \n### 4. 多态\n多态是指面向对象编程（OOP）语言能够有效地区分同名实体的能力。Perl 通过使用这些实体的签名和声明来实现这一点。\n\nPerl\
  \ 中的多态主要有两种类型：\n- Perl 载载（overloading）\n- Perl 方法重写（overriding）\n\n### 5. 继承\n继承是面向对象编程（OOP）的一个核心柱。在\
  \ Perl 中，这种机制允许一个类继承另一个类的特性（字段和方法）。\n\n需要记住的重要术语：\n- 超类（Superclass）：超类是具有继承特性的类（基类或父类）。\n\
  - 子类（Subclass）：派生自另一个类（也称为派生类、扩展类或子类）。子类可以在超类的基础上添加自己的字段和方法。\n- 可重用性（Reusability）：继承促进了“可重用”，这意味着如果我们想要新类，而已经有一个类包含了我们想要的部分代码，我们就可以从现有类派生出新类。通过这样做，我们重用了了现有类的字段和方法。\n\
  \n在 Perl 中，可以使用 `packages` 创建类，并使用 `use` 关键字进行继承。\n\n### 6. 封装\n封装是将数据包装在一个单一单元中。它是连接代码及其所操作的数据的机制。封装也可以被视为一个保护屏，防止代码访问屏蔽之外的数据。\n\
  \n- 从技术上讲，在封装中，类的变量或数据对其他类是隐藏的，只能通过声明它们的类中的任何成员函数进行访问。\n- 由于类中的数据对其他类是隐藏的，它也被称为数据隐藏。\n\
  - 封装可以通过将类中的所有变量声明为私有，并在类中编写公有方法来设置设置和检索变量值来实现。\n\n### 7. 抽象\n数据抽象是仅向用户显示本质性细节的属性。用户不会看到琐碎或非本质的单元。例如，一个汽车被视为一个整体，而不是它的各个组件。\n\
  \n数据抽象也被定义为只识别对象的必要特征而忽略无关细节的过程。对象的属性和行为将其与其他相似类型的对象区分开来，并有助于对象的分类/分组。\n\n考虑以下场景：一个男人正在开车。这个男人只知道按下加速板会增加汽车速度，或者按下刹车会停止汽车。然而，他并不知道按下加速板是如何增加速度的，也不理解汽车的内部机制，或汽车的加速板、刹车和其他控制装置是如何实现的。这就是抽象的定义。\n\
  \n## OOP 中的类\n\n在当今世界，当编程被应用于生活的方方面面，我们必须采用与现实世界实例密切相关的编程范式。现实世界挑战的竞争性和复杂性经历了巨大的变化，使得行业需要更具适应性的方法。\n\
  \nOOP 的概念是一种奇的方法，可以塑造任何编程语言，使得解决现实案例变得轻而易举。OOP 是一种强调对象而非过程的编程范式。OOP 的思想涉及根据对象和对象交互来工作。\n\
  \n注意：OOP 试图实现现实世界的元素，如继承、封装和多态。OOP 的主要目的是将数据与其所作用的功能连接起来，使得代码的其他部分无法通过函数访问数据。\n\n\
  ### 对象（Object）\n它是数据结构内部具有特定属性和行为的类实例。“苹果”就是对象的一个例子。它具有水果的品质、深红色等特征。它的行为是“它尝起来很好”。\n\
  \n根据 OOP 的思想，它的数据代表对象的特征，它的活动由其相关函数表示。因此，对象是一个持有数据并提供基于函数的接口的实体。\n\n### 类（Class）\n\
  类是一个扩展的数据结构概念。它指定了包含数据的对象的原型蓝图。\n\n对象是其相应类的实例。类由数据成员和数据函数组成；它是一种用户定义的、预定义的数据类型，可以通过创建该类的实例来访问和使用。\n\
  \n**示例：** 以学校的类为例。可能会有各种不同名称和组织结构的学校，但它们都具有某些特性，例如学生、教师和员工。因此，学校是包含数据成员（教师、学生和家长）的类，而成员函数可以是\
  \ `calculate_students_marks()`、`calculate_teachers_salary()` 和 `Parents_Database()`。\n\
  \n### 数据成员（Data Member）\n数据成员是数据变量，成员函数是用于控制这些变量的函数；这些数据成员和成员函数共同了类内部对象的属性和行为。\n\
  \n![](img/ufig7_2.jpg)\n\n数据成员。\n\n### 定义类\nPerl 使定义类变得非常简单。Perl 中的类对应于一个 `package`。要定义一个类，我们必须先加载并构建一个\
  \ `Package`。Package 是用户定义的变量和子程序的预包含单元，可以用于程序的任何地方。\n\n### 创建类并使用对象\n在 Perl 中，可以使用关键字\
  \ `package` 创建类，但对象是通过调用构造函数创建的。构造函数被定义为类中的一个方法。\n\n### 创建类实例\n类名和构造函数名可以是用户喜欢的任何。大多数程序员倾向于使用\
  \ `new` 作为程序的构造函数名，因为它比任何其他复杂的构造函数名更容易记忆和使用。\n\n在前面的示例使用了名为 `bless` 的函数。该函数用于将对象与作为参数传递的类关联起来。\n\
  \n### 创建对象\n在 Perl 中，对象通过调用类中定义的构造函数来创建。对象的名称可以是用户需要的任何变量，但习惯上会与类相关的命名。\n\n在 OOP\
  \ 中使用类至关重要的，因为它们精确地描述了现实世界的应用，并可以用于解决现实问题。\n\n## OOP 中的对象\n\nPerl 是一种面向对象的、基于解释器的动态编程语言。OOP\
  \ 有三个主要组件：对象、类和方法。对象是一种可以被称为其所属类实例的数据类型。它可能是一个各种数据类型数据变量的集合，也是各种数据结构的集合。方法是在类对象实例上操作的函数。\n\
  \n下面的示例说明了如何在 Perl 中使用对象：\n\n我们必须首先定义类。在 Perl 中，这是通过构建类包 package 实现的。package 是一个封装的对象，包含了类的所有数据成员和函数。\n\
  \n在这种情况下，`Employee` 是类名。\n\n第二个任务是创建一个包实例（即对象）。我们需要为此准备一个构造函数。在 Perl 中，构造函数是一个通常命名为\
  \ `new` 的子程序。然而，由于名称是用户定义的，所以它并不限于 `new`。\n\n为了设计我们的对象，我们在构造函数中定义了一个基础哈希引用 `$self`。在这里，对象将包含\
  \ `Employee` 的三个属性：`serialNum`、`firstName` 和 `lastName`。这意味着每个员工将有自己的序列号、名字和姓氏。`my`\
  \ 关键字充当访问限定符，将 `$class` 和 `$self` 局部化在包含的块中。\n\n\n\n\n`shift` 关键字将包名从默认数组 `@_` 传递给\
  \ `bless` 函数。`bless` 方法返回一个最终会变成对象的引用。最后，构造函数将返回一个 `Employee` 类的实例。最重要的方面是如何初始化对象。这可以通过以下方式实现：`$object\
  \ = new Employee(1, \"Peeks\", \"forPeeks\");`。\n\n在这种情况下，`$object` 是标量变量，指向构造函数中定义的哈希（hash）。\n\
  \n以下是一个在 OOP 中创建和实现对象的示例程序：\n\n```perl\nuse strict;\nuse warnings;\n### 类名为 Employee\n\
  package Employee;\n### 具名为 new 的构造函数\nsub new {\n    # shift 将获取包名\n    # 并将其赋值给变量\
  \ ’class’\n    my $class = shift;\n    # 定义哈希引用\n    my $self = {\n        _serialNum\
  \ => shift,\n        _firstName => shift,\n        _lastName => shift,\n    };\n\
  \    # 使用 bless 将对象绑定到类\n    bless $self, $class;\n    # 返回 Employee 类的实例\n    return\
  \ $self;\n}\n### 创建类对象\nmy $object = new Employee(1, \"Peeks\", \"forPeeks\");\n\
  # 这里对象是一个指向哈希的引用\nprint(\"$object->{_firstName} \\n\");\nprint(\"$object->{_serialNum}\
  \ \\n\");\n```\n\nPerl 对象的工作方式与其他语言（如 `C++` 和 `Java`）相同。上面的程序演示了 Perl 中对象的流程，包括其在类中的创建和使用。\n\
  \n## OOP 中的方法\n\n方法用于访问和修改对象的数据。这些可以通过类或包对象调用的实体。Perl 中的方法仅仅是子程序（subroutines）；它们没有独特的身份。方法的语法与子程序相同。方法和子程序一样，使用\
  \ `sub` 关键字指定。作为第一个参数，方法接收调用它的对象或包。\n\nOOP 采用这些方法来更改对象的数据，而不是直接与对象交互；这样做是为了通过防止程序员直接修改对象的数据来确保数据安全。各种接受对象作为参数并将其值保存在另一个变量中的辅助方法使得这成为可能。此外，对第二个变量进行了调整。这些更改不会影响对象的数据，使其更加安全。\n\
  \n### Perl 中的方法类型\n\n根据给定的输入，Perl 中的方法可以分为两类：静态方法和虚拟方法。\n\n静态方法是指方法的第一个参数是类名的方法。由于静态方法接受类名作为参数，因此其功能被应用于整个类。这些也被称为类方法。由于大多数方法属于同一个类，因此没有必要提供类名作为参数。例如：类的构造函数被认为是静态方法。\n\
  \n虚拟方法是将对象引用作为函数的第一个参数提供的方法。虚拟函数的第一个参数被移动到局部变量中，然后用作引用。\n\n在 OOP 中，方法需要括号来存放参数，这些方法通过箭头运算符（`->`）调用。\n\
  \n### get-set 方法\n\n方法用于保护对象的数据，因此与对象的引用一起使用，或者将值存储在另一个变量中然后。在 OOP 中，get-set 方法用于为对象提供数据安全。get\
  \ 方法用于检索对象的当前值，而 set 赋值方法则为对象分配一个新值。\n\n### 构造函数和析构函数\n\n我们将通过示例解释构造函数和析构函数。\n\n\
  ### 构造函数\n\nPerl 子程序的构造函数返回类的实例作为返回对象。在 Perl 中，构造函数通常被称为 `new()`。与许多其他 OOP 语言不同，Perl\
  \ 没有用于对象构造特殊语法。它利用显式与类连接的数据结构（哈希、数组、标量）。在哈希引用和类名上，构造函数调用 `bless` 方法（即包名）。\n\n让我们编写一些程序以便更详细的解释。\n\
  \n注意：由于使用了包（packages），以下代码将在在线 IDE 上执行。以下文本代表一个 Perl 类或模块文件。使用扩展名 (`*.pm`) 保存文件。\n\
  \n当调用构造器方法时，包名 `Area` 存储在默认数组 `@_` 中。关键字 `shift` 用于从 `@_` 中提取包名并传递给 `bless` 函数。\n\
  \n在 Perl 中，属性以键值对的形式存储在哈希引用中。此外，代码中还添加了一些属性。\n\n上面的（Area 类）代码有两个属性：长度和宽度。设计了另一个\
  \ Perl 程序使用这些属性来获取它们的访问。\n\n**如何运行代码：**\n\n*   将带有包 `Area` 的程序保存为文本文件 `Area.pm`。\n\
  *   注意：文件名应始终与包名相同。\n*   将用于访问包中定义的属性的程序保存为 `*.pl`。`*` 在此处可以是任何名称（在这种情况下，为 `test.pl`）。\n\
  *   在 Perl 命令行中使用命令 `perl test.pl` 运行保存为 `test.pl` 的代码。\n\n### 传递动态属性\n\n在现有文件中添加动态属性：\n\
  \n**程序：Areas.pm**\n```perl\npackage Area;\nsub new {\n    my ($class, $args) = @_;\n\
  \    # 因为值将\n    # 动态地传递\n    my $self = {\n        length => $args->{length} ||\
  \ 1, # 默认值为 1（已存储）\n        width => $args->{width} || 1, # 默认值为 1（已存储）\n    };\n\
  \    return bless $self, $class;\n}\n# 我们还添加了 get_area 函数\n# 来计算面积\nsub get_area\
  \ {\n    my $self = shift;\n    # 通过乘法获取面积\n    my $area = $self->{length} * $self->{width};\n\
  \    return $area;\n}\n1;\n```\n\n**程序：test.pl**\n```perl\nuse strict;\nuse warnings;\n\
  use feature qw/say/;\nuse Area;\n# 将长度和宽度参数\n# 传递给构造函数\nmy $area = Area->new(\n\
  \    {\n        length => 2, # 将 ’2’ 作为长度参数\n        width => 2, # 将 ’2’ 作为宽度参数\n\
  \    }\n);\nsay $area->get_area;\n```\n\n### 析构函数\n\n当所有对象引用从作用范围内移除时，Perl 会自动调用析构方法。如果类生成了在删除时必须移除的线程或临时文件，析构方法非常有用。Perl\
  \ 为析构函数有一个特殊的方法名 `DESTROY`，在声明析构函数时必须使用。\n\n## OOP 中的方法重写\n\n重写是任何面向对象的计算机语言的特性，允许子类或子类实现超类或父类中已存在的方法。当子类方法的名字、参数或签名以及返回类型（或子类型）与其父类中的方法相同时，子类方法被认为重写了父类方法。\n\
  \n方法重写意味着代码由两个或多个同名的方法，每个方法都有独特的用途并与其他不同。因此，该术语的字面定义指示一种方法必须优先另一种方法。这种思想是在派生类中重新定义具有相同方法签名的基类方法。\n\
  \n方法重写是 Perl 实现运行时多态的一种方式。运行的方法取决于调用它的对象。如果使用父类对象来调用方法，则将运行父类中的版本；然而，如果使用子类对象，则将执行子类中的版本。换句话说，被引用的对象的类型决定了将执行哪个版本的重写方法，而不是引用变量的类型。\n\
  \nPerl 中的方法重写通过以下示例得到最好的展示。\n\n\n\n\n\n我们有一个基类 `vehicle`，它拥有 `get_mileage()` 和 `get_cost()`\
  \ 方法，以及一个派生类 `car`，它拥有 `get_mileage()` 和 `get_age()` 方法。现在，由于两个类中的一个方法名称相同，它们的执行将遵循**方法重写（Method\
  \ overriding）**的概念。让我们来看示例以及如何执行的。\n\n### 基类的创建\n```perl\n### 基类的声明和定义\nuse strict;\n\
  use warnings;\n### 创建父类包\npackage vehicle;\nsub new {\n# shift 将获取包名 ’vehicle’\n\
  # 并将其赋值给变量 ’class’\nmy $class = shift;\nmy $self = { ’distance’=> shift, ’petrol_consumed’=>\
  \ shift };\n### 使用 bless 函数将对象绑定到类\nbless $self, $class;\n### 从构造函数中返回对象\nreturn\
  \ $self;\n}\n### 计算里程数的方法\nsub get_mileage {\nmy $self = shift;\n### 计算结果\nmy $result\
  \ = $self->{’distance’} / $self->{’petrol_consumed’};\nprint \"The mileage by our\
  \ vehicle is: $result\\n\";\n}\n### 计算成本的方法\nsub get_cost {\nmy $self = shift;\n\
  ### 计算结果\nmy $result = $self->{’petrol consumed’} * 70;\nprint \"Cost is: $result\\\
  n\";\n}\n1;\n```\n\n### 派生类的创建\n```perl\n### 声明和定义派生类\n### 创建派生类\npackage car;\n\
  use strict;\nuse warnings;\n### 使用父类\nparent ’vehicle’;\n### 重写方法\nsub get_mileage\
  \ {\nmy $self = shift;\n### 计算结果\nmy $result = $self->{’distance’} / $self->{’petrol_consumed’};\n\
  print \"The mileage by our car is: $result\";\n}\n### 从用户获取年龄的方法\nsub get_age {\n\
  my $self = shift;\n### 从用户处获取输入\nmy $age = <>;\n### 打印年龄\nprint \"The Age is: $age\\\
  n\";\n}\n1;\n```\n\n### 使用对象演示方法重写过程\n```perl\n### 调用每个类的对象\n### 方法\n# 使用相应的对象。\n\
  use strict;\nuse warnings;\n### 使用派生类作为父类\nuse car;\n### 对象的创建和初始化\nmy $ob1 = vehicle\
  \ -> new(2550, 170);\nmy $ob2 = car -> new(2500, 250);\n### 使用重写调用方法\n$ob1->get_mileage();\n\
  $ob2->get_mileage();\n```\n\n如所示，通过对象调用的类方法会重写不同类中相同名的其他方法。`vehicle` 对象上的 `get_mileage`\
  \ 方法通过 `vehicle` 类中声明的方法打印“The mileage by our vehicle is: 15”。当我们对 `car` 对象执行 `car`\
  \ 类中的 `get_mileage` 方法时，我们得到的输出是“The mileage by our car is: 10。”\n\n### 为什么我们需要重写方法？\n\
  \n如前所述，重写的方法允许 Perl 在运行时提供多态性。\n\n多态性对面向对象编程（OOP）至关重要，原因如下：它允许基类描述将被所有后代共享的方法，而子类可以定义这些方法中任何或所有方法的特定实现。Perl\
  \ 还通过重写方法提供了多态性的“一个接口，多个方法”的元素。\n\n动态方法分发（运行时多态）是面向对象架构中代码复用和韧性最有效的策略之一。在不重新编译的情况下，让代码库能够调用新类实例的方法，同时保持整洁的抽象接口，这是一项强大的工具。\n\
  \n重写的方法允许我们在在不知道派生类对象类型的情况下，调用任何派生类的方法。因此，方法重写简化了编程，因为在开发新方法时不需要记忆不同的名称；相反，记住方法内部的过程变得更为必要。\n\
  \n## OOP 中的继承\n\n继承是一个类提取并使用另一个类特性的能力。它是从现有类（称为**基类（Base classes）**）中创建新类（称为**派生类（Derived\
  \ classes）**）的过程。其核心思想是，程序员可以在另一个类中使用其中一个类的特性，而无需在多个类中多次声明或定义相同项。\n\n我们可以从基类继承成员函数，而不是在每个类声明中重新编写它们。继承是\
  \ OOP 最核心的特征之一。\n\n**子类（Subclass）：** 子类或派生类是继承自另一个类属性的类。\n\n**父类（Superclass）：**\
  \ 被子类继承属性的类被称为父类或基类。\n\n继承最基本的原理是从另一个类创建或派生新类。\n\n### 基类与派生类\n\n派生类是通过从基类派生出额外的继承子类创建的。一个基类可以有多个派生类；这种继承类型被称为**层级继承（Hierarchical\
  \ Inheritance）**。这些派生类都源自同一个父类或基类。当一个派生类共享多个父类并从多个父类继承其特征时，就会发生**多重继承**。\n\n![](img/ufig7_3.jpg)\n\
  \n基类和驱动类。\n\n上面的图片描述了类从基类派生的顺序。上图中所示顺序和标记将在需要时用于在理论上描述继承顺序。\n\n考虑 `Vehicles` 类。现在我们必须为每种类型的车辆创建一个类，例如巴士、汽车或卡车。对于所有\
  \ `Vehicles`，`fuelAmount()`、`capacity()` 和 `applyBrakes()` 方法将是相同的。\n\n![](img/ufig7_4.jpg)\n\
  \n继承创建。\n\n之前的图片描述了在没有继承概念的情况下创建这些类。\n\n上述过程显然导致了相同代码的重复三次。这增加了错误的概率和数据冗余。继承被用于避免这种情况。如果我们创建一个类，在其中编写这些函数，并从那里继承其余部分，我们就可以简单地避免数据重复并增加重用性。\n\
  \n![](img/ufig7_5.jpg)\n\n三个类继承自一个类。\n\n由于我们继承了其余部分，我们只需要编写一次，而不是编写三次。\n\n### 多级继承\n\
  \n\n\n\n\n## 面向对象编程（OOP）中的多态\n\n多态是以多种形式处理数据的能力。Poly 意味着“多”，morphism 意味着“形态”；因此，术语本身就体现了其含义。多态是面向对象编程语言中最基础的概念之一。在\
  \ OOP 中，当父类引用指向子类对象时，通常会使用多态。本节将探讨如何以多种类型和格式表达任何函数。\n\n多态的一个真实世界例子是，人在生活中可能同时扮演多个角色。例如一个女性同时承担着母亲、妻子、员工和女儿的角色。因此，同一个体必须具备各种特征，每种特征都必须根据场景和条件来实现。多态被认为是\
  \ OOP 最核心的特性之一。\n\nOOP 的主要优势是多态。多态是如此本质，以至于不支持多态的语言不能被称为面向对象的语言。基于对象的语言是指那些拥有类但不支持多态的语言。因此，多态对于\
  \ OOP 语言来说至关重要。它是对象或引用在不同上下文中呈现多种形式的能力。它支持函数重载、函数重写和虚函数。\n\n![](img/ufig7_7.jpg)\n\
  \nOOP 中的多态。\n\n多态是一种属性，允许向多个类的对象发送任何消息，并且每个对象都可以根据其类属性做出相应的响应。\n\n这意味着在 OOP 语言中，多态是一种根据调用它的对象类型执行不同操作的方法。例如，`$square->area()`\
  \ 将返回正方形的面积，而 `$triangle->area()` 可能返回三角形的面积。另一方面，`$object->area()` 则必须根据调用 `$object`\
  \ 的类来计算面积。\n\n使用以下示例可以解释多态：\n\n```perl\nuse warnings; # 使用 package package A 创建类;\
  \ # 构造函数-创建\nsub new { # shift 将获取包名 ’vehicle’\n# 并将其赋值给变量 ’class’ my $class = shift;\
  \ \nmy $self = { ’name’ => shift, ’roll_no’ => shift }; \nsub poly_example { print(\"\
  This corresponds to a class A\\n\"); } }; \npackage B; # @ISA 数组包含一个列表\n# 存储该类的父类（如果有的话）\
  \ my @ISA = (A); \nsub poly_example { print(\"This corresponds to a class B\\n\"\
  ); } \npackage main; B->poly_example(); A->poly_example();\n```\n\n在类 `B` 中定义的方法\
  \ `poly_example()` 重写了继承自类 `A` 的定义（对于第一个输出如此，第二个输出反之亦然）。这允许你添加或扩展任何预存在包的功能，而无需反复重写整个类的定义。结果是程序员的生活变得更加便利。\n\
  \n# OOP 中的封装\n\nPerl 中的封装是将数据封装起来的过程，以使其免受不应访问该代码区域的外部源的影响。封装是 OOP 的一个组件；它将数据与更改它的子程序绑定在一起。从另一个意义上说，封装是一种保护屏，防止数据被此屏障之外的代码访问。\n\
  \n*   从技术上讲，在封装下，类的变量或数据对其他类隐藏，并且可能只能通过定义它们的类成员函数进行访问。\n*   与封装一样，类内部的数据是对其他类隐藏的；因此，它有时被称为数据隐藏。\n\
  *   封装可以通过将所有类变量声明为局部（local），并通过导入包来获取类方法（以设置和检索变量值）来实现。\n\n![](img/ufig7_8.jpg)\n\
  \nOOP 中的封装。\n\n考虑封装的一个真实世界例子：在公司中，有多个部门，如会计、财务和销售部。财务部门处理所有的财务交易并维护所有财务数据的记录。\n\n\
  同样，销售部门负责所有与销售相关的操作并维护销售数据。现在，可能会出现一种情况：财务部门官员需要特定月份的完整销售信息。在这种情况下，他不被直接访问销售部门的数据。他必须首先联系销售部门的另一位官员，然后请求该个人提供数据。\n\
  \n这描述了封装。在这里，销售部门的数据以及可能更改数据的人被归类在“销售部门”之下。\n\n如果在上述代码中需要对类数据进行任何修改或仅为了打印类数据，是无法直接完成的。创建该类的对象并然后使用\
  \ `get_details()` 方法访问数据是至关重要的。这被称为数据封装。\n\n封装的优点是：\n\n*   数据隐藏：用户将不确定类的内部实现。用户无法看到类如何在其变量中存储数据。他们只是意识到我们正在向访问器（accessors）赋值，并且变量正在用这些值进行初始化。\n\
  *   增强的灵活性：我们可以根据需要将类变量设为只读或只写。要使变量变为只读，我们需要在代码中使用 Get Accessor（获取）。要使变量变为只写，我们必须只使用\
  \ Set Accessor（设置）。\n*   可重用性：封装还促进了可重用性，并更容易适应新需求。\n*   验证代码简单：封装的代码易于单元测试。\n\n\
  本章涵盖了带有类、对象、方法、构造函数和析构函数的 Perl OOP。此外，我们还讨论了方法重写、继承、多态和封装。\n\n# 第 8 章 Perl 子程序\n\
  \nDOI: [10.1201/9781003358442-8](https://doi.org/10.1201/9781003358442-8)\n\n##\
  \ 本章内容\n\n*   函数签名 (Function Signature)\n*   向子程序传递复杂参数\n*   可变与不可变参数\n*   多个子程序\n\
  *   `return()` 函数的使用\n*   按引用传递 (Pass By Reference)\n*   递归\n\n在上一章中，我们讨论了 Perl\
  \ 中的面向对象编程，在本章中，我们将涵盖子程序。\n\n### 子程序或函数\n\nPerl 函数或子程序是执行特定目的的语句集合。在任何编程语言中，代码复用都是理想的。因此，用户将代码块放在函数或子程序中，以消除重复编写代码的需求。在\
  \ Perl 中，函数、子程序和方法是同义词，尽管它们在其他编程语言中是不同的。在 Perl 编程中，子程序是最常用的术，因为它由关键字 `sub` 组成。每当调用函数时，Perl\
  \ 都会暂停整个程序的执行，跳转到函数执行，然后返回之前的代码区域。不需要使用 `return` 语句。\n\n### 确定子程序\n\nPerl 子程序定义的通用形式如下：`sub\
  \ subroutinename { # 方法或子程序的体 }`\n\n### 调用子程序\n\nPerl 中的子程序可以通过通过传递参数列表来调用，如下：`subroutinename(arugumentslist);`\n\
  \n上述描述的方法仅适用于 Perl 5.0 及更高版本。在 Perl 5.0 之前有另一种调用子程序的方法，但不推荐使用，因为它绕过了子程序的原型检查。\n\n\
  ### 向子程序传递参数\n\n这用于将值作为参数传递给子程序。这是通过使用特殊列表数组变量 `$_` 完成的。这些将被赋值给函数 `$_[0]`、`$_[1]`\
  \ 等。\n\n程序具有具有优点：\n\n*   它允许我们复用代码，并使错误检测和调试变得更容易。\n*   有助于代码的结构化组织。\n*   代码段被组织成块。\n\
  *   它提高了代码的可读性。\n\n\n\n\n\nPerl 函数或子程序是执行特定任务的语句集合。每种编程语言的用户都希望重用代码。因此，用户会将代码段放在函数或子程序中，以避免重复编写代码。我们将重点介绍以下概念：\n\
  \n-   将哈希（Hashes）传递给子程序。\n-   将列表（Lists）传递给子程序。\n-   从子程序的局部和全局变量返回结果。\n-   子程序调用中的变数量参数。\n\
  \n### 将哈希传递给子程序\n哈希也可以传递给子程序，子程序将其转换为键值对。\n\n### 将列表传递给子程序\n由于 `@_` 是函数或子程序内部的特殊数组变量，它被用于将列表传递给子程序。Perl\
  \ 对数组和列表的解析方式不同，这使得从 `@_` 中提取独立元素变得困难。为了与其他标量参数一起传递列表，必须将列表作为最后一个参数。\n\n### 从子程序返回结果\n\
  子程序与其他任何编程语言一样，可以返回值。如果用户没有手动从子程序返回结果，子程序将自动返回一个值。在这种情况下，自动返回的值是子程序中执行的最后一个计算的结果。该结果可以是标量、数组或哈希。\n\
  \n### 子程序中的局部和全局变量\n默认情况下，Perl 程序中的所有变量都是全局变量。然而，使用 `my` 关键字，可以在块内创建局部或私有变量。私有变量的作用范围有限，例如在块（`if`,\
  \ `while`, `for`, `foreach` 等）和方法之间。这些变量不能在块或方法之外使用。\n\n### 子程序调用中的数量数量\nPerl 没有包含任何用于声明子程序参数的内置机制，这使得向函数传递任意数量的参数变得非常简单。\n\
  \n通常情况下，将多个数组或哈希作为参数传递给子程序会导致它们丢失其独立标识性。同样，从子程序返回多个数组或哈希也会导致它们独立标识的丢失。我们可以通过使用引用来解决这些问题。\n\
  \n## PERL 中的函数签名\nPerl 函数或子程序是执行特定任务的语句集合。每种编程语言的用户都希望重用代码。因此，用户会将代码段放在函数或子程序中，以避免重复编写代码。虽然在\
  \ Perl 中函数（function）、子程序（subroutine）和方法（method）这些术语是可以通用的，但在其他编程语言中并非如此。因为它是使用关键字\
  \ `sub` 创建的，所以在 Perl 编程中通常使用子程序一词。当调用函数时，Perl 会停止执行整个程序并跳转到函数处执行，然后再返回到之前运行的代码段。可以避免使用\
  \ `return` 语句。\n\n### 定义子程序\n在 Perl 中，定义子程序的通用形式如下：`sub subroutinename { # 方法或子程序的体\
  \ }`\n\n### 函数签名\n在构建函数时，注意：具有定义签名的子程序或函数只能接受与其签名指定类型相同的参数。如果提供的过程输入与其签名不匹配，将发生错误。函数签名揭示了大量关于子程序类型的信息。它允许用户创建同名但签名不同的子程序，即不同的参数。在\
  \ Perl 中，不同的子程序可以有相同的名称，但它们的参数必须不同。\n\n在上面的代码中，子程序的名称是相同的，但它们的参数数量是不同的；因此，它们不会被视为不同的子程序，我们的\
  \ Perl 代码不会报错。\n\n### 传递与签名指定类型不同的参数\n当使用签名定义子程序时，它必须接收与其签名相同类型的参数。如果给了一个与函数签名不同的参数，将生成错误，导致代码编译失败。\n\
  \n如果我们传递一个与函数签名类型不同的参数，将生成以下错误：\n```perl\n#!/usr/bin/perl\n# Defining the Function\
  \ Signature\nsub example(Int $variable) { return $variable / 2; }\n# Function Call\
  \ with the\n# string type parameter\nprint example(\"66\");\n```\n\n### 参数数量的区别\n\
  当定义函数签名时，它还包含了可以传递给函数的参数数量和类型。如果我们用不同数量的参数调用函数，Perl 将抛出错误，因为具有不同签名的函数具有不同的含义。\n\n\
  函数签名是一个非常有用的特性，但对某些程序员来说可能非常烦人，因为它限制了函数只能用于特定类型的参数。如果在没有签名的情况下定义函数，则对传递给函数的参数类型没有限制。\n\
  \n上面的代码声明了一个没有特定参数类型的函数，因此当一个整数值作为字符串传递给它时，它会自动将参数转换为整数形式并返回结果。然而，如果我们使用字符串参数调用函数，且对其执行的操作需要整数值，我们将得到以下错误：\n\
  ```perl\n#!/usr/bin/perl\n# Defining Function-Signature\nsub example($variable)\
  \ { return $variable / 2; }\n# Function Call with the\n# string type argument\n\
  print example(\"Peeks\");\n```\n\n### 向子程序传递复杂参数\nPerl 函数或子程序是执行特定任务的语句集合。用户在每种编程语言中都希望重用代码。因此，用户会将代码段放在函数或子程序中，以避免重复编写相同的代码。结果，函数或子程序被用于所有编程语言。这些函数或子程序可以接受各种数据结构作为参数。其中一些在下文中进一步讨论：\n\
  \n- 将列表或数组传递给子程序\n- 将引用传递给子程序\n- 将文件句柄传递给子程序\n- 将哈希传递给子程序\n\n向子程序传递数组或列表：数组或列表可以作为参数传递给子程序，并使用数组变量\
  \ `@_` 来接收子程序或函数内部的列表值。\n\n**第一个示例**：将单个列表传递给子程序，并显示其元素。\n\n**第二个示例**：在这种情况下，将两个列表传递给子程序，并显示它们的内容。\n\
  \n**第三个示例**：将一个标量参数和一个列表传递给子程序，并显示列表元素。\n\n向子程序传递引用：引用也可以作为参数传递给子程序。数组引用被传递给子程序，并返回数组元素的最大值。\n\
  \n向子程序传递哈希：哈希也可以作为参数传递给子程序，显示其键值对。\n\n向子程序传递文件句柄：为了创建文件或访问其内容，需要一个文件句柄（`FileHandle`）。文件句柄只是一个配合操作符使用的结构，用于以特定模式（如读取、写入、追加等）访问文件。文件句柄也可以作为参数传递给子程序，以便对文件进行各种操作。\n\
  \n在下面的示例中，文件句柄被传递给子程序：\n\n## 可变与不可变参数\n\n\n\n\n\nPerl 函数或子程序（subroutine）是执行特定任务的语句集合。用户希望在每种编程语言中重用代码。因此，用户将代码段放在函数或子程序中，以避免重复编写代码。这些子程序拥有参数，定义了调用函数时可以传递的参数的类型和数量。这些参数用于通过函数的表达式来评估传递给函数的值。然后，这些值将传递给调用函数并返回给指定的参数。\n\
  \n### 可变参数 (Mutable Parameters)\n\n这些参数的值在传递给参数的函数内部是可以被修改的。\n\n这表示当通过调用者函数向函数提供参数时，其值与被调用函数中的参数绑定，因此，在被调用函数中对值进行的任何更改也将反映在通过调用者函数传递的参数上。\n\
  \n### 不变参数 (Immutable Parameters)\n\n这些参数属于此类，其值在提供给它的函数内部无法被修改。这表示当通过调用者函数向函数提供参数时，子程序获取的是一个值而不是变量。因此，对函数参数的任何修改都不会反映。\n\
  \nPerl 的子程序参数默认是不可变的，这意味着它们不能在函数内部被修改，且无法无意中更改调用函数的参数。在特定的编程语言中，这被称为“按值传递”（call\
  \ by value），表示被调用的子程序获取的是值而不是变量，因此调用函数的参数不会被改变。\n\nTraits（特性）用于更改这些参数的属性。在子程序内部可以使用\
  \ traits 来更改参数的值。\n\n### Traits\n\n这些是预定义的内置子程序，当在方法内部使用时，它们会在编译运行时更改方法的行为。Traits\
  \ 甚至可以修改方法体或为方法标记元数据。\n\n根据其用法，traits 可以有多种类型，例如：\n\n* `is cached` trait 根据传递给函数的参数自动缓存该函数的返回值。\n\
  * `is rw` trait 允许对子程序参数进行可写访问器操作（writable accessors）。\n* `is copy` trait 允许我们在子程序内部更改参数的值，但不会更改调用者函数中的参数。\n\
  \n**示例：** `is copy` trait 的用法\n```perl\n#!/usr/bin/perl\n# 使用 # ’is copy’ trait\
  \ 的函数定义\nsub Func(Int $variable is copy) {\n    # 要执行的操作\n    $variable += 5;\n\
  }\n### 定义局部变量\nmy $value = 20;\n# 使用局部变量调用函数\nprint Func($value), \"\\n\";\n# 检查\
  \ # $value 是否被更新\nprint $value;\n```\n\n由于 Perl 默认不允许在子程序内部修改参数，因此在上面的代码使用了 `copy`\
  \ trait。此 trait 允许程序将调用者函数的参数值赋值给被调用的子程序的参数。然而，此 trait 只会影响被调用函数中参数的值。\n\n**示例：**\
  \ `is rw` trait 的用法\n```perl\n#!/usr/bin/perl\n# 使用 # ’is rw’ trait 的函数定义\nsub Func(Int\
  \ $variable is rw) {\n    # 要执行的操作\n    $variable += 5;\n}\n### 定义局部变量\nmy $value\
  \ = 20;\n# 使用局部变量调用函数\nprint Func($value), \"\\n\";\n# 检查 # $value 是否被更新\nprint\
  \ $value;\n```\n\n当在上述代码中使用 `is rw` 代替 `is copy` trait 时，调用者函数中传递的参数值也会被更新。\n\n\
  当使用 `is rw` trait 时，被调用函数的参数与调用者函数的参数绑定，因此如果前者值发生变化，后者将立即更新。这是因为一种被称为“按引用传递”（call\
  \ by reference）的过程。由于两个参数都指向同一个内存位置（由于 `is rw` trait 的作用），因此参数是完全可变的。\n\n## 多个子程序\
  \ (MULTIPLE SUBROUTINES)\n\nPerl 函数或子程序是执行特定任务的语句集合。每种编程语言用户都希望重用代码。因此，用户将代码段放在函数或子程序中，以避免重复编写代码。\n\
  \n虽然函数（function）、子程序（subroutine）和方法（method）在 Perl 中是可以通用的，但在其他编程语言中并非如此。由于它是使用关键字\
  \ `sub` 创建的，因此在 Perl 编程中常用“子程序”一词。当函数被调用时，Perl 会停止执行整个程序并跳转到函数处执行，然后再返回到之前运行的代码段。可以避免使用\
  \ `return` 语句。\n\n### 子程序定义\n\n在 Perl 中，定义子程序的通用格式如下：`sub subroutine_name { # 方法或子程序的正体\
  \ }`\n\n由于 Perl 允许编写多个同名的子程序（除非它们具有不同的签名），因此 Perl 程序可以包含多个同名的子程序而不会产生错误。这可以通过更改每个同名子程序的参数个数（arity）来定义。\n\
  \n子程序的参数个数性（Subroutine arity）：只要参数个数不同，Perl 子程序可以具有相同的名称。一个子程序拥有的参数数量称为其 arity。这些参数可以是不同的数据类型，也可以不是。只要子程序的数量不同，Perl\
  \ 程序就不会产生错误。\n\n### “multi” 关键字的使用\n\n关键字 `multi` 可用于在 Perl 中创建多个子程序。这对于创建相同名称的多个子程序非常有用。\n\
  \n多个子程序通常用于创建像 Perl 等编程语言中的内置函数和大多数运算符。通过不为每个子程序使用不同的名称，可以了程序的复杂度。无论需要什么代码语句，只需传递该函数的参数数量，工作即可完成。在这种情况下，编译器将选择函数签名与被调用处相匹配的子程序版本。\n\
  \n各种程序，例如数字阶阶、斐波那契数列等，需要使用多个函数来解决问题。使用多个子程序将有助于降低此类程序的复杂性。\n\n**第一个示例**：斐波那契数列和\n\
  ```perl\n#!/usr/bin/perl\n# 打印斐波那契数列和的程序\n# 用于 $n = 0 的函数 Fibonacci_func(0) {\n\
  \    1; # 返回 1\n}\n# 用于 $n = 1 的函数 Fibonacci_func(1) {\n    1; # 返回 1\n}\n# 计算和的递归函数\
  \ multi Fibonacci_func(Int $n where $n > 1) {\n    Fibonacci_func($n - 2) + Fibonacci_func($n\
  \ - 1);\n}\n# 使用函数调用打印和\nprint Fibonacci_func(27);\n```\n\n为了计算斐波那契数列的和，前面的示例使用了多个子程序。\n\
  \n**第二个示例：**数字阶乘\n```perl\n#!/usr/bin/perl\n# 打印数字阶乘的程序\n# 0 的阶乘 multi Factorial(0)\
  \ {\n    1; # 返回 1\n}\n# 计算阶乘的递归函数\n# multi Factorial(Int $n where $n > 0) {\n \
  \   $n * Factorial($n - 1); # 递归调用\n}\n# 使用函数调用打印结果\nprint Factorial(25);\n```\n\
  \n在前面的示例中，程序使用 `multi` 关键字声明了名称相同但参数个数不同的多个子程序。\n\n\n\n\n变量在 Perl 中用于访问存储在内存的数据（所有数据和函数都存储在内存中）。变量被赋予数据值，这些值随后会在各种操作中使用。Perl\
  \ 引用允许你通过不同的变量访问相同的数据。在 Perl 中，引用是一种标量数据类型，它存储另一个变量的位置。其他变量包括标量、哈希表（hashes）、数组、函数名等。嵌套数据结构的构建非常简单，因为用户可以创建一个列表，该列表包含另一个列表的引用，而该列表又包含对数组、标量、哈希等的引用。\n\
  \n### 创建引用\n\n我们可以对标量值、哈希表、数组、函数等创建引用。要创建引用，定义一个新的标量变量，并在变量名（即我们想要引用的变量）前加上一个反斜杠\
  \ `\\`。\n\n创建不同数据类型的引用：\n- 数组引用：定义数组 `@array = (’1’, ’2’, ’3’;);`\n- 为数组变量创建引用 `$reference_array\
  \ = \\@array;`\n- 哈希引用：定义哈希表 `%hash = (’1’=>’a’, ’2’=>’b’, ’3’=>’c’);`\n- 为哈希变量创建引用\
  \ `$reference_hash = \\%hash;`\n- 标量值引用：定义标量 `$scalar_val = 2431;`\n- 为标量变量创建引用\
  \ `$reference_scalar = \\$scalar_val;`\n\n**备注：**\n\n- 键值对周围的花括号 `{}` 可用于创建指向匿名哈希的引用。\n\
  - 方括号 `[]` 可创建指向匿名数组的引用。\n- `sub` 也可以用于创建指向匿名子程序的引用。这里的子程序将没有名称。\n- 无法对输入/输出句柄（如\
  \ `dirhandle` 或 `FileHandle`）创建引用。\n\n### 解引用（Dereferencing）\n\n现在我们已经创建了引用，我们必须使用它来获取值。解引用是获取引用所指向内存中值的方法。根据变量类型，我们使用前缀\
  \ `$`、`@`、`%` 或 `&` 来解引用（引用可以指向数组、标量、哈希等）。\n\n### 引用传递\n\n当变量通过引用传递时，函数对函数的原始数据进行操作。函数可以通过引用传递来更改变量的原始值。\n\
  \n当参数数组 `@_` 中的元素值发生变化时，相应参数的值也会发生变化。这就是引用传递的作用。\n\n在以下示例中，在子程序 `sample` 中更新数组 `@a`\
  \ 的元素会更改参数的值，这将反映在整个程序中。因此，当引用参数时，在函数中更改它们的值会改变主程序中的值。\n\n程序的运行方式如下：\n\n- 定义了一个值从\
  \ 0 到 10 的数组。\n- 随后将该数组传递给“sample”子程序。\n- 已经定义了一个名为“sample”的子程序。在该程序内部通过参数数组 `@_`\
  \ 更改第一个和第二个参数的值。\n- 调用子程序后，显示数组 `@a` 的值。前两个标量值现在分别更新为 A 和 B。\n\n### PERL 递归\n\n\
  递归是一种机制，允许函数反复调用自己，直到满足所需的条件。当函数调用语句写在同一个函数内部时，该函数即是递归的。\n\n传递给函数的参数从默认数组 `@_` 中检索，每个值都可以通过\
  \ `$_[0]`、`$_[1]` 等访问。\n\n**第一个示例**：以下示例计算一个数的阶乘。\n\n程序的运行方式如下：\n\n- 步骤 1：当标量 `a`\
  \ 的值为 0 或 1 时，函数返回 1，因为 0! 和 1! 都是 1。\n- 步骤 2：如果标量 `a` 的值为 2，则 `fac(x-1)` 调用 `fac(1)`，后者返回\
  \ 1。\n  - 结果为 `2*factorial(1) = 2*1 = 2`。\n  - 结果为它将返回 2。\n- 步骤 3：同样，当向函数传递更高的值时，参数值每次调用减\
  \ 1，一直计算到值达到 1。\n\n**第二个示例**：以下示例计算到指定数的斐波那契数列。\n\n程序的工作原理如下：\n\n- 步骤 1：调用带有三个参数的\
  \ `fib()`，前两个是 0 和 1，而 `$n` 是要打印数列的数字。\n- 步骤 2：这些值以数组的形式传输，使用 `shift` 检索其内容。\n-\
  \ 步骤 3：对于每次调用，使用 `shift` 获取前两个值并存储在标量 `c` 和 `d` 中。这两个值现在相加以产生数列中的下一个值。重复此步骤，直到值达到用户指定的结束值。\n\
  \n在本章中，我们涵盖了 Perl 中的子程序，讨论了函数签名、向子程序传递复杂参数，以及可变和不可变参数。此外，我们还讨论了多个子程序的使用、`return()`\
  \ 函数的用法、引用传递和递归。\n\n# 评价\n\nPerl 是一种在商业和私有计算行业中广泛使用的跨平台开源编程语言。在 20 世纪末和 21 世纪初，Perl\
  \ 曾备受 Web 开发者的青睐，因为它具有适应性强的文本处理和问题解决能力。\n\n美国程序员兼语言学家拉里·沃尔（Larry Wall）于 1987 年 12\
  \ 月首次为基于 Unix 的计算机发布了 Perl 1.0。这个早期版本的 Perl 是一种直观、易于编码的语言，用于读取、提取和打印文本文件中的信息；它还能执行其他系统管理任务。Perl\
  \ 通常被认为代表“实用提取和报告语言”（Practical Extraction and Report Language），它的灵感源自现有的编程语言，如 C、BASIC\
  \ 和 AWK，但它对常用英语术语的使用反映了沃尔的语言背景。\n\nPerl 是一种为脚本操作设计的编程语言。然而，现在 Perl 用于广泛领域，包括 Web\
  \ 开发、图形用户界面（GUI）开发、系统管理等等。它是一种可靠且跨平台的编程语言。\n\nPerl CGI 用于 Web 开发。CGI 是与网络浏览器和 Perl\
  \ 通信的系统网关。\n\n它最常见的应用是从文本文件中提取信息并打印报告，将文本文件转换为另一种格式。这是因为它的名称源自“实用提取和报告语言”。\n\nPerl\
  \ 脚本是用 Perl 编写的程序，而 Perl 程序是执行 Perl 脚本的系统程序。Perl 是一种脚本语言。当我们运行 Perl 程序时，它首先被编译成字节码，然后转换为机器指令。用\
  \ Perl 而不是 C 写程序可以节省时间。\n\n它与大多数操作系统兼容，并被收录于《津英语词典》。它从多种语言中借用了概念和语法，包括 AWK、bourne\
  \ shell、C、sed 甚至是英语。\n\n## PERL 历史\n\n拉里·沃尔于 1987 年创建了 Perl，作为一种脚本语言来帮助处理报告。\n\n\
  1987 年 12 月 18 日，发布了 1.0 版本。\n\n- Perl 2 于 1988 年发布，它包含了一个改进巨大的正则表达式引擎。\n- Perl\
  \ 3 于 1989 年发布，它包含了对二进制数据流的支持。\n- Perl 4 于 1991 年发布，比之前的版本具有更好的文档。\n- 1994 年 10\
  \ 月 17 日，发布了 Perl 5。其最新版本包含了许多新功能，如对象、变量、引用和模块。\n- 最新的版本 5.24 于 2016 年 5 月 9 日发布。\n\
  \n## PERL 特性\n\n- 它具有直观的面向对象语法。\n- 由于支持 25000 个开源模块，它能够轻松扩展。\n- 支持 Unicode。\n\n\n\
  \n\n它包含了强大的文本处理工具，使其兼容标记语言，如 `HTML` 和 `XML`。\n\n它支持第三方数据库，如 `Oracle` 和 `MySQL`。\n\
  \n它可以嵌入 Web 服务器和数据库服务器等其他系统中。\n\n它是一项基于 GNU 许可的开源软件。\n\n`Perl` 用于编写许多框架。\n\n它能够处理加密的\
  \ Web 数据，包括电子商务交易。\n\n它是一种平台无关的语言。\n\n它包含一个正则表达式引擎，可以转换任何类型的文本。\n\n## PERL 许可\n\n\
  Larry Wall 拥有 `Perl 5` 的版权 (C)。它是免费的开源软件。根据 `GNU` 和 `Artistic Licenses` 的条款可以对其重新分发或修改。\n\
  \n`GNU 通用公共许可证` 为用户提供免费的开源软件。任何源自 GNU 许可源代码的程序必须使用相同的许可证。\n\n根据 `Artistic license`，从\
  \ `Perl` 派生的包必须明确突出其修改部分。原始模块和派生模块都应该分发。重要的是，必须承认原始作者为包的所有者。用户应该能够区分原始模块和派生模块。\n\
  \n## PERL 与 Web\n\n由于其文本处理能力和快速开发周期，`Perl` 曾经是最流行的 Web 编程语言。\n\n`Perl` 通常被称为“互联网的胶带”。\n\
  \n`Perl` 能够处理加密的 Web 数据，包括电子商务交易。\n\n`Perl` 可以嵌入 Web 服务器以将处理速度提高 2000%。\n\n`Perl`\
  \ 模块 `mod Perl` 使 `Apache` Web 服务器包含 `Perl 解释器`。\n\n`Perl` 的 `DBI` 包简化了 Web 数据库的集成。\n\
  \n## PERL 是解释型的\n\n由于 `Perl` 是一种解释型语言，我们的代码可以在不编译成不可移植的可执行程序的情况下运行。\n\n传统的编译器将程序翻译成机器码。当你运行\
  \ `Perl` 程序时，它首先被编译成字节码，然后转换为机器指令（在程序运行时）。因此，它与 shell 或 `Tcl` 不同，后者是严格解释的，没有中间表示。\n\
  \n它也与大多数 `C` 或 `C++` 版本不同，后者被直接编译成依赖于机器的格式。它处于中间位置，与 `Python`、`AWK` 和 `Emacs` 的\
  \ `.elc` 文件一样。\n\n## 优点\n\n`Perl` 有以下优势：\n\n* **选项：** `Perl` 用户在编写程序或解决问题方面有许多选择。\n\
  * **灵活：** 语言的设计和语法允许用户按照偏好的编程风格编写代码。\n* **开源：** 它是免费的。任何人都可以在各种平台上免费地访问、开发和使用 `Perl`。\n\
  * **可用性：** 它在很多地方预先安装，`Comprehensive Perl Archive Network`（全面 存档网络）包含超过 25,000 个\
  \ `Perl` 模块。大多数操作系统也支持它。\n\n## 缺点\n\n`Perl` 的主要缺点是它在许多方面都是一种相当混乱的语言：\n\n* **难以阅读：**\
  \ 它很难阅读。根据一些开发者来说，`Perl` 比 `Python` 等较新的语言更难阅读且不精简。因为编写 `Perl` 程序的方法有很多，代码可能会变得乱无章且不整洁。\n\
  * **难以调试：** 调试和修复问题可能很困难，因为 `Perl` 代码可能晦涩或混乱。\n* **性能缺陷：** 使 `Perl` 有用的灵活性也可能让它变慢。这是因为灵活性会导致效率低下和冗余，增加编译时间。\n\
  \n## PERL 对比 PYTHON\n\n`Perl` 和 `Python` 有共同的祖先。它们被创建是为了让脚本编写变得简单。`Perl` 的创建是为了给\
  \ `Unix` 脚本提供 `C-like` 的结构。`Python` 的创建是为了让 `C` 更容易使用并适用于脚本编写。\n\n在语法上，`Perl` 和\
  \ `Python` 非常相似，从 `Perl` 翻译到 `Python` 相对简单，只有几处显著的语法变化。\n\n然而，有四个显著差异：\n\n* `Perl`\
  \ 中用分号结束行。\n* Python 缺少大括号和缩进，而 `Perl` 有。\n* `Perl` 中的变量名使用变量符号样式化，例如 `$x`、`% x`\
  \ 和 `x`。在 `Python` 中，变量名不带变量标识符，例如 `x`。\n* 在 `Python` 中，`print` 语句在输出末尾插入新行。\n\n\
  其他差异还包括：\n\n* `Perl` 可能是混乱的，而 `Python` 更精简。\n* 在 `Perl` 中，有多种方法完成任务，而 `Python` 设计旨在为任何给函数提供单一清晰的路径。\n\
  * `Python` 比 `Perl` 更具可读性。\n* `Python` 通常被认为是最好学习的语言之一。\n* `Python` 是比 `Perl` 新语言。\n\
  * `Perl` 集成在源码中。\n* `Python` 因其作为动态语言的声誉而是一种强大的编程语言。\n* `Python` 在开源开发者社区中拥有更多支持。\n\
  \n| Perl | Python |\n| --- | --- |\n| 它是一种高级的、基于解释器的动态编程语言。 | 它是一种带有解释器的高级通用语言。\
  \ |\n| 可以 `https://www.perl.org/get.html` 下载 Unix/Linux、macOS 或 Windows 版 Perl。\
  \ | 可以从 `https://www.python.org/downloads/` 下载适用于 Unix/Linux、macOS、Windows 及其他系统的\
  \ Python。 |\n| Perl 的目标是简化报告创建，后来经历了许多变化和修订。 | Python 的目标是让为中小型项目和应用程序编写简单且逻辑清晰的代码更容易。\
  \ |\n| 与 Python 代码相比，Perl 代码并不那么简单。 | Python 代码更直观、更易理解。 |\n| Perl 拥有卓越库支持，可以使用内置函数在操作系统级别处理操作。\
  \ | 为了处理此类操作，Python 需要第三方库的帮助。 |\n| 可用的 OOP 支持有限。 | Python 为面向对象的编程提供了卓越的支持。 |\n\
  | 使用括号来标记和识别代码块。 | 使用缩进来标记和识别代码块。 |\n| 空格在 `Perl` 中至关重要。 | 空格在 `Python` 中很重要并可能导致语法错误。\
  \ |\n| 它便于文本处理，因为 `Perl` 包含了对正则表达式的支持。 | 处理正则表达式，Python 需要使用外部函数。 |\n| 在 `Perl`\
  \ 中结束代码行使用分号(;)。 | 在每行代码末尾不需要分号(;)。 |\n| Perl 的文件扩展名是 .pl。 | Python 文件的扩展名是 .py。\
  \ |\n\n## PERL 对比 JAVA\n\nLarry Wall 在 1987 年发明了 `Perl`。`Perl` 同时支持面向对象和过程化编程。它与\
  \ `C` 和 `C++` 相似。`Perl` 最初设计用于处理文本。\n\n`Java` 是一种著名的编程语言。`Java` 既是一种编程语言也是一种计算机平台。Sun\
  \ Microsystems 在 James Gosling 的发起下于 1995 年发布了 `Java`。Oracle 声称全球有 30 亿设备在使用 `java`。它的设计允许开发者“编写一次，到处运行”，这意味着\
  \ Java 应用程序可以在一个平台上生成并在任何支持 `JVM` 的其他平台上执行。\n\n以下是 Perl 和 Java 的一些关键区别：\n\n| 特性\
  \ | Perl | Java |\n| --- | --- | --- |\n\n\n\n\n\n| 特性 | Perl | Java |\n| :--- |\
  \ :--- | :--- |\n| 介绍 | “Perl 是一种通用的高级级编程语言，因 CGI 脚本而流行。” CPanel 和 Bugzilla 是两个流行的\
  \ Perl 项目。最初，它旨在取代复杂的 shell 脚本。 | Java 既是一种编程语言，也是一个计算平台。如果不安装 Java，仍然会有程序和网站无法运行。它快速、安全且可靠。\
  \ |\n| 编译格式 | Perl 6 被编译为 `Parrot Bytecode`，而 Perl 5 及更早版本是解释型语言。它以扩展名 `.pbc` 保存。\
  \ | Java 应用被翻译成字节码。 |\n| 关联数组 | Perl 以极其简洁的方式定义关联数组。 | Java 字节码可以发送到网络上，然后在任何具有\
  \ `JVM` 的系统上运行。它以扩展名 `.class` 保存。 |\n| 重点 | Perl 擅长支持文件扫描和报告创建等常见活动。 | Java 中没有简洁的方法来创建关联数组。然而，它拥有哈希（hash）实现。\
  \ |\n| 文件扩展名 | Perl 程序以 `.pl` 扩展名保存。例如：`MyFile1.pl` | Java 程序以 `.java` 扩展名保存。例如：`MyFile1.java`\
  \ |\n| 类型化方法 | Perl 是动态类型语言，这意味着大多数类型检查发生在执行期间。 | Java 是静态类型语言，这意味着大部分的类型检查发生在编译阶段。\
  \ |\n| 注释与文档 | Perl 中的内联注释使用 `#` 编写。例如：Perl 中的 `#Inline-Comment`。Perl 中的文档使用 `=`\
  \ 和 `=cut` 完成。例如：`=Perl documentation follows following syntax` `=cut` | Java 中的单行注释使用\
  \ `//` 声明。例如：`//Single-line Comment`。多行注释使用 `/*……*/` 编写。例如：`/* it is a multiline\
  \ comment */`。Java 中的文档使用 `/**…………*/`。例如：`/**Documentation in the Java*/` |\n| 语句结束\
  \ | Perl 中的每个语句必须以分号（`;`）结束。 | Java 中的每个语句必须以分号（`;`）结束。 |\n\n## PERL 对比 C/C++\n\n\
  Perl 是一种动态、高级、解释型、通用的编程语言。\n\n它由 Larry Wall 在 1987 年创建。Perl 没有官方的缩写，尽管“实用提取与报告语言”（Practical\
  \ Extraction and Reporting Language）是最常见的。\n\n有些程序员将 Perl 称为“病态折衷主义垃圾列表器”和“实际上一切都非常喜欢的列表”。“实用提取与报告语言”这个缩写经常被使用，因为\
  \ Perl 最初的设计目的是用于文本处理，例如从特定文本文件中提取必要信息并将文本文件转换为新格式。它支持过程化和面向对象的编程。C++ 是一种如今常用于竞争性编程的通用编程语言。\n\
  \n它支持命令式、面向对象和泛型编程。C++ 可以在包括 Windows、Linux、Unix 和 Mac 在内的各种运行。\n\n以下是 Perl 和 C/C++\
  \ 之间的一些显著差异：\n\n| 特性 | Perl | C/C++ |\n| :--- | :--- | :--- |\n| 驱动函数 (main()) |\
  \ Perl 不需要显式的驱动函数。 | C/C++ 代码必须执行 `main()` 函数才能编译。 |\n| 编译过程 | Perl 是一种解释型的编程语言。\
  \ | C++ 是一种用于通用面向对象编程 (OOP) 的语言。 |\n| 闭包 | Perl 中包含不可访问私有数据的闭包可以作为对象使用。 | C/C++\
  \ 不允许闭包（可以被视为可以作为变量的函数）。 |\n| 文件扩展名 | `.pl` 扩展名用于存储 Perl 脚本。例如，`perlDocument.pl`\
  \ | `.c` 和 `.cpp` 扩展名分别用于保存 C 和 C++ 代码。`MyFile.c` 和 `myFile.cpp` 是两个示例。 |\n| 大括号\
  \ | Perl 中，if 语句的“then”部分必须使用大括号。例如：`if ( condition ) { statement }` | C/C++ 中的\
  \ if 和循环后不需要大括号。例如：`if ( condition ) statement;` |\n| 字符串声明 | 在 Perl 中使用单引号声明字符串。双引号会强制对字符串内容进行评估。示例：`$x\
  \ = “peeksforpeeks\"` | 在 C/C++ 中定义字符串使用双引号。例如：`string s =“peeksforpeeks\"` |\n\
  | 注释 | 在 Perl 中，我们利用 `#` 进行内联注释。例如 Perl 中的 `#Inline-Comment` | C/C++ 使用 `//` 进行内联注释。例如\
  \ C/C++ 中的 `//Inline-Comment` |\n\n**用于两个数字相加的 Perl 程序：**\n\n```perl#!/usr/bin/perl\n\
  # Perl program for adding two numbers\n$choice = 13;\n$choice2 = 15;\n$res = add($choice,\
  \ $choice2);\nprint \"Result is $res\";\n# Subroutine to perform\n# the addition\
  \ operation\nsub add {\n    ($c,$d) = @_;\n    $res = $c + $d;\n    return $res;\n\
  }\n```\n\n### 它值得学习吗？\n\nPerl 擅长文本处理。它是处理日志、数据清洗以及我们从命令行可以完成的几乎任何其他事情的极佳语言。尽管它曾是\
  \ Perl CGI 这一庞然物的驱动力，但现在已经有了用于现代 Web 应用的新框架，如 Dancer。\n\nPerl 仍然是现代编程的一个可行选择。CPAN\
  \ 仍在运行，且大多数实用的模块仍在维护。像《Modern Perl》这样的书籍展示了如何在避免过去的陷阱的同时保持 Perl 的现代性。\n\n### 保持\
  \ Perl 的相关性\n\nPerl 从一种“瑞士军刀链锯”语言演变为适用于广泛用途的健壮脚本语言。它已经发展到在某些挑战中表现出色的程度，但除非我们喜欢这种语言，否则应该避免其他某些挑战。\n\
  \n我们不会在 GUI 中使用它，但在处理数据或命令行时，不会忽略它，除非有非常有服力的理由。这种语言仍在不断修订，目前的基准标准是 5.8。MacOS 自带\
  \ Perl，在每个 Linux 发行版中都有（且很多人需要），通过 Strawberry Perl 在 Windows 上也能正常运行。\n\n### Perl\
  \ 的用途\n\n\n\n\n如果我们想在科技领域工作，就应该学习 Perl。那些使用 Perl 构建系统管理流程、网络程序和网站的公司都需要 Perl 开发者。Amazon、Roblox、Venmo\
  \ 和 MIT 都是这些公司中的成员。Perl 专家担任解决方案工程师、软件工程师、Web 开发人员和数据库工程师等职位。如果我们想在科技行业担任编码员或系统管理员，Perl\
  \ 是完善我们对当前技术理解的极佳方式。\n\n## 为什么我们需要学习 Perl？\n\n我们应该学习 Perl 的原因如下：\n\nPerl 是一门非常出色的通用编程语言。Perl\
  \ 被广泛应用于许多领域，包括数据库管理、Web 开发、系统管理和网络编程。\n\nPerl 的使用方式非常新颖。生物信息学程序员编写软件来理解生物学数据集。不断发展的基因组学领域利用了生物信息学领域的专业知识。我们可以使用\
  \ Perl 获取基因序列并研究群体遗传学。\n\nPerl 基于语言学概念，直到今天仍然是一门优秀的文本处理语言。人们会被正则表达式（Regex）、HTML\
  \ 解析和 JSON 操作。Perl 还可以用于实现语言处理功能，如语音识别和文本转语音翻译。通过广泛使用的测试一切协议（`TAP`），你还可以使用 Perl\
  \ 自动测试应用程序。\n\n总之，掌握 Perl 将为我们的 Web 开发职业提供有趣的选择。Perl 编码员的需求量很大。一旦我们掌握了 Perl，就可以利用它来驱动自己的项目或寻找工作。根据\
  \ TIOBE 指数（一个根据搜索引擎结果评估编程语言流行程度的网站），Perl 目前在 50 种编程语言中排名第 17 位。\n\n该指数整合了 25 个搜索引擎的结果。它统计了特定编程语言的点击次数，并根据点击次数来确定该语言在索引中的排名。这结合提及\
  \ Perl 的职位发布频率等数据表明，虽然 Perl 目前不是最流行的编程语言，但它仍在使用中，因此是一项值得获得的人才技能。\n\nLinkedIn 上有超过\
  \ 15,000 个包含 Perl 的职位，Glassdoor 上有超过 10,000 个。即使 Perl 现在可能不是最流行的编程语言，但公司继续使用它来运行其\
  \ Web 业务，并继续寻找具备这一技能组合的人。\n\n## 学习 Perl 需要多长时间？\n\n给自己三个月时间学习基础知识并开始编写程序。这假设我们每天花一小时学习这门语言。\n\
  \n这一估计基于这样一个事实：学习 Python 基础大约需要八周，Python 是另一种与 Perl 同时期出现（1991 年）的脚本语言，并用于许多类似的任务。\n\
  \n然而，一个显著的区别是，Python 的设计目标是让执行任务的方法有限，而 Perl 的设计哲学是“一件事有多种方法”（There’s more than\
  \ one way to do it）。这意味着我们可能需要花更多时间学习 Perl 的基础。\n\n## Perl 难吗？\n\n对于初学者来说，Perl 可能具有挑战。另一方面，拥有其他脚本语言经验可以缩短学习曲线。如果我们有一些\
  \ Python 经验，学习 Perl 将变得简单。\n\n我们必须安装软件并与命令行交互以开始学习 Perl。如果我们以前从未这样做，请在学习 Perl 语法之前先完成。Perl\
  \ Learn 为所有平台提供了直接的安装说明。\n\n## Perl 调试器的断点\n\n在 Perl 中控制程序执行是通过指示调试器执行到程序中的特定点，该点被称为断点（breakpoint）来实现的。断点允许用户对程序进行分段并搜索错误。\n\
  \n以下调试器命令用于创建此类断点，以及执行到到达断点为止的命令。\n\n### b 命令\n\n`b` 命令用于在程序中设置断点。此命令指示调试器每当执行到特定行时停止程序。\n\
  \n例如，以下命令指示调试器在即将执行第 12 行时停止：\n```\nDB<13> b 12\n```\n（如果该行不可断开，调试器将返回第 12 行不可设置断点。）\n\
  \n程序可以有无限数量的断点。当调试器准备执行包含包含断点的语句时，程序将停顿。\n\n`b` 命令也接受子程序名：\n```\nDB<15> b valuedir\n\
  ```\n这会在子程序 `valuedir` 的第一个可执行语句处设置一个断点。\n\n`b` 命令还可以只在满足特定条件时才停止程序。\n\n例如，以下命令指示调试器在即将执行第\
  \ 12 行且变量 `$vardir` 等于空时停止：\n```\nDB<15> b 12 ($vardir eq \"\")\n```\n`b` 语句可以用于指定任何合法的\
  \ Perl 条件表达式。\n\n可以在多行语句的任何一行上设置断点。\n\n例如：\n```\n16: print (\"Peeks\", 17: \" for\
  \ Peeks here\");\n```\n第 16 行可以作为断点，但第 17 行不行。\n\n### c 命令\n\n`c` 命令指示调试器继续调试，直到到达断点或程序结束。\n\
  \n当调试器即将到达设置了断点的第 12 行时，程序停止并显示该行，因为调试器总是显示即将执行的行行。\n\n调试器在此处生成一个另一个调试命令的提示符。该提示符允许我们通过输入\
  \ `n` 或 `s` 来逐语句地继续执行过程，通过输入 `c` 继续执行过程，通过输入 `b` 设置更多断点，或执行任何其他调试操作。\n\n可以使用 `c`\
  \ 命令和行号设置临时（仅限一次）的断点：\n```\nDB<15> c 12 main::(debugtest:12): &readsubdirs($vardir);\n\
  ```\n`c` 命令的参数 12 指示调试器在第 12 行设置一个临时断点，然后继续执行。当调试器到达第 12 行时，它会停止执行过程，显示该行并移除断点。\n\
  \n`c` 命令用于在人们想要跳过几行代码而不通过逐语句执行程序来浪费执行时间时定义临时断点。使用 `c` 还避免了使用 `b` 定义断点然后用 `d` 命令将其删除的需要。\n\
  \n### L 命令与断点\n\n第 4–8 行已经执行，并且在第 11 行设置了断点。（不包括第 7 行，因为它是注释。）通过检查紧随在断点之后的条件表达式，可以将断点与已执行的行区分开来。在这种情况下，条件表达式设置为\
  \ `(1)`，表示该断点始终有效。\n\n### d 和 D 命令\n\n当断点的工作完成后，可以使用 `d` 命令将其删除。\n\n前一个命令指示调试器移除在第\
  \ 12 行设置的断点。\n\n如果没有指定要删除的断点，调试器会假设下一要执行的行有一个断点并自动删除它。\n\n由于第 12 行是下一个执行的行，调试器会自动移除第\
  \ 12 行的断点。\n\n`D` 命令用于移除程序的所有断点。\n\n上述命令移除所有通过 `b` 命令设置的断点。\n\n### 退出脚本\n\n\n\n\n\
  \n`exit()` 评估传递的表达式并退出 Perl 解释器，将该值作为退出值返回。`exit()` 函数并不总是立即退出，而是在终止程序之前调用程序的结束例程。如果没有向\
  \ `exit` 函数传递表达式，则默认值为 `0`。`exit()` 函数的用途有限，不应用它退出子程序。要退出子程序，请使用 `die` 或 `return`。\n\
  \n上述代码的工作原理如下：\n\n- 步骤 1：要求用户输入一个出价。\n- 步骤 2：如果出价小于 1000，`exit` 返回该出价并终止程序。\n- 步骤\
  \ 3：如果出价大于或等于 1000，则打印此消息。\n\n**Exit 函数的参数传递：** 参数可以传递给 `exit` 函数并存储在系统的变量中。\n\n\
  需要注意的是，传递给 `exit` 函数的值可以是任意随机值；它不必是某个特定值。\n\n以下示例展示了如何向 `exit` 函数传递值：\n\n```perl\n\
  ### Opening 文件\nif(!open(fh,\"<\",\"Filename.txt\")) {\n    # 此代码块传递错误代码 56\n  \
  \  # 给 exit 函数指示文件\n    # 无法打开。\n    print \"Couldn’t open file\";\n    exit 56;\n\
  }\n# 将成功代码 1 传递给\n# exit 函数\nexit 1;\n```\n\n以下步骤展示了上述程序的工作：\n\n- 步骤 1：以只读模式打开文件。\n\
  - 步骤 2：如果块执行且无法打开文件，它将调用 `exit` 函数向系统发送错误代码 56。\n- 步骤 3：如果文件成功打开，则返回 1。\n- 在 Linux/Unix\
  \ 上，`$?` 显示 `exit` 函数返回的值。终端命令 `echo $?` 显示 `exit` 函数返回的值。\n\n## 创建 Excel 文件\n\n\
  Excel 文件是计算机通信中常用的办公应用程序。它创建由文本、数字和计算公式组成的行和列。它是发送报告的方便方式。此演示兼容 Linux、Windows 和其他平台。在\
  \ Excel 中，行从 1 到 n 编号……而列由 A 到 C 等字母表示。`A1` 指左上角。可以使用 Padre IDE 通过 Perl 创建 Excel\
  \ 文件，但我们也会使用 `Excel::Writer::XLSX`。\n\nPerl 使用 `write()` 函数向 Excel 文件添加内容。\n\n###\
  \ 创建 Excel 文件\n\n可以使用 Perl 命令行创建 Excel 文件，但必须先加载 `Excel::Writer::XLSX` 模块。\n\n程序的运行如下：\n\
  \n- 步骤 1：加载 `Excel::Writer::XLSX` 模块。\n- 步骤 2：创建一个名为 `$Excelbook` 的对象代表整个 Excel\
  \ 文件。\n- 步骤 3：使用 `write()` 方法将数据插入工作表中。\n- 步骤 4：将文件保存为 `.pl` 扩展名。\n- 步骤 5：从命令行运行\
  \ `.pl` 文件生成 Excel 表格。\n\n### 基本公式的使用\n\nExcel 允许使用各种数学公式来简化电子表格计算，例如资产负债表和业务记录。\n\
  \n以下是两个基础 Excel 公式的描述：\n\n- **加法：** Excel 有名为“SUM”的方法，允许我们向特定单元格加值。\n- **计数：** 此\
  \ Excel 函数计算给定范围内所有仅包含数值的单元格。\n\n### 在 Excel 表中添加颜色\n\n颜色可以使用在 Excel 表格中区分不同的值。使用\
  \ `add_format()` 方法指定这些颜色。\n\n### 在特定坐标添加值\n\n通过指定要添加值的单元格地址，可以在特定坐标处添加值。\n\n##\
  \ 读取 Excel 文件\n\nExcel 表格是保存办公记录最流行的方法之一，特别是在处理非开发人员甚至经理可以向系统批量输入的应用程序时。\n\n然而，问题在于使用\
  \ Perl 读取 Microsoft Excel 文件的内容。\n\nCPAN 提供了几个用于读取 Excel 文件的模块。电子表格工具可用：它能够处理所有类型的电子表格。其他读取不同版本\
  \ Excel 文件的低级库包括：\n\n- `Spreadsheet::ParseExcel` Excel 95-2003 文件，\n- `Spreadsheet::ParseXLSX`\
  \ Excel 2007 Open XML XLSX\n\n### 创建 Excel 表格\n\n可以使用 Perl 中的内置模块 `Excel::Writer::XLSX`\
  \ 创建 Excel 文件，该模块用于创建 Excel 文件。\n\n此外，使用 `write()` 函数向 Excel 文件添加内容。\n\n### 读取 Excel\
  \ 文件\n\n`Spreadsheet::` 用于 Perl 中读取 Excel 文件。\n\n在 Perl 脚本中，读取该模块。该模块导了几个可以在你的 Perl\
  \ 代码脚本中导入或使用的函数。要从 Excel 文件读取，请使用 `ReadData()` 函数。\n\n`ReadData()` 函数接收一个文件名（在此情况下为\
  \ Excel 文件），但也接受许多其他文件类型。它会在解析文件之前根据文件扩展名加载相应的后端模块。它生成一个代表整个文件的数组引用：\n\n上述代码返回的数组的第一个元素包含有关文件的通用信息。其余元素代表文件的其他工作表。换句话说，`$book_data->[1]`\
  \ 指“newexcel.xlsx”文件中的第一个工作表。因为它是一个哈希引用，可以使用它来访问单元格的内容。`$book_data->[1]{A2}` 返回\
  \ A2 元素的哈希引用。\n\n### 从 Excel 文件获取行\n\n读取 `Spreadsheet::` 工作表的函数参数以及要获取的行数。传递的行值将作为数组返回。\n\
  \n以下程序展示了如何读取第一个工作表，然后显示每个字段的内容。\n\n#### 获取文件内容\n\n仅获取单行是不够的。为了高效编程，我们必须检索所有行。使用\
  \ `rows()` 函数来完成此操作。该函数接收一个工作表作为参数。它以矩阵的形式返回一个元素数组（二维数组）。电子表格中的每一行都由一个元素表示。\n\n\
  以下脚本将检索所有行：\n\n```perl\nmy @rowsmulti = Spreadsheet::Read::rows($book_data->[1]);\n\
  foreach my $x (1.. scalar @rowsmulti) {\n    foreach my $y (1.. scalar @{$rows[$x-1]})\
  \ {\n        say chr(64 + $x). \" $y \". ($rows[$x - 1][$y - 1]);\n    }\n}\n```\n\
  \n#### 整合在一起\n\n以下 Perl 脚本演示了之前描述的所有在 Perl 中读取 Excel 文件的功能：\n\n```perl\n#!/usr/bin/perl\n\
  use strict;\nuse warnings;\nuse 5.010;\nuse Spreadsheet::Read qw(ReadData);\n\n\
  my $bookdata = ReadData('simplecreate.xlsx');\nsay 'A1 '.$bookdata->[1]{A1};\n\n\
  # 获取单行\nmy @rowsingle = Spreadsheet::Read::row($bookdata->[1], 1);\nfor my $x (0..$row)\
  \ {\n    say 'A'.($x + 1).': '.($rowsingle[$x] // '');\n}\n\n# 获取所有文件内容\nmy @rowsmulti\
  \ = Spreadsheet::Read::rows($bookdata->[1]);\nforeach my $x (1.. scalar @rowsmulti)\
  \ {\n    foreach $y (1.. scalar @{$rows[$x-1]}) {\n        say chr(64 + $x). \"\
  \ $y \". ($rows[$x - 1][$y - 1]);\n    }\n}\n```\n\n## Perl 猜数字游戏\n\n猜数字游戏要求我们在有限次数内猜出随机选择的数字。\n\
  \n必须使用以下函数：\n\n- `rand n`：此函数生成从 0 到 n 的随机数。此外，此函数始终返回浮点数。因此，结果被显式地转换为整数值。\n- `Chomp()`：`Chomp()`\
  \ 是一个从用户输入中删除换行符的函数。\n\n\n\n\nwhile 循环在程序中执行，直到用户估计的数字与生成的数字匹配，或者尝试次数少于最大机会数。如果尝试次数超过机会数，游戏结束，用户失败。如果用户在规定的尝试次数内正确猜中数字，他们将获胜。在每次猜测后，计算机会通知用户他们的估计值是大于还是小于实际生成的数字。起初，此代码中的\
  \ `rand` 函数为 `x` 分配一个随机整数。\n\n`rand(k)` 函数生成一个 0 到 `k` 之间的随机整数。由于这个随机数是浮点型整数，因此使用\
  \ `int` 将其转换为整数。`x` 存储该整数值。用户被赋予了有限的机会来估算数字。如果机会超过了猜中的数字，用户将失败。\n\n该过程如下：\n\n# 猜数字游戏实现\n\
  \n```perl\nprint \"The Number guessing game\\n\";\n# rand 函数用于生成\n# 0 到 10 之间的随机数\n\
  # 将其转换为整数\n# 并存储到变量 \"x\"\n$x = int rand 10;\n# 用于计数正确\n# 次数的变量\n$correct = 0;\n\
  # 分配给用户\n# 猜数字的机会\n# 或者是用户输入\n# 到输入框中的\n# 输入，这里机会\n# 是 4 次\n$chances = 4;\n$n =\
  \ 0;\nprint \"Guess number (between 0 and 10): \\n\";\n# while 循环包含变量 n\n# n 用作计数器值\n\
  # 变量机会\nwhile($n < $chances) {\n    # 输入 0 到 10 之间的数字\n    # 从输入中提取数字\n    # 并移除换行符\n\
  \    chomp($userinput = <STDIN>);\n    # 检查用户是否提供了\n    # 输入\n    if($userinput\
  \ != \"blank\") {\n        # 比较输入的数字\n        # 与要猜的数字\n        if($x == $userinput)\
  \ {\n            # 如果用户输入的数字\n            # 与 rand 函数生成的\n            # 数字相同，则\n\
  \            # 使用循环控制语句 \"last\"\n            # 跳出循环\n            $correct = 1;\n\
  \            last;\n        }\n        # 检查用户输入的\n        # 数字是否小于\n        # 生成的数字\n\
  \        elsif($x > $userinput) {\n            print \"Our guess was too low,\"\
  ;\n            print \" guess a higher number than ${userinput}\\n\";\n        }\n\
  \        # 用户输入的数字\n        # 大于生成的\n        # 数字\n        else {\n            print\
  \ \"Our guess was too high,\";\n            print \" guess a lower number than ${userinput}\\\
  n\";\n        }\n        # 给用户的机会\n        # 数加一\n        $n++;\n    } else {\n\
  \        $chances--;\n    }\n}\n# 检查用户是否\n# 猜中了正确的数字\nif($correct == 1) {\n    print\
  \ \"We Guessed Correct!\";\n    print \" Number was $x\";\n} else {\n    print \"\
  It was actually ${x}.\";\n}\n```\n\n注意：在上述程序中，用户可以更改 `rand` 函数的值来增加游戏中数字范围，并通过更改\
  \ `chance` 变量的值来增加机会。\n\n## 使用 DBI 进行数据库管理\n\nPerl 最常用的应用之一是创建数据库应用程序。我们可以使用 Perl\
  \ 构建带有数据库的处理所有数据的复杂 Web 应用程序。它提供了极好的接口支持和多种数据库格式。Perl 包含一个名为 `DBI` 的模块用于连接和访问数据库。`DBI`\
  \ 是连接到基于结构化查询语言（SQL）的数据库服务器的接口。\n\n通常，Perl 需要两个步骤来访问数据库。`DBI` 模块提供了数据库访问 API。软件使用\
  \ `DBI` 函数修改数据库。数据库驱动 (`DBD`) 模块作为 Perl 数据库访问的第二步。每个唯一的数据库管理系统都需要自己的驱动程序。这种方法使得\
  \ Perl 数据库应用程序很大程度上独立于它将连接的数据库。\n\n**安装：** 打开终端并输入以下命令安装 DBI 模块：`perl -MCPAN -e\
  \ 'install Bundle::DBI'`\n\n这将自动下载并安装 `DBI` 模块驱动，允许 Perl 连接到数据库。\n\n### 数据库无关接口\n\
  \n`DBI` 如其名，为 Perl 程序提供了一个独立的接口。这意味着 Perl 代码不依赖于后端运行的数据库。`DBI` 模块提供了抽象，允许我们编写代码而不必担心后端运行的数据库。\n\
  \n要导入数据库无关接口模块的函数，请使用 `use` 属性来导入或包含该模块。使用 `DBI` 属性使我们能够使用 `DBI` 模块操作我们连接的数据库。\n\
  \n### 访问数据库\n\n要连接到指定的数据库，请使用 `connect()` 方法。它需要三个参数：\n\n*   一个用 `\":\"` 分隔的三值字符串。在这种情况下，它是\
  \ `\"DBI:mysql:test\"`。第一个值表示我们正在使用 `DBI`。第二个值指定数据库引擎，在此情况下是 MySQL。第三个值是我们要连接的数据库名称。\n\
  \n*   用户名是 `connect()` 方法的下一个参数。在这种情况下，用户是 `\"root.\"`。\n\n*   最后一个参数是我们本地系统的密码。在这种情况下，密码是\
  \ `\"password\"`。\n\n如果无法连接到数据库，`\"or die\"` 语句将带有错误信息终止程序。`errstr()` 方法返回一个包含在数据库连接期间遇到的任何错误的字符串。\n\
  \n### 准备执行的查询\n\n要执行的 SQL 查询作为单个参数传递给 `prepare()` 方法。SQL 查询被表示为包含 SQL 语句的字符串。此 SQL\
  \ 语句与我们在 MySQL 中使用的 SQL 语句相同。它返回一个语句句柄（statement handle），可用于执行查询。\n\n查询现在已准备好执行。在前面的查询中，我们正在创建一个包含\
  \ id、name、salary 列的表。\n\n### 执行查询\n\n在 `prepare()` 中编写的查询由 `execute()` 方法执行。这无可争疑。当执行\
  \ `prepare` 语句时创建的语句句柄对象用于调用它。\n\n### 从结果中获取值\n\n`fetchrow()` 方法从结果中检索下一行。当运行选择查询时，`fetchrow()`\
  \ 方法提取一行并将其赋值给变量。在 `while` 循环中使用 `fetchrow()`，我们可以获取并显示数据库中的所有行。\n\n这三个变量持有每列的值。\n\
  \n`fetchrow_array()` 函数返回一个包含结果行的数组。\n\n### 断开连接\n\n在所有查询完成后，我们必须断开连接。这是通过使用 `disconnect()`\
  \ 函数实现的。这允许 Perl 脚本正常关闭连接。如果不断开数据库，将会出现错误。\n\n### 在 MySQL 中创建数据库\n\nMySQL 必须安装在我们的系统中，并且我们必须对\
  \ MySQL 有基础了解。\n\n*   连接到我们的 MySQL 服务器。\n\n*   创建一个名为 `\"test.\"` 的数据库。我们将连接到这个数据库，请确保名称为\
  \ `\"test.\"`。\n\n*   确保此数据库中没有表，因为我们将创建一个名为 `\"emp\"` 的表并向其插入值。\n\n整合以上内容：\n\n\
  在 MySQL 中构建数据库后，我们可以访问 Perl 数据库。首先，我们创建一个模式为 `(id INTEGER PRIMARY KEY, name VARCHAR(10),\
  \ salary INT, dept INT)` 的测试表。在无错误创建后，向表中插入值。\n\n\n\n\n\n## Glob（通配）\n\n它返回匹配参数表达式的文件列表。此方法可以打印所有或特定扩展的文件。\n\
  \n以下是使用文件通配（File Globbing）访问目录的一些示例。\n\n* 获取脚本所在的当前目录：\n\n```perl\n#!/usr/bin/perl\
  \ -w # 使用 glob 函数访问文件\n@files = glob(’*’); # 返回所有文件的列表\nforeach $file (@files) #\
  \ 遍历所有文件\n{ print $file. \"\\n\"; # 打印所有文件\n}\n```\n\n* 打开特定目录：\n\n```perl\n#!/usr/bin/perl\
  \ -w # 只打印不包含路径的文件\nuse File::Basename; # 返回所有文件的列表\n@files = glob(’C:/Users/PeeksForPeeks/Folder/*’);\n\
  foreach $file (@files) # 遍历所有文件\n{ print basename($file), \"\\n\"; # 打印所有文件\n}\n\
  ```\n\n## Hashbang 或 Shebang 行的使用\n\n实用实践语言中的提取与报告（Extraction and Reporting in Practice\
  \ Language，通常被称为 Perl）是一种基于解释解释器的编程语言。在 Linux 和 Mac OSX 等类 Unix 平台上运行 Perl 脚本时，Hashbang\
  \ 或 shebang 行非常有用。Hashbang 行是 Perl 程序的起始行，用作与 Perl 二进制文件的连接。它允许直接执行 Perl 脚本，而无需将文件作为输入传递给\
  \ Perl。在 Perl 中，Hashbang 行看起来如下：`#!/usr/bin/perl`\n\nHashbang 行之所以这样命名，是因为它以井号（`#`）开头，并以感叹号（`!`）结束。在\
  \ Perl 编程中，Hashbang 行非常重要。让我们开始使用这种 Hashbang 行吧。\n\n**示例：** 假设我们有一个 Perl hello world\
  \ 程序脚本，我们将在 Linux 系统的终端上运行它。\n\n在前面的代码中，终端首先运行 Perl，然后指示 Perl 运行代码脚本。如果在没有先运行 Perl\
  \ 的情况下运行代码脚本，就会发生错误。\n\n尝试执行以下代码：`$ hello1.pl`\n\n我们使用的 shell 尝试解析文件中的命令。然而，它在 Linux/Unix\
  \ 中无法定位 `print` 命令。因此，需要通知 shell 这是一个 Perl 脚本。这时 Hashbang 的想法发挥作用了。Hashbang 通知终端该脚本。\n\
  \n然而，在运行此代码之前，必须修改 shell 的路径以将当前目录添加到现有目录中。这可以通过运行以下命令实现：`$ PATH = $PATH:$(pwd)`\n\
  \n当前工作目录将添加到 `PATH` 环境变量的目录列表中。\n\n然后，在 Perl 脚本文件 `hello1 .pl` 中，添加 Hashbang 行 `#!/usr/bin/perl`。此行始终添加到代码开头，即\
  \ Hashbang 行是代码脚本的第一行。\n\n由于在脚本的第一行添加了 Hashbang 行 `#!/usr/bin/perl`，上面的代码能够正常运行且不产生错误。\n\
  \n脚本在执行时是在当前 shell 环境中进行的。如果脚本以井号和感叹号（Hashbang）`#!` 开头，shell 将执行 Hashbang 行上指定路径的程序（在本例中为\
  \ `/usr/bin/perl`），这是 Perl 编译器-解释器的默认位置。因此，Hashbang 行包含了 Perl 编译器-解释器的位置。\n\n当文件中没有\
  \ Hashbang 行且我们尝试在不显式执行 Perl 的情况下运行它时，就会出错。shell 认为脚本是用 Bash 编写的并尝试恰当地运行，这会导致错误。\n\
  \n## 有用的数学函数\n\n在 Perl 中，偶尔需要解决包含数学运算的某些表达式。这些数学过程可以使用几个内置函数执行。\n\n以下是一些用于数学运算的有用\
  \ Perl 函数：\n\n| 函数 | 说明 |\n| --- | --- |\n| `exp()` | 计算参数“e”的实数值值的幂。 |\n| `hex()`\
  \ | 将指定的十六进制数（16 进制）转换为其十进制等效值（10 进制）。 |\n| `srand()` | 帮助 `rand()` 函数在每次程序执行时生成一个常量。\
  \ |\n| `sqrt()` | 计算数字的平方根。 |\n| `oct()` | 将提供的八进制值转换为其十进制等效值。 |\n| `rand()` | 返回从\
  \ 0 到传递给它的正数值之间的随机小数，如果没有指定值，则返回 1。 |\n| `log()` | 返回传递给的值的自然对数。如果在未提供值的情况下调用，则返回\
  \ `$_`。 |\n| `int()` | 返回提供数字的整数部分。如果没有指定值，则返回 `$_`。 |\n| `sin()` | 用于计算 VALUE 或\
  \ `$_` 的正弦。如果未提供 VALUE。 |\n| `cos()` | 计算 VALUE 或 `$_` 的余弦。如果缺少 VALUE。 |\n| `atan2()`\
  \ | 计算 -PI 到 PI 范围内 `Y/X` 的反正正切值。 |\n| `abs()` | 返回其参数的绝对值。 |\n\n## 函数（Functions）与子程序（Subroutines）的区别\n\
  \n当代码脚本规模增大时（即包含数百行代码），在 Perl 中处理将变得困难。Perl 为用户提供了函数和子程序的概念来规避这一挑战。为了使程序更具读性，函数和子程序将复杂/大型代码块分成更小、更简洁的部分。\n\
  \n它们通过允许我们在程序中重用以前编写的代码，最小化了应用程序的大小和调试时间。Perl 函数和子程序在程序中用于重用代码。我们可以在整个程序中使用带有各种参数的函数。\n\
  \n### 到底什么是函数？\n\n函数接受几个输入，对它们执行操作，然后返回一个值。\n\n它可能包含在编程语言中，或由用户提供。在 Perl 中定义函数时，要指定名称和语句顺序。当我们以后想要进行计算时，可以通过名称\
  \ `call` 该函数。\n\nPerl 有几个真正的内置函数。`say` 是内置函数的一个示例。Perl 甚至允许我们创建自己的函数来协助完成所需的任务。\n\
  \n### 到底什么是子程序？\n\n子程序（或 `sub`）允许我们为部分代码命名，这样当我们想要再次使用它时，只需调用其名称即可。\n\n在编写 Perl\
  \ 时，子程序从两个方面帮助我们我们：\n\n- 第一，它们允许我们在程序中重用代码，使更容易检测和纠正错误，并更快地构建应用程序。\n- 第二，它们使我们能够将代码组织成部分。每个子程序负责特定的任务。\n\
  \n当把代码放置在 Perl 子程序中，有两种选择：\n\n- 当我们知道代码将用于某个要执行的计算或操作时。例如，当将字符串转换为特定格式或当将输入的数据记录转换为哈希表（hash）时。\n\
  - 当我们想要将程序的逻辑组件分成部分以便更容易理解时。\n\n下表比较了函数和子程序之间的区别：\n\n| 函数 | 子程序 |\n| --- | --- |\n\
  | 函数的基本格式为 `$myvalue = myfunction(parameter, parameter);` | 子程序的基本格式为 `sub subroutine_name{#\
  \ body of the subroutine}` |\n| Perl 函数是任何内置于 Perl 的内容。Perl 内置函数的主要参考参考文档被称为 perlfunc。\
  \ | 在 Perl 中，子程序是一段可以接收输入、对它们执行特定操作并可能返回或不返回有用值的代码。然而，它们始终是用户定义的，而不是内置的。 |\n| Perl\
  \ 为我们提供了所有函数。 | 子程序是提供提供给 Perl 的代码片段。 |\n| 函数类似于子程序，因为它们都会返回一个值。函数通常执行某些计算并将结果返回给调用者。\
  \ | 子程序执行任务但不向调用程序返回任何信息。 |\n\n\n\n\n\n| 函数不能更改实际参数的值。 | 子程序可以更改实际参数的值。 |\n| 函数产生可预测的结果，且没有副作用。\
  \ | 此类限制并不限制子程序。 |\n\n### Perl 用于的十大编程任务\n\n*   **云数据管理：** 这是一个陈词滥调，但也是事实：所有企业已经拥抱了云，或者正在采纳云的过程中。我们是否需要访问公云中的数据，但又不想使用云厂商专有的\
  \ `CLI` 工具或 Web 界面？有一个 Perl 模块可以实现这一功能。\n实际上，Perl 可以轻松地与所有主要的云服务交互，帮助您进行数据管理：\n\
  \  * Perl 可用于与 AWS S3 存储桶进行交互。\n  * 也有第三方 Perl 工具程序用于管理 `Azure Blob` 存储。\n  * Perl\
  \ 还支持 `Google Cloud Storage`。\n\n*   **Perl 用于管理云虚拟机：** Perl 也可以用于管理运行在公有云或私有云上的虚拟机。例如：\n\
  \  * `Net::Amazon::EC2` 的 `Query API` 提供了一个连接到亚马逊弹性计算云 (`AWS EC2`) 的 Perl 接口。\n\
  \  * 同样，VMware 的 `vSphere Perl SDK` 允许您在任何环境中管理 VMware 虚拟机。然而，由于 `vSphere` 是创建私有云的流行方法，Perl\
  \ 可能是控制它们的必不可少的工具。\n  * 虽然我们尚未发现任何与 `Azure` 或 `Google Cloud Platform` 虚拟机服务交互的预构建\
  \ Perl 解决方案，但没有理由这样做。\n\n*   **Perl 是一种用于提供网页服务的编程语言：** 您是否需要一个轻量且易于适配的 Web 服务器？用\
  \ Perl 大约 200 行代码就能编写一个。尽管 Perl 版本可能不太用于常规的生产工作负载，但一个极简的基于 Perl 的 Web 服务器对于硬件资源极低的系统（例如物联网\
  \ (IoT) 部署中的系统）是非常出色的。或者，如果我们只是想更多地了解 Web 服务器运行原理的基础，研究 Perl 代码可能会很有帮助。\n\n*   **Perl\
  \ 用于语音识别：** 语音识别是各种应用程序（包括虚拟助手和聊天机器人）中一项复杂但日益重要的能力。Perl 在这也可以提供帮助。\n我们可以利用诸如 `Google::Cloud::Speech`\
  \ 等 Perl 模块（该模块提供了 Google 的 `Cloud Speech API` 接口），使用户能够通过语音命令提交数据，或者仅为音频文件构建文本转录。\n\
  虽然 `Google Cloud` 的 API 承担了大部分重量工作，但 Perl 提供了一个与其交互的简单接口，减少了学习和处理专有的、厂商特定 API 的需求。当然，我们还可以使用成上万个额外的\
  \ Perl 模块来帮助构建我们的应用程序。\n\n*   **Perl 中的文本转语音翻译：** Perl 与语音识别一样，利用 Google 的翻译服务将文本转换为语音，从任何语言的文本创建语音。尽管文本转语音可能没有语音转文本那样令人兴奋，但它可能帮助我们为应用程序添加实用功能，例如用于无障碍的屏幕阅读、实现多任务处理，或仅仅辅助教授新语言。\n\
  \n*   **用于软件测试的 TAP：** 如果我们希望连续、自动地发布软件，我们必须同样以连续、自动的方式对其进行测试。Perl 拥有多种顶级的测试方法，从最知名且最常用的任何测试协议（Test\
  \ Anything Protocol，通常被称为 `TAP::Harness`）。\nTAP 本质上在 Perl 测试模块之间提供了一个基于文本的接口。尽管如此，它仍然非常可靠且易于使用，现在在\
  \ C、C++、Python、PHP、Perl、Java、JavaScript 等语言中都有实现。\n\n*   **使用它执行系统管理任务：** Perl 长期以来\
  \ Unix/Linux 环境中非常重要，管理员经常使用它来编写典型的系统管理任务脚本。然而，Perl 对以 Windows 为中心的系统也有帮助。Perl 允许我们处理\
  \ `Active Directory` 甚至 Windows 注册表。我们需要跟踪用户计算机上安装的软件吗？或者是否应该在系统启动时执行定期的更新/维护？Perl\
  \ 可能是在 Windows 和 Linux 上编写此类管理操作的理想技术。\n\n*   **用于生物信息学的 BioPerl：** 虽然生物信息学不太可能大多数开发者\
  \ Perl 使用列表的顶端，但有一个名为 `BioPerl` 的社区致力于此。基于 Perl 的生物信息学和基因学解决方案涵盖了从基因序列到研究群体遗传学的范围。\n\
  \n*   **Perl 是日志管理的理想选择：** 由于现代计算机系统的分布以及它们结合许多不同类型组件的方式，现代日志管理已变成了一门科学。Perl 有助于与大多数日志管理解决方案交互，从\
  \ `syslog` 等标准到 `Papertrail` 这样的专有系统。当然，我们可以开发自己的 Perl 脚本来聚合和解析日志，这在需要完全自定义的日志管理解决方案的情况下非常方便。\n\
  \n*   **Perl 擅长文本处理：** 文本处理作为 Perl 最常见的应用，这并不令人意外。三十多年来，Perl 一直一直是正则表达式、HTML 解析和\
  \ JSON 操作的首选语言。没有其他编程语言比 Python 提供更有效或更易于使用的文本处理功能。丰富的 Perl 社区模块可以帮助几乎任何涉及文本处理、提取和转换的任务。其中许多模块已经在我们的\
  \ Perl 文本处理环境中预编译，我们可以通过 `State Tool CLI` 免费下载和安装。\n\n# 参考文献\n\n1. Perl – 简介。[https://www.tutorialspoint.com/perl/perl_introduction.htm],\
