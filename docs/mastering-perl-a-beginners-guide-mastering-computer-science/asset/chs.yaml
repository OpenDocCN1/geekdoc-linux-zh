  \n# 第 1 章 引言\n\nDOI: [10.1201/9781003358442-1](https://doi.org/10.1201/9781003358442-1)\n\
  \n## 本章内容\n\n*   Perl 简介\n*   安装与环境搭建\n*   Hello World 程序\n\nPerl 是一种高级、解释型且动态的通用编程语言。\n\
  \n\n\n\nPerl 由 Larry Wall 于 1987 年创建。虽然“Practical Extraction and Reporting Language”（实用提取和报告语言）是最常见的扩展含义，但\
  \ Perl 并没有官方的全称。一些程序员将 Perl 称为“病态杂烩的垃圾列表器”（Pathologically Eclectic Rubbish Lister）和“实际上所有喜人的事物”（Practically\
  \ Everything Likable）。缩写“Practical Extraction and Reporting Language”经常被使用，因为 Perl\
  \ 最初设计用于文本处理，例如从特定的文本文件中提取必要信息并将文本文件转换为新格式。Perl 同时支持过程化编程和面向对象编程。\n\nPerl 在语法上与\
  \ C 相似，使得 C 和 C++ 程序员可以轻松上手。\n\n## Perl 的演变\n\n这一切始于 Larry Wall 被要求从几个包含交叉引用的文本文件中生成报告。当时他开始使用\
  \ `awk` 来这项工作，但很快发现它并不够用。他没有为此设计一个工具，而是创建了一种新的编程语言 Perl 及其解释器。他用 `C` 构建了 Perl 编程语言，并借鉴了\
  \ `awk`、`sed` 和 `LISP` 等原理。Perl 最初仅设计用于系统管理和文本处理，但随后的版本包含了管理正则表达式（`Regex`）和网络套字字。目前，Perl\
  \ 以其处理 `Regex` 的能力而闻名。Perl 的第一个版本是 1987 年 12 月 18 日的 1.0 版本。`5.28` 是 Perl 的最新版本。Perl\
  \ 6 与 Perl 5 不同，因为它是 Perl 5 的完全面向对象化的重新实现版本。\n\n## 为什么选择 Perl？\n\nPerl 的流行和需求源于多种因素。原因如下：\n\
  \n* Perl 是一门高级语言；因此它与 `C` 和 `C++` 等其他流行编程语言相似，任何人都可以轻松学习。\n* 文本处理：正如名称“实用提取和报告语言”所示，Perl\
  \ 具有强大的文本操作能力，能够轻松地从各种文本文件中创建报告。此外，它还可以将文件转换为不同的格式。\n* Perl 整合了其他语言中最优秀的特性，例如 `C`、`sed`、`awk`\
  \ 和 `sh`，使这种语言更有用且高效。\n* 系统管理：Perl 使用多种脚本语言的能力使得系统管理变得简单。与其依赖多种语言，不如利用 Perl 完成所有系统管理任务。尽管如此，Perl\
  \ 也用于 Web 开发、Web 自动化图形用户界面（`GUI`）编程等。\n* Web 与 Perl：Perl 可以集成到 Web 服务器中以提高其处理能力，`DBI`\
  \ 模块使得 Web 与数据库的交互变得简单。\n\n### 开始学习 Perl 编程：\n\n* 定解释器：可以使用许多在线集成开发环境（IDE）在无需安装的情况下执行\
  \ Perl 程序。\n* Windows：有许多 IDE 可以执行 Perl 或脚本，包括 `Padre` 和带有 `EPIC` 插件的 `Eclipse`。\n\
  \n## Perl 特性\n\n* 下列出的功能在 Perl 中存在，并已被其他编程和脚本语言广泛采用。\n* Perl 的大部分功能（包括变量、表达式、语句、控制结构和子程序）都源自\
  \ `C`。\n* 它还利用 shell 脚本工具来检测数据类型。\n* Perl 提供了 shell 编程中常用的内置函数，例如 `sort` 和 `system`\
  \ 功能，这些功能可以使用前导符号（sigils）表示，例如数组、标量和哈希表。\n* 此外，Perl 5 支持复杂的数据结构和面向对象的编程风格，包括包（packages）、引用和编译器指令。\n\
  * 解释器知道每种数据类型的存储和内存需求，并在所有 Perl 版本中根据使用分配和释放内存。\n* 它在执行期间还会进行类型转换，例如将整数转换为字符串，其他无效的转换会导致错误的抛出。\n\
  * Perl 不强制或推崇任何特定的编程风格，如过程化、面向对象或函数式；解释器及其函数构成了该语言的唯一定义。\n* Perl 拥有 API（文本处理设施），帮助处理\
  \ `XML`、`HTML` 和其他标记语言。\n* Perl 提供了最高级别的安全性，甚至被第三方安全公司 `Coverity` 认证为具有低缺陷密度和较少安全问题。\n\
  * Perl 是可扩展的，并包含了处理 `XML` 和数据库集成（`DI`）的库，例如 `Oracle` 和 `MySQL`。\n\n## Perl 应用\n\n\
  Perl 与超文本处理器（`PHP`）和 `Python` 一起是开发者中流行的编程语言。以前，程序员使用 Perl 编写通用网接口（`CGI`）脚本。Perl\
  \ 经常用作异构和无缝互操作系统之间的部门粘合剂。系统管理员非常喜欢这种语言，因为他们只需要输入命令即可完成原本需要编写程序的任务。Perl 主要具有可移植性，并针对\
  \ `Windows` 和 `macOS` 有特定的定制。\n\n此外，开发者使用该语言进行构建和部署。大多数供应商或软件制造商使用它来打包和部署商业软件（包括\
  \ `COTS` 和定制软件）。由于其管理和处理大型数据集的能力，它在金融和生物信息学领域被广泛利用。\n\n## Perl 实现\n\n如，Perl 是一种用\
  \ `C` 编写的解释型语言，拥有用 `C` 和 `Perl` 编写的大量模块库。Perl 解释器由 150,000 行 `C` 代码组成，在大多数系统架构上编译为\
  \ 1 MB。Perl 分发版中几乎有 500 个模块，包括 300,000 行 `Perl` 代码和 200,000 行 `C` 代码。Perl 的组件（`arrays`、`scalars`\
  \ 和 `hashes`）在解释器的面向对象设计内部被表示为 `C` 结构。\n\n解释器的生命周期包括两个阶段：编译和执行。解释器在构建时将 Perl 代码解析为语法树。在运行时通过遍历树来执行\
  \ Perl 程序。Perl 编程语言以开源形式提供，带有 120,000 个功能测试；解释器和其他功能模块在编译过程中经过了严格测试。如果这 12 万个功能测试通过，就可以安全地假设你的代码不会损坏解释器。\n\
  \n## 用 Perl 编程\n\nPerl 在语法上与其他常见的编程语言相似，易于编写和理解。Perl 程序可以在任何最流行的文本编辑器中编写，包括 `Notepad++`\
  \ 和 `gedit`。创建程序后，用 `.pl` 或 `.PL` 扩展名保存文件。在命令行上输入 `Perl file name.pl` 即可执行程序。\n\n\
  ## 注释\n\n注释用于提高代码的可读性。解释器忽略注释项且不执行。注释可以是单行的也可以是多行的。\n\n* 单行注释\n* 多行注释\n\n在上面的示例中：\n\
  \n1. **print:** 这是一个 Perl 函数，用于在控制台上显示结果或任何提供的输出。\n2. **引号：** 在 Perl 中，我们可以使用单引号或双引号（`''`\
  \ 或 `\"\"`）。单引号不插值变量或特殊字符，但双引号会。\n3. **\\n:** 它用于换行符，通过反斜杠（`\\`）转义任何字符。\n4. **/usr/bin/Perl:**\
  \ 这是原始的 Perl 解释器二进制文件，始终以 `#!` 开头。这用于 Perl 脚本模式编程。\n5. 因为 Perl 是一种大小敏感的计算机语言，所以\
  \ `$Geeks` 和 `$geeks` 是不同的标识符。\n\n### Perl 的优点\n\n\n\n\n\n* Perl 支持跨平台兼容性以及诸如 `HTML`、`XML`\
  \ 等标记语言。\n* 它在文本处理方面特别高效，即 `Regex`。它还具备 socket get。\n* 自由开源软件根据艺术许可协议（Artistic License）和\
  \ GNU 通用公共许可证（`GPL`）发布。\n* 因为它是一种嵌入式语言，所以它可以用于 Web 服务器和数据库服务器。\n* 它支持 `CPAN`（全面\
  \ Perl 归档网络）上的约 25,000 个开源模块，这些模块为标准库提供了许多有用的增强功能，例如 `XML` 处理、`GUI` 和 `DI` 等。\n\n\
  ### Perl 的缺点\n* 由于 CPAN 模块的存在，Perl 不支持移植性。\n* 程序运行速度慢，且每次进行更改后都必须进行解释。\n* 在 Perl\
  \ 中，可以通过多种方法获得相同的结果，导致代码变得混乱且难以阅读。\n* 与其他语言相比，其易用性因素较低。\n\n### 应用\n* 文本文件处理和字符串分析是\
  \ Perl 语言的主要用途。\n* Perl 也用于 `CGI` 脚本。\n* 用于 Web 开发和 `GUI` 设计。\n* Perl 的文本处理功能也被用于生成\
  \ `SQL` 查询。\n\n## 在 WINDOWS、LINUX 和 MACOS 上安装和配置 PERL\n\n在我们的系统（无论是 Windows、Linux\
  \ 还是 Macintosh）上安装 Perl 是第一步。我们必须直接了解 Perl 编程语言是什么以及它能实现什么。\n\nPerl 是一种动态的、高级、解释型的通用编程语言。Perl\
  \ 最初是为文本处理而设计的，例如从特定的文本文件中提取必要信息并将文本文件转换为新格式。Perl 支持过程化和面向对象的编程。Perl 的语法与 `C` 相似，使得\
  \ `C` 和 `C++` 程序员能够轻松上手。\n\n可以使用任何纯文本编辑器（如 `notepad`、`notepad++` 或其他应用程序）使用 Perl\
  \ 进行编程。人们可以使用在线 IDE，也可以在机器上安装一个，以使创建 Perl 程序变得更容易。由于 IDE 具有许多功能（如直观的代码编辑器、调试器和编译器），使用\
  \ IDE 可以创建 Perl 代码更加简单。在开发 Perl 代码和执行许多有趣且有益的操作之前，必须在系统上安装 Perl。这可以通过下面提供的详细方法来实现：\n\
  \n**检查是否预装了 Perl 版本：** 在开始安装 Perl 之前，最好检查系统是否已经安装了它。许多软件应用程序需要 Perl 来执行其操作，因此 Perl\
  \ 版本可能包含在软件的安装包中。如果是这样，则无需重新下载和安装 Perl。\n\nMacintosh 在其计算机上也预装了 Perl。许多 Linux 系统预加载了\
  \ Perl。只需使用命令提示符查看设备上是否预加载了 Perl。\n\n（对于 Windows，在运行对话框（window + R）中输入 `cmd`；对于\
  \ Linux，按下 Ctrl+Alt+T；对于 macOS，按下 Control+Option+Shift$.)\n\n现在执行以下命令：\n\n```bash\n\
  perl -v\n```\n\n如果已经安装了 Perl，将生成包含 Perl 版本所有详细信息的消息；否则，将生成一条命令无效或文件名错误的错误信息。\n\n\
  ## PERL 下载与安装\n\n### Perl 下载：\n* 在开始安装过程之前，我们需要下载它。为此，Windows、Linux 和 macOS 的所有版本\
  \ Perl 均可在 [`www.perl.org/get.html`](https://www.perl.org) 获取。\n\n![](img/ufig1_1.jpg)\n\
  Perl 下载。\n\n* 通过下载并遵循安装说明来安装 Perl。\n\n### 开始 Windows 安装：\n* 完成用户许可协议。\n* 决定安装哪些内容。\n\
  * 安装程序。\n* 完成安装。\n\n在完成安装程序后，可以使用任何 IDE 或文本编辑器来开发 Perl 代码，然后可以在 IDE 或命令提示符中使用以下命令运行代码：\n\
  ```bash\nperl file1.pl\n```\n\n### 开始 Linux 安装：\n* 修改安装 Perl 的路径。\n* 开始安装过程。\n*\
  \ 选择 Perl 安装目录。\n* 完成安装。\n* 一旦安装过程完成，可以使用任何 IDE 或文本编辑器创建 Perl 代码，然后可以在 IDE 或命令提示符中使用以下命令启动：\n\
  ```bash\nperl file1.pl\n```\n\n### 开始 macOS 安装：\n* 开始。\n* 完成用户许可协议。\n* 选择安装位置。\n\
  * 安装程序。\n* 安装现已完成。\n* 在完成安装程序后，可以使用任何 IDE 或文本编辑器开发 Perl 代码，然后可以在 IDE 或命令提示符中使用以下命令运行：\n\
  ```bash\nPerl file.pl\n```\n\n## HELLO WORLD 程序\n\nPerl 是一种专门为文本处理开发的计算机语言。该缩写代表“实用提取和报告语言”（Practical\
  \ Extraction and Report Language）。它与多个系统兼容，包括 Windows、Mac OS 和几乎所有的 UNIX 变体。每种编程语言中的\
  \ Hello Everyone! 程序都为初学者学习该语言提供了一个开端。\n\n简单的 Hello everyone 程序的运行是在屏幕上打印“Hello\
  \ Everyone!”。\n\n一个简单的 Perl 程序包含以下执行步骤：\n\n* **步骤 1：** 将文件传输给 Perl 解释器。\n在 Perl\
  \ 中，第一行始终以字符 `#!` 开始。它指示 Perl 解释器如何执行该文件。文件应该移动到 `/usr/bin/Perl` 子目录，其中包含 Perl 解释器。\n\
  ```bash\n#!/usr/bin/perl\n```\n\n* **步骤 2：** Perl 指令（Pragma）\nPragma 是 Perl 包中的一个特殊模块，用于控制编译时或运行时的各种行为，例如严格性或警告。因此，以下是：\n\
  ```perl\nuse strict;\nuse warnings;\n```\n\n* **步骤 3：** 使用 `print()` 函数。\n最后，我们使用\
  \ Perl 的 `print()` 方法显示字符串以输出结果。\n```perl\nprint(\"Hello Everyone\\n\");\n```\n\n\
  ### 重要点：\n* 文件必须以 `.pl` 扩展名保存。\n* Perl 包目录必须与程序文件保存的位置相同。\n\n## PERL 程序的基础语法\n\n\
  \n\n\n\nPerl 是一种动态、高级别、解释型、通用的编程语言。Perl 最初设计用于文本处理，例如从特定的文本文件中提取必要信息并将文本文件转换为新格式。Perl\
  \ 支持过程化编程和面向对象编程。\n\nPerl 与 C 语言相似，这使得 C 和 C++ 程序员可以轻松上手。Perl 遵循一套基础语法，用于开发应用程序和软件，以及编写简单的\
  \ Perl 程序，这与其他编程语言相似。\n\n该语法包含许多预定义的结构短语，例如关键字、用于存储值的变量、执行逻辑的表达式、用于遍历变量值的循环、组合语句的块，以及用于简化代码的子程序。\n\
  \n所有这些元素结合在一起，就构成了一个 Perl 程序。变量、语句和其他构成程序语法的因素会在每个 Perl 程序中使用，无论它是一个用于两个数相加的简单代码，还是启动\
  \ Web 脚本的复杂代码。\n\n## 变量\n\n变量是用户定义的单词，用于存储程序的值并用于评估代码。每个 Perl 程序都包含代码运行所需的值。除非使用变量，否则这些值无法被编辑或保存。只有当一个值保存到变量中并使用变量名时，该值才能被处理。\n\
  \n值是传递给程序以执行修改操作的数据。这些数据可以是数字、字符串、字符、列表等。\n\n## 表达式\n\n变量和运算符符号构成了 Perl 表达式。这些表达式定义了在相关代码提供的数据上执行的操作。在\
  \ Perl 中，表达式是指在求值时返回一个值的东西。表达式也可以是一个不带任何变量或运算符符号的值。它可以是一个整数，也可以是不带变量的字符串。\n\n更复杂的表达式是通过正则表达式（Regex）对字符串和子字符串执行操作的表达式。\n\
  \n## 注释\n\nPerl 开发人员经常利用注释系统，因为如果没有它，事情可能会迅速变得复杂。注释是开发者提供的关键信息，旨在帮助读者理解源代码。它描述了代码中所使用的推理或其部分内容。当我们无法再解答有关代码的问题时，注释对于那些维护或改进代码的人来说通常非常有帮助。这些通常被认为是一种良好的编程实践，它们不会影响程序的输出，但会提高整体的可读性。\n\
  \n### 在 Perl 中，有两种类型的注释：\n\n1. **单行注释：** Perl 中的单行注释以井号符号 (`#`) 开始，并持续到行尾。如果注释超过一行，请在后续行添加井号并继续注释。Perl\
  \ 中的单行注释已被证明对变量、函数声明和表达式提供简要说明很有帮助。以下代码是单行注释的示例：\n```\n#!/usr/bin/perl $d = 10;\
  \ # Assigning value to $d $e = 30; # Assigning value to $e $c = $d + $e; # Performing\
  \ operation print \"$c\"; # Printing result\n```\n\n2. **作为注释的多行字符串：** Perl 中的多行注释是使用\
  \ `==` 和 `=cut.` 封围的文本块。当注释内容无法在单行显示且必须跨行时，这些注释非常有用。多行注释或段落为阅读你代码的人提供了文档。Perl 将\
  \ `==` 符号之后输入的所有内容都视为注释，直到后面跟着 `= cut` 为止。请记住 `=` 符号后面不能有空格。以下代码片段展示了多行注释的示例：\n\
  ```\n#!/usr/bin/perl =Assigning values to The variable $d and $e =cut $d = 10; $e\
  \ = 30; =Performing operation and printing result =cut $c = $d + $e; print \"$c\"\
  ;\n```\n\n## 语句\n\nPerl 中的语句包含供编译器执行操作的指令。这些语句在运行时对变量和值执行操作。Perl 中的每个句子都必须以分号（`;`）结束。基本上，放在源代码中用于执行的指令被称为语句。Perl\
  \ 编程语言中有几种类型的语句，例如赋值语句、条件语句和循环语句。这些都允许用户获得适当的输出。例如，`n = 60` 是一个赋值语句。\n\n多行语句：Perl\
  \ 中的语句可以通过简单的拆分为将其扩展到一行或多行。与 Python 等其他语言不同，Perl 寻找分号来结束句子。两个分号之间的每一行都被视为一个单一句子。\n\
  \n当程序员想要执行大量的计算且无法将语句放在一行上时，可以简单地将其拆分为多行。\n\n## 块\n\n块是执行相关操作的语句集合。在 Perl 中，可以使用大括号（`{}`）在（单个条件或循环下）并发执行多个语句。这创建了一个所有同时执行的语句块。该块可以通过将语句分组来优化程序。\n\
  \n在块内部声明的变量其作用范围限于该块，在块外部则没有用。它们只有在特定块运行时才会执行。\n\n在前述代码中的变量 `$d` 作用范围限于此特定块，在块外部没有用。上面的块包含相互相关的操作操作语句。\n\
  \n## 函数或子程序\n\n函数/子程序是编写在程序中执行指定任务的代码块。为了更好地理解函数的工作原理，我们将程序中的函数与现实工作场所中的人进行比较。假设经理分配员工计算年度预算的任务。那么，这个过程将如何完成？员工将从雇主那里获得统计信息，运行计算，计算预算，并将结果提供给主管。函数的运行方式类似。它们接受信息作为参数，运行一组语句，对这些参数执行操作，然后返回输出。\n\
  \n### Perl 提供两种主要类型的函数：\n\n* **内置函数：** Perl 拥有大量的内置库函数。这些函数已经过编码并保存为函数。要使用它们，我们只需要在需要时调用它们，例如\
  \ `sin()`、`cos()`、`chr()`、`return()` 和 `shift()`。\n\n* **用户定义函数：** 除了内置函数，Perl 还允许我们编写自定义的自定义函数，即用户定义函数或子程序。\n\
  \n通过这种方式，我们可以开发自己的代码包并在需要时调用它们。\n\n## 循环\n\n与任何其他语言一样，Perl 使用循环反复执行一个语句或一组指令，直到或满足特定条件。这允许用户通过不重复编写代码来节省时间和精力。\n\
  \nPerl 提供了几种循环技术：\n\n* `for` 循环\n* `for each` 循环\n* `until` 循环\n* `while` 循环\n*\
  \ `do…while` 循环\n* `嵌套循环`\n\n\n\n\n在上面的示例中，两个代码块的功能完全相同；但缩进对于包含大量语句的脚本来说更具读者的友好性。\n\
  \n虽然在 Perl 代码中使用空格和缩进不是强制的，但这是一项推荐的实践。\n\n## 关键字\n\n关键字（通常称为保留字）是语言中用于内部过程或指示预定义操作的术语。它们对编译器具有特殊意义。因此，这些术语不允许作为变量名或对象，否则会导致编译时错误。与控制字一起，Perl\
  \ 中的关键字包含了内置函数。\n\n这些关键字偶尔可以用作变量名，尽管这会导致混淆并使调试此类程序变得困难。\n\n## 数据类型\n\n数据类型定义了 Perl\
  \ 变量中可以存储的数据种类。Perl 是一种弱类型编程语言。在使用 Perl 程序时不需要提供数据类型。Perl 解释器将根据数据的上下文来选择类型。\n\n\
  Perl 有三种数据类型，如下：\n\n-   标量 (Scalars)\n-   数组 (Arrays)\n-   哈希表 (Hashes)\n\n### 标量\n\
  \n单个数据单元可以是整数、浮点值、字符、字符串、段落或整个网页。\n\n### 数组\n\n数组是存储相同数据类型值列表的变量。在 Perl 中，我们使用变量名前名前的\
  \ `@` 符号来声明数组。\n\n它将生成一个包含值 20、30 和 40 的整数数组。`$` 符号用于访问数组中的单个成员。\n\n### 哈希表\n\n\
  它是一组键值对的集合。它也被称为关联数组。在 Perl 中，我们使用 `%` 符号来声明哈希表。我们利用 `$` 符号后接括号中的键来获取特定值。\n\n本章涵盖了\
  \ Perl 介绍、安装和环境搭建以及 Hello World 程序。\n\n## NOTE\n\n# 第 2 章 Perl 基础\n\nDOI: [10.1201/9781003358442-2](https://doi.org/10.1201/9781003358442-2)\n\
  \n## 本章内容\n\n-   编写模式\n-   布尔值\n-   操作符\n-   变量\n-   Perl 中的模块 (Modules)\n-   Perl\
  \ 中的包 (Packages)\n-   数字及其类型\n-   带有 CRUD 操作的目录\n\n在上一章中，我们讨论了 Perl 基础，在本章中，我们将涵盖包、模块操作符、变量和编写模式。\n\
  \n## PERL 代码编写方法\n\nPerl 是一种动态的、高级的、解释型的、通用编程语言。Perl 支持过程化编程和面向对象编程。Perl 最初仅设计用于系统管理和文本处理，但随后的版本包含了管理正则表达式、网络套接字等功能。\n\
  \nPerl 在语法上与其他常见的编程语言相似，易于编写和理解。Perl 是一种自由格式编程语言，这意味着可以根据用户的需要进行编写、格式化和缩进。\n\n一个\
  \ Perl 程序由一系列语句、循环、子程序等组成，这便于在代码中导航。每个 Perl 语句必须以分号（`;`）结束。Perl 与其他语言一样为 Perl 代码提供了几种编写和执行模式。这些模式可以根据其与编写和执行模式的兼容性分类如下：\n\
  \n-   交互模式 (Interactive mode)\n-   脚本模式 (Script mode)\n-   单行模式 (One-liner mode)\n\
  \n这些模式可以在命令行中配合 Perl 关键字使用，也可以在在线集成开发环境 (IDEs) 中作为代码块使用。除了安装包，Perl 还有其内置的 IDE。\n\
  \n### 交互模式\n\n通过交互方法创建 Perl 代码表示与解释器的交互。交互模式是开始编程的一种极佳方法，因为它允许你逐行检查代码流并简化调试过程。通过\
  \ Perl 调试器，Perl 的交互模式可以在命令行中使用。\n\n这种解释器通常被称为 REPL – 读取 (Read)、评估 (Evaluate)、打印\
  \ (Print)、循环 (Loop)。交互模式允许立即创建和执行代码，而无需创建临时文件保存源代码。使用 Perl 调试器，内置的 Perl 命令行或 Windows\
  \ 命令提示符都可以作为 REPL。可以使用以下命令配合 Perl 使用此调试器：````\nperl -de1\n```\n\n用户必须在编写 Perl 代码的交互模式下逐行编写代码并同步运行。\n\
  \nPerl 的交互模式可以直接从命令行运行，而不需要调试器。可以通过以下命令实现：````\nperl -e Code_statement;\n```\n\n\
  此语句利用 `-e` 参数避免创建脚本，并允许代码在命令行中不使用调试器的情况下运行。\n\n这种交互模式下的编写方式不允许用户像在调试器中那样创建多行代码。这种模式不建议用于长程序。\n\
  \n交互模式对于教授新程序员编程基础很有用，但在处理几行以上代码时可能会变得繁琐且乏味。\n\n### 脚本模式\n\nPerl 中的脚本模式用于开发包含多行代码且对于交互模式来说过于复杂的\
  \ Perl 程序。\n\n使用文本编辑器，可以使用 Perl 的脚本模式来开发 Perl 程序；它被保存在一个名为脚本的文件中，然后在命令行运行该脚本文件。此文件必须以\
  \ `.pl` 扩展名保存，并存储在命令行指定的目录路径相同的目录中。然后使用以下命令从命令行执行该脚本：````\nperl FileName.pl\n```\n\
  \n在文本编辑器（例如记事本）中输入代码并保存为 Perl 程序.pl 脚本。\n\n与交互模式不同，Perl 的脚本模式无法为每个表达式提供输出。\n\n在交互模式下，表达式会被评估并自动显示结果；而在脚本模式下，表达式会被评估，但在收到提示之前不会显示结果。\n\
  \n在线 IDE 也提供脚本模式，用于在不手动将代码放入文件的情况下开发和运行 Perl 代码。在这些 IDE 中，编译后的代码以临时文件的形式保存在内存中，只有在代码运行且包含\
  \ IDE 的浏览器打开时才有用。一旦页面刷新，该临时文件就会被删除，内存空间会被释放。在线 IDE 简化了代码的执行，因为它们比必须将文件存在机器内存中的脚本模式需要少的精力。\n\
  \n这加快了代码的编译和执行。这些在线 IDE 虽然对程序员很方便，但有重大的限制，例如，除非文件上传到它们的服务器，否则无法进行文件处理操作，这对敏感数据构成了风险。通过命令行运行的编译器允许此类文件操作能力。\n\
  \n这里是一个使用在线 IDE 相加两个整数的 Perl 程序示例：\n```perl\n#!/usr/bin/perl\n# 数相加程序\n## 给变量赋值\n\
  $var1 = 20;\n$var2 = 35;\n## 评估结果\n$result = $var1 + $var2;\n## 打印结果\nprint \"Result\
  \ after the addition is: $result\";\n```\n\n### 单行模式\n\nPerl 还有单行模式 (one-liner mode)，允许我们直接从命令行输入并运行最小代码脚本。这样做是为了防止为长度不长的代码创建存储脚本的文件。使用以下命令，可以在命令行模式下单行编写这些代码：````\n\
  perl -e\n```\n\n该命令用于通过用双引号包裹代码在命令行处编写和执行单行代码。前述命令中的 `-e` 标志告知编译器脚本没有保存在任何文件中，而是直接写在该标志随后的双引号代码中。\n\
  \n\n\n\n\n这些单行命令（one-liners）对于快速进行修改（如获取信息和修改文件内容）非常有用。有些程序员避免使用单行命令，因为当脚本变得过长时，它们会变得笨拙。而另一些程序员倾向于这样做，因为单行命令比脚本更快，因为它们不需要存储在文件中。\n\
  \n## PERL 中的布尔值\n\n在大多数计算机语言中，True（真）和 False（假）被视为布尔值。然而，Perl 没有为 True 和 False 提供布尔类型。当函数返回\
  \ True 或 False 时，程序员可能会使用“boolean”一词。标量（如条件表达式 `if`, `while` 等）会返回真或假。\n\n**真值：**\
  \ 在 Perl 中，任何除零以外的非数字都是真值。在 Perl 中，字符串常量如“true”、“false”、“00”（两个或更多零的字符）和“0n”（字符串中一个\
  \ 0 后跟一个换行符）也被视为真值。\n\n**假值：** 在 Perl 中，假值是空字符串、包含单个数字 0 的字符串或 `undef` 值以及零。\n\n\
  **注意：** 对于条件检查，如果用户必须比较两个不同的变量，如果它们不相等，则返回 False；否则返回 True。\n\n## 运算符\n\n运算符是任何计算机语言的构建块，允许程序员对操作数执行各种操作。在\
  \ Perl 中，运算符的符号将取决于操作数的类型（如标量和字符串）。根据其多种功能，运算符分为几类：\n\n*   算术运算符\n*   关系运算符\n* \
  \  三元运算符\n*   逻辑运算符\n*   位运算符\n*   赋值运算符\n\n![](img/ufig2_1.jpg)\n运算符的类型。\n\n###\
  \ 算术运算符\n\n有多种类型的算术运算符。\n\n#### 加法\n\n这些用于在操作数上执行算术和数学运算。\n\n要加上两个操作数的值，请使用 `+`\
  \ 运算符。例如：`$x = 15; $y = 20; print $x + $y;` 这里的 Result 是 25\n\n#### 减法\n\n`−` 运算符从左侧操作数中减去右侧操作数。例如：`$x\
  \ = 15; $y = 20; print $x - $y;` 这里的 Result 是 5\n\n#### 乘法\n\n`*` 运算符乘以运算符两边的值。例如：`$x\
  \ = 15; $y = 20; print $x * $y;` 这里的 Result 是 300\n\n#### 除法\n\n当第一个操作数除以第二个操作数时，`/`\
  \ 运算符返回余数。例如：`$x = 40; $y = 20; print $x / $y;` 这里的 Result 是 20\n\n#### 取模\n\n取模运算符\
  \ `%` 将左侧操作数除以右侧操作数并返回余数。例如：`$x = 10; $y = 15; print $x % $y;` 这里的 Result 是 5\n\n\
  #### 指数运算符\n\n`**` 运算符用于计算操作数的指数（幂）。例如：`$x = 2; $y = 3; print $x ** $y;` 这里的 Result\
  \ 是 8\n\n该程序的目的是描述以下算术运算符：\n\n```perl\n### 用于阐明算术运算符的 Perl 程序\n## 操作数\n$x = 10;\
  \ $y = 4;\n### 使用算术运算符\nprint \"加法结果: \", $x + $y, \"\\n\";\nprint \"减法结果: \", $x\
  \ - $y, \"\\n\" ;\nprint \"乘法结果: \", $x * $y, \"\\n\";\nprint \"除法结果: \", $x / $y,\
  \ \"\\n\";\nprint \"取模结果: \", $x % $y, \"\\n\";\nprint \"指数结果: \", $x ** $y, \"\\\
  n\";\n```\n\n### 关系运算符\n\n在比较两个值时，会使用关系运算符。这些运算符将返回 1（真）或 0（假）。这些运算符也被称为等价运算符。这些运算符使用各种符号来处理字符串。我们可以利用此来学习比较运算符在字符串上的操作。\n\
  \n*   等于运算符：`==` 确定两个值是否相等。如果相等，返回 1，否则不返回任何。\n*   不等于运算符：`!=` 检查两个值是否等效。如果值不相等，则返回\
  \ 1；否则不返回任何。\n*   等于比较运算符：`< = >` 如果左侧操作数小于右侧操作数，结果为 −1；否则结果为 0。\n*   大于运算符：`>`\
  \ 如果左侧操作数大于右侧操作数，则返回 1；否则不返回任何。\n*   小于运算符：`<` 如果左侧操作数大于右侧操作数（注：原文可能有误，应为小于），则返回\
  \ 1；否则不返回任何。\n*   大于等于运算符：`>=` 如果左侧操作数大于或等于右侧操作数，则返回 1；否则不返回任何。\n*   小于等于运算符：`<=`\
  \ 如果左侧操作数小于或等于右侧操作数，则返回 1；否则不返回任何。\n\n为了在 Perl 中演示关系运算符，编写一个程序：\n\n```perl\n###\
  \ 用于阐明关系运算符的 Perl 程序\n## 操作数\n$x = 10; $y = 60;\n### 使用关系运算符\nif ($x == $y) {\n\
  \    print \"等于运算符为真\\n\";\n} else {\n    print \"等于运算符为假\\n\";\n}\nif ($x != $y)\
  \ {\n    print \"不等于运算符为真\\n\";\n} else {\n    print \"不等于运算符为假\\n\";\n}\nif ($x\
  \ > $y) {\n    print \"大于运算符为真\\n\";\n} else {\n    print \"大于运算符为假\\n\";\n}\nif\
  \ ($x < $y) {\n    print \"小于运算符为真\\n\";\n} else {\n    print \"小于运算符为假\\n\";\n\
  }\nif ($x >= $y) {\n    print \"大于等于运算符为真\\n\";\n} else {\n    print \"大于等于运算符为假\\\
  n\";\n}\nif ($x <= $y) {\n    print \"小于等于运算符为真\\n\";\n} else {\n    print \"小于等于运算符为假\\\
  n\";\n}\nif ($x <=> $y) {\n    print \"比较运算符为真\\n\";\n} else {\n    print \"比较运算符为假\\\
  n\";\n}\n```\n\n### 逻辑运算符\n\n这些运算符用于组合多个条件。\n\n*   逻辑与（AND）：当两个条件都真时，`and` 运算符返回。\n\
  *   逻辑或（OR）：当至少一个条件为真时，`or` 运算符返回。\n*   逻辑非（NOT）：`not` 运算符反转布尔值。\n\n显示逻辑运算符的程序：\n\
  \n```perl\n### 用于阐明逻辑运算符的 Perl 程序\n## 操作数\n$x = true; $y = false;\n### 与运算符\n$result\
  \ = $x && $y;\nprint \"逻辑与运算符结果: \", $result,\"\\n\";\n## 或运算符\n$result = $x ||\
  \ $y;\nprint \"逻辑或运算符结果: \", $result,\"\\n\";\n## 非运算符\n$z = 0;\n$result = not $z;\n\
  print \"逻辑非运算符结果: $result\";\n```\n\n### 位运算符\n\n位运算通过这些运算符执行。它首先将整数转换为位，然后在操作数上执行位级操作。\n\
  \n*   `&`（位与）：这是一个接收两个操作数并对每个位执行与运算的函数。只有当两个位都为 1 时返回 1。示例：`$x = 13; // 1101 $y\
  \ = 5; // 0101 $z = $y & $x; print $z;` 这里的 Result 是 5\n*   `|`（位或）：这是一个接收两个操作数并对每个位执行或运算的函数。只要其中一个位为\
  \ 1 就返回 1。示例：`$x = 13; // 1101 $y = 5; // 0101 $z = $y | $x; print $z;` 这里的 Result\
  \ 是 13\n*   `^`（位异或）：它接收两个操作数并对每个位执行异或运算。如果两个位不同，则异或的结果为 1。示例：`$x = 13; // 1101\
  \ $y = 5; // 0101 $z = $y ^ $x; print $z;` 这里的 Result 是 9\n\n\n\n\n\n* `~` (取反运算符)\
  \ 是一个一元运算符，充当位翻转器。它的作用是反转位，并由于符号二进制数的原因以补码的形式返回结果。\n\n* `<<` 二进制左移运算符接受两个整数，将第一个操作数的位左移，第二个操作数决定移动的位数。左操作数被乘以右操作数提供的次数。例如：$x\
  \ = 70; $z = $x << 2; print $z; 输出: 280 解释：$70 * 2 = 140$ ---(1) $140 * 2 = 280$\
  \ ---(2)\n\n* `>>` 二进制右移运算符接受两个数字，将第一个操作数的位右移，第二个操作数决定移动的位数。它将左操作数除以右操作数提供的次数。如例如：$x\
  \ = 80; $z = $x >> 2; print $z; 输出: 15 解释：$80 / 2 = 40$ ---(1) $40 / 2 = 20$ ---(2)\n\
  \n程序：展示位运算符符如何工作：\n```perl\n## Perl Program to illustrate Bitwise operators\n#!/usr/local/bin/perl\n\
  use integer;\n### Operands\n$x = 100;\n$y = 2;\n### Bitwise AND Operator\n$result\
  \ = $x & $y;\nprint \"Bitwise AND: \", $result, \"\\n\";\n### Bitwise OR Operator\n\
  $result = $a | $b;\nprint \"Bitwise OR: \", $result, \"\\n\";\n### Bitwise XOR Operator\n\
  $result = $x ^ $y;\nprint \"Bitwise XOR: \", $result, \"\\n\";\n### Bitwise Complement\
  \ Operator\n$result = ˜$x;\nprint \"Bitwise Complement: \", $result, \"\\n\";\n\
  ### Bitwise Left Shift Operator\n$result = $x << $y;\nprint \"Bitwise Left Shift:\
  \ \", $result, \"\\n\";\n### Bitwise Right Shift Operator\n$result = $x >> $y;\n\
  print \"Bitwise Right Shift: \", $result, \"\\n\";\n```\n\n### 赋值运算符\n\n用于向变量分配值。赋值运算符的左操作数是一个变量，而赋值运算符的右操作数是一个值。\n\
  \n以下是赋值运算符的示例：\n\n* `=` (简单赋值)：最基础的赋值运算符。该运算符将右侧的值赋值给左侧的变量。\n    例如：$x = 20; $y\
  \ = 40;\n\n* `+=` (加赋值)：`+` 和 `=` 运算符的组合。该运算符首先将左侧变量的当前值加上右侧的值，然后将结果赋值给左侧变量。\n \
  \   例如：`($x += $y)` 可以写为 `($x = $x + $y)`。\n    如果 `$a` 的初始值为 5，那么 `($a += 6)` =\
  \ 11。\n\n* `-=` (减赋值)：该运算符结合了 `−` 和 `=` 运算符。该运算符从右侧的值中减去变量的当前值，并将结果的结果赋值给左侧变量。\n\
  \    例如：`($x -= $y)` 可以写为 `($x = $x - $y)`。\n    如果 `$a` 的初始值为 8，那么 `($a −= 6)`\
  \ = 2。\n\n* `*=` (乘赋值)：该运算符结合了 `*` 和 `=` 运算符。左侧的变量乘以右侧的值，并将结果赋值给左侧变量。\n    例如：`($x\
  \ *= $y)` 可以写为 `($x = $x * $y)`。\n    如果 `$a` 的初始值为 5，那么 `($x *= 6)` = 30。\n\n*\
  \ `/=` (除赋值)：该运算符结合了 `/` 和 `=` 运算符。该运算符将左侧变量的当前值除以右侧的值，并将结果分配给左侧变量。\n    例如：`($x\
  \ /= $y)` 可以写为 `($x = $x / $y)`。\n    如果存储在 `$a` 中的初始值为 6，那么 `($x /= 2)` = 3。\n\n\
  * `%=` (取模赋值)：该运算符结合了 `%` 和 `=` 运算符。该运算符在将结果赋值给左侧变量之前，通过右侧的值修改左侧变量的当前值。\n    例如：`($x\
  \ %= $y)` 可以写为 `($x = $x % $y)`。\n    如果存储在 `$a` 中的初始值为 6，那么 `($a percent = 2)`\
  \ = 0。\n\n* `**=` (幂赋值)：该运算符是 `**` 和 `=` 运算符的混合。该运算符在将结果赋值给左侧变量之前，将左侧变量的当前值乘以右侧的值。\n\
  \    例如：`($x **= $y)` 可以写为 `($x = $x ** $y)`。\n    如果存储在 `$a` 中的初始值为 6，那么 `($a **=\
  \ 2)` = 36。\n\n程序：说明赋值运算符如何工作：\n```perl\n### program to demonstrate working of Assignment\
  \ Operators\n#!/usr/local/bin/perl\n# taking two variables & using ## the simple\
  \ assignments operation\n$x = 8; $y = 5;\n### using the Assignment Operators\nprint\
  \ \"The Addition Assignment Operator: \", $x += $y, \"\\n\";\n$x = 8; $y = 4;\n\
  print \"Subtraction Assignment Operator: \", $x -= $y, \"\\n\" ;\n$x = 8; $y = 4;\n\
  print \"Multiplication Assignment Operator: \", $x*=$y, \"\\n\";\n$x = 8; $y = 4;\n\
  print \"Division Assignment Operator: \",$x/=$y, \"\\n\";\n$x = 8; $y = 5;\nprint\
  \ \"Modulo Assignment Operator: \", $x%=$y,\"\\n\";\n$x = 8; $y = 4;\nprint \"Exponent\
  \ Assignment Operator: \", $x**=$y, \"\\n\";\n```\n\n### 三元运算符\n\n它是一种条件运算符，是 if\
  \ else 语句的简易版本。“三元”一词指的是它有三个操作数。根据布尔表达式的值，它将返回两个值中的其中一个。\n\n注意：三元运算符中的条件也可以是利用其他运算符（如关系运算符和逻辑运算符）生成的任何表达式。\n\
  \n## PERL 中的变量\n\n变量在整个 Perl 中用于存储和处理数据。变量在创建时会占用内存空间。变量的数据类型有助于解释器分配内存并决定存储什么。\n\
  \n\n\n\n\n变量是用于存储值的预留内存位置。这意味着创建变量会释放内存空间。变量的数据类型有助于解释器分配内存，并决定在预留内存中存储什么内容。因此，通过为变量分配不同的数据类型，变量可以存储整数、小数或字符串。\n\
  \nPerl 有三种基本数据类型，如下所示：\n\n* 标量 (Scalars)\n* 数组 (Arrays)\n* 哈希/关联 (Hashes)\n\n结果，Perl\
  \ 将使用三种类型的变量。标量变量以美元符号 (`$`) 为前缀，可以存储数字、字符串或引用。数组变量用 `@` 符号表示，存储有序的标量列表。哈希变量以百分号符号\
  \ `%` 为前缀，将用于存储键值对集合。\n\n### 创建变量\n\n为了预留内存空间，`perl` 变量不需要显式声明。与其他计算机语言一样，`=` 运算符左侧的操作数是变量名，`=`\
  \ 运算符右侧的操作数是存储在变量中的值。\n\n例如：`$age = 30; $name = \"Sima\"; $rollno = 32;` 这里，`30`、`\"\
  Sima\"` 和 `32` 分别赋值给 `$age`、`$name` 和 `$rollno` 变量。\n\n### 标量变量\n\n标量是一个单一的数据单元。数据可以是整数、浮点数、字符、字符串、段落或整个网页。这里有一个使用标量变量的示例：\n\
  \n```perl\n#!/usr/bin/perl\n## 为标量变量赋值\n$age = 30; $name = \"Sima\"; $rollno = 32;\n\
  ## 打印变量值\nprint \"Age = $age\\n\";\nprint \"Name = $name\\n\";\nprint \"Roll no\
  \ = $rollno\\n\";\n```\n\n### 数组变量\n\n数组变量存储有序的标量值列表。数组数据类型变量以“at” (`@`) 符号为前缀。美元符号\
  \ (`$`) 指变量名后跟方括号中索引的单个数组元素。这里有一个使用数组变量的示例：\n\n```perl\n#!/usr/bin/perl\n### 为数组变量赋值\n\
  @ages = (43, 70, 33);\n### @ 用于声明 数组变量\n@names = (\"ABC\", \"DEF\", \"GHI\");\n\
  ### 打印数组的值\nprint \"\\$ages[0] = $ages[0]\\n\";\nprint \"\\$ages[1] = $ages[1]\\\
  n\";\nprint \"\\$ages[2] = $ages[2]\\n\";\nprint \"\\$names[0] = $names[0]\\n\"\
  ;\nprint \"\\$names[1] = $names[1]\\n\";\nprint \"\\$names[2] = $names[2]\\n\";\n\
  ```\n\n我们在 `$` 符号之前使用了 `\\` 将其作为语句打印。否则，Perl 将其解释为变量并打印存储在其中的值。\n\n### 哈希变量\n\n\
  哈希是键值对的集合。哈希变量以模 (`%`) 符号为前缀。在哈希中，键用于引用单个变量。在花括号中，哈希变量名后跟与值关联的键以访问这些元素。这里是一个哈希变量的简单示例：\n\
  \n```perl\n#!/usr/bin/perl\n# 使用 ’%’ 定义哈希变量\n%data = (’ABC’, 55, ’DEF’, 80, ’GHI’,\
  \ 44);\n### 打印哈希变量的值\nprint \"\\$data{’XYZ’} = $data{’ABC’}\\n\";\nprint \"\\$data{’LGH’}\
  \ = $data{’DEF’}\\n\";\nprint \"\\$data{’KMR’} = $data{’GHI’}\\n\";\n```\n\n###\
  \ 变量上下文\n\nPerl 根据上下文（即变量使用的情况）对同一个变量进行不同的处理。\n\n`@names` 是一个数组，在此上下文中使用了两次。首先，我们将其复制到另一个数组（即列表）中，这样如果上下文是列表上下文，它将返回所有元素。然后尝试将同一个数组存储在标量上下文中，默认情况下只返回该数组中的元素数量。下表描述了各种上下文：\n\
  \n| 序号 | 上下文及描述 |\n| --- | --- |\n| 1. | **标量** 在标量上下文中，赋值给标量变量会求值 “=” 右侧的值。 |\n\
  | 2. | **列表** 在列表上下文中，赋值给数组或哈希会求值 \"=\" 右侧的内容。 |\n| 3. | **布尔** 布尔上下文是一个对表达式进行求值以判断其为真还是为假的地方。\
  \ |\n| 4. | **空** 此上下文不关心返回值是什么，它甚至不想要返回值。 |\n| 5. | **插值** 此上下文只会出现在引号（“”）或具有类似引号行为的内容（“”）中。\
  \ |\n\n## 变量的作用域\n\n变量的作用域是程序中可以访问变量的区域。程序变量的可见性称为作用域。我们可以在 Perl 中声明全局变量或私有变量。局部变量（Lexical\
  \ variables）是私有变量的另一个名称。\n\n### 全局变量的作用域\n\n全局变量可以在程序创建的任何函数或块中使用。它在整个程序中都是可见的。全局变量可以直接使用，并可以从程序的任何地方访问。\n\
  \n\n\n该模块的 Perl 文件如下所示：\n\n```perl\n#!/usr/bin/perl\n## Using the Message.pm package\n\
  use Message;\n## Defining the value to variable\n$Message::username = \"Peeks\"\
  ;\n## Subroutine-call Message::Hello();\n```\n\n### 使用预定义模块\n\nPerl 有几个预定义的模块，可以随时在\
  \ Perl 程序中使用，例如 `strict` 和 `warnings`。\n\n## PERL 包 (PACKAGES)\n\nPerl 包（package）是一组储存在其特定命名空间中的代码。Perl\
  \ 模块（module）是定义在与包同相同且扩展名为 `.pm` 的文件中的包。同名的变量或函数可能存在于两个不同的模块中。任何不属于包的变量都属于主包（main\
  \ package）。因此，所有使用的变量都是 `main` 包的一部分。额外包的确保确保来自不同包的变量不会相互干扰。\n\n### Perl 模块声明\n\n\
  模块名称必须与包名相同，并具有 `.pm` 扩展名。\n\n该文件名为 `Calculator.pm`，存储在目录 `Calculator` 中。为了向解释器返回真值，在函数后面写入\
  \ `1`。除了 `1`，Perl 也接受任何为真的值。\n\n### 使用 Perl 模块\n\n我们利用 `need` 或 `use` 函数来访问此计算器模块。`::`\
  \ 用于访问模块中的函数或变量。这里有一个示例展示：\n\n```perl\n#!/usr/bin/perl\n# Using Package ’Calculator’\n\
  use Calculator;\nprint \"Enter the two numbers to add\";\n### Defining values to\
  \ variables\n$x = 10;\n$y = 20;\n### Subroutine-call Calculator::addition($x, $y);\n\
  print \"\\nEnter the two numbers to subtract\";\n### Defining values to the variables\n\
  $x = 30;\n$y = 10;\n### Subroutine-call Calculator::subtraction($x, $y);\n```\n\n\
  ### 使用不同的目录访问包\n\n如果访问包的文件位于目录之外，我们使用 `::` 来指定模块的路径。例如，因为使用计算器模块的文件位于 calculator\
  \ 包之外，我们编写 `Calculator::Calculator` 来加载该模块，其中 `::` 左侧的值代表包名，`::` 右侧的值代表 Perl 模块名。为了说明，请考虑以下示例：\n\
  \n```perl\n#!/usr/bin/perl\nuse GFG::Calculator;\n### Directory_name::module_name\n\
  print \"Enter the two numbers to add\";\n### Defining values to variables\n$x =\
  \ 10;\n$y = 20;\n### Subroutine-call Calculator::addition($x, $y);\nprint \"\\nEnter\
  \ the two numbers to subtract\";\n### Defining values to the variables\n$x = 30;\n\
  $y = 10;\n### Subroutine-call Calculator::subtraction($x, $y);\n```\n\n### 利用模块变量\n\
  \n在这些变量之前声明来自各个包的变量允许它们被利用。下面的示例说明了这一点。\n\n该模块的 Perl 文件如下所示。\n\n### BEGIN 和 END\
  \ 块\n\n当我们希望在开始运行某些代码并在结束运行某些代码时，我们利用 `BEGIN` 和 `END` 块。`BEGIN...` 中的代码在脚本开始时运行，而\
  \ `END...` 中的代码在结束时执行。在以下程序中演示了这一点：\n\n```perl\n#!/usr/bin/perl\n### Predefined\
  \ BEGIN block\nBEGIN {\n    print \"In begin block\\n\";\n}\n### Predefined END\
  \ block\nEND {\n    print \"In end block\\n\";\n}\nprint \"Hello Everyone;\\n\"\
  ;\n```\n\n## PERL 中的数字及其类型\n\n在 Perl 中，数字是一个数学对象，可以用于计数、测量和执行不同的数学运算。数字符号（numeral）是象征数字的记法符号。除了用于数学运算外，这些符号还用于排名（以序列号的形式）。\n\
  \n这些数字可以根据其应用分为几类：\n\n-   **整数 (Integers)：** Perl 整数表示为以 10 为底的进制数。这些数字可能是正的也可能是负的。另一方面，Perl\
  \ 采用 `_` 来表示大整数值以提高可读性。例如：`213,254,484` 表示为 `213_254_484`。\n\n```perl\n#!/usr/bin/perl\n\
  ### Positive-Integer\n$c = 30;\n### Negative-Integer\n$d = -25;\n### Big Integer-Number\n\
  $e = 213_254_484;\n### Printing these numbers\nprint(\"Positive Integer: \", $c,\
  \ \"\\n\");\nprint(\"Negative Integer: \", $d, \"\\n\");\nprint(\"Big Integer: \"\
  , $e, \"\\n\");\n```\n\n-   **浮点数 (Floating point numbers)：** 在 Perl 中，浮点数由整数部分和小数部分组成，由小数点分隔。浮数的整数部分可以是正的或负的，而小数部分只能是正的。在\
  \ Perl 中，浮数可以用两种方式表示：\n\n    -   **定点法 (Fixed point)：** 在这种格式下，小数点是固定的。这个小数点标记了小数部分的开始。\n\
  \n    -   **科学计数法 (Scientific)：** 这种表示法包含两个部分：系数（实际数字）和指数（系数所乘的 10 的幂次）。\n\n```perl\n\
  #!/usr/bin/perl\n### Positive Floating-Number\n$c = 20.5647;\n### Negative Floating-Number\n\
  $d = -15.2451;\n### Scientific-value\n$e = 123.5e-10;\n### Printing these numbers\n\
  print(\"Positive Number: \", $c, \"\\n\");\nprint(\"Negative Number: \", $d, \"\\\
  n\");\nprint(\"Scientific Number: \", $e, \"\\n\");\n```\n\n-   **十六进制数 (Hexadecimal\
  \ numbers)：** 十六进制数字基数为 16，范围从 0 到 15，并并在数字前加上 `0x` 写为 `0xa`，这里的 `a` 代表十六进制形式中的值\
  \ 10。这些字母代表 10–15，范围从 `a` 到 `f`。十六进制数字可以有正值和负值。\n\n因此，`% x` 用于以十六进制格式显示数字的值，如上所示。\n\
  \n-   **八进制数 (Octal numbers)：** 八进制数是基数为 8 的数字，范围从 0 到 7。这些数字表示为 `057`，数字前面有一个 `0`，其余部分为十进制值。八进制数像其他类型一样可以是正的也可以负的。\n\
  \n    `% o` 在此处用于输出八进制值。\n\n-   **二进制数 (Binary numbers)：** 二进制数基数为 2，范围从 0 到 1。这些数字写为\
  \ `0b1010`，在数字前带有 `0b`。\n\n    `% b` 用于以二进制格式显示数字。\n\n## PERL 中目录的增删改操作\n\nPerl\
  \ 是一种通用且跨平台的编程语言，主要用于文本处理，并用于开发多种软件应用程序，如 Web 开发和图形界面应用程序。它优于其他编程语言因为它更快更强大，而且包含许多有助于快速创建脚本的快捷方法。\n\
  \n对目录执行以下操作：\n\n-   创建新目录\n-   打开现有目录\n-   读取目录内容\n-   修改目录路径\n-   关闭目录\n-   删除目录\n\
  \n### 创建新目录\n\n`mkdir(PATH, MODE)` 用于创建目录。此函数协助创建新目录；如果用户想检查文件是否存在，可以使用 `-e` 函数。`PATH`\
  \ 使用 `MODE` 函数指定的模式设置路径。\n\n### 打开现有目录\n\n在 Perl 中，短函数 `opendir(DIRHANDLE, PATH)`\
  \ 用于打开目录。`PATH` 参数定义了要打开的目录路径。\n\n### 在标量和列表中读取目录\n\n读取目录是一项常规操作，因为每次运行或理解代码时都必须读取存储在文件中的内容。`readdir(DIRHANDLE)`\
  \ 用于读取目录。用户可以用标量上下文和列表上下文两种方式读取目录。\n\n\n\n在列表上下文中，代码返回目录中的所有剩余条目。如果目录中的条目为空，则在标量上下文中返回未定义值，在列表上下文中返回空列表。\n\
  \n**标量上下文：**\n```perl\n#!/usr/bin/perl\nuse strict;\nuse warnings;\nuse 5.010;\n\
  ### 目录路径\nmy $directory = shift // ’C:\\Users\\GeeksForGeeks\\Folder’;\n### 打开目录\n\
  opendir my $dh, $directory or die \"Could not open ’$directory’ for the reading\
  \ ’$!’\\n\";\n### 打印目录内容\nwhile (my $content = readdir $dh) {\n  say $content;\n\
  }\n### 关闭目录\nclosedir $dh;\n```\n\n**列表上下文：**\n```perl\n#!/usr/bin/perl\nuse strict;\n\
  use warnings;\nuse 5.010;\n### 目录路径\nmy $directory = shift // ’C:\\Users\\PeeksForPeeks\\\
  Folder’;\n### 打开目录\nopendir my $dh, $directory or die \"Could not open ’$directory’\
  \ for the reading ’$!’\\n\";\n### 读取文件内容\nmy @content = readdir $dh;\n### 打印目录内容\n\
  foreach my $content (@content) {\n  say $content;\n}\n### 关闭目录\nclosedir $dh;\n\
  ```\n\n### 修改目录路径\n\n`chdir()` 方法用于修改目录。此函数协助更改目录并将其发送到不同的位置。当在脚本中调用时，`chdir()`\
  \ 函数将更改脚本剩余部分的目录。如果从脚本内部调用此函数，终端上的目录将不会更新。然而，当直接使用新目录路径调用时，终端将同时显示差异。\n\n### 关闭目录\n\
  \n`closedir DIRHANDLE` 用于关闭目录。`DIRHANDLE` 是使用 `opendir` 函数打开的目录句柄。\n\n### 删除目录\n\
  \n可以使用 `rmdir` 函数来删除目录。只有当提供的 `FILENAME` 目录为空空时，该函数才会删除该目录；如果成功，它返回真；否则返回假。\n\n\
  在本章中，我们涵盖了 Perl 的基础知识，讨论了编写模式、布尔值、运算符和变量。此外，我们还涵盖了 Perl 模块、Perl 包、数字及其类型，以及带有 CRUD\
  \ 操作的目录。\n\n## NOTES\n\n# 第 3 章：Perl 中的输入与输出\n\nDOI: [10.1201/9781003358442-3](https://doi.org/10.1201/9781003358442-3)\n\
  \n## 本章内容\n\n*   `print()` 和 `say()` 的用法\n*   `print` 运算符\n*   使用 `STDIN` 进行输入\n\
  \n在上一章中，我们涵盖了 Perl 的基础，在本章中，我们将涵盖输入和输出及其相关示例。\n\n## PERL `print()` 和 `say()` 方法\n\
  \nPerl 使用语句和表达式对用户提供的输入或代码中呈现的硬编码输入进行求值。因为在编译器中已进行了求值，所以求值后的表达式不会显示给程序员。Perl 使用\
  \ `print()` 和 `say()` 函数来显示求值后的表达式。这些程序可以显示传递给它们的任何参数。\n\n### `print()` 运算符\n\n\
  Perl 中的 `print()` 运算符用于打印传递作为输入的列表中的表达式值。`print` 运算符返回传递给它的任何参数，无论是字符串、数字、变量还是其他内容。该运算符的定界符是双引号（“”）。\n\
  \n上面的示例使用 `print` 函数同时打印两个字符串，但它们被写在同一行上。为了避免这种情况并将它们打印在不同的行上，我们必须使用 `\\n` 运算符，它在每次使用时都会换行。\n\
  \n如果我们使用单引号代替双引号，`print()` 方法将不会输出变量的值或语句中转义字符（例如 `\\n`）。这些字符将完整地打印，而不会被求值。\n\n\
  ### `say()` 函数\n\nPerl 中的 `say()` 方法与 `print()` 函数的功能相似，有一个细微的区别：`say()` 函数会自动在语句末尾插入换行符，不再需要使用换行符\
  \ `\\n` 来换行。\n\n我们使用 `use 5.010` 来利用 `say()` 函数，因为较版本的 Perl 不支持早期版本的某些功能；因此使用旧版本来运行\
  \ `say()` 方法。\n\n## `print` 运算符\n\n在 Perl 中，`print` 运算符用于打印作为参数传递的列表中的表达式值。`print`\
  \ 运算符返回传递给它的任何参数，无论是字符串、数字、变量还是其他内容。该运算符的定界符是双引号（“”）。\n\n## 使用 `STDIN` 进行输入\n\n\
  Perl 允许程序员接收用户输入并对其进行操作。这允许用户输入除程序员提供的硬编码输入以外的内容。然后可以使用 `print()` 方法来解析并打印这些输入。\n\
  \n`<STDIN>` 可以为 Perl 提供键盘输入。`STDIN` 是标准输入（Standard Input）的缩写。不需要在“钻石”和“太空”运算符 `<\
  \ >` 之间包含 `STDIN`。这是标准步骤。`< >` 运算符也可以写入文件。`<STDIN>` 可用于标量和列表上下文。\n\n在输入内容后，上面的代码我们需要按\
  \ ENTER 键。这个 ENTER 指示编译器运行下一行代码。然而，`<STDIN>` 将 ENTER 键视为输入的一部分，并在我们按下时打印该行。在输入字符串之后，会自动写入一个新行。为了避免这种情况，使用了\
  \ `chomp()` 方法。该方法将删除用户提供的输入末尾的换行符。\n\n在本章中，我们涵盖了 `print()` 和 `say()` 的用法、`print`\
  \ 运算符以及用于输入的 `STDIN`。\n\n# 第 4 章：Perl 中的控制流\n\nDOI: [10.1201/9781003358442-4](https://doi.org/10.1201/9781003358442-4)\n\
  \n## 本章内容\n\n*   决策\n*   循环\n*   `when` 语句\n*   `goto` 运算符\n*   `next` 运算符\n*  \
  \ `redo` 运算符\n\n在上一章中，我们讨论了 Perl 中的输入和输出，在本章中，我们将涵盖控制流语句。\n\n## Perl 中的决策\n\n编程中的决策类似于生活中的决策。当编程中满足给定条件时，必须执行特定的代码块。控制语句用于编程语言中根据特定标准控制程序的执行流。这些语句影响执行流根据程序状态的变化进行进展和分支。\n\
  \n**Perl 决策语句：**\n\n*   `if`\n*   `if else`\n*   `nested if`（嵌套 if）\n*   `if elsif\
  \ ladder`（if elsif 阶梯结构）\n*   `unless`\n*   `unless else`\n*   `unless elsif`\n\n\
  ### `if` 语句\n\n`if` 语句与其他编程语言中的语句类似。它用于执行简单的基于条件的任务。它用于确定是否将执行特定的语句或语句块；例如，如果给定条件为真，则执行一个语句块；否则，不执行。\n\
  \n如果在 `if` 语句中没有使用大括号 `{}`，将产生编译时错误。因此，在 `if` 语句中必须使用括号 `{}`。\n\n**流程图：**\n\n![](img/ufig4_1.jpg)\n\
  \n`if` 语句。\n\n### `if else` 语句\n\n如果条件为真，`if` 语句评估代码；如果条件为假，则使用 `else` 语句。它指示代码在条件为假时做什么。\n\
  \n**流程图：**\n\n![](img/ufig4_2.jpg)\n\n`if else` 语句。\n\n### `nested if` 语句\n\n嵌套\
  \ `if` 是 `if` 语句内部的 `if` 语句。在这种情况下，`if` 语句是另一个 `if` 或 `else` 语句的目标。当多个条件必须为真且其中一个条件是父级条件的子条件时，可以使用嵌套\
  \ `if`。\n\n**流程图：**\n\n![](img/ufig4_3.jpg)\n\n`nested if` 语句。\n\n### `if elsif\
  \ ladder` 语句\n\n\n\n\n\n用户可以在此处从多个备选项中选择。if 语句按照列出的顺序执行。当满足某个 if 条件时，执行与该条件相关的语句，并跳过阶梯结构中的剩余部分。如果没有任何条件被满足，则使用最后一个\
  \ else 表达式。¹\n\n**流程图：**\n\n![](img/ufig4_4.jpg)\n\nif else if 语句。\n\n### unless\
  \ 语句\n\n如果条件为假，则将执行语句。在布尔上下文中，数字 `0`、空字符串 `\"\"`、字符 `\"0\"`、空列表 `()` 和 `undef` 均为假，而所有其他值均为真。\n\
  \n**流程图：**\n\n![](img/ufig4_5.jpg)\n\nunless 语句。\n\n### unless else 语句\n\n当布尔表达式为真时，except\
  \ 语句之后会跟一个可选的 else 语句。\n\n**流程图：**\n\n![](img/ufig4_6.jpg)\n\nunless else 语句。\n\n\
  ### unless elsif 语句\n\nunless 语句和可选的 elsif 可以跟在语句...else 语句之后，这允许我们使用单个 unless...elsif\
  \ 语句测试许多条件。\n\n**记住以下内容：**\n\nUnless 语句可以有任意数量的 elsif，且它们都必须出现在 else 之前。\n\nUnless\
  \ 语句可以有零或一个 else，并且必须出现在任何 elsif 语句之后。\n\n当某个 elsif 成功时，将不再尝试其他的 elsif 或 else。\n\
  \n**流程图：**\n\n![](img/ufig4_7.jpg)\n\nunless elsif 语句。\n\n## PERL 中的循环\n\n在编程语言中，循环是一种允许在某些条件为真时重复执行一组指令或函数的特性。循环使代码编写员的工作变得更容易。Perl\
  \ 支持多种形式的循环来处理程序中的条件情况。下文将讨论 Perl 的循环。\n\n### for 循环\n\n“for”循环是表示循环结构的一种简写方式。与\
  \ while 循环不同，for 语句在单行内消耗初始化、条件和递增/递，从而产生更短、更易调试的循环结构。\n\n**流程图：**\n\n![](img/ufig4_8.jpg)\n\
  \nPerl 中的 for 循环。\n\nfor 循环在预定义的控制流上运行。以下因素影响控制流：\n\n* `init statement`：初始化语句是第一个执行的初始语句。在此阶段，我们设置一个变量来控制循环。\n\
  * `condition`：在此阶段评估指定的条件，如果条件为真（True），则执行 for 循环。因为条件在执行循环语句之前经过验证，所以它也是一种入口控制循环。\n\
  * `Statement execution`：当条件为真时，执行循环体中的语句。\n* `increment/decrement`：在此对循环控制变量递增或递减，以更新下次迭代的变量。\n\
  * `Loop termination`：当满足条件时，循环终止，表示其生命周期的结束。\n\n### foreach 循环\n\nforeach 循环遍历列表，变量一次存储一个列表项的值。它主要用于我们拥有一个列表数据集合，并希望遍历列表元素而非其范围的情况。循环会自动执行每个元素的迭代。\n\
  \n### while 循环\n\nwhile 循环通常接受一个封装在括号内的表达式。如果该表达式为真（True），则执行 while 循环体内的代码。当不知道想要循环执行多少次，但知道循环的终止条件时，就会使用\
  \ while 循环。因为条件在执行循环之前经过验证，所以它也被称为入口控制循环。while 循环类似于循环 if 语句。\n\n### 无限 while 循环\n\
  \nwhile 循环可以无限持续，这意味着它没有结束条件。换句话说，某些情况保持为真，导致 while 循环无结束或永不完成。\n\n**示例：** 以下应用程序将无限期打印提供的语句，并在在线\
  \ IDE 上显示运行时错误“Output Limit Exceeded”（输出限制超出）。\n\n### do...while 循环\n\ndo...while\
  \ 循环与 while 循环之间的唯一区别是 do...while 循环至少执行一次。在初始执行之后，会验证条件。当我们希望循环至少执行一次时，使用 do...while\
  \ 循环。因为条件是在执行循环之后验证的，所以也被称为退出控制循环。\n\n### until 循环\n\nwhile 循环的反面是 until 循环。它接受括号中的条件，并只运行到该条件为假（false）为止。它本质上是重复某条指令或指令序列直到条件为假（FALSE）。它也是一种入口控制循环，这意味着首先测试条件，然后执行块内的指令序列。\n\
  \n### 嵌套循环\n\n嵌套循环是包含在另一个循环内部的循环。Perl 编程也支持嵌套循环。上述列出的所有循环都可以进行嵌套。\n\nPerl 多个嵌套循环的语法：\n\
  \n* **嵌套 for 循环**：`for (init statement; condition; increment/decrement ) { for (init\
  \ statement; condition; increment/decrement ) { # 执行的代码 } }`\n* **嵌套 foreach 循环**：`foreach\
  \ variable_1 (@array_1) { foreach variable_2 (@array_2) { # 执行的代码 } }`\n* **嵌套 while\
  \ 循环**：`while (condition) { while (condition) { # 执行的代码 } }`\n* **嵌套 do...while\
  \ 循环**：`do{ do{ # 执行的代码 }while(condition); }while(condition);`\n* **嵌套 until 循环**：`until\
  \ (condition) { until (condition) { # 执行的代码 } }`\n\n## given-when 语句\n\n在 Perl 中，given-when\
  \ 语句替换了将变量与多个整数值比较的长 if 语句。\n\n\n\n given-when 语句是一种带有许多选项的分支语句。它允许我们根据表达式的值轻松将执行路由到代码的不同区域。\n\
  * 提供了一种控制语句，允许值改变执行控制。\n\nPerl 中的 switch-case 类似于 C/C++、Python 或 PHP 中的 switch-case。它也像\
  \ switch 语句一样，将许多 if 语句替换为不同的 case。²\n\ngiven-when 语句还包含两个额外的关键字：`break` 和 `continue`。这些关键字保持程序的流动，并有助于退出程序或跳过特定值的执行。\n\
  \n**break:**：`break` 关键字用于退出 when 块。在 Perl 中，不需要在每个 when 块后显式表示 `break`。它已经隐式定义。\n\
  \n**continue:**：相反，如果第一个 when 块正确，`continue` 将进入下一个 when 块。\n\ngiven-when 语句中的条件语句不能在多个\
  \ when 语句中重复，因为 Perl 只检查该条件的第一次出现处，随后的重复语句会被忽略。此外，默认语句必须放在所有 when 语句之后，因为编译器会顺序检查每个\
  \ when 语句的条件匹配，如果我们在中间插入默认语句，它将跳断并打印默认语句。\n\n### 嵌套 given-when 语句\n\ngiven-when\
  \ 嵌套语句是指包含在其他 given-when 语句内部的 given-when 语句。这可能用于对于给定的输出集保持用户提供输入的层级结构。\n\n\n\n\
  \n\n这是一个嵌套的 `given-when` 语句示例：\n\n```perl\n#!/usr/bin/perl\n### 用于打印相应日期的程序\n###\
  \ 使用 given-when 语句处理日期代码\nuse 5.010;\n### 要求用户提供日期代码\nprint \"Enter daycode between\
  \ 0-6\\n\";\n### 使用 chomp 移除换行符\nchomp(my $daycode = <>);\n### 使用 given-when 语句\n\
  given ($daycode) {\n    when (’0’) { print ’Sunday’ ;}\n    when (’1’) {\n     \
  \   print \"What time of day is it?\\n\";\n        chomp(my $daytime = <>);\n  \
  \      # 嵌套 given-when 语句\n        given($daytime) {\n            when(’Morning’)\
  \ {print ’It is Monday Morning’};\n            when(’Noon’) {print ’It is Monday\
  \ noon’};\n            when(’Evening’) {print ’It is Monday Evening’};\n       \
  \     default{print’Invalid Input’};\n        }\n    }\n    when (’2’) { print ’Tuesday’\
  \ ;}\n    when (’3’) { print ’Wednesday’ ;}\n    when (’4’) { print ’Thursday’ ;}\n\
  \    when (’5’) { print ’Friday’ ;}\n    when (’6’) { print ’Saturday’ ;}\n    default\
  \ { print ’Invalid daycode’;}\n}\n```\n\n当输入的日期代码为 1 以外的任何值时，代码不会运行嵌套的 `given-when`\
  \ 块，输出将与上一个示例相同；但是，如果我们提供 1 作为输入，代码将执行嵌套的 `given-when` 块，结果将与上一个示例不同。\n\n## goto\
  \ 语句\n\nPerl 中的 `goto` 语句是一种跳转语句，有时被称为无条件跳转语句。`goto` 语句可以从函数内部的一个位置跳转到另一个位置。\n\n\
  上述语法中的 `goto` 语句指示编译器立即去/跳转到指定为 `LABEL` 的语句。`label` 是一个用户定义的标识符，在此例中指定目标语句。目标语句是紧跟在“label”\
  \ 之后的语句。\n\n在 Perl 中，`goto` 语句有三种形式：`Label`、`Expression` 和 `Subroutine`。\n\n- `Label`：它将跳转到\
  \ `LABEL` 指出的语句，并从那里继续执行。\n- `Expression`：这种形式包含一个表达式，在求值后返回一个 `Label` 名称，`goto`\
  \ 将使其跳转到被标记的语句。\n- `Subroutine`：`goto` 将编译器从当前正在执行的子程序移动到提供名称的子程序。\n\n**带有 LABEL\
  \ 名称的 goto：** `LABEL` 名称用于跳转到代码中的特定语句并从那里开始执行。然而，它的范围是限制的。它只能在调用的作用域内运行。\n\n**使用\
  \ Expression 的 goto：** 也可以使用表达式来调用特定标签并将控制权传递给该标签。当此表达式传递给 `goto` 语句时，它会被评估为标签名称，执行将从该标签名称描述的语句继续。\n\
  \n**带有 Subroutine 的 goto：** `goto` 命令也可以调用子程序。根据其用法，该过程可以从另一个子程序内部调用，也可以单独调用。它将下一个要执行的任务留在调用语句附近。这种方法可以递归地调用函数来打印一系列或范围内的字符。\n\
  \n## next 运算符\n\n在 Perl 中，`next` 运算符会跳过当前循环执行，并将迭代器移动到 `next` 指定的值。如果程序中指定了标签，执行将进入由\
  \ `Label` 指定的下次迭代。\n\n## redo 运算符\n\n在 Perl 中，`redo` 运算符将从指定的标签开始，而不求值条件表达式。一旦调用了\
  \ `redo`，该块中的后续语句将不再执行。即使有 `continue` 块，在 `redo` 调用之后也不会执行。当 `redo` 运算符配合 `Label`\
  \ 使用时，执行从由 `Label` 定义的循环开始。\n\n## last 中的 last\n\n`last` 关键字用于循环控制语句，使循环的当前迭代成为最后一次。如果提供了标签，它将通过该标签退出循环。\n\
  \n在本章中，我们涵盖了 Perl 中的控制流语句。\n\n## 注意事项\n\n# 第 5 章 Perl 中的文件处理\n\nDOI: [10.1201/9781003358442-5](https://doi.org/10.1201/9781003358442-5)\n\
  \n## 本章内容\n\n- 文件处理简介\n- 打开和读取文件\n- 写入和追加文件\n- 读取 CSV 文件\n- 文件测试操作符\n- 文件锁定\n- Slurp\
  \ 模块的使用\n- 有用的文件处理函数\n\n在上一章中，我们讨论了控制流语句，在本章中，我们将涵盖文件处理。\n\n## 文件处理简介\n\nPerl 中的\
  \ `FileHandle` 将一个名称与外部文件连接，该连接可以使用一直到程序终止或 `FileHandle` 关闭。总而言之，`FileHandle` 是一种用于编辑外部文件内容的连接，该连接（`FileHandle`）被命名以便于访问和方便使用。\n\
  \n`STDIN`、`STDOUT` 和 `STDERR` 是 Perl 中三个基本的 `FileHandles`，分别代表标准输入、标准输出和标准错误设备。\n\
  \n`open` 函数通常用于文件处理。\n\n`Mode` 和 `FileName` 也可以组合产生单个 `open` 表达式。\n\n`close` 函数用于关闭\
  \ `FileHandle`。\n\n### 使用 FileHandle 读取和写入文件\n\n`print` 函数用于读取 `FileHandle`。\n\n\
  `print` 函数用于写入文件。\n\n### 各种文件处理模式\n\n| 模式 | 说明 |\n| --- | --- |\n| “<” | 只读模式 |\n\
  | “>” | 写入模式（会清空文件） |\n| “>>” | 追加模式 |\n| “+<” | 读写模式 |\n| “+>” | 读写模式 |\n| “+>>”\
  \ | 读写模式 |\n\n1. **Mode = “<”**\n此模式是只读的。此模式用于读取文件内容。\n**示例：** 考虑 `Hello.txt`，初始包含“Welcome”。\n\
  ```perl\n#!/usr/bin/perl\n### 以只读模式打开文件\nopen(r, \"<\", \"Hello.txt\");\n### 打印内容\n\
  print(<r>);\n### 关闭\nclose(r);\n```\n\n2. **Mode = “>”**\n这是写入模式。当我们用此模式打开文件时，原始内容会被删除。如果没有同名文件，将创建一个。\n\
  ```perl\n#!/usr/bin/perl\n### 以只读模式打开文件\nopen(r, \"<\", \"Hello.txt\");\n### 打印现有内容\n\
  print(\"Existing Content of Hello.txt: \". <r>);\n### 以写入模式打开文件\nopen(w, \">\",\
  \ \"Hello.txt\");\n### 将指针移到开头\nseek r, 0, 0;\nprint(\"\\n 写入写入...\");\n### 使用 w\
  \ 写入\nprint w \"The Content of this file changed\";\n### 关闭\nclose(w);\n### 将指针移到开头\n\
  seek r, 0, 0;\n### 打印更新后的内容\nprint(\"\\nUpdated Content of Hello.txt: \".<r>);\n\
  ### 关闭\nclose(r);\n```\n\n3. **“>>”**\n追加模式。当我们用此模式打开文件时，原始内容不会被删除。由于字符串总是附加在末尾，此模式无法用于覆盖。如果没有发现同名文件，将创建一个。\n\
  ```perl\n#!/usr/bin/perl\n### 以只读模式打开文件\nopen(r, \"<\", \"Hello.txt\");\n### 打印现有内容\n\
  print(\"Existing Content of Hello.txt: \". <r>);\n### 以追加模式打开文件\nopen(A, \">>\"\
  , \"Hello.txt\");\n### 将指针移到开头\nseek r, 0, 0;\nprint(\"\\n 追加写入...\");\n### 使用 A\
  \ 追加\nprint A \" Hello Everyone!\";\n### 关闭\nclose(A);\n### 将指针移到开头\nseek r, 0,\
  \ 0;\n### 打印更新后的内容\nprint(\"\\nUpdated Content of Hello.txt: \".<r>);\n### 关闭\n\
  close(r);\n```\n\n4. **Mode = “+<”**\n\n\n\n\n\n这被称为读写模式。此函数可以用于替换文件中的现有字符串。它无法创建新文件。\n\
  \n```perl\n#!/usr/bin/perl\n### 以读写模式打开 Hello1.txt\nopen(rw, \"+<\", \"Hello1.txt\"\
  );\n### 打印文件的原始内容。\n# rw 被设置为末尾。\nprint(\"Existing Content of the Hello1.txt: \"\
  .<rw>);\n# 字符串附加在文件原始内容的末尾。\nprint rw \"Added using the Read -Write Mode.\";\n#\
  \ 将 rw 设置为文件的开头以便读取。\nseek rw, 0, 0;\n### 打印文件的更新内容\nprint(\"\\nUpdated contents\
  \ of Hello1.txt: \".<rw>);\n# 关闭文件句柄\nclose(rw);\n```\n\n## 5. Mode = “+>”\n\n这被称为读写模式。`+`\
  \ 和 `+>` 的区别在于，`+>` 即使在同名文件存在的情况下也可以创建一个新文件，而 `+` 则不能。\n\n```perl\n#!/usr/bin/perl\n\
  # 以读模式打开文件 Hello1.txt\nopen(r, \"<\", \"Hello1.txt\");\n### 打印文件的现有内容\nprint(\"\
  Existing Content of Hello1.txt: \". <r>);\n### 关闭文件\nclose(r);\n### 以读写模式打开 Hello1.txt\n\
  open(rw, \"+>\", \"Hello1.txt\");\n# 当文件打开时，文件的原始内容会被清除\nprint(\"\\nContents of\
  \ Hello1.txt gets cleared…\");\n### 将字符串写入文件\nprint rw \"Hello!!! This is the updated\
  \ file.\";\n# 将 rw 设置为文件的开头以便读取。\nseek rw, 0, 0;\nprint(\"\\nUpdated Content of\
  \ Hello1.txt: \" .<rw>);\n### 关闭文件\nclose(rw);\n```\n\n## 6. Mode = “+>>”\n\n这被称为读追加模式。它可以用于从文件读取并向文件追加内容。如果不存在此类文件，将生成一个同名的新文件。\n\
  \n```perl\n# 以读追加模式打开 Hello1.txt\nopen(ra, \"+>>\", \"Hello1.txt\");\n# 将 ra 设置为文件的开头以便读取。\n\
  seek ra, 0, 0;\n# 当文件打开时，文件的原始内容不会被清除\nprint(\"Existing Content of File: \". <ra>);\n\
  print \"\\nAppending to File....\";\n### 将字符串追加到文件\nprint ra \"Added using Read-Append\
  \ Mode\";\n# 将 ra 设置为文件的开头以便读取。\nseek ra, 0, 0;\n# 打印更新内容\nprint(\"\\nUpdated content\
  \ of File: \". <ra>);\n### 关闭文件\nclose(rw);\n```\n\n## 重定向输出\n\n使用 `choose` 函数，可以将输出从控制台重定向到文件。\n\
  \n## 文件打开与读取\n\n`FileHandle`（文件句柄）是 Perl 的内部结构，用于将物理文件连接到名称。所有的 `FileHandles` 都具有读/写权限；因此，一旦连接到文件，就可以读取/写入。然而，在关联\
  \ `FileHandle` 时，打开文件句柄的模式必须是正确的。\n\n### 打开文件\n\n`open` 函数用于打开新文件或现有文件。\n\n在这种情况下，`FileHandle`\
  \ 是 `open` 函数返回的句柄，`VAR` 是包含文件名和打开模式的表达式。\n\n下表显示了各种文件打开模式以及对各种操作的访问权限。\n\n| 模式\
  \ | 描述 |\n| --- | --- |\n| r 或 < | 只读访问 |\n| w 或 > | 创建、写入并截断 |\n| a 或 >> | 写入、追加并创建\
  \ |\n| r+ 或 +< | 读取和写入 |\n| w+ 或 +> | 读取、写入、创建并截断 |\n| a+ 或 +>> | 读取、写入、追加并创建 |\n\
  \n### 读取文件\n\n当 `FileHandle` 分配给一个文件时，它可以执行读取、写入和追加等操作。有几种方法可以读取文件。\n\n*   使用 `FileHandle`\
  \ 运算符\n*   利用 `getc` 函数\n*   利用 `read` 函数\n\n### FileHandle 运算符\n\n从已打开的 `FileHandle`\
  \ 读取数据的最常用方法是使用运算符 `< >`。当在列表上下文中使用时，`< >` 运算符会返回来自提供的 `FileHandle` 的行列表。以下示例从文件中读取一行并将其放入标量中。\n\
  \n假设文件 “PFP.txt” 的内容如下：PeeksforPeeks Hello Peek Peek a revolution Peeks are the\
  \ best\n\n### getc 函数\n\n`getc` 函数从给定的 `FileHandle`（如果没有指定则为 `STDIN`）中检索单个字符。\n\n\
  如果发生错误或 `FileHandle` 位于文件末尾，它将返回 `undef`。\n\n### read 函数\n\n`read` 函数使用 `FileHandle`\
  \ 从文件读取二进制数据。\n\n如果没有提供 `OFFSET`，`LENGTH` 表示要读取的数据长度，并且数据将插入到 `SCALAR` 的开头。否则，数据将插入到\
  \ `SCALAR` 中 `OFFSET` 字节之后。如果文件读取成功，函数返回读取的字节数，在文件末尾返回零，或者如果发生错误则返回 `undef`。\n\n\
  ### 一次读取多行\n\n以下示例读取 `FileHandle` 指示的文件内容，直到遇到文件末尾 (EOF)。\n\n### 文件中的异常处理\n\n异常可以通过两种方式之一进行处理：\n\
  \n*   如果文件无法打开，则抛出异常。\n*   如果文件无法打开，发出警告并继续操作。\n\n### 抛出异常\n\n当 `FileHandle` 未分配到有效文件指针时，将运行\
  \ `die`，它会打印消息并终止当前程序。\n\n如果找不到文件，代码将产生错误并退出。\n\n#### 给出警告\n\n当 `FileHandle` 无法分配适当的文件引用时，它会产生警告消息并继续操作。\n\
  \n### 写入文件\n\n`FileHandle` 是一个用于读取和写入文件的变量。此 `FileHandle` 与文件关联。\n\n要写入文件，请以写入模式打开它，如下所示：`open\
  \ (FH, ’>’, \"file_name.txt\");`\n\n如果文件已存在，它将用新内容替换旧内容。否则，将生成一个带有新内容的新文件。\n\n###\
  \ print() 函数\n\n`print()` 方法用于将数据写入文件。\n\n当文件打开时，`FileHandle` 会与其关联，字符串包含要写入文件的内容。\n\
  \n**程序的运行方式如下：**\n\n*   步骤 1：以写入模式打开 `Hello.txt` 文件。\n*   步骤 2：从标准输入键盘提取文本。\n* \
  \  步骤 3：将保存在 `$a` 中的字符串保存到由文件句柄 `fh` 指向的文件中。\n*   步骤 4：保存文件。\n\n以下示例读取源文件内容并将其写入目标文件：\n\
  \n```perl\n### 源文件\n$src = ’Source.txt’;\n### 目标文件\n$des = ’Destination.txt’;\n\
  ### 打开源文件进行读取\nopen(FHR, ’<’, $src);\n# 打开目标文件进行写入\nopen(FHW, ’>’, $des);\nprint(\"\
  Copying the content from $src to $des\\n\");\nwhile(<FHR>) {\n    print FHW $_;\n\
  }\n# 关闭文件句柄\nclose(FHR);\nclose(FHW);\nprint \"File copied successfully!\\n\";\n\
  ```\n\n**程序的运行方式如下：**\n\n*   步骤 1：读取 `Source.txt` 并写入 `Destination.txt`。\n*   步骤\
  \ 2：从 `FHR` 读取内容，`FHR` 是读取内容的句柄，写入写入文件的句柄。\n*   步骤 3：使用 `print` 函数复制内容。\n*   步骤\
  \ 4：文件读取完成后，关闭 `conn`。\n\n### 错误处理与错误报告\n\n错误可以通过两种方式之一进行处理：\n\n*   如果文件无法打开，则抛出异常（处理错误）。\n\
  *   如果文件无法打开，发出警告并继续操作（错误报告）。\n\n当 `FileHandle` 未分配到有效文件指针时，将运行 `die`，它会打印消息并终止当前程序。\n\
  \n当给定代码中存在文件时，执行将没有问题，但如果文件不存在，则产生错误且代码结束。\n\n## 追加文件\n\n\n\n\n\n当使用 `\">”` 以写入模式打开文件时，现有文件的内容会被破坏，并且通过\
  \ `print` 语句添加的内容将写入文件。在此模式下，写入点被设置为文件的末尾。因此，旧文件内容会被保留，所有使用 `print` 语句写入文件的内容都会追加到文件末尾。然而，在文件以\
  \ `+>>` 模式（表示添加和读取）打开之前，无法执行读取操作。\n\n该程序的运行流程如下：\n\n* 步骤 1：以读取模式打开文件以查看文件的现有内容。\n\
  * 步骤 2：打印文件的现有内容。\n* 步骤 3：通过追加模式（Append mode）打开文件向其添加材料。\n* 步骤 4：收集用户文本并附加文件。\n\
  * 步骤 5：向文件中添加文本。\n* 步骤 6：重新读取文件以确定内容是否已更改。\n* 步骤 7：关闭文件。\n\n## CSV 文件读取\n\nPerl\
  \ 最初设计用于文本处理，例如从文本文件中提取信息并将其转换为新格式。在 Perl 中，读取文本文件是一项频繁的活动。例如，读取 CSV（逗号分隔值）文件以提取数据和信息是一项常见任务。\n\
  \n可以使用任何文本编辑器（如记事本、notepad++ 等）创建 CSV 文件。在记事本文本文件中添加材料后，将其保存为带有 `.csv` 扩展 CSV 文件。\n\
  \n**CSV 文件示例：**\n\n![](img/ufig5_1.jpg)\n\nCSV 文件示例。\n\nCSV 文件可用于处理企业或组织的数据库记录文件。这些文件可以方便地在\
  \ Excel 中打开，并可以使用任何兼容应用程序进行编辑。Perl 还允许通过从文件中提取值、修改这些值并将修改后的值插回文件，来处理和构建这些“csv”文件。我们将使用\
  \ `split` 函数从特定行中提取每个值。\n\n### 使用 Split() 进行数据提取\n\n`split()` 是一个标准的 Perl 函数，用于使用分隔符将字符串分为若干部分。该分隔符可以是用户指定的任何字符；但我们通常使用逗号。\n\
  \n`split()` 接受两个参数。第一个是分隔符，第二个是要被划分的字符串。\n\n使用以下步骤通过分隔符将 CSV 文件中的行划分为部分：\n\n* 步骤\
  \ 1：逐行读取文件。\n* 步骤 2：将每行的所有值放入数组中。\n* 步骤 3：为了获得结果，单独打印所有数据。\n\n让我们来看一个示例以更好地理解该主题。`split()`\
  \ 方法用于使用分隔符划分 `new.csv` 文件中记录的字符串，如下所示：\n\n```\nuse strict; my $file = $ARGV[0]\
  \ or die; open(my $data, ’<’, $file) or die; while (my $line = <$data>) { chomp\
  \ $line; # Split line and store it # inside words array my @words = split \", \"\
  , $line; for (my $x = 0; $x <= 2; $x++) { print \"$words[$x] \"; } print \"\\n\"\
  ; }\n```\n\n将上述代码保存为带有 `.pl` 扩展名的文本文件。在这种情况下，我们将其存储为 `test1.pl`。\n\n使用以下命令运行之前存储的文件：`perl\
  \ test1.pl new.csv`\n\n### 逗号字符转义\n\n有时文件的字符串字段内部包含逗号，如果删除它会改变数据的解释或使记录无法使用。在这种情况下使用\
  \ `split()` 函数，即使在引号内，它每遇到逗号作为分隔符就会划分数据，因为 `split()` 不忽略引号也不理解 CSV。它只是在遇到分隔符字符时进行切割。\n\
  \n以下是一个引号内包含逗号的 CSV 文件：\n\n![](img/ufig5_2.jpg)\n\n逗号字符转义。\n\n上述 CSV 文件中的第一个字段包含逗号；因此它被包含在引号内。然而，如果我们对此文件执行\
  \ `split()` 方法，它将忽略任何此类引号。\n\n上述程序中的 `split()` 方法即使在字段处于引号之间也将字符串字段拆分成了碎片；此外，由于我们在代码中只打印了三个字段，最后一个字符串的第三个字段在输出文件中被丢弃了。\n\
  \n为了处理此类场景，Perl 有若干种限制和范围，允许编译器跳过引号内的字段划分。\n\n我们利用 `TEXT::CSV`，它提供了一个完整的 CSV 读取器和写入器。`TEXT::CSV`\
  \ 是一个 Perl CPAN 模块，增加了许多额外功能，如读取、解析和写入 CSV 文件。可以使用以下预指令在 Perl 程序中包含这些模块：`use Text::CSV`\n\
  \n然而，我们必须先在设备上下载并安装该模块才能使用其功能。\n\n### 安装 TEXT::CSV\n\n对于 Windows：`perl -MCPAN -e\
  \ shell install Text::CSV`\n\n对于 Debian/Ubuntu 系统：`$ sudo apt-get install libtext-csv-perl`\n\
  \n对于 RedHat/Centos/Fedora 系统：`$ sudo yum install perl-Text-CSV`\n\n要转义引号之间的逗号字符，请在我们\
  \ `new.csv` 文件上运行以下代码：\n\n```\nuse strict; # Using the Text::CSV file to allow #\
  \ full CSV Reader and Writer use Text::CSV; my $csv = TEXT::CSV->new({ sep_char\
  \ => ’, ’ }); my $file_to_be_read = $ARGV[0] or die; # Reading file open(my $data_file,\
  \ ’<’, $file_to_be_read) or die; while (my $line = <$data_file>) { chomp $line;\
  \ # Parsing line if ($csv->parse($line)) { # Extracting elements my @words = $csv->fields();\
  \ for (my $x = 0; $x <= 2; $x++) { print \"$words[$x] \"; } print \"\\n\"; } else\
  \ { # Warning to display warn \"Line could not parse: $line\\n\"; } } } }\n```\n\
  \n上述示例中的第一个字段现在包含一个逗号，它在解析 CSV 文件时已通过转义。\n\n上一行描述了如何调用类的构造函数。箭头 `->` 用于调用构造函数。\n\
  \n此调用将尝试解析当前行并将其划分为块。根据成功或失败返回真或假。\n\n### 嵌入换行符的字段\n\nCSV 文件中的特定字段可能是多行的，或者在单词之间嵌入了换行符。当通过\
  \ `split()` 方法提供这些多行字段时，它们的行为与没有嵌入换行符的其他文件有很大不同。\n\n上述 CSV 文件中的嵌入换行符现在由 `getline()`\
  \ 函数处理，并根据需要被包含在引号内。\n\n### 文件测试操作符\n\n在 Perl 中，文件测试操作符是产生真或假值的逻辑运算符。Perl 提供了许多测试文件特性的运算符。例如，`-e`\
  \ 运算符用于检查文件是否存在。或者，它可以确定文件是否可以写入。这有助于减少程序可能遇到的错误。\n\n以下示例使用 `-e` 存在操作符来判断文件是否存在：\n\
  \n```\n#!/usr/bin/perl # 使用预定义模块 warnings; use strict; # 将路径传递给变量 my $filename =\
  \ ’C:\\Users\\PeeksForeks\\PFP.txt’; # 检查文件是否存在 if(-e $filename) { # 如果文件存在 print(\"\
  File $filename exists\\n\"); } else { # 如果文件不存在 print(\"File $filename doesn’t exists\\\
  n\"); }\n```\n\n此文件测试操作符 `-e` 接受文件名或句柄作为输入。\n\n下表列出了最重要的文件测试操作符：\n\n| 操作符 | 说明 |\n\
  | --- | --- |\n| -r | 检查是否可读 |\n| -w | 检查是否可写 |\n| -x | 检查是否是否可执行 |\n| -o | 检查文件是否属于有效\
  \ uid |\n| -R | 检查文件是否允许真实 uid 读取 |\n| -W | 检查文件是否允许真实 uid  |\n| -X | 检查文件是否允许真实\
  \ uid/gid 执行 |\n| -O | 检查文件是否属于真实 uid |\n| -e | 检查文件是否存在 |\n| -z | 检查文件是否为空 |\n\
  | -s | 检查文件大小是否非零（返回字节数） |\n| -f | 检查是否为普通文本文件 |\n| -d | 检查是否为目录 |\n| -l | 检查是否为符号链接\
  \ |\n\n\n\n\n\n| -p | 检查文件是否为命名管道 (FIFO)：或 `FileHandle` 是否为管道 |\n| -S | 检查文件是否为套接字\
  \ |\n| -b | 检查文件是否为块特殊文件 |\n| -c | 检查文件是否为字符特殊文件 |\n| -t | 检查文件句柄是否已打开到 tty |\n\
  | -u | 检查文件是否设置了 setuid 位 |\n| -g | 检查文件是否设置了 setgid 位 |\n| -k | 检查文件是否设置了粘性位 (sticky\
  \ bit) |\n| -T | 检查文件是否为 ASCII 文本文件（启发式判断） |\n| -B | 检查文件是否为“二进制”文件（-T 的相反） |\n\n\
  我们可以将逻辑运算符 `AND` 结合以下文件测试操作符使用：\n\n```perl\n#!/usr/bin/perl\n### 使用预定义的模块\nuse warnings;\n\
  use strict;\n# 将文件路径赋值给变量\nmy $filename = ’C:\\Users\\PeeksForPeeks\\PFP.txt’;\n\
  # 对文件应用多个测试操作符\nif(-e $filename && -f _ && -r _ ) {\n    print(\"File $filename\
  \ exists and readable\\n\");\n} else {\n    print(\"File $filename does not exists\"\
  )\n}\n```\n\n上面的示例检查了文件是否存在，以及它是否为普通文件，以及是否可读。\n\n### 文件锁定\n\n文件锁定，或广义的锁定，是解决资源共享问题的若干种技术之一。\n\
  \n锁定任何文档的安全性和完整性是保护它的手段。文件锁定的基本目标是允许用户更改文档而不会引起混乱。当两个或更多人尝试更改同一个文件时，可能会发生问题。\n\n\
  考虑以下示例：一个存储项目数据的文件。该文件可以由整个项目团队修改。在 Web 上，将编写一个 CGI 脚本来实现以下：\n\n```perl\n$file =\
  \ \"project.docx\";\n$commit = $ENV{’QUERY_INFO’};\nopen(FILE, \"$file\");\n###\
  \ 打开文档\nwhile() {\n    if (m/^$commit$/) {\n        print \"The Change already made\\\
  n\";\n        exit;\n    }\n}\nclose(FILE);\npush(@newcommit, $commit);\nopen(FILE,\
  \ \">$file\");\nprint ...\nclose(FILE);\nprint \"Commit-made\";\nexit;\n```\n\n\
  文件的锁定是在系统级别执行的；因此用户无需担心应用锁定的细节。文件锁的目的是对某些文件实施临时限制，以限制程序之间之间的共享方式。根据给定操作的性质开发了两种锁。\n\
  \n第一种是共享锁（shared lock），第二种是排斥锁（exclusive lock）。多个进程可以共享对文件的读取访问，因为读取访问不会改变共享资源的状态。因此，保持共享资源的一致视图是可能的。可以使用\
  \ Perl 中的 `flock` 命令来锁定文件。\n\n### flock()\n\n`flock()` 有两个参数。第一个是 `FileHandle`。第二个输入指定所需的锁定程序。\n\
  \nPerl 使用数字来表示值：`sub LOCK_SH { 1 }` ## 设置为共享锁，`sub LOCK_EX { 2 }` ## 设置为排斥锁，`sub\
  \ LOCK_NB { 4 }` ## 在不进行阻塞的情况下锁定，`sub LOCK_UN { 8 }` ## 解锁 FILEHANDLE\n\n*   **共享锁：**\
  \ 当我们只想读取文件同时允许其他人查看它时，可以使用共享锁。共享锁不仅创建了一个锁，还会检查是否存在额外的锁。此锁不涵盖所有锁的存性检查，仅针对“排斥锁”。如果存在排斥锁，它将等待直到该锁被移除。移除后，它将作为共享锁执行。多个共享锁可以同时存在。\n\
  *   **排斥锁：** 当一个文件要由一组人员使用且每个人都有能力进行更改时，将使用排斥锁。一个文件上只能放置一个排斥锁，一次只允许一个用户/进程进行修改。排斥锁的规则是“我是唯一的”。`flock()`\
  \ 会搜索脚本中是否有任何其他类型的锁。如果发现，它将一直保持，直到所有锁都从脚本中删除为止。它将在适当的时间锁定文件。\n*   **非阻塞锁：** 非阻塞锁通知系统，它不需要等待其他锁从文件中释放。如果在文件中检测到另一个锁，它将产生一条错误消息。\n\
  *   **取消阻塞：** 与 `close(FILE)` 函数相同，此函数会解锁任何给定的文件。\n\n以下问题演示了 `flock()` 函数的使用：\n\n\
  ### flock() vs lockf()\n\n与一次性锁定整个文件的 `flock()` 相，`lockf()` 方法锁定文件的片段。`lockf()`\
  \ 无法在 Perl 中直接使用，但 Perl 原生支持 `flock` 系统函数，但不适用于网络锁。\n\nPerl 支持 `fcntl()` 系统函数，提供了卓越的锁定控制。\n\
  \n### SLURP 模块\n\n`File::Slurp` 模块读取文件内容并将其存在字符串中。这是一种读取/写入/修改整个文件的简单快速的方法。正如其名称所暗示，它让我们能够通过单次调用读取或写入整个文件。\n\
  \n通过将此模块导入到我们的程序中，用户可以使用 `read_file`、`read_text`、`write_file` 等函数从文件向文件读写数据。\n\n\
  **安装 File::Slurp 模块：** 我们必须先将此模块包含在 Perl 语言包中以利用它。这可以通过在 Perl 终端中输入以下指令并安装必要的模块来实现。\n\
  \n**步骤 1：** 在我们的终端中运行以下命令：`perl -MCPAN -e shell`\n\n进入 cpan shell 后，按照以下步骤安装 `File::Slurp`\
  \ 模块。\n\n**步骤 2：** 要安装该模块，运行以下命令：`install File::Slurp`\n\n执行后将安装 `File::Slurp` 模块。\n\
  \n**步骤 3：** 要退出 cpan> 提示符，输入并执行“q”命令。\n\n**Slurp 中的 read_file 函数：** `File::Slurp`\
  \ 的读取文件函数读取指定文件的完整内容并将其作为字符串返回。然而，建议使用 `File::Slurp`，因为它有一些编码层缺陷，可能会导致编译困难。`File::Slurper`\
  \ 试图为上述困难提供可行的解决方案。\n\n**Slurp 中的 read_text 函数：** `File::Slurper` 中的 `read_text`\
  \ 方法接受一个可选的编码参数（如果有的话），并且在我们请求时可以自动解码 CRLF 行结束符（针对 Windows 文件）。\n\n**注意：** CRLF\
  \ 行结束符表示文本文件中的换行（Windows 换行类型）。\n\n**Slurp 的 write_file 函数：** `File::Slurp` 模块的\
  \ `write_file` 方法用于一次写入多个文件。它使用包含由 `read_file` 函数读取的另一个文件内容的标量变量写入文件。\n\n**第一个示例：**\
  \ 使用标量存储文件内容\n```perl\n# 用于演示 slurp 函数使用的 Perl 代码\nuse File::Slurp;\n### 读取整个文件到标量\n\
  my $content = read_file(’C:\\Users\\PeeksForPeeks\\PFP_Slurp.txt’);\n# 从标量写入整个文件\n\
  write_file(’C:\\Users\\PeeksForPeeks\\Copyof_PFP_Slurp.txt’, $content);\n```\n\n\
  **解释：** 在前面的 Perl 代码中，我们使用 slurp 函数读取一个名为 `PFP_Slurp.txt` 的包含多行文本的文件并存标量变量 `$content`，然后将文件内容作为单个字符串写入另一个文件\
  \ `Copyof_PFP_Slurp.txt`。\n\n**第二个示例：** 使用数组存储文件内容\n```perl\n# 说明 slurp 函数的 perl\
  \ 代码\nuse File::Slurp;\n# 读取整个文件到数组\nmy @lines = read_file(’C:\\Users\\PeeksForPeeks\\\
  PFP_Slurp2.txt’);\n# 从标量写入整个文件（此处原文代码注释有误，应为 array）\nwrite_file(’C:\\Users\\PeeksForPeeks\\\
  Copyof_PFP_Slurp2.txt’, @lines);\n```\n\n**解释：** 在前面的 Perl 代码中，我们使用 slurp 函数读取一个名为\
  \ `PFP_Slurp2.txt` 的包含文本行数组的文件并存入数组变量 `@lines`，然后将整个文件的内容作为单个字符串写入名为 `Copyof_PFP_Slurp2.txt`\
  \ 的文件。\n\n\n\n\n\n# 第三个示例：编写使用 slurp 技术的函数，用 Perl 代码说明 slurp 函数\n\n```perl\nuse\
  \ strict;\nuse warnings;\nuse File::Slurp;\n\n# 调用自定义函数 get_a_string();\nsub get_a_string\
  \ {\n    # 将整个文件读入一个标量\n    my $pfp_str = read_file('C:\\Users\\PeeksForPeeks\\\
  PFP_User_Slurp.txt');\n    # 从标量写入整个文件\n    write_file('C:\\Users\\PeeksForPeeks\\\
  Copyof_PFP_User_Slurp.txt', $pfp_str);\n}\n```\n\n### 解释：\n在上面的 Perl 代码中，`strict`\
  \ 和 `warnings` 允许用户更自由地编写代码，并更早地发现变量名拼写错误等问题。我们调用了一个名为 `get_a_string` 的用户定义函数，该函数执行了\
  \ slurp 功能：它将包含几行文本的文件作为输入读取到名为 `pfp_str` 的变量中，然后将整个文件的内容作为一个单个字符串写入文件中。\n\n## 有用的文件处理函数\n\
  \nPerl 最初是为了文本处理开发的，例如从文本文件中提取信息并将文本文件转换为新格式。这些过程可以使用多种内置文件函数完成。\n\n以下是一些用于处理文件的一些实用\
  \ Perl 例程：\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `glob()` | 用于打印作为传入的目录中的文件。 |\n| `tell()`\
  \ | 使用 `FileHandle` 获取文件内读取指针的位置。 |\n| `getc()` | 用于从 `FileHandle` 参数指定的读取读取下一个字符。\
  \ |\n| `reverse()` | 在列表上下文中使用时，返回反序排列的列表；在标量上下文中使用时，返回列表值连接而成的字符串，其中字符串中每个字符的顺序都是相反的。\
  \ |\n| `rename()` | 将文件从旧名称重命名为用户指定的新名称。 |\n\n在本章中，我们涵盖了 Perl 中的文件处理以及其语法和相关示例。\n\
  \n# 第 6 章节：Perl 中的正则表达式\n\nDOI: [10.1201/9781003358442-6](https://doi.org/10.1201/9781003358442-6)\n\
  \n## 本章内容\n\n* 正则表达式\n* 运算符\n* 正则字符类和特殊字符类\n* 量化与回溯\n* 正则中的“e”修饰符\n* “ee”修饰符\n*\
  \ `pos()` 函数\n\n在上章中，我们讨论了文件处理；在本章中，我们将涵盖正则表达式（`Regex`）。\n\n在 Perl 中，正则表达式（`Regex`、`Regexp`\
  \ 或 `RE`）是一种特定的文本字符串，用于描述给定文本内部的搜索模式。Perl 中的 `Regex` 与宿语言绑定，与 `PHP`、`Python` 以及其他编程语言中的不同。\n\
  \n它有时被称为“兼容 Perl 5 的正则表达式”。绑定运算符如 `=~`（正则表达式运算符）和 `!~`（非正则表达式运算符）被用于利用 `Regex`。让我们在转向绑定运算符之前，先从创建模式开始吧。\n\
  \n### 模式构建：\n在 Perl 中，可以使用 `m//` 运算符构建模式。该运算符简单地在两个斜杠之间插入所需的模式，而绑定运算符则用于在提供的文本中搜索该模式。\n\
  \n### 使用 m// 配合绑定运算符：\n绑定运算符通常与 `m//` 运算符配合使用以匹配所需的模式。使用正则表达式匹配字符串，请使用正则表达式运算符。语句的左侧将包含一个字符串，该字符串将匹配右侧提供的模式。非正则表达式运算符用于判断字符串是否等于右侧提供的正则表达式。\n\
  \n**程序 1：** 以下代码演示了 `m//` 和 `=~` 的用法：\n```perl\n### 演示程序\n### m// 和 =~ 运算符\n###\
  \ 实际字符串\n$a = \"PEEKSFORPEEKS\";\n# 如果在 $a 中找到\n# 则打印找到匹配项\nif ($a =~ m[PEEKS])\
  \ {\n    print \"Match is Found\\n\";\n}\n# 如果在 $a 中未找到\n# 则打印未找到匹配项\nelse {\n \
  \   print \"Match is Not Found\\n\";\n}\n```\n\n**程序 2：** 为了演示 `m//` 和 `!~` 的用法，请考虑以下：\n\
  ```perl\n### 演示程序\n# m// 和 !~ 运算符\n### 实际字符串\n$a = \"PEEKSFORPEEKS\";\n# 如果在 $a\
  \ 中未找到\n# 则打印找到匹配项\nif ($a !~ m[PEEKS]) {\n    print \"Match is Found\\n\";\n}\n\
  # 如果在 $a 中找到\n# 则打印未找到匹配项\nelse {\n    print \"Match is Not Found\\n\";\n}\n```\n\
  \n### 正则表达式的用途：\n\n* 它可以用于计算特定模式在字符串中出现的次数。\n* 它可以查找匹配特定模式的字符串。\n* 它还可以将搜索到的模式替换为另一个字符串。\n\
  \n### 正则表达式中的运算符\n\n正则表达式是一个不同字符的混合字符串，有助于文本字符串匹配。`regex` 或 `regexp` 是正则表达式的另一个名称。\n\
  \n利用正则表达式最基本的方法是使用绑定运算符 `=~`（正则表达式运算符）和 `!~`（非正则表达式运算符）。\n\n在 Perl 中，三种类型的正则表达式运算符：\n\
  \n* 匹配正则表达式\n* 替换正则表达式\n* 全局字符转译正则表达式\n\n### 1. 模式匹配或正则表达式匹配：\n匹配运算符 `m//` 将字符串或语句与正则表达式进行比较。运算符中的正斜杠充分隔符。表达式写在运算符的两个斜杠之间。\n\
  语法：`m/PATTERN/`\n`PATTERN` 是将搜索的正则表达式。让我们来看一些模式匹配的示例。在以下情况下，字符串和正则表达式进行匹配，如果成功，则返回“match\
  \ found”；否则，返回“match not found”。在前面的代码中，使用了另一种分隔符 `{}` 替换了 `/`。\n\n### 2. 制作替换（搜索并替换）正则表达式：\n\
  替换运算符 `s///` 用于搜索并替换特定的单词。分隔符是正斜杠。\n语法：`s/PATTERN/REPLACEMENT/`\n`PATTERN` 是 `REPLACEMENT`\
  \ 正则表达式将替换的正则表达式。让我们来看几个实例：先搜索 `PATTERN` 单词，跟随 `REPLACEMENT` 单词。\n\n### 3. 全局字符转译正则表达式：\n\
  将所有实例替换为单个字符，使用转译运算符 `tr///` 或 `y///`。分隔符是正斜杠。\n\n## 正则字符类\n\n为了匹配字符串，使用了字符类。这些类允许用户匹配预先的字符范围。要匹配的字符集始终包含在方括号\
  \ `[]` 中。字符类总是完美匹配一个字符。\n\n如果没有检测到匹配，整个正则表达式将失败。\n\n### 注意事项：\n\n* 在字符类内部，`.` 失去了它特定的含义，即“除换行符的所有内容”。\n\
  * 仅在字符类内部，`.` 可以匹配单个点。\n* 大多数特殊字符在字符类中失去了它们的特殊意义；但某些字符获得了一些特殊含义。\n\n### 字符类中的范围：\n\
  输入长列表很困难，因为用户可能会跳过一个两个字符。所以，为了方便，我们使用范围。破折号 `-` 通常表示范围。\n\n### 注意事项：\n\n* `-(破折号)`\
  \ 用于指定范围。\n* 用户还可以混合各种范围的字符、数字等，例如 `[0-9a-gA-g]`。在这里，`-` 允许用户选择范围内的任何字符或数字。\n* 如果用户想在字符串中匹配破折号\
  \ `-`，只需将其插入方括号 `[]` 之间即可。\n\n\n\n\n\n-   要匹配字符串中的闭合方括号，只需在它前面加上 `\\` 即可，即 `\\]`，并将其放在方括号\
  \ `[]` 之间。\n\n反向字符类：简单地使用脱字符符号（`^`）来反转字符类。它会反转符号后面提供的字符甚至是一个范围。将脱字符（`^`）作为字符类的第一个字符，表示该字符类可以匹配除列出的字符以外的任何字符。\n\
  \n## 正则表达式中的特殊字符类\n\nPerl 具有几种不同的字符类，其中某些类的使用频率非常高，以至于为它们构建了特定的序列。编写自定义序列旨在让代码更易读、更简洁。Perl\
  \ 的特殊字符类如下：\n\n1. **数字 `\\d[0-9]`：** `d` 字符用于匹配任何数字字符，与 `[0-9]` 相同。正则表达式 `/\\d/`\
  \ 会匹配单个数字。`d` 已标准化为“digit（数字）”。其主要优势是用户可以编写更短、更易读的形式。这种独特的字符类有两种用法。让我们通过示例来了解如何匹配字符字符串。\n\
  \n    正如前面提到的，字符字符串匹配情况如下：#M-12345 #N-66666\n\n    在这种情况下，我们也可以通过将量化符放在字符类上来利用它们。\n\
  \n    上面的示例与之前的正则表达式相同，它接受连字符后任意数量的数字，可以表示为 `/#[MNOPQ]-\\d+/`。\n\n    在较大的字符类中，使用了第二种技术。`\\\
  d` 被方括号包围，匹配单个数字字符。\n\n    可以匹配单个数字或任何大写字母 `A`、`B`、`C`、`D`、`E`、`F`、`G`、`H`、`I`、`J`、`K`、`L`、`M`\
  \ 或 `N`。可以使用连字符（`-`）更简洁地编写，例如：`[\\dA-N]`\n\n2. **POSIX 字符类：** POSIX 字符类是确保操作系统兼容性和建立包括命令行\
  \ shell 和实用程序接口的标准的标准。它还提供了许多命名（如 `alpha`、`alnum`、`ascii`、`blank` 等）的“字符分组”。POSIX\
  \ 字符类始终采用 `[:class:]` 形式，其中 `class` 是名称，分隔符是 `[:` 和 `:`。POSIX 字符类始终包含在括号字符类中。这些类提供了一种列出字符集合的快速方便的方法。\n\
  \n    在这里，`class` 可以是 `alpha`、`alnum`、`ascii` 等。\n\n    所示，POSIX 字符类支持更大的括号字符类：`[01[:Class:]%]`\n\
  \n    在这种情况下，它将匹配“0”、“1”、任何字符类以及 `%` 符号。Perl 支持下表所示的 POSIX 字符类：\n\n    | 类 | 描述\
  \ |\n    | --- | --- |\n    | Alpha | 任何字母字符 (`[A-Za-z]`) |\n    | Alnum | 任何字母数字字符\
  \ (`[A-Za-z0-9]`) |\n    | Ascii | ASCII 字符集中的任何字符 |\n    | blank | 空格或水平制表符 |\n\
  \    | Cntrl | 任何控制字符 |\n    | Digit | 任何十进制数字 (`[0-9]`) |\n    | graph | 除空格以外的任何打印字符\
  \ |\n    | lower | 任何小写字符 (`[a-z]`) |\n    | punct | 任何图形字符 |\n    | space | 任何空白字符\
  \ |\n    | upper | 任何大写字符 (`[A-Z]`) |\n    | xdigit | 任何十六进制数字 (`[0-9a-fA-F]`) |\n\
  \    | word | Perl 扩展 (`[A-Za-z0-9_]`)，等同于 `\\w` |\n\n3. **单词字符 `\\w[0-9a-zA-Z ]`：**\
  \ 字母 `w` 属于单词字符类。`w` 字符可以是任意字母数字字符，包括字母、十进制数字或如下划线（`_`）之类的标点符号。它只匹配单词单词，而不是整个单词。如果我们想匹配整个单词，请使用\
  \ `\\w+`。\n\n4. **空白字符 `\\s[\\t\\n\\f\\r ]`：** 字符类 `\\s` 只匹配一个字符，即空白字符。它还会匹配五个字符：`\\\
  t`-水平制表符、`\\n`-换行符、`\\f`-分页、`\\r`-回车和空格。在 Perl 5.18 中，引入了对应于 `\\cK`-垂直制表符的新字符。\n\
  \n5. **反向字符类 `\\D`、`\\W`、`\\S`：** 在这个宇宙中，几乎有 110,000 个 Unicode 字符。只需使用脱字符符号（`^`）来反转字符类。它会反转符号后指定的字符甚至是一个范围。我们在反向字符类中使用\
  \ `[^\\d]` 来反转数字 0 到 9。然而，与其使用 `[^\\d]`，我们可以使用 `\\D` 来反转数字 0 到 9。下表描述了特殊的反向字符类：\n\
  \n    | 字符类 | 反向 | 含义 | 描述 |\n    | --- | --- | --- | --- |\n    | `\\d` | `\\D`\
  \ | `[^\\d]` | 匹配任何非数字字符 |\n    | `\\s` | `\\S` | `[^\\s]` | 匹配任何非空白字符 |\n    |\
  \ `\\w` | `\\W` | `[^\\w]` | 匹配任何非“单词”字符 |\n\n6. **Unicode 字符类：** Unicode 是“所有”现有字符的定义，Unicode\
  \ 标准为每个平台无关的字符分配了唯一的数字。这个星球上有超过 100,000 个字符，每个字符都被指定为一个字符点。然而，某些字符被分组了。\n\n    这种语法匹配一个分组中的单个字符。如果我们需要匹配特定字符以外的任何内容，请使用匹配\
  \ `\\P{…任意字符…}` 表达式。\n\n### 正则表达式中的量化符\n\nPerl 具有几种正则表达式量化符，它们可以决定特定字符在匹配之前可以重复的次数。这主要用于待匹配字符数量不确定的情况。\n\
  \n### Perl 量化符分为六类，列下所示：\n\n1. `*` = 表示该组件必须出现零次或多次。\n2. `+` = 表示该组件必须出现一次或多次。\n\
  3. `?` = 指定该组件必须出现零次或一次。\n4. `{n}` = 指定该组件必须存在 n 次。\n5. `{n,}` = 指定该组件必须至少出现 n 次。\n\
  6. `{n, m}` = 指定该组件必须出现至少 n 次且不超过 m 次。\n\n### 量化符表\n\n上述所有类型可以使用此表理解，该表包含了正则表达式量化符和示例。\n\
  \n| 正则表达式 | 示例 |\n| --- | --- |\n| `/Bx*B/` | BB, BxB, BxxB, BxxxB, ….. |\n| `/Bx+B/`\
  \ | BxB, BxxB, BxxxB, ….. |\n| `/Bx?B/` | BB, BxB |\n| `/Bx{1, 3}B/` | BxB, BxxB,\
  \ BxxxB |\n| `/Bx{2, }B/` | BxxB, BxxxB, ….. |\n| `/Bx{4}B/` | BxxxxB |\n\n让我们看看这些量化符的一些示例。\n\
  \n**第一个示例：** 在此示例中，`*` 量化符被用于正则表达式 `/Pe*ks/`，它产生“Pks”、“Peks”、“Peeks”……等等，并与输入文本“Pks”匹配，匹配成功。\n\
  \n**第二个示例：** 在此示例中，`+` 量化符被用于正则表达式 `/Pe+ks/`，它产生“Peks”、“Peeks”、“Peeks”……等等，并与输入文本“Pks”匹配，匹配失败。\n\
  \n**第三个示例：** 在此示例中，`?` 量化符被用于正则表达式 `/Pe?ks/`，它产生“Peks”或“Pks”，并与输入文本“Peks”匹配，匹配失败。\n\
  \n**第四个示例：** 在此示例中，`{n}` 量化符被用于正则表达式 Pe{2}ks，它产生“Peeks”，并与输入文本“Peeks”匹配，匹配成功。\n\n\
  **第 5 个示例：** 在此示例中，`{n, }` 量化符被用于正则表达式 `/Pe{2, }ks/`，它产生“Peeks”、“Peeeks”、“Peeeeks”等等，当与输入文本“Peks”匹配时，返回匹配失败。\n\
  \n**第六个示例：** 在此示例中，`{n, m}` 量化符被用于正则表达式 `/Pe{1, 2}ks/`，它产生“Peks”和“Peeks”，并与输入文本“Peeks”匹配，匹配失败。\n\
  \n\n\n\n\nPerl 中的正则表达式（也称为 regexes、regexps 或 REs）是一种表示一组字符串的方法，无需在程序中描述所有的字符串。它本质上是一系列用于模式匹配的字符。正则表达式在\
  \ Perl 中有多种用途：\n\n* 首先，它们用于条件判断，以评估字符串是否匹配特定模式。\n\n  **例如：** 条件中的正则表达式\n  ```perl\n\
  \  #!/usr/bin/perl # Regular expressions in the Conditionals # Program to determine\
  \ whether string # matches particular pattern \n  print \"How are you feeling?\\\
  n\"; my $stmt = <>; print($stmt); if ($stmt == /hungry/) { print \"\\n What do we\
  \ wish to have?\\n\"; my $ip = <>; print($ip); }\n  ```\n  在这里，会匹配用户的输入；如果包含了单词“hungry”，即如果条件为真，它将打印“What\
  \ do we wish to have?”。否则，将跳转到下一个条件或语句。\n\n* 其次，它们可以在字符串中找到模式并将其替换为其他内容。\n\n  **例如：**\
  \ 替换运算符\n  ```perl\n  #!/usr/bin/perl # Regular expressions in the Substitutions\
  \ # Program to determine whether string # matches particular pattern and replaces\
  \ it \n  print \"Whats your thought on life\\n\"; my $stmt = <>; print ($stmt);\
  \ # Substitution using the regex $stmt =~ s/worst/good/; print (\"\\n$stmt\");\n\
  \  ```\n  前面的代码使用了“good”代替了“worst”。\n\n* 最后，模式不仅可以描述某个存在的地方，还可以描述它不存在的地方。因此，`split`运算符使用正则表达式来识别数据不存在的地方。换句话说，正则表达式指定了分隔数据字段的分隔符。\n\
  \n  **例如：** Split 运算符\n  ```perl\n  #!/usr/bin/perl # Program to illustrate the\
  \ # use of split function \n  $var1 = \"Birth\"; $var2 = \"Life\"; $var3 = \"Death\"\
  ; # Using split function \n  my ($var1, $var2, $var3) = split(/, /, \"sab, mohmaya,\
  \ hai\"); print($var1); print($var2); print($var3);\n  ```\n  在上面的示例中，`split` 函数匹配单个逗号字符。\n\
  \n## 回溯 (BACKTRACKING)\n\n回溯是正则表达式匹配的另一个关键方面，现在（当需要时）被所有非占有表达式量词使用，即 `*`、`*?`、`+`、`+?`、`{n,\
  \ m}` 和 `{n, m}?`。回溯内部经常会被优化，但上述概念是正确的（它从可能性树上的失败递归中返回）。当 Perl 尝试用正则表达式匹配模式且之前的尝试失败，或者当匹配模式被保存备以后用时，它就会回溯。\n\
  \n例如，`/.*?/` 可用于匹配类似于 HTML 标签的任何内容，如“Bold”。这强制模式的两个部分匹配同一个字符串，在本例中为“B”。\n\n考虑另一个示例\
  \ `/^ab*bc*d/`\n\n### 前面的正则可以解释如下：\n\n1. 从字符串开始处开始。\n2. 匹配一个“a”。\n3. 尽可能匹配多个“b”，即使没有匹配到任何一个也可以。\n\
  4. 尽可能匹配多个“c”，即使没有匹配到任何一个也可以。\n5. 尽可能匹配多个“d”，虽然不需要全部匹配。\n\n### 正则表达式中的“e”修饰符\n\n\
  Perl 中的正则表达式允许我们使用适当的运算符对给定文本执行许多操作。这些运算符可以执行如字符串修改、替换其他子字符串等操作。在给定字符串中替换子字符串是通过\
  \ `s`（替换）运算符完成的，它接受两个操作数：要替换的子字符串和替换字符串。\n\n此外，`e` 修饰符用于将子字符串替换为要求值的正则表达式的替换字符串。`e`\
  \ 修饰符添加到替换表达式中。\n\n`e` 修饰符还可以与 `g`（全局）修饰符结合使用，以影响指定字符串中所有可能的子字符串。\n\n**第一个示例：**\
  \ 使用字符类替换\n```perl\n#!/usr/bin/perl # Defining string to be converted \n$String\
  \ = \"Peeks for Peeks is the best\"; print \"The Original String: $String\\n\";\
  \ # Converting string to UPPERCASE # using ’uc’ Function \n$String =~ s/(\\w+)/uc($1)/ge;\
  \ print\"Uppercased String: $String\\n\"; # Converting string to lowercase # using\
  \ ’lc’ Function \n$String =~ s/(\\w+)/lc($1)/ge; print\"Lowercased String: $String\\\
  n\";\n```\n上面的代码使用了字符类 `\\w`，它包含大小写字母和所有数字（a-z|A-Z|0-9）。这被用于通过单个替换操作替换整个字符串。\n\n\
  **第二个示例：** 使用单个字母或单词进行特定替换。\n\n更新后的字符串不会恢复到原始值，即使在第二次递归之后也是，如前面的代码所示。\n\n### 使用子程序执行替换操作\n\
  \nPerl 正则中的子程序替换也可以通过子程序完成，以消除为每个字符串重复编写替换正则的麻烦。这是通过将正则代码插入子程序并在需要时调用它来实现。\n\n当上述代码中的替换操作开始时，它会调用子程序\
  \ `change_substitution`，该程序包含了更改匹配搜索内容的子字符串的正则代码。\n\n##正则 “ee” 修饰符\n\nPerl 中的正则表达式允许你使用适当的运算符对给定文本执行许多操作。这些运算符可以执行如字符串修改、替换其他子字符串等操作。在给定字符串中替换子字符串是通过\
  \ `s`（替换）运算符完成的，它接受两个操作数：要替换的子字符串和替换文本。\n\n在 Perl 中，修饰符使用正则表达式通过指定模式匹配字符串。在 Perl\
  \ 中，`ee` 修饰符等同于 `\\e` 修饰符。它用于求值右侧字符串并进一步评估结果。在 Perl 中，它等同于双重 `eval` 运算符。`\\e` 运算符用于求值右侧字符串。`\\\
  ee` 快了一步。它在已经带有 `e` 修饰符的字符串上使用 `\\e` 运算符。\n\n`ee` 修饰符像 `e` 修饰符一样，可以与 `g`（全局）修饰符结合使用，应用于提供的字符串中所有可能的子字符串。\n\
  \n这是因为当应用 `e` 修饰符时，正则会将 RHS（右侧）视为用作替换的求值字符串；在这种情况下，RHS 是 `$1`，它保留 `$var` 但不是它的值。因此，应用\
  \ `ee` 修饰符将重新评估 RHS， RHS 包含了已求值的变量 `$var`。\n\n### 进行数学计算时，使用“ee”修饰符\n\n如果字符串中包含数学表达式，表达式的值将不会被求值，而是原样显示。这是因为它既被视为字符串又是待求值的表达式。\n\
  \n上述代码中的表达式是用正则表达式编写的，使用 `d+` 运算符编写一个或多个数字，使用 `[+*/]` 字符类表示运算符符号，然后是另一个 `d+` 表示数字。`ee`\
  \ 修饰符求值字符串并返回表达式的总和，通过 `$1` 运算符显示。\n\n上面的正则也可以保留在子程序中用于评估不同的表达式，而无需重写正则。\n\n在给定的代码可以使用单个正则利用子程序执行四次数学计算。\n\
  \n### 正则表达式中的 pos() 函数\n\nPerl 中的 `pos()` 函数返回使用 `m` 修饰符的正则中上一次匹配的位置。\n\n正则中的 `pos()`\
  \ 函数可以与字符类结合使用，返回给定字符串中所有必需子字符串的位置列表。要在整个文本中搜索子字符串，请结合全局运算符 `g` 和 `m` 修饰符使用。\n\n\
  \n\n\n\n### 第一个示例：使用子字符串\n```perl\n#!/usr/bin/perl\n# 打印子字符串位置程序\n$String = \"Peeks\
  \ For Peeks\";\nprint\" Position of ’P’ in string:\\n\";\n# 使用 m 修饰符查找\n# 子字符串的正则表达式\n\
  while($String =∼ m/G/g) {\n# 使用 pos() 函数查找\n### 子字符串的位置\n$position = pos($String);\n\
  print \"$position\\n\";\n}\n```\n\n### 第二个示例：使用字符类\n```perl\n#!/usr/bin/perl\n#\
  \ 打印子字符串位置程序\n$String = \"Peeks For Peeks\";\nprint \"Position of all the Uppercase\
  \ characters:\\n\";\n### 使用字符类查找\n# 所有的大写字母\n### 使用正则表达式\nwhile($String =∼ m/[A-Z]/g)\
  \ {\n# 使用 pos() 函数查找\n### 子字符串的位置\n$position = pos($String);\nprint \"$position,\
  \ \";\n}\nprint \"\\nThe Position of all Lowercase characters:\\n\";\n### 使用字符类查找\n\
  # 所有的小写字母\n### 使用正则表达式\nwhile($String =∼ m/[a-z]/g) {\n# 使用 pos() 函数查找\n### 子字符串的位置\n\
  $position = pos($String);\nprint \"$position, \";\n}\n```\n\n### 第三个示例：空格的位置\n```perl\n\
  #!/usr/bin/perl\n# 打印子字符串位置程序\n$String = \"Peeks For Peeks\";\n### 使用正则表达式查找\n#\
  \ 所有的空格\nwhile($String =∼ m/\\s/g) {\n# 使用 pos() 函数查找\n### 子字符串的位置\n$position =\
  \ pos($String);\nprint \"$position\\n\";\n}\n```\n\n### 要从指定位置开始匹配，请使用 \\G 断言\n\
  在 Perl 正则中，`\\G` 断言用于匹配以 `pos()` 函数指定的字符为起点，并以正则表达式指定的匹配字符为结束的子字符串。它将返回由 `m` 修饰符指定的字符的第一次出现的位置。\n\
  \n在前面的示例中，匹配的子字符串的第一次出现的位置将与剩余字符串一起打印。如果我们需要为匹配字符的下一次出现重置计数位置，只需将剩余字符串存储在默认字符串的\
  \ `$1` 中即可。\n\n## 正则表达式速查表\n正则表达式是 Perl 编程的重要组成部分。它用于查找指定的文本模式。一组字符组成了搜索模式。它也被称为\
  \ regexp。当用户学习正则表达式时，可能需要快速回顾不经常使用的概念。因此，创建了一个包含正则表达式中使用的各种类、字符、修饰符等的正则表达式速查表，以提供此类服务。\n\
  \n### 字符类\n为了匹配字符字符串，使用了字符类。这些类允许用户匹配任何用户预先未知的的字符范围。\n\n| 字符类 | 解释 |\n| --- | ---\
  \ |\n| `[abc.]` | 它仅包含指定的字符之一，即“a”、“b”、“c”或“..”。 |\n| `[a-j]` | 它包含从 a 到 j 的所有字符。\
  \ |\n| `[a-z]` | 它包含从 a 到 z 的所有小写字母。 |\n| `[^az]` | 它包含 a 和 z 之外的所有字符。 |\n| `\\\
  w` | 它包含所有类似 `[a-z, A-Z, 0-9]` 的字符。 |\n| `\\d` | 它匹配数字如 `[0-9]`。 |\n| `[ab][^cde]`\
  \ | 它匹配字符 a 和 b 后面不紧跟 c、d 和 e。 |\n| `\\s` | 它匹配 `[\\f\\t\\n\\r]`，即换页符、制表符、换行符和回车符。\
  \ |\n| `\\W` | `\\w` 的补集。 |\n| `\\D` | `\\d` 的补集。 |\n| `\\S` | `\\s` 的补集。 |\n\n\
  ### 锚点\n锚点不对应任何字符。相反，它们对应特定的位置，如字符之前、之后或之间。\n\n| 锚点 | 解释 |\n| --- | --- |\n| `^`\
  \ | 匹配字符串的开头。 |\n| `$` | 匹配字符串的结尾。 |\n| `\\b` | 匹配从 `\\w` 到 `\\W` 的单词边界。 |\n| `\\\
  A` | 匹配字符串的开头。 |\n| `\\Z` | 匹配字符串的结尾或换行符之前。 |\n| `\\z` | 仅在字符串末尾匹配。 |\n| `\\G` |\
  \ 在指定的位置 `pos()` 匹配。 |\n| `\\p{….}` | Unicode 字符类，如 `IsLower`、`IsAlpha` 等。 |\n|\
  \ `\\P{….}` | Unicode 字符类的补集。 |\n| `[:class:]` | POSIX 字符类，如 digit、lower、ascii 等。\
  \ |\n\n### 元字符\n元字符在 Perl 正则中用于匹配模式。必须避免直接使用所有元字符。\n\n| 字符 | 解释 |\n| --- | --- |\n\
  | `^` | 检查字符串的开头。 |\n| `$` | 检查字符串的结尾。 |\n| `.` | 换行符以外的任意字符。 |\n| `*` | 匹配 0 次或多次。\
  \ |\n| `+` | 匹配 1 次或多次。 |\n| `?` | 匹配 0 次或 1 次。 |\n| `()` | 用于分组。 |\n| `\\` | 用于转义。\
  \ |\n| `[]` | 用于字符集。 |\n| `{}` | 用于重复。\n\n### 量词\n量词用于指定匹配的次数。\n\n| 符号 | 解释 |\n\
  | --- | --- |\n| `?` | 匹配 0 次或 1 次。 |\n| `+` | 匹配 1 次或多次。 |\n| `*` | 匹配 0 次或多次。\
