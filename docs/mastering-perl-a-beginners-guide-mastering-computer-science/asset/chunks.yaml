    Statement of if else if.


    ### unless Statement


    If condition is false, the statements will execute. In a boolean context, the
    number `0`, the empty string `""`, the character `"0"`, the empty list `()`, and
    `undef` are all false, whereas all other values are true.


    **Flowchart:**


    ![](images/ufig4_5.jpg)


    Unless statement.


    ### unless else Statement


    When the boolean expression is true, the except statement is followed by an optional
    else statement.


    **Flowchart:**


    ![](images/ufig4_6.jpg)


    Unless else Statement.


    ### unless elsif Statement


    The unless and an optional elsif can follow statement...else statement, which
    allows us to test many conditions with a single unless...elsif statement.


    **Remember the following:**


    Unless statements can have any number of elsifs, and all of them must appear before
    the else.


    Unless statements can have zero or one else’s, and they must appear after any
    elsif statements.


    When an elsif succeeds, none of the other elsif’s or elses are tried.


    **Flowchart:**


    ![](images/ufig4_7.jpg)


    Statement of unless elsif.


    ## LOOPS IN PERL


    In programming languages, looping is a feature that allows the execution of a
    collection of instructions or functions repeatedly while some condition is true.
    Loops make the job of the coder easier. Perl supports many forms of loops to handle
    conditional situations in programs. Perl’s loops are discussed below.


    ### for Loop


    The “for” loop is a shorthand means of expressing the loop structure. Unlike a
    while loop, a for statement consumes the setup, condition, and increment/decrement
    on a single line, resulting in a shorter, easier to debug looping structure.


    **Flowchart:**


    ![](images/ufig4_8.jpg)


    for loop in Perl.


    A for loop operates on a predefined control flow. The following factors influence
    control flow:


    * `init statement`: The init statement is the initial statement that is performed.
    In this stage, we set up a variable to control the loop.

    * `condition`: The specified condition is assessed in this stage, and the for
    loop is executed if it is True. Because the condition is verified before the loop
    statements are executed, it is also an entry control loop.

    * `Statement execution`: When the condition is true, the statements in the loop
    body are performed.

    * `increment/decrement`: The loop control variable is incremented or decremented
    here to update the variable for the next iteration.

    * `Loop termination`: When the condition is met, the loop terminates, indicating
    the end of its life cycle.


    ### foreach Loop


    A foreach loop iterates over a list, and the variable stores the values of the
    list’s items one at a time. It is mainly utilized when we have a collection of
    data in a list and wish to iterate through the list’s elements rather than its
    range. The loop performs the iteration of each element automatically.


    ### while Loop


    A while loop typically accepts an expression enclosed in parentheses. If the expression
    is True, the code within the while loop’s body is performed. A while loop is used
    when we don’t know how many times we want the loop to be performed but know the
    loop’s termination condition. Because the condition is verified before performing
    the loop, it is also known as an entry controlled loop. The while loop is similar
    to a loop if statement.


    ### Infinite While Loop


    A while loop can continue indefinitely, which means it has no end condition. In
    other words, some circumstances remain true, causing the while loop to continue
    endlessly or never finish.


    **Example:** The following application will print the provided statement indefinitely
    and display the runtime error Output Limit Exceeded on the online IDE.


    ### do...while loop


    The only difference between a do...while loop and a while loop is that the do...while
    loop is executed at least once. After the initial execution, the condition is
    verified. When we want the loop to execute at least once, we use a do...while
    loop. Because the condition is verified after performing the loop, it is also
    known as an exit controlled loop.


    ### until Loop


    The inverse of the while loop is the until loop. It accepts a condition in the
    parenthesis and only runs until it is false. It essentially repeats an instruction
    or sequence of instructions until the condition is FALSE. It is also an entry
    controller loop, which means that the condition is tested first, and then a sequence
    of instructions within a block is executed.


    ### Nested Loops


    A nested loop is a loop that is contained within another loop. Perl programming
    also supports nested loops. All of the loops listed above can also be nested.


    Perl syntax for several nested loops:


    * **Nested for loop**: `for (init statement; condition; increment/decrement )
    { for (init statement; condition; increment/decrement ) { # Code Executed } }`

    * **Nested foreach loop**: `foreach variable_1 (@array_1) { foreach variable_2
    (@array_2) { # Code Executed } }`

    * **Nested while loop**: `while (condition) { while (condition) { # Code Executed
    } }`

    * **Nested do...while loop**: `do{ do{ # Code Executed }while(condition); }while(condition);`

    * **Nested until loop**: `until (condition) { until (condition) { # Code Executed
    } }`


    ## given-when STATEMENT


    In Perl, a given-when statement replaces lengthy if statements that compare a
    variable to numerous integral values.


    * The given-when statement is a branch statement with many options. It allows
    us to easily route execution to various areas of code based on the value of the
    expression.

    * A control statement is provided that allows a value to alter execution control.


    The switch-case in Perl is analogous to the switch-case in C/C++, Python, or PHP.
    It, too, substitutes numerous if statements with distinct cases, much like the
    switch statement.[²](#chapter4.xhtml_en4_2)


    given-when statements also include two extra keywords, `break` and `continue`.
    These keywords keep the program flowing and aid in exiting the program or skipping
    execution at a certain value.


    **break:** The `break` keyword is used to exit a when block. There is no need
    to explicitly express the `break` after every when the block in Perl. It is already
    implicitly defined.


    **continue:** On the other hand, if the first when the block is correct, `continue`
    proceed to the next when block.


    A conditional statement in a given-when statement must not be repeated in multiple
    when statements since Perl only checks for the first occurrence of that condition
    and the subsequent repeating statements are disregarded. Furthermore, a default
    statement must be placed after all when statements since the compiler checks for
    condition matching with each when statement in order, and if we insert default
    in between, it will take a break and print the default statement.


    ### Nested given-when Statement


    given-when nested statement refers to given-when statements that are included
    within other given-when statements. This may be used to keep a hierarchy of user-supplied
    inputs for a given output set.

