  trans: '

    如果我们想在科技领域工作，就应该学习 Perl。那些使用 Perl 构建系统管理流程、网络程序和网站的公司都需要 Perl 开发者。Amazon、Roblox、Venmo
    和 MIT 都是这些公司中的成员。Perl 专家担任解决方案工程师、软件工程师、Web 开发人员和数据库工程师等职位。如果我们想在科技行业担任编码员或系统管理员，Perl
    是完善我们对当前技术理解的极佳方式。


    ## 为什么我们需要学习 Perl？


    我们应该学习 Perl 的原因如下：


    Perl 是一门非常出色的通用编程语言。Perl 被广泛应用于许多领域，包括数据库管理、Web 开发、系统管理和网络编程。


    Perl 的使用方式非常新颖。生物信息学程序员编写软件来理解生物学数据集。不断发展的基因组学领域利用了生物信息学领域的专业知识。我们可以使用 Perl 获取基因序列并研究群体遗传学。


    Perl 基于语言学概念，直到今天仍然是一门优秀的文本处理语言。人们会被正则表达式（Regex）、HTML 解析和 JSON 操作。Perl 还可以用于实现语言处理功能，如语音识别和文本转语音翻译。通过广泛使用的测试一切协议（`TAP`），你还可以使用
    Perl 自动测试应用程序。


    总之，掌握 Perl 将为我们的 Web 开发职业提供有趣的选择。Perl 编码员的需求量很大。一旦我们掌握了 Perl，就可以利用它来驱动自己的项目或寻找工作。根据
    TIOBE 指数（一个根据搜索引擎结果评估编程语言流行程度的网站），Perl 目前在 50 种编程语言中排名第 17 位。


    该指数整合了 25 个搜索引擎的结果。它统计了特定编程语言的点击次数，并根据点击次数来确定该语言在索引中的排名。这结合提及 Perl 的职位发布频率等数据表明，虽然
    Perl 目前不是最流行的编程语言，但它仍在使用中，因此是一项值得获得的人才技能。


    LinkedIn 上有超过 15,000 个包含 Perl 的职位，Glassdoor 上有超过 10,000 个。即使 Perl 现在可能不是最流行的编程语言，但公司继续使用它来运行其
    Web 业务，并继续寻找具备这一技能组合的人。


    ## 学习 Perl 需要多长时间？


    给自己三个月时间学习基础知识并开始编写程序。这假设我们每天花一小时学习这门语言。


    这一估计基于这样一个事实：学习 Python 基础大约需要八周，Python 是另一种与 Perl 同时期出现（1991 年）的脚本语言，并用于许多类似的任务。


    然而，一个显著的区别是，Python 的设计目标是让执行任务的方法有限，而 Perl 的设计哲学是“一件事有多种方法”（There’s more than
    one way to do it）。这意味着我们可能需要花更多时间学习 Perl 的基础。


    ## Perl 难吗？


    对于初学者来说，Perl 可能具有挑战。另一方面，拥有其他脚本语言经验可以缩短学习曲线。如果我们有一些 Python 经验，学习 Perl 将变得简单。


    我们必须安装软件并与命令行交互以开始学习 Perl。如果我们以前从未这样做，请在学习 Perl 语法之前先完成。Perl Learn 为所有平台提供了直接的安装说明。


    ## Perl 调试器的断点


    在 Perl 中控制程序执行是通过指示调试器执行到程序中的特定点，该点被称为断点（breakpoint）来实现的。断点允许用户对程序进行分段并搜索错误。


    以下调试器命令用于创建此类断点，以及执行到到达断点为止的命令。


    ### b 命令


    `b` 命令用于在程序中设置断点。此命令指示调试器每当执行到特定行时停止程序。


    例如，以下命令指示调试器在即将执行第 12 行时停止：

    ```

    DB<13> b 12

    ```

    （如果该行不可断开，调试器将返回第 12 行不可设置断点。）


    程序可以有无限数量的断点。当调试器准备执行包含包含断点的语句时，程序将停顿。


    `b` 命令也接受子程序名：

    ```

    DB<15> b valuedir

    ```

    这会在子程序 `valuedir` 的第一个可执行语句处设置一个断点。


    `b` 命令还可以只在满足特定条件时才停止程序。


    例如，以下命令指示调试器在即将执行第 12 行且变量 `$vardir` 等于空时停止：

    ```

    DB<15> b 12 ($vardir eq "")

    ```

    `b` 语句可以用于指定任何合法的 Perl 条件表达式。


    可以在多行语句的任何一行上设置断点。


    例如：

    ```

    16: print ("Peeks", 17: " for Peeks here");

    ```

    第 16 行可以作为断点，但第 17 行不行。


    ### c 命令


    `c` 命令指示调试器继续调试，直到到达断点或程序结束。


    当调试器即将到达设置了断点的第 12 行时，程序停止并显示该行，因为调试器总是显示即将执行的行行。


    调试器在此处生成一个另一个调试命令的提示符。该提示符允许我们通过输入 `n` 或 `s` 来逐语句地继续执行过程，通过输入 `c` 继续执行过程，通过输入
    `b` 设置更多断点，或执行任何其他调试操作。


    可以使用 `c` 命令和行号设置临时（仅限一次）的断点：

    ```

    DB<15> c 12 main::(debugtest:12): &readsubdirs($vardir);

    ```

    `c` 命令的参数 12 指示调试器在第 12 行设置一个临时断点，然后继续执行。当调试器到达第 12 行时，它会停止执行过程，显示该行并移除断点。


    `c` 命令用于在人们想要跳过几行代码而不通过逐语句执行程序来浪费执行时间时定义临时断点。使用 `c` 还避免了使用 `b` 定义断点然后用 `d` 命令将其删除的需要。


    ### L 命令与断点


    第 4–8 行已经执行，并且在第 11 行设置了断点。（不包括第 7 行，因为它是注释。）通过检查紧随在断点之后的条件表达式，可以将断点与已执行的行区分开来。在这种情况下，条件表达式设置为
    `(1)`，表示该断点始终有效。


    ### d 和 D 命令


    当断点的工作完成后，可以使用 `d` 命令将其删除。


    前一个命令指示调试器移除在第 12 行设置的断点。


    如果没有指定要删除的断点，调试器会假设下一要执行的行有一个断点并自动删除它。


    由于第 12 行是下一个执行的行，调试器会自动移除第 12 行的断点。


    `D` 命令用于移除程序的所有断点。


    上述命令移除所有通过 `b` 命令设置的断点。


    ### 退出脚本


