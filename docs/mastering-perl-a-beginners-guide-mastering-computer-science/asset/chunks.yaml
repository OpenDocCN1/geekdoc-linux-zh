    \ IN OOPs\n\nOverriding is a feature of any object-oriented computer language\
    \ that allows a subclass or child class to implement a method that already exists\
    \ in one of its superclasses or parents. When a subclass method has the same name,\
    \ arguments or signature, and return type (or sub-type) as a method in its superclass,\
    \ the subclass method is said to override the superclass method.\n\nMethod overriding\
    \ signifies that the code consists of two or more methods with the same name,\
    \ each of which has unique purpose and differs from the others. Thus, the literal\
    \ definition of the term indicates that one approach must take precedence over\
    \ another. This idea refers to redefining a base class method in a derived class\
    \ with the same method signature.\n\nMethod overriding is one manner in which\
    \ Runtime Polymorphism is achieved in Perl. The version of a method that is run\
    \ is dependent upon the object that invokes it. If object of the parent class\
    \ is used to call the method, the version in the parent class will run; however,\
    \ if an object of the subclass is used, the version in the child class will execute.\
    \ In other words, the type of the object being referenced decides which version\
    \ of an overridden method will be performed, not the type of the reference variable.\n\
    \nMethod overriding in Perl is best shown with the following example.\n"
  raw: 'The shift keyword transfers the package name from the default array “@_” to
    the bless function. The bless method returns a reference that eventually becomes
    an object. And lastly, the constructor will return an instance of the Employee
    class. The most important aspect is how to initialize an object. It may be accomplished
    as follows: $object = new Employee(1, "Peeks", "forPeeks");


    In this case, $object is a scalar variable that refers to the hash defined in
    the constructor.


    The following is an example program for creating and implementing objects in OOPs:
    use strict; use warnings; # class with the name Employee package Employee; # constructor
    with name new sub new { # shift will take package name # and assign it to the
    variable ’class’ my $class = shift; # defining hash reference my $self = { _serialNum
    => shift, _firstName => shift, _lastName => shift, }; # Attaching object with
    the class bless $self, $class; # returning the instance of class Employee return
    $self; } # Object creation of class my $object = new Employee(1, "Peeks", "forPeeks");
    # object here is a hash to reference print("$object->{_firstName} \n"); print("$object->{_serialNum}
    \n");


    An object in Perl functions in the same way that it does in other languages, such
    as C++ and Java. The above program demonstrates the procedure of an object in
    Perl, including its creation and use in a class.


    ## METHODS IN OOPs


    Methods are used to access and alter an object’s data. These are the entities
    that may be called via class or package objects. Methods in Perl are just subroutines;
    they have no unique identity. A method’s syntax is identical to that of a subroutine.
    Methods, like subroutines, are specified using the sub keyword. As its first parameter,
    the method accepts an object or the package on which it is called.


    OOPs employ these methods to change the object’s data and not to interact with
    the object directly; this is done to ensure the data’s security by preventing
    the programmer from directly altering the object’s data. Various helper methods
    that accept the object as an argument and save its value in another variable make
    this possible. Additionally, adjustments are made to the second variable. These
    changes do not affect the object’s data, making it more secure.


    ### Types of Methods in Perl


    Based on the inputs given, methods in Perl may be divided into two categories:
    static and virtual methods.


    A static method is one where the method’s first parameter is the class name. The
    functionality of a static method is applied to the whole class since it accepts
    the class’ name as an argument. These are also known as class methods. Since most
    methods belong to the same class, it is unnecessary to supply the class name as
    an argument. Example: A class’ constructors are considered static methods.


    Virtual method is one in which the object reference is supplied as the function’s
    first parameter. The first parameter of a virtual function is relocated to a local
    variable and then utilized as a reference.


    In OOP, methods require parentheses to hold the arguments, and these methods are
    invoked with an arrow operator (->).


    ### get-set Methods


    Methods are used to secure an object’s data and are thus used with either the
    object’s reference or the value is stored in another variable and then used. In
    OOPs, get-set methods are used to provide data security to objects. The get-method
    is used to retrieve the object’s current value, while the set value method assigns
    a new value to the object.


    ## CONSTRUCTORS AND DESTRUCTORS


    We will explain constructors and destructors with examples.


    ### Constructors


    Constructors in Perl subroutines return an instance of the class as the returned
    object. In Perl, the constructor is usually referred to as “new.” Unlike many
    other OOP languages, Perl has no particular syntax for object construction. It
    utilizes data structures (hashes, arrays, scalars) that have been expressly connected
    with the class. On hash reference and the class name, the constructor calls the
    “bless” method (the name of the package).[¹](#chapter7.xhtml_en7_1)


    Let’s develop some programs for better explanations.


    Note: Due to the use of packages, the following code will not execute on online
    IDE. The following text represents a Perl class or module file. Save the file
    with the extension (*.pm).


    The package name “Area” is stored in default array “@_” when the constructor method
    is called. The keyword “shift” is used to extract the package name from “@_” and
    pass it to the “bless” function.


    In Perl, attributes are stored as key-value pairs in a hashed reference. Additionally,
    some attributes are being added to the code.


    The (Area Class) code above has two attributes: length and width. Another Perl
    program is designed to use these attributes to gain access to them.


    **How to run the code:**


    *   Save the Program with Package Area as Area.pm in a text file.


    *   Note: The file’s name should always be the same as the package’s name.


    *   Save the program that is used to access the attributes defined in the package
    as *.pl. * can be any name here (In this case, it is test.pl).


    *   Use the command perl test.pl to run the code saved as test.pl in the Perl
    command line.


    ### Passing Dynamic Attributes


    Adding Dynamic attributes to existing files:


    **Program: Areas.pm** package Area; sub new { my ($class, $args) = @_; # since
    values will be # passed dynamically my $self = { length => $args->{length} ||
    1, # by default value is 1 (stored) width => $args->{width} || 1, # by default
    value is 1 (stored) }; return bless $self, $class; } # we have added get_area
    function to # calculate area as well sub get_area { my $self = shift; # getting
    area by multiplication my $area = $self->{length} * $self->{width}; return $area;
    } 1;


    **Program: test.pl** use strict; use warnings; use feature qw/say/; use Area;
    # pass length and width arguments # to constructor my $area = Area->new( { length
    => 2, # passing ’2’ as param of the length width => 2, # passing ’2’ as param
    of the width }); say $area->get_area;


    ### Destructors


    When all references to object are removed from scope, Perl automatically calls
    the destructor method. Destructor methods are useful if the class generates threads
    or temporary files that must be removed when the object is destroyed. Perl has
    a special method name for the destructor, “DESTROY,” which must be used when declaring
    the destructor.


    ## METHOD OVERRIDING IN OOPs


    Overriding is a feature of any object-oriented computer language that allows a
    subclass or child class to implement a method that already exists in one of its
    superclasses or parents. When a subclass method has the same name, arguments or
    signature, and return type (or sub-type) as a method in its superclass, the subclass
    method is said to override the superclass method.


    Method overriding signifies that the code consists of two or more methods with
    the same name, each of which has unique purpose and differs from the others. Thus,
    the literal definition of the term indicates that one approach must take precedence
    over another. This idea refers to redefining a base class method in a derived
    class with the same method signature.


    Method overriding is one manner in which Runtime Polymorphism is achieved in Perl.
    The version of a method that is run is dependent upon the object that invokes
    it. If object of the parent class is used to call the method, the version in the
    parent class will run; however, if an object of the subclass is used, the version
    in the child class will execute. In other words, the type of the object being
    referenced decides which version of an overridden method will be performed, not
    the type of the reference variable.


    Method overriding in Perl is best shown with the following example.'
