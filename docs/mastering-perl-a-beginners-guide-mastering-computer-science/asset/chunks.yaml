  trans: "\n\n| 函数不能更改实际参数的值。 | 子程序可以更改实际参数的值。 |\n| 函数产生可预测的结果，且没有副作用。 | 此类限制并不限制子程序。\
    \ |\n\n### Perl 用于的十大编程任务\n\n*   **云数据管理：** 这是一个陈词滥调，但也是事实：所有企业已经拥抱了云，或者正在采纳云的过程中。我们是否需要访问公云中的数据，但又不想使用云厂商专有的\
    \ `CLI` 工具或 Web 界面？有一个 Perl 模块可以实现这一功能。\n实际上，Perl 可以轻松地与所有主要的云服务交互，帮助您进行数据管理：\n\
    \  * Perl 可用于与 AWS S3 存储桶进行交互。\n  * 也有第三方 Perl 工具程序用于管理 `Azure Blob` 存储。\n  *\
    \ Perl 还支持 `Google Cloud Storage`。\n\n*   **Perl 用于管理云虚拟机：** Perl 也可以用于管理运行在公有云或私有云上的虚拟机。例如：\n\
    \  * `Net::Amazon::EC2` 的 `Query API` 提供了一个连接到亚马逊弹性计算云 (`AWS EC2`) 的 Perl 接口。\n\
    \  * 同样，VMware 的 `vSphere Perl SDK` 允许您在任何环境中管理 VMware 虚拟机。然而，由于 `vSphere` 是创建私有云的流行方法，Perl\
    \ 可能是控制它们的必不可少的工具。\n  * 虽然我们尚未发现任何与 `Azure` 或 `Google Cloud Platform` 虚拟机服务交互的预构建\
    \ Perl 解决方案，但没有理由这样做。\n\n*   **Perl 是一种用于提供网页服务的编程语言：** 您是否需要一个轻量且易于适配的 Web 服务器？用\
    \ Perl 大约 200 行代码就能编写一个。尽管 Perl 版本可能不太用于常规的生产工作负载，但一个极简的基于 Perl 的 Web 服务器对于硬件资源极低的系统（例如物联网\
    \ (IoT) 部署中的系统）是非常出色的。或者，如果我们只是想更多地了解 Web 服务器运行原理的基础，研究 Perl 代码可能会很有帮助。\n\n* \
    \  **Perl 用于语音识别：** 语音识别是各种应用程序（包括虚拟助手和聊天机器人）中一项复杂但日益重要的能力。Perl 在这也可以提供帮助。\n我们可以利用诸如\
    \ `Google::Cloud::Speech` 等 Perl 模块（该模块提供了 Google 的 `Cloud Speech API` 接口），使用户能够通过语音命令提交数据，或者仅为音频文件构建文本转录。\n\
    虽然 `Google Cloud` 的 API 承担了大部分重量工作，但 Perl 提供了一个与其交互的简单接口，减少了学习和处理专有的、厂商特定 API\
    \ 的需求。当然，我们还可以使用成上万个额外的 Perl 模块来帮助构建我们的应用程序。\n\n*   **Perl 中的文本转语音翻译：** Perl 与语音识别一样，利用\
    \ Google 的翻译服务将文本转换为语音，从任何语言的文本创建语音。尽管文本转语音可能没有语音转文本那样令人兴奋，但它可能帮助我们为应用程序添加实用功能，例如用于无障碍的屏幕阅读、实现多任务处理，或仅仅辅助教授新语言。\n\
    \n*   **用于软件测试的 TAP：** 如果我们希望连续、自动地发布软件，我们必须同样以连续、自动的方式对其进行测试。Perl 拥有多种顶级的测试方法，从最知名且最常用的任何测试协议（Test\
    \ Anything Protocol，通常被称为 `TAP::Harness`）。\nTAP 本质上在 Perl 测试模块之间提供了一个基于文本的接口。尽管如此，它仍然非常可靠且易于使用，现在在\
    \ C、C++、Python、PHP、Perl、Java、JavaScript 等语言中都有实现。\n\n*   **使用它执行系统管理任务：** Perl\
    \ 长期以来 Unix/Linux 环境中非常重要，管理员经常使用它来编写典型的系统管理任务脚本。然而，Perl 对以 Windows 为中心的系统也有帮助。Perl\
    \ 允许我们处理 `Active Directory` 甚至 Windows 注册表。我们需要跟踪用户计算机上安装的软件吗？或者是否应该在系统启动时执行定期的更新/维护？Perl\
    \ 可能是在 Windows 和 Linux 上编写此类管理操作的理想技术。\n\n*   **用于生物信息学的 BioPerl：** 虽然生物信息学不太可能大多数开发者\
    \ Perl 使用列表的顶端，但有一个名为 `BioPerl` 的社区致力于此。基于 Perl 的生物信息学和基因学解决方案涵盖了从基因序列到研究群体遗传学的范围。\n\
    \n*   **Perl 是日志管理的理想选择：** 由于现代计算机系统的分布以及它们结合许多不同类型组件的方式，现代日志管理已变成了一门科学。Perl 有助于与大多数日志管理解决方案交互，从\
    \ `syslog` 等标准到 `Papertrail` 这样的专有系统。当然，我们可以开发自己的 Perl 脚本来聚合和解析日志，这在需要完全自定义的日志管理解决方案的情况下非常方便。\n\
    \n*   **Perl 擅长文本处理：** 文本处理作为 Perl 最常见的应用，这并不令人意外。三十多年来，Perl 一直一直是正则表达式、HTML 解析和\
    \ JSON 操作的首选语言。没有其他编程语言比 Python 提供更有效或更易于使用的文本处理功能。丰富的 Perl 社区模块可以帮助几乎任何涉及文本处理、提取和转换的任务。其中许多模块已经在我们的\
    \ Perl 文本处理环境中预编译，我们可以通过 `State Tool CLI` 免费下载和安装。\n\n# 参考文献\n\n1. Perl – 简介。[https://www.tutorialspoint.com/perl/perl_introduction.htm],\
    \ 访问日期为 2022 年 6 月 1 日。\n2. Perl. [https://www.techtarget.com/whatis/Perl], 访问日期为\
    \ 2022 年 6 月 1 日。\n\n"
