    ## Glob（通配）


    它返回匹配参数表达式的文件列表。此方法可以打印所有或特定扩展的文件。


    以下是使用文件通配（File Globbing）访问目录的一些示例。


    * 获取脚本所在的当前目录：


    ```perl

    #!/usr/bin/perl -w # 使用 glob 函数访问文件

    @files = glob(’*’); # 返回所有文件的列表

    foreach $file (@files) # 遍历所有文件

    { print $file. "\n"; # 打印所有文件

    }

    ```


    * 打开特定目录：


    ```perl

    #!/usr/bin/perl -w # 只打印不包含路径的文件

    use File::Basename; # 返回所有文件的列表

    @files = glob(’C:/Users/PeeksForPeeks/Folder/*’);

    foreach $file (@files) # 遍历所有文件

    { print basename($file), "\n"; # 打印所有文件

    }

    ```


    ## Hashbang 或 Shebang 行的使用


    实用实践语言中的提取与报告（Extraction and Reporting in Practice Language，通常被称为 Perl）是一种基于解释解释器的编程语言。在
    Linux 和 Mac OSX 等类 Unix 平台上运行 Perl 脚本时，Hashbang 或 shebang 行非常有用。Hashbang 行是 Perl
    程序的起始行，用作与 Perl 二进制文件的连接。它允许直接执行 Perl 脚本，而无需将文件作为输入传递给 Perl。在 Perl 中，Hashbang
    行看起来如下：`#!/usr/bin/perl`


    Hashbang 行之所以这样命名，是因为它以井号（`#`）开头，并以感叹号（`!`）结束。在 Perl 编程中，Hashbang 行非常重要。让我们开始使用这种
    Hashbang 行吧。


    **示例：** 假设我们有一个 Perl hello world 程序脚本，我们将在 Linux 系统的终端上运行它。


    在前面的代码中，终端首先运行 Perl，然后指示 Perl 运行代码脚本。如果在没有先运行 Perl 的情况下运行代码脚本，就会发生错误。


    尝试执行以下代码：`$ hello1.pl`


    我们使用的 shell 尝试解析文件中的命令。然而，它在 Linux/Unix 中无法定位 `print` 命令。因此，需要通知 shell 这是一个 Perl
    脚本。这时 Hashbang 的想法发挥作用了。Hashbang 通知终端该脚本。


    然而，在运行此代码之前，必须修改 shell 的路径以将当前目录添加到现有目录中。这可以通过运行以下命令实现：`$ PATH = $PATH:$(pwd)`


    当前工作目录将添加到 `PATH` 环境变量的目录列表中。


    然后，在 Perl 脚本文件 `hello1 .pl` 中，添加 Hashbang 行 `#!/usr/bin/perl`。此行始终添加到代码开头，即 Hashbang
    行是代码脚本的第一行。


    由于在脚本的第一行添加了 Hashbang 行 `#!/usr/bin/perl`，上面的代码能够正常运行且不产生错误。


    脚本在执行时是在当前 shell 环境中进行的。如果脚本以井号和感叹号（Hashbang）`#!` 开头，shell 将执行 Hashbang 行上指定路径的程序（在本例中为
    `/usr/bin/perl`），这是 Perl 编译器-解释器的默认位置。因此，Hashbang 行包含了 Perl 编译器-解释器的位置。


    当文件中没有 Hashbang 行且我们尝试在不显式执行 Perl 的情况下运行它时，就会出错。shell 认为脚本是用 Bash 编写的并尝试恰当地运行，这会导致错误。


    ## 有用的数学函数


    在 Perl 中，偶尔需要解决包含数学运算的某些表达式。这些数学过程可以使用几个内置函数执行。


    以下是一些用于数学运算的有用 Perl 函数：


    | 函数 | 说明 |

    | --- | --- |

    | `exp()` | 计算参数“e”的实数值值的幂。 |

    | `hex()` | 将指定的十六进制数（16 进制）转换为其十进制等效值（10 进制）。 |

    | `srand()` | 帮助 `rand()` 函数在每次程序执行时生成一个常量。 |

    | `sqrt()` | 计算数字的平方根。 |

    | `oct()` | 将提供的八进制值转换为其十进制等效值。 |

    | `rand()` | 返回从 0 到传递给它的正数值之间的随机小数，如果没有指定值，则返回 1。 |

    | `log()` | 返回传递给的值的自然对数。如果在未提供值的情况下调用，则返回 `$_`。 |

    | `int()` | 返回提供数字的整数部分。如果没有指定值，则返回 `$_`。 |

    | `sin()` | 用于计算 VALUE 或 `$_` 的正弦。如果未提供 VALUE。 |

    | `cos()` | 计算 VALUE 或 `$_` 的余弦。如果缺少 VALUE。 |

    | `atan2()` | 计算 -PI 到 PI 范围内 `Y/X` 的反正正切值。 |

    | `abs()` | 返回其参数的绝对值。 |


    ## 函数（Functions）与子程序（Subroutines）的区别


    当代码脚本规模增大时（即包含数百行代码），在 Perl 中处理将变得困难。Perl 为用户提供了函数和子程序的概念来规避这一挑战。为了使程序更具读性，函数和子程序将复杂/大型代码块分成更小、更简洁的部分。


    它们通过允许我们在程序中重用以前编写的代码，最小化了应用程序的大小和调试时间。Perl 函数和子程序在程序中用于重用代码。我们可以在整个程序中使用带有各种参数的函数。


    ### 到底什么是函数？


    函数接受几个输入，对它们执行操作，然后返回一个值。


    它可能包含在编程语言中，或由用户提供。在 Perl 中定义函数时，要指定名称和语句顺序。当我们以后想要进行计算时，可以通过名称 `call` 该函数。


    Perl 有几个真正的内置函数。`say` 是内置函数的一个示例。Perl 甚至允许我们创建自己的函数来协助完成所需的任务。


    ### 到底什么是子程序？


    子程序（或 `sub`）允许我们为部分代码命名，这样当我们想要再次使用它时，只需调用其名称即可。


    在编写 Perl 时，子程序从两个方面帮助我们我们：


    - 第一，它们允许我们在程序中重用代码，使更容易检测和纠正错误，并更快地构建应用程序。

    - 第二，它们使我们能够将代码组织成部分。每个子程序负责特定的任务。


    当把代码放置在 Perl 子程序中，有两种选择：


    - 当我们知道代码将用于某个要执行的计算或操作时。例如，当将字符串转换为特定格式或当将输入的数据记录转换为哈希表（hash）时。

    - 当我们想要将程序的逻辑组件分成部分以便更容易理解时。


    下表比较了函数和子程序之间的区别：


    | 函数 | 子程序 |

    | --- | --- |

    | 函数的基本格式为 `$myvalue = myfunction(parameter, parameter);` | 子程序的基本格式为 `sub subroutine_name{#
    body of the subroutine}` |

    | Perl 函数是任何内置于 Perl 的内容。Perl 内置函数的主要参考参考文档被称为 perlfunc。 | 在 Perl 中，子程序是一段可以接收输入、对它们执行特定操作并可能返回或不返回有用值的代码。然而，它们始终是用户定义的，而不是内置的。
    |

    | Perl 为我们提供了所有函数。 | 子程序是提供提供给 Perl 的代码片段。 |

    | 函数类似于子程序，因为它们都会返回一个值。函数通常执行某些计算并将结果返回给调用者。 | 子程序执行任务但不向调用程序返回任何信息。 |


