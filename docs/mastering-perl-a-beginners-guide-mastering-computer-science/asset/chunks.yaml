    \ \", $result, \"\\n\";\n# Bitwise Right Shift Operator\n$result = $x >> $y;\n\
    print \"Bitwise Right Shift: \", $result, \"\\n\";\n```\n\n### 赋值运算符\n\n用于向变量分配值。赋值运算符的左操作数是一个变量，而赋值运算符的右操作数是一个值。\n\
    \n以下是赋值运算符的示例：\n\n* `=` (简单赋值)：最基础的赋值运算符。该运算符将右侧的值赋值给左侧的变量。\n    例如：$x = 20; $y\
    \ = 40;\n\n* `+=` (加赋值)：`+` 和 `=` 运算符的组合。该运算符首先将左侧变量的当前值加上右侧的值，然后将结果赋值给左侧变量。\n\
    \    例如：`($x += $y)` 可以写为 `($x = $x + $y)`。\n    如果 `$a` 的初始值为 5，那么 `($a += 6)`\
    \ = 11。\n\n* `-=` (减赋值)：该运算符结合了 `−` 和 `=` 运算符。该运算符从右侧的值中减去变量的当前值，并将结果的结果赋值给左侧变量。\n\
    \    例如：`($x -= $y)` 可以写为 `($x = $x - $y)`。\n    如果 `$a` 的初始值为 8，那么 `($a −= 6)`\
    \ = 2。\n\n* `*=` (乘赋值)：该运算符结合了 `*` 和 `=` 运算符。左侧的变量乘以右侧的值，并将结果赋值给左侧变量。\n    例如：`($x\
    \ *= $y)` 可以写为 `($x = $x * $y)`。\n    如果 `$a` 的初始值为 5，那么 `($x *= 6)` = 30。\n\n\
    * `/=` (除赋值)：该运算符结合了 `/` 和 `=` 运算符。该运算符将左侧变量的当前值除以右侧的值，并将结果分配给左侧变量。\n    例如：`($x\
    \ /= $y)` 可以写为 `($x = $x / $y)`。\n    如果存储在 `$a` 中的初始值为 6，那么 `($x /= 2)` = 3。\n\
    \n* `%=` (取模赋值)：该运算符结合了 `%` 和 `=` 运算符。该运算符在将结果赋值给左侧变量之前，通过右侧的值修改左侧变量的当前值。\n  \
