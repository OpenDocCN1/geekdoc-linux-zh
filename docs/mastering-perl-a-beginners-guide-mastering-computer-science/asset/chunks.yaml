    \ `rand` 函数为 `x` 分配一个随机整数。\n\n`rand(k)` 函数生成一个 0 到 `k` 之间的随机整数。由于这个随机数是浮点型整数，因此使用\
    \ `int` 将其转换为整数。`x` 存储该整数值。用户被赋予了有限的机会来估算数字。如果机会超过了猜中的数字，用户将失败。\n\n该过程如下：\n\n\
    # 猜数字游戏实现\n\n```perl\nprint \"The Number guessing game\\n\";\n# rand 函数用于生成\n\
    # 0 到 10 之间的随机数\n# 将其转换为整数\n# 并存储到变量 \"x\"\n$x = int rand 10;\n# 用于计数正确\n# 次数的变量\n\
    $correct = 0;\n# 分配给用户\n# 猜数字的机会\n# 或者是用户输入\n# 到输入框中的\n# 输入，这里机会\n# 是 4 次\n$chances\
