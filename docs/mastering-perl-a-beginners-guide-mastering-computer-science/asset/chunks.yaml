    \ methods. An object is made up of:\n\n    *   State: State is represented by\
    \ an object’s attributes. It also reflects an object’s properties.\n\n    *  \
    \ Behavior: Behavior is represented by an object’s methods. It also reflects an\
    \ object’s interaction with other objects.\n\n    *   Identity: It gives an object\
    \ a unique name and allows one object to interact with other objects.\n\n    \
    \    **Example:** A dog is an example of an object.\n\n3.  **Method:** A method\
    \ is a group of statements that perform a specific task and return the result\
    \ to the caller. A method can complete a task without returning anything. Methods\
    \ save time by allowing us to reuse code without having to retype it."
