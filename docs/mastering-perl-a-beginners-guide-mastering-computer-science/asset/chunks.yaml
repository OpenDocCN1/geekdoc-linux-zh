    ## DATABASE MANAGEMENT USING DBI


    One of the most prevalent applications of Perl is creating database apps. We can
    construct complex web apps with a database to handle all the data using Perl.
    It offers great interface support and a wide variety of database formats. Perl
    includes a module named DBI for connecting to and accessing a database. DBI is
    a database interface connecting with structured query language (SQL)-based database
    servers.


    Generally, Perl requires two steps to access a database. The DBI module offers
    a database access API. DBI functions are used by software to modify a database.
    A database driver (DBD) module serves as the second step in Perl database access.
    Each unique database management system needs its own driver. This method enables
    a Perl database application software to be largely independent of the database
    to which it will connect.


    **Installation:** Open the terminal and enter the following command to install
    the DBI module: perl -MCPAN -e ’install Bundle::DBI’


    This will automatically download and install the DBI module driver, allowing Perl
    to connect to databases.


    ### Database Independent Interface


    DBI, as the name implies, provides an independent interface for Perl programs.
    This means that the Perl code is not dependent on the database that is running
    in the backend. The DBI module provides abstraction, which allows us to write
    code without worrying about the database that runs in the backend


    To import functions of the Database-Independent Interface module, use the “use”
    pragma to import or include the module. The use of DBI pragma enables us to manipulate
    the database to which we are connected using the DBI module.


    ### Accessing the Database


    To connect to the specified database, use the connect() method. It requires three
    arguments:


    *   A three-value string separated by a “:” It is “DBI:mysql:test” in this case.
    The first value indicates that we are employing DBI. The second value specifies
    the database engine, which is MySQL in this case. The third value is the database
    name to which we want to connect.


    *   The username is the next argument to the connect() method. The user in this
    case is “root.”


    *   The last argument is our local system’s password. It is “password” in this
    scenario.


    The “or die” statement terminates the program with an error message if it is unable
    to connect to the database. The errstr() method returns a string containing any
    errors encountered during the database connection.


    ### Queries to Prepare


    The SQL query to execute is passed as a single parameter to the prepare() method.
    The SQL query is represented as a string that contains the SQL statement. This
    SQL statement is identical to the SQL statements we would use in MySQL. It returns
    a statement handle, which can use to execute queries.


    The query is now ready for execution. In the preceding query, we are creating
    a table with columns for id, name, and salary.


    ### Executing Queries


    The query written in the prepare() method is executed by the execute() method.
    It is not open to debate. The statement handle object created when the “prepare”
    statement is executed is used to call it.


    ### Fetching Values from the Result


    The fetchrow() method retrieves the next row of data from the query result. When
    a select query is run, the fetchrow() method retrieves the next row from the result.
    It extracts one row from the result and assigns it to variables. Using the fetchrow()
    method in a while loop, we can fetch and display all the rows in the database.


    The three variables hold the values of each column.


    The fetchrow_array() function returns an array containing the result row.


    ### Disconnecting


    We must disconnect the connection once all of the queries have been completed.
    This is accomplished through the use of disconnect() function. This allows the
    Perl script to close the connection properly. There will be no errors if we do
    not disconnect from the database. This is generally a good practice.


    ### Creating a database in MySQL


    MySQL must install on our system, and we must have a basic understanding of MySQL.


    *   Connect to our MySql server.


    *   Create a database named “test.” We’ll connect to this database, so make sure
    the name is “test.”


    *   Make sure there are no tables in this database because we will be creating
    a table called “emp” and inserting values into it.


    **Putting everything together:**


    We may access Perl’s database after building it in MySQL. First, we build a test
    table in the database with the schema: (id INTEGER PRIMARY KEY, name VARCHAR(10),
    salary INT, dept INT). We insert values into the table once it has been created
    without errors.


    Once the data have been inserted, we can use the fetchrow() method to query the
    table and choose all rows to display to the user.


    ## ACCESSING A DIRECTORY USING THE FILE GLOBBING


    A directory is used in Perl to store values in the form of lists. A directory
    is comparable to a file in many ways. The directory, like a file, may be used
    to conduct various operations. These operations are used to modify an existing
    directory or create a new one. We may quickly open and analyze a directory using
    the built-in function glob.'
