    ### 要从指定位置开始匹配，请使用 \G 断言

    在 Perl 正则中，`\G` 断言用于匹配以 `pos()` 函数指定的字符为起点，并以正则表达式指定的匹配字符为结束的子字符串。它将返回由 `m` 修饰符指定的字符的第一次出现的位置。


    在前面的示例中，匹配的子字符串的第一次出现的位置将与剩余字符串一起打印。如果我们需要为匹配字符的下一次出现重置计数位置，只需将剩余字符串存储在默认字符串的
    `$1` 中即可。


    ## 正则表达式速查表

    正则表达式是 Perl 编程的重要组成部分。它用于查找指定的文本模式。一组字符组成了搜索模式。它也被称为 regexp。当用户学习正则表达式时，可能需要快速回顾不经常使用的概念。因此，创建了一个包含正则表达式中使用的各种类、字符、修饰符等的正则表达式速查表，以提供此类服务。


    ### 字符类

    为了匹配字符字符串，使用了字符类。这些类允许用户匹配任何用户预先未知的的字符范围。


    | 字符类 | 解释 |

    | --- | --- |

    | `[abc.]` | 它仅包含指定的字符之一，即“a”、“b”、“c”或“..”。 |

    | `[a-j]` | 它包含从 a 到 j 的所有字符。 |

    | `[a-z]` | 它包含从 a 到 z 的所有小写字母。 |

    | `[^az]` | 它包含 a 和 z 之外的所有字符。 |

    | `\w` | 它包含所有类似 `[a-z, A-Z, 0-9]` 的字符。 |

    | `\d` | 它匹配数字如 `[0-9]`。 |

    | `[ab][^cde]` | 它匹配字符 a 和 b 后面不紧跟 c、d 和 e。 |

    | `\s` | 它匹配 `[\f\t\n\r]`，即换页符、制表符、换行符和回车符。 |

    | `\W` | `\w` 的补集。 |

    | `\D` | `\d` 的补集。 |

    | `\S` | `\s` 的补集。 |


    ### 锚点

    锚点不对应任何字符。相反，它们对应特定的位置，如字符之前、之后或之间。


    | 锚点 | 解释 |

    | --- | --- |

    | `^` | 匹配字符串的开头。 |

    | `$` | 匹配字符串的结尾。 |

    | `\b` | 匹配从 `\w` 到 `\W` 的单词边界。 |

    | `\A` | 匹配字符串的开头。 |

    | `\Z` | 匹配字符串的结尾或换行符之前。 |

    | `\z` | 仅在字符串末尾匹配。 |

    | `\G` | 在指定的位置 `pos()` 匹配。 |

    | `\p{….}` | Unicode 字符类，如 `IsLower`、`IsAlpha` 等。 |

    | `\P{….}` | Unicode 字符类的补集。 |

    | `[:class:]` | POSIX 字符类，如 digit、lower、ascii 等。 |


    ### 元字符

    元字符在 Perl 正则中用于匹配模式。必须避免直接使用所有元字符。


    | 字符 | 解释 |

    | --- | --- |

    | `^` | 检查字符串的开头。 |

    | `$` | 检查字符串的结尾。 |

    | `.` | 换行符以外的任意字符。 |

    | `*` | 匹配 0 次或多次。 |

    | `+` | 匹配 1 次或多次。 |

    | `?` | 匹配 0 次或 1 次。 |

    | `()` | 用于分组。 |

    | `\` | 用于转义。 |

    | `[]` | 用于字符集。 |

    | `{}` | 用于重复。


    ### 量词

    量词用于指定匹配的次数。


    | 符号 | 解释 |

    | --- | --- |

    | `?` | 匹配 0 次或 1 次。 |

    | `+` | 匹配 1 次或多次。 |

    | `*` | 匹配 0 次或多次。 |

    | `{3}` | 精确匹配 3 次。 |

    | `{3, }` | 至少匹配 3 次。 |

    | `{3, 7}` | 匹配 3 次到 7 次。 |


    ### 非贪婪模式

    | 符号 | 解释 |

    | --- | --- |

    | `???` | 非贪婪匹配 0 次或 1 次。 |

    | `+?` | 非贪婪匹配 1 次或多次。 |

    | `*?` | 非贪婪匹配 0 次或多次。 |

    | `{3}?` | 尽可能少匹配 3 次。 |

    | `{3, }?` | 至少匹配 3 次。 |

    | `{3, 7}?` | 尽可能匹配 3 次到 7 次。 |


    ### 修饰符

