  trans: '


    它包含了强大的文本处理工具，使其兼容标记语言，如 `HTML` 和 `XML`。


    它支持第三方数据库，如 `Oracle` 和 `MySQL`。


    它可以嵌入 Web 服务器和数据库服务器等其他系统中。


    它是一项基于 GNU 许可的开源软件。


    `Perl` 用于编写许多框架。


    它能够处理加密的 Web 数据，包括电子商务交易。


    它是一种平台无关的语言。


    它包含一个正则表达式引擎，可以转换任何类型的文本。


    ## PERL 许可


    Larry Wall 拥有 `Perl 5` 的版权 (C)。它是免费的开源软件。根据 `GNU` 和 `Artistic Licenses` 的条款可以对其重新分发或修改。


    `GNU 通用公共许可证` 为用户提供免费的开源软件。任何源自 GNU 许可源代码的程序必须使用相同的许可证。


    根据 `Artistic license`，从 `Perl` 派生的包必须明确突出其修改部分。原始模块和派生模块都应该分发。重要的是，必须承认原始作者为包的所有者。用户应该能够区分原始模块和派生模块。


    ## PERL 与 Web


    由于其文本处理能力和快速开发周期，`Perl` 曾经是最流行的 Web 编程语言。


    `Perl` 通常被称为“互联网的胶带”。


    `Perl` 能够处理加密的 Web 数据，包括电子商务交易。


    `Perl` 可以嵌入 Web 服务器以将处理速度提高 2000%。


    `Perl` 模块 `mod Perl` 使 `Apache` Web 服务器包含 `Perl 解释器`。


    `Perl` 的 `DBI` 包简化了 Web 数据库的集成。


    ## PERL 是解释型的


    由于 `Perl` 是一种解释型语言，我们的代码可以在不编译成不可移植的可执行程序的情况下运行。


    传统的编译器将程序翻译成机器码。当你运行 `Perl` 程序时，它首先被编译成字节码，然后转换为机器指令（在程序运行时）。因此，它与 shell 或 `Tcl`
    不同，后者是严格解释的，没有中间表示。


    它也与大多数 `C` 或 `C++` 版本不同，后者被直接编译成依赖于机器的格式。它处于中间位置，与 `Python`、`AWK` 和 `Emacs` 的
    `.elc` 文件一样。


    ## 优点


    `Perl` 有以下优势：


    * **选项：** `Perl` 用户在编写程序或解决问题方面有许多选择。

    * **灵活：** 语言的设计和语法允许用户按照偏好的编程风格编写代码。

    * **开源：** 它是免费的。任何人都可以在各种平台上免费地访问、开发和使用 `Perl`。

    * **可用性：** 它在很多地方预先安装，`Comprehensive Perl Archive Network`（全面 存档网络）包含超过 25,000
    个 `Perl` 模块。大多数操作系统也支持它。


    ## 缺点


    `Perl` 的主要缺点是它在许多方面都是一种相当混乱的语言：


    * **难以阅读：** 它很难阅读。根据一些开发者来说，`Perl` 比 `Python` 等较新的语言更难阅读且不精简。因为编写 `Perl` 程序的方法有很多，代码可能会变得乱无章且不整洁。

    * **难以调试：** 调试和修复问题可能很困难，因为 `Perl` 代码可能晦涩或混乱。

    * **性能缺陷：** 使 `Perl` 有用的灵活性也可能让它变慢。这是因为灵活性会导致效率低下和冗余，增加编译时间。


    ## PERL 对比 PYTHON


    `Perl` 和 `Python` 有共同的祖先。它们被创建是为了让脚本编写变得简单。`Perl` 的创建是为了给 `Unix` 脚本提供 `C-like`
    的结构。`Python` 的创建是为了让 `C` 更容易使用并适用于脚本编写。


    在语法上，`Perl` 和 `Python` 非常相似，从 `Perl` 翻译到 `Python` 相对简单，只有几处显著的语法变化。


    然而，有四个显著差异：


    * `Perl` 中用分号结束行。

    * Python 缺少大括号和缩进，而 `Perl` 有。

    * `Perl` 中的变量名使用变量符号样式化，例如 `$x`、`% x` 和 `x`。在 `Python` 中，变量名不带变量标识符，例如 `x`。

    * 在 `Python` 中，`print` 语句在输出末尾插入新行。


    其他差异还包括：


    * `Perl` 可能是混乱的，而 `Python` 更精简。

    * 在 `Perl` 中，有多种方法完成任务，而 `Python` 设计旨在为任何给函数提供单一清晰的路径。

    * `Python` 比 `Perl` 更具可读性。

    * `Python` 通常被认为是最好学习的语言之一。

    * `Python` 是比 `Perl` 新语言。

    * `Perl` 集成在源码中。

    * `Python` 因其作为动态语言的声誉而是一种强大的编程语言。

    * `Python` 在开源开发者社区中拥有更多支持。


    | Perl | Python |

    | --- | --- |

    | 它是一种高级的、基于解释器的动态编程语言。 | 它是一种带有解释器的高级通用语言。 |

    | 可以 `https://www.perl.org/get.html` 下载 Unix/Linux、macOS 或 Windows 版 Perl。 | 可以从
    `https://www.python.org/downloads/` 下载适用于 Unix/Linux、macOS、Windows 及其他系统的 Python。
    |

    | Perl 的目标是简化报告创建，后来经历了许多变化和修订。 | Python 的目标是让为中小型项目和应用程序编写简单且逻辑清晰的代码更容易。 |

    | 与 Python 代码相比，Perl 代码并不那么简单。 | Python 代码更直观、更易理解。 |

    | Perl 拥有卓越库支持，可以使用内置函数在操作系统级别处理操作。 | 为了处理此类操作，Python 需要第三方库的帮助。 |

    | 可用的 OOP 支持有限。 | Python 为面向对象的编程提供了卓越的支持。 |

    | 使用括号来标记和识别代码块。 | 使用缩进来标记和识别代码块。 |

    | 空格在 `Perl` 中至关重要。 | 空格在 `Python` 中很重要并可能导致语法错误。 |

    | 它便于文本处理，因为 `Perl` 包含了对正则表达式的支持。 | 处理正则表达式，Python 需要使用外部函数。 |

    | 在 `Perl` 中结束代码行使用分号(;)。 | 在每行代码末尾不需要分号(;)。 |

    | Perl 的文件扩展名是 .pl。 | Python 文件的扩展名是 .py。 |


    ## PERL 对比 JAVA


    Larry Wall 在 1987 年发明了 `Perl`。`Perl` 同时支持面向对象和过程化编程。它与 `C` 和 `C++` 相似。`Perl` 最初设计用于处理文本。


    `Java` 是一种著名的编程语言。`Java` 既是一种编程语言也是一种计算机平台。Sun Microsystems 在 James Gosling 的发起下于
    1995 年发布了 `Java`。Oracle 声称全球有 30 亿设备在使用 `java`。它的设计允许开发者“编写一次，到处运行”，这意味着 Java
    应用程序可以在一个平台上生成并在任何支持 `JVM` 的其他平台上执行。


    以下是 Perl 和 Java 的一些关键区别：


    | 特性 | Perl | Java |

    | --- | --- | --- |


