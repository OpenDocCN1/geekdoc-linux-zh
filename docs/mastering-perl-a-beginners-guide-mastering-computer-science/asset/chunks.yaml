  trans: "\n\n用户可以在此处从多个备选项中选择。if 语句按照列出的顺序执行。当满足某个 if 条件时，执行与该条件相关的语句，并跳过阶梯结构中的剩余部分。如果没有任何条件被满足，则使用最后一个\
    \ else 表达式。¹\n\n**流程图：**\n\n![](img/ufig4_4.jpg)\n\nif else if 语句。\n\n### unless\
    \ 语句\n\n如果条件为假，则将执行语句。在布尔上下文中，数字 `0`、空字符串 `\"\"`、字符 `\"0\"`、空列表 `()` 和 `undef`\
    \ 均为假，而所有其他值均为真。\n\n**流程图：**\n\n![](img/ufig4_5.jpg)\n\nunless 语句。\n\n### unless\
    \ else 语句\n\n当布尔表达式为真时，except 语句之后会跟一个可选的 else 语句。\n\n**流程图：**\n\n![](img/ufig4_6.jpg)\n\
    \nunless else 语句。\n\n### unless elsif 语句\n\nunless 语句和可选的 elsif 可以跟在语句...else\
    \ 语句之后，这允许我们使用单个 unless...elsif 语句测试许多条件。\n\n**记住以下内容：**\n\nUnless 语句可以有任意数量的\
    \ elsif，且它们都必须出现在 else 之前。\n\nUnless 语句可以有零或一个 else，并且必须出现在任何 elsif 语句之后。\n\n\
    当某个 elsif 成功时，将不再尝试其他的 elsif 或 else。\n\n**流程图：**\n\n![](img/ufig4_7.jpg)\n\nunless\
    \ elsif 语句。\n\n## PERL 中的循环\n\n在编程语言中，循环是一种允许在某些条件为真时重复执行一组指令或函数的特性。循环使代码编写员的工作变得更容易。Perl\
    \ 支持多种形式的循环来处理程序中的条件情况。下文将讨论 Perl 的循环。\n\n### for 循环\n\n“for”循环是表示循环结构的一种简写方式。与\
    \ while 循环不同，for 语句在单行内消耗初始化、条件和递增/递，从而产生更短、更易调试的循环结构。\n\n**流程图：**\n\n![](img/ufig4_8.jpg)\n\
    \nPerl 中的 for 循环。\n\nfor 循环在预定义的控制流上运行。以下因素影响控制流：\n\n* `init statement`：初始化语句是第一个执行的初始语句。在此阶段，我们设置一个变量来控制循环。\n\
    * `condition`：在此阶段评估指定的条件，如果条件为真（True），则执行 for 循环。因为条件在执行循环语句之前经过验证，所以它也是一种入口控制循环。\n\
    * `Statement execution`：当条件为真时，执行循环体中的语句。\n* `increment/decrement`：在此对循环控制变量递增或递减，以更新下次迭代的变量。\n\
    * `Loop termination`：当满足条件时，循环终止，表示其生命周期的结束。\n\n### foreach 循环\n\nforeach 循环遍历列表，变量一次存储一个列表项的值。它主要用于我们拥有一个列表数据集合，并希望遍历列表元素而非其范围的情况。循环会自动执行每个元素的迭代。\n\
    \n### while 循环\n\nwhile 循环通常接受一个封装在括号内的表达式。如果该表达式为真（True），则执行 while 循环体内的代码。当不知道想要循环执行多少次，但知道循环的终止条件时，就会使用\
    \ while 循环。因为条件在执行循环之前经过验证，所以它也被称为入口控制循环。while 循环类似于循环 if 语句。\n\n### 无限 while\
    \ 循环\n\nwhile 循环可以无限持续，这意味着它没有结束条件。换句话说，某些情况保持为真，导致 while 循环无结束或永不完成。\n\n**示例：**\
    \ 以下应用程序将无限期打印提供的语句，并在在线 IDE 上显示运行时错误“Output Limit Exceeded”（输出限制超出）。\n\n### do...while\
    \ 循环\n\ndo...while 循环与 while 循环之间的唯一区别是 do...while 循环至少执行一次。在初始执行之后，会验证条件。当我们希望循环至少执行一次时，使用\
    \ do...while 循环。因为条件是在执行循环之后验证的，所以也被称为退出控制循环。\n\n### until 循环\n\nwhile 循环的反面是\
    \ until 循环。它接受括号中的条件，并只运行到该条件为假（false）为止。它本质上是重复某条指令或指令序列直到条件为假（FALSE）。它也是一种入口控制循环，这意味着首先测试条件，然后执行块内的指令序列。\n\
    \n### 嵌套循环\n\n嵌套循环是包含在另一个循环内部的循环。Perl 编程也支持嵌套循环。上述列出的所有循环都可以进行嵌套。\n\nPerl 多个嵌套循环的语法：\n\
    \n* **嵌套 for 循环**：`for (init statement; condition; increment/decrement ) { for\
    \ (init statement; condition; increment/decrement ) { # 执行的代码 } }`\n* **嵌套 foreach\
    \ 循环**：`foreach variable_1 (@array_1) { foreach variable_2 (@array_2) { # 执行的代码\
    \ } }`\n* **嵌套 while 循环**：`while (condition) { while (condition) { # 执行的代码 } }`\n\
    * **嵌套 do...while 循环**：`do{ do{ # 执行的代码 }while(condition); }while(condition);`\n\
    * **嵌套 until 循环**：`until (condition) { until (condition) { # 执行的代码 } }`\n\n##\
    \ given-when 语句\n\n在 Perl 中，given-when 语句替换了将变量与多个整数值比较的长 if 语句。\n\n\n\n given-when\
    \ 语句是一种带有许多选项的分支语句。它允许我们根据表达式的值轻松将执行路由到代码的不同区域。\n* 提供了一种控制语句，允许值改变执行控制。\n\nPerl\
    \ 中的 switch-case 类似于 C/C++、Python 或 PHP 中的 switch-case。它也像 switch 语句一样，将许多 if\
    \ 语句替换为不同的 case。²\n\ngiven-when 语句还包含两个额外的关键字：`break` 和 `continue`。这些关键字保持程序的流动，并有助于退出程序或跳过特定值的执行。\n\
    \n**break:**：`break` 关键字用于退出 when 块。在 Perl 中，不需要在每个 when 块后显式表示 `break`。它已经隐式定义。\n\
    \n**continue:**：相反，如果第一个 when 块正确，`continue` 将进入下一个 when 块。\n\ngiven-when 语句中的条件语句不能在多个\
    \ when 语句中重复，因为 Perl 只检查该条件的第一次出现处，随后的重复语句会被忽略。此外，默认语句必须放在所有 when 语句之后，因为编译器会顺序检查每个\
    \ when 语句的条件匹配，如果我们在中间插入默认语句，它将跳断并打印默认语句。\n\n### 嵌套 given-when 语句\n\ngiven-when\
    \ 嵌套语句是指包含在其他 given-when 语句内部的 given-when 语句。这可能用于对于给定的输出集保持用户提供输入的层级结构。\n\n"
- fmt: "\nHere’s an example of a Nested given-when statement:\n\n```perl\n#!/usr/bin/perl\n\
    # program to print respective day\n# for the daycode using given-when statement\n\
    use 5.010;\n# Asking user to provide daycode\nprint \"Enter daycode between 0-6\\\
    n\";\n# Removing the newline using chomp\nchomp(my $daycode = <>);\n# Using given-when\
    \ statement\ngiven ($daycode) {\n    when (’0’) { print ’Sunday’ ;}\n    when\
    \ (’1’) {\n        print \"What time of day is it?\\n\";\n        chomp(my $daytime\
    \ = <>);\n        # Nested given-when statement\n        given($daytime) {\n \
    \           when(’Morning’) {print ’It is Monday Morning’};\n            when(’Noon’)\
    \ {print ’It is Monday noon’};\n            when(’Evening’) {print ’It is Monday\
    \ Evening’};\n            default{print’Invalid Input’};\n        }\n    }\n \
    \   when (’2’) { print ’Tuesday’ ;}\n    when (’3’) { print ’Wednesday’ ;}\n \
    \   when (’4’) { print ’Thursday’ ;}\n    when (’5’) { print ’Friday’ ;}\n   \
    \ when (’6’) { print ’Saturday’ ;}\n    default { print ’Invalid daycode’;}\n\
    }\n```\n\nWhen the Input day-code is anything other than 1, the code will not\
    \ run the nested given-when block and the output will be the same as in the previous\
    \ example; but, if we supply 1 as Input, the code will execute the nested given-when\
    \ block and the result will differ from the previous example.\n\n## goto STATEMENT\n\
    \nThe `goto` statement in the Perl is a jump statement, sometimes known as an\
    \ unconditional jump statement. The `goto` statement can use to jump from one\
    \ location within a function to another.\n\nThe `goto` statement in the preceding\
    \ syntax instructs the compiler to immediately go/jump to the statement designated\
    \ as `LABEL`. The `label` is a user-defined identifier that specifies the target\
    \ statement in this case. The destination statement is the statement that comes\
    \ immediately after “label.”\n\nIn Perl, the `goto` statement can have three forms:\
    \ `Label`, `Expression`, and `Subroutine`.\n\n- `Label`: It will jump to the statement\
    \ indicated by the `LABEL` and continue execution from there.\n- `Expression`:\
    \ There will be an expression in this form that will return a `Label` name after\
    \ evaluation, and `goto` will cause it to jump to the labeled statement.\n- `Subroutine`:\
    \ `goto` will move the compiler from the currently executing subroutine to the\
    \ subroutine of the provided name.\n\n**goto with LABEL name:** `LABEL` name is\
    \ used to jump to a specific statement in code and begin execution there. Its\
    \ reach, however, is restricted. It can only function inside the scope of where\
    \ it is invoked.\n\n**goto using Expression:** An expression may also be used\
    \ to call a specific label and transmit control to that label. When this expression\
    \ is provided to the `goto` statement, it evaluates to a label name, and execution\
    \ continues from the statement described by that label name.\n\n**goto with Subroutine:**\
    \ The `goto` command may also invoke a subroutine. Based on its usage, this procedure\
    \ is called from within another subroutine or alone. It keeps the task to be done\
    \ next to the calling statement. This method may recursively invoke a function\
    \ to print a series or range of characters.\n\n## next OPERATOR\n\nIn Perl, the\
    \ `next` operator skips the current loop execution and moves the iterator to the\
    \ value specified by the `next`. If a label is specified in the program, execution\
    \ proceeds to the next iteration designated by the `Label`.\n\n## redo OPERATOR\n\
    \nIn Perl, the `redo` operator begins from the specified label without evaluating\
    \ the conditional expression. Once `redo` is called, no further statements in\
    \ that block will execute. Even if there is a continue block, it will not be performed\
    \ after the `redo` call. When a `Label` is used with the `redo` operator, the\
    \ execution begins with the loop defined by the `Label`.\n\n## last IN LOOP\n\n\
    The `last` keyword is used in a loop control statement to make the current iteration\
    \ of the loop the last. If a label is provided, it exits the loop through the\
    \ label.\n\nIn this chapter, we covered control flow statements in Perl.\n\n##\
    \ NOTES\n\n# CHAPTER 5 File Handling in Perl\n\nDOI: [10.1201/9781003358442-5](https://doi.org/10.1201/9781003358442-5)\n\
    \n## IN THIS CHAPTER\n\n- Introduction of File Handling\n- Opening and Reading\
    \ a File\n- Writing and Appending to a File\n- Reading a CSV File\n- File Test\
    \ Operators\n- File Locking\n- Use of Slurp Module\n- Useful File-handling Functions\n\
    \nIn the previous chapter, we discussed control flow statements, and in this chapter,\
    \ we will cover file handling.\n\n## INTRODUCTION OF FILE HANDLING\n\nA `FileHandle`\
    \ in Perl connects a name with an external file that can use until the program\
    \ terminates or the `FileHandle` is closed. In summary, a `FileHandle` is a connection\
    \ that can be used to edit the contents of an external file, and the connection\
    \ (`FileHandle`) is given a name for easier access and convenience.\n\n`STDIN`,\
    \ `STDOUT`, and `STDERR` are the three fundamental `FileHandles` in Perl, representing\
    \ standard input, standard output, and standard error devices, respectively.\n\
    \nThe `open` function is typically used for file handling.\n\n`Mode` and `FileName`\
    \ can also combine to produce a single `open` expression.\n\nThe `close` function\
    \ is used to close `FileHandle`.\n\n### Using FileHandle To Read and Write to\
    \ a File\n\nThe `print` function can be used to read from a `FileHandle`.\n\n\
    The `print` function can also be used to write to a file.\n\n### Various File\
    \ Handling Modes\n\n| Mode | Explanation |\n| --- | --- |\n| “<” | The Read Only\
    \ Mode |\n| “>” | Creates file (if necessary), Clears contents of the File and\
    \ Writes to it |\n| “>>” | Creates file (if necessary), Appends to File |\n| “+<”\
    \ | Reads and Writes but does NOT Create |\n| “+>” | Creates file (if necessary),\
    \ the Clears, Reads and Writes |\n| “+>>” | Creates file (if necessary), the Reads\
    \ and Appends |\n\n**Example:** Consider the file `Hello1.txt`, which initially\
    \ contains the text “Welcome to PeeksForPeeks!!”.\n\n1. **Mode = “<”**\nThis mode\
    \ is read-only. This mode is used to read the file’s content line by line.\n```perl\n\
    #!/usr/bin/perl\n# Opening a File in the Read-only mode\nopen(r, \"<\", \"Hello1.txt\"\
    );\n# Printing content of File\nprint(<r>);\n# Closing File\nclose(r);\n```\n\n\
    2. **Mode = “>”**\nThis is the read-only mode. The original contents are erased\
    \ when we open a file in this mode. If no file with the same name is found, it\
    \ creates one.\n```perl\n#!/usr/bin/perl\n# Opening File Hello1.txt in Read mode\n\
    open(r, \"<\", \"Hello1.txt\");\n# Printing existing content of the file\nprint(\"\
    Existing Content of Hello1.txt: \". <r>);\n# Opening File in Write mode\nopen(w,\
    \ \">\", \"Hello1.txt\");\n# Set r to the beginning of Hello1.txt\nseek r, 0,\
    \ 0;\nprint \"\\nWriting to the File...\");\n# Writing to Hello1.txt using print\n\
    print w \"The Content of this file is changed\";\n# Closing FileHandle\nclose(w);\n\
    # Set r to beginning of Hello1.txt\nseek r, 0, 0;\n# Print the current contents\
    \ of Hello1.txt\nprint(\"\\nUpdated Content of Hello1.txt: \".<r>);\n# Close FileHandle\n\
    close(r);\n```\n\n3. **Mode=“>>”**\nAppend mode is active. The original content\
    \ is not deleted when we open a file in this mode. Because the string always attaches\
    \ at the end, this mode cannot be used to overwrite. If no file with the same\
    \ name is discovered, it creates one.\n```perl\n#!/usr/bin/perl\n# Opening File\
    \ Hello1.txt in Read mode\nopen(r, \"<\", \"Hello1.txt\");\n# Printing existing\
    \ content of the file\nprint(\"Existing Content of Hello1.txt: \". <r>);\n# Opening\
    \ the File in the Append mode\nopen(A, \">>\", \"Hello1.txt\");\n# Set r to beginning\
    \ of Hello1.txt\nseek r, 0, 0;\nprint \"\\nAppending to the File...\";\n# Appending\
    \ to Hello1.txt using print\nprint A \" Hello Everyone!\";\n# close FileHandle\n\
    close(A);\n# Set r to the beginning of Hello1.txt\nseek r, 0, 0;\n# Print current\
    \ contents of Hello1.txt\nprint(\"\\nUpdated Content of Hello1.txt: \".<r>);\n\
    # Close FileHandle\nclose(r);\n```\n\n4. **Mode = “+<”**\n"
