  trans: "\n\n这些单行命令（one-liners）对于快速进行修改（如获取信息和修改文件内容）非常有用。有些程序员避免使用单行命令，因为当脚本变得过长时，它们会变得笨拙。而另一些程序员倾向于这样做，因为单行命令比脚本更快，因为它们不需要存储在文件中。\n\
    \n## PERL 中的布尔值\n\n在大多数计算机语言中，True（真）和 False（假）被视为布尔值。然而，Perl 没有为 True 和 False\
    \ 提供布尔类型。当函数返回 True 或 False 时，程序员可能会使用“boolean”一词。标量（如条件表达式 `if`, `while` 等）会返回真或假。\n\
    \n**真值：** 在 Perl 中，任何除零以外的非数字都是真值。在 Perl 中，字符串常量如“true”、“false”、“00”（两个或更多零的字符）和“0n”（字符串中一个\
    \ 0 后跟一个换行符）也被视为真值。\n\n**假值：** 在 Perl 中，假值是空字符串、包含单个数字 0 的字符串或 `undef` 值以及零。\n\
    \n**注意：** 对于条件检查，如果用户必须比较两个不同的变量，如果它们不相等，则返回 False；否则返回 True。\n\n## 运算符\n\n运算符是任何计算机语言的构建块，允许程序员对操作数执行各种操作。在\
    \ Perl 中，运算符的符号将取决于操作数的类型（如标量和字符串）。根据其多种功能，运算符分为几类：\n\n*   算术运算符\n*   关系运算符\n\
    *   三元运算符\n*   逻辑运算符\n*   位运算符\n*   赋值运算符\n\n![](img/ufig2_1.jpg)\n运算符的类型。\n\n\
    ### 算术运算符\n\n有多种类型的算术运算符。\n\n#### 加法\n\n这些用于在操作数上执行算术和数学运算。\n\n要加上两个操作数的值，请使用\
    \ `+` 运算符。例如：`$x = 15; $y = 20; print $x + $y;` 这里的 Result 是 25\n\n#### 减法\n\n\
    `−` 运算符从左侧操作数中减去右侧操作数。例如：`$x = 15; $y = 20; print $x - $y;` 这里的 Result 是 5\n\n\
    #### 乘法\n\n`*` 运算符乘以运算符两边的值。例如：`$x = 15; $y = 20; print $x * $y;` 这里的 Result 是\
    \ 300\n\n#### 除法\n\n当第一个操作数除以第二个操作数时，`/` 运算符返回余数。例如：`$x = 40; $y = 20; print $x\
    \ / $y;` 这里的 Result 是 20\n\n#### 取模\n\n取模运算符 `%` 将左侧操作数除以右侧操作数并返回余数。例如：`$x = 10;\
    \ $y = 15; print $x % $y;` 这里的 Result 是 5\n\n#### 指数运算符\n\n`**` 运算符用于计算操作数的指数（幂）。例如：`$x\
    \ = 2; $y = 3; print $x ** $y;` 这里的 Result 是 8\n\n该程序的目的是描述以下算术运算符：\n\n```perl\n\
    # 用于阐明算术运算符的 Perl 程序\n# 操作数\n$x = 10; $y = 4;\n# 使用算术运算符\nprint \"加法结果: \", $x\
    \ + $y, \"\\n\";\nprint \"减法结果: \", $x - $y, \"\\n\" ;\nprint \"乘法结果: \", $x *\
    \ $y, \"\\n\";\nprint \"除法结果: \", $x / $y, \"\\n\";\nprint \"取模结果: \", $x % $y,\
    \ \"\\n\";\nprint \"指数结果: \", $x ** $y, \"\\n\";\n```\n\n### 关系运算符\n\n在比较两个值时，会使用关系运算符。这些运算符将返回\
    \ 1（真）或 0（假）。这些运算符也被称为等价运算符。这些运算符使用各种符号来处理字符串。我们可以利用此来学习比较运算符在字符串上的操作。\n\n*  \
    \ 等于运算符：`==` 确定两个值是否相等。如果相等，返回 1，否则不返回任何。\n*   不等于运算符：`!=` 检查两个值是否等效。如果值不相等，则返回\
    \ 1；否则不返回任何。\n*   等于比较运算符：`< = >` 如果左侧操作数小于右侧操作数，结果为 −1；否则结果为 0。\n*   大于运算符：`>`\
    \ 如果左侧操作数大于右侧操作数，则返回 1；否则不返回任何。\n*   小于运算符：`<` 如果左侧操作数大于右侧操作数（注：原文可能有误，应为小于），则返回\
    \ 1；否则不返回任何。\n*   大于等于运算符：`>=` 如果左侧操作数大于或等于右侧操作数，则返回 1；否则不返回任何。\n*   小于等于运算符：`<=`\
    \ 如果左侧操作数小于或等于右侧操作数，则返回 1；否则不返回任何。\n\n为了在 Perl 中演示关系运算符，编写一个程序：\n\n```perl\n#\
    \ 用于阐明关系运算符的 Perl 程序\n# 操作数\n$x = 10; $y = 60;\n# 使用关系运算符\nif ($x == $y) {\n \
    \   print \"等于运算符为真\\n\";\n} else {\n    print \"等于运算符为假\\n\";\n}\nif ($x != $y)\
    \ {\n    print \"不等于运算符为真\\n\";\n} else {\n    print \"不等于运算符为假\\n\";\n}\nif ($x\
    \ > $y) {\n    print \"大于运算符为真\\n\";\n} else {\n    print \"大于运算符为假\\n\";\n}\n\
    if ($x < $y) {\n    print \"小于运算符为真\\n\";\n} else {\n    print \"小于运算符为假\\n\"\
    ;\n}\nif ($x >= $y) {\n    print \"大于等于运算符为真\\n\";\n} else {\n    print \"大于等于运算符为假\\\
    n\";\n}\nif ($x <= $y) {\n    print \"小于等于运算符为真\\n\";\n} else {\n    print \"\
    小于等于运算符为假\\n\";\n}\nif ($x <=> $y) {\n    print \"比较运算符为真\\n\";\n} else {\n  \
    \  print \"比较运算符为假\\n\";\n}\n```\n\n### 逻辑运算符\n\n这些运算符用于组合多个条件。\n\n*   逻辑与（AND）：当两个条件都真时，`and`\
    \ 运算符返回。\n*   逻辑或（OR）：当至少一个条件为真时，`or` 运算符返回。\n*   逻辑非（NOT）：`not` 运算符反转布尔值。\n\n\
    显示逻辑运算符的程序：\n\n```perl\n# 用于阐明逻辑运算符的 Perl 程序\n# 操作数\n$x = true; $y = false;\n\
    # 与运算符\n$result = $x && $y;\nprint \"逻辑与运算符结果: \", $result,\"\\n\";\n# 或运算符\n\
    $result = $x || $y;\nprint \"逻辑或运算符结果: \", $result,\"\\n\";\n# 非运算符\n$z = 0;\n\
    $result = not $z;\nprint \"逻辑非运算符结果: $result\";\n```\n\n### 位运算符\n\n位运算通过这些运算符执行。它首先将整数转换为位，然后在操作数上执行位级操作。\n\
    \n*   `&`（位与）：这是一个接收两个操作数并对每个位执行与运算的函数。只有当两个位都为 1 时返回 1。示例：`$x = 13; // 1101 $y\
    \ = 5; // 0101 $z = $y & $x; print $z;` 这里的 Result 是 5\n*   `|`（位或）：这是一个接收两个操作数并对每个位执行或运算的函数。只要其中一个位为\
    \ 1 就返回 1。示例：`$x = 13; // 1101 $y = 5; // 0101 $z = $y | $x; print $z;` 这里的 Result\
    \ 是 13\n*   `^`（位异或）：它接收两个操作数并对每个位执行异或运算。如果两个位不同，则异或的结果为 1。示例：`$x = 13; // 1101\
    \ $y = 5; // 0101 $z = $y ^ $x; print $z;` 这里的 Result 是 9\n\n"
- fmt: "\n* `~` (Complement operator) is a unary operator that acts as a bit flipper.\
    \ Its job is to reverse the bits and return the result in 2’s complement form\
    \ due to a signed binary number.\n\n* `<<` Binary left shift operator accepts\
    \ two integers, left shifts the bits of the first operand, and the second operand\
    \ determines the number of places to shift. The left operand is multiplied by\
    \ the number of times the right operand provides. As an example:$x = 70; $z =\
    \ $x << 2; print $z; Output: 280 Explanation: $70 * 2 = 140$ ---(1) $140 * 2 =\
    \ 280$ ---(2)\n\n* `>> Binary right shift operator takes two numbers, right shifts\
    \ the bits of the first operand, and the second operand determines the number\
    \ of places to shift. It divides the left operand by the number of times provided\
    \ by the right operand. As an example:$x = 80; $z = $x >> 2; print $z; Output:\
    \ 15 Explanation: $60 / 2 = 40$ ---(1) $40 / 2 = 20$ ---(2)\n\nProgram: To show\
    \ how bitwise operators work:\n```perl\n# Perl Program to illustrate Bitwise operators\n\
    #!/usr/local/bin/perl\nuse integer;\n# Operands\n$x = 100;\n$y = 2;\n# Bitwise\
    \ AND Operator\n$result = $x & $y;\nprint \"Bitwise AND: \", $result, \"\\n\"\
    ;\n# Bitwise OR Operator\n$result = $a | $b;\nprint \"Bitwise OR: \", $result,\
    \ \"\\n\";\n# Bitwise XOR Operator\n$result = $x ^ $y;\nprint \"Bitwise XOR: \"\
    , $result, \"\\n\";\n# Bitwise Complement Operator\n$result = ˜$x;\nprint \"Bitwise\
    \ Complement: \", $result, \"\\n\";\n# Bitwise Left Shift Operator\n$result =\
    \ $x << $y;\nprint \"Bitwise Left Shift: \", $result, \"\\n\";\n# Bitwise Right\
    \ Shift Operator\n$result = $x >> $y;\nprint \"Bitwise Right Shift: \", $result,\
    \ \"\\n\";\n```\n\n### Assignment Operators\n\nIt is used to assign value to the\
    \ variable. The assignment operator’s left operand is a variable, while the assignment\
    \ operator’s right operand is a value.\n\nThe following are examples of assignment\
    \ operators:\n\n* `=` (Simple assignment): The most basic assignment operator.\
    \ This operator assigns the variable on the left the value on the right.\n   \
    \ As an example:$x = 20; $y = 40;`\n\n* `+=` (Add assignment): A combination of\
    \ the `+` and `=` operators. This operator first adds current value of the variable\
    \ on the left to value on the right, and then assigns result to the variable on\
    \ the left.\n    As an example:`($x += $y)` can be written as `($x = $x + $y)`.\n\
    \    If the initial value of `$a` is 5, then `($a += 6)` = 11.\n\n* `-=` (Subtract\
    \ assignment): This operator combines the `−` and `=` operators. This operator\
    \ subtracts the variable’s current value from the value on right and assigns the\
    \ resulting value to the variable on the left.\n    As an example:`($x -= $y)`\
    \ can be written as `($x = $x - $y)`.\n    If the initial value of `$a` is 8,\
    \ then `($a −= 6)` = 2.\n\n* `*=` (Multiply assignment): This operator combines\
    \ the `*` and `=` operators. The variable on the left is multiplied by the value\
    \ on the right, and the result is assigned to a variable on the left.\n    As\
    \ an example:`($x *= $y)` can be written as `($x = $x * $y)`.\n    If the initial\
    \ value of `$a` is 5, then `($x *= 6)` = 30.\n\n* `/=` (Division assignment):\
    \ This operator combines the `/` and `=` operators. This operator divides the\
    \ current value of the variable on the left by the value on the right and allocates\
    \ the result to the variable on the left.\n    As an example:`($x /= $y)` can\
    \ be written as `($x = $x / $y)`.\n    If the initial value stored in `$a` is\
    \ 6, then `($x /= 2)` = 3.\n\n* `%=` (Modulus assignment): This operator combines\
    \ the `%` and `=` operators. This operator modifies the current value of the variable\
    \ on the left by the value on the right before assigning the result to the variable\
    \ on the left.\n    As an example:`($x %= $y)` can be written as `($x = $x % $y)`.\n\
    \    If the initial value stored in `$a` is 6, then `($a percent = 2)` = 0.\n\n\
    * `**=` (Exponent assignment): This operator is a mixture of the `**` and `=`\
    \ operators. This operator multiplies the current value of the variable on the\
    \ left by the value on the right before assigning the result to the variable on\
    \ the left.\n    As an example:`($x **= $y)` can be written as `($x = $x ** $y)`.\n\
    \    If the initial value stored in `$a` is 6, then `($a **= 2)` = 36.\n\nProgram:\
    \ To illustrate how assignment operators function:\n```perl\n# program to demonstrate\
    \ working of Assignment Operators\n#!/usr/local/bin/perl\n# taking two variables\
    \ & using ## the simple assignments operation\n$x = 8; $y = 5;\n# using the Assignment\
    \ Operators\nprint \"The Addition Assignment Operator: \", $x += $y, \"\\n\";\n\
    $x = 8; $y = 4;\nprint \"Subtraction Assignment Operator: \", $x -= $y, \"\\n\"\
    \ ;\n$x = 8; $y = 4;\nprint \"Multiplication Assignment Operator: \", $x*=$y,\
    \ \"\\n\";\n$x = 8; $y = 4;\nprint \"Division Assignment Operator: \",$x/=$y,\
    \ \"\\n\";\n$x = 8; $y = 5;\nprint \"Modulo Assignment Operator: \", $x%=$y,\"\
    \\n\";\n$x = 8; $y = 4;\nprint \"Exponent Assignment Operator: \", $x**=$y, \"\
    \\n\";\n```\n\n### Ternary Operator\n\nIt is conditional operator, which is simple\
    \ version of an if else statement. The term “ternary” refers to fact that it has\
    \ three operands. Depending on the value of Boolean expression, it will return\
    \ one of two values.\n\nNote: The condition in the ternary operator may also be\
    \ any expression generated by utilizing other operators such as relational operators\
    \ and logical operators.\n\n## VARIABLES IN PERL\n\nVariables are used throughout\
    \ Perl to store and manipulate data. A variable takes up memory space when it\
    \ is created. A variable’s data type assists the interpreter in allocating memory\
    \ and deciding what to store.\n"
