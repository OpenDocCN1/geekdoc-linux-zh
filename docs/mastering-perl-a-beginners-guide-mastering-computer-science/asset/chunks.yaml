    \\n\";\n$x = 8; $y = 4;\nprint \"Exponent Assignment Operator: \", $x**=$y, \"\
    \\n\";\n```\n\n### 三元运算符\n\n它是一种条件运算符，是 if else 语句的简易版本。“三元”一词指的是它有三个操作数。根据布尔表达式的值，它将返回两个值中的其中一个。\n\
    \n注意：三元运算符中的条件也可以是利用其他运算符（如关系运算符和逻辑运算符）生成的任何表达式。\n\n## PERL 中的变量\n\n变量在整个 Perl\
    \ 中用于存储和处理数据。变量在创建时会占用内存空间。变量的数据类型有助于解释器分配内存并决定存储什么。\n\n"
- fmt: '

    Variables are reserved memory locations for storing values. This means that creating
    a variable frees up memory space. The data type of a variable assists the interpreter
    in allocating memory and deciding what to store in reserved memory. Variables
    can thus store integers, decimals, or strings by assigning different data types
    to the variables.


    Perl has three basic data types, which are as follows:


    * Scalars

    * Arrays

    * Hashes


    As a result, Perl will employ three types of variables. A scalar variable, preceded
    by a dollar sign (`$`), can store a number, a string, or a reference. An array
    variable stores ordered lists of scalars, denoted by the `@` sign. The hash variable,
    preceded by sign `%`, will be used to store sets of key/value pairs.


    ### Creating Variables


    To reserve memory space, `perl` variables do not need to be explicitly declared.
    Like in other computer languages, the operand to the left of the `=` operator
    is the variable’s name, and the operand to the right of the `=` operator is the
    value stored in the variable.


    As an example: `$age = 30; $name = "Sima"; $rollno = 32;` Here `30`, `"Sima"`
    and `32` are the values assigned to `$age`, `$name` and `$rollno` variables, respectively.


    ### Scalar Variables


    A scalar is a single data unit. The data could be an integer number, a floating-point
    number, a character, a string, a paragraph, or an entire web page. Here’s an example
    of how to use scalar variables:


    ```perl

    #!/usr/bin/perl

    # Assigning the values to scalar # variables

    $age = 30; $name = "Sima"; $rollno = 32;

    # Printing the variable values

    print "Age = $age\n";

    print "Name = $name\n";

    print "Roll no = $rollno\n";

    ```


    ### Array Variables


    An array variable stores ordered list of scalar values. Array data type variables
    are preceded by “at” (`@`) sign. The dollar sign (`$`) refers to a single array
    element with the variable name followed by the element’s index in square brackets.
    Here’s an example of using an array variable:


    ```perl

    #!/usr/bin/perl

    # Assigning the values to Array variables

    @ages = (43, 70, 33);

    # @ is used to declare # the array variables

    @names = ("ABC", "DEF", "GHI");

    # Printing values of Arrays

    print "\$ages[0] = $ages[0]\n";

    print "\$ages[1] = $ages[1]\n";

    print "\$ages[2] = $ages[2]\n";

    print "\$names[0] = $names[0]\n";

    print "\$names[1] = $names[1]\n";

    print "\$names[2] = $names[2]\n";

    ```


    We used `\` before the `$` sign to print it as a statement. Otherwise, Perl will
    interpret it as a variable and print the value stored in it.


    ### Hash Variables


    Hash is a collection of the key-value pairs. Hash variables are preceded by a
    modulus (`%`) sign. In the hash, keys are used to refer to a single variable.
    In curly brackets, the hash variable name is followed by the key associated with
    the value to access these elements. Here is a simple example of a Hash variable:


    ```perl

    #!/usr/bin/perl

    # Defining Hash variable using ’%’

    %data = (’ABC’, 55, ’DEF’, 80, ’GHI’, 44);

    # Printing values of Hash variables

    print "\$data{’XYZ’} = $data{’ABC’}\n";

    print "\$data{’LGH’} = $data{’DEF’}\n";

    print "\$data{’KMR’} = $data{’GHI’}\n";

    ```


    ### Variable Context


    Perl treats the same variable differently depending on the context, i.e. the situation
    in which a variable is used.


    `@names` is an array that has been used two times in this context. First, we copied
    it into other array, i.e. a list, so that it would return all the elements if
    the context was a list context. The same array is then attempted to be stored
    in a scalar context, which by default returns just the number of elements in this
    array. The table below depicts the various contexts:


    | S. no. | Context and description |

    | --- | --- |

    | 1. | **Scalar** In a scalar context, assignment to a scalar variable evaluates
    the value to the right of “=”. |

    | 2. | **List** In a list context, assignment to an array or a hash evaluates
    the right of “=”. |

    | 3. | **Boolean** A boolean context is a location where an expression is evaluated
    to see whether it is true or false. |

    | 4. | **Void** This context does not care what the return value is, and it doesn’t
    even want one. |

    | 5. | **Interpolative** This context will only appear within quotation marks
    (“”) or with things that behave like quotation marks (“”). |


    ## SCOPE OF VARIABLES


    The scope of the variable is the area of program where the variable is accessible.
    The visibility of variables in a program is also referred to as a scope. We can
    declare global variables or private variables in Perl. Lexical variables are another
    name for private variables.


    ### The Scope of Global Variables


    Global variables can be used within any function or block that has been created
    within the program. It is visible throughout the program. Global variables can
    be used directly and are accessible from anywhere in the program.


    **First example:** At the start of the code, the variable `$name` is declared.
    It will be visible until the end of the file. Even within blocks. Even if they
    are included in the function declarations. If we change the variable within the
    block, the value for the rest of the code will change, even outside the block.


    ### Lexical Variables’ Scope (Private Variables)


    Private variables in Perl are defined by prefixing the variable with `my` keyword.
    The `my` keyword limits variables inside a specified function or block. A block
    can either be a for loop, a while loop, or a block of code surrounded by curly
    braces.


    The local variable’s scope is local; it exists just between these two curly brackets
    (block of code); this variable does not exist outside of this block. These variables
    are sometimes referred to as lexical variables. When private variables are used
    inside a function or block, the global variables with the same name are hidden.
    When a subroutine is called with a private variable, that variable may utilize
    inside the procedure. When the procedure terminates, the private variables are
    no longer usable.


    ### Package Variables


    Package scoping is an additional type of scoping in Perl. This is used when we
    need to create variables that can only be used in different namespaces. In every
    Perl program, the default namespace is “main.” The `package` keyword is used in
    Perl to define namespaces.


    In Perl, the `our` keyword only creates an alias for an existing package variable
    with the same name. Only within lexical scope of the `our` declaration can a package
    variable be used without qualifying it with the package name. A variable declared
    with `our` keyword is an alias for a package variable visible throughout its entire
    lexical scope, including across package boundaries.


    ## MODULES IN PERL


    In Perl, a module is a group of connected subroutines and variables that execute
    a set of programming tasks. Perl modules can reuse. The comprehensive Perl archive
    network (CPAN) hosts several Perl modules. These modules are divided into several
    categories, including network, CGI, XML processing, and database interface.


    ### Making a Perl Module


    A module’s name must be the same as the Package’s name and conclude with the `.pm`
    extension.


    The file is called `Calculator.pm` and is located in the directory `Calculator`.
    To return true value to the interpreter, `1` is placed at the end of the function.
    Instead of `1`, Perl accepts anything true.


    ### Importing and Using a Perl Module


    We utilize `need` or `use` functions to import this calculator module. `::` is
    used to access a function or variable from a module. Here’s an example to show:


    ```perl

    #!/usr/bin/perl

    # Using Package ’Calculator’

    use Calculator;

    print "Enter the two numbers to multiply";

    # Defining values to the variables

    $x = 15; $y = 20;

    # Subroutine-call Calculator::multiplication($x, $y);

    print "\nEnter the two numbers to divide";

    # Defining values to variables

    $x = 55; $y = 65;

    # Subroutine call Calculator::division($x, $y);

    ```


    ### Utilizing Module Variables


    Declaring variables from various packages before using them allows them to be
    utilized.

