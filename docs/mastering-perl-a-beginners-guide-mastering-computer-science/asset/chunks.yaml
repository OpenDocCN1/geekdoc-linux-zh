  trans: "\n\n-   要匹配字符串中的闭合方括号，只需在它前面加上 `\\` 即可，即 `\\]`，并将其放在方括号 `[]` 之间。\n\n反向字符类：简单地使用脱字符符号（`^`）来反转字符类。它会反转符号后面提供的字符甚至是一个范围。将脱字符（`^`）作为字符类的第一个字符，表示该字符类可以匹配除列出的字符以外的任何字符。\n\
    \n## 正则表达式中的特殊字符类\n\nPerl 具有几种不同的字符类，其中某些类的使用频率非常高，以至于为它们构建了特定的序列。编写自定义序列旨在让代码更易读、更简洁。Perl\
    \ 的特殊字符类如下：\n\n1. **数字 `\\d[0-9]`：** `d` 字符用于匹配任何数字字符，与 `[0-9]` 相同。正则表达式 `/\\\
    d/` 会匹配单个数字。`d` 已标准化为“digit（数字）”。其主要优势是用户可以编写更短、更易读的形式。这种独特的字符类有两种用法。让我们通过示例来了解如何匹配字符字符串。\n\
    \n    正如前面提到的，字符字符串匹配情况如下：#M-12345 #N-66666\n\n    在这种情况下，我们也可以通过将量化符放在字符类上来利用它们。\n\
    \n    上面的示例与之前的正则表达式相同，它接受连字符后任意数量的数字，可以表示为 `/#[MNOPQ]-\\d+/`。\n\n    在较大的字符类中，使用了第二种技术。`\\\
    d` 被方括号包围，匹配单个数字字符。\n\n    可以匹配单个数字或任何大写字母 `A`、`B`、`C`、`D`、`E`、`F`、`G`、`H`、`I`、`J`、`K`、`L`、`M`\
    \ 或 `N`。可以使用连字符（`-`）更简洁地编写，例如：`[\\dA-N]`\n\n2. **POSIX 字符类：** POSIX 字符类是确保操作系统兼容性和建立包括命令行\
    \ shell 和实用程序接口的标准的标准。它还提供了许多命名（如 `alpha`、`alnum`、`ascii`、`blank` 等）的“字符分组”。POSIX\
    \ 字符类始终采用 `[:class:]` 形式，其中 `class` 是名称，分隔符是 `[:` 和 `:`。POSIX 字符类始终包含在括号字符类中。这些类提供了一种列出字符集合的快速方便的方法。\n\
    \n    在这里，`class` 可以是 `alpha`、`alnum`、`ascii` 等。\n\n    所示，POSIX 字符类支持更大的括号字符类：`[01[:Class:]%]`\n\
    \n    在这种情况下，它将匹配“0”、“1”、任何字符类以及 `%` 符号。Perl 支持下表所示的 POSIX 字符类：\n\n    | 类 | 描述\
    \ |\n    | --- | --- |\n    | Alpha | 任何字母字符 (`[A-Za-z]`) |\n    | Alnum | 任何字母数字字符\
    \ (`[A-Za-z0-9]`) |\n    | Ascii | ASCII 字符集中的任何字符 |\n    | blank | 空格或水平制表符 |\n\
    \    | Cntrl | 任何控制字符 |\n    | Digit | 任何十进制数字 (`[0-9]`) |\n    | graph | 除空格以外的任何打印字符\
    \ |\n    | lower | 任何小写字符 (`[a-z]`) |\n    | punct | 任何图形字符 |\n    | space | 任何空白字符\
    \ |\n    | upper | 任何大写字符 (`[A-Z]`) |\n    | xdigit | 任何十六进制数字 (`[0-9a-fA-F]`)\
    \ |\n    | word | Perl 扩展 (`[A-Za-z0-9_]`)，等同于 `\\w` |\n\n3. **单词字符 `\\w[0-9a-zA-Z\
    \ ]`：** 字母 `w` 属于单词字符类。`w` 字符可以是任意字母数字字符，包括字母、十进制数字或如下划线（`_`）之类的标点符号。它只匹配单词单词，而不是整个单词。如果我们想匹配整个单词，请使用\
    \ `\\w+`。\n\n4. **空白字符 `\\s[\\t\\n\\f\\r ]`：** 字符类 `\\s` 只匹配一个字符，即空白字符。它还会匹配五个字符：`\\\
    t`-水平制表符、`\\n`-换行符、`\\f`-分页、`\\r`-回车和空格。在 Perl 5.18 中，引入了对应于 `\\cK`-垂直制表符的新字符。\n\
    \n5. **反向字符类 `\\D`、`\\W`、`\\S`：** 在这个宇宙中，几乎有 110,000 个 Unicode 字符。只需使用脱字符符号（`^`）来反转字符类。它会反转符号后指定的字符甚至是一个范围。我们在反向字符类中使用\
    \ `[^\\d]` 来反转数字 0 到 9。然而，与其使用 `[^\\d]`，我们可以使用 `\\D` 来反转数字 0 到 9。下表描述了特殊的反向字符类：\n\
    \n    | 字符类 | 反向 | 含义 | 描述 |\n    | --- | --- | --- | --- |\n    | `\\d` | `\\\
    D` | `[^\\d]` | 匹配任何非数字字符 |\n    | `\\s` | `\\S` | `[^\\s]` | 匹配任何非空白字符 |\n  \
    \  | `\\w` | `\\W` | `[^\\w]` | 匹配任何非“单词”字符 |\n\n6. **Unicode 字符类：** Unicode 是“所有”现有字符的定义，Unicode\
    \ 标准为每个平台无关的字符分配了唯一的数字。这个星球上有超过 100,000 个字符，每个字符都被指定为一个字符点。然而，某些字符被分组了。\n\n  \
    \  这种语法匹配一个分组中的单个字符。如果我们需要匹配特定字符以外的任何内容，请使用匹配 `\\P{…任意字符…}` 表达式。\n\n## 正则表达式中的量化符\n\
    \nPerl 具有几种正则表达式量化符，它们可以决定特定字符在匹配之前可以重复的次数。这主要用于待匹配字符数量不确定的情况。\n\n### Perl 量化符分为六类，列下所示：\n\
    \n1. `*` = 表示该组件必须出现零次或多次。\n2. `+` = 表示该组件必须出现一次或多次。\n3. `?` = 指定该组件必须出现零次或一次。\n\
    4. `{n}` = 指定该组件必须存在 n 次。\n5. `{n,}` = 指定该组件必须至少出现 n 次。\n6. `{n, m}` = 指定该组件必须出现至少\
    \ n 次且不超过 m 次。\n\n### 量化符表\n\n上述所有类型可以使用此表理解，该表包含了正则表达式量化符和示例。\n\n| 正则表达式 | 示例\
    \ |\n| --- | --- |\n| `/Bx*B/` | BB, BxB, BxxB, BxxxB, ….. |\n| `/Bx+B/` | BxB,\
    \ BxxB, BxxxB, ….. |\n| `/Bx?B/` | BB, BxB |\n| `/Bx{1, 3}B/` | BxB, BxxB, BxxxB\
    \ |\n| `/Bx{2, }B/` | BxxB, BxxxB, ….. |\n| `/Bx{4}B/` | BxxxxB |\n\n让我们看看这些量化符的一些示例。\n\
    \n**第一个示例：** 在此示例中，`*` 量化符被用于正则表达式 `/Pe*ks/`，它产生“Pks”、“Peks”、“Peeks”……等等，并与输入文本“Pks”匹配，匹配成功。\n\
    \n**第二个示例：** 在此示例中，`+` 量化符被用于正则表达式 `/Pe+ks/`，它产生“Peks”、“Peeks”、“Peeks”……等等，并与输入文本“Pks”匹配，匹配失败。\n\
    \n**第三个示例：** 在此示例中，`?` 量化符被用于正则表达式 `/Pe?ks/`，它产生“Peks”或“Pks”，并与输入文本“Peks”匹配，匹配失败。\n\
    \n**第四个示例：** 在此示例中，`{n}` 量化符被用于正则表达式 Pe{2}ks，它产生“Peeks”，并与输入文本“Peeks”匹配，匹配成功。\n\
    \n**第 5 个示例：** 在此示例中，`{n, }` 量化符被用于正则表达式 `/Pe{2, }ks/`，它产生“Peeks”、“Peeeks”、“Peeeeks”等等，当与输入文本“Peks”匹配时，返回匹配失败。\n\
    \n**第六个示例：** 在此示例中，`{n, m}` 量化符被用于正则表达式 `/Pe{1, 2}ks/`，它产生“Peks”和“Peeks”，并与输入文本“Peeks”匹配，匹配失败。\n\
    \n"
- fmt: "\nA regular expression (a.k.a. regexes, regexps, or REs) in Perl is a means\
    \ of representing a group of strings without having to describe all strings in\
    \ your program. It is essentially a series of characters used for pattern matching.\
    \ Regex have several uses in Perl:\n\n* To begin with, they are used in conditionals\
    \ to assess if a string matches a specific pattern.\n\n  **For example:** Regex\
    \ in conditionals\n  ```perl\n  #!/usr/bin/perl # Regular expressions in the Conditionals\
    \ # Program to determine whether string # matches particular pattern \n  print\
    \ \"How are you feeling?\\n\"; my $stmt = <>; print($stmt); if ($stmt == /hungry/)\
    \ { print \"\\n What do we wish to have?\\n\"; my $ip = <>; print($ip); }\n  ```\n\
    \  Here, the user’s input is matched; if we have the word “hungry,” i.e. if condition\
    \ is true, it will print “What do we wish to have?” Otherwise, it will go to the\
    \ following condition or statement.\n\n* Second, they may find patterns in a string\
    \ and replace them with something else.\n\n  **For example:** Substitution operator\n\
    \  ```perl\n  #!/usr/bin/perl # Regular expressions in the Substitutions # Program\
    \ to determine whether string # matches particular pattern and replaces it \n\
    \  print \"Whats your thought on life\\n\"; my $stmt = <>; print ($stmt); # Substitution\
    \ using the regex $stmt =~ s/worst/good/; print (\"\\n$stmt\");\n  ```\n  The\
    \ preceding code uses “good” instead of “worst.”\n\n* Finally, patterns can describe\
    \ not just where something exists but also where it does not exist. As a result,\
    \ the `split` operator employs a regular expression to identify where the data\
    \ does not exist. In other words, the regular expression specifies the separators\
    \ that separate data fields.\n\n  **For example:** Split operator\n  ```perl\n\
    \  #!/usr/bin/perl # Program to illustrate the # use of split function \n  $var1\
    \ = \"Birth\"; $var2 = \"Life\"; $var3 = \"Death\"; # Using split function \n\
    \  my ($var1, $var2, $var3) = split(/, /, \"sab, mohmaya, hai\"); print($var1);\
    \ print($var2); print($var3);\n  ```\n  The `split` function matches on single\
    \ comma character in the preceding example.\n\n## BACKTRACKING\n\nBacktracking\
    \ is another key aspect of regular expression matching, which is now employed\
    \ (when needed) by all regular non-possessive expression quantifiers, namely `*`,\
    \ `*?`, `+`, `+?`, `{n, m}`, and `{n, m}?`. Backtracking is frequently optimized\
    \ internally, but the overall notion above is correct (it returns from a failed\
    \ recursion on a tree of possibilities). When Perl attempts to match patterns\
    \ with a regular expression and its previous attempts fail, or when the matching\
    \ patterns are saved for future use, it backtracks.\n\nFor instance, `/.*?/` may\
    \ be used to match anything comparable to an HTML tag such as “Bold.” This forces\
    \ the pattern’s two parts to match the same string, in this instance “B.”\n\n\
    Consider another example `/^ab*bc*d/`\n\n### The preceding regexp can be interpreted\
    \ as follows:\n\n1. Begin at the start of the string.\n2. Match an “a.”\n3. Match\
    \ as many “b”s as possible, although failing to match any is OK.\n4. Match as\
    \ many “c”s as possible, although failing to match any is OK.\n5. Match as many\
    \ “d”s as we can, although not all are required.\n\n## “e” MODIFIER IN REGULAR\
    \ EXPRESSION\n\nThe regular expression in Perl allows us to execute numerous actions\
    \ on a given text using appropriate operators. These operators can execute operations\
    \ such as string modification, substituting other substrings, and so on. Substitution\
    \ of a substring in a given string is accomplished with the `s` (substitution)\
    \ operator, which accepts two operands: the substring to be replaced and the replacement\
    \ string.\n\nFurthermore, the `e` modifier is used to replace the substring with\
    \ a replacement string that is a regular expression to be evaluated. The `e` modifier\
    \ is added to the substitution expression.\n\nThe `e` modifier can also use with\
    \ the `g` (globally) modifier to affect all possible substrings in the specified\
    \ string.\n\n**First example:** Substitution using a character class\n```perl\n\
    #!/usr/bin/perl # Defining string to be converted \n$String = \"Peeks for Peeks\
    \ is the best\"; print \"The Original String: $String\\n\"; # Converting string\
    \ to UPPERCASE # using ’uc’ Function \n$String =~ s/(\\w+)/uc($1)/ge; print\"\
    Uppercased String: $String\\n\"; # Converting string to lowercase # using ’lc’\
    \ Function \n$String =~ s/(\\w+)/lc($1)/ge; print\"Lowercased String: $String\\\
    n\";\n```\nThe above code uses the character class `\\w`, which contains the lower\
    \ and upper case alphabets and all digits (a-z|A_Z|0-9). This is used to replace\
    \ the entire string with a single replacement operation.\n\n**Second example**:\
    \ Use a single letter or word for a particular substitution.\n\nThe string after\
    \ updating will not revert to its original value, even after the second recursion,\
    \ as seen in the preceding code.\n\n### The Substitution Operation Is Performed\
    \ using a Subroutine\n\nSubroutine substitution in Perl regex may also be done\
    \ using subroutines to eliminate the repetition of writing the substitution regex\
    \ for each string. This is accomplished by inserting the regex code in the subroutine\
    \ and invoking it as needed.\n\nWhen the substitution operation begins in the\
    \ preceding code, it calls the subroutine `change_substitution`, which contains\
    \ the regex code for changing the substring that matches the search.\n\n## REGEX\
    \ “ee” MODIFIER\n\nThe regular expression in Perl allows you to execute numerous\
    \ actions on a given text using appropriate operators. These operators can execute\
    \ operations such as string modification, substituting other substrings, and so\
    \ on. Substitution of a substring in a given string is accomplished with the `s`\
    \ (substitution) operator, which accepts two operands: the substring to be replaced\
    \ and the replacement text.\n\nIn Perl, modifiers match a string with a specified\
    \ pattern using a regular expression. In Perl, the `ee` modifier is equivalent\
    \ to the `\\e` modifier. It is used to evaluate the string on the right and then\
    \ to assess the result further. In Perl, it is equivalent to the double `eval`\
    \ operator. The `\\e` operator is used to evaluate the string on the right. `\\\
    ee` is one step ahead of it. It uses the `\\e` operator on a string that already\
    \ has the `e` operator.\n\nThe `ee` modifier, like the `e` modifier, can be combined\
    \ with the `g` (globally) modifier to apply modifications to all possible substrings\
    \ in the provided string.\n\nThis is because when the `e` modifier is applied,\
    \ the regex considers the RHS to be the evaluated string to be used as a replacement;\
    \ in this case, the RHS is `$1`, which retains `$var` but not its value. As a\
    \ result, applying the `ee` modifier will re-evaluate the RHS, which contains\
    \ the already eval’d value `$var`.\n\n### When Doing Mathematical Calculations,\
    \ Use the “ee” Modifier\n\nIf a mathematical expression is contained in a string,\
    \ the value of the expression is not evaluated and is displayed as is. This is\
    \ because it is seen as both a string and an expression to be evaluated.\n\nThe\
    \ expression in the above code is written in Regex, using the `d+` operator for\
    \ writing one or more digits, the `[+*/]` character class for the operator symbol,\
    \ and then another `d+` for the digit. The `ee` modifier evaluates the string\
    \ and returns the expression’s total, which is displayed with the `$1` operator.\n\
    \nThe above regex may also be kept in a subroutine and used to evaluate different\
    \ expressions without having to rewrite the regex.\n\nA single regex can be used\
    \ in the given code to execute four mathematical calculations utilizing the subroutine.\n\
    \n## pos() FUNCTION IN REGULAR EXPRESSION\n\nThe `pos()` function in Perl returns\
    \ the position of the last match in Regex using the `m` modifier.\n\nThe `pos()`\
    \ function in Regex can be used in conjunction with the character classes to return\
    \ list of all the required substring positions in given string. To search for\
    \ a substring within the entire text, use the global operator `g` in conjunction\
    \ with the `m` modifier.\n"
