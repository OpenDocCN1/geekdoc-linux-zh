  raw: 'Polymorphism is the capability of processing data in several forms. Poly means
    numerous, and morphism implies kinds; therefore, the term itself shows the meaning.
    Polymorphism is one of the most fundamental concepts of an OOP language. In OOP,
    polymorphism is often employed when a parent class reference refers to a child
    class object. This section will examine how to express any function in several
    kinds and formats.


    A real-world example of polymorphism is that a person may simultaneously play
    multiple roles in life. As a woman simultaneously fulfills the roles of mother,
    wife, employee, and daughter. Therefore, a single individual must possess various
    characteristics, each of which must be implemented according to the scenario and
    conditions. Polymorphism is regarded as one of the OOP’s most essential characteristics.


    OOP’s primary advantage is polymorphism. Polymorphism is so essential that languages
    that do not support it cannot call themselves object-oriented. Object-based languages
    are those that have classes but do not support polymorphism. Consequently, it
    is crucial for OOP language. It is the ability of an object or reference to take
    on multiple forms in different contexts. It supports function overloading, function
    overriding, and virtual functions.


    ![](images/ufig7_7.jpg)


    Polymorphism in OOP.


    Polymorphism is a property that allows any message to be sent to objects of multiple
    classes, and each object can respond appropriately based on the class properties.


    This means that in an OOP language, polymorphism is the method that does different
    things depending on the class of the object that calls it. $square->area(), for
    example, will return the area of a square, whereas $triangle->area() may return
    the area of a triangle. $object->area(), on the other hand, would have to calculate
    the area based on which class $object was called.


    Polymorphism is best explained by using the following example: use warnings; #
    Creation of class using package package A; # Constructor-creation sub new { #
    shift will take package name ’vehicle’ # and assign it to the variable ’class’
    my $class = shift; my $self = { ’name’ => shift, ’roll_no’ => shift }; sub poly_example
    { print("This corresponds to a class A\n"); } }; package B; # The @ISA array contains
    a list # of that class’s parent classes, if any my @ISA = (A); sub poly_example
    { print("This corresponds to a class B\n"); } package main; B->poly_example();
    A->poly_example();


    The method poly_example() defined in class B overrides the definition inherited
    from class A for the first output and vice versa for the second output. This allows
    you to add or extend the functionality of any pre-existing package without having
    to rewrite the entire definition of the class repeatedly. As a result, the programmer’s
    life is made more accessible.


    ## ENCAPSULATION IN OOPs


    Encapsulation in Perl is the process of enclosing data to secure it from external
    sources that should not have access to that section of code. Encapsulation is
    a component of OOP; it ties data to the subroutines that change it. Encapsulation
    is, in another sense, a protective barrier that prevents the data from being accessible
    by code outside of this shield.


    *   Technically, under encapsulation, variables or data of a class are concealed
    from other classes and may only be accessible through member functions of the
    class in which they are defined.


    *   As with encapsulation, the data inside a class is concealed from other classes;
    hence, it is sometimes referred to as data-hiding.


    *   Encapsulation may be performed by declaring all class variables as local and
    retrieving class methods by importing packages to set and retrieve variable values.


    ![](images/ufig7_8.jpg)


    Encapsulation in OOP.


    Consider a real-world example of the encapsulation: in a business, there are several
    departments, such as accounts, finance, and sales. The finance sector conducts
    all financial transactions and maintains records of all financial data.


    Similarly, the sales department conducts all sales-related operations and maintains
    sales data. Now, there may be a situation in which a finance department official
    needs complete sales information for a given month. In this instance, he is not
    permitted direct access to the sales section’s data. He must first call another
    officer in the sales department and then request that individual data be provided.


    This describes encapsulation. Here, the sales section’s data and the people who
    may change them are grouped under the name “sales section.”


    If there is a need to access the class’ data for any modifications or simply to
    print the class’ data in the above code, it cannot be done directly. It is essential
    to create an object of that class and then use the get_details() method to access
    the data. This is referred to as Data Encapsulation.


    **The benefits of encapsulation are:**


    *   Data-hiding: The user will be unsure of the inner implementation of the class.
    The user cannot see how the class stores data in its variables. They are just
    conscious that we are giving values to accessors, and variables are being initialized
    with those values.


    *   Enhanced flexibility: We may make the class variables read-only or write-only
    depending on our needs. To make variables read-only, we need to utilize Get Accessor
    in the code. To make variables read-only, we must only utilize the Set Accessor.


    *   Reusability: Encapsulation also promotes reusability and makes it simple to
    adapt to new needs.


    *   Verifying code is simple: Encapsulated code is simple to unit test.


    This chapter covered OOP in Perl with classes and objects, methods, constructors,
    and destructors. Furthermore, we discussed method overriding, inheritance, polymorphism,
    and encapsulation.


    ## NOTE


    # CHAPTER 8Subroutines in Perl


    DOI: [10.1201/9781003358442-8](https://doi.org/10.1201/9781003358442-8)


    ## IN THIS CHAPTER


    *   Function Signature


    *   Passing Complex Parameters to a Subroutine


    *   Mutable and Immutable parameters


    *   Multiple Subroutines


    *   Use of return() Function


    *   Pass By Reference


    *   Recursion


    In the previous chapter, we discussed object-oriented programming in Perl, and
    in this chapter, we will cover subroutines.


    ## SUBROUTINES OR FUNCTIONS


    A Perl function or subroutine is a collection of statements that execute a specific
    purpose. In any programming language, code reuse is desired. Therefore, the user
    places the chunk of code in a function or subroutine to eliminate the need to
    write code repeatedly. In Perl, the phrases function, subroutine, and method are
    synonymous, although they are distinct in other programming languages. The term
    subroutines is the most common in Perl programming since it is formed with the
    keyword sub. Whenever a function is called, Perl suspends the execution of the
    whole program, jumps to the function to execute it, and then returns to the previous
    area of code. One need not use the return statement.


    ### Determining Subroutines


    The general form of subroutine definition in Perl is as follows: sub subroutinename
    { # body of the method or subroutine }


    ### Calling Subroutines


    Subroutines in Perl can invoke by passing the arguments list to it as follows:
    subroutinename(arugumentslist);


    The method described above will only work with Perl versions 5.0 and later. There
    was another way to call the subroutine before Perl 5.0, but it is not recommended
    because it bypasses the subroutine prototypes.


    ### Passing Parameters to Subroutines


    This is used to pass values as arguments to subroutines. This is accomplished
    using the special list array variables “$_.” This will be assigned to the functions
    as $_[0], $_[1], etc.


    **Subroutines have the following advantages:**


    *   It allows us to reuse code and makes error detection and debugging easier.


    *   It aids in the structural organization of the code.


    *   Sections of code are organized in chunks.


    *   It improves code readability.'
