    \ from directly altering the object’s data. Various helper methods that accept\
    \ the object as an argument and save its value in another variable make this possible.\
    \ Additionally, adjustments are made to the second variable. These changes do\
    \ not affect the object’s data, making it more secure.\n\n### Types of Methods\
    \ in Perl\n\nBased on the inputs given, methods in Perl may be divided into two\
    \ categories: static and virtual methods.\n\nA static method is one where the\
    \ method’s first parameter is the class name. The functionality of a static method\
    \ is applied to the whole class since it accepts the class' name as an argument.\
    \ These are also known as class methods. Since most methods belong to the same\
    \ class, it is unnecessary to supply the class name as an argument. Example: A\
    \ class’ constructors are considered static methods.\n\nVirtual method is one\
