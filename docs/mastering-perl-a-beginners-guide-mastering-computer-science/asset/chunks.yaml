    \ be combined with the “g” (globally) modifier to apply modifications to all possible\
    \ substrings in the provided string.\n\nThis is because when the “e” modifier\
    \ is applied, the regex considers the RHS to be the evaluated string to be used\
    \ as a replacement; in this case, the RHS is $1, which retains $var but not its\
    \ value. As a result, applying the “ee” modifier will re-evaluate the RHS, which\
    \ contains the already eval’d value $var.\n\n### When Doing Mathematical Calculations,\
    \ Use the “ee” Modifier\n\nIf a mathematical expression is contained in a string,\
    \ the value of the expression is not evaluated and is displayed as is. This is\
    \ because it is seen as both a string and an expression to be evaluated.\n\nThe\
    \ expression in the above code is written in Regex, using the “d+” operator for\
    \ writing one or more digits, the [+*/-] character class for the operator symbol,\
    \ and then another “d+” for the digit. The “ee” modifier evaluates the string\
    \ and returns the expression’s total, which is displayed with the $1 operator.\n\
    \nThe above regex may also be kept in a subroutine and used to evaluate different\
    \ expressions without having to rewrite the regex.\n\nA single regex can be used\
    \ in the given code to execute four mathematical calculations utilizing the subroutine.\n\
    \n## pos() FUNCTION IN REGULAR EXPRESSION\n\nThe pos() function in Perl returns\
    \ the position of the last match in Regex using the “m” modifier.\n\nThe pos()\
    \ function in Regex can be used in conjunction with the character classes to return\
    \ list of all the required substring positions in given string. To search for\
    \ a substring within the entire text, use the global operator “g” in conjunction\
    \ with the “m” modifier."
