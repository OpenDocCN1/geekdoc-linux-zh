  trans: '


    * Perl 支持跨平台兼容性以及诸如 `HTML`、`XML` 等标记语言。

    * 它在文本处理方面特别高效，即 `Regex`。它还具备 socket get。

    * 自由开源软件根据艺术许可协议（Artistic License）和 GNU 通用公共许可证（`GPL`）发布。

    * 因为它是一种嵌入式语言，所以它可以用于 Web 服务器和数据库服务器。

    * 它支持 `CPAN`（全面 Perl 归档网络）上的约 25,000 个开源模块，这些模块为标准库提供了许多有用的增强功能，例如 `XML` 处理、`GUI`
    和 `DI` 等。


    ### Perl 的缺点

    * 由于 CPAN 模块的存在，Perl 不支持移植性。

    * 程序运行速度慢，且每次进行更改后都必须进行解释。

    * 在 Perl 中，可以通过多种方法获得相同的结果，导致代码变得混乱且难以阅读。

    * 与其他语言相比，其易用性因素较低。


    ### 应用

    * 文本文件处理和字符串分析是 Perl 语言的主要用途。

    * Perl 也用于 `CGI` 脚本。

    * 用于 Web 开发和 `GUI` 设计。

    * Perl 的文本处理功能也被用于生成 `SQL` 查询。


    ## 在 WINDOWS、LINUX 和 MACOS 上安装和配置 PERL


    在我们的系统（无论是 Windows、Linux 还是 Macintosh）上安装 Perl 是第一步。我们必须直接了解 Perl 编程语言是什么以及它能实现什么。


    Perl 是一种动态的、高级、解释型的通用编程语言。Perl 最初是为文本处理而设计的，例如从特定的文本文件中提取必要信息并将文本文件转换为新格式。Perl
    支持过程化和面向对象的编程。Perl 的语法与 `C` 相似，使得 `C` 和 `C++` 程序员能够轻松上手。


    可以使用任何纯文本编辑器（如 `notepad`、`notepad++` 或其他应用程序）使用 Perl 进行编程。人们可以使用在线 IDE，也可以在机器上安装一个，以使创建
    Perl 程序变得更容易。由于 IDE 具有许多功能（如直观的代码编辑器、调试器和编译器），使用 IDE 可以创建 Perl 代码更加简单。在开发 Perl
    代码和执行许多有趣且有益的操作之前，必须在系统上安装 Perl。这可以通过下面提供的详细方法来实现：


    **检查是否预装了 Perl 版本：** 在开始安装 Perl 之前，最好检查系统是否已经安装了它。许多软件应用程序需要 Perl 来执行其操作，因此 Perl
    版本可能包含在软件的安装包中。如果是这样，则无需重新下载和安装 Perl。


    Macintosh 在其计算机上也预装了 Perl。许多 Linux 系统预加载了 Perl。只需使用命令提示符查看设备上是否预加载了 Perl。


    （对于 Windows，在运行对话框（window + R）中输入 `cmd`；对于 Linux，按下 Ctrl+Alt+T；对于 macOS，按下 Control+Option+Shift$.)


    现在执行以下命令：


    ```bash

    perl -v

    ```


    如果已经安装了 Perl，将生成包含 Perl 版本所有详细信息的消息；否则，将生成一条命令无效或文件名错误的错误信息。


    ## PERL 下载与安装


    ### Perl 下载：

    * 在开始安装过程之前，我们需要下载它。为此，Windows、Linux 和 macOS 的所有版本 Perl 均可在 [`www.perl.org/get.html`](https://www.perl.org)
    获取。


    ![](img/ufig1_1.jpg)

    Perl 下载。


    * 通过下载并遵循安装说明来安装 Perl。


    ### 开始 Windows 安装：

    * 完成用户许可协议。

    * 决定安装哪些内容。

    * 安装程序。

    * 完成安装。


    在完成安装程序后，可以使用任何 IDE 或文本编辑器来开发 Perl 代码，然后可以在 IDE 或命令提示符中使用以下命令运行代码：

    ```bash

    perl file1.pl

    ```


    ### 开始 Linux 安装：

    * 修改安装 Perl 的路径。

    * 开始安装过程。

    * 选择 Perl 安装目录。

    * 完成安装。

    * 一旦安装过程完成，可以使用任何 IDE 或文本编辑器创建 Perl 代码，然后可以在 IDE 或命令提示符中使用以下命令启动：

    ```bash

    perl file1.pl

    ```


    ### 开始 macOS 安装：

    * 开始。

    * 完成用户许可协议。

    * 选择安装位置。

    * 安装程序。

    * 安装现已完成。

    * 在完成安装程序后，可以使用任何 IDE 或文本编辑器开发 Perl 代码，然后可以在 IDE 或命令提示符中使用以下命令运行：

    ```bash

    Perl file.pl

    ```


    ## HELLO WORLD 程序


    Perl 是一种专门为文本处理开发的计算机语言。该缩写代表“实用提取和报告语言”（Practical Extraction and Report Language）。它与多个系统兼容，包括
    Windows、Mac OS 和几乎所有的 UNIX 变体。每种编程语言中的 Hello Everyone! 程序都为初学者学习该语言提供了一个开端。


    简单的 Hello everyone 程序的运行是在屏幕上打印“Hello Everyone!”。


    一个简单的 Perl 程序包含以下执行步骤：


    * **步骤 1：** 将文件传输给 Perl 解释器。

    在 Perl 中，第一行始终以字符 `#!` 开始。它指示 Perl 解释器如何执行该文件。文件应该移动到 `/usr/bin/Perl` 子目录，其中包含
    Perl 解释器。

    ```bash

    #!/usr/bin/perl

    ```


    * **步骤 2：** Perl 指令（Pragma）

    Pragma 是 Perl 包中的一个特殊模块，用于控制编译时或运行时的各种行为，例如严格性或警告。因此，以下是：

    ```perl

    use strict;

    use warnings;

    ```


    * **步骤 3：** 使用 `print()` 函数。

    最后，我们使用 Perl 的 `print()` 方法显示字符串以输出结果。

    ```perl

    print("Hello Everyone\n");

    ```


    ### 重要点：

    * 文件必须以 `.pl` 扩展名保存。

    * Perl 包目录必须与程序文件保存的位置相同。


    ## PERL 程序的基础语法


