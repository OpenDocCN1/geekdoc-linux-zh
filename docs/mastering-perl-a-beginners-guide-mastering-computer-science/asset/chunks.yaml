    # 第 1 章 引言


    DOI: [10.1201/9781003358442-1](https://doi.org/10.1201/9781003358442-1)


    ## 本章内容


    *   Perl 简介

    *   安装与环境搭建

    *   Hello World 程序


    Perl 是一种高级、解释型且动态的通用编程语言。


    '
- fmt: '

    It was created in 1987 by Larry Wall. Although “Practical Extraction and Reporting
    Language” is the most common expansion, there is no official full form of Perl.
    Some programmers refer to Perl as “Pathologically Eclectic Rubbish Lister” and
    “Practically Everything Likable.” The abbreviation “Practical Extraction and Reporting
    Language” is often used since Perl was initially designed for text processing,
    such as extracting the necessary information from a specific text file and converting
    the text file to a new format. Perl supports both procedural and object-oriented
    programming.


    Perl is syntactically similar to C, making it accessible to C and C++ programmers.


    ## Evolution of Perl


    It all began when Larry Wall was tasked with generating reports from several text
    files containing cross-references. Then he began using `awk` for this work but
    quickly realized it was insufficient. Instead of designing a tool for this purpose,
    he created a new programming language, Perl, and its interpreter. He built the
    Perl programming language in `C`, using principles from `awk`, `sed`, and `LISP`,
    among others. Perl was initially designed only for system administration and text
    processing, but subsequent versions included the ability to manage regular expressions
    (`Regex`) and network sockets. Presently, Perl is renowned for its capability
    to handle `Regex`. The first release of Perl was version 1.0 on December 18, 1987.
    `5.28` is the most recent version of Perl. Perl 6 is distinct from Perl 5 since
    it is a reimplementation of Perl 5 that is entirely object-oriented.


    ## Why Perl?


    Perl’s popularity and demand stem from a variety of factors. Some of the causes
    are as follows:


    * Perl is a high-level language; thus, it is similar to other popular programming
    languages such as `C` and `C++`, making it simple for anybody to learn.

    * Text-processing: As the name “Practical Extraction and Reporting Language” suggests,
    Perl has powerful text manipulation capabilities, allowing it to create reports
    from various text files readily. Additionally, it may convert the files to a different
