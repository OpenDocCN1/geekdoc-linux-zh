    When a file is opened in write mode with `">”`, the existing file’s content is
    destroyed, and content added with the print statement is written to the file.
    In this mode, the writing point is set to the end of the file. So the old file
    content is preserved, and everything written to the file using the print statement
    is appended to the end of the file. However, a read operation cannot execute until
    the file is opened in `+>>` mode, indicating add and read.


    The program operates as follows:


    * Step 1: Open a file in read mode to view the file’s existing content.

    * Step 2: Print the file’s existing content.

    * Step 3: Add material to the file by opening it in Append mode.

    * Step 4: Collect user text to attach to a file.

    * Step 5: Add text to the file.

    * Step 6: Re-read the file to determine if the content has been changed.

    * Step 7: File closure.


    ## CSV FILE READING


    Perl was originally intended for text processing, such as extracting information
    from a text file and converting it to a new format. In Perl, reading a text file
    is a pretty frequent activity. For example, reading CSV (comma-separated value)
    files to extract data and information is a common task.


    A CSV file can be created using any text editor, such as notepad, notepad++, or
    others. After adding material to a notepad text file, save it as a CSV file with
    the `.csv` extension.


    **A CSV file example:**


    ![](images/ufig5_1.jpg)


    CSV file example.


    A CSV file can be used to handle database record files for an enterprise or organization.
    These files can be opened with ease in Excel and can be edited with any compatible
    application. Perl also enables the processing and construction of these “csv”
    files by extracting values from the file, modifying these values, and inserting
    the modified values back into the file. We will use the `split` function to extract
    every value from a particular line.


    ### Use of Split() for Data Extraction


    `split()` is a standard Perl function used to divide a string into sections using
    a delimiter. This delimiter can be any character specified by the user; however,
    we usually use a comma.


    `split()` accepts two arguments. The first is a delimiter, and the second is the
    string to be divided.


    The following procedures are used to divide lines in a CSV file into sections
    using a delimiter:


    * Step 1: Read file line by line.

    * Step 2: Put all the values from each line into an array.

    * Step 3: To obtain the result, print out all the data individually.


    Let’s look at an example to grasp the subject better. The `split()` method is
    used to divide the strings recorded in the `new.csv` file using a delimiter, as
    seen below:


    ```

    use strict; my $file = $ARGV[0] or die; open(my $data, ’<’, $file) or die; while
    (my $line = <$data>) { chomp $line; # Split line and store it # inside words array
    my @words = split ", ", $line; for (my $x = 0; $x <= 2; $x++) { print "$words[$x]
    "; } print "\n"; }

    ```


    Save the preceding code in a text file with the extension `.pl`. We’ll store it
    as `test1.pl` in this case.


    Use the following command to run the previously stored file: `perl test1.pl new.csv`


    ### Character Escaping a Comma


    Sometimes a file has a comma inside the fields of a string that, if deleted, changes
    the interpretation of the data or renders the record unusable. If a `split()`
    function is used in this case, even if it is within quotes, it will divide the
    data each time it encounters a comma as a delimiter because `split()` does not
    care about quotes and does not understand CSV. It just cuts when it encounters
    the separator character.


    The following is a CSV file with a comma between the quotes:


    ![](images/ufig5_2.jpg)


    Character escaping a comma.


    The first field in the above CSV file includes a comma; thus, it is closed within
    quotes. However, if we execute the `split()` method on this file, it will ignore
    any such quotes.


    The `split()` method in the above program broke the string field into pieces even
    though it was between quotes; moreover, because we were printing just three fields
    in our code, the third field of the last string was discarded in the output file.


    To handle such scenarios, Perl has several constraints and scopes that allow the
    compiler to bypass the division of fields within quotes.


    We utilize `TEXT::CSV`, which provides a full CSV reader and writer. `TEXT::CSV`
    is a Perl MCPAN module that adds numerous additional features such as reading,
    parsing, and writing CSV files. The following pragma can be used to include these
    modules in the Perl program: `use Text::CSV`


    However, we must first download and install this module in our device to use its
    features.


    ### Installation of the TEXT::CSV


    For Windows: `perl -MCPAN -e shell install Text::CSV`


    For Debian/Ubuntu-based system: `$ sudo apt-get install libtext-csv-perl`


    For RedHat/Centos/Fedora-based system: `$ sudo yum install perl-Text-CSV`


    To escape the comma character between quotes, run the following code on our `new.csv`
    file:


    ```

    use strict; # Using the Text::CSV file to allow # full CSV Reader and Writer use
    Text::CSV; my $csv = TEXT::CSV->new({ sep_char => ’, ’ }); my $file_to_be_read
    = $ARGV[0] or die; # Reading file open(my $data_file, ’<’, $file_to_be_read) or
    die; while (my $line = <$data_file>) { chomp $line; # Parsing line if ($csv->parse($line))
    { # Extracting elements my @words = $csv->fields(); for (my $x = 0; $x <= 2; $x++)
    { print "$words[$x] "; } print "\n"; } else { # Warning to display warn "Line
    could not parse: $line\n"; } } }

    ```


    The first field in the above example now includes a comma that was escaped while
    parsing the CSV file.


    The preceding line describes how to invoke the class’s constructor. The arrow
    `->` is used to invoke a constructor.


    This call will attempt to parse the current line and divide it into chunks. Depending
    on success or failure, return true or false.


    ### Fields with Newlines Embedded


    Specific fields in a CSV file may be multi-lined or have a newline embedded between
    the words. When these multi-lined fields are given via a `split()` method, they
    behave considerably differently from other files with no embedded newline.


    The embedded newline in the above CSV file is now handled with the `getline()`
    function, and Perl interprets the new field as one, as needed by the coder, and
    so was enclosed in quotes.


    ## FILE TEST OPERATORS


    In Perl, file test operators are logical operators that produce True or False
    values. Perl provides a plethora of operators for testing various features of
    a file. For example, the `-e` operator is used to check for the existence of a
    file. Alternatively, it can determine whether a file can write before conducting
    the add operation. This will aid in lowering the number of mistakes a program
    may encounter.


    The following example uses the `-e`, existence operator, to determine whether
    or not a file exists:


    ```

    #!/usr/bin/perl # Using the predefined modules warnings; use strict; # Providing
    path of the file to a variable my $filename = ’C:\Users\PeeksForeks\PFP.txt’;
    # Checking for file existence if(-e $filename) { # If the File exists print("File
    $filename exists\n"); } else { # If File doesn’t exists print("File $filename
    doesn’t exists\n"); }

    ```


    This file test operator `-e` takes a filename or FileHandle as an input.


    The following table lists the most important file test operators:


    | Operator | Description |

    | --- | --- |

    | -r | checks if file is readable |

    | -w | checks if file is writable |

    | -x | checks if file is executable |

    | -o | checks if file is owned by effective uid |

    | -R | checks if the file is readable by real uid |

    | -W | checks if the file is writable by real uid |

    | -X | checks if the file is executable by real uid/gid |

    | -O | checks if file is owned by real uid |

    | -e | checks if file exists |

    | -z | checks if file is empty |

    | -s | checks if file has nonzero size (returns size in bytes) |

    | -f | checks if the file is a plain text file |

    | -d | checks if the file is a directory |

    | -l | checks if file is a symbolic link |

