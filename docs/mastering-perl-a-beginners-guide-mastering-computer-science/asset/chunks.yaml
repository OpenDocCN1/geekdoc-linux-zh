  trans: "\n\nPerl 中的正则表达式（也称为 regexes、regexps 或 REs）是一种表示一组字符串的方法，无需在程序中描述所有的字符串。它本质上是一系列用于模式匹配的字符。正则表达式在\
    \ Perl 中有多种用途：\n\n* 首先，它们用于条件判断，以评估字符串是否匹配特定模式。\n\n  **例如：** 条件中的正则表达式\n  ```perl\n\
    \  #!/usr/bin/perl # Regular expressions in the Conditionals # Program to determine\
    \ whether string # matches particular pattern \n  print \"How are you feeling?\\\
    n\"; my $stmt = <>; print($stmt); if ($stmt == /hungry/) { print \"\\n What do\
    \ we wish to have?\\n\"; my $ip = <>; print($ip); }\n  ```\n  在这里，会匹配用户的输入；如果包含了单词“hungry”，即如果条件为真，它将打印“What\
    \ do we wish to have?”。否则，将跳转到下一个条件或语句。\n\n* 其次，它们可以在字符串中找到模式并将其替换为其他内容。\n\n \
    \ **例如：** 替换运算符\n  ```perl\n  #!/usr/bin/perl # Regular expressions in the Substitutions\
    \ # Program to determine whether string # matches particular pattern and replaces\
    \ it \n  print \"Whats your thought on life\\n\"; my $stmt = <>; print ($stmt);\
    \ # Substitution using the regex $stmt =~ s/worst/good/; print (\"\\n$stmt\");\n\
    \  ```\n  前面的代码使用了“good”代替了“worst”。\n\n* 最后，模式不仅可以描述某个存在的地方，还可以描述它不存在的地方。因此，`split`运算符使用正则表达式来识别数据不存在的地方。换句话说，正则表达式指定了分隔数据字段的分隔符。\n\
    \n  **例如：** Split 运算符\n  ```perl\n  #!/usr/bin/perl # Program to illustrate the\
    \ # use of split function \n  $var1 = \"Birth\"; $var2 = \"Life\"; $var3 = \"\
    Death\"; # Using split function \n  my ($var1, $var2, $var3) = split(/, /, \"\
    sab, mohmaya, hai\"); print($var1); print($var2); print($var3);\n  ```\n  在上面的示例中，`split`\
    \ 函数匹配单个逗号字符。\n\n## 回溯 (BACKTRACKING)\n\n回溯是正则表达式匹配的另一个关键方面，现在（当需要时）被所有非占有表达式量词使用，即\
    \ `*`、`*?`、`+`、`+?`、`{n, m}` 和 `{n, m}?`。回溯内部经常会被优化，但上述概念是正确的（它从可能性树上的失败递归中返回）。当\
    \ Perl 尝试用正则表达式匹配模式且之前的尝试失败，或者当匹配模式被保存备以后用时，它就会回溯。\n\n例如，`/.*?/` 可用于匹配类似于 HTML\
    \ 标签的任何内容，如“Bold”。这强制模式的两个部分匹配同一个字符串，在本例中为“B”。\n\n考虑另一个示例 `/^ab*bc*d/`\n\n###\
    \ 前面的正则可以解释如下：\n\n1. 从字符串开始处开始。\n2. 匹配一个“a”。\n3. 尽可能匹配多个“b”，即使没有匹配到任何一个也可以。\n\
    4. 尽可能匹配多个“c”，即使没有匹配到任何一个也可以。\n5. 尽可能匹配多个“d”，虽然不需要全部匹配。\n\n## 正则表达式中的“e”修饰符\n\n\
    Perl 中的正则表达式允许我们使用适当的运算符对给定文本执行许多操作。这些运算符可以执行如字符串修改、替换其他子字符串等操作。在给定字符串中替换子字符串是通过\
    \ `s`（替换）运算符完成的，它接受两个操作数：要替换的子字符串和替换字符串。\n\n此外，`e` 修饰符用于将子字符串替换为要求值的正则表达式的替换字符串。`e`\
    \ 修饰符添加到替换表达式中。\n\n`e` 修饰符还可以与 `g`（全局）修饰符结合使用，以影响指定字符串中所有可能的子字符串。\n\n**第一个示例：**\
    \ 使用字符类替换\n```perl\n#!/usr/bin/perl # Defining string to be converted \n$String\
    \ = \"Peeks for Peeks is the best\"; print \"The Original String: $String\\n\"\
    ; # Converting string to UPPERCASE # using ’uc’ Function \n$String =~ s/(\\w+)/uc($1)/ge;\
    \ print\"Uppercased String: $String\\n\"; # Converting string to lowercase # using\
    \ ’lc’ Function \n$String =~ s/(\\w+)/lc($1)/ge; print\"Lowercased String: $String\\\
    n\";\n```\n上面的代码使用了字符类 `\\w`，它包含大小写字母和所有数字（a-z|A-Z|0-9）。这被用于通过单个替换操作替换整个字符串。\n\
    \n**第二个示例：** 使用单个字母或单词进行特定替换。\n\n更新后的字符串不会恢复到原始值，即使在第二次递归之后也是，如前面的代码所示。\n\n###\
    \ 使用子程序执行替换操作\n\nPerl 正则中的子程序替换也可以通过子程序完成，以消除为每个字符串重复编写替换正则的麻烦。这是通过将正则代码插入子程序并在需要时调用它来实现。\n\
    \n当上述代码中的替换操作开始时，它会调用子程序 `change_substitution`，该程序包含了更改匹配搜索内容的子字符串的正则代码。\n\n##正则\
    \ “ee” 修饰符\n\nPerl 中的正则表达式允许你使用适当的运算符对给定文本执行许多操作。这些运算符可以执行如字符串修改、替换其他子字符串等操作。在给定字符串中替换子字符串是通过\
    \ `s`（替换）运算符完成的，它接受两个操作数：要替换的子字符串和替换文本。\n\n在 Perl 中，修饰符使用正则表达式通过指定模式匹配字符串。在 Perl\
    \ 中，`ee` 修饰符等同于 `\\e` 修饰符。它用于求值右侧字符串并进一步评估结果。在 Perl 中，它等同于双重 `eval` 运算符。`\\e`\
    \ 运算符用于求值右侧字符串。`\\ee` 快了一步。它在已经带有 `e` 修饰符的字符串上使用 `\\e` 运算符。\n\n`ee` 修饰符像 `e` 修饰符一样，可以与\
    \ `g`（全局）修饰符结合使用，应用于提供的字符串中所有可能的子字符串。\n\n这是因为当应用 `e` 修饰符时，正则会将 RHS（右侧）视为用作替换的求值字符串；在这种情况下，RHS\
    \ 是 `$1`，它保留 `$var` 但不是它的值。因此，应用 `ee` 修饰符将重新评估 RHS， RHS 包含了已求值的变量 `$var`。\n\n\
    ### 进行数学计算时，使用“ee”修饰符\n\n如果字符串中包含数学表达式，表达式的值将不会被求值，而是原样显示。这是因为它既被视为字符串又是待求值的表达式。\n\
    \n上述代码中的表达式是用正则表达式编写的，使用 `d+` 运算符编写一个或多个数字，使用 `[+*/]` 字符类表示运算符符号，然后是另一个 `d+` 表示数字。`ee`\
    \ 修饰符求值字符串并返回表达式的总和，通过 `$1` 运算符显示。\n\n上面的正则也可以保留在子程序中用于评估不同的表达式，而无需重写正则。\n\n在给定的代码可以使用单个正则利用子程序执行四次数学计算。\n\
    \n## 正则表达式中的 pos() 函数\n\nPerl 中的 `pos()` 函数返回使用 `m` 修饰符的正则中上一次匹配的位置。\n\n正则中的 `pos()`\
    \ 函数可以与字符类结合使用，返回给定字符串中所有必需子字符串的位置列表。要在整个文本中搜索子字符串，请结合全局运算符 `g` 和 `m` 修饰符使用。\n\
    \n"
