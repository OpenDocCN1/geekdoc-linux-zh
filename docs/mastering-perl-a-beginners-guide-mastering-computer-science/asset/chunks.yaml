    ### 4. Polymorphism

    Polymorphism refers to the ability of OOPs programming languages to distinguish
    between entities with the same name efficiently. Perl accomplishes this through
    the use of these entities’ signatures and declarations.


    Polymorphism in Perl is primarily of two types:

    - Perl overloading

    - Perl overriding


    ### 5. Inheritance

    An essential pillar of OOP is inheritance (object-oriented programming). It is
    the mechanism in Perl that allows one class to inherit the features (fields and
    methods) of another.


    Important terms to remember:

    - Superclass: A superclass is a class with inherited characteristics (a base class
    or a parent class).

    - Subclass: It is a class that derives from the another (or derived class, extended
    class, or child class). The subclass can add its fields and methods to those of
    the superclass.

    - Reusability: Inheritance promotes “reusability,” which means that if we want
    to create new class and there is already class that includes some of the code
    we want, we can derive our new class from the existing class. By doing so, we
    are reusing the existing class’ fields and methods.


    A class in Perl can be created with packages and inherited with the `use` keyword.


    ### 6. Encapsulation

    Encapsulation is wrapping data into a single unit. It is the mechanism that connects
    code and the data that it manipulates. Encapsulation can also be considered a
    protective shield that prevents code from accessing data outside of the shield.


    - Technically, in encapsulation, a class’ variables or data are hidden from other
    classes and can only be accessed through any member function of the class in which
    they are declared.

    - Because the data in a class is hidden from other classes, it is also referred
    to as data-hiding.

    - Encapsulation can accomplish by declaring all variables in the class as private
    and writing public methods in the class to set and retrieve variable values.


    ### 7. Abstraction

    Data abstraction is the property that only displays the essential details to the
    user. The user is not shown the trivial or non-essential units. For example, a
    car is considered a whole rather than its individual components.


    Data abstraction is also defined as the process of identifying only the necessary
    characteristics of an object while ignoring irrelevant details. An object’s properties
    and behaviors distinguish it from other objects of a similar type and aid in classifying/grouping
    the objects.


    Consider the following scenario: A man is driving a car. The man only knows that
    pressing the accelerators will increase the car’s speed or that applying the brakes
    will stop the car. Still, he has no idea how pressing the accelerator will increase
    the speed, nor does he understand the car’s inner mechanism or how the car’s accelerator,
    brakes, and other controls are implemented. This is the definition of abstraction.


    ## CLASSES IN OOP


    In today’s world, when programming is used in every aspect of our life, we must
    adopt programming paradigms that are closely related to real-world instances.
    The competitiveness and complexity of real-world challenges have undergone a significant
    transformation, necessitating the need for more adaptable ways in the industry.


    The notion of OOPs is a wonderful method to shape any programming language such
    that solving real-world cases is a breeze. OOP is a programming paradigm that
    places more emphasis on objects than procedures. The OOPs idea involves working
    in terms of objects and the interaction of objects.


    Note: OOP seeks to implement real-world elements, such as inheritance, encapsulation,
    and polymorphism. The primary goal of OOP is to connect the data and the functions
    that act on them such that no other portion of the code may access the data than
    the function.


    ### Object

    It is an instance of a class inside a data structure with specific properties
    and behavior. An “Apple” is an example of an object. It has the qualities of being
    a fruit with a crimson hue, etc. Its conduct is “it tastes delicious.”


    Its data represent the features of an object, and its activity is represented
    by its related functions, according to the OOPs idea. Thus, an object is an entity
    that holds data and provides a function-based interface.


    ### Class

    A class is an enlarged data structure idea. It specifies the prototype blueprint
    of data-containing objects.


    Objects are instances of their respective classes. A class consists of data members
    and data functions; it is a user-defined, pre-defined data type that can be accessed
    and used by creating an instance of that class.


    **Example:** Consider a class at school as an example. There may be schools with
    various names and organizational structures, but they all have some qualities,
    such as students, instructors, and staff. Therefore, school is the class containing
    the data members, teachers, students, and parents, and the member functions may
    be `calculate_students_marks()`, `calculate_teachers_salary()`, and `Parents_Database()`.


    ### Data Member

    Data members are data variables, and member functions are the functions used to
    control these variables; these data members and member functions combined determine
    the attributes and behavior of the objects inside a class.


    ![](images/ufig7_2.jpg)


    Data member.


    ### Defining a Class

    Perl makes it very simple to define a class. A class in Perl corresponds to a
    package. To define a class, we must first load and construct a `Package`. A Package
    is a pre-contained unit of user-defined variables and subroutines that can use
    anywhere in the program.


    ### Creating a Class and Making Use of Objects

    A class can create in Perl using the keyword `package`, but an object is created
    by calling a constructor. A constructor is defined as a method in a class.


    ### Creating a Class Instance

    The class and constructor names can be whatever the user wants. Most programmers
    prefer `new` as a constructor name for their programs because it is easier to
    remember and use than any other complex constructor name.


    A function called `bless` is used in the preceding example. This function is used
    to associate an object with a class passed as an argument.


    ### Creating an Object

    In Perl, an object is created by calling the constructor defined in the class.
    An object name can be any variable the user requires, but it is customary to name
    it in relation to the class.


    Using classes in OOP is critical because it precisely depicts real-world applications
    and can be used to solve real-world problems.


    ## OBJECTS IN OOPs


    Perl is an object-oriented, interpreter-based, dynamic programming language. OOP
    has three primary components: objects, classes, and methods. An object is a data
    type that may be referred to as an instance of the class it belongs. It may be
    a collection of data variables of various data kinds and a collection of various
    data structures. Methods are functions that operate on class object instances.


    The following example illustrates how objects may use in Perl:


    We must first define the class. In Perl, this is accomplished by constructing
    the class’ package. A package is an encapsulated object that contains all of the
    class’ data members and functions.


    `Employee` is the class name in this case.


    The second task is to create a package instance (i.e., the object). We’ll need
    a constructor for this. In Perl, a constructor is a subroutine that is usually
    called `new`. However, because the name is user-defined, it is not limited to
    `new`.


    To design our object, we define a basic hash reference `$self` in the constructor.
    Here, the object will contain three properties for an `Employee`: `serialNum`,
    `firstName`, and `lastName`. This indicates that each employee will have their
    serial number, firstname, and lastname. The `my` keyword functions as an access
    specifier that localizes `$class` and `$self` to the contained block.

