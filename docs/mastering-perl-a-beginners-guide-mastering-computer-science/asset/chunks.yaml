    ### 4. 多态

    多态是指面向对象编程（OOP）语言能够有效地区分同名实体的能力。Perl 通过使用这些实体的签名和声明来实现这一点。


    Perl 中的多态主要有两种类型：

    - Perl 载载（overloading）

    - Perl 方法重写（overriding）


    ### 5. 继承

    继承是面向对象编程（OOP）的一个核心柱。在 Perl 中，这种机制允许一个类继承另一个类的特性（字段和方法）。


    需要记住的重要术语：

    - 超类（Superclass）：超类是具有继承特性的类（基类或父类）。

    - 子类（Subclass）：派生自另一个类（也称为派生类、扩展类或子类）。子类可以在超类的基础上添加自己的字段和方法。

    - 可重用性（Reusability）：继承促进了“可重用”，这意味着如果我们想要新类，而已经有一个类包含了我们想要的部分代码，我们就可以从现有类派生出新类。通过这样做，我们重用了了现有类的字段和方法。


    在 Perl 中，可以使用 `packages` 创建类，并使用 `use` 关键字进行继承。


    ### 6. 封装

    封装是将数据包装在一个单一单元中。它是连接代码及其所操作的数据的机制。封装也可以被视为一个保护屏，防止代码访问屏蔽之外的数据。


    - 从技术上讲，在封装中，类的变量或数据对其他类是隐藏的，只能通过声明它们的类中的任何成员函数进行访问。

    - 由于类中的数据对其他类是隐藏的，它也被称为数据隐藏。

    - 封装可以通过将类中的所有变量声明为私有，并在类中编写公有方法来设置设置和检索变量值来实现。


    ### 7. 抽象

    数据抽象是仅向用户显示本质性细节的属性。用户不会看到琐碎或非本质的单元。例如，一个汽车被视为一个整体，而不是它的各个组件。


    数据抽象也被定义为只识别对象的必要特征而忽略无关细节的过程。对象的属性和行为将其与其他相似类型的对象区分开来，并有助于对象的分类/分组。


    考虑以下场景：一个男人正在开车。这个男人只知道按下加速板会增加汽车速度，或者按下刹车会停止汽车。然而，他并不知道按下加速板是如何增加速度的，也不理解汽车的内部机制，或汽车的加速板、刹车和其他控制装置是如何实现的。这就是抽象的定义。


    ## OOP 中的类


    在当今世界，当编程被应用于生活的方方面面，我们必须采用与现实世界实例密切相关的编程范式。现实世界挑战的竞争性和复杂性经历了巨大的变化，使得行业需要更具适应性的方法。


    OOP 的概念是一种奇的方法，可以塑造任何编程语言，使得解决现实案例变得轻而易举。OOP 是一种强调对象而非过程的编程范式。OOP 的思想涉及根据对象和对象交互来工作。


    注意：OOP 试图实现现实世界的元素，如继承、封装和多态。OOP 的主要目的是将数据与其所作用的功能连接起来，使得代码的其他部分无法通过函数访问数据。


    ### 对象（Object）

    它是数据结构内部具有特定属性和行为的类实例。“苹果”就是对象的一个例子。它具有水果的品质、深红色等特征。它的行为是“它尝起来很好”。


    根据 OOP 的思想，它的数据代表对象的特征，它的活动由其相关函数表示。因此，对象是一个持有数据并提供基于函数的接口的实体。


    ### 类（Class）

    类是一个扩展的数据结构概念。它指定了包含数据的对象的原型蓝图。


    对象是其相应类的实例。类由数据成员和数据函数组成；它是一种用户定义的、预定义的数据类型，可以通过创建该类的实例来访问和使用。


    **示例：** 以学校的类为例。可能会有各种不同名称和组织结构的学校，但它们都具有某些特性，例如学生、教师和员工。因此，学校是包含数据成员（教师、学生和家长）的类，而成员函数可以是
    `calculate_students_marks()`、`calculate_teachers_salary()` 和 `Parents_Database()`。


    ### 数据成员（Data Member）

    数据成员是数据变量，成员函数是用于控制这些变量的函数；这些数据成员和成员函数共同了类内部对象的属性和行为。


    ![](img/ufig7_2.jpg)


    数据成员。


    ### 定义类

    Perl 使定义类变得非常简单。Perl 中的类对应于一个 `package`。要定义一个类，我们必须先加载并构建一个 `Package`。Package
    是用户定义的变量和子程序的预包含单元，可以用于程序的任何地方。


    ### 创建类并使用对象

    在 Perl 中，可以使用关键字 `package` 创建类，但对象是通过调用构造函数创建的。构造函数被定义为类中的一个方法。


    ### 创建类实例

    类名和构造函数名可以是用户喜欢的任何。大多数程序员倾向于使用 `new` 作为程序的构造函数名，因为它比任何其他复杂的构造函数名更容易记忆和使用。


    在前面的示例使用了名为 `bless` 的函数。该函数用于将对象与作为参数传递的类关联起来。


    ### 创建对象

    在 Perl 中，对象通过调用类中定义的构造函数来创建。对象的名称可以是用户需要的任何变量，但习惯上会与类相关的命名。


    在 OOP 中使用类至关重要的，因为它们精确地描述了现实世界的应用，并可以用于解决现实问题。


    ## OOP 中的对象


    Perl 是一种面向对象的、基于解释器的动态编程语言。OOP 有三个主要组件：对象、类和方法。对象是一种可以被称为其所属类实例的数据类型。它可能是一个各种数据类型数据变量的集合，也是各种数据结构的集合。方法是在类对象实例上操作的函数。


    下面的示例说明了如何在 Perl 中使用对象：


    我们必须首先定义类。在 Perl 中，这是通过构建类包 package 实现的。package 是一个封装的对象，包含了类的所有数据成员和函数。


    在这种情况下，`Employee` 是类名。


    第二个任务是创建一个包实例（即对象）。我们需要为此准备一个构造函数。在 Perl 中，构造函数是一个通常命名为 `new` 的子程序。然而，由于名称是用户定义的，所以它并不限于
    `new`。


    为了设计我们的对象，我们在构造函数中定义了一个基础哈希引用 `$self`。在这里，对象将包含 `Employee` 的三个属性：`serialNum`、`firstName`
    和 `lastName`。这意味着每个员工将有自己的序列号、名字和姓氏。`my` 关键字充当访问限定符，将 `$class` 和 `$self` 局部化在包含的块中。


