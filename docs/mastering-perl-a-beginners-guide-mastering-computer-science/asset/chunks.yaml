    ## Glob


    It returns list of files that match the argument’s expression. This method can
    print all or particular files with the extension.


    Here are some examples of using File Globbing to access a directory.


    * Getting to the script’s current directory:


    ```perl

    #!/usr/bin/perl -w # Accessing files using the glob function

    @files = glob(’*’); # Returns list of all files

    foreach $file (@files) # Loop to run through all the files

    { print $file. "\n"; # Print all the files

    }

    ```


    * Opening to a certain directory:


    ```perl

    #!/usr/bin/perl -w # Prints only the filename excluding path

    use File::Basename; # Returns list of all the files

    @files = glob(’C:/Users/PeeksForPeeks/Folder/*’);

    foreach $file (@files) # Loop to run through all the files

    { print basename($file), "\n"; # Print all the files

    }

    ```


    ## Hashbang or Shebang Line Use


    Extraction and Reporting in Practice Language, often known as Perl, is an interpreter-based
    programming language. When running Perl scripts on Unix-like platforms like Linux
    and Mac OSX, Hashbangs or shebangs come in useful. A Hashbang line is the initial
    line of a Perl program and serves as a connection to the Perl binary. It enables
    direct execution of Perl scripts without the need to pass the file as an input
    to Perl. In Perl, a Hashbang line looks like this: `#!/usr/bin/perl`


    A Hashbang line is so named because it begins with a Hash(`#`) and ends with a
    bang(`!`). A Hashbang line in Perl is very important in Perl programming. Let’s
    get started with using this Hashbang line.


    **Example:** Assume we have a Perl hello world program script that we will run
    using the terminal on a Linux system.


    In the preceding code, the terminal first runs Perl, and then Perl is instructed
    to run the code script. An error occurs if the code script is run without first
    running Perl.


    Try executing the following code: `$ hello1.pl`


    The shell we used attempted to parse the commands in the file here. However, it
    was unable to locate the command `print` in Linux/Unix. As a result, it is required
    to notify the shell that it is a Perl script. This is when the idea of Hashbang
    comes into effect. Hashbang notifies the terminal of the script.


    However, before running this code, the shell’s path must modify to add the current
    directory to existing directories. This may accomplish by running the following
    command: `$ PATH = $PATH:$(pwd)`


    The current working directory will add to the list of directories in the `PATH`
    environment variable.


    Then, in the Perl script file `hello1 .pl`, add the Hashbang line `#!/usr/bin/perl`.
    This line is always added at the beginning of code, i.e., the Hashbang line is
    the first line of the code script.


    Due to the addition of the Hashbang line `#!/usr/bin/perl` to the script’s first
    line, the code above functions correctly and generates no errors.


    The script is performed in the current shell environment when it is executed.
    If the script begins with a hash and a bang (Hashbang) `#!`, the shell will execute
    the program whose path is specified on the Hashbang line (in this example, `/usr/bin/perl`),
    which is the default location for the Perl compiler-interpreter. Therefore, the
    Hashbang line contains the location of the Perl compiler-interpreter.


    The error occurs when there is no Hashbang line in file, and we attempt to run
    it without explicitly executing Perl. The shell believes the script is written
    in Bash and attempts to run it appropriately, which results in errors.


    ## Useful Math Functions


    In Perl, solving certain expressions containing mathematical operations is occasionally
    necessary. These mathematical processes may be carried out using several built-in
    functions.


    The following are some helpful Perl functions for mathematical operations:


    | Function | Description |

    | --- | --- |

    | `exp()` | Calculates the parameter “e” raised to the power of the real value.
    |

    | `hex()` | Converts a specified hexadecimal number (of base 16) to its decimal
    equivalent ( of base 10 ). |

    | `srand()` | Helps the `rand()` function generates a constant value each time
    the program is executed. |

    | `sqrt()` | Calculates the square root of a number. |

    | `oct()` | Converts the supplied octal value to its decimal equivalent. |

    | `rand()` | Returns a random fractional number ranging from 0 to the positive
    numeric value passed to it, or 1 if no value is specified. |

    | `log()` | The natural logarithm of the value passed to it is returned. If called
    without a value, it returns `$_`. |

    | `int()` | The integer part of the provided number is returned. If no value is
    specified, it returns `$_`. |

    | `sin()` | Used to compute the sine of a VALUE or `$_`. If VALUE is not provided.
    |

    | `cos()` | Calculates the cosine of a VALUE or `$_`. If VALUE is missing. |

    | `atan2()` | Calculates the arctangent of `Y/X` in the range -PI to PI. |

    | `abs()` | The absolute value of its argument is returned. |


    ## The Distinction Between Functions and Subroutines


    When a code script develops in size, i.e., comprises hundreds of lines of code,
    it becomes tough to handle in Perl. Perl provides its users with the idea of functions
    and subroutines to circumvent this challenge. To make the program more readable,
    functions and subroutines split up complex/large chunks of code into smaller,
    more concise parts.


    They minimize the size of the application and debugging time by allowing us to
    reuse previously written code in the program. Perl functions and subroutines are
    used in programs to reuse code. We can utilize a function with various parameters
    throughout our program.


    ### What Exactly Is a Function?


    A function accepts several inputs, performs operations on them, and then returns
    a value.


    It may be included within the programming language or provided by the user. When
    defining a function in Perl, the name and sequence of statements are specified.
    When we wish to do a calculation later, we may `call` the function by name.


    Perl has several really built-in functions. `say` is an example of built-in function.
    Perl even permits us to create our function to assist us in doing the desired
    task.


    ### What Exactly Is a Subroutine?


    Subroutines (or `sub`) allow us to provide a name to part of code so that when
    we wish to utilize it again, we can simply call its name.


    Subroutines aid us in two ways while writing in Perl:


    - First, they allowed us to reuse the code in the program, making it easier to
    detect and correct faults and making it faster to build applications.

    - Second, they enable us to organize our code into parts. Each subroutine is in
    charge the specific task.


    When a piece of code is placed in a Perl subroutine, there are two options:


    - When we know that the code will utilize for a calculation or action that will
    perform. For instance, when converting a strong to a specific format or when converting
    an incoming data record to a hash, etc.

    - When we want to divide our program’s logical components into parts to make it
    easier to grasp.


    The following table compares the differences between a function and a subroutine:


    | Function | Subroutine |

    | --- | --- |

    | Basic format of a function is `$myvalue = myfunction(parameter, parameter);`
    | The basic format of a subroutine is `sub subroutine_name{# body of the subroutine}`
    |

    | A Perl function is anything that is built into Perl. The primary reference documentation
    for Perl built-ins is referred to as perlfunc. | In Perl, a subroutine is a chunk
    of code that can receive inputs, execute specific actions on them, and may or
    not return a useful value. They are, however, always user-defined rather than
    built-in. |

    | Perl provides us all with functions. | Subroutines are pieces of code that we
    supply to Perl. |

    | Functions are like subroutines in that they return a value.A function typically
    performs certain computations and returns the results to the caller. | Subroutines
    carry out a task but do not return any information to the calling program. |

    '
