  trans: "\n\nPerl 函数或子程序（subroutine）是执行特定任务的语句集合。用户希望在每种编程语言中重用代码。因此，用户将代码段放在函数或子程序中，以避免重复编写代码。这些子程序拥有参数，定义了调用函数时可以传递的参数的类型和数量。这些参数用于通过函数的表达式来评估传递给函数的值。然后，这些值将传递给调用函数并返回给指定的参数。\n\
    \n### 可变参数 (Mutable Parameters)\n\n这些参数的值在传递给参数的函数内部是可以被修改的。\n\n这表示当通过调用者函数向函数提供参数时，其值与被调用函数中的参数绑定，因此，在被调用函数中对值进行的任何更改也将反映在通过调用者函数传递的参数上。\n\
    \n### 不变参数 (Immutable Parameters)\n\n这些参数属于此类，其值在提供给它的函数内部无法被修改。这表示当通过调用者函数向函数提供参数时，子程序获取的是一个值而不是变量。因此，对函数参数的任何修改都不会反映。\n\
    \nPerl 的子程序参数默认是不可变的，这意味着它们不能在函数内部被修改，且无法无意中更改调用函数的参数。在特定的编程语言中，这被称为“按值传递”（call\
    \ by value），表示被调用的子程序获取的是值而不是变量，因此调用函数的参数不会被改变。\n\nTraits（特性）用于更改这些参数的属性。在子程序内部可以使用\
    \ traits 来更改参数的值。\n\n### Traits\n\n这些是预定义的内置子程序，当在方法内部使用时，它们会在编译运行时更改方法的行为。Traits\
    \ 甚至可以修改方法体或为方法标记元数据。\n\n根据其用法，traits 可以有多种类型，例如：\n\n* `is cached` trait 根据传递给函数的参数自动缓存该函数的返回值。\n\
    * `is rw` trait 允许对子程序参数进行可写访问器操作（writable accessors）。\n* `is copy` trait 允许我们在子程序内部更改参数的值，但不会更改调用者函数中的参数。\n\
    \n**示例：** `is copy` trait 的用法\n```perl\n#!/usr/bin/perl\n# 使用 # ’is copy’ trait\
    \ 的函数定义\nsub Func(Int $variable is copy) {\n    # 要执行的操作\n    $variable += 5;\n\
    }\n# 定义局部变量\nmy $value = 20;\n# 使用局部变量调用函数\nprint Func($value), \"\\n\";\n# 检查\
    \ # $value 是否被更新\nprint $value;\n```\n\n由于 Perl 默认不允许在子程序内部修改参数，因此在上面的代码使用了 `copy`\
    \ trait。此 trait 允许程序将调用者函数的参数值赋值给被调用的子程序的参数。然而，此 trait 只会影响被调用函数中参数的值。\n\n**示例：**\
    \ `is rw` trait 的用法\n```perl\n#!/usr/bin/perl\n# 使用 # ’is rw’ trait 的函数定义\nsub\
    \ Func(Int $variable is rw) {\n    # 要执行的操作\n    $variable += 5;\n}\n# 定义局部变量\n\
    my $value = 20;\n# 使用局部变量调用函数\nprint Func($value), \"\\n\";\n# 检查 # $value 是否被更新\n\
    print $value;\n```\n\n当在上述代码中使用 `is rw` 代替 `is copy` trait 时，调用者函数中传递的参数值也会被更新。\n\
    \n当使用 `is rw` trait 时，被调用函数的参数与调用者函数的参数绑定，因此如果前者值发生变化，后者将立即更新。这是因为一种被称为“按引用传递”（call\
    \ by reference）的过程。由于两个参数都指向同一个内存位置（由于 `is rw` trait 的作用），因此参数是完全可变的。\n\n## 多个子程序\
    \ (MULTIPLE SUBROUTINES)\n\nPerl 函数或子程序是执行特定任务的语句集合。每种编程语言用户都希望重用代码。因此，用户将代码段放在函数或子程序中，以避免重复编写代码。\n\
    \n虽然函数（function）、子程序（subroutine）和方法（method）在 Perl 中是可以通用的，但在其他编程语言中并非如此。由于它是使用关键字\
    \ `sub` 创建的，因此在 Perl 编程中常用“子程序”一词。当函数被调用时，Perl 会停止执行整个程序并跳转到函数处执行，然后再返回到之前运行的代码段。可以避免使用\
    \ `return` 语句。\n\n### 子程序定义\n\n在 Perl 中，定义子程序的通用格式如下：`sub subroutine_name { #\
    \ 方法或子程序的正体 }`\n\n由于 Perl 允许编写多个同名的子程序（除非它们具有不同的签名），因此 Perl 程序可以包含多个同名的子程序而不会产生错误。这可以通过更改每个同名子程序的参数个数（arity）来定义。\n\
    \n子程序的参数个数性（Subroutine arity）：只要参数个数不同，Perl 子程序可以具有相同的名称。一个子程序拥有的参数数量称为其 arity。这些参数可以是不同的数据类型，也可以不是。只要子程序的数量不同，Perl\
    \ 程序就不会产生错误。\n\n### “multi” 关键字的使用\n\n关键字 `multi` 可用于在 Perl 中创建多个子程序。这对于创建相同名称的多个子程序非常有用。\n\
    \n多个子程序通常用于创建像 Perl 等编程语言中的内置函数和大多数运算符。通过不为每个子程序使用不同的名称，可以了程序的复杂度。无论需要什么代码语句，只需传递该函数的参数数量，工作即可完成。在这种情况下，编译器将选择函数签名与被调用处相匹配的子程序版本。\n\
    \n各种程序，例如数字阶阶、斐波那契数列等，需要使用多个函数来解决问题。使用多个子程序将有助于降低此类程序的复杂性。\n\n**第一个示例**：斐波那契数列和\n\
    ```perl\n#!/usr/bin/perl\n# 打印斐波那契数列和的程序\n# 用于 $n = 0 的函数 Fibonacci_func(0) {\n\
    \    1; # 返回 1\n}\n# 用于 $n = 1 的函数 Fibonacci_func(1) {\n    1; # 返回 1\n}\n# 计算和的递归函数\
    \ multi Fibonacci_func(Int $n where $n > 1) {\n    Fibonacci_func($n - 2) + Fibonacci_func($n\
    \ - 1);\n}\n# 使用函数调用打印和\nprint Fibonacci_func(27);\n```\n\n为了计算斐波那契数列的和，前面的示例使用了多个子程序。\n\
    \n**第二个示例：**数字阶乘\n```perl\n#!/usr/bin/perl\n# 打印数字阶乘的程序\n# 0 的阶乘 multi Factorial(0)\
    \ {\n    1; # 返回 1\n}\n# 计算阶乘的递归函数\n# multi Factorial(Int $n where $n > 0) {\n\
    \    $n * Factorial($n - 1); # 递归调用\n}\n# 使用函数调用打印结果\nprint Factorial(25);\n```\n\
    \n在前面的示例中，程序使用 `multi` 关键字声明了名称相同但参数个数不同的多个子程序。\n\n"
- fmt: "\nVariables are used in Perl to access data stored in memory (all data and\
    \ functions are stored in memory). Variables are given data values that are then\
    \ used in various operations. Perl reference allows you to access the same data\
    \ but through a different variable. In Perl, a reference is a scalar data type\
    \ that holds the location of another variable. Other variables include scalars,\
    \ hashes, arrays, function names, and so on. Nested data structures are simple\
    \ to construct because a user can create a list that contains references to another\
    \ list that contains references to arrays, scalar, hashes, and so on.\n\n### Making\
    \ a Reference\n\nWe can make references to scalar value, hash, array, function,\
    \ and so on. To make a reference, define a new scalar variable and prefix the\
    \ variable’s name (the reference of which we want to make) with a backslash.\n\
    \nMaking references to different data types:\n- Array-Reference: defining-array\
    \ `@array = (’1’, ’2’, ’3’);`\n- making reference of the array variable `$reference_array\
    \ = \\@array;`\n- Hash-Reference: defining-hash `%hash = (’1’=>’a’, ’2’=>’b’,\
    \ ’3’=>’c’);`\n- make reference of hash variable `$reference_hash = \\%hash;`\n\
    - Scalar Value Reference: defining-scalar `$scalar_val = 2431;`\n- making reference\
    \ of the scalar variable `$reference_scalar = \\$scalar_val;`\n\n**Notes:**\n\n\
    - The curly brackets `{}` around key and value pairs can be used to create a reference\
    \ to an anonymous hash.\n- The square brackets `[]` can use to create a reference\
    \ to an anonymous array.\n- `sub` can also be used to create a reference to an\
    \ anonymous subroutine. There will be no name for the sub here.\n- It is not possible\
    \ to create reference to an input/output handle, such as `dirhandle` or `FileHandle`.\n\
    \n### Dereferencing\n\nNow that we’ve made the reference, we must use it to get\
    \ to the value. Dereferencing is a method of gaining access to the value in the\
    \ memory pointed to by the reference. Depending on the type of variable, we use\
    \ prefix `$`, `@`, `%`, or `&` to dereference (reference can point to a array,\
    \ scalar, hash, etc.).\n\n### PASS BY REFERENCE\n\nWhen variable is passed by\
    \ reference, the function operates on the function’s original data. The function\
    \ can change the original value of a variable by passing it by reference.\n\n\
    When the values of the elements in the argument arrays `@_` are changed, so do\
    \ the values of the corresponding arguments. This is what parameter passing by\
    \ reference accomplishes.\n\nIn the following example, updating the elements of\
    \ an array `@a` in subroutine `sample` changes the value of the parameters, which\
    \ is reflected throughout the program. As a result, when parameters are referenced,\
    \ changing their value in the function changes their value in the main program.\n\
    \nThe program operates as follows:\n\n- An array with the values ranging from\
    \ 0 to 10 is defined.\n- This array is then passed to the “sample” subroutine.\n\
    - A subroutine called “sample” has already been defined. The first and second\
    \ parameters’ values are changed within this via the argument array `@_`.\n- After\
    \ calling the subroutine, the values of the array `@a` are displayed. The first\
    \ two scalar values are now updated to A and B, respectively.\n\n### PERL RECURSION\n\
    \nRecursion is a mechanism that allows a function to call itself repeatedly until\
    \ the required condition is met. When the function call statement is written within\
    \ the same function, the function is said to be recursive.\n\nThe argument passed\
    \ to a function is retrieved from default array `@_`, with each value accessible\
    \ via `$_[0]`, `$_[1]`, and so on.\n\n**First example**: The following example\
    \ computes the factorial of a number.\n\nThe program works as follows:\n\n- Step\
    \ 1: When the value of scalar `a` is 0 or 1, the function returns 1 because both\
    \ 0! and 1! are 1.\n- Step 2: If the value of the scalar `a` is 2, then `fac(x-1)`\
    \ calls `fac(1)`, which returns 1.\n  - As a result, `2*factorial(1) = 2*1 = 2`.\n\
    \  - As a result, it will return 2.\n- Step 3: Similarly, when higher values are\
    \ passed to the function, the argument value decreases by 1 with each call and\
    \ computes until the value reaches 1.\n\n**Second example**: The following example\
    \ computes the Fibonacci series up to a given number.\n\nHere’s how the program\
    \ works:\n\n- Step 1: The function `fib()` is called with 3 parameters, the first\
    \ two of which are 0 and 1, while `$n` is number till which series is to be printed.\n\
    - Step 2: These values are transferred in the form of an array, the contents of\
    \ which are retrieved using `shift`.\n- Step 3: For each call, the first two values\
    \ are retrieved using `shift` and stored in scalars `c` and `d`. These two values\
    \ are now added to yield the next value in the series. This step is repeated until\
    \ the value reaches the end value specified by the user.\n\nIn this chapter, we\
    \ covered subroutines in Perl where we discussed function signature, passing complex\
    \ parameters to a subroutine, and mutable and immutable parameters. Moreover,\
    \ we discuss multiple subroutines use of `return()` function, pass by reference,\
    \ and recursion.\n\n# Appraisal\n\nPerl is a widely used cross-platform, open-source\
    \ programming language in both the commercial and private computing industries.\
    \ Perl was favored by Web developers in the late 20th and early 21st centuries\
    \ because of its adaptable text-processing and problem-solving skills.\n\nLarry\
    \ Wall, an American programmer and linguist, published Perl 1.0 for Unix-based\
    \ computers for the first time in December 1987. This early version of Perl was\
    \ an intuitive, easily coded language for reading, extracting, and printing information\
    \ from text files; it was also capable of doing other systems management tasks.\
    \ Perl, which is frequently believed to stand for “practical extraction and report\
    \ language,” was inspired by existing programming languages, such as C, BASIC,\
    \ and AWK, but its wide usage of common English terminology reflected Wall’s linguistic\
    \ background.\n\nPerl is a programming language designed for script manipulation.\
    \ However, Perl is now used for a wide range of purposes, including web development,\
    \ graphical user interface (GUI) development, system administration, and many\
    \ others. It is a reliable and cross-platform programming language.\n\nPerl CGI\
    \ is used for web development. CGI is the system gateway that communicates with\
    \ the web browser and Perl.\n\nIts most common application is extracting information\
    \ from a text file and printing a report to convert a text file into another format.\
    \ This is due to its name being derived from the phrase “Practical Extraction\
    \ and Report Language.”\n\nPerl scripts are programs written in Perl, whereas\
    \ Perl programs are system programs that execute Perl scripts. Perl is a scripting\
    \ language. When we run a Perl program, it is first compiled into byte code and\
    \ then converted into machine instructions. Writing something in Perl rather than\
    \ C saves time.\n\nIt works with the vast majority of operating systems and is\
    \ included in the Oxford English Dictionary. It borrows concepts and syntax from\
    \ a variety of languages, including AWK, bourne shell, C, sed, and even English.\n\
    \n## HISTORY OF PERL\n\nLarry Wall created Perl in 1987 as a scripting language\
    \ to help with report processing.\n\nOn December 18, 1987, it was released in\
    \ version 1.0.\n\n- Perl 2 was released in 1988, and it included a much improved\
    \ regular expression engine.\n- Perl 3 was released in 1989, and it included support\
    \ for binary data streams.\n- Perl 4, released in 1991, had better documentation\
    \ than previous versions.\n- On October 17, 1994, Perl 5 was released. Its most\
    \ recent version included many new features, such as objects, variables, references,\
    \ and modules.\n- The most recent version, 5.24, was released on May 9, 2016.\n\
    \n## FEATURES OF PERL\n\n- It has a straightforward object-oriented programming\
    \ syntax.\n- It can easily expand because it supports 25,000 open-source modules.\n\
    - Unicode is supported.\n"
