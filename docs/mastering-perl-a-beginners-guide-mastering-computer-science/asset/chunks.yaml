  trans: "\n\n# 面向对象编程（OOP）中的多态\n\n多态是以多种形式处理数据的能力。Poly 意味着“多”，morphism 意味着“形态”；因此，术语本身就体现了其含义。多态是面向对象编程语言中最基础的概念之一。在\
    \ OOP 中，当父类引用指向子类对象时，通常会使用多态。本节将探讨如何以多种类型和格式表达任何函数。\n\n多态的一个真实世界例子是，人在生活中可能同时扮演多个角色。例如一个女性同时承担着母亲、妻子、员工和女儿的角色。因此，同一个体必须具备各种特征，每种特征都必须根据场景和条件来实现。多态被认为是\
    \ OOP 最核心的特性之一。\n\nOOP 的主要优势是多态。多态是如此本质，以至于不支持多态的语言不能被称为面向对象的语言。基于对象的语言是指那些拥有类但不支持多态的语言。因此，多态对于\
    \ OOP 语言来说至关重要。它是对象或引用在不同上下文中呈现多种形式的能力。它支持函数重载、函数重写和虚函数。\n\n![](img/ufig7_7.jpg)\n\
    \nOOP 中的多态。\n\n多态是一种属性，允许向多个类的对象发送任何消息，并且每个对象都可以根据其类属性做出相应的响应。\n\n这意味着在 OOP 语言中，多态是一种根据调用它的对象类型执行不同操作的方法。例如，`$square->area()`\
    \ 将返回正方形的面积，而 `$triangle->area()` 可能返回三角形的面积。另一方面，`$object->area()` 则必须根据调用 `$object`\
    \ 的类来计算面积。\n\n使用以下示例可以解释多态：\n\n```perl\nuse warnings; # 使用 package package A 创建类;\
    \ # 构造函数-创建\nsub new { # shift 将获取包名 ’vehicle’\n# 并将其赋值给变量 ’class’ my $class =\
    \ shift; \nmy $self = { ’name’ => shift, ’roll_no’ => shift }; \nsub poly_example\
    \ { print(\"This corresponds to a class A\\n\"); } }; \npackage B; # @ISA 数组包含一个列表\n\
    # 存储该类的父类（如果有的话） my @ISA = (A); \nsub poly_example { print(\"This corresponds\
    \ to a class B\\n\"); } \npackage main; B->poly_example(); A->poly_example();\n\
    ```\n\n在类 `B` 中定义的方法 `poly_example()` 重写了继承自类 `A` 的定义（对于第一个输出如此，第二个输出反之亦然）。这允许你添加或扩展任何预存在包的功能，而无需反复重写整个类的定义。结果是程序员的生活变得更加便利。\n\
    \n# OOP 中的封装\n\nPerl 中的封装是将数据封装起来的过程，以使其免受不应访问该代码区域的外部源的影响。封装是 OOP 的一个组件；它将数据与更改它的子程序绑定在一起。从另一个意义上说，封装是一种保护屏，防止数据被此屏障之外的代码访问。\n\
    \n*   从技术上讲，在封装下，类的变量或数据对其他类隐藏，并且可能只能通过定义它们的类成员函数进行访问。\n*   与封装一样，类内部的数据是对其他类隐藏的；因此，它有时被称为数据隐藏。\n\
    *   封装可以通过将所有类变量声明为局部（local），并通过导入包来获取类方法（以设置和检索变量值）来实现。\n\n![](img/ufig7_8.jpg)\n\
    \nOOP 中的封装。\n\n考虑封装的一个真实世界例子：在公司中，有多个部门，如会计、财务和销售部。财务部门处理所有的财务交易并维护所有财务数据的记录。\n\
    \n同样，销售部门负责所有与销售相关的操作并维护销售数据。现在，可能会出现一种情况：财务部门官员需要特定月份的完整销售信息。在这种情况下，他不被直接访问销售部门的数据。他必须首先联系销售部门的另一位官员，然后请求该个人提供数据。\n\
    \n这描述了封装。在这里，销售部门的数据以及可能更改数据的人被归类在“销售部门”之下。\n\n如果在上述代码中需要对类数据进行任何修改或仅为了打印类数据，是无法直接完成的。创建该类的对象并然后使用\
    \ `get_details()` 方法访问数据是至关重要的。这被称为数据封装。\n\n封装的优点是：\n\n*   数据隐藏：用户将不确定类的内部实现。用户无法看到类如何在其变量中存储数据。他们只是意识到我们正在向访问器（accessors）赋值，并且变量正在用这些值进行初始化。\n\
    *   增强的灵活性：我们可以根据需要将类变量设为只读或只写。要使变量变为只读，我们需要在代码中使用 Get Accessor（获取）。要使变量变为只写，我们必须只使用\
    \ Set Accessor（设置）。\n*   可重用性：封装还促进了可重用性，并更容易适应新需求。\n*   验证代码简单：封装的代码易于单元测试。\n\
    \n本章涵盖了带有类、对象、方法、构造函数和析构函数的 Perl OOP。此外，我们还讨论了方法重写、继承、多态和封装。\n\n# 第 8 章 Perl 子程序\n\
    \nDOI: [10.1201/9781003358442-8](https://doi.org/10.1201/9781003358442-8)\n\n\
    ## 本章内容\n\n*   函数签名 (Function Signature)\n*   向子程序传递复杂参数\n*   可变与不可变参数\n*   多个子程序\n\
    *   `return()` 函数的使用\n*   按引用传递 (Pass By Reference)\n*   递归\n\n在上一章中，我们讨论了 Perl\
    \ 中的面向对象编程，在本章中，我们将涵盖子程序。\n\n# 子程序或函数\n\nPerl 函数或子程序是执行特定目的的语句集合。在任何编程语言中，代码复用都是理想的。因此，用户将代码块放在函数或子程序中，以消除重复编写代码的需求。在\
    \ Perl 中，函数、子程序和方法是同义词，尽管它们在其他编程语言中是不同的。在 Perl 编程中，子程序是最常用的术，因为它由关键字 `sub` 组成。每当调用函数时，Perl\
    \ 都会暂停整个程序的执行，跳转到函数执行，然后返回之前的代码区域。不需要使用 `return` 语句。\n\n### 确定子程序\n\nPerl 子程序定义的通用形式如下：`sub\
    \ subroutinename { # 方法或子程序的体 }`\n\n### 调用子程序\n\nPerl 中的子程序可以通过通过传递参数列表来调用，如下：`subroutinename(arugumentslist);`\n\
    \n上述描述的方法仅适用于 Perl 5.0 及更高版本。在 Perl 5.0 之前有另一种调用子程序的方法，但不推荐使用，因为它绕过了子程序的原型检查。\n\
    \n### 向子程序传递参数\n\n这用于将值作为参数传递给子程序。这是通过使用特殊列表数组变量 `$_` 完成的。这些将被赋值给函数 `$_[0]`、`$_[1]`\
    \ 等。\n\n程序具有具有优点：\n\n*   它允许我们复用代码，并使错误检测和调试变得更容易。\n*   有助于代码的结构化组织。\n*   代码段被组织成块。\n\
    *   它提高了代码的可读性。\n\n"
