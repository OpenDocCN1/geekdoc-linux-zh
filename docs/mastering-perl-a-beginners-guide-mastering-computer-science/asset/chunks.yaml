  trans: "\n该模块的 Perl 文件如下所示：\n\n```perl\n#!/usr/bin/perl\n# Using the Message.pm\
    \ package\nuse Message;\n# Defining the value to variable\n$Message::username\
    \ = \"Peeks\";\n# Subroutine-call Message::Hello();\n```\n\n### 使用预定义模块\n\nPerl\
    \ 有几个预定义的模块，可以随时在 Perl 程序中使用，例如 `strict` 和 `warnings`。\n\n## PERL 包 (PACKAGES)\n\
    \nPerl 包（package）是一组储存在其特定命名空间中的代码。Perl 模块（module）是定义在与包同相同且扩展名为 `.pm` 的文件中的包。同名的变量或函数可能存在于两个不同的模块中。任何不属于包的变量都属于主包（main\
    \ package）。因此，所有使用的变量都是 `main` 包的一部分。额外包的确保确保来自不同包的变量不会相互干扰。\n\n### Perl 模块声明\n\
    \n模块名称必须与包名相同，并具有 `.pm` 扩展名。\n\n该文件名为 `Calculator.pm`，存储在目录 `Calculator` 中。为了向解释器返回真值，在函数后面写入\
    \ `1`。除了 `1`，Perl 也接受任何为真的值。\n\n### 使用 Perl 模块\n\n我们利用 `need` 或 `use` 函数来访问此计算器模块。`::`\
    \ 用于访问模块中的函数或变量。这里有一个示例展示：\n\n```perl\n#!/usr/bin/perl\n# Using Package ’Calculator’\n\
    use Calculator;\nprint \"Enter the two numbers to add\";\n# Defining values to\
    \ variables\n$x = 10;\n$y = 20;\n# Subroutine-call Calculator::addition($x, $y);\n\
    print \"\\nEnter the two numbers to subtract\";\n# Defining values to the variables\n\
    $x = 30;\n$y = 10;\n# Subroutine-call Calculator::subtraction($x, $y);\n```\n\n\
    ### 使用不同的目录访问包\n\n如果访问包的文件位于目录之外，我们使用 `::` 来指定模块的路径。例如，因为使用计算器模块的文件位于 calculator\
    \ 包之外，我们编写 `Calculator::Calculator` 来加载该模块，其中 `::` 左侧的值代表包名，`::` 右侧的值代表 Perl 模块名。为了说明，请考虑以下示例：\n\
    \n```perl\n#!/usr/bin/perl\nuse GFG::Calculator;\n# Directory_name::module_name\n\
    print \"Enter the two numbers to add\";\n# Defining values to variables\n$x =\
    \ 10;\n$y = 20;\n# Subroutine-call Calculator::addition($x, $y);\nprint \"\\nEnter\
    \ the two numbers to subtract\";\n# Defining values to the variables\n$x = 30;\n\
    $y = 10;\n# Subroutine-call Calculator::subtraction($x, $y);\n```\n\n### 利用模块变量\n\
    \n在这些变量之前声明来自各个包的变量允许它们被利用。下面的示例说明了这一点。\n\n该模块的 Perl 文件如下所示。\n\n### BEGIN 和 END\
    \ 块\n\n当我们希望在开始运行某些代码并在结束运行某些代码时，我们利用 `BEGIN` 和 `END` 块。`BEGIN...` 中的代码在脚本开始时运行，而\
    \ `END...` 中的代码在结束时执行。在以下程序中演示了这一点：\n\n```perl\n#!/usr/bin/perl\n# Predefined\
    \ BEGIN block\nBEGIN {\n    print \"In begin block\\n\";\n}\n# Predefined END\
    \ block\nEND {\n    print \"In end block\\n\";\n}\nprint \"Hello Everyone;\\n\"\
    ;\n```\n\n## PERL 中的数字及其类型\n\n在 Perl 中，数字是一个数学对象，可以用于计数、测量和执行不同的数学运算。数字符号（numeral）是象征数字的记法符号。除了用于数学运算外，这些符号还用于排名（以序列号的形式）。\n\
    \n这些数字可以根据其应用分为几类：\n\n-   **整数 (Integers)：** Perl 整数表示为以 10 为底的进制数。这些数字可能是正的也可能是负的。另一方面，Perl\
    \ 采用 `_` 来表示大整数值以提高可读性。例如：`213,254,484` 表示为 `213_254_484`。\n\n```perl\n#!/usr/bin/perl\n\
    # Positive-Integer\n$c = 30;\n# Negative-Integer\n$d = -25;\n# Big Integer-Number\n\
    $e = 213_254_484;\n# Printing these numbers\nprint(\"Positive Integer: \", $c,\
    \ \"\\n\");\nprint(\"Negative Integer: \", $d, \"\\n\");\nprint(\"Big Integer:\
    \ \", $e, \"\\n\");\n```\n\n-   **浮点数 (Floating point numbers)：** 在 Perl 中，浮点数由整数部分和小数部分组成，由小数点分隔。浮数的整数部分可以是正的或负的，而小数部分只能是正的。在\
    \ Perl 中，浮数可以用两种方式表示：\n\n    -   **定点法 (Fixed point)：** 在这种格式下，小数点是固定的。这个小数点标记了小数部分的开始。\n\
    \n    -   **科学计数法 (Scientific)：** 这种表示法包含两个部分：系数（实际数字）和指数（系数所乘的 10 的幂次）。\n\n```perl\n\
    #!/usr/bin/perl\n# Positive Floating-Number\n$c = 20.5647;\n# Negative Floating-Number\n\
    $d = -15.2451;\n# Scientific-value\n$e = 123.5e-10;\n# Printing these numbers\n\
    print(\"Positive Number: \", $c, \"\\n\");\nprint(\"Negative Number: \", $d, \"\
    \\n\");\nprint(\"Scientific Number: \", $e, \"\\n\");\n```\n\n-   **十六进制数 (Hexadecimal\
    \ numbers)：** 十六进制数字基数为 16，范围从 0 到 15，并并在数字前加上 `0x` 写为 `0xa`，这里的 `a` 代表十六进制形式中的值\
    \ 10。这些字母代表 10–15，范围从 `a` 到 `f`。十六进制数字可以有正值和负值。\n\n因此，`% x` 用于以十六进制格式显示数字的值，如上所示。\n\
    \n-   **八进制数 (Octal numbers)：** 八进制数是基数为 8 的数字，范围从 0 到 7。这些数字表示为 `057`，数字前面有一个\
    \ `0`，其余部分为十进制值。八进制数像其他类型一样可以是正的也可以负的。\n\n    `% o` 在此处用于输出八进制值。\n\n-   **二进制数\
    \ (Binary numbers)：** 二进制数基数为 2，范围从 0 到 1。这些数字写为 `0b1010`，在数字前带有 `0b`。\n\n   \
    \ `% b` 用于以二进制格式显示数字。\n\n## PERL 中目录的增删改操作\n\nPerl 是一种通用且跨平台的编程语言，主要用于文本处理，并用于开发多种软件应用程序，如\
    \ Web 开发和图形界面应用程序。它优于其他编程语言因为它更快更强大，而且包含许多有助于快速创建脚本的快捷方法。\n\n对目录执行以下操作：\n\n- \
    \  创建新目录\n-   打开现有目录\n-   读取目录内容\n-   修改目录路径\n-   关闭目录\n-   删除目录\n\n### 创建新目录\n\
    \n`mkdir(PATH, MODE)` 用于创建目录。此函数协助创建新目录；如果用户想检查文件是否存在，可以使用 `-e` 函数。`PATH` 使用 `MODE`\
    \ 函数指定的模式设置路径。\n\n### 打开现有目录\n\n在 Perl 中，短函数 `opendir(DIRHANDLE, PATH)` 用于打开目录。`PATH`\
    \ 参数定义了要打开的目录路径。\n\n### 在标量和列表中读取目录\n\n读取目录是一项常规操作，因为每次运行或理解代码时都必须读取存储在文件中的内容。`readdir(DIRHANDLE)`\
    \ 用于读取目录。用户可以用标量上下文和列表上下文两种方式读取目录。\n"
