    当使用 `">”` 以写入模式打开文件时，现有文件的内容会被破坏，并且通过 `print` 语句添加的内容将写入文件。在此模式下，写入点被设置为文件的末尾。因此，旧文件内容会被保留，所有使用
    `print` 语句写入文件的内容都会追加到文件末尾。然而，在文件以 `+>>` 模式（表示添加和读取）打开之前，无法执行读取操作。


    该程序的运行流程如下：


    * 步骤 1：以读取模式打开文件以查看文件的现有内容。

    * 步骤 2：打印文件的现有内容。

    * 步骤 3：通过追加模式（Append mode）打开文件向其添加材料。

    * 步骤 4：收集用户文本并附加文件。

    * 步骤 5：向文件中添加文本。

    * 步骤 6：重新读取文件以确定内容是否已更改。

    * 步骤 7：关闭文件。


    ## CSV 文件读取


    Perl 最初设计用于文本处理，例如从文本文件中提取信息并将其转换为新格式。在 Perl 中，读取文本文件是一项频繁的活动。例如，读取 CSV（逗号分隔值）文件以提取数据和信息是一项常见任务。


    可以使用任何文本编辑器（如记事本、notepad++ 等）创建 CSV 文件。在记事本文本文件中添加材料后，将其保存为带有 `.csv` 扩展 CSV 文件。


    **CSV 文件示例：**


    ![](img/ufig5_1.jpg)


    CSV 文件示例。


    CSV 文件可用于处理企业或组织的数据库记录文件。这些文件可以方便地在 Excel 中打开，并可以使用任何兼容应用程序进行编辑。Perl 还允许通过从文件中提取值、修改这些值并将修改后的值插回文件，来处理和构建这些“csv”文件。我们将使用
    `split` 函数从特定行中提取每个值。


    ### 使用 Split() 进行数据提取


    `split()` 是一个标准的 Perl 函数，用于使用分隔符将字符串分为若干部分。该分隔符可以是用户指定的任何字符；但我们通常使用逗号。


    `split()` 接受两个参数。第一个是分隔符，第二个是要被划分的字符串。


    使用以下步骤通过分隔符将 CSV 文件中的行划分为部分：


    * 步骤 1：逐行读取文件。

    * 步骤 2：将每行的所有值放入数组中。

    * 步骤 3：为了获得结果，单独打印所有数据。


    让我们来看一个示例以更好地理解该主题。`split()` 方法用于使用分隔符划分 `new.csv` 文件中记录的字符串，如下所示：


    ```

    use strict; my $file = $ARGV[0] or die; open(my $data, ’<’, $file) or die; while
    (my $line = <$data>) { chomp $line; # Split line and store it # inside words array
    my @words = split ", ", $line; for (my $x = 0; $x <= 2; $x++) { print "$words[$x]
    "; } print "\n"; }

    ```


    将上述代码保存为带有 `.pl` 扩展名的文本文件。在这种情况下，我们将其存储为 `test1.pl`。


    使用以下命令运行之前存储的文件：`perl test1.pl new.csv`


    ### 逗号字符转义


    有时文件的字符串字段内部包含逗号，如果删除它会改变数据的解释或使记录无法使用。在这种情况下使用 `split()` 函数，即使在引号内，它每遇到逗号作为分隔符就会划分数据，因为
    `split()` 不忽略引号也不理解 CSV。它只是在遇到分隔符字符时进行切割。


    以下是一个引号内包含逗号的 CSV 文件：


    ![](img/ufig5_2.jpg)


    逗号字符转义。


    上述 CSV 文件中的第一个字段包含逗号；因此它被包含在引号内。然而，如果我们对此文件执行 `split()` 方法，它将忽略任何此类引号。


    上述程序中的 `split()` 方法即使在字段处于引号之间也将字符串字段拆分成了碎片；此外，由于我们在代码中只打印了三个字段，最后一个字符串的第三个字段在输出文件中被丢弃了。


    为了处理此类场景，Perl 有若干种限制和范围，允许编译器跳过引号内的字段划分。


    我们利用 `TEXT::CSV`，它提供了一个完整的 CSV 读取器和写入器。`TEXT::CSV` 是一个 Perl CPAN 模块，增加了许多额外功能，如读取、解析和写入
    CSV 文件。可以使用以下预指令在 Perl 程序中包含这些模块：`use Text::CSV`


    然而，我们必须先在设备上下载并安装该模块才能使用其功能。


    ### 安装 TEXT::CSV


    对于 Windows：`perl -MCPAN -e shell install Text::CSV`


    对于 Debian/Ubuntu 系统：`$ sudo apt-get install libtext-csv-perl`


    对于 RedHat/Centos/Fedora 系统：`$ sudo yum install perl-Text-CSV`


    要转义引号之间的逗号字符，请在我们 `new.csv` 文件上运行以下代码：


    ```

    use strict; # Using the Text::CSV file to allow # full CSV Reader and Writer use
    Text::CSV; my $csv = TEXT::CSV->new({ sep_char => ’, ’ }); my $file_to_be_read
    = $ARGV[0] or die; # Reading file open(my $data_file, ’<’, $file_to_be_read) or
    die; while (my $line = <$data_file>) { chomp $line; # Parsing line if ($csv->parse($line))
    { # Extracting elements my @words = $csv->fields(); for (my $x = 0; $x <= 2; $x++)
    { print "$words[$x] "; } print "\n"; } else { # Warning to display warn "Line
    could not parse: $line\n"; } } } }

    ```


    上述示例中的第一个字段现在包含一个逗号，它在解析 CSV 文件时已通过转义。


    上一行描述了如何调用类的构造函数。箭头 `->` 用于调用构造函数。


    此调用将尝试解析当前行并将其划分为块。根据成功或失败返回真或假。


    ### 嵌入换行符的字段


    CSV 文件中的特定字段可能是多行的，或者在单词之间嵌入了换行符。当通过 `split()` 方法提供这些多行字段时，它们的行为与没有嵌入换行符的其他文件有很大不同。


    上述 CSV 文件中的嵌入换行符现在由 `getline()` 函数处理，并根据需要被包含在引号内。


    ## 文件测试操作符


    在 Perl 中，文件测试操作符是产生真或假值的逻辑运算符。Perl 提供了许多测试文件特性的运算符。例如，`-e` 运算符用于检查文件是否存在。或者，它可以确定文件是否可以写入。这有助于减少程序可能遇到的错误。


    以下示例使用 `-e` 存在操作符来判断文件是否存在：


    ```

    #!/usr/bin/perl # 使用预定义模块 warnings; use strict; # 将路径传递给变量 my $filename = ’C:\Users\PeeksForeks\PFP.txt’;
    # 检查文件是否存在 if(-e $filename) { # 如果文件存在 print("File $filename exists\n"); } else
    { # 如果文件不存在 print("File $filename doesn’t exists\n"); }

    ```


    此文件测试操作符 `-e` 接受文件名或句柄作为输入。


    下表列出了最重要的文件测试操作符：


    | 操作符 | 说明 |

    | --- | --- |

    | -r | 检查是否可读 |

    | -w | 检查是否可写 |

    | -x | 检查是否是否可执行 |

    | -o | 检查文件是否属于有效 uid |

    | -R | 检查文件是否允许真实 uid 读取 |

    | -W | 检查文件是否允许真实 uid  |

    | -X | 检查文件是否允许真实 uid/gid 执行 |

    | -O | 检查文件是否属于真实 uid |

    | -e | 检查文件是否存在 |

    | -z | 检查文件是否为空 |

    | -s | 检查文件大小是否非零（返回字节数） |

    | -f | 检查是否为普通文本文件 |

    | -d | 检查是否为目录 |

    | -l | 检查是否为符号链接 |


