    我们有一个基类 `vehicle`，它拥有 `get_mileage()` 和 `get_cost()` 方法，以及一个派生类 `car`，它拥有 `get_mileage()`
    和 `get_age()` 方法。现在，由于两个类中的一个方法名称相同，它们的执行将遵循**方法重写（Method overriding）**的概念。让我们来看示例以及如何执行的。


    ### 基类的创建

    ```perl

    # 基类的声明和定义

    use strict;

    use warnings;

    # 创建父类包

    package vehicle;

    sub new {

    # shift 将获取包名 ’vehicle’

    # 并将其赋值给变量 ’class’

    my $class = shift;

    my $self = { ’distance’=> shift, ’petrol_consumed’=> shift };

    # 使用 bless 函数将对象绑定到类

    bless $self, $class;

    # 从构造函数中返回对象

    return $self;

    }

    # 计算里程数的方法

    sub get_mileage {

    my $self = shift;

    # 计算结果

    my $result = $self->{’distance’} / $self->{’petrol_consumed’};

    print "The mileage by our vehicle is: $result\n";

    }

    # 计算成本的方法

    sub get_cost {

    my $self = shift;

    # 计算结果

    my $result = $self->{’petrol consumed’} * 70;

    print "Cost is: $result\n";

    }

    1;

    ```


    ### 派生类的创建

    ```perl

    # 声明和定义派生类

    # 创建派生类

    package car;

    use strict;

    use warnings;

    # 使用父类

    parent ’vehicle’;

    # 重写方法

    sub get_mileage {

    my $self = shift;

    # 计算结果

    my $result = $self->{’distance’} / $self->{’petrol_consumed’};

    print "The mileage by our car is: $result";

    }

    # 从用户获取年龄的方法

    sub get_age {

    my $self = shift;

    # 从用户处获取输入

    my $age = <>;

    # 打印年龄

    print "The Age is: $age\n";

    }

    1;

    ```


    ### 使用对象演示方法重写过程

    ```perl

    # 调用每个类的对象

    # 方法

    # 使用相应的对象。

    use strict;

    use warnings;

    # 使用派生类作为父类

    use car;

    # 对象的创建和初始化

    my $ob1 = vehicle -> new(2550, 170);

    my $ob2 = car -> new(2500, 250);

    # 使用重写调用方法

    $ob1->get_mileage();

    $ob2->get_mileage();

    ```


    如所示，通过对象调用的类方法会重写不同类中相同名的其他方法。`vehicle` 对象上的 `get_mileage` 方法通过 `vehicle` 类中声明的方法打印“The
    mileage by our vehicle is: 15”。当我们对 `car` 对象执行 `car` 类中的 `get_mileage` 方法时，我们得到的输出是“The
    mileage by our car is: 10。”


    ### 为什么我们需要重写方法？


    如前所述，重写的方法允许 Perl 在运行时提供多态性。


    多态性对面向对象编程（OOP）至关重要，原因如下：它允许基类描述将被所有后代共享的方法，而子类可以定义这些方法中任何或所有方法的特定实现。Perl 还通过重写方法提供了多态性的“一个接口，多个方法”的元素。


    动态方法分发（运行时多态）是面向对象架构中代码复用和韧性最有效的策略之一。在不重新编译的情况下，让代码库能够调用新类实例的方法，同时保持整洁的抽象接口，这是一项强大的工具。


    重写的方法允许我们在在不知道派生类对象类型的情况下，调用任何派生类的方法。因此，方法重写简化了编程，因为在开发新方法时不需要记忆不同的名称；相反，记住方法内部的过程变得更为必要。


    ## OOP 中的继承


    继承是一个类提取并使用另一个类特性的能力。它是从现有类（称为**基类（Base classes）**）中创建新类（称为**派生类（Derived classes）**）的过程。其核心思想是，程序员可以在另一个类中使用其中一个类的特性，而无需在多个类中多次声明或定义相同项。


    我们可以从基类继承成员函数，而不是在每个类声明中重新编写它们。继承是 OOP 最核心的特征之一。


    **子类（Subclass）：** 子类或派生类是继承自另一个类属性的类。


    **父类（Superclass）：** 被子类继承属性的类被称为父类或基类。


    继承最基本的原理是从另一个类创建或派生新类。


    ### 基类与派生类


    派生类是通过从基类派生出额外的继承子类创建的。一个基类可以有多个派生类；这种继承类型被称为**层级继承（Hierarchical Inheritance）**。这些派生类都源自同一个父类或基类。当一个派生类共享多个父类并从多个父类继承其特征时，就会发生**多重继承**。


    ![](img/ufig7_3.jpg)


    基类和驱动类。


    上面的图片描述了类从基类派生的顺序。上图中所示顺序和标记将在需要时用于在理论上描述继承顺序。


    考虑 `Vehicles` 类。现在我们必须为每种类型的车辆创建一个类，例如巴士、汽车或卡车。对于所有 `Vehicles`，`fuelAmount()`、`capacity()`
    和 `applyBrakes()` 方法将是相同的。


    ![](img/ufig7_4.jpg)


    继承创建。


    之前的图片描述了在没有继承概念的情况下创建这些类。


    上述过程显然导致了相同代码的重复三次。这增加了错误的概率和数据冗余。继承被用于避免这种情况。如果我们创建一个类，在其中编写这些函数，并从那里继承其余部分，我们就可以简单地避免数据重复并增加重用性。


    ![](img/ufig7_5.jpg)


    三个类继承自一个类。


    由于我们继承了其余部分，我们只需要编写一次，而不是编写三次。


    ### 多级继承


