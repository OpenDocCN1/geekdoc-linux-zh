  trans: "\n\n这是一个嵌套的 `given-when` 语句示例：\n\n```perl\n#!/usr/bin/perl\n# 用于打印相应日期的程序\n\
    # 使用 given-when 语句处理日期代码\nuse 5.010;\n# 要求用户提供日期代码\nprint \"Enter daycode between\
    \ 0-6\\n\";\n# 使用 chomp 移除换行符\nchomp(my $daycode = <>);\n# 使用 given-when 语句\n\
    given ($daycode) {\n    when (’0’) { print ’Sunday’ ;}\n    when (’1’) {\n   \
    \     print \"What time of day is it?\\n\";\n        chomp(my $daytime = <>);\n\
    \        # 嵌套 given-when 语句\n        given($daytime) {\n            when(’Morning’)\
    \ {print ’It is Monday Morning’};\n            when(’Noon’) {print ’It is Monday\
    \ noon’};\n            when(’Evening’) {print ’It is Monday Evening’};\n     \
    \       default{print’Invalid Input’};\n        }\n    }\n    when (’2’) { print\
    \ ’Tuesday’ ;}\n    when (’3’) { print ’Wednesday’ ;}\n    when (’4’) { print\
    \ ’Thursday’ ;}\n    when (’5’) { print ’Friday’ ;}\n    when (’6’) { print ’Saturday’\
    \ ;}\n    default { print ’Invalid daycode’;}\n}\n```\n\n当输入的日期代码为 1 以外的任何值时，代码不会运行嵌套的\
    \ `given-when` 块，输出将与上一个示例相同；但是，如果我们提供 1 作为输入，代码将执行嵌套的 `given-when` 块，结果将与上一个示例不同。\n\
    \n## goto 语句\n\nPerl 中的 `goto` 语句是一种跳转语句，有时被称为无条件跳转语句。`goto` 语句可以从函数内部的一个位置跳转到另一个位置。\n\
    \n上述语法中的 `goto` 语句指示编译器立即去/跳转到指定为 `LABEL` 的语句。`label` 是一个用户定义的标识符，在此例中指定目标语句。目标语句是紧跟在“label”\
    \ 之后的语句。\n\n在 Perl 中，`goto` 语句有三种形式：`Label`、`Expression` 和 `Subroutine`。\n\n-\
    \ `Label`：它将跳转到 `LABEL` 指出的语句，并从那里继续执行。\n- `Expression`：这种形式包含一个表达式，在求值后返回一个 `Label`\
    \ 名称，`goto` 将使其跳转到被标记的语句。\n- `Subroutine`：`goto` 将编译器从当前正在执行的子程序移动到提供名称的子程序。\n\
    \n**带有 LABEL 名称的 goto：** `LABEL` 名称用于跳转到代码中的特定语句并从那里开始执行。然而，它的范围是限制的。它只能在调用的作用域内运行。\n\
    \n**使用 Expression 的 goto：** 也可以使用表达式来调用特定标签并将控制权传递给该标签。当此表达式传递给 `goto` 语句时，它会被评估为标签名称，执行将从该标签名称描述的语句继续。\n\
    \n**带有 Subroutine 的 goto：** `goto` 命令也可以调用子程序。根据其用法，该过程可以从另一个子程序内部调用，也可以单独调用。它将下一个要执行的任务留在调用语句附近。这种方法可以递归地调用函数来打印一系列或范围内的字符。\n\
    \n## next 运算符\n\n在 Perl 中，`next` 运算符会跳过当前循环执行，并将迭代器移动到 `next` 指定的值。如果程序中指定了标签，执行将进入由\
    \ `Label` 指定的下次迭代。\n\n## redo 运算符\n\n在 Perl 中，`redo` 运算符将从指定的标签开始，而不求值条件表达式。一旦调用了\
    \ `redo`，该块中的后续语句将不再执行。即使有 `continue` 块，在 `redo` 调用之后也不会执行。当 `redo` 运算符配合 `Label`\
    \ 使用时，执行从由 `Label` 定义的循环开始。\n\n## last 中的 last\n\n`last` 关键字用于循环控制语句，使循环的当前迭代成为最后一次。如果提供了标签，它将通过该标签退出循环。\n\
    \n在本章中，我们涵盖了 Perl 中的控制流语句。\n\n## 注意事项\n\n# 第 5 章 Perl 中的文件处理\n\nDOI: [10.1201/9781003358442-5](https://doi.org/10.1201/9781003358442-5)\n\
    \n## 本章内容\n\n- 文件处理简介\n- 打开和读取文件\n- 写入和追加文件\n- 读取 CSV 文件\n- 文件测试操作符\n- 文件锁定\n\
    - Slurp 模块的使用\n- 有用的文件处理函数\n\n在上一章中，我们讨论了控制流语句，在本章中，我们将涵盖文件处理。\n\n## 文件处理简介\n\n\
    Perl 中的 `FileHandle` 将一个名称与外部文件连接，该连接可以使用一直到程序终止或 `FileHandle` 关闭。总而言之，`FileHandle`\
    \ 是一种用于编辑外部文件内容的连接，该连接（`FileHandle`）被命名以便于访问和方便使用。\n\n`STDIN`、`STDOUT` 和 `STDERR`\
    \ 是 Perl 中三个基本的 `FileHandles`，分别代表标准输入、标准输出和标准错误设备。\n\n`open` 函数通常用于文件处理。\n\n\
    `Mode` 和 `FileName` 也可以组合产生单个 `open` 表达式。\n\n`close` 函数用于关闭 `FileHandle`。\n\n\
    ### 使用 FileHandle 读取和写入文件\n\n`print` 函数用于读取 `FileHandle`。\n\n`print` 函数用于写入文件。\n\
    \n### 各种文件处理模式\n\n| 模式 | 说明 |\n| --- | --- |\n| “<” | 只读模式 |\n| “>” | 写入模式（会清空文件）\
    \ |\n| “>>” | 追加模式 |\n| “+<” | 读写模式 |\n| “+>” | 读写模式 |\n| “+>>” | 读写模式 |\n\n1.\
    \ **Mode = “<”**\n此模式是只读的。此模式用于读取文件内容。\n**示例：** 考虑 `Hello.txt`，初始包含“Welcome”。\n\
    ```perl\n#!/usr/bin/perl\n# 以只读模式打开文件\nopen(r, \"<\", \"Hello.txt\");\n# 打印内容\n\
    print(<r>);\n# 关闭\nclose(r);\n```\n\n2. **Mode = “>”**\n这是写入模式。当我们用此模式打开文件时，原始内容会被删除。如果没有同名文件，将创建一个。\n\
    ```perl\n#!/usr/bin/perl\n# 以只读模式打开文件\nopen(r, \"<\", \"Hello.txt\");\n# 打印现有内容\n\
    print(\"Existing Content of Hello.txt: \". <r>);\n# 以写入模式打开文件\nopen(w, \">\",\
    \ \"Hello.txt\");\n# 将指针移到开头\nseek r, 0, 0;\nprint(\"\\n 写入写入...\");\n# 使用 w 写入\n\
    print w \"The Content of this file changed\";\n# 关闭\nclose(w);\n# 将指针移到开头\nseek\
    \ r, 0, 0;\n# 打印更新后的内容\nprint(\"\\nUpdated Content of Hello.txt: \".<r>);\n# 关闭\n\
    close(r);\n```\n\n3. **“>>”**\n追加模式。当我们用此模式打开文件时，原始内容不会被删除。由于字符串总是附加在末尾，此模式无法用于覆盖。如果没有发现同名文件，将创建一个。\n\
    ```perl\n#!/usr/bin/perl\n# 以只读模式打开文件\nopen(r, \"<\", \"Hello.txt\");\n# 打印现有内容\n\
    print(\"Existing Content of Hello.txt: \". <r>);\n# 以追加模式打开文件\nopen(A, \">>\"\
    , \"Hello.txt\");\n# 将指针移到开头\nseek r, 0, 0;\nprint(\"\\n 追加写入...\");\n# 使用 A 追加\n\
    print A \" Hello Everyone!\";\n# 关闭\nclose(A);\n# 将指针移到开头\nseek r, 0, 0;\n# 打印更新后的内容\n\
    print(\"\\nUpdated Content of Hello.txt: \".<r>);\n# 关闭\nclose(r);\n```\n\n4.\
    \ **Mode = “+<”**\n\n"
- fmt: "\nThis is known as Read-Write mode. This function may be used to replace an\
    \ existing string in file. It is unable to create a new file.\n\n```perl\n#!/usr/bin/perl\n\
    # Open Hello1.txt in Read-Write Mode\nopen(rw, \"+<\", \"Hello1.txt\");\n# Print\
    \ original contents of File.\n# rw is set to the end.\nprint(\"Existing Content\
    \ of the Hello1.txt: \".<rw>);\n# The string is attached at the end\n# of original\
    \ contents of the file.\nprint rw \"Added using the Read -Write Mode.\";\n# Set\
    \ rw to the beginning of File for reading.\nseek rw, 0, 0;\n# Printing Updated\
    \ content of the File\nprint(\"\\nUpdated contents of Hello1.txt: \".<rw>);\n\
    # Close FileHandle\nclose(rw);\n```\n\n## 5. Mode = “+>”\n\nThis is known as Read-Write\
    \ mode. The distinction between `+` and `+>` is that `+>` can create a new file\
    \ even if one with the same name already exists, whereas `+` cannot.\n\n```perl\n\
    #!/usr/bin/perl\n# Opening File Hello1.txt in the Read mode\nopen(r, \"<\", \"\
    Hello1.txt\");\n# Printing existing content of the file\nprint(\"Existing Content\
    \ of Hello1.txt: \". <r>);\n# Closing File\nclose(r);\n# Open Hello1.txt in the\
    \ Read-Write Mode\nopen(rw, \"+>\", \"Hello1.txt\");\n# Original contents of File\n\
    # are cleared when File is opened\nprint(\"\\nContents of Hello1.txt gets cleared…\"\
    );\n# The string is written to File\nprint rw \"Hello!!! This is the updated file.\"\
    ;\n# Set rw to the beginning of File for reading.\nseek rw, 0, 0;\nprint(\"\\\
    nUpdated Content of Hello1.txt: \" .<rw>);\n# Closing File\nclose(rw);\n```\n\n\
    ## 6. Mode = “+>>”\n\nThis is called Read-Append mode. This may be used to both\
    \ read from and append to a file. A new one with the same name is generated if\
    \ no such file exists.\n\n```perl\n# Open Hello1.txt in Read-Append Mode\nopen(ra,\
    \ \"+>>\", \"Hello1.txt\");\n# Set ra to beginning of File for reading.\nseek\
    \ ra, 0, 0;\n# Original content of File\n# is NOT cleared when File is opened\n\
    print(\"Existing Content of File: \". <ra>);\nprint \"\\nAppending to File....\"\
    ;\n# The string is appended to File\nprint ra \"Added using Read-Append Mode\"\
    ;\n# Set ra to the beginning of File for reading.\nseek ra, 0, 0;\n# Printing\
    \ updated content\nprint(\"\\nUpdated content of File: \". <ra>);\n# Closing File\n\
    close(rw);\n```\n\n## Redirecting Output\n\nUsing the `choose` function, output\
    \ may be redirected away from the console and into a file.\n\n## FILE OPENING\
    \ AND READING\n\nA `FileHandle` is a Perl internal structure that connects a physical\
    \ file to a name. All `FileHandles` have read/write access; therefore, reading/writing\
    \ is possible once attached to a file. However, when associating a `FileHandle`,\
    \ the mode in which the file handle is opened must give.\n\n### Opening a File\n\
    \nThe `open` function is used to open either a new or existing file.\n\nIn this\
    \ case, `FileHandle` is the handle returned by the `open` function, and `VAR`\
    \ is the expression containing the file name and opening mode.\n\nThe table below\
    \ displays the various file opening modes and access to various operations.\n\n\
    | Mode | Description |\n| --- | --- |\n| r or < | The Read Only Access |\n| w\
    \ or > | Creates, Writes, and Truncates |\n| a or >> | Writes, Appends, and Creates\
    \ |\n| r+ or +< | Reads and Writes |\n| w+ or +> | The Reads, Writes, Creates,\
    \ and Truncates |\n| a+ or +>> | The Reads, Writes, Appends, and Creates |\n\n\
    ### Reading a File\n\nWhen a `FileHandle` is assigned to a file, it may perform\
    \ actions such as reading, writing, and appending. There are several methods for\
    \ reading the file.\n\n*   Making use of a `FileHandle` operator\n*   Utilizing\
    \ the `getc` function\n*   Utilizing the `read` function\n\n### FileHandle Operator\n\
    \nThe most common way to read data from an open `FileHandle` is with the operator\
    \ `< >`. When used in a list context, the `< >` operator returns a list of lines\
    \ from the provided `FileHandle`. The following example reads one line from a\
    \ file and puts it in a scalar.\n\nLet the contents of the file “PFP.txt” be as\
    \ follows: PeeksforPeeks Hello Peek Peek a revolution Peeks are the best\n\n###\
    \ getc Function\n\nThe `getc` function retrieves a single character from the `FileHandle`\
    \ given, or `STDIN` if none is specified.\n\nIf an error occurs or the `FileHandle`\
    \ is at the end of the file, it returns `undef`.\n\n### read Function\n\nThe `read`\
    \ function reads binary data from a file using the `FileHandle`.\n\nIf no `OFFSET`\
    \ is supplied, `LENGTH` denotes the length of data to be read, and the data is\
    \ inserted at the beginning of `SCALAR`. Otherwise, data is inserted after `OFFSET`\
    \ bytes in `SCALAR`. If the file reading succeeds, the function returns the number\
    \ of bytes read, zero at the end of the file, or `undef` if an error occurred.\n\
    \n### Reading More than One Line at a Time\n\nThe following example reads the\
    \ file’s contents indicated by `FileHandle` until it hits the end of file (EOF).\n\
    \n### Exception Handling in Files\n\nThe exception can be handled in one of the\
    \ two ways:\n\n*   If the file cannot open, throw an exception.\n*   If the file\
    \ cannot open, issue a warning and continue operating.\n\n#### Throw an Exception\n\
    \nWhen `FileHandle` is not allocated a valid file pointer, a `die` is run, which\
    \ prints the message and terminates the current program.\n\nThe code produces\
    \ an error and quits if the file is not found.\n\n#### Give a Warning\n\nWhen\
    \ `FileHandle` cannot be assigned a proper file reference, it produces a warning\
    \ message and continues to operate.\n\n## WRITING TO A FILE\n\nA `FileHandle`\
    \ is a variable used to read and write files. This `FileHandle` is linked with\
    \ the file.\n\nTo write to a file, open it in write mode, as shown below: `open\
    \ (FH, ’>’, \"file_name.txt\");`\n\nIf the file already exists, it replaces the\
    \ old content with the new content. Otherwise, a new file will generate with fresh\
    \ content.\n\n### print() Function\n\nThe `print()` method is used to write data\
    \ to a file.\n\nWhen the file is opened, the `FileHandle` is associated with it,\
    \ and the string contains the content to be written to the file.\n\n**The program\
    \ operates as follows:**\n\n*   Step 1: Open the `Hello.txt` file in write mode.\n\
    *   Step 2: Extract text from the standard input keyboard.\n*   Step 3: Save the\
    \ string saved in `$a` to the file indicated by the `FileHandle` `fh`.\n*   Step\
    \ 4: Save the file.\n\nThe following example reads the source file’s content and\
    \ writes it to the destination file:\n\n```perl\n# Source-File\n$src = ’Source.txt’;\n\
    # Destination File\n$des = ’Destination.txt’;\n# open the source file for reading\n\
    open(FHR, ’<’, $src);\n# open the destination file for writing\nopen(FHW, ’>’,\
    \ $des);\nprint(\"Copying the content from $src to $des\\n\");\nwhile(<FHR>) {\n\
    \    print FHW $_;\n}\n# Closing filehandles\nclose(FHR);\nclose(FHW);\nprint\
    \ \"File content copied successfully!\\n\";\n```\n\n**The program operates as\
    \ follows:**\n\n*   Step 1: Read the file `Source.txt` and write the file `Destination.txt`.\n\
    *   Step 2: Reading content from the `FHR`, which is a `FileHandle` for reading\
    \ content and a `FileHandle` for writing content to a file.\n*   Step 3: Using\
    \ the `print` function, copy the content.\n*   Step 4: Once file has been read,\
    \ close the `conn`.\n\n### Error Handling and Error Reporting\n\nErrors can be\
    \ handled in one of the two ways:\n\n*   If the file cannot open, throw an exception\
    \ (handling an error).\n*   If the file cannot open, issue a warning and continue\
    \ operating (error reporting).\n\n#### Throw an Exception (Using Die Function)\n\
    \nWhen `FileHandle` is not allocated a valid file pointer, a `die` is run, which\
    \ prints the message and terminates the current program.\n\nWhen a file exists\
    \ in the given code, it is performed with no issues, but if the file doesn’t exist,\
    \ an error is generated, and the code ends.\n\n#### Give a Warning (Using Warn\
    \ Function)\n\nWhen `FileHandle` cannot be assigned a proper file reference, it\
    \ produces a warning message and continues to operate.\n\n## APPENDING TO A FILE\n"
