    A Perl function or subroutine is a collection of statements that perform a specific
    task. Every programming language user wishes to reuse code. So the user puts the
    code section in a function or subroutine to avoid having to write the code repeatedly.
    We will go over the following ideas:


    - Hashes are passed to subroutines.

    - Lists are passed to subroutines.

    - Returning value from subroutine local and global variables.

    - Variable number of parameters in a subroutine call.


    ### Passing Hashes to Subroutines

    A hash can also be passed to subroutines, which convert it to its key-value pair.


    ### Passing Lists to Subroutines

    Because `@_` is a special array variable within a function or subroutine, it is
    used to pass lists to the subroutine. Perl accepts and parses arrays and lists
    differently, making it difficult to extract the discrete element from `@_`. To
    pass a list along with the other scalar arguments, the list must be passed as
    the last argument.


    ### Returning a Value from a Subroutine

    A subroutine, like any other programming language, can return a value. If the
    user does not manually return a value from the subroutine, the subroutine will
    return a value automatically. In this case, the automatically returned value will
    result from the last calculation performed in the subroutine. The result can be
    a scalar, an array, or a hash.


    ### Local and Global Variables in Subroutines

    By default, all variables within a Perl program are global variables. However,
    using `my` keyword, you can create local or private variables within a block.
    A private variable has a limited scope, such as between blocks (`if`, `while`,
    `for`, `foreach`, and so on) and methods. These variables cannot be used outside
    of a block or method.


    ### A Varying Number of Parameters in a Subroutine Call

    Perl does not include any built-in facilities for declaring the parameters of
    a subroutine, making it very simple to pass any number of parameters to a function.


    In general, passing more than one array or hash as a parameter to a subroutine
    causes it to lose its distinct identity. Likewise, returning more than one array
    or hash from a subroutine results in the loss of their distinct identities. We
    can solve these issues by making use of references.


    ## FUNCTION SIGNATURE IN PERL

    A Perl function or subroutine is a collection of statements that perform a specific
    task. Every programming language user wishes to reuse code. So the user places
    the code section in a function or subroutine to avoid having to write the code
    repeatedly. Although the terms function, subroutine, and method are interchangeable
    in Perl, they are not in other programming languages. Because it is created with
    the keyword `sub`, the terms subroutines are commonly used in Perl programming.
    When a function is called, Perl stops executing its entire program and jumps to
    the function to execute it before returning to the section of code that was previously
    running. The return statement can be avoided.


    ### Defining Subroutines

    In Perl, the general form of defining a subroutine is as follows: `sub subroutinename
    { # body of the method or subroutine }`


    ### Function Signature

    When a function is constructed, a set of parameters is also provided inside the
    parenthesis to specify the sort of arguments the function will receive on its
    call. This function signature may include one or several arguments.


    A subroutine or function with a defined signature can only accept arguments of
    the type specified in its signature. An error will occur if the inputs given to
    the procedure do not match its signature. A function signature reveals a great
    deal about the subroutine type. It allows the user to create subroutines with
    the same name but distinct signatures, i.e. different arguments. Different subroutines
    may have the same name in Perl, but their arguments must be distinct.


    In the above code, the names of the subroutines are identical, but their parameter
    counts are distinct; as a result, they are not deemed to be distinct subroutines,
    and our Perl code will not raise an error.


    ### Passing Parameters of a Type other than that Specified in the Signature

    When a subroutine is defined with a signature, it must take arguments of the same
    type as its signature. If an argument different than the function signature is
    given, an error will be generated, causing the code compilation to fail.


    If we pass an argument of a type other than the function signature, the following
    error will be generated:

    ```perl

    #!/usr/bin/perl

    # Defining the Function Signature

    sub example(Int $variable) { return $variable / 2; }

    # Function Call with the

    # string type parameter

    print example("66");

    ```


    ### Difference in Number of Arguments

    When a function signature is defined, it also includes the number and type of
    arguments that can be passed to it. If we call the function with a different number
    of arguments, Perl will throw an error because functions with different signatures
    have different meanings.


    Function signature is a useful feature, but it can be very annoying for some programmers
    because it restricts the use of the function to a specific type of parameter.
    There are no restrictions on the type of parameters that can pass to the function
    if it is defined without a signature.


    The above code declares a function with no specific argument type, so when an
    integer value is passed to it as a string, it automatically converts the argument
    to integer form and returns the result. However, if we call the function with
    a string argument and the operation to be performed on it requires an integer
    value, we will get the following error:

    ```perl

    #!/usr/bin/perl

    # Defining Function-Signature

    sub example($variable) { return $variable / 2; }

    # Function Call with the

    # string type argument

    print example("Peeks");

    ```


    ## PASSING COMPLEX PARAMETERS TO A SUBROUTINE

    A Perl function or subroutine is a collection of statements that perform a specific
    task. The user wants to reuse code in every programming language. So the user
    places the code section in a function or subroutine to avoid having to rewrite
    the same code repeatedly. As a result, function or subroutine is used in all programming
    languages. These functions or subroutines can accept various data structures as
    parameters. Some of these are discussed further below:


    - Passing lists or arrays to a subroutine

    - Passing references to a subroutine

    - Passing file handles to a subroutine

    - Passing hashes to a subroutine


    Passing arrays or lists to a subroutine: An array or list can be passed as a parameter
    to the subroutine, and an array variable `@_` is used to accept the list value
    inside the subroutine or function.


    **First example**: A single list is passed to the subroutine, and its elements
    are displayed.


    **Second example**: In this case, two lists are passed to the subroutine, and
    their contents are displayed.


    **Third example**: A scalar argument and a list are passed to the subroutine,
    and the list elements are displayed.


    Passing references to subroutines: References can also be passed as parameters
    to subroutines. The array reference is passed to the subroutine, and the maximum
    value of the array elements is returned.


    Passing a hash to a subroutine: A hash can also be passed as a parameter to a
    subroutine, which displays its key-value pair.


    Passing file handles to a subroutine: To create a file or access its contents,
    a `FileHandle` is required. A `FileHandle` is nothing more than a structure used
    with the operators to access the file in a specific mode, such as reading, writing,
    appending, and so on. FileHandles can also be passed as a parameter to a subroutine
    to perform various operations on Files.


    A FileHandle is passed to a subroutine in the following example:


    ## MUTABLE AND IMMUTABLE PARAMETERS

