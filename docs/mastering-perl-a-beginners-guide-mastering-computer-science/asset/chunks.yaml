    \ and when matched with the input text “Peks,” it returns “Match is Not Found.”\n\
    \n**Sixth example:** In this example, the {n, m} quantifier is employed in a regular\
    \ expression /Pe{1, 2}ks/, which yields “Peks” and “Peeks,” and is matched with\
    \ an input text “Peeks,” yielding “Match is Not Found.”\n\n## BACKTRACKING IN\
    \ REGULAR EXPRESSION"
