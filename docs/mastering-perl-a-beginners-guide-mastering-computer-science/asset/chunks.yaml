  trans: "\n\n这被称为读写模式。此函数可以用于替换文件中的现有字符串。它无法创建新文件。\n\n```perl\n#!/usr/bin/perl\n\
    # 以读写模式打开 Hello1.txt\nopen(rw, \"+<\", \"Hello1.txt\");\n# 打印文件的原始内容。\n# rw 被设置为末尾。\n\
    print(\"Existing Content of the Hello1.txt: \".<rw>);\n# 字符串附加在文件原始内容的末尾。\nprint\
    \ rw \"Added using the Read -Write Mode.\";\n# 将 rw 设置为文件的开头以便读取。\nseek rw, 0,\
    \ 0;\n# 打印文件的更新内容\nprint(\"\\nUpdated contents of Hello1.txt: \".<rw>);\n# 关闭文件句柄\n\
    close(rw);\n```\n\n## 5. Mode = “+>”\n\n这被称为读写模式。`+` 和 `+>` 的区别在于，`+>` 即使在同名文件存在的情况下也可以创建一个新文件，而\
    \ `+` 则不能。\n\n```perl\n#!/usr/bin/perl\n# 以读模式打开文件 Hello1.txt\nopen(r, \"<\",\
    \ \"Hello1.txt\");\n# 打印文件的现有内容\nprint(\"Existing Content of Hello1.txt: \". <r>);\n\
    # 关闭文件\nclose(r);\n# 以读写模式打开 Hello1.txt\nopen(rw, \"+>\", \"Hello1.txt\");\n#\
    \ 当文件打开时，文件的原始内容会被清除\nprint(\"\\nContents of Hello1.txt gets cleared…\");\n# 将字符串写入文件\n\
    print rw \"Hello!!! This is the updated file.\";\n# 将 rw 设置为文件的开头以便读取。\nseek rw,\
    \ 0, 0;\nprint(\"\\nUpdated Content of Hello1.txt: \" .<rw>);\n# 关闭文件\nclose(rw);\n\
    ```\n\n## 6. Mode = “+>>”\n\n这被称为读追加模式。它可以用于从文件读取并向文件追加内容。如果不存在此类文件，将生成一个同名的新文件。\n\
    \n```perl\n# 以读追加模式打开 Hello1.txt\nopen(ra, \"+>>\", \"Hello1.txt\");\n# 将 ra 设置为文件的开头以便读取。\n\
    seek ra, 0, 0;\n# 当文件打开时，文件的原始内容不会被清除\nprint(\"Existing Content of File: \". <ra>);\n\
    print \"\\nAppending to File....\";\n# 将字符串追加到文件\nprint ra \"Added using Read-Append\
    \ Mode\";\n# 将 ra 设置为文件的开头以便读取。\nseek ra, 0, 0;\n# 打印更新内容\nprint(\"\\nUpdated\
    \ content of File: \". <ra>);\n# 关闭文件\nclose(rw);\n```\n\n## 重定向输出\n\n使用 `choose`\
    \ 函数，可以将输出从控制台重定向到文件。\n\n## 文件打开与读取\n\n`FileHandle`（文件句柄）是 Perl 的内部结构，用于将物理文件连接到名称。所有的\
    \ `FileHandles` 都具有读/写权限；因此，一旦连接到文件，就可以读取/写入。然而，在关联 `FileHandle` 时，打开文件句柄的模式必须是正确的。\n\
    \n### 打开文件\n\n`open` 函数用于打开新文件或现有文件。\n\n在这种情况下，`FileHandle` 是 `open` 函数返回的句柄，`VAR`\
    \ 是包含文件名和打开模式的表达式。\n\n下表显示了各种文件打开模式以及对各种操作的访问权限。\n\n| 模式 | 描述 |\n| --- | --- |\n\
    | r 或 < | 只读访问 |\n| w 或 > | 创建、写入并截断 |\n| a 或 >> | 写入、追加并创建 |\n| r+ 或 +< | 读取和写入\
    \ |\n| w+ 或 +> | 读取、写入、创建并截断 |\n| a+ 或 +>> | 读取、写入、追加并创建 |\n\n### 读取文件\n\n当 `FileHandle`\
