    # CHAPTER 3Input and Output in Perl


    DOI: [10.1201/9781003358442-3](https://doi.org/10.1201/9781003358442-3)


    ## IN THIS CHAPTER


    *   Use of print() and say()


    *   print Operator


    *   Use of STDIN for Input


    In the previous chapter, we covered the Fundamental of Perl, and in this chapter,
    we will cover input and output with its relevant examples.


    ## PERL print() AND say() METHODS


    Perl evaluates input provided by the user or presented as Hardcoded input in the
    code using statements and expressions. Because it has been evaluated in the compiler,
    this evaluated expression will not display to the programmer. Perl employs the
    print() and say() functions to display the evaluated expression. These routines
    can show whatever parameters are supplied to them.


    ### print() Operator


    The print() operator in Perl is used to print the values of expressions in a List
    supplied to it as an input. The print operator returns anything passed to it as
    an argument, whether it’s a string, a number, a variable, or anything else. This
    operator’s delimiter in double quotes (“”).


    The above example uses the print function to print both strings, but they are
    written on the same line. To avoid this and print them on distinct lines, we must
    use the “\n” operator, which changes the line whenever it is used.


    If we use single quotes instead of the double quotes, the print() method will
    not output the values of the variables or the escape characters used in the statement,
    such as “\n”. These characters will be printed in their entirety and will not
    be evaluated.


    ### say() Function


    The say() method in Perl functions similarly to the print() function, with one
    minor difference: the say() function automatically inserts a newline at the end
    of the statement, removing the need to use the newline character “n” to change
    the line.


    We used “use 5.010” to utilize the say() function since newer versions of Perl
    don’t support some of the earlier versions’ features; thus, the older version
    is used to run the say() method.


    ## print OPERATOR


    In Perl, the print operator is used to print the values of expressions in a List
    that is passed to it as an argument. The print operator returns anything passed
    to it as an argument, whether it’s a string, a number, a variable, or anything
    else. This operator is delimiter by double quotes (“”).


    ## USE OF STDIN FOR INPUT


    Perl allows the programmer to receive user input and conduct actions on it. This
    allows the user to enter input other than the one provided by the programmer as
    Hardcoded input. The print() method can then be used to parse and print this input.


    <STDIN> can provide keyboard input to a Perl application. STDIN is an abbreviation
    for Standard Input. There is no need to include STDIN between the “diamond” and
    “spaceship” operators, i.e. <>. This is standard procedure. The < > operator can
    also be used to write to files. <STDIN> can be used in both Scalar and List contexts.


    After entering Input, the above code requires us to press ENTER. This ENTER instructs
    the compiler to run the following line of code. However, <STDIN> treats the ENTER
    key as part of the input and prints the line when we hit it. Following the Input
    string, a new line will be written automatically. To avoid this, the chomp() method
    is used. This method will delete the newline character placed at the end of the
    user-supplied Input.


    In this chapter, we covered the use of print() and say(), print operator, and
    STDIN for Input.


    # CHAPTER 4Control Flow in Perl


    DOI: [10.1201/9781003358442-4](https://doi.org/10.1201/9781003358442-4)


    ## IN THIS CHAPTER


    *   Decision-Making


    *   Loops


    *   when Statement


    *   goto Operator


    *   next Operator


    *   redo Operator


    In the previous chapter, we discussed input and output in Perl, and in this chapter,
    we will cover control flow statements.


    ## DECISION-MAKING IN PERL


    Making decisions in programming is analogous to making decisions in real life.
    When a given condition is met in programming, a particular code block must be
    performed. Control statements are used in a programming language to control program
    execution flow based on particular criteria. These affect the execution flow to
    progress and branch based on changes in a program’s state.


    **Perl decision-making statements:**


    *   if


    *   if else


    *   nested if


    *   if elsif ladder


    *   unless


    *   unless else


    *   unless elsif


    ### if Statement


    The if statement is similar to those seen in other programming languages. It is
    used to carry out simple condition-based tasks. It is used to determine whether
    a specific statement or block of statements will be executed; for example, if
    a given condition is true, then a block of statements is executed; otherwise,
    it is not.


    There will be a build time error if curly brackets {} are not utilized with if
    statements. As a result, brackets {} must be used with the if statement.


    **Flowchart:**


    ![](images/ufig4_1.jpg)


    Statement of if.


    ### if else Statement


    If the condition is true, the if statement evaluates the code; if the condition
    is false, the else statement is used. It instructs the code on what to do if the
    condition is false.


    **Flowchart:**


    ![](images/ufig4_2.jpg)


    Statement of if else.


    ### Nested if Statement


    Nested if is an if statement inside an if statement. In this situation, the if
    statement is the target of another if or else statement. Nested if can be used
    when more than one condition must be true and one of the conditions is a sub-condition
    of the parent condition.


    **Flowchart:**


    ![](images/ufig4_3.jpg)


    Statement of nested if.


