- fmt: "\nA Perl function or subroutine is a collection of statements that perform\
    \ a specific task. The user wants to reuse code in every programming language.\
    \ So the user places the code section in a function or subroutine to avoid having\
    \ to write the code repeatedly. These subroutines have parameters that define\
    \ the type and number of arguments that can be passed to the function when it\
    \ is called. These arguments are used to evaluate the values passed to the function\
    \ using the function’s expressions. These values are then passed to the calling\
    \ function and returned to the specified parameters.\n\n### Mutable Parameters\n\
    \nThese are parameters, the values of which are changed inside the function to\
    \ which they have been passed.\n\nIt indicates that when a parameter is supplied\
    \ to a function through the caller function, its value is tied to the parameter\
    \ in the called function, thus any changes made to the value in the called function\
    \ will also be reflected in the parameter passed by the caller function.\n\n###\
    \ Immutable Parameters\n\nThese arguments are of those kinds, the values of which\
    \ cannot be altered inside the function to which they are supplied. It indicates\
    \ that the subroutine gets a value rather than a variable when a parameter is\
    \ supplied to the function through the caller function. Consequently, any modifications\
    \ to the function parameter are not reflected.\n\nPerl’s subroutine parameters\
    \ are immutable by default, meaning they cannot modify inside a function, and\
    \ one cannot inadvertently alter the arguments of the calling function. In specific\
    \ programming languages, this is referred to as “call by value,” which indicates\
    \ that the subroutine being called gets a value rather than the variable, so the\
    \ parameters of the calling function are not altered.\n\nTraits are used to change\
    \ the properties of these parameters. The value of a parameter can be changed\
    \ within a subroutine using traits.\n\n### Traits\n\nThese are predefined built-in\
    \ subroutines that alter the method’s behavior when run at compile time when used\
    \ within a method. Traits can even be used to modify the method’s body or tag\
    \ the method with metadata.\n\nDepending on their usage, traits can be of various\
    \ types, such as:\n\n* `is cached` trait automatically caches the function’s return\
    \ value based on the arguments passed to it.\n* `is rw` trait enables writable\
    \ accessors to subroutine parameters.\n* `is copy` trait allows us to change the\
    \ value of a parameter within a subroutine but not the argument in the caller\
    \ function.\n\n**Example:** Use of the `is copy` trait\n```perl\n#!/usr/bin/perl\n\
    # Function Definition using the # ’is copy’ trait\nsub Func(Int $variable is copy)\
    \ {\n    # Operation to be performed\n    $variable += 5;\n}\n# Defining the local\
    \ variable\nmy $value = 20;\n# Function Call with the local variable\nprint Func($value),\
    \ \"\\n\";\n# Checking if # the $value gets updated or not\nprint $value;\n```\n\
    \nBecause Perl does not allow the modification of arguments within a subroutine\
    \ by default, the `copy` trait is used in the above code. This trait enables the\
    \ program to assign the caller function’s parameter value to the subroutine being\
    \ called a parameter. This trait, however, will only affect the value of the argument\
    \ in the called function.\n\n**Example:** Use of the `is rw` trait\n```perl\n\
    #!/usr/bin/perl\n# Function Definition using the # ’is rw’ trait\nsub Func(Int\
    \ $variable is rw) {\n    # Operation to perform\n    $variable += 5;\n}\n# Defining\
    \ local variable\nmy $value = 20;\n# Function Call with the local variable\nprint\
    \ Func($value), \"\\n\";\n# Checking if # the $value gets updated or not\nprint\
    \ $value;\n```\n\nWhen `is rw` is used instead of `is copy` trait in the preceding\
    \ code, the value of argument passed in the caller function is also updated.\n\
    \nWhen the `is rw` trait is used, the argument of the called function is bound\
    \ with the argument of the caller function, so if the former value changes, the\
    \ latter is immediately updated. This is because a process known as “call by reference.”\
    \ Because both arguments refer to the same memory location (because of the `is\
    \ rw` trait); as a result, the parameters are fully mutable.\n\n## MULTIPLE SUBROUTINES\n\
    \nA Perl function or subroutine is a collection of statements that perform a specific\
    \ task. Every programming language user wishes to reuse code. So the user places\
    \ the code section in a function or subroutine to avoid having to write the code\
    \ repeatedly.\n\nAlthough the terms function, subroutine, and method are interchangeable\
    \ in Perl, they are not in other programming languages. Because it is created\
    \ with the keyword `sub`, the terms subroutines are commonly used in Perl programming.\
    \ When a function is called, Perl stops executing its entire program and jumps\
    \ to the function to execute it before returning to the section of code that was\
    \ previously running. The return statement can be avoided.\n\n### Subroutine Definition\n\
    \nIn Perl, the general form of defining a subroutine is as follows: `sub subroutine_name\
    \ { # body of the method or subroutine }`\n\nBecause Perl allows you to write\
    \ multiple subroutines with the same name unless they have different signatures,\
    \ a program in Perl can contain multiple subroutines with the same name without\
    \ generating an error. This can be defined by varying the arity of each subroutine\
    \ with the same name.\n\nSubroutine arity: Perl subroutines can have the same\
    \ name as long as they have a different set of arity. The number of arguments\
    \ a subroutine has is referred to as its arity. These arguments could be of a\
    \ different data type or not. The Perl program will not generate an error as long\
    \ as the number of subroutines differs.\n\n### Use of the “multi” Keyword\n\n\
    The keyword `multi` can use to create multiple subroutines in Perl. This is useful\
    \ for creating multiple subroutines with the same name.\n\nMultiple subroutines\
    \ are commonly used to create built-in functions and most operators in a programming\
    \ language such as Perl. The program’s complexity is reduced by not using different\
    \ names for each other subroutine. Whatever code statement is required, simply\
    \ pass the number of arguments for that function, and the work will be completed.\
    \ In this case, compiler will select the version of the subroutine, the function\
    \ signature of which matches the one invoked.\n\nVarious programs, such as factorial\
    \ of a number, Fibonacci series, and so on, require the use of more than one function\
    \ to solve the problem. The use of multiple subroutines will aid in the reduction\
    \ of the complexity of such programs.\n\n**First example**: Fibonacci series sum\n\
    ```perl\n#!/usr/bin/perl\n# Program to print sum of the fibonacci series\n# Function\
    \ for the $n = 0 multi Fibonacci_func(0) {\n    1; # returning 1\n}\n# Function\
    \ for the $n = 1 multi Fibonacci_func(1) {\n    1; # returning 1\n}\n# Recursive\
    \ function to calculate the Sum multi Fibonacci_func(Int $n where $n > 1) {\n\
    \    Fibonacci_func($n - 2) + Fibonacci_func($n - 1);\n}\n# Printing sum # using\
    \ the Function Call\nprint Fibonacci_func(27);\n```\n\nTo calculate the sum of\
    \ Fibonacci series, the preceding example employs multiple subroutines.\n\n**Second\
    \ example:** A number factorial\n```perl\n#!/usr/bin/perl\n# Program to print\
    \ factorial of number\n# Factorial of 0 multi Factorial(0) {\n    1; # returning\
    \ 1\n}\n# Recursive Function\n# to calculate the Factorial multi Factorial(Int\
    \ $n where $n > 0) {\n    $n * Factorial($n - 1); # Recursive-Call\n}\n# Printing\
    \ result # using the Function Call\nprint Factorial(25);\n```\n\nIn the preceding\
    \ examples, the program declares multiple subroutines with the same name but different\
    \ arity using the `multi` keyword.\n"
