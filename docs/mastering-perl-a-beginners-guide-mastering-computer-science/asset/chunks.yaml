- fmt: '

    Perl is a dynamic, high-level, interpreted, general-purpose programming language.
    Perl was first designed for text processing, such as extracting the necessary
    information from a particular text file and converting text file to a new format.
    Perl supports both procedural and object-oriented programming.


    Perl is similar to C, making it accessible to C and C C++ programmers. Perl follows
    a basic syntax for developing programs for applications and software and writing
    simple Perl programs, similar to those of other programming languages.


    This grammar features several predefined phrases such as keywords, variables for
    storing values, expressions, statements for performing logic, loops for iterating
    through a variable value, blocks for combining statements, and subroutines for
    simplifying code.


    All of these elements, when combined, constitute a Perl program. The variables,
    statements, and other factors that make up a program’s syntax are used by every
    Perl program, whether it’s a simple code for adding two numbers or a complex one
    for launching web scripts.


    ## Variables


    Variables are user-defined words used to store the program’s values and utilized
    to evaluate the code. Every Perl program comprises values on which the code operates.
    These values cannot be edited or saved unless a variable is used. A value can
    only process if it is saved in a variable and the variable’s name is used.


    A value is data that is passed to the program to conduct a modification action.
    This data can be numbers, strings, characters, lists, etc.


    ## Expressions


    Variables and an operator symbol make up Perl expressions. These expressions define
    the operation performed on the data given by the relevant code. In Perl, an expression
    is something that, when evaluated, returns a value. An expression can also be
    a value without any variables or operator symbols. It can be either an integer
    or a string with no variables.


    A more complex expression is one that uses Regex to perform operations on strings
    and substrings.


    ## Comments


    Perl developers frequently utilize the comment system since things may quickly
    become complicated without it. Comments are essential information provided by
    developers to help the reader comprehend the source code. It describes the reasoning
    or a portion of it that is employed in the code. When we are no longer available
    to address queries about our code, comments are frequently helpful to someone
    who is maintaining or improving it. These are frequently noted as a good programming
    practice that does not affect program output but increases overall readability.


    ### In Perl, there are two kinds of comments:


    1. **Single-line comments:** A single-line comment in Perl begins with the hashtag
    symbol (`#`) and continues until the end of the line. If the comment is more than
    one line, add a hashtag to the following line and continue the comment. Single-line
    comments in Perl have proven helpful in providing brief explanations for variables,
    function declarations, and expressions. The following code for an example of a
    one-line comment:

    ```

    #!/usr/bin/perl $d = 10; # Assigning value to $d $e = 30; # Assigning value to
    $e $c = $d + $e; # Performing operation print "$c"; # Printing result

    ```


    2. **A multi-line string as a comment:** A multi-line comment in Perl is a chunk
    of text enclosed by `=="` and `=cut.`. They are useful when the remark content
    does not fit on a single line and must spread across lines. Multi-line comments
    or paragraphs provide documentation for people who are reading your code. Perl
    considers everything typed after the `=="` sign to be a comment until a `= cut`
    follows it. Please remember that there should be no whitespace following the `=`
    symbol. See the following code snippet for an example of a multi-line comment:

    ```

    #!/usr/bin/perl =Assigning values to The variable $d and $e =cut $d = 10; $e =
    30; =Performing operation and printing result =cut $c = $d + $e; print "$c";

    ```


    ## Statements


    A statement in Perl contains instructions for the compiler to conduct operations.
    These statements conduct the operations on the variables and values at the run-time.
    Every sentence in Perl must conclude with a semicolon (`;`). Basically, instructions
    put in the source code for execution are termed statements. There are several
    sorts of statements in the Perl programming language, such as assignment statements,
    conditional statements, and looping statements. These all allow the user to acquire
    the appropriate output. For example, `n = 60` is an assignment statement.


    Multi-line statements: Statements in Perl may be expanded to one or more lines
    by simply separating them into pieces. Unlike other languages like Python, Perl
    looks for a semicolon to terminate the sentence. Every line between two semicolons
    is treated as a single sentence.


    When the programmer wants to execute extensive computations and cannot fit his
    statements onto one line, one may simply split it into numerous lines.


    ## Block


    A block is a collection of statements that execute a related operation. Multiple
    statements in Perl can be performed concurrently (under a single condition or
    loop) by using curly braces (`{}`). This creates a block of statements that are
    all performed simultaneously. This block can use to optimize the program by grouping
    statements together.


    Variables declared within a block have a scope confined to that block and are
    useless outside of it. They will only be executed when that specific block is
    being run.


    The variable `$d` in the preceding code has a scope confined to this specific
    block and is useless outside of it. The block above contains statements with operations
    that are related to one another.


    ## Functions or Subroutines


    A function/subroutine is a code block written in a program to execute a specified
    task. To better understand how functions work, we may compare functions in programs
    to people in a real-world workplace. Assume the manager assigns his staff the
    task of calculating the annual budget. So, how will this procedure be completed?
    The employee will obtain statics information from the employer, run calculations,
    compute the budget, and provide the results to his supervisor. Functions operate
    similarly. They accept information as an argument, run a set of statements, conduct
    operations on these parameters, and then return the output.


    ### Perl offers two primary types of functions:


    * **Built-in functions:** Perl has a large number of built-in library functions.
    These functions have already been coded and saved as functions. To use them, we
    just need to call them when needed, such as `sin()`, `cos()`, `chr()`, `return()`,
    and `shift()`.


    * **User-defined functions:** Perl allows us to write our own customized functions,
    known as user-defined functions or subroutines, in addition to the built-in functions.


    Using this, we may develop our code packages and call them whenever we need them.


    ## Loops


    Like any other language, Perl uses loops to execute a statement or a group of
    instructions repeatedly until and unless a specific condition is fulfilled. This
    allows the user to save time and effort by not writing the same code multiple
    times.


    Perl offers several looping techniques:


    * `for` loop

    * `for each` loop

    * `until` loop

    * `while` loop

    * `do…while` loop

    * `nested loops`


    ## Whitespaces and Indentation


    In Perl, whitespaces are blank spaces used between variables and operators, between
    keywords, and so on. Whitespaces have no effect in Perl unless quote marks surround
    them. Whitespaces such as spaces, tabs, and newlines have the same meaning in
    Perl when used outside quotes.


    In the preceding instances, whitespaces have no impact unless placed within quotations.


    Similarly, indentation is used to structure the code to make it easier for users
    to read. When a block of statements is utilized, indentation helps to reduce the
    code’s readability difficulty.

