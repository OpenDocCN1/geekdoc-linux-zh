    \n**安装：** 打开终端并输入以下命令安装 DBI 模块：`perl -MCPAN -e 'install Bundle::DBI'`\n\n这将自动下载并安装\
    \ `DBI` 模块驱动，允许 Perl 连接到数据库。\n\n### 数据库无关接口\n\n`DBI` 如其名，为 Perl 程序提供了一个独立的接口。这意味着\
    \ Perl 代码不依赖于后端运行的数据库。`DBI` 模块提供了抽象，允许我们编写代码而不必担心后端运行的数据库。\n\n要导入数据库无关接口模块的函数，请使用\
    \ `use` 属性来导入或包含该模块。使用 `DBI` 属性使我们能够使用 `DBI` 模块操作我们连接的数据库。\n\n### 访问数据库\n\n要连接到指定的数据库，请使用\
    \ `connect()` 方法。它需要三个参数：\n\n*   一个用 `\":\"` 分隔的三值字符串。在这种情况下，它是 `\"DBI:mysql:test\"\
    `。第一个值表示我们正在使用 `DBI`。第二个值指定数据库引擎，在此情况下是 MySQL。第三个值是我们要连接的数据库名称。\n\n*   用户名是 `connect()`\
    \ 方法的下一个参数。在这种情况下，用户是 `\"root.\"`。\n\n*   最后一个参数是我们本地系统的密码。在这种情况下，密码是 `\"password\"\
    `。\n\n如果无法连接到数据库，`\"or die\"` 语句将带有错误信息终止程序。`errstr()` 方法返回一个包含在数据库连接期间遇到的任何错误的字符串。\n\
    \n### 准备执行的查询\n\n要执行的 SQL 查询作为单个参数传递给 `prepare()` 方法。SQL 查询被表示为包含 SQL 语句的字符串。此\
    \ SQL 语句与我们在 MySQL 中使用的 SQL 语句相同。它返回一个语句句柄（statement handle），可用于执行查询。\n\n查询现在已准备好执行。在前面的查询中，我们正在创建一个包含\
    \ id、name、salary 列的表。\n\n### 执行查询\n\n在 `prepare()` 中编写的查询由 `execute()` 方法执行。这无可争疑。当执行\
    \ `prepare` 语句时创建的语句句柄对象用于调用它。\n\n### 从结果中获取值\n\n`fetchrow()` 方法从结果中检索下一行。当运行选择查询时，`fetchrow()`\
    \ 方法提取一行并将其赋值给变量。在 `while` 循环中使用 `fetchrow()`，我们可以获取并显示数据库中的所有行。\n\n这三个变量持有每列的值。\n\
    \n`fetchrow_array()` 函数返回一个包含结果行的数组。\n\n### 断开连接\n\n在所有查询完成后，我们必须断开连接。这是通过使用 `disconnect()`\
