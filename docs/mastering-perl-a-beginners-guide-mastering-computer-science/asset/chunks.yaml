    trait); as a result, the parameters are fully mutable.


    ## MULTIPLE SUBROUTINES


    A Perl function or subroutine is a collection of statements that perform a specific
    task. Every programming language user wishes to reuse code. So the user places
    the code section in a function or subroutine to avoid having to write the code
    repeatedly.


    Although the terms function, subroutine, and method are interchangeable in Perl,
    they are not in other programming languages. Because it is created with the keyword
    sub, the terms subroutines are commonly used in Perl programming. When a function
    is called, Perl stops executing its entire program and jumps to the function to
    execute it before returning to the section of code that was previously running.
    The return statement can be avoided.


    ### Subroutine Definition


    In Perl, the general form of defining a subroutine is as follows: sub subroutine_name
    { # body of the method or subroutine }


    Because Perl allows you to write multiple subroutines with the same name unless
    they have different signatures, a program in Perl can contain multiple subroutines
    with the same name without generating an error. This can be defined by varying
    the arity of each subroutine with the same name.


    Subroutine arity: Perl subroutines can have the same name as long as they have
    a different set of arity. The number of arguments a subroutine has is referred
    to as its arity. These arguments could be of a different data type or not. The
    Perl program will not generate an error as long as the number of subroutines differs.


    ### Use of the “multi” Keyword


    The keyword “multi” can use to create multiple subroutines in Perl. This is useful
    for creating multiple subroutines with the same name.


    Multiple subroutines are commonly used to create built-in functions and most operators
    in a programming language such as Perl. The program’s complexity is reduced by
    not using different names for each other subroutine. Whatever code statement is
    required, simply pass the number of arguments for that function, and the work
    will be completed. In this case, compiler will select the version of the subroutine,
    the function signature of which matches the one invoked.


    Various programs, such as factorial of a number, Fibonacci series, and so on,
    require the use of more than one function to solve the problem. The use of multiple
    subroutines will aid in the reduction of the complexity of such programs.


    **First example**: Fibonacci series sum #!/usr/bin/perl # Program to print sum
    of the fibonacci series   # Function for the $n = 0 multi Fibonacci_func(0) {
    1; # returning 1 } # Function for the $n = 1 multi Fibonacci_func(1) { 1; # returning
    1 } # Recursive function to calculate the Sum multi Fibonacci_func(Int $n where
    $n > 1) { Fibonacci_func($n - 2) + Fibonacci_func($n - 1); } # Printing sum #
    using the Function Call print Fibonacci_func(27);


    To calculate the sum of Fibonacci series, the preceding example employs multiple
    subroutines.


    **Second example:** A number factorial #!/usr/bin/perl # Program to print factorial
    of number # Factorial of 0 multi Factorial(0) { 1; # returning 1 } # Recursive
    Function # to calculate the Factorial multi Factorial(Int $n where $n > 0) { $n
    * Factorial($n - 1); # Recursive-Call } # Printing result # using the Function
    Call print Factorial(25);


    In the preceding examples, the program declares multiple subroutines with the
    same name but different arity using the “multi” keyword.


    ## return() FUNCTION


    In Perl, the return() function returns value at the end of a subroutine, block,
    or do function. The returned value could be a scalar, an array, or a hash depending
    on the context.


    If no argument is passed to the return function, it returns an empty list in the
    list context, undef in the scalar context, and nothing in the void context.


    ## REFERENCES IN PERL'
