    \n*   Encapsulation\n\nIn the previous chapter, we discussed regular expressions,\
    \ and in this chapter, we will cover object-oriented programming.\n\nObject-oriented\
    \ programming (OOPs): As the name implies, OOPs refers to programming languages\
