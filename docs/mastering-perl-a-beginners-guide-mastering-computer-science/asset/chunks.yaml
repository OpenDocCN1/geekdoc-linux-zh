    it more reader-friendly for scripts with a significant number of statements.


    Though using whitespaces and indentation in your Perl code is not required, it
    is a recommended practice.


    ## Keywords


    Keywords, often known as reserved words, are terms in a language used for internal
    processes or to indicate predefined actions. They have a unique significance for
    the compiler. As a result, these terms are not permitted to be used as variable
    names or objects. This will produce a compile-time error. Along with control words,
    keywords in Perl contain built-in functions.


    These keywords can occasionally be used as variable names, although this causes
    confusion and makes debugging such a program difficult.


    ## DATA TYPES


    Data types define the sorts of data that can store in a valid Perl variable. Perl
    is a loosely typed programming language. There is no need to provide a data type
    while using the Perl program. The Perl interpreter will choose the type based
    on the context of the data.


    Perl has three data types, which are as follows:


    - Scalars

    - Arrays

    - Hashes


    ### Scalars


    A single data unit can be an integer, a floating-point value, a character, a string,
    a paragraph, or an entire web page.


    ### Arrays


    Array is a variable that stores values of the same data type as a list. In Perl,
    we use the `@` symbol before the variable name to declare an array.


    It will generate an array of integers with the values 20, 30, and 40. The `$`
    symbol is used to access a single member in an array.


    ### Hashes


    It is a collection of key-value pairs. It is also known as associative arrays.
    We use the `%` symbol in Perl to declare a hash. We utilize the `$` symbol followed
    by the key in brackets to get to a specific value.


