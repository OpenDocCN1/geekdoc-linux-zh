    ## PERL CODE WRITING METHODS


    Perl is a dynamic, high-level, interpreted, general-purpose programming language.
    Perl supports both procedural and object-oriented programming. Perl was initially
    designed only for system administration and text processing, but subsequent versions
    included the ability to manage regular expressions, network sockets, etc.


    Perl is syntactically similar to other commonly known programming languages, making
    it easy to write and understand. Perl is a free-form programming language, meaning
    it may be written, formatted, and indented according to the user’s needs.


    A Perl program consists of a series of statements, loops, subroutines, etc., which
    facilitates navigation around the code. Every Perl statement must conclude with
    a semicolon (`;`). Perl, like other languages, provides several writing and execution
    modes for Perl code. These modes may be classified according to their compatibility
    with writing and mode of execution in the following ways:


    - Interactive mode

    - Script mode

    - One-liner mode


    These modes can be used on the command line with the Perl keyword or in online
    Integrated Development Environment (IDEs) as a block of code. Along with the installation
    package, Perl has its own inbuilt IDE.


    ### Interactive Mode


    Interaction with the interpreter is signified by the interactive method of creating
    Perl code. Interactive mode is a wonderful approach to begin programming since
    it allows you to examine the flow of code line by line and simplifies the debugging
    process. With Perl debugger, interactive mode in Perl can be utilized on the command
    line.


    This interpreter is often called REPL – Read, Evaluate, Print, Loop. Interactive
    mode enables the immediate creation and execution of code without creating a temporary
    file to save the source code. Using Perl debugger, the built-in Perl command line
    or the Windows command prompt may be used as a REPL. This debugger can be used
    with a Perl application with the following command: ````

    perl -de1

    ```


    The user must write the code line by line in the interactive mode of writing Perl
    code, which is run simultaneously.


    Perl’s interactive mode may be run directly from the command line, without the
    need for a debugger. This can be done by using the following command: ````

    perl -e Code_statement;

    ```


    This statement utilizes the `-e` parameter to avoid script creation and allows
    the code to run without the debugger on the command line.


    This way of writing in interactive mode does not allow the user to create multi-line
    code as it does in the debugger. This mode is not recommended for long programs.


    Interactive mode is useful for teaching new programmers the fundamentals of programming,
    but it may become cumbersome and tedious when dealing with more than a few lines
    of code.


    ### Script Mode


    Script mode in Perl is used to develop Perl programs that include more than a
    few lines of code and are too complicated for interactive mode.


    Using a text editor, script mode in Perl can be used to develop a Perl program;
    it is saved in a file called a script, and then the script file is run using the
    command line. This file must be saved with the `.pl` extension and stored in the
    same directory as the directory path specified on the command line. This script
    is then executed from the command line using the following command: ````

    perl FileName.pl

    ```


    Code is typed in a text editor (notepad, for example) and saved as a Perl program.pl
    script.


    Unlike the interactive mode, script mode in Perl cannot provide output for each
    individual expression.


    In the interactive mode, the expression is evaluated, and the result is presented
    automatically, while in the script mode, the expression is evaluated, but the
    result is not displayed until prompted.


    Online IDEs also provide script mode, which is used to develop and run Perl code
    without manually putting it in a file. In these IDEs, compiled code is saved in
    memory as a temporary file that is only useful when the code is run, and the browser
    containing the IDE is open. Once the page is refreshed, this temporary file is
    destroyed, and memory space is released. Online IDEs have simplified the execution
    of codes since they need less effort than the script mode, in which files must
    be saved in the machine’s memory.


    This quickens the compilation and execution of code. These online IDEs, although
    convenient for programmers, have significant restrictions, such as the inability
    to conduct file handling operations unless the file is uploaded to their server,
    which poses a risk to sensitive data. Compilers that operate through the command
    line allow for such file manipulation capabilities.


    Here is an example of a Perl program that adds two integers using an online IDE:

    ```perl

    #!/usr/bin/perl

    # add two numbers program

    # Assigning values to the variables

    $var1 = 20;

    $var2 = 35;

    # Evaluating result

    $result = $var1 + $var2;

    # Printing result

    print "Result after the addition is: $result";

    ```


    ### One-Liner Mode


    Perl also has a one-liner mode, allowing us to type and run a minimal code script
    right from the command line. This is done to prevent creating files to store scripts
    for codes that are not too long. With the use of the following command, these
    codes can be written on a single line in command line mode: ````

    perl -e

    ```


    This command is used to write and execute one-liner code at the command line by
    enclosing it in double quotation marks. The `-e` flag in the preceding command
    informs the compiler that the code’s script is not kept in any sort of file but
    is written in the double codes immediately after this flag.

    '
