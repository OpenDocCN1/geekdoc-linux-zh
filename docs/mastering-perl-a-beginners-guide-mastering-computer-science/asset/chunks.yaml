    \ `<<` 二进制左移运算符接受两个整数，将第一个操作数的位左移，第二个操作数决定移动的位数。左操作数被乘以右操作数提供的次数。例如：$x = 70; $z\
    \ = $x << 2; print $z; 输出: 280 解释：$70 * 2 = 140$ ---(1) $140 * 2 = 280$ ---(2)\n\
    \n* `>>` 二进制右移运算符接受两个数字，将第一个操作数的位右移，第二个操作数决定移动的位数。它将左操作数除以右操作数提供的次数。如例如：$x = 80;\
    \ $z = $x >> 2; print $z; 输出: 15 解释：$80 / 2 = 40$ ---(1) $40 / 2 = 20$ ---(2)\n\
    \n程序：展示位运算符符如何工作：\n```perl\n# Perl Program to illustrate Bitwise operators\n#!/usr/local/bin/perl\n\
