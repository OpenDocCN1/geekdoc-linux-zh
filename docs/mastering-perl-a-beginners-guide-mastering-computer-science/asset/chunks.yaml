- fmt: "\nThe module’s Perl file is as follows:\n\n```perl\n#!/usr/bin/perl\n# Using\
    \ the Message.pm package\nuse Message;\n# Defining the value to variable\n$Message::username\
    \ = \"Peeks\";\n# Subroutine-call Message::Hello();\n```\n\n### Making Use of\
    \ predefined Modules\n\nPerl has several predefined modules that can be used in\
    \ Perl applications at any time, such as `strict` and `warnings`.\n\n## PERL PACKAGES\n\
    \nA Perl package is a set of code that resides in its namespace. A Perl module\
    \ is a package defined in a file with the same name as the package and the extension\
    \ `.pm`. A variable or function with same name may exist in two distinct modules.\
    \ Any variable that isn’t in a package belongs to the main package. As a result,\
    \ all variables used are part of the `main` package. The declaration of extra\
    \ packages ensures that variables from various packages do not interfere with\
    \ one another.\n\n### Perl Module Declaration\n\nThe module’s name must be the\
    \ same as the package name and has a `.pm` extension.\n\nThe file is called `Calculator.pm`\
    \ and is stored in the directory `Calculator`. To return true value to the interpreter,\
    \ `1` is written after the function. Instead of `1`, Perl accepts anything that\
    \ is true.\n\n### Making Use of a Perl Module\n\nWe utilize `need` or `use` functions\
    \ to access this calculator module. `::` is used to access a function or variable\
    \ from a module. Here’s an example to show:\n\n```perl\n#!/usr/bin/perl\n# Using\
    \ Package ’Calculator’\nuse Calculator;\nprint \"Enter the two numbers to add\"\
    ;\n# Defining values to variables\n$x = 10;\n$y = 20;\n# Subroutine-call Calculator::addition($x,\
    \ $y);\nprint \"\\nEnter the two numbers to subtract\";\n# Defining values to\
    \ the variables\n$x = 30;\n$y = 10;\n# Subroutine-call Calculator::subtraction($x,\
    \ $y);\n```\n\n### Using a Different Directory to Access a Package\n\nIf a file\
    \ accessing the package is located outside the directory, we use `::` to specify\
    \ the module’s path. For example, because a file that uses the calculator module\
    \ is outside the calculator package, we write `Calculator::Calculator` for loading\
    \ the module, where the value on the left of the `::` represents the package name\
    \ and the value on the right of the `::` represents the Perl module name. To illustrate,\
    \ consider the following example:\n\n```perl\n#!/usr/bin/perl\nuse GFG::Calculator;\n\
    # Directory_name::module_name\nprint \"Enter the two numbers to add\";\n# Defining\
    \ values to variables\n$x = 10;\n$y = 20;\n# Subroutine-call Calculator::addition($x,\
    \ $y);\nprint \"\\nEnter the two numbers to subtract\";\n# Defining values to\
    \ variables\n$x = 30;\n$y = 10;\n# Subroutine-call Calculator::subtraction($x,\
    \ $y);\n```\n\n### Utilizing Module Variables\n\nDeclaring variables from various\
    \ packages before using them allows them to be utilized. The following example\
    \ exemplifies this.\n\nThe module’s Perl file is as follows.\n\n### Begin and\
    \ End Block\n\nWhen we wish to run some code at the beginning and some code at\
    \ the conclusion, we utilize the `BEGIN` and `END` blocks. The codes within `BEGIN...`\
    \ are run at the beginning of the script, while the codes within `END...` are\
    \ executed at the end. This is demonstrated in the following program:\n\n```perl\n\
    #!/usr/bin/perl\n# Predefined BEGIN block\nBEGIN {\n    print \"In begin block\\\
    n\";\n}\n# Predefined END block\nEND {\n    print \"In end block\\n\";\n}\nprint\
    \ \"Hello Everyone;\\n\";\n```\n\n## NUMBER AND ITS TYPES IN PERL\n\nIn Perl,\
    \ a number is a mathematical object that may use to count, measure, and perform\
    \ different mathematical operations. A numeral is a notational sign that symbolizes\
    \ a number. In addition to being used in mathematical operations, these numerals\
    \ are also utilized for ranking (in the form of serial numbers).\n\nThese numbers\
    \ can be classified into several sorts based on their application:\n\n- **Integers:**\
    \ Perl integers are represented as decimal numbers with a base of 10. These numbers\
    \ might be both positive and negative. On the other hand, Perl employs `_` to\
    \ represent large integer values to improve readability. Example: `213,254,484`\
    \ is represented as `213_254_484`.\n\n```perl\n#!/usr/bin/perl\n# Positive-Integer\n\
    $c = 30;\n# Negative-Integer\n$d = -25;\n# Big Integer-Number\n$e = 213_254_484;\n\
    # Printing these numbers\nprint(\"Positive Integer: \", $c, \"\\n\");\nprint(\"\
    Negative Integer: \", $d, \"\\n\");\nprint(\"Big Integer: \", $e, \"\\n\");\n\
    ```\n\n- **Floating point numbers:** In Perl, floating-point numbers have an integer\
    \ and fractional values separated by a decimal point. The integer component of\
    \ a floating number can be positive or negative, while the fractional component\
    \ can only be positive. In Perl, floating numbers may be expressed in two ways:\n\
    \n    - **Fixed point:** The decimal point is fixed in this format. This decimal\
    \ point marks the beginning of the fractional portion.\n\n    - **Scientific:**\
    \ This representation comprises two parts: the significand (the actual number)\
    \ and the exponent (the power of 10 by which the significand is multiplied).\n\
    \n```perl\n#!/usr/bin/perl\n# Positive Floating-Number\n$c = 20.5647;\n# Negative\
    \ Floating-Number\n$d = -15.2451;\n# Scientific-value\n$e = 123.5e-10;\n# Printing\
    \ these numbers\nprint(\"Positive Number: \", $c, \"\\n\");\nprint(\"Negative\
    \ Number: \", $d, \"\\n\");\nprint(\"Scientific Number: \", $e, \"\\n\");\n```\n\
    \n- **Hexadecimal numbers:** Hexadecimal numerals have a base of 16, ranging from\
    \ 0 to 15, and are written as `0xa` with `0x` before the number, whereas `a` here\
    \ represents the value of 10 in Hex form. These alphabets represent 10–15 and\
    \ range from `a` to `f`. Hexadecimal numerals can have both positive and negative\
    \ values.\n\nAs a result, `% x` is used to display the value of the number in\
    \ hexadecimal format, as illustrated above.\n\n- **Octal numbers:** Octal numbers\
    \ are numbers with a base of 8, ranging from 0 to 7. These numbers are represented\
    \ as `057`, with the number preceded by a `0` and the remainder being the octal\
    \ value of the requisite decimal number. Octal numbers, like other sorts, can\
    \ be both positive and negative.\n\n`% o` is used here to output the value in\
    \ the octal form.\n\n- **Binary numbers:** Binary numbers have a base of two,\
    \ meaning they have only two values: 0 and 1. These numbers are written as `0b1010`,\
    \ with the letter `0b` before the number.\n\n    `% b` is used to display the\
    \ number in binary form.\n\n## DIRECTORIES WITH CRUD OPERATIONS IN PERL\n\nPerl\
    \ is a universal and cross-platform programming language that is mainly used for\
    \ text manipulation and is utilized in developing several software applications\
    \ such as web development and graphical interface applications. It is favored\
    \ over other programming languages because it is quicker and more powerful, and\
    \ it also includes many shortcuts that aid in creating rapid scripts.\n\nThe following\
    \ procedures can be done on a directory:\n\n- Making a new directory.\n- Opening\
    \ an existing directory.\n- Reading directory content.\n- Modifying a directory\
    \ path.\n- Directory closing.\n- Delete a directory.\n\n### Making a New Directory\n\
    \n`mkdir(PATH, MODE)` is used to create a directory. This function assists in\
    \ creating a new directory; if the user wishes to check whether the file already\
    \ exists, the `-e` function can be used. `PATH` sets the path using the mode specified\
    \ by the `MODE` function.\n\n### Opening an Existing Directory\n\nIn Perl, the\
    \ short function `opendir(DIRHANDLE, PATH)` is used to open a directory. The `PATH`\
    \ parameter defines the path to the directory to be opened.\n\n### Read Directory\
    \ in the Scalar and List Context\n\nReading a directory is a regular operation\
    \ since one must read what is stored in the files every time the code is run or\
    \ understood. `readdir(DIRHANDLE)` is used to read a directory. A user can read\
    \ the directory in two ways: list context and scalar context.\n"
