- fmt: "\n# Polymorphism in OOP\n\nPolymorphism is the capability of processing data\
    \ in several forms. Poly means numerous, and morphism implies kinds; therefore,\
    \ the term itself shows the meaning. Polymorphism is one of the most fundamental\
    \ concepts of an OOP language. In OOP, polymorphism is often employed when a parent\
    \ class reference refers to a child class object. This section will examine how\
    \ to express any function in several kinds and formats.\n\nA real-world example\
    \ of polymorphism is that a person may simultaneously play multiple roles in life.\
    \ As a woman simultaneously fulfills the roles of mother, wife, employee, and\
    \ daughter. Therefore, a single individual must possess various characteristics,\
    \ each of which must be implemented according to the scenario and conditions.\
    \ Polymorphism is regarded as one of the OOP’s most essential characteristics.\n\
    \nOOP’s primary advantage is polymorphism. Polymorphism is so essential that languages\
    \ that do not support it cannot call themselves object-oriented. Object-based\
    \ languages are those that have classes but do not support polymorphism. Consequently,\
    \ it is crucial for OOP language. It is the ability of an object or reference\
    \ to take on multiple forms in different contexts. It supports function overloading,\
    \ function overriding, and virtual functions.\n\n![](images/ufig7_7.jpg)\n\nPolymorphism\
    \ in OOP.\n\nPolymorphism is a property that allows any message to be sent to\
    \ objects of multiple classes, and each object can respond appropriately based\
    \ on the class properties.\n\nThis means that in an OOP language, polymorphism\
    \ is the method that does different things depending on the class of the object\
    \ that calls it. `$square->area()`, for example, will return the area of a square,\
    \ whereas `$triangle->area()` may return the area of a triangle. `$object->area()`,\
    \ on the other hand, would have to calculate the area based on which class `$object`\
    \ was called.\n\nPolymorphism is best explained by using the following example:\n\
    \n```perl\nuse warnings; # Creation of class using package package A; # Constructor-creation\
    \ sub new { # shift will take package name ’vehicle’\n# and assign it to the variable\
    \ ’class’ my $class = shift; \nmy $self = { ’name’ => shift, ’roll_no’ => shift\
    \ }; \nsub poly_example { print(\"This corresponds to a class A\\n\"); } }; \n\
    package B; # The @ISA array contains a list # of that class’s parent classes,\
    \ if any my @ISA = (A); \nsub poly_example { print(\"This corresponds to a class\
    \ B\\n\"); } \npackage main; B->poly_example(); A->poly_example();\n```\n\nThe\
    \ method `poly_example()` defined in class `B` overrides the definition inherited\
    \ from class `A` for the first output and vice versa for the second output. This\
    \ allows you to add or extend the functionality of any pre-existing package without\
    \ having to rewrite the entire definition of the class repeatedly. As a result,\
    \ the programmer’s life is made more accessible.\n\n# ENCAPSULATION IN OOPs\n\n\
    Encapsulation in Perl is the process of enclosing data to secure it from external\
    \ sources that should not have access to that section of code. Encapsulation is\
    \ a component of OOP; it ties data to the subroutines that change it. Encapsulation\
    \ is, in another sense, a protective barrier that prevents the data from being\
    \ accessible by code outside of this shield.\n\n*   Technically, under encapsulation,\
    \ variables or data of a class are concealed from other classes and may only be\
    \ accessible through member functions of the class in which they are defined.\n\
    *   As with encapsulation, the data inside a class is concealed from other classes;\
    \ hence, it is sometimes referred to as data-hiding.\n*   Encapsulation may be\
    \ performed by declaring all class variables as local and retrieving class methods\
    \ by importing packages to set and retrieve variable values.\n\n![](images/ufig7_8.jpg)\n\
    \nEncapsulation in OOP.\n\nConsider a real-world example of the encapsulation:\
    \ in a business, there are several departments, such as accounts, finance, and\
    \ sales. The finance sector conducts all financial transactions and maintains\
    \ records of all financial data.\n\nSimilarly, the sales department conducts all\
    \ sales-related operations and maintains sales data. Now, there may be a situation\
    \ in which a finance department official needs complete sales information for\
    \ a given month. In this instance, he is not permitted direct access to the sales\
    \ section’s data. He must first call another officer in the sales department and\
    \ then request that individual data be provided.\n\nThis describes encapsulation.\
    \ Here, the sales section’s data and the people who may change them are grouped\
    \ under the name “sales section.”\n\nIf there is a need to access the class’ data\
    \ for any modifications or simply to print the class’ data in the above code,\
    \ it cannot be done directly. It is essential to create an object of that class\
    \ and then use the `get_details()` method to access the data. This is referred\
    \ to as Data Encapsulation.\n\nThe benefits of encapsulation are:\n\n*   Data-hiding:\
    \ the user will be unsure of the inner implementation of the class. The user cannot\
    \ see how the class stores data in its variables. They are just conscious that\
    \ we are giving values to accessors, and variables are being initialized with\
