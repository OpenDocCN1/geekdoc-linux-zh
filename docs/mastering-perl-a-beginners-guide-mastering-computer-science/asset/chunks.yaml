    \ generated by utilizing other operators such as relational operators and logical\
    \ operators.\n\n## VARIABLES IN PERL\n\nVariables are used throughout Perl to\
    \ store and manipulate data. A variable takes up memory space when it is created.\
    \ A variable’s data type assists the interpreter in allocating memory and deciding\
    \ what to store in reserved memory. Variables can so hold integers, decimals,\
    \ or texts by assigning multiple data types to the variables.[²](#chapter2.xhtml_en2_2)\n\
    \n### Naming of a Variable\n\nWith the usage of a certain data type, a variable\
    \ in Perl can be called anything. When naming a variable, there are various guidelines\
    \ to follow:\n\n*   Perl variables are case-sensitive.\n\n*   According to the\
    \ data type, it begins with $, @, or % and is followed by zero or more letters,\
    \ underscores, and digits.\n\n*   Variables in Perl are not permitted to contain\
    \ white spaces or any special character other than underscore.\n\n### Declaration\
    \ of a Variable\n\nThe data type used to define the variable is used to declare\
    \ the variable. These variables can have one of three data types:\n\n*   **Scalar\
    \ variables:** Scalar variables comprise a single string or numeric value. It\
    \ begins with the $ symbol. Syntax: $varname = value;\n\n*   **Array variables:**\
    \ It comprises a set of values that have been randomly ordered. It begins with\
    \ the @ symbol. Syntax : @varname = (val1, val2, val3, …..);\n\n*   **Hash variables:**\
    \ It has (key, value) pairs that are efficiently accessible per key. It begins\
    \ with the % sign. Syntax : %varname = ( key1=>val1, key2=>val2, key3=>val3,…);\n\
    \n### Modification of a Variable\n\nPerl allows us to change the values of variables\
    \ after they’ve been declared. A variable can change in a variety of ways:\n\n\
    *   A scalar variable’s value can change simply by redefining it.\n\n*   An array\
    \ element can update by passing its index to the array and assigning a new value\
    \ to it.\n\n*   A hash value can change by using its key.\n\n### Variable Interpolation\n\
    \nPerl provides many ways for assigning a string to a variable. This may be accomplished\
    \ by using single quotes, double quotes, the q-operator, the double-q operator,\
    \ and so forth.\n\nThe use of single and double quotes for string writing is the\
    \ same; however, there is a minor difference in how they operate. Strings enclosed\
    \ in single quotes display the content contained within them exactly as typed.\n\
    \nStrings enclosed in double quotes, on the other hand, replace the variables\
    \ with their values before displaying the string. It even replaces the escape\
    \ sequences with their correct implementation.\n\n## VARIABLES AND ITS TYPES"
