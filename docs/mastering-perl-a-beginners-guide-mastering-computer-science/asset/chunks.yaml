    \n在本章中，我们涵盖了 Perl 的基础知识，讨论了编写模式、布尔值、运算符和变量。此外，我们还涵盖了 Perl 模块、Perl 包、数字及其类型，以及带有\
    \ CRUD 操作的目录。\n\n## NOTES\n\n# 第 3 章：Perl 中的输入与输出\n\nDOI: [10.1201/9781003358442-3](https://doi.org/10.1201/9781003358442-3)\n\
    \n## 本章内容\n\n*   `print()` 和 `say()` 的用法\n*   `print` 运算符\n*   使用 `STDIN` 进行输入\n\
    \n在上一章中，我们涵盖了 Perl 的基础，在本章中，我们将涵盖输入和输出及其相关示例。\n\n## PERL `print()` 和 `say()` 方法\n\
    \nPerl 使用语句和表达式对用户提供的输入或代码中呈现的硬编码输入进行求值。因为在编译器中已进行了求值，所以求值后的表达式不会显示给程序员。Perl 使用\
    \ `print()` 和 `say()` 函数来显示求值后的表达式。这些程序可以显示传递给它们的任何参数。\n\n### `print()` 运算符\n\n\
    Perl 中的 `print()` 运算符用于打印传递作为输入的列表中的表达式值。`print` 运算符返回传递给它的任何参数，无论是字符串、数字、变量还是其他内容。该运算符的定界符是双引号（“”）。\n\
