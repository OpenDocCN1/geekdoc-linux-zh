- fmt: "\nThe `shift` keyword transfers the package name from the default array `@_`\
    \ to the `bless` function. The `bless` method returns a reference that eventually\
    \ becomes an object. And lastly, the constructor will return an instance of the\
    \ `Employee` class. The most important aspect is how to initialize an object.\
    \ It may be accomplished as follows: `$object = new Employee(1, \"Peeks\", \"\
    forPeeks\");`.\n\nIn this case, `$object` is a scalar variable that refers to\
    \ the hash defined in the constructor.\n\nThe following is an example program\
    \ for creating and implementing objects in OOPs:\n\n```perl\nuse strict;\nuse\
    \ warnings;\n# class with the name Employee\npackage Employee;\n# constructor\
    \ with name new\nsub new {\n    # shift will take package name\n    # and assign\
    \ it to the variable ’class’\n    my $class = shift;\n    # defining hash reference\n\
    \    my $self = {\n        _serialNum => shift,\n        _firstName => shift,\n\
    \        _lastName => shift,\n    };\n    # Attaching object with the class bless\n\
    \    bless $self, $class;\n    # returning the instance of class Employee\n  \
    \  return $self;\n}\n# Object creation of class\nmy $object = new Employee(1,\
    \ \"Peeks\", \"forPeeks\");\n# object here is a hash to reference\nprint(\"$object->{_firstName}\
    \ \\n\");\nprint(\"$object->{_serialNum} \\n\");\n```\n\nAn object in Perl functions\
