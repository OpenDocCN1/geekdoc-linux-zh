  trans: "\n`shift` 关键字将包名从默认数组 `@_` 传递给 `bless` 函数。`bless` 方法返回一个最终会变成对象的引用。最后，构造函数将返回一个\
    \ `Employee` 类的实例。最重要的方面是如何初始化对象。这可以通过以下方式实现：`$object = new Employee(1, \"Peeks\"\
    , \"forPeeks\");`。\n\n在这种情况下，`$object` 是标量变量，指向构造函数中定义的哈希（hash）。\n\n以下是一个在 OOP\
    \ 中创建和实现对象的示例程序：\n\n```perl\nuse strict;\nuse warnings;\n# 类名为 Employee\npackage\
    \ Employee;\n# 具名为 new 的构造函数\nsub new {\n    # shift 将获取包名\n    # 并将其赋值给变量 ’class’\n\
    \    my $class = shift;\n    # 定义哈希引用\n    my $self = {\n        _serialNum =>\
    \ shift,\n        _firstName => shift,\n        _lastName => shift,\n    };\n\
    \    # 使用 bless 将对象绑定到类\n    bless $self, $class;\n    # 返回 Employee 类的实例\n  \
    \  return $self;\n}\n# 创建类对象\nmy $object = new Employee(1, \"Peeks\", \"forPeeks\"\
    );\n# 这里对象是一个指向哈希的引用\nprint(\"$object->{_firstName} \\n\");\nprint(\"$object->{_serialNum}\
    \ \\n\");\n```\n\nPerl 对象的工作方式与其他语言（如 `C++` 和 `Java`）相同。上面的程序演示了 Perl 中对象的流程，包括其在类中的创建和使用。\n\
    \n# OOP 中的方法\n\n方法用于访问和修改对象的数据。这些可以通过类或包对象调用的实体。Perl 中的方法仅仅是子程序（subroutines）；它们没有独特的身份。方法的语法与子程序相同。方法和子程序一样，使用\
    \ `sub` 关键字指定。作为第一个参数，方法接收调用它的对象或包。\n\nOOP 采用这些方法来更改对象的数据，而不是直接与对象交互；这样做是为了通过防止程序员直接修改对象的数据来确保数据安全。各种接受对象作为参数并将其值保存在另一个变量中的辅助方法使得这成为可能。此外，对第二个变量进行了调整。这些更改不会影响对象的数据，使其更加安全。\n\
    \n### Perl 中的方法类型\n\n根据给定的输入，Perl 中的方法可以分为两类：静态方法和虚拟方法。\n\n静态方法是指方法的第一个参数是类名的方法。由于静态方法接受类名作为参数，因此其功能被应用于整个类。这些也被称为类方法。由于大多数方法属于同一个类，因此没有必要提供类名作为参数。例如：类的构造函数被认为是静态方法。\n\
    \n虚拟方法是将对象引用作为函数的第一个参数提供的方法。虚拟函数的第一个参数被移动到局部变量中，然后用作引用。\n\n在 OOP 中，方法需要括号来存放参数，这些方法通过箭头运算符（`->`）调用。\n\
    \n### get-set 方法\n\n方法用于保护对象的数据，因此与对象的引用一起使用，或者将值存储在另一个变量中然后。在 OOP 中，get-set 方法用于为对象提供数据安全。get\
    \ 方法用于检索对象的当前值，而 set 赋值方法则为对象分配一个新值。\n\n# 构造函数和析构函数\n\n我们将通过示例解释构造函数和析构函数。\n\n\
    ### 构造函数\n\nPerl 子程序的构造函数返回类的实例作为返回对象。在 Perl 中，构造函数通常被称为 `new()`。与许多其他 OOP 语言不同，Perl\
    \ 没有用于对象构造特殊语法。它利用显式与类连接的数据结构（哈希、数组、标量）。在哈希引用和类名上，构造函数调用 `bless` 方法（即包名）。\n\n\
    让我们编写一些程序以便更详细的解释。\n\n注意：由于使用了包（packages），以下代码将在在线 IDE 上执行。以下文本代表一个 Perl 类或模块文件。使用扩展名\
    \ (`*.pm`) 保存文件。\n\n当调用构造器方法时，包名 `Area` 存储在默认数组 `@_` 中。关键字 `shift` 用于从 `@_` 中提取包名并传递给\
    \ `bless` 函数。\n\n在 Perl 中，属性以键值对的形式存储在哈希引用中。此外，代码中还添加了一些属性。\n\n上面的（Area 类）代码有两个属性：长度和宽度。设计了另一个\
    \ Perl 程序使用这些属性来获取它们的访问。\n\n**如何运行代码：**\n\n*   将带有包 `Area` 的程序保存为文本文件 `Area.pm`。\n\
    *   注意：文件名应始终与包名相同。\n*   将用于访问包中定义的属性的程序保存为 `*.pl`。`*` 在此处可以是任何名称（在这种情况下，为 `test.pl`）。\n\
    *   在 Perl 命令行中使用命令 `perl test.pl` 运行保存为 `test.pl` 的代码。\n\n### 传递动态属性\n\n在现有文件中添加动态属性：\n\
    \n**程序：Areas.pm**\n```perl\npackage Area;\nsub new {\n    my ($class, $args) =\
    \ @_;\n    # 因为值将\n    # 动态地传递\n    my $self = {\n        length => $args->{length}\
    \ || 1, # 默认值为 1（已存储）\n        width => $args->{width} || 1, # 默认值为 1（已存储）\n \
    \   };\n    return bless $self, $class;\n}\n# 我们还添加了 get_area 函数\n# 来计算面积\nsub\
    \ get_area {\n    my $self = shift;\n    # 通过乘法获取面积\n    my $area = $self->{length}\
    \ * $self->{width};\n    return $area;\n}\n1;\n```\n\n**程序：test.pl**\n```perl\n\
    use strict;\nuse warnings;\nuse feature qw/say/;\nuse Area;\n# 将长度和宽度参数\n# 传递给构造函数\n\
    my $area = Area->new(\n    {\n        length => 2, # 将 ’2’ 作为长度参数\n        width\
    \ => 2, # 将 ’2’ 作为宽度参数\n    }\n);\nsay $area->get_area;\n```\n\n### 析构函数\n\n当所有对象引用从作用范围内移除时，Perl\
    \ 会自动调用析构方法。如果类生成了在删除时必须移除的线程或临时文件，析构方法非常有用。Perl 为析构函数有一个特殊的方法名 `DESTROY`，在声明析构函数时必须使用。\n\
    \n# OOP 中的方法重写\n\n重写是任何面向对象的计算机语言的特性，允许子类或子类实现超类或父类中已存在的方法。当子类方法的名字、参数或签名以及返回类型（或子类型）与其父类中的方法相同时，子类方法被认为重写了父类方法。\n\
    \n方法重写意味着代码由两个或多个同名的方法，每个方法都有独特的用途并与其他不同。因此，该术语的字面定义指示一种方法必须优先另一种方法。这种思想是在派生类中重新定义具有相同方法签名的基类方法。\n\
    \n方法重写是 Perl 实现运行时多态的一种方式。运行的方法取决于调用它的对象。如果使用父类对象来调用方法，则将运行父类中的版本；然而，如果使用子类对象，则将执行子类中的版本。换句话说，被引用的对象的类型决定了将执行哪个版本的重写方法，而不是引用变量的类型。\n\
    \nPerl 中的方法重写通过以下示例得到最好的展示。\n\n"
- fmt: '

    We have a base class `vehicle` that has the methods `get_mileage()` and `get_cost()`,
    as well as a derived class `car` that has the methods `get_mileage()` and `get_age()`.
    Now, because one of the methods in both classes has the same name, their execution
    will follow the Method overriding concept. Let’s look at the example and see how
    it’s performed.


    ### Base class creation

    ```perl

    # Declaration and definition of the Base class

    use strict;

    use warnings;

    # Creating parent-class package

    package vehicle;

    sub new {

    # shift will take package name ’vehicle’

    # and assign it to the variable ’class’

    my $class = shift;

    my $self = { ’distance’=> shift, ’petrol_consumed’=> shift };

    # Bless function to bind object to class

    bless $self, $class;

    # returning object from the constructor

    return $self;

    }

    # Method for the calculating the mileage

    sub get_mileage {

    my $self = shift;

    # Calculating-result

    my $result = $self->{’distance’} / $self->{’petrol_consumed’};

    print "The mileage by our vehicle is: $result\n";

    }

    # Method for the calculating the cost

    sub get_cost {

    my $self = shift;

    # Calculating-result

    my $result = $self->{’petrol consumed’} * 70;

    print "Cost is: $result\n";

    }

    1;

    ```


    ### Derived class creation

    ```perl

    # Declaring and defining the derived class

    # Creating derived-class

    package car;

    use strict;

    use warnings;

    # Using the parent class

    parent ’vehicle’;

    # Overriding method

    sub get_mileage {

    my $self = shift;

    # Calculating result

    my $result = $self->{’distance’} / $self->{’petrol_consumed’};

    print "The mileage by our car is: $result";

    }

    # Function to get age from the user

    sub get_age {

    my $self = shift;

    # Taking input from the user

    my $age = <>;

    # Printing the age

    print "The Age is: $age\n";

    }

    1;

    ```


    ### Using objects to demonstrate the Method Overriding process

    ```perl

    # Calling objects and

    # methods of each class

    # using corresponding objects.

    use strict;

    use warnings;

    # Using derived class as parent

    use car;

    # the object creation and initialization

    my $ob1 = vehicle -> new(2550, 170);

    my $ob2 = car -> new(2500, 250);

    # Calling methods using the Overriding

    $ob1->get_mileage();

    $ob2->get_mileage();

    ```


    As can be seen, the method from the class that is being called with the object
    overrides the other method with the same name but in different classes. The `get_mileage`
    method on the object `vehicle` prints “The mileage by our vehicle is: 15” via
    the method declared in the class `vehicle`. When we execute the method in the
    class `car` `get_mileage` on the object of `car`, we get the output “The mileage
    by our car is: 10.”


    ### Why Do We Override Methods?


    As noted before, overridden methods enable Perl to offer polymorphism at runtime.


    Polymorphism is crucial to OOP for the following reason: it enables a base class
    to describe methods that will share by all of its descendants, while subclasses
    may define the particular implementation of any or all of those methods. Perl
    also provides the “one interface, several methods” element of polymorphism through
    overridden methods.


    Dynamic method dispatch (runtime polymorphism) is one of object-oriented architecture’s
    most effective strategies for code reuse and resilience. The ability to exist
    code libraries to call methods on instances of new classes without recompilation
    while preserving a clean abstract interface is a potent instrument.


    Overridden methods enable us to invoke methods of any derived class without knowing
    the object type of the derived class. Thus, method overriding simplifies programming
    since there is no need to memorize distinct names when developing new methods;
    instead, it is more necessary to remember the processes inside the Method.


    ## INHERITANCE IN OOPs


    Inheritance is a class’s ability to extract and use the characteristics of another
    class. It is the the process of creating new classes, known as Derived classes,
    from existing classes, known as Base classes. The essential idea is that the programmer
    may utilize the characteristics of one class in another without declaring or defining
    the same item several times across classes.


    We may inherit the member functions from the base class instead of writing them
    in each class declaration. Inheritance is one of OOP’s most essential features.


    **Subclass:** A subclass or Derived class is a class that inherits properties
    from another class.


    **Superclass:** The class whose attributes are inherited by subclasses is known
    as the Superclass or Base Class.


    The most basic principle of inheritance is the creation or derivation of a new
    class from another class.


    ### Base Class and Derived Class


    Derived classes are created by deriving additional inherited subclasses from the
    base class. A single base class can have multiple derived classes; this type of
    inheritance is known as Hierarchical Inheritance. These derived classes are all
    derived from a single Parent or Base class. Multiple Inheritance occurs when a
    derived class shares multiple parent classes and inherits its features from multiple
    parent classes.


    ![](images/ufig7_3.jpg)


    Base class and Drive class.


    The image above depicts the order in which a class is derived from a base class.
    The order and denotations shown in the above image will be used whenever necessary
    to theoretically depict the order of inheritance.


    Consider the `Vehicles` class. Now we must create a class for each type of vehicle,
    such as a bus, car, or truck. For all `Vehicles`, the methods `fuelAmount()`,
    `capacity()`, and `applyBrakes()` will be the same.


    ![](images/ufig7_4.jpg)


    Inheritance creation.


    The preceding image depicts the creation of these classes without the concept
    of inheritance.


    The above process clearly results in the duplication of the same code three times.
    This raises the likelihood of error and data redundancy. Inheritance is used to
    avoid situations like this. We can simply avoid data duplication and increase
    reusability if we create a class, write these three functions in it, and inherit
    the rest from it.


    ![](images/ufig7_5.jpg)


    Three classes inherit from vehicle class.


    Because we inherited the rest of three classes, we only need to write the functions
    once instead of three times.


    ### Multilevel Inheritance


    In Perl, inheritance can take many forms, but the most common is Multilevel Inheritance,
    which involves a chain of base and derived classes. In Multilevel Inheritance,
    a derived class inherits a base class, and the derived class also serves as the
    base class for other classes. In the diagram below, class A serves as a base class
    for derived class B, which serves as base class for derived class C.


    ![](images/ufig7_6.jpg)


    Multilevel Inheritance


    ### Implementing Inheritance in the Perl


    Packages can be used to implement inheritance in Perl. Packages are used to create
    a parent class from which derived classes can inherit functionality.


    The base class is defined in the code above. The base class is `employee`, and
    the data members are the employee id and the employee’s name. This parent class
    code must be saved as `*.pm`, which we will do here as `employee.pm`. We’ll now
    look at how to create a class from the previously declared base class `employee`.


    As seen in the preceding example, the class `Department` makes use of the traits
    of the previously declared class `employee`. As a result, when we declared the
    class `Department`, we did not declare all of the data members again but instead
    inherited them from the base class `employee`. To run this code, save the intermediatory
    class code as `*.pm`, as `Department.pm` in this case. This is the intermediary
    class and will also serve as the parent class for the following derived file data
    `.pl`.

