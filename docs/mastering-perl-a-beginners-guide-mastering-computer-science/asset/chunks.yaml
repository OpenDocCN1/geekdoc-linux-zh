    ## FILE LOCKING


    File locking, or locking in general, is simply one of the several techniques offered
    to address resource sharing issues.


    Locking the security and integrity of any document is a means of protecting it.
    The basic goal of file locking is to allow users to make changes to a document
    without causing havoc. When two or more people attempt to change the same file,
    problems may occur.


    Consider the following example: a file holding project data. The file can be modified
    by the whole project team. On the web, a CGI script will be written to accomplish
    the following: $file = "project.docx"; $commit = $ENV{’QUERY_INFO’}; open(FILE,
    "$file"); #opening document while() { if (m/^$commit$/) { print "The Change already
    made\n"; exit; } } close(FILE); push(@newcommit, $commit); open(FILE, ">$file");
    print ... close(FILE); print "Commit-made"; exit;


    The locking of a file is performed at the system level; thus, the user need not
    be concerned with the specifics of applying the lock. The purpose of file locks
    is to put temporary limitations on certain files to limit how they may share between
    programs. Two sorts of locks are developed based on the nature of a given operation.


    A shared lock is the first kind, whereas an exclusive lock is the second. Multiple
    processes may share read access to a file since read access does not alter the
    shared resource’s state. Therefore, keeping a consistent picture of the shared
    resource is possible. The flock command may use in Perl to lock files.


    ### flock()


    flock() has two arguments. The FileHandle is the first. The second input specifies
    the locking procedure that is required.


    Perl employs numbers to represent values: sub LOCK_SH { 1 } ## set as the shared
    lock sub LOCK_EX { 2 } ## set as the exclusive lock sub LOCK_NB { 4 } ## set the
    lock without any blocks sub LOCK_UN { 8 } ## unlock FILEHANDLE


    *   **Shared lock:** A shared lock can be used when we just want to read a file
    while allowing others to view it. Shared lock not only creates a lock, but it
    also checks for the presence of additional locks. This lock does not cover the
    existence check for all locks, just the “Exclusive Lock.” If an exclusive lock
    is present, it will wait until the lock is removed. It will be performed as shared
    lock after removal. Multiple shared locks may exist at the same time.


    *   **Exclusive lock:** When a file is to be utilized by a group of individuals
    and everyone has the ability to make changes, an exclusive lock is employed. Only
    one exclusive lock will be placed on a file, allowing only one user/process to
    make modifications at a time. The rule of an exclusive lock is “I am the only
    one.” flock() searches the script for any additional sorts of locks. If it is
    discovered, it will remain until all of them have been deleted from the script.
    It will lock the file at the appropriate time.


    *   **Non-blocking lock:** A non-blocking lock alerts the system that it does
    not need to wait for other locks to be released from the file. If another lock
    is detected in the file, it will produce an error message.


    *   **Unblocking:** The same as the close(FILE) function, this function unblocks
    any given file.


    The following problem demonstrates the use of the flock() function:


    ### flock() vs lockf()


    In contrast to flock(), which locks entire files at once, the lockf() method locks
    fragments of a file. lockf() cannot be used directly in Perl, but Perl natively
    supports the flock system function but does not apply to network locks.


    Perl supports the fcntl() system function, providing the most excellent locking
    controls.


    ## SLURP MODULE


    The File::Slurp module reads a file’s contents and saves them in a string. It
    is a simple and quick method of reading/writing/modifying entire files. It, like
    its name suggests, lets us to read or write whole files with a single call.


    By importing this module into our program, the user may use functions like read_file,
    read_text, write_file, and so on to read and write data to and from files.


    **Installation of the File::Slurp module:** We must first include this module
    in our Perl language package to utilize it. This can be accomplished by entering
    the following instructions into our Perl Terminal and installing the necessary
    module.


    **Step 1:** Run the following command in our terminal: perl -MCPAN -e shell


    After entering the cpan shell, proceed to the following step to install the File::Slurp
    module.


    **Step 2:** To install the module, run the following command: install File::Slurp


    The File::Slurp module will be installed as a result of this.


    **Step 3:** To exit the cpan> prompt, type and execute the “q” command.


    **read_file function in the Slurp:** The read file function of File::Slurp reads
    the complete contents of a file with the file name and returns it as a string.
    However, File::Slurp is recommended since it has a few encoding layer flaws that
    may cause compilation difficulties. File::Slurper seeks to offer a viable answer
    to the difficulties above.


    **read_text function in the Slurp:** The read_text method in File::Slurper accepts
    an optional encoding parameter (if any) and can automatically decode CRLF line
    ends if we request it (for Windows files).


    **Note:** CRLF line endings indicate a line break in a text file (Windows line
    break types).


    **Slurp’s write_file function:** The File::Slurp module’s write_file method is
    used to write to many files at once. It writes to file using a scalar variable
    containing the content of another file read by the read_file function.


    **First example:** Storing file content using scalar # Perl code to illustrate
    slurp function use File::Slurp; # read whole file into a scalar my $content =
    read_file(’C:\Users\PeeksForPeeks\PFP_Slurp.txt’); # write out a whole file from
    scalar write_file(’C:\Users\PeeksForPeeks\Copyof_PFP_Slurp.txt’, $content);


    **Explanation:** In the preceding Perl code, we used a slurp function to read
    a file named PFP_Slurp.txt containing several lines of text as input into a scalar
    variable named $content and then wrote the contents of the file as a single string
    into another file Copyof_PFP_Slurp.txt.


    **Second example:** Storing file content in an array # perl code to illustrate
    slurp function use File::Slurp; # read whole file into a scalar my @lines = read_file(’C:\Users\PeeksForPeeks\PFP_Slurp2.txt’);
    # write out a whole file from scalar write_file(’C:\Users\PeeksForPeeks\Copyof_PFP_Slurp2.txt’,
    @lines);


    **Explanation:** In the preceding Perl code, we used a slurp function to read
    a file named PFP_Slurp2.txt containing an array of lines of text as input into
    an array variable named @lines and then wrote the contents of the whole file as
    a single string into a file named Copyof PFP_Slurp2.txt.'
