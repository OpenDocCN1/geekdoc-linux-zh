    # Regular Expressions


    In Perl, a regular expression (Regex, Regexp, or RE) is a special text string
    that describes a search pattern within a given text. Regex in Perl is tied to
    the host language and is not the same as in PHP, Python, etc. These are sometimes
    referred to as “Perl 5 Compatible Regular Expressions.” Binding operators such
    as `= ∼` (Regex Operator) and `!∼` (Negated Regex Operator) are used to use the
    Regex.


    Binding regex operators are used to matching a string against a regular expression.
    The statement’s left side will contain a string that matches the specified pattern
    on the right side. The negated regex operator determines whether or not the string
    is equal to the regular expression specified on the right-hand side.


    Regex operators aid in searching a file for a specific word or group of words.
    This can accomplish in a variety of ways, depending on the user’s specific requirements.
    Perl searches follow the standard format of opening the file in read mode and
    then reading the file line by line, looking for required string or group of strings
    in each line. When the required match is found, the statement following the search
    expression determines what to do with the matched string, which can add to any
    other file specified by the user or printed on the console.


    There are several ways to look for the required string within the regular expression
    that was created to match the string with the file.


    ## Regular Search


    This basic pattern for writing a regular expression searches for the specified
    string within the specified file. The syntax of such a regular expression is as
    follows: `$String =∼ /the/`


    This expression will look for lines in the file that contain the letters “the”
    and store that word in the variable `$String`. Furthermore, the value of this
    variable can be copied to a file or printed to the console.


    In the list of words that contain the word “the,” to avoid such words, the regular
    expression can be modified as follows: `$String =∼ / the /`


    By inserting spaces before and after the required word to be searched, the searched
    word is isolated from both ends, and no such word containing it as a part of it
    is returned in the search process. This will eliminate the need to search for
    unnecessary words. However, this will exclude words that contain a comma or a
    full stop immediately after the requested search word.


    To avoid this situation, there are other methods for limiting the search to a
    specific word, one of which is using the word boundary.


    ## Using Word Boundary in the Regex Search


    As seen in the preceding example, a regular search returns either the extra words
    that include the searched word or excludes some of the words if the required word
    is preceded and followed by spaces. A word boundary, denoted by the letter `\b,,”
    is used to avoid this.


    This will limit the words that contain the requested word as part but will not
    exclude words that end with comma or full stop.


    The word that ends with a full stop is included in the search, but words that
    contain the searched words as a part are not. As a result, word boundary can aid
    in overcoming the issue created by the regular search method.


    What if there is a need to find words that begin, end, or both begin and end with
    specific characters? That cannot be accomplished using regular search or the word
    boundary. Perl allows the use of wildcards in Regex in scenarios like these.


    ## Use of Wildcards in the Regular Expression


    With wildcards in regular expression, Perl allows us to search for a specific
    set of words or words that follow a specific pattern in a given file. Wildcards
