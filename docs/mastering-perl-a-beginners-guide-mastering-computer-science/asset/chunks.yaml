    ` and inserting values into it.\n\nPutting everything together:\n\nWe may access\
    \ Perl’s database after building it in MySQL. First, we build a test table with\
    \ the schema `(id INTEGER PRIMARY KEY, name VARCHAR(10), salary INT, dept INT)`.\
    \ We insert values into the table once it has been created without errors.\n"
