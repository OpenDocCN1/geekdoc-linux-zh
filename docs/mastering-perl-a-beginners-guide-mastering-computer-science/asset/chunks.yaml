    在上面的示例中，两个代码块的功能完全相同；但缩进对于包含大量语句的脚本来说更具读者的友好性。


    虽然在 Perl 代码中使用空格和缩进不是强制的，但这是一项推荐的实践。


    ## 关键字


    关键字（通常称为保留字）是语言中用于内部过程或指示预定义操作的术语。它们对编译器具有特殊意义。因此，这些术语不允许作为变量名或对象，否则会导致编译时错误。与控制字一起，Perl
    中的关键字包含了内置函数。


    这些关键字偶尔可以用作变量名，尽管这会导致混淆并使调试此类程序变得困难。


    ## 数据类型


    数据类型定义了 Perl 变量中可以存储的数据种类。Perl 是一种弱类型编程语言。在使用 Perl 程序时不需要提供数据类型。Perl 解释器将根据数据的上下文来选择类型。


    Perl 有三种数据类型，如下：


    -   标量 (Scalars)

    -   数组 (Arrays)

    -   哈希表 (Hashes)


    ### 标量


    单个数据单元可以是整数、浮点值、字符、字符串、段落或整个网页。


    ### 数组


    数组是存储相同数据类型值列表的变量。在 Perl 中，我们使用变量名前名前的 `@` 符号来声明数组。


    它将生成一个包含值 20、30 和 40 的整数数组。`$` 符号用于访问数组中的单个成员。


    ### 哈希表


    它是一组键值对的集合。它也被称为关联数组。在 Perl 中，我们使用 `%` 符号来声明哈希表。我们利用 `$` 符号后接括号中的键来获取特定值。


    本章涵盖了 Perl 介绍、安装和环境搭建以及 Hello World 程序。


    ## NOTE


    # 第 2 章 Perl 基础


    DOI: [10.1201/9781003358442-2](https://doi.org/10.1201/9781003358442-2)


    ## 本章内容


    -   编写模式

    -   布尔值

    -   操作符

    -   变量

    -   Perl 中的模块 (Modules)

    -   Perl 中的包 (Packages)

    -   数字及其类型

    -   带有 CRUD 操作的目录


    在上一章中，我们讨论了 Perl 基础，在本章中，我们将涵盖包、模块操作符、变量和编写模式。


    ## PERL 代码编写方法


    Perl 是一种动态的、高级的、解释型的、通用编程语言。Perl 支持过程化编程和面向对象编程。Perl 最初仅设计用于系统管理和文本处理，但随后的版本包含了管理正则表达式、网络套接字等功能。


    Perl 在语法上与其他常见的编程语言相似，易于编写和理解。Perl 是一种自由格式编程语言，这意味着可以根据用户的需要进行编写、格式化和缩进。


    一个 Perl 程序由一系列语句、循环、子程序等组成，这便于在代码中导航。每个 Perl 语句必须以分号（`;`）结束。Perl 与其他语言一样为 Perl
    代码提供了几种编写和执行模式。这些模式可以根据其与编写和执行模式的兼容性分类如下：


    -   交互模式 (Interactive mode)

    -   脚本模式 (Script mode)

    -   单行模式 (One-liner mode)


    这些模式可以在命令行中配合 Perl 关键字使用，也可以在在线集成开发环境 (IDEs) 中作为代码块使用。除了安装包，Perl 还有其内置的 IDE。


    ### 交互模式


    通过交互方法创建 Perl 代码表示与解释器的交互。交互模式是开始编程的一种极佳方法，因为它允许你逐行检查代码流并简化调试过程。通过 Perl 调试器，Perl
    的交互模式可以在命令行中使用。


    这种解释器通常被称为 REPL – 读取 (Read)、评估 (Evaluate)、打印 (Print)、循环 (Loop)。交互模式允许立即创建和执行代码，而无需创建临时文件保存源代码。使用
    Perl 调试器，内置的 Perl 命令行或 Windows 命令提示符都可以作为 REPL。可以使用以下命令配合 Perl 使用此调试器：````

    perl -de1

    ```


    用户必须在编写 Perl 代码的交互模式下逐行编写代码并同步运行。


    Perl 的交互模式可以直接从命令行运行，而不需要调试器。可以通过以下命令实现：````

    perl -e Code_statement;

    ```


    此语句利用 `-e` 参数避免创建脚本，并允许代码在命令行中不使用调试器的情况下运行。


    这种交互模式下的编写方式不允许用户像在调试器中那样创建多行代码。这种模式不建议用于长程序。


    交互模式对于教授新程序员编程基础很有用，但在处理几行以上代码时可能会变得繁琐且乏味。


    ### 脚本模式


    Perl 中的脚本模式用于开发包含多行代码且对于交互模式来说过于复杂的 Perl 程序。


    使用文本编辑器，可以使用 Perl 的脚本模式来开发 Perl 程序；它被保存在一个名为脚本的文件中，然后在命令行运行该脚本文件。此文件必须以 `.pl`
    扩展名保存，并存储在命令行指定的目录路径相同的目录中。然后使用以下命令从命令行执行该脚本：````

    perl FileName.pl

    ```


    在文本编辑器（例如记事本）中输入代码并保存为 Perl 程序.pl 脚本。


    与交互模式不同，Perl 的脚本模式无法为每个表达式提供输出。


    在交互模式下，表达式会被评估并自动显示结果；而在脚本模式下，表达式会被评估，但在收到提示之前不会显示结果。


    在线 IDE 也提供脚本模式，用于在不手动将代码放入文件的情况下开发和运行 Perl 代码。在这些 IDE 中，编译后的代码以临时文件的形式保存在内存中，只有在代码运行且包含
    IDE 的浏览器打开时才有用。一旦页面刷新，该临时文件就会被删除，内存空间会被释放。在线 IDE 简化了代码的执行，因为它们比必须将文件存在机器内存中的脚本模式需要少的精力。


    这加快了代码的编译和执行。这些在线 IDE 虽然对程序员很方便，但有重大的限制，例如，除非文件上传到它们的服务器，否则无法进行文件处理操作，这对敏感数据构成了风险。通过命令行运行的编译器允许此类文件操作能力。


    这里是一个使用在线 IDE 相加两个整数的 Perl 程序示例：

    ```perl

    #!/usr/bin/perl

    # 数相加程序

    # 给变量赋值

    $var1 = 20;

    $var2 = 35;

    # 评估结果

    $result = $var1 + $var2;

    # 打印结果

    print "Result after the addition is: $result";

    ```


    ### 单行模式


    Perl 还有单行模式 (one-liner mode)，允许我们直接从命令行输入并运行最小代码脚本。这样做是为了防止为长度不长的代码创建存储脚本的文件。使用以下命令，可以在命令行模式下单行编写这些代码：````

    perl -e

    ```


    该命令用于通过用双引号包裹代码在命令行处编写和执行单行代码。前述命令中的 `-e` 标志告知编译器脚本没有保存在任何文件中，而是直接写在该标志随后的双引号代码中。


