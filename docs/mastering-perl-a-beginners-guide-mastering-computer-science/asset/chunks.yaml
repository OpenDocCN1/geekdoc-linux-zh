    \ 和 `warnings` 允许用户更自由地编写代码，并更早地发现变量名拼写错误等问题。我们调用了一个名为 `get_a_string` 的用户定义函数，该函数执行了\
    \ slurp 功能：它将包含几行文本的文件作为输入读取到名为 `pfp_str` 的变量中，然后将整个文件的内容作为一个单个字符串写入文件中。\n\n##\
    \ 有用的文件处理函数\n\nPerl 最初是为了文本处理开发的，例如从文本文件中提取信息并将文本文件转换为新格式。这些过程可以使用多种内置文件函数完成。\n\
    \n以下是一些用于处理文件的一些实用 Perl 例程：\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `glob()` | 用于打印作为传入的目录中的文件。\
    \ |\n| `tell()` | 使用 `FileHandle` 获取文件内读取指针的位置。 |\n| `getc()` | 用于从 `FileHandle`\
    \ 参数指定的读取读取下一个字符。 |\n| `reverse()` | 在列表上下文中使用时，返回反序排列的列表；在标量上下文中使用时，返回列表值连接而成的字符串，其中字符串中每个字符的顺序都是相反的。\
    \ |\n| `rename()` | 将文件从旧名称重命名为用户指定的新名称。 |\n\n在本章中，我们涵盖了 Perl 中的文件处理以及其语法和相关示例。\n\
    \n# 第 6 章节：Perl 中的正则表达式\n\nDOI: [10.1201/9781003358442-6](https://doi.org/10.1201/9781003358442-6)\n\
    \n## 本章内容\n\n* 正则表达式\n* 运算符\n* 正则字符类和特殊字符类\n* 量化与回溯\n* 正则中的“e”修饰符\n* “ee”修饰符\n\
    * `pos()` 函数\n\n在上章中，我们讨论了文件处理；在本章中，我们将涵盖正则表达式（`Regex`）。\n\n在 Perl 中，正则表达式（`Regex`、`Regexp`\
    \ 或 `RE`）是一种特定的文本字符串，用于描述给定文本内部的搜索模式。Perl 中的 `Regex` 与宿语言绑定，与 `PHP`、`Python` 以及其他编程语言中的不同。\n\
    \n它有时被称为“兼容 Perl 5 的正则表达式”。绑定运算符如 `=~`（正则表达式运算符）和 `!~`（非正则表达式运算符）被用于利用 `Regex`。让我们在转向绑定运算符之前，先从创建模式开始吧。\n\
    \n### 模式构建：\n在 Perl 中，可以使用 `m//` 运算符构建模式。该运算符简单地在两个斜杠之间插入所需的模式，而绑定运算符则用于在提供的文本中搜索该模式。\n\
    \n### 使用 m// 配合绑定运算符：\n绑定运算符通常与 `m//` 运算符配合使用以匹配所需的模式。使用正则表达式匹配字符串，请使用正则表达式运算符。语句的左侧将包含一个字符串，该字符串将匹配右侧提供的模式。非正则表达式运算符用于判断字符串是否等于右侧提供的正则表达式。\n\
    \n**程序 1：** 以下代码演示了 `m//` 和 `=~` 的用法：\n```perl\n# 演示程序\n# m// 和 =~ 运算符\n# 实际字符串\n\
    $a = \"PEEKSFORPEEKS\";\n# 如果在 $a 中找到\n# 则打印找到匹配项\nif ($a =~ m[PEEKS]) {\n   \
    \ print \"Match is Found\\n\";\n}\n# 如果在 $a 中未找到\n# 则打印未找到匹配项\nelse {\n    print\
    \ \"Match is Not Found\\n\";\n}\n```\n\n**程序 2：** 为了演示 `m//` 和 `!~` 的用法，请考虑以下：\n\
    ```perl\n# 演示程序\n# m// 和 !~ 运算符\n# 实际字符串\n$a = \"PEEKSFORPEEKS\";\n# 如果在 $a 中未找到\n\
    # 则打印找到匹配项\nif ($a !~ m[PEEKS]) {\n    print \"Match is Found\\n\";\n}\n# 如果在\
    \ $a 中找到\n# 则打印未找到匹配项\nelse {\n    print \"Match is Not Found\\n\";\n}\n```\n\n\
    ### 正则表达式的用途：\n\n* 它可以用于计算特定模式在字符串中出现的次数。\n* 它可以查找匹配特定模式的字符串。\n* 它还可以将搜索到的模式替换为另一个字符串。\n\
    \n## 正则表达式中的运算符\n\n正则表达式是一个不同字符的混合字符串，有助于文本字符串匹配。`regex` 或 `regexp` 是正则表达式的另一个名称。\n\
    \n利用正则表达式最基本的方法是使用绑定运算符 `=~`（正则表达式运算符）和 `!~`（非正则表达式运算符）。\n\n在 Perl 中，三种类型的正则表达式运算符：\n\
    \n* 匹配正则表达式\n* 替换正则表达式\n* 全局字符转译正则表达式\n\n### 1. 模式匹配或正则表达式匹配：\n匹配运算符 `m//` 将字符串或语句与正则表达式进行比较。运算符中的正斜杠充分隔符。表达式写在运算符的两个斜杠之间。\n\
    语法：`m/PATTERN/`\n`PATTERN` 是将搜索的正则表达式。让我们来看一些模式匹配的示例。在以下情况下，字符串和正则表达式进行匹配，如果成功，则返回“match\
    \ found”；否则，返回“match not found”。在前面的代码中，使用了另一种分隔符 `{}` 替换了 `/`。\n\n### 2. 制作替换（搜索并替换）正则表达式：\n\
    替换运算符 `s///` 用于搜索并替换特定的单词。分隔符是正斜杠。\n语法：`s/PATTERN/REPLACEMENT/`\n`PATTERN` 是 `REPLACEMENT`\
    \ 正则表达式将替换的正则表达式。让我们来看几个实例：先搜索 `PATTERN` 单词，跟随 `REPLACEMENT` 单词。\n\n### 3. 全局字符转译正则表达式：\n\
    将所有实例替换为单个字符，使用转译运算符 `tr///` 或 `y///`。分隔符是正斜杠。\n\n## 正则字符类\n\n为了匹配字符串，使用了字符类。这些类允许用户匹配预先的字符范围。要匹配的字符集始终包含在方括号\
    \ `[]` 中。字符类总是完美匹配一个字符。\n\n如果没有检测到匹配，整个正则表达式将失败。\n\n### 注意事项：\n\n* 在字符类内部，`.`\
    \ 失去了它特定的含义，即“除换行符的所有内容”。\n* 仅在字符类内部，`.` 可以匹配单个点。\n* 大多数特殊字符在字符类中失去了它们的特殊意义；但某些字符获得了一些特殊含义。\n\
    \n### 字符类中的范围：\n输入长列表很困难，因为用户可能会跳过一个两个字符。所以，为了方便，我们使用范围。破折号 `-` 通常表示范围。\n\n###\
    \ 注意事项：\n\n* `-(破折号)` 用于指定范围。\n* 用户还可以混合各种范围的字符、数字等，例如 `[0-9a-gA-g]`。在这里，`-` 允许用户选择范围内的任何字符或数字。\n\
    * 如果用户想在字符串中匹配破折号 `-`，只需将其插入方括号 `[]` 之间即可。\n\n"
- fmt: "\n- To match a closing square bracket in a string, just precede it with `\\\
    ` i.e. `\\]` and place it between the square brackets `[]`.\n\nNegated character\
    \ class: Simply use the caret (`^`) symbol to negate a character class. It will\
    \ negate the character supplied following the symbol or even a range. Using caret\
    \ (`^`) as the first character in a character class signifies that the character\
    \ class can match any character except those listed in the character class.\n\n\
    ## SPECIAL CHARACTER CLASSES IN REGULAR EXPRESSIONS\n\nPerl has several distinct\
    \ character classes, some of which are used so frequently that a specific sequence\
    \ is built for them. Writing a custom sequence aims to make the code more understandable\
    \ and concise. Perl’s special character classes are as follows:\n\n1. **Digit\
    \ `\\d[0-9]`:** The `d` character is used to match any digit character and is\
    \ identical to `[0-9]`. A single digit will be matched by the regex `/\\d/`. The\
    \ `d` has been standardized to “digit.” The key advantage is that the user may\
    \ write in a shorter form that is easier to read. This unique character class\
    \ can be used in two ways. Let’s look at example to understand how to match the\
    \ character string.\n\n    The character, as mentioned earlier, the string will\
    \ match as follows:#M-12345 #N-66666\n\n    We may also utilize quantifiers in\
    \ this case by placing them on the character class.\n\n    The above example is\
    \ identical to the previous regex in that it accepts any number of digits following\
    \ the dash and may be expressed as `/#[MNOPQ]-\\d+/`.\n\n    In larger character\
    \ classes, the second technique is utilized. The `\\d` is surrounded by square\
    \ brackets and matches a single character digit.\n\n    A single digit or any\
    \ capital letters `A`, `B`, `C`, `D`, `E`, `F`, `G`, `H`, `I`, `J`, `K`, `L`,\
    \ `M`, or `N` can match. It can be written more concisely by using a dash (`-`).\
    \ Then it will be something like: `[\\dA-N]`\n\n2. **PO SIX character classes:**\
    \ PO SIX character classes are the standards for ensuring operating system compatibility\
    \ and establishing the application programming interface (API), including command\
    \ line shells and utility interfaces. It also provides a number of “character\
    \ groupings” with names like (`alpha`, `alnum`, `ascii`, `blank`, etc.). The PO\
    \ SIX character classes are always in the form of `[:class:]`, where `class` is\
    \ the name and the delimiters are `[:` and `:`. POSIX character classes are always\
    \ contained within the bracketed character classes. These classes provide a quick\
    \ and easy method to list a set of characters.\n\n    Here, `class` can be `alpha`,\
    \ `alnum`, `ascii`, and so on.\n\n    As illustrated here, POSIX character classes\
    \ support larger bracketed character classes: `[01[:Class:]%]`\n\n    It will\
    \ match “0,” “1,” any character classes, and the `%` sign in this case. Perl supports\
    \ the following PO SIX character classes, as given in the table below:\n\n   \
    \ | Class | Description |\n    | --- | --- |\n    | Alpha | Any alphabetical character\
    \ (`[A-Za-z]`) |\n    | Alnum | Any alphanumeric character (`[A-Za-z0-9]`) |\n\
    \    | Ascii | Any character in ASCII character set |\n    | blank | A space or\
    \ horizontal tab |\n    | Cntrl | Any control character |\n    | Digit | Any decimal\
    \ digit (`[0-9]`) |\n    | graph | Any printable character, excluding space |\n\
    \    | lower | Any lowercase character (`[a-z]`) |\n    | punct | Any graphical\
    \ character |\n    | space | Any whitespace character |\n    | upper | Any uppercase\
    \ character (`[A-Z]`) |\n    | xdigit | Any hexadecimal digit (`[0-9a-fA-F]`)\
    \ |\n    | word | Perl extension (`[A-Za-z0-9_]`), equivalent to `\\w` |\n\n3.\
    \ **Word character `\\w[0-9a-zA-Z ]`:** The letter `w` belongs to the word character\
    \ class. The `w` character can be any single alphanumeric character, including\
    \ an alphabetic character, a decimal digit, or a punctuation character such as\
    \ underscore (`_`). It will only match single character words, not entire words.\
    \ If we wish to match the entire word, use `\\w+`.\n\n4. **Whitespace `\\s[\\\
    t\\n\\f\\r ]`:** The character class `\\s` will only match one character, a whitespace.\
    \ It will also match the five letters `\\t`-horizontal tab, `\\n`-newline, `\\\
    f`-form feed, `\\r`-carry return, and space. In Perl 5.18, a new character will\
    \ be introduced corresponding to the `\\cK` – vertical tab.\n\n5. **Negated character\
    \ classes `\\D`, `\\W`, `\\S`:** In this universe, there are almost 110, 00 Unicode\
    \ characters. Just use the caret (`^`) sign to negate a character class. It will\
    \ negate the character specified following the symbol or even a range. We utilize\
    \ `[^\\d]` in negated character classes to negate digits 0 through 9\\. However,\
    \ instead of `[^\\d]`, we may just use `\\D` to negate the numbers 0 to 9\\. The\
    \ table below depicts the special negated character classes:\n\n    | Character\
    \ Class | Negated | Meaning | Description |\n    | --- | --- | --- | --- |\n \
    \   | `\\d` | `\\D` | `[^\\d]` | matches to any non-digit character |\n    | `\\\
    s` | `\\S` | `[^\\s]` | matches to any non-whitespace character |\n    | `\\w`\
    \ | `\\W` | `[^\\w]` | matches to any non-“word” character |\n\n6. **Unicode character\
    \ classes:** Unicode is a definition of “all” existing characters, and the Unicode\
    \ Standard assigns a unique number to each platform-independent character. There\
    \ are over 100,000 characters on this planet, and each character is specified\
    \ as a character point. Some of the characters, however, are grouped.\n\n    This\
    \ syntax matches a single character from one of the groupings. If we need to match\
    \ anything other than a specific character, use the matching `\\P{…any character…}`\
    \ expression.\n\n## QUANTIFIERS IN REGULAR EXPRESSION\n\nPerl has several regular\
    \ expression quantifiers that may determine how many times a particular character\
    \ can repeat before it is matched. This is mainly utilized when the number of\
    \ characters to match is uncertain.\n\n### Perl quantifiers are classified into\
    \ six types, which are listed below:\n\n1. `*` = This indicates that the component\
    \ must appear zero or more times.\n2. `+` = This indicates that the component\
    \ must appear one or more times.\n3. `?` = This specifies that the component must\
    \ appear either zero or once.\n4. `{n}` = This specifies that the component must\
    \ be present n times.\n5. `{n,}` = This specifies that the component must appear\
    \ at least n times.\n6. `{n, m}` = This specifies that the component must appear\
    \ at least n times and no more than m.\n\n### Quantifier Table\n\nAll of the above\
    \ kinds may be comprehended using this table, which contains regular expression\
    \ quantifiers and examples.\n\n| Regex | Examples |\n| --- | --- |\n| `/Bx*B/`\
    \ | BB, BxB, BxxB, BxxxB, ….. |\n| `/Bx+B/` | BxB, BxxB, BxxxB, ….. |\n| `/Bx?B/`\
    \ | BB, BxB |\n| `/Bx{1, 3}B/` | BxB, BxxB, BxxxB |\n| `/Bx{2, }B/` | BxxB, BxxxB,\
    \ ….. |\n| `/Bx{4}B/` | BxxxxB |\n\nLet’s look at some examples of these quantifiers.\n\
    \n**First example:** In this example, the `*` quantifier is employed in a regular\
    \ expression `/Pe*ks/`, which yields either “Pks,” “Peks,” “Peeks”...and so on,\
    \ and is matched with the input text “Pks,” yielding “Match Found.”\n\n**Second\
    \ example:** In this example, the `+` quantifier is employed in a regular expression\
    \ `/Pe+ks/`, which yields either “Peks,” “Peeks,” “Peeks”...and so on, and is\
    \ matched with the input text “Pks,” yielding “Match Not Found.”\n\n**Third example:**\
    \ In this example, the `?` quantifier is used in a regular expression `/Pe?ks/`,\
    \ which yields either “Peks” or “Pks,” and is matched with the input text “Peks,”\
    \ yielding “Match is Not Found.”\n\n**Fourth example:** In this example, the `{n}`\
    \ quantifier is employed in a regular expression Pe{2}ks, which yields “Peeks,”\
    \ and is matched with an input text “Peeks,” yielding “Match is Found.”\n\n**Fifth\
    \ example:** In this example, the `{n, }` quantifier is used in a regular expression\
    \ `/Pe{2, }ks/`, which creates “Peeks,” “Peeeks,” “Peeeeks,” and so on, and when\
    \ matched with the input text “Peks,” it returns “Match is Not Found.”\n\n**Sixth\
    \ example:** In this example, the `{n, m}` quantifier is employed in a regular\
    \ expression `/Pe{1, 2}ks/`, which yields “Peks” and “Peeks,” and is matched with\
    \ an input text “Peeks,” yielding “Match is Not Found.”\n"
