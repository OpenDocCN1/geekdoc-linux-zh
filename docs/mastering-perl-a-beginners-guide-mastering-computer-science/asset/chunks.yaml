  trans: "\n变量在 Perl 中用于访问存储在内存的数据（所有数据和函数都存储在内存中）。变量被赋予数据值，这些值随后会在各种操作中使用。Perl 引用允许你通过不同的变量访问相同的数据。在\
    \ Perl 中，引用是一种标量数据类型，它存储另一个变量的位置。其他变量包括标量、哈希表（hashes）、数组、函数名等。嵌套数据结构的构建非常简单，因为用户可以创建一个列表，该列表包含另一个列表的引用，而该列表又包含对数组、标量、哈希等的引用。\n\
    \n### 创建引用\n\n我们可以对标量值、哈希表、数组、函数等创建引用。要创建引用，定义一个新的标量变量，并在变量名（即我们想要引用的变量）前加上一个反斜杠\
    \ `\\`。\n\n创建不同数据类型的引用：\n- 数组引用：定义数组 `@array = (’1’, ’2’, ’3’;);`\n- 为数组变量创建引用\
    \ `$reference_array = \\@array;`\n- 哈希引用：定义哈希表 `%hash = (’1’=>’a’, ’2’=>’b’, ’3’=>’c’);`\n\
    - 为哈希变量创建引用 `$reference_hash = \\%hash;`\n- 标量值引用：定义标量 `$scalar_val = 2431;`\n\
    - 为标量变量创建引用 `$reference_scalar = \\$scalar_val;`\n\n**备注：**\n\n- 键值对周围的花括号 `{}`\
    \ 可用于创建指向匿名哈希的引用。\n- 方括号 `[]` 可创建指向匿名数组的引用。\n- `sub` 也可以用于创建指向匿名子程序的引用。这里的子程序将没有名称。\n\
    - 无法对输入/输出句柄（如 `dirhandle` 或 `FileHandle`）创建引用。\n\n### 解引用（Dereferencing）\n\n\
    现在我们已经创建了引用，我们必须使用它来获取值。解引用是获取引用所指向内存中值的方法。根据变量类型，我们使用前缀 `$`、`@`、`%` 或 `&` 来解引用（引用可以指向数组、标量、哈希等）。\n\
    \n### 引用传递\n\n当变量通过引用传递时，函数对函数的原始数据进行操作。函数可以通过引用传递来更改变量的原始值。\n\n当参数数组 `@_` 中的元素值发生变化时，相应参数的值也会发生变化。这就是引用传递的作用。\n\
    \n在以下示例中，在子程序 `sample` 中更新数组 `@a` 的元素会更改参数的值，这将反映在整个程序中。因此，当引用参数时，在函数中更改它们的值会改变主程序中的值。\n\
    \n程序的运行方式如下：\n\n- 定义了一个值从 0 到 10 的数组。\n- 随后将该数组传递给“sample”子程序。\n- 已经定义了一个名为“sample”的子程序。在该程序内部通过参数数组\
    \ `@_` 更改第一个和第二个参数的值。\n- 调用子程序后，显示数组 `@a` 的值。前两个标量值现在分别更新为 A 和 B。\n\n### PERL\
    \ 递归\n\n递归是一种机制，允许函数反复调用自己，直到满足所需的条件。当函数调用语句写在同一个函数内部时，该函数即是递归的。\n\n传递给函数的参数从默认数组\
    \ `@_` 中检索，每个值都可以通过 `$_[0]`、`$_[1]` 等访问。\n\n**第一个示例**：以下示例计算一个数的阶乘。\n\n程序的运行方式如下：\n\
    \n- 步骤 1：当标量 `a` 的值为 0 或 1 时，函数返回 1，因为 0! 和 1! 都是 1。\n- 步骤 2：如果标量 `a` 的值为 2，则\
    \ `fac(x-1)` 调用 `fac(1)`，后者返回 1。\n  - 结果为 `2*factorial(1) = 2*1 = 2`。\n  - 结果为它将返回\
    \ 2。\n- 步骤 3：同样，当向函数传递更高的值时，参数值每次调用减 1，一直计算到值达到 1。\n\n**第二个示例**：以下示例计算到指定数的斐波那契数列。\n\
    \n程序的工作原理如下：\n\n- 步骤 1：调用带有三个参数的 `fib()`，前两个是 0 和 1，而 `$n` 是要打印数列的数字。\n- 步骤 2：这些值以数组的形式传输，使用\
    \ `shift` 检索其内容。\n- 步骤 3：对于每次调用，使用 `shift` 获取前两个值并存储在标量 `c` 和 `d` 中。这两个值现在相加以产生数列中的下一个值。重复此步骤，直到值达到用户指定的结束值。\n\
    \n在本章中，我们涵盖了 Perl 中的子程序，讨论了函数签名、向子程序传递复杂参数，以及可变和不可变参数。此外，我们还讨论了多个子程序的使用、`return()`\
    \ 函数的用法、引用传递和递归。\n\n# 评价\n\nPerl 是一种在商业和私有计算行业中广泛使用的跨平台开源编程语言。在 20 世纪末和 21 世纪初，Perl\
    \ 曾备受 Web 开发者的青睐，因为它具有适应性强的文本处理和问题解决能力。\n\n美国程序员兼语言学家拉里·沃尔（Larry Wall）于 1987 年\
    \ 12 月首次为基于 Unix 的计算机发布了 Perl 1.0。这个早期版本的 Perl 是一种直观、易于编码的语言，用于读取、提取和打印文本文件中的信息；它还能执行其他系统管理任务。Perl\
    \ 通常被认为代表“实用提取和报告语言”（Practical Extraction and Report Language），它的灵感源自现有的编程语言，如\
    \ C、BASIC 和 AWK，但它对常用英语术语的使用反映了沃尔的语言背景。\n\nPerl 是一种为脚本操作设计的编程语言。然而，现在 Perl 用于广泛领域，包括\
    \ Web 开发、图形用户界面（GUI）开发、系统管理等等。它是一种可靠且跨平台的编程语言。\n\nPerl CGI 用于 Web 开发。CGI 是与网络浏览器和\
    \ Perl 通信的系统网关。\n\n它最常见的应用是从文本文件中提取信息并打印报告，将文本文件转换为另一种格式。这是因为它的名称源自“实用提取和报告语言”。\n\
    \nPerl 脚本是用 Perl 编写的程序，而 Perl 程序是执行 Perl 脚本的系统程序。Perl 是一种脚本语言。当我们运行 Perl 程序时，它首先被编译成字节码，然后转换为机器指令。用\
    \ Perl 而不是 C 写程序可以节省时间。\n\n它与大多数操作系统兼容，并被收录于《津英语词典》。它从多种语言中借用了概念和语法，包括 AWK、bourne\
    \ shell、C、sed 甚至是英语。\n\n## PERL 历史\n\n拉里·沃尔于 1987 年创建了 Perl，作为一种脚本语言来帮助处理报告。\n\
    \n1987 年 12 月 18 日，发布了 1.0 版本。\n\n- Perl 2 于 1988 年发布，它包含了一个改进巨大的正则表达式引擎。\n- Perl\
    \ 3 于 1989 年发布，它包含了对二进制数据流的支持。\n- Perl 4 于 1991 年发布，比之前的版本具有更好的文档。\n- 1994 年 10\
    \ 月 17 日，发布了 Perl 5。其最新版本包含了许多新功能，如对象、变量、引用和模块。\n- 最新的版本 5.24 于 2016 年 5 月 9 日发布。\n\
    \n## PERL 特性\n\n- 它具有直观的面向对象语法。\n- 由于支持 25000 个开源模块，它能够轻松扩展。\n- 支持 Unicode。\n"
- fmt: "\nIt includes powerful tools for processing text to make it compatible with\
    \ mark-up languages, such as `HTML` and `XML`.\n\nIt supports third-party databases,\
    \ such as `Oracle` and `MySQL`.\n\nIt can embed in other systems like web servers\
    \ and database servers.\n\nIt is GNU-licensed open-source software.\n\n`Perl`\
    \ is used to write many frameworks.\n\nIt is capable of processing encrypted web\
    \ data, including e-commerce transactions.\n\nIt is a platform-independent language.\n\
    \nIt includes a regular expression engine that can transform any type of text.\n\
    \n## LICENSING FOR PERL\n\nLarry Wall owns the copyright (C) to `Perl 5`. It is\
    \ free and open-source software. It may be redistributed or modified under the\
    \ terms of the `GNU` and `Artistic Licenses`.\n\nThe `GNU General Public License`\
    \ offers its users free and open-source software. Any program derived from GNU-licensed\
    \ source code must use the same license.\n\nAccording to the `Artistic license`,\
    \ a package derived from `Perl` must clearly highlight its modifications. The\
    \ original module, as well as the derived one, should be distributed. Above all,\
    \ the original author must be acknowledged as the package’s owner. Users should\
    \ able to distinguish between original and derived modules.\n\n## PERL AND THE\
    \ WEB\n\nBecause of its text manipulation capabilities and quick development cycle,\
    \ `Perl` was once the most popular web programming language.\n\n`Perl` is commonly\
    \ referred to as “the duct tape of the Internet.”\n\n`Perl` is capable of processing\
    \ encrypted Web data, including e-commerce transactions.\n\n`Perl` can be embedded\
    \ in web servers to speed up processing by up to 2000%. \n\nThe `Perl` module\
    \ `mod Perl` enables the `Apache` web server to include a `Perl interpreter`.\n\
    \n`Perl`’s `DBI` package simplifies web-database integration.\n\n## PERL IS INTERPRETED\n\
    \nBecause `Perl` is an interpreted language, our code can run without being compiled\
    \ into a non-portable executable program.\n\nTraditional compilers translate programs\
    \ into machine code. When you run a `Perl` program, it is first compiled into\
    \ byte code, which is then converted into machine instructions (as the program\
    \ runs). As a result, it differs from shells or `Tcl`, which are strictly interpreted\
    \ without an intermediate representation.\n\nIt’s also unlike most `C` or `C++`\
    \ versions, which are compiled directly into machine-dependent formats. It is\
    \ in the middle, alongside `Python`, `AWK`, and `Emacs`. `.elc` files.\n\n## ADVANTAGES\n\
    \n`Perl` has the following advantages:\n\n* **Options:** `Perl` users have numerous\
    \ options for writing programs or solving problems.\n* **Flexible:** The language’s\
    \ design and syntax allow users to code in their preferred programming style.\n\
    * **Open source:** It’s free to use. Anyone can access, develop, and use `Perl`\
    \ on various platforms for free.\n* **Availability:** It comes pre-installed in\
    \ many places, and the `Comprehensive Perl Archive Network` contains over 25,000\
    \ `Perl` modules. The majority of operating systems also support it.\n\n## DISADVANTAGES\n\
    \nThe main disadvantage of `Perl` is that it is a relatively messy language in\
    \ a variety of ways:\n\n* **Hard to read:** It’s difficult to read. According\
    \ to some developers, `Perl` is more difficult to read and less streamlined than\
    \ newer languages such as `Python`. Because of the numerous ways to write a `Perl`\
    \ program, the code can become disorganized and untidy.\n* **Difficult to debug:**\
    \ Debugging and fixing problems can be difficult because `Perl` code can be obscure\
    \ or messy.\n* **Flaws in performance:** The same flexibility that makes `Perl`\
    \ useful can also make it slow. This is because flexibility can lead to inefficiencies\
    \ and redundancy, making compilation time longer.\n\n## PERL VS PYTHON\n\n`Perl`\
    \ and `Python` have a common ancestor. Both were created to make scripting easier.\
    \ `Perl` was created to give `Unix` scripts a `C-like` structure. `Python` was\
    \ created to make `C` easier to use and ready for scripting.\n\nSyntactically,\
    \ `Perl` and `Python` are very similar, and translating from `Perl` to `Python`\
    \ is relatively simple with only a few significant syntax changes.\n\nHowever,\
    \ there are four significant differences:\n\n* A semicolon terminates lines in\
    \ `Perl`.\n* Python- lacks curly braces and indentation, whereas `Perl` does.\n\
    * Variable names in `Perl` are styled with variables, such as `$x`, `% x`, and\
    \ `x`. In `Python`, variable names are styled without a variable indicator, such\
    \ as `x`.\n* In `Python`, the `print` statement inserts a new line at the end\
    \ of the output.\n\nOther differences include:\n\n* `Perl` can be messy, whereas\
    \ `Python` is more streamlined.\n* In `Perl`, numerous ways exist to accomplish\
    \ a task, whereas `Python` is designed to provide a single clear path to any given\
    \ function.\n* `Python` is more readable than `Perl`.\n* `Python` is commonly\
    \ considered one of the best languages to learn.\n* `Python` is a newer language\
    \ than `Perl`.\n* `Perl` is integrated into the source code.\n* `Python` is a\
    \ powerful programming language because of its reputation as dynamic language.\n\
    * `Python` has more support in the open-source developer community.\n\n| Perl\
    \ | Python |\n| --- | --- |\n| It is a high-level, interpreter-based, dynamic\
    \ programming language. | It is high-level, general-purpose language with interpreter.\
    \ |\n| Perl can download for Unix/Linux, macOS, or Windows from `https://www.perl.org/get.html`.\
    \ | Python can download for Unix/Linux, macOS, Windows, and other systems from\
    \ `https://www.python.org/downloads/`. |\n| Perl’s goal was to simplify the report\
    \ creation, which later underwent many changes and revisions. | Python aimed to\
    \ make writing simple and logical code for small and large projects and applications\
    \ more accessible. |\n| When compared to Python code, Perl code is not as simple.\
    \ | Python code is more straightforward and more understandable. |\n| Perl has\
    \ outstanding library support and can handle operations at the OS level using\
    \ built-in functions. | To handle such operations, Python requires the assistance\
    \ of third-party libraries. |\n| The OOP support available is limited. | Python\
    \ provides excellent support for object-oriented programming. |\n| Braces are\
    \ used to mark and identify code blocks. | Indentation is used to mark and identify\
    \ code blocks. |\n| Whitespaces are not crucial in `Perl`. | Whitespaces are significant\
    \ in `Python` and can cause syntax errors. |\n| It facilitates text processing\
    \ because `Perl` includes support for Regular expressions. | To handle Regular\
    \ expressions, Python requires the use of external functions. |\n| To end a code\
    \ line in `Perl`, use a semicolon(;). | At the end of each code line, semicolons\
    \ (`;`) are not required. |\n| The file extension for `Perl` is `.pl`. | Python\
    \ files have the extension `.py`. |\n\n## PERL VS JAVA\n\nLarry Wall invented\
    \ `Perl` in 1987.\\Perl` supports both object-oriented and procedural programming.\
    \ It is similar to `C` and `C++`. `Perl` was initially designed to process text.\n\
    \n`Java` is a well-known programming language. `Java` is both a programming language\
    \ and a computer platform. Sun Microsystems published `Java` in 1995, on the initiative\
    \ of James Gosling. Oracle claims that `java` is used on 3 billion devices worldwide.\
    \ It is designed to allow developers to WRITE ONCE, RUN ANYWHERE, which means\
    \ that a Java application may be produced on one platform and executed on any\
    \ other platform that supports the `JVM`.\n\nThe following are some critical distinctions\
    \ between Perl and Java:\n\n| Feature | Perl | Java |\n| --- | --- | --- |\n"
  raw: 'It includes powerful tools for processing text to make it compatible with
    mark-up languages, such as HTML and XML.


    It supports third-party databases, such as Oracle and MySQL.


    It can embed in other systems like web servers and database servers.


    It is GNU-licensed open-source software.


    Perl is used to write many frameworks.


    It is capable of processing encrypted web data, including e-commerce transactions.


    It is a platform-independent language.


    It includes a regular expression engine that can transform any type of text.


    ## LICENSING FOR PERL


    Larry Wall owns the copyright (C) to Perl 5\. It is free and open-source software.
    It may be redistributed or modified under the terms of the GNU and Artistic Licenses.


    The GNU General Public License offers its users free and open-source software.
    Any program derived from GNU-licensed source code must use the same license.


    According to the Artistic license, a package derived from Perl must clearly highlight
    its modifications. The original module, as well as the derived one, should be
    distributed. Above all, the original author must be acknowledged as the package’s
    owner. Users should able to distinguish between original and derived modules.


    ## PERL AND THE WEB


    Because of its text manipulation capabilities and quick development cycle, Perl
    was once the most popular web programming language.


    Perl is commonly referred to as “the duct tape of the Internet.”


    Perl is capable of processing encrypted Web data, including e-commerce transactions.


    Perl can be embedded in web servers to speed up processing by up to 2000%.


    The Perl module mod Perl enables the Apache web server to include a Perl interpreter.


    Perl’s DBI package simplifies web-database integration.


    ## PERL IS INTERPRETED


    Because Perl is an interpreted language, our code can run without being compiled
    into a non-portable executable program.


    Traditional compilers translate programs into machine code. When you run a Perl
    program, it is first compiled into byte code, which is then converted into machine
    instructions (as the program runs). As a result, it differs from shells or Tcl,
    which are strictly interpreted without an intermediate representation.


    It’s also unlike most C or C++ versions, which are compiled directly into machine-dependent
    formats. It is in the middle, alongside Python, AWK, and Emacs. elc files.


    ## ADVANTAGES


    Perl has the following advantages:


    *   **Options:** Perl users have numerous options for writing programs or solving
    problems.


    *   **Flexible:** The language’s design and syntax allow users to code in their
    preferred programming style.


    *   **Open source:** It’s free to use. Anyone can access, develop, and use Perl
    on various platforms for free.


    *   **Availability:** It comes pre-installed in many places, and the Comprehensive
    Perl Archive Network contains over 25,000 Perl modules. The majority of operating
    systems also support it.


    ## DISADVANTAGES


    The main disadvantage of Perl is that it is a relatively messy language in a variety
    of ways:


    *   **Hard to read:** It’s difficult to read. According to some developers, Perl
    is more difficult to read and less streamlined than newer languages such as Python.
    Because of the numerous ways to write a Perl program, the code can become disorganized
    and untidy.


    *   **Difficult to debug:** Debugging and fixing problems can be difficult because
    Perl code can be obscure or messy.


    *   **Flaws in performance:** The same flexibility that makes Perl useful can
    also make it slow. This is because flexibility can lead to inefficiencies and
    redundancy, making compilation time longer.


    ## PERL VS PYTHON


    Perl and Python have a common ancestor. Both were created to make scripting easier.
    Perl was created to give Unix scripts a C-like structure. Python was created to
    make C easier to use and ready for scripting.


    Syntactically, Perl and Python are very similar, and translating from Perl to
    Python is relatively simple with only a few significant syntax changes.


    **However, there are four significant differences:**


    *   A semicolon terminates lines in Perl.


    *   Python lacks curly braces and indentation, whereas Perl does.


    *   Variable names in Perl are styled with variables, such as $x, % x, and x.
    In Python, variable names are styled without a variable indicator, such as x.


    *   In Python, the print statement inserts a new line at the end of the output.


    **Other differences include:**


    *   Perl can be messy, whereas Python is more streamlined.


    *   In Perl, numerous ways exist to accomplish a task, whereas Python is designed
    to provide a single clear path to any given function.


    *   Python is more readable than Perl.


    *   Python is commonly considered one of the best programming languages to learn
    and one of the most user-friendly for new developers.


    *   Python is a newer programming language than Perl.


    *   Perl is integrated into the source code of a web application.


    *   Python is a powerful programming language because of its reputation as a dynamic
    programming language with various applications ranging from web development to
    machine learning.


    *   Python has more support in the open-source developer community.


    | Perl | Python |


    | --- | --- |


    | It is a high-level, interpreter-based, dynamic programming language. | It is
    a high-level, general-purpose language of programming with an interpreter. |


    | Perl can download for Unix/Linux, macOS, or Windows from [https://www.perl.org/get.html](https://www.perl.org).
    | Python can download for Unix/Linux, macOS, Windows, and other operating systems
    from [https://www.python.org/downloads/](https://www.python.org). |


    | Perl’s goal was to simplify the report creation process, which later underwent
    many changes and revisions to include many new features and capabilities. | Python
    aimed to make writing simple and logical code for small and large projects and
    applications more accessible. |


    | When compared to Python code, Perl code is not as simple. | Python code is more
    straightforward and more understandable. |


    | Perl has outstanding library support and can handle operations at the OS level
    using built-in functions. | To handle such operations, Python requires the assistance
    of third-party libraries. |


    | The OOP support available is limited. | Python provides excellent support for
    object-oriented programming. |


    | Braces are used to mark and identify code blocks. | Indentation is used to mark
    and identify code blocks. |


    | Whitespaces are not crucial in Perl. | Whitespaces are significant in Python
    and can cause syntax errors. |


    | It facilitates text processing because Perl includes support for Regular expressions.
    | To handle Regular expressions, Python requires the use of external functions.
    |


    | To end a code line in Perl, use a semicolon(;). | At the end of each code line,
    semicolons (;) are not required. |


    | The file extension for Perl is .pl. | Python files have the extension. py. |


    ## PERL VS JAVA


    Larry Wall invented Perl in 1987\. Perl supports both object-oriented and procedural
    programming. It is similar to C and C++. Perl was initially designed to process
    text.


    Java is a well-known programming language. Java is both a programming language
    and a computer platform. Sun Microsystems published Java in 1995, on the initiative
    of James Gosling. Oracle claims that java is used on 3 billion devices worldwide.
    It is designed to allow developers to WRITE ONCE, RUN ANYWHERE, which means that
    a Java application may be produced on one platform and executed on any other platform
    that supports the JVM.


    The following are some critical distinctions between Perl and Java:


    | Feature | Perl | Java |


    | --- | --- | --- |'
