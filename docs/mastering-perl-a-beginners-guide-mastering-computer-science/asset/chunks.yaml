    \        print \"Our guess was too high,\";\n            print \" guess a lower\
    \ number than ${userinput}\\n\";\n        }\n        # Number of the chances given\n\
    \        # to user increases by one\n        $n++;\n    } else {\n        $chances--;\n\
    \    }\n}\n# Check whether the user\n# guessed correct number\nif($correct ==\
    \ 1) {\n    print \"We Guessed Correct!\";\n    print \" Number was $x\";\n} else\
    \ {\n    print \"It was actually ${x}.\";\n}\n```\n\nNote: In the above program,\
    \ the user can change the value of the `rand` function to increase the range of\
    \ numbers in this game and the number of chances by changing the value of the\
    \ `chance` variable.\n\n## DATABASE MANAGEMENT USING DBI\n\nOne of the most prevalent\
    \ applications of Perl is creating database apps. We can construct complex web\
    \ apps with a database to handle all the data using Perl. It offers great interface\
    \ support and a wide variety of database formats. Perl includes a module named\
    \ `DBI` for connecting to and accessing a database. `DBI` is a database interface\
    \ connecting with structured query language (SQL)-based database servers.\n\n\
    Generally, Perl requires two steps to access a database. The `DBI` module offers\
    \ a database access API. `DBI` functions are used by software to modify a database.\
    \ A database driver (`DBD`) module serves as the second step in Perl database\
    \ access. Each unique database management system needs its own driver. This method\
    \ enables a Perl database application software to be largely independent of the\
