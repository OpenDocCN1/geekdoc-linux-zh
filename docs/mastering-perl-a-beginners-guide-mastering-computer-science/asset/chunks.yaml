  trans: '

    Perl 由 Larry Wall 于 1987 年创建。虽然“Practical Extraction and Reporting Language”（实用提取和报告语言）是最常见的扩展含义，但
    Perl 并没有官方的全称。一些程序员将 Perl 称为“病态杂烩的垃圾列表器”（Pathologically Eclectic Rubbish Lister）和“实际上所有喜人的事物”（Practically
    Everything Likable）。缩写“Practical Extraction and Reporting Language”经常被使用，因为 Perl
    最初设计用于文本处理，例如从特定的文本文件中提取必要信息并将文本文件转换为新格式。Perl 同时支持过程化编程和面向对象编程。


    Perl 在语法上与 C 相似，使得 C 和 C++ 程序员可以轻松上手。


    ## Perl 的演变


    这一切始于 Larry Wall 被要求从几个包含交叉引用的文本文件中生成报告。当时他开始使用 `awk` 来这项工作，但很快发现它并不够用。他没有为此设计一个工具，而是创建了一种新的编程语言
    Perl 及其解释器。他用 `C` 构建了 Perl 编程语言，并借鉴了 `awk`、`sed` 和 `LISP` 等原理。Perl 最初仅设计用于系统管理和文本处理，但随后的版本包含了管理正则表达式（`Regex`）和网络套字字。目前，Perl
    以其处理 `Regex` 的能力而闻名。Perl 的第一个版本是 1987 年 12 月 18 日的 1.0 版本。`5.28` 是 Perl 的最新版本。Perl
    6 与 Perl 5 不同，因为它是 Perl 5 的完全面向对象化的重新实现版本。


    ## 为什么选择 Perl？


    Perl 的流行和需求源于多种因素。原因如下：


    * Perl 是一门高级语言；因此它与 `C` 和 `C++` 等其他流行编程语言相似，任何人都可以轻松学习。

    * 文本处理：正如名称“实用提取和报告语言”所示，Perl 具有强大的文本操作能力，能够轻松地从各种文本文件中创建报告。此外，它还可以将文件转换为不同的格式。

    * Perl 整合了其他语言中最优秀的特性，例如 `C`、`sed`、`awk` 和 `sh`，使这种语言更有用且高效。

    * 系统管理：Perl 使用多种脚本语言的能力使得系统管理变得简单。与其依赖多种语言，不如利用 Perl 完成所有系统管理任务。尽管如此，Perl 也用于
    Web 开发、Web 自动化图形用户界面（`GUI`）编程等。

    * Web 与 Perl：Perl 可以集成到 Web 服务器中以提高其处理能力，`DBI` 模块使得 Web 与数据库的交互变得简单。


    ### 开始学习 Perl 编程：


    * 定解释器：可以使用许多在线集成开发环境（IDE）在无需安装的情况下执行 Perl 程序。

    * Windows：有许多 IDE 可以执行 Perl 或脚本，包括 `Padre` 和带有 `EPIC` 插件的 `Eclipse`。


    ## Perl 特性


    * 下列出的功能在 Perl 中存在，并已被其他编程和脚本语言广泛采用。

    * Perl 的大部分功能（包括变量、表达式、语句、控制结构和子程序）都源自 `C`。

    * 它还利用 shell 脚本工具来检测数据类型。

    * Perl 提供了 shell 编程中常用的内置函数，例如 `sort` 和 `system` 功能，这些功能可以使用前导符号（sigils）表示，例如数组、标量和哈希表。

    * 此外，Perl 5 支持复杂的数据结构和面向对象的编程风格，包括包（packages）、引用和编译器指令。

    * 解释器知道每种数据类型的存储和内存需求，并在所有 Perl 版本中根据使用分配和释放内存。

    * 它在执行期间还会进行类型转换，例如将整数转换为字符串，其他无效的转换会导致错误的抛出。

    * Perl 不强制或推崇任何特定的编程风格，如过程化、面向对象或函数式；解释器及其函数构成了该语言的唯一定义。

    * Perl 拥有 API（文本处理设施），帮助处理 `XML`、`HTML` 和其他标记语言。

    * Perl 提供了最高级别的安全性，甚至被第三方安全公司 `Coverity` 认证为具有低缺陷密度和较少安全问题。

    * Perl 是可扩展的，并包含了处理 `XML` 和数据库集成（`DI`）的库，例如 `Oracle` 和 `MySQL`。


    ## Perl 应用


    Perl 与超文本处理器（`PHP`）和 `Python` 一起是开发者中流行的编程语言。以前，程序员使用 Perl 编写通用网接口（`CGI`）脚本。Perl
    经常用作异构和无缝互操作系统之间的部门粘合剂。系统管理员非常喜欢这种语言，因为他们只需要输入命令即可完成原本需要编写程序的任务。Perl 主要具有可移植性，并针对
    `Windows` 和 `macOS` 有特定的定制。


    此外，开发者使用该语言进行构建和部署。大多数供应商或软件制造商使用它来打包和部署商业软件（包括 `COTS` 和定制软件）。由于其管理和处理大型数据集的能力，它在金融和生物信息学领域被广泛利用。


    ## Perl 实现


    如，Perl 是一种用 `C` 编写的解释型语言，拥有用 `C` 和 `Perl` 编写的大量模块库。Perl 解释器由 150,000 行 `C` 代码组成，在大多数系统架构上编译为
    1 MB。Perl 分发版中几乎有 500 个模块，包括 300,000 行 `Perl` 代码和 200,000 行 `C` 代码。Perl 的组件（`arrays`、`scalars`
    和 `hashes`）在解释器的面向对象设计内部被表示为 `C` 结构。


    解释器的生命周期包括两个阶段：编译和执行。解释器在构建时将 Perl 代码解析为语法树。在运行时通过遍历树来执行 Perl 程序。Perl 编程语言以开源形式提供，带有
    120,000 个功能测试；解释器和其他功能模块在编译过程中经过了严格测试。如果这 12 万个功能测试通过，就可以安全地假设你的代码不会损坏解释器。


    ## 用 Perl 编程


    Perl 在语法上与其他常见的编程语言相似，易于编写和理解。Perl 程序可以在任何最流行的文本编辑器中编写，包括 `Notepad++` 和 `gedit`。创建程序后，用
    `.pl` 或 `.PL` 扩展名保存文件。在命令行上输入 `Perl file name.pl` 即可执行程序。


    ### 注释


    注释用于提高代码的可读性。解释器忽略注释项且不执行。注释可以是单行的也可以是多行的。


    * 单行注释

    * 多行注释


    在上面的示例中：


    1. **print:** 这是一个 Perl 函数，用于在控制台上显示结果或任何提供的输出。

    2. **引号：** 在 Perl 中，我们可以使用单引号或双引号（`''''` 或 `""`）。单引号不插值变量或特殊字符，但双引号会。

    3. **\n:** 它用于换行符，通过反斜杠（`\`）转义任何字符。

    4. **/usr/bin/Perl:** 这是原始的 Perl 解释器二进制文件，始终以 `#!` 开头。这用于 Perl 脚本模式编程。

    5. 因为 Perl 是一种大小敏感的计算机语言，所以 `$Geeks` 和 `$geeks` 是不同的标识符。


    ### Perl 的优点


