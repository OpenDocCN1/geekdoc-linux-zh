    Perl 函数或子程序是执行特定任务的语句集合。每种编程语言的用户都希望重用代码。因此，用户会将代码段放在函数或子程序中，以避免重复编写代码。我们将重点介绍以下概念：


    -   将哈希（Hashes）传递给子程序。

    -   将列表（Lists）传递给子程序。

    -   从子程序的局部和全局变量返回结果。

    -   子程序调用中的变数量参数。


    ### 将哈希传递给子程序

    哈希也可以传递给子程序，子程序将其转换为键值对。


    ### 将列表传递给子程序

    由于 `@_` 是函数或子程序内部的特殊数组变量，它被用于将列表传递给子程序。Perl 对数组和列表的解析方式不同，这使得从 `@_` 中提取独立元素变得困难。为了与其他标量参数一起传递列表，必须将列表作为最后一个参数。


    ### 从子程序返回结果

    子程序与其他任何编程语言一样，可以返回值。如果用户没有手动从子程序返回结果，子程序将自动返回一个值。在这种情况下，自动返回的值是子程序中执行的最后一个计算的结果。该结果可以是标量、数组或哈希。


    ### 子程序中的局部和全局变量

    默认情况下，Perl 程序中的所有变量都是全局变量。然而，使用 `my` 关键字，可以在块内创建局部或私有变量。私有变量的作用范围有限，例如在块（`if`,
    `while`, `for`, `foreach` 等）和方法之间。这些变量不能在块或方法之外使用。


    ### 子程序调用中的数量数量

    Perl 没有包含任何用于声明子程序参数的内置机制，这使得向函数传递任意数量的参数变得非常简单。


    通常情况下，将多个数组或哈希作为参数传递给子程序会导致它们丢失其独立标识性。同样，从子程序返回多个数组或哈希也会导致它们独立标识的丢失。我们可以通过使用引用来解决这些问题。


    ## PERL 中的函数签名

    Perl 函数或子程序是执行特定任务的语句集合。每种编程语言的用户都希望重用代码。因此，用户会将代码段放在函数或子程序中，以避免重复编写代码。虽然在 Perl
    中函数（function）、子程序（subroutine）和方法（method）这些术语是可以通用的，但在其他编程语言中并非如此。因为它是使用关键字 `sub`
    创建的，所以在 Perl 编程中通常使用子程序一词。当调用函数时，Perl 会停止执行整个程序并跳转到函数处执行，然后再返回到之前运行的代码段。可以避免使用
    `return` 语句。


    ### 定义子程序

    在 Perl 中，定义子程序的通用形式如下：`sub subroutinename { # 方法或子程序的体 }`


    ### 函数签名

    在构建函数时，注意：具有定义签名的子程序或函数只能接受与其签名指定类型相同的参数。如果提供的过程输入与其签名不匹配，将发生错误。函数签名揭示了大量关于子程序类型的信息。它允许用户创建同名但签名不同的子程序，即不同的参数。在
    Perl 中，不同的子程序可以有相同的名称，但它们的参数必须不同。


    在上面的代码中，子程序的名称是相同的，但它们的参数数量是不同的；因此，它们不会被视为不同的子程序，我们的 Perl 代码不会报错。


    ### 传递与签名指定类型不同的参数

    当使用签名定义子程序时，它必须接收与其签名相同类型的参数。如果给了一个与函数签名不同的参数，将生成错误，导致代码编译失败。


    如果我们传递一个与函数签名类型不同的参数，将生成以下错误：

    ```perl

    #!/usr/bin/perl

    # Defining the Function Signature

    sub example(Int $variable) { return $variable / 2; }

    # Function Call with the

    # string type parameter

    print example("66");

    ```


    ### 参数数量的区别

    当定义函数签名时，它还包含了可以传递给函数的参数数量和类型。如果我们用不同数量的参数调用函数，Perl 将抛出错误，因为具有不同签名的函数具有不同的含义。


    函数签名是一个非常有用的特性，但对某些程序员来说可能非常烦人，因为它限制了函数只能用于特定类型的参数。如果在没有签名的情况下定义函数，则对传递给函数的参数类型没有限制。


    上面的代码声明了一个没有特定参数类型的函数，因此当一个整数值作为字符串传递给它时，它会自动将参数转换为整数形式并返回结果。然而，如果我们使用字符串参数调用函数，且对其执行的操作需要整数值，我们将得到以下错误：

    ```perl

    #!/usr/bin/perl

    # Defining Function-Signature

    sub example($variable) { return $variable / 2; }

    # Function Call with the

    # string type argument

    print example("Peeks");

    ```


    ## 向子程序传递复杂参数

    Perl 函数或子程序是执行特定任务的语句集合。用户在每种编程语言中都希望重用代码。因此，用户会将代码段放在函数或子程序中，以避免重复编写相同的代码。结果，函数或子程序被用于所有编程语言。这些函数或子程序可以接受各种数据结构作为参数。其中一些在下文中进一步讨论：


    - 将列表或数组传递给子程序

    - 将引用传递给子程序

    - 将文件句柄传递给子程序

    - 将哈希传递给子程序


    向子程序传递数组或列表：数组或列表可以作为参数传递给子程序，并使用数组变量 `@_` 来接收子程序或函数内部的列表值。


    **第一个示例**：将单个列表传递给子程序，并显示其元素。


    **第二个示例**：在这种情况下，将两个列表传递给子程序，并显示它们的内容。


    **第三个示例**：将一个标量参数和一个列表传递给子程序，并显示列表元素。


    向子程序传递引用：引用也可以作为参数传递给子程序。数组引用被传递给子程序，并返回数组元素的最大值。


    向子程序传递哈希：哈希也可以作为参数传递给子程序，显示其键值对。


    向子程序传递文件句柄：为了创建文件或访问其内容，需要一个文件句柄（`FileHandle`）。文件句柄只是一个配合操作符使用的结构，用于以特定模式（如读取、写入、追加等）访问文件。文件句柄也可以作为参数传递给子程序，以便对文件进行各种操作。


    在下面的示例中，文件句柄被传递给子程序：


    ## 可变与不可变参数


