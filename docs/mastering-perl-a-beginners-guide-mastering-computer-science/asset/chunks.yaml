    \ LOCK_NB { 4 }` ## 在不进行阻塞的情况下锁定，`sub LOCK_UN { 8 }` ## 解锁 FILEHANDLE\n\n*   **共享锁：**\
    \ 当我们只想读取文件同时允许其他人查看它时，可以使用共享锁。共享锁不仅创建了一个锁，还会检查是否存在额外的锁。此锁不涵盖所有锁的存性检查，仅针对“排斥锁”。如果存在排斥锁，它将等待直到该锁被移除。移除后，它将作为共享锁执行。多个共享锁可以同时存在。\n\
    *   **排斥锁：** 当一个文件要由一组人员使用且每个人都有能力进行更改时，将使用排斥锁。一个文件上只能放置一个排斥锁，一次只允许一个用户/进程进行修改。排斥锁的规则是“我是唯一的”。`flock()`\
    \ 会搜索脚本中是否有任何其他类型的锁。如果发现，它将一直保持，直到所有锁都从脚本中删除为止。它将在适当的时间锁定文件。\n*   **非阻塞锁：** 非阻塞锁通知系统，它不需要等待其他锁从文件中释放。如果在文件中检测到另一个锁，它将产生一条错误消息。\n\
    *   **取消阻塞：** 与 `close(FILE)` 函数相同，此函数会解锁任何给定的文件。\n\n以下问题演示了 `flock()` 函数的使用：\n\
    \n### flock() vs lockf()\n\n与一次性锁定整个文件的 `flock()` 相，`lockf()` 方法锁定文件的片段。`lockf()`\
    \ 无法在 Perl 中直接使用，但 Perl 原生支持 `flock` 系统函数，但不适用于网络锁。\n\nPerl 支持 `fcntl()` 系统函数，提供了卓越的锁定控制。\n\
    \n## SLURP 模块\n\n`File::Slurp` 模块读取文件内容并将其存在字符串中。这是一种读取/写入/修改整个文件的简单快速的方法。正如其名称所暗示，它让我们能够通过单次调用读取或写入整个文件。\n\
    \n通过将此模块导入到我们的程序中，用户可以使用 `read_file`、`read_text`、`write_file` 等函数从文件向文件读写数据。\n\
    \n**安装 File::Slurp 模块：** 我们必须先将此模块包含在 Perl 语言包中以利用它。这可以通过在 Perl 终端中输入以下指令并安装必要的模块来实现。\n\
    \n**步骤 1：** 在我们的终端中运行以下命令：`perl -MCPAN -e shell`\n\n进入 cpan shell 后，按照以下步骤安装 `File::Slurp`\
    \ 模块。\n\n**步骤 2：** 要安装该模块，运行以下命令：`install File::Slurp`\n\n执行后将安装 `File::Slurp`\
    \ 模块。\n\n**步骤 3：** 要退出 cpan> 提示符，输入并执行“q”命令。\n\n**Slurp 中的 read_file 函数：** `File::Slurp`\
    \ 的读取文件函数读取指定文件的完整内容并将其作为字符串返回。然而，建议使用 `File::Slurp`，因为它有一些编码层缺陷，可能会导致编译困难。`File::Slurper`\
    \ 试图为上述困难提供可行的解决方案。\n\n**Slurp 中的 read_text 函数：** `File::Slurper` 中的 `read_text`\
    \ 方法接受一个可选的编码参数（如果有的话），并且在我们请求时可以自动解码 CRLF 行结束符（针对 Windows 文件）。\n\n**注意：** CRLF\
    \ 行结束符表示文本文件中的换行（Windows 换行类型）。\n\n**Slurp 的 write_file 函数：** `File::Slurp` 模块的\
    \ `write_file` 方法用于一次写入多个文件。它使用包含由 `read_file` 函数读取的另一个文件内容的标量变量写入文件。\n\n**第一个示例：**\
    \ 使用标量存储文件内容\n```perl\n# 用于演示 slurp 函数使用的 Perl 代码\nuse File::Slurp;\n# 读取整个文件到标量\n\
    my $content = read_file(’C:\\Users\\PeeksForPeeks\\PFP_Slurp.txt’);\n# 从标量写入整个文件\n\
    write_file(’C:\\Users\\PeeksForPeeks\\Copyof_PFP_Slurp.txt’, $content);\n```\n\
    \n**解释：** 在前面的 Perl 代码中，我们使用 slurp 函数读取一个名为 `PFP_Slurp.txt` 的包含多行文本的文件并存标量变量 `$content`，然后将文件内容作为单个字符串写入另一个文件\
    \ `Copyof_PFP_Slurp.txt`。\n\n**第二个示例：** 使用数组存储文件内容\n```perl\n# 说明 slurp 函数的 perl\
    \ 代码\nuse File::Slurp;\n# 读取整个文件到数组\nmy @lines = read_file(’C:\\Users\\PeeksForPeeks\\\
    PFP_Slurp2.txt’);\n# 从标量写入整个文件（此处原文代码注释有误，应为 array）\nwrite_file(’C:\\Users\\PeeksForPeeks\\\
    Copyof_PFP_Slurp2.txt’, @lines);\n```\n\n**解释：** 在前面的 Perl 代码中，我们使用 slurp 函数读取一个名为\
    \ `PFP_Slurp2.txt` 的包含文本行数组的文件并存入数组变量 `@lines`，然后将整个文件的内容作为单个字符串写入名为 `Copyof_PFP_Slurp2.txt`\
    \ 的文件。\n\n"
- fmt: "\n# Third example: Writing a function that use the slurp technique Perl code\
    \ to illustrate the slurp function\n\n```perl\nuse strict;\nuse warnings;\nuse\
    \ File::Slurp;\n\n# calling user defined function get_a_string();\nsub get_a_string\
    \ {\n    # read entire file into a scalar\n    my $pfp_str = read_file('C:\\Users\\\
    PeeksForPeeks\\PFP_User_Slurp.txt');\n    # write entire file from scalar\n  \
    \  write_file('C:\\Users\\PeeksForPeeks\\Copyof_PFP_User_Slurp.txt', $pfp_str);\n\
    }\n```\n\n### Explanation:\nIn the above Perl code, `strict` and `warnings` allow\
    \ the user to enter code more freely and catch errors such as typos in variable\
    \ names earlier. We invoked a user-defined function named `get_a_string`, which\
    \ then performs the slurp function, which reads a file containing some lines of\
    \ text as input into a variable named `pfp_str` and then wrote the contents of\
    \ the entire file as a single string into a file.\n\n## USEFUL FILE-HANDLING FUNCTIONS\n\
    \nPerl was initially developed for text processing, such as extracting information\
    \ from a text file and converting the text file into a new format. These procedures\
    \ can be carried out using a variety of built-in file functions.\n\nThe following\
    \ are some helpful Perl routines for working with files:\n\n| Function | Description\
    \ |\n| :--- | :--- |\n| `glob()` | Used to print the files in a directory passed\
    \ as an input. |\n| `tell()` | Obtains the location of the read pointer in a file\
    \ using the `FileHandle`. |\n| `getc()` | Used to read the next character from\
    \ the file specified by the `FileHandle` argument. |\n| `reverse()` | When used\
    \ in list context, returns the list in reverse order; when used in scalar context,\
    \ returns a concatenated string of the list’s values, with each character in the\
    \ string in the opposite order. |\n| `rename()` | Renames a file from its previous\
    \ name to a new one specified by the user. |\n\nIn this chapter, we covered file\
    \ handling in Perl with its syntax and relevant examples.\n\n# CHAPTER 6: Regular\
    \ Expressions in Perl\n\nDOI: [10.1201/9781003358442-6](https://doi.org/10.1201/9781003358442-6)\n\
    \n## IN THIS CHAPTER\n\n* Regular Expressions\n* Operators\n* Regex Character\
    \ and Special Character Classes\n* Quantifiers and Backtracking\n* “e” Modifier\
    \ in Regex\n* “ee” Modifier\n* `pos()` Function\n\nIn the previous chapter, we\
    \ discussed file handling; in this chapter, we will cover regular expressions\
    \ (`Regex`).\n\nIn Perl, a regular expression (`Regex`, `Regexp`, or `RE`) is\
    \ a particular text string that describes a search pattern inside a given text.\
    \ `Regex` in Perl is tied to the host language and is not the same as in `PHP`,\
    \ `Python`, and other programming languages.\n\nIt is also known as “Perl 5 Compatible\
    \ Regular Expressions” sometimes. Binding operators such as `=~` (Regex Operator)\
    \ and `!~` (Negated Regex Operator) are used to utilize the `Regex`. Let’s start\
    \ with creating patterns before moving on to binding operators.\n\n### Pattern\
    \ construction:\nIn Perl, patterns may be built using the `m//` operator. This\
    \ operator simply inserts the required pattern between the two slashes, and the\
    \ binding operators are used to search for the pattern in the provided text.\n\
    \n### Using m// with binding operators:\nBinding operators are commonly used with\
    \ the `m//` operator to match the desired pattern. To match string using a regular\
    \ expression, use the regex operator. The left-hand side of the statement will\
    \ include a string that will match the provided pattern on the right-hand side.\
    \ The negated regex operator determines whether the string is equal to the regular\
    \ expression supplied on the right-hand side.\n\n**Program 1:** The following\
    \ code demonstrates the use of `m//` and `=~`:\n```perl\n# program to demonstrate\n\
    # m// and =~ operators\n# Actual String\n$a = \"PEEKSFORPEEKS\";\n# Prints match\
    \ found if\n# its found in $a\nif ($a =~ m[PEEKS]) {\n    print \"Match is Found\\\
    n\";\n}\n# Prints match not found\n# if it is not found in $a\nelse {\n    print\
    \ \"Match is Not Found\\n\";\n}\n```\n\n**Program 2:** To demonstrate the usage\
    \ `m//` and `!~`, consider the following:\n```perl\n# program to demonstrate\n\
    # m// and !~ operators\n# Actual String\n$a = \"PEEKSFORPEEKS\";\n# Prints match\
    \ found if\n# it is not found in $a\nif ($a !~ m[PEEKS]) {\n    print \"Match\
    \ is Found\\n\";\n}\n# Prints match not found\n# if it is found in $a\nelse {\n\
    \    print \"Match is Not Found\\n\";\n}\n```\n\n### Regular expression uses:\n\
    \n* It can be used to count the number of times a particular pattern appears in\
    \ a string.\n* It can be used to find a string that matches a particular pattern.\n\
    * It can also replace searched pattern with another string.\n\n## OPERATORS IN\
    \ REGULAR EXPRESSION\n\nThe regular expression is a string that is a mixture of\
    \ distinct characters that facilitates text string matching. A `regex` or `regexp`\
    \ is another name for a regular expression.\n\nThe most basic way to utilize a\
    \ regular expression is to use the binding operators `=~` (Regex Operator) and\
    \ `!~` (Negated Regex Operator).\n\nIn Perl, there are three types of regular\
    \ expression operators:\n\n* Match regular expression\n* Substitute regular expression\n\
    * Global character transliteration regular expression\n\n### 1. Pattern matching\
    \ or regular expression matching:\nThe match operator `m//` compares a string\
    \ or statement to a regular expression. The forward slash in the operator serves\
    \ as the delimiter. The expression is written between the operator’s two slashes.\n\
    Syntax: `m/PATTERN/`\n`PATTERN` is the regular expression that will search. Let’s\
    \ look at some examples of pattern matching. In the following cases, a string\
    \ and regular expression are matched, and if successful, “match found” is returned;\
    \ otherwise, “match found” is returned. In the preceding code, an alternative\
    \ delimiter, `{}` is used instead of `/`.\n\n### 2. Make a substitution (search\
    \ and replace) regular expression:\nThe substitute operator `s///` is used to\
    \ search for and replace a specific word. The delimiter is the forward slash.\n\
    Syntax: `s/PATTERN/REPLACEMENT/`\n`PATTERN` is the regular expression that the\
    \ `REPLACEMENT` regular expression will substitute. Let’s look at a few instances\
    \ of replacement: `PATTERN` word is searched first, followed by `REPLACEMENT`\
    \ word.\n\n### 3. Global character regular expression for transliteration:\nTo\
    \ replace all instances of a character with a single character, use the translation\
    \ or transliteration operator `tr///` or `y///`. The delimiter is the forward\
    \ slash.\n\n## REGEX CHARACTER CLASSES\n\nTo match the string of characters, character\
    \ classes are employed. These classes allow the user to match any range of characters\
    \ that the user does not know ahead of time. The set of characters to be matched\
    \ is always enclosed by square brackets `[]`. A character class will always be\
    \ a perfect match for one character. If no match is detected, the entire regex\
    \ fails.\n\n### Important notes:\n\n* Inside the character class, `.` has lost\
    \ its particular meaning, which was “everything except a newline.”\n* Only inside\
    \ a character class, `.` may match a single dot.\n* The majority of special characters\
    \ lose their particular significance within a character class; however, certain\
    \ characters gain some special meaning.\n\n### Range in character class:\nMatching\
    \ a long list of characters is tough to enter since the user may skip one or two\
    \ characters. So, to make things easier, we’ll utilize range. A dash `-` is commonly\
    \ used to denote the range.\n\n### Important notes:\n\n* The `-(dash)` sign is\
    \ used to specify a range.\n* The user may also mix various ranges of characters,\
    \ digits, and so on, such as `[0-9a-gA-g]`. Here, `-` allows the user to select\
    \ any number of characters or digits from the range.\n* If a user wants to match\
    \ a dash `-` in a string, he may simply insert it between square brackets `[]`.\n"
