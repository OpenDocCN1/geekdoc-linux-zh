    To start a screen session, use the following command:


    screen


    This will open a new session with a clear screen. We can work on this screen and
    use the features provided by screen application for it.


    ## Get help of screen


    To get the help options of screen application, press the following keys in order:


    Control key + A key  followed by ? key


    Note: for this to work, you should be within a screen session.


    Following is the output:


                        Screen key bindings, page 1 of 2.


                        Command key: ^A   Literal ^A:  a


    break      ^B b         license     ,            removebuf   =


    clear       C            lockscreen ^X x         reset       Z


    colon       :            log         H            screen     ^C c


    copy       ^[ [         login       L            select      ''


    detach      ^D d         meta        a            silence     _


    digraph     ^V           monitor     M            split       S


    displays    *            next        ^@ ^N sp n   suspend     ^Z z


    dumptermcap .            number      N            time        ^T t


    fit         F            only        Q            title       A


    flow        ^F f         other       ^A           vbell       ^G


    focus       ^I           pow_break   B            version     v


    hardcopy    h            pow_detach  D            width       W


    help        ?            prev        ^H ^P p ^?   windows     ^W w


    history     { }          quit        \            wrap        ^R r


    info        i            readbuf     <            writebuf    >


    kill        K k          redisplay   ^L l         xoff        ^S s


    lastmsg     ^M m         remove      X            xon         ^Q q


                     [Press Space for next page; Return to end.]


    ## Exit a screen session


    To exit a screen session, we can detach it using the following keys:


    Control key + A followed by d


    The output will be like:


    [detached from 129921.pts-1.localhost]


    (base) [opengenus@localhost ~]$


    129921.pts-1.localhost is the name of our screen session and we can use this name
    to get back into it.


    This will allow us to get back into this screen session later and the processes
    within it will keep running on the system. We will see later in section "Delete
    a screen session" to learn how we can delete it and terminate all processes within
    it.


    ## List existing screen sessions


    Once we are out of a screen session, we may go back into it. For this, we shall
    use the following command:


    screen -ls


    In our case, following is the output:


    There are screens on:


            129921.pts-1.localhost  (Detached)


            120455.pts-1.localhost  (Detached)'
