    ```\n\n这将让你获得该会话的访问。\n\n## 如何知道你正处于 screen 中？\n\n简单的检测方法是执行 `screen list` 命令，如果有任何活跃的\
    \ screen 会话，可能意味着你或其它用户正在其中运行。\n\n```bash\nscreen -ls\n```\n\n或者，你也可以尝试退出 `screen`。如果你在\
    \ `screen` 中，它会分离（detached）；如果你不在其中，则该操作将无效。\n\n按下 control key + A 接着按 d\n\n##\
    \ 删除 screen 会话\n\n要删除 `screen` 会话，我们需要进入想要删除的 `screen` 会话，随后有两种选项：\n\n使用 `exit`\
    \ 命令：\n```bash\nexit\n```\n\n使用以下命令：\n`Control key + A` 接着按 `k`\n\n将出现如下提示：\n\
    `Really kill this window [y/n]`\n\n按下 `y` 键后，`screen` 会话终止并显示以下消息：\n\n```\n[screen\
    \ is terminating]\n(base) [opengenus@localhost ~]$\n```\n\n这将终止会话并杀死其中的所有进程。\n\
    \n## 为 screen 会话命名\n\n我们可能需要为 `screen` 会话命名，这样在列出会话时，我们可以理解哪个会话对应哪个任务。\n\n要做到这一点，在创建\
    \ `screen` 会话期间，可以使用以下命令：\n\n```bash\nscreen -S name\n```\n\n这将创建一个名为 `\"name\"\
    ` 的 `screen` 会话，以下是 `screen list` 命令的输出：\n\n```\nThere are screens on:\n     \
    \ 113050.name     (Detached)\n      105349.pts-1.localhost  (Detached)\n     \
    \ 129921.pts-1.localhost  (Detached)\n      120455.pts-1.localhost  (Detached)\n\
    ```\n\n# `/var/run/screen/S-opengenus` 中的 4 个 Socket\n\n## 锁定你的 screen 会话\n\n\
    如果你想锁定 `screen` 会话，可以使用以下组合键：\n\n`control key + A` 接着按 `x`\n\n这将屏幕变为：\n`Screen\
    \ used by opengenus <opengenus> on localhost.`\n`Password:`\n\n可以输入 UNIX 用户密码重新登录会话。\n\
    \n## 记录 screen 会话活动\n\n我们可以通过以下命令创建会话来记录 `screen` 会话中的所有活动：\n\n```bash\nscreen\
    \ -L\n```\n\n如果已经在 `screen` 会话中，可以使用以下组合键：\n\n`control key + A` 接着按 `H`\n\n这将保存一个包含所有活动的文件。\n\
    \n`screen` 应用程序还有许多可用选项。你可以查阅我们之前演示过的帮助选项并尝试每个选项。事实上，我们演示的选项已经足够让你像大师一样使用 `screen`\
    \ 了。\n\n## 文件处理\n\n我们已经创建了包含文件的目录结构作为工作区。\n\n- `file1`\n- `folder1.0.0`\n- `---\
    \ --- file2`\n- `--- --- --- folder1.1.0`\n- `--- --- --- --- --- --- folder1.1.1`\n\
    - `--- --- --- --- --- --- file3`\n- `--- --- --- --- --- --- file4`\n- `--- ---\
    \ --- folder1.2.0`\n- `--- folder2.0.0`\n- `--- --- file5`\n\n我们将对此进行工作。\n\n`ls`\
    \ 命令用于列出当前层级下的文件和目录。\n\n命令：\n```bash\nls\n```\n\n输出：\n```\nfile1  folder1.0.0\
    \  folder2.0.0\n```\n\n`\"ls -l\"` 命令是上述 `\"ls\"` 命令的进阶，包含了其他关键信息，如文件/目录的大小、修改日期、所有者、权限等。\n\
    \n命令：\n```bash\nls -l\n```\n\n输出：\n```\ntotal 0\n-rw-rw-r--. 1 opengenus aditya\
    \  0 Aug  7 00:10 file1\ndrwxrwxr-x. 4 opengenus aditya 57 Aug  7 00:11 folder1.0.0\n\
    drwxrwxr-x. 2 opengenus aditya 19 Aug  7 00:11 folder2.0.0\n```\n\n`\"ls -R\"\
    `\n这是一个非常重要的命令，因为它会递归地列出通向任何深度的所有文件和子目录。\n\n命令：\n```bash\nls -R\n```\n\n输出：\n\
    ```\n.:\nfile1  folder1.0.0  folder2.0.0\n./folder1.0.0:\nfile2\n```\n\n"
