    We have two screen sessions namely:


    129921


    120455


    We can go back into one of the sessions as well.


    ## Run a command in a screen session


    The advantage of using screen is that you can run a command in a screen session
    and then, close the terminal and even then, the process will continue to run.
    It is useful if you are working on a remote machine or need to close the terminal.


    The flow will be as follows:


    // create a screen session


    screen


    // run the command now in background


    command &


    // exit the screen


    control key + A followed by d


    // now you can close the terminal safely


    exit


    ## Go back into a session


    To go back into an existing screen session, we should get the name of the session
    (say 129921) using the list screen command and use the following command:


    screen -r 129921


    This will give you access to the session.


    ## How to know you are in a screen?


    The simplest way to detect is to do the screen list command and if any screen
    session is active, it may signify that you or some other user is within it.


    screen -ls


    Alternatively, you can try to exit a screen as well. If you within a screen, it
    will get detacted and if you are not in one, it will not work.


    control key + A followed by d


    ## Delete a screen session


    To delete a screen session, we need to get into the screen session we want to
    delete and following it, there are two options:


    Use exit command as:


    exit


    Use the following command:


    Control key + A followed by k


    A prompt will come as:


    Really kill this window [y/n]


    On pressing y key, the screen session is terminated with the following message:


    [screen is terminating]


    (base) [opengenus@localhost ~]$


    This will terminate the session and kill all process within it.


    ## Name a screen session


    We may need to name a screen session so that when we list the sessions, we can
    understand which session is for which task.


    To do this, during the creation of a screen session, we can use the following
    command:


    screen -S name


    This will create a screen session named "name" and following is the output of
    the screen list command:


    There are screens on:


            113050.name     (Detached)


            105349.pts-1.localhost  (Detached)


            129921.pts-1.localhost  (Detached)


            120455.pts-1.localhost  (Detached)


    4 Sockets in /var/run/screen/S-opengenus.


    ## Lock your screen session


    If you want to lock your screen session, you can use the following key combination:


    control key + A followed by x


    This will turn the screen into this:


    Screen used by opengenus <opengenus> on localhost.


    Password:


    One can enter the UNIX user password to log back into the session.


    ## Log screen session activity


    We can log all activity in a screen session by creating a session using the following
    command:


    screen -L


    If one is already in a screen session, one can use the following key combination:


    control key + A followed by H


    This will save a file with all activity.


    There are several other options available with screen application. You may go
    through the help option that we have demonstrate previously and try out each option.
    In fact, the options we have demonstrate are enough to use screen like a master.


    File handling


    We have created the folder structure with files as a workspace to work on.


    --- file1


    --- folder1.0.0


    --- --- --- file2


    --- --- --- folder1.1.0


    --- --- --- --- --- --- folder1.1.1


    --- --- --- --- --- --- file3


    --- --- --- --- --- --- file4


    --- --- --- folder1.2.0


    --- folder2.0.0


    --- --- --- file5


    We will work on this.


    ls command is used to list the files and directories in the current directory
    level.


    Command:


    ls


    Output:


    file1  folder1.0.0  folder2.0.0


    “ls -l” command is an incremental to the above “ls” command where other key information
    are included like size of file/ directory, modified date, owner, permissions and
    much more.


    Command:


    ls -l


    Output:


    total 0


    -rw-rw-r--. 1 opengenus aditya  0 Aug  7 00:10 file1


    drwxrwxr-x. 4 opengenus aditya 57 Aug  7 00:11 folder1.0.0


    drwxrwxr-x. 2 opengenus aditya 19 Aug  7 00:11 folder2.0.0


    “ls -R”


    This is an important command as it lists out all files and sub-directories recursively
    to any depth.


    Command:


    ls -R


    Output:


     .:


    file1  folder1.0.0  folder2.0.0


    ./folder1.0.0:


    file2  folder1.1.0  folder1.2.0


    ./folder1.0.0/folder1.1.0:


    folder1.1.1


    ./folder1.0.0/folder1.1.0/folder1.1.1:


    file3  file4


    ./folder1.0.0/folder1.2.0:


    ./folder2.0.0:


    file5


    Other ls commands you should try quickly are:


    *   ls -n (to display user ID and group ID of files and directories)


    *   ls relative_or_absolute_path (ls on specific directory and not on current
    working directory)


    *   ls -i (to get inode numbers)


    *   ls -IS (to get files in order of file size)


    *   ls -F (to add / after every directory)


    *   ls -lh (to display size in human readable format)


    *   ls –help (to display the guide on using ls)


    top/ htop command


    While running an application, we may need to monitor how the system is being used.
    This can be done using the top or htop command.


    Top command comes by default.


    Command:


    top


    Output:


    ![](Images/image00085.gif)


    To install htop, you may use the command:


    sudo apt-get install htop


    htop is an improvement over top and should be used preferably. It displays the
    thread utilization visually.


    Command:


    htop


    Output:


    ![](Images/image00086.gif)


    It is, highly advised in a professional development setting that you run htop
    on one terminal while running an application and observe the utilization in htop
    output.


    vi command


    To open a file, you can use the vi command simply.


    Command:


    vi filename


    This will open a terminal where the file contents will be displayed. To start
    writing, press “I” key and you will go to insert mode.


    To go to command mode, press ESC key and then use the following commands (without
    quotes and followed by enter):


    *   “:q” -> quit vi editor


    *   “:q!” -> quit vi editor without saving unsaved changes


    *   “:w” -> save unsaved changes


    *   “:wq” -> save unsaved changes and quit editor


    *   “:<integer>” -> go to line number as the specified integer


    *   :/<text> -> to find the particular text  


    Other related commands you must explore are:


    *   pwd (displays the absolute path of present working directory)


    *   du (lists out directories with memory occupied)


    *   du -mh (same as above command + get size in MB)


    *   cat filename (to get file contents in terminal)


    There are several other commands, but these commands will give you a good understanding
    and enable you to start you work smoothly without any friction.


    Key advices:


    *   Always keep track of system details


    *   Version of software components play a major role and can be source of bugs.
    Keep track of it.


    *   Always ensure no process is running in background before running a new command
    (to ensure performance is not impacted)


    *   Always analyze htop output while a command is running


    *   Always run process that will consume time as a background process (to save
    time)


    With practice and as situation arises, you will be able to master using Linux.


    ![Social media and Internet presence of OpenGenus](Images/image00087.jpeg)


    Best of luck for your upcoming job/ interview.


    With the current Linux knowledge, you will be able to work in a professional development
    setting smoothly and make huge contributions from the first day.'
