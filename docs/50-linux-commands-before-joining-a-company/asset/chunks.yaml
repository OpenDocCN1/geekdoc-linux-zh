- fmt: "\nNote, there are two types of processes namely:\n\n- background process\n\
    - foreground process\n\nThe idea is that the background process does not link\
    \ with the `STDOUT` and `STDERR` pipes of the screen session while foreground\
    \ process is linked with the `STDOUT` and `STDERR` pipes of the screen session.\
    \ Hence, if the background process produces an output in the terminal, it will\
    \ get printed. So, it is useful if a process does not produce any output or output\
    \ is piped to a file.\n\nNote that both background and foreground processes are\
    \ linked with `STDIN` pipe. So, if a background process needs an input from `STDIN`\
    \ pipe, it gets stuck (hang) until we bring it to the foreground.\n\nTo make a\
    \ process run in the background, we need to append the command with `&`.\n\n###\
    \ Syntax:\n\n```bash\ncommand &\n```\n\n### Example:\n\n```bash\npython code.py\
    \ &\n```\n\nIt will give an output as:\n\n```text\n[1] 121378\n```\n\n`1` is the\
    \ job id and `121378` is the process id.\n\n### Check background processes\n\n\
    We can check the processes that are in background as follows:\n\n```bash\njobs\n\
    ```\n\nThe output in our case is as follows:\n\n```text\n[1]-  Running       \
    \      python code.py &\n[2]+  Running             python opengenus.py &\n```\n\
    \nThe first integer is the Job ID of the command that is given along side. For\
    \ example, the command `python opengenus.py &` has Job ID `2`.\n\nWe can use the\
    \ Job ID to manage the background process and do several things like:\n\n- bring\
    \ a background process to foreground\n- killing a background process\n\n### Bring\
    \ a process back\n\nTo bring a process back in foreground, we need to use the\
    \ following command:\n\n```bash\nfg %<job_ib>\n```\n\n### Example:\n\n```bash\n\
    fg %2\n```\n\nThis will bring the process `python opengenus.py &` to the foreground.\
    \ The output will be like:\n\n```bash\n(base) [opengenus@localhost Desktop]$ fg\
    \ %2\npython opengenus.py\n```\n\nIf your code is waiting for an input, it can\
    \ be provided now.\n\n### Make a running process go into background\n\nNow, if\
    \ your process is already running and you want to take it to the background, you\
    \ can follow the following steps:\n\n1. Press control key + Z\n2. check job id\
    \ using `jobs`:\n\n```bash\njobs\n```\n\n3. make job go to background:\n\n```bash\n\
    bg %<job id>\n```\n\nThe process will have moved to the background.\n\nIf you\
    \ just press control key + z, it will stop the process which we can see in the\
    \ `jobs` command:\n\n```text\n[1]   Running             python code.py &\n[2]-\
    \  Running             python opengenus.py &\n[3]+  Stopped             python\
    \ code_2.py\n```\n\nNow, if we move the Job ID `3` to background using `bg` command,\
    \ we can check the impact using the `jobs` command.\n\n```bash\nbg %3\n```\n\n\
    It will give an output as:\n\n```text\n[3]+ python code_2.py &\n```\n\nNote the\
    \ `&` sign at the end. It signifies that the process is running in the background.\n\
    \nTry the `jobs` command:\n\n```bash\njobs\n```\n\nThe output will be as follows:\n\
    \n```text\n[1]   Running             python code.py &\n[2]-  Running         \
    \    python opengenus.py &\n[3]+  Running             python code_2.py &\n```\n\
    \n### Get Process ID of a job\n\nWe can get the process ID of all background jobs\
    \ using the `jobs` command as follows:\n\n```bash\njobs -l\n```\n\nThe output\
    \ will be as follows:\n\n```text\n[1] 121378 Running             python code.py\
    \ &\n[2]- 127536 Running             python opengenus.py &\n[3]+ 12623 Running\
    \             python code_2.py &\n```\n\nNote that the first number (`1`, `2`\
    \ and `3`) are Job IDs while the second numbers (like `121378`) are Process ID.\n\
    \n### Kill a process\n\nThere are two ways to kill a process:\n\n- Kill it directly\
    \ using process ID\n- Bring it to foreground and kill it using control + C\n\n\
    Once we get the process ID of a job, we can kill it directly like:\n\n```bash\n\
    kill 121378\n```\n\nThis will kill the first job. It will give an output as:\n\
    \n```text\n[1]  Terminated      code.py\n```\n\nWe can verify this using our `jobs`\
    \ command:\n\n```bash\njobs -l\n```\n\nThe output will be:\n\n```text\n[2]- 27536\
    \ Running             python opengenus.py &\n[3]+ 2623 Running             python\
    \ code_2.py &\n```\n\nNotice that the first job is missing. We will use the second\
    \ approach of bring it to the foreground and killing it as follows:\n\n```bash\n\
    fg %3\n(base) [opengenus@localhost Desktop]$ fg %3\npython code.py\n```\n\nThe\
    \ terminal is stuck. If we press Control + C, the process will be terminated as\
    \ follows:\n\n```bash\n(base) [opengenus@localhost Desktop]$ fg %3\npython code.py\n\
    Traceback (most recent call):\n  File \"code.py\", line 7, in <module>\n    time.sleep(1)\n\
    KeyboardInterrupt\n```\n\nWe can verify this using `jobs -l` command. The output\
    \ will be:\n\n```text\n[2]+ 27536 Running             python opengenus.py &\n\
    ```\n\nHence, only process is in the background. With this, you have the complete\
    \ knowledge of working with background. The problem with this is that if you close\
    \ the terminal it will kill the process. To enable the process to continue after\
    \ closing the terminal, we need to detach the process from the terminal which\
    \ can be done using `screen` and `nohup`.\n\nScreen is an application in Linux\
    \ system which is used to manage terminal sessions and run processes even when\
    \ the terminal is closed. In this guide, we have demonstrated all screen commands\
    \ so that you can use it in your daily work. The most common use of screen is\
    \ running processes in background.\n\n### Install Screen\n\nWe can install the\
