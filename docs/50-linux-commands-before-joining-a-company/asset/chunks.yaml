  trans: "\n注意，进程有两种类型，即：\n\n- 后台进程\n- 前台进程\n\n其核心思想是：后台进程不会与 screen 会话的 `STDOUT`\
    \ 和 `STDERR` 管道链接，而前台进程则与 screen 会话的 `STDOUT` 和 `STDERR` 管道链接。因此，如果后台进程在终端中产生输出，它会被打印出来。所以，如果一个进程不产生输出或者输出被重定向到文件，它是很有用的。\n\
    \n注意，后台和前台进程都与 `STDIN` 管道链接。因此，如果后台进程需要来自 `STDIN` 管道的输入，它会被挂起（hang），直到我们将其带回前台。\n\
    \n要让进程在后台运行，我们需要在命令后添加 `&`。\n\n### 语法：\n\n```bash\ncommand &\n```\n\n### 示例：\n\
    \n```bash\npython code.py &\n```\n\n它将输出如下内容：\n\n```text\n[1] 121378\n```\n\n\
    `1` 是作业 ID (job id)，`121378` 是进程 ID (process id)。\n\n### 检查后台进程\n\n我们可以通过以下方式检查处于后台的进程：\n\
    \n```bash\njobs\n```\n\n在我们的案例中输出如下：\n\n```text\n[1]-  Running             python\
    \ code.py &\n[2]+  Running             python opengenus.py &\n```\n\n第一个整数是随附提供的命令的\
    \ Job ID。例如，命令 `python opengenus.py &` 的 Job ID 为 `2`。\n\n我们可以使用 Job ID 来管理后台进程并执行若干操作，如：\n\
    \n- 将后台进程带回前台\n- 杀死后台进程\n\n### 将进程带回前台\n\n要将进程带回前台，我们需要使用以下命令：\n\n```bash\nfg\
    \ %<job_ib>\n```\n\n### 示例：\n\n```bash\nfg %2\n```\n\n这将进程 `python opengenus.py\
    \ &` 带回前台。输出将如下：\n\n```bash\n(base) [opengenus@localhost Desktop]$ fg %2\npython\
    \ opengenus.py\n```\n\n如果你的代码正在等待输入，现在可以提供了。\n\n### 让正在运行的进程进入后台\n\n现在，如果你的进程已经在运行并且你想将其转到后台，可以按照以下步骤操作：\n\
    \n1. 按下 Control  + Z\n2. 使用 `jobs` 检查 job id：\n\n```bash\njobs\n```\n\n3. 让作业进入后台：\n\
    \n```bash\nbg %<job id>\n```\n\n进程将移动到后台。\n\n如果你只按下 Control  + z，它会停止该进程，我们可以在\
    \ `jobs` 命令中看到：\n\n```text\n[1]   Running             python code.py &\n[2]- \
    \ Running             python opengenus.py &\n[3]+  Stopped             python\
    \ code_2.py\n```\n\n现在，如果我们使用 `bg` 命令将 Job ID `3` 移动到后台，可以使用 `jobs` 命令检查影响。\n\n\
    ```bash\nbg %3\n```\n\n它将输出如下：\n\n```text\n[3]+ python code_2.py &\n```\n\n注意末尾的\
    \ `&` 符号。它表示该进程正在后台运行。\n\n尝试 `jobs` 命令：\n\n```bash\njobs\n```\n\n输出将如下：\n\n```text\n\
    [1]   Running             python code.py &\n[2]-  Running             python opengenus.py\
    \ &\n[3]+  Running             python code_2.py &\n```\n\n### 获取作业的进程 ID\n\n我们可以使用\
    \ `jobs` 命令获取所有后台作业的进程 ID：\n\n```bash\njobs -l\n```\n\n输出如下：\n\n```text\n[1] 121378\
    \ Running             python code.py &\n[2]- 127536 Running             python\
    \ opengenus.py &\n[3]+ 12623 Running             python code_2.py &\n```\n\n注意，第一个数字（`1`、`2`\
    \ 和 `3`）是 Job IDs，而第二个数字（如 `121378`）是 Process ID。\n\n### 杀死进程\n\n杀死进程有两种方法：\n\n\
    - 直接使用进程 ID 杀死\n- 将其带回前台并使用 Control + C 杀死\n\n一旦我们获得了作业的进程 ID，就可以直接杀死它：\n\n```bash\n\
    kill 121378\n```\n\n这将杀死第一个作业。它将输出如下：\n\n```text\n[1]  Terminated      code.py\n\
    ```\n\n我们可以使用 `jobs` 命令验证这一点：\n\n```bash\njobs -l\n```\n\n输出为：\n\n```text\n[2]-\
    \ 27536 Running             python opengenus.py &\n[3]+ 2623 Running         \
    \    python code_2.py &\n```\n\n注意第一个作业消失了。我们将使用第二种方法，将其带回前台并杀死，如下：\n\n```bash\n\
    fg %3\n(base) [opengenus@localhost Desktop]$ fg %3\npython code.py\n```\n\n终端卡住了。如果我们按下\
    \ Control + C，进程将如下所示被终止：\n\n```bash\n(base) [opengenus@localhost Desktop]$ fg\
    \ %3\npython code.py\nTraceback (most recent call):\n  File \"code.py\", line\
    \ 7, in <module>\n    time.sleep(1)\nKeyboardInterrupt\n```\n\n我们可以通过 `jobs -l`\
    \ 命令验证此。输出为：\n\n```text\n[2]+ 27536 Running             python opengenus.py &\n\
    ```\n\n*(注：原文末尾部分存在大量重复且混乱的快捷键表，根据要求已进行清理并保留核心结构)*\n\n### 安装 Screen\n\n我们可以在 Ubuntu\
    \ 等 Linux 版本安装 screen：\n\n```bash\nsudo apt-get install screen\n```\n\n对于其他系统如\
    \ RedHat (RHEL)，可以使用：\n\n```bash\nsudo yum install screen\n```\n\n### 启动 screen\
    \ 会话\n\n要启动 screen 会话，使用以下命令：\n\n```bash\nscreen\n```\n\n这将打开一个新的会话。我们可以在此 screen\
    \ 中工作并使用它提供的功能。\n\n### 获取 screen 帮助\n\n要获取 screen 应用的帮助，按顺序按下快捷键：Control + A 然后按\
    \ `?`。注意：为了使此操作有效，必须处于 screen 会话中。\n\n### 退出 screen 会话\n\n退出 screen 会话，可以使用以下快捷键进行分离\
    \ (detach)：\n\nControl + A 然后按 d\n\n输出将类似于：\n\n```text\n[detached from 12921.pts-1.localhost]\n\
    (base) [opengenus@localhost ~]$\n```\n\n### 列出 screen 会话\n\n一旦离开了 screen 会话，就可以回到它。为此，我们应该使用以下命令：\n\
    \n```bash\nscreen -ls\n```\n\n在我们的案例中，输出如下：\n\n```text\nThere are screens on:\n\
    \    12921.pts-1.localhost (Detached)\n    120455.pts-1.localhost (Detached)\n\
    ```\n"
- fmt: "\n# 2 Sockets in `/var/run/screen/S-opengenus`\n\nWe have two screen sessions\
    \ namely:\n- 129921\n- 120455\n\nWe can go back into one of the sessions as well.\n\
    \n## Run a command in a screen session\n\nThe advantage of using `screen` is that\
    \ you can run a command in a `screen` session and then, close the terminal and\
    \ even then, the process will continue to run. It is useful if you are working\
    \ on a remote machine or need to close the terminal.\n\nThe flow will be as follows:\n\
    \n```bash\n// create a screen session\nscreen\n\n// run the command now in background\n\
    command &\n\n// exit the screen\ncontrol key + A followed by d\n\n// now you can\
    \ close the terminal safely\nexit\n```\n\n## Go back into a session\n\nTo go back\
    \ into an existing `screen` session, we should get the name of the session (say\
    \ `129921`) using the `list screen` command and use the following command:\n\n\
    ```bash\nscreen -r 129921\n```\n\nThis will give you access to the session.\n\n\
    ## How to know you are in a screen?\n\nThe simplest way to detect is to do the\
    \ `screen list` command and if any screen session is active, it may signify that\
    \ you or some other user is within it.\n\n```bash\nscreen -ls\n```\n\nAlternatively,\
    \ you can try to exit a `screen` as well. If you within a `screen`, it will get\
    \ detacted and if you are not in one, it will not work.\n\ncontrol key + A followed\
    \ by d\n\n## Delete a screen session\n\nTo delete a `screen` session, we need\
    \ to get into the `screen` session we want to delete and following it, there are\
    \ two options:\n\nUse `exit` command as:\n```bash\nexit\n```\n\nUse the following\
    \ command:\n`Control key + A` followed by `k`\n\nA prompt will come as:\n`Really\
    \ kill this window [y/n]`\n\nOn pressing `y` key, the `screen` session is terminated\
    \ with the following message:\n\n```\n[screen is terminating]\n(base) [opengenus@localhost\
    \ ~]$\n```\n\nThis will terminate the session and kill all process within it.\n\
    \n## Name a screen session\n\nWe may need to name a `screen` session so that when\
    \ we list the sessions, we can understand which session is for which task.\n\n\
    To do this, during the creation of a `screen` session, we can use the following\
    \ command:\n\n```bash\nscreen -S name\n```\n\nThis will create a `screen` session\
    \ named `\"name\"` and following is the output of the `screen list` command:\n\
    \n```\nThere are screens on:\n      113050.name     (Detached)\n      105349.pts-1.localhost\
    \  (Detached)\n      129921.pts-1.localhost  (Detached)\n      120455.pts-1.localhost\
    \  (Detached)\n```\n\n# 4 Sockets in `/var/run/screen/S-opengenus`\n\n## Lock\
    \ your screen session\n\nIf you want to lock your `screen` session, you can use\
    \ the following key combination:\n\n`control key + A` followed by `x`\n\nThis\
    \ will turn the screen into this:\n`Screen used by opengenus <opengenus> on localhost.`\n\
    `Password:`\n\nOne can enter the UNIX user password to log back into the session.\n\
    \n## Log screen session activity\n\nWe can log all activity in a `screen` session\
    \ by creating a session using the following command:\n\n```bash\nscreen -L\n```\n\
    \nIf one is already in a `screen` session, one can use the following key combination:\n\
    \n`control key + A` followed by `H`\n\nThis will save a file with all activity.\n\
    \nThere are several other options available with `screen` application. You may\
    \ go through the help option that we have demonstrate previously and try out each\
    \ option. In fact, the options we have demonstrate are enough to use `screen`\
    \ like a master.\n\n## File handling\n\nWe have created the folder structure with\
    \ files as a workspace to work on.\n\n- `file1`\n- `folder1.0.0`\n- `--- --- file2`\n\
    - `--- --- --- folder1.1.0`\n- `--- --- --- --- --- --- folder1.1.1`\n- `--- ---\
    \ --- --- --- --- file3`\n- `--- --- --- --- --- --- file4`\n- `--- --- --- folder1.2.0`\n\
    - `--- folder2.0.0`\n- `--- --- file5`\n\nWe will work on this.\n\n`ls` command\
    \ is used to list the files and directories in the current directory level.\n\n\
    Command:\n```bash\nls\n```\n\nOutput:\n```\nfile1  folder1.0.0  folder2.0.0\n\
    ```\n\n`\"ls -l\"` command is an incremental to the above `\"ls\"` command where\
    \ other key information are included like size of file/ directory, modified date,\
    \ owner, permissions and much more.\n\nCommand:\n```bash\nls -l\n```\n\nOutput:\n\
    ```\ntotal 0\n-rw-rw-r--. 1 opengenus aditya  0 Aug  7 00:10 file1\ndrwxrwxr-x.\
    \ 4 opengenus aditya 57 Aug  7 00:11 folder1.0.0\ndrwxrwxr-x. 2 opengenus aditya\
    \ 19 Aug  7 00:11 folder2.0.0\n```\n\n`\"ls -R\"`\nThis is an important command\
    \ as it lists out all files and sub-directories recursively to any depth.\n\n\
    Command:\n```bash\nls -R\n```\n\nOutput:\n```\n.:\nfile1  folder1.0.0  folder2.0.0\n\
    ./folder1.0.0:\nfile2\n```\n"
