    ![](Images/cover00088.jpeg)


    # 50+ Linux Commands before joining a Company


    Aditya Chatterjee x Benjamin QoChuk


    ## Introduction


    Linux and its variants like Ubuntu, RedHat, OpenSUSE and others are the preferred
    development workspace for most serious developers today.


    Moreover, when one is developing a software system that will be used by customers,
    it is important to test in different Linux variants and the key is to use Linux
    smoothly for wide collaboration.


    This book will prepare you to use Linux in a way a professional developer would
    use. You can fit in any developer group instantly and will feel confident in using
    your computing system.


    We have covered over 50 commands, and this will enable you to use Linux efficiently
    for any basic development work. All commands are important and has been chosen
    by analyzing the development work done in top companies.


    High level ideas we have covered are:


    *   Get hardware details about your system

    *   Get software details about your system

    *   Running and handling processes efficiently and in background

    *   Handling file system

    *   Other key commands


    At the end, we have present key advices of using Linux that will make you a “great
    developer” clearly.


    Let us get started directly by capturing the details of the current computing
    system. This is important so that you can share the details along with the main
    work (may be an application or benchmark data) so it is reproducible.


    ## Get details about your system


    Getting information about a system and recording it correctly is important for
    a wide range of use cases. This allows one to recreate the same system environment
    and hence, work in same flow and get same performance measurements. This involves
    both hardware and software details.


    While working in a professional setting, often, one is required to keep a track
    of System details for every measurement/experiment done. This is because at a
    later point the same performance can be replicated by creating same environment.


    This is how a basic record of our system configuration looks like:


    | System Information |


    | Attribute | Value |

    | Model | Intel(R) Xeon(R) Platinum 8180 CPU @ 2.50GHz |

    | NUMA nodes | 4 |

    | Sockets | 2 |

    | Cores | 28 |

    | Threads per socket | 2 |

    | CPUs | 112 |

    | Hyperthreading | OFF |

    | Frequency | 2494.256 MHz |

    | RAM | 512 GB |

    | Rank | 2 |

    | DIMMs | 4 |

    | Clock Frequency | 4200 MHz |

    | Clock Speed | 2133 MT/s |


    | Software Information |


    | Attribute | Value |

    | Kernel | Linux linux-mzys 4.4.162-94.72-default |

    | GCC version | GCC (SUSE Linux) 6.2.1 20160826 |

    | OS | OpenSUSE 12.3 (Dartmouth) |


    We will go through the process so that you can recreate the details for your own
    system. It is highly suggested that you try the commands in your system. We will
    get started with the process.


    ### lscpu command


    `lscpu` command will provide information about the CPU architecture by reading
    two files:


    *   `sysfs`

    *   `/proc/cpuinfo`


    The output is the first step of collecting system configuration information. This
    command provides some key information which is used to run processes efficiently.
    The idea is that there are commands to control the execution of processes and
    we have explored this later in this book.


    Command:


    ```

    lscpu

    ```


    We will present the output in our system first so that you can go through it and
    analyze it. We explain the background knowledge and go through the command following
    this. It provides several information, so it is highly advised that you examine
    it carefully on your own first.


    ```

    Architecture:           x86_64

    CPU op-mode(s):          32-bit, 64-bit

    Byte Order:             Little Endian

    CPU(s):                 112

    On-line CPU(s) list:    0-111

    Thread(s) per core:      2

    Core(s) per socket:      28

    Socket(s):               2

    NUMA node(s):            4

    Vendor ID:               GenuineIntel

    CPU family:             6

    Model:                   85

    Model name:             Intel(R) Xeon(R) Platinum 8180 CPU @ 2.50GHz

    Stepping:                4

    CPU MHz:                 2494.256

    BogoIPS:                4988.51

    Virtualization:          VT-x

    L1d cache:               32K

    L1i cache:               32K

    L2 cache:                1024K

    L3 cache:                39424K

    NUMA node0 CPU(s):       0,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108

    NUMA node1 CPU(s):       1,5,9,13,17,21,25,29,33,37,41,45,49,53,57,61,65,69,73,77,81,85,89,93,97,101,105,109

    NUMA node2 CPU(s):       2,6,10,14,18,22,26,30,34,38,42,46,50,54,58,62,66,70,74,78,82,86,90,94,98,102,106,110

    NUMA node3 CPU(s):       3,7,11,15,19,23,27,31,35,39,43,47,51,55,59,63,67,71,75,79,83,87,91,95,99,103,107,111

    Flags:                  fpu de pse tsc msr pae mce cx8 apic sep mtrr pge mca cmov
    pat ... (truncated) ... syscall nx pdpe1gb rdtscp lm constant_tsc arch_perfmon
    bts rep_good nopl xtopology nonstop_tsc aperfmperf eagerfpu pni pclmulqdq dtes64
    monitor ds_cpl vmx smx est tm2 ssse3 sdbg fma cx16 xtpr pdcm pcid dca sse4_1 sse4_2
    x2apic movbe popcnt tsc_deadline_timer aes xsave avx f16c rdrand lahf_lm abm 3dnowprefetch
    ida arat epb invpcid_single pln pts dtherm intel_pt kaiser tpr_shadow vnmi flexpriority
    ept vpid fsgsbase tsc_adjust bmi1 hle avx2 smep bmi2 erms invpcid rtm cqm mpx
    avx512f avx512dq rdseed adx smap clflushopt clwb avx512cd avx512bw avx512vl xsaveopt
    xsavec xgetbv1 cqm_llc cqm_occup_llc pku ospke

    ```


    A system has a couple of `NUMA nodes` which is a division of the entire system.
    The idea is that processes can run on separate `NUMA nodes` without any interference
    and overhead for memory access point of view. Each `NUMA node` has a set of CPUs
    and separate memory assigned to it.


    In our case, with the `lscpu` command, we get the following information:


    *   We have 4 `NUMA nodes`

    *   We have 112 CPUs

    *   We get the entire list of CPUs and the `NUMA node` each belongs to.


    We have `sockets` which are the number of distinct physical components. Each socket
    has a set of `cores` assigned to it. Each core can have several CPUs assigned
    to it and the number of CPUs is same as the number of threads assigned to a core.


    Note: A CPU can run only one thread at a time. A thread means one line of execution/
    one process.


    From our `lscpu` output, we get the following details:


    *   2 sockets

    *   28 cores per socket

    *   2 threads per cores


    If you do the calculation, the numbers will match on your system:


    `(Number of Sockets) x (Number of cores per socket) x (Number of threads per core)
    = (Number of CPUs)`

    `2 x 28 x 2 = 112`


    Note: If hyperthreading (a property) is on, then the above calculation will not
    hold, and we will get twice the number of CPUs. In hyperthreading, the number
    of threads per core is doubled. Hence, this gives us another key information:
    the state of hyperthreading.


    If hyperthreading is on, then:


    `(Number of Sockets) x (Number of cores per socket) x (Number of threads per core)
    = (Number of CPUs) x 2`

    `2 x 28 x 2 = 112`


    With this, we got a good idea of the system design. This information shall be
    recorded and will be used extensively in our later sections where we run processes
    efficiently. We get other important details to identify our system as well. These
    are:


    *   Model name: Intel(R) Xeon(R) Platinum 8180 CPU @ 2.50GHz


    CPU frequency is 2494.256 MHz. This is important as it impact performance of programs
    directly and must be same to enable us to replicate a benchmark result. The flag
    values indicate the different features supported by the system. For example, `AVX2`
    and `AVX512` are supported in our system. For common systems, `AVX512` is not
    supported and the performance of specific applications may be low which use `AVX512`
    to their benefit.


    This gives a good indication why the performance of the same application may vary
    significantly across systems.


    Following is the summary of the key information we recorded using `lscpu` command:


    | System Information (lscpu) |


    | Attribute | Value |

    | Model | Intel(R) Xeon(R) Platinum 8180 CPU @ 2.50GHz |

    '
