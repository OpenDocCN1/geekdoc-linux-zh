    \ well. Do this before moving on to the next command.\n\n### uname -a\n\n```bash\n\
    uname -a\n```\n\nThe `uname -a` command will provide the kernel name. This is\
    \ important so because operating systems play a major role.\n\nIn most benchmarking\
    \ setting, measurements are taken on different operating systems and hence, kernel\
    \ is a key information.\n\n**Command:**\n```bash\nuname -a\n```\n\nSample output:\n\
    ```\nLinux linux-mzys 4.4.162-94.72-default #1\nSMP Mon Nov 12 18:57:45 UTC 2018\
    \ (9de753f)\nx86_64 x86_64 x86_64 GNU/Linux\n```\n\nFollowing is the record of\
    \ our kernel information:\n\n| System Information (uname -a) |\n| Attribute |\
    \ Value |\n| :--- | :--- |\n| Kernel | Linux linux-mzys 4.4.162-94.72-default\
    \ |\n\n### sudo dmidecode\n\n```bash\nsudo dmidecode\n```\n\nThe `sudo dmidecode`\
    \ command provides several important information such as Desktop Management Interface\
    \ and is linked to System Management BIOS. It provides the memory structure, system\
    \ components, device information and much more.\n\nWe will investigate parts of\
    \ it one by one to understand and get relevant information quickly.\n\n#### Clock\
    \ speed\n\nThe first information we need is the clock speed. We can grep MT on\
    \ the output of `sudo dmidecode` to get this information conveniently. `grep`\
    \ is a UNIX tool which allows us to filter text. \n\n```bash\nsudo dmidecode |\
    \ grep MT\n```\n\nOutput:\n```\nMTRR (Memory type range registers)\n      Speed:\
    \ 2133 MT/s\n      Configured Clock Speed: 1067 MT/s\n```\n\nIn this command,\
    \ we will get the Physical memory slot using `grep DDR`:\n\n```bash\nsudo dmidecode\
    \ | grep DDR\n```\n\nOutput:\n```\nType: DDR4\n```\n\nTo get the memory rank,\
    \ `grep Rank` as follows:\n\n```bash\nsudo dmidecode | grep Rank\n```\n\nOutput:\n\
    ```\nRank: 2\n```\n\nTo get the clock frequency, use the following command:\n\n\
    ```bash\nsudo dmidecode | grep MHz\n```\n\nOutput:\n```\nExternal Clock: 100 MHz\n\
    Max Speed: 4200 MHz\nCurrent Speed: 3400 MHz\n```\n\nTo get the DIMM information,\
    \ get the following command:\n\n```bash\nsudo dmidecode | grep DIMM\n```\n\nOutput:\n\
