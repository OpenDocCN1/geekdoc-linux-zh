    sudo dmidecode


    This command provides several important information such as Desktop Management
    Interface and is linked to System Management BIOS. It provides the memory structure,
    system components, device information and much more.


    We will investigate parts of it one by one to understand and get relevant information
    quickly.


    Clock speed


    The first information we need is the clock speed. We can grep MT on the output
    of sudo dmidecode to get this information conveniently. Grep is a UNIX tool which
    allows us to filter text.


    sudo dmidecode | grep MT


