    mail.


    # How Mail Delivery Works


    When a user sends mail, the mail server looks at the destination address and decides
    whether to receive the mail by its own domain or send the mail to another domain.
    If the mail address is within its own domain, the mail server stores it in a spool
    until the recipient retrieves it. If the mail address is in another domain, the
    mail server determines to which mail server the mail should be sent and forwards
    it.


    When the user requests mail delivery, the mail server sends the mail that is stored
    in the spool.'
