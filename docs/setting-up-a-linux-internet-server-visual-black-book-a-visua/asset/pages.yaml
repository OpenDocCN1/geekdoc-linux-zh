  md: '# The Meaning Of A Net Mask


    To better understand the meaning of the value of a net mask, you must first understand
    the close relationship IP addresses have to the binary number. Additionally, you
    should also understand something about the structure of net masks.


    # Representing An IP Address As A Binary Number


    An IP address is a 32-digit (32-bit) binary number. In the realm of computers,
    binary numbers are often separated into 8-bit (1 byte) units. An IP address is
    also separated into 8-bit units. Each 8 bit value is represented as a Base 10
    (decimal) number in the range of 0 to 255. Consequently, the 32-bit value of an
    IP address is written with four numbers, each with a value ranging from 0 to 255.
    (The STEP UP section of this chapter explains binary numbers.)


    When represented as a decimal number: 210 . 248 . 12 . 98

    When represented as a binary number: 11010010 . 11111000 . 00001100


    # Structure Of A Net Mask


    A net mask is represented as a binary number in the same way. When a net mask
    is represented by a binary number, you can see that there are two portions, one
    consisting of a continuous stream of ones (1) and the other consisting of a continuous
    stream of zeros (0). Direct your attention to the portion consisting of a continuous
    stream of ones (1). This portion is called a *mask*.


    ![](img/17f00f03278f20a01f42454f91fb48b8_39_0.png)


    255.255.255.248 = 11111111.11111111.11111111.11111000


    > If the value of the IP address corresponding to the portion consisting of a
    continuous stream of ones (1) is, it is considered to be of the same network.


    | Address | | Range of differences revealed by the net mask. |

    |---|---|---n| 210.248.12.96 = 11010010.11111000.00001100.00110000 | |

    | 210.248.12.97 = 11010010.11111000.00001100.00011001 | |

    | 210.248.12.98 = 11010010.11111000.00001100.00011010 | |

    | 210.248.12.99 = 11010010.11111000.00001100.00011011 | |

    | 210.248.12.100 = 11010010.11111000.00001100.01100100 | |

    | 210.248.12.101 = 11010010.11111000.00001100.01100101 | |

    | 210.248.12.102 = 11010010.11111000.00001100.01101110 | |

    | 210.248.12.103 = 11010010.11111000.00001100.01101111 | |

    | 210.248.12.104 = 11010010.11111000.00001100.01101000 | |


    Moving to the left one digit changes the value of the masked portion. Anything
    after this is considered to be a separate network.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# 2.3 Understanding TCP/IP


    When the values of the masked portions of a group of IP addresses are the same,
    they are considered to belong to the same network. For example, because the value
    of the masked portions for both IP addresses 210.248.12.96 and 210.248.12.103
    are the same, they belong to the same network. However, because the value of the
    masked portions for IP addresses 210.248.12.103 and 210.248.12.104 are different,
    they do not belong to the same network.


    # Using A Net Mask To Determine The Number Of IP Addresses That Can Be Used On
    A Network


    When a net mask is represented by a binary number, it is possible to know the
    number of IP addresses that belong to the network if you focus on the portion
    consisting of a continuous stream of zeros (0). For example, for the IP address
    255.255.255.248, the zero (0) portion occupies three bits thereby allowing eight
    IP addresses. If you understand binary numbers, you can use the net mask to determine
    the number of IP addresses that are available for use on a particular network.


    ```

    255.255.255.0 = 11111111.11111111.11111111

    8 bits = 256 addresses

    255.255.255.192 = 11111111.11111111.11111000

    6 bits = 64 addresses

    255.255.255.240 = 11111111.11111111.11111000

    4 bits = 16 addresses

    255.255.255.248 = 11111111.11111111.11111000

    3 bits = 8 addresses

    ```


    # Precautions When Specifying A Net Mask


    When representing a net mask as a binary number, at a specific place, all of the
    digits to the right must be zeros (0) and all the digits to the left must be ones
    (1).

    Consequently, the only net mask values that can be specified are where the delimiting
    digits are shifted. For example, the value 255.255.255.15 cannot be specified.


    | Values that can be specified as a net mask | Ones (1) <-> Zeros (0) |

    |---|---|

    | 255.255.255.192 = 11111111.11111111.11100000 | Ones (1) <-> Zeros (0) |

    | 255.255.255.0 = 11111111.11111111.11111111.00000000* |


    | A value that cannot be specified as a net mask |

    |---|-

    | 255.255.255.15 = 11111111.11111111.11111111.00001111 |


    ![](img/17f00f03278f20a01f42454f91fb48b8_40_0.png)'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Understanding Domain Names


    # Domain Name Rules


    The domain names used to identify network affiliation are constructed on the basis
    of certain rules. A domain name is made of several parts, which are separated
    by dots (.), and each of the separate parts means something. Just like an IP address,
    a unique domain name must exist on the Internet.


    In this book, because an original domain name is obtained to build an Internet
    server, you should recognize the basic parts of a domain name and understand how
    it is constructed.


    # Domain Name Notation


    A full domain name consists of several labels, separated by dots. Each separate
    label indicates a certain level in the hierarchy of the Internet. The first label
    on the right is called the *top-level domain name*. Immediately to its left is
    the second label, and subsequently the left-most label can be a selectable name.
    In the United States, the top-level domain name identifies the type of organization,
    such as .com (for commercial firms), .edu (for educational institutions) and so
    forth. Furthermore, the top-level domain name identifies the country, such as
    .jp (for Japan), .ca (for Canada) and so on. In the .jp domain and in other similar
    domains, the second level indicates the type of organization. In the U.S., the
    management of domain names is controlled by InterNIC (www.internic.net). The assignment
    of domain names is handled by a number of registrars that are listed on the InterNIC
    Web site.


    ![](img/17f00f03278f20a01f42454f91fb48b8_41_0.png)


    # dekiru.gr.jp


    | Third level | Second level | Top level |

    | --- | --- | --- |

    | You can apply for any name you like for this level, as long as it already been
    assigned. | Countries outside the U.S. use a two-letter code to indicate the type
    of organization. Here are examples from the .jp domain | This is usually omitted
    in the U.S.; else; it represents the name of the country by means of a two-letter
