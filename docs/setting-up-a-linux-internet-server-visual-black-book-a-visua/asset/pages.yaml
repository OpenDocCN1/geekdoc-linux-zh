  md: '# How To Configure The Mail Client


    To use mail on a Windows or Macintosh client, configure the mail client software
    in accordance with your Internet server configurations. Because the mail client
    uses the Simple Mail Transfer Protocol (SMTP) server for sending mail and the
    Post Office Protocol (POP) server for retrieving mail, both servers must be configured.
    Also, to use mail, a user account must have already been created on the Linux
    machine. The username and password of the created user account are required to
    configure the mail client.


    # POP Server Name


    Enter the alias for the POP server that you set in the Domain Name Service (DNS)
    server. If you configured the DNS server as described in this book, this alias
    will be "pop.specified_domain_name". In the example used in this book, it is "pop.dekiru.gr.jp".


    # SMTP Server Name


    Enter the alias for the SMTP server that was set in the DNS server. If the DNS
    server has been configured as described in this book, this alias will be "smtp.specified_domain_name".
    In the example used in this book, it is "smtp.dekiru.gr.jp".


    # Mail Address


    The mail address is "Linux_user_name@specified_domain_name". In the example used
    in this book, it is "bob@dekiru.gr.jp".


    # Account Name


    The account name is the username that was added on the Linux server.


    # Password


    This is the password corresponding to the username that was added on the Linux
    server. For APOP, use the password that was set by using the popauth command.'
