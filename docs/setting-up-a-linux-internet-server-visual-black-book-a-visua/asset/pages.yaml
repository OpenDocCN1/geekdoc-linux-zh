  md: '# Network Interface Cards


    A great number of NICs made by many different manufacturers are available. They
    come with a wide variety of feature sets and prices. For Linux, the easiest choice
    is one of the NE2000 compatible cards or a card that has been certified to work
    with Linux. Ask the store or online hardware retailer that sells the cards about
    compatibility or consult a Linux hardware compatibility list. (Red Hat maintains
    a good one on their website, www.redhat.com/support/hardware/).


    You usually have a choice between a card that is compatible with an industry standard
    architecture (ISA) slot or a peripheral connection interface (PCI) slot. We recommend
    you select the PCI cards. Because an NE2000 compatible card is not absolutely
    guaranteed to work on Linux, it may be best to chase several different kinds of
    cards that are known to work on the Windows machines, and then swap these between
    Linux and Windows, if necessary.


    ![](img/17f00f03278f20a01f42454f91fb48b8_62_0.png)


    +   * Choose an NE2000 compatible NIC or a card known to Linux.

    * Get a card designed for a PCI slot.


    # Two Cards Are Needed In The Server


    When you have many client PCs on your private network and you haven''t been assigned
    enough IP addresses to connect each one directly to your dedicated line, a network
    address translator (NAT) is often used. To use a NAT, you need to install two
    NICs in your Internet server. These two cards can be NE2000 compatible cards or
    any other NIC that you know will work with Linux.


    # Network Cables


    A number of cable types can be used with Ethernet, but the easiest to find and
    most compatible cable for use with both 10Base-T and 100Base-TX is called a category
    5 unshielded, twisted-pair (UTP) cable, often shortened to cat 5. It is readily
    available for purchase in stores and over the Internet. Do not inadvertently bring
    crossover cables, which are used to connect two computers directly together and
    cannot be used to connect computers to a hub. You want straight-through cables,
    not the crossover type.


    ![](img/17f00f03278f20a01f42454f91fb48b8_62_1.png)


    +   * Choose category 5 cable.

    * Only straight-through cables will work.

    * Cable lengths should be appropriate for the distances between each machine and
    its hub.'
