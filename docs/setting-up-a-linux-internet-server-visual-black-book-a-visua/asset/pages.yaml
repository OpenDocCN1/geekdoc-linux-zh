  md: '# 2.5 Understanding The Relationship Between IP Addresses And Domain Names


    # Host Names And IP Addresses


    Unique IP addresses are assigned to all computers and devices connected to the
    Internet and are used during Internet access. It is not easy, however, to remember
    IP addresses represented by numbers. Usually, the Internet is accessed by humans
    using a host name. A host name corresponds to an IP address, and wherever a host
    name is specified, an IP address is also specified. In the opposite case—where
    you know only the IP address—you can determine the host name is as well.


    The host name www.cisco.com, for example, is equivalent to the IP address 38.187.128.10.


    ![](img/17f00f03278f20a01f42454f91fb48b8_44_0.png)


    # Role Of The DNS Server


    All network connections are made by using IP addresses. When specifying an address
    using a host name, the host name needs to be converted to an IP address before
    the connection can be made. This conversion is called name resolution. The database
    in the Internet that carries out this name resolution is the domain name service
    (DNS). When a DNS server is given a host name, it returns the corresponding IP
    address and given an IP address, it returns the corresponding host name.


    ![](img/17f00f03278f20a01f42454f91fb48b8_44_1.png)


