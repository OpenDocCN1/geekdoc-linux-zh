  md: '# The Mailing List Gets Too Big


    As the size of the mailing list increases, modifying the /etc/aliases file and
    running newaliases each time members are added can become timeconsuming. Also,
    the /etc/aliases file can become difficult to edit because of the length of the
    line corponding to the mailing list. To avoid these problems, you can collect
    all of the mail addresses in a separate file and configure the /etc/aliases file
    to read that file. As a result, whenever you want to add or delete members, all
    you have to modify that separate file: you will not have to return newaliases
    each time.


    ![](img/17f00f03278f20a01f42454f91fb48b8_154_0.png)


    +   1 Enter the command.


    ```

    [root@server#] mkdir /etc/ml

    [root@server#] vigr /etc/ml/test

    ```


    ![](img/17f00f03278f20a01f42454f91fb48b8_154_1.png)


    +   2 Enter the mail addresses.


    mike

    mika

    bob@bob.net

    daug@impress.co.com


    > Note: See page 95 for information about the vigr text editor.


    Modify the /etc/aliases configuration file.


    +   3 Enter the command.


    ```

    [root@server#] vigr /etc/aliases

    ```


    ```

    # #(aliases 8.2 (Berkeley) 3/5/94

    # Aliases in this file will NOT be expanded in the header for

    # Mail, but WILL be visible over networks or from /bin/mail.

    ```


    ```

    # Person who should get root''s mail

    root:

    project: mike, bob@bob.net, daug@impress.co.com

    test: include:/etc/ml/test

    ```


    +   4 Enter the mail address of the mailing list.


    +   5 Type "include:list_file_name".


    > Warning: If you forget the colon (:) before and after "include", this file will
    not be configured correctly.


    +   6 Execute the command.


    ```

    [root@server#] newaliases

