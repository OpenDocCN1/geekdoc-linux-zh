  md: '# 10.4 Dealing With Problems


    # Verifying That The Network Is Connected


    The ping command determines whether you are able to communicate with another host
    on the network by means of IP. Executing the ping command to discover if you can
    reach another machine is called pinging that machine.


    To verify that the networks are connected, ping various locations from Linux.
    You can also ping another machine from a Windows or Unix client, not just from
    Linux.


    When you ping a machine, you can check to see that the LED of the related hub
