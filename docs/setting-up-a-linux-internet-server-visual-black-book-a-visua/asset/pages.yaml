- img_proc: true
  md: '# Top level domain label


    This is usually omitted in the US; else-where, it represents the name of the country
    by means of a two-letter country code. For example,.ca (for Canada), .jp (for
    Japan), .uk (for English), and so on. In the US top level domain label represents
    the type of organization.


    # U


    Unauthorized entry\To gain access to a networked computer at all without the computer
    owner''s permission.


    Uncompress (extract)

    See also Linux and OS.


    Unix family OS

    Unix was initially developed in the Bell laboratories of AT&T in 1971. Since then,
    it has developed into various forms and presently many varieties of Unix-based
    systems are being developed. These systems are part of Unix family OS. The Linux
    program was written from scratch, but was modeled after the Unix OS.


    Unmount

    See mount. Linux uses the unmount command to detach the specified file system
    from the file hierarchy.


    Up-link

    The port on an Ethernet hub that is used to connect to another hub rather than
    directly to a computer or device on the LAN.

    See also Hub.


    User

    An individual registered to use Linux. A user is the basic unit in Linux when
    managing permissions.

    See also root, permissions, and group.


    # V


    Vat


    See file system.


    Name of a character. Used to edit text files.

    See also text file.


    Virtual host

    To the outside it appears as a separate host machine, but it is operating on the
    same machine as one or more hosts.


    # W


    Web


    Refers to the World Wide Web, also called WWW. It is a called Web because pages
    located in the Internet are joined by links like a spider web. Presisely, the
    Web is the name used to refer to the Internet as a whole and currenty approximate
    70% of the data flowing through the Internet is said to be related to the Web.


    WWW (World Wide Web)

    See Web.

    See also IP address and network address.


    # Z


    Zone


    A part of the domain space that is under the authority of a particular name server.
    It is like a domain, but contains only the domain names and domain information
    that is not delegated elsewhere.'
