    domain.


    The IP address of the DNS server of www.impress.co.jp is given to ns.dekiru.gr.jp.


    Request the IP address of www.impress.co.jp.


    ![](img/17f00f03278f20a01f42454f91fb48b8_120_0.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_120_1.png)


    The IP address of www.impress.co.jp is received from ns.dekiru.gr.jp.


    The IP address of www.impress.co.jp is given to ns.dekiru.gr.jp.


    # Primary And Secondary DNS Servers


    The DNS is the basic service for managing information related to domains or hosts.
    To have a domain, you must have two DNS servers because DNS must operate continuously.
    Therefore, if you have your own domain, for the sake of redundancy, you must provide
    two computers as DNS servers. In most case, your Internet service provider (ISP)
    will provide you with a second server. From the standpoint of reliability, this
    is usually a better solution than having both DNS name servers at your location.


    The two DNS servers must maintain the same content. The DNS server that manages
    and updates information is the primary DNS server. The DNS server that copies
    and saves the contents of the primary DNS server automatically is the secondary
    DNS server.


    99'
