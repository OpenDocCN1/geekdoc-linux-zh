  md: '# STEP UP


    # DNS Server Caching Function


    Although a DNS server maps hostnames to IP addresses and IP addresses to host-names,
    each DNS server only has information for the domains for which it has been configured.
    As a result, a DNS server operates by querying other DNS servers for data that
    it does not have. Because the same operation recurs each time another search for
    the same address is performed. however, this approach quickly becomes extremely
    inefficient.


    The DNS server has a caching function that locally stores addresses for which
    a search has been performed. This cached data not only speeds up a second or subsequent
    search, but also reduces unnecessary Internet traffic. Because the latest changes
    to data on authoritative name servers would not reach the rest of the network
    if the cached data were kept forever, it is erased after a fixed period is known
    as the time to live (TTL). Because the data is stored by the BIND program, not
    on the disk, it becomes invalid when BIND is stopped and restarted.


    # Restarting BIND When Settings Have Not Properly Changed


    Although the DNS server cache provides several benefits, it may also cause the
    DNS service not to operate as expected. The information for which settings were
    changed may not be reflected properly. Usually, when the DNS server settings are
    changed, you should reload the settings. If this does not cause the information
    to be reflected properly, try restarting BIND. Use the ndc command to reload the
    settings as well as to restart BIND.


    Reload the settings.


    ```

    [root@server /root]# ndc reload@

    ```


    Restart BIND.


    ```

    [root@server /root]# ndc restart@

    ```'
