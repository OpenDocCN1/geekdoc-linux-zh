  md: '# 3.6 What You Need For Your Local Network


    • Hints On Cascading

    **Usable Ports**nWhen cascading, the uplink port of one hub is connected to one
    of the regular ports of another hub. You cannot connect the uplink port of one
    hub to the uplink port of the next hub or a regular port of one hub to a regular
    port of the next hub. Depending on the hub, you have two types of uplink ports.
    In one of these types, the two adjacent ports at either the left or the right
    end of the bank have the same number. One of these is an uplink port, and the
    other is an ordinary port. Only one of these two ports can be used at any time.
    In the other type of hub, a switch near the port determines whether it will function
    as an uplink port or a regular port.


    • The Number Of Hubs Required

    In cascading, you must pay attention to how many hubs the data packets pass through.
    In a situation such as the one illustrated in the following figure, the packets
    pass through one hub to client A, but must go through two hubs to get client C.
    In an Ethernet LAN, the maximum number of hubs that data packets can pass through
    is four. This is further restricted to two hubs in the case of 100Base-TX.


    ![](img/17f00f03278f20a01f42454f91fb48b8_64_0.png)


    A Few Thoughts On Efficient Use Of Hubs

    Because the speed of your dedicated line will be so much slower than the speed
    of a LAN, a 100Base-T is quite sufficient to connect your router to your Internet
    server. It''s nice, however, to have the faster speed provided by a 100Base-TX
    when transferring data between users on the LAN. To acquire this speed, you can
    use a dual-speed hub, tying together the 100Base-T LAN and the 10Base-T Internet
    server.\ When additional users are added to the LAN or certain users require more
    speed, using a switching hub helps reduce network confusion by managing the traffic
    on each port so that you achieve better flow throughout the network. Moreover,
    most 100Base-T switching hubs are dual speed (they can handle either speed equally
    well). Finally, in the case of a cascade connection, at the moment when the data
    packets pass through a switching hub, the hub count is reset to zero.


    43'
