  md: '# Introduction


    Recently, Linux has been in the spotlight. The reasons for Linux''s popularity
    include dissatisfaction with personal computer environments such as Windows, a
    desire to explore the concept of open-source software, and the attraction of using
    a cost-free and easy-to-use operating system.


    The Internet is where Linux can display its true worth. As a huge network connecting
    all people over the world, the Internet has grown using Unix operating systems,
    not Windows or Macintosh operating systems. Linux makes it easy to use Unix on
    a personal computer. At present, Linux is widely used at the core of the Internet,
    and with an unlimited number of small-scale servers using Linux, the percentage
    of personal computers using Unix will be substantial.


    Although you may know that Linux can be used as an Internet server, it is difficult
    to build a full-fledged server for the first time. The rest of the Unix family,
    you cannot use Linux without having some knowledge about it. This is why Unix
    has a reputation for being difficult to use. On the other hand, you do not need
    to be intimidated if you have a little knowledge about how to set up and use Linux.
    Linux is difficult because there are not enough qualified people and sufficient
    materials to assist in training to make it easier to use. The goal of this book
    is to build an Internet server. To achieve this, this book provides a basic knowledge
    about the Internet and step-by-step instructions on how to build an Internet server.
    You may think that building an Internet server is a daunting task. If you read
    this book, however, you will be surprised to find that it is much easier than
    expected. This book will not only show you how to set up an Internet server, but
    will also address the question of how the Internet works.


    I am positive that reading this book will expand your knowledge about the Internet
    and Linux. I will be satisfied if you find new enjoyment in the Internet by building
    an Internet server.


    In conclusion, I would like to thank my friends, who advised me in their capacity
    as Unix users, and Mr. Fukuura and other staff members in the Impress editorial
    department.


    The Authors 1999'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# About This Book


    This book describes how to build an Internet Server consisting of a DNS server,
    a mail server and other components. To build an Internet server using Linux, you
    must understand not only Linux but something of the Internet and your connection
    to it as well. Furthermore, the sequence of the steps in setting up a server is
    extremely important. Therefore, please read through the book in order, starting
    with the basics.


    The procedures described in this book correspond to Red Hat 6.0 and will not necessarily
    work with other versions of Linux, as such as Red Hat Linux 5.2 or Turbo Linux.
    Please use the enclosed Red Hat Linux 6.0 in conjunction with the examples as
    follows:


    # A brief introduction to the basics of server construction


    +   * Chapter 1 Creating An Internet Server On Linux


    +   * Chapter 2 Internet Basics


    In these chapters you will find a brief overview of an Internet server and a description
    of the Internet essentials needed to build one. TCP/IP addresses, domains and
    other subjects you will need to know about to build an Internet server are introduced.


    # Preparing to connect your server to the Internet


    +   * Chapter 3 The Permanent Connection


    This is a description of different options for obtaining the permanent line needed
    to connect your Internet server to the Internet.


    # Building an Internet server


    +   * Chapter 4 Installing Linux


    +   * Chapter 5 Mastering The Basic Operations Of Linux


    +   * Chapter 6 Creating A DNS Server


    +   * Chapter 7 Creating A Mail Server


    +   * Chapter 8 Creating A Web Server


    +   * Chapter 9 Using An Internet Server From A Client Server


    +   * Chapter 10 Operating A Secure Internet Server


    This chapter gives details on connecting to a network. If you want to set up a
    network, read this chapter.


    The remaining Appendices are broken down into specific topics, such as connecting
    Windows and Macintosh and Web and mail settings. To avoid making incorrect settings
    when you are setting up the Linux intranet server, read all the chapters, in order,
    from Chapter 1.'
  merge: -1
