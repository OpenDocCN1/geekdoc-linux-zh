  md: '# The Big Picture


    # Putting It All In Perspective


    Now it''s time to step back and take an overall look at your plan for an Internet
    server. Permanently connecting an Internet server to the Internet isn''t something
    to take lightly. You will be responsible for protecting users and your computers
    from your private network with technical problems that come in your Internet connection.
    While you provide content


    to the world at large, you are also assuming obligation to do your best to ensure
    its availability and accessibility. If your Internet server is an integral part
    of a business plan, you will have additional reasons to do right.


    # Key Points In Establishing Your Permanent Presence On The Internet


    We have covered many of these topics already and will be discussed in greater
    detail in following pages, but now is a good time to look at the big picture.
    This should help you to understand what you really want to do with an Internet
    server, as well as how to do it.


    You will need a cool, clean, convenient, and secure location for the machine that
    runs your server and equipment.


    # Server Location


    If you intend to maintain a 24/7 (24 hours a day, 7 days a week, all year) DNS,
    Mail, Web, or File Transfer Protocol (FTP) presence on the Internet, you must
    be able to ride out power outages, maintain contingency plans for equipment failures,
    and perform unbiased reboots. If the telco (telephone company) line or the ISP''s
    name server goes down, you need to know who to call and what to do at your end.


    # Uptime


    # How Much Bandwidth


    Most would say, the more available bandwidth, the better. It''s a practical world,
    however; adding more bandwidth must be weighed against the additional cost. A
    stable, well maintained Web site that offers static content and has a relatively
    small number of hits per day can operate smoothly on a 56kbps link. Dynamic content
    or a high volume of hits demands bandwidth. Because your need for bandwidth may
    change quickly, it''s important to know how easy it is to scale your bandwidth
    up or down.


    # Your Domain Name


    You will want to summon all your ingenuity to find an appealing but yet unsigned
    name. To request a domain name, you need to provide the registrar company with
    the name of your administrative, technical, and billing contacts, and the IP addresses
    of your primary and secondary DNS servers, although it is possible to reserve
    a name for a certain amount of time without knowing those IP addresses.


    36'
