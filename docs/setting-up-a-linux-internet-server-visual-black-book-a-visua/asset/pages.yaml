  md: "# # What Services Will The Server Provide?\n\n# ## Choosing Services\n\nWhen\
    \ you convert a host name to an IP address, view a Web page, or exchange email,\
    \ you use services that respond to these requests. A server is not just a personal\
    \ computer with Linux installed; it also refers to the programs that provide these\
    \ services. \n\nServers that provide different services independently of each\
    \ other. Consequently, more than one server can run on a single Linux machine.\n\
    \nexample, a Web server refers to a program that serves up Web pages.\n\n# ##\
    \ One Computer Can Run Several Servers\n\nServer refers to a program that provides\
    \ certain services as well as to the machine which the program runs on. A Web\
    \ server is a program that serves up Web pages. In Linux, server programs operate\
    \ independently of each other. It is possible to run each program on its own separate\
    \ computer with Linux installed; it is also possible to run all the server programs\
    \ on one Linux machine. Therefore, if you set up one Linux machine, you can run\
    \ it as a server that offers various services at the same time.\n\n![](img/17f00f03278f20a01f42454f91fb48b8_45_0.png)"
  merge: -1
