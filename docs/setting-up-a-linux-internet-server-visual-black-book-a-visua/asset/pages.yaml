  md: '# Dealing With Problems


    # Network Problems


    If the server or network connections seem to be acting strangely, the administrator
    must do something to rectify the situation. The following section describes techniques
    for dealing with some network problems. Try to avoid rebooting the server unless
    there is absolutely no other choice. Restart only the program wherein you think
    there is a problem


    (such as the DNS or Web server) without rebooting the Linux OS.


    # When You Cannot Connect To The Network


    If you cannot connect to the network, the hardware may be at fault. Check the
    connections on the cables, hub, and router.


    +   * Is the cable loose?

    Insert the cable firmly until you hear a click. Check the hub, router, or network
    card LEDs.

    * Is the hub or router turned on?

    Check the power LED of the hub and router.

    * Is a hub port that cannot be used at the same time as a cascade being used?

    If the cable is connected to a port that cannot be used at the same time as a
    cascade port, the network will not be able to use any equipment that is connected
    to that hub.


    ![](img/17f00f03278f20a01f42454f91fb48b8_213_0.png)


    +   * Is a crossover cable being used?

    A crossover cable is used to connect two network cards directly in a one-to-one
    fashion. Use a straight cable when connecting to the hub.'
  merge: -1
  pgno: 213
