    With the commands given previously, the data in the /home and /usr/local/www directories
    is saved in the backup files home-bak.tar.gz and www-bak.tar.gz under /usr/local/src.
    You can copy these backup files to another location for safe keeping. Any location
    is fine as long as the files can be extracted if the server is damaged. However,
    these files should probably be transferred off the server to a client PC using
    the FTP server.


    # Installing The FTP Server


    If the FTP server hasn''t been installed yet, it is difficult to transfer the
    backup files to another location. Use the rpm command to install the FTP server
    on Linux.


    Enter the command:


    ```

    [root@server /root]# rpm -i -n /cdrom/RedHat/RPMS/www-ftpd-2.4.2vr17-3.1386.rpm

    [root@server /root]#

    ```


    Log in to the FTP server, use the username and password of a Linux user. You can
    not log in as root, so use your usual username and password.


    # Restoring Data Files


    When restoring files that had been backed up, if you directly expand the backed-up
    data, new data may be overwritten. To prevent this, rename the original directory
    before using the tar command to expand the files.


    Change the name of /home directory to


    ```

    [root@server /root]# cd /

    [root@server /]# mv home home.old

    [root@server /]# tar xvpf /usr/local/src/home-bak.tar.gz

    ```'
