  md: "# Appendix I - Command Reference\n\n# top\n\nMonitors the status of processes.\n\
    \n+   * Key Operations\n* Space bar Rewrite the new status.\n  Displays only specific\
    \ users (enter username)\n  k Sends signals (enter the process ID and type of\
    \ signal)\n  ? Displays Help.\n* Related commands: ps, ptree, kill, killall\n\n\
    +   * Note\n* This command is like repeating the ps act over and again with the\
    \ results displayed continuously on screen. With top, only the current status\
    \ is displayed; however, you can use key operations to send a signal.\n\n# w\n\
    \nDisplays users who are logged in.\n\n+   * Syntax\n* w\n\n# watch\n\nExecutes\
    \ and displays commands at fixed intervals.\n\n+   * Syntax\n  watch command\n\
    * Commonly used option\n  -n Sets the interval in seconds. (The default is two.)\n\
    * Related command:\n* Note\n  Quit by pressing c + C.\n\n# touch\n\nChanges the\
    \ time of a file. If the file does not exist, it creates a file with size of 0.\n\
    \n+   * Syntax\n  touch file\n\n# umask\n\nSpecifies the permissions given to\
    \ a new file or directory when it is created.\n\n+   * Syntax\n  umask [value]\n\
    * Commonly used umask\n  022 Other users are read-only.\n  077 Other users cannot\
    \ read or write.\n* Related commands: ls, chmod\n\n# wc\n\nDisplays the number\
    \ of lines, words, and characters in a file.\n\n+   * Syntax\n  wc file\n* Commonly\
    \ Used Options\n  -w Displays the number of lines.\n  Displays the number of words.\n\
    \  Displays the number of characters.\n\n+   * Note\nThe default diff is: lines,\
    \ words, and characters.\n\n# which\n\nDisplays which file will be executed when\
    \ a command is entered.\n\n+   * Syntax\n  which command\n* Related commands:\
    \ whereis, find, locate\n\n+   * Note\nIn Linux, if a command does not contain\
    \ a slash (/) to specify a directory, the default directory path is searched for\
    \ the executable. The command displays the locations of the file to be executed.\n\
    \n# useradd/userdel\n\n/deletes users.\n\n+   * Syntax\n  useradd username\n \
    \ useradd -D\n  userdel username\n\n+   * Commonly used options\n  -group (useradd)\
    \ Sets the primary group.\n  -p Sets the password.\n(userdel) Deletes the home\
    \ directory well.\n\n+   * Related commands: id\n\n+   * Note\n  useradd -D sets\
    \ the default values.\n\n# Finding Out Which Commands Are Available\n\nWhen you\
    \ want to know which commands are available, enter the first characters of the\
    \ command and press tt to display the command names with those characters. Processing\
    \ only tt displays all the commands.\n\n# vi\n\nEdits text files.\n\n+   * Syntax\n\
    \  vi file\n\nLearn how to use a command, use the man command to view the command's\
    \ manual. Enter \"man command name\" to display the manual for the command.\n\n\
