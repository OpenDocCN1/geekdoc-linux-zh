  md: '# Chapter 10. Operating A Secure Internet Server


    Password data is sent through the network at various times. First, let''s learn
    where password data goes when certain actions are taken. When we know this, we
    can learn about security and decide what measures must be taken.


    # Services That Use Passwords And Services That Do Not


    Among the servers described in this book, most of those use passwords (such as
    FTP or POP) send usernames and passwords as clear text (not encrypted). Therefore,
    these servers should be restricted to access clients inside the LAN.


    # Telnet or File Transfer Protocol (FTP)


    The username and password are sent as clear text. Because entered commands and
    displayed characters are also unchanged, the use of these services from an external
    site is dangerous. You should restrict access so that it is limited to connections
    from internal clients.


    # Anonymous FTP


    The username and password are sent as clear text. Because the username is "anonymous"
    and the password is your own mail address, no problem will occur even if they
    are stolen. Although commands (such as cd or ls) and file data that are transferred
    are also sent as clear text, no problem will occur as long as you are using a
    server that is publicly available via anonymous FTP.


    # POP or Internet Message Access Protocol (IMAP)


    The username and password are sent as clear text. Mail is sent in a form in which
    the contents can be read directly. The use of these services from an external
    site is dangerous. You should restrict access so that it is limited to connections
    from internal clients.


    # APOP


    The username is sent in clear text, but the password is encrypted. Mail is sent
    in a form in which the contents can be read directly. Usually, this is better
    than POP.


    # Simple Mail Transfer Protocol (SMTP)


    SMTP doesn''t use usernames or passwords. Mail is sent and received in a form
    in which the contents can be read directly.


    # Hypertext Transfer Protocol (HTTP)


    Normally, HTTP doesn''t use usernames or passwords. If a Web page is created with
    an access restriction whereby passwords must be entered, all passwords are sent
    in clear text. Therefore, HTTP password authentication should only be used when
    this limitation is clearly understood.


    182'
