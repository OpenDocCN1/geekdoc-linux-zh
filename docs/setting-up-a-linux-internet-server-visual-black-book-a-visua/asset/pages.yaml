  md: '# Glossary


    # Number


    Attribute type domain

    A domain name that uses two letters to represent the type of organization in the
    second level of the domain is called an attribute type domain name. For example,
    in dekiru.gr.jp, the gr stands for the type of organization, in this case, a group.


    +   - 10Base-T

    - 100Base-TX

    - See Ethernet.


    # A


    +   - Absolute path

    - See path.


    # B


    +   - Address

    Number or name for specifying another device location. On the Internet, an address
    is called an IP address used to specify a computer or device. An email address
    is a character string that specifies a destination for email. See also email and
    IP address.


    +   - Back up

    Saving and storage of data at a separate location to prevent catastrophic data
    loss due to software and/or hardware failure.


    +   - Administrator, admin

    See root and user.


    +   - BIND

    The Berkeley Internet name domain software that is used to implement, maintain
    and maintain the Internet DNS specifications.


    +   - Alias

    Refers to defining another name for a command in Linux.


    +   - Binary number

    A numeric value represented by zeros and ones.


    +   - Apache

    Name of the most widely used Web server in the world.

    URL: www.apache.org

    See Web.


    +   - Bit

    The smallest unit multipled by a computer, represented as binary number, i.e.,
    either zero or one.


    +   - APOP

    A more secure alternative to POP that send encrypted passwords to the POP server.


    +   - Boot disk

    A floppy disk used when loading a PC OS.


    +   - Archive arch

    an archiver refers to a program that collects numerous files and places them in
    one file and a file created by an archiver is called an archive. The archive most
    often used in Linux is tar. Archives often used in Windows are WinZip and lba,
    and Stuffer in Macintosh. All programs have a compression unit. In Linux the archiver
    and compression software are considered to be separate programs and in many cases
    an archive file is compressed separately.

    See also compress.


    +   - Boot manager

    A program that allows you to select a bootable OS during system boot.


    +   - Broadcast address

    The address which devices sends packets are intended to be received by all hosts
    in the given network. See also IP address, and network address.


    +   - Bug

    An error in a program.


    +   - Byte

    A unit of data or memory represented by a computer, generally assumed to represent
    one ASCII character. Normally, one byte is composed of eight binary bits.


    +   - Argument

    See command.


    # C


    +   - Cascade

    See hub.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# CF


    Program to create a settings file (sendmail.cf) for sendmail.


    See also sendmail.


    # Clear text


    Human readable, plain text files that may be encoded in any of many, publicly
    available encodings such as ASCII or UTF-8, but do not contain any proprietary
    encoding or markup.


    # Client


    The client side of the client-server model for the distributed database known
    as DNS. These are just library routines that query and send over a network to
    a name server. As such, they are resolved. See also server.


    # Command


    A called line in Linux, the command line forms the interface where character strings
    (commands) are input returned. Using spaces after commands on the line allows
    character arguments to be passed to commands. From among the arguments, an option
    is that which influences the way command operates. When using many options for
    a Linux command, specify the options by continuing one hyphen (-) or continuing
    the character after a double hyphen (--). However, an exception is the command
    cp (- is not preceded) and the tar command (/) is not prepared).


    # Compiler


    Compiling is the operation to convert source code into an executable file. A compiler
    is a program that translates source code into an executable file. In Linux the
    compiler is make. See also source, GNU.


    # Compress


    Refers to reducing the size of data. Returning the data to its original state
    is called decompression. In Linux, the compression program widely used is gzip.


    # Cross-over file


    See Cross table and straight file.


    # Current directory


    Refers to the current location within the file hierarchy. The current directory
    is indicated by a period and a slash (./). The directory after logging in is the
    home directory. The home directory is the directory from which operations start.
    See also directory and path.


    # D


    # Dedicated line


    A line leased from your telco that is not shared with other customers. Sometimes
    called a leased line.


    # Default


    A fixed value that is assumed if nothing is specified. The default value can also
    be changed.


    # Development environment


    A set of files and programs needed to create programs. Even you don''t create
    programs, it will be necessary to compile programs from source to install software.
    The development environment used in Linux is GNU. See also compiler, source, and
    GNU.


    # Device


    A piece of peripheral hardware. Hard drives, keyboards and mice are peripheral
    devices. Device names are attached to device. In Linux, files that exist to respond
    to devices, and to access the devices is managed through these files. The name
    of the file corresponds to the device name, and these files are placed in /dev.


    # Device name


    See device.


    # DHCP (Dynamic Host Configuration Protocol)


    To automatically handle the network settings of an PC (such as IP address or netmask).
    See also IP address and netmask.


    # Dial connection


    A line connection to your ISP''s network by dialing a phone number each time to
    establish a connection with the Internet. See also permanent connection and Dedicated
    line.


    # Directory


    A location where files are placed, equivalent to a folder in Macintosh and Windows
    systems. In Linux, there is one large directory and the root of that structure
    is the root directory and others are placed within a directory. To represent directory
    B is contained within directory A, B is a subdirectory of A, or inverts, A is
    the parent directory of B. A parent directory is represented by two periods and
    a slash (../). See also user, current directory and path.


    # Distribution


    See kernel and Linux.


    238'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Domain name


    The top level of FDN is called the domain name. A domain name is a character string
    that represents the system to which it belongs. Alphanumeric characters and hyphens
    are used for domain names and separated by dots.. Even names can be made by appending
    characters to the end of a string. These can also express domain and hostnames
    by appending a dot.


    See also hostname.


    # Domain name system (DNS)


    Domain name or domain name system, is a distributed database, that uses a client-server
    model. The server side is represented by name servers that contain information
    about their own segment of the domain and make it possible to connect, clients
    resolvers.


    # Dot files


    Files that have a dot (period) as the first character of their file name. They
    are usually used as configuration or resource files for programs running Linux.


    # Driver


    A driver is a piece of software necessary to use hardware (device).


    # Dual speed hub


    See hub.


    # E


    # Email


    A method to transfer messages across a network.


    See also sendmail, SMTP, qpop, and POP.


    # Ethernet


    Communications protocol and hardware that enable two or more computers to share
    information. Divided into two types: 10Base with a maximum data transfer speed
    of 10M/sec and 100Base with a maximum data transfer speed of 100M/sec. There are
    many cables and methods 10Base-TX which are used, which utilizes a modular telephone
    jack for connections.


    See also LAN.


    # Extended partition


    See partition.


    # F


    # fdisk


    Name of a program to set disk partitions.


    See also partition.


    # File system


    A structure that defines access to files. Linux uses many different file systems,
    ext2 is mainly used for Linux, io9660 is used for Linux, and vfat is used for
    Windows. When mounting a disk using the mount command, append a -t option to specify
    a file system or specify it by the fstab command.


    See also.


    # Folder


    See directory.


    # Forward lookup


    Used in DNS, to obtain the IP address of a host by means of the hostname.


    # FQDN (Fully Qualified Domain Name)


    The complete form of a hostname in which the domain portion has not been truncated.
    plumtree is the single-word hostname of the machine whose FQDN is plumtree.kanji.jp.


    # FSF (Free Software Foundation)


    See GNU.


    # fstab


    Settings in which information is written about systems to be loaded automatically
    during the boot procedure.


    See also mount and file system.


    # FTP (File Transfer Protocol)


    Communication conventions used when transferring files in a TCP/IP network.


    See also HTTP.


    # G


    # Global IP address


    In contrast a IP address identifies a machine internally, only on your LAN, a
    global IP address is an address that is used to identify a host publicly, on the
    Internet at large.


    # GNU


    A freely and changeable software development project. GNU (for GNU’s Not Unix)
    is distributed by the FSF (Free Software Foundation). All distributions of Linux
    use many GNU packages such as compilers, basic commands and editors. A GPL (General
    Public License) is a license that defines the GNU software, which protects the
    freedom to re-distribute and change the code. The Linux kernel is also distributed
    based on GPL.


    URL: www.gnu.org'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# GPL (General Public License)


    GPL (General Public License)

    See GNU and source.


    # H


    Home directory

    See current directory.


    # Hostname


    A character string that represents the name of a computer.

    The hostname can represent the FDN or just the host

    portion of the FDN.


    # HTTP (Hypertext Transfer Protocol)


    Communication commands used when transferring

    Web pages over TCP/IP network.

    See FTP and network.


    # Hub


    A device for connecting PCs by Ethernet. There are de-

    er types of hubs; including hubs that transmit only

    speed in a network, dual speed hubs that connect-

    b to 10BaseT / 100BaseTX, and switching

    hubs that regulate the transmission of information to

    increase network efficiency. A special port is sometimes

    attached to a hub, allowing the network to be expanded

    by connecting this to another hub. This is known

    asas cascading.

    See Ethernet.


    # IDE (Integrated Drive Electronics)


    A standard for connecting peripheral devices such as

    disks and CD-ROMs to PCs.

    See SCSI.


    # IMAP (Internet Message Access Protocol)


    An Internet mail protocol used for storing and sending

    mail. Creates a mail file on the mail server side to

    mail which can be repeatedly accessed by the same

    recipient of which machine recipient uses.


    # Index file


    The default file that is displayed when a URL references

    the top page of a Web site. It is usually called

    ''index.html'', ''index.htm'', or ''default.htm'', but your Web

    server can be configured to use any name here.


    # Internet


    A worldwide network of networks. A network connects

    computers and devices, and the Internet connects net-

    works. The communication protocol used on the Internet

    is TCP/IP.

    See intract.


    # InterNIC


    Provides public information on Internet domain name

    registration services. For example, it lists ICANN-

    accredited registrars that are currently registering

    in the .com, .net and .org domains.

    URL: http://internic.net


    # IP address


    An address for detecting computers in a network. Uses

    numbers from 0 to 255 in five groups, separated

    by a period (i.), which is called dotted quotation.

    In this book, the IP address 192.168.1.1 was

    set to the Linux.


    See alias and broadcast address.


    # IP Masquerade


    The name of software that is used to apply NAT under

    Linux.


    # ISA (Industry Standard Architecture)


    A standard for connecting peripheral devices as net-

    work and SCSI cards to a PC.

    See PCI and PCMCIA.


    # iso9660


    See file system.


    # ISP (Internet Service Provider)


    The establishment that connects your computer or LAN

    to the Internet via its LAN.


    # J


    JPNIC (Japan Network Information Center)

    Organization that manages and assigns domain name

    it IP addresses for the jp domain.

    URL: www.nic.ad.jp/jpn/


    # K


    # Kernel


    The portion of code that forms the core of an OS.

    Introduced in this book, Linux is the name of a kernel.

    Additionally, it is also used with systems that utilize

    a Linux kernel. When installing Linux, you install what is

    known as distribution. Here, "distribution" is a system

    prising a set of kernel, basic commands, and appli-

    cations. In this book, a method is introduced to set up a

    server using a distribution called Red Hat Linux.

    See Linux.


    240'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# M


    # LAN Local Area Network


    Two or more computers in relatively close proximity to each other (same building),
    connected in such a way that they can share information.


    A character string represents the sender and recipient of mail. If a mail address
    is broken down, the right side of that at the symbol (@) represents the address
    of the system to which the address belongs and the left side of the (@) represents
    the address within the system (name of user that corresponds to the mail address).


    See also Ethernet.


    See also address.


    # Library


    A file consisting of various collected program parts.


    # make


    The make command executes a procedure to write to a file named "Makefile". The
    make command is used to compile programs so many people say "make" when referring
    to the compiling of a program. See also compile and development environment.


    # UL Loader


    See boot manager.


    # Link


    See symbolic link.


    # Mode


    The word "mode" has many meanings. For example, the "mode of file" indicates permissions.
    A vi "mode" indicates the state of the vi editor (input mode / edit mode). See
    also vi and permissions.


    # Linux


    A Unix-based OS. This describes how to set up a server using Linux. Linux is actually
    the name of the kernel that forms the core of the OS. In many cases, Linux is
    used to refer to systems that use the Linux kernel.


    See also kernel.


    # Mount


    Linking a file to a directory. In Linux, one large directory structure is used.
    When a hard drive or CD-ROM is inserted, it will link to one partition of this
    large structure.


    # Location type name


    A domain name shows the name of a geographic location in the second level is called
    a location type domain name. For example, chiyoda.tokyo.jp chiyoda stands for
    the chiyoda ward, and "tokyo" on the second level, is the city name.


    See also file system.


    # Log


    The log is a record of daemon and kernel operations.


    # N


    See also daemon and kernel.


    # Log in


    Refers to a situation where the user works in. In Windows, logging in is called
    logging on.


    See also log out.


    # Log out


    Refers to a situation where the user completes work. In Windows, logging out is
    called logging off.


    See also log in.


    # NAT Network Address Translation


    The translation between a private network address on a LAN and public IP address
    that can be used on the Internet.


    # NE2000 compatible


    An NE2000 card is a network card that can be used by Linux. NE2000 compatibility
    is defined as having functions compatible with the standards of a network card
    named NE2000.


    See also Ethernet and network card.


    # Logical partition


    See partition.


    # Netrix


    A figure for dividing addresses of an entire network and addresses within a network.


    See also address, broadcast address, and IP address.


    # Network


    A network connects computers and allows communication.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Network address


    Network address

    An address that indicates the entire network.

    See network address, broadcast address, and IP address.


    # Network card


    An expansion card for connecting a network. Also called an Ethernet card, LAN
    card and a NIC (network interface face).

    See also Ethernet and LAN.


    # O


    # Open source


    URL: www.opensource.org

    See source.


    # Option


    See command.


    # OS (Operating System)


    Fundamental software for a computer. An allocates resources of the computer to
    users and processes.


    # Owner


    A user that corresponds to a file to manage files and directories. Usually, the
    user who created the file becomes the owner of the file. The owner of a file can
    be changed by using the "chown" command.

    See also user and permissions.


    # P


    # Package


    In Linux, a package is a format that allows software to be quickly and easily
    installed.


    # Parent directory


    See directory.


    # Partition


    A region on a hard drive. On PC/AT compatible machines the following restrictions
    when creating partitions due to limitations of MS-DOS. There can be a maximum
    of four primary partitions. When setting more than four partitions, from among
    the primary, one partition will be set to an extended partition, and the extended
    partition will be divided into several logical partition.


    # Password


    A key to access a computer. During log in on Linux, the user name and password
    typed verify the user.

    See also user and log in.


    # Path


    A route followed to a file. Directories in a path are separated by ( / ). The
    path that starts from the root directory ( / ) is an absolute path, and paths
    that start from other the root directory are called relative paths.

    See also.


    # PCI (Peripheral Component Interconnect)


    A standard for connecting peripheral devices such as network cards and SCSI cards
    to a PC.

    See also ISA and PCMCIA.


    # PCMCIA


    A standard for connecting peripheral devices such as network cards and SCSI cards,
    to a PC. Mainly used for notebook PCs. Originally, the name of an organization
    (Personal Memory Card Association) that managed standards but now, it mostly concerns
    the use of slots or cards.

    See also ISA and PCI.


    # Permanent connection


    Unlike a dial connection, which is temporarily, a permanent connection is always
    connected to your ISP''s network and to the rest of the Internet. Permanent connections
    are leased lines and DSL lines.


    # Permissions


    Access rights to files and directories. In Linux, you can set whether or not to
    reading, writing, and executing for three types of users: owners, groups, and
    others.

    See also file attributes and file modes.


    # POP (Post Office Protocol)


    Communication method for sending your email located on a mail server to another
    address in a TCP/IP network.

    See also popper and SMTP.


    # Port


    A port of a hub is an inlet for connecting cables. Moreover, in TCP/IP, another
    location is specified by a port number.

    See also IP, IP address, and server/client.


    # Primary partition


    See partition.


    242'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Private address


    An IP address cannot be used on the Internet. It is recommended to use private
    addresses on an intranet. The range of private addresses can be 10.0.0.0–10.255.255.255
    (network that has 16,277,216 addresses-class X), 172.16.0.0–172.31.255.255 (65,536
    Class B), and 192.168.0.0–192.168.255.255 (256 Class X). The instructions introduced
    in this book on how to set up a network used addresses of 192.168.1.0–192.168.1.255.
    See IP address, Intranet, and internet.


    # Relay


    An executed program running on an OS. Each process is managed by an integer value
    called a process ID. When a program is executed, a process is created and a process
    ID assigned. At this time, processes have identical process IDs cannot exist simultaneously.
    When the execution completes, the process is deleted. See program.


    # Program


    Computer code that can be executed (run) on a computer. All programs are saved
    in files. See process.


    # Prompt


    A character string on screen, as a command line for entering input. In addition
    to the command prompt displayed by the shell, there is also a login prompt and
    LIOP prompt during the boot sequence. See command.


    # Protocol


    Rules and formats by which computers communicate with each other.


    # Proxy


    A server that stands in one or more other machines for Internet access. The IP
    addresses of the other machines are not public.


    # Pseudo type (virtual terminal)


    A virtual terminal identifies addresses from another networked PC as if you were
    using a PC with Linux directly installed on it. A Linux emulated by an application
    such as telnet is called a virtual terminal (pseudo type).


    # Q


    Name of a POP server introduced in this book. URL: www.eudora.com/freeware See
    POP.


    # R


    # Red Hat


    Company that produces a Linux distribution and is also the name of the distribution.
    Red Linux CD-ROM is available for purchase. URL: www.redhat.com See Linux and
    distribution.


    # Relative path


    See path.


    # Relay lookup


    To pass mail that has been handed over to a mail server that is destined for another.


    Used in DNS, to obtain the hostname of a host by means of its IP number.


    # root


    User who administers a Linux system. Also called a super user. Root is a user
    who is not restricted by security. For example, permissions attached to files
    and directories are not valid for root. The root user can read and write all files
    and directories. See user.


    # Root directory


    See directory.


    # Router


    A device at an Internet node used for forwarding TCP/IP packets.


    # Routing


    The process of passing packets from router to router before they finally arrive
    at the host corresponding to their destination.


    rpm (Red Hat Package Manager)


    Name and file of a Red Hat Linux package (a software format that allows quick
    installations). Also the name command for operating rpm. See Red Hat.


    # S


    # SCSI


    Small Computer System Interface. A standard for connecting peripheral devices
    such as hard drives and CD-ROMs to a PC. Pronounced "scuzzy".


    See also IDE.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Second level domain label


    Second level domain label

    Countries outside the U.S. use a two-letter code to indicate the type of organization.
    For example, .co (companies), .ac (academic institutions), .ne (network service),
    .gr (volunteer group) and so on.


    sendmail

    Name of an e-mail delivery server introduced in this book.

    URL: https://sendmail.org

    See also SMTP and service.


    Server

    A service provides some useful of service or utility to other computers, and a
    server is a program that provides these services. In this book DHCP server and
    a Samba server that provides sharing services with Windows were introduced.

    See also daemon and network.


    shutdown

    Stopping the system. When exiting Linux, rebooting or turning OFF the power, a
    correct shutdown must be executed. This happens because there is a chance that
    data may be lost before being written to the disk if the power is suddenly turned
    OFF.


    SMTP

    Simple Mail Protocol. Set of communication rules for delivering email over TCP/IP.

    See also email and sendmail.


    Source

    A text file by when creating a program. The execution procedure of a program is
    in source. Compiling a source file produces an executable file. It was the case
    that source was the property of developers only. Due to the success of Linux and,
    to a greater degree GNU/FSF, however, great interest developed in the idea of
    making source publicly available and allowing all interested people to develop
    programs (source).

    See also Linux and Apache.


    Source file

    See source.


    Source list

    See source.


    Spool

    A location where data is temporarily stored when sending data to another device
    or program. In Linux, the data is often placed in the /var/spool and /usr/spool
    directories. The spool is used to store mail not yet received and data to a printer.


    Squid

    A proxy server discussed in this book.

    URL:http://squid.cache.org/


    Strag cable

    A cable for connecting a PC and a hub by Ethernet.

    See also cable and Ethernet.


    Subdomain use switch user

    Command to use user ID. The default reverts to root.

    See also user and root.


    Subdirectory

    See directory.


    Superuser

    See root and user.


    Symbolic link

    A file indicates a file located at another location. When a symbolic link is accessed,
    the file indicated by the symbolic link will be accessed. In Macintosh and Windows
    these types of links are called "alias" and "shortcut", respectively.


    SwapnA file or partition used by the operating system to give the impression of
    having more memory than is physically present. A hard drive partition is used
    as swap space.

    See also partition.


    Switching hub

    See hub.


    T

    TCP/IP (Transmission Control Protocol / Internet Protocol)


    A communication method used over the Internet.

    See also Internet and intranet.


    Text file

    The simplest document file in which character information is written. Text files
    do not depend on specific applications and have many uses, such as settings files
    and program source. Text files in Linux are handled in the same manner as Windows
    and Macintosh, although the Return/Enter keys are different.

    See also source.'
