    # A Password Is An Important Key


    A password is the only key safeguarding each user''s information. Whoever knows
    your password can log in to Linux with your username. Even if you are both on
    the same network, you will not know exactly what the impostor is doing. Manage
    your password carefully, especially with the Internet, because people can access
    your Linux machine from anywhere in the world. Also, if your password is stolen,
    it is a mistake to think that only you will be adversely affected. You must consider
    the possibility that the impostor may cause trouble for others.


    # Forgetting Passwords


    If a user forgets their password, switch to root to overwrite a user''s password
