    time because you do not have to configure the network for each client machine
    nor be concerned with duplicate IP addresses. Using DHCP enables you to configure
    the network correctly for a client just by connecting the cable.


    In this section, you configure the DHCP server in Linux for LAN-side clients.
    A network configuration for each client is made automatically.


