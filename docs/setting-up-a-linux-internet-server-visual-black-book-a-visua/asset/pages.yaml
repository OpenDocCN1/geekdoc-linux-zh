  md: '# # How A Proxy Server Works


    # ## Squid


    If you use a proxy server (called Squid), multiple users within a LAN view the
    same Web page, access speed can be increased by means of the effective use of
    cached data. Most of the data exchanged on the Internet is Web data. By using
    Squid, the number of external accesses for Web data can be reduced.


    This will, in turn, lighten the load on the line that connects your LAN to the
    Internet and make surfing the Web more enjoyable.


    # ## Of A Proxy


    If you use a proxy server when viewing Web pages, if the Web page you want to
    access has recently been accessed by someone using the same proxy server, it will
    be served up immediately from the cache. A cache is an area for temporarily storing
    data to increase access speed. Because an internal network is normally much faster
    than an external connection, the response will be much faster. Additionally, the
    load on your line to your ISP will be reduced.


    For example, if the speed of the connection provided by your fractional T1 is
    128Kbps, internal communications will be significantly faster than external communications,
    because the speed of an internal network is 10Mbps or 100Mbps.


    ![](img/17f00f03278f20a01f42454f91fb48b8_191_0.png)'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# If The Data Is Not Stored In The Cache


    If the data requested by the client is not stored in the cache, Squid accesses
    the Web server located on the Internet, downloads the Web page, and delivers it
    to the client. Squid also stores the downloaded data in the cache automatically
    at this time.


    +   1 The client requests data.


    +   2 Because the data is not in the cache, the proxy server requests the data.


    +   3 The proxy server delivers the data to the client and also stores it in the
    cache.


    +   4 The requested data is delivered to the proxy server.


    ![](img/17f00f03278f20a01f42454f91fb48b8_192_0.png)


    # If The Data Is Stored In The Cache


    If the data requested by the client is stored in the cache, Squid delivers it
    to the client.


    +   1 The client requests data.


    +   2 The proxy server delivers the data to the client.


    +   3 The proxy server retrieves the data from the cache.


    ![](img/17f00f03278f20a01f42454f91fb48b8_192_1.png)'
  merge: -1
  pgno: 192
