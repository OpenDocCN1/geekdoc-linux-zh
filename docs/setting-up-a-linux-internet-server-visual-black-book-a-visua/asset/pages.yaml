  md: '# 2.3 Understanding TCP/IP


    # Use Of IP Addresses


    When placing a dedicated access line into use, a group of successive IP addresses
    are assigned. A network address and a net mask are used to identify these successive
    IP addresses. Moreover, an IP address called a broadcast address has special meaning-in
    a network.


    # Network Address


    This is the initial IP address of the group of successive IP addresses that were
    assigned to the network. This IP address is not normally assigned to a device
    connected to the network.


    # Net Mask


    In conjunction with the network address, a net mask is used to identify the range
    of successive IP addresses that have been assigned to a network. A net mask is
    also called a subnet mask.


    # Broadcast Address


    This is the last IP address of the group of successive IP addresses assigned to
    the network. When this IP address is accessed, all devices within the network
    are accessed. This IP address is not normally assigned to a device connected to
    the network.


    A types of IP addresses would be used in this way:


    +   - 210.248.12.96

    - 210.248.12.97

    - 210.248.12.98

    - 210.248.12.99

    - 210.248.12.100

    - 210.248.12.101

    - 210.248.12.102


    Network address

    (The initial IP address of the network. Not assigned to computers or devices.)


    IP addresses assigned to devices

    (For eight IP addresses, up to six addresses can be assigned to devices. For 16
    IP addresses, up to 14 addresses can be assigned to devices.)


    Broadcast address

    (An address used for communicating with the entire network. Not assigned to computers
    or devices.)


    +   - 210.248.12.103'
