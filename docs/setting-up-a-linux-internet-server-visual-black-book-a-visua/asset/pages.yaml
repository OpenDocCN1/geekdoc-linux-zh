  md: '# # What Is An Internet Server?


    # ## Types Of Internet Servers


    When you use the Internet to view your favorite Web page to exchange email with
    friends and colleagues, a server located somewhere on the Internet is inevitably
    employed. On the Internet, different types of servers provide functions such as
    publicly opening Web pages and exchanging email.


    The general name for these is Internet servers. The Domain Name System or Service
    (DNS) server, Mail server, and Web server are the specific types of Internet servers
    that deserve first command your attention.


    # ## Internet Use Means Server Use


    Many people use telephone lines to dial-up and connect to their Internet Service
    Provider (ISP) and access the Internet. When viewing Web pages and reading email
    there is invariably a server located somewhere on the Internet that has been accessed
    and is providing the Web page and email functions. Additionally, the very act
    of accessing the Internet is the process of employing a server located somewhere
    on the Internet.


    ![](img/17f00f03278f20a01f42454f91fb48b8_25_0.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_25_1.png)'
