  md: '# # Appendix E New Features Of Red Linux Version 6.1


    The installation process has been made more user-friendly through new features
    such as:


    +   * A Graphical User Interface (GUI) Installation Mode

    The screens are now more intuitive, and mouse navigation throughout the installation
    is now possible. Help screens are added.

    * Customizable Workstation-Class Installations

    You can choose between GNOME and KDE desktops.

    * Manual Hard Drive Partitioning

    You can set your own hard drive partitions manually instead of using the system''s
    preset partitions.

    * New Scriptable Kickstart Mode

    Kickstart is extended to allow you to pass it a Python object and to configure
    kickstart installation dynamically.

    * User Account Creation

    You can set up new user accounts, and determine your root password during installation.

    * Up Front Configuration

    You can configure your system before committing any of changes to the hard drive.
    Changes are not made until after you have completely configured X.


    # System-Related New Features Include:


    +   * Automatic Hardware Detection On Boot

    Upon reboot, the new Kudzu tool detects new hardware and asks if you want to configure
    it.

    * Support For The 2.2.12 Linux Kernel

    * Pentium And Pentium III Optimized Kernels

    These kernels, compiled for chip-specific support, are available.

    * Glibc 2.1.2

    Support for the newer glibc 2.1.2 library is available.

    * XFree86 3.3.5

    More driver support is available in this version of XFree86.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Appendix E - New Features Of Red Hat Linux Version 6.1


    +   * Support For Lightweight Directory Access Protocol (LDAP)\Now you can set
    up the LDAP for account information services. It runs over Internet protocol,
    such as Transmission Control Protocol (TCP), and you can use it to access stand
    directory servers or X.500 directories.


    +   * Optional Interactive Boot Sequence

    You now enter an interactive mode while booting and individually select the services
    you want to have started. It''s a good way to catch error messages and test new
    configurations.


    # Other Goodies:


    +   * Graphical Point-To-Point Protocol (PPP) Configuration Tool

    You can use a program RP3 to monitor connections to any configured network device
    and to configure a new PPP connection.


    +   * KDE 1.1.1.1

    An alternative GUI desktop environment is provided, including useful window and
    file managers and many more applications.


    +   * GNOME 1.0.155

    This GUI allows end users to more easily use and configure their systems. There
    are many new applets, control center tools, and a better file manager and login
    screen.


    +   * Integrated Services Digital Network (ISDN) support

    ISDN support is now included.'
