- img_proc: true
  md: '# Services And Protocols


    Each service, whether it allows you to resolve a host name and IP address, serves
    up a Web page, or exchanges email, follows different communication protocols within
    a TCP/IP network. For example, a specific protocol, hypertext transfer protocol
    (HTTP), is used to serve Web pages. Another protocol, simple mail transfer protocol
    (SMTP), is used to send email. A third protocol, post office protocol (POP), is
    used to receive and distribute email to clients. Using one Linux machine, you
    can allow various servers to operate even though their protocols are different.
    Consequently, Linux allows you to run a single machine, an Internet server, that
    provides multiple services.


    ![](img/17f00f03278f20a01f42454f91fb48b8_46_0.png)


    # Servers And Programs Used In This Book


    DNS servers, Web servers, and mail servers are programs that provide various types
    of services and they all run on Linux. For any given service, several programs
    are available for Linux. In the Internet server built using this book, Berkeley
    Internet name domain (BIND) is used as the DNS server, Apache is used as the Web
    server, Sendmail is used as the mail transfer server, and qpopper is used to receive
    and distribute email. These server programs are widely used by many people throughout
    the world and have solid track records of reliability.'
  merge: -1
