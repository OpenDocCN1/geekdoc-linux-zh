  md: '# Hardware


    In addition to the NIU provided by the telco, you need a DSU/CSU (or an ISDN terminal
    unit, if you''re hooking up ISDN), a router, and the proper cables. Some router
    models (e.g., compatible systems 1250i) have the DSU/CSU built in. The minimum
    hardware configuration for Red Hat Linux is an Intel 486 or higher CPU, 16MB RAM,
    approximately 500MB disk space, and a 3.5-inch floppy drive. This set-up would
    certainly be the absolute minimum for an Internet server. Besides increasing bandwidth,
    the most obvious measure to increase the performance of your Internet is to increase
    your RAM. If you''re not sure, start with 64MB or more. If you will be serving
    dynamic Web content, you want something faster than a 486 MHz CPU. Again, if you''re
    not sure, start with a Pentium 120 or higher CPU.


    # The Line


    If you obtain your T1 or FT1 directly from the telephone company or through your
    ISP; they need to know how much bandwidth you want to pay for and when it will
    be convenient to schedule the installation. Confirm with them that the line will
    terminate in a NIU supplied by the telephone company and the type of jack will
    be available to connect to your DSU/CSU, probably RJ48C. Make sure that they understand
    that they will be bringing the wire all the way to your desired point of termination
    inside your house or office. also, make sure that you know who to call and how
    to refer to your line (by circuit ID number), in case a problem arises. After
    you are permanently wired, billing will begin, so be ready to bring you your other
    equipment, your new domain name, and your Internet server online quickly.


    # Your ISP


    Who is responsible for what? If you run your own mail server, will the ISP handle
    the secondary? If you run the primary DNS name server, will your ISP handle the
    secondary? Do you need a free dial-up account to access the Internet when you''re
    away from your private network? Will there be any filtering on packets directed
    to your domain, or will they pass straight through to you deal with any filtering
    you want to use? How fast is the ISP''s one connection to the Internet? If you
    decide to turn over the DNS name server completely to them later, what will you
    have to do and about how long will it take? Who is the technical contact (get
    a name) with whom you should deal? No other Internet relationship is more important
    than the well-being of your presence in cyberspace than the one you have with
    your ISP. Cultivate it, be diplomatic, and ask questions politely. Also, keep
    your eye open for alternatives, in case you need to move.'
