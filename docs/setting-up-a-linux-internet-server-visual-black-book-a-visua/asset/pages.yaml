  md: '# Chapter 3. The Permanent Connection


    # Hubs


    A hub is a hardware device used to connect various networked computers or devices
    together. Hubs come in all sizes, from four-port models to models with dozens
    of ports. Because it''s easy to run out of ports, the most economical place to
    start is with an eight-port hub. If you need more than eight ports, you can buy
    a hub with more ports, or you can combine several eight-port hubs. Generally,
    10Base-T hubs can connect only to other 10Base-T hubs, and 100Base-TX hubs can
    connect only to other 100Base-TX hubs. If you want to mix the two together on
    the same network, you must use dual-speed hubs.


    ![](img/17f00f03278f20a01f42454f91fb48b8_63_0.png)


    # When You Want To Connect More Devices To Your Network


    Because you want to connect more computers or devices to your hub than the number
    of available ports on your hub doesn''t necessarily mean that you must buy a hub
    with more ports. You can add ports by connecting one of the regular ports on one
    hub to the cascade port on another hub. Connecting hubs in this way is called
    cascading. If you use a stackable hub, because you can connect to the stack port,
    you can increase the number of available ports without cascading.


    ![](img/17f00f03278f20a01f42454f91fb48b8_63_1.png)


    The cascade port is labeled UPL or is shown with an EQU sign (=). When this uplink
    port is used, the adjacent port of that hub usually cannot be used.


    Because one port is used to connect the adjacent port, the adjacent port cannot
    be used


    If you have many ports on one hub, they can all be toggled independently by using
    an uplink port.


    You can connect devices to ports'
