  md: '# What Kind Of OS Is Linux


    Linux refers to a Unix-like, GNU-based OS (built around the Linux kernel) for
    PCs. The kernel was created through the global cooperative efforts of people working
    through the Internet, led by Linus B. Torvalds of Finland. The first version of
    Linux was released on October 5, 1991, and its daily evolution has continued since
    ever. The term Linux originally referred to just the kernel of the OS. In reality,
    however, when you install Linux you are also installing a set of basic utilities
    and applications that, combined, allow Linux to be used as a Unix-style OS. This
    is called a Linux distribution, and there are many different distributions available
    throughout the world. Generally, when you say Linux you are not referring to the
    kernel alone but to the kernel plus the GNU OS as packaged in one or the other
    of these distributions. There are many basic distributions available, and each
    has made improvements to the installation base and enhanced ease of use. Derivatives
    of these distributions also exist in languages of various countries. The most
    widely used distributions in the United States are Red Hat, Slackware, and Debian
    and their derivatives such as Caldera, Mandrake, SuSE, TurboLinux, and Storm Linux.


    # Free Software And Open Source


    Some Unix applications are open-source software (OSS)—the source code is publicly
    available—but most are proprietary. Most Linux applications, on the other hand,
    are OSS. There are a number of criteria for the distribution of OSS, as explained
    in the Open Source Definition (OSD).

    Open source programs are publicly available, and permission is granted to anyone
    to modify these programs. The software itself is usually available at no cost.
    The acquired programs can be improved and distributed in accordance with the licensing
    provisions, making it possible for people to join in the continued development
    of these programs, thereby improving their quality. Nearly all of the many tools
    required to use Linux and the applications that run on Linux are OSS and are licensed
    in accordance with the conditions stipulated in the first and most popular of
    the licenses for free software, the General Public License (GPL) of the Free Software
    Foundation (FSF), written by Richard M. Stallman.


    ```

    OSD         www.opensource.org

    GNU (FSF) www.gnu.org

    ```'
