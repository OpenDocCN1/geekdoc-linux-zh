  md: '# Understanding The Relationship Between IP Addresses And Domain Names


    # Domain Name System/Service (DNS)


    Host names are given to computers and devices on the Internet and are different
    from IP addresses. An easily remembered host name can be used in place of the
    series of numbers that is the IP address, which is difficult to remember. Just
    like an IP address, a host name specifies computers and devices on the Internet.


    You may specify either a host name or an IP address, and it is possible to convert
    one to the other. A server on the Internet with a database to handle this conversion
    is called a Domain Server/Service (DNS) server, or name server.


    # Host Names And Domain Names


    The domain name identifies the network to which a computer or device belongs.
    When a particular name is given to that computer or device, this, together with
    the domain name, makes up the host name, also called the fully qualified domain
    name (FQDN). A host name or FQDN has two portions: the domain portion that shows
    network affiliation and the host portion that shows the name of the computer or
    device. For example, in www.yourcoolcompany.com, the domain name (domain portion)
    is yourcoolcompany.com and the computer name (host portion) is www.


    ![](img/17f00f03278f20a01f42454f91fb48b8_43_0.png)


    > The computer or device that has an assigned IP address.


    A host name combines the name of the host computer with the domain name to identify
    a computer or device on the Internet.


    There is a difference between the host name and the domain name, although they
    belong to the same entity.


    Formally, a dot (.) is spaced here but it is normally omitted.


    # www.yourcoolcompany.com'
