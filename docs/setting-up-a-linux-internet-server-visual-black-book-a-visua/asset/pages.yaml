  md: '# # How Web Pages Are Displayed


    # ## Apache


    Various Web browsers such as Netscape Communicator or Internet Explorer are available
    for displaying Web pages. All of these browsers display the contents of pages
    they receive from Web servers.

    This chapter describes Apache, the most widely used Web server on the Internet
    today.


    Apache sets a specific directory in Linux as the document root (a root directory
    for Web pages) and exhibits the directory tree within the document root as the
    Web page directory tree.


    # ## How Web Pages Are Displayed


    When a Uniform Resource Locator (URL) is specified in a Web browser, the Web browser
    accesses the Web server specified by the URL, and displays the page on the screen.
    If images or other items are embedded in the Web page, the Web server displays
    these images by having them transferred one at a time in the same way as it did
    the Web page.


