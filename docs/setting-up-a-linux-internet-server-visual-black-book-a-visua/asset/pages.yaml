  md: '# # Protecting Your Internet Server From Unauthorized Access


    # ## Security


    Because an Internet server is always connected to the Internet, it is exposed
    to attacks by crackers (people who access computers illegally). If you are not
    careful enough concerning security (because remote operations are easily performed
    in Linux), your machine may be used as a stepping stone for attacking another
    site.


    This section covers a variety of topics, ranging from general background information
    to methods of actually restricting access to protect your Internet server from
    attacks by crackers.


    # ## What Is Security?


    When you have a computer or device connected to the Internet, you must think about
    security. An Internet server is exposed to serious danger because it can always
    be accessed from anywhere on the Internet. Attacks on servers come in a variety
    of types and gradations.


    # ### Intrusion


    This type of attack includes stealing private or confidential information, arbitrarily
    changing or deleting data, and changing configuration settings. An intrusion attack
    may also prevent you from being able to configure security measures by rewriting
    configuration programs to facilitate the next intrusion.


    # ### Using A Site As A Stepping Stone For Attacking Another Site


    To protect your identities, crackers often plan an attack on one site via multiple
    sites they have penetrated so that either no trail remains or the trail is too
    complex to follow.


    # ### Denial Of Service


    This type of attack halts service. There are various types of Denial Of Service
    (DoS) attacks. Usually, a DoS attack produces an unnatural condition, and there
    seem to be many elaborate ones that probe for weaknesses to exploit.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# 10.1 Protecting Your Internet Server From Unauthorized Access


    # Security Holes


    A cracker can launch an attack by striking at a weak point in a server''s security
    setup. This weak point is called a security hole. Security holes can be broadly
    divided into two main types: holes caused by administrator negligence or mis-configuration,
    and holes caused by problems in the server.


    +   * Administration- or configuration-related security holes


    Actions: Check the configuration files again, and do not run services that are
    not needed.


    +   * Software-related security holes


    Actions: Pay attention to update information and upgrade the software version
    immediately if any problems are detected. This is just plain common sense. Remember
    not to run servers or services that you are not using. It would be a waste of
    time and effort to worry about the security of these unused servers and services.
    You would probably not want to upgrade the versions of these servers constantly
    even if a security hole were known. You may not need to use all of the servers
    described in this book.


    The server administrator should institute security measures in the following ways:


    +   * Restrict access (prevents access before reaching the server).

    * Encrypt passwords (prevents access by someone impersonating a user).

    * Upgrade software versions (eliminates security holes due to software bugs).

    * Check logs (monitors suspicious accesses).


    # When A Server Is Not Protected By Security


    # When A Server Is Protected By Security


    ![](img/17f00f03278f20a01f42454f91fb48b8_200_0.png)


    179'
