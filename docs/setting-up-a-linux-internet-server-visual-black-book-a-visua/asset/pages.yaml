    linux.corel.com


    this is the major (open-source) distribution, the distribution par excellence
    for true true of Linux. It is easy to update, and it lets the system administrator
    become involved in the distribution. You can use the development (unstable-) or
    the latest distribution. The biggest problem with Debian is that the stable distributions
