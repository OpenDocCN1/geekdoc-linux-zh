  md: '# About The Authors


    Hidenori Tsuji

    The Linux and Unix operating systems are Hidenori''s life; not only in his everyday
    research, but also in his part-time jobs. Presently pursuing a Ph.D. at Tokyo
    University researching next-generation high-per-formance microprocessor architecture,
    he supports himself with various part-time work, including managing Unix workstations,
    configuring networks, programming, and writing books. He has written books including
    Setting Up a Linux Intranet Server (Impress Press) and A Practical Guide to Dial-Up
    Routers (Softbank Press).


    Hidenori Tsuji E-mail: hide@hide.net


    Takashi Watanabe


    Takashi Watanabe started in the computer world by spending half of his time at
    elementary school writing frustratingly dysfunctional sample programs in FamilyBasic.
    After trying with N88BASIC and MS-DOS, in 1996 he made the move to Linux. At present,
    he is a graduate student at Waseda University and uses Linux at home and Solaris
    and FreeBSD at school. His favorite programming function is getop_long. His main
    pastime is playing with the search engine Verno.

    Verno: http://verno.ueda.info.waseda.ac.jp/

    E-mail: watanabe@hide.net


    Acrobyte

    Acrobyte''s focus is on PC-related books and magazines, but it is also involved
    in various projects, from software development and production of multimedia content
    right through to installing OS systems and assembling servers for clients. Acrobyte
    is based in Akihabara in Tokyo. It supervised the translation of Windows 98 Bible,
    Windows 98 Bible Professional, Windows 98 Secrets, Windows 98 Registry Blackbook,
    and the Can-do PC for Windows 98 (all by Impress Press).

    URL: www.acrobyte.co.jp/'
