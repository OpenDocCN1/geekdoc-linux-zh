  md: '# When An ATAPI CD-ROM Drive Is Not Recognized


    Some ATAPI CD-ROM drives (for example, PIONEER DR-A24X) aren''t recognized automatically
    by Linux. You can enable such a CD-ROM drive by specifying that it is a CD-ROM
    drive at the boot prompt that is displayed when the installer is started.


    Example: When the CD-ROM drive is connected to a primary slave (hdb)


    ```

    boot: hdb=cdrom hdb=noprobe

    ```


    Example: When the CD-ROM drive is connected to a secondary master (hdc)


    ```

    boot: hdc=cdrom hdc=noprobe

    ```


    After you have completed the installation, if you want to use a CD-ROM drive that
    must be be specified as a boot option parameter during the LILO installation in
    step 25 shown on page 73.


    # Booting Problems After Installation


    LILO is used to boot Linux. If LILO is operating properly, the word "LILO" is-played
    before Linux is booted. If you type "linux" at this prompt, Linux starts. Alternatively,
    Linux boots after five seconds if nothing is entered. If Linux doesn''t boot after
    installation, LILO is usually the culprit.


    The Install Program Starts (No LILO Prompt)

    This happens when Linux is booted from the floppy disk or CD-ROM. Remove the floppy
    disk or CD-ROM and then press Ctrl + Alt + Delete to reboot.


    No LILO Prompt And "No Boot Device" Is Displayed (Message Differs Depending On
    Computer Model)

    This happens if no boot flag was assigned when the hard disk partitions were created.
    Start the install program again and use a command to assign a boot flag to the
    partition (/dev/hda2 in the example in this book) that was allocated to the system
    root directory(//) in step 10 of the fdisk procedure shown on page 65. Then use
    the command to write the change, exit fdisk, and press Ctrl + Alt + Delete to
    reboot.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# The LILO Prompt Is Only Partially Displayed And Digits Are Displayed And
    Stopped


    In almost all cases, this happens when LILO cannot recognize the boot disk information
    correctly. Although there is no definite way to resolve this problem, selecting
    the Linear Mode global option in step 25 of the LILO installation procedure shown
    on page 73 may enable LILO to boot successfully.


    # Linux Still Will Not Boot


    Linux may boot properly if you use the Install program to create the boot disk
    that was not created in step 23 shown on page 72. In this case, if you insert
    the created boot disk in the floppy drive and turn on the power, the LILO prompt
    appears. If you type "linux" at this prompt or wait 10 seconds, Linux starts to
    boot. After the login screen is displayed, you can remove the floppy disk. If
    this method does not work, try to install Linux again from the beginning. If this
    doesn''t work, determine whether Linux can be used on your PC.'
  merge: -1
