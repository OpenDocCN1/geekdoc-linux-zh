  md: '# 2.4 Understanding Domain Names


    # Attribute Type Domain Names And Location Type Domain Names


    A domain name that uses two letters to represent the type of organization in the
    second level of the domain name (as in the .jp domain) is called an attribute
    type domain name. A domain name can also have the name of a geographic location
    as its second level label which is known as a location type domain name. A location
    type domain name represents the names of prefectures (as in Japan), or of the
    names of cities or towns, using the actual geographic names as the label in the
    domain name. These appear to the left of the two-letter country code, such as
    .jp.


    A location type domain name can be obtained by those who are not classified as
    organizations, such as private individuals. For example, when a person resides
    in the Chiyoda ward of Tokyo wants to obtain a domain name, he or she would belong
    to chiyoda.tokyo.jp.


    ![](img/17f00f03278f20a01f42454f91fb48b8_42_0.png)


    # ---.chiyoda.tokyo.jp


    |Organization label

    This part identifies a group or an individual and can be freely used for private
    individual or company names.


    |City, town, ward label

    This part identifies the city, town, or ward following the prefecture where the
    applicant of the domain name resides.


    |Prefecture, district label

    This part identifies the location of the applicant of the domain name.


    # Domain Names Not Differentiated By Country


    Although the top level of a domain name was described as identifying a country
    by means of a two-letter code, domain names exist that omit the name of a country
    and assign an organizational classification to the top level. This type of domain
    name is often used in the U.S., where the Internet originated. For example, using
    "yourcoolnetwork.net", ".net" doesn''t represent the name of a country but rather
    a domain that identifies a network service. These types of domains that do not
    belong to any particular are managed by an organization InterNIC (www.internet).
    InterNIC lists accredited registrars as (www.networksolutions.com) and many others
    throughout the world.


    |Second level

    In this case, because the top level indicates the type of organization, you can
    apply for any name you want for this portion.


    ![](img/17f00f03278f20a01f42454f91fb48b8_42_1.png)


    |Top level

    This portion represents the type of organization using a combination of three
    letters.


    ```

    yourcoolnetwork.net

