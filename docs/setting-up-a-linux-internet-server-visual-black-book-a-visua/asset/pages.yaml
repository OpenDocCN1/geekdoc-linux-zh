  md: '# STEP UP


    # Aware Of The Limitations Of Your Connection


    Besides being able to configure a Web server freely on the Internet server that
    you have constructed yourself, you can also run various programs by means of a
    common gateway Interface (CGI) or small scale integrated (SSI) circuit and provide
    as much content as your disk capacity allows. Instead of thinking that you have
    a completely unrestricted Web server, however, keep in mind that there are limitations
    to the amount of data your line can handle.


    For example, consider the case of a 128Kbps fractional T1 leased line. With a
    line speed of 128Kbps, the maximum amount of data that can be transferred per
    second is 16K (=128Kbps/8 bits). If an image that 1MB (=1024K) in size is placed
    on the Web site and on the Internet to view it, it takes at least 64 seconds (=1024K/16K)
    to transfer it. Moreover, if this image is accessed by many people simultaneously,
    the transfer time increases relative to the time for a single person by the number
    of accesses. Of course, not all of your Web pages will be as big as 1MB. On the
    other hand, there will be more than one person accessing the site that will receive
    large numbers of hits, it may prove difficult at a bandwidth of only 128Kbps.


    One advantage of a fractional T1 leased line is the case at which it can be scaled
    up to greater bandwidth. You may increase your 128Kbps bandwidth as much as 12
    times before reaching the limits of a T1 line without changing your digital service
    unit (DSU) or routing equipment. Increased bandwidth will cost more per month,
    consider consider two important factors with regard to bandwidth: the size of
    the Web pages, including images and other items used within, and the number of
    accesses. Small Web page files can be accessed reasonably often without a problem,
    but large files are acceptable only if they are accessed infrequently. If they
    are accessed frequently, the line bandwidth may have to increase. If you are thinking
    about developing a Web server, a permanent connection may be provided by an Integrated
    Services Digital Network (ISDN) line or a 128Kbps fractional T1 may be acceptable
    only as a first step. If your site is successful in generating a great number
    of hits or if your content files are usually large, you will probably need to
    increase the bandwidth of your permanent connection before longer. Unless you
    require full, hands-on control over the configuration of your Web server and the
    content that it serves, you may consider renting your Web server services from
    an Internet provider (ISP).


