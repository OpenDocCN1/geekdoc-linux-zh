  md: '# Getting Permanently Connected


    # How To Choose A Line


    To use an Internet server, it must be permanently connected to the Internet. Permanent
    connections vary from one location to another and differ widely in price and quality
    of service. In the end, it is up to you to decide which type of connection best
    fits your specific situation. In this book, we will use a T1 or fractional T1
    (FT1) leased line as an example of one approach.


    # The Higher The Speed, The Higher The Price


    A number of different types of permanent connections are available, but in particular
    location, the choice may be limited. At any given location, the higher the speed
    you receive, the higher the price you pay for that connection. Generally, the
    better the quality and speed of service you will receive at a given price, however,
    varies widely from location to location. Better quality usually means higher speed,
    but it doesn''t necessarily free to the rated speed. For example, a cable connection
    may not deliver its full rated speed when it is shared by many others. A good
    quality connection provides its rated speed, or very close to it, any time of
    day or night.


    # What Is A Dedicated Line?


    A dedicated line is a permanent line that is set up for the exclusive use of connecting
    a particular user to the ISP. Unlike a cable modem connection and dial-up line,
    it is not a shared line. The speed is guaranteed between the user and the ISP.
    A dedicated line usually refers to a leased line with speeds ranging from 56Kbps
    to 1.54Mbps (T1) or even 45Mbps (T3). Fractional T1 lines (at 128, 256, 384, 512Kbps,
    and so forth) are also available. If cost is the controlling factor, investigate
    a digital subscriber line (DSL). The most common is asymmetrical DSL, where the
    upload speed is slower than the download speed. For an Internet server, make that
    your agreement with your DSL provider allows for the connection of name servers,
    Web servers, mail servers, FTP servers, and so on to your DSL line and that you
    can obtain the necessary minimum number of IP addresses. Agreements for leased
    T1 or FT1 lines, assume that the user will be connecting various Internet services
    to the line. The critical difference between a dedicated line and the other types
    of permanent connections is the guaranteed bandwidth. Both lines allow you to
    be connected all the time, only the dedicated line guarantees the constant availability
    of a certain amount of bandwidth. For this, you pay more.'
  merge: -1
