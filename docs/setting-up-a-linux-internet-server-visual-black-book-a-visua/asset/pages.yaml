  md: "# Understanding The Difference Between Base 2 And Base 10 Numbers\n\nPeople\
    \ use decimal (Base 10) numbers when counting things. Computers, however, are\
    \ based on the binary number system (Base 2). A computer operates on electricity.\
    \ Inside a computer, the only decision that can be made is whether or not electricity\
    \ is flowing. A state in which electricity is not flowing is 0, a state in which\
    \ a 0 or a 1 exists is the digital world of binary numbers. Computers express\
    \ all numerical values as 0 or 1.\n the Base 10 number system, there are 10 numbers\
    \ (0 to 9). When counting beyond 9, a digit is carried over.\n the binary number\
    \ system, there are only two numbers (0 and 1), so the digit carries over quickly.\
    \ If this is understood, the binary number system is not difficult.\nFurthermore,\
    \ because only 0 and 1 exist in the binary number system, the number of digits\
    \ increases rapidly. One digit in the binary number system is a bit. When you\
    \ hear someone say, \"32 bits\" or \"64 bits,\" these bits represents a numeric\
    \ value of 32 digits in the binary number.\n\n# Converting From Base 2 To Base\
    \ 10\n\nLet's examine the correspondence of each digit in a binary number system\
    \ to the value of a digit in a Base 10 number system. You can see from the table\
    \ that each time a carry doubles itself (increases by two), i.e., if the nth digit\
    \ is 1, then $2^{n-1}$.nWhen converting binary numbers to Base 10, the corresponding\
    \ Base 10 number can be found by adding the decimal value (see table) of all of\
    \ the non-zero binary digits, as in the following example.\n\n| 0 = 0 |\n| 1 =\
    \ 1 |\n| 2 = 2 |\n| 3 = 11 |\n| 4 = 100 |\n| 5 = 110 |\n| 6 = 111 |\n| 8 = 1000\
    \ |\n| 9 = 1001 |\n| 10 = 1010 |\n\n| 1 = 1 |\n| 10 = 2 |\n| 100 = 4 |\n| 1000\
    \ = 8 |\n| 10000 = 16 |\n| 100000 = 32 |\n| 1000000 = 64 |\n| 10000000 = 128 |\n\
    \n```\n10000000\n\n1 1 0 0 0 0 0 1\n128 64 32 16 8 4 2 1\nII\n128 + 64 + 0 + 0\
    \ + 0 + 0 + 0 + 0 = 192\n```"
