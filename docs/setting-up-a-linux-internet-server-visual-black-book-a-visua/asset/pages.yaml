    - pwd: Displays the current (present working) directory.


    # Exiting


    +   - quit, or by exit: Exits ncfftp.

    - close: Closes the connection.


    # Discovering An Unauthorized


    Looking at logs isnt a definitive means of discovering unauthorized access. If
    an intrusion has actually occurred and the root authority has been taken over,
    the intruder will probably have destroyed all traces. There will be nothing to
    be discovered, even if you inspect the logs. Looking at logs, however, is effective
    in discovering illegal access, which precedes unauthorized intrusion and occurs
    before the root authority has been usurped. If anything seems suspicious, check
    the access logs first.


    ```

    /var/log/boot.log      Log of the starting and stopping of daemons.

    /var/log/cron         Log of cron (daemon for routinely executing commands).

    /var/log/dmesg       Kernel messages.

    /var/log/mailog      Log of Sendmail or imapd.

    /var/log/messages    Log of Berkeley Internet name domain (BIND), the kernel,
    su, or the like.

    /var/log/secure      Login records or log of tcpd.

    ```


