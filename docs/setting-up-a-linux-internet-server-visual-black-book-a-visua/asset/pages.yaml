  md: '# # Appendix F Linux Resources: Web Sites, Mailing Lists, News Feeds


    The amount of Web-based information on Linux grows by leaps and bounds every day.
    Here are some of the best:


    +   - slashdot.org


    ![](img/17f00f03278f20a01f42454f91fb48b8_232_0.png)


    +   - linuxjournal.com


    ![](img/17f00f03278f20a01f42454f91fb48b8_232_1.png)


    This is the main portal for Linux aficionados and geeks in general. If you have
    enough time to check out one Site to keep up to date on news and issues, this
    is the place.


    This is the home page of the print edition of the Linux Journal. It offers the
    chance to take a look at what is happening in the hard-copy magazine, in addition
    to providing information that is strictly online. An example of the online-only
    content is a column called ''The Rocky'', which does an excellent job of distilling
    the Linux-related news stories into a few sentences.


    +   - linuxworld.com


    +   - linuxgazette.com


    ![](img/17f00f03278f20a01f42454f91fb48b8_232_2.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_232_3.png)


    This site has very good and frequent feature articles about Linux, especially
    about how Linux is used in practical applications. It''s a good place to find
    reviews of commercial software that was written or ported to Linux. The nice thing
    is the interactive discussion that it runs as a standard regexp-basedgroup or
    news reader (i.e., you don''t have to sign up, subscribe, or come up with a password,
    just click and post). The whole online magazine is under the competent and careful
    editorial of Nicholas Pet, who also writes for Info Magazine.


    Published by the Linux Journal, articles that appear here are also included in
    the Debian/GNU Linux distribution. A master index to all of the tables of contents
    as well as a search engine is available. Make this site a first stop for your
    research on Linux.'
